source:
  edition: WLC
  text: וְ/הַ/שֹּׁעֲרִים֙ שַׁלּ֣וּם וְ/עַקּ֔וּב וְ/טַלְמֹ֖ן וַ/אֲחִימָ֑ן וַ/אֲחִי/הֶ֥ם שַׁלּ֖וּם הָ/רֹֽאשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: te
  text: ద్వారపాలకులు షల్లూము, అక్కూబు, తల్మోను, అహీమాను, వారి సోదరులు కూడా. వారిలో షల్లూము ప్రధానుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘వారి సోదరులు’ అని ఉంది. ఇలాంటి జాబితాల్లో ఇది రక్తసంబంధ సోదరులనో, అదే వంశానికి చెందిన సహచరులనో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ద్వారాలను కాపాడే బాధ్యత పొందినవారిని సూచిస్తుంది. ఆలయ సందర్భంలో ఇది సహజమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: עַקּוּב
  choice: అక్కూబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: טַלְמֹן
  choice: తల్మోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֲחִימָן
  choice: అహీమాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֲחִיהֶם
  choice: వారి సహోదరులు
  rationale: ఈ జాబితా సందర్భంలో కుటుంబ లేదా వంశ సంబంధిత సహచరులను సూచించే విస్తృత భావంతో తీసుకున్నాం. అయితే మసొరెటిక్ స్వరచిహ్నాల ప్రకారం రూపం వ్యాకరణపరంగా ఏకవచనంగా కూడా అర్థమవుతుంది; ఆ సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: ఇక్కడ רֹאשׁ శరీర భాగాన్ని కాకుండా నాయకత్వ హోదాను సూచిస్తుంది; ‘ప్రధానుడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְ...וְ...וַ...וַ
  choice: '..., ..., ..., అలాగే ...'
  rationale: హీబ్రూలోని పునరుక్త సంధులను సహజమైన తెలుగు జాబితా నిర్మాణంగా మార్చి, చివరి అంశానికి ‘అలాగే’ ద్వారా సముచ్చయ భావాన్ని నిలిపాం.
