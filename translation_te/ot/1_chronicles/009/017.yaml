translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యక్తినామాలకు తెలుగు బైబిల్ వాడుకకు అనుకూలమైన హీబ్రూ-ఆధారిత లిప్యంతరీకరణను ఉపయోగించాం. మూలంలోని చివరి భాగానికి ఉన్న సంఖ్యా/వ్యాకరణ సందిగ్ధతను ప్రధాన వాక్యాన్ని భారంగా చేయకుండా పాదటిప్పణిలో తెలిపాం.
