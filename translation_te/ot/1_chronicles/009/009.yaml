translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘వంశావళులు,’ ‘పితృకుటుంబాలు’ వంటి పదాలు మూలంలోని వంశపరమైన నిర్మాణాన్ని స్పష్టంగా ఉంచుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు సహజంగా ఉండేలా మలిచాం.
