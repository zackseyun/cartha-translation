source:
  edition: WLC
  text: וַ/אֲחֵי/הֶם֙ לְ/תֹ֣לְדוֹתָ֔/ם תְּשַׁ֥ע מֵא֖וֹת וַ/חֲמִשִּׁ֣ים וְ/שִׁשָּׁ֑ה כָּל אֵ֣לֶּה אֲנָשִׁ֔ים רָאשֵׁ֥י אָב֖וֹת לְ/בֵ֥ית אֲבֹתֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: te
  text: వారి సహోదరులు[a] తమ వంశావళుల ప్రకారం తొమ్మిది వందల యాభై ఆరుగురు. వీరందరూ తమ తమ పితృకుటుంబాల వంశపెద్దలు[b] అయిన పురుషులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “సహోదరులు” అనే హీబ్రూ పదం విస్తృతార్థంలో బంధువులను లేదా అదే వంశానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పితృకుటుంబాల వంశపెద్దలు” అనేది పితృవంశ ఆధారిత కుటుంబ లేదా గోత్ర విభాగాల నాయకులను సూచించే వంశావళి పదబంధం.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: אָח అనే పదానికి ప్రాథమిక అర్థం ‘సహోదరుడు’; వంశ లేదా గోత్ర సందర్భంలో అది బంధువులను లేదా అదే వంశానికి చెందినవారిని కూడా సూచించవచ్చు. మూలంలోని బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: לְתֹלְדוֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: దినవృత్తాంతాల వంశపట్టిక సందర్భంలో תּוֹלְדוֹת అనేది తరాల వరుసను లేదా వంశ నమోదు వివరాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశావళుల ప్రకారం’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: తొమ్మిది వందల యాభై ఆరుగురు
  rationale: హీబ్రూ సంఖ్యను యథార్థంగా తెలుగులో వ్యక్తుల లెక్కకు తగిన ‘ఆరుగురు’ రూపంతో అనువదించాం.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: వీరందరూ ... పురుషులు
  rationale: ఇక్కడ אֲנָשִׁים వంశపట్టికలో పేర్కొన్న పురుషులను సూచిస్తుంది; అందువల్ల లింగనిర్దిష్టమైన ‘పురుషులు’ను నిలిపాం.
- source_word: רָאשֵׁי אָבוֹת לְבֵית אֲבֹתֵיהֶם
  choice: తమ పితృకుటుంబాలకు పెద్దలు
  rationale: ఈ సంయుక్త పదబంధం పితృవంశ ఆధారిత కుటుంబ లేదా గోత్ర విభాగాల నాయకులను సూచిస్తుంది. హీబ్రూలోని పునరుక్తిని యాంత్రికంగా అనుకరించకుండా, దాని సామాజిక-వంశపరమైన భావాన్ని తెలుగులో స్పష్టంగా అందించాం.
