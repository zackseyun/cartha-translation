id: 1CH.9.28
reference: 1 Chronicles 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵ/הֶ֖ם עַל כְּלֵ֣י הָ/עֲבוֹדָ֑ה כִּֽי בְ/מִסְפָּ֣ר יְבִיא֔וּ/ם וּ/בְ/מִסְפָּ֖ר יוֹצִיאֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: te
  text: వారిలో కొందరు సేవలో ఉపయోగించే పాత్రల[a] బాధ్యతను వహించారు; ఎందుకంటే వాటిని లెక్క ప్రకారం లోపలికి తెచ్చేవారు, లెక్క ప్రకారం బయటికి తీసుకెళ్లేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకు సంబంధించిన ఉపకరణాలు’ లేదా ‘సేవలో ఉపయోగించే పనిముట్లు.’ హీబ్రూ పదం పాత్రలు, పనిముట్లు లేదా ఇతర ఉపకరణాలను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: వారిలో కొందరు
  rationale: מִן ప్రత్యయంతో కలిసి ముందుగా పేర్కొన్న గుంపులోని కొందరిని సూచిస్తుంది; తెలుగులో ‘వారిలో కొందరు’ సహజంగా ఆ భాగార్థాన్ని తెలియజేస్తుంది.
- source_word: עַל
  choice: బాధ్యత వహించారు
  rationale: వ్యక్తులు ఒక పని లేదా వస్తువులపై పర్యవేక్షణ, బాధ్యత కలిగి ఉండడాన్ని עַל సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన పరిపాలనా ప్రయోగం.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: సేవలో ఉపయోగించే పాత్రలు
  rationale: כְּלִי అనేది పాత్రలు, పనిముట్లు, ఉపకరణాలు అనే విస్తృతార్థ పదం; ఆలయ సందర్భంలో הָעֲבוֹדָה సేవను సూచిస్తుంది. ఈ అనువాదం పదాన్ని మరీ సంకుచితం చేయకుండా సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు ఆ బాధ్యతలో ఉన్నారనే విషయానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: בְמִסְפָּר
  choice: లెక్క ప్రకారం
  rationale: వస్తువులను ఖచ్చితంగా లెక్కించి అప్పగించడం, తిరిగి స్వీకరించడం అనే జాబితా-నిర్వహణ భావాన్ని తెలియజేస్తుంది.
- source_word: יְבִיאוּם
  choice: వాటిని లోపలికి తెచ్చేవారు
  rationale: בוא హిఫీల్ రూపం ‘లోపలికి తీసుకురావడం’ అని అర్థం; అసంపూర్ణ క్రియారూపం ఇక్కడ అలవాటుగా జరిగే విధిని సూచిస్తుందని తెలుగులో ‘తెచ్చేవారు’తో వ్యక్తమవుతుంది.
- source_word: יוֹצִיאוּם
  choice: వాటిని బయటికి తీసుకెళ్లేవారు
  rationale: יצא హిఫీల్ రూపం ‘బయటికి తీసుకురావడం/తీసుకెళ్లడం’ అని అర్థం; మొదటి క్రియకు సమాంతరంగా నిత్య విధిని సూచిస్తుంది.
