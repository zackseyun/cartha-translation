  - severity: low
    issue: The draft renders the repeated Hebrew head-term with two different concepts (‘అధిపతులు’ and ‘ముఖ్యులు’).
    rationale: The repetition is meaningful in the source. Repeating ‘పెద్దలు’ is natural enough in Telugu and reflects the Hebrew more transparently.
