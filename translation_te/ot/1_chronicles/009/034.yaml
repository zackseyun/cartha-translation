  terminology: ‘పితృకుటుంబాలు’ accurately conveys clan/ancestral-family units. ‘పెద్దలు’ naturally renders the social sense of רָאשֵׁי/רָאשִׁים without importing a stronger administrative title such as ‘అధిపతులు.’
