  edition: WLC
  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: te
  text: వీరు లేవీయుల పితృకుటుంబాల పెద్దలు; వారి వంశక్రమాల ప్రకారం వీరు పెద్దలు.[a] వీరు యెరూషలేములో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘పెద్దలు’ అని అనువదించిన పదమే ఈ వాక్యంలో రెండుసార్లు వచ్చి, వారి ప్రధాన స్థానాన్ని నొక్కిచెబుతుంది. ‘పితృకుటుంబాలు’ అనేది వ్యక్తిగత ఇళ్లను మాత్రమే కాక, వంశాధారిత కుటుంబ విభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాలకు అధిపతులు
  rationale: దినవృత్తాంతాల్లో ఈ పదబంధం వ్యక్తిగత గృహాలను కాకుండా పూర్వికుని ఆధారంగా ఏర్పడిన వంశ లేదా గోత్ర కుటుంబ విభాగాలను సూచిస్తుంది. ‘పితృవంశాలు’ ఆ సామాజిక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయుల
  rationale: ఇక్కడ ל ఉపసర్గ సంబంధం లేదా వర్గీకరణను సూచిస్తుంది; ఈ పితృవంశాలు లేవీయులకు చెందినవని తెలుగులో షష్ఠీ విభక్తి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְתֹלְדוֹתָם
  choice: తమ వంశావళుల ప్రకారం
  rationale: תּוֹלְדוֹת వంశపారంపర్య క్రమాన్ని లేదా తరాలను సూచిస్తుంది. సందర్భం వంశసంబంధమైనది కాబట్టి ‘వంశావళుల ప్రకారం’ స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా ఉంటుంది.
- source_word: רָאשִׁים
  choice: ముఖ్యులు
  rationale: ముందున్న רָאשֵׁי మూలాన్నే మళ్లీ వాడి వారి ప్రముఖ స్థానాన్ని నొక్కిచెబుతుంది. తెలుగులో అసహజమైన పదపునరుక్తిని తగ్గిస్తూ ఆ భావాన్ని ‘ముఖ్యులు’ నిలుపుతుంది.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ఈ సందర్భంలో క్రియ స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసించారు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: בִירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలవాచక ב ఉపసర్గకు సహజమైన తెలుగు సప్తమీ రూపం.
