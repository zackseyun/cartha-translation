  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ఆలయ సేవల సందర్భానికి తగిన ‘యాజకులు,’ ‘సుగంధ ద్రవ్యాలు’ వంటి పరిచిత పదాలు వాడబడ్డాయి; మూలంలోని లెక్సికల్ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
