translation:
  language: te
  text: యాజకుల కుమారుల్లో కొందరు సుగంధ ద్రవ్యాల మిశ్రమాన్ని తయారుచేసేవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సుగంధ ద్రవ్యాల కోసం పరిమళ మిశ్రమాన్ని తయారుచేసేవారు.”
    reason: לַבְּשָׂמִים లోని సంబంధం ‘సుగంధ ద్రవ్యాల మిశ్రమం’ అని గానీ, ‘సుగంధ ద్రవ్యాల కోసం సిద్ధం చేసిన పరిమళ మిశ్రమం’ అని గానీ అర్థమవవచ్చు.
lexical_decisions:
- source_word: וּמִן
  choice: కొందరు
  rationale: జాబితా సందర్భంలో מן యొక్క భాగార్థాన్ని సహజమైన తెలుగులో ‘కొందరు’ అని వ్యక్తం చేస్తుంది; וְ యొక్క అనుసంధాన భావం వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: యాజకుల కుమారుల్లో
  rationale: దినవృత్తాంతాల వంశసంబంధ భాషను నిలుపుతూ, מן తో ఉన్న భాగార్థానికి సరిపోయే రూపం.
- source_word: רֹקְחֵי
  choice: తయారుచేసేవారు
  rationale: ఈ కృదంతం పదార్థాలను నైపుణ్యంతో కలిపి మిశ్రమం సిద్ధం చేసేవారిని సూచిస్తుంది. ‘తయారుచేసేవారు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, కేవలం కలపడానికే భావాన్ని పరిమితం చేయదు.
- source_word: הַמִּרְקַחַת
  choice: మిశ్రమాన్ని
  rationale: ఈ నామవాచకం కలిపి సిద్ధం చేసిన పదార్థాన్ని సూచిస్తుంది. దాని రూపం లేపనమా, పరిమళ మిశ్రమమా అన్నదాన్ని హెబ్రీ పాఠం పూర్తిగా నిర్దిష్టం చేయనందున ‘మిశ్రమం’ తటస్థమైన ఎంపిక.
- source_word: לַבְּשָׂמִים
  choice: సుగంధ ద్రవ్యాల
  rationale: בְּשָׂמִים సువాసనగల పదార్థాలను సూచిస్తుంది. ఇక్కడ לְ ను మిశ్రమానికి సంబంధించిన పదార్థం/ఉద్దేశాన్ని తెలిపేదిగా సహజమైన తెలుగు సంబంధరూపంలో ఇచ్చాం.
