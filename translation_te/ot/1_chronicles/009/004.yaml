source:
  edition: WLC
  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: te
  text: యూదా కుమారుడైన పెరెసు వంశస్థులలోని బానీ కుమారుడు ఇమ్రీ కుమారుడు ఒమ్రీ కుమారుడు అమ్మీహూదు కుమారుడు ఊతై.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇక్కడి హీబ్రూ పాఠ సంప్రదాయం క్లిష్టంగా ఉంది. “బానీ” అని అనువదించిన పదాన్ని “నుండి” అని కూడా చదవవచ్చు. అలా చదివితే: “ఇమ్రీ కుమారుడు ఒమ్రీ కుమారుడు అమ్మీహూదు కుమారుడు ఊతై, యూదా కుమారుడైన పెరెసు వంశస్థులలోనివాడు” అని వస్తుంది. వరుసగా వ్యక్తుల పేర్లు ఉన్న వంశావళి నిర్మాణానికి సరిపోవడం వల్ల ప్రధాన పాఠంలో “బానీ” అనే పేరును అనుసరించాం.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: ఊతై
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి వరుసలో మూలంలోని ‘కుమారుడు’ అనే సంబంధాన్ని నిలిపాం; ఇలాంటి వంశావళుల్లో మధ్య తరాలు వదిలివేయబడే అవకాశం ఉంటుంది.
- source_word: עַמִּיהוּד
  choice: అమ్మీహూదు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: עָמְרִי
  choice: ఒమ్రీ
  rationale: హీబ్రూ వ్యక్తి పేరును సాధారణ తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: אִמְרִי
  choice: ఇమ్రీ
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు లిపిలో ఇచ్చాం.
- source_word: בני/מן
  choice: బానీ
  rationale: వంశావళిలో వరుసగా పేర్లు రావడం వల్ల దీనిని వ్యక్తి పేరుగా చదివాం; ‘నుండి/లో’ అనే ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּנֵי
  choice: వంశస్థులలో
  rationale: కుల లేదా వంశ సంబంధాన్ని తెలిపే సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘వంశస్థులు’ అని అనువదించాం.
- source_word: פֶּרֶץ
  choice: పెరెసు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు లిపిలో ఇచ్చాం.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: వ్యక్తి మరియు గోత్ర మూలపురుషుని పేరుకు స్థిరమైన తెలుగు రూపాన్ని వాడాం.
