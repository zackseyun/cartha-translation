source:
  edition: WLC
  text: וּ/לְ/אָצֵל֮ שִׁשָּׁ֣ה בָנִים֒ וְ/אֵ֣לֶּה שְׁמוֹתָ֗/ם עַזְרִיקָ֥ם בֹּ֨כְרוּ֙ וְ/יִשְׁמָעֵ֣אל וּ/שְׁעַרְיָ֔ה וְ/עֹבַדְיָ֖ה וְ/חָנָ֑ן אֵ֖לֶּה בְּנֵ֥י אָצַֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: te
  text: 'ఆజేలుకు ఆరుగురు కుమారులు ఉన్నారు. వారి పేర్లు: అతని జ్యేష్ఠ కుమారుడైన అజ్రీకాము, ఇష్మాయేలు, షెయర్యా, ఓబద్యా, హానాను. వీరు ఆజేలు కుమారులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: ఆజేలుకు ఆరుగురు కుమారులు ఉన్నారు
  rationale: లְ ఉపసర్గతో ఉన్న హెబ్రీ వంశావళి సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో స్వామ్యార్థంతో వ్యక్తం చేస్తుంది; בָנִים అనే లింగనిర్దిష్ట పదాన్ని ‘కుమారులు’గా అనువదించింది.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: వారి పేర్లు
  rationale: బహువచన ప్రత్యయాన్ని నిలుపుతూ, ముందు చెప్పిన ఆరుగురు కుమారులను సూచించే సహజమైన తెలుగు రూపం.
- source_word: עַזְרִיקָם
  choice: అజ్రీకాము
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు బైబిలు శైలికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: בֹּכְרוּ
  choice: బోకెరు
  rationale: ఆరుగురు కుమారులు అని చెప్పిన సంఖ్యకు సరిపడేలా దీనిని రెండవ వ్యక్తినామంగా గ్రహించాం. 1 దినవృత్తాంతాలు 8:38లోని సమాంతర జాబితా కూడా ఇదే ఆరుగురు పేర్లలో దీనిని ఒక పేరుగా చూపుతుంది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: హెబ్రీ వ్యక్తినామానికి సాధారణ తెలుగు లిప్యంతరీకరణ.
- source_word: שְׁעַרְיָה
  choice: షెయర్యా
  rationale: హెబ్రీ ధ్వనిరూపాన్ని దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: עֹבַדְיָה
  choice: ఓబద్యా
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: חָנָן
  choice: హానాను
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: వీరు ఆజేలు కుమారులు
  rationale: మూలంలోని ముగింపు వంశావళి సూత్రాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
