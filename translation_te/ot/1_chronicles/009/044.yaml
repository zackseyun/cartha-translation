  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. పేర్లను మూల హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; בֹּכְרוּలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
