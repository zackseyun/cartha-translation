  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: te
  text: అతని కుమారుడు మీకా, అతని కుమారుడు రెయాయా, అతని కుమారుడు బయలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘బయలు’ ఇక్కడ వంశావళిలోని వ్యక్తిపేరు; ‘ప్రభువు’ అని అనువదించాల్సిన బిరుదు కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: మీకా
  rationale: వంశావళిలోని వ్యక్తిపేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: 3వ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న ఈ పదానికి అక్షరార్థం ‘అతని కుమారుడు’; పునరావృతమయ్యే వంశావళి సూత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: רְאָיָה
  choice: రెయాయా
  rationale: వ్యక్తిపేరు కావడంతో అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: בַּעַל
  choice: బయలు
  rationale: ఇక్కడ వంశావళిలో వ్యక్తిపేరుగా ఉంది; ‘ప్రభువు’ అనే బిరుదుగా అనువదించకుండా పేరుగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: בַּעַל అనే పదాన్ని బిరుదుగా/దేవతా సూచనగా అనువదించాలా, వ్యక్తిపేరుగా ఉంచాలా
  choice: ‘బయలు’ అనే వ్యక్తిపేరుగా ఉంచడం
  alternative: ‘ప్రభువు’ వంటి బిరుదుగా అనువదించడం
  rationale: ఈ పదం ఇతర వ్యక్తిపేర్లతో కూడిన వంశావళి వరుసలో ఉంది. కాబట్టి దీనిని వ్యక్తిపేరుగా గ్రహించడం వాక్య నిర్మాణానికీ సాహిత్య ప్రక్రియకీ తగినది; బిరుదుగా అనువదిస్తే వంశావళి భావం మరుగుపడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన వంశావళి శైలిని, మూలంలోని పునరావృత నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదక్రమం వాడబడింది.
