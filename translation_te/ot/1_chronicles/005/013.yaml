base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: te
  text: 'వారి పితృకుటుంబాల ప్రకారం[b] వారి సహోదరులు[a]: మీకాయేలు, మెషుల్లాము, షెబా, యోరయి, యాకాను, జీయా, ఏబెరు—ఏడుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అనే హీబ్రూ పదం వంశావళి సందర్భంలో ఒకే వంశానికి చెందిన బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి పితరుల ఇళ్ల ప్రకారం.’ ఇది పితృవంశాన్ని ఆధారంగా చేసుకున్న కుటుంబ లేదా వంశ విభాగాన్ని సూచించే వంశావళి పదబంధం.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: మూలంలోని ‘సహోదరులు’ అనే కుటుంబసంబంధ పదాన్ని నిలుపుతుంది; వంశావళి సందర్భంలో ఇది విస్తృత బంధువులను కూడా సూచించవచ్చు.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: తండ్రి వంశం ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ గృహ విభాగాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִיכָאֵל וּמְשֻׁלָּם וְשֶׁבַע וְיוֹרַי וְיַעְכָּן וְזִיעַ וָעֵבֶר
  choice: మీకాయేలు, మెషుల్లాము, షెబ, యోరయి, యకాను, జీయ, ఏబెరు
  rationale: మసొరెటిక్ పాఠంలోని హీబ్రూ వ్యక్తినామాలను తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: שִׁבְעָה
  choice: మొత్తం ఏడుగురు
  rationale: పేర్ల జాబితాను సంగ్రహించే సంఖ్య అని స్పష్టపరుస్తూ, వ్యక్తులకు సహజమైన తెలుగు సంఖ్యారూపాన్ని వాడింది.
