  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలి. ‘పితృకుటుంబాలు’ పితృవంశ గృహాల సామాజిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది; వ్యక్తినామాలు WLC స్వరరూపాన్ని అనుసరిస్తాయి.
