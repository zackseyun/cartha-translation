- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర వంశావళి వాక్యాలను తెలుగులో సహజంగా, స్పష్టంగా కలపడానికి అర్ధవిరామాన్ని ఉపయోగించాం; మూలంలోని అనుసంధాన భావం నిలిచింది.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: పునరావృతమైన వంశావళి క్రియను ఒకే విధంగా అనువదించి మూలంలోని సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: אֲחִימָעַץ
