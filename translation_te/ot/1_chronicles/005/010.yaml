  edition: WLC
  text: וּ/בִ/ימֵ֣י שָׁא֗וּל עָשׂ֤וּ מִלְחָמָה֙ עִם הַֽ/הַגְרִאִ֔ים וַֽ/יִּפְּל֖וּ בְּ/יָדָ֑/ם וַ/יֵּשְׁבוּ֙ בְּ/אָ֣הֳלֵי/הֶ֔ם עַֽל כָּל פְּנֵ֖י מִזְרָ֥ח לַ/גִּלְעָֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: te
  text: సౌలు కాలంలో వారు హగ్రీయులతో[a] యుద్ధం చేశారు. హగ్రీయులు వారి చేతికి చిక్కారు[b]. అప్పుడు వారు గిలాదుకు తూర్పున ఉన్న ప్రాంతమంతటా హగ్రీయుల గుడారాల్లో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హాగరీయులతో.” ఈ హీబ్రూ జాతినామం హాగరుతో సంబంధమున్న ప్రజలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారు వారి చేతిలో పడ్డారు”; అంటే, వారి అధికారానికి లోనయ్యారు. సందర్భానుసారంగా పడినవారు హగ్రీయులే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: సౌలు కాలంలో
  rationale: ‘రోజుల్లో’ అనే హీబ్రూ కాలసూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘కాలంలో’ అని అందించింది.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: యుద్ధం చేశారు
  rationale: యుద్ధంలో తలపడటాన్ని తెలిపే హీబ్రూ నుడికారాన్ని స్పష్టమైన, గౌరవప్రదమైన తెలుగులో అందించింది; ప్రత్యర్థిని ‘హగ్రీయులతో’ అనే సహచర్య విభక్తి సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: הַהַגְרִאִים
  choice: హగ్రీయులు
  rationale: హీబ్రూ జాతినామానికి దగ్గరగా ఉండే లిప్యంతరీకరణ; హాగరుతో సంబంధాన్ని స్పష్టం చేసే ‘హాగరీయులు’ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: హగ్రీయులు వారి చేతికి చిక్కారు
  rationale: అక్షరార్థంగా ‘వారి చేతిలో పడ్డారు’; సందర్భంలో వారి అధికారానికి లోనయ్యారనే నుడికారార్థాన్ని సహజమైన తెలుగులో తెలిపి, అంతర్లీన కర్తను స్పష్టం చేసింది.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  choice: హగ్రీయుల గుడారాల్లో నివసించారు
  rationale: గెలిచినవారు ఓడిన హగ్రీయుల గుడారాలను ఆక్రమించి నివసించారనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘స్థిరపడ్డారు’ అనడం శాశ్వతత్వాన్ని అతిగా సూచించవచ్చు.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: గిలాదుకు తూర్పున ఉన్న ప్రాంతమంతటా
  rationale: విస్తృత భూభాగమంతటా వ్యాపించడాన్ని తెలిపే హీబ్రూ స్థల నుడికారానికి సహజమైన తెలుగు సమానం.
