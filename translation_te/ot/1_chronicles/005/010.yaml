  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. అస్పష్టమైన సర్వనామ సూచన వల్ల తెలుగు పాఠకుడికి గందరగోళం కలగకుండా ‘హగ్రీయులు’ అని పునరుక్తి చేయబడింది; మూలంలోని ‘చేతిలో పడటం’ అనే రూపకం పాదటిప్పణిలో నిలుపబడింది.
