id: 1CH.5.16
reference: 1 Chronicles 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּֽשְׁב֛וּ בַּ/גִּלְעָ֥ד בַּ/בָּשָׁ֖ן וּ/בִ/בְנֹתֶ֑י/הָ וּ/בְ/כָֽל מִגְרְשֵׁ֥י שָׁר֖וֹן עַל תּוֹצְאוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: te
  text: వారు గిలాదులో, బాషానులో, దాని పట్టణాలలో[a], షారోనుకు చెందిన పచ్చిక భూములన్నిటిలో, వాటి సరిహద్దుల వరకు[b] నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దాని కుమార్తెలలో’; ఇది ఆధారిత పట్టణాలు లేదా గ్రామాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వాటి బయలుదేరే చోట్ల వరకు’; అంటే వాటి బయటి హద్దుల వరకు. ‘వాటి’ అనేది పచ్చిక భూములను లేదా ముందు పేర్కొన్న నివాస ప్రాంతాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ישב ఇక్కడ ఒక ప్రాంతంలో నివసించడాన్ని సూచిస్తుంది. ‘నివసించారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, కొత్తగా స్థిరపడటం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: בַּגִּלְעָד
  choice: గిలాదులో
  rationale: ప్రాంతనామాన్ని తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: בַּבָּשָׁן
  choice: బాషానులో
  rationale: ప్రాంతనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וּבִבְנֹתֶיהָ
  choice: దాని పట్టణాలలో
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలలో’; ఇది ఆధారిత పట్టణాలు లేదా గ్రామాలను సూచించే హీబ్రూ నుడికారం. సమీప పూర్వపదమైన బాషానును ఏకవచన స్త్రీలింగ ప్రత్యయం సూచిస్తున్నదని గ్రహించి ‘దాని పట్టణాలలో’ అని ఇచ్చాం.
- source_word: מִגְרְשֵׁי
  choice: పచ్చిక భూములన్నిటిలో
  rationale: מִגְרָשׁ నివాస ప్రాంతాల చుట్టూ ఉన్న బహిరంగ లేదా పశువులు మేసే భూమిని సూచించగలదు. ఈ గోత్ర-భౌగోళిక సందర్భంలో ‘పచ్చిక భూములు’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: שָׁרוֹן
  choice: షారోను
  rationale: ప్రాంతనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం; విభక్తి ప్రయోగంలో ‘షారోనుకు’గా వచ్చింది.
- source_word: עַל תּוֹצְאוֹתָם
  choice: వాటి సరిహద్దుల వరకు
  rationale: అక్షరార్థంగా ‘వాటి బయలుదేరే చోట్ల వరకు’ అనే ఈ స్థలసూచక నుడికారం పూర్తి బాహ్య హద్దులను సూచిస్తుంది. బహువచన ప్రత్యయాన్ని సమీపంలోని పచ్చిక భూములకు అన్వయిస్తూ ‘వాటి’ అని ఉంచాం.
