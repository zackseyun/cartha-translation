  source_fidelity: మొత్తంగా అనువాదం హీబ్రూ వాక్య నిర్మాణాన్ని, రూబేను జీవసంబంధ జ్యేష్ఠత్వాన్ని, అతని హక్కు యోసేపు కుమారులకు బదిలీ కావడాన్ని విశ్వసనీయంగా తెలియజేస్తుంది. అయితే చివరి ఉపవాక్యంలో ప్రస్తుత నిష్క్రియ రూపం ‘జ్యేష్ఠత్వపు హక్కు ... నమోదు చేయబడలేదు’ అని, హక్కే నమోదు కాలేదన్న అర్థాన్ని కలిగిస్తుంది. హీబ్రూ לֹא לְהִתְיַחֵשׂ לַבְּכֹרָהలో నమోదు/వంశావళి-లెక్కింపు చర్యే ప్రధానమైనది; దాని కర్త లేదా సంబంధిత వ్యక్తి స్పష్టంగా చెప్పబడలేదు. అందువల్ల తెలుగు కూడా ఆ అస్పష్టతను కాపాడాలి.
  naturalness: ‘జ్యేష్ఠ కుమారుడు,’ ‘జ్యేష్ఠత్వపు హక్కు,’ ‘వంశావళిలో నమోదు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదబంధాలు. చివరి భాగాన్ని వ్యక్తి/హక్కు అనే కర్తను బలవంతంగా సూచించని నపుంసక/అనిర్దిష్ట నిర్మాణంగా మార్చడం మరింత స్పష్టంగా, సహజంగా ఉంటుంది.
