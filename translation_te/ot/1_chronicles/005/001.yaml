id: 1CH.5.1
reference: 1 Chronicles 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: te
  text: ఇశ్రాయేలుకు జ్యేష్ఠ కుమారుడైన రూబేను కుమారులు—అతడే జ్యేష్ఠ కుమారుడు; అయితే అతడు తన తండ్రి పడకను[a] అపవిత్రం చేసినందువల్ల, అతని జ్యేష్ఠత్వపు హక్కు ఇశ్రాయేలు కుమారుడైన యోసేపు కుమారులకు ఇవ్వబడింది; అయినా జ్యేష్ఠత్వపు హక్కు ప్రకారం వంశావళిలో నమోదు జరగలేదు[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన తండ్రి పడకలను” లేదా “మంచాలను.” హీబ్రూలో ఇది బహువచనం; తండ్రి వైవాహిక పడకను సూచించే నుడికారంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అయితే జ్యేష్ఠత్వపు హక్కు ప్రకారం వంశావళిలో లెక్కించబడేలా కాదు.” హీబ్రూ వాక్యభాగం నమోదు చర్యకు సంబంధించినది; జ్యేష్ఠత్వపు హక్కు యోసేపు కుమారులకు బదిలీ కావడం, వంశావళి నమోదు మధ్య ఉన్న సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది. దీన్ని యోసేపు కుమారులు వంశావళిలో జ్యేష్ఠులుగా నమోదు కాలేదని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: రూబేను కుమారులు
  rationale: వావ్ అనుసంధాన భావాన్ని సందర్భం, వాక్య నిర్మాణమే తెలియజేస్తాయి; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు జ్యేష్ఠ కుమారుడైన
  rationale: בכור జననక్రమంలో మొదటి కుమారుడనే భావంతో పాటు అతని స్థితిని కూడా సూచిస్తుంది; తెలుగులో ‘జ్యేష్ఠ కుమారుడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: అతడే జ్యేష్ఠ కుమారుడు
  rationale: כִּי ఇక్కడ వివరణాత్మకంగా ఉంది; ‘అతడే’ జీవసంబంధమైన జ్యేష్ఠత్వాన్ని నొక్కి చెబుతుంది, కానీ తదుపరి హక్కు బదిలీని ముందుగానే పరిష్కరించదు.
- source_word: וּבְחַלְּלוֹ
  choice: అయితే అతడు ... అపవిత్రం చేసినందువల్ల
  rationale: బేత్‌తో కూడిన infinitive construct కారణాన్ని లేదా పరిస్థితిని సూచిస్తుంది. חלל యొక్క నైతిక తీవ్రతను ‘అపవిత్రం చేయడం’ నిలుపుతుంది.
- source_word: יְצוּעֵי אָבִיו
  choice: తన తండ్రి పడకను
  rationale: హీబ్రూలో రూపం బహువచనమైనప్పటికీ ఇది వివాహ/శయన పడకను సూచించే నుడికారం; సహజ తెలుగులో ఏకవచనం వాడి అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: అతని జ్యేష్ఠత్వపు హక్కు ... ఇవ్వబడింది
  rationale: בכורה కేవలం జననక్రమం కాక జ్యేష్ఠ కుమారుని ప్రత్యేక హక్కులను సూచిస్తుంది; ‘జ్యేష్ఠత్వపు హక్కు’ ఈ న్యాయ-కుటుంబ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుడైన యోసేపు కుమారులకు
  rationale: యోసేపును ఇశ్రాయేలు కుమారుడిగా గుర్తించే మూలంలోని వంశావళి సంబంధాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: అయినా జ్యేష్ఠత్వపు హక్కు ప్రకారం వంశావళిలో నమోదు చేయబడలేదు
  rationale: התיחשׂ వంశావళి నమోదు/లెక్కింపుకు సంబంధించిన సాంకేతిక పదం. לַבְּכֹרָהతో దాని ఖచ్చిత సంబంధం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉన్నందున ప్రధాన పాఠంలో దానిని పూర్తిగా విప్పకుండా ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: రూబేను జ్యేష్ఠ స్థితి మరియు యోసేపు కుమారులకు హక్కు బదిలీ మధ్య సంబంధం
  choice: రూబేను జీవసంబంధంగా జ్యేష్ఠ కుమారుడే అయినప్పటికీ, అతని జ్యేష్ఠత్వపు హక్కు యోసేపు కుమారులకు బదిలీ అయిందని, అదే సమయంలో వంశావళి నమోదు విషయంలో ఒక పరిమితి ఉందని అనువదించాం.
  alternative: యోసేపు వంశం ప్రతి అర్థంలోనూ రూబేను స్థానాన్ని పూర్తిగా తీసుకొని వంశావళిలో జ్యేష్ఠ వంశమైందని స్పష్టీకరించడం.
  rationale: చివరి ఉపవాక్యం హక్కుల బదిలీని వంశావళి స్థితితో నేరుగా సమానం చేయదు. అందువల్ల జీవసంబంధ జ్యేష్ఠత్వం, జ్యేష్ఠత్వపు ప్రయోజనాలు, వంశావళి లెక్కింపు మధ్యనున్న మూలపాఠపు ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని వాడాం. ‘జ్యేష్ఠ కుమారుడు,’ ‘జ్యేష్ఠత్వపు హక్కు,’ ‘వంశావళిలో నమోదు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని న్యాయ-వంశావళి భేదాన్ని కాపాడుతాయి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
