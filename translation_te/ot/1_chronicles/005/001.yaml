  to: ఇశ్రాయేలుకు జ్యేష్ఠ కుమారుడైన రూబేను కుమారులు—అతడే జ్యేష్ఠ కుమారుడు; అయితే అతడు తన తండ్రి పడకను[a] అపవిత్రం చేసినందువల్ల, అతని జ్యేష్ఠత్వపు హక్కు ఇశ్రాయేలు కుమారుడైన యోసేపు కుమారులకు ఇవ్వబడింది; అయినా జ్యేష్ఠత్వపు హక్కు ప్రకారం వంశావళిలో నమోదు జరగలేదు[b]—
  rationale: సవరణ చివరి హీబ్రూ ఉపవాక్యంలోని ఉద్దేశపూర్వకమైన లేదా వ్యాకరణపరమైన అస్పష్టతను కాపాడుతుంది. హక్కును నమోదు చేసిన వస్తువుగా చూపకుండా, ‘జ్యేష్ఠత్వపు హక్కు ప్రకారం’ అనే ప్రమాణానికి అనుగుణంగా వంశావళి నమోదు జరగలేదని మాత్రమే చెబుతుంది. పాదటిప్పణి కూడా ఒక వ్యాఖ్యానాన్ని నిశ్చయంగా ప్రకటించకుండా ప్రత్యామ్నాయంగా ఇస్తుంది.
