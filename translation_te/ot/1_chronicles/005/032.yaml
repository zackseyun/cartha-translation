translation:
  language: te
  text: ఉజ్జీ జెరహ్యాకు తండ్రి అయ్యాడు; జెరహ్యా మెరాయోతుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: ఉజ్జీ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; ఆరంభ సంధికారకాన్ని తెలుగు వాక్యప్రారంభంలో విడిగా చూపాల్సిన అవసరం లేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ అని అనువదించాం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: זְרַחְיָה
  choice: జెరహ్యా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּֽ/זְרַֽחְיָה
  choice: జెరహ్యా
  rationale: పునరుక్త వ్యక్తి పేరును అలాగే ఉంచాం; సంధికారక భావాన్ని తెలుగు విరామచిహ్నంతో సహజంగా వ్యక్తం చేశాం.
- source_word: מְרָיֽוֹת
  choice: మెరాయోతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
