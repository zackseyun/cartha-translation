  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన వంశావళి శైలిని నిలిపి, ప్రాచీనంగా వినిపించే ‘కనెను’ వంటి రూపాల బదులు సాధారణ పాఠకులకు సహజమైన ‘తండ్రి అయ్యాడు’ వాడాం.
