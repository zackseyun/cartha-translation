translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ప్రామాణిక తెలుగు ఉపయోగించాం. గోత్రసంబంధ సందర్భంలో అక్షరార్థమైన ‘కుమారులు’కు బదులు ‘వంశస్థులు’ ఎంచుకున్నాం; భౌగోళిక పదబంధంలోని అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
