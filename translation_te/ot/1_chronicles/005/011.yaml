  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵי גָ֣ד לְ/נֶגְדָּ֗/ם יָֽשְׁב֛וּ בְּ/אֶ֥רֶץ הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: te
  text: గాదు వంశస్థులు వారికి ఎదురుగా[a] బాషాను దేశంలో సల్కా[b] వరకు నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి పక్కన’ లేదా ‘వారికి అభిముఖంగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం ముందు ప్రస్తావించిన వారితో పోల్చిన సాపేక్ష స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ స్థలనామాన్ని కొన్ని అనువాదాల్లో ‘సలెకా’ అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: గాదు వంశస్థులు
  rationale: בני అనే పదానికి అక్షరార్థంగా ‘కుమారులు’ అని అర్థం ఉన్నా, ఇక్కడ అది గాదు గోత్రానికి చెందినవారిని సూచిస్తుంది. ఆధునిక తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘వంశస్థులు’ అని అనువదించాం; וּ ను వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని వ్యక్తం చేయనవసరం లేదు.
- source_word: לְ/נֶגְדָּ/ם
  choice: వారికి ఎదురుగా
  rationale: נגד ఉపసర్గసహిత రూపం ముందున్న రూబేనీయుల ప్రాంతంతో పోల్చిన సాపేక్ష స్థానాన్ని సూచిస్తుంది. ఖచ్చిత భౌగోళిక సంబంధాన్ని నిర్ణయించకుండా ‘ఎదురుగా’ అనే ప్రాథమిక స్థలార్థాన్ని నిలిపాం.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ఈ భూభాగ నివాస వర్ణనలో ישב కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది; ‘నివసించారు’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: బాషాను దేశంలో
  rationale: ארץ ఇక్కడ పేరుగల భూభాగాన్ని సూచిస్తుంది. בשן అనే స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘బాషాను’గా లిప్యంతరీకరించాం.
- source_word: עַד
  choice: వరకు
  rationale: భౌగోళిక విస్తృతి లేదా సరిహద్దును తెలిపే עד కు తెలుగులో ‘వరకు’ సహజమైన సమానం.
- source_word: סַלְכָה
  choice: సల్కా
  rationale: హీబ్రూ వ్యంజనరూపాన్ని దగ్గరగా ప్రతిబింబించేలా స్థలనామాన్ని ‘సల్కా’గా లిప్యంతరీకరించాం; సంప్రదాయ లిప్యంతరీకరణలో ‘సలెకా’ అనే రూపం కూడా కనిపిస్తుంది.
