source:
  edition: WLC
  text: וְ/לַ/מִּזְרָ֗ח יָשַׁב֙ עַד לְ/ב֣וֹא מִדְבָּ֔רָ/ה לְ/מִן הַ/נָּהָ֖ר פְּרָ֑ת כִּ֧י מִקְנֵי/הֶ֛ם רָב֖וּ בְּ/אֶ֥רֶץ גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: te
  text: తూర్పు వైపున అతడు యూఫ్రటీసు నది నుండి అరణ్యంలోకి ప్రవేశించే చోటు వరకు స్థిరపడ్డాడు[a]. ఎందుకంటే గిలాదు దేశంలో వారి పశుసంపద పెరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూఫ్రటీసు నది నుండి అరణ్యం వరకు.” హెబ్రీలోని ఈ సరిహద్దు వర్ణన సంక్షిప్తంగా ఉంది; దాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: తూర్పున
  rationale: దిశను సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. వాక్యారంభంలో וְ అనే సంధిని విడిగా ‘మరియు’ అని అనువదించకపోయినా భావం నిలుస్తుంది.
- source_word: יָשַׁב
  choice: అతడు … స్థిరపడ్డాడు
  rationale: ఏకవచన క్రియ వంశాన్ని దాని పూర్వికుడు లేదా గోత్ర ప్రతినిధి ద్వారా సమష్టిగా సూచిస్తుంది. భూభాగ ఆక్రమణ సందర్భంలో ‘స్థిరపడ్డాడు’ అనేది కేవలం ‘నివసించాడు’ కంటే తగినది.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: అరణ్య ప్రవేశం వరకు
  rationale: עַד + לְבוֹא అనే ప్రయోగంలోని సరిహద్దు లేదా చేరువ భావాన్ని ‘ప్రవేశం వరకు’ నిలుపుతుంది; దానిని కేవలం ‘అరణ్యం వరకు’గా సరళీకరించదు.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: యూఫ్రటీసు నది నుండి
  rationale: హెబ్రీ పదక్రమాన్ని దగ్గరగా అనుసరిస్తుంది. ఈ సంక్షిప్త సరిహద్దు వర్ణనలోని వాక్యనిర్మాణ అనిశ్చితిని పాదటిప్పణి వివరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తూర్పువైపు విస్తరించి స్థిరపడడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: מִקְנֵיהֶם
  choice: వారి పశుసంపద
  rationale: ఈ పదం పశువులన్నిటినీ సమష్టిగా సూచిస్తుంది; కేవలం cattle లేదా మందలకు పరిమితం కాదు.
- source_word: רָבוּ
  choice: విస్తరించింది
  rationale: పశుసంపద సంఖ్యాపరంగా పెరిగిందనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: గిలాదు దేశంలో
  rationale: אֶרֶץ యొక్క భూభాగ భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
