translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. భౌగోళిక సరిహద్దును తెలిపే హెబ్రీ వాక్యనిర్మాణంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా [a] పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచాం.
