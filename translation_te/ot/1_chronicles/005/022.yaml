  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי חֲלָלִ֤ים רַבִּים֙ נָפָ֔לוּ כִּ֥י מֵ/הָ/אֱלֹהִ֖ים הַ/מִּלְחָמָ֑ה וַ/יֵּשְׁב֥וּ תַחְתֵּי/הֶ֖ם עַד הַ/גֹּלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: te
  text: ఎందుకంటే అనేకమంది హతులై పడ్డారు; ఎందుకంటే ఆ యుద్ధం దేవుని నుండి వచ్చినది. వారు వారి స్థానంలో చెర వరకు నివసించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు వారి స్థానంలో నివసించారు” అన్నదానికి, “వారు వారి స్థానాన్ని స్వాధీనం చేసుకొని నివసించారు.” హీబ్రూ ప్రయోగం ఓడిపోయినవారి స్థానంలో నివసించడాన్ని సూచిస్తుంది.
    reason: idiomatic_clarification
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మొదటి כִּי ముందున్న విజయవివరణకు కారణాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: חֲלָלִים רַבִּים
  choice: హతులైనవారు అనేకులు
  rationale: חֲלָלִים యుద్ధంలో గాయపడి చంపబడినవారిని సూచిస్తుంది; సాధారణ మరణాలను కాక యుద్ధహతులను తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: נָפָלוּ
  choice: పడిపోయారు
  rationale: యుద్ధసందర్భంలో נפל మరణించి పడిపోవడాన్ని సూచిస్తుంది; ‘హతులైనవారు’తో కలిపి మరణార్థం స్పష్టమవుతుంది.
- source_word: כִּי
  choice: ఆ ... నుంచే జరిగింది
  rationale: రెండవ כִּי అనేకులు పడిపోవడానికి కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్యనిర్మాణంలో కారణసంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: מֵהָאֱלֹהִים
  choice: దేవుని నుంచే
  rationale: מִן మూలాన్ని సూచిస్తుంది. ‘నుంచే’ దేవుడే ఆ యుద్ధ ఫలితానికి మూలమనే ఉద్ఘాటనను నిలుపుతూ ప్రత్యక్ష కార్యసాధకత్వాన్ని అతిగా విస్తరించదు.
- source_word: הַמִּלְחָמָה
  choice: ఆ యుద్ధం
  rationale: సందర్భంలో ముందుగా వివరించిన నిర్దిష్ట సైనిక పోరాటాన్ని సూచిస్తుంది.
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ישב నివసించడం లేదా స్థిరపడడాన్ని సూచించగలదు; తరువాతి ‘వారి స్థానంలో’ అనే మాటతో ఆక్రమిత ప్రాంతంలో స్థిరనివాస భావం స్పష్టమవుతుంది.
- source_word: תַחְתֵּיהֶם
  choice: వారి స్థానంలో
  rationale: ఇది ఓడిపోయిన ప్రజల స్థానాన్ని స్వాధీనం చేసుకొని నివసించడాన్ని సూచించే ప్రయోగం; అక్షరార్థమైన ‘వారి కింద’ ఇక్కడ తగదు.
- source_word: עַד הַגֹּלָה
  choice: చెర వరకు
  rationale: גּוֹלָה గోత్రాలు తమ దేశం నుంచి తరలింపబడిన చెరను సూచిస్తుంది; ‘చెర’ సాధారణ తెలుగు బైబిలు-చారిత్రక వాడుకలో సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: యుద్ధంలో దేవుని ప్రమేయం
  choice: ఆ యుద్ధం దేవుని నుంచే జరిగింది
  alternative: ఆ యుద్ధం దేవునిదే
  rationale: హీబ్రూ దేవుణ్ణి యుద్ధానికి లేదా దాని నిర్ణాయక ఫలితానికి మూలంగా చూపుతుంది. ప్రధాన పాఠం మూలార్థాన్ని దగ్గరగా ఉంచుతుంది; ప్రత్యామ్నాయం యుద్ధం దేవునికి చెందినదనే సాధ్యమైన భావాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. యుద్ధహతులు, దేవుని మూలకారణత్వం, ఓడినవారి స్థానంలో నివాసం, తదనంతర చెర అనే భావాలను సంక్షిప్తంగా నిలిపింది.
