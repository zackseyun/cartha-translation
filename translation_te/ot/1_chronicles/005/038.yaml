translation:
  language: te
  text: అహీటూబు సాదోకుకు తండ్రి అయ్యాడు; సాదోకు షల్లూముకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: అహీటూబు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం. వాక్యారంభంలోని וַ సంధిని తెలుగు వంశావళి శైలిలో ప్రత్యేకంగా అనువదించలేదు.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: హిఫీల్ రూపమైన ילד వంశావళి సందర్భంలో ‘తండ్రి అయ్యాడు/కనెను’ అనే భావం ఇస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా పితృవంశ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగు వాక్య నిర్మాణంలో దానికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ/צָדוֹק
  choice: సాదోకు
  rationale: וְ రెండు వంశావళి భాగాలను కలుపుతుంది; తెలుగులో అర్థవిరామంతో సహజంగా అనుసంధానించినందున ‘మరియు’ను ప్రత్యేకంగా చేర్చలేదు.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పేర్లకు తెలుగు బైబిలు పఠనంలో సహజంగా వినిపించే అంత్య అచ్చులు ఉపయోగించబడ్డాయి.
