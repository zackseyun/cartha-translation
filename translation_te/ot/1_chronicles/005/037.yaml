translation:
  language: te
  text: అజర్యా అమర్యాకు తండ్రి అయ్యాడు; అమర్యా అహీటూబుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: ילד అనే ధాతువు హిఫీల్ రూపంలో వంశావళి సూత్రంగా సంతాన సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేలా ‘తండ్రి అయ్యాడు’ అని అనువదించబడింది.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగు వాక్య నిర్మాణంలో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: אֲמַרְיָה
  choice: అమర్యా
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి సమీపంగా, రెండు సందర్భాల్లోనూ ఏకరీతిగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: మొదటి క్రియలో ఉన్న అదే ילד ధాతువు, అదే వంశావళి భావం ఇక్కడ ఉంది; సహజత్వం, పదప్రయోగ ఏకరీతి కోసం అదే విధంగా అనువదించాం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని రెండు సమాంతర వంశసంబంధ వాక్యాలను నిలుపుతూ, తెలుగులో సహజమైన ‘తండ్రి అయ్యాడు’ అనే నిర్మాణం ఉపయోగించబడింది.
