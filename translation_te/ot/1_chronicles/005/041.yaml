source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: te
  text: యెహోవా యూదాను, యెరూషలేమును నెబుకద్నెజరు చేత చెరలోకి పంపించినప్పుడు, యెహోజాదాకు వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “యెహోవా యూదాను, యెరూషలేమును నెబుకద్నెజరు చేత చెరలోకి పంపించినప్పుడు, యెహోజాదాకు వెళ్లాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  choice: యెహోజాదాకు కూడా
  rationale: పేరును హెబ్రీ రూపానికి దగ్గరగా లిప్యంతరీకరించాం. వాక్యారంభంలోని וְ సందర్భానుసారంగా ‘కూడా’ అని అనువదించడం ముందున్న వంశావళి ప్రవాహంతో ఈ వాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: הָלַךְ
  choice: వెళ్లిపోయాడు
  rationale: הלך యొక్క ప్రాథమిక భావం ‘వెళ్లు’. చెర సందర్భంలో స్థలాన్ని విడిచి వెళ్లడాన్ని సహజంగా తెలియజేయడానికి ‘వెళ్లిపోయాడు’ ఎంచుకున్నాం; అతడు స్వచ్ఛందంగా వెళ్లాడని లేదా నాయకత్వం వహించాడని ఇది చెప్పదు.
- source_word: בְּ/הַגְלוֹת
  choice: బందీలుగా పంపించినప్పుడు
  rationale: 'בְ + גלה infinitive construct ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది: ‘చెరలోకి పంపించినప్పుడు’. సాధారణ తెలుగు పాఠకులకు సహజంగా ఉండేందుకు క్రియారూపంగా అనువదించాం.'
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֶת יְהוּדָה וִ/ירוּשָׁלָם
  choice: యూదాను, యెరూషలేమును
  rationale: మూలంలో ఉన్న రాజ్యం/ప్రాంతం మరియు నగరాన్నే ప్రత్యక్ష కర్మలుగా ఉంచాం; ‘ప్రజలను’ అని వివరణాత్మకంగా చేర్చలేదు.
- source_word: בְּ/יַד
  choice: చేత
  rationale: ఈ హెబ్రీ ప్రయోగం సాధనకర్తను సూచిస్తుంది. సహజమైన తెలుగు బైబిలు ప్రయోగమైన ‘చేత’ నెబుకద్నెజరును మానవ సాధనకర్తగా చూపుతుంది.
- source_word: נְבֻכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: హెబ్రీ వ్యంజన రూపానికి దగ్గరగా, తెలుగులో సులభంగా పలికే లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: చెరలో దైవిక కార్యసాధకత్వం మరియు మానవ సాధనకర్త
  choice: యెహోవా చెరలోకి పంపించినవాడిగా, నెబుకద్నెజరు ఆయన ఉపయోగించిన మానవ సాధనకర్తగా చూపబడ్డారు.
  alternative: చెర సంఘటనకు నెబుకద్నెజరునే ఏకైక కార్యసాధకుడిగా చూపడం.
  rationale: వాక్యనిర్మాణంలో יהוה గלה క్రియాభావానికి కర్త; בְיַד נְבֻכַדְנֶאצַּר మానవ సాధనకర్తను సూచిస్తుంది. అనువాదం ఈ దైవిక-మానవ కార్యసాధకత్వ ఉద్రిక్తతను అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘బందీలుగా పంపించడం’ సహజ పఠనానికి, పాదసూచికలోని ‘చెరలోకి తీసుకువెళ్లడం’ మూలంలోని גלה భావానికి మరింత అక్షరార్థ ప్రతిరూపంగా ఉపయోగించబడ్డాయి.
