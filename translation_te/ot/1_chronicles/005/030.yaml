translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని రెండు సమాంతర ఉపవాక్యాల నిర్మాణం నిలుపబడింది.
