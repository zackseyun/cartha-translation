translation:
  language: te
  text: ఎలియాజరు ఫీనెహాసుకు తండ్రియయ్యాడు; ఫీనెహాసు అబీషూవకు తండ్రియయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: הוֹלִיד / הֹלִיד
  choice: కనెను
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ఒక పురుషుడు మరొకరికి తండ్రి అయ్యాడనే జనన సంబంధాన్ని సూచిస్తుంది; సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ ‘కనెను’ అని అనువదించాం.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగు వాక్య నిర్మాణంలో ప్రత్యేక సమానపదం అవసరం లేదు.
- source_word: פִּינְחָס
  choice: ఫీనెహాసు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించి, రెండు ఉపవాక్యాల్లో ఒకే విధంగా ఉంచాం.
- source_word: אֲבִישׁוּעַ
  choice: అబీషూవ
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో సహజంగా పలకగల లిప్యంతరీకరణను ఉపయోగించాం.
