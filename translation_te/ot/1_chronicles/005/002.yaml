id: 1CH.5.2
reference: 1 Chronicles 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: te
  text: ఎందుకంటే యూదా తన సహోదరులపై ప్రాబల్యం పొందాడు; అతని నుంచే అధిపతి వచ్చాడు. అయితే జ్యేష్ఠత్వపు హక్కు యోసేపుదే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలో రూబేను జ్యేష్ఠత్వ హక్కును కోల్పోవడం, వంశావళిలో అతనికి జ్యేష్ఠుని స్థానం ఇవ్వకపోవడం గురించి చెప్పిన విషయానికి ఇది వివరణను పరిచయం చేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: వ్యక్తి మరియు గోత్రానికి సంబంధించిన స్థిరమైన తెలుగు రూపం.
- source_word: גָּבַר בְּאֶחָיו
  choice: తన సహోదరులకంటే బలవంతుడయ్యాడు
  rationale: גבר బలపడడం లేదా ప్రాబల్యం పొందడం అనే భావాన్ని ఇస్తుంది; בְּאֶחָיוతో కలిసి సహోదరుల మధ్య యూదా పొందిన ఆధిక్యాన్ని తెలుపుతుంది.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: అతనిలో నుంచే అధిపతి వచ్చాడు
  rationale: నాయకత్వం వహించే వ్యక్తి యూదా నుండి ఉద్భవించాడనే సంక్షిప్త హీబ్రూ వాక్యభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. נָגִידకు అధిపతి, నాయకుడు, రాజకుమారుడు వంటి భావవ్యాప్తి ఉంది.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: అయితే జ్యేష్ఠత్వపు హక్కు యోసేపుది
  rationale: בְּכֹרָה మొదట పుట్టినవానికి చెందిన స్థానం, హక్కులు అనే భావాన్ని సూచిస్తుంది. యూదా ఆధిక్యానికి, యోసేపు పొందిన జ్యేష్ఠత్వ హక్కుకు మధ్య ఉన్న వ్యత్యాసాన్ని ‘అయితే’ సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: యూదా ఆధిక్యానికి, యోసేపు జ్యేష్ఠత్వ హక్కుకు మధ్య సంబంధం
  choice: పాలనా ఆధిక్యం యూదాకు సంబంధించినదిగా, జ్యేష్ఠత్వ హక్కు యోసేపుకు చెందినదిగా వేర్వేరుగా ఉంచబడింది.
  alternative: యూదా అత్యంత బలమైన గోత్రంగా ఎదిగినా, వారసత్వ ప్రయోజనాలు యోసేపు దగ్గరే ఉన్నాయని మరింత సాధారణంగా అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ పాఠం యూదా ప్రాబల్యాన్ని, అతని నుండి అధిపతి రావడాన్ని ఒకవైపు, జ్యేష్ఠత్వ హక్కు యోసేపుకు చెందడాన్ని మరోవైపు పక్కపక్కనే ఉంచుతుంది. అనువాదం ఈ ఉద్రిక్తతను ఒకే రకమైన ప్రత్యేక హక్కుగా కలిపివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘అధిపతి’ అనే పదం పాలనా భావాన్ని నిలుపుతూ ఏ ప్రత్యేక రాజును పాఠంలోకి ముందుగానే దిగుమతి చేయదు; ‘జ్యేష్ఠత్వపు హక్కు’ సాధారణ పాఠకునికి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
