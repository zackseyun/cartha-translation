revisions:
- from: ఎందుకంటే యూదా తన సహోదరులకంటే బలవంతుడయ్యాడు; అతనిలో నుంచే అధిపతి[a] వచ్చాడు. అయితే జ్యేష్ఠత్వపు హక్కు యోసేపుది.
  to: ఎందుకంటే యూదా తన సహోదరులపై ప్రాబల్యం పొందాడు; అతని నుంచే అధిపతి వచ్చాడు. అయితే జ్యేష్ఠత్వపు హక్కు యోసేపుదే.
  rationale: The revision corrects the directional sense of מִמֶּנּוּ (‘from him’), retains the source’s distinction between Judah’s ascendancy/rulership and Joseph’s birthright, and replaces a misleading footnote alternative with one that preserves the lexical range of נָגִיד without adding an unwarranted royal-son meaning.
