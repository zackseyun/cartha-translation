  text: וּ/בְנֵ֣י עַמְרָ֔ם אַהֲרֹ֥ן וּ/מֹשֶׁ֖ה וּ/מִרְיָ֑ם וּ/בְנֵ֣י אַהֲרֹ֔ן נָדָב֙ וַ/אֲבִיה֔וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽרס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: te
  text: 'అమ్రాము కుమారులు[a]: అహరోను, మోషే, మిర్యాము; అహరోను కుమారులు: నాదాబు, అబీహు, ఎలియాజరు, ఈతామారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘కుమారులు.’ వంశావళి సందర్భంలో ఈ పదం పిల్లలను లేదా ప్రత్యక్ష సంతానాన్ని సూచించవచ్చు; ఇక్కడ అమ్రాము కింద అహరోను, మోషేతో పాటు మిర్యాము కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: అమ్రాము కుమారులు
  rationale: בְּנֵי అనే నిర్మాణ బహువచనానికి సాధారణ అర్థం ‘కుమారులు.’ వంశావళి శైలిలో ముందున్న וּను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా శీర్షికలాంటి సహజ తెలుగు నిర్మాణాన్ని ఉపయోగించాం.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: అహరోను, మోషే, మిర్యాము
  rationale: వ్యక్తిపేర్లను తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాల్లో లిప్యంతరీకరించాం; హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న సంధాయకాన్ని తెలుగు జాబితా శైలిలో విరామచిహ్నాలతో సహజంగా వ్యక్తం చేశాం.
- source_word: וּבְנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: ఇది రెండవ వంశావళి ఉపజాబితాను పరిచయం చేస్తుంది. సెమీకోలన్ ద్వారా మొదటి జాబితాతో సంబంధాన్ని నిలిపి, పునరుక్త సంధాయకం లేకుండా సహజమైన తెలుగు వాక్య నిర్మాణాన్ని ఇచ్చాం.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: నాదాబు, అబీహు, ఎలియాజరు, ఈతామారు
  rationale: పేర్లను ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాల్లో ఇచ్చాం; వరుసగా వచ్చే హీబ్రూ సంధాయకాలను తెలుగు జాబితా విరామచిహ్నాలతో వ్యక్తం చేశాం.
theological_decisions:
- issue: మిర్యాము కూడా ఉన్న జాబితాకు בְּנֵי (‘కుమారులు’) అనే పురుషవాచక పదం వాడటం
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులు’ అని ఉంచి వివరణాత్మక పాదటిప్పణి జోడించాం.
  alternative: ‘పిల్లలు’ లేదా ‘సంతానం’ అని లింగసమావేషకంగా అనువదించడం.
  rationale: హీబ్రూ పదరూపాన్ని స్పష్టంగా ప్రతిబింబిస్తూ, అదే జాబితాలో మిర్యాము ఉండటం వల్ల ఏర్పడే నిజమైన భాషాత్మక ఉద్రిక్తతను పాదటిప్పణి ద్వారా కాపాడాం; దానిని మౌనంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వంశావళి శైలిని అనుసరించాం. పేర్లకు తెలుగులో స్థిరపడిన బైబిలు రూపాలను ఉపయోగించాం; రెండు ఉపజాబితాలను కోలన్, సెమీకోలన్‌లతో స్పష్టంగా విభజించాం.
