  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సందర్భానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూ వాక్యంలోని పునరుద్ఘాటక సర్వనామాన్ని ‘అతడు’గా నిలిపి, దీర్ఘ వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా అందించాం.
