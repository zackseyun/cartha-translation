source:
  edition: WLC
  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: te
  text: అతని కుమారుడైన బెయేరాను అష్షూరు రాజైన తిల్గత్-పిల్నెసెరు[a] ప్రవాసానికి తీసుకుపోయాడు. అతడు రూబేనీయుల నాయకుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ అష్షూరు రాజు పేరు హీబ్రూలో “తిల్గత్-పిల్నెసెరు” అనే రూపంలో ఉంది; ఇతర బైబిలు సందర్భాల్లో, చారిత్రక వాడుకలో “తిగ్లత్-పిలేసెరు” అనే రూపం కూడా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: బెయేరా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం ముందు ప్రస్తావించిన వంశపూర్వికునిని సూచిస్తుంది; తెలుగులో సహజమైన సంబంధ పదబంధం.
- source_word: אֲשֶׁר הֶגְלָה
  choice: చెరలోకి తీసుకువెళ్లాడు
  rationale: הֶגְלָה అనే హిఫీల్ రూపంలోని బలవంతపు ప్రవాసానికి పంపే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: తిల్గత్-పిల్నెసెరు
  rationale: ఈ వచనంలోని హీబ్రూ నామరూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; ఇతర చోట్ల కనిపించే పరిచిత రూపంతో మౌనంగా సమన్వయం చేయలేదు.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సంబంధ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: הוּא
  choice: అతడు
  rationale: సంబంధ ఉపవాక్యం తరువాత మళ్లీ బెయేరాను సూచించే హీబ్రూ స్వతంత్ర సర్వనామాన్ని నిలిపింది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: గోత్ర సందర్భంలో గుర్తింపు పొందిన అధిపతి లేదా నాయకుడు అనే భావాన్ని ఇస్తుంది; ‘రాజకుమారుడు’ అనే తప్పుదారి పట్టించే రాజవంశ భావాన్ని నివారిస్తుంది.
- source_word: לָרְאוּבֵנִי
  choice: రూబేనీయులకు
  rationale: నాయకత్వం ఏ ప్రజాసమూహానికి సంబంధించినదో తెలిపే ל సంబంధార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
