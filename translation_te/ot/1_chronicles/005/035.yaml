  text: అహీమయాజు అజర్యాకు తండ్రి అయ్యాడు; అజర్యా యోహానానుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: అహీమయస్సు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా చదవగల రూపంలో లిప్యంతరీకరించాం; ఆరంభ సంధికారకాన్ని తెలుగు వాక్యప్రవాహంలో విడిగా అనువదించలేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫీల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ అని ఇచ్చాం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది హెబ్రీ ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: హెబ్రీ వ్యక్తి పేరును తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: וַ/עֲזַרְיָה
  choice: అజర్యా
  rationale: ముందున్న సంధికారక సంబంధాన్ని తెలుగులో అర్ధవిరామంతో సహజంగా వ్యక్తం చేశాం; పేరును లిప్యంతరీకరించాం.
- source_word: יוֹחָנָן
  choice: యోహానాను
  rationale: హెబ్రీ వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం; విభక్తి కోసం ‘యోహానానుకు’ రూపం వాక్యంలో వాడాం.
