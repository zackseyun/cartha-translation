source:
  edition: WLC
  text: בְּנֵ֥י רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל חֲנ֥וֹךְ וּ/פַלּ֖וּא חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: te
  text: 'ఇశ్రాయేలుకు తొలిపుట్టినవాడైన రూబేను కుమారులు: హనోకు, పల్లు, హెస్రోను, కర్మీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలో בְּנֵי అనే నిర్మాణరూప బహువచనం ప్రత్యక్ష పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సహజమూ ఖచ్చితమూ.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు తొలిపుట్టినవాడైన
  rationale: ఈ సమాస పదబంధం రూబేనును ఇశ్రాయేలు తొలిపుట్టిన కుమారునిగా విశేషిస్తుంది. తెలుగులో నామానికి ముందు విశేషణ వాక్యభాగంగా ఇవ్వడం సహజంగా ఉంటుంది.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: פַלּוּא
  choice: పల్లు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; మధ్య హల్లులోని ద్విత్వాన్ని నిలిపాం.
- source_word: חֶצְרוֹן
  choice: హెస్రోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כַרְמִי
  choice: కర్మీ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; చివరి దీర్ఘ ī ధ్వనిని ‘ఈ’తో సూచించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని పేర్ల జాబితా నిర్మాణం మరియు రూబేను గురించిన అన్వయ విశేషణం నిలుపబడ్డాయి.
