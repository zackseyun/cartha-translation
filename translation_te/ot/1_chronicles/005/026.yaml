source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు దేవుడు అష్షూరు రాజైన పూలు మనస్సును, అష్షూరు రాజైన తిల్గత్-పిల్నెసెరు మనస్సును[a] ప్రేరేపించాడు. ఆ రాజు రూబేనీయులను, గాదీయులను, మనష్షే అర్ధగోత్రం వారిని చెరలోకి తీసుకెళ్లి, హలహుకు, హాబోరుకు, హారాకు, గోజాను నదికి[b] తీసుకువెళ్లాడు—నేటివరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పూలు, తిల్గత్-పిల్నెసెరు ఒకే అష్షూరు రాజుకు చెందిన రెండు పేర్లు కావచ్చని చాలామంది భావిస్తారు. అయితే హీబ్రూ వాక్య నిర్మాణం వారిని ఇద్దరు వేర్వేరు పాలకులుగా అర్థం చేసుకోవడానికి కూడా అవకాశం ఇస్తుంది.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూలో: “గోజాను నది.” ఈ స్థలనామాన్ని “గోజాను నది” లేదా “గోజాను నది దగ్గర” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: కార్యానికి పురికొల్పాడు
  rationale: ఈ క్రియ ఒకరిని మేల్కొలిపి చర్యకు ప్రేరేపించడాన్ని సూచిస్తుంది. ‘పురికొల్పాడు’ దైవ కారణత్వాన్ని నిలుపుతూ, ప్రతికూల నైతిక భావాన్ని అనవసరంగా జోడించదు.
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: మనసును ... మనసును
  rationale: ఈ సందర్భంలో רוּחַ పాలకుని అంతరంగ ప్రేరణ లేదా సంకల్ప ధోరణిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆత్మను పురికొల్పాడు’ కంటే ‘మనసును ... కార్యానికి పురికొల్పాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: פּוּל
  choice: పూలు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: తిల్గత్-పిల్నెసెరు
  rationale: దినవృత్తాంతాలలోని హీబ్రూ రూపాన్ని సన్నిహితంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: וַיַּגְלֵם
  choice: వారిని చెరగా తీసుకెళ్లి
  rationale: హిఫీల్ రూపం చెరలోకి తరలించడం లేదా దేశబహిష్కరణ చేయడాన్ని సూచిస్తుంది. ఈ ఎంపిక చర్యను స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: రూబేనీయులను, గాదీయులను
  rationale: గోత్ర సంబంధ జనసమూహాలను తెలుగులో సహజంగా సూచించే రూపాలు.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం వారిని
  rationale: యొర్దాను అవతలి వైపు నివసించిన మనష్షే గోత్రంలోని సగభాగాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: וַיְבִיאֵם
  choice: చేర్చాడు
  rationale: చెరగా తీసుకెళ్లిన వారిని పేర్కొన్న ప్రాంతాలకు తీసుకువచ్చి స్థిరపరచిన క్రమానికి సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: హలహు, హాబోరు, హారా, గోజాను నది ప్రాంతాలకు
  rationale: స్థలనామాలను లిప్యంతరీకరించి, נְהַר גּוֹזָן ను నదితో సంబంధమున్న ప్రాంతంగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: హీబ్రూ కాలసూచక నుడికారానికి నేరమైన, ప్రస్తుత తెలుగులో సహజమైన సమానం.
theological_decisions:
- issue: పూలు మరియు తిల్గత్-పిల్నెసెరు మధ్య సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘అలాగే’ అని సమన్వయంగా ఉంచి, రెండు పేర్ల సంబంధాన్ని నిర్ణయించకుండా అనువదించడం
  alternative: రెండూ ఒకే అష్షూరు రాజుకు చెందిన పేర్లని భావించి ‘అంటే’ లేదా ‘అదే’ అని అనువదించడం
  rationale: హీబ్రూ పాఠ్యం రెండు పేర్లతోనూ ‘మనసు/ఆత్మ’ అనే పదాన్ని పునరుక్తి చేసి וְ సంధిని వాడుతుంది. వ్యాకరణపరంగా ఇద్దరు పాలకులు అనే భావమూ, ఒకే పాలకుని రెండు పేర్లు అనే భావమూ సాధ్యమే. కాబట్టి ప్రధాన పాఠ్యం సందిగ్ధతను నిలుపుతుంది; చారిత్రక గుర్తింపును పాదసూచిక వివరిస్తుంది.
- issue: దేవుడు అష్షూరు రాజు అంతరంగాన్ని కదిలించడం
  choice: ‘మనసును ... కార్యానికి పురికొల్పాడు’ అని దైవ కారణత్వాన్ని స్పష్టంగా ఉంచడం
  alternative: ‘అతనికి ఆలోచన కలిగింది’ వంటి దైవ చర్యను బలహీనపరిచే అనువాదం
  rationale: వాక్యంలో దేవుడే క్రియకు కర్త. అయితే హీబ్రూ రాజు ఉద్దేశం యొక్క నైతిక స్వభావాన్ని ఇక్కడ ప్రత్యేకంగా నిర్వచించదు; అందుచేత అనువాదం దానిని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని పునరుక్తిని కొంత నిలిపి, పూలు–తిల్గత్-పిల్నెసెరు గుర్తింపులోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా కాపాడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
