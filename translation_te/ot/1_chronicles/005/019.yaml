translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. హీబ్రూ నుడికారాన్ని పదేపదే అనుకరించకుండా సహజమైన ‘యుద్ధం చేశారు’ రూపం వాడబడింది; పేర్లు మూలభాష ఆధారంగా లిప్యంతరీకరించబడ్డాయి.
