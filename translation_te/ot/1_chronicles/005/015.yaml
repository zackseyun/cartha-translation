  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: te
  text: గూనీ కుమారుడైన అబ్దీయేలు కుమారుడు అహీ, వారి పితృగృహాల[a] అధిపతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి పూర్వికుల కుటుంబాలకు” లేదా “వారి వంశగృహాలకు.”
    reason: ‘పితృగృహాలు’ అనే హీబ్రూ నుడికారం వంశపారంపర్య కుటుంబ లేదా కుల విభాగాలను సూచించవచ్చు.
lexical_decisions:
- source_word: אֲחִי
  choice: అహీ
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בֶּן
  choice: కుమారుడు / కుమారుడైన
  rationale: ఈ వంశావళి సూత్రంలో ప్రత్యక్ష పుత్ర సంబంధాన్ని సూచించే సహజమైన తెలుగు రూపం. హీబ్రూలో ఇది కొన్నిసార్లు విస్తృతంగా ‘వంశస్థుడు’ అనే అర్థం ఇవ్వగలిగినా, ఇక్కడ సాధారణ వంశావళి ప్రయోగమే అనుకూలం.
- source_word: עַבְדִּיאֵל
  choice: అబ్దీయేలు
  rationale: హీబ్రూ వ్యక్తి పేరును ఆధునిక తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גּוּנִי
  choice: గూనీ
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: רֹאשׁ
  choice: అధిపతి
  rationale: ‘తల’ అనే మూలరూపకం ఇక్కడ నాయకత్వాన్ని సూచిస్తుంది. వ్యక్తుల లేదా వంశగృహాల నాయకునికి ‘అధిపతి’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: לְבֵית אֲבוֹתָם
  choice: వారి పితృగృహాలకు
  rationale: హీబ్రూ వంశ-సామాజిక సాంకేతిక పదబంధంలోని ‘తండ్రుల గృహాలు’ అనే రూపాన్ని సంక్షిప్తంగా నిలుపుతూ, వంశపారంపర్య కుటుంబ విభాగాల భావాన్ని ‘పితృగృహాలు’ తెలియజేస్తుంది.
