  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి నిర్మాణాన్ని స్పష్టంగా ఉంచే గౌరవప్రదమైన శైలి వాడబడింది. ‘పితృగృహాలు’ మూలంలోని సాంకేతిక వంశపదాన్ని నిలుపుతుంది; మరింత వివరణాత్మక ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
