  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా రూపొందించాం. పేర్ల లిప్యంతరీకరణలో హీబ్రూ ధ్వనిరూపానికి ప్రాధాన్యం ఇచ్చాం.
