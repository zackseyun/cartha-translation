translation:
  language: te
  text: షల్లూము హిల్కీయాకు తండ్రి అయ్యాడు; హిల్కీయా అజర్యాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: వంశావళిలో ముందున్న వాక్యంతో ఉన్న అనుసంధానం సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగులో వచనారంభంలో ‘మరియు’ చేర్చడం అసహజంగా ఉంటుంది.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: హిఫిల్ రూపం ఈ వంశావళి సందర్భంలో ‘కన్నాడు/తండ్రి అయ్యాడు’ అనే భావాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ సహజమైన ఆధునిక తెలుగు; జీవశాస్త్రీయ వివరాన్ని మించి వంశసంబంధాన్ని సూచించగలదు.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో స్వతంత్ర పదంతో అనువదించాల్సిన అవసరం లేదు.
- source_word: חִלְקִיָּה
  choice: హిల్కీయ
  rationale: హీబ్రూ పేరును దాని ధ్వనిరూపానికి దగ్గరగా, తెలుగులో సులభంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
- source_word: וְ
  choice: ;
  rationale: రెండవ వంశావళి దశను ముందుదానితో సమన్వయపరచే సంధిని తెలుగులో అర్ధవిరామం సహజంగా సూచిస్తుంది; అదనపు కాలక్రమ భావం చేర్చలేదు.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: హీబ్రూ వ్యక్తిపేరును మూలధ్వనులకు దగ్గరగా, ఆధునిక తెలుగులో పఠనయోగ్యంగా లిప్యంతరీకరించాం.
