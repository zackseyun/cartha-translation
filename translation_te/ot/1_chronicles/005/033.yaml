  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, పాతబడిన ‘కనెను’ వంటి ప్రయోగానికి బదులుగా సామాన్య పాఠకులకు స్పష్టమైన ‘తండ్రి అయ్యాడు’ వాడబడింది.
