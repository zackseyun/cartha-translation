  text: మెరాయోతు అమర్యాకు తండ్రి అయ్యాడు, మరియు అమర్యా అహీతూబుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: మెరాయోతు
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం పితృసంబంధమైన వంశక్రమాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ఈ ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: אֲמַרְיָה
  choice: అమర్యా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַ/אֲמַרְיָה
  choice: అమర్యా
  rationale: వావ్ సంధిని తెలుగు వాక్య విరామమైన అర్ధవిరామంతో సహజంగా ప్రతిబింబించాం; పేరును లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: పునరావృతమైన వంశావళి క్రియను మొదటి ప్రయోగంతో ఏకరీతిగా అనువదించాం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
