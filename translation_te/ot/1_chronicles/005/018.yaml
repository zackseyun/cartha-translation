revisions:
- from: రూబేను కుమారుల్లో, గాదీయుల్లో, మనష్షే అర్ధగోత్రంలో పరాక్రమశాలులైన పురుషులు ఉన్నారు. వారు డాలు, ఖడ్గం ధరించేవారు; విల్లు ఎక్కుపెట్టేవారు[a]; యుద్ధంలో శిక్షణ పొందినవారు. యుద్ధానికి బయలుదేరగల[b] వీరి సంఖ్య 44,760.
