  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: te
  text: రూబేను కుమారులు, గాదీయులు, మనష్షే అర్ధగోత్రానికి చెందినవారు—పరాక్రమశాలులైన పురుషులు, డాలు ఖడ్గాలు ధరించేవారు, విల్లును లాగేవారు[a], యుద్ధంలో శిక్షణ పొందినవారు—యుద్ధానికి బయలుదేరగలవారు[b] 44,760 మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘విల్లును వంచేవారు’ లేదా ‘విల్లును తొక్కేవారు’; ఇది బాణం వేయడానికి విల్లును సిద్ధం చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘సైనిక సేవకు తగినవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: రూబేను కుమారుల్లో
  rationale: హీబ్రూ బంధుత్వ రూపమైన ‘కుమారులు’ను నిలుపుతూ, తరువాతి ‘వారిలో పరాక్రమశాలులు’ అనే విభాగార్థక నిర్మాణంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וְגָדִי
  choice: గాదీయుల్లో
  rationale: ఇది గాదు అనే వ్యక్తిని కాక, గాదు గోత్రానికి చెందినవారిని సూచించే జాతివాచక రూపం.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రంలో
  rationale: గోత్ర విభాగాన్ని స్పష్టంగా, ఆధునిక తెలుగు వాడుకకు అనుగుణంగా తెలియజేస్తుంది.
- source_word: מִן בְּנֵי חַיִל
  choice: పరాక్రమశాలులైన పురుషులు
  rationale: חַיִל యొక్క సైనిక సందర్భంలోని సామర్థ్యం, శౌర్యం రెండింటినీ ‘పరాక్రమశాలులు’ సహజంగా వ్యక్తం చేస్తుంది; מִן విభాగార్థక భావాన్ని ముందు పదాలకు జతచేసి అనువదించాం.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: డాలు, ఖడ్గం ధరించేవారు
  rationale: ఆయుధాలను మోసే/ధరించే ప్రత్యక్ష సైనిక చిత్రాన్ని నిలుపుతుంది.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: విల్లు ఎక్కుపెట్టేవారు
  rationale: హీబ్రూ పదబంధంలోని విల్లును వంచి ప్రయోగానికి సిద్ధం చేసే భావాన్ని సహజ తెలుగు సైనిక వాడుకలో అందిస్తుంది.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: యుద్ధంలో శిక్షణ పొందినవారు
  rationale: లמד యొక్క శిక్షితమైన/నేర్చుకున్న ఫలితస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44,760
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను ఆధునిక తెలుగు పాఠకులకు సులభంగా గ్రహించగల అంకెల రూపంలో ఇస్తుంది.
- source_word: יֹצְאֵי צָבָא
  choice: యుద్ధానికి బయలుదేరగల
  rationale: సైనిక దండయాత్రకు వెళ్లగల అర్హత/సామర్థ్యాన్ని సూచించే హీబ్రూ సైనిక నుడికారపు చిత్రాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
