translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సమాంతర కాల నిర్మాణాన్ని ‘కాలంలోనూ ... కాలంలోనూ’గా నిలిపి, అసహజమైన ‘దినాల్లో’ అనే అక్షరానువాదాన్ని నివారించాం.
