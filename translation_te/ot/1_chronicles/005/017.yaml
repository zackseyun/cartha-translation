source:
  edition: WLC
  text: כֻּלָּ/ם֙ הִתְיַחְשׂ֔וּ בִּ/ימֵ֖י יוֹתָ֣ם מֶֽלֶךְ יְהוּדָ֑ה וּ/בִ/ימֵ֖י יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: te
  text: వీరందరూ యూదా రాజైన యోతాము కాలంలోనూ, ఇశ్రాయేలు రాజైన యరొబాము కాలంలోనూ వంశావళి ప్రకారం నమోదు చేయబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వంశావళి పట్టికల్లో నమోదు చేయబడ్డారు” లేదా “వంశావళి ప్రకారం లెక్కించబడ్డారు.” హీబ్రూ క్రియ వంశావళి పట్టికలో నమోదు చేయబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: వీరందరూ
  rationale: మూడవ పురుష బహువచన ప్రత్యయంతో ఉన్న సంపూర్ణత భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הִתְיַחְשׂוּ
  choice: వంశావళి ప్రకారం నమోదు చేయబడ్డారు
  rationale: దినవృత్తాంతాలలో ఈ హిత్పయేల్ క్రియ వంశపారంపర్య వివరాల ఆధారంగా అధికారిక పట్టికలో చేర్చబడటాన్ని సూచిస్తుంది; తెలుగు ప్రయోగం దాని వంశావళి భావాన్నీ నమోదు భావాన్నీ నిలుపుతుంది.
- source_word: בִּימֵי
  choice: కాలంలోనూ
  rationale: అక్షరార్థంగా ‘దినాల్లో’ అయినా, రాజుల పాలనను సూచించే ఈ హీబ్రూ కాలవాచక నుడికారానికి ‘కాలంలో’ సహజమైన తెలుగు సమానం; రెండుసార్లు వచ్చే నిర్మాణాన్ని ‘కాలంలోనూ ... కాలంలోనూ’గా నిలిపాం.
- source_word: יוֹתָם
  choice: యోతాము
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా వ్యక్తం చేస్తుంది.
- source_word: יָרָבְעָם
  choice: యరొబాము
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
