  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: te
  text: మనష్షే అర్ధగోత్రపు వారు బాషాను మొదలుకొని బయల్‌-హెర్మోను, శెనీరు, హెర్మోను పర్వతం వరకు ఆ దేశంలో నివసించారు.[b] వారు అనేకమంది అయ్యారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారు పెరిగారు’ లేదా ‘వారు విస్తరించారు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ప్రధానంగా సంఖ్యాపరమైన పెరుగుదలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: బయల్‌-హెర్మోను, శెనీరు, హెర్మోను పర్వతం అనే స్థలనామాలు వారి ప్రాంతపు ఉత్తర విస్తృతిని సూచిస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రపు వారు
  rationale: בני అనే పదానికి అక్షరార్థం ‘కుమారులు’; అయితే ఇక్కడ గోత్ర సభ్యులు లేదా వంశస్థులు అనే సమూహార్థం ఉంది. సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని ‘వారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָשְׁבוּ בָּאָרֶץ
  choice: ఆ దేశంలో నివసించారు
  rationale: ישב ఇక్కడ ఒక ప్రాంతంలో నివాసముండడాన్ని సూచిస్తుంది; ‘నివసించారు’ సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రయోగం.
- source_word: מִבָּשָׁן עַד
  choice: బాషాను మొదలుకొని … వరకు
  rationale: מן…עד భౌగోళిక విస్తృతికి ఆరంభం, అంతాన్ని సూచిస్తుంది.
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: బయల్‌-హెర్మోను, శెనీరు, హెర్మోను పర్వతం
  rationale: ఇవి ఉత్తర సరిహద్దును సూచించే స్థలనామాలు; హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: הֵמָּה רָבוּ
  choice: వారు విస్తారంగా వృద్ధి చెందారు
  rationale: רבה అనే క్రియ ఇక్కడ సంఖ్యాపరంగా ఎక్కువ కావడం లేదా విస్తరించడాన్ని సూచిస్తుంది. ‘విస్తారంగా వృద్ధి చెందారు’ మూలంలోని బలాన్ని నిలుపుతూ సహజంగా ఉంది.
