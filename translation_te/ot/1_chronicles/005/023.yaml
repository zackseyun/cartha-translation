translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గోత్ర సందర్భంలో ‘కుమారులు’ అనే అక్షరానువాదం కంటే ‘అర్ధగోత్రపు వారు’ సహజంగా ఉండి మూలార్థాన్ని అందిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
