  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి సంబంధాలు స్పష్టంగా ఉండేలా వాక్యక్రమం సహజీకరించబడింది. స్థల, వ్యక్తి పేర్లు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
