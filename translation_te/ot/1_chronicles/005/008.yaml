source:
  edition: WLC
  text: וּ/בֶ֨לַע֙ בֶּן עָזָ֔ז בֶּן שֶׁ֖מַע בֶּן יוֹאֵ֑ל ה֚וּא יוֹשֵׁ֣ב בַּ/עֲרֹעֵ֔ר וְ/עַד נְב֖וֹ וּ/בַ֥עַל מְעֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: te
  text: యోవేలు కుమారుడైన షెమా కుమారుడైన అజాజు కుమారుడు బెల అరోయేరులో నివసించేవాడు[a]; అతని నివాస ప్రాంతం నెబో మరియు బయల్-మెయోను వరకు విస్తరించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాపురముండేవాడు”; హీబ్రూ క్రియాపద కృదంత రూపం ఒక ప్రదేశంలో నివసిస్తూ ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: బెల కూడా
  rationale: ముందటి వచనంలోని వంశావళి జాబితాతో అనుసంధానాన్ని ו నిలుపుతుంది. తెలుగులో సహజమైన జాబితా కొనసాగింపుకోసం ‘కూడా’ వాడబడింది; బెల అనే వ్యక్తి పేరు లిప్యంతరీకరించబడింది.
- source_word: בֶּן עָזָז בֶּן שֶׁמַע בֶּן יוֹאֵל
  choice: యోవేలు కుమారుడైన షెమా కుమారుడు అజాజు కుమారుడైన
  rationale: హీబ్రూ వంశక్రమాన్ని తెలుగులో స్పష్టంగా అర్థమయ్యే పూర్వీకుని నుంచి వ్యక్తివరకు అమర్చుతూ, ప్రతి בֶּן‌ను ‘కుమారుడు’ అనే ప్రత్యక్ష సంబంధంతో నిలిపాం.
- source_word: הוּא יוֹשֵׁב
  choice: నివసించాడు
  rationale: יֹשֵׁב అనే క్రియావిశేషణ రూపం ఒక ప్రదేశంలో స్థిరంగా ఉండడం లేదా నివసించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నివసించాడు’ సహజంగా, గౌరవప్రదంగా ఉంది; స్వతంత్ర సర్వనామమైన הוּא యొక్క పునరుద్ఘాటనను ప్రత్యేకంగా అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: בַּעֲרֹעֵר
  choice: అరోయేరులో
  rationale: בְּ స్థానాన్ని సూచిస్తుంది; స్థలపేరు అరోయేరు అని లిప్యంతరీకరించబడింది.
- source_word: וְעַד נְבוֹ וּבַעַל מְעוֹן
  choice: నెబో, బయల్‌మెయోను వరకు
  rationale: עַד భౌగోళిక విస్తృతి యొక్క చివరి హద్దును సూచిస్తుంది. రెండు స్థలపేర్లను సమన్వయంగా ఉంచి, తెలుగులో సహజమైన ‘వరకు’ నిర్మాణం వాడాం.
