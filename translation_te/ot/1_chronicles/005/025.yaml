source:
  edition: WLC
  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: te
  text: కాని వారు తమ పితరుల దేవునికి నమ్మకద్రోహం చేసి, తమ ఎదుటనుండి దేవుడు నాశనం చేసిన ఆ దేశ ప్రజల దేవుళ్ల వెంట వ్యభిచరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థానికి దగ్గరగా: “ఆ దేవుళ్ల వెంట వేశ్యావృత్తి చేశారు.” హీబ్రూ పాఠం విగ్రహారాధనను, దేవునితో చేసిన నిబంధనకు విశ్వాసభంగంగా, లైంగిక రూపకంతో వర్ణిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: నమ్మకద్రోహం చేసి
  rationale: מעל అనే పదం దేవునితో ఉన్న నిబంధన సంబంధంలో విశ్వాసభంగాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ సంబంధపరమైన తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవునికి
  rationale: מעל తో వచ్చిన ב, ఎవరి పట్ల నమ్మకద్రోహం జరిగిందో సూచిస్తుంది. తెలుగులో ‘దేవునికి నమ్మకద్రోహం’ సహజమైన నిర్మాణం.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: వెంట వ్యభిచారుల్లా వెళ్లారు
  rationale: זנה లోని లైంగిక రూపకాన్ని నిలుపుతూ, אחרי లోని వెంబడించడం లేదా అనుసరించడం అనే భావాన్ని ‘వెంట ... వెళ్లారు’ వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: ఆ దేశ ప్రజల దేవుళ్లు
  rationale: నిర్మాణంలోని బహువచన భావాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: తమ ఎదుటనుండి దేవుడు నాశనం చేసిన ఆ దేశ ప్రజలు
  rationale: సంబంధవాచక వాక్యం దేవుళ్లను కాక ఆ దేశ ప్రజలను సూచిస్తుందని తెలుగు పదక్రమం స్పష్టం చేస్తుంది; ఏకవచన క్రియ కారణంగా אֱלֹהִים ను ‘దేవుడు’గా అనువదించాం.
theological_decisions:
- issue: విగ్రహారాధనకు వాడిన లైంగిక రూపకం
  choice: వ్యభిచారుల్లా వెళ్లారు
  alternative: విశ్వాసం విడిచి వెళ్లారు
  rationale: హీబ్రూ పాఠం విగ్రహారాధనను నిబంధనపరమైన లైంగిక అవిశ్వాసంగా ఉద్దేశపూర్వకంగా చిత్రిస్తుంది. సాధారణ ‘అవిశ్వాసం’గా చదును చేయకుండా రూపకాన్ని నిలిపాం; తెలుగులో ఇది ఉపమానరూపమని ‘లా’ స్పష్టం చేస్తుంది.
- issue: సంబంధవాచక వాక్యంలోని אֱלֹהִים సంఖ్య
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: הִשְׁמִיד అనే ఏకవచన క్రియ ఇక్కడ ఇశ్రాయేలు దేవుడినే సూచిస్తుంది.
- issue: אֲשֶׁר యొక్క పూర్వపదం
  choice: నాశనం చేయబడినవారు ఆ దేశ ప్రజలు
  alternative: నాశనం చేయబడినవి వారి దేవుళ్లు
  rationale: వ్యాకరణపరంగా సంబంధవాచక పదం సమీపంలోని ‘ఆ దేశ ప్రజలు’ను సూచిస్తుంది; తెలుగు పదక్రమం ఆ సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘పితరులు’ బైబిలు సందర్భానికి తగిన గౌరవప్రద పదంగా ఉంచబడింది; హీబ్రూ లైంగిక రూపకపు తీవ్రతను అసభ్యంగా కాకుండా స్పష్టంగా నిలిపాం.
