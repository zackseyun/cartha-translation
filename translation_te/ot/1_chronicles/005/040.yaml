translation:
  language: te
  text: అజర్యా శెరాయాకు తండ్రి అయ్యాడు; మరియు శెరాయా యెహోజాదాక్‌కు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: అజర్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం; ఉపసర్గలోని సంధానార్థం వాక్య నిర్మాణంలో సహజంగా ప్రతిఫలించింది.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: ילד ధాతువు హిఫీల్ రూపం వంశావళి సందర్భంలో సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ఈ ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు. ‘శెరాయాకు’ అనే విభక్తి రూపంలో వాక్య సంబంధం వ్యక్తమవుతుంది.
- source_word: שְׂרָיָה
  choice: శెరాయా
  rationale: హీబ్రూ వ్యక్తి పేరును మూల ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּ/שְׂרָיָה
  choice: శెరాయా
  rationale: ముందున్న ו సంధానాన్ని తెలుగులో అర్ధవిరామంతో కలిపిన సమన్వయ వాక్య నిర్మాణం సహజంగా తెలియజేస్తుంది; అందువల్ల ‘మరియు’ను విడిగా చేర్చలేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: పునరావృతమైన వంశావళి క్రియను మొదటి సందర్భంతో ఏకరీతిగా అనువదించాం.
- source_word: יְהוֹצָדָק
  choice: యెహోజాదాకు
  rationale: హీబ్రూ వ్యక్తి పేరు ‘యెహోజాదాక్’ను తెలుగులో లిప్యంతరీకరించి, ‘తండ్రి అయ్యాడు’ అనే ప్రయోగానికి తగిన దత్తివిభక్తి రూపం ఇచ్చాం.
