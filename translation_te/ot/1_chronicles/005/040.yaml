  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, పాతబడిన ‘కనెను’ వంటి ప్రయోగం బదులు సాధారణ పాఠకులకు స్పష్టమైన ‘తండ్రి అయ్యాడు’ను ఉపయోగించాం.
