id: 1CH.5.28
reference: 1 Chronicles 5:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/028.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: te
  text: 'కహాతు కుమారులు: అమ్రాము, ఇశ్హారు, హెబ్రోను, ఉజ్జీయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְנֵי అనే నిర్మాణరూపానికి ‘కుమారులు’ సహజమైన అర్థం. ఆరంభంలోని ו వరుస కొనసాగింపును సూచించినా, తెలుగులో ఈ సంక్షిప్త జాబితాకు ‘మరియు’ చేర్చకపోవడం సహజంగా ఉంది.
- source_word: קְהָת
  choice: కహాతు
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికేలా, మూలధ్వనులకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: עַמְרָם
  choice: అమ్రాము
  rationale: హెబ్రీ వ్యక్తినామాన్ని మూలధ్వనులకు సమీపంగా తెలుగు రూపంలో ఇచ్చాం.
- source_word: יִצְהָר
  choice: ఇస్హారు
  rationale: హెబ్రీ צְה ధ్వనిక్రమాన్ని తెలుగులో పఠనయోగ్యంగా ‘స్హా’తో సూచించి వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: וְ/חֶבְרוֹן
  choice: హెబ్రోను
  rationale: ఇక్కడ సందర్భం ప్రకారం ఇది స్థలపేరు కాదు, వ్యక్తినామం. ముందున్న సంధికారకాన్ని తెలుగు జాబితా నిర్మాణంలో విడిగా చూపలేదు.
- source_word: וְ/עֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: వ్యక్తినామాన్ని మూలంలోని బలమైన జ్ ధ్వనికి, దీర్ఘ స్వరాలకు దగ్గరగా లిప్యంతరీకరించాం; జాబితా చివర ‘మరియు’ లేకుండానే తెలుగు వాక్యం సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లు మూల హెబ్రీ ఉచ్చారణకు సాధ్యమైనంత సమీపంగా, సాధారణ పాఠకుడు సులభంగా చదవగల రూపాల్లో ఇవ్వబడ్డాయి.
