id: 1CH.5.14
reference: 1 Chronicles 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: te
  text: వీరు అబీహయిలు కుమారులు[a]. అబీహయిలు హూరి కుమారుడు, హూరి యారోహు కుమారుడు, యారోహు గిలాదు కుమారుడు, గిలాదు మిఖాయేలు కుమారుడు, మిఖాయేలు యెషీషై కుమారుడు, యెషీషై యహదో కుమారుడు, యహదో బూజు కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి “కుమారులు,” తరువాత పదేపదే వచ్చే “కుమారుడు” అనే మాటలు వంశావళిలో కుటుంబ పరంపరను సూచించవచ్చు; ప్రతి తరమూ తప్పనిసరిగా పేర్కొనబడిందని భావించాల్సిన అవసరం లేదు.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: బహువచన సూచనార్థక సర్వనామాన్ని వంశావళిలో పేర్కొనబడుతున్న వ్యక్తులకు సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం; హీబ్రూలో కాలాన్ని సూచించే క్రియ లేదు కాబట్టి అనవసరంగా కాలాన్ని జోడించలేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: మూలంలోని బహువచన నిర్మాణాన్ని నేరుగా నిలిపాం. వంశావళి సందర్భంలో ఇది విస్తృత సంతతి వరుసను కూడా సూచించగలదనే విషయాన్ని పాదసూచికలో తెలిపాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి గొలుసులో పదేపదే వచ్చే ఏకవచన సంబంధపదాన్ని స్పష్టంగా నిలిపాం; మధ్య తరాలు వదిలివేయబడి ఉండే అవకాశాన్ని అనువాదంలోనే ‘వంశస్థుడు’ అని నిర్ణయించకుండా పాదసూచికకు ఉంచాం.
- source_word: אֲבִיחַיִל
  choice: అబీహయిలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనువుగా లిప్యంతరీకరించాం.
- source_word: חוּרִי
  choice: హూరి
  rationale: వ్యక్తిపేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: יָרוֹחַ
  choice: యారోహు
  rationale: ఆరంభ యోడ్, దీర్ఘ స్వరం, చివరి గొంత్య ధ్వనిని తెలుగు పఠనానికి అనువుగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: גִּלְעָד
  choice: గిలాదు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా, మూల ధ్వనిరూపాన్ని గుర్తించగల విధంగా ఇచ్చాం.
- source_word: מִיכָאֵל
  choice: మిఖాయేలు
  rationale: హీబ్రూ పేరులోని ఖ ధ్వని మరియు ఏల్ ముగింపును నిలిపే తెలుగు రూపం.
- source_word: יְשִׁישַׁי
  choice: యెషీషై
  rationale: పేరులోని ష ధ్వనులు, చివరి ఐ ధ్వనిని ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: יַחְדּוֹ
  choice: యహదో
  rationale: హీబ్రూ వ్యక్తిపేరును అతిగా సాంకేతికంగా కాకుండా, సాధారణ తెలుగు పాఠకుడు పలకగల రూపంలో ఇచ్చాం.
- source_word: בּוּז
  choice: బూజు
  rationale: హీబ్రూ దీర్ఘ ū ధ్వనిని ప్రతిబింబించే సహజ తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల వంశావళి శైలి ఉపయోగించాం. హీబ్రూ వాక్యంలో క్రియ లేకపోవడంతో ‘ఉన్నారు/ఉండేవారు’ అని కాలాన్ని నిర్దేశించకుండా ‘వీరు’తో ప్రారంభించాం. పొడవైన సంబంధ గొలుసు స్పష్టంగా ఉండేందుకు ప్రతి పేరుతో ‘కుమారుడు’ను పునరావృతం చేశాం.
