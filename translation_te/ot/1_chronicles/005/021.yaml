id: 1CH.5.21
reference: 1 Chronicles 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: te
  text: 'వారు వారి పశుసంపదను స్వాధీనం చేసుకున్నారు: 50,000 ఒంటెలు, 2,50,000 గొర్రెలు, 2,000 గాడిదలు, అంతేకాక 1,00,000 మంది మనుషులను చెరపట్టారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మానవ ప్రాణం/వ్యక్తి” (נֶפֶשׁ אָדָם); అంటే చెరపట్టబడిన 1,00,000 మంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: స్వాధీనం చేసుకున్నారు … చెరపట్టారు
  rationale: שׁבה అనే ఒకే క్రియ జంతువులనూ మనుషులనూ ఉద్దేశిస్తుంది. ఆధునిక తెలుగులో జంతువులకు ‘స్వాధీనం చేసుకున్నారు,’ మనుషులకు ‘చెరపట్టారు’ అని సందర్భానుసారంగా వ్యక్తం చేయడం సహజంగా ఉండి, మూలంలోని పట్టుకొని తీసుకుపోయిన భావాన్ని నిలుపుతుంది.
- source_word: מִקְנֵיהֶם
  choice: వారి పశుసంపదను
  rationale: తరువాత వచ్చే జంతువుల జాబితా దృష్ట్యా מִקְנֶה ఇక్కడ ఆస్తి అనే విస్తృత భావం కంటే పశుసంపదను సూచిస్తుంది.
- source_word: גְּמַלֵּיהֶם
  choice: ఒంటెలు
  rationale: ఇది ఒంటెలను సూచించే స్పష్టమైన బహువచన రూపం; ‘వారి’ అనే సంబంధం ముందున్న ‘వారి పశుసంపద’ ద్వారా తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְצֹאן
  choice: గొర్రెలు
  rationale: צֹאן చిన్న పశువుల మందను, కొన్నిసార్లు గొర్రెలు-మేకలను సమష్టిగా సూచించగలదు. ఈ లెక్కల జాబితాలో సంప్రదాయబద్ధమైన, సహజమైన ‘గొర్రెలు’ను ఎంచుకున్నాం.
- source_word: וַחֲמוֹרִים
  choice: గాడిదలు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సాధారణ పదం.
- source_word: וְנֶפֶשׁ אָדָם
  choice: మంది మనుషులను
  rationale: అక్షరార్థంగా ‘మానవ ప్రాణం/వ్యక్తి’; ఇక్కడ లెక్కించబడిన మానవ బందీలను సూచిస్తుంది. సంఖ్యతో వ్యక్తులను లెక్కించడానికి ‘మంది’ సహజమైన తెలుగు రూపం.
- source_word: מֵאָה אָלֶף
  choice: 1,00,000
  rationale: తెలుగు పాఠకులకు సుపరిచితమైన భారతీయ అంకెల విభజనలో సంఖ్యను చూపించాం; భావం ‘లక్ష’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంఖ్యల జాబితా స్పష్టంగా ఉండేలా విరామచిహ్నాలు వాడాం. మూలంలోని ఒకే క్రియ జంతువులు, మనుషులు రెండింటినీ పరిపాలించినప్పటికీ, తెలుగులో అసహజతను నివారించేందుకు సందర్భానుసారంగా రెండు సమాంతర క్రియారూపాలు వాడాం. ఇంగ్లీషు సంప్రదింపు పాఠంలో [a] సూచిక ఒంటెల తరువాత కనిపించినా, దాని గమనిక נֶפֶשׁ אָדָםకు సంబంధించినందున తెలుగు ప్రధాన పాఠంలో మనుషుల తరువాత ఉంచాం.
