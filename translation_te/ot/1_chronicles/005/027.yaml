translation:
  language: te
  text: 'లేవి కుమారులు[a]: గెర్షోను, కహాతు, మరియు మెరారీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేవి వంశస్థులు.’ వంశావళుల్లో ‘కుమారులు’ అనే మాట కొన్నిసార్లు విస్తృతమైన వంశ సంబంధాన్ని సూచించవచ్చు; అయితే ఇక్కడ అది లేవి యొక్క ముగ్గురు ప్రత్యక్ష కుమారులనే సూచించడం అత్యంత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదానికి నిర్మాణ బహువచన రూపం. వంశావళుల్లో విస్తృతంగా ‘వంశస్థులు’ అనే భావాన్ని ఇవ్వగలిగినా, ఇక్కడ లేవి యొక్క ముగ్గురు ప్రత్యక్ష కుమారులను సూచించడం అత్యంత సహజం.
- source_word: לֵוִי
  choice: లేవి
  rationale: వ్యక్తి పేరు; ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: גֵּרְשׁוֹן
  choice: గేర్షోను
  rationale: లేవి కుమారుని పేరు; ఇక్కడి హెబ్రీ రూపాన్ని గేర్షోము అనే వేరొక పేరుతో కలపకుండా లిప్యంతరీకరించబడింది.
- source_word: קְהָת
  choice: కహాతు
  rationale: వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణను, స్థిరపడిన తెలుగు బైబిలు రూపాన్ని దృష్టిలో ఉంచిన లిప్యంతరీకరణ.
- source_word: מְרָרִי
  choice: మెరారి
  rationale: వ్యక్తి పేరు; హెబ్రీ రూపానికి సమీపమైన సహజ తెలుగు లిప్యంతరీకరణ.
- source_word: וּ
  choice: (జాబితాలో చివరి పేరుకు ముందు తెలుగు విరామచిహ్న నిర్మాణం)
  rationale: హెబ్రీ సంధాయకం ‘మరియు’ అని అర్థం. చిన్న పేర్ల జాబితాలో ఆధునిక తెలుగులో కామాలతో వరుసగా ఇవ్వడం సహజం; అర్థం మారదు.
