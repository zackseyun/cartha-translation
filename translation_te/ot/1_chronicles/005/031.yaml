translation:
  language: te
  text: అబీషూవా బుక్కీకి తండ్రి అయ్యాడు; బుక్కీ ఉజ్జీకి తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲבִישׁוּעַ
  choice: అబీషూవ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం; ఆరంభంలోని וַ సంధర్భానుసారంగా విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనెను/జన్మనిచ్చేలా చేశాడు’ అనే పితృసంబంధాన్ని సూచిస్తుంది. ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘తండ్రి అయ్యాడు’ సహజంగా ఉంటుంది.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు.
- source_word: בֻּקִּי
  choice: బుక్కీ
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וּבֻקִּי
  choice: బుక్కీ
  rationale: ముందున్న וּ వంశావళి శ్రేణిని కలుపుతుంది; తెలుగులో అర్ధవిరామంతో క్రమం స్పష్టంగా ఉన్నందున ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: עֻזִּי
  choice: ఉజ్జీ
  rationale: హీబ్రూ దృఢీకృత జ్ ధ్వనిని ప్రతిబింబిస్తూ వ్యక్తి పేరును ‘ఉజ్జీ’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తత, పునరుక్తి, గౌరవప్రదమైన శైలి నిలుపబడ్డాయి. ‘కనెను’ అనే పాత శైలికి బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘తండ్రి అయ్యాడు’ వాడబడింది.
