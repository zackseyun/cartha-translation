  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: te
  text: యోహానాను అజర్యాకు తండ్రి అయ్యాడు. యెరూషలేములో సొలొమోను కట్టిన గృహంలో[a] యాజకునిగా సేవ చేసినవాడు ఇతడే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘గృహంలో’; ఇది దేవాలయాన్ని సూచించడానికి సాధారణంగా వాడే పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: యోహానాను
  rationale: వంశావళి కొనసాగింపును తెలుగు వాక్యప్రవాహమే స్పష్టం చేస్తుంది; అందువల్ల וְను విడిగా ‘మరియు’ అని అనువదించలేదు. వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనెను/తండ్రి అయ్యాడు’ అనే భావాన్ని ఇస్తుంది. ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ అని ఎంచుకున్నాం.
- source_word: אֶת עֲזַרְיָה
  choice: అజర్యాకు
  rationale: אֶת అనేది ప్రత్యక్ష కర్మ సూచిక కాబట్టి విడిగా అనువదించబడదు; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా పేరుకు చతుర్థీ విభక్తి చేర్చాం.
- source_word: הוּא אֲשֶׁר
  choice: చేసినవాడు ఇతడే
  rationale: ఈ నిర్మాణం అజర్యాను ప్రత్యేకంగా గుర్తిస్తుంది. ‘ఇతడే’ అనే పదం హీబ్రూ సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּהֵן
  choice: యాజకునిగా సేవ చేసిన
  rationale: כהן కేవలం యాజకుడిగా ఉండడమే కాక యాజక సేవ నిర్వహించడాన్ని సూచిస్తుంది; అందువల్ల క్రియాత్మక భావాన్ని నిలిపాం.
- source_word: בַּ/בַּיִת
  choice: మందిరంలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇంటిలో/గృహంలో’ ఉన్నప్పటికీ, సొలొమోను యెరూషలేములో కట్టించిన కట్టడం అనే సందర్భం దేవాలయాన్ని స్పష్టంగా సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి సహజంగా ఉండేందుకు ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: సొలొమోను కట్టించిన
  rationale: ‘కట్టించిన’ అనే ప్రయోజక రూపం రాజైన సొలొమోను ఆ నిర్మాణాన్ని చేపట్టించిన భావాన్ని సహజంగా తెలుపుతుంది; మూలంలోని సంబంధవాచక ఉపవాక్యాన్ని తెలుగు విశేషణ ఉపవాక్యంగా మార్చాం.
- source_word: בִּ/ירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థల నామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపంలో ఇచ్చి, בְּ ఉపసర్గను ‘లో’తో వ్యక్తం చేశాం.
