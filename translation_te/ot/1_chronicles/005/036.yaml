translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. పాత వాడుకలోని ‘కనెను’, ‘యాజకత్వము చేసెను’ వంటి రూపాలను నివారించాం. మూలంలోని ఉద్ఘాటనను ‘ఇతడే’తో నిలిపాం.
