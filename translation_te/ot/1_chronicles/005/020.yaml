  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: te
  text: వారిని ఎదుర్కోవడంలో వీరికి సహాయం లభించింది. హగ్రీయులూ[a], వారితో ఉన్న వారందరూ వీరి చేతికి అప్పగించబడ్డారు[b]. ఎందుకంటే యుద్ధంలో వీరు దేవునికి మొరపెట్టుకున్నారు; వారు ఆయనను నమ్ముకున్నారు కాబట్టి ఆయన వారి మొర ఆలకించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హాగరీయులు.’
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ: ‘వీరి చేతిలోకి ఇవ్వబడ్డారు’; ఇది ఓడించి వీరి ఆధీనానికి అప్పగించడాన్ని తెలిపే నుడికారం.'
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆయన వారి విన్నపానికి అనుకూలంగా స్పందించాడు’; హీబ్రూ క్రియకు ‘వారి చేత వేడుకోబడి స్పందించాడు’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: వారిని ఎదుర్కోవడంలో వీరికి సహాయం లభించింది
  rationale: עזר నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, సహాయం చేసిన కర్తను ఈ ఉపవాక్యంలో స్పష్టంగా పేర్కొనలేదు. తరువాతి కారణవాక్యాలు ఆ సహాయం దేవుని నుంచే వచ్చిందని తెలియజేస్తాయి.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: వీరి చేతికి అప్పగించబడ్డారు
  rationale: נתן + ביד అనే యుద్ధసంబంధ హీబ్రూ నుడికారంలోని ‘ఓటమికి అప్పగించబడటం’ అనే భావాన్ని, దాని ‘చేతి’ ప్రతిమను సాధ్యమైనంతవరకు నిలిపి తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַהַגְרִיאִים
  choice: హగ్రీయులు
  rationale: ప్రజావర్గపు పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది; ‘హాగరీయులు’ అనే ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: వారితో ఉన్న వారందరూ
  rationale: హగ్రీయులతో కలిసి ఉన్న మిత్రబలగాలు లేదా సహచరులందరినీ సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: ఎందుకంటే యుద్ధంలో వీరు దేవునికి మొరపెట్టుకున్నారు
  rationale: זעק లోని అత్యవసర సహాయవిన్నప భావాన్ని ‘మొరపెట్టుకున్నారు’ స్పష్టంగా అందిస్తుంది; בַּמִּלְחָמָה నిర్దిష్టమైన ఈ యుద్ధాన్నే సూచిస్తుంది.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: ఆయన వారి మొర ఆలకించాడు
  rationale: עתר నిఫాల్ రూపం సూచించే అనుకూల దైవస్పందనను ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; పదశః కర్మణి రూపాన్ని పాదసూచికలో తెలియజేసింది.
- source_word: כִּי בָטְחוּ בוֹ
  choice: వారు ఆయనను నమ్ముకున్నారు కాబట్టి
  rationale: בטח ב లోని ఆధారపడటం, విశ్వసించడం అనే భావాన్ని మరియు దేవుని స్పందనతో ఉన్న కారణసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధసహాయానికి కర్త ఎవరు?
  choice: ‘వీరికి సహాయం లభించింది’ అని కర్మణి రూపంలో ఉంచడం
  alternative: ‘దేవుడు వారికి సహాయం చేశాడు’
  rationale: హీబ్రూ క్రియ కర్మణి రూపంలో ఉండి తక్షణ కర్తను చెప్పదు. తరువాతి వాక్యాలు ప్రార్థనకు దేవుడు స్పందించాడని తెలియజేస్తాయి; కాబట్టి దైవసహాయ భావం నిలుస్తూనే మూలంలోని వ్యాకరణాత్మక సంయమనం కాపాడబడింది.
- issue: ప్రార్థనకు దేవుని స్పందన
  choice: ‘ఆయన వారి మొర ఆలకించాడు’
  alternative: ‘ఆయన వారి విన్నపానికి లోబడ్డాడు/వారి చేత వేడుకోబడ్డాడు’
  rationale: హీబ్రూ నిఫాల్ రూపంలోని ‘వేడుకోనివ్వడం, అనుకూలంగా స్పందించడం’ అనే భావాన్ని అసహజమైన పదశః తెలుగుకు బదులు స్పష్టంగా అందిస్తుంది. ప్రార్థన, నమ్మకం, దైవస్పందన మధ్య సంబంధాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలి. ‘వీరు/వారు’ భేదం ద్వారా ఇశ్రాయేలీయ బలగాలు మరియు ప్రత్యర్థి బలగాల సూచనను తెలుగులో స్పష్టంగా ఉంచింది.
