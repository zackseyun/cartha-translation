translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన గంభీరమైన శైలి. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని నిలుపుతూ, నమోదు భావంలోని నిజమైన వాక్యనిర్మాణ అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
