source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ לְ/מִשְׁפְּחֹתָ֔י/ו בְּ/הִתְיַחֵ֖שׂ לְ/תֹלְדוֹתָ֑/ם הָ/רֹ֥אשׁ יְעִיאֵ֖ל וּ/זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: te
  text: 'అతని సహోదరులు తమ తమ వంశాల ప్రకారం, తమ తరాల వంశావళిలో నమోదు చేయబడినప్పుడు[a]: ప్రధానుడు యెయీయేలు, మరియు జెకర్యా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ తరాల వంశావళి నమోదులో.’
    reason: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם అనే పదబంధాన్ని కాలార్థక ఉపవాక్యంగా (‘నమోదు చేయబడినప్పుడు’) లేదా వంశావళి నమోదును సూచించే వివరణాత్మక పదబంధంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: వంశావళి సందర్భంలో אָח అన్నది సహోదరులను లేదా సమీప పురుష బంధువులను సూచించవచ్చు. మూలానికి దగ్గరగా ఉండేందుకు ‘సహోదరులు’ అని అనువదించాం.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: తమ తమ వంశాల ప్రకారం
  rationale: గోత్ర జాబితాల్లో מִשְׁפָּחָה అనేది ఇంటి కుటుంబం కంటే విస్తృతమైన వంశ విభాగాన్ని సూచిస్తుంది. ఏకవచన ప్రత్యయం ఉన్నా, సహోదరుల సమూహానికి పంపిణీ భావంతో వర్తిస్తున్నందున సహజమైన తెలుగులో ‘తమ తమ’ వాడాం.
- source_word: בְּהִתְיַחֵשׂ
  choice: వంశావళిలో నమోదు చేయబడినప్పుడు
  rationale: దినవృత్తాంతాల్లో יחס హిత్పయేల్ రూపం వంశావళి ఆధారంగా నమోదు కావడాన్ని సూచిస్తుంది. కాలార్థక నిర్మాణం తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
- source_word: לְתֹלְדוֹתָם
  choice: తమ తరాల
  rationale: ఇక్కడ תּוֹלְדוֹת తరాల క్రమాన్ని లేదా సంతతి నమోదును సూచిస్తుంది; ‘తమ తరాల వంశావళి’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: רֹאשׁ ఇక్కడ జాబితాలోని నాయకుడిని లేదా ముఖ్య వ్యక్తిని సూచిస్తుంది; ‘ప్రధానుడు’ ఆధునిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: יְעִיאֵל
  choice: యెయీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּזְכַרְיָהוּ
  choice: జెకర్యా
  rationale: హీబ్రూ זְכַרְיָהוּ పేరుకు తెలుగులో గుర్తించదగిన ప్రామాణిక బైబిలు రూపాన్ని వాడాం.
