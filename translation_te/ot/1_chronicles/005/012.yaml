  text: Joel the chief[a], Shapham the second, and Jaanai and Shaphat in Bashan.
translation:
  language: te
  text: బాషానులో యోవేలు ప్రధానుడు, షాఫాము రెండవ స్థానంలో ఉన్నవాడు[a], యానయి, షాఫాతు ఉన్నారు.
