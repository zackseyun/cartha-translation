    text: లేదా, “ఉపనాయకుడు”; లేక “హోదాలో రెండవవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: రֹאשׁ అక్షరార్థంగా ‘తల’; ఇక్కడ హోదా లేదా నాయకత్వాన్ని సూచిస్తున్నందున ‘ప్రధానుడు’ సహజమైన అనువాదం.
- source_word: וְשָׁפָם
  choice: షాఫాము
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: הַמִּשְׁנֶה
  choice: రెండవవాడు
  rationale: మִשְׁנֶה రెండవ స్థానం లేదా ద్వితీయ హోదాను సూచిస్తుంది. మూలంలోని సంక్షిప్త సమాస నిర్మాణాన్ని, దాని అస్పష్టతను నిలిపేందుకు ‘రెండవవాడు’ అని ఇచ్చాం.
- source_word: וְיַעְנַי
  choice: యానయి
  rationale: హీబ్రూ వ్యక్తి పేరును దాని ధ్వనిరూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְשָׁפָט
  choice: షాఫాతు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: בַּבָּשָׁן
  choice: బాషానులో
  rationale: בְּ ఉపసర్గ స్థలార్థాన్ని ఇస్తుంది; బాషాను అనే స్థలనామంతో సహజమైన తెలుగు విభక్తిని వాడాం.
theological_decisions:
- issue: הַמִּשְׁנֶה సూచించే హోదా
  choice: రెండవవాడు
  alternative: ఉపనాయకుడు; హోదాలో రెండవవాడు
  rationale: పదం ఖచ్చితమైన పరిపాలనా పదవిని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల ‘ఉపనాయకుడు’ అని అర్థాన్ని సంకుచితం చేయకుండా మూలంలోని హోదా సంబంధిత అస్పష్టతను ఉంచాం.
translation_notes:
  register: సంక్షిప్త వంశావళి/పరిపాలనా జాబితి శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సులభంగా చదవగల వాక్యంగా రూపొందించాం. ‘ఉన్నారు’ను చేర్చడం తెలుగు వాక్య సహజత్వం కోసం; హీబ్రూలో క్రియ స్పష్టంగా లేదు.
