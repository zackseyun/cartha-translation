  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: te
  text: 'యోవేలు కుమారులు[a]: షెమయా అతని కుమారుడు, గోగు అతని కుమారుడు, షిమీ అతని కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోవేలు సంతతివారు.’ హీబ్రూ వంశావళి పదబంధం కొన్నిసార్లు విస్తృతమైన సంతతిని సూచించవచ్చు. అయితే ఇక్కడ ‘అతని కుమారుడు’ అనే పదబంధం పదేపదే రావడం ప్రత్యక్ష వంశక్రమాన్ని సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదం యొక్క నిర్మిత బహువచన రూపం; వంశావళిని పరిచయం చేస్తోంది. తరువాత వరుసగా వచ్చే בְנוֹ (‘అతని కుమారుడు’) రూపాలు ప్రత్యక్ష పితృపుత్ర సంబంధాన్ని సూచిస్తున్నందున ‘కుమారులు’ అనేది సహజమైన, మూలానికి దగ్గరైన అనువాదం.
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: వ్యక్తి పేరు; తెలుగు బైబిలు పేర్లలో సాధారణంగా గుర్తించదగిన రూపాన్ని అనుసరించి లిప్యంతరీకరించబడింది.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను తెలుగు లిపిలో సహజంగా ప్రతిబింబించేలా లిప్యంతరీకరించబడింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: בֵּן పదానికి మూడవ పురుష ఏకవచన పుంలింగ స్వామ్యప్రత్యయం కలిసిన రూపం. వంశావళిలో ప్రతి పేరుకు ముందున్న వ్యక్తితో పితృపుత్ర సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: גּוֹג
  choice: గోగు
  rationale: ఇక్కడ ఇది వంశావళిలోని వ్యక్తి పేరు మాత్రమే; తెలుగు వాక్యప్రవాహానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరు; మూల హీబ్రూ రూపాన్ని తెలుగులో సులభంగా చదవగల విధంగా లిప్యంతరీకరించబడింది.
