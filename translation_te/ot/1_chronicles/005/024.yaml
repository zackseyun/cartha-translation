source:
  edition: WLC
  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: te
  text: 'వీరు తమ పితృకుటుంబాల ప్రధానులు[a]: ఏఫెరు, ఇషీ, ఎలీయేలు, అజ్రీయేలు, యిర్మీయా, హోదవ్యా, యహదీయేలు. వీరు పరాక్రమశాలులైన పురుషులు, పేరుపొందిన పురుషులు[b], తమ పితృకుటుంబాల ప్రధానులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘తమ తండ్రుల గృహాలు.’ ఈ హీబ్రూ పదబంధం ఒకే పూర్వపురుషుని కింద ఉన్న వంశాధారిత కుటుంబ విభాగాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో ‘పేరుగల మనుషులు’; అంటే ప్రసిద్ధులైన లేదా విశిష్టులైనవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: వంశావళి జాబితాను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; హీబ్రూ సంధికారకాన్ని విడిగా ‘మరియు’ అని అనువదించడం తెలుగు శైలిలో అవసరం లేదు.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם / רָאשִׁים לְבֵית אֲבוֹתָם
  choice: తమ పితృవంశ గృహాలకు అధిపతులు
  rationale: ఉమ్మడి పూర్వపురుషుని ఆధారంగా ఏర్పడిన వంశీయ కుటుంబ విభాగాలను సూచించే హీబ్రూ సామాజిక పదబంధాన్ని ‘కుటుంబాలు’ అని సరళీకరించకుండా నిలుపుతుంది; వచనంలోని ఉద్దేశపూర్వక పునరుక్తినీ కాపాడుతుంది.
- source_word: עֵפֶר
  choice: ఏఫెరు
  rationale: హీబ్రూ వ్యక్తిపేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: יִשְׁעִי
  choice: ఇషీ
  rationale: హీబ్రూ వ్యక్తిపేరును సహజమైన తెలుగు అక్షరరూపంలో అందిస్తుంది.
- source_word: אֱלִיאֵל
  choice: ఎలీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు పాఠకులకు చదవదగిన లిప్యంతరీకరణ.
- source_word: עַזְרִיאֵל
  choice: అజ్రీయేలు
  rationale: పేరులోని హీబ్రూ ధ్వనులను సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: יִרְמְיָה
  choice: యిర్మీయా
  rationale: ఈ హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకకు అనుగుణమైన రూపం.
- source_word: הוֹדַוְיָה
  choice: హోదవ్యా
  rationale: ఈ వచనంలోని హీబ్రూ పేరురూపాన్ని సంక్షిప్తం చేయకుండా ప్రతిబింబిస్తుంది.
- source_word: יַחְדִּיאֵל
  choice: యహదీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనువైన రీతిలో లిప్యంతరీకరిస్తుంది.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: పరాక్రమవంతులు
  rationale: బలం, ధైర్యం, కార్యసామర్థ్యం అనే పదబంధపు విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది; సందర్భం స్పష్టంగా చెప్పని చోట ‘యుద్ధవీరులు’ అని సైనిక భావానికే పరిమితం చేయదు.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: పేరుపొందినవారు
  rationale: అక్షరార్థంగా ‘పేరుగల మనుషులు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; ప్రసిద్ధి లేదా విశిష్టతను సూచిస్తుంది.
