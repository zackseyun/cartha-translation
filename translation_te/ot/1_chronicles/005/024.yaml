translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వంశగృహాల ప్రస్తావన రెండుసార్లు రావడాన్ని ఉద్దేశపూర్వక పునరుక్తిగా నిలుపుతూ, పొడవైన అనుబంధ నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం.
