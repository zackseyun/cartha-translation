id: 1CH.16.27
reference: 1 Chronicles 16:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: te
  text: వైభవమూ మహిమయూ ఆయన ఎదుట ఉన్నాయి; బలమూ ఆనందమూ ఆయన స్థలంలో[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన నివాసస్థలంలో,’ లేక ‘ఆయన పరిశుద్ధస్థలంలో.’ హీబ్రూ మూలంలో ‘ఆయన స్థలంలో’ అని ఉంది; ఇది కీర్తన 96:6లోని సమాంతర పదప్రయోగం కంటే విస్తృతమైన వ్యక్తీకరణ.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: వైభవం
  rationale: రాజసమైన శోభను, ఘనతను సూచించే పదం. הָדָרతో ఉన్న కవితాత్మక జోడీలో రెండు పదాల భావాలను కలిపివేయకుండా ‘వైభవం’ సహజంగా నిలుస్తుంది.
- source_word: הָדָר
  choice: మహిమ
  rationale: ఘనమైన రాజసత్వం, గౌరవప్రదమైన శోభ అనే భావాలను తెలియజేస్తుంది. ఆధునిక తెలుగు పాఠకులకు గంభీరంగానూ సహజంగానూ ఉండి, ‘వైభవం’కు అనుకూలమైన జోడీగా పనిచేస్తుంది.
- source_word: לְפָנָיו
  choice: ఆయన ఎదుట
  rationale: అక్షరార్థంగా ‘ఆయన ముఖానికి ఎదుట/ఆయన ఎదుట.’ ‘ఆయన సన్నిధిలో’ అని భావవిస్తరణ చేయకుండా మూలంలోని స్థలసంబంధ చిత్రాన్ని కాపాడుతుంది.
- source_word: עֹז
  choice: బలం
  rationale: శక్తి లేదా బలాన్ని సూచించే సాధారణ పదం. ఇక్కడ ‘బలం’ సూటిగా, కవితాత్మకంగా ఉంది.
- source_word: חֶדְוָה
  choice: ఆనందం
  rationale: సంతోషం, ఉల్లాసం అనే భావం. ‘బలం’తో కవితాత్మక సమతూకాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: בִּמְקֹמוֹ
  choice: ఆయన స్థలంలో
  rationale: మూలంలోని מָקוֹם విస్తృతంగా ‘స్థలం’ అని అర్థం. ఆరాధనా సందర్భం నివాసస్థలాన్ని లేదా పరిశుద్ధస్థలాన్ని సూచించవచ్చుగానీ, మూలపాఠం ప్రత్యేకంగా ‘పరిశుద్ధస్థలం’ అనదు; అందువల్ల విస్తృత భావాన్నే ప్రధాన పాఠ్యంలో ఉంచాం.
theological_decisions:
- issue: מְקוֹמוֹ అనే పదాన్ని ప్రత్యేకంగా దేవాలయం లేదా పరిశుద్ధస్థలంగా అర్థం చేయాలా?
  choice: విస్తృత భావంతో ‘ఆయన స్థలంలో’ అని అనువదించడం
  alternative: ‘ఆయన నివాసస్థలంలో’ లేదా ‘ఆయన పరిశుద్ధస్థలంలో’
  rationale: తక్షణ సందర్భం ఆరాధనకు సంబంధించినది; కీర్తన 96:6లోని సమాంతర వాక్యం ‘ఆయన పరిశుద్ధస్థలంలో’ అని ఉంది. అయితే దినవృత్తాంతముల మూలపాఠం מְקוֹמוֹ (‘ఆయన స్థలం’) అనే విస్తృత పదాన్ని వాడుతుంది. సమాంతర పాఠ్యంతో బలవంతంగా సమన్వయపరచకుండా ఇక్కడి ప్రత్యేక పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుకూలమైన సన్నని అర్థాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. రెండు జంట నామవాచకాలతో ‘ఉన్నాయి’ అనే బహువచన క్రియను ఉపయోగించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఆయన స్థలంలో’ అన్న పదబంధం వెంట ఉంచాం.
