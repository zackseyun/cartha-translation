  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: te
  text: ఆయన అబ్రాహాముతో కుదుర్చుకున్న నిబంధనను[a], ఇస్సాకుకు చేసిన తన ప్రమాణాన్ని—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అబ్రాహాముతో కోసిన నిబంధనను.” హీబ్రూలో ఇది “నిబంధన కుదుర్చుకోవడం” అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ఆయన … కుదుర్చుకున్న
  rationale: ముందటి వచనంలోని ‘నిబంధన’ను తిరిగి సూచించే సంబంధవాచక నిర్మాణం. తెలుగులో సహజమైన వాక్యక్రమంలో భావాన్ని కొనసాగించాం.
- source_word: כָּרַת
  choice: కుదుర్చుకున్న
  rationale: మూల క్రియ అక్షరార్థంగా ‘కోశాడు’; అయితే నిబంధన సందర్భంలో ఇది ‘నిబంధన కుదుర్చుకోవడం’ అనే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אֶת אַבְרָהָם
  choice: అబ్రాహాముతో
  rationale: మూలంలోని ప్రత్యక్ష కర్మ సూచికను యథాతథంగా అనువదించకుండా, నిబంధన కుదుర్చుకునే పక్షాన్ని తెలుగులో సహజంగా ‘తో’ విభక్తితో తెలిపాం.
- source_word: וּשְׁבוּעָתוֹ
  choice: తన ప్రమాణాన్ని
  rationale: ‘ప్రమాణం’ అనే నామవాచక భావాన్నీ, మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్నీ ‘తన’ ద్వారా నిలిపాం.
- source_word: לְיִצְחָק
  choice: ఇస్సాకుకు
  rationale: לְ సూచించే దిశ లేదా గ్రహీత భావాన్ని ‘కు’ విభక్తితో నేరుగా తెలిపాం.
theological_decisions:
- issue: ముందటి వచనంలోని ‘నిబంధన’ను ఆశ్రయించిన כרת నుడికారం
  choice: అబ్రాహాముతో కుదుర్చుకున్న నిబంధనను
  alternative: అబ్రాహాముతో కోసినదానిని
  rationale: హీబ్రూ రూపాన్ని యాంత్రికంగా కాక, నిబంధన చేయడమనే స్థిర నుడికార భావంతో అనువదించాం. సందర్భ స్పష్టత కోసం ముందటి వచనంలోని ‘నిబంధన’ను తెలుగులో పునరుక్తి చేశాం; దీనివల్ల ప్రత్యేకమైన మతసిద్ధాంత వ్యాఖ్యానాన్ని చేర్చకుండా మూల భావం స్పష్టమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కుదుర్చుకున్న నిబంధన’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, హీబ్రూ నుడికార భావాన్ని నిలుపుతుంది; మూలంలోని కొనసాగింపు సూచనగా చివర దీర్ఘవిరామ చిహ్నాన్ని ఉంచాం.
