  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: te
  text: 'ప్రజల వంశాలారా, యాహ్వేకు ఆపాదించండి,

    యాహ్వేకు మహిమను, బలాన్ని ఆపాదించండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: ఆపాదించండి
  rationale: స్తుతి సందర్భంలో ఇది ఏదైనా వస్తువును అక్షరార్థంగా ఇవ్వడం కాకుండా, యాహ్వేకు చెందవలసిన మహిమను, బలాన్ని ఆయనవిగా గుర్తించి ప్రకటించమనే బహువచన ఆజ్ఞ. ‘ఆపాదించండి’ ఈ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל ఉపసర్గ ఆజ్ఞ యొక్క పరోక్ష కర్మను సూచిస్తుంది. יהוה అనే దేవుని ప్రత్యేక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: ప్రజల వంశాలారా
  rationale: מִשְׁפְּחוֹת అనేది కుటుంబ లేదా వంశ సంబంధిత సమూహాలను, עַמִּים అనేది అనేక ప్రజాసమూహాలను సూచిస్తుంది. సంబోధనను స్పష్టంగా ఉంచుతూ హెబ్రీ బహువచన నిర్మాణాన్ని ఈ రూపం కాపాడుతుంది.
- source_word: כָּבוֹד
  choice: మహిమను
  rationale: దేవుని స్తుతించే సందర్భంలో כבוד ఆయనకు చెందే ఘనత, వైభవం అనే భావాన్ని కలిగి ఉంది; ‘మహిమ’ సహజమైన స్థిర తెలుగు సమానార్థకం.
- source_word: וָעֹז
  choice: బలాన్ని
  rationale: עֹז బలం లేదా శక్తిని సూచిస్తుంది. ‘బలాన్ని’ మూలంలోని సాధారణ భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, విస్తృతంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం నామ స్వరూపాన్ని నిలుపుతుంది.
- issue: మహిమ, బలం దేవునికి ‘ఇవ్వడం’ అనే ఆజ్ఞ భావం
  choice: ఆయనవిగా ఆపాదించడం
  alternative: అక్షరార్థంగా ఇవ్వడం; ఘనపరచడం
  rationale: స్తుతిగీత సందర్భం మరియు సమాంతర పదబంధం, దేవునిలో లేనిదాన్ని ఆయనకు కల్పించడం కాకుండా ఆయనకు చెందిన గుణాలను గుర్తించి ప్రకటించడాన్ని సూచిస్తాయి. అయినప్పటికీ మూలంలోని సంక్షిప్త ఆజ్ఞారూపాన్ని విస్తరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సామూహిక సంబోధనను వాడాం. హెబ్రీలోని రెండుసార్లు వచ్చే ఆజ్ఞను అలాగే నిలిపి, తెలుగులో లయ మరియు స్పష్టత కోసం సంబోధనను మొదట ఉంచాం.
