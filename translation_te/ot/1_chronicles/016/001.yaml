id: 1CH.16.1
reference: 1 Chronicles 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: te
  text: అప్పుడు వారు దేవుని మందసాన్ని తీసుకొచ్చి, దావీదు దానికోసం వేసిన గుడారం మధ్యలో దాన్ని ఉంచారు.[a] తరువాత వారు దేవుని సన్నిధిలో దహనబలులను, సమాధాన బలులను[b] అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గుడారం లోపల.” హీబ్రూ పదబంధానికి అక్షరార్థంగా “గుడారం మధ్యలో” అని, మరింత సాధారణంగా “గుడారం లోపల” అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సమాధాన బలులు” అనే పదాన్ని “సహవాస బలులు” లేదా “క్షేమ బలులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: తీసుకొచ్చి
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురావడం’ అని సూచిస్తుంది; మందసాన్ని సిద్ధం చేసిన గుడారంలోకి తీసుకురావడం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: హీబ్రూ పాఠంలో ఉన్న ‘దేవుని మందసం’ అనే సంక్షిప్త రూపాన్నే నిలిపి, పాఠంలో లేని ‘నిబంధన’ అనే పదాన్ని చేర్చలేదు.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: దాన్ని ఉంచారు
  rationale: יצג హిఫీల్ రూపం ఒక వస్తువును నిర్దిష్ట స్థానంలో నిలపడం లేదా ఉంచడం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: గుడారం మధ్యలో
  rationale: בְּתוֹךְ పదంలోని నిర్దిష్టమైన ‘మధ్యలో’ అనే స్థలార్థాన్ని ప్రధాన పాఠంలో నిలిపాం; అది సాధారణంగా ‘లోపల’ అని కూడా అర్థం కావచ్చని పాదసూచికలో తెలిపాం.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: ఇది సాధారణంగా ‘గుడారం’ అనే అర్థమిచ్చే పదం; దావీదు దాన్ని వేసినట్లు పాఠమే చెబుతుంది కాబట్టి ‘ప్రత్యక్ష గుడారం’ అని ప్రత్యేకంగా గుర్తించలేదు.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: దావీదు దానికోసం వేసిన
  rationale: గుడారం సందర్భంలో נטה అంటే ‘వేయడం/ఏర్పాటు చేయడం’; לוֹ మందసాన్ని సూచిస్తూ ‘దానికోసం’ అనే ప్రయోజనార్థాన్ని ఇస్తుంది.
- source_word: וַיַּקְרִיבוּ
  choice: అర్పించారు
  rationale: బలుల సందర్భంలో קרב హిఫీల్ రూపానికి ‘అర్పించడం’ అనేది స్పష్టమైన, ప్రామాణిక తెలుగు ప్రయోగం.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: బలిపీఠంపై పూర్తిగా దహనం చేసే ప్రత్యేక బలి రకాన్ని సూచించే సంప్రదాయబద్ధమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: שׁלם పదకుటుంబంలోని శాంతి, క్షేమం, సంపూర్ణత భావాలను ప్రతిబింబించే స్థిరమైన బైబిలు పదప్రయోగం; ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: ‘దేవుని ముఖం ఎదుట/సన్నిధిలో’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలుల ప్రత్యేక పేర్ల అనువాదం
  choice: ‘దహనబలులు’, ‘సమాధాన బలులు’ అనే రెండు ప్రత్యేక బలి రకాలను నిలిపాం.
  alternative: ‘బలులు’ అని సాధారణీకరించడం; లేదా ‘సహవాస బలులు/క్షేమ బలులు’ అని అనువదించడం.
  rationale: వచనం ఇశ్రాయేలు ఆరాధనా విధానంలోని రెండు వేర్వేరు బలి రకాలను పేర్కొంటుంది. వాటిని సాధారణీకరించకుండా ఆచారపరమైన ప్రత్యేకతను కాపాడాం; שְׁלָמִים యొక్క నిజమైన పదార్థ విస్తృతిని పాదసూచికలో ఉంచాం.
- issue: గుడారం గుర్తింపు
  choice: ‘గుడారం’ అని అనువదించాం.
  alternative: ‘ప్రత్యక్ష గుడారం’ అని అనువదించడం.
  rationale: హీబ్రూ పాఠం సాధారణ ‘గుడారం’ అనే నామవాచకాన్నే ఉపయోగించి, దావీదు దాన్ని మందసం కోసం వేసినట్లు చెబుతుంది. దాన్ని మోషే ప్రత్యక్ష గుడారంగా పాఠం స్పష్టంగా గుర్తించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మందసం’, ‘దహనబలి’, ‘సమాధాన బలి’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, అసలు పాఠంలోని వాక్యక్రమాన్ని తెలుగు సహజత్వానికి అనుగుణంగా మలిచాం. ప్రతి పాదసూచిక గుర్తును సంబంధిత పదబంధం వెంట ఉంచాం.
