source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలు దేవుడైన యాహ్వే నిత్యము నుండి నిత్యము వరకు స్తుతింపబడుగాక![a] అప్పుడు ప్రజలందరూ, “ఆమేన్!” అని చెప్పి యాహ్వేను స్తుతించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనంతకాలము నుండి అనంతకాలము వరకు”; హీబ్రూలో అక్షరార్థంగా, “యుగము నుండి యుగము వరకు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వ్యక్తీకరణ సంక్షిప్తంగా ఉంది: “ఆమేన్, యాహ్వేకు స్తుతి” లేదా “ఆమేన్, యాహ్వేను స్తుతించండి” అని కూడా గ్రహించవచ్చు. భావం ఏమిటంటే ప్రజలు ఆమేన్ అని స్పందించి యాహ్వేను స్తుతించారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: ఇది స్తోత్రారాధనలో వాడే ఆశీర్వాద ప్రకటన. తెలుగు భాషలో సహజమైన, గంభీరమైన విధంగా దేవుడు స్తుతికి పాత్రుడని ప్రకటిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో మార్చకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: హీబ్రూ సమాస సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: యుగయుగాల వరకు
  rationale: అంతులేని కాలవ్యాప్తిని సూచించే హీబ్రూ స్తోత్ర సూత్రాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; దాని అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: అప్పుడు ప్రజలందరూ ... అని చెప్పి
  rationale: וַיֹּאמְרוּ తెలియజేసే కథన క్రమాన్ని ‘అప్పుడు’తో, כָל הָעָםను ‘ప్రజలందరూ’తో సహజంగా అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్!
  rationale: సమాజపు ఆరాధనా సమ్మతిని సంప్రదాయబద్ధంగా గుర్తించదగిన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: וְהַלֵּל לַיהוָה
  choice: యాహ్వేను స్తుతించారు
  rationale: సంక్షిప్తమైన హీబ్రూ వ్యక్తీకరణను ప్రజల స్పందనలోని రెండవ చర్యగా గ్రహించి, తెలుగులో స్పష్టమైన కథన వాక్యంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: עוֹלָם పదబంధపు కాలవ్యాప్తి
  choice: యుగయుగాల వరకు
  alternative: నిత్యము నుండి నిత్యము వరకు; యుగము నుండి యుగము వరకు
  rationale: ఇది దేవుని స్తుతి అంతులేని కాలమంతా నిలుస్తుందని తెలిపే స్తోత్ర సూత్రం. ఎంపిక చేసిన రూపం తాత్త్విక ఖచ్చితత్వాన్ని అదనంగా రుద్దకుండా దాని విస్తృతిని తెలియజేస్తుంది.
- issue: וְהַלֵּל לַיהוָה యొక్క వ్యాకరణ సంబంధం
  choice: ప్రజలు యాహ్వేను స్తుతించిన చర్యగా కథనంలో కలపడం
  alternative: “ఆమేన్, యాహ్వేను స్తుతించండి” అనే ప్రత్యక్ష ఉక్తి
  rationale: హీబ్రూ రూపం అత్యంత సంక్షిప్తంగా ఉండి ఆజ్ఞ లేదా స్తుతి చర్యగా అర్థం కావచ్చు. సందర్భం మరియు పురాతన అనువాద సాక్ష్యం ప్రజలు స్తుతించారని గ్రహించడానికి మద్దతిస్తాయి; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే స్తోత్ర వాక్యానికి తగిన గంభీరమైన ఆరాధనా శైలిని నిలిపింది. ప్రత్యక్ష సమాధానమైన “ఆమేన్!”కు సహజమైన ఉద్ఘాటనను ఇచ్చింది.
