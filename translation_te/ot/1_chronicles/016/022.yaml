source:
  edition: WLC
  text: אַֽל תִּגְּעוּ֙ בִּ/מְשִׁיחָ֔/י וּ/בִ/נְבִיאַ֖/י אַל תָּרֵֽעוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: te
  text: '“నా అభిషిక్తులను[a] ముట్టుకోవద్దు;

    నా ప్రవక్తలకు హాని చేయవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అభిషేకించినవారిని.” అక్షరార్థంగా, “నా అభిషిక్తులను.” ఈ హీబ్రూ పదం “మెస్సీయ” అనే పదంతో సంబంధమున్నది; అయితే ఇక్కడ అది ప్రత్యేకంగా మెస్సీయను కాక, దేవుడు అభిషేకించినవారిని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: ముట్టుకోవద్దు
  rationale: נגע అనే క్రియకు ప్రాథమికంగా ‘ముట్టుకోవడం’ అనే అర్థం ఉంది. ఇక్కడ నిషేధార్థక సందర్భంలో, సమాంతరంగా ఉన్న ‘హాని చేయవద్దు’ అనే మాట వల్ల శత్రుభావంతో చేయి వేయకూడదనే భావం కూడా వ్యక్తమవుతుంది.
- source_word: בִּמְשִׁיחָי
  choice: నేను అభిషేకించినవారిని
  rationale: מָשִׁיחַ అంటే ‘అభిషేకించబడిన వ్యక్తి.’ ఇక్కడ మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయంతో కూడిన బహువచనం ఉంది. తెలుగులో సహజంగా, స్పష్టంగా బహువచన భావాన్ని తెలియజేయడానికి ‘నేను అభిషేకించినవారు’ అని అనువదించబడింది.
- source_word: וּבִנְבִיאַי
  choice: నా ప్రవక్తలకు
  rationale: נָבִיא అంటే ‘ప్రవక్త.’ ఇది మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయంతో కూడిన బహువచన రూపం; అందువల్ల ‘నా ప్రవక్తలు’ అని అనువదించబడింది. తెలుగు వాక్యనిర్మాణానుసారం ‘హాని చేయవద్దు’తో ‘నా ప్రవక్తలకు’ సహజంగా సరిపోతుంది.
- source_word: תָּרֵעוּ
  choice: హాని చేయవద్దు
  rationale: רעע హిఫీల్ రూపం ఇక్కడ నిషేధాన్ని సూచిస్తూ, ఎవరికైనా కీడు లేదా హాని చేయడం అనే అర్థాన్ని ఇస్తుంది. ‘హాని చేయవద్దు’ సంక్షిప్తంగా, సహజంగా ఉండి భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אַל
  choice: చేయవద్దు
  rationale: אַל తరువాత వచ్చే క్రియారూపంతో కలిసి నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘వద్దు’ నిర్మాణం దీనికి సహజమైన సమానార్థకం.
theological_decisions:
- issue: מְשִׁיחָי అనే బహువచన పదాన్ని మెస్సీయ సంబంధ ప్రత్యేక బిరుదుగా కాకుండా అనువదించడం
  choice: నేను అభిషేకించినవారు
  alternative: నా అభిషిక్తులు; నా మెస్సీయలు
  rationale: హీబ్రూ పదం ‘మెస్సీయ’ అనే పదంతో సంబంధమున్నదే అయినా, ఈ వచనంలో అది ఏకైక మెస్సీయను కాక దేవుడు అభిషేకించిన పలువురిని సూచించే బహువచన సాధారణ నామంగా ఉంది. అందువల్ల మూలంలో లేని ప్రత్యేక క్రీస్తుసంబంధ భావాన్ని చేర్చకుండా బహువచనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు నిషేధ వాక్యాలుగా నిలిపి, బహువచనాన్ని స్పష్టంగా కాపాడాం.
