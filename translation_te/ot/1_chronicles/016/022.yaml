    issue: The footnote reverses the lexical relationship between the literal rendering and the alternative.
    rationale: It labels “నేను అభిషేకించినవారిని” as literal, though the Hebrew is more directly “నా అభిషిక్తులను.” The note should identify the relative-clause form as the alternative and the possessive noun phrase as literal.
