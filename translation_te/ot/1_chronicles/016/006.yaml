  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנָיָ֥הוּ וְ/יַחֲזִיאֵ֖ל הַ/כֹּהֲנִ֑ים בַּ/חֲצֹצְר֣וֹת תָּמִ֔יד לִ/פְנֵ֖י אֲר֥וֹן בְּרִית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: te
  text: యాజకులైన బెనాయా, యహజీయేలు దేవుని నిబంధన మందసం ఎదుట బాకాలతో ఎల్లప్పుడూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని నిబంధన మందసం ఎదుట ఎల్లప్పుడూ బాకాలు ఊదుతూ ఉండేవారు.” హీబ్రూలో ‘ఊదుతూ’ అనే క్రియ స్పష్టంగా లేదు; అయితే సందర్భాన్ని బట్టి ఇదే ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ וְ/יַחֲזִיאֵל
  choice: బెనాయా, యహజీయేలు
  rationale: వ్యక్తుల పేర్లను హీబ్రూ రూపాలకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం. వాక్యారంభంలోని సంధికారకాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הַ/כֹּהֲנִים
  choice: యాజకులైన
  rationale: ఈ నిర్దిష్ట బహువచన నామవాచకం బెనాయా, యహజీయేలు నిర్వహించిన పదవిని సూచిస్తుంది; తెలుగులో అన్వయాన్ని స్పష్టంగా చూపడానికి విశేషణ రూపం వాడాం.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: బాకాలతో
  rationale: חֲצֹצְרוֹת సాధారణ కొమ్ములను కాక, ఊదే లోహ వాద్యాలైన బాకాలను సూచిస్తుంది. ב అనే ఉపసర్గకు ఇక్కడ సాధనార్థక/సహచర్యార్థకమైన ‘తో’ సహజం. ‘ఊదుతూ’ అనే క్రియ మూలపాఠంలో ప్రత్యక్షంగా లేదు.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతర లేదా క్రమమైన సేవ భావాన్ని తెలుపుతుంది; మూలంలోని కాలవ్యాప్తిని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: לִ/פְנֵי
  choice: ఎదుట
  rationale: స్థానపరమైనదీ ఆరాధన సంబంధమైనదీ అయిన ‘ముందు/సన్నిధిలో’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲרוֹן בְּרִית
  choice: నిబంధన మందసం
  rationale: హీబ్రూ సమాసాన్ని తెలుగులో స్థిరపడిన, స్పష్టమైన పదబంధంతో అందించాం.
- source_word: הָ/אֱלֹהִים
  choice: దేవుని
  rationale: నిర్దిష్ట రూపంలోని אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; సమాస సంబంధాన్ని తెలుగులో షష్ఠీ విభక్తితో సహజంగా చూపాం.
theological_decisions:
- issue: యాజకులు బాకాలు ఊదుతున్నారని ప్రధాన పాఠంలో స్పష్టంగా చేర్చాలా?
  choice: ‘బాకాలతో ఎల్లప్పుడూ ఉండేవారు’ అని, మూలంలో ప్రత్యక్షంగా లేని ‘ఊదుతూ’ అనే క్రియను ప్రధాన పాఠంలో చేర్చకుండా ఉంచాం.
  alternative: ‘దేవుని నిబంధన మందసం ఎదుట ఎల్లప్పుడూ బాకాలు ఊదుతూ ఉండేవారు.’
  rationale: హీబ్రూ పాఠంలో యాజకులు, బాకాలు, ‘ఎల్లప్పుడూ,’ మందసం ఎదుట అనే అంశాలు ఉన్నాయి; అయితే ‘ఊదు’ అనే క్రియ స్పష్టంగా లేదు. సందర్భంలో బాకాలు ఊదడం ఉద్దేశమై ఉండవచ్చు గాని, ఆ భావాన్ని పాదసూచికలో ఇచ్చి మూలపాఠంలోని సంక్షిప్తతను ప్రధాన వాక్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘మందసం,’ ‘యాజకులు,’ ‘బాకాలు’ వంటి బైబిలు సందర్భానికి తగిన సుపరిచిత పదాలు వాడాం; మూలంలోని క్రియారహిత నిర్మాణం వల్ల కలిగే భావసందిగ్ధతను పాదసూచికతో కాపాడాం.
