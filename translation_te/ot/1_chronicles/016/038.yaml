source:
  edition: WLC
  text: וְ/עֹבֵ֥ד אֱדֹ֛ם וַ/אֲחֵי/הֶ֖ם שִׁשִּׁ֣ים וּ/שְׁמוֹנָ֑ה וְ/עֹבֵ֨ד אֱדֹ֧ם בֶּן יְדִית֛וּן וְ/חֹסָ֖ה לְ/שֹׁעֲרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: te
  text: ఓబేదెదోము మరియు వారి సహోదరులు[a], మొత్తం అరవై ఎనిమిది మంది; యెదూతూను కుమారుడైన ఓబేదెదోము మరియు హోసా ద్వారపాలకులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘వారి సహోదరులు’ అని ఉంది. సంబంధాన్ని స్పష్టం చేయడానికి కొన్ని అనువాదాలు ‘అతని సహోదరులు’ అని ఇస్తాయి; అయితే ప్రధాన పాఠం ప్రామాణిక హెబ్రీ పాఠంలోని బహువచన స్వామ్య ప్రత్యయాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: ఓబేదెదోము
  rationale: ముందటి వచనంలోని జాబితాకు కొనసాగింపుగా ఉన్న వావ్ సంధిని తెలుగు జాబితా శైలిలో ప్రత్యేకంగా అనువదించకపోవడం సహజం; పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַ/אֲחֵי/הֶם
  choice: వారి సహోదరులు
  rationale: హెబ్రీ పాఠంలోని మూడవ పురుష బహువచన స్వామ్య ప్రత్యయాన్ని యథాతథంగా నిలిపి, దాని సూచనలోని సంక్షిప్తతను పరిష్కరించకుండా ఉంచాం.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: అరవై ఎనిమిది మంది
  rationale: సంఖ్యను సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చి, వ్యక్తుల లెక్క అని స్పష్టమయ్యేందుకు ‘మంది’ చేర్చాం.
- source_word: וְ/עֹבֵד אֱדֹם
  choice: యెదూతూను కుమారుడైన ఓబేదెదోము
  rationale: రెండవ ప్రస్తావనను తొలగించకుండా, వంశసంబంధ గుర్తింపుతో సహా హెబ్రీ నిర్మాణాన్ని స్పష్టమైన తెలుగులో నిలిపాం.
- source_word: בֶּן יְדִיתוּן
  choice: యెదూతూను కుమారుడైన
  rationale: దినవృత్తాంతములలో ప్రాముఖ్యమైన పితృసంబంధ గుర్తింపును ప్రత్యక్షంగా వ్యక్తం చేశాం.
- source_word: וְ/חֹסָה
  choice: హోసా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, ఓబేదెదోముతో కలిసి తదుపరి బాధ్యతకు కర్తగా ఉంచాం.
- source_word: לְ/שֹׁעֲרִים
  choice: ద్వారపాలకులుగా ఉన్నారు
  rationale: లామెద్ సూచించే నియామకం లేదా విధిని సహజమైన తెలుగు విధేయ నిర్మాణంతో వ్యక్తం చేశాం.
