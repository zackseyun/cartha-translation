  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: te
  text: 'సముద్రం, దానిని నింపిన సమస్తం ఘోషించుగాక[a];

    పొలం, దానిలో ఉన్న సమస్తం ఉల్లసించుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గర్జించుగాక.’ హీబ్రూ క్రియ పెద్దగా ఉరుమువంటి లేదా గర్జనవంటి ధ్వని చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: ఘోషించుగాక
  rationale: రעם అనే ధాతువు పెద్దగా గర్జించే లేదా ఉరుమువంటి ధ్వని చేయడాన్ని సూచిస్తుంది. సముద్రానికి సంబంధించి ‘ఘోషించు’ సహజంగా ఉండి, మూలంలోని బలమైన శబ్ద చిత్రణను నిలుపుతుంది.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: יָם కు సాధారణమైన, సందర్భానికి తగిన తెలుగు సమానార్థకం.
- source_word: וּמְלוֹאוֹ
  choice: దానిని నింపిన సమస్తం
  rationale: మְלוֹא అక్షరార్థంగా ‘దాని నిండుదనం’ లేదా ‘దానిని నింపేది’ అని సూచిస్తుంది. ఈ అనువాదం సముద్రాన్ని నింపి ఉన్న సమస్తాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַעֲלֹץ
  choice: ఉల్లసించుగాక
  rationale: עלץ ఉత్సాహభరితమైన ఆనందాన్ని వ్యక్తం చేస్తుంది. ‘ఉల్లసించు’ కవితాత్మక బలాన్నీ ఆధునిక తెలుగులో సహజత్వాన్నీ కాపాడుతుంది.
- source_word: הַשָּׂדֶה
  choice: పొలం
  rationale: שָׂדֶה కు నేరమైన అర్థం ‘పొలం’; సముద్రంతో ఉన్న కవితాత్మక సమాంతరతను ఇది నిలుపుతుంది.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: దానిలో ఉన్న సమస్తం
  rationale: ‘పొలం’ను తిరిగి సూచించే ఈ సంబంధ వాక్యభాగం כָל యొక్క సమగ్ర భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా స్వభావానికి తగిన గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. రెండు పాదాల సమాంతర నిర్మాణాన్ని నిలిపాం; అస్పష్టమైన ‘దాని నిండుదనం’కు బదులుగా మూలార్థాన్ని స్పష్టంగా తెలిపే ‘దానిని నింపిన సమస్తం’ను ఎంచుకున్నాం.
