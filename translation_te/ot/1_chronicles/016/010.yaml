id: 1CH.16.10
reference: 1 Chronicles 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: te
  text: 'ఆయన పవిత్ర నామంలో గొప్పగా చెప్పుకొనండి;


    యాహ్వేను[a] వెదకేవారి హృదయాలు సంతోషించుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’ (దైవనామం); సంప్రదాయంగా ‘ప్రభువు’గా అనువదిస్తారు; ‘యెహోవా’ అనేది మరో రూపం.'
    reason: దైవనామానికి సంబంధించిన హీబ్రూ రూపం, సంప్రదాయ అనువాదం, మరియు ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: అతిశయించండి
  rationale: הלל అనే క్రియ యొక్క హిత్పయేల్ బహువచన ఆజ్ఞారూపం ఇక్కడ ఎవరినో లేదా దేనినో ఆధారంగా చేసుకొని గొప్పగా చెప్పుకోవడం, ఆనందంగా ఘనపరచడం అనే భావాన్ని ఇస్తుంది. ‘అతిశయించండి’ ఆ ఆజ్ఞారూపాన్నీ సానుకూల సందర్భాన్నీ నిలుపుతుంది.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: ఆయన పవిత్ర నామంలో
  rationale: בְּ అనే ఉపసర్గ సూచించే పరిధి లేదా ఆధారాన్ని ‘లో’ ద్వారా సన్నిహితంగా ప్రతిబింబిస్తూ, ‘పవిత్ర నామం’ అనే సహజమైన తెలుగు పదబంధాన్ని నిలుపుతుంది.
- source_word: יִשְׂמַח
  choice: సంతోషించుగాక
  rationale: రూపపరంగా ఇది అపూర్ణకాల క్రియ అయినా, కవితాత్మక ప్రబోధ సందర్భంలో ఆశీర్వాదాత్మక లేదా ఆహ్వానాత్మక జస్సివ్ భావం ఉంది. ‘సంతోషించుగాక’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵב
  choice: హృదయం
  rationale: హీబ్రూలో ఏకవచనంగా ఉన్న ‘హృదయం’ అన్వేషించేవారి అంతరంగాన్ని సమష్టిగా సూచిస్తుంది; తెలుగు కవితాత్మక వాక్యంలోనూ ఈ సమష్టి ఏకవచనం సహజంగా ఉంటుంది.
- source_word: מְבַקְשֵׁי
  choice: వెదకేవారి
  rationale: ఈ కర్తరి కృదంతం యాహ్వేను నిరంతరం వెదకడం వారి లక్షణమని సూచిస్తుంది. ‘వెదకేవారి’ ఆ కొనసాగుతున్న స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: దైవనామం יהוהను ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న ప్రత్యేక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దాని వ్యక్తినామ స్వభావాన్ని నిలుపుతూ ‘యాహ్వే’ అని ఇచ్చి, సంప్రదాయ ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- issue: לֵב అనే ఏకవచనానికి సమష్టి భావం
  choice: వెదకేవారి హృదయం
  alternative: వెదకేవారి హృదయాలు
  rationale: మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ అది అనేకమంది అంతరంగాన్ని సమష్టిగా సూచించేందుకు వీలు కల్పించాం. బహువచనం భావాన్ని స్పష్టం చేయగలిగినా, మూలంలోని కవితాత్మక సమష్టి ఏకవచనాన్ని మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘అతిశయించండి’ అనే పదం సాధారణంగా ప్రతికూల గర్వాన్ని సూచించగలిగినా, ‘ఆయన పవిత్ర నామంలో’ అనే సందర్భం దానిని దేవునిలో ఆనందంగా గొప్పగా చెప్పుకోవడం అనే సానుకూల అర్థంలో నిర్దేశిస్తుంది. రెండో పాదంలో ‘సంతోషించుగాక’ మూలంలోని జస్సివ్ భావాన్ని నిలుపుతుంది.
