    text: 'హీబ్రూ: ‘YHWH’ (దైవనామం); సంప్రదాయంగా ‘ప్రభువు’గా అనువదిస్తారు; ‘యెహోవా’ అనేది మరో రూపం.'
    reason: దైవనామానికి సంబంధించిన హీబ్రూ రూపం, సంప్రదాయ అనువాదం, మరియు ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
  revision_rationale: 'The revision improves modern Telugu idiom while preserving the Hebrew poetic exhortation: a plural imperative followed by a jussive wish. It renders the collective Hebrew singular ‘heart’ idiomatically as plural ‘hearts’ and uses a positive Telugu expression for boasting in God’s holy name. The divine-name footnote remains anchored at ‘యాహ్వే’ and is clarified.'
