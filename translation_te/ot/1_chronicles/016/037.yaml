revisions:
- from: అప్పుడు అతడు ఆసాఫును, అతని సహోదరులను అక్కడ యెహోవా[a] నిబంధన మందసం ఎదుట ఉంచాడు; వారు మందసం ఎదుట నిరంతరం, ప్రతిరోజు చేయవలసిన సేవను ఆ రోజున చేయాలి.
  to: అతడు ఆసాపును, అతని సహోదరులను అక్కడ యాహ్వే నిబంధన మందసం ఎదుట, మందసం ఎదుట నిత్యం పరిచర్య చేయడానికి విడిచిపెట్టాడు—ప్రతి రోజు చేయవలసిన విధి ప్రకారం చేయడానికి.[a]
  rationale: The revision restores the Hebrew purpose construction by replacing the modal “చేయాలి” with “పరిచర్య చేయడానికి.” It renders the divine name as “యాహ్వే,” in line with the supplied POB policy, and attaches the lexical footnote to לִדְבַר יוֹם בְּיוֹמוֹ, the phrase it explains. The wording retains the source’s repeated “before the ark” and its sense of regular, day-specific service.
