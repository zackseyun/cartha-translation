  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: te
  text: అతడు ఆసాపును, అతని సహోదరులను అక్కడ యాహ్వే నిబంధన మందసం ఎదుట, మందసం ఎదుట నిత్యం పరిచర్య చేయడానికి విడిచిపెట్టాడు—ప్రతి రోజు చేయవలసిన విధి ప్రకారం చేయడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రోజు అవసరానికి తగినట్లుగా.” హీబ్రూ పదక్షరార్థం, “ఒక రోజు విషయాన్ని దాని రోజున.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: ఉంచాడు
  rationale: עזב యొక్క ప్రాథమిక భావం ‘విడిచిపెట్టడం/ఉండనివ్వడం’. ఈ పరిపాలనా సందర్భంలో ఆసాఫును, అతని సహోదరులను అక్కడ కొనసాగుతున్న సేవకోసం ఉంచాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘నియమించాడు’ అనేది సాధ్యమైనప్పటికీ మరింత వ్యాఖ్యానాత్మకం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: వారు ఉండిపోయిన స్థలాన్ని సూచించే సాధారణ స్థానవాచక క్రియావిశేషణం.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం ఎదుట
  rationale: లִפְנֵי యొక్క స్థలపరమైన, ఆరాధనాపరమైన భావాన్ని ‘ఎదుట’ నిలుపుతుంది. నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన పదక్రమంతో వ్యక్తం చేసింది.
- source_word: לְאָסָף וּלְאֶחָיו
  choice: ఆసాఫును, అతని సహోదరులను
  rationale: אֶחָיו అక్షరార్థంగా ‘అతని సహోదరులు’; ఈ లేవీయ సేవా సందర్భంలో తోటి బంధువులు లేదా సహచరులను కూడా సూచించవచ్చు. మూలంలోని సామూహిక సంబంధాన్ని కాపాడేందుకు ‘సహోదరులు’ ఎంచుకున్నాం.
- source_word: לְשָׁרֵת
  choice: సేవను ... చేయాలి
  rationale: שרת పవిత్రస్థల లేదా ఆరాధనా పరిచర్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘సేవ చేయడం’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆరాధనా భావాన్ని కూడా నిలుపుతుంది.
- source_word: לִפְנֵי הָאָרוֹן
  choice: మందసం ఎదుట
  rationale: పునరావృతమైన హీబ్రూ పదబంధాన్ని స్థలపరమైన, ఆరాధనాపరమైన అర్థాలతో స్థిరంగా అనువదించింది.
- source_word: תָּמִיד
  choice: నిరంతరం
  rationale: కొనసాగుతూ, క్రమంగా జరిగే ఆరాధనా సేవను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతిరోజు చేయవలసిన సేవను ఆ రోజున
  rationale: ‘ఒక దినపు విషయం దాని దినంలో’ అనే హీబ్రూ నుడికారంలోని రోజువారీ నిర్దిష్ట బాధ్యత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘ఆ రోజున’ అనే కాలసూచనను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో నిబంధన దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో వాడి, మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ రూపాన్ని పాదసూచికలో ఇచ్చాం; సాధారణ బిరుదైన ‘ప్రభువు’తో దైవనామాన్ని భర్తీ చేయలేదు.
- issue: אֶחָיו యొక్క సంబంధార్థం
  choice: సహోదరులు
  alternative: తోటి లేవీయులు / బంధువులు
  rationale: పదం అక్షరార్థ సంబంధాన్ని నిలుపుతూ, సందర్భంలో విస్తృత సహచర లేదా వంశసంబంధ భావం ఉండే అవకాశాన్ని మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మందసం’, ‘నిబంధన’, ‘సహోదరులు’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, వాక్యనిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. మూలంలోని ‘రోజు విషయం దాని రోజున’ అనే నుడికారాన్ని అతిగా అక్షరానువాదం చేయకుండా రోజువారీ నిర్దిష్ట సేవ భావంతో అందించాం.
