  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: te
  text: మరియు ఆయన దానిని యాకోబుకు శాసనంగా[a], ఇశ్రాయేలుకు శాశ్వత నిబంధనగా[b] స్థిరపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నియమంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిత్య నిబంధనగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: ఆయన దానిని ... స్థిరపరిచాడు
  rationale: עמד హిఫీల్ రూపం ఏదైనా నిలిచేలా లేదా దృఢంగా ఉండేలా చేయడాన్ని సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం ముందటి సందర్భంలోని నిబంధన లేదా ప్రమాణాన్ని సూచిస్తుంది; ‘దానిని’ అనే పదం ఆ సూచనలోని కొంత సందిగ్ధతను నిలుపుతుంది.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: לְ పరోక్ష కర్మను లేదా లబ్ధిదారుని సూచిస్తుంది; సమాంతరమైన ‘ఇశ్రాయేలుకు’తోనూ ఇది సహజంగా సరిపోతుంది.
- source_word: לְחֹק
  choice: శాసనంగా
  rationale: חֹק స్థిరంగా నియమించబడిన శాసనం లేదా విధిని సూచిస్తుంది. ‘శాసనం’ దాని అధికారిక, న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: ‘యాకోబుకు’ అనే సమాంతర పదబంధాన్ని అనుసరిస్తూ హెబ్రీ పునరుక్తిని యథాతథంగా ఉంచుతుంది.
- source_word: בְּרִית עוֹלָם
  choice: శాశ్వత నిబంధనగా
  rationale: בְּרִית అనే ప్రధాన దైవశాస్త్ర పదానికి ‘నిబంధన’ సరైన స్థిరమైన అనువాదం. עוֹלָם ఇక్కడ నిరంతరమైన, నిలిచివుండే స్వభావాన్ని సూచిస్తుంది; ‘శాశ్వత’ దానిని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దానిని’ అనే ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: ముందటి వచనాల్లోని నిబంధనాత్మక వాగ్దానం లేదా ప్రమాణానికి సాధారణ సూచనగా ‘దానిని’ ఉంచడం
  alternative: ప్రత్యేకంగా ‘ప్రమాణాన్ని’ అని స్పష్టీకరించడం
  rationale: 16–17 వచనాల సందర్భంలో నిబంధన, పలికిన మాట, ప్రమాణం దగ్గరగా సమాంతరంగా ఉన్నాయి. మూలంలోని ప్రత్యయాన్ని ‘దానిని’గా ఉంచడం ద్వారా ఒకే పూర్వపదాన్ని బలవంతంగా నిర్ణయించకుండా మూలంలోని అనుసంధాన సందిగ్ధత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ వాక్యంలోని సమాంతర నిర్మాణం, యాకోబు/ఇశ్రాయేలు పునరుక్తి, నిబంధనాత్మక న్యాయభావం నిలుపబడ్డాయి.
