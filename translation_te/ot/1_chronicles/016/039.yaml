  edition: WLC
  text: וְ/אֵ֣ת צָד֣וֹק הַ/כֹּהֵ֗ן וְ/אֶחָי/ו֙ הַ/כֹּ֣הֲנִ֔ים לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה בַּ/בָּמָ֖ה אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: te
  text: యాజకుడైన సాదోకును, అతని తోటి యాజకులనూ[a] గిబ్యోనులోని ఉన్నత స్థలంలో యెహోవా నివాసగుడారం ఎదుట ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయులో: “అతని సహోదరులు, యాజకులు.”'
    reason: అֶחָיו యొక్క అక్షరార్థాన్ని చూపిస్తూ, సందర్భానుసారంగా ఇచ్చిన ‘తోటి యాజకులు’ అనే అనువాదాన్ని పారదర్శకంగా ఉంచుతుంది.
lexical_decisions:
- source_word: וְאֵת
  choice: —ను ... ఉంచాడు
  rationale: אֵת ప్రత్యక్ష కర్మ సూచిక; తెలుగులో కర్మవిభక్తి ‘ను’తో వ్యక్తమైంది. ముందటి వచనంలోని క్రియ ఈ వాక్యంలో కొనసాగుతున్నందున సహజమైన స్పష్టత కోసం ‘ఉంచాడు’ను పునరుక్తం చేశాం.
- source_word: צָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకు
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, నిర్దిష్ట పదవిని సహజమైన విశేషణ నిర్మాణంతో తెలిపాం.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: అతని తోటి యాజకులను
  rationale: అక్షరార్థంగా ‘అతని సహోదరులను, యాజకులను.’ ఈ సేవా సందర్భంలో אֶחָיו సహచర సమూహాన్ని సూచిస్తుంది; ‘తోటి యాజకులు’ జీవసంబంధ సహోదరులనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: పవిత్రస్థలానికి ఎదురుగా లేదా దాని సన్నిధిలో ఉన్న స్థానాన్ని తెలిపే సహజమైన తెలుగు పదం.
- source_word: מִשְׁכַּן יְהוָה
  choice: యెహోవా మందిరం
  rationale: מִשְׁכָּן దేవుని నివాస గుడారాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు సహజంగా ఉండే ‘మందిరం’ను ఎంచుకున్నాం; ఇది ఇక్కడ తరువాతి యెరూషలేము ఆలయాన్ని సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామం YHWHను తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే రూపంలో ప్రత్యక్షంగా లిప్యంతరీకరించాం.
- source_word: בַּבָּמָה
  choice: ఉన్నత స్థలంలో
  rationale: బలి ఆరాధన జరిగే ఎత్తైన పవిత్రస్థలాన్ని సూచించే సాంకేతిక భావాన్ని నిలిపాం; సందర్భం ఇవ్వని ప్రతికూల తీర్పును చేర్చలేదు.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: గిబియోనులోని
  rationale: ఉన్నత స్థలం ఎక్కడ ఉందో తెలిపే సంబంధ వాక్యాన్ని తెలుగులో సంక్షిప్తమైన విశేషణ నిర్మాణంగా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్ష నామంగానే ఉంచాం. తెలుగు సాధారణ బైబిలు పాఠకులకు ‘యెహోవా’ సుపరిచిత రూపం.
- issue: אֶחָיו అనే బంధుత్వపదం భావం
  choice: అతని తోటి యాజకులు
  alternative: అతని సహోదరులైన యాజకులు
  rationale: ఈ పరిపాలనా, ఆరాధనా సందర్భంలో పదం యాజక సహచరులను సూచించగలదు. జీవసంబంధాన్ని ఖచ్చితంగా నిర్ధారించకుండా సందర్భార్థాన్ని సహజంగా వ్యక్తం చేశాం.
- issue: גבעוןలోని במה స్వభావం
  choice: ఉన్నత స్థలం
  alternative: పూజాస్థలం
  rationale: మూలంలోని సాంస్కృతిక పదాన్ని నిలిపి, అది తప్పనిసరిగా విగ్రహారాధనా కేంద్రమనే తరువాతి ప్రతికూల భావాన్ని ఈ సందర్భంపై మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. ఈ వచనం ముందటి వచనపు క్రియపై వ్యాకరణపరంగా ఆధారపడటంతో, స్వతంత్ర వచనంగా స్పష్టంగా చదవడానికి ‘ఉంచాడు’ను సరఫరా చేశాం.
