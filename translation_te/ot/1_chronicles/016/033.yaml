source:
  edition: WLC
  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: te
  text: అప్పుడు అడవిలోని చెట్లు యాహ్వే సన్నిధిలో ఆనందగానం చేస్తాయి[a]; ఎందుకంటే భూమికి[c] తీర్పు తీర్చడానికి ఆయన వస్తున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆనందంతో కేకలు వేస్తాయి.’ హీబ్రూ క్రియ ఆనందంతో గట్టిగా ధ్వనించడాన్ని సూచించవచ్చు—అది పాడడం కావచ్చు, కేకలు వేయడం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన వస్తాడు.’ కవితాత్మక సందర్భంలో హీబ్రూ రూపం సమీపిస్తున్న కార్యాన్నీ, నిశ్చయంగా జరిగే కార్యాన్నీ సజీవంగా వ్యక్తపరచవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దేశానికి.’ ఈ హీబ్రూ పదం స్థానికంగా ‘దేశం’ అని కూడా అర్థమవుతుంది; ఇక్కడ విశ్వసృష్టి సందర్భం ‘భూమి’ అనే విస్తృత అర్థానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి దృశ్యాన్ని లేదా ఫలితాన్ని పరిచయం చేసే కాలవాచక క్రియావిశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: יְרַנְּנוּ
  choice: ఆనందగానం చేస్తాయి
  rationale: רנן పియేల్ రూపం ఆనందంతో గట్టిగా ధ్వనించడాన్ని—పాడడమో కేకలు వేయడమో—సూచిస్తుంది; కవితాత్మక సందర్భంలో ‘ఆనందగానం’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עֲצֵי הַיָּעַר
  choice: అడవిలోని చెట్లు
  rationale: హీబ్రూ సంబంధపదబంధాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, చెట్ల వ్యక్తీకరణను నిలుపుతుంది.
- source_word: מִלִּפְנֵי
  choice: సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఆనందించడం అనే భావాన్ని తెలుగులో సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సృష్టి ఆనందించడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בָא
  choice: వస్తున్నాడు
  rationale: కవితాత్మక సందర్భంలో సమీపిస్తున్న లేదా నిశ్చయమైన కార్యాన్ని సజీవంగా వ్యక్తపరుస్తుంది; రూపానికి ‘వస్తాడు’ అనే భావసాధ్యత కూడా ఉంది.
- source_word: לִשְׁפּוֹט
  choice: తీర్పు తీర్చడానికి
  rationale: దైవిక న్యాయనిర్ణయ భావాన్ని స్పష్టంగా ఉంచే సహజ తెలుగు ప్రయోగం.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: సృష్టి అంతటినీ ఆహ్వానించే విశ్వవ్యాప్త సందర్భంలో ‘దేశం’ కంటే ‘భూమి’ తగినది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: הָאָרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం
  rationale: అడవి చెట్లు ఆనందించే విశ్వసృష్టి సందర్భం విస్తృత అర్థాన్ని బలపరుస్తుంది; అయినా హీబ్రూ పదానికి స్థానికంగా ‘దేశం’ అనే అర్థం సాధ్యమే.
- issue: בָא యొక్క కాల/దృక్కోణ భావం
  choice: వస్తున్నాడు
  alternative: వస్తాడు
  rationale: కవితలో సమీపిస్తున్న నిశ్చిత కార్యానికి ఉన్న సజీవతను నిలుపుతుంది; హీబ్రూ రూపం సందర్భానుసారం నిశ్చయమైన రాకను కూడా తెలియజేయగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. చెట్ల వ్యక్తీకరణను నిలుపుతూ, దైవనామాన్ని ‘యాహ్వే’గా ఉంచింది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
