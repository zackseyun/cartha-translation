source:
  edition: WLC
  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: te
  text: ఆయన నిబంధనను ఎప్పటికీ జ్ఞాపకం చేసుకోండి; వెయ్యి తరాల వరకు ఆయన ఆజ్ఞాపించిన వాక్యాన్ని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వాగ్దానాన్ని.”'
    reason: דָּבָר అనే పదానికి సందర్భానుసారంగా ‘వాగ్దానం’ అనే అర్థం కూడా సాధ్యమైనందున.
lexical_decisions:
- source_word: זִכְרוּ
  choice: జ్ఞాపకం చేసుకోండి
  rationale: సమాజాన్ని ఉద్దేశించిన పుంలింగ బహువచన ఆజ్ఞార్థక రూపం. ఆధునిక ప్రామాణిక తెలుగులో ప్రత్యక్ష పిలుపును సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: לְעוֹלָם
  choice: ఎప్పటికీ
  rationale: నిరంతరమైన, శాశ్వతమైన జ్ఞాపకాన్ని సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో సహజమైన సమానం.
- source_word: בְּרִיתוֹ
  choice: ఆయన నిబంధనను
  rationale: దేవుని బంధకరమైన ఏర్పాటు లేదా కట్టుబాటును సూచించే בְּרִית‌కు స్థిరమైన, తగిన తెలుగు పదం.
- source_word: דָּבָר
  choice: వాక్యాన్ని
  rationale: మూలపదంలోని ‘మాట/వాక్యం’ అనే విస్తృత అర్థాన్ని నిలుపుతుంది. సందర్భంలో ‘వాగ్దానం’ అనే భావం సాధ్యమైనా, దానిని ప్రధాన పాఠ్యంలో ఖరారు చేయకుండా అడుగుసూచనలో ఉంచాం.
- source_word: צִוָּה
  choice: ఆయన ఆజ్ఞాపించిన
  rationale: צוה యొక్క సాధారణ అర్థమైన ‘ఆజ్ఞాపించు’ అనే బలాన్ని నేరుగా నిలుపుతుంది; ‘స్థాపించిన’ వంటి సందర్భానుసార సవరణను నివారిస్తుంది.
- source_word: לְאֶלֶף דּוֹר
  choice: వెయ్యి తరాలకు
  rationale: లామెద్‌ను లక్ష్యం/వ్యాప్తిగా సహజంగా వ్యక్తం చేస్తూ, తరతరాలపాటు నిలిచే భావాన్ని ఇస్తుంది; ‘వెయ్యి’ అక్షరార్థమా లేక విస్తారకాల సూచనా అన్నది నిర్ణయించదు.
theological_decisions:
- issue: דָּבָר‌ను ‘వాక్యం’గా అనువదించాలా, నిబంధన సందర్భాన్ని బట్టి ‘వాగ్దానం’గా అనువదించాలా
  choice: వాక్యాన్ని
  alternative: వాగ్దానాన్ని
  rationale: మూల హీబ్రూ పదం ‘వాగ్దానం’ కంటే విస్తృతమైనది. నిబంధనతో సమాంతరంగా ఉండటం వాగ్దాన భావాన్ని సూచించగలిగినా, ఆ భావాన్ని ప్రధాన పాఠ్యంలోనే నిర్ణయించకుండా మూలంలోని అర్థ విస్తృతిని కాపాడి ప్రత్యామ్నాయాన్ని అడుగుసూచనలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక ఆజ్ఞను గౌరవ బహువచనంతో వ్యక్తం చేశాం. కవితాత్మక సమాంతరతను స్పష్టపరచడానికి దీర్ఘ విరామచిహ్నం వాడాం; భాషను సహజంగా ఉంచుతూ మూలంలోని ‘నిబంధన/వాక్యం/ఆజ్ఞాపించాడు’ అనే సంబంధాన్ని కాపాడాం.
