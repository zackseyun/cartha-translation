translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. జాబితా వంటి హీబ్రూ వాక్యనిర్మాణాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘వారి దగ్గర ఉన్నాయి’ అనే క్రియాభాగం పూరించబడింది. మూలంలోని సంక్షిప్తమైన לַשָּׁעַר ప్రయోగంలోని స్థలార్థం/విధి అర్థం మధ్య సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా కాపాడాం.
