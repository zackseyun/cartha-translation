source:
  edition: WLC
  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: te
  text: వారితోపాటు హేమాను, యెదూతూను కూడా ఉన్నారు; వారి వద్ద బిగ్గరగా మ్రోగించడానికి బాకాలు, తాళాలు, దేవుని గీతాల కోసం వాద్యాలు ఉన్నాయి. యెదూతూను కుమారులు ద్వారం దగ్గర ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్వారపాలకులుగా ఉన్నారు.” హీబ్రూలో అక్షరార్థంగా “ద్వారానికి/ద్వారం కోసం” అని ఉంది; ఇది వారికి అప్పగించిన ద్వారసేవను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: వారితోపాటు ... ఉన్నారు
  rationale: హీబ్రూ ఉపసర్గ పదబంధం వెంట ఉన్న వ్యక్తులను పరిచయం చేస్తుంది. తెలుగులో పూర్తి, సహజ వాక్యంగా ఉండేందుకు ‘ఉన్నారు’ చేర్చబడింది.
- source_word: הֵימָן וִידוּתוּן
  choice: హేమాను, యెదూతూను
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: חֲצֹצְרוֹת
  choice: బాకాలు
  rationale: ఆరాధనలో ఉపయోగించే లోహపు ceremonial trumpets‌ను సూచించే సాధారణ, సందర్భోచిత తెలుగు పదం.
- source_word: וּמְצִלְתַּיִם
  choice: తాళాలు
  rationale: ఒకదానికొకటి తాకించి మ్రోగించే cymbals‌కు సహజమైన తెలుగు సమానం.
- source_word: לְמַשְׁמִיעִים
  choice: బిగ్గరగా మ్రోగించడానికి
  rationale: שמע ధాతువు హిఫీల్ రూపంలో ‘వినిపించు/ధ్వనింపజేయు’ అనే భావం ఉంది. ఇక్కడ బాకాలు, తాళాల బహిరంగ ధ్వనిని సహజంగా తెలియజేస్తుంది; ప్రత్యేకమైన రాగం లేదా సంగీతరీతిని అదనంగా నిర్దేశించదు.
- source_word: וּכְלֵי שִׁיר
  choice: గీతాల వాద్యాలు
  rationale: అక్షరార్థంగా ‘గీతపు/గీతాల వాద్యాలు.’ ‘సంగీత వాద్యాలు’ అని సాధారణీకరించకుండా హీబ్రూ సంబంధాన్ని నిలిపింది.
- source_word: הָאֱלֹהִים
  choice: దేవుని
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలిపి ‘దేవుని గీతాలు’ అని అనువదించాం. ఇవి దేవుని ఆరాధనకు చెందిన గీతాలనే సూచించవచ్చు, కాని ప్రధాన పాఠ్యంలో ఆ భావాన్ని మరింత సంకుచితం చేయలేదు.
- source_word: וּבְנֵי יְדוּתוּן
  choice: యెదూతూను కుమారులు
  rationale: వంశ/లేవీయుల సందర్భంలో בְּנֵי అనే పదానికి లింగసూచకమైన, నేరమైన అనువాదం.
- source_word: לַשָּׁעַר
  choice: ద్వారం దగ్గర ఉన్నారు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ద్వారానికి/ద్వారం కోసం’ అని ఉంది. సందర్భంలో ద్వారసేవ నియామకం కావచ్చు; ప్రధాన పాఠ్యం ఆ అర్థాన్ని ఖచ్చితంగా నిర్ణయించకుండా స్థలార్థాన్ని సహజ తెలుగులో ఉంచుతుంది.
