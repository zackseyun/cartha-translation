  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: te
  text: వారిని అణచివేయడానికి ఆయన ఎవరినీ అనుమతించలేదు; వారి నిమిత్తం[a] రాజులను మందలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి కోసం,’ లేక ‘వారి కారణంగా.’
    reason: עֲלֵיהֶם అనే పదబంధం ప్రయోజనార్థక లేదా కారణార్థక ఛాయలను కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: הִנִּיחַ
  choice: అనుమతించలేదు
  rationale: హిఫీల్ రూపం לֹא మరియు క్రియార్థక రూపంతో కలిసి ‘అనుమతించు’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ఈ ప్రయోగం సహజంగా, స్పష్టంగా ఉంది.
- source_word: אִישׁ
  choice: ఎవరూ
  rationale: ఏ ఒక్క వ్యక్తినీ సూచించే సాధారణ ఏకవచన ప్రయోగం. ‘ఎవరూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిషేధార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְעָשְׁקָם
  choice: వారిని అణచివేయడానికి
  rationale: עשׁק అనే క్రియలో అణచివేత, అన్యాయం, దోపిడి వంటి విస్తృత భావాలు ఉన్నాయి; ఈ చారిత్రక సందర్భంలో ‘అణచివేయు’ తగిన విస్తృత అర్థాన్ని ఇస్తుంది.
- source_word: וַיּוֹכַח
  choice: గద్దించాడు
  rationale: יכח ఇక్కడ రాజులకు బలమైన మందలింపు లేదా హెచ్చరిక చేయడాన్ని సూచిస్తుంది; ‘గద్దించాడు’ ఆ బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עֲלֵיהֶם
  choice: వారి నిమిత్తం
  rationale: עַל సర్వనామ ప్రత్యయంతో ఇక్కడ వారి కారణంగా లేదా వారి మేలు కోసం చర్య తీసుకున్న భావాన్ని ఇస్తుంది; అసలు పదబంధంలోని భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
- source_word: מְלָכִים
  choice: రాజులను
  rationale: మూల నామవాచకానికి నేరమైన అర్థం ‘రాజులు’; సాధారణీకరించి ‘పాలకులు’ అనాల్సిన సందర్భ కారణం లేదు.
theological_decisions:
- issue: క్రియలలో అంతర్నిహిత కర్త
  choice: ‘ఆయన’ అనేది పరిసర సందర్భం నుంచి కొనసాగుతున్న దేవుణ్ణి సూచిస్తుంది.
  alternative: కర్తను పేర్కొనకుండా ఉంచడం.
  rationale: ఈ వాక్యం పితరుల పట్ల యెహోవా చూపిన రక్షణాత్మక చర్యల వర్ణనను కొనసాగిస్తుంది. తెలుగులో స్పష్టత కోసం ‘ఆయన’ను చేర్చాం; సందర్భానికి మించిన దైవశాస్త్రీయ వివరణను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సమాంతర వాక్య నిర్మాణాన్ని నిలిపి, మూలంలోని అర్థసందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
