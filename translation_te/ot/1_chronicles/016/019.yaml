    text: లేదా ‘నిజంగానే కొద్దిమంది’ లేదా ‘దాదాపు ఎవరూ లేనంత కొద్దిమంది’; హెబ్రీ పదబంధం వారి సంఖ్య ఎంత స్వల్పమో బలంగా నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: మీరు … ఉన్నప్పుడు
  rationale: בְּ + היה ధాతువు యొక్క infinitive construct, రెండవ పురుష బహువచన ప్రత్యయంతో కలిసి కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. తెలుగులో ‘మీరు … ఉన్నప్పుడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מְתֵי מִסְפָּר
  choice: సంఖ్యలో కొద్దిమందిగా
  rationale: ఈ హెబ్రీ నానుడి లెక్కించదగినంత కొద్దిమందిని సూచిస్తుంది. ‘సంఖ్యలో కొద్దిమందిగా’ దాని సంఖ్యాపరమైన భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: כִּמְעַט
  choice: అతి కొద్దిమందిగా
  rationale: ఇక్కడ ఈ పదం ముందున్న స్వల్పసంఖ్య భావాన్ని మరింత బలపరుస్తుంది. ‘అతి కొద్దిమందిగా’ ఆ తీవ్రతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యమైన సూక్ష్మార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: וְגָרִים
  choice: పరదేశులుగా
  rationale: גור అనే ధాతువు తమ స్వదేశం కాని చోట తాత్కాలికంగా నివసించడాన్ని సూచిస్తుంది. ‘పరదేశులుగా’ అనేది అపరిచితులు అనే సాధారణ భావం కంటే నివాసస్థితిని మెరుగ్గా ప్రతిబింబిస్తుంది.
- source_word: בָּהּ
  choice: ఆ దేశంలో
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం పరిసర సందర్భంలోని దేశాన్ని సూచిస్తుంది. తెలుగులో సూచ్యవిషయాన్ని స్పష్టంచేయడానికి ‘ఆ దేశంలో’ అని అనువదించడం సహజం.
