translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. మూలంలోని కాలసూచక నిర్మాణం చివరి ‘ఉన్నప్పుడు’లో సమీకరించబడింది; వాక్యం తరువాతి వచనంతో కొనసాగుతుందనే స్వభావాన్ని కామా నిలుపుతుంది.
