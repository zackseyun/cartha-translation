translation:
  language: te
  text: మీరు సంఖ్యలో కొద్దిమందిగా, అతి కొద్దిమందిగా[a], ఆ దేశంలో పరదేశులుగా ఉన్నప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
