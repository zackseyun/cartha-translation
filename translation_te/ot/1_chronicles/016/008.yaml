source:
  edition: WLC
  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: te
  text: 'యహ్వేకు కృతజ్ఞతలు చెల్లించండి;

    ఆయన నామాన్ని పిలుచుకోండి;

    ప్రజల మధ్య[a] ఆయన కార్యాలను[b] తెలియజేయండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రజల మధ్య’; లేదా ‘జాతుల మధ్య.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన క్రియలను’; హీబ్రూ పదం ఆయన చేసిన పనులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: కృతజ్ఞతలు చెల్లించండి
  rationale: స్తుతి సందర్భంలో ידה అనే క్రియ యొక్క హిఫీల్ ఆజ్ఞారూపం దేవునికి కృతజ్ఞతలు లేదా స్తుతి చెల్లించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కృతజ్ఞతలు చెల్లించండి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לַֽיהוָה
  choice: యహ్వేకు
  rationale: మూలపాఠంలో దేవుని ఒడంబడిక నామమైన יהוה నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: קִרְא֣וּ בִשְׁמוֹ
  choice: ఆయన నామాన్ని బట్టి ఆయనకు మొరపెట్టండి
  rationale: קרא בשם ఇక్కడ దేవుని నామాన్ని ఉచ్చరించడం మాత్రమే కాక, ఆయన వెల్లడించిన నామాన్ని ఆధారంగా చేసుకొని ఆయనను వేడుకోవడం లేదా ఆరాధనలో పిలవడం అనే భావాన్ని ఇస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ఈ సహజ రూపాన్ని ఎంచుకున్నాం.
- source_word: הוֹדִ֥יעוּ
  choice: తెలియజేయండి
  rationale: ידע యొక్క హిఫీల్ రూపం ‘ఇతరులు తెలుసుకునేలా చేయండి’ అనే కారణార్థక భావాన్ని కలిగి ఉంది; ‘తెలియజేయండి’ దానిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בָעַמִּים
  choice: ప్రజల మధ్య
  rationale: עַמִּים అనేది అనేక జనసమూహాలను లేదా జాతులను సూచిస్తుంది. ‘ప్రజల మధ్య’ రాజకీయ దేశాల భావాన్ని అనవసరంగా జోడించకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: עֲלִילֹתָיו
  choice: ఆయన కార్యాలను
  rationale: ఈ నామవాచకం ఆయన చేసిన పనులు లేదా క్రియలను సూచిస్తుంది. మూలంలో లేని ‘మహా’ లేదా ‘శక్తివంతమైన’ వంటి విశేషణాలను జోడించకుండా ‘కార్యాలు’ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, మూలంలోని ఒడంబడిక నామాన్ని తెలుగులో ‘యహ్వే’గా ఇచ్చాం.
- issue: קרא בשם లోని ఆరాధనా భావం
  choice: ఆయన నామాన్ని బట్టి ఆయనకు మొరపెట్టండి
  alternative: ఆయన నామాన్ని ప్రకటించండి; ఆయన నామాన్ని పిలవండి
  rationale: ఈ సందర్భంలో ఈ పదబంధం దేవునికి చేసే ఆరాధనాత్మక విన్నపాన్ని సహజంగా సూచిస్తుంది. అయితే కేవలం నామోచ్చారణ లేదా ప్రకటనగా మాత్రమే అర్థాన్ని కుదించకుండా, నామాన్ని ఆధారంగా చేసుకొని దేవునికి మొరపెట్టే భావాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవప్రదమైన ఆజ్ఞారూపాలను ఉపయోగించాం. పద్యంలోని మూడు సమాంతర ఆజ్ఞలను పంక్తులుగా ఉంచి లయను నిలిపాం. మూలంలో లేని బలవర్ధక విశేషణాలను జోడించలేదు; ఆంగ్ల consultation layer లో తప్పుగా స్థానబద్ధమైన పాదసూచిక గుర్తులను అవి వివరిస్తున్న తెలుగు పదాల దగ్గర సరిచేశాం.
