source:
  edition: WLC
  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే గొప్పవాడు, ఎంతో స్తుతించదగినవాడు; దేవుళ్లందరికంటే ఆయన భయభక్తులకు పాత్రుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుళ్లందరికంటే ఆయన భయభక్తులు కలిగించేవాడు.” హీబ్రూ పదం విస్మయంతో కూడిన భయభక్తిని సూచిస్తుంది.
    reason: נוֹרָא పదంలోని భయం, విస్మయం అనే భావవిస్తృతిని చూపించే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల ఉన్న ఆరాధన పిలుపుకు ఈ వాక్యం కారణాన్ని తెలియజేస్తుంది; అందువల్ల హీబ్రూ పదంలోని వివరణాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גָדוֹל
  choice: గొప్పవాడు
  rationale: హోదా, మహిమ, ఘనతలలో ఉన్న గొప్పతనాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: מְהֻלָּל מְאֹד
  choice: ఎంతో స్తుతించదగినవాడు
  rationale: నిష్క్రియ కృదంతంలోని స్తుతికి పాత్రుడనే భావాన్ని, מְאֹד ఇచ్చే బలమైన తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נוֹרָא
  choice: ఆయనకే భయపడాలి
  rationale: ఈ పదం కలిగించే విస్మయభరితమైన భయభక్తి భావాన్ని కేవలం ‘అద్భుతమైనవాడు’ అని బలహీనపరచకుండా, అలాగే కేవలం భీతిని సూచించే పదంతో కుదించకుండా క్రియాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: עַל כָּל אֱלֹהִים
  choice: దేవుళ్లందరికంటే
  rationale: עַל ఇక్కడ తెలిపే తులనాత్మక ఆధిక్యాన్ని ‘అందరికంటే’ ద్వారా స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది; אֱלֹהִים బహువచనాన్ని ‘దేవుళ్లు’గా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ హీబ్రూ నామానికి సాధారణ పాండిత్య లిప్యంతరీకరణ.
- issue: נוֹרָא పదంలో భయం మరియు విస్మయం మధ్య సంబంధం
  choice: ఆయనకే భయపడాలి
  alternative: ఆయన భయభక్తులు కలిగించేవాడు / ఆయన విస్మయకరుడు
  rationale: మూలపదంలోని భయభక్తి, విస్మయం రెండింటి ఉద్వేగాన్ని నిలుపుతూ, ఆధునిక వాడుకలో బలహీనపడగల ‘అద్భుతమైనవాడు’ అనే భావానికి పరిమితం చేయదు. పాదసూచిక నిజమైన భావవిస్తృతిని తెలియజేస్తుంది.
- issue: ‘దేవుళ్లు’ అనే బహువచనం
  choice: దేవుళ్లందరికంటే
  alternative: దైవిక ప్రాణులందరికంటే
  rationale: אֱלֹהִים యొక్క సరళమైన బహువచన అర్థాన్ని నిలుపుతుంది; ఈ ఒక్క వాక్యంలో వారి స్వరూపం లేదా ఉనికి గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గంభీరతతో అనువదించబడింది. సమాంతర వాక్య నిర్మాణాన్ని అర్ధవిరామంతో నిలిపి, ‘ఆయనకే’ ద్వారా దేవుళ్లందరిపై యాహ్వేకు ఉన్న ఆధిక్యాన్ని సహజంగా వ్యక్తం చేసింది.
