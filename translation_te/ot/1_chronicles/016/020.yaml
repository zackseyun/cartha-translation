revisions:
- from: 'వారు ఒక జనంనుంచి మరో జనానికి,

    ఒక రాజ్యంనుంచి మరో ప్రజ దగ్గరికి సంచరించారు.'
  to: 'వారు ఒక జాతి నుండి మరో జాతికి,

    ఒక రాజ్యం నుండి మరొక ప్రజా సమూహం వద్దకు సంచరించారు.'
  rationale: The revision retains the source’s parallel syntax and the sense of repeated movement while replacing the inaccurate/unnatural final phrase with modern standard Telugu. No footnote is needed because the translation does not introduce a material alternative beyond the source’s ordinary collective sense.
