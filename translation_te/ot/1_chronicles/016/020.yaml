  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతర నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి.
