  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: te
  text: 'వారు ఒక జాతి నుండి మరో జాతికి,

    ఒక రాజ్యం నుండి మరొక ప్రజా సమూహం వద్దకు సంచరించారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: సంచరించారు
  rationale: הלך అనే క్రియ యొక్క హిత్పయేల్ రూపం ఇక్కడ ఒకేచోటికి వెళ్లడాన్ని కాక, చోటుచోటికి తిరుగుతూ వెళ్లడాన్ని సూచిస్తుంది. ‘సంచరించారు’ ఆ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: ఒక జనంనుంచి మరో జనానికి
  rationale: גּוֹי అంటే ఇక్కడ ‘జనం/జాతి.’ హెబ్రీలోని ‘నుంచి...కు...’ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, పునరుక్తిని నిలుపుతుంది.
- source_word: וּמִמַּמְלָכָה
  choice: ఒక రాజ్యంనుంచి
  rationale: מַמְלָכָה అంటే ‘రాజ్యం.’ హెబ్రీలో సంఖ్యావాచకం స్పష్టంగా లేకపోయినా, సమాంతర నిర్మాణంలోని పంపిణీ భావాన్ని తెలుగులో ‘ఒక’ సహజంగా తెలియజేస్తుంది.
- source_word: אֶל עַם אַחֵר
  choice: మరో ప్రజ దగ్గరికి
  rationale: עַם ను ‘ప్రజ’గా అనువదించడం ద్వారా ముందు వచ్చిన גּוֹי (‘జనం’)తో ఉన్న పదభేదం నిలుస్తుంది. సమూహార్థకమైన ‘ప్రజ’తో ‘దగ్గరికి’ సహజంగా సరిపోతుంది.
