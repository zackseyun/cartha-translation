  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: te
  text: 'ఆయన సేవకుడైన ఇశ్రాయేలు సంతానమా,[a]

    ఆయన ఎంచుకున్నవారైన యాకోబు కుమారులారా![b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు విత్తనమా’; హీబ్రూలో ఈ పదం వంశస్థులను సమష్టిగా సూచించే ఏకవచనం.
    reason: lexical_alternative
  - marker: b
    text: ‘కుమారులు’ అనే హీబ్రూ పదం ఇక్కడ యాకోబు వంశస్థులను సమష్టిగా సూచిస్తుంది; ‘యాకోబు పిల్లలారా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయన ఎన్నికైనవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: సంతానం
  rationale: ఈ పదం ఇక్కడ ఇశ్రాయేలు వంశస్థులను సమష్టిగా సూచిస్తుంది. ‘సంతానం’ సామూహిక ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: వ్యక్తి/నిబంధన సంబంధిత పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: עַבְדּוֹ
  choice: ఆయన సేవకుడైన
  rationale: ఇక్కడ సామాజిక బానిసత్వం కంటే దేవునితో ఇశ్రాయేలుకున్న నిబంధన సంబంధం ప్రధానంగా ఉంది; అందువల్ల ‘సేవకుడు’ సందర్భానికి తగినది.
- source_word: בְּנֵי
  choice: కుమారులారా
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘కుమారులు’; సంబోధనాత్మక కవితా నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: పితరుడి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בְּחִירָיו
  choice: ఆయన ఎన్నుకున్నవారలారా
  rationale: దేవుడు ఎన్నుకున్న బహువచన సమూహాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రత్యేక సిద్ధాంత పరిభాషగా వినిపించగల పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ‘ఆయన సేవకుడు’, ‘ఆయన ఎన్నుకున్నవారు’ అనే పదబంధాల్లోని తృతీయ పురుష ఏకవచన ప్రత్యయ సూచన
  choice: ‘ఆయన’ దేవుణ్ణి సూచించేలా ఉంచడం
  alternative: కవితా సమాంతర నిర్మాణంలో సూచిత వ్యక్తిని మరింత అనిర్దిష్టంగా ఉంచడం
  rationale: చుట్టుపక్కల సందర్భంలో యెహోవా కార్యాలను జ్ఞాపకం చేసుకోవాలనే పిలుపు ఉంది; కాబట్టి ఇశ్రాయేలు దేవుని సేవకుడుగాను, యాకోబు సంతానం ఆయన ఎన్నుకున్నవారుగాను పేర్కొనబడటం సహజ పఠనం. అయినా మూలంలోని సర్వనామ రూపాన్నే అనుసరించి దేవుని పేరును నేరుగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా సంబోధనకు తగిన గౌరవప్రదమైన, సహజమైన శైలి. రెండు సమాంతర పాదాలు మరియు బహువచన సంబోధన నిలుపబడ్డాయి.
