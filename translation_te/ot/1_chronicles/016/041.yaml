    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతం.” ఇది ఆరాధనలో పదేపదే వచ్చే పల్లవి.
