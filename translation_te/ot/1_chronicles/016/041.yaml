id: 1CH.16.41
reference: 1 Chronicles 16:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: te
  text: వారితోపాటు హేమాను, యెదూతూను, ఎంపిక చేయబడిన మిగిలినవారూ ఉన్నారు. వీరందరినీ పేరుపేరున పేర్కొన్నారు[a], యెహోవాకు కృతజ్ఞతలు చెల్లించడానికి; ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతంగా ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేర్లతో ప్రత్యేకంగా పేర్కొనబడ్డారు” లేదా “ఒక్కొక్కరి పేరుతో గుర్తించబడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతం.” ఇది ఆరాధనలో పదేపదే వచ్చే పల్లవి.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: వారితోపాటు ... కూడా ఉన్నారు
  rationale: ముందటి వచనంలోని నియమితులతో కలిసి ఉన్న ఈ బృందాన్ని పరిచయం చేస్తుంది. తరువాత అనేక పేర్లు, ఒక సమూహం రావడం వల్ల తెలుగులో బహువచన భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: הֵימָן וִידוּתוּן
  choice: హేమాను, యెదూతూను
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: మిగిలిన ఎంపికైనవారు
  rationale: שְׁאָר అనే ‘మిగిలినవారు’ భావాన్నీ, הַבְּרוּרִים అనే ఎంపిక చేయబడినవారి భావాన్నీ అదనంగా ‘పురుషులు’ అని చేర్చకుండా నిలిపాం.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: పేరుపేరున నియమించబడిన
  rationale: వారిని పేర్లతో స్పష్టంగా గుర్తించి నియమించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘పేర్లతో పేర్కొనబడిన’ అనే ప్రత్యామ్నాయ భావసూక్ష్మతను పాదసూచికలో ఉంచాం.
- source_word: לְהֹדוֹת
  choice: కృతజ్ఞతలు చెల్లించడానికి
  rationale: ఆరాధనా సందర్భంలో ידה హిఫిల్ రూపం కృతజ్ఞతలు తెలపడం లేదా స్తుతించడం అనే భావం కలిగి ఉంటుంది; తరువాతి ఆరాధనా పల్లవికి ‘కృతజ్ఞతలు చెల్లించడం’ బాగా సరిపోతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతంగా ఉంటుంది
  rationale: כִּיను కృతజ్ఞతకు కారణంగా, חֶסֶדను నిలకడగల నిబద్ధ ప్రేమగా వ్యక్తం చేశాం. హీబ్రూలో క్రియ లేకున్నా తెలుగులో సహజ వాక్యానికి ‘ఉంటుంది’ చేర్చాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: חֶסֶד యొక్క భావవ్యాప్తి
  choice: స్థిరమైన ప్రేమ
  alternative: కృప; నిబంధన ప్రేమ; కనికరం
  rationale: ఈ పదంలో ప్రేమ, విశ్వసనీయత, నిబద్ధత అనే భావాలు కలిసి ఉన్నాయి. ‘స్థిరమైన ప్రేమ’ ఏకైక సిద్ధాంతపరమైన నిర్వచనానికి పరిమితం చేయకుండా ఆ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. మూలంలోని పేర్లతో నియామకం, కృతజ్ఞత, חֶסֶד యొక్క నిలకడ అనే అంశాలను కాపాడాం; పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో ఉంచాం.
