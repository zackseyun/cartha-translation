  yaml_path: translation/ot/1_chronicles/016/018.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: te
  text: ఇలా చెబుతూ, “మీ[a] వారసత్వ భాగమైన[b] కనాను దేశాన్ని నీకు ఇస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నీకు’ అనేది ఏకవచనం; ‘మీ వారసత్వం’ అనేది బహువచనం. పితరునికి ఇచ్చిన వాగ్దానాన్ని అతని సంతతి లేదా సమాజానికి చెందిన వారసత్వంతో పాఠం అనుసంధానించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కేటాయించిన భాగం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అక్షరార్థంగా తాడు లేదా కొలత గీతను సూచిస్తుంది; విస్తృతార్థంలో కొలిచి కేటాయించిన భూభాగాన్ని లేదా వాటాను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: ఇలా చెబుతూ
  rationale: אמר యొక్క క్రియానామ రూపం ముందటి వాక్యంలోని నిబంధన మాటల విషయాన్ని పరిచయం చేస్తుంది; ‘ఇలా చెబుతూ’ తెలుగు వాక్యప్రవాహంలో సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: ఇది పుంలింగ ఏకవచన రూపం. వాగ్దానం నేరుగా ఉద్దేశించబడిన పితరుని సూచించే ఏకవచనాన్ని యథాతథంగా నిలిపింది.
- source_word: אֶתֵּן
  choice: ఇస్తాను
  rationale: נתן ధాతువు యొక్క ప్రథమ పురుష ఏకవచన అసంపూర్ణ రూపం ఇక్కడ వాగ్దాన సందర్భంలో భవిష్యత్ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶרֶץ כְּנָעַן
  choice: కనాను దేశాన్ని
  rationale: వాగ్దానం చేయబడిన నిర్దిష్ట భూభాగాన్ని స్పష్టంగా తెలియజేస్తూ אֶרֶץ యొక్క భౌగోళిక భావాన్ని కాపాడుతుంది.
- source_word: חֶבֶל
  choice: భాగాన్ని
  rationale: ఈ పదానికి అక్షరార్థంగా కొలత తాడు లేదా గీత అనే భావం ఉన్నా, భూమి పంచిపెట్టే సందర్భంలో కొలిచి కేటాయించిన వాటాను సూచిస్తుంది. ‘భాగం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కేటాయింపు భావాన్ని నిలుపుతుంది.
- source_word: נַחֲלַתְכֶם
  choice: మీ స్వాస్థ్య
  rationale: נחלה వారసత్వంగా లభించే ఆస్తిని, ముఖ్యంగా నిబంధనలో వాగ్దానం చేసిన భూమిని సూచిస్తుంది. బహువచన ప్రత్యయాన్ని ‘మీ’తో స్పష్టంగా నిలిపింది.
theological_decisions:
- issue: ఏకవచన సంబోధన నుంచి బహువచన స్వామ్యరూపానికి మార్పు
  choice: ‘నీకు ... మీ స్వాస్థ్య భాగాన్ని’ అని రెండు వచన రూపాలనూ నిలిపివేయడం
  alternative: ‘నీకు ... నీ స్వాస్థ్య భాగాన్ని’ అని అంతటా ఏకవచనంగా సవరించడం; లేదా ‘నీకు, నీ సంతతికి’ అని వివరణను మూలపాఠ్యంలోనే చేర్చడం
  rationale: హీబ్రూ పాఠం לְךָ (‘నీకు,’ ఏకవచనం) నుంచి נַחֲלַתְכֶם (‘మీ స్వాస్థ్యం,’ బహువచనం)కు మారుతుంది. ఈ మార్పు పితరునికి ఇచ్చిన వాగ్దానానికీ అతని సంతతి లేదా సమాజం పొందే స్వాస్థ్యానికీ మధ్య ఉన్న పాఠ్య సంబంధాన్ని వివరణతో సమసిపోనివ్వకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘స్వాస్థ్య భాగం’ నిబంధన భూమి యొక్క వారసత్వ, కేటాయింపు భావాలను కలిపి నిలుపుతుంది; ఏకవచనం నుంచి బహువచనానికి మార్పును ఉద్దేశపూర్వకంగా సవరించలేదు.
