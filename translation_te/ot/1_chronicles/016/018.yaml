revisions:
- from: ఇలా చెబుతూ, “కనాను దేశాన్ని నీకు ఇస్తాను, మీ[a] స్వాస్థ్య భాగాన్ని[b].”
  to: ఇలా చెబుతూ, “మీ[a] వారసత్వ భాగమైన[b] కనాను దేశాన్ని నీకు ఇస్తాను.”
  rationale: 'The revision makes the Hebrew apposition explicit in natural Telugu: Canaan is the inheritance portion to be given. It keeps the singular ‘నీకు’ and plural ‘మీ’ juxtaposed, does not add ‘descendants’ to the verse text, and preserves the land-allotment nuance through the anchored note.'
  reviewer_model: gpt-5.6-terra
