id: 1CH.16.9
reference: 1 Chronicles 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁ֤ירוּ ל/וֹ֙ זַמְּרוּ ל֔/וֹ שִׂ֖יחוּ בְּ/כָל נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: te
  text: ఆయనకు పాడండి; ఆయనకు స్తుతిగీతాలు పాడండి; ఆయన అద్భుత కార్యాలన్నిటి గురించి చెప్పండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన అద్భుత కార్యాలన్నిటి గురించి వివరించండి’ లేదా ‘ఆయన అద్భుత కార్యాలన్నిటిని ధ్యానించండి.’ ఇక్కడి హీబ్రూ క్రియ మాట్లాడటం లేదా మననం చేయడం అనే భావాన్ని సూచించవచ్చు; అయితే ఈ బహిరంగ పిలుపు సందర్భంలో ఇతరులకు చెప్పే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: పాడండి
  rationale: שׁיר క్రియ యొక్క బహువచన ఆజ్ఞారూపాన్ని సహజమైన, నేరమైన తెలుగు ఆజ్ఞగా వ్యక్తపరుస్తుంది.
- source_word: לֹו
  choice: ఆయనకు
  rationale: ל ఉపసర్గ ఇక్కడ పాట ఎవరిని ఉద్దేశించి పాడాలో సూచిస్తుంది; ‘ఆయనకు’ ఆ దిశను సహజంగా నిలుపుతుంది.
- source_word: זַמְּרוּ
  choice: ఆయనను స్తుతిస్తూ పాడండి
  rationale: పియేల్ రూపంలోని זמר సంగీతంతో స్తుతించడాన్ని సూచిస్తుంది. ఈ అనువాదం మొదటి ‘పాడండి’తో ఉన్న సమాంతరతను నిలుపుతూ స్తుతి భావాన్ని స్పష్టం చేస్తుంది.
- source_word: שִׂיחוּ
  choice: గురించి చెప్పండి
  rationale: שׂיח మాట్లాడటం, వివరించడం, ధ్యానించడం అనే భావాలను కలిగి ఉండగలదు. బహిరంగ పిలుపు సందర్భంలో ఇతరులకు ప్రకటించే భావం ప్రధానంగా కనిపిస్తున్నందున ‘గురించి చెప్పండి’ ఎంచుకోబడింది; అంతర్ముఖ భావాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: בְּכָל
  choice: అన్నిటిని గురించి
  rationale: בְּ యొక్క సంబంధార్థాన్ని తెలుగులో సహజమైన ‘గురించి’తో, כָּל యొక్క సమగ్రతను ‘అన్నిటిని’తో వ్యక్తపరుస్తుంది.
- source_word: נִפְלְאֹתָיו
  choice: ఆయన చేసిన అద్భుత కార్యాలు
  rationale: ఈ పదం ఆశ్చర్యం కలిగించే దైవ కార్యాలను సూచిస్తుంది. ‘అద్భుత కార్యాలు’ వాటి ఆశ్చర్యకర స్వభావాన్నీ, అవి చేసిన క్రియలనే భావాన్నీ తెలియజేస్తుంది.
