- from: ఆయనకు పాడండి; ఆయనను స్తుతిస్తూ పాడండి; ఆయన చేసిన అద్భుత కార్యాలన్నిటిని గురించి చెప్పండి.[a]
  to: ఆయనకు పాడండి; ఆయనకు స్తుతిగీతాలు పాడండి; ఆయన అద్భుత కార్యాలన్నిటి గురించి చెప్పండి.[a]
