translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. హీబ్రూ కవితా సమాంతరతను మూడు సంక్షిప్త ఆజ్ఞలతో నిలుపుతూ, శబ్దార్థం మరియు సహజ తెలుగు మధ్య సమతుల్యత పాటించబడింది.
