source:
  edition: WLC
  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: te
  text: 'మరియు ఇలా చెప్పండి: “మా రక్షణకర్తవైన దేవా, మమ్మల్ని రక్షించు; మమ్మల్ని సమకూర్చు, జనాల[a] నుండి మమ్మల్ని విడిపించు; అలా మేము నీ పరిశుద్ధ నామానికి కృతజ్ఞతలు చెల్లించి, నీ స్తుతిలో అతిశయించగలము[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశజనాల.” ఈ సందర్భంలో ఇశ్రాయేలు చెదరిపోయి ఉన్న ఇతర జనాలు లేదా జాతులు అని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ స్తుతిలో ఆనందంతో ఉప్పొంగగలము,” లేదా “నీ స్తుతిని బట్టి గొప్పగా చెప్పుకోగలము.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: మరియు ఇలా చెప్పండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని, అలాగే ముందున్న ఆరాధనా ప్రవాహంతో దీనిని కలిపే וְ సంధిని నిలుపుతుంది.
- source_word: הוֹשִׁיעֵנוּ
  choice: మమ్మల్ని రక్షించు
  rationale: ישׁע హిఫీల్ ఆజ్ఞారూపానికి సహజమైన తెలుగు సమానం; తరువాతి נצל క్రియతో ఉన్న పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: మా రక్షణకర్తవైన దేవా
  rationale: ‘మా రక్షణకు దేవుడు’ అనే హీబ్రూ సంబంధాన్ని సహజమైన తెలుగు సంబోధనగా వ్యక్తపరుస్తుంది; దేవుడే వారి రక్షణకు మూలమనే భావాన్ని నిలుపుతుంది.
- source_word: וְקַבְּצֵנוּ
  choice: మమ్మల్ని సమకూర్చి
  rationale: చెదరిపోయినవారిని తిరిగి సమకూర్చే קבץ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְהַצִּילֵנוּ
  choice: విడిపించు
  rationale: נצל హిఫీల్ రూపంలోని అపాయం లేదా పరాధీనత నుండి బయటకు తీయడం అనే భావాన్ని ఇస్తూ, ముందున్న ‘రక్షించు’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: מִן־הַגּוֹיִם
  choice: జనాల మధ్యనుండి
  rationale: ఈ సందర్భంలో גוים ఇశ్రాయేలు చెదరిపోయి ఉన్న ఇతర జనాలను లేదా దేశజనాలను సూచిస్తుంది; తరువాతి కాలపు యూదులు–అన్యజనులు అనే విభజనను అనవసరంగా దిగుమతి చేయదు.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: నీ పరిశుద్ధ నామానికి కృతజ్ఞతలు చెల్లించి
  rationale: ידה హిఫీల్ యొక్క కృతజ్ఞత ప్రకటించే భావాన్ని, అలాగే దేవుని పరిశుద్ధ నామమే దాని లక్ష్యమనే నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: నీ స్తుతిలో అతిశయిస్తాము
  rationale: שׁבח హిత్పయేల్‌లోని సానుకూలంగా అతిశయించడం లేదా ఉప్పొంగడం అనే భావాన్ని, בְּ నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: הַגּוֹיִם ను ‘అన్యజనులు’గా అనువదించాలా
  choice: జనాలు
  alternative: అన్యజనులు
  rationale: ఇక్కడ ప్రధాన భావం ఇశ్రాయేలు చెదరిపోయి ఉన్న ఇతర జాతులు లేదా దేశజనాలు; ‘అన్యజనులు’ అనేది తరువాతి యూదు–అన్యజన విభాగాన్ని ముందుగానే బలంగా సూచించవచ్చు.
- issue: చివరి వాక్యభాగంలోని לְהִשְׁתַּבֵּחַ భావం
  choice: నీ స్తుతిలో అతిశయిస్తాము
  alternative: నీ స్తుతిలో ఆనందంతో ఉప్పొంగుతాము
  rationale: మూలపాఠంలో దేవుని స్తుతిని బట్టి సంతోషంగా అతిశయించడం లేదా ఉప్పొంగడం అనే భావపరిధి ఉంది. ప్రధాన పాఠం ‘అతిశయిస్తాము’ అని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో చూపడం ఆ ఉద్వేగాన్ని, అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సామూహిక ప్రార్థనకు తగిన గౌరవభరిత శైలిలో అనువదించబడింది. హీబ్రూ ఆజ్ఞారూపాలు, రక్షించు/విడిపించు అనే క్రియాభేదం, చెదరిపోయినవారిని సమకూర్చే భావం నిలుపబడ్డాయి.
