reference: 1 Chronicles 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: te
  text: యహ్వేను మరియు ఆయన బలాన్ని వెదకండి; ఆయన ముఖాన్ని[a] ఎల్లప్పుడూ వెదకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన సన్నిధిని’.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: వెదకండి
  rationale: ఈ ఆజ్ఞారూపం కేవలం ప్రశ్నించడం కాకుండా, దేవుని వైపు చురుకుగా తిరిగి ఆయనను అన్వేషించడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: וְעֻזּוֹ
  choice: ఆయన బలాన్ని
  rationale: עֹזకు ఇక్కడ ‘బలం’ అనే ప్రత్యక్ష అర్థం సహజంగా సరిపోతుంది; సమాంతరంగా వచ్చే ‘ఆయన ముఖాన్ని వెదకండి’ అనే మాటతో కలిసి ఇది దేవుని శక్తిని ఆశ్రయించడాన్ని తెలియజేస్తుంది.
- source_word: בַּקְּשׁוּ
  choice: వెదకండి
  rationale: ఈ పదం శ్రద్ధతో అన్వేషించడాన్ని సూచిస్తుంది. మొదటి క్రియతో ఉన్న కవితాత్మక సమాంతరతను నిలుపుకోవడానికి అదే సహజమైన తెలుగు క్రియను వాడాం.
- source_word: פָנָיו
  choice: ఆయన ముఖాన్ని
  rationale: అక్షరార్థమైన ‘ఆయన ముఖం’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; ఇది వ్యక్తిగత సన్నిధిని కూడా సూచించగలదు.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా లేదా మళ్లీ మళ్లీ కొనసాగించే అన్వేషణ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ‘యహ్వే’ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- issue: פָנָיוలోని రూపకం
  choice: ఆయన ముఖాన్ని
  alternative: ఆయన సన్నిధిని
  rationale: మూలంలోని స్పష్టమైన ‘ముఖం’ రూపకాన్ని తొలగించకుండా ఉంచాం; అది దేవుని వ్యక్తిగత సన్నిధి అనే భావాన్ని కలిగి ఉండవచ్చని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞాత్మక శైలిని ఉపయోగించాం. రెండు ఆజ్ఞల సమాంతర నిర్మాణాన్ని నిలిపాం.
