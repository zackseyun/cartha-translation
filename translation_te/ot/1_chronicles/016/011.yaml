- from: యహ్వేను, ఆయన బలాన్ని వెదకండి; ఆయన ముఖాన్ని[a] ఎల్లప్పుడూ వెదకండి.
  to: యహ్వేను మరియు ఆయన బలాన్ని వెదకండి; ఆయన ముఖాన్ని[a] ఎల్లప్పుడూ వెదకండి.
  rationale: The revision explicitly renders the Hebrew waw (‘and’) between Yahweh and his strength. The literal ‘ఆయన ముఖాన్ని’ remains in the main text, preserving the Hebrew idiom and its poetic parallelism; the interpretive alternative ‘ఆయన సన్నిధిని’ remains in the footnote. Since the main text already gives the literal wording, repeating ‘అక్షరార్థంగా’ in the note is unnecessary.
