id: 1CH.16.30
reference: 1 Chronicles 16:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: te
  text: భూమంతా ఆయన సన్నిధిలో వణకండి; నిజంగా, లోకం స్థిరంగా నిలపబడింది; అది చలించదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అది తూలదు,’ ‘అది కదిలించబడదు.’ హీబ్రూ పదచిత్రం దృఢమైన స్థిరత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: వణకండి
  rationale: ఈ ఖాల్ ఆజ్ఞారూపం శరీరం కంపించడం లేదా వేదనపడడం అనే భావాలను ఇవ్వగలదు; ఇక్కడ దేవుని సన్నిధికి ప్రతిస్పందనగా భయభక్తితో వణకడమే సందర్భోచితం.
- source_word: מִלְּפָנָיו
  choice: ఆయన సన్నిధిలో
  rationale: అక్షరార్థంగా ‘ఆయన ముఖం/సన్నిధి ఎదుటనుండి’; సహజమైన తెలుగులో దైవసన్నిధి భావాన్ని ‘ఆయన సన్నిధిలో’ స్పష్టంగా అందిస్తుంది.
- source_word: כָּל הָאָרֶץ
  choice: భూమంతా
  rationale: ఈ విశ్వవ్యాప్త స్తుతి సందర్భంలో אֶרֶץ ఒక ప్రత్యేక దేశాన్ని కాక సమస్త భూమిని సూచిస్తుంది.
- source_word: אַף
  choice: నిజంగా
  rationale: ఇక్కడ ఇది కేవలం కూడికను కాక, తరువాతి వాక్యాన్ని బలపరిచే ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
- source_word: תִּכּוֹן
  choice: స్థిరంగా నిలపబడింది
  rationale: כון నిఫాల్ రూపం స్థాపించబడడం, దృఢంగా ఉండడం అనే భావాలను కలిపి ఇస్తుంది; ఈ అనువాదం స్థాపిత స్థితినీ దృఢత్వాన్నీ నిలుపుతుంది.
- source_word: תֵּבֵל
  choice: లోకం
  rationale: תֵּבֵל సాధారణంగా క్రమబద్ధమైన లేదా నివాసిత ప్రపంచాన్ని సూచిస్తుంది; ‘లోకం’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בַּל
  choice: లేదు
  rationale: కావ్యాత్మక నిషేధార్థక అవ్యయాన్ని తరువాతి క్రియతో కలిసి ‘చలించదు’గా సహజంగా వ్యక్తం చేశాం.
- source_word: תִּמּוֹט
  choice: చలించదు
  rationale: מוט నిఫాల్ రూపం తూలడం, జారడం, కదిలించబడడం అనే భావాలను ఇవ్వగలదు; ‘చలించదు’ ఇక్కడ స్థిరత్వపు కవితాత్మక చిత్రాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సృష్టిలోక స్థిరత్వ భాష
  choice: దేవుని పరిపాలన కింద లోకం స్థిరంగా నిలపబడిందని చెప్పే కవితాత్మక ప్రకటనగా అనువదించబడింది.
  alternative: ‘అది తూలదు’ లేదా ‘అది కదిలించబడదు’ అని మరింత చిత్రాత్మకంగా అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యం శాస్త్రీయంగా సంపూర్ణ చలనరాహిత్యాన్ని నిర్వచించదు; దేవుడు స్థాపించి నిలబెట్టే సృష్టి క్రమపు దృఢత్వాన్ని ప్రకటిస్తుంది. అందువల్ల తరువాతి విశ్వనిర్మాణ వాదాలను పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘సన్నిధిలో’ దైవసాన్నిధ్య భావాన్ని సహజంగా అందిస్తుంది; ‘స్థిరంగా నిలపబడింది’ మరియు ‘చలించదు’ కలిసి మూలంలోని స్థాపన-స్థిరత్వ సమాంతరతను నిలుపుతాయి.
