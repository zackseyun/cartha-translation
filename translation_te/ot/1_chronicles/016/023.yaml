id: 1CH.16.23
reference: 1 Chronicles 16:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: te
  text: 'సమస్త భూమీ, యాహ్వేకు[a] పాడండి;

    దినదినం ఆయన రక్షణ గురించిన శుభవార్తను ప్రకటించండి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో దేవుని ప్రత్యేక నామం יהוה ఉంది; ఇక్కడ దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
    reason: divine_name
  - marker: b
    text: ‘ఆయన రక్షణను రోజు రోజుకూ ప్రకటించండి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ శుభవార్తను తీసుకురావడం లేదా ప్రకటించడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: పాడండి
  rationale: שׁיר క్రియ యొక్క బహువచన ఆజ్ఞారూపాన్ని నేరుగా, అదనపు భావాన్ని చేర్చకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לַ ఉపసర్గలోని ‘కు’ భావాన్ని నిలుపుతూ, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: כָּל הָאָרֶץ
  choice: భూమంతా
  rationale: ఈ స్తోత్ర పిలుపులో אָרֶץ‌కు విశ్వవ్యాప్తమైన ‘భూమి’ భావం సందర్భోచితం; ‘భూమంతా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בַּשְּׂרוּ
  choice: శుభవార్తగా ప్రకటించండి
  rationale: בשׂר పియేల్ ఆజ్ఞారూపం కేవలం తెలియజేయడమే కాక శుభవార్తను ప్రకటించే భావాన్ని కలిగి ఉంది; తెలుగు పదబంధం ఆ సానుకూల వార్తార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִיּוֹם אֶל יוֹם
  choice: దినదినం
  rationale: ఒక రోజు నుంచి మరొక రోజుకు కొనసాగే, ప్రతిదిన పునరావృత భావాన్ని సంక్షిప్తమైన కవితాత్మక తెలుగులో అందిస్తుంది.
- source_word: יְשׁוּעָתוֹ
  choice: ఆయన రక్షణను
  rationale: יְשׁוּעָהలోని రక్షణ/విడుదల భావాలలో విస్తృతమైన అర్థాన్ని ‘రక్షణ’ నిలుపుతుంది; ־וֹ ప్రత్యయం ‘ఆయన’గా వ్యక్తమైంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా సాధారణమైన ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించడం మూలంలోని నామవిశిష్టతను నిలుపుతుంది.
- issue: יְשׁוּעָה పదంలోని భావ పరిధి
  choice: రక్షణ
  alternative: విడుదల; విజయం
  rationale: సందర్భం దేవుని కార్యాన్ని బహిరంగంగా ప్రకటించమనే విస్తృత పిలుపు. ‘రక్షణ’ మూలపదపు విస్తృత భావాన్ని నిలుపుతుంది; దాన్ని కేవలం సైనిక విజయంగా లేదా ఒక నిర్దిష్ట సిద్ధాంతార్థంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆజ్ఞ యొక్క గౌరవభరిత బహువచన రూపాలు వాడబడ్డాయి. వాక్యానికి కీర్తనా ధోరణి ఉండేలా రెండు సమాంతర పాదాలుగా అమర్చబడింది; అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం.
