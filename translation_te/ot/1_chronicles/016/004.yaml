id: 1CH.16.4
reference: 1 Chronicles 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: te
  text: అతడు యెహోవా మందసం ఎదుట సేవ చేయడానికి, జ్ఞాపకం కలిగించడానికి[a], కృతజ్ఞతలు చెల్లించడానికి, ఇశ్రాయేలు దేవుడైన యెహోవాను స్తుతించడానికి లేవీయులలో కొందరిని నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్మరించడానికి,” లేక “ప్రస్తావించడానికి.” హెబ్రీ క్రియ ఆరాధనా సందర్భంలో జ్ఞాపకం కలిగించడాన్ని కూడా సూచించవచ్చు.
    reason: וּלְהַזְכִּיר అనే క్రియకు ఉన్న కారణార్థక, ఆరాధనా సంబంధమైన భావవిస్తృతిని నిలుపుటకు.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: నియమించాడు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘పెట్టాడు/ఇచ్చాడు’ అనే భావం ఉన్నా, వ్యక్తులను ఒక సేవకు ఉంచే ఈ పరిపాలనా సందర్భంలో ‘నియమించాడు’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: యెహోవా మందసం ఎదుట
  rationale: స్థానాన్ని, ఆరాధనా సందర్భాన్ని నేరుగా నిలుపుతుంది; אֲרוֹן అనే పవిత్ర పెట్టెకు ఆధునిక తెలుగు బైబిలు వాడుకలో గౌరవప్రదమైన ‘మందసం’ ఎంచుకోబడింది.
- source_word: מִן הַלְוִיִּם
  choice: లేవీయులలో కొందరిని
  rationale: מִן ఇక్కడ సూచించే విభాగార్థాన్ని సహజమైన తెలుగులో స్పష్టపరుస్తుంది.
- source_word: מְשָׁרְתִים
  choice: సేవ చేయడానికి
  rationale: ఇది సాధారణ పని మాత్రమే కాక మందసం ఎదుట జరిగే ఆరాధనా సేవ అని సందర్భం తెలియజేస్తుంది; తెలుగు పదబంధం సహజంగా ఉంటుంది.
- source_word: וּלְהַזְכִּיר
  choice: జ్ఞాపకం చేయడానికి
  rationale: זכר హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, అది జ్ఞాపకోత్సవమా, ప్రస్తావనా, ఆరాధనలో జ్ఞాపకం కలిగించడమా అనే మూలంలోని విస్తృతిని పూర్తిగా కుదించదు.
- source_word: וּלְהוֹדוֹת
  choice: కృతజ్ఞతలు చెల్లించడానికి
  rationale: ఆరాధనా సందర్భంలో ידה క్రియకు ఉన్న కృతజ్ఞతాస్తుతి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּלְהַלֵּל
  choice: స్తుతించడానికి
  rationale: הלל పియేల్ రూపానికి నేరమైన, సహజమైన తెలుగు సమానం; మూలంలో గానం స్పష్టంగా లేనందున ‘పాడడానికి’ అని చేర్చలేదు.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: హెబ్రీ నిర్మాణంలోని సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నామమైన టెట్రాగ్రామటన్‌ను వాడుతుంది. తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపం ‘యెహోవా’; ‘ప్రభువు’ అని మార్చితే నామం బిరుదుగా మారిపోతుంది.
- issue: וּלְהַזְכִּיר అనే ఆరాధనా కార్యం
  choice: జ్ఞాపకం చేయడానికి
  alternative: స్మరించడానికి / ప్రస్తావించడానికి
  rationale: క్రియ కారణార్థక రూపంలో ఉంది; అయితే దాని ఖచ్చితమైన ఆరాధనా ప్రయోగం వివిధ రీతుల్లో అర్థమవుతుంది. ప్రధాన పాఠం కారణార్థాన్ని నిలుపుతుంది, ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మందసం,’ ‘లేవీయులు,’ ‘స్తుతించు’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం. మూలంలోని వరుస ఉద్దేశార్థక క్రియలను సాధ్యమైనంతవరకు సమాంతరంగా ఉంచాం.
