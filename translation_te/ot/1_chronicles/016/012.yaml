source:
  edition: WLC
  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: te
  text: ఆయన చేసిన ఆశ్చర్యకార్యాలను[a], ఆయన సూచకాలను[b], ఆయన నోటి తీర్పులను[c] జ్ఞాపకం చేసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన అద్భుతాలను’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన నిదర్శనాలను’ లేదా ‘ఆయన మహత్కార్యాలను’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆయన నోటి శాసనాలను’ లేదా ‘ఆయన నోటి నిర్ణయాలను’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: జ్ఞాపకం చేసుకోండి
  rationale: זכר ధాతువు నుండి వచ్చిన బహువచన ఆజ్ఞారూపం. ఇది కేవలం మరచిపోకపోవడాన్ని కాక, దేవుని కార్యాలను చైతన్యంగా మనస్సుకు తెచ్చుకోవాలనే పిలుపును తెలియజేస్తుంది.
- source_word: נִפְלְאֹתָיו
  choice: ఆయన చేసిన ఆశ్చర్యకార్యాలను
  rationale: פלאות ఆశ్చర్యం కలిగించే అసాధారణ దైవకార్యాలను సూచిస్తుంది. ‘ఆశ్చర్యకార్యాలు’ అనే పదం వాటి అద్భుత స్వభావాన్నీ, అవి దేవుడు చేసిన కార్యాలనే భావాన్నీ నిలుపుతుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: ఆయన చేసిన
  rationale: ఈ సంబంధవాక్యం ఆశ్చర్యకార్యాలను దేవుడు చేసిన కార్యాలుగా స్పష్టపరుస్తుంది. తెలుగులో కృదంత నిర్మాణం సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: מֹפְתָיו
  choice: ఆయన సూచక క్రియలను
  rationale: מופתים దైవశక్తిని తెలియజేసే సూచనలను లేదా మహత్కార్యాలను సూచించగలదు. ‘సూచక క్రియలు’ అద్భుతకార్యాల భావాన్ని పూర్తిగా కలిపివేయకుండా, అవి ఏదో తెలియజేసే సూచనలనే అంశాన్ని కాపాడుతుంది.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: ఆయన నోటి తీర్పులను
  rationale: משפטים తీర్పులు, శాసనాలు లేదా విధులు అనే పరిధిని కలిగి ఉంది. ‘ఆయన నోటి’ అనే హీబ్రూ రూపకాన్ని నిలిపి, దేవుడు పలికిన అధికారపూర్వక నిర్ణయాల భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సమాంతర కవిత్వంలో దైవకార్యాలకు వాడిన రెండు పదాల భేదం
  choice: פלאותను ‘ఆశ్చర్యకార్యాలు’గా, מופתיםను ‘సూచక క్రియలు’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ ‘అద్భుతాలు’ లేదా సమానార్థక పదాలతో అనువదించడం
  rationale: మూలంలో పరస్పరం సంబంధమున్నా భిన్నమైన రెండు పదాలు ఉన్నాయి. వాటిని వేర్వేరుగా అనువదించడం వల్ల ఒకటి ఆశ్చర్యం కలిగించే కార్యాలను, మరొకటి దైవశక్తిని తెలియజేసే సూచక స్వభావాన్ని ఉద్దేశిస్తుందనే కవితాత్మక ఉద్వేగం నిలుస్తుంది.
- issue: משפטים యొక్క న్యాయపరమైన మరియు శాసనపరమైన అర్థపరిధి
  choice: ‘తీర్పులు’ అని ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘శాసనాలు’ లేదా ‘ఆజ్ఞాపూర్వక నిర్ణయాలు’
  rationale: ‘తీర్పులు’ న్యాయపరమైన భావాన్ని సహజంగా అందిస్తూనే, దేవుని నోటి నుండి వెలువడే అధికారపూర్వక ప్రకటనల విస్తృత భావానికి కూడా చోటిస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో ఉంచడం ద్వారా మూలంలోని సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ కవిత్వంలోని సమాంతర పదభేదాన్ని నిలిపి, ‘ఆయన నోటి’ అనే సజీవ రూపకాన్ని యథాతథంగా కాపాడాం.
