lexical_decisions:
- source_word: הוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో ‘ఆయనే’ అని వ్యక్తం చేస్తుంది; హీబ్రూలోని క్రియలేని వాక్యానికి తెలుగు వర్తమానార్థం సహజంగా వస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించి, బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: రూపపరంగా బహువచన ఆకృతి ఉన్నా, ఇక్కడ ఇశ్రాయేలు ఆరాధించే ఏకైక దేవునినే సూచిస్తుంది; అందువల్ల ఏకవచనం సహజం.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: בְּ + כָל నిర్మాణంలోని సమగ్ర వ్యాప్తిని సహజంగా తెలియజేస్తుంది; స్తోత్ర సందర్భంలోని విశ్వవ్యాప్త భావానికి ‘భూమి’ సరిపోతుంది.
- source_word: מִשְׁפָּטָיו
  choice: ఆయన తీర్పులు
  rationale: ఈ పదంలోని తీర్పులు, న్యాయనిర్ణయాలు, న్యాయపాలన అనే విస్తృత భావపరిధిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం; సంభావ్య మూల ఉచ్చారణను పాదసూచికలో తెలిపాం.
- issue: הָאָרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం
  rationale: స్తుతి సందర్భం దేవుని తీర్పుల విశ్వవ్యాప్తిని సూచిస్తున్నందున ‘భూమి’ని ప్రధాన పాఠంలో ఉంచాం; స్థానిక అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన స్తోత్ర శైలి. ‘ఆయనే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘భూమి అంతటా’ సాధారణ పాఠకులకు సహజంగా ఉండి విశ్వవ్యాప్త భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
