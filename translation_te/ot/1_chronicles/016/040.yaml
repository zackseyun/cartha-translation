source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: te
  text: యాహ్వేకు దహనబలి బలిపీఠం మీద దహనబలులను ఉదయం సాయంత్రం క్రమం తప్పకుండా అర్పించడానికి, అలాగే ఆయన ఇశ్రాయేలుకు ఆజ్ఞాపించిన యాహ్వే ధర్మశాస్త్రంలో రాసి ఉన్నదంతా పాటించడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: అర్పించడానికి
  rationale: עלה అనే క్రియ హిఫీల్ రూపంలో అక్షరార్థంగా ‘పైకి ఎక్కించడం’ అని ఉన్నా, బలి సందర్భంలో బలిని అర్పించడం అనే స్థిరమైన భావాన్ని ఇస్తుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే ప్రామాణిక ఆరాధనా పదం; ‘దహనబలి’ తెలుగు బైబిలు భాషలో స్పష్టమైన, స్థిరమైన పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దేవుని నామమైన יהוהను తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; ל సమర్పణను సూచిస్తుంది.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: దహనబలుల కోసం నియమించబడిన నిర్దిష్ట బలిపీఠాన్ని సహజమైన తెలుగు సమాసంతో సూచిస్తుంది.
- source_word: תָּמִיד
  choice: క్రమం తప్పకుండా
  rationale: ఆరాధనా సందర్భంలో תָּמִיד నిరంతరంగా మాత్రమే కాక నియమితంగా కొనసాగడాన్ని కూడా సూచిస్తుంది; వెంట వచ్చే ‘ఉదయం, సాయంత్రం’ ఆ క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: ప్రతి ఉదయం, ప్రతి సాయంత్రం
  rationale: రోజువారీ బలుల నియమిత సమయాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְכָל הַכָּתוּב
  choice: రాసి ఉన్నదంతా పాటించడానికి
  rationale: ఇక్కడ לְכָל అనేది లిఖిత నియమాలకు అనుగుణంగా చేయడాన్ని సూచిస్తుంది; ‘పాటించడానికి’ ఆ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּתוֹרַת יְהוָה
  choice: యెహోవా ధర్మశాస్త్రంలో
  rationale: תּוֹרָהకు ‘ఉపదేశం’ అనే విస్తృత అర్థం ఉన్నా, ఇక్కడ లిఖిత బలి నియమాల సందర్భంలో ‘ధర్మశాస్త్రం’ తగిన ప్రధాన అనువాదం.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు ఆయన ఆజ్ఞాపించిన
  rationale: עַל ఇశ్రాయేలుపై విధించబడిన ఆజ్ఞను సూచిస్తుంది; తెలుగులో ‘ఇశ్రాయేలుకు ఆజ్ఞాపించిన’ సహజంగా ఉండి, ఆజ్ఞకు ఇశ్రాయేలు గ్రహీత అని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు క్రైస్తవ పాఠకులలో విస్తృతంగా గుర్తించబడే రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: תּוֹרָה యొక్క భావపరిధి
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: ఈ వాక్యంలో రాసి ఉన్న బలి విధుల ప్రస్తావన న్యాయనియమాల భావాన్ని ముందుకు తెస్తుంది; అయినా תּוֹרָהకు ‘ఉపదేశం’ అనే అర్థం కూడా ఉన్నందున దాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆరాధనా శైలిని వాడాం. మూల వాక్యం ముందటి వచనంపై ఆధారపడే ఉద్దేశార్థక నిర్మాణం కావడంతో ‘అర్పించడానికి… పాటించడానికి’ అనే కొనసాగింపు రూపాన్ని నిలిపాం. ‘క్రమం తప్పకుండా’ అనే పదబంధాన్ని ‘ప్రతి ఉదయం, ప్రతి సాయంత్రం’తో కలిపి תָּמִיד యొక్క నియమిత నిరంతరతను స్పష్టం చేశాం.
