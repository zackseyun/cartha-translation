id: 1CH.16.26
reference: 1 Chronicles 16:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: te
  text: ఎందుకంటే ప్రజల దేవుళ్లందరూ విగ్రహాలే; కానీ యాహ్వే ఆకాశాలను చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆరాధన పిలుపుకు కారణాన్ని తెలియజేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל
  choice: అందరూ
  rationale: దేవుళ్ల సమగ్రతను సూచించే హెబ్రీయ సమగ్ర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי הָעַמִּים
  choice: జనాల దేవుళ్లు
  rationale: రాజకీయ ‘దేశాలు’ అనే భావాన్ని అవసరం లేకుండా చేర్చకుండా, עַמִּים అనే బహువచనానికి ‘జనాలు’ దగ్గరగా ఉంటుంది.
- source_word: אֱלִילִים
  choice: విగ్రహాలే
  rationale: ఈ పదంలోని తృణీకార ఛాయను సందర్భంలోని సృష్టికర్తతో ఉన్న వ్యత్యాసం మోస్తుంది; ‘విగ్రహాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది, ‘-ఏ’ ఆ వ్యత్యాసాన్ని బలపరుస్తుంది.
- source_word: וַיהוָה
  choice: కానీ యాహ్వే
  rationale: וְ రూపపరంగా ‘మరియు’ అయినా, ఇక్కడ విగ్రహాలకు ఆకాశాలను చేసిన యాహ్వేకు మధ్య స్పష్టమైన వ్యతిరేక సంబంధాన్ని తెలుగులో ‘కానీ’ సహజంగా తెలియజేస్తుంది; దైవనామాన్ని యాహ్వేగా లిప్యంతరీకరించింది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలను
  rationale: హెబ్రీ బహువచన రూపాన్ని నిలుపుతూ సృష్టి సందర్భానికి తగిన సహజ తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: ‘సృష్టించాడు’ కంటే మూల క్రియ యొక్క విస్తృతమైన ‘చేయు/తయారు చేయు’ భావానికి మరింత నేరుగా సరిపోతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- issue: וַיהוָה ముందు సంధాన పదం యొక్క భావం
  choice: వ్యతిరేకార్థకమైన ‘కానీ’
  alternative: సాధారణ సంయోజకమైన ‘మరియు’
  rationale: రూపపరమైన సంయోజకత్వాన్ని అంగీకరిస్తూనే, జనాల దేవుళ్లు విగ్రహాలు కావడం మరియు యాహ్వే ఆకాశాలను చేయడం మధ్య వాక్యంలోని స్పష్టమైన వ్యత్యాసాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. చిన్న కవితాత్మక సమాంతర నిర్మాణం, విగ్రహాలు—సృష్టికర్త మధ్య వ్యత్యాసం నిలుపబడ్డాయి.
