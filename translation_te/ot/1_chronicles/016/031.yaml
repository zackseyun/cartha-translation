id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: te
  text: 'ఆకాశాలు సంతోషించుగాక, భూమి ఉల్లసించుగాక; జనముల మధ్య వారు ఇలా చెప్పుగాక: “యాహ్వే రాజుగా ఏలుతున్నాడు!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: సంతోషించుగాక
  rationale: కవితాత్మక ఆజ్ఞార్థక భావంలోని Qal imperfect 3mpను తెలుగు ఆశీర్వాద/ఆహ్వాన రూపమైన ‘-గాక’తో వ్యక్తం చేస్తుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశాలు
  rationale: మూలంలోని బహువచన రూపాన్నీ, విశ్వవ్యాప్త స్తుతి సందర్భంలోని ఉన్నత భావాన్నీ నిలుపుతుంది.
- source_word: וְתָגֵל
  choice: ఉల్లసించుగాక
  rationale: גילలోని ఆనందోత్సాహ భావాన్ని వ్యక్తం చేస్తూ, ముందున్న ‘సంతోషించు’ అనే పదం పునరుక్తిని నివారిస్తుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: ‘ఆకాశాలు’తో ఉన్న విశ్వవ్యాప్త సమాంతరతలో ארץ అంటే స్థానిక ‘దేశం’ కాక ‘భూమి’.
- source_word: וְיֹאמְרוּ
  choice: అని ప్రకటించుగాక
  rationale: కొనసాగుతున్న ఆజ్ఞార్థక భావాన్ని నిలుపుతూ, జనాల మధ్య బహిరంగంగా చెప్పే అర్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; హీబ్రూలో కర్త స్పష్టంగా పేర్కొనబడలేదు.
- source_word: בַגּוֹיִם
  choice: జనాల మధ్య
  rationale: גוים ప్రపంచంలోని వివిధ ప్రజాసమూహాలను సూచిస్తుంది; ‘అన్యజనులు’ అనే తరువాతి మతపరమైన వ్యత్యాసాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מָלָךְ
  choice: రాజుగా ఏలుతున్నాడు
  rationale: స్తుతి ప్రకటనలోని ప్రస్తుత రాజాధికార వాస్తవాన్ని సహజంగా వ్యక్తం చేస్తుంది; దేవుడు ఒక సమయంలో కొత్తగా రాజయ్యాడనే భావాన్ని బలవంతంగా కలిగించదు.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంతో నిలుపుతున్నాం; ‘యాహ్వే’ ఉచ్చారణపరమైన ప్రత్యామ్నాయం.
- issue: מָלָךְ యొక్క కాల/అంశ భావం
  choice: రాజుగా ఏలుతున్నాడు
  alternative: రాజయ్యాడు; రాజు
  rationale: ఈ స్తుతి సూత్రంలో దేవుని కొనసాగుతున్న సార్వభౌమ పరిపాలన ప్రధానంగా వ్యక్తమవుతుంది. హీబ్రూ perfect వల్ల సాధ్యమైన ‘రాజయ్యాడు’ అనే భావం ఉన్నప్పటికీ, అవసరం లేని కాలిక మార్పును ప్రధాన పాఠ్యంలో విధించలేదు.
- issue: וְיֹאמְרוּ లోని అవ్యక్త కర్త
  choice: కర్తను పేర్కొనకుండా ‘ప్రకటించుగాక’
  alternative: వారు చెప్పుగాక
  rationale: హీబ్రూ క్రియ బహువచన కర్తను సూచించినా దాని నిర్దిష్ట పూర్వపదం స్పష్టంగా లేదు. సహజమైన తెలుగు కోసం కర్తను ఊహించి చేర్చకుండా, మూలంలోని అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా ధోరణికి తగిన గౌరవభరితమైన ‘-గాక’ రూపాలు ఉపయోగించబడ్డాయి. వాక్యం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచుతూ, కవితాత్మక సమాంతరతను కాపాడింది.
