id: 1CH.16.3
reference: 1 Chronicles 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחַלֵּק֙ לְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל מֵ/אִ֖ישׁ וְ/עַד אִשָּׁ֑ה לְ/אִישׁ֙ כִּכַּר לֶ֔חֶם וְ/אֶשְׁפָּ֖ר וַ/אֲשִׁישָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: te
  text: అతడు ఇశ్రాయేలీయులందరికీ—పురుషుని నుండి స్త్రీ వరకు—ఒక్కొక్కరికి ఒక రొట్టె, ఒక మాంసపు భాగం[a], ఒక ఎండుద్రాక్ష కేక్ పంచిపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక భాగం’ లేదా మరొక ఆహార పదార్థం. హీబ్రూ పదం ఎష్పార్ అరుదైనది; దాని ఖచ్చితమైన అర్థం అనిశ్చితం. చాలామంది ఇక్కడ దానిని మాంసపు భాగంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: పంచిపెట్టాడు
  rationale: పియేల్ రూపంలోని క్రియ ఇక్కడ సమూహంలోని ఒక్కొక్కరికి ఆహార పదార్థాలను పంచడాన్ని సూచిస్తుంది; ‘పంచిపెట్టాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరికీ
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో వాడబడింది; వెంటనే వచ్చే ‘పురుషుల మొదలు స్త్రీల వరకు’ అనే మాట గ్రహీతలందరినీ స్పష్టంగా చేర్చుతుంది.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషుల మొదలు స్త్రీల వరకు
  rationale: మూలంలోని ‘పురుషుని నుండి స్త్రీ వరకు’ అనే సమగ్ర పరిధిని తెలుగు సహజత్వంతో, అయినా దాని రూపాన్ని చాలావరకు నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: לְאִישׁ
  choice: ఒక్కొక్కరికి
  rationale: ముందు పేర్కొన్న పురుషులు, స్త్రీలు సహా ప్రతి వ్యక్తికి విడివిడిగా ఇచ్చాడనే పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּכַּר לֶחֶם
  choice: ఒక రొట్టె
  rationale: כִּכַּר గుండ్రని రొట్టెను లేదా రొట్టె ముద్దను సూచించగలదు; ‘ఒక రొట్టె’ సాధారణ పాఠకునికి సహజంగా అర్థమవుతుంది.
- source_word: אֶשְׁפָּר
  choice: ఒక మాంసపు భాగం
  rationale: ఈ అరుదైన పదం ఖచ్చితార్థం అనిశ్చితం. పండుగ ఆహార పంపిణీ సందర్భంలో ‘మాంసపు భాగం’ సాధారణంగా అంగీకరించబడిన సందర్భోచిత అర్థం; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: אֲשִׁישָׁה
  choice: ఒక ఎండుద్రాక్ష పిండి వంటకం
  rationale: ఈ పదం నొక్కి చేసిన పిండి వంటకాన్ని, సాధారణంగా ఎండుద్రాక్షతో చేసినదాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి పదార్థం మరియు రూపం రెండూ అర్థమయ్యేలా అనువదించబడింది.
