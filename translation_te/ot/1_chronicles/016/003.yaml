translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని పంపిణీ భావానికి ‘ఒక్కొక్కరికి’ అనీ, పురుషులు-స్త్రీలు అందరూ చేర్చబడ్డారనే స్పష్టతకు ‘పురుషుల మొదలు స్త్రీల వరకు’ అనీ ఇచ్చాం. అరుదైన ఆహారపదం విషయంలో మూలంలోని అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
