source:
  edition: WLC
  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: te
  text: 'యాహ్వేకు ఆయన నామానికి తగిన మహిమను చెల్లించండి;


    అర్పణను తీసుకువచ్చి ఆయన సన్నిధికి రండి.


    పరిశుద్ధ వైభవంలో[a] యాహ్వే ఎదుట సాగిలపడండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధత యొక్క వైభవంలో’; బహుశా, ‘పరిశుద్ధ వస్త్రధారణతో.’
    reason: హీబ్రూ పదబంధం పరిశుద్ధతతో సంబంధమైన వైభవాన్ని సూచించవచ్చు; సందర్భాన్ని బట్టి పరిశుద్ధ అలంకారం లేదా వస్త్రధారణ అనే అర్థానికీ అవకాశం ఉంది.
lexical_decisions:
- source_word: הָבוּ
  choice: చెల్లించండి
  rationale: ఈ ఆరాధనా సందర్భంలో క్రియకు అక్షరార్థంగా ఏదైనా ఇవ్వడం కంటే, యాహ్వేకు చెందవలసిన మహిమను గుర్తించి సమర్పించడం అనే భావం ఉంది. ‘చెల్లించండి’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יְהוָהను దాని వ్యక్తిగత నామ స్వభావాన్ని నిలుపుతూ ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כְּבוֹד שְׁמוֹ
  choice: ఆయన నామానికి తగిన మహిమను
  rationale: నామంతో సంబంధమున్న లేదా ఆ నామానికి చెందవలసిన మహిమ అనే ఆరాధనా సూత్రార్థాన్ని ‘తగిన’ అనే పదం సహజంగా తెలియజేస్తుంది.
- source_word: שְׂאוּ מִנְחָה
  choice: అర్పణను తీసుకువచ్చి
  rationale: שְׂאוּ అక్షరార్థంగా ‘ఎత్తండి/మోయండి’ అయినా, מִנְחָהతో కలిసి అర్పణను తీసుకురావడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది. అర్పణ రకాన్ని అనవసరంగా పరిమితం చేయలేదు.
- source_word: וּבֹאוּ לְפָנָיו
  choice: ఆయన సన్నిధికి రండి
  rationale: దేవుని ఎదుట ఆరాధనకై చేరడాన్ని సూచించే హీబ్రూ నుడికారాన్ని గౌరవభరితమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הִשְׁתַּחֲווּ
  choice: సాగిలపడండి
  rationale: ఈ క్రియ ఆరాధనలో శరీరంతో వంగి నమస్కరించడాన్ని సూచిస్తుంది. సాధారణమైన ‘ఆరాధించండి’ కంటే ఇందులోని భౌతిక భావాన్ని ‘సాగిలపడండి’ నిలుపుతుంది.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: పరిశుద్ధ వైభవంలో
  rationale: ఈ కవితాత్మక పదబంధం పరిశుద్ధతకు చెందిన వైభవాన్ని లేదా ఆరాధనకు తగిన పవిత్ర అలంకారాన్ని సూచించవచ్చు. ప్రధాన పాఠం మొదటి భావాన్ని నిలుపగా, ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా ‘యాహ్వే’గా ఇచ్చాం.
- issue: בְּהַדְרַת קֹדֶשׁ అర్థనిర్ణయం
  choice: పరిశుద్ధ వైభవంలో
  alternative: పరిశుద్ధతా వైభవంలో; పవిత్ర వస్త్రధారణతో
  rationale: హీబ్రూ పదబంధం పరిశుద్ధత యొక్క సౌందర్యవైభవాన్నీ, బహుశా పవిత్ర అలంకారం లేదా వస్త్రధారణనూ సూచించగలదు. ప్రధాన పాఠంలో కవితాత్మక విస్తృతిని నిలిపి, సంకుచితమైన సాధ్యార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ఆరాధనా శైలిని వాడాం. కవితాత్మక సమాంతర నిర్మాణాన్ని మూడు పాదాలుగా నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం.
