source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא אָ֣ז נָתַ֤ן דָּוִיד֙ בָּ/רֹ֔אשׁ לְ/הֹד֖וֹת לַ/יהוָ֑ה בְּ/יַד אָסָ֖ף וְ/אֶחָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: te
  text: ఆ రోజున దావీదు ఆసాపును, అతని సహోదరులను యహ్వేకు కృతజ్ఞతలు చెల్లించడానికి తొలిసారిగా నియమించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు ఆసాపును, అతని సహోదరులను ప్రధాన స్థానంలో ఉంచి యహ్వేకు కృతజ్ఞతలు చెల్లించేలా నియమించాడు,” లేదా “యహ్వేకు కృతజ్ఞతలు చెల్లించే విషయంలో ఆసాపును, అతని సహోదరులను నాయకులుగా నియమించాడు.” ఇక్కడి హీబ్రూ పదబంధం తొలి ఏర్పాటు, ప్రాధాన్యం, లేదా నాయకత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא אָז
  choice: ఆ రోజునే
  rationale: కాలసూచక పదబంధంతో పాటు אָז ఇచ్చే క్రమం లేదా ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: נָתַן
  choice: నియమించాడు
  rationale: మూలార్థం ‘ఇచ్చాడు’ అయినా, ఈ ఆరాధనా బాధ్యతను అప్పగించే సందర్భంలో ‘నియమించాడు’ అనేది పరిపాలనా భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּרֹאשׁ
  choice: మొదటిసారిగా
  rationale: ఈ పదబంధం ఇక్కడ కృతజ్ఞతాస్తుతుల సేవను తొలిసారిగా ఏర్పాటు చేయడాన్ని సూచించవచ్చు. అయితే ప్రాధాన్యం లేదా నాయకత్వం అనే భావాలు కూడా సాధ్యమైనందున వాటిని పాదసూచికలో ఉంచాం.
- source_word: לְהֹדוֹת
  choice: కృతజ్ఞతాస్తుతులు చెల్లించడానికి
  rationale: ఆరాధనా సందర్భంలో కృతజ్ఞతలు చెప్పడం, స్తుతించడం అనే పరస్పర సంబంధిత భావాలను సహజమైన తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: ఆసాపును, అతని సహోదరులను … నియమించాడు
  rationale: ‘ఆసాపు మరియు అతని సహోదరుల చేతి ద్వారా’ అనే హీబ్రూ కరణార్థక నుడికారాన్ని, వారికి బాధ్యత అప్పగించాడనే భావంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה అనే దేవుని నామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వాక్యంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా, దాని వ్యక్తిగత నామ స్వభావాన్ని కాపాడేందుకు ‘యహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఆరాధనా సందర్భానికి తగిన ‘కృతజ్ఞతాస్తుతులు చెల్లించడం’ అనే ప్రయోగాన్ని ఎంచుకుని, బָּרֹאשׁలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
