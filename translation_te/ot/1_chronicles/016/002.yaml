id: 1CH.16.2
reference: 1 Chronicles 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: te
  text: దావీదు దహనబలిని, సమాధాన బలులను[a] అర్పించడం ముగించినప్పుడు, యాహ్వే నామంలో ప్రజలను ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులను”; లేదా “క్షేమ బలులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించినప్పుడు
  rationale: כלה క్రియ ఇక్కడ అర్పణ కార్యం పూర్తయినదాన్ని తెలిపి, వెంటనే జరిగిన ఆశీర్వాదంతో కాలసంబంధాన్ని కలుపుతుంది.
- source_word: מֵהַעֲלוֹת
  choice: అర్పించడం
  rationale: עלה హిఫీల్ ధాతురూపం బలిని పైకెత్తి అర్పించే భావాన్ని కలిగిస్తుంది; తెలుగులో ‘అర్పించడం’ సహజంగా, యాజ్ఞిక సందర్భానికి తగినట్లు ఉంది.
- source_word: הָעֹלָה
  choice: దహనబలిని
  rationale: עֹלָה పూర్తిగా దహనం చేసి అర్పించే నియమిత బలి రకాన్ని సూచిస్తుంది; ‘దహనబలి’ ఆధునిక తెలుగు బైబిలు పరిభాషలో స్పష్టమైన పదం.
- source_word: וְהַשְּׁלָמִים
  choice: సమాధాన బలులను
  rationale: שְׁלָמִים శాంతి, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలున్న బలి వర్గం. ‘సమాధాన బలులు’ స్థిరమైన ప్రధాన అనువాదం; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: וַיְבָרֶךְ אֶת־הָעָם
  choice: ప్రజలను ఆశీర్వదించాడు
  rationale: ברך యొక్క సరళమైన క్రియార్థాన్ని, మూలంలో లేని ‘అందరినీ’ వంటి విస్తరణ లేకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּשֵׁם יְהוָה
  choice: యాహ్వే నామంలో
  rationale: בְּשֵׁם అనే పదబంధాన్ని ‘నామంలో’గా నేరుగా అందిస్తూ, יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదానికి అనువాదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: హీబ్రూ పదం సమాధానం, క్షేమం, సహవాసం అనే భావవలయాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో గుర్తించదగిన బలి వర్గనామాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయాలను పాదసూచికలో సంరక్షించాం.
- issue: יהוה అనే దైవనామానికి అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల వ్యక్తిగత నామాన్ని తెలుగు లిపిలో ‘యాహ్వే’గా అందించడం మూలానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘దహనబలి’, ‘సమాధాన బలులు’ వంటి గౌరవప్రదమైన యాజ్ఞిక పరిభాషను నిలిపింది.
