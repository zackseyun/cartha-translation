  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: te
  text: అప్పుడు ప్రజలందరూ తమ తమ ఇళ్లకు వెళ్లిపోయారు. దావీదు తన ఇంటివారిని[a] ఆశీర్వదించడానికి తన ఇంటివైపుకు తిరిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ఇంటిని.’ హీబ్రూ పదం భౌతికమైన ఇంటినిగానీ, ఆ ఇంటికి చెందిన కుటుంబం లేదా ఇంటివారినిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם אִישׁ לְבֵיתוֹ
  choice: ప్రజలందరూ తమ తమ ఇళ్లకు వెళ్లిపోయారు
  rationale: హీబ్రూ వాక్యంలోని పంపిణీ భావాన్ని ‘తమ తమ’ సహజంగా వ్యక్తం చేస్తుంది. ‘వెళ్లిపోయారు’ కథనంలోని తదుపరి చర్యను ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: וַיִּסֹּב דָּוִיד
  choice: దావీదు ... తిరిగి వెళ్లాడు
  rationale: סבב ఇక్కడ ప్రజా సమూహం నుంచి తన ఇంటివైపు దిశ మార్చుకొని వెళ్లడాన్ని సూచిస్తుంది. తెలుగులో ‘తిరిగి వెళ్లాడు’ ఈ సందర్భానికి సహజంగా ఉంది; కేవలం ‘తిరిగాడు’ అనడం గమ్యాన్ని అస్పష్టంగా ఉంచుతుంది.
- source_word: לְבָרֵךְ
  choice: ఆశీర్వదించడానికి
  rationale: ברך అనే ఉద్దేశార్థక క్రియకు ఇది సాధారణమైన, ధార్మిక బరువును నిలుపుకునే తెలుగు రూపం.
- source_word: אֶת־בֵּיתוֹ
  choice: తన ఇంటివారిని
  rationale: בַּיִת ఇక్కడ భవనం కంటే దావీదు గృహానికి చెందిన వారిని సూచించే అవకాశం ఎక్కువ. ‘ఇంటివారు’ ఆధునిక తెలుగులో సహజంగా ఆ సమష్టి భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘తమ తమ’ ద్వారా אִישׁ యొక్క పంపిణీ భావం లింగాన్ని అనవసరంగా ముందుకు తేవకుండా నిలుపబడింది; రెండవ בֵּיתוֹ లోని నిజమైన అర్థసందిగ్ధత పాదటిప్పణిలో భద్రపరచబడింది.
