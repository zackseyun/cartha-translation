  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: te
  text: 'దేశాల మధ్య ఆయన మహిమను,

    ప్రజలందరి మధ్య ఆయన అద్భుత కార్యాలను ప్రకటించండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: ప్రకటించండి
  rationale: ספר ధాతువు యొక్క బహువచన ఆజ్ఞారూపం ఇక్కడ బహిరంగంగా తెలియజేయడం, చాటించడం అనే భావాన్ని ఇస్తుంది. సమాంతర పాదాల్లో ఒకే క్రియ వర్తిస్తున్నదని తెలుగులో స్పష్టంగా ఉండేందుకు రెండుసార్లు వాడబడింది.
- source_word: בַגּוֹיִם
  choice: జనముల మధ్య
  rationale: גּוֹיִם ఇక్కడ విస్తృతంగా జనసమూహాలు లేదా దేశజనాలను సూచిస్తుంది. ב ఉపసర్గకు అనుగుణంగా ‘మధ్య’ వాడటం, ప్రకటన వారి నడుమ జరగాలనే భావాన్ని నిలుపుతుంది.
- source_word: כְּבוֹדוֹ
  choice: ఆయన మహిమను
  rationale: כָּבוֹד దేవుని ఘనత, వైభవం, గౌరవాన్ని సూచిస్తుంది. ‘మహిమ’ సహజమైనదీ, సందర్భానికి తగినదీ అయిన తెలుగు పదం.
- source_word: בְּכָל־הָעַמִּים
  choice: ప్రజలందరి మధ్య
  rationale: עַמִּים ను ‘ప్రజలు’గా అనువదించడం, ముందున్న גּוֹיִם తో ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది. כָּל భావాన్ని ‘అందరి’ తెలియజేస్తుంది.
- source_word: נִפְלְאֹתָיו
  choice: ఆయన అద్భుత కార్యాలను
  rationale: פלא మూలానికి చెందిన ఈ పదం ఆశ్చర్యం కలిగించే అసాధారణ క్రియలను సూచిస్తుంది. ‘అద్భుత కార్యాలు’ వాటి అద్భుత స్వభావాన్నీ, అవి చేసిన కార్యాలనే విషయాన్నీ వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘ఆయన’ అనే సర్వనామ ప్రత్యయాల సూచన
  choice: మూలంలోని సర్వనామ రూపాన్ని నిలుపుతూ ‘ఆయన’ అని అనువదించడం
  alternative: ప్రతి చోట ‘యెహోవా’ అని పేరును ప్రత్యక్షంగా చేర్చడం
  rationale: తక్షణ సందర్భంలో సూచితుడు ఇశ్రాయేలు దేవుడైన యెహోవా. అయితే ఈ వచనం స్వయంగా సర్వనామ ప్రత్యయాలనే వాడుతుంది కాబట్టి, సందర్భాన్ని మించి దైవనామాన్ని పాఠ్యంలో చేర్చకుండా ‘ఆయన’ను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కీర్తనా శైలి. హీబ్రూ కవితా సమాంతరత్వాన్ని రెండు పాదాలుగా నిలిపి, గోయిమ్/అమ్మీమ్ పదభేదాన్ని ‘జనములు/ప్రజలు’ ద్వారా సూచించాం.
