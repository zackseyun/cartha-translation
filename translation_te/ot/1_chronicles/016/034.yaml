id: 1CH.16.34
reference: 1 Chronicles 16:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: te
  text: యాహ్వేకు కృతజ్ఞతలు తెలపండి, ఆయన మంచివాడు కాబట్టి; ఆయన స్థిరమైన ప్రేమ శాశ్వతమైనది కాబట్టి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: కృతజ్ఞతలు చెల్లించండి
  rationale: ידה క్రియ యొక్క హిఫిల్ బహువచన ఆజ్ఞారూపం ఈ ఆరాధనా సందర్భంలో కృతజ్ఞతలు తెలపడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. ‘కృతజ్ఞతలు చెల్లించండి’ ఆ ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לַ/יהוָה֙
  choice: యాహ్వేకు
  rationale: హీబ్రూ పాఠంలో ఉన్న יְהוָה అనే దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యనుసారంగా అందించింది.
- source_word: כִּ֣י ... כִּ֥י
  choice: ఎందుకంటే ... ఎందుకంటే
  rationale: రెండు చోట్లా כִּי కారణాన్ని పరిచయం చేస్తుంది. పునరుక్తిని ఉంచడం హీబ్రూ సమాంతరతను, ఆరాధనా లయను కాపాడుతుంది.
- source_word: ט֔וֹב
  choice: మంచివాడు
  rationale: טוֹב ఇక్కడ యాహ్వే యొక్క మంచితనాన్ని విధేయంగా ప్రకటిస్తుంది. తెలుగులో వ్యక్తిని సూచిస్తూ ‘ఆయన మంచివాడు’ అనడం సహజం.
- source_word: לְ/עוֹלָ֖ם
  choice: శాశ్వతంగా
  rationale: ఈ సందర్భంలో לְעוֹלָם అంతం లేని కొనసాగింపును సూచిస్తుంది; ‘శాశ్వతంగా’ దాని కాలసంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: חַסְדּֽ/וֹ
  choice: ఆయన నిలకడైన ప్రేమ
  rationale: חֶסֶד ప్రేమ, విశ్వసనీయత, నిబద్ధత అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ‘నిలకడైన ప్రేమ’ ప్రేమనూ దాని స్థిరమైన విశ్వసనీయ స్వభావాన్నీ అతిగా సంకుచితం చేయకుండా తెలియజేస్తుంది.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: ఆయన నిలకడైన ప్రేమ శాశ్వతంగా నిలుస్తుంది
  rationale: హీబ్రూలో క్రియ స్పష్టంగా లేకపోయినా వాక్యం నిరంతర స్థితిని సూచిస్తుంది. సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘నిలుస్తుంది’ చేర్చబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో ఇస్తుంది.
- issue: ఒడంబడిక సంబంధ సందర్భంలో חֶסֶד అనువాదం
  choice: నిలకడైన ప్రేమ
  alternative: ఒడంబడిక విశ్వసనీయత; కరుణ; విశ్వాసపూర్వక ప్రేమ
  rationale: ఈ పదం అనురాగం, నిబద్ధత, విశ్వసనీయతలను కలిపి సూచిస్తుంది. ‘నిలకడైన ప్రేమ’ ఈ భావవిస్తృతిని నిలబెడుతుంది; పాదసూచిక దాని ఒడంబడిక సంబంధ కోణాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆరాధనా గీతపు సంక్షిప్తతను, పునరుక్త కారణ నిర్మాణాన్ని కాపాడుతూ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చెల్లించండి,’ ‘నిలకడైన ప్రేమ,’ ‘శాశ్వతంగా నిలుస్తుంది’ వంటి పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని కవితాత్మక గంభీరతను నిలుపుతాయి.
