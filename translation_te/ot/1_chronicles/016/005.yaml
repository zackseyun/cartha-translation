source:
  edition: WLC
  text: אָסָ֥ף הָ/רֹ֖אשׁ וּ/מִשְׁנֵ֣/הוּ זְכַרְיָ֑ה יְעִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִֽ/יחִיאֵ֡ל וּ/מַתִּתְיָ֡ה וֶ/אֱלִיאָ֡ב וּ/בְנָיָהוּ֩ וְ/עֹבֵ֨ד אֱדֹ֜ם וִֽ/יעִיאֵ֗ל בִּ/כְלֵ֤י נְבָלִים֙ וּ/בְ/כִנֹּר֔וֹת וְ/אָסָ֖ף בַּֽ/מְצִלְתַּ֥יִם מַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: te
  text: ఆసాఫు ప్రధానుడు[a]; అతనికి రెండవ స్థానంలో జెకర్యా ఉన్నాడు. యెయీయేలు, షెమీరామోతు, యెహీయేలు, మత్తిత్యా, ఏలీయాబు, బెనాయా, ఓబేదెదోము, యెయీయేలు నెబెలు, కిన్నోరు అనే తంతివాద్యాలతో వాయించారు[b]; ఆసాఫు తాళాలను మోగించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆసాఫు నాయకుడు; అతనికి రెండవవాడు జెకర్యా.” హీబ్రూ పదబంధం జెకర్యా ఆసాఫుతో సంబంధించి రెండవ హోదాలో ఉన్నాడని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో నెబెలు, కిన్నోరు అనే రెండు వేర్వేరు పురాతన తంతివాద్యాలు ఉన్నాయి. వాటికి కచ్చితమైన ఆధునిక సమాన వాద్యాలను నిర్ధారించడం కష్టం.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: ఈ సేవకుల జాబితాలో רֹאשׁ శరీర భాగాన్ని కాక నాయకత్వంలో మొదటి స్థానాన్ని సూచిస్తుంది; ‘ప్రధానుడు’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: וּמִשְׁנֵהוּ
  choice: అతని తరువాతి స్థానంలో
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం ఆసాఫుతో సంబంధించి రెండవ స్థానం లేదా హోదాను సూచిస్తుంది. తెలుగు పాఠ్యంలో సహజంగా ఉండేలా ఈ సంబంధాన్ని స్పష్టం చేశాం.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: యెయీయేలు
  rationale: వచనంలో రెండుసార్లు కనిపించే ఒకే హీబ్రూ పేరును రెండుచోట్లా ఒకే విధంగా లిప్యంతరీకరించాం.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: నెబెలు, కిన్నోరు అనే తంతివాద్యాలను
  rationale: נֵבֶל, כִּנּוֹר రెండూ వేర్వేరు పురాతన తంతివాద్యాలు. ఆధునిక వాద్యాలతో అనిశ్చిత సమానీకరణ చేయకుండా పేర్లను లిప్యంతరీకరించి, వాటి వర్గాన్ని తెలిపాం.
- source_word: בַּמְצִלְתַּיִם
  choice: తాళాలను
  rationale: పరస్పరం ఢీకొట్టి మోగించే లోహ వాద్యాలను ఆధునిక సాధారణ తెలుగులో ‘తాళాలు’ అని సహజంగా చెప్పవచ్చు.
- source_word: מַשְׁמִיעַ
  choice: మోగించాడు
  rationale: שמע హిఫీల్ రూపం ఇక్కడ వాద్యాన్ని వినిపించేలా చేయడం, అంటే మోగించడం అనే భావాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. పురాతన వాద్యాల మధ్య హీబ్రూ చూపే భేదాన్ని నిలుపుతూ, నిర్ధారణలేని ఆధునిక వాద్యపేర్లను బలవంతంగా ప్రయోగించలేదు.
