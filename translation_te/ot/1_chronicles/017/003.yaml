  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: te
  text: 'అయితే ఆ రాత్రి దేవుని వాక్యం నాతానుకు వచ్చి ఇలా చెప్పింది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: అయితే ... వచ్చింది
  rationale: మొదటి וַיְהִי కథనాన్ని ముందుకు నడిపిస్తూ, మునుపటి సందర్భంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; రెండవది తెలుగులో సహజమైన ‘వాక్యం ... వచ్చింది’ అనే నిర్మాణంలో ఇమిడిపోయింది.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: కాలాన్ని, הַהוּא లోని సూచనార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: דְּבַר אֱלֹהִים
  choice: దేవుని వాక్యం
  rationale: ప్రవచనాత్మక ప్రత్యక్షతను పరిచయం చేసే సూత్రప్రయోగంలోని గంభీరతను నిలుపుతుంది; דָּבָר కు ఉన్న ‘వాక్యం/సందేశం’ అర్థపరిధిలో రూపపరంగా సమీపమైన ఎంపిక.
- source_word: אֱלֹהִים
  choice: దేవుడు / దేవుని
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి ఏకవచన భావంలో సూచిస్తుంది; సంబంధ విభక్తి నిర్మాణంలో ‘దేవుని’ సహజం.
- source_word: אֶל נָתָן
  choice: నాతానుకు
  rationale: אֶל గ్రహీతవైపు దిశను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి సహజంగా అదే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పింది
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ infinitive construct ను తెలుగులో సహజమైన ఉల్లేఖన పరిచయంగా అందిస్తుంది.
theological_decisions:
- issue: דְּבַר אֱלֹהִים అనే ప్రత్యక్షతా సూత్రప్రయోగం
  choice: దేవుని వాక్యం
  alternative: దేవుని నుండి ఒక సందేశం
  rationale: ‘దేవుని వాక్యం’ మూలంలోని construct సంబంధాన్ని, ప్రవచన ప్రత్యక్షత గంభీరతను కాపాడుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో ప్రవచన వాక్యానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుతూ అనువదించబడింది.
