source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: te
  text: ఇక యహ్వే, నీ సేవకుని గురించి, అతని ఇంటి గురించి[a] నీవు పలికిన మాట శాశ్వతంగా స్థిరపడుగాక; నీవు పలికినట్లే చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఇల్లు” అంటే అతని కుటుంబం, వంశపరంపర లేదా రాజవంశం అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు దగ్గరైన రూపంగా అందించాం.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ముందటి స్తుతి నుండి దావీదు చేస్తున్న విన్నపానికి సహజమైన మార్పును సూచిస్తుంది; తెలుగులో వాక్యారంభంలో అదనపు సంధాన పదం అవసరం లేదు.
- source_word: הַדָּבָר אֲשֶׁר דִּבַּרְתָּ
  choice: నీవు పలికిన మాట
  rationale: ‘మాట’ అనే మూలరూపాన్ని నిలిపి, దేవుడు ముందుగా పలికిన వాగ్దానంతో ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: నీ సేవకుని గురించి, అతని ఇంటి గురించి
  rationale: עַל ఇక్కడ వాగ్దానపు విషయాన్ని సూచిస్తూ ‘గురించి’ అనే అర్థంలో ఉంది. ‘ఇల్లు’ అనే నిబంధనాత్మక రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: יֵאָמֵן
  choice: స్థిరపడుగాక
  rationale: అמן ధాతువు నిఫల్ రూపం ‘స్థిరపరచబడటం/దృఢంగా నిలవడం’ అనే భావాన్ని ఇస్తుంది; ప్రార్థనాత్మక విన్నపాన్ని తెలుగులో ‘స్థిరపడుగాక’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: నిలకడైన కాలవ్యాప్తిని ఆధునిక, గౌరవప్రదమైన తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: నీవు పలికినట్లే చేయి
  rationale: దేవుడు తన వాగ్దానానికి అనుగుణంగా కార్యం చేయాలనే ప్రత్యక్ష విన్నపాన్ని, ముందు వచ్చిన ‘పలికిన’ పదంతో సమాంతరంగా నిలుపుతుంది.
theological_decisions:
- issue: దావీదు నిబంధన సందర్భంలో ‘అతని ఇల్లు’ అనే పదబంధం అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘అతని ఇల్లు’ అని నిలిపి, విస్తృతార్థాన్ని పాదసూచికలో తెలిపాం.
  alternative: అతని వంశం; అతని రాజవంశం; అతని కుటుంబ పరంపర
  rationale: ఈ సందర్భంలో ‘ఇల్లు’ దావీదు నివాసాన్ని మాత్రమే కాక అతని కుటుంబం, వంశపరంపర, రాజవంశాన్ని కూడా సూచించగలదు. ఒకే అర్థానికి పరిమితం చేయకుండా హెబ్రీ పదంలోని నిబంధనాత్మక విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని పునరుక్తి మరియు నిబంధనాత్మక ‘ఇల్లు’ రూపకాన్ని సహజంగా సాధ్యమైనంతవరకు నిలిపాం.
