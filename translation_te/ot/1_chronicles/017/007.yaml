id: 1CH.17.7
reference: 1 Chronicles 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: te
  text: '“కాబట్టి ఇప్పుడు నీవు నా సేవకుడైన దావీదుతో ఇలా చెప్పాలి: ‘సైన్యాలకు అధిపతియైన యాహ్వే ఇలా అంటున్నాడు: నేను నిన్ను మేతభూమి నుండి, మంద వెనుక నడవడం నుండి తీసుకొని, నా ప్రజలైన ఇశ్రాయేలుపై నాయకునిగా నియమించాను.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సందర్భంలోని మార్పును, స్వల్ప నిర్ధారణాత్మక భావాన్ని తెలియజేస్తూనే సంధానార్థక וְ మరియు కాలసూచక עַתָּה రెండింటినీ సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: כֹּה תֹאמַר
  choice: నీవు ... ఇలా చెప్పాలి
  rationale: ప్రవక్తకు ఇచ్చిన సందేశ ఆదేశాన్ని ఆధునిక తెలుగులో సహజంగా, దాని నిర్దేశక బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: לְעַבְדִּי
  choice: నా సేవకుడైన
  rationale: עֶבֶד దాసుణ్ణి లేదా సేవకుణ్ణి సూచించగలిగినా, ఇక్కడ దావీదుకు దేవునితో ఉన్న గౌరవప్రదమైన సేవా సంబంధమే ప్రధానంగా ఉంది.
- source_word: יְהוָה צְבָאוֹת
  choice: సైన్యాల యాహ్వే
  rationale: దైవనామాన్ని పేరుగానే ఉంచి, צְבָאוֹת అనే బిరుదులోని సైన్యాల భావాన్ని మానవ సైన్యాలకు మాత్రమే పరిమితం చేయకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְקַחְתִּיךָ
  choice: నిన్ను నేను తీసుకొని
  rationale: దావీదును ఉన్న స్థితి నుండి పైకి తీసుకువచ్చింది దేవుడే అనే దైవ చొరవను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מִן הַנָּוֶה
  choice: మేతభూమి నుండి
  rationale: గొర్రెల కాపరి సందర్భంలో נָוֶה సూచించే మేత స్థలాన్ని సహజంగా తెలియజేస్తుంది; ‘గొర్రెల దొడ్డి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: మంద వెనుక నడుస్తున్న
  rationale: కాపరి మంద వెనుక నడిచే మూల చిత్రాన్ని కాపాడుతూ తెలుగులో అర్థమయ్యే విధంగా ఉంది.
- source_word: לִהְיוֹת נָגִיד
  choice: నాయకుడిగా నియమించాను
  rationale: నాగీద్ అనే పదంలోని నియమిత నాయకత్వ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది. ‘నియమించాను’ అనేది లక్ష్యాన్ని సూచించే לִהְיוֹת ను సందర్భానుసారంగా సహజీకరిస్తుంది.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుకు
  rationale: ఇశ్రాయేలు దేవుని ప్రజలని తెలిపే స్వామ్య సంబంధాన్ని, వారిపై నాయకత్వాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించింది.
- issue: దావీదుకు వాడిన עַבְדִּי అనే సంబోధన
  choice: నా సేవకుడు
  alternative: నా దాసుడు
  rationale: ఇక్కడ బానిసత్వ స్థితికన్నా దేవునిచే ఎన్నుకోబడిన రాజసేవకుని గౌరవప్రదమైన సంబంధమే ప్రధానంగా ఉంది.
- issue: נָגִיד అనే నాయకత్వ బిరుదు
  choice: నాయకుడు
  alternative: పాలకుడు; అధిపతి
  rationale: ఈ పదం నియమించబడిన నాయకత్వాన్ని లేదా పాలనా అధికారాన్ని సూచిస్తుంది; తరువాతి సాంకేతిక రాజబిరుదును అనవసరంగా దిగుమతి చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ప్రజలకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ప్రవచన సందేశ సూత్రం పునరావృతిని ఉంచి, కాపరి చిత్రాన్ని నిలిపింది. దైవనామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
