  terminology: ‘నాతాను ప్రవక్త,’ ‘యాహ్వే,’ ‘నిబంధన మందసం,’ and ‘తెరలు’ are suitable modern-standard Telugu renderings. ‘గుడారపు తెరలు’ is a sound lexical alternative. The explanatory note should state directly that the Hebrew word denotes fabric curtains, rather than weakening this as mere possibility.
