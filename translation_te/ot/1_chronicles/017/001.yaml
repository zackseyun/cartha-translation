id: 1CH.17.1
reference: 1 Chronicles 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: te
  text: 'దావీదు తన ఇంట్లో నివసిస్తున్నప్పుడు ఇలా జరిగింది: దావీదు నాతాను ప్రవక్తతో, “చూడు, నేను దేవదారు చెక్కతో చేసిన ఇంట్లో నివసిస్తున్నాను; కానీ యాహ్వే నిబంధన మందసం తెరల[a] కింద ఉంది” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారపు తెరల కింద.” హీబ్రూ పదం వస్త్రపు తెరలను సూచిస్తుంది; ప్రత్యేకంగా గుడారం లేదా ప్రత్యక్ష గుడారపు తెరలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: నివసిస్తున్నప్పుడు ఇలా జరిగింది
  rationale: వַיְהִי కథనంలో కొత్త సన్నివేశాన్ని పరిచయం చేస్తుంది; כַּאֲשֶׁר కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా రెండింటినీ కలిపి అనువదించాం.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: నివసిస్తున్నప్పుడు ... నివసిస్తున్నాను
  rationale: ఇంటి సందర్భంలో ישׁב అంటే కూర్చోవడం కంటే నివసించడం. మూలంలోని పదపునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: בְּבֵיתוֹ
  choice: తన ఇంట్లో
  rationale: మూలంలో ‘అతని ఇంట్లో’ అని ఉంది. రాజభవనం అనే భావం సందర్భంలో ఉన్నా, ‘ఇల్లు’ అనే మూలపదాన్ని నిలిపాం.
- source_word: נָתָן הַנָּבִיא
  choice: నాతాను ప్రవక్త
  rationale: వ్యక్తి పేరుతో పాటు అతని ప్రవక్త హోదాను సహజమైన తెలుగు క్రమంలో ఇచ్చాం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: మాట వినేవారి దృష్టిని విషయంపై నిలిపే అవధానార్థక పదానికి ఆధునిక, సహజమైన సమానార్థకం.
- source_word: בְּבֵית הָאֲרָזִים
  choice: దేవదారు మ్రానుతో కట్టిన ఇంట్లో
  rationale: ఇది దేవదారు కలపతో నిర్మించిన ఇంటిని సూచిస్తుంది. ‘దేవదారు ఇల్లు’ కంటే ఈ రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: కానీ యాహ్వే నిబంధన మందసం
  rationale: וַ ఇక్కడ దావీదు ఇంటికీ మందసం ఉన్న స్థితికీ మధ్య వ్యత్యాసాన్ని సూచిస్తుంది; అందువల్ల ‘కానీ’ వాడాం. אֲרוֹן‌ను బైబిలు సందర్భానికి తగిన ‘మందసం’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: תַּחַת יְרִיעוֹת
  choice: తెరల కింద
  rationale: יְרִיעוֹת వస్త్రపు తెరలను, ప్రత్యేకంగా గుడారం లేదా ప్రత్యక్ష గుడారపు తెరలను సూచించవచ్చు. ప్రధాన పాఠంలో విస్తృతార్థాన్ని ఉంచి, సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా కాపాడుతుంది.
- issue: בְּרִית అనే సంబంధం
  choice: యాహ్వే నిబంధన మందసం
  alternative: యాహ్వే యొక్క నిబంధన మందసం
  rationale: హీబ్రూ పదబంధంలోని సంబంధాన్ని సహజమైన తెలుగు సమాసరూపంలో ఉంచాం; మందసం యాహ్వేతో సంబంధించిన నిబంధన మందసమనే భావాన్ని అదనపు వివరణ లేకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని ‘ఇల్లు/ఇంట్లో’ మరియు ‘నివసించు’ పునరుక్తులను భావపరమైన వ్యత్యాసం కోసం నిలిపాం. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘తెరలు’ వద్ద ఉంచాం.
