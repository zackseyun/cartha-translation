  - severity: low
    issue: Footnote wording ‘హీబ్రూ మాటలను’ is imprecise.
    rationale: The alternative concerns the sense of the Hebrew clause/construction, not isolated words; ‘హీబ్రూ వాక్యాన్ని’ is clearer and more accurate.
