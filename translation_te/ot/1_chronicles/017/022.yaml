id: 1CH.17.22
reference: 1 Chronicles 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: te
  text: నీవు నీ ప్రజలైన ఇశ్రాయేలును నీకు శాశ్వతంగా ప్రజలుగా చేసుకున్నావు; యాహ్వే, నీవు వారికి దేవుడవయ్యావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు వారికి దేవుడిగా ఉన్నావు.” హీబ్రూ వాక్యాన్ని స్థితిని సూచించే విధంగా కూడా అనువదించవచ్చు; ప్రధాన పాఠం ఈ సందర్భంలోని నిబంధన సంబంధ స్థాపన భావాన్ని ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: చేసుకున్నావు
  rationale: נתן అనే క్రియకు అక్షరార్థంగా ‘ఇచ్చావు’ అని అర్థం వచ్చినా, ఇక్కడ לְךָ לְעָם అనే నిర్మాణంతో కలిసి ఇశ్రాయేలును దేవుడు తన ప్రజలుగా స్థాపించిన భావాన్ని ఇస్తుంది. ‘చేసుకున్నావు’ ఆ సంబంధ స్థాపనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు
  rationale: ఇశ్రాయేలు ఎవరో వివరిస్తున్న సమానాధికార నిర్మాణాన్ని, అలాగే దేవునికి చెందిన ప్రజలనే భావాన్ని కాపాడుతుంది.
- source_word: לְךָ לְעָם
  choice: నీ ప్రజలుగా
  rationale: జతగా వచ్చిన לְ ఉపసర్గలు దేవునికి చెందిన ప్రజలుగా ఏర్పడిన స్థితిని సూచిస్తాయి. ఈ భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: కొనసాగుతూ ఉండే శాశ్వత కాలాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ లిప్యంతరీకరణను తెలుగులో ఇస్తుంది.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: వారికి దేవుడవయ్యావు
  rationale: היה యొక్క సంపూర్ణ క్రియారూపం సందర్భంలో నిబంధన సంబంధం స్థాపించబడినదాన్ని సూచించవచ్చు. ‘దేవుడవయ్యావు’ ఆ కథనాత్మక, సంబంధాత్మక బలాన్ని నిలుపుతుంది; దేవుని స్వభావంలో మార్పును సూచించదు.
theological_decisions:
- issue: היה + ל + אלהים అనే నిబంధన సూత్రాన్ని ఎలా అనువదించాలి
  choice: వారికి దేవుడవయ్యావు
  alternative: వారికి దేవుడిగా ఉన్నావు
  rationale: సందర్భం దేవుడు ఇశ్రాయేలును తన ప్రజలుగా ఏర్పరచి, వారికి దేవుడిగా నిబంధన సంబంధాన్ని స్థాపించినదాన్ని వివరిస్తుంది. ప్రధాన పాఠం ఆ సంబంధ స్థాపన బలాన్ని ఉంచుతుంది; హీబ్రూ వాక్యాన్ని స్థితిని తెలిపే విధంగా కూడా అర్థం చేసుకోవచ్చని పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని నిబంధన సంబంధ భావాన్ని నిలుపుతూ, היה క్రియలోని నిజమైన వ్యాఖ్యాన భేదాన్ని పాదసూచికలో సంరక్షించింది.
