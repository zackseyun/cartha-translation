revisions:
- from: యెహోవా[a], నీ సేవకుని నిమిత్తం, నీ హృదయానుసారంగా నీవు ఈ గొప్ప కార్యమంతా చేసి, ఈ గొప్ప కార్యాలన్నిటినీ తెలియజేశావు.[b]
  to: యాహ్వే[a], నీ సేవకుని నిమిత్తం, నీ హృదయానుసారంగా నీవు ఈ గొప్పతనమంతా[b] చేశావు, సమస్త గొప్ప కార్యాలన్నిటినీ తెలియజేయడానికి.
  rationale: The revision restores the purpose force of the Hebrew infinitive (‘to make known’), retains the source’s collective singular followed by plural, and changes the divine-name transliteration to conform to the project’s Yahweh policy. No theological interpretation has been added.
