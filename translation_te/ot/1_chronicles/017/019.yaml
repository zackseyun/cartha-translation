source:
  edition: WLC
  text: יְהוָ֕ה בַּ/עֲב֤וּר עַבְדְּ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הֹדִ֖יעַ אֶת כָּל הַ/גְּדֻלּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: te
  text: యాహ్వే[a], నీ సేవకుని నిమిత్తం, నీ హృదయానుసారంగా నీవు ఈ గొప్పతనమంతా[b] చేశావు, సమస్త గొప్ప కార్యాలన్నిటినీ తెలియజేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దైవనామమైన YHWHకు తెలుగు లిప్యంతరీకరణ.
    reason: divine_name
  - marker: b
    text: హీబ్రూ పాఠంలో మొదట ‘ఈ గొప్పతనమంతా’ అని ఏకవచనం, తరువాత ‘గొప్ప కార్యాలన్నీ’ అని బహువచనం ఉంది. మొదటిది సమష్టిగా గొప్పతనాన్ని, రెండవది దాని వివిధ వ్యక్తీకరణలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: నీ సేవకుని నిమిత్తం
  rationale: ఈ పదబంధం దేవుని కార్యానికి ఆయన సేవకునితో ఉన్న సంబంధాన్ని లేదా అతని పట్ల గల ఉద్దేశాన్ని సూచిస్తుంది; ప్రార్థనా సందర్భంలో ‘సేవకుడు’ సహజంగా ఉంటుంది.
- source_word: וּכְלִבְּךָ
  choice: నీ హృదయానుసారంగా
  rationale: మూలంలోని ‘హృదయం’ రూపకాన్ని నిలిపి, దేవుని అంతరంగ సంకల్పం లేదా చిత్తం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָשִׂיתָ
  choice: చేసి
  rationale: వాక్యంలోని ఉద్దేశార్థక క్రియతో సహజంగా అనుసంధానిస్తూ, దేవుడు కార్యాన్ని నెరవేర్చాడనే భావాన్ని అందిస్తుంది.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ఈ గొప్ప కార్యమంతా
  rationale: ఏకవచన సమష్టి భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; సందర్భంలో ‘గొప్పతనం’ కంటే దేవుని గొప్ప కార్యాన్ని సూచించడం స్పష్టంగా ఉంటుంది.
- source_word: לְהֹדִיעַ
  choice: తెలియజేశావు
  rationale: హిఫిల్ క్రియలోని కారణార్థక భావాన్ని ‘తెలియజేయడం’ సూటిగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: ఈ గొప్ప కార్యాలన్నిటినీ
  rationale: మూలంలోని బహువచనాన్ని నిలిపి, ముందున్న సమష్టి ఏకవచనానికి సంబంధించిన అనేక గొప్ప కార్యరూపాలను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన పేరురూపాన్ని ఉపయోగించాం.
- issue: ‘నీ హృదయానుసారంగా’ అనే మానవరూపక వ్యక్తీకరణ
  choice: నీ హృదయానుసారంగా
  alternative: నీ చిత్తానుసారంగా
  rationale: దేవుని అంతరంగ సంకల్పాన్ని సూచించే మూలభాషా రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలిపాం.
- issue: ఏకవచన ‘గొప్పతనం’ నుంచి బహువచన ‘గొప్ప కార్యాలు’కు మార్పు
  choice: ఈ గొప్ప కార్యమంతా ... ఈ గొప్ప కార్యాలన్నిటినీ
  alternative: ఈ మహిమ అంతా ... సమస్త మహిమలను
  rationale: మూలంలోని సంఖ్యామార్పును నిలిపి, మొదట సమష్టిగా, తరువాత దాని అనేక వ్యక్తీకరణలుగా అర్థమయ్యేలా చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘హృదయానుసారంగా’ అనే మూలరూపకాన్ని నిలిపి, ఏకవచన-బహువచన మార్పును సహజమైన ‘కార్యం/కార్యాలు’ ద్వారా ప్రతిబింబించాం.
