id: 1CH.17.12
reference: 1 Chronicles 17:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: te
  text: అతడు నా కోసం ఒక ఇల్లు[a] కడతాడు; నేను అతని సింహాసనాన్ని శాశ్వతంగా స్థిరపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందిరం.’ హీబ్రూ పదానికి అక్షరార్థం ‘ఇల్లు’; ఈ సందర్భంలో అది సొలొమోను కట్టబోయే పవిత్రస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: అతడే
  rationale: స్వతంత్ర తృతీయ పురుష ఏకవచన సర్వనామం ఇక్కడ కర్తను స్పష్టంగా, కొంత నొక్కి చెబుతుంది; తెలుగు ‘అతడే’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִבְנֶה
  choice: కడతాడు
  rationale: בנה ధాతువు Qal imperfect రూపం; వాగ్దాన సందర్భంలో భవిష్యత్తు కార్యాన్ని సూచిస్తుంది. తెలుగులో ‘కడతాడు’ సహజమైన భవిష్యదర్థక రూపం.
- source_word: לִּי
  choice: నా కోసం
  rationale: ל ఉపసర్గతో మొదటి పురుష ఏకవచన ప్రత్యయం ఇక్కడ ప్రయోజనం లేదా సంబంధాన్ని సూచిస్తుంది; ‘నా కోసం’ తెలుగు నుడికారానికి సరిపోతుంది.
- source_word: בָּיִת
  choice: ఒక మందిరాన్ని
  rationale: మూలపదానికి అక్షరార్థం ‘ఇల్లు’; అయితే దేవుని కోసం కట్టబడే గృహం అనే ఈ సందర్భంలో తెలుగులో ‘మందిరం’ సహజంగా పవిత్రస్థలాన్ని సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: וְכֹנַנְתִּי
  choice: నేను ... స్థిరపరుస్తాను
  rationale: כון యొక్క ఈ రూపం స్థిరపరచడం, దృఢంగా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది; రాజసింహాసన వాగ్దాన సందర్భంలో ‘స్థిరపరుస్తాను’ స్పష్టమైన సమానార్థకం.
- source_word: אֶת כִּסְאוֹ
  choice: అతని సింహాసనాన్ని
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన ‘సింహాసనం’ అనే నామవాచకానికి తృతీయ పురుష ఏకవచన ప్రత్యయం ఉంది; తెలుగు సహజ నిర్మాణం ‘అతని సింహాసనాన్ని’.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: ఈ హీబ్రూ నుడికారం నిరంతరమైన, అంతంలేని కాలాన్ని సూచిస్తుంది; ‘శాశ్వతంగా’ గంభీరమైన, సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: בָּיִת ను ‘ఇల్లు’గా అక్షరానువాదం చేయాలా, ‘మందిరం’గా సందర్భానుసారంగా అనువదించాలా
  choice: మందిరం
  alternative: ఇల్లు
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, దేవుని కోసం సొలొమోను కట్టబోయే పవిత్రస్థలమే సందర్భంలోని సూచన. ఆధునిక తెలుగులో ‘నా కోసం ఒక ఇల్లు’ నివాసగృహంగా తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున ప్రధాన పాఠంలో ‘మందిరం’ ఉంచి, మూలంలోని విస్తృత పదాన్ని పాదసూచికలో తెలిపాం.
- issue: עַד עוֹלָם యొక్క దైవశాస్త్రీయ పరిధి
  choice: శాశ్వతంగా
  alternative: ఎప్పటికీ
  rationale: వాగ్దానం ఏ విధంగా అంతిమంగా నెరవేరుతుందో వివరణాత్మకంగా నిర్ణయించకుండా, మూలపాఠంలోని నిరంతరత్వపు వాదనను నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అతడే’ మూలంలోని స్పష్టమైన సర్వనామ బలాన్ని నిలుపుతుంది; ‘స్థిరపరుస్తాను’ రాజవాగ్దాన సందర్భానికి తగిన గంభీరతను ఇస్తుంది.
