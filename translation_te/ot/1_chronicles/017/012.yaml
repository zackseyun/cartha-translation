    reason: lexical_alternative
  revision_rationale: The revision restores the source-level wording ‘house’ in the main text while retaining ‘temple’ as a contextual lexical alternative in the footnote. It also uses a neutral explicit subject pronoun and leaves the promise’s enduring scope unqualified.
