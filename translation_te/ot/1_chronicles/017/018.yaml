id: 1CH.17.18
reference: 1 Chronicles 17:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַה יּוֹסִ֨יף ע֥וֹד דָּוִ֛יד אֵלֶ֖י/ךָ לְ/כָב֣וֹד אֶת עַבְדֶּ֑/ךָ וְ/אַתָּ֖ה אֶֽת עַבְדְּ/ךָ֥ יָדָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/018.yaml
  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: te
  text: నీ సేవకుణ్ణి ఘనపరచినందుకు దావీదు నీకు ఇంకా ఏమి చెప్పగలడు?[a][b] నీవు నీ సేవకుణ్ణి ఎరిగి ఉన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సేవకుణ్ణి ఘనపరచినందుకు దావీదు నీకు ఇంకా ఏమి జోడించగలడు?’ ‘చెప్పగలడు’ అనే భావం వాక్యాన్ని సహజంగా చేయడానికి చేర్చబడింది; ‘చెప్పు’ అనే క్రియ హీబ్రూ పాఠంలో ప్రత్యక్షంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ సేవకుణ్ణి ఘనపరచినందుకు’ అని అనువదించిన హీబ్రూ పదబంధం క్లిష్టమైనది. దాన్ని ‘నీ సేవకుని ఘనత విషయంగా’ లేదా ‘నీ సేవకుణ్ణి ఘనపరచడానికి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: ఏమి
  rationale: ఇది ‘ఇంకా ఏమి...?’ అనే అలంకారప్రశ్నను ప్రారంభిస్తుంది.
- source_word: יוֹסִיף עוֹד
  choice: ఇంకా ... చెప్పగలడు
  rationale: అక్షరార్థంగా ‘ఇంకా చేర్చగలడు’ అని ఉన్నా, ప్రార్థనలో మాటల సందర్భాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ‘చెప్పగలడు’ అని అనువదించబడింది; ‘చెప్పు’ అనే క్రియ హీబ్రూ పాఠంలో ప్రత్యక్షంగా లేదని పాదసూచిక తెలియజేస్తుంది.
- source_word: דָּוִיד
  choice: దావీదు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֵלֶיךָ
  choice: నీతో
  rationale: దేవునికి నేరుగా చేసే సంబోధనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నీ ఎదుట’ అని కూడా అనువదించవచ్చు.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: నీ సేవకుణ్ణి ఘనపరచినందుకు
  rationale: సంక్షిప్తంగా, వ్యాకరణపరంగా క్లిష్టంగా ఉన్న హీబ్రూ పదబంధాన్ని సందర్భానుసారం దేవుడు తన సేవకుడైన దావీదును ఘనపరచినట్లు గ్రహించి అనువదిస్తుంది; ఇతర సాధ్యమైన పఠనాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుణ్ణి
  rationale: దేవుని ఎదుట తనను తాను దావీదు ‘నీ సేవకుడు’ అని పేర్కొంటున్నాడు.
- source_word: וְאַתָּה אֶת עַבְדְּךָ יָדָעְתָּ
  choice: నీవు నీ సేవకుణ్ణి ఎరిగి ఉన్నావు
  rationale: యָדַע క్రియలోని స్థిరమైన, వ్యక్తిగత ఎరుగుదల భావాన్ని, కాలసూచనను అతిగా నిర్దిష్టం చేయకుండా తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְכָבוֹד אֶת עַבְדֶּךָ అనే క్లిష్ట పదబంధం యొక్క భావం
  choice: దేవుడు దావీదును ఘనపరచిన చర్యను సూచిస్తూ ‘నీ సేవకుణ్ణి ఘనపరచినందుకు’
  alternative: ‘నీ సేవకుని ఘనత విషయంగా’ లేదా ‘నీ సేవకుణ్ణి ఘనపరచడానికి’
  rationale: విస్తృత సందర్భంలో దేవుడు దావీదుకు చూపిన గొప్ప గౌరవాన్ని చూసి అతడు ఆశ్చర్యపడుతున్నాడు. ప్రధాన పాఠం ఆ భావాన్ని సహజంగా అందిస్తుంది; హీబ్రూలోని నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి ఉపయోగించబడింది. ‘ఎరిగి ఉన్నావు’ అనేది సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, దేవుని స్థిరమైన వ్యక్తిగత ఎరుగుదల భావాన్ని నిలుపుతుంది.
