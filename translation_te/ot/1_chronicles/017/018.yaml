    issue: నీతో renders אֵלֶיךָ inaccurately.
    rationale: నీతో normally means “with you,” whereas the Hebrew preposition here marks David’s address directed to God (“to you”). Telugu నీకు preserves that relationship without importing the spatial nuance of “before you.”
  - severity: low
