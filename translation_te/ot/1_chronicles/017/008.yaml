id: 1CH.17.8
reference: 1 Chronicles 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥ית אֶת כָּל אוֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤יתִֽי לְ/ךָ֙ שֵׁ֔ם כְּ/שֵׁ֥ם הַ/גְּדוֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: te
  text: నీవు వెళ్లిన ప్రతిచోటా నేను నీతో ఉన్నాను. నీ శత్రువులందరినీ నీ ఎదుటనుండి తొలగించాను. భూమిమీద ఉన్న గొప్పవారి పేరువంటి పేరు నీకు కలుగజేస్తాను[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు గొప్ప ఖ్యాతిని కలుగజేస్తాను.” హీబ్రూలో అక్షరార్థంగా, “నీకు ఒక పేరు కలుగజేస్తాను.”
    reason: lexical_alternative
  - marker: b
    text: “భూమిమీద” అనే మాటకు “దేశంలో” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: నేను నీతో ఉన్నాను
  rationale: హీబ్రూ కథన క్రమంలో ఇది దావీదు గతాన్ని వెనుదిరిగి చూస్తూ దేవుని సన్నిధి, సహాయాన్ని తెలియజేస్తుంది.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: నీవు వెళ్లిన ప్రతిచోటా
  rationale: అక్షర నిర్మాణాన్ని బలవంతంగా అనుసరించకుండా, ప్రతి ప్రయాణంలోనూ అనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ
  choice: నీ శత్రువులందరినీ నిర్మూలించాను
  rationale: כרת హిఫీల్ రూపం తొలగించడం లేదా నాశనం చేయడం అనే భావాన్ని ఇక్కడ ఇస్తుంది; ‘అందరినీ’ మూలంలోని సమగ్రతను నిలుపుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటి నుంచి
  rationale: ‘నీ ముఖం/సన్నిధి నుంచి’ అనే హీబ్రూ స్థల నుడికారాన్ని తెలుగులో అర్థమయ్యేలా, దావీదు మార్గం నుంచి శత్రువులు తొలగించబడ్డారనే చిత్రంతో నిలుపుతుంది.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: పేరును నీకు కలుగజేస్తాను
  rationale: వాగ్దాన క్రమంలో భవిష్యత్ భావాన్ని చూపుతుంది. ‘పేరు’ కీర్తి లేదా ఖ్యాతిని సూచించినప్పటికీ, మూలంలోని ప్రాముఖ్యమైన నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: గొప్పవారి పేరులాంటి పేరు
  rationale: ప్రముఖుల లేదా ఘనుల ఖ్యాతితో పోలికను నిలుపుతుంది; హీబ్రూ విశేషణంలో లేని అదనపు లింగ నిర్దిష్టతను చేర్చదు.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: భూమిమీద ఉన్న
  rationale: אֶרֶץ అనేది ‘భూమి’ లేదా ‘దేశం’ కావచ్చు. విస్తృత ఖ్యాతి సందర్భంలో ‘భూమి’ ప్రధాన పాఠ్యానికి తగినది; మరొక సాధ్యార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: దైవ కార్యాల కాలక్రమం
  choice: మొదటి రెండు కార్యాలు గతకాలంలో, చివరి మాట భవిష్యత్ వాగ్దానంగా అనువదించబడింది.
  alternative: అన్ని వాక్యభాగాలను గతకాలంగా లేదా అన్నిటినీ భవిష్యత్ కాలంగా అనువదించడం.
  rationale: ఈ వచనం దేవుడు గతంలో దావీదుతో ఉండి శత్రువులను తొలగించిన విశ్వసనీయతను గుర్తుచేసి, ఆపై అతనికి గొప్ప పేరు కలుగజేస్తాననే ముందున్న వాగ్దానానికి మారుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ ‘పేరు’ నుడికారం ప్రధాన పాఠ్యంలో నిలుపబడి, దాని ‘ఖ్యాతి’ భావం పాదసూచికలో స్పష్టం చేయబడింది. אֶרֶץ లోని ‘భూమి/దేశం’ సందిగ్ధతను కూడా పాదసూచికలో సంరక్షించాం.
