    rationale: a గుర్తు ‘పేరు కలుగజేస్తాను’ అనే నుడికారానికి, b గుర్తు ‘భూమిమీద’కు సంబంధించినది. సంబంధిత పదాల వద్ద గుర్తులు ఉంచితే పాదసూచికల అనుసంధానం స్పష్టంగా ఉంటుంది.
