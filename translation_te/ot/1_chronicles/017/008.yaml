  to: నీవు వెళ్లిన ప్రతిచోటా నేను నీతో ఉన్నాను. నీ శత్రువులందరినీ నీ ఎదుటనుండి తొలగించాను. భూమిమీద ఉన్న గొప్పవారి పేరువంటి పేరు నీకు కలుగజేస్తాను[a][b].
