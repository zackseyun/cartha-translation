id: 1CH.17.2
reference: 1 Chronicles 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: te
  text: 'నాతాను దావీదుతో ఇలా అన్నాడు: “నీ హృదయంలో ఉన్నదంతా చేయి, ఎందుకంటే దేవుడు నీతో ఉన్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు కథన శైలిలో వాక్యాంతంలోని ‘అన్నాడు’ సహజంగా సంభాషణను సూచిస్తుంది; ప్రత్యేకంగా ‘అప్పుడు’ చేర్చడం అవసరం లేదు.
- source_word: נָתָן
  choice: నాతాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶל דָּוִיד
  choice: దావీదుతో
  rationale: మాట్లాడటాన్ని సూచించే ‘అను’ క్రియతో తెలుగు భాషలో ‘తో’ సహజమైన సంబంధవిభక్తి; ఇది మూలంలోని దిశాత్మక సంబంధాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: כֹּל אֲשֶׁר
  choice: ఉన్నదంతా
  rationale: తరువాత చెప్పబడిన అంతటినీ సమగ్రంగా సూచిస్తుంది. ‘ఉన్నదంతా’ విస్తృతిని నిలుపుతూ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בִּלְבָבְךָ
  choice: నీ హృదయంలో
  rationale: לֵבָב అంతరంగ సంకల్పం, ఆలోచన లేదా ఉద్దేశాన్ని సూచించగలదు. ‘హృదయం’ మూలంలోని మానవ అంతరంగ ప్రతీకను నిలుపుతుంది; దానిని కేవలం ‘మనసు’ లేదా ‘ఉద్దేశం’గా పరిమితం చేయదు.
- source_word: עֲשֵׂה
  choice: చేయి
  rationale: עשה ఆజ్ఞారూపం ఇక్కడ నేరుగా కార్యాచరణను ఆదేశిస్తుంది. ‘చేయి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఎందుకంటే’ కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: మూలంలో ఇది אֱלֹהִים; יהוה కాదు. హీబ్రూలోని నిర్దిష్ట ఉపపదంతో ఉన్న ఈ రూపం ఇక్కడ నిజమైన దేవునికి నిర్దిష్ట సూచనగా పనిచేస్తుంది; తెలుగులో ‘దేవుడు’ సహజమైన అనువాదం.
- source_word: עִמָּךְ
  choice: నీతో ఉన్నాడు
  rationale: దైవిక సన్నిధి లేదా అనుకూల సహవాసాన్ని సూచించే సాధారణ పదబంధం. ‘నీతో ఉన్నాడు’ తెలుగులో సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הָאֱלֹהִים అనే దైవ బిరుదు అనువాదం
  choice: దేవుడు
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం אֱלֹהִים అని ఉంది, יהוה అని కాదు. అందువల్ల దైవనామాన్ని దిగుమతి చేయకుండా ‘దేవుడు’ అని అనువదించాం.
- issue: ‘దేవుడు నీతో ఉన్నాడు’ అనే మాటలోని భావం
  choice: మూలంలోని సన్నిధి/మద్దతు సూచనను వివరణ లేకుండా నిలుపడం
  alternative: ‘దేవుడు నీకు సహాయం చేస్తాడు’ అని స్పష్టీకరించడం
  rationale: עִמָּךְ దైవసన్నిధి, అనుకూలత లేదా మద్దతును సూచించవచ్చు. వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. ‘హృదయం’ అనే మూల ప్రతీకను నిలుపుతూ వాక్యనిర్మాణాన్ని సహజ తెలుగుకు అనుగుణంగా ఉంచాం.
