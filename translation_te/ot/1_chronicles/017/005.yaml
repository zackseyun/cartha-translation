id: 1CH.17.5
reference: 1 Chronicles 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: te
  text: ఎందుకంటే, నేను ఇశ్రాయేలును పైకి తీసుకొచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు ఏ ఇంటిలోనూ నివసించలేదు. కాని గుడారం నుండి గుడారానికి, నివాసస్థలం నుండి నివాసస్థలానికి ఉంటూ వచ్చాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “గుడారం నుండి గుడారానికి, పవిత్ర గుడారం నుండి పవిత్ర గుడారానికి నేను ఉంటూ వచ్చాను.” చివరి హెబ్రూ పదబంధంలో రెండవ “కు” పదం స్పష్టంగా లేదు.'
    reason: వָאֶהְיֶהను ‘ఉన్నాను/ఉంటూ వచ్చాను’ అనే స్థితి భావంతో, משכןను సాంకేతికంగా ‘పవిత్ర గుడారం’గా అనువదించవచ్చు. చివరి సంక్షిప్త హెబ్రూ పదబంధంలోని గమ్యపదం వివాదాస్పదంగా/సూచితంగా ఉండటాన్ని ఈ గమనిక భద్రపరుస్తుంది.
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: నివసించలేదు
  rationale: ఒక స్థలంతో వాడినప్పుడు ישב అంటే ‘నివసించు’ అని అర్థం. ‘కూర్చోలేదు’ అనే అక్షరార్థం ఈ సందర్భానికి సరిపోదు.
- source_word: בְּבַיִת
  choice: ఏ ఇంటిలోనూ
  rationale: בית ఇక్కడ శాశ్వతమైన కట్టడాన్ని సూచిస్తూ గుడారాలతో వ్యత్యాసంగా ఉంది. ‘దేవాలయం’ అనడం హెబ్రూలో స్పష్టంగా లేని భావాన్ని ముందుగానే చేర్చుతుంది; నిషేధ వాక్యంలో సహజమైన తెలుగుకోసం ‘ఏ ఇంటిలోనూ’ వాడబడింది.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: నేను ఇశ్రాయేలును పైకి తీసుకొచ్చిన
  rationale: עלה హిఫీల్ రూపం ‘పైకి తీసుకురావడం’ అనే దైవ కార్యాన్ని వ్యక్తం చేస్తుంది. ఇది ఐగుప్తు నుండి ఇశ్రాయేలును తీసుకురావడాన్ని సూచించినప్పటికీ, మూలపాఠంలోని దిశా భావాన్ని అలాగే ఉంచుతుంది.
- source_word: וָאֶהְיֶה
  choice: వెళ్తూ ఉన్నాను
  rationale: పదశః ‘నేను ఉన్నాను/ఉంటూ వచ్చాను.’ తరువాతి ‘ఒక గుడారం నుండి మరొక గుడారానికి’ అనే పదబంధం సూచించే సంచార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేయడానికి ‘వెళ్తూ ఉన్నాను’ అని అనువదించబడింది.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: ఒక గుడారం నుండి మరొక గుడారానికి
  rationale: మూలంలోని ‘గుడారం నుండి గుడారానికి’ అనే పునరుక్తి, సంచారాన్ని తెలుగులో స్పష్టంగా తెలియజేసే విధంగా ఇవ్వబడింది.
- source_word: וּמִמִּשְׁכָּן
  choice: ఒక నివాసస్థలం నుండి మరొక నివాసస్థలానికి
  rationale: משכן అంటే ‘నివాసస్థలం’ లేదా సందర్భానుసారంగా పవిత్ర గుడారం. హెబ్రూ చివరి పదబంధం సంక్షిప్తంగా ఉన్నందున, ముందున్న సమాంతర నిర్మాణాన్ని అనుసరించి తెలుగులో గమ్యాన్ని పూరించి చెప్పబడింది; సాంకేతిక ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: తరువాతి దేవాలయ భావనను ముందుగానే మూలపాఠంలోకి తీసుకురాకుండా పవిత్రస్థల పదజాలాన్ని అనువదించడం
  choice: ప్రధాన పాఠంలో ‘ఇల్లు,’ ‘నివాసస్థలం’ అనే సాధారణ పదాలను వాడడం
  alternative: ביתకు ‘దేవాలయం,’ משכןకు సాంకేతిక పదంగా ‘పవిత్ర గుడారం’ వాడడం
  rationale: ఈ వాక్యం శాశ్వత కట్టడంలో దేవుడు నివసించకపోవడాన్ని సంచార గుడారపు నివాసంతో వ్యత్యాసపరుస్తుంది. ‘దేవాలయం’ అని అనువదించడం హెబ్రూలో ప్రత్యక్షంగా లేని తరువాతి భావాన్ని చేర్చుతుంది; అయితే משכןకు ఉన్న పవిత్ర గుడారపు భావాన్ని పాదసూచిక గుర్తిస్తుంది.
- issue: וָאֶהְיֶהలోని స్థితి భావం మరియు సందర్భంలోని సంచార భావం
  choice: ప్రధాన పాఠంలో ‘వెళ్తూ ఉన్నాను’
  alternative: ‘ఉంటూ వచ్చాను’
  rationale: క్రియ స్వయంగా ‘ఉండడం’ అని ఉన్నప్పటికీ, ‘గుడారం నుండి గుడారానికి’ అనే తరువాతి మాటలు సంచారాన్ని సూచిస్తాయి. ప్రధాన పాఠం సహజమైన తెలుగు కోసం ఆ సూచిత భావాన్ని వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ రచించబడింది. ‘దేవాలయం’ వంటి అధిక నిర్దిష్టత గల పదాన్ని ప్రధాన పాఠంలో నివారించారు. మూలంలోని కారణసూచక כִּי కోసం ‘ఎందుకంటే,’ వ్యత్యాసాన్ని స్పష్టం చేయడానికి ‘బదులుగా’ వాడబడ్డాయి.
