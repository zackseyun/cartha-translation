  to: ఎందుకంటే, నేను ఇశ్రాయేలును పైకి తీసుకొచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు ఏ ఇంటిలోనూ నివసించలేదు. కాని గుడారం నుండి గుడారానికి, నివాసస్థలం నుండి నివాసస్థలానికి ఉంటూ వచ్చాను.[a]
  rationale: The revision keeps the literal contrast between a permanent house and movable sanctuary settings, while rendering וָאֶהְיֶה with a Telugu continuative state expression rather than an explicit travel verb. It also moderates the connective and clarifies in the footnote that the final Hebrew phrase is abbreviated.
