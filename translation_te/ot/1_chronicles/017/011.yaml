id: 1CH.17.11
reference: 1 Chronicles 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: te
  text: నీ రోజులు నిండి, నీవు నీ పితరులతో చేరడానికి వెళ్లే వేళ[a], నీ తరువాత నీ సంతానాన్ని—నీ కుమారుల్లో ఒకడిని—నేను నిలబెడతాను; అతని రాజ్యాన్ని స్థిరపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ పితరులతో కలిసి వెళ్లడానికి.” ఇది మరణించి తన పూర్వికులతో చేరడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేసే సూత్రప్రాయ నిర్మాణాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా తెలిపింది.
- source_word: מָלְאוּ יָמֶיךָ
  choice: నీ రోజులు నిండి
  rationale: జీవితకాలం పూర్తికావడాన్ని సూచించే హీబ్రూ నుడికారాన్ని గంభీరతతో, అర్థమయ్యే విధంగా నిలిపింది.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: నీ పితరులతో ఉండడానికి నీవు వెళ్లవలసిన
  rationale: దినవృత్తాంతాల్లోని ప్రత్యేకమైన ‘పితరులతో వెళ్లడం’ అనే మాటను ‘నిద్రించడం’గా మార్చకుండా, మరణించి పూర్వికులతో చేరే భావాన్ని సహజ తెలుగులో తెలియజేసింది.
- source_word: וַהֲקִימוֹתִי
  choice: నేను నిలబెడతాను
  rationale: తరువాతి వారసుడు ఉద్భవించేలా చేయడం అనే కום హిఫీల్ భావాన్ని తెలిపి, తరువాతి הכין క్రియకు వాడిన ‘స్థిరపరుస్తాను’తో తేడాను కాపాడింది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానాన్ని
  rationale: ఒక వ్యక్తిని సూచించగల సమూహార్థ ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: నీ కుమారుల్లో ఒకడిని
  rationale: వాగ్దానం చేయబడిన వారసుడు దావీదు కుమారుల్లో ఒకడని తెలిపే מן యొక్క విభాగార్థాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: וַהֲכִינוֹתִי אֶת מַלְכוּתוֹ
  choice: అతని రాజ్యాన్ని స్థిరపరుస్తాను
  rationale: రాజ్యాన్ని దృఢంగా, భద్రంగా నెలకొల్పే నిబంధనాత్మక భావాన్ని సహజంగా తెలియజేసింది.
theological_decisions:
- issue: దావీదు వంశానికి ఇచ్చిన వాగ్దానం మరియు మెస్సీయ సంబంధిత ప్రతిధ్వని
  choice: దావీదు కుమారుల్లో ఒక వారసుడు అనే తక్షణ చారిత్రక అర్థాన్నే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ప్రధాన పాఠ్యంలోనే స్పష్టమైన మెస్సీయ బిరుదు లేదా వ్యాఖ్యానాన్ని చేర్చడం
  rationale: ఈ వచనం నేరుగా దావీదు కుమారుల్లోని ఒక సంతానం గురించి, అతని రాజ్యం స్థిరపరచబడటం గురించి చెబుతుంది. విస్తృత లేఖన సందర్భంలో ఉన్న మెస్సీయ ప్రాముఖ్యతను నిరాకరించకుండా, దానిని అనువాదంలో ముందుగానే చొప్పించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని వాడాం. ‘పితరులు,’ ‘సంతానం,’ ‘రాజ్యం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
