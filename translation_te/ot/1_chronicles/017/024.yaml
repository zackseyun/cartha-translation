source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: te
  text: అది స్థిరపరచబడుగాక[a]; ‘సేనల యహ్వే, ఇశ్రాయేలు దేవుడు, ఇశ్రాయేలుకు దేవుడై ఉన్నాడు[b]’ అని చెప్పబడునట్లు నీ పేరు శాశ్వతంగా ఘనపరచబడుగాక. నీ సేవకుడైన దావీదు వంశం[c] నీ సన్నిధిలో స్థిరంగా నిలిచియుండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఈ క్రియకు కర్త స్పష్టంగా చెప్పబడలేదు. సందర్భంలో ‘అది’ అనేది దేవుడు ముందుగా పలికిన వాగ్దానం లేదా మాటను సూచించే అవకాశం ఉంది.
    reason: textual_ambiguity
  - marker: b
    text: ‘ఇశ్రాయేలుకు దేవుడు’ అని హీబ్రూలో మరింత అక్షరార్థంగా ఉంది; ‘ఇశ్రాయేలు దేవుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ దావీదు రాజవంశం అనే భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: అది స్థిరపడుగాక
  rationale: అמן ధాతువు నిఫాల్ రూపంలో స్థిరపరచబడడం లేదా దృఢీకరించబడడం అనే భావం ఇస్తుంది; ప్రార్థనా సందర్భంలో ఆకాంక్షార్థక రూపం సహజం. హీబ్రూలో కర్త స్పష్టంగా లేకపోవడాన్ని ‘అది’ ద్వారా సాధ్యమైనంత వరకు నిలుపుతుంది.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: నీ పేరు ... ఘనపరచబడుగాక
  rationale: దేవుని పేరు గొప్పదిగా ఎంచబడాలని కోరే గౌరవార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘పేరు’ అనే మూలరూపకాన్ని నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: కాలపరంగా అంతం లేని కొనసాగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: అని ప్రజలు చెప్పేలా
  rationale: తదుపరి ప్రశంసావాక్యం పలకబడటాన్ని సూచిస్తుంది. తెలుగులో కర్తను పూర్తిగా వదిలితే అసహజంగా ఉండటంతో సాధారణ కర్తగా ‘ప్రజలు’ను స్పష్టంచేస్తుంది.
- source_word: יְהוָה צְבָאוֹת
  choice: సేనల యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా ఉంచి, צְבָאוֹת యొక్క విస్తృత సైన్య/సేన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: యహ్వేకు ఇశ్రాయేలుతో ఉన్న సంబంధాన్ని తెలిపే హీబ్రూ సమాసాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు దేవుడై ఉన్నాడు
  rationale: לְ ఉపసర్గలోని సంబంధ లేదా ప్రయోజన భావాన్ని స్వామ్యరూపంలో పూర్తిగా కలిపివేయకుండా నిలుపుతుంది.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: నీ సేవకుడైన దావీదు వంశం
  rationale: ఈ రాజవంశ సందర్భంలో בַּיִת అంటే కేవలం నివాసగృహం కాక దావీదు రాజవంశం; ‘వంశం’ సాధారణ తెలుగు పాఠకుడికి ఉద్దేశిత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: నీ సన్నిధిలో స్థిరంగా నిలిచియుండుగాక
  rationale: נָכוֹן యొక్క దృఢంగా నెలకొని ఉండే స్థితిని, לְפָנֶיךָ యొక్క దేవుని సమక్షం అనే సంబంధ భావాన్ని కలిపి వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉన్నందున దాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించబడింది.
- issue: ప్రార్థనలోని క్రియల భావం
  choice: ‘స్థిరపడుగాక’, ‘ఘనపరచబడుగాక’, ‘నిలిచియుండుగాక’ అనే ఆకాంక్షార్థక రూపాలు
  alternative: భవిష్యత్ నిశ్చయార్థక రూపాలు
  rationale: దావీదు దేవుని వాగ్దానానికి ప్రతిస్పందిస్తూ ప్రార్థిస్తున్న సందర్భం వల్ల ఇవి సాధారణ భవిష్యద్వాక్యాలకన్నా ప్రార్థనాత్మక కోరికలుగా అర్థమవుతాయి.
- issue: אֱלֹהִים לְיִשְׂרָאֵל లో לְ సంబంధం
  choice: ఇశ్రాయేలుకు దేవుడై ఉన్నాడు
  alternative: ఇశ్రాయేలు దేవుడై ఉన్నాడు
  rationale: ‘ఇశ్రాయేలుకు’ అనే రూపం హీబ్రూ ఉపసర్గలోని సంబంధ/ప్రయోజన ఛాయను నిలుపుతుంది; అయితే స్వామ్యసంబంధ అనువాదం కూడా సాధ్యమే.
- issue: దావీదు ‘ఇల్లు’ యొక్క భావం
  choice: దావీదు వంశం
  alternative: దావీదు ఇల్లు
  rationale: రాజ్య వాగ్దాన సందర్భంలో ఇది దావీదు కుటుంబాన్ని, ముఖ్యంగా అతని రాజవంశాన్ని సూచిస్తుంది; భౌతిక గృహంగా తప్పుగా అర్థం కాకుండా భావాన్ని స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడింది. మూలంలోని ఆకాంక్షార్థక ధోరణిని ‘-గాక’ రూపాలతో నిలిపి, అధిక ప్రాచీన పదజాలాన్ని నివారించింది. ‘సన్నిధి’ వంటి విస్తృతంగా అర్థమయ్యే ఆధ్యాత్మిక పదాన్ని మాత్రమే ఉపయోగించింది.
