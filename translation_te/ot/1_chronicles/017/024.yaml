- from: అది స్థిరపడుగాక[a]. ‘సేనల యహ్వే, ఇశ్రాయేలు దేవుడు, ఇశ్రాయేలుకు దేవుడై ఉన్నాడు[b]’ అని ప్రజలు చెప్పేలా నీ పేరు శాశ్వతంగా ఘనపరచబడుగాక. నీ సేవకుడైన దావీదు వంశం[c] నీ సన్నిధిలో స్థిరంగా నిలిచియుండుగాక.
