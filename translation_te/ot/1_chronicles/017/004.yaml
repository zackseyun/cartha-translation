id: 1CH.17.4
reference: 1 Chronicles 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: te
  text: 'నీవు వెళ్లి నా సేవకుడైన దావీదుతో ఇలా చెప్పు: ‘యాహ్వే ఇలా అంటున్నాడు: నా నివాసం కోసం ఆ ఇంటిని[a] కట్టేది నీవు కాదు.[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఇల్లు’ అంటే యాహ్వే నివాసస్థలంగా ఉద్దేశించిన దేవాలయం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా నివాసం కోసం ఆ ఇంటిని నీవు కట్టవు”; మరింత పదశఃగా, “నా నివాసం కోసం ఆ ఇంటిని కట్టేది నీవు కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: నీవు వెళ్లి… ఇలా చెప్పు
  rationale: ఆజ్ఞను కొనసాగించే క్రియల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: דָּוִיד עַבְדִּי
  choice: నా సేవకుడైన దావీదు
  rationale: రాజుగా నియమించబడిన దావీదుకు యెహోవాతో ఉన్న సేవాసంబంధాన్ని ‘సేవకుడు’ సముచితంగా తెలియజేస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవసందేశ సూత్రాన్ని సహజంగా నిలుపుతూ, దేవుని వ్యక్తిగత నామాన్ని ప్రత్యక్షంగా అనువదిస్తుంది.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: కట్టేది నీవు కాదు
  rationale: లֹא తర్వాత ప్రత్యేకంగా ఉంచిన אַתָּה వల్ల దావీదుపై పడే వ్యతిరేక ఉద్ఘాటనను నిలుపుతుంది; దీనిని కేవలం నిషేధంగా మాత్రమే మార్చదు.
- source_word: לִּי הַבַּיִת לָשָׁבֶת
  choice: నా నివాసం కోసం ఆ ఇంటిని
  rationale: ‘నాకు,’ ‘ఆ ఇల్లు,’ ‘నివసించడానికి’ అనే భావాలను సహజమైన తెలుగు పదబంధంగా కలిపి, ‘దేవాలయం’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించకుండా మూలంలోని ‘ఇల్లు’ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచింది.
- issue: הַבַּיִת ను ‘ఇల్లు’గా ఉంచాలా, ‘దేవాలయం’గా స్పష్టీకరించాలా
  choice: ఆ ఇల్లు
  alternative: ఆ దేవాలయం
  rationale: సందర్భంలో ఇది దేవాలయాన్ని సూచించినా, మూలంలోని ‘ఇల్లు’ అనే పదాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది; సందర్భార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- issue: לֹא אַתָּה תִּבְנֶה లోని ఉద్ఘాటన
  choice: కట్టేది నీవు కాదు
  alternative: నీవు కట్టకూడదు / నీవు కట్టవు
  rationale: ఈ నిర్మాణం సాధారణ నిషేధం లేదా భవిష్యద్వచనం కంటే, కట్టబోయే వ్యక్తి దావీదు కాదనే వ్యతిరేక ఉద్ఘాటనను సూచించగలదు; ఆ ఉద్రిక్తతను ప్రధాన పాఠ్యంలో నిలిపి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘కట్టేది నీవు కాదు’ అనే రూపం మూలంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది; ‘ఇల్లు’ అనే పదం ఆలయసందర్భంలోని మూలరూపకాన్ని కాపాడుతుంది.
