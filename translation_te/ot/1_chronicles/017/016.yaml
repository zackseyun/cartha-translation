review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders David''s entering, sitting before Yahweh, and the lexical breadth of "house." However, it reverses the Hebrew rhetorical syntax: the source asks who David and his house are such that Yahweh has brought him this far, whereas the draft asks who David is "in order to" be brought this far. The causal/result relationship therefore needs correction.'
  naturalness: Most wording is clear modern standard Telugu. “యాహ్వే సన్నిధిలో” and “యాహ్వే దేవా” suit the reverent register. Recasting the final question removes the unnatural infinitive construction and makes the rhetorical force clear.
  terminology: “యాహ్వే” consistently represents יהוה. “నా ఇల్లు” appropriately preserves the Hebrew metaphor, while the footnote responsibly gives household/family/dynasty alternatives. No theological narrowing is introduced.
  issues:
  - severity: medium
    issue: The phrase “నీవు నన్ను ఇంతవరకు తీసుకురావడానికి నేనెవరిని?” reverses the relation expressed by Hebrew כִּי.
    rationale: Hebrew asks, “Who am I ... that you have brought me this far?” The Telugu infinitive “తీసుకురావడానికి” means “in order to bring,” making David's identity sound like a purpose rather than expressing astonishment at Yahweh's action.
