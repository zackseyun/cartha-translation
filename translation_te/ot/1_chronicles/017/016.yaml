id: 1CH.17.16
reference: 1 Chronicles 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: te
  text: అప్పుడు రాజైన దావీదు లోపలికి వెళ్లి యాహ్వే సన్నిధిలో కూర్చుని, “యాహ్వే దేవా, నీవు నన్ను ఇంతవరకు తీసుకువచ్చేంతగా నేను ఎవరు? నా ఇల్లు[a] ఏమిటి?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా ఇంటివారు,’ ‘నా కుటుంబం,’ లేదా ‘నా వంశం’ అని కూడా అర్థం కావచ్చు. ఇక్కడ ‘ఇల్లు’ అనే హీబ్రూ మాట దావీదు కుటుంబాన్ని, ముఖ్యంగా అతని రాజవంశాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: లోపలికి వెళ్లి
  rationale: בוא అనే క్రియకు ‘రావడం, వెళ్లడం, ప్రవేశించడం’ అనే అర్థాలు ఉన్నాయి. సందర్భంలో దావీదు యాహ్వే సన్నిధికి ప్రవేశించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; స్థలాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַמֶּלֶךְ דָּוִיד
  choice: రాజైన దావీదు
  rationale: హీబ్రూ బిరుదు-పేరు నిర్మాణాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: కూర్చుని
  rationale: ישב కు ‘కూర్చోవడం, నివసించడం, ఉండడం’ అనే అర్థాలు ఉండగలిగినా, ప్రవేశించిన వెంటనే జరిగిన స్పష్టమైన కథన చర్యగా ఇక్కడ ‘కూర్చుని’ సరిపోతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: ‘యాహ్వే ఎదుట/సమక్షంలో’ అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యాహ్వే దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. ‘దేవా’ సంబోధన రూపాన్ని తెలియజేస్తుండగా, యాహ్వే అనేది మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది.
- source_word: מִי אֲנִי
  choice: నేనెవరిని?
  rationale: దావీదు వినయాన్ని, తన అనర్హతను వ్యక్తం చేసే ప్రశ్నను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וּמִי בֵיתִי / בֵיתִי
  choice: నా ఇల్లు ఏమిటి?
  rationale: ‘ఇల్లు’ అనే మూల రూపకాన్ని, దానిలోని కుటుంబం–ఇంటివారు–రాజవంశం అనే విస్తృత భావసాధ్యతను నిలుపుతుంది. తెలుగులో వ్యక్తిని కాని సమూహం/స్థితిని గురించి అడిగేటప్పుడు ‘ఏమిటి’ సహజంగా ఉంటుంది.
- source_word: הֲבִיאֹתַנִי
  choice: నీవు నన్ను … తీసుకురావడానికి
  rationale: בוא యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; దావీదును దేవుడే ఈ స్థితికి చేర్చాడనే భావాన్ని నిలుపుతుంది.
- source_word: עַד הֲלֹם
  choice: ఇంతవరకు
  rationale: స్థితి లేదా ప్రయాణం ఇప్పటి దశవరకు చేరిందనే విస్తృత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన ధ్వన్యనుకరణ రూపంలో వ్యక్తం చేస్తుంది.
- issue: בֵיתִי లోని కుటుంబ/రాజవంశ భావం
  choice: నా ఇల్లు
  alternative: నా కుటుంబం; నా ఇంటివారు; నా వంశం
  rationale: ఈ సందర్భంలో దావీదు కుటుంబంతో పాటు అతని రాజవంశమూ దృష్టిలో ఉంది. ఒకే నిర్దిష్ట అర్థాన్ని ఎంచుకొని మూలంలోని ఉద్దేశపూర్వక విస్తృతిని తగ్గించకుండా ‘ఇల్లు’ అనే రూపకాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయ భావాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని ‘ఇల్లు’ రూపకాన్ని పాదసూచిక సహాయంతో నిలుపుకుంది.
