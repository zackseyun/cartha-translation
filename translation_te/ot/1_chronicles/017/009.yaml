source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: te
  text: నా ప్రజలైన ఇశ్రాయేలుకు నేను ఒక స్థలాన్ని నియమించి, వారిని అక్కడ నాటుతాను. వారు తమ సొంత స్థలంలో నివసిస్తారు; ఇకపై కలవరపడరు. దుష్టులు[a] మునుపటిలా[b] ఇక వారిని వేధించి బలహీనపరచరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘దుష్టత్వపు కుమారులు.’
    reason: హెబ్రీయ నుడికారం యొక్క అక్షరరూపాన్ని తెలియజేయడం.
  - marker: b
    text: లేదా, ‘పూర్వంలా.’
    reason: בָּרִאשׁוֹנָה అనే పదానికి సహజమైన ప్రత్యామ్నాయ అనువాదాన్ని చూపడం.
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: ఒక స్థలాన్ని నియమించి
  rationale: שׂוּם యొక్క ప్రాథమిక భావం ‘ఉంచడం/ఏర్పాటు చేయడం.’ ప్రజల కోసం స్థలాన్ని నిర్ణయించే ఈ సందర్భంలో ‘నియమించి’ దేవుని కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుకు
  rationale: దేవునికి ఇశ్రాయేలుతో ఉన్న నిబంధన సంబంధాన్ని, స్వామ్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּנְטַעְתִּיהוּ
  choice: వారిని అక్కడ నాటుతాను
  rationale: ‘నాటు’ అనే మూల రూపకాన్ని నిలుపుతూ, ఏకవచన ప్రత్యయం సమిష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని తెలుగులో బహువచనంతో స్పష్టం చేస్తుంది. ‘అక్కడ’ అనేది ముందున్న స్థలంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: వారు తమ సొంత స్థలంలో నివసిస్తారు
  rationale: పదశః ‘దాని/అతని కింద నివసిస్తాడు’ అనే రూపం తెలుగులో అస్పష్టంగా ఉంటుంది. సందర్భం వారికి కేటాయించిన స్థలంలో స్థిరంగా నివసించడాన్ని సూచిస్తుంది.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: ఇకపై కలవరపడరు
  rationale: רגז ఇక్కడ శత్రువుల వల్ల అస్థిరతకు లేదా కలవరానికి గురికావడాన్ని సూచిస్తుంది. నిరాకరణతో కూడిన עוֹד భావాన్ని ‘ఇకపై’ తెలియజేస్తుంది.
- source_word: בְנֵי עַוְלָה
  choice: దుష్టులు
  rationale: పదశః ఉన్న ‘దుష్టత్వపు కుమారులు’ అనే హెబ్రీయ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘దుష్టులు’ అని అందించి, అక్షరార్థాన్ని పాదటిప్పణిలో సూచించింది.
- source_word: לְבַלֹּתוֹ
  choice: వేధించి బలహీనపరచరు
  rationale: בלה ఈ రూపంలో నిరంతర హాని ద్వారా క్షీణింపజేయడం లేదా నలిగిపోయేలా చేయడం అనే భావం కలిగిస్తుంది. ఈ జతపద ప్రయోగం ఆ తీవ్రతను సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: మునుపటిలా
  rationale: ఇశ్రాయేలు గతంలో అనుభవించిన అణచివేత కాలాన్ని సహజంగా సూచిస్తుంది; ‘ఆదిలో’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే సమిష్టి ఏకవచనం
  choice: తెలుగులో ‘వారిని/వారు’ అనే బహువచన రూపాలు
  alternative: ‘దానిని/అది’ లేదా ‘అతనిని/అతడు’ అనే కఠిన ఏకవచన రూపాలు
  rationale: హెబ్రీలో ఇశ్రాయేలు ఒక సమిష్టి ప్రజగా ఏకవచనంలో సూచించబడింది. తెలుగులో బహువచనం వాడటం ఆ సమిష్టి వాగ్దానాన్ని మార్చకుండా సూచితార్థాన్ని స్పష్టం చేస్తుంది.
- issue: תַּחְתָּיו అనే నుడికారం
  choice: ‘తమ సొంత స్థలంలో’ అని స్థిర నివాసం, భద్రత భావంతో అనువదించడం
  alternative: పదశః ‘దాని కింద’ లేదా ‘అతని కింద’
  rationale: పదశః అనువాదం తెలుగులో సూచన ఎవరికో దేనికో అస్పష్టంగా చేసి తప్పుదారి పట్టించవచ్చు. సందర్భం దేవుడు ఇచ్చిన స్థలంలో ఇశ్రాయేలు స్థిరంగా నివసించడాన్ని చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నాటుతాను’ అనే మూల రూపకం నిలుపబడింది; అస్పష్టమైన సమిష్టి ఏకవచనాలు పాఠకులకు స్పష్టంగా ఉండేలా బహువచనంలో ఇవ్వబడ్డాయి.
