id: 1CH.17.17
reference: 1 Chronicles 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: te
  text: దేవా, ఇది నీ దృష్టికి చిన్న విషయమే అయింది; అయినా, నీ సేవకుని ఇంటి సుదూర భవిష్యత్తు గురించి నీవు మాట్లాడావు; ఉన్నత స్థితిలోనున్న మనిషి హోదా ప్రకారం నన్ను పరిగణించావు, యెహోవా దేవా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుష్యుల భవిష్యత్ తరాలను నాకు చూపించావు,” లేదా, “ఉన్నత హోదాగల మనిషిగా నన్ను పరిగణించావు.” చివరి ఉపవాక్యంలోని హీబ్రూ క్లిష్టంగా ఉంది; దానికి అనేక అర్థాలు సాధ్యమవుతాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: ఇది నీ దృష్టికి చిన్న విషయమే అయింది
  rationale: హీబ్రూ మూలంలోని ‘నీ కళ్లలో చిన్నదైంది’ అనే మూల్యాంకన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ప్రార్థనలో ప్రత్యక్ష సంబోధన కాబట్టి తెలుగు సంబోధన రూపాన్ని వాడింది.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: నీ సేవకుని ఇంటిని గూర్చి నీవు మాట్లాడావు
  rationale: దీనికి వాగ్దాన భావం సందర్భంలో ఉన్నప్పటికీ, דבר על అనే పదబంధంలోని ప్రాథమిక ‘గురించి మాట్లాడు’ భావాన్ని నిలుపుతుంది.
- source_word: לְמֵרָחוֹק
  choice: రాబోయే సుదీర్ఘ కాలం గురించి
  rationale: ఈ సందర్భంలో దూరాన్ని కాలపరంగా గ్రహించి, దావీదు ఇంటి సుదూర భవిష్యత్తును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּרְאִיתַנִי
  choice: నన్ను పరిగణించావు
  rationale: ראה ఇక్కడ కేవలం చూడడమే కాక, ఒక నిర్దిష్ట రీతిలో భావించడం లేదా చూడడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: כְּתוֹר
  choice: హోదా ప్రకారం
  rationale: క్రమం, ఏర్పాటు, స్థానం అనే క్లిష్టమైన భావవ్యాప్తిలో హోదా-సంబంధిత అర్థాన్ని సూచిస్తూ అతిగా నిర్ధారించకుండా ఉంటుంది.
- source_word: הָאָדָם הַמַּעֲלָה
  choice: ఉన్నత స్థానంలోని మనిషి
  rationale: אָדָם యొక్క ఏకవచన మానవ సూచనను, הַמַּעֲלָה లోని ఉన్నత స్థానం లేదా ఘనత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవా
  rationale: దైవ నామాన్ని యెహోవా అని లిప్యంతరీకరించి, సంయుక్త సంబోధనను తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה అనే క్లిష్టమైన చివరి ఉపవాక్యానికి అర్థం
  choice: ఉన్నత స్థానంలోని మనిషి హోదా ప్రకారం నన్ను పరిగణించావు
  alternative: మనుషుల రాబోయే తరాలను నాకు చూపించావు; లేదా ఉన్నత హోదాగల మనిషిగా నన్ను పరిగణించావు
  rationale: మసొరేటిక్ పాఠం స్థిరంగా ఉన్నా దాని భావం అస్పష్టంగా ఉంది. ప్రధాన అనువాదం పదరూపాలకు సన్నిహితంగా ఉండి దావీదును దేవుడు అసాధారణంగా ఉన్నతంగా పరిగణించిన భావాన్ని నిలుపుతుంది; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని క్లిష్టతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలిపి, నిజమైన భావసందిగ్ధతను పాదసూచికలో స్పష్టంగా తెలిపింది.
