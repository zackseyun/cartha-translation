id: 1CH.17.20
reference: 1 Chronicles 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: te
  text: యెహోవా, నీ వంటి వారు ఎవరూ లేరు; నీవు తప్ప మరొక దేవుడు లేడు[a]; మేము మా చెవులతో విన్నదంతటిలో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు కాకుండా ఏ దేవుడూ లేడు”; “నీకు తప్ప దేవుడు లేడు.”
    reason: ‘నీవు తప్ప’ అని అనువదించిన זוּלָתֶךָ పదబంధానికి సాధ్యమైన సమానార్థక రూపాలను చూపిస్తుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన య్హ్వ్హ్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన నామరూపంగా ప్రతిబింబిస్తుంది.
- source_word: אֵין כָּמוֹךָ
  choice: నీతో సమానమైనవాడు ఎవడూ లేడు
  rationale: אֵין అనే అస్తిత్వనిరాకరణను, כָמוֹךָ లోని పోలిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: నీవు తప్ప వేరే దేవుడు లేడు
  rationale: זוּלָתֶךָ లోని ‘నీవు తప్ప/నీవు కాకుండా’ అనే మినహాయింపు భావాన్నీ, వాక్యంలోని దేవుని ఏకైకత్వ ప్రకటననూ నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ
  choice: మేము ... విన్నదంతటిలో
  rationale: בְּ యొక్క పరిధి లేదా ఆధార భావాన్ని అతిగా నిర్దిష్టం చేయకుండా, వినబడిన సమస్త సాక్ష్య పరిధిలో ఈ ఒప్పుకోలు నిజమని తెలుపుతుంది.
- source_word: בְּאָזְנֵינוּ
  choice: మా చెవులతో
  rationale: హీబ్రూలోని శరీరాంగ సూచనను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది; ‘సొంత’ అనే పదాన్ని మూలంలో లేనందున చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా ఉంచాం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
- issue: וְאֵין אֱלֹהִים זוּלָתֶךָ లోని ప్రత్యేకత్వ ప్రకటన
  choice: నీవు తప్ప వేరే దేవుడు లేడు
  alternative: నీవు కాకుండా ఏ దేవుడూ లేడు / నీకు వెలుపల దేవుడు లేడు
  rationale: ఇది దేవుళ్ల మధ్య కేవలం తులనాత్మక శ్రేష్ఠతను కాకుండా, వేరొక దేవుని అస్తిత్వాన్ని నిరాకరించే బలమైన ప్రకటనగా సహజంగా చదవబడుతుంది.
translation_notes:
  register: ప్రార్థనాత్మక గంభీరతను నిలుపుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం వాడబడింది. సంబోధనలో ‘ఓ’ను బలవంతంగా చేర్చలేదు; తెలుగు ప్రత్యక్ష సంబోధనలో ‘యెహోవా’ ఒక్కటే సహజంగా పనిచేస్తుంది. పాదసూచిక గుర్తు సంబంధిత ‘దేవుడు లేడు’ ప్రకటన వెంట ఉంచబడింది.
