id: 1CH.17.13
reference: 1 Chronicles 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲנִי֙ אֶֽהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִֽהְיֶה לִּ֣/י לְ/בֵ֑ן וְ/חַסְדִּ/י֙ לֹא אָסִ֣יר מֵֽ/עִמּ֔/וֹ כַּ/אֲשֶׁ֣ר הֲסִיר֔וֹתִי מֵ/אֲשֶׁ֥ר הָיָ֖ה לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: te
  text: నేను అతనికి తండ్రిగా ఉంటాను[a]; అతడు నాకు కుమారుడిగా ఉంటాడు. నీకు ముందు ఉన్నవాని నుండి నా స్థిరమైన ప్రేమను తొలగించినట్లుగా, అతని నుండి దానిని తొలగించను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అతని తండ్రిగా ఉంటాను; అతడు నా కుమారుడిగా ఉంటాడు.”
    reason: lexical_alternative
  - marker: b
    text: “నీకు ముందు ఉన్నవాడు” అనేది దావీదుకు ముందు రాజుగా ఉన్న సౌలును సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: నేను అతనికి తండ్రిగా ఉంటాను
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని సంబంధార్థాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: అతడు నాకు కుమారుడిగా ఉంటాడు
  rationale: మొదటి వాక్యభాగానికి సమాంతరతను, నిబంధనాత్మక తండ్రి–కుమార సంబంధ భాషను కాపాడుతుంది.
- source_word: חַסְדִּי
  choice: నా స్థిరమైన ప్రేమ
  rationale: חֶסֶד‌లోని నిలకడైన ప్రేమ, విశ్వసనీయ నిబంధనానురక్తి అనే రెండు పార్శ్వాలనూ అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: అతని నుండి దానిని తొలగించను
  rationale: సוּר హిఫీల్ రూపంలోని ‘తొలగించు’ అర్థాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘దానిని’ అనేది ముందు పేర్కొన్న స్థిరమైన ప్రేమను సూచిస్తుంది.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: తొలగించినట్లుగా
  rationale: ముందటి క్రియతో ఉన్న ఉద్దేశపూర్వక పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: నీకు ముందు ఉన్నవాని నుండి
  rationale: మూలపాఠం సౌలును నేరుగా పేరుపెట్టకుండా ఉంచిన విధానాన్ని కాపాడుతుంది; ‘ముందు’ అనేది రాజ్యాధికారంలో పూర్వత్వాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దావీదు నిబంధనలో తండ్రి–కుమార భాష
  choice: ‘తండ్రిగా’ / ‘కుమారుడిగా’ అనే ప్రత్యక్ష సంబంధ భాషను నిలుపడం
  alternative: తండ్రిలా చూసుకుంటాను / కుమారునిలా నాకు చెందినవాడవుతాడు
  rationale: మూలంలోని రాజసంబంధ నిబంధనాత్మక పుత్రత్వాన్ని వివరణాత్మక రూపకంగా పలుచన చేయకుండా కాపాడుతుంది.
- issue: నిబంధన సందర్భంలో חֶסֶד అనువాదం
  choice: స్థిరమైన ప్రేమ
  alternative: నిబంధన విశ్వసనీయత; కరుణ; కృప
  rationale: ప్రేమానురాగం మరియు నిలకడైన నిబంధన విశ్వసనీయత మధ్యనున్న అర్థవిస్తృతిని ఒకే అంశానికి కుదించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర నిర్మాణం, సంబంధ భాష, సౌలును పేరుపెట్టకుండా సూచించే అస్పష్టత ప్రధాన పాఠ్యంలో నిలుపబడ్డాయి.
