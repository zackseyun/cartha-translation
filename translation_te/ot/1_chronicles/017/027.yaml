source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: te
  text: ఇప్పుడు నీవు నీ సేవకుని ఇంటిని[a] ఆశీర్వదించడానికి దయతో అంగీకరించావు[b], అది నీ సన్నిధిలో శాశ్వతంగా ఉండునట్లు. ఎందుకంటే యాహ్వే, నీవే దానిని ఆశీర్వదించావు; అది ఎప్పటికీ ఆశీర్వదించబడినదే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఇల్లు’ అనేది భవనాన్ని మాత్రమే కాకుండా సేవకుని కుటుంబాన్ని, ముఖ్యంగా అతని వంశాన్ని లేదా రాజవంశాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ఆశీర్వదించడానికి పూనుకున్నావు,’ ‘ఆశీర్వదించడానికి సమ్మతించావు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అది ఎప్పటికీ ఆశీర్వదించబడుగాక.’ హెబ్రీని కొందరు కోరికగా అర్థం చేసుకుంటారు; అయితే దాని రూపం ఫలితంగా కొనసాగుతున్న ఆశీర్వదిత స్థితిని తెలిపే ప్రకటనగా తీసుకోవడం మరింత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సందర్భంలోని ప్రార్థనా ప్రవాహంలో కొత్త నిర్ధారణకు మార్పును సహజంగా సూచిస్తుంది; తెలుగులో అదనపు సంధికారకం అవసరం లేదు.
- source_word: הוֹאַלְתָּ
  choice: దయతో అంగీకరించావు
  rationale: ఈ రూపం ఇష్టపూర్వకంగా ఒప్పుకోవడం లేదా అనుగ్రహపూర్వకంగా సమ్మతించడం అనే భావాన్ని ఇస్తుంది. ప్రార్థనా సందర్భంలో దైవానుగ్రహాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: לְבָרֵךְ
  choice: ఆశీర్వదించడానికి
  rationale: ముందున్న క్రియకు ఉద్దేశ్యపూరకమైన క్రియారూపంగా నేరుగా అనువదించబడింది.
- source_word: בֵּית עַבְדְּךָ
  choice: నీ సేవకుని ఇంటిని
  rationale: బַּיִת పదంలోని కుటుంబం, వంశం, రాజవంశం అనే విస్తృతిని కాపాడేందుకు ‘ఇల్లు’ వాడబడింది; ఇక్కడ కేవలం భవనం ఉద్దేశం కాదు.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: అది నీ సన్నిధిలో శాశ్వతంగా నిలిచి ఉండాలి
  rationale: దేవుని ఎదుట నిరంతరం ఉండటం అనే మూలభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘నిలిచి’ అనేది కొనసాగింపును స్పష్టం చేస్తుంది గాని దైవానుగ్రహం వంటి అదనపు భావాన్ని పాఠ్యంలో చేర్చదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు ఆధారాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
- source_word: בֵּרַכְתָּ
  choice: ఆశీర్వదించావు
  rationale: పూర్తయిన దైవకార్యాన్ని, ప్రస్తుతం కొనసాగుతున్న ఫలితానికి ఆధారంగా చూపే భూతకాల రూపం.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: అది శాశ్వతంగా ఆశీర్వదించబడి ఉంటుంది
  rationale: నిష్క్రియాత్మక కృదంతాన్ని ఫలితస్థితిని తెలిపే ప్రకటనగా అందిస్తుంది; హెబ్రీలో స్పష్టంగా లేని కోరిక లేదా ఆజ్ఞార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని వాడుతూ, మూలంలోని నామాన్ని నిలిపింది.
- issue: చివరి భాగం וּמְבֹרָךְ לְעוֹלָם భావం
  choice: ఫలితస్థితిని తెలిపే ప్రకటన—‘అది శాశ్వతంగా ఆశీర్వదించబడి ఉంటుంది’
  alternative: కోరిక—‘అది శాశ్వతంగా ఆశీర్వదించబడుగాక’
  rationale: మూలంలో ఆజ్ఞార్థక లేదా స్పష్టమైన కోరికార్థక రూపం కాకుండా నిష్క్రియాత్మక కృదంతం ఉంది. అందువల్ల దేవుడు ఆశీర్వదించిన ఫలితంగా ఆ ఇల్లు ఆశీర్వదిత స్థితిలో ఉంటుందని ప్రధాన పాఠ్యం చెబుతుంది; సాధ్యమైన కోరికార్థాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభావంతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘నీ సన్నిధిలో’ అనే గంభీరమైన కానీ సుపరిచితమైన ప్రయోగం మూలంలోని לְפָנֶיךָ ను కాపాడుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
