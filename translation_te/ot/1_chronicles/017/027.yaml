revisions:
- from: ఇప్పుడు నీవు నీ సేవకుని ఇంటిని[a] ఆశీర్వదించడానికి దయతో అంగీకరించావు[b]; అది నీ సన్నిధిలో శాశ్వతంగా నిలిచి ఉండాలి. ఎందుకంటే యెహోవా, నీవే దానిని ఆశీర్వదించావు; అది శాశ్వతంగా ఆశీర్వదించబడి ఉంటుంది[c].
  to: ఇప్పుడు నీవు నీ సేవకుని ఇంటిని[a] ఆశీర్వదించడానికి దయతో అంగీకరించావు[b], అది నీ సన్నిధిలో శాశ్వతంగా ఉండునట్లు. ఎందుకంటే యాహ్వే, నీవే దానిని ఆశీర్వదించావు; అది ఎప్పటికీ ఆశీర్వదించబడినదే[c].
  rationale: The revision aligns the divine name with the POB’s Yahweh policy, makes the dependent infinitive clause clearer in modern standard Telugu, and renders the final participle as an enduring declarative state rather than a future prediction. Footnote anchors and all supplied alternative readings are retained.
