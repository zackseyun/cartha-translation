  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הֶ/חָז֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/015.yaml
  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: te
  text: ఈ మాటలన్నిటికీ అనుగుణంగా[a], ఈ దర్శనమంతటికీ అనుగుణంగా[b], నాతాను దావీదుతో మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ మాటలు’కు బదులుగా ‘ఈ విషయాలు’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం דְּבָרִים సందర్భానుసారం మాటలను, విషయాలను లేదా సంగతులను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఈ దర్శనం’కు బదులుగా ‘ఈ ప్రత్యక్ష ప్రకటన’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం חָזוֹן ప్రవచనాత్మక దర్శనాన్ని లేదా దేవుడు బయలుపరచిన ప్రకటనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: అన్నిటి ప్రకారం
  rationale: כְּ + כֹל తెలియజేసే అనుగుణతను సహజమైన తెలుగులో నిలుపుతుంది; రెండు సమాంతర పదబంధాల్లోనూ ఇదే నిర్మాణం ఉంచబడింది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటి
  rationale: דְּבָרִיםకు ‘మాటలు,’ ‘విషయాలు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ నాతాను అందుకున్న దైవసందేశాన్ని తెలియజేస్తున్నందున ‘మాటలు’ సందర్భానికి తగినది.
- source_word: וּכְכֹל
  choice: ఈ దర్శనమంతటి ప్రకారం
  rationale: మొదటి పదబంధంలోని అనుగుణత భావాన్ని, హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הֶחָזוֹן הַזֶּה
  choice: ఈ దర్శనమంతటి
  rationale: חָזוֹן ప్రవచనాత్మక దర్శనాన్ని లేదా దైవిక ప్రత్యక్ష ప్రకటనను సూచిస్తుంది; ‘దర్శనం’ నేరమైన, సుపరిచితమైన అనువాదం.
- source_word: כֵּן
  choice: అలాగే
  rationale: నాతాను తనకు అందిన మాటలు, దర్శనానికి సరిగ్గా అనుగుణంగా మాట్లాడాడనే correspondence భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִּבֶּר
  choice: మాట్లాడాడు
  rationale: דבר అనే సాధారణ ‘మాట్లాడు’ క్రియను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: נָתָן
  choice: నాతాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶל דָּוִיד
  choice: దావీదుతో
  rationale: మాట్లాడటాన్ని సూచించే సందర్భంలో אֶל యొక్క లక్ష్యసంబంధాన్ని సహజమైన తెలుగులో ‘దావీదుతో’ వ్యక్తం చేస్తుంది.
