translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. మూలంలోని రెండు ‘ప్రకారం’ పదబంధాల సమాంతరతను ఉద్దేశపూర్వకంగా నిలిపి, పదార్థంలోని నిజమైన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
