source:
  edition: WLC
  text: כִּ֣י אַתָּ֣ה אֱלֹהַ֗/י גָּלִ֨יתָ֙ אֶת אֹ֣זֶן עַבְדְּ/ךָ֔ לִ/בְנ֥וֹת ל֖/וֹ בָּ֑יִת עַל כֵּן֙ מָצָ֣א עַבְדְּ/ךָ֔ לְ/הִתְפַּלֵּ֖ל לְ/פָנֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: te
  text: ఎందుకంటే నా దేవా, నీవు నీ సేవకునికి అతని కోసం ఒక ఇల్లు కడతానని వెల్లడించావు[a]. అందుచేత నీ సేవకుడు నీ సన్నిధిలో ప్రార్థించడానికి ధైర్యం పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “నీ సేవకుని చెవిని వెలికితీశావు”; ఇది అతనికి వెల్లడించావు అనే నుడికారం. ఇక్కడ “ఇల్లు” అంటే అతని కోసం స్థిరమైన రాజవంశాన్ని నెలకొల్పడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: నీ సేవకునికి ... వెల్లడించావు
  rationale: అక్షరార్థంగా ‘నీ సేవకుని చెవిని తెరిచావు’ అనే హీబ్రూ నుడికారానికి వెల్లడించడం లేదా తెలియజేయడం అనే భావం ఉంది. ఆధునిక తెలుగులో అర్థం సహజంగా ఉండేలా భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూల రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: అతని కోసం ఒక ఇల్లు కడతానని
  rationale: ప్రకటనలోని విషయాన్ని తెలిపే క్రియారూపాన్ని తెలుగులో ప్రత్యక్ష వాక్య భావంతో సహజంగా అందించాం. ‘ఇల్లు కట్టు’ అనే మూల ప్రతీకను నిలిపి, రాజవంశం అనే అంతర్లీన భావాన్ని పాదసూచికలో సూచించాం.
- source_word: בָּיִת
  choice: ఇల్లు
  rationale: హీబ్రూ పదంలోని గృహం మరియు నిలిచే రాజవంశం అనే పొరలుగల భావాన్ని ముందుగానే ఒకే అర్థానికి పరిమితం చేయకుండా ‘ఇల్లు’ అని నిలిపాం.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: ప్రార్థించడానికి ధైర్యం పొందాడు
  rationale: అక్షరార్థమైన ‘ప్రార్థించడానికి కనుగొన్నాడు’ తెలుగులో అస్పష్టంగా ఉంటుంది. సందర్భంలో ప్రార్థించేందుకు ధైర్యం లేదా మనోనిశ్చయం కలిగిందనే నుడికార భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో ప్రార్థించే భక్తిపూర్వక సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవుని ఎదుట ప్రార్థనలో వినయపూర్వకంగా తనను తాను పేర్కొనే రాజసంబంధ సందర్భానికి ‘సేవకుడు’ తగినది; ‘దాసుడు’ కంటే ఇది ఆధునిక పాఠకులకు సహజంగా ఉంది.
theological_decisions:
- issue: దావీదుకు చేసిన వాగ్దానంలో ‘ఇల్లు’ అనే పదం భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఇల్లు’ అనే మూల ప్రతీకను నిలిపి, రాజవంశ భావాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘రాజవంశం’ అని స్పష్టంగా అనువదించడం
  rationale: ఈ సందర్భంలో హీబ్రూ పదం గృహం, కుటుంబం, నిలిచే రాజవంశం అనే భావాలను మోస్తుంది. ‘ఇల్లు’ అని ఉంచడం ద్వారా ఉద్దేశపూర్వకమైన భావపొరలను అతిగా పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ నుడికారాన్ని భావానువాదం చేస్తూనే ‘ఇల్లు’ అనే ఒడంబడిక సంబంధిత ప్రతీకలోని సందిగ్ధతను నిలిపాం.
