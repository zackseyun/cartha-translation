source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: te
  text: అయితే నేను అతణ్ణి నా గృహంలోనూ నా రాజ్యంలోనూ శాశ్వతంగా స్థిరపరుస్తాను.[a][b][c] అతని సింహాసనం శాశ్వతంగా స్థిరంగా నిలిచి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా గృహం’ దేవునికి చెందిన గృహం లేదా గృహసముదాయం అనే విస్తృత భావాన్ని సూచించవచ్చు; కొందరు దీనిని ప్రత్యేకంగా దేవాలయంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: ‘అతణ్ణి’ అనే మాట తక్షణ సందర్భంలో దావీదు రాజవంశ వారసుణ్ణి, ముఖ్యంగా సొలొమోనును సూచించవచ్చు. ఇది తరువాత మెస్సీయ సంబంధంగా అర్థం చేసుకున్న విస్తృత దావీదు వాగ్దానానికీ సంబంధించినదిగా చూడబడింది.
    reason: alternative_reading
  - marker: c
    text: ‘నా గృహంలోనూ నా రాజ్యంలోనూ’ అనే మాటను ‘నా గృహం మీదా నా రాజ్యం మీదా’ అని అధికార భావంతో కూడా అనువదించవచ్చు. హీబ్రూ ఉపసర్గ రెండు భావాలకు అవకాశం ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: అయితే నేను అతణ్ణి … స్థిరపరుస్తాను
  rationale: עמד హిఫీల్ రూపం ఒక వ్యక్తిని తన స్థానంలో దృఢంగా నిలిపి ఉంచడం లేదా స్థిరపరచడం అనే భావాన్ని ఇస్తుంది. ముందున్న వాక్యంతో వ్యత్యాసాన్ని సూచించేందుకు וְ ను ఇక్కడ ‘అయితే’గా అనువదించాం.
- source_word: בְּבֵיתִי
  choice: నా మందిరంలో
  rationale: בֵּיתִי అక్షరార్థంగా ‘నా ఇల్లు’; ఈ సందర్భంలో అది దేవుని మందిరం, ఆయన గృహం లేదా ఆయన పరిపాలనా పరిధి అనే విస్తృత భావాలను కలిగి ఉండవచ్చు. తెలుగులో దేవుని ‘ఇల్లు’ అనే భావానికి సహజమైన గౌరవప్రద పదంగా ‘మందిరం’ ఎంచుకున్నాం; భావపరిధిని పాదసూచికలో తెలిపాం.
- source_word: וּבְמַלְכוּתִי
  choice: నా రాజ్యంలోనూ
  rationale: בְּ ఉపసర్గను సహజంగా ‘లో’ అని అనువదిస్తూ, ‘నా మందిరంలో’ అనే సమాంతర నిర్మాణాన్ని నిలిపాం. מַלְכוּת అంటే ‘రాజ్యం’.
- source_word: עַד הָעוֹלָם
  choice: శాశ్వతంగా
  rationale: עַד + עוֹלָם దీర్ఘకాలిక, అంతంలేని స్థిరత్వాన్ని సూచించే సాధారణ హీబ్రూ ప్రయోగం. ‘శాశ్వతంగా’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְכִסְאוֹ
  choice: అతని సింహాసనం
  rationale: כִּסֵּא రాజాధికారాన్ని సూచించే కీలకమైన ‘సింహాసనం’ అనే పదం; దాన్ని ‘పాలన’ అని భావానువాదం చేయకుండా మూల రూపకాన్ని నిలిపాం.
- source_word: יִהְיֶה נָכוֹן
  choice: స్థిరంగా ఉంటుంది
  rationale: נָכוֹן ఇక్కడ దృఢమైనది, భద్రమైనది, స్థిరంగా నిలిచినది అనే భావం ఇస్తుంది. ‘స్థిరంగా ఉంటుంది’ సహజమైన తెలుగుతో ఆ స్థిరత్వాన్ని తెలియజేస్తూ, మొదటి క్రియతో అనవసర పదపునరుక్తిని తగ్గిస్తుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: మొదటి ప్రయోగంలాగే ఇది నిరంతర స్థిరత్వాన్ని సూచిస్తుంది; ఒకే తెలుగు పదాన్ని వాడటం మూలంలోని పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: దావీదు నిబంధన సందర్భంలో ‘అతణ్ణి’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘అతణ్ణి’ అనే సర్వనామాన్నే ఉంచాం.
  alternative: ప్రత్యేకంగా సొలొమోను; సమష్టిగా దావీదు రాజవంశం; అంతిమంగా మెస్సీయ
  rationale: హీబ్రూ వాక్యం పుంలింగ ఏకవచన సర్వనామాన్ని మాత్రమే వాడుతుంది. సందర్భంలో తక్షణ రాజవంశ సంబంధ భావమూ, తరువాతి మెస్సీయ నిరీక్షణకు దోహదపడే విస్తృత భావమూ ఉన్నాయి; అనువాదం వాటిలో ఒక్కదానిని మాత్రమే నిర్ణయించదు.
- issue: ‘నా ఇల్లు’ అనే మాట పరిధి
  choice: ప్రధాన పాఠంలో ‘నా మందిరం’ అని ఇచ్చి, దాని విస్తృత భావపరిధిని పాదసూచికలో నిలిపాం.
  alternative: నా గృహం లేదా గృహసముదాయం; నా నిబంధనా పరిధి; ప్రత్యేకంగా దేవాలయం
  rationale: בַּיִת ఈ సందర్భంలో దేవుని మందిరాన్ని, గృహాన్ని లేదా ఆయనకు చెందిన విస్తృత పరిధిని సూచించగలదు. తెలుగు ప్రధాన పాఠానికి సహజమైన ‘మందిరం’ వాడినా, దానిని కేవలం నిర్మాణమైన దేవాలయానికే పరిమితం చేయకూడదని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: בְּ ఉపసర్గ స్థానం లేదా అధికారాన్ని సూచిస్తుందా?
  choice: '‘లో’ అనే ప్రత్యక్ష స్థానార్థాన్ని నిలిపాం: ‘మందిరంలోనూ … రాజ్యంలోనూ’.'
  alternative: ‘నా మందిరం మీదా నా రాజ్యం మీదా’ అని అధికార భావంతో అనువదించడం
  rationale: హీబ్రూలోని సమాంతర בְּ పదబంధాలు స్థానం, పరిధి లేదా అధికార సంబంధాన్ని మోసుకురాగలవు. ప్రధాన పాఠంలో ‘లో’ అని ఇవ్వడం మూలంలోని అనిశ్చితిని ఎక్కువగా కాపాడుతుంది; అధికార భావం సాధ్యమని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రద తెలుగు. ‘స్థిరపరుస్తాను’, ‘సింహాసనం’, ‘శాశ్వతంగా’ వంటి పదాలు రాజనిబంధన సందర్భపు గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రధాన పాఠాన్ని సూటిగా ఉంచి, అసలు హీబ్రూలోని సూచ్యార్థ భేదాలను పాదసూచికల్లో భద్రపరిచాం.
