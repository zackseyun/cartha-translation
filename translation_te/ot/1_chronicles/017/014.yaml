  to: అయితే నేను అతణ్ణి నా గృహంలోనూ నా రాజ్యంలోనూ శాశ్వతంగా స్థిరపరుస్తాను.[a][b][c] అతని సింహాసనం శాశ్వతంగా స్థిరంగా నిలిచి ఉంటుంది.
  rationale: ‘మందిరం’ స్థానంలో ‘గృహం’ను పెట్టడం ద్వారా మూలంలోని בַּיִת పదం కలిగిన విస్తృత, సందర్భానుసార భావాన్ని ప్రధాన పాఠంలోనే కాపాడాం. సర్వనామ సూచన మరియు బְּ ఉపసర్గకు ఉన్న అధికారార్థ ప్రత్యామ్నాయాలను వేర్వేరు పాదసూచికలలో ఉంచి, వాటి సంబంధిత లంగరులను స్పష్టంచేశాం. చివరి ఉపవాక్యాన్ని స్వల్పంగా సవరించి తెలుగులో సహజమైన ప్రవాహాన్ని కల్పించాం; అర్థంలో మార్పు లేదు.
