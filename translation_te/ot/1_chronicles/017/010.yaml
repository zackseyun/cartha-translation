revisions:
- from: నేను నా ప్రజలైన ఇశ్రాయేలుమీద న్యాయాధిపతులను నియమించిన రోజులనుండి, నీ శత్రువులందరినీ అణచివేస్తాను. అంతేకాక, యెహోవా నీకు ఒక ఇల్లు కడతాడని నేను నీకు తెలియజేస్తున్నాను.[a]
  to: నా ప్రజలైన ఇశ్రాయేలుమీద నేను న్యాయాధిపతులను నియమించిన రోజులనుండి జరిగినట్లుగా ఇక ఉండదు. నీ శత్రువులందరినీ నేను అణచివేస్తాను. అంతేకాక, యెహోవా నీకు ఒక ఇల్లు కడతాడని నీకు తెలియజేస్తున్నాను.[a]
  rationale: The revision makes explicit in Telugu that the initial temporal clause completes the preceding verse's comparison (‘as in former days’), while keeping the present verse's promise that God will subdue David's enemies. It retains the future force of וְהִכְנַעְתִּי as reflected in the English POB audit trail and preserves the ‘house’/dynasty ambiguity in the main text.
