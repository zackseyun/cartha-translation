id: 1CH.17.10
reference: 1 Chronicles 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: te
  text: నా ప్రజలైన ఇశ్రాయేలుమీద నేను న్యాయాధిపతులను నియమించిన రోజులనుండి జరిగినట్లుగా ఇక ఉండదు. నీ శత్రువులందరినీ నేను అణచివేస్తాను. అంతేకాక, యెహోవా నీకు ఒక ఇల్లు కడతాడని నీకు తెలియజేస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యెహోవా నీకు ఒక ఇల్లు కడతాడు’ అనే మాటకు, యెహోవా నీకోసం ఒక రాజవంశాన్ని స్థాపిస్తాడు అనే అర్థమూ ఉంది.
    reason: ‘ఇల్లు’ అనే హీబ్రూ పదంలో ఉన్న రాజవంశ సంబంధమైన భావాన్ని వివరిస్తుంది; ప్రధాన పాఠ్యంలోని ఉద్దేశపూర్వక పదప్రయోగాన్ని కాపాడుతుంది.
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: రోజులనుండి
  rationale: ముందటి వాగ్దానంతో అనుసంధానమయ్యే కాలసూచక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: నేను ... న్యాయాధిపతులను నియమించిన
  rationale: צוה ఇక్కడ న్యాయాధిపతులకు ఆజ్ఞ ఇవ్వడం కంటే వారిని ఇశ్రాయేలుమీద అధికారులుగా నియమించడాన్ని సూచిస్తుంది.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుమీద
  rationale: עַל లోని అధికార సంబంధాన్ని ‘మీద’తో, ఒడంబడిక సంబంధమైన ‘నా ప్రజలు’ అనే స్వామ్యభావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וְהִכְנַעְתִּי
  choice: అణచివేస్తాను
  rationale: వాగ్దాన క్రమంలో ఈ రూపానికి భవిష్యత్ బలం ఉంది; శత్రువులను లోబరచే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: నీ శత్రువులందరినీ
  rationale: כָּל తెలిపే సంపూర్ణతను స్పష్టంగా నిలుపుతుంది.
- source_word: וָאַגִּד לָךְ
  choice: అంతేకాక, ... నేను నీకు తెలియజేస్తున్నాను
  rationale: దైవిక ప్రకటనలోని తదుపరి ముఖ్యాంశాన్ని పరిచయం చేస్తూ, ప్రకటనాత్మక వర్తమాన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: యెహోవా నీకు ఒక ఇల్లు కడతాడు
  rationale: దావీదు దేవునికి ఇల్లు కట్టడం, దేవుడు దావీదుకు ‘ఇల్లు’ కట్టడం అనే కీలక పదప్రయోగాన్ని కాపాడుతుంది; ‘ఇల్లు’ను ప్రధాన పాఠ్యంలో ‘రాజవంశం’గా విప్పి చెప్పదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని ‘ఇల్లు’ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఇల్లు’ అనే రూపకాన్నే నిలిపి, రాజవంశ భావాన్ని పాదటిప్పణిలో సూచించడం
  alternative: ‘యెహోవా నీకోసం ఒక రాజవంశాన్ని స్థాపిస్తాడు’ అని స్పష్టీకరించడం
  rationale: בַּיִת అనే పదం ఆలయం/నివాసం మరియు రాజకుటుంబం/వంశం మధ్య ఉద్దేశపూర్వక పదప్రయోగాన్ని కలిగి ఉంది. దానిని ప్రధాన పాఠ్యంలో ఒకే అర్థానికి పరిమితం చేయకుండా సాహిత్య, దైవశాస్త్ర ఉద్వేగాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘న్యాయాధిపతులు,’ ‘అణచివేస్తాను,’ ‘తెలియజేస్తున్నాను’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని అధికారిక దైవిక ప్రకటన స్వరాన్ని నిలుపుతాయి.
