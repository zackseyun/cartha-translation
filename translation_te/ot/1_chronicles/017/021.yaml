source:
  edition: WLC
  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: te
  text: భూమిపై ఒక జనమైన నీ ప్రజ ఇశ్రాయేలులా మరెవరు ఉన్నారు? దేవుడు తనకొరకు ఒక ప్రజను విమోచించుకోవడానికి వెళ్లి, నీకు పేరు కలిగించడానికి గొప్ప, భయాన్ని కలిగించే కార్యాలు చేసి, ఐగుప్తు నుండి నీవు విమోచించిన నీ ప్రజల ఎదుటనుండి జనాంగాలను వెళ్లగొట్టాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్ప, విస్మయభరితమైన కార్యాలు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నీ ప్రజల ఎదుటనుండి జనాంగాలను వెళ్లగొట్టడం”; 2 సమూయేలు 7:23లోని సమాంతర వాక్యం పాఠ్యపరంగా క్లిష్టంగా ఉన్నందున, కొందరు చివరి పదాల అన్వయాన్ని భిన్నంగా అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజ ఇశ్రాయేలులా మరెవరు ఉన్నారు?
  rationale: מִי అనే వ్యక్తివాచక ప్రశ్నార్థకాన్ని నిలుపుతూ, దేవుని ప్రజలతో పోల్చదగినవారు ఎవరూ లేరనే అలంకారిక ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: భూమిమీద ఒకే జనంగా ఉన్న
  rationale: ‘భూమిమీద ఒక జనం’ అనే మూల భావాన్ని కాపాడుతూ, אֶחָד సూచించే ఏకత్వం లేదా విశిష్టతను అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: దేవుడు ... వెళ్లాడు
  rationale: దేవుని నిర్ణయాత్మక కార్యాన్ని తెలిపే הלך అనే కదలిక భాషను తొలగించకుండా నేరుగా నిలుపుతుంది.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: తనకోసం వారిని ఒక ప్రజగా విమోచించడానికి
  rationale: פדה ను ‘విమోచించు’గా అనువదించి, ఇశ్రాయేలును దేవుడు తన ప్రజగా చేసుకోవడానికి విడిపించాడనే ఫలిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: నీకు పేరు కలిగించుకోవడానికి
  rationale: దేవుని విమోచన కార్యాలు ఆయన ఖ్యాతిని స్థాపించాయనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: గొప్పవీ భయంకరమైనవీ అయిన కార్యాలు
  rationale: నామవాచకం లేకుండా ఉన్న విశేషణ రూపాలకు సందర్భానుసారంగా ‘కార్యాలు’ను చేర్చి, נוראות లోని భయం మరియు విస్మయం రెండింటి బలాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ
  choice: నీ ప్రజల ఎదుటనుంచి ... వెళ్లగొట్టడానికి
  rationale: מִפְּנֵי లోని ‘ఎదుటనుంచి/సన్నిధినుంచి’ అనే స్థానిక భావాన్నీ, לגרש లోని బలవంతంగా తొలగించే చర్యనూ నిలుపుతుంది.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: ఐగుప్తులోనుంచి నీవు విమోచించిన
  rationale: దేవునితో ప్రత్యక్షంగా మాట్లాడే ద్వితీయ పురుష సంబోధనను, ఐగుప్తు విమోచన సూచనను యథాతథంగా కాపాడుతుంది.
- source_word: גּוֹיִם
  choice: జనాలను
  rationale: నిర్దిష్ట ఉపపదం లేని బహువచనాన్ని ‘జనాలు’గా అనువదించి, వెళ్లగొట్టబడిన సమూహాలను సూచిస్తుంది.
theological_decisions:
- issue: לָשׂוּם לְךָ שֵׁם లో దేవుడు తనకు పేరు కలిగించుకోవడం
  choice: నీకు పేరు కలిగించుకోవడానికి
  alternative: నీ పేరును గొప్పచేయడానికి
  rationale: విమోచన కార్యాల ద్వారా దేవుని ఖ్యాతి స్థాపించబడుతుందనే వాక్యంలోని స్పష్టమైన భావాన్ని మెత్తబరచకుండా ఉంచుతుంది; ‘గొప్పచేయడం’ అనే అదనపు భావాన్ని చేర్చదు.
- issue: נוראות లోని భయం–విస్మయ భావం
  choice: భయంకరమైనవీ
  alternative: భయభక్తి పుట్టించేవీ
  rationale: దైవకార్యాలు కేవలం ఆశ్చర్యకరమైనవి మాత్రమే కాక భయాన్ని కూడా కలిగించేవని బలంగా ఉంచుతుంది; ప్రత్యామ్నాయంలోని విస్మయ/భయభక్తి ఛాయను పాదటిప్పణిలో అందిస్తుంది.
- issue: చివరి పదబంధంలోని కఠినమైన హీబ్రూ పదక్రమం
  choice: ఐగుప్తులోనుంచి నీవు విమోచించిన నీ ప్రజల ఎదుటనుంచి జనాలను వెళ్లగొట్టడానికి
  alternative: చివరి భాగాన్ని వేరే అన్వయంతో కలపడం
  rationale: మసొరా పాఠంలోని పదాలను, సాధ్యమైన ప్రధాన వాక్యాన్వయాన్ని నిలుపుతూ, సమాంతరమైన 2 సమూయేలు 7:23 లోని పాఠ్య క్లిష్టత ఆధారంగా అస్పష్టతను పూర్తిగా దాచకుండా పాదటిప్పణి ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని అలంకారిక ప్రశ్న, దేవుని కదలికను తెలిపే మానవరూప భాష, ద్వితీయ పురుష సంబోధన, చివరి పదక్రమంలోని ఉద్రిక్తత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
