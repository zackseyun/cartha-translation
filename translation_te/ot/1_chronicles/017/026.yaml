  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: te
  text: ఇప్పుడు, యాహ్వే, నీవే దేవుడవు; నీ సేవకుని గురించి ఈ మంచి విషయాన్ని[a] పలికావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సేవకుని గురించి ఈ మంచి వాగ్దానాన్ని పలికావు.” హీబ్రూలో అక్షరార్థంగా, “నీ సేవకుని గురించి ఈ మంచి విషయాన్ని పలికావు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో తదుపరి వాక్యానికి మార్పును సూచించే సహజమైన తెలుగు రూపం; సందర్భంలో అనుసంధాన భావం నిలుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: నీవే దేవుడవు
  rationale: אַתָּה הוּאలోని ఉద్ఘాటనను తెలుగు ప్రత్యయం ‘ఏ’ సహజంగా వ్యక్తం చేస్తుంది; హీబ్రూ గుర్తింపు ప్రకటనను స్పష్టంగా నిలుపుతుంది.
- source_word: וַתְּדַבֵּר
  choice: పలికావు
  rationale: దేవుడు ముందుగా చెప్పిన మాటను సూచించే సాధారణ క్రియార్థాన్ని కాపాడుతుంది; ప్రధాన పాఠ్యంలో ‘వాగ్దానం చేశావు’ అనే సందర్భానుగత వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: עַל עַבְדְּךָ
  choice: నీ సేవకుని గురించి
  rationale: דברతో వచ్చిన עַל ఇక్కడ మాట యొక్క విషయాన్ని సూచిస్తుంది; עַבְדְּךָ ప్రార్థనలో వినయపూర్వక స్వీయసూచనగా ‘నీ సేవకుడు’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ఈ మేలైన విషయాన్ని
  rationale: హీబ్రూలో విశేషణం నామవాచక భావంలో ‘ఈ మంచి/మేలైనది’ అని ఉంది. తెలుగులో అర్థం సంపూర్ణంగా ఉండేందుకు ‘విషయం’ చేర్చబడింది; ‘వాగ్దానం’ అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- issue: הַטּוֹבָה הַזֹּאת వాగ్దానాన్నే సూచిస్తుందా?
  choice: ఈ మేలైన విషయాన్ని
  alternative: ఈ మంచి వాగ్దానాన్ని
  rationale: సందర్భంలో దేవుని వాగ్దానం ఉద్దేశించబడి ఉండవచ్చు; అయితే హీబ్రూ పదబంధం స్వయంగా ‘వాగ్దానం’ అనే నామవాచకాన్ని ఉపయోగించదు. అందువల్ల ప్రధాన పాఠ్యం విస్తృతమైన మూలార్థాన్ని ఉంచి, సందర్భానుగత ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధన ఉపయోగించబడింది. ‘నీవే’ మూలంలోని ఉద్ఘాటనను సహజంగా మోస్తుంది; ‘మేలైన విషయం’ మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
