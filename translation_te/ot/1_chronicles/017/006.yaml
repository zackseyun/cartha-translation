source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: te
  text: నేను ఇశ్రాయేలీయులందరి మధ్య సంచరించిన ప్రతి చోటా[a], నా ప్రజలను కాపరులవలె చూసుకోవాలని నేను ఆజ్ఞాపించిన ఇశ్రాయేలు న్యాయాధిపతుల్లో ఎవరికైనా, ‘మీరు నా కోసం దేవదారు కలపతో ఒక ఇల్లు ఎందుకు కట్టలేదు?’ అని నేనెప్పుడైనా ఒక్క మాటైనా అన్నానా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సమాంతర వచనమైన 2 సమూయేలు 7:7లో ‘ఇశ్రాయేలు గోత్రాలు’ అని ఉంది; కొన్ని పాఠసాక్ష్యాలు ‘నాయకులు’ లేదా ‘రాజదండాలు’ అనే భావాన్ని ప్రతిబింబిస్తాయి. అయితే ఇక్కడ 1 దినవృత్తాంతముల హెబ్రీ పాఠంలో ‘న్యాయాధిపతులు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: సంచరించిన
  rationale: హిత్పయేల్ రూపం ఒక్కసారి నడవడాన్ని కాకుండా ప్రజల మధ్య దేవుడు తిరుగుతూ ఉన్న భావాన్ని సూచిస్తుంది; ‘సంచరించిన’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి మధ్య
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ దేశాన్ని మాత్రమే కాక ప్రజాసమూహాన్ని సూచిస్తుంది; ‘మధ్య’ దేవుని ప్రజల నడుమ సంచరించిన భావాన్ని నిలుపుతుంది.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: నేనెప్పుడైనా ఒక్క మాటైనా అన్నానా?
  rationale: ప్రశ్నార్థక నిర్మాణం మరియు సమానధాతు కర్మ కలిగించే బలమైన నిరాకరణను ‘ఎప్పుడైనా ఒక్క మాటైనా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు న్యాయాధిపతుల్లో ఎవరికైనా
  rationale: דבר తో את సంబోధించబడిన వ్యక్తిని సూచిస్తుంది; ‘ఎవరికైనా ... అన్నానా’ తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా, సహజంగా ఉంది.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు న్యాయాధిపతులు
  rationale: సమాంతర వచనంతో సమన్వయపరచకుండా దినవృత్తాంతముల మసొరేటిక్ పాఠంలోని ‘న్యాయాధిపతులు’ అనే పదాన్నే అనువదిస్తుంది.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: కాపరులుగా పాలించమని నేను ఆజ్ఞాపించిన
  rationale: רעה లోని కాపరి రూపకాన్ని నిలుపుతూ, ఇక్కడ ప్రజలను నడిపించడం మరియు సంరక్షించడం అనే పాలనా భావాన్ని ‘కాపరులుగా పాలించు’ స్పష్టం చేస్తుంది.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: మూలంలోని నిబంధనాత్మక సంబంధాన్ని సరళంగా, నేరుగా నిలుపుతుంది.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: మీరు నా కోసం ... ఎందుకు కట్టలేదు?
  rationale: హెబ్రీ బహువచన సంబోధనను ‘మీరు’తో నిలుపుతూ, గతంలో అలాంటి ఆజ్ఞ ఇవ్వలేదనే అలంకారప్రశ్నను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּית אֲרָזִים
  choice: దేవదారు కలపతో ఒక మందిరం
  rationale: దేవునికి కట్టే ‘ఇల్లు’ ఇక్కడ ఆరాధనా మందిరమని సందర్భం తెలియజేస్తుంది; ‘దేవదారు కలపతో’ నిర్మాణ పదార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దినవృత్తాంతములలోని ‘న్యాయాధిపతులు’ మరియు 2 సమూయేలు 7:7లోని సమాంతర పాఠభేదం
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు న్యాయాధిపతులు’ అని అనువదించడం
  alternative: 2 సమూయేలు సమాంతర వచనం ప్రకారం ‘ఇశ్రాయేలు గోత్రాలు’ లేదా కొన్ని సాక్ష్యాల ప్రకారం ‘నాయకులు’ అని చదవడం
  rationale: మూలభాషా ప్రాధాన్యం ప్రకారం ఇక్కడ దినవృత్తాంతముల హెబ్రీ పాఠంలోని שֹׁפְטֵי (‘న్యాయాధిపతులు’) అనువదించబడింది; సమాంతర వచనంలోని భిన్న పాఠంతో దానిని మౌనంగా సమన్వయపరచలేదు.
- issue: רעה అనే కాపరి రూపకంలోని పాలనా భావం
  choice: ‘కాపరులుగా పాలించమని’ అని రూపకాన్నీ కార్యభావాన్నీ కలిపి అనువదించడం
  alternative: ‘మేపమని’ లేదా ‘సంరక్షించమని’ మాత్రమే అనువదించడం
  rationale: న్యాయాధిపతుల బాధ్యత ప్రజలను కేవలం పోషించడం మాత్రమే కాదు, నడిపించి పాలించడం కూడా; అయినా మూలంలోని కాపరి రూపకం తొలగిపోకుండా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. దీర్ఘమైన హెబ్రీ వాక్యాన్ని ఒకే అలంకారప్రశ్నగా నిలిపి, ‘కాపరులుగా పాలించు’ అనే ప్రయోగంతో రూపకాన్నీ నాయకత్వ భావాన్నీ కాపాడాం. దేవుని నివాసాన్ని సూచించే בַּיִת కు సందర్భానుగుణంగా ‘మందిరం’ వాడాం.
