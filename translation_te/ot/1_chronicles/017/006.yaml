  terminology: ‘ఇశ్రాయేలు న్యాయాధిపతులు’ సరైన ప్రధాన పాఠ అనువాదం. ‘దేవదారు కలపతో ఒక ఇల్లు’ బֵּית אֲרָזִים యొక్క సాధారణ పదప్రయోగాన్ని నిలుపుతుంది; దీనిని ‘మందిరం’గా వ్యాఖ్యానించదు. పాఠభేదపు పాదసూచిక అవసరమైనదే మరియు దాని గుర్తు సరైన చోట ఉంది.
