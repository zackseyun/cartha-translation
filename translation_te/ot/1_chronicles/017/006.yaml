  to: నేను ఇశ్రాయేలీయులందరి మధ్య సంచరించిన ప్రతి చోటా[a], నా ప్రజలను కాపరులవలె చూసుకోవాలని నేను ఆజ్ఞాపించిన ఇశ్రాయేలు న్యాయాధిపతుల్లో ఎవరికైనా, ‘మీరు నా కోసం దేవదారు కలపతో ఒక ఇల్లు ఎందుకు కట్టలేదు?’ అని నేనెప్పుడైనా ఒక్క మాటైనా అన్నానా?
  rationale: సవరణలు మూలంలోని కాపరి రూపకాన్ని ‘కాపరులవలె చూసుకోవాలని’ ద్వారా కాపాడతాయి; ‘పాలించు’ అనే అదనపు వివరణను తొలగిస్తాయి. అలాగే בֵּיתను ‘ఇల్లు’గా అనువదించి, సందర్భం ఆధారంగా ‘మందిరం’ అని అర్థాన్ని సంకుచితం చేయకుండా ఉంచుతాయి. పాఠభేద పాదసూచికను నిలిపి, గ్రంథనామాన్ని స్పష్టంగా చేశాం.
