source:
  edition: WLC
  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: te
  text: షహరయీము మోయాబు దేశంలో[a] హుషీమును, బయరాను అనే తన భార్యలను పంపివేసిన తరువాత[b] పిల్లలకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోయాబు పొలంలో’ లేదా ‘మోయాబు ప్రాంతంలో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతడు వారిని పంపివేయడం నుండి’; సందర్భంలో ఇది ‘అతడు వారిని పంపివేసిన తరువాత’ అనే భావాన్ని ఇచ్చే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: షహరయీము
  rationale: వంశావళి ప్రవాహాన్ని తెలుగులో వాక్యక్రమమే సహజంగా కొనసాగిస్తుంది; వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: పిల్లలకు తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపానికి ‘కన్నాడు/కనెను’ కంటే ఇది ఆధునిక తెలుగులో సహజంగా ఉండి, తదుపరి వచనంలో వచ్చే పిల్లల పేర్లను ఇక్కడ ముందుగానే చేర్చదు.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: మోయాబు దేశంలో
  rationale: שָׂדֶה అక్షరార్థంగా ‘పొలం’ అయినా, భౌగోళిక ప్రయోగంలో దేశం లేదా ప్రాంతాన్ని సూచించగలదు; ఈ సందర్భంలో ‘దేశం’ సహజమైన ఎంపిక.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: పంపివేసిన తరువాత
  rationale: מִן + క్రియానామ రూపం ఇక్కడ కాలసంబంధ పరిస్థితిని సూచించే అవకాశం ఎక్కువ; సహజ తెలుగులో ‘తరువాత’గా అనువదించాం, అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: חוּשִׁים
  choice: హుషీము
  rationale: ఇక్కడ ఇది వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְ/אֶת בַּעֲרָא
  choice: బయరాను
  rationale: ఇది రెండవ భార్య పేరు; తెలుగు వాక్యంలో కర్మవిభక్తితో సహజంగా అమర్చాం.
- source_word: נָשָׁיו
  choice: తన భార్యలైన
  rationale: ఈ సందర్భంలో אִשָּׁה బహువచనం వివాహిత భార్యలను స్పష్టంగా సూచిస్తుంది; పేర్లతో దాని అన్వయాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
