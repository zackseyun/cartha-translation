source:
  edition: WLC
  text: וְ/נַעֲמָ֧ן וַ/אֲחִיָּ֛ה וְ/גֵרָ֖א ה֣וּא הֶגְלָ֑/ם וְ/הוֹלִ֥יד אֶת עֻזָּ֖א וְ/אֶת אֲחִיחֻֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: te
  text: నయమాను, అహీయా, గేరా—అతడు[a] వారిని చెరలోకి పంపించాడు[b]; ఉజ్జాకు, అహీహూదుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రూలో ‘అతడు’ అనే సర్వనామం ఏకవచనంలో ఉంది. అది అత్యంత సహజంగా గేరాను సూచిస్తుంది; అయితే ఈ భాగంలోని వంశావళి పాఠం, వాక్యనిర్మాణం క్లిష్టంగా ఉన్నాయి.
    reason: alternative_reading
  - marker: b
    text: ‘వారిని ప్రవాసానికి పంపించాడు’ లేదా ‘వారిని బలవంతంగా తరలించాడు’ అని కూడా అనువదించవచ్చు. హెబ్రూ క్రియ కారణార్థక రూపంలో ఉండి, ‘వారు ప్రవాసానికి వెళ్లేలా చేశాడు’ అనే భావాన్నిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲמָן
  choice: నయమాను
  rationale: వ్యక్తి పేరు; హెబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֲחִיָּה
  choice: అహీయా
  rationale: వ్యక్తి పేరు; ఆధునిక తెలుగు బైబిలు పేరు-రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: גֵרָא
  choice: గేరా
  rationale: వ్యక్తి పేరు; అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: הוּא
  choice: అతడే
  rationale: స్వతంత్ర ఏకవచన సర్వనామంలోని పునరుద్ఘాటన భావాన్ని ‘అతడే’ సహజంగా వ్యక్తపరుస్తుంది; అది ఎవరిని సూచిస్తుందనే వాక్యసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: הֶגְלָם
  choice: వారిని చెరలోకి పంపించాడు
  rationale: గלה అనే క్రియ యొక్క హిఫీల్ రూపం ‘చెరకు వెళ్లేలా చేయడం’ అనే కారణార్థాన్ని, 3వ పురుష బహువచన కర్మప్రత్యయం ‘వారిని’ అనే భావాన్ని కలిగి ఉంది.
- source_word: וְהוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫీల్ ילד పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ఈ రూపం ప్రాచీనంగా వినిపించే ‘కనెను’ కంటే ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: עֻזָּא
  choice: ఉజ్జా
  rationale: వ్యక్తి పేరు; హెబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: אֲחִיחֻד
  choice: అహీహూదు
  rationale: వ్యక్తి పేరు; హెబ్రూ హల్లులు, దీర్ఘస్వరాన్ని ప్రతిబింబించేలా తెలుగులో లిప్యంతరీకరించబడింది.
