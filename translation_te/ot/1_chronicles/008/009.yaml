translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. ‘కనెను’ వంటి సంక్షిప్త రూపం తెలుగులో తల్లి ప్రసవించిందనే భావాన్ని కలిగించవచ్చు కాబట్టి, పురుష వంశ సంబంధాన్ని స్పష్టంగా ఉంచేందుకు ‘కుమారులకు తండ్రి అయ్యాడు’ అని అనువదించబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
