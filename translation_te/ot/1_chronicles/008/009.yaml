  edition: WLC
  text: וַ/יּ֖וֹלֶד מִן חֹ֣דֶשׁ אִשְׁתּ֑/וֹ אֶת יוֹבָב֙ וְ/אֶת צִבְיָ֔א וְ/אֶת מֵישָׁ֖א וְ/אֶת מַלְכָּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: te
  text: హోదెషు అనే తన భార్య ద్వారా[a] అతడు యోబాబు, సిబ్యా, మేషా, మల్కాము అనే కుమారులకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హోదెషు అనే తన భార్య నుండి.” ఈ వంశావళి వాక్యనిర్మాణంలో హీబ్రూ ఉపసర్గను రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: కుమారులకు తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ילד పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִן
  choice: ద్వారా
  rationale: భార్యను తల్లిగా పేర్కొనే ఈ వంశావళి సూత్రంలో מִן మాతృమూలాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ సహజమైన రూపం. ‘నుండి’ అనే మరింత అక్షరార్థ రూపం కూడా సాధ్యమే.
- source_word: חֹדֶשׁ
  choice: హోదెషు
  rationale: ఇది వ్యక్తిపేరు; అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: אִשְׁתּוֹ
  choice: తన భార్య
  rationale: ఈ సందర్భంలో אשה ప్రత్యయంతో కలిసి స్పష్టంగా జీవిత భాగస్వామిని సూచిస్తుంది.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: పేర్లను వరుసగా జాబితా చేయడం
  rationale: పునరావృత ప్రత్యక్ష కర్మ సూచికకు తెలుగులో విడిగా సమాన పదం అవసరం లేదు; పేర్ల జాబితా ద్వారా దాని వాక్యనిర్మాణ పాత్ర వ్యక్తమవుతుంది.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: צִבְיָא
  choice: జిబ్యా
  rationale: హీబ్రూ צִבְיָא వ్యక్తిపేరుకు ఉచ్చారణాధారిత తెలుగు లిప్యంతరీకరణ.
- source_word: מֵישָׁא
  choice: మేషా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: מַלְכָּם
  choice: మల్కాము
  rationale: వంశావళిలో ఇది వ్యక్తిపేరు; హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
