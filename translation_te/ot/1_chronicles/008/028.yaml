source:
  edition: WLC
  text: אֵ֣לֶּה רָאשֵׁ֥י אָב֛וֹת לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/028.yaml
  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: te
  text: వీరు తమ తమ వంశాల ప్రకారం పితృకుటుంబాల పెద్దలు[a], ప్రముఖులు. వీరు యెరూషలేములో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ తమ వంశాల ప్రకారం పితృకుటుంబాల అధిపతులు—పెద్దలు.’ హెబ్రీయ పాఠం ‘తల/పెద్ద’ అనే మూలభావాన్ని పునరుక్తి చేసి వారి ప్రాధాన్యాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: ఈ హెబ్రీయ పదబంధం పూర్వికుని ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ విభాగాల నాయకులను సూచిస్తుంది. ‘పితృకుటుంబాల పెద్దలు’ మూలంలోని సామాజిక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְתֹלְדוֹתָם
  choice: తమ తమ వంశాల ప్రకారం
  rationale: תולדות ఇక్కడ తరాలు లేదా వంశపరంపరలను సూచిస్తుంది. లిఖిత వంశావళి పత్రాలనే ఉద్దేశించిందని అనవసరంగా నిర్ధారించకుండా, వంశాలవారీ అమరికను ఈ అనువాదం తెలియజేస్తుంది.
- source_word: רָאשִׁים
  choice: ప్రముఖులు
  rationale: మూలంలో ‘తల/పెద్ద’ అనే భావమున్న పదం పునరుక్తమై వారి ఉన్నత స్థానాన్ని నొక్కిచెబుతుంది. తెలుగులో అసహజమైన పదపునరుక్తిని నివారిస్తూ ఆ ప్రాధాన్యాన్ని ‘ప్రముఖులు’ తెలియజేస్తుంది.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ఈ వంశావళి సందర్భంలో క్రియ కూర్చోవడాన్ని కాక స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసించారు’ గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: בִירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపంలో ఇచ్చి, בְ ఉపసర్గను ‘లో’తో వ్యక్తం చేసింది.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: వీరు ... వీరు
  rationale: హెబ్రీయ పాఠంలోని రెండుసార్ల సూచనాత్మక నిర్మాణాన్ని నిలుపుతూ ప్రతి వాక్యానికి స్పష్టమైన కర్తను ఉంచింది.
