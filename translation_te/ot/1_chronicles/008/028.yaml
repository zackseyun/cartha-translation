translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి సందర్భానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు אֵלֶּה సూచనలను, అలాగే רֹאשׁ పదభావ పునరుక్తి ఉద్దేశాన్ని సాధ్యమైనంతవరకు నిలుపుకుంది.
