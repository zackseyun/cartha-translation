  edition: WLC
  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ה וְ/אַף הֵ֗מָּה נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: te
  text: మిక్లోతు షిమ్యాకు తండ్రి అయ్యాడు. వారు కూడా తమ సహోదరులకు[a] ఎదురుగా[b] యెరూషలేములో తమ సహోదరులతో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అనేది కేవలం ఒకే తల్లిదండ్రులకు పుట్టిన అన్నదమ్ములను మాత్రమే కాక, బెన్యామీను వంశావళిలోని ఒకే వంశం లేదా బంధువర్గానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ముందు’ లేదా ‘సమీపంలో’; హీబ్రూ పదం ఒకరి ముందు, ఎదురుగా, లేదా సమీపంలో ఉన్న స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: మిక్లోతు
  rationale: సంధానార్థకమైన וּ సందర్భంలో తెలుగులో ప్రత్యేకంగా పలకకపోయినా వంశావళి కొనసాగింపు స్పష్టంగానే ఉంటుంది; పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలో ‘కనెను’ అనే పాత ప్రయోగం కంటే ఇది ఆధునిక పాఠకులకు సహజంగా ఉండి, పురుష వంశసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: אֶת שִׁמְאָה
  choice: షిమ్యాకు
  rationale: ప్రత్యక్ష కర్మ సూచికను విడిగా అనువదించాల్సిన అవసరం లేదు; పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְאַף הֵמָּה
  choice: వారు కూడా
  rationale: సంధానంతో కూడిన చేర్పు, ఉద్ఘాటన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נֶגֶד
  choice: ఎదురుగా
  rationale: ఈ పదానికి ‘ముందు’, ‘ఎదురుగా’, కొన్నిసార్లు ‘సమీపంలో’ అనే స్థలసంబంధ భావాలు ఉండవచ్చు; ప్రధాన పాఠంలో దాని స్పష్టమైన ప్రాథమిక స్థలార్థాన్ని ఉంచాం.
- source_word: אֲחֵיהֶם
  choice: తమ సహోదరులు
  rationale: హీబ్రూ పదానికి అక్షరార్థంగా ‘వారి సహోదరులు’; వంశావళి సందర్భంలో ఇది ఒకే వంశం లేదా బంధువర్గానికి చెందిన పురుషులను కూడా సూచించవచ్చు.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ఇక్కడ కూర్చోవడం కంటే స్థిరనివాసం చేయడం అనే భావం సందర్భానికి సరిపోతుంది; ‘నివసించారు’ ఆధునికంగా, గౌరవప్రదంగా ఉంది.
- source_word: בִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: עִם אֲחֵיהֶם
  choice: తమ సహోదరులతో
  rationale: עִם అనే పదానికి నేరుగా ‘తో’ అని అనువదించాం; మూలంలోని పునరుక్తిని తొలగించకుండా నిలిపాం.
