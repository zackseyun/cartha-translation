  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా రూపొందించబడింది. మూలంలో క్రియ లేనందున తెలుగులోనూ అనవసరంగా ‘ఉన్నారు/అయ్యారు’ చేర్చలేదు.
