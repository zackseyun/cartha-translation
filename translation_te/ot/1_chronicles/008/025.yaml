    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְדְיָה
  choice: యిఫ్దెయా
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా, దాని ధ్వనికి దగ్గరగా ఆధునిక తెలుగు లిపిలో రాయబడింది.
- source_word: פניאל
  choice: పెనూయేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు మసొరేటిక్ పఠనాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ. హీబ్రూ వ్యంజనాల ఆధారంగా మరో పఠనం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచబడింది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారుడు’ అనే పదానికి నిర్మాణ బహువచనం. క్రియలేని వంశావళి వాక్యంలో సహజమైన తెలుగుకు ‘కుమారులు’ సరిపోతుంది; మూలంలోని స్పష్టమైన పుంలింగ వంశావళి భావాన్ని నిలుపుతుంది.
- source_word: שָׁשָׁק
  choice: షాషాకు
  rationale: వ్యక్తిపేరు ‘షాషాక్’ను తెలుగు లిపిలో రాసి, ‘కుమారులు’తో సంబంధాన్ని సహజంగా తెలియజేయడానికి షష్ఠీ విభక్తి ‘-కు’ జోడించబడింది.
