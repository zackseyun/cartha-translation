- source_word: זִכְרִי
  choice: జిక్రీ
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనులకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఈ నిర్మాణానికి ప్రత్యక్ష అర్థం ‘కుమారులు.’ వంశావళి సందర్భాల్లో ‘సంతతివారు’ అనే విస్తృత అర్థం సాధ్యమైనప్పటికీ, ఇక్కడ ముగ్గురు పురుషుల పేర్లు నేరుగా ఇవ్వబడినందున ప్రధాన పాఠంలో నిర్దిష్ట అర్థాన్ని ఉంచాం.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం; తెలుగు వాక్యంలో సంబంధార్థక విభక్తిని సహజంగా జోడించాం.
