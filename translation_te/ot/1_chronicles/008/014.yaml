  text: And Ahio[a], Shashak, and Jeremoth.
translation:
  language: te
  text: మరియు అహీయో, షాషాకు, మరియు యెరీమోతు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరిమోతు.’
    reason: పేరు లిప్యంతరీకరణలో ఉన్న ప్రత్యామ్నాయ రూపాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וְ/אַחְיוֹ
  choice: అహీయో
  rationale: వంశావళి జాబితాలోని వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. వాక్యారంభంలోని וְ జాబితా అనుసంధానాన్ని సూచించినా, తెలుగులో ఈ విడి వచనం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ అని చేర్చలేదు.
- source_word: שָׁשָׁק
  choice: షాషాకు
  rationale: వ్యక్తి పేరైన Šāšāqను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וִ/ירֵמוֹת
  choice: యెరీమోతు
  rationale: వ్యక్తి పేరును మసొరెటిక్ స్వరచిహ్నాలకు దగ్గరగా లిప్యంతరీకరించాం. ముందున్న וְ జాబితా అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో కామాలతోనే ఆ సంబంధం స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. పేర్ల మధ్య సంబంధాన్ని సహజమైన తెలుగు జాబితా నిర్మాణంతో చూపించాం.
