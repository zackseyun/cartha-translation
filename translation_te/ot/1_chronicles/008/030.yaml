  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: te
  text: అతని జ్యేష్ఠకుమారుడు అబ్దోను; తరువాత సూరు, కీషు, బయలు, నాదాబు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנוֹ
  choice: అతని ... కుమారుడు
  rationale: వావ్ వంశావళి ప్రవాహంతో ఈ వాక్యాన్ని కలుపుతుంది; తెలుగులో సహజంగా ‘అతని ... కుమారుడు’ అని వ్యక్తం చేశాం. ప్రత్యయాన్ని ‘అతని’గా అనువదించాం.
- source_word: הַבְּכוֹר
  choice: మొదటి కుమారుడు
  rationale: జన్మక్రమంలో మొదట పుట్టిన కుమారుణ్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘మొదటి కుమారుడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַבְדּוֹן
  choice: అబ్దోను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְצוּר
  choice: తరువాత సూరు
  rationale: צוּר అనే పేరును ‘సూరు’గా లిప్యంతరీకరించాం; పేర్ల జాబితా సహజంగా చదవడానికి వావ్‌ను ‘తరువాత’గా వ్యక్తం చేశాం.
- source_word: וְקִישׁ
  choice: కీషు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: וּבַעַל
  choice: బయలు
  rationale: ఇక్కడ వంశావళిలోని వ్యక్తి పేరు కాబట్టి అర్థానువాదం చేయకుండా పేరుగా లిప్యంతరీకరించాం.
- source_word: וְנָדָב
  choice: నాదాబు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వంశావళి శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త నామావళి నిర్మాణాన్ని ప్రధాన పాఠంలో స్పష్టమైన వాక్యంగా ఇచ్చి, మరింత పదానుసార రూపాన్ని పాదటిప్పణిలో నిలిపాం.
