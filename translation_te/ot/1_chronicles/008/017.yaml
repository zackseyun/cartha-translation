  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: జెబద్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం. జాబితాలో పేర్ల మధ్య సముచ్చయం తెలుగులో సహజంగా ఉండేందుకు ప్రతి పేరుకు ‘మరియు’ చేర్చలేదు.
- source_word: וּ/מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హీబ్రూ వ్యక్తి పేరును అనువదించకుండా, దాని ఉచ్చారణను ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ/חִזְקִי
  choice: హిజ్కీ
  rationale: ఇది ‘హిజ్కీ’ అనే సంక్షిప్త నామరూపం; వేరైన, మరింత పరిచితమైన ‘హిజ్కియా’ రూపాన్ని దిగుమతి చేయకుండా మూలంలోని రూపాన్ని నిలిపాం.
- source_word: וָ/חָבֶר
  choice: హెబెరు
  rationale: హీబ్రూ חָבֶר అనే వ్యక్తి పేరుకు తెలుగు బైబిలు శైలికి అనుగుణమైన లిప్యంతరీకరణను వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి పేర్ల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూలో ప్రతి పేరుకు ఉన్న ו־ సముచ్చయాన్ని యాంత్రికంగా పునరావృతం చేయకుండా తెలుగు జాబితా నిర్మాణంలో సహజంగా వ్యక్తపరిచాం.
