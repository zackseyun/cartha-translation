  text: וּ/מִיכָאֵ֧ל וְ/יִשְׁפָּ֛ה וְ/יוֹחָ֖א בְּנֵ֥י בְרִיעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/016.yaml
  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: te
  text: మీకాయేలు, ఇష్పా, యోహా—వీరు బెరీయా కుమారులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: మీకాయేలు
  rationale: వ్యక్తిపేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం; ముందున్న సంధికారకాన్ని తెలుగు జాబితా నిర్మాణంలో ప్రత్యేకంగా చూపాల్సిన అవసరం లేదు.
- source_word: וְ/יִשְׁפָּה
  choice: ఇష్పా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ధ్వని-లిపి పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְ/יוֹחָא
  choice: యోహా
  rationale: ఆదిలోని హీబ్రూ యోడ్ ధ్వనిని ‘య’తో ప్రతిబింబిస్తూ పేరును నేరుగా లిప్యంతరీకరించాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో ఇది పేర్కొన్న పురుష సంతానాన్ని నేరుగా సూచిస్తుంది; ‘సంతానం’ లేదా ‘వారసులు’ కంటే ‘కుమారులు’ మరింత నిర్దిష్టం.
- source_word: בְרִיעָה
  choice: బెరీయా
  rationale: హీబ్రూ వ్యక్తిపేరును మూల ధ్వనులకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలి. హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న ‘మరియు’ను యథాతథంగా పునరావృతం చేయకుండా, తెలుగు జాబితా నిర్మాణానికి సహజంగా పేర్లను వరుసగా ఇచ్చి, డ్యాష్‌తో వారి సంబంధాన్ని స్పష్టం చేశాం.
