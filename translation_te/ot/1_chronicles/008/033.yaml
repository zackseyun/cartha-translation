id: 1CH.8.33
reference: 1 Chronicles 8:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: te
  text: నేరు కీషుకు తండ్రి అయ్యాడు; కీషు సౌలుకు తండ్రి అయ్యాడు; సౌలు యెహోనాతాను, మల్కీషూవ, అబీనాదాబు, ఎష్బయలు[a]లకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఎష్బయలు 2 సమూయేలు గ్రంథంలో ఇష్బోషెతు అని పిలువబడ్డాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో ఈ హిఫిల్ క్రియ ప్రత్యక్ష పురుష సంతాన సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేలా ‘తండ్రి అయ్యాడు’ అని అనువదించాం; పాతకాలపు ‘కనెను’ కంటే ఇది సాధారణ పాఠకులకు సులభం.
- source_word: נֵר
  choice: నేరు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: קִישׁ
  choice: కీషు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన స్థిర రూపాన్ని ఉపయోగించాం.
- source_word: יְהוֹנָתָן
  choice: యెహోనాతాను
  rationale: ఇక్కడి పూర్తి హీబ్రూ నామరూపాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: מַלְכִּי שׁוּעַ
  choice: మల్కీషూవ
  rationale: రెండు భాగాల హీబ్రూ వ్యక్తి పేరును ఒకే పేరుగా సహజమైన తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: אֲבִינָדָב
  choice: అబీనాదాబు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనువైన విధంగా లిప్యంతరీకరించాం.
- source_word: אֶשְׁבָּעַל
  choice: ఎష్బయలు
  rationale: దినవృత్తాంతముల హీబ్రూ మూలపాఠంలోని పేరునే అనుసరించాం; సమూయేలు గ్రంథంలోని భిన్న నామరూపంతో ప్రధాన పాఠాన్ని సమన్వయపరచలేదు.
theological_decisions:
- issue: సౌలు కుమారుల జాబితాలో చివరి వ్యక్తి నామరూపం
  choice: ప్రధాన పాఠంలో ‘ఎష్బయలు’
  alternative: ‘ఇష్బోషెతు’
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; మూలపాఠ నామరూపానికి సంబంధించిన అంశం. దినవృత్తాంతముల హీబ్రూ పాఠంలో אֶשְׁבָּעַל ఉన్నందున దానినే ప్రధాన పాఠంలో ఉంచి, సమూయేలు గ్రంథంలో కనిపించే పరిచితమైన భిన్న రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని అనుసరించాం. వరుసగా వచ్చే వంశ సంబంధాలను స్పష్టంగా చూపేందుకు ‘తండ్రి అయ్యాడు’ అనే నిర్మాణాన్ని పునరావృతం చేశాం; చివరి జాబితాలో తెలుగు విభక్తిని చివరి పేరుకు జోడించి సమూహ సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
