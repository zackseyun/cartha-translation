  source_fidelity: 'హీబ్రూ వంశావళి నిర్మాణాన్ని సరిగ్గా అనుసరించింది: నేరు కీషుకు, కీషు సౌలుకు, సౌలు పేర్కొన్న నలుగురు కుమారులకు తండ్రి అని స్పష్టంగా తెలియజేస్తుంది. చివరి పేరు אֶשְׁבָּעַל‌కు ప్రధాన పాఠంలో ‘ఎష్బయలు’ రూపాన్ని ఉంచడం మూలపాఠానికి నిష్ఠగా ఉంది; సమూయేలులోని ఇష్బోషెతు రూపంతో సమన్వయం చేయలేదు.'
