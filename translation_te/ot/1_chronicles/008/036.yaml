source:
  edition: WLC
  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יְהוֹעַדָּ֔ה וִ/יהֽוֹעַדָּ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: te
  text: ఆహాజు యెహోయద్దాకు[a] తండ్రి అయ్యాడు; యెహోయద్దా ఆలెమెతు, అజ్మావెతు, జిమ్రీలకు తండ్రి అయ్యాడు; జిమ్రీ మోజాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో “యెహోయద్దా”; కొన్ని ఆంగ్ల అనువాద సంప్రదాయాల్లో “యెహోయాదా” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం తండ్రిగా సంతానాన్ని పొందడాన్ని సూచిస్తుంది. ఈ ప్రయోగం ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండి మూలంలోని వంశసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది హెబ్రీ భాషలో ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు.
- source_word: יְהוֹעַדָּה
  choice: యెహోయద్దా
  rationale: సరఫరా చేసిన హెబ్రీ పాఠంలోని హల్లుల రూపాన్ని దగ్గరగా ప్రతిబింబించేలా వ్యక్తిపేరును లిప్యంతరీకరించాం.
- source_word: עָלֶמֶת
  choice: ఆలెమెతు
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: עַזְמָוֶת
  choice: అజ్మావెతు
  rationale: హెబ్రీ హల్లులను సాధ్యమైనంత దగ్గరగా కాపాడుతూ తెలుగులో సహజంగా చదవగల రూపాన్ని ఎంచుకున్నాం.
- source_word: זִמְרִי
  choice: జిమ్రీ
  rationale: రెండు సందర్భాల్లోనూ వ్యక్తిపేరును ఒకే విధంగా లిప్యంతరీకరించాం.
- source_word: מוֹצָא
  choice: మోజా
  rationale: హెబ్రీ వ్యక్తిపేరును దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ
  choice: మరియు / వాక్య అనుసంధానం
  rationale: ఈ సంధాయకం వంశావళిలో వ్యక్తులనూ వాక్యభాగాలనూ కలుపుతుంది. తెలుగులో సహజత్వం కోసం జాబితాలో విభక్తి-సమన్వయంతోను, వాక్యాల మధ్య విరామచిహ్నాలతోను దాని పని ప్రతిబింబించబడింది.
