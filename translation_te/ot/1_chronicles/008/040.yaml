  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: te
  text: ఊలాము కుమారులు పరాక్రమవంతులైన యోధులు; వారు విల్లును వంచేవారు[a]. వారికి కుమారులు, మనుమలు ఎంతోమంది ఉండేవారు—మొత్తం నూట యాభై మంది. వీరందరూ బెన్యామీను వంశస్థులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “విల్లును తొక్కేవారు” లేదా “విల్లును వంచేవారు.” ఇది విలుకాళ్లను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: ఊలాము కుమారులు … వీరులు
  rationale: వంశావళి సందర్భంలోని వివరణాత్మక వాక్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: పరాక్రమవంతులైన వీరులు
  rationale: బలం, సాహసం, యుద్ధసామర్థ్యం అనే స్థిర ప్రయోగంలోని భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: విల్లు ఎక్కుపెట్టేవారు
  rationale: విల్లును వంచి సిద్ధం చేసే చర్యను సూచించే హీబ్రూ నుడికారానికి దగ్గరగా ఉండి, వారు విలుకాళ్లని సహజంగా తెలియజేస్తుంది.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: వారికి కుమారులు, మనుమలు ఎంతోమంది ఉండేవారు
  rationale: సంతానం విస్తారంగా ఉండడాన్ని సూచించే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది; ‘కుమారుల కుమారులు’ అనే నిర్మాణాన్ని ‘మనుమలు’గా పలుకుతుంది.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: మొత్తం నూట యాభై మంది
  rationale: ఈ సంఖ్య కుమారులు, మనుమలు కలిపిన సమూహాన్ని సూచిస్తుందని తెలుగు పాఠకునికి స్పష్టంగా చేస్తుంది.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: వీరందరూ బెన్యామీను వంశస్థులు
  rationale: מן + בני సూచించే వంశ/గోత్ర సంబంధాన్ని పదానువాదపు అసహజత లేకుండా వ్యక్తపరుస్తుంది.
