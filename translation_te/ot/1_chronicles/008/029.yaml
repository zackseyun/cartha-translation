revisions:
- from: గిబియోనులో గిబియోను తండ్రి[a] నివసించాడు; అతని భార్య పేరు మయకా.
  to: గిబియోనులో గిబియోనుకు తండ్రి[a] నివసించారు; ఆయన భార్య పేరు మయకా.
  rationale: The revision retains the Hebrew title’s ambiguity and its contextual alternatives, improves the Telugu genitive construction, and changes the residence verb to plural in accordance with the WLC form. ‘ఆయన’ naturally refers back to the titled individual and maintains a respectful genealogical register; it does not resolve the source’s plural-verb irregularity.
