  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: te
  text: గిబియోనులో గిబియోనుకు తండ్రి[a] నివసించారు; ఆయన భార్య పేరు మయకా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గిబియోను స్థాపకుడు’ లేదా ‘గిబియోను ముఖ్యుడు’; హీబ్రూలో అక్షరార్థంగా, ‘గిబియోనుకు తండ్రి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְע֥וֹן
  choice: గిబియోనులో
  rationale: వావ్ సంధికారకాన్ని సందర్భానుసారంగా తెలుగులో విడిచిపెట్టి, בְ ఉపసర్గలోని స్థలార్థాన్ని సహజంగా తెలిపింది.
- source_word: יָשְׁב֖וּ
  choice: నివసించాడు
  rationale: ישׁב అనే క్రియకు ఇక్కడ నివాసాన్ని సూచించే అర్థం ఉంది. మూలంలో బహువచన రూపం ఉన్నప్పటికీ, ఏకవచన కర్తతో సరిపడేలా ప్రాచీన పాఠపరంపరలు, సమాంతర వచనం సూచించే భావాన్ని అనుసరించి తెలుగులో ఏకవచనంగా ఇచ్చింది.
- source_word: אֲבִ֣י גִבְע֑וֹן
  choice: గిబియోను తండ్రి
  rationale: అక్షరార్థమైన ‘గిబియోను తండ్రి’ని ప్రధాన పాఠంలో నిలిపి, స్థాపకుడు లేదా ముఖ్యుడు అనే సందర్భోచిత భావాలను పాదసూచికలో ఉంచింది.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: అతని భార్య పేరు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేసింది.
- source_word: מַעֲכָֽה
  choice: మయకా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించింది. అక్షరార్థంలోని అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపింది.
