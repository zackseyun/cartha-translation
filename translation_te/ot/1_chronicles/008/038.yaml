source:
  edition: WLC
  text: וּ/לְ/אָצֵל֮ שִׁשָּׁ֣ה בָנִים֒ וְ/אֵ֣לֶּה שְׁמוֹתָ֗/ם עַזְרִיקָ֥ם בֹּ֨כְרוּ֙ וְ/יִשְׁמָעֵ֣אל וּ/שְׁעַרְיָ֔ה וְ/עֹבַדְיָ֖ה וְ/חָנָ֑ן כָּל אֵ֖לֶּה בְּנֵ֥י אָצַֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: te
  text: ఆజేలుకు ఆరుగురు కుమారులు ఉన్నారు[a]. వారి పేర్లు అజ్రీకాము, బోకెరు[b], ఇష్మాయేలు, షెయర్యా, ఓబద్యా, హానాను. వీరందరూ ఆజేలు కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఆజేలుకు ఆరుగురు కుమారులు.” హీబ్రూలో ఇది వంశావళుల్లో స్వామ్యాన్ని తెలిపే సాధారణ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ స్వరచిహ్నాల ప్రకారం ఇది “బోకెరు” అనే వ్యక్తిపేరు. దీనిని “అతని జ్యేష్ఠ కుమారుడు” అని అర్థం చేసుకోవడం కూడా ప్రతిపాదించబడింది; అయితే అలా తీసుకుంటే ఇక్కడ ఐదుగురి పేర్లే మిగులుతాయి.
    reason: textual_lexical_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: ఆజేలుకు ఆరుగురు కుమారులు ఉన్నారు
  rationale: వంశావళుల్లో לְ ఉపసర్గతో వచ్చే అస్తిత్వ–స్వామ్య ప్రయోగాన్ని తెలుగులో సహజంగా ‘ఆజేలుకు ... ఉన్నారు’ అని అనువదించాం; בָנִים ఇక్కడ మగ సంతానాన్ని సూచిస్తుంది.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: వారి పేర్లు
  rationale: ‘ఇవి వారి పేర్లు’ అనే హీబ్రూ నామావళి సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా తెలిపే రూపం.
- source_word: עַזְרִיקָם
  choice: అజ్రీకాము
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֹּכְרוּ
  choice: బోకెరు
  rationale: మసొరెతిక్ స్వరచిహ్నాలు దీనిని Bōḵərū అనే వ్యక్తిపేరుగా చూపుతున్నాయి. అంతేకాక, దీనిని ప్రత్యేక పేరుగా తీసుకున్నప్పుడే ముందున్న ‘ఆరుగురు’ అనే సంఖ్యకు అనుగుణంగా ఆరు పేర్లు వస్తాయి.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు బైబిలు పేర్లలో సాధారణంగా వినిపించే రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שְׁעַרְיָה
  choice: షెయర్యా
  rationale: హీబ్రూ వ్యక్తిపేరులోని ధ్వనులను సాధ్యమైనంత దగ్గరగా తెలుగులో ప్రతిబింబించాం.
- source_word: עֹבַדְיָה
  choice: ఓబద్యా
  rationale: హీబ్రూ వ్యక్తిపేరును సంక్షిప్తమైన, సహజమైన తెలుగు లిప్యంతరణలో ఇచ్చాం.
- source_word: חָנָן
  choice: హానాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని రూపంలో లిప్యంతరీకరించాం.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: వీరందరూ ఆజేలు కుమారులు
  rationale: ముగింపు వంశావళి ప్రకటనను స్పష్టమైన, సహజమైన తెలుగు వాక్యంగా అందించాం; אָצֵל/אָצַל అనే ఒకే పేరును అంతటా ‘ఆజేలు’గా ఏకరీతిగా ఉంచాం.
