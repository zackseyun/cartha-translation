translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గౌరవప్రదమైన సరళ శైలిని ఉపయోగించాం. మూల హీబ్రూలోని ఆరు పేర్లను అలాగే నిలిపి, בֹּכְרוּ విషయంలో ఉన్న ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో స్పష్టంగా పేర్కొన్నాం.
