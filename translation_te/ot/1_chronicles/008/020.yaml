translation_notes:
  register: వంశావళి పేర్ల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న ‘మరియు’ను తెలుగులో అసహజంగా పునరావృతం చేయకుండా కామాలతో జాబితాగా ఇచ్చాం.
