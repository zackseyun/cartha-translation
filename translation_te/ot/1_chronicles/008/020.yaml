lexical_decisions:
- source_word: וֶ/אֱלִיעֵנַי
  choice: ఎలీయేనై
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం. జాబితాలో ప్రతి పేరుకు ముందు ఉన్న ו సముచ్చయాన్ని సహజ తెలుగు జాబితా శైలిలో విడిగా పునరావృతం చేయలేదు.
- source_word: וְ/צִלְּתַי
  choice: జిల్లెతై
  rationale: హీబ్రూ צִלְּתַי పేరులోని ధ్వనులను సాధ్యమైనంత దగ్గరగా ప్రతిబింబించేలా తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: וֶ/אֱלִיאֵל
  choice: ఎలీయేలు
  rationale: వ్యక్తి పేరును అర్థానువాదం చేయకుండా, ఆధునిక తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
