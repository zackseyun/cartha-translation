    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  choice: అదాయా
  rationale: హీబ్రూ వ్యక్తిపేరును దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְרָאיָה
  choice: బెరాయా
  rationale: మధ్యలోని అలెఫ్‌ను ప్రతిబింబించే హీబ్రూ రూపాన్ని అనుసరించి, సంక్షిప్తమైన ‘బెరియా’ కంటే ‘బెరాయా’ను ఎంచుకున్నాం.
- source_word: שִׁמְרָת
  choice: షిమ్రాతు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా ఉచ్చరించగల విధంగా లిప్యంతరీకరించాం; చివరి తావ్ ధ్వనిని ‘తు’తో సూచించాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది వంశావళిలో తండ్రి–కుమారుల సంబంధాన్ని తెలిపే బహువచన నిర్మాణరూపం.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: హీబ్రూ వ్యక్తిపేరును సాధారణ తెలుగు బైబిలు పేరు-రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు సహజమైన సంక్షిప్త నిర్మాణాన్ని వాడాం. మూలంలోని పేర్ల క్రమాన్ని నిలిపి, చివరలో ఉన్న బంధుత్వ సమాచారాన్ని ‘వీరు షిమీ కుమారులు’ అని స్పష్టంగా అందించాం.
