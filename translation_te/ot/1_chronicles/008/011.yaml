  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: te
  text: మరియు హుషీము ద్వారా అతడు అబీటూబుకూ ఎల్పయాలుకూ తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హుషీము నుండి.” హీబ్రూ ఉపసర్గను మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; అయితే వంశావళి సందర్భంలో “హుషీము ద్వారా” అనేది ఆమె ద్వారా కలిగిన సంతానాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: హుషీము ద్వారా
  rationale: మִן ఉపసర్గ మూలం లేదా సంబంధాన్ని సూచిస్తుంది. వంశావళి సందర్భంలో హుషీము ద్వారా సంతానం కలిగిందనే భావాన్ని సహజంగా తెలియజేస్తుంది; ఆరంభ וּ ముందున్న వాక్యంతో అనుసంధానమై తెలుగులో విడిగా అనువదించకపోయినా భావం నిలుస్తుంది.
- source_word: הוֹלִיד
  choice: అతడు ... కన్నాడు
  rationale: יַלד ధాతువు హిఫీల్ రూపం వంశావళుల్లో ‘సంతానానికి తండ్రి అయ్యాడు/కన్నాడు’ అనే అర్థం ఇస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, ఆధునిక తెలుగులో వంశావళి శైలికి తగినదిగా ఉంది.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు.
- source_word: אֲבִיטוּב
  choice: అబీటూబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְ/אֶת
  choice: ను, ... ను
  rationale: וְ సంధానార్థాన్ని తెలుగు జాబితా నిర్మాణంతో వ్యక్తం చేశాం; אֶת‌కు స్వతంత్ర అనువాదం లేదు. రెండు పేర్లకూ కర్మవిభక్తి జోడించాం.
- source_word: אֶלְפָּעַל
  choice: ఎల్పయలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని సహజమైన తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
