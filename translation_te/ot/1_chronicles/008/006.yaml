id: 1CH.8.6
reference: 1 Chronicles 8:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: te
  text: 'ఏహూదు కుమారులు వీరు. వీరు గెబ నివాసులకు చెందిన పితృవంశాల పెద్దలు[a]; వారు వారిని మనహతుకు ప్రవాసానికి తరలించారు[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పితృవంశాల పెద్దలు” అంటే ఒకే పూర్వీకుని నుంచి వచ్చిన వంశానికి లేదా పూర్వీకుల గృహానికి నాయకులైనవారు.
    reason: cultural_note
  - marker: b
    text: “వారు,” “వారిని” అనే సర్వనామాలు ఎవరిని సూచిస్తున్నాయో హీబ్రూ వాక్యంలో స్పష్టంగా లేదు.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: వంశావళిలో కొత్త వివరాన్ని పరిచయం చేసే పదబంధం. తెలుగులో సహజంగా ఉండేందుకు ప్రారంభ సంధానకర్తను విడిచిపెట్టి, ఉనికి క్రియను అంతర్భావంగా ఉంచాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో ఇది ప్రామాణిక పదం; సందర్భానుసారం ప్రత్యక్ష కుమారులతో పాటు వంశస్థులను కూడా సూచించగలదు.
- source_word: אֵחוּד
  choice: ఏహూదు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֵלֶּה הֵם
  choice: వీరు
  rationale: హీబ్రూలోని ఉద్ఘాటనతో కూడిన పునరుక్తిని తెలుగులో సహజమైన పునరారంభంగా వ్యక్తపరుస్తుంది.
- source_word: רָאשֵׁי אָבוֹת
  choice: పితృవంశాల పెద్దలు
  rationale: పూర్వీకుని ఆధారంగా ఏర్పడిన వంశగృహాల నాయకులను సూచించే సామాజిక-వంశావళి పదబంధం; సాధారణ ‘కుటుంబ పెద్దలు’ కంటే నిర్మాణాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: గెబ నివాసుల
  rationale: లామెద్ సూచించే సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ విభక్తితో వ్యక్తపరుస్తుంది; ఈ పెద్దలు గెబ నివాసులకు చెందినవారని తెలుపుతుంది.
- source_word: גֶבַע
  choice: గెబ
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיַּגְלוּם
  choice: వారు వారిని … చెరగా తరలించారు
  rationale: హిఫీల్ రూపం బలవంతంగా ప్రవాసానికి పంపడాన్ని సూచిస్తుంది. కర్త, కర్మ ఎవరిని సూచిస్తున్నాయో మూలంలో స్పష్టంగా లేకపోవడంతో ‘వారు వారిని’ అని ఆ సందిగ్ధతను నిలిపాం.
- source_word: אֶל מָנָחַת
  choice: మనహతుకు
  rationale: దిశను తెలిపే పదబంధాన్ని తెలుగు దత్తివిభక్తితో, స్థలనామాన్ని లిప్యంతరీకరించి అనువదించాం.
