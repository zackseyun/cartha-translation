translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘పితృవంశాలు’ అనే పదం ప్రాచీన సామాజిక నిర్మాణాన్ని కాపాడుతుంది. చివరి ద్విబిందువును తరువాతి పేర్ల జాబితాతో ఉన్న వాక్యసంబంధాన్ని సూచించేందుకు నిలిపాం.
