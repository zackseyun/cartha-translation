  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַאְרֵ֥עַ וְ/אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: te
  text: 'మీకా కుమారులు: పీతోను, మెలెకు, తరెయా, ఆహాజు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే పదానికి సహజమైన అర్థం ‘కుమారులు’. ఆరంభంలోని ו అనేది వంశావళి క్రమాన్ని కొనసాగించే సంధాయకం; తెలుగు వాక్యప్రవాహంలో దాన్ని విడిగా ‘మరియు’ అని అనువదించకపోవడం సహజం.
- source_word: מִיכָה
  choice: మీకా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פִּיתוֹן
  choice: పీతోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా తెలుగు లిపిలో ప్రతిబింబించాం.
- source_word: וָמֶלֶךְ
  choice: మెలెకు
  rationale: వంశావళి సందర్భం వల్ల מֶלֶךְ ఇక్కడ ‘రాజు’ అనే సామాన్య నామవాచకం కాదు, వ్యక్తినామం. అందువల్ల అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וְתַאְרֵעַ
  choice: తారెయ
  rationale: తిబేరియా స్వరచిహ్నాలతో ఉన్న హీబ్రూ రూపం תַאְרֵעַను సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְאָחָז
  choice: ఆహాజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పఠనానికి సహజంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని ఉపయోగించాం. పేర్లను హీబ్రూ మూలరూపానికి సమీపంగా, తెలుగు పఠనానికి అనుకూలంగా ఇచ్చాం. ఈ వచనంలోని פִּיתוֹן పేరు ‘పీతోను’; ఇంగ్లీషు సంప్రదాయాల్లో కనిపించే ‘Tahrea’ ప్రత్యామ్నాయం వాస్తవానికి תַאְרֵעַ పేరుకు సంబంధించినది కావడంతో, మూలాధారం లేని ఇంగ్లీషు పాదటిప్పణిని చేర్చలేదు.
