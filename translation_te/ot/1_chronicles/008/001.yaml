    reason: lexical_alternative
  revision_rationale: The revision follows the supplied Hebrew name form אַחְרַח as «అహ్రహు», retains the alternate name rendering in a non-doctrinal textual footnote, and replaces the less natural male use of «కన్నాడు» with an explicit modern Telugu genealogical expression. It also restores «బెలా» as the conventional transliteration of בֶּלַע.
