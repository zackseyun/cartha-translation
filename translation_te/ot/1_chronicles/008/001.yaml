translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వంశావళి శైలి. పేర్లకు తెలుగు బైబిలు శైలికి దగ్గరైన ప్రత్యయరూపాలు వాడాం. మూలపాఠంలో పాఠాంతర సూచన అవసరమయ్యే నిజమైన సందిగ్ధత కనిపించనందున పాదటిప్పణి చేర్చలేదు; అందువల్ల ప్రధాన పాఠంలో పాదటిప్పణి గుర్తులు లేవు.
