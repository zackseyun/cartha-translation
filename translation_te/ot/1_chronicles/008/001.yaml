source:
  edition: WLC
  text: וּ/בִ֨נְיָמִ֔ן הוֹלִ֖יד אֶת בֶּ֣לַע בְּכֹר֑/וֹ אַשְׁבֵּל֙ הַ/שֵּׁנִ֔י וְ/אַחְרַ֖ח הַ/שְּׁלִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: te
  text: బెన్యామీను బెలా అనే తన తొలిచూలు కుమారునికి, అష్బేలు అనే రెండవ కుమారునికి, అహ్రహు[a] అనే మూడవ కుమారునికి తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో అహ్రహు అని ఉంది; కొన్ని అనువాద సంప్రదాయాల్లో అహరహు అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: బెన్యామీను
  rationale: వంశావళి ప్రవాహంలో సంధిని తెలుగులో ప్రత్యేకంగా వ్యక్తం చేయకుండా, హెబ్రీ పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: యలద్ ధాతువు హిఫీల్ రూపం వంశావళి సందర్భంలో తండ్రిగా సంతానాన్ని కనడాన్ని సూచిస్తుంది; ‘కన్నాడు’ సహజమైన ఆధునిక తెలుగు వంశావళి ప్రయోగం.
- source_word: בֶּלַע
  choice: బెల
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: בְּכֹרוֹ
  choice: తన మొదటి కుమారుడైన
  rationale: ‘అతని ప్రథమజాతుడు’ అనే భారమైన రూపం కంటే సహజంగా ఉండి, కుమారుని జననక్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אַשְׁבֵּל
  choice: అష్బేలు
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: הַשֵּׁנִי
  choice: రెండవవాడైన
  rationale: పేర్ల జాబితాలో జననక్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַחְרַח
  choice: అహరహు
  rationale: మసొరెటిక్ పాఠంలోని אַחְרַח రూపాన్ని అనుసరించి లిప్యంతరీకరించాం; ఇక్కడ పాదటిప్పణి అవసరం లేదు, ఎందుకంటే ఇచ్చిన ఆంగ్ల పాదటిప్పణి పాఠంతో అసంబద్ధంగా ఉంది.
- source_word: הַשְּׁלִישִׁי
  choice: మూడవవాడైన
  rationale: జాబితాలోని మూడవ జననస్థానాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
