- from: బెన్యామీను తన మొదటి కుమారుడైన బెలను, రెండవవాడైన అష్బేలును, మూడవవాడైన అహరహును కన్నాడు.
  to: బెన్యామీను బెలా అనే తన తొలిచూలు కుమారునికి, అష్బేలు అనే రెండవ కుమారునికి, అహ్రహు[a] అనే మూడవ కుమారునికి తండ్రి అయ్యాడు.
  rationale: The revision follows the supplied Hebrew name form אַחְרַח as «అహ్రహు», retains the alternate name rendering in a non-doctrinal textual footnote, and replaces the less natural male use of «కన్నాడు» with an explicit modern Telugu genealogical expression. It also restores «బెలా» as the conventional transliteration of בֶּלַע.
