translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి వాడబడింది. పాదసూచిక మీకా పేరులోని పాఠ్యభేదానికి సంబంధించినందున సూచికను ఆ పేరుకే జోడించాం.
