  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: te
  text: యెహోనాతాను కుమారుడు మెరీబ్-బయలు; మెరీబ్-బయలు మీకాను[a] కన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 9:12లోని సమాంతర వంశావళిలో ఈ వ్యక్తి పేరు మִיכָא (‘మీకా’)గా ఉంది; ఇక్కడ 1 దినవృత్తాంతాలు మִיכָה (‘మీకా’) అనే రూపాన్ని వాడుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: కుమారుడు
  rationale: వంశావళి కొనసాగింపును తెలుగులో సహజంగా తెలియజేస్తుంది. హీబ్రూ ו సాధారణ అనుసంధానాన్ని సూచించినా, ఈ చిన్న వాక్యంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ కొనసాగింపు స్పష్టంగా ఉంటుంది.
- source_word: יְהוֹנָתָן
  choice: యెహోనాతాను
  rationale: దినవృత్తాంతాల గ్రంథంలోని యెహోనాతాన్ అనే మూలభాషా రూపాన్ని, మరింత పరిచితమైన సంక్షిప్త రూపానికి మార్చకుండా లిప్యంతరీకరించింది.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: మెరీబ్-బయలు
  rationale: హీబ్రూలో రెండు భాగాలుగా రాసిన ఒకే వ్యక్తినామాన్ని స్పష్టంగా చూపేందుకు మధ్యగీతతో లిప్యంతరీకరించింది. రెండుసార్లు రావడం ఇద్దరు వ్యక్తులను కాక, వంశావళిలో పేరును తిరిగి ప్రస్తావించడాన్ని సూచిస్తుంది.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: హిఫిల్ రూపం వంశావళి సందర్భంలో ‘తండ్రి అయ్యాడు/కన్నాడు’ అనే అర్థం ఇస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, సాధారణ తెలుగు వంశావళి శైలికి అనుగుణంగా ఉంది.
- source_word: אֶת מִיכָה
  choice: మీకాను
  rationale: אֶת ప్రత్యేకంగా అనువదించని కర్మ సూచకం. מִיכָהను ‘మీకా’గా లిప్యంతరీకరించి, తెలుగు కర్మవిభక్తి ‘ను’ చేర్చింది.
