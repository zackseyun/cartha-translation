  terminology: వ్యక్తిపేర్లకు అనువైన లిప్యంతరీకరణను నిలబెట్టారు. ఎలీయేలు పేరులోని దైవనామాంశాన్ని అనువదించకుండా ఉంచడం సరైనది. ఆంగ్ల లిప్యంతరీకరణ ప్రత్యామ్నాయాలు తెలుగు పాఠానికి తప్పనిసరి పాదసూచికలు కావు.
