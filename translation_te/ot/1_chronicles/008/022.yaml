lexical_decisions:
- source_word: יִשְׁפָן
  choice: యిష్పాను
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; పేరుకు అర్థానువాదం చేయలేదు.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: హెబ్రీ రూపాన్ని అనుసరించి వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלִיאֵל
  choice: ఎలీయేలు
  rationale: దైవనామాంశం ఉన్నప్పటికీ, వ్యక్తి పేరు కావడంతో దాని భాగాలను అర్థానువాదం చేయకుండా సంపూర్ణ పేరును లిప్యంతరీకరించాం.
- source_word: וְ / וָ / וֶ
  choice: కామాలతో కూడిన జాబితా
  rationale: హెబ్రీలో ప్రతి పేరుకు ముందు సంధాన అవ్యయం ఉన్నా, ఆధునిక సహజ తెలుగు జాబితా శైలిలో పేర్లను కామాలతో కలపడం సరళంగా, స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ఆంగ్లంలోని Ishpan/Jishpan, Eber/Heber ప్రత్యామ్నాయాలు ప్రధానంగా ఆంగ్ల లిప్యంతరీకరణ సంప్రదాయాలకు సంబంధించినవి కాబట్టి తెలుగులో పాదసూచికలుగా చేర్చలేదు.
