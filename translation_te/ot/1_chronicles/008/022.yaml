  source_fidelity: హెబ్రీ వచనంలోని మూడు వ్యక్తిపేర్లు—יִשְׁפָּן, עֵבֶר, אֱלִיאֵל—సరైన క్రమంలో అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడ్డాయి. జాబితాలోని వావ్ సంధానాలను తెలుగు జాబితా విరామచిహ్న శైలితో సహజంగా ప్రతిబింబించారు.
