translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి ఉపయోగించబడింది. పేర్లు హీబ్రూ ఆధారంగా లిప్యంతరీకరించబడ్డాయి; సంక్షిప్త హీబ్రూ నామవాక్య నిర్మాణం తెలుగులో స్పష్టంగా వ్యక్తమైంది.
