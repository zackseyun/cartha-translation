  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: te
  text: యెఊత్సు, సాఖ్యా, మిర్మా. వీరు అతని కుమారులు, పితృకుటుంబాల పెద్దలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వంశాల నాయకులు.” హీబ్రూలో అక్షరార్థంగా “పితరుల పెద్దలు”; ఇది పూర్వీకుల కుటుంబాలకు లేదా వంశ సమూహాలకు నాయకులైనవారిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: యెయూస్
  rationale: వ్యక్తి పేరు కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: שָׂכְיָה
  choice: శక్యా
  rationale: వ్యక్తి పేరును హీబ్రూ వ్యంజనాలు, స్వరాలకు దగ్గరగా తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
- source_word: מִרְמָה
  choice: మిర్మా
  rationale: ఈ వంశావళి సందర్భంలో ఇది వ్యక్తి పేరు; సాధారణ నామవాచకంగా ఉన్నప్పుడు వచ్చే ‘మోసం’ అనే అర్థాన్ని ఇక్కడ అనువదించలేదు.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న వ్యక్తులను సూచించే బహువచన సర్వనామంగా సహజమైన తెలుగు రూపం.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: వంశావళిలోని పుంలింగ బహువచనాన్ని ఖచ్చితంగా ప్రతిబింబిస్తుంది.
- source_word: רָאשֵׁי אָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: ‘పితరుల పెద్దలు’ అనే అక్షరార్థం కంటే, పూర్వీకుల ఆధారంగా ఏర్పడిన కుటుంబ విభాగాలకు నాయకులనే హీబ్రూ నుడికార భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
