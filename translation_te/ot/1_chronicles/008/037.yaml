translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి వాడబడింది. పేర్లు ఇంగ్లీషు రూపాలనుంచి కాకుండా హీబ్రూ రూపాల ఆధారంగా లిప్యంతరీకరించబడ్డాయి. ‘అతని కుమారుడు’ అనే పునరుక్తి మూలంలోని వంశావళి గొలుసును, దాని సంక్షిప్త నిర్మాణాన్ని కాపాడుతుంది.
