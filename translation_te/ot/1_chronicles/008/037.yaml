source:
  edition: WLC
  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א רָפָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: te
  text: మోత్సా బిన్యాకు తండ్రి అయ్యాడు; రాఫా అతని కుమారుడు, ఎల్యాసా అతని కుమారుడు, ఆసేలు అతని కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: మోత్సా
  rationale: వంశావళి కొనసాగింపును తెలుగు వాక్యప్రవాహంలో విరామచిహ్నంతో సహజంగా తెలియజేస్తూ, מוֹצָא అనే పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘మోత్సా’గా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫీల్ రూపం ‘తండ్రి కావడం/కనడం’ అనే భావం ఇస్తుంది. ఆధునిక సాధారణ తెలుగులో సహజంగా, పురుష వంశసంబంధాన్ని స్పష్టంగా చెప్పడానికి ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి వేరే పదం అవసరం లేదు.
- source_word: בִּנְעָא
  choice: బిన్యా
  rationale: హీబ్రూ పేరులోని ధ్వనులను తెలుగులో సహజంగా పలికేలా ‘బిన్యా’గా లిప్యంతరీకరించాం; అంత్య అయిన్‌కు ప్రత్యేక తెలుగు సమాన ధ్వని లేదు.
- source_word: רָפָה
  choice: రాఫా
  rationale: మసొరేటిక్ స్వరచిహ్నాల ప్రకారం పేరును ‘రాఫా’గా లిప్యంతరీకరించాం.
- source_word: בְנ֛/וֹ
  choice: అతని కుమారుడు
  rationale: మూలంలోని ‘అతని కుమారుడు’ అనే సంక్షిప్త వంశావళి నిర్మాణాన్ని తెలుగులోనూ నిలిపాం; ‘ఉన్నాడు’ వంటి అదనపు క్రియను చేర్చలేదు.
- source_word: אֶלְעָשָׂה
  choice: ఎల్యాసా
  rationale: హీబ్రూ పేరును తెలుగులో పలకడానికి అనుకూలంగా, దాని హల్లులు మరియు స్వరరూపాన్ని సాధ్యమైనంత దగ్గరగా ప్రతిబింబిస్తూ ‘ఎల్యాసా’గా ఇచ్చాం.
- source_word: בְנ֖/וֹ
  choice: అతని కుమారుడు
  rationale: తరతరాల వంశక్రమాన్ని చూపే మూలంలోని పునరుక్తిని యథాతథ భావంతో నిలిపాం.
- source_word: אָצֵל
  choice: ఆసేలు
  rationale: హీబ్రూ צ ధ్వనిని సాధారణ తెలుగు బైబిలు పేర్లలో సహజంగా వినిపించే ‘స’తో సూచించి, పేరును ‘ఆసేలు’గా లిప్యంతరీకరించాం.
- source_word: בְּנֽ/וֹ
  choice: అతని కుమారుడు
  rationale: వంశావళి గొలుసులోని చివరి సంబంధాన్ని కూడా మూలంలోని సంక్షిప్త పునరుక్తితో అనువదించాం.
