translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో వంశావళి జాబితాకు తగిన సంక్షిప్త, గంభీర శైలి. వ్యక్తిపేర్లు మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సులభంగా చదవగల రూపంలో ఇవ్వబడ్డాయి.
