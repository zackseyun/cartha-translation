    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: జెబద్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం. ముందున్న וּ సంధికారకం మునుపటి వచనం నుంచి కొనసాగుతున్న పేర్ల జాబితాను సూచిస్తుంది; తెలుగులో వాక్యారంభంలో ‘మరియు’ చేర్చకుండా సహజమైన జాబితా రూపాన్ని వాడాం.
- source_word: וַ/עֲרָד
  choice: అరాదు
  rationale: హీబ్రూ עֲרָד పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా ‘అరాదు’ అని లిప్యంతరీకరించాం; సంధికారకాన్ని కామాతో సహజంగా వ్యక్తపరిచాం.
- source_word: וָ/עָדֶר
  choice: ఏదెరు
  rationale: మసొరా స్వరచిహ్నాలతో ఉన్న עָדֶר రూపాన్ని అనుసరించి ‘ఏదెరు’ అని లిప్యంతరీకరించాం. ఇది ‘ఆదెరు’ కంటే మూలపాఠంలోని మొదటి స్వరాన్ని మెరుగ్గా ప్రతిబింబిస్తుంది.
