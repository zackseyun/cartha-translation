lexical_decisions:
- source_word: וְ
  choice: జాబితాలో పేర్లను కామాలతో కలపడం
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు וְ (‘మరియు’) ఉంది. ఆధునిక సహజ తెలుగు జాబితా శైలిలో పదేపదే ‘మరియు’ అనకుండా కామాలతో పేర్లను కలిపితే అదే జాబితా నిర్మాణం స్పష్టంగా ఉంటుంది.
- source_word: עַבְדּוֹן
  choice: అబ్దోను
  rationale: ఇది వ్యక్తి పేరు; దాని హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: זִכְרִי
  choice: జిక్రీ
  rationale: ఇది వ్యక్తి పేరు. హీబ్రూ זִכְרִי (zikrî) ఉచ్చారణకు దగ్గరగా, తెలుగు పాఠకులకు సహజంగా ఉండే రూపం ఎంచుకోబడింది.
- source_word: חָנָן
  choice: హానాను
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ దీర్ఘ ā ధ్వనిని ప్రతిబింబిస్తూ తెలుగులో లిప్యంతరీకరించబడింది.
