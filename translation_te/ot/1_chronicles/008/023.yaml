  source_fidelity: హీబ్రూ వచనంలోని మూడు వ్యక్తినామాలు—עַבְדּוֹן, זִכְרִי, חָנָן—అన్నీ సరియైన క్రమంలో ఉన్నాయి. ప్రతి పేరుతో ఉన్న וְ సంయోజకాన్ని తెలుగు జాబితా-శైలిలో కామాల ద్వారా చూపించడం అర్థాన్నిగానీ వంశావళి జాబితా స్వరూపాన్నిగానీ మార్చదు.
