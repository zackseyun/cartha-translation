  terminology: వ్యక్తినామాలను అనువదించకుండా లిప్యంతరీకరించడం సముచితం. “జిక్రీ” హీబ్రూ זִכְרִיకి అనుకూలమైన తెలుగు రూపం; ఈ చిన్న జాబితాలో ప్రత్యామ్నాయ లిప్యంతరీకరణపై గమనిక అవసరం లేదు.
