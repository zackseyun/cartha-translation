id: 1CH.8.13
reference: 1 Chronicles 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְרִעָ֣ה וָ/שֶׁ֔מַע הֵ֚מָּה רָאשֵׁ֣י הָ/אָב֔וֹת לְ/יוֹשְׁבֵ֖י אַיָּל֑וֹן הֵ֥מָּה הִבְרִ֖יחוּ אֶת י֥וֹשְׁבֵי גַֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: te
  text: బెరియా, షెమా—వీరిద్దరూ అయ్యాలోను నివాసులలో పితృకుటుంబాల నాయకులు[a]; గాతు నివాసులను తరిమివేసినవారు వీరే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పితృకుటుంబాల తలలు/నాయకులు.” ఇది పితృవంశాల ఆధారంగా ఏర్పడిన కుటుంబ సమూహాల నాయకులను సూచించే హీబ్రూ సామాజిక పదబంధం.
    reason: cultural_note
  - marker: b
    text: లేదా “పారిపోయేలా చేసినవారు.” హీబ్రూ క్రియ గాతు నివాసులు పారిపోయేలా చేయడాన్ని నొక్కిచెబుతుంది; సందర్భానుసారంగా “తరిమివేశారు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: బెరీయా, షెమా
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం. సంయోజక సంబంధాన్ని తెలుగు జాబితా నిర్మాణం ద్వారా సహజంగా తెలిపాం.
- source_word: הֵמָּה
  choice: వీరిద్దరూ / వీరే
  rationale: రెండుసార్లు వచ్చిన స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను మొదట ‘వీరిద్దరూ’, తరువాత ‘వీరే’ అని సహజమైన తెలుగులో నిలిపాం.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలు
  rationale: ఇది వంశాధారిత కుటుంబ సమూహాల నాయకులను సూచించే సామాజిక పదబంధం. ‘పితృవంశాల పెద్దలు’ మూలంలోని వంశ సంబంధాన్ని కాపాడుతూ ఆధునిక పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: అయ్యాలోను నివాసుల
  rationale: ఇక్కడ לְ నాయకత్వ సంబంధాన్ని సూచిస్తుంది; వారు అయ్యాలోను జనసమూహంలోని వంశపెద్దలని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אַיָּלוֹן
  choice: అయ్యాలోను
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הִבְרִיחוּ
  choice: తరిమివేశారు
  rationale: ברח యొక్క హిఫీల్ రూపం ‘పారిపోయేలా చేయడం’ అనే కారణార్థాన్ని కలిగి ఉంది. సందర్భంలో ‘తరిమివేశారు’ సహజంగా ఉండి ఆ కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: יֹשְׁבֵי גַת
  choice: గాతు నివాసులు
  rationale: ‘గాతులో నివసించేవారు’ అనే మూలార్థాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో ఇచ్చాం; స్థలనామాన్ని లిప్యంతరీకరించాం.
