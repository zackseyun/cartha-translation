  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని ఉపయోగించాం. ‘వీరే’ అనే నిర్మాణంతో మూలంలోని ఉద్ఘాటనను నిలిపి, పితృవంశ నాయకత్వానికి సంబంధించిన సాంస్కృతిక సమాచారాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
