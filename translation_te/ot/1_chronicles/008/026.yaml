translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. వ్యక్తి పేర్లు మూల హీబ్రూ ఆధారంగా లిప్యంతరీకరించబడ్డాయి.
