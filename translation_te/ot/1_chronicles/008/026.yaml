lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: షంశెరై
  rationale: వంశావళిలోని వ్యక్తి పేరు; అర్థానువాదం చేయకుండా హీబ్రూ ధ్వనులకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: שְׁחַרְיָה
  choice: షెహర్యా
  rationale: వ్యక్తి పేరు; హీబ్రూ వ్యంజన నిర్మాణాన్ని, చివరి -యా అంశాన్ని వీలైనంతగా నిలుపుతూ తెలుగులో చదవడానికి అనువుగా లిప్యంతరీకరించబడింది.
- source_word: עֲתַלְיָה
  choice: అతల్యా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וְ / וּ / וַ
  choice: మరియు
  rationale: మొదటి వావ్ పేర్ల జాబితాను ముందున్న వాక్యభాగంతో కలుపుతుంది. మిగిలిన వావ్‌లను తెలుగులో ప్రతి పేరుకు ముందు పునరావృతం చేయకుండా కామాలతో చూపించడం సహజమైన తెలుగు జాబితా శైలిని ఇస్తుంది; అనుసంధాన భావం మాత్రం నిలుస్తుంది.
