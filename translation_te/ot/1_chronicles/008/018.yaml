lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: ఇష్మెరై
  rationale: వ్యక్తి పేరు; హీబ్రూ వ్యంజన రూపాన్ని సహజమైన తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- source_word: יִזְלִיאָה
  choice: ఇజ్లీయా
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించాం.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: వ్యక్తి పేరు; బైబిలు పేర్లకు తెలుగులో సాధారణంగా వినిపించే రూపాన్ని ఉపయోగించాం.
- source_word: בְּנֵי
  choice: వీరు … కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే నిర్మాణ బహువచన రూపం. హీబ్రూలో క్రియ లేకపోయినా, వంశావళి సంబంధం సహజమైన తెలుగులో స్పష్టంగా ఉండేందుకు ‘వీరు’ అనే పదాన్ని చేర్చాం.
- source_word: אֶלְפָּעַל
  choice: ఎల్పయలు
  rationale: వ్యక్తి పేరు; చదవడానికి సులభమైన తెలుగు లిప్యంతరీకరణను వాడాం.
