source:
  edition: WLC
  text: וּ/בְנֵ֣י אֶלְפַּ֔עַל עֵ֥בֶר וּ/מִשְׁעָ֖ם וָ/שָׁ֑מֶד ה֚וּא בָּנָ֣ה אֶת אוֹנ֔וֹ וְ/אֶת לֹ֖ד וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: te
  text: 'ఎల్పయలు కుమారులు: ఏబెరు, మిషాము, షెమెదు. అతడే[a] ఓనోను, లోదును, దాని అనుబంధ గ్రామాలను[b] నిర్మించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతడు’ అనేది అత్యంత సహజంగా చివరిగా పేర్కొన్న షెమెదును సూచిస్తుంది; అయితే కొందరు దీనిని ఆ కుటుంబ వంశశాఖతో మరింత విస్తృతంగా సంబంధపెడతారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘దాని కుమార్తెలను’; ఇది ఒక పట్టణానికి ఆధీనమైన లేదా దాని చుట్టుపక్కల ఉన్న గ్రామాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: ఎల్పయలు కుమారులు
  rationale: వంశావళిలో పేర్ల జాబితాను పరిచయం చేసే నిర్మాణం. ఆరంభంలోని సంధికారకాన్ని తెలుగులో విడిగా చూపకపోవడం సహజంగా ఉంటుంది.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: ఏబెరు, మిషాము, షెమెదు
  rationale: హీబ్రూ వ్యక్తిపేర్లను ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הוּא
  choice: అతడే
  rationale: స్వతంత్ర మూడవ పురుష ఏకవచన సర్వనామం. సందర్భంలో చివరిగా పేర్కొన్న షెమెదును అత్యంత సహజంగా సూచిస్తుంది; ‘ఏ’ అతడే నిర్మించినవాడని వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: בָּנָה
  choice: నిర్మించాడు
  rationale: Qal perfect రూపానికి సాధారణ అర్థం ‘కట్టాడు/నిర్మించాడు.’ ‘స్థాపించాడు’ లేదా ‘తిరిగి కట్టించాడు’ అనే అదనపు భావాలను చేర్చలేదు.
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: ఓనోను, లోదును
  rationale: హీబ్రూ స్థలనామాలను నేరుగా తెలుగు లిపిలో ఇచ్చాం; ప్రత్యక్ష కర్మను తెలుగు విభక్తితో సూచించాం.
- source_word: וּבְנֹתֶיהָ
  choice: దాని అనుబంధ గ్రామాలను
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలను’; పట్టణానికి ఆధీనమైన చిన్న గ్రామాలు లేదా నివాస ప్రాంతాలను సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం.
theological_decisions:
- issue: הוּא అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతడే’ అని ఉంచి, షెమెదును అత్యంత సహజ పూర్వపదంగా పాదటిప్పణిలో తెలిపాం.
  alternative: దీనిని మొత్తం ఎల్పయలు వంశశాఖకు సంబంధించిన సడలించిన సూచనగా గ్రహించడం.
  rationale: హీబ్రూలో పురుష ఏకవచన సర్వనామం చివరిగా పేర్కొన్న షెమెదును సహజంగా సూచించినా, వంశావళి శైలిలో కుటుంబశాఖతో విస్తృత సంబంధం ఉండే అవకాశాన్ని పూర్తిగా తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. పేర్లను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం; అపరిచితమైన అక్షరార్థ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలుపుతూ పాదటిప్పణిలో మూల రూపాన్ని ఉంచాం.
