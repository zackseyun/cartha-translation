translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన పేర్ల జాబితాగా రూపొందించబడింది. తెలుగు పేర్లలో సహజంగా వినిపించేందుకు చివరి అచ్చులు చేర్చబడ్డాయి; మూలంలోని నామరూప భేదాలు పాదసూచికల్లో నిలుపబడ్డాయి.
