    reason: lexical_alternative
lexical_decisions:
- source_word: גֵרָא
  choice: గేరా
  rationale: వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: שְׁפוּפָן
  choice: షెఫూఫాను
