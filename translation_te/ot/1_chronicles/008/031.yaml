lexical_decisions:
- source_word: וּגְדוֹר
  choice: గెదోరు
  rationale: వంశావళిలోని వ్యక్తి పేరుగా లిప్యంతరీకరించబడింది. పేర్ల జాబితాలో హెబ్రీ సంధికారకమైన ו వరుసను కలుపుతున్నప్పటికీ, సహజమైన తెలుగు జాబితా శైలిలో ప్రతి పేరుకు ‘మరియు’ చేర్చలేదు.
- source_word: וְאַחְיוֹ
  choice: అహీయో
  rationale: హెబ్రీ వ్యక్తి పేరు אַחְיוֹ ను మాసొరెటిక స్వరచిహ్నాలకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וָזָכֶר
  choice: జెకెరు
  rationale: זָכֶר అనే వ్యక్తి పేరును మాసొరెటిక పాఠంలోని స్వరాన్ని ప్రతిబింబించేలా ‘జెకెరు’గా లిప్యంతరీకరించాం; ఇతర లిప్యంతరీకరణ సంప్రదాయాల్లో భిన్న రూపం సాధ్యమని పాదసూచికలో తెలిపాం.
