  - marker: a
    text: అనతోతీయా అనే పేరును ‘అనాతోతీయా’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנַנְיָה
  choice: హనన్యా
  rationale: వ్యక్తి పేరు కావడంతో అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: ఈ వంశావళి సందర్భంలో ఇది ప్రాంతం పేరు కాక వ్యక్తి పేరు. హీబ్రూ రూపాన్ని తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: עַנְתֹתִיָּה
  choice: అనతోతీయా
  rationale: వ్యక్తి పేరును హీబ్రూ వ్యంజన, స్వర నిర్మాణానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; ‘అనాతోతీయా’ అనే విస్తృత రూపం కూడా సాధ్యమే.
- source_word: וְ
  choice: జాబితా విరామచిహ్నాలు
  rationale: హీబ్రూలో ప్రతి పేరును కలిపే సంధికారకాన్ని తెలుగులో సహజమైన పేర్ల జాబితా శైలికి అనుగుణంగా కామాలతో వ్యక్తపరిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్త పేర్ల జాబితాగా రూపొందించబడింది. వ్యక్తి పేర్లు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
