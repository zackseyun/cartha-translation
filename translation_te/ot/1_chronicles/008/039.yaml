  text: וּ/בְנֵ֖י עֵ֣שֶׁק אָחִ֑י/ו אוּלָ֣ם בְּכֹר֔/וֹ יְעוּשׁ֙ הַ/שֵּׁנִ֔י וֶֽ/אֱלִיפֶ֖לֶט הַ/שְּׁלִשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: te
  text: 'అతని సోదరుడైన ఏషెకు కుమారులు[a]: అతని తొలికుమారుడు ఊలాము, రెండవవాడు యెయూషు, మూడవవాడు ఎలీఫెలెతు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “మరియు అతని సోదరుడైన ఏషెకు కుమారులు: అతని తొలికుమారుడు ఊలాము, రెండవవాడు యెయూషు, మూడవవాడు ఎలీఫెలెతు.” హీబ్రూ వాక్యం ‘మరియు’ అనే సంయోజకంతో మొదలవుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: ఇది సంధితో కూడిన ‘కుమారులు’ అనే నిర్మాణ రూపం. తెలుగు వంశావళి శైలిలో ముందున్న సందర్భంతో సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: עֵשֶׁק
  choice: ఏషెకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, విభక్తి ప్రయోగాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אָחִיו
  choice: అతని సహోదరుడైన
  rationale: మూలంలోని సాధారణ అర్థమైన ‘అతని సహోదరుడు’ను నిలిపి, వాక్య సంబంధం స్పష్టంగా ఉండేలా విశేషణ రూపంలో ఇచ్చాం.
- source_word: אוּלָם
  choice: ఊలాము
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בְּכֹרוֹ
  choice: అతని మొదటిపుట్టినవాడు
  rationale: ‘జ్యేష్ఠుడు’ కంటే మూలంలోని firstborn భావాన్ని నేరుగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְעוּשׁ
  choice: యెయూషు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הַשֵּׁנִי
  choice: రెండవవాడు
  rationale: కుమారుల జనన క్రమాన్ని సూచించే క్రమసంఖ్యను నేరుగా అనువదించాం.
- source_word: וֶאֱלִיפֶלֶט
  choice: ఎలీఫెలెతు
  rationale: సంధితో కూడిన వ్యక్తినామాన్ని తెలుగు జాబితా నిర్మాణంలో సహజంగా లిప్యంతరీకరించాం.
- source_word: הַשְּׁלִשִׁי
  choice: మూడవవాడు
  rationale: మూడవ కుమారుని క్రమాన్ని నేరుగా సూచిస్తుంది.
