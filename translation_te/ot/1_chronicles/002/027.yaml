  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. మూలంలోని జాబితా-పరిచయ క్రియను సహజమైన ద్విబిందు నిర్మాణంతో అందించాం; అన్ని వ్యక్తినామాలను లిప్యంతరీకరించాం.
