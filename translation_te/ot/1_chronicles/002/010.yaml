  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָ֖ם הוֹלִ֣יד אֶת עַמִּינָדָ֑ב וְ/עַמִּינָדָב֙ הוֹלִ֣יד אֶת נַחְשׁ֔וֹן נְשִׂ֖יא בְּנֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: te
  text: రాము అమ్మీనాదాబుకు తండ్రి అయ్యాడు; అమ్మీనాదాబు నహ్షోనుకు తండ్రి అయ్యాడు. నహ్షోను యూదా కుమారుల నాయకుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా కుమారుల ప్రధానుడు’ లేదా ‘యూదా కుమారుల అధిపతి.’
    reason: నְשִׂיא పదానికి ‘నాయకుడు’తో పాటు ‘ప్రధానుడు,’ ‘అధిపతి’ అనే సందర్భానుసారమైన అర్థాలు కూడా ఉన్నాయి.
lexical_decisions:
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ఒక పురుషుడు మరొకరిని కనడం, అంటే అతనికి తండ్రి కావడం అనే భావాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి పురుష వంశపరంపర భావాన్ని నిలుపుతుంది.
- source_word: נְשִׂיא
  choice: నాయకుడు
  rationale: ఈ పదం గౌరవస్థానంలో ఉన్న నాయకుడు, ప్రధానుడు లేదా అధిపతిని సూచించగలదు. ఇక్కడ నయస్సోనుకు యూదా వంశస్థుల మధ్య ఉన్న గుర్తింపు పొందిన నాయకత్వ హోదాను ‘నాయకుడు’ స్పష్టంగా తెలియజేస్తుంది; రాజవంశానికి చెందినవాడనే అనవసర భావాన్ని రానివ్వదు.
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘యూదా కుమారులు.’ వంశావళి సందర్భంలోని పురుష, గోత్ర సంబంధ భావాన్ని నిలుపుకోవడానికి ఈ రూపమే ఉపయోగించబడింది.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: రాము / అమ్మీనాదాబు / నయస్సోను
  rationale: ఇవి వ్యక్తుల పేర్లు కాబట్టి అర్థానువాదం చేయకుండా, తెలుగులో సులభంగా పలికే సంప్రదాయ బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. ‘కనెను’ వంటి ప్రాచీన ప్రయోగానికి బదులుగా ‘తండ్రి అయ్యాడు’ ఎంచుకోబడింది. మూలంలోని ‘యూదా కుమారులు’ అనే వంశపరమైన రూపం అలాగే నిలుపబడింది. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు అమ్మీనాదాబు తర్వాత ఉన్నప్పటికీ, ఆ పాదసూచి נְשִׂיא (‘నాయకుడు’) అనే పదానికి సంబంధించినది కాబట్టి తెలుగులో గుర్తు ‘నాయకుడు’ తర్వాత ఉంచబడింది.
