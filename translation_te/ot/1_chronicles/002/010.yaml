revisions:
- from: రాము అమ్మీనాదాబుకు తండ్రి అయ్యాడు; అమ్మీనాదాబు నయస్సోనుకు తండ్రి అయ్యాడు. నయస్సోను యూదా కుమారులకు నాయకుడు[a].
  to: రాము అమ్మీనాదాబుకు తండ్రి అయ్యాడు; అమ్మీనాదాబు నహ్షోనుకు తండ్రి అయ్యాడు. నహ్షోను యూదా కుమారుల నాయకుడు[a].
  rationale: వంశావళి భావాన్ని, ఆధునిక సహజమైన తెలుగును నిలుపుతూ, నహ్షోను అనే పేరును హీబ్రూ నామరూపానికి అనుగుణంగా సరిచేశాను. అలాగే మూలంలోని నిర్మాణ సంబంధాన్ని స్పష్టంగా చూపేందుకు ‘యూదా కుమారులకు నాయకుడు’ను ‘యూదా కుమారుల నాయకుడు’గా మార్చాను. పాదసూచి గుర్తు నְשִׂיאకు అనువదించిన ‘నాయకుడు’ తర్వాతనే ఉంచబడింది.
