  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: te
  text: 'హెబ్రోను కుమారులు: కోరహు, తప్పూహు, రెకెము, షామా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే పదానికి బహువచన సంబంధరూపం; ఇక్కడ వెంటనే వ్యక్తుల పేర్లు ఇవ్వబడుతున్నందున ‘కుమారులు’ సహజమైన, సూటియైన అనువాదం. ఆరంభంలోని וּ సంధిని తెలుగు వంశావళి శైలిలో విడిగా ‘మరియు’ అని చూపించాల్సిన అవసరం లేదు.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: קֹרַח
  choice: కోరహు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: תַפֻּחַ
  choice: తప్పూయహు
  rationale: ఇక్కడ సాధారణ నామార్థాన్ని అనువదించకుండా వ్యక్తి పేరుగా లిప్యంతరీకరించాం; చివరి ח ధ్వనిని తెలుగులో సులభంగా పలికేలా ‘హు’తో సూచించాం.
- source_word: רֶקֶם
  choice: రేకెము
  rationale: వ్యక్తి పేరును హీబ్రూ స్వరరూపానికి దగ్గరగా, సహజ తెలుగు నామరూపంలో ఇచ్చాం.
- source_word: שָׁמַע
  choice: షెమా
  rationale: మసొరెటిక్ పాఠంలోని שָׁמַע రూపాన్ని ‘షెమా’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని అనుసరించాం. పేర్లను మూల హీబ్రూ రూపాలకు దగ్గరగా, సాధారణ పాఠకుడు పలకగల విధంగా లిప్యంతరీకరించాం. అందించిన ఆంగ్ల పాదటిప్పణిలో కֹרַח వద్ద గుర్తు ఉన్నప్పటికీ దాని వివరణ שָׁמַע గురించి ఉండటం అంతర్గత అసంగతి; WLC పాఠంలో שָׁמַע స్పష్టంగా ఉన్నందున తెలుగు ప్రధాన పాఠంలో ‘షెమా’ను ఉంచి అవసరం లేని పాదటిప్పణి చేర్చలేదు.
