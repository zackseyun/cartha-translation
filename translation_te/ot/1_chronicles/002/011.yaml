  text: నహషోను శల్మాకు తండ్రి అయ్యాడు[a]; శల్మా బోయజుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘శల్మా’; రూతు 4:20–21, మత్తయి 1:4–5 వంటి సంబంధిత వంశావళులతో సరిపోల్చడానికి కొన్ని అనువాదాలు ‘సల్మోను’ అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: నయషోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం; ఆరంభ וְ వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే పురుష వంశసంబంధ భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: שַׂלְמָא
  choice: శల్మా
  rationale: ఈ వచనంలోని హీబ్రూ రూపం שַׂלְמָא ను నేరుగా ప్రతిబింబించేలా ‘శల్మా’ అని ఇచ్చాం; సంబంధిత వంశావళులతో సమన్వయం చేయడానికి ‘శల్మోను’గా మార్చలేదు.
- source_word: וְ/שַׂלְמָא
  choice: శల్మా
  rationale: וְ సంధిని తెలుగు విరామచిహ్నం మరియు వాక్యనిర్మాణం సహజంగా వ్యక్తం చేస్తున్నాయి; పేరును మూలరూపానికి దగ్గరగా ఉంచాం.
- source_word: בֹּעַז
  choice: బోయజు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని ఉపయోగించాం.
