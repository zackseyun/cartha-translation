translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. మూలంలోని రెండు సమాంతర వాక్యభాగాలను సెమికోలన్‌తో నిలిపాం.
