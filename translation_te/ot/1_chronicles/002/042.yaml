translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. వ్యక్తి లేదా స్థలనామం అనే సందిగ్ధతను ‘తండ్రి’ అనే మూలరూపంతో నిలిపి, సాంస్కృతిక పరిధిని పాదటిప్పణిలో వివరించింది. మూలంలోని చివరి ఖండపు వాక్యనిర్మాణ సమస్యను [a] గుర్తుతో సరైన చోట సూచించింది.
