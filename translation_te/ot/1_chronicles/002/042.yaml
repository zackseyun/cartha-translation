  terminology: ‘కుమారులు,’ ‘జ్యేష్ఠ కుమారుడు,’ ‘తండ్రి’ అనే పదాలు మూలానికి నమ్మకంగా ఉన్నాయి. ‘తండ్రి’కి వంశపూర్వికుడు/వంశాధిపతి/స్థాపకుడు అనే విస్తృత ప్రయోగం ఉండగలదని [b] పాదటిప్పణి సముచితంగా వివరిస్తుంది. వ్యక్తినామాల లిప్యంతరీకరణ స్థిరంగా, వాడుకకు అనుకూలంగా ఉంది.
