id: 1CH.2.42
reference: 1 Chronicles 2:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: te
  text: 'యెరహ్మెయేలు సహోదరుడైన కాలేబు కుమారులు: అతని జ్యేష్ఠ కుమారుడు మేషా; ఇతడు జీఫుకు తండ్రి[b]. ఇంకా హెబ్రోనుకు తండ్రియైన మారేషా కుమారులు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ చివరి భాగంలోని హీబ్రూ వాక్యనిర్మాణం కఠినంగా ఉంది. మసొరేటిక్ పాఠాన్ని అక్షరార్థంగా అనువదిస్తే, ‘మారేషా కుమారులు, హెబ్రోనుకు తండ్రి’ అని ఉంటుంది. కొందరు దీనిని ‘హెబ్రోనుకు తండ్రియైన మారేషా’ అని అర్థం చేసుకుంటారు; మరికొందరు హీబ్రూ పదక్రమాన్నే నిలుపుతారు.
    reason: alternative_reading
  - marker: b
    text: దినవృత్తాంతములు గ్రంథంలో ‘తండ్రి’ అనే మాట జీవసంబంధ తండ్రినే కాక పూర్వికుణ్ణి, వంశాధిపతిని, లేదా ఒక ప్రాంతంతో సంబంధమున్న స్థాపకుణ్ణి కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: కాలేబు కుమారులు
  rationale: వంశావళుల్లో వాడే ‘కుమారులు’ అనే ప్రామాణిక రూపాన్ని నిలిపింది; సందర్భానుసారం ఇది ప్రత్యక్ష కుమారులనే కాక విస్తృత సంతతిని కూడా సూచించవచ్చు.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: యెరహ్మెయేలు సహోదరుడైన
  rationale: కాలేబును గుర్తించే సంబంధపూర్వక పదబంధాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందించింది.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: అతని జ్యేష్ఠ కుమారుడు మేషా
  rationale: בְּכוֹר యొక్క జననక్రమం, కుటుంబస్థానం రెండింటినీ ‘జ్యేష్ఠ కుమారుడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא אֲבִי זִיף
  choice: ఇతడు జీఫుకు తండ్రి
  rationale: హీబ్రూ పదప్రయోగాన్ని నిలిపింది; ‘తండ్రి’ ఇక్కడ జీవసంబంధ తండ్రితో పాటు పూర్వికుడు, వంశాధిపతి లేదా స్థాపకుడు అనే భావాన్నీ కలిగి ఉండవచ్చు.
- source_word: וּבְנֵי מָרֵשָׁה אֲבִי חֶבְרוֹן
  choice: ఇంకా హెబ్రోనుకు తండ్రియైన మారేషా కుమారులు
  rationale: మసొరేటిక్ పాఠంలోని కఠిన వాక్యనిర్మాణాన్ని పాఠకులకు అర్థమయ్యే తెలుగులో మారేషాను ‘హెబ్రోనుకు తండ్రి’తో అనుసంధానించి అందించింది; ప్రత్యక్ష పదక్రమాన్ని పాదటిప్పణిలో నిలిపింది.
