id: 1CH.2.21
reference: 1 Chronicles 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: te
  text: ఆ తరువాత హెస్రోను, గిలాదుకు తండ్రియైన[c] మాకీరు కుమార్తె దగ్గరికి వెళ్లాడు[a]. అతడు ఆమెను భార్యగా తీసుకున్నాడు[b]; అప్పటికి అతనికి అరవై సంవత్సరాలు. ఆమె అతనికి సెగూబును కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఆమె దగ్గరికి వచ్చాడు/వెళ్లాడు.’ ఈ హీబ్రూ నానుడి వైవాహిక లేదా లైంగిక కలయికను మర్యాదగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆమెను భార్యగా తీసుకున్నాడు’ అనే మాటను ‘ఆమెను తీసుకున్నాడు’ లేదా ‘ఆమెను వివాహం చేసుకున్నాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: వంశావళి సందర్భంలో ‘గిలాదుకు తండ్రి’ అంటే గిలాదు యొక్క తక్షణ తండ్రి, పూర్వికుడు లేదా స్థాపకుడు అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: వంశావళిలో తరువాత జరిగిన కార్యాన్ని సూచించే కాలక్రమ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּא אֶל
  choice: తో కలిశాడు
  rationale: ఒక స్త్రీ విషయంగా వాడిన ఈ హీబ్రూ నానుడి వైవాహిక/లైంగిక కలయికను మర్యాదగా సూచించగలదు. తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా భావాన్ని తెలియజేస్తూ, పాదటిప్పణిలో అక్షరార్థాన్ని ఉంచాం.
- source_word: בַּת מָכִיר
  choice: మాకీరు కుమార్తె
  rationale: హీబ్రూ సంబంధపదబంధాన్ని స్పష్టమైన తెలుగు వంశావళి శైలిలో ప్రతిబింబిస్తుంది.
- source_word: אֲבִי גִלְעָד
  choice: గిలాదుకు తండ్రియైన
  rationale: אָב అనే పదానికి ఉన్న ప్రత్యక్షమైన ‘తండ్రి’ భావాన్ని ప్రధాన పాఠంలో నిలిపి, వంశావళి సందర్భంలో ఉండగల విస్తృత అర్థాలను పాదటిప్పణిలో సూచించాం.
- source_word: לְקָחָהּ
  choice: ఆమెను భార్యగా తీసుకున్నప్పుడు
  rationale: לקח ఒక స్త్రీతో వాడినప్పుడు వివాహాన్ని సూచించగలదు. ‘భార్యగా తీసుకున్నాడు’ అనేది మూలంలోని ‘తీసుకొను’ రూపాన్ని కొంత నిలుపుతూ వైవాహిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: అరవై ఏళ్లవాడు
  rationale: ‘అరవై సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నానుడికి సహజమైన తెలుగు సమానార్థకం.
- source_word: וַתֵּלֶד לוֹ
  choice: ఆమె అతనికి ... కనింది
  rationale: హీబ్రూలోని לוֹ (‘అతనికి’) అనే భావాన్ని స్పష్టంగా నిలుపుతూ తెలుగు వంశావళి శైలికి సరిపోతుంది.
- source_word: שְׂגוּב
  choice: సెగూబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: בָּא אֶל అనే నానుడి సూచించే సంబంధం
  choice: ప్రధాన పాఠంలో ‘తో కలిశాడు’ అని ఉంచి, దాని వైవాహిక/లైంగిక సూచనను పాదటిప్పణిలో వివరించాం.
  alternative: ‘దగ్గరికి వెళ్లాడు’ లేదా మరింత ప్రత్యక్షంగా ‘లైంగిక సంబంధం పెట్టుకున్నాడు’.
  rationale: మూలంలోని మర్యాదపూర్వక నానుడి స్వభావాన్ని కాపాడుతూ, అది కేవలం దగ్గరకు వెళ్లడమేనని తప్పుగా అర్థం కాకుండా చేశాం; అదే సమయంలో సంబంధ స్వరూపాన్ని అవసరానికి మించి సిద్ధాంతపరంగా నిర్ధారించలేదు.
- issue: אֲבִי గִלְעָד లో ‘తండ్రి’ యొక్క పరిధి
  choice: ‘గిలాదుకు తండ్రి’ అనే ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠంలో ఉంచాం.
  alternative: ‘గిలాదు పూర్వికుడు’ లేదా ‘గిలాదు స్థాపకుడు’.
  rationale: వంశావళి వాడుకలో ‘తండ్రి’ తక్షణ జనకుడినే కాక పూర్వికుణ్ణి లేదా స్థాపకుణ్ణి కూడా సూచించవచ్చు. మూలంలోని అనిశ్చితిని పాదటిప్పణి ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వంశావళి శైలిని వాడాం. వ్యక్తినామాలకు తెలుగు బైబిలు సంప్రదాయానికి దగ్గరైన రూపాలను ఎంచుకున్నాం; మూలంలోని నానుడులు అసహజంగా మారకుండా భావస్పష్టతతో అందించాం.
