translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. వ్యక్తిపేర్లకు తెలుగులో సులభంగా పలికే అంత్యస్వరాలను ఉంచాం; పాఠభేదాన్ని ప్రధాన పాఠంలో సమన్వయం చేయకుండా పాదటిప్పణిలో తెలిపాం.
