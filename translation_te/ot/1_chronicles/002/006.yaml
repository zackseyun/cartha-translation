base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: te
  text: 'జెరహు కుమారులు: జిమ్రీ, ఏతాను, హేమాను, కల్కోలు[a], దారా[b]—మొత్తం ఐదుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హీబ్రూ పేరును ‘కల్కోల్’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హీబ్రూ పాఠంలో ‘దారా’ అని ఉంది; సమాంతర వచనమైన 1 రాజులు 4:31లో ‘దర్దా’ అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זֶרַח
  choice: జెరహు కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే పదానికి సహజమైన, నిర్దిష్టమైన అనువాదం ‘కుమారులు’. జాబితా కొనసాగింపును తెలుగులో సహజంగా ఉంచేందుకు ఆరంభంలోని ו ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: זִמְרִי
  choice: జిమ్రీ
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֵיתָן
  choice: ఏతాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: הֵימָן
  choice: హేమాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: כַלְכֹּל
  choice: కల్కోలు
  rationale: హీబ్రూ హల్లులను దగ్గరగా ప్రతిబింబిస్తూ, తెలుగులో సహజంగా పలికే రూపాన్ని వాడాం.
- source_word: דָרַע
  choice: దారా
  rationale: ఈ వచనంలోని మసొరా పాఠం ‘దారా’ అని ఉంది; సమాంతర వచనంతో సమన్వయం చేయకుండా మూలపాఠాన్నే అనుసరించాం.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: మొత్తం ఐదుగురు
  rationale: అక్షరార్థంగా ‘వారందరూ ఐదుగురు’; వ్యక్తుల సంఖ్యను తెలిపే సహజమైన తెలుగు రూపంగా ‘మొత్తం ఐదుగురు’ అని ఇచ్చాం.
