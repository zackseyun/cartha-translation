translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైనప్పటికీ గౌరవప్రదమైన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, రెండు సమాంతర వంశవాక్యాలను సహజ తెలుగు నామవాచక వాక్యాలుగా ఇచ్చాం.
