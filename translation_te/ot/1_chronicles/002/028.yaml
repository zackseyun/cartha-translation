source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי אוֹנָ֖ם שַׁמַּ֣י וְ/יָדָ֑ע וּ/בְנֵ֣י שַׁמַּ֔י נָדָ֖ב וַ/אֲבִישֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: te
  text: ఓనాము కుమారులు షమ్మయి, యాదా. షమ్మయి కుమారులు నాదాబు, అబీషూరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కుమారులు ...
  rationale: వంశావళి సూత్రంలో היה సాధారణంగా సంబంధాన్ని తెలిపే అనుసంధాన క్రియగా పనిచేస్తుంది. తెలుగులో నామవాచక వాక్యానికి ‘ఉన్నారు/అయ్యారు’ చేర్చకుండా చెప్పడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఇక్కడ తక్షణ పురుష సంతానం సూచించబడుతోంది; అందువల్ల విస్తృతార్థకమైన ‘సంతానం’ కంటే ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: אוֹנָם
  choice: ఓనాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שַׁמַּי
  choice: షమ్మయి
  rationale: వ్యక్తినామాన్ని అనువదించకుండా లిప్యంతరీకరించి, రెండు సందర్భాల్లోనూ ఒకే రూపాన్ని ఉంచాం.
- source_word: יָדָע
  choice: యాదా
  rationale: హీబ్రూ స్వరపాఠం yāḏāʿను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: וּבְנֵי
  choice: షమ్మయి కుమారులు
  rationale: సంయోజకమైన וְ తదుపరి వంశశాఖను కలుపుతుంది. తెలుగులో కొత్త వాక్యంగా చెప్పేటప్పుడు ‘మరియు’ లేకుండానే సంబంధం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: נָדָב
  choice: నాదాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిప్యంతరీకరణ సంప్రదాయానికి అనుగుణంగా ఇచ్చాం.
- source_word: אֲבִישׁוּר
  choice: అబీషూరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
