translation:
  language: te
  text: కాలేబు ఉపపత్నియైన మయకా షెబెరును, తిర్హనాను కన్నది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వంశావళి సందర్భాల్లో יָלַד అనే క్రియను విస్తృతమైన అర్థంలో తీసుకుంటే, “కాలేబు ఉపపత్నియైన మయకా షెబెరును, తిర్హనాను సంతానంగా కలిగించింది” అని అనువదించవచ్చు. అయితే ఇక్కడ కర్త స్త్రీ అని స్పష్టంగా ఉన్నందున ప్రధాన పాఠంలో “కన్నది” అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: ఉపపత్ని
  rationale: గుర్తింపు పొందినప్పటికీ భార్యకన్నా దిగువ స్థానం గల వైవాహిక/లైంగిక బంధంలోని స్త్రీని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఉపపత్ని’ సంక్షిప్తమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: מַעֲכָה
  choice: మయకా
  rationale: హీబ్రూ వ్యక్తి పేరును దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: కన్నది
  rationale: వంశావళుల్లో ఈ క్రియకు విస్తృతంగా ‘కనడం/ఉత్పత్తి చేయడం’ అనే భావం ఉండవచ్చు; అయితే ఇక్కడ కర్త స్త్రీ అయిన మయకా కాబట్టి ‘కన్నది’ సహజమైన, లింగానికి తగిన అనువాదం.
- source_word: שֶׁבֶר
  choice: షెబెరు
  rationale: హీబ్రూ వ్యక్తి పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וְאֶת
  choice: -ను … -ను
  rationale: וְ సంయోజకాన్ని రెండు కర్మలకు తెలుగు సముచ్చయ నిర్మాణంతో తెలియజేశాం; אֶת అనే కర్మ సూచికను తెలుగు ద్వితీయావిభక్తి ‘ను’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: תִּרְחֲנָה
  choice: తిర్హనా
  rationale: హీబ్రూ వ్యక్తి పేరును దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
