revisions:
- from: 'కర్మీ కుమారులు: ఇశ్రాయేలును కలవరపెట్టిన ఆకారు[a]; ఇతడు నాశనం చేయడానికి అంకితం చేయబడిన వస్తువుల విషయంలో విశ్వాసఘాతుకంగా ప్రవర్తించాడు[b].'
  to: 'కర్మీ కుమారులు: ఇశ్రాయేలును కలవరపెట్టినవాడైన ఆకారు[a]; ఇతడు నాశనానికి ప్రత్యేకపరచబడిన దాని విషయంలో అవిశ్వాసంగా ప్రవర్తించాడు[b].'
  rationale: The revision restores the singular form of the Hebrew בַּחֵרֶם in the main text, leaving any possible collective sense to the footnote. It also recasts “troubler of Israel” as an explicit appositional designation and uses a natural Telugu equivalent for the breach-of-faith sense of מעל. The distinct Chronicles form “ఆకారు” and its explanatory footnote are retained.
