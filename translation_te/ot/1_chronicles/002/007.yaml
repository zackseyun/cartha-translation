id: 1CH.2.7
reference: 1 Chronicles 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: te
  text: 'కర్మీ కుమారులు: ఇశ్రాయేలును కలవరపెట్టినవాడైన ఆకారు[a]; ఇతడు నాశనానికి ప్రత్యేకపరచబడిన దాని విషయంలో అవిశ్వాసంగా ప్రవర్తించాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాను.’ యెహోషువ 7లో ఈ పేరు ఆ రూపంలో ఉంది. ఇక్కడ దినవృత్తాంతముల గ్రంథం ‘ఆకారు’ అనే రూపాన్ని వాడింది; అది ‘కలవరపెట్టినవాడు’ అనే తరువాతి హీబ్రూ పదంతో శబ్దసామ్యాన్ని కలిగిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ పదం దేవునికి ప్రత్యేకపరచబడి, నిషేధం కింద నాశనానికి అప్పగించబడినదాన్ని సూచిస్తుంది. హీబ్రూలో ఇది ఏకవచన రూపంలో ఉంది; సందర్భంలో అది సమష్టి భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: కర్మీ కుమారులు
  rationale: వంశావళిలోని సమాస బహువచన రూపాన్ని సహజమైన తెలుగు వంశావళి శైలిలో నిలిపింది; తరువాత ఒక్క వ్యక్తి మాత్రమే పేర్కొనబడినప్పటికీ మూలంలోని బహువచనాన్ని మార్చలేదు.
- source_word: עָכָר
  choice: ఆకారు
  rationale: యెహోషువ 7లోని సుపరిచితమైన ‘ఆకాను’ రూపంతో సమన్వయపరచకుండా, దినవృత్తాంతముల గ్రంథంలోని עָכָר రూపాన్నే లిప్యంతరీకరించింది.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: ఇశ్రాయేలును కలవరపెట్టిన
  rationale: ఈ కర్తరి అసమాపక క్రియారూపం ఆకారును విశేషిస్తుంది. ‘ఆకారు’ అనే పేరుతో ఉన్న హీబ్రూ శబ్దక్రీడ తెలుగులో పూర్తిగా పునరుత్పత్తి కానప్పటికీ, ‘కలవరపెట్టిన’ అనే పదం దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מָעַל
  choice: విశ్వాసఘాతుకంగా ప్రవర్తించాడు
  rationale: పవిత్రమైనదాని విషయంలో నమ్మకాన్ని భంగపరచడం లేదా ద్రోహంగా వ్యవహరించడం అనే పదంలోని నైతిక, ఆధ్యాత్మిక బలాన్ని నిలుపుతుంది.
- source_word: בַּחֵרֶם
  choice: నాశనం చేయడానికి అంకితం చేయబడిన వస్తువుల విషయంలో
  rationale: חֵרֶם అనే పదంలో ఉన్న దేవునికి ప్రత్యేకపరచడం, నిషేధించడం, నాశనానికి అప్పగించడం అనే భావాలను సందర్భానుసారంగా స్పష్టం చేస్తుంది. హీబ్రూలో ఏకవచనంగా ఉన్నా, యెహోషువ 7 సందర్భంలో ఇది సమష్టిగా వస్తువులను సూచిస్తుంది.
theological_decisions:
- issue: חֵרֶם పదంలో పవిత్రార్పణ, నిషేధం, నాశనం అనే భావాల సంబంధం
  choice: నాశనం చేయడానికి అంకితం చేయబడిన వస్తువులు
  alternative: నిషిద్ధమైనది; శాపిత వస్తువులు
  rationale: మూలపదాన్ని కేవలం ‘శాపితమైనది’గా చూపి దాని అర్పణ భావాన్ని కోల్పోకుండా, అలాగే కేవలం ‘అంకితం చేయబడినది’గా చూపి నాశన తీర్పును మరుగుపరచకుండా రెండు అంశాలనూ ప్రధాన పాఠ్యంలో నిలిపింది.
- issue: దినవృత్తాంతములలోని עָכָר పేరును యెహోషువలోని עָכָןతో సమన్వయపరచాలా
  choice: ఆకారు
  alternative: ఆకాను
  rationale: గ్రంథకర్త ఉపయోగించిన భిన్న రూపాన్ని నిలిపి, దాని వెంట వచ్చే ‘కలవరపెట్టిన’ అనే పదంతో ఉన్న ఉద్దేశపూర్వక సంబంధాన్ని సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. మూలంలోని బహువచనం, పేరులోని భిన్న రూపం, חֵרֶם పదంలోని సంక్లిష్ట భావం నిలుపబడ్డాయి; హీబ్రూ శబ్దక్రీడను పాదటిప్పణిలో వివరించాం.
