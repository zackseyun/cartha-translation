  register: సంక్షిప్తమైన వంశావళి శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా అందించాం. పేర్ల జాబితాలో హీబ్రూ సంధానాన్ని తెలుగు విరామచిహ్నం ద్వారా సహజంగా వ్యక్తం చేశాం.
