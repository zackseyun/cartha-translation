lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణ బహువచనం ఇక్కడ పెరెసు ప్రత్యక్ష కుమారులను సూచిస్తోంది; అందువల్ల ‘కుమారులు’ సహజమైన, నిర్దిష్టమైన అనువాదం.
- source_word: פֶרֶץ
  choice: పెరెసు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חֶצְרוֹן
  choice: హెస్రోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా పలికేలా, మూలరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְחָמוּל
  choice: హామూలు
  rationale: וְ సంధానం జాబితా విరామచిహ్నంతో సహజంగా వ్యక్తమవుతుంది; חָמוּל వ్యక్తినామాన్ని ‘హామూలు’గా లిప్యంతరీకరించాం.
