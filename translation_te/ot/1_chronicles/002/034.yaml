translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సందర్భానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. పాదటిప్పణి సూచికను అది వివరిస్తున్న ‘బానిస’ పదంపైనే ఉంచాం.
