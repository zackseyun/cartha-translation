source:
  edition: WLC
  text: וְ/לֹֽא הָיָ֧ה לְ/שֵׁשָׁ֛ן בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וּ/לְ/שֵׁשָׁ֛ן עֶ֥בֶד מִצְרִ֖י וּ/שְׁמ֥/וֹ יַרְחָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: te
  text: షేషానుకు కుమారులు లేరు, కుమార్తెలు మాత్రమే ఉన్నారు. షేషానుకు యర్హా అనే పేరుగల ఐగుప్తీయుడైన బానిస[a] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుడు.’ హీబ్రూ పదం עֶבֶד సేవకుడిని గానీ బానిసను గానీ సూచించవచ్చు; ఇక్కడ బానిసత్వ భావాన్ని నిలుపడానికి ‘బానిస’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: షేషానుకు ... ఉన్నారు/ఉన్నాడు
  rationale: హీబ్రూ స్వామ్యార్థక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘షేషానుకు ... ఉన్నారు/ఉన్నాడు’ అని వ్యక్తం చేశాం.
- source_word: בָּנִים
  choice: కుమారులు
  rationale: తరువాత వచ్చే ‘కుమార్తెలు’ అనే పదంతో స్పష్టమైన లింగ వ్యత్యాసం ఉన్నందున సాధారణార్థకమైన ‘పిల్లలు’ కాకుండా ‘కుమారులు’ అని అనువదించాం.
- source_word: כִּי אִם
  choice: మాత్రమే
  rationale: నిరాకరణ తరువాత ఈ పదబంధం ‘తప్ప/మాత్రమే’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘కుమార్తెలు మాత్రమే’ సహజంగా ఉంది.
- source_word: בָּנוֹת
  choice: కుమార్తెలు
  rationale: మూలంలోని కుమారులు–కుమార్తెలు వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: עֶבֶד
  choice: బానిస
  rationale: ఈ పదం సేవకుడిని లేదా బానిసను సూచించగలిగినా, అధీన బంధస్థితిని మృదువుచేయకుండా చూపడానికి ప్రధాన పాఠంలో ‘బానిస’ను ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מִצְרִי
  choice: ఐగుప్తీయుడైన
  rationale: ఆ వ్యక్తి ఐగుప్తు జాతీయ/జాతి మూలాన్ని తెలియజేసే విశేషణాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: וּשְׁמוֹ
  choice: అనే పేరుగల
  rationale: అక్షరార్థంగా ‘అతని పేరు’ అయినప్పటికీ, తెలుగు వాక్య నిర్మాణంలో ‘యర్హా అనే పేరుగల’ అనేది అదే సమాచారాన్ని సహజంగా అందిస్తుంది.
- source_word: יַרְחָע
  choice: యర్హా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
