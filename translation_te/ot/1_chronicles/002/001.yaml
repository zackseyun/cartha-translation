id: 1CH.2.1
reference: 1 Chronicles 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֖לֶּה בְּנֵ֣י יִשְׂרָאֵ֑ל רְאוּבֵ֤ן שִׁמְעוֹן֙ לֵוִ֣י וִ/יהוּדָ֔ה יִשָׂשכָ֖ר וּ/זְבֻלֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులు వీరు: రూబేను, షిమ్యోను, లేవి, యూదా, ఇశ్శాఖారు, జెబూలూను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: వ్యక్తుల జాబితాను పరిచయం చేసే బహువచన సూచక సర్వనామం; తెలుగులో ‘వీరు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇక్కడ ఇశ్రాయేలు యొక్క పురుష సంతానాన్ని పేరుపేరునా పేర్కొంటున్నందున ‘పిల్లలు’ లేదా ‘వంశస్థులు’ కంటే ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ మూలంలోని వ్యక్తినామాన్ని నిలుపుతూ, తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది; ‘యాకోబు’గా వ్యాఖ్యానించలేదు.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ ఉచ్చారణకు సమీపంగా ఉండే, తెలుగులో చదవదగిన లిప్యంతరీకరణ.
- source_word: לֵוִי
  choice: లేవి
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וִיהוּדָה
  choice: యూదా
  rationale: వ్యక్తినామాన్ని సహజమైన తెలుగు జాబితా నిర్మాణంలో ఇచ్చాం; హీబ్రూలోని వావ్‌ను ప్రతి చోట విడిగా ‘మరియు’గా చూపడం తెలుగులో అసహజం.
- source_word: יִשָׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ పేరుకు సమీపమైన, తెలుగు బైబిలు పాఠకులకు గుర్తించదగిన రూపం.
- source_word: וּזְבֻלוּן
  choice: జెబూలూను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో చదవదగిన విధంగా లిప్యంతరీకరించాం; జాబితా చివరి సంధిని విరామచిహ్నంతో సహజంగా తెలిపాం.
