translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శీర్షికకు తగిన సంక్షిప్త, గంభీర శైలి. వ్యక్తినామాలు తెలుగు బైబిలు వాడుకను మరియు హీబ్రూ రూపాన్ని సమతుల్యం చేస్తాయి.
