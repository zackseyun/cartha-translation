lexical_decisions:
- source_word: נְתַנְאֵל
  choice: నెతనయేలు
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הָרְבִיעִי
  choice: నాలుగోవాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న క్రమసంఖ్య వంశావళిలో జననక్రమాన్ని సూచిస్తోంది; తెలుగులో సహజమైన పుంలింగ ఏకవచన రూపాన్ని వాడాం.
- source_word: רַדַּי
  choice: రద్దయి
  rationale: వ్యక్తి పేరును హీబ్రూ వ్యంజన ద్విత్వం, చివరి ద్విస్వర ధ్వనిని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: הַחֲמִישִׁי
  choice: ఐదోవాడు
  rationale: ముందటి క్రమసంఖ్యకు సమాంతరంగా, వంశావళిలోని వరుసను సహజ తెలుగులో తెలిపాం.
