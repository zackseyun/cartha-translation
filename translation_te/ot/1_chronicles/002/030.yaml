source:
  edition: WLC
  text: וּ/בְנֵ֥י נָדָ֖ב סֶ֣לֶד וְ/אַפָּ֑יִם וַ/יָּ֥מָת סֶ֖לֶד לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: te
  text: 'నాదాబు కుమారులు: సెలెదు, అప్పయిము. సెలెదు కుమారులు లేకుండానే చనిపోయాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది בֵּן పదానికి నిర్మిత బహువచన రూపం. ఇది వంశావళి వివరాన్ని పరిచయం చేస్తుంది; ప్రారంభంలోని וּ సంధిని తెలుగులో విడిగా చూపకపోవడం సహజం.
- source_word: נָדָב
  choice: నాదాబు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: סֶלֶד
  choice: సెలెదు
  rationale: వ్యక్తి పేరు; రెండు సందర్భాల్లోనూ ఒకే విధంగా లిప్యంతరీకరించబడింది.
- source_word: וְאַפָּיִם
  choice: అప్పయీము
  rationale: సంధితో కూడిన వ్యక్తి పేరు. ఈ వంశావళి సందర్భంలో దీనిని సాధారణ నామవాచకంగా అనువదించకుండా పేరుగా లిప్యంతరీకరించడం సముచితం.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מוּת క్రియ యొక్క వయ్యిక్టోల్ రూపం తరువాతి సంఘటనను తెలియజేస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘చనిపోయాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֹא בָנִים
  choice: కుమారులు లేకుండానే
  rationale: హీబ్రూలో అక్షరార్థంగా ‘కుమారులు లేరు.’ మరణాన్ని తెలిపే క్రియతో కలిపి ‘కుమారులు లేకుండానే చనిపోయాడు’ అనడం సహజం; ‘పిల్లలు లేకుండా’ అంటే కుమార్తెలనూ చేర్చి మూలపాఠం కంటే విస్తృతమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని వ్యక్తి పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
