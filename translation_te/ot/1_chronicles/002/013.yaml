translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి ఉపయోగించబడింది. మూలంలోని క్రమసంఖ్యలు మరియు వ్యక్తి పేర్ల భేదం యథాతథంగా నిలుపబడ్డాయి.
