  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִישַׁ֛י הוֹלִ֥יד אֶת בְּכֹר֖/וֹ אֶת אֱלִיאָ֑ב וַ/אֲבִינָדָב֙ הַ/שֵּׁנִ֔י וְ/שִׁמְעָ֖א הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: te
  text: యెష్షయి తన మొదటి కుమారుడైన ఎలీయాబుకు, రెండవవాడైన అబీనాదాబుకు, మూడవవాడైన షిమ్యాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישַׁי
  choice: యెష్షయి
  rationale: వంశావళిలో וְ సాధారణ అనుసంధానార్థకంగా ఉంది; తెలుగులో ముందున్న వాక్యంతో సహజ అనుసంధానం సందర్భం ద్వారానే స్పష్టమవుతుంది. אִישַׁי అనే పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా ‘యెష్షయి’గా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: కనెను
  rationale: ילד ధాతువు హిఫీల్ రూపం వంశావళి సందర్భంలో ‘తండ్రి అయ్యాడు/కన్నాడు’ అనే భావం ఇస్తుంది. ‘కనెను’ సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి ప్రయోగం; ఇక్కడ పురుషుడే కర్త అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: తన మొదటి కుమారుడైన ఏలీయాబును
  rationale: בְּכֹרוֹ అంటే ‘అతని మొదటివాడు/మొదటి కుమారుడు.’ తెలుగులో వ్యక్తి పేరు ముందు ‘కుమారుడు’ను స్పష్టంగా చేర్చడం సహజం; אֶת కర్మ సూచికను ‘ను’ విభక్తితో వ్యక్తపరచాం.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: రెండవవాడైన అబీనాదాబును
  rationale: הַשֵּׁנִי క్రమసంఖ్యను ‘రెండవవాడు’గా నేరుగా నిలిపి, జాబితాలో పునరుక్త క్రియను చేర్చకుండా మూలంలోని సంక్షిప్తతను కాపాడాం.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: మూడవవాడైన షిమ్యాను
  rationale: שִׁמְעָא అనే దినవృత్తాంతముల పాఠరూపాన్ని ‘షిమ్యా’గా లిప్యంతరీకరించాం; సమూయేలు గ్రంథంలోని సమాంతర రూపాన్ని దీనికి బదులుగా పెట్టలేదు. הַשְּׁלִישִׁיను ‘మూడవవాడు’గా అనువదించాం.
