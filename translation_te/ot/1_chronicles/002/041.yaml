translation:
  language: te
  text: షల్లూము యెకమ్యాకు తండ్రి అయ్యాడు, మరియు యెకమ్యా ఎలీషామాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించబడింది.
- source_word: הוֹלִיד / הֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనెను/కన్నాడు’ అనే విస్తృత భావం కంటే ప్రత్యేకంగా తండ్రితనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉండేందుకు ‘తండ్రి అయ్యాడు’ అని అనువదించబడింది.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: యెకమ్యా / యెకమ్యా
  rationale: వ్యక్తి పేరు హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది. రెండవ సందర్భంలోని וְ భావం రెండు వాక్యభాగాల అనుసంధానంతో ప్రతిబింబించబడింది; మూలంలోని పేరు పునరుక్తి నిలుపబడింది.
- source_word: אֱלִישָׁמָע
  choice: ఎలీషామా
  rationale: వ్యక్తి పేరు హీబ్రూ ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
theological_decisions: []
