  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శైలిలో సంక్షిప్తతను నిలుపుతూ, ప్రాచీనంగా వినిపించే ‘కనెను’కు బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘తండ్రి అయ్యాడు’ అనే నిర్మాణం వాడబడింది.
