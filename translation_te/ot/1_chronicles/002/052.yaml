source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: te
  text: 'కిర్యత్-యెయారీము తండ్రి[a] అయిన షోబాలు కుమారులు: హరోయెహు[b], మెనూహోతీయులలో సగభాగం[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కిర్యత్-యెయారీము స్థాపకుడు.’ వంశావళుల్లో ‘తండ్రి’ అనే మాట ఒక పట్టణంతో సంబంధమున్న పూర్వికుణ్ణి, స్థాపకుణ్ణి లేదా ప్రధాన నాయకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘హరోయెహు’ అనే వ్యక్తినామాన్ని కొన్ని సంప్రదాయాలు ‘రెయాయా’ అని అందిస్తాయి.
    reason: alternative_reading
  - marker: c
    text: హెబ్రీయులో అక్షరార్థంగా, ‘మెనూహోతు యొక్క సగం.’ ఇది మెనూహోతు అనే స్థలానికి చెందిన సగభాగాన్నో, అక్కడి నివాసులలో లేదా వంశశాఖలో సగభాగాన్నో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: షోబాలు కుమారులు
  rationale: ‘షోబాలుకు కుమారులు ఉన్నారు’ అనే హెబ్రీయ భాషాప్రయోగాన్ని సహజమైన తెలుగు వంశావళి శైలిలో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము తండ్రి
  rationale: మూలంలోని ‘తండ్రి’ అనే పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది ఒక పట్టణానికి సంబంధించిన పూర్వికుడు, స్థాపకుడు లేదా నాయకుడు అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చని పాదటీకలో తెలిపాం.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము
  rationale: ఇది స్థలనామం కాబట్టి దాని అర్థాన్ని అనువదించకుండా హెబ్రీయ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הָרֹאֶה
  choice: హరోయెహు
  rationale: ఈ వంశావళి సందర్భంలో దీనిని వ్యక్తినామంగా గ్రహించి, ‘దర్శకుడు’ అని అర్థానువాదం చేయకుండా హెబ్రీయ రూపాన్ని లిప్యంతరీకరించాం; ప్రత్యామ్నాయ నామరూపాన్ని పాదటీకలో ఇచ్చాం.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: మెనూహోతీయులలో సగంమంది
  rationale: అక్షరార్థంగా ‘మెనూహోతులో సగం’ అనే అస్పష్టమైన పదబంధం ఇక్కడ ఒక ప్రాంతానికి సంబంధించిన ప్రజల లేదా వంశశాఖలో సగభాగాన్ని సూచించే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో సహజమైన జనసమూహ భావాన్ని ఇచ్చి, స్థల లేదా వంశ అర్థాల మధ్యనున్న అనిశ్చితిని పాదటీకలో నిలిపాం.
