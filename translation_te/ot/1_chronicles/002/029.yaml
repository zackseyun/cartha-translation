lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת אֲבִישׁוּר אֲבִיהָיִל
  choice: అబీషూరు భార్య పేరు అబీహయిలు
  rationale: హీబ్రూ నామవాచక వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో అందించింది; వ్యక్తుల పేర్లను మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: וַתֵּלֶד לוֹ
  choice: ఆమె అతనికి ... కనింది
  rationale: לוֹ లోని ‘అతనికి’ అనే సంబంధాన్ని స్పష్టంగా నిలుపుతూ, హీబ్రూ క్రియకు సహజమైన తెలుగు రూపాన్ని ఎంచుకుంది.
- source_word: אֶת־אַחְבָּן וְאֶת־מוֹלִיד
  choice: అహ్బాను, మోలీదును
  rationale: ప్రత్యక్ష కర్మలను తెలుగు విభక్తులతో సహజంగా చూపిస్తూ పేర్లను లిప్యంతరీకరించింది.
