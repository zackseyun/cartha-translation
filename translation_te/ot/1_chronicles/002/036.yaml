translation_notes:
  register: ఆధునిక పాఠకులకు అర్థమయ్యేలా, అయితే వంశావళికి తగిన గంభీరమైన బైబిలు శైలిలో సంక్షిప్తంగా రూపొందించాం. పేర్లకు తెలుగు బైబిలు లిప్యంతరణ సంప్రదాయానికి అనుగుణంగా అంత్య స్వరాలు చేర్చాం.
