- from: అత్తయి నాతానును కనెను; నాతాను జాబాదును కనెను.
  to: అత్తయి నాతానుకు తండ్రి అయ్యాడు; నాతాను జాబాదుకు తండ్రి అయ్యాడు.
  rationale: Replaced the ambiguous, childbirth-associated «కనెను» with «తండ్రి అయ్యాడు», which directly conveys the Hebrew genealogical Hiphil sense for male subjects while retaining the concise parallel structure and all names.
