translation:
  language: te
  text: అత్తయి నాతానుకు తండ్రి అయ్యాడు; నాతాను జాబాదుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: అత్తయి
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ఆరంభ וְ వంశావళి ప్రవాహాన్ని కొనసాగించే సంధి కావడంతో ఈ స్వతంత్ర వచనంలో విడిగా చూపలేదు.
- source_word: הֹלִיד
  choice: కనెను
  rationale: ילד హిఫిల్ రూపం వంశావళి సందర్భంలో సంతానాన్ని కనడం/కలగజేయడం అనే భావం ఇస్తుంది. తెలుగు బైబిలు వంశావళి శైలికి తగిన సంక్షిప్తమైన ‘కనెను’ను ఎంచుకున్నాం; ఇక్కడ పురుషుడు కర్తగా ఉండడం వల్ల ఇది ‘తండ్రి అయ్యెను’ అనే అర్థంలో గ్రహించబడుతుంది.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు, కర్మ విభక్తి ద్వారా సంబంధం వ్యక్తమవుతుంది.
- source_word: נָתָן
  choice: నాతాను
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ/נָתָן
  choice: నాతాను
  rationale: పేరును లిప్యంతరీకరించాం. రెండు సమాంతర వంశావళి వాక్యాలను తెలుగు సహజ శైలిలో అర్ధవిరామంతో కలిపినందున וְ ను ప్రత్యేకంగా ‘మరియు’ అని చూపలేదు.
- source_word: הוֹלִיד
  choice: కనెను
  rationale: ముందటి సమాన క్రియతో ఏకరూపతను కాపాడుతూ వంశావళి భావాన్ని సంక్షిప్తంగా తెలిపాం.
- source_word: זָבָד
  choice: జాబాదు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
