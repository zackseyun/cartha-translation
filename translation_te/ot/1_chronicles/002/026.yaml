  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: te
  text: యెరహ్మెయేలుకు మరొక భార్య కూడా ఉండేది. ఆమె పేరు అతారా; ఆమె ఓనాము తల్లి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: యెరహ్మెయేలుకు ... ఉండేది
  rationale: היה అనే క్రియ ל ఉపసర్గతో కలిసి ఇక్కడ ఒక వ్యక్తికి భార్య ఉండడాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘యెరహ్మెయేలుకు ... ఉండేది’ మూలంలోని అస్తిత్వ-స్వామ్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אִשָּׁה אַחֶרֶת
  choice: మరొక భార్య కూడా
  rationale: אִשָּׁה వంశావళి సందర్భంలో ‘భార్య’; אַחֶרֶת ముందుగా పేర్కొన్న భార్యకు అదనంగా మరొకరిని సూచిస్తుంది. ‘కూడా’ అనుసంధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְרַחְמְאֵל
  choice: యెరహ్మెయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, విభక్తి ప్రయోగాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּשְׁמָהּ
  choice: ఆమె పేరు
  rationale: హీబ్రూలోని సాధారణ నామకరణ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; వాక్యంలోని సమన్వయం విరామచిహ్నం ద్వారా నిలిచింది.
- source_word: עֲטָרָה
  choice: అతారా
  rationale: వ్యక్తినామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הִיא אֵם
  choice: ఆమె ... తల్లి
  rationale: స్వతంత్ర సర్వనామమైన הִיא ఇచ్చే స్పష్టీకరణను ‘ఆమె’ నిలుపుతుంది; אֵם కు నేరుగా ‘తల్లి’ వాడాం.
- source_word: אוֹנָם
  choice: ఓనాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
