translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి ప్రకటనకు తగిన సరళమైన మరియు గౌరవప్రదమైన శైలి. మూలంలోని రెండు సమన్విత ప్రకటనలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం; భావపరమైన సమాచారం ఏదీ జోడించలేదు లేదా తొలగించలేదు.
