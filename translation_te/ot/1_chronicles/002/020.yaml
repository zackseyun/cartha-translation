translation:
  language: te
  text: హూరు ఊరీకి తండ్రి అయ్యాడు, మరియు ఊరీ బెసలేలుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: హూరు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో సహజంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం పురుష వంశ సంబంధాన్ని తెలియజేస్తుంది. ప్రాచీనంగా వినిపించే ‘కనెను’ కంటే ఇది సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు. విభక్తి ప్రత్యయంతో దాని వ్యాకరణ పాత్ర వ్యక్తమైంది.
- source_word: אוּרִי
  choice: ఊరీ
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וְ
  choice: ;
  rationale: రెండు వరుస వంశావళి వాక్యాలను తెలుగులో సహజంగా కలపడానికి అర్థవిరామం వాడాం; సంధాన భావం నిలిచింది.
- source_word: בְּצַלְאֵל
  choice: బెసలేలు
  rationale: వ్యక్తి పేరు; తెలుగు బైబిలు పాఠకులకు సులభంగా పలికేలా, హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలిపి, సాధారణ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా అనువదించాం. మూలంలోని రెండు సమాంతర వాక్యాల నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం.
