source:
  edition: WLC
  text: בְּנֵ֣י שַׂלְמָ֗א בֵּ֥ית לֶ֨חֶם֙ וּ/נְט֣וֹפָתִ֔י עַטְר֖וֹת בֵּ֣ית יוֹאָ֑ב וַ/חֲצִ֥י הַ/מָּנַחְתִּ֖י הַ/צָּרְעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: te
  text: 'సల్మా కుమారులు: బేత్లెహేము, నెటోఫాతీయులు, అత్రోత్-బేత్-యోవాబు, మనహాతీయుల్లో సగం[a], సొరాతీయులు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మెనుహోతీయులు.” ఈ హీబ్రూ జాతివాచకం ఏ స్థలనామంతో సంబంధమున్నదో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సొరా ప్రాంత ప్రజలు,” అంటే సొరాతో సంబంధమున్నవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళుల్లో ఈ పదం ప్రత్యక్ష కుమారులతో పాటు వంశస్థులను లేదా వంశశాఖలను కూడా సూచించవచ్చు. మూలంలోని వంశావళి నుడికారాన్ని నిలుపుతూ సహజమైన తెలుగు రూపంగా ‘కుమారులు’ వాడబడింది.
- source_word: שַׂלְמָא
  choice: సల్మా
  rationale: హీబ్రూ వ్యంజన రూపానికి దగ్గరగా వ్యక్తి పేరును లిప్యంతరీకరించింది.
- source_word: בֵּית לֶחֶם
  choice: బేత్లెహేము
  rationale: స్థిరంగా వాడుకలో ఉన్న స్థలనామ రూపం. ఈ జాబితాలో ఇది ఆ ప్రాంతంతో ముడిపడిన వంశం లేదా ప్రజాసమూహాన్ని కూడా సూచించవచ్చు; ఆ ద్వంద్వార్థాన్ని వివరించకుండా స్థలనామంగానే ఉంచింది.
- source_word: וּנְטוֹפָתִי
  choice: నెటోఫాతీయులు
  rationale: నెటోఫాతో సంబంధమున్న ప్రజలను లేదా వంశసమూహాన్ని సూచించే జాతివాచక రూపం కాబట్టి తెలుగులో బహువచనంగా ఇచ్చింది.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: అత్రోత్-బేత్-యోవాబు
  rationale: పదాలను విడిగా అనువదించడం కంటే, వంశావళి సందర్భానికి సరిపోయే సంయుక్త స్థల/వంశనామంగా లిప్యంతరీకరించింది.
- source_word: וַחֲצִי
  choice: సగం
  rationale: ‘మరియు సగం’ అనే మూల భావాన్ని జాబితా నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַמָּנַחְתִּי
  choice: మనహాతీయులు
  rationale: మనహతుతో సంబంధమున్న వంశం లేదా ప్రజాసమూహాన్ని సూచించే జాతివాచకంగా తీసుకుంది. ఖచ్చితమైన స్థలనామ సంబంధం అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: הַצָּרְעִי
  choice: జోరాతీయులు
  rationale: జోరాతో సంబంధమున్న ప్రజలను సూచించే జాతివాచక రూపంగా అనువదించింది; స్థలనామ సంబంధాన్ని మరింత స్పష్టంగా చెప్పే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
