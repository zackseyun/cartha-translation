translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. పేర్లు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
