  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: te
  text: హెస్రోను కాలేబు-ఎఫ్రాతాలో[a] చనిపోయిన తరువాత, హెస్రోను భార్య అబీయా అతనికి తెకోవకు తండ్రియైన[b] అష్హూరును కన్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కాలేబు-ఎఫ్రాతాలో” అనే హెబ్రీ పదబంధం క్లిష్టమైనది. ఇది ఒక స్థలాన్ని లేదా వంశపరమైన పేరును సూచించవచ్చు; సంప్రదాయంగా దీనిని “కాలేబు-ఎఫ్రాతా” అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా “తెకోవ స్థాపకుడైన.” వంశావళుల్లో “తండ్రి” అనే మాట కేవలం ప్రత్యక్ష జీవసంబంధ తండ్రినే కాకుండా, ఒక నివాస స్థలానికి లేదా వంశానికి స్థాపకుణ్ణి లేదా ప్రముఖ పూర్వికుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: హెస్రోను ... చనిపోయిన తరువాత
  rationale: אַחַר‌తో కూడిన מוֹת అనే క్రియానామ రూపానికి సహజమైన కాలార్థాన్ని ఇస్తూ, ఆధునిక తెలుగులో స్పష్టంగా అనువదించబడింది.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: కాలేబు-ఎఫ్రాతాలో
  rationale: בְּ అనే ఉపసర్గను స్థలార్థకంగా తీసుకున్నాం. క్లిష్టమైన ఈ హెబ్రీ పదబంధంలోని రెండు అంశాలు ఒకే స్థల లేదా వంశపేరు కావచ్చని సూచించడానికి మధ్యగీత వాడబడింది.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: హెస్రోను భార్య అబీయా
  rationale: హెబ్రీ సంబంధబోధక నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో అందించాం; అబీయా వ్యక్తిపేరుగా లిప్యంతరీకరించబడింది.
- source_word: וַתֵּלֶד לוֹ
  choice: అతనికి ... కన్నది
  rationale: יָלַד క్రియతో ఉన్న పరోక్ష కర్మసర్వనామ భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אַשְׁחוּר
  choice: అష్హూరు
  rationale: హెబ్రీ పేరులోని שְׁחּ ధ్వనిసముదాయాన్ని, దీర్ఘాంతాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: אֲבִי תְקוֹעַ
  choice: తెకోవకు తండ్రియైన
  rationale: אָב అనే పదానికి ఉన్న ప్రాథమిక అర్థమైన ‘తండ్రి’ని ప్రధాన పాఠ్యంలో నిలిపాం; వంశావళి సందర్భంలో ‘స్థాపకుడు’ అనే విస్తృతార్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: אֲבִי అనే పదం జీవసంబంధ తండ్రిని సూచిస్తుందా, లేక ఒక పట్టణం లేదా వంశానికి స్థాపకుడిని/ముఖ్య పూర్వికుణ్ణి సూచిస్తుందా?
  choice: తండ్రియైన
  alternative: స్థాపకుడైన
  rationale: మూలపదపు ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, వంశావళుల్లో సాధ్యమైన సామాజిక లేదా స్థాపక అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను అనవసరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వ్యక్తి, స్థల పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని క్లిష్టతను పాదసూచికల ద్వారా నిలుపుకున్నాం.
