revisions:
- from: 'కిర్యత్-యారీము వంశాలు ఇవి: ఇత్రీయులు[a], పూతీయులు, షుమాతీయులు, మిష్రాయీయులు. వీరి నుండి జొర్యాతీయులు, ఎష్టాయోలీయులు ఉద్భవించారు.[b]'
  to: 'కిర్యత్-యారీము వంశాలు[a] ఇవి: యిత్రీయులు, పూతీయులు, షుమాతీయులు, మిష్రాయీయులు. ఈ వంశాల నుండి జొర్యాతీయులు, ఎష్టావోలీయులు ఉద్భవించారు.[b]'
  rationale: The revision retains the source’s list structure, its designation of Kiriath-jearim’s clans, and the deliberately broad genealogical expression “from these came.” It corrects the two less source-faithful clan-name transliterations, makes the antecedent of “from these” explicit, and places the lexical footnote at the word it actually explains.
