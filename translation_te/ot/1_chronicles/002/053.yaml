  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִשְׁפְּחוֹת֙ קִרְיַ֣ת יְעָרִ֔ים הַ/יִּתְרִי֙ וְ/הַ/פּוּתִ֔י וְ/הַ/שֻּׁמָתִ֖י וְ/הַ/מִּשְׁרָעִ֑י מֵ/אֵ֗לֶּה יָצְאוּ֙ הַ/צָּ֣רְעָתִ֔י וְ/הָ/אֶשְׁתָּ֖אֻֽלִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: te
  text: 'కిర్యత్-యారీము వంశాలు[a] ఇవి: యిత్రీయులు, పూతీయులు, షుమాతీయులు, మిష్రాయీయులు. ఈ వంశాల నుండి జొర్యాతీయులు, ఎష్టావోలీయులు ఉద్భవించారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వంశాలు’ అనే పదానికి ‘కుటుంబాలు’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ పదం వంశావళిలో విస్తృత బంధుత్వ సమూహాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థం: ‘బయలుదేరారు’; ఇక్కడ ముందుగా పేర్కొన్న వంశాల నుండి ఈ సమూహాలు వచ్చినట్లు, అంటే వాటి వంశావళి మూలాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: వంశాలు
  rationale: వంశావళి సందర్భంలో מִשְׁפָּחוֹת అణుకుటుంబాలకంటే విస్తృతమైన బంధుత్వ సమూహాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్-యారీము
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: הַיִּתְרִי
  choice: ఇత్రీయులు
  rationale: వంశం లేదా ప్రాంతంతో సంబంధాన్ని తెలిపే హీబ్రూ నామరూపంగా లిప్యంతరీకరించబడింది.
- source_word: וְהַפּוּתִי
  choice: పూతీయులు
  rationale: వంశనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וְהַשֻּׁמָתִי
  choice: షుమాతీయులు
  rationale: పూర్తి హీబ్రూ వంశనామ రూపాన్ని సాధ్యమైనంత పారదర్శకంగా నిలిపింది.
- source_word: וְהַמִּשְׁרָעִי
  choice: మిష్రాయీయులు
  rationale: హీబ్రూ వంశనామంలోని మిష్రా మూలరూపాన్ని నిలిపే లిప్యంతరీకరణ.
- source_word: מֵאֵלֶּה יָצְאוּ
  choice: వీరి నుండి ... ఉద్భవించారు
  rationale: అక్షరార్థంగా ‘వీరి నుండి బయలుదేరారు’; ఇక్కడ వంశావళి మూలం లేదా సమూహాల ఆవిర్భావాన్ని సూచిస్తున్నందున ‘ఉద్భవించారు’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: הַצָּרְעָתִי
  choice: జొర్యాతీయులు
  rationale: జొర్యా అనే స్థలంతో సంబంధమున్న సమూహాన్ని సూచించే హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: ఎష్టాయోలీయులు
  rationale: ఎష్టాయోల్ స్థలనామంతో సంబంధాన్ని నిలిపే విధంగా వంశనామం లిప్యంతరీకరించబడింది.
