translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితికి తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. వ్యక్తి/వంశ/స్థలనామాలు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; ‘వీరి నుండి’ అనే సర్వనామం ముందున్న వంశాలను సూచిస్తుంది.
