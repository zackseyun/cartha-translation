translation:
  language: te
  text: బోయజు ఓబేదుకు తండ్రి అయ్యాడు, మరియు ఓబేదు యెష్షయికి తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: బోయజు
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం; ప్రారంభ וּ సంధిని తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడానికి కారణమయ్యాడు/జన్మనిచ్చాడు’ అనే పితృత్వ భావాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా వినిపించే ‘తండ్రి అయ్యాడు’ ఆ భావాన్ని అందిస్తుంది.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు, విభక్తి ద్వారా సంబంధం వ్యక్తమవుతుంది.
- source_word: עוֹבֵד
  choice: ఓబేదు
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా వాడే బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: וְ/עוֹבֵד
  choice: ఓబేదు
  rationale: וְ రెండు వంశావళి వాక్యభాగాలను కలుపుతుంది. తెలుగులో అర్ధవిరామం ద్వారా అనుసంధానం సహజంగా వ్యక్తమవుతున్నందున ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: పునరావృతమైన వంశావళి క్రియను భావస్పష్టత, పదస్థిరత్వం కోసం మొదటి సందర్భంలాగే అనువదించాం.
- source_word: יִשָׁי
  choice: యెష్షయి
  rationale: హీబ్రూ יִשָׁי (యిషై/యిష్షయి) ధ్వనికి సమీపంగా ఉండి, తెలుగు బైబిలు పాఠకులకు పరిచితమైన సంప్రదాయ రూపాన్ని ఎంచుకున్నాం.
