translation_notes:
  register: సూటిగా, గౌరవప్రదంగా, ఆధునిక సాధారణ తెలుగులో అనువదించాం. హెబ్రీ వివాహ నుడికారాన్ని అర్థస్పష్టతతో పాటు రూపపారదర్శకత కూడా నిలిచేలా ఇచ్చాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచికల గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించడంతో, తెలుగు పాఠ్యంలో [a]ను వివాహ నుడికారానికి, [b]ను ‘ఎఫ్రాతు’ నామరూపానికి నేరుగా జోడించాం.
