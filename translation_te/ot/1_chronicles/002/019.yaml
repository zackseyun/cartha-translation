  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: te
  text: అజూబా చనిపోయింది. అప్పుడు కాలేబు ఎఫ్రాతును[b] తనకు భార్యగా తీసుకున్నాడు[a]. ఆమె అతనికి హూరును కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫ్రాతును వివాహం చేసుకున్నాడు.” హెబ్రీలో అక్షరార్థంగా “ఎఫ్రాతును తనకోసం తీసుకున్నాడు” అని ఉంది; ఇది వివాహాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: సంబంధిత నామరూపం ఇతర చోట్ల “ఎఫ్రాతా” అని కూడా వస్తుంది; ఇక్కడి హెబ్రీ పాఠ్యంలో చిన్న రూపమైన “ఎఫ్రాతు” ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: చనిపోయింది
  rationale: מות అనే సాధారణ ‘చనిపోవు’ క్రియకు ఇది సూటిగా, సహజంగా సరిపోతుంది; మూలంలో లేని మృదూక్తిని చేర్చదు.
- source_word: עֲזוּבָה
  choice: అజూబా
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּקַּח לוֹ
  choice: తనకు భార్యగా తీసుకున్నాడు
  rationale: స్త్రీని కర్మగా తీసుకున్నప్పుడు לקח వివాహాన్ని సూచించే హెబ్రీ నుడికారం. ‘భార్యగా’ అని చేర్చి భావాన్ని స్పష్టం చేస్తూనే ‘తీసుకున్నాడు’ అనే మూలరూపాన్ని నిలిపాం.
- source_word: כָלֵב
  choice: కాలేబు
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: אֶפְרָת
  choice: ఎఫ్రాతు
  rationale: ఈ వచనంలోని చిన్న రూపమైన אֶפְרָת‌ను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; సంబంధిత దీర్ఘ రూపం ‘ఎఫ్రాతా’ను ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: וַתֵּלֶד לוֹ
  choice: ఆమె అతనికి ... కనింది
  rationale: ילד క్రియ ప్రసవాన్ని, לוֹ పరోక్ష కర్మను సూచిస్తాయి. తెలుగు వంశావళి సందర్భంలో ‘అతనికి ... కనింది’ సహజంగా రెండింటినీ తెలియజేస్తుంది.
- source_word: חוּר
  choice: హూరు
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణమైన లిప్యంతరీకరణ.
