source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: te
  text: కాని గెషూరు, అరాము వారి దగ్గరనుండి యాయీరు గ్రామాలను[a], కెనాతును, దాని అనుబంధ పట్టణాలను[b] స్వాధీనం చేసుకున్నాయి—మొత్తం అరవై పట్టణాలు. ఇవన్నీ గిలాదుకు తండ్రియైన మాకీరు కుమారులవే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హవ్వోత్‌-యాయీరు’; ఈ స్థలనామానికి ‘యాయీరు గుడారపు గ్రామాలు’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దాని కుమార్తెలు’; కెనాతు చుట్టూ ఉండి దానిపై ఆధారపడిన నివాసాలను ఇది సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ‘మాకీరు కుమారులు’ అంటే ఆయన తక్షణ కుమారులే కాక వంశస్థులు లేదా వంశగోత్ర సభ్యులు అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: స్వాధీనం చేసుకున్నాయి
  rationale: భూభాగాన్ని తమ అధీనంలోకి తీసుకోవడం అనే విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; యుద్ధపరమైన సూక్ష్మార్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: גְּשׁוּר וַאֲרָם
  choice: గెషూరు, అరాము
  rationale: హీబ్రూ స్థలనామాలను అనువదించకుండా తెలుగు లిప్యంతరీకరణలో ఉంచుతుంది; ‘సిరియా’ కంటే ‘అరాము’ మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: חַוֺּת יָאִיר
  choice: యాయీరు గ్రామాలు
  rationale: స్థలనామంలోని పారదర్శకమైన పదార్థాన్ని పాఠకులకు సహజంగా అందిస్తుంది; లిప్యంతరీకృత స్థలనామాన్ని పాదసూచికలో ఉంచింది.
- source_word: מֵאִתָּם
  choice: వారి దగ్గరనుండి
  rationale: ముందు ప్రస్తావించబడిన వారి అధీనంనుండి తీసుకోవడాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: קְנָת
  choice: కెనాతు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בְּנֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: అక్షరార్థమైన ‘దాని కుమార్తెలు’ అనే ప్రాచీన నుడికారానికి ఉద్దేశమైన, ప్రధాన పట్టణంపై ఆధారపడిన చుట్టుపక్కల నివాసాలను సహజంగా తెలియజేస్తుంది.
- source_word: שִׁשִּׁים עִיר
  choice: మొత్తం అరవై పట్టణాలు
  rationale: עִיר అనే పదానికి సందర్భానుకూలమైన తెలుగు సమానార్థం; ‘మొత్తం’ లెక్క యొక్క సారాంశ స్వభావాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: తరువాతి ‘మాకీరు కుమారులు’ అనే వంశావళి వాక్యాన్ని అనుసరించి వ్యక్తులను సూచిస్తుంది; స్థలాలను సూచించే అవకాశాన్ని ప్రధాన పాఠంలో బలవంతంగా ప్రవేశపెట్టదు.
- source_word: בְּנֵי מָכִיר
  choice: మాకీరు కుమారులు
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా నిలుపుతుంది; ఇది తక్షణ కుమారులనే కాక వంశస్థులను లేదా వంశగోత్ర సభ్యులను సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: אֲבִי גִלְעָד
  choice: మాకీరు గిలాదుకు తండ్రి
  rationale: ‘తండ్రి’ అనే హీబ్రూ బంధుత్వ నుడికారాన్ని అలాగే నిలుపుతూ, వంశావళి సంబంధాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
