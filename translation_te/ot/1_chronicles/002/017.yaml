  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: te
  text: అబీగయీలు అమాశాను కన్నది; అమాశా తండ్రి ఇష్మాయేలీయుడైన యెతెరు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులు, అలాగే 2 సమూయేలు 17:25లోని సమాంతర వాక్యం, ‘ఇష్మాయేలీయుడైన యెతెరు’కు బదులుగా ‘ఇశ్రాయేలీయుడైన ఇత్రా’ అని చదువుతాయి. ఇక్కడి మసోరా పాఠం ‘ఇష్మాయేలీయుడైన యెతెరు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: కన్నది
  rationale: స్త్రీ కర్తగా ఉన్నప్పుడు కాల్ రూపంలోని ילד ‘కనడం’ అనే అర్థం ఇస్తుంది. వంశావళి సందర్భంలో ‘కన్నది’ సంక్షిప్తంగా, సహజంగా ఉండి మాతృసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת עֲמָשָׂא
  choice: అమాశాను
  rationale: אֶת నిర్దిష్ట కర్మను సూచిస్తుంది; తెలుగులో పేరుకు ‘ను’ కర్మవిభక్తి చేర్చి సహజంగా అనువదించబడింది.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: అమాశా తండ్రి
  rationale: మూలంలోని సంబంధార్థక నిర్మాణాన్ని తెలుగులో సహజమైన ‘అమాశా తండ్రి’గా ఉంచింది.
- source_word: יֶתֶר
  choice: యెతెరు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: ఇష్మాయేలీయుడైన
  rationale: నిర్దిష్ట ఉపజాతి గుర్తింపును వ్యక్తపరుస్తూ, తెలుగులో వ్యక్తిపేరుతో సహజంగా కలిసే విశేషణ రూపాన్ని ఉపయోగించింది.
