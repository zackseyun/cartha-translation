  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: te
  text: ఆమె మద్మన్నాకు తండ్రియైన షాఫును, మక్బేనాకు, గిబ్యాకు తండ్రియైన షెవాను కన్నది; కాలేబు కుమార్తె అక్సా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: ఆమె … కన్నది
  rationale: ముందటి వచనంలో ఉన్న మయకానే కొనసాగుతున్న స్త్రీ కర్తగా సూచించే హీబ్రూ స్త్రీలింగ క్రియను సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: אֲבִי
  choice: తండ్రియైన
  rationale: వంశావళి సందర్భంలో ఉన్న ‘తండ్రి’ అనే మూలార్థాన్ని నిలిపింది; ఇది ప్రత్యక్ష తండ్రిని గానీ, ఒక స్థలపు వంశస్థాపకుణ్ణి గానీ సూచించే అవకాశాన్ని అనవసరంగా పరిష్కరించలేదు.
- source_word: שַׁעַף
  choice: షయఫు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: שְׁוָא
  choice: షెవా
  rationale: మసొరేటిక్ స్వరచిహ్నాలకు అనుగుణమైన తెలుగు లిప్యంతరీకరణ.
- source_word: עַכְסָה
  choice: అక్సా
  rationale: హీబ్రూ పేరును సరళంగా, ఆధునిక తెలుగు పాఠకులకు పలకదగిన విధంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: వַתֵּלֶד క్రియ యొక్క కర్త
  choice: ముందటి వచనంలోని మయకాను సూచించే ‘ఆమె’
  alternative: షయఫు షెవాకు తండ్రి అయ్యాడు
  rationale: హీబ్రూ పాఠంలో క్రియ స్త్రీలింగ ఏకవచనం; తరువాత షయఫు, షెవా ఇద్దరూ אֵת సూచకంతో క్రియకు కర్మలుగా వస్తారు. అందువల్ల ఆంగ్ల సంప్రదింపు పాఠంలోని నిర్మాణం కాకుండా మూలపాఠపు వ్యాకరణాన్ని అనుసరించింది.
- issue: ‘తండ్రి’ అనే వంశావళి పదం పరిధి
  choice: ‘తండ్రియైన’ అని యథాతథంగా ఉంచడం
  alternative: ‘స్థాపకుడు’ లేదా ‘పూర్వికుడు’ అని స్పష్టీకరించడం
  rationale: మూలంలో వ్యక్తి-స్థలం సంబంధం ఉద్దేశించబడినా దాని ఖచ్చిత స్వభావం స్పష్టంగా లేదు; కాబట్టి అసలు పాఠంలోని భావసందిగ్ధతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన గంభీరమైన, సంక్షిప్త శైలి. మూల హీబ్రూ వాక్యనిర్మాణాన్ని స్పష్టంగా తెలియజేస్తూనే సహజమైన తెలుగు పదక్రమం వాడబడింది.
