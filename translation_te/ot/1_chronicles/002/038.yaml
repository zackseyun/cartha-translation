translation:
  language: te
  text: ఓబేదు యెహూకు తండ్రి అయ్యాడు, మరియు యెహూ అజర్యాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹבֵד
  choice: ఓబేదు
  rationale: వ్యక్తి పేరు; ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం పురుష వంశోత్పత్తిని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; పాతకాలపు ‘కనెను’ కంటే మూలంలోని పురుష సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు, విభక్తి ద్వారా దాని పని వ్యక్తమవుతుంది.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి సమీపంగా, తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించబడింది.
- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర వంశావళి వాక్యాలను కలిపే హీబ్రూ సంధిని తెలుగులో సహజంగా చూపేందుకు అర్ధవిరామం వాడబడింది; అదనపు కాలక్రమ లేదా తార్కిక భావం చేర్చలేదు.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన భాష వాడబడింది.
