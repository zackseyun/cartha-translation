  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీలోని బంధుత్వ పదాలను ప్రధాన పాఠ్యంలో సాధ్యమైనంత ప్రత్యక్షంగా ఉంచి, ‘తండ్రి’ అనే పదంలోని సందర్భానుసార విస్తృత భావాన్ని పాదటిప్పణిలో సంరక్షించాం.
