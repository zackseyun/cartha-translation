  text: אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י כָלֵ֔ב בֶּן ח֖וּר בְּכ֣וֹר אֶפְרָ֑תָה שׁוֹבָ֕ל אֲבִ֖י קִרְיַ֥ת יְעָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: te
  text: 'వీరు ఎఫ్రాతా తొలి కుమారుడైన హూరు కుమారుడైన కాలేబు కుమారులు: కిర్యత్-యారీముకు తండ్రియైన షోబాలు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కిర్యత్-యారీము స్థాపకుడు,” లేదా “కిర్యత్-యారీముతో సంబంధమున్న వంశపు పూర్వికుడు.” వంశావళి సందర్భాల్లో హెబ్రీలోని “తండ్రి” అనే పదం ఒక వంశానికి లేదా నివాసస్థలానికి సంబంధించిన స్థాపకుడిని లేదా పూర్వికుడిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: వీరు
  rationale: వంశావళి వివరాన్ని పరిచయం చేసే హెబ్రీ బహువచన సూచనను తెలుగులో సహజమైన పరిచయ సూత్రంగా అనువదించాం; గతకాల భావాన్ని వాక్య సందర్భమే తెలియజేస్తుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళుల్లో విస్తృతంగా ‘వారసులు’ అనే భావం సాధ్యమైనప్పటికీ, ఇక్కడ మూలంలోని ప్రత్యక్ష పదాన్ని నిలుపుకున్నాం.
- source_word: כָלֵב
  choice: కాలేబు
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న వ్యక్తి పేరు రూపం.
- source_word: בֶּן חוּר
  choice: హూరు కుమారుడు
  rationale: హెబ్రీ నిర్మాణంలోని ప్రత్యక్ష బంధుత్వ సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּכֹר אֶפְרָתָה
  choice: ఎఫ్రాతాకు మొదటి కుమారుడైన
  rationale: ఈ పదబంధం సహజంగా హూరును విశేషిస్తుంది; తెలుగు పదక్రమంలో ఆ అనుబంధం స్పష్టంగా ఉండేలా ముందుంచాం.
- source_word: שׁוֹבָל
  choice: షోబాలు
  rationale: వ్యక్తి పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: మూలంలోని ‘తండ్రి’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; వంశం లేదా నివాసస్థల సందర్భంలో ‘స్థాపకుడు’ లేదా ‘పూర్వికుడు’ అనే విస్తృత భావాలు ఉండవచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్-యారీము
  rationale: స్థలపేరును అర్థానువాదం చేయకుండా తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
