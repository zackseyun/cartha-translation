  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, పాతబడిన ‘కనెను’ వంటి రూపానికి బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘తండ్రి అయ్యాడు’ అనే ప్రయోగం వాడబడింది.
