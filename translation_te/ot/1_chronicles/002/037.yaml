  text: Zabad fathered Ephlal, and Ephlal fathered Obed.
translation:
  language: te
  text: జాబాదు ఎఫ్లాలుకు తండ్రి అయ్యాడు, మరియు ఎఫ్లాలు ఓబేదుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: జాబాదు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే పురుష వంశసంబంధ అర్థాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో విభక్తి నిర్మాణం ద్వారా భావం వ్యక్తమవుతుంది.
- source_word: אֶפְלָל
  choice: ఎఫ్లాలు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర వంశావళి వాక్యాలను కలిపే హీబ్రూ సంధిని తెలుగులో సహజమైన విరామచిహ్నంతో వ్యక్తపరచడం జరిగింది.
- source_word: עוֹבֵד
  choice: ఓబేదు
  rationale: వ్యక్తి పేరు; దాని మూలార్థాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణను అనుసరించి లిప్యంతరీకరించబడింది.
theological_decisions: []
