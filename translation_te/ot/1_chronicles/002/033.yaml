  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని రెండు గుర్తింపు వాక్యాల నిర్మాణాన్ని స్పష్టంగా నిలిపాం; అవసరం లేని సంధికారకాన్ని బలవంతంగా చేర్చలేదు.
