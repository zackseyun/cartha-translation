translation:
  language: te
  text: 'మరియు యోనాతాను కుమారులు: పెలెతు, జాజా. వీరు యెరహ్మెయేలు కుమారులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: యోనాతాను కుమారులు
  rationale: వంశావళి వరుసలో హీబ్రూ సంధికారకమైన ו సాధారణంగా తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించనవసరం లేదు; בְּנֵי అనే నిర్మాణ రూపాన్ని ‘కుమారులు’గా నేరుగా నిలిపాం.
- source_word: פֶּלֶת
  choice: పెలెతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְזָזָא
  choice: జాజా
  rationale: రెండవ వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; పేర్ల జాబితాలో సంధిని తెలుగులో కామాతో సహజంగా వ్యక్తం చేశాం.
- source_word: אֵלֶּה הָיוּ
  choice: వీరు
  rationale: సూచక సర్వనామం మరియు కర్తృవాచక క్రియ కలిపి తెలుగులో సహజమైన గుర్తింపు వాక్యంగా ‘వీరు’ అని ఇచ్చాం; ‘అయ్యారు’ అనే మార్పు భావాన్ని నివారించాం.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: యెరహ్మెయేలు కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ అనే వంశపారంపర్య పదాన్ని ‘సంతతి’గా విస్తరించకుండా నిలిపి, పేరును లిప్యంతరీకరించాం.
