  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: te
  text: షమ్మయి కుమారుడు మావోను; మావోను బేత్‌-సూరుకు తండ్రి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బేత్‌-సూరుకు మూలపురుషుడు/స్థాపకుడు.” వంశావళుల్లో “తండ్రి” అనే మాట ఒక వంశానికో నివాసస్థలానికో మూలపురుషుడిని లేదా స్థాపకుడిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן שַׁמַּי
  choice: షమ్మయి కుమారుడు
  rationale: వంశావళి సందర్భంలో בֶן సహజంగా ‘కుమారుడు’ అని అర్థమవుతుంది. వావ్ సంధిని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా వాక్యప్రవాహంలో సహజంగా వ్యక్తం చేశాం.
- source_word: מָעוֹן
  choice: మావోను
  rationale: ఇక్కడ వాక్యనిర్మాణం దీనిని వ్యక్తి పేరుగా సూచిస్తుంది; అందుచేత పేరును లిప్యంతరీకరించాం.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: ప్రామాణిక వంశావళి పదప్రయోగాన్ని నిలుపుతుంది; అయితే ఇది మూలపురుషుడు లేదా స్థాపకుడు అనే విస్తృత సంబంధాన్ని కూడా సూచించగలదు కాబట్టి ఆ అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֵית צוּר
  choice: బేత్‌-సూరు
  rationale: ఇది స్థలం లేదా వంశానికి సంబంధించిన సంయుక్త నామం; ‘సూరు ఇల్లు’ అని అక్షరార్థంగా అనువదించకుండా పేరుగా లిప్యంతరీకరించాం.
