translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలిని వాడాం. మూలంలోని బహువచనం–ఏకనామం మధ్య ఉన్న ఉద్రిక్తతను ప్రధాన పాఠంలో నిలిపి, దాని సాధ్యమైన అర్థాలను పాదటిప్పణిలో వివరించాం.
