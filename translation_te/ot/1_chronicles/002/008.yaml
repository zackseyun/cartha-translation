lexical_decisions:
- source_word: וּ/בְנֵי
  choice: మరియు … కుమారులు
  rationale: וּ ను వంశావళిలో ముందున్న జాబితాతో గల అనుసంధానాన్ని నిలుపుతూ ‘మరియు’గా అనువదించాం. בְנֵי అనేది బహువచన నిర్మాణరూపం; మూలంలోని అసాధారణతను సరిచేయకుండా ‘కుమారులు’గా ఉంచాం.
- source_word: אֵיתָן
  choice: ఏతాను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఇచ్చాం. ముందున్న ‘కుమారులు’ అనే బహువచనం తరువాత ఒక్క పేరు మాత్రమే ఉన్నప్పటికీ, మూలపాఠంలోని రూపాన్ని అలాగే నిలిపాం.
