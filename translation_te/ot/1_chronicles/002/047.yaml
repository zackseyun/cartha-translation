source:
  edition: WLC
  text: וּ/בְנֵ֖י יָהְדָּ֑י רֶ֧גֶם וְ/יוֹתָ֛ם וְ/גֵישָׁ֥ן וָ/פֶ֖לֶט וְ/עֵיפָ֥ה וָ/שָֽׁעַף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: te
  text: 'యహ్దయి కుమారులు: రెగెము, యోతాము, గేషాను, పెలెతు, ఏఫా, షాఅఫు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: ఇది వంశావళి జాబితాను పరిచయం చేసే ‘కుమారులు’ అనే నిర్మాణ బహువచన రూపం. తెలుగు వాక్యంలో ముందున్న וּ (‘మరియు’)ను తప్పించినా జాబితా సహజంగా, అర్థనిష్ఠగా ఉంటుంది.
- source_word: יָהְדָּי
  choice: యహ్దయి
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: רֶגֶם
  choice: రెగెము
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనువుగా లిప్యంతరీకరణ చేశాం.
- source_word: יוֹתָם
  choice: యోతాము
  rationale: హీబ్రూ పేరులోని ప్రారంభ y ధ్వనిని, దీర్ఘ o ధ్వనిని ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: גֵישָׁן
  choice: గేషాను
  rationale: వ్యక్తి పేరును మూలంలోని ప్రధాన ధ్వనులకు దగ్గరగా లిప్యంతరీకరణ చేశాం.
- source_word: פֶלֶט
  choice: పెలెతు
  rationale: వ్యక్తి పేరును హీబ్రూ వ్యంజన క్రమాన్ని నిలుపుతూ తెలుగులో పలకడానికి అనువుగా ఇచ్చాం.
- source_word: עֵיפָה
  choice: ఏఫా
  rationale: ఇక్కడ ఇది కొలమానాన్ని సూచించే సాధారణ నామవాచకం కాదు, వ్యక్తి పేరు; అందువల్ల పేరుగా లిప్యంతరీకరించాం.
- source_word: שָׁעַף
  choice: షాయఫు
  rationale: హీబ్రూ పేరులోని రెండు అక్షర భాగాలను గుర్తించగలిగేలా, తెలుగు ఉచ్చారణకు అనువుగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. వ్యక్తి పేర్లు మూల హీబ్రూ ఉచ్చారణకు సాధ్యమైనంత దగ్గరగా, తెలుగు పఠనానికి సహజంగా ఇవ్వబడ్డాయి.
