  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: te
  text: షెమా, యోర్కెయాముకు తండ్రియైన[a] రహాముకు తండ్రి అయ్యాడు; రెకెము షమ్మయికి తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోర్కెయాము స్థాపకుడు/పూర్వికుడైన రహాము.’ వంశాలు లేదా నివాస ప్రాంతాలకు సంబంధించిన వంశావళుల్లో ‘తండ్రి’ అనే హీబ్రూ పదం స్థాపకుణ్ణి లేదా ముఖ్య పూర్వికుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫీల్ రూపం ఒకరికి తండ్రి కావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ఈ ప్రయోగాన్ని ఎంచుకున్నాం; పాతకాలపు ‘కనెను’ కంటే ఇది సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: אֲבִי
  choice: తండ్రియైన
  rationale: హీబ్రూ నిర్మాణాన్ని పారదర్శకంగా నిలుపుతూ రహాముకు యోర్కెయాముతో ఉన్న సంబంధాన్ని ‘తండ్రి’గా ప్రధాన పాఠ్యంలో ఇచ్చాం. ఇది ఒక స్థలానికి లేదా వంశానికి స్థాపకుడు/పూర్వికుడు అనే భావాన్ని కూడా కలిగి ఉండవచ్చు; ఆ సాధ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: שֶׁמַע
  choice: షెమ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: רַחַם
  choice: రహాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: יָרְקֳעָם
  choice: యోర్కెయాము
  rationale: ఇది వ్యక్తి లేదా స్థల/వంశ నామంగా గ్రహించదగిన సొంత పేరు; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: רֶקֶם
  choice: రెకెము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: שַׁמָּי
  choice: షమ్మయి
  rationale: హీబ్రూ వ్యక్తినామంలోని ద్విత్వ ‘మ్మ’ ధ్వనిని నిలుపుతూ తెలుగులో లిప్యంతరీకరించాం.
