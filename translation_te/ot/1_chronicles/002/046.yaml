revisions:
- from: కాలేబు ఉపపత్ని ఏఫా హారాను, మోజాను, గాజేజును కనింది; హారాను గాజేజుకు తండ్రి అయ్యాడు.
  to: కాలేబు ఉపపత్నియైన ఏఫా హారానును, మోజాను, గాజేజును కనింది; హారాను గాజేజుకు తండ్రి అయ్యాడు.
