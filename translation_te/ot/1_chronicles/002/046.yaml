id: 1CH.2.46
reference: 1 Chronicles 2:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עֵיפָה֙ פִּילֶ֣גֶשׁ כָּלֵ֔ב יָֽלְדָ֛ה אֶת חָרָ֥ן וְ/אֶת מוֹצָ֖א וְ/אֶת גָּזֵ֑ז וְ/חָרָ֖ן הֹלִ֥יד אֶת גָּזֵֽז־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: te
  text: కాలేబు ఉపపత్నియైన ఏఫా హారానును, మోజాను, గాజేజును కనింది; హారాను గాజేజుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: ఉపపత్ని
  rationale: గుర్తింపు పొందినప్పటికీ ప్రధాన భార్యకంటే తక్కువ సామాజిక హోదా గల భార్యను సూచించే హెబ్రీ పదానికి ఇది సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: יָלְדָה
  choice: కనింది
  rationale: స్త్రీ కర్తగా ఉన్న వంశావళి సందర్భంలో ప్రసవించి సంతానాన్ని పొందిందనే భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: హిఫిల్ రూపం ఇక్కడ పురుష వంశసంబంధాన్ని సూచిస్తుంది; పురాతన శైలిని ఆశ్రయించకుండా ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֵיפָה
  choice: ఏఫా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు రూపాన్ని ఉపయోగించాం.
- source_word: חָרָן
  choice: హారాను
  rationale: వ్యక్తి పేరును రెండు చోట్లా ఒకే విధంగా లిప్యంతరీకరించాం.
- source_word: מוֹצָא
  choice: మోజా
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: גָּזֵז
  choice: గాజేజు
  rationale: వ్యక్తి పేరును రెండు చోట్లా ఒకే విధంగా లిప్యంతరీకరించాం.
- source_word: וְ
  choice: మరియు / జాబితాలో అల్పవిరామం
  rationale: మొదటి וְ వాక్యసంధిని సూచిస్తుంది; పేర్ల జాబితాలో తెలుగు సహజ శైలికి అనుగుణంగా అల్పవిరామాలు వాడి, చివరి ఉపవాక్యాన్ని అర్ధవిరామంతో కలిపాం.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: హెబ్రీ ప్రత్యక్ష కర్మ సూచికకు తెలుగులో స్వతంత్ర పదసమానం లేదు; తెలుగు విభక్తి రూపాల్లో దాని పని అంతర్భూతమైంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వంశావళి శైలిని అనుసరించాం. ‘ఉపపత్ని’ పదం సంబంధంలోని గుర్తింపునూ, అధీన హోదానూ అవమానకరంగా కాకుండా నిలుపుతుంది. ఇంగ్లీషు సంప్రదింపుపాఠంలోని [a] గుర్తు ‘Ephah’ తర్వాత ఉండగా, దాని గమనిక చివరి క్రియకు సంబంధించిన ప్రత్యామ్నాయాన్నే ఇస్తుంది; హెబ్రీ మూలంలో పాఠభేదం లేదా అస్పష్టత కనిపించనందున ఆ అసంబద్ధ గమనికను తెలుగు ప్రధాన పాఠంలో చేర్చలేదు.
