  text: అజర్యా హెలెజుకు తండ్రి అయ్యాడు; హెలెజు ఎలాసాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: అజర్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం; వావ్ సంధి వాక్యప్రవాహంలో సహజంగా ప్రతిఫలిస్తుంది.
- source_word: הֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా, పురుష వంశసంబంధాన్ని స్పష్టంగా తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: హెలెజు / హెలెజు
  rationale: ఒకే వ్యక్తి పేరును రెండు ఉపవాక్యాల్లోనూ స్థిరంగా లిప్యంతరీకరించాం; రెండో రూపంలోని వావ్ సంధిని విరామచిహ్నం మరియు వాక్యనిర్మాణం ద్వారా సహజంగా వ్యక్తపరిచాం.
- source_word: אֶלְעָשָׂה
  choice: ఎలెయాశా
  rationale: మసొరేటిక్ హీబ్రూ రూపంలోని అక్షర, స్వర నిర్మాణాన్ని తెలుగులో సాధ్యమైనంత నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లను మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చాం.
