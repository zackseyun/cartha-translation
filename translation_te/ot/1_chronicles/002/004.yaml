  text: וְ/תָמָר֙ כַּלָּת֔/וֹ יָ֥לְדָה לּ֖/וֹ אֶת פֶּ֣רֶץ וְ/אֶת זָ֑רַח כָּל בְּנֵ֥י יְהוּדָ֖ה חֲמִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: te
  text: అతని కోడలైన తామారు అతనికి పెరెసు[b], జెరహులను కనింది. యూదా కుమారులందరూ ఐదుగురు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ ఐదుగురు: ఏరు, ఓనాను, షేలా, పెరెసు, జెరహు.'
    reason: cross_reference
  - marker: b
    text: ‘పెరెసు’ అనే పేరును కొన్ని లిప్యంతరీకరణ పద్ధతుల్లో ‘పెరెత్స్’ అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: తామారు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כַּלָּתוֹ
  choice: అతని కోడలైన
  rationale: כַּלָּה అనే బంధుత్వ పదం ఇక్కడ కుమారుని భార్యను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కోడలు’ సహజమైన, నిర్దిష్టమైన పదం.
- source_word: יָלְדָה לּוֹ
  choice: అతనికి … కనింది
  rationale: ילד స్త్రీ కర్తతో ప్రసవించడాన్ని సూచిస్తుంది; לּוֹ యూదాతో ఉన్న పితృసంబంధాన్ని తెలియజేస్తుంది. తెలుగు వంశావళి శైలిలో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: פֶּרֶץ
  choice: పెరెసు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో సులభంగా పలికేలా, ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: זָרַח
  choice: జెరహు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: యూదా కుమారులందరూ
  rationale: మూలంలోని ‘కుమారులు’ అనే పురుషలింగ బంధుత్వ పదాన్ని అలాగే నిలిపి, తెలుగులో సహజమైన పదక్రమాన్ని వాడాం.
- source_word: חֲמִשָּׁה
  choice: ఐదుగురు
  rationale: వ్యక్తులను లెక్కించే సహజమైన తెలుగు సంఖ్యారూపం; ఇది యూదా కుమారుల మొత్తం సంఖ్యను సూచిస్తుంది.
theological_decisions:
- issue: పెరెసు, జెరహులను పేర్కొన్న తర్వాత వచ్చే వంశావళి సంగ్రహం
  choice: ‘యూదా కుమారులందరూ ఐదుగురు’ అని మొత్తం సంఖ్యను స్పష్టంగా తెలిపాం.
  alternative: ‘వీరే యూదా కుమారులు—మొత్తం ఐదుగురు’
  rationale: హీబ్రూ వాక్యం సాధారణ వంశావళి లెక్కను సంగ్రహిస్తుంది. మూలంలోని సంక్షిప్తతనూ స్పష్టమైన మొత్తాన్నీ నిలిపాం.
- issue: లింగం, బంధుత్వాన్ని సూచించే పదాలు
  choice: ‘కోడలు’, ‘కుమారులు’ అనే నిర్దిష్ట పదాలను నిలిపాం.
  alternative: ‘వివాహ బంధువు’, ‘పిల్లలు’
  rationale: మూలపాఠం నిర్దిష్టమైన వివాహ బంధాన్నీ మగ సంతానాన్నీ సూచిస్తుంది; లింగతటస్థ పదాలు ఆ సమాచారాన్ని తగ్గిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉండడంతో, [a]ను మొత్తం ఐదుగురనే సంగ్రహం దగ్గర, [b]ను పెరెసు పేరు దగ్గర ఉంచాం.
