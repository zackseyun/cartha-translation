  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: te
  text: 'షమ్మయి సోదరుడైన యాదా కుమారులు: యెతెరు, యోనాతాను. యెతెరు కుమారులు లేకుండానే చనిపోయాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: ఇది వంశావళిలో ఒక ఉపవిభాగాన్ని పరిచయం చేసే בֵּן పదపు బహువచన నిర్మిత రూపం. ముందున్న וּ సంధిని తెలుగులో ప్రత్యేకంగా అనువదించకపోవడం సహజమైన వంశావళి శైలికి అనుగుణం.
- source_word: יָדָע
  choice: యాదా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని స్వరరూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: אֲחִי שַׁמַּי
  choice: షమ్మయి సోదరుడైన
  rationale: అక్షరార్థంగా ‘షమ్మయి సోదరుడు’; యాదాను గుర్తించే విశేషణంగా తెలుగులో సహజంగా అమర్చాం.
- source_word: יֶתֶר
  choice: యేతెరు
  rationale: రెండు సందర్భాల్లోనూ ఒకే వ్యక్తినామాన్ని స్థిరంగా లిప్యంతరీకరించాం.
- source_word: וְיוֹנָתָן
  choice: యోనాతాను
  rationale: וְ సంధి జాబితాలో విరామచిహ్నం ద్వారా సహజంగా వ్యక్తమవుతుంది; హీబ్రూ పేరును తెలుగు బైబిలు నామశైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: వంశావళిలో తదుపరి సంఘటనను తెలిపే wayyiqtol రూపాన్ని సహజమైన తెలుగు భూతకాలంతో ఇచ్చాం.
- source_word: לֹא בָנִים
  choice: కుమారులు లేకుండానే
  rationale: అక్షరార్థంగా ‘కుమారులు లేరు.’ సందర్భంలో యేతెరు కుమారులు లేకుండానే మరణించాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; కుమార్తెలు కూడా లేరని విస్తరించదు.
