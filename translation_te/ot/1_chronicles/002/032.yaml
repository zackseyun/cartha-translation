translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్తతను నిలుపుతూ, ‘లֹא בָנִים’ను కుమారులు లేరనే పురుష వంశసంబంధిత నిర్దిష్ట భావంతోనే అనువదించాం.
