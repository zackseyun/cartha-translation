id: 1CH.2.3
reference: 1 Chronicles 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י יְהוּדָ֗ה עֵ֤ר וְ/אוֹנָן֙ וְ/שֵׁלָ֔ה שְׁלוֹשָׁה֙ נ֣וֹלַד ל֔/וֹ מִ/בַּת שׁ֖וּעַ הַֽ/כְּנַעֲנִ֑ית וַ/יְהִ֞י עֵ֣ר בְּכ֣וֹר יְהוּדָ֗ה רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה וַ/יְמִיתֵֽ/הוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: te
  text: 'యూదా కుమారులు: ఏరు, ఓనాను, షేలా—కనానీయురాలైన షూవా కుమార్తె ద్వారా యూదాకు పుట్టినవారు ఈ ముగ్గురు.[a] యూదా మొదటి కుమారుడైన ఏరు యాహ్వే దృష్టిలో చెడ్డవాడు; యాహ్వే అతణ్ణి చంపాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “కనానీయురాలైన షూవా కుమార్తె ద్వారా.” కొందరు ఇక్కడి పదబంధాన్ని “కనానీయురాలైన బత్-షూవా ద్వారా” అనే వ్యక్తినామంగా గ్రహిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: వంశావళి సందర్భంలోని సమాసబంధాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: ఈ ముగ్గురు అతనికి పుట్టారు
  rationale: ‘ముగ్గురు’ అనే సంఖ్యను స్పష్టంగా ఉంచుతూ, ילד నిఫల్ రూపంలోని ‘అతనికి పుట్టారు’ అనే భావాన్ని కాపాడుతుంది.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: కనానీయురాలైన షూవ కుమార్తె ద్వారా
  rationale: మసొరేటిక్ పాఠంలోని ‘షూవ కుమార్తె’ అనే పదబంధాన్ని ప్రధాన పాఠంలో నేరుగా ప్రతిబింబిస్తుంది; ‘బత్‌షూవ’ అనే పేరుగా గ్రహించే అవకాశాన్ని పాదటీకలో ఉంచుతుంది.
- source_word: בְּכוֹר יְהוּדָה
  choice: యూదా మొదటి కుమారుడు
  rationale: ‘జ్యేష్ఠుడు’ కంటే సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సహజమైన తెలుగు; మొదట పుట్టిన కుమారుడు అనే వంశావళి భావాన్ని నిలుపుతుంది.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో చెడ్డవాడిగా ఉన్నాడు
  rationale: దేవుని నైతిక మదింపును తెలిపే హీబ్రూ నానుడిని సహజమైన తెలుగులో వ్యక్తం చేస్తూ ‘దృష్టిలో’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: וַיְמִיתֵהוּ
  choice: అతణ్ణి చంపాడు
  rationale: హిఫిల్ క్రియలోని మరణింపజేయడం అనే causative భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో ఇస్తుంది; కర్తను పాఠంలో ప్రత్యేకంగా చేర్చకుండా హీబ్రూ ప్రవాహాన్ని కాపాడుతుంది.
theological_decisions:
- issue: וַיְמִיתֵהוּ క్రియకు అవ్యక్త కర్త
  choice: ‘అతణ్ణి చంపాడు’ అని కర్తను మళ్లీ పేరుతో చెప్పకుండా అనువదించడం; సందర్భంలో కర్త యాహ్వే
  alternative: ‘యాహ్వే అతణ్ణి చంపాడు’
  rationale: హీబ్రూలో కర్త ప్రత్యేక నామవాచకంగా పునరుక్తి కాలేదు. తెలుగులో కర్తను విడిచిపెట్టడం సహజమే; ముందు వచ్చిన యాహ్వేనే కర్తగా అత్యంత సహజంగా అర్థమవుతాడు. పాదటీక ఈ సూచనను స్పష్టం చేస్తుంది.
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తినామ స్వభావాన్ని నిలుపుతూ, దానిని బిరుదుగా మార్చకుండా ఆధునికంగా లిప్యంతరీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్త, గంభీర శైలి. అరుదైన సంస్కృత పదాలకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ, మూలంలోని సంఖ్య, బంధుత్వం, నైతిక మదింపు, అవ్యక్త కర్తలను నిలుపుకుంది.
