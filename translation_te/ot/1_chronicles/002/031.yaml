lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי ప్రత్యక్ష కుమారులను లేదా విస్తృతంగా వంశస్థులను సూచించగలదు. ఇక్కడ హెబ్రీ పదానికి నేరమైన సమానార్థకంగా ‘కుమారులు’ను ఉంచి, విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: אַפַּיִם
