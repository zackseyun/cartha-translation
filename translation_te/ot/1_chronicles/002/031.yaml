  source_fidelity: 'హెబ్రీ వంశావళి నిర్మాణం, మూడు సార్లూ וּבְנֵי యొక్క పునరావృతం, మరియు సంబంధాల క్రమాన్ని ముసాయిదా సరిగ్గా నిలుపుతోంది. అయితే వ్యక్తిపేర్లలో కొన్ని చివరి వ్యంజనాలు/అచ్చులు మూలరూపానికి తక్కువగా సరిపోతున్నాయి: אַפַּיִם‌కు ‘అప్పయీము’ బదులు ‘అప్పయిమ్’, יִשְׁעִיకు ‘ఇషీ’ బదులు ‘ఇషయి’, שֵׁשָׁןకు ‘షేషాను’ బదులు ‘షేషాన్’ మరింత నేరమైన లిప్యంతరీకరణలు.'
