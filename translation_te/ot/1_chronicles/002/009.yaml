translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదివే విధంగా రూపొందించబడింది. వ్యక్తినామాల మధ్య స్పష్టమైన జాబితా నిర్మాణం వాడబడింది; మూలపాఠంలోని కెలూబై అనే రూపం ప్రధాన పాఠంలో భద్రపరచబడింది.
