source:
  edition: WLC
  text: וּ/בְנֵ֥י חֶצְר֖וֹן אֲשֶׁ֣ר נוֹלַד ל֑/וֹ אֶת יְרַחְמְאֵ֥ל וְ/אֶת רָ֖ם וְ/אֶת כְּלוּבָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: te
  text: 'హెస్రోనుకు పుట్టిన కుమారులు: యెరహ్మెయేలు, రాము, కెలూబై.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వంశావళిలో ఇతర చోట్ల కాలేబు అని పిలువబడిన వ్యక్తే కెలూబై అయి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనే నిర్మాణ బహువచనానికి వంశావళి సందర్భంలో సహజమైన తెలుగు సమానార్థకం. ఆరంభంలోని וּ సంధిని తెలుగులో ప్రత్యేకంగా చూపకపోయినా భావం తగ్గదు.
- source_word: חֶצְרוֹן
  choice: హెస్రోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: హెస్రోనుకు పుట్టిన
  rationale: నిఫ్అల్ రూపంలోని జనన భావాన్నీ, לוֹ లోని ‘అతనికి’ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది. హీబ్రూలో క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ, ముందున్న ‘కుమారులు’ మరియు తరువాతి ముగ్గురి జాబితా కారణంగా తెలుగులో సమూహాన్ని సూచించే సహజ నిర్మాణం వాడబడింది.
- source_word: אֶת
  choice: —
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా అనువాద పదం అవసరం లేదు.
- source_word: יְרַחְמְאֵל
  choice: యెరహ్మెయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: רָם
  choice: రాము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; సాధారణ తెలుగు విభక్తి వినియోగానికి అనుకూలమైన రూపం.
- source_word: כְּלוּבָי
  choice: కెలూబై
  rationale: మసొరేటిక్ పాఠంలోని ప్రత్యేక నామరూపాన్ని నేరుగా నిలిపింది; దానిని పరిచితమైన ‘కాలేబు’గా ప్రధాన పాఠంలో సమన్వయపరచలేదు.
