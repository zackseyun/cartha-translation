id: 1CH.2.18
reference: 1 Chronicles 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָלֵ֣ב בֶּן חֶצְר֗וֹן הוֹלִ֛יד אֶת עֲזוּבָ֥ה אִשָּׁ֖ה וְ/אֶת יְרִיע֑וֹת וְ/אֵ֣לֶּה בָנֶ֔י/הָ יֵ֥שֶׁר וְ/שׁוֹבָ֖ב וְ/אַרְדּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: te
  text: 'హెస్రోను కుమారుడైన కాలేబుకు అజూబా అనే తన భార్యవల్లను, యెరీయోతువల్లను పిల్లలు పుట్టారు.[a] ఆమె కుమారులు వీరు: యేషెరు, షోబాబు, అర్దోను.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. యెరీయోతు కాలేబుతో సంబంధమున్న రెండవ స్త్రీగా ఉండవచ్చు; మరికొందరి అవగాహనలో ఆ పేరు అజూబాకే మరో పేరుగా లేదా వివరణగా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: “ఆమె కుమారులు.” ఇక్కడి ప్రత్యయం స్త్రీలింగ ఏకవచనం. కొన్ని వ్యాఖ్యానాలు ఈ వంశావళి సంబంధాన్ని వేరుగా అర్థం చేసుకుంటాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: పిల్లలను కన్నాడు
  rationale: యలద్ అనే క్రియ హిఫీల్ రూపంలో సాధారణంగా ‘కనడం/తండ్రి కావడం’ అనే భావాన్ని ఇస్తుంది. తరువాత స్త్రీల పేర్లు రావడం వల్ల తెలుగులో ‘వారి ద్వారా పిల్లలను కన్నాడు’ అనే నిర్మాణం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: తన భార్య అజూబా ద్వారా, అలాగే యెరీయోతు ద్వారా
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగాను క్లిష్టంగాను ఉంది. אִשָּׁה ను అజూబాకు వివరణగా ‘తన భార్య’ అని తీసుకుని, యెరీయోతును సమన్వయంగా పేర్కొన్న స్త్రీగా ప్రధాన పాఠంలో చూపించాం; అయితే వాక్యనిర్మాణంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: אִשָּׁה
  choice: తన భార్య
  rationale: స్పష్టమైన సర్వనామ ప్రత్యయం లేకపోయినా, ఈ వంశావళి సందర్భంలో ‘భార్య’ సహజార్థం. తెలుగులో సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘తన భార్య’ అని ఇచ్చాం.
- source_word: יְרִיעוֹת
  choice: యెరీయోతు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యంతరీకరణ పద్ధతిలో అందించాం.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: ఆమె కుమారులు వీరు
  rationale: בָנֶיהָ లోని ప్రత్యయం స్త్రీలింగ ఏకవచనం; అందువల్ల మసొరెటిక్ పాఠంలోని వ్యాకరణాన్ని అనుసరించి ‘ఆమె కుమారులు’ అని నిలిపాం.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: యేషెరు, షోబాబు, అర్దోను
  rationale: వ్యక్తి పేర్లను ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా ధ్వన్యంతరీకరించాం.
theological_decisions:
- issue: ఈ వచనంలో పేర్కొన్న స్త్రీలు, కుమారుల సంబంధానికి సంబంధించిన వంశావళి సందిగ్ధత
  choice: కాలేబు తన భార్య అజూబా ద్వారా, అలాగే యెరీయోతు ద్వారా పిల్లలను కన్నాడని ప్రధాన పాఠంలో ఇచ్చి, స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని అనుసరించి ‘ఆమె కుమారులు’ అని ఉంచాం.
  alternative: యెరీయోతు అజూబాకే మరో పేరుగా లేదా వివరణగా ఉండవచ్చు; లేక కుమారుల సంబంధాన్ని కొన్ని వ్యాఖ్యానాలు వేరుగా పునర్నిర్మించవచ్చు.
  rationale: ఇది ప్రధానంగా పాఠ్య-వాక్యనిర్మాణ సమస్య. మసొరెటిక్ వ్యాకరణాన్ని మార్చకుండా ఉంచుతూ, వంశావళిని అతిగా నిర్ధారించకుండా ప్రత్యామ్నాయ అవగాహనలను పాదసూచికల్లో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలిని వాడాం. క్లిష్టమైన హీబ్రూ నిర్మాణాన్ని సహజీకరించినప్పటికీ దాని సందిగ్ధతను పాదసూచికల్లో సంరక్షించాం.
