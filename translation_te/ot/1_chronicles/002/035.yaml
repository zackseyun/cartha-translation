id: 1CH.2.35
reference: 1 Chronicles 2:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן שֵׁשָׁ֧ן אֶת בִּתּ֛/וֹ לְ/יַרְחָ֥ע עַבְדּ֖/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת עַתָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: te
  text: షేషాను తన కుమార్తెను తన బానిసైన[a] యర్హాకు భార్యగా ఇచ్చాడు; ఆమె అతనికి అత్తయిని కన్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవకుడైన.’ హీబ్రూ עֶבֶד పదం సందర్భానుసారం సేవకుడిని లేదా బానిసను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు ప్రాథమిక అర్థం ‘ఇచ్చాడు.’ వివాహ సందర్భాన్ని לְאִשָּׁה స్పష్టం చేస్తున్నందున అదనంగా ‘పెళ్లిచేశాడు’ అని విస్తరించకుండా మూల నిర్మాణాన్ని నిలిపింది.
- source_word: שֵׁשָׁן
  choice: షేషాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సులభంగా పలికే సంప్రదాయ రూపంలో లిప్యంతరీకరించింది.
- source_word: בִּתּוֹ
  choice: తన కుమార్తెను
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘అతని కుమార్తె’ అనే బంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో ‘తన కుమార్తెను’గా తెలిపింది.
- source_word: לְיַרְחָע
  choice: యర్హాకు
  rationale: לְ సూచించే గ్రహీత భావాన్ని తెలుగు చతుర్థీ విభక్తితో వ్యక్తం చేసి, పేరును ‘యర్హా’గా లిప్యంతరీకరించింది.
- source_word: עַבְדּוֹ
  choice: తన దాసుడైన[a]
  rationale: עֶבֶד సేవకుడు లేదా బానిస అనే అర్థాలను కలిగి ఉండవచ్చు. ‘దాసుడు’ అధీన సేవాస్థితిని సంక్షిప్తంగా సూచిస్తుంది; ఖచ్చితమైన చట్టపర స్థితిని పాఠం నిర్ణయించనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: హీబ్రూ వివాహ ప్రయోగమైన ‘భార్యగా/భార్య కోసం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: וַתֵּלֶד
  choice: కన్నది
  rationale: స్త్రీ కర్తతో ילד క్రియకు ‘కన్నది’ అనే సంక్షిప్త రూపం వంశావళి శైలికి తగినది.
- source_word: לוֹ
  choice: అతనికి
  rationale: జనన సూత్రంలో తండ్రితో ఉన్న సంబంధాన్ని సూచించే לְ ప్రత్యయాన్ని సహజ తెలుగులో నిలిపింది.
- source_word: עַתָּי
  choice: అత్తయి
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించింది.
theological_decisions:
- issue: యర్హా సామాజిక స్థితి
  choice: దాసుడు
  alternative: సేవకుడు; బానిస
  rationale: עֶבֶד పదం సేవకత్వం నుంచి బానిసత్వం వరకు విస్తరించగలదు. కథలో అతని అధీన గృహస్థితి ప్రాముఖ్యమైనా, ఈ వచనం అతని ఖచ్చితమైన చట్టపర స్థితిని నిర్ధారించదు; అందువల్ల ప్రధాన పాఠం మరియు పాదసూచిక కలిసి ఆ అనిశ్చితిని కాపాడుతున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించింది. ‘భార్యగా ఇచ్చాడు’ అనే రూపం మూలంలోని వివాహ ప్రయోగాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది; עֶבֶדలోని అర్థవ్యాప్తిని పాదసూచిక సంరక్షిస్తుంది.
