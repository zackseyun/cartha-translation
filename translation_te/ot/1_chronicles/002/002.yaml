  register: సరళమైన వంశావళి జాబితా శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా మరియు సహజంగా పేర్లు అందించబడ్డాయి. మూలంలోని జాబితా విభజనను అనవసరమైన సంధికారకాల పునరావృతం లేకుండా కామాలతో చూపించాం.
