lexical_decisions:
- source_word: דָּן
  choice: దాను
  rationale: వ్యక్తి/గోత్ర నామం; ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: వ్యక్తి/గోత్ర నామం; హెబ్రీ ఉచ్చారణను, స్థిరపడిన తెలుగు రూపాన్ని దృష్టిలో ఉంచి లిప్యంతరీకరించబడింది.
- source_word: וּ/בִנְיָמִן
  choice: బెన్యామీను
  rationale: వ్యక్తి/గోత్ర నామం లిప్యంతరీకరించబడింది. జాబితాలోని ו సంధికారకం తెలుగులో ప్రతి చోట ‘మరియు’ అని పునరావృతం చేయకుండా విరామచిహ్నంతో సహజంగా వ్యక్తమైంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తి/గోత్ర నామం; మూలభాష ధ్వనికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: גָּד
  choice: గాదు
  rationale: వ్యక్తి/గోత్ర నామం; స్థిరపడిన తెలుగు బైబిలు రూపాన్ని అనుసరించి లిప్యంతరీకరించబడింది.
- source_word: וְ/אָשֵׁר
  choice: ఆషేరు
  rationale: వ్యక్తి/గోత్ర నామం లిప్యంతరీకరించబడింది. ముందున్న ו జాబితా సంధికారకం; తెలుగులో కామాలతో కూడిన వరుస ద్వారా సహజంగా వ్యక్తమైంది.
