  text: Salma[a], the father of Bethlehem; Hareph[b], the father of Beth-gader.
translation:
  language: te
  text: సల్మా[a] బేత్లెహేముకు తండ్రి; హారెఫ్[b] బేత్‌గాదేరుకు తండ్రి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘తండ్రి’ అనే పదానికి ‘స్థాపకుడు’ లేదా ‘పూర్వికుడు’ అనే అర్థం కూడా ఉండవచ్చు; వంశావళుల్లో ఇది కేవలం ప్రత్యక్ష జనకుడినే కాకుండా ఒక వంశం లేదా పట్టణ స్థాపకునినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరు కొన్ని నామపారంపర్యాల్లో ‘హారిఫ్’ అని కూడా ఇవ్వబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂלְמָא
  choice: సల్మా
  rationale: వ్యక్తి పేరు కావడంతో అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: אֲבִי
