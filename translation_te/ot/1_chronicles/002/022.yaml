source:
  edition: WLC
  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: te
  text: సెగూబు యాయీరుకు తండ్రి అయ్యాడు. గిలాదుదేశంలో యాయీరుకు ఇరవై మూడు పట్టణాలు ఉండేవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: సెగూబు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం; వాక్యారంభంలోని וּ సందర్భానుసారంగా ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: ילד ధాతువు హిఫీల్ రూపం వంశావళి సందర్భంలో ‘కనెను/తండ్రి అయ్యాడు’ అనే అర్థం ఇస్తుంది. ఆధునిక సహజ తెలుగులో ‘తండ్రి అయ్యాడు’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: יָאִיר
  choice: యాయీరు
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיְהִי לוֹ
  choice: యాయీరుకు ... ఉండేవి
  rationale: היה + ל అనే స్వామ్యసూచక హెబ్రీ నుడికారాన్ని సహజ తెలుగులో ‘అతనికి ఉండేవి’గా వ్యక్తం చేశాం. సమీప పూర్వపదమైన యాయీరునే సూచిస్తున్నదని స్పష్టత కోసం పేరును పునరుక్తి చేశాం.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: ఇరవై మూడు
  rationale: హెబ్రీ సంఖ్యను సహజ ఆధునిక తెలుగు సంఖ్యాక్రమంలో ఇచ్చాం.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: עִיר నగరం లేదా పట్టణాన్ని సూచించగలదు. ఈ ప్రాచీన ప్రాంతీయ సందర్భంలో ‘పట్టణాలు’ సహజమైన, అతిశయార్థం లేని ఎంపిక.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: గిలాదుదేశంలో
  rationale: אֶרֶץ అనే పదంలోని భూభాగ భావాన్ని నిలుపుతూ, మొత్తం పదబంధాన్ని సహజ తెలుగులో సంక్షిప్తంగా అందించాం.
