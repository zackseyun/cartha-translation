translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన సరళమైన గౌరవప్రద వాక్యనిర్మాణం వాడాం. ‘కనెను’ అనే సంప్రదాయబద్ధమైన కానీ నేటి వాడుకలో కొంత పురాతనంగా అనిపించే రూపానికి బదులుగా ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం. స్వామ్యసూచక సర్వనామం ఎవరికో స్పష్టంగా ఉండేందుకు రెండో వాక్యంలో ‘యాయీరుకు’ అని పేర్కొన్నాం.
