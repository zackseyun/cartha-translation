  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: te
  text: 'హెస్రోనుకు మొదటి కుమారుడైన యెరహ్మెయేలు[a] కుమారులు: అతని మొదటి కుమారుడు రాము, బూనా, ఓరేను, ఓజెము, అహీయా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణాన్ని యెరహ్మెయేలు కుమారులు ఐదుగురని, వారిలో రాము అతని మొదటి కుమారుడని చదవవచ్చు. కొందరు అహీయాకు ఈ జాబితాతో వేరొక సంబంధం ఉందని ప్రతిపాదించారు; అయితే సూటి పఠనంలో అహీయా కూడా జాబితాలోని ఒక వ్యక్తినామమే.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 'కుమారులు:'
  rationale: వంశావళి జాబితాను తెలుగులో సహజంగా పరిచయం చేయడానికి నామవాచక వాక్య నిర్మాణంతో పెద్దప్రేగు ఉపయోగించబడింది; హీబ్రూ క్రియ ఇక్కడ కుటుంబ సభ్యులను పేర్కొంటుంది.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఈ వంశావళి సందర్భంలో పురుష సంతానాన్ని సూచించే హీబ్రూ పదానికి లింగ, వంశ సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: יְרַחְמְאֵל
  choice: యెరహ్మెయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: హెస్రోను మొదటి కుమారుడైన
  rationale: యెరహ్మెయేలుకు హెస్రోనుతో ఉన్న సంబంధాన్ని, అతని మొదటి కుమారుని హోదాను సహజమైన తెలుగు విశేషణ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: הַבְּכוֹר
  choice: అతని మొదటి కుమారుడు
  rationale: పునరుక్తమైన ‘మొదటి కుమారుడు’ అనే గుర్తింపును నిలుపుతూ, అది యెరహ్మెయేలు కుమారుడైన రామును సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: רָם
  choice: రాము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וּבוּנָה
  choice: బూనా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וָאֹרֶן
  choice: ఓరెను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וָאֹצֶם
  choice: ఓజెము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אֲחִיָּה
  choice: అహీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; జాబితాలో మరో వ్యక్తినామంగా ఉంచబడింది.
theological_decisions:
- issue: అహీయా అనే పదానికి జాబితాతో ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: అహీయాను యెరహ్మెయేలు కుమారుల జాబితాలో ఐదవ వ్యక్తినామంగా అనువదించడం
  alternative: అహీయాను జాబితాతో వేరొక సంబంధంలో అర్థం చేసుకోవడం
  rationale: హీబ్రూ వాక్యనిర్మాణపు సూటి పఠనం రాము, బూనా, ఓరెను, ఓజెము, అహీయా అనే ఐదుగురు కుమారులను పేర్కొంటుంది; అయినా ప్రతిపాదించబడిన భిన్న పఠనాన్ని పాదటిప్పణిలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదివేలా వంశావళి జాబితా నిర్మాణం వాడబడింది. ‘మొదటి కుమారుడు’ అనే సరళమైన పదబంధం హీబ్రూలో రెండుసార్లు వచ్చే בכור భావాన్ని నిలుపుతుంది; వ్యక్తినామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
