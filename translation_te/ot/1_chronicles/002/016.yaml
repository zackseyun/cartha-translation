  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని పేర్ల జాబితా నిర్మాణం మరియు చివరి సంఖ్యా సారాంశం నిలిపివేయబడ్డాయి.
