base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: te
  text: వారి సహోదరీలు సెరూయా, అబీగయీలు. సెరూయా కుమారులు అబీషై, యోవాబు, అసాహేలు—ముగ్గురు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: వారి సహోదరీలు
  rationale: మూడవ పురుష బహువచన ప్రత్యయాన్ని ‘వారి’గా, బహువచన నామాన్ని ‘సహోదరీలు’గా సహజమైన ఆధునిక తెలుగులో నిలిపింది. హీబ్రూ సంధికారకాన్ని ప్రత్యేకంగా అనువదించకపోయినా అదనపు వంశవివరాన్ని తెలిపే భావం కొనసాగుతుంది.
- source_word: צְרוּיָה
  choice: సెరూయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: וַאֲבִיגָיִל
  choice: అబీగయీలు
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు పఠనానికి సహజమైన రూపంలో లిప్యంతరీకరించింది; జాబితాలోని సముచ్చయం విరామచిహ్నం ద్వారా వ్యక్తమవుతుంది.
- source_word: וּבְנֵי צְרוּיָה
  choice: సెరూయా కుమారులు
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో నేరుగా తెలిపింది.
- source_word: אַבְשַׁי
  choice: అబీషై
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְיוֹאָב
  choice: యోవాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు రూపంలో లిప్యంతరీకరించింది; జాబితాలో సముచ్చయాన్ని కామా సూచిస్తుంది.
- source_word: וַעֲשָׂהאֵל
  choice: అసాహేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించింది.
- source_word: שְׁלֹשָׁה
  choice: ముగ్గురు
  rationale: వ్యక్తులను లెక్కించే తెలుగు సంఖ్యారూపాన్ని వాడి, హీబ్రూలోని ముగింపు మొత్తాన్ని స్పష్టంగా నిలిపింది.
