translation:
  language: te
  text: ఎల్యాసా సిస్మయికి తండ్రి అయ్యాడు, మరియు సిస్మయి షల్లూముకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: ఎల్యాశా
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా, ఆధునిక తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: యָלַד క్రియ యొక్క హిఫీల్ రూపం వంశావళి సందర్భంలో ‘కన్నాడు/తండ్రి అయ్యాడు’ అనే అర్థం ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో పితృవంశ సంబంధాన్ని స్పష్టంగా తెలియజేయడానికి ‘తండ్రి అయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֵת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: סִסְמַי
  choice: సిస్మయి
  rationale: హీబ్రూ వ్యక్తిపేరును దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర వంశావళి వాక్యాలను తెలుగులో సహజంగా కలపడానికి సంధిపదానికి బదులుగా అర్ధవిరామం వాడాం; హీబ్రూ వావ్ తెలిపే అనుసంధానం నిలిచింది.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: హీబ్రూ వ్యక్తిపేరును దీర్ఘ ū ధ్వని, ద్విత్వ ల ధ్వనులకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
