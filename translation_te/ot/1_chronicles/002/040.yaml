  register: సంక్షిప్తమైన వంశావళి శైలిని కాపాడుతూ, పురాతనంగా వినిపించే ‘కనెను’ వంటి రూపానికి బదులుగా సాధారణ ఆధునిక తెలుగు ‘తండ్రి అయ్యాడు’ వాడాం. పేర్లను గౌరవప్రదమైన తెలుగు బైబిలు లిప్యంతరణ శైలిలో ఇచ్చాం.
