translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. ‘లేఖకులు’ అనే పదం వృత్తిని అతిగా నిర్వచించకుండా ఉంటుంది; వంశనామాలు తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని ‘నుండి వచ్చిన’ అనే భావంలో ఉన్న భౌగోళిక/వంశపరమైన అస్పష్టతను అలాగే ఉంచాం.
