source:
  edition: WLC
  text: וּ/מִשְׁפְּח֤וֹת סֹפְרִים֙ ישבו יַעְבֵּ֔ץ תִּרְעָתִ֥ים שִׁמְעָתִ֖ים שׂוּכָתִ֑ים הֵ֚מָּה הַ/קִּינִ֣ים הַ/בָּאִ֔ים מֵ/חַמַּ֖ת אֲבִ֥י בֵית רֵכָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: te
  text: 'మరియు యాబెజులో నివసించిన లేఖకుల వంశాలు ఇవి: తిరాతీయులు, షిమాతీయులు, సూకాతీయులు. వీరు హమ్మతు నుండి వచ్చిన కేనీయులు; హమ్మతు రేకాబు వంశానికి తండ్రి[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రేకాబు వంశానికి మూలపురుషుడు/స్థాపకుడు.’ వంశావళి సందర్భాల్లో హీబ్రూ పదమైన ‘తండ్రి’ మూలపురుషుణ్ణి లేదా స్థాపకుణ్ణి కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: లేఖకుల వంశాలు
  rationale: מִשְׁפְּחוֹת అనేది కుటుంబ లేదా వంశ సమూహాలను సూచిస్తుంది; సֹפְרִים అనేది వ్రాతపని, దస్తావేజులు లేదా లెక్కల నిర్వహణతో సంబంధమున్న ‘లేఖకులు’ అనే అర్థాన్ని ఇస్తుంది. ‘శాస్త్రులు’ అని అనువదిస్తే ఇక్కడ నిర్ధారించలేని మతపరమైన పాత్రను సూచించే అవకాశం ఉంది.
- source_word: ישבו יַעְבֵּץ
  choice: యాబెజులో నివసించిన
  rationale: క్రియ ఈ లేఖకుల వంశాలు యాబెజు అనే ప్రదేశంలో నివసించాయని తెలియజేస్తుంది; తెలుగులో సహజమైన సంబంధవాచక నిర్మాణం వాడబడింది.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: తిరాతీయులు, షిమాతీయులు, సూకాతీయులు
  rationale: ఇవి మూడు వంశ లేదా సమూహ నామాలు కాబట్టి వాటి నామరూప స్వభావాన్ని నిలుపుతూ లిప్యంతరీకరించబడ్డాయి.
- source_word: הֵמָּה הַקִּינִים
  choice: వీరు … కేనీయులు
  rationale: హీబ్రూ గుర్తింపు వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపి, קִּינִים అనే జాతి/వంశ నామాన్ని ‘కేనీయులు’గా ఇచ్చాం.
- source_word: הַבָּאִים מֵחַמַּת
  choice: హమ్మతు నుండి వచ్చిన
  rationale: מן కలిగిన కృదంత రూపం మూలం లేదా వచ్చిన చోటును సూచిస్తుంది. అది వలసను సూచిస్తుందా, వంశపరమైన మూలాన్ని సూచిస్తుందా అన్నది నిర్ణయించకుండా ‘నుండి వచ్చిన’ అని ఉంచాం.
- source_word: אֲבִי בֵית רֵכָב
  choice: రేకాబు ఇంటివారి తండ్రి
  rationale: ‘తండ్రి’ మరియు ‘ఇల్లు’ అనే హీబ్రూ వంశావళి నుడికారాన్ని సాధ్యమైనంత పారదర్శకంగా నిలిపాం; ఇక్కడ ‘ఇంటివారు’ అనేది రేకాబు వంశం లేదా కుటుంబాన్ని సూచిస్తుంది.
