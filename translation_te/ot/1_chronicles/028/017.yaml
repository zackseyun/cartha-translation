base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: te
  text: అలాగే మేలిమి బంగారపు ముళ్ల గరిటెలు, బేసిన్లు, కూజాలు[a]; బంగారు గిన్నెలకు ఒక్కొక్క గిన్నెకు బరువు చొప్పున, వెండి గిన్నెలకు ఒక్కొక్క గిన్నెకు బరువు చొప్పున.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ద్రవం పోసే పాత్రలు.” ఈ హీబ్రూ పదం ద్రవాన్ని పోయడానికి ఉపయోగించే ఒక పాత్రను సూచిస్తుంది; దాని ఖచ్చితమైన ఆకారం స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “గిన్నెకు, గిన్నెకు” అని రెండుసార్లు వస్తుంది. ప్రతి గిన్నెకు విడిగా నిర్ణయించిన బరువు ఉందని తెలిపే పంపిణీ ప్రయోగమిది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: ముళ్ల గరిటెలు
  rationale: దేవాలయ సేవలో ఉపయోగించే, ముళ్లు లేదా పళ్లు గల పనిముట్టును సూచిస్తుంది. పురాతనంగా వినిపించే పదానికి బదులు సాధారణ పాఠకుడికి ఆకారం, ఉపయోగం అర్థమయ్యే ఆధునిక పదబంధాన్ని ఎంచుకున్నాం.
- source_word: מִּזְרָקוֹת
  choice: పళ్లాలు
  rationale: బలి ఆరాధనలో ఉపయోగించే వెడల్పాటి పాత్రలను సూచించే పదం. తరువాత వచ్చే כְפוֹרֵי అనే పాత్రల నుండి భేదం నిలుపుటకు అక్కడ ‘గిన్నెలు,’ ఇక్కడ ‘పళ్లాలు’ అని అనువదించాం.
- source_word: קְּשָׂוֹת
  choice: కూజాలు
  rationale: ద్రవాన్ని పోయడానికి ఉపయోగించే పాత్ర అనే సంభావ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఖచ్చితమైన పాత్రాకారం అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: זָהָב טָהוֹר
  choice: మేలిమి బంగారపు
  rationale: ముందున్న మూడు రకాల ఉపకరణాల పదార్థాన్ని సమష్టిగా నిర్దేశిస్తుంది. ‘మేలిమి బంగారం’ పవిత్ర సామగ్రి సందర్భానికి తగిన, సహజమైన తెలుగు ప్రయోగం.
- source_word: כְפוֹרֵי
  choice: గిన్నెలు
  rationale: ఈ జాబితాలో గిన్నె ఆకారమున్న పాత్రలను సూచిస్తుంది. ముందున్న מִּזְרָקוֹת నుండి పదభేదాన్ని నిలుపుతుంది.
- source_word: בְּמִשְׁקָל
  choice: దాని బరువు చొప్పున
  rationale: ప్రతి పాత్రకు ఉపయోగించవలసిన లోహం విడివిడిగా బరువు ప్రకారం కేటాయించబడిందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: ఒక్కొక్క గిన్నెకు
  rationale: హీబ్రూలోని పదపునరుక్తి పంపిణీ భావాన్ని—ప్రతి పాత్రను విడివిడిగా పరిగణించడం—తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలోని రూపాన్ని పాదటిప్పణి నమోదు చేస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: బంగారానికి భిన్నంగా పేర్కొన్న లోహానికి సాధారణ, నిర్దిష్ట తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జాబితా శైలిని నిలిపాం. ఈ వచనం ముందటి వాక్య నిర్మాణాన్ని కొనసాగిస్తున్నందున ‘అలాగే’తో ప్రారంభించాం. హీబ్రూ పంపిణీ పునరుక్తిని ప్రధాన పాఠ్యంలో సహజమైన ‘ఒక్కొక్క’ రూపంలో ఇచ్చి, దాని మూలరూపాన్ని పాదటిప్పణిలో సంరక్షించాం.
