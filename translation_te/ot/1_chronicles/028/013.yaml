id: 1CH.28.13
reference: 1 Chronicles 28:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/לְ/מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם וּֽ/לְ/כָל מְלֶ֖אכֶת עֲבוֹדַ֣ת בֵּית יְהוָ֑ה וּֽ/לְ/כָל כְּלֵ֖י עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: te
  text: యాజకుల, లేవీయుల విభాగాల[a] కోసం, యెహోవా మందిర సేవకు సంబంధించిన అన్ని పనుల కోసం, యెహోవా మందిర సేవకు సంబంధించిన అన్ని ఉపకరణాల[b] కోసం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రమాల’.
    reason: מַחְלְקוֹת అనేది వ్యవస్థీకృత సేవా విభాగాలు లేదా వంతులవారీ క్రమాలను సూచించగలదు.
  - marker: b
    text: లేదా ‘సేవా సామగ్రి’ లేదా ‘సేవా వస్తువులు’.
    reason: כְּלֵי పాత్రలకు మాత్రమే పరిమితం కాకుండా, మందిర సేవలో ఉపయోగించే వస్తువులు లేదా ఉపకరణాల విస్తృత సమూహాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: విభాగాలు
  rationale: దినవృత్తాంతాల్లో ఈ పదం యాజకులు, లేవీయులు నియమిత క్రమంలో సేవ చేసే వ్యవస్థీకృత బృందాలను సూచిస్తుంది. ‘విభాగాలు’ పరిపాలనా భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఇశ్రాయేలు యాజక వర్గానికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి, వారి సేవా బాధ్యతకు సంబంధించిన స్థిరమైన జాతి-సేవా నామం.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: సేవకు సంబంధించిన పనులు
  rationale: מְלֶאכֶת అనే విస్తృత ‘పని’ భావాన్నీ, עֲבוֹדַת అనే నియమిత ఆలయసేవ భావాన్నీ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’. ఇక్కడ దేవాలయ సందర్భం స్పష్టంగా ఉన్నందున ‘మందిరం’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది; యెహోవా అనే దైవనామం ప్రత్యక్షంగా నిలుపబడింది.
- source_word: כְּלֵי עֲבוֹדַת
  choice: సేవా సామగ్రి
  rationale: כְּלֵי పాత్రలకు మాత్రమే పరిమితం కాకుండా సేవలో వాడే వస్తువులు, ఉపకరణాలన్నిటినీ సూచించగలదు. ‘సేవా సామగ్రి’ ఆ విస్తృత సమూహార్థాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לְכָל
  choice: అన్నిటి కోసం / అంతటి కోసం
  rationale: పునరావృతమైన לְ־తో కూడిన כָּל జాబితాలోని ప్రతి అంశాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘అన్నిటి కోసం’, సమూహవాచక సామగ్రితో ‘అంతటి కోసం’ వాడబడ్డాయి.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో దైవనామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వచనం ముందరి వాక్యంపై ఆధారపడే జాబితా భాగం కాబట్టి మూలంలోని ‘కోసం’ నిర్మాణాన్ని, చివర ‘కూడా’తో కొనసాగింపు భావాన్ని నిలిపాం. ‘మందిరం’ ద్వారా సందర్భాన్ని స్పష్టం చేశాం; ‘సేవా సామగ్రి’ ద్వారా పాత్రలకే పరిమితం కాని సమూహార్థాన్ని కాపాడాం.
