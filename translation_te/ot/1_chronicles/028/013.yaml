revisions:
- from: యాజకుల, లేవీయుల విభాగాల[a] కోసం, యెహోవా మందిర సేవకు సంబంధించిన పనులన్నిటి కోసం, యెహోవా మందిర సేవా సామగ్రి[b] అంతటి కోసం కూడా.
  to: యాజకుల, లేవీయుల విభాగాల[a] కోసం, యెహోవా మందిర సేవకు సంబంధించిన అన్ని పనుల కోసం, యెహోవా మందిర సేవకు సంబంధించిన అన్ని ఉపకరణాల[b] కోసం.
  rationale: సవరించిన పాఠం మూలంలోని మూడు ‘కోసం’ పదబంధాల జాబితా నిర్మాణాన్ని నిలుపుతుంది. ‘అన్ని పనులు’ మְלֶאכֶת యొక్క విస్తృత పనిభావాన్ని, ‘మందిర సేవకు సంబంధించిన’ עֲבוֹדַת בֵּית יְהוָה యొక్క సంబంధాన్ని, ‘అన్ని ఉపకరణాలు’ כְּלֵי యొక్క విస్తృతార్థాన్ని వ్యక్తం చేస్తాయి. దైవనామాన్ని ముసాయిదాలో ఉన్నట్లే ‘యెహోవా’గా ఉంచాం.
  reviewer_model: gpt-5.6-terra
