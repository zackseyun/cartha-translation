translation:
  language: te
  text: బంగారు దీపస్తంభాలకూ వాటి బంగారు దీపాలకూ కావలసిన బరువును—ప్రతి దీపస్తంభానికీ దాని దీపాలకూ తగిన బరువును—అలాగే వెండి దీపస్తంభాలకూ, ప్రతి దీపస్తంభానికీ దాని దీపాలకూ, ప్రతి దీపస్తంభపు సేవకు అనుగుణంగా కావలసిన బరువును ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “దీపస్తంభం దీపస్తంభం బరువు చొప్పున,” “దీపస్తంభం దీపస్తంభం సేవ చొప్పున” అని ఉంది. ఇది ప్రతి దీపస్తంభాన్ని విడివిడిగా సూచించే పంపిణీ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: బరువు
  rationale: ఆలయ సామగ్రికి కేటాయించిన లోహపు కొలిచిన బరువును సూచిస్తుంది; ఆధునిక తెలుగులో ‘బరువు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מְנֹרוֹת
  choice: దీపస్తంభాలు
  rationale: ఈ పదం కేవలం దీపాలను కాక, వాటిని మోసే ఆలయ దీపస్తంభాలను సూచిస్తుంది.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: దీపాలు
  rationale: దీపస్తంభంపై అమర్చే వేర్వేరు దీపాలను సూచిస్తూ, దీపస్తంభం నుంచి స్పష్టంగా వేరు చేస్తుంది.
- source_word: זָהָב
  choice: బంగారు
  rationale: దీపస్తంభాలూ వాటి దీపాలూ బంగారంతో చేయబడాలని మూలంలో రెండుసార్లు చెప్పిన భావాన్ని నిలుపుతుంది.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: ఒక్కొక్క దీపస్తంభానికీ ... తగిన బరువు
  rationale: ‘దీపస్తంభం దీపస్తంభం’ అనే హెబ్రీ పంపిణీ ప్రయోగాన్ని సహజమైన తెలుగులో ‘ఒక్కొక్క’గా వ్యక్తపరుస్తుంది.
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: అలాగే వెండి దీపస్తంభాలకూ
  rationale: బంగారు దీపస్తంభాలతో ఉన్న సమాంతర నిర్మాణాన్ని సహజ తెలుగులో కొనసాగిస్తుంది.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: ఒక్కొక్క దీపస్తంభం చేసే సేవకు తగినట్లుగా
  rationale: עֲבוֹדָה ఆలయ సందర్భంలో సేవ, పని లేదా నిర్దిష్ట వినియోగాన్ని సూచించవచ్చు; ‘సేవ’ ఆరాధనా సందర్భాన్ని నిలుపుతూ మూలంలోని స్వల్ప అస్పష్టతను కూడా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ సామగ్రి జాబితాకు తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. వచనం ముందున్న క్రియపై ఆధారపడిన జాబితా భాగం కావడంతో, తెలుగులో వాక్యాన్ని సంపూర్ణంగా చేయడానికి ‘ఇచ్చాడు’ చేర్చబడింది; భావం సందర్భం నుంచి వస్తుంది.
