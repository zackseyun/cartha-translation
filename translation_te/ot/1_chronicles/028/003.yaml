  to: 'కాని దేవుడు నాతో ఇలా అన్నాడు: “నీవు నా నామం కోసం ఒక గృహాన్ని[a] కట్టకూడదు. ఎందుకంటే నీవు యుద్ధాలు చేసే వాడివి[b], రక్తం చిందించావు.”'
