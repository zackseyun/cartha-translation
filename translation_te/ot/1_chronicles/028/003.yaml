id: 1CH.28.3
reference: 1 Chronicles 28:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: te
  text: 'కాని దేవుడు నాతో ఇలా అన్నాడు: “నీవు నా నామం కోసం ఒక గృహాన్ని[a] కట్టకూడదు. ఎందుకంటే నీవు యుద్ధాలు చేసే వాడివి[b], రక్తం చిందించావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా నామం కోసం ఒక గృహం’ అంటే దేవుని నామంతోను ఆయన సన్నిధితోను ప్రత్యేకంగా సంబంధమున్న దేవాలయం.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘యుద్ధాల మనిషివి’; ‘యుద్ధవీరుడివి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: కాని దేవుడు
  rationale: וְ అనే సంధి సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, దావీదు కట్టాలనుకున్న కోరికకు దేవుని నిషేధం విరుద్ధంగా నిలుస్తున్నందున సందర్భంలో ‘కాని’ సహజంగా ఉంది; אֱלֹהִים ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: אָמַר לִי
  choice: నాతో ఇలా అన్నాడు
  rationale: ‘నాతో అన్నాడు’ అనేది హీబ్రూ మాటల నివేదిక రూపాన్ని నిలుపుతుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: לֹא תִבְנֶה
  choice: నీవు ... కట్టకూడదు
  rationale: לֹא తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ నిషేధం లేదా దైవ నిర్ణయాన్ని వ్యక్తం చేస్తుంది. తెలుగు ‘కట్టకూడదు’ అనుమతి లేదనే భావాన్ని గంభీరంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַיִת
  choice: ఒక గృహం
  rationale: בַיִת యొక్క ప్రాథమిక అర్థం ‘ఇల్లు/గృహం.’ సందర్భంలో ఇది దేవాలయాన్ని సూచించినా, ‘గృహం’ మూలంలోని రూపకాన్ని నిలుపుతుంది; వివరణను పాదటిప్పణిలో ఇచ్చాం.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: దేవుని నామంతోను ఆయన సన్నిధితోను సంబంధమున్న పవిత్రస్థలాన్ని సూచించే బైబిలు ప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దేవుడు ఇచ్చిన కారణాన్ని స్పష్టంగా పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אִישׁ מִלְחָמוֹת
  choice: యుద్ధాలు చేసినవాడివి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యుద్ధాల మనిషి’ అని ఉంది. బహువచనమైన ‘యుద్ధాలు’ను నిలుపుతూ, తెలుగులో సహజంగా ఉండేలా క్రియాత్మకంగా అనువదించాం.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: రక్తం చిందించావు
  rationale: דמים שפך అనే హీబ్రూ నుడికారం తెలుగులో సహజంగా ‘రక్తం చిందించడం’ అవుతుంది. హీబ్రూలో ‘రక్తాలు’ అని బహువచనం ఉన్నా, తెలుగులో ఏకవచనమే సహజం.
theological_decisions:
- issue: దావీదు దేవుని గృహాన్ని కట్టకూడదని చెప్పడానికి కారణం
  choice: దావీదు యుద్ధాలు చేసినవాడు కావడం, రక్తం చిందించడం దేవుడు తెలిపిన కారణాలుగా మాత్రమే వాక్యం చెబుతుంది.
  alternative: ఆ రక్తపాతం తప్పనిసరిగా పాపపూరిత హింస అని గానీ, న్యాయమైన యుద్ధమే అయినా ఆచారపరంగా అనర్హత కలిగించిందని గానీ స్పష్టీకరించడం.
  rationale: రక్తపాతం నైతిక అపరాధమా, ఆచారపరమైన అనర్హతా, లేక శాంతికి సంబంధించిన ఆలయ నిర్మాణ పాత్రకు తగనిదా అని హీబ్రూ వాక్యం నిర్ణయించదు. అందువల్ల అనువాదం ఆ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘గృహం,’ ‘నామం’ వంటి పదాలు మూలంలోని ఆలయ-నామ సంబంధిత బైబిలు రూపకాన్ని నిలుపుతాయి; ‘యుద్ధాలు చేసినవాడివి’ పునరావృత సైనిక కార్యాచరణను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
