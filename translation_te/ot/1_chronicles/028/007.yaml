id: 1CH.28.7
reference: 1 Chronicles 28:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: te
  text: అతడు ఈ రోజు చేస్తున్నట్టే నా ఆజ్ఞలను, నా న్యాయవిధులను పాటించడంలో స్థిరంగా ఉంటే, అతని రాజ్యాన్ని శాశ్వతంగా స్థిరపరుస్తాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని రాజ్యాన్ని దృఢపరుస్తాను” లేదా “అతని రాజ్యాన్ని స్థాపిస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: స్థిరపరుస్తాను
  rationale: כון హిఫీల్ రూపం ‘దృఢంగా నిలిచేలా చేయడం, స్థాపించడం’ అనే భావాన్ని ఇస్తుంది. రాజ్య సందర్భంలో ‘స్థిరపరుస్తాను’ సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: מַלְכוּתוֹ
  choice: అతని రాజ్యాన్ని
  rationale: מַלְכוּת పదానికి రాజరికం, పరిపాలన, రాజ్యం అనే భావాలు ఉండవచ్చు. వంశపారంపర్య స్థిరత్వ సందర్భంలో ‘రాజ్యం’ విస్తృతమైన, సహజమైన ఎంపిక.
- source_word: עַד לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: ఈ పదబంధం నిరంతర కాలాన్ని సూచిస్తుంది; ‘శాశ్వతంగా’ దాని బలాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם
  choice: ఉంటే
  rationale: אִם స్పష్టమైన షరతును ప్రవేశపెడుతుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఉంటే’ ఆ షరతును సహజంగా, స్పష్టంగా ఉంచుతుంది.
- source_word: יֶחֱזַק
  choice: స్థిరంగా ఉంటే
  rationale: חזק ఇక్కడ శారీరక బలం కంటే విధేయతలో దృఢంగా, పట్టుదలతో ఉండడాన్ని సూచిస్తుంది. ‘స్థిరంగా ఉంటే’ ఆ భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: పాటించడంలో
  rationale: עשה అక్షరార్థంగా ‘చేయడం’; అయితే ఆజ్ఞలు, న్యాయవిధులతో తెలుగులో ‘పాటించడం’ సహజంగా ఉండి కార్యరూప విధేయతను తెలియజేస్తుంది.
- source_word: מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: מִצְוֹתַי దేవుని ఆదేశాలను సూచిస్తుంది. ‘నా ఆజ్ఞలు’ స్పష్టమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: וּמִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: מִשְׁפָּטִיםకు తీర్పులు, శాసనాలు, న్యాయనియమాలు అనే అర్థాలు ఉన్నాయి. ‘న్యాయవిధులు’ న్యాయపరమైన స్వరాన్ని కాపాడుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు చేస్తున్నట్టే
  rationale: హెబ్రీయుల నుడికారం అక్షరార్థంగా ‘ఈ దినంలాగా’; సందర్భంలో ప్రస్తుతం అతడు చేస్తున్న విధంగానే కొనసాగడాన్ని సూచిస్తుంది. ఈ రూపం ఆ సూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సొలొమోను రాజ్యాన్ని స్థిరపరచే వాగ్దానంలోని షరతు
  choice: ‘ఉంటే’ అనే స్పష్టమైన షరతుతో అనువదించడం
  alternative: షరతును సొలొమోను స్వభావానికి సంబంధించిన సాధారణ వివరణగా మృదువుగా చెప్పడం
  rationale: אִם నేరుగా షరతును సూచిస్తుంది. అందువల్ల ఇతర దావీదు వాగ్దానాలతో సమన్వయం చేయడానికి ప్రయత్నించకుండా ఈ వచనంలోని షరతుతో కూడిన ధార్మిక ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీయు వాక్యంలోని షరతును స్పష్టంగా కాపాడుతూ, ‘ఈ రోజు’ అనే నుడికారాన్ని ప్రస్తుత విధేయత కొనసాగింపుగా పాఠ్యంలోనే సహజంగా వ్యక్తం చేసింది.
