source:
  edition: WLC
  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: te
  text: 'అప్పుడు దావీదు రాజు లేచి నిలబడి ఇలా అన్నాడు: “నా సహోదరులారా, నా ప్రజలారా, నా మాట వినండి. యాహ్వే నిబంధన మందసం కోసం—మన దేవుని పాదపీఠం కోసం—ఒక విశ్రాంతి మందిరాన్ని కట్టాలనే సంకల్పం నా హృదయంలో ఉండేది.[a] దాన్ని కట్టడానికి నేను ఏర్పాట్లు చేశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్రాంతి మందిరం”ను “విశ్రాంతి స్థలం” అని కూడా అనువదించవచ్చు; ఇది మందసం స్థిరంగా ఉండే నివాసస్థలాన్ని సూచిస్తుంది. “మన దేవుని పాదపీఠం” అనే మాట మందసాన్ని దేవుని సన్నిధితో సంబంధం ఉన్న పాదపీఠంగా వర్ణించవచ్చు; కీర్తన 132:7 చూడండి.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: וַיָּקָם דָּוִיד הַמֶּלֶךְ עַל רַגְלָיו
  choice: దావీదు రాజు లేచి నిలబడి
  rationale: קום తో עַל רַגְלָיו కలిసినప్పుడు ‘తన కాళ్లపై లేచాడు’ అనే భావం వస్తుంది; ఆధునిక తెలుగులో ‘లేచి నిలబడి’ సహజంగా ఆ చర్యను తెలియజేస్తుంది.
- source_word: שְׁמָעוּנִי
  choice: నా మాట వినండి
  rationale: שמע ఆజ్ఞారూపం, ప్రథమ పురుష ఏకవచన కర్మప్రత్యయంతో ఉంది; ‘నన్ను వినండి’ కంటే సభా ప్రసంగంలో ‘నా మాట వినండి’ సహజంగా ఉంటుంది.
- source_word: אַחַי וְעַמִּי
  choice: నా సహోదరులారా, నా ప్రజలారా
  rationale: పురుష బహువచన బంధుత్వ పదాన్ని ‘సహోదరులు’గా నిలుపుతూ, సంబోధనను తెలుగులో సహజంగా వ్యక్తం చేసింది.
- source_word: אֲנִי עִם לְבָבִי
  choice: సంకల్పం నా హృదయంలో ఉండేది
  rationale: హృదయంలో ఉద్దేశం లేదా దృఢనిశ్చయం ఉండటాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన, గంభీరమైన తెలుగులో అందిస్తుంది.
- source_word: בֵּית מְנוּחָה
  choice: ఒక విశ్రాంతి మందిరం
  rationale: ‘విశ్రాంతి గృహం’ అనే అక్షరార్థాన్ని ఆరాధనాసంబంధమైన స్థిర నివాస భావంతో తెలుగులో గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం కోసం
  rationale: నిబంధనకు సంబంధించిన పవిత్ర పెట్టెను సూచించే אֲרוֹן కు ప్రాచుర్యంలో ఉన్న గౌరవప్రదమైన ‘మందసం’ను వాడి, నిర్మాణ సంబంధాన్ని స్పష్టంగా ఉంచింది.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: మన దేవుని పాదపీఠం కోసం
  rationale: మూలంలోని ‘పాదపీఠం’ రూపకాన్ని వివరణతో భర్తీ చేయకుండా నిలుపుతుంది; డాష్‌లు ముందున్న మందసంతో దీనికున్న వివరణాత్మక సంబంధాన్ని సూచిస్తాయి.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: దాన్ని కట్టడానికి నేను ఏర్పాట్లు చేశాను
  rationale: హిఫీల్ రూపంలోని సిద్ధపరచే భావాన్ని ‘ఏర్పాట్లు చేశాను’గా, సందర్భం ద్వారా తెలిసే కర్మను ‘దాన్ని’గా సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’.
- issue: మందసం మరియు ‘మన దేవుని పాదపీఠం’ మధ్య సంబంధం
  choice: డాష్‌లతో వివరణాత్మక సంబంధాన్ని సూచించడం
  alternative: ‘మరియు మన దేవుని పాదపీఠం కోసం’ అని సమాంతరంగా అనువదించడం
  rationale: హీబ్రూలో וְ ఉన్నప్పటికీ, సందర్భంలో పాదపీఠం మందసాన్నే వర్ణించే అవకాశం బలంగా ఉంది. డాష్‌లు ఈ సంబంధాన్ని సూచిస్తాయి గాని రూపకాన్ని పూర్తిగా నిర్వచించవు.
- issue: אַחַי లోని లింగసూచక బంధుత్వ పదం
  choice: నా సహోదరులారా
  alternative: నా బంధువులారా
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని సమతలీకరించకుండా నిలుపుతుంది; సభలో విస్తృత ప్రతినిధి వాడుక ఉండవచ్చనే విషయాన్ని ప్రధాన పాఠ్యంలో అతిగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ రాజప్రసంగానికి తగిన గంభీరతతో రచించబడింది. మూలంలోని హృదయం, విశ్రాంతి, పాదపీఠం రూపకాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా మార్చింది.
