  to: 'అప్పుడు దావీదు రాజు లేచి నిలబడి ఇలా అన్నాడు: “నా సహోదరులారా, నా ప్రజలారా, నా మాట వినండి. యాహ్వే నిబంధన మందసం కోసం—మన దేవుని పాదపీఠం కోసం—ఒక విశ్రాంతి మందిరాన్ని కట్టాలనే సంకల్పం నా హృదయంలో ఉండేది.[a] దాన్ని కట్టడానికి నేను ఏర్పాట్లు చేశాను.”'
  rationale: ప్రధాన పాఠ్యానికి అవసరమైన ఏకైక మార్పు దైవనామాన్ని ‘యెహోవా’ నుండి ‘యాహ్వే’గా మార్చడం. మిగిలిన పదప్రయోగం మూలంలోని భావం, రూపకాలు, మరియు బహిరంగ ప్రసంగపు గంభీర రీతిని సముచితంగా నిలుపుతుంది. గమనికలో పాదపీఠపు పదబంధం మందసంతో సంబంధించవచ్చనే వ్యాఖ్యను నిర్దిష్ట సిద్ధాంత నిర్ధారణగా కాకుండా సాధ్యమైన వ్యాఖ్యగా ఉంచాం.
