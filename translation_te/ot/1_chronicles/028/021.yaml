  to: ఇదిగో, దేవుని మందిరంలోని సమస్త సేవ కొరకు యాజకుల, లేవీయుల విభాగాలు ఉన్నాయి. ప్రతి పనిలోనూ, ప్రతి విధమైన సేవకూ జ్ఞానంతో నైపుణ్యమున్న ప్రతి స్వచ్ఛంద సేవకుడు నీతో ఉంటాడు[a]. అధికారులు, ప్రజలందరూ నీ మాటలన్నిటికీ[b] సిద్ధంగా ఉంటారు.
