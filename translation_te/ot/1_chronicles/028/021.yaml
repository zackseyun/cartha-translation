  text: וְ/הִנֵּ֗ה מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם לְ/כָל עֲבוֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/עִמְּ/ךָ֙ בְ/כָל מְלָאכָ֜ה לְ/כָל נָדִ֤יב בַּֽ/חָכְמָה֙ לְ/כָל עֲבוֹדָ֔ה וְ/הַ/שָּׂרִ֥ים וְ/כָל הָ/עָ֖ם לְ/כָל דְּבָרֶֽי/ךָ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: te
  text: ఇదిగో, దేవుని మందిరంలోని సమస్త సేవ కొరకు యాజకుల, లేవీయుల విభాగాలు ఉన్నాయి. ప్రతి పనిలోనూ, ప్రతి విధమైన సేవకూ జ్ఞానంతో నైపుణ్యమున్న ప్రతి స్వచ్ఛంద సేవకుడు నీతో ఉంటాడు[a]. అధికారులు, ప్రజలందరూ నీ మాటలన్నిటికీ[b] సిద్ధంగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానంలో నైపుణ్యమున్న ప్రతి ఇష్టపూర్వకుడు.” హీబ్రూలో అక్షరార్థంగా, “జ్ఞానంలో ప్రతి ఇష్టపూర్వకుడు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ మాటలన్నిటికీ”; అంటే, నీ సూచనలను లేదా నీవు చెప్పే సంగతులను అమలు చేయడానికి సిద్ధంగా ఉంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షిస్తూ ధైర్యం చెప్పే హీబ్రూ సూచనాత్మక ప్రయోగాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: מַחְלְקוֹת הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకుల, లేవీయుల విభాగాలు
  rationale: ఆలయ సేవ కోసం క్రమబద్ధంగా ఏర్పాటు చేసిన వర్గాలను సూచిస్తుంది; రెండు ప్రత్యేక సేవక సమూహాలనూ స్పష్టంగా ఉంచుతుంది.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిర సేవ అంతటికీ
  rationale: ‘దేవుని ఇల్లు’ అనే మూలభావంలోని ఆరాధనా స్థల సూచనను ‘దేవుని మందిరం’గా సహజంగా వ్యక్తం చేస్తూ, సేవ యొక్క సంపూర్ణ పరిధిని నిలుపుతుంది.
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: ప్రతి పనిలోనూ … నీతో ఉంటాడు
  rationale: సొలొమోనుకు తోడుగా ఉండి పనిలో పాలుపంచుకునే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: జ్ఞాననైపుణ్యం గల ప్రతి స్వచ్ఛంద సేవకుడు
  rationale: נָדִיב లోని ఇష్టపూర్వకతను ‘స్వచ్ఛంద’తో, חָכְמָה లోని ఆచరణాత్మక జ్ఞానం/నైపుణ్యాన్ని ‘జ్ఞాననైపుణ్యం’తో వ్యక్తం చేస్తుంది; మూలంలోని ఏకవచన పురుష రూపాన్నీ నిలుపుతుంది.
- source_word: לְכָל עֲבוֹדָה
  choice: ప్రతి విధమైన సేవకు కావలసిన
  rationale: అందుబాటులో ఉన్న నైపుణ్యవంతులు అన్ని రకాల సేవలకు తగినవారనే సంబంధాన్ని సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: וְהַשָּׂרִים וְכָל הָעָם
  choice: అధికారులు, ప్రజలందరూ
  rationale: రాజ్య పరిపాలనా సందర్భంలోని שָׂרִים ను వంశపారంపర్య రాజకుమారులుగా కాక అధికారులుగా అనువదించి, ప్రజల సమగ్ర మద్దతును నిలుపుతుంది.
- source_word: לְכָל דְּבָרֶיךָ
  choice: నీ మాటలన్నిటికీ సిద్ధంగా ఉంటారు
  rationale: అక్షరార్థమైన ‘నీ మాటలన్నిటికీ’ అనే రూపాన్ని కనిపించేలా ఉంచుతూ, వాటిని అమలు చేయడానికి సిద్ధంగా ఉండే సందర్భార్థాన్ని తెలుపుతుంది.
theological_decisions:
- issue: נָדִיב లోని లింగసూచన మరియు స్వచ్ఛందత
  choice: ప్రతి స్వచ్ఛంద సేవకుడు
  alternative: ఇష్టపూర్వకంగా ముందుకు వచ్చే ప్రతి ఒక్కరూ
  rationale: హీబ్రూలోని పురుష ఏకవచన రూపాన్ని నిలుపుతూ, సందర్భంలో ప్రధానమైన ఇష్టపూర్వక సేవ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: בֵּית הָאֱלֹהִים అనువాదం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు
  rationale: మూలంలోని ‘ఇల్లు’ రూపకానికి ఆరాధనా స్థలమనే సందర్భార్థం ఉంది. ఆధునిక తెలుగులో ‘దేవుని మందిరం’ సహజంగా, గౌరవప్రదంగా ఉండి అదే నిర్దిష్ట స్థలాన్ని సూచిస్తుంది.
- issue: לְכָל דְּבָרֶיךָ యొక్క ఆజ్ఞార్థ సందర్భం
  choice: నీ మాటలన్నిటికీ సిద్ధంగా ఉంటారు
  alternative: నీ ఆజ్ఞలన్నిటినీ పాటిస్తారు
  rationale: ‘మాటలు’ అనే హీబ్రూ విస్తృత పదాన్ని ‘ఆజ్ఞలు’గా మాత్రమే పరిమితం చేయకుండా, సందర్భంలోని విధేయత/సిద్ధతను కూడా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ఇదిగో,’ ‘యాజకులు,’ ‘లేవీయులు,’ ‘దేవుని మందిరం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుతూ, అసహజమైన పదానువాదాన్ని నివారించాం. חָכְמָה లోని జ్ఞానం–ఆచరణాత్మక నైపుణ్యం రెండింటినీ ‘జ్ఞాననైపుణ్యం’ ద్వారా సూచించాం.
