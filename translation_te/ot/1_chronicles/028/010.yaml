- from: ఇప్పుడు జాగ్రత్తగా ఆలోచించు[a]; ఎందుకంటే పరిశుద్ధస్థలంగా ఉండేందుకు ఒక మందిరాన్ని కట్టడానికి యాహ్వే నిన్ను ఎన్నుకున్నాడు. ధైర్యంగా ఉండి, దాన్ని నిర్మించు.
