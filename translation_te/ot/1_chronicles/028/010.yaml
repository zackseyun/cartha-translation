source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: te
  text: ఇప్పుడు గమనించు[a]; ఎందుకంటే పరిశుద్ధస్థలం కోసం ఒక మందిరాన్ని కట్టడానికి యాహ్వే నిన్ను ఎన్నుకున్నాడు. బలంగా ఉండు, దాన్ని చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడు ఆలోచించు,” “ఇప్పుడు శ్రద్ధ చూపు.” ఈ ఆజ్ఞ కేవలం కంటితో చూడడాన్ని కాక, శ్రద్ధగా పరిగణించమనే పిలుపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: ఇప్పుడు జాగ్రత్తగా ఆలోచించు
  rationale: ראה అనే ఆజ్ఞ ఇక్కడ కేవలం కంటితో చూడడాన్ని కాక, శ్రద్ధగా గ్రహించి పరిగణించడాన్ని సూచిస్తుంది; עתה ఆ పిలుపుకు తక్షణతను ఇస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తదుపరి మాట ముందున్న హెచ్చరికకు, ఆజ్ఞకు కారణాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: בָּחַר בְּךָ
  choice: నిన్ను ఎన్నుకున్నాడు
  rationale: ఒక నిర్దిష్ట బాధ్యత కోసం దేవుడు చేసిన ఎంపికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: పరిశుద్ధస్థలంగా ఉండేందుకు ఒక మందిరాన్ని కట్టడానికి
  rationale: בית యొక్క ‘ఇల్లు/మందిరం’ భావాన్నీ, מקדש యొక్క పరిశుద్ధస్థల భావాన్నీ నిలుపుతూ, హీబ్రూ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲזַק
  choice: ధైర్యంగా ఉండు
  rationale: ఈ నియామక సందర్భంలో బలం, స్థిరనిశ్చయం, సాహసం కలిగియుండమనే ప్రోత్సాహాన్ని సహజంగా అందిస్తుంది.
- source_word: וַעֲשֵׂה
  choice: దాన్ని నిర్మించు
  rationale: עשה సాధారణంగా ‘చేయి’ అయినప్పటికీ, ఇక్కడ ముందున్న నిర్మాణ కార్యాన్నే సూచిస్తుంది; తెలుగులో స్పష్టత కోసం సందర్భార్థాన్ని వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: בַּיִת לַמִּקְדָּשׁ పదబంధం
  choice: పరిశుద్ధస్థలంగా ఉండేందుకు ఒక మందిరం
  alternative: పరిశుద్ధస్థలం కోసం ఒక ఇల్లు; దేవాలయం
  rationale: ఇది సొలొమోను నిర్మించవలసిన దేవాలయాన్ని సూచించినా, రెండు హీబ్రూ నామవాచకాల భావాన్ని పూర్తిగా ఒకే పదంలో కలిపేయకుండా వాటి సంబంధాన్ని నిలుపుతుంది.
- issue: חֲזַק లోని బలం/ధైర్యం భావం
  choice: ధైర్యంగా ఉండు
  alternative: బలంగా ఉండు; దృఢంగా ఉండు
  rationale: శారీరక బలం మాత్రమే కాక కార్యాన్ని చేపట్టే స్థిరనిశ్చయాన్ని సూచించే నియామక సందర్భానికి ‘ధైర్యంగా’ సహజంగా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘మందిరం’ అనే పదం בית యొక్క సందర్భార్థాన్ని సహజంగా అందిస్తుండగా, ‘పరిశుద్ధస్థలంగా’ מקדש భావాన్ని వేరుగా నిలుపుతుంది.
