id: 1CH.28.11
reference: 1 Chronicles 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: te
  text: అప్పుడు దావీదు తన కుమారుడైన సొలొమోనుకు ప్రవేశ మంటపం, దాని భవనాలు, దాని ఖజానా గదులు, దాని పైగదులు, దాని లోపలి గదులు, ప్రాయశ్చిత్తపు మూత ఉన్న గది[a]—వీటి నమూనాను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరుణాసనం ఉన్న గది.” హీబ్రూ పదం నిబంధన మందసం మీద, అతి పరిశుద్ధ స్థలంలో ఉన్న మూతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: నమూనా
  rationale: ఈ పదం ఆకృతి, నమూనా లేదా నిర్మాణ ప్రణాళికను సూచించగలదు. ఆలయ నిర్మాణ సందర్భంలో ‘నమూనా’ సహజంగా ఉండి, దావీదు సొలొమోనుకు అందించిన నిర్దిష్ట రూపకల్పన భావాన్ని నిలుపుతుంది.
- source_word: הָאוּלָם
  choice: మంటపం
  rationale: ఇది గొప్ప భవనపు ప్రవేశ మండపాన్ని సూచిస్తుంది. ఆలయ నిర్మాణ సందర్భంలో ‘మంటపం’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: בָּתָּיו
  choice: దాని భవనాలు
  rationale: బహువచన రూపం అక్షరార్థంగా ‘దాని ఇళ్లు’ అయినప్పటికీ, ఇక్కడ ఆలయ సముదాయంలోని నిర్మాణ విభాగాలను సూచిస్తుంది; అందువల్ల ‘భవనాలు’ సందర్భోచితంగా, సహజంగా ఉంది.
- source_word: גַנְזַכָּיו
  choice: ఖజానా గదులు
  rationale: విలువైన వస్తువులు లేదా ప్రతిష్ఠిత సామగ్రి భద్రపరచే గదులను సూచించే ఈ పదానికి ‘ఖజానా గదులు’ స్పష్టమైన సమానార్థకం.
- source_word: עֲלִיֹּתָיו
  choice: పైగదులు
  rationale: పై అంతస్తులోని గదులు లేదా మేడగదులను సూచిస్తుంది. ‘పైగదులు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: లోపలి గదులు
  rationale: ‘అంతరంగ గదులు’ కంటే ‘లోపలి గదులు’ ఆధునిక తెలుగులో సహజం; హీబ్రూలో లేని అత్యుత్తమ స్థాయి భావాన్ని జోడించదు.
- source_word: בֵית הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత ఉన్న మందిరం
  rationale: అక్షరార్థంగా ‘కప్పోరెత్ యొక్క గృహం.’ ఇక్కడ అది నిబంధన మందసం మీదున్న మూతను కలిగిన అతి పరిశుద్ధ స్థలాన్ని సూచిస్తుంది. ‘ఉన్న మందిరం’ అని చెప్పడం సంబంధాన్ని తెలుగులో స్పష్టం చేస్తూ మూలంలోని ఆలయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: וַיִּתֵּן
  choice: అప్పుడు ... ఇచ్చాడు
  rationale: వావ్-కాన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: כַּפֹּרֶת అనే పరిశుద్ధస్థల పదం అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాసనం
  rationale: כַּפֹּרֶת నిబంధన మందసం మీదున్న మూతను సూచిస్తుంది; ప్రాయశ్చిత్త ఆచారంతో దాని సంబంధాన్ని ‘ప్రాయశ్చిత్తపు మూత’ స్పష్టంగా తెలియజేస్తుంది. సంప్రదాయ ప్రత్యామ్నాయమైన ‘కరుణాసనం’ను పాదసూచికలో ఉంచి పదంలోని ఆలయపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ఆలయ నిర్మాణ పదాలకు అతిగా సంస్కృతీకరించిన రూపాలను నివారించి, మూలంలోని జాబితా నిర్మాణాన్ని నిలిపాం.
