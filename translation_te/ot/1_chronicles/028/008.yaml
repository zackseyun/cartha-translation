source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: te
  text: ఇప్పుడు, ఇశ్రాయేలు అంతటి సమక్షంలో—అంటే యాహ్వే సమాజం సమక్షంలోను—మన దేవుడు వింటుండగా, మీ దేవుడైన యాహ్వే ఆజ్ఞలన్నిటినీ పాటించండి, వాటిని శ్రద్ధగా అనుసరించండి. తద్వారా మీరు ఆ మంచి భూమిని స్వాధీనం చేసుకొని[a], మీ తరువాత మీ కుమారులకు[b] దానిని ఎప్పటికీ వారసత్వంగా ఇవ్వగలరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ మంచి భూమిని వారసత్వంగా పొందుకొని.’ హీబ్రూ క్రియ సందర్భానుసారం వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ‘కుమారులు’ అనే పుంలింగ బహువచన పదమే ఉంది; మరింత సాధారణమైన ‘పిల్లలు’ అనే పదం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి ప్రసంగంతో ఉన్న అనుసంధానాన్ని, ఇప్పుడు వచ్చే విజ్ఞప్తికి మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి సమక్షంలో
  rationale: అక్షరార్థమైన ‘కళ్ల ఎదుట’ అనే హీబ్రూ నుడికారంలోని బహిరంగ సాక్ష్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קְהַל יְהוָה
  choice: యాహ్వే సమాజమైన
  rationale: קהל అనేది కూడిన ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటూ ఆ అధికారిక కూడిక భావాన్ని నిలుపుతుంది.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: మన దేవుడు వింటుండగా
  rationale: ‘మన దేవుని చెవుల్లో’ అనే హీబ్రూ నుడికారాన్ని కృత్రిమంగా కాకుండా, దేవుడు సాక్షిగా వింటున్నాడనే భావంతో అందిస్తుంది.
- source_word: שִׁמְרוּ
  choice: పాటించండి
  rationale: ఆజ్ఞల సందర్భంలో కాపాడడం లేదా గమనించడం కంటే విధేయతతో ఆచరించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְדִרְשׁוּ
  choice: వాటిని శ్రద్ధగా వెదకండి
  rationale: דרשׁ లోని వెదకడం, కోరడం, వాటిపట్ల అంకితంగా ఉండడం అనే పరిధిని పూర్తిగా కేవలం ‘అధ్యయనం చేయండి’గా కుదించకుండా నిలుపుతుంది.
- source_word: כָּל־מִצְוֺת
  choice: ఆజ్ఞలన్నిటినీ
  rationale: כל తో కూడిన బహువచన నిర్మాణాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: తెలుగు వాక్యనిర్మాణంలో ముందున్న ఆజ్ఞలకు తరువాతి ఫలితాన్ని సహజంగా అనుసంధానిస్తుంది; ఇక్కడ ఉద్దేశం/ఫలితం రెండింటి భావసాధ్యతను అనవసరంగా కుదించదు.
- source_word: תִּירְשׁוּ
  choice: స్వాధీనం చేసుకొని
  rationale: ירשׁ సందర్భానుసారం స్వాధీనం చేసుకోవడం లేదా వారసత్వంగా పొందడం అనే అర్థాలు ఇస్తుంది; దేశాన్ని ఇశ్రాయేలు నిలుపుకోవడాన్ని ఇక్కడ సహజంగా సూచిస్తుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ఈ మంచి దేశాన్ని
  rationale: వాగ్దాన దేశానికి సంబంధించిన సంప్రదాయ హీబ్రూ వర్ణనను సరళంగా నిలుపుతుంది; తెలుగు సందర్భస్పష్టత కోసం ‘ఈ’ ఉపయోగించబడింది.
- source_word: וְהִנְחַלְתֶּם
  choice: శాశ్వత వారసత్వంగా అందిస్తారు
  rationale: נחל హిఫీల్ రూపంలోని ‘వారసత్వంగా పొందేలా చేయడం’ అనే కారణార్థక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵיכֶם
  choice: మీ కుమారులకు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ బహువచనాన్ని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: עַד־עוֹלָם
  choice: శాశ్వత
  rationale: కాలపరంగా నిరంతరంగా కొనసాగాలనే భావాన్ని వారసత్వంతో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: దైవిక నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం దేవుని ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: בנים లోని లింగసూచన
  choice: కుమారులు
  alternative: పిల్లలు / సంతానం
  rationale: హీబ్రూ పదం పుంలింగ బహువచనం. సందర్భం దాన్ని తప్పనిసరిగా లింగసామాన్య పదంగా మార్చాలని నిర్దేశించనందున మూలంలోని రూపాన్ని నిలిపి, పాదసూచికలో స్పష్టం చేయబడింది.
- issue: ఆజ్ఞలను ‘వెదకడం’ అనే דרשׁ భావం
  choice: వాటిని శ్రద్ధగా వెదకండి
  alternative: వాటిని అధ్యయనం చేయండి / వాటిని అనుసరించండి
  rationale: ఈ క్రియ జ్ఞానపరమైన పరిశోధనకే పరిమితం కాకుండా, ఆజ్ఞలను కోరుతూ వాటిపట్ల అంకితంగా ఉండడాన్నీ సూచించగలదు. ఒకే భావానికి పరిమితం చేయకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యం బహిరంగ సభలో పలికిన గంభీర ఉపదేశంలా వినిపించేలా ఉంచబడింది; అయితే అతిగా గ్రాంథికమైన పదజాలం నివారించబడింది.
