source:
  edition: WLC
  text: הַ/כֹּ֥ל בִּ/כְתָ֛ב מִ/יַּ֥ד יְהוָ֖ה עָלַ֣/י הִשְׂכִּ֑יל כֹּ֖ל מַלְאֲכ֥וֹת הַ/תַּבְנִֽית׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: te
  text: యాహ్వే హస్తం నాపై ఉండగా, ఆయన ఈ సమస్తాన్ని లిఖితంగా నాకు గ్రహింపజేశాడు[a]—అంటే ఆ నమూనాకు[b] సంబంధించిన పనులన్నిటినీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే హస్తం నుండి వచ్చిన లిఖితం ద్వారా ఆయన నాకు ఈ సమస్తాన్ని గ్రహింపజేశాడు—అంటే నమూనాకు సంబంధించిన పనులన్నిటినీ.”
    reason: alternative_reading
  - marker: b
    text: “నమూనా” అనే పదాన్ని “ప్రణాళిక” లేదా “ఆకృతి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: ఇదంతా
  rationale: ముందటి సందర్భంలో వివరించిన మందిర నిర్మాణ ప్రణాళిక మొత్తాన్ని సూచిస్తుంది; כֹּל యొక్క సమగ్ర భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּכְתָב
  choice: లిఖితం ద్వారా
  rationale: విషయం మౌఖికంగా మాత్రమే కాక రాతరూపంలో అందించబడిందనే భావాన్ని నిలుపుతుంది.
- source_word: מִיַּד יְהוָה
  choice: యాహ్వే హస్తం నుండి వచ్చిన
  rationale: ప్రత్యక్ష దైవిక మూలాన్ని, కార్యసాధకత్వాన్ని సూచించే హీబ్రూ ‘హస్తం నుండి’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని పేరుగానే ప్రతిబింబించే ఆధునిక తెలుగు లిప్యంతరీకరణ.
- source_word: עָלַי הִשְׂכִּיל
  choice: ఆయన నాకు గ్రహింపజేశాడు
  rationale: హిఫిల్ క్రియలోని ‘అర్థమయ్యేలా చేయడం’ అనే కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; עָלַי లోని వ్యక్తిగత దిశను ‘నాకు’ ద్వారా సూచిస్తుంది. వాక్యనిర్మాణంలోని మరో సాధ్యమైన పఠనాన్ని పాదటీపులో ఉంచింది.
- source_word: כֹּל מַלְאֲכוֹת
  choice: పనులన్నిటినీ
  rationale: నమూనాను అమలు చేయడానికి సంబంధించిన వివిధ పనులు, కార్యాలను సమగ్రంగా సూచిస్తుంది.
- source_word: הַתַּבְנִית
  choice: నమూనా
  rationale: ఆకృతి, ప్రణాళిక, నమూనా అనే అర్థపరిధిని కలిగిన పదానికి మూలరూపకాన్ని కాపాడే అనువాదం; ఇతర సహజ ప్రత్యామ్నాయాలు పాదటీపులో ఇవ్వబడ్డాయి.
theological_decisions:
- issue: עָלַי הִשְׂכִּיל అనే సంక్షిప్త వాక్యభాగాన్ని ఎలా అన్వయించాలి
  choice: యాహ్వే అంతటినీ లిఖితం ద్వారా దావీదుకు గ్రహింపజేశాడని ప్రధాన పాఠంలో అన్వయించడం
  alternative: ‘యాహ్వే హస్తం నాపై ఉంది; ఆయన నాకు ... గ్రహింపజేశాడు’ అని రెండు అనుసంధాన భావాలుగా చదవడం
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి, עָלַי ను ‘హస్తం నాపై’ అనే ప్రయోగంతోనూ లేదా గ్రహింపజేయడం దావీదుకు జరిగినదనే దిశతోనూ అన్వయించవచ్చు. ప్రధాన పాఠం దైవిక మూలాన్నీ గ్రహింపజేసిన కార్యాన్నీ కాపాడుతుంది; ప్రత్యామ్నాయాన్ని పాదటీపు ద్వారా స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘హస్తం’ అనే బైబిలీయ రూపకం మూలంలోని దైవిక కార్యసాధకత్వాన్ని నిలుపుతుంది; మిగతా వాక్యం సహజ పఠనానికి అనుగుణంగా అమర్చబడింది.
