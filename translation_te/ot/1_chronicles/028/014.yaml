  yaml_path: translation/ot/1_chronicles/028/014.yaml
  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: te
  text: ప్రతి రకమైన సేవకోసం ఉన్న అన్ని బంగారు వస్తువులకు బరువు ప్రకారం బంగారాన్ని, ప్రతి రకమైన సేవకోసం ఉన్న అన్ని వెండి వస్తువులకు బరువు ప్రకారం వెండిని ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘సేవకు, సేవకు’ అని పునరుక్తి ఉంది. ఇది విభజనాత్మక ప్రయోగం; ‘ఒక్కొక్క రకమైన సేవకోసం’ లేదా ‘ప్రతి వినియోగం కోసం’ అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: బంగారం
  rationale: ఆలయ సేవా వస్తువులకు కేటాయించిన మూల పదార్థాన్ని సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: בַּמִּשְׁקָל
  choice: ఎంత బరువు ఉండాలో
  rationale: בְּ + מִשְׁקָל కొలిచిన బరువు ప్రకారం కేటాయింపును సూచిస్తుంది. జాబితా స్వరూపంలోని అసంపూర్ణ హెబ్రీ వాక్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כְּלֵי
  choice: వస్తువులు
  rationale: పాత్రలు, పనిముట్లు మొదలైన అనేక రకాల సేవా సామగ్రిని కలుపుకోగల విస్తృతార్థక పదం.
- source_word: עֲבוֹדָה
  choice: సేవ
  rationale: ఆలయ సంబంధ సందర్భంలో పని లేదా పరిచర్య అనే భావం ఉన్నప్పటికీ, ‘సేవ’ ఆరాధనా సంబంధ వినియోగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: ప్రతి విధమైన సేవ
  rationale: మూలంలోని పునరుక్తి విభజనాత్మకంగా ఉండి, ఒక్కొక్క సేవా రకాన్ని లేదా వినియోగాన్ని సూచిస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: బంగారానికి సమాంతరంగా ఆలయ వస్తువులకు కేటాయించిన పదార్థాన్ని సూచిస్తుంది.
- source_word: לְכָל / לְכֹל
  choice: అన్నిటికీ
  rationale: మొత్తం పరిధిని సూచిస్తూ, తరువాతి విభజనాత్మక పదబంధంతో సహజంగా కలుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ సామగ్రి జాబితా సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. హెబ్రీ వాక్యం సందర్భాధారిత జాబితా భాగంగా అసంపూర్ణంగా ఉన్నందున, ముందున్న క్రియను తెలుగులో ‘ఇచ్చాడు’ అని స్పష్టపరిచాం; బరువు పరిమాణాలు తరువాతి అంశాల్లో వస్తాయనే భావాన్ని ‘ఎంత బరువు ఉండాలో’ ద్వారా తెలిపాం.
