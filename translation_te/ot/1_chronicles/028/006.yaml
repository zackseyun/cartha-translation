  to: 'ఆయన నాతో ఇలా అన్నాడు: “నీ కుమారుడైన సొలొమోను—అతడే నా మందిరాన్ని, నా ప్రాంగణాలను కడతాడు. ఎందుకంటే అతణ్ణి నా కుమారునిగా ఎంచుకున్నాను; నేను అతనికి తండ్రిగా ఉంటాను.”[a]'
