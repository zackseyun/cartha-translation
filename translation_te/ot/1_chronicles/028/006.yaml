source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ֔/י שְׁלֹמֹ֣ה בִנְ/ךָ֔ הֽוּא יִבְנֶ֥ה בֵיתִ֖/י וַ/חֲצֵרוֹתָ֑/י כִּי בָחַ֨רְתִּי ב֥/וֹ לִ/י֙ לְ/בֵ֔ן וַ/אֲנִ֖י אֶֽהְיֶה לּ֥/וֹ לְ/אָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: “నీ కుమారుడైన సొలొమోను—అతడే నా మందిరాన్ని, నా ప్రాంగణాలను కడతాడు. ఎందుకంటే అతణ్ణి నా కుమారునిగా ఎంచుకున్నాను; నేను అతనికి తండ్రిగా ఉంటాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “అతణ్ణి నా కుమారునిగా ఎంచుకున్నాను; నేను అతని తండ్రిగా ఉంటాను.”'
    reason: לוֹ לְאָב అనే హీబ్రూ సంబంధ నిర్మాణానికి సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: ఆయన నాతో ఇలా అన్నాడు
  rationale: אמר అనే కథన క్రియను సహజమైన భూతకాలంలో అనువదించి, לִיని ‘నాతో’గా తెలిపింది; ‘ఇలా’ ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: నీ కుమారుడైన సొలొమోను—అతడే
  rationale: పేరు, అనుబంధ పదబంధం, స్వతంత్ర సర్వనామం הוּא ఇచ్చే ఉద్ఘాటన—మూడింటినీ సహజమైన తెలుగు నిర్మాణంలో నిలిపింది.
- source_word: יִבְנֶה בֵיתִי
  choice: నా మందిరాన్ని కడతాడు
  rationale: בֵּיתִי అక్షరార్థంగా ‘నా ఇల్లు’; అయితే ఈ సందర్భంలో యెహోవా ఆలయ నిర్మాణమే స్పష్టమైన సూచ్యం. ఆధునిక తెలుగులో ‘నా ఇల్లు’ కలిగించగల అస్పష్టతను నివారిస్తూ ‘మందిరం’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וַחֲצֵרוֹתָי
  choice: నా ప్రాంగణాలను
  rationale: ఆలయ పరిసరంలోని ఆవరణలను సూచించే חֲצֵרוֹתకు ‘ప్రాంగణాలు’ సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సొలొమోను నిర్మాణకర్త కావడానికి తరువాతి వాక్యం కారణాన్ని ఇస్తున్నందున కారణార్థాన్ని స్పష్టంగా తెలిపింది.
- source_word: בָחַרְתִּי בוֹ לִי לְבֵן
  choice: అతణ్ణి నా కోసం కుమారునిగా ఎంచుకున్నాను
  rationale: בָחַרְתִּי యొక్క సంపూర్ణ క్రియను సహజమైన తెలుగులో తెలిపి, לִי మరియు לְבֵן అనే ద్విగుణ ל నిర్మాణంలోని ‘నా కోసం’ మరియు ‘కుమారునిగా’ అనే సంబంధ ఛాయలను నిలిపింది.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: నేను అతనికి తండ్రిగా ఉంటాను
  rationale: לוֹ לְאָב నిర్మాణాన్ని ‘అతనికి తండ్రిగా’ అని సన్నిహితంగా అనువదించడం ద్వారా ఒడంబడిక సంబంధ సూత్రాన్ని సహజమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: దేవుడు–సొలొమోను తండ్రి–కుమార సంబంధ భాష
  choice: ‘అతణ్ణి నా కోసం కుమారునిగా ఎంచుకున్నాను; నేను అతనికి తండ్రిగా ఉంటాను’ అని నేరుగా నిలిపింది.
  alternative: ‘అతణ్ణి నా కుమారుడిగా ఎంచుకున్నాను; నేను అతని తండ్రిగా ఉంటాను.’
  rationale: రాజవంశ ఒడంబడికలోని తండ్రి–కుమార భాషను బలహీనపరచకుండా, అదే సమయంలో ఈ సందర్భంలో లేని తరువాతి సిద్ధాంత నిర్ధారణలను చేర్చకుండా మూలంలోని సంబంధాత్మక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. הוּא యొక్క ఉద్ఘాటనను ‘అతడే’తో, ద్విగుణ ל నిర్మాణాన్ని ప్రధాన పాఠంలో కొంత రూపసామ్యంతో, పాదసూచికలో సహజ ప్రత్యామ్నాయంతో తెలిపింది.
