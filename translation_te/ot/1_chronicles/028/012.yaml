id: 1CH.28.12
reference: 1 Chronicles 28:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: te
  text: 'తనతోనున్న ఆత్మలో ఉన్న సమస్తానికి నమూనాను కూడా దావీదు అతనికి ఇచ్చాడు: యెహోవా మందిర ప్రాంగణాల కొరకు, చుట్టుపక్కల ఉన్న అన్ని గదుల కొరకు, దేవుని మందిర భాండాగారాల కొరకు, పవిత్ర వస్తువుల భాండాగారాల కొరకు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ఆత్మలో లేదా మనసులో ఉన్న సమస్తానికి నమూనా”; అంటే, దావీదు సొంత మనసులో లేదా హృదయంలో ఉన్నది.
    reason: హెబ్రీ పదబంధం దేవుని ఆత్మను గానీ దావీదు సొంత అంతరంగాన్ని గానీ సూచించగలదు.
lexical_decisions:
- source_word: תַבְנִית
  choice: నమూనా
  rationale: ఆలయ నిర్మాణ సందర్భంలో ఈ పదం నిర్మాణ ప్రణాళికను లేదా నమూనాను సూచిస్తుంది. తెలుగు వాక్యంలో ‘నమూనా’ మూలంలోని రూపరేఖ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: כֹּל אֲשֶׁר
  choice: సమస్తం
  rationale: ప్రణాళికలోని అంశాల సంపూర్ణతను సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: తనతో ఉన్న ఆత్మలో ఉన్న
  rationale: హెబ్రీ వాక్యంలోని అసాధారణ నిర్మాణాన్ని, అది దేవుని ఆత్మను సూచిస్తుందా లేక దావీదు అంతరంగాన్ని సూచిస్తుందా అనే సందిగ్ధతతో సహా, సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: לְחַצְרוֹת
  choice: ప్రాంగణాల కోసం
  rationale: ఆలయ నిర్మాణంలోని తెరచిన ఆవరణలను ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘యెహోవా గృహం’ అనే మూలార్థాన్ని ఆలయ సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తూ దైవనామాన్ని నిలుపుతుంది.
- source_word: לְּשָׁכוֹת סָבִיב
  choice: చుట్టూ ఉన్న గదులు
  rationale: మందిరం చుట్టూ అమర్చిన గదులను సరళంగా, ఖచ్చితంగా వివరిస్తుంది.
- source_word: אֹצְרוֹת
  choice: భాండాగారాలు
  rationale: విలువైన లేదా ప్రతిష్ఠిత వస్తువులను నిల్వచేసే ఆలయ గదుల భావాన్ని ‘భాండాగారాలు’ సరిగ్గా అందిస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థమైన ‘దేవుని గృహం’ను ఆలయ సందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది.
- source_word: הַקֳּדָשִׁים
  choice: ప్రతిష్ఠిత వస్తువులు
  rationale: ఇక్కడ పదం భాండాగారాల్లో ఉంచబడే పవిత్రంగా అర్పించబడిన వస్తువులను సూచించే అవకాశముంది; ‘ప్రతిష్ఠిత వస్తువులు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: בָרוּחַ עִמּוֹ యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో ‘తనతో ఉన్న ఆత్మలో’ అని ఉంచి దైవిక ఆత్మ సూచనకు అవకాశం నిలుపడం
  alternative: ‘తన మనసులో ఉన్న’ లేదా ‘తన అంతరంగంలో ఉన్న’ అని దావీదు సొంత ఆలోచనగా అర్థం చేసుకోవడం
  rationale: 28:19లో యెహోవా ఇచ్చిన అవగాహన ప్రస్తావన దైవిక మూలాన్ని బలపరుస్తుంది. అయినప్పటికీ, హెబ్రీ పదబంధం దావీదు సొంత ఆత్మ లేదా మనసును కూడా సూచించగలదు; కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, ఆలయ నిర్మాణానికి తగిన గౌరవప్రదమైన పదజాలం వాడబడింది. ఈ వచనం మునుపటి వాక్యానికి వ్యాకరణపరంగా అనుసంధానమై ఉన్నప్పటికీ, సందర్భ స్పష్టత కోసం ‘దావీదు అతనికి ఇచ్చాడు’ అని పూరించబడింది.
