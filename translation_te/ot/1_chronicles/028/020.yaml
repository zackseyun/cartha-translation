id: 1CH.28.20
reference: 1 Chronicles 28:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: te
  text: 'దావీదు తన కుమారుడైన సొలొమోనుతో ఇలా అన్నాడు: “బలంగా ఉండు, ధైర్యంగా ఉండు, ఆ పని చేయి. భయపడకు, నిరుత్సాహపడకు. ఎందుకంటే యాహ్వే దేవుడు—నా దేవుడు—నీతో ఉన్నాడు. యాహ్వే మందిర సేవకు సంబంధించిన పని అంతా పూర్తయ్యే వరకు ఆయన నీకు తోడ్పాటు ఇవ్వడం మానడు[a], నిన్ను విడిచిపెట్టడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన నీపై తన పట్టును సడలించడు.” ఇక్కడి హీబ్రూ క్రియ సహాయాన్ని సడలించకపోవడం లేదా పట్టును వదలకపోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: జంట ఆజ్ఞలైన ‘బలంగా ఉండు, ధైర్యంగా ఉండు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַעֲשֵׂה
  choice: ఆ పని చేయి
  rationale: సందర్భంలో సొలొమోను చేపట్టవలసిన మందిరపు పనిని సూచించే ప్రత్యక్ష ఆజ్ఞ; తెలుగులో కేవలం ‘చేయి’ అనడం కంటే ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: భయపడకు, దిగులుపడకు
  rationale: మొదటి క్రియ భయాన్ని, రెండవది మనోధైర్యం కోల్పోవడాన్ని సూచిస్తుంది; రెండింటి తేడాను సరళంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהִים אֱלֹהַי
  choice: దేవుడు—నా దేవుడు
  rationale: హీబ్రూ పునరుక్తినీ, దావీదు వ్యక్తిగత సంబంధాన్ని తెలిపే అన్వయాన్నీ నిలుపుతుంది.
- source_word: עִמָּךְ
  choice: నీతో ఉన్నాడు
  rationale: మూలంలోని క్రియలేని నామవాక్యానికి వర్తమానార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לֹא יַרְפְּךָ
  choice: నిన్ను నిరాశపరచడు
  rationale: సహాయాన్ని సడలించకపోవడం లేదా ఒకరిని విఫలం చేయకపోవడం అనే సందర్భార్థాన్ని, తరువాతి ‘విడిచిపెట్టడు’తో అనవసర పునరుక్తి రాకుండా వ్యక్తపరుస్తుంది.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: నిన్ను విడిచిపెట్టడు
  rationale: עזב తెలిపే వదిలివేయడం లేదా పరిత్యజించడం అనే గంభీరమైన హామీని సహజంగా అందిస్తుంది.
- source_word: עַד לִכְלוֹת
  choice: పూర్తయ్యే వరకు
  rationale: దేవుని తోడ్పాటుకు సంబంధించి కార్యసమాప్తిని సూచించే మూలంలోని కాల పరిమితి నిర్మాణాన్ని అలాగే నిలుపుతుంది.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: యాహ్వే మందిర సేవకు సంబంధించిన పని అంతా
  rationale: ‘పని’, ‘సేవ’, ‘యాహ్వే గృహం’ అనే మూడు అంశాలను తెలుగులో భారంగా వినిపించని నిర్మాణంతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల బిరుదును పెట్టకుండా ఆధునిక పండిత లిప్యంతరీకరణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: ‘పూర్తయ్యే వరకు’ అనే హామీ యొక్క కాలార్థం
  choice: మూలంలోని ‘వరకు’ అనే నిర్మాణాన్ని నిలుపడం
  alternative: పని పూర్తయిన తరువాత కూడా దేవుడు విడిచిపెట్టడని వివరణను వాక్యంలో చేర్చడం
  rationale: עַד యొక్క రూపాన్ని విస్తరించి సిద్ధాంతపరమైన నిర్ధారణను పాఠ్యంలో చేర్చకుండా, మూలంలోని దృష్టిని మరియు సంభావ్య ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. మందిర నిర్మాణ సందర్భం స్పష్టమయ్యేలా ‘ఆ పని’ అని ఇచ్చినా, మూలానికి మించిన వివరాన్ని చేర్చలేదు. పాదసూచిక గుర్తు సంబంధిత క్రియ వద్ద ఉంచబడింది.
