source:
  edition: WLC
  text: וְ/אֶת הַ/זָּהָ֥ב מִשְׁקָ֛ל לְ/שֻׁלְחֲנ֥וֹת הַֽ/מַּעֲרֶ֖כֶת לְ/שֻׁלְחַ֣ן וְ/שֻׁלְחָ֑ן וְ/כֶ֖סֶף לְ/שֻׁלְחֲנ֥וֹת הַ/כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/016.yaml
  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: te
  text: అమరిక బల్లల[a] కోసం బంగారం బరువును, ఒక్కో బల్లకు విడివిడిగా, వెండి బల్లల కోసం వెండిని ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అమరిక బల్లలు.’ ఇది క్రమంగా అమర్చిన రొట్టెల కోసం ఉన్న బల్లలను సూచించవచ్చు; సంప్రదాయంగా వీటిని ‘సన్నిధి రొట్టెల బల్లలు’ అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: బరువు
  rationale: ఆలయ సామగ్రి జాబితా సందర్భంలో ఇది ప్రతి వస్తువుకు కేటాయించిన లోహపు నిర్దిష్ట బరువును సూచిస్తుంది.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: సమర్పణ రొట్టెల బల్లలు
  rationale: מַעֲרֶכֶת అంటే క్రమంగా అమర్చబడినది; ఇక్కడ యెహోవా సన్నిధిలో వరుసగా ఉంచే రొట్టెలను సూచించే అవకాశం ఉంది. తెలుగులో కేవలం ‘అమరిక బల్లలు’ అస్పష్టంగా ఉండటంతో సందర్భార్థాన్ని సహజంగా వ్యక్తం చేశాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: ఒక్కొక్క బల్లకు ఎంతెంత కావాలో
  rationale: పునరుక్త ఏకవచన నిర్మాణం ప్రతి బల్లకూ విడివిడిగా కేటాయింపును సూచిస్తుంది; తెలుగు సహజత్వంతో ఆ పంపిణీ భావాన్ని నిలిపాం.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: మొదటి భాగంలోని బంగారానికి భిన్నమైన లోహాన్ని సూచించే సాధారణ పదం.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: వెండి బల్లలు
  rationale: ఈ నిర్మాణం వెండితో చేసిన లేదా వెండి బల్లలుగా పేర్కొన్న బల్లలను సహజంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని క్రియ ముందటి వచనాల నుంచి అర్థం చేసుకోవలసి ఉండటంతో తెలుగులో వాక్య సంపూర్ణత కోసం ‘తెలిపాడు’ చేర్చబడింది. ప్రధాన పాఠంలో ఆచార సంబంధ భావాన్ని స్పష్టం చేస్తూనే, హెబ్రీ పదబంధపు అక్షరార్థాన్ని పాదసూచికలో సంరక్షించాం.
