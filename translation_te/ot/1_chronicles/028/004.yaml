reference: 1 Chronicles 28:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు దేవుడైన యెహోవా నా తండ్రి ఇంటివారందరిలోనుండి నన్ను ఎన్నుకొని, ఇశ్రాయేలుమీద శాశ్వతంగా[a] రాజుగా ఉండటానికి నియమించాడు. ఎందుకంటే ఆయన యూదాను నాయకునిగా ఎన్నుకున్నాడు; యూదా వంశంలో నా తండ్రి వంశాన్ని ఎన్నుకొని, నా తండ్రి కుమారులలో నన్ను మెచ్చుకొని, ఇశ్రాయేలంతటిమీద నన్ను రాజుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శాశ్వతంగా” అనే పదం దావీదు వ్యక్తిగత పాలనకాలాన్ని మాత్రమే కాక, అతని రాజవంశం నిలిచియుండడాన్ని కూడా సూచించగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: וַיִּבְחַר / בָּחַר
  choice: ఎన్నుకున్నాడు
  rationale: రెండు సందర్భాల్లోనూ దైవిక ఎంపికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: నా తండ్రి వంశమంతటిలో నుండి నన్ను
  rationale: తండ్రి గృహం/కుటుంబ వంశంలో నుంచి దావీదు ఎంపికైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: రాజుగా ఉండేలా చేశాడు
  rationale: రాజుగా ఉండటానికి చేసిన నియామక ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: దావీదు వ్యక్తిగత జీవితకాలాన్ని మాత్రమే కాక నిలిచియుండే రాజవంశ వాగ్దానపు విస్తృతిని కాపాడుతుంది.
- source_word: לְנָגִיד
  choice: నాయకత్వం వహించడానికి
  rationale: నాగీద్ అనే పదంలోని అధికారపూర్వక నాయకత్వ భావాన్ని, 'రాజకుమారుడు' అనే ఆధునిక అపార్థం లేకుండా అందిస్తుంది.
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: యూదా వంశంలో నా తండ్రి వంశాన్ని
  rationale: మూలంలోని బేత్ ఉపసర్గను 'లో' అనే భావంతో నిలుపుతూ, యూదా నుంచి దావీదు తండ్రి వంశానికి ఎంపిక క్రమంగా సంకుచితమవడాన్ని చూపిస్తుంది.
- source_word: וּבִבְנֵי אָבִי
  choice: నా తండ్రి కుమారులలో
  rationale: ‘నా సహోదరులలో’ అని సరళీకరించకుండా మూలంలోని వంశావళి సంబంధమైన నిర్దిష్టతను కాపాడుతుంది.
- source_word: בִּי רָצָה
  choice: నన్ను ఇష్టపడి
  rationale: కేవలం ఎంపిక అనే భావాన్ని మళ్లీ చెప్పకుండా, అనుకూలత లేదా ప్రసన్నత అనే వ్యక్తిగత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְהַמְלִיךְ
  choice: నన్ను రాజుగా నియమించాడు
  rationale: హిఫీల్ రూపంలోని ‘రాజుగా చేయడం’ అనే కారణార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: అధికార పరిధి మొత్తం ఇశ్రాయేలు అని సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: לְעוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతంగా
  alternative: చిరకాలం
  rationale: దావీదు రాజ్యపాలన వ్యక్తిగత జీవితకాలానికే పరిమితమని నిర్ధారించకుండా, నిలిచియుండే దావీదు రాజవంశ వాగ్దానంలోని ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- issue: נָגִיד యొక్క అర్థం
  choice: నాయకత్వం వహించడానికి
  alternative: పాలకునిగా / రాజకుమారునిగా
  rationale: ఈ పదం అధికార నాయకత్వాన్ని సూచిస్తుంది; ‘రాజకుమారుడు’ అన్నది ఆధునిక పాఠకునికి అనవసరమైన వంశపారంపర్య పదవిని సూచించవచ్చు, ‘పాలకుడు’ అన్నది రాజుతో సాంకేతిక భేదాన్ని అతిగా ముందుకు తేవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఇల్లు’ అనే అక్షరార్థం కన్నా ఈ వంశావళి సందర్భంలో ‘వంశం’ ఉపయోగించబడింది. మూలంలోని యూదా → తండ్రి వంశం → తండ్రి కుమారులు → దావీదు అనే ఎంపిక క్రమాన్ని నిలుపుకుంది.
