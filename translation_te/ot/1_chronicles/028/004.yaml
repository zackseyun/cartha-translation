revisions:
- from: అయితే ఇశ్రాయేలు దేవుడైన యెహోవా నా తండ్రి వంశమంతటిలో నుండి నన్ను ఎన్నుకొని, ఇశ్రాయేలుమీద శాశ్వతంగా రాజుగా ఉండేలా చేశాడు.[a] ఎందుకంటే ఆయన నాయకత్వం వహించడానికి యూదాను ఎన్నుకున్నాడు; యూదా వంశంలో నా తండ్రి వంశాన్ని, నా తండ్రి కుమారులలో నన్ను ఇష్టపడి, ఇశ్రాయేలంతటిమీద నన్ను రాజుగా నియమించాడు.
  to: అయితే ఇశ్రాయేలు దేవుడైన యెహోవా నా తండ్రి ఇంటివారందరిలోనుండి నన్ను ఎన్నుకొని, ఇశ్రాయేలుమీద శాశ్వతంగా[a] రాజుగా ఉండటానికి నియమించాడు. ఎందుకంటే ఆయన యూదాను నాయకునిగా ఎన్నుకున్నాడు; యూదా వంశంలో నా తండ్రి వంశాన్ని ఎన్నుకొని, నా తండ్రి కుమారులలో నన్ను మెచ్చుకొని, ఇశ్రాయేలంతటిమీద నన్ను రాజుగా నియమించాడు.
  rationale: The revision distinguishes the initial choice and appointment ‘to be king’ from the final causative act ‘to make me king.’ It renders Judah’s office as ‘leader,’ retains the narrowing sequence Judah → father’s house → father’s sons → David, and places the existing note at the word it explains.
