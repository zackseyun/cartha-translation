source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: te
  text: నా కుమారుడైన సొలొమోనూ, నీవు నీ తండ్రి దేవుణ్ణి తెలుసుకొని, సంపూర్ణ హృదయంతో, సుముఖమైన మనస్సుతో ఆయనను సేవించు. ఎందుకంటే యహ్వే ప్రతి హృదయాన్నీ పరిశోధిస్తాడు; ఆలోచనల వెనుక ఉన్న ప్రతి ఉద్దేశాన్నీ గ్రహిస్తాడు. నీవు ఆయనను వెదికితే, ఆయన నీకు దొరుకుతాడు[a]. కానీ నీవు ఆయనను విడిచిపెడితే, ఆయన నిన్ను శాశ్వతంగా త్రోసివేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నీకు కనబడతాడు.” హీబ్రూ క్రియారూపం నిష్క్రియ లేదా ఆత్మనేపద భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన నిన్ను శాశ్వతంగా తిరస్కరిస్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: తెలుసుకొని
  rationale: ఇది కేవలం మేధోపరమైన అవగాహనను కాక, దేవుణ్ణి వ్యక్తిగతంగా గుర్తించి సంబంధపూర్వకంగా ఎరిగే భావాన్ని కలిగిస్తుంది.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: నీ తండ్రి దేవుణ్ణి
  rationale: దావీదు నుండి సొలొమోనుకు కొనసాగుతున్న కుటుంబ, నిబంధన సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְעָבְדֵהוּ
  choice: ఆయనను సేవించు
  rationale: దేవునికి సంబంధించిన ఆరాధన, విధేయత, అంకితభావం అన్నింటినీ కలుపుకొనే עבד పదపు విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: בְּלֵב שָׁלֵם
  choice: సంపూర్ణ హృదయంతో
  rationale: שָׁלֵם లోని సంపూర్ణత, అఖండ నిబద్ధత భావాన్ని తెలియజేస్తుంది; పాపరహిత పరిపూర్ణత అనే అపార్థాన్ని బలవంతంగా రుద్దదు.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: ఇష్టపూర్వకమైన మనస్సుతో
  rationale: నెఫెష్ ఇక్కడ అంతరంగ వ్యక్తిత్వాన్ని, חֲפֵצָה సుముఖతను సూచిస్తాయి. సహజమైన ఆధునిక తెలుగులో స్వచ్ఛంద అంతరంగ అంకితభావాన్ని తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: ఎందుకంటే యెహోవా ప్రతి హృదయాన్నీ పరిశోధిస్తాడు
  rationale: דרשׁ ఇక్కడ వెదికి కనుగొనవలసిన అవసరం కాక, అంతరంగాన్ని పరిశీలించడం అనే భావంలో ఉంది.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: ఆలోచనల వెనుక ఉన్న ప్రతి ఉద్దేశాన్నీ గ్రహిస్తాడు
  rationale: יֵצֶר యొక్క రూపకల్పన, మొగ్గు, ఉద్దేశం అనే భావాలను పాఠకునికి స్పష్టంగా తెలియజేస్తూ అంతరంగ ప్రేరణను సూచిస్తుంది.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: నీవు ఆయనను వెదికితే
  rationale: ఇక్కడ דרשׁ దేవుని పట్ల భక్తితో, ఆధారపడుతూ ఆయనను వెదకడాన్ని సూచిస్తుంది.
- source_word: יִמָּצֵא לָךְ
  choice: ఆయన నీకు దొరుకుతాడు
  rationale: నిఫాల్ రూపంలోని ‘నీకు కనబడతాడు/దొరుకుతాడు’ అనే క్రియార్థాన్ని సహజమైన తెలుగులో ఉంచుతుంది; ప్రత్యామ్నాయ నిష్క్రియ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: תַּעַזְבֶנּוּ
  choice: ఆయనను విడిచిపెడితే
  rationale: నిబంధన విశ్వాసాన్ని వదిలివేయడం అనే గంభీర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: ఆయన నిన్ను శాశ్వతంగా త్రోసివేస్తాడు
  rationale: זנח హిఫీల్‌లోని తిరస్కరించి తొలగించే బలమైన హెచ్చరికను మృదుపరచకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ధ్వన్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: ‘హృదయం’ మరియు נֶפֶשׁకు సంబంధించిన మానవ అంతరంగ భాష
  choice: ‘సంపూర్ణ హృదయంతో, ఇష్టపూర్వకమైన మనస్సుతో’ అని రెండు వేరు అంతరంగ కోణాలను నిలిపాము.
  alternative: ‘పరిపూర్ణ హృదయంతో, ఇష్టపడే ప్రాణంతో’
  rationale: హీబ్రూ לֵב మరియు נֶפֶשׁలను ఒకే మానసిక వర్గంగా పూర్తిగా కలపకుండా, సంపూర్ణ అంతరంగ నిబద్ధతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- issue: יִמָּצֵא לָךְలో దేవుడు వెదికేవారికి దొరకడం
  choice: ప్రధాన పాఠంలో ‘ఆయన నీకు దొరుకుతాడు’ అని, నిష్క్రియ రూపాన్ని పాదసూచికలో ఇచ్చాము.
  alternative: ‘ఆయన తనను తాను నీకు కనబడనిస్తాడు’
  rationale: హీబ్రూ నిఫాల్‌లోని నిష్క్రియ/ఆత్మనేపద అస్పష్టతను పాదసూచిక ద్వారా కాపాడుతూ, దేవుని స్వీయప్రకటనపై అధిక వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో రుద్దదు.
- issue: నిబంధన హెచ్చరిక తీవ్రత
  choice: ‘ఆయన నిన్ను శాశ్వతంగా త్రోసివేస్తాడు’
  alternative: ‘ఆయన నిన్ను శాశ్వతంగా తిరస్కరిస్తాడు’
  rationale: దావీదు సొలొమోనుకు ఇచ్చిన హెచ్చరికలోని తీవ్రతను యథాతథంగా ఉంచి, విశాలమైన సిద్ధాంతపరమైన ప్రశ్నలను ఈ వాక్యానికి మించి పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాము. దేవునికి సూచనగా గౌరవార్థక ఏకవచన రూపాలు ఉపయోగించాము. హెచ్చరికలోని గంభీరతను నిలిపి, కృత్రిమంగా పురాతనంగా వినిపించే పదజాలాన్ని నివారించాము.
