- from: నా కుమారుడైన సొలొమోనూ, నీవు నీ తండ్రి దేవుణ్ణి తెలుసుకొని, సంపూర్ణ హృదయంతో, ఇష్టపూర్వకమైన మనస్సుతో ఆయనను సేవించు. ఎందుకంటే యెహోవా ప్రతి హృదయాన్నీ పరిశోధిస్తాడు; ఆలోచనల వెనుక ఉన్న ప్రతి ఉద్దేశాన్నీ గ్రహిస్తాడు. నీవు ఆయనను వెదికితే, ఆయన నీకు దొరుకుతాడు[a]. కానీ నీవు ఆయనను విడిచిపెడితే, ఆయన నిన్ను శాశ్వతంగా త్రోసివేస్తాడు[b].
  to: నా కుమారుడైన సొలొమోనూ, నీవు నీ తండ్రి దేవుణ్ణి తెలుసుకొని, సంపూర్ణ హృదయంతో, సుముఖమైన మనస్సుతో ఆయనను సేవించు. ఎందుకంటే యహ్వే ప్రతి హృదయాన్నీ పరిశోధిస్తాడు; ఆలోచనల వెనుక ఉన్న ప్రతి ఉద్దేశాన్నీ గ్రహిస్తాడు. నీవు ఆయనను వెదికితే, ఆయన నీకు దొరుకుతాడు[a]. కానీ నీవు ఆయనను విడిచిపెడితే, ఆయన నిన్ను శాశ్వతంగా త్రోసివేస్తాడు[b].
