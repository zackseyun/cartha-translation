id: 1CH.28.18
reference: 1 Chronicles 28:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: te
  text: ధూపవేదిక కోసం బరువు ప్రకారం శుద్ధి చేసిన బంగారం; అలాగే రథపు నమూనా[a] కోసం—రెక్కలు చాపి యాహ్వే నిబంధన మందసంపై కప్పి ఉంచే బంగారు కెరూబులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రథపు నమూనా’ అని అనువదించిన హీబ్రూ పదబంధం అర్థం కఠినమైనది. ఇది మందసంతో సంబంధమున్న కెరూబుల రథంలాంటి సింహాసన నిర్మాణాన్ని సూచించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూపవేదిక
  rationale: ఆలయంలో ధూపం వేయడానికి ఉపయోగించే వేదికను ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: זָהָב מְזֻקָּק
  choice: శుద్ధి చేసిన బంగారం
  rationale: లోహాన్ని శుద్ధీకరించిన భావాన్ని స్పష్టంగా నిలుపుతుంది; కేవలం ‘మేలిమి బంగారం’ కంటే మూలపదంలోని ప్రక్రియాభావానికి దగ్గరగా ఉంటుంది.
- source_word: בַּמִּשְׁקָל
  choice: దాని బరువు ప్రకారం
  rationale: బంగారం కొలిచిన పరిమాణంలో కేటాయించబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַבְנִית
  choice: నమూనా
  rationale: ఆలయ నిర్మాణ సందర్భంలో రూపరేఖ, నమూనా, లేదా నిర్మాణ పద్ధతి అనే భావవిస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: הַמֶּרְכָּבָה
  choice: రథం
  rationale: సాధారణ నిఘంటు అర్థాన్ని అలాగే ఉంచి, దానిని వ్యాఖ్యానాత్మకంగా ‘సింహాసనం’గా మార్చకుండా మూలంలోని కఠినతను నిలుపుతుంది.
- source_word: הַכְּרֻבִים
  choice: కెరూబులు
  rationale: ఇది ప్రత్యేక బైబిలు పదానికి తెలుగు లిప్యంతరీకరణ; సాధారణ దేవదూతలుగా అర్థాన్ని కుదించదు.
- source_word: לְפֹרְשִׂים
  choice: రెక్కలు చాపి
  rationale: క్రియలో స్పష్టంగా చెప్పని కర్మను కెరూబుల ప్రసిద్ధ మందస-చిత్రణ ఆధారంగా సహజ తెలుగు కోసం వ్యక్తం చేస్తుంది.
- source_word: וְסֹכְכִים
  choice: కప్పి ఉంచే
  rationale: మందసంపై రెక్కలతో కప్పడం లేదా ఆవరించడం అనే మూలభావాన్ని స్పష్టంగా ఇస్తుంది; ‘నీడవేయడం’ అనే అసహజ పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: నిబంధనకు సంబంధించిన పవిత్ర మందసాన్ని సహజ తెలుగులో సూచిస్తూ, మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ మూలంలో ఉన్న ప్రత్యేక నిబంధన నామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: הַמֶּרְכָּבָה మరియు కెరూబుల నిర్మాణం మధ్య సంబంధం
  choice: బంగారు కెరూబుల రథం నమూనా
  alternative: కెరూబులతో కూడిన రథ-సింహాసన నిర్మాణ నమూనా
  rationale: మూలంలోని ‘రథం’ అనే ఆశ్చర్యకరమైన పదాన్ని నిలిపి, అది కెరూబు-సింహాసన నిర్మాణాన్ని సూచిస్తుందని తుది పాఠ్యంలో ఖచ్చితంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని జాబితా-వాక్య నిర్మాణాన్ని తెలుగులో సంపూర్ణ వాక్యంగా చేయడానికి సందర్భం నుంచి క్రియను చేర్చి దానిని పాదటిప్పణిలో వెల్లడించాం. ‘రథం’ అనే సమస్యాత్మక రూపకాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా పాఠ్యంలో నిలిపాం.
