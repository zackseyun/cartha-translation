  to: ధూపవేదిక కోసం బరువు ప్రకారం శుద్ధి చేసిన బంగారం; అలాగే రథపు నమూనా[a] కోసం—రెక్కలు చాపి యాహ్వే నిబంధన మందసంపై కప్పి ఉంచే బంగారు కెరూబులు.
