id: 1CH.28.5
reference: 1 Chronicles 28:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: te
  text: నా కుమారులందరిలోనుండి—యెహోవా నాకు అనేకమంది కుమారులను ఇచ్చాడు[a]—ఇశ్రాయేలుపై యెహోవా రాజ్యపు సింహాసనం మీద కూర్చోవడానికి నా కుమారుడైన సొలొమోనును ఆయన ఎన్నుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా నాకు అనేకమంది కుమారులను ఇచ్చి ఉన్నాడు.” ఈ హీబ్రూ వాక్యం వివరణాత్మకమైనది; దేవుడు ఇచ్చిన కుమారులు దావీదుకు ఇప్పుడు ఉన్నారనే ఫలితభావం కూడా ఇందులో వినిపించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “యెహోవా రాజ్యపు సింహాసనం” అనే మాట, సొలొమోను మానవ రాజు అయినప్పటికీ ఇశ్రాయేలు రాజ్యం అంతిమంగా యెహోవాకు చెందినదని నొక్కిచెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: నా కుమారులందరిలోనుండి
  rationale: מן + כל ఎంపిక చేయబడిన పెద్ద సమూహంలోనుండి ఒకరిని సూచిస్తుంది; ‘కుమారులు’ అనే పుంలింగ బహువచనం రాజవారసత్వ సందర్భానికి తగినది.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: యెహోవా నాకు అనేకమంది కుమారులను ఇచ్చాడు
  rationale: כִּי ఇక్కడ కారణాన్ని నిర్ధారించడం కంటే వివరణాత్మక మధ్యవాక్యాన్ని ప్రవేశపెడుతుంది. తెలుగు సహజత కోసం డాష్‌ల మధ్య ఉంచబడింది.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: నా కుమారుడైన సొలొమోనును ఆయన ఎన్నుకున్నాడు
  rationale: בחר తో వచ్చిన ב ఎంపిక చేయబడిన వ్యక్తిని సూచిస్తుంది. ముందున్న యెహోవానే కర్త అని ‘ఆయన’ స్పష్టం చేస్తుంది.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: సింహాసనం మీద కూర్చోవడానికి
  rationale: రాజాభిషేక సందర్భంలో ישב + כסא సింహాసనంపై కూర్చొని పాలించడాన్ని సూచిస్తుంది; మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: מַלְכוּת יְהוָה
  choice: యెహోవా రాజ్యపు
  rationale: సంబంధ నిర్మాణాన్ని నేరుగా నిలిపి, రాజ్యం అంతిమంగా యెహోవాకు చెందినదనే మూలపాఠ్య ఉద్ఘాటనను కాపాడుతుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: సింహాసనము, రాజ్యము అనే సందర్భంలో עַל పాలన లేదా అధికార పరిధిని సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- issue: כִּסֵּא מַלְכוּת יְהוָה అనే పూర్తి పదబంధ భావం
  choice: యెహోవా రాజ్యపు సింహాసనం
  alternative: ఇశ్రాయేలు రాజసింహాసనం
  rationale: మూలపాఠం రాజ్యాన్ని కేవలం ఇశ్రాయేలుదిగా లేదా దావీదుదిగా కాక యెహోవాదిగా పేర్కొంటుంది; దాని వేదాంతపరమైన ఉద్వేగాన్ని తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘యెహోవా రాజ్యపు సింహాసనం’ అనే మూలంలోని గంభీరమైన రాజభాషను యథాతథ భావంతో నిలిపింది. వివరణాత్మక ఉపవాక్యాన్ని డాష్‌లతో చూపించింది.
