reference: 1 Chronicles 28:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: te
  text: 'అప్పుడు దావీదు యెరూషలేములో ఇశ్రాయేలు నాయకులందరినీ సమకూర్చాడు: గోత్రాల నాయకులను, రాజుకు సేవచేసే విభాగాల అధిపతులను, వేలమందికీ వందమందికీ అధిపతులను, రాజుకూ అతని కుమారులకూ చెందిన సమస్త ఆస్తి, పశుసంపదలపై అధిపతులను, రాజప్రాసాద అధికారులనూ[a], వీరులనూ, పరాక్రమవంతులైన ప్రతి యోధుణ్ణీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నపుంసకులు.” హెబ్రీ పదం అక్షరార్థంగా నపుంసకులను లేదా సాధారణంగా రాజప్రాసాద అధికారులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: సమకూర్చాడు
  rationale: హిఫీల్ రూపం అధికారిక సమావేశం కోసం ఇతరులను కూడగట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సమకూర్చాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులందరినీ
  rationale: שַׂר పరిపాలనా, గోత్ర, సైనిక హోదాలను కలుపుకొనే విస్తృత పదం; ‘నాయకులు’ జాబితా మొత్తానికి సరిపోయే సమగ్ర పదం.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: గోత్రాల నాయకులు
  rationale: నిర్మాణ సంబంధాన్ని సూటిగా చూపుతూ, שַׂר కు ఎంచుకున్న విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: రాజుకు సేవచేసే విభాగాల అధిపతులు
  rationale: מַחְלְקוֹת వ్యవస్థీకృత సేవా విభాగాలను, שָׂרֵי వాటి అధిపతులను సూచిస్తాయి.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: వేలమందికి మరియు వందమందికి అధిపతులు
  rationale: హెబ్రీయ సైనిక-పరిపాలనా విభాగాల సంఖ్యాత్మక రూపాన్ని అర్థవంతంగా అలాగే ఉంచుతుంది; అవి ఖచ్చిత సంఖ్యలా లేక విభాగ నామాలా అన్నది నిర్ణయించదు.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: ఆస్తి ... పశుసంపద
  rationale: רְכוּשׁ సంపద లేదా ఆస్తిని, מִקְנֶה వివిధ రకాల పెంపుడు జంతువులను సూచిస్తాయి; ఈ జంట తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: שָׂרֵי כָל רְכוּשׁ וּמִקְנֶה
  choice: ఆస్తి అంతటి మీదా పశుసంపద అంతటి మీదా ఉన్న నిర్వాహకులు
  rationale: ఇక్కడి שָׂרֵי అనేది ఆస్తి పర్యవేక్షణ బాధ్యతగల అధికారులను సూచిస్తుంది; ‘నిర్వాహకులు’ వారి కార్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: రాజుకు మరియు అతని కుమారులకు చెందిన
  rationale: సందర్భంలో לְ యాజమాన్య లేదా అనుబంధ సంబంధాన్ని సూచిస్తుంది.
- source_word: הַסָּרִיסִים
  choice: రాజప్రాసాద అధికారులు[a]
  rationale: సందర్భం రాజపరిపాలనా జాబితా కావడంతో అధికారిక పాత్రను ప్రధాన పాఠంలో చూపించాం; శారీరక అర్థమైన ‘నపుంసకులు’ను పాదసూచికలో నిలిపాం.
- source_word: הַגִּבּוֹרִים
  choice: పరాక్రమశాలులు
  rationale: దావీదుతో అనుబంధమున్న ప్రసిద్ధ బలవంతులు లేదా యోధులను సూచించే గౌరవార్థక బహువచనానికి సహజమైన, గంభీరమైన తెలుగు.
- source_word: כָל גִּבּוֹר חָיִל
  choice: శౌర్యవంతులైన యోధులందరూ
  rationale: గִּבּוֹר మరియు חַיִל కలిపి బలం, ధైర్యం, యుద్ధసామర్థ్యం గల వ్యక్తులను సూచిస్తాయి; తెలుగులో పునరుక్తి లేకుండా భావబలాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన చారిత్రక-పరిపాలనా శైలిని అనుసరించాం. పొడవైన హెబ్రీ జాబితి తెలుగులో స్పష్టంగా చదవడానికి రెండు వాక్యాలుగా అమర్చబడింది; జాబితాలోని వర్గాల క్రమం నిలుపబడింది.
