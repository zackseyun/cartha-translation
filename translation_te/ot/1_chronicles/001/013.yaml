  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִיד֥וֹן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: te
  text: కనాను తన జ్యేష్ఠ కుమారుడైన సీదోనుకూ హేతుకూ తండ్రి అయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హేతు—హిత్తీయులతో సంబంధమున్న వంశపురుషుని పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: కనాను
  rationale: వంశావళి కొనసాగింపును తెలుగులో వాక్యక్రమమే సహజంగా తెలియజేస్తుంది; అందువల్ల ఆరంభ సంధికారకాన్ని ప్రత్యేకంగా అనువదించకుండా, పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: יָלַד
  choice: కన్నాడు
  rationale: పురుష కర్త ఉన్న వంశావళి సందర్భంలో జన్మనిచ్చి తండ్రి అయ్యాడనే భావాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి వేరుగా పదం అవసరం లేదు.
- source_word: צִידוֹן
  choice: సీదోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తించగల లిప్యంతరీకరణ.
- source_word: בְּכֹר/וֹ
  choice: తన జ్యేష్ఠ కుమారుడైన
  rationale: మొదట పుట్టినవాడనే జననక్రమ ప్రాధాన్యాన్ని స్పష్టంగా ఉంచుతూ, తెలుగు వంశావళి శైలిలో సహజంగా ఉంటుంది.
- source_word: וְ/אֶת
  choice: ను,
  rationale: రెండవ ప్రత్యక్ష కర్మను తెలుగు విభక్తి మరియు జాబితా విరామంతో సహజంగా కలిపాం.
- source_word: חֵת
  choice: హేతు
  rationale: ఇక్కడ పదం బహువచన జాతిపేరు కాదు, వంశపురుషుని వ్యక్తినామం; కాబట్టి ‘హిత్తీయులు’ అని వివరణాత్మకంగా మార్చలేదు.
theological_decisions:
- issue: חֵת ను వ్యక్తిగా లేదా జాతిగా చూపడం
  choice: హేతు అనే వంశపురుషుని వ్యక్తినామంగా అనువదించాం
  alternative: హిత్తీయులు
  rationale: హీబ్రూ పాఠంలో ఏకవచన వ్యక్తినామమే ఉంది; జాతిపేరుగా మార్చడం మూలపాఠం కంటే అధిక వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. ‘జ్యేష్ఠ కుమారుడు’ ద్వారా జననక్రమ భావాన్ని స్పష్టంగా ఉంచాం; వ్యక్తినామాలను తెలుగు బైబిలు పాఠకులకు సులభంగా గుర్తుపట్టే రూపాల్లో ఇచ్చాం.
