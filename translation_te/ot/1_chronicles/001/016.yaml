  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి-జాబితా శైలిని పాటించాం. ప్రజాసమూహ భావాన్ని తెలుగులో సహజమైన బహువచన రూపాలతో వ్యక్తం చేశాం; మూలంలోని సమష్టి ఏకవచన లక్షణాన్ని పాదటిప్పణిలో నిలిపాం.
