  text: మరియు అర్వాదీయులు[a], సెమారీయులు, హమాతీయులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇక్కడి హీబ్రూ జాతివాచకాలు వ్యాకరణరీత్యా ఏకవచనంలో ఉన్నా, ప్రజలను లేదా వంశాలను సమష్టిగా సూచిస్తున్నాయి: అర్వాదీయుడు, సెమారీయుడు, హమాతీయుడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: జాబితాలో విరామచిహ్నాల ద్వారా వరుస అనుసంధానం
  rationale: ప్రతి పేరుకు ముందున్న וְ జాబితాలోని తదుపరి అంశాన్ని కలుపుతుంది; אֵת ప్రత్యక్ష కర్మ సూచిక మాత్రమే. తెలుగు జాబితాలో కామాలతో ఈ అనుసంధానం సహజంగా వ్యక్తమవుతుంది; వాక్యభాగం ఆరంభంలో అనవసరంగా ‘మరియు’ చేర్చలేదు.
- source_word: הָאַרְוָדִי
  choice: అర్వాదీయులు
  rationale: రూపరీత్యా ఏకవచన జాతివాచకమైనా, వంశావళి జాబితాలో ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. ‘అర్వాదు ప్రజలు’ కంటే ‘అర్వాదీయులు’ సంక్షిప్తంగా, జాబితా శైలికి తగినట్లు ఉంది.
- source_word: הַצְּמָרִי
  choice: సెమారీలు
  rationale: ఈ జాతివాచకం సెమారు ప్రాంతంతో సంబంధమున్న ప్రజలను సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా ‘సెమారీలు’ అని లిప్యంతరీకరించబడింది.
- source_word: הַחֲמָתִי
  choice: హమాతీయులు
  rationale: హమాతుతో సంబంధమున్న ప్రజాసమూహాన్ని సూచించే సమష్టి జాతివాచకం. ‘హమాతీయులు’ అనే రూపం ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
