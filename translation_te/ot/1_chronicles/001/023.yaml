  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: te
  text: ఓఫీరు, హవీలా, యోబాబు. వీరందరూ యొక్తాను కుమారులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యొక్తాను వంశస్థులు.’ హెబ్రీలో ‘యొక్తాను కుమారులు’ అని ఉంది; అయితే వంశావళులలో ‘కుమారులు’ అనే పదం కొన్నిసార్లు విస్తృతంగా వంశపరంపరను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: (పేర్లను జాబితాలో సమన్వయంగా ఉంచడం; తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: אֵת ప్రత్యక్ష కర్మ సూచకం; వְ జాబితాలో పేర్లను కలుపుతుంది. ఈ వాక్యం ముందటి వచనం నుంచి కొనసాగుతున్న పేర్ల జాబితా కావడంతో, తెలుగులో ప్రతి పేరుకు ‘మరియు’ చేర్చడం కంటే విరామచిహ్నాలతో సహజంగా అందించడం సముచితం.
- source_word: אוֹפִיר
  choice: ఓఫీరు
  rationale: వ్యక్తినామాన్ని హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం; ఇక్కడ బంగారానికి ప్రసిద్ధమైన ప్రాంతం అనే భావాన్ని ప్రత్యేకంగా ప్రవేశపెట్టలేదు.
- source_word: חֲוִילָה
  choice: హవీలా
  rationale: వ్యక్తినామాన్ని హెబ్రీ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: వ్యక్తినామాన్ని హెబ్రీ ఉచ్చారణకు సమీపంగా, తెలుగులో సహజంగా గుర్తించగల రూపంలో ఇచ్చాం.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: ముందు పేర్కొన్న వ్యక్తులందరినీ సమగ్రంగా సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: హెబ్రీ పదం స్పష్టంగా పుంలింగ బహువచనంలో ‘కుమారులు’ అని ఉంది. వంశావళి సందర్భంలో విస్తృతంగా ‘వంశస్థులు’ అనే అర్థం సాధ్యమైనా, ప్రధాన పాఠ్యంలో మూలంలోని నిర్దిష్ట రూపాన్ని నిలిపాం.
- source_word: יָקְטָן
  choice: యొక్తాను
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగు బైబిలు పాఠకులకు గుర్తించదగిన సంప్రదాయ రూపానికి దగ్గరగా ఇచ్చాం; విభక్తి సంబంధాన్ని తెలిపేందుకు ‘యొక్తాను కుమారులు’ అనే నిర్మాణం వాడాం.
