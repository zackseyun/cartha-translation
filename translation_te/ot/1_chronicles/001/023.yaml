translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. ఇది ముందటి వచనం నుంచి కొనసాగుతున్న పేర్ల జాబితా కనుక ఆరంభంలో ‘మరియు’ను బలవంతంగా చేర్చలేదు. మూలంలోని ‘కుమారులు’ను ప్రధాన పాఠ్యంలో ఉంచి, వంశస్థులు అనే సాధ్యమైన విస్తృత అర్థాన్ని పాదటిప్పణిలో పరిరక్షించాం.
