source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: te
  text: పత్రూసీయులను, కస్లూహీయులను—వారి నుండి ఫిలిష్తీయులు వచ్చారు[a]—కఫ్తోరీయులను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అక్కడి నుండి ఫిలిష్తీయులు బయలుదేరి వచ్చారు.’ ఇక్కడ దినవృత్తాంతముల హీబ్రూ వాక్యనిర్మాణం ఈ మాటలను అత్యంత సహజంగా కస్లూహీయులతో కలుపుతుంది. అయితే ఆదికాండం 10:14లోనూ ఇదే మాటలున్నాయి; విస్తృత బైబిలు సంప్రదాయం ఫిలిష్తీయులను కఫ్తోరుతో కూడా అనుసంధానిస్తుంది (ఆమోసు 9:7; యిర్మీయా 47:4 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: పత్రుసీయులు
  rationale: పత్రోసుతో సంబంధమున్న ప్రజాసమూహ నామం; అర్థాన్ని ఊహించి అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: כַּסְלֻחִים
  choice: కస్లూహీయులు
  rationale: ఖచ్చితమైన గుర్తింపు తెలియని ప్రజాసమూహ నామం కాబట్టి, దానికి అదనపు అర్థం కలపకుండా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: వీరి నుండే … వచ్చారు
  rationale: అక్షరార్థంగా ‘అక్కడి నుండి బయటకు వచ్చారు’ అనే భావం ఉంది. వంశావళి సందర్భంలో వెంటనే ముందున్న కస్లూహీయులను మూలంగా సూచించడం సహజంగా ఉండటంతో ఈ రూపం ఎంచుకోబడింది; అక్షరార్థం మరియు అనుబంధంలోని ఉద్రిక్తత పాదసూచికలో నిలుపబడ్డాయి.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజలకు ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపం.
- source_word: כַּפְתֹּרִים
  choice: కఫ్తోరీయులు
  rationale: కఫ్తోరుతో సంబంధమున్న ప్రజాసమూహ నామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: וְאֶת
  choice: …లను
  rationale: ముందటి వచనంలోని వంశోత్పత్తి క్రియకు కొనసాగింపుగా ఉన్న కర్మల జాబితాను తెలుగులో ద్వితీయా విభక్తితో చూపించింది; పదేపదే వచ్చే సంధాయకాన్ని కృత్రిమంగా పునరావృతం చేయలేదు.
theological_decisions:
- issue: ఫిలిష్తీయులు ఎవరి నుండి వచ్చారనే సంబంధం
  choice: ప్రస్తుత హీబ్రూ వాక్యనిర్మాణం ప్రకారం వెంటనే ముందున్న కస్లూహీయులతో సంబంధపరచడం
  alternative: కఫ్తోరీయులతో సంబంధపరచడం లేదా ‘అక్కడి నుండి’ అని మాత్రమే ఉంచడం
  rationale: దినవృత్తాంతములలోని హీబ్రూ పదక్రమం సంబంధవాక్యాన్ని అత్యంత సహజంగా కస్లూహీయులతో కలుపుతుంది. అయితే ఇతర వచనాలు ఫిలిష్తీయులను కఫ్తోరుతో అనుసంధానిస్తాయి కాబట్టి ఆ ఉద్రిక్తతను పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. ఈ వచనం ముందటి వచనంలోని క్రియకు కొనసాగింపు కావడంతో ప్రజానామాలకు ‘-లను’ రూపం ఉంచబడింది; మధ్యలోని సంబంధవాక్యాన్ని దీర్ఘవిరామ చిహ్నాలతో స్పష్టపరచాం.
