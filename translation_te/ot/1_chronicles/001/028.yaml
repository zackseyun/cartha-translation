lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בֵּן పదం యొక్క నిర్మాణ బహువచనం; ఇక్కడ వంశావళి జాబితాను పరిచయం చేస్తోంది. ‘కుమారులు’ అనేది హీబ్రూ పదానికి నేరమైన, సహజమైన తెలుగు రూపం; మూలంలోని పురుషసంతాన సూచనను నిలుపుతుంది.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: వ్యక్తి పేరు; ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన బైబిలు నామరూపం.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: వ్యక్తి పేరు; ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన బైబిలు నామరూపం.
- source_word: וְ/יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: సంయోజక అవ్యయంతో కూడిన వ్యక్తి పేరు. తెలుగు జాబితా నిర్మాణంలో సంయోజక భావాన్ని కామాతో సహజంగా వ్యక్తం చేసి, పేరును ప్రామాణిక రూపంలో ఇచ్చాం.
