translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన మరియు గౌరవప్రదమైన రూపాన్ని ఉపయోగించాం. మూలంలోని పురుషసంతాన సూచనను ప్రధాన పాఠంలో ఉంచి, విస్తృత వంశావళి అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
