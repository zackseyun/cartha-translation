    reason: cross_reference
  revision_rationale: Only Ezer’s Telugu name form has been corrected. The translation correctly omits the English audit trail’s Zaavan note, since Genesis 36:27 has the same Hebrew name form; its stated Zavan difference is transliteration-based rather than a Hebrew textual variant. The Jaakan/Akan cross-reference note is retained.
