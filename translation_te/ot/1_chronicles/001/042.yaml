id: 1CH.1.42
reference: 1 Chronicles 1:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: te
  text: 'ఏజెరు కుమారులు: బిల్హాను, జావాను, యాకాను[a]. దీషోను కుమారులు: ఊజు, అరాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండము 36:27లోని సమాంతర వంశావళిలో ఈ పేరు ‘అకాను’ అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాను పరిచయం చేసే בֵּן పదపు నిర్మాణ బహువచనం. ఇక్కడ ప్రత్యక్ష కుమారులనే సూచిస్తున్నందున ‘సంతానం’ కంటే ‘కుమారులు’ మరింత ఖచ్చితమైనది.
- source_word: אֵצֶר
  choice: ఏచెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు సహజంగా లిప్యంతరీకరించాం; צ ధ్వనిని ‘చ’తో సూచించాం.
- source_word: בִּלְהָן
  choice: బిల్హాను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: זַעֲוָן
  choice: జావాను
  rationale: హీబ్రూ వ్యంజనాలు, దీర్ఘ స్వరాన్ని ప్రతిబింబించే సహజ తెలుగు లిప్యంతరీకరణ. సమాంతర వంశావళిలోనూ మసొరెటిక్ హీబ్రూ రూపం ఇదే కావడంతో కేవలం ఆంగ్ల లిప్యంతరీకరణ భేదాన్ని పాదసూచికగా ఇవ్వలేదు.
- source_word: יַעֲקָן
  choice: యాకాను
  rationale: దినవృత్తాంతాలలోని హీబ్రూ రూపాన్ని నేరుగా లిప్యంతరీకరించాం. ఆదికాండము 36:27లో భిన్న రూపం ఉన్నందున దాన్ని పాదసూచికలో తెలిపాం.
- source_word: דִישׁוֹן
  choice: దీషోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని లిప్యంతరీకరించాం; ఇదే వంశావళిలోని דִישָׁן అనే వేరొక పేరుతో కలవకుండా స్వరభేదాన్ని నిలిపాం.
- source_word: עוּץ
  choice: ఊజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో గుర్తించదగిన సంప్రదాయ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: אֲרָן
  choice: అరాను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని అలాగే ఉంచి, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పేర్ల జాబితాగా రూపొందించాం. మూలంలోని రెండు ‘కుమారులు’ విభాగాలను స్పష్టంగా నిలిపాం. ఆంగ్ల పాఠంలోని మొదటి పాదసూచిక స్థానం దాని విషయంతో సరిపోలకపోవడం, అలాగే జావాను విషయంలో మసొరెటిక్ మూలంలో నిజమైన పాఠభేదం లేకపోవడం వల్ల ఆ గమనికను చేర్చలేదు; యాకాను/అకాను అనే నిజమైన సమాంతర రూపభేదాన్ని మాత్రమే సూచించాం.
