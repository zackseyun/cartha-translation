translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన రూపం ఉపయోగించబడింది. పేర్లు హీబ్రూ పాఠం ఆధారంగా లిప్యంతరీకరించబడ్డాయి. పాఠభేద సూచికను సంబంధిత ‘హదదు’ పేరు వద్ద ఉంచాం.
