lexical_decisions:
- source_word: מִשְׁמָע
  choice: మిష్మా
  rationale: వంశావళిలోని వ్యక్తి పేరు కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וְ/דוּמָה
  choice: దూమా
  rationale: דוּמָה అనే పేరును లిప్యంతరీకరించాం. హీబ్రూలోని וְ సంధానార్థక అవ్యయాన్ని తెలుగులో సహజమైన జాబితా నిర్మాణం ద్వారా వ్యక్తం చేశాం.
- source_word: מַשָּׂא
  choice: మస్సా
  rationale: ఇక్కడ ఇది ‘భారం’ లేదా ‘దైవోక్తి’ అనే సాధారణ నామవాచకం కాదు; వంశావళిలోని వ్యక్తి పేరు. అందువల్ల పేరుగా లిప్యంతరీకరించబడింది.
- source_word: חֲדַד
  choice: హదదు
  rationale: దినవృత్తాంతముల హీబ్రూ పాఠంలో ఉన్న חֲדַד రూపాన్నే అనుసరించి పేరుగా లిప్యంతరీకరించాం; ఆదికాండము 25:15లోని సమాంతర జాబితాలో భిన్న రూపం ఉంది.
- source_word: וְ/תֵימָא
  choice: తేమా
  rationale: תֵימָא అనే పేరును లిప్యంతరీకరించాం. చివరి וְ యొక్క సంధాన భావం తెలుగులో జాబితా ముగింపు ద్వారా సహజంగా స్పష్టమవుతుంది.
