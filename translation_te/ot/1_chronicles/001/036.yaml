source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: te
  text: 'ఎలీఫజు కుమారులు: తేమాను, ఓమారు, సెఫీ[a], గాతాము, కెనజు, తిమ్నా[b], అమాలేకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హీబ్రూ రూపం ‘సెఫీ’; ఆదికాండం 36:11లో ‘సెఫో’ అనే భిన్న రూపం ఉంది.
    reason: textual_variant
  - marker: b
    text: ఆదికాండం 36:12 తిమ్నాను ఎలీఫజు ఉపపత్నిగా, అమాలేకును ఆమె కుమారునిగా పేర్కొంటుంది. అయితే ఇక్కడ దినవృత్తాంతాలు ఈ రెండు పేర్లనూ ఎలీఫజు కుమారుల జాబితాలో ఉంచుతున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בן అనే పదం యొక్క నిర్మాణ బహువచనం వంశావళి జాబితాను పరిచయం చేస్తోంది. ఇక్కడ ‘కుమారులు’ అనేది నేరమైన, సహజమైన అనువాదం; ‘వారసులు’ అనడం సాధ్యమైనా ఈ సందర్భంలో తక్కువ నిర్దిష్టం.
- source_word: אֱלִיפָז
  choice: ఎలీఫజు
  rationale: వ్యక్తి పేరు; ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: תֵּימָן
  choice: తేమాను
  rationale: వంశావళిలోని వ్యక్తి పేరు; హీబ్రూ ధ్వనిరూపాన్ని తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించింది.
- source_word: אוֹמָר
  choice: ఓమారు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: צְפִי
  choice: జెఫీ
  rationale: దినవృత్తాంతముల గ్రంథంలోని צְפִי రూపాన్నే ప్రధాన పాఠ్యంలో ప్రతిబింబించింది; ఆదికాండం 36:11లోని వేరొక రూపాన్ని పాదసూచికలో తెలిపింది.
- source_word: גַעְתָּם
  choice: గాతాము
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: קְנַז
  choice: కెనజు
  rationale: వ్యక్తి పేరును స్థిరమైన తెలుగు బైబిలు పేర్ల శైలిలో లిప్యంతరీకరించింది.
- source_word: תִמְנָע
  choice: తిమ్నా
  rationale: ఈ వచనంలోని స్వరచిహ్నిత హీబ్రూ పేరును ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: వ్యక్తి లేదా గోత్రపూర్వికుని పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְ / וַ
  choice: కామాలతో కూడిన జాబితా
  rationale: హీబ్రూలో పేర్ల ముందు సంధికారకాలు పునరావృతమైనా, ఆధునిక సహజ తెలుగులో కామాలతో జాబితా ఇవ్వడం దాని నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనంలో తిమ్నా, అమాలేకు సంబంధం మరియు ఆదికాండం 36:12తో కనిపించే భేదం
  choice: దినవృత్తాంతముల గ్రంథంలోని సరళ వ్యాకరణ నిర్మాణాన్ని అనుసరించి తిమ్నా, అమాలేకు ఇద్దరి పేర్లనూ ‘ఎలీఫజు కుమారులు’ అనే జాబితాలో ఉంచడం
  alternative: ఆదికాండం 36:12తో సమన్వయం చేసి తిమ్నాను ఎలీఫజు ఉపపత్నిగా, అమాలేకును ఆమె కుమారునిగా ప్రధాన పాఠ్యంలో వివరించడం
  rationale: మూల హీబ్రూ ఈ పేర్లన్నింటినీ ‘ఎలీఫజు కుమారులు’ అనే ఒకే జాబితాలో అందిస్తోంది. సమాంతర వృత్తాంతంలోని సమాచారంతో ప్రధాన పాఠ్యాన్ని మార్చకుండా, కనిపించే ఉద్రిక్తతను పాదసూచికలో నిలిపింది.
translation_notes:
  register: సంక్షిప్త వంశావళి శైలిని కాపాడుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ప్రమాణ భాష వాడబడింది. పేర్లు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; మూలంలోని జాబితా నిర్మాణం సహజ తెలుగు విరామచిహ్నాలతో అందించబడింది.
