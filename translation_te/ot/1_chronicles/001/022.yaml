lexical_decisions:
- source_word: וְאֶת
  choice: జాబితా విరామచిహ్నాలు
  rationale: వంశావళి జాబితాలో וְ సంధాయకం, אֶת కర్మసూచకం ప్రతి పేరును పరిచయం చేస్తున్నాయి. తెలుగులో కర్మసూచకాన్ని విడిగా అనువదించకుండా, సహజమైన జాబితా నిర్మాణంతో సంబంధాన్ని తెలిపాం.
- source_word: עֵיבָל
  choice: ఏబాలు
  rationale: హీబ్రూ రూపం עֵיבָל ను ఆధారంగా తీసుకొని తెలుగులో లిప్యంతరీకరించాం; ఆదికాండము 10:28లోని సమాంతర వంశావళిలో భిన్న రూపం ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
- source_word: אֲבִימָאֵל
  choice: అబీమాయేలు
  rationale: వ్యక్తిపేరును దాని హీబ్రూ ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שְׁבָא
  choice: షెబా
  rationale: שְׁבָא అనే హీబ్రూ పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; వేరే పేరైన సెబాతో కలపలేదు.
