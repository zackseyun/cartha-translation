  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్త జాబితా శైలిని వాడాం. పేర్లను అనువదించకుండా హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం.
