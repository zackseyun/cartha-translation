base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: te
  text: 'వారి వంశావళి[a] ఇది: ఇష్మాయేలు జ్యేష్ఠ కుమారుడు నెబాయోతు, కేదారు, అద్బెయేలు, మిబ్శాము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వంశావళి’ అని అనువదించిన హీబ్రూ పదం సందర్భానుసారం ‘సంతతి’ లేదా ‘వంశవివరం’ అని కూడా అర్థమివ్వగలదు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אֵלֶּה תֹּלְדוֹתָם
  choice: వారి వంశావళి ఇది
  rationale: ఇది వంశసంబంధమైన జాబితాను పరిచయం చేసే హీబ్రూ సూత్రవాక్యం. ‘వారి’ అనే బహువచన సంబంధాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే ఏకవచన సమాహారపదమైన ‘వంశావళి’ వాడబడింది.
- source_word: בְּכוֹר
  choice: జ్యేష్ఠ కుమారుడు
  rationale: మూలపదం మొదట పుట్టినవాని హోదాను సూచిస్తుంది. తెలుగులో ఎవరి జ్యేష్ఠుడో స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘కుమారుడు’ చేర్చబడింది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: נְבָיוֹת
  choice: నెబాయోతు
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: קֵדָר
  choice: కేదారు
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אַדְבְּאֵל
  choice: అద్బెయేలు
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిని తెలుగులో సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే రూపం.
- source_word: מִבְשָׂם
  choice: మిబ్శాము
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. పేర్లు తెలుగు బైబిలు పఠనంలో సహజంగా వినిపించే రూపాల్లో లిప్యంతరీకరించబడ్డాయి.
