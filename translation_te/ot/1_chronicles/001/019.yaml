source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: te
  text: ఏబెరుకు ఇద్దరు కుమారులు పుట్టారు. వారిలో ఒకరి పేరు పెలెగు[a]; ఎందుకంటే అతని రోజుల్లో భూమి విభజించబడింది. అతని సహోదరుని పేరు యొక్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశం విభజించబడింది.” హీబ్రూ పదం మొత్తం భూమినిగానీ, ఒక దేశం లేదా ప్రాంతాన్నిగానీ సూచించవచ్చు; విభజన స్వరూపం ఏమిటో వచనం చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: ఏబెరుకు
  rationale: లְ ఉపసర్గ సూచించే పరోక్ష సంబంధాన్ని సహజమైన తెలుగు దత్తి విభక్తితో వ్యక్తం చేసింది; వంశావళి ప్రవాహంలో వాక్యారంభంలోని וּను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోవడం తెలుగులో సహజం.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: ఇద్దరు కుమారులు పుట్టారు
  rationale: హీబ్రూ నిష్క్రియ జనన నిర్మాణాన్ని తెలుగు సహజ ప్రయోగంలో నిలిపింది; בָנִיםకు వంశావళి సందర్భానుసారం ‘కుమారులు’ అని ఇచ్చింది.
- source_word: שֵׁם הָאֶחָד
  choice: ఒకని పేరు
  rationale: הָאֶחָדను ‘మొదటివాడు’గా సంఖ్యాక్రమం విధించకుండా, ఇద్దరిలో ఒకడిని సూచించే భావంతో అనువదించింది.
- source_word: פֶּלֶג
  choice: పెలెగు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: כִּי בְיָמָיו
  choice: ఎందుకంటే అతని రోజుల్లో
  rationale: כִּי ఇక్కడ పేరుకు సంబంధించిన కారణవివరణను ప్రవేశపెడుతుంది; ‘అతని రోజుల్లో’ కాలసంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: భూమి విభజించబడింది
  rationale: נפלג యొక్క నిష్క్రియ భావాన్ని నిలిపి, הָאָרֶץకు విస్తృత అర్థమైన ‘భూమి’ని ఎంచుకుంది; విభజన స్వరూపాన్ని వచనం కంటే ఎక్కువగా నిర్ధారించలేదు.
- source_word: וְשֵׁם אָחִיו
  choice: అతని సహోదరుని పేరు
  rationale: స్వామ్య సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: יָקְטָן
  choice: యొక్తాను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: పెలెగు పేరు సందర్భంలో ‘భూమి విభజించబడింది’ అనే మాట అర్థం
  choice: విభజన స్వరూపాన్ని నిర్దేశించకుండా ‘భూమి విభజించబడింది’ అని ఉంచడం
  alternative: ‘దేశం విభజించబడింది’ అని అనువదించడం; లేదా బాబేలు వద్ద ప్రజలు/భాషలు విడిపోయిన సంఘటనగా, లేక భౌగోళిక విభజనగా స్పష్టీకరించడం
  rationale: హీబ్రూ వచనం విభజన ఏ విధమైనదో చెప్పదు. అందువల్ల నిర్దిష్ట చారిత్రక లేదా భౌగోళిక వివరణను ప్రధాన వచనంలో చేర్చకుండా మూలంలోని వ్యాఖ్యాన విస్తృతిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించింది. హీబ్రూ వాక్యనిర్మాణాన్ని సాధ్యమైనంత పారదర్శకంగా ఉంచుతూ, తెలుగులో కృత్రిమంగా వినిపించే అనవసర సంధాన పదాలను నివారించింది.
