translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజవారసత్వ భావాన్ని సహజంగా తెలియజేయడానికి రెండు చిన్న వాక్యాలుగా నిర్మించాం; మూలంలో లేని ‘యూఫ్రటీసు’ను ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో ఉంచాం.
