  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: te
  text: సమ్లా చనిపోయాడు. అతని స్థానంలో ఆ నది[a] దగ్గరనున్న రెహోబోతుకు చెందిన షౌలు రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఆ నది’; చాలామంది దీనిని యూఫ్రటీసు నదికి సూచనగా అర్థం చేసుకుంటారు.
    reason: హీబ్రూ הַנָּהָר అక్షరార్థంగా ‘ఆ నది’ అని ఉంది. సందర్భంలో ఇది యూఫ్రటీసును సూచించవచ్చు, కానీ మూలపాఠంలో ఆ పేరు స్పష్టంగా లేదు.
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ ఇక్కడ మరణాన్ని సూటిగా తెలియజేస్తుంది; అనవసరమైన సభ్యోక్తి లేకుండా సహజమైన ఆధునిక తెలుగు వాడబడింది.
- source_word: שַׂמְלָה
  choice: సమ్లా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజుల వారసత్వ సూత్రంలో מלך ఇక్కడ సింహాసనాన్ని అధిష్ఠించి రాజుగా ఏలడం ప్రారంభించిన భావాన్ని ఇస్తుంది; ‘రాజయ్యాడు’ ఆ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: תחתיו రాజవారసత్వ సందర్భంలో ముందున్న రాజుకు బదులుగా అతని స్థానాన్ని స్వీకరించడాన్ని సూచిస్తుంది.
- source_word: שָׁאוּל
  choice: షావూలు
  rationale: ఈ ఎదోము రాజు పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, తరువాతి ఇశ్రాయేలీయుడైన సౌలుతో అనవసరమైన కలయికను నివారించాం.
- source_word: מֵרְחֹבוֹת
  choice: రెహోబోతుకు చెందిన
  rationale: ఉపసర్గ מ־ మూలస్థలాన్ని లేదా అనుబంధాన్ని సూచిస్తుంది; తెలుగులో ‘రెహోబోతుకు చెందిన’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַנָּהָר
  choice: నది
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆ నది/నది’; అది యూఫ్రటీసును సూచించే అవకాశం ఉన్నా మూలపాఠం దాని పేరును స్పష్టంగా చెప్పదు.
