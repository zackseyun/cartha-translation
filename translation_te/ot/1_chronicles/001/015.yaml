  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: te
  text: హివ్వీయులను[a], అర్కీయులను, సీనీయులను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఈ మూడు జాతివాచక పేర్లు నిర్దిష్ట ఉపపదంతో ఏకవచన రూపంలో ఉన్నాయి—‘హివ్వీయుడు,’ ‘అర్కీయుడు,’ ‘సీనీయుడు.’ అయితే ఈ వంశావళి సందర్భంలో అవి ప్రజలను లేదా వంశాలను సూచిస్తున్నందున తెలుగులో బహువచనంగా అనువదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: '[జాబితాలో విరామచిహ్నాలతో వ్యక్తీకరించబడింది]'
  rationale: ప్రతి పేరుకు ముందు ఉన్న וְ సమన్వయాన్ని తెలుగులో సహజమైన జాబితా నిర్మాణం, విరామచిహ్నాలతో వ్యక్తీకరించాం. אֵת అనే ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు.
- source_word: הַחִוִּי
  choice: హివ్వీయులు
  rationale: ఇది నిర్దిష్ట ఉపపదంతో ఉన్న ఏకవచన జాతివాచక రూపం; వంశావళి సందర్భంలో ఒక ప్రజాసమూహాన్ని సూచిస్తున్నందున తెలుగులో సహజమైన బహువచన రూపాన్ని వాడాం.
- source_word: הָעַרְקִי
  choice: అర్కీయులు
  rationale: ఇది ఒక ప్రాంతం లేదా వంశానికి సంబంధించిన జాతివాచక నామం. సందర్భంలోని సామూహిక భావాన్ని తెలుగులో బహువచనంతో తెలిపాం.
- source_word: הַסִּינִי
  choice: సీనీయులు
  rationale: ఇది జాతివాచక నామం. చుట్టుపక్కల పేర్ల మాదిరిగానే ఒక ప్రజాసమూహాన్ని సూచిస్తున్నందున బహువచన రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. హీబ్రూ జాతివాచక ఏకవచన రూపాల సామూహిక భావాన్ని సహజ తెలుగు బహువచనంతో అందించాం.
