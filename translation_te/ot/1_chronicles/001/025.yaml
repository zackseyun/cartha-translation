  register: సంక్షిప్త వంశావళి శైలిని యథాతథంగా నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా మరియు సులభంగా చదవదగిన పేర్ల రూపాలను ఉపయోగించాం. తెలుగు సందర్భంలో ఏబెరు/హెబెరు అనే ఆంగ్ల సంప్రదాయ భేదాన్ని సూచించే పాదసూచిక అవసరం లేదు.
