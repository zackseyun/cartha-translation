lexical_decisions:
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: వంశావళిలోని వ్యక్తినామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని వాడాం.
- source_word: פֶּלֶג
  choice: పెలెగు
  rationale: ఇక్కడ ఇది ‘విభజన’ లేదా ‘కాలువ’ అనే సామాన్య నామవాచకం కాదు, వ్యక్తినామం; అందువల్ల తెలుగు బైబిలు పాఠకులకు సహజమైన లిప్యంతరీకరణను వాడాం.
- source_word: רְעוּ
  choice: రెయూ
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపంలోని రెండు అచ్చుల ధ్వనులను స్పష్టంగా ప్రతిబింబించేలా లిప్యంతరీకరించాం.
