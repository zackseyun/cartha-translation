source:
  edition: WLC
  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: te
  text: 'అబ్రాహాము ఇస్సాకుకు తండ్రి అయ్యాడు. ఇస్సాకు కుమారులు: ఏశావు మరియు ఇశ్రాయేలు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “ఇశ్రాయేలు,” అంటే యాకోబు.'
    reason: మూలపాఠం యాకోబు అనే జన్మనామం బదులు ‘ఇశ్రాయేలు’ అనే పేరును వాడుతున్నదని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: తండ్రి అయ్యాడు
  rationale: ילד ధాతువు హిఫిల్ రూపం వంశావళి సందర్భంలో సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తండ్రి అయ్యాడు’ సహజంగా, స్పష్టంగా ఉంది; ‘కన్నాడు’ కంటే పురుష కర్తతో తక్కువ సందిగ్ధంగా ఉంటుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు. ‘ఇస్సాకుకు తండ్రి అయ్యాడు’ అనే వాక్య నిర్మాణంలో దాని వ్యాకరణ సంబంధం వ్యక్తమవుతుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בן పదం యొక్క బహువచన సమాస రూపం; తదుపరి వంశావళి శాఖను పరిచయం చేస్తుంది. శీర్షికలాంటి సంక్షిప్త నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: וְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ పాఠం యాకోబు అనే జన్మనామానికి బదులు అతని ‘ఇశ్రాయేలు’ అనే పేరునే ఉపయోగిస్తుంది. మూలపాఠంలోని రూపాన్ని మార్చకుండా నిలుపుకున్నాం.
theological_decisions:
- issue: యాకోబును సూచించే వంశావళిలో יִשְׂרָאֵל అనే పేరును అనువదించడం
  choice: ఇశ్రాయేలు
  alternative: యాకోబు
  rationale: ఈ వచనం ఇస్సాకు కుమారులను ‘ఏశావు, ఇశ్రాయేలు’ అని స్పష్టంగా పేర్కొంటుంది. ఇక్కడ సూచించబడిన వ్యక్తి యాకోబే అయినప్పటికీ, మూలపాఠాన్ని ‘యాకోబు’గా సమన్వయపరచకుండా దానిలోని పేరును అలాగే ఉంచాం; పాఠకునికి స్పష్టత కోసం పాదసూచిక ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. మొదటి వాక్యంలో అర్థస్పష్టత కోసం ‘తండ్రి అయ్యాడు’ వాడబడింది; రెండవ వాక్యంలో మూలంలోని సంక్షిప్త జాబితా నిర్మాణం నిలుపబడింది.
