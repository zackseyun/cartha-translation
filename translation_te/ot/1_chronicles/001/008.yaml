translation:
  language: te
  text: 'హాము కుమారులు: కూషు, మిస్రాయిము[a], పూతు, కనాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మిస్రాయిము అనే పేరు సాంప్రదాయంగా ఐగుప్తుతో సంబంధం కలిగి ఉంది. అయితే ఇక్కడ అది వంశావళిలో వ్యక్తినామంగా ఉన్నందున హీబ్రూ నామరూపాన్నే ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి బహువచన నిర్మాణరూపం. వంశావళిలో ‘కుమారులు’ ప్రత్యక్ష కుమారులను గానీ, విస్తృత వంశసంతతిని గానీ సూచించవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన సంప్రదాయ రూపాన్ని ఉంచాం.
- source_word: חָם
  choice: హాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כּוּשׁ
  choice: కూషు
  rationale: వంశావళిలో వ్యక్తి లేదా మూలపురుషుని పేరుగా ఉన్న హీబ్రూ నామాన్ని లిప్యంతరీకరించాం.
- source_word: מִצְרַיִם
  choice: మిస్రాయిము
  rationale: ఇక్కడ ఇతర మూలపురుషుల పేర్లతో కూడిన వంశావళి జాబితాలో ఉన్నందున ‘ఐగుప్తు’ అనే భౌగోళిక అనువాదానికి బదులు హీబ్రూ నామరూపాన్ని నిలిపాం.
- source_word: פּוּט
  choice: పూతు
  rationale: హీబ్రూ దీర్ఘ ū ధ్వనిని ప్రతిబింబించే సహజ తెలుగు లిప్యంతరీకరణ.
- source_word: כְנָעַן
  choice: కనాను
  rationale: వంశావళిలో మూలపురుషుని పేరుగా వాడిన హీబ్రూ నామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపం.
theological_decisions:
- issue: ‘కుమారులు’ అనే వంశావళి సూత్రపదం యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులు’ అని ఉంచడం
  alternative: ‘వంశస్థులు’ అని అనువదించడం
  rationale: హీబ్రూ בְּנֵי ప్రత్యక్ష కుమారులను లేదా విస్తృత సంతతిని సూచించగలదు. ‘కుమారులు’ మూలరూపాన్ని కాపాడుతుంది; విస్తృత అర్థాన్ని అనువాదంలో బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. హీబ్రూ పేర్లను తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం; వాక్యంలోని నిజమైన వంశావళి అస్పష్టతను పరిష్కరించకుండా నిలిపాం.
