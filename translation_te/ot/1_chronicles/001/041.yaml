source:
  edition: WLC
  text: בְּנֵ֥י עֲנָ֖ה דִּישׁ֑וֹן וּ/בְנֵ֣י דִישׁ֔וֹן חַמְרָ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽןס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: te
  text: 'అనాహు కుమారులు: దీషోను. దీషోను కుమారులు: హమ్రాను[a], ఎష్బాను, ఇత్రాను, మరియు కెరాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండము 36:26లోని సమాంతర వంశావళిలో ‘హమ్రాను’కు బదులుగా ‘హెమ్దాను’ అని ఉంది. ఇక్కడి ప్రధాన పాఠం 1 దినవృత్తాంతములలోని మసోరా పాఠాన్ని అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారుడు / కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మిత బహువచనం సహజంగా ‘కుమారులు’ అని అర్థమిస్తుంది. మొదటి జాబితాలో ఒక్క పేరే ఉన్నందున తెలుగులో సహజత్వం కోసం ఏకవచనమైన ‘కుమారుడు’ వాడబడింది.
- source_word: עֲנָה
  choice: అనాహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: דִּישׁוֹן
  choice: దీషోను
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; ఈ వచనంలో అనాహు కుమారునిగానూ తదుపరి నలుగురి తండ్రిగానూ వచ్చిన రెండు చోట్ల ఒకే రూపాన్ని నిలిపాం.
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: తెలుగు వంశావళి జాబితాలో కొత్త వాక్యంగా సహజంగా చదవడానికి సంధికారకమైన ו ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు; జాబితా సంబంధం విరామచిహ్నం ద్వారా స్పష్టమవుతుంది.
- source_word: חַמְרָן
  choice: హమ్రాను
  rationale: 1 దినవృత్తాంతములు మసోరా పాఠంలోని חמרן రూపాన్నే ప్రధాన పాఠంలో అనుసరించాం. ఆదికాండము 36:26లోని భిన్న రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֶשְׁבָּן
  choice: ఎష్బాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יִתְרָן
  choice: ఇత్రాను
  rationale: హీబ్రూ వ్యంజన రూపాన్ని నేరుగా ప్రతిబింబించేలా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: כְרָן
  choice: కెరాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా లిప్యంతరీకరించాం; చివరి పేరుకు ముందు ఉన్న ו కు తెలుగు జాబితాలో ప్రత్యేక ‘మరియు’ అవసరం లేకుండా కామాతో పేర్లను అమర్చాం.
