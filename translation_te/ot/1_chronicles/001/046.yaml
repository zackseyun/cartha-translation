  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి-రాజవంశ కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ సంయుక్త వాక్యాన్ని తెలుగు పఠన సౌలభ్యం కోసం చిన్న వాక్యాలుగా విభజించాం.
