  text: וַ/יָּ֖מָת חוּשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עיות־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: te
  text: హూషాము చనిపోయాడు. అతని స్థానంలో బెదదు కుమారుడైన హదదు రాజయ్యాడు. ఇతడు మోయాబు మైదానంలో మిద్యానును దెబ్బకొట్టాడు. అతని పట్టణం పేరు అవీతు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అయోతు’; ఈ పట్టణం పేరుకు వేరొక లిప్యంతరీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియకు ఇది సూటిగా, సాధారణ ఆధునిక తెలుగులో అర్థమయ్యే అనువాదం; మూలంలోని సరళ కథన శైలిని కాపాడుతుంది.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో … రాజయ్యాడు
  rationale: מלך ఇక్కడ రాజ్యాధికారాన్ని చేపట్టడాన్ని సూచిస్తుంది; תחתיו లోని స్థానభర్తీ భావాన్ని ‘అతని స్థానంలో’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֲדַד בֶּן־בְּדַד
  choice: బెదదు కుమారుడైన హదదు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: ఇతడు … మిద్యానును ఓడించాడు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం లేదా దెబ్బతీయడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘మిద్యానును కొట్టాడు’ అసహజంగా ఉండడం వల్ల, సైనిక సందర్భానికి సహజమైన ‘ఓడించాడు’ ఎంచుకోబడింది.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: మోయాబు ప్రాంతంలో
  rationale: שׂדה పదం అక్షరార్థంగా ‘పొలం’ అయినప్పటికీ, ఇక్కడ దేశప్రాంతం లేదా భూభాగాన్ని సూచిస్తుంది; ‘ప్రాంతంలో’ సాధారణ పాఠకునికి సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְשֵׁם עִירוֹ
  choice: అతని పట్టణం పేరు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: עיות
  choice: అవీతు
  rationale: సమాంతర వచనం మరియు ప్రాచుర్యంలో ఉన్న స్వరరూపం ఆధారంగా స్థలనామాన్ని ‘అవీతు’గా లిప్యంతరీకరించాం; వేరొక లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
