  source_fidelity: హీబ్రూ మూలపాఠంలోని నిర్మాణం—“యెపెతు కుమారులు” అని చెప్పి ఏడుగురు పేర్లను జాబితా చేయడం—ఖచ్చితంగా ప్రతిఫలించింది. పేర్లు అనువదించబడకుండా లిప్యంతరీకరించబడ్డాయి; మాదయి, యావాను వంటి పేర్లకు జాతి/భౌగోళిక వివరణను ప్రధాన పాఠ్యంలో అనవసరంగా చేర్చలేదు.
  naturalness: “యెపెతు కుమారులు:” అనే శీర్షికతో, కామాలు మరియు చివరి “మరియు”తో ఇచ్చిన జాబితా ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. సంక్షిప్త వంశావళి రిజిస్టర్‌కు ఇది తగినది.
  terminology: “కుమారులు” అనేది בְּנֵיకి ఈ తక్షణ వంశావళి జాబితాలో సరైన, రూపపరంగా సమీపమైన అనువాదం. అన్ని వ్యక్తినామాల లిప్యంతరీకరణలు మూల హీబ్రూ రూపాలకు సమంజసంగా ఉన్నాయి. పాదసూచికలో ఉన్న విస్తృత వంశార్థ సంభావ్యతను తగిన మితితో వివరిస్తూ, ఈ సందర్భంలో అది జాబితాను పరిచయం చేస్తోందని సరిగా తెలియజేస్తుంది.
