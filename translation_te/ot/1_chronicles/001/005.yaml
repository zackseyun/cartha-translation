  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. పేర్లను హీబ్రూ మూలరూపాలకు దగ్గరగా, తెలుగులో సులభంగా చదవగల విధంగా లిప్యంతరీకరించాం.
