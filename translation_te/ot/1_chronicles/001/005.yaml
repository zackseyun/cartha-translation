base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: te
  text: 'యెపెతు కుమారులు: గోమెరు[a], మాగోగు, మాదయి, యావాను, తూబాలు, మెషెకు, తీరాసు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో “కుమారులు” అనే పదం కొన్ని వంశావళి సందర్భాల్లో నేరుగా పుట్టిన కుమారులను గానీ, విస్తృతార్థంలో వంశస్థులను గానీ సూచించవచ్చు; ఇక్కడ అది యెపెతు వంశపు పేర్ల జాబితాను పరిచయం చేస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בֵּן పదానికి నిర్మాణ బహువచన రూపం; వంశావళిలో ఇక్కడ పేరుపేరునా చెప్పబడిన యెపెతు కుమారులను పరిచయం చేస్తోంది. అందువల్ల సహజమైన, రూపపరంగా దగ్గరైన తెలుగు పదాన్ని వాడాం.
- source_word: יֶפֶת
  choice: యెపెతు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: גֹּמֶר
  choice: గోమెరు
  rationale: వంశావళిలోని వ్యక్తి పేరు; అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: מָגוֹג
  choice: మాగోగు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: מָדַי
  choice: మాదయి
  rationale: ఇక్కడ జాతిపరమైన అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, వంశావళి పేరుగా లిప్యంతరీకరించాం.
- source_word: יָוָן
  choice: యావాను
  rationale: గ్రీసు లేదా అయోనియాతో ఉన్న సంబంధాన్ని వివరణగా మార్చకుండా, పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: תֻבָל
  choice: తూబాలు
  rationale: వ్యక్తి పేరు; అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: מֶשֶׁךְ
  choice: మెషెకు
  rationale: వ్యక్తి పేరు; హీబ్రూ ధ్వనిరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: תִירָס
  choice: తీరాసు
  rationale: వ్యక్తి పేరు; అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וְ / וּ
  choice: కామాలతో జాబితా
  rationale: హీబ్రూలో అనేక పేర్ల ముందు సంధాయకం పునరావృతమైనా, ఆధునిక తెలుగులో సహజమైన జాబితా శైలిని అనుసరించడం ద్వారా అదే కార్యాన్ని స్పష్టంగా నిలిపాం.
