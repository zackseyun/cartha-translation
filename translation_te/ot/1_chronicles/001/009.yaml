  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: te
  text: 'కూషు కుమారులు: సెబా, హవీలా, సబ్తా, రయమా, సబ్తెకా. రయమా కుమారులు: షెబా, దెదాన్.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: కూషు కుమారులు
  rationale: בְּנֵי అనే వంశావళి పదబంధానికి నేరమైన అర్థం ‘కుమారులు.’ ఆరంభంలోని וְ భావం జాబితా నిర్మాణంలో సహజంగా అంతర్లీనంగా ఉండడంతో ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: סְבָא
  choice: సెబా
  rationale: హెబ్రీ వ్యక్తి/జాతి నామాన్ని తెలుగులో ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֲוִילָה
  choice: హవీలా
  rationale: హెబ్రీ నామంలోని వ్యంజనాలు, దీర్ఘస్వరాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: סַבְתָּא
  choice: సబ్తా
  rationale: హెబ్రీ నామాన్ని అదనపు వివరణ లేకుండా నేరుగా లిప్యంతరీకరించాం.
- source_word: רַעְמָא
  choice: రాయమా
  rationale: హెబ్రీ నామంలోని ע ధ్వని స్థానాన్ని పూర్తిగా కనుమరుగుచేయకుండా, తెలుగులో పలకడానికి సహజంగా ఉండే సాంప్రదాయిక రూపాన్ని ఎంచుకున్నాం; దీనివల్ల వేరే బైబిలు నామమైన ‘రామా’తో గందరగోళం కూడా తగ్గుతుంది.
- source_word: סַבְתְּכָא
  choice: సబ్తెకా
  rationale: హెబ్రీ వ్యంజన క్రమాన్ని అనుసరించిన సహజ తెలుగు లిప్యంతరీకరణ.
- source_word: וּבְנֵי רַעְמָא
  choice: రాయమా కుమారులు
  rationale: ఇది వంశావళిలోని ఉపశాఖను ప్రారంభిస్తుంది. తెలుగులో వాక్య విభజన ఆ సంబంధాన్ని స్పష్టంగా చూపుతున్నందున ఆరంభ సంధిని విడిగా అనువదించలేదు.
- source_word: שְׁבָא
  choice: షెబా
  rationale: హెబ్రీ שׁ ధ్వనిని ‘ష’తో, మిగతా స్వరవ్యంజనాలను సహజ తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: דְדָן
  choice: దెదాన్
  rationale: హెబ్రీ నామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం; మూలంలో లేని తెలుగు పుంలింగాంత ‘ు’ను చేర్చలేదు.
