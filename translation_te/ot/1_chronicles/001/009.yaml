  register: సంక్షిప్త వంశావళి శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదివేలా కోలన్‌లతో జాబితాలను అమర్చాం. పేర్లను అనువదించకుండా మూల హెబ్రీ ఉచ్చారణ ఆధారంగా లిప్యంతరీకరించాం.
