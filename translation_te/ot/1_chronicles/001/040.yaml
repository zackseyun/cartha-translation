  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י שׁוֹבָ֔ל עַלְיָ֧ן וּ/מָנַ֛חַת וְ/עֵיבָ֖ל שְׁפִ֣י וְ/אוֹנָ֑ם וּ/בְנֵ֥י צִבְע֖וֹן אַיָּ֥ה וַ/עֲנָֽהס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: te
  text: 'షోబాలు కుమారులు: అల్యాను[a], మనహతు, ఏబాలు, షెఫీ[b], ఓనాము. సిబ్యోను కుమారులు: అయ్యా, అనా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అల్యాను’; ఆదికాండము 36:23లోని సమాంతర వంశావళిలో ‘అల్వాను’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: దినవృత్తాంతముల పాఠంలో ‘షెఫీ’; ఆదికాండము 36:23లోని సమాంతర వంశావళిలో ‘షెఫో’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళిలో ఈ పదానికి అక్షరార్థంగా ‘కుమారులు’ అనే భావం ఉంది; ఇక్కడ వెంటనే పేర్లతో సంతానం జాబితా చేయబడినందున అదే సహజమైన ఎంపిక.
- source_word: שׁוֹבָל
  choice: షోబాలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: עַלְיָן
  choice: అల్యాను
  rationale: దినవృత్తాంతముల మసొరేటిక్ పాఠంలోని రూపాన్నే అనుసరించిన లిప్యంతరీకరణ; ఆదికాండము 36:23లోని భిన్న రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: מָנַחַת
  choice: మనహతు
  rationale: హీబ్రూ పేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֵיבָל
  choice: ఏబాలు
  rationale: ఈ వచనంలోని హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: שְׁפִי
  choice: షెఫీ
  rationale: దినవృత్తాంతముల పాఠంలోని పేరురూపాన్ని నిలిపాం; సమాంతర వంశావళిలోని రూపాంతరాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אוֹנָם
  choice: ఓనాము
  rationale: హీబ్రూ వ్యక్తినామానికి ధ్వన్యనుసారమైన తెలుగు రూపం.
- source_word: צִבְעוֹן
  choice: సిబ్యోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַיָּה
  choice: అయ్యా
  rationale: హీబ్రూ పేరులోని ద్విత్వ య్ ధ్వనిని ప్రతిబింబించే సహజ తెలుగు లిప్యంతరీకరణ.
- source_word: עֲנָה
  choice: అనా
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా తెలుగు లిపిలో అందించాం.
- source_word: וְ / וּ / וַ
  choice: జాబితాలో విరామచిహ్నాలు; రెండో వాక్యంలో అంతర్నిహిత సమన్వయం
  rationale: హీబ్రూలోని సంధికారకాలు పేర్లను, రెండు వంశావళి భాగాలను కలుపుతాయి. తెలుగులో ప్రతి పేరుకూ ‘మరియు’ చేర్చడం భారంగా ఉండేందున కామాలతో సహజంగా సమన్వయించాం; భావాన్ని మార్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. పేర్లను మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; పాఠాంతరాలను ప్రధాన పాఠంలో కలపకుండా పాదసూచికల్లో నిలిపాం.
