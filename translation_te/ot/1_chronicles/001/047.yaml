  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: te
  text: హదదు చనిపోయాడు; అతని స్థానంలో[a] మస్రేకా నుండి వచ్చిన సమ్లా రాజుగా పాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని తరువాత.” హీబ్రూలో అక్షరార్థంగా “అతని కింద/అతని స్థానంలో”; ఇక్కడ ఇది రాజ్యాధికార వారసత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: మూత్ క్రియ ఇక్కడ సూటిగా మరణాన్ని సూచిస్తుంది; అనవసరమైన మార్మిక పదప్రయోగం లేకుండా ఆధునిక తెలుగులో సహజంగా అనువదించాం.
- source_word: הֲדָד
  choice: హదదు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: రాజుల వారసత్వ జాబితా సందర్భంలో מָלַךְ అంటే రాజుగా పాలించడం; జాబితా శైలిని నిలుపుతూ సహజమైన తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ఈ సందర్భంలో תַּחַת రాజ్యాధికారంలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించడాన్ని సూచిస్తుంది; ‘అతని స్థానంలో’ ఈ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שַׂמְלָה
  choice: సమ్లా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִמַּשְׂרֵקָה
  choice: మస్రేకాకు చెందిన
  rationale: מִן ఇక్కడ స్థల మూలం లేదా అనుబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మస్రేకాకు చెందిన’ సహజంగా ఆ అనుబంధాన్ని తెలియజేస్తుంది.
