  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: te
  text: షావూలు చనిపోయాడు. అతని స్థానంలో అక్బోరు కుమారుడైన బాఅల్-హానాను రాజయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సంప్రదాయ అనువాదాల్లో ఈ పేర్లకు భిన్నమైన వర్ణరూపాలు కనిపిస్తాయి. ఇక్కడ వ్యక్తుల పేర్లు హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘షావూలు,’ ‘బాఅల్-హానాను,’ ‘అక్బోరు’ అని లిప్యంతరీకరించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מוּת ధాతువు యొక్క సాధారణ కథన రూపం; ఎటువంటి మృదూకరణ లేకుండా హీబ్రూ వాక్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁאוּל
  choice: షావూలు
  rationale: హీబ్రూ పేరులోని శబ్దరూపాన్ని దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజవంశ వారసత్వ సందర్భంలో ఈ క్రియ రాజ్యాధికారాన్ని స్వీకరించడాన్ని సూచిస్తుంది; ‘రాజయ్యాడు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: మునుపటి రాజుకు బదులుగా అధికారంలోకి వచ్చిన వారసత్వ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: בַּעַל חָנָן
  choice: బయల్-హానాను
  rationale: సంయుక్త వ్యక్తినామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది; విభాగాలను చూపేందుకు సంధిచిహ్నం ఉంచబడింది.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: ఈ వంశావళి సందర్భంలో ప్రత్యక్ష పుత్రసంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: עַכְבּוֹר
  choice: అక్బోరు
  rationale: వ్యక్తినామాన్ని అనువదించకుండా, సులభంగా చదవగల హీబ్రూ-ఆధారిత తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
