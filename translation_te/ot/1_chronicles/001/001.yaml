lexical_decisions:
- source_word: אָדָם
  choice: ఆదాము
  rationale: వంశావళి సందర్భంలో ఇది మానవజాతిని సూచించే సాధారణ నామవాచకం కాకుండా వ్యక్తి పేరు. తెలుగులో స్థిరపడిన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: שֵׁת
  choice: షేతు
  rationale: వంశావళిలోని వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో సహజమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱנוֹשׁ
  choice: ఎనోషు
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: אָדָם పదానికి సందర్భానుసారమైన అర్థం
  choice: వ్యక్తి పేరుగా ‘ఆదాము’
  alternative: ‘మనిషి’ లేదా ‘మానవజాతి’
  rationale: ఈ వచనం పేర్లతో కూడిన వంశావళిని ప్రారంభిస్తోంది; షేతు, ఎనోషు అనే వ్యక్తుల పేర్ల సరసన ఉన్నందున אָדָם కూడా ఇక్కడ వ్యక్తి పేరే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంక్షిప్త వంశావళి శైలిని యథాతథంగా ఉంచాం. హీబ్రూ మూలంలోని మూడు పేర్ల మధ్య అదనపు సంధాన పదాలు లేదా సంబంధ వివరణలు చేర్చలేదు.
