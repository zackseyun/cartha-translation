  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: te
  text: యెతూరు, నాఫీషు, మరియు కేదెమా[a]. వీరు ఇష్మాయేలు కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కేదెమా’ అనే పేరును రోమన్ లిపిలో Qedemah అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְטוּר
  choice: యెతూరు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
- source_word: נָפִישׁ
  choice: నాఫీషు
  rationale: హీబ్రూ వ్యక్తి పేరును దాని దీర్ఘ అచ్చులు, చివరి శ్ ధ్వని గుర్తుండేలా తెలుగు బైబిలు పేర్ల శైలిలో లిప్యంతరీకరించాం.
- source_word: וָ/קֵדְמָה
  choice: కేదెమా
  rationale: వావ్ సంధానార్థం ముందున్న పేర్లను కామాతో కలిపిన జాబితా నిర్మాణంలో వ్యక్తమవుతుంది; కֵדְמָה అనే పేరును తెలుగులో సులభంగా చదివేలా ‘కేదెమా’గా ఇచ్చాం.
- source_word: אֵלֶּה הֵם
  choice: వీరు
  rationale: గుర్తింపును తెలిపే హీబ్రూ నామవాచక వాక్యాన్ని తెలుగులో సహజమైన ‘వీరు’తో అందించాం; మూలంలో స్పష్టమైన కాలసూచక క్రియ లేనందున ‘ఉన్నారు/ఉండేవారు’ వంటి కాలనిర్ణయాన్ని చేర్చలేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఈ వంశావళిలో ఇష్మాయేలు మగ సంతానాన్ని పేరుపేరునా పేర్కొంటున్నందున అక్షరార్థమైన ‘కుమారులు’ సరైనది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. హీబ్రూ నామవాచక వాక్యంలో కాలం స్పష్టంగా లేకపోవడాన్ని తెలుగు క్రియారహిత వాక్యంతో నిలుపుకున్నాం.
