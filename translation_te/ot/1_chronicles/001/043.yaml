id: 1CH.1.43
reference: 1 Chronicles 1:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: te
  text: 'ఇశ్రాయేలీయులపై ఒక రాజు పరిపాలించకముందు[a] ఎదోము దేశంలో పరిపాలించిన రాజులు వీరే: బెయోరు కుమారుడైన బెలా; అతని పట్టణం పేరు దిన్హాబా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులపై ఏ రాజూ పరిపాలించకముందు.” హీబ్రూ అక్షరార్థంగా, “ఇశ్రాయేలీయుల కొరకు/పై ఒక రాజు పరిపాలించడానికి ముందు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הַמְּלָכִים
  choice: రాజులు వీరే
  rationale: וְ పరిసర జాబితాతో అనుసంధానిస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా, పరిచయ సూత్రాన్ని ‘వీరే’తో వ్యక్తం చేశాం.
- source_word: אֲשֶׁר מָלְכוּ
  choice: పరిపాలించిన
  rationale: מלך క్రియ ఇక్కడ రాజుగా పాలించడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పరిపాలించిన’ సహజమూ గౌరవప్రదమూ.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ఎదోము దేశంలో
  rationale: హీబ్రూలో ఉన్న ‘దేశం’ అనే నామవాచకాన్ని నిలిపి ఉంచుతూ స్థలార్థాన్ని సహజంగా తెలిపింది.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: ఒక రాజు పరిపాలించకముందు
  rationale: ఇన్ఫినిటివ్‌తో కూడిన ఏకవచన ‘రాజు’ను దగ్గరగా అనుసరించింది; హీబ్రూ నిర్దిష్ట రాజునా లేక రాజ్యవ్యవస్థ ఆరంభాన్నా సూచిస్తుందనే స్వల్ప సందిగ్ధతను బలవంతంగా పరిష్కరించలేదు.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల మీద
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే ప్రజాసమూహాన్ని సూచించే సహజ తెలుగు రూపం; పరిపాలన సంబంధాన్ని ‘మీద’ స్పష్టం చేస్తుంది.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: బెయోరు కుమారుడైన బెల
  rationale: వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, వంశసంబంధాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: అతని పట్టణం పేరు దిన్హాబా
  rationale: హీబ్రూ నామవాక్యాన్ని సంక్షిప్తమైన, సహజ తెలుగు నిర్మాణంలో అందించింది.
theological_decisions:
- issue: ఇశ్రాయేలు మీద రాజు పరిపాలించడానికి ముందు అనే కాలసూచన
  choice: ఒక రాజు పరిపాలించకముందు
  alternative: ఏ రాజూ పరిపాలించకముందు
  rationale: హీబ్రూ מֶלֶךְ ఏకవచన అనిర్దిష్ట రూపానికి ‘ఒక రాజు’ మరింత సమీపం; ‘ఏ రాజూ’ అనేది సందర్భార్థంగా సాధ్యమైనా మూలంలో లేని సమగ్ర నిషేధ భావాన్ని కొంత బలపరుస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి/రాజుల జాబితాకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. వ్యక్తి, స్థలనామాలు హీబ్రూ ఆధారంగా లిప్యంతరీకరించబడ్డాయి; నిజమైన భాషా సందిగ్ధత పాదటిప్పణిలో నిలుపబడింది.
