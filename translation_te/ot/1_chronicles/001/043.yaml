- from: ఇశ్రాయేలీయుల మీద ఒక రాజు పరిపాలించకముందు ఎదోము దేశంలో పరిపాలించిన రాజులు వీరే:[a] బెయోరు కుమారుడైన బెల; అతని పట్టణం పేరు దిన్హాబా.
  to: 'ఇశ్రాయేలీయులపై ఒక రాజు పరిపాలించకముందు[a] ఎదోము దేశంలో పరిపాలించిన రాజులు వీరే: బెయోరు కుమారుడైన బెలా; అతని పట్టణం పేరు దిన్హాబా.'
