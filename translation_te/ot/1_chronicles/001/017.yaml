base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: te
  text: 'షేము కుమారులు: ఏలాము, అష్షూరు, అర్పక్షదు, లూదు, అరాము; ఊజు, హూలు, గెతెరు, మెషెకు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సమాంతర వంశావళిలో ఆదికాండం 10:23 “మెషెకు”కు బదులుగా “మాషు” అని చదువుతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בן పదం యొక్క బహువచన construct రూపం వంశావళి జాబితాను పరిచయం చేస్తోంది. ‘కుమారులు’ మూలానికి నేరుగా సరిపోతుంది; విస్తృతార్థమైన ‘సంతానం’ ఇక్కడ అవసరం లేదు.
- source_word: שֵׁם
  choice: షేము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: వంశావళిలోని వ్యక్తినామంగా హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: אַשּׁוּר
  choice: అష్షూరు
  rationale: ఇక్కడ దేశనామంగా కాక షేము కుమారుని పేరుగా ఉన్నందున వ్యక్తినామ రూపాన్ని ఉంచాం.
- source_word: אַרְפַּכְשַׁד
  choice: అర్పక్షదు
  rationale: హీబ్రూ పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా నేరుగా లిప్యంతరీకరించాం.
- source_word: לוּד
  choice: లూదు
  rationale: మూలంలో ఏకవచన వ్యక్తినామమే ఉంది; బహువచన జాతినామ రూపాన్ని ఉపయోగించలేదు.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి ప్రాంతనామాన్ని పెట్టకుండా, వంశావళిలోని వ్యక్తినామాన్ని ఉంచాం.
- source_word: עוּץ
  choice: ఊజు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో చదవదగిన లిప్యంతరీకరణ.
- source_word: חוּל
  choice: హూలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: גֶתֶר
  choice: గెతెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా లిప్యంతరీకరించాం.
- source_word: מֶשֶׁךְ
  choice: మెషెకు
  rationale: WLCలోని మసొరా పాఠాన్ని ప్రధాన పాఠ్యంలో అనువదించాం; సమాంతర వంశావళిలోని భిన్న రూపాన్ని పాదసూచికలో తెలిపాం.
