translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని అనుసరించాం. హీబ్రూ జాబితాలో అరాము తరువాత కనిపించే అంతర్గత విభాగాన్ని బలవంతంగా వివరించకుండా అర్ధవిరామంతో సూచించాం; అన్ని పేర్లను వ్యక్తినామాలుగానే ఉంచాం.
