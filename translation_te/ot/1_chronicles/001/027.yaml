translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా మరియు గౌరవప్రదంగా ఉండే భాష వాడబడింది.
