  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: te
  text: 'లోతాను కుమారులు: హోరీ, హోమాము[a]; లోతాను సోదరి తిమ్నా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండం 36:22లోని సమాంతర వంశావళిలో ఈ పేరు హేమాము అని కనిపిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי לוֹטָן
  choice: లోటాను కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణాన్ని సహజమైన తెలుగులో ‘కుమారులు’ అని అనువదించాం. ఆరంభ సంధికారకమైన וּను ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోయినా వాక్యసంబంధం నిలుస్తుంది.
- source_word: חֹרִי
  choice: హోరీ
  rationale: ఇది వంశావళిలోని వ్యక్తి పేరు; జాతి సూచక పదంగా అనువదించకుండా పేరుగా లిప్యంతరీకరించాం.
- source_word: וְהוֹמָם
  choice: హోమాము
  rationale: దినవృత్తాంతముల హీబ్రూ పాఠంలోని הוֹמָם రూపాన్ని అనుసరించి వ్యక్తి పేరుగా లిప్యంతరీకరించాం; ఆదికాండంలోని సమాంతర వంశావళిలోని భిన్న రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַאֲחוֹת לוֹטָן
  choice: లోటాను సహోదరి
  rationale: אֲחוֹתకు ‘సహోదరి’ అనే గౌరవప్రదమైన, స్పష్టమైన ఆధునిక తెలుగు పదాన్ని వాడాం. హీబ్రూ నామవాచక వాక్యంలో వర్తమానకాల సంబంధక్రియ లేకపోవడాన్ని తెలుగులోనూ సహజంగా నిలిపాం.
- source_word: תִּמְנָע
  choice: తిమ్నా
  rationale: ఈ వచనంలోని హీబ్రూ వ్యక్తి పేరును దాని రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. వ్యక్తి పేర్లను మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
