  register: ఆదికాండ వంశావళులతో పరిచయం ఉన్న తెలుగు పాఠకులకు గుర్తుపట్టగలిగేలా, అదే సమయంలో హీబ్రూ రూపాలకు దగ్గరగా ఉండే ఆధునిక ప్రామాణిక తెలుగు నామరూపాలు వాడబడ్డాయి. మూలంలోని సంక్షిప్త నామావళి శైలి యథాతథంగా నిలుపబడింది.
