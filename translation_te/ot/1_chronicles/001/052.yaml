  terminology: ‘నాయకుడు’ అనేది ఎదోము వంశ/గోత్ర నాయకునికి తటస్థమైన, సహజమైన పదం. పాదటిప్పణిలో ‘గోత్ర నాయకుడు’ సరైన ప్రత్యామ్నాయం. అయితే ‘ప్రభువు వంటి పదాలు’ అనేది ఆంగ్లంలోని సంప్రదాయ ‘duke’ అనువాదాన్ని అస్పష్టంగా, కొంత భిన్నార్థంగా చూపుతుంది; దానిని స్పష్టంగా పేర్కొనాలి.
