lexical_decisions:
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఎదోమీయుల జాబితాలో ఈ పదం ఒక గోత్రం లేదా వంశానికి అధిపతిగా ఉన్న వ్యక్తిని సూచిస్తుంది. ‘నాయకుడు’ సంక్షిప్తంగా, సహజంగా ఉండి, ప్రతి పేరుతో పునరావృతమయ్యే బిరుదుకు సరిపోతుంది; ‘గోత్ర నాయకుడు’ అనే మరింత నిర్దిష్ట భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אָהֳלִיבָמָה
  choice: ఒహొలీబామా
  rationale: హీబ్రూ ఉచ్చారణను ఆధారంగా చేసుకొని వ్యక్తి/వంశనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֵלָה
  choice: ఏలా
  rationale: హీబ్రూ పేరును దాని దీర్ఘ మొదటి అచ్చుకు అనుగుణంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: פִּינֹן
  choice: పీనోను
  rationale: హీబ్రూ వ్యక్తి/వంశనామాన్ని అనువదించకుండా, తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించాం.
