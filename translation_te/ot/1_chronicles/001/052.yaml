  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని పాటించాం. హీబ్రూలో బిరుదు పేరుకు ముందు ఉన్నప్పటికీ, సహజమైన తెలుగు పదక్రమం కోసం ప్రతి పేరుకు తరువాత ‘నాయకుడు’ ఉంచాం.
