  text: యెబూసీయులను[a], అమోరీయులను, మరియు గిర్గాషీయులను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హీబ్రూలోని జాతినామాలు ఏకవచన రూపంలో ఉన్నా, అవి సమష్టిగా యెబూసీయులు, అమోరీయులు, గిర్గాషీయులు అనే ప్రజలను సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: యెబూసీయులను
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా ఏకవచన జాతినామమైనా, ఈ వంశావళి జాబితాలో ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. ముందు వచనంలో ప్రారంభమైన క్రియకు ఇది కర్మ కావడంతో తెలుగులో ‘-లను’ విభక్తి వాడబడింది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: చుట్టుపక్కల జాతినామాల మాదిరిగానే, ఏకవచన హీబ్రూ రూపం ఇక్కడ అమోరీయుల ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగు జాబితా శైలిలో బహువచన రూపం సహజంగా ఉంటుంది.
- source_word: הַגִּרְגָּשִׁי
  choice: గిర్గాషీయులను
  rationale: హీబ్రూ జాతినామం సమష్టిగా ఒక ప్రజను సూచిస్తుంది. వంశావళి జాబితాలోని ఇతర జాతినామాలకు అనుగుణంగా బహువచన కర్మరూపం ఎంచుకోబడింది.
- source_word: וְאֶת / וְאֵת
  choice: జాబితా విరామచిహ్నాలు మరియు ‘-లను’ కర్మవిభక్తి
  rationale: אֵת అనే ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ‘-లను’ విభక్తి సరిపోతుంది. ప్రతి అంశానికి ముందు ఉన్న וְ ను పదేపదే ‘మరియు’ అని అనువదించడం తెలుగులో అసహజంగా ఉండేందున సమన్వయాన్ని కామాలతో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ఈ వచనం ముందటి వాక్యంలో ప్రారంభమైన జాబితాను కొనసాగిస్తున్నందున కొత్త క్రియను చేర్చలేదు.
