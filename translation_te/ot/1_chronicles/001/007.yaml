  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: te
  text: 'యావాను కుమారులు: ఎలీషా, తర్షీషు, కిత్తీయులు, రోదానీయులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండము 10:4లో “రోదానీయులు”కు బదులుగా “దోదానీయులు” అని ఉంది; ఇది ఆ పేరులోని పాఠభేదాన్ని ప్రతిబింబిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మిత బహువచనం. వంశావళి శైలిని నిలుపుతూ సహజమైన తెలుగులో ‘కుమారులు’ అని అనువదించాం; వంశస్థులు అనే విస్తృత భావం సందర్భంలో అంతర్లీనంగా ఉండవచ్చు.
- source_word: יָוָן
  choice: యావాను
  rationale: వ్యక్తి/వంశనామంగా ఉన్నందున ‘గ్రీసు’ అని భావానువాదం చేయకుండా హీబ్రూ పేరును తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చాం.
- source_word: אֱלִישָׁה
  choice: ఎలీషా
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సహజంగా ధ్వన్యంతరీకరించాం.
- source_word: תַּרְשִׁישָׁה
  choice: తర్షీషు
  rationale: ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా ధ్వన్యంతరీకరించాం; చివరి ה ఇక్కడ ప్రత్యేక దిశార్థక ప్రత్యయంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: כִּתִּים
  choice: కిత్తీయులు
  rationale: ఈ బహువచన జాతి/వంశనామాన్ని తెలుగు పాఠకులకు సహజమైన సమూహనామ రూపంలో ఇచ్చాం.
- source_word: וְרוֹדָנִים
  choice: రోదానీయులు
  rationale: దినవృత్తాంతముల మసొరెటిక్ పాఠంలోని ర (ר) అక్షరాన్ని అనుసరించి ‘రోదానీయులు’ అని ఇచ్చాం; ఆదికాండము 10:4లోని దోదానీయులు అనే భేదాన్ని పాదసూచికలో భద్రపరిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. పేర్లను అనువదించకుండా తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చాం; బహువచన జాతి/వంశనామాలకు సహజమైన ‘-యులు’ రూపాన్ని ఉపయోగించాం.
