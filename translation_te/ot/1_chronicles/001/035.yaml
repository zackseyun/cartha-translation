source:
  edition: WLC
  text: בְּנֵ֖י עֵשָׂ֑ו אֱלִיפַ֛ז רְעוּאֵ֥ל וִ/יע֖וּשׁ וְ/יַעְלָ֥ם וְ/קֹֽרַח׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: te
  text: 'ఏశావు కుమారులు: ఎలీఫజు, రెయూయేలు[a], యెయూషు, యాలాము, కోరహు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని తెలుగు అనువాద సంప్రదాయాల్లో ఈ పేరు ‘రగూయేలు’ అని కూడా ఉంటుంది. అది వేరే వ్యక్తిని సూచించదు; హీబ్రూ పేరును గ్రీకు/లాటిన్ మార్గంలో లిప్యంతరీకరించడం వల్ల ఏర్పడిన రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి నిర్మాణ బహువచన రూపం; ఇక్కడ వంశావళిలో ఏశావుకు నేరుగా పుట్టిన కుమారుల జాబితాను పరిచయం చేస్తోంది.
- source_word: עֵשָׂו
  choice: ఏశావు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֱלִיפַז
  choice: ఎలీఫజు
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా, తెలుగులో సహజంగా ఉండే లిప్యంతరీకరణ.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: హీబ్రూ రూపం Reʿu’el లోని స్వరాలు, గొంతు విరామాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: וִיעוּשׁ
  choice: యెయూషు
  rationale: ముందున్న సంధికారకాన్ని జాబితా నిర్మాణంలో తెలుగులో విడిగా పునరావృతం చేయకుండా, హీబ్రూ Yeʿush పేరును లిప్యంతరీకరించాం.
- source_word: וְיַעְלָם
  choice: యాలాము
  rationale: హీబ్రూ Yaʿlam పేరును తెలుగు ఉచ్చారణకు అనువుగా లిప్యంతరీకరించాం.
- source_word: וְקֹרַח
  choice: కోరహు
  rationale: చివరి పేరుతో ఉన్న וְ భావాన్ని తెలుగు జాబితా విరామచిహ్నాల ద్వారా తెలియజేసి, קֹרַח పేరును కోరహు అని లిప్యంతరీకరించాం.
theological_decisions: []
