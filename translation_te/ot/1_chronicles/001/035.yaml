  register: సంక్షిప్తమైన వంశావళి శైలిని అలాగే ఉంచి, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన జాబితా నిర్మాణాన్ని వాడాం. వ్యక్తినామాలను మూల హీబ్రూకు దగ్గరగా, తెలుగు పాఠకుడు సులభంగా చదవగల రూపాల్లో ఇచ్చాం.
