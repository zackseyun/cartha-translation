  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: te
  text: 'అబ్రాహాము ఉపపత్నియైన కెతూరా[a] కుమారులు: ఆమె జిమ్రాను, యొక్షాను, మెదాను, మిద్యాను, ఇష్బాకు, షూహలను కన్నది. యొక్షాను కుమారులు: షెబా, దెదాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండము 25:1 కెతూరాను అబ్రాహాము భార్యగా పేర్కొంటుంది; ఇక్కడ దినవృత్తాంతకర్త ఆమెను ప్రత్యేకంగా అతని ఉపపత్నిగా పేర్కొంటున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనే నిర్మాణ బహువచనం ‘కుమారులు’ అని అర్థం. తెలుగు వంశావళి శైలిలో జాబితా క్రమాన్ని విరామచిహ్నాలతో సహజంగా తెలియజేయవచ్చు కాబట్టి ఆరంభ וּ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: קְטוּרָה
  choice: కెతూరా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా, తెలుగులో సులభంగా పలికే లిప్యంతరీకరణ.
- source_word: פִּילֶגֶשׁ
  choice: ఉపపత్ని
  rationale: ప్రధాన భార్యకన్నా తక్కువ సామాజిక లేదా చట్టపరమైన హోదాలో గుర్తింపు పొందిన స్త్రీని సూచించే హీబ్రూ పదానికి సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం; ‘అబ్రాహాము ఉపపత్ని’ అనే సంబంధ నిర్మాణంలో సహజంగా ఉంది.
- source_word: יָלְדָה
  choice: ఆమె ... కన్నది
  rationale: స్త్రీలింగ ఏకవచన క్రియకు కెతూరాయే కర్త అని స్పష్టంచేస్తూ, వంశావళి సందర్భానికి సహజమైన తెలుగు క్రియను ఉపయోగించింది.
- source_word: זִמְרָן
  choice: జిమ్రాను
  rationale: హీబ్రూ ధ్వనులకు దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: יָקְשָׁן
  choice: యొక్షాను
  rationale: హీబ్రూ పేరు ధ్వనిని ప్రతిబింబిస్తూ తెలుగు బైబిలు నామశైలికి అనుగుణమైన రూపం.
- source_word: מְדָן
  choice: మెదాను
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు పాఠకులకు పలకడానికి అనుకూలంగా లిప్యంతరీకరించింది.
- source_word: יִשְׁבָּק
  choice: ఇష్బాకు
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: שׁוּחַ
  choice: షూహ
  rationale: చివరి గొంతు ధ్వనిని తెలుగులో అతిగా కృత్రిమం చేయకుండా హీబ్రూ పేరుకు దగ్గరగా ఇచ్చిన రూపం.
- source_word: שְׁבָא וּדְדָן
  choice: షెబ, దెదాను
  rationale: రెండు వ్యక్తినామాలను హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించి, జాబితాలో సహజమైన తెలుగు విరామచిహ్నం వాడింది.
theological_decisions:
- issue: అబ్రాహాముతో కెతూరాకు ఉన్న హోదాను సూచించే పదం
  choice: ఉపపత్ని
  alternative: భార్య; రెండవ భార్య
  rationale: ఈ వచనం స్పష్టంగా פִּילֶגֶשׁ అనే పదాన్ని ఉపయోగిస్తుంది. ఆదికాండము 25:1లోని ‘భార్య’ అనే వర్ణనతో మౌనంగా సమన్వయపరచకుండా, దినవృత్తాంతకర్త వాడిన ప్రత్యేక హోదా పదాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని నిలిపి, స్త్రీలింగ క్రియ కర్తను ‘ఆమె’తో స్పష్టం చేసింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
