lexical_decisions:
- source_word: אַלּוּף
  choice: నాయకుడు
  rationale: ఎదోమీయుల జాబితాల్లో ఈ పదం గోత్రం లేదా వంశానికి నాయకత్వం వహించే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నాయకుడు’ సహజంగా, సంక్షిప్తంగా ఉండి మూలంలోని పదపునరుక్తిని నిలుపుతుంది.
- source_word: קְנַז
  choice: కెనజు
  rationale: ఇది వ్యక్తి లేదా వంశం పేరు; మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: תֵּימָן
  choice: తేమాను
  rationale: ఈ ఎదోమీయ నాయకుల జాబితాలో ఇది పేరుగా పనిచేస్తుంది; ప్రాంతం లేదా వంశంతో సంబంధం ఉండగలిగినా, ఇక్కడ పేరుగానే లిప్యంతరీకరించబడింది.
- source_word: מִבְצָר
  choice: మిబ్సారు
  rationale: ఇది వ్యక్తి లేదా వంశం పేరు; దాని సాధారణ నిఘంటు అర్థాన్ని అనువదించకుండా పేరుగా లిప్యంతరీకరించబడింది.
