  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-రాజవంశ జాబితికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హెబ్రీ వాక్యంలోని వరుస సంఘటనలు రెండు చిన్న వాక్యాలుగా సహజీకరించబడ్డాయి; ప్రాంతనామం/జాతివాచకంలోని అస్పష్టత పాదసూచికలో నిలుపబడింది.
