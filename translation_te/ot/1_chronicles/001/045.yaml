  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: te
  text: యోబాబు[a] మరణించాడు. అతని స్థానంలో తేమానీయుల దేశానికి చెందిన[b] హూషాము రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ రూపం ‘యోబాబు’; సంప్రదాయ ఇంగ్లీషు రూపం ‘Jobab.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తేమాను దేశానికి చెందిన’; లేదా ‘తేమానీయుని దేశానికి చెందిన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది. తెలుగులో కర్తను పేరుతో స్పష్టంగా ఉంచి సహజంగా అనువదించబడింది.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: హెబ్రీ వ్యక్తిపేరుకు దగ్గరగా ఉండి, తెలుగు బైబిల్ వాడుకలో సహజంగా గుర్తుపట్టగల లిప్యంతరీకరణ.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: מלך అనే క్రియ రాజుల వారసత్వ జాబితాలో రాజ్యాధికారాన్ని చేపట్టి పాలించడాన్ని సూచిస్తుంది; ‘రాజ్యమేలాడు’ ఆ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ఈ సందర్భంలో תחת ప్రత్యక్ష వారసత్వం లేదా భర్తీని సూచిస్తుంది. ‘అతని స్థానంలో’ అనేది సహజమైన తెలుగు రూపం.
- source_word: חוּשָׁם
  choice: హూషాము
  rationale: హెబ్రీ వ్యక్తిపేరు חוּשָׁם యొక్క తెలుగు లిప్యంతరీకరణ.
- source_word: מֵאֶרֶץ
  choice: దేశం నుండి వచ్చిన
  rationale: מן మరియు אֶרֶץ కలయిక భౌగోళిక మూలాన్ని సూచిస్తుంది. తెలుగులో ‘దేశం నుండి వచ్చిన’ అనడం హూషాము ఎక్కడివాడో సహజంగా తెలియజేస్తుంది.
- source_word: הַתֵּימָנִי
  choice: తేమానీయుల
  rationale: ఈ రూపం తేమానుకు చెందిన వ్యక్తిని లేదా ప్రజావర్గాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ‘తేమానీయుల దేశం’ అని చదవడానికి సహజమైన సామూహిక భావం తీసుకోబడింది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
