lexical_decisions:
- source_word: אַלּוּף
  choice: అధిపతి
  rationale: ఎదోమీయుల వంశావళి, రాజకీయ జాబితాల్లో ఈ పదం గోత్రం లేదా వంశానికి నాయకుడిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అధిపతి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి జాబితా శైలికి సరిపోతుంది.
- source_word: מַגְדִּיאֵל
  choice: మగ్దీయేలు
  rationale: వ్యక్తినామాన్ని దాని సాధ్యమైన అర్థంతో అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עִירָם
  choice: ఈరాము
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: హీబ్రూలో క్రియలేని ఈ సారాంశ వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ముందున్న వ్యక్తులనే సూచించేలా ‘వీరు’ అని అనువదించాం.
- source_word: אַלּוּפֵי אֱדֹם
  choice: ఎదోము అధిపతులు
  rationale: ముందు పేర్కొన్నవారిని ఎదోమీయుల గోత్ర లేదా వంశ నాయకులుగా సంక్షిప్తంగా సమీక్షించే నిర్మాణం; పదసామ్యాన్ని నిలుపుకోవడానికి ‘అధిపతులు’ వాడాం.
