- source_word: נֹחַ
  choice: నోవహు
  rationale: వంశావళిలోని వ్యక్తి పేరు; తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన రూపాన్ని ఉంచాం.
- source_word: שֵׁם
  choice: షేము
  rationale: వ్యక్తి పేరు; ‘పేరు’ అనే పదార్థాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరైన సుపరిచిత తెలుగు రూపాన్ని వాడాం.
- source_word: חָם
  choice: హాము
  rationale: వంశావళిలోని వ్యక్తి పేరు; తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- source_word: וָ/יָפֶת
  choice: యాఫెతు
  rationale: ו అనే సంధికారకాన్ని జాబితా చివర తెలుగు సహజ శైలిలో కామాతో సూచించాం; יפת అనే వ్యక్తి పేరుకు సుపరిచిత తెలుగు రూపాన్ని వాడాం.
