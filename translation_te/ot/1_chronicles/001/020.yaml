  text: యొక్తాను అల్మోదాదు, షెలెపు, హత్సర్మావెతు, యెరహు అనే వారికి తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָקְטָן
  choice: యొక్తాను
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో పురుషుడు సంతానానికి తండ్రి అయ్యాడనే భావాన్ని తెలిపే సంక్షిప్తమైన, సాధారణ తెలుగు ప్రయోగం; ఇది నేరుగా ప్రసవించాడనే అర్థంలో కాదు.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది హెబ్రీ ప్రత్యక్ష కర్మ సూచకం; తెలుగు వాక్య నిర్మాణంలో కర్మవిభక్తి ద్వారా వ్యక్తమైంది.
- source_word: אַלְמוֹדָד
  choice: అల్మోదాదు
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שָׁלֶף
  choice: షెలెపు
  rationale: వ్యక్తి పేరును మసొరేటిక్ స్వరరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֲצַרְמָוֶת
  choice: హసర్మావెతు
  rationale: వ్యక్తి పేరును హెబ్రీ హల్లులూ స్వరాలకూ దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יָרַח
  choice: యెరహు
  rationale: వ్యక్తి పేరును హెబ్రీ ప్రారంభ యోద్ ధ్వనిని నిలుపుతూ లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలి. పేర్లు ఆంగ్ల సంప్రదాయ రూపాల నుంచి కాకుండా హెబ్రీ మూలరూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; జాబితాలో తెలుగు కర్మవిభక్తి ఉపయోగించబడింది.
