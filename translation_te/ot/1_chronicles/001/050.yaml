  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని వాడాం. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం. మూలంలోని పునరుక్త వంశావళి నిర్మాణాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపాం.
