source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ בַּ֣עַל חָנָ֔ן וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ד וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עִי וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: te
  text: బయలు-హానన్ చనిపోయాడు. అతని స్థానంలో హదద్ రాజయ్యాడు. అతని పట్టణం పేరు పాయి[a]. అతని భార్య పేరు మెహేతబేల్; ఆమె మత్రేద్ కుమార్తె[b], మేజాహాబ్ కుమార్తె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండం 36:39లో ఈ పట్టణం పేరు ‘పావు’ అని ఉంది; దినవృత్తాంతముల గ్రంథంలోని హీబ్రూ పాఠంలో ‘పాయి’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: వంశావళి వాడుకలో రెండోసారి వచ్చే ‘కుమార్తె’ అనే మాట ‘మనవరాలు’ అనే భావాన్ని సూచించవచ్చు. అయితే హీబ్రూలో ఉన్న ‘కుమార్తె … కుమార్తె’ అనే రూపాన్నే ఇక్కడ మరింత యథాతథంగా ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: బయల్హానాను చనిపోయాడు
  rationale: מות అనే క్రియను సహజమైన ఆధునిక తెలుగులో ‘చనిపోయాడు’గా అనువదించాం; కర్తగా వచ్చే వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో ... రాజయ్యాడు
  rationale: ఇది రాజుల వారసత్వ క్రమాన్ని తెలిపే సూత్రవాక్యం. ‘రాజయ్యాడు’ అనేది హదదు రాజ్యాధికారం చేపట్టాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; תחתיו లోని స్థానభర్తీ భావాన్ని ‘అతని స్థానంలో’ నిలుపుతుంది.
- source_word: הֲדַד
  choice: హదదు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి అనుగుణంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: అతని పట్టణం పేరు పాయి
  rationale: హీబ్రూ నామవాచక వాక్యానికి తెలుగులో అవసరమైన ‘పేరు’ నిర్మాణాన్ని వాడాం. దినవృత్తాంతముల గ్రంథంలోని పాఠరూపం פָּעִי ను ‘పాయి’గా నిలిపాం.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: అతని భార్య పేరు మెహేతబేలు
  rationale: హీబ్రూ పేరుపెట్టే సూత్రాన్ని సహజమైన తెలుగు వాక్యంగా ఇచ్చి, వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: ఆమె మత్రేదు కుమార్తె, మేజాహాబు కుమార్తె
  rationale: రెండుసార్లు వచ్చే בַּת (‘కుమార్తె’)ను అనువాదంలో రెండుసార్లూ నిలిపి, వంశసంబంధాన్ని ‘మనవరాలు’గా నిర్ణయించి చెప్పకుండా మూలంలోని నిర్మాణాత్మక సందిగ్ధతను కాపాడాం.
- source_word: מֵי זָהָב
  choice: మేజాహాబు
  rationale: వంశావళి సందర్భంలో దీనిని అర్థానువాదం చేయకుండా వ్యక్తి పేరుగా లిప్యంతరీకరించాం.
