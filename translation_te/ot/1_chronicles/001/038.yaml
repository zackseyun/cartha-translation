id: 1CH.1.38
reference: 1 Chronicles 1:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י שֵׂעִ֔יר לוֹטָ֥ן וְ/שׁוֹבָ֖ל וְ/צִבְע֣וֹן וַֽ/עֲנָ֑ה וְ/דִישֹׁ֥ן וְ/אֵ֖צֶר וְ/דִישָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/038.yaml
  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: te
  text: 'సేయీరు కుమారులు[a]: లోతాను, షోబాలు, సిబ్యోను, అనా, దీషోను, ఏసెరు, దీషాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళులలో “కుమారులు” అనే మాట ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా, విస్తృతంగా సంతతివారిని లేదా వంశ సభ్యులను కూడా సూచించవచ్చు. ఇక్కడ మూలంలోని వంశావళి పదప్రయోగం అలాగే ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాను పరిచయం చేసే בְּנֵי అనే నిర్మాణ బహువచనానికి సహజమైన తెలుగు రూపం. ముందున్న వచనంతో జాబితా కొనసాగింపును తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండానే సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: שֵׂעִיר
  choice: సేయీరు
  rationale: ఈ వంశావళి సందర్భంలో వ్యక్తినామం; హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: לוֹטָן
  choice: లోతాను
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שׁוֹבָל
  choice: షోబాలు
  rationale: వ్యక్తినామాన్ని హీబ్రూ ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: צִבְעוֹן
  choice: సిబ్యోను
  rationale: వ్యక్తినామాన్ని మూలంలోని ధ్వని భేదాలను సాధ్యమైనంతవరకు నిలుపుతూ తెలుగులో పఠనయోగ్యంగా ఇచ్చాం.
- source_word: עֲנָה
  choice: అనా
  rationale: వ్యక్తినామానికి సరళమైన తెలుగు లిప్యంతరీకరణ.
- source_word: דִישֹׁן
  choice: దీషోను
  rationale: వ్యక్తినామం; తరువాత వచ్చే דִישָׁן నుండి భేదాన్ని నిలుపడానికి ‘దీషోను’గా ఇచ్చాం.
- source_word: אֵצֶר
  choice: ఏసెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: דִישָׁן
  choice: దీషాను
  rationale: మూలంలో דִישֹׁן అనే ముందటి పేరుకు భిన్నమైన అచ్చుతో ఉన్న పేరును ‘దీషాను’గా ఇచ్చి ఆ భేదాన్ని నిలిపాం.
