translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. వ్యక్తినామాలు హీబ్రూ మూలధ్వనులకు సమీపంగా, తెలుగులో సులభంగా చదవగల రూపాల్లో ఇవ్వబడ్డాయి.
