source:
  edition: WLC
  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: te
  text: బెల చనిపోయాడు; అతని స్థానంలో బొస్రాకు చెందిన జెరహు కుమారుడు యోబాబు రాజుగా పరిపాలించడం ప్రారంభించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బొస్రా నుండి వచ్చిన.” హీబ్రూ ఉపసర్గ ఆ పట్టణం నుండి వచ్చినవాడని లేదా దానితో అనుబంధం ఉన్నవాడని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מוּת క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది. ఆధునిక తెలుగులో సహజమైన మరణ సూచనగా ‘చనిపోయాడు’ వాడబడింది.
- source_word: בָּלַע
  choice: బెల
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజవంశ వారసత్వ సందర్భంలో מלך క్రియ రాజ్యాధికారాన్ని చేపట్టడాన్ని సూచిస్తుంది; ‘రాజయ్యాడు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ప్రత్యయంతో కూడిన תחת ఇక్కడ ముందున్న రాజు స్థానాన్ని మరొకరు చేపట్టిన వారసత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בֶּן זֶרַח
  choice: జెరహు కుమారుడు
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని తెలుగులో సహజమైన ‘కుమారుడు’ రూపంతో అందించాం.
- source_word: מִבָּצְרָה
  choice: బొస్రాకు చెందిన
  rationale: מִן ఉపసర్గ ఇక్కడ పట్టణ మూలం లేదా అనుబంధాన్ని సూచించవచ్చు. ‘బొస్రాకు చెందిన’ అనే రూపం ఆ రెండింటినీ అతిగా నిర్ధారించకుండా సహజంగా ఉంచుతుంది.
