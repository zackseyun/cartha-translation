translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజవంశ వారసత్వ సూత్రాన్ని సంక్షిప్తంగా మరియు గౌరవప్రదంగా ఉంచాం. మూలంలోని వరుస ‘మరియు’ నిర్మాణాన్ని తెలుగులో సహజమైన అర్థవిరామంతో వ్యక్తపరిచాం.
