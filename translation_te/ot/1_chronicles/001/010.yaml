source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: te
  text: కూషు నిమ్రోదుకు తండ్రి అయ్యాడు; అతడు దేశంలో[a] శక్తిమంతుడిగా మారడం ప్రారంభించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీద.” హీబ్రూ אֶרֶץ అనే పదానికి “దేశం” లేదా “భూమి” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: కూషు
  rationale: వְ వంశావళిలోని వరుస సమాచారాన్ని అనుసంధానిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు. כּוּשׁ అనే పేరును ‘కూషు’గా లిప్యంతరీకరించాం.
- source_word: יָלַ֣ד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో ילד సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు.
- source_word: נִמְר֑וֹד
  choice: నిమ్రోదు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ה֣וּא
  choice: అతడు
  rationale: స్వతంత్ర సర్వనామం నిమ్రోదును మళ్లీ ప్రస్తావిస్తూ స్వల్ప ఉద్ఘాటన ఇస్తుంది; ‘అతడు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֵחֵ֔ל לִהְי֥וֹת
  choice: ఉండడం మొదలుపెట్టాడు
  rationale: הֵחֵל తో కూడిన היה క్రియారూపం ‘ఉండడం మొదలుపెట్టాడు’ అనే భావాన్ని ఇస్తుంది. ‘మొదటివాడయ్యాడు’ అని అనువదించడం మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చవచ్చు.
- source_word: גִּבּ֖וֹר
  choice: బలవంతుడిగా
  rationale: גִּבּוֹר బలశాలి, పరాక్రమవంతుడు లేదా యోధుడు అనే అర్థాలను ఇవ్వగలదు. ఈ వాక్యంలో యుద్ధ కార్యకలాపం స్పష్టంగా లేదు కాబట్టి, విస్తృత భావాన్ని కాపాడే ‘బలవంతుడు’ను ఎంచుకున్నాం.
- source_word: בָּאָֽרֶץ
  choice: దేశంలో
  rationale: אֶרֶץ ‘దేశం/ప్రాంతం’ లేదా ‘భూమి’ అని అర్థం కావచ్చు. ప్రధాన పాఠంలో పరిమిత అర్థమైన ‘దేశంలో’ను ఉంచి, విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: నిమ్రోదు బలవంతుడిగా మారిన పరిధిని సూచించే בָּאָרֶץ అర్థం
  choice: దేశంలో
  alternative: భూమిమీద
  rationale: אֶרֶץ అనే హీబ్రూ పదానికి స్థానికమైన ‘దేశం’ మరియు విశాలమైన ‘భూమి’ అనే రెండు అర్థాలూ సాధ్యమే. వాక్యం నిమ్రోదు ప్రాధాన్యాన్ని తప్పనిసరిగా విశ్వవ్యాప్తం చేయదు కాబట్టి ప్రధాన పాఠంలో ‘దేశంలో’ను వాడి, నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. పాతకాలపు ‘కనెను’ వంటి రూపాన్ని తప్పించి, సాధారణ పాఠకులకు సహజమైన ‘తండ్రి అయ్యాడు’ను ఎంచుకున్నాం. పాదసూచిక గుర్తును సందిగ్ధ పదమైన ‘దేశంలో’ తరువాత ఉంచాం.
