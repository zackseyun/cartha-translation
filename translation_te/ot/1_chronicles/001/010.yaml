revisions:
- from: కూషు నిమ్రోదుకు తండ్రి అయ్యాడు; అతడు దేశంలో[a] బలవంతుడిగా ఉండడం మొదలుపెట్టాడు.
  to: కూషు నిమ్రోదుకు తండ్రి అయ్యాడు; అతడు దేశంలో[a] శక్తిమంతుడిగా మారడం ప్రారంభించాడు.
  rationale: The revision improves idiomatic modern Telugu and broadens the rendering of גִּבּוֹר appropriately, while preserving the Hebrew's ingressive wording and the deliberate ambiguity of בָּאָרֶץ. The footnote remains anchored to the ambiguous term.
