source:
  edition: WLC
  text: בְּנֵ֖י רְעוּאֵ֑ל נַ֥חַת זֶ֖רַח שַׁמָּ֥ה וּ/מִזָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/037.yaml
  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: te
  text: 'రెయూయేలు కుమారులు: నహతు, జెరహు, షమ్మా, మిజ్జా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది వంశావళిలో తక్షణ సంతానాన్ని పరిచయం చేసే בֵּן పదపు బహువచన నిర్మాణరూపం; అందువల్ల ‘కుమారులు’ సహజమైన, సూటియైన అనువాదం.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: נַחַת
  choice: నహతు
  rationale: వ్యక్తినామం కావడంతో అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: זֶרַח
  choice: జెరహు
  rationale: ఈ రూపానికి పదార్థం ఉన్నప్పటికీ ఇక్కడ వ్యక్తినామం; కాబట్టి అర్థానువాదం కాకుండా లిప్యంతరీకరణను వాడాం.
- source_word: שַׁמָּה
  choice: షమ్మా
  rationale: హీబ్రూ వ్యక్తినామంలోని శ్ ధ్వనిని ‘ష’, ద్విత్వ మ్‌ను ‘మ్మ’తో సూచించి సహజమైన తెలుగు రూపాన్ని ఇచ్చాం.
- source_word: וּ/מִזָּה
  choice: మిజ్జా
  rationale: వావ్ సంధికార్థం జాబితా నిర్మాణంలో తెలుగులో విరామచిహ్నం మరియు చివరి అంశంతో సహజంగా వ్యక్తమవుతుంది; పేరులోని దాగేశ్‌ను ‘జ్జ’ ద్విత్వంతో సూచించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని నిలిపాం. వ్యక్తినామాలను హీబ్రూ మసొరెటిక్ రూపాలకు దగ్గరగా, అయితే తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించాం.
