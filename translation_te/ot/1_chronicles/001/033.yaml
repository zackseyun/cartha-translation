translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. వ్యక్తినామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
