  edition: WLC
  text: וּ/בְנֵ֣י מִדְיָ֗ן עֵיפָ֤ה וָ/עֵ֨פֶר֙ וַ/חֲנ֔וֹךְ וַ/אֲבִידָ֖ע וְ/אֶלְדָּעָ֑ה כָּל אֵ֖לֶּה בְּנֵ֥י קְטוּרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: te
  text: 'మిద్యాను కుమారులు: ఏఫా, ఏఫెరు, హనోకు[a], అబీదా, ఎల్దాయా. వీరందరూ కెతూరా కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: హనోకు; కొన్ని ఇంగ్లీషు బైబిలు అనువాదాల్లో సంప్రదాయంగా ‘ఏనోకు’ అని ఉంటుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: మిద్యాను కుమారులు
  rationale: వంశావళి జాబితాకు సహజమైన తెలుగు నిర్మాణాన్ని వాడుతూ, ఆరంభ సంధికారకాన్ని ప్రత్యేకంగా అనువదించలేదు.
- source_word: עֵיפָה
  choice: ఏఫా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: וָעֵפֶר
  choice: ఏఫెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది; జాబితాలోని సంధికారకం విరామచిహ్నాల ద్వారా వ్యక్తమైంది.
- source_word: וַחֲנוֹךְ
  choice: హనోకు
  rationale: חֲנוֹךְ అనే హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణను ఎంచుకుంది.
- source_word: וַאֲבִידָע
  choice: అబీదా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְאֶלְדָּעָה
  choice: ఎల్దాయా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; తెలుగు జాబితాలో చివరి పేరుకు ముందు తప్పనిసరిగా 'మరియు' చేర్చకుండా సహజ శైలిని పాటించింది.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: ముందు పేర్కొన్న వ్యక్తులందరినీ సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: בְּנֵי קְטוּרָה
  choice: కెతూరా కుమారులు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
