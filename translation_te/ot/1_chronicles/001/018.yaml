- source_word: שָׁלַח / שֶׁלַח
  choice: షేలహు
  rationale: మసొరా పాఠంలోని స్వల్ప స్వరభేదం ఉన్న రెండు రూపాలూ ఒకే వ్యక్తిని సూచిస్తాయి; అందువల్ల ఒకే విధంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: עֵבֶר
