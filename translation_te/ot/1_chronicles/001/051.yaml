source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: te
  text: 'హదదు చనిపోయాడు. ఎదోముకు చెందిన నాయకులు వీరు: తిమ్నా నాయకుడు, అలీయా నాయకుడు, యతేతు నాయకుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות క్రియ యొక్క కథన రూపం తదుపరి సంఘటనను తెలియజేస్తుంది. ఆధునిక తెలుగులో సహజమైన భూతకాల రూపాన్ని ఉపయోగించాం.
- source_word: הֲדָד
  choice: హదదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనిపద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּהְיוּ
  choice: వీరు
  rationale: తరువాత వచ్చే నాయకుల జాబితాను సహజమైన తెలుగులో పరిచయం చేస్తూ, వారు ఎదోము నాయకులుగా ఉన్నారనే భావాన్ని నిలిపాం.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: నాయకులు / నాయకుడు
  rationale: ఎదోమీయుల సందర్భంలో ఈ పదం వంశం లేదా గోత్రానికి అధిపతిని సూచిస్తుంది. పాతకాలపు లేదా రాజవంశ సంబంధమైన బిరుదును రుద్దకుండా, సామాన్య పాఠకులకు స్పష్టమైన ‘నాయకుడు’ను ఎంచుకున్నాం; జాబితా నిర్మాణాన్ని కాపాడటానికి ప్రతి పేరుకు ముందు ఉన్న బిరుదును తెలుగులో ప్రతి పేరు తరువాత పునరావృతం చేశాం.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: స్థలనామం/జననామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: תִּמְנָע
  choice: తిమ్నా
  rationale: హీబ్రూ రూపాన్ని దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: עליה
  choice: అల్యా
  rationale: దినవృత్తాంతముల గ్రంథంలోని హీబ్రూ పాఠరూపాన్ని ఆధారంగా తీసుకుని లిప్యంతరీకరించాం; ఆదికాండములోని సమాంతర జాబితాలో భిన్న రూపం ఉన్నందున దాన్ని పాదసూచికలో తెలిపాం.
- source_word: יְתֵת
  choice: యతేతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ఉచ్చారణకు అనుకూలమైన లిప్యంతరీకరణ.
