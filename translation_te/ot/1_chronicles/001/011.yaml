  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לודיים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: te
  text: మిస్రాయిము లూదీయులకు[a], అనామీయులకు, లెహాబీయులకు, నఫ్తూహీయులకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత ప్రత్యక్షంగా లిప్యంతరీకరిస్తే: “లూదీము, అనామీము, లెహాబీము, నఫ్తూహీము.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: మిస్రాయిము
  rationale: వంశావళిలో ఇది స్థలపేరు ‘ఐగుప్తు’గా కాక వ్యక్తి పేరుగా వాడబడింది; అందువల్ల పేరును లిప్యంతరీకరించాం.
- source_word: יָלַד
  choice: తండ్రి అయ్యాడు
  rationale: పురుష వంశక్రమంలో సంతానోత్పత్తి లేదా వంశమూల సంబంధాన్ని తెలిపే క్రియ. ఆధునిక తెలుగులో సహజంగా ఉండే ఈ రూపం మూలంలోని పురుష వంశావళి భావాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు, వాక్య నిర్మాణంలో దాని పని వ్యక్తమవుతుంది.
- source_word: לודיים
  choice: లూదీయులు
  rationale: ఇది మిస్రాయిము నుండి వచ్చిన ప్రజావర్గపు పేరు. తెలుగులో ప్రజావర్గాన్ని సహజంగా సూచించేందుకు ‘-ఈయులు’ రూపాన్ని వాడాం; మరింత ప్రత్యక్ష లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
- source_word: עֲנָמִים
  choice: అనామీయులు
  rationale: చుట్టుపక్కల ఉన్న ప్రజావర్గాల పేర్లకు సమాంతరంగా, తెలుగులో సులభంగా అర్థమయ్యే ప్రజానామ రూపాన్ని వాడాం.
- source_word: לְהָבִים
  choice: లెహాబీయులు
  rationale: జాబితాలోని ఇతర ప్రజావర్గాల పేర్లతో ఏకరీతిగా ఉండే తెలుగు ప్రజానామ రూపాన్ని వాడాం.
- source_word: נַפְתֻּחִים
  choice: నఫ్తూహీయులు
  rationale: జాబితాలోని ఇతర ప్రజావర్గాల పేర్లతో ఏకరీతిగా ఉండే తెలుగు ప్రజానామ రూపాన్ని వాడాం; హీబ్రూ రూపానికి దగ్గరైన లిప్యంతరీకరణను పాదసూచికలో ఉంచాం.
