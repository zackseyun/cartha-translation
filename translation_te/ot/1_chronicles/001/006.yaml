lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనేది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచనం. వంశావళి సందర్భంలో ‘కుమారులు’ అనేది మూలంలోని వంశసంబంధ పదప్రయోగాన్ని స్పష్టంగా నిలుపుతుంది. జాబితాలో సహజమైన తెలుగు ప్రవాహం కోసం ఆరంభ ו ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: גֹּמֶר
  choice: గోమెరు
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אַשְׁכֲּנַז
  choice: అష్కెనజు
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: דִיפַת
  choice: దీఫతు
  rationale: దినవృత్తాంతముల మసొరెటిక్ పాఠంలోని דִיפַת రూపాన్నే ప్రధాన పాఠంలో అనుసరించాం; ఆదికాండంలోని సమాంతర వంశావళిలో ఉన్న ‘రీఫతు’ రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: תוֹגַרְמָה
  choice: తోగర్మా
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
