id: 1CH.19.17
reference: 1 Chronicles 19:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: te
  text: దావీదుకు ఆ సంగతి తెలియజేయబడినప్పుడు, అతడు ఇశ్రాయేలీయులందరినీ సమకూర్చి, యొర్దాను దాటి, వారి దగ్గరకు వచ్చి, వారికి ఎదురుగా సైన్యాన్ని మోహరించాడు. దావీదు అరామును యుద్ధంలో ఎదుర్కొనేందుకు సైన్యాన్ని మోహరించాడు; వారు అతనితో యుద్ధం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు అతనికి వ్యతిరేకంగా యుద్ధం చేశారు.” హీబ్రూ వాక్యం అక్షరార్థంగా “అతనితో” అని చెబుతుంది; ఈ సందర్భంలో అది దావీదుకు వ్యతిరేకంగా చేసిన యుద్ధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: దావీదుకు ఆ సంగతి తెలియజేయబడినప్పుడు
  rationale: హీబ్రూ నిష్క్రియాత్మక కథన రూపాన్ని, తెలియజేసిన వ్యక్తిని ఊహించి చేర్చకుండా సహజమైన తెలుగు కాలవాక్యంగా అందిస్తుంది.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలీయులందరినీ సమకూర్చి
  rationale: אָסַף అనే పదంలోని కూడగట్టడం/సమీకరించడం అనే భావాన్ని, సైనిక సందర్భాన్ని అతిగా వివరించకుండా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: యొర్దాను దాటి
  rationale: నదిని దాటడాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: వారి దగ్గరకు వచ్చి
  rationale: אֶל యొక్క ప్రాథమిక దిశార్థాన్ని నిలుపుతుంది; శత్రుత్వ భావం వెంటనే వచ్చే యుద్ధ సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: వారికి ఎదురుగా సైన్యాన్ని మోహరించాడు
  rationale: సైనిక సందర్భంలో ערך దళాలను క్రమపరచి నిలబెట్టడాన్ని సూచిస్తుంది; తెలుగులో ‘సైన్యాన్ని మోహరించాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: దావీదు అరామును యుద్ధంలో ఎదుర్కొనేందుకు సైన్యాన్ని మోహరించాడు
  rationale: పునరావృతమైన ערך కు అదే సైనిక పదాన్ని వాడుతూ, לִקְרַאת లోని ‘ఎదుర్కొనడానికి/కలుసుకోవడానికి’ అనే భావాన్ని యుద్ధ సందర్భానికి తగినట్లు కాపాడుతుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి భౌగోళిక పేరు ‘సిరియా’గా మార్చకుండా హీబ్రూ సొంతపేరునే లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: వారు అతనితో యుద్ధం చేశారు
  rationale: עִם యొక్క అక్షరార్థమైన ‘తో’ను నిలుపుతూ, సందర్భంలో దావీదుకు వ్యతిరేకంగా పోరాడారనే అర్థాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ స్పష్టీకరణను పాదటిప్పణిలో ఇస్తుంది.
