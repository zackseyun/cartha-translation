translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. సైనిక అర్థానికి ‘సైన్యాన్ని మోహరించాడు’ ఎంచుకోబడింది. అసలు పాఠంలోని עִם సంబంధమైన స్వల్ప పదార్థ సందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలుపుకున్నాం.
