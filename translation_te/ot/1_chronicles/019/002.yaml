source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “నాహాషు కుమారుడైన హానూనుకు నేను దయ చూపిస్తాను; ఎందుకంటే అతని తండ్రి నాకు దయ చూపించాడు.” కాబట్టి దావీదు అతని తండ్రి విషయమై[a] అతన్ని ఓదార్చడానికి దూతలను పంపాడు. దావీదు సేవకులు హానూనును ఓదార్చడానికి అమ్మోనీయుల దేశానికి, హానూను వద్దకు వచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని తండ్రి కారణంగా అతన్ని ఓదార్చడానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ మాటల్లో ‘మరణం’ అనే పదం లేకపోయినా, అతని తండ్రి మరణించినందువల్ల ఈ ఓదార్పు అవసరమైందని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: దయ
  rationale: ఈ రాజకీయ, వ్యక్తిగత సందర్భంలో ఈ పదం ఒకరి పట్ల మరొకరు చూపే దయతో కూడిన విశ్వసనీయ మేలును సూచిస్తుంది. రెండు సందర్భాల్లోనూ ‘దయ చూపించడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: עָשָׂה חֶסֶד עִם
  choice: దయ చూపించాడు / దయ చూపిస్తాను
  rationale: హీబ్రూ నుడికారాన్ని పదశః కాకుండా, లక్ష్యభాషలో సహజంగా ‘ఒకరికి దయ చూపించడం’ అని అనువదించాం.
- source_word: מַלְאָכִים
  choice: దూతలు
  rationale: ఇక్కడ వీరు దావీదు పంపిన మానవ ప్రతినిధులు; అందువల్ల ‘దూతలు’ సరైనది. సందర్భం వారి అధికారిక హోదాను స్పష్టంగా నిర్దేశించనందున ‘రాయబారులు’ అని బలపరచలేదు.
- source_word: לְנַחֲמוֹ
  choice: అతన్ని ఓదార్చడానికి
  rationale: నחם క్రియారూపం ఇక్కడ శోకంలో ఉన్న వ్యక్తిని ఓదార్చడాన్ని సూచిస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל אָבִיו
  choice: అతని తండ్రి విషయమై
  rationale: עַל ఇక్కడ ఓదార్పుకు కారణమైన లేదా సందర్భమైన విషయాన్ని సూచిస్తుంది. మూలంలో ‘మరణం’ అనే పదం ప్రత్యక్షంగా లేనందున దానిని ప్రధాన వాక్యంలో చేర్చకుండా అసలు నిర్మాణాన్ని నిలిపాం.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దేశం
  rationale: בְּנֵי עַמּוֹןకు ప్రామాణిక తెలుగు జాతినామం ‘అమ్మోనీయులు’; אֶרֶץ యొక్క భౌగోళిక భావాన్ని ‘దేశం’ నిలుపుతుంది.
- source_word: עַבְדֵי דָוִיד
  choice: దావీదు సేవకులు
  rationale: עבדים ఇక్కడ దావీదు సేవలో ఉన్నవారిని సూచిస్తుంది. ‘అధికారులు’ అనే నిర్దిష్ట రాజకీయ హోదాను మూలం తప్పనిసరిగా సూచించదు.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: ఇలా అన్నాడు ... కాబట్టి ... పంపాడు ... వచ్చారు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా అందించాం; ‘కాబట్టి’ దావీదు ప్రకటించిన ఉద్దేశానికి అనుగుణంగా దూతలను పంపిన ఫలిత సంబంధాన్ని తెలియజేస్తుంది.
