translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు సమీపంగా ‘దావీదు,’ ‘నాహాషు,’ ‘హానూను’ అని ఇచ్చాం. మూలంలోని ‘ఓదార్చడం’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
