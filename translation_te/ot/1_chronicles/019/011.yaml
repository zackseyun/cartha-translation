  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: te
  text: మిగిలిన సైనికులను తన సోదరుడైన అబీషై ఆధీనంలో ఉంచాడు[a]. వారు అమ్మోనీయులను ఎదుర్కొనేందుకు యుద్ధ క్రమంలో మోహరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “తన సోదరుడైన అబీషై చేతిలో ఇచ్చాడు”; ఇది అతని అధికారానికి లేదా నాయకత్వానికి అప్పగించడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: మిగిలిన సైనికులను
  rationale: יֶתֶר అంటే ‘మిగిలినవారు’; הָעָם అక్షరార్థంగా ‘ప్రజలు’ అయినా, ఈ సైనిక సందర్భంలో యోవాబు సేనలోని మిగిలిన యోధులను సూచిస్తుంది.
- source_word: נָתַן בְּיַד
  choice: ఆధీనంలో ఉంచాడు
  rationale: ‘చేతిలో ఇచ్చాడు’ అనే హెబ్రీ నుడికారం ఇక్కడ అధికారాన్ని లేదా నాయకత్వ బాధ్యతను అప్పగించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆధీనంలో ఉంచాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אַבְשַׁי אָחִיו
  choice: తన సోదరుడైన అబీషై
  rationale: పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, אָחִיו అనే సంబంధ సూచనను స్పష్టంగా నిలిపాం.
- source_word: וַיַּעַרְכוּ
  choice: యుద్ధ వ్యూహంలో నిలిచారు
  rationale: ערך అనే క్రియ సైనిక సందర్భంలో దళాలను యుద్ధానికి క్రమపరచడాన్ని సూచిస్తుంది; ఈ పదబంధం ఆ సైనిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִקְרַאת
  choice: ఎదుర్కొనేందుకు
  rationale: ఈ పదానికి ‘ఎదురుగా వెళ్లడం/కలుసుకోవడం’ అనే భావం ఉంది; యుద్ధ సందర్భంలో ‘ఎదుర్కొనేందుకు’ తగిన అర్థాన్ని ఇస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులను
  rationale: ‘అమ్మోను కుమారులు’ అనే అక్షరార్థ రూపం ఇక్కడ జాతివాచకంగా ఉంది; తెలుగులో సహజమైన జాతినామం ‘అమ్మోనీయులు’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ, ‘చేతిలో ఇచ్చాడు’ అనే నుడికారపు అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
