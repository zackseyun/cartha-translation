id: 1CH.19.10
reference: 1 Chronicles 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: te
  text: యుద్ధం తనకు ముందునుంచీ వెనుకునుంచీ ఎదురై ఉందని యోవాబు చూసినప్పుడు, అతడు ఇశ్రాయేలులోని ఎంపికైన యోధులలో కొందరిని ఎంచుకొని[a], అరామును[b] ఎదుర్కొనేలా వారిని యుద్ధానికి సిద్ధంగా నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులోని ఎంపికైన యోధులందరి నుండి.” హీబ్రూ పదబంధం ఎంపికైన లేదా శ్రేష్ఠమైన యోధులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “అరాము”; ఇక్కడ అరామీయుల సైన్యాలు ఉద్దేశించబడ్డాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: కథనంలో ראה యొక్క ప్రాథమికమైన ‘చూచుట’ అనే భావాన్ని నిలుపుతూ, ఇక్కడ యుద్ధ పరిస్థితిని గ్రహించడాన్ని సహజంగా సూచిస్తుంది.
- source_word: פְנֵי הַמִּלְחָמָה
  choice: యుద్ధరంగం
  rationale: అక్షరార్థంగా ‘యుద్ధపు ముఖం/ముందుభాగం’; ఈ సైనిక సందర్భంలో తనకు ఎదురుగా ఏర్పడిన యుద్ధవ్యవస్థను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלָיו פָּנִים וְאָחוֹר
  choice: తనకు ముందూ వెనుకా ఏర్పడి ఉందని
  rationale: శత్రు బలగాలు రెండు దిశల నుంచి ఎదురుగా ఉన్న వ్యూహాత్మక పరిస్థితిని తెలియజేస్తూ, ‘ముందు—వెనుక’ అనే మూలభాషా వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וַיִּבְחַר
  choice: ఎంచుకొని
  rationale: בחר యొక్క సాధారణ అర్థాన్ని సరళంగా, సహజంగా అందిస్తుంది.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని ఎంపికైన యోధులందరిలో కొందరిని
  rationale: సైనిక సందర్భంలో בָּחוּר ఎంపికైన లేదా శ్రేష్ఠమైన యోధులను సూచిస్తుంది; מִן‌లోని సమూహం నుంచి ఎంపిక అనే భావాన్ని ‘అందరిలో కొందరిని’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲרֹךְ
  choice: యుద్ధపంక్తిలో నిలబెట్టాడు
  rationale: యుద్ధ సందర్భంలో ערך సైనికులను క్రమంగా మోహరించడం లేదా పంక్తిగా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: לִקְרַאת אֲרָם
  choice: అరాము సైన్యాన్ని ఎదుర్కొనేలా
  rationale: לקראת యొక్క ఎదుర్కొనడం అనే సైనిక భావాన్ని సహజంగా అందిస్తుంది; అֲרָם ఇక్కడ ఆ దేశపు బలగాలను సందర్భానుసారంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. సైనిక సందర్భాన్ని స్పష్టంచేయడానికి ‘యోధులు,’ ‘సైన్యం,’ ‘యుద్ధపంక్తి’ వాడినా, మూలంలోని ముందూ వెనుకా అనే వ్యూహాత్మక చిత్రణను అలాగే నిలిపాం.
