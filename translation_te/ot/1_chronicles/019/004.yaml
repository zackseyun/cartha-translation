  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: te
  text: అప్పుడు హానూను దావీదు సేవకులను[a] పట్టుకొని, వారికి క్షౌరం చేయించి, వారి వస్త్రాలను పిరుదుల వరకు[b] సగంగా కోసి, వారిని పంపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 10:4లోని సమాంతర వృత్తాంతం హానూను వారి గడ్డాలలో సగాన్ని క్షౌరం చేయించాడని స్పష్టంగా చెబుతుంది. అయితే ఇక్కడ దినవృత్తాంతాలు ‘వారికి క్షౌరం చేయించాడు’ అని మాత్రమే చెబుతున్నాయి.
    reason: cross_reference
  - marker: b
    text: లేదా, “పిరుదుల దగ్గర వరకు.” హీబ్రూ పదం వెనుక భాగం లేదా పిరుదుల ప్రాంతాన్ని సూచిస్తుంది; వస్త్రాలను ఈ విధంగా కోయించడం బహిరంగ అవమానాన్ని కలిగించింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: సేవకులను
  rationale: ఈ పదం సేవకులు లేదా దాసులు అని సూచించగలదు. ఇక్కడ దావీదు తరఫున వచ్చిన రాజదూతల సందర్భం కాబట్టి, వారి సేవాసంబంధాన్ని సహజంగా తెలిపే ‘సేవకులు’ అనువైనది.
- source_word: וַיְגַלְּחֵם
  choice: వారికి క్షౌరం చేయించి
  rationale: హీబ్రూ క్రియ ‘క్షౌరం చేయు’ అని మాత్రమే చెబుతుంది; ఏ భాగాన్ని క్షౌరం చేశారో దినవృత్తాంతాలు పేర్కొనదు. అందువల్ల సమాంతర వాక్యంలోని వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: מַדְוֵיהֶם
  choice: వారి వస్త్రాలను
  rationale: ఇది దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. గౌరవప్రదమైన ఆధునిక తెలుగు శైలిలో ‘వస్త్రాలు’ సందర్భానికి సరిపోతుంది.
- source_word: בַּחֵצִי
  choice: సగానికి
  rationale: వస్త్రాలను మధ్యవరకు కోసి తగ్గించారనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַד הַמִּפְשָׂעָה
  choice: పిరుదుల వరకు
  rationale: హీబ్రూ పదం వెనుక భాగంలోని పిరుదుల ప్రాంతాన్ని సూచిస్తుంది. అవమానకరమైన బహిర్గతాన్ని స్పష్టంగా తెలిపేందుకు ‘పిరుదుల వరకు’ ఎంచుకున్నాం.
- source_word: וַיְשַׁלְּחֵם
  choice: వారిని పంపివేశాడు
  rationale: అవమానించిన తరువాత వారిని అక్కడి నుంచి పంపివేసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
