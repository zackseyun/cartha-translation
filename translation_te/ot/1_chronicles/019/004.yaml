translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని అస్పష్టతను కాపాడేందుకు క్షౌరం చేసిన శరీరభాగాన్ని ప్రధాన పాఠ్యంలో పేర్కొనలేదు. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
