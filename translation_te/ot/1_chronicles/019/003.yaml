  edition: WLC
  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵי עַמּ֜וֹן לְ/חָנ֗וּן הַֽ/מְכַבֵּ֨ד דָּוִ֤יד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַחֲמִ֑ים הֲ/לֹ֡א בַּ֠/עֲבוּר לַ/חְקֹ֨ר וְ/לַ/הֲפֹ֤ךְ וּ/לְ/רַגֵּל֙ הָ/אָ֔רֶץ בָּ֥אוּ עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: te
  text: 'అయితే అమ్మోనీయుల అధిపతులు హానూనుతో ఇలా అన్నారు: “దావీదు నిన్ను ఓదార్చేవారిని నీ దగ్గరకు పంపించినందువల్ల, నీ తండ్రిని గౌరవించాలనే ఉద్దేశంతోనే అతడు అలా చేశాడని నీ దృష్టిలో అనుకుంటున్నావా?[a] దేశాన్ని పరిశోధించడానికి, దాన్ని కూలదోయడానికి,[b] దానిలో గూఢచర్యం చేయడానికి కాదా అతని సేవకులు నీ దగ్గరికి వచ్చారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “నీ కళ్లలో.” ఈ హీబ్రూ నుడికారం హానూను అభిప్రాయాన్ని లేదా అంచనాను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దాన్ని తలకిందులు చేయడానికి.” హీబ్రూ క్రియకు తిప్పడం లేదా తలకిందులు చేయడం అనే అర్థం ఉంది; ఇక్కడ అది శత్రుత్వపూర్వకంగా దేశాన్ని అణచివేయడం లేదా కూలదోయడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: అధిపతులు
  rationale: రాజకీయంగా ఉన్నత స్థానంలోని పాలకులను లేదా అధికారులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘అధిపతులు’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: הַמְכַבֵּד
  choice: గౌరవిస్తున్నాడు
  rationale: כבד ఇక్కడ గౌరవించడం లేదా మర్యాద చూపడం అనే అర్థంలో ఉంది.
- source_word: בְּעֵינֶיךָ
  choice: నీ దృష్టిలో
  rationale: అక్షరార్థంగా ‘నీ కళ్లలో’; హానూను అభిప్రాయం లేదా అవగాహనను సూచించే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְנַחֲמִים
  choice: నిన్ను ఓదార్చేవారు
  rationale: మరణశోక సందర్భంలో సానుభూతి తెలిపి ఓదార్చడానికి పంపబడినవారిని సూచిస్తుంది.
- source_word: בַּעֲבוּר
  choice: చేయడానికి
  rationale: తరువాత పేర్కొన్న చర్యల ఉద్దేశాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַחְקֹר
  choice: పరిశోధించడానికి
  rationale: దేశాన్ని జాగ్రత్తగా పరిశీలించడం లేదా దాని సంగతులు తెలుసుకోవడం అనే గూఢచర్య సందర్భానికి సరిపోతుంది.
- source_word: וְלַהֲפֹךְ
  choice: దాన్ని తలకిందులు చేయడానికి
  rationale: הפך యొక్క ‘తిప్పివేయడం/తలకిందులు చేయడం’ అనే చిత్రాన్ని నిలుపుతూ, శత్రుత్వపూర్వక కల్లోలం లేదా విధ్వంసం అనే సందర్భార్థాన్నీ తెరిచి ఉంచుతుంది.
- source_word: וּלְרַגֵּל
  choice: దానిలో గూఢచర్యం చేయడానికి
  rationale: רגל పియేల్ రూపం గూఢచర్యం లేదా రహస్యంగా భూభాగాన్ని పరిశీలించడాన్ని సూచిస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ అమ్మోనీయుల భూభాగం లేదా రాజ్యాన్ని సూచిస్తుంది; ‘దేశం’ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజు పంపిన సేవకులు లేదా దూతలను నేరుగా సూచిస్తుంది; వారి పదవిని అనవసరంగా నిర్దిష్టం చేయదు.
