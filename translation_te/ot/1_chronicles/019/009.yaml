  to: అమ్మోను కుమారులు[a] బయటకు వచ్చి, నగర ప్రవేశం వద్ద[c] యుద్ధానికి బారులు తీర్చారు[b]. అయితే వచ్చిన రాజులు మాత్రం విడిగా పొలంలో ఉన్నారు[d].
