translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అమ్మోను కుమారులు’ ద్వారా మూలంలోని రూపం నిలుపబడగా, ‘యుద్ధానికి బారులు తీర్చారు’ సైనిక అమరిక భావాన్ని స్పష్టంగా అందిస్తుంది. ‘పొలంలో’ అనే పదం మూలానికి సన్నిహితంగా ఉంచబడింది; సందర్భ వివరణ పాదసూచికలో ఉంది.
