  text: וַ/יֵּצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּֽעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הָ/עִ֑יר וְ/הַ/מְּלָכִ֣ים אֲשֶׁר בָּ֔אוּ לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: te
  text: అమ్మోను కుమారులు[a] బయటకు వచ్చి, నగర ప్రవేశం వద్ద[c] యుద్ధానికి బారులు తీర్చారు[b]. అయితే వచ్చిన రాజులు మాత్రం విడిగా పొలంలో ఉన్నారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమ్మోనీయులు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘అమ్మోను కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు తమ దళాలను యుద్ధానికి తగిన క్రమంలో అమర్చారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నగర ద్వారం వద్ద.’ అయితే హీబ్రూలో సాధారణంగా ‘ద్వారం’ అనే అర్థమిచ్చే పదం కాక, ‘ప్రవేశం/తెరువు’ అనే విస్తృతార్థ పదం ఉంది.
    reason: lexical_alternative
  - marker: d
    text: అంటే, మిత్రరాజులు అమ్మోను సైన్యానికి వేరుగా, పొలంలో మోహరించి ఉన్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరి
  rationale: יצא అనే క్రియ ఇక్కడ నగరంలోనుంచి సైనికులు బయటకు రావడాన్ని సూచిస్తుంది; తెలుగులో ‘బయలుదేరి’ సహజంగా ఆ కదలికను తెలియజేస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోను కుమారులు
  rationale: హీబ్రూ జాతినామ రూపాన్ని సాధ్యమైనంతగా నిలుపుతూ, అర్థమయ్యే గౌరవప్రదమైన తెలుగు వాడబడింది; ‘అమ్మోనీయులు’ అనే సహజ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: యుద్ధానికి బారులు తీర్చారు
  rationale: ఈ హీబ్రూ సైనిక నుడికారం పోరాడడం మొదలుపెట్టారనే దానికంటే, యుద్ధానికి దళాలను క్రమంగా అమర్చడాన్ని సూచిస్తుంది.
- source_word: פֶּתַח הָעִיר
  choice: నగర ప్రవేశం దగ్గర
  rationale: פֶּתַח సాధారణంగా ప్రవేశం లేదా తెరువు అని అర్థం; సాధారణ హీబ్రూ ‘ద్వారం’ పదం ఇక్కడ లేదు కాబట్టి ‘ప్రవేశం’ ఎంచుకోబడింది.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: అయితే వచ్చిన రాజులు
  rationale: వావ్ ఇక్కడ అమ్మోనీయుల స్థానం మరియు వచ్చిన మిత్రరాజుల స్థానం మధ్య ఉన్న భేదాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: לְבַדָּם
  choice: వారినుంచి విడిగా
  rationale: రాజులు సంఖ్యాపరంగా ఒంటరిగా ఉన్నారని కాక, అమ్మోను దళాలకు వేరుగా మోహరించారని సందర్భం సూచిస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שׂדה అనే పదానికి నేరుగా ‘పొలం/బయలు’ అనే అర్థం ఉంది; మూలంలో లేని ‘బహిరంగ’ అనే విశేషణాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
