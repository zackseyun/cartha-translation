source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק מִמֶּ֨/נִּי֙ אֲרָ֔ם וְ/הָיִ֥יתָ לִּ֖/י לִ/תְשׁוּעָ֑ה וְ/אִם בְּנֵ֥י עַמּ֛וֹן יֶֽחֶזְק֥וּ מִמְּ/ךָ֖ וְ/הוֹשַׁעְתִּֽי/ךָ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: te
  text: 'అతడు అన్నాడు: “అరాము నా కంటే బలంగా ఉంటే, నీవు నాకు రక్షణగా ఉంటావు; అమ్మోనీయులు నీ కంటే బలంగా ఉంటే, నేను నిన్ను రక్షిస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק)
  choice: కంటే బలంగా ఉంటే
  rationale: מן‌తో కూడిన חזק ఇక్కడ యుద్ధంలో తులనాత్మక బలాన్ని సూచిస్తుంది. ‘కంటే బలంగా’ అనేది మూలంలోని తులనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: మూలం ప్రజలను లేదా రాజ్యాన్ని ‘అరాము’ అని పేర్కొంటుంది; తరువాతి భౌగోళిక పేరు ‘సిరియా’ను ప్రవేశపెట్టకుండా మూలనామాన్ని ఉంచాం.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: నీవు నాకు సహాయంగా రావాలి
  rationale: అక్షరార్థంగా ‘నాకు రక్షణగా ఉండాలి.’ యుద్ధ సందర్భంలో ఇది తోడుగా వచ్చి విడిపించడం లేదా ఆదుకోవడం అనే భావం కలిగిన నుడికారం; తెలుగులో ‘సహాయంగా రావాలి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ‘అమ్మోను కుమారులు’ అనే జాతినామానికి సహజమైన తెలుగు రూపం.
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: నేను నీకు సహాయం చేస్తాను
  rationale: హిఫీల్ రూపం రక్షించడం లేదా విడిపించడం అని అర్థం. పరస్పర యుద్ధసహాయం అనే సందర్భంలో ‘నీకు సహాయం చేస్తాను’ ముందటి వాక్యభాగంతో సహజ సమాంతరతను కలిగిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని సాధారణ wayyiqtol రూపాన్ని సహజమైన తెలుగు కథనశైలిలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. యుద్ధ సందర్భంలోని పరస్పర సహాయ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, חזק מן లోని తులనాత్మక నిర్మాణాన్ని నిలుపుకున్నాం.
