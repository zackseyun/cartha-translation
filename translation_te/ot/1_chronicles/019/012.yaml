review_pass:
  verdict: revise
  source_fidelity: The comparative clauses are conveyed accurately. However, రావాలి normally carries an obligation ('must/should come') rather than the Hebrew future commitment, and సహాయం is weaker and less specific than the battlefield deliverance denoted by תְּשׁוּעָה and הוֹשַׁעְתִּיךָ.
  naturalness: The draft is generally fluent modern Telugu, but the future forms ఉంటావు / రక్షిస్తాను more naturally preserve the reciprocal assurance in this speech than the deontic రావాలి.
  terminology: అరాము and అమ్మోనీయులు appropriately retain the source names. Rendering the paired Hebrew deliverance terms with రక్షణగా / రక్షిస్తాను preserves their semantic relationship and the immediate military context without importing theological interpretation.
  issues:
  - severity: medium
    issue: నీవు నాకు సహాయంగా రావాలి renders a future assurance as an obligation.
    rationale: 'וְהָיִיתָ is a future form: ''you will be [deliverance] for me.'' రావాలి commonly means ''you must/should come'' and changes the force of Joab''s reciprocal commitment.'
  - severity: medium
    issue: సహాయం చేయడం understates the deliverance vocabulary in both halves of the verse.
    rationale: תְּשׁוּעָה and the Hiphil of ישע denote rescue/deliverance. In this battle context రక్షణగా / రక్షిస్తాను is both idiomatic and closer to the paired Hebrew wording.
  revised_text: 'అతడు అన్నాడు: “అరాము నా కంటే బలంగా ఉంటే, నీవు నాకు రక్షణగా ఉంటావు; అమ్మోనీయులు నీ కంటే బలంగా ఉంటే, నేను నిన్ను రక్షిస్తాను.”'
  revised_footnotes: []
  revision_rationale: The revision retains the source names and comparative military sense, while replacing deontic wording with future reciprocal commitments and restoring the explicit deliverance/rescue sense of the Hebrew verbs and noun. No footnotes are necessary because the Telugu rendering does not introduce an unresolved ambiguity requiring explanation.
