revisions:
- from: 'అతడు ఇలా అన్నాడు: “అరాము నా కంటే బలంగా ఉంటే, నీవు నాకు సహాయంగా రావాలి; అమ్మోనీయులు నీ కంటే బలంగా ఉంటే, నేను నీకు సహాయం చేస్తాను.”'
  to: 'అతడు అన్నాడు: “అరాము నా కంటే బలంగా ఉంటే, నీవు నాకు రక్షణగా ఉంటావు; అమ్మోనీయులు నీ కంటే బలంగా ఉంటే, నేను నిన్ను రక్షిస్తాను.”'
  rationale: The revision retains the source names and comparative military sense, while replacing deontic wording with future reciprocal commitments and restoring the explicit deliverance/rescue sense of the Hebrew verbs and noun. No footnotes are necessary because the Telugu rendering does not introduce an unresolved ambiguity requiring explanation.
