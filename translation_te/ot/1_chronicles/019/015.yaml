  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנ֣וּסוּ גַם הֵ֗ם מִ/פְּנֵי֙ אַבְשַׁ֣י אָחִ֔י/ו וַ/יָּבֹ֖אוּ הָ/עִ֑ירָ/ה וַ/יָּבֹ֥א יוֹאָ֖ב יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: te
  text: అమ్మోనీయులు అరామీయులు పారిపోయారని చూసి, తామూ అతని సహోదరుడైన అబీషై ఎదుటనుండి పారిపోయి పట్టణంలోకి వెళ్లారు. తరువాత యోవాబు యెరూషలేముకు వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ‘అమ్మోను కుమారులు’ అనే హీబ్రూ జాతీయ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ప్రజానామంతో వ్యక్తం చేస్తుంది.
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: అరామీయులు పారిపోయారని ... చూసినప్పుడు
  rationale: כִּי చూసిన విషయాన్ని పరిచయం చేస్తుంది; אֲרָם ఇక్కడ అరాము సైన్యాన్ని సమష్టిగా సూచిస్తుంది. తెలుగు వాక్యప్రవాహం కోసం కాలసంబంధ ఉపవాక్యంగా అమర్చబడింది.
- source_word: וַיָּנוּסוּ גַם הֵם
  choice: వారు కూడా ... పారిపోయి
  rationale: గַם הֵם తెలిపే పోలికను ‘కూడా’ నిలుపుతుంది; కథన క్రమాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: מִפְּנֵי אַבְשַׁי אָחִיו
  choice: యోవాబు సహోదరుడైన అబీషై ఎదుటనుంచి
  rationale: సైనిక సందర్భంలో מִפְּנֵי ప్రత్యర్థి ఎదుటనుంచి వెనుదిరిగి పారిపోవడాన్ని సూచిస్తుంది. אָחִיו లోని సర్వనామం సందర్భానుసారం యోవాబును సూచిస్తుందని స్పష్టం చేయబడింది.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: పట్టణంలోకి వెళ్లారు
  rationale: దిశను సూచించే הָ ప్రత్యయం పట్టణం లోపలికి కదలికను తెలియజేస్తుంది; పట్టణం పేరు మూలంలో ఇవ్వబడలేదు.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: తరువాత యోవాబు యెరూషలేముకు వచ్చాడు
  rationale: వావ్-క్రమం తెలిపే తదుపరి కథన ఘట్టాన్ని ‘తరువాత’ వ్యక్తం చేస్తుంది. ‘తిరిగి వచ్చాడు’ అని మూలంలో లేని భావాన్ని చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. వ్యక్తి, జాతి, స్థలనామాలకు స్థిరమైన తెలుగు బైబిల్ రూపాలు వాడబడ్డాయి; మూలంలోని పేరులేని ‘పట్టణం’ అలాగే ఉంచబడింది.
