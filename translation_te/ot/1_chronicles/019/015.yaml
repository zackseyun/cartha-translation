revisions:
- from: అరామీయులు పారిపోయారని[a] అమ్మోనీయులు చూసినప్పుడు, వారు కూడా యోవాబు సహోదరుడైన అబీషై[b] ఎదుటనుంచి పారిపోయి పట్టణంలోకి వెళ్లారు. తరువాత యోవాబు యెరూషలేముకు వచ్చాడు.
  to: అమ్మోనీయులు అరామీయులు పారిపోయారని చూసి, తామూ అతని సహోదరుడైన అబీషై ఎదుటనుండి పారిపోయి పట్టణంలోకి వెళ్లారు. తరువాత యోవాబు యెరూషలేముకు వచ్చాడు.
  rationale: The revision removes the explicit name “యోవాబు” from the possessive relationship in the main text, preserving the Hebrew's pronominal formulation while retaining the contextual explanation in footnote b. It also uses “చూసి, తామూ” to represent the sequential perception and corresponding flight naturally in Telugu. No change of passage meaning is made.
