translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్య నిర్మాణంలోని రెండు కర్మలను తెలుగులో ‘యోవాబును, ... సైన్యమంతటినీ’ అని స్పష్టంగా నిలిపాం; ‘శూరుల సైన్యం’ అనే నిర్మాణం మూలంలోని సాధ్యమైన సంబంధాన్ని పరిష్కరించకుండా సంరక్షిస్తుంది.
