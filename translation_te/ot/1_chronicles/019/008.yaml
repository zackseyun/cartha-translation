  edition: WLC
  text: וַ/יִּשְׁמַ֖ע דָּוִ֑יד וַ/יִּשְׁלַח֙ אֶת יוֹאָ֔ב וְ/אֵ֥ת כָּל צָבָ֖א הַ/גִּבּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: te
  text: దావీదు ఆ సంగతి విన్నప్పుడు[a], యోవాబును, శూరుల సైన్యమంతటినీ[b] పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ సంగతి అతనికి తెలియజేయబడినప్పుడు,” లేదా “ఆ సంగతి అతనికి తెలిసినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: “శూరులు” అనేది దావీదుకు చెందిన పరాక్రమవంతులైన యోధులను లేదా ప్రత్యేక పోరాట దళాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ఆ సంగతి విన్నప్పుడు
  rationale: ఈ కథన సందర్భంలో שׁמע అంటే దావీదుకు ఆ వార్త తెలిసిందని సూచిస్తుంది. ‘ఆ సంగతి విన్నప్పుడు’ అనేది హీబ్రూ పదానికి నేరమైన అర్థాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: సైనిక కథనంలో שלח యొక్క సాధారణ అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది; విభక్తి కారణంగా వాక్యంలో ‘యోవాబును’ అని ఉంది.
- source_word: כָּל
  choice: అంతటినీ
  rationale: తరువాతి సమాస పదబంధమంతటిని సూచించే כָּל యొక్క సంపూర్ణత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צָבָא
  choice: సైన్యం
  rationale: ఈ యుద్ధ సందర్భంలో వ్యవస్థీకృత పోరాట దళాన్ని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: הַגִּבּוֹרִים
  choice: శూరులు
  rationale: גִּבּוֹרִים ఇక్కడ పరాక్రమవంతులైన యోధులను, బహుశా ప్రత్యేక పోరాట దళాన్ని సూచిస్తుంది. ‘శూరులు’ దాని వీరత్వ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: శూరుల సైన్యమంతటినీ
  rationale: హీబ్రూలోని సమాస సంబంధాన్ని ‘శూరుల సైన్యం’గా నిలుపుతూ, దానిని కేవలం ‘అతని సైన్యమంతటినీ’ అని సాధారణీకరించకుండా ఉంటుంది.
