  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని రెండు ప్రధాన సంఘటనలను తెలుగులో సహజమైన రెండు వాక్యాలుగా ఇచ్చాం.
