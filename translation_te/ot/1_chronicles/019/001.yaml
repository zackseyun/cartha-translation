id: 1CH.19.1
reference: 1 Chronicles 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יָּ֕מָת נָחָ֖שׁ מֶ֣לֶךְ בְּנֵי עַמּ֑וֹן וַ/יִּמְלֹ֥ךְ בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: te
  text: దీని తరువాత అమ్మోనీయుల రాజైన నాహాషు చనిపోయాడు. అతని కుమారుడు అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: హీబ్రూ కథన సూత్రం అక్షరార్థంగా ‘ఇది జరిగిన తరువాత’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘దీని తరువాత’ కాలక్రమ మార్పును సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ నేరుగా ‘చనిపోవడం’ అని అర్థం. మూలపాఠంలోని సూటితనాన్ని మృదూకరించకుండా సాధారణ ఆధునిక తెలుగులో ఈ రూపం అందిస్తుంది.
- source_word: נָחָשׁ
  choice: నాహాషు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారుల రాజు.’ తెలుగులో ఆ ప్రజాజాతిని సహజంగా సూచించడానికి ‘అమ్మోనీయులు’ అని అనువదించాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ సందర్భంలో מלך రాజ్యాధికారాన్ని స్వీకరించడాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ వారసుడు సింహాసనం అధిష్ఠించిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: సర్వనామ ప్రత్యయం నాహాషునే స్పష్టంగా సూచిస్తుంది; ఈ అనువాదం ఆ సంబంధాన్ని నేరుగా తెలుపుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ఈ పదం ఒకరి స్థానం లేదా పదవిలో మరొకరు రావడాన్ని సూచిస్తుంది. రాజవారసత్వ సందర్భంలో ‘అతని స్థానంలో’ ఖచ్చితమైన, సహజమైన రూపం.
