id: 1CH.19.16
reference: 1 Chronicles 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: te
  text: అరాము తాము ఇశ్రాయేలు ఎదుట ఓడిపోయారని చూసినప్పుడు, వారు దూతలను పంపి నదికి అవతల ఉన్న అరామీయులను[a] రప్పించారు; హదదెజెరు సైన్యాధిపతి షోఫకు వారికి ముందు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నది’ అంటే బహుశా యూఫ్రటీసు నది; హెబ్రీ మూలపాఠం కేవలం ‘నదికి అవతల’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: అరాము / అరామీయులు
  rationale: మొదటి సందర్భంలో దేశం లేదా సమూహాన్ని ‘అరాము’గా, రెండవ సందర్భంలో సమీకరించబడిన ప్రజలను లేదా దళాలను ‘అరామీయులు’గా అనువదించడం హెబ్రీ పదప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נִגְּפוּ
  choice: ఓడిపోయామని
  rationale: నిఫల్ రూపం ఇక్కడ యుద్ధంలో పరాజయం పొందడాన్ని సూచిస్తుంది; ‘ఓడిపోయారు’ అనే భావం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎదుట
  rationale: ‘ఇశ్రాయేలు ముఖం ఎదుట’ అనే మూలభాషా జాతీయాన్ని వీలైనంతగా నిలుపుతూ, తెలుగులో సహజంగా ‘ఇశ్రాయేలు ఎదుట’ అని ఇచ్చాం; సందర్భంలో ఇశ్రాయేలు చేతిలో ఓటమి అనే భావం ఉంది.
- source_word: מַלְאָכִים
  choice: దూతలు
  rationale: రాజకీయ-సైనిక సందర్భంలో ఇది మానవ సందేశవాహకులను సూచిస్తుంది; ‘దూతలు’ అనే పదం సందర్భానుకూలం.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: అరామీయులను రప్పించారు
  rationale: హిఫిల్ రూపం ‘బయటకు తీసుకురావడం’ లేదా ‘రప్పించడం’ అనే భావం ఇస్తుంది; అదనపు దళాలను సమీకరించిన సందర్భంలో ‘రప్పించారు’ సహజంగా ఉంటుంది.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: నదికి అవతల ఉన్న
  rationale: మూలపాఠం నది పేరును చెప్పకుండా ‘నదికి అవతల’ అని మాత్రమే చెబుతుంది. అది యూఫ్రటీసు కావచ్చనే గుర్తింపును పాఠ్యంలో నిర్బంధించకుండా మూలంలోని అనిశ్చితిని నిలిపాం.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: హదదెజెరు సైన్యాధిపతి
  rationale: ఇది ప్రామాణిక సైనిక బిరుదు; ‘సైన్యాధిపతి’ సంక్షిప్తంగా, గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: לִפְנֵיהֶם
  choice: వారికి ముందుగా ఉన్నాడు
  rationale: అక్షరార్థమైన ‘వారి ముందు’ అనే స్థానార్థాన్ని నిలుపుతుంది. సందర్భంలో నాయకత్వ భావం ఉండవచ్చు గాని దానిని ప్రధాన పాఠ్యంలో తప్పనిసరిగా నిర్ణయించలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. అరాము/అరామీయులు అనే మూలనామాలను నిలిపాం. మూలపాఠంలోని ‘నదికి అవతల’ మరియు ‘వారి ముందు’ అనే కొంత అస్పష్టమైన ప్రయోగాలను అతిగా వివరణాత్మకంగా మార్చలేదు.
