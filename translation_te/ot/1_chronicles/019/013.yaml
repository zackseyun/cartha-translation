id: 1CH.19.13
reference: 1 Chronicles 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: te
  text: ధైర్యంగా ఉండు[a]. మన ప్రజల కోసం, మన దేవుని పట్టణాల కోసం మనము ధైర్యంగా నిలబడదాం. యాహ్వే తన దృష్టిలో మంచిదైనది చేయుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలంగా ఉండు.” హీబ్రూ పదం బలాన్నీ ధైర్యాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే తన దృష్టిలో మంచిదైనది చేస్తాడు.” ఈ సందర్భంలో హీబ్రూ క్రియను ఆకాంక్షార్థకంగానో భవిష్యదర్థకంగానో అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: ధైర్యంగా ఉండు
  rationale: యుద్ధ సందర్భంలోని బలాన్నీ ధైర్యాన్నీ సూచించే ఏకవచన ఆజ్ఞ. ఆధునిక తెలుగులో సహజమైన ప్రోత్సాహ వాక్యం.
- source_word: וְנִתְחַזְּקָה
  choice: మనమూ ధైర్యంగా నిలబడదాం
  rationale: హిత్పయేల్ కోహోర్టేటివ్‌లోని స్వయంగా దృఢపడే, సంకల్పంతో నిలిచే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעַד
  choice: కోసం
  rationale: ఇక్కడ ప్రజల మరియు పట్టణాల పక్షాన, వాటి రక్షణార్థం పోరాడటాన్ని సూచిస్తుంది.
- source_word: עַמֵּנוּ
  choice: మన ప్రజలు
  rationale: עם అనే పదానికి సాధారణ అర్థమైన మొత్తం ప్రజాసమూహాన్ని నిలుపుతుంది; దానిని కేవలం సైన్యానికి పరిమితం చేయదు.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: మన దేవుని పట్టణాలు
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలిపి, ఆ పట్టణాలు దేవునికి చెందినవనే భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: తన దృష్టికి మంచిదైనది
  rationale: హీబ్రూ ‘అతని కళ్లలో మంచిది’ అనే నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַעֲשֶׂה
  choice: చేయుగాక
  rationale: సందర్భంలో సాధ్యమైన జస్సివ్/ఆకాంక్షార్థక భావాన్ని కాపాడుతూ ఫలితాన్ని దేవునికి అప్పగించే ధోరణిని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని ఒక బిరుదుతో భర్తీ చేయలేదు.
- issue: చివరి క్రియ యొక్క ఆకాంక్షార్థక లేదా భవిష్యదర్థక భావం
  choice: యెహోవా ... చేయుగాక
  alternative: యెహోవా ... చేస్తాడు
  rationale: ముందున్న ప్రోత్సాహ వాక్యాల నేపథ్యంలో ఇది దేవుని చిత్తానికి ఫలితాన్ని అప్పగించే ఆకాంక్షగా చదవవచ్చు; అయితే హీబ్రూ రూపం భవిష్యదర్థకంగానూ అర్థమవుతుందని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యుద్ధ ప్రోత్సాహానికి తగిన దృఢతతో కూడిన, సాధారణ పాఠకులకు స్పష్టమైన గౌరవప్రద శైలి. ‘ధైర్యంగా నిలబడదాం’ ద్వారా ప్రతిబింబాత్మక-సంకల్ప భావాన్ని అతిగా విస్తరించకుండా అందించాం.
