  terminology: ‘యోవాబు,’ ‘అరాము,’ and ‘అరామీయులు’ are appropriate modern Telugu biblical forms. ‘అరామీయులు’ clearly supplies the implicit referent of the Hebrew plural verb and avoids possible ambiguity with Joab’s people.
