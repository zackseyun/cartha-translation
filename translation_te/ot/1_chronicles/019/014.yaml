  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: te
  text: అప్పుడు యోవాబు, అతనితో ఉన్న ప్రజలు అరాము ఎదుట యుద్ధం చేయడానికి ముందుకు సాగారు[a]. అరామీయులు అతని ఎదుటనుండి పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరామీయులకు ఎదురుగా” / “అరాముకు వ్యతిరేకంగా.” హెబ్రీ పాఠంలో అక్షరార్థంగా “అరాము ఎదుట” అని ఉంది; యుద్ధ సందర్భంలో ఈ స్థలసంబంధ నుడికారం అరాము బలగాలకు ఎదురుగా వెళ్లడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: ముందుకు సాగారు
  rationale: నגשׁ అనే క్రియకు ‘దగ్గరకు వచ్చాడు/సమీపించాడు’ అనే ప్రాథమిక అర్థం ఉంది. యుద్ధ సందర్భంలో ‘ముందుకు సాగారు’ అనేది పోరాటానికి సమీపించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్న ప్రజలు
  rationale: הָעָם అనే పదానికి అక్షరార్థంగా ‘ప్రజలు’ అని అర్థం. సందర్భంలో వారు యోఆబుతో ఉన్న పోరాట బలగమైనా, మూలపాఠానికి దగ్గరగా ఉండేందుకు ‘ప్రజలు’ అని ఉంచబడింది.
- source_word: לִפְנֵי אֲרָם
  choice: అరాము ఎదుటికి
  rationale: לִפְנֵי అనే స్థలసంబంధ పదబంధానికి ‘ఎదుట/ముందు’ అనే అర్థం ఉంది. యుద్ధ సందర్భంలో అరాము బలగాల సమక్షంలోకి వెళ్లడాన్ని ‘ఎదుటికి’ ప్రతిబింబిస్తుంది; ‘వ్యతిరేకంగా’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: אֲרָם
  choice: అరాము
  rationale: ఇది ప్రదేశం లేదా జనసమూహాన్ని సూచించే నామం. కాలవిరుద్ధమైన ‘సిరియా’కు బదులు ‘అరాము’ అనే లిప్యంతరీకరణ ఉంచబడింది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: ఈ పదబంధం ముందుకు సాగడంలోని ఉద్దేశాన్ని తెలుపుతుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘యుద్ధం చేయడానికి’ అని అనువదించబడింది.
- source_word: וַיָּנוּסוּ
  choice: పారిపోయారు
  rationale: נוס క్రియ పారిపోవడాన్ని నేరుగా సూచిస్తుంది; ‘వెనక్కి తగ్గారు’ అనేది దాని తీవ్రతను తగ్గించవచ్చు.
- source_word: מִפָּנָיו
  choice: అతని ఎదుటనుండి
  rationale: అక్షరార్థంగా ‘అతని ముఖం/సన్నిధి నుండి.’ ఏకవచన ప్రత్యయం సమీప ఏకవచన వ్యక్తి అయిన యోవాబును సహజంగా సూచిస్తుంది.
- source_word: וַיָּנוּסוּ (implicit subject)
  choice: అరామువారు
  rationale: హెబ్రీ క్రియ బహువచనంలో ఉంది; ముందున్న సమూహవాచక నామమైన ‘అరాము’లోని ప్రజలను సూచిస్తుంది. తెలుగులో ‘వారు’ మాత్రమే ఉంచితే అది యోవాబుతో ఉన్న ప్రజలను సూచించినట్లు అపార్థం కావచ్చు కాబట్టి ‘అరామువారు’ అని స్పష్టం చేయబడింది.
