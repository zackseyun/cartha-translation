  to: అప్పుడు యోవాబు, అతనితో ఉన్న ప్రజలు అరాము ఎదుట యుద్ధం చేయడానికి ముందుకు సాగారు[a]. అరామీయులు అతని ఎదుటనుండి పారిపోయారు.
