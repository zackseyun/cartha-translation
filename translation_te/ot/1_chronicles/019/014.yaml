translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘అరాము ఎదుట’ అనే స్థలసంబంధ నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భానుసార ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం. చివరి బహువచన కర్త తెలుగులో తప్పుగా అనుసంధానించబడకుండా ‘అరామువారు’ అని స్పష్టం చేశాం.
