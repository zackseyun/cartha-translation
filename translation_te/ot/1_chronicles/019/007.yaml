  text: וַ/יִּשְׂכְּר֣וּ לָ/הֶ֡ם שְׁנַיִם֩ וּ/שְׁלֹשִׁ֨ים אֶ֜לֶף רֶ֗כֶב וְ/אֶת מֶ֤לֶךְ מַעֲכָה֙ וְ/אֶת עַמּ֔/וֹ וַ/יָּבֹ֕אוּ וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֣י מֵידְבָ֑א וּ/בְנֵ֣י עַמּ֗וֹן נֶאֶסְפוּ֙ מֵ/עָ֣רֵי/הֶ֔ם וַ/יָּבֹ֖אוּ לַ/מִּלְחָמָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: te
  text: కాబట్టి వారు తమ కోసం ముప్పై రెండు వేల రథాలను[a], మయకా రాజును అతని ప్రజలతో సహా కిరాయికి తీసుకున్నారు. వారు వచ్చి మేదెబా ఎదుట శిబిరం వేశారు. అమ్మోనీయులు[b] తమ పట్టణాల నుండి సమకూడి యుద్ధానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రథాలు” అనే పదం ఇక్కడ విడివిడిగా ఉన్న వాహనాలనే కాక, సమిష్టిగా రథదళాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “అమ్మోను కుమారులు”; ఇది అమ్మోను జాతివారిని సూచించే సాధారణ హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: వారు తమ కోసం కిరాయికి తీసుకున్నారు
  rationale: שׂכר చెల్లింపుతో సేవలను పొందడాన్ని సూచిస్తుంది; לָהֶם ప్రయోజనార్థక భావాన్ని ‘తమ కోసం’ సహజంగా వ్యక్తం చేస్తుంది. ‘కిరాయి సైనికులు’ అని చెప్పడం మూలంలో స్పష్టంగా లేని విషయాన్ని చేర్చుతుంది.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: ముప్పై రెండు వేల రథాలను
  rationale: సంఖ్యను ఆధునిక తెలుగు క్రమంలో ఇచ్చి, רֶכֶב యొక్క ప్రత్యక్ష అర్థమైన ‘రథాలు’ను నిలిపాం; ఇది సమిష్టిగా రథదళాన్ని కూడా సూచించగలదని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: מֶלֶךְ מַעֲכָה וְאֶת עַמּוֹ
  choice: మయకా రాజును అతని ప్రజలతో సహా
  rationale: నిర్మాణ సంబంధాన్ని ‘మయకా రాజు’గా, עם యొక్క విస్తృత అర్థాన్ని ‘ప్రజలు’గా నిలిపాం; సైనిక సందర్భం ఉన్నా ‘సైన్యం’ అని సంకుచితం చేయలేదు.
- source_word: וַיַּחֲנוּ לִפְנֵי מֵידְבָא
  choice: మేదెబా ఎదుట శిబిరం వేశారు
  rationale: లִפְנֵי యొక్క స్థలసంబంధ అర్థాన్ని ‘ఎదుట’గా, חנה యొక్క సైనిక శిబిరార్థాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: בְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థం ‘అమ్మోను కుమారులు’ అయినా, ఇది సాధారణ జాతి సూచన; ఆధునిక తెలుగులో ‘అమ్మోనీయులు’ స్పష్టంగా, సహజంగా ఉంటుంది. అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם וַיָּבֹאוּ לַמִּלְחָמָה
  choice: తమ పట్టణాల నుండి సమకూడి యుద్ధానికి వచ్చారు
  rationale: Niphal సమీకరణ భావాన్ని ‘సమకూడి’గా, לַמִּלְחָמָהను సహజమైన ‘యుద్ధానికి’గా అనువదించాం.
