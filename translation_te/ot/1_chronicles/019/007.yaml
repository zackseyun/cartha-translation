translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తి, స్థల నామాలకు తెలుగు బైబిలు సంప్రదాయానికి దగ్గరైన లిప్యంతరీకరణను ఉపయోగించాం; మూలంలోని సమిష్టి/అక్షరార్థ సందిగ్ధతలను పాదటిప్పణుల్లో నిలిపాం.
