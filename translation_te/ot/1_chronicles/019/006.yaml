  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: te
  text: అమ్మోనీయులు తాము దావీదు దృష్టిలో అసహ్యులమయ్యామని గ్రహించినప్పుడు[a], హానూను, అమ్మోనీయులు తమ కోసం అరాము-నహరాయిము[b], అరాము-మయకా, సోబా ప్రాంతాల నుండి రథాలనూ గుర్రపు రౌతులనూ కిరాయికి తీసుకోవడానికి వెయ్యి తలాంతుల[c] వెండిని పంపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అసహ్యులమయ్యామని’—హీబ్రూలో అక్షరార్థంగా ‘దావీదుకు దుర్వాసన కొట్టేలా అయ్యామని’; ఇది అప్రియులు లేదా ద్వేషపాత్రులు కావడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అరాము-నహరాయిము అనే పేరును సాంప్రదాయంగా ‘రెండు నదుల అరాము’ అని అర్థం చేసుకుంటారు; అంటే మెసొపొతామియా ప్రాంతం.
    reason: cultural_note
  - marker: c
    text: తలాంతు ఒక ప్రాచీన బరువు ప్రమాణం; దాని ఖచ్చితమైన బరువు కాలం, ప్రాంతాన్ని బట్టి మారేది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: గ్రహించినప్పుడు
  rationale: ఈ సందర్భంలో వారు తమ పరిస్థితిని గుర్తించారని భావం; తెలుగులో ‘చూసినప్పుడు’ కంటే ‘గ్రహించినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ఇది ఒక జాతిని సూచించే పదబంధం; ‘అమ్మోను కుమారులు’ అనే అక్షరార్థం కంటే ఆధునిక తెలుగులో జాతినామం సహజం.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: తాము దావీదుకు అసహ్యులమయ్యామని
  rationale: ‘దుర్వాసన కొట్టేలా అయ్యారు’ అనే మూల రూపకానికి ఇక్కడ ‘అసహ్యకరులు/అప్రియులు అయ్యారు’ అనే నుడికారార్థం ఉంది. ప్రతిబింబ భావాన్ని ‘తాము’తో నిలిపాం.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: వెయ్యి తలాంతుల వెండి
  rationale: כִּכָּר ఒక ప్రాచీన బరువు ప్రమాణం; దానిని ఆధునిక బరువుగా ఊహాత్మకంగా మార్చకుండా సంప్రదాయ బైబిలు పదమైన ‘తలాంతు’తో ఇచ్చాం.
- source_word: לִשְׂכֹּר לָהֶם
  choice: తమ కోసం … కిరాయికి తీసుకోవడానికి
  rationale: కిరాయికి తీసుకోవడం అనే క్రియతో పాటు לָהֶם లోని ప్రయోజనార్థక భావాన్ని ‘తమ కోసం’గా స్పష్టంగా నిలిపాం.
- source_word: אֲרַם נַהֲרַיִם
  choice: అరాము-నహరాయిము
  rationale: స్థలనామ స్వభావాన్ని కాపాడేందుకు లిప్యంతరీకరించాం; దాని సాంప్రదాయ భౌగోళిక వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: אֲרַם מַעֲכָה
  choice: అరాము-మయకా
  rationale: సంయుక్త ప్రాంతనామంగా లిప్యంతరీకరించాం.
- source_word: מִצּוֹבָה
  choice: సోబా ప్రాంతాల నుంచి
  rationale: సోబా అనే స్థలనామాన్ని లిప్యంతరీకరించి, మూడు ప్రాంతాలకూ వర్తించే ‘ప్రాంతాల నుంచి’ అనే సహజ తెలుగు నిర్మాణాన్ని ఉపయోగించాం.
- source_word: רֶכֶב וּפָרָשִׁים
  choice: రథాలనూ గుర్రపు రౌతులనూ
  rationale: రֶכֶב ఇక్కడ సమూహార్థకంగా రథదళాన్ని సూచిస్తుంది; פָרָשִׁיםను స్పష్టమైన, సహజమైన ‘గుర్రపు రౌతులు’గా అనువదించాం.
