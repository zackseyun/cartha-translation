translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని నుడికారాన్ని ప్రధాన వాక్యంలో సహజార్థంతో ఇచ్చి, దాని సజీవమైన అక్షరార్థాన్ని పాదసూచికలో కాపాడాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు విరుద్ధ స్థానాల్లో ఉన్నందున, తెలుగు పాఠ్యంలో మూలానికి తగిన స్థానాల్లో సరిచేశాం.
