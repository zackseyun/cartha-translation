  text: וַ/יִּרְא֞וּ עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥ימוּ עִם דָּוִ֖יד וַ/יַּֽעַבְדֻ֑/הוּ וְ/לֹא אָבָ֣ה אֲרָ֔ם לְ/הוֹשִׁ֥יעַ אֶת בְּנֵי עַמּ֖וֹן עֽוֹד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: te
  text: హదదెజెరు సేవకులు తాము ఇశ్రాయేలు ఎదుట ఓడిపోయారని చూసినప్పుడు, వారు దావీదుతో సంధి చేసుకొని అతనికి సేవ చేశారు. అరాము ఇకపై అమ్మోనీయులకు[a] సహాయం చేయడానికి ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; ఇది అమ్మోనీయులను సూచించే జాతినామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: హదదెజెరు సేవకులు
  rationale: రాజకీయ-సైనిక సందర్భంలో עַבְדֵי అనేది హదదెజెరుకు లోబడిన సేవకులు లేదా అధికారులు అనే భావాన్ని ఇస్తుంది; ‘సేవకులు’ సహజంగా ఉండి ఆధీనతను నిలుపుతుంది.
- source_word: נִגְּפוּ
  choice: ఓడిపోయామని
  rationale: నిఫాల్ రూపం ఇక్కడ సైనిక పరాజయాన్ని సూచిస్తుంది; ‘ఓడిపోయారు’ అనేది మరణాల పరిమాణాన్ని అతిశయింపకుండా సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎదుట
  rationale: మూలంలోని ‘ఇశ్రాయేలు సమక్షంలో/ఎదుట’ అనే హీబ్రూ ప్రయోగాన్ని నిలుపుతూ, వారి చేతిలో పరాజయం పొందిన భావాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: దావీదుతో సంధి చేసుకొని
  rationale: שלם హిఫిల్ రూపం עם తో కలిసి శాంతి లేదా ఒప్పందం చేసుకోవడాన్ని సూచిస్తుంది; రాజకీయ సందర్భంలో ‘సంధి చేసుకొని’ సహజమైన తెలుగు.
- source_word: וַיַּעַבְדֻהוּ
  choice: అతనికి సేవచేశారు
  rationale: ఈ క్రియ దావీదుకు రాజకీయంగా లోబడి సేవ చేయడాన్ని సూచిస్తుంది; కర్మప్రత్యయం సూచించే దావీదును ‘అతనికి’ అని స్పష్టం చేసింది.
- source_word: אֲרָם
  choice: అరాము
  rationale: హీబ్రూ స్థలనామాన్ని ‘సిరియా’గా మార్చకుండా మూలరూపానికి దగ్గరగా లిప్యంతరీకరించింది; ఇక్కడ అది సమూహార్థక రాజకీయ పేరుగా ఉంది.
- source_word: לְהוֹשִׁיעַ
  choice: సహాయం చేయడానికి
  rationale: సైనిక మైత్రి సందర్భంలో ఈ పదం అమ్మోనీయులకు తోడ్పాటు అందించడాన్ని సూచిస్తుంది; ‘రక్షించడానికి’ కంటే ‘సహాయం చేయడానికి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులకు
  rationale: ‘అమ్మోను కుమారులు’ అనే అక్షరార్థ హీబ్రూ ప్రయోగం జాతిని సూచించే స్థిరమైన నామం; ఆధునిక తెలుగులో ‘అమ్మోనీయులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְלֹא אָבָה ... עוֹד
  choice: ఆ తర్వాత ... ఇష్టపడలేదు
  rationale: నిరాకరణతో కూడిన עוֹד ఇకపై లేదా మరలా చేయకపోవడాన్ని సూచిస్తుంది; ‘ఆ తర్వాత ... ఇష్టపడలేదు’ తెలుగు వాక్యంలో కొనసాగింపును నిలిపివేసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
