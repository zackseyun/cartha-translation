review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the military totals, the distinction between chariot-force personnel and infantry, and the Chronicles form of the commander’s name. However, “నిలువలేక” adds an interpretive element not expressed by וַיָּנָס (“fled”), and “చంపించాడు” normally implies that David ordered another person to kill Shophach. The Hiphil הֵמִית can be rendered directly in Telugu here as “చంపాడు.”
  naturalness: “అరాము వారు ... పారిపోయారు” is more natural Telugu for the collective military force than treating Aram as a feminine singular entity. The revised wording also avoids the potentially misleading causative sense of “చంపించాడు.”
  terminology: “రథదళానికి చెందిన ఏడువేల మంది,” “కాల్బలానికి చెందిన నలభై వేల మంది,” “సైన్యాధిపతి,” and the transliteration “షోఫకు” are suitable. “అరాము వారు” retains the name Aram while making clear that the fleeing referent is its forces/people, without introducing the later name Syria.
  issues:
  - severity: medium
    issue: “ఇశ్రాయేలు ఎదుట నిలువలేక పారిపోయింది” adds “unable to stand” and treats Aram as a singular entity.
    rationale: The Hebrew simply says that Aram fled from before Israel. The added idiom is plausible in battle context but is not necessary, and the collective plural wording is more natural in Telugu.
  - severity: high
    issue: “సైన్యాధిపతి షోఫకును కూడా చంపించాడు” can mean that David caused someone else to kill Shophach.
    rationale: Although the Hebrew Hiphil of מות has a causative form, in this narrative it functions as a direct idiom meaning “put to death/killed.” Telugu “చంపించాడు” introduces an unwarranted indirect-agent implication. “చంపాడు” conveys the intended direct narrative sense.
  revised_text: అరాము వారు ఇశ్రాయేలు ఎదుటనుండి పారిపోయారు. దావీదు అరాము వారిలో రథదళానికి చెందిన ఏడువేల మందిని, కాల్బలానికి చెందిన నలభై వేల మందిని హతమార్చాడు.[a] సైన్యాధిపతి షోఫకును[b] చంపాడు.
