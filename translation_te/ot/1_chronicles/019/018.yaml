translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వాక్య నిర్మాణం సహజంగా ఉండేలా హీబ్రూ దీర్ఘ సమన్వయ వాక్యాన్ని మూడు వాక్యాలుగా విభజించాం. ‘రథదళం’ అనే పదం רֶכֶב లోని రథాలు/రథసైన్యం అనే స్వల్ప సందిగ్ధతను అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
