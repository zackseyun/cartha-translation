- from: అరాము ఇశ్రాయేలు ఎదుట నిలువలేక పారిపోయింది. దావీదు అరాము సైన్యంలో రథదళానికి చెందిన ఏడువేల మందిని, కాల్బలానికి చెందిన నలభై వేల మందిని హతమార్చాడు.[a] సైన్యాధిపతి షోఫకును[b] కూడా చంపించాడు.
  to: అరాము వారు ఇశ్రాయేలు ఎదుటనుండి పారిపోయారు. దావీదు అరాము వారిలో రథదళానికి చెందిన ఏడువేల మందిని, కాల్బలానికి చెందిన నలభై వేల మందిని హతమార్చాడు.[a] సైన్యాధిపతి షోఫకును[b] చంపాడు.
  rationale: The revision removes an unnecessary interpretive expansion from the rout statement, makes the collective referent of Aram natural in Telugu, and corrects the final verb so that David is presented as directly killing Shophach, as in the Hebrew narrative. Footnote anchors remain attached to the numerical variant and the alternate name respectively.
  reviewer_model: gpt-5.6-terra
