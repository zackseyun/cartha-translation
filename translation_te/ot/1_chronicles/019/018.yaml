source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: te
  text: అరాము వారు ఇశ్రాయేలు ఎదుటనుండి పారిపోయారు. దావీదు అరాము వారిలో రథదళానికి చెందిన ఏడువేల మందిని, కాల్బలానికి చెందిన నలభై వేల మందిని హతమార్చాడు.[a] సైన్యాధిపతి షోఫకును[b] చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనికి సమాంతరమైన 2 సమూయేలు 10:18లో “ఏడువందల రథాలు, నలభై వేల గుర్రపు రౌతులు” అని ఉంది. ఇక్కడ 1 దినవృత్తాంతములలో “రథదళానికి చెందిన ఏడువేల మంది, కాల్బలానికి చెందిన నలభై వేల మంది” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: సమాంతర వృత్తాంతమైన 2 సమూయేలు 10:16, 18లో షోఫకును “షోబకు” అని పిలిచారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: అరాము
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక సిరియాతో సమీకరించకుండా లిప్యంతరీకరించాం; సందర్భంలో ఇది అరాము సైన్యాన్ని సూచిస్తుంది.
- source_word: וַיָּנָס ... מִלִּפְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎదుట నిలువలేక పారిపోయింది
  rationale: యుద్ధంలో ఓడి ఎదుటి పక్షం సమక్షం నుంచి పారిపోవడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: రథదళానికి చెందిన ఏడువేల మంది
  rationale: רֶכֶב అక్షరార్థంగా రథాలు లేదా రథదళం కావచ్చు. వ్యక్తుల సంఖ్యగా ఉన్న సందర్భంలో కేవలం రథసారథులని పరిమితం చేయకుండా, రథదళ సైనికులనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: కాల్బలానికి చెందిన నలభై వేల మంది
  rationale: అక్షరార్థంగా ‘కాలినడక మనుషులు’; సైనిక సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం ‘కాల్బలం’.
- source_word: שׁוֹפַךְ
  choice: షోఫకు
  rationale: దినవృత్తాంతముల గ్రంథంలోని హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం; సమూయేలు గ్రంథంలోని భిన్న రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: שַׂר הַצָּבָא
  choice: సైన్యాధిపతి
  rationale: ‘సైన్యపు అధికారి’ అనే భావాన్ని సహజంగా, గౌరవప్రదంగా తెలిపే సంక్షిప్త తెలుగు పదం.
- source_word: הֵמִית
  choice: చంపించాడు
  rationale: హిఫీల్ రూపంలోని ‘చనిపోయేలా చేశాడు/మరణింపజేశాడు’ అనే కారణార్థక ఛాయను, ముందున్న ‘హతమార్చాడు’ నుండి భేదిస్తూ నిలుపుతుంది.
