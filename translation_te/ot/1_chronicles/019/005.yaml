  text: וַ/יֵּלְכוּ֩ וַ/יַּגִּ֨ידוּ לְ/דָוִ֤יד עַל הָֽ/אֲנָשִׁים֙ וַ/יִּשְׁלַ֣ח לִ/קְרָאתָ֔/ם כִּי הָי֥וּ הָ/אֲנָשִׁ֖ים נִכְלָמִ֣ים מְאֹ֑ד וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ שְׁב֣וּ בִֽ/ירֵח֔וֹ עַ֛ד אֲשֶׁר יְצַמַּ֥ח זְקַנְ/כֶ֖ם וְ/שַׁבְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: te
  text: వారు వెళ్లి ఆ మనుషుల సంగతి దావీదుకు తెలియజేశారు. ఆ మనుషులు ఎంతో అవమానానికి గురై ఉన్నారు[b] కాబట్టి, దావీదు వారిని కలుసుకోవడానికి పంపించాడు[a]. రాజు వారితో, “మీ గడ్డాలు మళ్లీ పెరిగే వరకు యెరికోలోనే ఉండండి; ఆ తర్వాత తిరిగి రండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దూతలను వారిని కలుసుకోవడానికి పంపించాడు.” ఎవరిని పంపించాడో హీబ్రూ మూలపాఠం స్పష్టంగా చెప్పదు; దూతలను పంపించాడని సందర్భం ద్వారా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఎంతో అవమానానికి గురై ఉన్నారు” అనే మాటను “తీవ్రంగా సిగ్గుపడ్డారు” లేదా “పూర్తిగా అప్రతిష్ఠపాలయ్యారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: వారు వెళ్లి ఆ మనుషుల సంగతి దావీదుకు తెలియజేశారు
  rationale: హీబ్రూ కథన క్రమాన్ని, అలాగే సమాచారం అందించిన ‘వారు’ ఎవరన్నది స్పష్టంగా చెప్పని మూలపాఠపు స్వభావాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: దావీదు వారిని కలుసుకోవడానికి పంపించాడు
  rationale: שׁלח క్రియకు కర్మ మూలపాఠంలో చెప్పబడలేదు. తెలుగులో కూడా పంపబడినవారు ఎవరన్నది జోడించకుండా సహజంగా చెప్పి ఆ అస్పష్టతను నిలిపాం.
- source_word: נִכְלָמִים מְאֹד
  choice: ఎంతో అవమానానికి గురై ఉన్నారు
  rationale: כלם నిఫల్ రూపం సూచించే అవమానిత స్థితిని, מְאֹד ఇచ్చే తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: యెరికోలోనే ఉండండి
  rationale: ישׁב ఇక్కడ ‘కూర్చోండి’ కంటే ‘ఉండండి’ అనే అర్థంలో ఉంది; ‘లోనే’ వారు అక్కడే నిలిచి ఉండాలనే ఆజ్ఞను సహజంగా తెలియజేస్తుంది.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: మీ గడ్డాలు మళ్లీ పెరిగే వరకు
  rationale: మునుపటి వచనంలో గడ్డాలు కత్తిరించబడిన సందర్భం వల్ల צמח ను ‘మళ్లీ పెరిగే’ అని సందర్భానుగుణంగా అందించాం; సమూహాన్ని ఉద్దేశించినందున తెలుగులో బహువచనం వాడాం.
- source_word: וְשַׁבְתֶּם
  choice: ఆ తర్వాత తిరిగి రండి
  rationale: עד אשר ఉపవాక్యం తర్వాత వచ్చే చర్యల క్రమాన్ని సహజ తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలపాఠం దావీదు పేరును మళ్లీ వాడకుండా అతని రాజపదవినే ఉపయోగిస్తుంది; అదే భేదాన్ని అనువాదంలో నిలిపాం.
