translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలపాఠంలో చెప్పని పంపబడిన వ్యక్తులను ప్రధాన వచనంలో జోడించలేదు. అందించిన ఆంగ్ల పాఠంలో [b] గుర్తు గడ్డాలు పెరగడం తర్వాత ఉన్నప్పటికీ, దాని గమనిక נִכְלָמִים מְאֹד అనే ‘అవమానితులు’ పదబంధానికి సంబంధించినది; ప్రచురణ పాఠంలో సంబంధిత పదబంధం వద్ద ఉంచడం సముచితం. అయితే ప్రతి గమనిక గుర్తు ప్రధాన పాఠ్యంలో ఉండాలనే నియమాన్ని పాటిస్తూ [b] ను వాక్యాంతంలో ఉంచాం.
