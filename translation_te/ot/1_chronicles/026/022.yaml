id: 1CH.26.22
reference: 1 Chronicles 26:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֖י יְחִֽיאֵלִ֑י זֵתָם֙ וְ/יוֹאֵ֣ל אָחִ֔י/ו עַל אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: te
  text: 'యెహీయేలీ కుమారులు: జేతాము, అతని సహోదరుడు యోవేలు; వీరు యాహ్వే[a] గృహపు ఖజానాలకు బాధ్యులుగా ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దైవనామం ‘యాహ్వే’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: దైవనామం יְהוָהకు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: యెహీయేలీ కుమారులు
  rationale: నిర్మాణరూప బహువచనమైన בְּנֵיని నేరుగా ‘కుమారులు’గా అనువదించాం; పరిపాలనా వంశావళి సందర్భంలో יְחִיאֵלִיని వ్యక్తి పేరుగా లిప్యంతరీకరించాం.
- source_word: זֵתָם וְיוֹאֵל
  choice: జేతాము, ... యోవేలు
  rationale: రెండు వ్యక్తి పేర్లను తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אָחִיו
  choice: అతని సహోదరుడు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం జేతామును సూచిస్తూ యోవేలు అతని సహోదరుడని తెలిపే సహజమైన పఠనాన్ని నిలిపాం.
- source_word: עַל אֹצְרוֹת
  choice: ఖజానాలకు బాధ్యులుగా ఉన్నారు
  rationale: పరిపాలనా సందర్భంలో עַל పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది; אֹצְרוֹת సంస్థాగత ఖజానాలను సూచిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరపు
  rationale: ‘యెహోవా గృహము’ అనే అక్షరార్థాన్ని సహజమైన ఆధునిక తెలుగులో ఆలయాన్ని సూచించే ‘మందిరము’తో వ్యక్తపరిచాం; దైవనామాన్ని పేరుగానే నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం. మూల ఉచ్చారణను సూచించే ‘యాహ్వే’ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: בֵּית יְהוָה యొక్క రూపకం
  choice: యెహోవా మందిరము
  alternative: యెహోవా గృహము
  rationale: ‘గృహము’ మూలానికి మరింత అక్షరానువాదమైనా, ఈ ఆలయ పరిపాలనా సందర్భంలో ‘మందిరము’ సాధారణ పాఠకునికి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకునికి స్పష్టంగా రూపొందించాం. సంక్షిప్త హీబ్రూ పరిపాలనా వాక్యాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తూ, אָחִיוలోని ఏకవచన సంబంధాన్ని నిలిపాం.
