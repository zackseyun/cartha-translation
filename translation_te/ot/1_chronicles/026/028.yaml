revisions:
- from: ద్రష్టయైన[a] సమూయేలు, కీషు కుమారుడైన సౌలు, నేరు కుమారుడైన అబ్నేరు, సెరూయా కుమారుడైన యోవాబు ప్రతిష్ఠించినదంతా—మొత్తంగా, ఎవరైనా ప్రతిష్ఠించినదంతా—షెలోమీతు, అతని సోదరుల పర్యవేక్షణలో[b] ఉండేది.
  to: ద్రష్టయైన[a] సమూయేలు, కీషు కుమారుడైన సౌలు, నేరు కుమారుడైన అబ్నేరు, సెరూయా కుమారుడైన యోవాబు అంకితం చేసినదంతా—అంకితం చేయబడినదంతా—షెలోమీతు మరియు అతని సోదరుల బాధ్యతలో[b] ఉండేది.
  rationale: The revision preserves the Hebrew’s double comprehensive expression while removing the unsupported explicit ‘anyone.’ It uses natural modern Telugu for dedicated sacred property and for the administrative charge exercised by Shelomith and his brothers. Footnote a remains anchored to ‘ద్రష్టయైన,’ and footnote b remains anchored to the phrase translating עַל־יַד.
