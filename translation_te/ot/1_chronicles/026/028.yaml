id: 1CH.26.28
reference: 1 Chronicles 26:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: te
  text: ద్రష్టయైన[a] సమూయేలు, కీషు కుమారుడైన సౌలు, నేరు కుమారుడైన అబ్నేరు, సెరూయా కుమారుడైన యోవాబు అంకితం చేసినదంతా—అంకితం చేయబడినదంతా—షెలోమీతు మరియు అతని సోదరుల బాధ్యతలో[b] ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ద్రష్ట’ అనేది ఇక్కడి హీబ్రూ బిరుదైన רֹאֶהకు అనువాదం; ఇది ప్రవచన సేవ చేసే వ్యక్తికి వాడిన పూర్వకాలపు పదం.
    reason: cultural_note
  - marker: b
    text: లేదా, “పర్యవేక్షణలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: ప్రతిష్ఠించినదంతా
  rationale: כֹל యొక్క సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘అంతా’ అనే రూపంతో నిలిపింది.
- source_word: הַהִקְדִּישׁ
  choice: ప్రతిష్ఠించిన
  rationale: קדשׁ హిఫీల్ రూపం వస్తువులను పవిత్రమైన ఉపయోగం కోసం ప్రత్యేకంగా అంకితం చేయడాన్ని సూచిస్తుంది; ఆలయ ఖజానా సందర్భంలో ‘ప్రతిష్ఠించిన’ తగిన పదం.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: ద్రష్టయైన సమూయేలు
  rationale: רֹאֶה అనే పాత ప్రవచన సంబంధమైన బిరుదును సాధారణమైన ‘ప్రవక్త’గా మార్చకుండా ప్రత్యేకంగా నిలిపింది.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: ఇక్కడ ప్రత్యక్ష వంశసంబంధ సూత్రం ఉంది; అందువల్ల ‘కుమారుడు’ సరళమైన అనువాదం.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: మొత్తంగా, ఎవరైనా ప్రతిష్ఠించినదంతా
  rationale: ఏ వ్యక్తి ప్రతిష్ఠించిన వస్తువులైనా అన్న సమగ్ర, పునరుక్తి-సారాంశ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל יַד
  choice: పర్యవేక్షణలో
  rationale: పరిపాలనా సందర్భంలో ఈ నానుడి బాధ్యత లేదా అధీన పర్యవేక్షణను సూచిస్తుంది; పదశః ‘చేతిమీద’ అనడం తెలుగులో అపార్థం కలిగిస్తుంది.
- source_word: שְׁלֹמִית
  choice: షెలోమీతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְאֶחָיו
  choice: అతని సోదరులు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచనం సహజంగా షెలోమీతు సోదరులను సూచిస్తుంది; విస్తృతార్థంలో బంధువులు అనే అవకాశం ఉన్నా ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠంలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ పరిపాలనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించింది. పేర్ల జాబితా స్పష్టంగా ఉండేలా సంబంధవాచక నిర్మాణాలను ఉంచి, హీబ్రూ వాక్యంలోని సమగ్ర పునరుక్తిని డాష్‌ల మధ్య నిలిపింది.
