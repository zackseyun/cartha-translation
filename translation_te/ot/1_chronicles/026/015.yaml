  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: te
  text: ఓబేదెదోముకు దక్షిణ దిక్కు కేటాయించబడింది; అతని కుమారులకు నిల్వగదుల భవనం[a] కేటాయించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేకరణల భవనం.” హెబ్రీ పదబంధం సేకరించి ఉంచిన వస్తువుల నిల్వస్థలాన్ని లేదా నిల్వగదులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: ఓబేదెదోముకు
  rationale: సందర్భంలో לְ ఉపసర్గ చీట్ల ద్వారా వచ్చిన బాధ్యత లేదా కేటాయింపును సూచిస్తుంది; తెలుగులో సంప్రదాన విభక్తి సహజంగా దీనిని వ్యక్తం చేస్తుంది.
- source_word: נֶגְבָּה
  choice: దక్షిణ వైపు
  rationale: దిశను సూచించే ־ָה ప్రత్యయంతో ఉన్న పదం ఇక్కడ దక్షిణ దిక్కున ఉన్న కాపలా స్థానాన్ని సూచిస్తుంది.
- source_word: וּלְבָנָיו
  choice: అతని కుమారులకు
  rationale: బనావ్ అనే పదం ఓబేదెదోము కుమారులను సూచిస్తుంది; לְ వారి కేటాయింపును తెలియజేస్తుంది.
- source_word: בֵּית הָאֲסֻפִּים
  choice: గిడ్డంగుల భవనం
  rationale: בֵּית నిర్మాణాన్ని లేదా భవనాన్ని, אסף మూలం నుంచి వచ్చిన הָאֲסֻפִּים సేకరించి నిల్వచేసే ప్రదేశాలను సూచిస్తాయి. ఈ అనిశ్చితిని పాదటిప్పణిలో నిలుపుతూ ప్రధాన పాఠంలో సహజమైన ఆలయ-సందర్భ పదబంధాన్ని వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చీట్ల ద్వారా జరిగిన కేటాయింపు సందర్భాన్ని స్పష్టంచేయడానికి ‘వచ్చింది’ను పూరించాం. వ్యక్తినామాన్ని ‘ఓబేదెదోము’గా లిప్యంతరీకరించాం; గంభీరతను కాపాడుతూ వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం.
