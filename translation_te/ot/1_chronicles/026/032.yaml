source:
  edition: WLC
  text: וְ/אֶחָ֣י/ו בְּנֵי חַ֗יִל אַלְפַּ֛יִם וּ/שְׁבַ֥ע מֵא֖וֹת רָאשֵׁ֣י הָ/אָב֑וֹת וַ/יַּפְקִידֵ֞/ם דָּוִ֣יד הַ/מֶּ֗לֶךְ עַל הָ/ראוּבֵנִ֤י וְ/הַ/גָּדִי֙ וַ/חֲצִי֙ שֵׁ֣בֶט הַֽ/מְנַשִּׁ֔י לְ/כָל דְּבַ֥ר הָ/אֱלֹהִ֖ים וּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: te
  text: పరాక్రమవంతులైన అతని సహోదరులు[a] 2,700 మంది పితృకుటుంబాల పెద్దలు. దేవునికి సంబంధించిన ప్రతి వ్యవహారానికీ, రాజుకు సంబంధించిన ప్రతి వ్యవహారానికీ బాధ్యత వహించేలా రాజైన దావీదు వారిని రూబేనీయుల మీద, గాదీయుల మీద, మనష్షే అర్ధగోత్రం మీద నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని వంశబంధువులు.”
    reason: హీబ్రూ אחים అనే పదం సహోదరులనే కాక సందర్భానుసారం విస్తృత వంశబంధువులను కూడా సూచించగలదు.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు[a]
  rationale: ముందరి వచనంలోని హషబ్యాను సూచించే పుంలింగ బహువచన బంధుత్వపదం. ప్రధాన అర్థమైన ‘సహోదరులు’ను ఉంచి, వంశబంధువులు అనే విస్తృత అర్థసాధ్యతను పాదటీపులో తెలిపాం.
- source_word: בְּנֵי חַיִל
  choice: పరాక్రమశాలులు
  rationale: బలం, శౌర్యం, సామర్థ్యం గల పురుషులను సూచించే హీబ్రూ నుడికారానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం; సందర్భంలోని నాయకత్వ యోగ్యతను కూడా మోయగలదు.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: 2,700 మంది
  rationale: హీబ్రూ సంఖ్యను నేరుగా, ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: వంశపారంపర్య కుటుంబ విభాగాల నాయకులను సూచించే పరిపాలనా పదబంధం. ‘పితృకుటుంబాలు’ మూలంలోని సామాజిక నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וַיַּפְקִידֵם
  choice: వారిని ... నియమించాడు
  rationale: హిఫీల్ రూపం అధికారపూర్వకంగా బాధ్యత అప్పగించడాన్ని సూచిస్తుంది; ‘నియమించాడు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל
  choice: '... మీద'
  rationale: పేర్కొన్న గోత్రసమూహాలపై పరిపాలనా పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: రూబేనీయుల మీద, గాదీయుల మీద, మనష్షే అర్ధగోత్రం మీద
  rationale: ఏకవచన జాతివాచక రూపాలను సమూహార్థంలో సహజమైన తెలుగు బహువచనాలుగా ఇచ్చి, మనష్షే గోత్రంలోని సగభాగాన్ని ‘అర్ధగోత్రం’గా తెలిపాం.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: దేవునికి సంబంధించిన ప్రతి వ్యవహారాన్నీ, రాజుకు సంబంధించిన ప్రతి వ్యవహారాన్నీ చూసుకోవడానికి
  rationale: דבר కు ఇక్కడ ‘వ్యవహారం/కార్యం’ అనే పరిపాలనా భావం ఉంది. దేవుని విషయాలు, రాజు విషయాలు అనే రెండు బాధ్యతా రంగాల సమాంతరత్వాన్ని సహజమైన తెలుగులో నిలిపాం.
theological_decisions:
- issue: దేవుని వ్యవహారాలు మరియు రాజు వ్యవహారాల పరిధి
  choice: నియమితులు దేవునికి సంబంధించిన వ్యవహారాలకూ రాజుకు సంబంధించిన వ్యవహారాలకూ బాధ్యత వహించారు.
  alternative: ‘దేవుని పనంతటికీ, రాజసేవకూ’ అని మరింత భావానువాదంగా ఇవ్వవచ్చు.
  rationale: మూలం రెండు బాధ్యతా రంగాలను వేరు చేస్తుంది గాని వాటి మధ్య సిద్ధాంతపరమైన క్రమాన్నో, తరువాతి కాలపు మత-రాజ్య విభజననో నిర్దేశించదు. అందువల్ల ఆ ఉద్రిక్తతను వివరించకుండా సమాంతరంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పితృకుటుంబాలు’, ‘అర్ధగోత్రం’ వంటి పదాలు వంశపారంపర్య-పరిపాలనా సందర్భాన్ని కాపాడుతాయి; ‘చూసుకోవడానికి’ బాధ్యత భావాన్ని సామాన్య పాఠకుడికి స్పష్టంగా చేస్తుంది.
