  to: పరాక్రమవంతులైన అతని సహోదరులు[a] 2,700 మంది పితృకుటుంబాల పెద్దలు. దేవునికి సంబంధించిన ప్రతి వ్యవహారానికీ, రాజుకు సంబంధించిన ప్రతి వ్యవహారానికీ బాధ్యత వహించేలా రాజైన దావీదు వారిని రూబేనీయుల మీద, గాదీయుల మీద, మనష్షే అర్ధగోత్రం మీద నియమించాడు.
