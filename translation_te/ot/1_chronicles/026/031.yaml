source:
  edition: WLC
  text: לַֽ/חֶבְרוֹנִי֙ יְרִיָּ֣ה הָ/רֹ֔אשׁ לַֽ/חֶבְרוֹנִ֥י לְ/תֹלְדֹתָ֖י/ו לְ/אָב֑וֹת בִּ/שְׁנַ֨ת הָֽ/אַרְבָּעִ֜ים לְ/מַלְכ֤וּת דָּוִיד֙ נִדְרָ֔שׁוּ וַ/יִּמָּצֵ֥א בָ/הֶ֛ם גִּבּ֥וֹרֵי חַ֖יִל בְּ/יַעְזֵ֥יר גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: te
  text: హెబ్రోనీయుల విషయానికి వస్తే, యెరీయా తన వంశావళి ప్రకారం పితృకుటుంబాల[a] లెక్కన హెబ్రోనీయుల ప్రధానుడు. దావీదు రాజ్యపాలనలో నలభయ్యవ సంవత్సరంలో వారి గురించి విచారణ జరపగా, గిలాదులోని యాజేరు వద్ద వారిలో పరాక్రమశాలులు[b] కనుగొనబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పితృకుటుంబాలు” అనేది కేవలం చిన్న కుటుంబాలను కాదు, పూర్వికుల ఆధారంగా ఏర్పడిన వంశ-గృహ సమూహాలను సూచించే పదం.
    reason: cultural_note
  - marker: b
    text: లేదా “శూరులు,” “సమర్థులైనవారు.” హీబ్రూ పదబంధం బలం, శౌర్యం లేదా నిరూపిత సామర్థ్యంతో ప్రత్యేకంగా నిలిచిన వారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: హెబ్రోనీయుల విషయానికొస్తే
  rationale: ప్రారంభంలోని ל ఉపసర్గ ఇక్కడ కొత్త వంశవర్గాన్ని అంశంగా ప్రవేశపెడుతుంది; ఈ తెలుగు ప్రయోగం ఆ సంభాషణాత్మక విధిని సహజంగా తెలియజేస్తుంది.
- source_word: יְרִיָּה
  choice: యెరియా
  rationale: హీబ్రూ వ్యంజన రూపానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: వంశపరమైన పరిపాలనా సందర్భంలో רֹאשׁ నాయకత్వ స్థానాన్ని సూచిస్తుంది.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: వారి పితృకుటుంబాల వంశావళుల ప్రకారం
  rationale: תולדות అనే వంశపరమైన భావాన్నీ, אבות అనే పూర్విక గృహ సమూహాల సాంకేతిక భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తపరుస్తుంది; సందర్భానుసారం ఏకవచన ప్రత్యయం వంశసమూహాన్ని సూచించే 'వారి'గా ఇవ్వబడింది.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: దావీదు పరిపాలనలో నలభయ్యవ సంవత్సరంలో
  rationale: రాజ్యపాలన కాలాన్ని తెలిపే సూటి తేదీ సూత్రానికి సహజమైన తెలుగు రూపం.
- source_word: נִדְרָשׁוּ
  choice: వారి గురించి విచారణ చేయగా
  rationale: నిఫల్ రూపంలోని అధికారిక అన్వేషణ లేదా పరిశీలన భావాన్ని నిలుపుతుంది; కేవలం వెదకడం అని పరిమితం చేయదు.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: వారిలో ... కనిపించారు
  rationale: హీబ్రూలో క్రియ రూపం ఏకవచనంగా ఉన్నా, తరువాతి బహువచన నామపదంతో అనిర్దిష్ట/ఫలితార్థక నిర్మాణంగా పనిచేస్తుంది; తెలుగులో బహువచన క్రియ సహజం.
- source_word: גִּבּוֹרֵי חַיִל
  choice: పరాక్రమశాలులు
  rationale: ఈ స్థిర పదబంధం బలం, శౌర్యం లేదా నిరూపిత సామర్థ్యాన్ని సూచించగలదు; 'పరాక్రమశాలులు' దాని విస్తృత గౌరవార్థాన్ని నిలుపుతుంది.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: గిలాదులోని యాజేరు దగ్గర
  rationale: గిలాదు ప్రాంతంలోని యాజేరు అనే స్థలాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
