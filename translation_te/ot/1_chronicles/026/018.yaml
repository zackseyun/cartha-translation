source:
  edition: WLC
  text: לַ/פַּרְבָּ֖ר לַֽ/מַּעֲרָ֑ב אַרְבָּעָה֙ לַֽ/מְסִלָּ֔ה שְׁנַ֖יִם לַ/פַּרְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/018.yaml
  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: te
  text: 'పడమటి వైపున ఉన్న పర్బార్‌[a]కు: రహదారి[b] వద్ద నలుగురు, పర్బార్ వద్ద ఇద్దరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పర్బార్” అనే అరుదైన హెబ్రీ పదం సూచించే ఖచ్చితమైన నిర్మాణం లేదా ప్రదేశం తెలియదు; దీనిని “ఆవరణ,” “అనుబంధ భవనం,” లేదా సంప్రదాయంగా “శివారు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఎత్తుగా వేసిన దారి,” “కట్టపై దారి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: పర్బార్
  rationale: ఇది అరుదైన హెబ్రీ పదం; అది దేవాలయానికి సంబంధించిన ఏ నిర్మాణాన్ని లేదా ప్రదేశాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు. ఊహాత్మకమైన నిర్మాణపదాన్ని ఎంచుకోకుండా, అనిశ్చితిని నిలిపేందుకు ధ్వన్యనువాదం వాడబడింది.
- source_word: מַעֲרָב
  choice: పడమటి వైపున
  rationale: ఈ పదం పడమటి దిశను లేదా పడమటి భాగాన్ని సూచిస్తుంది; స్థల కేటాయింపు సందర్భంలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: אַרְבָּעָה
  choice: నలుగురు
  rationale: సందర్భంలో లెక్కించబడుతున్నవారు ద్వారపాలకులు కాబట్టి వ్యక్తులకు వాడే సంఖ్యారూపం ఎంచుకోబడింది; 'ద్వారపాలకులు' అనే పదాన్ని మూలపాఠ్యంలో లేని చోట ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: מְסִלָּה
  choice: రహదారి
  rationale: ఈ పదం రహదారి, ఎత్తుగా వేసిన దారి, లేదా కట్టపై దారిని సూచించగలదు. ఇక్కడ అతిగా నిర్దిష్టం కాని సహజమైన పదంగా 'రహదారి' వాడబడింది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: שְׁנַיִם
  choice: ఇద్దరు
  rationale: ద్వారపాలకుల సంఖ్యను సూచిస్తున్నందున వ్యక్తులకు వాడే సంఖ్యారూపం ఎంచుకోబడింది.
- source_word: לְ
  choice: కు / వద్ద
  rationale: పునరావృతమయ్యే ఈ విభక్తి స్థలానుసారమైన కేటాయింపును సూచిస్తుంది. తెలుగులో మొదటి కేటాయింపుకు 'కు', ఉపస్థానాలకు 'వద్ద' సహజంగా ఉన్నాయి.
