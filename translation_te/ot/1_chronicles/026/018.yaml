  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పరిపాలనా జాబితా శైలిని నిలిపాం. అరుదైన స్థలనామాన్ని ధ్వన్యనువాదంగా ఉంచి, దాని అర్థంపై ఉన్న అనిశ్చితిని పాదసూచికలో తెలిపాం.
