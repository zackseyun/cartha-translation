id: 1CH.26.10
reference: 1 Chronicles 26:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/חֹסָ֥ה מִן בְּנֵי מְרָרִ֖י בָּנִ֑ים שִׁמְרִ֤י הָ/רֹאשׁ֙ כִּ֣י לֹא הָיָ֣ה בְכ֔וֹר וַ/יְשִׂימֵ֥/הוּ אָבִ֖י/הוּ לְ/רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: te
  text: 'మెరారి కుమారులలో హోసాకు కుమారులు ఉన్నారు: షిమ్రీ ప్రధానుడు. అతడు మొదట పుట్టినవాడు కాకపోయినా[a], అతని తండ్రి అతన్ని ప్రధానునిగా నియమించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అతడు మొదట పుట్టినవాడు కాదు”; ఇక్కడి హెబ్రీ అనుసంధాన పదాన్ని వివరణార్థకంగానూ, వ్యత్యాసార్థకంగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: హోసాకు
  rationale: లְ ఉపసర్గతో వచ్చిన వ్యక్తిపేరు ఈ వంశావళి సందర్భంలో హోసాకు కుమారులు ఉన్నారనే సంబంధాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో దత్తివిభక్తి సహజంగా ఆ భావాన్ని తెలియజేస్తుంది. వְ అనుసంధానాన్ని ప్రత్యేకంగా ‘మరియు’ అని పలకకుండానే జాబితా ప్రవాహం నిలుస్తుంది.
- source_word: מִן בְּנֵי מְרָרִי
  choice: మెరారి కుమారులలో
  rationale: హోసా మెరారి వంశానికి చెందినవాడని తెలిపే మూలంలోని ‘మెరారి కుమారులలోనుండి’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּנִים
  choice: కుమారులు ఉన్నారు
  rationale: మూలంలో కేవలం ‘కుమారులు’ అనే నామవాచక రూపమే ఉన్నా, తెలుగు వంశావళి వాక్యానికి అవసరమైన కనిష్ఠ క్రియాసంబంధాన్ని ‘ఉన్నారు’ అందిస్తుంది; పుంలింగ బహువచనాన్ని కాపాడుతుంది.
- source_word: שִׁמְרִי
  choice: షిమ్రీ
  rationale: వ్యక్తిపేరును అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: רֹאשׁ ఇక్కడ శరీరంలోని ‘తల’ను కాక కుటుంబ విభాగంలో హోదా లేదా నాయకత్వాన్ని సూచిస్తుంది. ‘ప్రధానుడు’ గౌరవప్రదమైన, సహజమైన తెలుగు పదం.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: అతడు మొదట పుట్టినవాడు కాకపోయినా
  rationale: כִּי వివరణాత్మకముగానూ కారణార్థకముగానూ ఉండగలిగినా, ఇక్కడ జ్యేష్ఠుడు కాని షిమ్రీ ప్రధానుడయ్యాడనే వ్యత్యాసాన్ని concessive రూపం స్పష్టంగా తెలియజేస్తుంది. మూలంలోని సాధ్యమైన మరో సంబంధాన్ని పాదసూచికలో నిలిపింది.
- source_word: בְכוֹר
  choice: మొదట పుట్టినవాడు
  rationale: జననక్రమాన్ని సాధారణ పాఠకునికి నేరుగా అర్థమయ్యే ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భం కుమారుల గురించినదే కాబట్టి ‘కుమారుడు’ అని అదనంగా చేర్చలేదు.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: అతని తండ్రి అతన్ని ప్రధానునిగా నియమించాడు
  rationale: שׂים + לְ ఒక హోదాలో ఉంచడం లేదా నియమించడం అనే భావాన్ని ఇస్తుంది. ‘నియమించాడు’ ఆ అధికారిక నియామక భావాన్ని సహజంగా తెలుపుతుంది; ‘ప్రధానుడు’ను పునరావృతం చేయడం మూలంలోని רֹאשׁ పదబంధాన్ని కాపాడుతుంది.
