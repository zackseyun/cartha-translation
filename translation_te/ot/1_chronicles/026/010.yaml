  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. వ్యక్తిపేర్లను తెలుగు లిపిలో లిప్యంతరీకరించాం; అరుదైన లేదా అతిగా సంస్కృతీకృత పదజాలాన్ని నివారించాం.
