revisions:
- from: షుప్పీముకు, హోసాకు పడమటి వైపు చీటి పడింది. పైకి ఎక్కే రహదారి మీద ఉన్న షల్లెకెతు ద్వారం[a] కూడా ఆ వంతులో ఉంది. ఒక కాపలా స్థానం మరొక కాపలా స్థానానికి ఎదురుగా ఉంది.
  to: షుప్పీముకు, హోసాకు పడమటి వైపు చీటిలో కేటాయించబడింది; పైకి ఎక్కే రహదారిపై ఉన్న షల్లెకెతు ద్వారంతో పాటు, ఒక కాపలా స్థానానికి ఎదురుగా మరో కాపలా స్థానం ఉండేలా.
  rationale: The revision restores the direct syntactic association of the western assignment with the Gate of Shallecheth and the ascending road, removing the unsupported additive 'కూడా' and the paraphrastic claim that the gate was in the allotment. It retains the contextual reference to lot assignment and renders the final compact phrase as a corresponding/opposed guard-station arrangement. The footnote remains anchored to షల్లెకెతు in the revised text and preserves the lexical alternative without treating it as certain.
