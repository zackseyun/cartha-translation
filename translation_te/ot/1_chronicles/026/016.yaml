language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/שֻׁפִּ֤ים וּ/לְ/חֹסָה֙ לַֽ/מַּעֲרָ֔ב עִ֚ם שַׁ֣עַר שַׁלֶּ֔כֶת בַּֽ/מְסִלָּ֖ה הָ/עוֹלָ֑ה מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: te
  text: షుప్పీముకు, హోసాకు పడమటి వైపు చీటిలో కేటాయించబడింది; పైకి ఎక్కే రహదారిపై ఉన్న షల్లెకెతు ద్వారంతో పాటు, ఒక కాపలా స్థానానికి ఎదురుగా మరో కాపలా స్థానం ఉండేలా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: షుప్పీముకు, హోసాకు
  rationale: ל ఉపసర్గ ఇక్కడ చీట్ల ద్వారా బాధ్యతను కేటాయించే సందర్భంలో గ్రహీతలను సూచిస్తుంది. రెండు పేర్లతోనూ దాని భావాన్ని తెలుగులో స్పష్టంగా ఉంచాం.
- source_word: לַמַּעֲרָב
  choice: పడమటి వైపు
  rationale: కేటాయించబడిన పడమటి దిక్కు లేదా భాగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עִם שַׁעַר שַׁלֶּכֶת
  choice: షల్లెకెతు ద్వారం కూడా ఆ వంతులో ఉంది
  rationale: עִם తెలిపే అనుబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; שַׁלֶּכֶתను అనిశ్చిత వ్యుత్పత్తి కారణంగా ప్రధాన పాఠ్యంలో పేరుగానే లిప్యంతరీకరించాం.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: పైకి ఎక్కే రహదారి మీద
  rationale: מְסִלָּה యొక్క రహదారి/ఎత్తైన మార్గం భావాన్ని, הָעוֹלָה యొక్క పైకి వెళ్లే భౌగోళిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: ఒక కాపలా స్థానం మరొక కాపలా స్థానానికి ఎదురుగా
  rationale: మూలంలోని సంక్షిప్త నిర్మాణాన్ని స్పష్టమైన తెలుగులో అందిస్తూ, ఒకదానికొకటి ఎదురుగా లేదా అనురూపంగా ఉన్న కాపలా స్థానాల భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలో సందర్భం ద్వారా అర్థమయ్యే చీటి కేటాయింపును తెలుగులో ‘చీటి పడింది’ అని స్పష్టం చేశాం; కాపలా స్థానాల అమరికలోని స్వల్ప అస్పష్టతను నిలిపాం.
