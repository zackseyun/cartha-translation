  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י לַ֠עְדָּן בְּנֵ֨י הַ/גֵּרְשֻׁנִּ֜י לְ/לַעְדָּ֗ן רָאשֵׁ֧י הָ/אָב֛וֹת לְ/לַעְדָּ֥ן הַ/גֵּרְשֻׁנִּ֖י יְחִיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: te
  text: లాదాను కుమారులు[a]—గేర్షోనీయులలో లాదాను ద్వారా వచ్చినవారు—అనగా, గేర్షోనీయుడైన లాదాను పితృకుటుంబాల[b] పెద్దలైన యెహీయేలీ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లాదాను వంశస్థులు.’ వంశావళులలో ‘కుమారులు’ అనే పదం తరువాతి తరాల వంశస్థులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘పితరుల ఇళ్ల పెద్దలు’; అంటే పూర్వీకుల పేర్లతో గుర్తింపబడిన విస్తృత కుటుంబ విభాగాల నాయకులు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూ రూపం ‘యెహీయేలీ.’ ఇది ఒక వ్యక్తి పేరుగా ఉండవచ్చు; లేదా యెహీయేలు వంశశాఖకు చెందినవారిని సూచించే వంశనామంగా ఉండవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి శైలిలోని మూలపదాన్ని నేరుగా నిలుపుతుంది; ఈ పదం విస్తృతంగా ‘వంశస్థులు’ అనే అర్థాన్నీ కలిగి ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
- source_word: לַעְדָּן
  choice: లాదాను
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుడు
  rationale: గేర్షోను వంశం లేదా గోత్రానికి చెందిన వ్యక్తిని సూచించే వంశసంబంధ విశేషణాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לְלַעְדָּן
  choice: లాదానుకు చెందిన
  rationale: ఇక్కడ לְ దిశకన్నా వంశసంబంధాన్ని లేదా వర్గీకరణను సూచిస్తుంది; తెలుగు పాఠకునికి ఆ సంబంధాన్ని స్పష్టంగా చేస్తుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: పూర్వీకుని ఆధారంగా ఏర్పడిన విస్తృత కుటుంబ విభాగాల నాయకులను సూచించే హీబ్రూ సామాజిక పదబంధాన్ని గౌరవప్రదంగా, అర్థమయ్యేలా అందిస్తుంది.
- source_word: יְחִיאֵלִי
  choice: యెహీయేలీ
  rationale: మూలంలోని రూపాన్ని వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది; ఇది వ్యక్తిని లేదా అతని వంశశాఖను సూచించవచ్చనే అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. మూలంలోని కుదించిన, కొంత అస్పష్టమైన వాక్యనిర్మాణాన్ని పూర్తిగా సాఫీ చేసి అర్థాన్ని నిర్ణయించకుండా, ద్విబిందువు ద్వారా ‘యెహీయేలీ’ యొక్క వ్యాకరణ సంబంధాన్ని ఉద్దేశపూర్వకంగా తెరిచి ఉంచాం.
