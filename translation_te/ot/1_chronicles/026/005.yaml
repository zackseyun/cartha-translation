id: 1CH.26.5
reference: 1 Chronicles 26:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַמִּיאֵ֤ל הַ/שִּׁשִּׁי֙ יִשָׂשכָ֣ר הַ/שְּׁבִיעִ֔י פְּעֻלְּתַ֖י הַ/שְּׁמִינִ֑י כִּ֥י בֵרֲכ֖/וֹ אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: te
  text: ఆరవవాడు అమ్మీయేలు, ఏడవవాడు ఇశ్శాఖారు, ఎనిమిదవవాడు పెయుల్లెతై; ఎందుకంటే దేవుడు అతన్ని ఆశీర్వదించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఎందుకంటే దేవుడు అతన్ని ముందుగానే ఆశీర్వదించాడు.” సందర్భాన్ని బట్టి హీబ్రూ క్రియను పూర్వపూర్ణ భావంతో కూడా అనువదించవచ్చు.'
    reason: కాలరూప ప్రత్యామ్నాయం
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: అమ్మీయేలు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הַשִּׁשִּׁי
  choice: ఆరవవాడు
  rationale: నిర్దిష్ట క్రమసంఖ్య; కుమారుల వరుసను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: יִשָׂשכָר
  choice: ఇశ్శాఖారు
  rationale: ఇక్కడ గోత్రనామం కాక వ్యక్తి పేరు; హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: הַשְּׁבִיעִי
  choice: ఏడవవాడు
  rationale: చుట్టుపక్కల ఉన్న జాబితా నిర్మాణానికి సమాంతరమైన క్రమసంఖ్య.
- source_word: פְּעֻלְּתַי
  choice: పెయుల్లెతై
  rationale: వ్యక్తి పేరు; హీబ్రూ స్వరరూపం మరియు మధ్య వ్యంజన ద్విత్వాన్ని సాధ్యమైనంతగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: הַשְּׁמִינִי
  choice: ఎనిమిదవవాడు
  rationale: జాబితాలోని క్రమాన్ని పూర్తి చేసే నిర్దిష్ట క్రమసంఖ్య.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న కుమారుల జాబితాకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంధి.
- source_word: בֵרֲכוֹ
  choice: అతన్ని ఆశీర్వదించాడు
  rationale: ברך క్రియతో కూడిన మూడవ పురుష ఏకవచన ప్రత్యయం; సందర్భంలో దేవుడు ఓబేదెదోమును ఆశీర్వదించాడనే సహజ భావం. హీబ్రూ క్రియారూపాన్ని అనవసరంగా పూర్వపూర్ణకాలంగా మార్చలేదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియారూపం మరియు సందర్భం వల్ల ఇక్కడ ఇశ్రాయేలు దేవునినే సూచిస్తుంది.
theological_decisions:
- issue: “అతన్ని” అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: సమీప సందర్భంలోని తండ్రి ఓబేదెదోమును సూచిస్తుంది.
  alternative: అతని కుటుంబ వంశాన్ని విస్తృతంగా సూచిస్తుందని అర్థం చేసుకోవచ్చు.
  rationale: 1 దినవృత్తాంతాలు 26:4–8లో ఓబేదెదోము కుమారులు, సంతతి లెక్కించబడుతున్నారు; వారి సంఖ్యకు కారణంగా దేవుడు అతన్ని ఆశీర్వదించాడని చెప్పడం సందర్భానికి అత్యంత సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. వ్యక్తి పేర్లు మూల హీబ్రూను అనుసరించి లిప్యంతరీకరించబడ్డాయి; కారణార్థక כִּי స్పష్టంగా నిలుపబడింది.
