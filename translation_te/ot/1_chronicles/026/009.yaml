translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. ‘మెషెలెమ్యాకు’ అనే దత్తివిభక్తి మూల హీబ్రూ లెక్కింపు నిర్మాణాన్ని నిలుపుతుంది. చివరి విశేషణం మరియు సంఖ్యను విరామచిహ్నాలతో ప్రత్యేకంగా ఉంచి, ‘పరాక్రమవంతులు—పద్దెనిమిది మంది’ అనే హీబ్రూ అనుప్రయోగ క్రమాన్ని సాధ్యమైనంతగా కాపాడాం.
