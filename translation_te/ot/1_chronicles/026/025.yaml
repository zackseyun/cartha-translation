  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: te
  text: 'ఎలీయెజెరుకు సంబంధించిన అతని సోదరుల వంశం[a] ఇలా ఉంది: ఎలీయెజెరు కుమారుడు రెహబ్యా, రెహబ్యా కుమారుడు యెషయా, యెషయా కుమారుడు యోరాము, యోరాము కుమారుడు జిఖ్రీ, జిఖ్రీ కుమారుడు షెలోమీతు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఎలీయెజెరుకు సంబంధించిన అతని సోదరులు.” ఈ హెబ్రీ నిర్మాణం బహుశా ఎలీయెజెరు వంశశాఖను పరిచయం చేస్తోంది. ఇక్కడ “సోదరులు” అనే మాట విస్తృతంగా బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: అతని సోదరుల్లో
  rationale: אָח అనే పదానికి ప్రాథమిక అర్థమైన ‘సోదరులు’ను నిలుపుతూ, వంశావళి సందర్భంలో ఇది విస్తృత బంధువర్గాన్ని కూడా సూచించగలదనే అవకాశాన్ని పాదటిప్పణిలో తెలియజేశాం.
- source_word: לֶאֱלִיעֶזֶר
  choice: ఎలీయెజెరు వంశశాఖకు చెందినవారు
  rationale: ఇక్కడ לְ సంబంధాన్ని సూచిస్తూ ఎలీయెజెరుతో అనుబంధమైన వంశశాఖను పరిచయం చేస్తున్నట్లు సందర్భం సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘వంశశాఖకు చెందినవారు’ అని ఇచ్చాం; హెబ్రీ నిర్మాణంలోని అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
- source_word: בְנוֹ
  choice: '[ముందున్న వ్యక్తి] కుమారుడు'
  rationale: ప్రతి పేరుతో పునరావృతమయ్యే ‘అతని కుమారుడు’ అనే హెబ్రీ పదబంధం వరుస వంశక్రమాన్ని సూచిస్తుంది. తెలుగులో సర్వనామ సందిగ్ధత రాకుండా ప్రతి తండ్రి పేరును మళ్లీ పేర్కొన్నాం.
- source_word: רְחַבְיָהוּ
  choice: రెహబ్యా
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగులో సులభంగా పలికే సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: וִישַׁעְיָהוּ
  choice: యెషయా
  rationale: ఈ వ్యక్తిని ప్రసిద్ధ ప్రవక్త యెషయాతో గందరగోళపరచకుండా, అదే హెబ్రీ పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణను వాడాం; సందర్భమే వ్యక్తిని వేరుచేస్తుంది.
- source_word: וְיֹרָם
  choice: యోరాము
  rationale: వచనంలో ఉన్న సంక్షిప్త నామరూపాన్ని అనుసరించాం; దానికి సంబంధించిన దీర్ఘరూపాన్ని చేర్చలేదు.
- source_word: וְזִכְרִי
  choice: జిఖ్రీ
  rationale: హెబ్రీ వ్యక్తిపేరును ధ్వన్యనుసారంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּשְׁלֹמוֹת
  choice: షెలోమీతు
  rationale: దినవృత్తాంతములలో ఈ వ్యక్తిపేరుకు సాధారణంగా గుర్తించదగిన రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
