  text: בְּנֵ֣י שְׁמַֽעְיָ֗ה עָ֠תְנִי וּ/רְפָאֵ֨ל וְ/עוֹבֵ֧ד אֶלְזָבָ֛ד אֶחָ֖י/ו בְּנֵי חָ֑יִל אֱלִיה֖וּ וּ/סְמַכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: te
  text: 'షెమయా కుమారులు: ఒత్ని, రెఫాయేలు, ఓబేదు, ఎల్జాబాదు; ఎల్జాబాదు సోదరులైన ఎలీహూ, సెమక్యాహూ సమర్థులైనవారు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరాక్రమవంతులు,” “బలవంతులు.” హీబ్రూ పదబంధం బలం, పరాక్రమం లేదా సామర్థ్యాన్ని సూచించవచ్చు; ఇక్కడ అది సేవ చేయగల సామర్థ్యాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: షెమయా కుమారులు
  rationale: హీబ్రూ నిర్మిత సంబంధాన్ని వంశావళి జాబితాకు తగిన సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָתְנִי וּרְפָאֵל וְעוֹבֵד אֶלְזָבָד
  choice: ఒత్ని, రెఫాయేలు, ఓబేదు, ఎల్జాబాదు
  rationale: మసొరెతిక్ పాఠంలోని వ్యక్తినామాలను తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָיו
  choice: ఎల్జాబాదు సోదరులైన
  rationale: హీబ్రూలోని మూడవ పురుష ఏకవచన ప్రత్యయం అక్షరార్థంగా ‘అతని సోదరులు’ అని సూచిస్తుంది. సమీప పూర్వపదమైన ఎల్జాబాదును సహజమైన తెలుగులో స్పష్టపరిచాం; ‘వారి సోదరులు’గా మార్చలేదు.
- source_word: בְּנֵי חָיִל
  choice: సమర్థులైన పురుషులు
  rationale: חַיִל బలం, పరాక్రమం లేదా సామర్థ్యాన్ని సూచించగలదు. ఇది ద్వారపాలకుల వంశజాబితా కావడంతో అనవసరమైన సైనిక భావాన్ని రానివ్వకుండా సేవకు తగిన సామర్థ్యాన్ని ప్రధానంగా తెలియజేస్తుంది.
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: ఎలీహూ, సెమక్యాహూ
  rationale: మసొరెతిక్ స్వరరూపాలకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణలు.
