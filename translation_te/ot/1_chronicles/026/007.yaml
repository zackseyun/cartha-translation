translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హీబ్రూ వాక్యనిర్మాణంలోని ‘అతని సోదరులు’ అనే ఏకవచన సూచనను ఎల్జాబాదుతో అనుసంధానిస్తూ సహజంగా స్పష్టపరిచాం; חַיִל లోని భావవిస్తృతిని పాదసూచికలో నిలిపాం.
