id: 1CH.26.24
reference: 1 Chronicles 26:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: te
  text: మోషే కుమారుడైన గేర్షోము కుమారుడు షెబూయేలు ఖజానాల బాధ్యతలో ప్రధానుడిగా[a] ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాయకుడిగా,” “పర్యవేక్షకుడిగా,” లేదా “అధిపతిగా.” హీబ్రూ పదం అధికారంలో నియమించబడిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిధి గదులు.” హీబ్రూ పదం సందర్భాన్ని బట్టి విలువైన వస్తువులను లేదా వాటిని నిల్వచేసే స్థలాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: షెబూయేలు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం. జాబితాను కలిపే וּ భావం తెలుగులో సహజ వాక్యప్రవాహం ద్వారా వ్యక్తమవుతుంది కాబట్టి ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: మోషే కుమారుడైన గేర్షోము కుమారుడు
  rationale: రెండు בֶּן పదాలు సూచించే ప్రత్యక్ష వంశసంబంధాన్ని నిలిపి, తెలుగులో ఎవరు ఎవరి కుమారుడో స్పష్టంగా ఉండే సహజ క్రమంలో అందించాం.
- source_word: נָגִיד עַל
  choice: పై ప్రధాన అధికారిగా
  rationale: నָגִיד ఇక్కడ పరిపాలనా బాధ్యతలో నియమించబడిన నాయకుణ్ణి సూచిస్తుంది; עַל అతని పర్యవేక్షణాధికారాన్ని తెలుపుతుంది. ‘ప్రధాన అధికారి’ రాజవంశీయ భావాన్ని చేర్చకుండా సందర్భానుగుణ అధికారాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָ/אֹצָרוֹת
  choice: ఖజానాలు
  rationale: ఆలయానికి సంబంధించిన విలువైన వస్తువులు లేదా అవి భద్రపరచబడే స్థలాలను సూచించే పరిపాలనా సందర్భంలో ‘ఖజానాలు’ సహజమైన తెలుగు పదం; మూలపదంలోని భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సంబంధాన్ని స్పష్టంగా చూపుతూ పరిపాలనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం.
