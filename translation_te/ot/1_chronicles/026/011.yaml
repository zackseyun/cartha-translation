translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావాన్ని నిలుపుతూ సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. హీబ్రూ వాక్యంలోని మొత్తం సంఖ్యను తెలుగులో సహజంగా తెలియజేయడానికి ‘అందరూ కలిపి’ మరియు వ్యక్తుల లెక్కకు ‘మంది’ ఉపయోగించాం. పాదటిప్పణి గుర్తును సందిగ్ధత ఉన్న ‘సహోదరులు’ పదానికే జతచేశాం.
