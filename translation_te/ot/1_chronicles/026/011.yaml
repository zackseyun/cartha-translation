source:
  edition: WLC
  text: חִלְקִיָּ֤הוּ הַ/שֵּׁנִי֙ טְבַלְיָ֣הוּ הַ/שְּׁלִשִׁ֔י זְכַרְיָ֖הוּ הָ/רְבִעִ֑י כָּל בָּנִ֧ים וְ/אַחִ֛ים לְ/חֹסָ֖ה שְׁלֹשָׁ֥ה עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/011.yaml
  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: te
  text: హిల్కీయా రెండవవాడు, టెబల్యా మూడవవాడు, జెకర్యా నాలుగవవాడు. హోసాకు చెందిన కుమారులు, సహోదరులు[a] అందరూ కలిపి పదమూడు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పురుష బంధువులు”; ఇక్కడ “సహోదరులు” అనే పదం హోసా వంశంలోని సమీప పురుష బంధువులను విస్తృతంగా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: హిల్కీయా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సాధారణ బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַשֵּׁנִי
  choice: రెండవవాడు
  rationale: జాబితాలోని క్రమాన్ని సూచించే నిర్దిష్ట క్రమసంఖ్య; వ్యక్తిని సూచిస్తున్నందున తెలుగులో సహజమైన పుంలింగ రూపం వాడాం.
- source_word: טְבַלְיָהוּ
  choice: టెబల్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సంక్షిప్తమైన, సహజమైన బైబిలు నామరూపంగా లిప్యంతరీకరించాం.
- source_word: הַשְּׁלִשִׁי
  choice: మూడవవాడు
  rationale: చుట్టుపక్కల పేర్లతో సమాంతరంగా జాబితా క్రమాన్ని స్పష్టంగా తెలిపే రూపం.
- source_word: זְכַרְיָהוּ
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన బైబిలు నామరూపం.
- source_word: הָרְבִעִי
  choice: నాలుగవవాడు
  rationale: జాబితాలో నాలుగవ స్థానాన్ని సూచించే క్రమసంఖ్యను సహజమైన తెలుగులో ఇచ్చాం.
- source_word: כָּל
  choice: అందరూ కలిపి
  rationale: తరువాత వచ్చే మొత్తం సంఖ్యతో కలిసి, పేర్కొన్న సమూహం యొక్క సమగ్ర సంఖ్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בָּנִים
  choice: కుమారులు
  rationale: హీబ్రూ పదం లింగనిర్దిష్టంగా కుమారులను సూచిస్తుంది; వంశావళి సందర్భంలో అదే నిర్దిష్టతను నిలిపాం.
- source_word: וְאַחִים
  choice: సహోదరులు
  rationale: ప్రధాన అర్థమైన పురుష సహోదరులను నిలిపాం; వంశ/కుల జాబితాలో విస్తృత పురుష బంధుత్వ అర్థం సాధ్యమని పాదటిప్పణిలో తెలిపాం.
- source_word: לְחֹסָה
  choice: హోసాకు చెందిన
  rationale: లామెద్ ఉపసర్గ ఇక్కడ సంబంధం లేదా చెందిన భావాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం స్పష్టంగా, సహజంగా ఉంది.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: పదమూడు మంది
  rationale: వ్యక్తుల మొత్తాన్ని సూచిస్తున్నందున సంఖ్యకు ‘మంది’ చేర్చి సహజమైన తెలుగు వాక్యాన్ని నిర్మించాం.
