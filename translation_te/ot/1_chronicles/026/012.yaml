source:
  edition: WLC
  text: לְ֠/אֵלֶּה מַחְלְק֨וֹת הַ/שֹּֽׁעֲרִ֜ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִשְׁמָר֖וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֑ם לְ/שָׁרֵ֖ת בְּ/בֵ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: te
  text: ఈ ద్వారపాలకుల విభాగాలకు చెందిన ప్రముఖులైన పురుషులకు తమ సహోదరులతోపాటు యెహోవా మందిరంలో సేవ చేయడానికి కాపలా విధులు ఉండేవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ద్వారపాలకుల విభాగాలు ప్రముఖులైన పురుషులవి; తమ సహోదరులతోపాటు యెహోవా మందిరంలో సేవ చేయడానికి వారికి కాపలా వంతులు ఉండేవి.” హెబ్రీ వాక్యం సంక్షిప్తంగా ఉంది; מִשְׁמָרוֹת అనే పదానికి “కాపలా వంతులు,” “విధులు,” లేదా “సేవా నియామకాలు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת הַשֹּׁעֲרִים
  choice: ద్వారపాలకుల ఈ విభాగాల్లోని
  rationale: లְאֵלֶּה అనే సంబంధ సూచనను తరువాతి పరిపాలనా అమరికతో కలిపి, ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించాం; מַחְלְקוֹתను ఆలయ సేవలోని వ్యవస్థీకృత ‘విభాగాలు’గా, הַשֹּׁעֲרִיםను ‘ద్వారపాలకులు’గా అందించాం.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: ప్రధాన పురుషులకు
  rationale: רָאשֵׁיలోని నాయకత్వ భావాన్ని ‘ప్రధాన’ అని, చారిత్రక సందర్భంలోని పురుష ఆలయ సిబ్బందిని సూచించే הַגְּבָרִיםను ‘పురుషులు’ అని నిలిపాం; సైనిక అర్థాన్ని అనవసరంగా చేర్చలేదు.
- source_word: מִשְׁמָרוֹת
  choice: కాపలా విధులు
  rationale: ఈ నామవాచకం కాపలా వంతులు, విధులు లేదా సేవా నియామకాలను సూచించగలదు. ద్వారపాలకుల సందర్భంలో ‘కాపలా విధులు’ స్పష్టంగా ఉన్నా, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: తమ సహోదరుల విధులకు సమానమైన
  rationale: לְעֻמַּתలోని సమాంతరత లేదా అనురూపతను ‘సమానమైన’ అని తెలిపి, אֲחֵיהֶם యొక్క బంధుత్వ పదాన్ని ‘సహోదరులు’గా నిలిపాం.
- source_word: לְשָׁרֵת
  choice: సేవ చేయాలి
  rationale: ఆలయ సంబంధ సందర్భంలో שׁרת పవిత్ర సేవను సూచిస్తుంది. తెలుగు ‘సేవ చేయాలి’ ఉద్దేశం మరియు బాధ్యత రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: בֵּית యొక్క అక్షరార్థం ‘ఇల్లు’ అయినా, ఇక్కడ ఆలయాన్ని సూచిస్తుంది; ‘మందిరం’ ఆధునిక తెలుగులో సహజమైన పవిత్ర స్థల పదం. יְהוָהను వ్యక్తిగత దైవనామమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘యెహోవా’ రూపంలో దైవనామాన్ని నిలిపాం.
- issue: הַגְּבָרִיםలోని పురుషలింగ సూచన
  choice: పురుషులు
  alternative: వ్యక్తులు / నాయకులు
  rationale: ఈ చారిత్రక సందర్భం పురుష ఆలయ సిబ్బందిని సూచిస్తుంది; అందువల్ల మూలంలోని పురుషలింగ నిర్దిష్టతను తటస్థీకరించకుండా నిలిపాం.
- issue: హెబ్రీ వాక్యంలోని క్రియారహిత సంక్షిప్త నిర్మాణం
  choice: విధులు ఉండేవి
  alternative: విధులు నియమించబడ్డాయి
  rationale: మూలంలో స్పష్టమైన పరిమిత క్రియ లేదు. ‘ఉండేవి’ అని కనిష్ఠంగా పూరించడం తెలుగులో వాక్యాన్ని పూర్తి చేస్తుంది; ఎవరు నియమించారనే వివరాన్ని మూలంలో లేనందున చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణాన్ని వాడాం. మూలంలోని సంక్షిప్తత వల్ల అవసరమైనంత మాత్రాన ‘ఉండేవి’ అనే క్రియను పూరించాం; నియామకర్తను ఊహించి చేర్చలేదు. ఆలయ పరిపాలనా సందర్భం స్పష్టంగా ఉండేందుకు ‘విభాగాలు,’ ‘ద్వారపాలకులు,’ ‘కాపలా విధులు’ అనే సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం.
