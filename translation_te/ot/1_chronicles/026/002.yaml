  text: וְ/לִ/מְשֶֽׁלֶמְיָ֖הוּ בָּנִ֑ים זְכַרְיָ֤הוּ הַ/בְּכוֹר֙ יְדִֽיעֲאֵ֣ל הַ/שֵּׁנִ֔י זְבַדְיָ֨הוּ֙ הַ/שְּׁלִישִׁ֔י יַתְנִיאֵ֖ל הָ/רְבִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: te
  text: 'మరియు షెలెమ్యాకు[a] కుమారులు ఉన్నారు: మొదటిపుట్టినవాడు జెకర్యా, రెండవవాడు యెదీయేలు, మూడవవాడు జెబద్యా, నాలుగవవాడు యత్నీయేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా, ‘షెలెమ్యాకు—కుమారులు’ అని ఉంది; ఇది అతనికి కుమారులు ఉన్నారని తెలిపే వంశావళి ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: షెలెమ్యాకు కుమారులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘షెలెమ్యాకు—కుమారులు’ అనే క్రియలేని వంశావళి నిర్మాణం ఉంది. తెలుగు భాషలో ‘షెలెమ్యాకు కుమారులు’ సహజంగా ఉండటంతో, మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలిపాం.
- source_word: זְכַרְיָהוּ
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సాధారణంగా గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: הַבְּכוֹר
  choice: మొదటిపుట్టినవాడు
  rationale: ఇది కేవలం వయస్సులో పెద్దవాడని కాక, కుటుంబంలోని మొదటి సంతానమైన కుమారుణ్ణి సూచిస్తుంది.
- source_word: יְדִיעֲאֵל
  choice: యెదీయేలు
  rationale: హీబ్రూ ధ్వనులకు సమీపంగా, తెలుగులో పలకడానికి సహజమైన లిప్యంతరీకరణ.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי / הָרְבִיעִי
  choice: రెండవవాడు / మూడవవాడు / నాలుగవవాడు
  rationale: కుమారుల జన్మక్రమాన్ని తెలిపే క్రమసంఖ్యలను నేరుగా, ఏకరీతిగా అనువదించాం.
- source_word: זְבַדְיָהוּ
  choice: జెబద్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: יַתְנִיאֵל
  choice: యత్నీయేలు
  rationale: పేరులోని మొదటి హీబ్రూ యోద్ ధ్వనిని ‘య’గా నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
