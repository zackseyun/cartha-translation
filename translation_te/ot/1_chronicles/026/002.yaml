translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. వ్యక్తినామాలను హీబ్రూ ధ్వనులకు వీలైనంత దగ్గరగా లిప్యంతరీకరించాం; ప్రతి కుమారుని క్రమాన్ని స్పష్టంగా ఉంచాం.
