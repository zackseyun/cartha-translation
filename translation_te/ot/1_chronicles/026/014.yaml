translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘వంతు పడింది/వచ్చింది’ ద్వారా చీటి ఫలితాన్ని సహజంగా వ్యక్తపరిచాం; వ్యక్తినామాలను హీబ్రూ రూపాలకు దగ్గరగా ఉంచాం.
