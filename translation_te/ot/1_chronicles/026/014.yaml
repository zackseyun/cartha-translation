id: 1CH.26.14
reference: 1 Chronicles 26:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפֹּ֧ל הַ/גּוֹרָ֛ל מִזְרָ֖חָ/ה לְ/שֶֽׁלֶמְיָ֑הוּ וּ/זְכַרְיָ֨הוּ בְנ֜/וֹ יוֹעֵ֣ץ בְּ/שֶׂ֗כֶל הִפִּ֨ילוּ֙ גּֽוֹרָל֔וֹת וַ/יֵּצֵ֥א גוֹרָל֖/וֹ צָפֽוֹנָ/ה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: te
  text: తూర్పు వైపు వంతు షెలెమ్యాహుకు పడింది. వివేకంతో సలహా ఇచ్చే అతని కుమారుడు జెకర్యాహు[a] కోసం వారు చీట్లు వేశారు; అతని వంతు ఉత్తరం వైపు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వివేకవంతుడైన సలహాదారు.” హీబ్రూ పదబంధం అక్షరార్థంగా జెకర్యాహును “వివేకంతో సలహా ఇచ్చేవాడు” అని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: వంతు ... పడింది
  rationale: נפל + גורל అనే హీబ్రూ జాతీయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, చీటి ద్వారా వచ్చిన నియామకాన్ని సూచిస్తుంది.
- source_word: מִזְרָחָה
  choice: తూర్పు వైపు
  rationale: దిశను సూచించే -ה రూపాన్ని కాపాడుతూ, ద్వార నియామక సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: షెలెమ్యాహుకు
  rationale: לְ స్వీకర్తను సూచిస్తుంది; పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: అతని కుమారుడు జెకర్యాహు కోసం
  rationale: తండ్రి-కుమార సంబంధాన్ని స్పష్టంగా చూపిస్తూ, తదుపరి చీటి జెకర్యాహుకు సంబంధించినదని తెలుపుతుంది.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: వివేకంతో సలహా ఇచ్చే
  rationale: יוֹעֵץ అనే క్రియార్థక రూపాన్నీ, בְשֶׂכֶל లోని వివేకం/విచక్షణ భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: చీట్లు వేశారు
  rationale: చీట్లు వేసి నిర్ణయించే చర్యకు ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: అతని వంతు ... వచ్చింది
  rationale: יצא + גורל లో ఫలితం వెలువడిన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ముందున్న ‘పడింది’ అనే వేరొక హీబ్రూ క్రియతో భేదాన్ని ఉంచుతుంది.
- source_word: צָפוֹנָה
  choice: ఉత్తరం వైపు
  rationale: దిశార్థక -ה ను ప్రతిబింబిస్తూ, తూర్పు వైపు అనే ముందరి పదబంధంతో సమాంతరంగా ఉంది.
