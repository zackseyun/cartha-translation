id: 1CH.26.26
reference: 1 Chronicles 26:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: te
  text: షెలోమోత్ మరియు అతని సహోదరులు రాజైన దావీదు, పితృవంశాల పెద్దలు[a], వేలమందికీ వందలమందికీ అధిపతులు[b], సైన్యాధిపతులు అంకితం చేసిన పరిశుద్ధ వస్తువుల ఖజానాలన్నిటికి పర్యవేక్షకులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం “పితరుల పెద్దలు”; ఇది పితృవంశాల ఆధారంగా ఏర్పడిన పరిపాలనా విభాగాల నాయకులను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: “వేలమంది,” “వందలమంది” అనేవి సైనిక లేదా పరిపాలనా విభాగాలను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו עַל
  choice: షెలోమోతు, అతని సహోదరులు ... పర్యవేక్షణలో ఉన్నారు
  rationale: హీబ్రూలో వాక్యం ఏకవచన సర్వనామంతో మొదలైనా, షెలోమోతుతో పాటు అతని సహోదరులు కలిసిన కర్తగా ఉన్నారు. పరిపాలనా సందర్భంలోని עַל భావాన్ని సహజమైన తెలుగు బహువచన నిర్మాణంతో అందించాం.
- source_word: כָּל אֹצְרוֹת הַקֳּדָשִׁים
  choice: పరిశుద్ధ వస్తువుల ఖజానాలన్నిటి
  rationale: אֹצָר ఆలయ పరిపాలనా సందర్భంలో ధనం లేదా వస్తువులు భద్రపరిచే ఖజానాను సూచిస్తుంది; הַקֳּדָשִׁים ప్రతిష్ఠితమైన పరిశుద్ధ వస్తువులను సూచిస్తుంది.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: ఆ వస్తువులను ... ప్రతిష్ఠించారు
  rationale: קדשׁ హిఫీల్ రూపం దేవునికి ప్రత్యేకంగా అంకితం చేయడం లేదా ప్రతిష్ఠించడం అనే భావాన్ని ఇస్తుంది. దీర్ఘ సంబంధవాచక నిర్మాణాన్ని రెండు వాక్యాలుగా విభజించడం తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: రాజైన దావీదు
  rationale: హీబ్రూ బిరుదు మరియు పేరును సహజమైన, గౌరవప్రదమైన తెలుగు క్రమంలో అందిస్తుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలు
  rationale: ఇది వంశాధారిత పరిపాలనా నాయకులను సూచించే దినవృత్తాంతాల సాంకేతిక పదబంధం; కేవలం కుటుంబ పెద్దలు అని పరిమితం చేయకుండా వంశ భావాన్ని నిలిపాం.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: వేలమందికి మరియు వందలమందికి అధిపతులు
  rationale: సైనిక-పరిపాలనా విభాగాలపై అధికారులను సూచించే హీబ్రూ నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שָׂרֵי הַצָּבָא
  choice: సైన్యాధిపతులు
  rationale: ఇక్కడ צָבָא మానవ సైన్యాన్ని సూచిస్తుంది; సంక్షిప్తమైన ఆధునిక తెలుగు పదం సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: పరిశుద్ధ వస్తువులను ప్రతిష్ఠించినవారి పరిధి
  choice: దావీదు మొదలుకొని జాబితాలోని అన్ని వర్గాలూ ప్రతిష్ఠించినవారిగా అనువదించాం.
  alternative: దావీదు మాత్రమే ప్రతిష్ఠించాడనీ, తరువాతివారు పరోక్షంగా సంబంధించారనీ గ్రహించడం.
  rationale: హీబ్రూలో పునరావృతమైన וְ సంధులు దావీదు, పితృవంశాల పెద్దలు, విభాగాధిపతులు, సైన్యాధిపతులు అనే సమన్విత కర్తల జాబితాను సహజంగా సూచిస్తున్నాయి; మూలంలోని క్రియ ఏకవచనంలో ఉన్నప్పటికీ అది జాబితా ప్రారంభ కర్తతో అన్వయించిన రూపం కావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ సంబంధవాచక వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం; మూలంలోని పరిపాలనా మరియు వంశ సంబంధ పదజాలాన్ని సాధ్యమైనంతవరకు నిలిపాం.
