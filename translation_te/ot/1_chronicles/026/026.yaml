revisions:
- from: షెలోమోతు, అతని సహోదరులు పరిశుద్ధ వస్తువుల ఖజానాలన్నిటి పర్యవేక్షణలో ఉన్నారు. ఆ వస్తువులను రాజైన దావీదు, పితృవంశాల పెద్దలు[a], వేలమందికి మరియు వందలమందికి అధిపతులు[b], సైన్యాధిపతులు ప్రతిష్ఠించారు.
  to: షెలోమోత్ మరియు అతని సహోదరులు రాజైన దావీదు, పితృవంశాల పెద్దలు[a], వేలమందికీ వందలమందికీ అధిపతులు[b], సైన్యాధిపతులు అంకితం చేసిన పరిశుద్ధ వస్తువుల ఖజానాలన్నిటికి పర్యవేక్షకులుగా ఉన్నారు.
  rationale: 'The revision preserves the Hebrew syntax and scope: Shelomoth and his brothers oversee all the treasuries, while the sacred items stored there were dedicated by every group in the coordinated list. It improves name transliteration, renders dedication more precisely, and uses idiomatic modern Telugu without adding interpretation.'
