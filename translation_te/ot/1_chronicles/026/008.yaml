source:
  edition: WLC
  text: כָּל אֵ֜לֶּה מִ/בְּנֵ֣י עֹבֵ֣ד אֱדֹ֗ם הֵ֤מָּה וּ/בְנֵי/הֶם֙ וַ/אֲחֵי/הֶ֔ם אִֽישׁ חַ֥יִל בַּ/כֹּ֖חַ לַ/עֲבֹדָ֑ה שִׁשִּׁ֥ים וּ/שְׁנַ֖יִם לְ/עֹבֵ֥ד אֱדֹֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: te
  text: వీరందరూ ఓబేదెదోము కుమారులలోనివారు. వీరు, వారి కుమారులు, వారి సహోదరులు[a] సేవ కోసం బలమున్న సమర్థులైన పురుషులు[b]. ఓబేదెదోముకు చెందినవారు మొత్తం అరవై ఇద్దరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి వంశబంధువులు.’ ఇక్కడ ‘సహోదరులు’గా అనువదించిన హీబ్రూ పదం ఒకే వంశంలోని ఇతర పురుష బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సమర్థులైన పురుషులు’గా అనువదించిన హీబ్రూ మాటకు ‘పరాక్రమవంతులు’ లేదా ‘శూరులు’ అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ సేవకు తగిన సామర్థ్యం, బలం ప్రధానంగా ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: ఓబేదెదోము కుమారుల వంశానికి చెందినవారు
  rationale: מִן సమూహ లేదా వంశ సంబంధాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘కుమారులలోనివారు’ అనడం కంటే ‘కుమారుల వంశానికి చెందినవారు’ అనేది సందర్భంలోని కుటుంబ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: వీరు, వీరి కుమారులు, వీరి సహోదరులు
  rationale: మూలంలోని మూడు వర్గాలను అలాగే నిలుపుతుంది. אחים యొక్క ప్రాథమిక అర్థమైన ‘సహోదరులు’ను ప్రధాన పాఠ్యంలో ఉంచి, విస్తృత వంశబంధువుల అర్థాన్ని పాదసూచికలో సూచించాం.
- source_word: אִישׁ חַיִל בַּכֹּחַ
  choice: బలంగల సమర్థులైన పురుషులు
  rationale: חיל ఇక్కడ యుద్ధశౌర్యానికే పరిమితం కాకుండా సామర్థ్యాన్ని సూచించగలదు; בַּכֹּחַ బలాన్ని స్పష్టంగా జోడిస్తుంది. ఆలయసేవ సందర్భానికి తగినట్లుగా ఈ రెండు భావాలనూ నిలుపుతుంది.
- source_word: לַעֲבֹדָה
  choice: సేవ చేయడానికి
  rationale: עֲבֹדָה పని లేదా నియమిత సేవను సూచిస్తుంది. ఈ సందర్భంలో ద్వారపాలకుల సేవ ఉద్దేశించబడినందున ‘సేవ చేయడానికి’ సహజమైనదీ, అతిగా నిర్దిష్టం కానిదీ.
- source_word: שִׁשִּׁים וּשְׁנַיִם
  choice: అరవై ఇద్దరు
  rationale: పురుషుల సంఖ్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְעֹבֵד אֱדֹם
  choice: ఓబేదెదోముకు చెందిన
  rationale: చివరి לְ ఓబేదెదోముతో కుటుంబ లేదా సమూహ సంబంధాన్ని తెలియజేస్తూ మొత్తాన్ని సంక్షిప్తంగా సూచిస్తుంది.
