translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని వంశసంబంధం, పురుషవాచక సూచన, సామర్థ్యం మరియు బలం అనే రెండు భావాలను నిలిపి, సైనిక అర్థాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా రుద్దలేదు.
