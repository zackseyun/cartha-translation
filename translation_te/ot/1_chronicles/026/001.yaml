  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/מַחְלְק֖וֹת לְ/שֹׁעֲרִ֑ים לַ/קָּרְחִ֕ים מְשֶֽׁלֶמְיָ֥הוּ בֶן קֹרֵ֖א מִן בְּנֵ֥י אָסָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: te
  text: ద్వారపాలకుల విభాగాలు:[a] కోరహీయులలో ఆసాఫు కుమారుల వంశానికి చెందిన కోరే కుమారుడు మెషెలెమ్యా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్వారపాలకుల విభాగాలకు సంబంధించి.” ఈ ప్రారంభ పదబంధం ద్వారపాలకుల విభాగాలను పరిచయం చేసే శీర్షికలా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: ద్వారపాలకుల విభాగాల విషయానికి వస్తే
  rationale: ప్రారంభంలోని לְ ఉపసర్గ ఈ విభాగపు అంశాన్ని పరిచయం చేస్తోంది; מַחְלְקוֹת అనేది విధులు కేటాయించబడిన విభాగాలు లేదా వంతులను సూచిస్తుంది. తెలుగులో ఇది శీర్షికలాంటి ప్రారంభంగా సహజంగా వినిపిస్తుంది.
- source_word: לַקָּרְחִים
  choice: కోరహీయులలో
  rationale: ఇది కోరహు వంశానికి చెందిన ఉపవర్గాన్ని సూచిస్తుంది. జాబితా నిర్మాణంలో ‘కోరహీయులలో’ అనే రూపం సహజంగా ఉంటుంది.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: మెషెలెమ్యా
  rationale: ఈ వచనంలోని హీబ్రూ నామరూపాన్ని అనుసరించిన లిప్యంతరీకరణ.
- source_word: בֶן קֹרֵא
  choice: కోరే కుమారుడు
  rationale: ఇక్కడ בֶן సమీప వంశసంబంధాన్ని నేరుగా తెలియజేస్తున్నందున ‘కుమారుడు’ అని అనువదించబడింది.
- source_word: מִן בְּנֵי אָסָף
  choice: ఆసాఫు కుమారుల వంశానికి చెందిన
  rationale: מִן ఒక పెద్ద కుటుంబ సమూహంలోనుండి వచ్చినవాడని లేదా దానికి చెందినవాడని సూచిస్తుంది. ఆధునిక తెలుగులో వంశసంబంధాన్ని స్పష్టంగా చెప్పుతూ మూలంలోని భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనంలోని ‘ఆసాఫు’ ఎవరు అనే గుర్తింపు
  choice: ఆసాఫు అనే పేరును మాత్రమే ఉంచి, అతని గుర్తింపును వివరించలేదు
  alternative: ప్రసిద్ధ లేవీయ గాయకుడైన ఆసాఫుతో ఇతన్ని సమీకరించడం లేదా వేరొక పేరుగా సవరించడం
  rationale: హీబ్రూ పాఠంలో אָסָף అని ఉంది. ఈ ఒక్క వచనం ఆధారంగా గుర్తింపును నిర్ధారించడం లేదా పాఠాన్ని సవరించడం మూలంలోని సాధ్యమైన సందిగ్ధతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. ‘ద్వారపాలకులు,’ ‘విభాగాలు’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి; పేర్లు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
