  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: te
  text: అమ్రామీయుల విషయమై[a], ఇస్హారీయుల విషయమై, హెబ్రోనీయుల విషయమై, ఉజ్జీయేలీయుల విషయమై.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమ్రామీయులకు, ఇస్హారీయులకు, హెబ్రోనీయులకు, ఉజ్జీయేలీయులకు.” హెబ్రూ వచనంలో ל ఉపసర్గతో కూడిన నాలుగు వంశనామాలు మాత్రమే ఉన్నాయి; అవి జాబితా శీర్షికగా పనిచేస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: అమ్రామీయులకు
  rationale: ל ఉపసర్గతో కూడిన వంశనామం పరిపాలనా జాబితాకు శీర్షికవలె పనిచేస్తోంది. తెలుగులో దత్తివిభక్తి రూపం మూలంలోని నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיִּצְהָרִי
  choice: ఇస్హారీయులకు
  rationale: ఇస్హారు వంశానికి చెందినవారిని సూచించే వంశనామం. జాబితాలోని సమాంతర నిర్మాణాన్ని నిలుపుటకు దత్తివిభక్తి వాడబడింది.
- source_word: לַחֶבְרוֹנִי
  choice: హెబ్రోనీయులకు
  rationale: హెబ్రోను వంశస్థులను సూచించే వంశనామం. ఇతర వంశనామాలతో ఏకరీతిగా లిప్యంతరీకరణ ఆధారిత రూపం వాడబడింది.
- source_word: לָעָזִּיאֵלִי
  choice: ఉజ్జీయేలీయులకు
  rationale: ఉజ్జీయేలు వంశస్థులను సూచించే చివరి వంశనామం. మూలంలో ప్రతి పదానికీ ఉన్న ל ఉపసర్గను ప్రతిబింబించేందుకు ఇదీ దత్తివిభక్తిలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా-శీర్షిక శైలిని పాటించాం. మూలంలోని నాలుగు సమాంతర వంశనామాలకూ దత్తివిభక్తిని నిలిపి, అంతర్లీన క్రియను చేర్చి అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
