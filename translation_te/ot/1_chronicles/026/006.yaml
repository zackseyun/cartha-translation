id: 1CH.26.6
reference: 1 Chronicles 26:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: te
  text: అతని కుమారుడైన షెమయాకు కూడా కుమారులు పుట్టారు. వారు తమ పితృవంశ గృహంపై అధికారం చెలాయించారు, ఎందుకంటే వారు బలవంతులైన పరాక్రమశాలులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బలవంతులైన పరాక్రమశాలులు” అనే హీబ్రూ పదబంధం యుద్ధవీరులను మాత్రమే కాకుండా, నిరూపితమైన బలం, సామర్థ్యం లేదా ప్రతిష్ఠ గలవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: అతని కుమారుడైన షెమయాకు
  rationale: జాబితాను కొనసాగించే וְను తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సహజంగా వ్యక్తం చేశాం. לְతో కూడిన జనన సూత్రాన్ని ‘షెమయాకు ... పుట్టారు’గా, בְנוֹను ముందున్న ఓబేదెదోమును సూచించే ‘అతని కుమారుడైన’గా అనువదించాం.
- source_word: נוֹלַד בָּנִים
  choice: కుమారులు పుట్టారు
  rationale: נוֹלַד రూపరీత్యా ఏకవచనమైనా, బహువచన కర్త בָּנִיםతో ఉన్న జనన ప్రకటనను సహజమైన తెలుగు బహువచన క్రియతో ఇచ్చాం; ‘కుమారులు’ అనే లింగనిర్దిష్ట పదాన్ని నిలిపాం.
- source_word: הַמִּמְשָׁלִים
  choice: అధికారం చెలాయించారు
  rationale: משׁל ఇక్కడ పాలించడం లేదా అధికారం నిర్వహించడం అనే భావం ఇస్తుంది. కేవలం హోదాను సూచించే ‘అధిపతులు’ కంటే క్రియాత్మక భావాన్ని ఇది కాపాడుతుంది.
- source_word: לְבֵית אֲבִיהֶם
  choice: తమ పితృవంశ గృహంపై
  rationale: בֵית אָב అనేది భౌతిక ఇంటికంటే పితృవంశ కుటుంబ లేదా వంశగృహ విభాగాన్ని సూచించే స్థిర ప్రయోగం. మూలంలోని ఏకవచన ‘గృహం’ను నిలుపుతూ సామాజిక భావాన్ని స్పష్టం చేశాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు అధికారం చెలాయించడానికి గల కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: גִּבּוֹרֵי חַיִל
  choice: బలపరాక్రమాలు గలవారు
  rationale: ఈ స్థిరపదబంధంలో బలం, శౌర్యం, సమర్థత, ప్రతిష్ఠ వంటి భావాలు ఉండవచ్చు. సందర్భం పరిపాలనా/వంశావళి సంబంధమైనందున దాన్ని కేవలం యుద్ధవీరులుగా పరిమితం చేయకుండా విస్తృతమైన బలపరాక్రమ భావంతో అనువదించాం.
- source_word: הֵמָּה
  choice: వారు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజ తెలుగు వాక్యంలో ‘వారు’ అనే స్పష్టమైన కర్తతో ప్రతిబింబించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వంశావళి శైలి. ‘పితృవంశ గృహం’ ద్వారా పురాతన కుటుంబ-వంశ విభాగ భావాన్ని భౌతిక ఇంటితో గందరగోళం కాకుండా వ్యక్తం చేశాం. మూలంలో లేని పాదసూచికను బְנוֹ వద్ద చేర్చలేదు; [a] గుర్తు గిబ్బోరే ఖయిల్ పదబంధంలోని నిజమైన భావవిస్తృతిని వివరిస్తుంది.
