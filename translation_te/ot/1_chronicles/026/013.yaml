revisions:
- from: వారు చిన్నవారికీ పెద్దవారికీ ఒకే విధంగా, తమ తమ పితృకుటుంబాల ప్రకారం, ఒక్కో ద్వారానికి చీట్లు వేశారు.[a]
  to: వారు చిన్నవారైనా పెద్దవారైనా సమానంగా, తమ తమ పితృకుటుంబాల ప్రకారం, ఒక్కో ద్వారానికి చీట్లు వేశారు.[a]
  rationale: The revision only clarifies that ‘small and great alike’ refers to persons included without distinction, rather than to persons for whom lots were cast. It preserves the source order and all other lexical decisions, including the distributive ‘each gate’ sense.
