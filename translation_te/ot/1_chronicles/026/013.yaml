source:
  edition: WLC
  text: וַ/יַּפִּ֨ילוּ גוֹרָל֜וֹת כַּ/קָּטֹ֧ן כַּ/גָּד֛וֹל לְ/בֵ֥ית אֲבוֹתָ֖/ם לְ/שַׁ֥עַר וָ/שָֽׁעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/013.yaml
  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: te
  text: వారు చిన్నవారైనా పెద్దవారైనా సమానంగా, తమ తమ పితృకుటుంబాల ప్రకారం, ఒక్కో ద్వారానికి చీట్లు వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్వారం ద్వారానికి.” హెబ్రీలో ఏకవచన నామవాచకం పంపిణీ భావాన్ని నొక్కిచెప్పడానికి పునరుక్తమైంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: చీట్లు వేశారు
  rationale: నפל హిఫీల్ రూపం గוֹרָלוֹתతో కలిసి బాధ్యతలను నిర్ణయించడానికి ‘చీట్లు వేయడం’ అనే స్థిరమైన భావాన్ని ఇస్తుంది.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: చిన్నవారికీ పెద్దవారికీ ఒకే విధంగా
  rationale: వయస్సును నిర్దిష్టంగా చేర్చకుండా, స్థాయి లేదా ప్రాముఖ్యతతో సంబంధం లేకుండా అందరూ సమానంగా పాల్గొన్నారనే హెబ్రీయ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְבֵית אֲבוֹתָם
  choice: తమ తమ పితృకుటుంబాల ప్రకారం
  rationale: తండ్రి వంశం ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ విభాగాలను సూచిస్తుంది; ‘తమ తమ’ పంపిణీ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: ఒక్కో ద్వారానికి
  rationale: ఏకవచన నామవాచకపు పునరుక్తి ప్రతి ద్వారానికి విడివిడిగా నియామకం జరిగిందనే పంపిణీ భావాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పితృకుటుంబాలు’ వంశపారంపర్య కుటుంబ విభాగాలను సంక్షిప్తంగా తెలియజేస్తుంది; ‘చిన్నవారు, పెద్దవారు’ అనే మూలభాషా ఉద్వేగాన్ని వయస్సుకు మాత్రమే పరిమితం చేయకుండా నిలుపుతుంది.
