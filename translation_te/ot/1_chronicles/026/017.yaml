source:
  edition: WLC
  text: לַ/מִּזְרָח֮ הַ/לְוִיִּ֣ם שִׁשָּׁה֒ לַ/צָּפ֤וֹנָ/ה לַ/יּוֹם֙ אַרְבָּעָ֔ה לַ/נֶּ֥גְבָּ/ה לַ/יּ֖וֹם אַרְבָּעָ֑ה וְ/לָ/אֲסֻפִּ֖ים שְׁנַ֥יִם שְׁנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: te
  text: తూర్పున లేవీయులు ఆరుగురు; ఉత్తరాన రోజుకు నలుగురు; దక్షిణాన రోజుకు నలుగురు; గిడ్డంగుల దగ్గర[a] ఇద్దరిద్దరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అసుప్పీము’. ఇది సాధారణంగా గిడ్డంగులను కాకుండా, ‘అసుప్పీము’ అనే నిర్దిష్ట స్థలాన్ని లేదా గదుల సముదాయాన్ని సూచించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: తూర్పున
  rationale: దిక్కును సూచించే నామవాచకానికి ఉపసర్గ చేరి, నియామకం జరిగిన వైపును తెలియజేస్తోంది; జాబితా సందర్భంలో ‘తూర్పున’ సహజమైన స్థానార్థక ప్రయోగం.
- source_word: הַלְוִיִּם שִׁשָּׁה
  choice: లేవీయులు ఆరుగురు
  rationale: తూర్పు వైపున నియమించబడిన లేవీయుల సంఖ్యను మూలంలోని సంక్షిప్త నిర్మాణానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: לַצָּפוֹנָה ... לַנֶּגְבָּה
  choice: ఉత్తరాన ... దక్షిణాన
  rationale: సమాంతర దిక్సూచక పదాలను సహజమైన తెలుగు స్థానార్థక రూపాల్లో అందిస్తుంది.
- source_word: לַיּוֹם
  choice: రోజుకు
  rationale: పరిపాలనా నియామక సందర్భంలో ప్రతి రోజూ నియమించవలసిన సంఖ్య అనే పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלָאֲסֻפִּים
  choice: గిడ్డంగుల దగ్గర[a]
  rationale: ఈ పదం నిల్వగదులు లేదా ఆలయ ప్రాంగణంలోని ఒక నిర్దిష్ట గది సముదాయాన్ని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సాధారణ నామవాచక భావాన్ని ఇచ్చి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: ఇద్దరిద్దరు
  rationale: సంఖ్య పునరుక్తి పంపిణీ భావాన్ని, అంటే జంటలుగా నియామకాన్ని, సహజమైన తెలుగులో తెలియజేస్తుంది.
