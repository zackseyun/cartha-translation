translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పరిపాలనా జాబితా శైలిని నిలిపాం. వ్యక్తులను లెక్కిస్తున్నందున ‘ఆరుగురు, నలుగురు, ఇద్దరిద్దరు’ రూపాలను వాడాం. మూలంలో తూర్పు నియామకానికి ‘రోజుకు’ లేదు; అందువల్ల దాన్ని అక్కడ చేర్చలేదు. పాదసూచిక గుర్తును సందేహాస్పదమైన ‘అసుప్పీము’ పదానికి సంబంధించిన ‘గిడ్డంగుల దగ్గర’ వద్ద ఉంచాం.
