  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: te
  text: కోరహీయుల కుమారులకూ మెరారీ కుమారులకూ చెందిన ద్వారపాలకుల విభాగాలు ఇవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “కోరహీయుల కుమారుల కొరకు, మెరారీ కుమారుల కొరకు ద్వారపాలకుల విభాగాలు ఇవి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: హీబ్రూ బహువచన సూచనపదం, ముందు పేర్కొన్న జాబితాను సంగ్రహంగా సూచిస్తుంది. క్రియలేని హీబ్రూ వాక్యానికి తెలుగులో సహజంగా వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: מַחְלְקוֹת
  choice: విభాగాలు
  rationale: ఆలయ సేవలో క్రమబద్ధంగా ఏర్పాటు చేసిన సేవా బృందాలు లేదా వంతులను సూచిస్తుంది; అదనపు భావాన్ని చేర్చకుండా పరిపాలనా అర్థాన్ని నిలుపుతుంది.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకుల
  rationale: ద్వారాల వద్ద కాపలా మరియు పర్యవేక్షణ బాధ్యత నిర్వహించేవారిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לִבְנֵי
  choice: కుమారులకు
  rationale: మూలంలోని ‘కుమారులకు’ అనే వంశపరమైన నిర్మాణాన్ని నిలుపుతుంది; ఇక్కడ అది ఆయా వంశాలకు చెందినవారిని సమూహంగా సూచిస్తుంది.
- source_word: הַקָּרְחִי
  choice: కోరహీయుల
  rationale: కోరహు వంశానికి చెందిన సమూహాన్ని సూచించే వంశనామ రూపం.
- source_word: וְלִבְנֵי מְרָרִי
  choice: మెరారీ కుమారులకు
  rationale: మూలంలోని సమాంతర నిర్మాణమైన ‘మెరారీ కుమారులకు’ అనే పూర్తి పదబంధాన్ని సంక్షిప్తం చేయకుండా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘నియమించబడిన’ అనే పదం לְ ఉపసర్గలోని కేటాయింపు/అనుబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ నిర్మాణం పాదటిప్పణిలో ఇవ్వబడింది.
