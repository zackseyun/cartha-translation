source:
  edition: WLC
  text: מִן הַ/מִּלְחָמ֥וֹת וּ/מִן הַ/שָּׁלָ֖ל הִקְדִּ֑ישׁוּ לְ/חַזֵּ֖ק לְ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: te
  text: యుద్ధాల నుంచీ, కొల్లసొమ్ము నుంచీ వారు వస్తువులను[a] యాహ్వే మందిరాన్ని బలపరచడానికి అంకితం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘అంకితం చేశారు’ అనే క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు; సందర్భస్పష్టత కోసం ఇక్కడ ‘వస్తువులను’ చేర్చబడింది. ‘బలపరచడానికి’ అనే మాటను ‘మద్దతు ఇవ్వడానికి’ లేదా ‘మరమ్మతు చేయడానికి’ అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూలో సూచితమైన కర్మను పారదర్శకంగా తెలియజేయడానికి, అలాగే חזק పదానికి ఉన్న సందర్భానుసార ప్రత్యామ్నాయాలను సూచించడానికి.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: యుద్ధాల నుంచీ
  rationale: מִן మూలాన్ని లేదా దేనిలోనుంచి తీసుకున్నారో సూచిస్తుంది; מִלְחָמוֹת అనే బహువచనానికి ‘యుద్ధాలు’ సహజమైన, విస్తృతమైన సమానం.
- source_word: וּמִן הַשָּׁלָל
  choice: కొల్లసొమ్ము నుంచీ
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులు లేదా సంపదను సూచిస్తుంది; ‘కొల్లసొమ్ము’ ఆధునిక తెలుగులో ఈ సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִקְדִּישׁוּ
  choice: వారు ప్రతిష్ఠించారు
  rationale: קדשׁ హిఫీల్ రూపం పవిత్ర ప్రయోజనం కోసం ప్రత్యేకంగా అంకితం చేయడాన్ని సూచిస్తుంది. హీబ్రూలో కర్మ చెప్పబడలేదు కాబట్టి తెలుగులోనూ దానిని బలవంతంగా చేర్చలేదు.
- source_word: לְחַזֵּק
  choice: దృఢపరచడానికి
  rationale: חזק యొక్క ప్రాథమిక భావమైన బలపరచడం లేదా దృఢం చేయడాన్ని నిలుపుతుంది; మందిర సందర్భంలో మరమ్మతు లేదా నిర్వహణ కూడా భావంలో ఉండవచ్చు.
- source_word: לְבֵית יְהוָה
  choice: యాహ్వే మందిరాన్ని
  rationale: בֵּית יְהוָה అక్షరార్థంగా ‘యాహ్వే గృహం’; ఇక్కడ అది దేవాలయాన్ని సూచిస్తున్నందున సహజమైన తెలుగులో ‘యాహ్వే మందిరం’ అని ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: మందిరాన్ని ‘దృఢపరచడం’ అనే భావం
  choice: దృఢపరచడానికి
  alternative: మరమ్మతు చేయడానికి; నిర్వహించడానికి
  rationale: మూలంలోని חזק విస్తృత భావాన్ని నిలిపి, అది కేవలం ఒక నిర్దిష్ట నిర్మాణపనినే సూచిస్తుందని తీర్మానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా గ్రంథానికి తగిన గౌరవభరిత శైలిలో ఉంది. హీబ్రూలోని రెండు מִן పదబంధాల సమాంతరతను ‘నుంచీ ... నుంచీ’తో నిలిపాం.
