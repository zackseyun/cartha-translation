  to: లేవీయుల విషయానికొస్తే,[a] అహీయా దేవుని మందిరపు ఖజానాలకు, ప్రతిష్ఠిత వస్తువుల[b] ఖజానాలకు బాధ్యుడిగా ఉన్నాడు.
