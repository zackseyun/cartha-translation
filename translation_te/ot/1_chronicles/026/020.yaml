source:
  edition: WLC
  text: וְֽ/הַ/לְוִיִּ֑ם אֲחִיָּ֗ה עַל אֽוֹצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹֽצְר֖וֹת הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: te
  text: లేవీయుల విషయానికొస్తే,[a] అహీయా దేవుని మందిరపు ఖజానాలకు, ప్రతిష్ఠిత వస్తువుల[b] ఖజానాలకు బాధ్యుడిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “లేవీయులు: అహీయా ... బాధ్యుడిగా ఉన్నాడు.” హీబ్రూ వాక్యారంభం కొంత అధ్యాహారంగా ఉండి, శీర్షికలాంటి విషయాంతర సూచనగా పనిచేయవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: “ప్రతిష్ఠిత వస్తువులు” అనే మాటను “పవిత్ర వస్తువులు” లేదా “అంకిత వస్తువులు” అని కూడా అనువదించవచ్చు. ఇవి పవిత్ర వినియోగం కోసం ప్రత్యేకపరచిన వస్తువులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: లేవీయుల విషయానికొస్తే
  rationale: సంయోజకంతో కూడిన ఈ నామవాచక పదబంధం తరువాతి లేవీయుల బాధ్యతలను పరిచయం చేసే విషయాంతర సూచనగా కనిపిస్తుంది. ఏకవచన వ్యక్తిపేరు వెంట రావడం వల్ల దీన్ని సాధారణ బహువచన కర్తగా కాక, శీర్షికలాంటి మార్పుగా సహజ తెలుగులో అందించాం.
- source_word: אֲחִיָּה
  choice: అహీయా
  rationale: హీబ్రూ వ్యక్తిపేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: עַל
  choice: పర్యవేక్షకుడిగా ఉన్నాడు
  rationale: పరిపాలనా సందర్భంలో ఈ పదం అధికారం లేదా బాధ్యతను సూచిస్తుంది. ఆధునిక తెలుగులో పర్యవేక్షణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹצְרוֹת
  choice: ఖజానాలు
  rationale: విలువైన వస్తువులు లేదా నిల్వలు ఉంచే స్థలాలను సూచిస్తుంది. దేవాలయ సందర్భంలో ‘ఖజానాలు’ తగిన సహజ పదం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థంగా ‘దేవుని ఇల్లు’; ఇక్కడ ఆరాధనా మందిరాన్ని సూచిస్తున్నందున సాధారణ పాఠకులకు సహజమైన ‘దేవుని మందిరం’ను ఎంచుకున్నాం.
- source_word: וּלְאֹצְרוֹת
  choice: ప్రతిష్ఠిత వస్తువుల ఖజానాలకూ
  rationale: לְ రెండో ఖజానా పదబంధాన్ని మొదటిదానితో కలిపి, రెండింటినీ అహీయా పర్యవేక్షణ కింద ఉంచుతుంది. తెలుగులో ‘-కూ’ ద్వారా ఆ సమాంతర సంబంధం స్పష్టమవుతుంది.
- source_word: הַקֳּדָשִׁים
  choice: ప్రతిష్ఠిత వస్తువులు
  rationale: పవిత్ర వినియోగం కోసం ప్రత్యేకంగా వేరుచేసిన లేదా అంకితం చేసిన వస్తువులను సూచించే సందర్భార్థాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది; కేవలం నైతిక పవిత్రతను సూచించదు.
