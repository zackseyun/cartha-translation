translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. హీబ్రూ ఆరంభంలోని అధ్యాహార స్వభావాన్ని ప్రధాన పాఠంలో సహజంగా అందించి, ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో నిలిపాం.
