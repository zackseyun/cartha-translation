id: 1CH.26.30
reference: 1 Chronicles 26:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: te
  text: హెబ్రోనీయుల విషయానికి వస్తే, హషబ్యా మరియు అతని సహోదరులు—సమర్థులైన 1,700 మంది—యొర్దాను నదికి పడమటి వైపున[a] ఇశ్రాయేలు పర్యవేక్షణ బాధ్యతపై, యెహోవా పనులన్నిటికీ మరియు రాజు సేవకూ నియమించబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘యొర్దాను అవతల, పడమటి దిశగా’; ఇక్కడ యొర్దాను నదికి పడమటి వైపున ఉన్న ప్రాంతం ఉద్దేశించబడింది.
    reason: మూలంలోని దిశాసూచక పదబంధాన్ని తెలియజేసి, సందర్భానుసారమైన భౌగోళిక అర్థాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: హెబ్రోనీయులలో
  rationale: సందర్భంలో ఇది ఒక్క వ్యక్తిని కాక, హెబ్రోను వంశానికి చెందిన లేవీయుల సమూహాన్ని సూచిస్తుంది.
- source_word: חֲשַׁבְיָהוּ
  choice: హషబ్యా
  rationale: హీబ్రూ వ్యక్తిపేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలంలోని కుటుంబ సంబంధ పదాన్ని నిలుపుతుంది; ఈ వంశసంబంధ సందర్భంలో విస్తృత బంధువులను కూడా సూచించే అవకాశం ఉంది.
- source_word: בְּנֵי חַיִל
  choice: సామర్థ్యంగల ... మంది
  rationale: ఇక్కడ యుద్ధ సందర్భం కాక పరిపాలనా బాధ్యతల సందర్భం ఉన్నందున, బలం లేదా శౌర్యం కంటే యోగ్యత, కార్యసామర్థ్యం ప్రధానంగా వ్యక్తమవుతుంది.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పర్యవేక్షణ బాధ్యతను చేపట్టారు
  rationale: פְּקֻדָּהలోని పర్యవేక్షణ, బాధ్యత, అధికార నియామకం అనే పరిపాలనా భావాలను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: యొర్దానుకు అవతల పడమటి వైపున
  rationale: ‘యొర్దాను అవతల, పడమటి దిశగా’ అనే హీబ్రూ నిర్మాణాన్ని నిలుపుతూ, ఉద్దేశించిన పడమటి ప్రాంతాన్ని స్పష్టపరుస్తుంది.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: యెహోవా పనులన్నిటినీ
  rationale: מְלָאכָה పదంలోని పని, కార్యం, బాధ్యత అనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తపరుస్తుంది.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: రాజు సేవకు సంబంధించిన బాధ్యతలను
  rationale: עֲבֹדָהలోని సేవ లేదా విధి భావాన్ని పరిపాలనా సందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని కేవలం బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు పరిచితమైన దైవనామ రూపాన్ని ఉపయోగించాం.
- issue: ‘యొర్దానుకు అవతల’ అనే దిశాసూచక వాక్యభాగం
  choice: యొర్దానుకు అవతల పడమటి వైపున
  alternative: యొర్దానుకు పడమట
  rationale: సరళీకరించి భౌగోళిక అర్థాన్ని మాత్రమే ఇవ్వకుండా, హీబ్రూలోని ‘అవతల’ అనే దృష్టికోణాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; పాదసూచిక ఉద్దేశించిన ప్రాంతాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పరిపాలనా సందర్భాన్ని స్పష్టపరుస్తూనే మూలంలోని దిశాసూచక నిర్మాణాన్ని, దైవనామాన్ని నిలిపాం.
