    text: హీబ్రూలో అక్షరార్థంగా, ‘యొర్దాను అవతల, పడమటి దిశగా’; ఇక్కడ యొర్దాను నదికి పడమటి వైపున ఉన్న ప్రాంతం ఉద్దేశించబడింది.
    reason: మూలంలోని దిశాసూచక పదబంధాన్ని తెలియజేసి, సందర్భానుసారమైన భౌగోళిక అర్థాన్ని స్పష్టం చేస్తుంది.
