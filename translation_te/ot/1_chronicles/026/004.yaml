source:
  edition: WLC
  text: וּ/לְ/עֹבֵ֥ד אֱדֹ֖ם בָּנִ֑ים שְׁמַֽעְיָ֤ה הַ/בְּכוֹר֙ יְהוֹזָבָ֣ד הַ/שֵּׁנִ֔י יוֹאָ֤ח הַ/שְּׁלִשִׁי֙ וְ/שָׂכָ֣ר הָ/רְבִיעִ֔י וּ/נְתַנְאֵ֖ל הַ/חֲמִישִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: te
  text: 'ఓబేదెదోము కుమారులు వీరు: జ్యేష్ఠుడు షెమయా, రెండోవాడు యెహోజాబాదు, మూడోవాడు యోవాహు, నాలుగోవాడు సాకారు[a], ఐదోవాడు నెతనేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి ‘సాకారు’ అనే పేరు హీబ్రూలో ‘ఇశ్శాఖారు’ అనే పేరుకు భిన్నంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: ఓబేదెదోము కుమారులు వీరు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఓబేదెదోముకు కుమారులు’ అనే క్రియలేని వంశావళి సూత్రం ఉంది. ఆధునిక తెలుగులో జాబితాను సహజంగా పరిచయం చేయడానికి ‘కుమారులు వీరు’ అని వ్యక్తం చేశాం.
- source_word: הַבְּכוֹר
  choice: జ్యేష్ఠుడు
  rationale: ఇది కేవలం వరుసలో మొదటివాడు అనే అర్థమే కాక, కుటుంబంలో మొదట పుట్టిన కుమారుడనే భావాన్ని తెలిపే పదం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: יְהוֹזָבָד
  choice: యెహోజాబాదు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: יוֹאָח
  choice: యోవాహు
  rationale: హీబ్రూ పేరులోని ధ్వనులను తెలుగులో సహజంగా ప్రతిబింబించే రూపం.
- source_word: וְ/שָׂכָר
  choice: సాకారు
  rationale: ఇక్కడి హీబ్రూ రూపం שָׂכָר; ఇది ఇశ్శాఖారు అనే పేరుకు భిన్నమైన వ్యక్తిపేరు. మొదటి హల్లును హీబ్రూ שׂ యొక్క ‘స’ ధ్వనితో చూపించాం.
- source_word: וּ/נְתַנְאֵל
  choice: నెతనేలు
  rationale: గ్రీకు ప్రభావిత ప్రత్యామ్నాయ రూపం కాకుండా హీబ్రూ పేరును నేరుగా అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: הַשֵּׁנִי ... הַשְּׁלִשִׁי ... הָרְבִיעִי ... הַחֲמִישִׁי
  choice: రెండోవాడు ... మూడోవాడు ... నాలుగోవాడు ... ఐదోవాడు
  rationale: కుమారుల జననక్రమాన్ని సూచించే హీబ్రూ క్రమసంఖ్యలను తెలుగులో నేరుగా, సహజంగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. పేర్లను మూల హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం; ‘జ్యేష్ఠుడు’ ద్వారా మొదట పుట్టిన కుమారుడనే కుటుంబ సంబంధ భావాన్ని నిలిపాం.
