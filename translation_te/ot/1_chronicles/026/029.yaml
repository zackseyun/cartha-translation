  text: לַ/יִּצְהָרִ֞י כְּנַנְיָ֣הוּ וּ/בָנָ֗י/ו לַ/מְּלָאכָ֤ה הַ/חִֽיצוֹנָה֙ עַל יִשְׂרָאֵ֔ל לְ/שֹׁטְרִ֖ים וּ/לְ/שֹׁפְטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: te
  text: ఇజ్హారీయుల విషయానికి వస్తే, కెనన్యాహు మరియు అతని కుమారులు ఇశ్రాయేలుపై అధికారులుగాను న్యాయాధిపతులుగాను బయటి పనికి[a] నియమించబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బయటి పని” అనేది కేంద్ర పరిశుద్ధస్థల సేవకు వెలుపల నిర్వహించే విధులను సూచించవచ్చు; బహుశా ఇశ్రాయేలులోని పరిపాలనా, న్యాయ బాధ్యతలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: ఇజ్హారీయులలో
  rationale: లామెద్ ఉపసర్గతో వచ్చిన వంశనామం ఈ జాబితాలో ఒక వర్గాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఇజ్హారీయులలో’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כְּנַנְיָהוּ
  choice: కనన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, తెలుగులో సులభంగా పలికేలా లిప్యంతరీకరించబడింది.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ వంశ/కుటుంబ సందర్భంలో పుంలింగ బహువచనం; అందువల్ల ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: బయటి పనికి
  rationale: పదబంధం నేరుగా ‘బయటి పని’ని సూచిస్తుంది. సందర్భంలో ఇది కేంద్ర పరిశుద్ధస్థల సేవకు వెలుపలి విధులను సూచించవచ్చు; ఆ వివరణను పాదసూచికలో ఉంచి మూలంలోని సంక్షిప్తతను కాపాడాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులపై
  rationale: עַל పరిపాలనా సందర్భంలో పర్యవేక్షణ లేదా అధికార భావాన్ని ఇస్తుంది; ‘పై’ ఆ సంబంధాన్ని నిలుపుతుంది. ప్రజలను ఉద్దేశించినందున తెలుగులో ‘ఇశ్రాయేలీయులపై’ సహజంగా ఉంది.
- source_word: לְשֹׁטְרִים
  choice: అధికారులుగా
  rationale: שֹׁטְרִים ఇక్కడ సైనిక లేదా పోలీసు అర్థం కంటే పరిపాలనా బాధ్యతగల అధికారులను సూచిస్తుంది.
- source_word: וּלְשֹׁפְטִים
  choice: న్యాయాధిపతులుగా
  rationale: שׁפט మూలం నుండి వచ్చిన ఈ రూపం న్యాయనిర్ణయ బాధ్యత నిర్వహించేవారిని నేరుగా సూచిస్తుంది.
