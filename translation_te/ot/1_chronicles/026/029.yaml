  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని బాధ్యతా జాబితా నిర్మాణాన్ని సహజ తెలుగు వాక్యక్రమంలో అందించాం; ‘బయటి పని’ అనే అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుగుణ వివరణను పాదసూచికకు పరిమితం చేశాం.
