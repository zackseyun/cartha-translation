  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שִׁמְעָ֖א אֲחִ֥י דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: te
  text: అతడు ఇశ్రాయేలును దూషించినప్పుడు[a], దావీదు సోదరుడైన షిమ్యా కుమారుడు యోనాతాను అతణ్ణి కొట్టి చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలును ధిక్కరించినప్పుడు.” హీబ్రూ క్రియ అవమానకరంగా దూషించడాన్ని లేదా బహిరంగంగా ధిక్కరించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: దూషించినప్పుడు
  rationale: חרף ఇక్కడ ఇశ్రాయేలును లక్ష్యంగా చేసుకున్న అవమానకరమైన, ధిక్కారపూరితమైన మాటలను సూచిస్తుంది. ‘దూషించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ మాటల తీవ్రతను తెలియజేస్తుంది; ‘సవాలు చేశాడు’ అనే భావం కూడా సందర్భంలో సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచాం.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: హీబ్రూ పాఠంలో ప్రత్యక్ష కర్మగా ఉన్న జాతీయ నామాన్ని అలాగే నిలిపి, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచించేలా అనువదించాం.
- source_word: וַיַּכֵּהוּ
  choice: అతణ్ణి కొట్టి చంపాడు
  rationale: נכה యొక్క ప్రయోగం దెబ్బకొట్టడాన్ని తెలుపుతుంది; ఈ యుద్ధకథన సందర్భంలో అది ప్రాణాంతకమని స్పష్టంగా ఉంది. ‘కొట్టి చంపాడు’ చర్యనూ ఫలితాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן שִׁמְעָא
  choice: షిమ్యా కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ పదబంధాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం; שִׁמְעָא ను ‘షిమ్యా’గా లిప్యంతరీకరించాం.
- source_word: אֲחִי דָוִיד
  choice: దావీదు సోదరుడైన
  rationale: నిర్మాణ పదబంధం అక్షరార్థంగా ‘దావీదు సోదరుడు.’ తెలుగులో యోనాతాను తండ్రి షిమ్యాను విశేషించే సంబంధం స్పష్టంగా ఉండేందుకు ‘దావీదు సోదరుడైన షిమ్యా’ అని అమర్చాం.
