translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యంలోని సంబంధాలను స్పష్టంగా ఉంచుతూ సహజమైన తెలుగు పదక్రమాన్ని అనుసరించాం.
