  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֞ךְ אֶלְחָנָ֣ן בֶּן יעור אֶת לַחְמִי֙ אֲחִי֙ גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: te
  text: ఫిలిష్తీయులతో మళ్లీ యుద్ధం జరిగింది.[a] యాయీరు కుమారుడైన ఎల్హానాను గాతీయుడైన గొల్యాతు సోదరుడైన లహ్మీని హతమార్చాడు. అతని ఈటె దండు నేత మగ్గపు దూలంలా ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 21:19లోని సమాంతర వృత్తాంతంలోని హీబ్రూ పాఠం క్లిష్టమైనది; దానికి ఈ వచనంతో ఉన్న సంబంధం గురించి తరచుగా చర్చ జరుగుతుంది. అయితే దినవృత్తాంతాల పాఠం ఎల్హానాను గొల్యాతు సోదరుడైన లహ్మీని హతమార్చాడని స్పష్టంగా చెబుతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: మళ్లీ యుద్ధం జరిగింది
  rationale: עוֹד ఇక్కడ వరుసగా సంభవించిన మరో యుద్ధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మళ్లీ’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో
  rationale: యుద్ధ సందర్భంలో אֶת ప్రత్యర్థి పక్షాన్ని సూచిస్తుంది; తెలుగులో ‘ఫిలిష్తీయులతో యుద్ధం’ సహజమైన ప్రయోగం.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: נכה కు కొట్టడం/పడగొట్టడం అనే మూలచిత్రం ఉన్నా, ఈ యుద్ధ సందర్భంలో మరణం స్పష్టం; ‘హతమార్చాడు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఫలితాన్ని తెలుపుతుంది.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: యాయీరు కుమారుడైన ఎల్హానాను
  rationale: వంశసంబంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో ఉంచి, పేర్లను హీబ్రూ ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֶת לַחְמִי
  choice: లహ్మీని
  rationale: మసొరా స్వరచిహ్నాల ప్రకారం לַחְמִיని వ్యక్తినామంగా తీసుకున్నాం; אֶתను తెలుగులో కర్మవిభక్తి ‘ని’తో వ్యక్తం చేశాం.
- source_word: אֲחִי גָּלְיָת
  choice: గొల్యాతు సోదరుడు
  rationale: మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; ‘సోదరుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: הַגִּתִּי
  choice: గాతీయుడైన
  rationale: గాతు పట్టణానికి చెందినవాడనే భౌగోళిక గుర్తింపును విశేషణ రూపంలో నిలుపుతుంది.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: లహ్మీ ఈటె కఱ్ఱ
  rationale: అక్షరార్థంగా ‘అతని ఈటె యొక్క కఱ్ఱ/దండు’; తెలుగు పాఠకునికి ఎవరి ఈటె అన్నది స్పష్టంగా ఉండేందుకు సర్వనామం బదులు పేరు పునరుక్తి చేశాం.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: నేతగాని మగ్గపు దోనెవలె
  rationale: מְנוֹר אֹרְגִים అనేది నేయు మగ్గంలోని బరువైన అడ్డదూలాన్ని సూచిస్తుంది; ‘మగ్గపు దోనె’ సంప్రదాయ తెలుగు బైబిలు పరిభాషతో పాటు దాని పరిమాణచిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: 2 సమూయేలు 21:19లోని క్లిష్టమైన సమాంతర పాఠంతో ఈ వచనానికి ఉన్న సంబంధం
  choice: దినవృత్తాంతాల హీబ్రూ పాఠం స్పష్టంగా చెప్పినట్లే, ఎల్హానాను గొల్యాతు సోదరుడైన లహ్మీని హతమార్చాడని అనువదించడం.
  alternative: సమూయేలు సమాంతర పాఠంలోని సమస్యను ఈ వచనంలోకి తెచ్చి, పాఠాన్ని సవరించడం లేదా ‘బేత్లెహేమీయుడు’గా పునర్విభజించడం.
  rationale: ఈ వచనంలోని మసొరా పాఠం లహ్మీని వ్యక్తినామంగా, అతన్ని గొల్యాతు సోదరునిగా స్పష్టంగా పేర్కొంటుంది. సమాంతర పాఠంలోని క్లిష్టతను పాదసూచికలో తెలియజేయడం ద్వారా మూలవచనాన్ని మార్చకుండా పాఠ్య ఉద్రిక్తతను నిజాయితీగా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథనశైలి. ‘ఫిలిష్తీయులు,’ ‘గొల్యాతు,’ ‘మగ్గపు దోనె’ వంటి సుపరిచిత బైబిలు పదజాలాన్ని నిలుపుతూ వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
