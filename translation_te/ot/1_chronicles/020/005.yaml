    issue: The rendering of “weaver’s beam” is archaic and potentially unclear.
    rationale: “మగ్గపు దోనె” is traditional-sounding but is less transparent in modern standard Telugu; “మగ్గపు దూలం” directly expresses the large beam/image intended.
  - severity: low
    issue: “ఈటె కఱ్ఱ” is less idiomatic than “ఈటె దండు.”
    rationale: “దండు” is the natural modern Telugu term for the shaft of a spear and preserves the source's reference to the wooden spear shaft.
