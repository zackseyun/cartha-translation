source:
  edition: WLC
  text: וַ/יְהִ֡י לְ/עֵת֩ תְּשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מְּלָכִ֗ים וַ/יִּנְהַ֣ג יוֹאָב֩ אֶת חֵ֨יל הַ/צָּבָ֜א וַ/יַּשְׁחֵ֣ת אֶת אֶ֣רֶץ בְּנֵֽי עַמּ֗וֹן וַ/יָּבֹא֙ וַ/יָּ֣צַר אֶת רַבָּ֔ה וְ/דָוִ֖יד יֹשֵׁ֣ב בִּ/ירֽוּשָׁלִָ֑ם וַ/יַּ֥ךְ יוֹאָ֛ב אֶת רַבָּ֖ה וַ/יֶּֽהֶרְסֶֽ/הָ׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: te
  text: సంవత్సరం తిరిగివచ్చే కాలంలో[a], రాజులు బయలుదేరే సమయంలో, యోవాబు సైన్యాన్ని నడిపించి అమ్మోనీయుల దేశాన్ని నాశనం చేశాడు. అతడు వచ్చి రబ్బాను ముట్టడించాడు. అయితే దావీదు యెరూషలేములోనే ఉండిపోయాడు. యోవాబు రబ్బాపై దాడిచేసి దాన్ని కూల్చివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే, ‘రాజులు యుద్ధానికి బయలుదేరే వసంతకాలంలో.’ హీబ్రూ మూలంలో అక్షరార్థంగా, ‘సంవత్సరం తిరిగివచ్చే కాలంలో, రాజులు బయలుదేరే సమయంలో’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: సంవత్సరం తిరిగివచ్చే కాలంలో
  rationale: హీబ్రూ నుడికారంలోని సంవత్సరం తిరగడం/తిరిగిరావడం అనే భావాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ‘వసంతకాలంలో’ అనేది సందర్భాధారమైన వివరణ.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: రాజులు బయలుదేరే సమయంలో
  rationale: హీబ్రూలో బయలుదేరే ఉద్దేశం స్పష్టంగా చెప్పబడలేదు; యుద్ధార్థం సందర్భం ద్వారా తెలుస్తుంది కాబట్టి ప్రధాన పాఠంలో అదనంగా చేర్చలేదు.
- source_word: וַיִּנְהַג ... חֵיל הַצָּבָא
  choice: సైన్యాన్ని నడిపించి
  rationale: సైనిక బలగాన్ని ముందుకు నడిపించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దేశాన్ని నాశనం చేశాడు
  rationale: సైనిక దండయాత్ర వల్ల దేశాన్ని పాడుచేయడం లేదా ధ్వంసం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది; ‘అమ్మోనీయులు’ సహజమైన జాతినామం.
- source_word: וַיָּצַר
  choice: ముట్టడించాడు
  rationale: ఒక పట్టణాన్ని చుట్టుముట్టి ముట్టడి చేయడం అనే ప్రామాణిక సైనిక అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: అయితే దావీదు యెరూషలేములోనే ఉండిపోయాడు
  rationale: యోవాబు యుద్ధానికి వెళ్లగా దావీదు అక్కడే నిలిచిన వ్యత్యాసాన్ని, అలాగే హీబ్రూ కృదంతంలోని కొనసాగుతున్న స్థితిని వ్యక్తపరుస్తుంది.
- source_word: וַיַּךְ
  choice: దాడిచేసి
  rationale: ఈ సందర్భంలో నగరాన్ని కొట్టడం/దెబ్బతీయడం అనే విస్తృత క్రియకు సహజమైన సైనిక తెలుగు; తరువాతి క్రియ ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיֶּהֶרְסֶהָ
  choice: దాన్ని కూల్చివేశాడు
  rationale: నగరాన్ని లేదా దాని నిర్మాణాలను పడగొట్టడం, ధ్వంసం చేయడం అనే ప్రత్యేక భావాన్ని ముందటి ‘నాశనం చేశాడు’ నుండి వేరుగా ఉంచుతుంది.
- source_word: רַבָּה
  choice: రబ్బా
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యంతరీకరణలో నిలుపుతుంది.
