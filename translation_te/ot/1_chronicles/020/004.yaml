id: 1CH.20.4
reference: 1 Chronicles 20:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: te
  text: దీని తరువాత గెజెరులో ఫిలిష్తీయులతో యుద్ధం చెలరేగింది. అప్పుడు హూషాతీయుడైన సిబ్బెకై, రెఫాయీయుల[b] సంతతివారిలో ఒకడైన సిప్పైని[a] కొట్టి పడగొట్టాడు; వారు అణచివేయబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును “సఫాయి” అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “రెఫాయీయులు”; సంప్రదాయంగా “దైత్యులు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: హీబ్రూ కథనంలోని కాలక్రమ మార్పును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; వావ్-కన్సిక్యూటివ్ సూత్రాన్ని అనవసరంగా పదేపదే అనుకరించదు.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: యుద్ధం చెలరేగింది
  rationale: עמד అనే క్రియ מלחמהతో కలిసినప్పుడు యుద్ధం మొదలవడం లేదా తలెత్తడం అనే భావం ఇస్తుంది; ‘చెలరేగింది’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּגֶזֶר
  choice: గెజెరులో
  rationale: యుద్ధం జరిగిన స్థలాన్ని సూచిస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: עִם פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో
  rationale: עם అనే ఉపసర్గకు మూలార్థంగా ‘తో’ ఉంది; యుద్ధ సందర్భం విరోధ సంబంధాన్ని స్పష్టంచేస్తుంది కాబట్టి ‘వ్యతిరేకంగా’ అని అదనపు వివరణను చేర్చలేదు.
- source_word: אָז
  choice: అప్పుడు
  rationale: కథనంలోని తరువాతి సంఘటనను సూచించే సహజమైన కాలసూచకం.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టి పడగొట్టడం, సంహరించడం అనే బలమైన భావాన్ని ఇస్తుంది; ఇక్కడ వ్యక్తిపై జరిగిన నిర్ణాయక దెబ్బను ‘హతమార్చాడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: హూషాతీయుడైన సిబ్బెకై
  rationale: వ్యక్తినామం, వంశ/ప్రాంత సూచక నామం రెండింటినీ లిప్యంతరీకరించి, తెలుగు వాక్యనిర్మాణంలో సహజంగా అమర్చింది.
- source_word: סִפַּי
  choice: సిప్పయి
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న రూపాన్ని అనుసరించిన లిప్యంతరీకరణ; ‘సఫాయి’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: מִילִדֵי הָרְפָאִים
  choice: రెఫాయీయుల సంతతివారిలో ఒకడైన
  rationale: ילידי పుట్టినవారు లేదా సంతతివారు అనే భావం ఇస్తుంది. ఏకవచన వ్యక్తి ఆ సమూహానికి చెందినవాడని తెలుగులో స్పష్టంగా, సహజంగా తెలిపింది.
- source_word: וַיִּכָּנֵעוּ
  choice: వారు అణచివేయబడ్డారు
  rationale: כנע నిఫాల్ రూపం యుద్ధ సందర్భంలో లోబడేలా చేయబడడం లేదా అణచివేయబడడం సూచిస్తుంది. ‘వారు’ అనే మూలంలోని సూచనను అలాగే ఉంచి, దాని ఉద్దేశిత సమూహాన్ని అనువాదంలో అదనంగా నిర్ధారించలేదు.
theological_decisions:
- issue: הָרְפָאִים పదం అర్థం
  choice: రెఫాయీయులు
  alternative: దైత్యులు
  rationale: ఈ పదం ఒక ప్రజా/వంశ సమూహ నామంగా ఉండవచ్చు; నేరుగా ‘దైత్యులు’ అని అనువదించడం మూలపాఠం తప్పనిసరిగా చెప్పనంత వ్యాఖ్యానాన్ని చేర్చవచ్చు. అందువల్ల ప్రధాన పాఠంలో లిప్యంతరీకరణను ఉంచి, సంప్రదాయ అర్థాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త సైనిక వర్ణనను నిలిపి, పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది. అందించిన ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు ‘After this’ వద్ద ఉన్నప్పటికీ దాని పాదటిప్పణి సిప్పయి పేరుకు సంబంధించినది కాబట్టి, ప్రచురణ ముసాయిదాలో ఆ గుర్తును సంబంధిత పేరువద్ద ఉంచింది.
