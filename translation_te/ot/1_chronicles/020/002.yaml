source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: te
  text: దావీదు వారి రాజు తలమీద ఉన్న కిరీటాన్ని తీసుకున్నాడు.[a] అది ఒక తలాంతు[b] బంగారం బరువు ఉందని అతడు కనుగొన్నాడు; దానిలో ఒక విలువైన రాయి ఉంది. అది దావీదు తలమీద ఉండింది. అతడు ఆ పట్టణం నుండి అత్యధికమైన దోపుడు సొమ్మును తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిల్కోము కిరీటాన్ని” (లేదా “మల్కాము కిరీటాన్ని”). ఇక్కడి హీబ్రూ పదాన్ని “వారి రాజు” అని గానీ, అమ్మోనీయుల దేవుని పేరుగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: తలాంతు అనేది ప్రాచీనకాలపు పెద్ద బరువు కొలమానం. దాని ఖచ్చితమైన విలువ ప్రాంతాన్నిబట్టి మారేది; సాధారణంగా అది సుమారు 34 కిలోగ్రాములు అని అంచనా వేస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: కిరీటం
  rationale: రాజు ధరించే శిరోభూషణాన్ని సూచించే సహజమైన, ప్రామాణిక ఆధునిక తెలుగు పదం.
- source_word: מַלְכָּם
  choice: వారి రాజు
  rationale: రూపనిర్మాణపరంగా ‘వారి రాజు’ అనే అర్థం సహజంగా వస్తుంది; వెంటనే వచ్చే ‘అతని తలమీద నుండి’ అనే భావం కూడా మానవ రాజునే సూచించడానికి అనుకూలంగా ఉంది. దేవుడైన మిల్కోము అనే పఠనాన్ని పాదసూచికలో నిలిపాం.
- source_word: מֵעַל רֹאשׁוֹ
  choice: తలమీద ఉన్న
  rationale: కిరీటాన్ని అతని తలమీద నుండి తీసుకున్నాడనే హీబ్రూ దృశ్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: అది ఒక తలాంతు బంగారం బరువుందని అతడు కనుగొన్నాడు
  rationale: కిరీటం బరువు తరువాత తెలిసిన విషయమని మూలంలోని ‘కనుగొన్నాడు’ అనే క్రియను నిలిపి, ప్రాచీన కొలమానాన్ని మార్చకుండా ఉంచుతుంది.
- source_word: אֶבֶן יְקָרָה
  choice: ఒక విలువైన రాయి
  rationale: రాయి రకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఏకవచన భావాన్ని నేరుగా అందిస్తుంది.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: ఆ కిరీటం దావీదు తలమీద ఉంచబడింది
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అది దావీదు తలమీద ఉంది’; సందర్భంలోని ఫలితాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘ఉంచబడింది’ అని ఇచ్చాం, అయితే కర్తను చేర్చలేదు.
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  choice: అతడు ఆ పట్టణం నుండి అపారమైన దోపుడు సొమ్మును తీసుకెళ్లాడు
  rationale: సైనిక సందర్భంలోని שָׁלָל ను ‘దోపుడు సొమ్ము’గా, విస్తారమైన పరిమాణాన్ని הַרְבֵּה מְאֹד కు సహజమైన ‘అపారమైన’గా అందిస్తుంది.
theological_decisions:
- issue: מַלְכָּם అంటే ‘వారి రాజు’నా, అమ్మోనీయుల దేవుడైన ‘మిల్కోము/మల్కాము’నా?
  choice: వారి రాజు
  alternative: మిల్కోము లేదా మల్కాము
  rationale: ప్రత్యయంతో కూడిన రూపం మరియు ‘అతని తల’ అనే వాక్యనిర్మాణం ప్రధాన పాఠంలో ‘వారి రాజు’కు మద్దతిస్తాయి. అయినా దేవుని పేరుగా తీసుకోవడం ప్రాచీనమైన, సాధ్యమైన ప్రత్యామ్నాయం కాబట్టి దాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: וַתְּהִי עַל רֹאשׁ דָּוִיד లో చర్యను స్పష్టీకరించాలా?
  choice: దావీదు తలమీద ఉంచబడింది
  alternative: దావీదు తలమీద ఉంది
  rationale: మూలం అక్షరార్థంగా స్థితిని చెబుతున్నప్పటికీ, సందర్భంలో కిరీటం దావీదు తలపైకి వచ్చిన ఫలితాన్ని తెలుగు సహజంగా నిష్క్రియ రూపంలో వ్యక్తపరుస్తుంది. ఎవరు ఉంచారో మాత్రం పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘తలాంతు’ అనే ప్రాచీన కొలమానాన్ని ప్రధాన పాఠంలో నిలిపి పాదసూచికలో వివరణ ఇచ్చాం. మూలంలోని రాజు/దేవుని పేరు సందిగ్ధతను తొలగించకుండా ప్రత్యామ్నాయ పఠనంగా నమోదు చేశాం.
