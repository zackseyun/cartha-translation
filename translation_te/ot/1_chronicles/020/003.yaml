  naturalness: ‘రంపాలు, ఇనుప పనిముట్లు, గొడ్డళ్లతో పని చేయించాడు’ అనే నిర్మాణంలో పనిముట్లను దావీదే ఉపయోగించాడన్న భావం స్వల్పంగా కలగవచ్చు. ‘వారిచేత ... ఉపయోగించి పని చేయించాడు’ అని చెప్పడం ఆధునిక సహజ తెలుగు ప్రకారం ఎవరు పని చేశారో, పనిముట్లు ఎలా సంబంధించాయో స్పష్టపరుస్తుంది. ‘పట్టణాలన్నిటికీ’ కంటే ‘అన్ని పట్టణాలకూ’ కొంచెం సహజంగా ఉంటుంది.
