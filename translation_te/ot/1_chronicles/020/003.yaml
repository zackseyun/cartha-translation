source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: te
  text: అందులో ఉన్న ప్రజలను అతడు బయటికి తీసుకొచ్చి, వారిచేత రంపాలు[a], ఇనుప పనిముట్లు, గొడ్డళ్లను[b] ఉపయోగించి పని చేయించాడు. అమ్మోనీయుల అన్ని పట్టణాలకూ దావీదు ఇలాగే చేశాడు. తరువాత దావీదు, ప్రజలందరూ యెరూషలేముకు తిరిగి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా, “వారిని రంపాల కింద, ఇనుప నూర్పిడి బల్లల కింద, కోసే పనిముట్ల కింద ఉంచాడు.” 2 సమూయేలు 12:31లోని సమాంతర వచనాన్ని బట్టి, ఈ పనిముట్లతో దావీదు వారిని చంపించాడని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: పనిముట్లకు వాడిన కొన్ని హెబ్రీ పదాల ఖచ్చితమైన అర్థం తెలియదు. ఇక్కడ “ఇనుప పనిముట్లు, గొడ్డళ్లు” అని అనువదించిన పదాలు మరింత సాధారణంగా ఇనుప కోత పరికరాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: బయటికి తీసుకొచ్చి
  rationale: יצא ధాతువు హిఫీల్ రూపంలో సాధారణంగా ‘బయటికి తీసుకురావడం’ అని అర్థం; నగరంలో ఉన్నవారిని వెలుపలికి తీసుకొచ్చిన చర్యను ఇది సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּשַׂר
  choice: పని చేయించాడు
  rationale: ఈ క్రియారూపం అర్థం వివాదాస్పదం. దినవృత్తాంతముల గ్రంథంలోని వాక్యనిర్మాణాన్ని దాని స్వరూపంలోనే అనుసరించి, పేర్కొన్న పనిముట్లతో ప్రజల చేత పని చేయించాడనే సాధ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; హింసాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: בַּמְּגֵרָה
  choice: రంపాలు
  rationale: מְגֵרָה అంటే రంపం. పనిముట్ల జాబితాలో తెలుగు సహజ వాడుకకు అనుగుణంగా బహువచనం వాడాం.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: ఇనుప పనిముట్లు
  rationale: ఈ పదబంధం పదునైన ఇనుప పరికరాలను లేదా నూర్పిడి పరికరాలను సూచించవచ్చు; ఖచ్చితమైన పరికరం తెలియనందున అతిగా నిర్దిష్టం కాని విస్తృత పదబంధాన్ని ఎంచుకున్నాం.
- source_word: וּבַמְּגֵרוֹת
  choice: గొడ్డళ్లతో
  rationale: ఈ పదం పాఠ్యపరంగా, నిఘంటుపరంగా క్లిష్టమైనది; సందర్భంలో మరో కోసే పరికరాన్ని సూచించే అవకాశాన్ని అనుసరించి ‘గొడ్డళ్లు’ అని అనువదించాం, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וְכֵן יַעֲשֶׂה
  choice: ఇలాగే చేశాడు
  rationale: అమ్మోనీయుల పట్టణాలన్నిటి విషయంలో దావీదు అనుసరించిన విధానాన్ని సంక్షిప్తంగా తెలిపే సహజ తెలుగు కథన రూపం.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: అమ్మోనీయుల పట్టణాలన్నిటికీ
  rationale: בְנֵי עַמּוֹן అనే జననామానికి ఆధునిక తెలుగులో సహజమైన రూపం ‘అమ్మోనీయులు’.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: యెరూషలేముకు తిరిగి వచ్చారు
  rationale: గమ్యస్థానంతో వాడిన שוב క్రియకు ఇది సహజమైన తెలుగు కథన అనువాదం; సంయుక్త కర్త కారణంగా బహువచనం వాడాం.
theological_decisions:
- issue: ఈ వచనం అమ్మోనీయులను పనికి నియమించడాన్ని వివరిస్తుందా, లేక పనిముట్లతో చంపడాన్ని వివరిస్తుందా?
  choice: బందీలైన ప్రజల చేత పనిముట్లతో పని చేయించాడనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
  alternative: ముఖ్యంగా 2 సమూయేలు 12:31లోని సమాంతర వచనాన్ని బట్టి, రంపాలు మొదలైన ఇనుప పనిముట్లతో వారిని చంపించాడని అర్థం చేసుకోవచ్చు.
  rationale: దినవృత్తాంతముల గ్రంథంలోని హెబ్రీ వాక్యం 2 సమూయేలు వాక్యానికి సరిగ్గా సమానం కాదు; కాబట్టి సమాంతర వచనంలోని కఠినమైన అర్థాన్ని ఇక్కడికి మౌనంగా దిగుమతి చేయలేదు. అయితే నైతికంగా, ధార్మికంగా ప్రాముఖ్యమైన నిజమైన అనిశ్చితి కావడంతో ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలిని వాడాం. వివాదాస్పద క్రియకు సులభంగా అర్థమయ్యే ‘పని చేయించాడు’ అనే రూపాన్ని ఎంచుకుని, మూలపాఠ్యంలోని నిజమైన అనిశ్చితిని రెండు పాదసూచికల్లో భద్రపరిచాం.
