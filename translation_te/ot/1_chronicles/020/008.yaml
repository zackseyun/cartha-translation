source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: te
  text: వీరు గాతులో రాఫాకు పుట్టినవారు[a]; దావీదు చేతా, అతని సేవకుల చేతా పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాఫా వంశానికి చెందినవారు’; ఇది గాతులోని భారీ దేహుల వంశమైన రెఫాయీయుల సంతతిని సూచిస్తూ ఉండవచ్చు.
    reason: రాఫా అనే పదం వ్యక్తిగత పూర్వికుడిని సూచిస్తుందా లేక వంశాన్ని సూచిస్తుందా అన్నది సందిగ్ధంగా ఉంది.
lexical_decisions:
- source_word: אֵל
  choice: వీరు
  rationale: ఇంతకుముందు పేర్కొన్న యోధులను సూచించే నిర్దేశక సర్వనామం; హెబ్రీలో లేని ‘మనుషులు’ అనే పదాన్ని చేర్చకుండా సహజమైన తెలుగును ఇస్తుంది.
- source_word: נוּלְּדוּ
  choice: పుట్టినవారు
  rationale: ילד అనే క్రియ యొక్క నిఫాల్ రూపానికి ప్రాథమిక అర్థం ‘పుట్టడం’; ఈ వంశసంబంధ సందర్భంలో సంతతి భావాన్ని కూడా సూచించగలదు.
- source_word: לְהָרָפָא
  choice: రాఫాకు
  rationale: లామెద్ ఉపసర్గను వంశ/సంతాన సంబంధంగా ఉంచుతూ, రాఫా వ్యక్తిగత పూర్వికుడా లేక వంశనామమా అనే సందిగ్ధతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: בְּגַת
  choice: గాతులో
  rationale: స్థలాన్ని సూచించే ב ఉపసర్గకు సహజమైన తెలుగు రూపం.
- source_word: וַיִּפְּלוּ
  choice: హతమయ్యారు
  rationale: నפל అక్షరార్థంగా ‘పడిపోయారు’; యుద్ధ సందర్భంలో మరణాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో స్పష్టమైన భావానువాదం.
- source_word: בְיַד
  choice: చేతి వల్ల
  rationale: కర్తృత్వాన్ని సూచించే హెబ్రీ జాతీయాన్ని కొంతవరకు నిలుపుతూ తెలుగులో అర్థమయ్యే రూపం.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עבד యొక్క ప్రాథమిక అర్థం ‘సేవకుడు’; రాజసైనిక సందర్భంలో దావీదు సేవలో ఉన్న యోధులను సూచించవచ్చు.
theological_decisions:
- issue: הָרָפָא గుర్తింపు
  choice: ‘రాఫా’ అనే రూపాన్ని ఉంచి, పూర్వికుడు లేదా వంశపేరు అనే సందిగ్ధతను నిలుపడం
  alternative: ‘రాక్షసుడు’ లేదా ‘రెఫాయీయులు’ అని స్పష్టీకరించడం
  rationale: హెబ్రీ రూపం ఏకవచనంలో నిర్దిష్ట పదంతో ఉంది; అది వ్యక్తినామమా, వంశపదమా అన్నది నిశ్చితం కాదు. ‘రాక్షసుడు’ అని అనువదించడం మూలంలో ఉన్నదానికంటే బలమైన వ్యాఖ్యానాన్ని జోడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వంశసంబంధ సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
