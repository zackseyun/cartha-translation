  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מִדָּ֗ה וְ/אֶצְבְּעֹתָ֤י/ו שֵׁשׁ וָ/שֵׁשׁ֙ עֶשְׂרִ֣ים וְ/אַרְבַּ֔ע וְ/גַם ה֖וּא נוֹלַ֥ד לְ/הָ/רָפָֽא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: te
  text: గాతులో మళ్లీ యుద్ధం జరిగింది; అక్కడ అసాధారణమైన శరీరాకృతి గల ఒక మనిషి ఉన్నాడు. అతని చేతులకూ కాళ్లకూ ఆరేసి వేళ్లు, మొత్తం ఇరవై నాలుగు వేళ్లు, ఉండేవి. అతడు కూడా రాఫాకు పుట్టినవాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “మహాకాయుని సంతతివాడు,” లేక “రెఫాయీయులలో ఒకడు.” హీబ్రూ అక్షరార్థం: “రాఫాకు పుట్టినవాడు.”'
    reason: הָרָפָא ఒక పూర్వికుని పేరు, వంశసూచక పేరు, లేదా రెఫాయీయులకు సంబంధించిన సూచన కావచ్చు. ప్రధాన పాఠ్యంలోని “రాఫా” ఈ సందిగ్ధతను కాపాడుతుంది.
lexical_decisions:
- source_word: עוֹד
  choice: మళ్లీ
  rationale: కథన క్రమంలో యుద్ధం మరోసారి జరిగిందనే పునరావృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִלְחָמָה
  choice: యుద్ధం
  rationale: ఈ పదం విస్తృతమైన పోరాటాన్ని సూచిస్తుంది; కథన సారాంశంలో ‘యుద్ధం’ తగినది.
- source_word: בְּגַת
  choice: గాతులో
  rationale: בְּ స్థానాన్ని సూచిస్తుంది; తెలుగులో నగరనామంతో ‘లో’ సహజంగా ఉంటుంది.
- source_word: אִישׁ מִדָּה
  choice: అసాధారణమైన ఎత్తు ఉన్న ఒక మనిషి
  rationale: అక్షరార్థంగా ‘కొలత/ఎత్తు గల మనిషి’; సందర్భంలో అసాధారణ శరీరాకృతిని సూచిస్తుంది. ‘దైత్యుడు’ అని ముందే నిర్ణయించకుండా భావాన్ని అందిస్తుంది.
- source_word: אֶצְבְּעֹתָיו שֵׁשׁ וָשֵׁשׁ
  choice: అతని చేతులకూ కాళ్లకూ ఆరేసి వేళ్లు
  rationale: ‘వేళ్లు ఆరు, ఆరు’ అనే సంక్షిప్త హీబ్రూ వర్ణనను, మొత్తం ఇరవై నాలుగు అనే సంఖ్యతోను సమాంతర వాక్యం 2 సమూయేలు 21:20తోను సరిపడేలా సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: మొత్తం ఇరవై నాలుగు వేళ్లు
  rationale: హీబ్రూ ఇచ్చిన మొత్తాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְגַם הוּא
  choice: అతడు కూడా
  rationale: ముందు పేర్కొన్న అదే వంశం లేదా సమూహంతో ఇతనికీ సంబంధం ఉందని సూచించే అదనపు భావాన్ని నిలుపుతుంది.
- source_word: נוֹלַד לְהָרָפָא
  choice: రాఫాకు పుట్టినవాడు
  rationale: ‘రాఫాకు పుట్టాడు’ అనే హీబ్రూ రూపాన్ని దగ్గరగా నిలుపుతూ, రాఫా వ్యక్తినా, వంశసూచక నామమా, లేక రాక్షసకాయుల సమూహ సూచనా అనే సందిగ్ధతను ప్రధాన పాఠ్యంలో పరిష్కరించదు.
theological_decisions:
- issue: הָרָפָא అనే పదం సూచించే గుర్తింపు
  choice: ‘రాఫా’ అనే రూపాన్ని లిప్యంతరీకరించి, ‘రాఫాకు పుట్టినవాడు’ అని ఉంచడం
  alternative: ‘రాక్షసకాయుని సంతతివాడు’ లేదా ‘రెఫాయీయుల్లో ఒకడు’
  rationale: హీబ్రూ ఏకవచన రూపం ఒక పూర్వికుడిని, వంశాన్ని, లేదా రాక్షసకాయులతో సంబంధమున్న సమూహాన్ని సూచించవచ్చు. లిప్యంతరీకరణ ఈ నిజమైన వ్యాఖ్యాన సందిగ్ధతను కాపాడుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. అసాధారణ శరీరాకృతిని ‘దైత్యుడు’ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించకుండా వర్ణనాత్మకంగా అనువదించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘రాఫా’ పదబంధం వద్దనే ఉంచాం.
