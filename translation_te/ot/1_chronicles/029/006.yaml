source:
  edition: WLC
  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: te
  text: అప్పుడు పితృకుటుంబాల నాయకులు[a], ఇశ్రాయేలు గోత్రాల నాయకులు, వేలమందికి మరియు వందమందికి అధిపతులు[b], రాజు పనిని పర్యవేక్షించే అధికారులు స్వచ్ఛందంగా కానుకలు ఇచ్చారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితృకుటుంబాలు’ అంటే పూర్వికుల ఆధారంగా ఏర్పడిన వంశ లేదా కుటుంబ విభాగాలు.
    reason: cultural_note
  - marker: b
    text: ‘వేలమంది’ మరియు ‘వందమంది’ అనేవి సైనిక లేదా పరిపాలనా విభాగాలను సూచిస్తాయి; ఇక్కడ వాటి అధిపతులు ఉద్దేశించబడ్డారు.
    reason: cultural_note
  - marker: c
    text: దీనిని ‘మనస్ఫూర్తిగా అర్పించారు’ లేదా ‘స్వచ్ఛందంగా ముందుకు వచ్చారు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ స్వేచ్ఛాపూర్వక స్పందనను నొక్కిచెబుతుంది; ఈ సందర్భంలో అది స్వచ్ఛందంగా కానుకలు ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: స్వచ్ఛందంగా కానుకలు ఇచ్చారు
  rationale: హిత్పయేల్ రూపం స్వచ్ఛంద స్పందనను సూచిస్తుంది; పరిసర వచనాల్లో ఆలయ నిర్మాణం కోసం వస్తుసంబంధమైన విరాళాలు ఇవ్వడం ప్రస్తావనలో ఉన్నందున ‘కానుకలు ఇచ్చారు’ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: שָׂרֵי
  choice: నాయకులు / అధిపతులు / అధికారులు
  rationale: వివిధ అధికార వర్గాలకు అనుగుణంగా సహజమైన తెలుగు పదాలను వాడుతూ, వారందరూ అధికార బాధ్యత గలవారనే మూలార్థాన్ని నిలుపుతుంది.
- source_word: הָאָבוֹת
  choice: పితృకుటుంబాలు
  rationale: వంశపారంపర్యమైన, పితృసంబంధ కుటుంబ లేదా వంశ విభాగాలను సూచించే దినవృత్తాంతాల సామాజిక పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలు
  rationale: ఇశ్రాయేలు తెగల వ్యవస్థకు ప్రామాణికమైన, నేరమైన తెలుగు అనువాదం.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: వేలమందికి మరియు వందమందికి
  rationale: శబ్దార్థ నిర్మాణాన్ని నిలుపుతూ, ఇవి సైనిక లేదా పరిపాలనా విభాగాలని పాదసూచిక వివరిస్తుంది.
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: రాజు పనిని పర్యవేక్షించే అధికారులు
  rationale: లామెద్‌తో ఉన్న పదబంధాన్ని జాబితాలోని మరో అధికార వర్గంగా గ్రహించి, రాజు పనికి బాధ్యత వహించినవారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
