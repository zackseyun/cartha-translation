  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పరిపాలనా జాబితా స్పష్టంగా ఉండేందుకు సందర్భానుగుణ పదభేదాలు వాడబడ్డాయి; మూలంలోని స్వచ్ఛందత మరియు సామాజిక నిర్మాణం పాదసూచికలతో నిలుపబడ్డాయి.
