revisions:
- from: బంగారు పనులకు బంగారం, వెండి పనులకు వెండి, శిల్పుల చేతులతో జరిగే ప్రతి పనికీ. ఈ రోజు యాహ్వేకు తన చేతిని నింపడానికి[a] స్వచ్ఛందంగా ముందుకు వచ్చేవాడు ఎవరు?
  to: బంగారు పనులకు బంగారం, వెండి పనులకు వెండి, శిల్పుల చేతుల ద్వారా చేయబడే ప్రతి పనికీ. ఈ రోజు యాహ్వేకు తన చేతిని నింపడానికి[a] స్వచ్ఛందంగా ముందుకు వచ్చేవాడు ఎవరు?
