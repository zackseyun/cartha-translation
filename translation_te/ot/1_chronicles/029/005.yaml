id: 1CH.29.5
reference: 1 Chronicles 29:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַ/זָּהָ֤ב לַ/זָּהָב֙ וְ/לַ/כֶּ֣סֶף לַ/כֶּ֔סֶף וּ/לְ/כָל מְלָאכָ֖ה בְּ/יַ֣ד חָרָשִׁ֑ים וּ/מִ֣י מִתְנַדֵּ֔ב לְ/מַלֹּ֥אות יָד֛/וֹ הַ/יּ֖וֹם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: te
  text: బంగారు పనులకు బంగారం, వెండి పనులకు వెండి, శిల్పుల చేతుల ద్వారా చేయబడే ప్రతి పనికీ. ఈ రోజు యాహ్వేకు తన చేతిని నింపడానికి[a] స్వచ్ఛందంగా ముందుకు వచ్చేవాడు ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన చేతిని నింపడానికి.” ఈ హీబ్రూ నుడికారం పవిత్ర సేవకు తనను అంకితం చేసుకోవడాన్ని లేదా అర్పణను సమర్పించడాన్ని సూచించవచ్చు.
    reason: మూల నుడికారం యొక్క సాధ్యమైన ఆరాధనా సంబంధ అర్థాలను తెలియజేయడం
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: బంగారు పనులకు బంగారం
  rationale: హీబ్రూ పునరుక్తి బంగారంతో చేయవలసిన వస్తువులు లేదా పనులకు కేటాయించిన బంగారాన్ని సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు సంక్షిప్తంగా ‘బంగారు పనులకు’ అని ఇచ్చాం.
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: వెండి పనులకు వెండి
  rationale: బంగారం గురించిన సమాంతర పదబంధాన్ని అనుసరించి, వెండితో చేయవలసిన పనులకు ఉద్దేశించిన వెండిని సూచిస్తుంది.
- source_word: וּלְכָל מְלָאכָה
  choice: ప్రతి పనికీ
  rationale: మందిర నిర్మాణానికి సంబంధించిన అన్ని రకాల పనులను విస్తృతంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: בְּיַד חָרָשִׁים
  choice: శిల్పుల చేతులతో జరిగే
  rationale: ‘చేతి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, నైపుణ్యంగల పనివారు ఆ పనిని నిర్వహిస్తారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמִי מִתְנַדֵּב
  choice: స్వచ్ఛందంగా ముందుకు వచ్చేవాడు ఎవరు?
  rationale: התנדב స్వచ్ఛందంగా అర్పించుకోవడం లేదా సిద్ధపడడం అనే భావాన్ని వ్యక్తం చేస్తుంది; దావీదు చేసిన పిలుపు యొక్క వాక్చాతుర్యాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: לְמַלֹּאות יָדוֹ
  choice: తన చేతిని నింపడానికి
  rationale: మూలంలోని అసాధారణ ఆరాధనా సంబంధమైన నుడికారాన్ని వ్యాఖ్యానించి పరిమితం చేయకుండా యథాతథంగా నిలిపాం; దాని సాధ్యమైన అర్థాలను పాదసూచికలో వివరించాం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాల సూచనను సహజమైన ఆధునిక తెలుగులో నేరుగా అనువదిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలో ఉన్న దేవుని ప్రత్యేక నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, ל ఉపసర్గను దత్తివిభక్తితో వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దేవుని ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇచ్చాం.
- issue: לְמַלֹּאות יָדוֹ అనే ఆరాధనా సంబంధ నుడికారం
  choice: తన చేతిని నింపడానికి
  alternative: తన్ను ప్రతిష్ఠించుకోవడానికి / సంపూర్ణ అర్పణ చేయడానికి
  rationale: ఈ సందర్భంలో ఈ పదబంధం ప్రతిష్ఠించుకోవడం, పవిత్ర సేవకు అంకితం కావడం, లేదా అర్పణ సమర్పించడం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో ఒకే వ్యాఖ్యానాన్ని ఖరారు చేయకుండా మూల రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘తన చేతిని నింపడానికి’ అనే ఉద్దేశపూర్వకంగా అసాధారణమైన రూపాన్ని మూలంలోని అర్థసందిగ్ధతను కాపాడేందుకు నిలిపి, పాదసూచికతో వివరించాం.
