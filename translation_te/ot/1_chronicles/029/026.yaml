  edition: WLC
  text: וְ/דָוִיד֙ בֶּן יִשָׁ֔י מָלַ֖ךְ עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: te
  text: యెష్షయి కుమారుడైన దావీదు ఇశ్రాయేలంతటిమీద రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: దావీదు
  rationale: వావ్ సంధికారకం ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది; అయితే తెలుగు వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం సహజం కాదు. వ్యక్తినామం సంప్రదాయ తెలుగు రూపమైన ‘దావీదు’గా ఇచ్చాం.
- source_word: בֶּן יִשָׁי
  choice: యెష్షయి కుమారుడైన
  rationale: నిర్మాణ సంబంధంలోని ‘యెష్షయి కుమారుడు’ అనే వంశపరమైన గుర్తింపును తెలుగులో సహజంగా విశేషణ రూపంలో వ్యక్తం చేశాం.
- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: ఇక్కడ క్రియ రాజ్యాధికారాన్ని పొందడాన్ని మాత్రమే కాక, రాజుగా పాలించడాన్ని సూచిస్తుంది. ‘రాజుగా పరిపాలించాడు’ ఆ క్రియార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עַל
  choice: మీద
  rationale: מָלַךְ తో కూడిన עַל పాలనకు లోబడిన ప్రజలను సూచిస్తుంది; తెలుగులో ‘మీద ... పరిపాలించాడు’ సహజ సమానార్థకం.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటి
  rationale: כָּל దేశప్రజల సంపూర్ణతను సూచిస్తుంది. ‘ఇశ్రాయేలంతటి’ దావీదు పాలన పరిధిని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వావ్‌ను యాంత్రికంగా ‘మరియు’ అని ఇవ్వకుండా తెలుగు ప్రవాహానికి అనుగుణంగా విడిచిపెట్టాం.
