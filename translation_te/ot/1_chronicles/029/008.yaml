  to: ఎవరి దగ్గర రాళ్లు ఉన్నాయో వారు వాటిని గేర్షోనీయుడైన యెహీయేలు సంరక్షణలో[a] యాహ్వే మందిరపు ఖజానాకు ఇచ్చారు.
