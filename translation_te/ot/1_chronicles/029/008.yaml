  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: te
  text: ఎవరి దగ్గర రాళ్లు ఉన్నాయో వారు వాటిని గేర్షోనీయుడైన యెహీయేలు సంరక్షణలో[a] యాహ్వే మందిరపు ఖజానాకు ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యెహీయేలు చేతి ద్వారా”; ఇక్కడ యెహీయేలు పర్యవేక్షణకు లేదా సంరక్షణకు అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: ఎవరి దగ్గరైనా … ఉంటే
  rationale: నిఫాల్ కృదంతంతో కూడిన ఈ హీబ్రూ ప్రయోగం ఒకరి వద్ద ఏదైనా ఉండడాన్ని సూచిస్తుంది. సందర్భంలోని అనేక దాతలకు వర్తించే పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲבָנִים
  choice: విలువైన రాళ్లు
  rationale: మూలంలో సాధారణంగా ‘రాళ్లు’ అనే పదమే ఉన్నప్పటికీ, మందిర నిర్మాణానికి ఇచ్చిన సంపదల సందర్భంలో ఇవి విలువైన అలంకార రాళ్లని భావం. నిర్దిష్ట రత్నజాతులను అనవసరంగా పేర్కొనకుండా సందర్భార్థాన్ని తెలుపుతుంది.
- source_word: נָתְנוּ
  choice: ఇచ్చారు
  rationale: נתן అనే సాధారణ క్రియ ఇక్కడ కానుకగా అప్పగించడాన్ని సూచిస్తుంది; ‘ఇచ్చారు’ నేరుగా, సహజంగా ఉంది.
- source_word: לְאוֹצַר
  choice: ఖజానాకు
  rationale: אוֹצָר అంటే నిల్వగది, ధనాగారం లేదా ఖజానా కావచ్చు. మందిరానికి సమర్పించిన విలువైన వస్తువుల సందర్భంలో ‘ఖజానా’ తగినది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిర
  rationale: బేత్ అనే పదానికి అక్షరార్థం ‘ఇల్లు’; అయితే ఈ సందర్భంలో దేవుని ఆరాధనా భవనాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది; ప్రభువు అనే బిరుదుతో భర్తీ చేయదు.
- source_word: עַל יַד
  choice: సంరక్షణలో
  rationale: అక్షరార్థంగా ‘చేతి ద్వారా/చేతి మీద’ అనే ఈ ప్రయోగం ఇక్కడ బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది. ‘సంరక్షణలో’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְחִיאֵל
  choice: యెహీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించింది.
- source_word: הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుడు
  rationale: యెహీయేలు గేర్షోను వంశానికి చెందినవాడని సూచించే వంశనామాన్ని నేరుగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘లేవీయుడు’ అనే వివరణను చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే నిలుపుతూ, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకుంది. ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: אֲבָנִים సందర్భార్థం
  choice: విలువైన రాళ్లు
  alternative: రాళ్లు
  rationale: హీబ్రూ పదం స్వతహాగా ‘రాళ్లు’ అనే విస్తృత అర్థం కలిగి ఉంది; అయితే చుట్టుపక్కల వచనాల్లో మందిరానికి సమర్పించిన విలువైన వస్తువుల జాబితా ఉన్నందున సందర్భార్థాన్ని పాఠ్యంలో స్పష్టం చేసింది. మూలంలోని విస్తృత పదార్థాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘యెహోవా మందిరం,’ ‘ఖజానా,’ ‘సంరక్షణలో’ వంటి సాధారణ పాఠకులకు స్పష్టమైన పదాలను వాడింది; హీబ్రూ ప్రయోగాల అక్షరరూపాలను పాదసూచికలో ఇచ్చింది.
