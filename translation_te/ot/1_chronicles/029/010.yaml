id: 1CH.29.10
reference: 1 Chronicles 29:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: te
  text: 'అప్పుడు దావీదు సమాజమంతటి ఎదుట యెహోవాను స్తుతించాడు. దావీదు ఇలా అన్నాడు: “మా తండ్రియైన ఇశ్రాయేలు దేవుడవైన యెహోవా, నీవు అనాదికాలము నుండి యుగయుగాల వరకు ధన్యుడవు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు దేవుడవైన యెహోవా, మా తండ్రీ, నీవు అనాదికాలము నుండి యుగయుగాల వరకు ధన్యుడవు.” ఇక్కడ “మా తండ్రి” అనే మాటను ఇశ్రాయేలు/యాకోబుకు కాక దేవునికి నేర సంబోధనగా తీసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: స్తుతిస్తూ ఆశీర్వదించాడు
  rationale: దేవుడు కర్మగా ఉన్నప్పుడు ברך పియేల్ రూపం దేవుణ్ణి స్తుతిస్తూ ఆయనను ధన్యుడని ప్రకటించడాన్ని సూచిస్తుంది. తరువాతి בָּרוּךְతో ఉన్న పదబంధ సంబంధాన్ని ‘ఆశీర్వదించాడు’ నిలుపుతుంది; ‘స్తుతిస్తూ’ ఆధునిక తెలుగు పాఠకునికి ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమున్న ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: לְעֵינֵי כָּל־הַקָּהָל
  choice: సమాజమంతటి ఎదుట
  rationale: అక్షరార్థంగా ‘సమాజమంతటి కళ్ల ఎదుట’; బహిరంగంగా వారి సమక్షంలో జరిగినదనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בָּרוּךְ אַתָּה
  choice: నీవు స్తుతింపబడాలి
  rationale: ప్రత్యక్ష సంబోధనతో కూడిన స్తోత్ర ఆశీర్వచనాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తపరుస్తుంది. ఇది కేవలం కోరికకన్నా దేవుడు స్తుతికి పాత్రుడనే ప్రకటనాత్మక భావాన్నీ మోస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל אָבִינוּ
  choice: మా తండ్రియైన ఇశ్రాయేలు దేవుడవైన
  rationale: ప్రధాన పఠనంలో אָבִינוּను ఇశ్రాయేలు/యాకోబుకు అన్వయించి, ‘మా తండ్రియైన ఇశ్రాయేలు’ అని ఇచ్చాం. దేవుణ్ణి ‘మా తండ్రీ’ అని నేరుగా సంబోధించే వ్యాకరణ అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: מֵעוֹלָם וְעַד־עוֹלָם
  choice: యుగయుగాల వరకు
  rationale: అంతులేని కాలవ్యాప్తిని తెలిపే హెబ్రీ నుడికారానికి సహజమైన, గంభీరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ‘మా తండ్రి’ (אָבִינוּ) అనే మాట ఎవరిని సూచిస్తుంది?
  choice: అది ఇశ్రాయేలు/యాకోబును సూచించేలా ‘మా తండ్రియైన ఇశ్రాయేలు దేవుడు’ అని ప్రధాన పాఠంలో ఇచ్చాం.
  alternative: దేవుణ్ణే నేరుగా ‘ఇశ్రాయేలు దేవుడా, మా తండ్రీ’ అని సంబోధించినట్లు చదవవచ్చు.
  rationale: పదక్రమం אָבִינוּను ‘ఇశ్రాయేలు’కు సమానార్థక విశేషణంగా గ్రహించడానికి అనుకూలంగా ఉంది; అయితే విరామచిహ్నాలు లేని హెబ్రీ వాక్యనిర్మాణం ప్రత్యక్ష సంబోధన పఠనాన్ని పూర్తిగా తొలగించదు. అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ ప్రార్థనకు తగిన గంభీరతతో అనువదించాం. ‘సమాజమంతటి ఎదుట’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది. ‘స్తుతిస్తూ ఆశీర్వదించాడు’ మూలంలోని ברך పదపునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, దేవుణ్ణి ఆశీర్వదించడం అనే తెలుగు అస్పష్టతను తగ్గిస్తుంది.
