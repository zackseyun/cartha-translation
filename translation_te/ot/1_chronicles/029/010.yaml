- from: 'అప్పుడు దావీదు సమాజమంతటి ఎదుట యెహోవాను స్తుతిస్తూ ఆశీర్వదించాడు. దావీదు ఇలా అన్నాడు: “మా తండ్రియైన ఇశ్రాయేలు దేవుడవైన యెహోవా, యుగయుగాల వరకు నీవు స్తుతింపబడాలి![a]”'
  to: 'అప్పుడు దావీదు సమాజమంతటి ఎదుట యెహోవాను స్తుతించాడు. దావీదు ఇలా అన్నాడు: “మా తండ్రియైన ఇశ్రాయేలు దేవుడవైన యెహోవా, నీవు అనాదికాలము నుండి యుగయుగాల వరకు ధన్యుడవు.[a]”'
  rationale: The revision removes an unnecessary verbal expansion, restores the declarative force of the Hebrew blessing formula, and translates both temporal directions in “from everlasting to everlasting.” It retains the primary historical reading of “Israel our father” and preserves the syntactically possible direct-address reading in the footnote.
