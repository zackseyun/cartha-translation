id: 1CH.29.13
reference: 1 Chronicles 29:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: te
  text: ఇప్పుడు మా దేవా, మేము నీకు కృతజ్ఞతలు చెల్లిస్తూ, నీ మహిమగల నామాన్ని స్తుతిస్తున్నాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో ప్రస్తుత ప్రతిస్పందనను పరిచయం చేసే కాలసూచక సంధాన పదం. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉండి సందర్భంలోని ప్రవాహాన్ని తెలియజేస్తుంది; వావ్‌ను విడిగా ‘మరియు’ అని అనువదించడం అవసరం లేదు.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవా
  rationale: మొదటి బహువచన స్వామ్య ప్రత్యయాన్ని ‘మా’గా, ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధనారూపం ‘దేవా’గా వ్యక్తం చేస్తుంది.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: మేము నీకు కృతజ్ఞతలు చెల్లిస్తూ
  rationale: ఆరాధనా సందర్భంలో ידה హిఫిల్‌కు ‘కృతజ్ఞతలు చెల్లించు’ సరైన భావం. స్పష్టంగా ఉన్న אֲנַחְנוּను ‘మేము’గా నిలుపుతూ, తరువాతి సమాంతర కృదంతంతో కలిపి సహజ తెలుగు వాక్యనిర్మాణం వాడబడింది.
- source_word: וּמְהַלְלִים
  choice: స్తుతిస్తున్నాం
  rationale: הלל పియేల్ కృదంతం స్తుతించడాన్ని సూచిస్తుంది. ‘స్తుతిస్తున్నాం’ రెండు హిబ్రూ కృదంతాల సమకాలీన, కొనసాగుతున్న ప్రార్థనా చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: నీ మహిమగల నామాన్ని
  rationale: ‘నీ మహిమ యొక్క నామాన్ని’ అనే పదానువాదం తెలుగులో అసహజంగా ఉంటుంది. ‘నీ మహిమగల నామాన్ని’ మూలంలోని ‘నామం’ అనే ప్రాముఖ్యమైన భావాన్ని నిలుపుతూ תִּפְאֶרֶת యొక్క మహిమ/వైభవ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవ సంబోధనకు అదనపు భక్తిపూర్వక పదాలు చేర్చాలా
  choice: మా దేవా
  alternative: ఓ మా దేవా
  rationale: హిబ్రూలో ప్రత్యేక సంబోధన అవ్యయం లేదు. తెలుగు విభక్తి రూపమే ప్రత్యక్ష సంబోధనను స్పష్టంగా చూపుతుంది; అందువల్ల మూలంలో లేని ‘ఓ’ను చేర్చలేదు.
- issue: ‘నామం’ అనే దైవశాస్త్రీయంగా ప్రాముఖ్యమైన పదబంధాన్ని ఎలా అందించాలి
  choice: నీ మహిమగల నామాన్ని
  alternative: నీ మహిమ యొక్క నామాన్ని
  rationale: దేవుని వెల్లడైన ఘనత, ఖ్యాతి, సన్నిధిని సూచించే ‘నామం’ను తొలగించకుండా ఉంచింది. అదే సమయంలో హిబ్రూ నిర్మాణాన్ని తెలుగులో అసహజంగా ప్రతిబింబించకుండా విశేషణాత్మకంగా అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభావంతో కూడిన, సాధారణ పాఠకులకు సులభమైన శైలి. అనవసరమైన ప్రాచీన లేదా మతశాఖాపర పదజాలం నివారించబడింది.
