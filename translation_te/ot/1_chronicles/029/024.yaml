id: 1CH.29.24
reference: 1 Chronicles 29:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/שָּׂרִים֙ וְ/הַ/גִּבֹּרִ֔ים וְ/גַ֕ם כָּל בְּנֵ֖י הַ/מֶּ֣לֶךְ דָּוִ֑יד נָ֣תְנוּ יָ֔ד תַּ֖חַת שְׁלֹמֹ֥ה הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: te
  text: అధికారులందరూ, పరాక్రమశాలులందరూ, అలాగే రాజైన దావీదు కుమారులందరూ సొలొమోను రాజుకు విధేయత చూపించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సొలొమోను రాజు కింద తమ చేతిని ఇచ్చారు.’ ఇది లోబడటాన్ని లేదా విధేయతను తెలియజేసే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: అధికారులు
  rationale: ఈ పదం పాలకులను లేదా ఉన్నత పదవుల్లో ఉన్నవారిని సూచిస్తుంది. రాజసభ, పరిపాలన సందర్భంలో ‘అధికారులు’ సహజంగా ఉండి, దీనిని కేవలం సైనిక నాయకత్వానికే పరిమితం చేయదు.
- source_word: גִּבֹּרִים
  choice: పరాక్రమశాలులు
  rationale: ఈ పదంలో బలం, శౌర్యం, ప్రాముఖ్యత అనే భావాలు ఉన్నాయి; తరచుగా సైనిక నేపథ్యం ఉన్నా, అది సైనిక అర్థానికే పరిమితం కాదు. ‘పరాక్రమశాలులు’ ఈ విస్తృతిని నిలుపుతుంది.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: దావీదు రాజు కుమారులు
  rationale: దావీదుకు ఇవ్వబడిన రాజ బిరుదునూ, కుమారులుగా ఉన్న ప్రత్యక్ష బంధాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: נָתְנוּ יָד תַּחַת
  choice: విధేయత ప్రకటించారు
  rationale: అక్షరార్థంగా ‘చేతిని కింద ఇచ్చారు’ అనే ఈ హీబ్రూ నుడికారం, ఒక ఉన్నతాధికారికి లోబడటం లేదా నిష్ఠను తెలియజేయడం అనే భావాన్ని ఇస్తుంది. ‘విధేయత ప్రకటించారు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా ప్రమాణం చేశారనే నిర్ధారణను అనవసరంగా చేర్చదు.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: సొలొమోను రాజు
  rationale: హీబ్రూలోని పేరు-బిరుదు నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతూ, ఈ సందర్భంలో సొలొమోను గుర్తింపబడిన రాజు అనే అంశాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో భావానువాదం చేశాం; దాని అక్షరరూపాన్ని పాదసూచికలో ఇచ్చాం.
