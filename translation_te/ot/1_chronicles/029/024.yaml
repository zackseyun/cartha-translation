    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful lexical choices, explicitly reflects the repeated Hebrew ‘all,’ and uses more natural Telugu for David’s royal designation and for the submission idiom. The footnote remains anchored to the idiomatic rendering and preserves the literal wording and semantic range.
