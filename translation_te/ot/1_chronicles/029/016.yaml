id: 1CH.29.16
reference: 1 Chronicles 29:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: te
  text: యాహ్వే, మా దేవా, నీ పవిత్ర నామం కోసం నీకు ఒక గృహాన్ని నిర్మించడానికి మేము సిద్ధం చేసిన ఈ సమస్త సంపద[a] నీ చేతినుండి వచ్చినదే[b]; అంతా నీదే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ సమస్త సమృద్ధి,’ ‘ఈ విస్తారమైన నిల్వ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఆలయ నిర్మాణం కోసం సమకూర్చిన అపారమైన ధనసామగ్రిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ చేతినుండి ఇది.’
    reason: lexical_alternative
  - marker: c
    text: ‘సమస్తమూ నీకే చెందుతుంది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: యాహ్వే, మా దేవా
  rationale: దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించి, సంబోధనను సహజమైన తెలుగు రూపంలో ఉంచాం.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: ఈ సమస్త సంపద
  rationale: הָמוֹן ఇక్కడ ఆలయ నిర్మాణం కోసం సమకూర్చిన విస్తారమైన ధనసామగ్రిని సూచిస్తుంది. ‘సంపద’ పరిమాణం, విలువ రెండింటినీ సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: మేము సిద్ధం చేసిన
  rationale: పూర్తయిన సిద్ధపాటు చర్యను, దాని ప్రస్తుత ప్రాసంగికతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: నీకు ఒక గృహాన్ని నిర్మించడానికి
  rationale: בַיִת అనే ‘ఇల్లు/గృహం’ రూపకాన్ని ‘ఆలయం’గా పూర్తిగా వ్యాఖ్యానించకుండా నిలుపుతూ, గౌరవప్రదమైన తెలుగు వాడుకను ఎంచుకున్నాం.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: నీ పవిత్ర నామం కోసం
  rationale: దేవుని పవిత్ర నామానికి అంకితమైన గృహం అనే భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: מִיָּדְךָ הִיא
  choice: నీ చేతినుండి వచ్చినదే
  rationale: దేవుడే ఈ సంపదకు మూలమనే భావంతో పాటు ‘నీ చేతినుండి’ అనే మూలభాషా ప్రతిరూపాన్ని నిలుపుతుంది.
- source_word: וּלְךָ הַכֹּל
  choice: అంతా నీదే
  rationale: మూలంలోని సంక్షిప్తమైన, సమగ్ర యాజమాన్య ప్రకటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: దేవుని సమకూర్పు మరియు యాజమాన్యం
  choice: ‘నీ చేతినుండి వచ్చినదే; అంతా నీదే’ అని రెండు వాక్యాంశాల ఉద్వేగాన్ని నిలుపడం
  alternative: ‘నీవే అన్నీ ఇచ్చావు’ అని ఒకే భావంగా కలపడం
  rationale: మూలంలో సంపద దేవుని చేతినుండి వచ్చిందనే ప్రకటనతో పాటు సమస్తం ఆయనదే అనే విస్తృత ప్రకటన కూడా ఉంది; రెండింటినీ విడిగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గృహం’ ద్వారా మూలంలోని ‘house’ రూపకాన్ని నిలిపి, సందర్భార్థమైన ఆలయాన్ని అనవసరంగా ప్రత్యక్ష పదంగా చేర్చలేదు. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
