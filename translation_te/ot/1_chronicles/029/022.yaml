  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: te
  text: ఆ రోజున వారు యాహ్వే సన్నిధిలో గొప్ప సంతోషంతో తిని తాగారు.[a] దావీదు కుమారుడైన సొలొమోనును రెండవసారి[b] రాజుగా నియమించారు. యాహ్వే కొరకు అతణ్ణి అధిపతిగా[c][d], సాదోకును యాజకుడిగా అభిషేకించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే ఎదుట.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మళ్లీ.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘యాహ్వే సన్నిధిలో అతణ్ణి అధిపతిగా అభిషేకించారు.’ హెబ్రీ పదబంధం యాహ్వేకు అంకితం చేయడాన్ని లేదా ఆయన సన్నిధిలో ఆ కార్యం చేయడాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: d
    text: ‘అధిపతి’ అనేది హెబ్రీ ‘నాగీద్’కు అనువాదం; సందర్భానుసారం దీనిని ‘నాయకుడు’ లేదా ‘పాలకుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఈ పదబంధం యెహోవా ఎదుట లేదా ఆయన సన్నిధిలో ఉండడాన్ని సూచిస్తుంది. ఆరాధనాత్మక సందర్భంలో ఆధునిక తెలుగులో ‘సన్నిధిలో’ సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: ఎంతో సంతోషించారు
  rationale: హెబ్రీ పదబంధం గొప్ప ఆనందంతో తినడం, తాగడం అనే విధానాన్ని తెలుపుతుంది. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం క్రియాత్మకంగా వ్యక్తపరిచాం.
- source_word: וַיַּמְלִיכוּ
  choice: రాజుగా నియమించారు
  rationale: హిఫిల్ రూపం ‘రాజుగా చేయడం/పాలింపజేయడం’ అనే భావాన్ని ఇస్తుంది. ‘పట్టాభిషేకం చేశారు’ అంటే మూలంలో స్పష్టంగా లేని ప్రత్యేక కర్మకాండను జోడించే అవకాశం ఉంది.
- source_word: שֵׁנִית
  choice: రెండవసారి
  rationale: పునరావృతిని మాత్రమే కాక కచ్చితంగా రెండో సందర్భాన్ని సూచించే మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּמְשְׁחוּ
  choice: అభిషేకించారు
  rationale: రాజు, యాజకుల నియామక సందర్భాల్లో משׁח అనే క్రియకు ఇది స్థిరమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: లామెద్ ఇక్కడ సమర్పణ, సంబంధం లేదా యెహోవా అధికారానికి లోబడిన నియామకాన్ని సూచించవచ్చు. ప్రధాన పాఠం ‘కోసం’ అనే భావాన్ని ఉంచుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: לְנָגִיד
  choice: అధిపతిగా
  rationale: נָגִיד ప్రజలపై నియమించబడిన నాయకుడు లేదా పాలకుణ్ణి సూచిస్తుంది. ‘అధిపతి’ అధికార భావాన్ని నిలుపుతూ ‘రాజకుమారుడు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: לְכֹהֵן
  choice: యాజకుడిగా
  rationale: యాజక పదవిని నేరుగా సూచిస్తుంది; సొలొమోను నియామకంతో సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בֶן דָּוִיד
  choice: దావీదు కుమారుడైన
  rationale: సొలొమోనుకు దావీదుతో ఉన్న వంశసంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం; ఉచ్చారణ పునర్నిర్మాణంలో ఉన్న భేదాన్ని గమనించాం.
- issue: అభిషేక వాక్యంలో לַיהוָה భావం
  choice: యెహోవా కోసం అతణ్ణి అధిపతిగా
  alternative: యెహోవా సన్నిధిలో అతణ్ణి అధిపతిగా
  rationale: హెబ్రీ లామెద్ యెహోవాకు అంకితం లేదా ఆయనకు సంబంధించిన నియామకాన్ని సూచించవచ్చు; సందర్భంలో ఆయన సన్నిధిలో జరిగిన చర్య అనే భావమూ సాధ్యం. ప్రధాన పాఠం మొదటి భావాన్ని ఎంచుకుని, నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి వాడబడింది. రాజుగా చేయడం మరియు అభిషేకించడం అనే వేర్వేరు చర్యలను నిలిపాం. పాదసూచిక గుర్తులన్నీ సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచాం.
