  source_fidelity: హీబ్రూ వచనంలోని క్రమం, సంబోధన, ఆజ్ఞార్థకం, సమాజపు ప్రతిస్పందన, అలాగే రెండు శారీరక చర్యలు సరిగ్గా ప్రతిఫలించాయి. בָּרְכוּ נָא కు “ఇప్పుడు ... స్తుతించండి” అనేది నָא యొక్క ప్రోత్సాహ/తక్షణతను సహజంగా తెలియజేస్తుంది. וַיִּקְּדוּ మరియు וַיִּשְׁתַּחֲווּ మధ్య ఉన్న భేదాన్ని “తలవంచి సాష్టాంగపడ్డారు” అనే పదబంధం సముచితంగా కాపాడుతుంది. యెహోవా మరియు రాజు ఇద్దరి ఎదుట జరిగిన శారీరక నమస్కారాన్ని, దాని ధార్మిక స్వరూపంపై అదనపు వ్యాఖ్యానం రుద్దకుండా, అనువాదం నిలుపుతుంది.
