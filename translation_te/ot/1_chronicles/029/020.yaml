source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ לְ/כָל הַ/קָּהָ֔ל בָּֽרְכוּ נָ֖א אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וַ/יְבָרֲכ֣וּ כָֽל הַ/קָּהָ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י אֲבֹֽתֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּֽשְׁתַּחֲו֛וּ לַ/יהוָ֖ה וְ/לַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: te
  text: అప్పుడు దావీదు సమాజమంతటితో, “ఇప్పుడు మీ దేవుడైన యెహోవాను స్తుతించండి[a]” అన్నాడు. సమాజమంతా తమ పితరుల దేవుడైన యెహోవాను స్తుతించి, యెహోవా ఎదుట, రాజు ఎదుట తలవంచి సాష్టాంగపడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయచేసి మీ దేవుడైన యెహోవాను స్తుతించండి.” נָא అనే పదం విజ్ఞాపనను లేదా తక్షణతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం వారు ‘యెహోవా ఎదుట, రాజు ఎదుట’ సాష్టాంగపడ్డారని చెబుతుంది. ఇది శరీరంతో చేసిన గౌరవప్రదర్శనను వర్ణిస్తుంది; రాజు విషయంలో కొందరు దీన్ని ‘గౌరవం చేశారు’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: ఇప్పుడు ... స్తుతించండి
  rationale: ברך దేవుని ఉద్దేశించినప్పుడు ఆయనను కొనియాడడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. נָאలోని విజ్ఞాపన లేదా తక్షణ ప్రోత్సాహ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇప్పుడు’ ద్వారా సూచించాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: యెహోవాతో ఉన్న నిబంధనా సందర్భంలో אֱלֹהִים ఏకవచనార్థకంగా ఉంది.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: కలిసి కూడిన ప్రజాసమూహాన్ని సూచించే קָהָלకు సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: ఇశ్రాయేలు పూర్వీకులతో ఉన్న నిబంధనా-చారిత్రక సంబంధాన్ని, మూలంలోని పుంలింగ బహువచనాన్ని కాపాడుతుంది.
- source_word: וַיִּקְּדוּ
  choice: తలవంచి
  rationale: קדד వంగడాన్ని, ప్రత్యేకంగా తలను వంచడాన్ని సూచించగలదు. తరువాతి సంపూర్ణ సాష్టాంగ చర్యతో భేదాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: సాష్టాంగపడ్డారు
  rationale: שׁחה యొక్క హిత్పయేల్ రూపం శరీరాన్ని నేలకు వంచి నమస్కరించే చర్యను సూచిస్తుంది. ‘ఆరాధించారు’ అని భావవ్యాఖ్య చేయకుండా శారీరక చర్యను నిలుపుతుంది.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: యెహోవా ఎదుట, రాజు ఎదుట
  rationale: השתחוהతో ל ఉన్నప్పుడు ‘ఎదుట’ సహజంగా ఉంటుంది. రెండు పదాల ముందు దానిని పునరుక్తి చేయడం ద్వారా ఒకే శారీరక చర్య ఇద్దరి సమక్షంలో జరిగినట్లు చూపిస్తూ, ఇద్దరికీ ఒకే రకమైన దైవారాధన ఇచ్చారనే నిర్ణయాన్ని అనువాదం రుద్దదు.
theological_decisions:
- issue: ప్రజలు యెహోవా ఎదుటను రాజు ఎదుటను చేసిన చర్య
  choice: శారీరక చర్యనే స్పష్టంగా ఉంచి ‘యెహోవా ఎదుట, రాజు ఎదుట తలవంచి సాష్టాంగపడ్డారు’ అని అనువదించడం
  alternative: ‘యెహోవాను ఆరాధించి రాజుకు గౌరవం చేశారు’ లేదా ‘యెహోవాను, రాజును ఆరాధించారు’
  rationale: హీబ్రూ ఒకే శారీరక క్రియలను రెండు సంబంధపదాలతో ఉంచుతుంది. వాటిని వేర్వేరు భావపదాలుగా విభజించడం గానీ, రాజుకు దైవారాధన చేశారనే అర్థాన్ని రుద్దడం గానీ చేయకుండా మూలంలోని ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘సమాజం,’ ‘పితరులు,’ ‘యెహోవా’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, అర్థంకాని ప్రాచీన క్రియారూపాలను నివారించాం.
