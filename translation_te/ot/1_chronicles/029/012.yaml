source:
  edition: WLC
  text: וְ/הָ/עֹ֤שֶׁר וְ/הַ/כָּבוֹד֙ מִ/לְּ/פָנֶ֔י/ךָ וְ/אַתָּה֙ מוֹשֵׁ֣ל בַּ/כֹּ֔ל וּ/בְ/יָדְ/ךָ֖ כֹּ֣חַ וּ/גְבוּרָ֑ה וּ/בְ/יָ֣דְ/ךָ֔ לְ/גַדֵּ֥ל וּ/לְ/חַזֵּ֖ק לַ/כֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: te
  text: ఐశ్వర్యం, ఘనత రెండూ నీ సన్నిధి నుంచే వస్తాయి[a][b]. నీవు సమస్తాన్ని ఏలుతున్నావు. బలమూ పరాక్రమమూ నీ చేతిలో ఉన్నాయి; అందరినీ[d] గొప్పవారిగా చేయడమూ[c], బలపరచడమూ నీ చేతిలోనే ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ నుంచే వస్తాయి.’ హీబ్రూలో అక్షరార్థంగా ‘నీ ముందు నుండి.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఘనత’ను ‘మహిమ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘గొప్పవారిగా చేయడం’ అంటే ‘హెచ్చించడం’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘అందరినీ’ అని అనువదించిన హీబ్రూ పదాన్ని ‘అన్నిటినీ’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: ambiguity
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: ఐశ్వర్యం
  rationale: ఈ నామవాచకం సంపదను, సమృద్ధిని సూచిస్తుంది. ప్రార్థనా సందర్భంలోని ఉన్నత శైలికి ‘ఐశ్వర్యం’ సహజంగా సరిపోతుంది.
- source_word: הַכָּבוֹד
  choice: ఘనత
  rationale: ఇక్కడ సామాజిక గౌరవం, వైభవం అనే భావం ఉంది. ‘ఘనత’ ఈ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది; ‘మహిమ’ కూడా సాధ్యమైన అనువాదం.
- source_word: מִלְּפָנֶיךָ
  choice: నీ సన్నిధి నుంచే వస్తాయి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నీ ముఖము/సన్నిధి ముందు నుండి’ అని ఉంటుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ దేవుని సన్నిధి నుండి అవి వస్తాయనే మూలచిత్రాన్ని నిలుపుతుంది.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: నీవు సమస్తాన్ని ఏలుతున్నావు
  rationale: కృదంత రూపం నిరంతరమైన పరిపాలనను సూచిస్తుంది. ‘ఏలుతున్నావు’ ఆ కొనసాగుతున్న సార్వభౌమ పాలనను తెలియజేస్తుంది.
- source_word: בְיָדְךָ
  choice: నీ చేతిలో
  rationale: ఈ హీబ్రూ నుడికారం అధికారం, ఆధీనతను సూచిస్తుంది. స్పష్టమైన ‘చేతి’ రూపకాన్ని అనువాదంలో నిలిపింది.
- source_word: כֹּחַ
  choice: బలం
  rationale: దేవునిలో ఉన్న శక్తిసామర్థ్యాన్ని సూచిస్తుంది. తరువాతి גְבוּרָהతో సహజమైన జంటగా ఉంటుంది.
- source_word: גְבוּרָה
  choice: పరాక్రమం
  rationale: మహా శక్తి, సామర్థ్యం, వీరోచిత బలప్రదర్శన అనే భావాన్ని ఇస్తుంది; כֹּחַతో ఉన్న అర్థభేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: לְגַדֵּל
  choice: గొప్పవారిగా చేయడం
  rationale: హిఫీల్ రూపం ‘గొప్పగా చేయడం’ అని అర్థం. ఈ సందర్భంలో స్థాయిని పెంచడం లేదా హెచ్చించడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְחַזֵּק
  choice: బలపరచడం
  rationale: ‘బలంగా చేయడం’ అనే మూలభావానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: לַכֹּל
  choice: అందరినీ
  rationale: వ్యక్తులను గొప్పవారిగా చేసి బలపరచడం అనే తక్షణ సందర్భానికి ఇది సహజమైన తెలుగు. అయితే హీబ్రూ పదం విస్తృతంగా ‘అన్నిటినీ’ అని కూడా అర్థం కావచ్చు; ఆ విస్తృతిని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: מִלְּפָנֶיךָ అనే పదబంధం దేవుని సార్వభౌమత్వం, ఆశీర్వాదాల మూలంతో కలిగిన సంబంధం
  choice: నీ సన్నిధి నుంచే వస్తాయి
  alternative: నీ నుంచే వస్తాయి
  rationale: మూలంలోని ‘ముఖము/సన్నిధి ముందు నుండి’ అనే స్పష్టమైన చిత్రాన్ని పూర్తిగా సరళీకరించకుండా, సహజమైన తెలుగులో దేవుని సన్నిధే ఐశ్వర్యం, ఘనతకు మూలమని చూపుతుంది.
- issue: לַכֹּל యొక్క పరిధి
  choice: అందరినీ
  alternative: అన్నిటినీ
  rationale: వ్యక్తులను హెచ్చించడం, బలపరచడం అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం; అయితే హీబ్రూలోని సమగ్ర, నిర్దిష్టతలేని పరిధిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ అనువదించబడింది. మూలంలోని ‘సన్నిధి’ మరియు ‘చేతి’ రూపకాలు నిలుపబడ్డాయి.
