revisions:
- from: యాహ్వే, గొప్పతనం, శక్తి, వైభవం, విజయం[a], మహిమ నీవే; ఎందుకంటే ఆకాశాల్లోను భూమిమీదను ఉన్నదంతా నీదే. యాహ్వే, రాజ్యం నీదే; నీవు సమస్తానికీ అధిపతిగా ఉన్నతంగా ఉన్నావు.
