id: 1CH.29.11
reference: 1 Chronicles 29:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: te
  text: యాహ్వే, గొప్పతనం, శక్తి, వైభవం, విజయం[a], మహిమ నీకే చెందుతాయి; ఎందుకంటే ఆకాశాల్లోను భూమిమీదను ఉన్నదంతా నీదే. యాహ్వే, రాజ్యం నీదే; సమస్తానికీ శిరస్సుగా నీవు ఉన్నతుడవై ఉన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శాశ్వతత్వం,” లేదా “చిరస్థాయి ఆధిక్యత.” ఇక్కడి హీబ్రూ పదం נֵצַח విజయంతోపాటు నిలిచే సర్వోన్నతత్వాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా అందించాం.
- source_word: לְךָ
  choice: నీవే / నీదే
  rationale: స్వామ్యాన్ని సూచించే ఈ రూపం వాక్యంలో రెండుసార్లు ఉద్ఘాటనతో వస్తుంది. గుణాల జాబితాలో సహజమైన తెలుగు కోసం ‘నీవే’, సమస్తం మరియు రాజ్యం విషయంలో ‘నీదే’ వాడి ఆ పునరుక్తిని నిలిపాం.
- source_word: הַגְּדֻלָּה
  choice: గొప్పతనం
  rationale: మూలంలోని అమూర్త నామవాచకానికి నేరమైన, సామాన్య ఆధునిక తెలుగు సమానార్థకం.
- source_word: הַגְּבוּרָה
  choice: శక్తి
  rationale: బలం లేదా పరాక్రమం అనే భావాన్ని ఈ స్తోత్ర సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַתִּפְאֶרֶת
  choice: వైభవం
  rationale: అందం, ఘనత, ప్రకాశవంతమైన మహోన్నతత్వం అనే భావపరిధిని రాజసమైన స్తోత్రశైలిలో తెలియజేస్తుంది.
- source_word: הַנֵּצַח
  choice: విజయం
  rationale: ఈ స్తోత్ర గుణాల వరుసలో విజయము అనే భావం సందర్భోచితం; అయితే నిలిచియుండే ఆధిక్యత అనే అర్థసంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: הַהוֹד
  choice: మహిమ
  rationale: రాజసమైన ఘనత, ప్రతాపం అనే భావాన్ని తెలిపే సహజమైన తెలుగు పదం; תפארתకు వాడిన ‘వైభవం’తో అనవసర పునరుక్తి రాదు.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ఎందుకంటే ఆకాశాల్లోను భూమిమీదను ఉన్నదంతా
  rationale: כִּי యొక్క కారణార్థాన్ని, כֹל యొక్క సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది; హీబ్రూలోని బహువచన ‘ఆకాశాలు’ను కూడా ప్రతిబింబిస్తుంది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యం
  rationale: రాజ్యము, రాజరిక పాలన, సార్వభౌమాధికారం అనే భావాల్లో ఇక్కడ అత్యంత నేరమైన మరియు సహజమైన ఎంపిక.
- source_word: וְהַמִּתְנַשֵּׂא לְכֹל לְרֹאשׁ
  choice: నీవు సమస్తానికీ అధిపతిగా ఉన్నతంగా ఉన్నావు
  rationale: హీబ్రూ కృదంతంలోని ఉన్నత స్థితిని, לְרֹאשׁ లోని శిరస్సు/ముఖ్యుడు అనే ఆధిపత్య రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: נֵצַח యొక్క భావం
  choice: విజయం
  alternative: శాశ్వతత్వం / చిరస్థాయి ఆధిక్యత
  rationale: రాజసమైన స్తోత్రగుణాల వరుసలో ‘విజయం’ బలమైన సందర్భార్థం. అయినా ఈ హీబ్రూ పదానికి కాలాతీత స్థిరత్వం లేదా నిలిచే ఆధిక్యత అనే అర్థం ఉండవచ్చు కాబట్టి దానిని పాదసూచికలో వెల్లడించాం.
- issue: לְכֹל לְרֹאשׁ లోని ఆధిపత్య రూపకం
  choice: సమస్తానికీ అధిపతిగా
  alternative: అన్నిటికీ శిరస్సుగా / సమస్తానికి ముఖ్యునిగా
  rationale: ‘శిరస్సు’ అనే అక్షరార్థ రూపకం తెలుగులో ఈ సందర్భంలో అసహజంగా లేదా శరీరార్థంగా వినిపించవచ్చు. ‘అధిపతి’ ముఖ్యత్వం మరియు పరిపాలనా ఆధిక్యత రెండింటినీ స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, స్తోత్రానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడాం. మూలంలోని ‘నీదే/నీవే’ అనే ఉద్ఘాటిత స్వామ్య భావాన్ని, వరుసగా వచ్చే రాజస గుణాలను, చివరి సార్వభౌమాధికార భావాన్ని కాపాడాం.
