revisions:
- from: 'నా దేవుని మందిరం కోసం నా శక్తినంతటినీ ఉపయోగించి నేను సిద్ధం చేశాను: బంగారు వస్తువులకు బంగారం, వెండి వస్తువులకు వెండి, కంచు వస్తువులకు కంచు, ఇనుప వస్తువులకు ఇనుము, చెక్క వస్తువులకు కలప; గోమేధికపు రాళ్లు[a], పొదిగే అమరికలు[b], అంజనపు రాళ్లు[c], రంగురంగుల రాళ్లు[d], అన్ని రకాల విలువైన రాళ్లు, విస్తారంగా పాలరాతి రాళ్లు.'
  to: 'నా దేవుని మందిరం కోసం నా శక్తినంతటినీ ఉపయోగించి నేను సిద్ధం చేశాను: బంగారు వస్తువులకు బంగారం, వెండి వస్తువులకు వెండి, కంచు వస్తువులకు కంచు, ఇనుప వస్తువులకు ఇనుము, చెక్క వస్తువులకు కలప; ఒనిక్సు రాళ్లు[a], పొదుగులు[b], అంజనపు రాళ్లు[c], రంగురంగుల రాళ్లు[d], ప్రతి విలువైన రాయి, సమృద్ధిగా పాలరాతి రాళ్లు.'
  rationale: The revision removes a potentially misleading modern gemstone identification, avoids adding ‘kinds’ to the Hebrew expression for every precious stone, and improves the idiomatic rendering of the uncertain ornamental term מִלּוּאִים. All four footnote anchors remain attached to their relevant terms, and the notes preserve the source's lexical uncertainties.
  reviewer_model: gpt-5.6-terra
