translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. లోహాల జాబితాలోని హీబ్రూ సమాంతరతను సహజ తెలుగు నిర్మాణంతో నిలిపాం. అరుదైన రత్న, అలంకార పదాల విషయంలో మూలంలోని అనిశ్చితిని పాదసూచికల ద్వారా స్పష్టంగా కాపాడాం; అన్ని [a]–[d] సూచికలు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచాం.
