source:
  edition: WLC
  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: te
  text: 'నా దేవుని మందిరం కోసం నా శక్తినంతటినీ ఉపయోగించి నేను సిద్ధం చేశాను: బంగారు వస్తువులకు బంగారం, వెండి వస్తువులకు వెండి, కంచు వస్తువులకు కంచు, ఇనుప వస్తువులకు ఇనుము, చెక్క వస్తువులకు కలప; ఒనిక్సు రాళ్లు[a], పొదుగులు[b], అంజనపు రాళ్లు[c], రంగురంగుల రాళ్లు[d], ప్రతి విలువైన రాయి, సమృద్ధిగా పాలరాతి రాళ్లు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని కొన్ని రాళ్ల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. שֹׁהַם అనే పదానికి ఇక్కడ ‘ఒనిక్సు,’ שַׁיִשׁ అనే పదానికి ‘పాలరాయి’ అనే సంప్రదాయ అనువాదాలను అనుసరించాం; ఇతర గుర్తింపులు కూడా ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘పొదుగులు’ అని అనువదించిన מִלּוּאִים అనే పదానికి ‘అమరికలు,’ ‘కుదుర్లు,’ లేదా ‘అలంకారపు చేర్పులు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘అంజనపు రాళ్లు’ అని అనువదించిన אַבְנֵי פוּךְ అనే పదబంధం క్లిష్టమైనది. ఇది నల్లని అంజన ఖనిజంతో సంబంధమున్న రాళ్లను, అలంకారపు పొదుగును, లేదా మరొక శోభాయమాన పదార్థాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘రంగురంగుల రాళ్లు’ అని అనువదించిన רִקְמָה అనే పదం ఇతర సందర్భాల్లో అల్లికతో లేదా రంగుల నమూనాలతో చేసిన పనిని సూచించగలదు. ఇక్కడ రాళ్లు, నిర్మాణ సామగ్రి ఉన్న జాబితాను బట్టి ఈ అనువాదాన్ని ఎంచుకున్నాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: నా శక్తినంతటినీ ఉపయోగించి
  rationale: దావీదు తన శక్తి, సామర్థ్యం, వనరులన్నిటినీ వినియోగించాడనే వ్యక్తిగత తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הֲכִינוֹתִי
  choice: నేను సిద్ధం చేశాను
  rationale: పూర్తయిన సిద్ధపాటు చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְבֵית אֱלֹהַי
  choice: నా దేవుని మందిరం కోసం
  rationale: בַּיִת యొక్క అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, ఇక్కడ దేవాలయ నిర్మాణాన్ని సూచిస్తున్నందున ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది; ‘నా దేవుని’ అనే వ్యక్తిగత భక్తి భావం నిలుస్తుంది.
- source_word: הַזָּהָב לַזָּהָב
  choice: బంగారు వస్తువులకు బంగారం
  rationale: పదార్థాన్ని అదే పదార్థంతో చేయబోయే వస్తువులకు కేటాయించిన సమాంతర నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: וְהַכֶּסֶף לַכֶּסֶף
  choice: వెండి వస్తువులకు వెండి
  rationale: బంగారం మొదలైన పదార్థాల జాబితాలోని సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: וְהַנְּחֹשֶׁת לַנְּחֹשֶׁת
  choice: కంచు వస్తువులకు కంచు
  rationale: נְחֹשֶׁת రాగి లేదా కంచును సూచించగలదు; మందిర సామగ్రి సందర్భంలో సంప్రదాయబద్ధమైన ‘కంచు’ను ఎంచుకున్నాం.
- source_word: הַבַּרְזֶל לַבַּרְזֶל
  choice: ఇనుప వస్తువులకు ఇనుము
  rationale: మూలంలోని పదార్థ-నియామక సమాంతరతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְהָעֵצִים לָעֵצִים
  choice: చెక్క వస్తువులకు కలప
  rationale: మొదటి పదం తయారయ్యే వస్తువులను, రెండవది వాటికి కావలసిన ముడి పదార్థాన్ని సహజంగా వేరు చేస్తుంది.
- source_word: אַבְנֵי שֹׁהַם
  choice: గోమేధికపు రాళ్లు
  rationale: שֹׁהַם యొక్క ఖచ్చిత గుర్తింపు అనిశ్చితం; ‘గోమేధికం’ తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన రత్నపేరు. అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: וּמִלּוּאִים
  choice: పొదిగే అమరికలు
  rationale: రత్నాలను అమర్చే పొదుగులు, కుదుర్లు లేదా అలంకారపు అమరికలు అనే సాధ్యమైన భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: אַבְנֵי פוּךְ
  choice: అంజనపు రాళ్లు
  rationale: פּוּךְ సాధారణంగా నల్లని అంజనం లేదా యాంటిమనీ ఖనిజాన్ని సూచిస్తుంది. అస్పష్టమైన హీబ్రూ పదబంధానికి దగ్గరగా ఉండి ఊహాత్మక వివరణను నివారిస్తుంది.
- source_word: וְרִקְמָה
  choice: రంగురంగుల రాళ్లు
  rationale: רִקְמָה ఇతర సందర్భాల్లో అల్లిక లేదా ఎంబ్రాయిడరీ పనిని సూచించినా, రాళ్లు మరియు నిర్మాణ సామగ్రి జాబితాలో రంగుల వైవిధ్యమున్న రాళ్లు లేదా అలంకార రాతిపని భావం సందర్భోచితం.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: విస్తారంగా పాలరాతి రాళ్లు
  rationale: שַׁיִשׁను సంప్రదాయంగా మార్బుల్‌గా గుర్తిస్తారు; ‘పాలరాయి’ ఆధునిక తెలుగులో సహజమైన పదం. לָרֹב సమృద్ధిని ‘విస్తారంగా’ తెలియజేస్తుంది.
