id: 1CH.29.17
reference: 1 Chronicles 29:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: te
  text: నా దేవా, నీవు హృదయాన్ని పరిశీలిస్తావనీ, యథార్థతను ఇష్టపడతావనీ[a] నాకు తెలుసు. నేను యథార్థ హృదయంతో ఇవన్నీ ఇష్టపూర్వకంగా అర్పించాను. ఇప్పుడు ఇక్కడ ఉన్న[b] నీ ప్రజలు నీకు ఇష్టపూర్వకంగా అర్పించడాన్ని నేను సంతోషంతో చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యథార్థతలో ఆనందిస్తావు.”
    reason: תִּרְצֶה అనే క్రియ ఆనందించడం, ఇష్టపడడం లేదా అనుకూలంగా స్వీకరించడం అనే సమీప భావాలను కలిగి ఉండగలదు.
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “ఇక్కడ కనబడిన”; అంటే, “ఇక్కడ ఉన్న.”
    reason: נמצא అనే నిఫల్ రూపంలోని అక్షరార్థాన్నీ సందర్భోచిత భావాన్నీ తెలియజేస్తుంది.
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: హృదయాన్ని పరిశీలిస్తావు
  rationale: בֹּחֵן అనేది పరీక్షించడం లేదా లోతుగా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. దేవుడు అంతరంగ ఉద్దేశాలను ఎరిగి అంచనా వేస్తాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘పరిశీలిస్తావు’ తెలియజేస్తుంది; לֵבָב అనే ‘హృదయం’ రూపకాన్ని అలాగే ఉంచింది.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: యథార్థతలో ఆనందిస్తావు
  rationale: מֵישָׁרִים నైతిక నిష్కపటత్వం, సూటితనం, యథార్థతను సూచిస్తుంది; תִּרְצֶה సంతోషించడం లేదా అనుకూలంగా స్వీకరించడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం గుణాన్నీ దేవుని అనుకూల వైఖరినీ నిలుపుతుంది.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: నా హృదయ యథార్థతతో
  rationale: దావీదు అర్పించిన తీరును, అతని అంతరంగ నిష్కపటత్వాన్ని ఈ పదబంధం తెలియజేస్తుంది. మూలంలోని ‘హృదయం’ రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: הִתְנַדַּבְתִּי
  choice: ఇష్టపూర్వకంగా అర్పించాను
  rationale: נדב హిత్పయేల్ రూపం స్వచ్ఛందంగా, మనస్ఫూర్తిగా ఇవ్వడాన్ని సూచిస్తుంది. కానుకల సందర్భంలో ‘అర్పించాను’ అనేది ‘ఇచ్చాను’ కంటే తగినది.
- source_word: כָל אֵלֶּה
  choice: ఇవన్నీ
  rationale: ఈ సూచనాపదం ముందుగా పేర్కొన్న కానుకలను సూచిస్తుంది. ‘ఇవన్నీ’ సంక్షిప్తంగా, సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: ఇక్కడ ఉన్న నీ ప్రజలు
  rationale: נמצא నిఫల్ రూపానికి అక్షరార్థంగా ‘కనబడిన’ అని అర్థం రావచ్చు; ఈ సందర్భంలో అది ‘హాజరై ఉన్న’ అనే సహజ భావాన్ని ఇస్తుంది.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: నేను సంతోషంతో చూశాను
  rationale: בְשִׂמְחָה అనే పదబంధాన్ని దావీదు చూడటంతో అనుసంధానించి, మూల వాక్యనిర్మాణాన్నీ అతని ఆనందాన్నీ నిలుపుతుంది.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: నీకు ఇష్టపూర్వకంగా అర్పించడాన్ని
  rationale: ఇక్కడ కూడా נדב స్వచ్ఛంద అర్పణను సూచిస్తుంది. ముందు వచ్చిన క్రియతో పదసామ్యాన్ని నిలుపుతూ, క్రియకు ఉద్దేశించిన గ్రహీత దేవుడేనని స్పష్టం చేస్తుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ఇది దేవునికి నేరుగా చేసిన సంబోధన; ఆధునిక ప్రామాణిక తెలుగులో ‘నా దేవా’ సహజమైన, గౌరవప్రదమైన రూపం.
theological_decisions:
- issue: לֵבָב అనే మానవ స్వభావ సంబంధ పదం
  choice: అంతరంగ వ్యక్తిత్వం, ఆలోచనలు, సంకల్పాన్ని సూచించే ‘హృదయం’
  alternative: మనస్సు; అంతరంగం
  rationale: హీబ్రూ వాడుకలో ‘హృదయం’ భావోద్వేగాలకే పరిమితం కాక ఆలోచన, ఉద్దేశం, సంకల్పాన్ని కూడా కలిగి ఉంటుంది. అయినప్పటికీ దాన్ని ‘మనస్సు’గా కుదించకుండా మూల రూపకాన్ని నిలుపడం సముచితం.
- issue: בְשִׂמְחָה యొక్క అన్వయం
  choice: దావీదు చూడటానికి అన్వయించి ‘నేను సంతోషంతో చూశాను’
  alternative: ప్రజలు సంతోషంగా అర్పించారు
  rationale: పదక్రమం, సమీప క్రియ ఆధారంగా ఈ పదబంధం ‘చూశాను’ అనే క్రియను విశేషించడం సహజం. ప్రజల అర్పణ సంతోషభరితమైనదని భావించడం సాధ్యమైనా, దాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘హృదయం,’ ‘యథార్థత,’ ‘ఇష్టపూర్వకంగా అర్పించడం’ వంటి పదాలు మూలంలోని రూపక, నైతిక, స్వచ్ఛంద కానుక భావాలను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
