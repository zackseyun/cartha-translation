source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ לְ/כָל הַ/קָּהָ֔ל שְׁלֹמֹ֨ה בְנִ֥/י אֶחָ֛ד בָּֽחַר בּ֥/וֹ אֱלֹהִ֖ים נַ֣עַר וָ/רָ֑ךְ וְ/הַ/מְּלָאכָ֣ה גְדוֹלָ֔ה כִּ֣י לֹ֤א לְ/אָדָם֙ הַ/בִּירָ֔ה כִּ֖י לַ/יהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: te
  text: 'అప్పుడు రాజైన దావీదు సమాజమంతటితో ఇలా అన్నాడు: “నా కుమారుడైన సొలొమోను—దేవుడు ఎన్నుకున్న వాడు—ఇంకా యువకుడు, అనుభవం లేనివాడు. చేయవలసిన పని ఎంతో గొప్పది. ఎందుకంటే ఈ ప్రాసాదం[b] మనిషి కోసం కాదు; యెహోవా దేవుని కోసం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “ప్రాసాదం” అనే హీబ్రూ పదం కోటలాంటి లేదా రాజసమైన మహానిర్మాణాన్ని సూచించవచ్చు; ఈ సందర్భంలో అది నిర్మించబోయే యెహోవా దేవాలయాన్ని సూచిస్తుంది.
    reason: అరుదైన הַבִּירָה పదం యొక్క సందర్భార్థాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: הַקָּהָל
  choice: సమాజమంతటి
  rationale: సమకూడిన ప్రజాసమూహాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: נַעַר וָרָךְ
  choice: ఇంకా యువకుడు, అనుభవం లేనివాడు
  rationale: అక్షరార్థంగా ‘యువకుడు, సున్నితుడు/అపరిపక్వుడు’; సందర్భంలో బాధ్యతకు తగిన అనుభవం ఇంకా తక్కువగా ఉందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמְּלָאכָה גְדוֹלָה
  choice: చేయవలసిన పని ఎంతో గొప్పది
  rationale: నిర్మాణకార్యపు విస్తృతిని, ప్రాముఖ్యతను రెండింటినీ నిలుపుతుంది.
- source_word: הַבִּירָה
  choice: ఈ ప్రాసాదం
  rationale: ఈ అరుదైన పదం కోటలాంటి వైభవోపేత నిర్మాణాన్ని సూచిస్తుంది; ఇక్కడ దేవాలయాన్ని దేవుని రాజప్రాసాదంగా పేర్కొంటుంది.
- source_word: יהוה אֱלֹהִים
  choice: యెహోవా దేవుడు
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో కలిపిన మూలపాఠ రూపాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: אֶחָד (‘ఒకడు/ఒక్కడే’) అనే పదం సొలొమోను ఎంపికతో ఎలా అనుసంధానించాలి
  choice: ప్రధాన పాఠంలో ‘దేవుడు ఎన్నుకున్న నా కుమారుడు సొలొమోను’ అని, పాదసూచికలో పదశః రూపం మరియు సాధ్యమైన భావాలను చూపించడం
  alternative: ‘దేవుడు ఎన్నుకున్న ఏకైక కుమారుడు సొలొమోను’ లేదా ‘దేవుడు ఎన్నుకున్న ఆ ఒక్కడు’
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ‘ఏకైక కుమారుడు’ అని అనువదిస్తే దావీదుకు మరే కుమారుడూ లేడనే తప్పు భావం రావచ్చు; ‘ఒక్కడినే ఎన్నుకున్నాడు’ అనే బలమైన ప్రత్యేకత కూడా సందర్భం కంటే ఎక్కువగా నిర్ధారించవచ్చు.
- issue: ప్రాసాదం ఎవరి కోసం అన్న వాక్యంలోని వ్యత్యాసం
  choice: ‘మనిషి కోసం కాదు; యెహోవా దేవుని కోసం’ అనే ప్రత్యక్ష వ్యత్యాసాన్ని నిలుపడం
  alternative: ‘మానవ రాజు కోసం కాదు, దేవుని కోసం’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలంలోని సంక్షిప్తమైన theological contrast‌ను విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘యెహోవా’ ద్వారా దైవనామం, ‘సమాజం’ ద్వారా కూడిన ప్రజాసమూహం, ‘ప్రాసాదం’ ద్వారా దేవాలయపు రాజసమైన స్వరూపం నిలుపబడ్డాయి.
