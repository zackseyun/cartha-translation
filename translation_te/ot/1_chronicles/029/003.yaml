source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: te
  text: అంతేకాక, నా దేవుని మందిరం పట్ల నాకున్న ప్రీతి వల్ల[b], నా స్వంత విలువైన సంపదగా ఉన్న[a] బంగారాన్ని, వెండిని నా దేవుని మందిరానికి ఇచ్చాను—పవిత్ర మందిరం[c] కోసం నేను సిద్ధం చేసిన వాటన్నిటికీ మించి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రత్యేక నిధిగా ఉన్న’; హీబ్రూ పదం విలువైన సొంత ఆస్తిని లేదా ప్రత్యేకంగా దాచుకున్న సంపదను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా దేవుని మందిరాన్ని నేను ఇష్టపడుతున్నందువల్ల’; ఇక్కడి హీబ్రూ నిర్మాణం మందిరం పట్ల దావీదుకు ఉన్న ప్రీతిని, దాని కారణంగా అతడు ఇచ్చిన కానుకను తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పరిశుద్ధ స్థలం’; అక్షరార్థంగా ‘పవిత్రత గల ఇల్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: అంతేకాక
  rationale: మునుపటి వాక్యానికి అదనంగా, మరింత ప్రాముఖ్యమైన విషయాన్ని చేర్చే హీబ్రూ అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: నా దేవుని మందిరం పట్ల నాకున్న ప్రీతి వల్ల
  rationale: רצון ఇక్కడ దావీదుకు దేవుని మందిరంపై ఉన్న ఇష్టాన్ని లేదా ప్రీతిని సూచిస్తుంది. ב ఉపసర్గను సందర్భానుసారంగా కారణం మరియు ప్రీతి యొక్క లక్ష్యాన్ని తెలిపేలా అనువదించాం.
- source_word: יֶשׁ לִי סְגֻלָּה
  choice: నా దగ్గర సొంత నిధిగా ఉన్న
  rationale: יֶשׁ לִי స్వామ్యాన్ని సూచిస్తుంది; סְגֻלָּה విలువైన వ్యక్తిగత ఆస్తి లేదా ప్రత్యేక నిధిని సూచిస్తుంది. ముందుగా సిద్ధం చేసిన సామగ్రికి భిన్నంగా ఇది దావీదు సొంత సంపద అని స్పష్టమవుతుంది.
- source_word: זָהָב וָכָסֶף
  choice: బంగారాన్ని, వెండిని
  rationale: రెండు లోహాలకు నేరమైన, సాధారణ తెలుగు పదాలు; ఇచ్చిన వస్తువులుగా ఉన్నందున కర్మవిభక్తితో ఇచ్చాం.
- source_word: נָתַתִּי לְבֵית אֱלֹהַי
  choice: నా దేవుని మందిరానికి ఇచ్చాను
  rationale: పూర్తయిన కార్యాన్ని సాధారణ భూతకాలంతో సహజంగా తెలిపి, לְ ఉపసర్గ సూచించే గమ్యం లేదా గ్రహీతను ‘మందిరానికి’గా వ్యక్తం చేశాం.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: నేను సిద్ధం చేసిన వాటన్నిటికీ అదనం
  rationale: ముందుగా చేసిన ఏర్పాట్లకు మించి ఇచ్చిన అదనపు వ్యక్తిగత కానుక అనే తులనాత్మక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: పవిత్ర మందిరం కోసం
  rationale: అక్షరార్థంగా ‘పవిత్రత గల ఇల్లు/పవిత్ర మందిరం.’ ఇదే వాక్యంలో בית పదం పునరావృతమవుతున్నందున ‘మందిరం’ను కొనసాగించి, దాని ప్రతిష్ఠిత స్వభావాన్ని ‘పవిత్ర’తో నిలిపాం.
theological_decisions:
- issue: దావీదు మాటల్లో בית అనే ఆరాధనా స్థల పదం
  choice: మందిరం / పవిత్ర మందిరం
  alternative: దేవాలయం / పరిశుద్ధ స్థలం
  rationale: ‘మందిరం’ ఆధునిక తెలుగులో దేవుని నివాసస్థల భావాన్ని గౌరవప్రదంగా తెలియజేస్తూ, హీబ్రూ בית (‘ఇల్లు’) పదానికి దగ్గరగా ఉంటుంది. ‘పరిశుద్ధ స్థలం’ కూడా సాధ్యమే కానీ అది בית అనే నిర్మాణపదాన్ని స్పష్టంగా చూపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. בית పదాన్ని యాంత్రికంగా ‘ఇల్లు’గా కాక, సందర్భానికి సహజమైన ‘మందిరం’గా అనువదించాం. మూలంలోని వ్యక్తిగత సంపద, ముందస్తు ఏర్పాట్లకు అదనంగా ఇచ్చిన కానుక అనే భేదాన్ని నిలిపాం.
