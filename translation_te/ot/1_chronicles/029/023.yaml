id: 1CH.29.23
reference: 1 Chronicles 29:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: te
  text: అప్పుడు సొలొమోను తన తండ్రి దావీదు స్థానంలో రాజుగా యెహోవా సింహాసనం మీద కూర్చున్నాడు. అతడు వర్ధిల్లాడు; ఇశ్రాయేలీయులందరూ అతని మాట విన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి లోబడ్డారు” / “అతనికి విధేయులయ్యారు.” హెబ్రీయ పదబంధం శ్రద్ధగా వినడాన్ని సూచించగలదు; ఈ రాజసందర్భంలో విధేయత భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: కూర్చున్నాడు
  rationale: ישב అనే క్రియ యొక్క మూర్తమైన ‘కూర్చున్నాడు’ అనే భావాన్ని నిలుపుతుంది; ‘సింహాసనం మీద’ అనే సందర్భంలో రాజ్యాధికార స్వీకరణ సహజంగానే వ్యక్తమవుతుంది.
- source_word: כִּסֵּא יְהוָה
  choice: యెహోవా సింహాసనం
  rationale: ‘యెహోవా సింహాసనం’ అనే నిర్మాణాన్ని నేరుగా నిలుపుతూ, దావీదు వంశపు రాజ్యాధికారం దేవుని పరిపాలన కింద నిర్వహించబడుతుందనే వాక్యంలోని భావాన్ని వివరణాత్మకంగా మార్చకుండా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను ఆధునిక తెలుగు బైబిలు వాడుకలో పరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: לְ ఇక్కడ హోదా లేదా పాత్రను సూచిస్తుంది; ‘రాజుగా’ సహజమైన తెలుగు రూపం.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: తన తండ్రి దావీదు స్థానంలో
  rationale: రాజవంశ వారసత్వ సందర్భంలో תַּחַת కాలక్రమంలో కేవలం ‘తర్వాత’ అనే భావం కాకుండా, మరొకరి స్థానాన్ని స్వీకరించడాన్ని సూచిస్తుంది.
- source_word: וַיַּצְלַח
  choice: వర్ధిల్లాడు
  rationale: צלח విజయవంతంగా ముందుకు సాగడం లేదా సఫలత పొందడం అనే భావాన్ని ఇస్తుంది; ‘వర్ధిల్లాడు’ దైవానుగ్రహాన్ని వాక్యంలో లేనంతగా విస్తరించకుండా ఆ సఫలతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: అతని మాట విన్నారు
  rationale: שׁמע אל లోని వినడం అనే ప్రాథమిక రూపకాన్ని నిలుపుతుంది; రాజాధికార సందర్భంలో విధేయత భావం అంతర్లీనంగా ఉన్నా, దానిని ఒక్క అర్థానికి పరిమితం చేయదు.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: దేశమంతటినీ సమష్టిగా సూచించే హెబ్రీయ ప్రయోగాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సొలొమోను రాజ్యాధికారానికి ‘యెహోవా సింహాసనం’ అనే పదబంధానికి ఉన్న సంబంధం
  choice: ‘యెహోవా సింహాసనం’ అనే పదబంధాన్ని యథాతథంగా నిలిపి, సొలొమోను రాజ్యాధికారం యెహోవా పరిపాలనకు ప్రాతినిధ్యంగా ఉన్నదనే వాక్య భావాన్ని పాఠకునికి తెరిచి ఉంచడం.
  alternative: దీనిని కేవలం ‘రాజసింహాసనం’గా మార్చడం లేదా ‘యెహోవాకు చెందిన సింహాసనం’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: దినవృత్తాంతాల రచయిత దావీదు వంశపు రాజ్యాన్ని యెహోవా పరిపాలనతో ఉద్దేశపూర్వకంగా అనుసంధానిస్తాడు. అనువాదం ఆ వేదాంతపరమైన ఉత్కంఠను తగ్గించకూడదు, అలాగే తరువాతి సిద్ధాంతాలతో దానిని అతివ్యాఖ్యానించకూడదు.
- issue: וַיִּשְׁמְעוּ אֵלָיו లో వినడం మరియు విధేయత మధ్య భావసంబంధం
  choice: ప్రధాన పాఠంలో ‘అతని మాట విన్నారు’ అని ఉంచి, రాజసందర్భంలో ‘లోబడ్డారు/విధేయులయ్యారు’ అనే భావం ఉండవచ్చని పాదటిప్పణిలో తెలియజేయడం.
  alternative: ప్రధాన పాఠంలోనే ‘అతనికి విధేయులయ్యారు’ అని స్పష్టీకరించడం.
  rationale: హెబ్రీయ ప్రయోగం శ్రద్ధగా వినడాన్నీ, అధికార సందర్భంలో విధేయతనూ సూచించగలదు. ప్రధాన పాఠం మూలంలోని సహజ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీయ వాక్యంలోని వరుస ‘మరియు’లను యాంత్రికంగా పునరావృతం చేయకుండా తెలుగు ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా మలిచాం; భావక్రమం మాత్రం నిలిపాం.
