source:
  edition: WLC
  text: וְ/דִבְרֵי֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ שְׁמוּאֵ֣ל הָ/רֹאֶ֔ה וְ/עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל דִּבְרֵ֖י גָּ֥ד הַ/חֹזֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: te
  text: రాజైన దావీదు కార్యాలు[a]—మొదటివి మొదలుకొని చివరివరకు—దీర్ఘదర్శి సమూయేలు వృత్తాంతాల్లోను[b], ప్రవక్త నాతాను వృత్తాంతాల్లోను, దీర్ఘదర్శి గాదు వృత్తాంతాల్లోను[c] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజైన దావీదు మాటలు/విషయాలు, మొదటివి మరియు చివరివి.” ఇక్కడ ఈ హెబ్రీ ప్రయోగం అతని కార్యాలు లేదా అతని పాలనలో జరిగిన సంగతులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “సమూయేలు మాటలపై … నాతాను మాటలపై … గాదు మాటలపై రాయబడి ఉన్నాయి.” ఈ సందర్భంలో అవి లిఖిత ఆధారాలు కావడంతో “వృత్తాంతాల్లో” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: సమూయేలుకు వాడిన హెబ్రీ బిరుదు רֹאֶה (రోఏ), గాదుకు వాడినది חֹזֶה (ఖోజే). ప్రధాన పాఠ్యంలో రెండింటినీ “దీర్ఘదర్శి”గా అనువదించాం; గాదు బిరుదును “దర్శనాలు పొందినవాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: రాజైన దావీదు కార్యాలు
  rationale: דִּבְרֵי అనే పదానికి ప్రాథమికంగా ‘మాటలు/విషయాలు’ అనే పరిధి ఉన్నా, రాజు జీవితం లేదా పాలనను సంగ్రహించే ఈ సందర్భంలో అతని కార్యాలు, సంఘటనలు అనే భావం సహజం. ‘కార్యాలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הָרִאשֹׁנִים וְהָאֲחרֹנִים
  choice: మొదటివి మొదలుకొని చివరివరకు
  rationale: మూలంలోని ‘మొదటివి మరియు చివరివి’ అనే జంట దావీదు కార్యాల మొత్తం కాలవ్యాప్తిని సూచిస్తుంది. తెలుగు వాక్యంలో ‘మొదటివి మొదలుకొని చివరివరకు’ ఆ విస్తృతిని సహజంగా వ్యక్తం చేస్తూ మూల రూపాన్నీ గుర్తింపజేస్తుంది.
- source_word: הִנָּם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: הִנָּם లోని సూచనాత్మక/ఉద్ఘాటన బలం తెలుగులో విడిగా ‘ఇదిగో’ అని పెట్టితే కృత్రిమంగా వినిపిస్తుంది. ‘రాయబడి ఉన్నాయి’ అనే నిర్మాణం ఆధారగ్రంథాల్లో అవి నమోదై ఉన్నాయనే ప్రధాన భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: עַל דִּבְרֵי
  choice: వృత్తాంతాల్లో
  rationale: అక్షరార్థంగా ‘వారి మాటలపై’ అన్న నిర్మాణం ఉన్నప్పటికీ, ఇక్కడ లిఖిత ఆధారాలను సూచిస్తుంది. ‘వృత్తాంతాల్లో’ అనేది నిర్దిష్ట సాహిత్య ప్రక్రియను అతిగా నిర్ణయించకుండా నమోదైన రచనల భావాన్ని ఇస్తుంది.
- source_word: הָרֹאֶה
  choice: దీర్ఘదర్శి
  rationale: רֹאֶה ఒక ప్రవచన సంబంధమైన బిరుదు. ‘దీర్ఘదర్శి’ తెలుగు బైబిలు వాడుకలో పరిచితమైన, గౌరవప్రదమైన సమానార్థకం; నాతానుకు ఇచ్చిన ‘ప్రవక్త’ అనే వేరే బిరుదుతో తేడాను నిలుపుతుంది.
- source_word: הַנָּבִיא
  choice: ప్రవక్త
  rationale: נָבִיא కు ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన సమానార్థకం ‘ప్రవక్త’; నాతాను బిరుదును నేరుగా, సహజంగా అందిస్తుంది.
- source_word: הַחֹזֶה
  choice: దీర్ఘదర్శి
  rationale: חֹזֶה కూడా ప్రవచన సంబంధమైన దర్శన బిరుదు. సాధారణ తెలుగు పాఠకునికి సహజమైన ‘దీర్ఘదర్శి’ని ప్రధాన పాఠ్యంలో వాడి, רֹאֶה తో ఉన్న హెబ్రీ పదభేదాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: רֹאֶה మరియు חֹזֶה అనే రెండు ప్రవచన బిరుదుల అనువాదం
  choice: రెండింటినీ ప్రధాన పాఠ్యంలో ‘దీర్ఘదర్శి’గా అనువదించడం
  alternative: רֹאֶה ను ‘దీర్ఘదర్శి’గా, חֹזֶה ను ‘దర్శనికుడు’ లేదా ‘దర్శనాలు పొందేవాడు’గా వేరు చేయడం
  rationale: హెబ్రీలో ఇవి వేర్వేరు పదాలైనా, ఈ వాక్యంలో రెండూ ప్రవచన సేవకు సంబంధించిన బిరుదులు. తెలుగులో సహజంగా, గౌరవప్రదంగా వినిపించే రెండు సమాంతర సాధారణ బిరుదులు లేనందున ‘దీర్ఘదర్శి’ని రెండింటికీ వాడాం; అయితే మూలంలోని పదభేదాన్ని పాదసూచికలో దాచకుండా నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా, అయితే చారిత్రక వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని మూడు సమాంతర ఆధారాల నిర్మాణాన్ని ‘…లోను’ అనే పునరుక్తితో నిలిపాం. ‘ఇదిగో’ అనే కృత్రిమ ఉద్ఘాటనను చేర్చలేదు; వాక్యారంభంలోని וְ కు విడిగా ‘మరియు/ఇక’ అనకుండా తెలుగు ప్రవాహాన్ని సహజంగా ఉంచాం.
