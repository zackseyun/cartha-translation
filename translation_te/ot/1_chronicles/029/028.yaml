  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: te
  text: అతడు మంచి వృద్ధాప్యంలో, దినాలతో తృప్తి పొంది, ఐశ్వర్యం ఘనత కలిగి మరణించాడు.[a] అతని కుమారుడు సొలొమోను అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దినాలతో సంతృప్తి చెంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: వావ్-క్రమ కథన రూపం తదుపరి సంఘటనను తెలియజేస్తుంది; తెలుగులో సహజమైన కథన క్రమమే దీనిని వ్యక్తం చేస్తుంది.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: మంచి ముసలితనంలో
  rationale: మరణ సమయపు అనుకూలమైన వృద్ధాప్య స్థితిని తెలిపే హీబ్రూ ప్రయోగాన్ని రూపకానికి దగ్గరగా, అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: שְׂבַע יָמִים
  choice: ఆయుష్షుతో సంతృప్తి చెంది
  rationale: అక్షరార్థంగా ‘దినాలతో తృప్తి చెందినవాడు’; దీర్ఘమైన, పరిపూర్ణమైన జీవితం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ మూలంలోని సంతృప్తి భావాన్ని కాపాడుతుంది.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: ఐశ్వర్యం, ఘనత
  rationale: עֹשֶׁר భౌతిక సంపదను, כָבוֹד ఇక్కడ రాజసంబంధమైన గౌరవం లేదా ప్రతిష్ఠను సూచిస్తాయి.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: מלך అనే క్రియ రాజుగా పరిపాలించడాన్ని సూచిస్తుంది; వారసత్వ సందర్భంలో ఈ తెలుగు పదబంధం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవంశ వారసత్వ సూత్రంలో ‘అతని స్థానంలో’ అనే అర్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: అతని కుమారుడు సొలొమోను
  rationale: సంబంధాన్ని స్పష్టంగా తెలియజేసే సహజ తెలుగు పదక్రమం.
