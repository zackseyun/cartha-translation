review_pass:
  verdict: revise
  source_fidelity: The three Hebrew infinitives—“to keep,” “to do,” and “to build”—all express the purposes for which Solomon is to receive a whole heart. The draft’s participles “పాటించి, ... నెరవేర్చి” can imply actions already completed or actions sequentially performed, rather than the intended purpose. Changing them to infinitival purpose forms restores the Hebrew relationship.
  naturalness: The revised parallel infinitival phrasing is clear, idiomatic modern Telugu and makes the prayer’s structure easy to follow. “సంపూర్ణ హృదయం” appropriately retains the Hebrew heart metaphor.
  terminology: “ఆజ్ఞలు,” “సాక్ష్యాలు,” and “కట్టడలు” preserve the source’s three distinct covenantal/legal terms. “కోటలాంటి ఆలయం” is a reasonable contextual rendering of בִּירָה, while the note retains the lexical alternatives and explains the unusual expression.
  issues:
  - severity: medium
    issue: The verbal forms “పాటించి” and “నెరవేర్చి” are participial rather than purposive infinitival forms.
    rationale: They can be read as “having kept” and “having carried out,” whereas Hebrew לִשְׁמוֹר, וְלַעֲשׂוֹת, and וְלִבְנוֹת are coordinated infinitives dependent on the request to give Solomon a whole heart. Telugu “పాటించడానికి” and “నెరవేర్చడానికి” preserves that construction.
  revised_text: నా కుమారుడైన సొలొమోనుకు నీ ఆజ్ఞలను, నీ సాక్ష్యాలను, నీ కట్టడలను పాటించడానికి, వాటన్నిటినీ నెరవేర్చడానికి, నేను సిద్ధం చేసిన కోటలాంటి ఆలయాన్ని[a] కట్టడానికి సంపూర్ణ హృదయాన్ని ఇవ్వు.
