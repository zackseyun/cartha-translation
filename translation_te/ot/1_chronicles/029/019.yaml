  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: te
  text: నా కుమారుడైన సొలొమోనుకు నీ ఆజ్ఞలను, నీ సాక్ష్యాలను, నీ కట్టడలను పాటించడానికి, వాటన్నిటినీ నెరవేర్చడానికి, నేను సిద్ధం చేసిన కోటలాంటి ఆలయాన్ని[a] కట్టడానికి సంపూర్ణ హృదయాన్ని ఇవ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడున్న హెబ్రీ పదం ‘కోట’ లేదా ‘రాజభవనం’ అని కూడా అర్థమవుతుంది. ఇది వైభవమైన లేదా దృఢమైన నిర్మాణానికి వాడే అసాధారణ పదం; ఈ సందర్భంలో దావీదు సిద్ధం చేసి, సొలొమోను కట్టవలసిన ఆలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי
  choice: నా కుమారుడైన సొలొమోనుకు
  rationale: ప్రార్థనలోని పరోక్ష కర్మను సహజమైన తెలుగు పదక్రమంలో ఉంచి, ‘నా కుమారుడు’ అనే సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: תֵּן
  choice: ఇవ్వు
  rationale: మూలంలోని సూటియైన ప్రార్థనా విజ్ఞప్తిని అదనపు భావం చేర్చకుండా ప్రతిబింబిస్తుంది.
- source_word: לֵבָב שָׁלֵם
  choice: సంపూర్ణ హృదయం
  rationale: లֵבָבలోని అంతరంగ సంకల్పం/మనస్సు భావాన్నీ, שָׁלֵםలోని సంపూర్ణత మరియు అఖండత భావాన్నీ హృదయ రూపకాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: לִשְׁמוֹר
  choice: పాటించి
  rationale: ఆజ్ఞల సందర్భంలో ‘కాపాడడం’ కంటే ‘పాటించడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, విధేయత భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מִצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలు
  rationale: ఒడంబడిక సంబంధమైన ఆదేశాలకు సాధారణంగా, స్పష్టంగా సరిపోయే పదం.
- source_word: עֵדְוֺתֶיךָ
  choice: నీ సాక్ష్యాలు
  rationale: ఆజ్ఞలు, కట్టడలు అనే పక్కనున్న న్యాయపదాల నుంచి మూలంలోని పదభేదాన్ని నిలుపుతుంది.
- source_word: וְחֻקֶּיךָ
  choice: నీ కట్టడలు
  rationale: స్థిరంగా నిర్దేశించిన నియమాలు అనే భావాన్ని తెలుగులో సాంప్రదాయికమైన బైబిలు న్యాయపదంతో తెలియజేస్తుంది.
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: వాటన్నిటినీ నెరవేర్చి
  rationale: ముందున్న ఆజ్ఞలు, సాక్ష్యాలు, కట్టడలు అన్నిటినీ కార్యరూపంలో చేయడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: కోటలాంటి ఆలయాన్ని కట్టడానికి
  rationale: בִּירָה అనే అసాధారణ పదంలోని కోట లేదా వైభవమైన దృఢ నిర్మాణ భావాన్ని నిలుపుతూ, ఈ సందర్భంలో అది దావీదు సిద్ధం చేసిన యెహోవా ఆలయమని పాఠకుడికి స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: నేను సిద్ధం చేసిన
  rationale: హిఫిల్ రూపంలోని ‘సిద్ధపరచు/సన్నద్ధం చేయు’ భావాన్ని సహజంగా అందిస్తుంది; దావీదు నిర్మాణానికి ముందస్తు ఏర్పాట్లు చేశాడనే సందర్భానికీ సరిపోతుంది.
theological_decisions:
- issue: యెరూషలేము పవిత్రస్థలానికి సంబంధించి בִּירָה పదం అనువాదం
  choice: కోటలాంటి ఆలయం
  alternative: కోట; రాజభవనం; ఆలయం
  rationale: ఈ హెబ్రీ పదం కోటను లేదా వైభవమైన దృఢ నిర్మాణాన్ని సూచించగలదు; దినవృత్తాంతముల సందర్భంలో మాత్రం దావీదు సొలొమోను కట్టేందుకు సిద్ధం చేసిన దేవాలయ నిర్మాణాన్ని సూచిస్తుంది. ‘ఆలయం’ మాత్రమే అంటే ప్రత్యేక పదంలోని కోటసదృశ భావం పోతుంది; ‘కోట’ మాత్రమే అంటే లౌకిక సైనిక నిర్మాణమని తప్పుగా అర్థమయ్యే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభావంతోనూ సాధారణ పాఠకులకు అర్థమయ్యే రీతిలోనూ ఉంది. ‘సంపూర్ణ హృదయం’ మూల రూపకాన్ని నిలుపుతుంది; ‘సాక్ష్యాలు,’ ‘కట్టడలు’ అనే పదాలు వరుసగా ఉన్న హెబ్రీ న్యాయపదాల భేదాన్ని కాపాడుతాయి.
