source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: te
  text: యాహ్వే[a], మా పితరులైన అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు[b] దేవా, దీనిని నీ ప్రజల హృదయ ఆలోచనల ధోరణిగా ఎప్పటికీ కాపాడు[c]; వారి హృదయాన్ని నీ వైపు స్థిరపరచు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ దైవనామం יהוה (YHWH); దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు, అనేక అనువాదాలు ‘ప్రభువు’ అని ఇస్తాయి.
    reason: దైవనామానికి ఉన్న ప్రధాన అనువాద, లిప్యంతరీకరణ సంప్రదాయాలను తెలియజేయడం.
  - marker: b
    text: హీబ్రూ పాఠంలో ‘ఇశ్రాయేలు’ ఉంది; ఈ పితృపురుషుల సూత్రంలో కొందరు ‘యాకోబు’ అని ఆశించవచ్చు.
    reason: సుపరిచిత సూత్రంతో సమన్వయం చేయకుండా మూలపాఠంలోని పేరును స్పష్టం చేయడం.
  - marker: c
    text: 'మరింత అక్షరార్థంగా: ‘దీనిని నీ ప్రజల హృదయపు ఆలోచనల మొగ్గుగా ఎప్పటికీ కాపాడు.’ ఇక్కడ ‘మొగ్గు’ అని అనువదించిన పదానికి ‘అంతరంగ ధోరణి’ లేదా ‘రూపుదిద్దిన ఉద్దేశం’ అనే భావాలు కూడా ఉండవచ్చు.'
    reason: לְיֵצֶר מַחְשְׁבוֹת అనే గాఢమైన, కొంత అస్పష్టమైన హీబ్రూ నిర్మాణంలోని భావవిస్తృతిని భద్రపరచడం.
  - marker: d
    text: లేదా ‘వారి హృదయాన్ని నీ వైపు నడిపించు’; లేదా ‘వారి హృదయాన్ని నీ వైపు సిద్ధపరచు.’
    reason: כון హిఫీల్ క్రియకు సందర్భంలో సాధ్యమైన ప్రత్యామ్నాయ అర్థాలను చూపడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי
  choice: దేవా
  rationale: పితృపురుషుల పేర్లతో ఉన్న construct సంబంధాన్ని తెలుగులో సహజమైన సంబోధన నిర్మాణమైన ‘... దేవా’తో తెలిపాం.
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: మా పితరులైన అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు
  rationale: మూలంలోని ‘ఇశ్రాయేలు’ను ‘యాకోబు’గా సమన్వయపరచకుండా అలాగే ఉంచాం; నిర్దిష్ట పురుష పితృపురుషులను సూచించే אֲבֹתֵינוּను ‘మా పితరులు’గా అనువదించాం.
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: ఈ మనోభావం ఎప్పటికీ నిలిచి ఉండేలా కాపాడు
  rationale: ‘దీనిని ఎప్పటికీ కాపాడు’ అనే మూల భావాన్ని సందర్భంలోని ప్రజల స్వచ్ఛంద అంతరంగ వైఖరితో అనుసంధానించి సహజ తెలుగులో వ్యక్తపరిచాం; ‘మనోభావం’ సందర్భస్పష్టీకరణ.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: నీ ప్రజల హృదయ ఆలోచనల్లో
  rationale: יֵצֶר యొక్క ‘మొగ్గు/అంతరంగ ధోరణి/రూపుదిద్దిన ఉద్దేశం’ అనే అర్థవ్యాప్తిని ప్రధాన వాక్యంలో కఠిన పదబంధంగా కాకుండా సహజంగా తెలిపాం; ప్రత్యక్ష నిర్మాణాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: వారి హృదయాన్ని నీ వైపు స్థిరపరచు
  rationale: כון హిఫీల్‌కు ఇక్కడ ‘స్థిరపరచు, సిద్ధపరచు, దిశచూపు’ అనే సాధ్యార్థాలున్నాయి. ‘నీ వైపు స్థిరపరచు’ అనేది దృఢతను, దేవునివైపు మళ్లింపును రెండింటినీ నిలుపుతుంది; సమూహవాచక ఏకవచన ‘హృదయం’ను అలాగే ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ఉంచాం. ‘యాహ్వే’ హీబ్రూ నామానికి విస్తృతంగా అంగీకరించబడిన ఆధునిక లిప్యంతరీకరణ.
- issue: ఇశ్రాయేలు లేదా యాకోబు
  choice: ఇశ్రాయేలు
  alternative: యాకోబు
  rationale: పితృపురుషుల సుపరిచిత సూత్రంలో కొందరు ‘యాకోబు’ను ఆశించవచ్చు; అయితే ఈ వచనంలోని హీబ్రూ పాఠం יִשְׂרָאֵל అని చదువుతుంది.
- issue: హృదయాన్ని దేవునివైపు ‘స్థిరపరచడం’ లేదా ‘నడిపించడం’
  choice: స్థిరపరచు
  alternative: నడిపించు; సిద్ధపరచు
  rationale: כון హిఫీల్‌లోని దృఢపరచడం మరియు దేవునివైపు అభిముఖం చేయడం రెండింటినీ ‘నీ వైపు స్థిరపరచు’ వ్యక్తం చేస్తుంది; దేవుడు మానవ సంకల్పాన్ని ఎలా ప్రభావితం చేస్తాడనే ప్రశ్నను మరింత నిర్దిష్టంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధనను వాడాం. ‘హృదయం’ అనే బైబిలీయ అంతరంగ-సంకల్ప పదాన్ని ‘మనస్సు’గా కుదించలేదు. ప్రధాన వాక్యాన్ని సాధారణ పాఠకునికి సహజంగా ఉంచుతూ, హీబ్రూ పదబంధంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
