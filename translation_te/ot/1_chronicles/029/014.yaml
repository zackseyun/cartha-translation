source:
  edition: WLC
  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: te
  text: అయితే నేను ఎవడను, నా ప్రజలు ఎవరు, ఇలా ఇష్టపూర్వకంగా అర్పించగలిగే సామర్థ్యం మాకు ఉండేంతగా?[a] సమస్తమూ నీ నుంచే వస్తుంది; నీ చేతి నుంచే మేము నీకు ఇచ్చాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “ఇలా ఇష్టపూర్వకంగా అర్పించడానికి మేము బలాన్ని నిలుపుకోగలగడం/కూడగట్టుకోగలగడం?”'
    reason: నַעְצֹר כֹּחַ అనే హీబ్రూ ప్రయోగంలోని ‘బలాన్ని నిలుపుకోవడం/కూడగట్టుకోవడం’ అనే పదశః భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וְכִי
  choice: అయితే
  rationale: దావీదు ప్రార్థనలో వినయపూర్వకమైన వ్యత్యాసాన్ని, కొత్త మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: నేను ఎవడిని, నా ప్రజలు ఎవరు
  rationale: מִי అనే ప్రశ్నార్థకం వ్యక్తుల స్థానం లేదా యోగ్యతను ప్రశ్నించే అలంకారిక ప్రశ్న. దావీదు పురుష వక్త కాబట్టి ‘ఎవడిని’ సహజంగా సరిపోతుంది.
- source_word: נַעְצֹר כֹּחַ
  choice: సామర్థ్యం మాకు ఉండటానికి
  rationale: పదశః బలాన్ని నిలుపుకోవడం లేదా కూడగట్టుకోవడం అనే భావమున్నా, సందర్భంలో ఏదైనా చేయగల సామర్థ్యం లేదా శక్తి కలిగి ఉండడాన్ని సూచిస్తుంది.
- source_word: לְהִתְנַדֵּב
  choice: ఇష్టపూర్వకంగా అర్పించగల
  rationale: נדב హిత్పయేల్ రూపం స్వచ్ఛందంగా, మనస్ఫూర్తిగా కానుక ఇవ్వడాన్ని సూచిస్తుంది. ‘అర్పించు’ కానుక సందర్భాన్ని, ‘ఇష్టపూర్వకంగా’ స్వచ్ఛందతను కాపాడుతాయి.
- source_word: כָּזֹאת
  choice: ఇలా
  rationale: ముందు వివరించిన అసాధారణమైన ఉదార అర్పణను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: מִמְּךָ הַכֹּל
  choice: సమస్తమూ నీ నుంచే వస్తుంది
  rationale: అన్నిటికీ దేవుడే మూలమనే వాక్య భావాన్ని స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמִיָּדְךָ
  choice: నీ చేతిలోనుంచి వచ్చినదే
  rationale: దేవుని చేయి సమకూర్పుకు మూలమనే హీబ్రూ రూపకాన్ని నిలుపుతూ, తెలుగు వాక్యంలో భావసంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: נָתַנּוּ לָךְ
  choice: మేము నీకు ఇచ్చాము
  rationale: పూర్తయిన అర్పణ చర్యను నేరుగా తెలియజేస్తూ, ‘నీకు’ అనే లక్ష్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని యాజమాన్యం మరియు మానవుల అర్పణ
  choice: సమస్తమూ దేవుని నుంచే వస్తుందని, ప్రజలు దేవుని చేతిలోనుంచి పొందినదానినే ఆయనకు ఇచ్చారని నేరుగా అనువదించడం
  alternative: ‘ఇప్పటికే నీదైనదానినే నీకు తిరిగి ఇచ్చాము’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలపాఠం దేవుడే సమస్తానికి మూలమని, అర్పించినది ఆయన చేతిలోనుంచి వచ్చిందని చెబుతుంది; ‘తిరిగి’ లేదా యాజమాన్యంపై మరింత వ్యవస్థీకృత సిద్ధాంత భాషను పాఠంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధన (‘నీ’) వాడబడింది. అలంకారిక ప్రశ్న, స్వచ్ఛంద అర్పణ భావం, దేవుని ‘చేయి’ అనే మూలభాషా రూపకం నిలుపబడ్డాయి.
