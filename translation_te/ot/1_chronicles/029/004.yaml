  to: ఓఫీరు నుండి వచ్చిన బంగారంలో మూడు వేల తలాంతులు[a], శుద్ధి చేసిన వెండిలో ఏడు వేల తలాంతులు[b]—భవనాల గోడలను పొరగా కప్పడానికి,
