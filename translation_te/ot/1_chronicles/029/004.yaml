translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వచనం ముందరి వాక్యానికి కొనసాగింపుగా ఉన్నందున మూలంలోని జాబితా నిర్మాణాన్ని, చివరి విరామాన్ని నిలిపాము. రెండు పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
