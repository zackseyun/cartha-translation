source:
  edition: WLC
  text: שְׁלֹ֧שֶׁת אֲלָפִ֛ים כִּכְּרֵ֥י זָהָ֖ב מִ/זְּהַ֣ב אוֹפִ֑יר וְ/שִׁבְעַ֨ת אֲלָפִ֤ים כִּכַּר כֶּ֨סֶף֙ מְזֻקָּ֔ק לָ/ט֖וּחַ קִיר֥וֹת הַ/בָּתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: te
  text: ఓఫీరు నుండి వచ్చిన బంగారంలో మూడు వేల తలాంతులు[a], శుద్ధి చేసిన వెండిలో ఏడు వేల తలాంతులు[b]—భవనాల గోడలను పొరగా కప్పడానికి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఓఫీరు బంగారం.’ హెబ్రీ పదబంధం బంగారం ఓఫీరు నుండి వచ్చినదని లేదా ‘ఓఫీరు బంగారం’ అనే వివరణాత్మక సంబంధాన్ని సూచిస్తున్నదని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తలాంతు’ అనేది ప్రాచీన బరువు ప్రమాణం; ఇక్కడ అది నైపుణ్యం లేదా సామర్థ్యాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים כִּכְּרֵי זָהָב
  choice: మూడు వేల తలాంతుల బంగారం
  rationale: సంఖ్యను నేరుగా అందిస్తూ, כִּכָּר అనే ప్రాచీన పెద్ద బరువు ప్రమాణాన్ని సంప్రదాయంగా గుర్తించదగిన ‘తలాంతు’తో నిలిపాము.
- source_word: מִזְּהַב אוֹפִיר
  choice: ఓఫీరు బంగారంలోనుండి
  rationale: מִן ఉపసర్గలోని మూలం లేదా ఉద్భవస్థానం భావాన్ని నిలిపి, ఓఫీరును స్థలనామంగా లిప్యంతరీకరించాము; హెబ్రీలోని సంబంధ నిర్మాణానికి దగ్గరగా ఉంది.
- source_word: וְשִׁבְעַת אֲלָפִים כִּכַּר כֶּסֶף
  choice: ఏడు వేల తలాంతుల వెండి
  rationale: వెండి అనే లోహార్థాన్ని, దాని పరిమాణాన్ని సూచించే చారిత్రక బరువు ప్రమాణంతో సహజ తెలుగు క్రమంలో అందించాము.
- source_word: מְזֻקָּק
  choice: శుద్ధిచేసిన
  rationale: లోహాన్ని శుద్ధి ప్రక్రియకు గురిచేసినట్లు తెలిపే నిష్క్రియార్థక కృదంత భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָטוּחַ
  choice: పూత పూయడానికి
  rationale: గోడల ఉపరితలాన్ని విలువైన లోహంతో కప్పే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; సాధారణ సున్నం పూత అనే భావానికి మాత్రమే పరిమితం చేయదు.
- source_word: קִירוֹת הַבָּתִּים
  choice: భవనాల గోడలకు
  rationale: בָּתִּים అక్షరార్థంగా ‘ఇళ్లు’ అయినప్పటికీ, దేవాలయ నిర్మాణ సందర్భంలో అనుబంధ నిర్మాణాలు లేదా గదులను కలుపుకొనే విస్తృతమైన ‘భవనాలు’ సహజంగా సరిపోతుంది.
