id: 1CH.29.7
reference: 1 Chronicles 29:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: te
  text: దేవుని మందిర సేవ కోసం వారు ఐదువేల తలాంతుల బంగారాన్ని, పదివేల దరిక్కులను[a], పదివేల తలాంతుల వెండిని, పదెనిమిదివేల తలాంతుల కంచును, లక్ష తలాంతుల ఇనుమును ఇచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దరిక్కు’ అనేది పర్షియా దేశపు బంగారు నాణెం.
    reason: cultural_note
  - marker: b
    text: ‘తలాంతు’ అనేది ప్రాచీన కాలంలోని పెద్ద బరువు ప్రమాణం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: వారు ... ఇచ్చారు
  rationale: נתן అనే సాధారణ క్రియను సహజంగా, పూర్తయిన కార్యంగా వ్యక్తపరుస్తుంది; సందర్భం వల్ల ఇది విరాళమని తెలుస్తున్నా, మూలంలోని సాధారణ భావాన్ని కాపాడుతుంది.
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిర సేవ కోసం
  rationale: עֲבוֹדָהలోని పని/సేవ భావాన్ని ‘సేవ’ నిలుపుతుంది. בֵּית הָאֱלֹהִיםను తెలుగులో సహజంగా ‘దేవుని మందిరం’గా ఇచ్చాం; ఇది నిర్మాణానికే పరిమితం చేయదు.
- source_word: כִּכָּרִים
  choice: తలాంతులు
  rationale: ఇది ప్రాచీన పెద్ద బరువు ప్రమాణం. తెలుగు బైబిలు పాఠకులకు పరిచితమైన చారిత్రక పదాన్ని ఉంచి, అపార్థం నివారించేందుకు పాదటిప్పణి ఇచ్చాం.
- source_word: אֲדַרְכֹנִים
  choice: దరిక్కులు
  rationale: పర్షియా బంగారు నాణేల చారిత్రక ప్రత్యేకతను నిలుపుటకు లిప్యంతరీకరణ చేశాం; సాధారణంగా ‘బంగారు నాణేలు’ అనడం మూలంలోని నిర్దిష్టతను కోల్పోతుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలదు; ఆలయ సామగ్రి సందర్భంలో సంప్రదాయబద్ధమైన, సంభావ్యమైన భావం ‘కంచు’.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: పదెనిమిదివేల
  rationale: హీబ్రూ వాక్యనిర్మాణంలో ‘పదివేలు మరియు ఎనిమిదివేలు’ కలిపి 18,000ను సూచిస్తుంది; తెలుగులో సహజంగా మొత్తాన్ని ఇచ్చాం.
- source_word: מֵאָה אֶלֶף
  choice: లక్ష
  rationale: 100,000కు ఆధునిక తెలుగులో సహజమైన సంఖ్యాపదం; మూల పరిమాణాన్ని యథాతథంగా తెలియజేస్తుంది.
