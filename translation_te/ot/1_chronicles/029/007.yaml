  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వస్తువుల జాబితాలో విభక్తులను స్పష్టంగా ఉంచి పఠనసౌలభ్యం కల్పించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
