translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని దీర్ఘ సమాంతర శ్రేణిని నిలుపుతూ, విడిగా ఇచ్చిన వచనం వాక్యంగా అర్థమయ్యేందుకు ముందు వచనంలోని క్రియను భావానుసారంగా పునరుక్తం చేసి పాదటిప్పణిలో తెలిపాం.
