source:
  edition: WLC
  text: עִ֥ם כָּל מַלְכוּת֖/וֹ וּ/גְבוּרָת֑/וֹ וְ/הָ/עִתִּ֗ים אֲשֶׁ֨ר עָבְר֤וּ עָלָי/ו֙ וְ/עַל יִשְׂרָאֵ֔ל וְ/עַ֖ל כָּל מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: te
  text: అతని పరిపాలన అంతటితోపాటు, అతని పరాక్రమం, అతనిపై, ఇశ్రాయేలుపై, దేశాల రాజ్యాలన్నిటిపైనా గడిచిన కాలాలు కూడా నమోదు చేయబడ్డాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి సంభవించిన కాలాలు.” హీబ్రూ నుడికారంలో అక్షరార్థంగా “అతనిపై గడిచిన [కాలాలు]” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “నమోదు చేయబడ్డాయి” అనే మాట ముందు వచనంలోని వ్రాతపూర్వక వృత్తాంతాల సందర్భాన్ని బట్టి ఇక్కడ పునరుక్తమైంది; హీబ్రూ వాక్యంలో ఈ భాగం ముందు వచనాన్ని కొనసాగిస్తుంది.
    reason: discourse_clarity
lexical_decisions:
- source_word: עִם
  choice: తోపాటు
  rationale: మునుపటి వచనభాగంలో పేర్కొన్న లిఖితవివరాలకు ఈ అంశాలు కూడా జతగా ఉన్నాయని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַלְכוּתוֹ
  choice: అతని పరిపాలన అంతటిని
  rationale: దావీదు పాలించిన కాలం మరియు పాలనను సూచించే భావానికి ‘పరిపాలన’ సహజంగా సరిపోతుంది; ‘రాజ్యం’ అనే భూభాగార్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: גְבוּרָתוֹ
  choice: అతని పరాక్రమాన్ని
  rationale: బలం, శౌర్యం, ఘనకార్యాలు అనే భావవిస్తృతిని ‘పరాక్రమం’ సంక్షిప్తంగా నిలుపుతుంది; దీనిని కేవలం కార్యాలుగా పరిమితం చేయదు.
- source_word: הָעִתִּים
  choice: కాలాలను
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ దావీదు, ఇశ్రాయేలు, ఇతర రాజ్యాలు ఎదుర్కొన్న కాలపరిస్థితులను సూచిస్తుంది.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: అతని మీదుగా గడిచిన
  rationale: ‘మీదుగా దాటిపోయిన’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా సాధ్యమైనంత వరకు నిలుపుతుంది.
- source_word: וְעַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీదుగా
  rationale: అతని మీదుగా, ఇశ్రాయేలు మీదుగా, రాజ్యాల మీదుగా అనే మూలంలోని సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: దేశాల రాజ్యాలన్నిటి
  rationale: ‘దేశాలు/భూభాగాలు’ అనే హీబ్రూ బహువచనాన్ని నిలుపుతుంది; ‘భూమంతటి రాజ్యాలు’ అనే అతివిస్తృత భావాన్ని చేర్చదు.
