revisions:
- from: అతని పరిపాలన అంతటితోపాటు, అతని పరాక్రమాన్ని, అతని మీదుగా[a], ఇశ్రాయేలు మీదుగా, దేశాల రాజ్యాలన్నిటి మీదుగా గడిచిన కాలాలను కూడా నమోదు చేశారు.[b]
  to: అతని పరిపాలన అంతటితోపాటు, అతని పరాక్రమం, అతనిపై, ఇశ్రాయేలుపై, దేశాల రాజ్యాలన్నిటిపైనా గడిచిన కాలాలు కూడా నమోదు చేయబడ్డాయి.[a][b]
  rationale: The revision preserves the source's list structure and its figurative ‘times passed over’ wording, while replacing potentially spatial Telugu phrasing with idiomatic ‘పై’ constructions. It uses a passive verb to complete the verse in Telugu and accurately signals by footnote that the verb is supplied from the preceding verse's context.
