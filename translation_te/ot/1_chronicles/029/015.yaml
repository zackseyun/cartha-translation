id: 1CH.29.15
reference: 1 Chronicles 29:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: te
  text: ఎందుకంటే, మా పితరులందరిలాగే మేము నీ సన్నిధిలో పరదేశులం[a], తాత్కాలిక నివాసులం[b]. భూమిమీద మా రోజులు నీడలాంటివి; నిరీక్షణ ఏదీ లేదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విదేశీయులం.’ ఇక్కడ తమ స్వదేశం కాని చోట నివసించేవారనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘స్థిర హక్కులు లేని నివాసులం.’
    reason: lexical_alternative
  - marker: c
    text: ఈ సందర్భంలో ఈ మాట భూమిమీద మానవ జీవితం క్షణభంగురమని సూచిస్తుంది; దేవునిలో నిరీక్షణ లేదని తప్పనిసరిగా ప్రకటించడం కాదు.
    reason: contextual_clarification
lexical_decisions:
- source_word: גֵרִים
  choice: పరదేశులం
  rationale: ఈ పదం కేవలం ప్రయాణికులను కాక, స్వదేశీయ హక్కులు లేకుండా ఇతరుల మధ్య నివసించేవారిని సూచిస్తుంది. ‘పరదేశులు’ అనే పదం ఆ సామాజిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖం ఎదుట.’ ప్రార్థనలో దేవుని సమక్షాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు వ్యక్తీకరణగా ‘నీ సన్నిధిలో’ ఎంచుకున్నాం.
- source_word: תוֹשָׁבִים
  choice: తాత్కాలిక నివాసులం
  rationale: ఒక చోట నివసిస్తున్నప్పటికీ అక్కడ శాశ్వతమైన లేదా స్వదేశీయ స్థానం లేనివారిని ఈ పదం సూచిస్తుంది. ముందున్న גֵרִיםతో సమాంతర భావాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: మా పితరులందరిలాగే
  rationale: ప్రస్తుత తరాన్ని ఇశ్రాయేలు పూర్వ తరాలతో పోల్చే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది. ‘పితరులు’ మూలంలోని పురుషవాచక చారిత్రక సూచనను కాపాడుతుంది.
- source_word: כַּצֵּל
  choice: నీడలాంటివి
  rationale: మానవ జీవితం క్షణభంగురమనే మూల రూపకాన్ని సహజమైన తెలుగులో యథాతథంగా ఉంచుతుంది.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: భూమిమీద మా రోజులు
  rationale: కాలం, స్థలం రెండింటినీ తెలిపే మూల పదబంధాన్ని స్పష్టంగా, నేరుగా అనువదిస్తుంది.
- source_word: וְאֵין מִקְוֶה
  choice: నిరీక్షణ ఏదీ లేదు
  rationale: מִקְוֶהకు ‘నిరీక్షణ/ఆశ’ అనే అర్థం ఉంది. ‘నిరీక్షణ’ మూలంలోని తెరవబడిన భావాన్ని నిలుపుతూ, వాక్యంలోని మానవ అశాశ్వతతకు సంబంధించిన గంభీరతను అనవసరంగా వివరించి పరిష్కరించదు.
theological_decisions:
- issue: וְאֵין מִקְוֶה అనే మాట మానవ మరణశీలత సందర్భంలో ఏ భావం ఇస్తుంది?
  choice: ‘నిరీక్షణ ఏదీ లేదు’ అని ఎలాంటి వివరణాత్మక పదాన్ని ప్రధాన వాక్యంలో చేర్చకుండా అనువదించాం.
  alternative: ‘శాశ్వత నిరీక్షణ లేదు’ లేదా ‘నిలిచే అవకాశం లేదు.’
  rationale: ఈ వాక్యం భూమిమీద మానవ జీవితం క్షణభంగురమని నొక్కిచెబుతుంది. అయితే మూలంలో ‘భూసంబంధమైన’ లేదా ‘శాశ్వతమైన’ అనే పరిమితి లేదు. అందువల్ల ప్రధాన పాఠ్యంలో గల గంభీరమైన theological tensionను నిలిపి, సందర్భ సూచనను పాదసూచికలో మాత్రమే ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన ధోరణితో అనువదించాం. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ, ‘నీడ’ అనే మూల రూపకాన్ని మరియు చివరి మాటలోని గంభీరమైన అస్పష్టతను నిలిపాం.
