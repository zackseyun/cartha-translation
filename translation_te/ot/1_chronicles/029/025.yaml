id: 1CH.29.25
reference: 1 Chronicles 29:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: te
  text: యాహ్వే సొలొమోనును ఇశ్రాయేలీయులందరి దృష్టిలో అత్యంత గొప్పవాడిగా చేశాడు. సొలొమోనుకు ముందు ఇశ్రాయేలును పాలించిన ఏ రాజుకూ లేనంత రాజవైభవాన్ని[a] అతనికి అనుగ్రహించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాజతేజస్సు’; లేదా ‘రాజరిక మహిమ.’
    reason: הוֹד מַלְכוּת అనే పదబంధం వైభవం, తేజస్సు, మహిమ అనే సమీపార్థాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: అత్యంత గొప్పవాడిగా చేశాడు
  rationale: גדל హిఫిల్ రూపంలోని కారణార్థాన్ని ‘గొప్పవాడిగా చేశాడు’ తెలియజేస్తుంది; לְמַעְלָה ఇక్కడ తీవ్రతను సూచిస్తున్నందున ‘అత్యంత’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి దృష్టిలో
  rationale: అక్షరార్థమైన ‘కళ్ల ఎదుట’ కంటే, ప్రజలందరికీ కనిపించే విధంగా లేదా వారి గుర్తింపులో అనే హీబ్రూ నుడికార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתֵּן עָלָיו
  choice: అతనికి అనుగ్రహించాడు
  rationale: అక్షరార్థంగా ‘అతని మీద ఉంచాడు/ఇచ్చాడు’; ఇక్కడ గౌరవాన్ని ప్రసాదించడం అనే భావం ఉన్నందున ‘అనుగ్రహించాడు’ సహజమైన, గంభీరమైన సమానార్థకం.
- source_word: הוֹד מַלְכוּת
  choice: రాజవైభవం
  rationale: הוֹד లోని మహిమ, తేజస్సు, వైభవం అనే భావాన్ని మַלְכוּת సూచించే రాజరిక పరిధితో కలిపి సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాలించిన అతనికి ముందటి ఏ రాజుకూ లేనంత
  rationale: లְפָנָיוను కాలపరంగా ‘అతనికి ముందు’ అని, עַל יִשְׂרָאֵלను ఇశ్రాయేలుపై రాజ్యాధికారంగా గ్రహించి, సంబంధవాక్యాన్ని సహజమైన తెలుగులో అందించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన వచనశైలిని ఉపయోగించాం. ‘రాజవైభవం’ వద్దే [a] సూచికను ఉంచి, దానికి సంబంధించిన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
