source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֤ר מָלַךְ֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֥ם מָלַ֖ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: te
  text: అతడు ఇశ్రాయేలును పాలించిన కాలం నలభై సంవత్సరాలు. హెబ్రోనులో అతడు ఏడు సంవత్సరాలు పాలించాడు; యెరూషలేములో ముప్పైమూడు సంవత్సరాలు పాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: అతడు ... పాలించిన కాలం
  rationale: హీబ్రూ ‘అతడు పాలించిన దినాలు’ అనే కాలవ్యవధి సూచక నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘పాలించిన కాలం’ అని అనువదించాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: מָלַךְ עַל అంటే ఒక ప్రజపై రాజుగా పరిపాలించడం. తెలుగులో ‘ఇశ్రాయేలును పాలించాడు’ సహజమైన ప్రయోగం; మూలంలో లేని ‘ఇశ్రాయేలంతటిని’ చేర్చలేదు.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా నిర్మాణానికి సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: హెబ్రోనులో అతడు ఏడు సంవత్సరాలు పాలించాడు
  rationale: స్థల సూచక בְను ‘లో’తో, מָלַךְను రాజ్యపాలన సందర్భానికి తగిన ‘పాలించాడు’తో అందించాం; మూలంలోని సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: యెరూషలేములో ముప్పైమూడు సంవత్సరాలు పాలించాడు
  rationale: స్థలపేరు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపంలో ఇచ్చి, సంఖ్యను సహజమైన సంయుక్త సంఖ్యగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘రాజ్యమేలాడు’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘పాలించాడు’ ఎంచుకున్నాం. మొదటి హీబ్రూ వాక్యంలోని ‘దినాలు’ అనే నుడికారాన్ని అక్షరానువాదం చేయకుండా అర్థసహజమైన ‘కాలం’గా ఇచ్చాం.
