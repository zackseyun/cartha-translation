id: 1CH.29.21
reference: 1 Chronicles 29:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: te
  text: ఆ రోజుకు మరుసటి రోజున[a] వారు యెహోవాకు బలులు అర్పించారు; యెహోవాకు దహనబలులుగా వెయ్యి కోడెలను, వెయ్యి పొట్టేళ్లను, వెయ్యి గొర్రెపిల్లలను, వాటికి సంబంధించిన పానార్పణలను[b] అర్పించారు. ఇంకా, ఇశ్రాయేలు ప్రజలందరి కోసం[c] సమృద్ధిగా బలులు అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరుసటి రోజున.’ హీబ్రూలో అక్షరార్థంగా ‘ఆ రోజుకు తరువాతి రోజున’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పానార్పణలు’ అంటే జంతుబలులతోపాటు పోసి అర్పించే ద్రవార్పణలు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘ఇశ్రాయేలు ప్రజలందరి తరఫున.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: బలులు అర్పించారు
  rationale: హీబ్రూ క్రియ, దానికి సంబంధించిన నామవాచకం బలి వధను/అర్పణను సూచిస్తాయి. తెలుగులో సహజంగా ఉండేందుకు ఒకే పదబంధంతో అనువదించాం; తరువాత వచ్చే దహనబలులతో ఉన్న భేదాన్ని మాత్రం నిలిపాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా ఇచ్చాం; ‘కు’ అర్పణ యొక్క దిశను, అంకితాన్ని తెలియజేస్తుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: బలిపీఠం మీద పూర్తిగా దహనం చేసే ప్రత్యేక బలిరకాన్ని సూచించే ప్రామాణికమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: ఆ రోజు మరుసటి రోజున
  rationale: మూలంలోని కొంత పునరుక్తితో కూడిన కాలసూచనను నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే రూపం.
- source_word: פָּרִים אֶלֶף
  choice: వెయ్యి కోడెలను
  rationale: פָּרִים బలికి తగిన మగ పశువులను సూచిస్తుంది. ‘కోడెలు’ లింగాన్ని స్పష్టంగా చూపుతుంది; ‘ఎద్దులు’ కొన్ని సందర్భాల్లో విత్తులు తీసిన పనిపశువులను సూచించవచ్చు.
- source_word: אֵילִים אֶלֶף
  choice: వెయ్యి పొట్టేళ్లను
  rationale: אֵילִים సాధారణ గొర్రెలను కాక మగ గొర్రెలను సూచిస్తుంది.
- source_word: כְּבָשִׂים אֶלֶף
  choice: వెయ్యి గొర్రెపిల్లలను
  rationale: బలి సందర్భంలో כְּבָשִׂיםకు సహజమైన తెలుగు సమానం ‘గొర్రెపిల్లలు’.
- source_word: וְנִסְכֵּיהֶם
  choice: వాటితోపాటు వాటికి సంబంధించిన పానార్పణలను
  rationale: ప్రతి జంతుబలితో అనుబంధంగా అర్పించే ద్రవార్పణలని బహువచన ప్రత్యయం సూచిస్తుంది. సంబంధాన్ని తెలుగులో స్పష్టంగా చేశాం.
- source_word: וּזְבָחִים לָרֹב
  choice: విస్తారంగా బలులు
  rationale: לָרֹב పెద్ద సంఖ్యను లేదా సమృద్ధిని తెలియజేస్తుంది. ఇవి ముందుగా లెక్కించిన దహనబలులకు అదనమైన బలులని వాక్య నిర్మాణం సూచిస్తుంది.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరి కోసం
  rationale: לְ అనే విభక్తి ఇక్కడ ప్రయోజనం లేదా ప్రాతినిధ్య పరిధిని సూచించగలదు. ‘కోసం’ మూలంలోని విస్తృత భావాన్ని ఉంచి, మరింత బలమైన ప్రాయశ్చిత్తార్థాన్ని బలవంతంగా చేర్చదు.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా గుర్తించదగిన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా ఉండే ప్రత్యామ్నాయం.
- issue: לְכָל יִשְׂרָאֵל ప్రాతినిధ్య ప్రాయశ్చిత్తాన్ని స్పష్టంగా చెబుతుందా
  choice: ఇశ్రాయేలు ప్రజలందరి కోసం
  alternative: ఇశ్రాయేలు ప్రజలందరి తరఫున
  rationale: ‘తరఫున’ ప్రాతినిధ్య భావాన్ని మరింత నిర్దిష్టం చేస్తుంది. అయితే לְ విభక్తి అంతకంటే విస్తృతంగా ఉండగలదు కాబట్టి, మూలంలోని అనిశ్చితిని కాపాడేందుకు ‘కోసం’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ, అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. ‘దహనబలి,’ ‘పానార్పణ’ వంటి ఆచార సంబంధ పదాలు అవసరమైన ఖచ్చితత్వం కోసం ఉంచబడ్డాయి; అపరిచితమైన ‘పానార్పణ’కు పాదసూచికలో వివరణ ఇచ్చాం. మూలంలోని బలులు–దహనబలులు అనే భేదం, సంఖ్యల పునరుక్తి, ‘ఇశ్రాయేలు ప్రజలందరి కోసం’ అనే విస్తృతమైన కానీ సిద్ధాంతపరంగా అతినిర్దిష్టం కాని భావం కాపాడబడ్డాయి.
