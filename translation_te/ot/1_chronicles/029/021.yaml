revisions:
- from: ఆ రోజు మరుసటి రోజున[a] వారు యెహోవాకు బలులు అర్పించారు; యెహోవాకు దహనబలులుగా వెయ్యి కోడెలను, వెయ్యి పొట్టేళ్లను, వెయ్యి గొర్రెపిల్లలను, వాటితోపాటు వాటికి సంబంధించిన పానార్పణలను[b] అర్పించారు. అంతేకాక, ఇశ్రాయేలు ప్రజలందరి కోసం[c] విస్తారంగా బలులు అర్పించారు.
  to: ఆ రోజుకు మరుసటి రోజున[a] వారు యెహోవాకు బలులు అర్పించారు; యెహోవాకు దహనబలులుగా వెయ్యి కోడెలను, వెయ్యి పొట్టేళ్లను, వెయ్యి గొర్రెపిల్లలను, వాటికి సంబంధించిన పానార్పణలను[b] అర్పించారు. ఇంకా, ఇశ్రాయేలు ప్రజలందరి కోసం[c] సమృద్ధిగా బలులు అర్పించారు.
  rationale: సవరణలు అర్థాన్ని మార్చవు. కాలసూచనను వ్యాకరణపరంగా సహజంగా చేశాయి; పానార్పణలతో జంతుబలుల అనుబంధాన్ని పునరుక్తి లేకుండా ఉంచాయి; అలాగే మూలంలోని సాధారణ బలులు, దహనబలులు, పానార్పణలు, మరియు ఇశ్రాయేలు అంతటికీ సమృద్ధిగా అర్పించిన బలులు అనే భేదాలను నిలుపుకున్నాయి.
