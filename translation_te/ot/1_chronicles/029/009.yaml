id: 1CH.29.9
reference: 1 Chronicles 29:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: te
  text: అప్పుడు ప్రజలు తాము స్వచ్ఛందంగా అర్పించినందుకు[a] సంతోషించారు; ఎందుకంటే వారు నిండు హృదయంతో[b] యాహ్వేకు స్వచ్ఛందంగా అర్పించారు. రాజైన దావీదు కూడా ఎంతో సంతోషించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ స్వచ్ఛంద కానుకను బట్టి.” హెబ్రీయ మూలపదం బలవంతం లేకుండా ఇష్టపూర్వకంగా ఇవ్వడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “సంపూర్ణ హృదయంతో”; ఇది విభజనలేని నిష్కపటతను లేదా యథార్థమైన అంకితభావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: అప్పుడు ప్రజలు ... సంతోషించారు
  rationale: వావ్-అనుక్రమ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంతో వ్యక్తం చేస్తూ, שׂמח యొక్క ఆనందార్థాన్ని నిలుపుతుంది.
- source_word: עַל הִתְנַדְּבָם
  choice: తాము స్వచ్ఛందంగా అర్పించినందుకు
  rationale: עַל ఇక్కడ ఆనందానికి కారణాన్ని సూచిస్తుంది; נדב హిత్‌పయేల్ రూపం బలవంతం లేని, ఇష్టపూర్వక సమర్పణను నొక్కిచెబుతుంది.
- source_word: בְּלֵב שָׁלֵם
  choice: నిండు హృదయంతో
  rationale: హెబ్రీయ concrete idiom‌ను తెలుగులో సహజంగా ఉంచి, సంపూర్ణమైన మరియు విభజనలేని నిష్కపట మనస్సు భావాన్ని కాపాడుతుంది.
- source_word: הִתְנַדְּבוּ לַיהוָה
  choice: యాహ్వేకు స్వచ్ఛందంగా అర్పించారు
  rationale: అదే נדב మూలపద పునరుక్తిని ఒకే విధంగా అనువదించి, ఆలయ నిర్మాణం కోసం దేవునికి చేసిన ఇష్టపూర్వక కానుకల సందర్భాన్ని తెలియజేస్తుంది.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: రాజైన దావీదు
  rationale: హెబ్రీయ apposition‌ను ఆధునిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపంలో అందిస్తుంది.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: ఎంతో సంతోషించాడు
  rationale: హెబ్రీయ cognate accusative కలిగించే తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అసహజమైన పదపునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించి నిలుపుతుంది.
- issue: בְּלֵב שָׁלֵם యొక్క భావవ్యాప్తి
  choice: నిండు హృదయంతో
  alternative: పూర్ణ నిజాయితీతో / ఏకాగ్ర హృదయంతో
  rationale: ఇది కేవలం భావోద్వేగ ఉత్సాహమా, నిష్కపటతా, లేక అవిభక్త భక్తియా అన్న భావాన్ని ఒక్కదానికి పరిమితం చేయకుండా మూలరూపకాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘స్వచ్ఛందంగా అర్పించారు’ అనే పునరుక్తిని మూలంలోని נדב పునరావృతికి అనుగుణంగా ఉంచాం; చివరి హెబ్రీయ బలవర్ధక పునరుక్తిని తెలుగులో ‘ఎంతో సంతోషించాడు’గా సహజీకరించాం.
