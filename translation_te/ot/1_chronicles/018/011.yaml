id: 1CH.18.11
reference: 1 Chronicles 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: te
  text: దావీదు రాజు ఎదోము, మోయాబు, అమ్మోనీయులు[c], ఫిలిష్తీయులు, అమాలేకు అనే సమస్త జనాంగాల నుండి అతడు తీసుకున్న[b] వెండి, బంగారంతోపాటు వాటినీ యాహ్వేకు[a] అంకితం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో దైవనామం יהוה (యాహ్వే) ఉంది.
    reason: divine_name
  - marker: b
    text: ‘తీసుకుపోయిన’ లేదా ‘స్వాధీనం చేసుకున్న’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియకు ‘ఎత్తడం, మోసుకుపోవడం’ అనే అర్థాలున్నాయి; ఇక్కడ అది జయించిన జనాల నుంచి తీసుకున్న దోపుడు సొమ్ము లేదా కప్పాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘అమ్మోను కుమారులు’; అంటే అమ్మోనీయులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: వాటిని కూడా
  rationale: గַּם మునుపటి వచనంతో కొనసాగింపును సూచిస్తుంది; אֹתָם మునుపటి వచనంలోని కంచు వస్తువులను సూచించే సర్వనామం.
- source_word: הִקְדִּישׁ
  choice: అంకితం చేశాడు
  rationale: యాహ్వే కోసం ప్రత్యేకంగా ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఆలయార్పణ సందర్భానికి సరిపోతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించింది.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: వెండిబంగారాలను
  rationale: తెలుగులో సహజమైన సముచ్చయ రూపంలో రెండు విలువైన లోహాలను వస్తువులుగా సూచిస్తుంది.
- source_word: אֲשֶׁר נָשָׂא
  choice: అతడు తీసుకున్న
  rationale: נשא యొక్క ‘ఎత్తడం/తీసుకుపోవడం’ భావాన్ని ఈ యుద్ధ-కప్పం సందర్భంలో అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: מִכָּל הַגּוֹיִם
  choice: జనాలన్నిటి నుంచి
  rationale: ఇక్కడ גּוֹיִם చుట్టుపక్కల రాజకీయ-జాతి సమూహాలను సూచిస్తుంది; జాబితాతో సహజంగా కలుస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; తెలుగులో ఆ ప్రజాజాతిని సూచించే సహజమైన జాతినామం ‘అమ్మోనీయులు’.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో ఉంచింది.
- issue: הִקְדִּישׁ యొక్క ఆరాధనా భావం
  choice: అంకితం చేశాడు
  alternative: పవిత్రపరిచాడు / ప్రతిష్ఠించాడు
  rationale: వస్తువులను దేవుని ఉపయోగం కోసం ప్రత్యేకంగా ఉంచే భావాన్ని తెలియజేస్తుంది; ‘ప్రతిష్ఠించాడు’ వల్ల విగ్రహస్థాపన అనే అపార్థం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, ‘కూడా’ అనే కొనసాగింపు ద్వారా ఒకే అంకితక్రియను నిలిపింది. స్థలనామాలు/జాతినామాలకు సాధారణ తెలుగు బైబిలు రూపాలకు సమీపమైన లిప్యంతరీకరణ వాడింది.
