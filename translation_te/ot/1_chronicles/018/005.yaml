source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֲרַ֣ם דַּרְמֶ֔שֶׂק לַ/עְז֕וֹר לַ/הֲדַדְעֶ֖זֶר מֶ֣לֶךְ צוֹבָ֑ה וַ/יַּ֤ךְ דָּוִיד֙ בַּ/אֲרָ֔ם עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: te
  text: దమస్కు అరామీయులు[a] సోబా రాజైన హదదెజెరుకు[b] సహాయం చేయడానికి వచ్చారు. అప్పుడు దావీదు అరామీయులలో ఇరవై రెండు వేల మందిని కొట్టివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దమస్కు అరాము.” సంప్రదాయ అనువాదాల్లో “దమస్కు సిరియా” లేదా “దమస్కు సిరియనులు” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ పేరు “హదదెజెరు” అని ఉంది; కొన్ని సమాంతర వచనాల్లో “హదరెజెరు” అనే భిన్న రూపం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: దమస్కుకు చెందిన అరాము వారు
  rationale: אֲרַם ప్రాంతాన్ని గానీ ప్రజలను గానీ సూచించగలదు. సందర్భంలో సహాయం చేయడానికి వచ్చిన సైనిక ప్రజాసమూహం ఉద్దేశించబడింది; తరువాతి కాలపు ‘సిరియా’ అనే పేరును రుద్దకుండా ‘అరాము వారు’ అని అనువదించాం.
- source_word: לַעְזוֹר
  choice: సహాయం చేయడానికి
  rationale: עזר అనే క్రియ యొక్క సాధారణ అర్థమైన ‘సహాయం చేయడం’ను సైనిక సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲדַדְעֶזֶר
  choice: హదదెజెరు
  rationale: ఈ వచనంలోని మసొరెటిక్ రూపం הֲדַדְעֶזֶר ను నేరుగా లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజు
  rationale: రాజబిరుదును, స్థలనామాన్ని సరళమైన తెలుగు సంబంధ నిర్మాణంలో నిలుపుతుంది.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం, ఓడించడం లేదా చంపడం అనే పరిధిని కలిగి ఉంటుంది. ఇక్కడ వెంటనే మృతుల సంఖ్యగా అర్థమయ్యే ఇరవై రెండు వేల మంది పేర్కొనబడటంతో ‘హతమార్చాడు’ సహజమైన సందర్భానుగుణ ఎంపిక.
- source_word: בַּאֲרָם
  choice: అరాము వారిలో
  rationale: בְּ ఉపసర్గతో ఉన్న ప్రజా/ప్రాంత నామాన్ని తెలుగులో ‘అరాము వారిలో’ అని వ్యక్తం చేయడం లక్ష్యమైన బాధిత సమూహాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: ఇరవై రెండు వేల మందిని
  rationale: హీబ్రూ సంఖ్యను ఖచ్చితంగా నిలుపుతూ, אִישׁ ను సందర్భానుగుణంగా సాధారణ బహువచన వ్యక్తిసూచక రూపంలో అనువదిస్తుంది; ‘సైనికులు’ వంటి అదనపు నిర్దిష్టతను చేర్చదు.
