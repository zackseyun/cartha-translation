  to: దమస్కు అరామీయులు[a] సోబా రాజైన హదదెజెరుకు[b] సహాయం చేయడానికి వచ్చారు. అప్పుడు దావీదు అరామీయులలో ఇరవై రెండు వేల మందిని కొట్టివేశాడు.
