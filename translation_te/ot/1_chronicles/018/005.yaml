translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘సిరియా’కు బదులుగా మూలంలోని ప్రాచీన జాతి-భౌగోళిక పేరు ‘అరాము’ నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
