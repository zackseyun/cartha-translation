- from: అందుకే అతడు తన కుమారుడు హదోరామును రాజైన దావీదు దగ్గరకు పంపాడు. దావీదు క్షేమం గురించి అడిగి తెలుసుకోవడానికీ[a], హదదెజెరుతో యుద్ధం చేసి అతన్ని ఓడించినందుకు దావీదును ఆశీర్వదించడానికీ[b] అతన్ని పంపాడు. ఎందుకంటే హదదెజెరు తోయితో యుద్ధాలు చేస్తూ ఉండేవాడు[c]. అతడు అన్ని రకాల బంగారు, వెండి, కంచు వస్తువులను కూడా పంపాడు[d].
  to: అప్పుడు తోయి తన కుమారుడైన హదోరామును రాజు దావీదు వద్దకు పంపాడు. దావీదు క్షేమం గురించి విచారించడానికీ[a], హదదెజెరుతో యుద్ధం చేసి అతనిని ఓడించినందుకు దావీదును ఆశీర్వదించడానికీ[b] పంపాడు. ఎందుకంటే హదదెజెరు తోయితో యుద్ధంలో ఉండేవాడు[c]. అతడు బంగారం, వెండి, కంచుతో చేసిన అన్ని రకాల వస్తువులను కూడా పంపాడు[d].
  rationale: సవరణలు మూలంలోని కథన క్రమాన్ని, దౌత్య రిజిస్టర్‌ను, మరియు హీబ్రూ నుడికారం యొక్క అస్పష్టతను కాపాడుతాయి. సందర్భం ద్వారా తెలిసే కర్త అయిన తోయిని మొదట స్పష్టంగా పేర్కొన్నాం; కారణార్థాన్ని అతిగా సూచించే ‘అందుకే’ను తొలగించాం; పునరుక్తిని తగ్గించాం. చివరి వస్తువులు పంపబడినవేనని సందర్భసిద్ధ పూరణను పాదసూచికతో పారదర్శకంగా ఉంచాం.
