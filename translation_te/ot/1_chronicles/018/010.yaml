translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తుల పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ధ్వన్యనుసారంగా ఇవ్వబడ్డాయి; హీబ్రూ నుడికారాల అక్షరార్థాలను ప్రధాన వాక్యంలో అసహజంగా ఉంచకుండా పాదసూచికల్లో భద్రపరచాం.
