  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: te
  text: అప్పుడు తోయి తన కుమారుడైన హదోరామును రాజు దావీదు వద్దకు పంపాడు. దావీదు క్షేమం గురించి విచారించడానికీ[a], హదదెజెరుతో యుద్ధం చేసి అతనిని ఓడించినందుకు దావీదును ఆశీర్వదించడానికీ[b] పంపాడు. ఎందుకంటే హదదెజెరు తోయితో యుద్ధంలో ఉండేవాడు[c]. అతడు బంగారం, వెండి, కంచుతో చేసిన అన్ని రకాల వస్తువులను కూడా పంపాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని క్షేమం గురించి విచారించడానికి.’ హీబ్రూ నుడికారంలో ‘శాంతి’ అనే పదం ఇక్కడ యోగక్షేమం లేదా బాగోగులు అనే భావంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతన్ని అభినందించడానికి.’ మూలంలోని క్రియకు అక్షరార్థం ‘ఆశీర్వదించు’; ఇక్కడ అది విజయానంతర దౌత్య సందర్భంలో వాడబడింది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘హదదెజెరు తోయి యుద్ధాల మనిషిగా ఉండేవాడు’; ఇది హదదెజెరు తోయితో యుద్ధంలో ఉండేవాడని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూ పాఠం ‘బంగారం, వెండి, కంచు వస్తువులన్నీ కూడా’ అని క్రియ లేకుండానే ముగుస్తుంది. సందర్భాన్ని బట్టి ‘అతడు ... పంపాడు’ అని అనువాదంలో పూరించబడింది.
    reason: textual_clarity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అందుకే అతడు ... పంపాడు
  rationale: ఈ కథన క్రియ తరువాతి సంఘటనను ముందున్న సందర్భంతో కలుపుతుంది. సహజమైన తెలుగు కథన ప్రవాహం కోసం ‘అందుకే’ వాడబడింది; కర్త అయిన తోయి ముందరి వచనం నుండి స్పష్టమవుతాడు.
- source_word: הֲדוֹרָם בְּנוֹ
  choice: తన కుమారుడు హదోరామును
  rationale: వ్యక్తి పేరును ధ్వన్యనుసారంగా ఉంచి, అతడు పంపినవాడు తన కుమారుడేనని మూలంలోని సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: దావీదు క్షేమం గురించి అడిగి తెలుసుకోవడానికి
  rationale: ‘షాలోమ్’ ఇక్కడ కేవలం యుద్ధం లేని శాంతిని కాకుండా వ్యక్తి క్షేమం, యోగక్షేమాన్ని సూచిస్తుంది. తెలుగు దౌత్య సందర్భంలో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְבָרֲכוֹ
  choice: దావీదును ఆశీర్వదించడానికి
  rationale: ברך అనే క్రియ యొక్క ప్రాథమిక భావమైన ‘ఆశీర్వదించు’ను నిలిపింది. విజయానంతర దౌత్య సందర్భంలో అభినందన భావం కూడా ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: హదదెజెరుతో యుద్ధం చేసి అతన్ని ఓడించినందుకు
  rationale: נכה ఇక్కడ సైనిక విజయాన్ని సూచిస్తుంది; హదదెజెరు చనిపోయాడని అవసరానికి మించి నిర్ధారించకుండా ‘ఓడించాడు’ అని అనువదించింది.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: ఎందుకంటే హదదెజెరు తోయితో యుద్ధాలు చేస్తూ ఉండేవాడు
  rationale: ‘యుద్ధాల మనిషి’ అనే హీబ్రూ నుడికారాన్ని పదానువాదంగా కాకుండా, వారిద్దరి మధ్య కొనసాగిన యుద్ధ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: అతడు అన్ని రకాల బంగారు, వెండి, కంచు వస్తువులను కూడా పంపాడు
  rationale: మూలపాఠంలోని చివరి భాగంలో క్రియ లేదు; సందర్భం నుండి ముందున్న ‘పంపాడు’ అనే క్రియను పునరుద్ధరించింది. כְּלֵי అనే విస్తృత పదానికి ‘వస్తువులు’, ప్రాచీన లోహమైన נְחֹשֶׁתకు ‘కంచు’ వాడబడ్డాయి.
