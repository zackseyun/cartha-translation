base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: te
  text: హదదెజెరు పట్టణాలైన తిబ్హతు, కూను నుండి దావీదు అత్యధిక కంచును తీసుకున్నాడు. దానితో సొలొమోను కంచు సముద్రాన్ని, స్తంభాలను, కంచు వస్తువులను తయారు చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఆలయ సామగ్రి సందర్భంలో ఈ పదం సాధారణంగా రాగి మిశ్రమమైన కంచును సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు సహజమైన పదం.
- source_word: רַבָּה מְאֹד
  choice: అపారమైన
  rationale: అత్యంత విస్తారమైన పరిమాణాన్ని సహజంగా, బలంగా వ్యక్తపరుస్తుంది.
- source_word: יָם הַנְּחֹשֶׁת
  choice: కంచు సముద్రం
  rationale: ఆలయంలోని విశాలమైన కంచు నీటి తొట్టికి వాడిన స్థిరమైన రూపక నామాన్ని నిలుపుతుంది.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: కంచు సామగ్రి
  rationale: כְּלֵי అనే విస్తృత పదం పాత్రలు, పరికరాలు లేదా ఇతర వస్తువులను సూచించగలదు; ‘సామగ్రి’ ఆ విస్తృతతను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా భావసంబంధాన్ని స్పష్టంగా ఉంచింది; ప్రత్యేక ఆలయ పదమైన ‘కంచు సముద్రం’ను యథాతథంగా నిలిపింది.
