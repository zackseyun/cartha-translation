id: 1CH.18.12
reference: 1 Chronicles 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: te
  text: మరియు సెరూయా కుమారుడైన అబీషై ఉప్పు లోయలో పద్దెనిమిది వేలమంది ఎదోమీయులను హతమార్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఎదోము’ అని ఉంది; ఈ యుద్ధ సందర్భంలో అది ఎదోము ప్రజలను సూచిస్తుందని అనువాదంలో ‘ఎదోమీయులు’ అని స్పష్టం చేశాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: అప్పుడు ... అబీషై
  rationale: వావ్ సంధానాన్ని తెలుగు కథన ప్రవాహానికి సహజమైన ‘అప్పుడు’తో వ్యక్తం చేసి, వ్యక్తి పేరును అబీషైగా లిప్యంతరీకరించాం.
- source_word: בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడు
  rationale: వంశసంబంధ గుర్తింపును సహజమైన తెలుగు పదక్రమంలో నేరుగా నిలిపాం.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: యుద్ధ సందర్భంలో, సంఖ్యతో కూడిన נכה అనే క్రియ అనేక మందిని సంహరించడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో దాని బలాన్ని సహజంగా తెలియజేయడానికి ‘హతమార్చాడు’ ఎంచుకున్నాం. ఇది అబీషై స్వయంగా ప్రతి వ్యక్తినీ చంపాడని తప్పనిసరిగా చెప్పదు; అతని నాయకత్వంలోని కార్యాన్ని కూడా సూచించగలదు.
- source_word: אֶת אֱדוֹם
  choice: ఎదోమీయులలో ... మందిని
  rationale: హీబ్రూలో ‘ఎదోము’ ఉన్నా, యుద్ధక్రియతో పాటు పద్దెనిమిది వేల అనే సంఖ్య ఉండటం వల్ల భూభాగం కాక ఎదోము ప్రజలే ఉద్దేశమని తెలుగులో స్పష్టం చేశాం.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: ఉప్పు లోయలో
  rationale: గేయ్ హమ్మెలహ్ అనే స్థలనామాన్ని దాని భాగాల అర్థాన్ని కాపాడుతూ సహజమైన తెలుగు రూపంలో అందించాం.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: పద్దెనిమిది వేల మందిని
  rationale: సంఖ్యను పదాల్లో ఇచ్చి, వ్యక్తులను లెక్కిస్తున్నందున సహజమైన తెలుగు లెక్కింపు పదం ‘మందిని’ చేర్చాం.
theological_decisions:
- issue: ‘ఎదోము’ అనే కర్మ ప్రజలనో భూభాగాన్నో సూచిస్తుందా
  choice: ఎదోము ప్రజలు (‘ఎదోమీయులు’)
  alternative: ఎదోము భూభాగం
  rationale: సైనిక సందర్భం, ‘హతమార్చాడు’ అనే క్రియ, పద్దెనిమిది వేల అనే సంఖ్య—ఇవన్నీ భూభాగం కంటే ప్రజలనే సూచిస్తున్నాయి. ఇది సందర్భాధారిత పదార్థ నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. వ్యక్తి, స్థల నామాలను సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా ఉంచి, మూలంలోని యుద్ధక్రియ బలాన్ని తగ్గించకుండా పాఠకులకు స్పష్టంగా అందించాం.
