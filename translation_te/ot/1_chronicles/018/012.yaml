revisions:
- from: అప్పుడు సెరూయా కుమారుడు అబీషై ఉప్పు లోయలో ఎదోమీయులలో పద్దెనిమిది వేల మందిని హతమార్చాడు.[a]
  to: మరియు సెరూయా కుమారుడైన అబీషై ఉప్పు లోయలో పద్దెనిమిది వేలమంది ఎదోమీయులను హతమార్చాడు.[a]
  rationale: The revision renders the initial conjunction without adding a temporal adverb and corrects the Telugu object construction so that the eighteen thousand are explicitly Edomites. The source’s place name, personal names, and number are retained, and the explanatory footnote remains correctly anchored.
