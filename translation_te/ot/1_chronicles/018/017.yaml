  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సమూహాల పేర్లను లిప్యంతరీకరించాం; הָרִאשֹׁנִים మరియు לְיַד అనే పదబంధాల్లోని నిజమైన భావసాధ్యతలను పాదసూచికల్లో నిలిపాం.
