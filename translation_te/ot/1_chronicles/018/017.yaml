  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע עַל הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵי דָוִ֥יד הָ/רִאשֹׁנִ֖ים לְ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: te
  text: యెహోయాదా కుమారుడైన బెనాయా కెరేతీయులకూ పెలేతీయులకూ అధిపతిగా ఉన్నాడు; దావీదు కుమారులు రాజు సమీపంలో[b] ప్రధానులుగా[a] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘మొదటివారు’ లేదా ‘ముందున్నవారు’; ఇక్కడ రాజాస్థానంలోని ప్రధాన వ్యక్తులు లేదా ఉన్నతాధికారులు అనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘రాజు చేతివద్ద’; రాజుకు సమీపంగా ఉండడం లేదా సన్నిహిత సేవను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: అధిపతిగా ఉన్నాడు
  rationale: పరిపాలనా లేదా సైనిక సందర్భంలో ఈ పదం పర్యవేక్షణ, అధికారాన్ని సూచిస్తుంది; మూలంలో లేని నిర్దిష్ట సైనిక హోదాను చేర్చకుండా భావాన్ని తెలియజేస్తుంది.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: కెరేతీయులకూ పెలేతీయులకూ
  rationale: ఇవి రెండు సమూహాల పేర్లు; అర్థానువాదం చేయకుండా హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
- source_word: וּבְנֵי דָוִיד
  choice: దావీదు కుమారులు
  rationale: సంబంధాన్ని సహజమైన ఆధునిక తెలుగు నిర్మాణంలో నేరుగా తెలియజేస్తుంది.
- source_word: הָרִאשֹׁנִים
  choice: ప్రముఖులుగా
  rationale: అక్షరార్థంగా ‘మొదటివారు’ లేదా ‘ముందున్నవారు’; రాజాస్థాన సందర్భంలో హోదా లేదా ప్రాధాన్యాన్ని సూచించేలా ‘ప్రముఖులు’ అని ఇచ్చాం, అయితే అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: לְיַד הַמֶּלֶךְ
  choice: రాజు పక్కన ... సేవచేశారు
  rationale: అక్షరార్థంగా ‘రాజు చేతి దగ్గర’; ఇది రాజుకు సన్నిహితంగా హాజరై సేవచేయడాన్ని సూచించే నుడికారం. తెలుగు పాఠకుడికి సహజంగా ఉండేలా స్థానం మరియు సేవ రెండింటినీ వ్యక్తం చేశాం.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడు బెనాయా
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, పుత్ర సంబంధాన్ని సహజ తెలుగు పదక్రమంలో ఉంచాం.
