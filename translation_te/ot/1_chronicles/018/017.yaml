  source_fidelity: మొదటి వాక్యభాగం హెబ్రీ మూలాన్ని సరిగ్గా ప్రతిబింబిస్తుంది. అయితే రెండవ భాగంలోని “సేవచేశారు” అనేది לְיַד הַמֶּלֶךְ నుడికారానికి సాధ్యమైన వివరణ అయినప్పటికీ, הָרִאשֹׁנִים‌కు అనుసంధానించిన ప్రస్తుత వాక్యనిర్మాణం మూలంలోని ‘ఉన్నారు/ఉండేవారు’ భావాన్ని కొంత మార్చుతుంది. ‘ప్రధానులుగా ఉన్నారు’ మూలంలోని హోదా-సూచక అస్పష్టతను, అలాగే క్రియను, మరింత సమీపంగా నిలుపుతుంది.
