source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: te
  text: అతడు ఎదోములో సైనిక స్థావరాలను ఉంచాడు; ఎదోమీయులందరూ దావీదుకు సేవకులయ్యారు. దావీదు ఎక్కడికి వెళ్లినా యెహోవా అతనికి విజయం అనుగ్రహించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: సైనిక స్థావరాలు
  rationale: ఈ సందర్భంలో బహువచన పదం ఆక్రమిత ప్రాంతంలో ఉంచిన సైనిక కాపలా దళాలు లేదా స్థావరాలను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో అర్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבָדִים
  choice: సేవకులు
  rationale: ఈ పదానికి సేవకులు, దాసులు, అధీన ప్రజలు అనే విస్తృతి ఉంది. ఇక్కడ సమస్త ఎదోము దావీదు ఆధీనంలోకి వచ్చి అతనికి సేవచేసిందనే రాజకీయ భావం ప్రధానమైనందున, అవసరానికి మించి వ్యక్తిగత బానిసత్వాన్ని నిర్దిష్టం చేయకుండా ‘సేవకులు’ ఎంచుకున్నాం.
- source_word: וַיּוֹשַׁע
  choice: విజయం అనుగ్రహించాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘రక్షించాడు/విడిపించాడు’; యుద్ధ విజయాల సందర్భంలో ‘విజయం ఇచ్చాడు’ అనే భావాన్ని కలిగి ఉంది. తెలుగులో సహజంగా, యెహోవానే విజయానికి కారణమని నిలుపుతూ అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా తెలిసిన రూపంలో ప్రతిబింబించాం.
theological_decisions:
- issue: దావీదు విజయానికి దైవిక కారణత్వం
  choice: యెహోవా అతనికి విజయం అనుగ్రహించాడు
  alternative: యెహోవా దావీదును రక్షించాడు
  rationale: తక్షణ సందర్భం సైనిక జయాలను వివరిస్తుంది. అయినప్పటికీ క్రియలోని రక్షణ భావాన్ని పూర్తిగా వేరుచేయకుండా, విజయం దేవుని అనుగ్రహమని తెలిపాం.
- issue: ఎదోమీయుల స్థితి
  choice: దావీదుకు సేవకులయ్యారు
  alternative: దావీదుకు బానిసలయ్యారు
  rationale: עבד అనే పదం తప్పనిసరిగా వ్యక్తిగత బానిసత్వాన్నే సూచించదు; జయించబడిన ప్రజల రాజకీయ అధీనత, కప్పం చెల్లించే సేవ కూడా కావచ్చు. అందువల్ల మూలంలోని విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని వరుస వాక్య నిర్మాణాన్ని సహజ తెలుగు ప్రవాహానికి అనుగుణంగా స్వల్పంగా మలిచాం.
