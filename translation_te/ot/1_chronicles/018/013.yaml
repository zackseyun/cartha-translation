  source_fidelity: హీబ్రూ మూలానికి అనువాదం విశ్వసనీయంగా ఉంది. נְצִיבִים ను ‘సైనిక స్థావరాలు’గా ఇవ్వడం సందర్భానుకూలం; ‘ఎదోమీయులందరూ దావీదుకు సేవకులయ్యారు’ అనేది כָל־אֱדוֹם עֲבָדִים לְדָוִד లోని సమూహ రాజకీయ అధీనతను సహజంగా తెలియజేస్తుంది. וַיּוֹשַׁע ను యుద్ధసందర్భంలో ‘విజయం అనుగ్రహించాడు’గా ఇవ్వడం సముచితం, అయినా మూలంలోని రక్షణ/విడిపింపు భావం సందర్భానుసారంగా విజయంతో వ్యక్తమవుతోంది.
