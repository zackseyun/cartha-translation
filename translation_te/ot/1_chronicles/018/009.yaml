id: 1CH.18.9
reference: 1 Chronicles 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֕ע תֹּ֖עוּ מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔יד אֶת כָּל חֵ֖יל הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: te
  text: హమాతు రాజైన తోవు[a], దావీదు సోబా రాజైన హదదెజెరు సైన్యమంతటినీ ఓడించాడని విన్నప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘తోవు’; సమాంతర వృత్తాంతమైన 2 సమూయేలు 8:9లో ‘తోయి’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి వచనంలోని చర్యకు ఈ వాక్యం కాలసంబంధ నేపథ్యాన్ని ఏర్పరుస్తున్నందున ‘విన్నప్పుడు’ సహజంగా సరిపోతుంది.
- source_word: תֹּעוּ
  choice: తోవు
  rationale: దినవృత్తాంతములలోని హీబ్రూ నామరూపాన్ని తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: מֶלֶךְ חֲמָת
  choice: హమాతు రాజైన
  rationale: వ్యక్తి రాజపదవినీ అతని రాజ్యాన్నీ తెలిపే హీబ్రూ సమాసానికి సహజమైన తెలుగు రూపం.
- source_word: כִּי
  choice: అని
  rationale: తోవు విన్న సమాచారం ఏమిటో పరిచయం చేసే సందర్భంలో తెలుగు పరోక్ష వాక్యానికి ‘అని’ సరిపోతుంది.
- source_word: הִכָּה
  choice: ఓడించాడని
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం ద్వారా జయించడం లేదా సంహరించడం అనే బలమైన భావం కలిగిస్తుంది; మొత్తం సైన్యానికి సంబంధించిన సందర్భంలో ‘ఓడించాడు’ స్పష్టమైన, సహజమైన సైనిక ప్రయోగం.
- source_word: כָּל
  choice: అంతటినీ
  rationale: హీబ్రూలోని సంపూర్ణ పరిమాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חֵיל
  choice: సైన్యం
  rationale: ఈ యుద్ధ సందర్భంలో పదం సంపద లేదా సామర్థ్యం కాకుండా సాయుధ దళాన్ని సూచిస్తుంది.
- source_word: הֲדַדְעֶזֶר
  choice: హదదెజెరు
  rationale: WLC దినవృత్తాంతముల పాఠంలోని వ్యక్తినామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజైన
  rationale: రాజపదవినీ ప్రాంత నామాన్నీ సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
