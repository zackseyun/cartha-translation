translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ఈ వచనం తరువాతి వచనంతో కొనసాగే ఆధీన కాలవాక్యం కావడంతో చివర కామా ఉంచబడింది. వ్యక్తి, స్థల నామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
