id: 1CH.18.6
reference: 1 Chronicles 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: te
  text: దావీదు దమస్కు అరాములో సైనిక స్థావరాలను ఉంచాడు[a]. అరామీయులు[b] దావీదుకు సేవకులై, కప్పం చెల్లించేవారయ్యారు. దావీదు వెళ్లిన ప్రతిచోటా యహ్వే అతనికి విజయాన్ని అనుగ్రహించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దళాలను నిలిపాడు’; మరింత అక్షరార్థంగా ‘ఉంచాడు.’ హీబ్రూ క్రియలో కర్మ చెప్పబడలేదు; సైనిక సందర్భం వల్ల ‘సైనిక స్థావరాలు’ అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘అరాము’; సంప్రదాయంగా ‘సిరియా’ లేదా ‘సిరియనులు’ అని కూడా అనువదిస్తారు.'
    reason: alternative_reading
  - marker: c
    text: లేదా ‘దావీదును రక్షించాడు’ లేదా ‘విడిపించాడు’; ఈ యుద్ధ సందర్భంలో ‘విజయాన్ని అనుగ్రహించాడు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: సైనిక స్థావరాలను ఉంచాడు
  rationale: שׂוּם అనే క్రియ అక్షరార్థంగా ‘ఉంచు/పెట్టు’ అని అర్థం. హీబ్రూ పాఠంలో కర్మ స్పష్టంగా లేకపోయినా, సైనిక సందర్భం మరియు సమాంతర వృత్తాంతం ఆధారంగా సైనిక స్థావరాలు ఉద్దేశించబడ్డాయని పాఠ్యంలో స్పష్టం చేయబడింది; దీనిని పాదసూచికలో వెల్లడించాం.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: దమస్కు అరాములో
  rationale: ప్రాంతాన్ని దమస్కుతో సంబంధమున్న అరాముగా పేర్కొనే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ‘దమస్కులో’ అని కుదించదు.
- source_word: אֲרָם
  choice: అరామీయులు
  rationale: ఇక్కడ దావీదుకు లోబడిన ప్రజలను సూచిస్తున్నందున జాతినామాన్ని ‘అరామీయులు’గా అనువదించడం సహజం. సంప్రదాయ ‘సిరియనులు’ కంటే ఇది హీబ్రూ పేరుకు దగ్గరగా ఉంటుంది.
- source_word: עֲבָדִים
  choice: సేవకులై
  rationale: రాజకీయంగా లోబడిన ప్రజల స్థితిని సూచించే సందర్భంలో ‘సేవకులు’ మూలపదానికి దగ్గరగా ఉండి, ‘బానిసలు’ అనే అతినిర్దిష్ట భావాన్ని రుద్దదు.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: కప్పం చెల్లించేవారయ్యారు
  rationale: అధీన ప్రజలు పైచేయి గల రాజుకు నిరంతరం సమర్పించే కానుకను ఈ సందర్భంలో ‘కప్పం’ స్పష్టంగా తెలియజేస్తుంది. ‘చెల్లించేవారు’ అనే రూపం హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיּוֹשַׁע
  choice: విజయాన్ని అనుగ్రహించాడు
  rationale: యָשַׁע హిఫిల్ రూపానికి ‘రక్షించాడు/విడిపించాడు’ అనే ప్రాథమిక భావం ఉన్నా, యుద్ధ వృత్తాంతంలో అది దావీదుకు సైనిక విజయాన్ని కలిగించడాన్ని సూచిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగులో ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: వెళ్లిన ప్రతిచోటా
  rationale: దావీదు చేసిన ప్రయాణాలు లేదా యుద్ధ దండయాత్రలన్నిటినీ సమగ్రంగా సూచించే హీబ్రూ నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది; అర్థాన్ని కేవలం సైనిక కదలికలకే పరిమితం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాని ప్రత్యేకతను నిలుపుతూ బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- issue: וַיּוֹשַׁע లో దేవుని కార్యం
  choice: విజయాన్ని అనుగ్రహించాడు
  alternative: రక్షించాడు; విడిపించాడు
  rationale: యుద్ధ సందర్భం విజయ భావాన్ని బలపరుస్తుంది. అయితే మూలక్రియలోని రక్షణ/విడుదల భావాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వృత్తాంత శైలి వాడబడింది. ‘దమస్కు అరాము,’ ‘అరామీయులు,’ ‘యహ్వే’ వంటి మూలపాఠానికి దగ్గరైన పేర్లు నిలుపబడ్డాయి. సందర్భం వల్ల పూరించబడిన ‘సైనిక స్థావరాలు’ మరియు సందర్భానుగుణమైన ‘విజయం’ పాదసూచికలతో పారదర్శకంగా సూచించబడ్డాయి.
