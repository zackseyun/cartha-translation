source:
  edition: WLC
  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: te
  text: సెరూయా కుమారుడు యోవాబు సైన్యానికి అధిపతిగా ఉన్నాడు; మరియు అహీలూదు కుమారుడు యెహోషాపాతు నమోదుల అధికారిగా[a] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కార్యదర్శి’ లేదా ‘చరిత్ర నమోదుదారు’; హీబ్రూ పదం రాజాస్థానంలో రికార్డులు నిర్వహించి, విషయాలను రాజు దృష్టికి తెచ్చే బాధ్యతగల అధికారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: యోవాబు
  rationale: వావ్ సంధి ఇక్కడ అధికారుల జాబితాను కొనసాగిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా సహజంగా వ్యక్తపరచవచ్చు. పేరును సంప్రదాయ తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
- source_word: עַל הַצָּבָא
  choice: సైన్యానికి అధిపతిగా ఉన్నాడు
  rationale: עַל అనే ఉపసర్గ ఇక్కడ సైన్యంపై అధికార బాధ్యతను సూచిస్తుంది. పదశః ‘సైన్యంపై’ అనడం కంటే ఈ భావం తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది; అయితే ‘సేనాధిపతి’ అనే మరింత నిర్దిష్ట బిరుదును మూలంలో లేనంతగా చేర్చలేదు.
- source_word: וִ/יהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: రెండవ అధికారిని సమాంతర వాక్యభాగంతో పరిచయం చేశాం; సంధి భావాన్ని అర్ధవిరామం సహజంగా మోస్తుంది. పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן אֲחִילוּד
  choice: అహీలూదు కుమారుడు
  rationale: మూలంలోని తండ్రి-కొడుకు గుర్తింపును సహజమైన తెలుగు నిర్మాణంలో అనువదించాం.
- source_word: מַזְכִּיר
  choice: రాజ్య వ్యవహారాల నమోదుచేసే అధికారి
  rationale: זכר మూలం నుంచి వచ్చిన ఈ రాజాస్థాన పదవి, విషయాలను నమోదు చేసి రాజు దృష్టికి తేవడానికిగల అధికారిని సూచిస్తుంది. కేవలం ‘లేఖకుడు’ లేదా ఆధునిక భావం కలిగిన ‘కార్యదర్శి’ కంటే ఈ రూపం విధిని స్పష్టంగా తెలియజేస్తూ పదవి యొక్క కొంత అనిశ్చితినీ కాపాడుతుంది.
