translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా శైలిని ఉపయోగించాం. పేర్లకు తెలుగు బైబిలు సంప్రదాయ రూపాలను అనుసరించాం; మַזְכִּיר పదవిని ఏకైక ఆధునిక హోదాతో అతిగా నిర్దిష్టం చేయకుండా విధి ఆధారంగా అనువదించాం.
