source:
  edition: WLC
  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲבִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וְ/שַׁוְשָׁ֖א סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: te
  text: అహీటూబు కుమారుడు సాదోకు, అబ్యాతారు కుమారుడు అబీమెలెకు యాజకులుగా ఉన్నారు[a]. షవ్షా కార్యదర్శిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 8:17లోని సమాంతర పాఠం ‘అబ్యాతారు కుమారుడు అహీమెలెకు’ అని చదువుతుంది; ఇక్కడ మాత్రం దినవృత్తాంతముల హీబ్రూ పాఠంలో ‘అబ్యాతారు కుమారుడు అబీమెలెకు’ అని ఉంది. అనువాదం ఇక్కడ దినవృత్తాంతముల హీబ్రూ పాఠాన్నే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ పరిపాలనా జాబితాలో ఈ పదం ప్రత్యక్ష పుత్రసంబంధాన్ని సూచించడం అత్యంత సహజం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: దినవృత్తాంతముల హీబ్రూ పాఠంలో ఉన్న పేరునే అనుసరించాం; సమాంతర పాఠంలోని భేదాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: כֹּהֲנִים
  choice: యాజకులు
  rationale: ఈ వంశపరమైన సందర్భంలో పదానికి సాధారణమైన ఆరాధనా సేవకుల అర్థమే ఉద్దేశించబడింది.
- source_word: שַׁוְשָׁא
  choice: షవ్షా
  rationale: దినవృత్తాంతముల హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: סוֹפֵר
  choice: కార్యదర్శి
  rationale: రాజపరిపాలనా సందర్భంలో ఇది అధికారిక లేఖకుడు లేదా కార్యదర్శిని సూచిస్తుంది; ఆధునిక పాఠకులకు పదవి స్వభావాన్ని స్పష్టంగా తెలియజేయడానికి ‘కార్యదర్శి’ ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించాం. పేర్లను లిప్యంతరీకరించి, పదవులను అనువదించాం. హీబ్రూలోని సంయుక్త నామవాక్యాన్ని తెలుగులో సహజంగా ఉండేందుకు ‘ఉన్నారు/ఉన్నాడు’తో వ్యక్తపరిచాం.
