  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. సైనిక సందర్భాన్ని స్పష్టం చేస్తూనే, క్రియను సంపూర్ణ విజయం లేదా మరణంగా అతిగా అర్థం చేయలేదు. మూలంలోని సర్వనామ సూచనకు ఉన్న సందిగ్ధతను ‘అతడు’ ద్వారా నిలుపుకుంది.
