source:
  edition: WLC
  text: וַ/יַּ֥ךְ דָּוִ֛יד אֶת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה חֲמָ֑תָ/ה בְּ/לֶכְתּ֕/וֹ לְ/הַצִּ֥יב יָד֖/וֹ בִּֽ/נְהַר פְּרָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: te
  text: దావీదు సోబా రాజైన హదదెజెరును[b] హమాతు వైపు దెబ్బతీశాడు; అతడు యూఫ్రటీసు నది వద్ద తన ఆధిపత్యాన్ని స్థాపించడానికి[a] వెళ్తుండగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన నియంత్రణను తిరిగి స్థాపించడానికి”; అక్షరార్థంగా, “తన చేతిని నిలపడానికి.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ పేరు “హదదెజెరు” అని ఉంది; సమాంతర వాక్యమైన 2 సమూయేలు 8:3లో “హదరెజెరు” అనే భిన్న లేఖనరూపం కనిపిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: యుద్ధంలో దెబ్బతీశాడు
  rationale: נכה అనే క్రియలోని ‘కొట్టు/దెబ్బతీయు’ అనే సూటి భావాన్ని నిలుపుతూ, ఇది సైనిక చర్య అని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; ‘పూర్తిగా ఓడించాడు’ లేదా ‘చంపాడు’ అని అతిగా నిర్ధారించదు.
- source_word: הֲדַדְעֶזֶר
  choice: హదదెజెరు
  rationale: దినవృత్తాంతముల గ్రంథంలోని హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజైన
  rationale: రాజు మరియు అతని రాజ్యాన్ని తెలిపే హీబ్రూ సమాస సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: חֲמָתָה
  choice: హమాతు వైపు
  rationale: స్థలనామానికి చేరిన దిశాసూచక ה ను ‘వైపు’ అని అనువదించి, హమాతు దిశగా జరిగిన సైనిక కదలికను నిలుపుతుంది.
- source_word: בְּלֶכְתּוֹ
  choice: అతడు ... వెళ్తున్నప్పుడు
  rationale: ב తో కూడిన క్రియానామ రూపంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగులో ఇస్తుంది. ‘అతడు’ ఎవరిని సూచిస్తుందో మూలంలోని సాధ్యమైన సందిగ్ధతను బలవంతంగా తొలగించదు.
- source_word: לְהַצִּיב יָדוֹ
  choice: తన ఆధిపత్యాన్ని నెలకొల్పడానికి
  rationale: అక్షరార్థంగా ‘తన చేతిని నిలపడం’ అనే రాజకీయ-సైనిక నుడికారాన్ని దాని సందర్భోచిత భావమైన అధికార స్థాపనగా అందిస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచింది.
- source_word: בִּנְהַר פְּרָת
  choice: యూఫ్రటీసు నది దగ్గర
  rationale: నది పేరును స్పష్టంగా ఇచ్చి, ב సూచించే ప్రదేశ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
