revisions:
- from: అతడు మోయాబును హతమార్చాడు; మోయాబీయులు దావీదుకు దాసులై, కప్పం చెల్లించేవారయ్యారు.
  to: అతడు మోయాబును కొట్టాడు; మోయాబీయులు దావీదుకు దాసులై, కప్పం తెచ్చేవారయ్యారు.[a]
  rationale: The revision removes the unwarranted implication of killing, retains the source’s military ‘struck’ language, and more closely reflects the participial expression ‘bearing/bringing tribute.’ The footnote preserves the lexical breadth of the Hebrew without obscuring the political-conquest context.
