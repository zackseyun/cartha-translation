translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త సైనిక వాక్య నిర్మాణాన్ని నిలుపుతూ, రాజకీయ అధీనతను సాధారణ పాఠకునికి స్పష్టంగా తెలిపే పదాలను ఎంచుకున్నాం.
