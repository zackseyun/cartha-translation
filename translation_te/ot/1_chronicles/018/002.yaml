id: 1CH.18.2
reference: 1 Chronicles 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֖ךְ אֶת מוֹאָ֑ב וַ/יִּהְי֤וּ מוֹאָב֙ עֲבָדִ֣ים לְ/דָוִ֔יד נֹשְׂאֵ֖י מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: te
  text: అతడు మోయాబును కొట్టాడు; మోయాబీయులు దావీదుకు దాసులై, కప్పం తెచ్చేవారయ్యారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదుకు దాసులై, కానుకలు మోసుకొచ్చేవారయ్యారు.” హెబ్రీ పదాలు విస్తృతంగా సేవకులు/దాసులు, కానుకలు/బహుమతులు అని అర్థమివ్వగలవు; అయితే జయించిన ప్రజల సందర్భంలో ఇవి రాజకీయ అధీనతను, కప్పాన్ని సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: נכה అనే క్రియకు ప్రాథమికంగా ‘కొట్టు/దెబ్బతీయు’ అనే భావం ఉంది; ఇక్కడ సైనిక సందర్భంలో ‘హతమార్చాడు’ దాని బలాన్ని నిలుపుతుంది, అయితే ‘ఓడించాడు’ అని ఫలితాన్ని మాత్రమే స్పష్టీకరించదు.
- source_word: מוֹאָב
  choice: మోయాబు / మోయాబీయులు
  rationale: మొదటి ప్రయోగంలో దేశం లేదా జాతీయ సమూహం దాడికి గురైనదిగా ‘మోయాబు’; రెండవ ప్రయోగంలో ప్రజలను సూచించే విధేయంతో సహజ తెలుగులో ‘మోయాబీయులు’ అని అనువదించబడింది.
- source_word: וַיִּהְיוּ
  choice: అయ్యారు
  rationale: కథన క్రమంలో היה విధేయంతో కలిసి స్థితిలోకి ప్రవేశించడాన్ని సూచిస్తుంది; అందువల్ల కేవలం ‘ఉన్నారు’ కంటే ‘అయ్యారు’ సరైనది.
- source_word: עֲבָדִים
  choice: దాసులు
  rationale: עבד సేవకుడు, దాసుడు లేదా రాజకీయంగా లోబడినవాడు అనే అర్థాలు ఇవ్వగలదు. జయించబడిన ప్రజల రాజకీయ అధీనతను తెలుగులో ‘దాసులు’ సంక్షిప్తంగా, బలంగా వ్యక్తపరుస్తుంది; స్వచ్ఛంద సేవ అనే భావాన్ని కలిగించే ‘సేవకులు’ కంటే ఇది సందర్భోచితం.
- source_word: לְדָוִיד
  choice: దావీదుకు
  rationale: ל ఇక్కడ సంబంధం లేదా అధీనతను సూచిస్తుంది; ‘దావీదుకు దాసులు’ సహజమైన తెలుగు నిర్మాణం.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: కప్పం చెల్లించేవారు
  rationale: నిఘంటుపరంగా ‘కానుకను మోసుకొచ్చేవారు’ అని ఉండగలిగినా, సైనిక-రాజకీయ సందర్భంలో מִנְחָה అధీన ప్రజలు పాలకునికి ఇచ్చే కప్పాన్ని సూచిస్తుంది. తెలుగులో ‘కప్పం చెల్లించేవారు’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
