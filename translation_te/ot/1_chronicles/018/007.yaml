translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడాం. ‘డాళ్లు’ యుద్ధ సామగ్రిని స్పష్టంగా సూచిస్తుంది. మూలంలోని ‘על’ ను యాంత్రికంగా ‘మీద’ అని కాక, సందర్భానుకూలంగా ‘దగ్గర ఉన్న’ అని ఇచ్చి, ధరించారా లేదా మోశారా అనే అస్పష్టతను కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
