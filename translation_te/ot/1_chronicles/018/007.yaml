  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֗יד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ עַ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: te
  text: దావీదు హదదెజెరు[c] సేవకులపై ఉన్న బంగారు డాళ్లను[a][b] తీసుకొని యెరూషలేముకు తెచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బంగారంతో అలంకరించిన డాళ్లు’; హీబ్రూ పదబంధం బంగారం పూత పూసిన డాళ్లను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సేవకులు’ అంటే ఆధునిక సంకుచిత అర్థంలో ఇంటి బానిసలే అని కాదు; హదదెజెరు రాజపరివార సేవకులు లేదా సైనిక సహాయకులు కావచ్చు.
    reason: cultural_note
  - marker: c
    text: కొన్ని పాఠ సంప్రదాయాల్లోను, 2 సమూయేలులోని సమాంతర వృత్తాంతంలోను ఈ పేరు ‘హదరెజెరు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు కథన సందర్భంలో సాధారణ అర్థం ‘తీసుకొను’. యుద్ధ సందర్భం వల్ల ‘స్వాధీనం చేసుకొను’ అనే భావం ఉండవచ్చు; అయితే మూలంలోని సాధారణతను నిలుపుకోవడానికి ‘తీసుకొని’ అని అనువదించాం.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: బంగారు డాళ్లను
  rationale: שׁלטים యుద్ధంలో ఉపయోగించే డాళ్లను, బహుశా చిన్న డాళ్లను సూచిస్తుంది. ఆధునిక తెలుగులో ‘బంగారు డాళ్లు’ సహజంగా ఉండి, అవి ఘన బంగారంతో చేసినవా లేక బంగారం పూత పూసినవా అనే మూలంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: దగ్గర ఉన్న
  rationale: అక్షరార్థంగా ‘వారిమీద ఉన్న’ అని చెప్పవచ్చు. ఈ సందర్భంలో వారు ధరించిన లేదా మోసిన డాళ్లు అనే భావాన్ని సహజ తెలుగులో తెలిపేందుకు ‘దగ్గర ఉన్న’ అని ఎంచుకున్నాం; నిర్దిష్టంగా ఎలా మోశారో నిర్ణయించలేదు.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: హదదెజెరు సేవకుల
  rationale: עבדים కు ప్రాథమికంగా ‘సేవకులు’ అనే అర్థం. రాజసైనిక సందర్భంలో రాజ పరివార సభ్యులు లేదా సైనిక సహాయకులు కావచ్చు; నిర్దిష్ట హోదాను చేర్చకుండా ‘సేవకులు’ అని ఉంచాం.
- source_word: הֲדַדְעָזֶר
  choice: హదదెజెరు
  rationale: ఈ వచనంలోని మసొరా పాఠం Hadadezer రూపాన్నే సమర్థిస్తుంది. సమాంతర పాఠంలోని Hadarezer రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: యెరూషలేముకు తెచ్చాడు
  rationale: Hiphil రూపంలోని בוא కు ‘తెచ్చు’ అనే అర్థం. కర్మను తెలుగులో సందర్భం ద్వారా స్పష్టంగా గ్రహించవచ్చు; ‘యెరూషలేముకు తెచ్చాడు’ సహజమైన, ఖచ్చితమైన అనువాదం.
