translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని వరుస సైనిక చర్యలను వేర్వేరుగా ఉంచి, ‘చేతిలోనుండి’ అనే అధికార రూపకాన్ని నిలిపింది. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘చుట్టుపక్కల పట్టణాలను’ అనే పదబంధం వద్ద ఉంచాం.
