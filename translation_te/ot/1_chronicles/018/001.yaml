language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛יד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֛ח אֶת גַּ֥ת וּ/בְנֹתֶ֖י/הָ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: te
  text: ఆ తరువాత దావీదు ఫిలిష్తీయులపై దాడి చేసి వారిని లోబరచాడు. అతడు ఫిలిష్తీయుల చేతిలోనుండి గాతును, దాని అనుబంధ పట్టణాలను[a] స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దాని కుమార్తెలను’; ఇది గాతుకు అనుబంధంగా లేదా దానిపై ఆధారపడి ఉన్న చిన్న పట్టణాలు లేదా గ్రామాలను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ఇది కథనంలో కాలక్రమాన్ని సూచించే సంధి పదబంధం. హీబ్రూ వాక్యరీతిని కృత్రిమంగా అనుకరించకుండా, దాని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּךְ
  choice: దాడిచేసి
  rationale: נכה అనే క్రియకు యుద్ధ సందర్భంలో ‘కొట్టు/దెబ్బతీయు’ అనే ప్రాథమిక భావం ఉంది. తరువాతి క్రియ ఫలితాన్ని తెలియజేస్తున్నందున, ఇక్కడ ‘దాడిచేసి’ అనేది చర్యను స్పష్టంగా ఉంచుతుంది; ‘ఓడించి’ అని అనువదిస్తే తరువాతి ‘లోబరచుకున్నాడు’తో భావపునరుక్తి కలుగుతుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి ప్రామాణికమైన తెలుగు రూపం.
- source_word: וַיַּכְנִיעֵם
  choice: వారిని లోబరచుకున్నాడు
  rationale: హిఫీల్ రూపంలోని כנע బలవంతంగా అధీనంలోకి లేదా విధేయతలోకి తీసుకురావడాన్ని సూచిస్తుంది. ఈ అనువాదం సైనిక-రాజకీయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּקַּח
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לקח ప్రాథమికంగా ‘తీసుకొను’ అని అర్థమైనా, ఇక్కడ పట్టణాలపై అధికారాన్ని పొందడం ఉద్దేశం. ‘స్వాధీనం చేసుకున్నాడు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גַּת
  choice: గాతు
  rationale: ఫిలిష్తీయుల పట్టణనామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: וּבְנֹתֶיהָ
  choice: దాని చుట్టుపక్కల పట్టణాలను
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణంపై ఆధారపడిన చిన్న పట్టణాలు లేదా గ్రామాలను సూచించే హీబ్రూ నుడికారం. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా ఆధీనాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
