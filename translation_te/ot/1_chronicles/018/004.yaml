translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగును, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘రథాలు’ అనే మూలపదంలోని పరోక్ష గుర్రాల సూచనను ప్రధాన వచనంలో స్పష్టం చేసి, అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరచాం. రెండు పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
