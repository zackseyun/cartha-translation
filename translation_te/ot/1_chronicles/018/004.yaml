source:
  edition: WLC
  text: וַ/יִּלְכֹּד֩ דָּוִ֨יד מִמֶּ֜/נּוּ אֶ֣לֶף רֶ֗כֶב וְ/שִׁבְעַ֤ת אֲלָפִים֙ פָּֽרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִיד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: te
  text: దావీదు అతని నుండి 1,000 రథాలను, 7,000 గుర్రపు రౌతులను[b], 20,000 మంది కాలినడక సైనికులను స్వాధీనం చేసుకున్నాడు. తరువాత దావీదు రథబలానికి చెందిన గుర్రాలన్నిటి వెనుక కాలి నరాలను కోయించాడు[a]; అయితే 100 రథాలకు సరిపడా గుర్రాలను మిగిల్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వచనంలో అక్షరార్థంగా ‘రథాలన్నిటిని/రథబలమంతటిని’ అని ఉంది. అయితే ‘వెనుక కాలి నరాలను కోయడం’ అనే క్రియ కారణంగా, ఇది రథబలానికి చెందిన గుర్రాలను సూచిస్తున్నదని అర్థం చేసుకోవాలి.
    reason: lexical_alternative
  - marker: b
    text: సమాంతర వచనమైన 2 సమూయేలు 8:4లో ‘7,000 గుర్రపు రౌతులు’కు బదులుగా ‘1,700 గుర్రపు రౌతులు’ అని ఉంది. ఇది పాఠపారంపర్యంలో ఉన్న సంఖ్యాపరమైన తేడా.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: పట్టుకున్నాడు
  rationale: לכד యుద్ధ సందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పట్టుకున్నాడు’ సహజంగా, మూలానికి దగ్గరగా ఉంది.
- source_word: מִמֶּנּוּ
  choice: అతని దగ్గర నుండి
  rationale: ఏకవచన ప్రత్యయం ముందటి సందర్భంలోని హదదెజెరును సూచిస్తుంది; తెలుగులో సూచిత వ్యక్తిని స్పష్టంగా ఉంచుతుంది.
- source_word: אֶלֶף רֶכֶב
  choice: 1,000 రథాలను
  rationale: רכב సమష్టిగా రథబలాన్ని సూచించగలిగినా, సంఖ్యతో ఉన్నందున లెక్కించదగిన ‘రథాలు’ అనేది సహజమైన అర్థం.
- source_word: פָּרָשִׁים
  choice: గుర్రపు రౌతులను
  rationale: ఈ పదం గుర్రాలపై పోరాడే యోధులను సూచిస్తుంది; ‘గుర్రపు రౌతులు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אִישׁ רַגְלִי
  choice: కాల్బల సైనికులను
  rationale: అక్షరార్థంగా ‘కాలినడక మనుషులు’; ‘కాల్బల సైనికులు’ సైనిక భావాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְעַקֵּר
  choice: వెనుక కాలి నరాలను కోయించాడు
  rationale: ఈ సందర్భంలో עקר గుర్రాలను పనికిరాకుండా చేయడానికి వాటి వెనుక కాలి నరాలను కోయడాన్ని సూచిస్తుంది; తెలుగులో ఒక్క పదంతో అస్పష్టంగా చెప్పడం కంటే ఈ వివరణ ఖచ్చితంగా ఉంటుంది.
- source_word: אֶת כָּל הָרֶכֶב
  choice: రథాలకు చెందిన గుర్రాలన్నిటి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘రథాలన్నిటిని/రథబలమంతటిని’ ఉన్నా, నరాలు కోయడం గుర్రాలకే వర్తిస్తుంది; అందువల్ల ఇక్కడ רכב రథబలానికి చెందిన గుర్రాలను పరోక్షంగా సూచిస్తుంది.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 100 రథాలకు సరిపడా గుర్రాలను మిగిల్చాడు
  rationale: ముందటి క్రియ గుర్రాలకు వర్తించడంతో, రథాల సంఖ్యకు సరిపడే గుర్రాలను మిగిల్చాడనే సూచిత భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
