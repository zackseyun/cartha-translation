id: 1CH.18.14
reference: 1 Chronicles 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֗י עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: te
  text: దావీదు ఇశ్రాయేలంతటిమీద రాజుగా పరిపాలించాడు. అతడు తన ప్రజలందరికీ న్యాయాన్నీ నీతినీ అమలు చేస్తూ ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీర్పు, నీతి.’ హీబ్రూ పదజంట దావీదు పాలనను వర్ణిస్తూ న్యాయపరమైన సక్రమతనూ నైతికంగా సరైనదాన్నీ కలిపి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך అనే క్రియ రాజుగా పాలించడాన్ని సూచిస్తుంది. చారిత్రక కథనంలో ‘రాజుగా పరిపాలించాడు’ సహజంగా ఉండి రాజాధికార భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: מלךతో వచ్చిన עַל పరిపాలనకు లోబడిన రాజ్యాన్ని సూచిస్తుంది; כָּל యొక్క సంపూర్ణ పరిధిని ‘ఇశ్రాయేలంతటిమీద’ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וַיְהִי עֹשֶׂה
  choice: జరిగిస్తూ ఉండేవాడు
  rationale: היה + కృదంత నిర్మాణం నిరంతరమైన లేదా అలవాటైన కార్యాన్ని తెలియజేస్తుంది. ‘ఉండేవాడు’ ఆ కొనసాగింపు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: రాజపాలనా సందర్భంలో ఇది న్యాయబద్ధమైన తీర్పు, న్యాయవ్యవస్థ నిర్వహణ అనే భావాన్ని కలిగి ఉంది; ‘న్యాయం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּצְדָקָה
  choice: నీతి
  rationale: צְדָקָה నైతిక సదాచారాన్ని, సరైన క్రమాన్ని సూచిస్తుంది. מִשְׁפָּטతో జతగా ఉన్నప్పుడు ‘నీతి’ రెండవ భావాన్ని వేరుగా నిలుపుతుంది.
- source_word: לְכָל עַמּוֹ
  choice: తన ప్రజలందరికీ
  rationale: ל ప్రయోజనం పొందేవారిని సూచిస్తుంది; మూడవ పురుష ఏకవచన ప్రత్యయాన్ని ‘తన’గా, כָּל యొక్క సమగ్రతను ‘అందరికీ’గా నిలుపుతుంది.
theological_decisions:
- issue: మִשְׁפָּט וּצְדָקָה అనే రాజపాలనా నైతిక పదజంట అనువాదం
  choice: న్యాయం, నీతి
  alternative: తీర్పు, నీతి
  rationale: ఈ పదజంట న్యాయపరమైన సక్రమతనూ నైతిక యథార్థతనూ కలిపి దావీదు పాలనను వర్ణిస్తుంది. రెండు పదాలను వేరుగా ఉంచడం వాటి భావసామీప్యాన్ని కలిపివేయకుండా మూలంలోని సమృద్ధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. కొనసాగుతూ వచ్చిన పాలనా ఆచరణను ‘జరిగిస్తూ ఉండేవాడు’ ద్వారా వ్యక్తం చేశాం; పదజంటపై ఉన్న నిజమైన భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
