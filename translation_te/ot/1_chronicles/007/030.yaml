source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֥רַח אֲחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: te
  text: 'ఆషేరు కుమారులు: ఇమ్నా[a], ఇష్వా, ఇష్వీ, బెరీయా; వారి సహోదరి సెరహు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పేర్లను ఇతర భాషల్లో లిప్యంతరీకరించే సంప్రదాయాన్ని బట్టి రూపాలు మారవచ్చు. ‘ఇమ్నా’ను ‘యిమ్నా’ అని, ‘ఇష్వా’ను ‘ఇషువా’ అని, ‘ఇష్వీ’ను ‘ఇషూయి’ అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే పదానికి నిర్మాణ బహువచన రూపం. ఇక్కడ వెంటనే పేర్లతో పిల్లల జాబితా వస్తున్నందున ‘వంశస్థులు’ కంటే ‘కుమారులు’ సూటిగా సరిపోతుంది.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామాన్ని తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יִמְנָה
  choice: ఇమ్నా
  rationale: మసొరేటిక్ పాఠంలోని హీబ్రూ ఉచ్చారణకు దగ్గరగా పేరును లిప్యంతరీకరించాం.
- source_word: יִשְׁוָה
  choice: ఇష్వా
  rationale: ఈ వచనంలోని మసొరేటిక్ స్వరచిహ్నాలకు అనుగుణంగా పేరును లిప్యంతరీకరించాం.
- source_word: יִשְׁוִי
  choice: ఇష్వీ
  rationale: హీబ్రూ రూపంలోని చివరి దీర్ఘ ī ధ్వనిని తెలుగులో ‘ఈ’తో ప్రతిబింబించాం.
- source_word: בְרִיעָה
  choice: బెరీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని అక్షర-స్వర రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שֶׂרַח
  choice: శెరహు
  rationale: ఈ పేరు సాధారణమైన ‘శారా’ అనే వేరే హీబ్రూ పేరుతో కలవకుండా, మూలంలోని ś/ś́ ధ్వని మరియు చివరి ח ధ్వనిని దగ్గరగా చూపేలా లిప్యంతరీకరించాం.
- source_word: אֲחוֹתָם
  choice: వారి సహోదరి
  rationale: మూలంలో మూడవ పురుష బహువచన ప్రత్యయం ఉంది; అందువల్ల ఆమె జాబితాలోని సోదరులందరి సహోదరి అని స్పష్టంగా అనువదించాం.
