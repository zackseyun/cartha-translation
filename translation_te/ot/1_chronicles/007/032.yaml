  edition: WLC
  text: וְ/חֶ֨בֶר֙ הוֹלִ֣יד אֶת יַפְלֵ֔ט וְ/אֶת שׁוֹמֵ֖ר וְ/אֶת חוֹתָ֑ם וְ/אֵ֖ת שׁוּעָ֥א אֲחוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
translation:
  language: te
  text: హెబెరు యఫ్లేటును, షోమెరును[a], హోతామును, వారి సహోదరి షూవాను[b] కన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘షెమెరు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘షూవాహు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶר
  choice: హెబెరు
  rationale: వ్యక్తి పేరు; హెబ్రీ రూపానికి అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది; ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా ఆ వంశావళి భావాన్ని తెలియజేస్తుంది.
- source_word: יַפְלֵט
  choice: యఫ్లేటు
  rationale: వ్యక్తి పేరు; మసొరెటికు పాఠంలోని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: שׁוֹמֵר
  choice: షోమెరు
  rationale: వ్యక్తి పేరు; మసొరెటికు స్వరచిహ్నాలను అనుసరించిన రూపం. ‘షెమెరు’ అనే ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: חוֹתָם
  choice: హోతాము
  rationale: వ్యక్తి పేరు; హెబ్రీ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: שׁוּעָא
  choice: షూవా
  rationale: వ్యక్తి పేరు; హెబ్రీ రూపంలోని దీర్ఘ స్వరాన్ని సహజ తెలుగు లిప్యంతరణలో ప్రతిబింబిస్తుంది. ‘షూవాహు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲחוֹתָם
  choice: వారి సహోదరి
  rationale: పదంలోని తృతీయ పురుష బహువచన ప్రత్యయం ‘వారి’ అని స్పష్టంగా సూచిస్తుంది; ముందు పేర్కొన్న సోదరులందరినీ సమష్టిగా ఉద్దేశించిన భావాన్ని నిలుపుతుంది.
