  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హెబ్రీ వాక్యంలోని ‘వారి సహోదరి’ అనే అన్వయాన్ని స్పష్టత కోసం పేరు ముందు ఉంచినా, దాని బహువచన సూచనను మార్చలేదు.
