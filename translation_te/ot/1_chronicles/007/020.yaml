base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: te
  text: 'ఎఫ్రాయిము కుమారులు: షూతెలహు[a]; అతని కుమారుడు బెరెదు; అతని కుమారుడు తహతు; అతని కుమారుడు ఎల్యాదా; అతని కుమారుడు తహతు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళుల్లో ‘కుమారుడు’ అనే హీబ్రూ పదం కొన్నిసార్లు తరువాతి తరానికి చెందిన సంతానాన్ని కూడా సూచించవచ్చు; అయితే ఇక్కడ ప్రతి దశలోనూ మూలపాఠం అక్షరార్థంగా ‘అతని కుమారుడు’ అని చదువుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారులు
  rationale: వంశావళి శీర్షికగా సహజమైన తెలుగులో అందించబడింది. ఆరంభంలోని וּ సంధిని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా జాబితా నిర్మాణం నిలిచివుంది.
- source_word: שׁוּתָלַח
  choice: షూతెలహు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: וּבֶרֶד
  choice: బెరెదు
  rationale: వంశక్రమంలోని వ్యక్తిపేరుగా ధ్వన్యనుకరణ చేయబడింది; సంబంధాన్ని తరువాతి ‘అతని కుమారుడు’ స్పష్టం చేస్తుంది.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: בן అనే పదం 3వ పురుష ఏకవచన పురుష ప్రత్యయంతో ఇక్కడ అక్షరార్థంగా ‘అతని కుమారుడు’. వంశావళుల్లో ఇది దూరపు సంతానాన్ని కూడా సూచించగల అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְתַחַת
  choice: తహతు
  rationale: ఇక్కడ תַחַת సాధారణ అవ్యయం కాదు, వ్యక్తిపేరు; అందువల్ల అనువదించకుండా ధ్వన్యనుకరణ చేశాం.
- source_word: וְאֶלְעָדָה
  choice: ఎల్యాదా
  rationale: హీబ్రూ వ్యక్తిపేరును మూల ఉచ్చారణకు దగ్గరగా తెలుగు రూపంలో ఇచ్చాం.
- source_word: וְתַחַת בְּנוֹ
  choice: అతని కుమారుడు తహతు
  rationale: మూలంలోని పునరావృత వంశావళి సూత్రాన్ని తొలగించకుండా, తెలుగులో సహజమైన పదక్రమంలో నిలిపాం.
