translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వంశావళి శైలి. మూలంలోని వరుస తరాల నిర్మాణాన్ని సెమికోలన్లతో స్పష్టంగా చూపించాం; పునరావృతాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
