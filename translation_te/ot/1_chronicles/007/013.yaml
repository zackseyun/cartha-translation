source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֗י יַחֲצִיאֵ֧ל וְ/גוּנִ֛י וְ/יֵ֥צֶר וְ/שַׁלּ֖וּם בְּנֵ֥י בִלְהָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: te
  text: 'నఫ్తాలి కుమారులు: యహజీయేలు[a], గూనీ, యేసెరు, షల్లూము—బిల్హా కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండము 46:24లో ఈ పేరుకు “షిల్లేము” అని ఉంది; ఇక్కడ 1 దినవృత్తాంతములు గ్రంథంలో “షల్లూము” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בן యొక్క నిర్మాణ బహువచనానికి నేరమైన అర్థం ‘కుమారులు’. ఇక్కడ వెంటనే నలుగురు పురుషుల పేర్లు రావడం వల్ల ఇదే అత్యంత ఖచ్చితమైన ఎంపిక.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: హీబ్రూ వ్యక్తి/గోత్రనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יַחֲצִיאֵל
  choice: యహజీయేలు
  rationale: హీబ్రూ పేరులోని హల్లులు, ఉచ్చారణను తెలుగులో సహజంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: גוּנִי
  choice: గూనీ
  rationale: హీబ్రూ వ్యక్తినామానికి సూటి తెలుగు లిప్యంతరీకరణ.
- source_word: יֵצֶר
  choice: యేసెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: దినవృత్తాంతముల మసోరా పాఠంలోని షల్లూము రూపాన్నే అనుసరించాం; ఆదికాండంలోని భిన్న రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּנֵי בִלְהָה
  choice: వీరు బిల్హా కుమారులు
  rationale: ఈ వంశావళి వివరణ ముందున్న నలుగురినీ బిల్హా వంశంతో అనుసంధానిస్తుంది. తెలుగులో స్పష్టత, సహజత్వం కోసం ‘వీరు’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని పేర్ల క్రమం, బిల్హాతో వంశసంబంధం యథాతథంగా నిలుపబడ్డాయి.
