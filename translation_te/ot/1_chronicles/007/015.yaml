source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: te
  text: మాకీరు హుప్పీముకు, షుప్పీముకు ఒక భార్యను తీసుకున్నాడు. అతని సోదరి పేరు మయకా; రెండవవాని పేరు సెలోపెహాదు[a]. సెలోపెహాదుకు కుమార్తెలు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండవ కుమారుని పేరు సెలోపెహాదు.” హీబ్రూ పాఠ్యంలో కేవలం “రెండవవాడు” అని ఉంది; అది ఎవరిని సూచిస్తుందో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: ఒక భార్యను తీసుకున్నాడు
  rationale: ‘భార్యను తీసుకోవడం’ అనే హీబ్రూ వివాహ సంబంధ జాతీయాన్ని నిలుపుతూ, వెంట వచ్చే ‘హుప్పీముకు, షుప్పీముకు’ అనే అసాధారణ నిర్మాణాన్ని యథాతథంగా ప్రతిబింబిస్తుంది.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: హుప్పీముకు, షుప్పీముకు
  rationale: రెండు పేర్ల ముందున్న לְ విభక్తిని తెలుగులో రెండుసార్లూ ‘-కు’తో చూపించి, మాకీరు వారి కోసం భార్యను తీసుకున్నాడనే అసాధారణ వాక్య నిర్మాణాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: అతని సోదరి పేరు మయకా
  rationale: పేరును తెలిపే సూత్రానికి సహజమైన తెలుగు రూపం; ‘అతని’ అనే సర్వనామం సమీప పూర్వపదమైన మాకీరును సూచించే సహజ పఠనాన్ని అనుసరిస్తుంది.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: రెండవవాని పేరు సెలోపెహాదు
  rationale: హీబ్రూలో ఉన్న ‘రెండవవాడు’ అనే సంక్షిప్త, సందిగ్ధ సూచనను ‘కుమారుడు’ అని పూరించకుండా నిలుపుతుంది.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: సెలోపెహాదుకు కుమార్తెలు ఉన్నారు
  rationale: హీబ్రూ అస్తిత్వ-స్వామ్య నిర్మాణానికి సహజమైన ఆధునిక తెలుగు రూపం; అతనికి కుమార్తెలు ఉన్నారనే వంశావళి సమాచారాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ‘రెండవవాడు’ అనే వంశావళి సూచనలోని సందిగ్ధత
  choice: ప్రధాన పాఠ్యంలో ‘రెండవవాని’ అని ఉంచి, ‘కుమారుడు’ అనే పదాన్ని చేర్చలేదు.
  alternative: ‘రెండవ కుమారుని పేరు సెలోపెహాదు’
  rationale: హీబ్రూ పాఠ్యం కేవలం ‘రెండవవాడు’ అని మాత్రమే చెబుతుంది; సూచిత వ్యక్తి ఎవరో స్పష్టంగా పేర్కొనదు. అందువల్ల వంశావళిని అనవసరంగా నిర్ణయించకుండా అసలు పాఠ్యంలోని సంక్షిప్తతను నిలిపి, సాధ్యమైన పఠనాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. పేర్లు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; అసలు పాఠ్యంలోని వంశావళి సందిగ్ధతను ప్రధాన పాఠ్యంలోనే నిలుపుకున్నాం.
