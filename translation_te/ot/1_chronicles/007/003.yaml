translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల వంశావళి శైలి. వరుసగా వచ్చిన రెండు హీబ్రూ సంధికారకాలను తెలుగులో వేర్వేరు సంక్షిప్త వాక్యాలుగా ఇచ్చాం. పేర్లను అనువదించకుండా లిప్యంతరీకరించాం; సంఖ్యకు సంబంధించిన మూలపాఠ్య ఉద్వేగాన్ని తొలగించకుండా ఉంచాం.
