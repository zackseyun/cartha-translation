id: 1CH.7.3
reference: 1 Chronicles 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: te
  text: 'ఉజ్జీ కుమారులు: ఇజ్రహ్యా. ఇజ్రహ్యా కుమారులు: మిఖాయేలు, ఓబద్యా, యోవేలు, ఇష్షీయా—వీరందరూ ఐదుగురు ప్రధానులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఐదుగురు వంశ ప్రధానులు’ లేదా ‘ఐదుగురు కుటుంబ ప్రధానులు.’ హీబ్రూలో అక్షరార్థంగా, ‘ఐదుగురు ప్రధానులు, వారందరూ’ అని ఉంది. అయితే ఇజ్రహ్యా కుమారులుగా ఇక్కడ నాలుగు పేర్లు మాత్రమే ఇవ్వబడ్డాయి; మూలపాఠ్యం ఈ సంఖ్యా భేదాన్ని అలాగే ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עֻזִּי
  choice: ఉజ్జీ కుమారుడు
  rationale: బహువచన వంశావళి సూత్రం అక్షరార్థంగా ‘ఉజ్జీ కుమారులు’ అయినప్పటికీ ఇక్కడ ఒక్క ఇజ్రహ్యా మాత్రమే పేర్కొనబడ్డాడు. సహజమైన ఆధునిక తెలుగులో సంఖ్యానుసారం ఏకవచనం వాడి భావాన్ని స్పష్టంగా ఉంచాం.
- source_word: יִזְרַחְיָה
  choice: ఇజ్రహ్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించాం; రెండు సందర్భాల్లోనూ ఒకే రూపాన్ని నిలిపాం.
- source_word: מִיכָאֵל
  choice: మిఖాయేలు
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో సుపరిచితమైన రూపం.
- source_word: וְעֹבַדְיָה
  choice: ఓబద్యా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְיוֹאֵל
  choice: యోవేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: יִשִּׁיָּה
  choice: ఇష్షీయా
  rationale: మధ్య హీబ్రూ ఘర్ష ధ్వనిని ‘ష్షీ’తో సూచిస్తూ పేరును మూలరూపానికి దగ్గరగా ఉంచాం.
- source_word: חֲמִשָּׁה רָאשִׁים כֻּלָּם
  choice: వీరందరూ పెద్దలు—మొత్తం ఐదుగురు
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘ఐదుగురు పెద్దలు, వారందరూ.’ ‘పెద్దలు’ అనే పదం రֹאשִׁים యొక్క నాయకత్వ భావాన్ని నిలుపుతుంది; సహజ తెలుగు వాక్యక్రమంలో మొత్తం సంఖ్యను చివర ఉంచాం. జాబితాలో నాలుగు కుమారులే ఉండటంతో, ఐదుగురు అనే లెక్కలో ఇజ్రహ్యా కూడా చేరుతున్నాడనే భావం సందర్భం ద్వారా కనిపిస్తుంది.
