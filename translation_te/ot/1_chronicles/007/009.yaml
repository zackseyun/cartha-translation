id: 1CH.7.9
reference: 1 Chronicles 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: te
  text: తమ తరాల ప్రకారం వంశావళిలో నమోదు చేయబడిన వారు తమ పితృకుటుంబాల పెద్దలైన పరాక్రమవంతులు—ఇరవై వేల రెండువందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: వంశావళిలో నమోదైనవారు
  rationale: హిత్పయేల్ రూపం వంశావళి రికార్డులో చేర్చబడడం లేదా నమోదు చేయబడడాన్ని సూచిస్తుంది. ‘లెక్కించబడినవారు’ అనే సాధారణ అర్థం కంటే ఈ ఎంపిక పరిపాలనా-వంశావళి సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְתֹלְדוֹתָם
  choice: తమ తరాల ప్రకారం
  rationale: תולדות అనే పదంలోని తరాలు, వంశపరంపర అనే భావాలను సాధ్యమైనంత నేరుగా నిలుపుతూ, వంశావళి సందర్భంలో సహజమైన తెలుగును ఇస్తుంది.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: తమ పితృకుటుంబాల పెద్దలు
  rationale: ఇది కేవలం చిన్న కుటుంబాలను కాకుండా పూర్వికుని ఆధారంగా ఏర్పడిన వంశసంబంధ కుటుంబ విభాగాలను సూచిస్తుంది. ‘పెద్దలు’ నాయకత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גִּבּוֹרֵי חָיִל
  choice: పరాక్రమవంతులు
  rationale: ఈ పదబంధం బలం, శౌర్యం, సైనిక సామర్థ్యం వంటి విస్తృత భావాలను కలిగి ఉంది. ‘పరాక్రమవంతులు’ దానిని కేవలం యోధులకే పరిమితం చేయదు.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: ఇరవై వేల రెండువందల మంది
  rationale: హీబ్రూ సంఖ్యను సాహిత్య శైలికి తగినట్లుగా పదాల్లో ఇచ్చి, వ్యక్తుల సంఖ్య అని తెలుగులో స్పష్టంచేయడానికి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. మూలంలోని వంశావళి-పరిపాలనా భావం, పితృవంశ సామాజిక నిర్మాణం, పరాక్రమానికి ఉన్న విస్తృత భావం నిలుపబడ్డాయి.
