  terminology: ‘వంశావళి’ appropriately renders the genealogical-record context, and ‘పితృకుటుంబాలు’ is a serviceable concise expression for the clan-based ‘fathers’ houses.’ ‘పరాక్రమవంతులు’ preserves the broad force of גִּבּוֹרֵי חָיִל without unnecessarily limiting it to combatants.
  issues:
  - severity: low
    issue: The opening expression is somewhat compressed and can momentarily make ‘తమ తరాల ప్రకారం’ appear to modify only the people rather than their genealogical registration.
    rationale: The Hebrew participial expression concerns their being genealogically enrolled/registered according to their generations. An explicit passive verb improves Telugu syntax while retaining the source sense.
