id: 1CH.7.34
reference: 1 Chronicles 7:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: te
  text: 'షామెరు కుమారులు[a]: అహీ, రోహ్గా, యెహుబ్బా[b], అరాము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళుల్లో “కుమారులు” అనే మాట ప్రత్యక్ష కుమారులనే కాక పురుష వంశస్థులను లేదా వంశశాఖ సభ్యులను కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: ఈ పేరును హీబ్రూ నుంచి లిప్యంతరీకరించేటప్పుడు “యెహుబ్బా” లేదా “హుబ్బా” వంటి రూపాలు వాడబడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సూత్రంలో בְּנֵי అనే నిర్మాణ బహువచనానికి సహజమైన తెలుగు రూపం. సందర్భానుసారం ఇది ప్రత్యక్ష కుమారులనే కాక పురుష వంశస్థులను లేదా వంశశాఖ సభ్యులను కూడా సూచించవచ్చు.
- source_word: שָׁמֶר
  choice: షామెరు
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న שָׁמֶר (షామెర్) రూపాన్ని తెలుగులో ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: אֲחִי
  choice: అహీ
  rationale: ఇది ‘నా సహోదరుడు’ అనే అర్థాన్ని సూచించగల రూపంతో సమానంగా ఉన్నప్పటికీ, ఈ వంశావళిలో వ్యక్తిపేరుగా పనిచేస్తుంది; అందువల్ల అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וְרוֹהְגָּה
  choice: రోహ్గా
  rationale: సంయోజక అవ్యయాన్ని జాబితా నిర్మాణంలో సహజంగా వ్యక్తం చేసి, వ్యక్తిపేరును హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יְחֻבָּה
  choice: యెహుబ్బా
  rationale: ఆదిలోని యోడ్‌ను ‘యె-’గా, బలపరచబడిన బేత్‌ను ‘బ్బ’గా ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: וַאֲרָם
  choice: అరాము
  rationale: אֲרָם అనే వ్యక్తిపేరును ‘అరాము’గా నేరుగా లిప్యంతరీకరించాం; ముందున్న సంయోజకాన్ని తెలుగు జాబితా విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. వ్యక్తిపేర్లు మూల హీబ్రూ స్వరరూపాలకు దగ్గరగా, తెలుగు పఠనానికి సహజంగా ఇచ్చాం; హీబ్రూలోని ప్రతి సంయోజకాన్ని విడిగా ‘మరియు’ అని పెట్టకుండా తెలుగు జాబితా పద్ధతిని అనుసరించాం.
