  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
translation:
  language: te
  text: బెత్సెర్, హోద్, షమ్మా, షిల్షా, యిత్రాన్, బెఎరా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: బెట్సెరు
  rationale: వంశావళిలోని వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణలోని /ts/ ధ్వనిని ‘ట్స’తో సూచించి లిప్యంతరీకరించాం.
- source_word: הוֹד
  choice: హోదు
  rationale: సాధారణ నామవాచకంగా ‘మహిమ’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ పేర్ల జాబితాలో వ్యక్తి పేరు కాబట్టి అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: שַׁמָּא
  choice: షమ్మా
  rationale: హీబ్రూ రూపంలోని ద్విత్వ మకారాన్ని, చివరి దీర్ఘ అచ్చును నిలుపుతూ వ్యక్తి పేరుగా లిప్యంతరీకరించాం.
- source_word: שִׁלְשָׁה
  choice: షిల్షా
  rationale: హీబ్రూ స్వరయుక్త రూపానికి దగ్గరగా, తెలుగులో సహజంగా చదవగల రూపాన్ని ఎంచుకున్నాం.
- source_word: יִתְרָן
  choice: యిత్రాను
  rationale: హీబ్రూ ఆది యోద్‌ను ‘య’గా, చివరి దీర్ఘ ā ధ్వనిని ‘ా’గా ప్రతిబింబించే ప్రత్యక్ష లిప్యంతరీకరణ.
- source_word: בְאֵרָא
  choice: బెయేరా
  rationale: మధ్యలోని అలెఫ్ వల్ల ఏర్పడే స్వర విరామాన్ని చదవడానికి సహజమైన ‘యే’ రూపంతో సూచించాం; దీనిని మరింత స్పష్టంగా ‘బెఎరా’ అని కూడా లిప్యంతరీకరించవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితా యొక్క సంక్షిప్త రూపాన్ని యథాతథంగా ఉంచాం. వ్యక్తి పేర్లను అర్థానువాదం చేయకుండా హీబ్రూ స్వరయుక్త పాఠానికి దగ్గరగా, సాధారణ పాఠకుడు చదవగల తెలుగు రూపాల్లో లిప్యంతరీకరించాం.
