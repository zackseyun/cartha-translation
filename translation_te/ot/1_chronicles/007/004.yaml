source:
  edition: WLC
  text: וַ/עֲלֵי/הֶ֨ם לְ/תֹלְדוֹתָ֜/ם לְ/בֵ֣ית אֲבוֹתָ֗/ם גְּדוּדֵי֙ צְבָ֣א מִלְחָמָ֔ה שְׁלֹשִׁ֥ים וְ/שִׁשָּׁ֖ה אָ֑לֶף כִּֽי הִרְבּ֥וּ נָשִׁ֖ים וּ/בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: te
  text: వారితో పాటు, వారి తరాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, యుద్ధసైన్య దళాలు[b] 36,000 మంది ఉన్నారు; ఎందుకంటే వారికి అనేకమంది భార్యలు[a], కుమారులు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్త్రీలు’; హీబ్రూ పదానికి రెండు అర్థాలూ సాధ్యమే. అయితే కుటుంబ, వంశావళి సందర్భంలో ‘భార్యలు’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యుద్ధసైన్య దళాలు’ అనేది హీబ్రూలోని సంక్షిప్త సైనిక పదబంధం; దీనిని ‘యుద్ధానికి సైనిక విభాగాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: వారితో ఉన్న
  rationale: జాబితా సందర్భంలో עַל అనుబంధాన్ని సూచిస్తుంది; స్థలార్థకమైన ‘వారిపైన’ కంటే ‘వారితో ఉన్న’ సహజంగా సరిపోతుంది.
- source_word: לְתֹלְדוֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: תּוֹלְדוֹת ఇక్కడ వంశపారంపర్య విభాగాలను సూచిస్తుంది; ‘వంశావళులు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְבֵית אֲבוֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: ఇది తండ్రి వంశం ఆధారంగా ఏర్పడిన గృహ లేదా వంశ సమూహాలను సూచించే ప్రామాణిక హీబ్రూ పదబంధం.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: యుద్ధసైన్య దళాలు
  rationale: హీబ్రూలోని వరుస సైనిక పదాలను తెలుగులో సహజమైన సంక్షిప్త సమాసంగా అందిస్తూ, దళాలు మరియు యుద్ధసైన్యం అనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36,000 మంది
  rationale: ఖచ్చిత సంఖ్యను ఆధునిక పఠనానికి అనుకూలంగా అంకెల్లో ఇచ్చి, లెక్కించబడినవారు మనుషులని ‘మంది’తో స్పష్టం చేసింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న పెద్ద సైనిక సంఖ్యకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הִרְבּוּ
  choice: చాలామంది ఉన్నారు
  rationale: רבה హిఫీల్ రూపం ‘అనేకమయ్యేలా చేయడం/పెంచడం’ అనే భావాన్ని ఇస్తుంది; భార్యలు, కుమారులతో కలిపి తెలుగులో ‘చాలామంది ఉన్నారు’ సహజంగా ఉంటుంది.
- source_word: נָשִׁים
  choice: భార్యలు
  rationale: ఈ కుటుంబ, వంశావళి సందర్భంలో ‘స్త్రీలు’ అనే సాధారణ అర్థం కంటే జనాభా పెరుగుదలను వివరించే ‘భార్యలు’ సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּבָנִים
  choice: కుమారులు
  rationale: בָּנִים యొక్క ప్రత్యక్ష అర్థమైన ‘కుమారులు’ను వంశావళి సందర్భానికి అనుగుణంగా నిలుపుతుంది.
