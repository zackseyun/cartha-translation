    rationale: A footnote marker must occur at the word or phrase it annotates. Its current placement misleadingly associates a military lexical note with the household clause.
  - severity: low
    issue: The opening construction “వారితో ఉన్న ... దళాలు” is syntactically awkward.
    rationale: Recasting it as “వారితో పాటు ... దళాలు ... ఉన్నారు” gives natural modern Telugu without altering the source relationship.
