- from: వారి వంశావళుల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, వారితో ఉన్న యుద్ధసైన్య దళాలు 36,000 మంది. ఎందుకంటే వారికి భార్యలు[a], కుమారులు చాలామంది ఉన్నారు.[b]
