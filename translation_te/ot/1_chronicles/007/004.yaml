translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వంశావళి, పితృకుటుంబం వంటి సందర్భోచిత పదాలను ఉపయోగించి, హీబ్రూ వాక్యంలోని సైనిక పదసముదాయాన్ని అతిగా విడదీయకుండా స్పష్టంగా అందించింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
