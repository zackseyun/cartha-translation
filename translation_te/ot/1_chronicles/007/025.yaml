translation:
  language: te
  text: అతని కుమారుడు రెఫహు[a], రెషెఫు, అతని కుమారుడు తెలహు, అతని కుమారుడు తహను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వంశావళుల్లో క్రియను స్పష్టంగా పేర్కొనకుండా ఉండడం సాధారణం. ఇక్కడి వరుస సంతతి పేర్ల జాబితా: ‘అతని కుమారుడు రెఫహు, రెషెఫు, అతని కుమారుడు తెలహు, అతని కుమారుడు తహను.’'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: రెఫహు
  rationale: వంశావళిలోని వ్యక్తి పేరు; అనువదించకుండా, హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న ‘కుమారుడు’ అనే రూపాన్ని సహజ తెలుగులో ఇచ్చి, వంశావళి సూత్రంలోని పునరుక్తిని నిలిపాం.
- source_word: רֶשֶׁף
  choice: రెషెపు
  rationale: ఇక్కడ వంశావళిలో వ్యక్తి పేరుగా పనిచేస్తోంది; ఇతర సందర్భాల్లో ఉండగల సాధారణ నామార్థాలను ఇక్కడ ప్రవేశపెట్టకుండా లిప్యంతరీకరించాం.
- source_word: תֶלַח
  choice: తెలహు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: תַחַן
  choice: తహను
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ రూపం ఆధారంగా లిప్యంతరీకరించాం.
- source_word: וְ
  choice: కామాలతో అనుసంధానం
  rationale: పేర్లను కలిపే హీబ్రూ సంధికారకాన్ని తెలుగులో జాబితాకు సహజమైన విరామచిహ్నాలతో వ్యక్తం చేశాం; క్రమాన్ని యథాతథంగా ఉంచాం.
theological_decisions:
- issue: వంశపరంపర సంబంధాల అస్పష్టత
  choice: హీబ్రూ వాక్యంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని యథాతథంగా ఉంచడం
  alternative: ప్రతి వ్యక్తి ఎవరి కుమారుడో వివరణాత్మకంగా చేర్చడం
  rationale: హీబ్రూ పాఠ్యంలో క్రియ లేదు; వరుసగా వచ్చే ‘అతని కుమారుడు’ అనే పదబంధాల పూర్వపద సంబంధం కొంత సంక్షిప్తంగా ఉంది. మూలపాఠ్యం స్పష్టంగా చెప్పనిదాన్ని అనువాదంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లకు తెలుగు పదాంత ఉచ్చారణ సౌలభ్యం కోసం ‘ు’ ఉపయోగించబడింది; మూలంలోని సంక్షిప్తత, పునరుక్తి, సంబంధ అస్పష్టత నిలుపబడ్డాయి.
