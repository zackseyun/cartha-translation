  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֥י אוּלָ֖ם בְּדָ֑ן אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד בֶּן מָכִ֖יר בֶּן מְנַשֶּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: te
  text: 'ఉలాము కుమారులు: బెదాను. వీరు గిలాదు కుమారులు[a]. గిలాదు మాకీరు కుమారుడు; మాకీరు మనష్షే కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “వీరు గిలాదు కుమారులు.” ఈ వాక్యభాగం ఉలాము వంశాన్ని గిలాదు, మాకీరు, మనష్షే ద్వారా వెనక్కి అనుసంధానించే వంశావళి సారాంశంగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְנֵי అనే నిర్మాణ బహువచనానికి సహజమైన తెలుగు రూపం ‘కుమారులు’. వచనారంభంలోని ו అనేది సాధారణ అనుసంధాన సూచకం; తెలుగులో విడిగా ‘మరియు’ అని చేర్చకపోవడం మరింత సహజం.
- source_word: אוּלָם
  choice: ఉలాము
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యంతరీకరణ పద్ధతిలో ఇచ్చాం.
- source_word: בְּדָן
  choice: బెదాను
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యంతరీకరణ పద్ధతిలో ఇచ్చాం.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: హీబ్రూ నిర్దేశక సర్వనామాన్ని వ్యక్తులను సూచించే సహజ తెలుగు బహువచన రూపంతో అనువదించాం; కాలాన్ని సూచించే క్రియ హీబ్రూలో లేకపోవడంతో తెలుగులోనూ అనవసరంగా చేర్చలేదు.
- source_word: בְּנֵי גִלְעָד
  choice: గిలాదు కుమారులు
  rationale: విస్తృతార్థమైన ‘వంశస్థులు’కు బదులుగా హీబ్రూ వంశావళి నుడికారంలోని ‘కుమారులు’ అనే రూపాన్ని నిలిపాం.
- source_word: בֶּן מָכִיר
  choice: గిలాదు మాకీరు కుమారుడు
  rationale: హీబ్రూ వంశావళి సంబంధాన్ని స్పష్టమైన, సహజమైన తెలుగు వాక్యంగా ఇచ్చాం.
- source_word: בֶּן מְנַשֶּׁה
  choice: మాకీరు మనష్షే కుమారుడు
  rationale: వరుస వంశ సంబంధాన్ని తెలుగులో అపార్థం రాకుండా వ్యక్తపరిచాం.
theological_decisions:
- issue: ‘వీరు గిలాదు కుమారులు’ అనే వాక్యభాగం ఉలాము వంశాన్ని గిలాదు వరకు వెనక్కి అనుసంధానించే వంశావళి సారాంశమా అన్నది స్పష్టంగా లేదు.
  choice: ప్రధాన పాఠంలో ‘వీరు గిలాదు కుమారులు’ అనే హీబ్రూ నిర్మాణాన్ని నిలిపి, దాని సాధ్యమైన సారాంశ విధిని పాదటిప్పణిలో తెలిపాం.
  alternative: ‘వీరు గిలాదు వంశస్థులు’ అని అర్థాన్ని విస్తరించి చెప్పడం.
  rationale: మూలంలోని ‘కుమారులు’ అనే వంశావళి నుడికారాన్నీ, వాక్యభాగం పని గురించి ఉన్న అస్పష్టతనూ ఏ సిద్ధాంతపరమైన నిర్ణయంతోనూ ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వంశావళి శైలిని వాడాం. పేర్లను అనువదించకుండా ధ్వన్యంతరీకరించాం. హీబ్రూలో క్రియ లేని చోట తెలుగులోనూ కాలాన్ని నిర్దేశించే ‘ఉన్నారు/ఉండేవారు’ వంటి క్రియను చేర్చలేదు.
