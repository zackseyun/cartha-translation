id: 1CH.7.23
reference: 1 Chronicles 7:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֶל אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֤א אֶת שְׁמ/וֹ֙ בְּרִיעָ֔ה כִּ֥י בְ/רָעָ֖ה הָיְתָ֥ה בְּ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: te
  text: తరువాత అతడు తన భార్య దగ్గరకు వెళ్లాడు; ఆమె గర్భం దాల్చి ఒక కుమారుణ్ణి కనింది. అతడు అతనికి బెరీయా[a] అని పేరు పెట్టాడు, ఎందుకంటే అతని ఇంటివారికి విపత్తు సంభవించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బెరీయా’ అనే పేరు ‘విపత్తు’ను సూచించే హీబ్రూ పదంతో ధ్వనిసామ్యం కలిగి ఉంది.
    reason: wordplay
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: అతడు తన భార్యతో కలిశాడు
  rationale: భార్యను సూచిస్తూ వాడిన בוא אל అనే హీబ్రూ మర్యాదోక్తి లైంగిక సంబంధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘భార్యతో కలిశాడు’ అనేది స్పష్టమైన, హుందాతనమున్న సహజ వ్యక్తీకరణ.
- source_word: וַתַּהַר וַתֵּלֶד בֵּן
  choice: ఆమె గర్భం ధరించి ఒక కుమారుణ్ణి కన్నది
  rationale: గర్భధారణ, కుమారుని జననం అనే వరుస చర్యలను హీబ్రూ కథనపు సంక్షిప్తతను కాపాడుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: అతడు అతనికి బెరీయా అని పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; వ్యక్తి పేరును ధ్వన్యంతరీకరించాం.
- source_word: בְרָעָה
  choice: విపత్తు
  rationale: ఈ సందర్భంలో רעה నైతిక చెడును కాక, కుటుంబాన్ని తాకిన ఆపద లేదా దుర్ఘటనను సూచిస్తుంది. ‘విపత్తు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: అతని ఇంటివారికి విపత్తు సంభవించింది
  rationale: בית ఇక్కడ భవనాన్ని మాత్రమే కాక ఇంటివారిని లేదా కుటుంబాన్ని సూచిస్తుంది. ‘సంభవించింది’ విపత్తును తెలుగులో సహజంగా వర్ణిస్తుంది; హీబ్రూలోని స్థితివాచక నిర్మాణాన్ని పదక్షరంగా అనుసరించి అసహజత కలిగించదు.
