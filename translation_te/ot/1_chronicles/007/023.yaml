- from: తరువాత అతడు తన భార్యతో కలిశాడు. ఆమె గర్భం ధరించి ఒక కుమారుణ్ణి కన్నది. అతని ఇంటివారికి విపత్తు సంభవించింది కాబట్టి అతడు అతనికి బెరీయా[a] అని పేరు పెట్టాడు.
  to: తరువాత అతడు తన భార్య దగ్గరకు వెళ్లాడు; ఆమె గర్భం దాల్చి ఒక కుమారుణ్ణి కనింది. అతడు అతనికి బెరీయా[a] అని పేరు పెట్టాడు, ఎందుకంటే అతని ఇంటివారికి విపత్తు సంభవించింది.
