translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలి సరళంగా, హుందాగా ఉంచబడింది. లైంగిక మర్యాదోక్తిని అస్పష్టంగా కాకుండా మర్యాదపూర్వకంగా అనువదించాం. ‘ఇల్లు’ అనే పదాన్ని భవనంగా అపార్థం చేసుకోకుండా సందర్భానుసారం ‘ఇంటివారు’ అని ఇచ్చాం.
