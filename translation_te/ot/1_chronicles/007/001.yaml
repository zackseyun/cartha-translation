id: 1CH.7.1
reference: 1 Chronicles 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י יִשָׂשכָ֗ר תּוֹלָ֧ע וּ/פוּאָ֛ה ישיב וְ/שִׁמְר֖וֹן אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: te
  text: 'ఇశ్శాఖారు కుమారులు: తోలా, పూవా[a], యాషూబు[b], షిమ్రోను—మొత్తం నలుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో పూవా; ఇతర వంశావళి జాబితాల్లోని సమాంతర నామరూపం ఆధారంగా కొన్ని అనువాద సంప్రదాయాల్లో పువ్వా అని ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ హీబ్రూ పాఠంలో యాషూబు; ఆదికాండము 46:13లోని సమాంతర జాబితాలో ఇష్వీ అనే నామరూపం ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: కుమారులు
  rationale: ఉపసర్గలతో కూడిన ఈ పదబంధం ఇశ్శాఖారు వంశావళి జాబితాను పరిచయం చేస్తుంది. తెలుగులో సహజమైన శీర్షిక రూపం కోసం సంధానక అవ్యయాన్ని విడిగా వ్యక్తం చేయలేదు.
- source_word: יִשָׂשכָר
  choice: ఇశ్శాఖారు
  rationale: గోత్రపిత పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: תּוֹלָע
  choice: తోలా
  rationale: వంశావళిలోని వ్యక్తినామం; అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: וּ/פוּאָה
  choice: పూవా
  rationale: WLCలోని మసొరా స్వరాంకిత రూపం Pūʾāh‌ను అనుసరించి లిప్యంతరీకరించాం; ఇతర వంశావళుల్లో కనిపించే సంబంధిత రూపాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాలేదు.
- source_word: ישיב
  choice: యాషూబు
  rationale: ఈ వచనంలోని హీబ్రూ వ్యంజన రూపానికి సాధారణంగా గుర్తించబడే యాషూబు అనే నామరూపాన్ని వాడాం; ఆదికాండము 46:13లోని సమాంతర రూపం భిన్నంగా ఉంది.
- source_word: וְ/שִׁמְרוֹן
  choice: షిమ్రోను
  rationale: జాబితాలో చివరి వ్యక్తినామాన్ని సంధాన భావంతో సహజ తెలుగు జాబితా క్రమంలో ఉంచి లిప్యంతరీకరించాం.
- source_word: אַרְבָּעָה
  choice: మొత్తం నలుగురు
  rationale: జాబితాలో పేర్కొన్న కుమారుల సంఖ్యను సంగ్రహించే పదం. వ్యక్తులను సూచిస్తున్నందున తెలుగు సహజ ప్రయోగంగా ‘నలుగురు’ అని, సంగ్రహ భావం స్పష్టపడేందుకు ‘మొత్తం’ అని ఇచ్చాం.
