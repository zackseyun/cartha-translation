translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. వ్యక్తినామాలను మూల హీబ్రూ రూపాలకు దగ్గరగా, తెలుగులో పలకడానికి సహజంగా లిప్యంతరీకరించాం. దీర్ఘ డాష్ ద్వారా చివరి సంఖ్యను సంగ్రహ వాక్యాంశంగా చూపించాం.
