  terminology: ఇశ్శాఖారు, తోలా, పూవా, యాషూబు, షిమ్రోను అనే లిప్యంతరీకరణలు స్థిరంగా ఉన్నాయి మరియు హీబ్రూ పేర్లకు తగినవే. పాదటిప్పణులు పూవా/పువ్వా ప్రత్యామ్నాయ రూపాన్నీ, ఆదికాండము 46:13లోని ఇష్వీ సమాంతర రూపాన్నీ ప్రధాన పాఠ్యార్థాన్ని మార్చకుండా సరిగా వివరిస్తున్నాయి.
