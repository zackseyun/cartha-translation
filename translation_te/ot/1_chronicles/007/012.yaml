source:
  edition: WLC
  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: te
  text: 'షుప్పీము[b], హుప్పీము ఈరు కుమారులు; హుషీము అహేరు కుమారులు.[a]


    [a] హెబ్రీ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. అక్షరార్థంగా, “హుషీము అహేరు కుమారులు.” “హుషీము” అనే ఏకవచన పేరుతో “కుమారులు” అనే బహువచన రూపం ఉంది. “అహేరు”ను వ్యక్తి పేరుగా తీసుకోవచ్చు; లేదా “మరొకరి” అని అర్థం చేసుకోవచ్చు.


    [b] సంబంధిత వంశావళి పాఠాల ఆధారంగా ఈ పేర్లను కొందరు “షెఫూపాము,” “హూపాము” అని రూపాంతరీకరిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. అక్షరార్థంగా, “హుషీము అహేరు కుమారులు.” “హుషీము” అనే ఏకవచన పేరుతో “కుమారులు” అనే బహువచన రూపం ఉంది. “అహేరు”ను వ్యక్తి పేరుగా తీసుకోవచ్చు; లేదా “మరొకరి” అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: సంబంధిత వంశావళి పాఠాల ఆధారంగా ఈ పేర్లను కొందరు “షెఫూపాము,” “హూపాము” అని రూపాంతరీకరిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּים
  choice: షుప్పీము
  rationale: హెబ్రీ వ్యక్తి పేరును మసొరేటిక్ స్వరచిహ్నాల ప్రకారం లిప్యంతరీకరించాం. సంబంధిత వంశావళుల్లో కనిపించే రూపభేదాన్ని [b]లో ఇచ్చాం.
- source_word: וְ/חֻפִּם
  choice: హుప్పీము
  rationale: హెబ్రీ వ్యక్తి పేరును అనువదించకుండా లిప్యంతరీకరించాం; సంబంధిత పాఠాల్లోని ప్రత్యామ్నాయ రూపాన్ని [b]లో సూచించాం.
- source_word: בְּנֵי עִיר
  choice: ఈరు కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే పదానికి సహజమైన ప్రాథమిక అర్థం “కుమారులు.” עִירను ఇక్కడ ఉన్న మసొరేటిక్ పాఠం ప్రకారం “ఈరు”గా లిప్యంతరీకరించాం.
- source_word: חֻשִׁם
  choice: హుషీము
  rationale: మసొరేటిక్ పాఠంలోని వ్యక్తి పేరును నేరుగా లిప్యంతరీకరించాం.
- source_word: בְּנֵי אַחֵר
  choice: అహేరు కుమారులు
  rationale: బహువచనమైన בְּנֵיను ఏకవచనంగా సవరించకుండా ఉంచి, మూలపాఠంలోని వ్యాకరణ ఉద్రిక్తతను నిలిపాం. אַחֵרను ప్రధాన పాఠంలో వ్యక్తి పేరుగా తీసుకున్నప్పటికీ, “మరొకరి” అనే అర్థసాధ్యతను [a]లో నమోదు చేశాం.
