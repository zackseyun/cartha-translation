translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని పాటించాం. మూలంలోని క్రియారహిత నిర్మాణాన్ని సహజమైన తెలుగు నామవాచక వాక్యంగా ఉంచాం. చివరి భాగంలోని ఏకవచన పేరు–బహువచన “కుమారులు” అసంగతిని సరిచేయకుండా, వివరణాత్మక పాదసూచికతో నిలిపాం.
