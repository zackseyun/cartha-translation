translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వంశావళి శైలిని అనుసరించాం. హీబ్రూ బంధుత్వ నిర్మాణాన్ని అతిగా అక్షరానువాదం చేయకుండా ‘పితృకుటుంబాలు’ అని ఇచ్చాం; సైనిక మరియు వంశావళి పదబంధాల్లోని అర్థవిస్తృతిని పాదసూచికల్లో నిలిపాం.
