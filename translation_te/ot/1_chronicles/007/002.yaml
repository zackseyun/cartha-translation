  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י תוֹלָ֗ע עֻזִּ֡י וּ/רְפָיָ֡ה וִֽ֠/ירִיאֵל וְ/יַחְמַ֨י וְ/יִבְשָׂ֜ם וּ/שְׁמוּאֵ֗ל רָאשִׁ֤ים לְ/בֵית אֲבוֹתָ/ם֙ לְ/תוֹלָ֔ע גִּבּ֥וֹרֵי חַ֖יִל לְ/תֹלְדוֹתָ֑/ם מִסְפָּרָ/ם֙ בִּ/ימֵ֣י דָוִ֔יד עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: te
  text: 'తోలా కుమారులు: ఉజ్జీ, రెఫాయా, యెరీయేలు, యహ్మయి, ఇబ్శాము, షెమూయేలు. వీరు తోలా వంశానికి చెందిన తమ పితృకుటుంబాల పెద్దలు[a], తమ తరాల ప్రకారం పరాక్రమవంతులైన యోధులు[b][c]. దావీదు కాలంలో వారి సంఖ్య ఇరవై రెండు వేల ఆరు వందలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పెద్దలు’ అనే పదాన్ని ‘అధిపతులు’ లేదా ‘నాయకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పరాక్రమవంతులైన యోధులు’ అనే పదబంధాన్ని ‘శౌర్యవంతులు’ లేదా ‘బలవంతులైన వీరులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘తమ తరాల ప్రకారం’ అనే మాటకు ‘తమ వంశశాఖల ప్రకారం’ లేదా ‘తమ వంశపట్టికల ప్రకారం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: తోలా కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే పదానికి ప్రత్యక్షమైన ‘కుమారులు’ అనే అర్థమే సహజం. ఆరంభంలోని וְ సంధిని తెలుగులో విడిగా చూపకపోవడం వాక్యప్రవాహానికి అనుకూలం.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: ఉజ్జీ, రెఫాయా, యెరీయేలు, యహ్మయి, ఇబ్శాము, షెమూయేలు
  rationale: హీబ్రూ వ్యక్తినామాల ఉచ్చారణను ఆధారంగా చేసుకొని ఆధునిక తెలుగు లిపిలో సహజంగా లిప్యంతరీకరించాం.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: తమ పితృకుటుంబాలకు అధిపతులు
  rationale: רָאשִׁים అక్షరార్థంగా ‘తలలు’; ఇక్కడ కుటుంబ లేదా వంశ విభాగాల నాయకులను సూచిస్తుంది. בֵּית אָבוֹת అనే వంశ-సామాజిక విభాగాన్ని ‘పితృకుటుంబాలు’ అని సంక్షిప్తంగా, స్పష్టంగా తెలిపాం.
- source_word: לְתוֹלָע
  choice: తోలా వంశంలోని
  rationale: ఈ సంబంధ సూచక పదబంధం ఆ కుటుంబాధిపతులు తోలా వంశానికి చెందినవారని తెలియజేస్తుంది. తెలుగులో సహజమైన అనుబంధార్థాన్ని ఇచ్చాం.
- source_word: גִּבּוֹרֵי חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ స్థిర పదబంధంలో బలం, సామర్థ్యం, సైనిక శౌర్యం అనే భావాలు ఉన్నాయి. ఈ జనగణనాత్మక సందర్భంలో యుద్ధసంబంధ ఛాయను స్పష్టంగా ఉంచాం.
- source_word: לְתֹלְדוֹתָם
  choice: తమ వంశావళుల ప్రకారం
  rationale: תּוֹלְדוֹת ఇక్కడ తరాలు, వంశశాఖలు లేదా వంశావళి నమోదులను సూచించవచ్చు. ప్రధాన పాఠంలో వంశావళి భావాన్ని ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: దావీదు కాలంలో వారి సంఖ్య ఇరవై రెండు వేల ఆరు వందలు
  rationale: హీబ్రూ సంఖ్యను, కాలసూచనను నేరుగా మరియు సహజమైన తెలుగు పదక్రమంలో అందించాం.
