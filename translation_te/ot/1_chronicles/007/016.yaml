translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి ఉపయోగించబడింది. హీబ్రూ నుడికారాన్ని పదశః అనుసరించకుండా సహజంగా ‘పేరు పెట్టింది’ అని అనువదించబడింది. చివరి సర్వనామానికి సమీప పూర్వపదమైన షెరెషును స్పష్టంగా పేర్కొనడం తెలుగు పఠనంలో అయోమయాన్ని నివారిస్తుంది.
