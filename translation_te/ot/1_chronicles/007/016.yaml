id: 1CH.7.16
reference: 1 Chronicles 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: te
  text: మాకీరు భార్య మాకా ఒక కుమారుణ్ణి కని, అతనికి పెరెషు అని పేరు పెట్టింది. అతని సోదరుని పేరు షెరెషు. షెరెషు కుమారులు ఊలాము, రాకెము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కని
  rationale: వంశావళి సందర్భంలో ילד క్రియకు సహజమైన, సంక్షిప్తమైన తెలుగు రూపం; కుమారుని ప్రసవించిందనే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵשֶׁת מָכִיר
  choice: మాకీరు భార్య
  rationale: హీబ్రూ సంబంధబోధక నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన స్వామ్య క్రమంలో అందిస్తుంది.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: పేరు చెప్పడానికి ముందు పుట్టిన మగబిడ్డను పరిచయం చేసే హీబ్రూ ఏకవచన నామవాచక భావాన్ని నిలుపుతుంది.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: అతనికి … అని పేరు పెట్టింది
  rationale: అక్షరార్థంగా ‘అతని పేరును పిలిచింది’ అయిన హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֶּרֶשׁ
  choice: పెరెషు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: וְשֵׁם אָחִיו
  choice: అతని సోదరుని పేరు
  rationale: మూలంలోని సంబంధాన్ని, వంశావళి శైలిని స్పష్టంగా నిలుపుతుంది.
- source_word: שָׁרֶשׁ
  choice: షెరెషు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: וּבָנָיו
  choice: షెరెషు కుమారులు
  rationale: בָּנִים అనే పదం ఇక్కడ వంశావళిలో మగ సంతానాన్ని సూచిస్తుంది. సమీప పూర్వపదమైన షెరెషును తెలుగులో మళ్లీ పేర్కొనడం ద్వారా సర్వనామ సూచన స్పష్టమవుతుంది.
- source_word: אוּלָם וָרָקֶם
  choice: ఊలాము, రాకెము
  rationale: రెండు వ్యక్తి పేర్లను హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిపిలో అందించింది; జాబితాలో తెలుగు విరామచిహ్నం సహజంగా ఉంటుంది.
