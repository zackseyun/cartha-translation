  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: te
  text: 'అతని సహోదరుడైన హేలెము కుమారుడు: జోఫహు[a], ఇమ్నా, షెలెషు, అమాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును చివరి హీబ్రూ అక్షరం ח లిప్యంతరీకరణను బట్టి ‘జోఫఖు’ అని కూడా రాయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: కుమారులు
  rationale: హీబ్రూలో ‘కుమారుడు’ ఏకవచనంగా ఉన్నప్పటికీ, వెంటనే నలుగురు పేర్లు రావడం వల్ల వంశావళి సందర్భంలో సహజమైన తెలుగులో బహువచనం వాడబడింది; జాబితాలోని వారందరినీ హేలెము కుమారులుగా సూచిస్తుంది.
- source_word: הֵלֶם
  choice: హేలెము
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు లిపిలో హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: אָחִיו
  choice: అతని సహోదరుడైన
  rationale: మూడవ పురుష ఏకవచన సంబంధప్రత్యయాన్ని ‘అతని’గా ఉంచి, ఎవరిని సూచిస్తుందో మూలంలో ఉన్న అనిశ్చితిని వివరణతో తొలగించలేదు.
- source_word: צוֹפַח
  choice: జోఫహు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించాం; చివరి ח ధ్వనికి ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో తెలిపాం.
- source_word: וְיִמְנָע
  choice: ఇమ్నా
  rationale: జాబితాలోని వ్యక్తి పేరును లిప్యంతరీకరించాం; సంధికారకమైన וְ భావం తెలుగు జాబితా విరామచిహ్నాల్లో వ్యక్తమవుతుంది.
- source_word: וְשֵׁלֶשׁ
  choice: షెలెషు
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనులకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וְעָמָל
  choice: అమాలు
  rationale: చివరి వ్యక్తి పేరును లిప్యంతరీకరించాం; జాబితా సమన్వయం విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: హీబ్రూ ఏకవచనమైన ‘కుమారుడు’ తరువాత నలుగురు పేర్లు రావడం
  choice: సహజ తెలుగు కోసం ‘కుమారులు’ అని బహువచనంగా అనువదించడం
  alternative: '‘కుమారుడు: జోఫహు, ఇమ్నా, షెలెషు, అమాలు’ అని మూలంలోని వ్యాకరణ ఏకవచనాన్ని యథాతథంగా ఉంచడం'
  rationale: మూలపాఠంలోని రూపం అసమతుల్యంగా ఉన్నప్పటికీ, సందర్భం నలుగురు సంతానాన్ని జాబితా చేస్తున్నట్లు సూచిస్తుంది. ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; వంశావళిని తెలుగులో అర్థవంతంగా అందించే వ్యాకరణ సర్దుబాటు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. ‘అతని’ అనే సర్వనామం యొక్క పూర్వపదాన్ని స్పష్టీకరించకుండా మూలంలోని సూచనాత్మక అనిశ్చితిని నిలిపాం.
