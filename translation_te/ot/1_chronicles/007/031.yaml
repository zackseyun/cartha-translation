id: 1CH.7.31
reference: 1 Chronicles 7:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: te
  text: 'బెరీయా కుమారులు: హెబెరు, మల్కీయేలు; ఇతడు బిర్జాయితు[b]కు తండ్రి[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బిర్జాయితుకు పూర్వికుడు” లేదా “బిర్జాయితు స్థాపకుడు.” వంశావళి సందర్భాల్లో “తండ్రి” అనేది తక్షణ జనకుడిని మాత్రమే కాక, ఒక వంశానికి లేదా నివాసస్థలానికి పూర్వికుడిని లేదా స్థాపకుడిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “బిర్జాయితు” అనే పేరును “బిర్జోతు” లేదా “బెరాజోతు” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: బెరీయా కుమారులు
  rationale: వంశావళిలోని ఉపజాబితాను సహజమైన తెలుగు శైలిలో పరిచయం చేస్తుంది; ఆరంభంలోని וּ సంధిని ప్రత్యేకంగా అనువదించకపోయినా సంబంధం స్పష్టంగానే ఉంటుంది.
- source_word: חֶבֶר
  choice: హెబెరు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּמַלְכִּיאֵל
  choice: మల్కీయేలు
  rationale: సంధితో కూడిన వ్యక్తి పేరును జాబితాలో సహజంగా విరామచిహ్నంతో కలిపి చూపించాం.
- source_word: הוּא
  choice: ఇతడు
  rationale: వెంటనే ముందు ఉన్న ఏకవచన పురుష నామమైన మల్కీయేలును తిరిగి సూచించే హీబ్రూ సర్వనామ బలాన్ని నిలుపుతుంది.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: మూలంలోని ప్రాథమిక వంశావళి పదాన్ని యథాతథంగా ఉంచాం; ఇది తక్షణ జనకుడిని మాత్రమే కాక పూర్వికుడిని లేదా వంశం/స్థల స్థాపకుడిని కూడా సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: ברזות
  choice: బెర్జాయితు
  rationale: అచ్చులు నిర్దిష్టంగా సూచించని అరుదైన పేరును సంప్రదాయ పఠనానికి దగ్గరగా, అర్థాన్ని ఊహించి చేర్చకుండా లిప్యంతరీకరించాం.
