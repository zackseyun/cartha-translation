translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లకు తెలుగు బైబిలు పఠనానికి అనుకూలమైన రూపాలు వాడబడ్డాయి. మూలంలోని הוּא ఏ వ్యక్తిని సూచిస్తుందో అతిగా వ్యాఖ్యానించకుండా, సహజంగా మల్కీయేలును సూచించే “ఇతడు” ఉపయోగించబడింది.
