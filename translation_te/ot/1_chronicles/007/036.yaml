translation_notes:
  register: సంక్షిప్త వంశావళి శైలిని నిలుపుకుంటూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదివే గౌరవప్రదమైన రూపం వాడబడింది. పేర్లు మూల హీబ్రూ పాఠం ఆధారంగా లిప్యంతరీకరించబడ్డాయి; వంశసంబంధంలోని సాధ్యమైన విస్తృతార్థం పాదసూచికలో భద్రపరచబడింది.
