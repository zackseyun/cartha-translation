  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: te
  text: 'సోఫహు కుమారులు[a]: సూహ, హర్నెఫెరు, షూయాల్, బేరి, ఇమ్రా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సోఫహు సంతానం.” వంశావళుల్లో హీబ్రూ בְּנֵי అనే పదం కొన్నిసార్లు విస్తృత వంశాన్ని సూచించవచ్చు; అయితే “కుమారులు” అనేది మరింత ప్రత్యక్షమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే పదానికి నిర్మాణ బహువచన రూపం. వంశావళుల్లో ఇది విస్తృత సంతానాన్ని కూడా సూచించవచ్చు; అయితే ఇక్కడ ప్రత్యక్షమైన, సహజమైన అనువాదం ‘కుమారులు’.
- source_word: צוֹפָח
  choice: సోఫహు
  rationale: మసొరెటిక్ పాఠంలోని హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: סוּחַ
  choice: సూహ
  rationale: దీర్ఘ ū స్వరాన్నీ, చివరి గొంతు ధ్వనినీ సాధ్యమైనంత సహజంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: חַרְנֶפֶר
  choice: హర్నెఫెరు
  rationale: వంశావళిలోని వ్యక్తినామాన్ని అనువదించకుండా హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: שׁוּעָל
  choice: షూవాలు
  rationale: ఇతర సందర్భాల్లో ఈ రూపానికి సామాన్య నామార్థం ఉండగలిగినా, ఇక్కడ ఇది వ్యక్తినామం; అందువల్ల దాన్ని పేరుగా లిప్యంతరీకరించాం.
- source_word: בֵרִי
  choice: బేరి
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న వ్యక్తినామ రూపాన్ని నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: יִמְרָה
  choice: ఇమ్రా
  rationale: ఆదిలోని హీబ్రూ యోడ్‌ను ఈ పేరులో సహజమైన తెలుగు ‘ఇ’ ధ్వనితో ప్రతిబింబించాం.
