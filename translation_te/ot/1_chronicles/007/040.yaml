translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వంశావళి మరియు సైనిక పరిపాలన రెండింటి భావాలను నిలిపి, అసాధారణమైన హీబ్రూ నాయకత్వ పదబంధాన్ని అతిగా నిర్దిష్టీకరించలేదు.
