source:
  edition: WLC
  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: te
  text: వీరందరూ ఆశేరు వంశస్థులు—పితృకుటుంబాల పెద్దలు, ఎంపికైనవారు, పరాక్రమశాలి యోధులు, నాయకులలో ప్రధానులు. యుద్ధం కోసం సైనిక సేవకు వంశావళి ప్రకారం నమోదైన వారి సంఖ్య[a] ఇరవై ఆరు వేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం కోసం సైనిక సేవకు నమోదైన వారి సంఖ్య.” దినవృత్తాంతాలలో ఇక్కడి హీబ్రూ క్రియ తరచుగా వంశావళి ఆధారంగా నమోదుచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: ఇది వంశపారంపర్య కుటుంబ లేదా గృహ సమూహాల నాయకులను సూచించే దినవృత్తాంతాల స్థిరమైన సామాజిక-వంశావళి పదబంధం. తెలుగు పాఠకులకు అర్థమయ్యేలా ఉండి, హీబ్రూ భావాన్ని నిలుపుతుంది.
- source_word: בְּרוּרִים
  choice: ఎంపికైనవారు
  rationale: ఈ కర్మణి కృదంతం ఎంపిక చేయబడిన లేదా శ్రేష్ఠులుగా ఎంచబడిన వారిని సూచిస్తుంది; సందర్భంలో ఇది సైనిక అర్హతను కూడా సూచించగలదు.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: పరాక్రమశాలి యోధులు
  rationale: బలం, సామర్థ్యం, యుద్ధవీరత్వం అనే భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: ప్రధాన నాయకులు
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత అసాధారణంగా ఉంది. రాజవంశ సంబంధమైన భావాన్ని అనవసరంగా చేర్చకుండా నాయకులలో ప్రముఖులనే భావాన్ని తెలియజేస్తుంది.
- source_word: וְהִתְיַחְשָׂם
  choice: వారి వంశావళి ప్రకారం వారు నమోదయ్యారు
  rationale: దినవృత్తాంతాలలో יחס అనే క్రియ సాధారణంగా వంశావళి ఆధారిత నమోదును సూచిస్తుంది. సైనిక సందర్భంలోని పరిపాలనా నమోదును కూడా ఈ అనువాదం స్పష్టపరుస్తుంది.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: యుద్ధం చేయడానికి సైన్యంలో సేవచేసేలా
  rationale: సైనిక దళంలో యుద్ధసేవకోసం నమోదు చేయబడిన ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: వారి పురుషుల సంఖ్య
  rationale: లెక్కించబడినవారు పురుషులని హీబ్రూ వాక్యం స్పష్టంగా పేర్కొంటుంది; తెలుగు రూపం ఆ వివరాన్ని నిలుపుతుంది.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: ఇరవై ఆరు వేలు
  rationale: హీబ్రూ సంఖ్యకు ప్రామాణికమైన ఆధునిక తెలుగు రూపం.
