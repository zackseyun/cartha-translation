id: 1CH.7.39
reference: 1 Chronicles 7:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י עֻלָּ֑א אָרַ֥ח וְ/חַנִּיאֵ֖ל וְ/רִצְיָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/039.yaml
  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: te
  text: 'ఉల్లా కుమారులు: ఆరహ్, హన్నీయేల్, రిత్స్యా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే పదానికి construct plural రూపం. వంశావళి జాబితాలో ఇది సహజమైన, మూలానికి సమీపమైన అనువాదం. ఆరంభంలోని וּ (‘మరియు’) తెలుగులో ఈ స్వతంత్ర వంశావళి వాక్యానికి అవసరం లేకపోవడంతో వ్యక్తంగా అనువదించలేదు.
- source_word: עֻלָּא
  choice: ఉల్లా
  rationale: వ్యక్తి పేరు; హెబ్రీ రూపంలోని ద్విత్వ లామెద్‌ను ప్రతిబింబించేలా లిప్యంతరీకరించబడింది.
- source_word: אָרַח
  choice: ఆరహు
  rationale: వ్యక్తి పేరు; చివరి ח ధ్వనిని తెలుగులో సహజంగా సూచించేందుకు ‘హు’తో లిప్యంతరీకరించబడింది.
- source_word: חַנִּיאֵל
  choice: హన్నీయేలు
  rationale: వ్యక్తి పేరు; హెబ్రీలోని ద్విత్వ నూన్‌ను ‘న్నీ’తో, אֵל భాగాన్ని తెలుగులో స్థిరంగా వినిపించే ‘యేలు’తో ప్రతిబింబించింది.
- source_word: רִצְיָא
  choice: రిజ్యా
  rationale: వ్యక్తి పేరు; మసొరేటిక్ స్వరాలతో కూడిన హెబ్రీ రూపాన్ని సంక్షిప్తంగా ప్రతిబింబించే లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలి పాటించబడింది. వ్యక్తి పేర్లు అనువదించకుండా హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; అనవసరమైన ఆంగ్ల లిప్యంతరీకరణ ప్రత్యామ్నాయాలు తెలుగు పాఠకునికి ఉపయోగకరంగా లేకపోవడంతో పాదటిప్పణులు ఇవ్వలేదు.
