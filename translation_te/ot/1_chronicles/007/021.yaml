id: 1CH.7.21
reference: 1 Chronicles 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד וַ/הֲרָג֗וּ/ם אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ כִּ֣י יָרְד֔וּ לָ/קַ֖חַת אֶת מִקְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: te
  text: అతని కుమారుడు జాబాదు, అతని కుమారుడు షూతెలహు, ఏజెరు, ఎల్యాదు; ఆ దేశంలో పుట్టిన గాతు పురుషులు[a] వారిని చంపారు, ఎందుకంటే వారు[b] వారి పశుసంపదను తీసుకోవడానికి దిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశపు స్థానికులైన గాతు పురుషులు.” హీబ్రూలో అక్షరార్థంగా, “దేశంలో పుట్టిన గాతు పురుషులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “దిగివెళ్లారు” అనే క్రియకు సందర్భపరంగా సమీపంలోని బహువచన పూర్వపదాలైన ఏజెరు, ఎల్యాదు కర్తలు.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న ‘కుమారుడు’ అనే వంశావళి సంబంధాన్ని సహజమైన తెలుగులో తెలిపి, మూలంలోని రెండుసార్ల పునరుక్తిని నిలిపింది.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: ఏజెరు, ఎల్యాదు
  rationale: వ్యక్తి పేర్లను ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది; జాబితా నిర్మాణాన్ని సహజమైన తెలుగు విరామచిహ్నాలతో తెలిపింది.
- source_word: וַהֲרָגוּם
  choice: వారిని చంపారు
  rationale: הרג క్రియకు జతైన మూడవ పురుష బహువచన కర్మప్రత్యయాన్ని సూటిగా, స్పష్టంగా అనువదించింది.
- source_word: אַנְשֵׁי גַת
  choice: గాతు మనుషులు
  rationale: ‘గాతు పురుషులు/నివాసులు’ అనే భావాన్ని మూలానికి దగ్గరగా ఉంచుతుంది; మొత్తం జనాభా అని విస్తరించదు.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: ఆ దేశంలో పుట్టిన
  rationale: ‘దేశంలో పుట్టినవారు’ అనే హీబ్రూ అభివ్యక్తిని ప్రత్యక్షంగా నిలిపి, ‘స్థానికులు’ అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా ప్రవేశపెట్టలేదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: హత్యకు కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: יָרְדוּ
  choice: దిగివెళ్లారు
  rationale: ‘దిగు’ అనే దిశార్థాన్ని నిలిపింది; తెలుగులో కారణ వాక్యం తరువాత రావడం వల్ల ముందుగా జరిగిన చర్య సహజంగా అర్థమవుతుంది.
- source_word: לָקַחַת
  choice: తీసుకోవడానికి
  rationale: לקח యొక్క విస్తృతమైన ప్రాథమిక అర్థాన్ని ఉంచింది; దాడి చేసి ‘దోచుకోవడం’ అని అవసరానికి మించి వ్యాఖ్యానించలేదు.
- source_word: מִקְנֵיהֶם
  choice: వారి పశుసంపదను
  rationale: מִקְנֶהను పశువుల సమూహం/ఆస్తిగా సహజంగా తెలిపింది; ‘వారి’ అనే సర్వనామాన్ని నిలిపి మూలంలోని సూచనను అనవసరంగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: יָרְדוּ (‘దిగివెళ్లారు’) అనే బహువచన క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘వారు’ అని ఉంచి, సమీప బహువచన పూర్వపదాలైన ఏజెరు, ఎల్యాదును పాదసూచికలో సూచించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఏజెరు, ఎల్యాదు’ అని పునరుక్తి చేయడం
  rationale: సందర్భంలో ఏజెరు, ఎల్యాదే అత్యంత సహజమైన కర్తలు; అయినా హీబ్రూ క్రియలో పేర్లు మళ్లీ స్పష్టంగా లేవు. కాబట్టి మూలంలోని వ్యాకరణ రూపాన్ని నిలిపి, సందర్భపరమైన గుర్తింపును పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వంశావళి శైలి వాడబడింది. పేర్ల జాబితా నుంచి కథన భాగానికి మార్పును అర్థవిరామంతో చూపించి, మూలంలోని నిర్మాణాన్ని నిలిపింది. ప్రధాన పాఠ్యంలో అక్షరార్థానికి దగ్గరగా ఉండి, సందర్భార్థాలు మరియు సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలకు పరిమితం చేసింది.
