  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, జాబితా-జనగణన భావాన్ని స్పష్టంగా ఉంచేలా వాక్య నిర్మాణం చేయబడింది. ‘కుమారులు/వంశస్థులు’ మరియు సైన్యంలో ‘బయలుదేరేవారు/సేవకు అర్హులు’ అనే భావవ్యాప్తులను పాదటిప్పణుల్లో సంరక్షించాం.
