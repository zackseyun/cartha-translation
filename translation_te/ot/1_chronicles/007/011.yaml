source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: te
  text: 'వీరందరూ యెదీయాయేలు కుమారులు[a]. పితృవంశాల అధిపతుల లెక్క ప్రకారం, వీరు పరాక్రమవంతులైన యోధులు[c], పదిహేడు వేల రెండువందల మంది—యుద్ధం కోసం సైనిక సేవకు బయలుదేరేవారు[d].


    [a] “యెదీయాయేలు వంశస్థులు” అని కూడా అనువదించవచ్చు. వంశావళుల్లో “కుమారులు” అనే హీబ్రూ పదం విస్తృతంగా వారసులను కూడా సూచించగలదు.


    [b] హీబ్రూ ప్రయోగం అక్షరార్థంగా “తండ్రుల అధిపతులు”; ఇది పితృవంశాల లేదా కుటుంబాల అధిపతులను సూచిస్తుంది.


    [c] హీబ్రూలో అక్షరార్థంగా “పరాక్రమం గల పురుషులు” లేదా “బలశాలులు.” ఈ సందర్భంలో ఇది యుద్ధసామర్థ్యమున్న శూరులను సూచిస్తుంది.


    [d] అక్షరార్థంగా “యుద్ధం కోసం సైన్యానికి బయలుదేరేవారు”; అంటే సైనిక సేవకు అందుబాటులో ఉన్న లేదా అర్హులైన పురుషులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యెదీయాయేలు వంశస్థులు” అని కూడా అనువదించవచ్చు. వంశావళుల్లో “కుమారులు” అనే హీబ్రూ పదం విస్తృతంగా వారసులను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ ప్రయోగం అక్షరార్థంగా “తండ్రుల అధిపతులు”; ఇది పితృవంశాల లేదా కుటుంబాల అధిపతులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “పరాక్రమం గల పురుషులు” లేదా “బలశాలులు.” ఈ సందర్భంలో ఇది యుద్ధసామర్థ్యమున్న శూరులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా “యుద్ధం కోసం సైన్యానికి బయలుదేరేవారు”; అంటే సైనిక సేవకు అందుబాటులో ఉన్న లేదా అర్హులైన పురుషులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: హీబ్రూ సమాపక పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, సందర్భంలోని వ్యక్తులను స్పష్టంగా సూచిస్తుంది.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: యెదీయాయేలు కుమారులు
  rationale: בְּנֵי అనే పదానికి ప్రాథమికమైన ‘కుమారులు’ అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, వంశావళి సందర్భంలో ఉండగల విస్తృతమైన ‘వంశస్థులు’ అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల అధిపతుల లెక్క ప్రకారం
  rationale: లְ ఉపసర్గలోని ‘ప్రకారం’ భావాన్ని, אָבוֹת సూచించే పితృవంశ కుటుంబ నిర్మాణాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తపరుస్తుంది; ‘లెక్క’ జనగణన సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: పరాక్రమవంతులైన యోధులు
  rationale: బలం, శౌర్యం, యుద్ధసామర్థ్యం అనే సంయుక్త భావాన్ని ఆధునికమైనా గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: పదిహేడు వేల రెండువందల మంది
  rationale: హీబ్రూ పాఠ్యంలోని ఖచ్చితమైన జనసంఖ్యను పదరూపంలో నిలుపుతుంది; ‘మంది’ వ్యక్తుల సంఖ్యను సహజంగా సూచిస్తుంది.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: యుద్ధం కోసం సైన్యంలో బయలుదేరగలవారు
  rationale: అక్షరార్థంలోని ‘బయలుదేరడం’ రూపకాన్ని నిలుపుతూ, ఇది సైనిక సేవకు సిద్ధత లేదా సామర్థ్యాన్ని సూచిస్తుందని ‘గలవారు’ ద్వారా సహజంగా తెలియజేస్తుంది.
