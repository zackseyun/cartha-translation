source:
  edition: WLC
  text: וּ/בְנֵ֥י יְדִיעֲאֵ֖ל בִּלְהָ֑ן וּ/בְנֵ֣י בִלְהָ֗ן יעיש וּ֠/בִנְיָמִן וְ/אֵה֤וּד וּֽ/כְנַעֲנָה֙ וְ/זֵיתָ֔ן וְ/תַרְשִׁ֖ישׁ וַ/אֲחִישָֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: te
  text: 'యెదీయేలు కుమారులు: బిల్హాను. బిల్హాను కుమారులు: యయీషు[a], బెన్యామీను, ఏహూదు, కెనానా, జేతాను, తర్షీషు, అహీషహరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ నామరూపం (יעיש) అసాధారణంగా ఉంది. ఈ వంశావళిలో ఉద్దేశించిన పేరు బహుశా ‘యెయూషు’; ‘యాయీషు’ లేదా ‘యాయిషు’ అనే లిప్యంతరీకరణలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְדִיעֲאֵל בִּלְהָן
  choice: యెదీయేలు కుమారుడు బిల్హాను
  rationale: హీబ్రూలో ‘కుమారులు’ అనే బహువచన వంశావళి సూత్రం ఉన్నప్పటికీ, ఇక్కడ ఒక్క బిల్హాను మాత్రమే పేర్కొనబడినందున సహజమైన తెలుగులో ఏకవచనంగా వ్యక్తం చేశాం; సంబంధాన్ని నేరుగా నిలుపుకున్నాం.
- source_word: וּבְנֵי בִלְהָן
  choice: 'బిల్హాను కుమారులు:'
  rationale: వంశావళిలోని ప్రత్యక్ష జాబితా నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: יעיש
  choice: యెయీషు
  rationale: మసొరెటిక్ పాఠంలోని అసాధారణ నామరూపాన్ని వీలైనంత దగ్గరగా లిప్యంతరీకరించాం; ఇది సాధారణంగా ‘యెయూషు’గా గుర్తించబడే పేరు కావచ్చనే విషయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּבִנְיָמִן
  choice: బెన్యామీను
  rationale: తెలుగు బైబిలు నామరూపాలకు సులభంగా గుర్తుపట్టే, హీబ్రూ ఉచ్చారణకు సమీపమైన రూపం.
- source_word: וְאֵהוּד
  choice: ఏహూదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וּכְנַעֲנָה
  choice: కనయనా
  rationale: ఇది ప్రదేశనామం ‘కనాను’ కాదు, వ్యక్తినామం; హీబ్రూ వ్యంజన-స్వర క్రమాన్ని తెలుగులో ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: וְזֵיתָן
  choice: జేతాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనువుగా లిప్యంతరీకరించాం.
- source_word: וְתַרְשִׁישׁ
  choice: తర్షీషు
  rationale: ఇతర సందర్భాల్లో ఇది ప్రదేశనామం కావచ్చినా, ఇక్కడ వంశావళిలో వ్యక్తినామంగా స్పష్టంగా ఉంది.
- source_word: וַאֲחִישָׁחַר
  choice: అహీషహరు
  rationale: హీబ్రూ నామంలోని అహీ-షహర్ ధ్వని నిర్మాణాన్ని సరళమైన తెలుగు లిప్యంతరీకరణలో నిలిపాం.
