revisions:
- from: 'యెదీయేలు కుమారుడు బిల్హాను. బిల్హాను కుమారులు: యెయీషు[a], బెన్యామీను, ఏహూదు, కనయనా, జేతాను, తర్షీషు, అహీషహరు.'
  to: 'యెదీయేలు కుమారులు: బిల్హాను. బిల్హాను కుమారులు: యయీషు[a], బెన్యామీను, ఏహూదు, కెనానా, జేతాను, తర్షీషు, అహీషహరు.'
  rationale: The revision restores the plural genealogical formula required by the Hebrew, represents the disputed name without treating a probable emendation as certain, and refines the transliteration of Chenaanah. No theological interpretation is involved.
  reviewer_model: gpt-5.6-terra
