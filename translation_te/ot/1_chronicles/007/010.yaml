  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. వ్యక్తినామాలను మూల హీబ్రూ ధ్వనులకు సమీపంగా, తెలుగు పాఠకుడు పలకగల రూపాల్లో ఇచ్చాం.
