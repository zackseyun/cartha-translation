base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: te
  text: అతని కుమార్తె షెయెరా[a]; ఆమె దిగువ బేత్‌-హోరోనును, ఎగువ బేత్‌-హోరోనును[b], ఉజ్జేన్‌-షెయెరాను నిర్మించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు అతని కుమార్తె షెయెరా”; హీబ్రూ వాక్యం ‘మరియు అతని కుమార్తె’ అని మొదలవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “మరియు ఎగువది”; ముందు వచ్చిన “బేత్‌-హోరోను” ఇక్కడ అధ్యాహారంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ
  choice: అతని కుమార్తె
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘మరియు అతని కుమార్తె’. తెలుగులో వంశావళి సందర్భానికి సహజంగా ఉండేందుకు ప్రారంభ సంధికార్థాన్ని విడిచిపెట్టి సంబంధాన్ని స్పష్టంగా ఉంచాం.
- source_word: שֶׁאֱרָה
  choice: షెయెరా
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַתִּבֶן
  choice: కట్టించింది
  rationale: בנה యొక్క ప్రాథమిక భావం ‘కట్టు/నిర్మించు’. పట్టణాల నిర్మాణాన్ని ఆదేశించి జరిపించిన నాయకత్వ భావాన్ని సహజ తెలుగులో తెలిపేందుకు ‘కట్టించింది’ ఎంచుకున్నాం; ‘స్థాపించింది’ లేదా ‘పునర్నిర్మించింది’ అనే నిర్ధారణను చేర్చలేదు.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: దిగువ బేత్‌-హోరోను
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, הַתַּחְתּוֹן ను సహజమైన విశేషణ క్రమంలో ‘దిగువ’గా ఇచ్చాం.
- source_word: הָעֶלְיוֹן
  choice: ఎగువ బేత్‌-హోరోను
  rationale: హీబ్రూలో ‘ఎగువది’ మాత్రమే ఉన్నా, సమాంతర నిర్మాణంలో ‘బేత్‌-హోరోను’ అధ్యాహారంగా ఉంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు పేరును పునరుక్తం చేశాం.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: ఉజ్జేన్‌-షెయెరా
  rationale: ఇది ఒక సంయుక్త స్థలనామమని పాఠకుడు గుర్తించేలా రెండు భాగాలను సంధిచిహ్నంతో లిప్యంతరీకరించాం.
