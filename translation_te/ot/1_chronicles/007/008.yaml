  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: te
  text: 'బెకెరు కుమారులు: జెమీరా, యోవాషు, ఎలీయెజెరు, ఎల్యోయేనై, ఒమ్రీ, యెరేమోతు[a], అబీయా, అనాతోతు, ఆలెమెతు. వీరందరూ బెకెరు కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును ‘యెరీమోతు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: బెకెరు కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే పదానికి ‘కుమారులు’ అనేది సహజమైనదీ, నిర్దిష్టమైనదీ. వచనం జాబితాలో కొనసాగుతున్నప్పటికీ, తెలుగులో ప్రారంభ ‘మరియు’ అవసరం లేకుండా సహజంగా వదిలివేయబడింది.
- source_word: זְמִירָה
  choice: జెమీరా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: יוֹעָשׁ
  choice: యోవాషు
  rationale: హీబ్రూ ధ్వనిరూపాన్ని అనుసరించిన తెలుగు బైబిలు నామరూపం.
- source_word: אֱלִיעֶזֶר
  choice: ఎలీయెజెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్పష్టంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: אֶלְיוֹעֵינַי
  choice: ఎల్యోయేనై
  rationale: మూలంలోని హల్లులు, అచ్చుల క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుకున్న తెలుగు రూపం.
- source_word: עָמְרִי
  choice: ఒమ్రీ
  rationale: సాధారణంగా గుర్తించదగిన తెలుగు లిప్యంతరీకరణ.
- source_word: יְרֵמוֹת
  choice: యెరేమోతు
  rationale: మసొరేటిక్ పాఠంలోని స్వరరూపాన్ని ప్రతిబింబించే లిప్యంతరీకరణ; మరో సాధ్యమైన ఉచ్చారణను పాదసూచికలో ఇచ్చాం.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: మూల హీబ్రూ వ్యక్తినామానికి దగ్గరైన తెలుగు రూపం.
- source_word: עֲנָתוֹת
  choice: అనాతోతు
  rationale: ఇతర సందర్భాల్లో స్థలనామంగా కనిపించినా, ఇక్కడ వంశావళిలో వ్యక్తినామంగా ఉన్నందున పేరుగానే లిప్యంతరీకరించబడింది.
- source_word: עָלָמֶת
  choice: ఆలెమెతు
  rationale: మూల వ్యక్తినామ ధ్వనులను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: వీరందరూ బెకెరు కుమారులు
  rationale: హీబ్రూ సమాపక వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో, వంశసంబంధాన్ని స్పష్టంగా ఉంచుతూ అనువదించాం.
