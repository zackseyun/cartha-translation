id: 1CH.7.5
reference: 1 Chronicles 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם לְ/כֹל֙ מִשְׁפְּח֣וֹת יִשָׂשכָ֔ר גִּבּוֹרֵ֖י חֲיָלִ֑ים שְׁמוֹנִ֤ים וְ/שִׁבְעָה֙ אֶ֔לֶף הִתְיַחְשָׂ֖/ם לַ/כֹּֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: te
  text: ఇశ్శాఖారు యొక్క అన్ని వంశాలలోని వారి సహోదరులు[a] పరాక్రమవంతులైన యోధులు; వంశావళిలో నమోదైన వారి మొత్తం సంఖ్య[b] ఎనభై ఏడు వేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి బంధువులు.” హీబ్రూ పదం అక్షరార్థంగా “సహోదరులు”; వంశ లేదా గోత్ర సందర్భాల్లో అది సమీప, విస్తృత బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వంశావళి ప్రకారం నమోదైనవారు.” హీబ్రూ క్రియ వంశావళి రికార్డుల్లో నమోదు చేయబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: אָח అనే పదానికి ప్రాథమిక అర్థం ‘సహోదరుడు’; వంశావళి సందర్భంలో అది విస్తృత బంధువులను కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలభాషా రూపకాన్ని నిలిపి, పాదసూచికలో విస్తృత భావాన్ని తెలిపాం.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: ఇశ్శాఖారు వంశాలన్నిటిలోని
  rationale: לְכֹל ఇక్కడ పరిధి లేదా సంబంధాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఇశ్శాఖారు వంశ విభాగాలన్నిటినీ సహజంగా సూచిస్తుంది.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: పరాక్రమశాలులైన యోధులు
  rationale: ఈ స్థిర పదబంధం బలశౌర్యాలు కలిగిన, యుద్ధసామర్థ్యం గల పురుషులను సూచిస్తుంది. ‘పరాక్రమశాలులైన యోధులు’ ఆధునిక తెలుగులో సహజంగా ఉండి సైనిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: ఎనభై ఏడు వేలమంది
  rationale: మూలంలోని సంఖ్యను నేరుగా, తెలుగు గద్యానికి సహజమైన పదరూపంలో ఇచ్చాం.
- source_word: הִתְיַחְשָׂם
  choice: వంశావళి ప్రకారం నమోదైన
  rationale: יחשׂ హిత్పయేల్ రూపం వంశావళి రికార్డులో నమోదు చేయబడటం లేదా వంశక్రమం ప్రకారం లెక్కించబడటాన్ని సూచిస్తుంది.
- source_word: לַכֹּל
  choice: వారందరూ
  rationale: ఈ పదం మొత్తం సంఖ్యను సమగ్రంగా సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘వారందరూ’ ద్వారా ఆ సమష్టి భావం సహజంగా వ్యక్తమవుతుంది.
