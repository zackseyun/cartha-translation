  rationale: ఈ సందర్భంలో క్రియ స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసించారు’ గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: בְנֵי יוֹסֵף
  choice: యోసేపు వంశస్థులు
