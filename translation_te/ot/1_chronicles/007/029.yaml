base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: te
  text: మనష్షే వంశస్థుల ప్రాంతానికి ఆనుకొని బేత్‌షెయాను, దాని అనుబంధ పట్టణాలు[a], తానాకు, దాని అనుబంధ పట్టణాలు, మెగిద్దో, దాని అనుబంధ పట్టణాలు, దోరు, దాని అనుబంధ పట్టణాలు ఉండేవి[b]. ఈ ప్రాంతాల్లో ఇశ్రాయేలు కుమారుడైన యోసేపు వంశస్థులు నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ఇది ప్రధాన పట్టణంపై ఆధారపడిన చుట్టుపక్కల చిన్న పట్టణాలు లేదా గ్రామాలను సూచించే హీబ్రూ వాడుక.
    reason: lexical_alternative
  - marker: b
    text: ‘మనష్షే వంశస్థుల పక్కన’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ నుడికారం ప్రాంతాలు ఒకదానికొకటి ఆనుకొని ఉండడాన్ని లేదా సరిహద్దు సమీపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: సరిహద్దుల వెంట
  rationale: ప్రాదేశిక జాబితాలో ఈ హీబ్రూ నుడికారం అక్షరార్థమైన ‘చేతుల ద్వారా’ అని కాక, మనష్షే ప్రాంతానికి ఆనుకొని లేదా దాని సరిహద్దుల వెంట ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: בְנֵי מְנַשֶּׁה
