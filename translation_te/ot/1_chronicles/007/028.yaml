translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే భౌగోళిక జాబితా శైలిని అనుసరించాం. మూలంలోని క్రియలేని వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి ‘ఇవి’ చేర్చాం. ‘కుమార్తె పట్టణాలు’ అనే అపరిచిత అక్షరానువాదం బదులు ‘అనుబంధ పట్టణాలు’ వాడి, మూల నుడికారాన్ని పాదసూచికలో భద్రపరిచాం.
