  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: te
  text: 'వారి స్వాధీనాలు, నివాసస్థలాలు ఇవి: బేతేలు, దాని అనుబంధ పట్టణాలు[b]; తూర్పున నయరాను[a]; పడమట గెజెరు, దాని అనుబంధ పట్టణాలు, షెకెము, దాని అనుబంధ పట్టణాలు, అయ్యా, దాని అనుబంధ పట్టణాల వరకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంబంధిత మరో స్థలనామ సంప్రదాయం ఆధారంగా కొందరు దీనిని ‘నయరా’ అని పేర్కొంటారు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘దాని కుమార్తెలు.’ ఇది ఒక ప్రధాన పట్టణానికి చెందిన చిన్న పట్టణాలు లేదా గ్రామాలను సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: వారి స్వాధీన భూములు
  rationale: ఈ పదం ఇక్కడ భూభాగ సంబంధమైన స్వాస్థ్యాన్ని సూచిస్తుంది. తరువాత వచ్చే ప్రాంతాల జాబితాకు అనుగుణంగా ‘స్వాధీన భూములు’ అని అనువదించాం.
- source_word: מֹשְׁבוֹתָם
  choice: నివాస స్థలాలు
  rationale: గోత్ర భూభాగంలోని ప్రజలు నివసించే ప్రాంతాలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנוֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణానికి చెందిన చిన్న పట్టణాలు లేదా గ్రామాలను సూచించే హీబ్రూ నుడికారాన్ని అర్థస్పష్టంగా అందిస్తుంది.
- source_word: לַמִּזְרָח / לַמַּעֲרָב
  choice: తూర్పున / పడమట
  rationale: భూభాగపు దిశలను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: נַעֲרָן
  choice: నయరాను
  rationale: మసొరెటిక్ పాఠంలోని స్థలనామ రూపాన్ని తెలుగు లిపిలో ప్రతిబింబిస్తుంది; సంబంధిత ప్రత్యామ్నాయ నామసంప్రదాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַד
  choice: వరకు
  rationale: జాబితాలో పేర్కొన్న భౌగోళిక విస్తృతి లేదా హద్దును సహజంగా సూచిస్తుంది.
- source_word: עַיָּה
  choice: అయ్యా
  rationale: మసొరెటిక్ పాఠంలోని స్థలనామాన్ని ప్రధాన పాఠంలో నిలిపి, కొన్ని ప్రాచీన సాక్ష్యాల్లో కనిపించే భిన్న నామాన్ని పాదసూచికలో తెలియజేశాం.
