  source_fidelity: 'మూల హీబ్రూ వాక్యం వారి భూస్వాధీనాలు, నివాసస్థలాల జాబితాను ఇస్తుంది: బేతేలు మరియు దాని అనుబంధ పట్టణాలు; తూర్పున నయరాను; పడమట గెజెరు మరియు దాని అనుబంధ పట్టణాలు, షెకెము మరియు దాని అనుబంధ పట్టణాలు, అయ్యా మరియు దాని అనుబంధ పట్టణాల వరకు. ముసాయిదా ఈ అంశాలను ప్రధానంగా భద్రపరుస్తున్నప్పటికీ, చివరి సరిహద్దు-నిర్మాణంలోని డ్యాష్ సహజంగా లేదు మరియు జాబితా సంబంధాన్ని అస్పష్టపరుస్తుంది.'
