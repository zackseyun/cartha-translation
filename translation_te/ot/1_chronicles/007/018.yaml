  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. వ్యక్తిపేర్లు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; హీబ్రూ వాక్యంలోని మాతృసంబంధం స్పష్టంగా నిలుపబడింది.
