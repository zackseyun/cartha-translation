id: 1CH.7.18
reference: 1 Chronicles 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחֹת֖/וֹ הַ/מֹּלֶ֑כֶת יָלְדָה֙ אֶת אִישְׁה֔וֹד וְ/אֶת אֲבִיעֶ֖זֶר וְ/אֶת מַחְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: te
  text: అతని సహోదరి హమ్మోలెకెత్[a] ఇష్హోదును, అబీయెజెరును, మహ్లాను కన్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: హమ్మోలెకెత్; ‘మోలెకెత్’ అని కూడా లిప్యంతరీకరించవచ్చు. ఈ పేరు రూపరీత్యా ‘రాణి’ లేదా ‘పాలించేది’ అనే అర్థంగల పదానికి సంబంధించినది; అయితే ఇక్కడ దీన్ని వ్యక్తిపేరుగా గ్రహించడం సముచితం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: అతని సహోదరి
  rationale: וְ అనేది ముందున్న వంశావళి వివరంతో ఈ వాక్యాన్ని కలుపుతుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండానే ఆ అనుసంధానం సహజంగా అర్థమవుతుంది. אֲחֹתוֹ అంటే ‘అతని సహోదరి.’
- source_word: הַמֹּלֶכֶת
  choice: హమ్మోలెకెత్
  rationale: వంశావళి సందర్భంలో ఇది వ్యక్తిపేరుగా ఉంది. హీబ్రూ రూపంలోని ఆరంభ నిర్దేశకాన్ని పేరులో భాగంగా నిలిపి ‘హమ్మోలెకెత్’ అని లిప్యంతరీకరించాం.
- source_word: יָלְדָה
  choice: కన్నది
  rationale: స్త్రీ కర్తతో వచ్చిన ילד క్రియ ప్రసవించడాన్ని సూచిస్తుంది. వంశావళి సందర్భంలో ‘కన్నది’ సంక్షిప్తంగా, సహజంగా ఉండి మాతృసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: ప్రత్యక్ష కర్మ సూచన—తెలుగులో విడిగా అనువదించలేదు
  rationale: ఈ హీబ్రూ అవ్యయం తరువాతి పేర్లను ప్రత్యక్ష కర్మలుగా సూచిస్తుంది; తెలుగులో -ను విభక్తి ద్వారా ఆ పని నెరవేరుతుంది.
- source_word: אִישְׁהוֹד
  choice: ఇష్హోదు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని, విభక్తి ప్రయోగాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲבִיעֶזֶר
  choice: అబీయెజెరు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: מַחְלָה
  choice: మహ్లా
  rationale: హీబ్రూ వ్యక్తిపేరును సాధ్యమైనంత సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
