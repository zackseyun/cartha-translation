  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י יַפְלֵ֔ט פָּסַ֥ךְ וּ/בִמְהָ֖ל וְ/עַשְׁוָ֑ת אֵ֖לֶּה בְּנֵ֥י יַפְלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: te
  text: 'యఫ్లేట్ కుమారులు: పాసఖ్, బిమ్హాల్, అష్వాత్. వీరే యఫ్లేట్ కుమారులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: కుమారులు
  rationale: వంశావళిలో ఇది בֵּן పదం యొక్క బహువచన నిర్మిత రూపం; ఇక్కడ ప్రత్యక్షంగా కుమారుల జాబితా ఇవ్వబడుతున్నందున విస్తృతార్థమైన ‘సంతానం’ కంటే ‘కుమారులు’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: יַפְלֵט
  choice: యఫ్లేటు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగు పఠనానికి సహజంగా ఉండేలా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: פָּסַךְ
  choice: పాసఖ్
  rationale: చివరి ך యొక్క ఘర్షణ ధ్వనిని నిలుపుతూ వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וּבִמְהָל
  choice: బిమ్హాలు
  rationale: ముందున్న సంధికారకాన్ని జాబితా నిర్మాణంలో విడిగా గ్రహించి, వ్యక్తి పేరును తెలుగు పఠనానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: וְעַשְׁוָת
  choice: అష్వాతు
  rationale: హీబ్రూ వ్యక్తి పేరులోని వ్యంజన క్రమాన్ని తెలుగు ఉచ్చారణకు అనువుగా ప్రతిబింబించే లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: אֵלֶּה בְּנֵי יַפְלֵט
  choice: వీరే యఫ్లేటు కుమారులు
  rationale: హీబ్రూలో కాలసూచక క్రియ లేదు. ‘వీరే’ అనే రూపం వర్తమాన–భూతకాల భేదాన్ని అనవసరంగా నిర్ణయించకుండా, జాబితాను ముగించే వంశావళి సారాంశ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని పునరుక్త ముగింపు నిర్మాణాన్ని నిలిపాం; పేర్లను హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం.
