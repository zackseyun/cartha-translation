id: 1CH.7.14
reference: 1 Chronicles 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: te
  text: 'మనష్షే కుమారులు[a]: అతని అరామీయురాలైన[b] ఉపపత్ని కన్న అస్రియేలు; ఆమె గిలాదుకు తండ్రియైన మాకీరును కన్నది[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనష్షే వంశస్థులు.” వంశావళుల్లో “కుమారులు” అనే పదం కొన్నిసార్లు విస్తృతంగా వంశస్థులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “అరామీయ స్త్రీ”; సంప్రదాయ అనువాదాల్లో “సిరియా స్త్రీ.”
    reason: lexical_alternative
  - marker: c
    text: వంశావళి వాడుకలో “తండ్రి” అనే మాటకు “పూర్వికుడు” లేదా “స్థాపకుడు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారులు
  rationale: בְּנֵי అనే నిర్మాణరూప బహువచనానికి నేరమైన అర్థం ‘కుమారులు.’ వంశావళుల్లో ఇది విస్తృతంగా వంశస్థులను కూడా సూచించగలదు; ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַשְׂרִיאֵל
  choice: అశ్రీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר יָלָדָה
  choice: కనిన
  rationale: స్త్రీలింగ ఏకవచన క్రియను తరువాత వచ్చే స్త్రీలింగ కర్తతో అనుసంధానిస్తూ, ‘ఆమె కనిన’ అనే భావాన్ని సహజమైన తెలుగు సంబంధ విశేషణ రూపంలో ఇచ్చాం.
- source_word: פִּילַגְשׁוֹ
  choice: అతని ... ఉపపత్ని
  rationale: פִּילֶגֶשׁ కు ‘ఉపపత్ని’ నేరమైన, చారిత్రక సంబంధాన్ని స్పష్టంగా తెలిపే తెలుగు పదం; ‘రెండవ భార్య’ అనడం మూలానికి మించిన వ్యాఖ్యానం అవుతుంది.
- source_word: הָאֲרַמִּיָּה
  choice: అరామీయురాలైన
  rationale: ఇది అరాము జాతికి చెందిన స్త్రీని సూచిస్తుంది. చారిత్రకంగా తక్కువ ఖచ్చితమైన సంప్రదాయ ‘సిరియా స్త్రీ’ కంటే ‘అరామీయురాలు’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: יָלְדָה אֶת מָכִיר
  choice: ఆమె ... మాకీరును కనింది
  rationale: హీబ్రూలో స్త్రీలింగ కర్తతో పునరావృతమైన జనన ప్రకటనను నిలుపుతూ, తెలుగులో కర్తను స్పష్టంగా పేర్కొన్నాం.
- source_word: אֲבִי גִלְעָד
  choice: గిలాదుకు తండ్రి
  rationale: אָב యొక్క ప్రాథమిక అర్థమైన ‘తండ్రి’ని ప్రధాన పాఠంలో నిలిపాం; వంశావళి సందర్భంలో ‘పూర్వికుడు’ లేదా ‘స్థాపకుడు’ అనే విస్తృత భావాలు సాధ్యమని పాదసూచికలో తెలిపాం.
