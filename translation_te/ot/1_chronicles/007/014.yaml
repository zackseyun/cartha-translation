translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన సంక్షిప్తతను మరియు గౌరవప్రదమైన ధోరణిని నిలిపాం. ‘కనిన/కనింది’ అనే సహజ రూపాలు హీబ్రూలోని పునరుక్తిని కాపాడుతాయి. మూలంలోని రెండు జనన ప్రకటనల మధ్య ఉన్న ఉద్వేగాన్ని వ్యాఖ్యానంతో తొలగించలేదు.
