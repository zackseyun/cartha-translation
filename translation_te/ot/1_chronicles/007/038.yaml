  text: וּ/בְנֵ֖י יֶ֑תֶר יְפֻנֶּ֥ה וּ/פִסְפָּ֖ה וַ/אְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: te
  text: 'యెతెరు కుమారులు: యెఫున్నె, పిస్పా[a], అరా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ పదంలోని చివరి వ్యంజనాన్ని మరింత అక్షరానుసారంగా చూపిస్తూ ఈ పేరును ‘పిస్పాహ్’ అని కూడా రాయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే పదం యొక్క సమాస రూపం; వంశావళి సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. ఆరంభంలోని וּ సందర్భంలోని జాబితా అనుసంధానాన్ని సూచించినా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా ఉండటం సహజంగా ఉంటుంది.
- source_word: יֶתֶר
  choice: యెతెరు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: יְפֻנֶּה
  choice: యెఫున్నె
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా, దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּפִסְפָּה
  choice: పిస్పా
  rationale: ముందున్న సంధికారకాన్ని జాబితా నిర్మాణంలో సహజంగా గ్రహించి, వ్యక్తిపేరును ‘పిస్పా’గా లిప్యంతరీకరించాం; చివరి ה ఉచ్చారణలో సాధారణంగా వ్యక్తం కాకపోవచ్చు.
- source_word: וַאְרָא
  choice: అరా
  rationale: ఇది వంశావళిలోని వ్యక్తిపేరుగా తీసుకుని ధ్వన్యనుసారంగా ‘అరా’ అని లిప్యంతరీకరించాం; జాబితా చివరి అంశం కావడంతో సంధికారకాన్ని తెలుగులో విడిగా చూపలేదు.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదివేలా పేర్ల జాబితాను పెద్దప్రేగుతో పరిచయం చేశాం. వ్యక్తిపేర్లు అనువదించకుండా హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం.
