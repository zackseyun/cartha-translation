  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: te
  text: షెమీదా కుమారులు[a] అహ్యాను, షెకెము, లిక్హీ, అనీయాము.
  philosophy: optimal-equivalence
  footnotes:
