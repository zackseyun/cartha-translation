    text: లేదా ‘షెమీదా పురుష సంతతివారు.’ వంశావళుల్లో ‘కుమారులు’ అనే మాట కొన్నిసార్లు తరువాతి తరాల పురుష సంతతిని కూడా సూచించవచ్చు; అయితే ఇక్కడి సమీప సందర్భం ‘కుమారులు’ అనే అర్థానికే మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కుమారులు ...
  rationale: వంశావళి జాబితాను పరిచయం చేసే היה రూపాన్ని తెలుగులో సహజమైన నామవాక్య నిర్మాణంతో వ్యక్తం చేశాం; ప్రత్యేకంగా ‘ఉండిరి’ అని చేర్చడం అవసరం లేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఈ సందర్భంలో పురుషుల పేర్లు నేరుగా జాబితా చేయబడుతున్నందున మూలంలోని పుంలింగ వంశావళి పదాన్ని నిలుపుతుంది; అయినా వంశావళుల్లో ఇది విస్తృతంగా పురుష సంతతిని సూచించగలదు.
- source_word: שְׁמִידָע
  choice: షెమీదా
  rationale: హీబ్రూ ఉచ్చారణను ఆధారంగా చేసుకొని తెలుగులో పఠనయోగ్యంగా లిప్యంతరీకరించబడింది.
- source_word: אַחְיָן
  choice: అహ్యాను
  rationale: హీబ్రూ వ్యక్తిపేరును దాని వ్యంజన, స్వర రూపాలకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שֶׁכֶם
  choice: షెకెము
  rationale: ఇక్కడ వాక్యనిర్మాణం దీనిని స్థలనామంగా కాక వ్యక్తిపేరుగా చూపుతుంది; సుపరిచితమైన తెలుగు బైబిలు పేరు రూపాన్ని అనుసరించాం.
- source_word: לִקְחִי
  choice: లిక్హీ
  rationale: హీబ్రూ పేరులోని చివరి దీర్ఘ స్వరాన్ని, మధ్య ఘర్ష ధ్వనిని సాధ్యమైనంత స్పష్టంగా చూపే తెలుగు లిప్యంతరీకరణ.
- source_word: אֲנִיעָם
  choice: అనీయాము
  rationale: పేరును అనువదించకుండా హీబ్రూ స్వరరూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించాం.
