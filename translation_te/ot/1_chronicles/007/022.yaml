translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడాం. మూలంలోని బంధుత్వ సూచనలను యథాతథంగా ఉంచి, సహజమైన తెలుగు పదక్రమాన్ని అనుసరించాం.
