  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: te
  text: వారి తండ్రి ఎఫ్రాయిము చాలా రోజులు శోకించాడు. అతని సహోదరులు అతన్ని ఓదార్చడానికి[a] వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి సాంత్వన కలిగించడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: దుఃఖించాడు
  rationale: హిత్పయేల్ రూపం మరణం వల్ల శోకంలో మునిగిపోవడాన్ని సూచిస్తుంది. ముందరి వచనంలోని మరణసందర్భానికి ‘దుఃఖించాడు’ సహజంగా సరిపోతుంది.
- source_word: אֶפְרַיִם
  choice: ఎఫ్రాయిము
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా వాడే బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲבִיהֶם
  choice: వారి తండ్రి
  rationale: మూడవ పురుష బహువచన ప్రత్యయం, ముందుగా ప్రస్తావించిన కుమారులకు ఎఫ్రాయిము తండ్రి అని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָמִים רַבִּים
  choice: చాలా రోజులు
  rationale: ఈ హీబ్రూ ప్రయోగం కాలవ్యవధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చాలా రోజులు’ సహజమైన వ్యక్తీకరణ.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: కథన సందర్భంలో בוא ఇక్కడ ఎఫ్రాయిము దగ్గరకు రావడాన్ని సూచిస్తుంది.
- source_word: אֶחָיו
  choice: అతని సహోదరులు
  rationale: పదానికి ప్రాథమిక అర్థం ‘అతని సహోదరులు’; విస్తృత బంధుత్వార్థాన్ని ఎంచుకోవడానికి సందర్భంలో బలమైన కారణం లేదు.
- source_word: לְנַחֲמוֹ
  choice: అతన్ని ఓదార్చడానికి
  rationale: ఈ రూపం దుఃఖిస్తున్న వ్యక్తికి ఆదరణ కలిగించడాన్ని సూచిస్తుంది. ‘ఓదార్చడానికి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
