  text: וּ/בְנֵ֣י בֶ֗לַע אֶצְבּ֡וֹן וְ/עֻזִּ֡י וְ֠/עֻזִּיאֵל וִ/ירִימ֨וֹת וְ/עִירִ֜י חֲמִשָּׁ֗ה רָאשֵׁי֙ בֵּ֣ית אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים וְ/הִתְיַחְשָׂ֗/ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וּ/שְׁלֹשִׁ֖ים וְ/אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: te
  text: 'బెలా కుమారులు: ఎజ్బోను, ఉజ్జీ, ఉజ్జీయేలు, యెరీమోతు, ఈరీ—ఈ ఐదుగురు పితృకుటుంబాల పెద్దలు, పరాక్రమశాలులైన యోధులు. వంశావళి పట్టికలో నమోదైన వారి సంఖ్య[a] ఇరవై రెండు వేల ముప్పై నాలుగు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి వంశావళి’ లేదా ‘వంశావళి ప్రకారం వారి నమోదు.’ హీబ్రూ పదం వంశావళి రికార్డుల్లో నమోదు చేయబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: బెల కుమారులు
  rationale: వంశావళి సందర్భంలో בני అనే పదం విస్తృతంగా ‘వంశస్థులు’ అని సూచించగలిగినా, వెంటనే ఐదుగురు పురుషుల పేర్లు రావడం వల్ల సహజమైన ‘కుమారులు’ను ఎంచుకున్నాం.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: ఎజ్బోను, ఉజ్జీ, ఉజ్జీయేలు, యెరీమోతు, ఈరీ
  rationale: హీబ్రూ వ్యక్తినామాల ధ్వనులను ఆధునిక తెలుగు లిపిలో సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: తమ పితృవంశాల కుటుంబాలకు అధిపతులు
  rationale: ‘తండ్రుల ఇళ్లు’ అనే అక్షరార్థ పదబంధం సూచించే వంశాధారిత కుటుంబ విభాగాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, నాయకత్వ భావాన్ని ‘అధిపతులు’తో నిలిపాం.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ హీబ్రూ పదబంధం బలసామర్థ్యమూ యుద్ధనైపుణ్యమూ గల పురుషులను సూచిస్తుంది; ఆధునిక పాఠకులకు స్పష్టంగా ఉండే సహజ తెలుగు రూపాన్ని వాడాం.
- source_word: וְהִתְיַחְשָׂם
  choice: వంశావళి ప్రకారం నమోదైన వారి సంఖ్య
  rationale: דברי הימיםలో יחס క్రియ వంశావళి రికార్డుల్లో నమోదు కావడాన్ని సూచిస్తుంది. తరువాత సంఖ్య రావడం వల్ల నామవాచక భావాన్ని తెలుగులో ఈ విధంగా స్పష్టం చేశాం.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: ఇరవై రెండు వేల ముప్పై నాలుగు
  rationale: 'హీబ్రూ సంఖ్యా నిర్మాణాన్ని తెలుగులో సహజమైన పదరూపంలో అందించాం: 22,034.'
