  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. వంశవ్యవస్థకు సంబంధించిన సాంకేతిక భావాన్ని అతిగా అక్షరార్థంగా కాకుండా పారదర్శకంగా వ్యక్తం చేశాం.
