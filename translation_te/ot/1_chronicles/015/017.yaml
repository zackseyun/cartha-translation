source:
  edition: WLC
  text: וַ/יַּעֲמִ֣ידוּ הַ/לְוִיִּ֗ם אֵ֚ת הֵימָ֣ן בֶּן יוֹאֵ֔ל וּ/מִ֨ן אֶחָ֔י/ו אָסָ֖ף בֶּן בֶּֽרֶכְיָ֑הוּ וּ/מִן בְּנֵ֤י מְרָרִי֙ אֲחֵי/הֶ֔ם אֵיתָ֖ן בֶּן קֽוּשָׁיָֽהוּ־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: te
  text: అప్పుడు లేవీయులు యోవేలు కుమారుడైన హేమానును, అతని సహోదరులలో బెరెక్యా కుమారుడైన ఆసాపును, మెరారీ కుమారులైన వారి సహోదరులలో కూషాయా కుమారుడైన ఏతానును నియమించారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిలబెట్టారు’ లేదా ‘స్థానంలో ఉంచారు’; హీబ్రూ క్రియ ఒకరిని నియమిత పాత్రలో నిలబెట్టడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మెరారీ కుమారులలో’; అంటే మెరారీ వంశానికి చెందినవారిలో.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: నియమించారు
  rationale: עמד ధాతువు హిఫీల్ రూపంలో ఇక్కడ ఒకరిని నిర్దిష్ట సేవాస్థానంలో నిలబెట్టడం లేదా బాధ్యతకు నియమించడం అనే భావాన్ని ఇస్తుంది. లేవీయ సంగీతకారుల ఏర్పాటు సందర్భంలో ‘నియమించారు’ సహజంగా, స్పష్టంగా ఉంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక తెలుగు రూపం; మూలంలోని నిర్దిష్టత సందర్భానుసారంగా వ్యక్తమవుతుంది.
- source_word: אֵת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో కర్మవిభక్తి ‘-ను’ ద్వారా దాని వాక్యపాత్ర వ్యక్తమైంది.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: యోవేలు కుమారుడైన హేమాను
  rationale: వంశసంబంధాన్ని స్పష్టంగా నిలుపుతూ పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּמִן אֶחָיו
  choice: అతని సహోదరులలో
  rationale: מִן ఒక సమూహంలోనుండి ఎంపికను సూచిస్తుంది. ‘అతని’ అనే ఏకవచన సంబంధాన్ని మూలానికి అనుగుణంగా నిలిపాం.
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: బెరెక్యా కుమారుడైన ఆసాపు
  rationale: పేర్లను సహజమైన తెలుగు లిప్యంతరీకరణలో ఇచ్చి, తండ్రి-కుమారుని సంబంధాన్ని యథాతథంగా ఉంచాం.
- source_word: וּמִן בְּנֵי מְרָרִי אֲחֵיהֶם
  choice: వారి సహోదరులైన మెరారి కుమారులలో
  rationale: ‘మెరారి కుమారులు’ అనే మూలంలోని వంశ/కుల పదబంధాన్ని నిలుపుతూ, אֲחֵיהֶם లోని ‘వారి సహోదరులు’ అనే సంబంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరిచాం.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: కూషాయా కుమారుడైన ఏతాను
  rationale: వ్యక్తిపేర్లను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, స్పష్టమైన వంశసంబంధాన్ని నిలుపుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. జాబితా నిర్మాణాన్ని సహజంగా ఉంచుతూ మూలంలోని ఏకవచన ‘అతని’ మరియు బహువచన ‘వారి’ మధ్య తేడాను కాపాడాం.
