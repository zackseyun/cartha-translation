  text: וּ/שְׁבַנְיָ֡הוּ וְ/יֽוֹשָׁפָ֡ט וּ/נְתַנְאֵ֡ל וַ/עֲמָשַׂ֡י וּ֠/זְכַרְיָהוּ וּ/בְנָיָ֤הוּ וֶֽ/אֱלִיעֶ֨זֶר֙ הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹ֣צְר֔וֹת לִ/פְנֵ֖י אֲר֣וֹן הָֽ/אֱלֹהִ֑ים וְ/עֹבֵ֤ד אֱדֹם֙ וִֽ/יחִיָּ֔ה שֹׁעֲרִ֖ים לָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: te
  text: యాజకులైన షెబన్యాహు, యెహోషాపాతు, నెతనేలు, అమాసై, జెకర్యాహు, బెనాయాహు, ఎలీయెజెరు దేవుని మందసం ముందు బూరలు[a] ఊదుతున్నారు. ఓబేద్-ఎదోము, యెహీయా మందసం కోసం ద్వారపాలకులుగా[b] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం సాధారణంగా యాజకులు ఆరాధనలో ఉపయోగించే నిటారైన బూరలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘మందసానికి ద్వారపాలకులుగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం ముందున్న పేర్లను యాజకులుగా గుర్తిస్తుంది; తెలుగులో ‘యాజకులైన’ సహజమైన విశేషణ సంబంధాన్ని చూపుతుంది.
- source_word: מחצצרים
  choice: బూరలు ఊదుతూ ఉన్నారు
  rationale: హీబ్రూ కృదంతం ఊరేగింపులో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּחֲצֹצְרוֹת
  choice: బూరలు
  rationale: ఈ పదం ఆరాధనలో యాజకులు ఉపయోగించే బూరలను సూచిస్తుంది. ఈ వచనంలో లేని ‘వెండి’ అనే వివరాన్ని చేర్చలేదు.
- source_word: לִפְנֵי
  choice: ముందు
  rationale: ఊరేగింపులో మందసానికి ముందున్న స్థానాన్ని తెలిపే సహజమైన ప్రాదేశిక అనువాదం.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా తెలియజేస్తుంది.
- source_word: שֹׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: పవిత్ర స్థలం లేదా ఆరాధనా సందర్భంలో నియమిత కాపలా బాధ్యతగల వారిని సూచించే సంస్థాగత భావాన్ని నిలుపుతుంది.
- source_word: לָאָרוֹן
  choice: మందసానికి
  rationale: లామెద్ ఇక్కడ మందసానికి సంబంధించిన నియామకం లేదా బాధ్యతను సూచిస్తుంది; తెలుగు విభక్తి ఆ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְעֹבֵד אֱדֹם
  choice: ఓబేద్-ఎదోము
  rationale: హీబ్రూ సంయుక్త వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: וִיחִיָּה
  choice: యెహీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో మూలరూపానికి దగ్గరగా అందించింది.
