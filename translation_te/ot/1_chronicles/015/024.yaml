translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. కొనసాగుతున్న ఊరేగింపు చర్యను ‘ఊదుతూ ఉన్నారు’ అని తెలిపాం. మూలంలో లేని ‘వెండి’ వంటి వివరాలను చేర్చలేదు; ‘ద్వారపాలకులు’ అనే ఆరాధనా-సంస్థాగత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
