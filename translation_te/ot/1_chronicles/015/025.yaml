id: 1CH.15.25
reference: 1 Chronicles 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: te
  text: దావీదు, ఇశ్రాయేలు పెద్దలు, వెయ్యిమంది దళాల అధిపతులు యాహ్వే నిబంధన మందసాన్ని ఓబేద్-ఎదోము ఇంటి నుండి ఆనందంతో పైకి తీసుకురావడానికి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  choice: వెళ్లారు
  rationale: వַיְהִי కథనాన్ని కొనసాగించే ప్రవేశరూపంగా, הַהֹלְכִים ముందున్న సమూహం చేసిన చర్యను తెలిపే కృదంతంగా ఉన్నాయి. ఆధునిక తెలుగులో రెండింటి కథన కార్యాన్ని సహజమైన సమాపక క్రియ ‘వెళ్లారు’తో వ్యక్తం చేశాం.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: ఇది ఇశ్రాయేలు సమాజంలోని గుర్తింపు పొందిన నాయకవర్గాన్ని సూచించే సహజమైన, అర్థస్పష్టమైన తెలుగు రూపం.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: వేలమందికి అధిపతులు
  rationale: שָׂרֵי అంటే నాయకులు లేదా అధిపతులు; אֲלָפִים వెయ్యిమంది గల సైనిక లేదా పరిపాలనా విభాగాలను సూచిస్తుంది. మూలంలోని నిర్మాణాన్ని అతిగా వ్యాఖ్యానించకుండా ఈ రూపం నిలుపుతుంది.
- source_word: לְהַעֲלוֹת
  choice: పైకి తీసుకురావడానికి
  rationale: עלה యొక్క హిఫీల్ రూపం ఇక్కడ మందసాన్ని ఒక స్థలం నుండి ఉన్నతమైన లేదా కేంద్రస్థానానికి తీసుకురావడాన్ని సూచిస్తుంది; ‘పైకి తీసుకురావడం’ దిశాభావాన్ని నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం
  rationale: హీబ్రూ సమాసంలోని సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తూ, ‘మందసం’ అనే స్థిరమైన బైబిలు పదాన్ని ఉపయోగించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: ఓబేదెదోము ఇంటి నుండి
  rationale: సంబంధబోధక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి, వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: בְּשִׂמְחָה
  choice: ఆనందంతో
  rationale: בְּ ఉపసర్గ ఇక్కడ చర్య జరిగిన భావవిధానాన్ని తెలుపుతుంది; ‘ఆనందంతో’ సంక్షిప్తంగా, సహజంగా ఉత్సవభావాన్ని అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో సాధారణ ‘ప్రభువు’ అనే బిరుదు కాక దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించేందుకు ఉపయోగించే ప్రత్యామ్నాయ రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. మూలంలోని వ్యక్తుల జాబితా, గమ్యార్థక క్రియ, దిశాభావం, ఆనందభావం అన్నీ నిలుపుతూ తెలుగు వాక్యాన్ని సహజంగా కూర్చాం.
