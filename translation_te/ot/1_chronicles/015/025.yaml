- from: దావీదు, ఇశ్రాయేలు పెద్దలు, వేలమందికి అధిపతులు యెహోవా నిబంధన మందసాన్ని ఓబేదెదోము ఇంటి నుండి ఆనందంతో పైకి తీసుకురావడానికి వెళ్లారు.
