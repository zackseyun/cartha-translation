  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: te
  text: 'ఉజ్జీయేలు కుమారుల వారు: అధిపతి అమ్మీనాదాబు మరియు అతని సహోదరులు నూట పన్నెండు మంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: కుమారులలో
  rationale: ఇక్కడ לְ వరుసలో తదుపరి వంశగుంపును పరిచయం చేస్తుంది. తెలుగు జాబితా శైలిలో ‘కుమారులలో’ సహజంగా ఉండి, בנים లోని వంశ/కుటుంబ భావాన్ని నిలుపుతుంది.
- source_word: עֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: עַמִּינָדָב
  choice: అమ్మీనాదాబు
  rationale: వ్యక్తి పేరు; హెబ్రీ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: הַ/שָּׂר
  choice: అధిపతి
  rationale: שַׂר అనేది అధిపతి, నాయకుడు, ప్రధానుడు లేదా రాజకుమారుడు అనే అర్థాలు కలిగి ఉంటుంది. ఈ లేవీయ వంశనాయకుల జాబితా సందర్భంలో ‘అధిపతి’ సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: וְ/אֶחָי/ו
  choice: అతని సహోదరులు
  rationale: אָח అనేది సొంత అన్నదమ్ములను లేదా విస్తృతంగా పురుష బంధువులను సూచించగలదు. మూలంలోని కుటుంబ సంబంధ పదాన్ని, దాని కొంత విస్తృతతను ‘సహోదరులు’ నిలుపుతుంది.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: నూట పన్నెండు మంది
  rationale: సంఖ్యను సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చి, వ్యక్తుల లెక్క అని స్పష్టపరచడానికి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. పేర్లు హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని కుటుంబ సంబంధ భాష నిలుపబడింది.
