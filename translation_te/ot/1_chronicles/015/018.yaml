- from: 'వారితోపాటు రెండవ శ్రేణికి చెందిన వారి సహోదరులు[a] కూడా ఉన్నారు: జెకర్యా, బెన్, యాజీయేలు[b], షెమీరామోతు, యెహీయేలు, ఉన్నీ, ఏలీయాబు, బెనాయా, మయశేయా, మత్తిత్యా, ఎలీఫెలేహు, మిక్నేయా, ఓబేదెదోము, యెయీయేలు. వీరు ద్వారపాలకులు.'
  to: 'వారితోపాటు రెండవ శ్రేణికి చెందిన వారి సహోదరులు[a] ఉన్నారు: జెకర్యా, బెన్, యయజీయేలు[b], షెమీరామోతు, యెహీయేలు, ఉన్నీ, ఏలీయాబు, బెనాయా, మయశేయా, మత్తిత్యా, ఎలీఫెలేహు, మిక్నేయా, ఓబేదెదోము, యెయీయేలు అనే ద్వారపాలకులు.'
  rationale: మసొరేటిక్ పాఠంలోని బెన్ మరియు యయజీయేలు మధ్యనున్న సమన్వయాన్ని, దానికి సంబంధించిన పాఠవ్యాఖ్యాన అనిశ్చితిని అలాగే నిలిపాం. యయజీయేలు పేరును మూలధ్వనికి దగ్గరగా సవరించాం. ‘ద్వారపాలకులు’ అనే చివరి విశేషణాన్ని స్వతంత్ర వాక్యంగా కాక చివరి పేర్లతో కలిపి, దాని వ్యాకరణ పరిధిని అతిగా విస్తరించకుండా చేశాం; అనవసరమైన ‘కూడా’ను తొలగించాం.
