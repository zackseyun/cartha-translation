    rationale: హీబ్రూ వాక్యంలో הַשֹּׁעֲרִים చివరనున్న ఓబేదెదోము, యెయీయేలు పేర్లకు సమీపంగా ఉంది. దానిని ఆ పేర్లతోనే కలపడం మూలంలోని పరిధిని అనవసరంగా విస్తరించదు.
  - severity: low
