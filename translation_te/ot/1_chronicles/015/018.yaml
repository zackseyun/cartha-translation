source:
  edition: WLC
  text: וְ/עִמָּ/הֶ֖ם אֲחֵי/הֶ֣ם הַ/מִּשְׁנִ֑ים זְכַרְיָ֡הוּ בֵּ֡ן וְ/יַֽעֲזִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִ/יחִיאֵ֣ל וְ/עֻנִּ֡י אֱלִיאָ֡ב וּ/בְנָיָ֡הוּ וּ/מַֽעֲשֵׂיָ֡הוּ וּ/מַתִּתְיָהוּ֩ וֶ/אֱלִ֨יפְלֵ֜הוּ וּ/מִקְנֵיָ֨הוּ וְ/עֹבֵ֥ד אֱדֹ֛ם וִֽ/יעִיאֵ֖ל הַ/שֹּׁעֲרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: te
  text: 'వారితోపాటు రెండవ శ్రేణికి చెందిన వారి సహోదరులు[a] ఉన్నారు: జెకర్యా, బెన్, యయజీయేలు[b], షెమీరామోతు, యెహీయేలు, ఉన్నీ, ఏలీయాబు, బెనాయా, మయశేయా, మత్తిత్యా, ఎలీఫెలేహు, మిక్నేయా, ఓబేదెదోము, యెయీయేలు అనే ద్వారపాలకులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రెండవ వర్గానికి చెందిన వారి సహోదరులు’ లేదా ‘రెండవ క్రమంలోని వారి సహోదరులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం లేవీయులు లేదా సంగీతకారులలోని ద్వితీయ స్థాయి లేదా వర్గాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠాన్ని అక్షరార్థంగా అనుసరించి ‘బెన్, యయజీయేలు’ అని ఇచ్చాం. ‘బెన్-యయజీయేలు’ అనే ఒకే పేరుగా లేదా ‘యయజీయేలు కుమారుడైన జెకర్యా’ అనే సంబంధంగా అర్థం చేసుకునే అవకాశమూ ప్రతిపాదించబడింది; అయితే హీబ్రూలో ‘యయజీయేలు’ ముందు ‘మరియు’ ఉంది.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: వారితోపాటు ... కూడా ఉన్నారు
  rationale: హీబ్రూ అవ్యయ పదబంధం తోడుగా ఉన్న మరొక వర్గాన్ని పరిచయం చేస్తుంది. క్రియలేని హీబ్రూ వాక్యాన్ని సహజమైన తెలుగులో చెప్పడానికి ‘ఉన్నారు’ చేర్చబడింది.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: మూలపదానికి ప్రత్యక్ష అర్థం ‘వారి సహోదరులు.’ ఈ లేవీయ సందర్భంలో ఇది తోటి లేవీయులను లేదా సహచరులను సూచించవచ్చు; అయినా మూలంలోని బంధుత్వ భాషను నిలిపాం.
- source_word: הַמִּשְׁנִים
  choice: రెండవ శ్రేణికి చెందిన
  rationale: ‘రెండవ’ అనే భావమున్న ఈ పదం ఇక్కడ లేవీయులు లేదా సంగీతకారులలోని ద్వితీయ స్థాయి/వర్గాన్ని వేరుచేస్తున్నట్లు కనిపిస్తుంది. తెలుగు పాఠకునికి భావం స్పష్టంగా ఉండేలా ‘రెండవ శ్రేణి’ అని అనువదించాం.
- source_word: זְכַרְיָהוּ
  choice: జెకర్యా
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: בֵּן וְיַעֲזִיאֵל
  choice: బెన్, యాజీయేలు
  rationale: మసొరేటిక్ హీబ్రూ పాఠంలో בֵּן తరువాత ‘మరియు యాజీయేలు’ అని సంధి ఉంది; అందువల్ల మూలపాఠానికి దగ్గరగా వీటిని రెండు సమన్విత నామాలుగా చూపించాం. నిర్మాణంలోని అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఈ బహువచన పదం ద్వారాల వద్ద కాపలా లేదా సేవ చేసే వారిని సూచిస్తుంది; ‘ద్వారపాలకులు’ సహజమైన, సందర్భోచిత తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పేర్లను తెలుగు బైబిలు సంప్రదాయానికి దగ్గరగా లిప్యంతరీకరించాం; హీబ్రూ జాబితాలో తరచుగా వచ్చే సంధులను తెలుగులో సహజమైన విరామచిహ్నాలతో చూపించాం. చివరి ‘ద్వారపాలకులు’ అన్న విశేషణం జాబితాలోని చివరి ఇద్దరినే సూచించవచ్చనే వ్యాకరణ అవకాశమున్నందున, దానిని ప్రత్యేక వాక్యంగా మార్చడం ద్వారా పరిధిని అతిగా నిర్ధారించకుండా ఉంచాం.
