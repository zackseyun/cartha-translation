  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א דָוִ֔יד לְ/צָד֥וֹק וּ/לְ/אֶבְיָתָ֖ר הַ/כֹּֽהֲנִ֑ים וְ/לַ/לְוִיִּ֗ם לְ/אֽוּרִיאֵ֤ל עֲשָׂיָה֙ וְ/יוֹאֵ֣ל שְׁמַֽעְיָ֔ה וֶ/אֱלִיאֵ֖ל וְ/עַמִּינָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: te
  text: అప్పుడు దావీదు యాజకులైన సాదోకును అబ్యాతారును, లేవీయులైన ఊరియేలు, అసాయా, యోవేలు, షెమయా, ఎలీయేలు, అమ్మీనాదాబులను పిలిపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించాడు
  rationale: ఈ సందర్భంలో קרא అనేది పేర్కొన్నవారిని తన సమక్షానికి రప్పించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పిలిపించాడు’ ఈ సమనింగ్ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: హీబ్రూలోని నిర్దిష్ట పదం సాదోకు, అబ్యాతారు వారి యాజక పాత్రను సూచిస్తుంది. తెలుగులో పేర్లకు ముందు ‘యాజకులైన’ అని ఉంచడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְלַלְוִיִּם
  choice: లేవీయులైన
  rationale: ל పూర్వప్రత్యయం పిలిపించబడిన రెండవ వర్గాన్ని సూచిస్తుంది. తరువాతి ఆరు పేర్లు లేవీయులను గుర్తిస్తున్నందున ‘లేవీయులైన’ అని అనుసంధానించడం తెలుగు వాక్య నిర్మాణానికి సరిపోతుంది.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: ఊరియేలు, అసాయా, యోవేలు, షెమయా, ఎలీయేలు, అమ్మీనాదాబు
  rationale: వ్యక్తి పేర్లు హీబ్రూ రూపాలకు దగ్గరగా, ఆధునిక తెలుగు బైబిలు పఠనానికి సహజమైన విధంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: דָוִיד
  choice: దావీదు
  rationale: ఈ హీబ్రూ వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలోని రెండు వర్గాలు—యాజకులు, లేవీయులు—వారి పేర్లతో స్పష్టంగా అనుసంధానించబడ్డాయి.
