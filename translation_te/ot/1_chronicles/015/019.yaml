  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: te
  text: కంచు తాళాలతో ధ్వని వినిపించడానికి గాయకులు హేమాను, ఆసాపు, ఏతాను.[a]
  philosophy: optimal-equivalence
  footnotes:
