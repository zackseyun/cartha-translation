    issue: ఆజ్ఞారూపాల సమన్వయం మరియు ప్రతిబింబ నిర్మాణం
    rationale: הִתְקַדְּשׁוּ మరియు וְהַעֲלִיתֶם రెండూ ఆజ్ఞారూపాలు. “మిమ్మల్ని మీరు పవిత్రపరచుకొని” అనే రూపం రెండవ ఆజ్ఞకు ముందస్తు చర్య అనే సూక్ష్మ భావాన్ని జోడిస్తుంది; సంయుక్త కర్త అయిన “మీరు, మీ సహోదరులు”తో కూడా అది కొద్దిగా అసహజంగా ఉంటుంది. రెండు స్పష్టమైన బహువచన ఆజ్ఞలు మూల నిర్మాణాన్ని, తెలుగు సహజత్వాన్ని మెరుగ్గా కాపాడతాయి.
