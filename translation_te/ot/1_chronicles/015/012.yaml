- from: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు లేవీయుల పితృవంశాల పెద్దలు. మీరు, మీ సహోదరులు మిమ్మల్ని మీరు పవిత్రపరచుకొని[a], ఇశ్రాయేలు దేవుడైన యెహోవా మందసాన్ని నేను దాని కోసం సిద్ధం చేసిన స్థలానికి పైకి తీసుకురండి.”'
