id: 1CH.15.12
reference: 1 Chronicles 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు లేవీయుల పితృవంశాల పెద్దలు. మీరు, మీ సహోదరులు మిమ్మల్ని మీరు పవిత్రపరచుకోండి; ఇశ్రాయేలు దేవుడైన యెహోవా మందసాన్ని నేను దాని కోసం సిద్ధం చేసిన స్థలానికి పైకి తీసుకురండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: లేవీయుల పితృవంశాల పెద్దలు
  rationale: పితృసంతతి ఆధారంగా ఏర్పడిన వంశాల నాయకులను సూచించే హెబ్రీయ సామాజిక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הִתְקַדְּשׁוּ
  choice: మిమ్మల్ని మీరు పవిత్రపరచుకొని
  rationale: హిత్‌పయేల్ రూపం సూచించే ఆచారపరమైన స్వీయ శుద్ధీకరణ/ప్రతిష్ఠను స్పష్టంగా తెలియజేస్తుంది; తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానించడానికి ‘పరచుకొని’ వాడబడింది.
- source_word: וַאֲחֵיכֶם
  choice: మీ సహోదరులు
  rationale: మూలంలోని ‘మీ సోదరులు’ అనే భావాన్ని నిలుపుతూ, ఇక్కడ ఉద్దేశించిన తోటి లేవీయులను గౌరవప్రదంగా సూచిస్తుంది.
- source_word: וְהַעֲלִיתֶם
  choice: పైకి తీసుకురండి
  rationale: హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే దిశాత్మక భావాన్ని మందసం తరలింపు సందర్భంలో నిలుపుతుంది.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన యెహోవా మందసం
  rationale: దైవనామాన్ని యెహోవాగా లిప్యంతరీకరించి, ‘ఇశ్రాయేలు దేవుడు’ అనే సమానాధికార విశేషణాన్ని పూర్తిగా నిలుపుతుంది; אֲרוֹןకు తెలుగు బైబిలు వాడుకలో సహజమైన ‘మందసం’ ఎంచుకుంది.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: నేను దాని కోసం సిద్ధం చేసిన స్థలానికి
  rationale: హెబ్రీలో ప్రత్యక్షంగా లేని గమ్యస్థానం సందర్భం మరియు אֶל ద్వారా బలంగా సూచించబడుతుంది; తెలుగులో వాక్యం సంపూర్ణంగా, స్పష్టంగా ఉండేందుకు ‘స్థలం’ను వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రత్యక్షంగా నిలుపుతుంది.
- issue: הִתְקַדְּשׁוּలోని ఆచారపరమైన భావం
  choice: మిమ్మల్ని మీరు పవిత్రపరచుకొని
  alternative: మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని
  rationale: ఈ సందర్భం మందసాన్ని మోసేందుకు అవసరమైన ఆచారపరమైన సిద్ధతను సూచిస్తుంది. ‘పవిత్రపరచుకొని’ ఆ భావాన్ని ఉంచుతుంది; ‘ప్రతిష్ఠించుకొని’ కూడా సాధ్యమైనందున పాదసూచికలో ఇచ్చబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘పితృవంశాలు,’ ‘పవిత్రపరచుకొని,’ ‘మందసం’ వంటి పదాలు మూలంలోని చారిత్రక-ఆచారపరమైన భావాన్ని నిలుపుతాయి.
