translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశజాబితా శైలిని పాటించాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించాం; ‘సహోదరులు’ అనే మూలానికి సమీపమైన పదంలోని విస్తృత భావాన్ని పాదసూచికలో నిలిపాం.
