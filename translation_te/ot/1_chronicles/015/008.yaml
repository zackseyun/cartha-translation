source:
  edition: WLC
  text: לִ/בְנֵ֖י אֱלִֽיצָפָ֑ן שְׁמַֽעְיָ֥ה הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: te
  text: 'ఎలీషాపాను కుమారుల విషయానికి వస్తే: ప్రధానుడైన షెమయా, అతని సహోదరులు[a] రెండువందల మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని వంశస్థులు’; ఇక్కడి హీబ్రూ పదం సొంత సహోదరులను మాత్రమే కాక, అదే వంశానికి చెందిన బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: కుమారులలో
  rationale: లְ ఉపసర్గం ఈ జాబితాలో సంబంధిత వంశగుంపును పరిచయం చేస్తుంది. బְּנֵי అక్షరార్థంగా ‘కుమారులు’ అయినప్పటికీ, ఇక్కడ వంశసమూహాన్ని సూచిస్తుంది; సహజమైన తెలుగు జాబితా శైలిలో ‘కుమారులలో’ అని అనువదించాం.
- source_word: אֱלִיצָפָן
  choice: ఎలీషాఫాను
  rationale: హీబ్రూ పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: הַשָּׂר
  choice: ప్రధానుడైన
  rationale: שַׂר అనే పదానికి నాయకుడు, అధికారి, అధిపతి వంటి అర్థాలు ఉన్నాయి. ఈ వంశజాబితా సందర్భంలో రాజవంశీయ లేదా సైనిక హోదాను సూచించకుండా గుంపుకు నాయకత్వం వహించిన వ్యక్తిని ‘ప్రధానుడు’ స్పష్టంగా సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אָח పదం సొంత అన్నదమ్ములను గానీ, విస్తృత బంధువర్గం లేదా అదే వంశానికి చెందిన పురుషులను గానీ సూచించగలదు. మూలపదానికి దగ్గరగా ఉండేందుకు ‘సహోదరులు’ ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: מָאתָיִם
  choice: రెండువందల మంది
  rationale: మూలంలోని సంఖ్యను యథాతథంగా ఇచ్చి, వ్యక్తుల లెక్క అని సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చాం.
