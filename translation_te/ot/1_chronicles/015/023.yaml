translation:
  language: te
  text: బెరెక్యా, ఎల్కానా మందసం కోసం ద్వారపాలకులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందసం దగ్గర ద్వారపాలకులుగా ఉన్నారు.” హీబ్రూ ఉపసర్గ మందసానికి సంబంధించిన నియామకాన్ని లేదా మందసం ఉన్న చోటును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: బెరెక్యా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שֹׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ప్రవేశద్వారాన్ని కాపాడే నియమిత సేవకులను సూచించే హీబ్రూ పదానికి సహజమైన, సందర్భోచితమైన తెలుగు రూపం.
- source_word: לָאָרוֹן
  choice: మందసం కోసం
  rationale: ל ఉపసర్గ ఇక్కడ మందసానికి సంబంధించిన నియామకం లేదా బాధ్యతను సూచించగలదు; ‘కోసం’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. స్థలార్థకమైన ‘మందసం దగ్గర’ కూడా సాధ్యమే.
- source_word: וְ
  choice: మరియు భావాన్ని సూచించే విరామచిహ్నం
  rationale: రెండు వ్యక్తిపేర్లను కలిపే హీబ్రూ సంధానాన్ని తెలుగులో సహజంగా కామాతో వ్యక్తం చేశాం.
