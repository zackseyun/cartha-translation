id: 1CH.15.27
reference: 1 Chronicles 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: te
  text: దావీదు మెత్తని నారతో చేసిన పైవస్త్రం ధరించి ఉన్నాడు. మందసాన్ని మోస్తున్న లేవీయులందరూ, గాయకులు, మోయు బాధ్యతకు అధిపతియైన కనన్యా కూడా అలానే ధరించి ఉన్నారు.[a] దావీదు నార ఏఫోదు కూడా ధరించి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘మోయు బాధ్యతకు అధిపతి, గాయకులు’ అనే పదబంధం కఠినమైనది. దీనిని ‘గానానికి నాయకుడైన కనన్యా’ లేదా ‘సంగీత నాయకుడైన కనన్యా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: ధరించి ఉన్నాడు
  rationale: వస్త్రాన్ని కప్పుకొని లేదా ధరించి ఉన్న స్థితిని తెలిపే కర్మణి రూపం; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מְעִיל בּוּץ
  choice: సన్నని నారతో చేసిన అంగీ
  rationale: מְעִיל ఒక ప్రత్యేకమైన పైవస్త్రాన్ని, בּוּץ నాణ్యమైన సన్నని నారను సూచిస్తాయి; రెండింటి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: మందసాన్ని మోస్తున్న లేవీయులు
  rationale: ఊరేగింపులో కొనసాగుతున్న మోయు చర్యను సహజంగా వ్యక్తపరుస్తుంది; אָרוֹןకు సందర్భానుగుణమైన సంప్రదాయ తెలుగు పదం ‘మందసం’ వాడబడింది.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: మూలధాతువు ప్రత్యేకంగా పాడటాన్ని సూచిస్తుంది; ‘సంగీతకారులు’ కంటే ఇది ఖచ్చితమైనది.
- source_word: כְנַנְיָה
  choice: కనన్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: గాయకుల గానానికి నాయకుడు
  rationale: కఠినమైన మసొరేటిక్ పదబంధానికి సందర్భోచితమైన పఠనం; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో నిలుపుతుంది.
- source_word: אֵפוֹד בָּד
  choice: నార ఏఫోదు
  rationale: ప్రత్యేక ఆరాధనా వస్త్రనామమైన ‘ఏఫోదు’ను వివరణతో భర్తీ చేయకుండా అలాగే ఉంచి, దాని పదార్థాన్ని ‘నార’గా తెలిపింది.
- source_word: וְעַל דָּוִיד
  choice: దావీదు ... కూడా ధరించి ఉన్నాడు
  rationale: తెలుగులో సహజంగా ఉండేలా మార్చి, అంగీతో పాటు అదనంగా ఏఫోదు కూడా అతనిపై ఉందనే భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో దావీదు ధరించిన ఏఫోదు స్వభావం
  choice: ‘ఏఫోదు’ అనే ప్రత్యేక వస్త్రనామాన్ని మాత్రమే నిలుపడం
  alternative: ‘యాజక వస్త్రం’ అని వివరణాత్మకంగా అనువదించడం లేదా దావీదు యాజకుడిగా వ్యవహరించాడని సూచించడం
  rationale: వచనం దావీదు ధరించిన వస్త్రాన్ని చెబుతుంది గాని అతనికి యాజక పదవి ఉందని స్పష్టంగా చెప్పదు; అందువల్ల మూలపాఠాన్ని మించి సిద్ధాంతార్థం చేర్చలేదు.
- issue: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים అనే వాక్యనిర్మాణపరంగా కఠినమైన పదబంధం
  choice: ప్రధాన పాఠంలో ‘గాయకుల గానానికి నాయకుడు’ అని ఇచ్చి, అనిశ్చితిని పాదసూచికలో తెలియజేయడం
  alternative: ‘మోయడాన్ని పర్యవేక్షించిన నాయకుడు,’ ‘గాయకుల మోయడపు నాయకుడు,’ లేదా ‘సంగీత నాయకుడు’
  rationale: మసొరేటిక్ పదబంధం అసాధారణంగా ఉండి అనేక విధాలుగా అర్థం చేసుకోవచ్చు; చదవదగిన పాఠంతో పాటు నిజమైన మూలభాషా అనిశ్చితిని వెల్లడించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఊరేగింపు మరియు ఆరాధనా సందర్భానికి తగిన ‘మందసం,’ ‘ఏఫోదు’ వంటి నిర్దిష్ట పదాలను నిలిపి, తెలియని సిద్ధాంతార్థాలను చేర్చలేదు.
