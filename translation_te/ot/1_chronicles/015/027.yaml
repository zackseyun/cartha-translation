revisions:
- from: దావీదు సన్నని నారతో చేసిన అంగీ ధరించి ఉన్నాడు. అలాగే మందసాన్ని మోస్తున్న లేవీయులందరూ, గాయకులు, గాయకుల గానానికి నాయకుడైన కనన్యా[a] కూడా అలాంటి అంగీలు ధరించి ఉన్నారు. దావీదు నార ఏఫోదు కూడా ధరించి ఉన్నాడు.
  to: దావీదు మెత్తని నారతో చేసిన పైవస్త్రం ధరించి ఉన్నాడు. మందసాన్ని మోస్తున్న లేవీయులందరూ, గాయకులు, మోయు బాధ్యతకు అధిపతియైన కనన్యా కూడా అలానే ధరించి ఉన్నారు.[a] దావీదు నార ఏఫోదు కూడా ధరించి ఉన్నాడు.
  rationale: మַשָּׂא (‘మోయడం/మోయు బాధ్యత’) భావాన్ని ప్రధాన పాఠంలో నిలిపి, అసాధారణమైన హీబ్రూ వాక్యనిర్మాణానికి సాధ్యమైన సంగీత-సంబంధిత అర్థాలను పాదసూచికలో ఉంచాం. మూలంలో లేని అదనపు నిర్దిష్టతను తొలగించి, బּוּץ‌ను ‘మెత్తని నార’గా సవరించాం. ఏఫోదును ప్రత్యేక వస్త్రనామంగానే ఉంచాం.
