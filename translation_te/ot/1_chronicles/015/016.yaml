translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. ప్రాచీన తంతివాయిద్యాల మధ్య మూలంలో ఉన్న భేదాన్ని కాపాడేందుకు ‘హార్పులు’, ‘లైర్లు’ అనే వేరువేరు పేర్లు వాడబడ్డాయి. చివరి పదబంధంలోని ‘స్వరం/ధ్వని’ అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి రెండింటిలోనూ కాపాడాం.
