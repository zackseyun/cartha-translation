  text: וַ/יֹּ֣אמֶר דָּוִיד֮ לְ/שָׂרֵ֣י הַ/לְוִיִּם֒ לְ/הַֽעֲמִ֗יד אֶת אֲחֵי/הֶם֙ הַ/מְשֹׁ֣רְרִ֔ים בִּ/כְלֵי שִׁ֛יר נְבָלִ֥ים וְ/כִנֹּר֖וֹת וּ/מְצִלְתָּ֑יִם מַשְׁמִיעִ֥ים לְ/הָרִֽים בְּ/ק֖וֹל לְ/שִׂמְחָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: te
  text: అప్పుడు దావీదు లేవీయుల నాయకులకు తమ సహోదరులైన[a] గాయకులను సంగీత వాయిద్యాలతో—హార్పులు, లైర్లు, తాళాలతో—ధ్వని వినిపిస్తూ, ఆనందం కోసం స్వరమెత్తేలా[b] నియమించాలని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తమ సహోదరులు” అంటే వారి తోటి లేవీయులు.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఆనందం కోసం స్వరంతో ఎత్తేలా.” హీబ్రూలో అక్షరార్థంగా, “ఆనందం కోసం స్వరంతో ఎత్తడం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు దావీదు ... చెప్పాడు
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి ఆజ్ఞార్థక భావానికి ‘చెప్పాడు’ సహజంగా సరిపోతుంది.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: లేవీయుల నాయకులతో
  rationale: שָׂרִים పరిపాలనా బాధ్యతగల నాయకులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకులు’ స్పష్టంగా ఉంది.
- source_word: לְהַעֲמִיד
  choice: నియమించమని
  rationale: హిఫిల్ రూపానికి ‘నిలబెట్టడం’, ‘స్థానంలో ఉంచడం’, ‘నియమించడం’ అనే భావాలు ఉన్నాయి; ఆలయ సంగీత సేవను క్రమబద్ధం చేసే సందర్భంలో ‘నియమించడం’ సహజం.
- source_word: אֶת אֲחֵיהֶם
  choice: తమ సహోదరులైన
  rationale: మూలంలోని బంధుత్వ పదాన్ని నిలుపుతూ, అది నాయకుల తోటి లేవీయులను సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేయబడింది.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులను
  rationale: ఈ కృదంతం సాధారణ సంగీతకారులకన్నా ప్రత్యేకంగా పాడేవారిని సూచిస్తుంది.
- source_word: בִּכְלֵי שִׁיר
  choice: సంగీత వాయిద్యాలతో
  rationale: ‘పాటకు సంబంధించిన పరికరాలు’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נְבָלִים
  choice: హార్పులు
  rationale: ప్రాచీన వాయిద్యం యొక్క ఖచ్చితమైన నిర్మాణం వివాదాస్పదమైనప్పటికీ, נֶבֶל‌కు సాధారణంగా గుర్తింపుపొందిన సమీప వాయిద్యపేరు ఇది.
- source_word: וְכִנֹּרוֹת
  choice: లైర్లు
  rationale: כִּנּוֹר‌ను సాధారణంగా లైర్‌గా గుర్తిస్తారు; נֶבֶל‌తో ఉన్న భేదాన్ని ఈ పదం నిలుపుతుంది.
- source_word: וּמְצִלְתָּיִם
  choice: తాళాలతో
  rationale: ఈ పదం ఒకదానికొకటి తాకించి మోగించే లోహ తాళాలను సూచిస్తుంది; తెలుగులో ‘తాళాలు’ సహజమైన వాయిద్యపదం.
- source_word: מַשְׁמִיעִים
  choice: గట్టిగా మోగిస్తూ
  rationale: హిఫిల్ కృదంతం ‘వినిపించేటట్లు చేయడం’ అనే భావాన్ని ఇస్తుంది; వాయిద్యాల సందర్భంలో ‘గట్టిగా మోగిస్తూ’ ఆ బహిరంగ, స్పష్టమైన శబ్దాన్ని సహజంగా తెలుపుతుంది.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: ఆనందంతో స్వరమెత్తడానికి
  rationale: ‘ఆనందం కోసం/ఆనందంతో శబ్దం లేదా స్వరం ఎత్తడం’ అనే హీబ్రూ వ్యక్తీకరణను, ‘పాటలు’ అని మూలంలో లేని కర్మను చేర్చకుండా, దగ్గరగా మరియు సహజంగా అందిస్తుంది.
