  text: וּ/מַתִּתְיָ֣הוּ וֶ/אֱלִֽיפְלֵ֗הוּ וּ/מִקְנֵיָ֨הוּ֙ וְ/עֹבֵ֣ד אֱדֹ֔ם וִֽ/יעִיאֵ֖ל וַ/עֲזַזְיָ֑הוּ בְּ/כִנֹּר֥וֹת עַל הַ/שְּׁמִינִ֖ית לְ/נַצֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: te
  text: మత్తిత్యాహు, ఎలీఫెలేహు, మిక్నేయాహు, ఓబేద్-ఎదోము, యెయీయేలు, అజజ్యాహు—వీరు షెమీనీత్[a] ప్రకారం కిన్నోరు తంతివాద్యాలతో సంగీతానికి నాయకత్వం వహించవలసినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎనిమిదవదానిపై’ లేదా ‘దిగువ స్వరస్థాయిలో.’ ‘షెమీనీత్’ అనే హీబ్రూ సంగీత పదానికి ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: మత్తిత్యాహు
  rationale: హీబ్రూ వ్యక్తిపేరును, చివరి -యాహు భాగంతో సహా, తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֱלִיפְלֵהוּ
  choice: ఎలీఫెలేహు
  rationale: హీబ్రూ రూపంలోని పూర్తి -హు ముగింపును నిలుపుతూ వ్యక్తిపేరును లిప్యంతరీకరించాం.
- source_word: מִקְנֵיָהוּ
  choice: మిక్నేయాహు
  rationale: పేరులోని చివరి దైవనామ సంబంధిత -యాహు భాగాన్ని సంక్షిప్తం చేయకుండా హీబ్రూ రూపాన్ని అనుసరించాం.
- source_word: עֹבֵד אֱדֹם
  choice: ఓబేద్-ఎదోము
  rationale: రెండు భాగాలున్న వ్యక్తిపేరును చదవడానికి స్పష్టంగా ఉండేలా హైఫన్‌తో లిప్యంతరీకరించాం.
- source_word: יעִיאֵל
  choice: యెయీయేలు
  rationale: సంప్రదాయ ఆంగ్ల రూపాన్ని ఆధారంగా చేసుకోకుండా, హీబ్రూ పేరులోని ధ్వనులను తెలుగులో సాధ్యమైనంత దగ్గరగా ప్రతిబింబించాం.
- source_word: עֲזַזְיָהוּ
  choice: అజజ్యాహు
  rationale: హీబ్రూ వ్యక్తిపేరును చివరి -యాహు భాగంతో సహా లిప్యంతరీకరించాం.
- source_word: בְּכִנֹּרוֹת
  choice: కిన్నోరు వాద్యాలతో
  rationale: כִּנּוֹר ఒక నిర్దిష్ట ప్రాచీన తంతివాద్యం. దానిని ఆధునిక ‘వీణ’ లేదా ‘హార్పు’తో ఖచ్చితంగా సమానం చేయకుండా, మూలపదాన్ని లిప్యంతరీకరించి ‘వాద్యాలతో’ అని స్పష్టం చేశాం; בְּ ఇక్కడ సాధనార్థకంగా ఉంది.
- source_word: עַל הַשְּׁמִינִית
  choice: షెమీనీత్ ప్రకారం
  rationale: ఇది ఖచ్చితమైన అర్థం తెలియని సంగీత సాంకేతిక పదబంధం. అందువల్ల ఊహాత్మకంగా అర్థాన్ని నిర్ణయించకుండా హీబ్రూ పదాన్ని లిప్యంతరీకరించాం; עַל‌ను ఈ సందర్భంలో ‘ప్రకారం’గా ఇచ్చాం.
- source_word: לְנַצֵּחַ
  choice: సంగీతాన్ని నడిపించాలి
  rationale: సంగీత సందర్భంలో ఈ క్రియ పర్యవేక్షించడం, నిర్దేశించడం లేదా నాయకత్వం వహించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండేందుకు, సందర్భాన్ని స్పష్టం చేస్తూ ‘సంగీతాన్ని నడిపించాలి’ అని అనువదించాం.
