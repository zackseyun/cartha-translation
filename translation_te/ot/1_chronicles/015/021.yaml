  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణాన్ని వాడాం. ప్రాచీన వాద్యం మరియు అనిశ్చిత సంగీత సూచనకు సంబంధించిన మూలభాషా ప్రత్యేకతను లిప్యంతరీకరణ ద్వారా నిలిపాం.
