    text: లేదా, “మోతకర్రలు వారి భుజాలపై ఆనివుండగా.” హీబ్రూ పదబంధం మందసాన్ని మోస్తున్నవారి భుజాలపై మోతకర్రలు ఉన్నాయని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision makes the pole-and-shoulder relationship explicit in idiomatic Telugu, while retaining the Hebrew’s core wording and the supplied footnote’s lexical clarification. It also changes the divine name to “యాహ్వే” to conform to the stated POB audit-trail choice. No doctrinal interpretation has been added.
