source:
  edition: WLC
  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: te
  text: లేవీయుల కుమారులు యాహ్వే మాట ప్రకారం మోషే ఆజ్ఞాపించినట్లే, మోతకర్రలను తమ భుజాలపై ఉంచుకొని దేవుని మందసాన్ని మోశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోతకర్రలు వారి భుజాలపై ఆనివుండగా.” హీబ్రూ పదబంధం మందసాన్ని మోస్తున్నవారి భుజాలపై మోతకర్రలు ఉన్నాయని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: మోశారు
  rationale: ఈ సందర్భంలో נשׂא మందసాన్ని ఎత్తడం మాత్రమే కాకుండా దానిని మోసుకొని వెళ్లడాన్ని సూచిస్తుంది; ‘మోశారు’ సహజమైన, సందర్భోచితమైన తెలుగు.
- source_word: בְנֵי הַלְוִיִּם
  choice: లేవీయుల కుమారులు
  rationale: హీబ్రూ వచనంలోని ‘లేవీయుల కుమారులు’ అనే పుత్రసంబంధ గోత్ర వ్యక్తీకరణను సంక్షిప్తంగా ‘లేవీయులు’ అని మార్చకుండా నిలుపుతుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: మూలంలో ఉన్నది ‘దేవుని మందసం’ మాత్రమే; ఇక్కడ లేని ‘నిబంధన’ అనే పదాన్ని చేర్చలేదు.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: మోషే ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר తెలిపే సరిగ్గా అనుసరించిన భావాన్ని ‘ఆజ్ఞాపించినట్లే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా మాట ప్రకారం
  rationale: דבר యొక్క ‘మాట’ భావాన్ని నిలుపుతూ, మోషే ఆజ్ఞ దైవిక వాక్కుకు అనుగుణమని తెలియజేస్తుంది; יהוהను వ్యక్తినామమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: בִּכְתֵפָם
  choice: తమ భుజాల మీద
  rationale: మోసే స్థానం మరియు ఆధారాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది; ‘తమ’ కర్తలైన లేవీయుల కుమారులకే భుజాలు చెందినవని సూచిస్తుంది.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: మోతకర్రలు వారిపై ఉండగా
  rationale: మందసాన్ని మోసే కర్రలు వారి భుజాలపై ఉన్నాయనే మూల నిర్మాణాన్ని అతిగా వివరణాత్మకం చేయకుండా నిలుపుతుంది; సంబంధంలోని స్వల్ప అస్పష్టతను పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: వచనంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపం ‘యెహోవా’ను వాడటం ద్వారా దానిని బిరుదుగా మార్చకుండా నిలిపాం.
- issue: בְנֵי הַלְוִיִּם లోని లింగసూచక గోత్రపరమైన పదబంధం
  choice: లేవీయుల కుమారులు
  alternative: లేవీయులు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ బహువచన పుత్రసంబంధ వ్యక్తీకరణను సామాన్య సమూహనామంగా సమతలీకరించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని అనుసరించాం. ‘మందసం,’ ‘మోతకర్రలు’ వంటి పదాలు ఆరాధనా సామగ్రి సందర్భానికి సరిపోతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. మూలంలోని క్రమాన్ని పూర్తిగా యాంత్రికంగా అనుసరించకుండా, ‘యెహోవా మాట ప్రకారం మోషే ఆజ్ఞాపించినట్లే’ అని తెలుగుకు సహజమైన అనుసంధానంతో ఇచ్చాం.
