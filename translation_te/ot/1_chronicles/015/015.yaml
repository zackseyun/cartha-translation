revisions:
- from: లేవీయుల కుమారులు దేవుని మందసాన్ని తమ భుజాల మీద, మోతకర్రలు వారిపై ఉండగా[a], యెహోవా మాట ప్రకారం మోషే ఆజ్ఞాపించినట్లే మోశారు.
  to: లేవీయుల కుమారులు యాహ్వే మాట ప్రకారం మోషే ఆజ్ఞాపించినట్లే, మోతకర్రలను తమ భుజాలపై ఉంచుకొని దేవుని మందసాన్ని మోశారు.[a]
  rationale: The revision makes the pole-and-shoulder relationship explicit in idiomatic Telugu, while retaining the Hebrew’s core wording and the supplied footnote’s lexical clarification. It also changes the divine name to “యాహ్వే” to conform to the stated POB audit-trail choice. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:37:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the Levites’ filial/tribal designation, “ark of God,” shoulder-borne transport by poles, Moses’ command, and its conformity to Yahweh’s word. However, “మోతకర్రలు వారిపై ఉండగా” is referentially unclear in Telugu: the Hebrew construction locates the poles on the bearers’ shoulders, not generically “upon them.” The divine name should also align with the supplied source/audit-trail decision, Yahweh.'
  naturalness: The sentence is generally intelligible, but “మోతకర్రలు వారిపై ఉండగా” is awkward and may suggest that poles were merely on the people rather than resting on their shoulders. Reordering the clauses and using “తమ భుజాలపై ఉంచుకొని” is natural modern standard Telugu while conveying the transport method.
  terminology: “లేవీయుల కుమారులు,” “దేవుని మందసం,” and “మోషే” are appropriate. “యాహ్వే” is preferred here over “యెహోవా,” because the specified English POB audit trail explicitly renders יהוה as “Yahweh.” “మోతకర్రలు” is suitable for the ark’s carrying poles.
  issues:
  - severity: medium
    issue: The divine name is rendered “యెహోవా” rather than “యాహ్వే.”
    rationale: The supplied original-language/theological decision and English POB text specify “Yahweh.” Using “యాహ్వే” maintains audit-trail consistency and represents the Tetragrammaton as a name rather than a title.
  - severity: medium
    issue: “మోతకర్రలు వారిపై ఉండగా” is ambiguous and stylistically unnatural.
    rationale: The Hebrew phrase בִּכְתֵפָם בַּמֹּטוֹת עֲלֵיהֶם portrays the poles as resting on the carriers’ shoulders. Explicitly naming the shoulders in Telugu removes an unintended ambiguity without adding meaning.
  revised_text: లేవీయుల కుమారులు యాహ్వే మాట ప్రకారం మోషే ఆజ్ఞాపించినట్లే, మోతకర్రలను తమ భుజాలపై ఉంచుకొని దేవుని మందసాన్ని మోశారు.[a]
  revised_footnotes:
