  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: te
  text: అప్పుడు యాజకులూ లేవీయులూ ఇశ్రాయేలు దేవుడైన యాహ్వే మందసాన్ని పైకి తీసుకురావడానికి తమను తాము పవిత్రం చేసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తమను తాము ప్రతిష్ఠించుకున్నారు.”'
    reason: קדשׁ హిత్పయేల్ రూపాన్ని ఆచారపరమైన పవిత్రీకరణగా లేదా పవిత్ర సేవకు ప్రతిష్ఠించుకోవడంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: తమను తాము పవిత్రం చేసుకున్నారు
  rationale: קדשׁ హిత్పయేల్ రూపం పవిత్ర సేవ కోసం తమను తాము సిద్ధపరచుకొని శుద్ధి చేసుకోవడాన్ని సూచిస్తుంది. ఈ అనువాదం ఆత్మవాచక భావాన్నీ ఆచారపరమైన పవిత్రతనూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలో כהניםకు ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וְהַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన సేవకులను సూచించే לויםకు స్థిరపడిన తెలుగు రూపం.
- source_word: לְהַעֲלוֹת
  choice: పైకి తీసుకురావడానికి
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే దిశాత్మక భావాన్ని నిలుపుతూ, మోసుకెళ్లిన నిర్దిష్ట విధానాన్ని అవసరానికి మించి చెప్పదు.
- source_word: אֶת אֲרוֹן
  choice: మందసాన్ని
  rationale: ఈ ఆరాధనా సందర్భంలో ארון దేవుని నిబంధన మందసాన్ని సూచిస్తుంది; ‘మందసం’ స్థిరపడిన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో చూపి, యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సెక్యూటివ్‌లోని కథన కొనసాగింపును ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని కారణార్థక ‘కాబట్టి’ని బలవంతంగా చేర్చదు.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ సంప్రదాయ రూపమైనప్పటికీ హీబ్రూ నామానికి తక్కువ ప్రత్యక్షమైన లిప్యంతరీకరణ.
- issue: וַיִּתְקַדְּשׁוּలోని పవిత్రత భావం
  choice: తమను తాము పవిత్రం చేసుకున్నారు
  alternative: తమను తాము ప్రతిష్ఠించుకున్నారు
  rationale: ఆచారపరమైన సిద్ధత మరియు పవిత్రత రెండింటినీ నిలుపుతూ, వ్యక్తులు తమపై తామే చేసిన చర్య అనే హిత్పయేల్ భావాన్ని స్పష్టంగా చూపుతుంది; కేవలం అధికారిక నియామకం అనే భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో పాటు ఆరాధనా సందర్భానికి తగిన గౌరవప్రద పదజాలం వాడబడింది. సంయుక్త కర్తకు సహజంగా ‘యాజకులూ లేవీయులూ’ రూపం ఉపయోగించబడింది.
