  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
translation:
  language: te
  text: 'మెరారి కుమారుల విషయానికి వస్తే: ప్రధానుడైన అసాయా, అతని సహోదరులు[a] 220 మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని వంశానికి చెందిన పురుషులు’; హీబ్రూ పదం ఒకే కుటుంబం లేదా వంశానికి చెందిన పురుషులను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי מְרָרִי
  choice: మెరారి కుమారులలో
  rationale: ל ఉపసర్గ జాబితాలో తదుపరి వంశవర్గాన్ని పరిచయం చేస్తోంది. తెలుగులో ‘కుమారులలో’ అనేది జాబితా నిర్మాణాన్ని సహజంగా తెలియజేస్తూ, ‘కుమారులు’ అనే వంశపరమైన ప్రయోగాన్ని నిలుపుతుంది.
- source_word: עֲשָׂיָה
  choice: అసాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో అందించాం.
- source_word: הַ/שָּׂר
  choice: ప్రధానుడైన
  rationale: שַׂר ఇక్కడ వంశబృందానికి గుర్తింపు పొందిన నాయకుడు లేదా అధిపతిని సూచిస్తుంది; రాజకుమారుడు అనే భావాన్ని అనవసరంగా రాకుండా ‘ప్రధానుడు’ ఎంచుకున్నాం.
- source_word: וְ/אֶחָי/ו
  choice: అతని సహోదరులు
  rationale: אָח యొక్క ప్రత్యక్ష అర్థమైన పురుష సహోదరులను నిలుపుతూ, ఈ సందర్భంలో విస్తృత వంశబంధువులను కూడా సూచించగల అర్థసంభావ్యతను పాదసూచికలో తెలిపాం.
- source_word: מָאתַיִם וְ/עֶשְׂרִים
  choice: 220 మంది
  rationale: హీబ్రూ సంఖ్యను ఆధునిక పఠన సౌలభ్యం కోసం అంకెలలో ఇచ్చి, వ్యక్తుల లెక్క అని స్పష్టపడేందుకు ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని, గౌరవప్రదమైన బైబిలు వచన ధోరణిని నిలిపాం. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికకు సరిపోతుంది.
