id: 1CH.15.29
reference: 1 Chronicles 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: te
  text: యాహ్వే నిబంధన మందసం దావీదు నగరానికి వచ్చినప్పుడు, సౌలు కుమార్తె మీకాలు కిటికీలోనుంచి చూసి, రాజైన దావీదు నాట్యం చేస్తూ ఉల్లాసంగా ఆడుతుండడాన్ని చూసి, తన హృదయంలో అతణ్ణి తృణీకరించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ నిర్మాణంలోని ‘మందసం—నిబంధన—యాహ్వే’ సంబంధాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించి వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: దావీదు నగరానికి వస్తున్నప్పుడు
  rationale: వాక్యారంభంలోని וַיְהִי మరియు ప్రస్తుత కృదంతమైన בָּא కలిసి ఊరేగింపు నగరానికి చేరుకుంటున్న నేపథ్యాన్ని సూచిస్తాయి; ప్రవేశం పూర్తయిందని అతిగా నిర్దిష్టం చేయదు.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: సౌలు కుమార్తె మీకాలు
  rationale: ఆమెను సౌలు కుమార్తెగా గుర్తించడంలో కథన ఉద్దేశాన్ని నిలుపుతూ సహజమైన తెలుగు పదక్రమాన్ని వాడుతుంది.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: కిటికీలోనుంచి చూసింది
  rationale: కిటికీ గుండా బయటకు లేదా కిందికి చూడడమనే భావాన్ని సహజంగా తెలుపుతుంది; దిశను అనవసరంగా నిర్ధారించదు.
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: రాజైన దావీదును ... చూసి
  rationale: హీబ్రూ బిరుదు-పేరు సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְרַקֵּד
  choice: నాట్యం చేస్తూ
  rationale: ఉత్సాహభరితమైన నృత్య కదలికను సందర్భానుగుణంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּמְשַׂחֵק
  choice: ఉల్లాసంగా ఆడడం
  rationale: שׂחק లోని ఆడటం/ఉల్లాసించడం అనే భావవిస్తృతిని కేవలం ‘వేడుక చేసుకోవడం’గా సన్నగిల్లకుండా నిలుపుతుంది.
- source_word: וַתִּבֶז לוֹ
  choice: అతణ్ణి తృణీకరించింది
  rationale: בזה సూచించే బలమైన ధిక్కారం లేదా అలక్ష్యాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּלִבָּהּ
  choice: తన హృదయంలో
  rationale: ఆమె ధిక్కారం అంతర్గతమైనదని తెలిపే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ఆధునికంగా ఆమోదితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మందసం’ బైబిలు సందర్భంలో అర్థమయ్యే సాంప్రదాయ పదంగా ఉంచబడింది. మూలంలోని రెండు చర్యలు—నాట్యం చేయడం, ఉల్లాసంగా ఆడడం—వేరువేరుగా నిలుపబడ్డాయి.
