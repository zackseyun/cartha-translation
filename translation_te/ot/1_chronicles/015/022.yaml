id: 1CH.15.22
reference: 1 Chronicles 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: te
  text: లేవీయుల ప్రధానుడు కెనన్యాహు మోయే పనిని[a] పర్యవేక్షించాడు; ఎందుకంటే అతడు మోయడంలో[b] నిపుణుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాటల విషయంలో పర్యవేక్షణ చేశాడు; ఎందుకంటే అతడు సంగీతంలో నిపుణుడు.” מַשָּׂא అనే హీబ్రూ పదానికి సాధారణంగా “భారం” లేదా “మోయడం” అని అర్థం. అయితే సమీప వచనాల్లో గాయకులు, వాద్యకారులు ప్రస్తావించబడినందున కొందరు ఇక్కడ దాన్ని సంగీతార్థంలో తీసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో “మోయే పనిలో … మోయే పనిలో” అని ఒకే నామవాచకం రెండుసార్లు వస్తుంది. తెలుగులో సహజంగా ఉండేందుకు రెండోసారి “మోయడంలో” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: కెనన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: שַׂר הַלְוִיִּם
  choice: లేవీయుల అధిపతి
  rationale: ఆరాధనా సంబంధమైన ఈ సందర్భంలో שַׂר నాయకత్వం లేదా పర్యవేక్షణ బాధ్యతగల అధికారిని సూచిస్తుంది; ‘అధిపతి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: בְּמַשָּׂא
  choice: మోసే పనిని
  rationale: מַשָּׂא సాధారణంగా ‘భారం’ లేదా ‘మోయడం’ అనే అర్థం ఇస్తుంది. మందసాన్ని తరలించే సమీప సందర్భంలో ‘మోసే పని’ సహజమైన ప్రధాన పఠనం.
- source_word: יָסֹר
  choice: నిర్దేశించాడు
  rationale: ఈ క్రియ బోధించడం, దిశానిర్దేశం చేయడం లేదా పర్యవేక్షించడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ ‘నిర్దేశించాడు’ అతని క్రియాశీల నాయకత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵבִין הוּא
  choice: అతడు ... నిపుణుడు
  rationale: בין ధాతువులోని ఈ రూపం ఇక్కడ కేవలం అవగాహనకన్నా పనిలో ప్రావీణ్యాన్ని సూచిస్తుంది; ‘నిపుణుడు’ ఆ ఆచరణాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: מַשָּׂא అనే పదాన్ని మోయడంగా తీసుకోవాలా, సంగీతార్థంలో పాటగా తీసుకోవాలా
  choice: ప్రధాన వచనంలో ‘మోసే పని’
  alternative: ‘పాటలను నిర్దేశించాడు; అతడు సంగీతంలో నిపుణుడు’
  rationale: ఈ పదానికి సాధారణ హీబ్రూ అర్థం ‘భారం/మోయడం’; మందసాన్ని తరలించే కథన సందర్భం దానికి మద్దతిస్తుంది. అయితే చుట్టుపక్కల గాయకులు, వాద్యకారుల ప్రస్తావన ఉన్నందున సంగీతార్థాన్ని పాదటీపులో ఉంచి అసలులోని సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని నిలిపాం. హీబ్రూ పదపునరుక్తిని తెలుగులో భావపునరుక్తిగా ఇచ్చి, దాని రూపాన్ని పాదటీపులో తెలిపాం.
