  rationale: కెనన్యాహు అనే పేరును మూల హీబ్రూ రూపానికి దగ్గరగా సవరించాం. బְּמַשָּׂאతో కూడిన יָסֹרను ‘మోయే పనిని పర్యవేక్షించాడు’గా ఇచ్చి, అధికంగా నిర్దిష్టీకరించకుండా పర్యవేక్షణ/నిర్దేశక భావాన్ని నిలిపాం. మַשָּׂאకు ఉన్న సంగీతార్థ ప్రత్యామ్నాయం పాదటీపులోనే ఉంది; ప్రధాన పాఠం కథన సందర్భానికి సరిపోయే మోయడమే. రెండవ మַשָּׂא పునరుక్తిని తెలుగులో సహజంగా ‘మోయడంలో’గా ఇచ్చి పాదటీపులో వివరించాం.
