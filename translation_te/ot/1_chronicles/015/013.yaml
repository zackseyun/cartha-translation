  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: te
  text: మొదటిసారి మీరు లేకపోవడం వల్ల మన దేవుడైన యెహోవా మన మీద విరుచుకుపడ్డాడు. ఎందుకంటే మనం నిర్దేశించిన విధానం ప్రకారం ఆయనను వెదకలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్దేశించిన నియమం ప్రకారం మనం ఆయనను విచారించలేదు.” హీబ్రూ వాక్యారంభం సంక్షిప్తంగా ఉంది; సందర్భానుసారం, మొదటి ప్రయత్నంలో లేవీయులు మందసాన్ని మోయడంలో పాల్గొనలేదనే భావం ఉండవచ్చు. దానిని, “మొదట మన దేవుడైన యెహోవా మనపై చీలిక కలిగించాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: మొదటిసారి మీరు అక్కడ లేకపోవడం వల్లనే
  rationale: హీబ్రూ వాక్యారంభం సంక్షిప్తంగా, అధ్యాహారంగా ఉంది. సందర్భంలో దావీదు లేవీయులతో మాట్లాడుతున్నందున, మందసాన్ని మొదట తీసుకురావడానికి చేసిన ప్రయత్నంలో వారు పాల్గొనకపోవడమే భావంగా కనిపిస్తుంది. ‘అక్కడ’ అనే పదాన్ని చేర్చడం ఈ అంతర్భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
- source_word: פָּרַץ
  choice: విరుచుకుపడ్డాడు
  rationale: దేవుడు కర్తగా, ‘మన మీద’ కర్మసంబంధ ప్రయోగంగా ఉన్నప్పుడు ఈ క్రియ ఆకస్మికంగా సంభవించిన తీవ్రమైన తీర్పును సూచిస్తుంది. ‘విరుచుకుపడ్డాడు’ ఆధునిక తెలుగులో ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన ప్రత్యయాన్ని సహజమైన తెలుగులో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בָּנוּ
  choice: మన మీద
  rationale: తీర్పు సందర్భంలో פָּרַץ క్రియతో కలిసి, దేవుని చర్య తమకు ప్రతికూలంగా సంభవించిందనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דְרַשְׁנֻהוּ
  choice: ఆయనను వెదకలేదు
  rationale: דרשׁ అనే క్రియకు ‘వెదకు, విచారించు, సంప్రదించు’ అనే భావాలు ఉన్నాయి. ఇక్కడ ‘వెదకలేదు’ అనే రూపం ఆరాధనలో దేవుని సరిగా ఆశ్రయించడమనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כַּמִּשְׁפָּט
  choice: నియమించిన విధానం ప్రకారం
  rationale: మందసాన్ని మోసే విషయంలో నిర్దేశించబడిన నియమబద్ధమైన పద్ధతిని సూచిస్తుంది. ఈ అనువాదం న్యాయపరమైన భావాన్ని ఉంచుతూనే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: వాక్యారంభంలో అధ్యాహారంగా ఉన్న భావం
  choice: మొదటి ప్రయత్నంలో లేవీయులు అక్కడ లేకపోవడాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేయడం
  alternative: ‘మొదటిసారి మీరు కాకపోవడం వల్ల’ లేదా ‘మొదట మన దేవుడైన యెహోవా మన మధ్య చీలిక కలిగించాడు’
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉన్నప్పటికీ, 12–15 వచనాల సందర్భం మందసాన్ని లేవీయులే మోయాల్సిందని చూపుతుంది. ప్రధాన పాఠ్యం సందర్భసిద్ధమైన భావాన్ని ఇస్తుంది; హీబ్రూలోని అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- issue: פָּרַץలో దైవిక చర్య స్వభావం
  choice: యెహోవా మన మీద విరుచుకుపడ్డాడు
  alternative: యెహోవా మన మధ్య చీలిక కలిగించాడు
  rationale: ఉజ్జాపై వచ్చిన ఆకస్మిక దైవిక తీర్పు తీవ్రతను ఈ రూపం నిలుపుతుంది; అదే సమయంలో మూలంలోని రూపకాన్ని సిద్ధాంతపరంగా మరింత వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. దైవనామానికి ‘యెహోవా’ వాడబడింది. మూలంలోని సంక్షిప్తత వల్ల కలిగిన నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో సందర్భానుసారంగా అనువదించి, పాదసూచికలో ప్రత్యామ్నాయ పఠనంగా భద్రపరిచాం.
