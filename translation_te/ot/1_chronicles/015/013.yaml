revisions:
- from: మొదటిసారి మీరు అక్కడ లేకపోవడం వల్లనే[a] మన దేవుడైన యెహోవా మన మీద విరుచుకుపడ్డాడు. ఎందుకంటే మనం నియమించిన విధానం ప్రకారం ఆయనను వెదకలేదు.[b]
  to: మొదటిసారి మీరు లేకపోవడం వల్ల మన దేవుడైన యెహోవా మన మీద విరుచుకుపడ్డాడు. ఎందుకంటే మనం నిర్దేశించిన విధానం ప్రకారం ఆయనను వెదకలేదు.[a]
