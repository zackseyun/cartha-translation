  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: te
  text: 'అప్పుడు దావీదు ఇలా అన్నాడు[a]: “లేవీయులు తప్ప మరెవరూ దేవుని మందసాన్ని మోయకూడదు. ఎందుకంటే యెహోవా తన మందసాన్ని మోయడానికి, ఎల్లకాలం తనకు పరిచర్య చేయడానికి[b] వారినే ఎన్నుకున్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వాక్యం సంక్షిప్తంగా ఉండి, కర్తను స్పష్టంగా చెప్పదు. అందువల్ల దీన్ని, “దేవుని మందసాన్ని లేవీయులు తప్ప మరెవరూ మోయకూడదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “తనకు పరిచర్య చేయడానికి” అనే మాటను “తనకు సేవ చేయడానికి” అని కూడా అనువదించవచ్చు. హెబ్రీ క్రియ ఇక్కడ పవిత్రమైన లేదా ఆరాధనా సంబంధమైన సేవను సూచించవచ్చు. ‘తనకు’ అనేది యెహోవాను సూచించడం అత్యంత సహజం; సందర్భం వల్ల మందసం ఎదుట చేసే పరిచర్య భావం కూడా అనుబంధంగా ఉండవచ్చు.
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: మునుపటి సంఘటనల తరువాతి క్రమాన్ని సూచించే సహజమైన తెలుగు కథన సంధాన పదం.
- source_word: אָמַר דָּוִיד
  choice: దావీదు ఇలా అన్నాడు
  rationale: హెబ్రీ కథనంలోని సాధారణ వాక్యప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: లేవీయులు తప్ప మరెవరూ దేవుని మందసాన్ని మోయకూడదు
  rationale: హెబ్రీలో కర్త స్పష్టంగా చెప్పని సంక్షిప్త నిర్మాణం ఉంది. తెలుగులో అవసరమైన ‘మరెవరూ’ని చేర్చి, లేవీయులకు మాత్రమే ఉన్న బాధ్యతను స్పష్టంగా ఉంచింది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ఆరాధనకు సంబంధించిన ఈ పవిత్ర వస్తువుకు ‘మందసం’ స్థిరమైన, గౌరవప్రదమైన తెలుగు బైబిలు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: ఇశ్రాయేలు గోత్ర సంబంధిత సమూహానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: ఎందుకంటే యెహోవా ... వారినే ఎన్నుకున్నాడు
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది; בָם లోని ప్రత్యేక ఉద్ఘాటనను ‘వారినే’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించింది.
- source_word: לָשֵׂאת
  choice: మోయడానికి
  rationale: ఈ సందర్భంలో మందసాన్ని భౌతికంగా మోసే కార్యాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן יְהוָה
  choice: తన మందసం
  rationale: యెహోవా వాక్యంలోని కర్తగా ఉన్నందున తెలుగు ప్రతిబింబ సర్వనామం సహజంగా సంబంధాన్ని తెలియజేస్తుంది; మూలంలోని ‘యెహోవా మందసం’ భావం నిలుస్తుంది.
- source_word: וּלְשָׁרְתוֹ
  choice: తనకు పరిచర్య చేయడానికి
  rationale: שרת ఇక్కడ లేవీయుల పవిత్ర/ఆరాధనా సేవను సూచిస్తుంది; ‘పరిచర్య’ ఆ ప్రత్యేక భావాన్ని సాధారణ ‘సేవ’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: ఎల్లకాలం
  rationale: నిరంతరమైన నియామకాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וּלְשָׁרְתוֹ లోని ఏకవచన పురుష ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ‘తనకు పరిచర్య చేయడానికి’—ఇక్కడ ‘తనకు’ యెహోవాను సూచిస్తుంది.
  alternative: మందసం ఎదుట లేదా దాని సమక్షంలో పరిచర్య చేయడం అని సందర్భానుసారంగా అర్థం చేసుకోవచ్చు.
  rationale: సమీపంలోని వ్యక్తిగత పూర్వపదం యెహోవా; లేవీయుల పరిచర్యను యెహోవాకు చేసే పరిచర్యగా చెప్పడం హెబ్రీ ఆరాధనా సందర్భానికి సహజం. అయినప్పటికీ మందసంతో ఉన్న సందర్భ సంబంధాన్ని పాదసూచికలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వాక్య గౌరవాన్ని మరియు ఆరాధనా సందర్భాన్ని నిలుపుతూ రూపొందించబడింది. ‘మందసం,’ ‘లేవీయులు,’ ‘పరిచర్య’ వంటి స్థిరమైన బైబిలు పదాలను ఉపయోగించాం.
