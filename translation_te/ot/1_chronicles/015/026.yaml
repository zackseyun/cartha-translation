  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: te
  text: యెహోవా నిబంధన మందసాన్ని మోస్తున్న లేవీయులకు దేవుడు సహాయం చేసినప్పుడు, వారు ఏడు ఎద్దులను, ఏడు పొట్టేళ్లను బలిగా అర్పించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా నిబంధనకు చెందిన మందసాన్ని.”
    reason: ‘నిబంధన’ మరియు ‘యెహోవా’ మధ్యనున్న హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో మరో విధంగా అర్థవంతంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: సహాయం చేసినప్పుడు
  rationale: וַיְהִי తరువాత בְּ + infinitive construct కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తుంది; ‘సహాయం చేసినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: సందర్భంలో ఇది ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; హీబ్రూలో ఉన్న నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా చూపకుండా ‘దేవుడు’ అనడం సహజం.
- source_word: הַלְוִיִּם
  choice: లేవీయులకు
  rationale: గోత్ర/వర్గ నామానికి ప్రామాణిక తెలుగు రూపం; עזר తీసుకునే కర్మను తెలుగులో దత్తివిభక్తితో సహజంగా వ్యక్తం చేసింది.
- source_word: נֹשְׂאֵי
  choice: మోస్తున్న
  rationale: వర్తమాన కృదంతం ఆ సమయంలో కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది; ‘మోస్తున్న’ ఆ దురేటివ్ భావాన్ని నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం
  rationale: హీబ్రూ construct chain‌ను సహజమైన తెలుగు సంబంధ నిర్మాణంలో అందించింది. ‘మందసం’ పవిత్ర పెట్టెకు తెలుగు బైబిలు వాడుకలో స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో సూచించింది.
- source_word: וַיִּזְבְּחוּ
  choice: వారు ... బలిగా అర్పించారు
  rationale: క్రియ బహువచనంలో ఉంది. బలి సందర్భంలో ‘బలిగా అర్పించారు’ సహజమైన తెలుగు, cultic action‌ను స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁבְעָה פָרִים
  choice: ఏడు ఎద్దులను
  rationale: פָרִים బలి సందర్భంలో మగ పశువులను సూచిస్తుంది; ‘ఎద్దులు’ నేరుగా, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וְשִׁבְעָה אֵילִים
  choice: ఏడు పొట్టేళ్లను
  rationale: אֵילִים అంటే మగ గొర్రెలు; ‘పొట్టేళ్లు’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం. పునరుక్త సంఖ్యను మూలంలాగే నిలిపింది.
theological_decisions:
- issue: బలి అర్పించినవారి కర్త
  choice: వారు బలిగా అర్పించారు
  alternative: అతడు బలిగా అర్పించాడు
  rationale: וַיִּזְבְּחוּ మూడవ పురుష బహువచన క్రియ. కాబట్టి కర్తను దావీదు వంటి ఏకవచన వ్యక్తిగా మార్చకుండా, మూలంలోని వ్యాకరణ బహువచనాన్ని నిలిపింది; ‘వారు’ ఎవరెవరో మూలం స్పష్టంగా పరిమితం చేయనందున అనువాదమూ అలా చేయదు.
- issue: దైవనామం יהוה యొక్క ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇక్కడ వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా పేరుగా ప్రతిపాదించడం మూలరూప భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని కాలసంబంధ ఉపవాక్యం, కొనసాగుతున్న మోసే కార్యం, బహువచన బలి కర్త, రెండుసార్లు వచ్చే ‘ఏడు’ అన్నీ నిలుపబడ్డాయి.
