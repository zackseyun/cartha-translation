source:
  edition: WLC
  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: te
  text: దావీదు యాహ్వే మందసాన్ని దాని స్థలానికి పైకి తీసుకురావడానికి ఇశ్రాయేలీయులందరినీ యెరూషలేముకు సమకూర్చాడు. ఆ స్థలాన్ని అతడు దాని కోసం[a] సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కోసం.” హీబ్రూలో పుంలింగ ఏకవచన ప్రత్యయం ఉంది; సందర్భంలో అది మందసాన్ని సూచించడం అత్యంత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: సమకూర్చాడు
  rationale: קהל హిఫీల్ రూపం ప్రజలను ఒకచోట కూడేలా చేయడాన్ని సూచిస్తుంది. ‘సమకూర్చాడు’ అధికారిక సమాహార భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: ఇది ఇశ్రాయేలు సమాజమంతటినీ లేదా దాని ప్రతినిధుల సమగ్ర సమూహాన్ని సూచించే సామూహిక ప్రయోగం. తెలుగులో వ్యక్తులను ఉద్దేశించిన సందర్భానికి ఈ రూపం సహజంగా ఉంటుంది.
- source_word: אֶל־יְרוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: אֶל లోని దిశార్థాన్ని నేరుగా నిలుపుతూ, కూడడానికి గమ్యస్థానం యెరూషలేము అని తెలియజేస్తుంది.
- source_word: לְהַעֲלוֹת
  choice: పైకి తీసుకురావడానికి
  rationale: עלה యొక్క ‘పైకి తీసుకురావడం’ అనే దిశాత్మక భావాన్ని నిలుపుతుంది; కేవలం ‘తీసుకురావడం’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసాన్ని
  rationale: אֲרוֹן ను పవిత్ర నిబంధన పెట్టెకు తెలుగులో స్థిరమైన ‘మందసం’తో, יהוה ను బిరుదుతో భర్తీ చేయకుండా దైవనామం ‘యాహ్వే’గా అనువదించింది.
- source_word: אֶל־מְקוֹמוֹ
  choice: దాని స్థలానికి
  rationale: ‘స్థలం’కు జతైన ఏకవచన పుంలింగ ప్రత్యయం సందర్భంలో మందసాన్ని సూచిస్తుంది. తెలుగులో మందసం నపుంసకంగా ఉండడం వల్ల ‘దాని స్థలం’ సహజం.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: ఆ స్థలాన్ని అతడు దాని కోసం సిద్ధం చేశాడు
  rationale: సంబంధ వాక్యాన్ని స్పష్టమైన తెలుగు వాక్యంగా మలిచింది. הֵכִין లోని సిద్ధపరచడం మరియు ముందే జరిగిన క్రియ రెండూ సందర్భంలో నిలుస్తాయి; לוֹ లోని సాధ్యమైన ప్రత్యామ్నాయ సూచనను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన చతురక్షర నామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: לוֹ అనే ప్రత్యయం ఎవరిని సూచిస్తుంది
  choice: మందసం—‘దాని కోసం’
  alternative: యాహ్వే—‘ఆయన కోసం’
  rationale: సమీప సందర్భంలో మందసం మరియు దాని స్థలం ప్రధానంగా ఉన్నందున ‘దాని కోసం’ అత్యంత సహజం. అయినా హీబ్రూ పుంలింగ ప్రత్యయం వ్యాకరణపరంగా యాహ్వేను సూచించే అవకాశాన్ని పూర్తిగా తొలగించదు; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘పైకి తీసుకురావడానికి’ ద్వారా మూలంలోని దిశాత్మక భావం, ‘యెరూషలేముకు’ ద్వారా אֶל యొక్క గమ్యార్థం నిలుపబడ్డాయి. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి అనుకూలంగా రెండు తెలుగు వాక్యాలుగా విభజించాం.
