id: 1CH.15.7
reference: 1 Chronicles 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֖י גֵּרְשׁ֑וֹם יוֹאֵ֣ל הַ/שָּׂ֔ר וְ/אֶחָ֖י/ו מֵאָ֥ה וּ/שְׁלֹשִֽׁים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: te
  text: 'గేర్షోము కుమారులలో: నాయకుడైన యోవేలు, అతని సహోదరులు[a] 130 మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “సహోదరులు” అంటే యోవేలు సొంత అన్నదమ్ములు మాత్రమే కాక, అదే లేవీయ వంశవర్గానికి చెందిన పురుషులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: కుమారులలో
  rationale: జాబితాలో తదుపరి వంశవర్గాన్ని పరిచయం చేసే לְ ప్రయోగాన్ని తెలుగులో సహజంగా చూపుతుంది; ‘కుమారులు’ ఇక్కడ వంశసభ్యులను సూచిస్తుంది.
- source_word: גֵּרְשׁוֹם
  choice: గేర్షోము
  rationale: హీబ్రూ పాఠంలోని గేర్షోమ్ రూపానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: పేరుకు ప్రాచుర్యంలో ఉన్న, మూలధ్వనులకు అనుగుణమైన తెలుగు రూపం.
- source_word: הַשָּׂר
  choice: నాయకుడైన
  rationale: ఈ వంశపరమైన పరిపాలనా సందర్భంలో శార్ అనే పదం రాజబిరుదుకంటే వర్గాధిపతి లేదా నాయకుడిని సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలంలోని ‘అతని సోదరులు’ అనే బంధుత్వపదాన్ని నిలుపుతూ, ఈ సందర్భంలో అదే లేవీయ వంశవర్గానికి చెందిన పురుషులను సూచించే విస్తృతార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: 130 మంది
  rationale: హీబ్రూ సంఖ్యను జాబితా సందర్భానికి అనుకూలంగా అంకెలలో ఇచ్చి, వ్యక్తుల లెక్క అని ‘మంది’తో స్పష్టం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని పాటించాం. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించి, గౌరవప్రదమైన సాధారణ పదజాలాన్ని ఉపయోగించాం.
