id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: te
  text: దావీదు నగరంలో అతడు తన కోసం ఇళ్లు కట్టాడు. దేవుని మందసం కోసం ఒక స్థలాన్ని సిద్ధం చేసి, దాని కోసం ఒక గుడారం వేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కోసం ఒక గుడారం వేశాడు.” హీబ్రూ సర్వనామ ప్రత్యయం మందసాన్ని గానీ దావీదును గానీ సూచించవచ్చు; అయితే వెంటనే ఉన్న సందర్భం మందసాన్ని సూచించే అర్థానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ בָתִּים
  choice: అతడు తన కోసం ఇళ్లు కట్టించుకున్నాడు
  rationale: עשה అనే క్రియ విస్తృతంగా ‘చేయు/నిర్మించు’ అని అర్థమిస్తుంది. ఇళ్ల సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘కట్టించుకున్నాడు’ అని అనువదించడం, దావీదు తన కోసం నిర్మాణాలు ఏర్పాటు చేయించుకున్న భావాన్ని తెలియజేస్తుంది; ‘ఇళ్లు’ అనే బహువచనాన్ని అలాగే నిలుపుతుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: స్థానాన్ని సూచించే పదబంధాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది; ‘దావీదు నగరం’ అనే పేరుస్వరూపాన్ని కాపాడుతుంది.
- source_word: וַיָּכֶן מָקוֹם
  choice: ఒక స్థలాన్ని సిద్ధం చేసి
  rationale: హిఫిల్ రూపంలోని כון ఇక్కడ ‘సిద్ధం చేయు/ఏర్పాటు చేయు’ అనే భావాన్ని ఇస్తుంది. మందసం కోసం స్థలాన్ని సిద్ధపరిచిన చర్యను ‘సిద్ధం చేసి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం కోసం
  rationale: אֲרוֹן అనేది పెట్టె లేదా మందసం; ఈ సందర్భంలో పవిత్ర మందసాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకకు తగిన ‘దేవుని మందసం’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: וַיֶּט לוֹ אֹהֶל
  choice: దాని కోసం ఒక గుడారం వేశాడు
  rationale: గుడారంతో వాడిన נטה ‘వేయు/నిలుపు’ అనే భావాన్నిస్తుంది. నిర్దిష్ట ఉపపదం లేని אֹהֶל‌ను ‘ఒక గుడారం’గా అనువదించాం. לוֹలోని సర్వనామం సమీప సందర్భం ప్రకారం మందసాన్ని సూచిస్తుందని ప్రధాన పాఠ్యంలో తీసుకున్నాం.
theological_decisions:
- issue: וַיֶּט לוֹ אֹהֶל లోని לוֹ సర్వనామ ప్రత్యయం ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: మందసాన్ని సూచిస్తూ, ‘దాని కోసం ఒక గుడారం వేశాడు’
  alternative: దావీదును సూచిస్తూ, ‘తన కోసం ఒక గుడారం వేశాడు’
  rationale: వెంటనే ముందు ఉన్న వాక్యభాగం దేవుని మందసం కోసం స్థలాన్ని సిద్ధం చేయడం గురించి చెబుతుంది. అందువల్ల మందసం కోసం గుడారం వేసినట్లు అర్థం చేసుకోవడం సందర్భానికి ఎక్కువగా సరిపోతుంది. అయినా హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా దావీదును కూడా సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘మందసం,’ ‘గుడారం’ వంటి సాధారణ బైబిలు పదజాలాన్ని నిలిపి, మూలంలోని చర్యల క్రమాన్నీ సర్వనామ సందిగ్ధతనూ సంరక్షించాం.
