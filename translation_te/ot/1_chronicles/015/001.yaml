- from: దావీదు నగరంలో అతడు తన కోసం ఇళ్లు కట్టించుకున్నాడు. దేవుని మందసం కోసం ఒక స్థలాన్ని సిద్ధం చేసి, దాని కోసం ఒక గుడారం వేశాడు.[a]
  to: దావీదు నగరంలో అతడు తన కోసం ఇళ్లు కట్టాడు. దేవుని మందసం కోసం ఒక స్థలాన్ని సిద్ధం చేసి, దాని కోసం ఒక గుడారం వేశాడు.[a]
  rationale: 'Only the first verb has been adjusted: “కట్టాడు” directly reflects the non-causative Hebrew verb while retaining the meaning that the houses were for David. The main-text rendering and footnote continue to preserve the contextual preference and grammatical ambiguity of לוֹ.'
