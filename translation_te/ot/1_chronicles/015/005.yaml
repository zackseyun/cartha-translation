  text: לִ/בְנֵ֖י קְהָ֑ת אוּרִיאֵ֣ל הַ/שָּׂ֔ר וְ/אֶחָ֖י/ו מֵאָ֥ה וְ/עֶשְׂרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: te
  text: కహాతు కుమారులలో ప్రధానుడైన ఊరియేలు, అతని సహోదరులు నూట ఇరవై మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అనే మాట ఇక్కడ కేవలం ఒకే తల్లిదండ్రులకు పుట్టిన అన్నదమ్ములను మాత్రమే కాకుండా, కహాతు వంశానికి చెందిన బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  choice: కహాతు కుమారులలో
  rationale: లְ ఉపసర్గం జాబితాలోని వంశవర్గాన్ని పరిచయం చేస్తుంది. בְּנֵי అనే పదం ఇక్కడ కహాతు వంశానికి చెందిన వారిని సూచించినా, మూలంలోని బంధుత్వ రూపాన్ని నిలుపుతూ ‘కుమారులు’ అని అనువదించాం.
- source_word: אוּרִיאֵל
  choice: ఊరియేలు
  rationale: హెబ్రీ వ్యక్తినామాన్ని సహజమైన తెలుగు బైబిలు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: הַשָּׂר
  choice: ప్రధానుడైన
  rationale: שַׂר ఇక్కడ వంశబృందానికి నాయకుడిని సూచిస్తుంది; రాజరిక భావాన్ని కలిగించే పదం కాకుండా, జాబితా సందర్భానికి సహజమైన ‘ప్రధానుడు’ ఎంచుకున్నాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אָח అనే పదానికి ప్రాథమిక అర్థమైన ‘సహోదరులు’ను నిలిపాం; ఈ సందర్భంలో అది విస్తృతంగా వంశసంబంధులనూ సూచించవచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: నూట ఇరవై మంది
  rationale: వ్యక్తుల లెక్క కాబట్టి ఆధునిక తెలుగులో సహజంగా సంఖ్యను పదరూపంలో, ‘మంది’తో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విస్తృత వంశార్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
