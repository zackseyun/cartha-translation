id: 1CH.15.28
reference: 1 Chronicles 15:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: te
  text: ఇశ్రాయేలు వారందరూ నినాదాలతో[a], కొమ్ము బూర ధ్వనితో[b], బాకాలతో, తాళాలను మ్రోగిస్తూ, హార్పులు మరియు లైర్లు వాయిస్తూ యాహ్వే నిబంధన మందసాన్ని పైకి తీసుకువస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక పెద్ద కేకతో’; హీబ్రూ పదం ఉత్సవ నినాదాన్ని లేదా ప్రశంసాపూర్వకమైన బిగ్గర కేకను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ, ‘షోఫార్’; ఇది సాధారణంగా జంతువు కొమ్ముతో చేసిన బూర. తరువాత ప్రస్తావించిన బాకాలకు ఇది భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: పైకి తీసుకువస్తూ ఉన్నారు
  rationale: హిఫీల్ వర్తమాన కృదంతం ఊరేగింపులో కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది; ‘పైకి’ అనే భావం యెరూషలేమువైపు ఎక్కి వెళ్లడాన్ని నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ సమాస శ్రేణిని సహజమైన తెలుగు పదక్రమంలో అందిస్తూ, మందసం నిబంధనకు సంబంధించినదనే ప్రత్యేకతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: תְרוּעָה
  choice: నినాదాలతో
  rationale: ఈ పదం ఉత్సవ సందర్భంలోని బిగ్గర కేకను లేదా సామూహిక జయధ్వనిని సూచించగలదు; ‘నినాదాలు’ ఆ విస్తృతిని అతిగా నిర్దిష్టం చేయదు.
- source_word: קוֹל שׁוֹפָר
  choice: కొమ్ముబూర ధ్వనితో
  rationale: קוֹל లోని ‘ధ్వని’ భావాన్ని స్పష్టంగా ఉంచి, שׁוֹפָרను తరువాతి లోహపు బాకాల నుండి వేరుచేస్తుంది.
- source_word: חֲצֹצְרוֹת
  choice: బాకాలతో
  rationale: שׁוֹפָר తరువాత ప్రస్తావించిన వేరొక రకమైన వేడుక వాయిద్యాలను సూచించేందుకు సహజమైన తెలుగు పదం.
- source_word: מְצִלְתַּיִם
  choice: తాళాలతో
  rationale: ఒకదానికొకటి తాకించి మ్రోగించే తాళ వాయిద్యానికి ప్రాచుర్యంలో ఉన్న తెలుగు సమానార్థకం.
- source_word: מַשְׁמִעִים
  choice: మ్రోగిస్తూ
  rationale: హిఫీల్ రూపంలోని ‘వినిపించేటట్లు చేయడం’ అనే శ్రావ్య భావాన్ని, తరువాతి తంతివాయిద్యాలకు సహజంగా అన్వయిస్తుంది.
- source_word: נְבָלִים
  choice: స్వరమండలాలు
  rationale: ప్రాచీన తంతివాయిద్యానికి తెలుగు బైబిలు వాడుకలో గుర్తించదగిన పదం; כִנֹּרוֹתతో భేదాన్ని నిలుపుతుంది.
- source_word: כִנֹּרוֹת
  choice: సితారాలు
  rationale: ఖచ్చితమైన ఆధునిక సమానం లేకపోయినా, పక్కనే ఉన్న נְבָלִיםకు భిన్నమైన తంతివాయిద్యంగా చదివేలా చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనా ఊరేగింపు గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. మూలంలోని కొనసాగుతున్న కార్యభావం, వాయిద్యాల మధ్య భేదం, దైవనామం అన్నీ నిలుపబడ్డాయి.
