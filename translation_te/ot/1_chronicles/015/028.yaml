- from: ఇశ్రాయేలీయులందరూ నినాదాలతో[a], కొమ్ముబూర ధ్వనితో[b], బాకాలతో, తాళాలతో, స్వరమండలాలు, సితారాలు మ్రోగిస్తూ యాహ్వే నిబంధన మందసాన్ని పైకి తీసుకువస్తూ ఉన్నారు.
  to: ఇశ్రాయేలు వారందరూ నినాదాలతో[a], కొమ్ము బూర ధ్వనితో[b], బాకాలతో, తాళాలను మ్రోగిస్తూ, హార్పులు మరియు లైర్లు వాయిస్తూ యాహ్వే నిబంధన మందసాన్ని పైకి తీసుకువస్తూ ఉన్నారు.
  rationale: సవరణ మూలంలోని వాయిద్యాల క్రమాన్నీ, కొనసాగుతున్న ఊరేగింపు చర్యనూ, రెండు వేర్వేరు తంతివాయిద్యాల ప్రస్తావననూ నిలుపుతుంది. తాళాలకు ‘మ్రోగిస్తూ,’ తంతివాయిద్యాలకు ‘వాయిస్తూ’ అని వేరు చేయడం ద్వారా తెలుగు వాక్యం సహజమవుతుంది; ఇది మַשְׁמִיעִים యొక్క శ్రవణీయ సంగీతభావాన్ని కూడా తగినంతగా వ్యక్తం చేస్తుంది. పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదాల వద్దనే ఉంచబడ్డాయి.
