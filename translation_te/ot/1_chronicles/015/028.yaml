    rationale: కిన్నోర్ యొక్క ఖచ్చితమైన ఆధునిక వాయిద్య-సమానం వివాదాస్పదం. ‘లైర్లు’ అనే విస్తృత సంగీతపదం అనవసరమైన చారిత్రక నిర్దిష్టతను నివారిస్తూ నేబెల్‌తో వ్యత్యాసాన్ని కాపాడుతుంది.
