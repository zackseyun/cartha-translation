  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని సంక్షిప్తంగా ఉంచుతూ గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని వంశసంబంధ పదజాలం మరియు దాని సందర్భసంభవ అస్పష్టత రెండింటినీ నిలిపాం.
