  yaml_path: translation/ot/1_chronicles/015/009.yaml
  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: te
  text: 'హెబ్రోను కుమారులకు: అధిపతియైన ఎలీయేలు, అతని సహోదరులు[a] ఎనభై మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని బంధువులు’; హెబ్రీలో అక్షరార్థంగా ‘అతని సహోదరులు’ అని ఉంది. ఇక్కడ ఎలీయేలు ప్రాతినిధ్యం వహించిన వంశానికి చెందిన పురుషులను ఇది సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: కుమారులలో
  rationale: లְ ఉపసర్గం ఈ జాబితాలోని వంశవర్గాన్ని పరిచయం చేస్తోంది. ‘కుమారులు’ అనే పదం హెబ్రీ బంధుత్వ వ్యక్తీకరణను నిలుపుతుంది; తెలుగులో జాబితా నిర్మాణానికి ‘కుమారులలో’ సహజంగా సరిపోతుంది.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: వ్యక్తి/వంశ నామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֱלִיאֵל
  choice: ఎలీయేలు
  rationale: వ్యక్తినామాన్ని అనువదించకుండా తెలుగు ధ్వనిరూపంలో లిప్యంతరీకరించాం.
- source_word: הַשָּׂר
  choice: అధిపతి
  rationale: שַׂר ఇక్కడ వంశబృందానికి నాయకుడు లేదా ప్రధాన ప్రతినిధిని సూచిస్తుంది. ‘అధిపతి’ రాజకుమారుడు లేదా సైనిక అధికారి అనే అనవసర ప్రత్యేకార్థాలను రుద్దకుండా నాయకత్వ భావాన్ని తెలియజేస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: హెబ్రీ పదబంధానికి అక్షరార్థం ‘అతని సోదరులు.’ వంశజాబితా సందర్భంలో ఇది పురుష బంధువులు లేదా వంశసభ్యులను సూచించవచ్చు; మూలంలోని బంధుత్వ పదాన్ని నిలుపుతూ ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: שְׁמוֹנִים
  choice: ఎనభై మంది
  rationale: ఎలీయేలుతో కూడిన పురుషుల సంఖ్యను తెలిపే సంఖ్యావాచకం; తెలుగులో వ్యక్తుల లెక్కకు ‘మంది’ చేర్చడం సహజం.
