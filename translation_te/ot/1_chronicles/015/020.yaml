source:
  edition: WLC
  text: וּ/זְכַרְיָ֨ה וַ/עֲזִיאֵ֜ל וּ/שְׁמִֽירָמ֤וֹת וִֽ/יחִיאֵל֙ וְ/עֻנִּ֣י וֶֽ/אֱלִיאָ֔ב וּ/מַעֲשֵׂיָ֖הוּ וּ/בְנָיָ֑הוּ בִּ/נְבָלִ֖ים עַל עֲלָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: te
  text: మరియు జెకర్యా, అజీయేలు, షెమీరామోతు, యెహీయేలు, ఉన్నీ, ఎలీయాబు, మయశేయా, బెనాయా వీణలను అలామోతుకు అనుగుణంగా[a] వాయించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉన్నత స్వరస్థాయిలో.” ‘అలామోతు’ అనే హీబ్రూ పదం యువతులతో సంబంధమున్న లేదా ఉన్నత స్వరస్థాయిని సూచించే సంగీత నిర్దేశం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: వీణలు వాయించారు
  rationale: נְבָלִים అనేది తంతివాద్యాలను సూచిస్తుంది. తెలుగు బైబిలు సంగీత సందర్భంలో ‘వీణలు’ సహజంగా అర్థమవుతుంది; בְּ యొక్క సాధనార్థాన్ని తెలుగులో సహజమైన ‘వాయించారు’ అనే క్రియతో వ్యక్తం చేశాం.
- source_word: עַל
  choice: ప్రకారం
  rationale: ఈ సంగీత సందర్భంలో עַל స్థలార్థం కంటే పద్ధతి, స్వరస్థాయి లేదా సంగీత నిర్దేశాన్ని పరిచయం చేస్తున్నట్లు కనిపిస్తుంది. ‘ప్రకారం’ దాని సాంకేతిక భావాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: עֲלָמוֹת
  choice: అలామోతు
  rationale: ఇది యువతులు అనే పదంతో సంబంధమున్నప్పటికీ, ఇక్కడ బహుశా ఉన్నత స్వరస్థాయిని సూచించే అనిశ్చిత సంగీత పారిభాషిక పదం. కచ్చితమైన భావాన్ని నిర్ణయించకుండా లిప్యంతరీకరించాం; సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וּזְכַרְיָה וַעֲזִיאֵל וּשְׁמִירָמוֹת וִיחִיאֵל וְעֻנִּי וֶאֱלִיאָב וּמַעֲשֵׂיָהוּ וּבְנָיָהוּ
  choice: జెకర్యా, అజీయేలు, షెమీరామోతు, యెహీయేలు, ఉన్నీ, ఎలీయాబు, మయశేయా, బెనాయా
  rationale: వ్యక్తుల పేర్లను హీబ్రూ రూపాలకు దగ్గరగా, ఆధునిక తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం. జాబితాలోని సంధికారకాలను తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా విరామచిహ్నాలతో చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. ఈ వచనం ముందున్న క్రియపై ఆధారపడే జాబితా భాగమైనందున, తెలుగులో వాక్యం స్వతంత్రంగా అర్థమయ్యేలా ‘వాయించారు’ అని స్పష్టీకరించాం.
