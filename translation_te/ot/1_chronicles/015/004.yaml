translation:
  language: te
  text: దావీదు అహరోను కుమారులనూ లేవీయులనూ సమకూర్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చాడు
  rationale: אסף అనే క్రియ ఇక్కడ మనుషులను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, కథన సందర్భానికి తగిన గౌరవప్రదమైన పదం.
- source_word: דָּוִיד
  choice: దావీదు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులను
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అహరోను కుమారులు.’ సందర్భంలో అహరోను వంశీయులను సూచించే అవకాశం ఉన్నా, మూలంలోని వంశసంబంధ రూపాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందిన ఆరాధనా సేవకుల సమూహాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: אֵת ... וְאֵת
  choice: ప్రత్యేకంగా అనువదించలేదు; తెలుగు కర్మవిభక్తి మరియు సముచ్చయంతో వ్యక్తీకరించబడింది
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను గుర్తించే వ్యాకరణ కణం. తెలుగులో ‘-ను/-లను’ కర్మవిభక్తి మరియు ‘అహరోను కుమారులను, లేవీయులను’ అనే సమన్వయం దాని పనిని సహజంగా వ్యక్తం చేస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమన్విత సమూహాలను స్పష్టంగా నిలుపుతూ అనవసరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
