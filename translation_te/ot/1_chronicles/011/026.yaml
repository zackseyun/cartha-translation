source:
  edition: WLC
  text: וְ/גִבּוֹרֵ֖י הַ/חֲיָלִ֑ים עֲשָׂה אֵל֙ אֲחִ֣י יוֹאָ֔ב אֶלְחָנָ֥ן בֶּן דּוֹד֖וֹ מִ/בֵּ֥ית לָֽחֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: te
  text: 'పరాక్రమవంతులైన యోధులు వీరు: యోవాబు సహోదరుడైన అశాహేలు; బేత్లెహేముకు చెందిన దోదో కుమారుడు ఎల్హానాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ పదబంధం శౌర్యంగల లేదా ప్రత్యేక సామర్థ్యంగల పోరాట యోధులను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, సైనిక భావం స్పష్టంగా ఉండేలా అనువదించబడింది; జాబితా కొనసాగింపును సందర్భానుసారంగా నిలిపింది.
- source_word: עֲשָׂה אֵל
  choice: అశాహేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: אֲחִי יוֹאָב
  choice: యోవాబు సహోదరుడు
  rationale: అశాహేలును యోవాబుతో ఉన్న కుటుంబ సంబంధం ద్వారా గుర్తించే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶלְחָנָן
  choice: ఎల్హానాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן דּוֹדוֹ
  choice: దోదో కుమారుడు
  rationale: వంశసంబంధ సూత్రాన్ని నేరుగా అందిస్తుంది; ఇక్కడ דּוֹדוֹ సాధారణ నామవాచకం కాక వ్యక్తిపేరు.
- source_word: מִבֵּית לָחֶם
  choice: బేత్లెహేము నుండి వచ్చిన
  rationale: מִן ఉపసర్గతో ఉన్న స్థలనామం మూలస్థలాన్ని సూచిస్తుంది. హీబ్రూలోని అక్షరార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే జాబితా శైలిని ఉపయోగించాం. వ్యక్తిపేర్లకు తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపాలను ఎంచుకున్నాం. మూలపాఠంలో క్రియ లేకపోవడంతో, జాబితాను సహజంగా పరిచయం చేయడానికి “వీరు” చేర్చబడింది. పాదసూచిక గుర్తును అది వివరించే “బేత్లెహేము నుండి వచ్చిన” అనే పదబంధం వద్ద ఉంచాం.
