id: 1CH.11.12
reference: 1 Chronicles 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרָ֛י/ו אֶלְעָזָ֥ר בֶּן דּוֹד֖וֹ הָ/אֲחוֹחִ֑י ה֖וּא בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: te
  text: అతని తరువాత అహోహీయుడైన దోదో కుమారుడు ఎలియాజరు ఉన్నాడు; అతడు ముగ్గురు పరాక్రమశాలుల్లో ఒకడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఆ ముగ్గురు పరాక్రమశాలుల్లో ఉన్నాడు.” హీబ్రూ వ్యక్తీకరణ ఆ విశిష్ట ముగ్గురి బృందంలో సభ్యత్వాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: అతని తరువాత
  rationale: దావీదు వీరుల జాబితాలో క్రమాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ఆరంభ సంధికారకమైన ‘మరియు’ను విడిచిపెట్టాం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ వంశసూచక సందర్భంలో ప్రత్యక్ష పుత్ర సంబంధమే అత్యంత సహజమైన అర్థం.
- source_word: דּוֹדוֹ
  choice: దోదో
  rationale: ఈ వచనంలోని హీబ్రూ రూపాన్ని అనుసరించి పేరును లిప్యంతరీకరించాం; ‘దోదయి’ అనే ఇతర రూపాన్ని ఇక్కడ దిగుమతి చేయలేదు.
- source_word: הָאֲחוֹחִי
  choice: అహోహీయుడైన
  rationale: వంశం లేదా ప్రాంతాన్ని సూచించే హీబ్రూ విశేషణాన్ని అర్థాన్ని నిర్దిష్టంగా ఊహించకుండా జాతి/వంశనామంగా లిప్యంతరీకరించాం.
- source_word: הוּא בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: అతడు ముగ్గురు పరాక్రమశాలుల్లో ఒకడు
  rationale: בְּ + ‘ముగ్గురు’ అనే నిర్మాణం ఆ ప్రసిద్ధ ముగ్గురి గుంపులో సభ్యత్వాన్ని సూచిస్తుంది. తెలుగులో స్పష్టంగా, సహజంగా ఉండేందుకు ‘ఒకడు’ను చేర్చాం.
- source_word: הַגִּבֹּרִים
  choice: పరాక్రమశాలులు
  rationale: దావీదు శ్రేష్ఠ యోధులకు వాడే గుర్తింపు పదంలోని శౌర్య భావాన్ని కాపాడుతూ, ఆధునిక తెలుగులో గౌరవప్రదంగా వినిపించే పదాన్ని ఎంచుకున్నాం.
