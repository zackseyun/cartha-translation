translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. వ్యక్తి, వంశనామాలను లిప్యంతరీకరించి, సైనిక బిరుదు భావాన్ని ‘పరాక్రమశాలులు’తో నిలిపాం.
