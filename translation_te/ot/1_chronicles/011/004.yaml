id: 1CH.11.4
reference: 1 Chronicles 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: te
  text: తర్వాత దావీదు, ఇశ్రాయేలీయులందరూ యెరూషలేముకు—అంటే యెబూసుకు—వెళ్లారు. అక్కడ ఆ దేశ నివాసులైన యెబూసీయులు ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “అక్కడ యెబూసీయుడు, ఆ దేశ నివాసులు” అని ఉంది. “యెబూసీయుడు” అనే ఏకవచన రూపం ఇక్కడ సమూహాన్ని సూచిస్తుంది; అందుకే పాఠ్యంలో “యెబూసీయులు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: తర్వాత ... వెళ్లారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. బహువచన కర్తకు సరిపోయేలా, సహజమైన తెలుగు కథన శైలిలో ‘తర్వాత ... వెళ్లారు’ అని అనువదించాం.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ దేశప్రజలను సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో వ్యక్తుల సమూహమని స్పష్టంగా తెలియజేయడానికి ‘ఇశ్రాయేలీయులందరూ’ సహజంగా ఉంటుంది.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: యెరూషలేముకు—అంటే యెబూసుకు—
  rationale: הִיא యెరూషలేమును దాని పూర్వనామమైన యెబూసుతో గుర్తిస్తుంది. ‘అంటే’ అనే వివరణాత్మక ప్రయోగం ఈ సమానత్వాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׁם
  choice: అక్కడ
  rationale: హీబ్రూ పదబంధానికి నేరమైన అర్థం ‘మరియు అక్కడ.’ తెలుగు వాక్య విభజనలో ‘అక్కడ’ సహజంగా తదుపరి సమాచారాన్ని పరిచయం చేస్తుంది.
- source_word: הַיְבוּסִי
  choice: యెబూసీయులు
  rationale: రూపపరంగా ఏకవచనమైనా, తరువాతి బహువచన కృదంతం వల్ల ఇది సమూహార్థక జాతినామంగా పనిచేస్తుంది. అందువల్ల తెలుగులో బహువచనం వాడాం.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఆ దేశ నివాసులైన
  rationale: ఈ కృదంత సమాసానికి ‘దేశ నివాసులు’ అనే అర్థం ఉంది. సందర్భంలో אָרֶץ స్థానిక భూభాగాన్ని సూచిస్తున్నందున ‘ఆ దేశ’ అని ఇచ్చాం.
