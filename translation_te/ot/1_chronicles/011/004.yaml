translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని బలవంతంగా అనుకరించకుండా రెండు తెలుగు వాక్యాలుగా విభజించాం; అయితే క్రమం, స్థలనామాల సమానీకరణ, యెబూసీయుల నివాస సమాచారం అన్నీ నిలుపుకున్నాం.
