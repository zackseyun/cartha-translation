source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: te
  text: అప్పుడు అతడు, “నా దేవుని సాక్షిగా[a], నేను ఇలా చేయడం నాకు ఎంతమాత్రం తగదు! తమ ప్రాణాలను పణంగా పెట్టి తెచ్చిన ఈ మనుషుల రక్తాన్ని[b] నేను తాగాలా? ఎందుకంటే వారు తమ ప్రాణాలను పణంగా పెట్టి దీనిని తెచ్చారు” అన్నాడు. అందుచేత అతడు దానిని తాగడానికి ఇష్టపడలేదు. ఈ కార్యాలు ఆ ముగ్గురు పరాక్రమవంతులు చేసినవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా దేవుని ఎదుట” అని కూడా అనువదించవచ్చు. మూలంలోని מֵאֱלֹהַי పదబంధం దేవునిని సాక్షిగా చేసుకొని పలికే భావాన్నీ, దేవుని ఎదుట అనే భావాన్నీ అనుమతిస్తుంది.
    reason: మూల పదబంధంలోని ప్రత్యామ్నాయ భావాన్ని సూచిస్తుంది.
  - marker: b
    text: దావీదు ఆ నీటిని అక్షరార్థంగా రక్తమని చెప్పడం లేదు; వారు ప్రాణాపాయాన్ని ఎదుర్కొని దానిని తెచ్చారు కాబట్టి, దానిని వారి రక్తంతో సమానమైనదిగా పరిగణిస్తున్నాడు.
    reason: ‘రక్తం’ అనే బలమైన రూపకానికి కథన సందర్భాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: నా దేవుని సాక్షిగా, నేను ఇలా చేయడం తలంచలేను
  rationale: חָלִילָה బలమైన నిరాకరణను సూచిస్తుంది; מֵאֱלֹהַי లోని దేవుని ఎదుట లేదా దేవుని సాక్షిగా పలికే ప్రమాణసదృశ బలాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: ఈ మనుషుల రక్తాన్ని నేను తాగాలా?
  rationale: ప్రశ్నార్థక הֲ ను అలంకారిక ప్రశ్నగా ఉంచి, కథనంలోని గాఢమైన ‘రక్తం’ రూపకాన్ని యథాతథంగా నిలిపింది.
- source_word: בְנַפְשׁוֹתָם
  choice: తమ ప్రాణాలను పణంగా పెట్టి
  rationale: ఇక్కడ נֶפֶשׁ భౌతిక ప్రాణాన్ని సూచిస్తుంది. בְ తో కూడిన పదబంధం ప్రాణాపాయాన్ని తెలుపుతుంది; తెలుగు నుడికారంలో ‘ప్రాణాలను పణంగా పెట్టి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: అతడు దానిని తాగడానికి ఇష్టపడలేదు
  rationale: אָבָה సమ్మతి లేదా ఇష్టాన్ని సూచిస్తుంది; ‘నిరాకరించాడు’ కంటే ఈ రూపం మూలానికి దగ్గరగా ఉంది.
- source_word: שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: ఆ ముగ్గురు పరాక్రమవంతులు
  rationale: גִּבּוֹרִים దావీదు యొక్క విశిష్ట యోధులను సూచిస్తుంది; ‘పరాక్రమవంతులు’ సైనిక-వీర భావాన్ని గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: దావీదు మాటలో ‘రక్తం’ అనే పదం
  choice: ప్రధాన పాఠ్యంలో ‘రక్తం’ అనే పదాన్ని అక్షరార్థ రూపంలోనే నిలపడం
  alternative: ‘ప్రాణాలకు తెగించి తెచ్చిన నీరు’ అని పూర్తిగా వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ స్పష్టంగా ‘రక్తం’ అంటుంది. వారి ప్రాణాపాయాన్ని బట్టి దావీదు ఆ నీటిని వారి రక్తంతో సమానంగా పరిగణిస్తున్న నైతిక తీవ్రతను ఈ రూపకం నిలుపుతుంది.
- issue: נֶפֶשׁ యొక్క భావం
  choice: ‘ప్రాణాలు’
  alternative: ‘ఆత్మలు’
  rationale: ఈ సందర్భంలో పదం ప్రమాదానికి గురైన భౌతిక జీవితాన్ని సూచిస్తుంది; ‘ఆత్మలు’ అనడం మూలంలో లేని మానవ స్వభావ సంబంధ సిద్ధాంతార్థాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని ‘తమ ప్రాణాలను’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
