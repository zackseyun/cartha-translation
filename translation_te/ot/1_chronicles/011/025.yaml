source:
  edition: WLC
  text: מִן הַ/שְּׁלוֹשִׁ֗ים הִנּ֤/וֹ נִכְבָּד֙ ה֔וּא וְ/אֶל הַ/שְּׁלוֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂימֵ֥/הוּ דָוִ֖יד עַל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: te
  text: ముప్పై మందికంటే అతడు ఎక్కువగా గౌరవింపబడ్డాడు; అయినా ఆ ముగ్గురి స్థాయిని అతడు చేరుకోలేదు[a]. దావీదు అతణ్ణి తన అంగరక్షక దళానికి అధిపతిగా నియమించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ముప్పై మంది నుండి అతడు గౌరవింపబడ్డాడు; ఆ ముగ్గురి దగ్గరకు అతడు రాలేదు.’ మొదటి మాట ఇక్కడ తులనాత్మకంగా, ‘ముప్పై మందికంటే’ అనే భావంలో ఉంది; ‘రాలేదు’ అనేది ఆ ముగ్గురి హోదాను చేరుకోలేదనే అర్థంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన కాపలా దళంపై’ లేదా ‘తన ఆధీనంలోని వారిపై.’ హెబ్రీ పదం దావీదు అధికారంలో ఉన్న కాపలా బృందాన్ని లేదా మరింత విస్తృతమైన బాధ్యతా విభాగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: ముప్పై మంది వీరుల్లో
  rationale: מִן‌ను ఇక్కడ సమూహంలో భాగాన్ని సూచించేదిగా గ్రహించడం తరువాతి ‘ఆ ముగ్గురు’తో ఉన్న స్థాయి-పోలికకు సరిపోతుంది. సందర్భం వల్ల ‘వీరులు’ అనే పదాన్ని స్పష్టత కోసం చేర్చాం; హెబ్రీలో సంఖ్య మాత్రమే ఉంది.
- source_word: הִנּוֹ נִכְבָּד הוּא
  choice: అతడు నిజంగా గౌరవం పొందాడు
  rationale: הִנּוֹ యొక్క ఉద్ఘాటనను ‘నిజంగా’తో, כבד నిఫాల్ రూపంలోని గౌరవనీయ స్థితిని సహజమైన ఆధునిక తెలుగులో ‘గౌరవం పొందాడు’తో వ్యక్తం చేశాం.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: అయితే ఆ ముగ్గురి స్థాయిని అతడు చేరుకోలేదు
  rationale: ‘ఆ ముగ్గురి దగ్గరకు రాలేదు’ అనే అక్షరార్థం ఇక్కడ వారి హోదా లేదా స్థాయిని పొందకపోవడాన్ని సూచించే జాతీయ ప్రయోగం. ‘స్థాయిని చేరుకోలేదు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: దావీదు అతణ్ణి ... అధిపతిగా నియమించాడు
  rationale: שׂים అక్షరార్థంగా ‘ఉంచు’ అయినా, సైనిక బాధ్యత అప్పగించే సందర్భంలో ‘నియమించాడు’ సరైన పరిపాలనా భావాన్ని ఇస్తుంది.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: తన అంగరక్షక దళానికి అధిపతిగా
  rationale: מִשְׁמַעַת విధేయతలో లేదా ఆధీనంలో ఉన్న దళాన్ని, ముఖ్యంగా రాజు రక్షక బృందాన్ని, సూచించవచ్చు. ‘అంగరక్షక దళం’ సందర్భానికి సహజమైన ప్రధాన ఎంపిక; పదంలోని విస్తృత సాధ్యతను పాదసూచికలో నిలిపాం.
