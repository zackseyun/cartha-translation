translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘ముప్పై మంది,’ ‘ఆ ముగ్గురు’ అనే పదబంధాలను దావీదు వీరులలో గుర్తింపుపొందిన వర్గాలుగా చూపించాం. మూలంలోని స్థాయి-పోలికను స్పష్టపరుస్తూనే, בוא మరియు מִשְׁמַעַת పదాల భావవ్యాప్తిని పాదసూచికల్లో నిలిపాం.
