id: 1CH.11.17
reference: 1 Chronicles 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/יתאו דָּוִ֖יד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בּ֥וֹר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: te
  text: దావీదు ఎంతో ఆశపడి, “ద్వారం దగ్గర ఉన్న బేత్లెహేము బావిలోని నీళ్లు ఎవరైనా నాకు తాగడానికి ఇస్తే ఎంత బాగుంటుంది!”[a][b] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, హీబ్రూ ప్రశ్నారూపానికి మరింత దగ్గరగా: “ద్వారం దగ్గర ఉన్న బేత్లెహేము బావిలోని నీళ్లు నాకు తాగడానికి ఎవరు ఇస్తారు?”'
    reason: lexical_alternative
  - marker: b
    text: “బావి” అని అనువదించిన హీబ్రూ పదానికి “నీటి తొట్టి” లేదా “గొయ్యి” అనే అర్థాలు కూడా ఉన్నాయి; ఇక్కడ అది తాగునీటి మూలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: ఎంతో ఆశపడి
  rationale: ఈ క్రియ బలమైన కోరికను తెలియజేస్తుంది. ‘ఎంతో ఆశపడి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి దాని తీవ్రతను నిలుపుతుంది.
- source_word: מי
  choice: ఎవరైనా ... ఇస్తే ఎంత బాగుంటుంది
  rationale: హీబ్రూలో ప్రశ్నార్థక రూపంలో వ్యక్తమైన కోరికను తెలుగులో సహజమైన ఆశార్థక వాక్యంగా అందిస్తుంది; పదక్షరంగా ‘ఎవరు ఇస్తారు?’ అని కూడా అనువదించవచ్చు.
- source_word: ישקני מים
  choice: నాకు తాగడానికి ... నీళ్లు ... ఇస్తే
  rationale: שקה అనే హిఫీల్ క్రియలోని ‘తాగించు/తాగడానికి ఇవ్వు’ భావాన్నీ, מים అనే స్పష్టమైన కర్మనూ నిలుపుతుంది.
- source_word: מבּור
  choice: బావిలోని
  rationale: בור అనే పదానికి గొయ్యి, తొట్టి, బావి అనే అర్థాలు ఉండవచ్చు. ఇక్కడ తాగునీటి మూలాన్ని సూచిస్తున్నందున ‘బావి’ సందర్భోచితం.
- source_word: בית לחם
  choice: బేత్లెహేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: אשר בשער
  choice: ద్వారం దగ్గర ఉన్న
  rationale: ఆ నీటి మూలం పట్టణ ద్వారానికి సమీపంలో ఉందని తెలిపే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దావీదు పలికిన మాటను నిజమైన సమాచార ప్రశ్నగా కాక బలమైన కోరికగా పాఠకుడు గ్రహించేలా ఆశార్థక నిర్మాణం వాడబడింది; ప్రత్యక్ష ప్రశ్నారూపం పాదటిప్పణిలో నిలుపబడింది.
