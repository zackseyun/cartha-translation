  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: te
  text: అష్తెరాతీయుడైన ఉజ్జీయా[a], అరోయేరీయుడైన హోతాము కుమారులు షామా మరియు యెయూయేలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అష్తారోతీయుడైన.” ఈ పదం బహుశా అష్తారోతు/అష్తెరాతు ప్రాంతానికి చెందిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరును “యెయీయేలు” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָא
  choice: ఉజ్జీయా
  rationale: ఇది వ్యక్తి పేరు; హెబ్రీ రూపాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: הָעֲשְׁתְּרָתִי
  choice: అష్తెరాతీయుడు
  rationale: అష్తెరాతు/అష్తారోతు అనే స్థలంతో సంబంధాన్ని తెలిపే జాతివాచక రూపం; మూలంలోని ధ్వనిరూపానికి దగ్గరగా ఉంచాం.
- source_word: שָׁמָע
  choice: షామా
  rationale: మసొరెటికు పాఠంలోని వ్యక్తి పేరును నేరుగా లిప్యంతరీకరించాం.
- source_word: ויעואל
  choice: యెయూయేలు
  rationale: మూల హల్లుల రూపానికి అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం; ముందున్న ו ను జాబితా నిర్మాణంలో తెలుగు విరామచిహ్నంతో సహజంగా వ్యక్తపరిచాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: బహువచన నిర్మాణరూపాన్ని సహజమైన తెలుగు బంధుత్వ పదంతో అనువదించాం.
- source_word: חוֹתָם
  choice: హోతాము
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הָעֲרֹעֵרִי
  choice: అరోయేరీయుడు
  rationale: అరోయేరు అనే స్థలానికి చెందినవాడని తెలిపే జాతివాచకాన్ని తెలుగులో స్పష్టంగా రూపొందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/వీరుల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. హెబ్రీ వాక్యక్రమాన్ని యథాతథంగా అనుసరించకుండా, హోతాము కుమారులు షామా మరియు యెయూయేలు అని స్పష్టమయ్యే సహజ తెలుగు క్రమాన్ని ఎంచుకున్నాం.
