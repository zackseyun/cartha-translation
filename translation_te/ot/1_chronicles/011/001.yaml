source:
  edition: WLC
  text: וַ/יִּקָּבְצ֧וּ כָֽל יִשְׂרָאֵ֛ל אֶל דָּוִ֖יד חֶבְר֣וֹנָ/ה לֵ/אמֹ֑ר הִנֵּ֛ה עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/001.yaml
  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలీయులందరూ హెబ్రోనులో దావీదు దగ్గరకు సమకూడి, “ఇదిగో, మేము నీ ఎముకనీ నీ మాంసాన్నీ” అని చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “ఇదిగో, మేము నీ ఎముక, నీ మాంసం.” ఇది దగ్గరి బంధుత్వాన్ని, ఒకే ప్రజకు చెందిన అనుబంధాన్ని తెలిపే హీబ్రూ నుడికారం.'
    reason: ప్రధాన పాఠంలో మూలరూపకాన్ని నిలుపుతూ, దాని నుడికారార్థాన్ని పాఠకుడికి తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: సమకూడి
  rationale: సమూహంగా ఒకరి దగ్గరికి చేరడాన్ని సూచించే హీబ్రూ క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగులో వ్యక్తుల సమూహార్థం స్పష్టంగా ఉండేందుకు ఈ రూపం ఎంచుకున్నాం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: మాటపై శ్రద్ధ పెట్టించే హీబ్రూ సూచనావ్యయ బలాన్ని సాధారణ సంభాషణలో సహజంగా నిలుపుతుంది.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: నీ ఎముకనూ నీ మాంసాన్నీ
  rationale: బంధుత్వం, ఒకే ప్రజకు చెందిన అనుబంధం తెలిపే మూలభాషా రూపకాన్ని వివరణగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నీ ఎముక, నీ మాంసం’ అనే బంధుత్వ రూపకం
  choice: రూపకాన్ని నేరుగా నిలుపడం
  alternative: ‘మేము నీ రక్తసంబంధులం’ లేదా ‘మేము నీ సొంత ప్రజలం’
  rationale: మూలంలోని శరీర సంబంధిత నిబంధనా/బంధుత్వ భాషకు ఉన్న విస్తృత ప్రతిధ్వనిని ఒకే వివరణకు పరిమితం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. మూలంలోని రూపకం మరియు ఉద్ఘాటన నిలుపబడ్డాయి.
