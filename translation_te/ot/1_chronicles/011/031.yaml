lexical_decisions:
- source_word: אִיתַי
  choice: ఇత్తయి
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן רִיבַי
  choice: రీబయి కుమారుడు
  rationale: నేరమైన తండ్రీకొడుకుల సంబంధాన్ని తెలిపే హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: מִגִּבְעַת
  choice: గిబియాకు చెందిన
  rationale: מִן ఉపసర్గ ఇక్కడ మూలస్థానం లేదా అనుబంధాన్ని సూచిస్తుంది; గిబియా స్థలనామం కావడంతో అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీనీయుల
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు’; గోత్రసందర్భంలో ఇది బెన్యామీను గోత్ర సభ్యులను సూచిస్తుంది. సహజమైన తెలుగులో గోత్రార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: בְּנָיָה
  choice: బెనాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: הַפִּרְעָתֹנִי
  choice: పిరాతోనీయుడైన
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న ఈ జనజాతి/స్థలనివాస సూచక రూపం పిరాతోనుతో బెనాయాకు ఉన్న మూలస్థాన లేదా వంశ అనుబంధాన్ని తెలియజేస్తుంది.
