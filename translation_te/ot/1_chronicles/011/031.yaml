translation_notes:
  register: వీరుల జాబితికి తగిన సంక్షిప్త, గంభీర శైలిని పాటించాం. తెలుగు వాక్యప్రవాహం కోసం మూలంలోని వివరాలను వ్యక్తినామాలకు ముందు ఉంచినా, సమాచార సంబంధాలను యథాతథంగా కాపాడాం. వచనం తదుపరి జాబితాతో కొనసాగుతున్నందున చివర అర్ధవిరామ చిహ్నం ఉంచాం.
