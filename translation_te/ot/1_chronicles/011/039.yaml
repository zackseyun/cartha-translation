translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/వీరుల జాబితాకు తగిన గౌరవప్రదమైన సంక్షిప్త శైలి వాడబడింది. మూలంలోని జాబితా నిర్మాణాన్ని సెమికోలన్, డ్యాష్‌లతో స్పష్టపరచి, ఆయుధవాహకుడు అనే పదానికి అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చబడింది.
