  text: צֶ֖לֶק הָ/עַמּוֹנִ֑י נַחְרַי֙ הַ/בֵּ֣רֹתִ֔י נֹשֵׂ֕א כְּלֵ֖י יוֹאָ֥ב בֶּן צְרוּיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/039.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: te
  text: అమ్మోనీయుడైన సెలెక్, బెయేరోతీయుడైన నహరై, సెరూయా కుమారుడైన యోవాబుకు ఆయుధవాహకుడు[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “సెరూయా కుమారుడైన యోవాబు ఆయుధాలను మోసేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶלֶק
  choice: సెలెక్
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הָעַמּוֹנִי
  choice: అమ్మోనీయుడైన
  rationale: నిర్దిష్ట సూచనతో ఉన్న జాతివాచక పదం; వీరుల జాబితాలో సెలెక్ జాతి లేదా ప్రాంతీయ గుర్తింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נַחְרַי
  choice: నహరై
  rationale: వ్యక్తి పేరు; మసొరెటిక్ స్వరరూపాన్ని ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: הַבֵּרֹתִי
  choice: బెయేరోతీయుడైన
  rationale: బెయేరోతు ప్రాంతానికి చెందినవాడని తెలిపే జాతి/ప్రాంతవాచక రూపం; మూల స్థలనామంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: נֹשֵׂא כְּלֵי
  choice: ఆయుధవాహకుడు
  rationale: అక్షరార్థంగా ఆయుధాలు లేదా యుద్ధసామగ్రి మోసేవాడని అర్థమయ్యే స్థిర హీబ్రూ పదబంధం; ఆధునిక తెలుగులో పదవిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తి పేరు.
- source_word: בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడైన
  rationale: యోవాబును తల్లి వంశసంబంధం ద్వారా గుర్తించే హీబ్రూ సమాసాన్ని స్పష్టంగా నిలుపుతుంది.
