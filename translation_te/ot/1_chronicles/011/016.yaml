  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘అప్పుడు’ అనే పద పునరావృతాన్ని ఉద్దేశపూర్వకంగా నిలుపుకున్నాం.
