  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: te
  text: దావీదు అప్పుడు దుర్గంలో[a] ఉన్నాడు; ఫిలిష్తీయుల సైనిక దండు అప్పుడు[b] బేత్లెహేములో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కోటలో’.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ మూలంలో రెండు ఉపవాక్యాల్లోనూ ‘అప్పుడు’ అని ఉంది: ‘దావీదు అప్పుడు దుర్గంలో ఉన్నాడు; ఫిలిష్తీయుల సైనిక దండు అప్పుడు బేత్లెహేములో ఉంది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּצוּדָה
  choice: దుర్గం
  rationale: ఈ పదం రక్షణకు అనువైన బలమైన, కోటలాంటి స్థలాన్ని సూచిస్తుంది. సైనిక సందర్భంలో ‘దుర్గం’ సహజంగా ఉండి దాని స్పష్టమైన భావాన్ని నిలుపుతుంది.
- source_word: נְצִיב
  choice: సైనిక దండు
  rationale: ఫిలిష్తీయులకు చెందినదిగా, బేత్లెహేములో ఉన్నదిగా చెప్పబడిన ఈ సందర్భంలో ఇది పౌర అధికారిని కాకుండా అక్కడ మోహరించిన సైనిక దళాన్ని సూచిస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజా సమూహానికి తెలుగులో స్థిరపడిన, గుర్తించదగిన రూపం.
- source_word: בְּבֵית לָחֶם
  choice: బేత్లెహేములో
  rationale: בְ స్థలాన్ని సూచిస్తుంది; పట్టణంలో ఉన్నదనే భావానికి ‘బేత్లెహేములో’ సహజమైన తెలుగు రూపం.
- source_word: אָז ... אָז
  choice: అప్పుడు ... అప్పుడు
  rationale: హీబ్రూ రెండు ఉపవాక్యాల్లోనూ אָזను పునరావృతం చేస్తుంది. ఆ కాలసూచనను, మూల వాక్య నిర్మాణాన్ని తెలుగులోనూ నిలుపుకోవడానికి పునరావృతాన్ని ఉంచాం.
- source_word: וְדָוִיד
  choice: దావీదు
  rationale: వాక్యారంభంలోని וְ కథనాన్ని కొనసాగిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరి’ లేదా ‘ఇప్పుడు’ చేర్చకుండానే సందర్భసంబంధం సహజంగా తెలుస్తుంది.
