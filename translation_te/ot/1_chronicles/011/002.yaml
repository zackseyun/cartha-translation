id: 1CH.11.2
reference: 1 Chronicles 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: te
  text: 'గతంలో కూడా[a], సౌలు రాజుగా ఉన్నప్పుడు కూడా, నీవే ఇశ్రాయేలును బయటికి నడిపించేవాడివి, లోపలికి తీసుకువచ్చేవాడివి[b]. నీ దేవుడైన యాహ్వే నీతో ఇలా అన్నాడు: “నా ప్రజలైన ఇశ్రాయేలును నీవు కాపరిగా నడిపిస్తావు; నా ప్రజలైన ఇశ్రాయేలుపై నీవు అధిపతిగా ఉంటావు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్ననూ, మొన్ననూ.” ఇది “గతంలో” లేదా “పూర్వకాలంలో” అనే అర్థమిచ్చే హీబ్రూ నానుడి.
    reason: lexical_alternative
  - marker: b
    text: “బయటికి నడిపించడం, లోపలికి తీసుకురావడం” అనేది ప్రజలకు నాయకత్వం వహించడాన్ని సూచించే హీబ్రూ వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: c
    text: “నాయకుడు” లేదా “ప్రధానుడు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం సాధారణంగా “రాజు”కు వాడే పదం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: గతంలోనూ
  rationale: ఈ పదబంధానికి అక్షరార్థం ‘నిన్ననూ, మొన్ననూ’; అయితే ఇక్కడ అది పూర్వకాలాన్ని సూచించే హీబ్రూ నానుడి. సహజమైన ఆధునిక తెలుగులో దాని సందర్భార్థాన్ని అందించేందుకు ‘గతంలోనూ’ అని అనువదించాం.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: సౌలు రాజుగా ఉన్నప్పుడు కూడా
  rationale: בְּతో కూడిన infinitive construct కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. ‘కూడా’ అనే పదం మూలంలోని గַּם నొక్కిచెప్పే భావాన్ని నిలుపుతుంది.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును బయటికి నడిపించి, తిరిగి లోపలికి తీసుకొచ్చింది నువ్వే
  rationale: దావీదు ప్రజలకు నాయకత్వం వహించాడనే భావంతో పాటు, మూలంలోని ‘బయటికి నడిపించడం, లోపలికి తీసుకురావడం’ అనే స్పష్టమైన చిత్రణను కూడా నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: תִרְעֶה
  choice: కాపరిగా మేపుతావు
  rationale: రాజును కాపరితో పోల్చే మూలభాషా రూపకాన్ని స్పష్టంగా నిలిపేందుకు ‘పాలిస్తావు’ అనే సాధారణీకరణకు బదులు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: נָגִיד
  choice: అధిపతి
  rationale: ఈ పదం నియమిత నాయకుడు లేదా పరిపాలకుణ్ణి సూచిస్తుంది; ఇది מֶלֶךְ (‘రాజు’) అనే పదానికి సమానం కాదు. ఆ భేదాన్ని ‘అధిపతి’ నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ఆధునిక ప్రామాణిక తెలుగులో పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: תִרְעֶהలోని నాయకత్వ రూపకం
  choice: నా ప్రజలైన ఇశ్రాయేలును నువ్వు కాపరిగా మేపుతావు
  alternative: నా ప్రజలైన ఇశ్రాయేలును నువ్వు పాలిస్తావు; వారిని సంరక్షిస్తావు
  rationale: హీబ్రూ పాఠం కాపరి రూపకాన్ని ఉద్దేశపూర్వకంగా ఉపయోగిస్తుంది. రాజనాయకత్వం, సంరక్షణ రెండింటినీ సూచించే ఆ రూపకాన్ని సిద్ధాంతపరంగా సంకుచితం చేయకుండా నిలిపాం.
- issue: נָגִידను מֶלֶךְతో వేరు చేయడం
  choice: అధిపతి
  alternative: రాజు; నాయకుడు; ప్రధానుడు
  rationale: వచనంలో సౌలుకు מֶלֶךְ (‘రాజు’) అని, దావీదుకు נָגִיד అని వేర్వేరు పదాలు ఉన్నాయి. రెండింటినీ ‘రాజు’గా అనువదించకుండా ఆ పదభేదాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలిని వాడాం. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు’ మూలంలోని రెండవ పురుష ఏకవచనాన్ని సహజంగా ప్రతిబింబిస్తుంది. కాపరి రూపకాన్ని, నాయకత్వ నానుడిని, ‘రాజు/అధిపతి’ పదభేదాన్ని నిలిపాం.
