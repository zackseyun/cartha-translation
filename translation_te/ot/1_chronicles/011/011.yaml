revisions:
- from: 'దావీదుకు చెందిన పరాక్రమశాలుల లెక్క ఇది: హక్మోనీ కుమారుడైన యాషొబాము, ముప్పది మందికి అధిపతి. అతడు ఒకే పోరాటంలో మూడువందల మందిమీద తన ఈటెను ప్రయోగించి వారిని హతమార్చాడు.[a]'
  to: 'దావీదుకు చెందిన పరాక్రమశాలుల జాబితా ఇది: హక్మోనీ కుమారుడైన యాషోబాము ముప్పది మందికి అధిపతి. అతడు ఒకే సందర్భంలో మూడువందల మంది హతులపై తన ఈటెను ఎత్తాడు.[a]'
  rationale: The revision improves the roster-heading idiom and name spelling, and, more importantly, avoids making the implied result of the spear action into an explicit finite clause. It preserves the Hebrew's difficult and compressed wording while giving readers a concise lexical footnote.
  reviewer_model: gpt-5.6-terra
