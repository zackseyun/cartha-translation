source:
  edition: WLC
  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: te
  text: 'దావీదుకు చెందిన పరాక్రమశాలుల జాబితా ఇది: హక్మోనీ కుమారుడైన యాషోబాము ముప్పది మందికి అధిపతి. అతడు ఒకే సందర్భంలో మూడువందల మంది హతులపై తన ఈటెను ఎత్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఒకే సందర్భంలో మూడువందల మంది హతులపై తన ఈటెను ఝళిపించాడు/ప్రయోగించాడు.” హెబ్రీ వాక్యం సంక్షిప్తంగా ఉంది. ‘ఈటెను ఎత్తాడు’ అనే క్రియకు ‘ఝళిపించాడు’ లేదా ‘ప్రయోగించాడు’ అనే అనువాదాలూ సాధ్యమే; ‘హతులు’ అనే పదం యుద్ధంలో చనిపోయినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: లెక్క
  rationale: మూలపదానికి ‘సంఖ్య, లెక్క’ అనే ప్రత్యక్ష అర్థం ఉంది. ఇక్కడ ఇది యోధుల వివరాలను పరిచయం చేస్తుంది; ‘లెక్క’ మూలరూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: הַגִּבֹּרִים
  choice: పరాక్రమశాలులు
  rationale: ఈ పదం బలవంతులు, వీరులు, శూరయోధులు అనే భావాలను కలిగి ఉంది. దావీదు సైనికుల సందర్భంలో ‘పరాక్రమశాలులు’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: אֲשֶׁר לְדָוִיד
  choice: దావీదుకు చెందిన
  rationale: లామెద్ సూచించే సంబంధం లేదా అధీనతను అతిగా వ్యాఖ్యానించకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: హక్మోనీ కుమారుడైన యాషొబాము
  rationale: వ్యక్తి పేర్లను లిప్యంతరీకరించి, మూలంలోని వంశసంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: רֹאשׁ הַשלושים
  choice: ముప్పది మందికి అధిపతి
  rationale: רֹאשׁ హోదా సందర్భంలో నాయకుడు లేదా అధిపతి అని అర్థం. ‘ముప్పది మంది’ అనే ప్రత్యేక యోధబృంద సూచనను అలాగే ఉంచింది.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: తన ఈటెను ప్రయోగించి
  rationale: עוֹרֵר కు ప్రాథమికంగా ‘లేపు, ప్రేరేపించు’ అనే అర్థం ఉన్నా, ఈటెతో కూడిన యుద్ధ నుడికారంలో దానిని చురుకుగా ఉపయోగించడమే ఉద్దేశం. ‘ప్రయోగించి’ తెలుగులో సహజమైన యుద్ధవ్యక్తీకరణ.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: మూడువందల మందిమీద ... వారిని హతమార్చాడు
  rationale: עַל విరోధ దిశను సూచిస్తుంది; חָלָל యుద్ధంలో హతమైనవారిని సూచిస్తుంది. తెలుగు వాక్యంలో ఫలితాన్ని స్పష్టంగా వ్యక్తం చేయడానికి ‘వారిని హతమార్చాడు’ అని ఇచ్చింది.
- source_word: בְּפַעַם אֶחָת
  choice: ఒకే పోరాటంలో
  rationale: అక్షరార్థంగా ‘ఒకే సమయంలో/ఒకే సందర్భంలో.’ యుద్ధ సందర్భంలో ‘ఒకే పోరాటంలో’ ఒకే సంఘటనను సహజంగా తెలియజేస్తుంది; ఒకే దెబ్బతో అన్న అతిశయార్థాన్ని కలిగించదు.
