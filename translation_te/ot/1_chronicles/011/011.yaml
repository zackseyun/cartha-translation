translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సైనిక సందర్భం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ పదాలను ఎంచుకున్నాం; మూలంలోని సంక్షిప్త ఈటె నుడికారానికి పాదసూచికలో మరింత అక్షరార్థ ప్రత్యామ్నాయం ఇచ్చాం.
