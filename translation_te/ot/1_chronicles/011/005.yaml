source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ יֹשְׁבֵ֤י יְבוּס֙ לְ/דָוִ֔יד לֹ֥א תָב֖וֹא הֵ֑נָּה וַ/יִּלְכֹּ֤ד דָּוִיד֙ אֶת מְצֻדַ֣ת צִיּ֔וֹן הִ֖יא עִ֥יר דָּוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: te
  text: యెబూసు నివాసులు దావీదుతో, “నీవు ఇక్కడికి రాలేవు[a]” అన్నారు. కానీ దావీదు సీయోను కోటను స్వాధీనం చేసుకున్నాడు; అదే దావీదు నగరం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఇక్కడికి రావు” లేదా “నీవు ఇక్కడికి ప్రవేశించలేవు.” హీబ్రూలో అక్షరార్థంగా “నీవు ఇక్కడికి రావు” అని ఉంది; సందర్భంలో ఇది ప్రవేశాన్ని నిరాకరించే మాట.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: యెబూసు నివాసులు
  rationale: ఈ నిర్మాణం యెబూసులో నివసించేవారిని సమష్టిగా సూచిస్తుంది. ‘నివాసులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: నువ్వు ఇక్కడికి ప్రవేశించలేవు
  rationale: అక్షరార్థంగా ‘నువ్వు ఇక్కడికి రావు’ అయినా, సందర్భంలో ఇది ప్రవేశాన్ని నిరాకరించే సవాలు. ‘ప్రవేశించలేవు’ ఆ సందర్భబలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: సైనిక సందర్భంలో ఈ క్రియ ఒక స్థలాన్ని పట్టుకోవడం లేదా జయించి వశపరచుకోవడం సూచిస్తుంది. ‘స్వాధీనం చేసుకున్నాడు’ కోటను చేజిక్కించుకున్న భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מְצֻדַת צִיּוֹן
  choice: సీయోను కోట
  rationale: מְצוּדָה రక్షణ కలిగిన దుర్గం లేదా కోటను సూచిస్తుంది. ‘కోట’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సహజ పదం.
- source_word: הִיא עִיר דָּוִיד
  choice: అదే దావీదు నగరం
  rationale: ఈ నామవాచక వాక్యం సీయోను కోటను ‘దావీదు నగరం’గా గుర్తిస్తుంది. ‘అదే’ అనే రూపం ఆ గుర్తింపు సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עִיר דָּוִיד
  choice: దావీదు నగరం
  rationale: సందర్భంలో ఇది స్థిరమైన ప్రదేశనామసదృశ బిరుదు; తెలుగులో ‘దావీదు నగరం’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు’ మూలంలోని రెండవ పురుష ఏకవచనాన్ని సహజంగా ప్రతిబింబిస్తుంది. ‘అయినా’ ప్రతిఘటనకు విరుద్ధంగా దావీదు సాధించిన విజయాన్ని స్పష్టం చేస్తుంది.
