  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: te
  text: దావీదు ఆ దుర్గంలో[a] నివసించాడు; అందుచేత దానికి దావీదు నగరం అని పేరు పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కోట.’ హీబ్రూ పదం మְצָד రక్షణ ఏర్పాట్లు గల బలమైన స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב అనే క్రియకు మౌలికంగా ‘కూర్చున్నాడు’ అనే అర్థం ఉన్నా, ఒక స్థలంతో కూడిన ఈ కథన సందర్భంలో అది ‘నివసించాడు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: בַּמְצָד
  choice: ఆ దుర్గంలో
  rationale: מְצָד అనేది రక్షణ ఏర్పాట్లు గల బలమైన స్థలాన్ని సూచిస్తుంది. ‘దుర్గం’ దాని సైనిక, రక్షణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; నిర్దిష్ట స్థలాన్ని సూచించే హీబ్రూ ఉపపదాన్ని ‘ఆ’తో వ్యక్తం చేశాం.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ఈ పదబంధం ముందు చెప్పిన చర్యకు కలిగిన పరిణామాన్ని పరిచయం చేస్తుంది; ‘అందుచేత’ కారణ-ఫల సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קָרְאוּ לוֹ
  choice: దానికి … అని పేరు పెట్టారు
  rationale: קרא అనే క్రియ ఇక్కడ పేరుపెట్టడాన్ని సూచిస్తుంది. హీబ్రూలో క్రియ బహువచన కర్తతో ఉన్నందున దాన్ని కర్తను పేర్కొనని తెలుగు బహువచన రూపంలో సహజంగా అనువదించాం.
- source_word: עִיר דָּוִיד
  choice: దావీదు నగరం
  rationale: ఇది బైబిలు వాడుకలో స్థిరమైన స్థలనామం; తెలుగు పదక్రమంలో గుర్తించదగిన పేరుగా ‘దావీదు నగరం’ అని ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘దుర్గం’ మూలంలోని రక్షణ భావాన్ని నిలుపుతుంది; ‘కోట’ను పాదసూచికలో సాధారణ ప్రత్యామ్నాయంగా ఇచ్చాం.
