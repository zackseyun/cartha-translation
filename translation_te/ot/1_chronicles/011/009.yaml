source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: te
  text: దావీదు అంతకంతకు గొప్పవాడయ్యాడు[a]; సైన్యాలకు అధిపతియైన యాహ్వే అతనితో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “దావీదు వెళ్లాడు, వెళ్తూ గొప్పవాడవుతూ ఉన్నాడు”; ఇది అతడు క్రమంగా మరింత గొప్పవాడయ్యాడని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: అంతకంతకు గొప్పవాడయ్యాడు
  rationale: ఈ హెబ్రీ ఇడియమ్ అక్షరార్థంగా వెళ్లడాన్ని కాకుండా, క్రమంగా కొనసాగుతున్న వృద్ధిని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో దాని ప్రగతిశీల బలాన్ని ‘అంతకంతకు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דָּוִיד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- source_word: צְבָאוֹת
  choice: సైన్యాలకు అధిపతి
  rationale: ‘సైన్యాలు’ అనే మూల చిత్రాన్ని నిలుపుతూ, తెలుగులో సహజంగా అర్థమయ్యే దైవబిరుదుగా వ్యక్తం చేసింది.
- source_word: עִמּוֹ
  choice: అతనితో ఉన్నాడు
  rationale: עם అనే ఉపసర్గలోని సన్నిధి లేదా సహవాస భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దేవుని నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూల వచనం దేవుని ప్రత్యేక నామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: צְבָאוֹת అనే దైవబిరుదు
  choice: సైన్యాలకు అధిపతియైన
  alternative: సైన్యాల యాహ్వే / సర్వశక్తిమంతుడు
  rationale: ఈ రూపం సైన్యాలనే మూల రూపకాన్ని నిలుపుతూ తెలుగులో సంబంధాన్ని సహజంగా తెలుపుతుంది; ‘సర్వశక్తిమంతుడు’ అనేది మరింత వ్యాఖ్యాత్మకమైన అర్థ విస్తరణ.
- issue: రెండు వాక్యభాగాల సంబంధం
  choice: సమన్వయార్థక విరామచిహ్నంతో కలపడం
  alternative: ‘ఎందుకంటే’ అనే కారణార్థక సంధి
  rationale: హెబ్రీ וַ సాధారణ సమన్వయాన్ని తెలుపుతుంది; దావీదు ఎదుగుదలకు యాహ్వే సన్నిధిని స్పష్టమైన కారణంగా మార్చే అదనపు భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. మూలంలోని సమన్వయాన్ని కాపాడటానికి కారణార్థక పదాన్ని చేర్చలేదు.
