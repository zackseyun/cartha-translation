translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హీబ్రూ వాక్యంలోని సంబంధవాచక పదాన్ని ఊహాత్మకంగా నిర్దిష్ట ప్రాంతంగా నిర్ణయించకుండా దాని అనిశ్చితి పాదసూచికలో నిలుపబడింది.
