  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
