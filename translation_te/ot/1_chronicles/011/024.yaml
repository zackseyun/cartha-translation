translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ ‘పేరు’ నుడికారాన్ని పూర్తిగా అక్షరార్థంగా కాకుండా సహజమైన తెలుగు నుడికారంతో వ్యక్తపరిచింది.
