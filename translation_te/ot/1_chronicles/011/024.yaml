  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: te
  text: యెహోయాదా కుమారుడైన బెనాయా ఈ కార్యాలు చేశాడు; ఆ ముగ్గురు శూరులలో అతనికి పేరు ఉంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ముగ్గురు శూరులలో అతనికి ప్రఖ్యాతి ఉంది.” హీబ్రూలో అక్షరార్థంగా, “అతనికి పేరు ఉంది.”
    reason: Preserves the literal Hebrew idiom while supplying its contextual sense of renown.
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: ఈ కార్యాలు చేశాడు
  rationale: ముందు వివరించిన బెనాయా సాహసకార్యాలను సూచించే బహువచన సర్వనామాన్ని, עשה అనే సాధారణ క్రియతో సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన బంధ సూచక రూపంతో అందిస్తూ వ్యక్తుల పేర్లను లిప్యంతరీకరిస్తుంది.
- source_word: וְלוֹ שֵׁם
  choice: అతనికి పేరు ప్రఖ్యాతులు వచ్చాయి
  rationale: అక్షరార్థంగా ‘అతనికి పేరు ఉంది’ అనే హీబ్రూ నుడికారం ఇక్కడ కీర్తి లేదా ప్రసిద్ధిని సూచిస్తుంది; ‘పేరు ప్రఖ్యాతులు వచ్చాయి’ ఆ భావాన్ని సహజంగా అందించడంతో పాటు ‘పేరు’ అనే మూలరూప ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: ఆ ముగ్గురు పరాక్రమశాలులలో
  rationale: ב అనే ఉపసర్గను సమూహంలో గుర్తింపు లేదా స్థానం అనే భావంలో ‘లో’గా అందించింది; גִּבֹּרִים దావీదు శ్రేష్ఠ యోధులను సూచించే సందర్భంలో ‘పరాక్రమశాలులు’ గౌరవప్రదంగా, సైనిక భావానికి అనుకూలంగా ఉంటుంది.
