- from: యెహోయాదా కుమారుడైన బెనాయా ఈ కార్యాలు చేశాడు; ఆ ముగ్గురు పరాక్రమశాలులలో అతనికి పేరు ప్రఖ్యాతులు వచ్చాయి.
  to: యెహోయాదా కుమారుడైన బెనాయా ఈ కార్యాలు చేశాడు; ఆ ముగ్గురు శూరులలో అతనికి పేరు ఉంది[a].
  rationale: The revision retains the reference to Benaiah’s preceding deeds and his standing among the three, but renders וְלוֹ שֵׁם more closely and naturally as “అతనికి పేరు ఉంది.” “శూరులు” provides a concise, standard Telugu designation for the mighty men, and the note preserves the Hebrew’s literal expression and its possible sense of renown.
