language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: te
  text: వారు ఆ పొలం మధ్యలో స్థానం చేపట్టి దాన్ని కాపాడారు; ఫిలిష్తీయులను కొట్టారు; యెహోవా గొప్ప విజయాన్ని కలుగజేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా గొప్ప రక్షణను కలుగజేశాడు”; లేదా, “యెహోవా గొప్ప విజయాన్ని ప్రసాదించాడు.”
    reason: תְּשׁוּעָה అనే పదం సందర్భానుసారం రక్షణ, విడుదల లేదా విజయం అని అర్థమివ్వగలదు; హెబ్రీ నిర్మాణాన్ని తెలుగులో ఒకటి కంటే ఎక్కువ సహజ విధాలుగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: వారు ... నిలబడి
  rationale: హిత్పయేల్ రూపం ఉద్దేశపూర్వకంగా స్థానం చేపట్టి దృఢంగా నిలబడడాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో సహజమైన తెలుగుగా ఇచ్చాం.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: ఆ పొలం మధ్యలో
  rationale: חֶלְקָה సాగుచేసే భూభాగాన్ని లేదా పొలంలోని భాగాన్ని సూచిస్తుంది. సందర్భానికి తగిన సాధారణ తెలుగు పదం ‘పొలం’.
- source_word: וַיַּצִּילוּהָ
  choice: దాన్ని కాపాడారు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న పొలాన్ని సూచిస్తుంది. נצל యొక్క రక్షించడం/విడిపించడం అనే భావాన్ని, శత్రువుల చేతికి చిక్కకుండా పొలాన్ని కాపాడిన సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను హతమార్చారు
  rationale: యుద్ధ సందర్భంలోని נכה కేవలం కొట్టడం కంటే సంహారకంగా దెబ్బతీయడం అనే బలమైన భావాన్ని కలిగి ఉంది; ‘హతమార్చారు’ దాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: యెహోవా గొప్ప విజయాన్ని కలుగజేశాడు
  rationale: క్రియ ישׁע మరియు సంబంధిత నామవాచకం תְּשׁוּעָה కలిసి గొప్ప రక్షణ లేదా విజయాన్ని సాధింపజేయడాన్ని తెలిపే హెబ్రీ ప్రయోగం. యుద్ధ సందర్భంలో ‘గొప్ప విజయాన్ని కలుగజేశాడు’ సహజంగా ఉంటుంది; లేని కర్మను చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: וַיּוֹשַׁע ... תְּשׁוּעָה గల రక్షణ–విజయం భావం
  choice: గొప్ప విజయాన్ని కలుగజేశాడు
  alternative: గొప్ప రక్షణను కలుగజేశాడు
  rationale: తక్షణ యుద్ధ సందర్భం ‘విజయం’ అనే భావానికి మద్దతిస్తుంది; అయినా నామవాచకంలో ఉన్న విస్తృత ‘రక్షణ/విడుదల’ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని వరుస చర్యలను స్పష్టత కోసం మూడు చిన్న వాక్యాలుగా ఇచ్చాం; బహువచన కర్తను, పొలాన్ని సూచించే ఏకవచన కర్మను యథాతథంగా నిలిపాం.
