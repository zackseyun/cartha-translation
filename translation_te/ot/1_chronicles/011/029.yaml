  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశ లేదా ప్రాంత సంబంధాన్ని ‘-ీయుడైన’ రూపంతో స్పష్టంగా తెలిపాం. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా, సాధారణ పాఠకుడు సులభంగా చదవగలిగే విధంగా లిప్యంతరీకరించాం.
