    reason: alternative_reading
  revision_rationale: 'The revision makes two limited transliteration corrections: it represents the short initial vowel of חֻשָׁתִי as ‘హు’ and represents the final Hebrew -ay in סִבְּכַי as ‘యి’. It retains the source order, the gentilic force, the Masoretic reading ‘ఈలై’, and the existing alternative-reading footnote.'
