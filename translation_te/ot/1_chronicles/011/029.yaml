lexical_decisions:
- source_word: סִבְּכַי
  choice: సిబ్బెకై
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַחֻשָׁתִי
  choice: హూషాతీయుడైన
  rationale: స్థలం లేదా వంశాన్ని సూచించే హీబ్రూ విశేషణ రూపాన్ని సహజమైన తెలుగు సంబంధవాచక రూపంలో ఇచ్చాం.
- source_word: עִילַי
  choice: ఈలై
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం עִילַי ను అనుసరించి పేరును ‘ఈలై’గా లిప్యంతరీకరించాం; సమాంతర వచన ప్రభావంతో వచ్చే ‘ఈరై’ని ప్రధాన పాఠంలో స్వీకరించలేదు.
- source_word: הָאֲחוֹחִי
  choice: అహోహీయుడైన
  rationale: అహోహ వంశం లేదా గోత్రానికి చెందినవాడనే అర్థాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేశాం.
