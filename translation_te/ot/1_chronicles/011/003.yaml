id: 1CH.11.3
reference: 1 Chronicles 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు పెద్దలందరూ హెబ్రోనులో రాజు వద్దకు వచ్చారు. దావీదు హెబ్రోనులో యాహ్వే సన్నిధిలో వారితో నిబంధన చేశాడు. అప్పుడు సమూయేలు ద్వారా[a] యాహ్వే పలికిన మాట ప్రకారం వారు దావీదును ఇశ్రాయేలుమీద రాజుగా అభిషేకించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “సమూయేలు చేతి ద్వారా”; అంటే “సమూయేలు ద్వారా.”'
    reason: హీబ్రూ నుడికారం యొక్క అక్షరార్థాన్ని తెలియజేసి, ప్రధాన పాఠంలోని సహజ తెలుగు అనువాదాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: זִקְנֵי
  choice: పెద్దలు
  rationale: ఇది ఇశ్రాయేలు సమాజానికి అధికారిక ప్రతినిధులైన పెద్దలను సూచించే సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో ఇక్కడ వ్యక్తిపేరు కాక బిరుదే ఉంది; తరువాతి వాక్యంలో అతడు దావీదు అని స్పష్టమవుతుంది.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: మొదటి రూపం హెబ్రోను వైపు ప్రయాణాన్ని సూచించినా, రాజు ఉన్న ప్రదేశాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘హెబ్రోనులో ఉన్న రాజు దగ్గరికి’ అని అనువదించబడింది; రెండో రూపం నిబంధన జరిగిన ప్రదేశాన్ని నేరుగా సూచిస్తుంది.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: నిబంధన చేశాడు
  rationale: అక్షరార్థంగా ‘నిబంధన కోశాడు’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో స్పష్టమైన సమానార్థక వ్యక్తీకరణ ఇది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో, ఆయన సాక్షిగా నిబంధన చేయబడిందనే గంభీర భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּמְשְׁחוּ
  choice: అభిషేకించారు
  rationale: రాజును నియమించే సందర్భంలోని నూనెతో అభిషేకించే నిర్దిష్ట చర్యను, దాని రాజనియామక భావంతో సహా తెలియజేస్తుంది.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజుగా
  rationale: ఇశ్రాయేలుపై రాజ్యాధికారం కోసం దావీదు నియమించబడినట్లు సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యాహ్వే పలికిన మాట ప్రకారం
  rationale: דָבָר యొక్క ‘మాట’ భావాన్ని నిలుపుతూ, ఇది యాహ్వే పలికిన వాక్కు అని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘వాగ్దానం’ అని అర్థాన్ని కుదించదు.
- source_word: בְּיַד שְׁמוּאֵל
  choice: సమూయేలు ద్వారా
  rationale: అక్షరార్థమైన ‘సమూయేలు చేతి ద్వారా’ అనే హీబ్రూ నుడికారం ఇక్కడ మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆధునిక తెలుగులో సహజమైన రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన టెట్రాగ్రామటన్ నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలు శైలి వాడబడింది. ‘పెద్దలు,’ ‘నిబంధన,’ ‘సన్నిధి,’ ‘అభిషేకం’ వంటి స్థిరమైన పదాలు సందర్భ గంభీరతను నిలుపుతాయి.
