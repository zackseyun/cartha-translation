  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
translation:
  language: te
  text: గాయషు వాగులోయలకు చెందిన హూరై[a], అర్బాతీయుడైన అబీయేలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గాయషు లోయలకు చెందిన’ లేదా ‘గాయషు వాగులకు చెందిన.’ హీబ్రూ పదం వాగులోయను, కనుమను, వరదనీటి ప్రవాహ మార్గాన్ని లేదా లోయను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అర్బాతీయుడు’ అనేది అర్బాతు ప్రాంతానికి చెందిన వ్యక్తిని సూచించే పదం; అది అరాబా ప్రాంతంతో సంబంధం కలిగి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: హూరై
  rationale: వ్యక్తి పేరు కాబట్టి అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాయబడింది.
- source_word: מִנַּחֲלֵי
  choice: వాగులోయల నుండి వచ్చిన
  rationale: נחל అనే పదం లోయ, వాగు ప్రవహించే లోయ, కాలానుగుణ జలప్రవాహ మార్గం అనే భావాలను కలిగి ఉంది. ‘వాగులోయలు’ ఆ భౌగోళిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: גָעַשׁ
  choice: గాయషు
  rationale: స్థల నామం కాబట్టి హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: אֲבִיאֵל
  choice: అబీయేలు
  rationale: వ్యక్తి పేరు కాబట్టి తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הָעַרְבָתִי
  choice: అర్బాతీయుడైన
  rationale: ఇది ఒక ప్రాంతానికి చెందినవాడని సూచించే జాతివాచక/స్థలనివాస సూచక రూపం. ఖచ్చితమైన ప్రాంతాన్ని ఊహించి నిర్ణయించకుండా ఆ రూపమే నిలుపబడింది.
