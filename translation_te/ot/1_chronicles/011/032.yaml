translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/వీరుల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి ఉపయోగించబడింది. మూలంలోని పేర్ల జాబితా నిర్మాణం నిలుపబడింది; హీబ్రూ చివరనున్న విభాగ సూచిక అనువదించబడలేదు.
