base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: te
  text: అప్పుడు ఆ ముగ్గురు ఫిలిష్తీయుల శిబిరంలోకి చొచ్చుకుపోయి, ద్వారం దగ్గర ఉన్న బేత్లెహేము బావిలోనుంచి నీళ్లు తోడారు. వాటిని మోసుకొని దావీదు దగ్గరికి తీసుకొచ్చారు. అయితే దావీదు వాటిని తాగడానికి ఇష్టపడలేదు; వాటిని యెహోవాకు పానార్పణగా కుమ్మరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నేరుగా, “వాటిని యెహోవాకు కుమ్మరించాడు.” ఇక్కడి హీబ్రూ క్రియ పానార్పణగా కుమ్మరించే భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: చొచ్చుకుపోయి
  rationale: శత్రు శిబిరాన్ని ఛేదించి లోపలికి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַשְּׁלֹשָׁה
  choice: ఆ ముగ్గురు
  rationale: హీబ్రూలో ఉన్న ‘ఆ ముగ్గురు’ అనే సంక్షిప్త రూపాన్ని నిలుపుతుంది; ఈ వాక్యంలో లేని ‘వీరులు’ అనే పదాన్ని చేర్చదు.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరంలోకి
  rationale: చలనార్థక క్రియతో కలిసి శత్రు శిబిరంలోకి ప్రవేశించిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: నీళ్లు తోడారు
  rationale: బావిలోనుంచి నీటిని తీసే చర్యకు సాధారణ, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: ద్వారం దగ్గర ఉన్న బేత్లెహేము బావిలోనుంచి
  rationale: בּוֹר కు సందర్భానుసారంగా ‘బావి’ని ఎంచుకుని, ద్వారం సమీపంలోని స్థానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִיד
  choice: వాటిని మోసుకొని దావీదు దగ్గరికి తీసుకొచ్చారు
  rationale: నీటిని రవాణా చేసి దావీదుకు చేర్చిన వరుస చర్యలను సహజంగా తెలుపుతుంది; హీబ్రూ నీటిని వ్యాకరణపరంగా బహువచనంగా సూచించడంతో ‘వాటిని’ వాడబడింది.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: దావీదు వాటిని తాగడానికి ఇష్టపడలేదు
  rationale: אָבָה లోని సమ్మతి లేదా ఇష్టత భావాన్ని ‘నిరాకరించాడు’ కంటే నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: వాటిని యెహోవా సన్నిధిలో పానార్పణగా కుమ్మరించాడు
  rationale: נסך యొక్క కుమ్మరించే చర్యతోపాటు దాని ఆరాధనా లేదా అర్పణ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; לַיהוָה ను సహజమైన ఆరాధనా సందర్భంలో ‘యెహోవా సన్నిధిలో’గా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగిస్తుంది.
theological_decisions:
- issue: దావీదు నీటిని కుమ్మరించిన చర్యలోని ఆరాధనా ప్రాముఖ్యత
  choice: ప్రధాన పాఠ్యంలో ‘పానార్పణగా కుమ్మరించాడు’ అని స్పష్టంగా అనువదించడం
  alternative: ‘యెహోవాకు కుమ్మరించాడు’ అని కేవలం కనిపించే చర్యను మాత్రమే ప్రధాన పాఠ్యంలో ఉంచడం
  rationale: נסך అనే క్రియ ఈ సందర్భంలో సాధారణంగా కుమ్మరించడమే కాక అర్పణ లేదా పానార్పణ భావాన్ని కూడా కలిగి ఉంది. దానిని ప్రధాన పాఠ్యంలో ఉంచడం చర్య యొక్క ఉద్దేశాన్ని స్పష్టం చేస్తుంది; అయితే ఇది నియమిత బలివిధిగా జరిగిందని మించి నిర్దిష్టీకరించదు.
- issue: לַיהוָה యొక్క సంబంధార్థం
  choice: ‘యెహోవా సన్నిధిలో’
  alternative: ‘యెహోవాకు’
  rationale: హీబ్రూ దత్తివాచకం అర్పణ గ్రహీతను సూచించగలదు. తెలుగు వాక్యంలో ‘సన్నిధిలో’ అనేది దేవునికి అర్పణగా కుమ్మరించిన భావాన్ని సహజంగా అందిస్తుంది; అడుగుజాడలో మరింత నేర అనువాదం ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఆ ముగ్గురు’ అని మూలంలోని సంక్షిప్తతను నిలిపి, ‘వీరులు’ అనే సందర్భపూరక పదాన్ని చేర్చలేదు. నీటికి మూలంలోని బహువచన సూచనను అనుసరించి ‘వాటిని’ ఉపయోగించబడింది.
