  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. రెండవ ‘నెటోఫాతీయుడు’ అనే విశేషణం బయనాను సూచిస్తుందనే హీబ్రూ నిర్మాణాన్ని స్పష్టంగా నిలిపాం.
