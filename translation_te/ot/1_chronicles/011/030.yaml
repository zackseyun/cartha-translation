  text: Maharai the Netophathite[a], Heled son of Baanah the Netophathite;
translation:
  language: te
  text: నెటోఫాతీయుడైన మహరయి, నెటోఫాతీయుడైన బానా కుమారుడు హేలెదు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהְרַי
  choice: మహరై
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: הַנְּטֹפָתִי / הַנְּטוֹפָתִי
  choice: నెటోఫాతీయుడు
  rationale: నెటోఫా ప్రాంతానికి చెందిన వ్యక్తిని సూచించే హీబ్రూ జాతి/ప్రాంత సంబంధ విశేషణాన్ని సంక్షిప్తంగా అనువదించాం; మూలంలోని రెండు ప్రయోగాలనూ నిలిపాం.
- source_word: חֵלֶד
  choice: హేలెదు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి, పేర్ల జాబితా సందర్భంలో సహజమైన పుత్ర సంబంధ పదాన్ని వాడాం.
- source_word: בַּעֲנָה
  choice: బయనా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
