  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: te
  text: అతడు ఐదు మూరల[a][b] ఎత్తున్న అసాధారణమైన శరీరాకృతి గల ఐగుప్తీయుణ్ణి కొట్టి పడగొట్టాడు. ఆ ఐగుప్తీయుడి చేతిలో నేత మగ్గపు దూలంలాంటి ఈటె ఉంది. అతడు ఒక కర్ర[c]తో అతని దగ్గరకు దిగివెళ్లి, ఆ ఐగుప్తీయుడి చేతిలోని ఈటెను లాక్కొని, అతని సొంత ఈటెతోనే అతణ్ణి చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొలతగల మనిషి.” హీబ్రూ పదబంధానికి అక్షరార్థం ఇదే; సందర్భంలో అది అసాధారణమైన శరీరాకృతిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూర అనేది మోచేతి నుండి చేతివేళ్ల చివర వరకు ఉండే దూరం ఆధారంగా వాడిన ప్రాచీన పొడవు ప్రమాణం.
    reason: cultural_note
  - marker: c
    text: “కర్ర” అనే పదాన్ని “గద” లేదా “దండం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: కొట్టి పడగొట్టాడు
  rationale: నכה అనే క్రియలోని కొట్టడం అనే చర్యను నిలుపుతూ, చివర వచ్చే స్పష్టమైన ‘చంపాడు’ అనే క్రియను ముందుగానే కలిపివేయకుండా యుద్ధ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: ఐగుప్తీయుణ్ణి
  rationale: తెలుగులో సహజంగా వ్యక్తిని సూచిస్తుంది; ‘మనిషి’ అని మళ్లీ చెప్పాల్సిన అవసరం లేదు.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: ఐదు మూరల ఎత్తున్న గొప్ప కాయంగల
  rationale: ‘కొలతగల మనిషి’ అనే అక్షరార్థాన్ని అసహజంగా ఇవ్వకుండా, అసాధారణ శరీరాకృతిని తదుపరి కొలతతో కలిపి స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲנִית
  choice: ఈటె
  rationale: పొడవైన దండంతో కూడిన యుద్ధాయుధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: నేతగాడి మగ్గపు దూలంలాంటి
  rationale: ఈటె దండం మగ్గంలోని పెద్ద దూలంలా ఉందనే పోలికను స్పష్టంగా, సాంస్కృతిక వస్తువును నిలుపుతూ అందిస్తుంది.
- source_word: וַיֵּרֶד אֵלָיו
  choice: అతని మీదికి దిగివెళ్లి
  rationale: ירד లోని ‘దిగడం’ భావాన్ని నిలుపుతూ, పోరాటానికి ప్రత్యర్థి వైపు వెళ్లడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּשָּׁבֶט
  choice: ఒక కర్ర పట్టుకొని
  rationale: שבט కు కర్ర, దండం, గద వంటి అర్థాలు ఉండవచ్చు; ‘కర్ర’ విస్తృతమైనది, అతి వ్యాఖ్యానాత్మకం కానిది.
- source_word: וַיִּגְזֹל
  choice: లాక్కొని
  rationale: బలవంతంగా చేతిలోనుండి తీసుకోవడాన్ని చురుకైన యుద్ధచర్యగా తెలియజేస్తుంది.
- source_word: וַיַּהַרְגֵהוּ
  choice: అతణ్ణి చంపాడు
  rationale: ఇది మరణాన్ని స్పష్టంగా తెలిపే క్రియ; ఆధునిక తెలుగులో నేరుగా, సహజంగా ఉంది.
- source_word: בַּחֲנִיתוֹ
  choice: అతని సొంత ఈటెతోనే
  rationale: సర్వనామ ప్రత్యయం ఐగుప్తీయుని ఈటెను సూచిస్తుందని సందర్భం తెలుపుతుంది; ‘సొంత...తోనే’ ఆయుధం తిరిగి అతనిపైనే వాడబడిన వ్యంగ్యాన్ని స్పష్టం చేస్తుంది.
