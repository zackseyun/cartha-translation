id: 1CH.11.13
reference: 1 Chronicles 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֽוּא הָיָ֨ה עִם דָּוִ֜יד בַּ/פַּ֣ס דַּמִּ֗ים וְ/הַ/פְּלִשְׁתִּים֙ נֶאֱסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַ/תְּהִ֛י חֶלְקַ֥ת הַ/שָּׂדֶ֖ה מְלֵאָ֣ה שְׂעוֹרִ֑ים וְ/הָ/עָ֥ם נָ֖סוּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: te
  text: అతడు దావీదుతో కలిసి పస్-దమ్మీములో[a] ఉన్నాడు. ఫిలిష్తీయులు యుద్ధానికి అక్కడ సమకూడారు. పొలంలోని ఒక భాగం యవలతో నిండి ఉంది. ప్రజలు ఫిలిష్తీయుల ఎదుటనుంచి పారిపోయారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పస్-దమ్మీము ఒక స్థలపేరు. దీనికి సమాంతరమైన 1 సమూయేలు 17:1 వృత్తాంతంలో ఈ ప్రదేశం ఎఫెస్-దమ్మీము అని పిలువబడింది.
    reason: cross_reference
  - marker: b
    text: లేదా, “ఫిలిష్తీయుల ఎదుట పారిపోయారు.” హీబ్రూ నుడికారానికి అక్షరార్థం “ఫిలిష్తీయుల ఎదుటనుంచి పారిపోయారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: పస్-దమ్మీములో
  rationale: దినవృత్తాంతాల గ్రంథంలో ఇది స్థలపేరుగా వాడబడింది. దాని వ్యుత్పత్తి అర్థాన్ని అనువదించడం కంటే స్థలపేరుగా లిప్యంతరీకరించడం సందర్భానికి తగినది.
- source_word: נֶאֱסְפוּ
  choice: సమకూడారు
  rationale: אסף ధాతువు నిఫాల్ రూపం ఇక్కడ యుద్ధం కోసం ఒకచోట కూడడాన్ని సూచిస్తుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: ఇది ఒక నిర్దిష్ట సైనిక సమరాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన, మూలానికి నేరుగా సరిపడే పదప్రయోగం.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: పొలంలోని ఒక భాగం
  rationale: חלקה అనేది పొలంలో విడిగా గుర్తించదగిన భాగాన్ని లేదా మడిని సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: యవలతో నిండి ఉండగా
  rationale: మూలంలోని שְׂעוֹרִים సాధారణ ధాన్యాన్ని కాక ప్రత్యేకంగా barleyను సూచిస్తుంది; దానికి తెలుగు పదం ‘యవలు’.
- source_word: וְהָעָם
  choice: ప్రజలు
  rationale: עם అనే పదం విస్తృతార్థకమైనది. సందర్భంలో ఇశ్రాయేలు సైనికులను సూచించే అవకాశం ఉన్నప్పటికీ, మూలంలో లేని సంకుచిత అర్థాన్ని చేర్చకుండా ‘ప్రజలు’ అని ఉంచబడింది.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ఎదుటనుంచి పారిపోయారు
  rationale: מִפְּנֵי అనే హీబ్రూ ప్రయోగంలోని ‘ఎదుటనుంచి’ అనే రూపాన్ని నిలుపుతూ, శత్రువును ఎదుర్కోలేక పారిపోవడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. స్థలపేరు లిప్యంతరీకరించబడింది; సైనిక సందర్భం ఉన్నప్పటికీ עם అనే విస్తృత పదాన్ని ‘సైనికులు’గా సంకుచితం చేయలేదు. అందించిన ఆంగ్ల పాఠ్యంలో [b] గుర్తు ‘barley’ తర్వాత ఉన్నా, ఆ పాదసూచిక విషయం పారిపోవడం అనే హీబ్రూ నుడికారానికి సంబంధించినది కాబట్టి తెలుగు ప్రధాన పాఠ్యంలో తగిన వాక్యభాగం తర్వాత ఉంచబడింది.
