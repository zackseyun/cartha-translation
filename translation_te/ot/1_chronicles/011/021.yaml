  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: te
  text: అతడు ఆ ముగ్గురిలోని ఇద్దరికంటే ఎక్కువ గౌరవం పొందాడు[a]; వారికి అధిపతి అయ్యాడు. అయినా అతడు ఆ ముగ్గురి స్థాయిని చేరుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఇద్దరి చేత అతడు ఆ ముగ్గురికంటే ఎక్కువ గౌరవం పొందాడు.” హీబ్రూ వాక్యం సంక్షిప్తంగా, అర్థనిర్ణయానికి క్లిష్టంగా ఉంది. అతడు ఒక ఉన్నత స్థాయి గల వీరుల సమూహంలో విశేష గౌరవం పొందినప్పటికీ, ‘ఆ ముగ్గురి’ స్థాయికి చేరలేదనేది సందర్భంలోని భావం.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: ఆ ముగ్గురిలోని ఇద్దరికంటే
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. సందర్భంలోని వీరుల స్థాయిక్రమాన్ని దృష్టిలో ఉంచుకొని, ప్రధాన పఠనంగా ముగ్గురిలోని ఇద్దరితో పోలికను సహజమైన తెలుగులో వ్యక్తం చేశాం; వేరొక సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נִכְבָּד
  choice: ఎక్కువ గౌరవం పొందాడు
  rationale: నిఫాల్ రూపం ఇక్కడ గౌరవింపబడటం లేదా ఉన్నతంగా ఎంచబడటం అనే భావాన్ని ఇస్తుంది; తులనాత్మక నిర్మాణం వల్ల ‘ఎక్కువ’ చేర్చబడింది.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: వారికి అధిపతి అయ్యాడు
  rationale: שַׂר అంటే అధిపతి, నాయకుడు లేదా సేనాధిపతి. సైనిక సందర్భానికి సరిపడుతూ, మూలంలోని విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయని పదంగా ‘అధిపతి’ ఎంచుకున్నాం.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: ఆ ముగ్గురి స్థాయిని చేరుకోలేదు
  rationale: עַד తో కూడిన בוא ఇక్కడ భౌతికంగా రావడం కాకుండా హోదా లేదా ప్రతిష్ఠలో చేరడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘స్థాయిని’ వ్యక్తపరిచాం.
