  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. హీబ్రూలోని అస్పష్టమైన సమూహ-సంబంధాన్ని ప్రధాన పాఠంలో చదవదగిన రీతిలో ఇచ్చి, నిజమైన ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
