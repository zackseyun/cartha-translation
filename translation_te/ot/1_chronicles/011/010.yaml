id: 1CH.11.10
reference: 1 Chronicles 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: te
  text: దావీదుకు చెందిన శూరుల నాయకులు వీరే; వారు అతని రాజ్యపాలనలో అతనితో దృఢంగా నిలిచి, సమస్త ఇశ్రాయేలుతో కలిసి అతన్ని రాజుగా చేశారు—ఇశ్రాయేలు గురించి యాహ్వే చెప్పిన మాట ప్రకారం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: శూరుల నాయకులు
  rationale: רָאשֵׁי ఇక్కడ ప్రధాన నాయకులను సూచిస్తుంది; הַגִּבּוֹרִים దావీదు యొక్క విశిష్ట యోధులను సూచిస్తుంది. ‘శూరుల నాయకులు’ సైనిక-వీర భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר לְדָוִיד
  choice: దావీదుకు చెందిన
  rationale: లామెద్ సూచించే అనుబంధం లేదా స్వాధీన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: అతనికి బలంగా అండగా నిలిచి
  rationale: హిత్పయేల్ రూపంలోని ‘అతనితో కలిసి తమను బలపరచుకున్న’ అనే అక్షరార్థాన్ని సందర్భానుసారంగా దావీదు రాజ్యస్థాపనకు ఇచ్చిన దృఢ మద్దతుగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: בְמַלְכוּתוֹ
  choice: అతని రాజ్యాధికారానికి
  rationale: מַלְכוּת ఇక్కడ రాజ్యం, రాజరికం, రాజ్యపాలన అనే పరిధులను కలిగి ఉంది. రాజుగా చేయడం అనే సమీప సందర్భంలో ‘రాజ్యాధికారం’ accession మరియు rule భావాలను సహజంగా అందిస్తుంది.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరితో కలిసి
  rationale: ఇశ్రాయేలు సమాజమంతటితో కలిసి వారు చర్య తీసుకున్నారనే సహభాగిత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהַמְלִיכוֹ
  choice: అతన్ని రాజుగా చేశారు
  rationale: מלך హిఫీల్ రూపం ‘ఒకరిని రాజుగా చేయడం’ అనే ప్రత్యక్ష అర్థాన్ని ఇస్తుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా చెప్పిన మాట ప్రకారం
  rationale: దైవిక వాక్కుతో ఉన్న సంబంధాన్ని కాపాడుతూ, דבר ను సంకుచితమైన ‘వాగ్దానం’గా కాక ‘చెప్పిన మాట’గా అనువదిస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గురించి
  rationale: דבר తో కలిసిన עַל ఇక్కడ సాధారణంగా ‘గురించి’ అనే భావం ఇస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నమోదు చేసింది.
theological_decisions:
- issue: הַמִּתְחַזְּקִים עִמּוֹ లో దావీదు అనుచరుల చర్య
  choice: దావీదు రాజ్యాధికారానికి దృఢంగా అండగా నిలవడం
  alternative: దావీదుతో కలిసి తమను తాము బలపరచుకోవడం
  rationale: రాజుగా చేయడం అనే వెంటనే వచ్చే ఉద్దేశ్యవాక్యం రాజకీయ-సైనిక మద్దతు భావాన్ని బలపరుస్తుంది. అయినా హిబ్రూ ప్రతిఫలాత్మక రూపంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపింది.
- issue: בְמַלְכוּתוֹ యొక్క పరిధి
  choice: దావీదు రాజ్యాధికారానికి సంబంధించినది
  alternative: అతని రాజ్యంలో లేదా అతని పరిపాలనకాలంలో
  rationale: సందర్భం దావీదు రాజ్యస్థాపనను సూచిస్తున్నందున ‘రాజ్యాధికారం’ ఎంచుకుంది; భూభాగం మాత్రమే లేదా కాలవ్యవధి మాత్రమే అని పరిమితం చేయలేదు.
- issue: עַל יִשְׂרָאֵל యొక్క సంబంధం
  choice: యెహోవా ఇశ్రాయేలు గురించి చెప్పిన మాట
  alternative: ఇశ్రాయేలుపై యెహోవా చెప్పిన మాట
  rationale: ఈ పదబంధం సహజంగా ‘మాట’ను విశేషిస్తుంది. ‘గురించి’ అనేది సందర్భోచితం; ‘పై’ అనే రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని రూపక అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. పొడవైన హిబ్రూ వాక్యాన్ని పఠనసౌలభ్యం కోసం మూడు అనుసంధాన వాక్యాలుగా విభజించినా, నాయకులు, వారి మద్దతు, సమస్త ఇశ్రాయేలు సహకారం, రాజుగా చేయడం, యెహోవా మాట అనే భావక్రమాన్ని నిలిపింది.
