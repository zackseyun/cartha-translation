revisions:
- from: దావీదుకు చెందిన శూరుల నాయకులు వీరే. వీరు అతని రాజ్యాధికారానికి బలంగా అండగా నిలిచి[a], ఇశ్రాయేలీయులందరితో కలిసి అతన్ని రాజుగా చేశారు. ఇది ఇశ్రాయేలు గురించి యెహోవా చెప్పిన మాట[b] ప్రకారం జరిగింది.
  to: దావీదుకు చెందిన శూరుల నాయకులు వీరే; వారు అతని రాజ్యపాలనలో అతనితో దృఢంగా నిలిచి, సమస్త ఇశ్రాయేలుతో కలిసి అతన్ని రాజుగా చేశారు—ఇశ్రాయేలు గురించి యాహ్వే చెప్పిన మాట ప్రకారం.
  rationale: The revision retains the contextual sense that David’s mighty men stood firmly with him and, with all Israel, made him king. It restores the broader sphere expressed by ‘in his kingship/reign,’ directly links the entire action to Yahweh’s word, and uses the designated rendering of the divine name. Footnote a preserves the reflexive force of the Hebrew participle; footnote b retains the more literal alternative for עַל (‘upon/over’).
