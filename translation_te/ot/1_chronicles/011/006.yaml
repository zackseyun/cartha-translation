source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד כָּל מַכֵּ֤ה יְבוּסִי֙ בָּ/רִ֣אשׁוֹנָ֔ה יִהְיֶ֥ה לְ/רֹ֖אשׁ וּ/לְ/שָׂ֑ר וַ/יַּ֧עַל בָּ/רִאשׁוֹנָ֛ה יוֹאָ֥ב בֶּן צְרוּיָ֖ה וַ/יְהִ֥י לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: te
  text: దావీదు, “యెబూసీయుణ్ణి మొదట ఓడించేవాడు ప్రధానుడిగా, సేనాధిపతిగా అవుతాడు[a]” అని చెప్పాడు. అప్పుడు సెరూయా కుమారుడు యోవాబు మొదట పైకి వెళ్లాడు[b]; అతడు ప్రధానుడయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తలగా, అధిపతిగా అవుతాడు.”
    reason: lexical_alternative
  - marker: b
    text: “పైకి వెళ్లాడు” అనే మాట కోటపై దాడి చేయడానికి ఎక్కి వెళ్లడాన్ని సూచించవచ్చు; అయితే హీబ్రూ పాఠంలో ఉన్న మాట నేరుగా “పైకి వెళ్లాడు” అనే అర్థాన్నే ఇస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: యెబూసీయుణ్ణి ఓడించేవాడు
  rationale: כָּל + participle here functions as an indefinite relative, ‘whoever.’ In this military setting נכה can denote striking down or defeating. ‘ఓడించేవాడు’ communicates the martial result naturally without requiring that the verb explicitly mean killing; singular ‘యెబూసీయుణ్ణి’ retains the generic singular.
- source_word: בָּרִאשׁוֹנָה
  choice: మొదట
  rationale: The adverb marks priority in action. ‘మొదట’ is concise and natural, and it is repeated where the Hebrew repeats the expression.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: ప్రధానుడిగా, సేనాధిపతిగా అవుతాడు
  rationale: רֹאשׁ denotes the chief or leading person, while שַׂר in this military context is suitably expressed as ‘సేనాధిపతి.’ ‘అవుతాడు’ naturally renders היה + ל and preserves the twofold designation.
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה literally means ‘go up.’ The context may imply advancing uphill to attack the stronghold, but the translation retains the source wording rather than making the attack explicit.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడు యోవాబు
  rationale: The names are given in their established Telugu forms, and the Hebrew filiation is rendered in natural Telugu order.
- source_word: וַיְהִי לְרֹאשׁ
  choice: అతడు ప్రధానుడయ్యాడు
  rationale: Repeating ‘ప్రధానుడు’ preserves the lexical echo of רֹאשׁ in David’s promise. Since שַׂר is not repeated here, ‘సేనాధిపతి’ is likewise not added.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘ప్రధానుడు’ అనే పదాన్ని రెండుసార్లు ఉంచి మూలంలోని רֹאשׁ పదపునరుక్తిని నిలిపాం; సైనిక సందర్భాన్ని స్పష్టం చేయడానికి שַׂר ను ‘సేనాధిపతి’గా అనువదించాం.
