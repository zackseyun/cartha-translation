source:
  edition: WLC
  text: עֲדִינָ֨א בֶן שִׁיזָ֜א הָ/רֽאוּבֵנִ֗י רֹ֛אשׁ לָ/רֽאוּבֵנִ֖י וְ/עָלָ֥י/ו שְׁלוֹשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: te
  text: షీజా కుమారుడైన రూబేనీయుడు అదీనా; అతడు రూబేనీయులకు ఒక నాయకుడు. అతనితో ముప్పై మంది ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అతనిపై ముప్పై మంది ఉన్నారు.” హీబ్రూ ఉపసర్గను అలా అనువదించవచ్చు; అయితే ఈ సైనిక జాబితాలో ముప్పై మంది అతనికి అనుబంధంగా ఉన్నారని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: అదీనా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶן שִׁיזָא
  choice: షీజా కుమారుడు
  rationale: యోధుల జాబితాలో בֶן సాధారణంగా ప్రత్యక్ష పుత్రసంబంధాన్ని సూచిస్తుంది; పేరును తెలుగు లిపిలో ప్రతిబింబించాం.
- source_word: הָרְאוּבֵנִי
  choice: రూబేనీయుడు
  rationale: నిర్దిష్ట gentillic రూపం రూబేను గోత్రానికి చెందిన వ్యక్తిని సూచిస్తుంది.
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: రూబేనీయులకు ఒక నాయకుడు
  rationale: ఈ సైనిక జాబితా సందర్భంలో רֹאשׁ శరీర అవయవాన్ని కాక నాయకత్వ స్థానాన్ని సూచిస్తుంది; ל సంబంధిత సమూహాన్ని తెలియజేస్తుంది.
- source_word: וְעָלָיו
  choice: అతనితో ... ఉన్నారు
  rationale: על యొక్క మౌలిక అర్థం ‘మీద/పై’ అయినప్పటికీ, ఈ జాబితా సందర్భంలో అతనికి అనుబంధంగా లేదా అతని ఆధ్వర్యంలో ఉన్నవారిని సూచించే అవకాశముంది. ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: שְׁלוֹשִׁים
  choice: ముప్పై మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, సైనిక జాబితా సందర్భం వల్ల సూచితమైన మనుషులను ‘మంది’తో స్పష్టం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక యోధుల జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని సంక్షిప్త జాబితా ధోరణిని నిలిపి, వాక్య స్పష్టత కోసం రెండవ భాగంలో ‘అతడు’ చేర్చాం.
