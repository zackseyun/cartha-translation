id: 1CH.11.20
reference: 1 Chronicles 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: te
  text: యోవాబు సోదరుడైన అబీషై ముగ్గురికి అధిపతి.[a] అతడు మూడు వందలమంది హతులపై తన ఈటెను ఊపాడు,[b] ముగ్గురిలో పేరు పొందాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ముగ్గురు.’ సమాంతర వాక్యమైన 2 సమూయేలు 23:18లోను, ఈ యోధుల జాబితా సందర్భంలోను ‘ముగ్గురు,’ ‘ముప్పైమంది’ అనే పఠనాల విషయంలో పాఠ్య, సందర్భ సంబంధమైన చిక్కులు ఉన్నాయి.
    reason: textual_variant
  - marker: b
    text: లేదా ‘తన ఈటెను పైకెత్తాడు’ లేదా ‘తన ఈటెను ప్రయోగించాడు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ నుడికారం అక్షరార్థంగా ‘పేరు కలిగివున్నాడు’; అంటే ‘ప్రఖ్యాతి పొందాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: నాయకుడు
  rationale: ఈ సైనిక సందర్భంలో ఇది శరీరంలోని ‘తల’ను కాక నాయకత్వ స్థానాన్ని సూచిస్తుంది; ‘నాయకుడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: ముగ్గురికి / ముగ్గురిలో
  rationale: మసొరెటిక్ పాఠంలోని ‘ముగ్గురు’ అనే రూపాన్ని సమాంతర వాక్యంతో సమన్వయపరచి మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: తన ఈటెను ... ఎత్తి ప్రయోగించాడు
  rationale: మూలంలోని ‘ఈటెను లేపడం/కదిలించడం’ అనే సజీవ సైనిక ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం పైకెత్తాడనే అర్థానికి పరిమితం చేయదు.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: మూడు వందలమంది హతులపై
  rationale: חָלָל అనే ‘హతుడైన/పొడిచి చంపబడిన వ్యక్తి’ భావాన్ని కాపాడుతూ, కార్యఫలితాన్ని మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: שֵׁם
  choice: పేరు పొందాడు
  rationale: ‘పేరు’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, ఖ్యాతి పొందాడనే భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: אַבְשַׁי
  choice: అబీషై
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: אֲחִי יוֹאָב
  choice: యోవాబు సోదరుడైన
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ రూపంలో అందిస్తుంది.
