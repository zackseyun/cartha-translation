revisions:
- from: యోవాబు సోదరుడైన అబీషై ముగ్గురికి నాయకుడు.[a] అతడు తన ఈటెను మూడు వందలమంది హతులపై ఎత్తి ప్రయోగించాడు,[b] ముగ్గురిలో పేరు పొందాడు.[c]
  to: యోవాబు సోదరుడైన అబీషై ముగ్గురికి అధిపతి.[a] అతడు మూడు వందలమంది హతులపై తన ఈటెను ఊపాడు,[b] ముగ్గురిలో పేరు పొందాడు.[c]
  rationale: The revision uses ‘అధిపతి’ for Abishai’s rank and ‘ఊపాడు’ for the martial spear idiom, avoiding the unsupported implication that he necessarily threw the spear. It retains the MT’s disputed ‘Three,’ the syntactically difficult reference to three hundred slain, and all original footnote anchors and content.
