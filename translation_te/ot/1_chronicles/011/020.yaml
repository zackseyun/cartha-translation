translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మసొరెటిక్ పాఠంలోని ‘ముగ్గురు’ను మార్చకుండా ఉంచి, సంబంధిత పాఠ్య చిక్కును పాదసూచికలో తెలిపింది.
