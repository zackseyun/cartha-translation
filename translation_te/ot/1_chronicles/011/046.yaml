translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూ వాక్యనిర్మాణంలోని అనుసంధానాలను తెలుగులో సహజంగా అమర్చి, పేర్ల క్రమం మరియు గుర్తింపు విశేషణాలను కాపాడాం.
