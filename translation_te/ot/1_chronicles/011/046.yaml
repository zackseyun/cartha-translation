base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: te
  text: మహవీయుడైన ఎలీయేలు[a], ఎల్నాము కుమారులైన యెరీబయి, యోషవ్యా, మోయాబీయుడైన యిత్మా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మహవీయుడు’ అనేది హీబ్రూ జాతి/స్థలసూచక పదానికి లిప్యంతరీకరణ; అది సూచించే ఖచ్చితమైన స్థలం లేదా వంశం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: ఎలీయేలు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַמַּחֲוִים
  choice: మహవీయుడైన
  rationale: స్థలనామం లేదా వంశసూచక విశేషణం స్పష్టంగా గుర్తించబడలేదు; అర్థాన్ని ఊహించకుండా హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וִירִיבַי
  choice: యెరీబయి
  rationale: వ్యక్తి పేరు; మసొరెటిక్ స్వరచిహ్నాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְיוֹשַׁוְיָה
  choice: యోషవ్యా
  rationale: వ్యక్తి పేరు; హీబ్రూ శ ధ్వనిని ‘ష’తో ప్రతిబింబించాం.
- source_word: בְּנֵי
  choice: కుమారులైన
  rationale: నిర్మాణ బహువచనమైన ‘కుమారులు’ అనే అర్థాన్ని ఉంచి, ముందున్న ఇద్దరు ఎల్నయము కుమారులని సహజమైన తెలుగులో తెలిపాం.
- source_word: אֶלְנָעַם
  choice: ఎల్నయము
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: וְיִתְמָה
  choice: ఇత్మా
  rationale: వ్యక్తి పేరు; హీబ్రూ యోద్‌ను ఇక్కడ స్వరారంభంగా ప్రతిబింబించాం.
- source_word: הַמּוֹאָבִי
  choice: మోయాబీయుడైన
  rationale: నిర్దిష్ట జాతిసూచక విశేషణాన్ని ఇత్మాకు గుర్తింపు విశేషణంగా సహజమైన తెలుగులో అందించాం.
