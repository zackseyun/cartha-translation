  register: ఆధునిక ప్రామాణిక తెలుగులో, వీరుల జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని జాబితా నిర్మాణాన్ని స్పష్టంగా చూపేందుకు అర్ధవిరామ చిహ్నం వాడబడింది.
