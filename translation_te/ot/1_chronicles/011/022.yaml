  source_fidelity: ముసాయిదాలో మొదటి రెండు వాక్యాలు హెబ్రీ వాక్యనిర్మాణాన్ని మార్చి, ‘పరాక్రమశాలి, ఎన్నో ఘనకార్యాలు చేసినవాడు’ అనే వర్ణనలను యెహోయాదాకే నిర్ద్వంద్వంగా ఆపాదిస్తున్నాయి. మూలంలో ఈ సంబంధం అంత స్పష్టంగా లేదు; సందర్భానుసారం బెనాయా చేసిన కార్యాలే ప్రధానంగా ఉద్దేశించబడ్డాయి. సవరించిన పాఠ్యం ‘పరాక్రమశాలియైన వ్యక్తి కుమారుడు’ అనే వంశసంబంధాన్ని ఉంచి, ఘనకార్యాలను బెనాయాకు ఆపాదిస్తుంది. נכה యొక్క విస్తృత భావాన్ని కాపాడడానికి ‘హతమార్చాడు’ స్థానంలో ‘కొట్టి పడగొట్టాడు’ వాడబడింది.
  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో ఒకే ప్రవాహంలో చదవబడుతుంది. డాష్‌తో ఉన్న అనుబంధ వర్ణన మూలంలోని గట్టి నామవాచక పరంపరను సహజంగా వ్యక్తపరుస్తుంది. ‘మంచు పడిన రోజున’ అనేది ‘మంచు కురిసిన ఒక రోజున’ కంటే మూలంలోని ‘మంచు దినమున’ అనే వివరానికి కొంచెం దగ్గరగా, సహజంగానూ ఉంది.
  terminology: కబ్సెయేలు, యెహోయాదా, బెనాయా, మోయాబు పేర్లు స్థిరంగా ఉన్నాయి. אֲרִיאֵל యొక్క అనిశ్చితికి ప్రధాన పాఠ్యంలో ‘ఇద్దరు వీరులు’ అనే సందర్భోచిత అర్థాన్ని ఉంచి, పాదటిప్పణిలో పేరు, ‘అరీయేలు కుమారులు,’ సింహసదృశ వీరులు అనే ప్రధాన ప్రత్యామ్నాయాలను నిలిపాము.
