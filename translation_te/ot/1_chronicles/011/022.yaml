translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. సంక్లిష్టమైన హెబ్రీ వంశవివరణను రెండు వాక్యాలుగా విభజించి, యెహోయాదానే పరాక్రమశాలి మరియు అనేక ఘనకార్యాలు చేసినవాడని మూలపాఠ్యంలోని సమీప అన్వయానికి అనుగుణంగా చూపించాం. אֲרִיאֵל అనే పదంలోని నిజమైన అనిశ్చితిని ప్రధాన పాఠ్యంలో అతిగా వివరించకుండా పాదటిప్పణిలో భద్రపరిచాం.
