id: 1CH.11.22
reference: 1 Chronicles 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: te
  text: యెహోయాదా కుమారుడైన బెనాయా—కబ్సెయేలు నుండి వచ్చిన పరాక్రమశాలియైన వ్యక్తి కుమారుడు, ఎన్నో ఘనకార్యాలు చేసినవాడు—మోయాబుకు చెందిన ఇద్దరు వీరులను[a] కొట్టి పడగొట్టాడు. అతడు మంచు పడిన రోజున ఒక గోతిలోకి దిగి, ఆ గోతిలో ఉన్న సింహాన్ని కూడా కొట్టి పడగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హెబ్రీ పదబంధం אֲרִיאֵל מוֹאָב అర్థం అనిశ్చితం. దీనికి ‘మోయాబుకు చెందిన ఇద్దరు అరీయేలు,’ ‘మోయాబుకు చెందిన అరీయేలు కుమారులిద్దరు,’ లేదా ‘మోయాబుకు చెందిన సింహసదృశులైన ఇద్దరు వీరులు’ అని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: పరాక్రమశాలి
  rationale: ఈ యోధుల జాబితా సందర్భంలో ఈ పదబంధం బలం, శౌర్యం, నిరూపిత సామర్థ్యాన్ని సూచిస్తుంది. ‘పరాక్రమశాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి యుద్ధసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רַב פְּעָלִים
  choice: ఎన్నో ఘనకార్యాలు చేసినవాడు
  rationale: అక్షరార్థంగా ‘అనేక కార్యాలు గలవాడు.’ సందర్భంలో అవి ప్రస్తావించదగిన సాహసకార్యాలు కావడంతో ‘ఘనకార్యాలు’ సహజమైన, గౌరవప్రదమైన ఎంపిక.
- source_word: מִן קַבְצְאֵל
  choice: కబ్సెయేలుకు చెందిన
  rationale: מן ఇక్కడ మూలస్థలాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తి స్వస్థలాన్ని తెలియజేయడానికి ‘చెందిన’ సహజంగా ఉంటుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: נכה అనే క్రియకు కొట్టడం, పడగొట్టడం, సంహరించడం వంటి విస్తృత అర్థాలు ఉన్నాయి. యోధుని సాహసకార్యాల సందర్భంలో ప్రత్యర్థులను, తరువాత సింహాన్ని చంపిన భావం బలంగా సూచించబడుతోంది; అందువల్ల ‘హతమార్చాడు’ సహజంగా సరిపోతుంది.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: మోయాబుకు చెందిన ఇద్దరు వీరులను
  rationale: אֲרִיאֵל ఇక్కడ అర్థనిర్ణయం కష్టమైన పదం; అది ‘అరీయేలు’ అనే పేరు కావచ్చు లేదా సింహసదృశుడైన వీరుణ్ణి సూచించవచ్చు. ప్రధాన పాఠ్యంలో సందర్భానికి తగిన ‘వీరులు’ అని ఇచ్చి, నిజమైన అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: יָרַד
  choice: దిగి
  rationale: సాధారణంగా ‘దిగడం’ అనే అర్థం. ఇక్కడ గోతిలోకి దిగిన కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: הָאֲרִי
  choice: సింహాన్ని
  rationale: ఈ నామవాచకం ఇక్కడ స్పష్టంగా ‘సింహం’ అని అర్థం.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: ఒక గోతిలోకి దిగి, అక్కడ ఉన్న
  rationale: మూలపాఠ్యం సింహం గోతి మధ్యలో ఉన్నదని చెబుతుంది. తెలుగులో కదలికతో కూడిన వాక్యంలో ‘గోతిలోకి దిగి, అక్కడ ఉన్న’ అనే రూపం స్థలసంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: మంచు కురిసిన ఒక రోజున
  rationale: అక్షరార్థంగా ‘మంచు రోజున.’ ఈ పరిస్థితిని ఆధునిక తెలుగులో సహజంగా తెలిపే రూపం ఇది.
