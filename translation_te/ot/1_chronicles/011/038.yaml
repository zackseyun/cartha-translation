translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వీరుల పేర్ల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని అసంపూర్ణ జాబితా నిర్మాణాన్ని చివరి కామాతో కొనసాగించాం.
