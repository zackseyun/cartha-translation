  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲחִי
  choice: సోదరుడు
  rationale: ఇది ‘సోదరుడు’ అనే పదపు సంబంధబోధక రూపం; జాబితాలో సహజంగా ఉండేలా నాతానుతో ఉన్న సంబంధాన్ని స్పష్టంగా తెలిపాం.
- source_word: נָתָן
  choice: నాతాను
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: מִבְחָר
  choice: మిభారు
  rationale: వ్యక్తి పేరుగా గ్రహించి లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధ జాబితాలో సాధారణంగా సూచించే ప్రత్యక్ష పుత్రసంబంధాన్ని నిలిపాం.
- source_word: הַגְרִי
  choice: హగ్రీ
  rationale: ప్రధాన పాఠంలో వ్యక్తి పేరుగా లిప్యంతరీకరించాం; జాతి/వర్గ సూచకంగా చదివే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
