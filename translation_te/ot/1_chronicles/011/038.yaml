    text: లేదా, “హగ్రీయుని కుమారుడు మిబ్హారు.” హీబ్రూ హַגְרִיని వ్యక్తి పేరుగా కాకుండా, “హగ్రీయుడు” అనే జాతి-సూచక పదంగా కూడా చదవవచ్చు.
