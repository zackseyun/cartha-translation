translation:
  language: te
  text: గిజోనీయుడైన హాషేము కుమారులు, హరారీయుడైన షాగే కుమారుడు యోనాతాను;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן (‘కుమారుడు’) అనే పదం యొక్క బహువచన construct రూపం. మసొరెటిక్ పాఠంలోని నిజమైన బహువచనాన్ని సమాంతర వచనంతో సమన్వయపరచకుండా నిలుపుతుంది.
- source_word: הָשֵׁם
  choice: హాషేము
  rationale: ఇక్కడ ఇది వ్యక్తిపేరు; అర్థానువాదం చేయకుండా ఆధునిక తెలుగు లిపిలో హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: הַגִּזוֹנִי
  choice: గిజోనీయుడైన
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వంశ/ప్రాంత సూచక విశేషణం. తెలుగులో వ్యక్తిని సహజంగా విశేషించే ‘-ీయుడైన’ రూపం ఉపయోగించబడింది.
- source_word: יוֹנָתָן
  choice: యోనాతాను
  rationale: వ్యక్తిపేరును హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సుపరిచితమైన బైబిలు నామరూపంతో లిప్యంతరీకరించబడింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే ఏకవచన construct రూపం; తెలుగు నామావళిలో సహజమైన పదక్రమంలో అమర్చబడింది.
- source_word: שָׁגֵה
  choice: షాగే
  rationale: వ్యక్తిపేరును అర్థానువాదం చేయకుండా హీబ్రూ ధ్వనికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: הַהֲרָרִי
  choice: హరారీయుడైన
  rationale: వంశం లేదా ప్రాంత మూలాన్ని సూచించే నిర్దిష్ట gentilic రూపం; వ్యక్తిని విశేషించే సహజ తెలుగు రూపంలో అనువదించబడింది.
