translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వీరుల నామావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని బహువచన పాఠాన్ని అలాగే నిలిపి, పాఠభేదాన్ని పాదటిప్పణిలో తెలిపాం. సెమీకోలన్ జాబితా కొనసాగుతుందని సూచిస్తుంది.
