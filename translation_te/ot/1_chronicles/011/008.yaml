id: 1CH.11.8
reference: 1 Chronicles 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: te
  text: దావీదు నగరాన్ని అన్ని వైపులా, మిల్లో నుండి చుట్టుపక్కల ప్రాంతం వరకు, నిర్మించాడు[a]. యోవాబు నగరంలోని మిగిలిన భాగాన్ని పునరుద్ధరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మిల్లో’ అనేది యెరూషలేములోని ఒక భౌగోళిక నిర్మాణానికి వాడిన పేరు. దాని ఖచ్చితమైన స్వరూపం తెలియదు; అది మెట్లవంటి నిర్మాణం లేదా మట్టితో నింపి ఎత్తు చేసిన ప్రదేశం అయి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבֶן
  choice: నిర్మించాడు
  rationale: בנה అనే క్రియ సాధారణంగా ‘కట్టాడు/నిర్మించాడు’ అని అర్థం. కర్త మునుపటి వచనంలోని దావీదు; ‘పునర్నిర్మించాడు’ అనడం మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చుతుంది.
- source_word: הָעִיר
  choice: నగరాన్ని
  rationale: עִיר ఇక్కడ యెరూషలేము/సీయోనును సూచించే సాధారణ పదం; ఆధునిక తెలుగులో ‘నగరం’ సహజంగా సరిపోతుంది.
- source_word: מִסָּבִיב
  choice: చుట్టూ
  rationale: ఈ క్రియావిశేషణం నగరం చుట్టూ నిర్మాణం జరిగిన విస్తృతిని తెలియజేస్తుంది.
- source_word: מִן הַמִּלּוֹא
  choice: మిల్లో మొదలుకొని
  rationale: מִלּוֹא యొక్క ఖచ్చితమైన భౌగోళిక స్వరూపం అనిశ్చితం కాబట్టి వ్యాఖ్యానాత్మక అనువాదం చేయకుండా స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: וְעַד הַסָּבִיב
  choice: చుట్టుపక్కల ప్రాంతం వరకు
  rationale: సంక్షిప్తమైన హెబ్రీ పదబంధం నిర్మాణపు సరిహద్దు లేదా పరిసర విస్తృతిని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేందుకు ‘ప్రాంతం’ చేర్చబడింది.
- source_word: יְחַיֶּה
  choice: పునరుద్ధరించాడు
  rationale: חיה పీయేల్ రూపానికి అక్షరార్థం ‘బతికించాడు’; నగరాన్ని ఉద్దేశించిన సందర్భంలో దాన్ని మళ్లీ సక్రమ స్థితికి తేవడం అనే రూపకాలంకార భావం ఉంది. ‘పునరుద్ధరించాడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶת שְׁאָר הָעִיר
  choice: నగరంలోని మిగిలిన భాగాన్ని
  rationale: שְׁאָר అంటే మిగిలినది; తెలుగులో ‘మిగిలిన భాగం’ స్పష్టంగా, సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన చారిత్రక కథన శైలి వాడబడింది. మూలంలోని రెండు వేర్వేరు కర్తలు—దావీదు, యోవాబు—తెలుగులో స్పష్టంగా కనిపించేలా మొదటి వాక్యంలో దావీదు పేరు పునరుద్ధరించబడింది. ‘మిల్లో’ను అనిశ్చిత భౌగోళిక పదంగా యథాతథంగా ఉంచి వివరణను పాదసూచికకు పరిమితం చేశాం.
