source:
  edition: WLC
  text: חָנָן֙ בֶּֽן מַעֲכָ֔ה וְ/יוֹשָׁפָ֖ט הַ/מִּתְנִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/043.yaml
  text: Hanan son of Maacah[a], and Joshaphat the Mithnite;
translation:
  language: te
  text: మయకా కుమారుడైన హానాను, మరియు మిత్నీయుడైన యోషాపాతు[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పేరు יוֹשָׁפָט (యోషాపాతు); ఇతర చోట్ల సాధారణంగా కనిపించే ‘యెహోషాపాతు’ అనే విస్తృత నామరూపం కంటే ఇది సంక్షిప్తమైనది.
    reason: మూలంలోని నామరూప భేదాన్ని స్పష్టపరచడం.
lexical_decisions:
- source_word: חָנָן
  choice: హానాను
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: వంశ లేదా పితృసంబంధాన్ని సూచించే సాధారణ హీబ్రూ పదం; ఈ పేర్ల జాబితాలో సహజమైన తెలుగు నిర్మాణం కోసం విశేషణ రూపంలో అనువదించబడింది.
- source_word: מַעֲכָה
  choice: మయకా
  rationale: వ్యక్తి పేరు; మూలంలోని గొంతు ధ్వనిని తెలుగులో ఖచ్చితంగా ప్రతిబింబించడం సాధ్యం కానందున, సులభంగా పలికే సమీప లిప్యంతరీకరణ ఎంచుకోబడింది.
- source_word: וְיוֹשָׁפָט
  choice: యోషాపాతు
  rationale: సంయోజకంతో కూడిన వ్యక్తి పేరు. మూలపాఠంలో ఉన్న సంక్షిప్త יוֹשָׁפָט రూపాన్ని అనుసరించి, మరింత పరిచితమైన యెహోషాపాతు అనే విస్తృత రూపాన్ని చేర్చలేదు; వాక్యంలోని సంయోజక భావం తెలుగులో విరామచిహ్నంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: הַמִּתְנִי
  choice: మిత్నీయుడైన
  rationale: ఒక స్థలం లేదా వంశంతో అనుబంధాన్ని తెలిపే విశేషణ నామం; పేర్ల జాబితాలో సహజంగా చదవబడే విధంగా వ్యక్తిని సూచించే రూపంలో అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యోధుల పేర్ల జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి పాటించబడింది. మూలపాఠంలోని క్రమం మరియు పేర్ల గుర్తింపులు నిలుపబడ్డాయి; పాదసూచిక గుర్తు అది వివరించే ‘యోషాపాతు’ పేరు తరువాత ఉంచబడింది.
