- from: అప్పుడు ముప్పైమంది ప్రముఖుల్లో ముగ్గురు బండ దగ్గరికి[a], అదుల్లాము గుహలో ఉన్న దావీదు వద్దకు దిగివచ్చారు. ఆ సమయంలో ఫిలిష్తీయుల శిబిరం రెఫాయీము లోయలో మకాం వేసి ఉంది.
