source:
  edition: WLC
  text: וַ/יֵּרְד֡וּ שְֽׁלוֹשָׁה֩ מִן הַ/שְּׁלוֹשִׁ֨ים רֹ֤אשׁ עַל הַ/צֻּר֙ אֶל דָּוִ֔יד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: te
  text: అప్పుడు ముప్పైమంది ప్రధానుల్లో ముగ్గురు బండపైకి[a], అదుల్లాము గుహలో ఉన్న దావీదు వద్దకు దిగివచ్చారు. ఆ సమయంలో ఫిలిష్తీయుల శిబిరం రెఫాయీము లోయలో మకాం వేసి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బండ దగ్గరికి.” హెబ్రీ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; ప్రధాన పాఠంలో “అదుల్లాము గుహలో ఉన్న” అనే మాటలు దావీదు ఉన్న స్థలాన్ని స్పష్టం చేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: దిగివచ్చారు
  rationale: ירד అనే క్రియలోని కిందికి కదలికను నిలుపుతూ, దావీదు ఉన్న స్థలాన్ని దృష్టికేంద్రంగా తీసుకున్న సహజమైన తెలుగు కథన రూపం.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: ముప్పైమంది ప్రముఖుల్లో ముగ్గురు
  rationale: ఈ సంక్షిప్త హెబ్రీ నిర్మాణం ‘ముప్పైమందిలోని ప్రముఖులైన ముగ్గురు’ అనే భావాన్ని ఇస్తుంది. నిర్దిష్ట సైనిక హోదాను చేర్చకుండా ప్రముఖ స్థానాన్ని సూచించడానికి ‘ప్రముఖులు’ వాడబడింది.
- source_word: עַל־הַצּוּר
  choice: బండ దగ్గరికి
  rationale: עַל దిశను లేదా బండపైకి చేరడాన్ని సూచించవచ్చు. సందర్భానికి సహజంగా ఉండేలా ‘బండ దగ్గరికి’ అని ఇచ్చి, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: అదుల్లాము గుహలో ఉన్న దావీదు వద్దకు
  rationale: రెండుసార్లు వచ్చిన אֶל పదబంధాల మధ్య సంబంధాన్ని తెలుగులో స్పష్టంగా చూపిస్తూ, గుహ దావీదు ఉన్న స్థలమని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని గమ్యార్థాన్ని కాపాడుతుంది.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: ఆ సమయంలో ఫిలిష్తీయుల శిబిరం ... మకాం వేసి ఉంది
  rationale: ఇది ప్రధాన చర్యకు నేపథ్య పరిస్థితిని తెలిపే భాగం. వర్తమాన కృదంతంలోని కొనసాగుతున్న స్థితిని ‘మకాం వేసి ఉంది’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֵמֶק רְפָאִים
  choice: రెఫాయీము లోయలో
  rationale: భౌగోళిక నామమైన רְפָאִיםను తెలుగులో ‘రెఫాయీము’గా లిప్యంతరీకరించి, עֵמֶקను ‘లోయ’గా అనువదించాం.
