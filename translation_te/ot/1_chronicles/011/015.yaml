translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. ‘ప్రముఖులు’ అనేది నిర్దిష్ట సైనిక హోదాను అనవసరంగా చేర్చకుండా రֹאשׁ సూచించే ఉన్నత స్థానాన్ని తెలియజేస్తుంది.
