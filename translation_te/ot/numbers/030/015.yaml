source:
  edition: WLC
  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: te
  text: అయితే ఆమె భర్త రోజు రోజుకూ మౌనంగానే ఉంటే, ఆమె చేసిన మొక్కుబడులన్నిటినీ లేదా ఆమెపై ఉన్న బంధించే కట్టుబాట్లన్నిటినీ[a] అతడు స్థిరపరుస్తాడు. అతడు వాటిని స్థిరపరిచాడు; ఎందుకంటే తాను విన్న రోజున అతడు ఆమెతో ఏమీ అనలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెపై ఉన్న బంధక కట్టుబాట్లన్నిటినీ.” హీబ్రూ పదం వాటిని చేసిన వ్యక్తిని బంధించే కట్టుబాట్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: మౌనంగా ఉంటే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ నిశ్శబ్దాన్ని బలపరుస్తుంది; తెలుగు షరతు వాక్యంలో ‘మౌనంగా ఉంటే’ సహజంగా ఉండి, అభ్యంతరం చెప్పకపోవడమనే న్యాయపరమైన భావాన్ని అందిస్తుంది.
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: ఈ వివాహసంబంధ న్యాయ సందర్భంలో సహజమైన, ఖచ్చితమైన అర్థం.
- source_word: מִיּוֹם אֶל יוֹם
  choice: రోజు రోజుకూ
  rationale: వరుస రోజులపాటు కొనసాగిన మౌనాన్ని సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: וְהֵקִים / הֵקִים אֹתָם
  choice: స్థిరపరుస్తాడు / స్థిరపరిచాడు
  rationale: హిఫీల్ రూపం మొక్కుబడి చెల్లుబాటులో నిలిచేలా చేయడమనే న్యాయపరమైన భావాన్ని తెలుపుతుంది; పునరుక్తి మరియు క్రియాకాల భేదం నిలుపబడ్డాయి.
- source_word: נְדָרֶיהָ
  choice: ఆమె చేసిన మొక్కుబడులు
  rationale: న్యాయ, ఆరాధనా సందర్భాల్లో נדרకు సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: אֱסָרֶיהָ
  choice: బంధక నియమాలు
  rationale: אסר (‘బంధించు’) మూలార్థాన్ని, వ్యక్తి తనపై విధించుకున్న కట్టుబాట్ల న్యాయబలాన్ని రెండింటినీ తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: ఆమెపై ఉన్న
  rationale: హీబ్రూలోని ‘ఆమెపై’ అనే రూపకాన్ని, ఆ కట్టుబాట్లు ఆమెకు వర్తిస్తాయనే భావాన్ని కాపాడుతుంది.
- source_word: הֶחֱרִשׁ לָהּ
  choice: అతడు ఆమెతో ఏమీ అనలేదు
  rationale: ‘ఆమె పట్ల మౌనంగా ఉన్నాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, అతడు అభ్యంతరం చెప్పలేదనే సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: తాను విన్న రోజున
  rationale: ఈ అధ్యాయంలో పునరావృతమయ్యే న్యాయపరమైన కాలపరిమితిని హీబ్రూకు సన్నిహితంగా నిలుపుతుంది.
theological_decisions:
- issue: భర్త మౌనం వల్ల కలిగే న్యాయపరమైన ఫలితం
  choice: ‘స్థిరపరుస్తాడు ... స్థిరపరిచాడు’ అని అనువదించడం
  alternative: ‘ఆమోదిస్తాడు’ లేదా ‘చెల్లుబాటు చేస్తాడు’
  rationale: మూలంలోని קום హిఫీల్ రూపం మొక్కుబడులను నిలిచేలా చేయడాన్ని సూచిస్తుంది; ‘స్థిరపరచు’ ఆ న్యాయఫలితాన్ని తెలియజేస్తూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘రోజు రోజుకూ’ నిరంతర మౌనాన్ని, ‘స్థిరపరచు’ మొక్కుబడులు చెల్లుబాటులో నిలవడాన్ని వ్యక్తం చేస్తాయి.
