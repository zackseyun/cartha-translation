  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: te
  text: అయితే అతడు వాటిని విన్న తరువాత తప్పకుండా రద్దు చేస్తే[a], ఆమె దోషాన్ని అతడు భరించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిశ్చయంగా రద్దు చేస్తే’ లేదా ‘పూర్తిగా రద్దు చేస్తే’ అని కూడా అనువదించవచ్చు. హీబ్రూలో చర్యను నొక్కిచెప్పడానికి నిరపేక్ష క్రియారూపాన్ని ప్రధాన క్రియతో కలిపి వాడారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆమె దోషాన్ని భరించాలి’ అనే మాటను ‘ఆమె దోషానికి బాధ్యత వహించాలి’ లేదా ‘ఆమె దోషానికి కలిగే శిక్షను భరించాలి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … చేస్తే
  rationale: ముందటి వాక్యంతో ఉన్న షరతుతో కూడిన వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָפֵר יָפֵר
  choice: తప్పకుండా రద్దు చేస్తే
  rationale: క్రియతో పాటు వాడిన హీబ్రూ infinitive absolute చర్యను నొక్కి చెబుతుంది; ‘తప్పకుండా’ ఆ ఉద్ఘాటనను నిలుపుతుంది, ‘రద్దు చేయడం’ ప్రమాణాల న్యాయపరమైన సందర్భానికి సరిపోతుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: సమీప సందర్భంలోని ఆమె ప్రమాణాలు లేదా ఆమెపై విధించుకున్న బాధ్యతలను సూచించే బహువచన సర్వనామాన్ని అలాగే నిలుపుతుంది.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: వాటిని విన్న తర్వాత
  rationale: భర్త విన్న తరువాత జరిగే చర్యను మూలానికి సన్నిహితంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנָשָׂא
  choice: అతడే భరించాలి
  rationale: న్యాయ-నైతిక సందర్భంలో נשׂא עון అనే ప్రయోగం దోషాన్ని లేదా దాని బాధ్యతను మోయడాన్ని సూచిస్తుంది; ‘అతడే’ ఫలితంగా బాధ్యత అతనిపై పడుతుందనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עֲוֺנָהּ
  choice: ఆమె దోషాన్ని
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, దోషం, దోషబాధ్యత లేదా దాని పరిణామాలు అనే హీబ్రూ పదంలోని విస్తృత భావాన్ని అతిగా నిర్ణయించకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన సందర్భంలో ‘దోషాన్ని భరించడం’ అనే మాట అర్థం
  choice: ఆలస్యంగా ఆమె ప్రమాణాలను రద్దు చేసినందుకు సంబంధించిన ఆమె దోషాన్ని భర్త భరిస్తాడు.
  alternative: ఆమె దోషానికి కలిగే శిక్షను అతడు భరిస్తాడు; లేదా ఆమె ప్రమాణాన్ని రద్దు చేసినందుకు బాధ్యతను అతడు వహిస్తాడు.
  rationale: נשׂא עון అనే హీబ్రూ నుడికారం దోషాన్ని, దోషబాధ్యతను, లేదా దాని శిక్షాపరమైన పరిణామాలను సూచించవచ్చు. ‘ఆమె దోషాన్ని భరించాలి’ అనే అనువాదం ఈ అర్థపరిధిని సంకుచితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా ఉన్నప్పటికీ న్యాయపరమైన, గంభీరమైన ధోరణి నిలుపబడింది. మూలంలోని ఉద్ఘాటనను ప్రధాన వాక్యంలో చూపించి, ‘దోషాన్ని భరించడం’లోని ఉద్దేశపూర్వక అస్పష్టతను పాదసూచికలో సంరక్షించాం.
