source:
  edition: WLC
  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: te
  text: అయితే ఆమె ఒక పురుషునికి భార్య అయితే[a], ఆమె మ్రొక్కుబడులు ఆమెపై ఉన్నా లేదా తన పెదవుల తొందరపాటు పలుకుతో తనను తాను బంధించుకొని ఉన్నా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ఒక పురుషునికి భార్య అయితే,” అంటే “ఆమెకు వివాహమైతే.” హీబ్రూ ప్రయోగానికి అక్షరార్థం “ఆమె ఒక పురుషునికి ఉంటుంది/అవుతుంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె పెదవుల పలుకు.” ఈ మాటబంధం అధికారిక మ్రొక్కుబడికి భిన్నంగా, తొందరపడి పలికిన స్వీయబంధక ప్రకటనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... ఉంటే
  rationale: ముందటి నియమానికి కొనసాగింపుగా, కొంత భిన్నమైన షరతును పరిచయం చేస్తుంది.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: ఆమె ఒక పురుషునికి భార్యగా ఉంటే
  rationale: היה + לְאִישׁ అనే హీబ్రూ ప్రయోగం వివాహ సంబంధంలో ఉండడాన్ని లేదా ప్రవేశించడాన్ని సూచిస్తుంది. తెలుగు పాఠ్యంలో సహజమైన వివాహార్థాన్ని ఇస్తూ, అది స్థితినా మార్పా అనే స్వల్ప సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: ఆమె మొక్కుబడులు ఆమెపై ఉండగా
  rationale: బాధ్యత ఆమెపై ఉన్నదనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; అవి అప్పటికే చట్టపరంగా ఖరారయ్యాయని ముందుగానే తేల్చదు.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: ఆమె పెదవుల తొందరపాటు పలుకు
  rationale: מִבְטָא అనేది పలుకు లేదా ఉచ్చారణ. సందర్భంలో అది ఆలోచించకుండా చేసిన స్వీయబంధక ప్రకటన కావచ్చని ‘తొందరపాటు’ సూచిస్తుంది; అయినా దాన్ని అధికారిక మొక్కుబడితో సమానంచేయదు.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: దానితో తనను తాను బంధించుకున్న
  rationale: వ్రత సంబంధ సందర్భంలో אָסַר యొక్క బంధించు/బాధ్యత పెట్టుకొను అనే న్యాయ రూపకాన్ని నిలుపుతూ, נֶפֶשׁ‌ను ఇక్కడ సహజమైన ఆత్మవాచక ప్రయోగంగా అనువదిస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన మొక్కుబడి సందర్భంలో נֶפֶשׁ అనువాదం
  choice: తనను తాను
  alternative: తన ప్రాణాన్ని / తన ఆత్మను
  rationale: ఇక్కడ విషయం మనిషి స్వరూపంపై సిద్ధాంతం కాదు; తనపై తానే బాధ్యత పెట్టుకోవడం. కాబట్టి ‘తనను తాను’ హీబ్రూ ఆత్మవాచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- issue: הָיוֹ תִהְיֶה לְאִישׁ లో వివాహ స్థితి లేదా వివాహంలోకి ప్రవేశం
  choice: భార్యగా ఉంటే
  alternative: భార్య అయితే / ఒక పురుషుణ్ణి పెళ్లి చేసుకుంటే
  rationale: మూల ప్రయోగం వివాహ సంబంధంలో ఉండడం లేదా ఆ సంబంధంలోకి రావడం రెండింటికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యం స్థితిని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. వాక్యం తరువాతి వచనంలో కొనసాగే షరతుగా ఉండటంతో చివర కామా ఉంచబడింది.
