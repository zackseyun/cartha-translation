source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: te
  text: 'తరువాత మోషే ఇశ్రాయేలు కుమారుల[a] గోత్రాధిపతులతో ఇలా అన్నాడు: “యాహ్వే ఆజ్ఞాపించిన మాట ఇదే:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత సహజంగా, “ఇశ్రాయేలీయుల గోత్రాధిపతులతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: తరువాత ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘తరువాత’ ఆ క్రమభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘చెప్పాడు’ ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సందర్భానికి సరిపోతుంది.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: గోత్రాధిపతులు
  rationale: רָאשֵׁי అంటే ‘అధిపతులు/ముఖ్యులు,’ מַטּוֹת ఇక్కడ ఇశ్రాయేలు గోత్రాలను సూచిస్తుంది. ‘గోత్రాధిపతులు’ సామాజిక నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ క్రియారూపాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: זֶה הַדָּבָר
  choice: మాట ఇదే
  rationale: דָּבָר కు ‘మాట,’ ‘విషయం’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ దైవిక ఆజ్ఞను పరిచయం చేస్తున్నందున ‘మాట’ మూలంలోని అధికారపూర్వక ఉక్తి భావాన్ని నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: పూర్తయిన దైవిక ఆజ్ఞను ఇప్పుడు తెలియజేస్తున్న భావాన్ని తెలుగు సంబంధక్రియారూపం సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం నేరుగా వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, మూలనామానికి దగ్గరైన ‘యాహ్వే’ను వాడాం.
- issue: בְנֵי יִשְׂרָאֵל లోని కుటుంబసంబంధ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగమైన, కుటుంబసంబంధమైన రూపాన్ని ప్రధాన పాఠంలో నిలిపాం; అది మొత్తం నిబంధన సమాజాన్ని సూచిస్తుందనే సహజమైన అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గోత్రాధిపతులు’ పరిపాలనా పాత్రను స్పష్టంగా తెలియజేస్తుంది; ‘ఆజ్ఞాపించిన మాట’ మూలంలోని అధికారపూర్వక సూత్రవాక్యాన్ని నిలుపుతుంది.
