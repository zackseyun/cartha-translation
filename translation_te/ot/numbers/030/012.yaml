  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా న్యాయపరమైన గంభీరతను నిలిపింది. ‘చెల్లుతాయి/చెల్లుతుంది’ అనే పునరుక్తి మూలంలోని సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
