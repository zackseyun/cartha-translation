source:
  edition: WLC
  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: te
  text: ఒకవేళ ఆమె భర్త అది విని, ఆమెతో ఏమీ అనకుండా ఉండి, ఆమె చేసిన మొక్కుబడిని రద్దు చేయకపోతే,[a] ఆమె మొక్కుబడులన్నీ చెల్లుతాయి; ఆమె తనమీద విధించుకున్న ప్రతి నిర్బంధమూ చెల్లుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఆమెను రద్దు చేయకపోతే.” ఈ సందర్భంలో ఆమె మొక్కుబడిని లేదా ఆమె తనమీద విధించుకున్న నిర్బంధాన్ని రద్దు చేయకపోవడం భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: ఒకవేళ ... విని
  rationale: చుట్టుపక్కల ఉన్న నియమవాక్యాల షరతు భావాన్ని అనుసరించి, వావ్ + ఖాతల్ రూపాన్ని తెలుగులో సహజమైన షరతుగా వ్యక్తం చేసింది.
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: ఈ వివాహసంబంధ న్యాయ సందర్భంలో אִישׁ అనే పదం 3వ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయంతో ‘ఆమె భర్త’ను సూచిస్తుంది.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: ఆమెతో ఏమీ అనకుండా ఉండి
  rationale: ఆమె మాట విన్న తరువాత స్పందించకుండా మౌనంగా ఉండడాన్ని ఈ హీబ్రూ ప్రయోగం సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: ఆమె చేసిన మొక్కుబడిని రద్దు చేయకపోతే
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మ ‘ఆమె’ అయినప్పటికీ, ఈ అధ్యాయ సందర్భంలో భర్త ఆమె మొక్కుబడి లేదా నిర్బంధం యొక్క చెల్లుబాటును రద్దు చేయకపోవడమే భావం. తెలుగులో అపార్థం రాకుండా అంతర్లీన కర్మను స్పష్టం చేసింది; మూల నిర్మాణాన్ని పాదసూచికలో తెలిపింది.
- source_word: כָּל נְדָרֶיהָ
  choice: ఆమె మొక్కుబడులన్నీ
  rationale: נדר అనే న్యాయపదానికి సాధారణంగా అర్థమయ్యే ‘మొక్కుబడి’ని వాడింది.
- source_word: וְכָל אִסָּר
  choice: ప్రతి నిర్బంధమూ
  rationale: אִסָּר ఇక్కడ ప్రమాణంతో తనమీద తానే పెట్టుకున్న కట్టుబాటు లేదా ఆంక్షను సూచిస్తుంది. ‘నిర్బంధం’ దాని బంధించే, పరిమితం చేసే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: ఆమె తనమీద విధించుకున్న
  rationale: తనపై తానే బంధనాన్ని పెట్టుకోవడం అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְקָמוּ ... יָקוּם
  choice: చెల్లుతాయి ... చెల్లుతుంది
  rationale: קום అనే క్రియ ఈ న్యాయ సందర్భంలో అమలులో లేదా చెల్లుబాటులో ఉండడాన్ని సూచిస్తుంది. వచనాంతర సమాంతరతను నిలుపుతూ క్రియను రెండుసార్లు పునరావృతం చేసింది.
