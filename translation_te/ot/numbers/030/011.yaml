id: NUM.30.11
reference: Numbers 30:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: te
  text: మరియు, ఆమె తన భర్త ఇంటిలో ఉండి మొక్కు చేసుకుంటే, లేదా ప్రమాణంతో తనపై బంధనాన్ని విధించుకుంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ఉన్నప్పుడు ... చేసుకున్నా
  rationale: ఈ షరతు వాక్యం ముందున్న న్యాయనిబంధనల వరుసలో తదుపరి సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన షరతు నిర్మాణంతో ఆ అనుసంధానాన్ని నిలిపింది.
- source_word: בֵּית אִישָׁהּ
  choice: తన భర్త ఇంట్లో
  rationale: ‘ఆమె భర్త ఇల్లు’ అనే స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; కుటుంబ లేదా సామాజిక భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: נָדָרָה
  choice: మొక్కుబడి చేసుకున్నా
  rationale: נדר దేవునికి లేదా దైవసంబంధంగా చేసే గంభీరమైన వాగ్దానాన్ని సూచిస్తుంది. ‘మొక్కుబడి చేసుకోవడం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, న్యాయపరమైన గంభీరతను నిలుపుతుంది.
- source_word: אוֹ
  choice: లేదా
  rationale: రెండు సంబంధిత న్యాయపరమైన అవకాశాలను వేరుచేసే సాధారణ వికల్ప సంధానం.
- source_word: אָסְרָה אִסָּר
  choice: తనపై తాను ఏదైనా నిర్బంధం విధించుకున్నా
  rationale: ఒకే మూలానికి చెందిన క్రియా-నామ నిర్మాణం వ్యక్తి తనను తాను బంధించే బాధ్యత లేదా నిషేధాన్ని బలంగా సూచిస్తుంది. ఈ అనువాదం అసహజమైన పదపునరుక్తి లేకుండా ఆ స్వీయబంధన భావాన్ని తెలియజేస్తుంది.
- source_word: עַל נַפְשָׁהּ
  choice: తనపై తాను
  rationale: ఇక్కడ נֶפֶשׁ ‘ఆత్మ’ అనే సంకుచిత భావంలో కాకుండా వ్యక్తి లేదా తననే సూచిస్తుంది. అందువల్ల స్వీయబాధ్యత భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בִּשְׁבֻעָה
  choice: ప్రమాణం చేసి
  rationale: ఈ ఉపసర్గ ప్రమాణం ఆ నిర్బంధాన్ని విధించే సాధనం లేదా దానికి తోడైన పరిస్థితి అని సూచిస్తుంది. ‘ప్రమాణం చేసి’ సహజమైన తెలుగులో ఆ గంభీరమైన శపథ స్వభావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ఇది తరువాతి వాక్యంతో కొనసాగుతున్న షరతు ఉపవాక్యం కావడంతో చివర కామా ఉంచబడింది. ‘మొక్కుబడి’ మరియు ‘ప్రమాణం’ మధ్య మూలపాఠంలోని భేదం నిలుపబడింది.
