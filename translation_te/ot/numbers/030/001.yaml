revisions:
- from: యాహ్వే మోషేకు ఆజ్ఞాపించినదంతటి ప్రకారం మోషే ఇశ్రాయేలు కుమారులతో చెప్పాడు[a].
  to: యాహ్వే మోషేకు ఆజ్ఞాపించిన సమస్తం ప్రకారం మోషే ఇశ్రాయేలు కుమారులకు చెప్పాడు[a].
  rationale: The revision changes the audience marker from comitative తో to dative కు, accurately representing Hebrew אֶל. It also smooths the expression for ‘according to all that’ without weakening its sense of conformity to Yahweh’s command. No theological or interpretive change is introduced.
