id: NUM.30.1
reference: Numbers 30:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించిన సమస్తం ప్రకారం మోషే ఇశ్రాయేలు కుమారులకు చెప్పాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు సంతానం’ లేదా ‘ఇశ్రాయేలీయులు.’ హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది; ఇది ఒడంబడిక ప్రజలను సూచించే స్థిరమైన జాతీయ సంబోధన.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: చెప్పాడు
  rationale: మూల క్రియ సాధారణంగా ‘చెప్పాడు’ అని అర్థమిస్తుంది. ప్రత్యక్ష ఉద్ధరణ లేకపోయినా, ఇక్కడ ఆజ్ఞల సారాన్ని ప్రజలకు చెప్పడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని, దాని ఒడంబడిక సంబంధమైన జాతీయ సంబోధనను నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతటి ప్రకారం
  rationale: כְּ ఉపసర్గ సూచించే అనుగుణతను ‘ప్రకారం’ స్పష్టంగా నిలుపుతుంది; ఇది కేవలం చెప్పిన విషయాన్ని మాత్రమే కాక, దైవ ఆజ్ఞకు అనుగుణంగా చెప్పడాన్ని తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: మోషే ప్రజలతో చెప్పడానికి ముందే యాహ్వే అతనికి ఇచ్చిన ఆజ్ఞను తెలుగు సంబంధక్రియా రూపం సహజంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో అందిస్తుంది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూలో మోషే ‘ఆజ్ఞాపించు’ క్రియకు కర్మగా ఉన్నాడు; తెలుగులో అదే సంబంధం సహజంగా సంప్రదాన విభక్తి ‘మోషేకు’తో వ్యక్తమవుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ ఆ నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే పుంలింగ ఒడంబడిక సంబంధమైన జాతీయ designation
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతానం; ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది స్థిరమైన జాతీయ సంబోధనగా పనిచేస్తుందనే విషయాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఆజ్ఞాపించినదంతటి ప్రకారం’ అనే నిర్మాణం కొద్దిగా అధికారికంగా ఉన్నప్పటికీ, మూలంలోని అనుగుణత భావాన్ని స్పష్టంగా నిలుపుతుంది.
