id: NUM.30.13
reference: Numbers 30:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: te
  text: కాని ఆమె భర్త తాను విన్న రోజునే వాటిని తప్పక రద్దుచేస్తే, ఆమె పెదవులనుండి వెలువడినదేదీ—ఆమె మొక్కుబడులుగాని, తనకు తాను కట్టుకున్న బాధ్యతగాని—చెల్లదు. ఆమె భర్త వాటిని రద్దుచేశాడు; యెహోవా ఆమెను క్షమిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... చేస్తే
  rationale: ముందటి న్యాయపరిస్థితికి భిన్నమైన షరతును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָפֵר יָפֵר
  choice: తప్పక రద్దుచేస్తే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో వచ్చిన క్రియలోని బలాన్ని తెలుగులో పునరుక్తి లేకుండా నిలుపుతుంది.
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: ఈ వివాహ-న్యాయ సందర్భంలో ఇదే సహజమైన, నిర్దిష్టమైన అర్థం.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: తాను విన్న రోజునే
  rationale: చర్యకు వర్తించే న్యాయపరమైన కాలపరిమితిని స్పష్టంగా నిలుపుతుంది; ‘నే’ మూలంలోని కాలప్రాధాన్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: ఆమె పెదవులనుండి వెలువడినదేదీ
  rationale: అక్షరార్థమైన ‘ఆమె పెదవులనుండి వెలువడిన సమస్తం’ అనే న్యాయపదబంధాన్ని, తరువాతి నిరాకరణతో సహజంగా కలుపుతుంది.
- source_word: לִנְדָרֶיהָ
  choice: ఆమె మొక్కుబడులు
  rationale: נדר అనే ఆరాధనాత్మక-న్యాయపరమైన ప్రతిజ్ఞకు సాధారణ తెలుగు బైబిలు పదప్రయోగం.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: తనకు తాను విధించుకున్న నిర్బంధం
  rationale: తనమీద తానే విధించుకున్న బంధనాత్మక బాధ్యత అనే ప్రతిబింబార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יָקוּם
  choice: చెల్లదు
  rationale: ఆ పలుకుబడి న్యాయపరంగా అమలులో నిలవదనే భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הֲפֵרָם
  choice: వాటిని రద్దుచేశాడు
  rationale: భర్త చేసిన నిర్ణాయక చర్యను, దాని ఫలితస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం YHWHను పేరుగా పారదర్శకంగా ప్రతిబింబిస్తుంది.
- source_word: יִסְלַח לָהּ
  choice: ఆమెను క్షమిస్తాడు
  rationale: סלח యొక్క నేరుగా ఉన్న క్షమాపణ భావాన్ని విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: రద్దయిన మొక్కుబడుల తరువాత దేవుని క్షమాపణ భావం
  choice: భర్త రద్దుచేసినందువల్ల మొక్కుబడులు చెల్లవని, యెహోవా ఆమెను క్షమిస్తాడని వచనంలోని క్రమాన్నే ఉంచడం
  alternative: క్షమాపణ ఆమె తొందరపడి మొక్కుబడి చేసినందుకని స్పష్టీకరించడం, లేదా దీన్ని కేవలం సూత్రప్రాయ న్యాయవాక్యంగా పరిగణించడం
  rationale: మూలవచనం క్షమాపణకు సంబంధించిన కారణాన్ని మరింత నిర్వచించదు. అందువల్ల నైతిక బాధ్యత స్వరూపాన్ని గానీ, అధికారంపై విస్తృత సిద్ధాంతాన్ని గానీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి, అయితే సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని బలపరిచిన రద్దుచర్యను ‘తప్పక’తో, న్యాయబద్ధతను ‘చెల్లదు’తో వ్యక్తం చేశాం.
