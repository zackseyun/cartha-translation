revisions:
- from: కాని ఆమె భర్త తాను విన్న రోజునే వాటిని తప్పక రద్దుచేస్తే, ఆమె పెదవులనుండి వెలువడినదేదీ—ఆమె మొక్కుబడులుగాని, తనకు తాను విధించుకున్న నిర్బంధంగాని—చెల్లదు. ఆమె భర్త వాటిని రద్దుచేశాడు; యెహోవా ఆమెను క్షమిస్తాడు.
  to: కాని ఆమె భర్త తాను విన్న రోజునే వాటిని తప్పక రద్దుచేస్తే, ఆమె పెదవులనుండి వెలువడినదేదీ—ఆమె మొక్కుబడులుగాని, తనకు తాను కట్టుకున్న బాధ్యతగాని—చెల్లదు. ఆమె భర్త వాటిని రద్దుచేశాడు; యెహోవా ఆమెను క్షమిస్తాడు.
  rationale: Only the expression for the self-binding obligation has been revised. The replacement preserves the reflexive sense of the Hebrew and its legal force while avoiding the misleading implication of externally imposed restraint. No footnote is needed, since no disputed reading or essential alternative is involved.
  reviewer_model: gpt-5.6-terra
