id: NUM.30.4
reference: Numbers 30:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: te
  text: ఒక స్త్రీ తన యౌవనంలో తన తండ్రి ఇంటిలో ఉండగా యెహోవాకు మొక్కుబడి చేసి, తనను తాను ఒక కట్టుబాటుకు లోబరచుకుంటే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఈ పదబంధం క్రియతో దానికి సంబంధమైన నామాన్ని కలిపి, తనను తాను బంధించే కట్టుబాటుకు లోబరచుకోవడాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: ఒక స్త్రీ … చేసుకున్నా
  rationale: న్యాయవిధిలో కొత్త షరతును పరిచయం చేసే ఈ నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన షరతార్థక రూపంతో అందించింది.
- source_word: תִדֹּר נֶדֶר
  choice: మొక్కుబడి చేసుకున్నా
  rationale: సజాతీయ క్రియ-నామ నిర్మాణాన్ని తెలుగులో అక్షరార్థంగా పునరావృతం చేయడం అసహజం; ‘మొక్కుబడి చేసుకొను’ దాని అధికారిక వాగ్దాన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וְאָסְרָה אִסָּר
  choice: లేదా తనపై తాను ఒక బాధ్యత విధించుకున్నా
  rationale: ఈ సజాతీయ నిర్మాణం వ్యక్తి తనను తాను కట్టుబాటులో ఉంచుకోవడాన్ని సూచిస్తుంది. ‘బాధ్యత విధించుకొను’ అనే రూపం న్యాయపరమైన బంధక శక్తిని స్పష్టంగా ఉంచుతుంది; ఇక్కడి וְ సందర్భానుసారంగా ప్రత్యామ్నాయ సంబంధాన్ని సూచించగలదు.
- source_word: בְּבֵית אָבִיהָ
  choice: తన తండ్రి ఇంటిలో ఉంటూ
  rationale: కేవలం స్థలాన్ని మాత్రమే కాక, తండ్రి గృహంలో ఉన్న పరిస్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; పాఠ్యంలో స్పష్టంగా లేని న్యాయాధికారాన్ని అనువాదంలో చేర్చలేదు.
- source_word: בִּנְעֻרֶיהָ
  choice: తన యౌవనంలో
  rationale: వయోకాలాన్ని నేరుగా తెలియజేస్తుంది; ‘అవివాహితగా’ వంటి సందర్భానుగతమైన కాని పాఠ్యంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే రూపంగా ‘యెహోవా’ను ఎంచుకుంది; ‘యాహ్వే’ మరొక సాధ్యమైన పండిత లిప్యంతరీకరణ.
- issue: נֶדֶר మరియు אִסָּר మధ్య భేదం
  choice: మొక్కుబడి … బాధ్యత
  alternative: రెండింటినీ ‘మొక్కుబడి’గా అనువదించడం
  rationale: వచనంలోని రెండు సంబంధితమైనా వేర్వేరు న్యాయపదాల మధ్య ఉన్న భావభేదాన్ని కాపాడింది; రెండవది తనపై తాను విధించుకునే నిర్బంధ బాధ్యతను సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవిధికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ఈ వాక్యం తరువాతి వచనాల్లో పూర్తయ్యే షరతు వాక్యభాగం కాబట్టి చివర అల్పవిరామం ఉంచబడింది.
