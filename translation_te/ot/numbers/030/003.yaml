id: NUM.30.3
reference: Numbers 30:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: te
  text: ఒక పురుషుడు యాహ్వేకు మొక్కుబడి చేసుకున్నా, లేదా తనను తాను ఒక బాధ్యతకు బంధించుకోవడానికి ప్రమాణం చేసినా[a], అతడు తన మాట తప్పకూడదు[b]; తన నోటినుంచి వెలువడినదంతా అతడు చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనపై తాను ఒక బంధకమైన నియమాన్ని విధించుకోవడానికి.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘తనపై ఒక బంధాన్ని బంధించుకోవడం’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన మాటను అపవిత్రపరచకూడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: మూలంలో పుంలింగ ఏకవచన నామవాచకం ఉంది; ఈ న్యాయ సందర్భంలో దాని లింగ నిర్దిష్టతను నిలిపింది.
- source_word: יִדֹּר נֶדֶר
  choice: మొక్కుబడి చేసుకున్నా
  rationale: సజాతి క్రియ-నామ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు న్యాయశైలిలో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: ప్రమాణం చేసినా
  rationale: గంభీరమైన ప్రమాణ చర్యను సహజంగా వ్యక్తం చేస్తూ మూలంలోని సజాతి నిర్మాణ భావాన్ని నిలుపుతుంది.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: తనను తాను ఒక బాధ్యతకు బంధించుకోవడానికి
  rationale: తనపై తానే బంధకమైన బాధ్యతను విధించుకునే న్యాయ భావాన్ని స్పష్టంగా తెలుపుతుంది; మూలంలోని 'బంధించు/బంధం' పదప్రయోగాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: అతడు తన మాట తప్పకూడదు
  rationale: חלל హిఫిల్ రూపంలోని 'అపవిత్రం చేయడం/ఉల్లంఘించడం' అనే భావాన్ని ఈ సందర్భంలో సహజమైన తెలుగు నుడికారమైన 'మాట తప్పడం'తో అందిస్తుంది.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: తన నోటినుంచి వెలువడినదంతా అతడు చేయాలి
  rationale: నోటినుంచి మాట వెలువడే మూలభాషా దృశ్యాన్ని నిలుపుతూ న్యాయబద్ధ కర్తవ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: వచనంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు లిపిలో 'యాహ్వే'గా లిప్యంతరీకరించింది.
- issue: לֹא יַחֵל דְּבָרוֹలో పవిత్రతకు సంబంధించిన భావం
  choice: తన మాట తప్పకూడదు
  alternative: తన మాటను అపవిత్రపరచకూడదు
  rationale: ప్రధాన పాఠంలో న్యాయపరమైన ఉద్దేశాన్ని సహజంగా అందించి, మూలంలోని పవిత్రం/అపవిత్రం భావక్షేత్రాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించింది. మూలంలోని పురుష లింగ నిర్దిష్టతను, నోటినుంచి మాట వెలువడే దృశ్యాన్ని, స్వయంగా బాధ్యతకు బంధించుకునే భావాన్ని నిలిపింది; అసహజమైన పదానువాదాన్ని పాదసూచికలకు పరిమితం చేసింది.
