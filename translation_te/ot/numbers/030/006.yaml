  to: అయితే, ఆమె తండ్రి వాటిని విన్న రోజున ఆమెను వారిస్తే, ఆమె చేసిన మొక్కుబడులుగానీ, తనపై తానే విధించుకున్న కట్టుబాట్లుగానీ[a] ఏవీ నిలవవు[b]. ఆమె తండ్రి ఆమెను వారించాడు కాబట్టి యెహోవా ఆమెను క్షమిస్తాడు.
