  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: te
  text: అయితే, ఆమె తండ్రి వాటిని విన్న రోజున ఆమెను వారిస్తే, ఆమె చేసిన మొక్కుబడులుగానీ, తనపై తానే విధించుకున్న కట్టుబాట్లుగానీ[a] ఏవీ నిలవవు[b]. ఆమె తండ్రి ఆమెను వారించాడు కాబట్టి యెహోవా ఆమెను క్షమిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంధక బాధ్యతలు.’ హెబ్రీ పదం, ముఖ్యంగా మొక్కుబడుల సందర్భంలో, వ్యక్తి తనపై తానే విధించుకున్న కట్టుబాట్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అమల్లోకి రావు.’ హెబ్రీలో అక్షరార్థంగా ‘నిలవవు’; అంటే అవి బంధకంగా చెల్లుబాటు కావు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి నియమానికి భిన్నమైన షరతును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన వ్యతిరేక-షరతు సంధానం.
- source_word: הֵנִיא ... אֹתָהּ
  choice: ఆమెను వారిస్తే / ఆమెను వారించాడు
  rationale: ఈ వ్రతసందర్భంలో తండ్రి ఆమె నిర్ణయాన్ని అడ్డుకొని అమల్లోకి రానివ్వకపోవడాన్ని సూచిస్తుంది. హెబ్రీలో కుమార్తెనే ప్రత్యక్ష కర్మగా ఉంచిన నిర్మాణాన్ని ఇది నిలుపుతుంది.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: అది విన్న రోజునే
  rationale: హెబ్రీలోని నిర్దిష్ట కాలపరిమితిని కాపాడుతూ, తెలుగు న్యాయవాక్యానికి సహజంగా ఉంటుంది.
- source_word: כָּל נְדָרֶיהָ
  choice: ఆమె చేసిన మొక్కుబడులుగానీ ... ఏవీ
  rationale: נדר అనే పదం దేవునికి లేదా ఆరాధనా సందర్భంలో చేసే వ్రతం/మొక్కుబడిని సూచిస్తుంది. చివరి నిషేధంతో కలిపి ‘ఏవీ నిలవవు’ అని తెలుగులో సహజంగా వ్యక్తం చేయబడింది.
- source_word: וֶאֱסָרֶיהָ אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: తనను తాను బంధించుకున్న బంధనాలుగానీ
  rationale: తనపై తానే విధించుకున్న కట్టుబాట్లనే సూచించే హెబ్రీ పదప్రయోగంలోని ‘బంధించు’ భావాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
- source_word: לֹא יָקוּם
  choice: ఏవీ నిలవవు
  rationale: ‘నిలబడవు’ అనే మూలరూపాన్ని సహజ తెలుగులో ఉంచి, అవి చెల్లుబాటులో ఉండవనే న్యాయార్థాన్ని తెలియజేస్తుంది.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దైవనామాన్ని సాధారణ తెలుగు లిప్యంతరీకరణతో స్పష్టంగా నిలుపుతుంది.
- source_word: יִסְלַח לָהּ
  choice: ఆమెను క్షమిస్తాడు
  rationale: సלח క్రియకు వ్యక్తిని కర్మగా ఉంచిన సూటి, సహజ తెలుగు రూపం.
- source_word: כִּי
  choice: కాబట్టి
  rationale: తండ్రి వారించడమే క్షమాపణ ప్రకటనకు ఇచ్చిన కారణమని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రద్దయిన మొక్కుబడి సందర్భంలో దైవిక క్షమాపణ అర్థం
  choice: తండ్రి సకాలంలో వారించిన కారణంగా మొక్కుబడి బంధనశక్తి లేకుండా పోతుందని, యెహోవా ఆమెను క్షమిస్తాడని వచనం చెప్పినంతవరకే అనువాదం ఉంచబడింది.
  alternative: నెరవేర్చని మొక్కుబడివల్ల కలిగిన ఏ పాపానికైనా విస్తృతమైన క్షమాపణగా దీన్ని వివరించడం.
  rationale: తక్షణ సందర్భం మొక్కుబడుల చెల్లుబాటు గురించిన న్యాయనియమం. క్షమాపణ ఎందుకు అవసరమో వచనం పూర్తిగా వివరించదు; అందువల్ల ఆ ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘మొక్కుబడి,’ ‘బంధనం,’ ‘నిలవు’ వంటి పదాలతో మూలంలోని వ్రతపరమైన మరియు న్యాయపరమైన పదజాలాన్ని నిలుపుతూ, అతిగా పదక్షరానువాదం కాకుండా వాక్యాన్ని సహజంగా మలిచాం.
