translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హెబ్రీయ మూలంలోని ‘బంధించడం/నిలవడం’ అనే రూపకాన్ని ప్రధాన వాక్యంలో సహజమైన ‘కట్టుబాటుగా ఉంటుంది’గా ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
