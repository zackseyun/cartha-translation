source:
  edition: WLC
  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: te
  text: విధవరాలు గానీ, విడాకులు పొందిన స్త్రీ గానీ చేసిన మొక్కుబడి—ఆమె తన మీద విధించుకున్నదంతా—ఆమెకు కట్టుబాటుగా ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె మీద అమలులో ఉంటుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: మొక్కుబడి
  rationale: దేవునికి చేసే గంభీరమైన వాగ్దానాన్ని సూచించే న్యాయ/ఆరాధనా సందర్భానికి సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אַלְמָנָה
  choice: విధవరాలు
  rationale: భర్త మరణించిన స్త్రీని సూచించే స్పష్టమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: גְרוּשָׁה
  choice: విడాకులు పొందిన స్త్రీ
  rationale: విడిచిపెట్టబడిన లేదా వివాహవిచ్ఛేదం పొందిన స్త్రీ అనే నిష్క్రియ భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: כֹּל אֲשֶׁר
  choice: అంతా
  rationale: మొదట ప్రస్తావించిన మొక్కుబడికే పరిమితం కాకుండా, ఆమె స్వీకరించిన ప్రతి బంధక బాధ్యతను సమగ్రంగా సూచిస్తుంది.
- source_word: אָסְרָה
  choice: విధించుకున్న
  rationale: తనను తాను ఒక బాధ్యతకు బంధించుకోవడం అనే న్యాయార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל נַפְשָׁהּ
  choice: తన మీద
  rationale: అక్షరార్థంలోని ‘తన ప్రాణం/తన వ్యక్తి మీద’ అనే ప్రతిబింబ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יָקוּם
  choice: ఉంటుంది
  rationale: న్యాయపరంగా అమలులో నిలిచి ఉండడం అనే భావాన్ని, ‘కట్టుబాటుగా’తో కలిపి సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עָלֶיהָ
  choice: ఆమెకు కట్టుబాటుగా
  rationale: ఆ బాధ్యత ఆమె మీద అమలులో ఉంటుందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; హెబ్రీయ పదబంధంలోని భారం/బంధక భావాన్ని అతిగా ప్రతికూలంగా చేయదు.
