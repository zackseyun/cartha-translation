  to: ఆమె మొక్కుబడిని గానీ, ఆమె తనపై తాను విధించుకున్న కట్టుబాటును[a] గానీ ఆమె తండ్రి విని, ఆమెకు ఏమీ చెప్పకుండా మౌనంగా ఉంటే,[b] ఆమె మొక్కుబడులన్నీ చెల్లుబాటులో ఉంటాయి; ఆమె తనపై తాను విధించుకున్న ప్రతి కట్టుబాటూ చెల్లుబాటులో ఉంటుంది.
