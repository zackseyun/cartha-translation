  edition: WLC
  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: te
  text: ఆమె మొక్కుబడిని గానీ, ఆమె తనపై తాను విధించుకున్న కట్టుబాటును[a] గానీ ఆమె తండ్రి విని, ఆమెకు ఏమీ చెప్పకుండా మౌనంగా ఉంటే,[b] ఆమె మొక్కుబడులన్నీ చెల్లుబాటులో ఉంటాయి; ఆమె తనపై తాను విధించుకున్న ప్రతి కట్టుబాటూ చెల్లుబాటులో ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘కట్టుబాటు’ (హీబ్రూ: אִסָּר) అనేది ‘మొక్కుబడి’కి సంబంధించినదే అయినా భిన్నమైన పదం. ఇది తనపై తానే విధించుకున్న బంధించే బాధ్యత లేదా ఆంక్షను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆమెకు మౌనంగా ఉంటే.’ ఈ సందర్భంలో తండ్రి అభ్యంతరం చెప్పకపోవడం వల్ల ఆ మొక్కుబడులు, కట్టుబాట్లు చెల్లుబాటులో ఉంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: ఆమె చేసిన మొక్కుబడి / మొక్కుబడులు
  rationale: నדר అనేది ఈ ధార్మిక-న్యాయ సందర్భంలో దేవునికి చేసే vowను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మొక్కుబడి’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֱסָרָהּ / אִסָּר
  choice: నిర్బంధం
  rationale: אִסָּר అనేది మొక్కుబడితో సంబంధమున్నప్పటికీ దానికంటే భిన్నమైన, తనపై తానే విధించుకునే కట్టుబాటు లేదా ఆంక్ష. ‘నిర్బంధం’ ఆ బంధించే న్యాయబలాన్ని నిలుపుతుంది; ‘మొక్కుబడి’తో ఉన్న పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: తనను తాను బంధించుకున్న
  rationale: హీబ్రూ నుడికారంలోని స్వీయ-బంధన భావాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: וְהֶחֱרִישׁ לָהּ אָבִיהָ
  choice: ఆమెతో ఏమీ అనకుండా మౌనంగా ఉంటే
  rationale: క్రియ యొక్క మూలార్థమైన మౌనాన్ని నిలుపుతూ, తండ్రి అభ్యంతరం చెప్పకపోవడాన్ని సందర్భానుసారంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְקָמוּ ... יָקוּם
  choice: చెల్లుతాయి / చెల్లుతుంది
  rationale: ఈ న్యాయ సందర్భంలో קום అంటే అమల్లో నిలవడం లేదా చెల్లుబాటు కావడం. ‘చెల్లుతుంది’ సాధారణ పాఠకునికి న్యాయబలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל
  choice: అన్నీ / ప్రతి
  rationale: బహువచనమైన మొక్కుబడులతో ‘అన్నీ’, ఏకవచన సమూహార్థకమైన నిర్బంధంతో ‘ప్రతి’ వాడటం తెలుగులో సహజంగా ఉండి హీబ్రూ పంపిణీ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి మౌనం యొక్క న్యాయపరమైన ఫలితం
  choice: మౌనాన్ని పేర్కొని, మొక్కుబడులు మరియు నిర్బంధాలు ‘చెల్లుతాయి’ అని అనువదించడం
  alternative: మౌనం అంటే తండ్రి సమ్మతించాడని ప్రత్యక్షంగా చేర్చడం
  rationale: మూలపాఠం సమ్మతిని స్పష్టంగా చెప్పదు; మౌనం వల్ల కట్టుబాట్లు నిలుస్తాయని మాత్రమే చెబుతుంది. అందువల్ల సమ్మతి అనే వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘మొక్కుబడి’ మరియు ‘నిర్బంధం’ అనే రెండు వేర్వేరు పదాలతో హీబ్రూలోని పదభేదం నిలుపబడింది.
