source:
  edition: WLC
  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: te
  text: తనను తాను బాధించుకోవడానికి చేసే ప్రతి మొక్కుబడినీ, ప్రతి బంధకమైన ప్రమాణాన్నీ ఆమె భర్త స్థిరపరచవచ్చు[a], లేదా ఆ మొక్కుబడినీ ప్రమాణాన్నీ ఆమె భర్త రద్దు చేయవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారాన్ని అక్షరార్థంగా అనువదిస్తే, “తన ప్రాణాన్ని బాధపెట్టుకోవడానికి.” దీనికి “తనను తాను నిరాకరించుకోవడానికి” లేదా “తనను తాను తగ్గించుకోవడానికి” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: మొక్కుబడి
  rationale: దేవునికి చేసే పవిత్ర వాగ్దానాన్ని సూచించే נֵדֶרకు ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘మొక్కుబడి’ సహజమైన, నిర్దిష్టమైన పదం.
- source_word: שְׁבֻעַת אִסָּר
  choice: నిర్బంధ ప్రమాణం
  rationale: ఈ నిర్మాణంలో ‘ప్రమాణం’తో పాటు వ్యక్తిపై ఆంక్ష లేదా బంధం విధించే אִסָּר భావాన్నీ నిలుపుతుంది.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: తనను తాను బాధించుకోవడానికి
  rationale: హీబ్రూ నుడికారంలోని స్వీయ బాధ/స్వీయ నిరాకరణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; నుడికారపు ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: נָפֶשׁ
  choice: తనను తాను
  rationale: ఈ నుడికారంలో נֶפֶשׁను విడిగా ‘ఆత్మ’ అని అనువదిస్తే ఆధునిక తెలుగులో తప్పుదారి పట్టించే అవకాశం ఉంది; ఇక్కడ అది వ్యక్తి తననే సూచిస్తుంది.
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: వివాహ సంబంధ న్యాయ సందర్భంలో 3 స్త్రీ ఏకవచన ప్రత్యయంతో ఉన్న אִישׁ స్పష్టంగా ‘ఆమె భర్త’ను సూచిస్తుంది.
- source_word: יְקִימֶנּוּ
  choice: స్థిరపరచవచ్చు
  rationale: קום హిఫీల్ రూపం మొక్కుబడిని అమలులో నిలిపి, చెల్లుబాటుగా ఉంచడాన్ని సూచిస్తుంది.
- source_word: יְפֵרֶנּוּ
  choice: రద్దు చేయవచ్చు
  rationale: మొక్కుబడి చట్టంలో פרר హిఫీల్ రూపం దాని చెల్లుబాటును తొలగించడం లేదా రద్దు చేయడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది.
- source_word: כָּל ... וְכָל
  choice: ప్రతి ... ప్రతి ...
  rationale: రెండు వర్గాలనూ సమగ్రంగా చేర్చే పునరుక్త పంపిణీ భావాన్ని తెలుగులో నిలుపుతుంది.
