- from: తనను తాను బాధించుకోవడానికి చేసే ప్రతి మొక్కుబడినీ, ప్రతి నిర్బంధ ప్రమాణాన్నీ ఆమె భర్త స్థిరపరచవచ్చు[a] లేదా ఆమె భర్త దాన్ని రద్దు చేయవచ్చు.
  to: తనను తాను బాధించుకోవడానికి చేసే ప్రతి మొక్కుబడినీ, ప్రతి బంధకమైన ప్రమాణాన్నీ ఆమె భర్త స్థిరపరచవచ్చు[a], లేదా ఆ మొక్కుబడినీ ప్రమాణాన్నీ ఆమె భర్త రద్దు చేయవచ్చు.
