translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేసి, దాని అక్షరార్థం మరియు నిజమైన అర్థవిస్తృతిని పాదసూచికలో భద్రపరచాం. [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
