  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడాం. హీబ్రూ న్యాయభాషలోని ‘నిలుస్తాయి’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా కాపాడాం.
