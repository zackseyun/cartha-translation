id: NUM.30.8
reference: Numbers 30:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: te
  text: ఆమె భర్త దాని గురించి విన్న రోజున ఆమెతో ఏమీ చెప్పకుండా ఉంటే[a], ఆమె మొక్కుబడులు నిలుస్తాయి; ఆమె తనపై కట్టుకున్న బంధకాలు[b] నిలుస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె పట్ల మౌనంగా ఉంటే.’ ఈ హీబ్రూ నుడికారం భర్త ఆమెకు అభ్యంతరం చెప్పకపోవడాన్ని సూచిస్తుంది; అందువల్ల ఆమె మొక్కుబడులు, బంధకాలు చెల్లుబాటులో ఉంటాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కట్టుబాట్లు’ లేదా ‘బాధ్యతలు.’ ఇక్కడి హీబ్రూ పదం ఆమె తనపై తానే కట్టుకున్న బంధకరమైన బాధ్యతలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: వింటే
  rationale: న్యాయపరమైన షరతును కొనసాగించే ఈ క్రియారూపాన్ని తెలుగులో సహజమైన షరతురూపంతో వ్యక్తపరచాం.
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: వివాహ న్యాయ సందర్భంలో אִישָׁהּ అంటే సాధారణంగా ‘ఆమె పురుషుడు’ కాదు, ‘ఆమె భర్త’.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: విన్న రోజున
  rationale: అతడు విన్న నిర్దిష్ట రోజుకే న్యాయపరమైన ప్రాముఖ్యత ఉందనే హీబ్రూ కాలసూచనను నిలిపింది.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: ఆమె పట్ల మౌనంగా ఉంటే
  rationale: ఆమె చేసిన మొక్కుబడికి అభ్యంతరం చెప్పకుండా ఉండడాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘మౌనం’ భావాన్ని కాపాడింది.
- source_word: וְקָמוּ / יָקֻמוּ
  choice: నిలుస్తాయి
  rationale: మొక్కుబడులు, కట్టుబాట్లు చెల్లుబాటులో కొనసాగుతాయని సూచించే న్యాయపరమైన భావాన్ని, అలాగే మూలంలోని పునరుక్తిని నిలిపింది.
- source_word: נְדָרֶיהָ
  choice: ఆమె మొక్కుబడులు
  rationale: దేవుని ఎదుట స్వచ్ఛందంగా చేసిన ప్రమాణపూర్వక అంకితాలను సూచించడానికి సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וֶאֱסָרֶהָ
  choice: ఆమె ... కట్టుబాట్లు
  rationale: వ్యక్తి తనపై తానే పెట్టుకున్న బంధకరమైన బాధ్యతల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: ఆమె తనపై పెట్టుకున్న
  rationale: తనను తాను బంధించుకోవడం అనే హీబ్రూ భావచిత్రాన్ని అతిగా అక్షరార్థం చేయకుండా, స్వీయబాధ్యత భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
