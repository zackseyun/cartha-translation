- from: ఆమె భర్త దాని గురించి విన్న రోజున ఆమె పట్ల మౌనంగా ఉంటే[a], ఆమె మొక్కుబడులు నిలుస్తాయి; ఆమె తనపై పెట్టుకున్న కట్టుబాట్లు[b] నిలుస్తాయి.
  to: ఆమె భర్త దాని గురించి విన్న రోజున ఆమెతో ఏమీ చెప్పకుండా ఉంటే[a], ఆమె మొక్కుబడులు నిలుస్తాయి; ఆమె తనపై కట్టుకున్న బంధకాలు[b] నిలుస్తాయి.
  rationale: The revision improves modern Telugu idiom for the husband’s silence and strengthens the lexical distinction for the woman’s self-imposed bindings. Footnote a is corrected to cover the plural vows and binding commitments in the verse, without adding interpretive content beyond the Hebrew legal idiom.
