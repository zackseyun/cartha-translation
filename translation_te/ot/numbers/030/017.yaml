  text: אֵ֣לֶּה הַֽ/חֻקִּ֗ים אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִשְׁתּ֑/וֹ בֵּֽין אָ֣ב לְ/בִתּ֔/וֹ בִּ/נְעֻרֶ֖י/הָ בֵּ֥ית אָבִֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: te
  text: 'యాహ్వే మోషేకు ఆజ్ఞాపించిన నియమాలు ఇవి: ఒక పురుషునికీ అతని భార్యకూ మధ్య[a], అలాగే తండ్రికీ తన కుమార్తెకూ మధ్య—ఆమె తన యౌవనంలో తన తండ్రి ఇంట్లో ఉన్నప్పుడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఒక పురుషునికి అతని భార్యకు మధ్య, అలాగే ఒక తండ్రికి తన కుమార్తెకు మధ్య.”'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం కుమార్తె తన యౌవనకాలంలో తన తండ్రి ఇంట్లో ఉన్న పరిస్థితిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: నియమాలు ఇవి
  rationale: సారాంశంగా ముందున్న న్యాయవిధులను సూచించే బహువచన నామవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; חֻקִּים లోని నిర్దేశిత న్యాయనియమాల భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించిన
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, צוה యొక్క ఆజ్ఞాపన భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: ఒక పురుషునికి అతని భార్యకు మధ్య
  rationale: בֵּין యొక్క ‘మధ్య’ అనే సంబంధార్థాన్ని, అలాగే אִישׁ మరియు אִשָּׁה లోని లింగ-వైవాహిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: ఒక తండ్రికి అతని కుమార్తెకు మధ్య
  rationale: ముందటి בֵּין నిర్మాణంతో ఉన్న సమాంతరతను కాపాడుతూ తండ్రి–కుమార్తె న్యాయసంబంధాన్ని యథాతథంగా తెలియజేస్తుంది.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: ఆమె తన యౌవనంలో తన తండ్రి ఇంట్లో ఉన్నప్పుడు
  rationale: యౌవనకాలం మరియు తండ్రి ఇంటిలో నివాసం అనే రెండు అంశాలను కలిపి సహజ తెలుగులో వ్యక్తం చేస్తుంది; వచనం స్పష్టంగా చెప్పనిదాన్ని వయస్సు లేదా అధికారానికి సంబంధించిన ఖచ్చిత న్యాయవర్గంగా నిర్ణయించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా, మూల ఉచ్చారణకు సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- issue: వైవాహిక సంబంధంలో אִישׁ యొక్క అనువాదం
  choice: పురుషుడు
  alternative: భర్త
  rationale: ‘అతని భార్య’ అనే పదబంధం వైవాహిక సందర్భాన్ని స్పష్టం చేస్తుంది; అయినా אִישׁ యొక్క సాధారణ పదార్థాన్ని ‘పురుషుడు’గా ఉంచడం ద్వారా మూలంలోని పదప్రయోగాన్ని అనవసరంగా సంకుచితం చేయలేదు.
- issue: బֵּין పదబంధాల న్యాయార్థం
  choice: …కు …కు మధ్య—వర్తించే నియమాలు
  alternative: …గురించిన నియమాలు
  rationale: ‘మధ్య’ అనే మూల సంబంధభాషను నిలుపుతూ, తెలుగులో వాక్యం అసంపూర్ణంగా అనిపించకుండా ‘వర్తించే’ అని పూరించాం. దీనివల్ల సంబంధిత పక్షాల మధ్య న్యాయపరిధి సూచించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ-సారాంశ శైలిని ఉపయోగించాం. మూలంలోని సమాంతర ‘మధ్య’ నిర్మాణాన్ని నిలిపి, సహజ ప్రవాహం కోసం చివర ‘వర్తించే నియమాలు’ అని పూరించాం.
