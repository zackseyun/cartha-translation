- from: అయితే ఆమె భర్త దాని గురించి విన్న రోజునే ఆమెను అడ్డుకొని, ఆమెపై ఉన్న మొక్కుబడిని గాని, ఆమె తనను తాను బంధించుకున్నప్పుడు పెదవులతో పలికిన తొందరపాటు మాటను గాని రద్దు చేస్తే, యెహోవా ఆమెను క్షమిస్తాడు.[a]
  to: అయితే ఆమె భర్త దాని గురించి విన్న రోజున ఆమెకు అభ్యంతరం చెప్పి, ఆమెపై ఉన్న ఆమె మొక్కుబడినీ, ఆమె తనపై తాను బంధం వేసుకోవడానికి పలికిన పెదవుల మాటనూ రద్దు చేస్తే, యాహ్వే ఆమెను క్షమిస్తాడు.[a]
