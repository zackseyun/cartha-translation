id: NUM.30.9
reference: Numbers 30:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: te
  text: అయితే ఆమె భర్త దాని గురించి విన్న రోజున ఆమెకు అభ్యంతరం చెప్పి, ఆమెపై ఉన్న ఆమె మొక్కుబడినీ, ఆమె తనపై తాను బంధం వేసుకోవడానికి పలికిన పెదవుల మాటనూ రద్దు చేస్తే, యాహ్వే ఆమెను క్షమిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పెదవుల పలుకు” లేదా “పెదవులతో పలికిన బంధక మాట” అని కూడా అనువదించవచ్చు; “తొందరపాటు పలుకు” అనే భావం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి నియమానికి భిన్నమైన షరతును సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: בְּיוֹם שְׁמֹעַ אִישָׁהּ
  choice: ఆమె భర్త దాని గురించి విన్న రోజునే
  rationale: בְּיוֹם యొక్క కాలసూచక బలాన్ని, ఈ న్యాయ సందర్భంలో אִישָׁהּ అంటే భర్త అనే అర్థాన్ని నిలుపుతుంది.
- source_word: יָנִיא אֹתָהּ
  choice: ఆమెను అడ్డుకొని
  rationale: హిఫిల్ రూపం ఇక్కడ ఆమె చేసిన బాధ్యత అమలులోకి రాకుండా నిరోధించడాన్ని సూచిస్తుంది; అస్పష్టమైన వ్యక్తిగత నిషేధం కంటే సందర్భానుకూలంగా ఉంది.
- source_word: וְהֵפֵר
  choice: రద్దు చేస్తే
  rationale: మొక్కుబడి లేదా స్వీయబంధం యొక్క న్యాయబద్ధ శక్తిని చెల్లకుండా చేయడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: ఆమెపై ఉన్న మొక్కుబడిని
  rationale: బాధ్యత ఆమెపై ఉందనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: పెదవులతో పలికిన తొందరపాటు మాటను
  rationale: మాటగా వెలువడిన స్వీయబాధ్యతను తెలియజేస్తూ, מִבְטָאకు ఉండగల తొందరపాటు లేదా అవివేకపు పలుకు అనే భావాన్ని ప్రతిబింబిస్తుంది; అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: ఆమె తనను తాను బంధించుకున్నప్పుడు
  rationale: తనపై తానే బాధ్యత విధించుకోవడం అనే న్యాయార్థాన్ని, ‘బంధించుకోవడం’ అనే మూల రూపకంతో వ్యక్తం చేస్తుంది.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామం יהוהను పేరుగా ప్రత్యక్షంగా ప్రతిబింబించే ప్రామాణిక తెలుగు రూపం.
- source_word: יִסְלַח לָהּ
  choice: ఆమెను క్షమిస్తాడు
  rationale: סלח యొక్క క్షమాపణ భావాన్ని, న్యాయనియమ ఫలితంగా చెప్పే భవిష్యత్ ప్రయోగంతో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం ప్రత్యేక దైవనామాన్ని ఉపయోగిస్తుంది; సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన నామరూపాన్ని వాడాం.
- issue: מִבְטָא שְׂפָתֶיהָ యొక్క భావ ఛాయ
  choice: పెదవులతో పలికిన తొందరపాటు మాట
  alternative: పెదవులతో పలికిన మాట; పెదవులతో పలికిన బంధక మాట
  rationale: ఈ పదబంధం పలికిన స్వీయబాధ్యతను ఖచ్చితంగా సూచించినా, అది తప్పనిసరిగా తొందరపాటు మాటేనా అన్నది పూర్తిగా నిశ్చితం కాదు; ప్రధాన పాఠంలో సంభావ్య భావ ఛాయను ఇచ్చి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘మొక్కుబడి,’ ‘రద్దు,’ ‘తనను తాను బంధించుకోవడం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని న్యాయబద్ధ బాధ్యత భావాన్ని నిలుపుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో చేర్చబడింది.
