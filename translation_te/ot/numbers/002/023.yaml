translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. మూలంలోని గోత్ర దళ వ్యవస్థ మరియు జనగణన భావాలు రెండూ నిలుపబడ్డాయి.
