source:
  edition: WLC
  text: וְ/מַטֵּ֖ה גָּ֑ד וְ/נָשִׂיא֙ לִ/בְנֵ֣י גָ֔ד אֶלְיָסָ֖ף בֶּן רְעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: te
  text: మరియు గాదు గోత్రం; గాదు కుమారులకు నాయకుడు—రెవూయేలు[a] కుమారుడైన ఎల్యాసాపు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో లేదా సమాంతర వాక్యభాగాల్లో తండ్రి పేరు ‘దెవూయేలు’ అని ఉంది (సంఖ్యా 1:14 చూడండి).
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: గోత్రం
  rationale: ఈ శిబిర ఏర్పాటు జాబితాలో מַטֶּה అక్షరార్థంగా ‘దండం’ కాదు; ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది. తెలుగు జాబితా శైలిలో సహజంగా ఉండేందుకు וְ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా విరామచిహ్నంతో అనుసంధానించాం.
- source_word: גָּד
  choice: గాదు
  rationale: గోత్రనామాన్ని ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְ/נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ పరిపాలనా సందర్భంలో נָשִׂיא గోత్రానికి గుర్తింపుపొందిన అధిపతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִ/בְנֵי
  choice: కుమారులకు
  rationale: לִבְנֵי అనే సూత్రబద్ధ ప్రయోగంలో ל సంబంధిత గోత్ర ప్రజలకు నాయకుడని సూచిస్తుంది. ‘కుమారులకు’ మూలంలోని సంబంధాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: גָד
  choice: గాదు
  rationale: పునరుక్త గోత్రనామాన్ని ఒకే విధంగా లిప్యంతరీకరించాం.
- source_word: אֶלְיָסָף
  choice: ఎల్యాసాపు
  rationale: వ్యక్తినామాన్ని తెలుగు ధ్వని, నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: పితృనామ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తపరిచే ప్రత్యక్ష సమానార్థకం.
- source_word: רְעוּאֵל
  choice: రెవూయేలు
  rationale: WLC/మసొరెటిక్ పాఠంలోని పేరును ప్రధాన పాఠంలో అనువదించాం; సంఖ్యాకాండము 1:14లోని ‘దెవూయేలు’ రూపంతో సమన్వయపరచకుండా పాఠభేదాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన జాబితా శైలి. ముందున్న వాక్యాలపై ఆధారపడిన హెబ్రీయ విభిన్న వాక్య నిర్మాణాన్ని తెలుగులో సంక్షిప్త నామవాచక వాక్యంగా ఉంచి, డాష్‌తో నాయకుని పేరును స్పష్టపరిచాం.
