source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה יְהוּדָ֗ה מְאַ֨ת אֶ֜לֶף וּ/שְׁמֹנִ֥ים אֶ֛לֶף וְ/שֵֽׁשֶׁת אֲלָפִ֥ים וְ/אַרְבַּע מֵא֖וֹת לְ/צִבְאֹתָ֑/ם רִאשֹׁנָ֖ה יִסָּֽעוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: te
  text: యూదా శిబిరానికి చెందిన వారిలో లెక్కించబడినవారందరూ, తమ తమ సైనిక దళాల ప్రకారం, 1,86,400 మంది.[a][b] వారు మొదట బయలుదేరాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లెక్కించబడినవారు’ అనే మాటకు ‘నమోదు చేయబడినవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సైనిక దళాల ప్రకారం’ అనే మాటకు ‘తమ తమ విభాగాల ప్రకారం’ లేదా ‘తమ తమ సేనల ప్రకారం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘బయలుదేరాలి’ అనే మాటకు ఈ శిబిర సందర్భంలో ‘శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: లెక్కించబడినవారందరూ
  rationale: פקד యొక్క నిష్క్రియార్థం జనగణనలో లేదా సైనిక సమీకరణలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది; ఈ ఎంపిక సమగ్రతను, లెక్కింపు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: యూదా శిబిరానికి చెందిన వారిలో
  rationale: לְ ఇక్కడ శిబిర సమూహంతో సంబంధాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో మొత్తం సంఖ్య ఎవరికీ చెందుతుందో స్పష్టంగా చెప్పడానికి ఈ రూపం సహజంగా ఉంటుంది.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 1,86,400 మంది
  rationale: హీబ్రూ సంఖ్యా పదబంధంలోని ఖచ్చితమైన మొత్తాన్ని భారతీయ అంకెల విభజన పద్ధతిలో సులభంగా చదవగల రూపంలో ఇచ్చింది; ‘మంది’ మనుషుల సంఖ్యను సహజంగా సూచిస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ సైనిక దళాల ప్రకారం
  rationale: צָבָא ఇక్కడ యుద్ధసేవకు క్రమబద్ధంగా ఏర్పాటైన గుంపులు లేదా దళాలను సూచిస్తుంది. ‘సైనిక దళాలు’ సందర్భంలోని సైనిక భావాన్ని నిలుపుతూ ఆధునిక స్థిరసేన అనే అతిసూచనను నివారిస్తుంది.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: వారు మొదట బయలుదేరాలి
  rationale: נסע శిబిరం నుంచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; רִאשֹׁנָה ప్రయాణ క్రమంలో మొదటి స్థానాన్ని తెలియజేస్తుంది. అసంపూర్ణ క్రియారూపం ఇక్కడ నిర్దేశిత క్రమాన్ని తెలిపేందున ‘బయలుదేరాలి’ సహజమైనది.
