translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. జనగణన సందర్భంలో సంఖ్యను అంకెలతో ఇచ్చి, హీబ్రూ సైనిక-శిబిర పదజాలంలోని భావాన్ని అతిగా ఆధునీకరించకుండా నిలుపుకున్నాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
