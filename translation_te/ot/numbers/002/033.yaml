source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: te
  text: కాని లేవీయులు ఇశ్రాయేలు కుమారుల[a] మధ్య లెక్కించబడలేదు, యాహ్వే మోషేకు ఆజ్ఞాపించినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయుల మధ్య’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతానంలో.’ హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: కాని లేవీయులు
  rationale: וְ ఇక్కడ ముందున్న జనగణన మొత్తాలతో వ్యత్యాసాన్ని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘కాని’ సహజంగా ఉంటుంది. ‘లేవీయులు’ గోత్రనామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: לֹא הָתְפָּקְדוּ
  choice: లెక్కించబడలేదు
  rationale: פקד హిత్పయేల్ రూపం ఈ జనగణన సందర్భంలో నమోదు చేయబడడం లేదా లెక్కించబడడం అనే భావాన్ని ఇస్తుంది; తెలుగు కర్మణి రూపం మూలంలోని భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּ/תוֹךְ
  choice: లో
  rationale: ఇక్కడ పెద్ద సమూహంలో చేర్చబడడాన్ని సూచిస్తుంది; ‘ఇశ్రాయేలు కుమారులలో’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే పుంలింగ బహువచన రూపాన్ని పారదర్శకంగా కాపాడుతుంది; సహజ ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’.
- source_word: כַּ/אֲשֶׁר
  choice: ప్రకారం
  rationale: ముందుగా ఇవ్వబడిన దైవాజ్ఞకు అనుగుణంగా ఈ కార్యం జరిగిందనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: లెక్కింపు నివేదికకు ముందే ఇవ్వబడిన ఆజ్ఞను సూచిస్తుంది; తెలుగు అసమాపక క్రియారూపం ఆ పూర్వత్వాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంతో అందిస్తుంది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూలో ‘ఆజ్ఞాపించు’ క్రియకు మోషే ప్రత్యక్ష కర్మగా ఉన్నా, తెలుగు వాడుకలో ఆజ్ఞ అందుకున్న వ్యక్తిని సంప్రదాన విభక్తితో చెప్పడం సహజం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ పదబంధంలోని లింగ-నిర్దిష్ట రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సహజమైన సమూహనామ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
