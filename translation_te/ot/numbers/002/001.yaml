  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతోను అహరోనుతోను ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “YHWH”; దీనిని “యాహ్వే” అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామం యְהוָהకు సంబంధించిన మూలరూపాన్ని తెలియజేయడానికి మరియు పాదటిప్పణి గుర్తును సరైన పదానికి అనుసంధానించడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవ ప్రసంగాన్ని ప్రారంభించే వַיְדַבֵּר‌ను ఆధునిక తెలుగులో సహజంగా ‘అన్నాడు’ అని అందించాం; ఇది కొత్త కథన ఘట్టాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామం יְהוָה‌ను తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: పునరుక్తమైన אֶל ఇద్దరినీ ప్రసంగానికి వేర్వేరు సంబోధితులుగా చూపుతుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘తో’ను రెండుసార్లు ఉంచి ఆ నిర్మాణాన్ని నిలిపాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సూత్రప్రయోగాన్ని తెలుగులో సహజంగా ‘ఇలా అన్నాడు:’ అని తెలిపాం.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో బిరుదు కాకుండా దైవ వ్యక్తినామమే ఉంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన కథన శైలి. మూలంలోని ఇద్దరు సంబోధితులను స్పష్టంగా ఉంచి, తదుపరి ప్రత్యక్ష వాక్యానికి ద్విబిందువుతో అనుసంధానం చేశాం.
