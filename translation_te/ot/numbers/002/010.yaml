id: NUM.2.10
reference: Numbers 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: te
  text: రూబేను శిబిరపు పతాకం[a] దక్షిణం వైపున, వారి దళాలవారీగా[b] ఉండాలి. రూబేను వంశస్థుల నాయకుడు షెదేయూరు కుమారుడు ఎలీసూరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధ్వజం.’ ఇది గోత్ర శిబిరాన్ని గుర్తించే చిహ్నాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి సైన్యాల ప్రకారం.’ హీబ్రూ పదంలో క్రమబద్ధమైన సైనిక సమూహాల భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: గోత్ర శిబిరాన్ని గుర్తించి, దాని కింద ప్రజలు క్రమంగా సమకూడే సైనిక లేదా గోత్ర చిహ్నాన్ని సూచిస్తుంది. ‘పతాకం’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: מַחֲנֵה
  choice: శిబిరం
  rationale: ఇక్కడ రూబేను గోత్రానికి చెందిన క్రమబద్ధమైన శిబిర సమూహాన్ని సూచిస్తుంది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: హీబ్రూ పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: תֵּימָנָה
  choice: దక్షిణం వైపున
  rationale: దిశాసూచక రూపం శిబిరానికి దక్షిణ భాగంలో ఉండే స్థానాన్ని తెలియజేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: వారి దళాలవారీగా
  rationale: צָבָא అనే పదంలోని సైనిక, క్రమబద్ధ సమూహ భావాన్ని నిలుపుతూ, గోత్ర విభాగాల ప్రకారం ఏర్పాటును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో నియమించబడిన గోత్ర ప్రధానిని సూచిస్తుంది; ‘నాయకుడు’ రాజరిక భావాన్ని అనవసరంగా చేర్చకుండా అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לִבְנֵי רְאוּבֵן
  choice: రూబేను వంశస్థుల
  rationale: అక్షరార్థమైన ‘రూబేను కుమారులు’ అనే బంధుత్వ ప్రయోగాన్ని ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే గోత్ర వంశార్థంలో వ్యక్తం చేస్తుంది.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: షెదేయూరు కుమారుడు ఎలీసూరు
  rationale: హీబ్రూ వ్యక్తిపేర్లను లిప్యంతరీకరించి, తెలుగు వాక్యక్రమంలో తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
