translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. శిబిర ఏర్పాటులోని క్రమబద్ధమైన సైనిక భావాన్ని అతిగా యుద్ధసంబంధంగా వినిపించకుండా నిలిపాం. మూలంలోని రెండు ప్రధాన వాక్యభాగాలను స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం.
