source:
  edition: WLC
  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה יִשָּׂשכָ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י יִשָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: te
  text: దాని పక్కన మకాం వేసేవారు ఇశ్శాఖారు గోత్రంవారు; ఇశ్శాఖారు వంశస్థుల నాయకుడు సూయారు కుమారుడైన నెతనేలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: మకాం వేయాలి
  rationale: హీబ్రూ కృదంతం శిబిరంలో స్థానం పొందిన సమూహాన్ని సూచిస్తుంది. ఈ నియామక సందర్భంలో తెలుగు విధ్యర్థక రూపం సహజంగా ఉంటుంది.
- source_word: עָלָיו
  choice: దాని పక్కన
  rationale: మునుపటి వచనంలో పేర్కొన్న శిబిర విభాగానికి ఆనుకుని ఉన్న స్థానాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘దాని మీద’ ఇక్కడ తగదు.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: ఇశ్శాఖారు గోత్రంవారు
  rationale: מַטֵּה ఇక్కడ దండాన్ని కాక గోత్రాన్ని సూచిస్తుంది. ‘గోత్రంవారు’ శిబిరం వేసే ప్రజాసమూహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: సంఖ్యాకాండ సందర్భంలో ఇది గుర్తింపు పొందిన గోత్రాధిపతిని సూచిస్తుంది; ‘నాయకుడు’ ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: ఇశ్శాఖారు వంశస్థుల
  rationale: అక్షరార్థంగా ‘ఇశ్శాఖారు కుమారుల’ అయినప్పటికీ, ఇది మొత్తం గోత్ర సభ్యులను సూచించే స్థిరమైన వంశపరమైన ప్రయోగం.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: సూయారు కుమారుడు నెతనేలు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పేర్ల క్రమంలో అందిస్తుంది.
