translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. శిబిర ఏర్పాటుకు సంబంధించిన ఆజ్ఞాత్మక సందర్భాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, గోత్రపరమైన హీబ్రూ భావాన్ని పాదటిప్పణిలో నిలిపింది.
