id: NUM.2.2
reference: Numbers 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు, ప్రతి ఒక్కరూ తమ పతాకం వద్ద, తమ పితృగృహాల చిహ్నాల ప్రకారం మకాం వేయాలి. వారు సమావేశపు గుడారానికి ఎదురుగా, దాని చుట్టూ మకాం వేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ עַל דִּגְלוֹ
  choice: తమ తమ పతాకం దగ్గర
  rationale: אִישׁ ఇక్కడ సమూహంలోని ఒక్కొక్కరిని సూచించే పంపిణీ ప్రయోగం. తెలుగులో ‘తమ తమ’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; דֶּגֶל గోత్ర లేదా సైనిక గుర్తింపు పతాకం.
- source_word: בְאֹתֹת
  choice: గుర్తుల ప్రకారం
  rationale: אוֹת యొక్క ప్రాథమిక ‘గుర్తు/చిహ్నం’ భావాన్ని కాపాడుతూ, בְ సంబంధాన్ని శిబిర క్రమాన్ని నిర్దేశించే విధంగా సహజ తెలుగులో తెలిపింది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ పితృగృహాల
  rationale: హీబ్రూ పితృవంశ గృహ లేదా వంశ విభాగ నిర్మాణాన్ని ‘పితృగృహాలు’ సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: יַחֲנוּ
  choice: మకాం వేయాలి
  rationale: నిర్దేశాత్మక సందర్భంలోని imperfect క్రియకు తెలుగులో విధ్యర్థక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ సంబంధిత రూపకాన్ని నేరుగా కాపాడుతుంది; ‘ఇశ్రాయేలీయులు’ అనే సహజ ప్రత్యామ్నాయం ఉన్నా అది ఈ రూపాన్ని సాధారణ జాతినామంగా మారుస్తుంది.
- source_word: מִנֶּגֶד סָבִיב
  choice: ఎదురుగా, దాని చుట్టూ
  rationale: מִנֶּגֶד లోని ఎదురుగా లేదా కొంత దూరంలో అనే స్థాన భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ఎదురుగా’ ఉంచి, סָבִיב యొక్క పరివేష్టన భావాన్ని ‘చుట్టూ’ తెలిపింది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: మోయేడ్ అనే పదంలోని నిర్ణీత సమావేశం/సన్నిధి భావానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన గౌరవప్రద పదబంధం; కేవలం ‘గుడారం’ లేదా నిర్మాణార్థక పదంతో భావాన్ని కుదించదు.
theological_decisions:
- issue: కుటుంబ సంబంధిత సమూహనామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: בְּנֵי יִשְׂרָאֵל లోని పుత్రత్వ/కుటుంబ రూపాన్ని నిలుపుతూ, దానిని లింగనిరపేక్ష జాతినామంగా నిశ్శబ్దంగా మార్చలేదు.
- issue: పవిత్ర గుడారానికి వాడిన పదం
  choice: ప్రత్యక్షపు గుడారం
  alternative: సమావేశపు గుడారం
  rationale: אֹהֶל מוֹעֵד దేవుడు తన ప్రజలను కలిసే నిర్ణీత స్థలాన్ని సూచిస్తుంది. ‘ప్రత్యక్షపు గుడారం’ తెలుగు శాస్త్రపారంపర్యంలో సహజమైనప్పటికీ, ‘సమావేశపు గుడారం’ కూడా మూలపదానికి సాధ్యమైన ప్రత్యక్ష అనువాదం; వచనం ఏ నిర్దిష్ట నిర్మాణ సిద్ధాంతాన్నీ జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ పంపిణీ భావాన్ని ‘తమ తమ’తో, ఆజ్ఞాత్మక భావాన్ని ‘వేయాలి’తో తెలిపింది. అవసరం లేని పాదటిప్పణులు జోడించలేదు.
