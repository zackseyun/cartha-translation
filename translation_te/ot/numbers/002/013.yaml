translation:
  language: te
  text: అతని దళంలో లెక్కించబడినవారు యాభై తొమ్మిది వేల మూడు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళంలో
  rationale: צָבָא ఇక్కడ జనగణన, శిబిర వ్యవస్థ సందర్భంలో గోత్రానికి చెందిన సైనిక విభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దళం’ సహజంగా ఉండి, సందర్భంలోని వ్యవస్థీకృత సమూహ భావాన్ని తెలియజేస్తుంది. వాక్యాన్ని తెలుగులో సహజంగా కలపడానికి సంయోజకాన్ని ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: וּפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד యొక్క ఈ రూపం జనగణనలో లెక్కించబడిన వ్యక్తులను సూచిస్తుంది. ‘లెక్కించబడినవారు’ అనేది మూలంలోని నిష్క్రియార్థాన్ని నిలుపుతుంది; ఈ ఖండంలో స్పష్టంగా లేని ‘పురుషులు’ అనే పదాన్ని చేర్చదు.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: యాభై తొమ్మిది వేల
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘తొమ్మిది మరియు యాభై వేలు’; ఆధునిక తెలుగు సంఖ్యా క్రమంలో అదే విలువను ‘యాభై తొమ్మిది వేల’గా సహజంగా వ్యక్తం చేశాం.
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: మూడు వందల మంది
  rationale: ఇది మొత్తం సంఖ్యను పూర్తి చేస్తుంది. వ్యక్తుల సంఖ్య అని తెలుగులో స్పష్టంగా, సహజంగా ఉండేందుకు చివర ‘మంది’ చేర్చబడింది; మూలార్థంలో మార్పు లేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన లేఖన శైలిని నిలుపుతూ సంక్షిప్తంగా అనువదించబడింది.
