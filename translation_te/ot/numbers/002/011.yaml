translation:
  language: te
  text: అతని దళంలో లెక్కించబడినవారి సంఖ్య నలభై ఆరు వేల ఐదు వందలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: అతని దళంలో
  rationale: సంఖ్యాకాండంలోని జనగణన, శిబిర ఏర్పాటు సందర్భంలో צָבָא అనేది ఒక గోత్రానికి చెందిన క్రమబద్ధమైన సైనిక బృందాన్ని సూచిస్తుంది. ‘దళం’ ఆ వ్యవస్థీకృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘లో’ అనే విభక్తి తరువాతి పְקֻדָיוతో ఉన్న అన్వయాన్ని స్పష్టం చేస్తుంది.
- source_word: פְקֻדָיו
  choice: లెక్కించబడినవారు
  rationale: פקד ధాతువు ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. కర్మణి రూపంలోని ‘లెక్కించబడినవారు’ మూలంలోని census భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: నలభై ఆరు వేల ఐదు వందల మంది
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని తెలుగులో సహజంగా వినిపించే ప్రామాణిక సంఖ్యా రూపంలో ఇచ్చి, వ్యక్తుల సంఖ్య అని స్పష్టం చేయడానికి ‘మంది’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంక్షిప్త జనగణన శైలి. మూలంలోని וּ ప్రారంభ అనుసంధానం ఈ వాక్యం ముందటి వచనంపై ఆధారపడినందున తెలుగులో సహజ వాక్యప్రవాహం కోసం ప్రత్యేకంగా అనువదించలేదు.
