id: NUM.2.34
reference: Numbers 2:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినదంతా ఇశ్రాయేలీయులు చేశారు. వారు తమ తమ పతాకాల ప్రకారం శిబిరం వేశారు; అలాగే ప్రతి ఒక్కరూ తమ కుటుంబాల ప్రకారం, తమ పితరుల ఇంటివారి ప్రకారం బయలుదేరారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు ... చేశారు
  rationale: సహజమైన ఆధునిక తెలుగులో జాతి మొత్తాన్ని సూచిస్తుంది; హెబ్రీలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అన్న సామూహిక ప్రయోగం.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినదంతా
  rationale: ఆజ్ఞలోని సమగ్రతను, దానికి ఇశ్రాయేలు పూర్తిగా అనుగుణంగా ప్రవర్తించిన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే రూపంలో దైవనామాన్ని పేరుగానే ఉంచుతుంది; ‘ప్రభువు’గా ప్రత్యామ్నాయం చేయదు.
- source_word: כֵּן חָנוּ לְדִגְלֵיהֶם
  choice: వారు తమ తమ పతాకాల ప్రకారం శిబిరం వేశారు
  rationale: דגל సూచించే గోత్ర శిబిర వ్యవస్థకు చెందిన పతాకాలను తెలియజేస్తుంది; כֵּן లోని ఆజ్ఞానుగుణతను ‘ప్రకారం’ వ్యక్తం చేస్తుంది.
- source_word: וְכֵן נָסָעוּ
  choice: అలాగే ... ప్రయాణం ప్రారంభించారు
  rationale: నָסַע ఇక్కడ శిబిరం నుంచి బయలుదేరడాన్ని సూచిస్తుంది; ‘ప్రయాణం ప్రారంభించారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו
  choice: ప్రతి ఒక్కరూ తమ వంశాల ప్రకారం
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరూ’గా, מִשְׁפָּחוֹת యొక్క గోత్రంలోని ఉపవిభాగాల భావాన్ని ‘వంశాలు’గా అందిస్తుంది.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: తమ పితృగృహం ప్రకారం
  rationale: తండ్రుల వంశరేఖ ఆధారంగా ఏర్పడిన పూర్వీకుల కుటుంబ విభాగాన్ని సూచించే సాంకేతిక భావాన్ని దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం. ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే మరో సాధ్యమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. శిబిర వ్యవస్థకు సంబంధించిన ‘పతాకాలు’, ‘వంశాలు’, ‘పితృగృహం’ అనే పదాలను సందర్భానుకూల సాంకేతిక అర్థంతో వాడాం.
