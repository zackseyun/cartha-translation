translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని ఉపయోగించాం. జనగణన–శిబిర సందర్భంలోని సైనిక వ్యవస్థను స్పష్టంగా ఉంచుతూ మూలంలోని ప్రయాణ క్రమాన్ని సంరక్షించాం.
