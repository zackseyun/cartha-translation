source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה רְאוּבֵ֗ן מְאַ֨ת אֶ֜לֶף וְ/אֶחָ֨ד וַ/חֲמִשִּׁ֥ים אֶ֛לֶף וְ/אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים לְ/צִבְאֹתָ֑/ם וּ/שְׁנִיִּ֖ם יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: te
  text: రూబేను శిబిరంలో లెక్కించబడినవారందరి మొత్తం, వారి దళాల ప్రకారం, 1,51,450 మంది. వారు రెండవ క్రమంలో బయలుదేరాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: లెక్కించబడినవారందరూ
  rationale: פקד యొక్క గణనలో నమోదు చేయబడినవారు అనే నిష్క్రియ భావాన్ని, כָּל యొక్క సమగ్ర భావంతో సహా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; మూలంలో లేని ‘పురుషులు’ అనే పదాన్ని చేర్చదు.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: రూబేను శిబిరానికి చెందినవారిలో
  rationale: లְ సూచించే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, లెక్కించబడినవారు రూబేను శిబిర సమూహానికి చెందినవారని స్పష్టం చేస్తుంది.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 1,51,450 మంది
  rationale: హీబ్రూ సంఖ్యను ఖచ్చితంగా ఇస్తుంది; తెలుగు పాఠకులకు పరిచితమైన భారతీయ అంకెల విభజనను ఉపయోగిస్తుంది. ‘మంది’ మనుషుల సంఖ్యకు సహజమైన గణన పదం.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ సైనిక విభాగాల ప్రకారం
  rationale: צְבָאוֹת ఇక్కడ శిబిరంలోని వ్యవస్థీకృత సైనిక సమూహాలను సూచిస్తుంది. ‘సైనిక విభాగాలు’ సందర్భానుగుణంగా స్పష్టంగా ఉండి, ‘సైన్యాలు’ అనే విస్తృత భావం కంటే సంస్థాగత నిర్మాణాన్ని బాగా తెలియజేస్తుంది.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: వారు రెండవ వారిగా బయలుదేరాలి
  rationale: ఇది ప్రయాణ క్రమంలో ఈ శిబిరపు రెండవ స్థానాన్ని సూచిస్తుంది. יִסָּעוּ యొక్క సందర్భోచిత భావాన్ని ‘బయలుదేరాలి’ సహజంగా వ్యక్తపరుస్తుంది.
