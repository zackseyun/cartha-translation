translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ప్రయాణ క్రమం, కేంద్రస్థానం, శిబిర అమరికతో ప్రయాణ అమరిక మధ్య correspondence నిలుపబడ్డాయి. బహువచన విభజనార్థాన్ని సహజంగా వ్యక్తం చేయడానికి ‘తమ తమ’ వాడబడింది.
