source:
  edition: WLC
  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: te
  text: తర్వాత సమావేశ గుడారమూ లేవీయుల శిబిరమూ శిబిరాల మధ్యలో బయలుదేరాలి. వారు ఎలాగైతే శిబిరం వేస్తారో, అలాగే బయలుదేరాలి; ప్రతి ఒక్కరూ తమ తమ పతాకాల ప్రకారం తమ స్థానంలో[a] బయలుదేరాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ తమ స్థానంలో’ అనే మాటకు ‘తమ తమ వైపున’ అని కూడా అనువదించవచ్చు. హీబ్రూ నానుడిలో అక్షరార్థంగా ‘చెయ్యి/వైపు’ అనే భావం ఉంది; ఇక్కడ అది ప్రయాణ క్రమంలో కేటాయించిన స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ తమ పతాకాల ప్రకారం’ అనే మాటకు ‘తమ తమ ధ్వజాలవారీగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: తర్వాత ... బయలుదేరాలి
  rationale: శిబిరాన్ని ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచించే נָסַע అనే క్రియకు ‘బయలుదేరాలి’ సహజమైన ఆధునిక తెలుగు. וְ అనే సంధి ఇక్కడ ప్రయాణ క్రమాన్ని సూచిస్తున్నందున ‘తర్వాత’ అని అనువదించబడింది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: ‘గుడారం’ అనే స్పష్టమైన వస్తువాచక భావాన్నీ, దేవునితో సమావేశమయ్యే స్థలమనే מוֹעֵד భావాన్నీ నిలుపుతుంది; మూలంలో లేని తరువాతి సాంకేతిక పదాన్ని చేర్చదు.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: లేవీయుల శిబిరం
  rationale: హీబ్రూ సమాసాన్ని నేరుగా, సహజంగా అందిస్తుంది. సందర్భంలో ఇది సమావేశ గుడారాన్ని చుట్టుముట్టి దానితో ప్రయాణించే లేవీయుల శిబిరాన్ని సూచిస్తుంది.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: మిగిలిన శిబిరాల మధ్యలో
  rationale: בְּתוֹךְ కేంద్రస్థానాన్ని సూచిస్తుంది. తెలుగులో ‘మిగిలిన’ అని చెప్పడం లేవీయుల శిబిరం ఇతర శిబిరాల నడుమ ప్రయాణిస్తుందనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: వారు ఏ క్రమంలో శిబిరం వేస్తారో అదే క్రమంలో బయలుదేరాలి
  rationale: మూలంలోని ‘ఎలాగైతే ... అలాగే’ అనే సమాంతర నిర్మాణాన్ని సహజ తెలుగులో అందిస్తూ, శిబిరం వేసే అమరికే ప్రయాణ క్రమమని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ עַל יָדוֹ
  choice: ప్రతి ఒక్కరూ తమ తమ స్థానంలో
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ప్రతి ఒక్కరు’ అని సూచిస్తుంది. עַל יָדוֹ అక్షరార్థంగా ‘తన చేతి/వైపు వద్ద’ అయినా, ఈ సైనిక-శిబిర సందర్భంలో కేటాయించిన స్థానాన్ని సూచించే నానుడి.
- source_word: לְדִגְלֵיהֶם
  choice: తమ తమ పతాకాల ప్రకారం
  rationale: דֶּגֶל గోత్ర విభాగాన్ని గుర్తించే పతాకం లేదా ధ్వజాన్ని సూచిస్తుంది. לְ ఉపసర్గ ఇక్కడ ఆ పతాకాల ఆధారంగా ఏర్పడే క్రమాన్ని తెలియజేస్తుంది.
