translation:
  language: te
  text: అతని దళంలో[a] లెక్కించబడినవారి[b] సంఖ్య అరవై రెండు వేల ఏడువందలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దళం’ అనే చోట ‘సైన్యం’ లేదా ‘సైనిక సమూహం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం צָבָא సైన్యాన్ని లేదా వ్యవస్థీకృత సమూహాన్ని సూచించగలదు; ఇక్కడ అది గోత్ర దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారిలో లెక్కించబడినవారు.’ ఇది ఆ గోత్రం నుండి జనగణనలో లెక్కించబడినవారి మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళంలో
  rationale: צָבָא ఇక్కడ ఇశ్రాయేలు శిబిర ఏర్పాటులోని గోత్ర సైనిక విభాగాన్ని సూచిస్తుంది. ‘దళం’ ఆ వ్యవస్థీకృత సమూహ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; విభక్తి ప్రయోగం వాక్యాన్ని తెలుగులో సహజంగా చేస్తుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד నుండి వచ్చిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించిన వ్యక్తులను సూచిస్తుంది. ‘లెక్కించబడినవారు’ వ్యక్తుల భావాన్ని నిలుపుతూ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: అరవై రెండు వేల ఏడువందల మంది
  rationale: హీబ్రూ సంఖ్యను యథాతథ పరిమాణంతో, ఆధునిక తెలుగు సంఖ్యా క్రమంలో అందించింది; ‘మంది’ లెక్కించబడిన మనుషులను సూచిస్తుంది.
