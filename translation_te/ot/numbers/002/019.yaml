  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: te
  text: అతని దళం[a]లో లెక్కించబడినవారు నలభై వేల ఐదువందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సైన్యం.” ఇక్కడి హీబ్రూ పదం క్రమబద్ధమైన సైనిక సమూహాన్ని లేదా శిబిర దళాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళం
  rationale: జనగణన, శిబిర వ్యవస్థ సందర్భంలో צָבָא ఒక గోత్రానికి చెందిన క్రమబద్ధమైన సైనిక దళాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దళం’ ఈ వ్యవస్థీకృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ మూలంలోని కర్మణి భావాన్ని నిలుపుతుంది; సందర్భం వల్ల పురుషులు ఉద్దేశించబడినా మూలంలో లేని విశేషణాన్ని చేర్చదు.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: నలభై వేల ఐదువందల మంది
  rationale: హీబ్రూ సంఖ్యను సమకాలీన తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది; వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చబడింది.
theological_decisions: []
