  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన సూత్రాన్ని సహజంగా అందించింది. ‘దళం’ అనే పదం గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే సైనిక-శిబిర భావాన్ని నిలుపుతుంది.
