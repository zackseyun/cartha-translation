  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: te
  text: తూర్పు వైపున, సూర్యోదయ దిశగా, తమ దళాల ప్రకారం యూదా శిబిరపు పతాకం కింద మకాం వేసేవారు ఉండాలి. యూదా వంశస్థుల నాయకుడు అమ్మీనాదాబు కుమారుడైన నహ్షోను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: శిబిరంలోని గోత్ర సమూహాన్ని గుర్తించే జెండా లేదా దాని కింద ఏర్పడిన దళ సమూహం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ సైన్య విభాగాల ప్రకారం
  rationale: צבא యొక్క క్రమబద్ధమైన దళాలు/విభాగాలు అనే భావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: గోత్రానికి నియమితుడైన ప్రధానిని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: קֵדְמָה מִזְרָחָה
  choice: తూర్పున, సూర్యోదయ దిశగా
  rationale: మూలంలోని సమీపార్థకమైన రెండు దిశా పదాల ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతుంది.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా వంశస్థులు
  rationale: అక్షరార్థమైన ‘యూదా కుమారులు’ కంటే ఈ గోత్ర సందర్భంలో ఉద్దేశించిన సంతతి/వంశ ప్రజలను సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని శిబిర ఏర్పాటు భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తూ, తూర్పు/సూర్యోదయ దిశ అనే ద్వంద్వ సూచనను నిలిపాం.
