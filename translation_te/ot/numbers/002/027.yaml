  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని జాబితా తరహా నిర్మాణాన్ని ద్విబిందువు ద్వారా నిలిపి, తెలుగులో స్పష్టత కోసం రెండో భాగాన్ని ప్రత్యేక వాక్యంగా ఇచ్చాం.
