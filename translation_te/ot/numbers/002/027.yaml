base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: te
  text: 'దాని పక్కన గుడారాలు వేసుకొని ఉన్నవారు: ఆషేరు గోత్రం; ఆషేరు కుమారులకు నాయకుడు ఒక్రాను కుమారుడు పగీయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: గుడారాలు వేసుకునేవారు
  rationale: חנה క్రియ యొక్క వర్తమాన కృదంత రూపం శిబిరంలో గుడారాలు వేసుకొని ఉండేవారిని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: עָלָיו
  choice: దాని పక్కన
  rationale: శిబిర అమరిక సందర్భంలో עַל ప్రదేశపరంగా సమీపాన్ని, పక్కనున్న స్థానాన్ని సూచిస్తుంది; భౌతికంగా ‘దానిమీద’ అనే అర్థం ఇక్కడ సరిపోదు.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: జనగణన, శిబిర క్రమం వంటి సందర్భాల్లో מַטֶּה ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచించే స్థిర పదం.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: గోత్రనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: సంఖ్యాకాండంలో ఈ పదం గోత్రానికి గుర్తింపు పొందిన అధిపతిని సూచిస్తుంది; ‘నాయకుడు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לִבְנֵי אָשֵׁר
  choice: ఆషేరు కుమారులకు
  rationale: లామెదు విభక్తి యొక్క ‘కోసం/కు’ భావాన్ని, అలాగే హెబ్రీ వంశపారంపర్య నుడికారమైన ‘ఆషేరు కుమారులు’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: פַּגְעִיאֵל
  choice: పగీయేలు
  rationale: వ్యక్తి పేరును మూల హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן עָכְרָן
  choice: ఆక్రాను కుమారుడు
  rationale: హెబ్రీ తండ్రిపేరు నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నేరుగా అనువదించాం.
