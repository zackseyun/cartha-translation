  yaml_path: translation/ot/numbers/002/004.yaml
  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: te
  text: అతని దళం[a]లో లెక్కించబడినవారు[b] డెబ్బై నాలుగు వేల ఆరువందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సైన్యం’ లేదా ‘అతని సైనిక సమూహం’; హీబ్రూ పదానికి సైనిక భావం ఉంది, అయితే ఇక్కడ శిబిరంలో క్రమపరచబడిన గోత్ర దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నమోదు చేయబడినవారు’ లేదా ‘జనగణనలో లెక్కించబడినవారు’; హీబ్రూ పదం జనగణన కోసం నమోదు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళం
  rationale: צָבָא అనే పదానికి సైన్యం లేదా సమూహం అనే భావాలు ఉండవచ్చు; సంఖ్యాకాండము 2లోని శిబిర ఏర్పాటు సందర్భంలో ఇది గోత్రానికి చెందిన వ్యవస్థీకృత దళాన్ని సూచిస్తుంది. ‘దళం’ ఆధునిక తెలుగులో ఈ వ్యవస్థాపక, సైనిక భావాలను సహజంగా అందిస్తుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ అనే రూపం జనగణన భావాన్ని నిలుపుతుంది; విశాల సందర్భం పురుషుల సైనిక జనగణన అని చూపుతున్నందున వాక్య సహజత్వం కోసం చివర ‘మంది’ వాడబడింది.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: డెబ్బై నాలుగు వేల ఆరువందల
  rationale: మూలంలోని ఖచ్చితమైన మొత్తం 74,600ను ఆధునిక తెలుగు సంఖ్యా క్రమంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త గణన నివేదిక స్వరాన్ని నిలుపుతూ, తెలుగులో పూర్తి వాక్యంగా సులభంగా అర్థమయ్యేలా రూపొందించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
