source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: te
  text: దాని పక్కన శిబిరం వేసుకున్నవారు షిమ్యోను గోత్రంవారు[a]; షిమ్యోను కుమారుల నాయకుడు సూరీషద్దయి కుమారుడైన షెలుమీయేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పక్కన.” హీబ్రూ పదబంధం శిబిర అమరికలో సమీపాన్ని సూచిస్తుంది. ప్రత్యయం ముందుగా పేర్కొన్న వ్యక్తిని సూచించవచ్చు; శిబిరం లేదా గోత్ర విభాగాన్ని సూచించడమూ సాధ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: గుడారాలు వేసుకునేవారు
  rationale: חנה అనే క్రియ యొక్క కృదంత రూపం ఇక్కడ శిబిరంలో గుడారాలు వేసుకున్న ప్రజలను సూచించే నామవాచక భావంలో ఉంది.
- source_word: עָלָיו
  choice: అతని పక్కన
  rationale: శిబిర అమరిక సందర్భంలో עַל సమీపాన్ని సూచిస్తుంది. పురుష ఏకవచన ప్రత్యయం ముందున్న యూదా గోత్ర నాయకుడిని సూచించగలదు; అయితే శిబిర ధ్వజాన్ని సూచించే భావమూ సాధ్యమే కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: షిమ్యోను గోత్రంవారు
  rationale: ఈ జనగణన, శిబిర సందర్భంలో מַטֶּה దండాన్ని కాక గోత్ర సమూహాన్ని సూచిస్తుంది; వాక్యంలో గుడారాలు వేసుకునే ప్రజలే కర్తలు కాబట్టి సహజమైన తెలుగు బహువచన రూపాన్ని వాడాం.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: נָשִׂיא ఇక్కడ గుర్తింపు పొందిన గోత్రాధిపతిని సూచిస్తుంది; రాజకుమారుడు అనే అనవసర రాజరిక భావాన్ని నివారిస్తూ నాయకుడు అని అనువదించాం.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులకు
  rationale: לְ యొక్క సంబంధ/ప్రయోజన భావాన్ని, בְּנֵי లోని లింగసూచిత బంధుత్వ పదాన్ని నిలుపుతూ తెలుగులో సహజంగా అనువదించాం.
- source_word: שְׁלֻמִיאֵל
  choice: షెలుమీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: సూరీషద్దయి కుమారుడైన
  rationale: తండ్రి-కొడుకు సంబంధాన్ని సహజ తెలుగు నిర్మాణంలో ఇచ్చి, తండ్రి పేరును ఒకే వ్యక్తినామంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: לִבְנֵי שִׁמְעוֹן లోని లింగసూచిత బంధుత్వ భాష
  choice: షిమ్యోను కుమారులకు
  alternative: షిమ్యోను సంతతివారికి / షిమ్యోను ప్రజలకు
  rationale: మూలంలోని పురుష బహువచనమైన ‘కుమారులు’ అనే రూపాన్ని అనవసరంగా లింగతటస్థం చేయకుండా నిలిపాం; ఇది గోత్ర సంబంధాన్ని కూడా స్పష్టంగా తెలియజేస్తుంది.
- issue: עָלָיו యొక్క పూర్వపద సూచన
  choice: అతని పక్కన
  alternative: దాని పక్కన
  rationale: మసొరేటిక్ పాఠంలో పురుష ఏకవచన ప్రత్యయం ఉంది; సమీప సందర్భంలో ముందుగా పేర్కొన్న నాయకుడిని సూచించవచ్చు. అయితే విస్తృత శిబిర అమరికలో ధ్వజం లేదా శిబిర విభాగాన్ని సూచించే అవకాశం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘గుడారాలు వేసుకునేవారు,’ ‘గోత్రంవారు,’ ‘నాయకుడు’ వంటి సహజ పదబంధాలతో శిబిర సందర్భాన్ని స్పష్టం చేశాం; వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
