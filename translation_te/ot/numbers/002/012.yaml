revisions:
- from: అతని పక్కన గుడారాలు వేసుకునేవారు షిమ్యోను గోత్రంవారు[a]. షిమ్యోను కుమారులకు నాయకుడు సూరీషద్దయి కుమారుడైన షెలుమీయేలు.
  to: దాని పక్కన శిబిరం వేసుకున్నవారు షిమ్యోను గోత్రంవారు[a]; షిమ్యోను కుమారుల నాయకుడు సూరీషద్దయి కుమారుడైన షెలుమీయేలు.
  rationale: The revision avoids prematurely resolving the antecedent of עָלָיו as a male individual, improves the Telugu expression for those encamped, and renders the tribal leader relationship in a more natural and source-aligned form. The footnote preserves the viable personal alternative and remains anchored at the affected phrase.
