source:
  edition: WLC
  text: כָּל הַ/פְּקֻדִים֙ לְ/מַ֣חֲנֵה דָ֔ן מְאַ֣ת אֶ֗לֶף וְ/שִׁבְעָ֧ה וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וְ/שֵׁ֣שׁ מֵא֑וֹת לָ/אַחֲרֹנָ֥ה יִסְע֖וּ לְ/דִגְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: te
  text: దాను శిబిరానికి చెందిన లెక్కించబడిన వారందరూ 1,57,600 మంది. వారు తమ తమ ధ్వజాల ప్రకారం చివరగా బయలుదేరాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: లెక్కించబడిన వారందరూ
  rationale: פקד యొక్క కర్మణి భావాన్ని, జనగణనలో నమోదు చేసి లెక్కించినవారనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఈ వచనంలో లేని ‘పురుషులు’ అనే పదాన్ని అదనంగా చేర్చదు.
- source_word: לְמַחֲנֵה דָן
  choice: దాను శిబిరానికి చెందిన
  rationale: לְ సూచించే సంబంధాన్ని తెలుగులో స్పష్టంగా చూపుతుంది; דָן అనే గోత్రనామాన్ని తెలుగు బైబిలు వాడుకకు తగినట్లు ‘దాను’గా లిప్యంతరీకరిస్తుంది.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 1,57,600 మంది
  rationale: హీబ్రూ సంఖ్యను యథాతథంగా ఉంచి, తెలుగు పాఠకులకు సుపరిచితమైన భారతీయ అంకెల విభజనను ఉపయోగిస్తుంది; ‘మంది’ మనుషుల సంఖ్యను సహజంగా సూచిస్తుంది.
- source_word: לָאַחֲרֹנָה
  choice: చివరగా
  rationale: ప్రయాణ క్రమంలో చివరి స్థానాన్ని సూచించే క్రియావిశేషణ భావాన్ని నేరుగా అందిస్తుంది.
- source_word: יִסְעוּ
  choice: బయలుదేరాలి
  rationale: అరణ్య ప్రయాణ సందర్భంలో נסע శిబిరం నుంచి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది; విధించబడిన ప్రయాణ క్రమాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְדִגְלֵיהֶם
  choice: తమ తమ ధ్వజాల ప్రకారం
  rationale: דגל అనే పదంలోని గోత్ర శిబిర ధ్వజం/పతాక-దళం భావాన్ని ‘ధ్వజాలు’ నిలుపుతుంది; לְ యొక్క క్రమబద్ధమైన అనుసరణ భావాన్ని ‘ప్రకారం’ తెలియజేస్తుంది.
