translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని జనగణన, శిబిరం, ప్రయాణ క్రమం, గోత్ర ధ్వజాల చిత్రణలను అదనపు వ్యాఖ్యానం లేకుండా నిలుపుకుంది.
