translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా రూపొందించాం. హీబ్రూ వాక్యంలోని జాబితా స్వభావాన్ని నిలుపుకోవడానికి రెండు భాగాల మధ్య అర్ధవిరామం వాడాం; మూలంలో లేని క్రియను చేర్చలేదు.
