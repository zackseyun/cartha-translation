source:
  edition: WLC
  text: וּ/מַטֵּ֖ה בִּנְיָמִ֑ן וְ/נָשִׂיא֙ לִ/בְנֵ֣י בִנְיָמִ֔ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: te
  text: బెన్యామీను గోత్రం; బెన్యామీను కుమారుల నాయకుడు[a] గిద్యోనీ కుమారుడైన అబీదాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బెన్యామీను కుమారులకు నాయకుడు.’ ఇక్కడి హీబ్రూ ఉపసర్గను పరస్పరం దగ్గర సంబంధమున్న ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: సంఖ్యాకాండంలోని జనగణన, శిబిర ఏర్పాటు సందర్భంలో ఈ పదం చేతికర్రను కాకుండా ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: בִּנְיָמִן
  choice: బెన్యామీను
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ ఇది గోత్రానికి అధికారికంగా ప్రాతినిధ్యం వహించే అధిపతిని సూచిస్తుంది. ‘నాయకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, రాజవంశార్థాన్ని అనవసరంగా కలిగించదు.
- source_word: לִבְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారుల
  rationale: గోత్ర వంశసంబంధాన్ని తెలిపే హీబ్రూ బంధుత్వ వ్యక్తీకరణను నిలిపి, ప్రధాన పాఠంలో సహజమైన తెలుగు సంబంధ రూపాన్ని వాడాం. לִ అనే ఉపసర్గను ‘కుమారులకు’ అని కూడా అర్థం చేసుకోవచ్చని పాదసూచికలో తెలిపాం.
- source_word: אֲבִידָן
  choice: అబీదాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: בֶּן גִּדְעֹנִי
  choice: గిద్యోనీ కుమారుడైన
  rationale: హీబ్రూ తండ్రి-కొడుకు సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు వంశపరిచయ రూపంలో అనువదించాం.
