  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని జాబితా తరహా సంక్షిప్త నిర్మాణాన్ని సెమికోలన్‌తో నిలిపాం.
