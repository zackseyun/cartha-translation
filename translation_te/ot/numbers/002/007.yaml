  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: te
  text: జెబూలూను గోత్రం; జెబూలూను కుమారుల[a] నాయకుడు హేలోను కుమారుడైన ఏలీయాబు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జెబూలూను కుమారులకు నాయకుడు.’ ఈ గోత్ర-పరిపాలనా సూత్రంలో హీబ్రూ ఉపసర్గను ఈ రెండు సన్నిహిత విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: సంఖ్యాకాండములోని జనగణన, శిబిర వ్యవస్థ సందర్భంలో ఇది అక్షరార్థమైన ‘కర్ర’ను కాకుండా గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: זְבוּלֻן
  choice: జెబులూను
  rationale: హీబ్రూ గోత్రనామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: ఈ పరిపాలనా సందర్భంలో గోత్రానికి గుర్తింపుపొందిన అధిపతిని సూచిస్తుంది; ‘రాజకుమారుడు’ అనే రాచరిక భావాన్ని నివారిస్తూ ఆధునికంగా స్పష్టమైన పదాన్ని ఎంచుకున్నాం.
- source_word: לִבְנֵי זְבוּלֻן
  choice: జెబులూను కుమారుల
  rationale: గోత్ర సభ్యులతో ఉన్న సంబంధాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తుంది. לְ ఉపసర్గకు ‘కొరకు’ అనే భావం కూడా సాధ్యమైనందున ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֱלִיאָב
  choice: ఏలీయాబు
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן חֵלֹן
  choice: హేలోను కుమారుడైన
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యరూపంలో అందించాం.
