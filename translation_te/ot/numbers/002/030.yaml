  text: 'and his company[a], even those numbered of them: fifty-three thousand four hundred.'
translation:
  language: te
  text: అతని దళం[a]లో లెక్కించబడినవారు యాభై మూడు వేల నాలుగు వందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేన’; హీబ్రూ పదం క్రమబద్ధంగా ఏర్పాటుచేయబడిన గోత్ర సమూహానికి సైనిక భావఛాయను కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళం
  rationale: צָבָא అనే పదం సైన్యం, సేన లేదా క్రమబద్ధమైన జనవిభాగాన్ని సూచించగలదు. సంఖ్యాకాండము 2లో ఇది యుద్ధం చేస్తున్న సైన్యాన్ని కాక, శిబిరంలో క్రమంగా ఏర్పాటుచేయబడిన గోత్ర దళాన్ని సూచిస్తుంది; అందువల్ల ‘దళం’ సహజంగా ఉండి సైనిక భావఛాయను నిలుపుతుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. బహువచన ప్రత్యయం గోత్ర సమూహంలోని వారిని సూచిస్తున్నందున ఈ రూపం మూలంలోని జనగణన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: యాభై మూడు వేల నాలుగు వందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని ఆధునిక తెలుగులో సహజమైన క్రమంలో చెప్పి, 53,400 అనే ఖచ్చితమైన మొత్తాన్ని నిలుపుతుంది. వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూలోని రెండు సమన్వయ పదబంధాలను తెలుగులో సహజంగా కలిపి, లెక్కించబడినవారు ఆ దళానికి చెందినవారనే భావాన్ని వ్యక్తం చేశాం.
