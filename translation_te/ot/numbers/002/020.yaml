source:
  edition: WLC
  text: וְ/עָלָ֖י/ו מַטֵּ֣ה מְנַשֶּׁ֑ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י מְנַשֶּׁ֔ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: te
  text: అతని పక్కన మనష్షే గోత్రం[a] ఉంది. మనష్షే సంతతివారికి నాయకుడు పెదాహసూరు కుమారుడైన గమలీయేలు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని పక్కనే మనష్షే గోత్రం ఉంది.’ ఇక్కడి హీబ్రూ పదబంధం శిబిరపు అమరికలో పక్కపక్కన ఉన్న స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: అతని పక్కన
  rationale: సైన్యశిబిరపు అమరికను తెలిపే ఈ సందర్భంలో עַל ప్రత్యయం స్థలపరమైన సామీప్యాన్ని సూచిస్తుంది; అధికారాన్ని కాదు.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: జనగణన, శిబిర వ్యవస్థ సందర్భంలో מַטֶּה అంటే చేతికర్ర కాదు, ఇశ్రాయేలు గోత్ర విభాగం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: సంఖ్యాకాండంలో נָשִׂיא నియమిత గోత్రాధిపతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారులకు
  rationale: లామెద్ విభక్తి యొక్క ‘వారికి/వారి పక్షాన’ భావాన్ని నిలుపుతూ, בְּנֵי అనే వంశపరమైన పదాన్ని ‘కుమారులు’గా ఉంచాం.
- source_word: גַּמְלִיאֵל
  choice: గమలీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: פְּדָהצוּר
  choice: పెదాసూరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ధ్వన్యనుసారంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సందర్భంలోని శిబిర ఏర్పాటు ఆజ్ఞ కొనసాగుతున్నందున, హీబ్రూలో స్పష్టమైన క్రియ లేకపోయినా తెలుగులో ‘ఉండాలి’ అని పూరించాం. వ్యక్తి, గోత్ర నామాలకు సాధారణ తెలుగు బైబిలు రూపాలను వాడాం.
