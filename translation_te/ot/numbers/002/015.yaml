translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. సంఖ్యకు ‘మంది’ చేర్చడం సందర్భంలో లెక్కించబడిన వ్యక్తులను సహజంగా సూచిస్తుంది; ప్రధాన వాక్యంలో రెండు పదసంబంధ అనిశ్చితులకు పాదసూచిక గుర్తులు ఉంచబడ్డాయి.
