source:
  edition: WLC
  text: וּ/מַטֵּ֖ה נַפְתָּלִ֑י וְ/נָשִׂיא֙ לִ/בְנֵ֣י נַפְתָּלִ֔י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/029.yaml
  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: te
  text: మరియు నఫ్తాలి గోత్రం; నఫ్తాలి కుమారులకు[a] నాయకుడు ఏనాను కుమారుడైన అహీరా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నఫ్తాలి కుమారులు’; ఇది ఆ గోత్ర సభ్యులను లేదా వంశస్థులను సూచించే సాధారణ గోత్రపరమైన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: సంఖ్యాకాండంలోని జనగణన, శిబిర ఏర్పాటు సందర్భంలో ఇది చేతికర్రను కాక ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ గోత్రానికి అధికారికంగా నియమితుడైన అధిపతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకుడు’ స్పష్టంగా, రాజవంశ భావం కలిగించకుండా ఉంటుంది.
- source_word: לִבְנֵי
  choice: కుమారులకు
  rationale: ల ఉపసర్గతో కూడిన ‘కుమారులు’ అనే రూపాన్ని వీలైనంత సమీపంగా నిలుపుతూ, నాయకుడు ఆ గోత్ర ప్రజలకు సంబంధించినవాడని సూచిస్తుంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తి/గోత్ర నామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֲחִירַע
  choice: అహీరా
  rationale: వ్యక్తి నామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: హీబ్రూ పితృనామ సూత్రంలోని ప్రత్యక్ష తండ్రీకొడుకుల సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: עֵינָן
  choice: ఏనాను
  rationale: వ్యక్తి నామాన్ని తెలుగులో లిప్యంతరీకరించాం.
