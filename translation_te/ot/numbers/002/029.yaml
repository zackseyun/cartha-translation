translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా రూపంలో ఉన్న మూలవాక్య నిర్మాణాన్ని గౌరవిస్తూ సంక్షిప్తంగా అనువదించాం. ‘గోత్రం,’ ‘నాయకుడు’ వంటి సాధారణంగా అర్థమయ్యే గౌరవప్రద పదాలను ఉపయోగించాం; మూలంలోని రెండు సమాంతర భాగాలను అర్ధవిరామంతో వేరు చేశాం.
