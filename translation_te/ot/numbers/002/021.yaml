  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూలోని ప్రారంభ సంధికారకాలను తెలుగులో వాక్యప్రవాహానికి అనుగుణంగా ప్రత్యేకంగా అనువదించలేదు; భావసంబంధం నిలుపబడింది.
