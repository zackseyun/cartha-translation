  yaml_path: translation/ot/numbers/002/021.yaml
  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: te
  text: అతని దళం[a]లో లెక్కించబడినవారు ముప్పై రెండు వేల రెండు వందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సైన్యం’ లేదా ‘అతని సైనిక సమూహం’; ఇక్కడ హీబ్రూ צָבָא శిబిరం వేయడానికి, ప్రయాణించడానికి క్రమపరచబడిన గోత్ర దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళం
  rationale: צָבָא సైన్యం లేదా సమూహం అనే అర్థాలను ఇవ్వగలిగినా, సంఖ్యాకాండము 2లో శిబిరం మరియు ప్రయాణ క్రమంలో అమర్చబడిన గోత్ర సైనిక విభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దళం’ ఈ సంస్థాగత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד యొక్క ఈ రూపం జనగణనలో లెక్కించబడిన లేదా సమీకరించబడిన వారిని సూచిస్తుంది. తరువాత వచ్చే సంఖ్య వారి మొత్తమని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేయడానికి ఈ ప్రయోగం ఎంచుకోబడింది.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: ముప్పై రెండు వేల రెండు వందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, అదే సంఖ్యను ఆధునిక ప్రామాణిక తెలుగు క్రమంలో అందిస్తుంది; వ్యక్తుల లెక్క కావడంతో ‘మంది’ చేర్చబడింది.
