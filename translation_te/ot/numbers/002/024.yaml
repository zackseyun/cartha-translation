translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని జనగణన–సైనిక నమోదు భావద్వంద్వాన్ని పాదటిప్పణిలో నిలిపి, ప్రధాన పాఠాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
