  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה אֶפְרַ֗יִם מְאַ֥ת אֶ֛לֶף וּ/שְׁמֹֽנַת אֲלָפִ֥ים וּ/מֵאָ֖ה לְ/צִבְאֹתָ֑/ם וּ/שְׁלִשִׁ֖ים יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: te
  text: ఎఫ్రాయిము శిబిరానికి చెందిన లెక్కించబడిన వారందరూ[a] 1,08,100 మంది; తమ తమ సైనిక విభాగాల ప్రకారం[b] వారు మూడవ క్రమంలో బయలుదేరాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సైనిక సేవకు నమోదు చేయబడిన వారందరూ’; హీబ్రూ పదం జనగణనలో లెక్కించడాన్నీ, సైనికులుగా నమోదు చేయడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ తమ సైన్యాల ప్రకారం’ లేదా ‘తమ తమ దళాల ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: లెక్కించబడిన వారందరూ
  rationale: פקד అనే క్రియారూపం జనగణనతో పాటు సైనిక సేవకు నమోదు చేయబడిన భావాన్నీ కలిగి ఉంది. ప్రధాన పాఠంలో సహజమైన ‘లెక్కించబడిన వారు’ అని ఉంచి, మరొక భావఛాయను పాదటిప్పణిలో తెలిపాం.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: ఎఫ్రాయిము శిబిరానికి చెందిన
  rationale: לְ ఇక్కడ శిబిర సమూహంతో సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చెందిన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 1,08,100 మంది
  rationale: హీబ్రూ సంఖ్య యొక్క ఖచ్చిత విలువను భారతీయ అంకెల విభజన పద్ధతిలో చదవడానికి సులభంగా ఇచ్చాం; వ్యక్తుల సంఖ్య అని స్పష్టం చేయడానికి ‘మంది’ చేర్చాం.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ సైనిక విభాగాల ప్రకారం
  rationale: צָבָא ఇక్కడ సైన్యాలు, దళాలు లేదా వ్యవస్థీకృత విభాగాలు అనే పరిధి కలిగి ఉంది. సందర్భంలోని సైనిక వ్యవస్థను స్పష్టం చేస్తూనే ‘విభాగాలు’ అనే విస్తృత భావాన్ని నిలిపాం.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: వారు మూడవ వారిగా బయలుదేరాలి
  rationale: שְׁלִשִׁים ప్రయాణ క్రమంలో మూడవ స్థానాన్ని సూచిస్తుంది; נסע శిబిరం నుండి ప్రయాణం ఆరంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరాలి’ ఆదేశాత్మక భవిష్యత్ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
