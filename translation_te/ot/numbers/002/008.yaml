  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: te
  text: అతని దళంలో[a] లెక్కించబడినవారు[b] యాభై ఏడు వేల నాలుగు వందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సైనిక సమూహం’ లేదా ‘విభాగం’; ఇక్కడి హీబ్రూ పదం శిబిర జనగణన సందర్భంలో క్రమబద్ధమైన సైనిక సమూహాన్ని లేదా దళాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నమోదైనవారు’ లేదా ‘లెక్కలో చేర్చబడినవారు’; హీబ్రూ పదం జనగణనలో అధికారికంగా నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళంలో
  rationale: శిబిర ఏర్పాటూ జనగణన సందర్భంలో צָבָא ఒక క్రమబద్ధమైన సైనిక సమూహాన్ని లేదా గోత్ర దళాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దళం’ సహజంగా ఉండి, యుద్ధంలో నిమగ్నమైన పూర్తి ‘సైన్యం’ అనే భావాన్ని అతిగా మోపదు.
- source_word: וּפְקֻדָיו
  choice: లెక్కించబడినవారు
  rationale: פקד మూలం నుంచి వచ్చిన ఈ రూపం అధికారిక జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ హీబ్రూ గణనసూత్రానికి దగ్గరగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: యాభై ఏడు వేల నాలుగు వందల మంది
  rationale: హీబ్రూ సంఖ్య యొక్క ఖచ్చిత విలువను ఆధునిక తెలుగు సంఖ్యాక్రమంలో సహజంగా అందిస్తుంది; ‘మంది’ లెక్కించబడిన మనుషులను స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గణనశైలిని ఉపయోగించాం. వచనం ముందటి గోత్ర జాబితాను కొనసాగిస్తున్నందున అనవసరమైన సంధాన పదాన్ని చేర్చకుండా, హీబ్రూ వాక్య సంబంధాన్ని తెలుగులో సాఫీగా వ్యక్తం చేశాం.
