id: NUM.2.18
reference: Numbers 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: te
  text: ఎఫ్రాయిము శిబిరపు పతాకం[a] వారి దళ విభాగాల ప్రకారం[b] పడమటి వైపున ఉండాలి. ఎఫ్రాయిము వంశీయుల[c] నాయకుడు అమ్మీహూదు కుమారుడు ఎలీషామా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధ్వజం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి సైన్య విభాగాల ప్రకారం.’ హీబ్రూ పదంలో క్రమబద్ధమైన సైనిక-సంఘటనా భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదశః ‘ఎఫ్రాయిము కుమారులు’; ఇది ఎఫ్రాయిము సంతతి లేదా తెగ ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: తెగ లేదా సైనిక శిబిరాన్ని గుర్తించి, దాని కింద ప్రజలు క్రమంగా ఏర్పడే గుర్తింపు ధ్వజాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పతాకం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: מַחֲנֵה
  choice: శిబిరం
  rationale: ఇక్కడ ఒక తెగకు చెందిన ప్రజలు క్రమబద్ధంగా మకాం వేసిన సమూహాన్ని సూచిస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: వారి దళాల ప్రకారం
  rationale: צָבָא పదంలోని క్రమబద్ధమైన సైనిక-సంఘటనా భావాన్ని నిలుపుతూ, యుద్ధంలో నిమగ్నమైన సైన్యమనే అతిశయార్థాన్ని నివారిస్తుంది.
- source_word: יָמָּה
  choice: పడమటి వైపున
  rationale: పదశః సముద్రం వైపు అని ఉన్నా, ఇశ్రాయేలీయుల భౌగోళిక దృష్టిలో ఇది పడమరను సూచించే స్థిర దిశాప్రయోగం.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: తెగకు అధిపతిగా ఉన్న వ్యక్తిని సూచిస్తుంది; ‘రాజకుమారుడు’ అనే రాజవంశార్థం ఇక్కడ అనుచితం.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము వంశీయుల
  rationale: హీబ్రూ బంధుత్వ ప్రయోగమైన ‘ఎఫ్రాయిము కుమారులు’ అనేది ఎఫ్రాయిము సంతతి లేదా తెగ ప్రజలను సూచిస్తుంది; ‘వంశీయులు’ ఆధునిక తెలుగులో ఆ సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: అమ్మీహూదు కుమారుడు ఎలీషామా
  rationale: వ్యక్తి పేర్లు మూలభాష ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; בֶּן ను ‘కుమారుడు’గా నేరుగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ నామవాచక ప్రధాన నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం ‘ఉండాలి’తో పూర్తి చేశాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
