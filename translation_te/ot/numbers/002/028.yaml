base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/028.yaml
  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: te
  text: అతని దళం[a]—వారిలో లెక్కించబడినవారు[b]—నలభై ఒక్క వేల ఐదు వందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సైన్యం’ లేదా ‘అతని సైనిక సమూహం’; హీబ్రూ పదం సైనిక దళాన్ని లేదా శిబిర జనగణనలోని క్రమబద్ధమైన విభాగాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారిలో లెక్కించబడినవారు’ లేదా ‘వారిలో సమీకరించబడినవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: అతని దళం
  rationale: శిబిర ఏర్పాటు, జనగణన సందర్భంలో צָבָא ఒక క్రమబద్ధమైన గోత్ర సైనిక విభాగాన్ని సూచిస్తుంది. ‘దళం’ ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అతని’ అనే పదం 3ms ప్రత్యయాన్ని ప్రతిబింబిస్తుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד నుండి వచ్చిన ఈ జనగణన ప్రయోగం లెక్కించబడిన లేదా సమీకరించబడిన సభ్యులను సూచిస్తుంది. ‘వారిలో లెక్కించబడినవారు’ మూలంలోని సంబంధాన్ని నిలుపుతూ, ఈ ఉపవాక్యంలో లేని ‘యోధులు’ అనే పదాన్ని చేర్చదు.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: నలభై ఒక్క వేల ఐదు వందల మంది
  rationale: హీబ్రూ సంఖ్యను ఆధునిక తెలుగు సంఖ్యా క్రమంలో సహజంగా అందించింది. వ్యక్తుల లెక్క కనుక ‘మంది’ చేర్చడం తెలుగులో అవసరమైన సహజీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్త జనగణన సూత్రాన్ని డాష్‌లతో స్పష్టపరచి, సైనిక భావాన్ని అతిగా బలపరచకుండా ‘దళం’ వాడబడింది.
