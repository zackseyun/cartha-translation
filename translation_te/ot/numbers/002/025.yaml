id: NUM.2.25
reference: Numbers 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: te
  text: దాను శిబిరపు పతాకం వారి దళాలవారీగా[a] ఉత్తర దిక్కున ఉండాలి. దాను కుమారుల నాయకుడు అమ్మీషద్దాయి కుమారుడైన అహీయెజెరు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి సైన్య విభాగాల ప్రకారం’; లేదా, ‘వారి సైన్యాల ప్రకారం.’
    reason: לְצִבְאֹתָם అనే పదం క్రమబద్ధమైన దళాలు, సైన్య విభాగాలు లేదా సైన్యాలు అనే భావాలను కలిగి ఉండగలదు.
lexical_decisions:
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: గోత్ర శిబిరాన్ని గుర్తించి, దాని కింద ప్రజలు క్రమంగా నిలిచే ధ్వజాన్ని సూచిస్తుంది; ‘పతాకం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: מַחֲנֵה
  choice: శిబిరం
  rationale: సంఖ్యాకాండము 2లో క్రమబద్ధంగా ఏర్పాటు చేసిన గోత్ర నివాస సమూహాన్ని సూచించే సహజమైన ఆధునిక పదం.
- source_word: צָפֹנָה
  choice: ఉత్తర దిక్కున
  rationale: ఈ దిశాసూచక రూపం ఇక్కడ గుడారపు ఏర్పాటులోని ఉత్తర వైపు స్థానాన్ని తెలియజేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: వారి దళాలవారీగా
  rationale: గోత్రంలోని క్రమబద్ధమైన సైనిక తరహా విభాగాలను సూచిస్తుంది; ‘దళాలవారీగా’ వ్యవస్థీకృత అమరికను సహజంగా తెలియజేస్తూ మూలంలోని భావ పరిధిని నిలుపుతుంది.
- source_word: וְנָשִׂיא
  choice: నాయకుడు
  rationale: గోత్రానికి అధికారికంగా గుర్తించబడిన అధిపతిని సూచిస్తుంది; రాజరిక భావాన్ని అనవసరంగా కలిగించకుండా అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לִבְנֵי דָן
  choice: దాను కుమారుల
  rationale: హీబ్రూ పురుష బహువచన గోత్ర నామనిర్దేశాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: אֲחִיעֶזֶר
  choice: అహీయెజెరు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: అమ్మీషద్దాయి కుమారుడైన
  rationale: తండ్రి-కొడుకు సంబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తూ పేరును లిప్యంతరీకరించింది.
theological_decisions:
- issue: בְנֵי అనే లింగసూచక గోత్ర నామనిర్దేశం
  choice: దాను కుమారుల
  alternative: దాను ప్రజల / దాను సంతతివారి
  rationale: మూలంలోని పురుష బహువచన రూపం ఇక్కడ అధికారిక గోత్ర నామనిర్దేశంగా ఉంది; అందువల్ల దానిని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృతార్థాన్ని ఊహించి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే గోత్ర-సైనిక సందర్భానికి తగిన గౌరవప్రదమైన శైలి నిలుపబడింది.
