source:
  edition: WLC
  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: te
  text: తమ పితృగృహాల ప్రకారం లెక్కించబడిన ఇశ్రాయేలు కుమారులైన పురుషులు వీరే.[a][b] తమ తమ సైన్య విభాగాల ప్రకారం శిబిరాలకు చెందిన లెక్కించబడిన పురుషులందరూ[c] ఆరు లక్షల మూడు వేల ఐదు వందల యాభై మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లెక్కించబడిన పురుషులు’ అనే మాటకు ‘లెక్కలో నమోదైన పురుషులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు. అక్షరార్థం: ‘ఇశ్రాయేలు కుమారులు.’'
    reason: lexical_alternative
  - marker: c
    text: ‘సైన్య విభాగాలు’ అనే మాటకు ‘దళాలు’ లేదా ‘సేనలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: లెక్కించబడిన పురుషులు
  rationale: ఈ జనగణన సందర్భంలో సైనిక సేవకు అర్హులైన మగవారిని లెక్కించడం ఉద్దేశం. మూలపదంలో ‘పురుషులు’ ప్రత్యేకంగా లేకపోయినా, సంఖ్యాకాండము 1–2 అధ్యాయాల తక్షణ సందర్భం దానిని స్పష్టం చేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబ/నిబంధన సంబంధమైన నుడికారాన్ని నిలుపుతుంది; సహజమైన తెలుగు వాక్యనిర్మాణం కోసం విభక్తితో ‘ఇశ్రాయేలు కుమారులలో’ అని ఇచ్చాం.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ పితృగృహాల ప్రకారం
  rationale: వంశపారంపర్యంగా, పితృవంశం ఆధారంగా ఏర్పడిన గృహాలను సూచించే జనగణన సాంకేతిక పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַמַּחֲנֹת
  choice: శిబిరాలు
  rationale: ప్రత్యక్ష గుడారం చుట్టూ ఏర్పాటు చేయబడిన గోత్ర శిబిర సమూహాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ సైన్య విభాగాల ప్రకారం
  rationale: צבאות అనే పదంలోని సైనికంగా క్రమబద్ధీకరించబడిన సమూహాల భావాన్ని నిలుపుతూ, యుద్ధం జరుగుతోందనే అధిక భావాన్ని కలిగించకుండా ‘విభాగాలు’తో స్పష్టం చేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ఆరు లక్షల మూడువేల ఐదువందల యాభై
  rationale: 603,550 అనే హీబ్రూ సంఖ్యను తెలుగు సంఖ్యా వ్యవస్థలో సహజంగా, పదాలతో అందిస్తుంది.
theological_decisions:
- issue: జనగణనలో లింగ సూచన
  choice: లెక్కించబడిన పురుషులు
  alternative: లెక్కించబడినవారు / నమోదైనవారు
  rationale: ఈ వచనంలోని నామరూపమే లింగాన్ని విడిగా చెప్పకపోయినా, సంఖ్యాకాండము 1–2 అధ్యాయాల సందర్భంలో సైనిక సేవకు అర్హులైన మగవారే లెక్కించబడ్డారు. అందువల్ల సందర్భసిద్ధమైన లింగాన్ని వెల్లడించాం.
- issue: צבאות పదంలోని సైనిక భావం
  choice: సైన్య విభాగాలు
  alternative: దళాలు / సమూహాలు
  rationale: మూలంలోని క్రమబద్ధమైన సైనిక నిర్మాణ భావాన్ని నిలుపుతుంది; అయితే వారిని యుద్ధంలో ఉన్న సేనలుగా అతిగా చిత్రించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని పితృవంశ నుడికారాన్ని ‘పితృగృహాలు’తో, సైనిక క్రమబద్ధీకరణను ‘సైన్య విభాగాలు’తో నిలిపాం. సంఖ్యను తెలుగు పద్ధతిలో పదాలతో రాశాం.
