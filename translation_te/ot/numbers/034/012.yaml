- from: తరువాత సరిహద్దు యొర్దాను వరకు దిగిపోయి, దాని చివర ఉప్పు సముద్రం[a] దగ్గర ఉంటుంది. చుట్టూ ఉన్న దాని సరిహద్దుల ప్రకారం ఇదే మీ దేశం.
  to: తరువాత సరిహద్దు యొర్దాను వరకు దిగివచ్చి, దాని అంత్యస్థానాలు[a] ఉప్పు సముద్రం[b] వద్ద ఉంటాయి. చుట్టూ ఉన్న సరిహద్దులతో, ఇదే మీ దేశంగా ఉంటుంది.
