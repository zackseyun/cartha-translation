id: NUM.34.12
reference: Numbers 34:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָרַ֤ד הַ/גְּבוּל֙ הַ/יַּרְדֵּ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו יָ֣ם הַ/מֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָ/כֶ֥ם הָ/אָ֛רֶץ לִ/גְבֻלֹתֶ֖י/הָ סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: te
  text: తరువాత సరిహద్దు యొర్దాను వరకు దిగివచ్చి, దాని అంత్యస్థానాలు[a] ఉప్పు సముద్రం[b] వద్ద ఉంటాయి. చుట్టూ ఉన్న సరిహద్దులతో, ఇదే మీ దేశంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని పదం సరిహద్దు యొక్క “ముగింపులు” లేదా “చివరి భాగాలు” అనే అర్థాన్నీ ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఉప్పు సముద్రం’; ఇది సాధారణంగా మృత సముద్రం అని పిలిచే జలాశయం.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: తరువాత ... దిగిపోయి
  rationale: ירד అనే క్రియకు ‘దిగిపోవడం’ అనే ప్రాథమిక అర్థం ఉంది. సరిహద్దు మార్గాన్ని వరుసగా వర్ణిస్తున్నందున וְ ను సహజమైన తెలుగు క్రమసూచకమైన ‘తరువాత’గా వ్యక్తం చేశాం.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: גְּבוּל భూభాగపు హద్దును సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘సరిహద్దు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַיַּרְדֵּנָה
  choice: యొర్దాను వరకు
  rationale: దిశను సూచించే ־ָה ప్రత్యయం యొర్దాను వైపు గమనాన్ని తెలియజేస్తుంది. సరిహద్దు అక్కడికి చేరుతుందనే సందర్భార్థాన్ని ‘వరకు’ సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘నది’ని చేర్చలేదు.
- source_word: תוֹצְאֹתָיו
  choice: దాని చివర
  rationale: సరిహద్దు వర్ణనల్లో ఈ బహువచన రూపం దాని ముగింపు స్థానం లేదా అంత్యభాగాన్ని సూచిస్తుంది. ఏకవచన ప్రత్యయం ‘దాని’ని నిలుపుతూ, తెలుగులో సహజమైన ‘చివర’ను ఎంచుకున్నాం.
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: హీబ్రూ నామాన్ని అక్షరార్థానికి దగ్గరగా నిలిపాం; ఆధునికంగా ‘మృత సముద్రం’ అని పిలిచే జలాశయమని పాదటిప్పణిలో వివరించాం.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: ఇదే మీ దేశం
  rationale: లָכֶם లోని సంబంధార్థాన్ని సహజమైన తెలుగు స్వామ్యరూపం ‘మీ’తో వ్యక్తం చేశాం. నియమాత్మక భవిష్య భావం సందర్భంలో తెలుగులో ‘ఇదే’ ద్వారా స్పష్టంగా వస్తుంది.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: చుట్టూ ఉన్న దాని సరిహద్దుల ప్రకారం
  rationale: భూమి అన్ని వైపులా తన హద్దులచేత నిర్వచించబడిందనే భావాన్ని మూలానికి దగ్గరగా, అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే భౌగోళిక-న్యాయ శైలిని ఉపయోగించాం. మూలంలోని సరిహద్దు ప్రయాణ క్రమాన్ని, ‘ఉప్పు సముద్రం’ అనే ప్రాచీన పేరును నిలిపాం.
