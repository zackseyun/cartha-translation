source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י נָשִׂ֑יא פְּדַהְאֵ֖ל בֶּן עַמִּיהֽוּד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: te
  text: 'నఫ్తాలి కుమారుల[a] గోత్రానికి నాయకుడు: అమ్మీహూదు కుమారుడు పెదహేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నఫ్తాలి కుమారులు’; ఇది నఫ్తాలి సంతతివారిని సూచించే సాధారణ గోత్రనామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రానికి
  rationale: గోత్రాల మధ్య దేశాన్ని పంచే ఈ సందర్భంలో מַטֶּה అంటే కర్ర కాదు, ‘గోత్రం’. వాక్యారంభంలోని וּ జాబితాలోని అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో అది ప్రత్యేకంగా పలకకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: בְנֵי נַפְתָּלִי
  choice: నఫ్తాలి కుమారుల
  rationale: హీబ్రూ పదబంధాన్ని ‘నఫ్తాలి కుమారులు’ అని సమీపంగా అనువదించాం; ఇది నఫ్తాలి సంతతివారిని సూచించే ప్రామాణిక గోత్రనామం అని పాదటిప్పణి వివరిస్తుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ పరిపాలనా జాబితాలో గోత్రానికి నియమించబడిన ప్రధానిని సూచిస్తుంది; ‘నాయకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి రాజవంశ సంబంధమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: פְּדַהְאֵל
  choice: పెదహేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఇది సాధారణ పితృనామ సూత్రం; నేరుగా, సహజంగా ‘కుమారుడు’ అని అనువదించాం.
- source_word: עַמִּיהוּד
  choice: అమ్మీహూదు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
