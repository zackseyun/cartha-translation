translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపి, మూలంలోని నామవాచక నిర్మాణాన్ని సహజంగా అందించాం. వ్యక్తినామాలకు తెలుగు బైబిలు వాడుకకు అనుకూలమైన లిప్యంతరీకరణను ఉపయోగించాం.
