id: NUM.34.5
reference: Numbers 34:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָסַ֧ב הַ/גְּב֛וּל מֵ/עַצְמ֖וֹן נַ֣חְלָ/ה מִצְרָ֑יִם וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: te
  text: అప్పుడు సరిహద్దు అజ్మోను నుండి ఈజిప్టు వాగువరకు తిరిగి, సముద్రం వద్ద ముగుస్తుంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈజిప్టు వాడి.” హీబ్రూ పదం נחל సాధారణంగా ఋతుకాలంలో ప్రవహించే జలమార్గాన్ని లేదా ఎండిన వాగుపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దాని ముగింపులు సముద్రం వైపు ఉంటాయి.” హీబ్రూలో ‘ముగింపులు’ అనే పదం బహువచన రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: అప్పుడు ... తిరిగి
  rationale: సరిహద్దు దిశ మారడాన్ని נסב సూచిస్తుంది. వరుసగా చెప్పబడుతున్న సరిహద్దు నిర్దేశాలను సహజంగా అనుసంధానించేందుకు ‘అప్పుడు’ వాడబడింది.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: ప్రాంతాన్ని నిర్దేశించే హద్దురేఖ అనే భౌగోళిక అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעַצְמוֹן
  choice: అజ్మోను నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: נַחְלָה מִצְרָיִם
  choice: ఈజిప్టు వాగు వైపుకు
  rationale: נחל సాధారణంగా ఎల్లప్పుడూ ప్రవహించే పెద్ద నదికన్నా ఋతుకాలిక జలమార్గం లేదా వాగును సూచిస్తుంది. దిశాసూచక రూపాన్ని ‘వైపుకు’గా నిలిపాం.
- source_word: תּוֹצְאֹתָיו
  choice: ముగుస్తుంది
  rationale: సరిహద్దు వర్ణనలో ఈ పదం దాని అంతిమ స్థానాన్ని సూచిస్తుంది. హీబ్రూలో రూపం బహువచనమైనా, తెలుగులో సరిహద్దు ‘ముగుస్తుంది’ అనడం సహజం.
- source_word: הַיָּמָּה
  choice: సముద్రం దగ్గర
  rationale: అక్షరార్థంగా ‘సముద్రం వైపుకు’ అనే భావం ఉన్నా, సందర్భంలో సరిహద్దు సముద్రం వద్ద ముగియడాన్ని సూచిస్తుంది. ఇక్కడ హీబ్రూ నిర్దిష్టంగా మధ్యధరా సముద్రం అని పేర్కొనదు.
