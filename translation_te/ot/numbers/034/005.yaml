translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దు వివరణకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘వాగు’ భౌగోళిక స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘వాడి’ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
