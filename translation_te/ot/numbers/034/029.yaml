id: NUM.34.29
reference: Numbers 34:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה לְ/נַחֵ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: te
  text: కనాను దేశంలో ఇశ్రాయేలు కుమారులకు స్వాస్థ్యాన్ని పంచిపెట్టాలని యాహ్వే ఆజ్ఞాపించినవారు వీరే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనాను దేశంలో ఇశ్రాయేలు కుమారులకు స్వాస్థ్యాన్ని ఇవ్వాలని యాహ్వే ఆజ్ఞాపించినవారు వీరే.”
    reason: לְנַחֵל అనే హిఫీల్ క్రియకు ఇక్కడ స్వాస్థ్యాన్ని పంచిపెట్టడం/కేటాయించడం అనే సందర్భోచిత భావంతో పాటు, మరింత సాధారణంగా స్వాస్థ్యంగా ఇవ్వడం అనే భావమూ సాధ్యమే.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: వీరే
  rationale: ఇది ముందు పేర్కొన్న నియమిత నాయకులను ముగింపుగా గుర్తిస్తుంది. తెలుగు వాక్యంలో ‘వీరే’ సహజంగా ఉండి సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה యొక్క సాధారణ అర్థం ‘ఆజ్ఞాపించు.’ సందర్భంలో అధికారిక నియామకం ఉన్నప్పటికీ, మూల క్రియ యొక్క అర్థాన్ని నిలిపి, ఆజ్ఞలోని పనిని తరువాతి క్రియాపదబంధం తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לְנַחֵל
  choice: స్వాస్థ్యాన్ని పంచి ఇవ్వాలని
  rationale: נחל యొక్క హిఫీల్ రూపం ఇక్కడ భూమిని స్వాస్థ్యంగా పొందేలా కేటాయించడం/పంచడం అనే భావాన్ని ఇస్తుంది. ‘పంచి ఇవ్వడం’ కేటాయింపు ప్రక్రియను, ‘స్వాస్థ్యం’ వారసత్వ భావాన్ని వ్యక్తం చేస్తాయి.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలిపి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చతుర్థీ విభక్తిని వాడాం.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: భౌగోళిక నామాన్నీ ‘దేశం/భూమి’ అనే నామవాచకాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరు రూపంలో ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: לְנַחֵל యొక్క కార్యార్థం
  choice: స్వాస్థ్యాన్ని పంచి ఇవ్వడం
  alternative: స్వాస్థ్యంగా ఇవ్వడం
  rationale: ఈ సందర్భంలో నియమిత నాయకులు భూమిని ఇశ్రాయేలీయులకు స్వాస్థ్యంగా కేటాయించే ప్రక్రియ ప్రధానంగా ఉంది. అందువల్ల పంపిణీ భావాన్ని స్పష్టంగా ఉంచాం; సాధారణ కారణార్థక పఠనాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ముగింపు వాక్యంగా రూపొందించాం. ‘వీరే’ ద్వారా ముందున్న వ్యక్తుల జాబితాతో సంబంధాన్ని బలంగా ఉంచాం. ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని లింగ-నిర్దిష్ట రూపాన్ని నిలుపుతుంది; ‘స్వాస్థ్యం’ భూమి వారసత్వంగా కేటాయించబడే భావాన్ని వ్యక్తం చేస్తుంది.
