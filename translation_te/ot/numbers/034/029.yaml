  terminology: “ఇశ్రాయేలు కుమారులు,” “కనాను దేశం,” and “స్వాస్థ్యం” appropriately preserve the source’s formal register and inheritance terminology. “యాహ్వే” consistently represents יהוה as a personal name in accordance with the supplied POB audit trail.
