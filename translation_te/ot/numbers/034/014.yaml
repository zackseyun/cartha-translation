language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: te
  text: ఎందుకంటే రూబేను సంతానపు గోత్రం తమ పితృకుటుంబాల ప్రకారం[a], గాదు సంతానపు గోత్రం తమ పితృకుటుంబాల ప్రకారం, మనష్షే అర్ధ గోత్రం తమ స్వాస్థ్యాన్ని తీసుకున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితృకుటుంబాలు’ అంటే ప్రతి గోత్రంలోని పూర్విక కుటుంబ లేదా వంశ విభాగాలు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన భూభాగ నియామకానికి కారణాన్ని వివరించే సంధానపదంగా కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָקְחוּ
  choice: తీసుకున్నారు
  rationale: לקח క్రియ యొక్క పూర్తి కార్య భావాన్ని నేరుగా నిలుపుతుంది; ‘పొందారు’ కంటే మూలంలోని క్రియకు సన్నిహితం.
- source_word: מַטֶּה
  choice: గోత్రం
  rationale: భూవిభజన సందర్భంలో ఇది దండాన్ని కాకుండా ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: בְנֵי הָרְאוּבֵנִי
  choice: రూబేను వంశీయులు
  rationale: అక్షరార్థమైన ‘రూబేను కుమారులు’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, వంశసంబంధ భావాన్ని కాపాడుతుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ తమ పితృకుటుంబాల ప్రకారం
  rationale: ప్రతి గోత్రంలోని పూర్విక కుటుంబ లేదా వంశ విభాగాల ప్రకారం పంపిణీ జరిగిందనే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְנֵי הַגָּדִי
  choice: గాదు వంశీయులు
  rationale: ఆధునిక తెలుగులో సహజమైన జాతి/వంశ సూచనగా ఉండి మూలంలోని వంశపరమైన భావాన్ని నిలుపుతుంది.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం
  rationale: మనష్షే గోత్రంలోని ఒక అర్ధభాగం మాత్రమే ఉద్దేశించబడిందని సంక్షిప్తంగా, సంప్రదాయబద్ధంగా తెలియజేస్తుంది.
- source_word: נַחֲלָתָם
  choice: తమ స్వాస్థ్యం
  rationale: భూమిగా లభించిన వారసత్వపు వాటాను సూచించే న్యాయపరమైన, నిబంధనాత్మక భావాలను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని కారణార్థం, గోత్ర విభాగాలు, పూర్తయిన స్వాస్థ్య స్వీకరణను నిలిపి, వంశసూచక పదబంధాలను సహజ తెలుగులో అందించాం.
