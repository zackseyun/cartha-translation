revisions:
- from: ఎందుకంటే రూబేను వంశీయుల గోత్రం తమ తమ పితృకుటుంబాల ప్రకారం, గాదు వంశీయుల గోత్రం తమ తమ పితృకుటుంబాల ప్రకారం[a], మనష్షే అర్ధగోత్రం—వీరు తమ స్వాస్థ్యాన్ని తీసుకున్నారు.
