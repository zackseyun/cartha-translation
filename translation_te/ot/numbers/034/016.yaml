  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/016.yaml
  text: Then Yahweh spoke to Moses, saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-క్రమబద్ధ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. דּבר అనే మాట ఇక్కడ పలకడాన్ని సూచించినా, ఈ సూత్రబద్ధ వాక్యంలో ‘చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తి మరియు సంబోధితుని సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరచే రూపం; అక్షరార్థమైన ‘మోషేకు’ కూడా సాధ్యమే.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: తరువాతి వచనంలో ప్రత్యక్ష వాక్యం వస్తుందని సూచించే హీబ్రూ ప్రసంగ-పరిచయ సూత్రాన్ని తెలుగులో సహజంగా పెద్దబిందువుతో కూడిన ‘ఇలా చెప్పాడు:’ ద్వారా వ్యక్తపరచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం. అసలు ఉచ్చారణను సూచించడానికి ‘యాహ్వే’ అనే రూపం కూడా సాధ్యమే.
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి వాక్యాంతంలో పెద్దబిందువు వాడబడింది.
