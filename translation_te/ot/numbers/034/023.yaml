  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה נָשִׂ֑יא חַנִּיאֵ֖ל בֶּן אֵפֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: te
  text: యోసేపు కుమారులలోని మనష్షే కుమారుల గోత్రానికి నాయకుడు ఎఫోదు కుమారుడైన హన్నీయేలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోసేపు వంశస్థులలోని మనష్షే వంశస్థుల గోత్రానికి.” గోత్ర-వంశావళి సందర్భంలో హీబ్రూలో అక్షరార్థంగా “కుమారులు” అనే పదం వంశస్థులను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: యోసేపు కుమారులలో
  rationale: בְּנֵי అనే పదానికి అక్షరార్థం ‘కుమారులు’; ఇక్కడ అది వంశస్థులను సూచించే గోత్రపరమైన ప్రయోగం. తరువాతి לְמַטֵּהతో సంబంధాన్ని సహజమైన తెలుగులో చూపడానికి మొదటి לְను ‘లో’గా అనువదించాం.
- source_word: לְמַטֵּה בְנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారుల గోత్రానికి
  rationale: మַטֶּה ఈ పరిపాలనా, భూవిభజన సందర్భంలో ‘గోత్రం’ అని అర్థం; לְను ‘కి’తో తెలిపాం. בְנֵי యొక్క గోత్ర-వంశ భాషను ‘కుమారులు’గా నిలిపాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ ఇది నియమించబడిన గోత్ర అధిపతిని సూచిస్తుంది. ‘నాయకుడు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, ‘రాజకుమారుడు’ అనే అనుచిత రాజవంశ భావాన్ని నివారిస్తుంది.
- source_word: חַנִּיאֵל
  choice: హన్నీయేలు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן אֵפֹד
  choice: ఎఫోదు కుమారుడు
  rationale: ఇది సాధారణ పితృనామ నిర్మాణం. ఇక్కడ אֵפֹד యాజక వస్త్రాన్ని కాక వ్యక్తి పేరును సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘కుమారులు’ అనే హీబ్రూ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసారమైన ‘వంశస్థులు’ అనే భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
