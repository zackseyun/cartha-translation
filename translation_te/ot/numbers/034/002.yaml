translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. అధికారపూర్వక ఆదేశ స్వరం, భూస్వాస్థ్యానికి సంబంధించిన న్యాయపరమైన భావం, సరిహద్దుల నిర్దిష్టత నిలుపబడ్డాయి.
