source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי אַתֶּ֥ם בָּאִ֖ים אֶל הָ/אָ֣רֶץ כְּנָ֑עַן זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָ/כֶם֙ בְּֽ/נַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִ/גְבֻלֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులకు[a] ఆజ్ఞాపించి, వారితో ఇలా చెప్పు: ‘మీరు కనాను దేశంలోకి ప్రవేశించినప్పుడు, మీకు స్వాస్థ్యంగా లభించే[b] దేశం ఇదే—అంటే, దాని సరిహద్దుల ప్రకారం కనాను దేశం.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు”; ఈ పదబంధం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “మీకు స్వాస్థ్యంగా పడే”; ఇది కేటాయింపులో ఒకరి వంతుగా వచ్చే భూభాగాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించి
  rationale: ఈ ఆదేశ క్రియలోని అధికారపూర్వక బలాన్ని నిలుపుతూ, తరువాతి ‘చెప్పు’తో సహజంగా అనుసంధానిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని యథాతథంగా నిలుపుతుంది; సహజమైన సమూహార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: వరుసగా ఇచ్చిన రెండవ ఆదేశాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: మీరు … ప్రవేశించినప్పుడు
  rationale: ఇక్కడ כִּי ప్రవేశించే సందర్భాన్ని పరిచయం చేస్తుంది; భవిష్యత్తులో జరిగే ప్రవేశాన్ని తెలుగు కాలప్రయోగంతో సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ כְּנָעַן
  choice: కనాను దేశం
  rationale: స్థలనామాన్ని తెలుగులో సహజమైన సంబంధ నిర్మాణంతో అందిస్తుంది.
- source_word: זֹאת הָאָרֶץ
  choice: దేశం ఇదే
  rationale: తరువాత వివరించబోయే భూభాగాన్ని సూచించే నిర్దేశక బలాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: మీకు … లభించే
  rationale: ‘పడే’ అనే హీబ్రూ భూవిభజన నుడికారానికి సహజమైన తెలుగు సమానార్థకం; మూలంలోని రూపకాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: בְּנַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: తరతరాలకు చెందే వారసత్వ భూభాగం మరియు కేటాయించిన అధీనభాగం అనే న్యాయపరమైన భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: దాని సరిహద్దులలోని కనాను దేశం
  rationale: తరువాత వివరించబడే నిర్ణీత భౌగోళిక పరిమితులను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
