  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: te
  text: 'ఈ మనుషుల పేర్లు ఇవి: యూదా గోత్రం తరఫున యెఫున్నె కుమారుడు కాలేబు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: וְ ముందటి వాక్యంతో కొనసాగింపును సూచిస్తుంది; తెలుగులో సహజమైన జాబితా పరిచయంలో ఆ కొనసాగింపు వాక్యనిర్మాణం ద్వారానే స్పష్టమవుతుంది. אֵלֶּהను ‘ఇవి’గా అనువదించాం.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: ఆ మనుషుల పేర్లు
  rationale: שְׁמוֹת అనేది నిర్మిత రూపంలో ‘పేర్లు’; הָאֲנָשִׁים నిర్దిష్ట పురుష ప్రతినిధులను సూచిస్తున్నందున ‘ఆ మనుషుల’ అని ఇచ్చాం.
- source_word: לְמַטֵּה יְהוּדָה
  choice: యూదా గోత్రం తరఫున
  rationale: ఈ భూవిభజన సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; לְ ఉపసర్గ ఇక్కడ ఆ గోత్రానికి ప్రాతినిధ్యాన్ని సూచిస్తుంది.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితాను పరిచయం చేసే గంభీరమైన కానీ సులభమైన శైలి. మూలంలోని నిర్దిష్ట పురుష ప్రతినిధుల సూచనను ‘మనుషులు’గా నిలిపి, לְ యొక్క ప్రాతినిధ్య భావాన్ని ‘తరఫున’తో స్పష్టం చేశాం.
