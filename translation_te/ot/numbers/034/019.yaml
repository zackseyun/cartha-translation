  terminology: ‘గోత్రం తరఫున’ appropriately conveys representation for the tribe in this context. ‘కాలేబు’ and ‘యెఫున్నె’ are established Telugu biblical name forms, and ‘కుమారుడు’ accurately represents the patronymic.
