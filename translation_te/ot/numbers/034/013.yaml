id: NUM.34.13
reference: Numbers 34:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇశ్రాయేలీయులకు ఇలా ఆజ్ఞాపించాడు: “మీరు చీట్ల ద్వారా వారసత్వంగా పొందబోయే దేశం ఇదే. దీన్ని తొమ్మిది గోత్రాలకూ అర్ధగోత్రానికీ ఇవ్వాలని యెహోవా ఆజ్ఞాపించాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: చీట్లు వేసుకొని
  rationale: భూమిని దైవనిర్ణయాన్ని తెలుసుకునే చీట్ల ప్రక్రియ ద్వారా పంచుకోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: స్వాస్థ్యంగా పొందబోయే
  rationale: నחל మూలంలోని వారసత్వంగా లేదా కేటాయింపుగా స్వాధీనపరచుకోవడం అనే భావాన్ని కాపాడుతుంది; సందర్భానుసారంగా భవిష్యత్ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַמַּטּוֹת
  choice: గోత్రాలకు
  rationale: ఇక్కడ מַטֶּה పదం చేతికర్రను కాక ఇశ్రాయేలు గోత్ర విభాగాలను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో సూచిస్తుంది.
- source_word: לָתֵת
  choice: ఇవ్వాలని
  rationale: హీబ్రూ క్రియారూపంలోని సక్రియమైన ‘ఇవ్వడం’ భావాన్ని కాపాడుతుంది; ‘ఇవ్వబడాలని’ అనే కర్మణి రూపాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: భూమిని ఎవరు ఇస్తారనే వాక్య నిర్మాణం
  choice: దీనిని ... ఇవ్వాలని యెహోవా ఆజ్ఞాపించాడు
  alternative: దీనిని ... ఇవ్వబడాలని యెహోవా ఆజ్ఞాపించాడు
  rationale: మూలంలోని צִוָּה ... לָתֵת నిర్మాణం ‘ఆజ్ఞాపించాడు ... ఇవ్వడానికి/ఇవ్వాలని’ అని సక్రియంగా ఉంది. ఇవ్వువాడు ఎవరో వాక్యంలో స్పష్టంగా లేకపోవడాన్ని అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని ప్రత్యక్ష వాక్య నిర్మాణాన్ని నిలిపి, ‘ఇశ్రాయేలు కుమారులు’ అనే పదక్షర రూపానికి బదులు సహజమైన ‘ఇశ్రాయేలీయులు’ వాడబడింది.
