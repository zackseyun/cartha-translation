revisions:
- from: 'అప్పుడు మోషే ఇశ్రాయేలీయులకు ఇలా ఆజ్ఞాపించాడు: “మీరు చీట్లు వేసుకొని స్వాస్థ్యంగా పొందబోయే దేశం ఇదే. దీనిని తొమ్మిది గోత్రాలకు, అర్ధగోత్రానికి ఇవ్వాలని యెహోవా ఆజ్ఞాపించాడు.”'
  to: 'అప్పుడు మోషే ఇశ్రాయేలీయులకు ఇలా ఆజ్ఞాపించాడు: “మీరు చీట్ల ద్వారా వారసత్వంగా పొందబోయే దేశం ఇదే. దీన్ని తొమ్మిది గోత్రాలకూ అర్ధగోత్రానికీ ఇవ్వాలని యెహోవా ఆజ్ఞాపించాడు.”'
  rationale: Two small lexical revisions improve idiomatic Telugu and source precision. The wording concerning giving remains syntactically noncommittal about the human agent who would distribute the land, as in the Hebrew construction.
