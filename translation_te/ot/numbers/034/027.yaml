- from: ఆషేరు వంశీయుల గోత్రానికి నాయకుడు షెలోమి కుమారుడు అహీహూదు.
  to: మరియు ఆషేరు సంతతివారి గోత్రానికి నాయకుడు షెలోమి కుమారుడు అహీహూదు.
