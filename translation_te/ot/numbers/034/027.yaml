source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: te
  text: మరియు ఆషేరు సంతతివారి గోత్రానికి నాయకుడు షెలోమి కుమారుడు అహీహూదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రానికి
  rationale: భూభాగ పంపిణీ సందర్భంలో מַטֶּה అనే పదానికి ‘కర్ర’ అనే మూలార్థం కాకుండా ‘గోత్రం’ అనే అర్థమే సహజం. వాక్యాల జాబితా నిర్మాణంలో וּ సంధిని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని ఉంచకపోయినా భావం నిలుస్తుంది.
- source_word: בְנֵי אָשֵׁר
  choice: ఆషేరు వంశీయుల
  rationale: అక్షరార్థంగా ‘ఆషేరు కుమారులు’ అయినా, ఇక్కడ అది ఆషేరు సంతతితో ఏర్పడిన గోత్ర సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశీయులు’ ఈ సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో భూభాగ పంపిణీ కోసం నియమించబడిన గోత్ర ప్రతినిధిని సూచిస్తుంది. ‘నాయకుడు’ రాజవంశ సంబంధమైన అపార్థం లేకుండా అధికారిక పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲחִיהוּד
  choice: అహీహూదు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן שְׁלֹמִי
  choice: షెలోమి కుమారుడు
  rationale: హీబ్రూ తండ్రిపేరు నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జాబితా శైలిని వాడాం. మూలంలోని గోత్రపరమైన భావాన్ని సహజంగా వ్యక్తపరుస్తూ, వ్యక్తిపేర్లను లిప్యంతరీకరించాం.
