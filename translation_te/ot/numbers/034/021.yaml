translation:
  language: te
  text: 'బెన్యామీను గోత్రం నుండి: కిస్లోను కుమారుడైన ఎలీదాదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బెన్యామీను గోత్రం కోసం.’ ఈ గోత్ర ప్రతినిధుల జాబితాలోని హీబ్రూ ఉపసర్గాన్ని రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ గోత్ర ప్రతినిధుల జాబితాలో לְ గోత్రంతో ప్రతినిధికి ఉన్న అనుబంధాన్ని సూచిస్తుంది. తెలుగులో ‘గోత్రం నుండి’ సహజంగా ఉంది; ‘గోత్రం కోసం’ కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: בִנְיָמִן
  choice: బెన్యామీను
  rationale: హీబ్రూ గోత్రనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: אֱלִידָד
  choice: ఎలీదాదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: రెండు వ్యక్తినామాల మధ్య తండ్రీకొడుకుల సంబంధాన్ని సహజమైన తెలుగు వంశావళి శైలిలో తెలియజేస్తుంది.
- source_word: כִּסְלֹון
  choice: కిస్లోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజన నిర్మాణానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
