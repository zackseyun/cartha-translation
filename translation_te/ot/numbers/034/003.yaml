    rationale: מִקְצֵה יָם־הַמֶּלַח קֵדְמָה identifies the relevant extremity of the Salt Sea in a boundary formula. Telugu naturally expresses the primary sense as ‘ఉప్పు సముద్రపు తూర్పు చివర నుండి.’ The alternate reading may be retained in a footnote.
