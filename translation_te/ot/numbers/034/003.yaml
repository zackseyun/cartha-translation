  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: te
  text: మీ దక్షిణ వైపు ఎదోము పక్కగా ఉన్న సీను అరణ్యం నుండి ఉంటుంది; మీ దక్షిణ సరిహద్దు ఉప్పు సముద్రపు తూర్పు చివర నుండి ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉప్పు సముద్రపు చివర నుండి తూర్పుదిశగా.”
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: దక్షిణపు వైపు
  rationale: సరిహద్దుల వర్ణనలో פֵּאָה భూభాగపు ‘వైపు’ను సూచిస్తుంది; נֶגֶב ఇక్కడ ప్రాంతనామంగా కాక దిక్సూచకంగా ఉంది.
- source_word: מִמִּדְבַּר צִן
  choice: సీను అరణ్యం నుండి
  rationale: מִדְבָּרకు ‘అరణ్యం’ సహజమైన బైబిలు భౌగోళిక పదం; צִן అనే స్థలనామాన్ని ‘సీను’గా లిప్యంతరీకరించాం.
- source_word: עַל יְדֵי אֱדוֹם
  choice: ఎదోము పక్కగా ఉన్న
  rationale: ఈ భౌగోళిక నుడికారం ‘ఎదోము పక్కన/వెంబడి’ అనే అర్థం ఇస్తుంది; అధికారిక రాజకీయ సరిహద్దు అని మించి వ్యాఖ్యానించకుండా స్థలసంబంధాన్ని నిలుపుతుంది.
- source_word: גְּבוּל נֶגֶב
  choice: దక్షిణ సరిహద్దు
  rationale: గְּבוּל భూభాగపు సరిహద్దును సూచిస్తుంది; נֶגֶב దక్షిణ దిశను నిర్దేశిస్తుంది.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: ఉప్పు సముద్రపు చివర నుండి
  rationale: קָצֶה అంటే చివర లేదా అంచు; హీబ్రూ స్థలనామం יָם הַמֶּלַחను అక్షరార్థంగా ‘ఉప్పు సముద్రం’గా ఉంచాం.
- source_word: קֵדְמָה
  choice: తూర్పువైపున
  rationale: దిశను సూచించే ఈ అవ్యయం తూర్పు వైపు ఉన్న స్థితి లేదా దిశను తెలియజేస్తుంది; హీబ్రూ వాక్యంలోని స్వల్ప స్థలసంబంధ అస్పష్టతను బలవంతంగా పరిష్కరించలేదు.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: ఉంటుంది ... ఉంటుంది
  rationale: పునరావృతమైన హీబ్రూ క్రియను రెండు భాగాల్లోనూ సమీపంగా ప్రతిబింబించి, సరిహద్దు నిర్దేశపు శైలిని కాపాడాం.
