translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సరిహద్దు-వర్ణన శైలిని ఉపయోగించాం. మూలంలోని ‘ఉప్పు సముద్రం’ అనే పేరును నిలిపి, సంప్రదాయ ‘మృత సముద్రం’ను ప్రధాన పాఠ్యంలో ప్రవేశపెట్టలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
