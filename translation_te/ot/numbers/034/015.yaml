  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: te
  text: ఆ రెండు గోత్రాలూ, ఆ అర్ధగోత్రమూ తమ వారసత్వ భూమిని యెరికో దగ్గర యొర్దానుకు అవతల[a], తూర్పున—సూర్యోదయ దిశగా[b]—తీసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యొర్దాను నదికి ఆవలి వైపున.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘తూర్పున, సూర్యోదయ దిశగా’ అని ఉంది. తూర్పు వైపును నొక్కిచెప్పే ద్వంద్వ వ్యక్తీకరణ ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: ఆ రెండు గోత్రాలు
  rationale: మַטֶּה అనే పదానికి అక్షరార్థంగా ‘దండం’ అనే అర్థం ఉన్నా, భూవిభజన సందర్భంలో అది సహజంగా ‘గోత్రం’ను సూచిస్తుంది.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: ఆ అర్ధగోత్రం
  rationale: ఇక్కడ మనష్షే అర్ధగోత్రం అనే గుర్తింపు పొందిన గోత్ర విభాగాన్ని సూచిస్తుంది; కేవలం ఒక గోత్రంలోని సగభాగం అనే భావం మాత్రమే కాదు.
- source_word: לָקְחוּ
  choice: తీసుకున్నారు
  rationale: Qal perfect పూర్తయిన క్రియను సూచిస్తుంది. ‘తీసుకున్నారు’ మూలక్రియకు నేరుగా సరిపోతుంది; ‘పొందారు’ అనేది కొంత వ్యాఖ్యాత్మకం.
- source_word: נַחֲלָתָם
  choice: తమ వారసత్వ భూమి
  rationale: భూవిభజన సందర్భంలో נַחֲלָה వారసత్వంగా లభించిన భూభాగాన్ని సూచిస్తుంది. తెలుగులో ‘వారసత్వ భూమి’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: యొర్దానుకు అవతల
  rationale: మాట్లాడుతున్నవారి దృష్టికోణం నుంచి యొర్దాను నదికి ఆవలి ప్రాంతాన్ని సూచించే మూలభాషా నానుడిని సహజంగా నిలుపుతుంది.
- source_word: יְרֵחוֹ
  choice: యెరికో దగ్గర
  rationale: ఈ స్థలనామం యొర్దాను దాటే ప్రాంతాన్ని సూచించే క్రియావిశేషణ స్థానంలో ఉంది; ‘దగ్గర’ అవసరానికి మించిన ఖచ్చితత్వాన్ని రుద్దకుండా స్థాన సంబంధాన్ని తెలుపుతుంది.
- source_word: קֵדְמָה מִזְרָחָה
  choice: తూర్పున—సూర్యోదయ దిశగా
  rationale: రెండు దిశాసూచక పదాల జతను ఒకే ‘తూర్పు’గా కుదించకుండా, తూర్పు వైపు ఉన్నదనే నొక్కిచెప్పే మూలంలోని ద్వంద్వ వ్యక్తీకరణను నిలుపుతుంది.
