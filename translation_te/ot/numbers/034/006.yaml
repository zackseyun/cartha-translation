  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: te
  text: మీ పడమటి సరిహద్దు[a] మహాసముద్రం మరియు దాని తీరం అవుతాయి; ఇదే మీ పడమటి సరిహద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సముద్రపు సరిహద్దు’ లేదా ‘సముద్ర సరిహద్దు.’ ఈ సరిహద్దుల సందర్భంలో హెబ్రీ ‘సముద్రం’ అనే పదం పడమటి దిశను కూడా సూచిస్తుంది; అందుకే ‘పడమటి సరిహద్దు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: భూభాగానికి నిర్ణయించిన హద్దును సూచించే సహజమైన ఆధునిక తెలుగు పదం; వచనంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: יָם
  choice: పడమటి
  rationale: ఈ సరిహద్దుల జాబితాలో ‘సముద్రం’ సముద్రం వైపునున్న దిశను, అంటే పడమటిని, సూచిస్తుంది.
- source_word: הַיָּם הַגָּדוֹל
  choice: మహాసముద్రం
  rationale: హెబ్రీ భౌగోళిక నామమైన ‘గొప్ప సముద్రం’ను తెలుగులో సహజమైన పేరుగా అందిస్తుంది; ఇది మధ్యధరా సముద్రాన్ని సూచిస్తుంది.
- source_word: וְהָיָה לָכֶם
  choice: మీ ... ఉంటుంది
  rationale: ఇశ్రాయేలీయులకు ఏది సరిహద్దుగా ఉండాలో తెలిపే కేటాయింపు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּגְבוּל
  choice: సరిహద్దుగా
  rationale: మహాసముద్రం నిర్వహించే సరిహద్దు పాత్రను స్పష్టంగా తెలుపుతుంది.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: ఇదే మీ పడమటి సరిహద్దు
  rationale: ముగింపు పునర్వచనాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతూ దిశాపరమైన అర్థాన్ని స్పష్టం చేస్తుంది.
