  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה); సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: హీబ్రూ దైవనామాన్ని గుర్తించి, సంప్రదాయ బిరుదు-అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమసూచక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. తెలుగు వాక్యప్రయోగంలో ‘మోషేతో చెప్పాడు’ మూలంలోని మాటలాడే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో ఇచ్చాం.
- source_word: אֶל
  choice: తో
  rationale: דבר ... אל అనే హీబ్రూ నిర్మాణం ‘ఒకరితో మాట్లాడడం/చెప్పడం’ అని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషేతో’ సహజమైన సమానార్థకం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: ఈ ఇన్ఫినిటివ్ నిర్మాణం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా చెప్పాడు:’ ఆ సూత్రప్రాయ కార్యాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాక చతురక్షర వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల ‘ప్రభువు’ అని ప్రత్యామ్నాయపరచకుండా పేరు రూపాన్నే ఉంచాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిశ్చితంగా తెలియనందున, తెలుగులో సుపరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో, పండితులు సాధారణంగా పునర్నిర్మించే ‘యాహ్వే’ను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే వాక్యారంభ సూత్రపు గంభీరతను నిలుపుతూ రూపొందించబడింది. తరువాత వచ్చే దైవవాక్యాన్ని సూచించేందుకు ద్విబిందువు వాడబడింది.
