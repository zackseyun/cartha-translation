id: NUM.34.11
reference: Numbers 34:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: te
  text: అప్పుడు సరిహద్దు షెఫాము నుండి అయినుకు తూర్పున ఉన్న రిబ్లా వరకు దిగుతుంది. అక్కడి నుండి సరిహద్దు ఇంకా దిగుతూ, కిన్నెరెతు సముద్రపు తూర్పు వైపున ఉన్న వాలును[a] చేరుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కిన్నెరెతు సముద్రపు భుజాన్ని తాకుతుంది.” భౌగోళిక వాడుకలో “భుజం” అంటే పక్కభాగం లేదా వాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: దిగుతుంది
  rationale: ירד అనే క్రియకు ‘దిగు’ అనే ప్రాథమిక అర్థం ఉంది; ఇక్కడ సరిహద్దు రేఖ భౌగోళికంగా కిందికి సాగడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: సరిహద్దు
  rationale: గెబూల్ అనే పదం దేశపు హద్దు లేదా సరిహద్దు రేఖను సూచిస్తుంది; ఆధునిక తెలుగులో ‘సరిహద్దు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִשְּׁפָם הָרִבְלָה
  choice: షెఫాము నుండి … రిబ్లా వరకు
  rationale: స్థలనామాలను లిప్యంతరీకరించి, హీబ్రూ మూలం మరియు గమ్యాన్ని తెలుగులో సహజమైన ‘నుండి … వరకు’ నిర్మాణంతో తెలిపింది.
- source_word: מִקֶּדֶם לָעָיִן
  choice: అయినుకు తూర్పున ఉన్న
  rationale: ఈ పదబంధం రిబ్లా స్థానాన్ని అయినుతో పోల్చి తూర్పు దిశలో నిర్దేశిస్తుంది; సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేసింది.
- source_word: וּמָחָה
  choice: చేరుతుంది
  rationale: ఈ సరిహద్దు వర్ణనలో מחה ఒక భౌగోళిక లక్షణాన్ని తాకడం లేదా దాని వరకు చేరడాన్ని సూచిస్తుంది; ‘చేరుతుంది’ సందర్భానుకూలమైన సహజ రూపం.
- source_word: עַל כֶּתֶף
  choice: వాలును
  rationale: כֶּתֶף అక్షరార్థంగా ‘భుజం’; భౌగోళిక వాడుకలో పక్కభాగం, పార్శ్వం లేదా వాలును సూచిస్తుంది. ‘వాలు’ భూభాగ సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: יָם כִּנֶּרֶת
  choice: కిన్నెరెతు సముద్రం
  rationale: హీబ్రూ స్థలనామాన్ని నిలిపి, יָם ను సంప్రదాయబద్ధంగా ‘సముద్రం’గా అనువదించింది; తరువాతి కాలపు ‘గలిలయ సముద్రం’ అనే పేరును ఇక్కడికి తీసుకురాలేదు.
- source_word: קֵדְמָה
  choice: తూర్పు వైపున ఉన్న
  rationale: చివరి దిశాసూచక పదం కిన్నెరెతు సముద్రానికి తూర్పున ఉన్న పార్శ్వం లేదా వాలును సూచించేలా సహజ తెలుగులో ఇచ్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే భౌగోళిక-న్యాయ వర్ణనా శైలిని ఉపయోగించింది. స్థలనామాలను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించింది; అపారదర్శకమైన ‘భుజం’ అనే అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘వాలు’గా ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో నిలిపింది.
