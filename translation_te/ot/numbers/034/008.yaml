translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన భాషను వాడాం. స్థలనామాలను తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం; హీబ్రూ భౌగోళిక పదబంధంలోని నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
