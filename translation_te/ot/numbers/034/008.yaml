- from: హోరు కొండ నుండి లెబో-హమాతు[a] వరకు సరిహద్దును గుర్తించాలి; ఆ సరిహద్దు చివరి స్థానం సెదాదు వద్ద ఉండాలి.
  to: హోరు కొండ నుండి లెబో-హమాతు[a] వరకు మీరు సరిహద్దును నిర్దేశించాలి; సరిహద్దు చివరలు సెదాదు వైపు చేరతాయి.
