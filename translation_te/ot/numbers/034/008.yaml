id: NUM.34.8
reference: Numbers 34:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מֵ/הֹ֣ר הָ/הָ֔ר תְּתָא֖וּ לְבֹ֣א חֲמָ֑ת וְ/הָי֛וּ תּוֹצְאֹ֥ת הַ/גְּבֻ֖ל צְדָֽדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: te
  text: హోరు కొండ నుండి లెబో-హమాతు[a] వరకు మీరు సరిహద్దును నిర్దేశించాలి; సరిహద్దు చివరలు సెదాదు వైపు చేరతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదశః, ‘హమాతు ప్రవేశద్వారం వరకు’; ఇది బహుశా ‘లెబో-హమాతు’ అనే స్థిరమైన స్థలనామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: హోరు కొండ నుండి
  rationale: ఇది מִן (‘నుండి’) ఉపసర్గతో ఉన్న స్థలనామం. ఆధునిక తెలుగులో సహజంగా ‘హోరు కొండ’ అని అనువదించబడింది.
- source_word: תְּתָאוּ
  choice: సరిహద్దును గుర్తించాలి
  rationale: సరిహద్దు నిర్దేశించే ఈ సందర్భంలో క్రియ రేఖను గీయడం లేదా నిర్దేశించడం అనే భావాన్ని ఇస్తుంది; ‘గుర్తించాలి’ సాధారణ పాఠకులకు సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לְבֹא חֲמָת
  choice: లెబో-హమాతు వరకు
  rationale: పదశః ‘హమాతు ప్రవేశం వరకు’ అయినప్పటికీ, ఇది స్థిరమైన భౌగోళిక నామంగా పనిచేసే అవకాశం బలంగా ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో స్థలనామాన్ని ఉంచి, పదశః అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְהָיוּ
  choice: ఉండాలి
  rationale: న్యాయపరమైన సరిహద్దు వివరణలో ఇది నిర్దేశాత్మక భావాన్ని కొనసాగిస్తుంది; తెలుగులో ‘ఉండాలి’ సహజంగా సరిపోతుంది.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: ఆ సరిహద్దు చివరి స్థానం
  rationale: భూసరిహద్దు సందర్భంలో תּוֹצְאֹת అనేది వెలుపలికి వెళ్లే చోటు లేదా అంత్యబిందువును సూచిస్తుంది. ఏకవచన ప్రదేశమైన సెదాదుతో అనుసంధానించి తెలుగులో ‘చివరి స్థానం’ అని సహజంగా వ్యక్తీకరించాం.
- source_word: צְדָדָה
  choice: సెదాదు వద్ద
  rationale: దిశను సూచించే -ה ప్రత్యయం ఉన్నప్పటికీ, ఈ వాక్యంలో అది సరిహద్దు చేరే తుదిస్థలాన్ని తెలియజేస్తుంది; ‘వద్ద’ ఆ భౌగోళిక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
