  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: te
  text: 'ఆ భూమిని మీకు వారసత్వంగా పంచి ఇచ్చే పురుషుల పేర్లు ఇవి: యాజకుడైన ఎలియాజరు, నూను కుమారుడైన యెహోషువ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ భూమిని మీకు వారసత్వంగా ఇచ్చే” లేదా “మీరు ఆ భూమిని వారసత్వంగా పొందేలా చేసే.” హెబ్రీ క్రియలో వారసత్వాన్ని పొందేలా చేయడం లేదా దానిని కేటాయించడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: పురుషుల పేర్లు ఇవి
  rationale: ఇక్కడ తరువాత పేర్లు చెప్పబడుతున్న నిర్దిష్ట పురుష నాయకులను సూచిస్తుంది; హెబ్రీ నిరాకార వాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో అందించాం.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: ఆ భూమిని మీకు వారసత్వంగా పంచి ఇచ్చే
  rationale: נחל హిఫీల్ రూపం ఇతరులు వారసత్వంగా పొందేలా చేయడం లేదా వారికి కేటాయించడం అనే కారక భావాన్ని కలిగి ఉంది. సందర్భంలో వీరు భూమిని పరిపాలనా రీతిలో పంచి కేటాయిస్తారు; ‘వారసత్వంగా పంచి ఇచ్చే’ అనే రూపం పంచడం, వారసత్వం అనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: పదవిని సహజమైన తెలుగు విశేషణ నిర్మాణంతో వ్యక్తపరుస్తూ, వ్యక్తి పేరును ప్రామాణిక బైబిలు తెలుగు రూపంలో ఇచ్చాం.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: హెబ్రీ పితృనామ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘స్వాస్థ్యము’ వంటి పాత పదానికి బదులుగా ‘వారసత్వం’ వాడబడింది; పరిపాలనా కేటాయింపు భావం కోసం ‘పంచి ఇచ్చే’ ఎంచుకోబడింది. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
