language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: te
  text: 'మరియు జెబూలూను కుమారుల గోత్రానికి నాయకుడు: పర్నాకు కుమారుడు ఎలీసాపాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రానికి
  rationale: గోత్రాల భూవిభజన సందర్భంలో מַטֶּה అంటే ‘కర్ర’ కాక ‘గోత్రం’. జాబితా కొనసాగింపును తెలుగులో వాక్య నిర్మాణమే సహజంగా తెలియజేస్తుంది కాబట్టి וּ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: בְנֵי זְבוּלֻן
  choice: జెబూలూనీయుల
  rationale: בְנֵי పదానికి అక్షరార్థం ‘కుమారులు’; అయితే ఇక్కడ అది జెబూలూను వంశానికి చెందిన గోత్ర ప్రజలను సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘జెబూలూనీయులు’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ పదం గుర్తింపు పొందిన గోత్రాధిపతిని లేదా నాయకుణ్ణి సూచిస్తుంది. ‘రాజకుమారుడు’ అనే అపార్థాన్ని నివారిస్తూ పరిపాలనా సందర్భానికి ‘నాయకుడు’ సరిపోతుంది.
- source_word: אֱלִיצָפָן
  choice: ఎలీషాఫాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן פַּרְנָךְ
  choice: పర్నాకు కుమారుడు
  rationale: בֶּן అనేది సాధారణ వంశసంబంధ సూచన, ‘కుమారుడు’. పర్నాకు అనే వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపాం. మూలంలోని నామవాచక పదబంధ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం; గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన పదజాలం వాడాం.
