  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: te
  text: 'దాను వంశీయుల గోత్రానికి నాయకుడు: యొగ్లీ కుమారుడైన బుక్కీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రం తరఫున
  rationale: సంఖ్యాకాండము 34లో מַטֶּה భూవిభజన సందర్భంలో ‘గోత్రం’ను సూచిస్తుంది; לְ ఉపసర్గ ప్రతినిధిత్వ భావాన్ని ఇచ్చేందున ‘తరఫున’ సహజమైన తెలుగు ప్రయోగం.
- source_word: בְנֵי דָן
  choice: దాను వంశీయుల
  rationale: అక్షరార్థంగా ‘దాను కుమారులు’; ఇక్కడ గోత్రసంబంధమైన వారసులను సూచిస్తున్నందున ఆధునిక తెలుగులో సహజంగా ‘దాను వంశీయులు’ అని అనువదించబడింది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో భూవిభజన కోసం నియమించబడిన గోత్ర ప్రతినిధిని సూచిస్తుంది; ‘నాయకుడు’ స్పష్టమైన, ఆధునిక పదం.
- source_word: בֻּקִּי
  choice: బుక్కి
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి గుర్తింపులో ప్రత్యక్ష పుత్రసంబంధాన్ని తెలిపే సాధారణ తెలుగు పదం.
- source_word: יָגְלִי
  choice: యొగ్లి
  rationale: హీబ్రూ יָגְלִי (Yog̱lî) ఉచ్చారణకు సమీపంగా వ్యక్తినామం లిప్యంతరీకరించబడింది.
