  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన అధికారిక జాబితా శైలి పాటించబడింది. హీబ్రూ ‘దాను కుమారులు’ అనే నుడికారాన్ని పదక్షరంగా కాకుండా దాని గోత్రార్థాన్ని స్పష్టంగా తెలిపే ‘దాను వంశీయులు’గా అందించాం; అందువల్ల పాదటిప్పణి అవసరం లేదు.
