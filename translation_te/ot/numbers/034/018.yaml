source:
  edition: WLC
  text: וְ/נָשִׂ֥יא אֶחָ֛ד נָשִׂ֥יא אֶחָ֖ד מִ/מַּטֶּ֑ה תִּקְח֖וּ לִ/נְחֹ֥ל אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: te
  text: దేశాన్ని స్వాస్థ్యంగా పొందడానికి ప్రతి గోత్రం నుండి ఒక్కో నాయకుణ్ణి మీరు తీసుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశాన్ని స్వాధీనం చేసుకోవడానికి.” హీబ్రూ క్రియ సాధారణంగా స్వాస్థ్యంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని ఇస్తుంది. సమీప సందర్భం దేశ భాగాల కేటాయింపుకు సంబంధించినది కాబట్టి, కొందరు దీనిని ఆ కార్యంతో సంబంధించి అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ పరిపాలనా సందర్భంలో గుర్తింపు పొందిన గోత్ర నాయకుణ్ణి సూచిస్తుంది; రాజవంశీయ భావాన్ని కలిగించే పదం అవసరం లేదు.
- source_word: אֶחָד ... אֶחָד
  choice: ఒక్కొక్క
  rationale: ప్రతి గోత్రం నుండి ఒక ప్రతినిధి అనే పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִמַּטֶּה
  choice: ప్రతి గోత్రం నుండి
  rationale: מַטֶּה అనే పదానికి అక్షరార్థంగా ‘కర్ర’ అనే అర్థం ఉన్నా, ఇక్కడ ఇశ్రాయేలు గోత్రాన్ని సూచిస్తుంది; పునరుక్తమైన אֶחָד వల్ల ‘ప్రతి’ అనే భావం స్పష్టమవుతుంది.
- source_word: תִּקְחוּ
  choice: మీరు తీసుకోవాలి
  rationale: బహువచన శ్రోతలకు ఇచ్చిన ఆదేశాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִנְחֹל
  choice: స్వాస్థ్యంగా పంచి ఇవ్వడానికి
  rationale: ఈ సందర్భంలో ఎంపికైన నాయకులు భూమిని వ్యక్తిగతంగా స్వీకరించడం కంటే, గోత్రాలకు స్వాస్థ్య భాగాలను కేటాయించే కార్యంలో పాల్గొంటారు. హీబ్రూ క్రియలోని వారసత్వం పొందడం/కలిగించడం అనే అర్థ పరిధిలో సందర్భానుకూలమైన causative భావాన్ని ఈ అనువాదం తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ ఇశ్రాయేలీయులకు కేటాయించబడే నిర్దిష్ట దేశాన్ని సూచిస్తుంది; తెలుగులో ‘దేశం’ ఈ భౌగోళిక భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: לִנְחֹל క్రియ యొక్క భావం
  choice: స్వాస్థ్యంగా పంచి ఇవ్వడానికి
  alternative: దేశాన్ని స్వాస్థ్యంగా పొందడానికి
  rationale: సమీప సందర్భంలో నాయకులు దేశ భాగాలను కేటాయించే బాధ్యత కోసం ఎంపికవుతున్నారు. అయితే క్రియ స్వాస్థ్యాన్ని పొందడం అనే భావాన్నీ మోయగలదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. ‘స్వాస్థ్యం’ అనే బైబిలు సందర్భానికి సుపరిచితమైన పదాన్ని సహజమైన ‘పంచి ఇవ్వడం’తో కలిపి పరిపాలనా భావాన్ని స్పష్టం చేశాం.
