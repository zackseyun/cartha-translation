translation:
  language: te
  text: 'మరియు ఎఫ్రాయిము కుమారుల గోత్రానికి[a] నాయకుడు: షిప్తాను కుమారుడు కెమూయేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘ఎఫ్రాయిము కుమారులు’; అంటే ఎఫ్రాయిము గోత్ర సభ్యులు లేదా అతని వంశస్థులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రానికి
  rationale: מַטֶּה అనే పదానికి అక్షరార్థంగా ‘కర్ర’ అనే భావం ఉన్నా, ఈ పరిపాలనా జాబితాలో అది ‘గోత్రం’ అనే అర్థంలో వాడబడింది. తెలుగు వాక్యనిర్మాణంలో לְ భావాన్ని ‘-కి’తో సహజంగా తెలిపాం; וּ జాబితా కొనసాగింపును సూచించినా, ఈ స్వతంత్ర వచనంలో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు.
- source_word: בְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారుల
  rationale: హీబ్రూ నిర్మాణంలోని ‘ఎఫ్రాయిము కుమారులు’ అనే రూపాన్ని నిలుపుతూ, అది గోత్ర సభ్యులు లేదా వంశస్థులను సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో గోత్రానికి నియమించబడిన ప్రతినిధి లేదా అధిపతిని సూచిస్తుంది. రాజవంశ భావాన్ని కలిగించగల ‘రాజకుమారుడు’ కంటే ‘నాయకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: קְמוּאֵל
  choice: కెమూయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశనామ సూచనలోని సాధారణ తండ్రి-కొడుకు సంబంధాన్ని సహజమైన తెలుగులో తెలిపే రూపం.
- source_word: שִׁפְטָן
  choice: షిఫ్తాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
