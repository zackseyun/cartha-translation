  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దు ప్రయాణవర్ణనకు తగిన గౌరవప్రదమైన సాధారణ శైలిని వాడాం. స్థలనామాలను అనువదించకుండా తెలుగు లిపిలో ఇచ్చి, అక్రబ్బీము పేరులోని అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
