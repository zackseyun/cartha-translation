id: NUM.34.4
reference: Numbers 34:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: te
  text: అప్పుడు మీ సరిహద్దు అక్రబ్బీము ఎక్కుదారికి దక్షిణం నుంచి మలుపు తిరిగి, సీను వైపుగా దాటి వెళుతుంది. దాని చివర కాదేషు-బర్నేయకు దక్షిణంగా ఉంటుంది. అక్కడి నుంచి అది హజర్-అద్దారు వరకు సాగి, అజ్మోను వైపుగా దాటి వెళుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַב
  choice: మలుపు తిరిగి
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ సరిహద్దు రేఖ తిరగడాన్ని లేదా వంపు తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: భూభాగపు హద్దును సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: అక్రబ్బీము ఎక్కుడుకు దక్షిణం నుంచి
  rationale: מִנֶּגֶב ఆ ప్రదేశానికి దక్షిణ వైపును సూచిస్తుంది; מַעֲלֵהకు భౌగోళిక ఎత్తుదారిని తెలిపే ‘ఎక్కుడు’ను వాడి, అక్రబ్బీము అనే స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וְעָבַר צִנָה
  choice: సీను వైపు దాటిపోవాలి
  rationale: దిశాసూచక ה సీను వైపు గమనాన్ని తెలుపుతుంది; సరిహద్దు రేఖ ముందుకు దాటడాన్ని ‘దాటిపోవాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: దాని చివర ... ఉండాలి
  rationale: תּוֹצְאוֹת రూపరీత్యా బహువచనమైనా, సరిహద్దు వర్ణనలో దాని ముగింపు లేదా అంతిమ భాగాన్ని సూచించే స్థిర ప్రయోగం; తెలుగులో ఏకవచన ‘చివర’ సహజంగా ఉంది.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: కాదేషు-బర్నేయకు దక్షిణంగా
  rationale: సరిహద్దు కాదేషు-బర్నేయకు దక్షిణ వైపున ముగుస్తుందని భౌగోళిక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: అది హజర్-అద్దారు వరకు సాగి
  rationale: సరిహద్దు వర్ణనలో יָצָא తదుపరి స్థానం వరకు రేఖ విస్తరించడాన్ని సూచిస్తుంది; ‘సాగి’ ఆధునిక తెలుగులో సహజం.
- source_word: וְעָבַר עַצְמֹנָה
  choice: అజ్మోను వైపు దాటిపోవాలి
  rationale: స్థలనామంలోని దిశాసూచక అంత్యాక్షరం అజ్మోను వైపు గమనాన్ని సూచిస్తుంది.
