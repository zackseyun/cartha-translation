    issue: '"అక్రబ్బీము ఎక్కుడు" is awkward and unclear as a geographic expression.'
    rationale: మַעֲלֵה denotes an ascent, rising route, or pass. "ఎక్కుదారి" expresses this clearly in current Telugu while retaining Akrabbim as a place-name.
  - severity: low
