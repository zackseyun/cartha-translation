source:
  edition: WLC
  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: te
  text: 'మీ ఉత్తర సరిహద్దు ఇలా ఉండాలి: మహాసముద్రం నుండి హోర్ పర్వతం వరకు మీరు మీ సరిహద్దును నిర్ణయించాలి.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హోర్ పర్వతం వరకు సరిహద్దు రేఖను గీయాలి.” ఈ భౌగోళిక సందర్భంలో ఈ క్రియ సరిహద్దు రేఖను గీయడం లేదా గుర్తించడం అనే అర్థాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మహాసముద్రం” అనేది మధ్యధరా సముద్రాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: మీ ... ఇదే
  rationale: తదుపరి సరిహద్దు నిర్దేశాన్ని పరిచయం చేసే న్యాయపరమైన వాక్యప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גְּבוּל צָפוֹן
  choice: ఉత్తర సరిహద్దు
