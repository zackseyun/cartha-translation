- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: మహాసముద్రం నుండి
  rationale: హీబ్రూ భౌగోళిక బిరుదైన ‘మహాసముద్రం’ను ప్రధాన పాఠ్యంలో నిలుపుతూ, ఆధునిక పేరును పాదసూచికలో వివరిస్తుంది.
- source_word: תְּתָאוּ לָ/כֶם
  choice: మీ సరిహద్దును గుర్తించాలి
  rationale: ఈ భౌగోళిక సందర్భంలో సరిహద్దు రేఖను గుర్తించడం లేదా గీయడం అనే క్రియార్థాన్ని, ఆజ్ఞాత్మక న్యాయశైలితో సహజంగా తెలియజేస్తుంది.
- source_word: הֹר הָ/הָר
  choice: హోరు కొండ
  rationale: అసాధారణమైన హీబ్రూ రూపాన్ని తెలుగులో స్థిరమైన స్థలనామ రూపంగా అందిస్తుంది.
