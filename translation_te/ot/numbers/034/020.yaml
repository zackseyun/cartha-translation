base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: te
  text: 'మరియు షిమ్యోను కుమారుల గోత్రానికి: అమ్మీహూదు కుమారుడు షెమూయేలు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘షెమూయేలు’; సంప్రదాయంగా ‘సమూయేలు’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రానికి
  rationale: ఈ పరిపాలనా జాబితా సందర్భంలో מַטֶּה అక్షరార్థమైన ‘దండం’ కాకుండా గోత్ర సమూహాన్ని సూచిస్తుంది. వావ్‌ను తెలుగు జాబితా శైలిలో ప్రత్యేకంగా ‘మరియు’ అని వ్యక్తం చేయకపోవడం సహజం.
- source_word: בְּנֵי
  choice: కుమారుల
  rationale: నిర్మాణ బహువచనమైన בְּנֵי యొక్క రూపాన్ని నిలుపుతూ, గోత్రపరమైన వంశసమూహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ పేరుకు సమీపంగా ఉండే, తెలుగులో ప్రాచుర్యం పొందిన లిప్యంతరీకరణ.
- source_word: שְׁמוּאֵל
  choice: షెమూయేలు
  rationale: ఈ వచనంలోని హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ; పరిచితమైన ‘సమూయేలు’ రూపం కంటే మూలరూపానికి దగ్గరగా ఉంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ నాయకుల వంశావళి జాబితాలో בֶּן నేరుగా తండ్రి-కొడుకు సంబంధాన్ని సూచిస్తుంది.
- source_word: עַמִּיהוּד
  choice: అమ్మీహూదు
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపాన్ని తెలుగులో దగ్గరగా ప్రతిబింబించే లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అధికారిక జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. పేర్లను హీబ్రూ ధ్వనిరూపాలకు దగ్గరగా లిప్యంతరీకరించాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచాం.
