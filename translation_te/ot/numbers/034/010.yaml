  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: te
  text: మీరు మీకోసం తూర్పు సరిహద్దు రేఖను హజర్-ఏనాను నుండి షెఫాము వరకు గీయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు మీకోసం తూర్పు సరిహద్దును ... వరకు గుర్తించాలి’ లేదా ‘నిర్ణయించాలి.’ ఇక్కడి హీబ్రూ క్రియ అసాధారణమైనది; ఈ సందర్భంలో అది సరిహద్దు రేఖను గీయడం, గుర్తించడం, లేదా రూపురేఖలు నిర్ణయించడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: గుర్తించాలి
  rationale: సరిహద్దులను నిర్ణయించే ఈ భౌగోళిక సందర్భంలో ఈ అసాధారణ క్రియారూపం సరిహద్దు రేఖను గీయడం లేదా గుర్తించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘గుర్తించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: దత్తివాచక సర్వనామంలోని ప్రయోజనార్థక భావాన్ని నిలుపుతుంది; ఈ సరిహద్దు ఇశ్రాయేలీయుల కొరకు నిర్దేశించబడుతోంది.
- source_word: לִגְבוּל קֵדְמָה
  choice: తూర్పు సరిహద్దును
  rationale: גְּבוּל భూభాగపు హద్దును సూచిస్తుంది; קֵדְמָה ఇక్కడ ఆ హద్దు తూర్పు వైపునిదని తెలియజేస్తుంది.
- source_word: מֵחֲצַר עֵינָן
  choice: హజర్-ఏనాను నుండి
  rationale: సరిహద్దు మొదలయ్యే ప్రదేశనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించి, מִן ఉపసర్గను ‘నుండి’గా వ్యక్తపరచాం.
- source_word: שְׁפָמָה
  choice: షెఫాము వరకు
  rationale: దిశాసూచక -ָה ప్రత్యయం షెఫాము వైపుకు అనే భావాన్ని ఇస్తుంది; సరిహద్దు విస్తృతిని సహజ తెలుగులో ‘వరకు’గా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ-భౌగోళిక సందర్భానికి తగిన సరళమైన గౌరవప్రద శైలి వాడబడింది. ప్రదేశనామాలు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; క్రియలోని నిజమైన పదార్థ సందిగ్ధత పాదసూచికలో నిలుపబడింది.
