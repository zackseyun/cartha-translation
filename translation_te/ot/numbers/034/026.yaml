source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי יִשָׂשכָ֖ר נָשִׂ֑יא פַּלְטִיאֵ֖ל בֶּן עַזָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/026.yaml
  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: te
  text: 'ఇశ్శాఖారు కుమారుల గోత్రానికి నాయకుడు: అజ్జాను కుమారుడు పల్తీయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: గోత్రానికి
  rationale: ఈ భూవిభజన జాబితా సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; לְ ను తెలుగు విభక్తి ‘కి’తో సహజంగా వ్యక్తపరిచాం. వాక్యం జాబితాలో కొనసాగుతున్నందున וּ ను విడిగా ‘మరియు’ అని అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: בְנֵי
  choice: కుమారుల
  rationale: ఇది ‘కుమారులు’ అనే పుంలింగ రూపమే; ఇక్కడ ఇశ్శాఖారు వంశీయుల సంప్రదాయ గోత్రనామంలో భాగంగా ఉంది.
- source_word: יִשָׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ వ్యక్తి/గోత్రనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో గోత్రానికి నియమించబడిన ప్రతినిధిని సూచిస్తుంది; ‘అధిపతి’ లేదా ‘రాజకుమారుడు’ కంటే ‘నాయకుడు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: פַּלְטִיאֵל
  choice: పల్తీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: సాధారణ పితృనామ సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַזָּן
  choice: అజ్జాను
  rationale: ద్విత్వ జ్ ధ్వనిని నిలుపుతూ హీబ్రూ వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం; మూలంలోని ఉపపదబంధ నిర్మాణాన్ని ద్విబిందువుతో ప్రతిబింబించాం.
