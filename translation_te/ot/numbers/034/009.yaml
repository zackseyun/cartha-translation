translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దు వర్ణనకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. స్థలనామాలు తెలుగు లిపిలో లిప్యంతరీకరించబడ్డాయి; హెబ్రీ బహువచన అభివ్యక్తిలోని సూక్ష్మత పాదటిప్పణిలో భద్రపరచబడింది.
