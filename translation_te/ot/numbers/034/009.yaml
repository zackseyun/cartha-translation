  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: te
  text: సరిహద్దు సిఫ్రోను వరకు సాగుతుంది; దాని ముగింపు హజర్-ఏనాను వద్ద ఉంటుంది.[a] ఇదే మీ ఉత్తర సరిహద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దాని అంత్యస్థానాలు హజర్-ఏనాను వద్ద ఉంటాయి.” సరిహద్దు ముగింపును సూచించడానికి హెబ్రీలో బహువచన రూపం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא הַגְּבֻל
  choice: సరిహద్దు ... వరకు సాగి
  rationale: సరిహద్దు వర్ణనల్లో יצא అక్షరార్థమైన కదలికకన్నా సరిహద్దు రేఖ సాగే దిశను సూచిస్తుంది; ‘సాగి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: זִפְרֹנָה
  choice: జిఫ్రోను వరకు
  rationale: దిశను సూచించే హెబ్రీ ప్రత్యయం ఆ స్థలంవైపు లేదా ఆ స్థలం వరకు సరిహద్దు సాగడాన్ని తెలియజేస్తుంది; సందర్భంలో ‘వరకు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: దాని చివర ... అవుతుంది
  rationale: תוֹצְאוֹתָיו రూపరీత్యా బహువచనమైనా, సరిహద్దు వర్ణనలో దాని ముగింపు లేదా అంతిమ బిందువును సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ఏకవచన సమానార్థకాన్ని వాడి, రూపంలోని బహువచనాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: חֲצַר עֵינָן
  choice: హజర్-ఏనాను
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం; సమాస స్వరూపాన్ని సూచించేందుకు మధ్యగీత ఉంచాం.
- source_word: זֶה יִהְיֶה לָכֶם גְּבֻל צָפוֹן
  choice: ఇదే మీ ఉత్తర సరిహద్దు
  rationale: వివరించిన రేఖను ఇశ్రాయేలీయుల ఉత్తర సరిహద్దుగా గుర్తించే సంక్షిప్త, సహజ తెలుగు నిర్మాణం.
