id: NUM.28.15
reference: Numbers 28:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְ/חַטָּ֖את לַ/יהוָ֑ה עַל עֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: te
  text: యాహ్వేకు పాపపరిహార బలిగా ఒక మగ మేకను నిత్య దహనబలికీ దాని పానార్పణకీ అదనంగా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ పదమైన חַטָּאת పాపంతోపాటు అపవిత్రతను తొలగించే బలిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేక
  rationale: ఈ నిర్మాణ పదబంధం బలికి ఉపయోగించే మగ మేకను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మగ మేక’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: బలి నిర్దేశంలో పేర్కొన్న సంఖ్యను స్పష్టంగా నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת పాపంతో లేదా అపవిత్రత తొలగింపుతో సంబంధమున్న బలిని సూచిస్తుంది. తెలుగులో సుపరిచితమైన ‘పాపపరిహార బలి’ని ప్రధాన పాఠంలో ఉంచి, ‘శుద్ధీకరణ బలి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించి, బలి సమర్పణ దిశను దత్తివిభక్తితో తెలిపాం.
- source_word: עַל
  choice: అదనంగా
  rationale: ఇక్కడ עַל స్థలార్థంలో కాక, నియమిత బలితోపాటు అదనంగా సమర్పించడాన్ని సూచిస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: నిత్య దహనబలి
  rationale: తరచుగా, నియమితంగా కొనసాగించే బలిని תָּמִיד సూచిస్తుంది; ‘నిత్య దహనబలి’ ఆ ఆచారపరమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יֵעָשֶׂה
  choice: అర్పించాలి
  rationale: అక్షరార్థంగా ‘చేయబడాలి’ అయినా, బలి సందర్భంలో సహజమైన తెలుగు క్రియ ‘అర్పించాలి’.
- source_word: וְנִסְכּוֹ
  choice: దానితోపాటు అర్పించే పానార్పణ
  rationale: సర్వనామం నిత్య దహనబలికి సంబంధించిన పానార్పణను సూచిస్తుంది; తెలుగులో సంబంధాన్ని అపార్థం లేకుండా స్పష్టం చేశాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వినిపించే వ్యక్తినామ రూపంతో నిలిపాం.
- issue: חַטָּאת బలి పదం యొక్క భావం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: సాంప్రదాయికంగా, సాధారణ పాఠకులకు అర్థమయ్యే రూపాన్ని ప్రధాన పాఠంలో ఉంచాం; అయితే ఈ పదానికి అపవిత్రత తొలగింపును ప్రధానంగా చూపే భావం కూడా ఉన్నందున దానిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, పానార్పణ ఏ బలికి సంబంధించినదో స్పష్టంగా తెలిపాం; మూలంలోని క్రమం మరియు బలి సంబంధం మాత్రం నిలుపుకున్నాం.
