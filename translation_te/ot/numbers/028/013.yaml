  revision_rationale: 'The revision restores the source order and sense: the prescribed item is a tenth of an ephah of fine flour, mixed with oil, for each lamb. It also uses a clear modern Telugu rendering for the fire-related sacrificial term while preserving the audit-trail alternative in the footnote. The supplied Telugu verbs make the Hebrew dependent prescription readable as a standalone verse without adding a material requirement.'
