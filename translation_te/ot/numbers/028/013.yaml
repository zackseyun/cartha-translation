id: NUM.28.13
reference: Numbers 28:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: te
  text: ప్రతి గొర్రెపిల్లకు నూనె కలిపిన సన్నని పిండి ఏఫాలో పదోవంతును ధాన్యార్పణగా అర్పించాలి. యెహోవాకు ఇంపైన సువాసనగల దహనబలిగా, అగ్ని ద్వారా అర్పించే బలిగా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహార అర్పణ.”
    reason: אִשֶּׁה అనే హీబ్రూ బలి పదానికి సందర్భానుసారం సాధ్యమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: ఏఫాలో పదోవంతును
  rationale: ద్విరుక్త నిర్మాణం ప్రతి గొర్రెపిల్లకు వర్తించే పదోవంతు కొలతను సూచిస్తుంది; సందర్భానుసారం అది ఏఫాలో పదోవంతు. తెలుగు పాఠకులకు కొలత స్పష్టంగా ఉండేందుకు ‘ఏఫాలో’ అని చేర్చబడింది.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: బలుల సందర్భంలో బాగా శుద్ధి చేసిన మెత్తని పిండిని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: ఇక్కడ సాధారణ కానుక కాక, ధాన్యంతో చేసే నిర్దిష్ట బలిని సూచిస్తుంది.
- source_word: בְּלוּלָה בַּשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: పిండిని నూనెతో కలిపిన స్థితిని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: హీబ్రూ పదబంధంలోని పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే బలికి తెలుగు బైబిలు శైలిలో స్పష్టమైన సాంకేతిక పదం.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసననిచ్చే
  rationale: దేవునికి అంగీకారమైన బలి అనే ఆరాధనా భావాన్ని కాపాడుతూ మూలంలోని సువాసన రూపకాన్ని నిలుపుతుంది.
- source_word: אִשֶּׁה
  choice: అగ్న్యర్పణ
  rationale: అగ్నితో అర్పించే బలి అనే పదంలోని స్పష్టమైన అగ్ని-సంబంధ భావాన్ని కాపాడుతుంది; ‘ఆహార అర్పణ’ అనే సందర్భోచిత ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దేవుని నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచబడింది; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా తెలిసిన రూపం ‘యెహోవా’.
- issue: אִשֶּׁה అనే బలి పదం
  choice: అగ్న్యర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదానికి అగ్నితో అర్పించే బలి అనే ప్రత్యక్ష భావం ఉంది; ఆరాధనా సందర్భంలో ‘ఆహార అర్పణ’ అనే అర్థవ్యాఖ్య కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా సందర్భానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూల వాక్యం ముందరి వచనంతో వ్యాకరణపరంగా కొనసాగుతున్నప్పటికీ, తెలుగు వచనం స్వతంత్రంగా చదవడానికి అవసరమైన ‘అర్పించాలి’ అనే క్రియను సందర్భం నుంచి పూరించాం.
