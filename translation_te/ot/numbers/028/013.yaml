revisions:
- from: ఒక్కొక్క గొర్రెపిల్లకు నూనె కలిపిన సన్నని పిండిలో ఏఫాలో పదోవంతును ధాన్యార్పణగా అర్పించాలి. అది యెహోవాకు ఇంపైన సువాసననిచ్చే దహనబలి, అగ్న్యర్పణ[a].
  to: ప్రతి గొర్రెపిల్లకు నూనె కలిపిన సన్నని పిండి ఏఫాలో పదోవంతును ధాన్యార్పణగా అర్పించాలి. యెహోవాకు ఇంపైన సువాసనగల దహనబలిగా, అగ్ని ద్వారా అర్పించే బలిగా అర్పించాలి.[a]
  rationale: 'The revision restores the source order and sense: the prescribed item is a tenth of an ephah of fine flour, mixed with oil, for each lamb. It also uses a clear modern Telugu rendering for the fire-related sacrificial term while preserving the audit-trail alternative in the footnote. The supplied Telugu verbs make the Hebrew dependent prescription readable as a standalone verse without adding a material requirement.'
