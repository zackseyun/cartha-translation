language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: te
  text: 'వాటి పానార్పణలు ఇలా ఉండాలి: ఎద్దుకు అర హీను, పొట్టేలుకు హీనులో మూడవ వంతు, గొర్రెపిల్లకు హీనులో నాలుగవ వంతు ద్రాక్షామద్యం. ఇది సంవత్సరంలోని ప్రతి నెలలో అర్పించాల్సిన నెలవారీ దహనబలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది సంవత్సరంలోని నెలలన్నిటికీ, దాని నెలలో అర్పించాల్సిన నెలారంభ దహనబలి.” హీబ్రూ పదం חֹדֶשׁ ‘నెల’ను గానీ ‘నెలారంభం/కొత్త నెల’ను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: వాటి పానార్పణలు
  rationale: బలులతో పాటు పోసి అర్పించే ద్రవార్పణలను సూచించే నֶסֶךְకు ఆధునిక తెలుగు బైబిలు సందర్భంలో సహజమైన పదం ‘పానార్పణలు’.
- source_word: חֲצִי הַהִין
  choice: అర హీను
  rationale: ప్రాచీన కొలమానాన్ని మార్చకుండా ఉంచుతూ, భిన్నాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: לַפָּר
  choice: ఎద్దుకు
  rationale: నిర్దిష్ట బలిపశువును సూచించే ఏకవచన రూపాన్ని సంక్షిప్తంగా నిలిపింది.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: హీనులో మూడవ వంతు
  rationale: మూలంలోని భిన్న పరిమాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: לָאַיִל
  choice: పొట్టేలుకు
  rationale: אַיִל అనే మగ గొర్రెను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּרְבִיעִת הַהִין
  choice: హీనులో నాలుగవ వంతు
  rationale: మూలంలోని నాలుగో వంతు పరిమాణాన్ని యథార్థంగా నిలిపింది.
- source_word: לַכֶּבֶשׂ
  choice: గొర్రెపిల్లకు
  rationale: బలిగా అర్పించే చిన్న గొర్రెను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: יָיִן
  choice: ద్రాక్షారసం
  rationale: పానార్పణ పదార్థాన్ని తెలుగులో స్పష్టంగా గుర్తిస్తుంది; జాబితా అంతటికీ ఇది వర్తించేలా వాక్య నిర్మాణంలో ఉంచబడింది.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: ఇది ... నెలవారీ దహనబలి
  rationale: חֹדֶשׁకు ‘నెల’ లేదా ‘అమావాస్య/నెలారంభం’ అనే అర్థాలు ఉండగలవు. ప్రధాన పాఠంలో పునరావృత నెలవారీ భావాన్ని సహజంగా అందించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: సంవత్సరంలోని ప్రతి నెలలో అర్పించాల్సిన
  rationale: ‘దాని నెలలో, సంవత్సరపు నెలల కోసం’ అనే మూల భావంలోని పంపిణీ మరియు వార్షిక పునరావృతిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలుల సంబంధిత పదజాలంలో గౌరవప్రదమైన బైబిలు శైలిని ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా తీర్చిదిద్దింది. ‘హీను’ అనే ప్రాచీన కొలమానాన్ని మూల పారదర్శకత కోసం అలాగే ఉంచింది.
