revisions:
- from: రెండవ గొర్రెపిల్లను సంధ్యవేళలో[a] అర్పించాలి. ఉదయపు ధాన్యార్పణలాగే, దానితోపాటు అర్పించే పానార్పణతో సహా దానిని యెహోవాకు ఇంపైన సువాసన కలిగించే అగ్ని అర్పణగా[b] అర్పించాలి.
