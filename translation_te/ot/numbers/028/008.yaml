  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: te
  text: రెండవ గొర్రెపిల్లను రెండు సాయంకాలాల మధ్యలో[a] అర్పించాలి. ఉదయపు ధాన్యార్పణను, దాని పానార్పణను చేసినట్లే దానిని చేయాలి. అది యెహోవాకు ఇంపైన సువాసనగా ఉండే అగ్ని అర్పణ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః: ‘రెండు సాయంకాలాల మధ్య’; సాధారణంగా ‘సంధ్యవేళలో’ అని అర్థం చేసుకుంటారు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆహార అర్పణ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: రెండవ గొర్రెపిల్ల
  rationale: బలి సందర్భంలో כֶּבֶשׂ చిన్న గొర్రెను సూచిస్తుంది; הַשֵּׁנִי ఉదయపు మొదటి అర్పణ తరువాతి క్రమాన్ని తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: అర్పించాలి
  rationale: పదశః ‘చేయాలి’ అయినా, బలి ఆదేశ సందర్భంలో సహజమైన తెలుగు ‘అర్పించాలి’.
- source_word: בֵּין הָעַרְבָּיִם
  choice: సంధ్యవేళలో
  rationale: ‘రెండు సాయంకాలాల మధ్య’ అనే హీబ్రూ కాలసూచక నుడికారానికి సహజమైన తెలుగు; దాని పదశః రూపం, అర్థసందిగ్ధత పాదటీపులో నిలుపబడ్డాయి.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: ఉదయపు ధాన్యార్పణలాగే
  rationale: యాజక బలి సందర్భంలో מִנְחָה సాధారణ కానుక కాక ధాన్యార్పణను సూచిస్తుంది.
- source_word: וּכְנִסְכּוֹ
  choice: దానితోపాటు అర్పించే పానార్పణతో సహా
  rationale: נֶסֶךְ పోసి అర్పించే అనుబంధ అర్పణ; ‘పానార్పణ’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: אִשֵּׁה
  choice: అగ్ని అర్పణగా
  rationale: ఈ పదంలో అగ్నిచేత అర్పించే భావం ప్రత్యక్షంగా ఉంది; అస్పష్టమైన ‘ఆహార అర్పణ’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: బలి సూత్రవాక్యంలోని సువాసన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుగా కాక పేరుగా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో అందించింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగానే ఉంచి, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: בֵּין הָעַרְבָּיִם కాలనుడికారం
  choice: సంధ్యవేళలో
  alternative: రెండు సాయంకాలాల మధ్య
  rationale: ప్రధాన పాఠ్యంలో సహజమైన కాలసూచనను ఇచ్చి, ఖచ్చితమైన సమయంపై ఉన్న సందిగ్ధతను పదశః రూపంతో పాదటీపులో భద్రపరిచాం.
- issue: אִשֵּׁה యొక్క అర్థం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: మూలపదంలోని అగ్ని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; మరో సందర్భోచిత అర్థాన్ని పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలి సంబంధ పదజాలంలో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఆదేశాత్మక ఏకవచనాన్ని తెలుగులో సహజమైన ‘అర్పించాలి’ రూపంతో వ్యక్తపరిచాం.
