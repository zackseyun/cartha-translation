source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: te
  text: నిత్య దహనబలికీ దాని ధాన్యార్పణానికీ అదనంగా వీటిని అర్పించాలి. అవి లోపంలేనివిగా ఉండాలి; వాటి పానార్పణలను కూడా అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: తో పాటు
  rationale: ఇక్కడ సూచించిన అర్పణలు నిత్య దహనబలికి అదనంగా అర్పించాల్సినవని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: నిత్య దహనబలి
  rationale: תָּמִיד సూచించే క్రమంగా, నిరంతరం అర్పించే బలిని సంక్షిప్తంగా వ్యక్తపరుస్తుంది; సందర్భంలో ఇది రోజువారీ దహనబలి.
- source_word: וּמִנְחָתוֹ
  choice: దాని ధాన్యార్పణం
  rationale: యాజక సంబంధ బలి సందర్భంలో מִנְחָה దహనబలితో కూడిన ధాన్యార్పణను సూచిస్తుంది.
- source_word: תַּעֲשׂוּ
  choice: అర్పించాలి
  rationale: బలుల సందర్భంలో עשה వాటిని సిద్ధం చేసి సమర్పించడాన్ని సూచిస్తుంది; తెలుగులో ‘అర్పించాలి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: תְּמִימִם
  choice: లోపంలేనివి
  rationale: బలికి తెచ్చే జంతువులు శారీరక దోషం లేకుండా ఉండాలనే ఆచార సంబంధ అర్థాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: יִהְיוּ לָכֶם
  choice: అవి లోపంలేనివిగా ఉండాలి
  rationale: లָכֶםలోని బాధ్యతార్థక దాతువును ప్రత్యేకంగా ‘మీకు’ అని అసహజంగా అనువదించకుండా, ఆజ్ఞారూప భావంలో తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְנִסְכֵּיהֶם
  choice: వాటి పానార్పణలు
  rationale: נֶסֶךְ అనేది పోసి అర్పించే ద్రవార్పణను సూచిస్తుంది; ‘పానార్పణ’ సాధారణ పాఠకుడికి అర్థమయ్యే బైబిలు సంబంధ పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞాశైలిని వాడాం. హీబ్రూ వాక్యంలోని బహువచన సూచనను ‘వీటిని/అవి/వాటి’ ద్వారా నిలిపాం. పదశః ‘మీకు’ అని చేర్చడం తెలుగులో అసహజంగా ఉండటంతో, יִהְיוּ לָכֶם యొక్క బాధ్యతార్థాన్ని ‘ఉండాలి’లో వ్యక్తపరచాం.
