translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల నియమానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని విభజనార్థక పునరుక్తిని సహజంగా తెలియజేయడానికి ‘ఒక్కొక్క… చొప్పున’ వాడబడింది; మూలంలో లేని ‘ఏఫాలో పదవ వంతు’ ప్రధాన పాఠ్యంలో సరఫరా చేయలేదు.
