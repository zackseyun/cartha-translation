translation:
  language: te
  text: ఆ ఏడు గొర్రెపిల్లలలో ఒక్కోదానికి పదవ వంతు చొప్పున[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పదవ వంతు, పదవ వంతు—ఆ ఒక్క గొర్రెపిల్లకు, ఆ ఏడు గొర్రెపిల్లలకు.” హెబ్రీ పునరుక్తి ప్రతి గొర్రెపిల్లకు ఒక్క పదవ వంతు చొప్పున ఇవ్వాలని సూచిస్తుంది. సందర్భంలో ఇది ధాన్యార్పణ పరిమాణం; ఈ వచనంలో ‘ఏఫా’ అనే కొలతపేరు స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: పదవ వంతు చొప్పున
  rationale: పునరుక్త ఏకవచన రూపం ‘పదవ వంతు, పదవ వంతు’ ఇక్కడ విభజనార్థక ప్రయోగం; ప్రతి గొర్రెపిల్లకు ఒక పదవ వంతు అనే భావాన్ని సహజమైన తెలుగులో ‘చొప్పున’ తెలియజేస్తుంది. ఈ వచనంలో ‘ఏఫా’ స్పష్టంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: అక్షరార్థంగా ‘ఆ ఒక్క గొర్రెపిల్లకు’; బలుల నియమంలోని విభజనార్థక సందర్భంలో ప్రతి జంతువుకూ ఆ పరిమాణం వర్తిస్తుందని ‘ఒక్కొక్క’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ఆ ఏడు గొర్రెపిల్లల్లో
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ‘ఆ ఏడు గొర్రెపిల్లలు’ అనే సమూహాన్ని నిలుపుతూ, వాటిలో ప్రతి దానికి పరిమాణం వర్తిస్తుందనే సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
