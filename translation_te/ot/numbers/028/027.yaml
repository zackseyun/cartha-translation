  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: te
  text: యెహోవాకు ఇంపైన సువాసనగా[a] పశువుల మందలోని రెండు ఎద్దులను, ఒక పొట్టేలును, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలను దహనబలిగా అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహ్లాదకరమైన సువాసనగా.” హీబ్రూ బలివిధాన పదబంధాన్ని “ఇంపైన సువాసనగా” లేదా “ఆహ్లాదకరమైన సువాసనగా” అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: అర్పించాలి
  rationale: హిఫీల్ రూపంలోని קרב బలుల సందర్భంలో ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే భావంతో ‘అర్పించాలి’ అని సహజంగా అనువదించబడింది.
- source_word: עוֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా దహించబడే బలిని సూచించే స్థిరమైన బలివిధాన పదం.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: బలి యెహోవాకు ఆమోదకరంగా ఉండడాన్ని తెలిపే హీబ్రూ బలివిధాన సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘శాంతినిచ్చే సువాసనగా’ అనే ప్రత్యామ్నాయ భావాన్ని అడుగుసూచనలో ఉంచింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామం יהוהను సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపింది.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: మందలోనివైన రెండు ఎద్దులను
  rationale: బోవైన్ మందకు చెందిన రెండు మగ పశువులను సూచిస్తుంది; మూలంలో స్పష్టంగా లేని చిన్న వయస్సును చేర్చలేదు.
- source_word: אַיִל אֶחָד
  choice: ఒక పొట్టేలును
  rationale: బలికి ఉద్దేశించిన ప్రాయపూర్తి మగ గొర్రెను తెలిపే సహజ తెలుగు పదం.
- source_word: שִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలను
  rationale: సంఖ్య, మగ లింగం, ఒక్క సంవత్సరం వయస్సు అనే మూడు వివరాలనూ స్పష్టంగా నిలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంలో ఉంచింది; ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: לְרֵיחַ נִיחֹחַ యొక్క బలివిధాన భావం
  choice: ఇంపైన సువాసనగా
  alternative: శాంతినిచ్చే సువాసనగా
  rationale: దేవునికి బలి ఆమోదకరమనే భావాన్ని వ్యక్తం చేస్తూనే, ఈ పదబంధాన్ని కేవలం వాసనకు సంబంధించిన మానవాకార చిత్రణగా పరిమితం చేయదు; పదబంధంలోని ప్రత్యామ్నాయ ఛాయను అడుగుసూచనలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. బలివిధానానికి స్థిరమైన ‘దహనబలి’, ‘అర్పించాలి’ పదాలను ఎంచుకుంది. సంఖ్యాకాండము 28లోని ఆజ్ఞాత్మక సందర్భానికి అనుగుణంగా తెలుగు విధ్యర్థక రూపాన్ని ఉపయోగించింది; పునరుక్త ‘అర్పించాలి’ జాబితా ముగింపును స్పష్టపరుస్తుంది.
