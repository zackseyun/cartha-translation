revisions:
- from: 'మీరు యాహ్వేకు అగ్నిబలిగా[a] దహనబలిని సమర్పించాలి: రెండు ఎద్దులు, ఒక పొట్టేలు, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలు. మీరు అర్పించే ఇవన్నీ ఏ లోపమూ లేనివిగా ఉండాలి.'
  to: 'మీరు యాహ్వేకు అగ్నిలో అర్పించే దహనబలిని[a] సమర్పించాలి: మందలోని రెండు ఎద్దులు, ఒక పొట్టేలు, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలు. అవి మీ కొరకు నిర్దోషమైనవిగా ఉండాలి.'
  rationale: The revision retains the Hebrew sacrificial terminology and apposition while making the primary Telugu expression clearer. It restores the herd classification and renders the final requirement more closely, without importing an additional relative clause or changing the passage’s meaning.
