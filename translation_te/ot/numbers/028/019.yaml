id: NUM.28.19
reference: Numbers 28:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: te
  text: 'మీరు యాహ్వేకు అగ్నిలో అర్పించే దహనబలిని[a] సమర్పించాలి: మందలోని రెండు ఎద్దులు, ఒక పొట్టేలు, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలు. అవి మీ కొరకు నిర్దోషమైనవిగా ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగ్నిబలి.’ హీబ్రూ పదం అగ్నితో సంబంధమున్న బలి అర్పణకు వాడే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: మీరు ... సమర్పించాలి
  rationale: హిఫీల్ రూపం బలి సందర్భంలో ‘దగ్గరకు తీసుకురావడం’ నుంచి ‘బలిగా సమర్పించడం’ అనే అర్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘సమర్పించాలి’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: אִשֶּׁה
  choice: అగ్నిబలిగా[a]
  rationale: ఇది అగ్నిపై అర్పించబడే బలికి వాడే సాంకేతిక పదం. ‘అగ్నిబలి’ మూలంలోని అగ్ని సంబంధాన్ని నిలుపుతుంది; పదార్థంపై ఉన్న స్వల్ప అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
- source_word: עֹלָה
  choice: దహనబలిని
  rationale: బలిపీఠంపై పూర్తిగా దహించబడే బలిని సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; לְ సమర్పణ ఎవరికి చేయబడుతుందో సూచిస్తుంది.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: రెండు ఎద్దులు
  rationale: హీబ్రూ జాతి-వర్గీకరణ నుడికారాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘ఎద్దులు’ సరిపోతుంది; మూలంలో స్పష్టంగా లేని ప్రత్యేక వయస్సును చేర్చలేదు.
- source_word: וְאַיִל אֶחָד
  choice: ఒక పొట్టేలు
  rationale: బలి జాబితాలో אַיִל అనే మగ గొర్రెకు సహజమైన తెలుగు సమానం.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలు
  rationale: כְבָשִׂים యొక్క మగ లింగాన్ని, בְּנֵי שָׁנָה అనే ఒక సంవత్సరం వయస్సు నుడికారాన్ని రెండింటినీ స్పష్టంగా నిలిపింది.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: మీరు అర్పించే ఇవన్నీ ఏ లోపమూ లేనివిగా ఉండాలి
  rationale: బలి జంతువులకు శారీరక దోషం ఉండకూడదనే సందర్భార్థాన్ని ఇస్తుంది. לָכֶם లోని ఇశ్రాయేలీయుల బాధ్యత భావాన్ని ‘మీరు అర్పించే’ ద్వారా సహజ తెలుగులో నిలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా ఆమోదయోగ్యమైన ‘యాహ్వే’ రూపంలో ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: אִשֶּׁה మరియు עֹלָה మధ్య సంబంధం
  choice: అగ్నిబలిగా దహనబలిని
  alternative: ఆహార అర్పణను, దహనబలిని
  rationale: עֹלָה ఇక్కడ అగ్నిపై అర్పించే బలి ఏ రకమో వివరిస్తుంది. రెండు వేర్వేరు బలులుగా అపార్థం కాకుండా, అదే దహనబలిని ‘అగ్నిబలిగా’ సమర్పించాలని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలి సంబంధిత గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడింది. జాబితాను రెండు వాక్యాలుగా విభజించి పఠనసౌలభ్యాన్ని పెంచింది; మూలంలోని ఆజ్ఞార్థక బాధ్యతను ‘సమర్పించాలి,’ ‘ఉండాలి’ రూపాలతో నిలిపింది.
