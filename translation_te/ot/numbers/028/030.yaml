source:
  edition: WLC
  text: שְׂעִ֥יר עִזִּ֖ים אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/030.yaml
  text: and one male goat to make atonement for you[a].
translation:
  language: te
  text: మీ కోసం ప్రాయశ్చిత్తం చేయడానికి ఒక మగ మేకను కూడా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో వాక్యం సంక్షిప్తంగా, ‘మీ కోసం ప్రాయశ్చిత్తం చేయడానికి ఒక మగ మేక’ అని ఉంది. సమీప బలి సందర్భాన్ని బట్టి ఈ మేక పాపపరిహార బలితో సంబంధమున్నదిగా అర్థమవుతుంది; అయితే ఆ బలి వర్గనామం ఈ వచనంలో స్పష్టంగా లేదు.
    reason: contextual_clarification
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: బలి సందర్భంలో ఈ సంయుక్త పదబంధం మగ మేకను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మగ మేకపోతు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: ఒక్క జంతువును సూచించే సాధారణ సంఖ్యావాచకం.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజక బలుల సందర్భంలో כפר ప్రాయశ్చిత్తం చేయడాన్ని సూచిస్తుంది; దాని సిద్ధాంతపరమైన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఆ ఆచారార్థాన్ని నిలుపుతుంది.
- source_word: עֲלֵיכֶם
  choice: మీ కోసం
  rationale: כפר తో వచ్చిన עַל, ఎవరి పక్షాన లేదా ఎవరి ప్రయోజనం కోసం ప్రాయశ్చిత్తం చేయబడుతుందో సూచిస్తుంది.
- source_word: '[implied verbal action]'
  choice: అర్పించాలి
  rationale: హీబ్రూ వాక్యం బలుల జాబితాలోని సంక్షిప్త నిర్మాణం; తెలుగులో పూర్తి, సహజ వాక్యంగా ఉండేందుకు సందర్భం నుండి అర్పణ క్రియను పూరించాం.
theological_decisions:
- issue: హీబ్రూలో స్పష్టంగా లేని బలి వర్గాన్ని (‘పాపపరిహార బలి’) వాక్యంలో చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో చేర్చలేదు
  alternative: ‘పాపపరిహార బలిగా ఒక మగ మేకపోతును’ అని సందర్భం ఆధారంగా పూరించడం
  rationale: మూల వచనంలో ‘పాపపరిహార బలి’ అనే పదం లేదు. సమీప బలి సందర్భం ఆ విధిని సూచించినా, మూలంలోని సంక్షిప్తతను మరియు నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బైబిల్ శైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ, తెలుగులో వాక్య సంపూర్ణత కోసం ‘అర్పించాలి’ని సందర్భానుసారంగా చేర్చాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
