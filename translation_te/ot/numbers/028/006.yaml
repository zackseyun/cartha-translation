source:
  edition: WLC
  text: עֹלַ֖ת תָּמִ֑יד הָ/עֲשֻׂיָה֙ בְּ/הַ֣ר סִינַ֔י לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: te
  text: ఇది సీనాయి పర్వతం వద్ద చేయబడిన[c] క్రమమైన దహనబలి[a]—యాహ్వేకు ఇంపైన సువాసన కోసం అగ్ని అర్పణ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిరంతర దహనబలి.’
    reason: lexical_alternative
  - marker: b
    text: ‘అగ్ని అర్పణ’ అనే హీబ్రూ పదాన్ని కొందరు ‘ఆహార అర్పణ’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘సీనాయి పర్వతం వద్ద అర్పించబడినది’ లేదా ‘సీనాయి పర్వతం వద్ద నియమించబడినది.’ హీబ్రూ పదానికి పదశః అర్థం ‘చేయబడినది.’
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: నిత్య దహనబలి
  rationale: עֹלָה అనేది పూర్తిగా దహనం చేసే బలికి స్థిరమైన పదం; תָּמִיד ఇక్కడ క్రమంగా కొనసాగుతూ అర్పించే బలిని సూచిస్తుంది. ‘నిత్య దహనబలి’ సహజమైన, సంక్షిప్తమైన ఆచారపర పదబంధం.
- source_word: הָעֲשֻׂיָה
  choice: అర్పించబడిన
  rationale: పదశః ‘చేయబడినది’ అయినప్పటికీ, బలి సందర్భంలో ‘అర్పించబడిన’ అనేది సహజంగా ఉంటుంది; సీనాయిలో కేవలం నియమించబడిందని అర్థాన్ని పాఠ్యంలోనే నిర్బంధించకుండా మూలంలోని సాధారణ కృదంత భావాన్ని నిలుపుతుంది.
- source_word: בְּהַר סִינַי
  choice: సీనాయి కొండ దగ్గర
  rationale: בְּ ఉపసర్గానికి ఈ సందర్భంలో స్థలార్థం ఉంది. ‘దగ్గర’ అనేది సీనాయి పర్వత ప్రాంతాన్ని సహజ తెలుగులో సూచిస్తుంది; ‘మీద’ అని చెప్పి శిఖరానికే పరిమితం చేయదు.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా ఉండే
  rationale: బలి దేవునికి ఆమోదకరంగా ఉండటాన్ని తెలిపే ఆచారపర రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘శాంతింపజేసే’ అనే సాధ్యమైన భావాన్ని పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: אִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: ఈ అరుదైన యాజక పదానికి సంప్రదాయంగా అగ్నితో సమర్పించే అర్పణ అనే భావం ఉంది. ‘ఆహార అర్పణ’ అనే వివాదాస్పద వ్యుత్పత్తిని ప్రధాన పాఠ్యంలో ఎంచుకోకుండా అగ్ని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దేవుని ఒడంబడిక నామమైన יהוהను వ్యక్తినామంగా లిప్యంతరీకరించి, לְ యొక్క దిశార్థాన్ని ‘కు’తో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగులో గుర్తించదగిన రూపంలో ఉంచాం.
- issue: רֵיחַ נִיחֹחַ అనే బలి సంబంధిత నుడికారం
  choice: ఇంపైన సువాసన
  alternative: శాంతింపజేసే సువాసన; మధుర సువాసన
  rationale: దైవిక ఆమోదాన్ని సూచించే రూపకాన్ని నిలుపుతూ, బలి యాంత్రికంగా దేవుణ్ణి శాంతింపజేస్తుందనే సిద్ధాంతాన్ని అనవసరంగా దిగుమతి చేయదు.
- issue: הָעֲשֻׂיָה בְּהַר סִינַי యొక్క భావం
  choice: సీనాయి కొండ దగ్గర అర్పించబడిన
  alternative: సీనాయి కొండ దగ్గర నియమించబడిన; సీనాయి కొండ దగ్గర చేయబడిన
  rationale: హీబ్రూ కృదంతం ‘చేయబడినది’ అనే విస్తృత భావాన్ని కలిగి ఉంది. సందర్భానుసారంగా ‘అర్పించబడిన’ సహజమైనదే గాని, ‘అక్కడ నియమించబడిన’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ఖచ్చితీకరించలేదు; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: אִשֶּׁה యొక్క అర్థం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదం యొక్క వ్యుత్పత్తి, ఖచ్చితమైన పరిధి చర్చనీయమైనవి. బలి సందర్భంలోని అగ్ని సంబంధాన్ని తెలిపే సంప్రదాయ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరొక సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే బలి సంబంధిత గంభీరతను నిలుపుతూ ‘దహనబలి’, ‘అర్పణ’ వంటి స్థిర పదాలను వాడాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
