- from: 'ఇశ్రాయేలు ప్రజలకు[a] ఆజ్ఞాపించి, వారితో ఇలా చెప్పు: ‘నా అర్పణను—అగ్నిలో అర్పించే నా అర్పణల కోసం ఉద్దేశించిన నా ఆహారాన్ని, నాకు ఇంపైన సువాసనను[b]—దాని నియమిత సమయంలో నాకు అర్పించడానికి జాగ్రత్తపడండి.’'
  to: 'ఇశ్రాయేలు ప్రజలకు[a] ఆజ్ఞాపించు; వారితో ఇలా చెప్పు: ‘నా అర్పణను—నా అగ్నిలో అర్పించే అర్పణల కొరకు నా ఆహారమైనదాన్ని, నాకు ఇంపైన సువాసనైనదాన్ని—దాని నియమిత సమయంలో నాకు అర్పించడానికి మీరు జాగ్రత్తగా ఉండాలి.’'
  rationale: మూలంలోని ఆజ్ఞారూపాలను స్పష్టం చేసి, కָרְבָּנִי, לַחְמִי, לְאִשַּׁי, רֵיחַ נִיחֹחִי అనే సమానాధికార బలివర్ణనలను తెలుగులో మరింత స్పష్టంగా, సహజంగా అమర్చాం. దేవునికి ‘ఆహారం’ మరియు ‘సువాసన’ అనే మూలంలోని స్పష్టమైన బలిభాషను సిద్ధాంతపరమైన భావానువాదంతో మార్చలేదు. పాదసూచిక గుర్తు b ప్రధాన పాఠ్యంలో ‘సువాసన’కు జతచేయాలి.
