source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: te
  text: 'ఇశ్రాయేలు ప్రజలకు[a] ఆజ్ఞాపించు; వారితో ఇలా చెప్పు: ‘నా అర్పణను—నా అగ్నిలో అర్పించే అర్పణల కొరకు నా ఆహారమైనదాన్ని, నాకు ఇంపైన సువాసనైనదాన్ని—దాని నియమిత సమయంలో నాకు అర్పించడానికి మీరు జాగ్రత్తగా ఉండాలి.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘ఇశ్రాయేలు కుమారులకు’; భావం, ‘ఇశ్రాయేలీయులకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించి
  rationale: ఈ ఆజ్ఞ మోషేకు ఇవ్వబడిన బలమైన నిర్దేశం. ‘బోధించు’ కంటే ‘ఆజ్ఞాపించు’ మూలంలోని బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులు’; సందర్భంలో ఇది నిబంధన సమాజమైన ఇశ్రాయేలీయులందరినీ సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, సమగ్రంగా అర్థమవుతుంది; పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: קָרְבָּנִי
  choice: నా అర్పణను
  rationale: దేవుని సన్నిధికి తీసుకువచ్చే అర్పణకు వాడే సాధారణ బలిసంబంధ పదం; ‘అర్పణ’ స్పష్టమైన, ప్రస్తుత తెలుగు సమానార్థకం.
- source_word: לַחְמִי
  choice: నా ఆహారాన్ని
  rationale: పదశః ‘నా రొట్టె’; బలుల సందర్భంలో ఇది కేవలం రొట్టెను కాక, బలిపీఠంపై సమర్పించే ఆహారాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: לְאִשַּׁי
  choice: అగ్నిలో అర్పించే నా అర్పణల కోసం ఉద్దేశించిన
  rationale: אִשֶּׁה బలిపీఠంపై అగ్నితో సంబంధమున్న బలి అర్పణను సూచిస్తుంది. ‘దహనబలి’ అని అనువదిస్తే ఒక ప్రత్యేక బలివర్గంతో పొరబడే అవకాశం ఉంది; అందువల్ల వివరణాత్మకమైన ఈ రూపం ఎంచుకున్నాం.
- source_word: רֵיחַ נִיחֹחִי
  choice: నాకు ఇంపైన సువాసనను
  rationale: దేవునికి ఆమోదయోగ్యమైన బలిని తెలిపే స్థిరమైన బలిసంబంధ వ్యక్తీకరణ. మూలంలోని స్పష్టమైన ఇంద్రియాత్మక భాషను నిలుపుతుంది.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב לִי
  choice: నాకు అర్పించడానికి జాగ్రత్తపడండి
  rationale: שמר తో కూడిన క్రియారూపం కేవలం చర్యను కాక, దానిని శ్రద్ధగా పాటించడాన్ని సూచిస్తుంది.
- source_word: בְּמוֹעֲדוֹ
  choice: దాని నియమిత సమయంలో
  rationale: ముందున్న అర్పణకు సంబంధించిన నిర్ణీత సమయాన్ని ఏకవచన ప్రత్యయం సూచిస్తుంది.
theological_decisions:
- issue: ‘నా ఆహారం,’ ‘నాకు ఇంపైన సువాసన’ అనే మానవరూప బలిభాష
  choice: మూలంలోని స్పష్టమైన బలిసంబంధ రూపక భాషను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నాకు ఆమోదయోగ్యమైన అర్పణలు’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం ఆహారం, సువాసన అనే స్పష్టమైన బలిభాషను ఉద్దేశపూర్వకంగా వాడుతుంది. దాన్ని సిద్ధాంతపరమైన అమూర్త పదబంధంగా మార్చకుండా, బలి ఆమోదాన్ని సూచించే సంప్రదాయ వ్యక్తీకరణగా పాదసూచికలో వివరిస్తున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే పురుషలింగ సమూహపదం
  choice: ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు ప్రజలు’; పదశః రూపం పాదసూచికలో
  alternative: ‘ఇశ్రాయేలు కుమారులు’
  rationale: ఈ సందర్భంలో ఆజ్ఞ నిబంధన సమాజమంతటికీ సంబంధించినది. తెలుగులో ‘కుమారులు’ కేవలం పురుషులను మాత్రమే సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు; ‘ప్రజలు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది, కాగా మూలరూపం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూలోని సమానాధికార నామపదాల వరుసను డాష్‌లతో స్పష్టంచేశాం. ‘దహనబలి’ అనే సాంకేతిక పదం ఒక ప్రత్యేక బలివర్గాన్ని సూచించగలదని, אִשֶּׁה కోసం ‘అగ్నిలో అర్పించే అర్పణలు’ అనే విస్తృత రూపాన్ని ఎంచుకున్నాం.
