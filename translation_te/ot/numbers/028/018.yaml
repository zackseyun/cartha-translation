translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. ‘జరగాలి’ అనేది నామవాక్యమైన హీబ్రూ ఆజ్ఞార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
