  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/018.yaml
  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: te
  text: మొదటి రోజున పవిత్ర సమావేశం జరగాలి.[a] మీరు ఏ సాధారణ పనీ చేయకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్ర సమాగమం.” హీబ్రూ పదబంధంలో అధికారికంగా పిలిచి కూడబెట్టే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “సేవ/ఉపాధికి సంబంధించిన పని”; అంటే సాధారణ వృత్తి లేదా ఉపాధి పని.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: నిర్దిష్ట ordinalతో ఉన్న కాలసూచక పదబంధానికి సహజమైన, నేరమైన అనువాదం. సందర్భంలో ఇది పండుగ మొదటి రోజు అయినప్పటికీ, ‘పండుగ’ అనే పదం ఈ వచనంలో లేదు కాబట్టి చేర్చలేదు.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సమావేశం
  rationale: అధికారికంగా పిలువబడిన ఆరాధనా సమాగమాన్ని సూచించే స్థిరమైన ఆచారపరమైన పదబంధం. ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేలా ‘పవిత్ర సమావేశం’ అని ఇచ్చాం; పిలుపు భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: כָּל ... לֹא
  choice: ఏ ... పనీ చేయకూడదు
  rationale: హీబ్రూ నిషేధ నిర్మాణంలోని సంపూర్ణ వ్యాప్తిని తెలుగులో సహజంగా తెలియజేసే రూపం.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: సాధారణ పని
  rationale: ప్రతి విధమైన చర్యనూ కాకుండా, పండుగ రోజున నిషేధించబడిన మామూలు ఉపాధి లేదా సేవాసంబంధ పనిని సూచిస్తుంది. ‘కష్టమైన పని’ అని అనువదిస్తే శ్రమ తీవ్రతకే భావం పరిమితమయ్యే ప్రమాదం ఉంది.
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు ... చేయకూడదు
  rationale: సమాజాన్ని బహువచనంలో ఉద్దేశించిన న్యాయపరమైన నిషేధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
