  terminology: ‘పవిత్ర సమావేశం’ is a suitable modern-standard equivalent for מִקְרָא קֹדֶשׁ, with the summons nuance retained in note a. Footnote b should not present ‘శ్రమ’ as though it were explicitly part of the Hebrew wording; the Hebrew phrase is more specifically ‘work of service/occupation.’
