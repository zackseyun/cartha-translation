id: NUM.28.24
reference: Numbers 28:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: te
  text: ఇవాటి మాదిరిగా మీరు ఏడు రోజులు ప్రతిరోజూ యెహోవాకు ఇంపైన సువాసనగా ఉండే అగ్న్యర్పణపు ఆహారాన్ని అర్పించాలి; అది నిత్య దహనబలికీ దాని పానార్పణానికీ అదనంగా అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: ఇవే విధంగా
  rationale: כְּ ఉపసర్గలోని పోలిక భావాన్ని నిలుపుతూ, ముందుగా నిర్దేశించిన అర్పణాల మాదిరిగానే చేయాలనే అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַּעֲשׂוּ
  choice: మీరు ... అర్పించాలి
  rationale: עשה సాధారణంగా ‘చేయు’ అని అర్థమైనా, బలుల సందర్భంలో ‘అర్పించాలి’ అనేది సహజమైన, సందర్భోచితమైన తెలుగు.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు ప్రతిరోజూ
  rationale: ఏడు రోజులలో ఒక్కొక్క రోజూ ఈ క్రియ పునరావృతం కావాలనే విభాజక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֶחֶם אִשֵּׁה
  choice: ఆహారంగా, ... దహనార్పణాన్ని
  rationale: לֶחֶם ఇక్కడ కేవలం రొట్టెను కాక బలిగా సమర్పించే ఆహారాన్ని సూచిస్తుంది; אִשֵּׁה అగ్నిచేత అర్పించబడే అర్పణాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ఈ రెండు భావాలనూ చదవడానికి సహజంగా అమర్చింది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగల
  rationale: బలి దేవునికి ఆమోదయోగ్యంగా ఉండటాన్ని తెలిపే హీబ్రూ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిలిపి చేసింది.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: నిత్య దహనబలితోపాటు ... అదనంగా
  rationale: עַל ఇక్కడ సాధారణ దహనబలికి తోడుగా ఈ అర్పణ చేయాలనే సంకలన భావాన్ని ఇస్తుంది; תָּמִיד యొక్క నిరంతర/క్రమబద్ధ భావాన్ని ‘నిత్య’ నిలుపుతుంది.
- source_word: יֵעָשֶׂה
  choice: ఇది అర్పించాలి
  rationale: עשה యొక్క నిష్క్రియ రూపాన్ని బలి సందర్భానికి తగిన సహజ తెలుగు క్రియతో వ్యక్తం చేసింది.
- source_word: וְנִסְכּוֹ
  choice: దాని పానార్పణం
  rationale: נסך పోసే ద్రవార్పణాన్ని సూచిస్తుంది; ఏకవచన ప్రత్యయం నిత్య దహనబలిని తిరిగి సూచిస్తున్నందున ‘దాని’ అని అనువదించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే నిలిపింది; ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: רֵיחַ נִיחֹחַ యొక్క భావం
  choice: ఇంపైన సువాసన
  alternative: శాంతికరమైన సువాసన
  rationale: దేవుణ్ణి మానవరీతిగా శాంతింపజేయడం అనే నిర్దిష్ట సిద్ధాంతార్థాన్ని చేర్చకుండా, బలి ఆమోదయోగ్యతను తెలిపే మూల రూపకాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘దహనబలి,’ ‘పానార్పణం’ వంటి పారదర్శకమైన బైబిలు పదజాలాన్ని ఉపయోగించి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచింది.
