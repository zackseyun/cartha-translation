id: NUM.28.23
reference: Numbers 28:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: te
  text: నిత్యంగా అర్పించే ఉదయపు దహనబలికి అదనంగా వీటిని అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: అదనంగా
  rationale: పండుగకు సంబంధించిన ఈ బలులు నిత్యబలికి తోడుగా అర్పించబడతాయని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: నిత్యం అర్పించే దహనబలిలో భాగమైన ఉదయపు దహనబలి
  rationale: ఉదయపు దహనబలి మరొక బలి కోసం అర్పించబడినదని కాక, నిత్య దహనబలికి చెందినదని హెబ్రీ సంబంధ వాక్యం సూచిస్తుంది.
- source_word: תַּעֲשׂוּ
  choice: అర్పించాలి
  rationale: బలుల నియమాల సందర్భంలో ‘చేయాలి’ కంటే ‘అర్పించాలి’ సహజమైన సందర్భోచిత సమానార్థకం; బహువచన ఆజ్ఞను గౌరవార్థక/సాధారణ విధిరూపంలో అందిస్తుంది.
- source_word: אֶת אֵלֶּה
  choice: వీటిని
  rationale: సూచన సర్వనామం ముందుగా పేర్కొన్న బలులను సూచిస్తుంది; తెలుగులో ‘వీటిని’ సరిపోతుంది.
theological_decisions:
- issue: ఉదయపు దహనబలికి నిత్య దహనబలితో ఉన్న సంబంధం
  choice: నిత్య దహనబలిలో భాగమైన ఉదయపు దహనబలి
  alternative: నిత్య దహనబలి కోసం అర్పించే ఉదయపు దహనబలి
  rationale: לְעֹלַת הַתָּמִיד అనే పదబంధం ఉదయపు బలిని నిత్య అర్పణతో అనుసంధానిస్తుంది; ఒక బలి మరొక బలి కోసం అర్పించబడుతుందనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే బలుల నియమాలకు తగిన గంభీరతతో అనువదించబడింది. మూలంలోని సంక్షిప్త ఆజ్ఞా శైలి నిలుపబడింది.
