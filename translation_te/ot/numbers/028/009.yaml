source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: te
  text: 'మరియు విశ్రాంతి దినాన: ఒక సంవత్సరం వయసుగల, లోపంలేని రెండు మగ గొర్రెపిల్లలు; నూనెతో కలిపిన సన్నని పిండిలో రెండు పదోవంతుల[a] ఏఫా ధాన్యార్పణ, మరియు దాని పానార్పణ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠ్యంలో అక్షరార్థంగా ‘రెండు పదోవంతులు’; బలి నియమావళిలో ఒక్కో పదోవంతు ఏఫాలో పదోవంతును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: విశ్రాంతి దినాన
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ఇచ్చింది. ఈ వాక్యం ముందున్న అర్పణ నియమాలకు కొనసాగింపుగా ఉన్నప్పటికీ, తెలుగులో ఆ అనుసంధానాన్ని విరామచిహ్నంతో స్పష్టపరచడం సహజంగా ఉంటుంది.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: ఒక సంవత్సరం వయసుగల ... రెండు మగ గొర్రెపిల్లలు
  rationale: בְּנֵי שָׁנָה అనే హీబ్రూ నుడికారం ఒక సంవత్సరం వయసుగల జంతువులను సూచిస్తుంది. బలి సందర్భంలోని כְבָשִׂיםను లింగభేదం స్పష్టమయ్యేలా ‘మగ గొర్రెపిల్లలు’గా అనువదించింది.
- source_word: תְמִימִם
  choice: లోపంలేని
  rationale: బలి నియమాల సందర్భంలో ఈ పదం శారీరక దోషం లేదా కళంకం లేనివాటిని సూచిస్తుంది; ‘లోపంలేని’ అనేది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదోవంతుల ఏఫా
  rationale: హీబ్రూలో అక్షరార్థంగా ‘రెండు పదోవంతులు’ అని ఉంది. బలి నియమాల్లో ఒక్కో పదోవంతు ఏఫాలో పదోవంతును సూచించేందున, కొలత ప్రమాణాన్ని ప్రధాన పాఠ్యంలో స్పష్టంచేసి మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో తెలిపింది.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: అర్పణలకు ఉపయోగించే మెత్తగా, నాణ్యంగా చేసిన పిండిని సూచిస్తుంది; ‘సన్నని పిండి’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: యాజక బలి నియమాల సందర్భంలో ఇది సాధారణ కానుకను కాకుండా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో కలిపిన స్థితిని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנִסְכּוֹ
  choice: దానితో కూడిన పానార్పణ
  rationale: נֶסֶךְ బలితోపాటు పోసే ద్రవార్పణను సూచిస్తుంది. ఏకవచన ప్రత్యయాన్ని ‘దానితో కూడిన’ అని ఉంచడం ద్వారా అది మొత్తం అర్పణ సముదాయానికి సంబంధించినదనే భావాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయకుండా నిలిపింది.
theological_decisions:
- issue: హీబ్రూ వాక్యంలో క్రియ లేకపోవడం
  choice: అర్పణల జాబితాగా ద్విబిందువు, అర్ధవిరామంతో నిర్మాణాన్ని నిలిపివేయడం
  alternative: సందర్భం ఆధారంగా ‘అర్పించాలి’ అనే క్రియను చేర్చడం
  rationale: ఈ వచనం ముందున్న ఆజ్ఞకు కొనసాగింపుగా క్రియారహిత జాబితాను ఇస్తుంది. తెలుగు పాఠ్యం అర్థమయ్యేలా విరామచిహ్నాలను ఉపయోగిస్తూ, మూలంలో లేని ఆజ్ఞాక్రియను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించింది. మూలంలోని జాబితా నిర్మాణాన్ని నిలిపి, సాధారణ పాఠకులకు తెలియని కొలతను సంక్షిప్త పాదటిప్పణితో వివరించింది.
