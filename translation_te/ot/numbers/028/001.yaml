  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH”; దీనిని “యెహోవా” అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామానికి ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: హీబ్రూ కథనంలో ఇది దేవుడు మాట్లాడడాన్ని తెలిపే సాధారణ సూత్రప్రయోగం. తెలుగులో ‘చెప్పాడు’ సహజంగా ఉండి, వెంట వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మోషేను ఉద్దేశించి మాట్లాడాడనే సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజమైన ‘ఇలా చెప్పాడు’ అనే ప్రయోగంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం; ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మాట్లాడి ఇలా అన్నాడు’ అనే పునరుక్తిని నివారిస్తూ, וַיְדַבֵּר ... לֵאמֹר అనే హీబ్రూ సూత్రప్రయోగాన్ని ‘ఇలా చెప్పాడు’గా సంక్షిప్తంగా అందించాం.
