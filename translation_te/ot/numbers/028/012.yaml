translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల నియమానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని కొనసాగింపు భావాన్ని నిలుపుతూ, తెలుగులో సంపూర్ణ ఆజ్ఞావాక్యంగా ఉండేందుకు సందర్భం ద్వారా గ్రహించబడే ‘అర్పించాలి’ చేర్చబడింది. ‘ఒక్కో’ రూపం హీబ్రూలోని పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
