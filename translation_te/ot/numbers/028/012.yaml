id: NUM.28.12
reference: Numbers 28:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: te
  text: ప్రతి ఎద్దుకు నూనెతో కలిపిన ఏఫాలో మూడు పదోవంతుల మెత్తని పిండితో ధాన్యార్పణం[a], ప్రతి పొట్టేలుకు నూనెతో కలిపిన ఏఫాలో రెండు పదోవంతుల మెత్తని పిండితో ధాన్యార్పణం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మూడు పదోవంతులు,’ ‘రెండు పదోవంతులు’ అని ఉంది; ఇవి ఏఫాలో పదోవంతులని అర్థం చేసుకోవాలి.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: మూడు పదోవంతుల ఏఫా
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘మూడు పదోవంతులు’; బలుల నియమావళిలో ఇవి ఏఫాలో పదోవంతులని సందర్భం సూచిస్తుంది. కొలతను స్పష్టంగా పేర్కొనడం ఆధునిక తెలుగు పాఠకునికి సహాయపడుతుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలుల్లో వాడే శుద్ధమైన, సన్నగా చేసిన పిండిని సూచించే ఆరాధనా సంబంధ పదం; ‘మెత్తని పిండి’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: ఈ బలుల సందర్భంలో సాధారణ కానుకకంటే ధాన్యంతో చేసే అర్పణను ప్రత్యేకంగా సూచిస్తుంది.
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో కలిపి సిద్ధం చేయడాన్ని ఈ కృదంత పదబంధం వివరిస్తుంది; ఈ అనువాదం సహజమైన ఆధునిక తెలుగు.
- source_word: לַ/פָּר הָ/אֶחָד
  choice: ఒక్కో ఎద్దుకు
  rationale: ఇక్కడ הָאֶחָד ‘మొదటి’ అనే క్రమార్థాన్ని కాకుండా ఒక్కొక్క బలి జంతువుకు వర్తించే పంపిణీ భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో ‘ఒక్కో’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదోవంతుల ఏఫా
  rationale: ఇది అక్షరార్థంగా ‘రెండు పదోవంతులు’; బలుల సందర్భంలో ఏఫాలో పదోవంతులు అని స్పష్టపరచబడింది.
- source_word: לָ/אַיִל הָֽ/אֶחָד
  choice: ఒక్కో పొట్టేలుకు
  rationale: ఎద్దుకు సంబంధించిన సమాంతర పదబంధంలాగే ఇది కూడా ‘మొదటి పొట్టేలు’ అని కాకుండా ఒక్కొక్క పొట్టేలుకు అవసరమైన పరిమాణాన్ని సూచిస్తుంది.
