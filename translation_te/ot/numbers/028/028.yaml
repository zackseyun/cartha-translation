source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֣ר הָֽ/אֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: te
  text: 'వాటితోపాటు అర్పించే ధాన్యార్పణం నూనెతో కలిపిన సన్నని పిండి అయి ఉండాలి: ఒక్క ఎద్దుకు మూడు పదోవంతులు[a], ఒక్క పొట్టేలుకు రెండు పదోవంతులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘మూడు పదో-కొలతలు,’ ‘రెండు పదో-కొలతలు’ అని ఉంది. ఈ బలి సందర్భంలో ఇవి సాధారణంగా ఏఫాలో పదోవంతులుగా అర్థం చేసుకుంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: వాటి ధాన్యార్పణగా ... అర్పించాలి
  rationale: బలి సందర్భంలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది. క్రియలేని హెబ్రీ వాక్యాన్ని సహజమైన తెలుగు నియమవాక్యంగా వ్యక్తం చేయడానికి ‘అర్పించాలి’ చేర్చబడింది; బహువచన ప్రత్యయం ముందటి అర్పణలకు సంబంధించిన ‘వాటి’గా నిలుపబడింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: సాధారణ పిండి కాకుండా బలికి ఉపయోగించే సన్నగా, నాణ్యంగా చేసిన పిండిని సూచించే సహజ ఆధునిక తెలుగు పదబంధం.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెను పిండితో కలిపి సిద్ధం చేసిన స్థితిని సూచించే నిష్క్రియ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: మూడు పదోవంతులు
  rationale: మూలంలోని ‘మూడు పదో-కొలతలు’ అనే రూపాన్ని సంక్షిప్తంగా నిలుపుతూ, కొలత ఏదో పాదటిప్పణిలో వివరిస్తుంది.
- source_word: לַפָּר הָאֶחָד
  choice: ఒక్క ఎద్దుకు
  rationale: פַּר అనేది మందలోని మగ పశువు, అంటే ఎద్దు. వ్యాసంతో కూడిన אֶחָד ఇక్కడ పంపిణీ భావంలో ఉండటంతో సహజ తెలుగులో ‘ఒక్క ఎద్దుకు’ అని ఇచ్చాం.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదోవంతులు
  rationale: రెండు పదో-కొలతల పరిమాణాన్ని మూలానికి సమీపంగా, తెలుగు పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: לָאַיִל הָאֶחָד
  choice: ఒక్క పొట్టేలుకు
  rationale: אַיִל బలికి సంబంధించిన సందర్భంలో మగ గొర్రెను సూచిస్తుంది; ఆధునిక తెలుగులో దానికి సహజమైన పదం ‘పొట్టేలు’. ‘ఒక్క’ పంపిణీ భావాన్ని నిలుపుతుంది.
