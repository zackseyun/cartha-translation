translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ధాన్యార్పణ,’ ‘మెత్తని పిండి’ వంటి పదాలు స్పష్టతతో పాటు ఆచార సంబంధిత భావాన్ని నిలుపుతాయి; హెబ్రీలో కొలత ప్రమాణం స్పష్టంగా చెప్పబడనందున దానిని ప్రధాన పాఠ్యంలో విస్తరించకుండా పాదటిప్పణిలో వివరించాం.
