  to: 'వాటితోపాటు అర్పించే ధాన్యార్పణం నూనెతో కలిపిన సన్నని పిండి అయి ఉండాలి: ఒక్క ఎద్దుకు మూడు పదోవంతులు[a], ఒక్క పొట్టేలుకు రెండు పదోవంతులు.'
