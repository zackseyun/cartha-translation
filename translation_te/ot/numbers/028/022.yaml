id: NUM.28.22
reference: Numbers 28:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: te
  text: మరియు మీకోసం ప్రాయశ్చిత్తం చేయడానికి పాపపరిహార బలిగా[a] ఒక మగమేకను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలిగా.’ ఇక్కడ ‘పాపపరిహార బలి’గా అనువదించిన హెబ్రీ పదానికి బలుల సందర్భంలో ‘శుద్ధీకరణ బలి’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ఒక మగ మేకను
  rationale: שָׂעִיר మగ మేకను సూచిస్తుంది; אֶחָד తెలిపే సంఖ్యను ‘ఒక’గా స్పష్టంగా నిలిపాం. వాక్యసందర్భంలో హెబ్రీ సంధికారకమైన וּ భావం జాబితా కొనసాగింపులో సహజంగా ప్రతిఫలిస్తుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: యాజక బలుల సందర్భంలో חַטָּאת సాధారణంగా పాపం అనే అమూర్త భావం కంటే ఒక బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, స్థిరమైన బలిసంబంధ అర్థాన్ని కాపాడుతుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: బలిపశువు సంఖ్యను తెలిపే హెబ్రీ సంఖ్యావాచకాన్ని స్పష్టంగా అనువదించాం.
- source_word: לְ/כַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజక బలుల సందర్భంలోని כפר పదానికి ఉన్న విస్తృతమైన పరిహార సంబంధ, ఆరాధన సంబంధ బలాన్ని నిలుపుతూ, దాని విధానాన్ని ఒక నిర్దిష్ట సిద్ధాంతంగా సంకుచితం చేయదు.
- source_word: עֲלֵי/כֶם
  choice: మీ కోసం
  rationale: ఈ సందర్భంలో עַל ప్రత్యయంతో కలిసి ప్రజల పక్షాన లేదా వారి ప్రయోజనం కోసం జరిగే కార్యాన్ని సూచిస్తుంది; ‘మీ కోసం’ సహజమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: బలిసంబంధ כפר పదబంధం అనువాదం
  choice: మీ కోసం ప్రాయశ్చిత్తం చేయడానికి
  alternative: మీ పక్షంగా పరిహారం చేయడానికి
  rationale: ‘ప్రాయశ్చిత్తం చేయడానికి’ హెబ్రీ బలిసంబంధ పదానికి ఉన్న ధార్మిక బరువును నిలుపుతుంది; అయితే అది పరిహారం ఏ విధంగా సిద్ధిస్తుందో పాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
- issue: חַטָּאת యొక్క బలిసంబంధ అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ప్రధాన పాఠ్యంలో సంప్రదాయంగా అర్థమయ్యే బలిపదాన్ని వాడి, కర్మకాండ సంబంధ శుద్ధీకరణను నొక్కిచెప్పే సముచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. విధి నిర్దేశాన్ని తెలుగులో సంపూర్ణంగా తెలియజేయడానికి ‘అర్పించాలి’ని వాక్యాంతంలో పూరించాం; ఇది పరిసర జాబితాలో అంతర్నిహితమైన బలి అర్పణ భావాన్ని వ్యక్తం చేస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
