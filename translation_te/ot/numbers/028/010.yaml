  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: te
  text: ప్రతి సబ్బాతు విశ్రాంతిదినాన అర్పించే దహనబలి, నిత్య దహనబలికీ దాని పానార్పణకీ అదనమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచించే స్థిరమైన బలిపదం; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘దహనబలి’ స్పష్టమైన, సంక్షిప్తమైన సమానం.
- source_word: שַׁבַּת
  choice: విశ్రాంతిదినం
  rationale: ఈ బలుల కాలపట్టికలో שַׁבָּת వారాన్ని కాక విశ్రాంతిదినాన్నే సూచిస్తుంది.
- source_word: בְּשַׁבַּתּוֹ
  choice: ప్రతి విశ్రాంతిదినాన
  rationale: అక్షరార్థంగా ‘దాని విశ్రాంతిదినాన’ అయినప్పటికీ, ప్రత్యయం ఇక్కడ పునరావృతమయ్యే ప్రతి విశ్రాంతిదినానికి నిర్దేశించిన బలి అనే పంపిణీ భావాన్ని ఇస్తుంది; ‘ప్రతి విశ్రాంతిదినాన’ సహజంగా దాన్ని తెలియజేస్తుంది.
- source_word: עַל
  choice: అదనంగా
  rationale: బలి ఆదేశాల్లో עַל మరొక బలికి తోడుగా లేదా దానిపై అదనంగా అర్పించడాన్ని సూచిస్తుంది.
- source_word: הַתָּמִיד
  choice: నిత్య
  rationale: תָּמִיד నిరంతరంగా, క్రమంగా అర్పించబడేదాన్ని సూచిస్తుంది; ముందున్న עֹלַתతో కలిపి ‘నిత్య దహనబలి’ అవుతుంది.
- source_word: וְנִסְכָּהּ
  choice: దానితోపాటు అర్పించే పానార్పణ
  rationale: נֶסֶךְ పోసి అర్పించే ద్రవబలి; స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని సూచిస్తుంది. ‘దానితోపాటు’ అనుబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బలిపదజాలం వాడబడింది. హీబ్రూ నామవాక్యాన్ని సహజ తెలుగు ఆజ్ఞారూప నిర్మాణంగా వ్యక్తీకరించినప్పటికీ, ప్రతి విశ్రాంతిదినపు బలి నిత్య బలికి అదనమనే సంబంధం యథాతథంగా ఉంచబడింది.
