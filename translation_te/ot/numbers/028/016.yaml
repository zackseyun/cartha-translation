source:
  edition: WLC
  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: te
  text: మొదటి నెలలో, నెల పద్నాలుగో రోజున యాహ్వే పస్కా పండుగ ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు అంకితమైన పస్కా పండుగ.” హీబ్రూలోని ఉపసర్గ అంకితాన్ని లేదా చెందిన సంబంధాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: వాక్యారంభంలోని וּ సందర్భానుసంధానాన్ని సూచిస్తుంది; తెలుగులో విడిగా ‘మరియు’ అని పెట్టకుండా సహజమైన కాలసూచనతో ప్రారంభించడం మూలార్థాన్ని నిలుపుతుంది.
- source_word: בְּ/אַרְבָּעָה עָשָׂר י֖וֹם לַ/חֹ֑דֶשׁ
  choice: ఆ నెల పద్నాలుగో రోజున
  rationale: హీబ్రూ తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: פֶּ֖סַח
  choice: పస్కా పండుగ
  rationale: ‘పస్కా’ స్థిరపడిన బైబిలు పదం; ఈ పంచాంగ సందర్భంలో కేవలం బలిని మాత్రమే సూచిస్తున్నట్లు పరిమితం చేయకుండా ఆ ఆచరణ/పండుగను తెలియజేయడానికి ‘పండుగ’ చేర్చబడింది.
- source_word: לַ/יהוָֽה
  choice: యెహోవాకు
  rationale: לְ ఉపసర్గలోని అంకితభావం లేదా సంబంధాన్ని ‘-కు’ సహజంగా నిలుపుతుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- issue: לַיהוָה లోని సంబంధం
  choice: యెహోవాకు
  alternative: యెహోవా పస్కా
  rationale: లామెద్ అంకితం, ఉద్దేశం లేదా సంబంధాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘యెహోవాకు’ అని ఉంచి, ‘యెహోవాకు చెందినది’ అనే సాధ్యార్థాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. తేదీ సూత్రం సరళంగా ఉంచబడింది; మూలంలోని సంక్షిప్త నామవాక్యాన్ని తెలుగులో సంపూర్ణంగా వినిపించేందుకు ‘జరుగుతుంది’ ఉపయోగించబడింది.
