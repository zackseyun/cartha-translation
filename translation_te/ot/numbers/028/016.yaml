    text: లేదా, “యాహ్వేకు అంకితమైన పస్కా పండుగ.” హీబ్రూలోని ఉపసర్గ అంకితాన్ని లేదా చెందిన సంబంధాన్ని సూచించగలదు.
    reason: lexical_alternative
