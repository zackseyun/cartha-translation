revisions:
- from: మొదటి నెలలో, ఆ నెల పద్నాలుగో రోజున యెహోవాకు పస్కా పండుగ జరుగుతుంది.[a]
  to: మొదటి నెలలో, నెల పద్నాలుగో రోజున యాహ్వే పస్కా పండుగ ఉంటుంది.[a]
  rationale: The revision preserves the Hebrew date formula and the festival sense of פֶּסַח, updates the divine name to the project-mandated “యాహ్వే,” and uses a natural Telugu genitive-style expression for the relationship to Yahweh. The footnote preserves the lamed preposition’s possible dedication sense without forcing it into the main text.
