id: NUM.28.26
reference: Numbers 28:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: te
  text: ప్రథమ ఫలాల రోజున, మీ వారాల పండుగలో మీరు యహ్వేకు కొత్త ధాన్య నైవేద్యాన్ని అర్పించేటప్పుడు, మీకు పవిత్ర సభ[a] జరగాలి. మీరు రోజువారీ ఉపాధికి సంబంధించిన ఏ పనినీ[b] చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్ర సమాహ్వానం.’ హీబ్రూ పదబంధం ఆరాధన కోసం పిలిచిన పవిత్ర సమావేశాన్ని సూచించే ప్రత్యేక పారిభాషిక పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శ్రమతో కూడిన ఏ పనినీ’ లేదా ‘సాధారణ వృత్తిపనినీ.’ ఈ పదబంధం రోజువారీ జీవనోపాధికి సంబంధించిన సాధారణ పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: ప్రథమ ఫలాల రోజున
  rationale: కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగులో ఉంచుతూ, పండుగకు సంబంధించిన ‘ప్రథమ ఫలాలు’ అనే ఆరాధనా భావాన్ని నిలిపింది.
- source_word: בְּהַקְרִיבְכֶם
  choice: మీరు ... అర్పించేటప్పుడు
  rationale: బలి సంబంధ సందర్భంలో קרב అంటే దేవుని సమక్షంలో అర్పించడం; సమకాలీన క్రియను సూచించే హీబ్రూ నిర్మాణాన్ని ‘అర్పించేటప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִנְחָה חֲדָשָׁה
  choice: కొత్త ధాన్య నైవేద్యాన్ని
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలో מִנְחָה సాధారణ కానుకకంటే ధాన్య నైవేద్యాన్ని సూచిస్తుంది; ‘కొత్త’ అనేది కొత్త పంటతో సంబంధాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: మూలంలోని దేవుని ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రతిలిపి చేసింది.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: మీ వారాల పండుగలో
  rationale: ఇక్కడ ‘వారాలు’ కేవలం కాలవ్యవధి కాదు, వారాల పండుగను సూచిస్తుంది; ‘మీ’ అనే మూలంలోని ద్వితీయ పురుష బహువచన ప్రత్యయాన్ని కూడా నిలిపింది.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: ఆరాధన కోసం అధికారికంగా పిలిచిన సమూహాన్ని సూచించే ఆచారపరమైన పదబంధాన్ని సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా అనువదించింది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... జరగాలి
  rationale: ‘మీ కోసం అది ఉండాలి’ అనే హీబ్రూ అస్తిత్వ నిర్మాణంలోని ఆజ్ఞాత్మక భావాన్ని సహజమైన తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: మీరు రోజువారీ ఉపాధికి సంబంధించిన ఏ పనినీ చేయకూడదు
  rationale: పండుగ రోజున నిషేధించబడిన సాధారణ వృత్తి లేదా ఉపాధి పనిని సూచిస్తుంది; అన్ని రకాల చర్యలనూ సంపూర్ణంగా నిషేధిస్తున్నట్టు అతిగా విస్తరించదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పాండిత్యపూర్వక ఉచ్చారణను తెలుగు లిపిలో అందించింది.
- issue: מִקְרָא קֹדֶשׁ యొక్క ఆరాధనా భావం
  choice: పవిత్ర సభ
  alternative: పవిత్ర సమాహ్వానం
  rationale: ఈ పదబంధం పవిత్రంగా పిలువబడిన ఆరాధనా సమావేశాన్ని సూచిస్తుంది. ‘పవిత్ర సభ’ సహజంగా ఉండగా, పిలుపు లేదా సమాహ్వాన భావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: מְלֶאכֶת עֲבֹדָה నిషేధ పరిధి
  choice: రోజువారీ ఉపాధికి సంబంధించిన పని
  alternative: శ్రమతో కూడిన పని; సాధారణ పని
  rationale: ఈ ఆచారపరమైన నిషేధం ప్రతి చర్యను కాకుండా సాధారణ జీవనోపాధి లేదా వృత్తి శ్రమను లక్ష్యంగా చేసిందనే భావాన్ని తెలియజేస్తూ, పదబంధంలోని సాధ్యమైన ఇతర సూక్ష్మార్థాలను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని పాటిస్తూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. ‘ధాన్య నైవేద్యం,’ ‘వారాల పండుగ,’ ‘పవిత్ర సభ’ వంటి ఆరాధనా పదాలకు అవసరమైన సాంకేతిక ఖచ్చితత్వాన్ని నిలిపాం; అనిశ్చిత ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
