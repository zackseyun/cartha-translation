  rationale: The revision aligns the divine-name rendering with the provided POB audit trail, makes the first clause idiomatic while preserving the possessive suffix, and refines the cultural note’s wine terminology without over-specifying שֵׁכָר. The ancient measure, distributive sense, cultic location, and repeated drink-offering language remain intact.
