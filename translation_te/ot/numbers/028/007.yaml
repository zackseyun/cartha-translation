- from: ఒక్కొక్క గొర్రెపిల్లకు పానార్పణగా పావు హీను ఉండాలి.[a] పవిత్ర స్థలంలో[b] యెహోవాకు మత్తు కలిగించే పానీయాన్ని[c] పానార్పణగా పోయాలి.
