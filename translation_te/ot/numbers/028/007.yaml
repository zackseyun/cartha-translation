id: NUM.28.7
reference: Numbers 28:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: te
  text: దాని పానార్పణం ఒక్కొక్క గొర్రెపిల్లకు పావు హీను ఉండాలి.[a] పరిశుద్ధ స్థలంలో[b] యాహ్వేకు మత్తు కలిగించే పానీయాన్ని[c] పానార్పణగా పోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక గొర్రెపిల్లకు”; అక్షరార్థంగా, “ఆ ఒక్క గొర్రెపిల్లకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పవిత్ర స్థలంలో.”
    reason: lexical_alternative
  - marker: c
    text: ఇది ద్రాక్షామద్యం కాకుండా ఉండే మత్తు పానీయాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన రకం చెప్పబడలేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: పానార్పణగా ... ఉండాలి
  rationale: ద్రవాన్ని పోసి అర్పించే బలిని సూచించే పదాన్ని సహజమైన ఆధునిక తెలుగులో ‘పానార్పణ’గా వ్యక్తం చేశాం; ప్రత్యయం సందర్భంలోని గొర్రెపిల్లకు సంబంధించిన పరిమాణాన్ని సూచిస్తుంది.
- source_word: רְבִיעִת הַהִין
  choice: పావు హీను
  rationale: మూలంలోని ఖచ్చితమైన ప్రాచీన కొలతను ఆధునిక ప్రమాణంలోకి మార్చకుండా అలాగే ఉంచి, నాలుగవ వంతును సహజంగా ‘పావు’ అని అనువదించాం.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: అక్షరార్థంగా ‘ఆ ఒక్క గొర్రెపిల్లకు’; సందర్భంలో ప్రతి గొర్రెపిల్లకు కావలసిన పరిమాణాన్ని నిర్దేశిస్తున్నందున పంపిణీ భావాన్ని సహజంగా తెలిపాం.
- source_word: בַּקֹּדֶשׁ
  choice: పవిత్ర స్థలంలో
  rationale: బలి ఆరాధన సందర్భంలో ఇది అమూర్తమైన ‘పవిత్రతలో’ కంటే పవిత్ర ప్రదేశాన్ని సూచిస్తుంది; ‘పరిశుద్ధస్థలంలో’ అనే భావం కూడా సాధ్యం.
- source_word: הַסֵּךְ
  choice: పోయాలి
  rationale: ద్రవార్పణను పోయే కార్యాన్ని ఆజ్ఞాత్మక శైలిలో సహజమైన తెలుగులో తెలిపాం.
- source_word: נֶסֶךְ
  choice: పానార్పణగా
  rationale: మూలంలో పునరుక్తమైన ద్రవార్పణ భావాన్ని వాక్యంలో స్పష్టంగా నిలిపాం.
- source_word: שֵׁכָר
  choice: మత్తు కలిగించే పానీయం
  rationale: ద్రాక్షారసం కాకుండా ఉండగల మత్తు పానీయాన్ని సూచించే విస్తృత పదం; నిర్దిష్టంగా ‘బీరు’ అని చెప్పడానికి మూలంలో ఆధారం లేదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సాధారణంగా గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ దానిని పేరుగానే నిలుపుతుంది; ‘ప్రభువు’ అని మార్చడం మూలంలోని పేరు-బిరుదు భేదాన్ని తొలగిస్తుంది.
- issue: שֵׁכָר యొక్క స్వరూపం
  choice: మత్తు కలిగించే పానీయం
  alternative: మద్యపానీయం; బీరు
  rationale: పదం మత్తు కలిగించే పానీయాన్ని సూచిస్తుంది గాని దాని ఖచ్చిత రకాన్ని నిర్ణయించదు; అందుచేత మూలంలోని అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ‘హీను’ అనే ప్రాచీన కొలతను పారదర్శకత కోసం అలాగే ఉంచాం; ‘పానార్పణ’ను పునరావృత మూలభావాన్ని కాపాడే సంక్షిప్త ఆరాధనా పదంగా వాడాం.
