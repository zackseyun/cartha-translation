- from: నైవేద్యంగా, దంచి తీసిన నూనె పావు హీను కలిపిన సన్నని పిండి ఒక ఏఫాలో పదోవంతు అర్పించాలి.[a]
  to: ధాన్యార్పణంగా, ఒక ఏఫాలో పదోవంతు సన్నని పిండిని కొట్టి తీసిన నూనె పావు హీనుతో కలిపి అర్పించాలి.[a]
