id: NUM.28.5
reference: Numbers 28:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: te
  text: ధాన్యార్పణంగా, ఒక ఏఫాలో పదోవంతు సన్నని పిండిని కొట్టి తీసిన నూనె పావు హీనుతో కలిపి అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఏఫా, హీను అనేవి ప్రాచీన ఇశ్రాయేలీయుల కొలమానాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: ఒక ఏఫాలో పదోవంతు
  rationale: ప్రాచీన పొడి కొలత ‘ఏఫా’ను యథాతథంగా ఉంచుతూ, దాని పదోవంతు అనే పరిమాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వావ్ ముందటి బలివిధికి దీనిని అనుసంధానిస్తుంది.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: బలుల సందర్భంలో ఉపయోగించే మెత్తగా మిల్లుచేసిన ఉత్తమ పిండిని స్పష్టంగా సూచిస్తుంది.
- source_word: לְמִנְחָה
  choice: నైవేద్యంగా
  rationale: యాజక సంబంధమైన ఈ సందర్భంలో ధాన్యంతో చేసే అర్పణను సూచిస్తుంది. ‘నైవేద్యం’ సాధారణ పాఠకులకు సహజమైనా, దీనిని ఆహార అర్పణ అనే విస్తృత అర్థంలో గ్రహించాలి.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: నూనె ... కలిపిన
  rationale: పిండిని నూనెతో కలిపిన స్థితిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּתִית
  choice: దంచి తీసిన
  rationale: ఒలీవ పండ్లను కొట్టి లేదా దంచి పొందిన నూనెను సూచించే హెబ్రీ విశేషణ భావాన్ని కాపాడుతుంది; ‘నొక్కి తీసిన’ అనేదీ సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: רְבִיעִת הַהִין
  choice: పావు హీను
  rationale: ప్రాచీన ద్రవ కొలత ‘హీను’ను ఉంచి, నాలుగో వంతును సహజమైన తెలుగు ‘పావు’తో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల నియమావళికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. మూలంలోని కొలమానాల పేర్లు లిప్యంతరీకరించబడ్డాయి. వాక్యం ముందటి వచనంలోని ఆజ్ఞకు కొనసాగింపుగా ఉన్నందున తెలుగులో సహజంగా ‘అర్పించాలి’ అనే క్రియను పూరించాం.
