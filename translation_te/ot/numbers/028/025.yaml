translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నియమాత్మక శైలి వాడబడింది. ‘పవిత్ర సమాహ్వానం’ మూలంలోని ఆరాధనా పిలుపు-సమకూడిక భావాన్ని నిలుపుతుంది; ‘సాధారణ పని’ అనే పదప్రయోగాన్ని మూలంలోని విస్తృతమైనప్పటికీ సందర్భపరంగా పరిమితమైన నిషేధాన్ని స్పష్టం చేయడానికి పాదసూచికతో ఇచ్చాం.
