  text: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: te
  text: ఏడవ రోజున మీకు పవిత్ర సభ[a] ఉండాలి; మీరు ఏ సాధారణ పనీ చేయకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర సమావేశం’ లేదా ‘పరిశుద్ధ సభ.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘శ్రమ/సేవ యొక్క పని’; అంటే సాధారణ వృత్తిపరమైన పని చేయకూడదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: సంయోజక అవ్యయం, కాలసూచక విభక్తి కలిగిన హీబ్రూ పదబంధంలోని కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ఇక్కడ ‘మరియు’ను విడిగా చేర్చడం తెలుగు వాక్యప్రవాహానికి అవసరం లేదు.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సమాహ్వానం
  rationale: ఈ స్థిరమైన ఆరాధనా పదబంధం పవిత్ర ఉద్దేశంతో అధికారికంగా పిలిచి కూడబెట్టే సమావేశాన్ని సూచిస్తుంది. ‘సమాహ్వానం’ పిలుపు మరియు సమకూడిక అనే రెండు భావాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: అక్షరార్థంగా ‘మీ కొరకు/మీకు ఉండాలి.’ నియమాత్మక సందర్భంలోని భావాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: ఏ సాధారణ పనీ
  rationale: నిషేధంతో కూడిన כָּל తెలుగులో ‘ఏ ... పనీ’గా సహజంగా వస్తుంది. מְלֶאכֶת עֲבֹדָה పవిత్ర దినానికి విరుద్ధమైన సాధారణ వృత్తి లేదా శ్రమ పనిని సూచిస్తుంది; ప్రతి రకమైన చర్యను సంపూర్ణంగా నిషేధిస్తున్నట్టు అనిపించకుండా ‘సాధారణ పని’ అని ఇచ్చాం.
- source_word: לֹא תַעֲשׂוּ
  choice: చేయకూడదు
  rationale: న్యాయనియమ సందర్భంలోని నిషేధార్థక అసంపూర్ణ క్రియను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన విధినిషేధంగా అందిస్తుంది.
