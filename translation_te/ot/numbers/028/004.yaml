  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: te
  text: ఒక గొర్రెపిల్లను ఉదయం అర్పించాలి; రెండవ గొర్రెపిల్లను సాయంకాలాల మధ్య[a] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సాయంకాలాల మధ్య.’ ఇది సంధ్యాసమయం లేదా సాయంత్రానికి ముందరి వేళను సూచించే సాంప్రదాయ వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: గొర్రెపిల్ల
  rationale: ఈ పదం బలి సందర్భంలో చిన్న గొర్రెను, సాధారణంగా మగ గొర్రెపిల్లను సూచిస్తుంది. ఈ వచనంలో లింగం ప్రత్యేకంగా మళ్లీ చెప్పబడనందున సహజమైన తెలుగు పదమైన ‘గొర్రెపిల్ల’ను వాడాం.
- source_word: אֶחָד
  choice: ఒక
  rationale: హీబ్రూ మూలంలో క్రమసంఖ్య ‘మొదటి’ కాకుండా సంఖ్యావాచకమైన ‘ఒకటి’ ఉంది; అందువల్ల ‘ఒక’ అని అనువదించాం.
- source_word: תַּעֲשֶׂה
  choice: అర్పించాలి
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘చేయాలి’ అనే భావం ఉన్నా, బలి అర్పణ ఆదేశాల్లో అది బలిని సిద్ధం చేసి అర్పించడాన్ని సూచిస్తుంది. తెలుగులో ‘అర్పించాలి’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַבֹּקֶר
  choice: ఉదయం
  rationale: ‘ఉదయం’ అనేది మూలపదానికి సహజమైన, ప్రస్తుత ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: הַשֵּׁנִי
  choice: రెండవ
  rationale: మూలంలోని క్రమసంఖ్యను నేరుగా నిలుపుతూ ‘రెండవ’ అని అనువదించాం.
- source_word: בֵּין הָעַרְבָּיִם
  choice: సాయంకాలాల మధ్య
  rationale: అక్షరార్థంగా ‘సాయంకాలాల మధ్య’ అనే సాంప్రదాయ కాలసూచక వ్యక్తీకరణ ఇది. దాని ఖచ్చితమైన కాలవ్యాప్తి విషయంలో ఉన్న సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలిపి, అర్థవివరణను పాదటిప్పణిలో ఇచ్చాం.
