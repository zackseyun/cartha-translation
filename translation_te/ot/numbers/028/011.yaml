id: NUM.28.11
reference: Numbers 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: te
  text: 'మీ నెలల ఆరంభాల్లో[a] మీరు యెహోవాకు దహనబలిని అర్పించాలి: మందలోని రెండు ఎద్దులు, ఒక పొట్టేలు, లోపంలేని ఏడాది వయసుగల ఏడు మగ గొర్రెపిల్లలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “మీ నెలల ఆరంభాల్లో”; అంటే అమావాస్య దినాల సందర్భంలో.
    reason: హెబ్రీ ఇడియమ్‌కు చెందిన సందర్భార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: మీ నెలల ఆరంభాల్లో
  rationale: ‘మీ నెలల ఆరంభాల్లో’ అనే హెబ్రీ ఇడియమ్‌ను దగ్గరగా నిలుపుతూ, ప్రతి నెల ప్రారంభంలో జరిగే అమావాస్య ఆచారాన్ని సూచిస్తుంది.
- source_word: תַּקְרִיבוּ
  choice: మీరు ... అర్పించాలి
  rationale: హిఫీల్ రూపంలోని קרב బలుల సందర్భంలో దేవుని సమక్షంలో బలిని సమర్పించడం లేదా అర్పించడం అని అర్థం; తెలుగులో ‘అర్పించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా దహించబడే బలి అనే స్థిరమైన ఆచార సంబంధ పదానికి ‘దహనబలి’ ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు సమానం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దేవుని నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించి, ל ఉపసర్గను ‘కు’తో తెలిపింది.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: మందలోని రెండు ఎద్దులు
  rationale: ఈ పదబంధం పశువుల మందకు చెందిన రెండు ఎద్దులను సూచిస్తుంది; హెబ్రీలో తప్పనిసరిగా లేని ‘యువ’ అనే భావాన్ని చేర్చలేదు.
- source_word: וְאַיִל אֶחָד
  choice: ఒక పొట్టేలు
  rationale: אַיִל అనే బలిపశువు పదానికి సహజమైన తెలుగు సమానం ‘పొట్టేలు’.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ఏడాది వయసుగల ఏడు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂיםలోని మగ లింగ నిర్దిష్టతను ‘మగ’తో నిలిపి, ‘ఒక సంవత్సరపు పిల్లలు’ అనే ఇడియమ్‌ను సహజమైన తెలుగులో ‘ఏడాది వయసుగల’గా ఇచ్చింది.
- source_word: תְּמִימִם
  choice: లోపంలేని
  rationale: బలి సందర్భంలో శారీరక దోషం లేదా కళంకం లేని పశువులను సూచించే పదాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నెలవారీ ఆచారాన్ని సూచించే కాలవాచక పదబంధం
  choice: మీ నెలల ఆరంభాల్లో
  alternative: మీ అమావాస్యలప్పుడు
  rationale: ప్రధాన పాఠం హెబ్రీ నిర్మాణాన్ని నిలుపుతుంది; అది అమావాస్య ఆచారాన్ని సూచిస్తుందనే సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపి, రెండింటినీ కలిపివేయకుండా ఉంచింది.
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచింది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. బలుల సంబంధ పదజాలంలో పరిచితమైన ‘దహనబలి’, ‘అర్పించాలి’ వాడబడ్డాయి. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో ఉంచబడింది.
