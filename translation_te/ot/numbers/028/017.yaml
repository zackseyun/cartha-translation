translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. విధి భావాన్ని సహజమైన ‘తినాలి’ రూపంతో తెలియజేశాం; పదార్థాన్ని మించి ఏ సంప్రదాయ-ప్రత్యేక వ్యాఖ్యానాన్నీ చేర్చలేదు.
