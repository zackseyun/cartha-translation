  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: te
  text: మరియు ఈ నెల పదిహేనవ రోజున పండుగ[a] ఉంటుంది; ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉత్సవం.’ హీబ్రూ పదం חָג పవిత్ర పండుగ ఆచరణను, పండుగ విందును కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: పదిహేనవ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగు క్రమసంఖ్యా రూపంలో ఇచ్చాం; וּ ను ముందున్న వాక్యంతో అనుసంధానించే భావంగా గ్రహించి తెలుగులో ప్రత్యేకంగా చూపలేదు.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: ఈ నెల
  rationale: పండుగల కాలపట్టిక సందర్భంలో חֹדֶשׁ అంటే ‘నెల’; ‘ఈ నెల’ అనేది స్పష్టమైన సహజ తెలుగు ప్రయోగం.
- source_word: חָג
  choice: పండుగ
  rationale: ఈ పదం పవిత్ర పండుగ ఆచరణను సూచిస్తుంది. సాధారణ పాఠకులకు ‘పండుగ’ సహజంగా అర్థమవుతుంది; ‘ఉత్సవం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పులియబెట్టే పదార్థం లేకుండా చేసిన రొట్టెలను సూచించే పారదర్శకమైన తెలుగు అనువాదం.
- source_word: יֵאָכֵל
  choice: తినాలి
  rationale: హీబ్రూ నిఫాల్ అసంపూర్ణ క్రియ ఇక్కడ ఆచరణకు సంబంధించిన నిర్దేశాన్ని తెలియజేస్తుంది. అక్షరార్థపు ‘తినబడాలి’ కంటే కర్తను పేర్కొనని ‘తినాలి’ ఆధునిక తెలుగులో సహజంగా అదే నిర్దేశక భావాన్ని అందిస్తుంది.
