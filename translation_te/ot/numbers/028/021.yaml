source:
  edition: WLC
  text: עִשָּׂר֤וֹן עִשָּׂרוֹן֙ תַּעֲשֶׂ֔ה לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד לְ/שִׁבְעַ֖ת הַ/כְּבָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: te
  text: ఆ ఏడు గొర్రెపిల్లలలో ప్రతి ఒక్కదానికి ఏఫాలో పదోవంతు చొప్పున సిద్ధం చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “పదోవంతు, పదోవంతు—ఒక గొర్రెపిల్లకు, ఆ ఏడు గొర్రెపిల్లలకు సిద్ధం చేయాలి” అని ఉంది. పదపునరుక్తి ప్రతి గొర్రెపిల్లకు ఒక పదోవంతు చొప్పున అనే భావాన్ని తెలియజేస్తుంది. ఇక్కడ ‘పదోవంతు’ అనేది ధాన్యార్పణకు వాడే ప్రామాణిక కొలత అయిన ఏఫాలో పదోవంతును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: తూములో పదోవంతు చొప్పున
  rationale: ఈ పదం ధాన్యార్పణ సందర్భంలో తూములో పదోవంతు కొలతను సూచిస్తుంది; పదపునరుక్తి ఒక్కొక్కదానికి విడివిడిగా అదే పరిమాణం అనే పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: సిద్ధం చేయాలి
  rationale: మూల క్రియ సాధారణంగా ‘చేయు’ అని అర్థమైనా, బలికి సంబంధించిన ధాన్య పరిమాణాన్ని ఏర్పాటుచేసే ఈ సందర్భంలో ‘సిద్ధం చేయాలి’ సహజంగా ఉంటుంది; ‘అర్పించాలి’ అనడం క్రియలో లేని నిర్దిష్ట భావాన్ని చేర్చుతుంది.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: పునరుక్త కొలతతో కలిసి ఈ ఏకవచన పదబంధం ప్రతి జంతువుకు విడిగా కేటాయింపును సూచిస్తుంది.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ఆ ఏడు గొర్రెపిల్లల్లో
  rationale: ఈ ఆదేశం వర్తించే మొత్తం ఏడు గొర్రెపిల్లల సమూహాన్ని స్పష్టంగా చూపిస్తూ, తెలుగులో సహజమైన పంపిణీ నిర్మాణాన్ని ఇస్తుంది.
