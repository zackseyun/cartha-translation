translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా పంపిణీ భావాన్ని ‘ఒక్కొక్క... చొప్పున’తో వ్యక్తం చేశాం. కొలతను సందర్భానుసారంగా ‘తూములో పదోవంతు’గా స్పష్టం చేశాం; మూలంలోని పునరుక్తి వివరాన్ని పాదసూచికలో నిలిపాం.
