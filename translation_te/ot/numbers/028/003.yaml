revisions:
- from: 'మీరు వారికి ఇలా చెప్పాలి: “యెహోవాకు మీరు అర్పించవలసిన అగ్ని అర్పణ[a] ఇదే: లోపంలేని, ఏడాది వయసున్న రెండు మగ గొర్రెపిల్లలను ప్రతిరోజూ క్రమంగా అర్పించే దహనబలిగా అర్పించాలి.”'
  to: 'మీరు వారికి ఇలా చెప్పాలి: “యాహ్వేకు మీరు అర్పించవలసిన అగ్ని అర్పణ[a] ఇదే: లోపంలేని, ఏడాది వయసున్న రెండు మగ గొర్రెపిల్లలను ప్రతిరోజూ నియమిత దహనబలిగా అర్పించాలి.”'
  rationale: The revision aligns the divine name with the current POB audit trail, removes an awkward repeated verb, and renders תָמִיד as “నియమిత” in its daily cultic sense. The footnote retains the relevant alternative for אִשֶּׁה without introducing a potentially confusing Telugu sacrificial label.
