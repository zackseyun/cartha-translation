id: NUM.28.3
reference: Numbers 28:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: te
  text: 'మీరు వారికి ఇలా చెప్పాలి: “యాహ్వేకు మీరు అర్పించవలసిన అగ్ని అర్పణ[a] ఇదే: లోపంలేని, ఏడాది వయసున్న రెండు మగ గొర్రెపిల్లలను ప్రతిరోజూ నియమిత దహనబలిగా అర్పించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్నిచే అర్పించే అర్పణ” లేదా “అగ్ని బలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: ఈ యాజక సంబంధ పదం అగ్నిపై అర్పించే అర్పణను సూచిస్తుంది. ‘అగ్ని అర్పణ’ మూలార్థాన్ని స్పష్టంగా ఉంచుతుంది; దేవుడు అక్షరార్థంగా ఆహారం తీసుకుంటాడనే అపార్థాన్ని కలిగించే ‘ఆహార అర్పణ’ను ప్రధాన పాఠ్యంలో నివారించింది.
- source_word: תַּקְרִיבוּ
  choice: మీరు అర్పించవలసిన
  rationale: קרב హిఫీల్ రూపం బలి సందర్భంలో దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది. తెలుగులో ‘అర్పించు’ సహజంగా ఉండి ఆచార సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో మార్చకుండా ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: כְּבָשִׂים
  choice: మగ గొర్రెపిల్లలను
  rationale: నామవాచకపు పుంలింగ రూపాన్ని, బలికి సంబంధించిన నిర్దిష్టతను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי שָׁנָה
  choice: ఏడాది వయసున్న
  rationale: ‘ఒక సంవత్సరపు పిల్లలు’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: תְמִימִם
  choice: లోపంలేని
  rationale: బలి జంతువులకు సంబంధించి శారీరక దోషం లేదా కళంకం లేనివని సూచించే స్పష్టమైన పదప్రయోగం.
- source_word: לַיּוֹם
  choice: ప్రతిరోజూ
  rationale: రోజుకు రెండు చొప్పున అర్పించాలనే విభజనాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలి పూర్తిగా దహించబడే ఆచారానికి తెలుగులో స్థిరపడిన, స్పష్టమైన పదం.
- source_word: תָמִיד
  choice: క్రమంగా అర్పించే
  rationale: ఇక్కడ నిరంతరాయంగా మండుతూనే ఉండడం కంటే నియమితంగా, రోజూ కొనసాగించే బలిని సూచిస్తుంది. అందువల్ల ‘నిరంతర’ అనే సంభావ్య అపార్థాన్ని నివారించింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: వచనం ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచింది; హీబ్రూ ఉచ్చారణ పునర్నిర్మాణాన్ని నిర్ణయాత్మకంగా ప్రకటించలేదు.
- issue: אִשֶּׁה యొక్క బలి సంబంధ భావం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదం అగ్నితో అర్పించే బలిని సూచిస్తుందని ప్రధాన పాఠ్యం తెలియజేస్తుంది. ‘ఆహారం’ అనే యాజక రూపకాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచింది.
- issue: תָמִיד యొక్క కాలభావం
  choice: క్రమంగా అర్పించే
  alternative: నిత్యమైన; నిరంతరమైన
  rationale: రోజువారీ నియమిత బలి అనే సందర్భార్థాన్ని ఎంచుకుంది; బలి చర్య ప్రతి క్షణమూ విరామం లేకుండా జరుగుతుందనే భావాన్ని రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలిని ఉపయోగించింది. ‘మగ గొర్రెపిల్లలు,’ ‘లోపంలేని,’ ‘ప్రతిరోజూ’ వంటి సాధారణ పాఠకులకు స్పష్టమైన పదాలను ఎంచుకుంది. మూలంలోని ఆజ్ఞాత్మక భావాన్ని ‘అర్పించవలసిన,’ ‘అర్పించాలి’ రూపాలతో నిలిపింది.
