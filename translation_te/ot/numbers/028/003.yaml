    text: లేదా, “అగ్నిచే అర్పించే అర్పణ” లేదా “అగ్ని బలి.”
    reason: lexical_alternative
  revision_rationale: The revision aligns the divine name with the current POB audit trail, removes an awkward repeated verb, and renders תָמִיד as “నియమిత” in its daily cultic sense. The footnote retains the relevant alternative for אִשֶּׁה without introducing a potentially confusing Telugu sacrificial label.
