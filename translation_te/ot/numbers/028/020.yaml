source:
  edition: WLC
  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: te
  text: 'వాటి ధాన్యార్పణ కోసం నూనెతో కలిపిన సన్నని పిండిని సిద్ధం చేయాలి: ఎద్దుకు మూడు పదోవంతులు[a], పొట్టేలుకు రెండు పదోవంతులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “మూడు పదోవంతులు,” “రెండు పదోవంతులు” అంటే ఏఫాలోని పదోవంతులని హెబ్రీ సంక్షిప్తంగా చెబుతోంది. ఏఫా పొడి పదార్థాలను కొలిచే కొలమానం; బలి నియమాల్లో దీన్ని ఉపయోగించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: వాటి ధాన్యార్పణగా
  rationale: బలి సంబంధ సందర్భంలో מִנְחָה సాధారణ అర్పణకన్నా ధాన్యార్పణను సూచిస్తుంది. 3వ పురుష బహువచన ప్రత్యయం ముందున్న బలి జంతువులను సమష్టిగా సూచిస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ఇది అర్పణల కోసం ఉపయోగించే సన్నగా మరపట్టిన నాణ్యమైన పిండికి ప్రామాణిక హెబ్రీ పదం; ఆధునిక తెలుగులో ‘మెత్తని పిండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెను పిండితో కలిపి సిద్ధం చేసిన స్థితిని ఈ నిష్క్రియార్థక పదబంధం తెలియజేస్తుంది.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: మూడు పదోవంతులు
  rationale: עִשָּׂרוֹן అనేది ఏఫాలో పదోవంతు కొలత; మూలంలోని సంక్షిప్త రూపాన్ని ప్రధాన వాక్యంలో నిలిపి, కొలతను పాదసూచికలో వివరించాం.
- source_word: לַפָּר
  choice: ఎద్దుకు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఏకవచనం సందర్భంలో ముందే పేర్కొన్న ఎద్దును సూచిస్తుంది.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదోవంతులు
  rationale: ముందటి కొలతకు సమాంతరంగా అదే పదప్రయోగాన్ని నిలిపాం.
- source_word: לָאַיִל
  choice: పొట్టేలుకు
  rationale: ఇది బలిగా అర్పించే మగ గొర్రెను సూచిస్తుంది; ‘పొట్టేలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: תַּעֲשׂוּ
  choice: సిద్ధం చేయాలి
  rationale: עשה ప్రాథమికంగా ‘చేయు’ అనే విస్తృతార్థం కలది; బలి నియమ సందర్భంలో ‘సిద్ధం చేయాలి’ చర్యను సహజంగా తెలియజేస్తూ, మూలంలో స్పష్టంగా లేని ‘అర్పించాలి’ అనే భావాన్ని అదనంగా చేర్చదు.
