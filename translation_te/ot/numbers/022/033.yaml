  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: te
  text: ఆ గాడిద నన్ను చూసి, ఈ మూడుసార్లూ నా ఎదుట నుంచి పక్కకు తొలగింది. అది నా ఎదుట నుంచి పక్కకు తొలగకపోయి ఉంటే[a], ఈపాటికి నిన్ను చంపి, దాన్ని మాత్రం బతకనిచ్చేవాడిని.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “బహుశా అది నా ఎదుట నుంచి పక్కకు తొలగింది.” అయితే సందర్భం, తరువాతి వాక్యం ప్రకారం దీనిని సాధారణంగా “అది నా ఎదుట నుంచి పక్కకు తొలగకపోయి ఉంటే” అనే ప్రతికల్పనాత్మక షరతుగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: నన్ను చూసి
  rationale: ראה ఇక్కడ ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చూసి’ సహజమైన, స్పష్టమైన రూపం.
- source_word: הָאָתוֹן
  choice: ఆ గాడిద
  rationale: אָתוֹן ఆడ గాడిదను సూచించినా, తెలుగులో సందర్భానుసారంగా ‘గాడిద’ సహజంగా ఉంటుంది; అవసరం లేని చోట లింగాన్ని విడిగా చేర్చలేదు.
- source_word: וַתֵּט לְפָנַי
  choice: నా ఎదుట నుంచి పక్కకు తొలగింది
  rationale: נטה అంటే దారి నుంచి పక్కకు మళ్లడం లేదా తొలగడం. לְפָנַיలోని దేవదూత ఎదుట ఉన్న స్థలసంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ఈ మూడుసార్లూ
  rationale: ఇది మూడు సందర్భాలను సూచించే హీబ్రూ ప్రయోగం; ‘ఈ మూడుసార్లూ’ పునరావృతిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: అది నా ఎదుట నుంచి పక్కకు తొలగకపోయి ఉంటే
  rationale: పాఠంలో స్పష్టమైన నిరాకరణ లేకపోయినా, తరువాతి ఫలిత వాక్యంతో కలిపి ఇది ప్రతికల్పనాత్మక షరతుగా అర్థమవుతుంది. ఆ భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి నిరాకరణను వ్యక్తం చేసి, పాఠ సమస్యను పాదసూచికలో నమోదు చేశాం.
- source_word: כִּי עַתָּה
  choice: ఈపాటికి
  rationale: తక్షణ ఫలితాన్ని, ‘ఇప్పటికే/ఈలోగా’ అనే కాలబలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: גַּם אֹתְךָה הָרַגְתִּי
  choice: నిన్ను చంపి
  rationale: ప్రతికల్పనాత్మక ఫలితాన్ని తెలుగులో చివరి క్రియారూపమైన ‘బతకనిచ్చేవాడిని’తో కలిపి వ్యక్తం చేశాం; గַּם ఇచ్చే వ్యత్యాస బలం ‘నిన్ను ... దాన్ని మాత్రం’ నిర్మాణంలో నిలిచింది.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: దాన్ని మాత్రం బతకనిచ్చేవాడిని
  rationale: חיה హిఫీల్ రూపం ‘బతకనివ్వడం/సజీవంగా ఉంచడం’ అనే భావం ఇస్తుంది. ‘మాత్రం’ బిలాము చనిపోవడం, గాడిద బతకడం మధ్య వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
theological_decisions:
- issue: אוּלַי తరువాత స్పష్టమైన నిరాకరణ లేకపోయినా వాక్యం ప్రతికల్పనాత్మకంగా కనిపించడం
  choice: ‘అది ... పక్కకు తొలగకపోయి ఉంటే’ అని అనువదించడం
  alternative: ‘బహుశా అది నా ఎదుట నుంచి పక్కకు తొలగింది’ అని అక్షరార్థంగా అనువదించడం
  rationale: కథన తర్కం ప్రకారం గాడిద పక్కకు తొలగడమే బిలాము మరణాన్ని నివారించింది. నిరాకరణ లేకుండా అక్షరార్థంగా అనువదిస్తే తరువాతి మాటకు విరుద్ధమైన భావం వస్తుంది. అందువల్ల సందర్భం కోరే ప్రతికల్పనాత్మక భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, హీబ్రూ రూపాన్ని పాదసూచికలో పారదర్శకంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘ఈపాటికి,’ ‘బతకనిచ్చేవాడిని’ వంటి సహజ రూపాలు వాడబడ్డాయి. గాడిదకు తెలుగులో కృత్రిమ స్త్రీలింగ సర్వనామాన్ని రుద్దకుండా ‘అది/దాన్ని’ వాడాం; మూలంలోని వ్యత్యాసాన్ని ‘మాత్రం’తో నిలిపాం.
