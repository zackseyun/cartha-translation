  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: te
  text: ఆ ఆడ గాడిద యహ్వే దూతను[a] చూసినప్పుడు, బిలాము కింద పడుకుంది. అప్పుడు బిలాముకు కోపం మండింది; అతడు తన కర్రతో ఆ గాడిదను కొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యహ్వే సందేశవాహకుణ్ణి.’ ఇక్కడ సందర్భం అతీంద్రియ దూతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: ఆ ఆడ గాడిద
  rationale: אָתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది. తెలుగులో ‘ఆడ గాడిద’ అనడం మూలంలోని లింగ నిర్దిష్టతను సహజంగా నిలుపుతుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యహ్వే దూత
  rationale: מַלְאָךְ అంటే ‘దూత/సందేశవాహకుడు’; ఈ సందర్భంలో అతీంద్రియ దూత ఉద్దేశించబడ్డాడు. ‘దూత’ అనే తెలుగు పదం సందర్భానుకూలంగా ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తూ మూలపదపు విస్తృతిని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: וַתִּרְבַּץ
  choice: పడుకుంది
  rationale: רבץ యొక్క ప్రాథమిక భావం పడుకోవడం లేదా నేలపై ఒదగడం. ‘పడుకుంది’ చర్యను స్పష్టంగా చెబుతుంది; ‘కూలిపోయింది’ అనే అనవసర భావాన్ని చేర్చదు.
- source_word: תַּחַת בִּלְעָם
  choice: బిలాము కిందనే
  rationale: תַּחַת అంటే ‘కింద/క్రింద.’ బిలాము దానిపై స్వారీ చేస్తున్నందున ‘బిలాము కిందనే’ సహజమైన, సందర్భోచిత అనువాదం.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: బిలాముకు కోపం మండింది
  rationale: హీబ్రూ జాతీయాన్ని తెలుగులో సహజమైన ‘కోపం మండింది’తో వ్యక్తం చేసి, కోపం తీవ్రతను నిలిపాం.
- source_word: וַיַּךְ
  choice: కొట్టాడు
  rationale: נכה ఇక్కడ ఒక దెబ్బ కొట్టడాన్ని సూచిస్తుంది. ‘కొట్టాడు’ నేరుగా, సహజంగా ఉంటుంది; పదేపదే చితకబాదాడనే అదనపు భావాన్ని ఇవ్వదు.
- source_word: בַּמַּקֵּל
  choice: తన కర్రతో
  rationale: מַקֵּל కర్ర లేదా చేతికర్రను సూచిస్తుంది. సందర్భం ద్వారా అది బిలాముదని స్పష్టమైనందున తెలుగులో సహజత్వం కోసం ‘తన’ చేర్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: מַלְאַךְ ను దూతగా లేదా సందేశవాహకుడిగా అర్థం చేసుకోవడం
  choice: దూత
  alternative: సందేశవాహకుడు
  rationale: ఈ కథనంలో కనిపిస్తున్న వ్యక్తి అతీంద్రియ దూత అని సందర్భం సూచిస్తుంది. అయినా మూలపదంలోని ‘సందేశవాహకుడు’ అనే ప్రాథమిక విస్తృతిని పాదటిప్పణిలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, చర్యల క్రమాన్ని మరియు మూలంలోని తీవ్రతను కాపాడాం.
