  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: te
  text: ఆడ గాడిద యెహోవా దేవదూతను[a] చూసి, గోడకు ఒత్తుకుపోయి బిలాము పాదాన్ని గోడకు అదిమింది. దాంతో అతడు దానిని మళ్లీ కొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా దూతను.’ మַלְאַךְ అనే పదానికి ‘దూత’ అనే అర్థమూ ఉంది; అయితే ఈ సందర్భంలో అతీంద్రియ దేవదూత ఉద్దేశించబడ్డాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: ఆడగాడిద
  rationale: אָתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది; తెలుగులో సహజంగా, స్పష్టంగా ‘ఆడగాడిద’ అని అనువదించబడింది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో ఆ దూత అతీంద్రియ వ్యక్తి అయినప్పటికీ, మూలపదంలోని విస్తృత అర్థాన్ని నిలుపుకోవడానికి ప్రధాన పాఠంలో ‘దూత’ ఉంచబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: గోడకు ఒత్తుకుపోయి
  rationale: ఈ రూపం గాడిద గోడవైపు వెళ్లి దానికి గట్టిగా ఒత్తుకున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: బిలాము పాదాన్ని గోడకు అదిమింది
  rationale: అదే לחץ ధాతువు ఇక్కడ బిలాము పాదాన్ని గోడకు నొక్కిపెట్టిన ఫలితాన్ని సూచిస్తుంది; ‘అదిమింది’ ఆ భౌతిక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: רֶגֶל
  choice: పాదం
  rationale: ఈ సందర్భంలో רֶגֶלకు సహజమైన నిర్దిష్ట అర్థం ‘పాదం’.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: దానిని మళ్లీ కొట్టాడు
  rationale: יסף + క్రియార్థక రూపం చర్య పునరావృతిని సూచిస్తుంది; ‘మళ్లీ కొట్టాడు’ దానిని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: מַלְאַךְ יְהוָה యొక్క అనువాదం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: కథనంలో ఈ వ్యక్తి అతీంద్రియుడని స్పష్టమైనా, מַלְאַךְ యొక్క ప్రాథమిక అర్థం ‘దూత’. అందువల్ల ప్రధాన పాఠం మూలంలోని పదార్థ విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: దైవనామం יהוה యొక్క రూపం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే ఉంచుతూ, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. వరుసగా వచ్చిన לחץ ధాతువు ప్రయోగాలను తెలుగులో సహజంగా ఉండేందుకు ‘ఒత్తుకుపోయి’, ‘అదిమింది’ అనే సంబంధిత భౌతిక క్రియలతో వ్యక్తం చేశాం; మూలంలోని సంఘటనల క్రమాన్ని కాపాడాం.
