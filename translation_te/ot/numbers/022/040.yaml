revisions:
- from: బాలాకు పశువులను, గొర్రెలు-మేకలను[a] బలిగా అర్పించి, వాటిలో కొంత[b] బిలాముకు, అతనితో ఉన్న అధికారులకు పంపించాడు.
  to: బాలాకు పెద్ద పశువులనూ, గొర్రెలు మేకల మందనూ[a] బలిగా అర్పించి, వాటిలో కొంతను[b] బిలాముకు, అతనితో ఉన్న అధికారులకు పంపించాడు.
  rationale: The revision retains the source’s sacrificial and narrative sense while more clearly differentiating cattle from flock/small livestock in natural modern Telugu. It preserves the contextual, rather than explicit, inference that portions of the sacrificed animals were sent, with that inference retained in a properly anchored footnote.
