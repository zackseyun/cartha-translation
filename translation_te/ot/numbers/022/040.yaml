source:
  edition: WLC
  text: וַ/יִּזְבַּ֥ח בָּלָ֖ק בָּקָ֣ר וָ/צֹ֑אן וַ/יְשַׁלַּ֣ח לְ/בִלְעָ֔ם וְ/לַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: te
  text: బాలాకు పెద్ద పశువులనూ, గొర్రెలు మేకల మందనూ[a] బలిగా అర్పించి, వాటిలో కొంతను[b] బిలాముకు, అతనితో ఉన్న అధికారులకు పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొర్రెలు మేకల మంద’ అని అనువదించిన హీబ్రూ పదం చిన్న పశువుల మందను సూచిస్తుంది; దానిలో గొర్రెలతో పాటు మేకలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘పంపించాడు.’ అయితే బలి అర్పించిన జంతువుల సందర్భాన్ని బట్టి వాటి మాంసంలో కొంతను లేదా బలి భాగాలను పంపించాడని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: బలిగా అర్పించి
  rationale: זבח అనే క్రియ బలి కోసం జంతువులను వధించడాన్ని సూచిస్తుంది. ‘బలిగా అర్పించి’ అనే పదబంధం కేవలం వధించడం కాక ఆచార సంబంధమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בָּקָר
  choice: పశువులను
  rationale: בקר అనేది సమూహార్థకంగా గోవుల జాతికి చెందిన పెద్ద పశువులను సూచిస్తుంది. సందర్భంలో గొర్రెలు-మేకలతో జతగా రావడం వల్ల ‘పశువులు’ సహజంగా ఉంది.
- source_word: צֹאן
  choice: గొర్రెలు-మేకలను[a]
  rationale: צאן చిన్న పశువుల మందను, ముఖ్యంగా గొర్రెలను మరియు మేకలను కలిపి సూచించగలదు. అందువల్ల కేవలం ‘గొర్రెలు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: וַיְשַׁלַּח
  choice: వాటిలో కొంత[b] ... పంపించాడు
  rationale: క్రియకు అక్షరార్థంగా ‘పంపించాడు’ అని మాత్రమే ఉన్నా, బలి జంతువుల సందర్భం పంపబడింది వాటిలోని కొంత భాగమని సూచిస్తుంది. భావం స్పష్టమయ్యేలా ‘వాటిలో కొంత’ చేర్చి, మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో తెలిపాం.
- source_word: לְבִלְעָם
  choice: బిలాముకు
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరంగా వినిపించే ‘బిలాము’ రూపంలో లిప్యంతరీకరించి, గమ్యార్థక విభక్తి జోడించాం.
- source_word: לַשָּׂרִים
  choice: అధికారులకు
  rationale: שׂרים ఉన్నత హోదా గల నాయకులను లేదా అధికారులను సూచిస్తుంది. వంశపారంపర్య రాజకుమారులనే భావం కలిగించకుండా ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘అధికారులు’ ఎంచుకున్నాం.
- source_word: אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న
  rationale: ఏకవచన సర్వనామ ప్రత్యయం సమీపంలోని బిలామును సహజంగా సూచిస్తుంది. అయితే మూలంలో పేరును మళ్లీ చెప్పకుండా సర్వనామమే ఉన్నందున తెలుగులో కూడా ‘అతనితో’ అని ఉంచాం.
