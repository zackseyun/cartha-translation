translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని బలి సంబంధ భావాన్ని నిలిపి, צאן యొక్క విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో చూపించాం. וַיְשַׁלַּח యొక్క కర్మ మూలంలో స్పష్టంగా లేకపోవడాన్ని పాదటిప్పణితో వెల్లడించాం.
