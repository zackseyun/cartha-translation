  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: te
  text: తరువాత ఇశ్రాయేలు కుమారులు బయలుదేరి, యెరికోకు ఎదురుగా[a], యొర్దాను అవతల[b] ఉన్న మోయాబు మైదానాల్లో[c] శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెరికో ఇక్కడ మోయాబు మైదానాల స్థానాన్ని సూచించే భౌగోళిక ఆనవాలు; అవి యొర్దాను తూర్పు వైపున, యెరికోకు ఎదురుగా ఉన్నాయి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘యొర్దానుకు ఆవల.’ ఈ పదబంధం కథకుని భౌగోళిక దృష్టికోణాన్ని బట్టి ‘యొర్దాను అవతల’ లేదా ‘యొర్దాను ఆవలి వైపున’ అని అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘మైదానాలు’ అని అనువదించిన హీబ్రూ పదం విశాలమైన మైదాన లేదా మైదాన-మెట్ట ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ సందర్భంలో נסע శిబిరాన్ని ఎత్తి తదుపరి ప్రదేశానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థమైన రూపాన్ని నిలుపుతూ, ఇది ఇశ్రాయేలు జనాన్ని సమష్టిగా సూచించే ప్రామాణిక జాతీయ సంబోధనగా అర్థమయ్యేలా ఉంచబడింది.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అంటే ఒక ప్రదేశంలో మకాం లేదా శిబిరం వేయడం; ఈ తెలుగు ప్రయోగం సహజమైనది, స్పష్టమైనది.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עַרְבוֹת విశాలమైన మైదాన లేదా మైదాన-మెట్ట ప్రాంతాన్ని సూచిస్తుంది; ‘మైదానాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి భౌగోళిక భావాన్ని కాపాడుతుంది.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: ఈ పదబంధం కథకుని భౌగోళిక దృష్టికోణానికి అనుసంధానంగా యొర్దానుకు అవతలి వైపును సూచిస్తుంది; దిశను అవసరానికి మించి నిర్దిష్టం చేయకుండా సంబంధాన్ని కాపాడుతుంది.
- source_word: יְרֵחוֹ
  choice: యెరికోకు ఎదురుగా
  rationale: ఇక్కడ యెరికో, యొర్దాను తూర్పున ఉన్న శిబిరస్థలాన్ని గుర్తించే ఎదురువైపు ఆనవాలుగా పనిచేస్తుంది. హీబ్రూలోని సంక్షిప్త భౌగోళిక నిర్మాణాన్ని తెలుగులో స్పష్టంగా అందించేందుకు ‘ఎదురుగా’ ఉపయోగించబడింది.
