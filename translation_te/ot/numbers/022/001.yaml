translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపాన్ని జాతీయ సమష్టి సంబోధనగా నిలుపుకున్నాం. భౌగోళిక సంబంధం స్పష్టంగా ఉండేందుకు ‘యెరికోకు ఎదురుగా’ ప్రధాన పాఠ్యంలో ఉంచబడింది; కథకుని దృష్టికోణ సంబంధిత అస్పష్టతను పాదసూచనలో కాపాడాం.
