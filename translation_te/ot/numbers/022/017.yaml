translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. బాలాకు బిలాముతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు’ వాడబడింది. ప్రధాన పాఠ్యంలో గౌరవం అనే మూలార్థం నిలుపబడి, బహుమతి అనే సందర్భార్థం పాదటిప్పణిలో ఇవ్వబడింది.
