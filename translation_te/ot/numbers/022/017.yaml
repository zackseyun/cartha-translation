- from: ఎందుకంటే, నేను నిన్ను ఎంతో ఘనపరుస్తాను[a]; నువ్వు నాతో ఏది చెప్పినా చేస్తాను. కాబట్టి దయచేసి వచ్చి, నా కోసం ఈ ప్రజలను శపించు.”
  to: ఎందుకంటే నేను మిమ్మల్ని ఎంతో గౌరవిస్తాను[a]; మీరు నాతో చెప్పినదంతా చేస్తాను. కాబట్టి దయచేసి వచ్చి, నా కోసం ఈ ప్రజలను శపించండి.
