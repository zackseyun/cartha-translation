source:
  edition: WLC
  text: כִּֽי כַבֵּ֤ד אֲכַבֶּדְ/ךָ֙ מְאֹ֔ד וְ/כֹ֛ל אֲשֶׁר תֹּאמַ֥ר אֵלַ֖/י אֶֽעֱשֶׂ֑ה וּ/לְכָ/ה נָּא֙ קָֽבָ/ה לִּ֔/י אֵ֖ת הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: te
  text: ఎందుకంటే నేను మిమ్మల్ని ఎంతో గౌరవిస్తాను[a]; మీరు నాతో చెప్పినదంతా చేస్తాను. కాబట్టి దయచేసి వచ్చి, నా కోసం ఈ ప్రజలను శపించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మిమ్మల్ని తప్పక ఎంతో గౌరవిస్తాను”; సందర్భానుసారంగా, “నేను మీకు గొప్ప బహుమతి ఇస్తాను” అని కూడా అర్థం కావచ్చు. హెబ్రీలో బలాన్ని తెలియజేయడానికి క్రియ యొక్క అనంతరూపాన్ని పరిమిత క్రియతో కలిపి వాడారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: బాలాకు తాను మళ్లీ చేస్తున్న విజ్ఞప్తికి ఆధారంగా తన వాగ్దానాలను చెబుతున్నాడు; తెలుగు వాక్యప్రవాహంలో కారణార్థాన్ని సహజంగా చూపుతుంది.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: నేను నిన్ను ఎంతో ఘనపరుస్తాను
  rationale: כבד మూలంలోని గౌరవార్థాన్ని నిలుపుతూ, infinitive absolute తో finite verb కలయికలోని బలమైన నిశ్చయాన్ని ‘ఎంతో’ ద్వారా వ్యక్తం చేస్తుంది. సందర్భంలో గొప్ప బహుమతి ఇవ్వడం కూడా సూచితమై ఉండవచ్చు.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: నువ్వు నాతో ఏది చెప్పినా చేస్తాను
  rationale: כֹל אֲשֶׁר యొక్క సమగ్ర పరిధిని సహజమైన ఆధునిక తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: וּלְכָה נָּא
  choice: కాబట్టి దయచేసి వచ్చి
  rationale: లְכָה లోని రమ్మనే ఆజ్ఞను, נָא లోని వినయపూర్వకమైన వేడుకోలును వ్యక్తం చేస్తూ, ముందున్న వాగ్దానాలతో విజ్ఞప్తిని అనుసంధానిస్తుంది.
- source_word: קָבָה לִּי
  choice: నా కోసం ... శపించు
  rationale: క్రియ ఇక్కడ శాపం పలకడాన్ని సూచిస్తుంది; לִּי బాలాకు స్వప్రయోజనం కోసం ఈ చర్య కోరుతున్నాడని స్పష్టపరుస్తుంది.
- source_word: אֵת הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: עָם యొక్క సమూహార్థాన్ని తెలుగులో సహజంగా ‘ప్రజలు’ రూపంలో అందిస్తుంది.
