id: NUM.22.19
reference: Numbers 22:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: te
  text: ఇప్పుడు మీరు కూడా దయచేసి ఈ రాత్రి ఇక్కడే ఉండండి; యాహ్వే నాతో ఇంకా ఏమి మాట్లాడతాడో నేను తెలుసుకుంటాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నాకు ఇంకేమి చెబుతాడో.”
    reason: దַּבֵּר עִמִּי (‘నాతో మాట్లాడతాడు’) అనే పదబంధాన్ని సందేశాన్ని అందించడంపై దృష్టి పెట్టి అనువదించే సహజ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సంభాషణలో తదుపరి సూచనను ప్రవేశపెడుతుంది; సందర్భంలోని అనుసంధానాన్ని ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది.
- source_word: שְׁבוּ נָא
  choice: దయచేసి ... ఉండండి
  rationale: ישׁב ఇక్కడ కూర్చోవడం కంటే ఉండిపోవడం అనే సందర్భార్థాన్ని ఇస్తుంది; נָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’ వ్యక్తం చేస్తుంది.
- source_word: בָזֶה
  choice: ఇక్కడే
  rationale: స్థలసూచక ప్రయోగం; ‘ఇక్కడే’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: גַּם אַתֶּם
  choice: మీరు కూడా
  rationale: మునుపటి దూతల మాదిరిగానే వీరూ ఉండాలని చెప్పే సముచ్చయ నొక్కును నిలుపుతుంది.
- source_word: הַלָּיְלָה
  choice: ఈ రాత్రి
  rationale: రాబోయే రాత్రిని సూచించే కాలవాచక ప్రయోగం; తెలుగులో ‘ఈ రాత్రి’ సహజం.
- source_word: וְאֵדְעָה
  choice: నేను తెలుసుకుంటాను
  rationale: కోహోర్టేటివ్ రూపంలోని ఉద్దేశ్య/ఆశాభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ముందరి అభ్యర్థన ఫలితంగా తెలుసుకోవడాన్ని సూచిస్తుంది.
- source_word: מַה יֹּסֵף
  choice: ఇంకా ఏమి
  rationale: יסף యొక్క అదనపు లేదా తదుపరి చర్య భావాన్ని ‘ఇంకా ఏమి’ కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ప్రత్యక్ష నామరూపంతో అందిస్తుంది.
- source_word: דַּבֵּר עִמִּי
  choice: నాతో ... మాట్లాడతాడో
  rationale: עִם యొక్క ‘తో’ భావాన్ని నిలుపుతూ, దైవ సందేశాన్ని తెలియజేసే సందర్భంలో సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు. ఆధునిక ప్రామాణిక తెలుగులో ‘యెహోవా’ విస్తృతంగా గుర్తించబడే రూపం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: దేవుడు ఇంకా ఏమి చెబుతాడనే బిలాము మాటలోని ఉద్వేగం
  choice: యెహోవా నాతో ఇంకా ఏమి మాట్లాడతాడో
  alternative: యెహోవా నాకు మరేమి చెబుతాడో
  rationale: దేవుని ముందరి ఆదేశం ఉన్నప్పటికీ బిలాము మరొక సందేశం కోసం ఎదురుచూస్తున్న కథన ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచుతుంది; עִמִּי లోని ‘నాతో’ భావాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. వాక్యం సహజంగా ఉండేలా విభజించబడినా, మూలంలోని ‘మీరు కూడా,’ ‘ఈ రాత్రి,’ ‘ఇంకా ఏమి’ అనే నొక్కులు నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
