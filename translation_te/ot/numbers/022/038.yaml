source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: te
  text: 'బిలాము బాలాకుతో ఇలా అన్నాడు: “ఇదిగో, ఇప్పుడు నేను నీ దగ్గరికి వచ్చాను. నిజంగా నేను ఏమైనా మాట్లాడగలనా?[a] దేవుడు నా నోట ఉంచే మాటనే నేను మాట్లాడుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అసలు ఏమైనా చెప్పగలనా?” సామర్థ్యాన్ని సూచించే హెబ్రీ క్రియారూపం బలవచనంగా ఉపయోగించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: బిలాము ప్రతిస్పందనలోని సూచనాత్మక బలాన్ని, గంభీరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: ఇప్పుడు నేను నీ దగ్గరికి వచ్చాను
  rationale: పూర్తయిన రాకను, עַתָּה తెలిపే ప్రస్తుత తక్షణతను సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: הֲיָכוֹל אוּכַל
  choice: అసలు నేను ... మాట్లాడగలనా?
  rationale: అనంత క్రియారూపంతో పరిమిత క్రియారూపం కలిసిన హెబ్రీయ బలవచనాన్ని ‘అసలు ... గలనా?’ అనే ప్రశ్న ద్వారా వ్యక్తం చేస్తుంది.
- source_word: דַּבֵּר מְאוּמָה
  choice: ఏమైనా మాట్లాడగలనా
  rationale: מְאוּמָה లోని ‘ఏదైనా సరే’ అనే విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: ప్రవచన సందర్భంలో దేవుడు ఇచ్చే నిర్దిష్ట ఉచ్చారణను సూచిస్తూ, ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: దేవుడు నా నోట ఉంచే
  rationale: దైవంగా ఇవ్వబడిన పలుకును సూచించే మూలభాషా రూపకాన్ని యథాతథంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: మాటనే నేను మాట్లాడుతాను
  rationale: ‘నే’ అనే అవధారణ ప్రత్యయం ముందుంచబడిన కర్మలోని ప్రత్యేక పరిమితిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపం బహువచనాకారంలో ఉన్నా, ఏకవచన క్రియతో వచ్చినందున సందర్భానుసారంగా ఏకవచన ‘దేవుడు’ సరైనది.
theological_decisions:
- issue: బిలాము మాటలపై దేవుని నియంత్రణ
  choice: బిలాము తనంతట తాను ఏమీ చెప్పలేడని, దేవుడు తన నోట ఉంచే మాటనే పలుకుతాడని వాక్యం తెలియజేస్తుంది.
  alternative: బిలాము తనకు ఇష్టమైనది చెప్పగలిగినా స్వచ్ఛందంగా దేవుని మాటకే పరిమితం కావాలని నిర్ణయించుకున్నాడు.
  rationale: הֲיָכוֹל אוּכַל అనే బలవచన ప్రశ్నతో పాటు אֹתוֹ אֲדַבֵּר లోని అవధారణ, కేవలం వ్యక్తిగత ఇష్టాన్ని కాక పరిమితమైన ప్రవచన వాక్కును సూచిస్తాయి. అయితే దైవ ప్రేరణ ఎలా పనిచేస్తుందో అనవసరంగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘ఇదిగో’ మూలంలోని సూచనాత్మక బలాన్ని నిలుపుతుంది; ‘మాటనే’ దైవంగా ఇచ్చిన మాటకే ఉన్న పరిమితిని సంక్షిప్తంగా తెలియజేస్తుంది. ‘నా అంతట నేనుగా’ మూలంలోని సామర్థ్య ప్రశ్నను సందర్భానుగుణంగా స్పష్టం చేస్తుంది; దానిపై ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
