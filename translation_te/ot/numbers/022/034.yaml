id: NUM.22.34
reference: Numbers 22:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: te
  text: 'అప్పుడు బిలాము యెహోవా దూతతో[a] ఇలా అన్నాడు: “నేను పాపం చేశాను. నీవు దారిలో నాకు ఎదురుగా నిలబడి ఉన్నావని నాకు తెలియలేదు. ఇప్పుడు ఇది నీ దృష్టికి చెడ్డదైతే[b], నేను వెనక్కి తిరిగి వెళ్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా దేవదూతతో.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇది నీ కళ్లలో చెడ్డదైతే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అతీంద్రియ వ్యక్తి ఉద్దేశించబడినప్పటికీ, ‘దూత’ మూలపదంలోని సందేశవాహక భావాన్నీ దాని సహజమైన తెలుగు బైబిలు వాడుకనూ నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తినామంగా అందించాం.
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: పూర్తయిన క్రియను, ప్రస్తుత ఒప్పుకోలు సందర్భంలో సహజమైన తెలుగు వాక్యంగా అనువదించాం.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: నాకు తెలియలేదు
  rationale: כִּי ఇక్కడ వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో రెండు వరుస వాక్యాల అనుసంధానమే ఆ కారణసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נִצָּב לִקְרָאתִי
  choice: నాకు ఎదురుగా నిలబడి ఉన్నావు
  rationale: נִצָּב లోని స్థిరంగా నిలిచిన భావాన్నీ, לִקְרָאתִי లో సందర్భం సూచించే ప్రతిఘటన/ఎదురుపడే భావాన్నీ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: בַּדָּרֶךְ
  choice: దారిలో
  rationale: ప్రయాణ సందర్భానికి సరిపోయే సరళమైన స్థానవాచక రూపం.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: ఇది నీ దృష్టికి చెడ్డదైతే
  rationale: ‘నీ కళ్లలో చెడ్డది’ అనే హీబ్రూ నుడికారాన్ని అర్థమయ్యే తెలుగులో దాదాపు యథాతథంగా ఉంచి, దాని నైతిక బరువును తగ్గించలేదు.
- source_word: אָשׁוּבָה לִּי
  choice: నేను వెనక్కి తిరిగి వెళ్తాను
  rationale: కోహోర్టేటివ్ రూపంలోని సంకల్పం లేదా సిద్ధతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; לִּי కి ప్రత్యేక పదరూపం అవసరం లేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను వాడాం; దీనితో ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చలేదు.
- issue: מַלְאַךְ ను దూతగా లేదా దేవదూతగా గ్రహించడం
  choice: ప్రధాన పాఠంలో ‘దూత’
  alternative: దేవదూత
  rationale: సందర్భంలో అతీంద్రియ స్వరూపం స్పష్టమైనా, మూలపదం విస్తృతంగా ‘సందేశవాహకుడు/దూత’ అని అర్థమవుతుంది. ప్రధాన పాఠం ఆ పదవిస్తృతిని కాపాడుతుంది; పాదటిప్పణి సందర్భోచిత ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ శైలిని ఉపయోగించాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో సహజీకరించి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
