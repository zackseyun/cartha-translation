id: NUM.22.24
reference: Numbers 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: te
  text: అప్పుడు యాహ్వే దేవదూత[a] ద్రాక్షతోటల మధ్య ఉన్న ఇరుకైన దారిలో నిలబడ్డాడు; దానికి ఇటువైపు ఒక గోడ, అటువైపు ఒక గోడ ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దూత.’ హీబ్రూ పదానికి ‘దూత’ లేదా ‘సందేశవాహకుడు’ అనే అర్థం రావచ్చు; అయితే ఈ కథన సందర్భంలో అతీంద్రియ దేవదూత ఉద్దేశించబడ్డాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: అప్పుడు ... నిలబడ్డాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది, ‘నిలబడ్డాడు’ עמד యొక్క ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారంగా ‘దేవదూత’ అనే భావం రావచ్చు. ఈ కథనంలో అతీంద్రియ వ్యక్తి ఉద్దేశించబడినప్పటికీ, ‘దూత’ మూలపదంలోని నిజమైన పదార్థ విస్తృతిని నిలుపుతుంది; పాదసూచిక సందర్భార్థాన్ని వివరిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: ద్రాక్షతోటల మధ్యనున్న ఇరుకైన దారిలో
  rationale: מִשְׁעוֹל ఇరుకైన బాట లేదా సందును సూచిస్తుంది. తరువాత రెండు వైపులా గోడలున్నాయని చెప్పడం వల్ల, ద్రాక్షతోటల మధ్యనున్న ఇరుకైన దారి అనే స్థలచిత్రణ సహజంగా సరిపోతుంది.
- source_word: גָּדֵר
  choice: గోడ
  rationale: ఈ పదం చుట్టూ వేసిన గోడను లేదా కంచెను సూచించగలదు. మూలంలో నిర్మాణ పదార్థం చెప్పబడలేదు కాబట్టి ‘రాతిగోడ’ అని ప్రత్యేకీకరించకుండా ‘గోడ’ అని అనువదించాం.
- source_word: מִזֶּה וְגָדֵר מִזֶּה
  choice: ఇటువైపు ఒక గోడ, అటువైపు ఒక గోడ
  rationale: పునరుక్త నిర్దేశక నిర్మాణం దారికి రెండు వైపులా గోడలు ఉన్నాయని చూపుతుంది; తెలుగు రూపం ఆ సమాంతరతను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: מַלְאַךְ ను ‘దూత’గా లేదా ‘దేవదూత’గా అనువదించడం
  choice: దూత
  alternative: దేవదూత
  rationale: ఈ సందర్భం అతీంద్రియ దూతను సూచిస్తుంది. అయినా హీబ్రూ పదం స్వతహాగా ‘సందేశవాహకుడు/దూత’ అనే విస్తృత భావాన్ని కలిగి ఉన్నందున ప్రధాన పాఠంలో ‘దూత’ను ఉంచి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వైపుల గోడల సమాంతర నిర్మాణాన్ని నిలిపి, మూలంలో లేని ‘రాతి’ అనే వివరాన్ని చేర్చలేదు.
