source:
  edition: WLC
  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַֽ/יַּחֲבֹ֖שׁ אֶת אֲתֹנ֑/וֹ וַ/יֵּ֖לֶךְ עִם שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: te
  text: బిలాము ఉదయం లేచి, తన ఆడగాడిదకు జీను వేసి, మోయాబు అధిపతులతో కలిసి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ కథన క్రమంలో ‘లేచాడు’ అనే సాధారణ భావాన్ని ఇస్తుంది; తరువాతి క్రియలతో సహజంగా కలిసేందుకు ‘లేచి’ అని అనువదించాం.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన్నే
  rationale: ఈ పదబంధం ‘ఉదయమున’ అని సూచిస్తుంది. సందర్భానికి సహజమైన తెలుగు కథన రూపంగా ‘ఉదయాన్నే’ ఎంచుకున్నాం; ఇది మూలంలో లేని అతిశయమైన ‘తెల్లవారుజామునే’ అనే భావాన్ని చేర్చదు.
- source_word: וַיַּחֲבֹשׁ
  choice: జీను కట్టి
  rationale: గాడిదకు సంబంధించినప్పుడు חבש దానిని స్వారీకి సిద్ధం చేయడం, ముఖ్యంగా జీను కట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֶת אֲתֹנוֹ
  choice: తన ఆడగాడిదకు
  rationale: אָתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది. తెలుగులో ‘ఆడగాడిద’ సహజంగానూ మూలంలోని లింగవిశేషాన్ని నేరుగా నిలుపుకునేలానూ ఉంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך అనే సాధారణ కథన క్రియకు ‘వెళ్లాడు’ నేరమైన, సహజమైన సమానం.
- source_word: עִם
  choice: తో కలిసి
  rationale: తోడుగా వెళ్లడాన్ని తెలుగులో సహజంగా తెలియజేసే రూపం.
- source_word: שָׂרֵי מוֹאָב
  choice: మోయాబు అధిపతులు
  rationale: שָׂרִים పాలనా లేదా ఉన్నత అధికార హోదా గలవారిని సూచిస్తుంది. ‘అధిపతులు’ వారి గౌరవస్థానాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యే పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని వరుస చర్యలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘లేచి… కట్టి… వెళ్లాడు’ అనే నిర్మాణంలో ఉంచాం. ఆడ గాడిద అనే మూలభాషా విశేషాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టంగా నిలిపినందున పాదటిప్పణి అవసరం లేదు.
