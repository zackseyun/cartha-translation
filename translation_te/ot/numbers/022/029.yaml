  source_fidelity: The draft accurately conveys Balaam's address to the explicitly female donkey, the accusation of humiliating/mockingly treating him, the unreal wish for a sword in his hand, and the immediate threat to kill her. The proposed revision retains these features while rendering the accusation more idiomatically.
  naturalness: ‘నన్ను అపహాస్యం చేశావు’ is understandable but less natural in direct modern Telugu speech than ‘నన్ను ఎగతాళి చేశావు.’ ‘చంపివేసేవాణ్ణి’ is a slightly more standard narrative form than the colloquial-intensified ‘చంపేసేవాణ్ణి.’
  terminology: ‘బిలాము,’ ‘ఆడగాడిద,’ and ‘ఖడ్గం’ are suitable. ‘ఆడగాడిద’ appropriately preserves the Hebrew feminine reference. No theological terminology is involved.
  issues:
  - severity: low
    issue: The accusation uses a somewhat stiff collocation.
    rationale: Modern Telugu more naturally says ‘నన్ను ఎగతాళి చేశావు’ than ‘నన్ను అపహాస్యం చేశావు,’ while retaining the Hebrew verb's mocking/humiliating sense.
  - severity: low
    issue: The final verb is somewhat colloquial for the surrounding narrative register.
    rationale: ‘చంపివేసేవాణ్ణి’ retains the force of the threat in more neutral modern standard Telugu.
