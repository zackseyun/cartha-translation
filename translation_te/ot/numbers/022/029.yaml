source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: te
  text: అప్పుడు బిలాము ఆ ఆడగాడిదతో, “నువ్వు నన్ను ఎగతాళి చేశావు![a] నా చేతిలో ఒక ఖడ్గం ఉంటే బాగుండేది! ఇప్పుడే నిన్ను చంపివేసేవాణ్ణి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు నన్ను అపహాస్యం చేశావు” లేదా “నన్ను అవమానించావు.” హీబ్రూ క్రియ ఎవరినైనా అవమానకరంగా ప్రవర్తించడం, ఎగతాళి చేయడం, లేదా వారిని వెర్రివారిగా కనిపించేలా చేయడం అనే భావాలను వ్యక్తపరచగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol వరుసను సహజమైన ఆధునిక తెలుగు కథన శైలిలో ముందుకు తీసుకెళ్తుంది.
- source_word: לָאָתוֹן
  choice: ఆ ఆడగాడిదతో
  rationale: אָתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది; తెలుగులో ‘ఆడగాడిద’ సహజంగానూ మూలంలోని లింగాన్ని స్పష్టంగానూ తెలియజేస్తుంది.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: నువ్వు నన్ను అపహాస్యం చేశావు
  rationale: Hitpael రూపం అవమానకరంగా, ఎగతాళిగా లేదా హేళనగా ప్రవర్తించడాన్ని సూచించగలదు. ‘అపహాస్యం చేశావు’ బిలాము అనుభవించిన అవమానాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: నా చేతిలో ఒక ఖడ్గం ఉంటే బాగుండేది
  rationale: לוּ వ్యక్తపరచే నెరవేరని కోరికను ‘ఉంటే బాగుండేది’ సహజంగా నిలుపుతుంది; ‘నా చేతిలో’ అనే మూల చిత్రణను కూడా కాపాడుతుంది.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: యుద్ధాయుధమైన sword‌కు గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానం.
- source_word: כִּי עַתָּה הֲרַגְתִּיךְ
  choice: ఇప్పుడే నిన్ను చంపేసేవాణ్ణి
  rationale: ముందున్న నెరవేరని కోరికకు అనుసంధానమైన తక్షణ ఉద్దేశాన్ని ‘చంపేసేవాణ్ణి’ తెలియజేస్తుంది; ‘ఇప్పుడే’ ఆ క్షణపు తీవ్రతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. ‘ఆడగాడిద’ మూలంలోని స్త్రీలింగ సూచనను స్పష్టంగా నిలుపుతుంది; ‘ఖడ్గం’ వచనానికి తగిన గౌరవప్రద కథన పదం. నెరవేరని కోరిక మరియు దాని ఫలితమైన తక్షణ బెదిరింపును రెండు సహజ తెలుగు వాక్యాలతో వ్యక్తపరిచాం.
