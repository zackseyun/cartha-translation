source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: te
  text: కాబట్టి మోయాబు పెద్దలూ మిద్యాను పెద్దలూ చేతుల్లో సోదె చెప్పించడానికి తీసుకువెళ్లిన పారితోషికాన్ని పట్టుకొని వెళ్లారు[a]; వారు బిలాము దగ్గరికి వచ్చి బాలాకు మాటలను అతనికి చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చేతుల్లో సోదెకు సంబంధించిన వస్తువులను పట్టుకొని.’ హీబ్రూ పదబంధం సోదె చెప్పడానికి ఉపయోగించే వస్తువులను లేదా శకునాలను సూచించవచ్చు; అయితే ఈ సందర్భంలో సోదె చెప్పించడానికి తెచ్చిన పారితోషికాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: పెద్దలు
  rationale: ప్రజాసమూహంలోని గుర్తింపు పొందిన వయోవృద్ధ నాయకులను సూచించే హీబ్రూ సామాజిక-రాజకీయ పదవిని సహజమైన తెలుగులో ‘పెద్దలు’ తెలియజేస్తుంది.
- source_word: וּקְסָמִים בְּיָדָם
  choice: సోదె చెప్పించడానికి చెల్లించవలసిన సొమ్మును చేతబట్టుకొని
  rationale: קְסָמִים పదం సోదె/శకున విచారణలను లేదా వాటికి సంబంధించిన వస్తువులను సూచించగలదు; ఈ సందర్భంలో బిలాము సేవ కోసం తెచ్చిన పారితోషికాన్ని అన్యాపదేశంగా సూచించడం ఎక్కువ సంభావ్యం. ‘చేతబట్టుకొని’ בְּיָדָם అనే ప్రయోగాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיָּבֹאוּ אֶל
  choice: దగ్గరికి వచ్చి
  rationale: בוא אֶל అంటే ఒకరి దగ్గరికి రావడం లేదా చేరడం; ముందున్న ‘బయలుదేరారు’ తర్వాత సంఘటనల క్రమాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: అతనికి చెప్పారు
  rationale: דבר אֶל యొక్క భావం ‘అతనితో/అతనికి మాట్లాడారు’; పంపబడిన మాటలను అందజేసే ఈ సందర్భంలో ‘చెప్పారు’ సహజమైన తెలుగు.
- source_word: דִּבְרֵי בָלָק
  choice: బాలాకు మాటలను
  rationale: ‘బాలాకు మాటలు’ అనే నిర్మాణం మూలంలోని రూపాన్ని నిలిపి, అవి ప్రత్యక్ష ఉల్లేఖనమా లేక అప్పగించిన సందేశమా అన్న విషయాన్ని నిర్ధారించకుండా ఉంచుతుంది.
- source_word: וַיֵּלְכוּ
  choice: కాబట్టి ... బయలుదేరారు
  rationale: వావ్-కన్సెక్యూటివ్ మునుపటి వాక్యానికి అనుసంధానంగా కథను ముందుకు నడిపిస్తుంది; ‘కాబట్టి’ పూర్వసందర్భంలోని ఫలితాన్ని, ‘బయలుదేరారు’ ప్రయాణారంభాన్ని సహజంగా వ్యక్తం చేస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘సోదె’ సాధారణ పాఠకులకు అర్థమయ్యేలా దైవజ్ఞానం/శకున విచారణ భావాన్ని అందిస్తుంది; మూలంలోని సాధ్యమైన ద్వంద్వార్థాన్ని పాదటిప్పణి నిలుపుతుంది.
