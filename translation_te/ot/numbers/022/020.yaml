id: NUM.22.20
reference: Numbers 22:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: te
  text: 'దేవుడు రాత్రివేళ బిలాముని దగ్గరకు వచ్చి అతనితో ఇలా అన్నాడు: “ఆ మనుషులు నిన్ను పిలవడానికి వచ్చి ఉంటే, లేచి వారితో వెళ్లు. అయితే నేను నీతో చెప్పే మాటనే నీవు చేయాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: దగ్గరకు వచ్చి
  rationale: בוא అనే సాధారణ గమనార్థాన్ని నిలుపుతుంది; దర్శనమిచ్చాడని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ వచనంలో יהוה కాకుండా אֱלֹהִים ఉంది; కాబట్టి దైవనామ భేదాన్ని సమన్వయపరచకుండా నిలిపాం.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: రాత్రి సమయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: ఆ మనుషులు నిన్ను పిలవడానికి వచ్చి ఉంటే
  rationale: లక్ష్యార్థక לקרוא לְךָను ‘నిన్ను పిలవడానికి’గా, పూర్తయిన రాకకు సంబంధించిన షరతును ‘వచ్చి ఉంటే’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קוּם לֵךְ אִתָּם
  choice: లేచి వారితో వెళ్లు
  rationale: రెండు ఆజ్ఞల క్రమాన్నీ, వారితో కలిసి వెళ్లాలనే భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְאַךְ
  choice: అయితే … నే
  rationale: వెళ్లేందుకు అనుమతి ఉన్నప్పటికీ దేవుడు చెప్పేదానికే పరిమితం కావాలనే వ్యతిరేక-నియంత్రణ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: నేను నీతో చెప్పే మాట
  rationale: דבר అనే నామవాచకానికి మరియు דבר అనే క్రియకు మధ్యనున్న మాట-చెప్పడం సంబంధాన్ని నిలుపుతుంది; సందర్భంలో ‘మాట’ అత్యంత సహజం.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: మాటనే నీవు చేయాలి
  rationale: ముందుకు తెచ్చిన కర్మపై ఉన్న నొక్కును ‘నే’తో చూపించి, ఆజ్ఞ యొక్క బలాన్ని ‘చేయాలి’తో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలోని దైవ సూచన
  choice: దేవుడు
  alternative: యెహోవా
  rationale: మూల హీబ్రూ పాఠంలో ఇక్కడ אֱלֹהִים ఉంది, יהוה లేదు; అందువల్ల సమీప సందర్భంతో సమన్వయం చేయకుండా మూలంలోని పదభేదాన్ని కాపాడాం.
- issue: బిలాము చేయవలసిన దానిపై పరిమితి
  choice: నేను నీతో చెప్పే మాటనే నీవు చేయాలి
  alternative: నేను నీతో చెప్పే విషయాన్నే నీవు చేయాలి
  rationale: ‘మాట’ మరియు ‘చెప్పే’ అనే పదజోడు మూలంలోని דבר పదక్రీడను సాధ్యమైనంతవరకు నిలుపుతుంది; అదే సమయంలో బిలాముకు విధించిన కఠిన పరిమితిని ‘నే’ స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలో నిజమైన పాఠభేదం లేదా అనువాదానికి అవసరమైన ముఖ్య అస్పష్టత కనిపించనందున పాదటిప్పణులు చేర్చలేదు.
