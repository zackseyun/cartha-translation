review_pass:
  verdict: revise
  source_fidelity: The draft preserves the female-donkey term (אָתוֹן), both rhetorical questions, Balaam's long familiarity with the animal, the habitual-force question of הַהַסְכֵּן הִסְכַּנְתִּי, and Balaam's brief negative reply. The continuous expression “స్వారీ చేస్తూ వచ్చావు” somewhat overstates the Hebrew as uninterrupted riding rather than long-standing riding/customary use.
  naturalness: The draft is broadly understandable, but “ఆ ఆడగాడిద” and “నా మీద స్వారీ చేస్తూ వచ్చావు” are less idiomatic than a compact relative-clause construction. The revised wording is more natural modern standard Telugu while retaining the rhetorical structure.
  terminology: “ఆడ గాడిద” accurately retains the source noun's female specificity and is clear in Telugu. No footnote is needed because the specificity is represented directly in the text.
  issues:
  - severity: low
    issue: The phrase “స్వారీ చేస్తూ వచ్చావు” can imply continuous action.
    rationale: The Hebrew relative clause describes Balaam's long-term riding of the donkey; “స్వారీ చేసిన” expresses this without adding a continuous-progressive nuance.
  - severity: low
    issue: “ఆ ఆడగాడిద” is stylistically heavy.
    rationale: “నీ ఆడ గాడిద” within the relative construction is sufficient, natural, and preserves both definiteness/possession and the feminine lexical distinction.
  - severity: low
    issue: The habitual question can be phrased more smoothly.
    rationale: “నాకు ఎప్పుడైనా అలవాటుగా ఉందా?” naturally conveys whether such conduct has ever been customary, without changing the rhetorical force.
  revised_text: అప్పుడు ఆడ గాడిద బిలాముతో, “నీ జీవితమంతా ఈ రోజు వరకు నీవు నా మీద స్వారీ చేసిన నీ ఆడ గాడిదను నేను కాదా? నీకు ఇలా చేయడం నాకు ఎప్పుడైనా అలవాటుగా ఉందా?” అంది. అతడు, “లేదు” అన్నాడు.
  revised_footnotes: []
