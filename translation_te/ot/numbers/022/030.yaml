language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר הָ/אָת֜וֹן אֶל בִּלְעָ֗ם הֲ/לוֹא֩ אָנֹכִ֨י אֲתֹֽנְ/ךָ֜ אֲשֶׁר רָכַ֣בְתָּ עָלַ֗/י מֵ/עֽוֹדְ/ךָ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַֽ/הַסְכֵּ֣ן הִסְכַּ֔נְתִּי לַ/עֲשׂ֥וֹת לְ/ךָ֖ כֹּ֑ה וַ/יֹּ֖אמֶר לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: te
  text: అప్పుడు ఆడ గాడిద బిలాముతో, “నీ జీవితమంతా ఈ రోజు వరకు నీవు నా మీద స్వారీ చేసిన నీ ఆడ గాడిదను నేను కాదా? నీకు ఇలా చేయడం నాకు ఎప్పుడైనా అలవాటుగా ఉందా?” అంది. అతడు, “లేదు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: ఆ ఆడగాడిద / నీ ఆడగాడిద
  rationale: אָתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలోనే ఆ లింగసూచనను సహజంగా నిలిపాం.
- source_word: הֲלוֹא אָנֹכִי
  choice: నేను ... కానా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్న బలాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలిపింది.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: నీవు నా మీద స్వారీ చేస్తూ వచ్చావు
  rationale: עַל గాడిద మీద స్వారీ చేయడాన్ని సూచిస్తుంది; కొనసాగుతూ వచ్చిన చర్యను తెలుగు సంయుక్త క్రియ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: నీ జీవితమంతా ఈ రోజు వరకు
  rationale: అక్షరార్థంగా ‘నీ ఉనికి మొదలుకొని’ అనే భావం; సందర్భంలో జీవితకాలమంతటి దీర్ఘ అనుభవాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: ఎప్పుడైనా నా అలవాటా?
  rationale: సכן క్రియ యొక్క ధాతురూపం-సమాపక క్రియ కలయిక అలవాటైన ప్రవర్తనను బలంగా ప్రశ్నిస్తుంది. తెలుగు రూపం ఆ అలవాటు భావాన్నీ అలంకారప్రశ్ననూ నిలుపుతుంది.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: నీకు ఇలా చేయడం
  rationale: כֹּה గాడిద అప్పుడే చేసిన అసాధారణ చర్యను ‘ఇలా’ అని సూచిస్తుంది.
- source_word: וַיֹּאמֶר לֹא
  choice: అతడు, “లేదు” అన్నాడు
  rationale: బిలాము ఇచ్చిన సంక్షిప్త ప్రతికూల సమాధానాన్ని నేరుగా, సహజంగా అందిస్తుంది.
