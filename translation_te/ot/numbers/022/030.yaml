revisions:
- from: అప్పుడు ఆ ఆడగాడిద బిలాముతో, “నేను నీ ఆడగాడిదను కానా? నీ జీవితమంతా ఈ రోజు వరకు నీవు నా మీద స్వారీ చేస్తూ వచ్చావు కదా? నేను నీకు ఇలా చేయడం ఎప్పుడైనా నా అలవాటా?” అంది. అతడు, “లేదు” అన్నాడు.
  to: అప్పుడు ఆడ గాడిద బిలాముతో, “నీ జీవితమంతా ఈ రోజు వరకు నీవు నా మీద స్వారీ చేసిన నీ ఆడ గాడిదను నేను కాదా? నీకు ఇలా చేయడం నాకు ఎప్పుడైనా అలవాటుగా ఉందా?” అంది. అతడు, “లేదు” అన్నాడు.
  rationale: 'The revision preserves every semantic component of the Hebrew and the English audit trail: the animal is explicitly female, Balaam has ridden her throughout his life until the present day, her present conduct is contrasted with her established habit, and Balaam replies negatively. It improves Telugu idiom and avoids implying uninterrupted riding.'
