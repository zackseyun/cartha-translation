translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథనశైలి వాడబడింది. మూలంలోని రెండు అలంకారప్రశ్నలు, ఆడగాడిద అనే లింగసూచన, దీర్ఘకాల అలవాటు అనే భావం నిలుపబడ్డాయి.
