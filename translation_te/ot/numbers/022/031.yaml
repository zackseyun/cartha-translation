  naturalness: ‘ముఖం నేలకు ఆనించి సాగిలపడ్డాడు’ ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజంగా ఉంది; ఇది శారీరక ప్రణామాన్ని మాత్రమే తెలియజేస్తుంది. ‘తన చేతిలో ఒరలోనుండి తీసిన ఖడ్గాన్ని పట్టుకొని’ అనే నిర్మాణం మూలంలోని సంబంధాన్ని స్పష్టంగా, సులభంగా వ్యక్తం చేస్తుంది.
