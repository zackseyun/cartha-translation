  to: అప్పుడు యాహ్వే బిలాము కళ్లను తెరిచాడు[a]. బిలాము దారిలో నిలబడి ఉన్న యాహ్వే దూతను[b] చూశాడు; అతడు తన చేతిలో ఒరలోనుండి తీసిన ఖడ్గాన్ని పట్టుకొని ఉన్నాడు. అప్పుడు బిలాము వంగి, ముఖం నేలకు ఆనించి సాగిలపడ్డాడు[c].
