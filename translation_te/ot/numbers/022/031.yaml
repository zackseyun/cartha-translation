id: NUM.22.31
reference: Numbers 22:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: te
  text: అప్పుడు యాహ్వే బిలాము కళ్లను తెరిచాడు[a]. బిలాము దారిలో నిలబడి ఉన్న యాహ్వే దూతను[b] చూశాడు; అతడు తన చేతిలో ఒరలోనుండి తీసిన ఖడ్గాన్ని పట్టుకొని ఉన్నాడు. అప్పుడు బిలాము వంగి, ముఖం నేలకు ఆనించి సాగిలపడ్డాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బిలాము కళ్లపై ఉన్న కప్పును తొలగించాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా ‘కప్పును తొలగించాడు’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే సందేశవాహకుణ్ణి.” హీబ్రూ పదానికి ‘దూత’ లేదా ‘సందేశవాహకుడు’ అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ముఖం నేలకు ఆనించి పడిపోయాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: కళ్లను తెరిచాడు
  rationale: గלה అనే క్రియకు అక్షరార్థంగా ‘కప్పును తొలగించడం, బయలుపరచడం’ అనే భావం ఉంది. కళ్లకు సంబంధించిన ఈ హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘కళ్లను తెరిచాడు’ అని అనువదించాం; చూపును అడ్డుకున్నది తొలగించబడిందనే భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణ ‘యాహ్వే’గా ఇచ్చాం.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאָךְ అంటే ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత.’ ఇక్కడ అతీంద్రియ దూత సందర్భం స్పష్టమైనప్పటికీ, మూలపదంలోని విస్తృత భావాన్ని కాపాడేందుకు ప్రధాన పాఠంలో ‘దూత’ను ఉంచాం.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: దారిలో నిలబడి ఉన్న
  rationale: నిలిచిన భంగిమను, బిలాము ప్రయాణ మార్గాన్ని అడ్డుకున్న స్థానాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: ఆ దూత చేతిలో ఒరనుంచి తీసిన ఖడ్గం ఉంది
  rationale: שְׁלֻפָה ఖడ్గం ఒరనుంచి తీయబడి సిద్ధంగా ఉందని సూచిస్తుంది. ‘ఒరనుంచి తీసిన ఖడ్గం’ ఆ దృశ్యాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: వంగి, ముఖం నేలకు మోపి బోర్లపడ్డాడు
  rationale: రెండు క్రియలు వంగడాన్ని, పూర్తిగా నేలకు సాగిలపడే శరీరచర్యను వరుసగా తెలియజేస్తాయి. ‘ఆరాధించాడు’ అని వ్యాఖ్యానించకుండా మూలంలోని శారీరక చర్యను స్పష్టంగా ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దానిని ఒక బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: מַלְאָךְను ‘దూత’గా లేదా ‘దేవదూత’గా ఇవ్వడం
  choice: యాహ్వే దూత
  alternative: యాహ్వే దేవదూత
  rationale: ఈ సందర్భంలో అతీంద్రియ సత్త్వం ఉద్దేశించబడినా, హీబ్రూ పదం ప్రాథమికంగా ‘దూత/సందేశవాహకుడు’ అని అర్థం. ‘దూత’ మూలంలోని పదసంబంధమైన విస్తృతిని కాపాడుతుంది.
- issue: וַיִּשְׁתַּחוּను ఆరాధనగా లేదా శరీర భంగిమగా అనువదించడం
  choice: ముఖం నేలకు మోపి బోర్లపడ్డాడు
  alternative: ఆరాధించాడు; సాష్టాంగ నమస్కారం చేశాడు
  rationale: ఈ క్రియ ఆరాధనను సూచించగలిగినా, ఇక్కడ వచనం బిలాము చేసిన శరీరచర్యను స్పష్టంగా వర్ణిస్తుంది. అందువల్ల ఆ చర్యను మాత్రమే చెప్పి, దాని సంపూర్ణ ధార్మిక అర్థాన్ని పాఠకుడు సందర్భం నుంచి గ్రహించేలా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘సాష్టాంగ నమస్కారం’ లేదా ‘ఆరాధించాడు’ వంటి అధిక వ్యాఖ్యానభారం గల పదబంధాలను నివారించి, మూలపాఠంలోని దృశ్యమైన శరీరచర్యను స్పష్టంగా చెప్పాం.
