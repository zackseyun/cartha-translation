  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: te
  text: అప్పుడు బిలాము బాలాకుతో కలిసి వెళ్లాడు; వారు కిర్యాత్-హుసోతుకు[a] వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కిర్యాత్-హుసోతు” అనే పేరుకు బహుశా “వీధుల పట్టణం” లేదా “బహిరంగ ప్రదేశాల పట్టణం” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తూ సాధారణంగా ‘వెళ్లాడు’ అనే అర్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇదే సహజమైన ఎంపిక.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరంగా వినిపించే రూపంలో లిప్యంతరీకరించాం.
- source_word: עִם
  choice: తో కలిసి
  rationale: ఈ విభక్తి సహచర్యాన్ని సూచిస్తుంది; ‘తో కలిసి’ ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּלָק
  choice: బాలాకు
  rationale: వ్యక్తి పేరు ‘బాలాకు’గా లిప్యంతరీకరించబడింది; ‘తో’ చేరినప్పుడు సహజ తెలుగు రూపం ‘బాలాకుతో’ అవుతుంది.
- source_word: וַיָּבֹאוּ
  choice: వారు ... వచ్చారు
  rationale: בוא క్రియ యొక్క బహువచన వయ్యిక్తోల్ రూపం తదుపరి కథన చర్యను సూచిస్తుంది. ‘వచ్చారు’ అనేది ప్రవేశించారా లేదా కేవలం చేరారా అని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని చలన భావాన్ని నిలుపుతుంది.
- source_word: קִרְיַת חֻצוֹת
  choice: కిర్యాత్-హుచోతు
  rationale: ఇది స్థలనామంగా పనిచేస్తున్నందున ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం; దాని సాధ్యమైన పదార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
