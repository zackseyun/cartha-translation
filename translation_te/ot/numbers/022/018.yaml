id: NUM.22.18
reference: Numbers 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: te
  text: 'బిలాము బాలాకు సేవకులకు ఇలా జవాబిచ్చాడు: “బాలాకు తన ఇల్లు నిండా వెండి బంగారం నాకు ఇచ్చినా, చిన్నదైనా పెద్దదైనా ఏదీ చేయడానికి నా దేవుడైన యహ్వే నోటి మాటను నేను మీరలేను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “నా దేవుడైన యహ్వే నోటిని దాటి వెళ్లలేను.” అంటే ఆయన చెప్పిన మాటను మీరలేను లేదా అతిక్రమించలేను.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: బిలాము ... ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో అందిస్తుంది; ‘జవాబిచ్చి అన్నాడు’ అనే అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: עַבְדֵי בָלָק
  choice: బాలాకు సేవకులకు
  rationale: సందర్భంలో దూతలు లేదా రాజసేవకులను సూచిస్తుంది; ‘బానిసలు’ కంటే ‘సేవకులు’ సామాజిక పాత్రను అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: బాలాకు ... నాకు ఇచ్చినా
  rationale: షరతుకు సందర్భానుగుణమైన అనుమతార్థక/రాయితీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: తన ఇల్లు నిండా వెండి బంగారాలు
  rationale: అపార సంపదను సూచించే మూలపాఠంలోని ఇంటి నిండుదల రూపకాన్ని నిలుపుతుంది.
- source_word: לֹא אוּכַל
  choice: నేను ... మీరలేను
  rationale: కేవలం నిరాకరణ కాక, మూలంలోని అసమర్థత భావాన్ని ‘లేను’ రూపంతో కాపాడుతుంది.
- source_word: לַעֲבֹר אֶת פִּי
  choice: నోటి మాటను ... మీరలేను
  rationale: అక్షరార్థమైన ‘నోరు’ రూపకాన్నీ, చెప్పినదాన్ని అతిక్రమించడమనే నుడికార భావాన్నీ తెలుగులో గ్రాహ్యంగా ఉంచుతుంది.
- source_word: יְהוָה אֱלֹהָי
  choice: నా దేవుడైన యహ్వే
  rationale: దైవనామాన్ని వ్యక్తినామంగా లిప్యంతరీకరిస్తూ, ‘నా దేవుడు’ అనే బిలాము మాటను యథాతథంగా కాపాడుతుంది.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: చిన్నదైనా పెద్దదైనా ఏదీ చేయడానికి
  rationale: చిన్నది–పెద్దది అనే సమగ్రార్థక జంటను నిలుపుతూ, ‘ఏదీ’తో దాని భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగా అందిస్తుంది.
- issue: బిలాము ప్రకటనలోని శక్తి
  choice: యహ్వే నోటి మాటను తాను మీరలేనని చెప్పడం
  alternative: యహ్వే ఆజ్ఞను తాను అతిక్రమించనని చెప్పడం
  rationale: יכל అనే ‘చేయగలగడం’ భావాన్ని కాపాడి, దీనిని కేవలం స్వచ్ఛంద నిరాకరణగా మార్చదు; అదే సమయంలో ‘నోటి మాటను మీరడం’ అనే మూల నుడికారాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథనశైలి. మూలంలోని ‘నోరు’ రూపకాన్ని ‘నోటి మాట’గా కాపాడి, పాదటిప్పణిలో అక్షరార్థాన్ని ఇచ్చాం.
