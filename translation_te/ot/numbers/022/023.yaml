revisions:
- from: గాడిద దారిలో నిలబడి, చేతిలో కత్తి దూసి పట్టుకున్న యెహోవా దూతను[a] చూసింది. అప్పుడు అది దారి తప్పి పొలంలోకి వెళ్లింది. దాన్ని తిరిగి దారిపైకి మళ్లించడానికి బిలాము గాడిదను కొట్టాడు.
  to: గాడిద చేతిలో ఒరనుండి తీసిన కత్తిని పట్టుకుని దారిలో నిలబడి ఉన్న యెహోవా దూతను[a] చూసింది. అప్పుడు అది దారిని విడిచి పొలంలోకి వెళ్లింది. దాన్ని తిరిగి దారిమీదికి మళ్లించడానికి బిలాము గాడిదను కొట్టాడు.
  rationale: కత్తి ‘ఒరనుండి తీసినది’ అనే మూలపాఠ భావాన్ని స్పష్టపరిచాం; గాడిద మార్గం నుంచి పక్కకు తిరిగినదనే అర్థాన్ని ‘దారిని విడిచి’తో మరింత నిష్పక్షపాతంగా వ్యక్తం చేశాం. మిగిలిన పదజాలం, దైవనామం, పాదటిప్పణి ప్రత్యామ్నాయం యథాతథంగా నిలిపాం.
