    rationale: వచనంలో గాడిద దారినుండి పక్కకు తిరిగి పొలంలోకి వెళ్లింది. ‘దారిని విడిచి’ ఈ కదలికను అదనపు ఉద్దేశం లేదా అయోమయం లేకుండా తెలుపుతుంది.
