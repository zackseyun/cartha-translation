id: NUM.22.23
reference: Numbers 22:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: te
  text: గాడిద చేతిలో ఒరనుండి తీసిన కత్తిని పట్టుకుని దారిలో నిలబడి ఉన్న యెహోవా దూతను[a] చూసింది. అప్పుడు అది దారిని విడిచి పొలంలోకి వెళ్లింది. దాన్ని తిరిగి దారిమీదికి మళ్లించడానికి బిలాము గాడిదను కొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా దేవదూతను.’
    reason: మַלְאַךְ అనే హీబ్రూ పదం సాధారణ దూతను లేదా దేవదూతను సూచించగలదు; ఈ సందర్భంలో అతీంద్రియ భావం స్పష్టంగా ఉంది.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: గాడిద
  rationale: ఆతోన్ ఆడ గాడిదను సూచిస్తుంది. తెలుగులో సహజంగా ‘గాడిద’ అని చెప్పడం సరళం; అవసరం లేని చోట లింగాన్ని ప్రత్యేకంగా పేర్కొనలేదు.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: మలాఖ్ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఖడ్గంతో కనిపించిన అతీంద్రియ వ్యక్తి అనే సందర్భాన్ని తెలుగు ‘దూత’ సహజంగా మోస్తూ, మూలపదంలోని ‘సందేశవాహకుడు’ అనే విస్తృత భావాన్నీ కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: దారిలో నిలబడి
  rationale: దూత ప్రయాణ మార్గానికి అడ్డుగా నిలిచిన దృశ్యాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: చేతిలో కత్తి దూసి పట్టుకున్న
  rationale: శెలూఫా అంటే ఒరనుండి బయటకు తీసినది. ‘కత్తి దూసి పట్టుకున్న’ అనే ప్రయోగం సిద్ధంగా చేతిలో ఉన్న ఖడ్గ దృశ్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: అది దారి తప్పి
  rationale: నాటా ఇక్కడ నిర్ణీత మార్గం నుంచి పక్కకు మళ్లడాన్ని సూచిస్తుంది; ‘దారి తప్పి’ అనేది ఉద్దేశపూర్వకంగా తప్పిపోయిందనే భావం కంటే దారి నుంచి పక్కకు వెళ్లిన కదలికను సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: పొలంలోకి వెళ్లింది
  rationale: సాదెహ్ ఇక్కడ దారి పక్కనున్న పొలం లేదా బహిరంగ భూమిని సూచిస్తుంది; ‘పొలం’ దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיַּךְ
  choice: కొట్టాడు
  rationale: నాఖా అంటే కొట్టడం. ఏకవచన క్రియలో లేని పునరావృత భావాన్ని చేర్చకుండా సాధారణ తెలుగు క్రియను వాడాం.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: దాన్ని తిరిగి దారిపైకి మళ్లించడానికి
  rationale: గాడిద అప్పటికే దారిని విడిచినందున, దానిని మళ్లీ దారివైపు తిప్పాలనే కారణార్థాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను వాడాం.
- issue: מַלְאַךְ ను దూతగా లేదా దేవదూతగా అనువదించడం
  choice: దూత
  alternative: దేవదూత
  rationale: ఈ సందర్భం అతీంద్రియ దూతను సూచించినప్పటికీ, ‘దూత’ మూలపదంలోని దూత/సందేశవాహకుడు అనే అర్థవిస్తృతిని నిలుపుతుంది; పాఠకునికి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని క్రియాక్రమాన్ని కాపాడుతూ తెలుగు వాక్యనిర్మాణానికి తగినట్లు మొదటి వాక్యాన్ని అమర్చాం; అనవసరంగా ఆడ గాడిద అని పునరుక్తి చేయలేదు.
