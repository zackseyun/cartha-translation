id: NUM.22.22
reference: Numbers 22:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: te
  text: అతడు వెళ్తున్నందుకు దేవుని కోపం రగులుకుంది; యాహ్వే దూత అతనికి విరోధిగా[a] దారిలో నిలబడ్డాడు. అతడు తన గాడిద[b] మీద స్వారీ చేస్తున్నాడు; అతని ఇద్దరు యువకులు అతనితో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שָׂטָן (సాతాన్) అనే పదానికి ఇక్కడ ‘విరోధి’ లేదా ‘ఎదిరించేవాడు’ అని అర్థం; ఇది తప్పనిసరిగా ‘సాతాను’ అనే వ్యక్తినామం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన ఆడ గాడిద’; హీబ్రూ పదం ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: దేవుని కోపం రగులుకుంది
  rationale: హీబ్రూ భాషలోని ‘కోపం మండడం’ అనే సజీవమైన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: అతడు వెళ్తున్నందుకు
  rationale: כִּי కారణాన్ని సూచిస్తుంది; వర్తమాన కృదంత నిర్మాణంలోని కొనసాగుతున్న చర్యను ‘వెళ్తున్నందుకు’ వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְיַצֵּב
  choice: నిలబడ్డాడు
  rationale: దూత ఉద్దేశపూర్వకంగా దారిలో స్థానం తీసుకున్నాడనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగు వాక్యంలో ఇది సహజంగా ఉంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ‌ను ఈ పరలోక సంబంధ సందర్భంలో ‘దూత’గా, దేవుని వ్యక్తిగత నామమైన יהוה‌ను ‘యాహ్వే’గా ప్రతిబింబిస్తుంది.
- source_word: לְשָׂטָן לוֹ
  choice: అతనికి విరోధిగా
  rationale: שָׂטָן ఇక్కడ వ్యక్తినామం కాక సాధారణ నామవాచకం; దూత బిలామును ఎదిరించే పాత్రను ఇది తెలియజేస్తుంది.
- source_word: אֲתֹנוֹ
  choice: తన గాడిద
  rationale: సహజమైన తెలుగు కథనంలో ‘గాడిద’ సరళంగా ఉంటుంది; హీబ్రూ పదం ఆడ గాడిదను ప్రత్యేకంగా సూచిస్తుందనే వివరాన్ని పాదసూచికలో ఉంచాం.
- source_word: שְׁנֵי נְעָרָיו
  choice: అతని ఇద్దరు యువకులు
  rationale: נַעַר యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; వారిని సేవకులు లేదా పరిచారకులు అని సందర్భం స్పష్టంగా చెప్పనందున ఆ పాత్రను అనువాదంలో చేర్చలేదు.
theological_decisions:
- issue: ఈ సందర్భంలో שָׂטָן అర్థం
  choice: 'సాధారణ నామవాచకం: ‘విరోధి’'
  alternative: 'వ్యక్తినామం లేదా బిరుదు: ‘సాతాను’'
  rationale: నిర్దిష్ట ఉపపదం లేని ఈ రూపం యాహ్వే దూత బిలామును ఎదిరించే పాత్రను వర్ణిస్తుంది. ‘సాతాను’ అని అనువదించడం ఈ వాక్యం కోరని తరువాతి భావాన్ని దిగుమతి చేస్తుంది.
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని పేరుగానే వెల్లడిస్తూ, దాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది.
- issue: దేవుని కోపానికి కారణమైన כִּי הוֹלֵךְ הוּא
  choice: ‘అతడు వెళ్తున్నందుకు’ అనే కారణార్థక పఠనం
  alternative: ‘అతడు వెళ్లినప్పుడు’ అనే కాలార్థక పఠనం
  rationale: כִּי ఇక్కడ సహజంగా కారణాన్ని సూచిస్తుంది. ముందరి అనుమతితో కనిపించే ఉద్రిక్తతను వివరణతో తొలగించకుండా యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సర్వనామాలు నిలుపబడ్డాయి; ‘అతడు’ అని ఉన్న చోట బిలాము పేరును వివరణార్థంగా చేర్చలేదు. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
