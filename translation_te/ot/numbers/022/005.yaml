revisions:
- from: 'అప్పుడు అతడు బెయోరు కుమారుడైన బిలామును పిలిపించడానికి, నది[a] దగ్గర ఉన్న పెతోరుకు—అతని ప్రజల కుమారుల దేశానికి[b]—దూతలను పంపించి ఇలా చెప్పించాడు: “చూడు, ఒక ప్రజ ఈజిప్టు నుండి బయలుదేరి వచ్చింది. చూడు, అది దేశపు ముఖాన్ని[c] కప్పేసింది; ఇప్పుడు అది నాకు ఎదురుగా నివసిస్తోంది.”'
  to: 'అప్పుడు అతడు బెయోరు కుమారుడైన బిలామును పిలిపించడానికి, నది[a] దగ్గర, అతని ప్రజల కుమారుల దేశంలో[b] ఉన్న పెతోరుకు దూతలను పంపించి ఇలా చెప్పించాడు: “చూడు, ఒక ప్రజ ఈజిప్టు నుండి బయలుదేరి వచ్చింది. చూడు, అది దేశపు ముఖాన్ని[c] కప్పేసింది; అది నాకు ఎదురుగా నివసిస్తోంది.”'
  rationale: పెతోరును విశేషించే ‘నది దగ్గర’ మరియు ‘అతని ప్రజల కుమారుల దేశంలో’ అనే భాగాలను తెలుగులో సహజమైన విశేషణ నిర్మాణంలోకి మార్చాం; దీనివల్ల మూలంలోని భౌగోళిక సంబంధం, అలాగే సర్వనామంలోని అనిశ్చితి రెండూ నిలుస్తాయి. మూలంలో లేని ‘ఇప్పుడు’ను తొలగించాం. పాదటిప్పణి గుర్తులు సంబంధిత పదాల వద్దనే ఉంచబడ్డాయి.
