source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: te
  text: 'అప్పుడు అతడు బెయోరు కుమారుడైన బిలామును పిలిపించడానికి, నది[a] దగ్గర, అతని ప్రజల కుమారుల దేశంలో[b] ఉన్న పెతోరుకు దూతలను పంపించి ఇలా చెప్పించాడు: “చూడు, ఒక ప్రజ ఈజిప్టు నుండి బయలుదేరి వచ్చింది. చూడు, అది దేశపు ముఖాన్ని[c] కప్పేసింది; అది నాకు ఎదురుగా నివసిస్తోంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “నది”; బహుశా యూఫ్రటీసు నది.
    reason: cross_reference
  - marker: b
    text: లేదా “అతని ప్రజల దేశంలో.” “అతని ప్రజల కుమారుల దేశం” అనే హీబ్రూ పదబంధం కష్టమైనది; “అతని” ఎవరిని సూచిస్తుందో వివిధ రీతుల్లో అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “దేశపు కన్నును.” ఇక్కడ అది దేశపు కనిపించే ఉపరితలాన్ని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు అతడు ... పంపించి
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపంలోని క్రమబద్ధతను సహజమైన ఆధునిక తెలుగు కథనశైలిలో చూపిస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇది మానవ దౌత్యసందర్భం; అందువల్ల దేవదూతలు అనే అర్థం కాకుండా సందేశవాహకులు అనే అర్థంలో ‘దూతలు’ సరిపోతుంది.
- source_word: בִּלְעָם בֶּן־בְּעוֹר
  choice: బెయోరు కుమారుడైన బిలాము
  rationale: వ్యక్తిపేర్లను తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఉంచి, తండ్రి-కుమార సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: פְּתוֹרָה
  choice: పెతోరుకు
  rationale: స్థలనామానికి ఉన్న దిశాసూచక -ה ప్రత్యయం గమ్యాన్ని సూచిస్తుంది; కాబట్టి ‘పెతోరుకు’ మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: నది దగ్గర ఉన్న
  rationale: మూలంలో ‘నది’ అని మాత్రమే ఉంది. అది యూఫ్రటీసు కావచ్చని ప్రధాన పాఠ్యంలో నిర్ధారించకుండా, పాదటిప్పణిలో తెలిపాం.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: అతని ప్రజల కుమారుల దేశానికి
  rationale: కష్టమైన హీబ్రూ నిర్మాణంలోని ‘కుమారులు’ మరియు అస్పష్టమైన ‘అతని’ సర్వనామాన్ని అర్థవివరణతో తొలగించకుండా నిలిపింది.
- source_word: לִקְרֹא לוֹ
  choice: అతనిని పిలిపించడానికి
  rationale: ఉద్దేశాన్ని సూచించే infinitive‌ను సహజ తెలుగులో వ్యక్తం చేస్తుంది; రాజు దూతలను పంపిన సందర్భంలో ‘పిలిపించు’ సముచితం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: రెండుసార్లు వచ్చిన దృష్టి ఆకర్షణ, ఉద్ఘాటనలను ఆధునికమైనప్పటికీ గౌరవప్రదమైన రీతిలో నిలుపుతుంది.
- source_word: יָצָא מִמִּצְרַיִם
  choice: ఈజిప్టు నుండి బయలుదేరి వచ్చింది
  rationale: ఈజిప్టు నుంచి వెలుపలికి వచ్చిన కదలికనూ, మాట్లాడేవాని దృష్టిలో దాని ప్రస్తుత ఫలితాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: כִסָּה אֶת־עֵין הָאָרֶץ
  choice: దేశపు ముఖాన్ని కప్పేసింది
  rationale: ‘దేశపు కన్ను’ అనే పదక్షర రూపం తెలుగులో అపారదర్శకంగా ఉంటుంది. ‘ముఖం’ కనిపించే ఉపరితలమనే భావాన్ని, మూలంలోని రూపకాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: ఇప్పుడు అది నాకు ఎదురుగా నివసిస్తోంది
  rationale: יֹשֵׁב యొక్క స్థిరనివాస భావాన్ని ‘నివసిస్తోంది’ చూపిస్తుంది; מִמֻּלִיని ‘నాకు ఎదురుగా’ నేరుగా అనువదించింది. ‘ఇప్పుడు’ సందర్భంలోని ప్రస్తుత పరిస్థితిని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: אֶרֶץ בְּנֵי עַמּוֹ లోని ‘అతని’ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతని ప్రజల కుమారుల దేశం’ అనే అస్పష్టతను నిలిపివేయడం
  alternative: ‘అతని స్వప్రజల దేశం’ లేదా ‘అమ్మోనీయుల దేశం’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యభాగం కష్టమైనది; సర్వనామానికి ఒకే నిర్ధారిత సంబంధాన్ని బలవంతంగా ఇవ్వడం మూలంలోని నిజమైన అనిశ్చితిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘చూడు’ అనే పునరుక్తిని మూలంలోని ఉద్ఘాటన కోసం నిలిపాం. కష్టమైన భౌగోళిక-సర్వనామ పదబంధాన్ని అతిగా సరళీకరించకుండా పాదటిప్పణితో వివరించాం.
