translation:
  language: te
  text: అప్పుడు మోయాబు అధికారులు లేచి బాలాకు వెళ్లి, “బిలాము మాతో రావడానికి నిరాకరించాడు” అని చెప్పారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: మోయాబు అధికారులు
  rationale: שָׂרִים అనే పదం సందర్భానుసారంగా రాజప్రతినిధులు లేదా ఉన్నతాధికారులను సూచిస్తుంది; ఆధునిక పాఠకులకు సహజంగా ఉండేందుకు ‘అధికారులు’ అని అనువదించాం.
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: ఇక్కడ క్రియ కేవలం నిలబడటమే కాక తదుపరి ప్రయాణానికి బయలుదేరడాన్ని సూచించే కథన క్రమంలో ఉంది; మూలంలోని చర్యను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מֵאֵן
  choice: నిరాకరించాడు
  rationale: ఈ క్రియ ఉద్దేశపూర్వకంగా ఒప్పుకోకపోవడం లేదా తిరస్కరించడాన్ని తెలియజేస్తుంది.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: మాతో రావడానికి
  rationale: హీబ్రూ పదబంధంలోని ప్రయాణ సహవాస భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలను స్పష్టంగా ఉంచుతూ అనవసర వివరణను జోడించలేదు.
