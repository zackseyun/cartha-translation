id: NUM.22.8
reference: Numbers 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: te
  text: అతడు వారితో, “ఈ రాత్రి ఇక్కడే ఉండండి. యహ్వే[b] నాతో ఏమి చెబుతాడో దాని ప్రకారమే మీకు జవాబు ఇస్తాను[a]” అన్నాడు. కాబట్టి మోయాబు అధికారులు[c] బిలాముతో ఉండిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు సందేశం తీసుకొస్తాను,” లేక “మీకు తిరిగి ఒక మాట చెబుతాను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో YHWH అనే దైవనామం. దీనిని సంప్రదాయంగా “యెహోవా” అని కూడా పలుకుతారు; అనేక అనువాదాల్లో “ప్రభువు” అని సూచిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “మోయాబు అధిపతులు,” లేక “మోయాబు నాయకులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: ఈ రాత్రి ఇక్కడే ఉండండి
  rationale: לִינוּ అనేది రాత్రిపూట అక్కడే ఉండమనే బహువచన ఆజ్ఞ. ఆధునిక తెలుగులో సహజంగా ఉండేలా, స్థలాన్నీ కాలాన్నీ స్పష్టంగా నిలిపింది.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: మీకు జవాబు ఇస్తాను
  rationale: శబ్దశః ‘మాటను తిరిగి తీసుకురావడం’ అనే హీబ్రూ ప్రయోగం సందర్భంలో జవాబు లేదా సందేశం తెలియజేయడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘జవాబు ఇస్తాను’ ఎంచుకున్నాం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: యహ్వే నాతో ఏమి చెబుతాడో దాని ప్రకారమే
  rationale: כַּאֲשֶׁר లోని అనురూపతను ‘దాని ప్రకారమే’ నిలుపుతుంది; יְדַבֵּר ను సందర్భానుసార భవిష్యత్ క్రియగా అనువదించింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామం YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: וַיֵּשְׁבוּ
  choice: ఉండిపోయారు
  rationale: ישב యొక్క ప్రాథమిక అర్థం ‘కూర్చోవడం/నివసించడం’ అయినా, రాత్రి ఉండమనే ఆహ్వానం తరువాత ఇక్కడ ‘అక్కడే ఉండిపోవడం’ సందర్భార్థం.
- source_word: שָׂרֵי מוֹאָב
  choice: మోయాబు అధికారులు
  rationale: שָׂרִים రాజసంబంధ దూతలైన అధిపతులు, అధికారులు లేదా నాయకులను సూచించగలదు. ఈ సందర్భంలో ‘అధికారులు’ అతిగా నిర్దిష్టం కాకుండా సహజంగా ఉంది.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: ఈ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలంలోని రూపాన్ని స్పష్టంగా నిలుపుతుంది; ఉచ్చారణ సంప్రదాయాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలోని ‘ప్రకారం’ అనే సంబంధాన్ని నిలిపి, అసహజమైన శబ్దశః ప్రయోగాన్ని ప్రధాన పాఠంలో నివారించి పాదసూచికలో చూపించాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
