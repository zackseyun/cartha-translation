id: NUM.22.10
reference: Numbers 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: te
  text: 'అప్పుడు బిలాము దేవునితో ఇలా అన్నాడు: “మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు నా దగ్గరకు పంపించాడు:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తిపేరు రూపం.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవునితో
  rationale: ముందరి వచన సందర్భంలో నిర్దిష్టమైన ఏకవచన సూచనగా ఉన్న הָאֱלֹהִיםను ‘దేవుడు’గా గ్రహించి, אֶל‌తో సహజమైన తెలుగు సంభాషణా రూపం ‘దేవునితో’ ఉపయోగించబడింది.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: సిప్పోరు కుమారుడు బాలాకు
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు నామవిశేషణ క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజైన
  rationale: బాలాకును గుర్తించే ఉపపదబంధాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: שָׁלַח אֵלַי
  choice: నా దగ్గరికి వర్తమానం పంపి
  rationale: אֵלַיలోని ‘నా దగ్గరికి/నాకు’ అనే దిశను నిలుపుతూ, తరువాతి వచనంలో వచ్చే సందేశానికి తెలుగు వాక్యాన్ని సహజంగా అనుసంధానిస్తుంది; ‘నన్ను పిలిపించడానికి’ అని ఉద్దేశాన్ని అతిగా నిర్ధారించదు.
theological_decisions:
- issue: הָאֱלֹהִים యొక్క సూచన
  choice: బిలాము సంభాషించిన దేవుడు
  alternative: ఒక దేవుడు లేదా దేవతలు అనే సాధారణ అర్థం
  rationale: ముందరి వచనంలోని దైవిక ప్రత్యక్షతకు బిలాము స్పందిస్తున్నందున సందర్భం నిర్దిష్టమైన దేవుణ్ణే సూచిస్తుంది; అదనపు సిద్ధాంతార్థం చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యం తరువాతి వచనంలోని సందేశాన్ని పరిచయం చేస్తూ ముగుస్తుంది కాబట్టి కోలన్ భావాన్ని ‘ఇలా అన్నాడు’తో స్పష్టం చేసింది; పాదసూచికలో మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలిపింది.
