  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: te
  text: సిప్పోరు కుమారుడైన బాలాకు ఇశ్రాయేలు అమోరీయులకు[a] చేసినదంతా చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అమోరీయునికి’ అని ఏకవచన జాతిపదాన్ని సమూహార్థంలో ఉపయోగించింది; అంటే ‘అమోరీయులకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה యొక్క సాధారణ అర్థాన్ని సహజమైన తెలుగు కథన భూతకాలంలో వ్యక్తం చేస్తుంది. వావ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో వాక్యక్రమమే ఆ అనుసంధానాన్ని తెలియజేస్తుంది కాబట్టి ‘అప్పుడు’ వంటి స్పష్టమైన కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: בָּלָק
  choice: బాలాకు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సులభంగా పలికే ప్రామాణిక లిప్యంతరీకరణ.
- source_word: בֶּן צִפּוֹר
  choice: సిప్పోరు కుమారుడైన
  rationale: వంశసంబంధాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: אֵת כָּל אֲשֶׁר
  choice: చేసినదంతా
  rationale: క్రింది క్రియకు సంబంధించిన సంపూర్ణతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: బాలాకు చూడటానికి ముందే పూర్తైన కార్యాన్ని తెలుగు సంబంధకృదంత నిర్మాణం సహజంగా తెలియజేస్తుంది; హీబ్రూ క్రియకు అదనపు భావాన్ని జోడించదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజాసమూహాన్ని సూచించే పేరుకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణ.
- source_word: לָאֱמֹרִי
  choice: అమోరీయులకు
  rationale: లְ ఉపసర్గలోని విస్తృత ‘కు’ సంబంధాన్ని నిలుపుతుంది. ఏకవచన జాతిపదం సమూహార్థంలో ఉన్నందున తెలుగులో సహజమైన బహువచన రూపం వాడబడింది.
