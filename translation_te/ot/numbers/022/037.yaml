  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: te
  text: 'బాలాకు బిలాముతో ఇలా అన్నాడు: “నిన్ను పిలిపించడానికి నేను నీ దగ్గరికి నిశ్చయంగా పంపించాను కదా?[a] నువ్వు నా దగ్గరికి ఎందుకు రాలేదు?[b] నిన్ను ఘనపరచడానికి నాకు నిజంగా సామర్థ్యం లేదా?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో క్రియను ఉద్ఘాటించడానికి infinitive absoluteతో పాటు అదే క్రియ యొక్క finite రూపం వాడబడింది. దీన్ని ‘నేను నిశ్చయంగా పంపించాను’ అని కూడా అనువదించవచ్చు; సందర్భానుసారం పదేపదే లేదా అత్యవసరంగా పంపించాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నువ్వు నా దగ్గరికి ఎందుకు వెళ్లలేదు?’
    reason: lexical_alternative
  - marker: c
    text: ‘ఘనపరచడం’లో గౌరవం చూపడమే కాకుండా బహుమానం ఇవ్వడం లేదా ఉన్నత హోదా కల్పించడం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: הֲלֹא
  choice: … కదా!
  rationale: అవుననే సమాధానాన్ని ఆశించే ప్రతికూల అలంకార ప్రశ్న బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: పంపాను
  rationale: Infinitive absolute మరియు finite verb కలయికలోని ఉద్ఘాటనను ‘కదా’తో కూడిన వాక్య నిర్మాణం మోస్తుంది; ‘అత్యవసరంగా’ లేదా ‘పదేపదే’ అని మూలంలో లేని ప్రత్యేక భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: לִקְרֹא לָךְ
  choice: నిన్ను పిలిపించడానికి
  rationale: ఇక్కడ קרא వ్యక్తిని రప్పించేందుకు పిలవడం/కబురు పంపడం అనే భావంలో ఉంది; రాజు దూతలను పంపిన సందర్భానికి ‘పిలిపించడానికి’ సహజంగా సరిపోతుంది.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: నువ్వు నా దగ్గరికి ఎందుకు రాలేదు?
  rationale: הלך అక్షరార్థంగా ‘వెళ్లు’ అయినా, మాట్లాడుతున్న బాలాకు దృష్టికోణంలో తెలుగులో ‘నా దగ్గరికి రాలేదు’ అనడం సహజం.
- source_word: הַאֻמְנָם
  choice: నిజంగా
  rationale: బాలాకు వ్యక్తం చేస్తున్న నమ్మలేకపోవడం లేదా అభ్యంతరంతో కూడిన ఉద్ఘాటిత ప్రశ్నను కాపాడుతుంది.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: నిన్ను ఘనపరచగల సామర్థ్యం … నాకు లేదా?
  rationale: יכל లోని సామర్థ్య భావాన్నీ, כבד లోని విస్తృతమైన గౌరవం/హోదా/బహుమానం భావాన్నీ సంకుచితం చేయకుండా నిలుపుతుంది.
