source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: te
  text: 'యెహోవా దూత అతనితో ఇలా అన్నాడు: “నీ గాడిదను ఈ మూడు సార్లు ఎందుకు కొట్టావు? ఇదిగో, నేను నీకు విరోధిగా[a] బయలుదేరి వచ్చాను; ఎందుకంటే నా ఎదుట నీ మార్గం వక్రమైనదిగా ఉంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హెబ్రీ పదం שָׂטָן (సాతాన్) అంటే ‘విరోధి’ లేదా ‘ఎదిరించేవాడు’; ఇది తప్పనిసరిగా ‘సాతాను’ అనే సొంతపేరు కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వక్రమైనదిగా ఉంది’ అని అనువదించిన హెబ్రీ క్రియ చాలా అరుదైనది. దీనిని ‘దుడుకుగా సాగుతోంది’ లేదా ‘నాకు విరుద్ధంగా ఉంది’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘సందేశవాహకుడు’ అనే అర్థాలు ఉండవచ్చు; ఈ కథనంలో బిలామును ఎదుర్కొంటున్న అతీంద్రియ దూతను సూచిస్తుంది. యెహోవా అనే వ్యక్తిగత నామాన్ని అలాగే ఉంచాం.
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: నీ గాడిదను ... కొట్టావు
  rationale: נכה అంటే ‘కొట్టు’; అతి తీవ్రతను అదనంగా చేర్చకుండా నేరుగా అనువదించాం. אֲתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచించినా, ఇక్కడ సహజమైన తెలుగులో ‘గాడిద’ సరిపోతుంది.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ఈ మూడు సార్లు
  rationale: పదశః ‘మూడు పాదాలు/సందర్భాలు’ అనే హెబ్రీయ idiom ఇక్కడ ‘మూడు సార్లు’ అని అర్థం.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: ఇదిగో, నేను ... బయలుదేరి వచ్చాను
  rationale: הִנֵּה యొక్క దృష్టి ఆకర్షించే బలాన్ని ‘ఇదిగో’ నిలుపుతుంది; יצא ఇక్కడ ఎదుర్కొనేందుకు బయలుదేరి రావడాన్ని సూచిస్తుంది.
- source_word: לְשָׂטָן
  choice: నీకు విరోధిగా
  rationale: שָׂטָן ఇక్కడ సొంతపేరు కాకుండా ‘విరోధి/ఎదిరించేవాడు’ అనే సాధారణ నామవాచకంగా పనిచేస్తుంది. సందర్భం వల్ల అంతర్భూతమైన ‘నీకు’ను సహజమైన తెలుగులో స్పష్టం చేశాం.
- source_word: יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: నీ మార్గం నా ఎదుట వక్రంగా ఉంది
  rationale: יָרַט అత్యంత అరుదైన, అర్థనిర్ణయం కష్టమైన క్రియ. ‘వక్రంగా ఉంది’ అనేది తప్పుదారి, విరుద్ధత అనే సందర్భార్థాన్ని అందిస్తూనే ఒక్క సన్నని అర్థానికి పరిమితం చేయదు. ‘నీ మార్గం’ బిలాము చేపట్టిన ప్రయాణం/ప్రవర్తనా దిశను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לְשָׂטָן ను సొంతపేరుగా తీసుకోవాలా?
  choice: 'సాధారణ నామవాచకం: ‘నీకు విరోధిగా’'
  alternative: ‘సాతానుగా’
  rationale: ఈ సందర్భంలో యెహోవా దూత బిలామును అడ్డుకోవడానికి నిలుస్తున్నాడు. దీన్ని ‘సాతాను’ అనే సొంతపేరుగా అనువదిస్తే మూలపాఠం చేయని దయ్యశాస్త్ర సంబంధమైన వాదనను దిగుమతి చేసినట్లవుతుంది.
- issue: అరుదైన יָרַט క్రియ యొక్క భావం
  choice: ‘వక్రంగా ఉంది’
  alternative: ‘దుడుకుగా సాగుతోంది’ లేదా ‘నాకు విరుద్ధంగా ఉంది’
  rationale: ఈ ఏకప్రయోగ క్రియకు ఖచ్చితమైన అర్థం అనిశ్చితం. ప్రధాన పాఠంలో సందర్భానికి సరిపోయే విస్తృత భావాన్ని ఇచ్చి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘ఇదిగో’ కథనంలోని హెచ్చరికాత్మక దృష్టి ఆకర్షణను నిలుపుతుంది. అరుదైన క్రియలోని అనిశ్చితిని ప్రధాన పాఠం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
