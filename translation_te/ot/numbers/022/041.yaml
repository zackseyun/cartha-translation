  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: te
  text: ఉదయాన బాలాకు బిలామును తీసుకొని, అతణ్ణి బామోత్-బయలు[a]కు పైకి తీసుకెళ్లాడు. అక్కడి నుండి బిలాము ప్రజల అంచును[b] చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, దీనిని స్థలనామంగా కాక వివరణాత్మకంగా తీసుకుంటే, ‘బయలు యొక్క ఉన్నత స్థలాలు.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, అక్కడి నుండి ఇశ్రాయేలు ప్రజల బయటి అంచు మాత్రమే కనిపించింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం
  rationale: హీబ్రూ కథన క్రమంలోని తదుపరి సంఘటనకు కాలపరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కథన సూత్రాన్ని అనవసరంగా పదానువాదం చేయదు.
- source_word: וַיִּקַּח
  choice: వెంటబెట్టుకొని బయలుదేరి
  rationale: לקח ఇక్కడ బాలాకు బిలామును తనతో మరో ప్రదేశానికి తీసుకెళ్లడాన్ని సూచిస్తుంది. తెలుగు కథనంలో సహజంగా ఉండేందుకు గమన భావాన్ని సందర్భానుసారంగా వ్యక్తం చేసింది.
- source_word: וַיַּעֲלֵהוּ
  choice: అతణ్ణి ... ఎక్కించి తీసుకెళ్లాడు
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి వెళ్లేలా చేయడం/పైకి తీసుకెళ్లడం’ అనే కారణార్థాన్ని, ఎత్తైన ప్రదేశానికి ఎక్కించే భావంతో స్పష్టంగా ఉంచుతుంది.
- source_word: בָּמוֹת בָּעַל
  choice: బామోత్-బయలు
  rationale: సందర్భంలో ఇది స్థలనామంగా పనిచేస్తుంది. అందువల్ల అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; వివరణాత్మక అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּרְא
  choice: బిలాము ... చూశాడు
  rationale: ראה యొక్క సాధారణ అర్థం ‘చూడు.’ హీబ్రూలో కర్త అంతర్లీనంగా ఉన్నా, సందర్భం ప్రకారం చూసినవాడు బిలాము; తెలుగులో సందిగ్ధత రాకుండా పేరు స్పష్టంగా పేర్కొనబడింది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: చూసిన ప్రదేశాన్ని సూచించే సరళమైన స్థానవాచక ప్రయోగం.
- source_word: קְצֵה הָעָם
  choice: ప్రజల చివరి భాగాన్ని
  rationale: קצה అంటే చివర, అంచు, చివరి భాగం. మూలంలో ‘శిబిరం’ అని లేదు కాబట్టి దాన్ని చేర్చకుండా, ప్రజల్లో బయటి చివరనున్న భాగం మాత్రమే కనిపించిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
