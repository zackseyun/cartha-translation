translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాన్ని లిప్యంతరీకరించి, దాని సాధ్యమైన వివరణాత్మక అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం. అంతర్లీన కర్త వల్ల తెలుగులో కలగగల సందిగ్ధతను నివారించేందుకు ‘బిలాము’ అని స్పష్టపరిచాం.
