revisions:
- from: ఉదయం బాలాకు బిలామును వెంటబెట్టుకొని బయలుదేరి, అతణ్ణి బామోత్-బయలు[a]కు ఎక్కించి తీసుకెళ్లాడు. అక్కడి నుండి బిలాము ప్రజల చివరి భాగాన్ని[b] చూశాడు.
  to: ఉదయాన బాలాకు బిలామును తీసుకొని, అతణ్ణి బామోత్-బయలు[a]కు పైకి తీసుకెళ్లాడు. అక్కడి నుండి బిలాము ప్రజల అంచును[b] చూశాడు.
  rationale: The revision keeps the Hebrew's two actions (‘took’ and ‘brought up’) without adding an explicit departure, uses a direct modern Telugu narrative flow, and renders the visible ‘edge/extremity’ of the people with less ambiguity. Footnote anchors remain attached to the place name and to ‘అంచు,’ respectively.
  reviewer_model: gpt-5.6-terra
