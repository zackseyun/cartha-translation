language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: te
  text: అప్పుడు దేవుడు బిలాము దగ్గరకు వచ్చి, “నీతో ఉన్న ఈ మనుషులు ఎవరు?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ కథన క్రమంలో ‘వచ్చాడు’ అనే సాధారణ అర్థాన్ని ఇస్తుంది. తెలుగులో తరువాతి మాటల క్రియతో సహజంగా కలపడానికి ‘వచ్చి’ అని అనువదించాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో ఉన్న ఈ కథన సందర్భంలో ఈ పదం వ్యక్తిగతంగా కార్యం చేస్తున్న దేవుణ్ణి సూచిస్తుంది.
- source_word: אֶל בִּלְעָם
  choice: బిలాము దగ్గరకు
  rationale: אֶל దిశను సూచిస్తుంది. ఆధునిక తెలుగులో వ్యక్తి వద్దకు రావడాన్ని ‘దగ్గరకు’ అనడం సహజంగా ఉంటుంది.
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: אמר మౌలికంగా ‘అన్నాడు’ అయినా, ఇక్కడ ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తోంది; తెలుగులో ‘అని అడిగాడు’ ప్రశ్న అనే వాక్యకార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: వ్యక్తుల గుర్తింపును అడిగే ప్రశ్నార్థక పదానికి ప్రత్యక్ష సమానం.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ఈ మనుషులు
  rationale: పురుష దూతలను సూచించే אֲנָשִׁים ను ‘మనుషులు’ అని, సమీప నిర్దేశకమైన הָאֵלֶּה ను ‘ఈ’ అని అనువదించాం.
- source_word: עִמָּךְ
  choice: నీతో ఉన్న
  rationale: עם సహవాసం లేదా తోడును సూచిస్తుంది; ప్రశ్నలో ‘నీతో ఉన్న’ అనేది స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభంలోని waw కథనాన్ని ముందుకు నడిపే క్రమాన్ని సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: బిలాము కథనంలో אֱלֹהִים పదం సూచించే వ్యక్తి
  choice: దేవుడు
  alternative: ఒక దేవుడు / దైవిక సత్త
  rationale: ఏకవచన క్రియా సమన్వయం మరియు కథన సందర్భం ఇశ్రాయేలు దేవుడే బిలాముతో మాట్లాడుతున్నాడని సూచిస్తున్నాయి. ‘దేవుడు’ అనే అనువాదం అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ సూచనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రశ్న నేరుగా, సంక్షిప్తంగా నిలుపబడింది; పాదటిప్పణులు అవసరం లేదు.
