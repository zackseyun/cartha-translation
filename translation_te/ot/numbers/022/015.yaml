translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మునుపటి వారు’ అని చెప్పడం ద్వారా పోలిక యొక్క సూచిత సంబంధాన్ని స్పష్టం చేశాం; గౌరవం, ప్రతిష్ఠ, హోదా మధ్య ఉన్న మూలపద విస్తృతిని పాదటిప్పణిలో నిలిపాం.
