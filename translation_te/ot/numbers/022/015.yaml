  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: te
  text: అప్పుడు బాలాకు మునుపటి వారికంటే ఎక్కువమంది, మరింత గౌరవనీయులైన అధికారులను మళ్లీ పంపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరింత గౌరవనీయులైన’ అనే మాటకు ‘మరింత ప్రతిష్ఠగలవారైన’ లేదా ‘ఉన్నత హోదాగలవారైన’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం వారికి ఎక్కువ సామాజిక గౌరవం లేదా ఉన్నత స్థాయి ఉందని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: మళ్లీ ... పంపించాడు
  rationale: יָסַף + క్రియార్థక నామరూపం, దానికి తోడు עוֹד ఉన్న ఈ హీబ్రూ ప్రయోగం చర్య పునరావృతమైందని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మళ్లీ పంపించాడు’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: בָּלָק
  choice: బాలాకు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: שָׂרִים
  choice: అధికారులను
  rationale: ఈ సందర్భంలో ఈ పదం రాజు తరఫున వెళ్లే ఉన్నతస్థాయి ప్రతినిధులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, రాజకుమారులనే పరిమిత అర్థాన్ని కలిగించదు.
- source_word: רַבִּים
  choice: ఎక్కువమంది
  rationale: מֵאֵלֶּה అనే పోలికతో కలిసి ఇది ముందు పంపిన బృందం కంటే సంఖ్య ఎక్కువని సూచిస్తుంది.
- source_word: וְנִכְבָּדִים
  choice: మరింత గౌరవస్థులైన
  rationale: כבד మూలం ఇక్కడ సామాజిక గౌరవం, హోదా లేదా ప్రతిష్ఠ కలిగినవారనే భావాన్ని ఇస్తుంది. ‘గౌరవస్థులు’ ఆ స్థాయి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: מֵאֵלֶּה
  choice: మునుపటి వారికంటే
  rationale: అక్షరార్థంగా ‘వీరికంటే’ అయినా, సూచన ముందుగా పంపబడిన అధికారుల వైపు ఉంది. తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా చేయడానికి ‘మునుపటి వారికంటే’ వాడాం.
