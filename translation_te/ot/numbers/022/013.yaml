revisions:
- from: కాబట్టి బిలాము ఉదయాన్నే లేచి బాలాకు అధికారులతో[a], “మీ దేశానికి వెళ్లండి; ఎందుకంటే యెహోవా నన్ను మీతో వెళ్లనివ్వడానికి నిరాకరించాడు” అని చెప్పాడు.
  to: బిలాము ఉదయాన్నే లేచి బాలాకు అధికారులతో[a] ఇలా అన్నాడు, “మీ దేశానికి వెళ్లండి, ఎందుకంటే యాహ్వే నన్ను మీతో వెళ్లనివ్వడానికి నిరాకరించాడు.”
  rationale: Removed the added inferential connective, repaired the Telugu direct-speech syntax, and changed the rendering of the Tetragrammaton to 'యాహ్వే' in conformity with the specified English POB audit trail. The sense of the Hebrew perfect 'has refused/refused' is retained naturally in Telugu as 'నిరాకరించాడు.'
