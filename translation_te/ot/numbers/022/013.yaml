  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: te
  text: బిలాము ఉదయాన్నే లేచి బాలాకు అధికారులతో[a] ఇలా అన్నాడు, “మీ దేశానికి వెళ్లండి, ఎందుకంటే యాహ్వే నన్ను మీతో వెళ్లనివ్వడానికి నిరాకరించాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాలాకు అధిపతులతో,” లేక “బాలాకు నాయకులతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క కథన రూపం తదుపరి చర్యను సూచిస్తుంది; ‘ఉదయాన్నే లేచి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన్నే
  rationale: ఇది ఉదయ సమయాన్ని సూచించే సాధారణ కాలవాచకం; తెలుగు కథనంలో ‘ఉదయాన్నే’ సహజమైన సమానార్థకం.
- source_word: שָׂרֵי בָלָק
  choice: బాలాకు అధికారులు
  rationale: שָׂרִים అనే పదం అధికారులు, అధిపతులు లేదా నాయకులను సూచించగలదు. ఇక్కడ వారు రాజు పంపిన ప్రతినిధులు కాబట్టి ‘అధికారులు’ సందర్భానికి తగినది; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: לְכוּ
  choice: వెళ్లండి
  rationale: הלך యొక్క బహువచన ఆజ్ఞారూపానికి నేరమైన, గౌరవసూచక తెలుగు రూపం.
- source_word: אֶל אַרְצְכֶם
  choice: మీ దేశానికి
  rationale: אֶרֶץ ఇక్కడ ప్రతినిధులు తిరిగి వెళ్లవలసిన వారి దేశాన్ని సూచిస్తుంది; ‘మీ దేశానికి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: బిలాము ఇచ్చిన ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מֵאֵן
  choice: నిరాకరించాడు
  rationale: מאן యొక్క పీయేల్ సంపూర్ణరూపం స్పష్టమైన నిరాకరణను వ్యక్తం చేస్తుంది; తెలుగు భూతకాల రూపం కథన సందర్భానికి సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: לְתִתִּי
  choice: నన్ను … వెళ్లనివ్వడానికి
  rationale: נתן + క్రియార్థక రూపం ఇక్కడ అనుమతించడం అనే ప్రయోగార్థాన్ని కలిగి ఉంది; అక్షరార్థ అనువాదం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: మీతో వెళ్లనివ్వడానికి
  rationale: הלך + עִם ప్రతినిధులతో కలిసి ప్రయాణించడాన్ని సూచిస్తుంది; ‘మీతో వెళ్లడం’ నేరమైన తెలుగు సమానార్థకం.
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: కథనంలో మాటను పరిచయం చేసే సాధారణ క్రియ; ఉద్ధరణ అనంతరం తెలుగులో సహజమైన వాక్య నిర్మాణం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరింత ప్రత్యక్ష లిప్యంతరీకరణగా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు ఉద్ధరణ నిర్మాణాన్ని వాడాం; అయితే కారణ సంబంధం, నిరాకరణ బలం, దైవనామం యథాతథంగా నిలిపాం.
