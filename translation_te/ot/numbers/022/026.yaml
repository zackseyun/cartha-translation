  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: te
  text: అప్పుడు యెహోవా దూత మరింత ముందుకు వెళ్లి, కుడివైపుకుగానీ ఎడమవైపుకుగానీ తిరగడానికి అవకాశం లేని ఇరుకైన ప్రదేశంలో నిలబడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందుకు సాగుతూనే వెళ్లి”; హెబ్రీ ప్రయోగంలో కొనసాగుతూ ముందుకు వెళ్లడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: ఇంకా ముందుకు వెళ్లి
  rationale: יסף + infinitive construction continuing or proceeding onward conveys the idiomatic sense; Telugu's 'ఇంకా ముందుకు వెళ్లి' naturally expresses that the messenger went farther.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: In this supernatural narrative מַלְאַךְ is appropriately rendered 'దూత'; the divine name is preserved as 'యెహోవా' in familiar modern Telugu biblical form.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: עמד here describes taking or holding a standing position; 'నిలబడ్డాడు' is direct and natural in Telugu.
- source_word: בְּמָקוֹם צָר
  choice: ఒక ఇరుకైన చోట
  rationale: The phrase denotes a physically constricted location, naturally conveyed by 'ఇరుకైన చోట'.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: తిరగడానికి వీలులేని
  rationale: The clause means there was no way or room to turn aside; this idiomatic Telugu wording preserves the practical spatial sense.
- source_word: יָמִין וּשְׂמֹאול
  choice: కుడికిగానీ ఎడమకిగానీ
  rationale: The correlative Telugu construction clearly communicates that neither direction was available.
theological_decisions:
- issue: యెహోవా అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: The Hebrew text directly uses יהוה. 'యెహోవా' preserves a proper-name rendering and is broadly recognizable in Telugu, while avoiding substitution with a title such as 'ప్రభువు'.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కథన గంభీరతను నిలుపుతూ, మూలంలోని స్థలసంబంధ స్పష్టతను కాపాడింది. Footnote marker is placed after the complete sentence.
