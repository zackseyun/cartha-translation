- from: బిలాము వచ్చాడని బాలాకు విన్నప్పుడు, అతన్ని కలుసుకోవడానికి మోయాబు పట్టణానికి[a] బయలుదేరి వెళ్లాడు. అది అర్నోను సరిహద్దు దగ్గర, ఆ సరిహద్దు చివర ఉంది.[b]
