translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మోయాబు,’ ‘అర్నోను,’ ‘బిలాము,’ ‘బాలాకు’ రూపాలు తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా ఉన్నాయి. మూలంలోని భౌగోళిక పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, నిజమైన పదార్థ సందిగ్ధతలను పాదసూచికల్లో భద్రపరిచాం.
