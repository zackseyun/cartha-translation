  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: te
  text: బాలాకు బిలాము వచ్చాడని వినగానే, అతన్ని కలుసుకోవడానికి అతడు అర్నోను సరిహద్దుపై[b], ఆ సరిహద్దు చివర ఉన్న మోయాబు పట్టణానికి[a] బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోయాబుకు చెందిన ఒక పట్టణానికి.’ హీబ్రూ పదబంధం మోయాబులో అందరికీ తెలిసిన ఒక నిర్దిష్ట పట్టణాన్ని గానీ, మోయాబుకు చెందిన ఏదో ఒక పట్టణాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అర్నోను ప్రాంతం చివర ఉన్న.’ ఇక్కడ ‘సరిహద్దు’గా అనువదించిన హీబ్రూ పదానికి కొన్ని సందర్భాల్లో ‘ప్రాంతం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: שׁמע అనే క్రియకు సహజమైన ప్రాథమిక అర్థం ‘వినడం.’ వార్త ఎలా అందిందో మూలపాఠం చెప్పనందున ‘తెలుసుకున్నప్పుడు’ అని విస్తరించకుండా నేరుగా అనువదించబడింది.
- source_word: כִּי בָא בִלְעָם
  choice: బిలాము వచ్చాడని
  rationale: ఈ ఉపవాక్యం బాలాకు విన్న విషయాన్ని తెలియజేస్తుంది. వచ్చి చేరిన తరువాత బాలాకు బయలుదేరిన కథాక్రమాన్ని తెలుగు భూతకాల రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: అతన్ని కలుసుకోవడానికి ... బయలుదేరి వెళ్లాడు
  rationale: יצא కదలికను, לקראת ఎదురుగా వెళ్లి కలుసుకోవడాన్ని సూచిస్తాయి. ‘స్వాగతించడానికి’ అనడం మూలంలో స్పష్టంగా లేని ఆప్యాయతను చేర్చుతుంది; కాబట్టి తటస్థమైన ‘కలుసుకోవడానికి’ ఎంచుకోబడింది.
- source_word: אֶל עִיר מוֹאָב
  choice: మోయాబు పట్టణానికి
  rationale: కదలికను సూచించే אֶל ను తెలుగులో ‘కు’తో సహజంగా వ్యక్తం చేశాం. עִיר מוֹאָב ఒక నిర్దిష్ట పట్టణాన్నా లేక మోయాబుకు చెందిన ఒక పట్టణాన్నా సూచించవచ్చు; ప్రధాన పాఠంలో నిర్దిష్ట భౌగోళిక నామంగా ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: అది అర్నోను సరిహద్దు దగ్గర
  rationale: עַל גְּבוּל సరిహద్దుపై లేదా దాని దగ్గర ఉన్న స్థానాన్ని సూచిస్తుంది. అర్నోను నది/వాగు సరిహద్దు సూచికగా ఉన్న భావాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘సరిహద్దు దగ్గర’ వాడబడింది.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: ఆ సరిహద్దు చివర ఉంది
  rationale: קצה అంటే చివర, అంచు. גבול పదం వెంటనే మళ్లీ రావడాన్ని మూలంలోని పునరుక్తికి అనుగుణంగా ‘సరిహద్దు’గానే ఉంచాం; ‘ప్రాంతం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
