revisions:
- from: 'మోయాబు మిద్యాను పెద్దలతో ఇలా అన్నాడు: “ఇప్పుడు ఈ సమాజం మన చుట్టూ ఉన్నదంతా నాకివేస్తుంది[a]—ఎద్దు పొలంలోని పచ్చని మొలకలను నాకివేసినట్లుగా.” ఆ సమయంలో సిప్పోరు కుమారుడైన బాలాకు మోయాబుకు రాజుగా ఉన్నాడు.'
  to: 'మోయాబు మిద్యాను పెద్దలతో ఇలా చెప్పాడు: “ఇప్పుడు ఈ సమాజం మన చుట్టూ ఉన్నదంతా నాకివేస్తుంది[a]—ఎద్దు పొలంలోని పచ్చని వృక్షసంపదను నాకివేసినట్లుగా.” సిప్పోరు కుమారుడైన బాలాకు ఆ సమయంలో మోయాబుకు రాజుగా ఉన్నాడు.'
  rationale: The revision corrects the grammatical expression of Balak’s kingship, broadens the vegetation term to match the Hebrew, and smooths the speech introduction without altering the source sense or the repeated licking imagery.
