  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: te
  text: 'మోయాబు మిద్యాను పెద్దలతో ఇలా చెప్పాడు: “ఇప్పుడు ఈ సమాజం మన చుట్టూ ఉన్నదంతా నాకివేస్తుంది[a]—ఎద్దు పొలంలోని పచ్చని వృక్షసంపదను నాకివేసినట్లుగా.” సిప్పోరు కుమారుడైన బాలాకు ఆ సమయంలో మోయాబుకు రాజుగా ఉన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మింగివేస్తుంది.” హీబ్రూ క్రియకు అక్షరార్థంగా “నాకివేయడం” అనే భావం ఉంది; ప్రధాన పాఠం ఎద్దు ఉపమానంలోని చిత్రాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: ఇక్కడ దేశం లేదా దాని ప్రజలు ఒక వ్యక్తిలా మాట్లాడుతున్నట్లు ఏకవచనంలో ఉంది; తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘మోయాబు’ అని ఉంచాం.
- source_word: זִקְנֵי מִדְיָן
  choice: మిద్యాను పెద్దలు
  rationale: నిర్మాణ బహువచనమైన ‘మిద్యాను యొక్క పెద్దలు’ అనే అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַקָּהָל
  choice: ఈ సమాజం
  rationale: సమకూడిన ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ సమూహార్థాన్ని నిలుపుతూ కేవలం జనసంఖ్యను మాత్రమే నొక్కిచెప్పదు.
- source_word: יְלַחֲכוּ
  choice: నాకివేస్తుంది
  rationale: לחך అనే క్రియలోని ‘నాకు’ అనే ప్రత్యక్ష చిత్రాన్ని నిలుపుతుంది; వెంటనే వచ్చే ఎద్దు ఉపమానంతో సహజంగా కలుస్తుంది.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: మన చుట్టూ ఉన్నదంతా
  rationale: ‘మన పరిసరాలన్నిటిని’ అనే మూలార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: ఎద్దు ... నాకివేసినట్లుగా
  rationale: తులనాత్మక నిర్మాణాన్నీ, ముందున్న לחך ధాతువు పునరుక్తినీ కాపాడుతుంది.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: పొలంలోని పచ్చని మొలకలు
  rationale: יֶרֶק కేవలం గడ్డికే పరిమితం కాకుండా పచ్చని వృక్షవృద్ధిని సూచిస్తుంది; ‘పచ్చని మొలకలు’ ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: సిప్పోరు కుమారుడైన బాలాకు
  rationale: వంశసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తూ వ్యక్తినామాలను లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: ఆ సమయంలో ... మోయాబుకు రాజుగా ఉన్నాడు
  rationale: నేపథ్య సమాచారాన్ని తెలిపే వాక్యాన్ని, కాలసూచనను మూలానికి దగ్గరగా మరియు సహజంగా అందిస్తుంది.
