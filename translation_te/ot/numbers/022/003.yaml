translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మోయాబు’ను ప్రజాసమూహంగా తీసుకొని తెలుగు వ్యాకరణానుసారం స్త్రీలింగ ఏకవచన క్రియారూపాలు ఉపయోగించబడ్డాయి. మూలంలోని రెండు వేర్వేరు భయప్రతిస్పందన క్రియల భేదాన్ని సాధ్యమైనంతవరకు నిలుపుకున్నాం.
