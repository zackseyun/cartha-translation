revisions:
- from: ఆ ప్రజలు చాలా విస్తారంగా ఉన్నందువల్ల మోయాబు వారికి చాలా భయపడింది; ఇశ్రాయేలు కుమారుల కారణంగా మోయాబు తీవ్రమైన భయాందోళనకు గురైంది.[a]
  to: ఆ ప్రజల కారణంగా మోయాబు చాలా భయపడింది, ఎందుకంటే వారు ఎంతో ఎక్కువగా ఉన్నారు; ఇశ్రాయేలు కుమారుల కారణంగా మోయాబు తీవ్రంగా కలవరపడింది.[a]
  rationale: The revision restores the source order, renders Israel’s size as numerical abundance rather than physical extent, and uses natural modern Telugu. It preserves the ambiguity of וַיָּקָץ through a contextually appropriate main rendering and a footnote that gives the principal lexical alternatives.
