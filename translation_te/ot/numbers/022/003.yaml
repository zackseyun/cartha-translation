source:
  edition: WLC
  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: te
  text: ఆ ప్రజల కారణంగా మోయాబు చాలా భయపడింది, ఎందుకంటే వారు ఎంతో ఎక్కువగా ఉన్నారు; ఇశ్రాయేలు కుమారుల కారణంగా మోయాబు తీవ్రంగా కలవరపడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు కుమారుల పట్ల మోయాబుకు అసహ్యం కలిగింది’ లేదా ‘ఇశ్రాయేలు కుమారుల కారణంగా మోయాబు విసిగిపోయింది’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ అసహ్యం, విసుగు, లేదా భయంతో కూడిన కలవరాన్ని సూచించగలదు; ఇక్కడి సందర్భంలో భయంతో కూడిన కలవరమే ప్రధానంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: చాలా భయపడింది
  rationale: גור అనే క్రియ ఈ సందర్భంలో భయపడడం లేదా బెదిరిపోవడం అనే భావాన్ని ఇస్తుంది; מְאֹד తీవ్రతను సూచిస్తున్నందున ‘చాలా’ చేర్చబడింది.
- source_word: מִפְּנֵי הָעָם
  choice: ఆ ప్రజలకు
  rationale: מִפְּנֵי ఇక్కడ కారణాన్ని సూచిస్తుంది. הָעָם అనేది ఇశ్రాయేలును సమష్టిగా సూచించే ఏకవచన నామవాచకం; తెలుగులో ‘ఆ ప్రజలు’ సహజంగా ఉంటుంది.
- source_word: כִּי רַב הוּא
  choice: ఆ ప్రజలు చాలా విస్తారంగా ఉన్నందువల్ల
  rationale: רַב ఇక్కడ జనసంఖ్య అధికంగా ఉండడాన్ని సూచిస్తుంది. హీబ్రూలో సమష్టి నామవాచకంతో ఏకవచన సర్వనామం ఉన్నా, తెలుగులో బహువచన నిర్మాణం సహజం.
- source_word: וַיָּקָץ
  choice: తీవ్రమైన భయాందోళనకు గురైంది
  rationale: קוץ అనే క్రియ అసహ్యం, విసుగు, లేదా భయంతో కూడిన తీవ్రమైన కలవరాన్ని వ్యక్తం చేయగలదు. సందర్భంలో భయం ప్రధానంగా ఉన్నప్పటికీ దాని విస్తృత భావపరిధిని పాదటిప్పణిలో నిలుపుకున్నాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పురుషలింగ బహువచన నిర్మాణాన్ని పారదర్శకంగా నిలుపుతూ, తెలుగులో అర్థమయ్యే సంప్రదాయబద్ధమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: స్థలాన్నీ అక్కడి ప్రజలనూ సమష్టిగా సూచించే ప్రామాణిక తెలుగు రూపం.
