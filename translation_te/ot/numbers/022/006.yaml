id: NUM.22.6
reference: Numbers 22:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, దయచేసి వచ్చి నా కోసం ఈ ప్రజలను శపించు; ఎందుకంటే వారు నాకంటే బలవంతులు. బహుశా నేను వారిని దెబ్బతీసి దేశం నుండి వెళ్లగొట్టగలనేమో. ఎందుకంటే నీవు ఎవరిని ఆశీర్వదిస్తే వారు ఆశీర్వదించబడతారని, ఎవరిని శపిస్తే వారు శపించబడతారని నాకు తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి మాటతో సంబంధాన్ని, విజ్ఞప్తిలోని తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: לְכָה נָּא
  choice: దయచేసి వచ్చి
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన వేడుకోలు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: నా కోసం ఈ ప్రజలను శపించు
  rationale: אָרָה లోని శాపం విధించే భావాన్ని, לִּי లోని బాలాకు ప్రయోజనార్థక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: ఎందుకంటే వారు నాకంటే బలవంతులు
  rationale: ఏకవచన సమూహవాచకమైన ‘ప్రజలు’ను తెలుగులో సహజంగా బహువచన సూచనతో వ్యక్తం చేస్తూ, సైనిక బలంలోని పోలికను కాపాడుతుంది.
- source_word: אוּלַי אוּכַל
  choice: బహుశా నేను ... గలనేమో
  rationale: అనిశ్చితి మరియు సామర్థ్యం అనే రెండు భావాలనూ తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נַכֶּה בּוֹ
  choice: వారిని దెబ్బతీసి
  rationale: נכה యొక్క ప్రాథమిక ‘కొట్టు/దెబ్బతీయు’ భావాన్ని నిలుపుతుంది; ‘ఓడించు’ అని ఫలితాన్ని ముందుగానే నిర్దిష్టం చేయదు.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: ఈ దేశం నుండి వెళ్లగొట్టగలనేమో
  rationale: גרש లోని బలవంతంగా తరిమివేయు భావాన్ని సహజంగా అందిస్తుంది; సందర్భానుసారం నిర్దిష్ట భూభాగాన్ని ‘ఈ దేశం’గా పేర్కొంటుంది.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: నీవు ఎవరిని ఆశీర్వదిస్తే వారు ఆశీర్వదించబడతారు
  rationale: సామాన్య సంబంధవాచక నిర్మాణాన్ని, ఆశీర్వాదం ఫలప్రదమవుతుందనే కర్మణి/ఫలిత భావాన్ని నిలుపుతుంది.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: ఎవరిని శపిస్తే వారు శపించబడతారు
  rationale: ముందటి ఆశీర్వాద వాక్యంతో సమాంతర నిర్మాణాన్ని, కర్మణి ఫలిత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: బిలాము పలికే ఆశీర్వాదం లేదా శాపం యొక్క ప్రభావం
  choice: ‘ఆశీర్వదించబడతారు / శపించబడతారు’ అని మూలంలోని ఫలితాత్మక కర్మణి రూపాన్ని నిలుపడం
  alternative: బిలామే స్వతంత్రంగా ఫలితాన్ని కలిగిస్తాడని లేదా దేవుడే ప్రత్యక్షంగా చేస్తాడని వివరణ చేర్చడం
  rationale: ఈ వాక్యం బాలాకు నమ్మకాన్ని మాత్రమే తెలియజేస్తుంది; ఆ నమ్మకానికి సంబంధించిన తాత్త్విక సత్యాసత్యాలను అనువాదం స్వయంగా తీర్మానించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘శపించు,’ ‘ఆశీర్వదించు’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, ‘సంహరించు/ఓడించు’ వంటి అధిక వ్యాఖ్యాత్మక పదాలను నివారించాం.
