source:
  edition: WLC
  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: te
  text: “ఇదిగో, ఐగుప్తు నుండి వచ్చిన ప్రజలు దేశపు ముఖాన్ని[a] కప్పివేశారు. ఇప్పుడు రా, నా కోసం వారిని శపించు. బహుశా నేను వారిపై యుద్ధం చేసి, వారిని వెళ్లగొట్టగలనేమో.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దేశపు కన్ను.” ఇది దేశంలో కనిపించే ఉపరితలాన్ని లేదా ముఖాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని అత్యవసరంగా విషయంపై నిలిపే సూచనాత్మక బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇశ్రాయేలీయులను ఒక సమూహంగా సూచించే సమష్టి నామానికి సహజమైన తెలుగు రూపం.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి వచ్చిన
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న హీబ్రూ కృదంతం ప్రజలను నిర్గమన సంఘటన ద్వారా గుర్తిస్తుంది; తెలుగులో విశేషణ ఉపవాక్య రూపం స్పష్టంగా ఉంటుంది.
- source_word: וַיְכַס
  choice: కప్పివేశారు
  rationale: హీబ్రూలో సమష్టి ఏకవచన కర్తతో క్రియ ఏకవచనంగా ఉన్నా, తెలుగులో ‘ప్రజలు’కు గౌరవ/బహువచన అన్వయం సహజం; పూర్తయిన చర్య వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది.
- source_word: עֵין הָאָרֶץ
  choice: దేశం కంటిని
  rationale: మూలంలోని ‘దేశపు కన్ను’ అనే సజీవ రూపకాన్ని ప్రధాన వచనంలో నిలుపుతుంది; దాని సందర్భార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: వివరణ నుండి అత్యవసర విజ్ఞప్తికి మార్పును సూచిస్తుంది.
- source_word: לְכָה
  choice: రా
  rationale: చర్యకు పిలిచే ప్రత్యక్ష ఆజ్ఞారూపాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: קָבָה
  choice: శపించు
  rationale: శాపం పలకడం అనే క్రియ యొక్క నిర్దిష్ట బలాన్ని నేరుగా నిలుపుతుంది.
- source_word: לִּי
  choice: నా కోసం
  rationale: బాలాకు ప్రయోజనం కలిగేలా అతని పక్షాన చర్య చేయాలనే ప్రయోజనార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: אֹתוֹ
  choice: వారిని
  rationale: మూలంలో రూపపరంగా ఏకవచనమైన సర్వనామం సమష్టి నామమైన ప్రజలను సూచిస్తుంది; తెలుగులో బహువచనం సహజం.
- source_word: אוּלַי אוּכַל
  choice: బహుశా నేను ... గలనేమో
  rationale: విజయం నిశ్చయం కాదనే అవకాశం, ఆశ రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְהִלָּחֶם בּוֹ
  choice: వారితో యుద్ధం చేసి
  rationale: ప్రజలకు విరోధంగా యుద్ధంలో తలపడే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְגֵרַשְׁתִּיו
  choice: వారిని వెళ్లగొట్టగలనేమో
  rationale: భూమి లేదా ప్రాంతం నుండి బలవంతంగా తరిమివేయాలనే ఉద్దేశాన్ని తెలియజేస్తూ, ‘బహుశా నేను చేయగలను’ అనే అనిశ్చితి పరిధిని సమన్వయంగా కొనసాగిస్తుంది.
