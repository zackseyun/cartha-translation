translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘దేశం కంటిని’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడి, పాఠకునికి అర్థం స్పష్టమయ్యేలా పాదటిప్పణి జోడించబడింది. సమష్టి నామమైన ‘ప్రజలు’ను సూచించే మూల ఏకవచన సర్వనామాలు తెలుగులో సహజమైన బహువచనంగా ఇవ్వబడ్డాయి.
