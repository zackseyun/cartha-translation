source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ אֶל בִּלְעָ֑ם וַ/יֹּ֣אמְרוּ ל֗/וֹ כֹּ֤ה אָמַר֙ בָּלָ֣ק בֶּן צִפּ֔וֹר אַל נָ֥א תִמָּנַ֖ע מֵ/הֲלֹ֥ךְ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: te
  text: 'వారు బిలాము దగ్గరకు వచ్చి అతనితో ఇలా అన్నారు: “సిప్పోరు కుమారుడైన బాలాకు ఇలా అంటున్నాడు: ‘దయచేసి నా దగ్గరకు రావడానికి[a] వెనుకాడవద్దు.’”


    [a] లేదా, “నా దగ్గరకు వెళ్లడానికి.” హీబ్రూ పదానికి సాధారణంగా “వెళ్లు/నడుచు” అనే అర్థం ఉంది; అయితే “నా దగ్గరకు” అనే మాటతో వక్త దృష్టికోణాన్ని సహజంగా వ్యక్తం చేయడానికి “రావడానికి” అని అనువదించబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దగ్గరకు వెళ్లడానికి.” హీబ్రూ పదానికి సాధారణంగా “వెళ్లు/నడుచు” అనే అర్థం ఉంది; అయితే “నా దగ్గరకు” అనే మాటతో వక్త దృష్టికోణాన్ని సహజంగా వ్యక్తం చేయడానికి “రావడానికి” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: వారు బిలాము దగ్గరకు వచ్చి
  rationale: בוא అనే క్రియకు ‘రావు/ప్రవేశించు’ అనే ప్రాథమిక భావం ఉంది. దూతలు బిలామును సమీపించిన సందర్భంలో ‘దగ్గరకు వచ్చి’ సహజమైన తెలుగు కథన ప్రయోగం.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: అతనితో ఇలా అన్నారు
  rationale: אמר క్రియతో పరోక్ష కర్మను తెలుగులో సహజంగా ‘అతనితో అన్నారు’ అని వ్యక్తం చేశాం; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ఇది ప్రామాణిక దూత సందేశ సూత్రం. సందేశాన్ని పంపినవాని ప్రస్తుత వాక్యంగా తెలుగులో ‘ఇలా అంటున్నాడు’ అని ఇవ్వడం సహజంగా ఉండి అధికారిక స్వరాన్ని నిలుపుతుంది.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: సిప్పోరు కుమారుడైన బాలాకు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో ‘కుమారుడైన’ అని, వ్యక్తినామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַל־נָא
  choice: దయచేసి ... వద్దు
  rationale: אַל నిషేధాన్ని, נָא వినయపూర్వక అభ్యర్థనను సూచిస్తాయి. ఈ రెండింటి బలాన్ని ఆధునిక తెలుగులో ఈ నిర్మాణం స్పష్టంగా అందిస్తుంది.
- source_word: תִמָּנַע
  choice: వెనుకాడవద్దు
  rationale: מנע కు ‘నిలుపు, అడ్డుకో, మానుకొను’ అనే భావవ్యాప్తి ఉంది. ఇక్కడ ప్రయాణించడానికి నిరాకరించడం లేదా సంకోచించడం అనే సందర్భార్థాన్ని ‘వెనుకాడవద్దు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵהֲלֹךְ אֵלָי
  choice: నా దగ్గరకు రావడానికి
  rationale: הלך సాధారణంగా ‘వెళ్లు/నడుచు’ అని అర్థమవుతుంది; అయితే אֵלָי (‘నా దగ్గరకు’) అనే గమ్యంతో, బాలాకు దృష్టికోణం నుంచి తెలుగులో ‘రావడానికి’ సహజం. మూలంలోని చలనక్రియ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇలా అంటున్నాడు’ దూత సందేశపు అధికారిక స్వరాన్ని, ‘దయచేసి’ అభ్యర్థన స్వరాన్ని కాపాడుతాయి.
