source:
  edition: WLC
  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: te
  text: అప్పుడు యహ్వే ఆ ఆడగాడిద నోరు తెరిచాడు. అది బిలాముతో, “నేను నీకు ఏమి చేశాను? నన్ను ఈ మూడు సార్లు ఎందుకు కొట్టావు?” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: తెరిచాడు
  rationale: פתח అనే క్రియ ఇక్కడ ఖల్ రూపంలో నేరుగా ‘తెరిచాడు’ అని అర్థమిస్తుంది; దైవిక చర్యను సరళంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: פִּי הָאָתוֹן
  choice: ఆ ఆడగాడిద నోరు
  rationale: אָתוֹן ప్రత్యేకంగా ఆడగాడిదను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా సంబంధార్థాన్ని ‘ఆడగాడిద నోరు’గా వ్యక్తపరిచాం.
- source_word: וַתֹּאמֶר לְבִלְעָם
  choice: అది బిలాముతో … అని అడిగింది
  rationale: స్త్రీలింగ ఏకవచన క్రియ ఆడగాడిదనే వక్తగా సూచిస్తుంది. ప్రశ్నాత్మక ప్రత్యక్ష వాక్యానికి తెలుగులో ‘అడిగింది’ సహజంగా ఉంటుంది.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: నేను నీకు ఏమి చేశానని
  rationale: మూలంలోని ప్రశ్నను తరువాతి כִּי వాక్యంతో సహజంగా అనుసంధానిస్తూ, దాని ఫిర్యాదు స్వరాన్ని నిలిపింది.
- source_word: הִכִּיתַנִי
  choice: నన్ను … కొట్టావు
  rationale: נכה ఇక్కడ ‘కొట్టు/దెబ్బకొట్టు’ అనే సాధారణ అర్థంలో ఉంది; ‘కొట్టావు’ సందర్భానికి సహజమైన ఆధునిక తెలుగు.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ఇలా మూడుసార్లు
  rationale: רְגָלִים పదానికి అక్షరార్థం ‘పాదాలు’ అయినా, ఈ నిర్మాణం ‘మూడు సందర్భాలు/మూడుసార్లు’ అనే స్థిరప్రయోగం. זֶה యొక్క ప్రస్తుత సందర్భ సూచనను ‘ఇలా’ తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: ఆడగాడిద మాట్లాడటంలో దైవిక చర్య
  choice: యహ్వే ఆ ఆడగాడిద నోరు తెరిచాడు
  alternative: యహ్వే ఆడగాడిదకు మాట్లాడే శక్తి ఇచ్చాడు
  rationale: మూలంలోని రూపకాత్మకమైన ప్రత్యక్ష వాక్యాన్ని విపులీకరించకుండా నిలిపాం; అది చర్య ఎలా జరిగిందనే విషయాన్ని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. אָתוֹן యొక్క స్త్రీలింగ అర్థాన్ని ‘ఆడగాడిద’గా ప్రధాన పాఠంలోనే స్పష్టం చేశాం. మూలంలోని ‘మూడు పాదాలు’ అనే హీబ్రూ స్థిరప్రయోగాన్ని అక్షరానువాదం చేయకుండా ‘మూడుసార్లు’గా ఇచ్చాం; అందువల్ల పాదటిప్పణి అవసరం లేదు.
