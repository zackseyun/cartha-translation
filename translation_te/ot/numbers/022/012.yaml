id: NUM.22.12
reference: Numbers 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: te
  text: అప్పుడు దేవుడు బిలాముతో, “నీవు వారితో వెళ్లకూడదు. ప్రజలను శపించకూడదు; ఎందుకంటే వారు ఆశీర్వదించబడ్డారు[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ఇక్కడ “ప్రజలు” అనే సమూహవాచక పదానికి పుంలింగ ఏకవచన రూపం ఉంది: “ఎందుకంటే అది/అతడు ఆశీర్వదించబడినవాడు.” తెలుగులో సమూహాన్ని సూచిస్తూ సహజంగా బహువచనంలో అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో బిలాముతో నేరుగా మాట్లాడుతున్న నిజమైన దేవుడే ఉద్దేశించబడ్డాడు.
- source_word: לֹא תֵלֵךְ עִמָּהֶם
  choice: నీవు వారితో వెళ్లకూడదు
  rationale: לֹא తో వచ్చిన అసంపూర్ణ క్రియ ఇక్కడ నిషేధాన్ని వ్యక్తం చేస్తుంది; ‘వెళ్లకూడదు’ దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לֹא תָאֹר אֶת הָעָם
  choice: ఆ ప్రజలను శపించకూడదు
  rationale: אָרַר అంటే ‘శపించు’; రెండవ నిషేధాన్ని కూడా మొదటిదానికి సమాంతరంగా అనువదించాం. నిర్దిష్ట ప్రజాసమూహాన్ని సూచించేందుకు ‘ఆ ప్రజలను’ సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בָרוּךְ הוּא
  choice: ఆ ప్రజలు ఆశీర్వదించబడ్డారు
  rationale: హీబ్రూలో ఏకవచన సమూహవాచకమైన הָעָםను ఏకవచన రూపం సూచిస్తుంది. తెలుగులో ‘ప్రజలు’తో బహువచన క్రియ వాడటం సహజం; ఇది సమూహాన్నే సూచిస్తుంది, వ్యక్తులను విడివిడిగా నొక్కిచెప్పదు.
theological_decisions:
- issue: ‘ఆశీర్వదించబడ్డారు’ అనే వాక్యభాగంలోని సంఖ్య మరియు సూచిత విషయం
  choice: ఇశ్రాయేలు ప్రజలను ఒక సమూహంగా సూచిస్తూ ‘ఆ ప్రజలు ఆశీర్వదించబడ్డారు’
  alternative: ‘అది ఆశీర్వదించబడింది’ లేదా ‘అతడు ఆశీర్వదించబడ్డాడు’
  rationale: בָרוּךְ הוּא వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనప్పటికీ, దాని పూర్వపదం సమూహవాచక ఏకవచనమైన הָעָם. ‘అతడు’ అనడం ఒక వ్యక్తిని సూచించినట్లు భ్రమ కలిగిస్తుంది; ‘అది’ ఆధునిక తెలుగులో ప్రజలకు అసహజం. అందువల్ల సహజమైన బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మూలంలోని సమూహ ఏకవచనాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. దేవుని నిషేధాల బలాన్ని ‘కూడదు’తో స్పష్టంగా తెలిపాం; హీబ్రూ సమూహ ఏకవచనంలోని నిజమైన వ్యాకరణ సూక్ష్మతను పాదటిప్పణిలో నిలిపాం.
