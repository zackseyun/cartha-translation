id: NUM.22.35
reference: Numbers 22:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: te
  text: 'అప్పుడు యహ్వే దూత బిలాముతో ఇలా అన్నాడు: “ఆ మనుష్యులతో కలిసి వెళ్లు; అయితే నేను నీతో చెప్పే మాటనే నీవు చెప్పాలి.” అప్పుడు బిలాము బాలాకు అధికారులతో కలిసి వెళ్లాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో అతడు అతీంద్రియ వ్యక్తి అయినప్పటికీ, ‘దూత’ మూలపదంలోని సందేశవాహక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: ఆ మనుష్యులతో కలిసి వెళ్లు
  rationale: ఆజ్ఞారూపాన్ని, నిర్దిష్ట పురుషుల సమూహాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֶפֶס
  choice: అయితే
  rationale: ఇచ్చిన అనుమతికి వెంటనే విధించిన బలమైన పరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: דברకు ‘మాట, సందేశం, విషయం’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ చెప్పడం అనే క్రియ రెండుసార్లు రావడంతో ‘మాట’ అత్యంత సహజంగా ఉండి పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: నేను నీతో చెప్పే
  rationale: భవిష్యత్/సాపేక్ష భావాన్ని తెలుగు విశేషణ క్రియారూపం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֹתוֹ תְדַבֵּר
  choice: మాటనే నీవు చెప్పాలి
  rationale: ముందుకు తెచ్చిన אֹתוֹలోని నొక్కిచెప్పే భావాన్ని ‘నే’ ద్వారా, ఆదేశ బలాన్ని ‘చెప్పాలి’ ద్వారా తెలియజేస్తుంది.
- source_word: שָׂרֵי בָלָק
  choice: బాలాకు అధికారులు
  rationale: שָׂרִיםకు నాయకులు, అధిపతులు, రాజకుమారులు లేదా అధికారులు అనే పరిధి ఉంది. దౌత్యబృంద సందర్భంలో ‘అధికారులు’ సహజంగా ఉండి వారు రాజకుమారులేనని అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను వాడాం.
- issue: מַלְאַךְను దూతగా లేదా దేవదూతగా అనువదించడం
  choice: దూత
  alternative: దేవదూత
  rationale: కథనంలో అతీంద్రియ స్వరూపం స్పష్టమైనప్పటికీ, ‘దూత’ అనే అనువాదం మూలపదపు విస్తృత అర్థాన్ని నిలుపుతూ ఆ వ్యక్తి స్వరూపంపై అవసరానికి మించిన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘మాటనే’ అనే నొక్కింపు మూలంలోని పరిమితిని స్పష్టంగా ఉంచుతుంది. బిలాము, బాలాకు అనే రూపాలు తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా ఉన్నాయి.
