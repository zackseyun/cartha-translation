id: NUM.31.17
reference: Numbers 31:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు చిన్నపిల్లల్లోని ప్రతి మగబిడ్డను చంపండి; పురుషునితో లైంగిక సంబంధం కలిగిన[a] ప్రతి స్త్రీని చంపండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో అక్షరార్థంగా, “పురుషుని శయన సంబంధంగా పురుషుణ్ణి ఎరిగినది”; ఇది లైంగిక సంబంధాలను సూచించే హెబ్రీయ భావప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: వావ్‌తో కూడిన ‘ఇప్పుడు’ ముందున్న సందర్భం నుంచి వెంటనే వచ్చే ఆజ్ఞకు మార్పును సూచిస్తుంది; ‘కాబట్టి ఇప్పుడు’ ఆ అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: చంపండి
  rationale: హרג్ క్రియ యొక్క బహువచన ఆజ్ఞారూపం నేరుగా, తీవ్రంగా ఉంది. ‘చంపండి’ దాని బలాన్ని తగ్గించకుండా స్పష్టంగా అందిస్తుంది.
- source_word: כָל זָכָר בַּטָּף
  choice: చిన్నపిల్లల్లో ప్రతి మగపిల్లవాణ్ణీ
  rationale: זָכָר అంటే ‘మగ’ అని, טַף అంటే చిన్నపిల్లలు లేదా చిన్నవారైన ఆధారితులు అని సూచిస్తుంది. సందర్భంలో ‘చిన్నపిల్లల్లో ప్రతి మగపిల్లవాణ్ణీ’ రెండు భావాంశాలనూ సహజంగా నిలుపుతుంది.
- source_word: כָל אִשָּׁה
  choice: ప్రతి స్త్రీనీ
  rationale: אִשָּׁה ఇక్కడ భార్యను ప్రత్యేకంగా కాక స్త్రీని సాధారణంగా సూచిస్తుంది; అందువల్ల ‘ప్రతి స్త్రీనీ’ సరైనది.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: పురుషునితో శయనించడం ద్వారా అతణ్ణి ఎరిగిన
  rationale: ‘ఎరుగుట’ అనే హెబ్రీయ భావప్రయోగాన్ని నిలుపుతూ, వెంట వచ్చే ‘పురుషునితో శయనించడం’ దాని లైంగిక అర్థాన్ని స్పష్టం చేస్తుంది. ఈ రూపం మూలంలోని అసాధారణ నిర్మాణాన్ని పూర్తిగా చదును చేయకుండా తెలుగులో అర్థమయ్యేలా చేస్తుంది.
theological_decisions:
- issue: నైతికంగా క్లిష్టమైన యుద్ధ ఆజ్ఞ తీవ్రతను అనువాదంలో ఎలా అందించాలి
  choice: ఆజ్ఞను నేరుగా, దాని తీవ్రతను తగ్గించకుండా అనువదించడం
  alternative: ‘మరణశిక్ష విధించండి’ వంటి మృదువైన లేదా న్యాయపరమైన పదజాలం వాడడం, లేక ప్రధాన వాక్యంలో చారిత్రక వివరణను చేర్చడం
  rationale: మూలపాఠం ప్రత్యక్షంగా ‘చంపండి’ అని ఆజ్ఞాపిస్తుంది. అనువాదం దానిని సమర్థించకూడదు, మృదుపరచకూడదు, లేదా అదనపు నైతిక వ్యాఖ్యానంతో విస్తరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని ప్రత్యక్ష ఆజ్ఞను ‘చంపండి’తో నిలిపి, లైంగిక భావప్రయోగాన్ని ప్రధాన వాక్యంలో కొంత రూపసామ్యంతో ఉంచి పాదటీపులో వివరించాం.
