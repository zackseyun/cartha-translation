source:
  edition: WLC
  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: te
  text: “యుద్ధంలో పట్టుబడిన వాటి సంఖ్యను—మనుషులది, పశువులది—నీవు, యాజకుడైన ఎలియాజరు, సమాజపు పితృకుటుంబాల నాయకులు లెక్క తీసుకోండి.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యుద్ధంలో పట్టుబడిన వాటి” అని అనువదించిన హీబ్రూ పదబంధాన్ని “చెరలోకి తీసుకున్నవారు” లేదా “చెరపట్టిన దోపిడిసొమ్ము” అని కూడా అర్థం చేసుకోవచ్చు. ఇది యుద్ధంలో స్వాధీనం చేసుకున్నదాన్ని సూచిస్తుంది; ఇక్కడ మనుషులు, పశువులు రెండూ అందులో ఉన్నాయని తరువాతి మాటలు స్పష్టం చేస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: మొత్తాన్ని ... లెక్కించండి
  rationale: అక్షరార్థంగా ‘తలను ఎత్తు’ అయిన ఈ హీబ్రూ నుడికారం ఇక్కడ మొత్తం లెక్క తీయడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: చెరపట్టిన కొల్లసొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్నదంతటినీ సూచిస్తుంది; వెంటనే మనుషులు, పశువులు అని వివరించబడుతున్నందున ‘కొల్లసొమ్ము’ను వస్తువులకు మాత్రమే పరిమితం చేయకుండా ‘చెరపట్టిన’ అనే విశేషణంతో మూలంలోని విస్తృతిని నిలిపింది.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: మనుషులను, పశువులను
  rationale: אָדָם ఇక్కడ జంతువులకు భిన్నంగా మానవులను సమష్టిగా సూచిస్తుంది; בְּהֵמָה ఈ సందర్భంలో ప్రధానంగా పెంపుడు పశువులను సూచిస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: మోషే స్వయంగా లెక్కింపులో పాల్గొనాలని మూలంలోని స్పష్టమైన, ఉద్ఘాటనాత్మక సర్వనామాన్ని నిలిపింది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఇచ్చి, పదవిని సహజమైన తెలుగు నిర్మాణంలో అనువదించింది.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: సమాజంలోని పూర్వీకుల కుటుంబాల నాయకులు
  rationale: ఇశ్రాయేలు సమాజంలోని వంశపారంపర్య కుటుంబ విభాగాల నాయకులను సూచించే సామాజిక నిర్మాణాన్ని స్పష్టంగా, ఆధునిక పాఠకులకు అర్థమయ్యేలా అందించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. యుద్ధసందర్భంలోని అసౌకర్యకరమైన మానవ-స్వాధీన భావాన్ని సున్నితీకరించకుండా మూలంలోని ఉద్రిక్తతను నిలిపింది. ప్రధాన వాక్యంలో ఉన్న ఏకైక పాదసూచిక గుర్తు [a] పాదసూచికతో సరిపోతుంది.
