id: NUM.31.27
reference: Numbers 31:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: te
  text: యుద్ధసేవకు బయలుదేరిన యోధులకూ, సమాజమంతటికీ మధ్య యుద్ధంలో స్వాధీనం చేసుకొన్నవాటిని[a] పంచు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధ దోపుడు.” ఈ హెబ్రీ పదం యుద్ధంలో పట్టుకొన్న మనుషులు, పశువులు, ఇతర సంపదను కలిపి సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: పంచు
  rationale: חצה అనే క్రియకు ‘విభజించు/రెండు వర్గాల మధ్య పంచు’ అనే అర్థం ఉంది. మోషేకు ఇవ్వబడిన ప్రత్యక్ష ఆజ్ఞగా ఆధునిక తెలుగులో ‘పంచు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַמַּלְקוֹחַ
  choice: యుద్ధంలో పట్టుకొన్నవాటిని
  rationale: מַלְקוֹחַ యుద్ధంలో పట్టుకొన్న మనుషులు, పశువులు, ఇతర సంపద అన్నిటినీ సూచించగల విస్తృత పదం. సందర్భంలో మనుషులు, పశువులు రెండూ లెక్కించబడుతున్నందున ‘దోపుడు సొమ్ము’ కంటే ఈ అనువాదం విస్తృతిని మెరుగుగా నిలుపుతుంది.
- source_word: בֵּין ... וּבֵין
  choice: '...కీ, ...కీ మధ్య'
  rationale: ఇది పట్టుకొన్నవాటిని రెండు వర్గాల మధ్య విభజించాలని సూచించే జత నిర్మాణం. తెలుగులో ‘రెండు వర్గాలకీ మధ్య’ అనే నిర్మాణం ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: యుద్ధంలో పాల్గొన్నవారు
  rationale: పదశః ‘యుద్ధాన్ని చేపట్టిన/నిర్వహించినవారు’ అనే హెబ్రీ నుడికారానికి ఇది సహజమైన తెలుగు రూపం; వీరు యుద్ధంలో ప్రత్యక్షంగా పోరాడినవారని సందర్భం తెలియజేస్తుంది.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: సైన్యంగా బయలుదేరి
  rationale: ఈ భాగం ముందున్న యుద్ధంలో పాల్గొన్నవారిని మరింత నిర్దిష్టంగా గుర్తిస్తుంది. צבא ఇక్కడ సైనిక దండయాత్ర లేదా యుద్ధసేవను సూచిస్తుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతటికి
  rationale: עֵדָה ఇశ్రాయేలు ప్రజల సమష్టి సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతటికి’ ఆధునిక పాఠకులకు సహజంగా ఉండి, మొత్తం సమూహం అనే భావాన్ని నిలుపుతుంది.
