revisions:
- from: సైన్యంగా బయలుదేరి యుద్ధంలో పాల్గొన్నవారికీ, సమాజమంతటికీ మధ్య యుద్ధంలో పట్టుకొన్నవాటిని[a] పంచు.
  to: యుద్ధసేవకు బయలుదేరిన యోధులకూ, సమాజమంతటికీ మధ్య యుద్ధంలో స్వాధీనం చేసుకొన్నవాటిని[a] పంచు.
  rationale: The revision replaces the awkward “సైన్యంగా బయలుదేరి” with an idiomatic phrase denoting those who went out for military service. It retains the command, the division between the combatants and the whole community, and the broad scope of the collective term for what was taken in war. The footnote continues to clarify that the term is not limited to inanimate goods.
