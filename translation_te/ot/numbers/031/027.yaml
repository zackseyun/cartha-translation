  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రత్యక్ష ఆజ్ఞారూపాన్ని ఉపయోగించాం. మూలంలోని రెండు గ్రహీత వర్గాలను స్పష్టంగా ఉంచుతూ, యుద్ధంలో పట్టుకొన్న మనుషులు మరియు వస్తువులు రెండింటినీ చేర్చగల విస్తృత పదబంధాన్ని ఎంచుకున్నాం.
