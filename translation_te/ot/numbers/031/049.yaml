  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה עֲבָדֶ֣י/ךָ נָֽשְׂא֗וּ אֶת רֹ֛אשׁ אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר בְּ/יָדֵ֑/נוּ וְ/לֹא נִפְקַ֥ד מִמֶּ֖/נּוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: te
  text: 'వారు మోషేతో ఇలా అన్నారు: “నీ సేవకులమైన మేము మా ఆధీనంలో ఉన్న యుద్ధసైనికులను లెక్కించాము[a]; మాలో ఒక్క మనిషీ కూడా తప్పిపోలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యుద్ధసైనికుల తలను ఎత్తాము.’ ఇది వారిని లెక్కించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులమైన మేము
  rationale: సైనిక అధికారులు మోషేతో వినయంగా మాట్లాడుతున్న సందర్భంలో ‘సేవకులు’ సహజమైన గౌరవసూచక ప్రయోగం; బానిసత్వ భావం ఇక్కడ ప్రధానంగా లేదు.
- source_word: נָשְׂאוּ אֶת רֹאשׁ
  choice: లెక్కించాము
  rationale: అక్షరార్థంగా ‘తలను ఎత్తారు’ అనే ఈ హీబ్రూ నుడికారం జనులను లెక్కించడం లేదా గణన చేయడం అనే అర్థంలో వాడబడింది.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధవీరులను
  rationale: ఈ పదబంధం యుద్ధంలో పాల్గొన్న పురుషులను సూచిస్తుంది; ‘యుద్ధవీరులు’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఆ సైనిక భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: మా ఆధీనంలో ఉన్న
  rationale: అక్షరార్థంగా ‘మా చేతిలో ఉన్న’ అనే ప్రయోగం ఇక్కడ సైనిక బాధ్యత లేదా అధికారాన్ని సూచిస్తుంది; ‘మా ఆధీనంలో’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: మాలో ఒక్కరు కూడా తప్పిపోలేదు
  rationale: నిఫాల్ రూపంలోని פקד ఇక్కడ గణనలో కనబడకపోవడం, కనిపించకుండా పోవడం లేదా నష్టపోవడం అనే భావాన్ని కలిగి ఉంది; ‘తప్పిపోలేదు’ ఆ మూలంలోని కొంత విస్తృతిని నిలుపుతుంది.
