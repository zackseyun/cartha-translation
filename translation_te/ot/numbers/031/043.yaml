  text: וַ/תְּהִ֛י מֶחֱצַ֥ת הָ/עֵדָ֖ה מִן הַ/צֹּ֑אן שְׁלֹשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹשִׁ֣ים אֶ֔לֶף שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: te
  text: మందలో సమాజానికి చెందిన సగభాగం 3,37,500గా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: ఉన్నాయి
  rationale: ఈ సంఖ్యాపట్టిక సందర్భంలో היה రూపం ఫలితంగా వచ్చిన మొత్తాన్ని తెలియజేస్తుంది; తెలుగులో వాక్య నిర్మాణానికి అనుగుణంగా అస్తిత్వార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: מֶחֱצַת הָעֵדָה
  choice: సమాజానికి చెందిన సగభాగంలో
  rationale: నిర్మాణ రూపంలోని מֶחֱצַת తరువాతి నిర్దిష్ట నామవాచకంతో కలిసి సమాజానికి కేటాయించిన రెండు భాగాల్లో ఒకదాన్ని సూచిస్తుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: עֵדָה ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సమాజం’ సహజంగా ఉండి, తరువాతి కాలపు ప్రత్యేక మతసంస్థ భావాన్ని అనవసరంగా మోపదు.
- source_word: מִן הַצֹּאן
  choice: మందకు చెందినవి
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహానికి వాడే సమష్టి పదం. ‘మంద’ మూలంలోని సమష్టి భావాన్ని సంక్షిప్తంగా కాపాడుతుంది; מן ఇక్కడ లెక్కించబడిన వర్గాన్ని సూచిస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,37,500
  rationale: హీబ్రూ సంఖ్యాక్రమం 3,00,000 + 30,000 + 7,000 + 500. భారతీయ అంకెల విభజనతో ఖచ్చితమైన మొత్తాన్ని సులభంగా చదవగలిగేలా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఖ్యాపట్టికకు తగిన సంక్షిప్తమైన గంభీర శైలి. ‘సమాజం’ మరియు ‘మంద’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలు.
