  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: te
  text: ప్రతి వస్త్రాన్నీ, తోలుతో చేసిన ప్రతి వస్తువునూ, మేక వెంట్రుకలతో చేసిన ప్రతి వస్తువునూ, చెక్కతో చేసిన ప్రతి వస్తువునూ మీరు శుద్ధి చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హిబ్రూ క్రియారూపాన్ని అక్షరార్థంగా ‘మీరు మిమ్మల్ని శుద్ధి చేసుకోవాలి’ అని కూడా అర్థం చేసుకోవచ్చు. ఇక్కడ సందర్భం ఆచారపరమైన శుద్ధీకరణకు సంబంధించినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: ఈ పదం సాధారణంగా దుస్తు లేదా వస్త్రాన్ని సూచిస్తుంది. జాబితా శైలికి సహజంగా, గౌరవప్రదంగా ఉండేలా ‘వస్త్రం’ ఎంచుకున్నాం.
- source_word: כְּלִי עוֹר
  choice: తోలుతో చేసిన వస్తువు
  rationale: כְּלִי అనేది పాత్రకే పరిమితం కాకుండా పరికరం లేదా వస్తువు అనే విస్తృత అర్థం కలిగి ఉంది; עוֹר ఇక్కడ చర్మం/తోలు అనే పదార్థాన్ని సూచిస్తుంది.
- source_word: מַעֲשֵׂה עִזִּים
  choice: మేక వెంట్రుకలతో చేసినది
  rationale: మేకలకు సంబంధించిన పదార్థంతో చేసిన వస్తువు అనే భావం ఉంది. పదార్థాల జాబితా సందర్భంలో మేకచర్మం కంటే మేక వెంట్రుకలతో నేసిన వస్తువు అనే అర్థమే ఎక్కువ సంభావ్యం.
- source_word: כְּלִי עֵץ
  choice: చెక్కతో చేసిన వస్తువు
  rationale: כְּלִי యొక్క విస్తృత భావాన్ని నిలుపుతూ, అది చెక్కతో చేసిన ఏ వస్తువైనా కావచ్చని తెలియజేస్తుంది.
- source_word: תִּתְחַטָּאוּ
  choice: మీరు శుద్ధి చేయాలి
  rationale: యుద్ధానంతర ఆచారపరమైన అపవిత్రత తొలగింపును ‘శుద్ధి’ స్పష్టంగా తెలియజేస్తుంది. వాక్యంలో ముందున్న వస్తువుల జాబితాను క్రియకు కర్మగా తీసుకోవడం సందర్భానికి సరిపోతుంది; అయితే హిబ్రూ రూపంలోని ప్రతిఫలార్థ సంభావ్యతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యుద్ధానంతర ఆచారపరమైన శుద్ధీకరణలో תִּתְחַטָּאוּ అర్థం
  choice: ముందు పేర్కొన్న వస్తువులను ‘శుద్ధి చేయాలి’ అని అనువదించడం
  alternative: ‘మీరు మిమ్మల్ని శుద్ధి చేసుకోవాలి’ లేదా ‘మీరు శుద్ధి పొందాలి’
  rationale: హిబ్రూ క్రియ రెండవ పురుష బహువచన రూపంలో ఉండి ప్రతిఫలార్థాన్ని సూచించగలదు. అయినా, వెంటనే ముందున్న వస్తువుల జాబితా మరియు సమీప సందర్భం వాటి ఆచారపరమైన శుద్ధీకరణను సూచిస్తున్నాయి. అందుచేత ప్రధాన పాఠంలో వస్తువులను కర్మగా తీసుకుని, రూపసంబంధమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం; దీనిని నైతిక పరివర్తనగా లేదా ప్రాయశ్చిత్త సిద్ధాంతంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన జాబితా నిర్మాణాన్ని వాడాం. ‘వస్తువు’ అనే విస్తృత పదం పాత్రలు మాత్రమే అన్న పరిమితిని నివారిస్తుంది; ‘శుద్ధి’ ఆచారపరమైన భావాన్ని నిలుపుతుంది.
