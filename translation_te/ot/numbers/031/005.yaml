source:
  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు వెయ్యి-సమూహాల నుండి, ప్రతి గోత్రం నుండి వెయ్యిమంది చొప్పున, యుద్ధానికి ఆయుధసన్నద్ధులైన పన్నెండువేలమంది సమకూర్చబడ్డారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలు వెయ్యి-సమూహాలు” అనేది సంఖ్యను మాత్రమే కాకుండా, ఇశ్రాయేలు యొక్క పెద్ద వంశ లేదా సైనిక విభాగాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అప్పగించబడ్డారు” లేదా “నియమించబడ్డారు”; హీబ్రూ క్రియ సేవ కోసం మనుషులు అందించబడటం లేదా సమకూర్చబడటాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: నియమించబడ్డారు
  rationale: నిఫాల్ రూపం ఇశ్రాయేలీయులలోనుండి ఈ యుద్ధసేవ కోసం మనుషులు అప్పగించబడటం లేదా సమకూర్చబడటాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నియమించబడ్డారు’ ఈ నిష్క్రియార్థాన్ని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచనలో ఉంచాం.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వేలమందిలోనుండి
  rationale: אַלְפֵי అనే పదానికి అక్షరార్థంగా ‘వేలమంది’ అని అర్థం; గోత్ర లేదా సైనిక సందర్భంలో అది పెద్ద వంశ/సైనిక విభాగాలను కూడా సూచించవచ్చు. మూలంలోని సందిగ్ధతను నిలుపుతూ అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: אֶלֶף לַמַּטֶּה
  choice: ప్రతి గోత్రానికి వెయ్యిమంది చొప్పున
  rationale: 'ఇక్కడ לַמַּטֶּה పంపిణీ భావంలో ఉంది: ఒక్కో గోత్రానికి వెయ్యిమంది చొప్పున. ‘ప్రతి...చొప్పున’ అనే నిర్మాణం తెలుగులో స్పష్టంగా, సహజంగా ఉంది.'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: మొత్తం పన్నెండువేలమంది
  rationale: పన్నెండు గోత్రాల నుండి సమకూరిన సైనికుల మొత్తం సంఖ్యను సహజమైన తెలుగు పదక్రమంలో తెలిపింది.
- source_word: חֲלוּצֵי צָבָא
  choice: యుద్ధానికి ఆయుధాలు ధరించినవారు
  rationale: חֲלוּצֵי అనేది యుద్ధానికి ఆయుధసన్నద్ధులై బయలుదేరే లేదా మోహరించిన వారిని సూచిస్తుంది. ‘ఆయుధాలు ధరించినవారు’ మూలంలోని సైనిక సిద్ధతను స్పష్టంగా తెలియజేస్తుంది.
