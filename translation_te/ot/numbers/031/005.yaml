revisions:
- from: కాబట్టి ఇశ్రాయేలు వేలమంది[a]లోనుండి ప్రతి గోత్రానికి వెయ్యిమంది చొప్పున నియమించబడ్డారు[b]—యుద్ధానికి ఆయుధాలు ధరించినవారు మొత్తం పన్నెండువేలమంది.
  to: అప్పుడు ఇశ్రాయేలు వెయ్యి-సమూహాల నుండి, ప్రతి గోత్రం నుండి వెయ్యిమంది చొప్పున, యుద్ధానికి ఆయుధసన్నద్ధులైన పన్నెండువేలమంది సమకూర్చబడ్డారు.[a][b]
  rationale: The revision clarifies that each tribe contributed a thousand, improves the Telugu syntax for the Hebrew ‘thousands of Israel,’ and retains the lexical alternatives for both the organizational term and the passive verb. The final clause remains linked to the twelve thousand as those equipped for war.
