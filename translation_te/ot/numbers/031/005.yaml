translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని నిష్క్రియ నిర్మాణాన్ని, ‘వేలమంది’ అనే పదంలోని సంఖ్య/సంస్థాగత సందిగ్ధతను పాదసూచనలతో నిలిపాం. ప్రధాన పాఠ్యంలో అన్ని పాదసూచన గుర్తులు ఉన్నాయి.
