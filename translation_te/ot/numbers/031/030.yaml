revisions:
- from: ఇశ్రాయేలీయులకు చెందిన సగభాగం నుండి మనుషుల్లో, పశువుల్లో, గాడిదల్లో, మందలో—అంటే పశుసంపద అంతటిలో—ప్రతి యాభైలో ఒకటి చొప్పున తీసుకోవాలి[a]. వాటిని యాహ్వే నివాస గుడారపు బాధ్యతను నిర్వర్తించే లేవీయులకు ఇవ్వాలి.[b]
  to: ఇశ్రాయేలీయుల సగభాగం నుండి నీవు మనుషులలో నుండి, పశువులలో నుండి, గాడిదలలో నుండి, మందలో నుండి[b], అంటే అన్ని పశువులలో నుండి, ప్రతి యాభైలో నుండి ఒకటి తీసుకోవాలి[a]. వాటిని యాహ్వే నివాస గుడారానికి కాపలా బాధ్యతను నిర్వర్తించే లేవీయులకు ఇవ్వాలి.
  rationale: The revision retains the source’s 1:50 instruction and collective categories, while making the final “all livestock” phrase a separate comprehensive element rather than an explanation of the flock. It also moves the flock footnote to its proper lexical anchor and restores the guarding aspect of the Levites’ assigned duty.
