  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలీయుల సగభాగం నుండి నీవు మనుషులలో నుండి, పశువులలో నుండి, గాడిదలలో నుండి, మందలో నుండి[b], అంటే అన్ని పశువులలో నుండి, ప్రతి యాభైలో నుండి ఒకటి తీసుకోవాలి[a]. వాటిని యాహ్వే నివాస గుడారానికి కాపలా బాధ్యతను నిర్వర్తించే లేవీయులకు ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదబంధాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “యాభైలో తీసుకోబడిన ఒకటి.”
    reason: lexical_alternative
  - marker: b
    text: “మంద” అనే సమూహపదంలో గొర్రెలు, మేకలు రెండూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు చెందిన సగభాగం నుండి
  rationale: మַחֲצִית అనే పదంలోని ‘సగం/సగభాగం’ భావాన్ని నిలుపుతూ, బְּנֵי יִשְׂרָאֵל‌ను ఆధునిక తెలుగులో సహజమైన సమూహనామమైన ‘ఇశ్రాయేలీయులు’గా అనువదించింది.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: ప్రతి యాభైలో ఒకటి చొప్పున
  rationale: ఇది 1:50 వంతు సుంకాన్ని సూచిస్తుంది. మనుషులు, జంతువులు రెండింటికీ వర్తించేలా ‘ఒకటి’ను సమూహార్థకంగా వాడి, తెలుగులో స్పష్టమైన నిష్పత్తి రూపాన్ని ఎంచుకుంది; אָחֻז లోని ‘తీసుకోబడినది’ అనే రూపసూక్ష్మతను పాదటిప్పణిలో తెలిపింది.
- source_word: מִן הָאָדָם
  choice: మనుషుల్లో
  rationale: אָדָם ఇక్కడ యుద్ధసంపాదనలోని మానవ వర్గాన్ని సూచించే ఏకవచన సమూహపదం. తెలుగులో ‘మనుషుల్లో’ అనడం సహజంగా ఆ సమూహార్థాన్ని తెలియజేస్తుంది.
- source_word: מִן הַבָּקָר
  choice: పశువుల్లో
  rationale: בָּקָר ప్రధానంగా పెద్ద పెంపుడు పశువులను, ముఖ్యంగా ఆవులు-ఎద్దుల వర్గాన్ని సూచిస్తుంది. సందర్భానికి సరిపోయే సంక్షిప్త తెలుగు పదంగా ‘పశువులు’ ఎంచుకుంది.
- source_word: מִן הַחֲמֹרִים
  choice: గాడిదల్లో
  rationale: హెబ్రీ బహువచనానికి నేరుగా, ఆధునిక తెలుగులో సహజంగా సరిపోతుంది.
- source_word: וּמִן הַצֹּאן
  choice: మందలో
  rationale: צֹאן అనేది గొర్రెలు, మేకలు రెండింటినీ కలుపుకోగల చిన్న పశువుల సమూహపదం. ఆ విస్తృతిని అతిగా నిర్దిష్టం చేయకుండా ‘మంద’గా ఉంచి పాదటిప్పణిలో వివరించింది.
- source_word: מִכָּל הַבְּהֵמָה
  choice: పశుసంపద అంతటిలో
  rationale: בְּהֵמָה ఇక్కడ మొత్తం పెంపుడు జంతువుల వర్గాన్ని సమగ్రంగా సూచిస్తుంది; ‘పశుసంపద’ జాబితా సందర్భంలో సహజమైన తెలుగు.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: బాధ్యతను నిర్వర్తించే
  rationale: ఒకే మూలానికి చెందిన హెబ్రీ పదజంట అప్పగించబడిన కాపలా/సంరక్షణ విధిని నిబద్ధంగా నిర్వహించడాన్ని సూచిస్తుంది. తెలుగులో భారంగా కాకుండా బాధ్యత భావాన్ని నిలిపింది.
- source_word: מִשְׁכַּן
  choice: నివాస గుడారం
  rationale: మూలపదంలోని ‘నివాసస్థలం’ భావాన్నీ, అరణ్యకాల పవిత్ర గుడారం అనే సందర్భాన్నీ కలిపి తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ప్రత్యేక దైవనామమే ఉన్నందున బిరుదైన ‘ప్రభువు’గా మార్చకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించింది. ‘యెహోవా’ సుపరిచితమైన ప్రత్యామ్నాయమైనా, అది తరువాతి మిశ్రమ ఉచ్చారణ సంప్రదాయాన్ని ప్రతిబింబిస్తుంది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క లింగరూపం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీ నుడికారాన్ని అక్షరార్థంగా మగవారికే పరిమితం చేసినట్లు వినిపించకుండా, ఇక్కడ ఉద్దేశించిన ప్రజాసమూహాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడింది. నిష్పత్తి మరియు జాబితా సులభంగా అర్థమయ్యేలా వాక్యాన్ని సహజంగా అమర్చింది; మూలంలోని ప్రధాన విభాగాలు, సమూహార్థాలు, దైవనామం నిలుపబడ్డాయి.
