  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: te
  text: అప్పుడు మోషే, యాజకుడైన ఎలియాజరు, సమాజపు నాయకులందరూ వారిని కలవడానికి శిబిరం వెలుపలికి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: వెలుపలికి వెళ్లారు
  rationale: יצא అనే క్రియలోని బయటికి కదలిక భావాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: ఎలియాజరు యొక్క పదవిని సహజంగా, స్పష్టంగా తెలిపే తెలుగు నిర్మాణం.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: సమాజపు నాయకులందరూ
  rationale: נְשִׂיאִים ఇక్కడ రాజులను కాక, సమాజంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; עֵדָהకు ఈ సందర్భంలో ‘సమాజం’ సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: לִקְרָאתָם
  choice: వారిని ఎదుర్కొనడానికి
  rationale: לִקְרַאת్ నిర్మాణంలోని ఉద్దేశార్థాన్ని, వారి రాకకు ఎదురుగా వెళ్లి కలుసుకోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: శిబిర పరిధికి బయట ఉన్న ప్రదేశం వైపు వెళ్లడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని వ్యక్తులు, పదవులు, కదలిక, ఉద్దేశం అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
