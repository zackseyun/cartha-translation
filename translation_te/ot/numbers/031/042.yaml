  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: te
  text: ఇశ్రాయేలీయులకు చెందిన సగభాగం నుండి—మోషే యుద్ధానికి వెళ్లిన పురుషుల నుండి దానిని వేరుచేశాడు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: సగభాగం విషయానికొస్తే
  rationale: వావ్ సంధిని సందర్భానుసారమైన కొనసాగింపుగా, מן ఉపసర్గను విభజించబడిన వాటిలో ఈ భాగాన్ని సూచించే నిర్మాణంగా వ్యక్తం చేస్తుంది; మַחֲצִיתకు ‘సగభాగం’ సహజమైన, ఖచ్చితమైన తెలుగు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు చెందిన
  rationale: ఈ సమూహపదం ఇక్కడ యుద్ధపురుషులకు భిన్నంగా సమస్త ఇశ్రాయేలు సమాజపు వాటాను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, సమగ్రంగా అర్థమవుతుంది.
- source_word: אֲשֶׁר
  choice: దాన్ని
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన అనుసంధాన వాక్యంగా మార్చి, ముందున్న ‘సగభాగం’నే స్పష్టంగా సూచిస్తుంది.
- source_word: חָצָה
  choice: వేరుచేశాడు
  rationale: దోపుడుసొమ్మును రెండు భాగాలుగా విభజించి ఒక వాటాను మరొకదాని నుండి ప్రత్యేకపరచడమే సందర్భార్థం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: מִן הָ/אֲנָשִׁים
  choice: పురుషుల భాగం నుండి
  rationale: אֲנָשִׁים యొక్క పురుష లింగ సూచనను నిలుపుతుంది; సందర్భంలో מן పోల్చబడుతున్న వారి వాటా నుండి విభజనను సూచిస్తున్నందున ‘భాగం’ను స్పష్టత కోసం పూరించింది.
- source_word: הַ/צֹּבְאִים
  choice: యుద్ధానికి వెళ్లిన
  rationale: צבא క్రియాపదపు సైనిక యాత్ర/యుద్ధసేవ భావాన్ని సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
