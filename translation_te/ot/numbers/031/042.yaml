  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
