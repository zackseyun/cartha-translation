  to: యెహోవా మోషేకు ఆజ్ఞాపించినట్లుగా, మోషే యెహోవాకు కేటాయించిన భాగమైన కప్పాన్ని[a] యాజకుడైన ఎలియాజరుకు ఇచ్చాడు.
