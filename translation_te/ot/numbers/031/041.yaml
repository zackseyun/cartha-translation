id: NUM.31.41
reference: Numbers 31:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: యెహోవా మోషేకు ఆజ్ఞాపించినట్లుగా, మోషే యెహోవాకు కేటాయించిన భాగమైన కప్పాన్ని[a] యాజకుడైన ఎలియాజరుకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విధించిన వాటా,’ ‘సుంకం’; యుద్ధంలో స్వాధీనం చేసుకున్న దానిలోనుంచి లెక్క ప్రకారం తీసిన భాగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియ యొక్క కథన భూతకాల భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: מֶכֶס
  choice: కప్పం
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న దానిలోనుంచి నిర్దేశించి తీసిన తప్పనిసరి వాటాను సూచిస్తుంది; ఆధునిక పౌర పన్ను అనే భావాన్ని రాకుండా సందర్భానికి తగిన పదం.
- source_word: תְּרוּמַת יְהוָה
  choice: యెహోవాకు ప్రతిష్ఠించిన భాగం
  rationale: పవిత్ర ఉపయోగం కోసం యెహోవాకు వేరుచేసిన వాటా లేదా అర్పణ అనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ప్రత్యేకమైన కర్మకాండను అనవసరంగా సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరుకు
  rationale: హీబ్రూ ఉపసర్గతో కూడిన వ్యక్తినామాన్ని, దానికి అనుబంధంగా ఉన్న యాజక హోదాను సహజమైన తెలుగు క్రమంలో నేరుగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్లే
  rationale: ముందుగా ఇచ్చిన దైవాజ్ఞకు సరిగ్గా అనుగుణంగా కార్యం జరిగిందనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: תְּרוּמַת יְהוָהలో సంబంధార్థం
  choice: యెహోవాకు ప్రతిష్ఠించిన భాగం
  alternative: యెహోవా అర్పణ
  rationale: ఈ భాగం యెహోవాకు కేటాయించబడిందనే సందర్భార్థాన్ని తెలియజేస్తుంది; ‘అర్పణ’ అని మాత్రమే చెప్పి నిర్దిష్ట కర్మకాండ భావాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘కప్పం—యెహోవాకు ప్రతిష్ఠించిన భాగం’ అనే సమానాధికార సంబంధాన్ని స్పష్టంగా ఉంచేందుకు వాక్య నిర్మాణాన్ని సహజంగా మార్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
