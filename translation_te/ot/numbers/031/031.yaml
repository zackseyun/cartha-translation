    text: 'హీబ్రూ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశారు
  rationale: עשה అనే క్రియ ఇక్కడ ముందుగా ఇచ్చిన ఆజ్ఞను విధేయతతో అమలు చేయడాన్ని సంక్షిప్తంగా తెలియజేస్తుంది. ఇద్దరు కర్తలకు గౌరవసూచక బహువచన రూపం సహజమైన తెలుగు.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: హీబ్రూలోని సంధానాన్ని, ఎలియాజరును గుర్తించే యాజక పదవిని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: వారు చేసినది ఆజ్ఞకు పూర్తిగా అనుగుణమని సూచించే conformity భావాన్ని ‘-ినట్లే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఆజ్ఞ చర్యకు ముందే ఇవ్వబడిందనే సందర్భక్రమం తెలుగు అసమాపక భూతరూపంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన నామరూపంలో అందిస్తుంది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూ צוה నిర్మాణంలో ప్రత్యక్ష కర్మగా ఉన్న మోషేను తెలుగు ‘ఆజ్ఞాపించు’ క్రియకు సహజంగా సంప్రదాన విభక్తితో వ్యక్తం చేయాలి.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామంగానే నిలిపాం; తెలుగు సాధారణ బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘కాబట్టి’ ముందున్న ఆజ్ఞకు ఈ చర్య ఫలితమని సూచిస్తుంది; ‘ఆజ్ఞాపించినట్లే’ మూలంలోని విధేయత/అనుగుణత భావాన్ని కాపాడుతుంది.
