source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: te
  text: ఇదిగో, ఈ స్త్రీలే బిలాము మాట ప్రకారం ఇశ్రాయేలు కుమారులను పెయోరు విషయంలో యాహ్వేకు[a] ద్రోహం చేసేలా చేశారు; అందువల్ల యాహ్వే సమాజంపై తెగులు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠంలో దేవుని నామం YHWH; ఇక్కడ దానిని ‘యాహ్వే’గా అనువదించాం.
    reason: textual_or_name_clarification
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: ఇదిగో, ఈ స్త్రీలే
  rationale: ద్విగుణితమైన ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో చూపుతుంది; స్త్రీలింగ బహువచన సూచనను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: בִּדְבַר בִּלְעָם
  choice: బిలాము మాట ప్రకారం
  rationale: దָּבָר అనే పదంలోని ‘మాట’ భావాన్ని నిలుపుతూ, బిలాము ప్రేరణ లేదా సలహా ప్రకారం జరిగినదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతుంది; ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: לִמְסָר מַעַל
  choice: ద్రోహం చేసేలా చేశారు
  rationale: מעל లోని నమ్మకభంగం లేదా ఒడంబడిక ద్రోహ భావాన్ని, מסר సూచించే కారణకర్తృత్వంతో కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל דְּבַר פְּעוֹר
  choice: పెయోరు విషయంలో
  rationale: పెయోరుకు సంబంధించిన సంఘటన లేదా వ్యవహారాన్ని అధిక వివరణ లేకుండా సూచిస్తుంది.
- source_word: וַתְּהִי הַמַּגֵּפָה בַּעֲדַת יְהוָה
  choice: అందువల్ల యెహోవా సమాజంలో తెగులు వచ్చింది
  rationale: తదనంతర ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తూ, עֵדָה ను ‘సమాజం’, מַגֵּפָה ను ‘తెగులు’గా అనువదిస్తుంది.
theological_decisions:
- issue: יהוה అనే దేవుని నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన దైవనామ రూపాన్ని ఉపయోగిస్తూ, మూలంలో ఉన్న స్వనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది.
- issue: מעל యొక్క ఒడంబడిక సంబంధమైన భావం
  choice: ద్రోహం చేయడం
  alternative: విశ్వాసఘాతం చేయడం
  rationale: దేవునిపట్ల నమ్మకభంగం అనే బలమైన భావాన్ని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ఉద్ఘాటన, కారణ సంబంధం, ఒడంబడిక ద్రోహ భావం నిలుపబడ్డాయి.
