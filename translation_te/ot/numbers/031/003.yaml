source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: te
  text: 'మోషే ప్రజలతో ఇలా అన్నాడు: “మీలోనుండి పురుషులను యుద్ధానికి ఆయుధసన్నద్ధులను చేయండి. యెహోవా ప్రతీకారాన్ని[a] మిద్యానుపై అమలు చేయడానికి వారు మిద్యానుకు విరోధంగా వెళ్లాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెహోవా పక్షంగా చేసే ప్రతీకారం.” హీబ్రూ పదబంధం యెహోవాకు చెందిన ప్రతీకారాన్ని గానీ, ఆయన పక్షంగా అమలు చేసే ప్రతీకారాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన రూపం; ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ మోషే సంబోధిస్తున్న ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది.
- source_word: הֵחָלְצוּ
  choice: ఆయుధాలతో సిద్ధం చేయండి
  rationale: సైనిక సందర్భంలో యుద్ధానికి ఆయుధాలు ధరించి సిద్ధపడే భావాన్ని తెలియజేస్తుంది; కేవలం సాధారణ ‘సిద్ధం చేయండి’ కంటే సందర్భార్థం స్పష్టంగా ఉంటుంది.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: మీలో కొందరు పురుషులను
  rationale: ప్రజలలోనుంచి పురుషులను ఎంపిక చేయాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘కొందరు’ మూలంలోని ఎంపిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לַצָּבָא
  choice: యుద్ధానికి
  rationale: צָבָא ఇక్కడ సైనిక దండయాత్ర లేదా యుద్ధసేవను సూచిస్తుంది; తెలుగులో ‘యుద్ధానికి’ సహజమైన సందర్భోచిత రూపం.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: వారు మిద్యానుకు విరోధంగా వెళ్లాలి
  rationale: హీబ్రూ ప్రయోగం శత్రుత్వంతో మిద్యానుకు ఎదురు నిలిచి దండెత్తే భావాన్ని ఇస్తుంది; ‘వెళ్లాలి’ సందర్భంలో అంతర్లీనమైన సైనిక కదలికను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לָתֵת נִקְמַת
  choice: ప్రతీకారాన్ని అమలు చేయడానికి
  rationale: అక్షరార్థమైన ‘ప్రతీకారం ఇవ్వడం’ తెలుగులో అసహజం; ఈ పదబంధం ప్రతీకార తీర్పును కార్యరూపంలో నెరవేర్చడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా ప్రతిబింబిస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: בְּמִדְיָן
  choice: మిద్యానుపై
  rationale: ప్రతీకారం ఎవరిమీద అమలవుతుందో తెలిపే లక్ష్యార్థక ప్రయోగం.
theological_decisions:
- issue: పవిత్ర యుద్ధ సందర్భంలో נִקְמַת יְהוָה యొక్క సంబంధార్థం
  choice: యెహోవా ప్రతీకారం
  alternative: యెహోవా పక్షంగా చేసే ప్రతీకారం
  rationale: హీబ్రూ నిర్మాణం యెహోవాకు చెందిన ప్రతీకారం లేదా ఆయన పక్షంగా అమలు చేసే ప్రతీకారం అనే రెండు సంబంధ ఛాయలను అనుమతిస్తుంది. ప్రధాన పాఠం సంక్షిప్త నిర్మాణాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో సహజమైన వాక్యనిర్మాణం, ఆజ్ఞలో గంభీరమైన సైనిక భాష ఉపయోగించబడింది. మూలంలోని కఠినమైన ‘ప్రతీకారం’ భావాన్ని మృదువుపరచలేదు; సంబంధార్థంలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
