  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా పలికాడు:'
