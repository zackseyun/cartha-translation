    text: 'హీబ్రూలో: ‘YHWH’ (יהוה); సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. ‘యెహోవా’ అనేది ప్రత్యామ్నాయ లిప్యంతరీకరణ.'
    reason: దైవనామం యెహోవా (YHWH) అని చూపించి, సంప్రదాయ అనువాదం మరియు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; అందువల్ల ‘అప్పుడు’ సహజమైన క్రమాన్ని తెలియజేస్తుంది. דבר ఇక్కడ మాటలాడడాన్ని సూచిస్తుంది; తెలుగులో ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֶל
  choice: తో
  rationale: మాటల సంబోధితుణ్ణి సూచించే אֶלను తెలుగు వాడుకలో సహజమైన ‘మోషేతో’గా వ్యక్తీకరించాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామం מֹשֶׁהకు తెలుగులో స్థిరపడిన రూపం ‘మోషే’.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’గా వ్యక్తీకరించాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచాం; ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. ‘మాట్లాడి, ఇలా అన్నాడు’ అనే పునరుక్తిని నివారించి, హీబ్రూ వాక్యసూత్రం యొక్క భావాన్ని సహజంగా అందించాం.
