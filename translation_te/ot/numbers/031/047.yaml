  to: ఇశ్రాయేలు ప్రజలకు[a] చెందిన సగభాగం నుండి మోషే మనుషులలోను పశువులలోను యాభైలో ఒకటి చొప్పున[b] తీసుకొని, వాటిని యహ్వే నివాసగుడారపు బాధ్యతను నిర్వహించే లేవీయులకు ఇచ్చాడు, యహ్వే మోషేకు ఆజ్ఞాపించినట్లే.
