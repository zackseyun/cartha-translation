id: NUM.31.47
reference: Numbers 31:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలకు[a] చెందిన సగభాగం నుండి మోషే మనుషులలోను పశువులలోను యాభైలో ఒకటి చొప్పున[b] తీసుకొని, వాటిని యహ్వే నివాసగుడారపు బాధ్యతను నిర్వహించే లేవీయులకు ఇచ్చాడు, యహ్వే మోషేకు ఆజ్ఞాపించినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అంటే ఇశ్రాయేలీయులు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతి యాభైలో నుండి తీసుకున్న ఒకటి.’
    reason: alternative_rendering
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు చెందిన సగభాగం నుండి
  rationale: מַחֲצִית అనేది పంచబడిన దోపుడు సొమ్ములో ఇశ్రాయేలీయులకు కేటాయించిన సగభాగాన్ని సూచిస్తుంది. బְּנֵי יִשְׂרָאֵל అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’గా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: యాభైకి ఒకటి చొప్పున
  rationale: ఈ సందర్భంలో אָחֻז తీసుకున్న వాటా లేదా విధించిన భాగాన్ని సూచిస్తుంది; మొత్తం నుండి ప్రతి యాభైలో ఒకదాన్ని తీసుకోవాలనే నిష్పత్తిని ఈ తెలుగు ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: మనుషుల్లోను పశువుల్లోను
  rationale: אָדָם ఇక్కడ ఒక పురుషుణ్ణి కాక సమూహంగా మనుషులను సూచిస్తుంది; בְּהֵמָה ఈ సందర్భంలో పెంపుడు పశువులను సూచిస్తుంది.
- source_word: וַיִּתֵּן אֹתָם
  choice: వాటిని ... ఇచ్చాడు
  rationale: హీబ్రూలోని బహువచన సర్వనామం తీసుకున్న సమస్త వాటాను—మనుషులను, పశువులను—కలిపి సూచిస్తుంది. తెలుగులో మిశ్రమ సమూహాన్ని సంక్షిప్తంగా తిరిగి సూచించేందుకు ‘వాటిని’ వాడబడింది.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: యహ్వే నివాస గుడారం బాధ్యతను చూసుకునే
  rationale: శׁמר అనే ధాతువు మరియు దానికి సంబంధించిన నామవాచకం కాపాడటం, అప్పగించిన బాధ్యతను నిర్వహించడం అనే భావాలను కలిగిస్తాయి. ‘బాధ్యతను చూసుకునే’ అనేది సహజమైన తెలుగులో ఆ సేవా-పర్యవేక్షణ భావాన్ని నిలుపుతుంది; מִשְׁכָּן‌కు ‘నివాస గుడారం’ మూలార్థాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా ఆధునిక తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారమే
  rationale: כַּאֲשֶׁר ఇంతకుముందు ఇచ్చిన ఆజ్ఞకు అనుగుణంగా మోషే చేసినట్లు తెలియజేస్తుంది; ‘ప్రకారమే’ ఆ ఖచ్చిత అనుగుణతను తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఉంచడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహపదం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో మొత్తం ఇశ్రాయేలు సమాజానికి కేటాయించిన వాటా ఉద్దేశించబడింది. ప్రధాన పాఠంలో సహజమైన సమూహార్థాన్ని ఇచ్చి, రూపపరమైన అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలిలో అనువదించబడింది. ‘నివాస గుడారం’ ద్వారా מִשְׁכָּן యొక్క గుడారం మరియు దేవుని నివాసస్థలం అనే రెండు భావాలూ సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
