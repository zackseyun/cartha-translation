id: NUM.31.19
reference: Numbers 31:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: te
  text: మీరు ఏడు రోజులపాటు శిబిరం వెలుపల మకాం వేయండి. ఒక వ్యక్తిని చంపిన ప్రతి ఒక్కరూ, చంపబడిన వ్యక్తిని తాకిన ప్రతి ఒక్కరూ[a], మూడవ రోజున, ఏడవ రోజున తమను తాము శుద్ధి చేసుకోవాలి—మీరూ మీ బందీలూ అలా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపబడిన వ్యక్తి మృతదేహాన్ని తాకిన ప్రతి ఒక్కరూ.” హెబ్రీలో అక్షరార్థంగా “చంపబడినవానిని” అని ఉంది; ఈ సందర్భంలో అది మృతదేహాన్ని తాకడం వల్ల కలిగే ఆచార అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ
  choice: మకాం వేయాలి
  rationale: חנה అనే క్రియ యొక్క బహువచన ఆజ్ఞారూపం. సందర్భంలో శిబిరం వెలుపల ఏడు రోజులు నివసించాలనే ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: సైనిక, అరణ్య సందర్భానికి తగిన సరళమైన స్థలవాచక పదబంధం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: ఎవరైతే ఒక వ్యక్తిని చంపారో ... వారందరూ
  rationale: נֶפֶשׁ ఇక్కడ అమూర్తమైన ‘ఆత్మ’ను కాక మానవ వ్యక్తిని సూచిస్తుంది. యుద్ధం అనంతర సందర్భం వల్ల కృదంతానికి గతకాల భావం ఉంది.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: ఎవరైతే చంపబడినవారిని తాకారో
  rationale: חָלָל హింసవల్ల చనిపోయిన వ్యక్తిని సూచిస్తుంది. ఈ రూపం హెబ్రీ వ్యక్తి-సూచనను నిలుపుతూ, మృతదేహ స్పర్శ అనే సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేయడానికి వీలు కల్పిస్తుంది.
- source_word: תִּתְחַטְּאוּ
  choice: తమను తాము శుద్ధి చేసుకోవాలి
  rationale: హిత్పయేల్ రూపమైన ఈ క్రియ ఇక్కడ నైతిక పశ్చాత్తాపం కంటే ఆచార సంబంధమైన అపవిత్రత తొలగింపును సూచిస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: మూడవ రోజున, ఏడవ రోజున
  rationale: ఆచార విధిలో ముఖ్యమైన రెండు నిర్దిష్ట దినాలను యథాతథంగా నిలుపుతుంది.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: మీరూ మీ బందీలూ
  rationale: שְׁבִי యుద్ధంలో పట్టుబడినవారిని సూచిస్తుంది; ‘బందీలు’ ఈ సైనిక సందర్భంలో ఖచ్చితమైనది.
theological_decisions:
- issue: చంపడం లేదా మృతదేహాన్ని తాకడం తరువాతి శుద్ధి స్వభావం
  choice: మృతదేహ సంబంధిత ఆచార అపవిత్రత నుంచి శుద్ధి
  alternative: రక్తాపరాధం నుంచి నైతిక శుద్ధి
  rationale: మూడవ, ఏడవ రోజుల నిర్దేశంతో కలిసి תתחטאו అనే క్రియ మృతదేహ అపవిత్రతకు సంబంధించిన ఆచార శుద్ధి విధానాన్ని సూచిస్తుంది. అందువల్ల పాపక్షమాపణ గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ‘శుద్ధి చేసుకోవాలి’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞను తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘వేయాలి/చేసుకోవాలి’ రూపాలు వాడబడ్డాయి. చివరి ‘మీరూ మీ బందీలూ’ అనే హెబ్రీ దృష్టి మార్పును స్పష్టత కోసం ‘అలా చేయాలి’తో పూర్తి చేశాం; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
