  naturalness: The narrative is generally natural modern Telugu. ‘మిద్యాను యొక్క ఐదుగురు రాజులు’ is unnecessarily hybrid and less idiomatic than ‘మిద్యాను ఐదుగురు రాజులు.’
  terminology: The established transliterated names and ‘ఖడ్గంతో’ are suitable. ‘హతమార్చారు’ and ‘చంపారు’ do not create a material semantic difference here, though using ‘చంపారు’ consistently is more natural in modern standard Telugu.
