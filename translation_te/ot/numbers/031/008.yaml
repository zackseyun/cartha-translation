id: NUM.31.8
reference: Numbers 31:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: te
  text: 'వారు మిద్యాను రాజులను చంపబడిన మిగతావారితోపాటు[a] చంపారు: ఎవీ, రేకెము, సూరు, హూరు, రెబా—వీరు మిద్యాను ఐదుగురు రాజులు. బెయోరు కుమారుడైన బిలామును కూడా వారు ఖడ్గంతో చంపారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపబడినవారి మధ్య.” హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది; ఈ రాజులు మిద్యానీయులలో చంపబడిన మిగతావారి మధ్య హతమయ్యారని కూడా ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: హతమార్చారు / చంపారు
  rationale: హרג్ క్రియ ఇక్కడ నేరుగా ‘చంపడం’ను సూచిస్తుంది. మొదటి సందర్భంలో జాబితాతో కూడిన గంభీర వాక్యశైలికి ‘హతమార్చారు’, రెండో సందర్భంలో సహజమైన ఆధునిక తెలుగుకు ‘చంపారు’ వాడాం; అర్థభేదం ఉద్దేశించలేదు.
- source_word: עַל חַלְלֵיהֶם
  choice: చంపబడిన మిగతావారితోపాటు
  rationale: అక్షరార్థంగా ‘వారి హతులపై/మధ్య’ అనే సంక్షిప్త హెబ్రీ పదబంధం. రాజులు ఇతర మృతులతోపాటు లేదా వారి మధ్య చంపబడ్డారనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; స్థానార్థపు అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: מַלְכֵי מִדְיָן
  choice: మిద్యాను రాజులు
  rationale: సంబంధార్థక construct chain‌ను సహజమైన తెలుగు సమాసరూపంలో అనువదించాం.
- source_word: אֱוִי וְאֶת־רֶקֶם וְאֶת־צוּר וְאֶת־חוּר וְאֶת־רֶבַע
  choice: ఎవీ, రేకెము, సూరు, హూరు, రెబ
  rationale: వ్యక్తినామాలను అనువదించకుండా, హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: మిద్యాను యొక్క ఐదుగురు రాజులు
  rationale: ముందు పేర్కొన్న ఐదుగురిని వివరిస్తున్న appositional సారాంశాన్ని స్పష్టంగా నిలిపాం.
- source_word: בִּלְעָם בֶּן־בְּעוֹר
  choice: బెయోరు కుమారుడైన బిలాము
  rationale: వ్యక్తినామం మరియు పితృనామ సంబంధాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: בֶּחָרֶב
  choice: ఖడ్గంతో
  rationale: בְּ ఇక్కడ సాధనార్థకం; చంపడానికి ఉపయోగించిన ఆయుధాన్ని నిర్దిష్టంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని పాటించాం. హెబ్రీ వాక్యంలోని జాబితా, ఐదుగురు రాజులని తెలిపే వివరణ, ఖడ్గం అనే నిర్దిష్ట సాధనం అన్నీ నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
