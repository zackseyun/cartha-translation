id: NUM.31.28
reference: Numbers 31:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: te
  text: 'యుద్ధానికి బయలుదేరిన యోధుల నుండి యాహ్వేకు చెల్లించవలసిన భాగాన్ని నీవు ప్రత్యేకించాలి: మనుషులలో నుండి, పెద్ద పశువులలో నుండి, గాడిదలలో నుండి, గొర్రెలు మేకల మందలలో నుండి ప్రతి ఐదువందలలో ఒకటి చొప్పున[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, “ఐదువందల ప్రాణాల్లో ఒక ప్రాణం.” ఇక్కడ ‘ప్రాణం’ అనే పదం మనిషికైనా జంతువుకైనా ఒక్కొక్క సజీవ వ్యక్తిని లేదా జంతువును లెక్కించడానికి వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ
  choice: ప్రత్యేకించాలి
  rationale: רום అనే క్రియ హిఫీల్ రూపంలో ఇక్కడ మొత్తం నుంచి నిర్ణీత భాగాన్ని తీసి సమర్పణ కోసం వేరుచేయడాన్ని సూచిస్తుంది.
- source_word: מֶכֶס
  choice: చెల్లించవలసిన వంతు
  rationale: ఈ నామవాచకం యుద్ధంలో సంపాదించిన వాటి నుంచి విధిగా ఇవ్వవలసిన నిర్ణీత భాగాన్ని సూచిస్తుంది. ‘పన్ను’ కంటే ఈ సందర్భంలో ‘చెల్లించవలసిన వంతు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ పాఠంలోని దేవుని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: యుద్ధానికి వెళ్లిన యోధుల దగ్గర నుంచి
  rationale: సైనిక కార్యంలో ప్రత్యక్షంగా పాల్గొన్న యుద్ధ మనుషులనే ఈ పదబంధం సూచిస్తుంది; ఆధునిక తెలుగులో ‘యోధులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: ప్రతి ఐదువందల జీవుల్లో ఒక జీవిని
  rationale: נפש ఇక్కడ మనుషులకు, జంతువులకు రెండింటికీ వర్తించే లెక్కింపు పదం. ‘జీవి’ దాని విస్తృత ప్రాణార్థాన్ని నిలుపుతూ, ‘ఆత్మ’ వల్ల కలిగే అనవసరమైన తాత్త్విక భావాన్ని నివారిస్తుంది.
- source_word: מִן הָאָדָם
  choice: మనుషుల్లో నుంచి
  rationale: తరువాత పేర్కొన్న జంతువులకు భిన్నంగా, దోపుడుసొత్తులోని మానవ భాగాన్ని אָדָם ఇక్కడ సమూహార్థంలో సూచిస్తుంది.
- source_word: וּמִן הַבָּקָר
  choice: పశువుల్లో నుంచి
  rationale: בקר పెద్ద పెంపుడు పశువులను, ముఖ్యంగా ఆవులు-ఎద్దుల వర్గాన్ని సూచిస్తుంది; ‘పశువులు’ జాబితాలో సహజమైన తెలుగు పదం.
- source_word: וּמִן הַחֲמֹרִים
  choice: గాడిదల్లో నుంచి
  rationale: హీబ్రూ బహువచనానికి నేరుగా సరిపోయే ఆధునిక తెలుగు రూపం.
- source_word: וּמִן הַצֹּאן
  choice: గొర్రెలు మేకల్లో నుంచి
  rationale: צאן అనేది సాధారణంగా గొర్రెలు, మేకలు కలిసిన చిన్న పశువుల మందను సూచించే సమూహపదం; తెలుగులో జంతువులను స్పష్టంగా పేర్కొనడం సహజం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దేవుని వ్యక్తిగత ఒడంబడిక నామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా, ప్రస్తుత పండిత లోకంలో విస్తృతంగా అంగీకరించిన ఉచ్చారణను తెలుగులో అందిస్తుంది.
- issue: נפש పదం మనుషులు మరియు జంతువులకు ఉమ్మడిగా వాడబడటం
  choice: జీవి
  alternative: ప్రాణి; ఒక్కటి; ఆత్మ
  rationale: ఈ సందర్భంలో పదం విడిగా ఉన్న అమరాత్మను నిర్దేశించదు; లెక్కించబడే సజీవ వ్యక్తిని సూచిస్తుంది. అందువల్ల మానవులు, జంతువులు రెండింటినీ చేర్చే ‘జీవి’ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ఆజ్ఞార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ప్రత్యేకించాలి’ అని ఇచ్చింది; జాబితా నిర్మాణాన్ని, మనుషులు-జంతువులు రెండింటినీ కలిపే మూలపాఠంలోని భావాన్ని నిలిపింది.
