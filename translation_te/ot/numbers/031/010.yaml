  text: וְ/אֵ֤ת כָּל עָרֵי/הֶם֙ בְּ/מ֣וֹשְׁבֹתָ֔/ם וְ/אֵ֖ת כָּל טִֽירֹתָ֑/ם שָׂרְפ֖וּ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: te
  text: వారి నివాసస్థలాల్లోని పట్టణాలన్నిటినీ, వారి శిబిరాలన్నిటినీ వారు అగ్నితో కాల్చివేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శిబిరాలు’ అనే పదానికి మూలంలోని హీబ్రూ పదం కంచెగల నివాసాలు లేదా చిన్న స్థావరాలు అనే అర్థాలను కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: వారి పట్టణాలు
  rationale: עִיר నగరం లేదా పట్టణాన్ని సూచించగలదు. మిద్యానీయుల నివాస సందర్భంలో ఆధునిక తెలుగులో ‘పట్టణాలు’ సహజంగా ఉండి, పదార్థ విస్తృతిని కాపాడుతుంది.
- source_word: בְּמוֹשְׁבֹתָם
  choice: వారు నివసించిన ప్రాంతాల్లోని
  rationale: מוֹשָׁב నివాసస్థలం లేదా స్థిరనివాస ప్రాంతాన్ని సూచిస్తుంది. ఈ రూపం పట్టణాలతో దాని సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; నిర్దిష్టంగా కేవలం ‘గ్రామాలు’ అని పరిమితం చేయదు.
- source_word: טִירֹתָם
  choice: వారి శిబిరాలు
  rationale: טִירָה శిబిరం, కంచెగల నివాసం, లేదా చిన్న స్థావరాన్ని సూచించవచ్చు. పట్టణాలకు భిన్నమైన నివాస రకాన్ని చూపేందుకు ‘శిబిరాలు’ ఎంచుకోబడింది; ఇతర సాధ్యార్థాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: అగ్నితో కాల్చివేశారు
  rationale: בָּאֵשׁ యొక్క సాధనార్థాన్ని స్పష్టంగా ఉంచుతూ, שׂרף తెలిపే సంపూర్ణ దహన చర్యను సహజమైన, గంభీరమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְאֵת ... וְאֵת
  choice: అన్నిటినీ, ... అన్నిటినీ
  rationale: రెండు ప్రత్యక్ష కర్మలపై ఉన్న כָּל యొక్క సమగ్రతను పునరుక్తి ద్వారా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని అనుసరించగా, ‘అన్నిటినీ’ అనే పునరుక్తి ద్వారా హీబ్రూ వాక్యంలోని సమగ్ర ఉద్ఘాటనను నిలిపాం. ‘అగ్నితో’ అనే రూపం మూలంలోని సాధనార్థ వ్యక్తీకరణను కాపాడుతుంది.
