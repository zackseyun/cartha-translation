source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: te
  text: మోషే వారితో, “మీరు ఆడవారందరినీ ప్రాణాలతో ఉంచారా?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆడవారందరినీ బతకనిచ్చారా?”
    reason: హీబ్రూ కారక క్రియకు ‘ప్రాణాలతో ఉంచడం’ మరియు ‘బతకనివ్వడం’ అనే రెండూ సాధ్యమైన తెలుగు వ్యక్తీకరణలు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథనంలో אמר క్రియకు సహజమైన ఆధునిక తెలుగు భూతకాల రూపం.
- source_word: אֲלֵיהֶם
  choice: వారితో
  rationale: మాటలు ఆ సమూహాన్ని ఉద్దేశించి పలికినట్లు אֶל + 3mp సూచిస్తుంది; తెలుగులో ‘వారితో’ సహజంగా ఉంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: הַחִיִּיתֶם
  choice: ప్రాణాలతో ఉంచారా
  rationale: חיה యొక్క హిఫీల్ రూపం ‘బతకనివ్వడం/ప్రాణాలతో ఉంచడం’ అనే కారక భావాన్ని ఇస్తుంది. ప్రశ్నార్థక భావాన్ని తెలుగు క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: כָּל
  choice: అందరినీ
  rationale: ఏకవచన సమూహవాచక సందర్భంలో సంపూర్ణ పరిధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נְקֵבָה
  choice: ఆడవారందరినీ
  rationale: נְקֵבָה వయస్సుతో పరిమితం కాని స్త్రీలింగ జీవశాస్త్రీయ పరిధిని సూచిస్తుంది. ‘ఆడవారు’ ఈ సందర్భంలో స్త్రీలు, బాలికలు ఇద్దరినీ చేర్చగల సహజ తెలుగు పదప్రయోగం.
theological_decisions:
- issue: యుద్ధ హింస సందర్భంలో נְקֵבָה యొక్క పరిధి
  choice: ఆడవారందరినీ
  alternative: స్త్రీలందరినీ; స్త్రీలను, బాలికలను
  rationale: మూలపదం వయస్సును నిర్దిష్టం చేయదు. ‘ఆడవారు’ దాని విస్తృతమైన, కఠినమైన పరిధిని నిలుపుతూ, ‘స్త్రీలు’ అని వయోజనులకు మాత్రమే పరిమితం చేసే అవకాశాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి. మూలంలోని ప్రశ్న, సమగ్రత, నైతిక కఠినతలను మృదువుచేయకుండా నిలిపింది.
