  text: אַנְשֵׁי֙ הַ/צָּבָ֔א בָּזְז֖וּ אִ֥ישׁ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/053.yaml
  text: The men of the army had each taken plunder for himself[a].
translation:
  language: te
  text: సైన్యంలోని పురుషులు ఒక్కొక్కరూ తమతమ కోసం కొల్లసొమ్మును తీసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “సైన్యంలోని పురుషులు ఒక్కొక్కరు తమతమ కోసం కొల్లగొట్టారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: సైన్యంలోని పురుషులు
  rationale: ఈ నిర్మాణబంధం సైనిక దళంలోని పురుషులను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, మూలంలోని లింగసూచనను నిలుపుతూ ఇలా అనువదించాం.
- source_word: בָּזְזוּ
  choice: కొల్లసొమ్ము తీసుకున్నారు
  rationale: בזז అనే క్రియకు ‘కొల్లగొట్టు, దోచుకొను’ అనే అర్థం ఉంది. మూలంలో కర్మ స్పష్టంగా లేకపోయినా సందర్భం కొల్లసొమ్మును సూచిస్తున్నందున ఈ రూపం తెలుగులో సహజంగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: אִישׁ לוֹ
  choice: ప్రతి ఒక్కరూ తమ కోసం
  rationale: అక్షరార్థంగా ‘ఒక్కొక్క పురుషుడు తన కోసం’ అనే పంపిణీ భావం ఉంది. తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండేందుకు ‘ప్రతి ఒక్కరూ తమ కోసం’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘కొల్లసొమ్ము’ యుద్ధసందర్భంలోని దోపుడు వస్తువులను సహజంగా సూచిస్తుంది; పాదసూచిక మూలంలోని క్రియారూపాన్నీ పంపిణీ నిర్మాణాన్నీ మరింత నేరుగా చూపిస్తుంది.
