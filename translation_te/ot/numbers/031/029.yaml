  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: te
  text: వారి సగభాగం నుండి తీసుకొని, యాజకుడైన ఎలియాజరుకు యాహ్వేకు ప్రత్యేక కానుకగా[a] ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వే అర్పణగా,” లేదా “యాహ్వేకు ఇచ్చే భాగంగా.” హీబ్రూ תְּרוּמָה అనే పదం పవిత్ర వినియోగం కోసం ప్రత్యేకంగా కేటాయించిన భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: వారి సగభాగం నుండి
  rationale: מִן + מַחֲצִיתָם అనే నిర్మాణం ‘వారి సగభాగం నుండి’ అని అర్థమిస్తుంది; సందర్భంలో ఇది యోధులకు కేటాయించిన సగాన్ని సూచిస్తుంది.
- source_word: תִּקָּחוּ
  choice: తీసుకొని
  rationale: ఇది రూపరీత్యా రెండవ పురుష బహువచనం; తెలుగులో తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానించి, ఆదేశార్థాన్ని నిలుపుతుంది.
- source_word: וְנָתַתָּה
  choice: ఇవ్వాలి
  rationale: ఈ క్రియ రెండవ పురుష ఏకవచన రూపంలో ఆజ్ఞాక్రమాన్ని కొనసాగిస్తుంది. హీబ్రూలోని బహువచన–ఏకవచన మార్పును తెలుగులో కృత్రిమంగా ముందుకు తేవకుండా విధ్యర్థకంగా అనువదించబడింది.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరుకు
  rationale: వ్యక్తి పేరు లిప్యంతరీకరించబడింది; הַכֹּהֵן అతని పదవిని నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: תְּרוּמַת יְהוָה
  choice: యాహ్వేకు ప్రతిష్ఠించిన భాగంగా
  rationale: תְּרוּמָה ఇక్కడ కొల్లసొమ్ములో నుండి పవిత్ర ప్రయోజనం కోసం ప్రత్యేకంగా కేటాయించిన భాగాన్ని సూచిస్తుంది. సంబంధవిభక్తి యాహ్వేకు చెందింది లేదా యాహ్వే కోసం ఇచ్చింది అనే రెండింటికీ వీలిస్తుంది; ప్రధాన పాఠం సందర్భానుకూలంగా గమ్యార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి సమీపంగా ఉంటుంది.
- issue: תְּרוּמַת יְהוָה లోని సంబంధం మరియు ఆరాధనా పదం
  choice: యాహ్వేకు ప్రతిష్ఠించిన భాగం
  alternative: యాహ్వే అర్పణ; యాహ్వేకు ఇచ్చే భాగం
  rationale: תְּרוּמָה అనేది పవిత్ర వినియోగం కోసం వేరుచేసిన వాటాను సూచిస్తుంది. హీబ్రూ సంధి ‘యాహ్వేకు చెందినది’ లేదా ‘యాహ్వే కోసం ఇచ్చేది’ అనే భావాలకు వీలిస్తుంది; పాదసూచిక ఈ సహజ ప్రత్యామ్నాయాలను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆదేశాత్మకమైనప్పటికీ సహజంగా చదవదగిన గౌరవప్రద శైలి వాడబడింది. ‘ప్రతిష్ఠించిన భాగం’ ద్వారా సందర్భంలోని కేటాయించిన పవిత్ర వాటా స్పష్టమవుతుంది; పాదసూచిక మూలంలోని సంబంధార్థ వైవిధ్యాన్ని ఉంచుతుంది.
