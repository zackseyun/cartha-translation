translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. హెబ్రీ వాక్యంలోని అనువర్తిత వివరణను డాష్‌లతో స్పష్టంచేసి, సైనిక హోదాల నిర్మాణాన్ని నిలుపుకుంది.
