  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: te
  text: అప్పుడు సైన్యంలోని వేలమందితో కూడిన దళాలపై నియమించబడిన అధికారులు—వెయ్యిమందికి అధిపతులు, వందమందికి అధిపతులు—మోషే దగ్గరకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: దగ్గరకు వచ్చారు
  rationale: קרב అనే క్రియ ఇక్కడ ఒకరి వైపు సమీపించడాన్ని సూచిస్తుంది. ‘దగ్గరకు వచ్చారు’ అనే ప్రయోగం దాని స్పష్టమైన భావాన్నీ కథన సహజత్వాన్నీ నిలుపుతుంది.
- source_word: הַפְּקֻדִים
  choice: నియమించబడిన అధికారులు
  rationale: פקד మూలం నుంచి వచ్చిన ఈ రూపం సైనిక విభాగాలపై బాధ్యతకు నియమించబడిన వారిని సూచిస్తుంది. ‘అధికారులు’ వారి కార్యాన్ని తెలుపుతుండగా, ‘నియమించబడిన’ అనే పదం హెబ్రీ రూపంలోని భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: సైన్యంలోని వేలమందితో కూడిన దళాలపై
  rationale: ఈ పదబంధం అధికారుల బాధ్యతా పరిధిని గుర్తిస్తుంది. తరువాత వచ్చే ‘వెయ్యిమందికి అధిపతులు, వందమందికి అధిపతులు’ అనే వివరణకు అనుగుణంగా దళాలపై అధికారాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: אַלְפֵי
  choice: వేలమందితో కూడిన దళాలు
  rationale: אֶלֶף కొన్నిసార్లు వంశగుంపును లేదా సైనిక విభాగాన్ని సూచించగలదు. ఇక్కడ సైనిక సందర్భం, ‘వందలు’తో సమాంతర నిర్మాణం కారణంగా సంఖ్యాపరమైన సైనిక దళాల భావం తగినది.
- source_word: הַצָּבָא
  choice: సైన్యం
  rationale: צבא ఇక్కడ వ్యవస్థీకృత యుద్ధ బలగాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సైన్యం’ స్పష్టమైన, సహజమైన పదం.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: వెయ్యిమందికి అధిపతులు
  rationale: שׂר నాయకుడు లేదా అధికారి అనే అర్థం ఇస్తుంది. ఈ సైనిక సందర్భంలో ‘అధిపతులు’ నాయకత్వ హోదాను సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: వందమందికి అధిపతులు
  rationale: మునుపటి పదబంధానికి సమాంతరంగా అనువదించడం ద్వారా సైనిక అధికార క్రమం మరియు మూలపాఠ నిర్మాణం నిలిచాయి.
