id: NUM.31.50
reference: Numbers 31:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: te
  text: '“కాబట్టి మేము యెహోవాకు అర్పణను తీసుకొచ్చాము: మాలోని ప్రతి మనిషి తనకు దొరికిన బంగారు వస్తువులను—బాహుబంధాలు[a], కంకణాలు, ఉంగరాలు, చెవిపోగులు, వేలాడే ఆభరణాలు[b]—యెహోవా సన్నిధిలో మా ప్రాణాల నిమిత్తం ప్రాయశ్చిత్తం చేయడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బాహుబంధాలు’ అనే పదం (אֶצְעָדָה) ‘కాలి కడియాలు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వేలాడే ఆభరణాలు’ (כוּמָז) అనే పదం యొక్క ఖచ్చిత అర్థం అనిశ్చితం; ‘హారాలు,’ ‘ఆభరణాలు,’ లేదా ‘ముక్కుపుడకలు’ అనే అర్థాలు కూడా ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: అందుకే మేము ... తీసుకొచ్చాము
  rationale: హిఫీల్ రూపంలోని ‘దగ్గరకు తేవడం/సమర్పించడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కథన వావ్‌ను ‘అందుకే’ ప్రతిబింబిస్తుంది.
- source_word: קָרְבַּן יְהוָה
  choice: యెహోవా అర్పణ
  rationale: קָרְבָּןలోని సమర్పణ భావాన్ని నిలుపుతూ, యెహోవాతో ఉన్న నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది; అర్పణ రకాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: మాలో ప్రతి మనిషి తనకు దొరికిన
  rationale: పురుష సైనికుల సందర్భంలోని పంపిణీ భావాన్ని ‘ప్రతి మనిషి’ స్పష్టంగా చూపిస్తుంది; మొదటి పురుష బహువచన వాక్యంతో సహజ అనుసంధానానికి ‘మాలో’ చేర్చబడింది.
- source_word: כְלִי זָהָב
  choice: బంగారు వస్తువులు
  rationale: כְלִי అనే విస్తృత పదాన్ని ఆభరణాలకు మాత్రమే ముందుగానే పరిమితం చేయకుండా సహజంగా అనువదిస్తుంది.
- source_word: אֶצְעָדָה
  choice: బాహుబంధాలు
  rationale: అవయవంపై ధరించే ఆభరణం అనే సంభావ్య భావానికి సరిపోతుంది; అది కాలి కడియం కావచ్చనే అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: צָמִיד
  choice: కంకణాలు
  rationale: మణికట్టు లేదా చేతిపై ధరించే అలంకార బంధానికి సహజమైన తెలుగు పదం.
- source_word: טַבַּעַת
  choice: ఉంగరాలు
  rationale: మూలపదం ఉంగరాన్ని సూచిస్తుంది; ‘ముద్ర ఉంగరం’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: עָגִיל
  choice: చెవిపోగులు
  rationale: ఈ ఆభరణాల జాబితాలో సాధారణంగా అర్థమయ్యే చెవి ఆభరణాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: כוּמָז
  choice: వేలాడే ఆభరణాలు
  rationale: వస్తువు యొక్క ఖచ్చిత స్వరూపం అనిశ్చితమైనందున, చదవడానికి సహజమైనప్పటికీ అతిగా నిర్దిష్టం కాని పదబంధాన్ని ఎంచుకుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఉన్నాయి.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: బలి-ఆరాధనా సందర్భంలోని כפר పదానికి ఉన్న ధార్మిక బరువును నిలుపుతుంది; దాని కార్యవిధిని మూలం చెప్పినదానికంటే ఎక్కువగా వివరించదు.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: మా ప్రాణాల నిమిత్తం
  rationale: נֶפֶשׁ యొక్క ‘ప్రాణాలు/వ్యక్తులు’ అనే భావాన్ని కాపాడుతుంది; శరీరం-ఆత్మ అనే తరువాతి ద్వైత భావనను చొప్పించదు.
theological_decisions:
- issue: సైనికుల కానుకకు כפרతో ఉన్న సంబంధం
  choice: ఈ కానుక యెహోవా సన్నిధిలో వారి ప్రాణాల నిమిత్తం ప్రాయశ్చిత్తం చేయడానికి సమర్పించబడింది.
  alternative: ఇది ప్రాయశ్చిత్త భావం లేని కేవలం కృతజ్ఞతార్పణ; లేదా ఆరాధనా భావం లేని ప్రమాద నివారణ మాత్రమే.
  rationale: వచనం స్పష్టంగా כפרను, ‘యెహోవా సన్నిధిలో’ అనే మాటను, קָרְבַּןను ఉపయోగిస్తుంది. కాబట్టి ప్రాయశ్చిత్త భాషను నిలుపుతూ, అది ఎలా కార్యసాధకం అవుతుందో అదనంగా నిర్ణయించలేదు.
- issue: אִישׁ యొక్క లింగం మరియు పంపిణీ భావం
  choice: ప్రతి మనిషి
  alternative: ప్రతి ఒక్కరు / ప్రతి వ్యక్తి
  rationale: సందర్భం పురుష సైనికులను సూచిస్తుంది; మూలంలోని పురుష ఏకవచన పంపిణీ భావాన్ని యథార్థంగా నిలుపుతుంది.
- issue: עַל נַפְשֹׁתֵינוּలో נֶפֶשׁ భావం
  choice: మా ప్రాణాల నిమిత్తం
  alternative: మా నిమిత్తం / మా ఆత్మల నిమిత్తం
  rationale: ‘ప్రాణాలు’ మూలంలోని జీవితం/వ్యక్తి అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘ఆత్మలు’ అని అనువదించి మూలంలో లేని మానవ నిర్మాణ సిద్ధాంతాన్ని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆరాధనా-బలి సందర్భానికి తగిన ‘అర్పణ,’ ‘సన్నిధి,’ ‘ప్రాయశ్చిత్తం’ వంటి స్థిర పదాలను ఉపయోగించి, అరుదైన ఆభరణ పదాల అనిశ్చితిని పాదసూచికల్లో భద్రపరిచింది.
