    text: ‘వేలాడే ఆభరణాలు’ (כוּמָז) అనే పదం యొక్క ఖచ్చిత అర్థం అనిశ్చితం; ‘హారాలు,’ ‘ఆభరణాలు,’ లేదా ‘ముక్కుపుడకలు’ అనే అర్థాలు కూడా ప్రతిపాదించబడ్డాయి.
