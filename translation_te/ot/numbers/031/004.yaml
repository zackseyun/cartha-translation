  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: te
  text: ప్రతి గోత్రం నుండి వెయ్యి మందిని, ప్రతి గోత్రం నుండి వెయ్యి మందిని, ఇశ్రాయేలు గోత్రాలన్నిటి నుండి సైనిక సేవకు[a] పంపండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైన్యంలోకి.’ హీబ్రూ לַצָּבָא అనే పదబంధం సైనిక దళంలో సేవను సూచించగలదు; అది కేవలం ఒక ప్రదేశం వైపు వెళ్లడాన్ని మాత్రమే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  choice: వెయ్యి మందిని
  rationale: ఇది సంఖ్యావాచకం. సైన్యంలోకి పంపబడే వ్యక్తులను సూచిస్తున్నందున తెలుగులో సహజంగా ఉండేందుకు ‘మందిని’ చేర్చబడింది.
- source_word: לַמַּטֶּה
  choice: ఒక్కో గోత్రం నుండి
  rationale: మַטֶּה ఇక్కడ ‘గోత్రం’ అని అర్థం; సంఖ్యతో పునరావృతమైన ל పంపిణీ భావాన్ని ఇస్తుంది. సందర్భానుసారం మూలాన్ని సూచించే ‘నుండి’ సహజమైన తెలుగు.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: ఒక్కో గోత్రం నుండి వెయ్యి మందిని, ఒక్కో గోత్రం నుండి వెయ్యి మందిని
  rationale: హీబ్రూ వాక్యంలోని ఉద్దేశపూర్వక పునరుక్తిని దాని వాక్చాతుర్య బలం, మూలరూప పారదర్శకత కోసం నిలుపుకుంది.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటి నుండి
  rationale: ఈ పదబంధం ఆ ఆజ్ఞ ఇశ్రాయేలు గోత్రాలన్నిటికీ పంపిణీగా వర్తిస్తుందని స్పష్టం చేస్తుంది.
- source_word: תִּשְׁלְחוּ
  choice: పంపాలి
  rationale: Qal imperfect రెండవ పురుష బహువచనం ఇక్కడ ఆజ్ఞార్థక బలంతో ఉంది. ఆధునిక తెలుగులో ‘పంపాలి’ ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది; కర్త సందర్భం ద్వారా గ్రహించబడుతుంది.
- source_word: לַצָּבָא
  choice: సైనిక సేవకు
  rationale: צָבָא ఇక్కడ సైనిక దళాన్ని లేదా యుద్ధసేవను సూచించవచ్చు. ‘సైనిక సేవకు’ అనేది కేవలం ఒక ప్రదేశం వైపు పంపడాన్ని కాక, సైన్యంలో సేవ చేయడానికి పంపడాన్ని స్పష్టం చేస్తుంది.
