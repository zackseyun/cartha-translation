  language: te
  text: మరియు గాడిదలు ముప్పై వేల ఐదు వందలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: గాడిదలు
  rationale: חֲמֹרִים అనేది ‘గాడిదలు’ అనే సాధారణ బహువచన నామవాచకం. ముందున్న ו జాబితా కొనసాగింపును సూచిస్తుంది; తెలుగులో ఈ చిన్న జాబితా భాగాన్ని సహజంగా చదవడానికి ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా వరుస నిర్మాణంలోనే కొనసాగించబడింది.
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: ముప్పై వేల
  rationale: హీబ్రూ సంఖ్యా నిర్మాణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: ఐదు వందలు
  rationale: ఇది ముందున్న ముప్పై వేలకు కలిపే అదనపు సంఖ్య. తెలుగులో ‘ముప్పై వేల ఐదు వందలు’ అనడం సహజం; హీబ్రూలోని సంధికార్థం సంఖ్యా నిర్మాణంలో స్పష్టంగానే ఉంటుంది.
