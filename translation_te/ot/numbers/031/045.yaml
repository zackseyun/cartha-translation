translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లెక్కల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పద్యభాగం మునుపటి వాక్యంలోని జాబితాను కొనసాగిస్తుందనే భావం నిలిచేలా అనవసర పదాలను చేర్చలేదు.
