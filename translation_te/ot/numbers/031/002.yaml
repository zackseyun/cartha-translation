source:
  edition: WLC
  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారుల కోసం మిద్యానీయుల మీద ప్రతీకారం తీర్చుకో.[a] ఆ తర్వాత నీవు నీ ప్రజలతో చేర్చబడతావు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిద్యానీయుల మీద ఇశ్రాయేలు కుమారుల ప్రతీకారం తీర్చుకో.” హీబ్రూలో అక్షరార్థంగా, “మిద్యానీయుల నుండి/మీద ఇశ్రాయేలు కుమారుల ప్రతీకారాన్ని తీర్చుకో.”
    reason: lexical_alternative
  - marker: b
    text: “నీ ప్రజలతో చేర్చబడతావు” అనేది మరణాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: ప్రతీకారం తీర్చుకో
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకం కలిసి చర్యను బలంగా వ్యక్తం చేస్తున్నాయి. ఆధునిక తెలుగులో ‘ప్రతీకారం తీర్చుకో’ సహజంగా ఉండి ఆజ్ఞ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపాన్ని, దానిలోని ఒడంబడిక-గుర్తింపు భాషను దగ్గరగా నిలుపుతుంది; ‘ఇశ్రాయేలీయులు’ మరింత సహజమైన ప్రత్యామ్నాయం.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: మిద్యానీయుల మీద
  rationale: נקםతో ఈ పదబంధం ప్రతీకారం ఎవరికి విరోధంగా అమలు చేయాలో సూచిస్తుంది. ‘మీద’ తెలుగులో ఈ భావానికి సహజమైన ప్రయోగం.
- source_word: אַחַר
  choice: ఆ తర్వాత
  rationale: తదుపరి సంఘటనను సూచించే స్పష్టమైన కాలసూచక పదబంధం.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: నీవు నీ ప్రజల దగ్గరికి చేర్చబడతావు
  rationale: మరణాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘చేర్చబడటం’ అనే రూపకాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా అనువదించబడింది.
theological_decisions:
- issue: మోషే మరణాన్ని సూచించే నుడికారం
  choice: ‘నీవు నీ ప్రజల దగ్గరికి చేర్చబడతావు’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘నీవు చనిపోతావు’ లేదా ‘నీ పూర్వీకుల దగ్గరికి చేర్చబడతావు’
  rationale: ఈ పదబంధం మరణానికి హీబ్రూ నుడికారం. దాన్ని నేరుగా ‘చనిపోతావు’ అని మార్చకుండా ఉంచడం మూలపాఠపు చిత్రణను కాపాడుతుంది; ‘పూర్వీకులు’ అని చెప్పడం ద్వారా వచనం స్పష్టంగా చెప్పని భావాన్ని పరిమితం చేయదు.
- issue: ప్రతీకారం ఎవరి పక్షంగా తీర్చబడుతుంది
  choice: ‘ఇశ్రాయేలు కుమారుల పక్షంగా’
  alternative: ‘ఇశ్రాయేలు కుమారుల ప్రతీకారాన్ని’
  rationale: హీబ్రూ నిర్మాణం ‘ఇశ్రాయేలు కుమారుల ప్రతీకారం’ అని సూటిగా చదవవచ్చు; సందర్భార్థాన్ని తెలుగులో స్పష్టం చేయడానికి ‘పక్షంగా’ వాడబడింది, అయితే ప్రత్యక్ష నిర్మాణం పాదటీపులో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని మరణ నుడికారాన్ని వ్యాఖ్యానాత్మకంగా సులభీకరించకుండా నిలిపింది. అన్ని పాదటీపు గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
