  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: te
  text: గాడిదలు 30,500; వాటిలో యాహ్వేకు చెల్లించవలసిన వంతు 61[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వాటి కప్పము. హీబ్రూ పదం దోపుడు సొమ్ములోనుంచి యాహ్వేకు ప్రత్యేకంగా కేటాయించిన నిర్ణీత భాగాన్ని సూచిస్తుంది.
    reason: మִכְסָםకు సాధ్యమైన పదప్రయోగ ప్రత్యామ్నాయాన్ని, దాని సందర్భార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: గాడిదలు
  rationale: חֲמֹרִים అనే సాధారణ బహువచన నామవాచకానికి సహజమైన ఆధునిక తెలుగు రూపం. జాబితా కొనసాగింపును తెలుగులో విరామచిహ్నంతో సహజంగా తెలియజేశాం.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30,500
  rationale: హీబ్రూ సంఖ్యను గణాంక జాబితికి తగినట్లుగా అంకెలలో స్పష్టంగా ఇచ్చాం.
- source_word: וּ/מִכְסָ/ם
  choice: వాటిలో ... చెల్లించాల్సిన వంతు
  rationale: מֶכֶס ఇక్కడ దోపుడు సొమ్ములోనుంచి లెక్కించి ప్రత్యేకంగా ఇవ్వాల్సిన నిర్దిష్ట భాగాన్ని సూచిస్తుంది. 'పన్ను' కంటే 'చెల్లించాల్సిన వంతు' సందర్భార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַ/יהוָה
  choice: యెహోవాకు
  rationale: לְ ఉపసర్గ ఆ వంతు యెహోవాకు చెందేదిగా లేదా ఆయనకు ఇవ్వబడేదిగా సూచిస్తుంది; దైవనామాన్ని వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: హీబ్రూ వచనంలోని అరవై ఒకటి అనే ఖచ్చిత సంఖ్యను జాబితా శైలికి అనుగుణంగా అంకెలలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ వచనంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన 'యెహోవా' రూపాన్ని ఎంచుకున్నాం; 'యాహ్వే' మూల ఉచ్చారణను ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గణాంక జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు సమన్విత అంశాలను సెమికోలన్‌తో కలిపి సహజంగా అందించాం.
