  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: te
  text: అప్పుడు మోషేను యాజకుడైన ఎలియాజరును వారివద్ద నుండి ఆ బంగారాన్ని—తయారుచేసిన ప్రతి వస్తువును[a]—తీసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పనితనంతో చేసిన అన్ని వస్తువులు,” అంటే పనితనంతో తయారైన బంగారు వస్తువులన్నీ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నారు
  rationale: לקח అనే క్రియ ఇక్కడ స్వీకరించడం లేదా తీసుకోవడం అనే కథన చర్యను సూచిస్తుంది. మోషే, ఎలియాజరు అనే సంయుక్త కర్తకు గౌరవసూచక బహువచన క్రియ సహజమైన ఆధునిక తెలుగు.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: వ్యక్తినామంతో పాటు అతని అధికారపదవిని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: אֶת הַזָּהָב
  choice: ఆ బంగారాన్ని
  rationale: నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తూ, సందర్భంలో అప్పగించబడిన నిర్దిష్ట బంగారాన్ని తెలియజేస్తుంది.
- source_word: מֵאִתָּם
  choice: వారి దగ్గర నుండి
  rationale: మూలం లేదా ఇచ్చినవారిని సూచించే హీబ్రూ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: כֹּל
  choice: ప్రతి
  rationale: తరువాతి ఏకవచన సమూహార్థక పదబంధంతో కలిసి ప్రతి తయారుచేసిన వస్తువునూ సూచిస్తుంది.
- source_word: כְּלִי מַעֲשֶׂה
  choice: చేతిపనితో చేసిన ప్రతి వస్తువు
  rationale: כְּלִי యొక్క విస్తృత ‘వస్తువు/పరికరం’ భావాన్నీ, מַעֲשֶׂה యొక్క తయారైన లేదా పనితనంతో రూపుదిద్దుకున్న భావాన్నీ స్పష్టంగా తెలియజేస్తుంది; ఇది పాత్రలకే పరిమితం చేయదు.
