translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. చివరి పదబంధాన్ని డాష్‌ల మధ్య ఉంచడం ద్వారా ‘ఆ బంగారం’ ఏమిటో వివరిస్తున్న సమానాధికార పదబంధంగా చూపించబడింది; అనవసర సిద్ధాంత వివరణ చేర్చలేదు.
