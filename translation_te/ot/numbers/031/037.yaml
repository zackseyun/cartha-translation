  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: te
  text: మందలోనుండి యాహ్వేకు విధించిన భాగం ఆరు వందల డెబ్బై ఐదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: చెల్లించవలసిన పన్ను ... అయిదు
  rationale: ఇక్కడ היה రూపం మొత్తాన్ని తెలిపే సాధారణ కథనాత్మక సంధిగా ఉంది. తెలుగులో ప్రత్యేకంగా ‘ఉండెను’ అని చేర్చకుండా నామవాక్యంగా చెప్పడం సహజం.
- source_word: הַמֶּכֶס
  choice: చెల్లించవలసిన పన్ను
  rationale: మֶכֶס ఇక్కడ యుద్ధంలో దక్కిన సొమ్ములోనుండి విధించి ప్రత్యేకంగా కేటాయించిన భాగాన్ని సూచిస్తుంది. ‘పన్ను’ సామాన్య పాఠకులకు స్పష్టం; ‘చెల్లించవలసిన’ అనే పదం దాని విధిత స్వభావాన్ని తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ ఈ భాగం యెహోవాకు కేటాయించబడిందని సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: מִן הַצֹּאן
  choice: మందలోనుండి
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించగలదు. ‘మంద’ అనవసరంగా గొర్రెలకే పరిమితం చేయకుండా సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: ఆరు వందల డెబ్బై అయిదు
  rationale: మూలంలోని ఖచ్చితమైన సంఖ్య 675ను సహజమైన ఆధునిక తెలుగు సంఖ్యా రూపంలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: ఈ వచనంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది. దైవనామాన్ని కనిపించకుండా చేయకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం; ‘యాహ్వే’ మూల ఉచ్చారణను మరింత సమీపంగా ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన లెక్కల సందర్భానికి తగిన గంభీరమైన, సులభగ్రాహ్యమైన వాక్య నిర్మాణం. మూలంలోని ‘మంద’ అనే సమూహార్థాన్ని నిలిపి, దాన్ని గొర్రెలకే పరిమితం చేయలేదు.
