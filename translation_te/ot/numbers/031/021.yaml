source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: te
  text: 'అప్పుడు యాజకుడైన ఎలియాజరు యుద్ధానికి వచ్చిన సైన్యంలోని పురుషులతో ఇలా అన్నాడు: “యాహ్వే మోషేకు ఆజ్ఞాపించిన ధర్మశాస్త్ర నియమం[a] ఇదే:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధర్మశాస్త్రపు శాసనం’; లేదా ‘ఉపదేశ నియమం.’
    reason: חֻקַּת הַתּוֹרָה అనే పదబంధంలో חֻקָּהకు ‘నియమం/శాసనం,’ תּוֹרָהకు ‘ధర్మశాస్త్రం/ఉపదేశం’ అనే భావసాధ్యతలు ఉన్నాయి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించి, అతని నిర్దిష్ట పదవిని సహజంగా తెలిపింది.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: సైన్యంలోని పురుషులు
  rationale: అక్షరార్థంగా ఉన్న ‘సైన్యపు పురుషులు’ అనే భావాన్ని నిలుపుతూ, మూలంలోని పుంలింగ సూచనను తొలగించకుండా సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకుంది.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: యుద్ధానికి వచ్చిన
  rationale: בוא అనే రావడం మరియు ל అనే దిశాసూచక సంబంధాన్ని నేరుగా నిలుపుతుంది; సందర్భాన్ని బట్టి ‘యుద్ధం నుండి తిరిగి వచ్చిన’ అని మూలంలో లేని భావాన్ని చేర్చలేదు.
- source_word: חֻקַּת הַתּוֹרָה
  choice: ధర్మశాస్త్ర నియమం
  rationale: חֻקָּהలోని స్థిరమైన, అధికారిక నియమ భావాన్ని ‘నియమం’ తెలియజేస్తుంది; תּוֹרָהకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ధర్మశాస్త్రం’ ఉపయోగించబడింది.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించిన
  rationale: אֶת మోషేనే ఆజ్ఞను స్వీకరించిన ప్రత్యక్ష కర్మగా సూచిస్తుంది; అందువల్ల ‘మోషే ద్వారా’ అని మధ్యవర్తిత్వ భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: תּוֹרָה యొక్క భావపరిధి
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: ఈ సందర్భం శుద్ధీకరణకు సంబంధించిన అధికారిక నియమాన్ని పరిచయం చేస్తుంది; కాబట్టి ‘ధర్మశాస్త్రం’ న్యాయబద్ధమైన బలాన్ని నిలుపుతుంది, అయితే ‘ఉపదేశం’ అనే విస్తృత భావసాధ్యతను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి ఉపయోగించబడింది. మూలపాఠంలోని పురుష సూచన, యుద్ధం వైపు రావడం అనే అస్పష్ట సందర్భం, అలాగే న్యాయబద్ధమైన పదజాలం సాధ్యమైనంతవరకు నిలుపబడ్డాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘ధర్మశాస్త్ర నియమం’ పదబంధానికే జోడించబడింది.
