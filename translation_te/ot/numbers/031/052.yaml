id: NUM.31.52
reference: Numbers 31:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: te
  text: వెయ్యిమందిపై అధిపతుల నుండీ, వందమందిపై అధిపతుల నుండీ యాహ్వేకు కానుకగా[a] సమర్పించిన బంగారం మొత్తం పదహారు వేల ఏడు వందల యాభై షెకెలులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అర్పణగా.’ హీబ్రూ పదం యాహ్వే కోసం ప్రత్యేకించి ఉంచిన కానుకను సూచిస్తుంది; సంప్రదాయంగా దీనిని ‘పైకెత్తే అర్పణ’ అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: బంగారం మొత్తం
  rationale: וַיְהִי ఇక్కడ కథనాన్ని కొనసాగిస్తూ మొత్తాన్ని తెలియజేస్తుంది; తెలుగులో ప్రత్యేకంగా ‘అది జరిగింది’ అని చేర్చకుండా ‘బంగారం మొత్తం’ అనే సహజ వాక్యనిర్మాణం ఆ భావాన్ని అందిస్తుంది.
- source_word: הַתְּרוּמָה אֲשֶׁר הֵרִימוּ לַיהוָה
  choice: యెహోవాకు కానుకగా సమర్పించిన
  rationale: תְּרוּמָה మరియు רום హిఫీల్ రూపం కలిసి పవిత్ర ప్రయోజనం కోసం ప్రత్యేకించి సమర్పించిన కానుకను సూచిస్తాయి. ‘కానుకగా సమర్పించిన’ అనేది ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అక్షరార్థమైన పైకెత్తే చర్యను అనవసరంగా సూచించదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామం יְהוָהను వ్యక్తిగత నామంగా నిలుపుతూ, ל ఉపసర్గను ‘కు’తో వ్యక్తపరచింది.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: పదహారు వేల ఏడు వందల యాభై షెకెలులు
  rationale: సంఖ్యను నేరుగా తెలుగులో ఇచ్చి, ప్రాచీన బరువు ప్రమాణమైన שֶׁקֶלను ‘షెకెలు’గా లిప్యంతరీకరించింది.
- source_word: שָׂרֵי הָאֲלָפִים וּשָׂרֵי הַמֵּאוֹת
  choice: వేలమందికి అధిపతులైనవారు, వందమందికి అధిపతులైనవారు
  rationale: సైనిక వ్యవస్థలో వెయ్యిమంది, వందమంది మీద అధికారమున్న నాయకులను సూచించే సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని వాడుతుంది. అందువల్ల దైవనామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపింది.
- issue: תְּרוּמָה యొక్క ఆరాధనా భావం
  choice: కానుక
  alternative: ప్రతిష్ఠార్పణ / పైకెత్తే అర్పణ
  rationale: ఈ పదం యెహోవా కోసం ప్రత్యేకించి ఇచ్చిన భాగాన్ని సూచిస్తుంది. ‘కానుక’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; పదంలో ఉన్న పవిత్ర ప్రయోజన భావాన్ని పాదటిప్పణి వివరిస్తుంది, కానీ నిర్దిష్ట ఆచారపద్ధతిని మూలం కంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కానుక ఇచ్చిన అధిపతులను ముందుకు తెచ్చి సహజమైన తెలుగు వాక్యంగా మలిచింది.
