  terminology: ‘కానుకగా సమర్పించిన’ appropriately renders תְּרוּמָה together with the offering verb without imposing a literal lifting rite. ‘షెకెలులు’ is a suitable transliteration of the ancient weight unit. ‘యాహ్వే’ preserves the personal divine name in line with the supplied audit trail.
