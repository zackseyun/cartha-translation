id: NUM.31.6
reference: Numbers 31:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: te
  text: మోషే ప్రతి గోత్రం నుండి వెయ్యిమందిని యుద్ధానికి పంపించాడు; వారితో పాటు యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసును కూడా యుద్ధానికి పంపించాడు. పరిశుద్ధ ఉపకరణాలు[a], సంకేతం ఇచ్చే బాకాలు[b] అతని చేతిలో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధ స్థలపు ఉపకరణాలు’ లేదా ‘పవిత్ర వస్తువులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యుద్ధ సంకేతం కోసం బాకాలు,’ ‘హెచ్చరిక మోగించే బాకాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: కథన సందర్భంలో ‘పంపించాడు’ అనేది సహజమైన, స్పష్టమైన తెలుగు పదం; సైనిక చర్యను అనవసరంగా విస్తరించదు.
- source_word: אֶלֶף לַמַּטֶּה
  choice: ప్రతి గోత్రం నుంచి వెయ్యి మందిని
  rationale: హీబ్రూ నిర్మాణంలోని పంపిణీ భావాన్ని, ప్రతి గోత్రం సమకూర్చిన సంఖ్యగా, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לַצָּבָא
  choice: యుద్ధానికి
  rationale: ఇక్కడ צבא సైన్యం అనే సంస్థకన్నా యుద్ధసేవ లేదా యుద్ధయాత్రను సూచిస్తుంది; దిశార్థాన్ని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: אֹתָם ... אֹתָם
  choice: వారిని, వారితోపాటు
  rationale: హీబ్రూలోని పునరుక్తి, అన్వయాన్ని తెలుగులో అర్థవంతంగా నిలుపుతూ, సైనికులతో ఫీనెహాసు వెళ్లాడని స్పష్టం చేస్తుంది.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు
  rationale: పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, సంబంధాన్ని సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: పరిశుద్ధ సామగ్రి
  rationale: כְּלֵי అనే పదానికి పాత్రలు, ఉపకరణాలు, వస్తువులు అనే విస్తృత అర్థపరిధి ఉంది. ఏ నిర్దిష్ట వస్తువులో చెప్పకుండా ఆరాధన సంబంధిత భావాన్ని ‘పరిశుద్ధ సామగ్రి’ నిలుపుతుంది.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: యుద్ధ సంకేతం ఇచ్చే బాకాలు
  rationale: חצוצרות లోహపు బాకాలను, תרועה బిగ్గరగా ఇచ్చే హెచ్చరిక లేదా సమర సంకేతాన్ని సూచిస్తుంది. సైనిక సందర్భాన్ని సహజంగా వ్యక్తం చేస్తూనే ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: בְּיָדוֹ
  choice: అతని చేతిలో
  rationale: ఏకవచన సర్వనామం సమీపంలోని ఏకవచన పూర్వపదమైన ఫీనెహాసును సహజంగా సూచిస్తుంది. హీబ్రూ నుడికారాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
theological_decisions:
- issue: సైనిక యాత్రలో ఫీనెహాసు మరియు పరిశుద్ధ సామగ్రి పాత్ర
  choice: ఫీనెహాసు యాజక ప్రతినిధిగా పరిశుద్ధ సామగ్రి, సంకేత బాకాలతో సైనికులతో కలిసి వెళ్లినట్లు మాత్రమే అనువదించబడింది.
  alternative: ఫీనెహాసు కేవలం పరిశీలకుడని లేదా ఈ వస్తువులకు ప్రత్యేక యాజక సంబంధం లేదని అర్థం చేసుకోవడం.
  rationale: వచనం ఫీనెహాసును, పరిశుద్ధ సామగ్రిని, బాకాలను యుద్ధయాత్రతో నేరుగా కలుపుతుంది; అయితే ‘పరిశుద్ధ యుద్ధం’ వంటి తరువాతి సిద్ధాంతపరమైన వివరణలను మూలపాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ పునరుక్తిని పూర్తిగా తొలగించకుండా రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యం కల్పించబడింది. పాదటిప్పణి గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచబడ్డాయి.
