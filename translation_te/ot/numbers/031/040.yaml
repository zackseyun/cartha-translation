  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: te
  text: మనుష్యులు[a] పదహారు వేలు; వారిలో యాహ్వేకు విధించిన వాటా[b] ముప్పై ఇద్దరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మనిషి ప్రాణాలు’; ఇక్కడ మనుష్య వ్యక్తులను లెక్కించే పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేక, ‘వారి లెవీ.’ ఇది యుద్ధ దోపిడీలో యాహ్వేకు వేరుచేసిన నిర్ణీత భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: మనుషులు
  rationale: ఈ దోపుడు సొమ్ము లెక్కలో ఈ పదబంధం జంతువులకు భిన్నంగా మనుష్య వ్యక్తులను సూచిస్తుంది. ‘మనుషులు’ అనేది ఆధునిక తెలుగులో సహజమైన లెక్కింపు పదం.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: పదహారు వేలు
  rationale: హీబ్రూ సంఖ్యను నేరుగా, సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: מִכְסָם
  choice: వారిలో ... పన్నుగా కేటాయించినవారు
  rationale: מֶכֶס ఇక్కడ దోపుడు సొమ్ములో యాహ్వేకు ఇవ్వడానికి లెక్క ప్రకారం వేరుచేసిన భాగాన్ని సూచిస్తుంది. వ్యక్తుల విషయంలో ‘పన్నుగా కేటాయించినవారు’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గ కేటాయింపు లేదా సమర్పణను సూచిస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: ముప్పై ఇద్దరు
  rationale: నֶפֶשׁ ఇక్కడ వ్యక్తులను లెక్కించే పదం; వ్యక్తులకు అనుగుణంగా తెలుగులో ‘ఇద్దరు’ వాడటం సహజం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా సూచిస్తుంది.
- issue: మనుషులను యాహ్వేకు పన్నుగా కేటాయించడం
  choice: మూలంలోని పరిపాలనా భాషను నిలుపుతూ ‘పన్నుగా కేటాయించినవారు’
  alternative: యాహ్వేకు ఇచ్చినవారు
  rationale: వాక్యంలోని నైతిక లేదా ధార్మిక ఉద్రిక్తతను సున్నితపరచకుండా, מֶכֶס అనే విధించిన వాటా భావాన్ని నిలుపుతుంది; అయితే మూలంలో లేని వారి తదుపరి గతి గురించి ఏమీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘సంఖ్య’ను చేర్చడం హీబ్రూ నామవాచక-సంఖ్య నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. వ్యక్తుల లెక్కలో ‘మంది/ఇద్దరు’ వాడబడింది.
