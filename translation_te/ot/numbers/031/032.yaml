id: NUM.31.32
reference: Numbers 31:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ הַ/מַּלְק֔וֹחַ יֶ֣תֶר הַ/בָּ֔ז אֲשֶׁ֥ר בָּזְז֖וּ עַ֣ם הַ/צָּבָ֑א צֹ֗אן שֵׁשׁ מֵא֥וֹת אֶ֛לֶף וְ/שִׁבְעִ֥ים אֶ֖לֶף וַ/חֲמֵֽשֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: te
  text: దోపుడుసొమ్ము[a]—సైన్యంలో ఉన్నవారు దోచుకున్న కొల్లసొమ్ములో మిగిలినది—675,000 గొర్రెలుగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుద్ధంలో పట్టుకున్న సొమ్ము.’ ఇక్కడ హీబ్రూలో యుద్ధంలో స్వాధీనం చేసుకున్నదాన్ని సూచించే, అర్థంలో దగ్గరగా ఉన్న రెండు పదాలు (מַלְקוֹחַ, בָּז) వాడబడ్డాయి; వాటి మధ్య శైలీపరమైన లేదా వర్గీకరణకు సంబంధించిన స్వల్ప భేదం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉంది (తెలుగులో నామవాక్య నిర్మాణంలో అంతర్లీనంగా)
  rationale: ఈ రూపం జాబితా వివరాన్ని ముందుకు తీసుకువచ్చి పరిమాణాన్ని తెలిపే వాక్యాన్ని నిర్మిస్తుంది. మూలంలో లేని ‘ఇప్పుడు’ వంటి కాలసూచకాన్ని చేర్చలేదు.
- source_word: הַמַּלְקוֹחַ
  choice: దోపుడుసొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్నదాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: יֶתֶר הַבָּז
  choice: కొల్లసొమ్ములో మిగిలినది
  rationale: יֶתֶר యొక్క ‘మిగులు/శేషం’ భావాన్ని, הַבָּז యొక్క యుద్ధ కొల్ల భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: దోచుకున్న
  rationale: בזז క్రియలోని యుద్ధదోపిడి భావాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: עַם הַצָּבָא
  choice: సైన్యంలోని ప్రజలు
  rationale: ‘సైన్యపు ప్రజలు’ అనే మూల నిర్మాణానికి దగ్గరగా ఉండి, తెలుగులో అర్థమయ్యే విధంగా ఉంది; దాన్ని కేవలం ‘సైనికులు’గా సంకుచితం చేయలేదు.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: ఈ పశుగణన సందర్భంలో సహజమైన ప్రత్యక్ష సమానం.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 675,000
  rationale: మూల సంఖ్య 600,000 + 70,000 + 5,000ను యథాతథంగా, జాబితాలో సులభంగా చదివే అంకెల రూపంలో ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూలోని దగ్గర అర్థాల రెండు కొల్ల పదాలను ‘దోపుడుసొమ్ము/కొల్లసొమ్ము’గా వేరు చేసి చూపించాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
