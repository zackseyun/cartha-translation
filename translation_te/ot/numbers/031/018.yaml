review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative continuation, the female child referent, the sexual euphemism, and the imperative to preserve them alive. However, “పురుషునితో శయనించడం ఎరుగని” can mean ‘who does not know how to lie with a man,’ rather than the Hebrew sense of not having known a man’s bed sexually. Recasting the object as “శయనాన్ని” better represents the Hebrew idiom without making the main text needlessly explicit.
  naturalness: The proposed revision is grammatical, dignified modern standard Telugu, and retains an appropriately euphemistic register. “స్త్రీలలోని ప్రతి బాలికను” also makes the partitive relationship smoother.
  terminology: “బాలిక” appropriately reflects the contextually female referent of טַף. “సజీవంగా ఉంచండి” accurately renders the Hiphil imperative. The footnote gives a clear contemporary explanation while the main text preserves the source’s indirect expression.
  issues:
  - severity: medium
    issue: The phrase “పురుషునితో శయనించడం ఎరుగని” uses an infinitive after “ఎరుగని.”
    rationale: This construction may be understood as lacking knowledge or ability to perform the action, whereas the Hebrew ידע plus מִשְׁכַּב denotes lack of sexual experience. “పురుషునితో శయనాన్ని ఎరుగని” more closely retains the source idiom’s object and intended sense.
  revised_text: అయితే స్త్రీలలోని పురుషునితో శయనాన్ని ఎరుగని ప్రతి బాలికను మీ కోసం సజీవంగా ఉంచండి.[a]
  revised_footnotes:
