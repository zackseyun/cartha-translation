source:
  edition: WLC
  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: te
  text: అయితే స్త్రీలలోని పురుషునితో శయనాన్ని ఎరుగని ప్రతి బాలికను మీ కోసం సజీవంగా ఉంచండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత స్పష్టంగా: “పురుషునితో లైంగిక సంబంధాలు కలిగి ఉండని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: అయితే ... ప్రతి
  rationale: ముందటి ఆజ్ఞలకు భిన్నంగా ఇప్పుడు ఎవరిని సజీవంగా ఉంచాలో చెప్పే వ్యతిరేక భావాన్ని וְ ఇక్కడ కలిగిస్తుంది; ఏకవచన సమూహవాచకంతో כֹל ను ‘ప్రతి’గా సహజంగా వ్యక్తం చేశాం.
- source_word: הַטַּף בַּנָּשִׁים
  choice: స్త్రీలలో ... ప్రతి బాలికను
  rationale: טַף సాధారణంగా చిన్నపిల్లలను సూచించినా, בַּנָּשִׁים అనే సమూహ నిర్దేశం మరియు తరువాతి లైంగిక అనుభవ వివరణ వల్ల ఇక్కడ ఆడపిల్లలే ఉద్దేశించబడ్డారు. ‘బాలిక’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైనది.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: ఎరుగని
  rationale: ידע ఇక్కడ లైంగిక సంబంధానికి వాడిన హీబ్రూ సభ్యోక్తి. ‘ఎరుగని’ ఆ సభ్యోక్తి స్వభావాన్ని నిలుపుతుంది.
- source_word: מִשְׁכַּב זָכָר
  choice: పురుషునితో శయనించడం
  rationale: ఈ పదబంధం పురుషునితో లైంగిక శయనాన్ని సూచిస్తుంది. ‘శయనించడం’ మూలంలోని పడక/శయన రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంటుంది.
- source_word: הַחֲיוּ לָכֶם
  choice: మీ కోసం సజీవంగా ఉంచండి
  rationale: חיה హిఫీల్ ఆజ్ఞారూపం ‘సజీవంగా ఉంచండి’ అనే అర్థాన్ని ఇస్తుంది; לָכֶם ను ‘మీ కోసం’గా ఉంచి, దాని ప్రయోజనార్థక భావాన్ని మూలం చెప్పిన దానికంటే ఎక్కువగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: లైంగిక సభ్యోక్తిని ప్రధాన వాక్యంలో ఎంత స్పష్టంగా చెప్పాలి
  choice: ‘పురుషునితో శయనించడం ఎరుగని’ అని మూలంలోని తెలుసుకోవడం/శయనం అనే సభ్యోక్తి లక్షణాలను నిలుపడం.
  alternative: ‘పురుషునితో లైంగిక సంబంధం పెట్టుకోని’ లేదా ‘కన్యగా ఉన్న’.
  rationale: హీబ్రూ ‘కన్య’ అనే సాంకేతిక నామాన్ని వాడకుండా లైంగిక అనుభవాన్ని సభ్యోక్తిగా చెబుతుంది. ప్రధాన పాఠం ఆ రూపాన్ని నిలుపుతుంది; స్పష్టమైన భావాన్ని పాదసూచికలో ఇస్తుంది.
- issue: טַף లోని స్త్రీలింగ సూచనను స్పష్టపరచడం
  choice: ‘బాలిక’ అని అనువదించడం.
  alternative: ‘పిల్ల’ లేదా ‘చిన్నపిల్ల’.
  rationale: పదం స్వతంత్రంగా లింగనిరపేక్ష సమూహాన్ని సూచించగలిగినా, ఇక్కడి తక్షణ సందర్భం ఆడపిల్లలకే పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శయనించడం ఎరుగని’ అనే సభ్యోక్తి మూలంలోని ఉద్దేశపూర్వక పరోక్షతను నిలుపుతుంది; [a] పాదసూచిక సమకాలీన స్పష్టీకరణను అందిస్తుంది.
