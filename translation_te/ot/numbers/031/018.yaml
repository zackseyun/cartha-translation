- from: అయితే స్త్రీలలో పురుషునితో శయనించడం ఎరుగని ప్రతి బాలికను మీ కోసం సజీవంగా ఉంచండి.[a]
  to: అయితే స్త్రీలలోని పురుషునితో శయనాన్ని ఎరుగని ప్రతి బాలికను మీ కోసం సజీవంగా ఉంచండి.[a]
  rationale: The revision corrects a Telugu grammatical-semantic ambiguity in the sexual euphemism. It preserves the Hebrew’s indirect ‘know the bed/lying of a male’ formulation in the main text, retains the contextual identification of the children as female, and keeps the explicit contemporary alternative in the anchored footnote.
