  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ אָדָ֔ם מִן הַ֨/נָּשִׁ֔ים אֲשֶׁ֥ר לֹֽא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר כָּל נֶ֕פֶשׁ שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: te
  text: పురుషునితో లైంగిక సంబంధం కలిగి ఉండని[a] స్త్రీలు, మొత్తం ముప్పై రెండు వేల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో, “పురుషుని పడకను ఎరుగని” అని ఉంది. ఇది పురుషునితో లైంగిక సంబంధం కలిగి ఉండలేదని తెలిపే నానుడి.
    reason: మూల హీబ్రూ నానుడి యొక్క సాహిత్య రూపాన్ని భద్రపరుస్తూ, దాని ఉద్దేశించిన అర్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: మంది
  rationale: చుట్టుపక్కల ఉన్న పశువుల లెక్కకు భిన్నంగా ఇది మనుషుల సంఖ్యను సూచిస్తుంది. తెలుగులో సంఖ్యతో కూడిన ‘మంది’ సహజంగా వ్యక్తులనే తెలియజేస్తుంది.
- source_word: מִן הַנָּשִׁים
  choice: స్త్రీలు
  rationale: యుద్ధంలో పట్టుకున్నవారిలో లెక్కించబడిన స్త్రీల వర్గాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘స్త్రీలు మొత్తం’ అని చెప్పడం సహజం.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: పురుషునితో లైంగిక సంబంధం పెట్టుకోని
  rationale: మూలంలోని ‘పురుషుని పడకను ఎరుగని’ అనే హీబ్రూ నానుడి భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది; మూల నానుడిని పాదటిప్పణిలో ఉంచింది.
- source_word: כָּל נֶפֶשׁ
  choice: మొత్తం
  rationale: ఈ పదబంధం ఆ వర్గంలోని వ్యక్తుల మొత్తం సంఖ్యను తిరిగి సమీకరించి చెబుతుంది.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: ముప్పై రెండు వేల మంది
  rationale: హీబ్రూ సంఖ్యకు ప్రామాణిక తెలుగు రూపం; మనుషుల లెక్కకు సహజమైన ‘మంది’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన లెక్కింపు వాక్యంగా అనువదించబడింది. ప్రధాన పాఠంలో నానుడి భావాన్ని స్పష్టంగా ఇచ్చి, మూలంలోని రూపాన్ని పాదటిప్పణిలో భద్రపరిచింది.
