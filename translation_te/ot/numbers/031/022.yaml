  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: te
  text: కేవలం బంగారం, వెండి, కంచు[a], ఇనుము, తగరం, సీసం—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాగి.’ హీబ్రూ పదం రాగినిగానీ, విస్తృతార్థంలో రాగి-ఆధారిత లోహాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి సూచనలకు భిన్నంగా, ఇప్పుడు లోహాల విషయంలో వర్తించే నియమాన్ని ప్రవేశపెడుతోంది. తెలుగు వాక్యప్రవాహంలో ‘అయితే’ ఈ మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: הַזָּהָב
  choice: బంగారం
  rationale: ఈ సందర్భంలో లోహమైన బంగారాన్ని సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: הַכָּסֶף
  choice: వెండి
  rationale: ఇది ధనం కాదు; శుద్ధి చేయవలసిన లోహాల జాబితాలో ఉన్నందున ‘వెండి’ సరైన అర్థం.
- source_word: הַנְּחֹשֶׁת
  choice: కంచు
  rationale: హీబ్రూ పదం రాగిని లేదా రాగి మిశ్రమమైన కంచును సూచించగలదు. ప్రాచీన లోహాల జాబితాలో సహజమైన సంప్రదాయ పదంగా ‘కంచు’ను ఎంచుకున్నాం; ‘రాగి’ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַבַּרְזֶל
  choice: ఇనుము
  rationale: בַּרְזֶל అనే లోహానికి సాధారణ, స్పష్టమైన తెలుగు సమానం.
- source_word: הַבְּדִיל
  choice: తగరం
  rationale: లోహాల జాబితాలో ఈ హీబ్రూ పదం సాధారణంగా tin‌ను సూచిస్తుంది; దానికి ప్రామాణిక తెలుగు పదం ‘తగరం’.
- source_word: הָעֹפָרֶת
  choice: సీసం
  rationale: עֹפָרֶת అనే లోహానికి సాధారణ తెలుగు సమానం.
- source_word: אֵת (repeated)
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: పునరావృతమయ్యే ప్రత్యక్ష కర్మ సూచిక హీబ్రూలో జాబితాను నిర్మించి ప్రతి అంశాన్ని నొక్కి చెబుతుంది; తెలుగులో దాన్ని జాబితా క్రమం, విరామచిహ్నాలతో సహజంగా వ్యక్తపరిచాం.
