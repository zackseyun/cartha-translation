  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: te
  text: పశువులు ముప్పై ఆరు వేలు; వాటిలో యెహోవాకు కేటాయించిన వాటా డెబ్బై రెండు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: పశువులు
  rationale: בָּקָר ఇక్కడ యుద్ధసొమ్ములోని గోవుల జాతికి చెందిన పశువులను సమూహంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘పశువులు’ సహజమైన సామూహిక పదం.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: ముప్పై ఆరు వేలు
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘ఆరు మరియు ముప్పై వేలు’; అర్థాన్ని మార్చకుండా సహజ తెలుగు సంఖ్యాక్రమంలో ఇచ్చాం.
- source_word: מִכְסָם
  choice: వాటిలో ... చెల్లించవలసిన భాగం
  rationale: מֶכֶס అనేది యుద్ధసొమ్ములో నుంచి విధించి వేరుచేసిన వాటాను సూచిస్తుంది. ‘చెల్లించవలసిన భాగం’ పన్ను/సుంకం అనే విస్తృత అర్థాలకన్నా ఈ సందర్భంలోని నిర్దిష్ట వాటాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ ఉపసర్గ అర్పణగా కేటాయించిన గ్రహీతను సూచిస్తుంది; దేవుని ప్రత్యేక నామమైన יהוהను తెలుగులో సంప్రదాయబద్ధంగా, నామరూపంగా ‘యెహోవా’ అని ఇచ్చాం.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: డెబ్బై రెండు
  rationale: హీబ్రూ అక్షరార్థ క్రమం ‘రెండు మరియు డెబ్బై’; సహజ ఆధునిక తెలుగు సంఖ్యాక్రమాన్ని ఉపయోగించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక చతురక్షర దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన నామరూపం ‘యెహోవా’గా నిలిపాం; ఖచ్చిత ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని ‘యాహ్వే’ రూపంతో ఏకపక్షంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లెక్కల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. ‘వాటిలో’ అనే పదం పశువుల మొత్తం సంఖ్యలోనుంచి నిర్దిష్ట వాటా కేటాయించబడిందని సహజంగా స్పష్టం చేస్తుంది.
