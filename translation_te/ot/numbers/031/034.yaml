lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: గాడిదలు
  rationale: חֲמֹרִים అనేది ‘గాడిదలు’ అనే సాధారణ బహువచన నామవాచకం. ముందున్న జాబితాను కొనసాగించే וַ־ను తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని ఉంచకుండా, జాబితా కొనసాగింపుగా సహజంగా వ్యక్తం చేశాం.
- source_word: אֶחָד וְ/שִׁשִּׁים אָלֶף
  choice: 61,000
  rationale: హీబ్రూ సంఖ్యా నిర్మాణం అక్షరార్థంగా ‘ఒకటి మరియు అరవై వేల’ అని ఉండి, 61,000ను సూచిస్తుంది. లెక్కల జాబితాలో అంకెల రూపం స్పష్టంగా, సహజంగా ఉంటుంది.
