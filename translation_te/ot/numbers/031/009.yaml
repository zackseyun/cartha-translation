id: NUM.31.9
reference: Numbers 31:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు మిద్యాను స్త్రీలను, వారి చిన్నపిల్లలను బందీలుగా పట్టుకున్నారు; వారి పశువులన్నిటినీ, మందలన్నిటినీ, సంపదంతటినీ దోచుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: బందీలుగా పట్టుకున్నారు
  rationale: שׁבה అనే క్రియ ఇక్కడ మనుష్యులను యుద్ధబందీలుగా పట్టుకోవడాన్ని సూచిస్తుంది; సాధారణంగా స్వాధీనం చేసుకోవడం అనే భావం కాదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ బְּנֵי + వ్యక్తినామం అనే రూపాన్ని తెలుగులో చదవదగిన విధంగా నేరుగా నిలుపుతుంది.
- source_word: נְשֵׁי מִדְיָן
  choice: మిద్యాను స్త్రీలను
  rationale: נָשִׁים ఇక్కడ కేవలం భార్యలను కాక, స్త్రీలను విస్తృతంగా సూచిస్తుంది.
- source_word: טַפָּם
  choice: వారి చిన్నపిల్లలను
  rationale: טַף సాధారణంగా చిన్న వయసు పిల్లలను సూచిస్తుంది; ఈ వయోసూచక భావాన్ని నిలుపుతుంది.
- source_word: בְּהֶמְתָּם
  choice: వారి పశువులన్నిటినీ
  rationale: בְּהֵמָה సమూహార్థంలో పెంపుడు జంతువులను సూచిస్తుంది; 'పశువులు' సహజమైన తెలుగు సమానార్థకం.
- source_word: מִקְנֵהֶם
  choice: మందలన్నిటినీ
  rationale: מִקְנֶה పశుసంపదను, ముఖ్యంగా మందలను సూచించగలదు; ముందున్న בְּהֵמָהతో ఉన్న స్వల్ప భేదాన్ని ఇది నిలుపుతుంది.
- source_word: חֵילָם
  choice: సంపదంతటినీ
  rationale: חַיִל ఈ యుద్ధానంతర ఆస్తుల జాబితాలో సైన్యంకన్నా భౌతిక సంపద లేదా వనరులను సూచిస్తుంది.
- source_word: בָּזָזוּ
  choice: దోచుకున్నారు
  rationale: בזז యుద్ధవిజయం తరువాత కొల్లసొమ్ముగా తీసుకోవడాన్ని సూచిస్తుంది; 'దోచుకున్నారు' ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: జాతి-ఒడంబడిక సంబంధాన్ని తెలిపే בְנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: సిద్ధాంతపరమైన తేడా లేకపోయినా, మూలంలోని పుంలింగ బహువచన కుటుంబరూపకాన్ని చదవదగిన తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన వాక్యనిర్మాణం. మూలంలోని రెండు ప్రధాన క్రియలను అర్ధవిరామంతో అనుసంధానించి, వ్యక్తులు మరియు ఆస్తుల మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచింది. ప్రచురణ పాఠ్యంలో పాదటిప్పణులు అవసరం లేదు.
