    issue: “అగ్నిలో వేయకూడని” అనే పదబంధం
    rationale: ఇది 'వేయరాదు' అనే నియమం లేదా నిషేధాన్ని సూచించవచ్చు. మూలపాఠం అగ్ని ప్రక్రియకు వెళ్లలేని/అనువుకాని వస్తువులను సూచించే సందర్భోచిత సామర్థ్య భావాన్ని కలిగివుంది.
