id: NUM.31.23
reference: Numbers 31:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: te
  text: అగ్నిలో వేయదగిన ప్రతి వస్తువును మీరు అగ్ని గుండా దాటించాలి; అప్పుడు అది శుద్ధమవుతుంది. అయితే, అపవిత్రతను తొలగించే నీటితో[a] కూడా దానిని శుద్ధి చేయాలి. అగ్నిలో వేయలేని ప్రతి వస్తువును మీరు నీటి గుండా దాటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపవిత్రత కొరకు నీటితో”; సంప్రదాయ అనువాదం, “వేరుచేయు నీటితో” (సంఖ్యాకాండము 19 చూడండి).
    reason: נִדָּה అనే పదం అపవిత్రతను, వేరుచేయబడిన స్థితిని సూచించగలదు; ఇక్కడ అది ఆచార శుద్ధికి ఉపయోగించే ప్రత్యేక నీటితో సంబంధించింది.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: ప్రతి వస్తువునూ
  rationale: సందర్భంలో యుద్ధంలో తీసుకున్న ఒక్కో వస్తువును సమగ్రంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన concrete expression.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: అగ్నిలో వేయదగిన
  rationale: అక్షరార్థంగా అగ్నిలో ప్రవేశించడాన్ని సూచించినా, సందర్భంలో అగ్ని ద్వారా శుద్ధి చేయడానికి అనువైన వస్తువులనే ఉద్దేశిస్తుంది.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: మీరు అగ్నిగుండా పోనివ్వాలి
  rationale: עבר హిఫీల్ రూపంలోని ‘గుండా పోయేలా చేయడం’ అనే causative భావాన్ని, ఆచార చర్యను నిలుపుతుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు అది శుద్ధమవుతుంది
  rationale: అగ్ని ప్రక్రియ ఫలితంగా వస్తువు శుద్ధ స్థితికి చేరడాన్ని తెలియజేస్తుంది.
- source_word: אַךְ
  choice: అయితే ... కూడా
  rationale: అగ్ని ద్వారా శుద్ధమైనప్పటికీ ప్రత్యేక నీటి శుద్ధి కూడా అవసరమనే qualificationను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמֵי נִדָּה
  choice: అపవిత్రతను తొలగించే నీటితో
  rationale: సంఖ్యాకాండము 19లోని ఆచారపరమైన అపవిత్రత తొలగింపు కోసం ఉపయోగించే ప్రత్యేక నీటిని స్పష్టంగా సూచిస్తుంది; హెబ్రీ నిర్మాణంలోని ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
- source_word: יִתְחַטָּא
  choice: దానిని శుద్ధి చేయాలి
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలో ఇది నైతిక పాపక్షమాపణను కాక, వస్తువు ఆచారపరమైన అపవిత్రత నుండి శుద్ధి పొందడాన్ని సూచిస్తుంది.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: అగ్నిలో వేయకూడని ప్రతి వస్తువునూ
  rationale: అగ్ని ప్రక్రియకు అనువుకాని వస్తువులతో ఉన్న ఆచరణాత్మక వ్యత్యాసాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: మీరు నీటిగుండా పోనివ్వాలి
  rationale: అగ్ని వాక్యభాగంలో ఉన్న అదే causative క్రియకు సమాంతరతను నిలుపుతుంది; కేవలం ‘కడగాలి’ అని సంకుచితం చేయదు.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలోని శుద్ధీకరణ భాష స్వభావం
  choice: ఆచారపరమైన శుద్ధి–అపవిత్రత భాషగా అనువదించడం
  alternative: חטא మూలాన్ని పాపం లేదా నైతిక శుద్ధి భాషలో అనువదించడం
  rationale: సంఖ్యాకాండము 31 మరియు దానికి నేపథ్యమైన 19వ అధ్యాయంలో వస్తువులకు సంబంధించిన ఆచారపరమైన అపవిత్రతే విషయం; నైతిక అపరాధానికి క్షమాపణ కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర వచనానికి తగిన గౌరవప్రదమైన శైలి. అగ్ని–నీటి వాక్యభాగాల సమాంతర నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
