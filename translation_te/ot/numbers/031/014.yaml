translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి. ‘సహస్రాధిపతులు’, ‘శతాధిపతులు’ అనే స్థిర బైబిలు-సైనిక పదాలు హీబ్రూ దళవ్యవస్థను కాపాడుతాయి. ప్రధాన పాఠ్యంలో ‘అంటే’ ద్వారా సైన్యాధికారులు తరువాతి రెండు హోదాలతో వివరణ పొందుతున్నారని సహజంగా చూపించబడింది; వాక్యనిర్మాణ అస్పష్టతను పాదసూచికలో నిలిపాం.
