id: NUM.31.14
reference: Numbers 31:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: te
  text: మోషే యుద్ధసేవ నుండి వస్తున్న సైన్యాధికారులపై—సహస్రాధిపతులపై, శతాధిపతులపై—కోపగించుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధసేవ నుండి వచ్చిన సైన్యాధికారులపై—సహస్రాధిపతులపై, శతాధిపతులపై—మోషే కోపగించుకున్నాడు.” హీబ్రూలో ‘వస్తున్న’ అనే పదం ‘సైన్యాధికారులు’ అనే పదానికే నేరుగా సంబంధించినదా, లేక తరువాత పేర్కొన్న సహస్రాధిపతులు, శతాధిపతులకు సంబంధించినదా అనేది వ్యాకరణపరంగా కొంత అస్పష్టంగా ఉంది.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: కోపగించుకున్నాడు
  rationale: קצף కోపాన్ని సూచిస్తుంది. ‘కోపగించుకున్నాడు’ అనేది సహజమైన ఆధునిక తెలుగు; ‘మండిపడ్డాడు’ వంటి పదాలతో తీవ్రతను అనవసరంగా పెంచదు.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: సైన్యాధికారులు
  rationale: פקד మూలం నుండి వచ్చిన ఈ పదబంధం సైనిక దళంలో నియమించబడిన అధికారులను సూచిస్తుంది. ‘సైన్యాధికారులు’ పరిపాలనా, సైనిక భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: సహస్రాధిపతులు
  rationale: సైనిక వ్యవస్థలో వెయ్యిమందికి నాయకులనే హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది; బైబిలు సందర్భంలో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: శతాధిపతులు
  rationale: ముందటి పదబంధానికి సమాంతరంగా, వందమందికి నాయకులనే సైనిక హోదాను నిలుపుతుంది.
- source_word: הַבָּאִים
  choice: వస్తున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా వర్ణనాత్మక చర్యను ప్రతిబింబిస్తుంది; ‘తిరిగి వస్తున్న’ అని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: యుద్ధసేవ నుండి
  rationale: צָבָא లోని సైనిక దళం/సేవ అనే భావవిస్తృతిలో, ఈ సందర్భంలో ‘యుద్ధసేవ’ సహజంగా ఉంటుంది; హీబ్రూ పదబంధంలోని సైనిక సేవ మరియు యుద్ధం అనే రెండు భావాలను కాపాడుతుంది.
