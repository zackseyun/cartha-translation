source:
  edition: WLC
  text: וַ/יָּבִ֡אוּ אֶל מֹשֶׁה֩ וְ/אֶל אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/אֶל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הַ/שְּׁבִ֧י וְ/אֶת הַ/מַּלְק֛וֹחַ וְ/אֶת הַ/שָּׁלָ֖ל אֶל הַֽ/מַּחֲנֶ֑ה אֶל עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל יַרְדֵּ֥ן יְרֵחֽוֹ־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: te
  text: వారు బందీలను, పట్టుబడిన సొత్తును[a], దోపుడు సొత్తును మోషే వద్దకు, యాజకుడైన ఎలియాజరు వద్దకు, ఇశ్రాయేలీయుల సమాజం వద్దకు, యెరికో వద్ద[c] యొర్దాను నది పక్కన ఉన్న మోయాబు మైదానాల్లోని[b] శిబిరానికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పట్టుబడిన సొత్తు’ అనే పదం పశువులు లేదా ఇతర చరాస్తిని సూచించవచ్చు.
    reason: lexical_scope
  - marker: b
    text: లేదా ‘మోయాబు బయళ్లలోని.’
    reason: lexical_alternative
  - marker: c
    text: ‘యెరికో వద్ద యొర్దాను నది పక్కన ఉన్న’ అనే పాదాన్ని ‘యెరికోకు ఎదురుగా యొర్దాను నది వద్ద ఉన్న’ అని కూడా అనువదించవచ్చు.
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: తీసుకొచ్చారు
  rationale: בוא క్రియ హిఫిల్ రూపంలో ఇక్కడ తరువాత వచ్చే ప్రత్యక్ష కర్మల కారణంగా ‘తీసుకురావడం’ అనే causative భావాన్ని ఇస్తుంది.
- source_word: הַשְּׁבִי
  choice: బందీలను
  rationale: యుద్ధ సందర్భంలో ఇది బందీలుగా పట్టుకొన్న వ్యక్తులను సూచిస్తుంది; అమూర్తమైన ‘చెర’ను కాదు.
- source_word: הַמַּלְקוֹחַ
  choice: పట్టుకొన్న సొత్తును
  rationale: పట్టుబడిన చరాస్తి లేదా పశువులు మొదలైన వాటిని సూచించే ఈ పదాన్ని తరువాతి שׁלל నుండి వేరుగా ఉంచేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: הַשָּׁלָל
  choice: దోపుడు సొత్తును
  rationale: యుద్ధంలో దోచుకొన్న సొత్తుకు వాడే సాధారణ పదం; మלקוחతో ఉన్న సమీపార్థకమైనా వేరు పదాన్ని తెలుగులో కూడా వేరుగా చూపుతుంది.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల సమాజం
  rationale: ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేలా సమూహంగా కూడిన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: עַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాలు
  rationale: భౌగోళిక పదబంధానికి సాధారణ పాఠకులకు స్పష్టమైన రూపం; ‘బయళ్లు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: యెరికో దగ్గర యొర్దాను నది పక్కన ఉన్న
  rationale: యొర్దాను నదికి, యెరికోకు సంబంధించి ఆ ప్రదేశాన్ని సహజ తెలుగులో గుర్తిస్తుంది; ‘యెరికోకు ఎదురుగా’ అనే భౌగోళిక వివరణ కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, గమ్యస్థానం మరియు మూడు రకాల యుద్ధసంపాదనల క్రమం నిలుపబడింది.
