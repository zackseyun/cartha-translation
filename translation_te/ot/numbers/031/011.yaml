  text: వారు దోపిడిసొత్తంతటినీ, పట్టుబడిన మనుషులనూ పశువులనూ అన్నిటినీ తీసుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: దోచుకున్న వస్తువులు
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מַלְקוֹחַ
  choice: పట్టుకున్న మనుషులూ పశువులూ
  rationale: ఈ పదం పట్టుబడిన సజీవులను సూచిస్తుంది; వెంట వచ్చే בָּאָדָם וּבַבְּהֵמָה దాని పరిధిని మనుషులు మరియు పశువులుగా స్పష్టం చేస్తుంది.
- source_word: לָקַח
  choice: తీసుకువెళ్లారు
  rationale: సందర్భంలో కేవలం చేతబట్టుకోవడం కాక, యుద్ధంలో స్వాధీనం చేసుకున్న వాటిని వెంట తీసుకుపోవడం భావం ఉంది.
