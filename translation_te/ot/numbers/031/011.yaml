translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. ‘మనుషులు’ అనే పదం మూలంలోని సామూహిక ఏకవచనమైన אָדָםను సహజ తెలుగు బహువచనంగా వ్యక్తపరుస్తుంది; మూలంలోని వస్తువులు–సజీవులు అనే భేదం నిలుపబడింది.
