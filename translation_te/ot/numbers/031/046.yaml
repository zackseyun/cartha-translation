translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లెక్కింపు శైలి. ‘ఆత్మలు’ అనే పదం కలిగించగల శరీరరహిత ఆత్మల భావాన్ని నివారించి, సందర్భంలోని మానవ వ్యక్తుల లెక్కను స్పష్టంగా తెలిపింది.
