  source_fidelity: 'The Telugu accurately represents the Hebrew sequence: washing the addressees’ clothes on the seventh day, attaining ritual cleanness, and subsequent entry into the camp. “ఉతుక్కొని” idiomatically connects the instructed washing with its resultant ritual status without materially changing the coordinated Hebrew clauses. “ప్రవేశించవచ్చు” appropriately conveys the contextual permission associated with reentry, while the footnote preserves the more formally future-like alternative.'
