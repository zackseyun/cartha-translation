  terminology: “శుద్ధులవుతారు” properly conveys ritual cleanness rather than moral purity, and the explanatory footnote explicitly identifies the ritual sense. “శిబిరం” is the natural established term for the Israelite camp. Footnote markers are correctly anchored in the text and correspond to the supplied notes.
