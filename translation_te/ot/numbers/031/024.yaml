id: NUM.31.24
reference: Numbers 31:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: te
  text: ఏడవ రోజున మీరు మీ బట్టలు ఉతుక్కొని, శుద్ధులవుతారు[a]. ఆ తర్వాత మీరు శిబిరంలోకి ప్రవేశించవచ్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుభ్రులవుతారు.” ఇక్కడ హెబ్రీ పదం నిర్దేశించిన ఉతుకుడు తర్వాత ఆచారపరంగా శుద్ధస్థితికి చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శిబిరంలోకి ప్రవేశిస్తారు.” సందర్భంలో శుద్ధి పూర్తయిన తర్వాత తిరిగి ప్రవేశించేందుకు అనుమతి ఉందనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: మీరు ... ఉతుక్కొని
  rationale: כּבס పియేల్ రూపం బట్టలను ఉతకడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో తరువాతి ఫలితంతో సహజంగా అనుసంధానించేందుకు ‘ఉతుక్కొని’ వాడబడింది; ఆజ్ఞాత్మక భావం సందర్భంలో నిలుస్తుంది.
- source_word: בִּגְדֵיכֶם
  choice: మీ బట్టలు
  rationale: בגד అంటే వస్త్రాలు లేదా దుస్తులు. ‘బట్టలు’ సాధారణ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: హెబ్రీ కాలసూచక పదబంధానికి సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: וּטְהַרְתֶּם
  choice: శుద్ధులవుతారు
  rationale: טהר యొక్క ఖాల్ రూపం ఇక్కడ ఆచారపరమైన శుద్ధస్థితికి చేరడాన్ని ఫలితార్థకంగా సూచిస్తుంది. ‘శుద్ధులవుతారు’ ఆ స్థితి మార్పును చూపుతుంది; స్వయంగా శుద్ధి చేసుకోవడం లేదా నైతిక శుద్ధిని అనవసరంగా చేర్చదు.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: శుద్ధి పూర్తయిన తరువాత జరిగే తదుపరి చర్యను సూచించే సహజ తెలుగు క్రమసూచకం.
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: మీరు శిబిరంలోకి ప్రవేశించవచ్చు
  rationale: בוא אל అంటే లోనికి రావడం లేదా ప్రవేశించడం. శుద్ధి అనంతరం శిబిరంలో తిరిగి ప్రవేశించేందుకు అనుమతి లభిస్తుందనే సందర్భార్థాన్ని ‘ప్రవేశించవచ్చు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధి భాష
  choice: ‘శుద్ధులవుతారు’ అని అనువదించడం
  alternative: ‘మిమ్మల్ని శుద్ధి చేసుకుంటారు’ లేదా ‘శుభ్రులవుతారు’
  rationale: ఈ వచనం యుద్ధానంతర ఆచార అపవిత్రత నుండి పునరుద్ధరణను సూచిస్తుంది. ‘శుద్ధులవుతారు’ హెబ్రీలోని ఫలితార్థక/అకర్మక భావాన్ని నిలుపుతుంది; నైతిక లేదా ఆత్మీయ శుద్ధి అనే తరువాతి భావాన్ని బలవంతంగా చేర్చదు.
- issue: శిబిర ప్రవేశం—భవిష్య ప్రకటననా, అనుమతినా
  choice: ‘ప్రవేశించవచ్చు’ అనే అనుమతి భావం
  alternative: ‘ప్రవేశిస్తారు’
  rationale: శుద్ధి పూర్తయిన తరువాత తిరిగి ప్రవేశించే అర్హత లేదా అనుమతి లభిస్తుందనే ఆచారపరమైన సందర్భాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది; హెబ్రీ క్రియారూపం మాత్రమే చూసినప్పుడు సాధ్యమైన సాధారణ భవిష్య భావాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఆచారపరమైన సందర్భాన్ని స్పష్టంగా ఉంచేందుకు ‘శుద్ధులు’ వాడబడింది; ‘శిబిరం’ బైబిలు సందర్భానికి సహజమైన పదం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
