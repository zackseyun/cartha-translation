revisions:
- from: కాబట్టి మోషే, యాజకుడైన ఎలియాజరు వేలమందికి, వందమందికి అధిపతులైన వారి దగ్గర నుంచి ఆ బంగారాన్ని తీసుకొని, ఇశ్రాయేలు కుమారులకు యెహోవా[a] సన్నిధిలో జ్ఞాపకార్థంగా ఉండేలా దాన్ని ప్రత్యక్ష గుడారంలోకి తీసుకొచ్చారు.
  to: అప్పుడు మోషే, యాజకుడైన ఎలియాజరు, వేలమంది మరియు వందమంది దళాల అధిపతుల దగ్గరనుండి ఆ బంగారాన్ని తీసుకొని, దానిని ప్రత్యక్ష గుడారంలోకి తీసుకువచ్చారు; అది ఇశ్రాయేలు కుమారుల కొరకు యాహ్వే సన్నిధిలో జ్ఞాపకార్థంగా ఉండేందుకు.
  rationale: 'The revision aligns the divine name with the stated POB rendering, removes the now-misleading footnote and anchor, clarifies the military commanders, and uses natural modern Telugu while retaining the source’s sequence: taking the gold, bringing it into the tent of meeting, and its function as a memorial for the sons of Israel before Yahweh.'
