id: NUM.31.54
reference: Numbers 31:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶת הַ/זָּהָ֔ב מֵ/אֵ֛ת שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/הַ/מֵּא֑וֹת וַ/יָּבִ֤אוּ אֹת/וֹ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד זִכָּר֥וֹן לִ/בְנֵֽי יִשְׂרָאֵ֖ל לִ/פְנֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: te
  text: అప్పుడు మోషే, యాజకుడైన ఎలియాజరు, వేలమంది మరియు వందమంది దళాల అధిపతుల దగ్గరనుండి ఆ బంగారాన్ని తీసుకొని, దానిని ప్రత్యక్ష గుడారంలోకి తీసుకువచ్చారు; అది ఇశ్రాయేలు కుమారుల కొరకు యాహ్వే సన్నిధిలో జ్ఞాపకార్థంగా ఉండేందుకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది; కథన సందర్భంలో సహజంగా ఉండే ఈ రూపం మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: הַזָּהָב
  choice: ఆ బంగారాన్ని
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉంది; ముందటి సందర్భంలో పేర్కొన్న నిర్దిష్ట బంగారాన్ని ‘ఆ బంగారం’ సూచిస్తుంది.
- source_word: מֵאֵת
  choice: వారి దగ్గర నుంచి
  rationale: ఇది మూలాన్ని లేదా ఎవరి వద్దనుంచి తీసుకున్నారో సూచిస్తుంది; ఆధునిక తెలుగులో ‘దగ్గర నుంచి’ సహజంగా ఉంటుంది.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: వేలమందికి, వందమందికి అధిపతులైన వారు
  rationale: సైనిక సందర్భంలో שׂרים నాయకులను లేదా అధికారులను సూచిస్తుంది. ‘అధిపతులు’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పదం; సంఖ్యాపదాలు సైనిక విభాగాలను సూచిస్తాయి.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు ఆరాధనా గుడారానికి తెలుగులో స్థిరంగా పరిచయమైన పదబంధం; దేవుడు తన ప్రజలను కలుసుకునే స్థలమనే భావాన్ని తెలియజేస్తుంది.
- source_word: זִכָּרוֹן
  choice: జ్ఞాపకార్థంగా
  rationale: ఈ నామవాచకం జ్ఞాపకంగా నిలిచే అర్పణ లేదా గుర్తును సూచిస్తుంది; ‘జ్ఞాపకార్థంగా’ ఆ ఆరాధనా భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని בני అనే పుంలింగ బహువచన రూపాన్ని, దాని ఒడంబడిక సంబంధిత సంప్రదాయ ప్రయోగాన్ని సూటిగా నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో ‘ముందు’ అనే స్థూల అనువాదం కంటే ‘సన్నిధిలో’ ఆధునిక తెలుగులో సహజంగా ఉండి, దేవుని సమక్షమనే భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణను వాడటం మూల భేదాన్ని నిలుపుతుంది; ఉచ్చారణకు సంబంధించిన ప్రత్యామ్నాయాన్ని పాదటీపులో తెలిపింది.
- issue: בני ישראל అనే ఒడంబడిక సంబంధిత పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ రూపంలోని పుంలింగ కుటుంబ-వంశ సంబంధిత భాషను చెరపకుండా నిలుపుతూ, అది సంప్రదాయ సామూహిక గుర్తింపుగా పనిచేస్తుందనే అంశాన్ని గౌరవిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని రెండు క్రియలకు బహువచన కర్తను తెలుగులో స్పష్టంగా అనుసంధానించాం. ‘ఇశ్రాయేలు కుమారులు’ అనే సూటి ఒడంబడిక పదబంధం నిలుపబడింది; ‘ప్రత్యక్ష గుడారం’ తెలుగు బైబిలు పాఠకులకు పరిచితమైన ఆరాధనా పదజాలం.
