  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే వారు మిద్యానుపై యుద్ధం చేశారు[a]; ప్రతి మగ వ్యక్తినీ చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిద్యానుతో పోరాడారు.’ ఇక్కడి హీబ్రూ క్రియ సైనిక సేవలో పాల్గొనడం లేదా యుద్ధం చేయడం అనే అర్థాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: యుద్ధం చేశారు
  rationale: צבא క్రియారూపం ఇక్కడ సైనిక చర్యలో పాల్గొనడం లేదా యుద్ధం చేయడం అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘యుద్ధం చేశారు’ ఆ సైనిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל מִדְיָן
  choice: మిద్యానీయుల మీద
  rationale: సైనిక చర్యను తెలిపే క్రియతో עַל శత్రుత్వ దిశను సూచిస్తుంది. ఇక్కడ מִדְיָן కేవలం ప్రదేశం కంటే దాని ప్రజలను సూచించే సమూహనామంగా పనిచేస్తుంది; అందువల్ల ‘మిద్యానీయుల మీద’ సహజంగా ఉంటుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టే
  rationale: ఈ పదం దైవ ఆజ్ఞకు సరిగ్గా అనుగుణంగా చర్య జరిగినదని సూచిస్తుంది. ‘అట్టే’ ఆ correspondence భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఈ క్రియ ముందుగా ఇచ్చిన ఆజ్ఞను సూచిస్తుంది. తెలుగు ఉపవాక్య నిర్మాణంలో ‘ఆజ్ఞాపించినట్టే’ కాలక్రమాన్ని సహజంగానే తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: אֶת మోషేను ‘ఆజ్ఞాపించు’ క్రియకు ప్రత్యక్ష కర్మగా గుర్తిస్తుంది. తెలుగులో ఆజ్ఞను స్వీకరించిన వ్యక్తిని సంప్రదాన విభక్తితో ‘మోషేకు’ అని చెప్పడం సహజం.
- source_word: וַיַּהַרְגוּ
  choice: చంపారు
  rationale: הרג నేరుగా చంపడం అనే అర్థమిస్తుంది. ‘చంపారు’ స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు రూపం.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాణ్ణి
  rationale: כָּל తో ఏకవచన זָכָר కలసి ఒక్కో మగ వ్యక్తినీ మినహాయింపు లేకుండా సూచిస్తుంది. ‘మగవాణ్ణి’ వయోజన పురుషులకు మాత్రమే భావాన్ని అనవసరంగా పరిమితం చేయకుండా లింగాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి ‘ప్రభువు’ వంటి బిరుదుతో దానిని భర్తీ చేయలేదు. తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: זָכָר యొక్క లింగ-ఖచ్చితమైన అనువాదం
  choice: మగవాడు
  alternative: పురుషుడు
  rationale: זָכָר వయోజన పురుషులను మాత్రమే కాక మగ లింగానికి చెందిన వారిని విస్తృతంగా సూచించగలదు. అందువల్ల వయస్సు పరిమితిని చేర్చని ‘మగవాడు’ను ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని సైనిక చర్య, దైవ ఆజ్ఞకు అనుగుణత, זָכָר యొక్క విస్తృత లింగ సూచన నిలుపబడ్డాయి. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
