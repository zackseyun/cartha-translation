base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/025.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే మోషేతో చెప్పాడు:” హీబ్రూలో ఇది తదుపరి వచనంలోని మాటలను పరిచయం చేసే సాధారణ కథన సూత్రప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమబద్ధమైన పురోగతిని సహజంగా తెలియజేస్తుంది; ‘అని చెప్పాడు’ కూడా సాధ్యమే.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణ ‘Yahweh’కు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: ఈ మాటల పరిచయ సూత్రంలో אֶל సంబంధిత వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘మోషేతో’ సహజమైన ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే మాటలను పరిచయం చేసే హీబ్రూ సూచిక. తెలుగులో ‘ఇలా’ అదే కార్యాన్ని సహజంగా నిర్వహిస్తుంది; చివర ఉంచిన ద్విబిందువు మాటలు కొనసాగుతాయని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల వ్యక్తిగత దైవనామం ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ అనేది సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇలా అన్నాడు:’ అనే నిర్మాణం לֵאמֹרను పదానువాదంగా భారంగా చేయకుండా, తదుపరి వచనంలో మాటలు కొనసాగుతాయని స్పష్టంగా తెలియజేస్తుంది.
