  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సరళమైన వచనం. హీబ్రూ వాక్యంలోని ‘సగభాగం—వారి వాటా’ అనే అన్వయాన్ని సహజ తెలుగు పదక్రమంలో నిలిపింది; మతసంప్రదాయ ప్రత్యేక పదజాలాన్ని చేర్చలేదు.
