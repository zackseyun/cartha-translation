source:
  edition: WLC
  text: וַ/תְּהִי֙ הַֽ/מֶּחֱצָ֔ה חֵ֕לֶק הַ/יֹּצְאִ֖ים בַּ/צָּבָ֑א מִסְפַּ֣ר הַ/צֹּ֗אן שְׁלֹשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹשִׁ֣ים אֶ֔לֶף וְ/שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: te
  text: యుద్ధానికి వెళ్లినవారి వాటా అయిన సగభాగంలోని గొర్రెల సంఖ్య 3,37,500 ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: అప్పుడు ... సంఖ్య 3,37,500
  rationale: ఈ సందర్భంలో היה రూపం విభజన ఫలితంగా వచ్చిన మొత్తాన్ని తెలియజేస్తుంది. తెలుగులో సహజమైన సంఖ్యా వాక్య నిర్మాణంతో వ్యక్తీకరించబడింది.
- source_word: הַמֶּחֱצָה חֵלֶק
  choice: వాటా అయిన ఆ సగభాగంలో
  rationale: חֵלֶק అనేది הַמֶּחֱצָהకు అన్వయించి అది ఎవరి సగభాగమో తెలుపుతుంది; ‘వాటా అయిన ఆ సగభాగం’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: సైన్యంగా బయలుదేరినవారి
  rationale: అక్షరార్థంగా ‘సైన్యంలో/సైన్యంగా బయలుదేరినవారు’; యుద్ధంలో పాల్గొనడానికి వెళ్లిన పోరాట యోధులను సూచిస్తుంది. ‘సైన్యంగా బయలుదేరినవారు’ మూలంలోని సైనిక పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: מִסְפַּר הַצֹּאן
  choice: గొర్రెల సంఖ్య
  rationale: లెక్కించబడిన పశువుల మొత్తాన్ని పరిచయం చేసే సరళమైన, మూలానికి దగ్గరైన తెలుగు రూపం.
- source_word: הַצֹּאן
  choice: గొర్రెలు
  rationale: ఈ సందర్భంలోని యుద్ధసొమ్ము జాబితాలో ఈ పదం గొర్రెలను సూచిస్తుంది; ‘గొర్రెలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,37,500
  rationale: హీబ్రూ సంఖ్య 3,00,000 + 30,000 + 7,000 + 500. భారతీయ అంకెల విభజన పద్ధతి ఆధునిక తెలుగు పాఠకులకు సులభంగా చదవదగినది.
