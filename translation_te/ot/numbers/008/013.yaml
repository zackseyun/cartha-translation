source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: te
  text: నీవు లేవీయులను అహరోను ఎదుట, అతని కుమారుల ఎదుట నిలబెట్టి, వారిని యాహ్వేకు ఆచారపూర్వక అల్లాడింపు అర్పణగా సమర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “వారిని యాహ్వేకు అల్లాడించి, అల్లాడింపు అర్పణగా సమర్పించాలి.” హీబ్రూలో ఆచారపూర్వకంగా అల్లాడించి సమర్పించడాన్ని తెలిపే క్రియతో పాటు “అల్లాడింపు అర్పణ” అనే నామవాచకం వాడబడింది.'
    reason: హీబ్రూ క్రియా–నామ పునరుక్తిని, అలాగే వ్యక్తుల విషయంలో ఆచారపరమైన చర్యను సూచించే భావాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: నిలబెట్టి
  rationale: עמד హిఫీల్ రూపం ‘నిలబడేలా చేయడం, ఒక స్థానంలో ఉంచడం’ అనే కారణార్థాన్ని ఇస్తుంది. ఆచార సందర్భంలో ‘నిలబెట్టి’ సహజంగాను స్పష్టంగాను ఉంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందిన సమూహాన్ని సూచించే ప్రామాణిక తెలుగు రూపం; హీబ్రూ నిర్దిష్ట సమూహార్థం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: స్థానపరంగాను, అధికారిక సమర్పణ సందర్భంలోను ‘ముందు/సన్నిధిలో’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ అహరోను కుమారులైన పురుష యాజకులను నిర్దిష్టంగా సూచిస్తుంది; అందువల్ల లింగనిర్దిష్ట అర్థం నిలుపబడింది.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: వారిని ... అల్లాడించే అర్పణగా సమర్పించాలి
  rationale: נוף క్రియ, תְּנוּפָה నామవాచకం కలిసి ఆచారపూర్వకంగా ఊపి/అల్లాడించి సమర్పించే చర్యను సూచిస్తాయి. వ్యక్తులను ‘అల్లాడించాలి’ అని నేరుగా చెప్పడం తెలుగులో అపార్థానికి దారితీయవచ్చు కాబట్టి ప్రధాన పాఠ్యంలో ఆచార సమర్పణ భావం సహజంగా ఇవ్వబడింది; హీబ్రూ పదపునరుక్తి పాదటిప్పణిలో నిలుపబడింది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ సమర్పణ ఎవరికి ఉద్దేశించబడిందో తెలియజేస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ఒడంబడిక నామంగా లిప్యంతరీకరించడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: లేవీయులపై జరిగే ఆచార చర్యను ఎలా వ్యక్తపరచాలి
  choice: అల్లాడించే అర్పణగా సమర్పించాలి
  alternative: వారిని అల్లాడించి, అల్లాడించే అర్పణగా చేయాలి
  rationale: ప్రధాన పాఠ్యం ఆచారపరమైన సమర్పణ భావాన్ని స్పష్టంగా ఇస్తుంది; ప్రత్యామ్నాయంలోని పదశః రూపం హీబ్రూ క్రియా-నామ పునరుక్తిని మరింత స్పష్టంగా చూపుతుంది కానీ మనుషులను భౌతికంగా ఊపారనే అపార్థం కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అల్లాడించే అర్పణ’ అనే ఆచారపదాన్ని నిలిపి, మనుషులను భౌతికంగా ఊపినట్లు వినిపించే అసహజతను ప్రధాన పాఠ్యంలో తగ్గించాం.
