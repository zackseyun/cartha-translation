source:
  edition: WLC
  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: te
  text: లేవీయులు తమను తాము శుద్ధి చేసుకొని, తమ వస్త్రాలను ఉతుక్కున్నారు. అప్పుడు అహరోను వారిని యెహోవా సన్నిధిలో ఊపే అర్పణగా సమర్పించాడు[a]. వారిని శుద్ధిపరచడానికి అహరోను వారి నిమిత్తం ప్రాయశ్చిత్తం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహరోను వారిని యెహోవా సన్నిధిలో ఊపే అర్పణగా ఊపాడు.” ఇక్కడ హీబ్రూలో యెహోవా ఎదుట ఆచారపూర్వకంగా సమర్పించడాన్ని సూచించే స్థిర ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: తమను తాము శుద్ధి చేసుకొని
  rationale: హిత్పయేల్ రూపంలోని ప్రతిఫలార్థాన్ని, యాజకసంబంధమైన శుద్ధీకరణ సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని ‘పాపం నుండి’ అనే మాటను చేర్చదు.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: తమ వస్త్రాలను ఉతుక్కున్నారు
  rationale: בגד అనే పదానికి ఆచార సందర్భానికి తగిన ‘వస్త్రాలు’ వాడబడింది; క్రియ యొక్క సాధారణ అర్థం స్పష్టంగా నిలుస్తుంది.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: ఊపే అర్పణగా సమర్పించాడు
  rationale: నוף–תנופה అనే స్థిర ఆచార ప్రయోగంలోని ‘ఊపడం’ మరియు ‘సమర్పించడం’ రెండింటినీ నిలుపుతూ, లేవీయులనే ప్రత్యక్ష కర్మగా ఉన్న అసాధారణతను అతిశయింపకుండా తెలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దైవనామాన్ని వ్యక్తినామంగా నిలుపుతూ, לפני యొక్క సమక్షత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: వారి నిమిత్తం ప్రాయశ్చిత్తం చేశాడు
  rationale: యాజక ఆచార సందర్భంలోని כפר పదానికి తెలుగు బైబిలు భాషలో అర్థమయ్యే సాంకేతిక పదాన్ని ఉపయోగిస్తుంది; עֲלֵיהֶם ను సహజంగా ‘వారి నిమిత్తం’గా అందిస్తుంది.
- source_word: לְטַהֲרָם
  choice: వారిని పవిత్రపరచడానికి
  rationale: టహర్ యొక్క ఆచారపరమైన శుద్ధి భావాన్ని నిలుపుతుంది; ముందున్న ‘శుద్ధి’తో అనవసర పదపునరుక్తి రాకుండా, ప్రతిష్ఠాపన సందర్భానికి సరిపోయే ‘పవిత్రపరచు’ను ఎంచుకుంది.
theological_decisions:
- issue: חטא/כפר/טהר అనే పరస్పర సంబంధిత ఆచార పదాల భేదం
  choice: ‘తమను తాము శుద్ధి చేసుకొని,’ ‘ప్రాయశ్చిత్తం చేశాడు,’ ‘పవిత్రపరచడానికి’ అని భిన్నంగా అనువదించడం
  alternative: అన్ని చోట్ల ‘శుద్ధి’ పదాన్నే పునరావృతం చేయడం; లేదా మొదటి క్రియలో ‘పాపం నుండి’ అని స్పష్టీకరించడం
  rationale: మూడు క్రియల మధ్యనున్న యాజకసంబంధ భావభేదాన్ని కాపాడుతుంది. అదే సమయంలో మూలపాఠంలో ప్రత్యక్షంగా లేని పాపసంబంధ వివరణను చేర్చదు.
- issue: లేవీయులను תנופהగా సమర్పించే ఆచార చర్య
  choice: ‘ఊపే అర్పణగా సమర్పించాడు’
  alternative: ‘ఊపాడు’ మాత్రమే; లేదా ‘ప్రతిష్ఠార్పణగా సమర్పించాడు’
  rationale: మూలంలోని ఊపే ఆచార పదాన్ని దాచకుండా ఉంచుతుంది; అయితే లేవీయులను భౌతికంగా ఎలా ఊపారో పాఠం నిర్దిష్టంగా చెప్పనందున దాన్ని వివరించి నిర్ణయించదు.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపంలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ఆచారపరమైన సాంకేతిక పదంగా ‘ప్రాయశ్చిత్తం’ నిలుపబడింది. ప్రధాన వాక్యాన్ని చిన్న వాక్యాలుగా విభజించి పఠనసౌలభ్యం పెంచబడింది.
