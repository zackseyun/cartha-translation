revisions:
- from: '“నీవు అహరోనుతో మాట్లాడి, అతనితో ఇలా చెప్పు: ‘నీవు దీపాలను అమర్చినప్పుడు[a], ఆ ఏడు దీపాలు దీపస్తంభం ముందువైపునకు వెలుగు ప్రసరింపజేయాలి.’”'
  to: '“నీవు అహరోనుతో మాట్లాడి, అతనితో ఇలా చెప్పు: ‘నీవు దీపాలను అమర్చినప్పుడు[a], ఆ ఏడు దీపాలు దీపస్తంభం ముందువైపు వెలుగునిస్తాయి.’”'
  rationale: The revision retains the draft’s sound handling of the disputed contextual sense of בְּהַעֲלֹתְךָ and its footnote anchor. It replaces an overly heavy causative-obligatory Telugu rendering with a natural equivalent of “shall give light,” clarifies the directional phrase, and improves the literal lexical gloss in the footnote.
