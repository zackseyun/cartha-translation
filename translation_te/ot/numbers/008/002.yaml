  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దైవాజ్ఞకు తగిన గంభీరతను నిలిపాం. మూలంలోని దిశాభావం, causative భావం, అలాగే בְּהַעֲלֹתְךָ లోని నిజమైన పదార్థ సందిగ్ధతను కాపాడాం.
