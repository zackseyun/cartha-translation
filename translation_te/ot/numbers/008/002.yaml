  text: דַּבֵּר֙ אֶֽל אַהֲרֹ֔ן וְ/אָמַרְתָּ֖ אֵלָ֑י/ו בְּ/הַעֲלֹֽתְ/ךָ֙ אֶת הַ/נֵּרֹ֔ת אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה יָאִ֖ירוּ שִׁבְעַ֥ת הַ/נֵּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: te
  text: '“నీవు అహరోనుతో మాట్లాడి, అతనితో ఇలా చెప్పు: ‘నీవు దీపాలను అమర్చినప్పుడు[a], ఆ ఏడు దీపాలు దీపస్తంభం ముందువైపు వెలుగునిస్తాయి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు దీపాలను వెలిగించినప్పుడు.” ఇక్కడి హీబ్రూ క్రియకు అక్షరార్థంగా “పైకి ఎక్కించడం” అని అర్థం. ఈ సందర్భంలో అది దీపాలను వెలిగించడాన్నిగానీ, అవి దీపస్తంభం ముందువైపు వెలుగునిచ్చేలా అమర్చడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֵלָיו
  choice: అహరోనుతో మాట్లాడి, అతనితో ఇలా చెప్పు
  rationale: మూలంలోని రెండు వాక్కు క్రియల భేదాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపంగా అనువదించబడింది.
- source_word: בְּהַעֲלֹתְךָ
  choice: నీవు దీపాలను అమర్చినప్పుడు
  rationale: עלה హిఫీల్ రూపానికి అక్షరార్థంగా ‘పైకి ఎక్కించు’ అనే భావం ఉంది; ఈ సందర్భంలో దీపాలను వెలిగించడం లేదా వెలుగు ముందుకు పడేలా వాటిని అమర్చడం అనే రెండు అవకాశాలున్నాయి. ప్రధాన పాఠ్యంలో అమరిక భావాన్ని తీసుకొని, మరో భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַנֵּרֹת / שִׁבְעַת הַנֵּרוֹת
  choice: దీపాలు / ఆ ఏడు దీపాలు
  rationale: נֵר అనేది వెలుగు అనే అమూర్త భావంకన్నా దీపాన్ని సూచిస్తుంది; నిర్దిష్టమైన ఏడు దీపాలను తెలుగులో సహజంగా ‘ఆ ఏడు దీపాలు’ అని ఇచ్చాం.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: దీపస్తంభం ముందువైపునకు
  rationale: ఈ పదబంధంలోని దిశాభావాన్ని ‘ముందు’ అనే స్థలార్థానికే పరిమితం చేయకుండా, వెలుగు దీపస్తంభపు ముందువైపు దిశగా ప్రసరించాలనే భావంతో వ్యక్తం చేసింది.
- source_word: יָאִירוּ
  choice: వెలుగు ప్రసరింపజేయాలి
  rationale: אור హిఫీల్ రూపంలోని ‘వెలుగు కలిగించు/ఇవ్వు’ అనే causative భావాన్ని తెలుగులో స్పష్టంగా నిలిపింది.
- source_word: הַמְּנוֹרָה
  choice: దీపస్తంభం
  rationale: ఆరాధనా సామగ్రిని లిప్యంతరీకరించకుండా దాని అర్థాన్ని తెలిపే సాధారణ, స్పష్టమైన తెలుగు పదాన్ని వాడాం.
