review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two Hebrew speech verbs, the conditional/temporal clause, the seven lamps, and the directional relation to the lampstand. However, “వెలుగు ప్రసరింపజేయాలి” makes the lamps actively cause light to spread and adds a stronger prescriptive force than the Hebrew imperfect naturally requires in Telugu. “వెలుగునిస్తాయి” more directly represents יָאִירוּ (“will give light/shine”).
  naturalness: The wording is generally modern and clear. “దీపస్తంభం ముందువైపునకు వెలుగు ప్రసరింపజేయాలి” is somewhat heavy; “దీపస్తంభం ముందువైపు వెలుగునిస్తాయి” is more idiomatic while retaining the required orientation.
  terminology: “దీపాలు” and “దీపస్తంభం” are appropriate, comprehensible renderings of נֵר and מְנוֹרָה. The footnote appropriately retains the contextual ambiguity of בְּהַעֲלֹתְךָ, but its literal gloss should be expressed as a verbal noun rather than as a second-person command.
  issues:
  - severity: medium
    issue: యָאִירוּ is rendered as “వెలుగు ప్రసరింపజేయాలి.”
    rationale: The Hebrew Hiphil can mean “give light,” but the Telugu construction “ప్రసరింపజేయాలి” is more causative and more obligatory than needed. “వెలుగునిస్తాయి” is faithful and natural.
  - severity: low
    issue: The footnote says the literal meaning is “పైకి ఎక్కించు.”
    rationale: In this explanatory context, “పైకి ఎక్కించడం” more accurately conveys the lexical sense without turning the gloss into an imperative addressed to Aaron.
  revised_text: '“నీవు అహరోనుతో మాట్లాడి, అతనితో ఇలా చెప్పు: ‘నీవు దీపాలను అమర్చినప్పుడు[a], ఆ ఏడు దీపాలు దీపస్తంభం ముందువైపు వెలుగునిస్తాయి.’”'
