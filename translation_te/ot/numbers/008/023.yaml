    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: ఈ వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది; తరువాతి לֵאמֹרతో కూడిన మాటల సూత్రాన్ని పునరుక్తి లేకుండా సహజంగా అందించడానికి ‘అన్నాడు’ వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడబడిన వ్యక్తిని సూచించే אֶלను తెలుగులో సహజమైన సహచర్య విభక్తి ‘తో’ ద్వారా వ్యక్తపరిచాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సాధారణ హెబ్రీ సూత్రం. తరువాతి వచనంలో వచ్చే మాటలకు సిద్ధం చేస్తూ, తెలుగులో సహజమైన ‘ఇలా అన్నాడు:’గా అందించబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ఆధునిక తెలుగులో అత్యంత పరిచితమైన రూపంగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీలోని ‘మాట్లాడాడు—అంటూ’ అనే సూత్రాన్ని యాంత్రికంగా పునరావృతం చేయకుండా, దాని భావం మరియు తదుపరి ప్రత్యక్ష ప్రసంగానికి ఉన్న అనుసంధానాన్ని ‘ఇలా అన్నాడు:’ ద్వారా నిలిపాం.
