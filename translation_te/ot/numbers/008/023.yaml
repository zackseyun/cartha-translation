  yaml_path: translation/ot/numbers/008/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: అప్పుడు యాహ్వే మోషేతో ఇలా చెప్పాడు:[a]
  philosophy: optimal-equivalence
