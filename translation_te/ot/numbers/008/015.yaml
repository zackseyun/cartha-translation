  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: te
  text: ఆ తరువాత లేవీయులు ప్రత్యక్షపు గుడారంలో సేవ చేయడానికి రావాలి. నీవు వారిని శుద్ధి చేసి[a], వారిని అల్లాడింపు అర్పణగా అర్పించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్రపరచి.’ ఇక్కడి హీబ్రూ క్రియ ఆచారపరమైన శుద్ధిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారిని అల్లాడింపు అర్పణగా ఆచారపూర్వకంగా సమర్పించడం.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: మునుపటి ప్రతిష్ఠా క్రియల తరువాత జరిగే తదుపరి దశను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: లేవీయులు ... రావాలి
  rationale: בוא యొక్క ‘రావడం/ప్రవేశించడం’ భావాన్ని, ఆదేశాత్మక సందర్భంలోని భవిష్యత్ బాధ్యతను తెలుగులో ‘రావాలి’గా వ్యక్తం చేస్తుంది.
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం దగ్గర సేవ చేయడానికి
  rationale: עבד యొక్క ఆరాధనా సంబంధ సేవాభావాన్ని నిలుపుతూ, ప్రత్యక్షపు గుడారానికి సంబంధించిన సేవ అని సహజమైన తెలుగులో తెలియజేస్తుంది; אֵת ఉన్నప్పటికీ గుడారమే నేరుగా సేవను స్వీకరించే వస్తువు అన్న అసహజ భావాన్ని నివారిస్తుంది.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: నీవు వారిని శుద్ధి చేసి
  rationale: טהר ఇక్కడ ఆచారపరమైన శుద్ధిని సూచిస్తుంది. ‘శుద్ధి చేయడం’ ఆ భావాన్ని గౌరవప్రదంగా, స్పష్టంగా అందిస్తుంది.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: వారిని కదిలించే అర్పణగా యెహోవా సన్నిధిలో సమర్పించాలి
  rationale: మూలంలోని נוף/תנופה పదబంధపు ఆచారపరమైన ‘కదిలింపు’ చిత్రాన్ని ‘కదిలించే అర్పణ’గా నిలుపుతూ, మనుషులను అక్షరార్థంగా ఊపడం అనే అపార్థం రాకుండా ఆ క్రియ యొక్క సమర్పణ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: లేవీయుల ప్రతిష్ఠలో ఆచారపరమైన భాష
  choice: ‘శుద్ధి’ మరియు ‘కదిలించే అర్పణ’ అనే ప్రత్యేక ఆరాధనా పదాలను నిలుపడం
  alternative: ‘వారిని ప్రతిష్ఠించి సమర్పించాలి’ అని సాధారణీకరించడం
  rationale: ఈ వాక్యం సాధారణ నియామకాన్ని కాక నిర్దిష్టమైన శుద్ధి, సమర్పణ క్రియలను వర్ణిస్తుంది. అందువల్ల ఆచారపరమైన స్వభావాన్ని తగ్గించకుండా, తరువాతి మతసిద్ధాంత పదజాలాన్ని చేర్చకుండా అనువదించబడింది.
- issue: లేవీయులనే תְּנוּפָהగా కదిలించడం/సమర్పించడం
  choice: లేవీయులే ‘కదిలించే అర్పణగా’ సమర్పించబడుతున్నారని నిలుపడం
  alternative: కేవలం ‘వారిని సమర్పించాలి’ అని రూపకాన్ని తొలగించడం
  rationale: హీబ్రూ వాక్యంలో ‘వారిని’ అనే ప్రత్యక్ష కర్మతో תנופה పదం ఉద్దేశపూర్వకంగా ఉపయోగించబడింది. దాని విశిష్టమైన ఆచార చిత్రాన్ని నిలుపుతూ, పాదటిప్పణిలో భావాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలు శైలి. ‘ప్రత్యక్షపు గుడారం’ పరిచితమైన ఆరాధనా పదంగా, ‘సేవ చేయడానికి’ లేవీయుల విధుల విస్తృత భావాన్ని మితంగా వ్యక్తం చేస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
