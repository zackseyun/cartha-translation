  - severity: medium
    issue: “కదిలించే అర్పణ” is an unnatural and imprecise rendering of תְּנוּפָה.
    rationale: The term denotes a specific ritual presentation/wave offering. “అల్లాడింపు అర్పణ” better communicates this cultic category in Telugu Bible register.
  - severity: low
