id: NUM.8.12
reference: Numbers 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: te
  text: అప్పుడు లేవీయులు ఆ ఎద్దుల తలలపై తమ చేతులు ఉంచాలి. నీవు ఒక ఎద్దును పాపపరిహార బలిగా[a], మరొక ఎద్దును దహనబలిగా యాహ్వేకు అర్పించి, లేవీయుల కొరకు ప్రాయశ్చిత్తం చేయుటకు అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ పదం חַטָּאת యాజక సంబంధ సందర్భాల్లో పాపంతో సంబంధమున్న బలిని లేదా శుద్ధీకరణ బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: తమ చేతులు ఉంచాలి
  rationale: బలి ఆచార సందర్భంలో סמך అనేది బలి జంతువుపై చేతులు ఉంచే క్రియను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఈ భౌతిక ఆచారాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: ఆ ఎద్దుల తలల మీద
  rationale: హీబ్రూలో ‘తల’ ఏకవచనంగా ఉన్నప్పటికీ, రెండు ఎద్దులకు పంపిణీ భావం వర్తిస్తుంది; తెలుగులో బహువచనం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַעֲשֵׂה
  choice: అర్పించి ... చేయాలి
  rationale: బలి సందర్భంలో עשה అంటే కేవలం ‘చేయడం’ కాక, బలిగా అర్పించడం. ఏకవచన సంబోధనను ‘నీవు’తో నిలిపాము.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: యాజక సంబంధ సందర్భాల్లో ఈ పదం పాపంతో సంబంధమున్న బలిని, అలాగే శుద్ధీకరణ కార్యాన్ని సూచించగలదు. సాధారణ పాఠకులకు సుపరిచితమైన ‘పాపపరిహార బలి’ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాము.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలి పూర్తిగా దహించబడే అర్పణకు స్థిరపడిన, సంక్షిప్తమైన తెలుగు ఆచారపదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తపరుస్తుంది.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: లేవీయుల కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר యొక్క యాజక-బలి సంబంధ భావాన్ని ఏ ఒక్క ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయకుండా సంప్రదాయబద్ధమైన ‘ప్రాయశ్చిత్తం చేయడం’తో నిలిపాము; על లేవీయులు దాని లబ్ధిదారులని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాము. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు ఎక్కువగా గుర్తించదగిన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: חַטָּאת యొక్క బలి సంబంధ భావం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలినీ, ఆచార శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో సుపరిచిత రూపాన్ని ఎంచుకుని, నిజమైన భావసాధ్యతను పాదటిప్పణిలో సంరక్షించాము.
- issue: כפר యొక్క అర్థ పరిధి
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి / శుద్ధి కలిగించాలి
  rationale: ఈ యాజక సందర్భంలోని దేవశాస్త్రీయ విస్తృతిని నిలిపి, అది ఎలా కార్యసాధకం అవుతుందనే నిర్దిష్ట సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాము. ఆచారపదాలైన ‘దహనబలి,’ ‘ప్రాయశ్చిత్తం’ నిలిపి, వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చాము. ప్రధాన పాఠ్యంలోని [a] సూచిక పాదటిప్పణితో సరిపోతుంది.
