source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: te
  text: ఆ తర్వాత లేవీయులు సమావేశపు గుడారంలో అహరోను ఎదుట, అతని కుమారుల ఎదుట తమ సేవను నిర్వహించడానికి వచ్చారు. యాహ్వే లేవీయుల గురించి మోషేకు ఆజ్ఞాపించిన ప్రకారమే వారు వారిపట్ల అలాగే చేశారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారు వారి కోసం అలాగే చేశారు’ అని కూడా అనువదించవచ్చు. హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; లేవీయుల విషయంలో నిర్ణయించిన ఆచారాలను అమలు చేయడాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: ముందటి శుద్ధీకరణ, ప్రతిష్ఠాపన కార్యాల అనంతర దశను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בָּאוּ הַלְוִיִּם לַעֲבֹד אֶת עֲבֹדָתָם
  choice: లేవీయులు ... తమ సేవను నిర్వహించడానికి వచ్చారు
  rationale: ఆరాధనా సంబంధమైన עבד/עֲבֹדָה పదజాలాన్ని తెలుగులో అసహజంగా పునరుక్తి చేయకుండా, దాని సేవా భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలో
  rationale: אֹהֶל מוֹעֵד అనే పేరులోని ‘గుడారం’ మరియు ‘సమావేశం’ భావాలను నేరుగా, సాధారణ పాఠకునికి అర్థమయ్యేలా అందిస్తుంది; בְ అనే స్థానార్థక అవ్యయాన్ని ‘లో’గా నిలుపుతుంది.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: అహరోను ఎదుట, అతని కుమారుల ఎదుట
  rationale: ‘పర్యవేక్షణలో’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా לִפְנֵי యొక్క ‘ఎదుట’ భావాన్ని, మూలంలోని పునరుక్తితో సహా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: עַל הַלְוִיִּם
  choice: లేవీయుల గురించి
  rationale: ఇక్కడ עַל ఆజ్ఞ యొక్క విషయాన్ని సూచిస్తుంది; ‘గురించి’ సహజమైన, అతివ్యాఖ్యానం లేని తెలుగు రూపం.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: వారు వారికి చేశారు
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తతను, బహువచన కర్తను, לָהֶם యొక్క సంబంధార్థక అనిశ్చితిని విప్పి చెప్పకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: כֵּן עָשׂוּ לָהֶם లోని కర్త మరియు లబ్ధిదారు/లక్ష్య సంబంధం
  choice: వారు వారికి చేశారు
  alternative: వారు వారిపట్ల అలాగే చేశారు; వారి కోసం అలాగే చేశారు
  rationale: సందర్భం ప్రకారం లేవీయుల విషయంలో నియమించిన క్రియలు అమలు చేయబడ్డాయని అర్థమవుతుంది; అయితే హీబ్రూ కర్తను మళ్లీ స్పష్టంగా పేర్కొనదు, לְ సంబంధమూ సంక్షిప్తంగా ఉంది. అందువల్ల ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ఆరాధనా సేవ భావాన్ని ‘నిర్వహించడానికి’ ద్వారా స్పష్టం చేశాం; చివరి హీబ్రూ పదబంధంలోని నిజమైన సంక్షిప్తతను పాదసూచికతో సంరక్షించాం.
