- from: అహరోను లేవీయులను ఇశ్రాయేలు కుమారుల తరఫున[b] యెహోవా సన్నిధిలో కదిలించే అర్పణగా సమర్పించాలి[a]. అప్పుడు వారు యెహోవా సేవను చేయడానికి నియమితులవుతారు.
