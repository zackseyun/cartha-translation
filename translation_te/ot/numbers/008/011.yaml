  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: te
  text: అహరోను లేవీయులను ఇశ్రాయేలు కుమారులలోనుండి[b] యెహోవా సన్నిధిలో ఊపే అర్పణగా సమర్పించాలి[a]; యెహోవా సేవ చేయుటకై వారు ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అహరోను లేవీయులను ఊపే అర్పణగా ఊపాలి.” హీబ్రూలో క్రియకూ “ఊపే అర్పణ” అనే నామవాచకానికీ ఒకే మూలపదం ఉంది; ఇది ఆచారబద్ధమైన సమర్పణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు కుమారులలోనుండి” అనే మాటను “ఇశ్రాయేలు కుమారుల తరఫున” అని కూడా అర్థం చేసుకోవచ్చు; అప్పుడు లేవీయులు ఇశ్రాయేలీయులకు ప్రతినిధులుగా యెహోవా సేవ చేయడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: కదిలించే అర్పణగా సమర్పించాలి
  rationale: נוּף అనే ఒకే మూలానికి చెందిన క్రియ, నామవాచకం ఇక్కడ ఆచారబద్ధమైన సమర్పణను సూచిస్తాయి. వ్యక్తులను అక్షరార్థంగా కదిలించాడనే అపార్థం రాకుండా ప్రధాన వాక్యంలో సహజమైన ‘సమర్పించాలి’ వాడి, ఆచారపదాన్ని ‘కదిలించే అర్పణ’గా నిలిపాం.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల తరఫున
  rationale: מֵאֵת మూలం/నుండి అనే భావాన్నీ, ప్రతినిధిత్వం లేదా తరఫున అనే భావాన్నీ అనుమతిస్తుంది. ఈ ఆచార సందర్భంలో ‘తరఫున’ సహజంగా ఉన్నా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: అప్పుడు వారు యెహోవా సేవను చేయడానికి నియమితులవుతారు
  rationale: క్రియ-నామవాచక పునరుక్తిని అసహజంగా అనుకరించకుండా, ఆచారం ఫలితంగా వారు సేవకు సిద్ధంగా/కేటాయింపబడ్డారనే ప్రయోజనార్థాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: లేవీయులను ‘కదిలించే అర్పణ’గా పేర్కొనడం
  choice: కదిలించే అర్పణగా సమర్పించాలి
  alternative: లేవీయులను కదిలించే అర్పణగా కదిలించాలి
  rationale: ఆచారపరమైన అర్పణ వర్గాన్ని నిలుపుతూ, లేవీయులు బలిగా చంపబడుతున్నారనే భావాన్ని లేదా వారిని భౌతికంగా ఊపుతున్నారనే అనవసర నిర్ణయాన్ని నివారిస్తుంది.
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל యొక్క సంబంధార్థం
  choice: ఇశ్రాయేలు కుమారుల తరఫున
  alternative: ఇశ్రాయేలు కుమారులలోనుండి
  rationale: లేవీయులు ఇశ్రాయేలీయుల స్థానంలో సేవచేసే సమీప సందర్భానికి ‘తరఫున’ సరిపోతుంది; అయితే హీబ్రూలోని మూలం/వారిలోనుండి అనే సాధ్యార్థాన్ని పాదటిప్పణి ద్వారా భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘కదిలించే అర్పణ’ ఆచారపదాన్ని నిలిపి, ‘సమర్పించాలి’ ద్వారా వాక్యాన్ని సహజం చేశాం. ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని పుంలింగ బహువచన రూపాన్ని కాపాడుతుంది.
