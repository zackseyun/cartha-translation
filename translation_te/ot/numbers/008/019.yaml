base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: te
  text: “నేను లేవీయులను ఇశ్రాయేలు కుమారులలోనుండి అహరోనుకూ అతని కుమారులకూ కానుకగా ఇచ్చాను[a][b]. వారు సమావేశపు గుడారంలో ఇశ్రాయేలు కుమారుల సేవను నిర్వహించడానికి, ఇశ్రాయేలు కుమారుల కొరకు ప్రాయశ్చిత్తం చేయడానికి ఇవ్వబడినవారు. ఆ విధంగా, ఇశ్రాయేలు కుమారులు పరిశుద్ధ స్థలానికి[c] సమీపించినప్పుడు ఇశ్రాయేలు కుమారుల మధ్య తెగులు కలగదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహరోనుకూ అతని కుమారులకూ ఇవ్వబడిన లేవీయులను.” హీబ్రూలో “ఇవ్వు” అనే మూలపదం నొక్కిచెప్పడానికి పునరుక్తమైంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలీయులలోనుండి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పరిశుద్ధ మందిరానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: వారిని ... కానుకగా ఇచ్చాను ... వారిని ఇచ్చాను
  rationale: נתן అనే మూలపదం పునరుక్తి కావడం లేవీయులు తామే అప్పగించబడినవారని నొక్కిచెబుతుంది. సహజమైన తెలుగులో ‘కానుకగా ఇచ్చాను’ అని చెప్పి, తరువాత ‘వారిని ఇచ్చాను’ అని పునరుక్తిని కొంతవరకు నిలిపాం.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోనుండి
  rationale: מִתּוֹךְ సమూహం మధ్యనుండి ఎంపికను సూచిస్తుంది; בְּנֵי יִשְׂרָאֵל యొక్క కుటుంబ/ఒడంబడిక రూపాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలిపాం.
- source_word: לַעֲבֹד אֶת עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు చేయవలసిన సేవను చేయడానికి
  rationale: עבד మూలపద పునరుక్తిని ‘సేవను చేయడానికి’గా నిలిపి, ఆ సేవ ఇశ్రాయేలు కుమారులకు సంబంధించిన బాధ్యత అని స్పష్టంగా, కానీ అతిగా వ్యాఖ్యానించకుండా తెలిపాం.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: ఆరాధనా గుడారానికి తెలుగులో సుపరిచితమైన, గౌరవప్రదమైన పదబంధం; సందర్భంలోని నిర్దిష్ట స్థలాన్ని సూచిస్తుంది.
- source_word: וּלְכַפֵּר עַל
  choice: కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజక సంబంధ సందర్భంలో כפר యొక్క పరిహార/శుద్ధీకరణ భావాన్ని ‘ప్రాయశ్చిత్తం చేయడం’ నిలుపుతుంది; దాని విధానాన్ని వచనానికి మించి నిర్ధారించదు.
- source_word: נֶגֶף
  choice: తెగులు
  rationale: పరిశుద్ధ స్థలానికి అనుచితంగా సమీపించడం వల్ల కలిగే దేవదండనాత్మక విపత్తు లేదా ప్రాణాంతక దెబ్బ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְּגֶשֶׁת
  choice: సమీపించినప్పుడు
  rationale: ב + infinitive construct ఇక్కడ కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది; ‘సమీపించినప్పుడు’ సహజమైన తెలుగు.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: ఇక్కడ అమూర్తమైన పరిశుద్ధతకన్నా గుడారానికి సంబంధించిన పవిత్ర ప్రాంతం ఉద్దేశించబడింది; ‘పరిశుద్ధ స్థలం’ ఆ నిర్దిష్టతను అతిగా సంకుచితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: లేవీయుల సేవ మరియు ప్రాయశ్చిత్త సంబంధ పాత్ర
  choice: లేవీయులు ఇశ్రాయేలు చేయవలసిన సేవను చేసి, వారి కోసం ప్రాయశ్చిత్తం చేయడానికి ఇవ్వబడ్డారని నేరుగా అనువదించాం.
  alternative: వారు కేవలం ఆచరణాత్మక సహాయక సేవ మాత్రమే చేస్తారని వ్యాఖ్యానించడం.
  rationale: మూలవచనం సేవను, ప్రాయశ్చిత్తాన్ని రెండింటినీ లేవీయుల నియామకంతో కలుపుతుంది. తరువాతి యాజక విభజనల ఆధారంగా ఈ ఉద్రిక్తతను తొలగించలేదు.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ కుటుంబ-ఒడంబడిక పదబంధాన్ని, దాని వ్యాకరణ లింగాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే రూపాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పునరావృతిని ప్రధానంగా నిలిపాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం; కారణ-ఫల సంబంధాన్ని మార్చలేదు.
