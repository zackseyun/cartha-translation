- from: “ఇశ్రాయేలు కుమారులలోనుండి లేవీయులను తీసుకొని, వారిని అహరోనుకు, అతని కుమారులకు కానుకగా ఇచ్చాను[a][b]. ప్రత్యక్ష గుడారంలో ఇశ్రాయేలు కుమారులు చేయవలసిన సేవను చేయడానికి, ఇశ్రాయేలు కుమారుల కోసం ప్రాయశ్చిత్తం చేయడానికి వారిని ఇచ్చాను. ఆ విధంగా, ఇశ్రాయేలు కుమారులు పరిశుద్ధ స్థలానికి[c] సమీపించినప్పుడు వారి మధ్య తెగులు కలగదు.”
  to: “నేను లేవీయులను ఇశ్రాయేలు కుమారులలోనుండి అహరోనుకూ అతని కుమారులకూ కానుకగా ఇచ్చాను[a][b]. వారు సమావేశపు గుడారంలో ఇశ్రాయేలు కుమారుల సేవను నిర్వహించడానికి, ఇశ్రాయేలు కుమారుల కొరకు ప్రాయశ్చిత్తం చేయడానికి ఇవ్వబడినవారు. ఆ విధంగా, ఇశ్రాయేలు కుమారులు పరిశుద్ధ స్థలానికి[c] సమీపించినప్పుడు ఇశ్రాయేలు కుమారుల మధ్య తెగులు కలగదు.”
  rationale: The revision removes the added notion of taking, restores the source’s appositional emphasis that the Levites are themselves given, and avoids interpreting “the service of the sons of Israel” as an obligation that Israelites were personally required to perform. Footnote anchors and all three footnote alternatives are retained and correctly placed.
