source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: te
  text: తర్వాత నీవు లేవీయులను సమావేశపు గుడారం ఎదుటికి తీసుకురావాలి; ఇశ్రాయేలు కుమారుల[a] సమాజమంతటినీ సమీకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయుల.” హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: తర్వాత నీవు … తీసుకురావాలి
  rationale: קרב అనే ధాతువు హిఫీల్ రూపంలో ‘దగ్గరకు తీసుకురావడం’ లేదా ‘సమర్పించడం’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ పవిత్ర స్థలం ఎదుటికి తీసుకురావడమే సందర్భానికి సహజం; ప్రారంభంలోని וְ క్రమాన్ని సూచిస్తున్నందున ‘తర్వాత’ అని అనువదించాం.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందిన, పవిత్రస్థల సేవకు ప్రత్యేకించబడిన వారిని సూచించే ప్రామాణిక నామం.
- source_word: לִפְנֵי
  choice: ఎదుటికి
  rationale: ఈ విభక్తి పదం ‘ముందు/ఎదుట’ అనే స్థానార్థాన్ని ఇస్తుంది. తీసుకురావడం అనే క్రియతో కలిసి తెలుగులో గమ్యాన్ని సహజంగా తెలియజేయడానికి ‘ఎదుటికి’ వాడాం.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: אֹהֶל అంటే ‘గుడారం’; מוֹעֵד ఇక్కడ దేవుడు తన ప్రజలను కలుసుకునే నియమిత సమావేశాన్ని సూచిస్తుంది. అందువల్ల మూలపదాల భావాన్ని స్పష్టంగా ఉంచే ‘సమావేశ గుడారం’ ఎంచుకున్నాం.
- source_word: וְהִקְהַלְתָּ
  choice: సమావేశపరచాలి
  rationale: קהל హిఫీల్ రూపం ఒక సమూహాన్ని కూడగట్టడం లేదా సభగా సమీకరించడం అని అర్థం. అధికారికమైన ప్రజా సమీకరణను ‘సమావేశపరచాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל עֲדַת
  choice: సమాజమంతటినీ
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు ప్రజల సమాజాన్ని సూచిస్తుంది; כָּל దాని సంపూర్ణతను తెలియజేస్తుంది. ‘సమాజమంతటినీ’ రెండింటినీ సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలో ఉన్న పుత్రసంబంధమైన, వ్యాకరణపరంగా పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠంలో నిలిపాం. సహజమైన సమూహనామ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారుల
  alternative: ఇశ్రాయేలీయుల
  rationale: ఈ పదబంధం వ్యాకరణపరంగా పుంలింగ బహువచనంలో ఉండి, నిబంధన ప్రజలను సమష్టిగా సూచిస్తుంది. మూలంలోని పుత్రసంబంధ రూపాన్ని ప్రధాన పాఠంలో కాపాడుతూ, మరింత సహజమైన సామూహిక రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆజ్ఞారూపాన్ని వాడాం. ఆచార సంబంధ సందర్భాన్ని నిలిపినా, అనవసరంగా పాతబడిన లేదా ఒక ప్రత్యేక సంప్రదాయానికే చెందిన పదజాలాన్ని నివారించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఇశ్రాయేలు కుమారుల’ పదబంధం వెంట ఉంచాం.
