  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: te
  text: కాబట్టి నీవు ఇశ్రాయేలు కుమారుల మధ్య నుండి లేవీయులను వేరుచేయాలి[a]; లేవీయులు నాకు చెందినవారై ఉంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రత్యేకపరచాలి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘లేవీయులు నావారై ఉంటారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: కాబట్టి నీవు ... వేరుచేయాలి
  rationale: בדל హిఫీల్ రూపం ‘వేరుచేయు’ లేదా ‘ప్రత్యేకపరచు’ అనే భావాన్ని ఇస్తుంది. సందర్భంలోని ఆచరణ క్రమాన్ని సూచించడానికి וְ ను ‘కాబట్టి’గా అనువదించాం.
- source_word: אֶת הַלְוִיִּם
  choice: లేవీయులను
  rationale: నిర్దిష్ట బహువచన ప్రత్యక్ష కర్మను సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: מִתּוֹךְ
  choice: మధ్య నుండి
  rationale: ఒక పెద్ద సమూహం లోపలి నుండి వేరుచేయడాన్ని ఈ పదబంధం సూచిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: హీబ్రూ కుటుంబ సంబంధ వ్యక్తీకరణను సమతలీకరించకుండా ‘ఇశ్రాయేలు కుమారులు’ అని ప్రత్యక్షంగా నిలిపాం.
- source_word: וְהָיוּ לִי
  choice: నాకు చెందినవారై ఉంటారు
  rationale: היה + לִי ఇక్కడ యెహోవాకు చెందినవారై ఉండడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘నాకు చెందినవారై ఉంటారు’ అని ఇచ్చాం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: మూలంలో ఉన్న పునరుక్తి, నొక్కిచెప్పే నిర్మాణం నిలిచేలా సర్వనామంతో మార్చకుండా మళ్లీ ‘లేవీయులు’ అని ఇచ్చాం.
theological_decisions:
- issue: లేవీయుల స్థితిని సాధారణ చెందినతనంగా అనువదించాలా, ఆరాధనా సేవకు ప్రతిష్ఠించడంగా విస్తరించాలా
  choice: లేవీయులు నాకు చెందినవారై ఉంటారు
  alternative: లేవీయులు నాకు ప్రతిష్ఠించబడినవారై ఉంటారు
  rationale: לִי తో היה నేరుగా దేవునికి చెందినతనాన్ని వ్యక్తపరుస్తుంది. విస్తృత సందర్భం ఆరాధనా సేవకు ప్రత్యేకపరచడాన్ని సూచించినా, ఈ వాక్యంలో ‘ప్రతిష్ఠించు’ అనే ప్రత్యేక పదజాలం లేదు; కాబట్టి ఆ భావాన్ని అనువాదంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా కుటుంబ వ్యక్తీకరణను నిలిపి, ‘లేవీయులు’ అనే పదాన్ని మూలంలోని విధంగానే పునరుక్తి చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
