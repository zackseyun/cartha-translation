  terminology: ‘దీపస్తంభం,’ ‘యాహ్వే,’ ‘నమూనా,’ and ‘సుత్తితో కొట్టి మలిచిన’ are appropriate modern-standard Telugu renderings. The repeated rendering of מִקְשָׁה is retained, without treating ‘one piece’ as the primary meaning.
