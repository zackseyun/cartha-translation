source:
  edition: WLC
  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: te
  text: 'దీపస్తంభం తయారీ విధానం ఇదే: అది సుత్తితో కొట్టి మలిచిన బంగారు పని[a]. దాని అడుగుభాగం నుండి దాని పుష్పాలంకారం వరకు అది సుత్తితో కొట్టి మలిచిన పనియే. యాహ్వే మోషేకు చూపించిన నమూనా[b] ప్రకారమే అతడు దీపస్తంభాన్ని చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొట్టి చేసిన పని.’ హీబ్రూ పదం దీపస్తంభం సుత్తితో కొట్టి మలచబడిందని నొక్కి చెబుతుంది. దానిని ‘ఒకే ముక్కతో చేసినది’ అని కూడా కొందరు అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: ‘నమూనా’ అనే మాటను ఇక్కడ ‘ఆకారం’ లేదా ‘దర్శనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: తయారైన విధానం
  rationale: దీపస్తంభం ఏ విధంగా రూపొందించబడిందో తెలిపే శిల్పనిర్మాణ సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభం
  rationale: ఆరాధనా సామగ్రికి సంబంధించిన సాధారణ నామాన్ని లిప్యంతరీకరించకుండా అర్థవంతంగా అనువదిస్తుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో మలిచిన పని / సుత్తితో మలిచినది
  rationale: లోహాన్ని కొట్టి, మలిచి రూపొందించిన పనిని సూచిస్తుంది. మూలంలోని పునరుక్తిని తెలుగులోనూ నిలిపింది; ‘ఒకే ముక్కతో చేసినది’ అనేది సాధ్యమైనప్పటికీ మరింత వ్యాఖ్యానాత్మకం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పదార్థాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: దాని పీఠం మొదలుకొని దాని పువ్వు వరకు
  rationale: దీపస్తంభం దిగువ భాగం నుంచి పుష్పాకార అలంకారం వరకు దాని మొత్తం విస్తృతిని సహజంగా తెలియజేస్తుంది; ఏకవచన రూపాన్ని ‘పువ్వు’గా నిలిపింది.
- source_word: כַּמַּרְאֶה
  choice: నమూనా ప్రకారం
  rationale: మోషేకు చూపించబడిన రూపం లేదా నమూనాను నిర్మాణ సందర్భంలో స్పష్టంగా తెలియజేస్తుంది; ‘ఆకారం’ లేదా ‘దర్శనం’ అనే విస్తృత సాధ్యతలను పాదసూచికలో నిలిపింది.
- source_word: הֶרְאָה
  choice: చూపించిన
  rationale: ראה యొక్క హిఫిల్ రూపంలోని ‘చూపించడం’ అనే కారణార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు లిపిలో సమీపంగా లిప్యంతరీకరించింది.
- source_word: כֵּן עָשָׂה
  choice: ప్రకారమే అతడు ... చేశాడు
  rationale: ‘ఎలాగైతే చూపించబడిందో అలాగే చేశాడు’ అనే పరస్పర సంబంధాన్ని నిలుపుతుంది. హీబ్రూలో కర్త సూచింపబడకపోయినా క్రియ ఏకవచన పుంలింగంలో ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; నిర్దిష్ట మతశాఖ సంప్రదాయాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
- issue: עָשָׂה క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: అతడు చేశాడు
  alternative: అది చేయబడింది
  rationale: మూలంలో కర్త పేరు స్పష్టంగా లేకపోవడాన్ని ‘అతడు’ ద్వారా నిలుపుతూ, క్రియ యొక్క క్రియాశీల ఏకవచన రూపాన్ని కాపాడుతుంది. కర్త ఎవరో పాఠ్యంలో అదనంగా నిర్ధారించలేదు.
- issue: כַּמַּרְאֶה యొక్క భావపరిధి
  choice: నమూనా
  alternative: ఆకారం / దర్శనం
  rationale: పరిశుద్ధ గుడారపు సామగ్రి నిర్మాణ సందర్భంలో ‘నమూనా’ సహజంగా సరిపోతుంది; అయితే దృశ్యరూపం లేదా దర్శనం అనే మూలపద సాధ్యతను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. శిల్పనిర్మాణ పదజాలం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ, מִקְשָׁה యొక్క పునరుక్తి మరియు כַּמַּרְאֶה యొక్క భావసందిగ్ధత సంరక్షించబడ్డాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
