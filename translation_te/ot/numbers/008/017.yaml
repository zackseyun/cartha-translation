source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: te
  text: ఎందుకంటే ఇశ్రాయేలీయులలోని మనుషులలోనూ పశువులలోనూ ప్రతి తొలిచూలు నాదే. ఐగుప్తు దేశంలో ప్రతి తొలిచూలును నేను హతమార్చిన రోజున, వాటన్నిటినీ నాకోసం ప్రతిష్ఠించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటన్నిటినీ నాకోసం ప్రత్యేకించాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రకటనకు కారణాన్ని తెలియజేసే వివరణాత్మక సంధానంగా ఉంది.
- source_word: לִי
  choice: నాదే
  rationale: హీబ్రూలోని స్వామ్య భావాన్ని సహజమైన, బలమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: כָל בְּכוֹר
  choice: ప్రతి తొలిచూలు
  rationale: సమష్టి ఏకవచన భావాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘మగ’ అనే పదాన్ని చేర్చదు.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో
  rationale: ‘ఇశ్రాయేలు కుమారులలో’ అనే అక్షరార్థం కంటే ఆధునిక తెలుగులో సహజంగా ఉండి అదే ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: మనుషులకైనా పశువులకైనా
  rationale: మానవులు–జంతువులు అనే వర్గ వ్యత్యాసాన్ని, అలాగే రెండింటినీ కలుపుకునే పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּתִי
  choice: నేను హతమార్చిన
  rationale: נכה యొక్క ‘కొట్టు/దెబ్బతీయు’ భావాన్ని ఈ పస్కా సందర్భంలోని ప్రాణాంతక తీర్పుకు అనుగుణంగా తెలుపుతుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: ‘దేశం’తో కూడిన పూర్తి హీబ్రూ పదబంధాన్ని నిలుపుతుంది.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: వారిని నా కోసం ప్రతిష్ఠించుకున్నాను
  rationale: קדשׁ హిఫీల్‌లోని పవిత్ర ప్రయోజనం కోసం ప్రత్యేకించుకొనే భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: אָדָם మరియు בְּהֵמָה మధ్య వర్గ వ్యత్యాసం
  choice: మనుషులకైనా పశువులకైనా
  alternative: మనిషిలోను పశువులోను
  rationale: హీబ్రూ ఏకవచన సమష్టి రూపాలను అక్షరాలా అనుకరించకుండా, మానవ–పశు వర్గాల మధ్య నిజమైన వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: הִקְדַּשְׁתִּי యొక్క పవిత్రార్థం
  choice: ప్రతిష్ఠించుకున్నాను
  alternative: నా కోసం ప్రత్యేకించుకున్నాను
  rationale: దేవుడు తొలిచూలును తనకు పవిత్రమైనవారిగా కేటాయించుకున్నాడనే ఆరాధనా సంబంధిత బలాన్ని నిలుపుతుంది; ‘ప్రత్యేకించుకున్నాను’ అనే విస్తృతార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: הַכֹּתִי యొక్క తీవ్రత
  choice: హతమార్చిన
  alternative: దెబ్బతీసిన
  rationale: క్రియ స్వతంత్రంగా ‘కొట్టడం’ అని అర్థమివ్వగలిగినా, ఐగుప్తు తొలిచూలు సంఘటనలో సందర్భం మరణాన్ని స్పష్టంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తొలిచూలు’ అనే బైబిలు-ప్రచలిత పదాన్ని ఉంచి, మూలంలో లేని ‘మగ’ అనే నిర్దిష్టీకరణను చేర్చలేదు.
