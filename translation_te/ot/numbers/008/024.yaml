source:
  edition: WLC
  text: זֹ֖את אֲשֶׁ֣ר לַ/לְוִיִּ֑ם מִ/בֶּן֩ חָמֵ֨שׁ וְ/עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה יָבוֹא֙ לִ/צְבֹ֣א צָבָ֔א בַּ/עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: te
  text: 'లేవీయులకు సంబంధించినది ఇదే: ఇరవై ఐదు సంవత్సరాల వయస్సు నుండి పైబడిన లేవీయుడు సమాగమపు గుడారపు సేవలో విధి నిర్వహించడానికి రావాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విధి నిర్వహించడానికి” అని అనువదించిన హీబ్రూ పదబంధం క్రమబద్ధమైన సేవ లేదా విధి చేయడాన్ని సూచిస్తుంది; దీనికి సైనిక సేవను తలపించే ఛాయ కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: లేవీయులకు వర్తించే నియమం ఇదే
  rationale: ఈ నిర్మాణం లేవీయులకు వర్తించే విధిని పరిచయం చేస్తుంది. ‘నియమం’ అనే పదం మూలంలోని న్యాయసంబంధ సూచనను సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఐదు సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్న
  rationale: ఇది సేవకు కనీస వయోపరిమితిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా మూలార్థాన్ని నిలుపుతుంది.
- source_word: יָבוֹא
  choice: ప్రతి లేవీయుడు ... రావాలి
  rationale: హీబ్రూలో సమూహాన్ని ఉద్దేశించిన ఏకవచన క్రియ ఉంది. తెలుగులో అస్పష్టమైన సర్వనామాన్ని నివారిస్తూ, సమూహంలోని ఒక్కొక్కరికి వర్తించే న్యాయబద్ధ ఆదేశంగా వ్యక్తం చేయబడింది.
- source_word: לִצְבֹא צָבָא
  choice: విధులు నిర్వర్తించడానికి
  rationale: ఈ హీబ్రూ జాతీయం క్రమబద్ధమైన విధి లేదా సేవ చేయడాన్ని సూచిస్తూ సైనిక సేవ ఛాయను కలిగి ఉంది. సందర్భానికి తగిన ప్రధాన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בַּעֲבֹדַת
  choice: సేవలో
  rationale: ఇక్కడ עֲבֹדָה నియమించబడిన పరిశుద్ధస్థల సేవను సూచిస్తుంది; ‘సేవలో’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలీయుల ఆరాధనా గుడారానికి వాడే స్థిరమైన బైబిలు పదబంధం; దేవుడు తన ప్రజలను కలుసుకునే స్థలమనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: సమూహవాచక కర్తతో ఏకవచన క్రియ
  choice: ప్రతి లేవీయుడు ... రావాలి
  alternative: వారు ... రావాలి
  rationale: మూలంలోని ఏకవచన రూపాన్ని, సమూహంలోని ప్రతి వ్యక్తికి ఆదేశం వర్తిస్తుందనే భావాన్ని నిలుపుతుంది; తెలుగులో లింగసూచక సర్వనామం అవసరం లేకుండా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన న్యాయబద్ధ శైలి. ‘ప్రత్యక్ష గుడారం’ అనే స్థిరమైన బైబిలు పదప్రయోగం ఉపయోగించబడింది. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
