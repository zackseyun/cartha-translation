    reason: దైవనామం యొక్క హెబ్రీయ రూపాన్నీ, సంప్రదాయ అనువాద ప్రత్యామ్నాయాన్నీ తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: వావ్-క్రమంతో వచ్చిన דבר సాధారణ కథన వాక్యారంభ సూత్రం. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘అన్నాడు’ సహజంగా ఉండి, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో אֶל సంభాషణ ఉద్దేశిత వ్యక్తిని సూచిస్తుంది. ఆధునిక సహజ తెలుగులో ‘మోషేతో’ ఈ సంబంధాన్ని సరిగ్గా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ అవ్యయ క్రియారూపం తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. హీబ్రూ నిర్మాణాన్ని కృత్రిమంగా ‘చెప్పుతూ’ అని అనుకరించకుండా, తెలుగులో సహజమైన ‘ఇలా అన్నాడు’ రూపం దాని కార్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన కథన వాక్యారంభం. తరువాతి వచనంలోని ప్రత్యక్ష సందేశాన్ని పరిచయం చేయడానికి సహజమైన ‘ఇలా అన్నాడు’ వాడబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉంది.
