id: NUM.8.7
reference: Numbers 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: te
  text: 'వారిని శుద్ధి చేయడానికి నీవు వారికి ఇలా చేయి: పాపశుద్ధి జలాన్ని[a] వారిమీద చిలకరించు. వారు తమ శరీరమంతటిమీద క్షౌర కత్తిని పోనిచ్చి[b], తమ బట్టలు ఉతుక్కొని, తమను తాము శుద్ధి చేసుకోవాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ జలం’; అక్షరార్థంగా, ‘పాపపు నీరు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తమ శరీరమంతటిమీద క్షౌర కత్తిని పోనివ్వాలి’; అంటే, శరీరమంతా గొరిగించుకోవాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: నీవు వారికి ఇలా చేయాలి
  rationale: నిర్దేశాత్మక భావాన్ని, ముందున్న సందర్భంతో అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְטַהֲרָם
  choice: వారిని శుద్ధి చేయడానికి
  rationale: ఇక్కడి טהר ఆచారపరమైన శుద్ధిని సూచిస్తుంది; ‘శుద్ధి’ అనే పదం ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: వారిపై చిలకరించు
  rationale: హిఫీల్ ఆజ్ఞారూపం ఆచారబద్ధంగా నీటిని చిలకరించడాన్ని సూచిస్తుంది.
- source_word: מֵי חַטָּאת
  choice: పాపశుద్ధి జలం
  rationale: అక్షరార్థంగా ‘పాపపు నీరు’; అయితే ఆచార సందర్భంలో పాపం లేదా అపవిత్రతకు సంబంధించిన శుద్ధి కోసం వాడే నీటిని సూచిస్తుంది. ‘పాపబలి జలం’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని బలి భావాన్ని ఖరారు చేసినట్లవుతుంది.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: వారు తమ శరీరమంతటిపై క్షౌర కత్తిని పోనిచ్చి
  rationale: ‘క్షౌర కత్తిని పోనిచ్చుట’ అనే హీబ్రూ రూపకల్పనను నిలుపుతూ, ‘మాంసమంతా’ అనే అసహజ పదబంధానికి బదులు సందర్భానుగుణంగా ‘శరీరమంతటిపై’ అని ఇచ్చింది.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: తమ బట్టలు ఉతుక్కొని
  rationale: כבס వస్త్రాలను కడగడాన్ని సూచిస్తుంది; ‘బట్టలు ఉతుక్కొని’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְהִטֶּהָרוּ
  choice: తమను తాము శుద్ధి చేసుకోవాలి
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: లేవీయుల ప్రతిష్ఠాపనలోని శుద్ధీకరణ భాష స్వభావం
  choice: טהר పదాలను ఆచారపరమైన ‘శుద్ధి’గా అనువదించి, חטאת యొక్క సంక్షిప్తతను పాదసూచికలో నిలుపడం
  alternative: దీనిని కేవలం నైతిక పాపక్షమాపణగా చూపడం లేదా ‘పాపబలి జలం’ అని స్పష్టీకరించడం
  rationale: ఈ వచనం లేవీయుల కోసం చేయబడే స్పష్టమైన ఆచారాన్ని వివరిస్తుంది. మూలం అపవిత్రత, పాపం, శుద్ధి మధ్య సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది; అందువల్ల తరువాతి సిద్ధాంత వర్గాలను ఇందులోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఆచారపరమైన ఖచ్చితత్వం కోసం ‘శుద్ధి’, ‘క్షౌర కత్తి’ పదాలను వాడి, అస్పష్టమైన מֵי חַטָּאת భావాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ఉంచి పాదసూచికలో ప్రత్యామ్నాయం ఇచ్చాం.
