id: NUM.8.20
reference: Numbers 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: te
  text: కాబట్టి మోషే, అహరోను, ఇశ్రాయేలీయుల సమాజమంతా లేవీయుల విషయమై యాహ్వే మోషేకు ఆజ్ఞాపించినదంతా లేవీయులకు చేశారు; ఇశ్రాయేలీయులు వారికి అలాగే చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ఇశ్రాయేలు కుమారులు.” ఇది ఇశ్రాయేలు ఒడంబడిక సమాజాన్ని సూచించే సాధారణ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: చేశారు
  rationale: עשה అనే విస్తృతార్థక క్రియను, ఇక్కడ నిర్దిష్ట ఆచార చర్యలను అనవసరంగా వివరించకుండా, సహజమైన తెలుగు ‘చేశారు’గా అనువదించాం.
- source_word: עֲדַת
  choice: సమాజమంతా
  rationale: עֵדָה ఒడంబడికకు చెందిన సమూహాన్ని సూచిస్తుంది. ‘సమాజమంతా’ అనే పదబంధం దాని సామూహిక భావాన్నీ כָל యొక్క సంపూర్ణతనూ సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఆధునిక తెలుగులో అది మొత్తం ఒడంబడిక సమాజాన్ని సూచించేందుకు ‘ఇశ్రాయేలు ప్రజలు’ అని సహజంగా అనువదించబడింది; అక్షరార్థం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: לַלְוִיִּם / לָהֶם
  choice: లేవీయుల విషయంలో / వారికి
  rationale: మొదటి לְ సందర్భంలో యెహోవా ఆజ్ఞకు సంబంధించిన విషయాన్ని సూచించగా, మిగతా ప్రయోగాలు లేవీయులపట్ల జరిగిన చర్యలను సూచిస్తాయి. తెలుగులో ఈ సంబంధాలను స్పష్టంగా, అతివ్యాఖ్య లేకుండా వేరు చేశాం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: כֹל యొక్క సమగ్ర భావాన్ని ‘అంతా’ నిలుపుతుంది; ‘ప్రకారం’ అనే భావం చివరి ‘అలాగే’లో సహజంగా వ్యక్తమవుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: చర్యకు ముందే ఇచ్చిన ఆజ్ఞను తెలుగు సంబంధకృదంత నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చాం.
- source_word: כֵּן
  choice: అలాగే
  rationale: ఆజ్ఞకు సరిగ్గా అనుగుణంగా వారు ప్రవర్తించారనే పునరుద్ఘాటనను ‘అలాగే’ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక నుడికారం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పురుషులను మాత్రమే వేరుచేయడం ఉద్దేశం కాదు; మొత్తం ఒడంబడిక సమాజమే భావం. అందువల్ల సహజమైన సామూహిక రూపాన్ని ప్రధాన పాఠంలో ఉంచి, హీబ్రూ అక్షరార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. హీబ్రూ వాక్యంలోని పునరుక్తిని తొలగించకుండా నిలిపి, సంబంధాలను తెలుగులో సహజంగా వ్యక్తం చేశాం.
