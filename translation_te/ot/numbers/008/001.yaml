lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అనేది మాట్లాడడాన్ని సూచిస్తుంది; తరువాతి לֵאמֹר నేరుగా వచ్చే మాటలను పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘మోషేతో ఇలా అన్నాడు’ సహజంగా ఉండి హీబ్రూ వాక్యసూత్ర భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో אֶל సంభాషణ లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘మోషేతో’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ infinitive construct తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సూత్రప్రయోగం. తెలుగులో ‘ఇలా అన్నాడు:’ తదుపరి వచనంలోని మాటలకు సహజంగా దారి తీస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం దైవనామాన్నే ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా ఉంచాం. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఇచ్చాం; ‘యాహ్వే’ అనే పునర్నిర్మిత ఉచ్చారణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యారంభంలోని wawను ప్రత్యేకంగా ‘మరియు’ అని యాంత్రికంగా చూపకుండా, తెలుగు కథన ప్రవాహంలో సహజంగా వ్యక్తం చేశాం. తరువాతి ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు ద్విబిందువు వాడాం.
