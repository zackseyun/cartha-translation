id: NUM.8.10
reference: Numbers 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: te
  text: నీవు లేవీయులను యాహ్వే[a] సన్నిధికి తీసుకురావాలి; ఇశ్రాయేలు కుమారులు[b] తమ చేతులను లేవీయులపై ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని నామం יהוה (YHWH) ఉంది.
    reason: దైవనామం మూలపాఠంలో ప్రత్యక్షంగా ఉన్నదని తెలియజేయడం.
  - marker: b
    text: లేదా “ఇశ్రాయేలీయులు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ సామూహిక ప్రయోగం.
    reason: అక్షరార్థ రూపానికి సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని వివరించడం.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: తీసుకురావాలి
  rationale: קרב హిఫిల్ రూపానికి ‘దగ్గరకు తీసుకురావడం’ లేదా ఆచారపరంగా ‘సమర్పించడం’ అనే భావం ఉంది. לִפְנֵיతో కలిసి ‘సన్నిధికి తీసుకురావాలి’ అనడం దిశా భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే బహువచన నామానికి తెలుగులో స్థిరమైన రూపం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధికి
  rationale: לִפְנֵי అంటే ‘ముందుకు’ లేదా ‘సన్నిధిలో/సన్నిధికి’. తీసుకురావడం అనే క్రియతో ‘సన్నిధికి’ సహజంగా ఉండి ఆచారపరమైన సమక్ష భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: וְסָמְכוּ
  choice: ఉంచాలి
  rationale: סמך + ‘చేతులు ... మీద’ అనే ఆచారపరమైన నిర్మాణం చేతులు మోపడం/ఉంచడం అనే చర్యను సూచిస్తుంది. ‘తమ చేతులను ... మీద ఉంచాలి’ మూలంలోని బహువచనాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని అక్షరార్థ రూపమైన ‘ఇశ్రాయేలు కుమారులు’ను నిలిపి, దాని సామూహిక ప్రయోగాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: יְדֵיהֶם
  choice: తమ చేతులను
  rationale: ‘వారి చేతులు’ అనే బహువచన భావాన్ని తెలుగులో కర్తతో సహజంగా అనుసంధానించేందుకు ఆత్మవాచకమైన ‘తమ’ను వాడింది.
- source_word: עַל הַלְוִיִּם
  choice: లేవీయుల మీద
  rationale: చేతులు ఉంచే ఆచారపరమైన నిర్మాణంలో עַלకు సహజమైన తెలుగు సమానార్థకం ‘మీద’.
theological_decisions:
- issue: ఒడంబడిక నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా వ్యక్తినామంగానే నిలిపింది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; మూలంలోని నామం నేరుగా ఉందని పాదటిప్పణి తెలియజేస్తుంది.
- issue: בְנֵי יִשְׂרָאֵל యొక్క లింగసూచక సామూహిక రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠంలో ప్రతిబింబిస్తూ, అది ఇశ్రాయేలు ప్రజలను సూచించే ప్రామాణిక సామూహిక పదబంధమని పాదటిప్పణిలో స్పష్టం చేసింది.
translation_notes:
  register: ఆచారపరమైన గంభీరతను నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సరళమైన వాక్యనిర్మాణం వాడబడింది. ఏకవచన ఆజ్ఞ ‘నీవు ... తీసుకురావాలి’గాను, తరువాతి బహువచన కర్తకు ‘ఉంచాలి’గాను ఇవ్వబడింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
