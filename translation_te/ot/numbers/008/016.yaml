revisions:
- from: ఎందుకంటే, ఇశ్రాయేలు కుమారులలోనుండి వారు నాకు పూర్తిగా అర్పించబడినవారు[a]. గర్భాన్ని తెరచే ప్రతి ఒక్కరి స్థానంలో—అంటే ఇశ్రాయేలు కుమారులలోని ప్రతి తొలిచూలు కుమారుని స్థానంలో[b][c]—వారిని నా కోసం నేను తీసుకున్నాను.
  to: ఎందుకంటే, ఇశ్రాయేలు కుమారులలోనుండి వారు నాకు పూర్తిగా ఇవ్వబడినవారు[a]. గర్భాన్ని తెరచే ప్రతి ఒక్కరి స్థానంలో—అంటే ఇశ్రాయేలు కుమారులలోని ప్రతి తొలిపుట్టిన కుమారుని స్థానంలో[b][c]—వారిని నాకోసం తీసుకున్నాను.
