source:
  edition: WLC
  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: te
  text: ఎందుకంటే, ఇశ్రాయేలు కుమారులలోనుండి వారు నాకు పూర్తిగా ఇవ్వబడినవారు[a]. గర్భాన్ని తెరచే ప్రతి ఒక్కరి స్థానంలో—అంటే ఇశ్రాయేలు కుమారులలోని ప్రతి తొలిపుట్టిన కుమారుని స్థానంలో[b][c]—వారిని నాకోసం తీసుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇవ్వబడినవారు’ అనే మాట రెండుసార్లు వచ్చి బలమైన ఉద్ఘాటనను ఇస్తుంది; ‘నిశ్చయంగా ఇవ్వబడినవారు’ లేదా ‘సంపూర్ణంగా ఇవ్వబడినవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘గర్భాన్ని తెరచే ప్రతి ఒక్కరు’; ఇది తొలిపుట్టినవాణ్ణి సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ వ్యక్తీకరణను ‘ఇశ్రాయేలు ప్రజలు’ లేదా ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: పూర్తిగా అర్పించబడినవారు
  rationale: נתן అనే క్రియకు చెందిన నిష్క్రియార్థక రూపం రెండుసార్లు రావడం బలమైన ఉద్ఘాటనను సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ సంపూర్ణ సమర్పణ భావాన్ని ‘పూర్తిగా అర్పించబడినవారు’ వ్యక్తపరుస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: మొదటి לִי దేవునికి అంకితం చేయబడడం లేదా ఆయనకు చెందడం అనే భావాన్ని తెలియజేస్తుంది; ‘నాకు ... అర్పించబడినవారు’ తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోనుండి
  rationale: מִתּוֹךְ ఒక సమూహం మధ్యనుండి ఎంపికను సూచిస్తుంది. ‘లోనుండి’ ఆ భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని కుటుంబసంబంధ పురుషవాచక రూపాన్ని నిలుపుతుంది.
- source_word: תַּחַת
  choice: స్థానంలో
  rationale: 'ఇక్కడ תַּחַת ప్రతిస్థాపనను సూచిస్తుంది: లేవీయులు తొలిచూలు కుమారులకు బదులుగా తీసుకోబడ్డారు. ‘స్థానంలో’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: గర్భాన్ని తెరచే ప్రతి ఒక్కరు
  rationale: మూలంలోని ‘గర్భాన్ని తెరచేవాడు’ అనే చిత్రాత్మక నుడికారాన్ని నిలుపుతూ, అది మొదట పుట్టినవాణ్ణి సూచిస్తుందని తరువాతి వివరణాత్మక పదబంధం స్పష్టం చేస్తుంది.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోని ప్రతి తొలిచూలు కుమారుడు
  rationale: ఈ పదబంధం ముందున్న నుడికారాన్ని వివరిస్తుంది. ‘ప్రతి తొలిచూలు కుమారుడు’ సందర్భంలోని మానవ పురుష ప్రథమసంతాన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: వారిని నా కోసం నేను తీసుకున్నాను
  rationale: పూర్తయిన దైవిక స్వీకరణను క్రియ తెలియజేస్తుంది; చివరి לִי దేవుని వ్యక్తిగత హక్కు, ఉద్దేశం రెండింటినీ సూచిస్తుంది. ‘నా కోసం’ ఈ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు; ఇశ్రాయేలీయులు
  rationale: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అనే పురుషవాచక కుటుంబసంబంధ వ్యక్తీకరణ ఉంది. సందర్భంలో ఇది ఇశ్రాయేలును సమష్టిగా సూచించినప్పటికీ, అనువాదం మూలరూపాన్ని నిలుపుతుంది.
- issue: లేవీయుల ప్రతిస్థాపన భావం
  choice: తొలిచూలు కుమారుల స్థానంలో లేవీయులను దేవుడు తీసుకున్నాడు
  alternative: తొలిచూలు కుమారులతో మార్పిడిగా లేవీయులను తీసుకున్నాడు
  rationale: תַּחַת ప్రతిస్థాపనను స్పష్టంగా సూచిస్తుంది; అయితే వచనం వివరించని విమోచన లేదా బలిసంబంధ సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా ‘స్థానంలో’ అని మాత్రమే ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘తొలిచూలు కుమారుడు’ సాధారణ పాఠకునికి గ్రాహ్యంగా ఉండి, సందర్భంలోని పురుష ప్రథమసంతాన సూచనను నిలుపుతుంది. మూలంలోని ఉద్ఘాటనను అసహజమైన పదపునరుక్తికి బదులుగా ‘పూర్తిగా’ ద్వారా వ్యక్తపరచి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
