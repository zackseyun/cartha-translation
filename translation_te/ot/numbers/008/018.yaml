  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులలోని[a] ప్రతి మొదటి సంతానానికి బదులుగా నేను లేవీయులను తీసుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులలోని.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులలోని” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: నేను ... తీసుకున్నాను
  rationale: לקח క్రియ యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతుంది. ఈ సందర్భంలో నియమించుకోవడం అనే భావం ఉన్నప్పటికీ, దాన్ని వివరణాత్మకంగా విస్తరించదు.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: నిర్దిష్ట బహువచన నామవాచకం; లేవి గోత్రానికి చెందిన లేవీయులను సూచిస్తుంది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఇక్కడ స్థలసంబంధమైన ‘కింద’ అనే అర్థం కాకుండా ప్రతినిధిగా ఒకరి స్థానంలో మరొకరిని తీసుకోవడం అనే ప్రత్యామ్నాయ భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל בְּכוֹר
  choice: ప్రతి మొదటి సంతానానికి
  rationale: ఏకవచనమైన בְּכוֹר తో కూడిన כָּל పంపిణీ భావంలో ‘ప్రతి’ అని అర్థమిస్తుంది. ‘మొదటి సంతానం’ మూలంలోని firstborn భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ప్రధాన పాఠ్యంలో ‘మగవాడు’ అనే సందర్భసూచిత వివరాన్ని అదనంగా చేర్చదు.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోని
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే స్పష్టమైన రూపాన్ని నిలుపుతూ, בְּ ఉపసర్గకు ఇక్కడ ఉన్న సమూహంలోని/మధ్య అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హెబ్రీ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది. అందువల్ల ప్రధాన పాఠ్యం దాని పురుష బహువచన రూపాన్ని నిలుపుతుంది; అయితే అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచించగలదనే భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘బదులుగా’ ప్రత్యామ్నాయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘మొదటి సంతానం’ అనవసరంగా లింగాన్ని జోడించకుండా మూలపద భావాన్ని అందిస్తుంది.
