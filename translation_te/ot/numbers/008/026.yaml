  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: te
  text: అయితే అతడు ప్రత్యక్ష గుడారంలో తన సహోదరులతో కలిసి, అప్పగించిన బాధ్యతను నిర్వర్తించడానికి పరిచర్య చేయవచ్చు; కానీ అతడు సేవాపని చేయకూడదు.[a] లేవీయులకు వారి బాధ్యతల విషయంలో నీవు ఈ విధంగా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కానీ అతడు శ్రమతో కూడిన పని చేయకూడదు.” ఇక్కడ అనుమతించబడిన పరిచర్యకు, వయస్సు దాటిన లేవీయుడు ఇక చేయనవసరం లేని సాధారణ సేవాపనికి మధ్య హెబ్రీ పాఠం తేడా చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: పరిచర్య చేస్తూ... నిర్వర్తించవచ్చు
  rationale: שרת పవిత్ర స్థలానికి సంబంధించిన సహాయక పరిచర్యను సూచిస్తుంది. ముందటి వచనంలోని విరమణకు వ్యతిరేకంగా, ఇక్కడ కొనసాగించగల పరిమిత భాగస్వామ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: אֶת־אֶחָיו
  choice: తన సహోదరులతో కలిసి
  rationale: సహోదరులు అనే బంధుత్వ పదాన్ని నిలిపి, సందర్భానుసారం తోటి లేవీయులతో కలిసి పనిచేయడమనే సహవాస భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵדకు తెలుగు బైబిలు వాడుకలో పరిచితమైన, అర్థవంతమైన సమానార్థకం.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: అప్పగించిన బాధ్యతను నిర్వర్తించవచ్చు
  rationale: క్రియతో దాని సహజాత నామవాచకం కలసి అప్పగించబడిన బాధ్యతను నెరవేర్చడాన్ని సూచిస్తాయి; కేవలం కాపలా అనే సంకుచిత అర్థాన్ని విధించదు.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: కానీ అతడు సేవాపని చేయకూడదు
  rationale: עֲבֹדָה/עבד పదపునరుక్తిలోని బలాన్ని సేవాపని అనే పదంతో తెలిపి, ముందున్న అనుమతించబడిన పరిచర్యకు దీనిని భిన్నంగా ఉంచింది.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם בְּמִשְׁמְרֹתָם
  choice: లేవీయుల బాధ్యతల విషయంలో నీవు ఈ విధంగా చేయాలి
  rationale: నియమాన్ని ముగించే ఆదేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, מִשְׁמְרֹתָםలోని అప్పగించబడిన బాధ్యతల భావాన్ని నిలిపింది.
theological_decisions:
- issue: నిర్దేశిత వయస్సు దాటిన లేవీయుడు కొనసాగించగల పరిచర్యకు, అతడు చేయకూడని సేవాపనికి మధ్య తేడా
  choice: తోటి లేవీయులతో కలిసి బాధ్యతను నిర్వర్తించే సహాయక పరిచర్యకు అనుమతి ఉంది; సాధారణ సేవాపని మాత్రం నిషిద్ధం.
  alternative: ఆ వయస్సు తరువాత అన్ని రకాల సేవ పూర్తిగా నిషిద్ధం; లేదా కేవలం కాపలా పని మాత్రమే అనుమతించబడింది.
  rationale: שרתకు మరియు עֲבֹדָה...עבדకు మధ్య ఉన్న ఉద్దేశపూర్వక వ్యత్యాసం సంపూర్ణ నిషేధం కాకుండా పనుల మధ్య తేడాను సూచిస్తుంది. అనువాదం 'పరిచర్య' మరియు 'సేవాపని' అనే వేర్వేరు పదాలతో ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టంగా ఉండే శైలి. 'ప్రత్యక్ష గుడారం' స్థిరపడిన బైబిలు పదప్రయోగంగా ఉంచబడింది. ఒకే అడుగంటిలో ప్రధానమైన సేవ/శ్రమ ప్రత్యామ్నాయాన్ని, అలాగే పరిచర్య–సేవాపని మధ్య మూలపాఠ వ్యత్యాసాన్ని వివరించాం.
