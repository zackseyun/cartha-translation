- from: 'అహరోను అలాగే చేశాడు: దీపస్తంభం ముందువైపు వెలుగు పడేలా[a] దాని దీపాలను వెలిగించాడు[b]. యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే అతడు చేశాడు.'
  to: 'అహరోను అలాగే చేశాడు: దీపస్తంభం ముందుభాగం వైపు[a] దాని దీపాలను అమర్చాడు[b]; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే.'
  rationale: The revision removes the imported ‘so that light falls’ result and directly renders the Hebrew spatial orientation as ‘దీపస్తంభం ముందుభాగం వైపు.’ It uses ‘అమర్చాడు’ for the potentially ambiguous verb הֶעֱלָה, matching the placement focus of the verse, while preserving the ‘lit’ interpretation in a footnote. Both source footnote anchors are retained and correctly placed.
