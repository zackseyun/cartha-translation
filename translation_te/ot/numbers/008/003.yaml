  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: te
  text: 'అహరోను అలాగే చేశాడు: దీపస్తంభం ముందుభాగం వైపు[a] దాని దీపాలను అమర్చాడు[b]; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దీపస్తంభం ముందుభాగానికి ఎదురుగా’ లేదా ‘దీపస్తంభం ముందుభాగం వైపు తిరిగేలా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని దీపాలను వెలిగించాడు.’ హీబ్రూ క్రియకు దీపాలను పైకి ఉంచడం అనే అక్షరార్థం ఉండవచ్చు; ఈ సందర్భంలో అది వాటిని అమర్చడాన్ని లేదా వెలిగించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: అహరోను అలాగే చేశాడు
  rationale: ఈ హీబ్రూ ప్రయోగం ముందుగా ఇచ్చిన ఆజ్ఞ ప్రకారమే అహరోను చేశాడని సూచిస్తుంది. ‘అలాగే చేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, כֵּן యొక్క పునఃసూచన భావాన్ని నిలుపుతుంది.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: దీపస్తంభం ముందువైపు వెలుగు పడేలా
  rationale: ఈ సంయుక్త పదబంధం దీపస్తంభం ముఖం లేదా ముందుభాగం వైపున్న దిశను సూచిస్తుంది. సందర్భంలో దీపాలు ఏ వైపుకు వెలుగు ఇవ్వాలో చెప్పబడుతున్నందున ఈ రూపం తెలుగులో సహజంగా ఆ దిశాభావాన్ని తెలియజేస్తుంది; స్థల అమరికను అతిగా నిర్దిష్టం చేయదు.
- source_word: הַמְּנוֹרָה
  choice: దీపస్తంభం
  rationale: గుడార సందర్భంలోని מְנוֹרָהను సాధారణ పాఠకులకు అర్థమయ్యే వస్తువుపేరుగా అనువదించడం, ‘మెనోరా’ అని లిప్యంతరీకరించడం కంటే స్పష్టంగా ఉంటుంది.
- source_word: הֶעֱלָה
  choice: వెలిగించాడు
  rationale: עלה క్రియ యొక్క హిఫీల్ రూపం దీపాలతో వాడినప్పుడు వాటిని పైకి ఉంచడం లేదా వెలిగించడం అనే భావాన్ని ఇవ్వగలదు. ఈ సందర్భంలో దీపాలు వెలుగు ఇవ్వాలనే ఉద్దేశం ప్రధానంగా ఉన్నందున ‘వెలిగించాడు’ సహజమైన ఎంపిక; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: נֵרֹתֶיהָ
  choice: దాని దీపాలను
  rationale: נֵר అనేది దీపాన్ని లేదా దాని వెలుగును సూచించగలదు. స్త్రీలింగ ఏకవచన ప్రత్యయం దీపస్తంభాన్ని సూచిస్తున్నందున ‘దాని దీపాలను’ స్పష్టమైన, సందర్భోచిత అనువాదం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే
  rationale: దేవుడు ఇచ్చిన ఆజ్ఞకు అహరోను పూర్తిగా అనుగుణంగా నడుచుకున్నాడనే భావాన్ని ‘ఆజ్ఞాపించినట్టే’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా అందించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ఒక బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని నిలుపుతుంది.
- issue: הֶעֱלָה క్రియ దీపాలను అమర్చడాన్నా, వెలిగించడాన్నా సూచిస్తుంది?
  choice: వెలిగించాడు
  alternative: దీపాలను అమర్చాడు; పైకి ఉంచాడు
  rationale: దీపాలు ముందువైపు వెలుగు ఇవ్వాలనే తక్షణ సందర్భంలో ‘వెలిగించాడు’ సహజంగా సరిపోతుంది. అయినా హీబ్రూ క్రియలో అమర్చడం లేదా పైకి ఉంచడం అనే సాధ్యమైన భావం ఉన్నందున దాన్ని పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘దీపస్తంభం’ సాధారణ పాఠకులకు స్పష్టమైన పదం. మూలంలోని దిశాభావం మరియు הֶעֱלָה క్రియలోని నిజమైన అర్థసందిగ్ధత పాదసూచికల ద్వారా నిలుపబడ్డాయి.
