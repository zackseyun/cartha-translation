id: NUM.8.8
reference: Numbers 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ פַּ֣ר בֶּן בָּקָ֔ר וּ/מִנְחָת֔/וֹ סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן וּ/פַר שֵׁנִ֥י בֶן בָּקָ֖ר תִּקַּ֥ח לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: te
  text: అప్పుడు వారు ఒక కోడెదూడను, దానికి సంబంధించిన ధాన్యార్పణమైన నూనెతో కలిపిన సన్నని పిండిని తీసుకోవాలి; నీవు రెండవ కోడెదూడను పాపపరిహార బలిగా[a] తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుద్ధీకరణ బలిగా.” యాజక కర్మకాండ సందర్భాల్లో హీబ్రూ పదమైన חַטָּאת పాపపరిహార బలిని లేదా శుద్ధీకరణ బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: అప్పుడు వారు … తీసుకోవాలి
  rationale: కర్మకాండ సంబంధమైన ఆదేశాల క్రమంలో వచ్చిన సంయుక్త క్రియకు విధ్యర్థక భావం ఉంది; ‘అప్పుడు’ అనేది క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פַּר בֶּן בָּקָר
  choice: ఒక కోడెదూడ
  rationale: ‘పశువులలోని మగ దూడ’ అనే హీబ్రూ నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది; తరువాత చెప్పిన ‘రెండవ’ కోడెదూడతో భేదం స్పష్టమయ్యేందుకు ‘ఒక’ చేర్చబడింది.
- source_word: וּמִנְחָתוֹ
  choice: దాని ధాన్యార్పణంగా
  rationale: బలి సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ఏకవచన పుంలింగ ప్రత్యయం మొదటి కోడెదూడకు సంబంధించిన అర్పణను సూచిస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణల కోసం ఉపయోగించే సన్నగా మిల్లుచేసిన పిండిని సూచించే కర్మకాండ పదానికి స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: బలికి సంబంధించిన తయారీ విధానాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: నీవు రెండవ కోడెదూడను … తీసుకోవాలి
  rationale: ఇక్కడ క్రియ రెండవ పురుష ఏకవచనానికి మారుతుంది; ‘నీవు’ అని ఉంచడం ద్వారా హీబ్రూలోని సంబోధన మార్పు నిలుపబడింది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: యాజక కర్మకాండ సందర్భంలో חַטָּאת సంప్రదాయంగా పాపానికి సంబంధించిన బలిని సూచిస్తుంది; దాని శుద్ధీకరణ కార్యాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: యాజక బలి నియమాల్లో חַטָּאת పదానికి అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలినీ, దాని శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సుపరిచితమైన అర్థాన్ని ఉంచి, కర్మకాండ సంబంధమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘వారు’ నుండి ‘నీవు’కు వచ్చే వ్యక్తి మార్పును మూలపాఠం ప్రకారం నిలిపాం; కర్మకాండ పదాలను అతి ప్రాచీనంగా కాకుండా సాధారణ పాఠకులకు అర్థమయ్యేలా ఇచ్చాం.
