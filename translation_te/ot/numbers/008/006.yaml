  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారులలోనుండి లేవీయులను తీసుకో; వారిని శుద్ధి చేయి.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’ అని కూడా అనువదించవచ్చు. అక్షరార్థం: ‘ఇశ్రాయేలు కుమారులు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: తీసుకొని
  rationale: לקח క్రియ యొక్క ఏకవచన పురుష ఆజ్ఞారూపం. మోషే ఇశ్రాయేలు సమాజం మధ్యనుండి లేవీయులను ప్రత్యేకంగా తీసుకోవాలనే ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: గుడార సేవకు నియమించబడిన లేవి గోత్రస్థులను సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: מִתּוֹךְ
  choice: మధ్యనుండి
  rationale: ఒక పెద్ద సమూహం లోపలినుండి వేరుచేసి తీసుకోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: హీబ్రూ మూలంలోని కుటుంబపరమైన, నిబంధనపరమైన సంబోధనను మరియు వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని నిలుపుతుంది.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: వారిని శుద్ధి చేయి
  rationale: ఈ సందర్భంలో טהר ఆచారపరమైన శుద్ధీకరణను సూచిస్తుంది; ‘శుద్ధి చేయి’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే కుటుంబపరమైన నిబంధనాభివ్యక్తిని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన సామూహిక ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇస్తుంది.
- issue: טהר యొక్క ఆచారపరమైన భావం
  choice: శుద్ధి చేయి
  alternative: పవిత్రపరచు; శుభ్రపరచు
  rationale: ఇక్కడ క్రియ సాధారణ భౌతిక శుభ్రతను గానీ, కేవలం నైతిక పవిత్రతను గానీ కాకుండా ఆచారపరమైన శుద్ధీకరణను సూచిస్తుంది; ‘శుద్ధి చేయి’ ఆ భావాన్ని అతిగా వివరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘మధ్యనుండి’ వేరుచేయడాన్ని, ‘శుద్ధి చేయి’ ఆచారపరమైన శుద్ధీకరణను తెలియజేస్తాయి. మూలంలోని కుటుంబపరమైన ‘ఇశ్రాయేలు కుమారులు’ ప్రధాన పాఠ్యంలో నిలుపబడింది.
