  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: te
  text: యాభై సంవత్సరాల వయస్సు నుండి అతడు సేవా విధి నుండి విరమించాలి; ఇకపై సేవ చేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవా విధి నుండి వెనుదిరగాలి.” హీబ్రూ క్రియకు అక్షరార్థంగా “తిరుగు/వెనుదిరుగు” అని అర్థం; ఇక్కడ అది క్రియాశీల విధి నుండి విరమించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: అయితే యాభై ఏళ్ల వయస్సు వచ్చినప్పటి నుండి
  rationale: מִבֶּן ... שָׁנָה అనే హీబ్రూ వయస్సు సూచక నుడికారం ఆ వయస్సు నుండి వర్తించే పరిమితిని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יָשׁוּב
  choice: విరమించాలి
  rationale: שוב యొక్క ప్రాథమిక అర్థం ‘తిరుగు/వెనుదిరుగు’; מן తో కూడిన ఈ పరిపాలనా సందర్భంలో క్రియాశీల విధి నుండి తప్పుకోవడం అనే భావం ఉంది. ‘విరమించాలి’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: పని చేసే సేవ నుండి
  rationale: צָבָא ఇక్కడ సైనిక దళాన్ని కాక లేవీయుల నియమిత సేవను సూచిస్తుంది; עֲבֹדָה పనిని సూచిస్తుంది. ‘పని చేసే సేవ’ అనే రూపం రెండు పదాల అనుబంధాన్ని పూర్తిగా కలిపివేయకుండా నిలుపుతుంది.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: ఇకపై ఆ పని చేయకూడదు
  rationale: עבד ఇక్కడ అప్పగించబడిన క్రియాశీల పనిని చేయడాన్ని సూచిస్తుంది. ‘ఇకపై ఆ పని చేయకూడదు’ కొనసాగుతున్న విధి ముగుస్తుందని స్పష్టంగా తెలుపుతుంది; తరువాతి వచనంలో సహాయక పాత్రకు ఉన్న అవకాశాన్ని అనవసరంగా నిరాకరించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ పదబంధంలోని ‘సేవ/పని’ భేదాన్ని సాధ్యమైనంతవరకు నిలిపి, యాభై ఏళ్ల తరువాత అన్ని రకాల సహాయం నిషిద్ధమని అతివ్యాఖ్యానించకుండా క్రియాశీల పనినే సూచించబడింది.
