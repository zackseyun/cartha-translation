  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: יהוה (YHWH); సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. ‘యెహోవా’ అనేది మరో లిప్యంతరీకరణ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే ఈ సూత్రప్రాయ నిర్మాణంలో דבר అంటే ‘మాట్లాడాడు’ అని కూడా అనువదించవచ్చు; అయితే వెంటనే వచ్చే ప్రత్యక్ష వాక్యానికి సహజమైన ఆధునిక తెలుగు పరిచయంగా ‘అన్నాడు’ సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటాన్ని సూచించే క్రియతో אֶל సంబోధిత వ్యక్తిని గుర్తిస్తుంది. తెలుగులో ‘మోషేతో’ అనేది సహజమైన సమానార్థక నిర్మాణం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే לֵאמֹרను తెలుగులో సహజంగా ‘ఇలా అన్నాడు:’ అనే రూపంలో వ్యక్తం చేశాం; దీని భావం ప్రధాన క్రియతో కలిసిపోయింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఉచ్చారణ పునర్నిర్మాణాన్ని ప్రతిబింబించే ‘యాహ్వే’ కూడా సాధ్యమే; తెలుగు పాఠకులకు సంప్రదాయంగా పరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితంగా మరియు సాధారణ పాఠకులకు సహజంగా రూపొందించాం. తదుపరి ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు చివర ద్విబిందువు వాడాం.
