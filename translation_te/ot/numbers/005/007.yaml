id: NUM.5.7
reference: Numbers 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: te
  text: అప్పుడు వారు తాము చేసిన పాపాన్ని ఒప్పుకోవాలి. అతడు తాను చేసిన అపరాధానికి పూర్తి పరిహారం చెల్లించి, దానికి ఐదోవంతు కలిపి,[a] తాను ఎవరిపట్ల అపరాధం చేశాడో వారికి దానిని ఇవ్వాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అసలు పరిహార మొత్తానికి అదనంగా ఇరవై శాతం కలపాలి.
    reason: clarification
  - marker: b
    text: మరింత వాడుకగా, ‘తాను అన్యాయం చేసిన వ్యక్తికి’ అని అనువదించవచ్చు. హీబ్రూ వాక్యం అక్షరార్థంగా, అతడు ఎవరికి సంబంధించి అపరాధబాధ్యత వహించాడో ఆ వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: అప్పుడు వారు ... ఒప్పుకోవాలి
  rationale: హిత్పయేల్ రూపం చేసిన తప్పును బహిరంగంగా అంగీకరించడాన్ని సూచిస్తుంది; సందర్భంలోని ఆజ్ఞాత్మక న్యాయబలాన్ని ‘ఒప్పుకోవాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: తాము చేసిన పాపాన్ని
  rationale: חַטָּאת ఇక్కడ ఒప్పుకోవలసిన పాపం లేదా అపరాధాన్ని సూచిస్తుంది; ‘చేసిన పాపం’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలానికి దగ్గరగా ఉంది.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: తాను చేసిన అపరాధానికి పూర్తి పరిహారం చెల్లించి
  rationale: שוב హిఫిల్ ఇక్కడ తిరిగి చెల్లించడాన్ని, אָשָׁם అపరాధం వల్ల కలిగిన బాధ్యత లేదా పరిహారాన్ని, בְּרֹאשׁוֹ అసలు మొత్తాన్ని సూచిస్తాయి. బలి అనే భావాన్ని రుద్దకుండా ఆర్థిక పరిహార భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: దానికి ఐదోవంతు కలిపి
  rationale: అసలు మొత్తానికి అదనంగా దానిలో ఐదోవంతు, అంటే ఇరవై శాతం, చేర్చాలని మూలం చెబుతుంది.
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: తాను ఎవరిపట్ల అపరాధం చేశాడో వారికి దానిని ఇవ్వాలి
  rationale: హీబ్రూ నిర్మాణం అపరాధం ఎవరికి సంబంధించి కలిగిందో వారిని పరిహారం స్వీకర్తగా గుర్తిస్తుంది. ‘ఎవరిపట్ల అపరాధం చేశాడో’ ఈ బాధ్యత భావాన్ని కాపాడుతూ తెలుగులో అర్థవంతంగా ఉంది.
theological_decisions:
- issue: పరిహార సందర్భంలో אָשָׁם అర్థం
  choice: అపరాధం వల్ల ఏర్పడిన బాధ్యతకు చెల్లించే పరిహారం
  alternative: అపరాధ పరిహార బలి
  rationale: ఈ వాక్యంలో ఒప్పుకోలు, అసలు మొత్తం తిరిగి చెల్లించడం, దానికి ఐదోవంతు కలపడం, బాధితునికి ఇవ్వడం ప్రధానాంశాలు. కాబట్టి ఇక్కడ אָשָׁם బలిని కాకుండా అపరాధం వల్ల ఏర్పడిన ఆర్థిక బాధ్యతను సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన భావం స్పష్టంగా ఉండేలా, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. బహువచన ఒప్పుకోలు నుండి ఏకవచన పరిహార చెల్లింపుకు మూలంలోని మార్పు అలాగే ఉంచబడింది.
