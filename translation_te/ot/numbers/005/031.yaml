translation:
  language: te
  text: అప్పుడు ఆ పురుషుడు దోషం నుండి విడుదల పొందుతాడు[a]; అయితే ఆ స్త్రీ తన దోషాన్ని భరిస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భర్త దోషం నుండి విడుదల పొందుతాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన పాపాన్ని భరిస్తుంది’; హీబ్రూ నుడికారం దోషం వల్ల కలిగే పరిణామాలను భరించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: విడుదల పొందుతాడు
  rationale: נקה నిఫాల్ రూపం బాధ్యత లేదా దోషం నుండి విముక్తి పొందడాన్ని సూచిస్తుంది. מִן‌తో వచ్చిన నిర్మాణానికి ‘విడుదల పొందుతాడు’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הָאִישׁ
  choice: ఆ పురుషుడు
  rationale: אִישׁ‌కు ప్రాథమిక అర్థం ‘పురుషుడు’; సందర్భంలో ఇతడు భర్త అయినప్పటికీ, ప్రధాన పాఠం మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది.
- source_word: מֵעָוֺן
  choice: దోషం నుండి
  rationale: עָוֹן పాపం, దోషం, లేదా దాని వల్ల కలిగే బాధ్యతను సూచించగలదు. נקהతో కలిసినప్పుడు ‘దోషం నుండి’ అనేది నైతిక-న్యాయ బాధ్యత నుండి విముక్తిని వ్యక్తం చేస్తుంది.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: అయితే ఆ స్త్రీ
  rationale: וְ సాధారణంగా ‘మరియు’ అయినా, ఇక్కడ రెండు పరిణామాల మధ్య వ్యత్యాసం ఉంది; ‘అయితే’ దానిని సహజంగా తెలియజేస్తుంది. ‘ఆ స్త్రీ’ הַהִואలోని సూచనను నిలుపుతుంది.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: తన దోషాన్ని భరిస్తుంది
  rationale: נשׂא עָוֹן అనే హీబ్రూ నుడికారం దోషాన్ని మోయడం, దాని పరిణామాలను భరించడం అనే అర్థాలను కలిగి ఉంటుంది. ‘తన దోషాన్ని భరిస్తుంది’ ఆ నుడికారాన్ని వ్యాఖ్యానించి విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: రెండు ఉపవాక్యాల్లో עָוֹן అర్థం
  choice: రెండుచోట్లా ‘దోషం’ అనే పదంతో నైతిక-న్యాయ సమాంతరాన్ని నిలుపడం
  alternative: ‘పాపం’ లేదా ‘పాపానికి శిక్ష’
  rationale: ఈ వాక్యం పురుషుడు దోషబాధ్యత నుండి విడుదల పొందడాన్ని, స్త్రీ తన దోషాన్ని భరించడాన్ని వ్యతిరేక సమాంతరంగా చూపుతుంది. ‘దోషం’ ఈ ఉద్రిక్తతను అతిగా వ్యాఖ్యానించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ వాక్యంలోని న్యాయ-నైతిక సమాంతరాన్ని, ‘దోషాన్ని భరించడం’ అనే నుడికారంలోని ఉద్దేశపూర్వక అర్థవిస్తృతిని నిలుపింది.
