source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: te
  text: 'తరువాత యాజకుడు ఆమెతో ప్రమాణం చేయించి, ఆ స్త్రీతో ఇలా చెప్పాలి: “ఏ పురుషుడూ నీతో శయనించకపోతే, నీ భర్తతో వివాహబంధంలో ఉండగా నీవు అపవిత్రతలోకి దారితప్పకపోతే[a], శాపాన్ని కలిగించే ఈ చేదు నీళ్ల నుండి విముక్తురాలివై ఉండు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ భర్త కింద అపవిత్రతలోకి దారితప్పకపోతే.” ఇది ఆమె వివాహబంధంలో ఉన్న స్థితిని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “శాపాన్ని కలిగించే ఈ చేదు నీళ్ల నుండి నిర్దోషిగా ఉండు.” అక్షరార్థంగా, “ఈ చేదు, శాపాన్ని కలిగించే నీళ్ల నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: ఆమెతో ప్రమాణం చేయించి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: ఏ పురుషుడూ నీతో శయనించకపోతే
  rationale: శారీరక సంబంధాన్ని సూచించే హీబ్రూ మర్యాదోక్తిని అసభ్యంగా కాకుండా, అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: שָׂטִית טֻמְאָה
  choice: అపవిత్రతలోకి దారితప్పకపోతే
  rationale: దారి తప్పడం అనే రూపకాన్నీ, అపవిత్రతలోకి వెళ్లడం అనే నైతిక-ఆచార సంబంధ ఉద్వేగాన్నీ నిలుపుతుంది.
- source_word: תַּחַת אִישֵׁךְ
  choice: నీ భర్తకు లోబడి ఉండగా
  rationale: అక్షరార్థమైన ‘నీ భర్త కింద’కు బదులుగా, వివాహ బంధంలో ఉన్న స్థితిని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థవంతంగా అందిస్తుంది.
- source_word: הִנָּקִי
  choice: నీకు ఏ హానీ కలగకుండుగాక
  rationale: ఈ సందర్భంలో పరీక్షా జలాల శాపఫలితం నుండి నిర్దోషిగా విడిపోవడం లేదా హాని పొందకపోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; నిర్దోషిత్వం/విముక్తి అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים
  choice: శాపాన్ని కలిగించే ఈ చేదు నీళ్లు
  rationale: ‘చేదు నీళ్లు’ అనే కర్మకాండ సంబంధ పదబంధాన్నీ, శాపాన్ని కార్యరూపంలోకి తెచ్చే కృదంత భావాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: స్త్రీ చేసినదిగా అనుమానించబడే అపరాధ స్వభావం
  choice: శయనించడం, దారితప్పడం, అపవిత్రత అనే మూలభాషా పదచిత్రాలను నిలుపడం
  alternative: నేరుగా ‘వ్యభిచారం’ అని అనువదించడం
  rationale: సందర్భం వివాహేతర లైంగిక సంబంధాన్ని సూచించినా, హీబ్రూ వచనం దానిని పరోక్ష న్యాయ-కర్మకాండ భాషలో చెబుతుంది; అనువాదం దానికంటే ఎక్కువగా నిర్దిష్టీకరించదు.
- issue: చేదు నీళ్ల ప్రభావం
  choice: ‘శాపాన్ని కలిగించే’ అని అనువదించి, ఫలితాన్ని ‘హాని కలగకుండుగాక’గా వ్యక్తం చేయడం
  alternative: ‘శాపకరమైన నీళ్ల నుండి నిర్దోషివై ఉండు’ అనే మరింత అక్షరార్థ రూపం
  rationale: నీళ్లు శాపంతో ప్రభావవంతంగా అనుసంధానమై ఉన్నాయని మూలంలోని కృదంతం సూచిస్తుంది; అయితే ఈ వచనంలో దాని ఖచ్చిత కార్యవిధానాన్ని అదనంగా నిర్వచించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-కర్మకాండ శైలిని పాటించాం. ‘శయనించు,’ ‘అపవిత్రత,’ ‘శాపం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచుతూ, అసహజమైన అక్షరానువాదాన్ని పాదటిప్పణికి పరిమితం చేశాం.
