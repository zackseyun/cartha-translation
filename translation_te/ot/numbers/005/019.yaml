    issue: ‘నీ భర్తకు లోబడి ఉండగా’
    rationale: ఇది హీబ్రూ నుడికారాన్ని భర్త అధికారానికి లోబడటం అనే నిర్దిష్ట సామాజిక భావంగా మారుస్తుంది. ఇక్కడ సందర్భం వివాహబంధంలో ఉన్న స్థితి.
