revisions:
- from: 'తరువాత యాజకుడు ఆమెతో ప్రమాణం చేయించి, ఆ స్త్రీతో ఇలా చెప్పాలి: “ఏ పురుషుడూ నీతో శయనించకపోతే, నీ భర్తకు లోబడి ఉండగా నీవు అపవిత్రతలోకి దారితప్పకపోతే[a], శాపాన్ని కలిగించే ఈ చేదు నీళ్లవల్ల నీకు ఏ హానీ కలగకుండుగాక[b].”'
  to: 'తరువాత యాజకుడు ఆమెతో ప్రమాణం చేయించి, ఆ స్త్రీతో ఇలా చెప్పాలి: “ఏ పురుషుడూ నీతో శయనించకపోతే, నీ భర్తతో వివాహబంధంలో ఉండగా నీవు అపవిత్రతలోకి దారితప్పకపోతే[a], శాపాన్ని కలిగించే ఈ చేదు నీళ్ల నుండి విముక్తురాలివై ఉండు[b].”'
  rationale: వివాహ నుడికారాన్ని అధికారసంబంధంగా అతిగా అర్థం చేయకుండా ‘వివాహబంధంలో ఉండగా’గా సవరించాం. జలాల ప్రభావం నుండి మినహాయింపును తెలిపే ఆజ్ఞారూపాన్ని ‘విముక్తురాలివై ఉండు’గా పునరుద్ధరించాం. ఇతర పదచిత్రాలు మరియు మూలంలోని పరోక్ష లైంగిక-అపవిత్రత భాష యథాతథంగా ఉంచబడ్డాయి.
