source:
  edition: WLC
  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: te
  text: లేదా, ఒక పురుషునిపై అసూయ ఆత్మ వచ్చి[a], అతడు తన భార్య పట్ల అసూయపడి, ఆ స్త్రీని యాహ్వే సన్నిధిలో నిలబెట్టి, యాజకుడు ఆమె విషయంలో ఈ విధానమంతటినీ[b] అమలు చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిపైకి వచ్చి’; అక్షరార్థంగా, ‘అతనిపై దాటివచ్చి.’
    reason: lexical_alternative
  - marker: b
    text: ‘విధానం’ అనే పదానికి ‘ఉపదేశం,’ ‘నియమం,’ లేదా ‘ఆచార ప్రక్రియ’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: లేదా
  rationale: ముందటి ప్రత్యామ్నాయానికి మరొక ప్రత్యామ్నాయాన్ని జతచేసే హీబ్రూ విభక్తి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: మూలంలోని సాధారణ పదమైన ‘పురుషుడు’ను నిలుపుతుంది; తరువాత వచ్చే ‘తన భార్య’ అనే మాట వివాహ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: ఒక పురుషునిపై అసూయా ఆత్మ ఆవరించి
  rationale: ‘అసూయా ఆత్మ’ అనే మూలరూపాన్ని నిలుపుతూ, అది అంతరంగ ప్రవృత్తా లేక ఆధ్యాత్మిక ప్రభావమా అనే సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది. ‘ఆవరించి’ అనేది ‘అతనిపై దాటివచ్చి/వచ్చి’ అనే జాతీయాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: అతడు తన భార్యను గురించి అసూయపడి
  rationale: నామవాచకం, క్రియ రెండింటిలోనూ ఉన్న అసూయ భావాన్ని పునరావృతం చేస్తూ, భార్య పట్ల కలిగే వైవాహిక అసూయను సహజంగా తెలియజేస్తుంది.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: ఆ స్త్రీని యాహ్వే సన్నిధిలో నిలబెడితే
  rationale: హిఫీల్ రూపంలోని ‘నిలబడేలా చేయు/సమర్పించు’ భావాన్ని ఆచార సంబంధ సందర్భంలో నేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: యాజకుడు ఆమె విషయంలో … అమలు చేయాలి
  rationale: తెలుగులో అసహజంగా ఉండే ‘ఆమెకు చేయాలి’ అనే నేర అనువాదానికి బదులుగా, నిర్దేశిత యాజక విధి ఆమెకు వర్తింపజేయబడుతుందని స్పష్టం చేస్తుంది.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: ఈ విధినంతటినీ
  rationale: ఇక్కడ תּוֹרָה ముందుగా వివరించిన నియమిత ఆచార ప్రక్రియను సూచిస్తుంది. ‘విధి’ దాని నియమం మరియు ప్రక్రియ అనే రెండు పార్శ్వాలనూ సందర్భానుకూలంగా అందిస్తుంది.
theological_decisions:
- issue: ‘అసూయా ఆత్మ’ స్వభావం
  choice: అసూయా ఆత్మ
  alternative: అసూయాభావం; అసూయావేశం
  rationale: హీబ్రూ רוּחַ అనే పదాన్ని కేవలం మానసికావేశంగా కుదించకుండా, అంతరంగ ప్రవృత్తి లేదా ప్రభావశక్తి అనే మూల సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయ-ఆచార సందర్భానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ఈ వచనం ముందటి వాక్యానికి ప్రత్యామ్నాయ భాగంగా ఉండటాన్ని ‘లేదా’ మరియు షరతు నిర్మాణంతో నిలిపాం.
