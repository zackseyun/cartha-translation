source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: te
  text: తరువాత యాజకుడు ఆ స్త్రీని యహ్వే సన్నిధిలో నిలబెట్టి, ఆమె జుట్టును విప్పాలి[a]. జ్ఞాపకార్థమైన ధాన్యార్పణను—అది ఈర్ష్య ధాన్యార్పణ—ఆమె అరచేతులపై ఉంచాలి. శాపాన్ని కలిగించే చేదు నీళ్లు[b] యాజకుని చేతిలో ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ స్త్రీ తలను బయలుపరచాలి,’ లేదా ‘ఆమె జుట్టును వదులుగా ఉండనివ్వాలి.’ హీబ్రూ ప్రయోగం అక్షరార్థంగా స్త్రీ ‘తల’ను వదులుచేయడం అని చెబుతుంది; ఈ ఆచార సందర్భంలో అది బహుశా ఆమె కట్టిన జుట్టును విప్పడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ శాపాన్ని కలిగించే చేదు నీళ్లు.’ హీబ్రూ రూపం ఈ నీళ్లు శాపాన్ని కలిగిస్తాయని లేదా అమలు చేస్తాయని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: నిలబెట్టి
  rationale: עמד యొక్క హిఫీల్ రూపం ఇక్కడ ఆచార సందర్భంలో ఒకరిని నిలబెట్టడం లేదా సమర్పించడం అనే భావాన్ని ఇస్తుంది; ‘నిలబెట్టి’ మూలంలోని భౌతిక చర్యను సహజ తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: ఇది దేవుని సమక్షంలో నిలబడడాన్ని సూచించే ఆరాధనా సంబంధమైన ప్రయోగం; יהוה అనే దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: ఆమె జుట్టును విప్పాలి
  rationale: ప్రయోగం అక్షరార్థంగా స్త్రీ ‘తల’ను విప్పడం/బంధం తొలగించడం అంటుంది; సందర్భంలో కట్టిన జుట్టును విప్పడమే సంభావ్య భావం. ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: ఆమె అరచేతులపై ఉంచాలి
  rationale: כַּף అనేది అరచేతిని స్పష్టంగా సూచిస్తుంది; ఆచారంలోని స్పష్టమైన భంగిమను మూలానికి దగ్గరగా ఉంచాం.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: జ్ఞాపకార్థమైన ధాన్యార్పణ
  rationale: యాజక ఆచార సందర్భంలో מִנְחָה ధాన్యార్పణ; זִכָּרוֹן జ్ఞాపకం లేదా జ్ఞాపకార్థం అనే భావాన్ని ఇస్తుంది.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: అది ఈర్ష్యకు సంబంధించిన ధాన్యార్పణ
  rationale: קְנָאֹת రూపపరంగా బహువచనమైనా ఇక్కడ ఈర్ష్య/అసూయ అనే సారాంశ భావంలో ఉంది. మూలంలోని పునరుక్తిని నిలుపుతూ సంబంధాన్ని అతిగా నిర్వచించకుండా అనువదించాం.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: యాజకుని చేతిలో ఉండాలి
  rationale: మూలంలోని ఏకవచన ‘చేతి’ని నిలిపి, ఆచార సమయంలో యాజకుడు నీటిని పట్టుకొని ఉండడాన్ని సహజంగా తెలిపాం.
- source_word: מֵי הַמָּרִים
  choice: చేదు నీళ్లు
  rationale: హీబ్రూలోని బహువచన జలప్రయోగాన్ని సహజ తెలుగు సామూహిక రూపమైన ‘నీళ్లు’తో వ్యక్తం చేశాం.
- source_word: הַמְאָרֲרִים
  choice: శాపాన్ని కలిగించే
  rationale: ארר నుండి వచ్చిన కర్తరి వర్తమాన రూపం నీళ్లు శాపాన్ని అమలు చేయడం లేదా మోసుకురావడం అనే కార్యసాధక భావాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో నేరుగా ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా ఆమోదించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: קְנָאֹת యొక్క భావం
  choice: ఈర్ష్యకు సంబంధించిన
  alternative: అసూయార్పణ; అనుమానానికి సంబంధించిన
  rationale: ఈ పదం భర్త ఈర్ష్యను, దాంపత్య అనుమానాన్ని లేదా ఆచారపరమైన ‘ఈర్ష్యార్పణ’ను సూచించవచ్చు. ప్రధాన పాఠంలో సంబంధాన్ని విశాలంగా ఉంచి, ఏ ప్రత్యేక ధార్మిక వ్యాఖ్యానాన్నీ చొప్పించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు స్పష్టమైన ఆచార సంబంధ శైలిని వాడాం. ‘అరచేతులపై’ వంటి స్పష్టమైన రూపాలతో మూలంలోని భౌతిక చర్యలను నిలిపాం; సందిగ్ధమైన జుట్టు/తల ప్రయోగం మరియు శాపానికి సంబంధించిన నిర్దిష్టతను పాదసూచికల్లో సంరక్షించాం.
