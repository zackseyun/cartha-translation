  - severity: low
    issue: ‘ఈర్ష్యకు సంబంధించిన ధాన్యార్పణ’ is slightly more periphrastic than the source.
    rationale: The Hebrew repeats ‘grain offering’ in apposition and identifies it directly as a jealousy offering. ‘ఈర్ష్య ధాన్యార్పణ’ retains that compact designation without imposing an interpretation.
