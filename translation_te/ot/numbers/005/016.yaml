base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: te
  text: అప్పుడు యాజకుడు ఆమెను దగ్గరకు తీసుకొచ్చి, యాహ్వే[a] సన్నిధిలో ఆమెను నిలబెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH.’ సంప్రదాయ అనువాదాల్లో ‘ప్రభువు’ అని ఉంటుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: ఆమెను దగ్గరకు తీసుకొచ్చి
  rationale: קרב ధాతువు హిఫిల్ రూపంలో ‘దగ్గరకు తీసుకురావడం’ లేదా ‘సమర్పించడం’ అనే భావం ఇస్తుంది. ఇక్కడ స్త్రీని యెహోవా సన్నిధిలో నిలబెట్టడం వెంటనే చెప్పబడుతున్నందున, బలిగా సమర్పించే సాంకేతిక భావాన్ని అనవసరంగా చేర్చకుండా స్థలసంబంధమైన భావాన్ని నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధన, ధర్మశాస్త్ర సందర్భాల్లో כֹּהֵןకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וְהֶעֱמִדָהּ
  choice: ఆమెను నిలబెట్టాలి
  rationale: עמד ధాతువు హిఫిల్ రూపం ‘నిలబడేలా చేయడం’ అనే కారక భావాన్ని కలిగి ఉంది. తెలుగు వాక్యంలో ‘ఆమెను నిలబెట్టాలి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఒకరి ఎదుట లేదా సమక్షంలో ఉండడాన్ని సూచిస్తుంది. దేవుని సందర్భంలో ‘సన్నిధిలో’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా ఇచ్చాం; మూలంలోని వ్యక్తిగత దైవనామాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామ రూపంలో ఉంచాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. హీబ్రూ క్రియల కారక భావాన్ని నిలుపుతూ, అనవసరమైన సాంకేతిక బలి పరిభాషను నివారించాం.
