id: NUM.5.9
reference: Numbers 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] యాజకునికి సమర్పించే[c] పరిశుద్ధ కానుకలన్నిటిలోని[b] ప్రతి అర్పణ అతనిదే అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు,” లేదా “ఇశ్రాయేలు సంతానం.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పరిశుద్ధమైన వస్తువులు,” లేదా “పవిత్ర అర్పణలు.”
    reason: lexical_alternative
  - marker: c
    text: బలులు, కానుకల సందర్భంలో ఈ క్రియను “సమర్పించే” అని అనువదించవచ్చు; అక్షరార్థంగా “దగ్గరకు తీసుకువచ్చే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: అర్పణ
  rationale: ప్రత్యేకంగా వేరు చేసి దేవునికి లేదా యాజకునికి ఇచ్చే కానుకను సూచిస్తుంది. సాంకేతికంగా లేదా ప్రాచీనంగా వినిపించే పదం కంటే ‘అర్పణ’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: קָדְשֵׁי
  choice: పరిశుద్ధ కానుకలు
  rationale: కֹדֶשׁ పదం యొక్క బహువచన నిర్మాణ రూపం ఇక్కడ దేవునికి ప్రతిష్ఠించబడిన వస్తువులు లేదా కానుకలను సూచిస్తుంది; ‘పరిశుద్ధ కానుకలు’ ఆ పవిత్ర స్థితినీ సందర్భాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ మూలంలోని కుటుంబసంబంధ పురుషలింగ రూపాన్ని స్పష్టంగా నిలుపుతుంది; ‘ఇశ్రాయేలీయులు’ మరింత సంక్షిప్తమైన ప్రత్యామ్నాయం.
- source_word: יַקְרִיבוּ
  choice: సమర్పించే
  rationale: קרב ధాతువు హిఫిల్ రూపం బలుల సందర్భంలో దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావం ఇస్తుంది. తెలుగులో ‘సమర్పించే’ సహజంగా ఉండి ఆ ఆరాధనా భావాన్ని నిలుపుతుంది.
- source_word: לַכֹּהֵן
  choice: యాజకునికి
  rationale: לְ ఉపసర్గ ఇక్కడ కానుకను స్వీకరించే వ్యక్తిని సూచిస్తుంది; తరువాతి వాక్యభాగం అది అతనికి చెందుతుందని నిర్ధారిస్తుంది.
- source_word: לוֹ יִהְיֶה
  choice: అతనిదే అవుతుంది
  rationale: ఈ హీబ్రూ న్యాయపరమైన ప్రయోగం స్వామ్యాన్ని తెలియజేస్తుంది. ‘అతనిదే అవుతుంది’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: నిబంధన సమాజానికి వాడిన בְנֵי יִשְׂרָאֵל అనే పేరు
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: ఇక్కడ ప్రత్యేక సిద్ధాంత వివాదం లేదు. అయినా మూలంలోని కుటుంబసంబంధమైన పురుషలింగ పదబంధాన్ని జాతివాచక పదంగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి వాడబడింది. ‘అర్పణ,’ ‘పరిశుద్ధ కానుకలు,’ ‘సమర్పించే’ అనే పదాలు యాజక సంబంధ సందర్భాన్ని తెలియజేస్తూనే అతిగా సాంకేతికంగా లేకుండా ఉన్నాయి. వాక్యంలోని న్యాయపరమైన స్వామ్య భావాన్ని ‘అతనిదే అవుతుంది’ నిలుపుతుంది.
