source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులకు ఆజ్ఞాపించు: వారు చర్మవ్యాధి ఉన్న ప్రతి వ్యక్తిని[a], స్రావం ఉన్న ప్రతి వ్యక్తిని, మృతదేహం వల్ల ఆచారపరంగా అపవిత్రమైన ప్రతి వ్యక్తిని[b] శిబిరం వెలుపలికి పంపివేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుష్ఠురోగిగా పరిగణించబడిన ప్రతి వ్యక్తిని.” ఇక్కడి హీబ్రూ పదం ఆచారధర్మ సందర్భంలో తీవ్రమైన చర్మవ్యాధుల విస్తృత వర్గాన్ని సూచించవచ్చు; అది తప్పనిసరిగా ఆధునిక కుష్ఠువ్యాధినే సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వ్యక్తి/ప్రాణం వల్ల అపవిత్రమైనవాడు.” తోరా ఆచారధర్మ సందర్భంలో ఈ ప్రయోగం మృతదేహం వల్ల కలిగే అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించు
  rationale: మోషేను ఉద్దేశించిన ఏకవచన ఆజ్ఞార్థక క్రియ యొక్క అధికారపూర్వక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పుంలింగ సమూహపదాన్ని యథాశక్తి నిలుపుతూ, ఒడంబడిక సమాజాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి పంపాలని
  rationale: שלח క్రియలోని బయటకు పంపే భావాన్ని, מן־המחנה సూచించే గమనదిశను సహజంగా వ్యక్తపరుస్తుంది; శిక్షాత్మక భావాన్ని అదనంగా చేర్చదు.
- source_word: כָּל צָרוּעַ
  choice: చర్మవ్యాధి ఉన్న ప్రతి వ్యక్తి
  rationale: ఈ ఆచారధర్మ సందర్భంలోని పదం ఆధునిక కుష్ఠువ్యాధికే పరిమితం కాకుండా తీవ్రమైన చర్మరోగాల విస్తృత వర్గాన్ని సూచించగలదు.
- source_word: כָל זָב
  choice: స్రావం ఉన్న ప్రతి వ్యక్తి
  rationale: ఆచారశుద్ధి నియమాలలో అసాధారణ శారీరక స్రావం ఉన్న వ్యక్తిని సూచిస్తుంది; మూలంలో లేని అధిక వైద్య నిర్దిష్టతను నివారిస్తుంది.
- source_word: כֹל טָמֵא לָנָפֶשׁ
  choice: మృతదేహం వల్ల ఆచారపరంగా అపవిత్రుడైన ప్రతి వ్యక్తి
  rationale: ‘నెఫెష్ వల్ల అపవిత్రుడు’ అనే తోరా ప్రయోగం మృతదేహ సంబంధ అపవిత్రతను సూచిస్తుంది. ‘ఆచారపరంగా’ అనడం దీన్ని నైతిక దోషంగా అపార్థం చేసుకోకుండా చేస్తుంది.
theological_decisions:
- issue: ఆచార అపవిత్రతను సూచించే טָמֵא పదం
  choice: ఆచారపరంగా అపవిత్రుడు
  alternative: అశుద్ధుడు / కలుషితుడు
  rationale: ఇక్కడ విషయం వ్యక్తిగత పాపస్థితి కంటే శిబిర పరిశుద్ధతకు సంబంధించిన ఆచారస్థితి. ‘ఆచారపరంగా’ అనే స్పష్టీకరణ నైతిక అపవిత్రత భావాన్ని రుద్దకుండా సందర్భాన్ని తెలియజేస్తుంది.
- issue: לָנָפֶשׁ అనే సంక్షిప్త హీబ్రూ ప్రయోగం
  choice: మృతదేహం వల్ల
  alternative: వ్యక్తి/ప్రాణం వల్ల
  rationale: సంఖ్యాకాండం మరియు తోరా ఆచారధర్మ సందర్భంలో ఇది శవసంబంధ అపవిత్రతను సూచించే స్థిరప్రయోగం. అయినప్పటికీ ‘తాకిన’ అని అనువదించకుండా, సంబంధం ఏర్పడిన ఖచ్చిత విధానాన్ని మూలం చెప్పిన దానికంటే సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. వాక్యంలోని త్రిసభ్య జాబితాను పునరుక్త నిర్మాణంతో నిలిపాం. ‘ఆచారపరంగా’ అనే పదం טָמֵא యొక్క సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ప్రధాన వచనంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
