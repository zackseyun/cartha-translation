source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: te
  text: “శాపం కలిగించే ఈ నీళ్లు నీ అంతరాంగాల్లోకి ప్రవేశించి, నీ కడుపు ఉబ్బేలా, నీ తొడ క్షీణించేలా చేయుగాక[a].” ఆ స్త్రీ, “ఆమేన్, ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “కడుపు ఉబ్బడానికి, తొడ పడిపోవడానికి.” ఈ హీబ్రూ పదబంధం అర్థం క్లిష్టమైనది; ఇది సంతానోత్పత్తికి సంబంధించిన బాధను సూచించే సభ్యోక్తి కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: ప్రవేశించి ... చేయుగాక
  rationale: శాపపూర్వక ప్రమాణ సందర్భంలో ఈ రూపానికి ఆకాంక్షాత్మక/శాపోక్తి భావం ఉంది. ‘చేయుగాక’ దానిని సాధారణ భవిష్యత్తుగా మార్చకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: శాపం కలిగించే ఈ నీళ్లు
  rationale: מְאָרְרִים ఈ నీళ్లు శాపాన్ని మోసుకొచ్చేవి లేదా అమలు చేసేవి అనే క్రియాశీల భావాన్ని ఇస్తుంది; ‘చేదు’ అనే అర్థాన్ని అనవసరంగా చేర్చలేదు.
- source_word: בְּמֵעַיִךְ
  choice: నీ అంతరాంగాల్లోకి
  rationale: מֵעֶה శరీరంలోని లోపలి భాగాలు లేదా అవయవాలను సూచిస్తుంది. ఈ ఎంపిక అతిగా వైద్యపరంగా కాకుండా శరీరసంబంధ స్పష్టతను నిలుపుతుంది.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: నీ కడుపు ఉబ్బేలా
  rationale: ఫలితాన్ని సూచించే క్రియారూపాన్ని సహజమైన తెలుగులో అందిస్తుంది. בֶּטֶןకు ఇక్కడ నేరుగా సరిపడే ‘కడుపు’ను ఎంచుకొని, ‘గర్భం’ అని నిర్దిష్టీకరించలేదు.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: నీ తొడ క్షీణించేలా
  rationale: נפל ప్రాథమికంగా ‘పడిపోవు’ అయినా, ఈ క్లిష్టమైన శాపసూత్రంలో పదబంధం శారీరక క్షీణతను సూచించవచ్చు. ‘క్షీణించేలా’ అర్థమయ్యే తెలుగును ఇస్తూనే ఖచ్చితమైన వైద్య ఫలితాన్ని నిర్దేశించదు.
- source_word: יָרֵךְ
  choice: తొడ
  rationale: పదం యొక్క ప్రాథమిక అర్థమైన ‘తొడ/తుంటి’లో ‘తొడ’ను నిలిపింది. ఇది సంతానోత్పత్తి అవయవాలకు మారుపదంగా ఉండవచ్చనే అవకాశాన్ని ప్రధాన వాక్యంలో బహిర్గత వివరణతో పరిష్కరించలేదు.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: అప్పుడు ఆ స్త్రీ ... అనాలి
  rationale: ఆచారంలో నిర్దేశించిన ప్రతిస్పందనను ఆధునిక తెలుగు న్యాయ-ఆచార శైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָמֵן אָמֵן
  choice: ఆమేన్, ఆమేన్
  rationale: రెండుసార్లు పలికే గంభీర సమ్మతి సూత్రాన్ని అనువదించి విప్పకుండా ఆచారబద్ధ రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: శాపం వల్ల కలిగే శారీరక ప్రభావాల ఖచ్చిత స్వరూపం
  choice: ‘కడుపు ఉబ్బేలా, తొడ క్షీణించేలా’ అని సాపేక్షంగా అక్షరార్థానికి దగ్గరగా, కానీ చదవదగిన రీతిలో అనువదించడం
  alternative: ‘గర్భస్రావం కలిగేలా,’ ‘సంతానోత్పత్తి అవయవాలు క్షీణించేలా,’ లేదా ‘తొడ పడిపోయేలా’ అని అనువదించడం
  rationale: హీబ్రూ పదబంధం క్లిష్టమైనది; సంతానోత్పత్తికి సంబంధించిన బాధను సభ్యోక్తిగా సూచించే అవకాశం ఉంది. అయితే ఈ వచనం మాత్రమే ఖచ్చితమైన వైద్య పరిణామాన్ని స్పష్టంగా నిర్దేశించదు. అందువల్ల మూలంలోని సందిగ్ధతను నిలుపుతూ గర్భస్రావం, వంధ్యత్వం లేదా మరొక నిర్దిష్ట పరిస్థితిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆచార-న్యాయ శైలిని ఉపయోగించాం. ‘నీళ్లు,’ ‘కడుపు,’ ‘తొడ’ వంటి సామాన్యులకు అర్థమయ్యే పదాలను వాడి, మూలంలోని శరీరసంబంధతను మరియు ఉద్దేశపూర్వక సందిగ్ధతను నిలిపాం.
