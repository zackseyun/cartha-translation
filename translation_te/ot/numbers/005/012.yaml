source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֥ישׁ אִישׁ֙ כִּֽי תִשְׂטֶ֣ה אִשְׁתּ֔/וֹ וּ/מָעֲלָ֥ה ב֖/וֹ מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] మాట్లాడి, వారితో ఇలా చెప్పు: ఎవరి భార్యయైనా దారి తప్పి, తన భర్త పట్ల విశ్వాసభంగం చేస్తే[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “ఇశ్రాయేలు ప్రజలతో.” హీబ్రూ పదబంధానికి అక్షరార్థం “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: “విశ్వాసభంగం చేస్తే” అనే మాటలు, నమ్మకాన్ని భంగం చేస్తూ ద్రోహంగా ప్రవర్తించడాన్ని తెలిపే ఒకే మూలం గల హీబ్రూ క్రియా-నామ పదబంధాన్ని అనువదిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడి
  rationale: దైవ ఆదేశాన్ని మోషేకు తెలిపే ఆజ్ఞారూప ప్రారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: హీబ్రూ కుటుంబసంబంధమైన పురుషలింగ పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భానుసారంగా మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: న్యాయనియమ ప్రకటనకు సహజమైన తెలుగు పలుకుబడిని ఇస్తూ, మూలంలోని మాటల సూత్రాన్ని నిలుపుతుంది.
- source_word: אִישׁ אִישׁ
  choice: ఎవరి ... అయినా
  rationale: ‘మనిషి, మనిషి’ అనే పునరుక్తి తెలిపే విభాజక భావాన్ని, వెంటనే వచ్చే ‘అతని భార్య’తో సహజంగా కలిపి తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: …తే
  rationale: న్యాయపరమైన సందర్భంలో షరతును సూచించే హీబ్రూ అవ్యయాన్ని తెలుగు షరతార్థక క్రియాంతంతో అందిస్తుంది.
- source_word: תִשְׂטֶה
  choice: దారి తప్పి
  rationale: తరువాతి వాక్యభాగం వివరించకముందే నిర్దిష్ట లైంగిక చర్యను చేర్చకుండా, మూలంలోని రూపకాలంకార భావాన్ని నిలుపుతుంది.
- source_word: אִשְׁתּוֹ
  choice: భార్య
  rationale: ‘ఎవరి భార్యయైనా’ అనే తెలుగు నిర్మాణంలో హీబ్రూ స్వామ్యసంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: וּמָעֲלָה ... מָעַל
  choice: విశ్వాసఘాతుకంగా ప్రవర్తిస్తే
  rationale: ఒకే మూలం గల క్రియా-నామ పునరుక్తి తెలిపే ద్రోహం, నమ్మకభంగం అనే బలమైన సంబంధార్థాన్ని సహజమైన గంభీర తెలుగులో అందిస్తుంది.
- source_word: בּוֹ
  choice: తన భర్త పట్ల
  rationale: ద్రోహానికి గురైన వ్యక్తి భర్తేనని సందర్భంలో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; తెలుగు వాక్యంలో అస్పష్టమైన ‘అతని పట్ల’ను నివారిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు సమాజానికి లింగసూచక సంబోధన
  choice: ఇశ్రాయేలు కుమారులతో
  alternative: ఇశ్రాయేలు ప్రజలతో / ఇశ్రాయేలీయులతో
  rationale: మూలంలోని ‘కుమారులు’ అనే కుటుంబసంబంధమైన పురుషలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సందర్భంలో విస్తృత ప్రజాసమూహాన్ని సూచించగలదని పాదసూచికలో తెలుపుతుంది.
- issue: వైవాహిక నమ్మకభంగం యొక్క తీవ్రత
  choice: విశ్వాసఘాతుకంగా ప్రవర్తిస్తే
  alternative: అతనికి నమ్మకద్రోహం చేస్తే / అతనిపట్ల అవిశ్వాసంగా ఉంటే
  rationale: మూలంలోని cognate construction కలిగించే తీవ్రతను పూర్తిగా చదును చేయకుండా, చర్యను ఇంకా తదుపరి వచనాలకంటే ముందే అతిగా నిర్దిష్టీకరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయనియమ శైలిని ఉపయోగించాం. ‘దారి తప్పి’ అనే రూపకాన్ని నిలిపి, తరువాతి వచనాలు ఇచ్చే వివరాలను ఈ వచనంలో ముందుగానే చేర్చలేదు. పాదసూచిక గుర్తులు [a], [b] రెండూ ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
