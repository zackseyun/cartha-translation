revisions:
- from: అప్పుడు ఆ పురుషుడు తన భార్యను యాజకుని దగ్గరికి తీసుకురావాలి. ఆమె తరఫున ఆమె అర్పణగా ఏఫాలో పదవ వంతు యవపిండిని తీసుకురావాలి. దానిమీద నూనె పోయకూడదు; దానిమీద సాంబ్రాణి వేయకూడదు. ఎందుకంటే అది అసూయకు సంబంధించిన ధాన్యార్పణ, జ్ఞాపకార్థ ధాన్యార్పణ[a]; అది దోషాన్ని[b] జ్ఞాపకానికి తెస్తుంది.
  to: 'అప్పుడు ఆ పురుషుడు తన భార్యను యాజకుని వద్దకు తీసుకురావాలి; ఆమెకోసం ఆమె అర్పణను కూడా తీసుకురావాలి: ఏఫాలో పదవ వంతు యవపిండి. దానిమీద నూనె పోయకూడదు, సాంబ్రాణి వేయకూడదు; ఎందుకంటే అది అసూయకు సంబంధించిన ధాన్యార్పణ, దోషాన్ని జ్ఞాపకానికి తెచ్చే జ్ఞాపక ధాన్యార్పణ[a].


    [a] లేదా, “స్మారక ధాన్యార్పణ”; హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా “జ్ఞాపకపు ధాన్యార్పణ” అని కూడా అనువదించవచ్చు.

    [b] లేదా, “అపరాధాన్ని”; ఇక్కడి హీబ్రూ పదం దోషాన్ని, అపరాధాన్ని, లేదా తప్పువల్ల కలిగే బాధ్యతను సూచించగలదు.'
  rationale: The revision improves modern Telugu flow and more closely reflects the Hebrew appositional structure. Footnote b is retained for עָוֹן, but its anchor is placed at “దోషాన్ని,” rather than after the sentence-final offering designation.
