source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: te
  text: 'అప్పుడు ఆ పురుషుడు తన భార్యను యాజకుని వద్దకు తీసుకురావాలి; ఆమెకోసం ఆమె అర్పణను కూడా తీసుకురావాలి: ఏఫాలో పదవ వంతు యవపిండి. దానిమీద నూనె పోయకూడదు, సాంబ్రాణి వేయకూడదు; ఎందుకంటే అది అసూయకు సంబంధించిన ధాన్యార్పణ, దోషాన్ని జ్ఞాపకానికి తెచ్చే జ్ఞాపక ధాన్యార్పణ[a].


    [a] లేదా, “స్మారక ధాన్యార్పణ”; హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా “జ్ఞాపకపు ధాన్యార్పణ” అని కూడా అనువదించవచ్చు.

    [b] లేదా, “అపరాధాన్ని”; ఇక్కడి హీబ్రూ పదం దోషాన్ని, అపరాధాన్ని, లేదా తప్పువల్ల కలిగే బాధ్యతను సూచించగలదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్మారక ధాన్యార్పణ”; హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా “జ్ఞాపకపు ధాన్యార్పణ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అపరాధాన్ని”; ఇక్కడి హీబ్రూ పదం దోషాన్ని, అపరాధాన్ని, లేదా తప్పువల్ల కలిగే బాధ్యతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: ఆ పురుషుడు తన భార్యను … తీసుకురావాలి
  rationale: హీబ్రూలోని ‘పురుషుడు’ అనే పదాన్ని నిలుపుతూ, న్యాయనియమ సందర్భంలోని ఆదేశ భావాన్ని ‘తీసుకురావాలి’తో సహజంగా వ్యక్తం చేశాం.
- source_word: אֶל־הַכֹּהֵן
  choice: యాజకుని దగ్గరికి
  rationale: ఆరాధనా సేవలోని యాజక పదవికి ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: ఆమె తరఫున ఆమె అర్పణగా
  rationale: స్త్రీలింగ ప్రత్యయాన్ని ‘ఆమె అర్పణ’గా నిలిపి, עָלֶיהָ లోని ప్రాతినిధ్య/సంబంధ భావాన్ని ‘ఆమె తరఫున’గా తెలిపాం.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: ఏఫాలో పదవ వంతు
  rationale: ప్రాచీన కొలమానమైన ఏఫాను అంచనా ఆధునిక పరిమాణంగా మార్చకుండా లిప్యంతరీకరించాం.
- source_word: קֶמַח שְׂעֹרִים
  choice: యవపిండి
  rationale: బార్లీతో చేసిన పిండిని సూచించే సంక్షిప్తమైన, సహజమైన తెలుగు పదం.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן
  choice: దానిమీద నూనె పోయకూడదు
  rationale: న్యాయనియమ నిషేధాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం.
- source_word: וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: దానిమీద సాంబ్రాణి వేయకూడదు
  rationale: לְבֹנָה అనే సుగంధ ధూపద్రవ్యానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘సాంబ్రాణి’ని ఎంచుకున్నాం.
- source_word: מִנְחַת קְנָאֹת
  choice: అసూయకు సంబంధించిన ధాన్యార్పణ
  rationale: యాజక సంబంధ బలి సందర్భంలో מִנְחָהను ‘ధాన్యార్పణ’గా, קְנָאֹתను తీర్పును ముందే నిర్ణయించకుండా విస్తృతమైన ‘అసూయ’ భావంతో అనువదించాం.
- source_word: מִנְחַת זִכָּרוֹן
  choice: జ్ఞాపకార్థ ధాన్యార్పణ
  rationale: זִכָּרוֹןలోని జ్ఞాపక/స్మారక భావాన్ని సంక్షిప్తంగా తెలిపి, పాదటిప్పణిలో మరో సాధ్యమైన రూపాన్ని ఇచ్చాం.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: దోషాన్ని జ్ఞాపకానికి తెస్తుంది
  rationale: కారణార్థక జ్ఞాపక భావాన్ని సహజమైన క్రియారూపంలో వ్యక్తం చేసి, עָוֹןలోని దోషం/అపరాధం/బాధ్యత అర్థవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: అసూయ ధాన్యార్పణ స్త్రీ దోషాన్ని ముందుగానే నిర్ధారిస్తుందా?
  choice: వచనం చెప్పిన అర్పణ స్వభావం, జ్ఞాపకపరిచే పని మాత్రమే అనువదించాం; స్త్రీ దోషి అని ముందే నిర్ధారించలేదు.
  alternative: ఈ అర్పణ స్త్రీ అపరాధాన్ని ముందుగానే ఊహిస్తుందని స్పష్టీకరించడం.
  rationale: హీబ్రూ వచనం ఈ దశలో ఆమె దోషిత్వం లేదా నిర్దోషిత్వాన్ని తేల్చదు; అందువల్ల ఆ న్యాయపరమైన ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: עָוֹן యొక్క నైతిక మరియు న్యాయపరమైన పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘దోషం’; పాదటిప్పణిలో ‘అపరాధం’ లేదా ‘తప్పువల్ల కలిగే బాధ్యత’.
  alternative: కేవలం ‘పాపం’ అని అనువదించడం.
  rationale: ఒక్క ‘పాపం’ అనే పదం మూలపదంలోని అపరాధబాధ్యత భావాన్ని కుదించవచ్చు; ఎంపిక చేసిన రూపం అస్పష్టతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. న్యాయనియమ ఆదేశాలకు ‘తీసుకురావాలి/పోయకూడదు/వేయకూడదు’ రూపాలు, బలి పదజాలానికి ‘అర్పణ/ధాన్యార్పణ/యాజకుడు’ వంటి సుపరిచిత పదాలు ఎంచుకున్నాం.
