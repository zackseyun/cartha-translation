source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: te
  text: అయితే ఆ మనిషికి అపరాధానికి నష్టపరిహారాన్ని తిరిగి ఇవ్వడానికి విమోచన బాధ్యతగల బంధువు[a] లేకపోతే, యెహోవాకు తిరిగి ఇవ్వబడే ఆ అపరాధానికి నష్టపరిహారం యాజకునిది[b]; అతని కొరకు ప్రాయశ్చిత్తం చేయబడే ప్రాయశ్చిత్తపు పొట్టేలుకు అదనంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విమోచకుడు’ లేదా ‘సమీప బంధువు.’ హీబ్రూ పదం కుటుంబంలోని విమోచన లేదా పరిహార వ్యవహారాల్లో చట్టబద్ధ బాధ్యతగల బంధువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అపరాధానికి నష్టపరిహారం’ అనేది అపరాధం కోసం చెల్లించే పరిహారాన్ని సూచిస్తుంది; అది పొట్టేలు కాదు. పొట్టేలు తరువాత వేరుగా ప్రస్తావించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: బంధువైన విమోచకుడు
  rationale: కుటుంబ బంధంతోపాటు విమోచన లేదా పరిహారానికి సంబంధించిన చట్టబద్ధ బాధ్యతను సూచిస్తుంది.
- source_word: הָאָשָׁם
  choice: అపరాధపరిహారం
  rationale: ఇక్కడ ఇది బలిగా అర్పించే పొట్టేలును కాక, అపరాధం కారణంగా చెల్లించాల్సిన నష్టపరిహారాన్ని సూచిస్తుంది.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: తిరిగి చెల్లించే ఆ అపరాధపరిహారం
  rationale: שוב మూలం నుంచి వచ్చిన కర్మణి రూపం, బాకీ పరిహారాన్ని తిరిగి చెల్లించే చర్యను స్పష్టంగా ఉంచుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సహజంగా గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించి, చెల్లింపు దేవునికి అంకితమైనదనే భావాన్ని నిలుపుతుంది.
- source_word: לַכֹּהֵן
  choice: యాజకునికి చెందుతుంది
  rationale: హీబ్రూ సంక్షిప్త నిర్మాణంలో అంతర్లీనంగా ఉన్న చట్టబద్ధ గమ్యాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִלְּבַד
  choice: అదనం
  rationale: పరిహార ధనం మరియు ప్రాయశ్చిత్తపు పొట్టేలు వేర్వేరు అంశాలని తెలియజేస్తుంది.
- source_word: אֵיל הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్తపు పొట్టేలు
  rationale: బలి జంతువునూ దాని ప్రాయశ్చిత్త కార్యాన్నీ సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయడానికి ఉపయోగించే
  rationale: పొట్టేలు ప్రాయశ్చిత్తానికి సాధనమని చూపుతూ, హీబ్రూలో స్పష్టంగా చెప్పని కర్తను అనవసరంగా చేర్చదు.
- source_word: לָאִישׁ
  choice: ఆ వ్యక్తికి
  rationale: ఈ న్యాయనియమం వర్తించే వ్యక్తిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; సందర్భంలోని పురుష ఏకవచనాన్ని అనవసరంగా ప్రధానంగా చేయదు.
theological_decisions:
- issue: పరిహార చెల్లింపుకు బలితో ఉన్న సంబంధం
  choice: అపరాధపరిహారం మరియు ప్రాయశ్చిత్తపు పొట్టేలు వేర్వేరు; పొట్టేలు పరిహారానికి అదనం.
  alternative: ‘అపరాధం’ అనే పదాన్ని స్వయంగా అపరాధబలిగా అర్థం చేసుకోవడం.
  rationale: מִלְּבַד (‘అదనంగా/వేరుగా’) అనే పదం పరిహార చెల్లింపును తరువాత చెప్పిన పొట్టేలు నుంచి స్పష్టంగా వేరు చేస్తుంది.
- issue: దైవనామం YHWH అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యక్షంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి. ‘అపరాధపరిహారం’ ద్వారా ధనపరిహారాన్ని బలి నుంచి వేరు చేశాం; పొడవైన హీబ్రూ వాక్యాన్ని రెండు సహజ తెలుగు వాక్యాలుగా విభజించాం.
