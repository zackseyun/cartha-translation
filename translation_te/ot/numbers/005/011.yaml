lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: వావ్-కాన్సిక్యూటివ్‌తో ఉన్న דבר కొత్త దైవిక ప్రసంగ భాగాన్ని ప్రారంభిస్తుంది. ఆధునిక తెలుగులో ‘మాట్లాడాడు’ కంటే ‘చెప్పాడు’ సహజంగా ఉండి, తరువాత వచ్చే సందేశానికి తగిన పరిచయాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిపి సంబోధిత వ్యక్తిని సూచించే సహజమైన తెలుగు విభక్తి రూపం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అంటూ’ అనే రూపం ఇక్కడ వాక్యాన్ని అసంపూర్ణంగా వినిపించవచ్చు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగా ఉంచాం; ఆధునిక తెలుగు బైబిలు వాడుకలో పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ ప్రసంగ-పరిచయ సూత్రాన్ని పదేపదే కాకుండా సహజమైన ‘ఇలా చెప్పాడు’ రూపంలో అందించాం.
