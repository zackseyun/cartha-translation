  edition: WLC
  text: וְ֠/כָתַב אֶת הָ/אָלֹ֥ת הָ/אֵ֛לֶּה הַ/כֹּהֵ֖ן בַּ/סֵּ֑פֶר וּ/מָחָ֖ה אֶל מֵ֥י הַ/מָּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: te
  text: అప్పుడు యాజకుడు ఈ శాపవాక్యాలను చుట్టపై వ్రాసి, వాటిని చేదునీళ్లలోకి కడిగి చెరిపివేయాలి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రమాణ-శాపవాక్యాలను.’ హీబ్రూ పదం ప్రమాణంతో ముడిపడిన శాపాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటిని తుడిచివేయాలి’ లేదా ‘వాటిని చెరిపివేయాలి.’ హీబ్రూ క్రియ రాసిన మాటలను తుడిచి లేదా చెరిపి తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: అప్పుడు ... రాసి
  rationale: ఆచార విధానాన్ని వరుసగా తెలిపే న్యాయవచన సందర్భంలో సంయుక్త క్రియకు తదుపరి చర్యను సూచించే భావం ఉంది; తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: ఈ శాపవాక్యాలను
  rationale: אָלָה ప్రమాణంతో ముడిపడిన శాపాన్ని కూడా సూచించగలదు. ఇక్కడ రాయబడేవి పలికిన శాపసంబంధ మాటలు కాబట్టి ‘శాపవాక్యాలు’ స్పష్టంగా, సహజంగా ఉంటుంది; ప్రమాణ సంబంధ ఛాయను పాదసూచికలో ఉంచాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఈ ఆచారాన్ని నిర్వహించే పూజారి పదవికి ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సహజమైన పదం.
- source_word: בַּסֵּפֶר
  choice: చుట్టపై
  rationale: סֵפֶר ఇక్కడ ఆధునిక బద్ధ పుస్తకం కంటే రాయడానికి ఉపయోగించే పత్రం లేదా చుట్టను సూచిస్తుంది. భౌతిక మాధ్యమాన్ని స్పష్టపరచడానికి ‘చుట్ట’ ఎంచుకున్నాం; తెలుగులో రాసే ఉపరితలానికి ‘పై’ సహజం.
- source_word: וּמָחָה
  choice: కడిగి చెరిపివేయాలి
  rationale: מחה అంటే తుడిచివేయడం, చెరిపివేయడం. రాతను నీళ్లలోకి కడిగి తొలగించే ఈ సందర్భంలో ‘కడిగి చెరిపివేయాలి’ భౌతిక చర్యను మరియు రాత తొలగింపును రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל
  choice: నీళ్లలో
  rationale: దిశ లేదా గమ్యాన్ని సూచించే אֶל, ఇక్కడ రాత పదార్థం నీళ్లలోకి చేరే చర్యను సూచిస్తుంది; తెలుగులో ‘నీళ్లలో’ సహజంగా ఆ గమ్యాన్ని తెలియజేస్తుంది.
- source_word: מֵי הַמָּרִים
  choice: చేదు నీళ్లు
  rationale: అక్షరార్థంగా ‘చేదుతనపు నీళ్లు’ లేదా ‘చేదు నీళ్లు.’ ఆచార ద్రవాన్ని సూచించేందుకు ‘చేదు నీళ్లు’ సహజమైన ఆధునిక తెలుగు.
