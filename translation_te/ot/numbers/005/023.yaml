translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆచార-న్యాయ శైలిని ఉపయోగించాం. ‘చుట్ట’ ప్రాచీన లిఖన మాధ్యమాన్ని తెలియజేస్తుంది; ‘కడిగి చెరిపివేయాలి’ మూలంలోని తుడిచివేత భావాన్నీ, నీళ్లలోకి రాతను తొలగించే సందర్భాన్నీ కలిపి నిలుపుతుంది.
