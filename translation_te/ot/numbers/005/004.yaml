revisions:
- from: ఇశ్రాయేలు కుమారులు అలాగే చేసి[a], వారిని శిబిరం వెలుపలికి పంపించారు. యెహోవా మోషేతో చెప్పినట్టుగానే ఇశ్రాయేలు కుమారులు చేశారు.
  to: ఇశ్రాయేలు కుమారులు అలాగే చేశారు[a]; వారిని శిబిరం వెలుపలికి పంపించారు. యాహ్వే మోషేతో చెప్పినట్టుగానే ఇశ్రాయేలు కుమారులు అలాగే చేశారు.
  rationale: The revision preserves the Hebrew’s coordinated verbs, its closing repetition of obedience, the formal familial expression for בני ישראל with its explanatory note, and the project’s rendering of the Tetragrammaton as Yahweh.
