reference: Numbers 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు అలాగే చేశారు[a]; వారిని శిబిరం వెలుపలికి పంపించారు. యాహ్వే మోషేతో చెప్పినట్టుగానే ఇశ్రాయేలు కుమారులు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారులు’; ఈ పదబంధం ఇక్కడ ఇశ్రాయేలీయులను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేసి
  rationale: עשה + כן ముందున్న ఆజ్ఞకు అనుగుణంగా చేయడాన్ని సూచిస్తుంది; ‘అలాగే చేసి’ సహజమైన తెలుగులో ఆ విధేయతను తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ వ్యక్తీకరణను రూపపరంగా నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు జనాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: వారిని ... పంపించారు
  rationale: ఈ సందర్భంలో שׁלח వ్యక్తులను శిబిరం నుంచి పంపివేయడాన్ని సూచిస్తుంది; గమ్యస్థాన పదబంధంతో కలిపి తెలుగు అర్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: దిశతో కూడిన స్థలబహిష్కరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్టుగానే
  rationale: దేవుడు ముందుగా పలికిన ఆజ్ఞకు చర్య సరిగ్గా అనుగుణంగా జరిగిందనే తులనాత్మక భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంతో దైవనామాన్ని బిరుదుగా కాక వ్యక్తినామంగా నిలుపుతుంది.
- source_word: כֵּן עָשׂוּ
  choice: చేశారు
  rationale: మొదటి వాక్యంలోని ‘అలాగే చేసి’ మరియు ‘చెప్పినట్టుగానే’తో కలిపి హీబ్రూ ముగింపు పునరుక్తి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. మూలంలోని విధేయతను నొక్కిచెప్పే నిర్మాణం మరియు ముగింపు పునరుక్తి భావం నిలుపబడ్డాయి.
