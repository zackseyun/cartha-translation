    text: హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారులు’; ఈ పదబంధం ఇక్కడ ఇశ్రాయేలీయులను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew’s coordinated verbs, its closing repetition of obedience, the formal familial expression for בני ישראל with its explanatory note, and the project’s rendering of the Tetragrammaton as Yahweh.
