source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: te
  text: అసూయా భావం అతనిని ఆవహించి, అతడు తన భార్య విషయంలో అసూయపడగా, ఆమె తనను తాను అపవిత్రపరచుకొని ఉంటే; లేదా అసూయా భావం అతనిని ఆవహించి, అతడు తన భార్య విషయంలో అసూయపడగా, ఆమె తనను తాను అపవిత్రపరచుకోకపోయినా,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆమె తనను తాను అపవిత్రపరచుకోలేదు.’ హీబ్రూలో ఇక్కడ సాధారణంగా ‘మరియు’ అనే సంధి ఉంది; ప్రధాన పాఠంలోని ‘కాకపోయినా’ రెండు న్యాయ పరిస్థితుల మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: అతనికి ... కలిగి
  rationale: עָבַר עַל అనే ప్రయోగం ఇక్కడ ఒక అంతరంగ ప్రేరణ అతనిని ఆవరించడాన్ని సూచిస్తుంది. తెలుగులో ‘అతనికి ... కలిగి’ సహజంగా ఆ అనుభవాన్ని తెలియజేస్తుంది.
- source_word: רוּחַ קִנְאָה
  choice: అసూయావేశం
  rationale: רוּחַ ఇక్కడ గాలి లేదా విడిగా ఉన్న ఆత్మకన్నా మనిషిని ప్రేరేపించే మనోభావాన్ని సూచిస్తుంది; קִנְאָה ఈ సందర్భంలో అసూయ. ‘అసూయావేశం’ రెండింటినీ సహజంగా కలిపి తెలియజేస్తుంది.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: తన భార్య విషయంలో అతడు అసూయపడగా
  rationale: క్రియాశీల అసూయా ప్రతిస్పందనను నిలుపుతూ, את గుర్తించిన సంబంధాన్ని తెలుగులో సహజమైన ‘విషయంలో’తో వ్యక్తం చేస్తుంది.
- source_word: נִטְמָאָה
  choice: తనను తాను అపవిత్రపరచుకొని ఉంటే
  rationale: ఈ న్యాయ సందర్భంలో పదం అనుమానిత లైంగిక అపవిత్రతను సూచిస్తుంది. ‘అపవిత్రపరచుకొని’ నైతిక-ఆచార సంబంధిత అపవిత్రత రెండింటి మేళవింపును ఉంచుతుంది; ‘ఉంటే’ ప్రత్యామ్నాయ న్యాయ పరిస్థితిని స్పష్టం చేస్తుంది.
- source_word: אוֹ
  choice: లేదా
  rationale: రెండవ ప్రత్యామ్నాయ న్యాయ పరిస్థితిని నేరుగా పరిచయం చేస్తుంది.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: ఆమె తనను తాను అపవిత్రపరచుకోకపోయినా
  rationale: హీబ్రూలో సాధారణ సంధి ఉన్నప్పటికీ, రెండవ పరిస్థితిలో భర్త అసూయకు విరుద్ధంగా భార్య అపవిత్రపడలేదనే భావాన్ని ‘కాకపోయినా’ సహజంగా వెల్లడిస్తుంది.
theological_decisions:
- issue: అనుమానిత వ్యభిచార నియమంలో అపవిత్రత భాష స్వభావం
  choice: ‘తనను తాను అపవిత్రపరచుకొని’
  alternative: ‘అపవిత్రురాలై’ / ‘అశుద్ధురాలై’
  rationale: సందర్భం కేవలం ఆచారపరమైన అశుద్ధత కాదు, వివాహ అవిశ్వాసానికి సంబంధించిన నైతిక-ఆచార అపవిత్రత. ప్రతిపాదిత అనువాదం ఈ విస్తృతిని కాపాడి, పాఠానికి మించిన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
- issue: רוּחַ קִנְאָה యొక్క స్వరూపం
  choice: ‘అసూయావేశం’ అనే అంతరంగ ప్రేరణగా అనువదించడం
  alternative: ‘అసూయ ఆత్మ’
  rationale: ఈ సందర్భంలో רוּחַ ఒక వ్యక్తిగత ఆధ్యాత్మిక సత్త అని నిర్బంధంగా నిర్ణయించకుండా, మనిషిని ఆవరించే స్వభావం లేదా ప్రేరణ అనే నిజమైన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన వాక్య నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఇది ముందరి వాక్యంపై ఆధారపడే ఉపవాక్యం కావడంతో చివర కామా ఉంచబడింది.
