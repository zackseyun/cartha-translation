  rationale: The opening idiom has been recast as “అసూయా భావం అతనిని ఆవహించి,” which is grammatical, natural, and retains the sense of an overpowering jealousy-related disposition coming upon the husband. The repeated clause is revised consistently. Footnote placement is adjusted so the explanatory note about the final adversative wording remains anchored to “కాకపోయినా”; the lexical note on the opening phrase is retained as footnote b, though it is not anchored in the revised text and should therefore be removed or anchored at the opening phrase in typesetting.
