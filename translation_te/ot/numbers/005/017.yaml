source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: te
  text: అప్పుడు యాజకుడు మట్టి పాత్రలో[b] పవిత్రమైన నీటిని[a] తీసుకోవాలి. ప్రత్యక్ష గుడారం నేలపై[c] ఉన్న ధూళిలో కొంతను యాజకుడు తీసుకొని ఆ నీటిలో వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రతిష్ఠితమైన నీరు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం ఇక్కడ ఆచార ఉపయోగం కోసం పవిత్రంగా ప్రత్యేకపరచిన నీటిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మృణ్మయ పాత్రలో’ లేదా ‘కుమ్మరి పాత్రలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ప్రత్యక్ష గుడారం భూమిపై’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ‘నేల’ లేదా ‘భూమి ఉపరితలం’ అనే రెండు భావాలనూ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: పవిత్రమైన నీరు
  rationale: కְדֹשִׁים అనే విశేషణం ఆచార ఉపయోగం కోసం ప్రత్యేకపరచబడినదనే భావంలో ‘పవిత్రమైన’ అని అర్థమిస్తుంది. ‘పవిత్రమైన నీరు’ మూలంలోని సాధారణ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בִּכְלִי חָרֶשׂ
  choice: మట్టి పాత్రలో
  rationale: כְּלִי అంటే పాత్ర లేదా భాండం; חָרֶשׂ కాల్చిన మట్టి లేదా మృణ్మయ పదార్థాన్ని సూచిస్తుంది. ‘మట్టి పాత్ర’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, పాత్ర తయారైన పదార్థాన్ని తెలియజేస్తుంది.
- source_word: הֶעָפָר
  choice: ధూళి
  rationale: עָפָר అంటే ధూళి, పొడి మట్టి లేదా వదులైన నేల. ఈ ఆచార సందర్భంలో ‘ధూళి’ గంభీరంగా, సహజంగా ఉంటుంది.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: ప్రత్యక్ష గుడారం నేలపై
  rationale: קַרְקַע నేలను లేదా అడుగు ఉపరితలాన్ని సూచించగలదు. గుడారం సందర్భంలో ‘నేలపై’ సహజంగా ఉండడంతో పాటు, అది నిర్మితమైన నేలా లేక భూమి ఉపరితలమా అనే స్వల్ప సందిగ్ధతను కాపాడుతుంది. מִשְׁכָּןకు స్థిరమైన తెలుగు బైబిలు పదప్రయోగమైన ‘ప్రత్యక్ష గుడారం’ వాడబడింది.
- source_word: מִן הֶעָפָר
  choice: ధూళిలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; యాజకుడు ధూళి అంతటినీ కాక దానిలో కొంత తీసుకుంటాడు. ‘ధూళిలో కొంత’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: తీసుకోవాలి ... తీసుకొని ... వేయాలి
  rationale: ఇది ఆచార విధిని నిర్దేశించే వాక్యక్రమం. తెలుగులో ‘చేయాలి’ రూపం విధిని స్పష్టంగా తెలియజేస్తుంది; రెండవ చర్యను ‘తీసుకొని’ అని అనుసంధానించడం సహజమైన క్రమాన్ని ఇస్తుంది. నీటిలో ధూళిని కలపడం అనే సందర్భంలో נָתַןకు ‘వేయాలి’ సరళమైన సమానార్థకం.
- source_word: הַמָּיִם
  choice: ఆ నీటిలో
  rationale: చివరి నిర్దిష్ట పదం ముందుగా ప్రస్తావించిన పవిత్రమైన నీటినే తిరిగి సూచిస్తుంది. తెలుగులో ‘ఆ నీటిలో’ ఈ అన్వయాన్ని స్పష్టంగా చూపుతుంది.
