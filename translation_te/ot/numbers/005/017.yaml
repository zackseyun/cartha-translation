  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆచార-విధి శైలిని ఉపయోగించాం. పదక్రమాన్ని తెలుగు సహజ వాక్యనిర్మాణానికి అనుగుణంగా మార్చినా, రెండు సార్లు తీసుకోవడం మరియు చివరగా నీటిలో వేయడం అనే మూల చర్యల క్రమం నిలుపబడింది.
