  - severity: low
    issue: Footnote anchors [b] and [c] are both placed at the end of the sentence.
    rationale: 'Their placement makes their referents less clear: [b] explains “శాపంగా, ప్రమాణంగా,” while [c] explains the bodily expressions. Each anchor should follow the phrase it annotates.'
