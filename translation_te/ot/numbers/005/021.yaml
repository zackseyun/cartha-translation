  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: te
  text: 'అప్పుడు యాజకుడు ఆ స్త్రీతో శాపపు ప్రమాణం చేయించి[a], ఆమెతో ఇలా చెప్పాలి: “యాహ్వే నీ ప్రజల మధ్య నిన్ను శాపంగా, ప్రమాణంగా చేయుగాక[b], యాహ్వే నీ తొడను క్షీణింపజేసి, నీ ఉదరాన్ని ఉబ్బజేసినప్పుడు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “శాపపు ప్రమాణం.” ఇది శాపాన్ని తనలో కలిగిన గంభీరమైన ప్రమాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “శాపంగా, ప్రమాణంగా” అంటే ప్రజలు శపించేటప్పుడు లేదా ప్రమాణం చేసేటప్పుడు ఆమెకు జరిగినదాన్ని ఉదాహరణగా ప్రస్తావించడం కావచ్చు.
    reason: idiomatic_clarification
  - marker: c
    text: “తొడ క్షీణించడం” అనేది క్లిష్టమైన హీబ్రూ వ్యక్తీకరణ; అక్షరార్థంగా అది “తొడ పడిపోవడం.” ఇది సంతానోత్పత్తి అవయవాలకు సంబంధించిన సభ్యోక్తి కావచ్చు. “ఉదరం” అనే పదానికి సందర్భానుసారం “కడుపు” లేదా “గర్భం/గర్భాశయం” అనే భావం కూడా ఉండవచ్చు; ఇక్కడ చెప్పబడిన ఖచ్చితమైన శారీరక ప్రభావం వివాదాస్పదం.
    reason: textual_semantic_ambiguity
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: ప్రమాణం చేయించి
  rationale: హిఫిల్ క్రియారూపంలోని కారణార్థాన్ని—యాజకుడు ఆమెతో ప్రమాణం చేయించడం—సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: శాపంతో కూడిన ప్రమాణం
  rationale: ‘ప్రమాణం’ మరియు ‘శాపం’ అనే రెండు భావాలనూ నిలుపుతూ, ఆచారపరమైన న్యాయ సందర్భాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: శాపంగా, ప్రమాణంగా
  rationale: హీబ్రూ పదజోడును దగ్గరగా నిలుపుతుంది; ఇతరులు శపించేటప్పుడు లేదా ప్రమాణం చేసేటప్పుడు ఆమెను ఉదాహరణగా ప్రస్తావిస్తారనే నుడికార భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: నీ ప్రజల మధ్య
  rationale: సామూహికంగా, బహిరంగంగా జరిగే పరిణామాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּתֵת
  choice: చేసినప్పుడు
  rationale: בְּ ఉపసర్గతో కూడిన క్రియానామం ఇక్కడ సూచించే సందర్భార్థాన్ని లేదా కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְרֵךְ ... נֹפֶלֶת
  choice: నీ తొడ క్షీణించేలా
  rationale: ‘తొడ పడిపోవడం’ అనే అక్షరార్థ రూపం తెలుగులో అస్పష్టంగా ఉండటంతో, శాప సందర్భంలో సూచితమైన వాడిపోవడం లేదా క్షీణించడాన్ని వ్యక్తం చేస్తుంది; ఖచ్చితమైన వైద్య నిర్ధారణను మాత్రం విధించదు.
- source_word: בִּטְנֵךְ צָבָה
  choice: నీ ఉదరం ఉబ్బేలా
  rationale: בֶּטֶן యొక్క శరీర సంబంధ విస్తృతార్థాన్ని ‘ఉదరం’ నిలుపుతుంది; צָבָה సూచించే ఉబ్బడం లేదా వ్యాకోచాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: శరీరానికి కలిగే శాపాన్ని ఎంత నిర్దిష్టంగా అనువదించాలి
  choice: ‘తొడ క్షీణించడం, ఉదరం ఉబ్బడం’ అనే శరీర చిత్రణను నిలుపుతూ, దాన్ని గర్భస్రావం, వంధ్యత్వం లేదా నిర్దిష్ట అవయవవ్యాధిగా ప్రధాన పాఠంలో నిర్ధారించలేదు.
  alternative: ‘గర్భం పోవడం’ లేదా ‘గర్భాశయం దెబ్బతినడం’ అని నిర్దిష్టంగా అనువదించడం.
  rationale: హీబ్రూ పదబంధం క్లిష్టమైనది; దానికి సంతానోత్పత్తి సంబంధ సూచన ఉండవచ్చుగాని, నిర్దిష్ట వైద్య ఫలితంపై పాఠం స్పష్టంగా లేదు. కాబట్టి అసలులోని అనిశ్చితిని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆచార-న్యాయ శైలిని ఉపయోగించాం. ‘యాజకుడు,’ ‘ప్రమాణం,’ ‘శాపం,’ ‘ఉదరం’ వంటి సాధారణంగా అర్థమయ్యే గౌరవప్రద పదాలను ఎంచుకున్నాం. క్లిష్టమైన శరీర చిత్రణను అతిగా వైద్యీకరించకుండా పాదసూచికలో దాని అనిశ్చితిని తెలిపాం.
