revisions:
- from: 'అప్పుడు యాజకుడు ఆ స్త్రీతో శాపంతో కూడిన ప్రమాణం చేయించి[a], ఆమెతో ఇలా చెప్పాలి: “యాహ్వే నీ తొడ క్షీణించేలా, నీ ఉదరం ఉబ్బేలా చేసినప్పుడు, నీ ప్రజల మధ్య నిన్ను శాపంగా, ప్రమాణంగా చేయుగాక[b][c].”'
  to: 'అప్పుడు యాజకుడు ఆ స్త్రీతో శాపపు ప్రమాణం చేయించి[a], ఆమెతో ఇలా చెప్పాలి: “యాహ్వే నీ ప్రజల మధ్య నిన్ను శాపంగా, ప్రమాణంగా చేయుగాక[b], యాహ్వే నీ తొడను క్షీణింపజేసి, నీ ఉదరాన్ని ఉబ్బజేసినప్పుడు[c].”'
  rationale: The revision tightens the construct phrase “oath of the curse,” improves the explicit causative syntax for the two bodily effects, and relocates footnote anchors to the words they explain. It retains the Hebrew ambiguity regarding the anatomical and medical sense of the curse.
