language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: te
  text: అయితే నీవు నీ భర్తతో వివాహబంధంలో ఉండగా దారితప్పి[a], అపవిత్రురాలై, నీ భర్త తప్ప మరొక పురుషుడు నీతో శయనించి ఉంటే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ భర్తకు నమ్మకద్రోహం చేసి.’ హీబ్రూ పాఠం వైవాహిక సందర్భంలో ‘నీ భర్త కింద ఉండగా దారితప్పి’ అనే రూపకాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: దారితప్పి
  rationale: వైవాహిక నిబద్ధత నుంచి తొలగిపోవడాన్ని సూచించే మూలంలోని ‘దారి తప్పడం’ అనే రూపకాన్ని నిలుపుతుంది; ‘నమ్మకద్రోహం చేసి’ అన్నదానికంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: תַּחַת אִישֵׁךְ
  choice: నీ భర్తకు లోబడి ఉండగా
  rationale: తחת అనే ‘కింద’ భావాన్ని తెలుగులో యథాతథంగా చెప్పడం అసహజం; ఈ న్యాయ-వైవాహిక సందర్భంలోని బంధం లేదా అధీనస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִטְמֵאת
  choice: అపవిత్రురాలివై
  rationale: లైంగిక చర్య వల్ల కలిగిన ఆచార-న్యాయ అపవిత్రతను సూచించే మూలపద బలాన్ని నిలుపుతుంది.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: వేరొక పురుషుడు నీతో శయనించి ఉంటే
  rationale: మూలంలోని శయనానికి సంబంధించిన సభ్యోక్తిని నిలుపుతూ, ఆధునిక తెలుగు పాఠకునికి లైంగిక సంబంధం అనే భావాన్ని సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: నీ భర్త కాక వేరొక పురుషుడు
  rationale: భర్తను మినహాయించి మరొక పురుషుడని సూచించే మూలంలోని మినహాయింపు భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: వైవాహిక అవిశ్వాసాన్ని సూచించే రూపకాన్ని అతిగా వ్యాఖ్యానించకుండా అనువదించడం
  choice: ‘దారితప్పి’ అనే రూపకాన్ని ఉంచి, తరువాతి శయన వాక్యంతో లైంగిక భావాన్ని తెలియజేయడం
  alternative: ‘నీ భర్తకు నమ్మకద్రోహం చేసి’ అని నేరుగా చెప్పడం
  rationale: మూలపాఠం మొదట రూపకాన్ని, తరువాత సభ్యోక్తిని ఉపయోగిస్తుంది. ఈ రూపక-సభ్యోక్తి నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపడం ద్వారా భావాన్ని స్పష్టంగా ఉంచుతూ మూలం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆచార శైలి. ‘లోబడి ఉండగా’ హీబ్రూ వైవాహిక ప్రయోగాన్ని సహజీకరిస్తుంది; ‘శయనించి’ మూలంలోని సభ్యోక్తిని కాపాడుతుంది. పాదం తరువాతి వాక్యానికి కొనసాగుతున్నందున చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది.
