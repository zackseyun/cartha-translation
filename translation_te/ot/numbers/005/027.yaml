source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: te
  text: అతడు ఆమెతో ఆ నీళ్లు తాగించినప్పుడు,[a] ఆమె అపవిత్రురాలై తన భర్తకు నమ్మకద్రోహం చేసి ఉంటే, శాపాన్ని కలిగించే ఆ నీళ్లు ఆమెలోకి చేదుదనం కలిగేలా ప్రవేశిస్తాయి; ఆమె కడుపు ఉబ్బుతుంది, ఆమె తొడ క్షీణించిపోతుంది.[b] ఆ స్త్రీ తన ప్రజల మధ్య శాపంగా అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఆమెతో ఆ నీళ్లు తాగించిన తరువాత.”
    reason: హెబ్రీ సంధి తరువాత జరిగే ఫలితాన్ని పరిచయం చేస్తుంది; కాలసంబంధాన్ని తెలుగులో రెండు విధాలుగా సహజంగా వ్యక్తం చేయవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, “ఆమె తొడ పడిపోతుంది.” ఈ వ్యక్తీకరణ ప్రజనన అవయవాలను ప్రభావితం చేసే శారీరక బాధకు మృదూక్తి కావచ్చు; అయితే ఖచ్చితమైన భావం అనిశ్చితం.
    reason: కఠినమైన హెబ్రీ వ్యక్తీకరణను అతిగా వైద్యపరంగా లేదా ప్రజననపరంగా నిర్దిష్టీకరించకుండా అక్షరార్థం, సాధ్యమైన భావం రెండింటినీ అందిస్తుంది.
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: అతడు ఆమెతో ఆ నీళ్లు తాగించినప్పుడు
  rationale: హిఫీల్ రూపంలోని ‘తాగించు’ అనే కారణార్థాన్ని నిలుపుతూ, తరువాతి ఫలిత వాక్యానికి సహజమైన కాలసూచక ఉపవాక్యంగా అనువదించబడింది.
- source_word: נִטְמְאָה
  choice: ఆమె అపవిత్రురాలై
  rationale: ఈ సందర్భంలో నైతిక, ఆచారపరమైన అపవిత్రత రెండింటినీ సూచించగల మూలపద విస్తృతిని ‘అపవిత్రురాలై’ నిలుపుతుంది.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: తన భర్తపట్ల విశ్వాసఘాతుకంగా ప్రవర్తించి
  rationale: మూలంలోని సమానమూల పదబంధం విశ్వాసభంగాన్ని బలంగా సూచిస్తుంది; ‘విశ్వాసఘాతుకంగా ప్రవర్తించి’ సంబంధపరమైన ద్రోహాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: శాపాన్ని కలిగించే ఆ నీళ్లు
  rationale: నీళ్లు శాపాన్ని మోసుకొచ్చే లేదా అమలు చేసే సాధనమని తెలిపే కృదంత భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְמָרִים
  choice: చేదు బాధ కలిగించేలా
  rationale: కఠినమైన ఈ హెబ్రీ పదబంధాన్ని చేదు ప్రభావం లేదా బాధ అనే ఫలితార్థంతో అనువదించింది; ప్రత్యామ్నాయ నిర్మాణం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: ఆమె కడుపు ఉబ్బుతుంది
  rationale: בטן అనే సాధారణ శరీరపదాన్ని గర్భాశయం అని అతిగా నిర్దిష్టం చేయకుండా ‘కడుపు’గా నేరుగా అనువదించింది.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: ఆమె తొడ క్షీణించిపోతుంది
  rationale: ‘తొడ పడిపోతుంది’ అనే అక్షరార్థం తెలుగులో అస్పష్టంగా ఉంటుంది. శరీర క్షీణతను సూచించే భావాన్ని అందిస్తూ, ‘తొడ’ అనే మూలంలోని మృదూక్తిని నిలుపుతుంది.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: ఆ స్త్రీ తన ప్రజల మధ్య శాపానికి నిదర్శనంగా ఉంటుంది
  rationale: ఆమె సమాజంలో శాపానికి ఉదాహరణగా లేదా శాపోక్తిలో ప్రస్తావించబడే వ్యక్తిగా మారే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరీక్షా శాపంలోని శారీరక బాధను నిర్దిష్ట వైద్య లేదా ప్రజనన అర్థంతో వివరించాలా?
  choice: ‘ఆమె కడుపు ఉబ్బుతుంది, ఆమె తొడ క్షీణించిపోతుంది’ అని మూలంలోని శరీరపదాలను నిలుపడం
  alternative: ‘ఆమె గర్భస్రావం అవుతుంది’ లేదా ‘ఆమె ప్రజనన అవయవాలు క్షీణిస్తాయి’ అని నిర్దిష్టీకరించడం
  rationale: హెబ్రీ వచనం స్పష్టమైన శరీరపదాలతో పాటు అర్థం అనిశ్చితమైన మృదూక్తిని ఉపయోగిస్తుంది. గర్భస్రావం లేదా నిర్దిష్ట ప్రజనన అవయవ వ్యాధి అని తేల్చడం మూలం కంటే ఎక్కువ వివరణను చేర్చుతుంది; అందుచేత అనిశ్చితి పాదటిప్పణిలో స్పష్టంచేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘నీళ్లు’ సహజ వాడుకను, ‘అపవిత్రురాలు,’ ‘విశ్వాసఘాతుకం,’ ‘శాపం’ వంటి సందర్భోచిత గౌరవప్రద పదజాలాన్ని ఉపయోగించింది. మూలంలోని శారీరక మృదూక్తి, భావ అనిశ్చితి నిలుపబడ్డాయి.
