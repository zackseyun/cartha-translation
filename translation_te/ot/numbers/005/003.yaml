id: NUM.5.3
reference: Numbers 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: te
  text: మగవారినీ స్త్రీలనూ శిబిరం వెలుపలికి పంపాలి. వారు తమ శిబిరాలను అపవిత్రపరచకుండా వారిని బయటికి పంపాలి; నేను వారి మధ్య నివసిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి మధ్యలో నేను నివసిస్తున్నాను.” హీబ్రూలో “వారి మధ్య” అనే మాట ప్రజలనుగానీ వారి శిబిరాలనుగానీ సూచించవచ్చు; “శిబిరాలు” అనే పదం బహువచనంలో ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: పురుషులనైనా స్త్రీలనైనా
  rationale: హీబ్రూ పదబంధం మగవారి నుండి ఆడవారి వరకు అనే సమగ్ర భావాన్ని తెలియజేస్తుంది. తెలుగులో ఈ సందర్భానికి సహజంగా, గౌరవప్రదంగా ఉండే జంట పదాల ద్వారా ఇద్దరినీ చేర్చే భావాన్ని వ్యక్తం చేసింది.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: పంపివేయాలి ... బయటికి పంపివేయాలి
  rationale: שלח పియేల్ క్రియ పునరుక్తిని తెలుగులోనూ పునరావృతం చేసి ఆజ్ఞలోని బలాన్ని నిలిపింది; శిక్షార్థకమైన అతిశయాన్ని చేర్చకుండా శిబిరం నుండి తొలగించడాన్ని స్పష్టం చేసింది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: శిబిర సరిహద్దుకు బయటకు పంపడం అనే ప్రాదేశిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְטַמְּאוּ
  choice: అపవిత్రం కాకుండా
  rationale: యాజక సంబంధమైన శుద్ధి-అశుద్ధి సందర్భంలో טמא సూచించే ఆచారపరమైన అపవిత్రతను ‘అపవిత్రం’ స్పష్టంగా నిలుపుతుంది.
- source_word: מַחֲנֵיהֶם
  choice: వారి శిబిరాలు
  rationale: హీబ్రూలో నామవాచకం బహువచనంలో ఉండటాన్ని నిలిపింది; ఇది శిబిరంలోని విభాగాలు లేదా వేర్వేరు మకాములను సూచించే అవకాశం ఉంది.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: నేను వారి మధ్య నివసిస్తున్న
  rationale: బహువచన ప్రత్యయం ప్రజలను గానీ వారి శిబిరాలను సమష్టిగా గానీ సూచించవచ్చు. ప్రధాన పాఠం దేవుడు వారి మధ్య నివసిస్తున్నాడనే వ్యక్తిగత-సామూహిక భావాన్ని సహజంగా వ్యక్తం చేస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: בְּתוֹכָם లోని బహువచన ప్రత్యయం ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: దేవుడు ప్రజల మధ్య నివసిస్తున్నాడనే భావంతో ‘నేను వారి మధ్య నివసిస్తున్న’
  alternative: దేవుడు వారి శిబిరాల మధ్యలో నివసిస్తున్నాడనే స్థలార్థక భావం
  rationale: హీబ్రూ రూపం ప్రజలను లేదా శిబిరాలను సమష్టిగా సూచించగలదు. ప్రధాన అనువాదం ఇశ్రాయేలు ప్రజల మధ్య దేవుని సన్నిధిని ముందుకు తెస్తుంది; అయితే స్థలార్థక పఠనాన్ని పాదటిప్పణిలో ఉంచి అసలు సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. ఆజ్ఞాత్మక భావానికి ‘పంపివేయాలి’ను ఉపయోగించింది. యాజక శుద్ధి సందర్భాన్ని నిలపడానికి ‘అపవిత్రం’ను ఎంచుకుంది. హీబ్రూ బహువచనాన్ని ప్రధాన పాఠంలో కాపాడి, చివరి సంబంధవాక్యంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో తెలిపింది.
