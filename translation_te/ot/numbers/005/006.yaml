id: NUM.5.6
reference: Numbers 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: te
  text: '“ఇశ్రాయేలీయులతో ఇలా చెప్పు: ఒక పురుషుడైనా స్త్రీయైనా, మానవులు చేసే పాపాల్లో ఏదైనా చేసి యెహోవాకు వ్యతిరేకంగా నమ్మకద్రోహం చేస్తే, ఆ వ్యక్తి దోషి అవుతాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో ఇలా చెప్పు
  rationale: ఆధునిక తెలుగులో సహజమైన దైవాజ్ఞా సూత్రాన్ని ఉపయోగిస్తూ, ఇశ్రాయేలు సమాజాన్నే ఉద్దేశించిన మూలభావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ఒక పురుషుడైనా, స్త్రీయైనా
  rationale: హీబ్రూలోని పురుషుడు–స్త్రీ అనే స్పష్టమైన జంటను, నియమం ఇరువురికీ వర్తిస్తుందనే విభజనాత్మక భావంతో నిలుపుతుంది.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: మానవులు చేసే పాపాల్లో దేనినైనా
  rationale: הָאָדָם ఇక్కడ ఒక మగవ్యక్తిని కాక మానవజాతిని సాధారణంగా సూచిస్తుంది. తెలుగు వాక్యం ఆ సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִמְעֹל מַעַל
  choice: నమ్మకద్రోహం చేస్తే
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకం కలిసిన హీబ్రూ ప్రయోగం విశ్వాసభంగాన్ని బలపరుస్తుంది; ‘నమ్మకద్రోహం’ ఒడంబడిక సంబంధమైన అవిశ్వాసాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాకు
  rationale: מעל తో వచ్చిన ב ద్రోహం ఎవరికి వ్యతిరేకంగా జరిగిందో సూచిస్తుంది. దైవనామాన్ని పారదర్శకంగా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి అపరాధి అవుతాడు
  rationale: נֶפֶשׁ ఇక్కడ సాంకేతిక అర్థంలోని ‘ఆత్మ’ కాదు, సంబంధిత వ్యక్తిని సూచిస్తుంది; אָשַׁם ఫలితంగా ఏర్పడే అపరాధస్థితిని తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని తెలుగు పాఠకులకు పరిచితమైన రూపంలో ప్రత్యక్షంగా నిలుపుతుంది; బిరుదుతో భర్తీ చేయడం వల్ల కలిగే తేడాను నివారిస్తుంది.
- issue: הָאָדָם యొక్క సాధారణ మానవార్థం
  choice: మానవులు
  alternative: మనిషి
  rationale: ఈ న్యాయవాక్యంలో పదం పురుషులకు మాత్రమే కాక మానవులకు సాధారణంగా వర్తిస్తుంది. ముందే పురుషుడు, స్త్రీ ఇద్దరూ స్పష్టంగా పేర్కొనబడినందున సమగ్ర అర్థాన్ని తెలుగులో బహువచనంతో సహజంగా తెలిపాం.
- issue: מעל యొక్క అపరాధ స్వభావం
  choice: యెహోవాకు నమ్మకద్రోహం
  alternative: యెహోవాకు విరోధంగా అపరాధం
  rationale: ఈ పదం సాధారణ తప్పును మించి సంబంధం లేదా పవిత్ర బాధ్యతలో విశ్వాసభంగాన్ని సూచిస్తుంది. అనువాదం ఆ ఒడంబడిక సంబంధమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి. మూలంలోని పురుషుడు–స్త్రీ జంట, మానవులకు సాధారణంగా వర్తించే పాపం, యెహోవాపట్ల నమ్మకద్రోహం, దాని ఫలితమైన అపరాధస్థితి అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
