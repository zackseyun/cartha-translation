id: NUM.5.25
reference: Numbers 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: te
  text: అప్పుడు యాజకుడు ఆ స్త్రీ చేతిలోనుండి ఈర్ష్య ధాన్యార్పణాన్ని తీసుకొని, ఆ ధాన్యార్పణాన్ని యాహ్వే సన్నిధిలో ఊపి, దానిని బలిపీఠం వద్దకు తీసుకురావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: అప్పుడు యాజకుడు ... తీసుకొని
  rationale: వావ్‌తో కూడిన క్రియ ఆచార ప్రక్రియలో తదుపరి దశను సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘యాజకుడు’ definite cultic official‌ను సూచిస్తుంది.
- source_word: מִיַּד הָאִשָּׁה
  choice: ఆ స్త్రీ చేతిలోనుండి
  rationale: హెబ్రీ మూలంలోని ప్రత్యక్ష స్వీకరణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: ఈర్ష్యకు సంబంధించిన ధాన్యార్పణను
  rationale: מִנְחָהను యాజక సంబంధ సందర్భంలో ‘ధాన్యార్పణ’గా నిర్దిష్టంగా అనువదించాం. הַקְּנָאֹתతో ఉన్న సంబంధాన్ని అస్పష్టంగా చేయకుండా, తెలుగులో సహజంగా ‘ఈర్ష్యకు సంబంధించిన’ అని ఇచ్చాం.
- source_word: וְהֵנִיף אֶת הַמִּנְחָה
  choice: ఆ ధాన్యార్పణను ... ఊపి
  rationale: నוף హిఫీల్ బల్యాచారంలో అర్పణను ఆచారబద్ధంగా ఊపడాన్ని సూచిస్తుంది. ‘ఊపి’ మూలక్రియను నేరుగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: లిటర్జికల్ ‘ముందు’ అనే భావాన్ని తెలుగులో సహజమైన ‘సన్నిధిలో’గా వ్యక్తం చేశాం; దైవనామాన్ని లిప్యంతరీకరించాం.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: దానిని బలిపీఠం దగ్గరకు తీసుకురావాలి
  rationale: קרב హిఫీల్‌లోని ‘దగ్గరకు తీసుకురావడం’ అనే బల్యార్పణ సంబంధ సూక్ష్మభావాన్ని నిలుపుతూ, తెలుగులో ఆదేశాత్మక ప్రక్రియగా సహజంగా ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: מִנְחַת הַקְּנָאֹת లోని బహువచన/సంబంధ భావం
  choice: ఈర్ష్యకు సంబంధించిన ధాన్యార్పణ
  alternative: ఈర్ష్యల ధాన్యార్పణ
  rationale: హెబ్రీ బహువచన రూపాన్ని యాంత్రికంగా తెలుగులో బహువచనంగా మార్చితే అర్థం అసహజంగా మారుతుంది. ఆచార నామంలోని సంబంధాన్ని నిలుపుతూ దాని ఖచ్చిత స్వభావాన్ని అతిగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యాజక ఆచారానికి తగిన గంభీరతతో. వాక్యంలోని వరుస ఆచార చర్యలను తెలుగు సంయుక్త క్రియలతో సహజంగా అనుసంధానించాం.
