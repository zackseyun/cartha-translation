source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: te
  text: అయితే ఆ స్త్రీ అపవిత్రం కాకుండా శుద్ధంగా ఉంటే, ఆమె నిర్దోషిగా తేలుతుంది, గర్భం ధరిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “విత్తనంతో విత్తబడుతుంది”; ఇది గర్భం ధరించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … ఉంటే
  rationale: ముందటి వచనంలోని దోషి పరిస్థితికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא נִטְמְאָה
  choice: తనను తాను అపవిత్రపరచుకోకుండా
  rationale: నిఫాల్ రూపంలోని అపవిత్రమవడం అనే భావాన్ని, ఈ వ్యభిచార పరీక్ష సందర్భంలోని లైంగిక-నైతిక అపవిత్రతకు తగిన ప్రతిబింబార్థంతో వ్యక్తం చేస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: నిర్దిష్ట నామవాచకానికి సందర్భోచితమైన సహజ తెలుగు రూపం.
- source_word: וּטְהֹרָה הִוא
  choice: పవిత్రంగా ఉంటే
  rationale: טָהוֹר లోని శుద్ధత/పవిత్రత భావాన్ని ఇక్కడి ఆచార-నైతిక సందర్భంలో సహజంగా అందిస్తుంది; ముందున్న షరతుతో తెలుగు వాక్యనిర్మాణంలో కలిపింది.
- source_word: וְנִקְּתָה
  choice: నిర్దోషిగా తేలుతుంది
  rationale: נקה నిఫాల్‌లోని విముక్తి, నింద తొలగడం, నిర్దోషిత్వం వెల్లడవడం అనే పరిధిని ఈ పరీక్ష ఫలితానికి తగిన విధంగా అందిస్తుంది; కేవలం శారీరక హాని తప్పడమనే అర్థానికి పరిమితం చేయదు.
- source_word: וְנִזְרְעָה זָרַע
  choice: ఆమె గర్భం ధరిస్తుంది
  rationale: అక్షరార్థంగా ‘విత్తనంతో విత్తబడుతుంది’ అనే హీబ్రూ నుడికారాన్ని, అదనంగా ‘సామర్థ్యం కలుగుతుంది’ అని చేర్చకుండా, గర్భధారణ భావంతో స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: నిర్దోషిగా తేలిన స్త్రీకి కలిగే ఫలితం
  choice: ఆమె నిర్దోషిగా తేలి గర్భం ధరిస్తుందని వాక్యం చెబుతుంది.
  alternative: ఆమెకు గర్భం ధరించే సామర్థ్యం ఉంటుంది; లేదా సాధారణంగా ఆమె సంతానోత్పత్తి కొనసాగుతుంది.
  rationale: וְנִזְרְעָה זָרַע గర్భధారణ/సంతానోత్పత్తికి సంబంధించిన నుడికారం. మూలంలోని ప్రత్యక్ష భవిష్యత్ వాక్యాన్ని నిలుపుతూ ‘గర్భం ధరించగలదు’ అనే సామర్థ్యార్థక విస్తరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో ఉంది. ‘అపవిత్రపరచుకోకుండా’ మరియు ‘పవిత్రంగా’ అనే పదాలు మూలంలోని అపవిత్రత–శుద్ధత వ్యత్యాసాన్ని నిలుపుతాయి.
