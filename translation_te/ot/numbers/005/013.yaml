  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన షరతుల పరంపరగా సహజంగా చదవబడుతుంది. “ఆమె దాగి ఉండి” అనేది నిఫాల్ రూపపు కర్మణి/ఆత్మార్థక అస్పష్టతను తగినంతగా కాపాడుతుంది.
