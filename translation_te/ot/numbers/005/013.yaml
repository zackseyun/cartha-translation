id: NUM.5.13
reference: Numbers 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: te
  text: ఒక పురుషుడు ఆమెతో వీర్యస్రావంతో శయనించి[a], అది ఆమె భర్త కంటికి మరుగై, ఆమె దాగి ఉండి, ఆమె అపవిత్రురాలై, ఆమెకు వ్యతిరేకంగా సాక్షి ఎవరూ లేక, ఆమె పట్టుబడకపోతే[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వీర్యపు శయనం”; అంటే వీర్యస్రావంతో కూడిన లైంగిక సంబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె పట్టుకోబడలేదు.” కొందరు దీన్ని “ఆమెపై బలవంతం జరగలేదు” అనే భావంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: మరొక పురుషుడు ఆమెతో శయనించి
  rationale: లైంగిక సందర్భంలోని שׁכב ‘తో శయనించు’ అని అర్థం. ‘మరొక’ అనేది వివాహిత స్త్రీ భర్త కాని పురుషుడనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁכְבַת זֶרַע
  choice: వీర్యస్ఖలనం జరిగితే
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘వీర్యపు శయనం’ అనే భావం కలిగి, వీర్యస్ఖలనంతో కూడిన సంభోగాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో స్పష్టమైన, గౌరవప్రదమైన శరీర సంబంధ పదజాలం వాడబడింది.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: ఆ సంగతి ఆమె భర్త కంటికి మరుగై
  rationale: ‘ఆమె భర్త కళ్లకు దాగిపోవడం’ అనే హీబ్రూ దృశ్యరూపాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: וְנִסְתְּרָה
  choice: ఆమె చేసినది రహస్యంగా ఉండి
  rationale: నిఫాల్ రూపంలోని కర్మణి/ఆత్మార్థక అస్పష్టతను పూర్తిగా ‘ఆమె దాచుకుంది’ అని నిర్ణయించకుండా, విషయం రహస్యంగా ఉండడంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִיא נִטְמָאָה
  choice: ఆమె అపవిత్రురాలైతే
  rationale: טמא యొక్క శుద్ధి-అశుద్ధి సంబంధ న్యాయపరమైన భావాన్ని ‘అపవిత్రురాలు’ నిలుపుతుంది; భావోద్వేగపూరితమైన అదనపు తీర్పును చేర్చదు.
- source_word: וְעֵד אֵין בָּהּ
  choice: ఆమెకు వ్యతిరేకంగా సాక్షి ఎవరూ లేక
  rationale: בָּהּ యొక్క సంబంధ/వ్యతిరేక భావాన్ని న్యాయ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: ఆమె పట్టుబడకపోతే
  rationale: נתפשׂ ఇక్కడ చర్యలో పట్టుబడటం లేదా కనుగొనబడటం అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ‘బలవంతం చేయబడలేదు’ అనే వివాదాస్పద అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించదు.
theological_decisions:
- issue: נִטְמָאָה లోని అపవిత్రత భాష
  choice: ఆమె అపవిత్రురాలైతే
  alternative: ఆమె కలుషితురాలైతే
  rationale: ఈ సందర్భం అనుమానిత వ్యభిచారం మరియు శుద్ధి-అశుద్ధి న్యాయానికి చెందినది. ‘అపవిత్రురాలు’ మూలంలోని వర్గాన్ని నిలుపుతూ, ‘కలుషితురాలు’ కలిగించగల అధిక నైతిక లేదా భావోద్వేగ ఛాయను నివారిస్తుంది.
- issue: לֹא נִתְפָּשָׂה యొక్క అర్థం
  choice: ఆమె పట్టుబడకపోతే
  alternative: ఆమె పట్టుకోబడకపోతే; కొందరి అవగాహనలో, ఆమెపై బలవంతం జరగకపోతే
  rationale: సాక్ష్యం లేని న్యాయ సందర్భంలో ‘పట్టుబడలేదు’ అనేది ప్రధానంగా సరిపోతుంది. అయితే ‘పట్టుకోబడింది/నిర్బంధించబడింది’ అనే మూల క్రియార్థం వల్ల బలవంతం అనే అవగాహనకు అవకాశం ఉన్నందున దాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-శుద్ధి శైలి పాటించబడింది. వచనం ముందూ వెనుకా కొనసాగే షరతుల పరంపరలో భాగమైనందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. ప్రధాన పాఠ్యంలో రెండు పాదటిప్పణి సూచికలూ వరుసగా [a], [b] రూపంలో ఉన్నాయి.
