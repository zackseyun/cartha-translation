id: NUM.5.26
reference: Numbers 5:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: te
  text: అప్పుడు యాజకుడు ధాన్యార్పణలోనుండి దాని జ్ఞాపకార్థ భాగమైన ఒక పిడికెడును తీసుకొని, దాన్ని బలిపీఠం మీద దహించాలి. ఆ తర్వాత అతడు ఆ స్త్రీకి ఆ నీటిని తాగించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָמַץ
  choice: ఒక పిడికెడు ... తీసుకొని
  rationale: బలి అర్పణ సందర్భంలో קמץ అనేది అర్పణలోనుంచి పిడికెడు తీసుకోవడాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా క్రియను తరువాత ఉంచాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా, ధర్మశాస్త్ర సందర్భంలో כֹּהֵןకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: מִן הַמִּנְחָה
  choice: ధాన్యార్పణలోనుంచి
  rationale: యాజక సంబంధ బలి సందర్భంలో מִנְחָה సాధారణ కానుకను కాక ధాన్యార్పణను సూచిస్తుంది.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: దాని జ్ఞాపకార్థ భాగాన్ని
  rationale: אַזְכָּרָה అనేది బలిపీఠం మీద దహించే ధాన్యార్పణ భాగాన్ని సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ధాన్యార్పణను తిరిగి సూచిస్తుంది.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: దాన్ని బలిపీఠం మీద దహించాలి
  rationale: బలి సందర్భంలో הקטיר అర్పణను బలిపీఠం మీద కాల్చడాన్ని సూచిస్తుంది; מִזְבֵּחָהలోని దిశార్థక రూపాన్ని సహజ తెలుగులో ‘బలిపీఠం మీద’ అని ఇచ్చాం.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: క్రతువులోని తదుపరి చర్యను తెలిపే కాలక్రమ సూచన.
- source_word: יַשְׁקֶה
  choice: తాగించాలి
  rationale: שׁקה హిఫీల్ రూపంలోని కారక భావాన్ని తెలుగు ‘తాగించాలి’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת הָאִשָּׁה
  choice: ఆ స్త్రీతో
  rationale: కారక క్రియ ‘తాగించాలి’తో సహజ తెలుగు నిర్మాణంలో పానకర్తను ‘స్త్రీతో’ అని సూచించాం.
- source_word: אֶת הַמָּיִם
  choice: ఆ నీటిని
  rationale: హీబ్రూ పాఠంలో ఇక్కడ ‘నీరు’ మాత్రమే ఉంది; పూర్వసందర్భంలో ఇప్పటికే నిర్దిష్టమైన నీటిని సూచిస్తున్నందున నిర్దేశక భావాన్ని ‘ఆ’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: ఈ వచనంలో నీటిని ‘చేదు నీరు’ అని పేర్కొనాలా?
  choice: మూలపాఠం ప్రకారం ‘ఆ నీటిని’ అని మాత్రమే ఉంచడం
  alternative: ‘ఆ చేదు నీటిని’
  rationale: ఈ వచనంలోని הַמָּיִםలో ‘చేదు’ అనే విశేషణం లేదు. సమీప సందర్భం ఆ నీటిని అలా గుర్తించినా, ఆ పదాన్ని ప్రధాన పాఠంలో చేర్చడం మూలవచనం కంటే ఎక్కువ స్పష్టీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ధర్మశాస్త్ర శైలిని వాడాం. ‘ధాన్యార్పణ’, ‘జ్ఞాపకార్థ భాగం’, ‘బలిపీఠం’ వంటి పదాలు క్రతువు యొక్క సాంకేతిక అర్థాన్ని నిలుపుతాయి. మూలంలో లేని ‘చేదు’ అనే పదాన్ని చేర్చలేదు; అందువల్ల అనవసరమైన పాదసూచిక అవసరం లేదు.
