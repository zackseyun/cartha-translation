id: NUM.5.29
reference: Numbers 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: te
  text: 'అసూయకు సంబంధించిన ధర్మశాస్త్రం ఇదే: ఒక భార్య తన భర్తకు భార్యగా ఉండగా దారితప్పి అపవిత్రురాలైతే[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దారితప్పి” అనేది వైవాహిక అవిశ్వాసాన్ని సూచించే హెబ్రీ రూపకం. “అపవిత్రురాలై” అనే పదం హెబ్రీ మూలపాఠంలోని అపవిత్రత భాషను ప్రతిబింబిస్తుంది; మూలపాఠం నేరుగా “వ్యభిచారం చేసి” అని చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תּוֹרַת הַקְּנָאֹת
  choice: అసూయకు సంబంధించిన ధర్మశాస్త్రం ఇదే
  rationale: תּוֹרַת అనే న్యాయపరమైన పదానికి ‘ధర్మశాస్త్రం’ సహజమైన తెలుగు సమానం. הַקְּנָאֹת వ్యాకరణపరంగా బహువచనమైనా, ఇక్కడ అసూయకు సంబంధించిన ఈ న్యాయవిధానానికి సాంకేతిక శీర్షికగా పనిచేస్తుంది; అందువల్ల తెలుగులో సహజమైన ఏకవచన భావాన్ని ఉపయోగించాం.
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: ఒక భార్య ... దారితప్పి
  rationale: אִשָּׁה సందర్భానుసారం ‘భార్య.’ תִּשְׂטֶה వైవాహిక అవిశ్వాసాన్ని దారితప్పడం అనే రూపకంతో సూచిస్తుంది; మూలంలో ఉన్న రూపకాన్ని కాపాడేందుకు ‘దారితప్పి’ అని అనువదించాం.
- source_word: תַּחַת אִישָׁהּ
  choice: తన భర్తతో ఉన్న వివాహబంధంలోనే
  rationale: అక్షరార్థంగా ‘తన భర్త కింద.’ ఇక్కడ תַּחַת భర్తతోనున్న వైవాహిక బంధం లేదా స్థితిని సూచించే నుడికారం. తెలుగులో తప్పుగా శారీరక స్థానార్థం రాకుండా దాని సందర్భార్థాన్ని తెలిపాం.
- source_word: וְנִטְמָאָה
  choice: అపవిత్రురాలైనప్పుడు
  rationale: טמא నిఫల్ రూపం అపవిత్రం కావడాన్ని సూచిస్తుంది. సందర్భం లైంగిక అవిశ్వాసానికి సంబంధించినదైనా, ‘వ్యభిచారం చేసినప్పుడు’ అని మరింత నిర్దిష్టం చేయకుండా మూలంలోని అపవిత్రత భాషను నిలిపాం.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: అపవిత్రురాలైనప్పుడు
  alternative: అశుద్ధురాలైనప్పుడు; వ్యభిచారం చేసినప్పుడు
  rationale: సందర్భం అనుమానిత వైవాహిక అవిశ్వాసమైనప్పటికీ, హెబ్రీ పాఠం నేరుగా ‘వ్యభిచారం’ అనే పదం కాకుండా అపవిత్రతకు సంబంధించిన טמא పదాన్ని వాడుతుంది. కాబట్టి అది కేవలం ఆచారపరమైన అశుద్ధత అని గానీ, స్పష్టమైన న్యాయనిర్ణయంగా వ్యభిచారం అని గానీ సంకుచితం చేయలేదు.
- issue: תַּחַת אִישָׁהּ లోని వైవాహిక నుడికారం
  choice: తన భర్తతో ఉన్న వివాహబంధంలోనే
  alternative: తన భర్త కింద; తన భర్త అధికారంలో ఉండి
  rationale: మూల నుడికారం వైవాహిక బంధం/స్థితిని సూచిస్తుంది. ‘అధికారం’ మాత్రమే అని అనువదిస్తే సాధ్యమైన భావాన్ని ఏకపక్షంగా నిర్ణయించినట్లవుతుంది; అక్షరార్థ తెలుగు మాత్రం అపార్థానికి దారితీస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. ‘ధర్మశాస్త్రం’ బైబిలు న్యాయవిధాన సందర్భానికి అనుకూలం. హెబ్రీ నుడికారాన్ని అక్షరార్థంగా కాకుండా స్పష్టమైన సహజ తెలుగులో అందించాం; అయితే దారితప్పడం మరియు అపవిత్రత అనే మూల రూపకాలు, భావతీవ్రత నిలిపాం.
