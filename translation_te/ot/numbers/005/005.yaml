  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: దైవ ప్రసంగాన్ని పరిచయం చేసే דבר క్రియకు సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం; వావ్-క్రమనిర్మాణం కొత్త ప్రసంగ విభాగాన్ని ప్రారంభిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కలిసిన אֶל సూచించే సంభాషణ లక్ష్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ద్విరుక్తమైన ‘చెబుతూ’ కంటే ప్రవాహవంతంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని ఏ రూపమూ పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రసంగ-పరిచయ వాక్యం. తరువాతి వచనంలో సందేశం కొనసాగుతుందని ద్విబిందువు సూచిస్తుంది.
