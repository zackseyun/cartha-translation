source:
  edition: WLC
  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: te
  text: తర్వాత అతడు ఆ స్త్రీకి శాపాన్ని కలిగించే చేదు నీటిని తాగించాలి[a]; శాపాన్ని కలిగించే ఆ నీరు ఆమెలోకి ప్రవేశించి చేదుతనాన్ని కలిగిస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘చేదుతనపు నీళ్లు.’ హీబ్రూలో ‘నీళ్లు’ బహువచన రూపంలో ఉంది; నీటిని సూచించడానికి ఇది సాధారణ హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శాపాన్ని కలిగించే ఆ నీరు ఆమెలోకి చేదుతనం కోసం ప్రవేశిస్తుంది.’ చివరి హీబ్రూ పదబంధం ఫలితం లేదా ప్రభావాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: తర్వాత అతడు ... ఆ స్త్రీతో తాగించాలి
  rationale: שׁקה ధాతువు హిఫీల్ రూపంలో ‘తాగించు/తాగడానికి ఇవ్వు’ అనే కారణార్థాన్ని ఇస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘స్త్రీతో తాగించాలి’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מֵי הַמָּרִים
  choice: చేదు నీరు
  rationale: అక్షరార్థంగా ‘చేదుతనపు నీళ్లు.’ ద్రవాన్ని సూచించేటప్పుడు ఆధునిక తెలుగులో ఏకవచనమైన ‘నీరు’ సహజంగా ఉంటుంది; ‘చేదు’ దాని గుణాన్ని కాపాడుతుంది.
- source_word: הַמְאָרֲרִים
  choice: శాపాన్ని కలిగించే
  rationale: ארר నుండి వచ్చిన ఈ కృదంతం, నీరు కేవలం శపించబడిందని కాక శాపాన్ని మోసుకొచ్చే లేదా అమలు చేసే సాధనమని సూచిస్తుంది.
- source_word: וּבָאוּ בָהּ
  choice: ఆమె లోపలికి వెళ్లి
  rationale: בוא తో కూడిన ב ఆమె శరీరంలోకి ప్రవేశాన్ని సూచిస్తుంది. ‘ఆమె లోపలికి వెళ్లి’ సహజమైన తెలుగు రూపం.
- source_word: לְמָרִים
  choice: చేదుతనాన్ని కలిగిస్తుంది
  rationale: לְ ఇక్కడ ఫలితం లేదా ప్రభావాన్ని సూచించవచ్చు. అరుదైన బహువచన/విశేషణాత్మక రూపాన్ని సహజ తెలుగులో ఫలితార్థంగా వ్యక్తం చేస్తూ, శారీరక పరిణామాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: పరీక్షా విధిలో శాపానికి నీటితో ఉన్న సంబంధం
  choice: ‘శాపాన్ని కలిగించే’ అని అనువదించడం
  alternative: ‘శపించబడిన నీరు’
  rationale: హీబ్రూ కృదంతం, తప్పు ఉన్న సందర్భంలో ఒడంబడిక శాపాన్ని అమలు చేసే నీటి పాత్రను సూచిస్తుంది. దీనివల్ల మాంత్రిక భావనను దిగుమతి చేయకుండా న్యాయపరమైన ఆచార స్వభావం నిలుస్తుంది.
- issue: לְמָרִים యొక్క చివరి ఫలితార్థం
  choice: ‘చేదుతనాన్ని కలిగిస్తుంది’
  alternative: ‘చేదుగా’ లేదా ‘చేదుతనం కోసం’
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ప్రధాన పాఠం ఫలిత భావాన్ని సహజ తెలుగులో తెలుపుతుంది; ఖచ్చితమైన శారీరక ప్రభావాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘చేదు నీరు,’ ‘శాపాన్ని కలిగించే’ అనే పునరుక్తి మూలపాఠంలోని ఉద్దేశపూర్వక పునరావృతిని కాపాడుతుంది.
