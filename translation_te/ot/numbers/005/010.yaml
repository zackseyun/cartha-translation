id: NUM.5.10
reference: Numbers 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֥ישׁ אֶת קֳדָשָׁ֖י/ו ל֣/וֹ יִהְי֑וּ אִ֛ישׁ אֲשֶׁר יִתֵּ֥ן לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: te
  text: ప్రతి మనిషి యొక్క పవిత్ర అర్పణలు అతనివే ఉంటాయి[a]; ఒక మనిషి యాజకునికి ఏది ఇస్తాడో, అది యాజకునిదే అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘అతని పవిత్ర వస్తువులు.’ ఈ మాటలు పవిత్ర అర్పణలుగా ప్రతిష్ఠించిన వస్తువులను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ప్రతి మనిషి / ఒక మనిషి
  rationale: న్యాయసంబంధ సందర్భంలో వ్యాకరణపరంగా పుంలింగ ఏకవచనమైన పదం పంపిణీ భావంతో వాడబడింది. మొదటి చోట ‘ప్రతి మనిషి’, రెండవ చోట ‘ఒక మనిషి’ అని సహజంగా అనువదించబడింది.
- source_word: קֳדָשָׁיו
  choice: అతని ప్రతిష్ఠిత అర్పణలు
  rationale: קדשׁ పదం ఇక్కడ పవిత్రంగా ప్రత్యేకించబడిన కానుకలు లేదా వస్తువులను సూచిస్తుంది. ‘ప్రతిష్ఠిత అర్పణలు’ ఆరాధనాసంబంధ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לוֹ יִהְיוּ
  choice: అతనివిగానే ఉంటాయి
  rationale: ఈ నిర్మాణం స్వామ్యాన్ని సూచిస్తుంది. ‘అతనివిగానే ఉంటాయి’ అనే రూపం వస్తువులు అర్పించబడే వరకు అర్పించే వ్యక్తికే చెందినవనే భావాన్ని, హీబ్రూ వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: ఒక మనిషి యాజకునికి ఏది ఇస్తాడో
  rationale: సంబంధవాచక వాక్యభాగానికి సాధారణ, విస్తృత న్యాయార్థం ఉంది. ‘ఏది ఇస్తాడో’ దానిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘యాజకునికి’ నిర్దిష్ట ఏకవచనాన్ని కాపాడుతుంది.
- source_word: לוֹ יִהְיֶה
  choice: అది యాజకునిదే అవుతుంది
  rationale: చివరి స్వామ్య సూచక సర్వనామం సందర్భంలో యాజకునిని సూచిస్తుంది. తెలుగులో అస్పష్టత వల్ల తప్పుగా అర్థం కాకుండా నామవాచకాన్ని పునరుక్తి చేసి, ఇచ్చినది యాజకునికి చెందుతుందని స్పష్టం చేయబడింది.
theological_decisions:
- issue: మొదటి לוֹ యొక్క సూచిత వ్యక్తి
  choice: అర్పించే మనిషి—‘అతనివిగానే ఉంటాయి’
  alternative: యాజకుడు—‘అవి అతనివే అవుతాయి’
  rationale: హీబ్రూ వాక్య నిర్మాణం మొదటి ‘అతనికి’ను సమీపంలోని ‘మనిషి’తో సహజంగా అనుసంధానిస్తుంది; రెండవ భాగం యాజకునికి ఇచ్చినది యాజకునిదని ప్రత్యేకంగా పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘ప్రతిష్ఠిత అర్పణలు’ ఆరాధనాసంబంధ అర్థాన్ని స్పష్టం చేస్తుంది. చివరి ‘לוֹ’ తెలుగులో అనవసరంగా సందిగ్ధంగా మారకుండా ‘యాజకునిదే’ అని వ్యక్తం చేయబడింది.
