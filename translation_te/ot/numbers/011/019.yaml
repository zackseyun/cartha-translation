source:
  edition: WLC
  text: לֹ֣א י֥וֹם אֶחָ֛ד תֹּאכְל֖וּ/ן וְ/לֹ֣א יוֹמָ֑יִם וְ/לֹ֣א חֲמִשָּׁ֣ה יָמִ֗ים וְ/לֹא֙ עֲשָׂרָ֣ה יָמִ֔ים וְ/לֹ֖א עֶשְׂרִ֥ים יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: te
  text: మీరు ఒక్క రోజు మాత్రమే కాదు, రెండు రోజులు మాత్రమే కాదు, ఐదు రోజులు మాత్రమే కాదు, పది రోజులు మాత్రమే కాదు, ఇరవై రోజులు మాత్రమే కాదు తింటారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: కాదు
  rationale: ప్రతి కాలవ్యవధిని విడివిడిగా నిరాకరించే హెబ్రీయ పునరుక్తిని తెలుగులో సహజంగా, బలంగా నిలుపుతుంది.
- source_word: יוֹם אֶחָד
  choice: ఒక రోజు
  rationale: లెక్కింపు క్రమాన్ని నేరుగా నిలుపుతుంది.
- source_word: תֹּאכְלוּ/ן
  choice: తింటారు
  rationale: Qal imperfect రెండవ పురుష బహువచనానికి సందర్భానుసారమైన భవిష్యత్ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יוֹמָיִם
  choice: రెండు రోజులు
  rationale: ద్వివచన రూపాన్ని నేరుగా అనువదిస్తుంది.
- source_word: חֲמִשָּׁה יָמִים
  choice: ఐదు రోజులు
  rationale: పెరుగుతూ వచ్చే సంఖ్యాక్రమాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: עֲשָׂרָה יָמִים
  choice: పది రోజులు
  rationale: హెబ్రీయ వాక్యంలోని ఉద్ధృతమవుతున్న క్రమాన్ని నేరుగా కాపాడుతుంది.
- source_word: עֶשְׂרִים יוֹם
  choice: ఇరవై రోజులు
  rationale: హెబ్రీలో సంఖ్య తరువాత ఏకవచన రూపం ఉన్నప్పటికీ, తెలుగులో సహజ సంఖ్యా ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: וְ
  choice: — / వరుస నిర్మాణం
  rationale: ఈ నిరాకరణ శ్రేణిలో wawను పదేపదే ‘మరియు’ అని అనువదించడం తెలుగులో అసహజం; ‘కాదు’ పునరుక్తితో వరుస సంబంధం స్పష్టమవుతుంది.
