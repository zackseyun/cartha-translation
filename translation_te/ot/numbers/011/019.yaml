  register: ఆధునిక ప్రామాణిక తెలుగు; మూలంలోని పదేపదే వచ్చే నిరాకరణను నిలుపుతూ, వాక్యాంతంలోని ‘తింటారు’తో తదుపరి వచనానికి కొనసాగే అపూర్ణ భావాన్ని ఉద్దేశపూర్వకంగా కాపాడింది.
