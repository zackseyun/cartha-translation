  rationale: సవరింపు అర్థాన్ని మార్చదు. కర్తను స్పష్టం చేసి, చివరి సందిగ్ధ హీబ్రూ వాక్యాన్ని ప్రధాన అనువాదంలో సహజంగా వ్యక్తం చేసింది; ప్రత్యామ్నాయ అర్థం పాదసూచికలో యథావిధిగా నిలుపబడింది.
