source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: te
  text: అప్పుడు యాహ్వే మేఘంలో దిగి వచ్చి మోషేతో మాట్లాడాడు. ఆయన మోషే మీద ఉన్న ఆత్మలో కొంత తీసి, ఆ డెబ్బైమంది పెద్దల మీద ఉంచాడు. ఆ ఆత్మ వారి మీద నిలిచినప్పుడు వారు ప్రవచించారు; అయితే వారు ప్రవచించడం కొనసాగించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ప్రవచించడం ఆపలేదు.” ఇక్కడి హీబ్రూ వ్యక్తీకరణ చాలా సంక్షిప్తంగా ఉంది; దానిని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֵּרֶד
  choice: దిగి వచ్చి
  rationale: క్రిందికి కదలడాన్ని తెలిపే క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దైవ ప్రత్యక్షతకు సంబంధించిన మానవరూప వర్ణనను నిలిపాం.
- source_word: בֶּעָנָן
  choice: మేఘంలో
  rationale: నిర్దిష్ట ఉపపదం సందర్భంలో ఇప్పటికే తెలిసిన దైవసన్నిధి మేఘాన్ని సూచిస్తుంది.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: మోషేతో మాట్లాడాడు
  rationale: హీబ్రూలో ఉన్న ‘అతనితో’ అనే సర్వనామానికి సందర్భంలో స్పష్టమైన పూర్వపదం మోషే; తెలుగులో అయోమయం నివారించేందుకు పేరును వాడాం.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: మోషే మీద ఉన్న ఆత్మలో కొంత తీసి
  rationale: అరుదైన אצל క్రియ ఇక్కడ ఆత్మలోనుంచి కొంత తీసి పంచడాన్ని సూచిస్తుంది; ఆత్మ తగ్గిపోయిందని అనవసరంగా సూచించకుండా మూలభావాన్ని నిలిపాం.
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: ప్రవచన కార్యానికి శక్తినిచ్చి మోషే మీదనుంచి పెద్దల మీద నిలిచే దైవ ఆత్మను సందర్భం సూచిస్తుంది. తెలుగులో అక్షరాల పెద్ద/చిన్న రూపభేదం లేనందున ప్రత్యేక మూలాక్షరం అవసరం లేదు.
- source_word: וַיִּתֵּן עַל
  choice: మీద ఉంచాడు
  rationale: ‘మీద ఇచ్చాడు/ఉంచాడు’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: ఆ డెబ్బైమంది పెద్దలు
  rationale: ‘డెబ్బై మంది—ఆ పెద్దలు’ అనే అర్థాన్ని తెలుగులో సహజంగా, అనవసర పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: ఆ ఆత్మ వారి మీద నిలిచినప్పుడు
  rationale: נוח על లోని ‘మీద నిలుచుట/విశ్రమించుట’ రూపకాన్ని స్పష్టంగా నిలిపాం.
- source_word: וַיִּתְנַבְּאוּ
  choice: వారు ప్రవచించారు
  rationale: נבא క్రియ యొక్క ప్రామాణిక ప్రవచనార్థాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఇచ్చాం.
- source_word: וְלֹא יָסָפוּ
  choice: వారు దానిని కొనసాగించలేదు
  rationale: సందర్భంలో ఆ సందర్భానికే ప్రవచనం పరిమితమైందనే ప్రధాన పఠనాన్ని సహజంగా తెలియజేస్తుంది; వ్యతిరేకంగా అర్థం చేసుకున్న సంప్రదాయం పాదసూచికలో భద్రపరచబడింది.
theological_decisions:
- issue: רוּחַ దైవ ఆత్మను సూచిస్తుందా, సాధారణ ‘ఆత్మ’ను సూచిస్తుందా?
  choice: దైవ ఆత్మ
  alternative: సాధారణ ఆత్మ లేదా మానవ అంతఃప్రవృత్తి
  rationale: మోషే మీద ఉన్నది పెద్దల మీద ఉంచబడటం, దాని ఫలితంగా వారు ప్రవచించడం—ఇవి దేవుని శక్తినిచ్చే ఆత్మను సూచిస్తున్నాయి.
- issue: וְלֹא יָסָפוּ యొక్క సంక్షిప్తమైన, వివాదాస్పద భావం
  choice: వారి ప్రవచనం కొనసాగలేదు
  alternative: వారు ప్రవచించడం ఆపలేదు
  rationale: ‘కొనసాగించలేదు/మళ్లీ చేయలేదు’ అనేది సందర్భానికి అనుకూలమైన ప్రధాన భావం. అయితే ‘ఆపలేదు’ అనే ప్రాచీన, సంప్రదాయ పఠనం కూడా ఉన్నందున దానిని నిశ్శబ్దంగా తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. మూలంలోని వరుస క్రియలను చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం. దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం; చివరి క్రియలోని నిజమైన భాషాత్మక సందిగ్ధతను పాదసూచికతో నిలిపాం.
