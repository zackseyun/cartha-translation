revisions:
- from: అప్పుడు యాహ్వే మేఘంలో దిగి వచ్చి మోషేతో మాట్లాడాడు. మోషే మీద ఉన్న ఆత్మలో కొంత తీసి, ఆ డెబ్బైమంది పెద్దల మీద ఉంచాడు. ఆ ఆత్మ వారి మీద నిలిచినప్పుడు వారు ప్రవచించారు; అయితే వారు దానిని కొనసాగించలేదు.[a]
