translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలోని ‘కాలినడకన’ అనే అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, పురుషులు లేదా పదాతి సైనికులు అనే సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఇచ్చాం. ‘חֹדֶשׁ יָמִים’ నుడికారాన్ని సహజమైన ‘నెల రోజులపాటు’గా అనువదించి అక్షరార్థాన్ని పాదటిప్పణిలో నమోదు చేశాం.
