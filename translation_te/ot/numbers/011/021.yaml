id: NUM.11.21
reference: Numbers 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: te
  text: 'అయితే మోషే ఇలా అన్నాడు: “నేను వారి మధ్యలో ఉన్న ఈ ప్రజలు కాలినడకన ప్రయాణించేవారు ఆరు లక్షల మంది ఉన్నారు[a]. అయినా నీవు, ‘నేను వారికి మాంసం ఇస్తాను; వారు పూర్తి నెలపాటు తింటారు’ అని చెప్పావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాలినడకన వెళ్లే పురుషులు ఆరు లక్షల మంది.” హీబ్రూ మాటను కాలినడకన ప్రయాణించేవారిగానూ, పదాతి సైనికులుగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “రోజుల నెల”; అంటే పూర్తి నెల.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే మోషే ఇలా అన్నాడు
  rationale: వావ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి దైవవాక్యానికి మోషే అభ్యంతరంగా స్పందిస్తున్న సందర్భంలో ‘అయితే’ సహజమైన వ్యతిరేక భావాన్ని తెలియజేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: ఆరు లక్షల మంది
  rationale: హీబ్రూ సంఖ్యను తెలుగులో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: רַגְלִי הָעָם
  choice: ఈ ప్రజల్లో కాలినడకన నడిచేవారే
  rationale: רַגְלִי అనే పదంలోని ‘కాలి/పాదం’ భావాన్ని నిలుపుతూ, తప్పనిసరిగా సైనికులని నిర్ణయించకుండా ఆధునిక తెలుగులో అర్థమయ్యేలా అనువదించింది.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: నేను మధ్యలో ఉన్న ఈ ప్రజల్లో
  rationale: בקרב అనే ‘మధ్యలో/మధ్యన’ భావాన్నీ, אָנֹכִי ద్వారా మోషేపై ఉన్న ఉద్ఘాటననూ సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: అయినా నీవు ... అని చెప్పావు
  rationale: వ్యక్తంగా ఉన్న ‘నీవు’ అనే సర్వనామాన్ని నిలుపుతూ, ప్రజల విస్తార సంఖ్యకూ దేవుని మాటకూ మధ్య మోషే చూపుతున్న విస్మయభరిత వ్యత్యాసాన్ని ‘అయినా’ తెలియజేస్తుంది.
- source_word: בָּשָׂר
  choice: మాంసం
  rationale: ఈ సందర్భంలో ఆహారంగా తినే జంతుమాంసాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: אֶתֵּן לָהֶם
  choice: నేను వారికి ... ఇస్తాను
  rationale: మొదటి పురుష ఏకవచన భవిష్యత్ ఉద్దేశాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְאָכְלוּ
  choice: వారు ... తింటారు
  rationale: ఇవ్వడం వల్ల కలిగే ఫలితాన్ని తెలిపే సమన్విత భవిష్యత్ క్రియగా అనువదించింది; కేవలం ఉద్దేశార్థంగా మార్చలేదు.
- source_word: חֹדֶשׁ יָמִים
  choice: నెల రోజులపాటు
  rationale: అక్షరార్థంగా ‘రోజుల నెల’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ఒక పూర్తి నెల వ్యవధిగా తెలియజేస్తుంది.
