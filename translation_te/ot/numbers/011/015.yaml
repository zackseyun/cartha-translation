id: NUM.11.15
reference: Numbers 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: te
  text: నీవు నాతో ఇలాగే వ్యవహరిస్తే, దయచేసి నన్ను ఇప్పుడే చంపివేయి. నీ దృష్టిలో నాకు అనుగ్రహం దొరికితే, నా దుస్థితిని నేను చూడనివ్వకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా విపత్తును” లేదా “నా కష్టాన్ని.” హీబ్రూ పదం నైతిక చెడును మాత్రమే కాకుండా దురవస్థను లేదా విపత్తును కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: నీవు ... ఇలాగే
  rationale: షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ప్రారంభ וְ భావాన్ని తెలుగు వాక్య నిర్మాణంలో విడిగా పలకనవసరం లేదు.
- source_word: אַתְּ עֹשֶׂה לִּי
  choice: నాతో ... వ్యవహరిస్తే
  rationale: దేవుడు మోషేతో ఎలా ప్రవర్తిస్తున్నాడనే సంబంధాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది. హీబ్రూలో אַתְּ స్త్రీలింగ రూపంగా ఉండటం అసాధారణమైన పాఠరూపం; సందర్భంలో సంబోధితుడు దేవుడే.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: దయచేసి నన్ను ఇప్పుడే చంపివేయి
  rationale: నָא లోని వేడుకోలును ‘దయచేసి’ తెలియజేస్తుంది; ఆజ్ఞారూపంతో కూడిన infinitive absolute ఇచ్చే తీవ్ర ఉద్ఘాటనను ‘ఇప్పుడే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం దొరికితే
  rationale: హీబ్రూ నుడికారంలోని అనుకూల ఆదరణ భావాన్ని కాపాడుతూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְאַל אֶרְאֶה
  choice: నేను చూడనివ్వకు
  rationale: దేవునికి ఉద్దేశించిన ప్రతికూల వేడుకోలును స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּרָעָתִי
  choice: నా దుస్థితిని
  rationale: רָעָה ఇక్కడ నైతిక దుష్టత్వం కంటే కష్టం, విపత్తు, దురవస్థ అనే భావాన్ని సూచించగలదు. ‘దుస్థితి’ మోషే అనుభవిస్తున్న సంకటాన్ని స్పష్టంగా తెలియజేస్తూ పదంలోని విస్తృతిని పూర్తిగా మూసివేయదు.
theological_decisions:
- issue: בְּרָעָתִי అనే పదబంధం యొక్క భావం
  choice: మోషే వ్యక్తిగత దుస్థితి లేదా సంకటం
  alternative: నా విపత్తు; నా కష్టం; నా చెడు
  rationale: సందర్భం ప్రజల భారంతో మోషే నిరాశ చెందడమే గాని, తన నైతిక దుష్టత్వాన్ని ఒప్పుకోవడం కాదు. అయితే హీబ్రూ పదానికి విపత్తు లేదా కష్టం అనే ఇతర భావ ఛాయలు ఉన్నందున వాటిని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దేవునితో మోషే చేసే తీవ్ర వ్యక్తిగత వేడుకోలును గౌరవప్రదమైన ఏకవచన సంబోధనలో ఉంచింది. ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంతో వ్యక్తం చేసింది.
