id: NUM.11.12
reference: Numbers 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: te
  text: ఈ ప్రజాసమూహమంతటినీ నేను గర్భాన ధరించానా? దానికి[a] నేను జన్మనిచ్చానా? నీవు నాతో, “పాలుతాగే పసిబిడ్డను సంరక్షకుడు[b] మోసినట్టు, దాన్ని నీ ఒడిలో మోసుకొని, దాని పితరులకు నీవు ప్రమాణం చేసిన దేశానికి తీసుకెళ్లు” అని ఎందుకు చెప్పాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రజ’ సమూహ ఏకవచనంగా ఉండి, తరువాతి సూచనలు కూడా ‘దానికి/దాన్ని/దాని’ అనే ఏకవచనంలో ఉన్నాయి. సహజమైన తెలుగులో ‘వారికి/వారిని/వారి’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘పోషకుడు’; హీబ్రూ పదం శిశువును పోషించి చూసుకునే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: గర్భాన ధరించింది నేనా?
  rationale: ప్రశ్నార్థక అవ్యయంతో కూడిన స్వతంత్ర సర్వనామం ‘నేనేనా?’ అనే ఉద్ఘాటనను ఇస్తుంది; הרה గర్భం ధరించడాన్ని సూచిస్తుంది. ఈ రూపం మాతృత్వ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל הָעָם הַזֶּה
  choice: ఈ ప్రజనంతటినీ
  rationale: עָם ఏకవచన సమూహవాచకం. ‘ప్రజనంతటినీ’ దాని సమూహ ఏకత్వాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: దానికి జన్మనిచ్చింది నేనా?
  rationale: ילד ఇక్కడ ప్రసవ రూపకాన్ని కొనసాగిస్తుంది. ‘దానికి’ అనే ఏకవచన సూచన ప్రజను ఒకే శిశువుగా చూపే హీబ్రూ చిత్రణను నిలుపుతుంది.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: దాన్ని నీ ఒడిలో మోసుకొని
  rationale: נשא కు ‘మోయు’, חֵיק కు ‘ఒడి’ సహజమైన, చిత్రాత్మకమైన తెలుగు సమానార్థాలు.
- source_word: הָאֹמֵן
  choice: సంరక్షకుడు
  rationale: ఈ పదం శిశువును పోషించి చూసుకునే వ్యక్తిని సూచిస్తుంది; పుంలింగ రూపాన్ని నిలుపుతూ పాత్రను అతిగా నిర్దిష్టం చేయకుండా ‘సంరక్షకుడు’ అనువదిస్తుంది.
- source_word: הַיֹּנֵק
  choice: పాలుతాగే పసిబిడ్డ
  rationale: ఈ కృదంతం ఇంకా పాలు తాగే శిశువును సూచిస్తుంది; ఎంపిక చేసిన పదబంధం ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: עַל הָאֲדָמָה אֲשֶׁר נִשְׁבַּעְתָּ
  choice: నీవు ప్రమాణం చేసిన దేశానికి
  rationale: గమనదిశ సందర్భంలో עַל గమ్యాన్ని సూచిస్తుంది; שׁבע లోని ప్రమాణ భావాన్ని ‘ప్రమాణం చేసిన’ నేరుగా నిలుపుతుంది.
- source_word: לַאֲבֹתָיו
  choice: దాని పితరులకు
  rationale: హీబ్రూలోని ఏకవచన ప్రత్యయాన్ని ప్రజ అనే సమూహ ఏకవచనంతో అనుసంధానించి నిలుపుతుంది; ‘పితరులు’ వాగ్దాన సందర్భంలోని పూర్వీకులను సూచిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే సమూహ ఏకవచనం
  choice: ‘దానికి, దాన్ని, దాని పితరులకు’ అనే ఏకవచన సూచనలను ఉంచడం
  alternative: ‘వారికి, వారిని, వారి పితరులకు’ అనే బహువచన రూపాలు
  rationale: హీబ్రూ עָם ను ఏకవచన సమూహంగా తీసుకొని వరుసగా ఏకవచన ప్రత్యయాలను వాడుతుంది. వాటిని నిలపడం వల్ల ఇశ్రాయేలు ఒకే శిశువు అన్న మోషే రూపకం స్పష్టంగా ఉంటుంది; సహజమైన బహువచన పఠనాన్ని పాదసూచికలో ఇస్తున్నాం.
- issue: הָאֹמֵן పదంలోని సంరక్షణ పాత్ర
  choice: సంరక్షకుడు
  alternative: పోషకుడు; శిశు సంరక్షకుడు
  rationale: మూలపదం శిశువును చూసుకునే వ్యక్తిని సూచించినా, తల్లిపాలు ఇచ్చే స్త్రీనే అని నిర్బంధించదు. అందువల్ల లింగం లేదా నిర్దిష్ట విధిని అదనంగా చేర్చకుండా సంరక్షణ భావాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గర్భాన ధరించడం—జన్మనివ్వడం—ఒడిలో మోయడం’ అనే మూలంలోని మాతృత్వ, శిశుసంరక్షణ రూపక శ్రేణిని నిలిపాం. ‘ప్రజనంతటినీ’ కొద్దిగా సాహిత్య ధోరణి కలిగినప్పటికీ సమూహ ఏకవచనాన్ని స్పష్టంగా మోస్తుంది.
