revisions:
- from: ఈ ప్రజనంతటినీ గర్భాన ధరించింది నేనా? దానికి[a] జన్మనిచ్చింది నేనా? అయినా నీవు నాతో, “పాలుతాగే పసిబిడ్డను సంరక్షకుడు[b] మోసినట్టు, దాన్ని నీ ఒడిలో మోసుకొని, దాని పితరులకు నీవు ప్రమాణం చేసిన దేశానికి తీసుకెళ్లు” అంటున్నావు.
  to: ఈ ప్రజాసమూహమంతటినీ నేను గర్భాన ధరించానా? దానికి[a] నేను జన్మనిచ్చానా? నీవు నాతో, “పాలుతాగే పసిబిడ్డను సంరక్షకుడు[b] మోసినట్టు, దాన్ని నీ ఒడిలో మోసుకొని, దాని పితరులకు నీవు ప్రమాణం చేసిన దేశానికి తీసుకెళ్లు” అని ఎందుకు చెప్పాలి?
