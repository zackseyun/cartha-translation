id: NUM.11.29
reference: Numbers 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: te
  text: అప్పుడు మోషే అతనితో, “నా కోసం నీవు అసూయపడుతున్నావా? యాహ్వే ప్రజలందరూ ప్రవక్తలై ఉండాలని, యాహ్వే తన ఆత్మను వారిమీద ఉంచాలని ఎంత బాగుండును!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְקַנֵּא
  choice: అసూయపడుతున్నావా
  rationale: కנא అనే ధాతువు ఇక్కడ మోషే స్థానం పట్ల యెహోషువ చూపిన రక్షణాత్మక అసూయను సూచిస్తుంది. సందర్భంలో ప్రతికూల ఛాయ ఉన్నందున ‘ఆసక్తి చూపుతున్నావా’ కంటే ‘అసూయపడుతున్నావా’ స్పష్టంగా ఉంది.
- source_word: לִי
  choice: నా కోసం
  rationale: మోషే ప్రయోజనం లేదా గౌరవం తరఫున చూపుతున్న ఆందోళనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמִי יִתֵּן
  choice: ఎంత బాగుంటుంది
  rationale: ఈ హెబ్రీయ ఇడియమ్ అక్షరార్థ ప్రశ్న కాకుండా బలమైన కోరికను వ్యక్తం చేస్తుంది. తెలుగులో ‘ఎంత బాగుంటుంది’ ఆ అభిలాషార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּל עַם יְהוָה
  choice: యెహోవా ప్రజలందరూ
  rationale: యెహోవాకు చెందిన ప్రజల సమస్తత్వాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: נְבִיאִים
  choice: ప్రవక్తలు
  rationale: మూలంలోని నామవాచక రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: యెహోవా తన ఆత్మను వారిమీద ఉంచి
  rationale: కోరిక నెరవేరే విధానాన్ని సూచిస్తూ, ఆత్మ ‘వారిమీద’ ఉండే హెబ్రీయ చిత్రణను కాపాడుతుంది. ఇక్కడ כִּי యొక్క సంబంధాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: רוּחוֹ
  choice: తన ఆత్మను
  rationale: ప్రవచన శక్తినిచ్చే దేవుని ఆత్మను సందర్భం సూచిస్తోంది. ‘తన’ అనే ఆత్మవాచకం యెహోవానే సూచనీయుడని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ప్రవచన శక్తి సందర్భంలో רוּחוֹ అనువాదం
  choice: తన ఆత్మను
  alternative: తన ప్రాణశక్తిని / తన ఊపిరిని
  rationale: తక్షణ సందర్భం దేవుడు కలిగించే ప్రవచన క్రియను గూర్చినది కాబట్టి ‘ఆత్మ’ సరైన సందర్భార్థం. ఇది దైవిక సన్నిధి మరియు శక్తి భావాన్ని నిలుపుతూ, ఆత్మ స్వరూపం గురించి వచనం చెప్పనిదాన్ని జోడించదు.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ సుపరిచితమైన రూపం.
- issue: మోషే కోరికలో కారణం–ఫలితం సంబంధం
  choice: యెహోవా తన ఆత్మను వారిమీద ఉంచి, ... ప్రవక్తలైతే
  alternative: యెహోవా తన ఆత్మను వారిమీద ఉంచుతాడు గనుక / ఉంచినప్పుడు
  rationale: כִּי కి ఇక్కడ కారణార్థం, కాలార్థం ఇవ్వకుండా, ముందు వచ్చిన అభిలాషలో భాగంగా ప్రవచనం కలిగే దైవిక చర్యను చూపిస్తుంది. తద్వారా మూలంలోని వాక్య సంబంధానికి ఉన్న స్వల్ప అనిశ్చితిని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘వారిమీద ఉంచి’ అనే రూపం హెబ్రీయ స్థలచిత్రణను నిలుపుతుంది; ‘ఎంత బాగుంటుంది’ బలమైన కోరికను సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
