  text: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה נָסְע֥וּ הָ/עָ֖ם חֲצֵר֑וֹת וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: te
  text: కిబ్రోత్-హత్తావా[a] నుండి ప్రజలు హజేరోతుకు బయలుదేరి వెళ్లారు; వారు హజేరోతులో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కిబ్రోత్-హత్తావా” అంటే “తీవ్రమైన కోరిక యొక్క సమాధులు” లేదా “దురాశ యొక్క సమాధులు.”
    reason: స్థలనామంలో నిక్షిప్తమైన హెబ్రీ అర్థాన్ని పాఠకునికి తెలియజేయడం; תַּאֲוָה పదానికి సందర్భానుసారం ‘తీవ్రమైన కోరిక’ లేదా ‘దురాశ’ అనే భావాలు ఉండవచ్చు.
lexical_decisions:
- source_word: מִקִּבְרוֹת הַתַּאֲוָה
  choice: కిబ్రోత్-హత్తావా నుండి
  rationale: ఇది ‘సమాధులు’ మరియు ‘తీవ్రమైన కోరిక’ అనే సాధారణ నామవాచకాలతో ఏర్పడిన స్థలనామం. కథనంలో ప్రత్యేక స్థలనామంగా పనిచేస్తున్నందున లిప్యంతరీకరించబడింది; దాని అర్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: נָסְעוּ
  choice: బయలుదేరి వెళ్లారు
  rationale: ప్రయాణ కథనంలో ఈ క్రియ శిబిరాన్ని ఎత్తి తదుపరి ప్రాంతానికి బయలుదేరడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బయలుదేరి వెళ్లారు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ సహజమైన ప్రామాణిక తెలుగు ప్రయోగం.
- source_word: חֲצֵרוֹת
  choice: హజేరోతు
  rationale: ఇది ప్రత్యేక స్థలనామం కాబట్టి హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וַיִּהְיוּ בַּחֲצֵרוֹת
  choice: వారు హజేరోతులోనే ఉండిపోయారు
  rationale: అక్షరార్థంగా ‘వారు హజేరోతులో ఉన్నారు.’ ప్రయాణ పట్టిక సందర్భంలో היה + ב ఒక ప్రదేశంలో ఆగి ఉండడాన్ని సూచిస్తుంది. ‘ఉండిపోయారు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘లోనే’ వారు చేరిన చోటే బస చేసిన అనుసంధానాన్ని స్పష్టం చేస్తుంది.
