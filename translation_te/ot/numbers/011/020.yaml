  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: te
  text: ఒక నెల రోజులపాటు మీరు తింటారు—అది మీ ముక్కు రంధ్రాల నుంచి బయటికి వచ్చి, మీకు అసహ్యంగా మారేంతవరకు[a]. ఎందుకంటే మీ మధ్య ఉన్న యాహ్వేను మీరు తిరస్కరించి, ఆయన ఎదుట ఏడ్చి, ‘మేమెందుకు ఐగుప్తు నుంచి బయటికి వచ్చాం?’ అని అన్నారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మీకు ఏవగింపుగా మారేంతవరకు.” హీబ్రూ పదం తీవ్రమైన వికర్షణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: ఒక నెల రోజులపాటు
  rationale: ‘ఒక నెల నిండా’ అనే వ్యవధిని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: అది మీ ముక్కు రంధ్రాల నుంచి బయటికి వచ్చి
  rationale: ఆహారం విపరీతంగా తినడం వల్ల ముక్కు రంధ్రాల నుంచి వచ్చేంత అవుతుందనే మూలంలోని తీవ్రమైన శరీర చిత్రణను నిలుపుతుంది.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: మీకు అసహ్యంగా మారేంతవరకు
  rationale: זָרָא తెలిపే బలమైన ఏవగింపు లేదా వికర్షణ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: יַעַן כִּי
  choice: ఎందుకంటే
  rationale: తీర్పుకు కారణాన్ని పరిచయం చేసే పదబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְאַסְתֶּם
  choice: మీరు తిరస్కరించి
  rationale: ఈ క్రియలోని నిరాకరణ భావాన్ని నిలుపుతుంది; ‘ద్వేషించారు’ అని భావోద్వేగాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: మీ మధ్య ఉన్న
  rationale: సమాజం మధ్య యాహ్వే సన్నిధిని సూచిస్తుంది; వ్యక్తుల అంతరంగంలో ఉన్నాడనే వేరే భావాన్ని కలిగించదు.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: ఆయన ఎదుట ఏడుస్తూ
  rationale: בכה లోని ఏడుపు భావాన్నీ, దేవుని సన్నిధిలో చేసిన ఫిర్యాదు అనే సంబంధ సందర్భాన్నీ కాపాడుతుంది.
- source_word: לָמָּה זֶּה
  choice: మేమెందుకు
  rationale: ఫిర్యాదుతో కూడిన ప్రశ్నను సహజ తెలుగులో అందిస్తుంది; మూలంలో స్పష్టంగా లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: ఐగుప్తు నుంచి బయటికి వచ్చాం
  rationale: יצא యొక్క ‘బయటికి రావడం’ అనే నిర్గమన పదచిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: పాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగులో దాని సాధారణ శాస్త్రీయ లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: మాంసం తినడాన్ని సూచించే క్రియను ఈ వచనంలో స్పష్టీకరించడం
  choice: మీరు తింటారు
  alternative: మునుపటి వచనం నుంచి క్రియను ఊహింపజేసి విడిచిపెట్టడం
  rationale: హీబ్రూలో ఈ భాగం 11:19లోని ‘తింటారు’ అనే క్రియకు కొనసాగింపు. స్వతంత్ర వచనంగా చదివినప్పుడు అర్థం సంపూర్ణంగా ఉండేందుకు దానిని స్పష్టంగా చేర్చాం; కొత్త ధార్మిక భావాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని తీవ్ర, ఉద్దేశపూర్వకంగా అసహ్యకరమైన చిత్రణను మృదువుచేయలేదు. వచనం మధ్య వాక్యంతో మొదలవుతున్నందున, పూర్వ వచనం నుంచి కొనసాగుతున్న ‘మీరు తింటారు’ అనే భావాన్ని స్పష్టత కోసం చేర్చాం.
