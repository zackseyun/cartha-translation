source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “యాహ్వే చేయి కురచైపోయిందా?[a] నా మాట నీ విషయంలో నెరవేరుతుందో లేదో ఇప్పుడు నువ్వు చూస్తావు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వే చేయి కురచైపోయిందా?” అనేది “యాహ్వే శక్తి పరిమితమైందా?” అనే అర్థాన్నిచ్చే హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: b
    text: లేదా, “నేను చెప్పినది నీకు జరుగుతుందో లేదో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: యెహోవా చెయ్యి కురచైపోయిందా?
  rationale: దేవుని శక్తి పరిమితమైందా అనే భావాన్ని తెలిపే హీబ్రూ శరీరరూపకాన్ని దాని ప్రశ్నార్థక బలంతో సహా నిలిపాం.
- source_word: עַתָּה תִרְאֶה
  choice: ఇప్పుడు నువ్వే చూస్తావు
  rationale: త్వరలోనే ప్రత్యక్షంగా నిర్ధారణ అవుతుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం; ‘నువ్వే’ ప్రశ్నలోని సవాలు, ప్రత్యక్ష నిర్ధారణను స్పష్టం చేస్తుంది.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: నా మాట నీ విషయంలో నెరవేరుతుందో
  rationale: קרה అనే క్రియకు ‘జరగడం/సంభవించడం’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ ముందుగా పలికిన దైవవాక్యం కార్యరూపం దాల్చడాన్ని సూచిస్తుంది. రెండవ పురుష ప్రత్యయాన్ని ‘నీ విషయంలో’గా నిలిపాం.
- source_word: אִם לֹא
  choice: లేదో
  rationale: పరోక్ష ద్వికల్ప ప్రశ్నను సహజ తెలుగులో ‘-తుందో లేదో’ నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవశక్తికి సంబంధించిన మానవరూపక భాష
  choice: ‘యెహోవా చెయ్యి కురచైపోయిందా?’ అనే రూపకాన్ని నిలిపివేయడం
  alternative: ‘యెహోవా శక్తి పరిమితమైందా?’
  rationale: మూలంలోని ‘చెయ్యి’ రూపకం దేవుని సామర్థ్యాన్ని సజీవంగా వ్యక్తం చేస్తుంది. దాన్ని వివరణాత్మక భావంగా మార్చకుండా పాఠ్యంలో ఉంచి, అర్థాన్ని పాదసూచికలో తెలిపాం.
- issue: דְבָרִי మరియు הֲיִקְרְךָ మధ్య భావసంబంధం
  choice: ‘నా మాట నీ విషయంలో నెరవేరుతుందో’
  alternative: ‘నేను చెప్పినది నీకు జరుగుతుందో’
  rationale: ‘నా మాట’ అనే ఏకవచనాన్ని కాపాడుతూ, అది మోషేకు సంబంధించిన సందర్భంలో కార్యరూపం దాల్చడాన్ని తెలుపుతుంది. ప్రత్యామ్నాయం కూడా భాషాపరంగా సాధ్యమే కాబట్టి పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. దేవుడు మోషేతో నేరుగా మాట్లాడుతున్నందున సహజమైన ఏకవచన సంబోధన ‘నువ్వు’ను ఉపయోగించాం. మూలంలోని రూపకం, ప్రశ్నార్థక సవాలు, మరియు ‘నీ విషయంలో/నీకు’ అనే భావసూక్ష్మతను కాపాడాం.
