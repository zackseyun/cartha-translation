review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Moses’ complaint, the deferential “your servant,” favor “in your eyes,” and the burden metaphor. However, it turns the Hebrew infinitival clause “to place the burden of all this people on me” into a third independent “why” question. The revision retains its dependence on the preceding question. The divine name is revised to యాహ్వే to align with the stated source/audit decision to transliterate Yahweh rather than use Jehovah.
  naturalness: The revised wording is modern, clear Telugu while retaining the solemn complaint register. “నాపై మోపడానికి” naturally expresses the purpose/result force of the Hebrew infinitive with the burden metaphor.
  terminology: “కీడు కలిగించావు,” “సేవకుడు,” “అనుగ్రహం,” and “భారం” are suitable and source-faithful. “యాహ్వే” follows the supplied English POB naming policy.
  issues:
  - severity: medium
    issue: The final clause is rendered as a third “why” question.
    rationale: 'Hebrew has two interrogatives (לָמָה ... וְלָמָה) followed by לָשׂוּם, an infinitive dependent on the second complaint: “that/to place the burden.” Adding “ఎందుకు” to the final clause changes the sentence structure and slightly shifts the relation of the clauses.'
  - severity: low
    issue: The divine name is rendered “యెహోవా.”
    rationale: The supplied source/audit trail explicitly selects “Yahweh” as the transliteration of יהוה. “యాహ్వే” should therefore be used for consistency with that decision.
  revised_text: 'మోషే యాహ్వేతో ఇలా అన్నాడు: “నీ సేవకుడైన నాకు ఎందుకు కీడు కలిగించావు?[a] ఈ ప్రజలందరి భారాన్ని నాపై మోపడానికి నీ దృష్టిలో నాకు ఎందుకు అనుగ్రహం దొరకలేదు?[b]”'
