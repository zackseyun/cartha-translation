- from: 'మోషే యెహోవాతో ఇలా అన్నాడు: “నీ సేవకుడైన నాకు ఎందుకు కీడు కలిగించావు?[a] నీ దృష్టిలో నాకు ఎందుకు అనుగ్రహం దొరకలేదు?[b] ఈ ప్రజలందరి భారాన్ని నాపై ఎందుకు మోపావు?”'
  to: 'మోషే యాహ్వేతో ఇలా అన్నాడు: “నీ సేవకుడైన నాకు ఎందుకు కీడు కలిగించావు?[a] ఈ ప్రజలందరి భారాన్ని నాపై మోపడానికి నీ దృష్టిలో నాకు ఎందుకు అనుగ్రహం దొరకలేదు?[b]”'
