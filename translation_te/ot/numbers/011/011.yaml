id: NUM.11.11
reference: Numbers 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: te
  text: 'మోషే యాహ్వేతో ఇలా అన్నాడు: “నీ సేవకుడైన నాకు ఎందుకు కీడు కలిగించావు?[a] ఈ ప్రజలందరి భారాన్ని నాపై మోపడానికి నీ దృష్టిలో నాకు ఎందుకు అనుగ్రహం దొరకలేదు?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సేవకుడితో ఎందుకు చెడుగా ప్రవర్తించావు?” హీబ్రూ క్రియకు అక్షరార్థంగా “కీడు కలిగించు” లేదా “చెడు చేయు” అనే భావం ఉంది; ఇది మోషే వేదనతో చేసిన ఫిర్యాదును వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారంలో అక్షరార్థంగా, “నీ కళ్లలో నాకు అనుగ్రహం దొరకలేదు.” అంటే, “నీ అనుగ్రహాన్ని నేను పొందలేదు.”
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הֲרֵעֹתָ
  choice: కీడు కలిగించావు
  rationale: హిఫిల్ రూపంలోని ‘చెడు/కీడు కలిగించు’ అనే బలమైన ఫిర్యాదు భావాన్ని నిలుపుతుంది; ఇది మోషే పలికిన వేదనాభరిత ప్రశ్నగా అర్థమవుతుంది.
- source_word: לְעַבְדֶּךָ
  choice: నీ సేవకుడైన నాకు
  rationale: దేవుని ఎదుట మోషే తనను తాను వినయంగా పేర్కొనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం దొరకలేదు
  rationale: ‘నీ కళ్లలో కృప కనుగొనడం’ అనే హీబ్రూ నుడికారంలోని దృష్టి రూపకాన్ని, తెలుగులో అర్థమయ్యే ‘నీ దృష్టిలో’ అనే రూపంతో నిలుపుతుంది.
- source_word: מַשָּׂא
  choice: భారం
  rationale: బాధ్యతతోపాటు దాని బరువు, ఒత్తిడి అనే రూపకార్థాన్ని కూడా ‘భారం’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הָעָם הַזֶּה
  choice: ఈ ప్రజలందరి
  rationale: హీబ్రూలోని ఏకవచన సమూహనామాన్ని తెలుగులో సహజమైన సమూహార్థంతో అందిస్తుంది.
- source_word: לָשׂוּם ... עָלָי
  choice: నాపై ... మోపావు
  rationale: భారాన్ని ఒకరిపై ఉంచడం అనే మూల రూపకాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుడు కీడు చేశాడనే భావన కలిగించగల הֲרֵעֹתָ ప్రయోగం
  choice: కీడు కలిగించావు
  alternative: నాతో చెడుగా ప్రవర్తించావు
  rationale: మూలపదంలోని కఠినమైన, వేదనతో కూడిన ఫిర్యాదును మృదువుచేయకుండా నిలిపాం. ఇది దేవుని స్వభావంపై వ్యాఖ్యాత్మక తీర్పుగా కాక, మోషే దేవునితో పలికిన ప్రశ్నగా పాఠ్యంలో స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. మోషే ఫిర్యాదులోని తీవ్రతను నిలిపి, హీబ్రూ ప్రశ్నల పునరావృతాన్ని తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ఉంచాం.
