  text: וַ/יָּ֣קָם הָ/עָ֡ם כָּל הַ/יּוֹם֩ הַ/ה֨וּא וְ/כָל הַ/לַּ֜יְלָה וְ/כֹ֣ל י֣וֹם הַֽ/מָּחֳרָ֗ת וַ/יַּֽאַסְפוּ֙ אֶת הַ/שְּׂלָ֔ו הַ/מַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַ/יִּשְׁטְח֤וּ לָ/הֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽ/מַּחֲנֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: te
  text: ప్రజలు లేచి, ఆ రోజంతా, ఆ రాత్రంతా, మరుసటి రోజంతా పూరేడు పిట్టలను సేకరించారు. అతి తక్కువగా సేకరించినవాడు కూడా పది హోమెర్లు[a][b] సేకరించాడు. వారు వాటిని తమ కోసం శిబిరం చుట్టూ పరచిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హోమెరు పెద్ద పొడి కొలత. దానికి సరిగ్గా సమానమైన ఆధునిక కొలత ఏదో నిశ్చయంగా తెలియదు; అతి తక్కువగా సేకరించినవాడు కూడా ఎంతో పెద్ద మొత్తాన్ని సేకరించాడన్నదే ఇక్కడి భావం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘పది గాడిద మోసే బరువులు.’ హీబ్రూ חֳמָרִים అనే పదాన్ని ప్రామాణిక పొడి కొలతగా కాకుండా, దాని పదవ్యుత్పత్తి సంబంధాన్ని బట్టి ఇలా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: ప్రజలు లేచి
  rationale: קום అనే క్రియలోని కార్యానికి పూనుకునే భావాన్ని సహజమైన తెలుగు కథనశైలిలో ‘లేచి’ అని నిలిపింది.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: ఆ రోజంతా, ఆ రాత్రంతా, మరుసటి రోజంతా
  rationale: మూడు కాలవ్యవధుల పునరుక్తిని, నిరంతరంగా సాగిన సేకరణను తెలుగులో సహజమైన సమాంతర నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: וַיַּאַסְפוּ אֶת־הַשְּׂלָו
  choice: పూరేడు పిట్టలను పోగుచేశారు
  rationale: אָסף కు ‘పోగుచేశారు’ సహజమైన సమానార్థకం; שְׂלָו ను తెలుగులో గుర్తించదగిన పక్షిపేరైన ‘పూరేడు పిట్ట’గా ఇచ్చింది.
- source_word: הַמַּמְעִיט
  choice: అతి తక్కువగా పోగుచేసినవాడు కూడా
  rationale: సందర్భం సూచించే సేకరణ క్రియను స్పష్టంగా చెప్పి, కనిష్ఠ పరిమాణమే అపారమని తెలుపడానికి తెలుగులో సహజమైన ‘కూడా’ను ఉపయోగించింది.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: పది హోమెర్లు
  rationale: חֹמֶר సాధారణంగా పెద్ద పొడి కొలతను సూచిస్తుంది. ఖచ్చితమైన ఆధునిక పరిమాణాన్ని ఊహించకుండా కొలతపేరును లిప్యంతరీకరించింది.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: వారు వాటిని తమ కోసం ... పరచిపెట్టారు
  rationale: לָהֶם లోని ‘తమ కోసం’ భావాన్ని నిలిపి, cognate construction లోని విస్తరించి పరచే చర్యను సహజమైన ‘పరచిపెట్టారు’తో తెలిపింది.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: శిబిరం చుట్టూ
  rationale: శిబిరాన్ని చుట్టుముట్టిన ప్రదేశమంతటా అనే స్థానార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
