id: NUM.11.17
reference: Numbers 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: te
  text: నేను దిగివచ్చి అక్కడ నీతో మాట్లాడతాను. నీ మీద ఉన్న ఆత్మలోనుంచి[a] కొంత తీసి వారి మీద ఉంచుతాను. వారు నీతో కలిసి ప్రజల భారాన్ని మోస్తారు; అప్పుడు నీవు దాన్ని ఒంటరిగా మోయవలసి ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆత్మ” అని అనువదించిన హీబ్రూ పదం רוּחַ (రూవహ్)కు “గాలి,” “ఊపిరి,” “ఆత్మ” అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అది మోషేకు నాయకత్వ బాధ్యత కోసం అనుగ్రహించబడిన దైవిక సామర్థ్యాన్నిచ్చే ఆత్మను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: నేను దిగివచ్చి
  rationale: יָרַד అంటే ‘దిగు’. దేవుడు మాట్లాడుతున్న ఈ సందర్భంలో ‘దిగివచ్చి’ అనేది హీబ్రూలోని దైవ ప్రత్యక్షతకు సంబంధించిన స్థలరూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: అక్కడ నీతో మాట్లాడతాను
  rationale: עִם తో వచ్చిన דִבֵּר పరస్పర సంభాషణ భావంతో ‘తో మాట్లాడు’ అని అర్థమిస్తుంది; שָׁם లోని స్థల నిర్దిష్టతను ‘అక్కడ’గా నిలిపాం.
- source_word: וְאָצַלְתִּי
  choice: కొంత తీసి
  rationale: అరుదైన אצל ఇక్కడ మోషే మీద ఉన్న ఆత్మనుంచి తీసి పెద్దల మీద ఉంచడాన్ని సూచిస్తుంది. ‘కొంత తీసి’ అనేది బదిలీ భావాన్ని తెలియజేస్తూనే, మోషేకు తగ్గిపోయిందని మూలపాఠం చెప్పనిదాన్ని చేర్చదు.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: నీ మీద ఉన్న ఆత్మలోనుంచి
  rationale: מִן యొక్క ‘నుంచి/లోనుంచి’ భావాన్ని, עַל యొక్క ‘మీద’ రూపకాన్ని నిలిపాం. רוּחַ ఇక్కడ నాయకత్వానికి దైవిక సామర్థ్యాన్ని అనుగ్రహించే ఆత్మను సూచిస్తుంది; తెలుగులో పెద్ద అక్షర భేదం లేకపోవడంతో సందర్భం మరియు పాదటిప్పణి భావాన్ని స్పష్టం చేస్తాయి.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: వారి మీద ఉంచుతాను
  rationale: שׂים యొక్క సాధారణ ‘ఉంచు’ అర్థాన్నీ, ఆత్మ వ్యక్తుల ‘మీద’ ఉండే మూలపాఠ రూపకాన్నీ యథాతథంగా నిలిపాం.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: వారు నీతో కలిసి ప్రజల భారాన్ని మోస్తారు
  rationale: נשא మరియు מַשָּׂא మధ్యనున్న ‘మోయడం—భారం’ పదబంధ సంబంధాన్ని తెలుగులో నిలిపాం. אִתְּךָ ను సహజంగా ‘నీతో కలిసి’ అని అనువదించాం.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: అప్పుడు నీవు దాన్ని ఒంటరిగా మోయవలసి ఉండదు
  rationale: ముందున్న ఏర్పాటుకు ఫలితాన్ని ‘అప్పుడు’ స్పష్టం చేస్తుంది. ‘దాన్ని’ అనేది ప్రజల భారాన్ని తిరిగి సూచిస్తుంది; לְבַדֶּךָ లోని ఒంటరిగా మోయడంపై ఉన్న నొక్కును నిలిపాం.
theological_decisions:
- issue: רוּחַ ను దైవిక ‘ఆత్మ’గా అర్థం చేసుకోవాలా, సాధారణ ‘ఆత్మ/శక్తి’గా అర్థం చేసుకోవాలా
  choice: ఆత్మ
  alternative: ఆత్మశక్తి; లేదా మోషేలోని మనోభావం
  rationale: సంఖ్యాకాండము 11:25లో ఇదే ఆత్మ పెద్దల మీద నిలవడం, వారు ప్రవచించడం దీన్ని కేవలం మోషే వ్యక్తిగత స్వభావంగా కాక దైవికంగా అనుగ్రహించబడిన సామర్థ్యంగా సూచిస్తుంది. అయితే మూలపదం విస్తృతార్థకమైనదనే విషయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: ఆత్మలోనుంచి తీసుకోవడం మోషేకు ఆత్మ తగ్గిపోవడాన్ని సూచిస్తుందా
  choice: తగ్గుదల ఉందో లేదో నిర్ణయించకుండా బదిలీ భాషను నిలిపివేయడం
  alternative: మోషేకు ఏ మాత్రం తగ్గకుండా ఆత్మను పంచడం
  rationale: మూలపాఠం మోషే మీద ఉన్న ఆత్మనుంచి తీసి ఇతరుల మీద ఉంచుతానని మాత్రమే చెబుతుంది. తగ్గుదల లేదని స్పష్టీకరించడం వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘దిగివచ్చి,’ ‘మీద ఉంచుతాను,’ ‘భారాన్ని మోస్తారు’ వంటి మూలపాఠ రూపకాలను కాపాడుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
