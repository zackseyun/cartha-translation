source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: te
  text: ప్రజలు యెహోవా చెవిన పడేలా తమ కష్టాల గురించి సణుగుతున్నవారిలా ఉన్నారు[a]. యెహోవా అది విన్నాడు, ఆయన కోపం రగులుకుంది; యెహోవా అగ్ని[b] వారి మధ్య రగిలి, శిబిరం అంచున ఉన్నవారిలో కొందరిని దహించివేసింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సణుగుతున్నవారిలా’ అనే హీబ్రూ రూపం అరుదైనది, కొంత క్లిష్టమైనది. ‘సణుగువారిగా,’ ‘సణుగుతున్నవారుగా,’ లేదా ‘సణుగుతున్నట్లుగా’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘యెహోవా చెవుల్లో/వినికిడిలో.’ వారి సణుగుడు యెహోవా దృష్టికి లేదా వినికిడికి వచ్చిందనే భావం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘యెహోవా నుండి వచ్చిన అగ్ని.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הָעָם
  choice: ప్రజలు ... ఉన్నారు
  rationale: హీబ్రూ కథన ప్రారంభాన్ని సహజమైన తెలుగు వాక్యంగా ఇస్తుంది; మూలంలో లేని స్పష్టమైన కాలసూచక పదాన్ని చేర్చదు.
- source_word: כְּמִתְאֹנְנִים רַע
  choice: తమ కష్టాల గురించి సణుగుతున్నవారిలా
  rationale: అరుదైన రూపంలోని పోలిక భావాన్ని ‘వారిలా’తో, రַע యొక్క సందర్భోచితమైన కష్టం/దురవస్థ భావాన్ని ‘కష్టాల గురించి’తో నిలుపుతుంది. ‘సణుగుట’ అసంతృప్తితో ఫిర్యాదు చేసే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאָזְנֵי יְהוָה
  choice: యెహోవా వినేటట్లు
  rationale: అక్షరార్థంగా ‘యెహోవా చెవుల్లో’ అనే శ్రవణ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, వారి సణుగుడు ఆయన దృష్టికి వచ్చిందనే భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: యెహోవా అది విన్నప్పుడు
  rationale: సందర్భంలో అంతర్లీనంగా ఉన్న సణుగుడును ‘అది’తో స్పష్టం చేసి, తరువాతి ప్రతిస్పందనతో సహజ తెలుగు అనుసంధానం కల్పిస్తుంది.
- source_word: וַיִּחַר אַפּוֹ
  choice: ఆయన కోపం రగులుకుంది
  rationale: హీబ్రూ వేడి/మండుట రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది; అక్షరార్థమైన ‘ముక్కు మండింది’ అనే అసహజ ప్రయోగాన్ని నివారిస్తుంది.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: యెహోవా అగ్ని వారి మధ్య రగిలి
  rationale: ‘యెహోవా అగ్ని’ అనే సంబంధాన్ని పారదర్శకంగా ఉంచి, בָּם ను ‘వారి మధ్య’గా అనువదిస్తుంది; ‘యెహోవా నుండి వచ్చిన అగ్ని’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: శిబిరం అంచున ఉన్నవారిలో కొందరిని దహించివేసింది
  rationale: అగ్ని కర్తగా ఉన్నందున ‘దహించివేసింది’ సహజం. హీబ్రూలో ప్రత్యక్ష కర్మ స్పష్టంగా లేకపోయినా, తెలుగు వాక్యపూర్ణత కోసం వ్యక్తులను సూచించే ‘ఉన్నవారిలో కొందరిని’ సందర్భానుసారంగా సరఫరా చేసింది; ఈ అంశాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: దైవిక తీర్పు అగ్నితో నేరుగా అనుసంధానించబడటం
  choice: యెహోవా అగ్ని
  alternative: యెహోవా నుండి వచ్చిన అగ్ని
  rationale: మూలంలోని אֵשׁ יְהוָה సంబంధాన్ని వ్యాఖ్యానించి సడలించకుండా నేరుగా నిలుపుతుంది; మూలస్థాన భావంతో చదివే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: శిబిరం అంచున దహించబడినది ఏమిటన్న అస్పష్టత
  choice: ఉన్నవారిలో కొందరిని
  alternative: శిబిరం అంచును
  rationale: హీబ్రూ వాక్యంలో ప్రత్యక్ష కర్మ పేర్కొనబడలేదు. ప్రధాన పాఠంలో సందర్భానుకూలమైన వ్యక్తుల భావాన్ని పఠనసౌలభ్యం కోసం స్వీకరించి, స్థలభాగమే కాలిందనే సాధ్య పఠనాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరమైన కథన శైలి. ‘సణుగుట,’ ‘కోపం రగులుకొనుట,’ ‘దహించివేయుట’ వంటి సహజమైన పదాలతో మూలంలోని పోలిక, శ్రవణ భావచిత్రం, అగ్ని రూపకం నిలుపబడ్డాయి.
