source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: te
  text: కానీ ఇప్పుడు మా ఆకలి ఎండిపోయింది[a]; మా కళ్లముందు మన్నా తప్ప మరేమీ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మా ప్రాణం ఎండిపోయింది’; హెబ్రీ נֶפֶשׁ (నెఫెష్) అనే పదానికి ‘ప్రాణం,’ ‘ఆత్మ,’ లేదా ఆహార సందర్భాల్లో ‘ఆకలి’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: ముందటి పరిస్థితితో వ్యత్యాసాన్ని చూపే సంధర్భంలో సంయోజకం, కాలవాచకం కలిసి ఉన్నందున సహజమైన తెలుగులో ‘కానీ ఇప్పుడు’ అని అనువదించాం.
- source_word: נַפְשֵׁנוּ
  choice: మా ఆకలి
  rationale: נֶפֶשׁ అనే పదానికి ‘ప్రాణం/ఆత్మ’ అనే అర్థాలు ఉన్నప్పటికీ, ఆహారం మరియు కోరికకు సంబంధించిన ఈ సందర్భంలో అది ఆకలిని లేదా ఆహారాభిలాషను సూచిస్తుంది.
- source_word: יְבֵשָׁה
  choice: ఎండిపోయింది
  rationale: ఈ విశేషణం ఎండిపోయిన, వాడిపోయిన స్థితిని సూచిస్తుంది; వారి తీరని ఆహారాభిలాషను తెలుగులో సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: אֵין כֹּל
  choice: మరేమీ లేదు
  rationale: నిరాకరణలోని సంపూర్ణ భావాన్ని ‘మరేమీ లేదు’ సహజంగా, బలంగా తెలియజేస్తుంది.
- source_word: בִּלְתִּי אֶל
  choice: తప్ప
  rationale: ఒకదానిని మినహాయించి ఇంకేదీ లేదనే భావాన్ని ‘తప్ప’ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַמָּן
  choice: ఈ మన్నా
  rationale: నిర్దిష్టమైన, వారికి సుపరిచితమైన మన్నాను హెబ్రీ నిర్దేశక ఉపసర్గ సూచిస్తుంది; ఫిర్యాదు ధ్వనిని తెలుగులో ‘ఈ’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עֵינֵינוּ
  choice: మా కళ్లముందు
  rationale: వారికి నిరంతరం కనిపిస్తున్నది అదే అనే స్పష్టమైన దృశ్యరూపాన్ని ఈ తెలుగు ప్రయోగం నిలుపుతుంది.
theological_decisions:
- issue: נֶפֶשׁ యొక్క సందర్భార్థం
  choice: ఆకలి
  alternative: ప్రాణం / ఆత్మ
  rationale: ఆహారాన్ని గురించి చేస్తున్న ఫిర్యాదులో సందర్భార్థమైన ‘ఆకలి’ని ప్రధాన పాఠ్యంలో ఉంచి, పదానికి ఉన్న విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, ఫిర్యాదులోని తీవ్రతను మరియు మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ అనువదించబడింది.
