  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣רָץ הַ/נַּ֔עַר וַ/יַּגֵּ֥ד לְ/מֹשֶׁ֖ה וַ/יֹּאמַ֑ר אֶלְדָּ֣ד וּ/מֵידָ֔ד מִֽתְנַבְּאִ֖ים בַּֽ/מַּחֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: te
  text: 'అప్పుడు ఒక యువకుడు పరుగెత్తి మోషేకు వార్త తెలియజేశాడు[a]: “ఎల్దాదు, మేదాదు శిబిరంలో ప్రవచిస్తున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ యువకుడు పరుగెత్తి మోషేకు నివేదించాడు.” హెబ్రీలో ‘యువకుడు’ అనే పదానికి నిర్దిష్ట ఉపపదం ఉంది; దానిని మరింత రూపపరంగా ‘ఆ యువకుడు’ అని అనువదించవచ్చు. ‘వార్త తెలియజేశాడు’ అనే క్రియను ‘నివేదించాడు’ లేదా ‘తెలియజేశాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: పరుగెత్తుకొచ్చి
  rationale: רוץ అనే క్రియ నేరుగా పరుగెత్తడాన్ని సూచిస్తుంది. సందర్భంలో ఆ యువకుడు మోషే ఉన్న చోటికి వచ్చిన భావాన్ని సహజమైన తెలుగులో ‘పరుగెత్తుకొచ్చి’ వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: ఒక యువకుడు
  rationale: נַעַר సందర్భానుసారం బాలుడు, యువకుడు, లేదా సేవకుడు కావచ్చు. ఇక్కడ వార్తను మోషేకు తీసుకొచ్చే వ్యక్తిని ఆధునిక తెలుగులో సహజంగా పరిచయం చేయడానికి ‘ఒక యువకుడు’ అనువైనది; హెబ్రీ నిర్దిష్ట ఉపపదాన్ని మరింత రూపపరంగా ‘ఆ యువకుడు’ అని కూడా అనువదించవచ్చు.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: మోషేకు తెలియజేస్తూ
  rationale: Hiphil రూపంలోని נגד చెప్పడం, నివేదించడం, తెలియజేయడం అనే భావాలను ఇస్తుంది. వెంటనే ప్రత్యక్ష వాక్యం రావడంతో ‘తెలియజేస్తూ’ సహజంగా నివేదికను పరిచయం చేస్తుంది.
- source_word: וַיֹּאמַר
  choice: అన్నాడు
  rationale: אמר ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ కథన క్రియ. తెలుగులో ఉల్లేఖనం చివర ‘అన్నాడు’ అని ఉంచడం సహజమైన వాక్యక్రమం.
- source_word: אֶלְדָּד וּמֵידָד
  choice: ఎల్దాదు, మేదాదు
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: מִתְנַבְּאִים
  choice: ప్రవచిస్తున్నారు
  rationale: נבא Hitpael వర్తమాన కృదంతం కొనసాగుతున్న ప్రవక్తీయ కార్యాన్ని సూచిస్తుంది. ‘ప్రవచిస్తున్నారు’ ఆ కొనసాగుతున్న భావాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలో
  rationale: מַחֲנֶה అరణ్యప్రయాణ సందర్భంలోని ఇశ్రాయేలు శిబిరాన్ని సూచిస్తుంది. ‘శిబిరంలో’ నేరమైన, సహజమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హెబ్రీ కథన క్రమాన్ని యథాశక్తి నిలుపుతూ, ప్రత్యక్ష వాక్యానికి సహజమైన తెలుగు వాక్యక్రమాన్ని ఉపయోగించాం.
