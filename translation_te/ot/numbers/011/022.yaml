language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/צֹ֧אן וּ/בָקָ֛ר יִשָּׁחֵ֥ט לָ/הֶ֖ם וּ/מָצָ֣א לָ/הֶ֑ם אִ֣ם אֶֽת כָּל דְּגֵ֥י הַ/יָּ֛ם יֵאָסֵ֥ף לָ/הֶ֖ם וּ/מָצָ֥א לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: te
  text: వారి కోసం గొర్రెలను, పశువులను వధించినా వారికి సరిపోతాయా? లేక సముద్రంలోని చేపలన్నిటినీ వారి కోసం సమకూర్చినా వారికి సరిపోతాయా[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం ‘వారికి దొరకునా?’; ఇక్కడ ఇది ‘వారికి సరిపోతుందా?’ అనే అర్థంలో వాడబడిన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: …నా?
  rationale: ప్రశ్నార్థక కణం మోషే అడిగిన అలంకారిక ప్రశ్నను సూచిస్తుంది; తెలుగులో వాక్యాంత ప్రశ్నార్థక రూపం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: צֹאן וּבָקָר
  choice: గొర్రెలను, పశువులను
  rationale: ఈ జంట చిన్న పశువులను, గోవర్గపు పశువులను సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన పదజాలాన్ని ఎంచుకున్నాం.
- source_word: יִשָּׁחֵט
  choice: వధించినా
  rationale: שׁחט యొక్క నిఫాల్ రూపం ఆహారం లేదా బలి కోసం జంతువులను వధించడాన్ని సూచిస్తుంది; సాధారణమైన ‘చంపడం’ కంటే ‘వధించడం’ సందర్భానికి తగినది.
- source_word: לָהֶם
  choice: వారి కోసం
  rationale: ఈ సందర్భంలో לְ ప్రజలకు ఆహారం సమకూర్చడాన్ని సూచిస్తుంది; ‘వారి కోసం’ సహజమైన తెలుగు రూపం.
- source_word: וּמָצָא לָהֶם
  choice: వారికి సరిపోతాయా
  rationale: מצא להם అనే ప్రయోగం అక్షరార్థంగా ‘వారికి దొరకడం’ కాక, ‘వారికి చాలడం/సరిపోవడం’ అనే భావం ఇస్తుంది.
- source_word: אִם
  choice: …అయినా
  rationale: రెండవ అలంకారిక ప్రత్యామ్నాయాన్ని తెలుగులో సహజంగా చూపించేందుకు షరతార్థక ‘అయినా’ నిర్మాణాన్ని వాడాం; రెండు ప్రశ్నల మధ్య ప్రత్యామ్నాయ సంబంధం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: సముద్రంలోని చేపలన్నిటినీ
  rationale: כָּל యొక్క సంపూర్ణతను నిలుపుతూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יֵאָסֵף
  choice: సమకూర్చినా
  rationale: నిఫాల్ రూపం ‘పోగుచేయబడటం/సేకరించబడటం’ అని సూచిస్తుంది. ఆహార సమకూర్పు సందర్భంలో ‘సమకూర్చడం’ సహజంగా ఉంది; చేపలను ‘పట్టడం’ అనే అదనపు నిర్దిష్టతను చేర్చదు.
