  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని రెండు సమాంతర అలంకారిక ప్రశ్నలను, ‘వారికి సరిపోతాయా?’ అనే పునరుక్తిని నిలిపాం.
