- from: అందువల్ల ఆ స్థలానికి కిబ్రోత్-హత్తావా[a] అని పేరు పెట్టారు; ఎందుకంటే అత్యాశపడిన ప్రజలను అక్కడ పాతిపెట్టారు.
  to: అప్పుడు ఆ స్థలానికి కిబ్రోత్-హత్తావా[a] అని పేరు పెట్టాడు, ఎందుకంటే అత్యాశపడిన ప్రజలను అక్కడ పాతిపెట్టారు.
