translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. స్థలనామం లిప్యంతరీకరించబడింది; దాని వ్యుత్పత్తి పాదసూచికలో ఇవ్వబడింది. ప్రధాన పాఠ్యంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
