  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: te
  text: అప్పుడు ఆ స్థలానికి కిబ్రోత్-హత్తావా[a] అని పేరు పెట్టాడు, ఎందుకంటే అత్యాశపడిన ప్రజలను అక్కడ పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కిబ్రోత్-హత్తావా” అనే పేరుకు బహుశా “అత్యాశ యొక్క సమాధులు” లేదా “దురాశ యొక్క సమాధులు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: అందువల్ల ఆ స్థలానికి ... అని పేరు పెట్టారు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగు కర్మణి నిర్మాణంలో అందిస్తుంది. క్రియకు స్పష్టమైన కర్త లేకపోవడం వల్ల కర్తను ఊహించి చేర్చలేదు; וַ־ యొక్క కథన ప్రవాహాన్ని సందర్భానుగుణంగా ‘అందువల్ల’ తెలియజేస్తుంది.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: కిబ్రోత్-హత్తావా
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి ప్రధాన పాఠ్యంలో ఉంచి, దాని పదార్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: כִּי שָׁם
  choice: ఎందుకంటే ... అక్కడ
  rationale: כִּי ఇక్కడ పేరుకు కారణాన్ని పరిచయం చేస్తుంది; שָׁם యొక్క స్థలార్థాన్ని ‘అక్కడ’ నేరుగా వ్యక్తపరుస్తుంది.
- source_word: קָבְרוּ אֶת הָעָם
  choice: ప్రజలను ... పాతిపెట్టారు
  rationale: కర్తను నిర్దిష్టంగా పేర్కొనని హీబ్రూ బహువచన క్రియను సహజ తెలుగు కర్మణి రూపంలో అందించి, הָעָם ను ‘ప్రజలు’గా నిలిపింది.
- source_word: הַמִּתְאַוִּים
  choice: అత్యాశపడిన
  rationale: ఈ సందర్భంలో మాంసం కోసం అదుపులేని బలమైన కోరికను సూచిస్తుంది. ‘కామించిన’ అనే పదం లైంగిక భావానికి పరిమితమయ్యే అవకాశం ఉన్నందున, విస్తృతమైన దురాశ భావాన్ని తెలిపే ‘అత్యాశపడిన’ను ఎంచుకుంది.
