id: NUM.11.18
reference: Numbers 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: te
  text: 'ప్రజలతో నీవు ఇలా చెప్పాలి: ‘రేపటి కోసం మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి[a]. అప్పుడు మీరు మాంసం తింటారు. ఎందుకంటే యాహ్వే వినేలా మీరు ఏడ్చి ఇలా అన్నారు: “మనకు మాంసం ఎవరు తినిపిస్తారు? ఐగుప్తులో మనకు బాగుండేది.” యాహ్వే మీకు మాంసం ఇస్తాడు; మీరు మాంసం తింటారు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రేపటి కోసం మిమ్మల్ని మీరు పవిత్రపరచుకోండి.’ హీబ్రూ క్రియ యాహ్వే చేయబోయే కార్యానికి సిద్ధంగా తమను తాము ప్రత్యేకించుకోవడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: నీవు ఇలా చెప్పాలి
  rationale: మోషేను ఉద్దేశించిన ద్వితీయ పురుష ఏకవచన అసంపూర్ణ క్రియకు ఇక్కడ ఆదేశ భావం ఉంది; ఆధునిక తెలుగులో ‘చెప్పాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הִתְקַדְּשׁוּ
  choice: మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి
  rationale: קדשׁ హిత్పయేల్ ఆజ్ఞారూపం దేవుని కార్యానికి సిద్ధంగా తమను తాము ప్రత్యేకించుకోవడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించుకోండి’ దాని మతపరమైన బలాన్ని నిలుపుతుంది.
- source_word: לְמָחָר
  choice: రేపటి కోసం
  rationale: לְ రాబోయే దినాన్ని దృష్టిలో ఉంచుకున్న సిద్ధతను సూచిస్తుంది; ‘రేపటి కోసం’ మూలంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: మీరు మాంసం తింటారు
  rationale: בָּשָׂר ఇక్కడ ఆహారమైన మాంసం; ఆజ్ఞ తరువాతి క్రియ సందర్భంలో రాబోయే ఫలితాన్ని సూచిస్తుంది.
- source_word: בְּכִיתֶם
  choice: ఏడుస్తూ
  rationale: ప్రజల ముందరి ఏడుపే యెహోవా ప్రతిస్పందనకు కారణమని వాక్య నిర్మాణం చూపుతుంది; తెలుగు ఉపవాక్యంలో ‘ఏడుస్తూ ... అన్నారు’ సహజంగా ఆ చర్యను నిలుపుతుంది.
- source_word: בְּאָזְנֵי יְהוָה
  choice: యెహోవా వింటుండగా
  rationale: అక్షరార్థంగా ‘యెహోవా చెవుల్లో’ అనే హీబ్రూ నుడికారం ఆయన వినికిడిలో జరిగినదని సూచిస్తుంది; ఈ అనువాదం చిత్రాన్ని అతిగా అక్షరబద్ధం చేయకుండా భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: మనకు మాంసం ఎవరు తినిపిస్తారు?
  rationale: אכל హిఫీల్ రూపంలోని కారణార్థక భావాన్ని ‘తినిపిస్తారు’ నేరుగా నిలుపుతుంది.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: ఐగుప్తులో మనకు బాగుండేది
  rationale: మూలంలో స్పష్టమైన తులనాత్మక రూపం లేదు; ‘బాగుండేది’ ప్రజల వాదనను అదనపు అర్థం చేర్చకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: కాబట్టి యెహోవా మీకు మాంసం ఇస్తాడు
  rationale: וְ సాధారణ సంధి అయినప్పటికీ, సందర్భంలో ప్రజల ఫిర్యాదుకు యెహోవా ఇచ్చే ప్రతిస్పందనను కలుపుతుంది; ‘కాబట్టి’ ఆ కారణ-ఫల సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וַאֲכַלְתֶּם
  choice: మీరు దాన్ని తింటారు
  rationale: మూలంలోని పునరుక్తిని నిలుపుతూ, తెలుగులో మాంసాన్ని సూచించేందుకు ‘దాన్ని’ చేర్చడం సహజ ప్రవాహాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలం దైవనామాన్నే ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: మాంసం ఇవ్వడం ఆశీర్వాదమా లేక తీర్పుతో కూడిన ప్రతిస్పందనా
  choice: వాక్యంలో ఉన్న కారణ సంబంధాన్ని మాత్రమే వ్యక్తం చేయడం
  alternative: దీన్ని కేవలం అనుగ్రహంగా లేదా కేవలం శిక్షగా స్పష్టీకరించడం
  rationale: ఈ వచనం ప్రజల ఏడుపును యెహోవా మాంసం ఇవ్వడంతో కలుపుతుంది; దాని పూర్తి తీర్పు స్వభావం తరువాతి వచనాల్లో విప్పబడుతుంది. అందువల్ల ఇక్కడ అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన వాక్య నిర్మాణం. ‘ప్రతిష్ఠించుకోండి’ ద్వారా ఆచార-మతపరమైన భావం నిలుపబడింది; సంభాషణలో సహజమైన ‘మనకు బాగుండేది’ వాడబడింది.
