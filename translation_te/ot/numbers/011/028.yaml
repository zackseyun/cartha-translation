source:
  edition: WLC
  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: te
  text: 'అప్పుడు నూను కుమారుడైన యెహోషువ—తన యౌవనం నుంచే మోషేకు పరిచారకుడిగా ఉన్నవాడు[a]—జవాబుగా ఇలా అన్నాడు: “నా ప్రభువా, మోషే! వారిని అడ్డుకోండి[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని యువకులలో ఒకడైన,” లేదా “అతని ఎంపికైన వారిలో ఒకడైన.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి కొంత సందిగ్ధంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారిని నిషేధించండి.” హీబ్రూ క్రియకు అదుపుచేయడం, వెనక్కి నిలిపివేయడం లేదా నిషేధించడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: జవాబుగా ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్వంద్వ వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా, దాని సంభాషణాత్మక భావాన్ని నిలుపుతూ అందిస్తుంది; וַ־ కథన క్రమాన్ని ‘అప్పుడు’ సూచిస్తుంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: వ్యక్తుల పేర్లను ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, ‘కుమారుడు’ అనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: మోషేకు పరిచారకుడిగా ఉన్నవాడు
  rationale: מְשָׁרֵת వ్యక్తిగతంగా సహాయం చేస్తూ సేవచేసే వ్యక్తిని సూచిస్తుంది. ‘పరిచారకుడు’ సేవాభావాన్ని తెలియజేస్తుంది కానీ బానిసత్వాన్ని అనవసరంగా సూచించదు.
- source_word: מִבְּחֻרָיו
  choice: తన యౌవనం నుంచే
  rationale: ఈ సంక్షిప్త హీబ్రూ పదబంధం రూపపరంగా, అర్థపరంగా సందిగ్ధమైనది. ప్రధాన పాఠంలో సహజమైన ‘తన యౌవనం నుంచే’ అనే పఠనాన్ని ఇచ్చి, ‘అతని యువకులలో/ఎంపికైన వారిలో ఒకడు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: నా ప్రభువా, మోషే!
  rationale: ఇది మానవ అధికారికి చెప్పే గౌరవపూర్వక సంబోధన. ‘ప్రభువా’ ఆ గౌరవాన్ని నిలుపుతుంది; మోషే పేరు ఉండటం వల్ల ఇది దేవునికి ఉపయోగించే బిరుదుగా అపార్థం కాకుండా ఉంటుంది.
- source_word: כְּלָאֵם
  choice: వారిని అడ్డుకోండి
  rationale: כלא అనే క్రియకు అదుపుచేయడం, నిలువరించడం లేదా నిషేధించడం అనే భావాలు ఉన్నాయి. సందర్భంలో ఎల్దాదు, మేదాదు ప్రవచించకుండా చేయాలని యెహోషువ కోరుతున్నాడు; ‘అడ్డుకోండి’ విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా క్రియ యొక్క బలాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఎల్దాదు, మేదాదులను ఎలా ఆపాలనే క్రియ యొక్క పరిధి
  choice: అడ్డుకోండి
  alternative: నిషేధించండి
  rationale: మూల క్రియ భౌతికంగా అదుపుచేయడానికీ అధికారపూర్వకంగా నిషేధించడానికీ వీలు ఇస్తుంది. ప్రధాన పాఠం ఈ రెండింటిలో ఒకదానిని ఖచ్చితంగా నిర్ణయించకుండా విస్తృతమైన పదాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని పునరుక్త ‘జవాబిచ్చి అన్నాడు’ను ‘జవాబుగా ఇలా అన్నాడు’గా సహజీకరించాం. సందిగ్ధమైన מִבְּחֻרָיוకు ప్రధాన పాఠంలో ప్రవాహవంతమైన పఠనం ఇచ్చి, నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదటిప్పణిలో భద్రపరిచాం.
