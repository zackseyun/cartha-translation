  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: te
  text: వారి మధ్యనున్న మూక తీవ్ర కోరికతో ఆశపడింది[a][b]. ఇశ్రాయేలు కుమారులు కూడా మళ్లీ ఏడ్చి, “మాకు మాంసం ఎవరు తినిపిస్తారు?[d]” అన్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కలగలిసిన జనసమూహం.” ఈ హీబ్రూ పదం అరుదైనది; ఇశ్రాయేలు సమాజంలోని ప్రధాన వర్గానికి చెందని ఒక సమూహాన్ని ప్రతికూల ఛాయతో సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఒక కోరికను కోరారు”; ఇది కోరిక తీవ్రతను నొక్కిచెప్పే సజాతి పదప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: అంటే “ఇశ్రాయేలీయులు కూడా.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: d
    text: లేదా “తినడానికి మాంసం మాకు ఎవరు ఇస్తారు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: మూకలోని వారు
  rationale: ఇది అరుదైన, ప్రతికూల భావం గల సమూహవాచక పదం. తెలుగు ‘మూక’ ఆ ప్రతికూల ఛాయను నిలుపుతుంది; బహువచన క్రియకు సహజంగా సరిపడేందుకు ‘మూకలోని వారు’ అని వాడాం.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: వారి మధ్య ఉన్న
  rationale: ఇశ్రాయేలు సమాజం లేదా శిబిరం మధ్యలో ఉన్న సమూహాన్ని సహజమైన తెలుగులో సూచిస్తుంది; హీబ్రూలోని ఏకవచన సర్వనామ సంబంధాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: తీవ్రమైన కోరికకు లోనయ్యారు
  rationale: ‘కోరారు ఒక కోరిక’ అనే హీబ్రూ సజాతి పదప్రయోగం కోరిక తీవ్రతను నొక్కిచెబుతుంది. దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: మళ్లీ ఏడుస్తూ
  rationale: שׁוּב ఇక్కడ మునుపటి చర్యను తిరిగి చేయడం లేదా కొనసాగించడం అనే భావంలో ఉంది. ‘మళ్లీ’ ఆ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు కూడా
  rationale: ‘కుమారులు’ హీబ్రూ జాతివాచక బంధాన్ని రూపపరంగా నిలుపుతుంది; ‘కూడా’ גַּם భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: మాకు మాంసం ఎవరు తినిపిస్తారు?
  rationale: אכל హిఫీల్ రూపంలోని ‘తినేలా చేయు/తినిపించు’ భావాన్ని నేరుగా నిలుపుతుంది; בָּשָׂרను ఈ ఆహార సందర్భంలో ‘మాంసం’గా అనువదించాం.
