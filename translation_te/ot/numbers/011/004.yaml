translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. అరుదైన సమూహవాచక పదంలోని ప్రతికూల భావం, సజాతి పదప్రయోగంలోని తీవ్రత, ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపం, ప్రశ్నలోని causative భావం పాఠ్యంలో లేదా పాదటిప్పణుల్లో నిలుపబడ్డాయి.
