- from: వారి మధ్య ఉన్న మూకలోని వారు[a] తీవ్రమైన కోరికకు లోనయ్యారు[b]. ఇశ్రాయేలు కుమారులు[c] కూడా మళ్లీ ఏడుస్తూ, “మాకు మాంసం ఎవరు తినిపిస్తారు?[d]” అన్నారు.
  to: వారి మధ్యనున్న మూక తీవ్ర కోరికతో ఆశపడింది[a][b]. ఇశ్రాయేలు కుమారులు కూడా మళ్లీ ఏడ్చి, “మాకు మాంసం ఎవరు తినిపిస్తారు?[d]” అన్నారు.[c]
  rationale: The revised wording directly makes the pejorative collective ‘మూక’ the subject, avoiding the misleading and unnatural ‘మూకలోని వారు.’ It renders the weeping with a finite sequential form (‘ఏడ్చి ... అన్నారు’) rather than a background participle. The strong craving, ethnic designation, and causative question are retained, and all footnote anchors remain present with their corresponding notes.
