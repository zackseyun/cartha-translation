    issue: Awkward and imprecise rendering of the collective subject
    rationale: “వారి మధ్య ఉన్న మూకలోని వారు” means ‘the people in the mob among them,’ rather than directly rendering the Hebrew collective noun ‘the rabble.’
  - severity: medium
    issue: Participial rendering weakens verbal coordination
    rationale: '“మళ్లీ ఏడుస్తూ ... అన్నారు” presents weeping as simultaneous manner/background, while וַיִּבְכּוּ וַיֹּאמְרוּ is a sequence of coordinated actions: they wept and said.'
