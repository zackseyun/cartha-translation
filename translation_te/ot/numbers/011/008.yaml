  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁטוּ֩ הָ/עָ֨ם וְ/לָֽקְט֜וּ וְ/טָחֲנ֣וּ בָ/רֵחַ֗יִם א֤וֹ דָכוּ֙ בַּ/מְּדֹכָ֔ה וּ/בִשְּׁלוּ֙ בַּ/פָּר֔וּר וְ/עָשׂ֥וּ אֹת֖/וֹ עֻג֑וֹת וְ/הָיָ֣ה טַעְמ֔/וֹ כְּ/טַ֖עַם לְשַׁ֥ד הַ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: te
  text: ప్రజలు అటూ ఇటూ తిరిగి దాన్ని ఏరుకొనేవారు. దాన్ని తిరగలితో నూరేవారు లేదా కల్వంలో దంచేవారు; కుండలో ఉడికించి రొట్టెలుగా చేసేవారు. దాని రుచి నూనె సారంలా ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాజా నూనె రుచిలా.” “నూనె సారం” అని అనువదించిన హీబ్రూ పదబంధం అర్థం కచ్చితంగా తెలియదు; అది నూనెలోని పుష్టిని లేదా తాజా సారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: అటూ ఇటూ తిరిగి
  rationale: ఈ క్రియ ఒక ప్రాంతంలో ఇటూ అటూ సంచరించడాన్ని సూచిస్తుంది. సందర్భంలోని అలవాటుగా జరిగే గత చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָקְטוּ
  choice: ఏరుకునేవారు
  rationale: మన్నాను నేలమీద నుంచి సేకరించడాన్ని సూచించడానికి సాధారణంగా, సహజంగా వినిపించే పదం.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: తిరగలిలో విసిరేవారు
  rationale: רֵחַיִם చేతితో నడిపే తిరగలిని లేదా దాని రాళ్లను సూచిస్తుంది. ధాన్యాన్ని తిరగలిలో మెత్తగా చేసే చర్యకు ‘విసరడం’ సహజమైన తెలుగు వాడుక.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: రోటిలో దంచేవారు
  rationale: కల్వం లేదా రోటిలో దంచి నలిపే చర్యను స్పష్టంగా, నిత్యవాడుక తెలుగులో తెలియజేస్తుంది.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: కుండలో ఉడికించి
  rationale: క్రియ ఉడికించడం లేదా వండడం అనే అర్థాలను కలిగి ఉంది; పాత్రతో కూడిన ఈ సందర్భంలో ‘కుండలో ఉడికించి’ మూలానికి దగ్గరగా ఉంది.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: రొట్టెలుగా చేసేవారు
  rationale: עֻגוֹת గుండ్రని రొట్టెలను లేదా కేకులను సూచిస్తుంది. ఆహార సందర్భంలో ‘రొట్టెలు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: טַעְמוֹ
  choice: దాని రుచి
  rationale: మూలంలోని స్వాధీన సంబంధాన్ని, రుచి అనే ప్రాథమిక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: నూనె సారంలా
  rationale: లెషాద్ అనే అరుదైన పదం పుష్టి, తాజాదనం లేదా రససారాన్ని సూచించవచ్చు. ‘నూనె సారం’ మూలపదంలోని అస్పష్టతను పూర్తిగా తొలగించకుండా తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. వరుసగా జరిగే అలవాటైన చర్యలను ‘-నేవారు’ రూపాలతో వ్యక్తం చేశాం; క్లిష్టమైన చివరి పదబంధంలోని భావ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
