translation:
  language: te
  text: నేను ఒక్కడినే ఈ ప్రజలందరినీ మోయలేను, ఎందుకంటే వారు నాకు మరీ భారంగా ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי לְבַדִּי
  choice: నా ఒక్కడివల్ల కాదు
  rationale: అసమర్థతను సూచించే ‘నేను చేయలేను’ అనే భావంతోపాటు אָנֹכִי మరియు לְבַדִּי ఇచ్చే ‘నేను ఒక్కడినే’ అనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לָשֵׂאת
  choice: మోయడం
  rationale: ప్రజల బాధ్యతను భరించడం అనే రూపకాలంకారాన్ని మూలంలోని ‘మోయు’ క్రియకు దగ్గరగా కాపాడుతుంది.
- source_word: כָבֵד מִמֶּנִּי
  choice: ఈ భారం నాకు మరీ బరువుగా ఉంది
  rationale: ‘నాకంటే బరువైనది’ అనే హీబ్రూ ప్రయోగానికి సహజ తెలుగు సమానార్థక రూపం; సందర్భంలోని భారాన్ని స్పష్టంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ‘నేను ఒక్కడినే’ అనే ఉద్ఘాటనను ‘నా ఒక్కడివల్ల’ ద్వారా నిలిపి, బాధ్యతను ‘మోయడం’ అనే రూపకాన్ని అలాగే ఉంచింది.
