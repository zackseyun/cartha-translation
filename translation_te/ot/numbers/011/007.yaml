translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని రెండు దృశ్య పోలికలను నిలిపి, అనిశ్చిత పదార్థనామాన్ని పాదసూచికలో వివరించాం.
