base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: te
  text: మన్నా ధనియాల విత్తనంలా ఉండేది; దాని రూపం బదోలహు[a] రూపంలా ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బదోలహు అనేది సువాసనగల జిగురు లేదా చెట్టు నుంచి వచ్చే గంధపు జిగురు కావచ్చు. అయితే ఈ హీబ్రూ పదం దేనిని సూచిస్తుందో ఖచ్చితంగా తెలియదు; కొందరు దీనిని ముత్యం లేదా స్ఫటికంలాంటి పదార్థంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: మన్నా
  rationale: అరణ్యంలో ఇశ్రాయేలీయులకు తెలిసిన ఆహారాన్ని సూచించే నిర్దిష్ట నామం. తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: כִּזְרַע גַּד
  choice: ధనియాల విత్తనంలా
  rationale: כִּ పోలికను సూచిస్తుంది; גַּד సాధారణంగా ధనియాలుగా గుర్తించబడుతుంది. సహజమైన ఆధునిక తెలుగులో పోలికను స్పష్టంగా అందిస్తుంది.
- source_word: וְעֵינוֹ
  choice: దాని రూపం
  rationale: עַיִן అక్షరార్థంగా ‘కన్ను’ అయినా, ఇక్కడ కనిపించే రూపం లేదా దృశ్య స్వభావాన్ని సూచించే నుడికారం.
- source_word: כְּעֵין
  choice: రూపంలా
  rationale: మూలంలోని పునరుక్త దృశ్య పోలికను నిలుపుతూ, తెలుగులో సహజంగా ‘దాని రూపం ... రూపంలా’ అని ఇచ్చాం.
- source_word: הַבְּדֹלַח
  choice: బదోలహు
  rationale: సూచిత పదార్థం ఖచ్చితంగా తెలియదు. అందువల్ల గుగ్గిలం, ముత్యం లేదా స్ఫటికం వంటి ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో నిర్ణయాత్మకంగా పెట్టకుండా హీబ్రూ పదాన్ని లిప్యంతరీకరించాం.
