  edition: WLC
  text: מֵ/אַ֤יִן לִ/י֙ בָּשָׂ֔ר לָ/תֵ֖ת לְ/כָל הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי יִבְכּ֤וּ עָלַ/י֙ לֵ/אמֹ֔ר תְּנָ/ה לָּ֥/נוּ בָשָׂ֖ר וְ/נֹאכֵֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: te
  text: ఈ ప్రజలందరికీ ఇవ్వడానికి మాంసం నాకు ఎక్కడి నుంచి దొరుకుతుంది? ఎందుకంటే వారు నా ఎదుట ఏడుస్తున్నారు[a], ‘మేము తినడానికి మాకు మాంసం ఇవ్వు’ అని అంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాతో మొరపెడుతూ ఏడుస్తున్నారు’; లేదా ‘తమ ఏడుపుతో నన్ను ఒత్తిడి చేస్తున్నారు.’ హీబ్రూలో అక్షరార్థంగా ‘నా మీద ఏడుస్తున్నారు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: నాకు ఎక్కడి నుంచి దొరుకుతుంది?
  rationale: מֵאַיִן మూలాన్ని గురించి ప్రశ్నిస్తుంది; לִי మోషేకు అది అందుబాటులో లేకపోవడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ప్రశ్నలోని నిస్సహాయతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּשָׂר
  choice: మాంసం
  rationale: ఆహారంగా తినే జంతు మాంసమే సందర్భార్థం.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: ఈ ప్రజలందరికీ ఇవ్వడానికి
  rationale: עם అనే సమూహవాచక ఏకవచనాన్ని తెలుగులో సహజమైన ‘ప్రజలందరికీ’గా ఇచ్చి, לָתֵת యొక్క ప్రయోజన భావాన్ని ‘ఇవ్వడానికి’తో నిలిపింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మోషే వేసిన ప్రశ్నకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יִבְכּוּ עָלַי
  choice: నా ఎదుట ఏడుస్తున్నారు
  rationale: עָלַי అనే హీబ్రూ ప్రయోగం ఏడుపు మోషే వైపు మళ్లి, అతనిపై ఒత్తిడి కలిగిస్తున్న భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో అతని సమక్షంలో ఏడుస్తున్న భావాన్ని సహజంగా ఇచ్చి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: לֵאמֹר
  choice: అని అంటూ
  rationale: తరువాత వచ్చే ప్రత్యక్ష మాటలను పరిచయం చేసే సాధారణ ఉద్ధరణ ప్రయోగం.
- source_word: תְּנָה לָּנוּ
  choice: మాకు మాంసం ఇవ్వు
  rationale: ఆజ్ఞార్థక క్రియను, పరోక్ష కర్మను సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: וְנֹאכֵלָה
  choice: మేము తినడానికి
  rationale: కోహోర్టేటివ్ రూపంలోని ఆశించిన ఉద్దేశం లేదా ఫలితాన్ని సహజ తెలుగులో ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יִבְכּוּ עָלַי లోని עַל సంబంధార్థం
  choice: నా ఎదుట ఏడుస్తున్నారు
  alternative: నాతో మొరపెడుతూ ఏడుస్తున్నారు / తమ ఏడుపుతో నన్ను ఒత్తిడి చేస్తున్నారు
  rationale: ఈ హీబ్రూ ప్రయోగాన్ని కేవలం స్థలార్థంగా లేదా విరోధార్థంగా ఖరారు చేయకుండా, ప్రధాన పాఠంలో తటస్థమైన సమక్ష భావాన్ని ఉంచి, దిశ మరియు ఒత్తిడి అనే సాధ్యమైన నుడికారాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. పాదసూచిక గుర్తు [a] సంబంధిత వాక్యభాగం వెంట ఉంచబడింది.
