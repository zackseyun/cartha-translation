source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: te
  text: మేము ఐగుప్తులో ఉచితంగా[a] తిన్న చేపలు, దోసకాయలు, పుచ్చకాయలు, ఉల్లికాడలు, ఉల్లిపాయలు, వెల్లుల్లి—అన్నీ మాకు గుర్తున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “డబ్బు చెల్లించకుండా.” వారు ఐగుప్తులో నిజానికి బానిసలుగా ఉన్నప్పటికీ, తమ ప్రస్తుత ఫిర్యాదు దృష్టితో అక్కడి జీవితాన్ని జ్ఞాపకం చేసుకుంటున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: మాకు గుర్తుకొస్తున్నాయి
  rationale: ప్రత్యక్ష ఫిర్యాదులో గత ఆహారాన్ని ప్రస్తుతం తలచుకుంటున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. జాబితాను ముందుంచే తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా బహువచన రూపం వాడబడింది.
- source_word: הַדָּגָה
  choice: చేపలు
  rationale: ఆహారంగా చేపలను సమూహార్థంలో సూచిస్తుంది; జాతిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר נֹאכַל
  choice: తిన్న
  rationale: గతంలో అలవాటుగా తినడాన్ని సందర్భం తెలియజేస్తుంది; తెలుగు అసమాపక క్రియారూపం సంబంధ వాక్యాన్ని సహజంగా సంక్షిప్తం చేస్తుంది.
- source_word: בְּמִצְרַיִם
  choice: ఐగుప్తులో
  rationale: స్థలార్థాన్ని నేరుగా అందించే, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
- source_word: חִנָּם
  choice: ఉచితంగా
  rationale: డబ్బు చెల్లించకుండా అనే ప్రాథమిక భావాన్ని స్పష్టంగా ఇస్తుంది; ఐగుప్తు దాస్యాన్ని నిజమైన స్వేచ్ఛగా వ్యాఖ్యానించదు.
- source_word: הַקִּשֻּׁאִים
  choice: దోసకాయలు
  rationale: ఈ పంటకు సాధారణ ఆధునిక తెలుగు పేరు.
- source_word: הָאֲבַטִּחִים
  choice: పుచ్చకాయలు
  rationale: ఈ హెబ్రీ పదానికి సాధారణంగా గుర్తించబడే పండు; తెలుగులో సహజమైన నిర్దిష్ట పేరు.
- source_word: הֶחָצִיר
  choice: ఉల్లికాడలు
  rationale: ఆహార జాబితాలో గడ్డి అనే సాధారణ అర్థం సరిపోదు; ఇక్కడ తినే లీక్ తరహా ఆకుకూరను సాధారణ పాఠకునికి అర్థమయ్యేలా సూచిస్తుంది.
- source_word: הַבְּצָלִים
  choice: ఉల్లిపాయలు
  rationale: ప్రామాణిక పదార్థ గుర్తింపు.
- source_word: הַשּׁוּמִים
  choice: వెల్లుల్లి
  rationale: ప్రామాణిక పదార్థ గుర్తింపు.
theological_decisions:
- issue: ఐగుప్తు దాస్య సందర్భంలో חִנָּם అర్థం
  choice: ఉచితంగా
  alternative: డబ్బు చెల్లించకుండా; స్వేచ్ఛగా
  rationale: మాట్లాడుతున్నవారి ఫిర్యాదు దృష్టికోణాన్ని యథాతథంగా ఉంచుతుంది. వారు ఆహారానికి ధర చెల్లించలేదని చెప్పడం, ఐగుప్తులో నిజంగా స్వేచ్ఛగా ఉన్నారని నిర్ధారించడం కాదు; సందర్భంలోని వ్యంగ్య ఉద్రిక్తతను పాదటిప్పణి సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. హెబ్రీ వాక్యంలోని జాబితా ప్రధానతను నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘గుర్తుకొస్తున్నాయి’ను వాక్యాంతంలో ఉంచాం.
