id: NUM.11.16
reference: Numbers 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “ఇశ్రాయేలు పెద్దలలో నుండి, ప్రజల పెద్దలనీ వారి అధికారులనీ నీవు ఎరిగిన డెబ్బై మంది పురుషులను నా కోసం సమకూర్చు.[a] వారిని సమావేశపు గుడారానికి తీసుకురా; వారు అక్కడ నీతో కలిసి నిలబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కోసం సమావేశపరచు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶסְפָה לִּי
  choice: నా కోసం సమకూర్చు
  rationale: ఆ వ్యక్తులను ఒకచోటికి చేర్చాలనే ఆజ్ఞను, לִּי లోని ‘నా కోసం’ అనే భావంతో సహా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שִׁבְעִים אִישׁ
  choice: డెబ్బై మంది పురుషులు
  rationale: నాయకత్వ సందర్భంలో אִישׁ వయోజన పురుషులను సూచిస్తుంది; సంఖ్య తరువాత తెలుగు బహువచన నిర్మాణాన్ని వాడాం.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలలోనుండి
  rationale: מִן పెద్దల సమూహంలోనుండి ఎంపికను సూచిస్తుంది; זָקֵן ఇక్కడ సామాజిక-పాలనా నాయకుడనే అర్థంలో ‘పెద్ద’గా అనువదించబడింది.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: నీవు ఎరిగిన
  rationale: ఎంపిక చేయబడేవారు గుర్తింపు పొందిన నాయకులని మోషేకు ముందే తెలుసనే భావాన్ని సంక్షిప్తమైన సహజ తెలుగు నిర్మాణంలో నిలిపాం.
- source_word: זִקְנֵי הָעָם וְשֹׁטְרָיו
  choice: ప్రజల పెద్దలుగాను వారి అధికారులుగాను
  rationale: రెండు నాయకత్వ పాత్రలనూ విడిగా ఉంచాం; ఏకవచన ప్రత్యయం సమష్టిగా ఉన్న ‘ప్రజలు’ను సూచించేందున ‘వారి’ అని ఇచ్చాం.
- source_word: וְלָקַחְתָּ אֹתָם אֶל אֹהֶל מוֹעֵד
  choice: వారిని ప్రత్యక్ష గుడారం దగ్గరికి తీసుకురా
  rationale: లక్ష్యస్థానానికి తీసుకువెళ్లే לָקַח్ భావాన్ని తెలుగులో ‘తీసుకురా’గా, אֹהֶל מוֹעֵד అనే స్థిర పవిత్రస్థల నామాన్ని ‘ప్రత్యక్ష గుడారం’గా ఇచ్చాం.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: వారు అక్కడ నీతో పాటు నిలబడాలి
  rationale: హిత్పయేల్ రూపంలోని తమ స్థానాన్ని స్వీకరించి నిలబడే భావాన్నీ, ఆదేశ బలాన్నీ స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: אֹהֶל מוֹעֵד అనే పవిత్రస్థల నామం
  choice: ప్రత్యక్ష గుడారం
  alternative: సమావేశపు గుడారం
  rationale: ఈ స్థిర బైబిలు పదబంధం దేవుడు తన ప్రజలను కలుసుకునే గుడారాన్ని సూచిస్తుంది. ‘ప్రత్యక్ష గుడారం’ ఆ ఆధ్యాత్మిక-స్థల సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘సమావేశపు గుడారం’ కూడా పదశః సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల వాక్యనిర్మాణం వాడబడింది. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేలా ‘ఇలా అన్నాడు’, ‘తీసుకురా’ వంటి రూపాలు తీసుకున్నాం. మూలంలోని ఎంపిక, గుర్తింపు, నాయకత్వ పాత్రలు, కలిసి నిలబడే ఆదేశం అన్నీ స్పష్టంగా నిలిపాం.
