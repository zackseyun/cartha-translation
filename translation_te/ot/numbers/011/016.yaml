- from: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “ఇశ్రాయేలు పెద్దలలోనుండి, ప్రజల పెద్దలుగాను వారి అధికారులుగాను[b] నీవు ఎరిగిన డెబ్బై మంది పురుషులను నా కోసం సమకూర్చు.[a] వారిని ప్రత్యక్ష గుడారం దగ్గరికి తీసుకురా; వారు అక్కడ నీతో పాటు నిలబడాలి.”'
  to: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “ఇశ్రాయేలు పెద్దలలో నుండి, ప్రజల పెద్దలనీ వారి అధికారులనీ నీవు ఎరిగిన డెబ్బై మంది పురుషులను నా కోసం సమకూర్చు.[a] వారిని సమావేశపు గుడారానికి తీసుకురా; వారు అక్కడ నీతో కలిసి నిలబడాలి.”'
  rationale: The sanctuary term has been corrected to a source-transparent equivalent of “tent of meeting,” without adding the notion of divine manifestation. The relative clause has been reordered for idiomatic Telugu and retains the Hebrew assertion that Moses recognizes the men as both the people’s elders and their administrative officers. Footnote b is retained in the complete footnote set, but no anchor is supplied because the submitted draft's b-anchor was attached within the clause; to maintain anchor correspondence it should be placed after “అధికారులనీ” in production text.
