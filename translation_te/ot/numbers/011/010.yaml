id: NUM.11.10
reference: Numbers 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: te
  text: మోషే ప్రజలు తమ తమ వంశాలవారీగా[a] ఏడుస్తుండడం విన్నాడు—ఒక్కొక్క పురుషుడు తన గుడారపు ద్వారం దగ్గర ఏడుస్తున్నాడు. యాహ్వే కోపం ఎంతో రగులుకుంది; మోషే దృష్టికి అది చెడ్డదిగా అనిపించింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ తమ కుటుంబాలవారీగా.” ఇక్కడి హీబ్రూ పదం కుటుంబ సమూహాలను లేదా వంశాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది మోషేకు నచ్చలేదు.” అక్షరార్థంగా, “అది మోషే దృష్టికి చెడ్డదిగా ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: ఇక్కడ שׁמע ప్రజల ఏడుపును గ్రహించడాన్ని తెలిపే సాధారణ క్రియ; శ్రద్ధగా వినడం అనే ప్రత్యేక భావం అవసరం లేదు.
- source_word: הָעָם בֹּכֶה
  choice: ప్రజలు ... ఏడుస్తుండడం
  rationale: בֹּכֶה అనే కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘ఏడుస్తుండడం’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: తమ తమ వంశాలవారీగా
  rationale: מִשְׁפָּחָה కుటుంబాలకన్నా విస్తృతమైన బంధుత్వ సమూహాలను లేదా వంశాలను సూచించగలదు; విభజనాత్మక భావాన్ని ‘వారీగా’ స్పష్టం చేస్తుంది.
- source_word: אִישׁ
  choice: ఒక్కొక్క పురుషుడు
  rationale: పుంలింగ ఏకవచన రూపం ఇక్కడ సమూహంలోని ప్రతి పురుషుణ్ణి విభజనాత్మకంగా సూచిస్తుంది.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: తన గుడారపు ద్వారం దగ్గర
  rationale: פֶּתַח గుడారపు ప్రవేశస్థానాన్ని సూచిస్తుంది; ఈ రూపం దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: యాహ్వే కోపం ఎంతో రగులుకుంది
  rationale: חרה אף లోని ‘మండే/రగిలే కోపం’ రూపకాన్ని నిలుపుతూ מְאֹד యొక్క తీవ్రతను ‘ఎంతో’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: అది మోషే కళ్లకు చెడ్డదిగా కనిపించింది
  rationale: ‘మోషే కళ్లలో చెడ్డది’ అనే హీబ్రూ ప్రయోగంలోని మూల్యాంకన బలాన్ని నిలుపుతూ, ‘అది’ దేనిని సూచిస్తుందో మూలంలో ఉన్నంతవరకు తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా సాధారణంగా ఆమోదించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- issue: אִישׁ యొక్క లింగసూచక విభజనాత్మక భావం
  choice: ఒక్కొక్క పురుషుడు
  alternative: ఒక్కొక్కరు; ప్రతి ఒక్కరూ
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని, అది సమూహంలోని వ్యక్తులను ఒక్కొక్కరిగా సూచించే విధానాన్ని కాపాడుతుంది.
- issue: וּבְעֵינֵי מֹשֶׁה רָע లో అంతర్లీన కర్త
  choice: అది మోషే కళ్లకు చెడ్డదిగా కనిపించింది
  alternative: అది మోషేకు అసంతృప్తి కలిగించింది
  rationale: హీబ్రూలో ఏ విషయం చెడ్డదిగా కనిపించిందో స్పష్టంగా చెప్పలేదు. ‘అది’ అనే సర్వనామం ఆ సూచనను నిర్దిష్టంగా పరిష్కరించకుండా ఉంచుతుంది; ‘అసంతృప్తి కలిగించింది’ భావానువాదాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ రూపకమైన రగిలే కోపాన్ని నిలుపుతూ, చివరి వాక్యభాగంలోని సూచనాత్మక అస్పష్టతను పరిష్కరించకుండా ఉంచాం.
