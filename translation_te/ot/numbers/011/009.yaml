  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: te
  text: రాత్రివేళ శిబిరం మీద మంచు దిగినప్పుడు[a], మన్నా దానిమీద దిగేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాత్రి శిబిరం మీద మంచు దిగినప్పుడు, మన్నా దానిమీద దిగేది.” హీబ్రూలో మంచు, మన్నా రెండింటికీ ఒకే ‘దిగు’ అనే క్రియ వాడబడింది; దీనివల్ల వాటి మధ్య సమాంతరత స్పష్టమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: దిగినప్పుడు
  rationale: וְ־తో కూడిన בְּ + ירד క్రియాధాతురూపం కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో ‘దిగినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: הַטַּל
  choice: మంచు
  rationale: ఇక్కడ טַל రాత్రివేళ నేలపై ఏర్పడే dewను సూచిస్తుంది; తెలుగులో సాధారణంగా ‘మంచు’ అని అంటారు.
- source_word: עַל הַמַּחֲנֶה
  choice: శిబిరం మీద
  rationale: עַל యొక్క ‘మీద/పై’ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే ఈ పదానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: יֵרֵד
  choice: దిగేది
  rationale: కథన సందర్భంలో ఈ అసంపూర్ణ క్రియ అలవాటుగా లేదా పునరావృతంగా జరిగిన గత చర్యను సూచిస్తుంది; ‘దిగేది’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: הַמָּן
  choice: మన్నా
  rationale: ఇశ్రాయేలీయులకు తెలిసిన ఆహారానికి వాడిన నిర్దిష్ట నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: పుంలింగ ఏకవచన సర్వనామ ప్రత్యయం సహజంగా ‘శిబిరం’ను తిరిగి సూచిస్తుంది; మంచుతో మన్నాకు ఉన్న ఖచ్చితమైన స్థలసంబంధాన్ని అదనంగా నిర్ధారించకుండా హీబ్రూ సర్వనామాన్ని నిలుపుతుంది.
