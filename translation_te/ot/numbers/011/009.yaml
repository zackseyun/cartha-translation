  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; ‘దిగినప్పుడు/దిగేది’ అనే పునరుక్తి ద్వారా మూలంలోని ఒకే క్రియను ఉద్దేశపూర్వకంగా నిలిపింది. ‘కూడా’ హీబ్రూ వాక్యంలోని సమాంతర సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
