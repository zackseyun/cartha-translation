id: NUM.11.31
reference: Numbers 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: te
  text: అప్పుడు యాహ్వే దగ్గర నుంచి ఒక గాలి బయలుదేరి, సముద్రం నుంచి పూరేళ్లను కొట్టుకొచ్చి, శిబిరం చుట్టూ వాటిని పడేలా చేసింది. అవి శిబిరానికి ఇటువైపు ఒక రోజు ప్రయాణమంత దూరం, అటువైపు ఒక రోజు ప్రయాణమంత దూరం వ్యాపించి, నేల ఉపరితలానికి దాదాపు రెండు మూరల ఎత్తులో ఉన్నాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదశః, “నేల ముఖంపై దాదాపు రెండు మూరలు.” ఇది పూరేళ్లు నేలకు పైన ఎగిరిన లేదా వ్యాపించిన ఎత్తును సూచించవచ్చు; లేక నేలపై అవి పేరుకున్న లోతును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: ఒక గాలి
  rationale: רוּחַ అనే పదానికి ‘గాలి’, ‘శ్వాస’, ‘ఆత్మ’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అది సముద్రం నుంచి పూరేళ్లను తీసుకువస్తున్నందున ‘గాలి’ సందర్భానికి అత్యంత సహజం; ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: యెహోవా దగ్గర నుంచి ... బయలుదేరి
  rationale: נָסַע సాధారణంగా బయలుదేరడం లేదా ప్రయాణం మొదలుపెట్టడం సూచిస్తుంది; מֵאֵת יְהוָה గాలి యొక్క దైవిక మూలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיָּגָז שַׂלְוִים
  choice: పూరేళ్లను కొట్టుకొని వచ్చి
  rationale: అరుదైన גוז క్రియ ఇక్కడ గాలి పక్షులను సముద్రం నుంచి బలంగా తీసుకురావడాన్ని సూచిస్తుంది. ‘కొట్టుకొని వచ్చి’ గాలి చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִן הַיָּם
  choice: సముద్రం వైపు నుంచి
  rationale: పక్షులు వచ్చిన భౌగోళిక దిశను నేరుగా నిలుపుతుంది.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: శిబిరం చుట్టూ వాటిని పడేలా చేసింది
  rationale: נטשׁ కు విస్తరింపజేయడం, విడిచిపెట్టడం, పడవేయడం వంటి భావాలు ఉన్నాయి. తరువాతి ‘శిబిరం చుట్టూ’ అనే పరిధిని బట్టి, గుడారాల మీదనే పడ్డాయని అనవసరంగా సూచించకుండా పంపిణీ ఫలితాన్ని తెలుపుతుంది.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: ఇటువైపు ఒక రోజు ప్రయాణమంత దూరం, అటువైపు ఒక రోజు ప్రయాణమంత దూరం
  rationale: హీబ్రూ వాక్యంలోని పునరుక్త నిర్మాణాన్ని నిలుపుతూ, శిబిరం నుంచి విస్తరించిన దూరాన్ని స్పష్టంగా చెబుతుంది.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: శిబిరం చుట్టూ
  rationale: పక్షుల విస్తరణ శిబిరాన్ని అన్ని వైపులా చుట్టుముట్టిందనే సమగ్ర భావాన్ని సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: וּכְאַמָּתַיִם
  choice: దాదాపు రెండు మూరలు
  rationale: כְּ సుమారు అనే భావాన్ని ఇస్తుంది. אַמָּה అనే ప్రాచీన కొలతకు తెలుగులో సాంప్రదాయికంగా అర్థమయ్యే ‘మూర’ను వాడాం.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: నేల ఉపరితలానికి ... ఎత్తులో
  rationale: పదశః ‘నేల ముఖంపై/పైన’. రెండు మూరల కొలత పక్షులు ఎగిరిన లేదా వ్యాపించిన ఎత్తునా, నేలపై పేరుకున్న లోతునా అనేది సందిగ్ధం; ప్రధాన పాఠ్యంలో సహజమైన ఎత్తు భావాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదటీపులో నిలిపాం.
theological_decisions:
- issue: యెహోవా దగ్గర నుంచి వచ్చిన గాలి యొక్క కార్యసాధకత్వం
  choice: యెహోవా దగ్గర నుంచి బయలుదేరిన గాలే పూరేళ్లను తీసుకొచ్చిన సాధనంగా వర్ణించడం
  alternative: యెహోవా గాలి ద్వారా నేరుగా పూరేళ్లను పంపాడని మరింత వివరణాత్మకంగా చెప్పడం
  rationale: హీబ్రూ గాలి యెహోవా దగ్గర నుంచి వచ్చిందని స్పష్టంగా చెబుతుంది; అయితే కార్యవిధానంపై అదనపు వివరణ ఇవ్వదు. కాబట్టి దైవిక మూలాన్నీ సహజ సాధనాన్నీ కలిపి నిలిపాం.
- issue: רוּחַ యొక్క ‘గాలి/ఆత్మ’ సందిగ్ధత
  choice: సందర్భానుసారం ప్రధాన పాఠ్యంలో ‘గాలి’
  alternative: ‘యెహోవా దగ్గర నుంచి ఒక ఆత్మ బయలుదేరింది’
  rationale: పూరేళ్లను సముద్రం నుంచి కొట్టుకొని రావడం భౌతిక గాలిని బలంగా సూచిస్తుంది; అయినా పదానికి ఉన్న నిజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదటీపులో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పూరేళ్లు’, ‘శిబిరం’, ‘మూర’ వంటి సాధారణ బైబిలు పదజాలాన్ని ఉంచి, హీబ్రూలోని ప్రాదేశిక విస్తరణను పునరుక్తితో స్పష్టంగా వ్యక్తం చేశాం. నిజమైన పదార్థ, కొలత సందిగ్ధతలను పాదటీపుల్లో నిలిపాం.
