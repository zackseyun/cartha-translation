revisions:
- from: అప్పుడు యెహోవా దగ్గర నుంచి ఒక గాలి బయలుదేరి, సముద్రం వైపు నుంచి పూరేళ్లను కొట్టుకొని వచ్చి[a], శిబిరం చుట్టూ వాటిని పడేలా చేసింది. అవి శిబిరానికి ఇటువైపు ఒక రోజు ప్రయాణమంత దూరం, అటువైపు ఒక రోజు ప్రయాణమంత దూరం వ్యాపించి, నేల ఉపరితలానికి దాదాపు రెండు మూరల ఎత్తులో ఉన్నాయి[b].
  to: అప్పుడు యాహ్వే దగ్గర నుంచి ఒక గాలి బయలుదేరి, సముద్రం నుంచి పూరేళ్లను కొట్టుకొచ్చి, శిబిరం చుట్టూ వాటిని పడేలా చేసింది. అవి శిబిరానికి ఇటువైపు ఒక రోజు ప్రయాణమంత దూరం, అటువైపు ఒక రోజు ప్రయాణమంత దూరం వ్యాపించి, నేల ఉపరితలానికి దాదాపు రెండు మూరల ఎత్తులో ఉన్నాయి[a].
  rationale: 'The revision restores the direct sense of ‘from the sea,’ improves the Telugu expression of the wind’s action, and uses ‘యాహ్వే’ in accord with the source-name policy. The alternative sense of רוּחַ is retained as a footnote. Footnote markers are placed in sequential order: the height/distribution ambiguity is anchored at the relevant final clause, while the רוח alternative is retained as the second note.'
