  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: te
  text: అయితే ఇద్దరు పురుషులు శిబిరంలో ఉండిపోయారు. ఒకరి పేరు ఎల్దాదు, రెండవవాని పేరు మేదాదు. ఆత్మ వారిమీద నిలిచింది. వారు నమోదు చేయబడినవారిలో ఉన్నారు[a], కానీ గుడారానికి వెళ్లలేదు[b]. వారు శిబిరంలో ప్రవచించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు నమోదైనవారిలో ఉన్నారు.’ హీబ్రూలో అక్షరార్థంగా, ‘వ్రాయబడినవారిలో’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ సందర్భంలో ఇది సన్నిధి గుడారాన్ని సూచించే అవకాశం ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: ఉండిపోయారు
  rationale: שׁאר ఇక్కడ మిగిలి ఉండడాన్ని సూచిస్తుంది. వారు ఎందుకు వెళ్లలేదో ఊహించకుండా, కథన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: ఇద్దరు పురుషులు
  rationale: אֲנָשִׁים పుంలింగ బహువచనం; మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలోనే
  rationale: מַחֲנֶה ఇశ్రాయేలీయుల శిబిరాన్ని సూచిస్తుంది. ‘లోనే’ వారు గుడారం దగ్గరికి వెళ్లకుండా శిబిరంలో మిగిలిన వ్యత్యాసాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: ఒకరి పేరు ... రెండవవారి పేరు
  rationale: హీబ్రూ నామకరణ సూత్రంలోని ‘ఒకరు ... రెండవవారు’ అనే నిర్మాణాన్ని చదవదగిన తెలుగులో నిలుపుతుంది.
- source_word: אֶלְדָּד / מֵידָד
  choice: ఎల్దాదు / మేదాదు
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: ఆత్మ వారిమీద నిలిచింది
  rationale: נוּחַ వారిమీద నిలవడం లేదా విశ్రమించడాన్ని సూచిస్తుంది. సందర్భంలో ప్రవచనానికి శక్తినిచ్చే దైవిక ఆత్మే ఉద్దేశించబడింది; మూలంలో లేని అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: వారు నమోదు చేయబడినవారిలో ఉన్నారు
  rationale: כְּתֻבִים అక్షరార్థంగా ‘వ్రాయబడినవారు/నమోదైనవారు.’ పెద్దల జాబితాలో వారి పేర్లు ఉన్నాయనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తూ, అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: కానీ గుడారం దగ్గరికి వెళ్లలేదు
  rationale: దిశాసూచక -ה గుడారం వైపు కదలికను సూచిస్తుంది. ‘వెళ్లలేదు’ సహజమైన తెలుగులో ఆ భావాన్ని అందిస్తుంది; గుడారం ఏదో ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: וַיִּתְנַבְּאוּ
  choice: ప్రవచించారు
  rationale: נבא యొక్క హిత్పయేల్ రూపం ఇక్కడ ప్రవచనాత్మకంగా మాట్లాడడాన్ని సూచిస్తుంది. ఆరంభ భావాన్ని అనవసరంగా చేర్చకుండా నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: הָרוּחַను సాధారణ ‘ఆత్మ’గా అర్థం చేసుకోవాలా, దైవిక ఆత్మగా అర్థం చేసుకోవాలా
  choice: ఆత్మ
  alternative: దేవుని ఆత్మ
  rationale: సమీప సందర్భంలో మోషే మీద ఉన్న ఆత్మ పెద్దల మీద నిలిచి ప్రవచన శక్తినిస్తుంది కాబట్టి దైవిక ఆత్మే సూచితం. అయితే ఈ వచనంలో ‘దేవుని’ అనే పదం ప్రత్యక్షంగా లేనందున ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అని మాత్రమే ఉంచి, సందర్భంలోని సూచనను నిలిపాం.
- issue: הָאֹהֱלָהను ‘సన్నిధి గుడారం దగ్గరికి’ అని స్పష్టీకరించాలా
  choice: గుడారం దగ్గరికి
  alternative: సన్నిధి గుడారం దగ్గరికి
  rationale: సందర్భం సన్నిధి గుడారాన్నే బలంగా సూచించినా, ఈ వచనంలోని హీబ్రూ ‘గుడారం’ అని మాత్రమే చెబుతుంది. కాబట్టి ప్రధాన పాఠ్యం మూలంలోని పరిమితిని కాపాడి, సందర్భ గుర్తింపును పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘రెండవవారు,’ ‘ఆత్మ,’ ‘గుడారం’ వంటి ఉద్దేశపూర్వక పరిమితులు, సందిగ్ధతలు నిలుపబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
