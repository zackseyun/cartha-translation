source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: te
  text: మాంసం ఇంకా వారి పళ్ల మధ్య ఉండగానే, అది పూర్తిగా తినబడకముందే[a], యహ్వే కోపం ప్రజల మీద రగులుకుంది, మరియు యహ్వే ప్రజలను అత్యంత తీవ్రమైన తెగులుతో దెబ్బతీశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అది నరికివేయబడకముందే” లేదా “తొలగించబడకముందే”; ఈ సందర్భంలో మాంసం పూర్తిగా తినబడకముందనే భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: మాంసం
  rationale: పిట్టల మాంసాన్ని ఆహారంగా తింటున్న సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: ఇంకా వారి పళ్ల మధ్య ఉండగానే
  rationale: మాంసం ఇంకా మింగబడలేదనే హీబ్రూ వాక్యంలోని సజీవ దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: טֶרֶם יִכָּרֵת
  choice: అది పూర్తిగా తినబడకముందే
  rationale: כרת నిఫాల్ రూపానికి అక్షరార్థం ‘తొలగించబడడం/నరికివేయబడడం’; భోజన సందర్భంలో మాంసం పూర్తికాకముందనే భావాన్ని సహజంగా తెలియజేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וְאַף יְהוָה חָרָה
  choice: యెహోవా కోపం ... రగులుకుంది
  rationale: దైవకోపం మండడాన్ని సూచించే హీబ్రూ రూపకాన్ని మృదువుచేయకుండా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: וַיַּךְ
  choice: దెబ్బతీశాడు
  rationale: తీర్పు సందర్భంలో נכה తెలిపే బలమైన ‘కొట్టడం/దెబ్బతీయడం’ భావాన్ని ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: అత్యంత తీవ్రమైన తెగులు
  rationale: సమూహంపై వచ్చిన ఘోరమైన దైవిక విపత్తును ‘తెగులు’ స్పష్టంగా తెలియజేస్తుంది; רבה מאד దాని అసాధారణ తీవ్రతను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని రెండుసార్లు వాడుతుంది; దానిని బిరుదుగా మార్చకుండా నిలుపబడింది.
- issue: దైవకోపానికి సంబంధించిన మానవరూప భావవ్యక్తీకరణ
  choice: యెహోవా కోపం ప్రజల మీద రగులుకుంది
  alternative: యెహోవా ప్రజలపై కోపగించాడు
  rationale: חרה אף లోని మండే కోపం అనే రూపకాన్ని నిలుపుతూ, తీర్పు తీవ్రతను మృదువుచేయలేదు.
- issue: మכה యొక్క స్వరూపం
  choice: తెగులు
  alternative: గొప్ప దెబ్బ / విపత్తు
  rationale: మכה పదానికి ‘దెబ్బ’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, ప్రజల సమూహంపై వచ్చిన ఘోరమైన శిక్ష సందర్భంలో ‘తెగులు’ సహజం; వ్యాధి స్వరూపాన్ని దీనికంటే నిర్దిష్టంగా ఊహించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, దైవతీర్పు తీవ్రతను నిలిపేలా గౌరవప్రదమైనదిగానూ రూపొందించబడింది. చిన్న, స్పష్టమైన రెండు వాక్యాలు ఉపయోగించబడ్డాయి.
