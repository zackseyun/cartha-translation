source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: te
  text: అప్పుడు మోషే బయటికి వెళ్లి, యాహ్వే మాటలను ప్రజలకు చెప్పాడు. అతడు ప్రజల పెద్దలలోనుంచి డెబ్బై మంది పురుషులను సమకూర్చి, వారిని గుడారం[a] చుట్టూ నిలబెట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఆ గుడారం.’ సందర్భాన్ని బట్టి ఇది సన్నిధి గుడారాన్ని సూచిస్తుండవచ్చు.
    reason: cross_reference
  - marker: b
    text: లేదా ‘వారిని అక్కడ ఉంచాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘వారిని నిలబడేలా చేశాడు’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא అనే క్రియ ఇంతకుముందున్న స్థలం నుంచి బయటికి వెళ్లడాన్ని సూచిస్తుంది. ‘బయటికి వెళ్లి’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: యాహ్వే మాటలను ప్రజలకు చెప్పాడు
  rationale: మూలంలోని ‘యాహ్వే మాటలు’ అనే నిర్దిష్ట పదబంధాన్ని నిలిపి ఉంచుతూ, דבר אֶל యొక్క భావాన్ని తెలుగులో సహజంగా ‘ప్రజలకు చెప్పాడు’ అని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చి
  rationale: אסף ఇక్కడ వ్యక్తులను ఒకచోట చేర్చడాన్ని సూచిస్తుంది; ‘సమకూర్చి’ ఆ ఉద్దేశపూర్వక సమీకరణను సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבְעִים אִישׁ
  choice: డెబ్బై మంది పురుషులను
  rationale: אִישׁ పురుషులను సూచిస్తుంది; సందర్భంలో వీరు ప్రజల పెద్దలలోనుంచి ఎంపికైన పురుషులు కాబట్టి లింగసూచనను నిలిపింది.
- source_word: מִזִּקְנֵי הָעָם
  choice: ప్రజల పెద్దలలోనుంచి
  rationale: זִקְנֵי అనేది కేవలం వృద్ధులను కాక సమాజంలో గుర్తింపు పొందిన పెద్దలను సూచిస్తుంది; מִן యొక్క భాగార్థాన్ని ‘లోనుంచి’ నిలిపింది.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: వారిని … నిలబెట్టాడు
  rationale: עמד యొక్క హిఫిల్ రూపం అక్షరార్థంగా ‘నిలబడేలా చేశాడు’ అని అర్థం. ‘నిలబెట్టాడు’ ఆ కారణార్థాన్ని తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: గుడారం చుట్టూ
  rationale: సెబీబోత్ ‘చుట్టూ’ అని, హాఓహెల్ అక్షరార్థంగా ‘ఆ గుడారం’ అని సూచిస్తాయి. సందర్భాన్ని బట్టి ఇది సన్నిధి గుడారం అయినప్పటికీ, మూలంలో పూర్తి పదబంధం లేదు కాబట్టి ప్రధాన పాఠ్యంలో ‘గుడారం’ ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: שִׁבְעִים אִישׁ లోని లింగసూచన
  choice: డెబ్బై మంది పురుషులు
  alternative: డెబ్బై మంది
  rationale: אִישׁ వ్యాకరణపరంగానూ సందర్భపరంగానూ పురుషులను సూచిస్తుంది. అందువల్ల మూలంలోని లింగసూచనను తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్యనిర్మాణంలో కలిపినా, సంఘటనల క్రమం మరియు కారణార్థక క్రియను నిలిపాం.
