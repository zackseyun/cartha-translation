lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: అతడు ఆ చోటికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ సూత్రంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; కర్తను మూలపాఠంలాగే ‘అతడు’గా ఉంచుతుంది.
- source_word: תַּבְעֵרָה
  choice: తబేరా
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, దానికి בער (‘మండు/కాలిపోవు’) అనే ధాతువుతో ఉన్న పదప్రయోగ సంబంధాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నామకరణానికి కారణాన్ని తెలిపే స్పష్టమైన ఆధునిక తెలుగు కారణసూచక పదం.
- source_word: בָעֲרָה
  choice: మండింది
  rationale: అగ్ని నిరంతరంగా లేదా తీవ్రంగా కాలుతున్న భావాన్ని సహజంగా ఇస్తూ, తబేరా పేరుతో ఉన్న ధ్వని-అర్థ సంబంధాన్ని ప్రతిబింబిస్తుంది.
- source_word: בָם
  choice: వారి మధ్య
  rationale: సమాజం లేదా శిబిరం మధ్య అగ్ని మండిందనే సందర్భోచిత భావాన్ని ఇస్తుంది; ‘వారిలో’ అని అనువదిస్తే కలగగల అంతర్గత దహన భావాన్ని నివారిస్తుంది.
- source_word: אֵשׁ יְהוָה
  choice: యెహోవా అగ్ని
  rationale: హీబ్రూ సంబంధపదబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, దేవుని వ్యక్తిగత నామమైన יהוהను తెలుగులో స్థిరంగా ‘యెహోవా’గా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచుతుంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ సుపరిచితమైన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు మరింత సమీపమైన ప్రత్యామ్నాయం.
- issue: אֵשׁ יְהוָה యొక్క సంబంధం
  choice: యెహోవా అగ్ని
  alternative: యెహోవా నుండి వచ్చిన అగ్ని
  rationale: మూలంలోని construct సంబంధాన్ని యథాతథంగా ఉంచి, అది స్వామ్యమా, మూలమా, తీర్పు కార్యమా అనే భావాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ పదప్రయోగాన్ని పాదసూచిక ద్వారా నిలిపి, ప్రధాన వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
