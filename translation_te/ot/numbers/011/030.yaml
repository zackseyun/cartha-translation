source:
  edition: WLC
  text: וַ/יֵּאָסֵ֥ף מֹשֶׁ֖ה אֶל הַֽ/מַּחֲנֶ֑ה ה֖וּא וְ/זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: te
  text: అప్పుడు మోషే, ఇశ్రాయేలు పెద్దలతో కలిసి, శిబిరానికి తిరిగి వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత పదశఃగా, ‘మోషే శిబిరానికి తిరిగి సమకూర్చబడ్డాడు,’ అని అనువదించవచ్చు. హీబ్రూ క్రియ నిష్క్రియ రూపంలో ఉంది; అయితే ఈ సందర్భంలో దాని భావం మోషే ఇశ్రాయేలు పెద్దలతో కలిసి శిబిరానికి తిరిగి వెళ్లాడనే దే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: తిరిగి వెళ్లాడు
  rationale: אסף ధాతువు నిఫాల్ రూపంలో ఇక్కడ ముందటి సంఘటన జరిగిన స్థలం నుంచి శిబిరానికి మళ్లీ వెళ్లడాన్ని సందర్భానుసారంగా సూచిస్తుంది. పదశః నిష్క్రియార్థం కంటే ‘తిరిగి వెళ్లాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֶל הַמַּחֲנֶה
  choice: శిబిరానికి
  rationale: אֶל అనే దిశాసూచక అవ్యయాన్ని నేరుగా ‘-కి’తో, מַחֲנֶהను ‘శిబిరం’గా అనువదించడం సహజమైనది; ‘శిబిరంలోకి’ కూడా సాధ్యమే గాని కొద్దిగా ఎక్కువ వ్యాఖ్యానాత్మకం.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: మోషే ఇశ్రాయేలు పెద్దలతో కలిసి
  rationale: హీబ్రూ వాక్యనిర్మాణం మోషే మరియు పెద్దలు కలిసి తిరిగి వెళ్లారని స్పష్టం చేస్తుంది. తెలుగులో ‘తో కలిసి’ అనే రూపం ఆ సహగమన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యేక సర్వనామాన్ని పునరావృతం చేయడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: ఇది హీబ్రూ సమాస నిర్మాణానికి స్పష్టమైన, సాధారణ బైబిలు తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ క్రియలోని పదశః నిష్క్రియ/సమకూర్చబడే ఛాయను పాదసూచికలో నిలిపి, ప్రధాన పాఠ్యంలో సందర్భార్థాన్ని ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
