  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: te
  text: అప్పుడు ప్రజలు మోషేకు మొరపెట్టుకున్నారు. మోషే యాహ్వేకు ప్రార్థించగా, అగ్ని తగ్గిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్ని అణిగిపోయింది” లేదా “అగ్ని దిగిపోయింది.” హీబ్రూ క్రియ అగ్ని తగ్గి అణిగిందనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: మొరపెట్టుకున్నారు
  rationale: צעק ఆపదలో సహాయం కోసం చేసే అత్యవసరమైన మొరను సూచిస్తుంది. సందర్భానికి అనుగుణంగా ‘మొరపెట్టుకున్నారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עם ఇక్కడ ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజమైన సమానార్థకం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేకు
  rationale: אֶל ఒక వ్యక్తివైపు ఉద్దేశించిన మొరను సూచిస్తుంది; తెలుగులో ‘మోషేకు’ సంక్షిప్తంగా, సహజంగా ఆ దిశను తెలియజేస్తుంది.
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థించగా
  rationale: פלל యొక్క హిత్పయేల్ రూపానికి ‘ప్రార్థించు’ ప్రత్యక్ష సమానార్థకం. సందర్భంలో మధ్యవర్తిత్వం భావం ఉన్నా, దాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
- source_word: וַתִּשְׁקַע
  choice: తగ్గిపోయింది
  rationale: שקע యొక్క మూలభావం దిగిపోవడం లేదా అణగడం. అగ్ని క్రమంగా తగ్గి అణిగిందనే భావాన్ని ఆధునిక తెలుగులో ‘తగ్గిపోయింది’ సహజంగా వ్యక్తపరుస్తుంది; పూర్తిగా ఆర్పివేయబడిందని అవసరానికి మించి నిర్ధారించదు.
- source_word: הָאֵשׁ
  choice: అగ్ని
  rationale: אשׁకు ప్రత్యక్ష సమానార్థకం ‘అగ్ని’; ఇది ముందటి సందర్భంలో పేర్కొన్న అగ్నినే సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’కు దగ్గరైన రూపాన్ని నిలుపుకోవడానికి ‘యాహ్వే’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలను సహజమైన తెలుగు వాక్యనిర్మాణంతో తెలిపి, అగ్ని పూర్తిగా ఆరిపోయిందా అనే అంశాన్ని పాఠ్యంలో నిర్ణయించకుండా ఉంచబడింది.
