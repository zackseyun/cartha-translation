source:
  edition: WLC
  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: te
  text: ఏ మనిషి మృతదేహాన్నైనా తాకినవాడు ఏడు రోజులు అపవిత్రుడిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చనిపోయిన ఏ వ్యక్తినైనా తాకినవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: తాకినవాడు
  rationale: నిర్దేశక ఉపపదంతో ఉన్న కృదంతం సాధారణ నియమానికి లోబడే ఎవరినైనా సూచిస్తుంది; తెలుగులో ‘తాకినవాడు’ సహజంగా ఆ న్యాయపరమైన సాధారణ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּמֵת
  choice: మృతదేహాన్ని
  rationale: מֵת అక్షరార్థంగా చనిపోయిన వ్యక్తిని సూచిస్తుంది; ఈ ఆచారపరమైన సందర్భంలో ‘మృతదేహం’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: మనిషి
  rationale: ఈ పదబంధం ఏ మానవుని మృతదేహమైనా అనే పరిధిని తెలియజేస్తుంది. ఇక్కడ אָדָם పురుషుణ్ణి మాత్రమే కాక మానవుని సాధారణంగా సూచిస్తుంది; తెలుగులో ‘మనిషి మృతదేహం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: సంయోజకంతో వచ్చిన క్రియారూపం తాకడం వల్ల కలిగే ఆచారపరమైన స్థితిని తెలియజేస్తుంది. ‘అపవిత్రుడిగా ఉంటాడు’ ఆ స్థితి ఏడు రోజులపాటు కొనసాగుతుందని స్పష్టంగా చెబుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: కాలవ్యవధిని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన సాధారణ సందర్భంలో אָדָם అనువాదం
  choice: మనిషి
  alternative: పురుషుడు; మానవుడు
  rationale: ఇక్కడ మూలపదం లింగపరంగా పురుషుణ్ణి మాత్రమే సూచించదు; ఏ మానవ వ్యక్తినైనా సూచిస్తుంది. ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఆ సాధారణ మానవార్థాన్ని తెలియజేస్తుంది.
- issue: טָמֵא సూచించే అపవిత్రత స్వభావం
  choice: అపవిత్రుడిగా ఉంటాడు
  alternative: అశుద్ధుడవుతాడు
  rationale: ఈ సందర్భం ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది, నైతిక దోషాన్ని కాదు. సాధారణ బైబిలు వాడుకకు అనుగుణంగా ‘అపవిత్రుడు’ను ఉంచి, వాక్యంలో అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన న్యాయవాక్య శైలిని ఉపయోగించాం. ‘మృతదేహం’ సామాన్య పాఠకులకు స్పష్టంగా ఉండగా, మూలంలోని ‘చనిపోయిన వ్యక్తి’ భావాన్ని పాదసూచికలో నిలిపాం.
