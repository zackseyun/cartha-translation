id: NUM.19.12
reference: Numbers 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: te
  text: అతడు మూడో రోజున, ఏడో రోజున దానితో తనను తాను శుద్ధి చేసుకోవాలి[a]; అప్పుడు అతడు శుద్ధుడవుతాడు. అయితే అతడు మూడో రోజున, ఏడో రోజున తనను తాను శుద్ధి చేసుకోకపోతే[b], అతడు శుద్ధుడు కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఈ అధ్యాయంలో ముందుగా సిద్ధం చేసిన అపవిత్రత తొలగించే నీటితో.
    reason: cross_reference
  - marker: b
    text: ‘తనను తాను శుభ్రపరచుకోకపోతే’ అని కూడా అనువదించవచ్చు. ఇక్కడి హెబ్రీ క్రియ అపవిత్రత నుంచి ఆచారపరంగా శుద్ధి పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: తనను తాను శుద్ధి చేసుకోవాలి / చేసుకోకపోతే
  rationale: హిత్పయేల్ రూపం ఈ ఆచార సంబంధ సందర్భంలో పాపక్షమాపణను కాక అపవిత్రత నుంచి ఆచారపరంగా శుద్ధి పొందడాన్ని సూచిస్తుంది. ప్రతికర్తృక భావాన్ని ‘తనను తాను’ నిలుపుతుంది.
- source_word: בּוֹ
  choice: దానితో
  rationale: ఈ సర్వనామం ముందుగా సిద్ధం చేసిన అపవిత్రత తొలగించే నీటిని సూచిస్తుంది. మూలంలోని సర్వనామ సూచనను ప్రధాన పాఠ్యంలో అతిగా వివరించకుండా నిలిపి, పాదసూచికలో దాని సంబంధాన్ని స్పష్టం చేశాం.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడో రోజున
  rationale: తెలుగులో సహజమైన కాలసూచక రూపం; హెబ్రీ క్రమసంఖ్యను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ఏడో రోజున
  rationale: శుద్ధీకరణ ఆచారంలోని రెండవ నిర్ణీత దినాన్ని సహజంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: יִטְהָר
  choice: అతడు శుద్ధుడవుతాడు
  rationale: ఈ క్రియ శుద్ధీకరణ చర్య అనంతరం కలిగే శుద్ధ స్థితిని తెలుపుతుంది. అందువల్ల יִתְחַטָּאకు వాడిన ‘శుద్ధి చేసుకోవాలి’ అనే చర్యాభావం నుంచి ఫలిత స్థితిని వేరు చేశాం.
- source_word: וְאִם לֹא
  choice: అయితే ... చేసుకోకపోతే
  rationale: వ్యతిరేక షరతును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ హెచ్చరిక ధోరణిని నిలుపుతుంది.
- source_word: הוּא
  choice: అతడు
  rationale: హెబ్రీలోని స్పష్టమైన పుంలింగ ఏకవచన సర్వనామాన్ని నిలుపుతుంది; సందర్భంలో ఇది అపవిత్రుడైన వ్యక్తిని సూచిస్తుంది.
theological_decisions:
- issue: సంఖ్యాకాండము 19లోని శుద్ధీకరణ భాష స్వభావం
  choice: వాక్యాన్ని ఆచారపరమైన అపవిత్రత నుంచి శుద్ధి పొందడం, శుద్ధ స్థితిలో ఉండడం అనే భావాలతో అనువదించాం.
  alternative: నైతిక పాపక్షమాపణ లేదా అంతరంగ పరిశుద్ధీకరణను సూచించే సాధారణ ఆధ్యాత్మిక భాషను ఉపయోగించడం.
  rationale: సందర్భం మృతదేహం వల్ల కలిగే అపవిత్రతకు, నిర్దేశించిన శుద్ధీకరణ నీటికి సంబంధించినది. కాబట్టి మూలంలోని ఆచారపరమైన అర్థానికి మించి నైతిక లేదా తదనంతర సిద్ధాంత భావాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘శుద్ధి చేసుకోవాలి’ చర్యను, ‘శుద్ధుడవుతాడు/శుద్ధుడు కాడు’ ఫలితమైన ఆచార స్థితిని వేరు చేస్తాయి. మూలంలోని పుంలింగ ఏకవచన సూచనను నిలిపాం; రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
