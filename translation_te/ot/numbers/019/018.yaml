revisions:
- from: అప్పుడు శుద్ధుడైన ఒక పురుషుడు హిస్సోపు కొమ్మను తీసుకొని, దానిని ఆ నీటిలో ముంచి, ఆ గుడారం మీద, అందులోని వస్తువులన్నిటి మీద, అక్కడ ఉన్న వ్యక్తుల మీద, అలాగే ఎముకనైనా, హతమైనవాని శవాన్నైనా[a], చనిపోయిన వ్యక్తినైనా, సమాధినైనా తాకినవాని మీద ఆ నీటిని చిలకరించాలి.
  to: అప్పుడు ఆచారశుద్ధిగల ఒక మనిషి హిస్సోపును తీసుకొని, దానిని ఆ నీటిలో ముంచి, ఆ గుడారంమీద, పాత్రలన్నిటిమీద, అక్కడ ఉన్న వ్యక్తులమీద, అలాగే ఎముకనో, హతమైనవాని శవాన్నో[a], మృతునినో, సమాధినో తాకిన వ్యక్తిమీద చిలకరించాలి.
  rationale: మూలంలో లేని ‘కొమ్మ’ను తొలగించాం; పాత్రలు అనే పదంతో כֵּלִים అర్థాన్ని మరింత ఖచ్చితంగా ఇచ్చాం. ఆచారపరమైన శుద్ధతను స్పష్టంగా తెలియజేసి, తాకిన వస్తువుల జాబితాను సహజమైన ఆధునిక తెలుగు నిర్మాణంలో ఉంచాం. ఆంగ్ల POBలో ఉన్న חָלָל/מֵת వ్యత్యాసం మరియు సంబంధిత పాదటిప్పణిని నిలిపాం.
