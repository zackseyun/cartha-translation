id: NUM.19.18
reference: Numbers 19:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: te
  text: అప్పుడు ఆచారశుద్ధిగల ఒక మనిషి హిస్సోపును తీసుకొని, దానిని ఆ నీటిలో ముంచి, ఆ గుడారంమీద, పాత్రలన్నిటిమీద, అక్కడ ఉన్న వ్యక్తులమీద, అలాగే ఎముకనో, హతమైనవాని శవాన్నో[a], మృతునినో, సమాధినో తాకిన వ్యక్తిమీద చిలకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హతమైనవానిని.’ ఈ హీబ్రూ పదం ప్రత్యేకంగా హింసాత్మకంగా చంపబడిన వ్యక్తిని సూచిస్తుంది; తరువాత వచ్చే సాధారణ ‘మృతుడు’ అనే పదానికి ఇది భిన్నం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: హిస్సోపు కొమ్మ
  rationale: ఆచారపరమైన శుద్ధీకరణలో నీటిని చిలకరించడానికి ఉపయోగించే మొక్కను సూచిస్తుంది. తెలుగు పాఠకునికి చర్య స్పష్టంగా ఉండేందుకు సంప్రదాయ వృక్షనామంతో పాటు ‘కొమ్మ’ అని ఇచ్చాం.
- source_word: בַּמַּיִם
  choice: ఆ నీటిలో
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉంది; సందర్భంలో ముందుగా సిద్ధం చేసిన అపవిత్రతను తొలగించే నీటినే సూచిస్తుంది.
- source_word: אִישׁ טָהוֹר
  choice: శుద్ధుడైన ఒక పురుషుడు
  rationale: ఆచారపరమైన శుద్ధతను సూచించేందుకు ‘శుద్ధుడు’ వాడాం; హీబ్రూ ఏకవచన పుంలింగాన్ని ‘ఒక పురుషుడు’గా నిలిపాం.
- source_word: וְהִזָּה
  choice: చిలకరించాలి
  rationale: శుద్ధీకరణ నీటిని బిందువులుగా చల్లే ఆచారక్రియకు సహజమైన ఆధునిక తెలుగు పదం.
- source_word: הָאֹהֶל
  choice: ఆ గుడారం
  rationale: ఇది ప్రత్యక్ష సందర్భంలో మరణం సంభవించిన గుడారాన్ని సూచిస్తుంది; ప్రత్యక్ష గుడారాన్ని కాదు.
- source_word: הַכֵּלִים
  choice: వస్తువులన్నిటి
  rationale: כְּלִי పాత్రలు, పనిముట్లు, సామగ్రి వంటి విస్తృత అర్థం కలది; ‘వస్తువులు’ సందర్భానికి సహజంగా ఆ పరిధిని నిలుపుతుంది.
- source_word: הַנְּפָשׁוֹת
  choice: వ్యక్తులు
  rationale: ఇక్కడ ‘ప్రాణాలు/ఆత్మలు’ అనే మానవశాస్త్రీయ భావం కాకుండా గుడారంలో ఉన్న మనుషులను సూచిస్తుంది.
- source_word: הַנֹּגֵעַ
  choice: తాకినవాని
  rationale: హీబ్రూ substantival participle‌ను సహజమైన ఏకవచన వ్యక్తి సూచనగా అనువదించాం.
- source_word: בָּעֶצֶם
  choice: ఎముకను
  rationale: మృతదేహ సంబంధ అపవిత్రత కలిగించే మానవ ఎముక భావం సందర్భం ద్వారా స్పష్టమవుతుంది; హీబ్రూ ఏకవచనం నిలిపాం.
- source_word: בֶחָלָל
  choice: హతమైనవాని శవాన్ని
  rationale: חָלָל హింసాత్మకంగా చంపబడిన వ్యక్తిని లేదా అతని దేహాన్ని సూచిస్తుంది; తరువాతి సాధారణ מֵת పదంతో తేడాను నిలిపాం.
- source_word: בַמֵּת
  choice: చనిపోయిన వ్యక్తిని
  rationale: హతమైనవానికే పరిమితం కాని సాధారణ మృత వ్యక్తిని సూచించే విస్తృత పదంగా అనువదించాం.
- source_word: בַקָּבֶר
  choice: సమాధిని
  rationale: పాతిపెట్టే స్థలాన్ని సూచించే సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధత పదజాలం
  choice: శుద్ధుడైన
  alternative: పవిత్రుడైన
  rationale: వచనం నైతిక పవిత్రత గురించి కాకుండా మృతదేహ సంపర్కం వల్ల కలిగే ఆచారపరమైన అపవిత్రత గురించి మాట్లాడుతుంది; ‘శుద్ధుడు’ ఆ తేడాను మెరుగ్గా నిలుపుతుంది.
- issue: אִישׁ లోని పుంలింగ సూచన
  choice: ఒక పురుషుడు
  alternative: ఒక వ్యక్తి
  rationale: మూలంలోని ఏకవచన పుంలింగాన్ని స్పష్టంగా నిలిపాం; పాత్రకు అవసరమైన ప్రధాన అర్హత ఆచారపరమైన శుద్ధతేనని సందర్భం తెలియజేస్తుంది.
- issue: חָלָל మరియు מֵת మధ్య తేడా
  choice: హతమైనవాని శవం / చనిపోయిన వ్యక్తి
  alternative: శవం / మృతదేహం
  rationale: మొదటి పదంలోని హింసాత్మక మరణ భావాన్ని, రెండవ పదంలోని సాధారణ మరణ భావాన్ని సమతలీకరించకుండా వేరు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ఆచారపరమైన శుద్ధతను నైతిక పవిత్రతగా మార్చకుండా చూసాం. జాబితాలోని సమాంతర నిర్మాణాన్ని ‘-నైనా’ రూపాలతో సహజంగా నిలిపాం.
