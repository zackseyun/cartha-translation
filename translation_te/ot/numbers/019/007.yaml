id: NUM.19.7
reference: Numbers 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: te
  text: అప్పుడు యాజకుడు తన బట్టలు ఉతుక్కొని, తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి. ఆ తరువాత అతడు శిబిరంలోకి రావచ్చు[a]. అయితే యాజకుడు సాయంకాలం వరకు ఆచారపరంగా అపవిత్రుడిగా ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిబిరంలోకి వస్తాడు.” హెబ్రీ క్రియారూపం కడుక్కున్న తరువాత జరిగే తదుపరి చర్యను లేదా అనుమతించబడిన పునఃప్రవేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “అపవిత్రుడు” అనేది ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది; అది తప్పనిసరిగా వ్యక్తిగత పాపాన్నో నైతిక దోషాన్నో సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: כּבס పీయేల్ రూపం బట్టలను ఉతకడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బట్టలు ఉతుక్కొని’ సహజంగా ఉండి, కర్మకాండ సంబంధమైన ఆదేశక్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఇశ్రాయేలు ఆరాధనా, ధర్మశాస్త్ర సందర్భంలో כֹּהֵן‌కు ప్రామాణికమైన తెలుగు పదం.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి
  rationale: בָּשָׂר ఇక్కడ ‘మాంసం’ కంటే మొత్తం శరీరాన్ని సూచిస్తుంది. רחץ‌ను ‘కడుక్కోవాలి’గా ఇవ్వడం పూర్తి శరీర శుద్ధిస్నానాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: కర్మకాండలో చర్యల క్రమాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: శిబిరంలోకి రావచ్చు
  rationale: కడుక్కున్న తరువాత తిరిగి ప్రవేశించడానికి అనుమతి ఉన్న భావాన్ని సందర్భం బలపరుస్తుంది; అయినా హెబ్రీ క్రియారూపం ‘వస్తాడు/రావాలి’ అనే పఠనానికీ వీలు ఇస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְטָמֵא
  choice: ఆచారపరంగా అపవిత్రుడిగా ఉంటాడు
  rationale: טמא ఇక్కడ నైతిక దోషాన్ని కాదు, కర్మకాండ సంబంధమైన తాత్కాలిక అపవిత్ర స్థితిని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘ఆచారపరంగా’ చేర్చడం ఆధునిక పాఠకుడి అపార్థాన్ని నివారిస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ఆచారపరమైన అపవిత్రత
  alternative: నైతిక అపవిత్రత లేదా వ్యక్తిగత పాపదోషం
  rationale: సంఖ్యాకాండము 19 సందర్భంలో ఇది శుద్ధీకరణ కర్మలో పాల్గొనడం వల్ల కలిగే తాత్కాలిక ఆచారస్థితి; వ్యక్తిగత పాపం లేదా నైతిక తప్పు అని పాఠ్యం చెప్పదు.
- issue: శిబిరంలోకి ప్రవేశం యొక్క విధి
  choice: కడుక్కున్న తరువాత ప్రవేశించవచ్చు
  alternative: అతడు శిబిరంలోకి వస్తాడు/రావాలి
  rationale: అసంపూర్ణ క్రియారూపం ప్రక్రియలో తదుపరి చర్యను సూచించగలదు; సందర్భంలో అనుమతించబడిన పునఃప్రవేశ భావం సముచితం. రూపంలోని స్వల్ప విధ్యర్థ అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘వస్త్రాలు’ కంటే సాధారణ పాఠకునికి సహజమైన ‘బట్టలు’, ‘దేహం’ కంటే ‘శరీరం’, ‘సంధ్యాకాలం’ కంటే ‘సాయంకాలం’ ఎంచుకున్నాం. ప్రధాన పాఠ్యం స్పష్టంగా ఉండేలా చేసి, హెబ్రీ విధ్యర్థ అస్పష్టతను పాదసూచికలో నిలిపాం.
