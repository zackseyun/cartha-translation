id: NUM.19.22
reference: Numbers 19:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: te
  text: అపవిత్రమైన వ్యక్తి తాకినదంతా అపవిత్రమవుతుంది; దానిని తాకిన వ్యక్తి సాయంత్రం వరకు అపవిత్రంగా ఉంటాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: తాకినదంతా
  rationale: כֹל אֲשֶׁר యొక్క సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִגַּע בּוֹ
  choice: తాకిన
  rationale: נגע మరియు בּוֹ కలిపి ఇక్కడ ప్రత్యక్ష శారీరక సంపర్కాన్ని సూచిస్తాయి; తెలుగులో ‘తాకిన’ సహజంగా ఉంది.
- source_word: הַטָּמֵא
  choice: అపవిత్రుడైన వ్యక్తి
  rationale: విశేషణం వ్యక్తిని సూచించే నామవాచకంగా వాడబడింది. ‘వ్యక్తి’ అని స్పష్టం చేయడం తెలుగులో సందిగ్ధతను తగ్గిస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రమవుతుంది
  rationale: సంపర్కం వల్ల అపవిత్ర స్థితిలోకి రావడాన్ని ఈ క్రియ సూచిస్తుంది.
- source_word: וְהַנֶּפֶשׁ
  choice: వ్యక్తి
  rationale: నֶפֶשׁ ఇక్కడ ‘ఆత్మ’ అనే విడివిడి భాగాన్ని కాక, సంపూర్ణ వ్యక్తిని సూచించే ధర్మశాస్త్ర సంబంధ వాడుక.
- source_word: הַנֹּגַעַת
  choice: దానిని తాకే
  rationale: స్త్రీలింగ ఏకవచన కృదంతం נֶפֶשׁతో ఏకీభవిస్తుంది; ముందున్న అపవిత్రమైన దానినే ‘దానిని’ సూచిస్తుంది.
- source_word: תִּטְמָא
  choice: అపవిత్రుడై ఉంటాడు
  rationale: తాకిన వ్యక్తి పొందే అపవిత్ర స్థితిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: కాలపరిమితిని తెలిపే హీబ్రూ పదబంధానికి సూటిగా, సహజంగా సరిపోతుంది.
theological_decisions:
- issue: ఆచార సంబంధ అపవిత్రత స్వభావం
  choice: טמא పదకుటుంబాన్ని ‘అపవిత్రం’గా అనువదించడం
  alternative: ‘కలుషితం’ లేదా ‘పాపభరితం’
  rationale: ఈ వచనం సంపర్కం ద్వారా సంక్రమించే ఆచార సంబంధ అపవిత్రతను వివరిస్తుంది; అది తప్పనిసరిగా నైతిక పాపదోషాన్ని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర శైలికి తగిన గౌరవప్రదమైన భాషను ఉంచుతూ, సాధారణ పాఠకుడికి అర్థమయ్యే సరళ వాక్య నిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలోని రెండు వరుస ఫలితాలను అర్ధవిరామంతో కలిపాం.
