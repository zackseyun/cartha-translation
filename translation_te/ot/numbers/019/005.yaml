  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׂרַ֥ף אֶת הַ/פָּרָ֖ה לְ/עֵינָ֑י/ו אֶת עֹרָ֤/הּ וְ/אֶת בְּשָׂרָ/הּ֙ וְ/אֶת דָּמָ֔/הּ עַל פִּרְשָׁ֖/הּ יִשְׂרֹֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: te
  text: అతని కళ్ల ఎదుట ఆ ఆవును కాల్చాలి; దాని చర్మాన్ని, మాంసాన్ని, రక్తాన్ని, దాని పేడతో సహా కాల్చాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: అతడు ... కాల్చాలి
  rationale: విధివిధానాల క్రమంలో వచ్చిన waw + qatal రూపానికి ఆజ్ఞాత్మక భావం ఉంది. ఆధునిక తెలుగు ధర్మశాస్త్ర శైలిలో ‘కాల్చాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַפָּרָה
  choice: ఆ ఆవు
  rationale: פָּרָה ఆడ పశువును సూచిస్తుంది. ‘ఆవు’ తెలుగులో దాని లింగాన్ని సహజంగానే స్పష్టం చేస్తుంది; ఈ పదం స్వతహాగా చిన్న వయస్సును తప్పనిసరిగా సూచించదు.
- source_word: לְעֵינָיו
  choice: అతని కళ్ల ఎదుట
  rationale: ‘అతని కళ్లకు/కళ్ల ఎదుట’ అనే హీబ్రూ నుడికారంలోని దృశ్య స్పష్టతను నిలుపుతూ, అతని సమక్షంలోనే కార్యం జరగాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: עֹרָהּ
  choice: దాని చర్మాన్ని
  rationale: עוֹר అంటే జంతువు యొక్క చర్మం. ‘చర్మం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: בְּשָׂרָהּ
  choice: మాంసాన్ని
  rationale: בָּשָׂרకు ఈ జంతుబలి సందర్భంలో ‘మాంసం’ సహజమైన ప్రత్యక్ష సమానం.
- source_word: דָּמָהּ
  choice: రక్తాన్ని
  rationale: דָּםకు ప్రత్యక్షమైన తెలుగు సమానం ‘రక్తం’.
- source_word: עַל פִּרְשָׁהּ
  choice: దాని పేడతో సహా
  rationale: פֶּרֶשׁ ప్రత్యేకంగా పేడ లేదా విసర్జిత మలాన్ని సూచిస్తుంది. ఇక్కడ עַל చేర్పు లేదా సహవర్తిత్వ భావంలో ఉండడంతో ‘తో సహా’ జాబితాలో అది కూడా కాల్చబడుతుందని స్పష్టం చేస్తుంది.
- source_word: יִשְׂרֹף
  choice: కాల్చాలి
  rationale: ధర్మశాస్త్ర ఆదేశంలో imperfect రూపం చేయవలసిన కార్యాన్ని సూచిస్తుంది. వాక్యాంతంలో క్రియను మళ్లీ ఉంచడం మూలంలోని పునరుక్తి, ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: కాల్చేవాడు మరియు చూస్తున్న వ్యక్తి మధ్య సర్వనామ సంబంధం
  choice: ‘అతడు అతని కళ్ల ఎదుట’ అని వేర్వేరు సర్వనామ రూపాలతో మూలంలోని సూచనను యథాతథంగా ఉంచడం
  alternative: ‘అతడు తన కళ్ల ఎదుట’ లేదా కర్తలేని ‘అతని కళ్ల ఎదుట ... కాల్చాలి’
  rationale: హీబ్రూలో క్రియకు అంతర్లీనమైన పురుష ఏకవచన కర్త, לְעֵינָיוలోని మూడవ పురుష ఏకవచన సర్వనామం తప్పనిసరిగా ఒకే వ్యక్తిని సూచిస్తాయని వ్యాకరణం నిర్ధారించదు. ‘తన’ అని అనువదిస్తే ఇద్దరినీ ఒకే వ్యక్తిగా అనవసరంగా నిర్ణయించినట్లవుతుంది; కాబట్టి నిజమైన సూచనాత్మక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విధివిధాన శైలి వాడబడింది. మూలంలోని జాబితా క్రమం, వాక్యాంత క్రియా పునరుక్తి నిలుపబడ్డాయి. ‘అతడు అతని’ సాధారణ సంభాషణలో కొంత భారంగా వినిపించినా, మూలంలోని సర్వనామ అస్పష్టతను సిద్ధాంతపరంగా పరిష్కరించకుండా ఉండేందుకు ఉద్దేశపూర్వకంగా వాడబడింది.
