  text: וְ/לָקַ֞ח אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן מִ/דָּמָ֖/הּ בְּ/אֶצְבָּע֑/וֹ וְ/הִזָּ֞ה אֶל נֹ֨כַח פְּנֵ֧י אֹֽהֶל מוֹעֵ֛ד מִ/דָּמָ֖/הּ שֶׁ֥בַע פְּעָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: te
  text: తరువాత యాజకుడైన ఎలియాజరు దాని రక్తంలో కొంతను తన వేలితో తీసుకొని, సమాగమ గుడారం ముందుభాగం వైపు[a] దాని రక్తంలో కొంతను ఏడుసార్లు చల్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాగమ గుడారం ఎదుట.” హెబ్రీ పదబంధం గుడారం ముందుభాగం వైపు ఉన్న దిశను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తరువాత ... తీసుకొని
  rationale: కర్మకాండ ప్రక్రియలో వరుసగా జరిగే తదుపరి ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని యాజక పదవిని సహజమైన తెలుగు విశేషణ నిర్మాణంలో ఉంచుతుంది.
- source_word: מִדָּמָהּ
  choice: దాని రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; మునుపటి సందర్భంలోని ఆవు రక్తమంతా కాక దానిలో కొంత అని సూచిస్తుంది. హెబ్రీ పాఠంలోని పునరుక్తిని రెండుచోట్లా నిలిపింది.
- source_word: בְּאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: בְּ యొక్క సాధనార్థాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది; రక్తాన్ని తీసుకోవడానికి వేలు ఉపయోగించబడిందని సూచిస్తుంది.
- source_word: וְהִזָּה
  choice: చల్లాలి
  rationale: యాజక కర్మకాండలో נזה రక్తాన్ని చల్లడాన్ని సూచిస్తుంది; ఆదేశాత్మక భావాన్ని తెలుగు విధ్యర్థక రూపం తెలియజేస్తుంది.
- source_word: אֶל נֹכַח פְּנֵי
  choice: ముందువైపు దిశగా
  rationale: గుడారం లోపలికి కాక, దాని ముఖభాగం వైపు ఉన్న దిశను సూచించే స్థలార్థాన్ని కాపాడుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు పరిశుద్ధ స్థలానికి సంబంధించిన స్థిరమైన బైబిలు తెలుగు పదబంధం; దేవుడు తన ప్రజలను కలిసే నియమిత గుడారాన్ని సూచిస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: మూలంలోని ఖచ్చితమైన సంఖ్యను నేరుగా నిలుపుతుంది.
