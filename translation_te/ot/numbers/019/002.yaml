  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: te
  text: '“యెహోవా ఆజ్ఞాపించిన ధర్మశాస్త్ర నియమం ఇదే: ఇశ్రాయేలు ప్రజలతో ఇలా చెప్పు: వారు నీ దగ్గరికి పరిపూర్ణమైన ఎర్రని ఆవును తీసుకురావాలి; దానిలో ఏ లోపమూ ఉండకూడదు; దానిపై కాడి మోపబడకూడదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: ధర్మశాస్త్ర నియమం
  rationale: ‘חֻקָּה’ నిర్దేశిత కట్టడ లేదా నియమాన్ని, ‘תּוֹרָה’ ఇక్కడ దేవుని ధర్మశాస్త్రాన్ని సూచిస్తాయి; ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉండేలా రెండింటినీ నిలిపాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఈ సామూహిక సంబోధనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פָרָה אֲדֻמָּה
  choice: ఎర్రని ఆవు
  rationale: ‘פָרָה’ ఆడ పశువును, ‘אֲדֻמָּה’ ఎరుపు రంగును సూచిస్తాయి; మూలంలోని లింగం, రంగు రెండూ నిలిచాయి.
- source_word: תְּמִימָה
  choice: సంపూర్ణంగా
  rationale: పూర్తితనం లేదా సమగ్ర స్థితిని సూచించే పదం; వెంటనే వచ్చే ‘లోపం లేదు’ అనే వేరైన మూలపదబంధంతో కలిపివేయకుండా ఉంచాం.
- source_word: מּוּם
  choice: లోపం
  rationale: శారీరక దోషం లేదా మచ్చ అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో విస్తృతంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עֹל
  choice: కాడి
  rationale: పనికోసం పశువుపై మోపే yoke‌ను సూచించే సహజమైన తెలుగు పదం.
theological_decisions:
- issue: దైవనామం יהוה ప్రతిరూపం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచాం.
- issue: תְּמִימָה మరియు אֵין בָּהּ מוּם మధ్య భావసామీప్యం
  choice: ‘సంపూర్ణంగా ఉండాలి; దానిలో ఏ లోపమూ ఉండకూడదు’ అని రెండింటినీ విడిగా అనువదించడం
  alternative: ‘లోపంలేని’ అని ఒకే భావంగా కుదించడం
  rationale: మూల హీబ్రూలోని రెండు వేర్వేరు అర్హతలను, వాటి ఉద్దేశపూర్వక భావసామీప్యాన్ని తొలగించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ప్రకటనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి స్పష్టమైన వాక్య నిర్మాణం. మూలంలోని ఆజ్ఞారూపం, ఆవుకు సంబంధించిన మూడు అర్హతలు స్పష్టంగా వేరుచేయబడ్డాయి.
