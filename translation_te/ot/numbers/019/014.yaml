  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: te
  text: 'ఇది నియమం: ఒక మనిషి గుడారంలో మరణించినప్పుడు, ఆ గుడారంలోకి ప్రవేశించే ప్రతి ఒక్కరూ, అందులో ఉన్న ప్రతి ఒక్కరూ[a] ఏడు రోజులు అపవిత్రులుగా ఉంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గుడారంలో ఉన్న ప్రతి వ్యక్తీ/ప్రతి వస్తువూ.’ హీబ్రూ వ్యక్తీకరణకు విస్తృత అర్థం ఉండవచ్చు. అయితే ముందున్న ‘గుడారంలోకి ప్రవేశించే ప్రతి ఒక్కరూ’ అనే భాగంతో ఉన్న సమాంతరత, అలాగే తరువాతి వచనంలో పాత్రలను ప్రత్యేకంగా ప్రస్తావించడం వల్ల, ఇక్కడ ప్రధానంగా అక్కడ ఉన్న వ్యక్తులనే సూచిస్తుందని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: ఇది నియమం
  rationale: శవసంబంధ అపవిత్రతను నిర్దేశించే బంధనకరమైన ఆచార నియమాన్ని תּוֹרָה ఇక్కడ పరిచయం చేస్తోంది. ఆధునిక తెలుగులో ‘నియమం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אָדָם כִּי יָמוּת
  choice: ఒక మనిషి ... చనిపోయినప్పుడు
  rationale: אָדָם ఇక్కడ ఏ వ్యక్తికైనా వర్తించే ఏకవచన సాధారణ పదం; כִּי తో కూడిన అసంపూర్ణ క్రియ న్యాయసూత్రంలోని సందర్భాన్ని సూచిస్తుంది. ‘చనిపోయినప్పుడు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֹהֶל
  choice: గుడారంలో
  rationale: మొదటి ప్రస్తావనలో హీబ్రూ పదానికి నిర్దిష్ట ఉపపదం లేదు; తెలుగు సందర్భంలో ‘ఒక మనిషి గుడారంలో’ అనడం అనిర్దిష్ట భావాన్ని సహజంగానే ఇస్తుంది.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: ఆ గుడారంలోకి ప్రవేశించే ప్రతి ఒక్కరూ
  rationale: కృదంత రూపం సాధారణంగా ఎవరైతే లోపలికి వస్తారో వారందరినీ సూచిస్తుంది. ‘ప్రవేశించే’ అనేది ప్రస్తుత నియమాత్మక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: అందులో ఉన్న ప్రతి ఒక్కరూ
  rationale: אֲשֶׁר విస్తృతంగా వ్యక్తులను లేదా వస్తువులను సూచించగలదు. అయితే ముందున్న వ్యక్తులను సూచించే సమాంతర వాక్యభాగం, ఏకవచన క్రియ, తరువాతి వచనంలో పాత్రలను ప్రత్యేకంగా ప్రస్తావించడం—ఇక్కడ వ్యక్తులనే ప్రధానంగా సూచిస్తున్నాయని బలపరుస్తాయి. అసలు విస్తృత సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: יִטְמָא
  choice: అపవిత్రులుగా ఉంటారు
  rationale: ఆచారపరమైన అపవిత్ర స్థితిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది. బహువచన కర్తకు అనుగుణంగా తెలుగు క్రియను బహువచనంలో ఇచ్చాం; నియమాత్మక బలం సందర్భంలో నిలుస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: కాలవ్యవధిని నేరుగా, సహజంగా అనువదిస్తుంది.
