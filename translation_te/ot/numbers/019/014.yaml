  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ-ఆచార శైలిని ఉపయోగించాం. ‘అపవిత్రులు’ అనే పదం ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; నైతిక దోషాన్ని కాదు.
