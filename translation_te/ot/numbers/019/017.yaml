  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: te
  text: ఆచారపరంగా అపవిత్రమైన వ్యక్తి కొరకు, శుద్ధీకరణ బలి దహనం నుండి వచ్చిన ధూళిలో కొంత తీసుకొని[a], ఒక పాత్రలో దానిమీద ప్రవహించే నీరు పోయాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సంప్రదాయంగా, “పాపబలి దహనం నుండి వచ్చిన బూడిదలో కొంత.” హీబ్రూలో “ధూళి” అనే పదం ఉంది; חטאת అనే పదం యాజక సంబంధ సందర్భాల్లో “పాపబలి” లేదా “శుద్ధీకరణ బలి” అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “జీవజలం”; అంటే తాజా మూలం నుండి వచ్చే లేదా ప్రవహించే నీరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: తీసుకొని
  rationale: నియమసంబంధ సందర్భంలో ఆజ్ఞార్థక భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; హీబ్రూలోని బహువచన కర్తను తెలుగులో అవ్యక్త కర్తతో సహజంగా ఉంచింది.
- source_word: לַטָּמֵא
  choice: అపవిత్రుడైన వ్యక్తి కోసం
  rationale: ఇది ఆచారపరమైన అపవిత్ర స్థితిలో ఉన్న వ్యక్తిని సూచిస్తుంది; ‘వ్యక్తి’ అనే పదం సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: מֵעֲפַר
  choice: ధూళిలో కొంత
  rationale: עָפָר సాధారణంగా ‘ధూళి/పొడి’; సందర్భానుసారంగా ‘బూడిద’ సాధ్యమైనా, మూలపదంలోని ప్రత్యేకతను ‘ధూళి’ నిలుపుతుంది. מן యొక్క విభాగార్థాన్ని ‘కొంత’ తెలియజేస్తుంది.
- source_word: שְׂרֵפַת
  choice: దహనం నుండి వచ్చిన
  rationale: దహన ప్రక్రియతో ఏర్పడిన ధూళి అనే సంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహారార్థ బలి
  rationale: యాజక సంబంధ సందర్భంలో חטאת పాపంతో సంబంధమున్నదిగానూ శుద్ధీకరణ కార్యం చేసే బలిగానూ ఉంటుంది. ‘పాపపరిహారార్థ బలి’ సంప్రదాయ అనుబంధాన్ని నిలుపుతూ బలి ప్రయోజనాన్ని సూచిస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: וְנָתַן
  choice: పోయాలి
  rationale: హీబ్రూలో ఏకవచన క్రియ ఉన్నా కర్త నిర్దిష్టంగా చెప్పబడలేదు. తెలుగులో లింగనిరపేక్షమైన విధ్యర్థక రూపం మూలంలోని అనిర్దిష్ట నిర్వాహకుడిని అతిగా నిర్ధారించదు.
- source_word: עָלָיו
  choice: దానిపై
  rationale: సహజంగా ముందున్న ధూళిని సూచిస్తుంది.
- source_word: מַיִם חַיִּים
  choice: ప్రవహించే నీరు
  rationale: అక్షరార్థంగా ‘జీవజలం’; ఈ ఆచార సందర్భంలో తాజా మూలం నుంచి వచ్చే లేదా ప్రవహించే నీటిని సూచించే హీబ్రూ నుడికారం. ‘ప్రవహించే నీరు’ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל כֶּלִי
  choice: ఒక పాత్రలో
  rationale: నీరు మరియు ధూళి పాత్రలో ఉండే ఫలితస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆచార శుద్ధి సందర్భంలో חטאת అనువాదం
  choice: పాపపరిహారార్థ బలి
  alternative: శుద్ధీకరణ బలి; పాపబలి
  rationale: חטאת అనే పదం పాపబలిని సూచించగలదు; యాజక ఆచారాల్లో శుద్ధీకరణ కార్యాన్ని కూడా ముందుకు తెస్తుంది. ప్రధాన పాఠంలో సంప్రదాయ పాప-సంబంధాన్ని, కార్యార్థాన్ని కలిపి ఉంచి, ‘శుద్ధీకరణ బలి’ని పాదసూచికలో ఇచ్చి నిజమైన అర్థ పరిధిని నిలిపాం.
- issue: מַיִם חַיִּים అనే నుడికారం
  choice: ప్రవహించే నీరు
  alternative: జీవజలం; తాజా నీరు
  rationale: ఇక్కడ పదబంధం ఆచారానికి కావలసిన సహజ మూలం నుంచి వచ్చే నీటిని సూచిస్తుంది. ‘ప్రవహించే నీరు’ ఆధునిక తెలుగులో అర్థవంతంగా ఉండగా, అక్షరార్థమైన ‘జీవజలం’ను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నియమశైలి వాడబడింది. అవ్యక్త విధ్యర్థక రూపం హీబ్రూ క్రియల సంఖ్యామార్పును తెలుగులో అసహజంగా చేయకుండా, నిర్వాహకుడిని అనవసరంగా పురుషుడిగా నిర్ధారించకుండా ఉంచుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
