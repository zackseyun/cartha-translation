revisions:
- from: అపవిత్రుడైన వ్యక్తి కోసం, పాపపరిహారార్థ బలి దహనం నుండి వచ్చిన ధూళిలో కొంత తీసుకొని[a], దానిపై ప్రవహించే నీటిని[b] ఒక పాత్రలో పోయాలి.
