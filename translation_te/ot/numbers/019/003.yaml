id: NUM.19.3
reference: Numbers 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: te
  text: మీరు దానిని యాజకుడైన ఎలియాజరుకు అప్పగించాలి. అతడు దానిని[a] శిబిరం వెలుపలికి తీసుకువెళ్లాలి; అతని సమక్షంలో దానిని వధించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ స్త్రీలింగ ఏకవచన సర్వనామం ఎర్ర ఆవును సూచిస్తుంది; తెలుగులో దానికి సహజంగా ‘దానిని’ అని వాడాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, అంతర్లీన కర్త ఎలియాజరే కొనసాగుతున్నాడని తీసుకుంటే, ‘అతడు దానిని తన ఎదుట వధించాలి.’ అయితే ‘అతని సమక్షంలో’ అనే మాట మరొకరు వధించారనే అర్థానికీ వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: మీరు … అప్పగించాలి
  rationale: చట్టపరమైన ఆదేశ సందర్భంలో సంయోజక వావుతో వచ్చిన ఖల్ పరిపూర్ణ క్రియ ఆజ్ఞార్థక భావాన్ని కలిగిస్తుంది. ‘అప్పగించాలి’ అనేది వస్తువును యాజకుని బాధ్యతకు ఇవ్వడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֹתָהּ
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న ఎర్ర ఆవును సూచిస్తుంది. ఆధునిక తెలుగులో జంతువును సూచించడానికి ‘దానిని’ సహజమైన రూపం.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరుకు
  rationale: వ్యక్తిపేరును లిప్యంతరీకరించి, הַכֹּהֵן అనే బిరుదును ‘యాజకుడు’గా అనువదించాం. తెలుగు వాక్యనిర్మాణానికి ‘యాజకుడైన’ సహజంగా సరిపోతుంది.
- source_word: וְהוֹצִיא
  choice: అతడు … తీసుకువెళ్లాలి
  rationale: יצא హిఫీల్ రూపం ‘బయటికి వెళ్లేలా చేయడం/బయటికి తీసుకువెళ్లడం’ అనే కారణార్థాన్ని ఇస్తుంది. ఇక్కడ ‘అతడు’ ఎలియాజరును సూచిస్తుంది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: గమ్యాన్ని సూచించే אֶל భావాన్ని తెలుగు ‘వెలుపలికి’ స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְשָׁחַט
  choice: దానిని వధించాలి
  rationale: హీబ్రూలో క్రియ కర్తృవాచక మూడవ పురుష ఏకవచనంలో ఉన్నా కర్త ప్రత్యక్షంగా పేర్కొనబడలేదు. తెలుగులో కర్తను వెల్లడించని ఆదేశరూపం వాడటం వల్ల ఎలియాజరే వధించాడని గానీ, మరొకరు వధించారని గానీ ప్రధాన పాఠం నిర్ణయించదు.
- source_word: לְפָנָיו
  choice: అతని సమక్షంలో
  rationale: ఈ సందర్భంలో ‘అతని ముందు’ కంటే ‘అతని సమక్షంలో’ పర్యవేక్షణ లేదా ప్రత్యక్ష హాజరు భావాన్ని సహజంగా తెలియజేస్తుంది; ‘అతని’ ఎలియాజరును సూచిస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో వధించేవారి గుర్తింపు
  choice: కర్తను స్పష్టంగా పేర్కొనకుండా, ఎలియాజరు సమక్షంలో వధ జరగాలని అనువదించడం
  alternative: ‘అతడు దానిని తన ఎదుట వధించాలి’ లేదా సందర్భానుసారం ‘మరొకడు దానిని అతని సమక్షంలో వధించాలి’
  rationale: וְשָׁחַט అనే క్రియకు అంతర్లీన మూడవ పురుష ఏకవచన కర్త ఉంది; ముందున్న ఎలియాజరే కర్తగా కొనసాగుతున్నాడని చదవవచ్చు. అయితే לְפָנָיו (‘అతని సమక్షంలో’) అనే పదబంధం వధించేవారిని ఎలియాజరు నుండి వేరుచేసే అవకాశాన్నీ కలిగిస్తుంది. కర్తను తెలుగులో వెల్లడించకుండా ఉంచడం ఈ నిజమైన సందిగ్ధతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆదేశ శైలిని ఉపయోగించాం. ‘అప్పగించాలి,’ ‘తీసుకువెళ్లాలి,’ ‘వధించాలి’ అనే రూపాలు ధర్మశాసన సందర్భానికి తగినవిగా ఉండి, సాధారణ పాఠకుడికి సులభంగా అర్థమవుతాయి.
