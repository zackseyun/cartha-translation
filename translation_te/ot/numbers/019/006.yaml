revisions:
- from: అప్పుడు యాజకుడు దేవదారు కట్టెను, హిస్సోపును, ఎర్రని నూలును తీసుకొని, ఆ ఆవు కాలుతున్న మంటల మధ్యలో వాటిని వేయాలి.
  to: అప్పుడు యాజకుడు దేవదారు చెక్కను, హిస్సోపును, స్కార్లెట్ రంగు నూలును తీసుకొని, ఆ ఆవు[అ]ను దహనం చేస్తున్న మంటల మధ్యలో వాటిని వేయాలి.
