id: NUM.19.6
reference: Numbers 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: te
  text: అప్పుడు యాజకుడు దేవదారు చెక్కను, హిస్సోపును, స్కార్లెట్ రంగు నూలును తీసుకొని, ఆ ఆవు[అ]ను దహనం చేస్తున్న మంటల మధ్యలో వాటిని వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: అ
    text: లేదా, “పెయ్యను దహనం చేస్తున్న మంటల మధ్యలో.” హీబ్రూ పారా స్త్రీ జాతి గోవును సూచిస్తుంది; సంప్రదాయ అనువాదాల్లో దీనిని తరచుగా “పెయ్య” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: అప్పుడు ... తీసుకొని
  rationale: వావ్‌తో కూడిన క్రియ కర్మకాండలో తదుపరి చర్యను సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది; తరువాతి ‘వేయాలి’తో విధి నిర్దేశక భావం స్పష్టమవుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సంబంధ సందర్భంలో כֹּהֵן‌కు ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: עֵץ אֶרֶז
  choice: దేవదారు కట్టెను
  rationale: అక్షరార్థంగా ‘దేవదారు చెక్క’; ఇక్కడ దహనంలో వేసే వస్తువుగా ‘కట్టె’ సహజంగా ఉండి పదార్థ భావాన్ని నిలుపుతుంది.
- source_word: וְאֵזוֹב
  choice: హిస్సోపును
  rationale: మొక్క యొక్క ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు వివాదాస్పదమైనందున సంప్రదాయ ధ్వన్యనువాదాన్ని నిలుపుతుంది.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: ఎర్రని నూలును
  rationale: ఈ పదబంధం పురుగు నుంచి లభించే రంగుతో అద్దిన ముదురు ఎరుపు పదార్థాన్ని సూచిస్తుంది. కర్మకాండలోని వస్తువుగా ‘ఎర్రని నూలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְהִשְׁלִיךְ
  choice: వాటిని వేయాలి
  rationale: హిఫిల్ క్రియకు ‘వేయు/విసరు’ భావం ఉంది. ఈ ఆచార నియమ సందర్భంలో ‘వేయాలి’ సహజమైన విధి నిర్దేశక రూపం.
- source_word: אֶל תּוֹךְ
  choice: మధ్యలో
  rationale: లోపలి భాగం లేదా నడిమిని సూచించే మూలపదబంధం యొక్క ప్రత్యేకతను నిలుపుతుంది.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: ఆ ఆవు కాలుతున్న మంటలు
  rationale: שְׂרֵפָה దహన ప్రక్రియను సూచిస్తుంది; ‘కాలుతున్న మంటలు’ తెలుగులో చర్య జరుగుతున్న దృశ్యాన్ని సహజంగా వ్యక్తపరుస్తుంది. פָּרָה స్త్రీ జాతి గోవును సూచించేందున ‘ఆవు’ సరైన సాధారణ పదం.
theological_decisions:
- issue: ఎర్ర ఆవు శుద్ధీకరణ కర్మలో פָּרָה అనువాదం
  choice: ఆవు
  alternative: పెయ్య / కోడె వయసు ఆడ దూడ
  rationale: హీబ్రూ పదం స్త్రీ జాతి గోవును సూచిస్తుంది; అది తప్పనిసరిగా వయస్సు లేదా ప్రసవించని స్థితిని నిర్దేశించదు. అందువల్ల సామాన్యమైన ‘ఆవు’ మూలంలోని విస్తృత భావాన్ని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కర్మకాండపు గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే విధంగా రూపొందించబడింది. జాబితాలోని కర్మలను ఒకే సహజ వాక్యంగా కూర్చి, చివరి విధి క్రియతో నియమ భావాన్ని తెలిపింది.
