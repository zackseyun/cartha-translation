id: NUM.19.21
reference: Numbers 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: te
  text: 'ఇది వారికి శాశ్వతమైన నియమంగా ఉండాలి: అపవిత్రతకు సంబంధించిన నీటిని[a] చిలకరించేవాడు తన బట్టలు ఉతుక్కోవాలి; ఆ నీటిని తాకినవాడు సాయంత్రం వరకు అపవిత్రంగా ఉంటాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అపవిత్రత జలాలు.’ లేదా, ‘అపవిత్రతను తొలగించడానికి నీరు.’ సాంప్రదాయక అనువాదంలో, ‘వేరుపరచే జలం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: ఇది వారికి శాశ్వతమైన నియమంగా ఉండాలి
  rationale: సందర్భంలో సూచితమైన నియమాన్ని ‘ఇది’ అని స్పష్టం చేస్తూ, చట్టబద్ధమైన నిరంతర వర్తింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּמַזֵּה
  choice: చిలకరించే వ్యక్తి
  rationale: హీబ్రూ క్రియావిశేషణ రూపం ఆ క్రియను చేసే వ్యక్తిని సూచిస్తుంది; ఆ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵי הַנִּדָּה
  choice: అపవిత్రతా జలం
  rationale: హీబ్రూలోని ‘అపవిత్రత యొక్క నీళ్లు’ అనే సంక్షిప్త, కొంత అస్పష్టమైన నిర్మాణాన్ని నిలుపుతుంది; ఇది శవస్పర్శవల్ల కలిగిన ఆచారపరమైన అపవిత్రతను తొలగించడానికి సిద్ధం చేసిన నీటిని సూచిస్తుందనే వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కోవాలి
  rationale: వస్త్రాలను కడగాలనే ఆజ్ఞను సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְהַנֹּגֵעַ
  choice: ముట్టుకునే వ్యక్తి
  rationale: మొదటి క్రియావిశేషణ రూపానికి సమాంతరంగా, నీటిని తాకే వ్యక్తిని సూచిస్తుంది.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు
  rationale: ఆచారపరమైన అపవిత్రతను నైతిక దోషంగా మార్చకుండా, దాని కాలపరిమితితో సహా నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: సంఖ్యాకాండము 19లోని ఆచారపరమైన పవిత్రత పదజాలం
  choice: ‘అపవిత్రతా జలం’ మరియు ‘అపవిత్రుడిగా’ అని ఆచారపరమైన అర్థంలో అనువదించడం
  alternative: ‘వేరుపరచే జలం’ లేదా ప్రధాన వాక్యంలోనే ‘అపవిత్రతను తొలగించే నీరు’ అని వివరించడం
  rationale: ఈ వచనం నైతిక అపరాధం గురించి కాక ఆచారపరమైన అపవిత్రత గురించి చెబుతుంది. ప్రధాన పాఠం హీబ్రూ పదబంధంలోని ఉద్రిక్తతను నిలుపుతుండగా, పాదసూచిక దాని ఆచారపరమైన కార్యాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. చట్టపరమైన ధోరణికి ‘ఉండాలి/ఉతుక్కోవాలి’ రూపాలు, ఆచారపరమైన స్థితికి ‘అపవిత్రుడు’ అనే స్థిరమైన పదం వాడబడ్డాయి.
