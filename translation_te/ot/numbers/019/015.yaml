id: NUM.19.15
reference: Numbers 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: te
  text: దానిపై బిగించి కట్టిన మూత లేని ప్రతి తెరిచి ఉన్న పాత్ర అపవిత్రమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: ప్రతి
  rationale: וְ ముందున్న నియమంతో అనుసంధానిస్తుంది; כֹל ఏకవచన నామవాచకంతో పంపిణీ భావంలో ‘ప్రతి’ అని సహజంగా అనువదించబడుతుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: כְּלִי
  choice: పాత్ర
  rationale: ఈ శుద్ధి నియమ సందర్భంలో כְּלִי ద్రవ్యం ఉంచే పాత్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పాత్ర’ సహజమైనది.
- source_word: פָתוּחַ
  choice: మూత తెరిచి ఉండి
  rationale: మూలంలో నేరుగా ‘తెరిచి ఉన్న’ అనే భావం ఉంది. పాత్ర సందర్భంలో తెలుగు సహజత్వం కోసం ‘మూత తెరిచి ఉండి’ అని చెప్పబడింది; తరువాతి ఉపవాక్యం దానిపై భద్రంగా కట్టిన కప్పు లేకపోవడాన్ని వివరిస్తుంది.
- source_word: אֲשֶׁר אֵין
  choice: లేని
  rationale: అర్హతను తెలిపే సంబంధ ఉపవాక్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా ‘లేని’ అని వ్యక్తం చేస్తుంది.
- source_word: צָמִיד פָּתִיל
  choice: బిగించి కట్టిన కప్పు
  rationale: ఈ సంయుక్త హీబ్రూ పదబంధం పాత్రపై కట్టడం ద్వారా భద్రపరచిన మూత లేదా కప్పును సూచిస్తుంది. ‘బిగించి కట్టిన కప్పు’ ఆ స్పష్టమైన బంధన భావాన్ని కాపాడి, ఖచ్చితమైన ప్రాచీన పద్ధతిని అతిగా నిర్దేశించదు.
- source_word: עָלָיו
  choice: దానిపై
  rationale: కప్పు పాత్ర మీద ఉండే స్థానాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: טָמֵא הוּא
  choice: అపవిత్రమైనదే
  rationale: హీబ్రూ వాక్యం ఆ పాత్ర అపవిత్ర స్థితిలో ఉందని బలంగా నిర్ధారిస్తుంది. సందర్భం ఆచార సంబంధమైనదైనా, మూలంలో లేని వివరణాత్మక ‘ఆచారపరంగా’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: అపవిత్రమైనదే
  alternative: ఆచారపరంగా అపవిత్రమైనది
  rationale: సందర్భం ఆచారశుద్ధికి సంబంధించినదే అయినా, טָמֵא స్వయంగా ‘అపవిత్రమైనది’ అని మాత్రమే చెబుతుంది. అందువల్ల వివరణాత్మక వేదాంత పదజాలాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పాత్ర,’ ‘కప్పు,’ ‘అపవిత్రమైనదే’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, హీబ్రూ పదబంధంలోని బిగించి కట్టిన మూత భావాన్ని నిలిపింది.
