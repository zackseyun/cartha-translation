- from: మూత తెరిచి ఉండి, దానిపై బిగించి కట్టిన కప్పు[a] లేని ప్రతి పాత్ర అపవిత్రమైనదే.
  to: దానిపై బిగించి కట్టిన మూత లేని ప్రతి తెరిచి ఉన్న పాత్ర అపవిత్రమైనది.
