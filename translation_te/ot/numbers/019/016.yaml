id: NUM.19.16
reference: Numbers 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: te
  text: బహిరంగ పొలంలో ఖడ్గంతో చంపబడినవారిని గానీ, మృతదేహాన్ని గానీ, మానవ ఎముకను గానీ, సమాధిని గానీ తాకిన ప్రతి ఒక్కరూ ఏడు రోజులు అపవిత్రులవుతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: తాకే ప్రతి వ్యక్తి
  rationale: సంబంధవాచక నిర్మాణంతో కూడిన כֹל ఇక్కడ సాధారణ నియమాన్ని, దాని పరిధిలోకి వచ్చే ప్రతి వ్యక్తినీ సూచిస్తుంది.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: బయట పొలంలో
  rationale: అక్షరార్థంగా ‘పొలం ముఖంపై’; బహిరంగ ప్రదేశంలోని పొలం అనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּחֲלַל חֶרֶב
  choice: ఖడ్గంతో చంపబడిన వ్యక్తిని
  rationale: חָלָל అనేది చంపబడిన లేదా పొడిచి చంపబడిన వ్యక్తిని సూచిస్తుంది; חֶרֶב చంపడానికి ఉపయోగించిన ఆయుధాన్ని తెలుపుతుంది.
- source_word: אוֹ בְמֵת
  choice: మృతదేహాన్ని గానీ
  rationale: מֵת ఇక్కడ మృత వ్యక్తి లేదా శవం అనే భావాన్ని ఇస్తుంది; అపవిత్రత సందర్భంలో ‘మృతదేహం’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: మనిషి ఎముకను గానీ
  rationale: אָדָם ఇక్కడ పురుషుణ్ణి ప్రత్యేకంగా కాకుండా మానవుని సాధారణంగా సూచిస్తుంది; ‘మనిషి ఎముక’ ఆ సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: אוֹ בְקָבֶר
  choice: సమాధిని గానీ
  rationale: קֶבֶר అంటే సమాధి లేదా పాతిపెట్టిన స్థలం; ఈ ధర్మశాస్త్ర సందర్భంలో ‘సమాధి’ సహజమైన సమానార్థకం.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ఏడు రోజులు అపవిత్రుడిగా ఉంటాడు
  rationale: ఈ క్రియ యాజక ధర్మశాస్త్రంలో ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; తెలుగు న్యాయనియమ శైలిలో ఫలితాన్ని స్పష్టంగా చెబుతుంది.
theological_decisions:
- issue: אָדָם అనే పదం యొక్క సాధారణ మానవార్థం
  choice: మనిషి
  alternative: పురుషుడు
  rationale: ఈ అపవిత్రత నియమంలో మిగిలిన ఎముక ఏ మానవునిదైనా కావచ్చు; మూలపాఠం ఇక్కడ పురుష లింగాన్ని ప్రత్యేకంగా ఉద్దేశించదు.
- issue: טמא అనే పదంలోని ఆచారపరమైన అపవిత్రత
  choice: అపవిత్రుడిగా ఉంటాడు
  alternative: అశుద్ధుడవుతాడు
  rationale: సందర్భం ఆచారపరమైన స్థితిని సూచిస్తుంది. ‘అపవిత్రుడు’ ఆ ధర్మశాస్త్ర భావాన్ని నిలుపుతూ, నైతిక దోషాన్ని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. మూలంలోని జాబితా నిర్మాణాన్ని ‘గానీ’ ప్రయోగంతో సహజంగా నిలిపి, అపవిత్రతను ఆచారపరమైన స్థితిగా వ్యక్తం చేశాం.
