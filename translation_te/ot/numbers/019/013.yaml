source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: te
  text: మరణించిన మనిషి శరీరాన్ని తాకి, తనను శుద్ధి చేసుకోని ప్రతి వ్యక్తి యెహోవా గుడారాన్ని అపవిత్రపరచాడు; ఆ వ్యక్తి ఇశ్రాయేలు నుండి తెగదెంపబడతాడు. అపవిత్రత కొరకు నీరు[a] అతనిమీద చిలకరించబడలేదు కాబట్టి అతడు అపవిత్రుడిగానే ఉంటాడు; అతని అపవిత్రత ఇంకా అతనిమీదనే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అపవిత్రత నీరు.” ఇది మృతదేహాన్ని తాకడం వల్ల కలిగిన ఆచారపరమైన అపవిత్రతను తొలగించడానికి ఉపయోగించే నీరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: చనిపోయిన మనిషి మృతదేహాన్ని తాకి
  rationale: נגע భౌతికంగా తాకడాన్ని సూచిస్తుంది. בְּמֵת తరువాతి వివరణతో కలిసి మానవ మృతదేహాన్ని సూచిస్తుంది; తెలుగులో పునరుక్తి భారాన్ని తగ్గిస్తూ భావాన్ని స్పష్టంగా అందించింది.
- source_word: יִתְחַטָּא
  choice: తనను తాను శుద్ధి చేసుకోని
  rationale: ఇక్కడ హిత్పయేల్ రూపం నైతిక పశ్చాత్తాపాన్ని కాక ఆచారపరమైన శుద్ధిని సూచిస్తుంది.
- source_word: מִשְׁכַּן יְהוָה
  choice: యెహోవా గుడారం
  rationale: מִשְׁכָּן దేవుని నివాస గుడారాన్ని సూచిస్తుంది; దైవనామమైన יהוהను 'యెహోవా'గా ప్రత్యక్షంగా లిప్యంతరీకరించింది.
- source_word: טִמֵּא
  choice: అపవిత్రం చేసినవాడే
  rationale: పీయేల్ రూపం పరిశుద్ధ స్థలాన్ని అపవిత్రం చేయడాన్ని సూచిస్తుంది; ఆచారపరమైన తీవ్రతను నిలుపుతుంది.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  choice: అలాంటి వ్యక్తి ఇశ్రాయేలులోనుండి తొలగించబడాలి
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తిని సూచిస్తుంది. כרת అనే నిబంధనాత్మక శిక్షాసూత్రాన్ని దాని అమలు విధానాన్ని నిర్దిష్టం చేయకుండా 'తొలగించబడాలి'గా ఉంచింది.
- source_word: מֵי נִדָּה
  choice: అపవిత్రతను తొలగించే నీళ్లు
  rationale: అక్షరార్థమైన 'అపవిత్రత నీళ్లు' తెలుగులో తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున, శవస్పర్శవల్ల కలిగిన అపవిత్రతను తొలగించడానికి ఉపయోగించే నీళ్లనే కార్యార్థంగా స్పష్టం చేసింది; అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: זֹרַק עָלָיו
  choice: అతని మీద చిలకరించబడలేదు
  rationale: ఆచార సందర్భంలో క్రియ నీటిని చిలకరించడాన్ని సూచిస్తుంది; హెబ్రీ నిష్క్రియ భావాన్ని నిలిపింది.
- source_word: טָמֵא יִהְיֶה עוֹד טֻמְאָתוֹ בוֹ
  choice: అతడు అపవిత్రుడిగానే ఉంటాడు; అతని అపవిత్రత ఇంకా అతని మీదే ఉంటుంది
  rationale: కొనసాగుతున్న ఆచారపరమైన స్థితిని, అపవిత్రత వ్యక్తిమీద నిలిచి ఉందనే హెబ్రీ రూపకాన్ని రెండింటినీ కాపాడింది.
theological_decisions:
- issue: '''తొలగించబడాలి'' అనే నిబంధనాత్మక శిక్ష యొక్క ఖచ్చితమైన అర్థం'
  choice: తొలగించబడాలి
  alternative: చంపబడాలి / సమాజం నుండి బహిష్కరించబడాలి
  rationale: ఈ వాక్యంలో హెబ్రీ సూత్రం శిక్ష అమలు విధానాన్ని స్వయంగా నిర్దిష్టం చేయదు. మరణశిక్ష లేదా సామాజిక బహిష్కరణ అని నిర్ణయించకుండా అస్పష్టతను నిలిపింది.
- issue: אָדָם యొక్క సాధారణ మానవ సూచన
  choice: మనిషి
  alternative: మానవుడు / వ్యక్తి
  rationale: ఇక్కడ אָדָם లింగ-నిర్దిష్ట వ్యక్తిని కాక సాధారణ మానవుణ్ణి సూచించినా, హెబ్రీ ఏకవచన రూపానికి దగ్గరగా సహజమైన తెలుగు 'మనిషి'ని వాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ఆచారపరమైన 'శుద్ధి/అపవిత్రత' పదజాలాన్ని స్థిరంగా వాడి, నిబంధనాత్మక శిక్షలోని అస్పష్టతను పరిష్కరించకుండా ఉంచింది.
