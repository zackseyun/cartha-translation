  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: te
  text: శుద్ధిగా ఉన్న వ్యక్తి మూడవ రోజున, ఏడవ రోజున అశుద్ధిగా ఉన్న వ్యక్తిపై దానిని చల్లాలి; ఏడవ రోజున అతన్ని శుద్ధి చేయాలి[a]. తరువాత అతడు తన బట్టలు ఉతుక్కొని, నీళ్లలో స్నానం చేయాలి; సాయంకాలంలో అతడు శుద్ధిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని అశుద్ధిని తొలగించాలి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ పాపానికి సంబంధించిన సందర్భాల్లోనూ కనిపించే ధాతువు నుంచే వచ్చింది; అయితే ఇక్కడ అది ఆచారపరమైన అశుద్ధి నుండి శుద్ధి చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: దానిని చల్లాలి
  rationale: హిఫిల్ రూపంలోని נזה ఈ ఆచార సందర్భంలో శుద్ధీకరణ నీటిని చల్లడాన్ని సూచిస్తుంది. ముందటి సందర్భంలో చెప్పిన నీటిని సూచించే కర్మ హీబ్రూలో అంతర్లీనంగా ఉంది; తెలుగులో సహజమైన సంపూర్ణ వాక్యానికి ‘దానిని’ చేర్చబడింది.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: శుద్ధుడైన వ్యక్తి / అశుద్ధుడైన వ్యక్తి
  rationale: విశేషణాలు ఇక్కడ నామవాచకాలుగా పనిచేసి ఆచారపరంగా శుద్ధి లేదా అశుద్ధి స్థితిలో ఉన్న వ్యక్తులను సూచిస్తున్నాయి. ‘వ్యక్తి’ అనేది నియమంలోని సాధారణ వర్తింపును నిలుపుతుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: మూడవ రోజున, ఏడవ రోజున
  rationale: ఆచార సమయాన్ని స్పష్టంగా ఉంచుతూ హీబ్రూ పునరుక్త నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: וְחִטְּאוֹ
  choice: అతన్ని శుద్ధి చేయాలి
  rationale: חטא ధాతువు పియేల్ రూపం ఈ మృతదేహ అశుద్ధి సందర్భంలో నైతిక పాపక్షమాపణను కాక ఆచారపరమైన అశుద్ధి తొలగింపును సూచిస్తుంది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: ‘బట్టలు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి మూలంలోని వస్త్రాలను సూటిగా సూచిస్తుంది; ‘తన’ ప్రత్యయార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లలో స్నానం చేయాలి
  rationale: ఈ ఆచార క్రమంలో רחץ శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది. ‘స్నానం చేయాలి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וְטָהֵר בָּעָרֶב
  choice: సాయంకాలానికి అతడు శుద్ధుడవుతాడు
  rationale: కడుక్కున్న తరువాత సాయంకాలంలో ఏర్పడే ఆచారపరమైన శుద్ధి స్థితిని ఇది స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: חטא / טהר పదాల స్వభావం
  choice: ఆచారపరమైన శుద్ధిగా అనువదించడం
  alternative: పాపం నుండి శుభ్రపరచడం లేదా ప్రాయశ్చిత్తం చేయడం
  rationale: ఈ సందర్భం మృతదేహం వల్ల కలిగిన అశుద్ధి మరియు శుద్ధీకరణ నీటి గురించి. కాబట్టి నైతిక అపరాధం లేదా ప్రాయశ్చిత్తం అనే భావాన్ని చేర్చకుండా ఆచారపరమైన అర్థాన్ని నిలిపాం.
- issue: הַטָּהֹר / הַטָּמֵא లోని వ్యాకరణ లింగం
  choice: సాధారణంగా వర్తించే ‘వ్యక్తి’ అనే భావాన్ని వ్యక్తపరచడం
  alternative: శుద్ధుడైన పురుషుడు / అశుద్ధుడైన పురుషుడు
  rationale: హీబ్రూ రూపాలు పుంలింగ ఏకవచనమైనా, ఈ నియమ సందర్భంలో ప్రతినిధి రూపాలుగా పనిచేస్తున్నాయి; నియమాన్ని పురుషులకు మాత్రమే పరిమితం చేయడం మూల ఉద్దేశం కాదు.
- issue: బట్టలు ఉతికి స్నానం చేసే ‘అతడు’ ఎవరు?
  choice: మూలంలోని సర్వనామ క్రమాన్ని అనుసరించి ‘అతడు’ అని ఉంచడం
  alternative: ‘శుద్ధి పొందిన వ్యక్తి’ అని స్పష్టీకరించడం
  rationale: సందర్భం శుద్ధి పొందుతున్న వ్యక్తినే సూచించినప్పటికీ, హీబ్రూ వాక్యంలో కర్త మార్పు పేరుతో స్పష్టంగా చెప్పబడలేదు. అందువల్ల అనువాదంలో అవసరానికి మించిన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నియమావళి శైలిని ఉపయోగించాం. ‘శుద్ధుడు/అశుద్ధుడు’ అనే పదాలు సాధారణ పరిశుభ్రతకన్నా ఆచార స్థితిని సూచించేలా సందర్భంలో నిలిపాం. మూలంలోని సర్వనామ సంబంధ అస్పష్టతను అనవసరంగా పరిష్కరించలేదు.
