  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: te
  text: ఆచారపరంగా శుద్ధుడైన ఒక పురుషుడు ఆ ఆవు బూడిదను పోగుచేసి, శిబిరం వెలుపల శుద్ధమైన స్థలంలో ఉంచాలి. దానిని ఇశ్రాయేలీయుల సమాజం కోసం అపవిత్రత జలాల కొరకు భద్రపరచాలి.[a] అది పాపపరిహార అర్పణ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అపవిత్రతకు సంబంధించిన నీళ్ల కోసం”; భావానువాదంగా, “శుద్ధీకరణ నీళ్ల కోసం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది శుద్ధీకరణ అర్పణ.” హీబ్రూ పదం חַטָּאת పాపపరిహార అర్పణను సూచించగలదు; యాజక కర్మకాండ సందర్భాల్లో శుద్ధీకరణ కోసం చేసే అర్పణ అనే భావాన్నీ కలిగి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: ఆచారపరంగా శుద్ధుడైన ఒక పురుషుడు
  rationale: אִישׁ అనే ఏకవచన పురుషవాచక పదాన్ని నిలుపుతూ, ఈ సందర్భంలో טָהוֹר సూచించే ఆచారపరమైన శుద్ధతను స్పష్టం చేస్తుంది.
- source_word: וְאָסַף
  choice: పోగుచేసి
  rationale: కర్మకాండ సంబంధమైన ఆదేశాల వరుసను సహజమైన తెలుగు క్రియారూపంలో కొనసాగిస్తుంది.
- source_word: אֵפֶר הַפָּרָה
  choice: ఆ పెయ్య దహనభస్మం
  rationale: פָּרָה ఆడ పశువును సూచిస్తుంది; మునుపటి సందర్భంలోని ప్రత్యేక పశువును 'ఆ పెయ్య'గా సూచించి, אֵפֶרను దహనానంతర భస్మంగా స్పష్టం చేసింది.
- source_word: וְהִנִּיחַ
  choice: ఉంచాలి
  rationale: కర్మకాండ ఆదేశానికి తగిన సరళమైన ఆధునిక తెలుగు.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: హీబ్రూ పదబంధంలోని స్థానార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּמָקוֹם טָהוֹר
  choice: శుద్ధమైన స్థలంలో
  rationale: ఆచారపరమైన శుద్ధత సందర్భం ద్వారా స్పష్టమవుతుంది; అనవసర పునరుక్తి లేకుండా మూలపదాన్ని నిలుపుతుంది.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల సమాజం కోసం
  rationale: עֲדָהను 'సమాజం'గా, בְּנֵי יִשְׂרָאֵלను ఆధునిక తెలుగులో సహజమైన సమూహనామంగా అందిస్తుంది.
- source_word: לְמִשְׁמֶרֶת
  choice: భద్రపరచబడాలి
  rationale: కాపాడి నిల్వ ఉంచాలనే నామవాచక భావాన్ని సహజమైన తెలుగు క్రియగా వ్యక్తం చేస్తుంది.
- source_word: לְמֵי נִדָּה
  choice: అపవిత్రతను తొలగించే నీళ్ల కోసం
  rationale: నేరుగా ఉన్న 'అపవిత్రత నీళ్లు' అనే అసహజ నిర్మాణం బదులు, ఈ నీటి ఆచారపరమైన ప్రయోజనాన్ని తెలియజేస్తుంది; పదబంధంలోని అర్థసంభావ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: חַטָּאת הִוא
  choice: అది పాపపరిహార అర్పణ
  rationale: חַטָּאתకు సాధారణంగా ఉన్న పాపసంబంధ అర్పణ భావాన్ని నిలుపుతుంది; యాజక కర్మకాండలోని శుద్ధీకరణ భావాన్ని పాదటిప్పణిలో చూపిస్తుంది.
theological_decisions:
- issue: శుద్ధీకరణ కర్మకాండలో חַטָּאת పదాన్ని ఎలా అనువదించాలి
  choice: అది పాపపరిహార అర్పణ
  alternative: అది శుద్ధీకరణ అర్పణ
  rationale: ఈ హీబ్రూ పదం పాపాన్ని, పాపసంబంధ అర్పణను, అలాగే యాజక సంబంధ సందర్భాల్లో శుద్ధీకరణ కార్యాన్ని సూచించగలదు. ప్రధాన పాఠంలో సాంప్రదాయక పాపసంబంధ భావాన్ని ఉంచి, కర్మకాండ సంబంధమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి theological tensionను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కర్మకాండ శైలి. 'ఆచారపరంగా' అనే పదం వ్యక్తి శుద్ధతను నైతిక నిర్దోషిత్వంగా అపార్థం చేసుకోకుండా చేస్తుంది. మూలంలోని లింగ-నిర్దిష్టమైన אִישׁను 'పురుషుడు'గా నిలిపింది.
