id: NUM.19.20
reference: Numbers 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: te
  text: అయితే అపవిత్రుడై తనను తాను శుద్ధి చేసుకోని వ్యక్తి సమాజం మధ్యనుండి కొట్టివేయబడాలి[a]. ఎందుకంటే అతడు యెహోవా పరిశుద్ధస్థలాన్ని అపవిత్రపరిచాడు. అపవిత్రతను తొలగించే నీళ్లు అతనిపై చల్లబడలేదు[b]; అతడు అపవిత్రుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ప్రాణం కొట్టివేయబడాలి.’ హీబ్రూ న్యాయసూత్రంలో ‘ప్రాణం’ అనే పదం కేవలం దేహానికి భిన్నమైన ఆత్మను కాక, మొత్తం వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అపవిత్రత నీళ్లు’; సంప్రదాయంగా, ‘వేరుపరచే నీళ్లు.’ ఈ పదబంధం ఈ అధ్యాయంలో సిద్ధం చేసిన శుద్ధీకరణ నీటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: వ్యక్తి
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఈ న్యాయ సందర్భంలో ఏ వ్యక్తినైనా సూచిస్తుంది; ఆధునిక తెలుగులో ‘వ్యక్తి’ సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: יִטְמָא
  choice: అపవిత్రుడైన
  rationale: ఇక్కడ నైతిక దోషం కంటే ఆచారపరమైన అపవిత్ర స్థితిలోకి రావడాన్ని సూచిస్తుంది.
- source_word: יִתְחַטָּא
  choice: తనను తాను శుద్ధి చేసుకోకపోతే
  rationale: హిత్పయేల్ రూపం ఈ సందర్భంలో పాపం చేయడాన్ని కాక, అపవిత్రతనుండి శుద్ధి పొందే ప్రక్రియను సూచిస్తుంది.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి ... కొట్టివేయబడాలి
  rationale: נפש న్యాయసూత్రాల్లో మొత్తం వ్యక్తిని సూచించగలదు. శిక్ష అమలయ్యే ఖచ్చిత విధానాన్ని నిర్ణయించకుండా ‘కొట్టివేయబడాలి’ అనే నిబంధనాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: సమాజం మధ్యనుండి
  rationale: קהל నిబంధన సమాజాన్ని సూచిస్తుంది; ఈ అనువాదం సామూహిక భావాన్ని, ‘మధ్యనుండి’ అనే మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מִקְדַּשׁ יְהוָה
  choice: యెహోవా పరిశుద్ధస్థలం
  rationale: מקדש పవిత్ర నివాసస్థలాన్ని లేదా ఆవరణాన్ని సూచిస్తుంది; దైవనామం మూలంలోని יהוהకు అనుగుణంగా ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: טִמֵּא
  choice: అపవిత్రపరిచాడు
  rationale: పీయేల్ రూపం పరిశుద్ధస్థలాన్ని ఆచారపరంగా అపవిత్రం చేసిన కారణార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: מֵי נִדָּה
  choice: అపవిత్రతను తొలగించే నీళ్లు
  rationale: ఈ అధ్యాయంలో సిద్ధం చేసిన శుద్ధీకరణ నీటినే సూచిస్తుంది. ‘వేరుపరచే నీళ్లు’ అనే సంప్రదాయ పదబంధం కలిగించే అపార్థాన్ని నివారిస్తూ దాని సందర్భోచిత కార్యాన్ని స్పష్టం చేస్తుంది.
- source_word: זֹרַק עָלָיו
  choice: అతనిపై చల్లబడలేదు
  rationale: ఆచార సందర్భంలో זרק ద్రవాన్ని చల్లడాన్ని సూచిస్తుంది; కర్మణి నిర్మాణం తెలుగు వాక్యంలో సహజంగా ఉంది.
- source_word: טָמֵא הוּא
  choice: అతడు అపవిత్రుడే
  rationale: క్రియలేని హీబ్రూ వాక్యం అతని కొనసాగుతున్న న్యాయస్థితిని గట్టిగా ప్రకటిస్తుంది; ‘-ఏ’ నిశ్చయార్థకం ఆ బలాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘కొట్టివేయబడాలి’ అనే శిక్ష స్వభావం
  choice: మరణం, సమాజ బహిష్కరణ, లేదా దైవిక తీర్పు అని ప్రత్యేకంగా నిర్ధారించకుండా నిబంధనాత్మక రూపకాన్ని నిలుపడం.
  alternative: ‘సమాజం నుండి బహిష్కరించబడాలి’ లేదా ‘చంపబడాలి’.
  rationale: ఈ హీబ్రూ నిబంధన సూత్రం ఇక్కడ శిక్ష అమలయ్యే విధానాన్ని స్వయంగా నిర్వచించదు. అసలైన న్యాయ-వేదాంత ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆచార శైలి ఉపయోగించబడింది. ‘అపవిత్రుడు/శుద్ధి’ అనే పదజాలం ఆచారపరమైన స్థితిని స్పష్టంగా ఉంచుతుంది; శిక్ష స్వభావంలోని మూలభాషా అనిశ్చితి పరిష్కరించబడలేదు.
