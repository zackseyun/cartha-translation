id: NUM.19.1
reference: Numbers 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: te
  text: 'యాహ్వే మోషేతోను అహరోనుతోను ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అనే క్రియ ఇక్కడ కొత్త దైవిక ప్రసంగాన్ని ప్రారంభిస్తుంది. తెలుగులో ‘అన్నాడు’ సహజంగా ఉండి, వెంట వచ్చే ప్రత్యక్ష వాక్యానికి స్పష్టమైన పరిచయాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: రెండుసార్లు వచ్చిన אֶל ఉపసర్గ ఇద్దరూ వాక్యానికి ఉద్దేశిత శ్రోతలని చూపుతుంది. ఆధునిక తెలుగులో ‘తో’ ప్రయోగం మాట్లాడటానికి సంబంధించిన వ్యక్తులను సహజంగా సూచిస్తుంది; ఇద్దరి దగ్గర దానిని పునరావృతం చేయడం మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే మాటలను పరిచయం చేసే సూత్రప్రయోగం. తెలుగులో ‘ఇలా అన్నాడు:’ అనేది సహజమైన ప్రత్యక్ష వాక్య పరిచయం; ‘చెప్పుచు’ వంటి పాత రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు. హీబ్రూ ఉచ్చారణపై సంపూర్ణ నిశ్చయత లేనందున, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. తరువాతి ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు ముగింపులో ద్విబిందువు వాడబడింది.
