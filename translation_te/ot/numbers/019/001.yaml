    issue: The Tetragrammaton is rendered “యెహోవా” instead of the project-specified “Yahweh.”
    rationale: The source has יהוה, and the English POB audit trail explicitly requires “Yahweh,” not “Jehovah.” The Telugu rendering should preserve that same name choice as “యాహ్వే.”
  - severity: low
    issue: The repeated addressee construction can be made more explicit.
    rationale: Hebrew repeats אֶל before Moses and Aaron. “మోషేతోను అహరోనుతోను” naturally signals both as the recipients without changing the sense.
