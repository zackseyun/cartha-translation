id: NUM.19.8
reference: Numbers 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: te
  text: దానిని కాల్చేవాడు తన బట్టలను నీళ్లలో ఉతుక్కొని, తన శరీరాన్ని నీళ్లలో కడుక్కోవాలి; అతడు సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘అపవిత్రుడు’ అనేది ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; తప్పనిసరిగా నైతిక అపరాధాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: దానిని కాల్చేవాడు
  rationale: నిర్దిష్ట ఉపవాచక కృదంతం ఆ దహనక్రియ చేసే వ్యక్తిని సూచిస్తుంది; స్త్రీలింగ ఏకవచన కర్మసర్వనామం ముందు ప్రస్తావించిన ఎర్ర ఆవును సూచించినా, తెలుగు విధివాక్య సందర్భంలో ‘దానిని’ సహజంగా ఉంటుంది.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలను ... ఉతుక్కొని
  rationale: כּבס బట్టలు ఉతకడాన్ని సూచిస్తుంది. తెలుగు అనుసంధాన క్రియారూపం తరువాతి ఆజ్ఞతో సహజంగా కలుస్తుంది; ‘తన’ కర్తతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: בַּמַּיִם
  choice: నీళ్లలో
  rationale: ב ఉపసర్గతో పాటు నిర్దిష్ట ప్రత్యయం అక్షరార్థంగా ‘నీళ్లలో’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ఇది సహజంగా ఉండి, రెండు సందర్భాల్లోనూ హెబ్రీ పునరుక్తిని నిలుపుతుంది.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: తన శరీరాన్ని ... కడుక్కోవాలి
  rationale: רחץ శరీరాన్ని నీటితో కడగడం లేదా స్నానం చేయడాన్ని సూచిస్తుంది; בשר ఇక్కడ సందర్భానుసారంగా ‘శరీరం.’ ‘కడుక్కోవాలి’ విధి భావాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: טמא ఇక్కడ కర్మకాండ సంబంధమైన అపవిత్ర స్థితిని సూచిస్తుంది. ప్రధాన పాఠంలో సంక్షిప్తమైన సంప్రదాయ పదాన్ని ఉంచి, దాని ప్రత్యేక భావాన్ని పాదటీకలో వివరిస్తున్నాం.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: అపవిత్ర స్థితి కొనసాగే కాలపరిమితిని దగ్గరగా, సహజంగా వ్యక్తపరుస్తుంది; ‘సూర్యాస్తమయం వరకు’ అనడం మూలంలో లేని స్పష్టీకరణను చేర్చుతుంది.
theological_decisions:
- issue: కర్మకాండ సంబంధమైన అపవిత్రత పదప్రయోగం
  choice: అపవిత్రుడిగా ఉంటాడు
  alternative: ఆచారపరంగా అపవిత్రుడిగా ఉంటాడు
  rationale: హెబ్రీ טמא యాజక ధర్మశాస్త్ర సందర్భంలో ఆచారపరమైన స్థితిని సూచిస్తుంది; అది తప్పనిసరిగా నైతిక దోషాన్ని సూచించదు. ప్రధాన పాఠాన్ని భారంగా చేయకుండా ఈ భేదాన్ని పాదటీకలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. బట్టలకు כבס, శరీరానికి רחץ అనే మూలభాషా క్రియాభేదాన్ని ‘ఉతుక్కొని/కడుక్కోవాలి’ ద్వారా నిలిపాం. పాదటీక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
