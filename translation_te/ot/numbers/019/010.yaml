id: NUM.19.10
reference: Numbers 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: te
  text: ఆ ఆవు యొక్క బూడిదను పోగుచేసే వ్యక్తి తన బట్టలు ఉతుకుకోవాలి; అతడు సాయంత్రం వరకు అశుద్ధుడిగా ఉంటాడు. ఇది ఇశ్రాయేలు ప్రజలకు[a], వారి మధ్య నివసించే పరదేశికి శాశ్వతమైన శాసనంగా[b] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులకు’; ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సమష్టి ఒడంబడిక పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిరంతరం అమలులో ఉండే శాసనంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: పోగుచేసే వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న Qal కృదంతం, బూడిదను పోగుచేసే వ్యక్తిని సూచిస్తుంది. ఈ రూపం కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֵפֶר הַפָּרָה
  choice: ఆ ఆవు బూడిద
  rationale: אֵפֶר సమష్టి భావంలో ‘బూడిద’; פָּרָה ఆడ పశువును సూచిస్తుంది. ముందటి సందర్భంలో పేర్కొన్న ఆవును నిర్దిష్టంగా సూచించేందుకు ‘ఆ ఆవు’ అని అనువదించబడింది.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: తన బట్టలు ఉతుకుకోవాలి
  rationale: యాజక సంబంధమైన శుద్ధి నియమాల్లో ఈ క్రియ వస్త్రాలను కడగడాన్ని సూచిస్తుంది. ‘ఉతుకుకోవాలి’ న్యాయవిధి బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: ఇక్కడ నైతిక దోషం కాక ఆచార సంబంధమైన అపవిత్ర స్థితి ఉద్దేశించబడింది. ‘అపవిత్రుడు’ ఈ స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: కాలపరిమితిని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులకు’ అయినా, ఇది సమస్త ఇశ్రాయేలు సమాజాన్ని సూచించే సమష్టి ఒడంబడిక పదబంధం. ప్రధాన పాఠంలో సహజమైన సమష్టి రూపాన్ని ఉంచి, మూలరూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: వారి మధ్య నివసించే పరదేశికి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది. ‘పరదేశి’ అతని బయటి మూలాన్నీ, ‘నివసించే’ అతని స్థిర నివాసాన్నీ తెలియజేస్తాయి; హెబ్రీలోని నామవాచక-కృదంత పునరుక్తిని తెలుగులో సహజంగా సంక్షిప్తం చేశాం.
- source_word: לְחֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనంగా
  rationale: חֻקָּה స్థిరమైన నియమం లేదా శాసనం; עוֹלָם దీర్ఘకాలికమైన లేదా నిరంతర చెల్లుబాటును సూచిస్తుంది. ‘శాశ్వతమైన శాసనం’ న్యాయపరమైన గంభీరతను, కాలవ్యాప్తిని నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు ప్రజలకు
  alternative: ఇశ్రాయేలు కుమారులకు
  rationale: హెబ్రీ రూపం వ్యాకరణపరంగా ‘కుమారులు’ అని ఉన్నప్పటికీ, ఈ ఒడంబడిక సందర్భంలో అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది. అపార్థం రాకుండా ప్రధాన పాఠంలో ‘ప్రజలు’ వాడి, మూలంలోని రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: ఆచార సంబంధమైన అపవిత్రత
  choice: అపవిత్రుడిగా ఉంటాడు
  alternative: అశుద్ధుడిగా ఉంటాడు
  rationale: ఈ వాక్యం నైతిక కలుషతను కాదు, శుద్ధి ఆచారాలకు సంబంధించిన స్థితిని సూచిస్తుంది. ‘అపవిత్రుడు’ ఆచార న్యాయ సందర్భంలో స్పష్టంగా, గంభీరంగా ఉంటుంది.
- issue: עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతమైన
  alternative: నిరంతరం అమలులో ఉండే
  rationale: ఈ పదం శాశ్వతత్వం లేదా నిరవధికంగా కొనసాగడాన్ని సూచించగలదు. ప్రధాన పాఠం సంప్రదాయ న్యాయసూత్ర బలాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చి కాలవ్యాప్తిలోని భావసూక్ష్మతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా న్యాయవిధి గంభీరతను నిలుపుకున్నాం. ‘ఉతుకుకోవాలి’, ‘నివసించే’ వంటి సహజ రూపాలను వాడాం; ఆచార అపవిత్రతను నైతిక అపరాధంగా వినిపించకుండా సందర్భానుగుణ పదజాలం ఎంచుకున్నాం.
