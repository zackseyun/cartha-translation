review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects ritual cleanness, absence due to travel, non-observance of Passover, the deliberately unresolved idiom of being ‘cut off,’ the appointed time, and bearing sin. A small revision better preserves the explicitly masculine איש (‘man’) and makes קרבן יהוה unambiguously an offering due to Yahweh rather than an offering made by Yahweh.
  naturalness: The draft is generally natural modern standard Telugu. ‘పస్కాను ఆచరించకుండా మానితే’ more directly expresses the Hebrew sense of refraining/failing to perform, and ‘తన ప్రజలలోనుండి’ is smoother than ‘తన ప్రజల మధ్యనుండి’ in this idiom.
  terminology: ‘ఆచారపరంగా శుద్ధిగా,’ ‘పస్కా,’ ‘కొట్టివేయబడతాడు,’ ‘యాహ్వే,’ and ‘పాపాన్ని భరిస్తాడు’ appropriately retain the ritual, covenantal, divine-name, and legal-theological language without settling disputed implications.
  issues:
  - severity: low
    issue: Explicit masculine reference is generalized as ‘వ్యక్తి.’
    rationale: The Hebrew opens and closes with איש, ‘man.’ Telugu can preserve this naturally with ‘మనిషి,’ while the intervening נפש idiom need not be rendered as ‘soul.’
  - severity: low
    issue: ‘యాహ్వే అర్పణను’ can be read as an offering made by Yahweh.
    rationale: The Hebrew construct means Yahweh’s offering, that is, the offering owed/presented to Yahweh. ‘యాహ్వేకు అర్పించవలసిన అర్పణ’ makes the direction clear without adding a doctrinal interpretation.
  revised_text: కాని ఆచారపరంగా శుద్ధిగా ఉండి, ప్రయాణంలో లేని ఒక మనిషి పస్కాను ఆచరించకుండా మానితే, ఆ మనిషి తన ప్రజలలోనుండి కొట్టివేయబడతాడు[a]; ఎందుకంటే అతడు యాహ్వేకు అర్పించవలసిన అర్పణను దాని నియమిత సమయంలో అర్పించలేదు. ఆ మనిషి తన పాపాన్ని భరిస్తాడు[b].
