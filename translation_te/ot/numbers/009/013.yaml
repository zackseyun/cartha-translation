revisions:
- from: కాని ఆచారపరంగా శుద్ధుడై, ప్రయాణంలో లేని వ్యక్తి పస్కాను ఆచరించకుండా ఉంటే, ఆ వ్యక్తి తన ప్రజల మధ్యనుండి కొట్టివేయబడతాడు[a]. ఎందుకంటే అతడు యాహ్వే అర్పణను దాని నియమిత సమయంలో అర్పించలేదు. ఆ వ్యక్తి తన పాపాన్ని తానే భరిస్తాడు[b].
  to: కాని ఆచారపరంగా శుద్ధిగా ఉండి, ప్రయాణంలో లేని ఒక మనిషి పస్కాను ఆచరించకుండా మానితే, ఆ మనిషి తన ప్రజలలోనుండి కొట్టివేయబడతాడు[a]; ఎందుకంటే అతడు యాహ్వేకు అర్పించవలసిన అర్పణను దాని నియమిత సమయంలో అర్పించలేదు. ఆ మనిషి తన పాపాన్ని భరిస్తాడు[b].
  rationale: The revision preserves the source’s masculine referents, clarifies that the offering is owed to Yahweh, and improves idiomatic Telugu while retaining the ambiguity of the penalty and of bearing sin/guilt. Footnote anchors remain correctly attached to the respective expressions.
