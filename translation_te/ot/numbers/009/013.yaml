  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: te
  text: కాని ఆచారపరంగా శుద్ధిగా ఉండి, ప్రయాణంలో లేని ఒక మనిషి పస్కాను ఆచరించకుండా మానితే, ఆ మనిషి తన ప్రజలలోనుండి కొట్టివేయబడతాడు[a]; ఎందుకంటే అతడు యాహ్వేకు అర్పించవలసిన అర్పణను దాని నియమిత సమయంలో అర్పించలేదు. ఆ మనిషి తన పాపాన్ని భరిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొట్టివేయబడతాడు’ అనేది తీవ్రమైన నిబంధనాత్మక తీర్పును తెలిపే హీబ్రూ ఇడియమ్. అది ఇక్కడ ఖచ్చితంగా ఎలా అమలవుతుందో వచనం పేర్కొనదు. మూలంలో అక్షరార్థంగా, ‘ఆ ప్రాణం కొట్టివేయబడుతుంది’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన దోషాన్ని భరిస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: ఆచారపరంగా శుద్ధుడై
  rationale: ఈ సందర్భంలో ఈ పదం నైతిక పవిత్రతను కాక, ఆరాధనకు సంబంధించిన ఆచార శుద్ధిని సూచిస్తుంది. ‘ఆచారపరంగా’ అనే వివరణ ఆధునిక పాఠకునికి ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: ప్రయాణంలో లేని
  rationale: ముందటి సందర్భంలో ప్రయాణం వల్ల దూరంగా ఉన్నవారికి ఇచ్చిన మినహాయింపుతో ఇది వ్యత్యాసాన్ని చూపుతుంది.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: పస్కాను ఆచరించకుండా ఉంటే
  rationale: חָדַל ఇక్కడ మానుకోవడం లేదా చేయకపోవడం అనే భావాన్ని ఇస్తుంది; לעשות הפסח పస్కా ఆచరణను నిర్వహించడాన్ని సూచిస్తుంది.
- source_word: הַפֶּסַח
  choice: పస్కా
  rationale: ఈ పదం పస్కా బలిని గానీ మొత్తం పస్కా ఆచరణను గానీ సూచించగలదు. ఇక్కడ విస్తృతమైన ఆచరణ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; తరువాతి వాక్యం అర్పణ అంశాన్ని ప్రత్యేకంగా ప్రస్తావిస్తుంది.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి ... కొట్టివేయబడతాడు
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తిని సూచిస్తుంది. ‘కొట్టివేయబడతాడు’ అనే రూపం నిబంధనాత్మక న్యాయతీర్పు ఇడియమ్‌ను నిలుపుతుంది; దానిని కేవలం సమాజం నుండి వెలివేతగా పరిమితం చేయదు.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజల మధ్యనుండి
  rationale: స్త్రీలింగ ప్రత్యయం נֶפֶשׁ పదంతో వ్యాకరణపరంగా సరిపోతున్నా, అది ఇక్కడ చెప్పబడిన పురుషునినే సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘తన ప్రజల’ అని ఇచ్చాం.
- source_word: קָרְבַּן יְהוָה
  choice: యాహ్వే అర్పణను
  rationale: קָרְבָּן దేవుని సన్నిధికి తీసుకువచ్చే అర్పణను సూచించే సాధారణ పదం. దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా יְהוָהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בְּמֹעֲדוֹ
  choice: దాని నియమిత సమయంలో
  rationale: מוֹעֵד ఇక్కడ ఆచరణకు నిర్ణయించబడిన స్థిరమైన సమయాన్ని సూచిస్తుంది.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: తన పాపాన్ని తానే భరిస్తాడు
  rationale: ఈ ఇడియమ్ చేసిన పాపానికి సంబంధించిన బాధ్యతను, దాని పరిణామాలను మోయడాన్ని సూచిస్తుంది. ‘పాపం’ అనే మూల భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘దోషం’ అనే భావాన్ని అడుగుసూచనలో ఇచ్చాం.
- source_word: הָאִישׁ הַהוּא
  choice: ఆ వ్యక్తి
  rationale: మూలంలో పురుషవాచక ఏకవచనం ఉన్నప్పటికీ, తెలుగు సందర్భంలో ఇప్పటికే పేర్కొన్న వ్యక్తిని సహజంగా తిరిగి సూచించడానికి ‘ఆ వ్యక్తి’ వాడాం; లింగార్థాన్ని మార్చే సాధారణీకరణ చేయలేదు.
theological_decisions:
- issue: ‘ప్రజల మధ్యనుండి కొట్టివేయబడతాడు’ అనే శిక్ష స్వరూపం
  choice: శిక్షను అమలు చేసే ఖచ్చితమైన విధానాన్ని నిర్ధారించకుండా మూల ఇడియమ్‌ను నిలుపడం
  alternative: సమాజం నుండి వెలివేయబడతాడు; మరణశిక్ష పొందుతాడు; దేవుని తీర్పుకు గురవుతాడు
  rationale: ఈ వచనం ఆ శిక్ష వెలివేతనా, మరణమా, సంతానరాహిత్యమా, లేక నేరుగా కలిగే దైవతీర్పా అన్నది నిర్దిష్టంగా చెప్పదు. అందువల్ల ఆ నిబంధనాత్మక, న్యాయపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
- issue: חֶטְאוֹ יִשָּׂאలో పాపం, దోషం, పరిణామం మధ్య సంబంధం
  choice: ‘తన పాపాన్ని తానే భరిస్తాడు’ అనే మూల ఇడియమ్‌ను ఉంచడం
  alternative: తన దోషాన్ని భరిస్తాడు; తన పాపానికి శిక్షను అనుభవిస్తాడు
  rationale: ఈ మాట అపరాధ బాధ్యతతో పాటు దాని పరిణామాలను కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో ఒకే వివరణకు పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఆచారపరంగా శుద్ధుడు’ ద్వారా కర్మకాండ సంబంధిత భావాన్ని స్పష్టం చేశాం. ‘కొట్టివేయబడతాడు’, ‘పాపాన్ని భరిస్తాడు’ వంటి మూల ఇడియమ్‌లను సహజమైన తెలుగు నిర్మాణంలో ఉంచి, వాటి భావ పరిధిని అడుగుసూచనల్లో వివరించాం.
