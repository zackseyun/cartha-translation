id: NUM.9.12
reference: Numbers 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: te
  text: దానిలో ఏదీ ఉదయం వరకు మిగలనివ్వకూడదు; దానిలోని ఏ ఎముకనూ విరవకూడదు.[a] పస్కా నియమావళి అంతటి ప్రకారం వారు దాన్ని ఆచరించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఆజ్ఞ నిర్గమకాండము 12:46లోని పస్కా సూచనను ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
  - marker: b
    text: ‘పస్కా’ అనే పదం సందర్భానుసారం పస్కా ఆచారాన్ని, బలిని, లేదా భోజనాన్ని సూచించవచ్చు; ఇక్కడ అది ప్రధానంగా పస్కా ఆచరణను సూచిస్తుంది.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: దానిలో ఏదీ ఉదయం వరకు మిగలనివ్వకూడదు
  rationale: שׁאר యొక్క హిఫీల్ రూపం ‘మిగలనివ్వడం’ అనే భావాన్ని ఇస్తుంది; מִמֶּנּוּ ఇక్కడ భాగార్థకంగా ‘దానిలో ఏదీ’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: దానిలోని ఏ ఎముకనూ విరవకూడదు
  rationale: ఏకవచన עֶצֶם పంపిణీ భావంలో ఉంది. తెలుగులో ‘ఏ ఎముకనూ’ అనడం సహజంగా ఉండి, ఒక్క ఎముక కూడా విరగకూడదనే నిషేధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: పస్కాకు సంబంధించిన నియమమంతటి ప్రకారం
  rationale: חֻקָּה నిర్దేశిత నియమం లేదా విధిని సూచిస్తుంది; כָּל తో కూడిన ఏకవచనం పస్కా ఆచారానికి సంబంధించిన పూర్తి నియమావళిని సమష్టిగా సూచిస్తుంది.
- source_word: הַפֶּסַח
  choice: పస్కా
  rationale: ఈ పదం సందర్భంలో పస్కా బలి, భోజనం లేదా విస్తృత ఆచారాన్ని సూచించగలదు. ‘పస్కా’ ఆ విస్తృతార్థాన్ని అనవసరంగా కుదించదు.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: వారు దాన్ని ఆచరించాలి
  rationale: పండుగ లేదా నిర్దేశిత విధితో עשה వాడినప్పుడు ‘ఆచరించు/పాటించు’ అనే భావం వస్తుంది. ‘ఆచరించాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆచారసంబంధ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఎముక విరవకూడదనే ఆజ్ఞకు తరువాతి గ్రంథాంతర ప్రాముఖ్యత
  choice: ప్రధాన పాఠ్యంలో దీన్ని పస్కా నియమంగా నేరుగా అనువదించడం
  alternative: తరువాతి క్రైస్తవ నెరవేర్పు భావాన్ని ప్రధాన పాఠ్యంలోనే ముందుకు తెచ్చే పదప్రయోగం
  rationale: ఈ వచనపు తక్షణ సందర్భం పస్కా ఆచరణకు సంబంధించినది. తరువాతి గ్రంథాల్లో ఉన్న ప్రతిధ్వనిని అనువాదంలోకి దిగుమతి చేయకుండా, అవసరమైన సంబంధాన్ని పాదటిప్పణిలో సూచించడం మూలపాఠ్యానికి న్యాయం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. నిషేధాలకు ‘కూడదు’, ఆచార ఆజ్ఞకు ‘ఆచరించాలి’ వాడబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
