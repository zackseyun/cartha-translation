  to: దానిలో ఏదీ ఉదయం వరకు మిగలనివ్వకూడదు; దానిలోని ఏ ఎముకనూ విరవకూడదు.[a] పస్కా నియమావళి అంతటి ప్రకారం వారు దాన్ని ఆచరించాలి.[b]
