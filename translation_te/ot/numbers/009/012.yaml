review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys both prohibitions: no part of it is to be left until morning, and no bone of it is to be broken. It also correctly represents the final instruction as observance of the Passover in conformity with its full prescribed rule. The phrase “పస్కాకు సంబంధించిన నియమమంతటి” is understandable but is syntactically stiff and less idiomatic than a collective expression for the complete Passover ordinance.'
  naturalness: The first two clauses are clear modern Telugu. Replacing “నియమమంతటి” with “నియమావళి అంతటి” improves fluency while retaining the Hebrew singular collective sense. “మిగలనివ్వకూడదు,” “విరవకూడదు,” and “ఆచరించాలి” suit the formal instructional register.
  terminology: “పస్కా” is an appropriate established rendering of הַפֶּסַח. “ఆచరించాలి” naturally renders יַעֲשׂוּ אֹתוֹ in this ritual context. The cross-reference footnote belongs with the unbroken-bone clause. The explanatory note on “పస్కా” should not suggest that the final pronoun must refer specifically to the meal; the Hebrew term has ritual breadth here.
  issues:
  - severity: low
    issue: “పస్కాకు సంబంధించిన నియమమంతటి ప్రకారం” is stylistically awkward.
    rationale: Although it communicates the intended meaning, “నియమావళి అంతటి ప్రకారం” is more natural modern Telugu and preserves the sense of observing the Passover according to its entire prescribed ordinance.
  - severity: low
    issue: The note on “పస్కా” over-specifies “పస్కా భోజనం” as a possible referent for the final observance clause.
    rationale: In this clause הַפֶּסַח most naturally denotes the Passover observance/rite; a note may retain the term’s broader contextual range without narrowing the referent of “దాన్ని ఆచరించాలి.”
  revised_text: దానిలో ఏదీ ఉదయం వరకు మిగలనివ్వకూడదు; దానిలోని ఏ ఎముకనూ విరవకూడదు.[a] పస్కా నియమావళి అంతటి ప్రకారం వారు దాన్ని ఆచరించాలి.[b]
