id: NUM.9.8
reference: Numbers 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: te
  text: మోషే వారితో, “వేచి ఉండండి[a]; యాహ్వే మీ గురించి ఏమి ఆజ్ఞాపిస్తాడో నేను వింటాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిలబడండి”; ఇది హీబ్రూ ఆజ్ఞారూపానికి మరింత అక్షరార్థమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם מֹשֶׁה
  choice: మోషే వారితో ... అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది; אֲלֵהֶם లోని బహువచన సూచనను ‘వారితో’ నిలుపుతుంది.
- source_word: עִמְדוּ
  choice: వేచి ఉండండి
  rationale: మూలార్థం ‘నిలబడండి’ అయినా, ఇక్కడ సమాధానం వచ్చేవరకు అక్కడే ఉండమనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וְאֶשְׁמְעָה
  choice: నేను వింటాను
  rationale: మోషే యెహోవా నుండి సమాధానం వినాలనే సంకల్పాన్ని వ్యక్తపరుస్తుంది; మూలంలోని ‘వినుట’ రూపకాన్ని వివరించి చెప్పకుండా నిలుపుతుంది.
- source_word: מַה יְצַוֶּה
  choice: ఏమి ఆజ్ఞాపిస్తాడో
  rationale: מַה అనే ప్రశ్నార్థక పదాన్నీ, צוה పియేల్ రూపంలోని ‘ఆజ్ఞాపించు’ భావాన్నీ సహజమైన తెలుగు పరోక్ష ప్రశ్నగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచుతుంది; దానిని బిరుదుతో భర్తీ చేయదు.
- source_word: לָכֶם
  choice: మీ గురించి
  rationale: ఈ సందర్భంలో వారికి సంబంధించిన ఆజ్ఞ లేదా నిర్ణయం అనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘మీ కోసం’ లేదా ‘మీకు’ అనే అర్థసాధ్యతలను అతిగా నిర్దేశించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా సంరక్షిస్తుంది; ‘యాహ్వే’ శాస్త్రీయ పునర్నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. సంభాషణ సహజంగా ఉండేలా పదక్రమం మార్చినా, ‘వింటాను,’ ‘ఆజ్ఞాపిస్తాడో’ వంటి మూలపాఠ లక్షణాలు నిలుపబడ్డాయి.
