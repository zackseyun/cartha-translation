id: NUM.9.1
reference: Numbers 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: te
  text: 'ఇశ్రాయేలీయులు ఐగుప్తు దేశం నుండి బయలుదేరిన తర్వాత రెండవ సంవత్సరంలో, మొదటి నెలలో, సీనాయి అరణ్యంలో[a] యాహ్వే మోషేకు ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సీనాయి ఎడారిలో.’
    reason: מִדְבָּר అనే పదానికి ‘అరణ్యం,’ ‘ఎడారి’ అనే రెండూ సందర్భోచిత అర్థాలు.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవిక ప్రసంగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వావ్ కథన ప్రవాహాన్ని తెలుగు వాక్యక్రమం ద్వారా వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: דבר אֶל అనే ప్రయోగంలో ప్రసంగం ఉద్దేశించబడిన వ్యక్తిని సహజమైన తెలుగు రూపంలో సూచిస్తుంది.
- source_word: בְּמִדְבַּר סִינַי
  choice: సీనాయి అరణ్యంలో
  rationale: מִדְבָּר యొక్క జనావాసాలు తక్కువైన పొడి భూభాగం అనే భావాన్ని ‘అరణ్యం’ సహజంగా అందిస్తుంది; నిర్మాణ సంబంధాన్ని తెలుగు సమాసంతో నిలుపుతుంది.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: రెండో సంవత్సరంలో
  rationale: హీబ్రూ కాలసూచనకు నేరమైన, ఆధునిక తెలుగు రూపం.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: ఇశ్రాయేలు ప్రజలు ఐగుప్తు దేశం నుండి బయలుదేరిన
  rationale: కాలసంబంధ అర్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. హీబ్రూ ప్రత్యయం సూచించే ‘వారు’ ఎవరో సందర్భానుసారం ‘ఇశ్రాయేలు ప్రజలు’ అని స్పష్టం చేశాం; אֶרֶץ భావాన్ని ‘దేశం’గా నిలిపాం.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: హీబ్రూ కాలవ్యక్తీకరణను నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగు విరామచిహ్నంతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. మూల ఉచ్చారణ పూర్తిగా నిశ్చితం కానందున, సాధారణ తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన వాక్యక్రమాన్ని వాడాం. గంభీరతను నిలుపుతూ కృత్రిమమైన పదేపదే అనువాదాన్ని నివారించాం. తదుపరి ప్రత్యక్ష ప్రసంగాన్ని సూచించేందుకు వాక్యాంతంలో ద్విబిందువు పెట్టాం.
