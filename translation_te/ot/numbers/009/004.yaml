lexical_decisions:
- source_word: וַיְדַבֵּר ... אֶל
  choice: చెప్పాడు
  rationale: ఈ సందర్భంలో మోషే ప్రజలకు ఆజ్ఞను తెలియజేయడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే సమస్త ఇశ్రాయేలు ప్రజలను సూచించే సహజమైన తెలుగు రూపం.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: పస్కాను ఆచరించాలని
  rationale: ఇక్కడ עשה అనేది పస్కా విధిని నిర్వహించడం/పాటించడం అనే భావంలో ఉంది; ‘ఆచరించడం’ ఆ ఆచారపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది.
