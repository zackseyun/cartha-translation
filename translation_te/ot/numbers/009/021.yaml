id: NUM.9.21
reference: Numbers 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: te
  text: కొన్నిసార్లు మేఘం సాయంత్రం నుండి ఉదయం వరకు నిలిచి ఉండేది. ఉదయం మేఘం పైకి లేచినప్పుడు[a] వారు బయలుదేరేవారు. లేదా అది ఒక పగలూ ఒక రాత్రీ నిలిచి ఉంటే, మేఘం పైకి లేచినప్పుడు వారు బయలుదేరేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేఘం పైకి ఎత్తబడినప్పుడు.” సందర్భాన్ని బట్టి హీబ్రూ క్రియను ఇలా కూడా అర్థం చేసుకోవచ్చు; మేఘం పైకి లేవడం ఇశ్రాయేలీయులు బయలుదేరడానికి సంకేతం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: కొన్నిసార్లు
  rationale: ముందటి వచనాల్లో తెలిపిన సాధారణ విధానంలో అప్పుడప్పుడు సంభవించే ఒక పరిస్థితిని ఈ హీబ్రూ నుడికారం పరిచయం చేస్తుంది.
- source_word: יִהְיֶה הֶעָנָן
  choice: మేఘం ... నిలిచి ఉండేది
  rationale: היה అనే క్రియ ప్రాథమికంగా ‘ఉండు’ అని అర్థమైనా, ఇక్కడ కాలవ్యవధితో కలిసి మేఘం అక్కడే కొనసాగి ఉండడాన్ని సూచిస్తుంది.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: సాయంత్రం నుండి ఉదయం వరకు
  rationale: ప్రారంభం మరియు ముగింపును స్పష్టంగా తెలిపే సహజమైన తెలుగు కాలవ్యక్తీకరణ.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: మేఘం పైకి లేపబడినప్పుడు
  rationale: עלה రూపం మేఘం నివాసమందిరం మీదనుండి పైకి వెళ్లి ప్రయాణానికి సంకేతమివ్వడాన్ని సూచిస్తుంది; హీబ్రూలోని రూపసందిగ్ధతను ప్రతిబింబించేలా కర్మణి భావాన్ని నిలిపింది.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన
  rationale: కాలాన్ని సూచించే ఈ పదబంధానికి సహజమైన, సంక్షిప్త ఆధునిక తెలుగు రూపం.
- source_word: וְנָסָעוּ
  choice: వారు బయలుదేరేవారు
  rationale: అరణ్య ప్రయాణ సందర్భంలో נסע శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరేవారు’ పునరావృత విధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אוֹ
  choice: లేదా ... ఉంటే
  rationale: మొదటి పరిస్థితికి సమాంతరమైన ప్రత్యామ్నాయ పరిస్థితిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹמָם וָלַיְלָה
  choice: ఒక పగలూ ఒక రాత్రీ
  rationale: ఈ సందర్భంలో పగలు, రాత్రి రెండింటి కాలవ్యవధి అంతటా మేఘం నిలిచి ఉండడాన్ని సూచిస్తుంది; మూలంలోని జంట పదప్రయోగాన్ని నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వచనంలోని పునరావృత ప్రయాణ విధానాన్ని ‘నిలిచి ఉండేది/బయలుదేరేవారు’ రూపాలతో తెలిపి, మేఘం పైకి వెళ్లడంలో ఉన్న క్రియారూప సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా భద్రపరిచింది.
