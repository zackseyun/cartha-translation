id: NUM.9.11
reference: Numbers 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: te
  text: రెండవ నెల పద్నాలుగవ రోజున, సంధ్యవేళలో[a] వారు దాన్ని ఆచరించాలి; పులియని రొట్టెలతో, చేదు ఆకుకూరలతో దాన్ని తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “సాయంకాలాల మధ్య”; అంటే సూర్యాస్తమయం చుట్టుపక్కల సంధ్యాసమయం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: రెండవ నెల
  rationale: పంచాంగ సందర్భంలో חֹדֶשׁ అనే పదానికి సహజమైన అర్థం ‘నెల’; నిర్దిష్టమైన రెండవ నెలను ఈ పదబంధం సూచిస్తుంది.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: పద్నాలుగవ రోజున
  rationale: హీబ్రూ సంఖ్యా నిర్మాణం తేదీని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పద్నాలుగవ రోజున’ సహజంగా ఉంటుంది.
- source_word: בֵּין הָעַרְבַּיִם
  choice: సంధ్యవేళలో
  rationale: అక్షరార్థంగా ‘సాయంకాలాల మధ్య’ అనే ఈ కాలసూచక నానుడి సూర్యాస్తమయం చుట్టుపక్కల సంధ్యాసమయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో స్పష్టమైన తెలుగు రూపాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: వారు దాన్ని ఆచరించాలి
  rationale: పస్కా సందర్భంలో עשה కేవలం ‘చేయడం’ కాక, నిర్దేశించిన ఆచారాన్ని నిర్వహించడం లేదా పాటించడం అనే భావాన్ని ఇస్తుంది.
- source_word: עַל מַצּוֹת
  choice: పులియని రొట్టెలతో
  rationale: ఇక్కడ עַל సహభోజన భావాన్ని ఇస్తుంది; מַצּוֹת పులియబెట్టని రొట్టెలను సూచిస్తుంది.
- source_word: וּמְרֹרִים
  choice: చేదు ఆకుకూరలతో
  rationale: ఈ బహువచన నామవాచకం పస్కాతో తినే చేదు కూరలను సూచిస్తుంది; ‘చేదు ఆకుకూరలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: יֹאכְלֻהוּ
  choice: దాన్ని తినాలి
  rationale: ఇది తినడం అనే క్రియకు మూడవ పురుష ఏకవచన కర్మప్రత్యయం కలిగిన రూపం; ఆ ప్రత్యయం ముందున్న పస్కాను సూచిస్తుంది. ధర్మశాసన ఆదేశానికి తెలుగులో ‘తినాలి’ తగిన రూపం.
