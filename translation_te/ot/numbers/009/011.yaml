translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ధర్మశాసన శైలిని ఉపయోగించాం. ‘దాన్ని’ అనే సర్వనామం సందర్భంలోని పస్కా ఆచారం లేదా పస్కా బలిని సూచించే హీబ్రూ అస్పష్టతను అతిగా నిర్ధారించకుండా నిలుపుతుంది.
