source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: te
  text: నివాస గుడారాన్ని నిలబెట్టిన రోజున, మేఘం ఆ నివాస గుడారాన్ని, అంటే సాక్ష్యపు గుడారాన్ని[a], కప్పింది. సాయంత్రం వేళ అది నివాస గుడారం మీద ఉదయం వరకు అగ్నిలా కనిపించేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాక్షి గుడారం.” హీబ్రూ పదబంధాన్ని “సాక్ష్యపు గుడారం” లేదా “సాక్షి గుడారం” అని అనువదించవచ్చు. ఆరాధనా సందర్భంలో స్థిరపడిన పదంగా ఇక్కడ “సాక్ష్యం” వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הָקִים
  choice: నిలబెట్టిన రోజున
  rationale: కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది; ఆరంభంలోని וְ కు సందర్భానుసార అనుసంధాన భావం ఉన్నా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: הַמִּשְׁכָּן
  choice: నివాస మందిరం
  rationale: మూలపదంలోని ‘నివాస స్థలం’ భావాన్ని నిలుపుతూ, అరణ్య ప్రయాణంలోని పవిత్ర గుడార నిర్మాణాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּסָּה הֶעָנָן
  choice: మేఘం ... కప్పింది
  rationale: కప్పడం అనే క్రియ యొక్క ప్రత్యక్ష భౌతిక చిత్రణను సహజంగా నిలుపుతుంది; నిర్దిష్ట మేఘాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: అంటే సాక్ష్యపు గుడారాన్ని
  rationale: ఈ పదబంధాన్ని నివాస మందిరాన్ని మరింత స్పష్టంగా గుర్తించే సమానాధికార వివరణగా అందిస్తుంది. עֵדוּת కు స్థిరపడిన ఆరాధనా సందర్భ పదమైన ‘సాక్ష్యం’ను వాడింది.
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: సాయంత్రం వేళ అది ... కనిపించేది
  rationale: అసంపూర్ణ క్రియ ఇక్కడ పునరావృతమయ్యే లేదా కొనసాగిన గత స్థితిని సూచిస్తుంది; ‘కనిపించేది’ ఆ అలవాటైన దృశ్య స్థితిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: అగ్నిలా కనిపించేది
  rationale: మేఘం అగ్నియే అని చెప్పకుండా, దాని దృశ్యరూపం అగ్నిలా ఉందనే పోలికను కాపాడుతుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాల పరిమితిని సరళంగా, ఖచ్చితంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘నివాస మందిరం’ మరియు ‘సాక్ష్యపు గుడారం’ మధ్య సంబంధం
  choice: రెండవ పదబంధం మొదటిదాన్ని గుర్తించే సమానాధికార వివరణగా అనువదించడం
  alternative: לְ లోని భావాన్ని స్థలసూచకంగా లేదా దిశాసూచకంగా తీసుకొని, సాక్ష్యపు గుడారాన్ని వేరుగా సూచించడం
  rationale: వాక్య నిర్మాణంలో ‘సాక్ష్యపు గుడారం’ నివాస మందిరానికి వివరణగా ఉండటం అత్యంత సహజం. డాష్‌ల మధ్య ‘అంటే’ వాడటం ఈ సంబంధాన్ని స్పష్టం చేస్తుంది, కానీ రెండు వేరు నిర్మాణాలుగా చూపదు.
- issue: మేఘం మరియు అగ్ని మధ్య సంబంధం
  choice: దృశ్య పోలికగా ‘అగ్నిలా కనిపించేది’
  alternative: మేఘమే అగ్నిగా మారిందని లేదా అది అగ్నియేనని చెప్పడం
  rationale: כְּמַרְאֵה అనే మూలపదబంధం రూపసామ్యాన్ని సూచిస్తుంది; స్వరూప ఐక్యతను నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘నివాస మందిరం’ మూలపద భావాన్ని నిలుపుతుంది; ‘గుడారం’తో వచ్చే సమీప పునరుక్తిని తగ్గిస్తూ రెండు హీబ్రూ పదాల భేదాన్ని చూపుతుంది. పోలికను అతిశయింపకుండా ‘అగ్నిలా కనిపించేది’ అని సహజీకరించబడింది.
