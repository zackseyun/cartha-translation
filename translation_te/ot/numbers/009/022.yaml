id: NUM.9.22
reference: Numbers 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: te
  text: రెండు రోజులైనా, ఒక నెలైనా, లేదా ఎక్కువ కాలమైనా[a], మేఘం నివాస గుడారంపై నిలిచి ఉండగా ఇశ్రాయేలు ప్రజలు శిబిరం వేసి ఉండేవారు; బయలుదేరేవారు కాదు. కానీ అది పైకి లేచినప్పుడు వారు బయలుదేరేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చాలా రోజులైనా’; హీబ్రూలో అక్షరార్థంగా ‘రోజులు’ అని ఉంది. ఈ సందర్భంలో అది పొడిగిన కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: …అయినా, …అయినా, …అయినా
  rationale: పునరుక్తమైన విభాజక అవ్యయాలు సూచించే వివిధ కాలవ్యవధులను సహజమైన తెలుగు వరుసగా నిలుపుతుంది.
- source_word: יֹמַיִם
  choice: రెండు రోజులు
  rationale: ద్వివచన రూపం నిర్దిష్టంగా ‘రెండు రోజులు’ అని సూచిస్తుంది.
- source_word: חֹדֶשׁ
  choice: ఒక నెల
  rationale: కాలవ్యవధుల జాబితాలోని అనిర్దిష్ట ఏకవచన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יָמִים
  choice: ఇంకా ఎక్కువ రోజులు
  rationale: ‘రెండు రోజులు, ఒక నెల’ తరువాత వచ్చే సందర్భంలో ఇది పొడిగిన కాలాన్ని సూచిస్తుంది; ‘రోజులు’ అనే మూలరూపాన్నీ నిలుపుతుంది.
- source_word: בְּהַאֲרִיךְ
  choice: నిలిచి … అంతకాలం
  rationale: మేఘం అక్కడ దీర్ఘకాలం కొనసాగి ఉండడాన్ని సహజమైన కాలవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: అరణ్య ప్రయాణంలో నడిపించే మేఘానికి సాధారణమైన, స్పష్టమైన పదం.
- source_word: הַמִּשְׁכָּן
  choice: నివాసమందిరం
  rationale: దేవుని సాన్నిధ్య నివాస భావాన్ని, మోసుకుపోగల పవిత్ర గుడార సందర్భాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: לִשְׁכֹּן עָלָיו
  choice: దానిమీదే నివసించిన
  rationale: שכן క్రియలోని స్థిర నివాస భావాన్ని, משכןతో ఉన్న పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: יַחֲנוּ
  choice: శిబిరం వేసుకొని ఉండేవారు
  rationale: మేఘం నిలిచిన ప్రతిసారీ జరిగే అలవాటైన గత చర్యను, అక్కడే కొనసాగి ఉండే భావంతో తెలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ జాతీయ సమూహ సూచనను ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా తెలియజేస్తుంది.
- source_word: וְלֹא יִסָּעוּ
  choice: బయలుదేరేవారు కాదు
  rationale: శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבְהֵעָלֹתוֹ
  choice: అది పైకి లేచినప్పుడు
  rationale: మేఘం పైకి లేవడం ప్రయాణానికి సంకేతమనే ప్రత్యక్ష సందర్భాన్ని నిలుపుతుంది; క్రియను అనవసరంగా కర్మణి రూపంలో నిర్ణయించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కాలవ్యవధుల వరుస, మేఘం నిలిచి ఉండడం–పైకి లేవడం మధ్య వ్యత్యాసం, పునరావృత చర్య భావం నిలుపబడ్డాయి.
