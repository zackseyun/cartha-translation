id: NUM.9.10
reference: Numbers 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు: ‘మీలోగానీ, మీ తరతరాల్లోగానీ ఎవడైనా శవం వల్ల అపవిత్రుడై ఉన్నా, లేదా దూర ప్రయాణంలో ఉన్నా, అతడు యాహ్వేకు పస్కాను ఆచరించాలి.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, ఆజ్ఞారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אִישׁ
  choice: ఎవడైనా
  rationale: పునరుక్త పురుష ఏకవచనం ప్రతి వ్యక్తికి వర్తించే భావాన్ని ఇస్తుంది; ‘ఎవడైనా’ ఆ పురుషరూపాన్నీ పంపిణీ భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: శవం వల్ల అపవిత్రుడై ఉన్నా
  rationale: యాజకసంబంధ న్యాయ సందర్భంలో ఈ హీబ్రూ నుడికారం మృతదేహస్పర్శ వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సూచిస్తుంది.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: దూర ప్రయాణంలో
  rationale: అక్షరార్థంగా ‘దూరమైన మార్గంలో’; సందర్భంలో దూరప్రాంతానికి ప్రయాణంలో ఉండడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: మీలోగానీ, మీ తరతరాల్లోగానీ
  rationale: ప్రస్తుత సమాజానికీ రాబోయే తరాలకూ ఈ నియమం వర్తిస్తుందనే సమాంతర పరిధిని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וְעָשָׂה פֶסַח
  choice: పస్కాను ఆచరించాలి
  rationale: ‘పస్కాను చేయడం’ అనే హీబ్రూ నుడికారానికి ‘పస్కాను ఆచరించడం’ సహజమైన తెలుగు సమానం; మూలంలో లేని ‘అయినప్పటికీ’ వంటి భావాన్ని చేర్చదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, לְ ఉపసర్గను ‘కు’తో సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
- issue: వాక్యంలోని విధి లేదా అనుమతి భావం
  choice: ఆచరించాలి
  alternative: ఆచరించవచ్చు / అయినప్పటికీ ఆచరించాలి
  rationale: וְעָשָׂה సందర్భంలో విధిని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని అనుమతి భావాన్నీ ‘అయినప్పటికీ’ అనే అదనపు నొక్కునీ చేర్చకుండా బాధ్యతను నిలుపుతుంది.
- issue: లింగరూపంతో కూడిన న్యాయపరమైన సంబోధన
  choice: ఇశ్రాయేలు కుమారులు / ఎవడైనా
  alternative: ఇశ్రాయేలీయులు / ఎవరైనా
  rationale: మూలంలోని పురుషరూపాలను నిలుపుతుంది; ‘ఇశ్రాయేలు కుమారులు’ సమాజమంతటినీ సూచించే సాంప్రదాయ సమూహపదబంధం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కాని సులభగ్రాహ్యమైన న్యాయవాక్య శైలి. మూలంలో లేని ‘ఇప్పటికీ’ లేదా అనుమతి భావాన్ని చేర్చలేదు. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదాన్ని ఉపయోగించింది.
