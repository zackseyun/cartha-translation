id: NUM.9.6
reference: Numbers 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: te
  text: మనుష్య శవం కారణంగా అపవిత్రులైన కొందరు పురుషులు ఉన్నారు[a]. అందువల్ల వారు ఆ రోజున పస్కాను ఆచరించలేకపోయారు. అదే రోజున వారు మోషే, అహరోనుల ఎదుటకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మనిషి నెఫెష్ నిమిత్తం అపవిత్రులు.” ఇక్కడ ఇది మనుష్య శవం వల్ల కలిగిన అపవిత్రతను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: కొందరు పురుషులు ఉన్నారు
  rationale: వַיְהִי కథనంలో ఒక పరిస్థితిని పరిచయం చేస్తుంది; אֲנָשִׁים పురుష బహువచనం. సహజమైన ఆధునిక తెలుగులో దృశ్యాన్ని పరిచయం చేస్తూ రెండింటి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: మనుష్య శవం కారణంగా అపవిత్రులైన
  rationale: యాజక సంబంధమైన శుద్ధి సందర్భంలో ఇది మనిషి మృతదేహం వల్ల కలిగిన ఆచారపరమైన అపవిత్రతను సూచించే హీబ్రూ నుడికారం; నైతిక దోషాన్ని సూచించదు.
- source_word: וְלֹא יָכְלוּ
  choice: అందువల్ల వారు ... ఆచరించలేకపోయారు
  rationale: ముందు చెప్పిన అపవిత్రత వల్ల ఏర్పడిన అసమర్థతను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: పస్కాను ఆచరించలేకపోయారు
  rationale: అక్షరార్థంగా ‘పస్కాను చేయడం’; ఇక్కడ నియమిత పస్కా ఆచరణను నిర్వహించడమే భావం. ‘ఆచరించు’ పండుగ ఉల్లాసాన్ని మాత్రమే సూచించకుండా ధార్మిక విధిని తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున / అదే రోజున
  rationale: మొదటి సందర్భంలో సూటి కాలసూచన; రెండో సందర్భంలో హీబ్రూలోని పునరుక్తిని నిలుపుతూ అదే దినాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: ఎదుటికి వచ్చారు
  rationale: ‘దగ్గరకు వచ్చి ఎదుట నిలవడం’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; దీనిని న్యాయపరమైన వినతిగా అతిగా వ్యాఖ్యానించదు.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: మోషే, అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలు.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: మనుష్య శవం వల్ల కలిగిన ఆచారపరమైన అపవిత్రతగా అనువదించడం
  alternative: ‘మనిషి ప్రాణం నిమిత్తం అపవిత్రులు’ అని అక్షరానువాదం చేయడం
  rationale: పంచగ్రంథంలోని శుద్ధి నియమాల సందర్భంలో ఈ నుడికారం మరణించిన మనిషి శవంతో సంబంధం వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; వ్యక్తిగత పాపం లేదా నైతిక అపవిత్రతను పాఠ్యంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘అపవిత్రులు’ అనే పదం ఆచారపరమైన స్థితిని సూచిస్తుంది. మూలంలోని ‘ఆ రోజున’ అనే పునరుక్తి భావాన్ని నిలుపుటకు రెండోసారి ‘అదే రోజున’ వాడబడింది.
