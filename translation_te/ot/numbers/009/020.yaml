revisions:
- from: కొన్నిసార్లు మేఘం నివాసమందిరం మీద కొన్ని రోజులు నిలిచి ఉండేది. యెహోవా ఆజ్ఞ ప్రకారం[a] వారు శిబిరం వేసి ఉండేవారు; యెహోవా ఆజ్ఞ ప్రకారం బయలుదేరేవారు.
  to: కొన్నిసార్లు మేఘం నివాస గుడారం మీద కొన్ని రోజులపాటు ఉండేది; యాహ్వే ఆజ్ఞ ప్రకారం వారు శిబిరం వేసేవారు, యాహ్వే ఆజ్ఞ ప్రకారం బయలుదేరేవారు.[a]
  rationale: The revision retains the source’s habitual sequence and the intentionally unspecified number of days, while improving Mishkan terminology, avoiding an added durative nuance for camping, and conforming the divine-name rendering to the POB audit trail. The note remains anchored to the second occurrence, where it explains the repeated Hebrew idiom without unnecessarily duplicating a note marker.
  reviewer_model: gpt-5.6-terra
