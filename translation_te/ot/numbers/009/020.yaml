id: NUM.9.20
reference: Numbers 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: te
  text: కొన్నిసార్లు మేఘం నివాస గుడారం మీద కొన్ని రోజులపాటు ఉండేది; యాహ్వే ఆజ్ఞ ప్రకారం వారు శిబిరం వేసేవారు, యాహ్వే ఆజ్ఞ ప్రకారం బయలుదేరేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘యాహ్వే నోటి ప్రకారం’; అంటే, యాహ్వే ఆజ్ఞ ప్రకారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: కొన్నిసార్లు
  rationale: వివిధ కాలవ్యవధుల వరుసలో అప్పుడప్పుడు సంభవించే పరిస్థితిని ఈ హీబ్రూ ప్రయోగం సూచిస్తుంది; ఆధునిక తెలుగులో ‘కొన్నిసార్లు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: יִהְיֶה הֶעָנָן
  choice: మేఘం ... నిలిచి ఉండేది
  rationale: ప్రయాణ సందర్భంలో היה కేవలం ఉనికిని కాక, ఒక చోట కొనసాగి ఉండడాన్ని సూచిస్తుంది.
- source_word: יָמִים מִסְפָּר
  choice: కొన్ని రోజులు
  rationale: అక్షరార్థంగా ‘లెక్కించబడిన రోజులు’; పరిమితమైన, నిర్దిష్టంగా చెప్పని రోజుల సంఖ్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הַמִּשְׁכָּן
  choice: నివాసమందిరం మీద
  rationale: מִשְׁכָּן అరణ్యంలో దేవుని పవిత్ర నివాస నిర్మాణాన్ని సూచిస్తుంది; ‘నివాసమందిరం’ పదార్థాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: ఈ ప్రయోగానికి అక్షరార్థం ‘యెహోవా నోటి ప్రకారం’; సందర్భంలో అది ఆయన అధికారపూర్వక ఆదేశాన్ని సూచిస్తుంది.
- source_word: יַחֲנוּ
  choice: వారు శిబిరం వేసి ఉండేవారు
  rationale: ఇక్కడ అసంపూర్ణ క్రియ పునరావృతమైన ఆచరణను తెలియజేస్తుంది; మేఘం నిలిచినంతకాలం వారు అక్కడే శిబిరంలో ఉండే భావాన్ని కూడా సందర్భానుగుణంగా అందిస్తుంది.
- source_word: יִסָּעוּ
  choice: బయలుదేరేవారు
  rationale: נסע ఈ అరణ్య ప్రయాణ సందర్భంలో శిబిరాన్ని విడిచి తదుపరి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; కాబట్టి దాన్ని బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన రూపంతో అందించాం.
- issue: עַל פִּי יְהוָה లోని శరీరాంగ రూపకం
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  alternative: యెహోవా నోటి ప్రకారం
  rationale: ‘నోటి ప్రకారం’ అనే అక్షర రూపం దైవ ఆదేశాన్ని సూచించే హీబ్రూ నుడికారం. ప్రధాన పాఠంలో ఉద్దేశిత భావాన్ని సహజంగా ఇచ్చి, మూలరూపాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. కథనంలోని పునరావృత చర్యను ‘ఉండేవారు/బయలుదేరేవారు’ రూపాలు తెలియజేస్తాయి.
