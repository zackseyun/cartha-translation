id: NUM.9.23
reference: Numbers 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: te
  text: యాహ్వే ఆజ్ఞ ప్రకారం వారు శిబిరం వేశారు; యాహ్వే ఆజ్ఞ ప్రకారం వారు బయలుదేరారు. మోషే ద్వారా ఇచ్చిన యాహ్వే ఆజ్ఞ ప్రకారం వారు యాహ్వే విధించిన విధిని పాటించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל־פִּי
  choice: ఆజ్ఞ ప్రకారం
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘నోటి ప్రకారం’ అని ఉన్నా, ఇక్కడ అధికారపూర్వకమైన నిర్దేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞ ప్రకారం’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: יַחֲנוּ
  choice: వారు బసచేశారు
  rationale: ప్రయాణ మధ్యలో శిబిరం వేసి నిలిచివుండడాన్ని సూచిస్తుంది. ‘బసచేశారు’ సాధారణ పాఠకులకు సహజమైన ఆధునిక తెలుగు.
- source_word: יִסָּעוּ
  choice: వారు బయలుదేరారు
  rationale: శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడమే సందర్భంలోని భావం. ‘బయలుదేరారు’ ఆ కదలికను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִשְׁמֶרֶת יְהוָה
  choice: యాహ్వే అప్పగించిన బాధ్యత
  rationale: מִשְׁמֶרֶת అనేది కాపాడవలసిన లేదా నెరవేర్చవలసిన అప్పగింతను సూచిస్తుంది. ‘అప్పగించిన బాధ్యత’ దాని సంరక్షణ, విధేయత అనే రెండు ఛాయలనూ తెలియజేస్తుంది.
- source_word: שָׁמָרוּ
  choice: పాటించారు
  rationale: ఈ క్రియకు కాపాడడం, గమనించడం, ఆచరించడం అనే అర్థాలు ఉన్నాయి. ‘బాధ్యత’తో కలిసినప్పుడు ‘పాటించారు’ విధేయంగా నెరవేర్చిన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అనే ఈ నుడికారం మధ్యవర్తిత్వం లేదా సాధనత్వాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన ‘మోషే ద్వారా’ వాడి, మూల రూపాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన రూపంలో ధ్వన్యంతరీకరించాం.
- issue: בְּיַד מֹשֶׁהలో మోషే పాత్ర
  choice: మోషే ద్వారా వచ్చిన ఆజ్ఞ
  alternative: మోషే చేతి ద్వారా
  rationale: ఈ నుడికారం మోషేను ఆజ్ఞకు మూలంగా కాక, యాహ్వే ఆజ్ఞను అందించిన మధ్యవర్తిగా చూపుతుంది. అందువల్ల దైవాధికారాన్నీ మోషే మధ్యవర్తిత్వాన్నీ రెండింటినీ వాక్యం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. మొదటి రెండు సమాంతర వాక్యాలలో మూలంలోని పునరుక్తి, లయ నిలుపబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత ‘మోషే ద్వారా’ అన్న పదబంధం వద్ద ఉంచబడింది.
