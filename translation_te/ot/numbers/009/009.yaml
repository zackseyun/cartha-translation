  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా పలికాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “YHWH”; సాంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; అందువల్ల ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. తరువాతి לֵאמֹר మాటల విషయాన్ని పరిచయం చేస్తున్నందున, ‘అన్నాడు’ తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: హీబ్రూ అక్షరార్థం ‘మోషేకు’; అయితే మాట్లాడే క్రియతో తెలుగులో ‘మోషేతో ... అన్నాడు’ సహజమైన, ఖచ్చితమైన సంబంధాన్ని వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ ఇన్ఫినిటివ్ నిర్మాణం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా అన్నాడు:’ ఆ కార్యాన్ని స్పష్టంగా, సహజంగా నిర్వహిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. తరువాత వచ్చే దైవవాక్యాన్ని పరిచయం చేయడానికి ముగింపులో ద్విబిందువు ఉపయోగించబడింది.
