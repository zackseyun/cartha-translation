revisions:
- from: 'ఆ మనుషులు అతనితో ఇలా అన్నారు: “ఒక మనిషి మృతదేహం వల్ల మేము అపవిత్రులమయ్యాం.[a] ఇశ్రాయేలు కుమారుల[c] మధ్య యాహ్వే అర్పణను దాని నియమిత సమయంలో సమర్పించనీయకుండా మమ్మల్ని ఎందుకు దూరం పెట్టాలి?[b]”'
  to: 'ఆ మనుషులు అతనితో ఇలా అన్నారు: “మానవ మృతదేహం కారణంగా మేము అపవిత్రులమై ఉన్నాం.[a] ఇశ్రాయేలు కుమారుల[c] మధ్య యాహ్వేకు అర్పించే అర్పణను దాని నిర్ణీత సమయంలో సమర్పించకుండా మేము ఎందుకు నిరోధించబడాలి?[b]”'
  rationale: The revision preserves the Hebrew’s ritual-impurity idiom and rhetorical passive construction, while using idiomatic modern Telugu. It retains “యాహ్వే” for יהוה and keeps the source expression “ఇశ్రాయేలు కుమారులు,” with a clarifying footnote. Footnote anchors are retained in meaningful locations and their explanatory content is corrected.
