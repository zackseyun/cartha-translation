source:
  edition: WLC
  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: te
  text: 'ఆ మనుషులు అతనితో ఇలా అన్నారు: “మానవ మృతదేహం కారణంగా మేము అపవిత్రులమై ఉన్నాం.[a] ఇశ్రాయేలు కుమారుల[c] మధ్య యాహ్వేకు అర్పించే అర్పణను దాని నిర్ణీత సమయంలో సమర్పించకుండా మేము ఎందుకు నిరోధించబడాలి?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక మనిషి ప్రాణం నిమిత్తం అపవిత్రులం.” ఇది మానవ మృతదేహంతో సంబంధం వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వేకు అర్పించే అర్పణను ... సమర్పించకుండా మమ్మల్ని ఎందుకు అడ్డుకోవాలి?” లేదా “ఎందుకు మమ్మల్ని మినహాయించాలి?”
    reason: alternative_reading
  - marker: c
    text: “ఇశ్రాయేలు కుమారులు” అనేది హీబ్రూ వ్యక్తీకరణ; భావం “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: ఆ మనుషులు అతనితో ఇలా అన్నారు
  rationale: హీబ్రూ కథన శైలిని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది; הָהֵמָּה లోని సూచనార్థాన్ని ‘ఆ’ నిలుపుతుంది.
- source_word: טְמֵאִים
  choice: అపవిత్రులమయ్యాం
  rationale: ఇక్కడ ఆచారపరమైన అపవిత్రత ఉద్దేశించబడింది; ‘అపవిత్రులు’ అనే పదం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְנֶפֶשׁ אָדָם
  choice: ఒక మనిషి మృతదేహం వల్ల
  rationale: అక్షరార్థంగా ‘మనిషి ప్రాణం/వ్యక్తి నిమిత్తం’ అయిన ఈ యాజక ధర్మశాస్త్ర పదబంధం, మానవ మృతదేహం కారణంగా కలిగే అపవిత్రతను సూచిస్తుంది.
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: సమర్పించనీయకుండా మమ్మల్ని ఎందుకు దూరం పెట్టాలి?
  rationale: נגרע యొక్క తగ్గించబడటం లేదా భాగస్వామ్యం నుంచి తొలగించబడటం అనే భావాన్ని, బలి సమర్పణలో పాల్గొననీయకపోవడంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: קָרְבַּן יְהוָה
  choice: యాహ్వే అర్పణ
  rationale: קָרְבָּן ను బలిగా దేవుని దగ్గరకు తీసుకువచ్చే ‘అర్పణ’గా, יהוה ను వ్యక్తిగత దైవనామమైన ‘యాహ్వే’గా అందిస్తుంది.
- source_word: בְּמֹעֲדוֹ
  choice: దాని నియమిత సమయంలో
  rationale: מוֹעֵד ఇక్కడ దేవుడు నిర్ణయించిన నిర్దిష్ట పండుగ సమయాన్ని సూచిస్తుంది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్య
  rationale: మూలంలోని సాంప్రదాయిక నిబంధన సంబంధిత జాతినామాన్ని రూపపరంగా నిలుపుతుంది; తెలుగులో అర్థమయ్యే నిర్మాణం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ అనే వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల దాన్ని ధ్వన్యనుకరణగా నిలిపాం.
- issue: לְנֶפֶשׁ אָדָם వల్ల కలిగే అపవిత్రత
  choice: ఒక మనిషి మృతదేహం వల్ల
  alternative: మృతదేహాన్ని తాకడం వల్ల; చనిపోయిన వ్యక్తి వల్ల
  rationale: మూలపదబంధం మృతదేహ సంబంధ అపవిత్రతను సూచిస్తుంది. ‘తాకడం’ సాధారణ సందర్భార్థమైనా ఈ వచనంలో క్రియగా స్పష్టంగా లేదు కాబట్టి ప్రధాన పాఠంలో చేర్చలేదు.
- issue: נִגָּרַע యొక్క భావం
  choice: మమ్మల్ని ... దూరం పెట్టాలి
  alternative: మమ్మల్ని ... అడ్డుకోవాలి; మమ్మల్ని మినహాయించాలి
  rationale: బలి అర్పించే సమాజ భాగస్వామ్యం నుంచి తొలగింపబడుతున్నామనే వారి ప్రశ్నను నిలుపుతుంది; అది న్యాయమా కాదా అనే విషయాన్ని అనువాదం ముందుగానే తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ వాడబడింది. ఆచారపరమైన ‘అపవిత్రత,’ బలి సంబంధ ‘అర్పణ,’ దైవనామం ‘యాహ్వే’ వంటి కీలక పదాలు స్పష్టంగా నిలుపబడ్డాయి. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ ప్రధాన పాఠంలో ఉంచి, సహజ భావాన్ని పాదసూచికలో ఇచ్చాం.
