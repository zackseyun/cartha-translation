  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: te
  text: ఒకవేళ మీతో నివసించే పరదేశి[a] యాహ్వేకు పస్కాను ఆచరిస్తే[b], అతడు పస్కా నియమం ప్రకారం, దాని విధానం ప్రకారం దానిని ఆచరించాలి. మీకూ, పరదేశికీ, దేశపు స్థానికునికీ[c] ఒకే నియమం ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ మధ్య నివసించే విదేశీయుడు.” హీబ్రూ గేర్ అనేది కేవలం ప్రయాణికుణ్ణి కాదు, ఇశ్రాయేలీయుల మధ్య నివసించే విదేశీయుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “పస్కాను చేస్తే”; ఇది పస్కాను పాటించడం లేదా ఆచరించడం అనే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “దేశంలో పుట్టినవానికీ.” ఇక్కడ పరదేశికి భిన్నంగా దేశానికి చెందిన స్థానికుడు ఉద్దేశించబడ్డాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: …అనుకుంటే
  rationale: ముందున్న నియమంతో సంబంధాన్ని కొనసాగిస్తూ షరతుతో కూడిన సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יָגוּר ... גֵּר
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: גֵּר కేవలం ప్రయాణికుణ్ణి కాక, ఇశ్రాయేలీయుల మధ్య నివసించే విదేశీయుణ్ణి సూచిస్తుంది; ‘పరదేశి’ ఆ న్యాయపరమైన భేదాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְעָשָׂה פֶסַח
  choice: పస్కాను ఆచరించాలనుకుంటే
  rationale: ‘పస్కాను చేయడం’ అనే హీబ్రూ నుడికారానికి ‘పస్కాను ఆచరించడం’ సహజమైన తెలుగు; సందర్భంలోని స్వచ్ఛంద ఉద్దేశాన్ని షరతు వాక్యంలో స్పష్టం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఇస్తుంది; ל ఆచరణ ఎవరికి అంకితమో సూచిస్తుంది.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: పస్కా నియమం ప్రకారం
  rationale: חֻקָּה నిర్దేశించబడిన శాసనాన్ని లేదా నియమాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి ‘నియమం’ స్పష్టంగా ఉంటుంది.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: దాని విధానం ప్రకారం
  rationale: ఈ సందర్భంలో מִשְׁפָּט ఆ ఆచారాన్ని నిర్వహించవలసిన పద్ధతి లేదా నిర్ణీత విధానాన్ని సూచిస్తుంది; ముందు పదమైన חֻקָּהతో ఉన్న సూక్ష్మ భేదాన్ని నిలుపుతుంది.
- source_word: כֵּן יַעֲשֶׂה
  choice: అతడు … దానిని ఆచరించాలి
  rationale: నిర్దేశించిన రీతికే అనుగుణంగా చేయాలనే ఆజ్ఞాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: ఒకే నియమం ఉండాలి
  rationale: రెండు వర్గాలకూ ఒకటే బద్ధమైన ప్రమాణం వర్తిస్తుందని స్పష్టంగా, న్యాయపరమైన స్వరంతో చెబుతుంది.
- source_word: לָכֶם וְלַגֵּר
  choice: మీకూ, పరదేశికీ
  rationale: పునరుక్త ఉపసర్గలోని సమాన అన్వయాన్ని తెలుగు ‘కూ/కీ’ రూపాలు నిలుపుతాయి.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: దేశంలో పుట్టినవానికీ
  rationale: אֶזְרַח భూమికి చెందిన స్థానిక జన్ముడిని గֵּר‌కు విరుద్ధంగా సూచిస్తుంది; ఆధునిక రాజకీయ భావం గల ‘పౌరుడు’ అనే పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా ఉంచాం. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో తెలిపాం.
- issue: పస్కా విషయంలో ఇశ్రాయేలీయునికీ నివాస పరదేశికీ వర్తించే నియమం
  choice: ఈ పస్కా ఆచరణ సందర్భంలో ఒకే నియమం ఇద్దరికీ వర్తిస్తుంది
  alternative: ఇది అనుమతిని మాత్రమే ఇస్తుంది; సమాన నియమాన్ని నొక్కిచెప్పదు
  rationale: ‘ఒకే నియమం’ అని మూలపాఠం స్పష్టంగా చెబుతుంది. అయితే ఈ వాక్యపు పరిధిని పస్కా ఆచరణకు మించి విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆచార శైలిని ఉపయోగించాం. ‘నియమం’ మరియు ‘విధానం’ ద్వారా חֻקָּה, מִשְׁפָּט మధ్య సందర్భోచిత భేదాన్ని ఉంచాం; భాషను అతిగా గ్రాంథికం చేయలేదు.
