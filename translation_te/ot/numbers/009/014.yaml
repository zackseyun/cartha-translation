revisions:
- from: మీ మధ్య నివసించే పరదేశి యెహోవాకు[a] పస్కాను ఆచరించాలనుకుంటే[b], అతడు పస్కా నియమం ప్రకారం, దాని విధానం ప్రకారం దానిని ఆచరించాలి. మీకూ, పరదేశికీ, దేశంలో పుట్టినవానికీ[c] ఒకే నియమం ఉండాలి.
