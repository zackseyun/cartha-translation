review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the resident foreigner, Passover observance, prescribed statute and procedure, and the single rule applying to both groups. However, “ఆచరించాలనుకుంటే” adds an explicit volitional sense (“wants to observe”) that is not stated in the Hebrew. The rendering of יהוה as “యెహోవా” also does not follow the supplied POB audit decision, which specifies “Yahweh.”
  naturalness: The legal-ritual register is clear and modern. “ఒకవేళ మీతో నివసించే పరదేశి” is more idiomatic than the present opening, and “స్థానికునికీ” avoids a needlessly masculine generic expression while retaining the contrast with the resident foreigner.
  terminology: Retain “పరదేశి” for גֵּר, with a note clarifying that it means a resident foreigner rather than a transient traveler. Use “యాహ్వే” for יהוה in accordance with the project’s stated terminology decision. “నియమం” and “విధానం” adequately preserve the contextual distinction between חֻקָּה and מִשְׁפָּט.
  issues:
  - severity: medium
    issue: “ఆచరించాలనుకుంటే” introduces an unstated intention.
    rationale: וְעָשָׂה פֶסַח means ‘and observes/keeps the Passover’ in this conditional setting. The Hebrew does not explicitly say that the resident foreigner merely desires or intends to do so.
  - severity: medium
    issue: The divine name is rendered “యెహోవా” rather than “యాహ్వే.”
    rationale: The supplied English POB theological decision explicitly adopts “Yahweh” for יהוה. The Telugu rendering should align with that audit decision.
  - severity: low
    issue: Footnote a is attached to the divine name but addresses only an alternative transliteration.
    rationale: The more textually useful lexical note in this verse concerns גֵּר (‘resident foreigner’). Moving the anchor to “పరదేశి” accurately supports the relevant source term.
  revised_text: ఒకవేళ మీతో నివసించే పరదేశి[a] యాహ్వేకు పస్కాను ఆచరిస్తే[b], అతడు పస్కా నియమం ప్రకారం, దాని విధానం ప్రకారం దానిని ఆచరించాలి. మీకూ, పరదేశికీ, దేశపు స్థానికునికీ[c] ఒకే నియమం ఉండాలి.
