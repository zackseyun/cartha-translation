source:
  edition: WLC
  text: וְ/יַעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת הַ/פָּ֖סַח בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు పస్కాను దాని నియమిత సమయంలో ఆచరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతానం.’ హీబ్రూలో అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: ఆచరించాలి
  rationale: עשה అనే క్రియకు ప్రాథమికంగా ‘చేయు’ అనే అర్థం ఉన్నా, פֶּסַח దాని కర్మగా వచ్చినప్పుడు పస్కాను విధిగా ఆచరించడం అనే భావం వస్తుంది. సందర్భంలోని ఆజ్ఞార్థక బలాన్ని తెలుగులో ‘ఆచరించాలి’ సహజంగా వ్యక్తం చేస్తుంది; మొదటి וְ వాక్యప్రవాహాన్ని కలుపుతున్నందున ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు.’ ‘ఇశ్రాయేలీయులు’ అని సాధారణీకరించకుండా మూలంలోని కుటుంబసంబంధ రూపకాన్ని, పురుషలింగ సూచనను నిలుపుతుంది.
- source_word: הַפָּסַח
  choice: పస్కాను
  rationale: פֶּסַח ఇక్కడ పస్కా ఆచరణను విస్తృతంగా సూచిస్తుంది. ‘పస్కా బలి’ లేదా ‘పస్కా పండుగ’ అని పేర్కొంటే మూలపాఠం కంటే భావం సంకుచితమవుతుంది.
- source_word: בְּמוֹעֲדוֹ
  choice: దాని నియమిత సమయంలో
  rationale: מוֹעֵד నియమించబడిన సమయాన్ని సూచిస్తుంది; ప్రత్యయం పస్కాను తిరిగి సూచిస్తుంది. ‘దాని నియమిత సమయంలో’ అనే రూపం ఆ స్వామ్యసంబంధాన్ని, కాలపట్టికలోని నిర్దిష్టతను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞార్థక భావాన్ని ‘ఆచరించాలి’తో, కుటుంబసంబంధ పదబంధాన్ని ‘ఇశ్రాయేలు కుమారులు’తో నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
