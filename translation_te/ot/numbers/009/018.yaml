id: NUM.9.18
reference: Numbers 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: te
  text: యహ్వే ఆజ్ఞ ప్రకారం[a] ఇశ్రాయేలీయులు బయలుదేరేవారు; యహ్వే ఆజ్ఞ ప్రకారం వారు శిబిరం వేసేవారు. మేఘం నివాస గుడారం మీద నిలిచి ఉన్న రోజులన్నీ వారు శిబిరంలోనే ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: ‘యహ్వే నోటి ప్రకారం’; ఇది ‘యహ్వే ఆజ్ఞ ప్రకారం’ అనే అర్థమిచ్చే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: యహ్వే ఆజ్ఞ ప్రకారం
  rationale: ఈ హీబ్రూ నుడికారానికి అక్షరార్థం ‘యహ్వే నోటి ప్రకారం’; సందర్భంలో అది ఆయన అధికారపూర్వక ఆదేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞ ప్రకారం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యహ్వే’ అని ఇచ్చాం.
- source_word: יִסְעוּ
  choice: బయలుదేరేవారు
  rationale: ప్రయాణ సందర్భంలో נסע శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది. పునరావృతంగా జరిగే చర్యను సందర్భానుసారంగా ‘బయలుదేరేవారు’ తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ సహజమైన, సమగ్ర ఆధునిక తెలుగు రూపం.
- source_word: יַחֲנוּ
  choice: శిబిరం వేసేవారు / శిబిరంలోనే ఉండేవారు
  rationale: חנה అంటే శిబిరం వేయడం. మొదటి చోట చర్యను ‘శిబిరం వేసేవారు’ అని, కాలవ్యవధిని తెలిపే చివరి చోట కొనసాగిన స్థితిని ‘శిబిరంలోనే ఉండేవారు’ అని వ్యక్తం చేశాం.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: ఉన్న రోజులన్నీ
  rationale: మూలంలోని ‘అన్ని రోజులు’ అనే కాలవ్యవధి భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: יִשְׁכֹּן
  choice: నిలిచి ఉన్న
  rationale: שכן సాధారణంగా నివసించడం లేదా నిలిచి ఉండడాన్ని సూచిస్తుంది. మేఘం విషయంగా ‘నిలిచి ఉన్న’ దాని కొనసాగిన ఉనికిని సహజంగా తెలియజేస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: మూలపదానికి ప్రత్యక్షమైన తెలుగు అనువాదం.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: מִשְׁכָּן అనే పదంలోని ‘నివాస స్థలం’ భావాన్ని, అరణ్య ప్రయాణంలోని గుడార నిర్మాణ స్వరూపాన్ని రెండింటినీ ఈ రూపం తెలియజేస్తుంది; ‘సమావేశ గుడారం’ వేరే హీబ్రూ పదబంధానికి మరింత సముచితం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. వచనం సాధారణ నియమాన్ని వివరిస్తున్నందున పునరావృత చర్యలకు ‘బయలుదేరేవారు’, ‘శిబిరం వేసేవారు’ రూపాలు వాడబడ్డాయి.
