source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: te
  text: 'అది ఎల్లప్పుడూ అలాగే ఉండేది: మేఘం దానిని కప్పి ఉండేది; రాత్రివేళ అగ్ని రూపం[a] కనిపించేది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాత్రివేళ అగ్నిలా కనిపించేది.”
    reason: מַרְאֵה אֵשׁ అనే పదబంధాన్ని ‘అగ్ని రూపం’ అని నామవాచక పదబంధంగా లేదా ‘అగ్నిలా కనిపించేది’ అని సహజమైన వాక్యరూపంలో వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందటి వచనంలో వివరించిన స్థితిని సంగ్రహిస్తూ కొనసాగించే సూచనార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה
  choice: ఉండేది
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, ఈ సందర్భంలో గతంలో నిరంతరంగా కొనసాగిన అలవాటైన స్థితిని సూచిస్తుంది.
- source_word: תָמִיד
  choice: ఎల్లప్పుడూ
  rationale: ఆ దృశ్యం నిరంతరంగా కొనసాగిందనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: సమీప సందర్భంలో ప్రత్యక్షంగా తెలిసిన నివాసమందిరాన్ని కప్పిన మేఘాన్నే సూచిస్తుంది.
- source_word: יְכַסֶּנּוּ
  choice: దానిని కప్పి ఉండేది
  rationale: క్రియకు ‘కప్పడం’ అనే అర్థం ఉంది; ప్రత్యయం సందర్భానుసారం నివాసమందిరాన్ని సూచిస్తుంది. ‘కప్పి ఉండేది’ నిరంతర లేదా అలవాటైన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: וּמַרְאֵה אֵשׁ
  choice: అగ్ని రూపం
  rationale: מַרְאֶה దృశ్యరూపం లేదా కనిపించే స్వరూపాన్ని సూచిస్తుంది. ఇది నిజమైన అగ్నా, అగ్నివంటి దృశ్యమా అని అవసరానికి మించి నిర్ణయించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: రాత్రి సమయంలో అనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְכַסֶּנּוּ లోని ఏకవచన పుంలింగ ప్రత్యయ సూచ్యం
  choice: ‘దానిని’—నివాసమందిరాన్ని సూచించేదిగా
  alternative: ‘అతనిని’ అని వ్యక్తిని సూచించేదిగా
  rationale: హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా ‘అతనిని/దానిని’ అని అనువదించవచ్చు; అయితే తక్షణ సందర్భం మేఘం కప్పిన నివాసమందిరం లేదా గుడారాన్ని గురించి చెబుతుంది. అందువల్ల ‘దానిని’ సందర్భానికి తగినది.
- issue: מַרְאֵה אֵשׁ నిజమైన అగ్నిని సూచిస్తుందా లేక అగ్నివంటి దృశ్యాన్నా
  choice: ‘అగ్ని రూపం’ అని మూలంలోని దృశ్యార్థాన్ని తెరిచి ఉంచడం
  alternative: ‘అగ్నిలా కనిపించేది’
  rationale: మూలపదబంధం కనిపించే అగ్ని రూపాన్ని పేర్కొంటుంది గాని, దాని భౌతిక స్వభావాన్ని స్పష్టంగా నిర్ణయించదు. ప్రధాన పాఠం ఈ అనిశ్చితిని నిలుపుతుంది; ప్రత్యామ్నాయ సహజ పఠనం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. ‘ఎల్లప్పుడూ అలాగే ఉండేది’ మరియు ‘కప్పి ఉండేది’ అనే రూపాలు గతంలో కొనసాగిన స్థితిని సహజంగా తెలియజేస్తాయి; మూలంలోని సంక్షిప్త నామవాచక వాక్యాన్ని తెలుగులో స్పష్టత కోసం ‘కనిపించేది’తో పూర్తిచేశారు.
