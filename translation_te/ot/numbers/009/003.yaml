id: NUM.9.3
reference: Numbers 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: te
  text: ఈ నెల పద్నాలుగవ రోజున, సాయంకాలాల మధ్య[a], దాని నియమిత సమయంలో దాన్ని ఆచరించాలి. దాని నియమాలన్నిటి ప్రకారం, దాని విధానాలన్నిటి ప్రకారం దాన్ని ఆచరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘సాయంకాలాల మధ్య’ అని ఉంది; ఇది సంధ్యాసమయ పరిధిని సూచించే సంప్రదాయ పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: ఈ నెల పదునాలుగవ రోజున
  rationale: హీబ్రూ తేదీ ప్రయోగంలోని నిర్దిష్టతను సహజమైన ఆధునిక తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: בֵּין הָעַרְבַּיִם
  choice: సాయంకాలాల మధ్య
  rationale: పస్కా సమయాన్ని సూచించే సాంకేతికమైన, అర్థపరంగా వివాదాస్పదమైన హీబ్రూ నుడికారాన్ని వ్యాఖ్యానించి ఒకే సమయానికి పరిమితం చేయకుండా యథాశక్తి నిలుపుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: దాన్ని ఆచరించాలి
  rationale: עשה అనే సాధారణ క్రియ ఇక్కడ పస్కాను పాటించడం లేదా జరుపుకోవడం అనే సందర్భార్థాన్ని కలిగి ఉంది. పునరావృతమైన రెండు చోట్లా ఒకే అనువాదాన్ని ఉంచింది.
- source_word: בְּמוֹעֲדוֹ
  choice: దాని నియమిత సమయంలో
  rationale: מוֹעֵד లోని నిర్ణయించబడిన ఆచార సమయం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּכָל חֻקֹּתָיו
  choice: దానికి సంబంధించిన నియమాలన్నిటి ప్రకారం
  rationale: חֻקּוֹת యొక్క నిర్దేశిత నియమాల భావాన్ని సాధారణ పాఠకులకు సహజమైన న్యాయ-ఆచార భాషలో అందిస్తుంది.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: విధులన్నిటి ప్రకారం
  rationale: מִשְׁפָּטִים ను ముందున్న חֻקּוֹת తో పూర్తిగా కలిపివేయకుండా, ఆచరణకు సంబంధించిన విధి లేదా నిర్ణీత పద్ధతి అనే ప్రత్యేకతను కొంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: בֵּין הָעַרְבַּיִם సూచించే ఖచ్చితమైన సమయం
  choice: మూలంలోని ‘సాయంకాలాల మధ్య’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: సంధ్యవేళలో / సూర్యాస్తమయం నుండి చీకటి పడేలోపు
  rationale: ఈ సంప్రదాయ హీబ్రూ పదబంధానికి సంబంధించిన నిజమైన కాలార్థ సందిగ్ధతను ఏకపక్షంగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞారూపాన్ని ఉపయోగించాం. ఆచార-న్యాయ పదజాలంలోని రెండు సమీప పదాలకు ‘నియమాలు’, ‘విధులు’ అని భేదం ఉంచాం; మూలంలోని పునరావృతిని కూడా నిలిపాం.
