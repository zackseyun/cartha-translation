id: NUM.9.19
reference: Numbers 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: te
  text: మేఘం నివాస గుడారంపై అనేక రోజుల పాటు నిలిచి ఉన్నప్పుడు, ఇశ్రాయేలు కుమారులు[a] యాహ్వే అప్పగించిన విధిని[b] పాటించారు; వారు బయలుదేరలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు,’ లేదా ‘ఇశ్రాయేలు సంతానం.’ హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యాహ్వే విధించిన బాధ్యతను,’ లేదా ‘యాహ్వే ఆజ్ఞను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: నిలిచి ఉన్నప్పుడు
  rationale: ב + infinitive construct ఇక్కడ కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; మేఘం చాలాకాలం కొనసాగి ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: అరణ్య ప్రయాణంలో యాహ్వే సన్నిధి, మార్గదర్శకత్వంతో సంబంధమున్న కనిపించే మేఘాన్ని నేరుగా సూచిస్తుంది.
- source_word: עַל הַמִּשְׁכָּן
  choice: నివాస గుడారం మీద
  rationale: מִשְׁכָּן అంటే దేవుని నివాసస్థానమైన పరిశుద్ధ గుడారం; ‘నివాస గుడారం’ మూలపద భావాన్ని, అరణ్య సందర్భాన్ని రెండింటినీ నిలుపుతుంది. עַל స్థానాన్ని ‘మీద’గా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָמִים רַבִּים
  choice: అనేక దినాలు
  rationale: మూలంలోని బహువచన కాలవ్యవధిని ‘చాలాకాలం’గా సాధారణీకరించకుండా సన్నిహితంగా నిలుపుతుంది.
- source_word: וְשָׁמְרוּ
  choice: పాటించారు
  rationale: מִשְׁמֶרֶתతో కలిసి ఇది కేవలం కాపలా కాయడం కాక, అప్పగించిన విధిని జాగ్రత్తగా ఆచరించడాన్ని సూచిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని, కుటుంబ-నిబంధన సంబంధమైన భాషను నిలుపుతుంది.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: యాహ్వే అప్పగించిన విధిని
  rationale: מִשְׁמֶרֶתలోని బాధ్యత, అప్పగింత, పాటించవలసిన విధి అనే భావాలను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; సాధారణ ‘ఆజ్ఞ’ కంటే విస్తృతమైన భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: וְלֹא יִסָּעוּ
  choice: వారు బయలుదేరలేదు
  rationale: అరణ్య ప్రయాణ సందర్భంలో נסע శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరలేదు’ స్పష్టమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: בְנֵי יִשְׂרָאֵלలోని లింగ, కుటుంబ భాష
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని, వంశ-నిబంధన భావాన్ని నిలిపింది; సహజమైన సమూహపదం ప్రత్యామ్నాయంగా పాదసూచికలో ఇవ్వబడింది.
- issue: מִשְׁמֶרֶת יְהוָה యొక్క సంబంధ భావం
  choice: యాహ్వే అప్పగించిన విధి
  alternative: యాహ్వే ఆజ్ఞ / యాహ్వే విధించిన బాధ్యత
  rationale: ఈ నిర్మాణం యాహ్వేకు సంబంధించిన లేదా ఆయన విధించిన బాధ్యతను సూచిస్తుంది. ప్రధాన పాఠం సందర్భానుగుణంగా అప్పగింత భావాన్ని వ్యక్తపరుస్తున్నప్పటికీ, పాదసూచిక ద్వారా ప్రత్యామ్నాయాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నివాస గుడారం’ పరిశుద్ధస్థల సందర్భాన్ని స్పష్టం చేస్తూ מִשְׁכָּן యొక్క ‘నివాసం’ భావాన్ని నిలుపుతుంది. వాక్యాంతంలోని సెమీకోలన్ మొదటి చర్యకు ఫలితంగా వారు బయలుదేరకపోవడాన్ని స్పష్టంగా కలుపుతుంది.
