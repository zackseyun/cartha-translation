language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: te
  text: మేఘం గుడారం మీదనుంచి పైకి లేచినప్పుడల్లా[a], ఆ తర్వాత ఇశ్రాయేలు ప్రజలు బయలుదేరేవారు. మేఘం ఏ స్థలంలో నిలిచేదో, అక్కడే ఇశ్రాయేలు ప్రజలు శిబిరం వేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘గుడారం’ ఇశ్రాయేలీయుల సన్నిధి గుడారాన్ని సూచిస్తుంది; ‘సన్నిధి గుడారం మీదనుంచి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: పైకి లేచినప్పుడల్లా
  rationale: לְפִי తో కూడిన క్రియానామ రూపం ఇక్కడ పదేపదే జరిగే సందర్భాన్ని సూచిస్తుంది. ‘లేచినప్పుడల్లా’ ఆ కాలార్థాన్నీ పునరావృత విధానాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: అరణ్యంలో దారిచూపే ఈ సందర్భంలో עָנָן కు సహజమైన ప్రామాణిక తెలుగు సమానం.
- source_word: מֵעַל הָאֹהֶל
  choice: గుడారం మీదనుంచి
  rationale: מֵעַל యొక్క స్థలార్థాన్ని ‘మీదనుంచి’ నిలుపుతుంది; אֹהֶל అక్షరార్థంగా ‘గుడారం.’ సందర్భంలో ఇది ప్రత్యక్ష గుడారాన్ని సూచించినా మూలపాఠంలోని సాధారణ పదమే ప్రధాన వాక్యంలో ఉంచబడింది.
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: కార్యాల స్పష్టమైన క్రమాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִסְעוּ
  choice: ప్రయాణం సాగించేవారు
  rationale: ఈ అసంపూర్ణ క్రియారూపం సందర్భంలో అలవాటుగా పునరావృతమయ్యే చర్యను సూచిస్తుంది. ‘సాగించేవారు’ ఆ పునరావృత భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, సందర్భంలో మొత్తం సమాజాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా అర్థాన్ని అందిస్తుంది.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: ఏ స్థలంలో ... అక్కడే
  rationale: మూలంలోని స్థల సంబంధ నిర్మాణాన్నీ, తరువాతి שָׁם తో ఉన్న అనుసంధానాన్నీ సహజమైన తెలుగు జత నిర్మాణంలో నిలుపుతుంది.
- source_word: יִשְׁכָּן
  choice: నిలిచేదో
  rationale: שׁכן కు ‘నివసించు/స్థిరపడు’ అనే భావాలున్నాయి. మేఘం ఒక ప్రదేశంలో నిలిచే సందర్భంలో ‘నిలిచేది’ సహజంగా ఉండి, మానవీకరణను అధికంగా మోపదు.
- source_word: שָׁם ... שָׁם
  choice: ఏ స్థలంలో ... అక్కడే
  rationale: హీబ్రూలోని అనురూప స్థల ఉద్ఘాటనను తెలుగు సహసంబంధ నిర్మాణం ద్వారా పునరుత్పత్తి చేస్తుంది.
- source_word: יַחֲנוּ
  choice: శిబిరం వేసేవారు
  rationale: పునరావృత చర్యను సూచించే అసంపూర్ణ క్రియకు ఆధునిక తెలుగులో సహజమైన రూపం; ‘మకాం చేసేవారు’ కంటే అరణ్య ప్రయాణ సందర్భాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని పునరావృత విధానాన్ని ‘-ప్పుడల్లా,’ ‘-ేవారు’ రూపాలతో నిలిపి, స్థల అనురూపతను ‘ఏ స్థలంలో ... అక్కడే’ నిర్మాణంతో సహజీకరించాం. ప్రధాన పాఠంలో ‘ఇశ్రాయేలు ప్రజలు’ వాడటం ద్వారా సందర్భంలోని మొత్తం సమాజాన్ని లింగపరంగా అపార్థం కాకుండా తెలిపాం.
