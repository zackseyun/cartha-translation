- from: కాబట్టి వారు మొదటి నెలలో, ఆ నెల పద్నాలుగవ రోజు సంధ్యవేళలో[a], సీనాయి అరణ్యంలో పస్కాను ఆచరించారు. యెహోవా మోషేకు ఆజ్ఞాపించినదంతా అనుసరించి ఇశ్రాయేలు కుమారులు అలాగే చేశారు.
