id: NUM.9.5
reference: Numbers 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: te
  text: అప్పుడు వారు మొదటి నెలలో, ఆ నెల పద్నాలుగవ రోజు సంధ్యవేళలో[a], సీనాయి అరణ్యంలో పస్కాను ఆచరించారు; యాహ్వే మోషేకు ఆజ్ఞాపించినదంతటి ప్రకారం ఇశ్రాయేలు కుమారులు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘రెండు సాయంకాలాల మధ్య’; ఇది సంధ్యాకాలాన్ని సూచించే నానుడి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: ఆచరించారు / చేశారు
  rationale: పֶּסַח‌తో వచ్చిన మొదటి עשה ఆచారాన్ని పాటించడం అనే భావాన్ని ఇస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘ఆచరించారు’ అని ఇచ్చాం. ముగింపు వాక్యంలోని రెండవ రూపాన్ని మూలంలోని సాధారణ భావానికి దగ్గరగా ‘చేశారు’ అని ఉంచాం.
- source_word: הַפֶּסַח
  choice: పస్కాను
  rationale: సందర్భంలో ఇది కేవలం బలిపశువును మాత్రమే కాక పస్కా ఆచరణ మొత్తాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘పస్కా’ను ఉపయోగించాం.
- source_word: בָּרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: హీబ్రూలో ‘మొదటిదానిలో’ అని సంక్షిప్తంగా ఉన్నా, వెంట వచ్చే తేదీ సూత్రం వల్ల ‘నెల’ భావం స్పష్టంగా ఉంది; తెలుగులో స్పష్టత కోసం దాన్ని వ్యక్తం చేశాం.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ఆ నెల పద్నాలుగవ రోజు
  rationale: హీబ్రూ తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపే రూపం.
- source_word: בֵּין הָעַרְבַּיִם
  choice: సంధ్యవేళలో
  rationale: ఈ హీబ్రూ నానుడి అక్షరార్థం ‘రెండు సాయంకాలాల మధ్య’; అది సూచించే సంధ్యాకాలాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలిపి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּמִדְבַּר סִינָי
  choice: సీనాయి అరణ్యంలో
  rationale: מִדְבָּר జనావాసం లేని అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది; ‘సీనాయి అరణ్యం’ గౌరవప్రదమైన, పారదర్శకమైన తెలుగు రూపం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా అనుసరించి
  rationale: ఆజ్ఞ మొత్తానికి సంపూర్ణ విధేయత చూపిన భావాన్ని ‘దంతా అనుసరించి’ స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఇశ్రాయేలు ఆచరణకు ముందే మోషేకు ఇచ్చిన ఆజ్ఞను తెలుగు సందర్భం సహజంగా తెలియజేస్తుంది; ప్రత్యేక భూతపూర్వకాల రూపం అవసరం లేదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పుత్రసంబంధిత, వ్యాకరణపరంగా పుంలింగ రూపాన్ని సమూహార్థంతో సహా నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా పేరును నిలిపాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: బְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమూహపదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధంలోని పుత్రసంబంధిత పుంలింగ రూపాన్ని తటస్థీకరించకుండా నిలిపాం; సందర్భంలో అది నిబంధన ప్రజల సమూహాన్ని సూచిస్తుంది.
- issue: הַפֶּסַח యొక్క పరిధి
  choice: పస్కా ఆచరణ మొత్తాన్ని సూచించే ‘పస్కా’
  alternative: పస్కా బలి
  rationale: ఈ సందర్భంలో క్రియతో కలసి పండుగ/ఆచరణ మొత్తాన్ని సూచించడం సహజం; కేవలం బలికి పరిమితం చేయడం మూలంలోని విస్తృత భావాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. తేదీ, స్థలం, విధేయత అనే మూల క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, పునరుక్త עשה క్రియలకు సందర్భానుసారంగా ‘ఆచరించారు / చేశారు’ అనే భేదాన్ని ఉంచాం.
