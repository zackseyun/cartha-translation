  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: te
  text: అయితే వీరిలో, సీనాయి అరణ్యంలో ఇశ్రాయేలు కుమారులను మోషే మరియు యాజకుడైన అహరోను లెక్కించినవారిలో ఒక్క పురుషుడు కూడా లేడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అయితే వీరిలో’ అనే మాటను ‘మరియు వీరిలో’ అని కూడా అనువదించవచ్చు; ఇక్కడ సందర్భం మునుపటి వాక్యంతో వ్యతిరేక భావాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: అయితే వీరిలో
  rationale: וְ సంధర్భంలో మునుపటి వాక్యానికి వ్యతిరేక భావాన్ని సూచిస్తుంది; בְ אర్థమైన ‘లో/మధ్య’ను ‘వీరిలో’ సహజంగా తెలియజేస్తుంది.
- source_word: לֹא הָיָה אִישׁ
  choice: ఒక్క పురుషుడు కూడా లేడు
  rationale: ఏ ఒక్క వ్యక్తీ లేకపోవడాన్ని తెలిపే హెబ్రీ నుడికారపు బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אִישׁ
  choice: పురుషుడు
  rationale: ఇక్కడ పూర్వపు జనగణనలో నమోదైన మగవారినే సూచిస్తున్నందున మూలంలోని పుంలింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: מִפְּקוּדֵי
  choice: లెక్కించబడినవారిలో
  rationale: פקד ధాతువు ఇక్కడ జనగణనలో లెక్కించడం అనే అర్థంలో ఉంది; అమూర్తమైన ‘లెక్క’ కంటే లెక్కించబడిన వ్యక్తులను స్పష్టంగా సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: మూలంలో ‘ప్రధాన యాజకుడు’ అని లేదు; కాబట్టి కేవలం ‘యాజకుడు’ అనే బిరుదునే నిలుపుతుంది.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: లెక్కించిన
  rationale: సాపేక్ష వాక్యంలోని బహువచన క్రియకు మోషే, అహరోనులు కర్తలు; వారు జనులను లెక్కించారని నేరుగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని కుటుంబ సంబంధిత సంప్రదాయ పదబంధాన్ని ప్రతిబింబిస్తుంది; ఇక్కడ జనగణనకు సంబంధించిన పురుష లింగ సందర్భానికీ సరిపోతుంది.
- source_word: בְּמִדְבַּר סִינָי
  choice: సీనాయి అరణ్యంలో
  rationale: మִדְבָּר యొక్క అరణ్య/నిర్జన ప్రదేశ భావాన్ని, సీనాయితో ఉన్న నిర్మాణ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: אִישׁ మరియు בְּנֵי יִשְׂרָאֵלలోని లింగ నిర్దిష్టత
  choice: ‘పురుషుడు’, ‘ఇశ్రాయేలు కుమారులు’ అని నిలుపడం
  alternative: ‘వ్యక్తి’, ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’
  rationale: ఈ సందర్భం గత జనగణనలో లెక్కించబడిన మగ తరాన్ని ఉద్దేశిస్తుంది; అందువల్ల మూలంలోని పుంలింగ రూపాలను లింగ-తటస్థంగా మార్చలేదు.
- issue: అహరోను బిరుదు
  choice: ‘యాజకుడు’
  alternative: ‘ప్రధాన యాజకుడు’
  rationale: అహరోను పాత్ర పరంగా ప్రధాన యాజకుడైనా, ఈ వచనం הַכֹּהֵן (‘యాజకుడు’) అని మాత్రమే చెబుతుంది; అదనపు బిరుదును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హెబ్రీ వాక్యంలోని ప్రధాన ప్రతిపాదనను చివర ఉంచి సహజ తెలుగు వాక్యక్రమాన్ని వాడాం. ‘ఒక్క పురుషుడు కూడా’ ద్వారా నిరాకరణ బలం నిలుపబడింది; ‘ప్రధాన’ వంటి మూలంలో లేని విశేషణం చేర్చలేదు.
