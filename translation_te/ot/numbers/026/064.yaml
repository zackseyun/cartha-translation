revisions:
- from: అయితే వీరిలో, సీనాయి అరణ్యంలో ఇశ్రాయేలు కుమారులను లెక్కించిన మోషే, యాజకుడైన అహరోనుల చేత లెక్కించబడినవారిలో ఒక్క పురుషుడు కూడా లేడు.[a]
  to: అయితే వీరిలో, సీనాయి అరణ్యంలో ఇశ్రాయేలు కుమారులను మోషే మరియు యాజకుడైన అహరోను లెక్కించినవారిలో ఒక్క పురుషుడు కూడా లేడు.[a]
  rationale: The revision retains all source-level meanings while making Moses and Aaron's joint agency explicit in idiomatic Telugu. It also corrects the footnote spelling. No theological or interpretive expansion has been introduced.
