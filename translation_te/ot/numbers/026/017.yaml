translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన సూత్రబద్ధ శైలిని పాటించాం. వ్యక్తి పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా అరోదు, అరేలీ అని లిప్యంతరీకరించాం; మూలంలోని ל యొక్క అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో భద్రపరిచాం.
