  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: te
  text: యెజెరు నుండి యెజెరీయుల వంశం; షిల్లేము నుండి షిల్లేమీయుల వంశం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: యెజెరుకు చెందిన
  rationale: జనగణన జాబితాలో לְ వంశమూలపురుషునితో సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘కు చెందిన’ అనేది సహజంగా ఆ సంబంధాన్ని వ్యక్తపరుస్తుంది; పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచించే מִשְׁפָּחָהకు ఈ సందర్భంలో ‘వంశం’ సహజమైన, సులభంగా అర్థమయ్యే తెలుగు పదం; ఆధునిక అణుకుటుంబం అనే భావాన్ని నివారిస్తుంది.
- source_word: הַ/יִּצְרִי
  choice: యెజెరీయుల
  rationale: ఇది యెజెరు నుండి వచ్చిన వంశీయులను సూచించే సంబంధవాచక రూపం. ‘యెజెరీయులు’ మూలపేరుతో సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: לְ/שִׁלֵּם
  choice: షిల్లేముకు చెందిన
  rationale: మొదటి భాగంలోని సమాంతర జనగణన సూత్రం ప్రకారం לְ సంబంధాన్ని సూచిస్తుంది; ‘కు చెందిన’ తెలుగులో సహజమైన రూపం. పేరును లిప్యంతరీకరించాం.
- source_word: הַ/שִּׁלֵּמִי
  choice: షిల్లేమీయుల
  rationale: షిల్లేము నుండి వచ్చిన వంశీయులను సూచించే సంబంధవాచక రూపం. ‘షిల్లేమీయులు’ వ్యక్తిపేరుతో ఉన్న వ్యుత్పత్తి సంబంధాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా వినిపించేందుకు ‘కు చెందిన’ ప్రయోగించబడింది.
