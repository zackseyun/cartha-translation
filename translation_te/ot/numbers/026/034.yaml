  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: te
  text: ఇవి మనష్షే వంశాలు; వారిలో లెక్కించబడినవారు యాభై రెండు వేల ఏడువందల మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిలో నమోదైనవారు” లేదా “వారి జనగణనలో చేర్చబడినవారు.” ఇక్కడి హీబ్రూ జనగణన సూత్రంలో פקד అనే పదరూపం ఉంది; అది లెక్కించబడిన లేదా నమోదు చేయబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: వంశాల జాబితాను సంగ్రహిస్తూ పరిచయం చేసే హీబ్రూ సూచనాత్మక బహువచనానికి సహజమైన తెలుగు రూపం.
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: సంఖ్యాకాండములో ఇది ఒక గోత్రంలోని విస్తృత బంధుత్వ విభాగాలను సూచిస్తుంది; గృహస్థ కుటుంబాలు అనే భావం కలిగించే ‘కుటుంబాలు’ కంటే ‘వంశాలు’ సందర్భోచితం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וּפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד అనే పదం జనగణనలో లెక్కించబడిన లేదా నమోదు చేయబడినవారిని సూచిస్తుంది. ‘వారిలో’ అనే పదం వంశాలతో ఉన్న సంబంధాన్ని నిలుపుతుంది; ప్రధాన పాఠంలో హీబ్రూలో ఇక్కడ అంతర్లీనంగా ఉన్న ‘పురుషులు’ అనే భావాన్ని అనవసరంగా స్పష్టీకరించదు.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: యాభై రెండు వేల ఏడువందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమంలోని ఖచ్చితమైన మొత్తాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జనగణన-సంగ్రహ శైలి. హీబ్రూ వాక్యంలోని వంశాలు–లెక్కించబడినవారు అనే సంబంధాన్ని స్పష్టంగా ఉంచుతూ, సందర్భంలో అంతర్లీనంగా ఉన్న లింగ సూచనను ప్రధాన పాఠంలో అదనంగా చేర్చలేదు.
