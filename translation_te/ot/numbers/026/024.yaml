translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన సమాంతర నిర్మాణం ఉపయోగించబడింది. వ్యక్తినామాల లిప్యంతరీకరణలో హీబ్రూ ఉచ్చారణకు సమీపంగా ‘యాషూబు’, ‘షిమ్రోను’ వాడబడ్డాయి.
