  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: te
  text: యాషూబు నుండి యాషూబీయుల వంశం; షిమ్రోను నుండి షిమ్రోనీయుల వంశం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: యాషూబు నుండి
  rationale: జనగణన వంశావళి సూత్రంలో לְ వంశానికి మూలపురుషుడైన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘నుండి’ ఆ వంశోత్పత్తి సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: గోత్రంలోని బంధుత్వ ఆధారిత ఉపవిభాగాన్ని సూచించే ఈ పదానికి, ఈ జనగణన సందర్భంలో ‘వంశం’ సహజమైన మరియు సంక్షిప్తమైన తెలుగు సమానం.
- source_word: הַ/יָּשׁוּבִי
  choice: యాషూబీయుల
  rationale: యాషూబు సంతతిగా గుర్తించబడే సమూహాన్ని సూచించే gentilic రూపాన్ని తెలుగులో బహువచన సంబంధరూపంగా అందించింది.
- source_word: לְ/שִׁמְרֹן
  choice: షిమ్రోను నుండి
  rationale: మొదటి భాగంతో సమాంతరంగా, לְ వంశనామానికి మూలమైన పూర్వికుడిని సూచిస్తుంది; ‘నుండి’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: జాబితాలోని పునరావృత సూత్రాన్ని ఏకరీతిగా నిలుపుతూ, గోత్ర ఉపవిభాగాన్ని సూచించేందుకు ‘వంశం’ వాడింది.
- source_word: הַ/שִּׁמְרֹנִי
  choice: షిమ్రోనీయుల
  rationale: షిమ్రోను సంతతిగా గుర్తించబడే సమూహాన్ని సూచించే gentilic రూపాన్ని సహజమైన తెలుగు సంబంధరూపంలో అందించింది.
