language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: te
  text: బెలా కుమారులు అర్దు, నయమాను; అర్దు నుండి అర్దీయుల వంశం, నయమాను నుండి నయమీయుల వంశం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కుమారులు ...
  rationale: వంశావళి జాబితా ప్రవాహాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; హీబ్రూ היה రూపానికి విడిగా ‘ఉండిరి’ అనడం అవసరం లేదు.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఇక్కడ పేరుపేరున చెప్పబడిన పురుష సంతానాన్ని సూచించే ప్రత్యక్ష వంశావళి పదం.
- source_word: בֶלַע
  choice: బెల
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: אַרְדְּ
  choice: అర్దు
  rationale: వ్యక్తి పేరును తెలుగులో పలకడానికి అనువుగా, మూల రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְנַעֲמָן
  choice: నయమాను
  rationale: వ్యక్తి పేరును హీబ్రూ నַעֲמָן రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: సంఖ్యాకాండంలోని జనగణన సందర్భంలో గోత్రం లోపలి బంధుత్వ సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָאַרְדִּי
  choice: అర్దీయుల
  rationale: అర్దు నుండి వచ్చిన వంశీయులను సూచించే హీబ్రూ సంబంధవాచక రూపాన్ని తెలుగు బహువచన వంశనామంగా ఇచ్చాం.
- source_word: לְנַעֲמָן
  choice: నయమాను నుండి
  rationale: לְ ఉపసర్గం ఈ వంశావళి సూత్రంలో వంశోత్పత్తి లేదా అనుబంధాన్ని సూచిస్తుంది; ‘నుండి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַנַּעֲמִי
  choice: నయమీయుల
  rationale: నయమాను పేరునుండి ఏర్పడిన హీబ్రూ వంశీయ విశేషణాన్ని తెలుగు వంశనామంగా సహజంగా మలిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన-వంశావళి శైలిని పాటించాం. ‘కుటుంబం’ కంటే వంశీయ సమూహాన్ని స్పష్టంగా తెలిపే ‘వంశం’ ఎంచుకున్నాం; పేర్ల ఉచ్చారణలో మూల హీబ్రూకు సమీపతతో పాటు తెలుగు పఠనసౌలభ్యాన్ని కాపాడాం.
