review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Eliab's sons and preserves the two occurrences of the contention verb. However, “సమాజంలో పేరుపొందిన” means “renowned/famous in the community,” which is not the lexical force of קְרוּאֵי הָעֵדָה (“called/summoned ones of the congregation”) and imports a sense supplied elsewhere in the Korah narrative. The clause ordering also makes the contention against Yahweh sound merely subsequent rather than the circumstance stated by the Hebrew. The divine name should align with the POB rendering of יהוה as Yahweh.
  naturalness: The revision uses clear modern standard Telugu while retaining the genealogical and formal narrative register. “సమాజపు పిలుపుపొందిన” is a natural enough nominal expression that preserves the source's deliberately compact designation without over-defining it as an official title.
  terminology: Use “యాహ్వే” for יהוה, in accordance with the English POB audit trail. Render קְרוּאֵי הָעֵדָה as “సమాజపు పిలుపుపొందినవారు,” retaining “ఎంపిక చేసినవారు” only as a footnoted interpretive alternative. “కలహించారు” consistently represents the repeated Hebrew root נצה without intensifying it to physical fighting.
  issues:
  - severity: medium
    issue: “సమాజంలో పేరుపొందిన” for קְרוּאֵי הָעֵדָה
    rationale: This rendering means “well-known in the community,” whereas the Hebrew passive participle denotes persons called/summoned in relation to the congregation. It conflates this phrase with the separate expression “men of name” found in Numbers 16:2.
  - severity: medium
    issue: “యెహోవా” for יהוה
    rationale: The POB audit trail specifies Yahweh for the Tetragrammaton. “యాహ్వే” should be used in Telugu to maintain that policy rather than adopting the alternative Jehovah tradition.
  - severity: low
    issue: Temporal-clause attachment
    rationale: The draft's “...పోరాడినప్పుడు, వారు...” can imply a sequence. The Hebrew presents their contention against Yahweh as the circumstance of their contention against Moses and Aaron; the revised wording makes that relationship clear.
  revised_text: 'ఎలీయాబు కుమారులు: నెమూయేలు, దాతాను, అబీరాము. వీరే సమాజపు పిలుపుపొందిన ఆ దాతాను, అబీరాము.[a] వారు కోరహు సమూహంలో మోషేకు, అహరోనుకు విరోధంగా కలహించినప్పుడు యాహ్వేకు విరోధంగా కలహించారు.'
