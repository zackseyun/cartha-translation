  to: 'ఎలీయాబు కుమారులు: నెమూయేలు, దాతాను, అబీరాము. వీరే సమాజపు పిలుపుపొందిన ఆ దాతాను, అబీరాము.[a] వారు కోరహు సమూహంలో మోషేకు, అహరోనుకు విరోధంగా కలహించినప్పుడు యాహ్వేకు విరోధంగా కలహించారు.'
