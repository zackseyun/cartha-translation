id: NUM.26.9
reference: Numbers 26:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: te
  text: 'ఎలీయాబు కుమారులు: నెమూయేలు, దాతాను, అబీరాము. వీరే సమాజపు పిలుపుపొందిన ఆ దాతాను, అబీరాము.[a] వారు కోరహు సమూహంలో మోషేకు, అహరోనుకు విరోధంగా కలహించినప్పుడు యాహ్వేకు విరోధంగా కలహించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాజం ఎంపిక చేసినవారు.”
    reason: కְרוּאֵי הָעֵדָה అక్షరార్థంగా సమాజంతో సంబంధమున్న “పిలువబడినవారు/సమ్మతింపబడినవారు” అని సూచిస్తుంది; సందర్భానుసారంగా ఎంపికైన ప్రతినిధులు అనే అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: ఎలీయాబు కుమారులు
  rationale: వంశావళి సందర్భంలో בנים నిర్దిష్ట పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సహజమైనది, ఖచ్చితమైనది.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: వీరే ... ఆ దాతాను, అబీరాము
  rationale: ఏకవచన రూపమైన הוּא ఇక్కడ ఇద్దరినీ గుర్తింపుగా తిరిగి సూచిస్తుంది. ‘వీరే ... ఆ’ అనేది ఆ గుర్తింపు బలాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: קרואי הָעֵדָה
  choice: సమాజంలో పేరుపొందిన
  rationale: קרא యొక్క నిష్క్రియ కృదంతం అక్షరార్థంగా ‘పిలువబడినవారు’; ఈ స్థిర ప్రయోగం సమాజంలో పేరుగాంచిన లేదా గుర్తింపుపొందిన వ్యక్తులను సూచించగలదు. ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, ఎంపిక చేయబడినవారు అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇశ్రాయేలు సమూహాన్ని సూచించే עֵדָהకు ఆధునిక తెలుగులో ‘సమాజం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: విరోధంగా పోరాడినప్పుడు / విరోధంగా పోరాడారు
  rationale: నצה కలహం, పోరు, ప్రతిఘటన భావాలను కలిగి ఉంది. ఒకే హీబ్రూ మూలాన్ని రెండు చోట్ల సమానంగా ప్రతిబింబించేందుకు ‘విరోధంగా పోరాడు’ వాడాం.
- source_word: בַּעֲדַת קֹרַח
  choice: కోరహు వర్గంతో కలిసి
  rationale: ఇక్కడ עֲדַת అనేది కోరహుతో అనుబంధమైన సమూహాన్ని సూచిస్తుంది. ‘వర్గంతో కలిసి’ ఆ అనుబంధాన్ని ప్రత్యేక అధికారిక సమాజంగా తప్పుగా అర్థం చేసుకోకుండా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో పరిచితమైన లిప్యంతరీకరణను ఉపయోగించడం ద్వారా దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు.
- issue: קרואי העדה యొక్క భావం
  choice: సమాజంలో పేరుపొందిన
  alternative: సమాజం ఎంపిక చేసినవారు
  rationale: ఈ పదబంధం ‘పిలువబడినవారు’ అనే రూపం నుంచి ప్రసిద్ధులు/గుర్తింపుపొందినవారు లేదా ఎంపికైన ప్రతినిధులు అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠం సందర్భోచితమైన భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శైలికి తగిన గౌరవప్రదమైన, స్పష్టమైన వాక్యనిర్మాణం. పేర్లు సాధారణ తెలుగు బైబిల్ రూపాలకు దగ్గరగా ఉంచబడ్డాయి; మూలంలోని ‘పోరాడు’ పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
