  text: 'These are the clans of the sons of Gad according to those numbered from them: forty thousand and five hundred.'
translation:
  language: te
  text: గాదు కుమారుల వంశాలు ఇవే; వారిలో లెక్కించబడినవారు నలభై వేల ఐదువందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת בְּנֵי־גָד
  choice: గాదీయుల వంశాలు
  rationale: అక్షరార్థంగా ‘గాదు కుమారుల వంశాలు’; ఆధునిక తెలుగులో గాదు సంతతికి చెందిన గోత్రాంతర్గత వంశాలను సహజంగా సూచించడానికి ‘గాదీయుల వంశాలు’ అని అనువదించాం.
- source_word: לִפְקֻדֵיהֶם
  choice: వంశాల ప్రకారం లెక్కించబడినవారు
  rationale: ఈ రూపం ‘వారిలో నమోదైన/లెక్కించబడినవారి ప్రకారం’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో జనగణనలో నమోదైన వ్యక్తుల మొత్తాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: నలభై వేల ఐదువందల మంది
  rationale: హీబ్రూ సంఖ్యను యథాతథంగా అందించి, లెక్క ప్రజలదని తెలుగులో ‘మంది’తో స్పష్టం చేశాం.
