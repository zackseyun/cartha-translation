  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: te
  text: వారి వంశాల ప్రకారం నఫ్తాలి వంశాలు ఇవి. వారిలో లెక్కించబడినవారు నలభై ఐదు వేల నాలుగు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: సారాంశ వాక్యాన్ని పరిచయం చేసే హీబ్రూ బహువచన సూచక సర్వనామాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చింది.
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: గోత్రంలోని విస్తృత బంధుత్వ విభాగాలను సూచించే జనగణన సందర్భానికి ‘కుటుంబాలు’ కంటే ‘వంశాలు’ సరిపోతుంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తి మరియు గోత్ర నామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: לְ ఉపసర్గ ఇక్కడ వర్గీకరణ లేదా పంపిణీ భావాన్ని ఇస్తుంది; ఈ ఎంపిక దానిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד పదంలోని జనగణన సంబంధమైన నిష్క్రియ భావాన్ని కాపాడుతూ, హీబ్రూలో ఈ చోట స్పష్టంగా లేని ‘పురుషులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: నలభై ఐదు వేల నాలుగు వందల మంది
  rationale: సంఖ్యను సహజమైన తెలుగు క్రమంలో ఇచ్చి, లెక్కించబడిన వ్యక్తులను సూచించేందుకు ‘మంది’ వాడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సూత్రవాక్యపు సంక్షిప్తతను మరియు పునరుక్త నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం.
