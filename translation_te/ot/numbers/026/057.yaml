    reason: lexical_alternative
  revision_rationale: The revision removes a potentially misleading partitive construction, retains the concrete census sense of פְקוּדֵי, preserves the repeated genealogical affiliation formula, and regularizes biblical name spellings. No theological interpretation has been introduced.
