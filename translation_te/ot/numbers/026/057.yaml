source:
  edition: WLC
  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: te
  text: వంశాల ప్రకారం లెక్కించబడిన లేవీయులు వీరు:[a] గెర్షోను నుండి గెర్షోనీయుల వంశం; కహాతు నుండి కహాతీయుల వంశం; మెరారీ నుండి మెరారీయుల వంశం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనగణనలో నమోదైనవారు.” హీబ్రూ పదం కేవలం లెక్కింపు ప్రక్రియను కాక, జనగణనలో నమోదు చేసి లెక్కించిన వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: లెక్కించబడినవారు
  rationale: జనగణనలో నమోదు చేసి లెక్కించిన వ్యక్తులను సూచించే స్పష్టమైన నామవాచక భావాన్ని నిలుపుతుంది; కేవలం లెక్కింపు అనే అమూర్త భావంగా మార్చదు.
- source_word: הַלֵּוִי
  choice: లేవీయులలో
  rationale: ఇక్కడ లేవి గోత్రానికి చెందిన వారిని సూచించే సమూహార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వెంట వచ్చే వంశాల జాబితాతో సులభంగా అనుసంధానమవుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: జనగణన సందర్భంలో מִשְׁפָּחָה ఆధునిక చిన్న కుటుంబం కంటే గోత్రంలోని వంశ విభాగాన్ని సూచిస్తుంది.
- source_word: לְגֵרְשׁוֹן / לִקְהָת / לִמְרָרִי
  choice: గేర్షోనుకు చెందిన / కహాతుకు చెందిన / మెరారికి చెందిన
  rationale: పునరావృతమైన ל ఉపసర్గ ఇక్కడ సంతతి లేదా సమూహ అనుబంధాన్ని తెలియజేస్తుంది; ‘చెందిన’ అనే రూపం తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי / הַקְּהָתִי / הַמְּרָרִי
  choice: గేర్షోనీయుల వంశం / కహాతీయుల వంశం / మెరారీయుల వంశం
  rationale: జాతివాచక ఏకవచన రూపాలు ఆయా పూర్వికుల సంతతి సమూహాలను సూచిస్తాయి; తెలుగు బహువచన సమూహ రూపం మరియు ‘వంశం’ జనగణన సందర్భానికి సహజంగా సరిపోతాయి.
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: మునుపటి జనగణన విషయంతో కొనసాగింపును సందర్భమే తెలియజేస్తుంది; వ్యక్తుల జాబితాను పరిచయం చేయడానికి ‘వీరు’ సహజమైన ఆధునిక తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గోత్ర జనగణన సందర్భంలో ‘కుటుంబం’ కంటే ‘వంశం’ను ఉపయోగించాం; పేర్లను సాధారణ తెలుగు బైబిలు ధ్వన్యనుకరణకు దగ్గరగా ఉంచాం.
