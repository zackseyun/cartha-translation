revisions:
- from: లేవీయులలో తమ వంశాల ప్రకారం లెక్కించబడినవారు వీరు:[a] గేర్షోనుకు చెందిన గేర్షోనీయుల వంశం; కహాతుకు చెందిన కహాతీయుల వంశం; మెరారికి చెందిన మెరారీయుల వంశం.
  to: వంశాల ప్రకారం లెక్కించబడిన లేవీయులు వీరు:[a] గెర్షోను నుండి గెర్షోనీయుల వంశం; కహాతు నుండి కహాతీయుల వంశం; మెరారీ నుండి మెరారీయుల వంశం.
  rationale: The revision removes a potentially misleading partitive construction, retains the concrete census sense of פְקוּדֵי, preserves the repeated genealogical affiliation formula, and regularizes biblical name spellings. No theological interpretation has been introduced.
