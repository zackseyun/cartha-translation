id: NUM.26.58
reference: Numbers 26:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: te
  text: 'లేవీయుల వంశాలు ఇవి: లిబ్నీయుల వంశం[a], హెబ్రోనీయుల వంశం, మహ్లీయుల వంశం, మూషీయుల వంశం, కోరహీయుల వంశం. కహాతు అమ్రాముకు తండ్రి అయ్యాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కుటుంబాలు,” “కుటుంబ సమూహాలు”; హీబ్రూ పదం ఒక గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: వంశాలు / వంశం
  rationale: జనగణన, గోత్ర వంశావళి సందర్భంలో ఈ పదం ఒక గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుటుంబం’ కంటే ‘వంశం’ ఈ విస్తృత సామాజిక-వంశావళి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֵוִי
  choice: లేవీయులు
  rationale: ఇక్కడ వ్యక్తి లేవి కంటే అతనికి చెందిన గోత్రసమూహం ఉద్దేశించబడింది; అందువల్ల తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా సమూహరూపం వాడబడింది.
- source_word: הַלִּבְנִי
  choice: లిబ్నీయులు
  rationale: లిబ్నికి చెందిన సంతతి సమూహాన్ని సూచించే నిస్బా రూపాన్ని తెలుగులో సహజమైన వంశనామంగా ఇచ్చాం.
- source_word: הַחֶבְרֹנִי
  choice: హెబ్రోనీయులు
  rationale: హెబ్రోనుకు చెందిన సంతతి సమూహాన్ని సూచించే వంశనామంగా అనువదించాం.
- source_word: הַמַּחְלִי
  choice: మహ్లీయులు
  rationale: మహ్లి సంతతి సమూహాన్ని సూచించే రూపాన్ని తెలుగు వంశనామంగా ఇచ్చాం.
- source_word: הַמּוּשִׁי
  choice: మూషీయులు
  rationale: మూషి సంతతి సమూహాన్ని సూచించే రూపాన్ని తెలుగు వంశనామంగా ఇచ్చాం.
- source_word: הַקָּרְחִי
  choice: కోరహీయులు
  rationale: కోరహు సంతతి సమూహాన్ని సూచించే రూపాన్ని తెలుగు వంశనామంగా ఇచ్చాం.
- source_word: וּקְהָת
  choice: కహాతు
  rationale: సంధానక అవ్యయాన్ని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, తెలుగు వాక్యప్రవాహంలో సహజంగా కొత్త వాక్యంతో సంబంధాన్ని నిలిపాం; పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: కనెను
  rationale: హిఫిల్ వంశావళి ప్రయోగం ‘తండ్రిగా జన్మనివ్వడం/కనడం’ అనే పురుష వంశసంబంధాన్ని సూచిస్తుంది. ‘కనెను’ సంక్షిప్తమైన, గౌరవప్రదమైన బైబిలు తెలుగు ప్రయోగం; ‘తండ్రి అయ్యాడు’లో కలిగే విస్తృత సంబంధార్థాన్ని నివారిస్తుంది.
- source_word: אֶת עַמְרָם
  choice: అమ్రామును
  rationale: אֶת కర్మ సూచికను తెలుగులో ద్వితీయావిభక్తి ద్వారా వ్యక్తం చేసి, వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: హీబ్రూలో వాక్యం క్రియారహితంగా ఉన్నందున తెలుగు సహజ నిర్మాణంలోనూ కాలాన్ని అనవసరంగా నిర్ణయించకుండా ‘ఇవి’ అని ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. పేర్లను హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం. ‘వంశం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, ఆధునిక అణుకుటుంబ భావానికి పరిమితం కాకుండా మూలంలోని గోత్ర ఉపవిభాగ భావాన్ని నిలుపుతుంది.
