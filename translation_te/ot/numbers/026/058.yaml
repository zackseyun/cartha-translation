  to: 'లేవీయుల వంశాలు ఇవి: లిబ్నీయుల వంశం[a], హెబ్రోనీయుల వంశం, మహ్లీయుల వంశం, మూషీయుల వంశం, కోరహీయుల వంశం. కహాతు అమ్రాముకు తండ్రి అయ్యాడు.'
