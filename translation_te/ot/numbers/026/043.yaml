  text: షూహామీయుల వంశాలన్నిటిలో లెక్కించబడినవారి సంఖ్య అరవై నాలుగు వేల నాలుగు వందలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מִשְׁפְּחֹת
  choice: వంశాలన్నిటిలో
  rationale: మִשְׁפְּחֹת అనే పదం జనగణన, గోత్ర సందర్భంలో విస్తృత కుటుంబ విభాగాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశాలు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది; כָּל యొక్క సమగ్రతను ‘అన్నిటిలో’ వ్యక్తం చేస్తుంది.
- source_word: הַשּׁוּחָמִי
  choice: షూహామీయుల
  rationale: షూహాము సంతతికి చెందిన సమూహాన్ని సూచించే సంబంధవాచక రూపం. తెలుగు సమూహ/వంశ సంబంధాన్ని ‘షూహామీయులు’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: לִפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: జనగణనలో నమోదు చేసి లెక్కించిన వ్యక్తులను సూచించే פקד పదంలోని భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: అరవై నాలుగు వేల నాలుగు వందల మంది
  rationale: మూలంలోని ఖచ్చితమైన మొత్తం 64,400ను ఆధునిక తెలుగు సంఖ్యా క్రమంలో ఇస్తూ, ఇది వ్యక్తుల సంఖ్య అని ‘మంది’తో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘కుటుంబాలు’ కంటే గోత్రంలోని విస్తృత వంశ విభాగాలను సూచించడానికి ‘వంశాలు’ ఎంచుకోబడింది.
