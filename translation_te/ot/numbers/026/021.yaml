id: NUM.26.21
reference: Numbers 26:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: te
  text: 'పెరెజు కుమారులు వీరు: హెస్రోను నుండి హెస్రోనీయుల వంశం; హామూలు నుండి హామూలీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: వీరు
  rationale: ఈ వంశావళి జనగణన సూత్రంలో היה జాబితాను పరిచయం చేసే సాధారణ సంధానార్థక క్రియ. తెలుగులో ‘వీరు’ సహజంగా ఆ పరిచయ భావాన్ని అందిస్తుంది.
- source_word: בְנֵי
  choice: కుమారులు
  rationale: ఇక్కడ వంశాలకు మూలపురుషులైన పురుష సంతానం పేర్లు వస్తున్నాయి; అందువల్ల హెబ్రీ పదరూపంలోని లింగార్థాన్ని నిలుపుతూ ‘కుమారులు’ అని అనువదించబడింది.
- source_word: פֶרֶץ
  choice: పెరెసు
  rationale: హెబ్రీ పేరుకు దగ్గరగా ఉండే ఆధునిక తెలుగు లిప్యంతరీకరణ.
- source_word: לְחֶצְרֹן
  choice: హెస్రోను నుండి
  rationale: ఈ జనగణన సూత్రంలో ל వంశోత్పత్తిని సూచిస్తుంది. ‘నుండి’ అనే రూపం ఆ వంశం హెస్రోను నుండి ఉద్భవించిందని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: సంఖ్యాకాండ జనగణన సందర్భంలో ఈ పదం గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘వంశం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַחֶצְרֹנִי
  choice: హెస్రోనీయుల
  rationale: ఈ జనవాచక రూపం హెస్రోను నుండి వచ్చిన సమూహాన్ని సూచిస్తుంది; తెలుగులో ‘హెస్రోనీయులు’ ఆ సమూహార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְחָמוּל
  choice: హామూలు నుండి
  rationale: హెస్రోను విషయంలోలాగే ఇక్కడ ל వంశోత్పత్తి లేదా సమూహ సంబంధాన్ని సూచిస్తుంది; ‘నుండి’ దానిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֶחָמוּלִי
  choice: హామూలీయుల
  rationale: ఈ జనవాచక రూపం హామూలు నుండి వచ్చిన వంశ సమూహాన్ని సూచిస్తుంది; ‘హామూలీయులు’ స్పష్టమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితా యొక్క సంక్షిప్త నిర్మాణాన్ని నిలుపుతూ అనువదించబడింది. వ్యక్తి పేర్లు హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; ‘వంశం’ సాధారణ పాఠకులకు అర్థమయ్యే బంధుత్వ సమూహ పదంగా ఎంపికైంది.
