lexical_decisions:
- source_word: וְשֵׁם
  choice: పేరు
  rationale: హీబ్రూ సంయోజక ‘וְ’ అదనపు వంశావళి సమాచారాన్ని కలుపుతుంది. తెలుగులో ఈ స్వతంత్ర వాక్యంలో ‘మరియు’ అనడం కృత్రిమంగా ఉండేందున, సహజమైన నామవాచక నిర్మాణాన్ని ఉంచాం.
- source_word: בַּת אָשֵׁר
  choice: ఆషేరు కుమార్తె
  rationale: ఏకవచన construct రూపం ఇక్కడ సహజంగా ఆషేరు యొక్క కుమార్తెనే సూచిస్తుంది; విస్తృతార్థంలో ‘స్త్రీ వంశస్థురాలు’ అని మార్చాల్సిన అవసరం లేదు.
- source_word: שָׂרַח
  choice: శెరహు
  rationale: ఇది అనువదించాల్సిన పదం కాక వ్యక్తిపేరు. హీబ్రూ שֶׂרַח (Śeraḥ) ధ్వనిని తెలుగులో సాధ్యమైనంత సమీపంగా ప్రతిలిపి చేశాం.
