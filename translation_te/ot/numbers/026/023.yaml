  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: te
  text: 'ఇశ్శాఖారు కుమారులు, వారి వంశాల ప్రకారం: తోలా నుండి తోలాయీయుల వంశం; పువా[a] నుండి పూనీయుల వంశం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంబంధిత కొన్ని వచనాల్లో ఈ పేరు ‘పూవా’ అనే రూపంలో కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: ఇశ్శాఖారు కుమారులు
  rationale: జనగణన వంశావళి సందర్భంలో בְּנֵי అనేది వంశజులను సమష్టిగా సూచించినా, మూలంలోని పుత్రసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; יִשָּׂשכָר పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּחָה గోత్రంలోని ఉపవంశాన్ని సూచిస్తుంది. ‘వంశాల ప్రకారం’ జనగణనలోని వర్గీకరణ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תּוֹלָע
  choice: తోలా
  rationale: ఇది వ్యక్తి పేరు; సాధారణ నామవాచక అర్థాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: తోలాయీయుల వంశం
  rationale: הַתּוֹלָעִי తోలా నుండి వచ్చిన వంశీయులను సూచించే జాతివాచక రూపం; తెలుగులో బహువచన వంశనామంగా సహజంగా ఇచ్చాం.
- source_word: לְפֻוָה
  choice: పువ్వా నుండి
  rationale: జాబితాలో לְ ప్రతి వంశమూల పురుషుణ్ణి పరిచయం చేస్తుంది. ఈ వచనంలోని פֻוָה రూపాన్ని ఆధారంగా తీసుకొని ‘పువ్వా’ అని లిప్యంతరీకరించాం.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: పూనీయుల వంశం
  rationale: הַפּוּנִי పువ్వా నుండి వచ్చిన వంశాన్ని సూచించే జాతివాచక రూపం; దాని హీబ్రూ ధ్వనిరూపాన్ని ప్రతిబింబిస్తూ ‘పూనీయులు’ అని ఇచ్చాం.
