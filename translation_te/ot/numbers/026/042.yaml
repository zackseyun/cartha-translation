  text: אֵ֤לֶּה בְנֵי דָן֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/שׁוּחָ֕ם מִשְׁפַּ֖חַת הַ/שּׁוּחָמִ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת דָּ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: te
  text: 'వీరు దాను కుమారులు[a], వారి వంశాల ప్రకారం: షూహాము నుండి వచ్చిన షూహామీయుల వంశం. వారి వంశాల ప్రకారం దాను వంశాలు ఇవే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాను కుమారులు’ అని హీబ్రూ మూలపాఠం; ఈ వంశావళి జనగణన సూత్రంలో ‘కుమారులు’ అనే మాట దాను సంతతివారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְנֵי דָן
  choice: దాను కుమారులు వీరు
  rationale: בְנֵי అనే పదానికి అక్షరార్థమైన ‘కుమారులు’ను నిలిపి, జనగణనలోని వంశావళి సూత్రాన్ని తెలుగులో సహజంగా అందించింది; సందర్భంలో ఇది దాను సంతతివారిని సూచించగలదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: సంఖ్యాకాండంలోని జనగణన సందర్భంలో מִשְׁפָּחָה తెగలోని వంశ విభాగాన్ని సూచిస్తుంది. ‘వంశాలు’ ఆధునిక తెలుగులో ఈ సామూహిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְשׁוּחָם מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: షూహాముకు చెందిన షూహామీయుల వంశం
  rationale: לְ అనే ఉపసర్గ సూచించే వంశసంబంధాన్ని ‘చెందిన’తో సహజంగా వ్యక్తం చేసి, gentilic రూపమైన הַשּׁוּחָמִיని ‘షూహామీయులు’గా సామూహిక అర్థంలో అనువదించింది.
- source_word: אֵלֶּה מִשְׁפְּחֹת דָּן לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం దాను వంశాలు ఇవే
  rationale: హీబ్రూలోని ముగింపు సారాంశాన్ని, అలాగే מִשְׁפָּחָה పద పునరుక్తిని తొలగించకుండా జనగణన శైలిలో నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జనగణన/వంశావళి శైలిని పాటించింది. మూలంలోని సూత్రబద్ధమైన పునరుక్తిని నిలిపి, సంబంధాన్ని స్పష్టంచేయడానికి ‘చెందిన’ అనే సహజమైన రూపాన్ని ఉపయోగించింది.
