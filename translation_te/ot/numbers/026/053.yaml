  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: te
  text: వీరికి భూమి పేర్ల సంఖ్య ప్రకారం స్వాస్థ్యంగా పంచబడాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వ్యక్తుల సంఖ్య ప్రకారం’; అక్షరార్థంగా, ‘పేర్ల సంఖ్య ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: వీరికే
  rationale: ל ఉపసర్గతో కూడిన బహువచన సూచన సర్వనామం పంచబడే స్వాస్థ్యాన్ని పొందేవారిని సూచిస్తుంది. ‘వీరికే’ దాని గ్రహీత భావాన్నీ సందర్భంలోని నిర్దిష్టతనూ సహజంగా తెలియజేస్తుంది.
- source_word: תֵּחָלֵק
  choice: పంచబడాలి
  rationale: חלק ధాతువు నిఫాల్ అసంపూర్ణ రూపం ఇక్కడ నిష్క్రియార్థక ఆజ్ఞాత్మక భావంతో, దేశం విభజించి కేటాయించబడాలని సూచిస్తుంది. ‘పంచబడాలి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇశ్రాయేలు గోత్రాలకు కేటాయించబోయే వాగ్దాన భూభాగాన్ని సందర్భం సూచిస్తుంది. బైబిలు సందర్భంలో ‘దేశం’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּנַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: נחלה వారసత్వంగా లేదా కేటాయింపుగా పొందే స్థిరాస్తిని సూచిస్తుంది. ‘స్వాస్థ్యంగా’ దాని న్యాయపరమైన, ఒడంబడిక సంబంధమైన భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּמִסְפַּר
  choice: సంఖ్య ప్రకారం
  rationale: ఇక్కడ ב ప్రమాణం లేదా కొలమానాన్ని సూచిస్తుంది. ‘సంఖ్య ప్రకారం’ కేటాయింపు లెక్కకు అనుగుణంగా జరగాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: שֵׁמוֹת
  choice: పేర్ల
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘పేర్లు.’ జనగణన సందర్భంలో అది పేర్లతో లెక్కించబడిన వ్యక్తులను సూచించినా, మూలపాఠపు రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, భావ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
