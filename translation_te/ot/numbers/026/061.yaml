base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: te
  text: అయితే నాదాబు, అబీహూ యెహోవా సన్నిధిలో అనుమతించని అగ్నిని అర్పించినప్పుడు చనిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్యమైన అగ్ని.’ హెబ్రీ పదబంధం యెహోవా సన్నిధిలో అర్పించడానికి అనుమతించబడని అగ్నిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయారు
  rationale: ఏకవచన క్రియ సంయుక్త కర్తకు ముందు రావడం హెబ్రీ భాషలో సాధారణ నిర్మాణం. తెలుగులో ఇద్దరినీ సూచించేందుకు సహజమైన బహువచన క్రియ వాడబడింది.
- source_word: נָדָב וַאֲבִיהוּא
  choice: నాదాబు, అబీహూ
  rationale: వ్యక్తుల పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: בְּהַקְרִיבָם
  choice: అర్పించినప్పుడు
  rationale: בְּ తో కూడిన క్రియానామ రూపం ఇక్కడ కాలార్థాన్ని ఇస్తుంది; బలి ఆరాధన సందర్భంలో ‘అర్పించినప్పుడు’ సహజంగా ఉంది.
- source_word: אֵשׁ זָרָה
  choice: అనుమతించని అగ్ని
  rationale: זָרָה అనే పదం ఈ ఆరాధనా సందర్భంలో నియమించబడని లేదా అనుమతి లేని దానిని సూచిస్తుంది. ‘అనుమతించని అగ్ని’ ఆధునిక పాఠకునికి అర్థాన్ని స్పష్టంగా అందిస్తూ, ‘వింత అగ్ని’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי ఇక్కడ దేవుని సమక్షంలో జరిగిన ఆరాధనా చర్యను సూచిస్తుంది; ‘సన్నిధిలో’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: וַ
  choice: అయితే
  rationale: వంశావళి సమాచారానికి భిన్నంగా ఈ ఇద్దరి మరణాన్ని ప్రత్యేకంగా పేర్కొనే వ్యత్యాసాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచబడింది.
- issue: אֵשׁ זָרָה యొక్క ఆరాధనా భావం
  choice: అనుమతించని అగ్ని
  alternative: అన్యమైన అగ్ని
  rationale: వారి అపరాధం ఏమిటనే విషయంలో పాఠం ఇచ్చే పరిమితిని దాటి ప్రత్యేక విధానాన్ని ఊహించకుండా, ఆ అగ్ని దేవునిచేత అనుమతించబడలేదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. వంశావళిలోని ఈ ప్రత్యేక మరణవివరానికి ‘అయితే’ ద్వారా స్వల్ప వ్యత్యాసం చూపబడింది.
