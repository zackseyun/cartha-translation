  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: te
  text: షెమీదా నుండి షెమీదీయుల వంశం; హెఫెరు నుండి హెఫెరీయుల వంశం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: షెమీదా నుండి
  rationale: గణన జాబితాలోని సంక్షిప్త సూత్రాన్ని తెలుగులో సహజంగా స్పష్టం చేయడానికి ‘నుండి’ చేర్చబడింది; వ్యక్తి పేరు ధ్వన్యనుసారంగా లిప్యంతరీకరించబడింది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: ఇక్కడ ఈ పదం గోత్రంలోని వంశపారంపర్య ఉపవిభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిల్ జాబితా సందర్భంలో ‘వంశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַ/שְּׁמִידָעִי
  choice: షెమీదీయుల
  rationale: షెమీదా నుండి వచ్చిన వారిని సూచించే సంబంధవాచక రూపాన్ని తెలుగులో వంశజ సమూహార్థకంగా ‘షెమీదీయులు’ అని ఇచ్చాం.
- source_word: וְ/חֵפֶר
  choice: హెఫెరు నుండి
  rationale: మొదటి అంశంలోని గణన సూత్రాన్నే అనుసరించి మూలంలోని సంక్షిప్తతను తెలుగులో స్పష్టం చేయడానికి ‘నుండి’ చేర్చబడింది.
- source_word: הַֽ/חֶפְרִי
  choice: హెఫెరీయుల
  rationale: హెఫెరు నుండి వచ్చిన వంశజ సమూహాన్ని సూచించే సంబంధవాచక రూపాన్ని తెలుగులో ‘హెఫెరీయులు’ అని అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర నిర్మాణం కాపాడబడింది.
