  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: te
  text: చీటి ప్రకారం[a], స్వాస్థ్యం ఎక్కువ సంఖ్యగలవారికీ తక్కువ సంఖ్యగలవారికీ మధ్య పంచబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చీటిని బట్టి, స్వాస్థ్యం ఎక్కువమంది ఉన్నవారికీ తక్కువమంది ఉన్నవారికీ కేటాయించబడాలి.” హీబ్రూ పాఠం భూవిభజనలో సంఖ్యాపరంగా పెద్ద సమూహాన్ని చిన్న సమూహంతో పోల్చుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: నిర్ణయం ప్రకారం
  rationale: ఈ హీబ్రూ నుడికారం ‘ప్రకారం’ లేదా ‘నిర్ణయాన్ని బట్టి’ అనే భావాన్ని ఇస్తుంది. చీటి ద్వారా తీసుకున్న నిర్ణయమే పంపకాన్ని నిర్దేశిస్తుందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַגּוֹרָל
  choice: చీటి
  rationale: భూమిని కేటాయించడానికి ఉపయోగించిన lot‌ను ‘చీటి’ అని నేరుగా, సాధారణ తెలుగులో అనువదించాం.
- source_word: תֵּחָלֵק
  choice: పంచబడాలి
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, స్వాస్థ్యం విభజించి కేటాయించబడాలనే అర్థాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: נַחֲלָתוֹ
  choice: అతని స్వాస్థ్యం
  rationale: మూలంలోని ఏకవచన పుంలింగ ప్రత్యయాన్ని యథాతథంగా నిలుపుతుంది; సందర్భంలో ఇది ఒక్కొక్క గోత్ర సమూహానికి పంపకార్థంగా వర్తిస్తుంది.
- source_word: בֵּין
  choice: మధ్య
  rationale: ఎక్కువమంది, తక్కువమంది అనే రెండు విరుద్ధ సమూహాల మధ్య సంబంధాన్ని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: רַב
  choice: ఎక్కువమంది ఉన్నవారు
  rationale: జనగణన, భూవిభజన సందర్భంలో సంఖ్యాపరంగా పెద్ద సమూహాన్ని సూచిస్తుంది; ‘గొప్పవారు’ అనే అసంబద్ధ భావాన్ని నివారిస్తుంది.
- source_word: לִמְעָט
  choice: తక్కువమంది ఉన్నవారు
  rationale: సంఖ్యాపరంగా చిన్న సమూహాన్ని సూచించి רַב‌తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
