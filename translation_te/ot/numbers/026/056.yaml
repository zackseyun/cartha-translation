translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘చీటి నిర్ణయం’ పంపకాన్ని చీటి నిర్దేశిస్తుందనే నుడికార భావాన్ని తెలియజేస్తుంది; ‘ఎక్కువమంది/తక్కువమంది’ మూలంలోని సంఖ్యాపరమైన వ్యత్యాసాన్ని స్పష్టపరుస్తుంది.
