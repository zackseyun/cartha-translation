translation:
  language: te
  text: 'యోసేపు కుమారులు వారి వంశాల ప్రకారం: మనష్షే మరియు ఎఫ్రాయిము.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בֵּן పదం నిర్మాణ బహువచనం. ఇక్కడ యోసేపు పేరుతో వెంటనే మనష్షే, ఎఫ్రాయిము పేర్కొనబడినందున, వంశావళి భాషను నేరుగా నిలుపుతూ ‘కుమారులు’ అని అనువదించబడింది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: జనగణన, గోత్ర వ్యవస్థ సందర్భంలో מִשְׁפָּחָה విస్తృత కుటుంబ శాఖ లేదా clan‌ను సూచిస్తుంది. ‘వంశాలు’ సాధారణ తెలుగు పాఠకులకు సహజంగా ఉండి, వర్గీకరణ భావాన్ని ‘ప్రకారం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన వ్యక్తి/గోత్రనామ రూపం.
- source_word: וְאֶפְרָיִם
  choice: ఎఫ్రాయిము
  rationale: וְ సంధి హెబ్రీ జాబితాలో సమన్వయాన్ని సూచిస్తుంది. తెలుగులో చివరి రెండు పేర్ల మధ్య అల్పవిరామంతో జాబితా సహజంగా వ్యక్తమవుతుంది; పేరుకు ప్రాచుర్యంలో ఉన్న తెలుగు రూపం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన-జాబితా శైలిని నిలిపాం. మూలంలోని శీర్షికసదృశ, క్రియారహిత నిర్మాణాన్ని అలాగే ఉంచాం; ‘వంశాలు’ ద్వారా ఆధునిక ‘కుటుంబం’ అనే సంకుచిత అర్థాన్ని నివారించాం.
