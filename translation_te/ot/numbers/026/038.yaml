source:
  edition: WLC
  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: te
  text: 'బెన్యామీను కుమారులు, వారి వంశాల ప్రకారం: బేలా నుండి బేలాయీయుల వంశం; అష్బేలు నుండి అష్బేలీయుల వంశం; అహీరాము[a] నుండి అహీరామీయుల వంశం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మసొరెటిక్ పాఠంలో ఇక్కడ ‘అహీరాము’ అని ఉంది; కొన్ని పాఠ సంప్రదాయాల్లోనూ ఆంగ్ల అనువాదాల్లోనూ దీనికి సరితూగే పేరు ‘అహీయాము’గా ఉంది. ప్రధాన పాఠం ఇక్కడ హీబ్రూ పఠనాన్నే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: בְּנֵי అనే పదానికి అక్షరార్థం ‘కుమారులు.’ జనగణనలో ఇది విస్తృతంగా వంశస్థులను సూచించినా, గోత్ర జాబితా నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండే ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని వంశ విభాగాన్ని సూచిస్తుంది. ‘వంశాల ప్రకారం’ జనగణన జాబితా భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבֶלַע
  choice: బెల నుండి
  rationale: ఈ వంశావళి వరుసలో לְ మూలపురుషుని ఆధారంగా ఏర్పడిన వంశాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘నుండి’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: బెలీయుల వంశం
  rationale: הַבַּלְעִי అనేది బెల నుండి వచ్చిన వంశీయులను సూచించే రూపం. ‘బెలీయులు’ అనే తెలుగు రూపం ఆ వంశనామాన్ని నిలుపుతుంది.
- source_word: לְאַשְׁבֵּל
  choice: అష్బేలు నుండి
  rationale: לְ ఇక్కడ అష్బేలు మూలంగా ఏర్పడిన వంశశాఖను సూచిస్తుంది; ‘నుండి’ తెలుగు వంశావళి సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: అష్బేలీయుల వంశం
  rationale: ఈ జాతివాచక రూపం అష్బేలు వంశీయులను సూచిస్తుంది; పేరును పారదర్శకంగా నిలిపే తెలుగు బహువచన రూపం వాడబడింది.
- source_word: לַאֲחִירָם
  choice: అహీరాము నుండి
  rationale: మసొరెటిక్ పాఠంలో పేరు אֲחִירָם. దానిని ‘అహీరాము’గా లిప్యంతరీకరించి, לַ సంబంధాన్ని ‘నుండి’గా తెలిపాం.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: అహీరామీయుల వంశం
  rationale: ఈ రూపం అహీరాము నుండి వచ్చిన వంశీయులను సూచిస్తుంది; చుట్టుపక్కల వంశనామాలకు అనుగుణమైన తెలుగు రూపం ఎంచుకున్నాం.
