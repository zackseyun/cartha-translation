translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే జనగణన-వంశావళి శైలిని ఉపయోగించాం. సమాంతర జాబితా నిర్మాణాన్ని అర్ధవిరామాలతో స్పష్టంగా చూపించాం. ఆంగ్ల సంప్రదింపుపాఠంలో సూచిక బెల తరువాత ఉన్నప్పటికీ, గమనిక అహీరాము అనే పేరులోని పాఠభేదానికే సంబంధించినందున [a]ను అహీరాము తరువాత ఉంచాం.
