  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת יִשָּׂשכָ֖ר לִ/פְקֻדֵי/הֶ֑ם אַרְבָּעָ֧ה וְ/שִׁשִּׁ֛ים אֶ֖לֶף וּ/שְׁלֹ֥שׁ מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: te
  text: ఇవి ఇశ్శాఖారు వంశాలు; వాటిలో లెక్కించబడినవారి సంఖ్య అరవై నాలుగు వేల మూడు వందల మంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి లెక్క ప్రకారం” లేదా “వారి నమోదు ప్రకారం.” హీబ్రూ పదబంధం ఈ వంశాలకు చెందినవారిలో జనగణనలో నమోదు చేసి లెక్కించబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: ఈ బహువచన సూచకపదం వంశాల జాబితాను సంక్షిప్తంగా పరిచయం చేస్తుంది.
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: జనగణన, గోత్ర సందర్భంలో ఇది ఒక గోత్రంలోని విస్తృత బంధుత్వ సమూహాలను సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘వంశాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామానికి సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: לִפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారి ప్రకారం
  rationale: פקד మూలం నుండి వచ్చిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించిన వారిని సూచిస్తుంది; ‘వారిలో’ అనే మాట ఆయా వంశాలకు చెందిన లెక్కించబడిన వ్యక్తులతో సంబంధాన్ని నిలుపుతుంది.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: అరవై నాలుగు వేల మూడు వందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంఖ్యా క్రమంలో ఇచ్చి, మొత్తం 64,300 అని స్పష్టపరుస్తుంది; వ్యక్తుల సంఖ్య కావడంతో ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జనగణన శైలిని ఉపయోగించాం. ‘కుటుంబాలు’ కంటే గోత్రంలోని విస్తృత బంధుత్వ విభాగాలను సూచించేందుకు ‘వంశాలు’ ఎంచుకున్నాం; హీబ్రూ పదబంధంలోని స్వల్ప అస్పష్టతను పాదసూచికలో నిలిపాం.
