  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת בְּנֵי אָשֵׁ֖ר לִ/פְקֻדֵי/הֶ֑ם שְׁלֹשָׁ֧ה וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וְ/אַרְבַּ֥ע מֵאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: te
  text: ఆషేరు కుమారుల వంశాలు ఇవి; వారిలో లెక్కించబడినవారు[a] యాభై మూడు వేల నాలుగు వందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత మూలానుసారంగా, “వారి లెక్కింపుల ప్రకారం” లేదా “వారిలో లెక్కించబడినవారి ప్రకారం.” ఇక్కడి హీబ్రూ పదం פקד అధికారిక జనగణనలో నమోదు చేయబడిన లేదా లెక్కించబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מִשְׁפְּחֹת
  choice: వంశాల ప్రకారం
  rationale: מִשְׁפְּחֹת ఇక్కడ చిన్న కుటుంబాలను కాక, గోత్రంలోని విస్తృత బంధుత్వ వర్గాలను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఇవి ... వంశాలు’ అని కాకుండా, జనగణన సారాంశంగా సహజంగా ఉండేందుకు ‘వంశాల ప్రకారం’ అని ఇచ్చాం.
- source_word: בְּנֵי אָשֵׁר
  choice: ఆషేరు కుమారుల
  rationale: హీబ్రూ వంశావళి రూపాన్ని నిలుపుతూ ‘కుమారులు’ అని అనువదించాం; సందర్భంలో ఇది ఆషేరు గోత్రపు వంశస్థులను సూచిస్తుంది.
- source_word: לִפְקֻדֵיהֶם
  choice: లెక్కించబడినవారు మొత్తం
  rationale: פקד అనే పదానికి ఈ జనగణన సందర్భంలో అధికారికంగా నమోదు చేసి లెక్కించడం అనే భావం ఉంది. సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని ‘లెక్కించబడినవారు’ తెలియజేస్తుంది; ‘మొత్తం’ తదనంతర సంఖ్యతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: యాభై మూడు వేల నాలుగు వందల మంది
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను ప్రస్తుత తెలుగు సంఖ్యా శైలిలో ఇచ్చి, ఇది వ్యక్తుల లెక్క అని ‘మంది’తో సహజంగా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సారాంశానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘వంశాలు’ విస్తృత బంధుత్వ విభాగాలను సూచిస్తుంది; ‘లెక్కించబడినవారు’ అధికారిక జనగణన భావాన్ని కాపాడుతుంది.
