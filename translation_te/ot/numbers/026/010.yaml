source:
  edition: WLC
  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: te
  text: భూమి తన నోరు తెరిచి వారిని, కోరహును మింగివేసింది. ఆ సమూహం మరణించినప్పుడు, అగ్ని ఆ రెండువందల యాభై మందిని దహించినప్పుడు, వారు ఒక సూచనగా నిలిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సూచన’ అనే హీబ్రూ పదానికి ‘గుర్తు,’ ‘సంకేతం,’ లేదా సందర్భానుసారంగా ‘హెచ్చరిక సూచన’ అనే భావాలు ఉండవచ్చు. చివరిలోని ‘వారు’ ఎవరిని సూచిస్తుందో హీబ్రూలో పూర్తిగా నిర్దిష్టం కాదు.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: భూమి తన నోరు తెరిచి
  rationale: אֶרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ నోరు తెరిచి మింగే సజీవ చిత్రణకు ‘భూమి’ సహజంగా సరిపోతుంది. ‘నోరు’ అనే రూపకాన్ని యథాతథంగా ఉంచాం.
- source_word: וַתִּבְלַע אֹתָם וְאֶת־קֹרַח
  choice: వారిని, కోరహును మింగివేసింది
  rationale: హీబ్రూ వాక్యనిర్మాణం ‘వారిని మరియు కోరహును’ అని కోరహును స్పష్టంగా కలుపుతుంది. ఇతర వృత్తాంతాలతో సమన్వయపరచడానికి ఈ వచనంలోని ఉద్రిక్తతను తొలగించలేదు.
- source_word: בְּמוֹת הָעֵדָה
  choice: ఆ సమూహం మరణించినప్పుడు
  rationale: ב + מות కాలసూచకంగా ‘మరణించినప్పుడు’ అని అర్థమిస్తుంది. ఇక్కడ עֵדָה తీర్పు పొందిన గుంపును సూచిస్తున్నందున ‘సమూహం’ ఎంచుకున్నాం.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: అగ్ని ... దహించినప్పుడు
  rationale: אכל అక్షరార్థంగా ‘తిను’; అగ్ని కర్తగా ఉన్నప్పుడు ఆధునిక తెలుగులో ‘దహించు’ సహజమైన సమానార్థకం.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: రెండువందల యాభై మందిని
  rationale: సంఖ్యను, వ్యక్తులను సూచించే אִישׁ పదాన్ని స్పష్టంగా మరియు సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וַיִּהְיוּ לְנֵס
  choice: వారు ఒక సూచనగా నిలిచారు
  rationale: נֵס ఇక్కడ ‘సూచన/గుర్తు’ అనే అర్థాన్ని ఇస్తుంది. ‘హెచ్చరిక సూచన’ అని సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలంలోని విస్తృతార్థాన్ని ‘సూచన’గా నిలిపాం; ‘అయ్యారు’ కంటే ‘నిలిచారు’ తెలుగులో సహజం.
theological_decisions:
- issue: ‘వారు ఒక సూచనగా నిలిచారు’ అనే చివరి బహువచనానికి పూర్వపదం
  choice: ‘వారు’ అనే బహువచనాన్ని అలాగే ఉంచి దాని పరిధిని నిర్దిష్టంగా నిర్ణయించలేదు.
  alternative: ఇది ప్రత్యేకంగా రెండువందల యాభై మందినే, లేదా తీర్పు పొందిన వారందరినీ, లేదా మొత్తం సంఘటనను సూచిస్తుందని స్పష్టీకరించడం.
  rationale: హీబ్రూ బహువచన పూర్వపదంలో కొంత అస్పష్టత ఉంది; అనువాదం దానిని కృత్రిమంగా పరిష్కరించకూడదు.
- issue: కోరహుకు భూమి మింగివేసిన తీర్పుతో ఉన్న సంబంధం
  choice: ‘వారిని, కోరహును మింగివేసింది’ అని ఈ వచనంలోని ప్రత్యక్ష వాక్యనిర్మాణాన్ని నిలిపాం.
  alternative: సంఖ్యాకాండము 16లోని వివరాలతో సమన్వయపరచి కోరహును మింగబడినవారి నుండి వేరుచేయడం.
  rationale: తక్షణ హీబ్రూ పాఠం కోరహును సమన్వయ కర్మగా పేర్కొంటుంది; ఇతర వచనాల ఆధారంగా దానిని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూలోని భూమి ‘నోరు’ తెరవడం, ‘మింగివేయడం’ అనే సజీవ రూపకాలను నిలిపాం. ప్రధాన పాఠంలో మూలానికి దగ్గరగా ‘సూచన’ అని ఉంచి, తీర్పు సందర్భంలో సాధ్యమైన ‘హెచ్చరిక సూచన’ భావాన్ని పాదటిప్పణిలో తెలిపాం.
