  text: מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּצְאִ֖ים מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: te
  text: 'ఇరవై సంవత్సరాల వయసు నుండి పైబడినవారిని లెక్కించాలి, యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారం.[a] ఐగుప్తు దేశం నుండి బయలుదేరి వచ్చిన ఇశ్రాయేలీయులు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది. సందర్భానుసారం, ‘యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారం’ అనే మాటలతో వాక్యాన్ని విభజించి, తరువాతి మాటలను తదుపరి జాబితాకు పరిచయంగా అనువదించాం. ప్రత్యామ్నాయంగా, ‘మోషేకూ ఇశ్రాయేలీయులకూ ఆజ్ఞాపించిన ప్రకారం’ అని కలిపి చదవవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడినవారిని
  rationale: హీబ్రూ వయోపరిమితి నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. వాక్యసందర్భంలో జనగణనకు గురయ్యే వారిని సూచించేందుకు కర్మరూపం వాడబడింది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించిన ప్రకారం
  rationale: כַּאֲשֶׁר యొక్క పోలిక/అనుసరణ భావాన్నీ, צִוָּה లోని అధికారపూర్వక ఆజ్ఞ భావాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకూ
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ ప్రజాసమూహాన్ని సూచించే సాధారణ జాతినామంగా సహజమైన తెలుగు రూపం ఎంచుకోబడింది.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి బయలుదేరి వచ్చిన
  rationale: నిర్గమ తరానికి గుర్తింపునిచ్చే హీబ్రూ కృదంతాన్ని తెలుగు సంబంధవాచక పదబంధంగా అందించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల బిరుదైన ‘ప్రభువు’కు బదులు మూలనామానికి దగ్గరైన ‘యాహ్వే’ వాడబడింది.
- issue: మోషేతో పాటు ఇశ్రాయేలీయులు కూడా ఆజ్ఞకు గ్రహీతలా?
  choice: మోషేకూ ... ఇశ్రాయేలీయులకూ ఆజ్ఞాపించిన ప్రకారం
  alternative: ‘యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారం’తో వాక్యం ముగించి, ‘ఐగుప్తు దేశం నుండి వచ్చిన ఇశ్రాయేలీయులు...’ అని తదుపరి జాబితాకు పరిచయంగా చదవడం
  rationale: אֶת־מֹשֶׁה וּבְנֵי יִשְׂרָאֵל అనే నిర్మాణం ఇద్దరినీ צִוָּה క్రియకు కర్మలుగా చదవడానికి సహజంగా అనుమతిస్తుంది; అయితే సందర్భంలో ప్రత్యామ్నాయ వాక్యవిభజన సాధ్యమైనందున దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్త నిర్మాణాన్ని పూర్తిగా అసహజంగా ఉంచకుండా, సందర్భం నుండి ‘లెక్కించాలి’ని పూరించి, ఆ పూరణను పాదసూచికలో స్పష్టంచేశాం.
