revisions:
- from: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడినవారిని—యాహ్వే మోషేకూ, ఐగుప్తు దేశం నుండి బయలుదేరి వచ్చిన ఇశ్రాయేలీయులకూ ఆజ్ఞాపించిన ప్రకారం[a]—లెక్కించాలి.
  to: 'ఇరవై సంవత్సరాల వయసు నుండి పైబడినవారిని లెక్కించాలి, యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారం.[a] ఐగుప్తు దేశం నుండి బయలుదేరి వచ్చిన ఇశ్రాయేలీయులు:'
  rationale: The revision retains the contextually supplied census verb and the source’s age threshold, divine name, and exodus identification. It removes the unjustified definite claim that the Israelites were co-recipients of the command, represents the likely transition into the list, and documents the compressed Hebrew syntax in a focused footnote.
