  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: te
  text: హెస్రోను నుండి[a] హెస్రోనీయుల వంశం; కర్మీ నుండి కర్మీయుల వంశం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హెస్రోనుకు … కర్మీకి’; హెబ్రీ ఉపసర్గను అక్షరార్థంగా ఇలా అనువదించవచ్చు. అయితే ఇక్కడ అది జనగణన వంశావళి సందర్భంలో వంశమూలాన్ని లేదా వంశవర్గానికి చెందిన సంబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: హెస్రోను నుండి
  rationale: ఈ జనగణన వంశావళి సూత్రంలో לְ వంశమూలాన్ని లేదా వర్గీకరణను సూచిస్తుంది; తెలుగులో ‘నుండి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: ఇక్కడ ఈ పదం గోత్రంలోని ఒక బంధుత్వ వంశవర్గాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశం’ సంక్షిప్తంగా, సహజంగా సరిపోతుంది.
- source_word: הַֽ/חֶצְרוֹנִי
  choice: హెస్రోనీయుల
  rationale: ఈ జాతివాచక రూపం హెస్రోనుతో సంబంధమున్న సంతతి సమూహాన్ని సూచిస్తుంది; ‘హెస్రోనీయుల’ అనే బహువచన సంబంధరూపం సమష్టి భావాన్ని కాపాడుతుంది.
- source_word: לְ/כַרְמִי
  choice: కర్మీ నుండి
  rationale: మొదటి భాగంలోని לְ వలెనే ఇది కూడా వంశమూలం లేదా జనగణన వర్గీకరణను సూచిస్తుంది; సమాంతర నిర్మాణం కోసం ‘నుండి’ అని అనువదించబడింది.
- source_word: הַ/כַּרְמִי
  choice: కర్మీయుల
  rationale: కర్మీ సంతతి సమూహాన్ని సూచించే జాతివాచకానికి సహజమైన తెలుగు బహువచన సంబంధరూపం; మొదటి భాగంతో సమాంతరతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హెబ్రీ వాక్యంలోని రెండు భాగాల సమాంతర నిర్మాణం నిలుపబడింది.
