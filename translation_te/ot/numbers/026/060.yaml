  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అహరోనుకు నాదాబు, అబీహు, ఎలియాజరు, ఈతామారు పుట్టెను.” వంశావళుల్లో వాడే ఈ సూత్రప్రయోగంలో పలువురి పేర్లు ఉన్నప్పటికీ క్రియ ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: పుట్టారు
  rationale: ילד అనే క్రియ నిఫల్ రూపంలో ఇక్కడ ‘పుట్టారు’ అనే నిష్క్రియార్థాన్ని ఇస్తుంది. హెబ్రీలో క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ, అది నలుగురు కుమారుల జాబితాను పరిచయం చేసే వంశావళి సూత్రప్రయోగం; సహజమైన తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: לְאַהֲרֹן
  choice: అహరోనుకు
  rationale: ל ఉపసర్గ ఈ వంశావళి ప్రయోగంలో పిల్లలు ఎవరికి పుట్టారో సూచిస్తుంది. ‘అహరోను కనెను’ అనే క్రియాశీల నిర్మాణానికి మార్చకుండా మూలంలోని నిర్మాణాన్ని ఇది నిలుపుతుంది.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: పునరావృతమైన אֶת నామాలను సూచించే కర్మవిభక్తి చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు. పేర్లు సమన్వయ జాబితాగా ఇవ్వబడ్డాయి.
- source_word: נָדָב
  choice: నాదాబు
  rationale: హెబ్రీ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: אֲבִיהוּא
  choice: అబీహు
  rationale: హెబ్రీ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాన్ని అనుసరించిన వ్యక్తినామ లిప్యంతరీకరణ.
- source_word: אִיתָמָר
  choice: ఈతామారు
  rationale: హెబ్రీ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
