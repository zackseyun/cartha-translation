id: NUM.26.1
reference: Numbers 26:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: te
  text: 'యాహ్వే మోషేతోను అహరోను కుమారుడైన యాజకుడు ఎలియాజరుతోను ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ‘అన్నాడు … అని చెప్పడానికి’ అనే హెబ్రీయ speech formulaను తెలుగులో అనవసర పునరుక్తి లేకుండా, తరువాతి ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేసే ‘ఇలా అన్నాడు’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణ ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶל מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: మోషేతో … ఎలియాజరుతో
  rationale: దేవుడు ఎవరిని ఉద్దేశించి మాట్లాడాడో ఆధునిక తెలుగులో సహజంగా తెలిపే సహచర్య విభక్తిని ఉపయోగించి, ఇద్దరూ సంబోధితులనే సమన్వయాన్ని నిలిపాం.
- source_word: בֶּן אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారుడు
  rationale: హెబ్రీయ నిర్మాణంలో ‘యాజకుడు’ అన్న విశేషణం సహజంగా అహరోనును గుర్తిస్తుంది; తెలుగు పదక్రమంలో అదే సంబంధాన్ని స్పష్టంగా, సహజంగా ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- issue: הַכֹּהֵן (‘యాజకుడు’) ఎవరిని సూచిస్తుంది?
  choice: అహరోనును విశేషించేలా ‘యాజకుడైన అహరోను’
  alternative: ఎలియాజరును విశేషించేలా ‘అహరోను కుమారుడైన యాజకుడు ఎలియాజరు’
  rationale: నిర్మాణం ‘అహరోను కుమారుడు ఎలియాజరు’ తరువాత ‘యాజకుడు’ అని ఉన్నప్పటికీ, ఈ సందర్భంలో సంప్రదాయ వ్యాకరణ అవగాహన ప్రకారం అది అహరోనుకు అన్వయిస్తుంది. మూల క్రమంలో ఉండగల ఉపరితల సందిగ్ధతను తెలుగులో యథాతథంగా ఉంచితే అసహజతతో పాటు తప్పు అన్వయం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. తరువాతి వచనంలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ద్విబిందువు వాడబడింది. వ్యక్తినామాలు మూల హెబ్రీయ రూపాలకు దగ్గరగా ‘మోషే, ఎలియాజరు, అహరోను’గా ఇచ్చాం.
