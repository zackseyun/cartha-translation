lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు … అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు … అన్నాడు’ సహజంగా ఉండి దైవవాక్య పరిచయ సూత్రాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఉంచాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל ఇక్కడ ప్రసంగం ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; ‘మోషేతో’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచ్చే మాటలను పరిచయం చేసే ఈ రూపాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తపరచి, ముగింపులో ద్విబిందువు ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఎంచుకుని, మూలంలోని YHWH రూపాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగానూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేదిగానూ ఉంచాం. తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ద్విబిందువు వాడాం.
