  terminology: మִשְׁפָּחָהకు ‘వంశం’ సరైన సందర్భానుగుణ ఎంపిక; ఇది తెగలోని ఉపవిభాగాన్ని సూచించగలదు. ఆషేరు, ఇమ్నా, ఇష్వీ, బెరీయా పేర్లు మసొరేటిక్ హీబ్రూ రూపాలకు సమీపంగా ఉన్నాయి. ‘ఇమ్నీయులు/ఇష్వీయులు/బెరీయీయులు’ హీబ్రూ జాతివాచక వంశనామాలను తగిన విధంగా అందిస్తున్నాయి.
