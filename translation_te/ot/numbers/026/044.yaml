  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: te
  text: 'ఆషేరు కుమారులు తమ తమ వంశాల ప్రకారం: ఇమ్నా నుండి ఇమ్నీయుల వంశం; ఇష్వీ నుండి ఇష్వీయుల వంశం; బెరీయా నుండి బెరీయీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: ఆషేరు కుమారులు
  rationale: בְּנֵי అనే వంశావళి పదబంధానికి అక్షరార్థమైన ‘కుమారులు’ను ఉంచడం ద్వారా పితృవంశ సంబంధం స్పష్టంగా నిలుస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ తమ వంశాల ప్రకారం
  rationale: సంఖ్యాకాండంలోని జనగణన సందర్భంలో מִשְׁפָּחָה గోత్రంలోని వంశశాఖను సూచిస్తుంది; తెలుగు బైబిలు వాడుకలో ‘వంశం’ సహజంగా, విస్తృత కుటుంబ విభాగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  choice: ఇమ్నా నుండి / ఇష్వీ నుండి / బెరీయా నుండి
  rationale: ఇక్కడ לְ పూర్వప్రత్యయం ఆయా పూర్వికుని నుంచి ఏర్పడిన వంశాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘నుండి’ ఆ వంశోత్పత్తి సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: ఇమ్నీయుల వంశం
  rationale: హీబ్రూ జాతివాచక రూపాన్ని ఇమ్నా పేరునుంచి ఏర్పడిన తెలుగు సమూహవాచకమైన ‘ఇమ్నీయులు’తో తెలిపింది.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: ఇష్వీయుల వంశం
  rationale: ఇష్వీ అనే పూర్వికుని పేరునుంచి ఏర్పడిన వంశ సమూహాన్ని తెలుగు జాతివాచక రూపంతో నేరుగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: బెరీయీయుల వంశం
  rationale: బెరీయా నుంచి ఉద్భవించిన హీబ్రూ జాతివాచకాన్ని తెలుగులో పారదర్శకంగా ‘బెరీయీయులు’గా రూపొందించింది.
