  source_fidelity: 'హీబ్రూ వంశావళి-జనగణన సూత్రాన్ని యథార్థంగా ప్రతిబింబిస్తుంది: ఆషేరు కుమారులు, వారి వంశ విభాగాలు, మరియు ఇమ్నా, ఇష్వీ, బెరీయా నుంచి వచ్చిన మూడు వంశనామాలు అన్నీ ఉన్నాయి. లְ ఉపసర్గను ‘నుండి’గా ఇవ్వడం ఈ సందర్భంలోని వంశోత్పత్తి భావాన్ని సహజంగా తెలియజేస్తుంది.'
