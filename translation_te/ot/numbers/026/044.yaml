translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. పేర్లను మసొరేటిక్ హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం. ‘కుటుంబం’ కంటే జనగణనలోని విస్తృత వంశశాఖ భావాన్ని ఇచ్చే ‘వంశం’ను ఎంచుకున్నాం.
