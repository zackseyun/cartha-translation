  yaml_path: translation/ot/numbers/026/013.yaml
  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: te
  text: జెరహుకు చెందిన జెరహీయుల వంశం; షావూలుకు చెందిన షావూలీయుల వంశం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: జెరహు వంశం
  rationale: జనగణన జాబితాలో לְ అనే ఉపసర్గ పేరుగల మూలపురుషునితో వంశసంబంధాన్ని సూచిస్తుంది. తెలుగులో జాబితా శైలికి సహజంగా ఉండేలా ‘జెరహు వంశం’ అని అనువదించాం.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: గోత్రంలోని బంధుత్వ ఆధారిత ఉపవిభాగాన్ని సూచించే מִשְׁפָּחָהకు ఈ జనగణన సందర్భంలో ‘వంశం’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: הַזַּרְחִי
  choice: జెరహీయుల వంశం
  rationale: ఈ సంబంధవాచక రూపం జెరహు సంతతి సమూహాన్ని సూచిస్తుంది. ‘జెరహీయులు’ మూలపేరుతో సంబంధాన్ని స్పష్టంగా చూపుతుంది; సందర్భార్థం కోసం ‘వంశం’ను జోడించాం.
- source_word: לְ/שָׁאוּל
  choice: షావూలు వంశం
  rationale: ఇక్కడ కూడా לְ వంశసంబంధాన్ని సూచిస్తుంది. ‘షావూలు వంశం’ తెలుగు జాబితా నిర్మాణంలో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: హీబ్రూ వాక్యంలోని సమాంతర నిర్మాణాన్ని నిలుపుతూ రెండో సందర్భంలోనూ ‘వంశం’ అనే పదాన్నే వాడాం.
- source_word: הַשָּׁאוּלִי
  choice: షావూలీయుల వంశం
  rationale: ఈ సంబంధవాచక రూపం షావూలు నుండి వచ్చిన సంతతి సమూహాన్ని సూచిస్తుంది. ‘షావూలీయులు’ మూలరూపంతో ఉన్న సంబంధాన్ని కాపాడుతుంది.
