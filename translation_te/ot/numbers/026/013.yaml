translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన సమాంతర నిర్మాణం వాడబడింది. వ్యక్తిపేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘జెరహు’, ‘షావూలు’గా లిప్యంతరీకరించాం.
