  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: te
  text: 'షిమ్యోనీయుల వంశాలు ఇవే: ఇరవై రెండు వేల రెండు వందల మంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: వంశాల జాబితాను ముగిస్తూ జనగణన సారాంశాన్ని సూచించే బహువచన నిర్దేశక పదం; తెలుగులో ‘ఇవే’ సహజంగా, ఉద్ఘాటనతో ఉంటుంది.
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: గోత్రంలోని రక్తసంబంధ ఉపవిభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కుటుంబాలు’ కంటే ‘వంశాలు’ ఈ జనగణన సందర్భానికి తగినది.
- source_word: הַשִּׁמְעֹנִי
  choice: షిమ్యోనీయుల
  rationale: ఏకవచన జాతివాచకం ఇక్కడ సమూహార్థంలో ఉంది; ‘షిమ్యోనీయుల’ అనే సంబంధరూపం వారి వంశాలను సహజంగా సూచిస్తుంది.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: ఇరవై రెండు వేల రెండు వందల మంది
  rationale: జనగణనలో లెక్కించబడిన వ్యక్తుల మొత్తం 22,200 అని తెలుగులో సాధారణ సంఖ్యాక్రమంతో తెలుపుతుంది; ‘మంది’ మానవుల లెక్కను స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన జనగణన సారాంశం. పేరును హీబ్రూ שִׁמְעוֹן కు దగ్గరగా ‘షిమ్యోను’ ఆధారిత రూపమైన ‘షిమ్యోనీయులు’గా ఇచ్చాం.
