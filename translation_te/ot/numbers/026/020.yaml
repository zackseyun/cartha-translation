id: NUM.26.20
reference: Numbers 26:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: te
  text: 'యూదా కుమారులు తమ వంశాల ప్రకారం ఇలా ఉన్నారు: షేలాకు చెందిన షేలానీయుల వంశం; పెరెజుకు చెందిన పెరెజీయుల వంశం; జెరహుకు చెందిన జెరహీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי יְהוּדָה
  choice: యూదా కుమారులు ... వీరు
  rationale: హీబ్రూ వంశావళి సూత్రంలోని ‘కుమారులు’ అనే పురుషవంశ పదాన్ని నిలుపుతూ, וַיִּהְיוּ ను జాబితాను పరిచయం చేసే సహజమైన తెలుగు ‘వీరు’తో వ్యక్తం చేశాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: సంఖ్యాకాండంలోని מִשְׁפָּחָה ఇక్కడ గోత్రంలోని ఉపవిభాగమైన వంశాన్ని సూచిస్తుంది; ‘కుటుంబాలు’ కంటే ‘వంశాలు’ జనగణన సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: לְשֵׁלָה מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: షేలాకు చెందిన షేలాయీయుల వంశం
  rationale: లְ ఉపసర్గపు వంశసంబంధ భావాన్ని ‘చెందిన’తో, పూర్వికుని పేరునుంచి ఏర్పడిన సమూహనామాన్ని ‘షేలాయీయులు’తో సహజంగా అందించాం.
- source_word: לְפֶרֶץ מִשְׁפַּחַת הַפַּרְצִי
  choice: పెరెసుకు చెందిన పెరెసీయుల వంశం
  rationale: פֶרֶץ ను హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘పెరెసు’గా లిప్యంతరీకరించి, దాని వంశీయ రూపాన్ని ‘పెరెసీయులు’గా ఇచ్చాం.
- source_word: לְזֶרַח מִשְׁפַּחַת הַזַּרְחִי
  choice: జెరహుకు చెందిన జెరహీయుల వంశం
  rationale: זֶרַח ను మూల హీబ్రూకు దగ్గరగా ‘జెరహు’గా, సంబంధిత వంశనామాన్ని ‘జెరహీయులు’గా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన గంభీరమైన పునరుక్త నిర్మాణాన్ని నిలిపాం. ‘కుమారులు’ మూలంలోని పురుషవంశ రూపాన్ని కాపాడుతుంది; సందర్భంలో అది తరువాతి పురుషవంశ సంతతిని కూడా కలుపుకుంటుంది. అదనపు పాదసూచిక అవసరం లేదు.
