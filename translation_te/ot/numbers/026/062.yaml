id: NUM.26.62
reference: Numbers 26:62
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: te
  text: వారిలో లెక్కింపబడినవారు, ఒక నెల వయసు మొదలుకొని అంతకంటే పైబడిన ప్రతి మగవారూ కలిపి, ఇరవై మూడు వేల మంది. వారు ఇశ్రాయేలు కుమారుల మధ్య[a] లెక్కింపబడలేదు, ఎందుకంటే ఇశ్రాయేలు కుమారుల మధ్య వారికి వారసత్వ భూమి ఇవ్వబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, రెండు చోట్లా “ఇశ్రాయేలీయుల మధ్య.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: జనగణన సందర్భంలోని פקד భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వ్యక్తులనే సూచిస్తుంది.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: ఇరవై మూడు వేల మంది
  rationale: హీబ్రూ సంఖ్యను ప్రామాణిక తెలుగులో స్పష్టంగా అందిస్తుంది; వ్యక్తుల లెక్క కాబట్టి ‘మంది’ చేర్చబడింది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాడు
  rationale: తదుపరి పదబంధంలో నెల వయసున్న శిశువులు కూడా ఉన్నందున ‘ప్రతి పురుషుడు’ కంటే వయస్సుతో సంబంధం లేకుండా మగ లింగాన్ని సూచించే ఈ రూపం ఖచ్చితమైనది.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: కనిష్ఠ వయోపరిమితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָתְפָּקְדוּ
  choice: లెక్కించబడలేదు
  rationale: ముందున్న అదే జనగణన మూలపదంతో అనుసంధానాన్ని నిలుపుతూ కర్మణి రూపాన్ని కాపాడుతుంది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్య
  rationale: మూలంలోని కుటుంబ/నిబంధనాత్మక ప్రయోగమైన ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: వారికి వారసత్వ భూమి ఇవ్వబడలేదు
  rationale: నחלה ఇక్కడ భూవిభజనను సూచిస్తున్నందున ‘వారసత్వం’ మాత్రమే కాక ‘వారసత్వ భూమి’ అని చెప్పడం సందర్భార్థాన్ని స్పష్టం చేస్తుంది; కర్మణి నిర్మాణం కూడా నిలిచింది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధ అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబపరమైన పదబంధాన్ని యథాశక్తి నిలుపుతుంది; అయితే సాధారణ జాతిపేరైన ‘ఇశ్రాయేలీయులు’ కూడా సందర్భానుసారంగా సాధ్యమే.
- issue: נַחֲלָה యొక్క సందర్భార్థం
  choice: వారసత్వ భూమి
  alternative: వారసత్వం
  rationale: ఈ జనగణన మరియు గోత్రాల భూవిభజన సందర్భంలో లేవీయులకు ఇవ్వబడనిది భూభాగమని స్పష్టం చేస్తుంది; పదంలోని వారసత్వ భావాన్ని తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని రెండు కారణ వాక్యాలను సెమికోలన్‌తో అనుసంధానించి తార్కిక సంబంధాన్ని నిలిపాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
