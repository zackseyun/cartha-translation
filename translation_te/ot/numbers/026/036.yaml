  to: 'షూతెలహు కుమారులు వీరు: ఏరాను[a] నుండి ఏరానీయుల వంశం.'
  rationale: The revision retains the Hebrew genealogical terminology and list structure while expressing the census-formula lamed naturally as “ఏరాను నుండి.” It removes the unsupported explanatory wording “అతని” and “ఏర్పడింది.” The existing footnote anchor remains attached to Eran and continues to explain the genealogical use of “sons.”
