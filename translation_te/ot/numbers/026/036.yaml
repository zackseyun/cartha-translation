language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י שׁוּתָ֑לַח לְ/עֵרָ֕ן מִשְׁפַּ֖חַת הָ/עֵרָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/036.yaml
  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: te
  text: 'షూతెలహు కుమారులు వీరు: ఏరాను[a] నుండి ఏరానీయుల వంశం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా, “షూతెలహు కుమారులు వీరు: ఏరానుకు, ఏరానీయుని వంశం.” ఇక్కడ “కుమారులు” అనేది వంశావళి పరిభాష; అది ప్రత్యక్ష కుమారులను మాత్రమే కాక వంశస్థులను లేదా వంశశాఖలను కూడా సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: వీరు
  rationale: జనగణన జాబితాలో తదుపరి వంశశాఖను పరిచయం చేసే సూచనార్థక పదబంధం. తెలుగులో సహజంగా ఉండేందుకు సంధానకమైన וְ ను విడిగా అనువదించలేదు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: హీబ్రూ వంశావళి పరిభాషను నిలుపుతుంది; ఇక్కడ ఇది కేవలం ప్రత్యక్ష కుమారులను మాత్రమే కాక వంశస్థులను లేదా వంశశాఖలను కూడా సూచించగలదు.
- source_word: שׁוּתָלַח
  choice: షూతెలహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యంతరీకరణలో అందించింది.
- source_word: לְ/עֵרָן
  choice: ఏరాను
  rationale: לְ ఇక్కడ జనగణన సూత్రంలో సంబంధిత వంశశాఖ సభ్యుణ్ణి పరిచయం చేస్తుంది; తెలుగులో విభక్తి ద్వారా సహజంగా వ్యక్తమైంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: సంఖ్యాకాండంలోని జనగణన సందర్భంలో గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָ/עֵרָנִי
  choice: ఏరానీయుల
  rationale: ఏరాను నుండి వచ్చిన సమూహాన్ని సూచించే పితృనామిక రూపం; తెలుగులో సమూహార్థక రూపంగా అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన–వంశావళి సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. హీబ్రూ వాక్యంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని తెలుగులో అర్థవంతం చేయడానికి ‘అతని నుండి ... ఏర్పడింది’ అని స్వల్పంగా విప్పి చెప్పబడింది.
