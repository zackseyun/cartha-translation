revisions:
- from: 'ఎఫ్రాయిము కుమారులు వారి వారి వంశాల ప్రకారం వీరు: షూతెలహు నుంచి షూతెలహీయుల వంశం; బేకెరు నుంచి బేకెరీయుల వంశం; తహాను నుంచి తహానీయుల వంశం.'
  to: 'ఎఫ్రాయిము కుమారులు వారి వంశాల ప్రకారం వీరు: షూతెలహు నుండి వచ్చిన షూతెలహీయుల వంశం; బెకెరు నుండి వచ్చిన బెకెరీయుల వంశం; తహను నుండి వచ్చిన తహనీయుల వంశం.'
