id: NUM.26.35
reference: Numbers 26:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי אֶפְרַיִם֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שׁוּתֶ֗לַח מִשְׁפַּ֨חַת֙ הַ/שֻּׁ֣תַלְחִ֔י לְ/בֶ֕כֶר מִשְׁפַּ֖חַת הַ/בַּכְרִ֑י לְ/תַ֕חַן מִשְׁפַּ֖חַת הַֽ/תַּחֲנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: te
  text: 'ఎఫ్రాయిము కుమారులు వారి వంశాల ప్రకారం వీరు: షూతెలహు నుండి వచ్చిన షూతెలహీయుల వంశం; బెకెరు నుండి వచ్చిన బెకెరీయుల వంశం; తహను నుండి వచ్చిన తహనీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారులు ... వీరు
  rationale: హీబ్రూ వంశావళి సూత్రంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, తెలుగులో సహజమైన జాబితా పరిచయ వాక్యక్రమాన్ని ఉపయోగించింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: జనగణన సందర్భంలో מִשְׁפָּחָה గోత్రంలోని వంశశాఖను సూచిస్తుంది; ‘వంశం’ సాధారణ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְשׁוּתֶלַח
  choice: షూతెలహు నుంచి
  rationale: ఇక్కడ לְ పూర్వప్రత్యయం పేరుగల పూర్వికుని నుంచి వచ్చిన వంశశాఖను సూచిస్తుంది; ‘నుంచి’ ఆ వంశోత్పత్తి సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: షూతెలహీయుల వంశం
  rationale: హీబ్రూ సంబంధవాచక రూపం షూతెలహు సంతతిగా గుర్తించబడే సమూహాన్ని సూచిస్తుంది; తెలుగులో ‘-యులు’ సమూహనామానికి అనుకూలం.
- source_word: לְבֶכֶר מִשְׁפַּחַת הַבַּכְרִי
  choice: బేకెరు నుంచి బేకెరీయుల వంశం
  rationale: మూలంలోని వ్యక్తినామం–వంశనామం సమాంతర నిర్మాణాన్ని నిలిపింది.
- source_word: לְתַחַן מִשְׁפַּחַת הַתַּחֲנִי
  choice: తహాను నుంచి తహానీయుల వంశం
  rationale: పూర్వికుడు మరియు అతని పేరుతో పిలువబడే వంశశాఖ మధ్య సంబంధాన్ని స్పష్టంగా, సమాంతరంగా తెలిపింది.
