translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణనకు తగిన గంభీరమైన వంశావళి శైలి. పేర్ల లిప్యంతరీకరణ హీబ్రూ రూపాలకు దగ్గరగా ఉంచబడింది; పాఠంలో పాదటిప్పణులు లేవు.
