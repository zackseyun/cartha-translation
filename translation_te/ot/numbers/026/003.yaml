translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, స్థల సూచనను ముందుంచి తెలుగు వాక్యప్రవాహాన్ని సహజంగా చేశాం. ప్రధాన పాఠంలో ‘యెరికో ఎదురుగా’ అనే భౌగోళిక భావాన్ని ఉంచి, ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
