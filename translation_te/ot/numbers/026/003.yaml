  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֹתָ֖/ם בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: te
  text: మోయాబు మైదానాలలో, యెరికో ఎదుటనున్న యొర్దాను నది దగ్గర మోషే, యాజకుడైన ఎలియాజరు వారితో ఇలా మాట్లాడారు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరికో వద్దనున్న యొర్దాను నది దగ్గర.”
    reason: עַל יַרְדֵּן יְרֵחוֹ అనే పదబంధం యెరికోకు ఎదురుగా ఉన్న ప్రదేశాన్ని సూచించవచ్చు; లేదా యెరికోతో సంబంధమున్న/యెరికో వద్దనున్న యొర్దాను ప్రాంతాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పారు
  rationale: דבר అనే క్రియ ఇక్కడ ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేస్తుంది. మోషే, ఎలియాజరు అనే సంయుక్త కర్తకు అనుగుణంగా గౌరవార్థక బహువచన క్రియను వాడటం సహజమైన ఆధునిక తెలుగు.
- source_word: מֹשֶׁה וְאֶלְעָזָר
  choice: మోషే, ... ఎలియాజరు
  rationale: హీబ్రూ వ్యక్తినామాలకు తెలుగులో స్థిరపడిన రూపాలు; ఇద్దరూ వాక్యంలోని సంయుక్త కర్తలు.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఎలియాజరు పదవిని తెలిపే నిర్దిష్ట సమానాధికరణం. మూలంలో లేని ‘ప్రధాన యాజకుడు’ అనే విస్తరణను చేర్చలేదు.
- source_word: אֹתָם
  choice: వారితో
  rationale: ప్రసంగం ఎవరిని ఉద్దేశించిందో తెలియజేస్తుంది. ‘వారితో చెప్పారు’ అనేది తెలుగులో సహజమైన ప్రయోగం.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబులోని మైదానాల్లో
  rationale: עַרְבוֹת ఇక్కడ సమతల మైదాన లేదా గడ్డి మైదాన ప్రాంతాన్ని సూచిస్తుంది; ‘మైదానాలు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: యెరికో ఎదురుగా యొర్దాను నది దగ్గర
  rationale: ఈ భౌగోళిక సూత్రంలో యొర్దాను సమీపాన్ని, యెరికోతో ఉన్న ఎదురుదిశ సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పారు:'
  rationale: తదుపరి వచనంలో వచ్చే మాటలను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
