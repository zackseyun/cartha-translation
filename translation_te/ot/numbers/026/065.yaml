source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: te
  text: 'ఎందుకంటే యాహ్వే వారి గురించి ఇలా చెప్పాడు: “వారు అరణ్యంలో తప్పకుండా చనిపోతారు.”[a] యెఫున్నె కుమారుడు కాలేబు, నూను కుమారుడు యెహోషువ తప్ప వారిలో ఒక్క మనిషీ మిగలలేదు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “మరణించడం వారు మరణిస్తారు”; ఇది వారు నిశ్చయంగా చనిపోతారని బలంగా చెప్పే రూపం.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో అక్షరార్థంగా, “వారిలోనుండి ఒక్క పురుషుడూ మిగలలేదు”; భావం: వారిలో ఒక్కరైనా మిగలలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ప్రతిలిపి చేశాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: אָמַר יְהוָה לָהֶם
  choice: యెహోవా వారిని గురించి ... అని చెప్పాడు
  rationale: לָהֶם రూపం అక్షరార్థంగా ‘వారితో/వారికి’ అని ఉండగలిగినా, సందర్భంలో దేవుని ప్రకటన వారిని గూర్చినదిగా ఉంది; సహజమైన తెలుగులో ఆ భావాన్ని నిలిపాం.
- source_word: מוֹת יָמֻתוּ
  choice: వారు ... తప్పకుండా చనిపోతారు
  rationale: క్రియానామ సంపూర్ణరూపం మరియు పరిమిత క్రియ కలయికలోని బలమైన నిశ్చయార్థాన్ని ‘తప్పకుండా’ ద్వారా తెలిపాం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు సంచరించిన జనావాసరహిత ప్రాంతాన్ని సూచించే సహజమైన, సాంప్రదాయిక తెలుగు పదం.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: వారిలో ఒక్క పురుషుడూ మిగలలేదు
  rationale: אִישׁ యొక్క పురుష ఏకవచన రూపాన్నీ, ‘ఒక్కడైనా మిగలలేదు’ అనే పంపిణీ భావాన్నీ సహజమైన తెలుగులో నిలిపాం.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ముందున్న సంపూర్ణ నిరాకరణకు ఏకైక మినహాయింపులను పరిచయం చేసే హెబ్రీ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడు కాలేబు
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా తండ్రి పేరు ముందుంచి, వ్యక్తినామాలను ప్రతిలిపి చేశాం.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడు యెహోషువ
  rationale: హెబ్రీ పేరుకు దగ్గరగా ఉన్న, తెలుగులో గుర్తించదగిన ‘యెహోషువ’ రూపాన్ని వాడి, వంశసంబంధాన్ని సహజంగా తెలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగా నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: దైవ తీర్పు ప్రకటనలోని బలప్రయోగం
  choice: తప్పకుండా చనిపోతారు
  alternative: చనిపోతూ చనిపోతారు; నిశ్చయంగా మరణిస్తారు
  rationale: מוֹת יָמֻתוּ లోని నిశ్చయాత్మక బలాన్ని స్పష్టంగా ఉంచుతూ, హెబ్రీ నిర్మాణాన్ని అసహజంగా అక్షరానువదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే గంభీరమైన గ్రంథశైలి నిలుపబడింది. మూలంలోని పురుష ఏకవచనమైన אִישׁ ను ‘ఒక్క పురుషుడూ’గా చూపి, పాదటిప్పణిలో విస్తృత భావాన్ని వివరించాం.
