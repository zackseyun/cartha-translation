source:
  edition: WLC
  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: te
  text: 'నఫ్తాలి కుమారులు వారి వంశాల ప్రకారం: యహ్సెయేలు నుండి యహ్సెయేలీయుల వంశం; గూనీ నుండి గూనీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: నఫ్తాలి కుమారులు
  rationale: ‘కుమారులు’ అనే పదం హీబ్రూ בְּנֵי యొక్క వంశావళి రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది నఫ్తాలి సంతతివారిని సూచిస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: జనగణన సందర్భంలో מִשְׁפָּחָה పెద్ద కుటుంబాధారిత సామాజిక విభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు శైలిలో ‘వంశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְיַחְצְאֵל
  choice: యహసీయేలు నుండి
  rationale: వ్యక్తిపేరుకు ముందు ఉన్న לְ ఇక్కడ ఆ వ్యక్తి మూలపురుషుడిగా ఉన్న వంశ సంబంధాన్ని పరిచయం చేస్తుంది; ‘నుండి’ ఆ వంశోత్పత్తి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: యహసీయేలీయుల వంశం
  rationale: హీబ్రూ జాతివాచక రూపం సమూహాన్ని సూచిస్తుంది; తెలుగులో ‘-ఈయులు’ రూపం ఆ మూలపురుషుని సంతతి సమూహాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְגוּנִי
  choice: గూని నుండి
  rationale: ముందటి పేరుతో సమానమైన వంశావళి సూత్రం; ‘నుండి’ గూనిని ఆ వంశపు మూలపురుషునిగా చూపిస్తుంది.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: గూనీయుల వంశం
  rationale: ఏకవచన రూపంలో ఉన్న హీబ్రూ జాతివాచకం సమష్టిగా గూని సంతతివారిని సూచిస్తుంది; తెలుగులో సమూహ బహువచనం తగినది.
