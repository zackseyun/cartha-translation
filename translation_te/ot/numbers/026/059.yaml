  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: te
  text: అమ్రాము భార్య పేరు యోకెబెదు. ఆమె లేవి కుమార్తె[a]; ఆమె ఐగుప్తులో లేవికి పుట్టినది[b]. ఆమె అమ్రాముకు అహరోనును, మోషేను, వారి సహోదరి మిర్యామును కన్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “లేవి కుమార్తె.” వంశావళి సందర్భాల్లో “కుమార్తె” అనే మాట కొన్నిసార్లు స్త్రీ వంశస్థురాలిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “ఆమెను ఐగుప్తులో లేవికి ఆమె కన్నది”; కన్న తల్లి పేరు చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: అమ్రాము భార్య పేరు
  rationale: ఆరంభంలోని וְ ను తెలుగులో విడిగా అనువదించకుండా, హెబ్రీ పరిచయ సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేసింది.
- source_word: יוֹכֶבֶד
  choice: యోకెబెదు
  rationale: హెబ్రీ వ్యక్తినామానికి సమీపంగా, తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించబడింది.
- source_word: בַּת לֵוִי
  choice: లేవి కుమార్తె
  rationale: ‘లేవి వంశస్థురాలు’ అని కాలక్రమ సమస్యను పరిష్కరించకుండా, మూలంలోని ‘కుమార్తె’ అనే ప్రత్యక్ష బంధపదాన్ని నిలిపింది.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: ఆమెను ఐగుప్తులో లేవికి ఒక స్త్రీ కన్నది
  rationale: క్రియ స్త్రీలింగ ఏకవచనంలో ఉన్నందున పేరులేని తల్లిని స్పష్టంగా సూచిస్తూ, ‘ఆమెను కన్నది’ అనే మూల వాక్య నిర్మాణాన్ని నిలిపింది; ‘ఒక స్త్రీ’ అనేది తెలుగులో కర్తను సహజంగా తెలియజేస్తుంది.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: ఆమె అమ్రాముకు ... కన్నది
  rationale: లְ ద్వారా సూచితమైన తండ్రి/భర్త సంబంధాన్ని ‘అమ్రాముకు’తో కాపాడింది.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה
  choice: అహరోనును, మోషేను
  rationale: నేర కర్మ సూచకాలను తెలుగు ద్వితీయావిభక్తితో సహజంగా వ్యక్తం చేసింది.
- source_word: וְאֵת מִרְיָם אֲחֹתָם
  choice: వారి సహోదరి మిర్యామును
  rationale: אֲחֹתָם లోని బహువచన సంబంధాన్ని ‘వారి’గా నిలిపి, తెలుగులో సహజమైన విశేషణ-నామ క్రమాన్ని ఉపయోగించింది.
theological_decisions:
- issue: ‘లేవి కుమార్తె’ అనే వంశావళి పదబంధం యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘లేవి కుమార్తె’ అని ప్రత్యక్షంగా అనువదించడం
  alternative: లేవి వంశస్థురాలు
  rationale: కాలక్రమ లేదా వంశావళి ఉద్రిక్తతను అనువాదంలోనే పరిష్కరించకుండా, మూలపాఠపు నిజమైన అస్పష్టతను నిలుపుతుంది.
- issue: יָלְדָה లోని అంతర్లీన తల్లి
  choice: ‘ఒక స్త్రీ కన్నది’ అని పేరులేని స్త్రీ కర్తను సూచించడం
  alternative: ఆమె ఐగుప్తులో లేవికి పుట్టింది
  rationale: నిష్క్రియ రూపం మూలంలోని 3వ పురుష స్త్రీలింగ కర్తను కనుమరుగుచేస్తుంది; పాదసూచికతో మూల నిర్మాణం మరియు తల్లి పేరు చెప్పబడకపోవడం రెండింటినీ తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి. ‘సహోదరి’ వంటి పదం గంభీరతను ఉంచుతుంది; పేర్లు తెలుగు బైబిలు వినియోగానికి అనుకూలంగా లిప్యంతరీకరించబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
