- from: అమ్రాము భార్య పేరు యోకెబెదు. ఆమె లేవి కుమార్తె[a]; ఆమెను ఐగుప్తులో లేవికి ఒక స్త్రీ కన్నది[b]. ఆమె అమ్రాముకు అహరోనును, మోషేను, వారి సహోదరి మిర్యామును కన్నది.
  to: అమ్రాము భార్య పేరు యోకెబెదు. ఆమె లేవి కుమార్తె[a]; ఆమె ఐగుప్తులో లేవికి పుట్టినది[b]. ఆమె అమ్రాముకు అహరోనును, మోషేను, వారి సహోదరి మిర్యామును కన్నది.
  rationale: ‘ఒక స్త్రీ’ అనే మూలంలో లేని స్పష్టీకరణను తొలగించాం. నిష్క్రియ ప్రయోగం హెబ్రీలో పేరులేని తల్లిని ప్రధాన పాఠ్యంలో గుర్తించకుండా, యోకెబెదు లేవికి ఐగుప్తులో జన్మించిందనే అర్థాన్ని సహజంగా తెలియజేస్తుంది. పాదసూచిక హెబ్రీ క్రియలోని స్త్రీలింగ కర్తను మరియు ఆమె పేరు చెప్పబడలేదనే అంశాన్ని తెలియజేస్తుంది. ఇతర పదబంధాలు మూలానికి నమ్మకంగా, సహజంగా ఉన్నందున నిలిపాం.
