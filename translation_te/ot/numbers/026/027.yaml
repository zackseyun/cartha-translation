  yaml_path: translation/ot/numbers/026/027.yaml
  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: te
  text: జెబూలూనీయుల వంశాలు ఇవే. వారిలో లెక్కించబడినవారి సంఖ్య అరవై వేల ఐదువందలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: సారాంశాన్ని పరిచయం చేసే సూచనాత్మక బహువచనాన్ని తెలుగు లెక్కింపు శైలిలో సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: గోత్రంలోని విస్తృత బంధుత్వ సమూహాలను సూచించే జనగణన సందర్భానికి ‘వంశాలు’ సహజమైన, ఖచ్చితమైన పదం.
- source_word: הַזְּבוּלֹנִי
  choice: జెబూలూనీయుల
  rationale: ఆర్టికల్‌తో ఉన్న ఏకవచన జాతివాచకం సమూహార్థంలో జెబూలూను సంతతివారిని సూచిస్తుంది; తెలుగులో సంబంధవాచక బహువచనం సహజం.
- source_word: לִפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారి సంఖ్య
  rationale: פקד యొక్క జనగణన భావాన్నీ, ఆ వంశాలకు చెందిన లెక్కించబడిన సభ్యులతో మొత్తం సంఖ్యకు ఉన్న సంబంధాన్నీ స్పష్టంగా కాపాడుతుంది.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: అరవై వేల ఐదువందలు
  rationale: మూలంలోని సంఖ్యను తెలుగు గద్యంలోని సహజమైన పదరూపంలో యథాతథంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సారాంశానికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. మూలంలోని రెండు భాగాల నిర్మాణాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా ఇచ్చింది.
