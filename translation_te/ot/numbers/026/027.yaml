  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַ/זְּבוּלֹנִ֖י לִ/פְקֻדֵי/הֶ֑ם שִׁשִּׁ֥ים אֶ֖לֶף וַ/חֲמֵ֥שׁ מֵאֽוֹת׃ס
