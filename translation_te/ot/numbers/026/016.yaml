translation:
  language: te
  text: ఓజ్నీకి చెందిన ఓజ్నీయుల వంశం; ఏరీకి చెందిన ఏరీయుల వంశం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: ఓజ్నీ
  rationale: జనగణన వంశావళి సూత్రంలో לְ పూర్వికుని పేరుతో ఏర్పడిన వంశశాఖను సూచిస్తుంది. తెలుగులో తరువాత వచ్చే ‘వంశం’తో ఈ సంబంధం సహజంగా వ్యక్తమవుతుంది; వ్యక్తినామం లిప్యంతరీకరించబడింది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: ఇశ్రాయేలు గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచించే ఈ పదానికి ఆధునిక తెలుగులో ‘వంశం’ సహజంగా సరిపోతుంది; ‘కుటుంబం’ అంటే మరీ సంకుచితమైన గృహస్థాయి భావం కలగవచ్చు.
- source_word: הָ/אָזְנִי
  choice: ఓజ్నీయులది
  rationale: నిర్దిష్ట ఉపసర్గతో ఉన్న జాతివాచక రూపం ఓజ్నీ సంతతి సమూహాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సంక్షిప్త వంశసూత్రం ఉంచి, ఈ రూపాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: לְ/עֵרִי
  choice: ఏరీ
  rationale: మొదటి భాగంలాగే לְ వంశావళి సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘వంశం’తో అది సహజంగా తెలుస్తుంది. పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: అదే జనగణన సూత్రం పునరావృతమైనందున పదాన్ని ఏకరీతిగా అనువదించాం.
- source_word: הָ/עֵרִי
  choice: ఏరీయులది
  rationale: ఈ జాతివాచక రూపం ఏరీ సంతతి సమూహాన్ని సూచిస్తుంది. తెలుగులోని సహజ సంక్షిప్త ప్రధాన పాఠ్యానికి ప్రత్యామ్నాయంగా పాదసూచికలో రూపాన్ని వెల్లడించాం.
