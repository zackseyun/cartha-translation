translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన-వంశావళి శైలిని అనుసరించాం. ‘కుటుంబం’కన్నా గోత్ర ఉపవిభాగ భావాన్ని స్పష్టంగా అందించే ‘వంశం’ను ఎంచుకున్నాం; పేర్లను హీబ్రూ రూపాలకు దగ్గరగా ఓజ్నీ, ఏరీ అని లిప్యంతరీకరించాం.
