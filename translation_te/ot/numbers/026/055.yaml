source:
  edition: WLC
  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: te
  text: చీటి ద్వారానే భూమి పంచబడాలి; తమ పితరుల[a] గోత్రాల పేర్ల ప్రకారం వారు వారసత్వం పొందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ పూర్వీకుల.” హీబ్రూలో అక్షరార్థంగా “తమ పితరుల” అని ఉంది; ఇది గోత్రాల లోపలి పితృవంశ పూర్విక రేఖలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే…నే
  rationale: ఇక్కడ ఈ పదం ముందున్న పరిమాణాధారిత పంపకానికి విరుద్ధతను కాక, పంపకం జరిగే విధానాన్ని పరిమితం చేస్తుంది. తెలుగులో ‘అయితే’ సందర్భసంబంధాన్ని, ‘నే’ ప్రత్యేక పరిమితిని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: בְּגוֹרָל
  choice: చీట్లు వేసే పద్ధతిలో
  rationale: גוֹרָל భూవిభజన నిర్ణయానికి ఉపయోగించే చీటిని సూచిస్తుంది; సాధారణ పాఠకునికి ప్రక్రియ స్పష్టంగా ఉండేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: יֵחָלֵק
  choice: పంచాలి
  rationale: నిఫాల్ రూపంలోని విభజన భావాన్ని తెలుగులో సహజమైన విధి/ఆజ్ఞార్థక రూపంతో తెలిపింది; కర్తగా ‘దేశం’ స్పష్టంగా ఉంది.
- source_word: אֶת הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఈ సందర్భంలో הָאָרֶץ ఇశ్రాయేలీయులు వారసత్వంగా పొందబోయే నిర్దిష్ట దేశాన్ని సూచిస్తుంది; ‘దేశం’ సహజమైన సందర్భోచిత పదం.
- source_word: לִשְׁמוֹת
  choice: పేర్ల ప్రకారం
  rationale: ל ఇక్కడ ప్రమాణం లేదా సూచనను తెలియజేస్తుంది; ‘ప్రకారం’ ఆ సంబంధాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: מַטּוֹת
  choice: గోత్రాల
  rationale: ఈ సందర్భంలో పదం కర్రలను కాక ఇశ్రాయేలు గోత్ర విభాగాలను సూచిస్తుంది; ‘గోత్రాలు’ స్థిరమైన తెలుగు బైబిలు పదప్రయోగం.
- source_word: אֲבֹתָם
  choice: తమ పితరుల
  rationale: హీబ్రూ పదంలోని పురుష పూర్వీకుల, పితృవంశ సంబంధాన్ని ‘పితరులు’ స్పష్టంగా నిలుపుతుంది.
- source_word: יִנְחָלוּ
  choice: వారసత్వం పొందాలి
  rationale: נחל యొక్క వారసత్వంగా స్వీకరించడం/స్వాధీనపరచుకోవడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: אֲבֹתָם లోని లింగసూచక పూర్వీకుల పదప్రయోగం
  choice: తమ పితరుల
  alternative: తమ పూర్వీకుల
  rationale: మూలపాఠం సాధారణ పూర్వీకులను మాత్రమే కాక గోత్ర వారసత్వ సందర్భంలోని పితృవంశ రేఖలను ప్రత్యేకంగా సూచిస్తుంది; అందువల్ల ప్రధాన పాఠంలో ఆ భావాన్ని నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘చీట్లు వేసే పద్ధతిలోనే’ అనే రూపం సాధనార్థక భావాన్నీ אַךְ యొక్క పరిమితి బలాన్నీ కలిపి సహజంగా వ్యక్తం చేస్తుంది.
