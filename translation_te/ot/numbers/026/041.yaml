translation:
  language: te
  text: వీరు తమ వంశాల ప్రకారం బెన్యామీను కుమారులు. వారిలో లెక్కించబడినవారు నలభై ఐదు వేల ఆరు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: వంశావళి సందర్భంలో ‘కుమారులు’ ప్రత్యక్ష కుమారులతో పాటు వారి సంతతి సమూహాలను కూడా సూచిస్తుంది; మూలపద రూపాన్ని నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ జనగణనలోని వంశ/కుల విభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘వంశాలు’ ఎంచుకున్నాం.
- source_word: וּפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד యొక్క జనగణన భావాన్ని స్పష్టంగా తెలియజేస్తూ, సంబంధిత సమూహం నుండి లెక్కలో నమోదైనవారనే భావాన్ని అందిస్తుంది.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: నలభై ఐదు వేల ఆరు వందల మంది
  rationale: హీబ్రూ సంఖ్యను సహజమైన తెలుగు సంఖ్యాక్రమంలో ఖచ్చితంగా అందిస్తుంది; వ్యక్తుల లెక్క కావడంతో ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జనగణన శైలి. మూలంలోని రెండు భాగాల నిర్మాణాన్ని రెండు వాక్యాలుగా సహజంగా విభజించాం; భావపరంగా ఏ అదనపు వివరణను చేర్చలేదు.
