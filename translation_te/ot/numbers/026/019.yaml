  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని సంక్షిప్తతను నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి తగిన బహువచన క్రియను ఉపయోగించాం.
