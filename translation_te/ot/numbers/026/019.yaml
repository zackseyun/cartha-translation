  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: te
  text: 'యూదా కుమారులు: ఏరు, ఓనాను. మరియు[a] ఏరు, ఓనాను కనాను దేశంలో చనిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే ఏరు, ఓనాను కనాను దేశంలో చనిపోయారు.” హీబ్రూ సంధాయకాన్ని సాధారణంగా ‘మరియు’ అని అనువదించవచ్చు; సందర్భంలో అది వ్యతిరేక భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణ బహువచనం యూదాకు పుట్టిన మగ సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సహజమైన, నేరమైన అనువాదం.
- source_word: עֵר וְאוֹנָן
  choice: ఏరు, ఓనాను
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, జాబితాలో సహజంగా కామాతో కలిపాం.
- source_word: וַיָּמָת
  choice: అయితే ... చనిపోయారు
  rationale: מוּת క్రియ గతంలో జరిగిన మరణాన్ని తెలియజేస్తుంది. ఏకవచన క్రియ రెండు పేర్ల సమూహాన్ని అనుసరించినా, తెలుగులో ఉభయులను సూచించేందుకు బహువచన క్రియ సహజం. వావ్‌కు సందర్భంలోని వ్యతిరేక భావాన్ని చూపేందుకు ‘అయితే’ వాడాం.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: భౌగోళిక ప్రయోగంలో בְּאֶרֶץ అంటే ‘దేశంలో’; כְּנָעַן స్థల నామాన్ని ‘కనాను’గా లిప్యంతరీకరించాం.
