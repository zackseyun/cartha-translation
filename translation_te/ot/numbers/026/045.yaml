revisions:
- from: 'బెరీయ కుమారులు: హెబెరు నుండి హెబెరీయుల వంశం; మల్కీయేలు నుండి మల్కీయేలీయుల వంశం.'
  to: 'బెరీయా కుమారులు: హెబెరు నుండి హెబెరీయుల వంశశాఖ; మల్కీయేలు నుండి మల్కీయేలీయుల వంశశాఖ.'
  rationale: The revision preserves the Hebrew parallelism and the English POB audit trail’s genealogical sense while using a more precise Telugu term for a census clan and a fuller transliteration of Beriah.
