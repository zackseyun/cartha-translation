id: NUM.26.45
reference: Numbers 26:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י בְרִיעָ֔ה לְ/חֶ֕בֶר מִשְׁפַּ֖חַת הַֽ/חֶבְרִ֑י לְ/מַ֨לְכִּיאֵ֔ל מִשְׁפַּ֖חַת הַ/מַּלְכִּיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: te
  text: 'బెరీయా కుమారులు: హెబెరు నుండి హెబెరీయుల వంశశాఖ; మల్కీయేలు నుండి మల్కీయేలీయుల వంశశాఖ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: కుమారులు
  rationale: జనగణనలోని వంశావళి సూత్రాన్ని నిలుపుతూ, בני అనే పదానికి సహజమైన అర్థాన్ని ఇస్తుంది; ఇక్కడ లְ పెద్ద వంశరేఖలోని ఉపవిభాగాన్ని పరిచయం చేస్తుంది.
- source_word: בְרִיעָה
  choice: బెరీయ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לְ/חֶבֶר
  choice: హెబెరు నుండి
  rationale: ఈ జనగణన సూత్రంలో לְ పేరుపొందిన పూర్వికుని నుండి వచ్చిన వంశశాఖను సూచిస్తుంది; తెలుగులో ‘నుండి’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: గోత్రంలో ఉన్న బంధుత్వ ఉపవిభాగాన్ని సూచించే పదంగా ఆధునిక తెలుగులో ‘వంశం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַֽ/חֶבְרִי
  choice: హెబెరీయులు
  rationale: హెబెరు నుండి వచ్చిన సమూహాన్ని సూచించే హీబ్రూ వంశనామ రూపాన్ని తెలుగు బహువచన వంశనామంగా అందించాం.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: మల్కీయేలు నుండి
  rationale: לְ ఇక్కడ మల్కీయేలు అనే పూర్వికుని నుండి వచ్చిన వంశశాఖను సూచిస్తుంది.
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: మల్కీయేలీయులు
  rationale: మల్కీయేలు సంతతి సమూహాన్ని సూచించే వంశనామాన్ని తెలుగు రూపంలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర వాక్యనిర్మాణం మరియు వంశావళి సంబంధాలు నిలుపబడ్డాయి.
