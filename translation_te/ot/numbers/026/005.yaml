  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: te
  text: 'ఇశ్రాయేలు జ్యేష్ఠ కుమారుడైన రూబేను: రూబేను కుమారులు: హనోకు నుండి హనోకీయుల వంశం; పల్లూ నుండి పల్లూయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు జ్యేష్ఠ కుమారుడు
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తూ రూబేను ఇశ్రాయేలు మొదట పుట్టిన కుమారుడని తెలిపుతుంది.
- source_word: בְּנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ అనే వంశావళి పదాన్ని నేరుగా నిలుపుతుంది; ఇక్కడ వారు తరువాతి వంశాలకు మూలపురుషులు.
- source_word: חֲנוֹךְ
  choice: హనోకు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సులభంగా పలికే లిప్యంతరీకరణ.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: గోత్రంలో ఉన్న బంధుత్వ ఉపవిభాగాన్ని సూచించే ఈ జనగణన సందర్భంలో ‘వంశం’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הַחֲנֹכִי
  choice: హనోకీయులు
  rationale: హనోకు సంతతి ద్వారా ఏర్పడిన వంశసమూహాన్ని సూచించే వంశనామ రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְפַלּוּא
  choice: పల్లు నుండి
  rationale: జాబితాలో לְ ఉపసర్గ వంశ మూలపురుషుడిని పరిచయం చేస్తుంది; ‘నుండి’ సంతతి సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַפַּלֻּאִי
  choice: పల్లూయులు
  rationale: పల్లు సంతతి వంశసమూహాన్ని సూచించే హీబ్రూ వంశనామాన్ని తెలుగు బహువచన రూపంలో అందిస్తుంది.
