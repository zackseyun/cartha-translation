source:
  edition: WLC
  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: te
  text: 'జెబూలూను కుమారులు, వారి వంశాల ప్రకారం: సెరెదు నుండి సెరెదీయుల వంశం; ఏలోను నుండి ఏలోనీయుల వంశం; యహలేలు నుండి యహలేలీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: జెబూలూను కుమారులు
  rationale: హీబ్రూ నిర్మాణంలోని ‘కుమారులు’ అనే వంశావళి నుడికారాన్ని నిలుపుతుంది; జనగణన సందర్భంలో ఇది జెబూలూను గోత్ర సంతతిని సూచిస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ఈ జనగణన సందర్భంలో מִשְׁפָּחָה విస్తృత కుటుంబ లేదా గోత్ర అంతర్గత వంశ విభాగాన్ని సూచిస్తుంది; ‘వంశాల ప్రకారం’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: לְסֶרֶד ... לְאֵלֹן ... לְיַחְלְאֵל
  choice: సెరెదు నుండి ... ఏలోను నుండి ... యహలేలు నుండి
  rationale: ప్రతి לְ ఇక్కడ సంబంధిత వంశానికి మూలపురుషుణ్ని పరిచయం చేస్తుంది; తెలుగులో ‘నుండి’ వంశోత్పత్తి సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: సెరెదీయుల వంశం
  rationale: హీబ్రూ జాతివాచక రూపాన్ని సెరెదు నుంచి వచ్చిన వంశీయుల సమూహంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפַּחַת הָאֵלֹנִי
  choice: ఏలోనీయుల వంశం
  rationale: ఏలోను నుంచి ఉద్భవించిన వంశ సమూహాన్ని సూచించే హీబ్రూ జాతివాచక రూపాన్ని నిలుపుతుంది.
- source_word: מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: యహలేలీయుల వంశం
  rationale: యహలేలు నుంచి ఉద్భవించిన వంశ సమూహాన్ని సూచించే హీబ్రూ జాతివాచక రూపాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే జనగణన జాబితా శైలి. వ్యక్తినామాలకు తెలుగు బైబిలు సంప్రదాయానికి అనుకూలమైన లిప్యంతరీకరణ వాడబడింది; పునరుక్త హీబ్రూ సూత్రరూపం సమాంతర నిర్మాణంతో నిలుపబడింది.
