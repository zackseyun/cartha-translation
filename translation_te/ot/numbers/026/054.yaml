translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ఎక్కువ–తక్కువ సమాంతర నిర్మాణాన్ని నిలిపి, చివరి సంక్షిప్త పదబంధంలోని జనగణన-అనుపాత భావాన్ని సహజంగా వ్యక్తం చేసింది.
