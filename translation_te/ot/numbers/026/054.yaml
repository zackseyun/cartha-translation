  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: te
  text: ఎక్కువమంది ఉన్న గుంపుకు ఎక్కువ స్వాస్థ్యభాగం కేటాయించాలి; తక్కువమంది ఉన్న గుంపుకు తక్కువ స్వాస్థ్యభాగం కేటాయించాలి. ప్రతి గుంపుకు దానిలో లెక్కించబడినవారి సంఖ్యనుబట్టి స్వాస్థ్యం ఇవ్వాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ఇక్కడ పురుష ఏకవచన రూపాలు పంపిణీయంగా ఉన్నాయి: “ప్రతి ఒక్కరి స్వాస్థ్యం అతనికి లెక్కించబడినవారిని బట్టి ఇవ్వబడాలి.” సందర్భంలో ఇది ప్రతి గోత్రం లేదా వంశగుంపుకు దాని జనగణన సంఖ్యకు అనుగుణంగా భూమి కేటాయించడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: ఎక్కువమంది ఉన్న గుంపుకు
  rationale: జనగణన సందర్భంలో רַב నామవాచకార్థంగా వాడబడి, ఎక్కువ జనాభా గల గోత్రం లేదా వంశగుంపును సూచిస్తుంది.
- source_word: תַּרְבֶּה נַחֲלָתוֹ
  choice: దాని స్వాస్థ్యాన్ని ఎక్కువగా ఇవ్వాలి
  rationale: רבה హిఫీల్ రూపం ‘ఎక్కువ చేయడం’ అనే భావాన్ని ఇస్తుంది; భూవిభజన సందర్భంలో తెలుగు సహజత కోసం ‘ఎక్కువగా ఇవ్వాలి’ అని అనువదించబడింది.
- source_word: וְלַמְעַט
  choice: తక్కువమంది ఉన్న గుంపుకు
  rationale: מְעַט ఇక్కడ తక్కువ జనాభా గల గుంపును తులనాత్మకంగా సూచిస్తుంది.
- source_word: תַּמְעִיט נַחֲלָתוֹ
  choice: దాని స్వాస్థ్యాన్ని తక్కువగా ఇవ్వాలి
  rationale: מעט హిఫీల్ రూపం ‘తక్కువ చేయడం’ అని అర్థం; కేటాయింపు సందర్భంలో ‘తక్కువగా ఇవ్వాలి’ సహజంగా ఉంటుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యం
  rationale: ఇక్కడ పదం వారసత్వ హక్కుగా కేటాయించబడే భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ న్యాయపరమైన, భూకేటాయింపు భావాలను నిలుపుతుంది.
- source_word: אִישׁ
  choice: ప్రతి గుంపుకు
  rationale: వ్యాకరణపరంగా పురుష ఏకవచనమైన אִישׁ ఇక్కడ పంపిణీయంగా వాడబడింది. సందర్భం వ్యక్తిగత పురుషులకు కాక, జనగణనలో లెక్కించబడిన గోత్ర లేదా వంశగుంపుల అనుపాత కేటాయింపుకు సంబంధించినందున భావాన్ని స్పష్టంగా తెలిపేలా అనువదించబడింది.
- source_word: לְפִי פְקֻדָיו
  choice: దానిలో లెక్కించబడినవారి సంఖ్యనుబట్టి
  rationale: లెక్కించబడినవారికి అనుగుణంగా, అంటే జనగణన సంఖ్యకు అనుపాతంగా స్వాస్థ్యం ఇవ్వాలనే సంక్షిప్త హీబ్రూ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יֻתַּן
  choice: ఇవ్వాలి
  rationale: נתן యొక్క నిష్క్రియ రూపం ‘ఇవ్వబడాలి’ అని అక్షరార్థం; ఆధునిక తెలుగులో విధ్యర్థక భావాన్ని సహజంగా తెలిపేందుకు ‘ఇవ్వాలి’ వాడబడింది.
