  text: But the sons of Korah did not die[a].
translation:
  language: te
  text: అయితే కోరహు కుమారులు చనిపోలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు కోరహు కుమారులు చనిపోలేదు.” హెబ్రీలోని అనుసంధాన పదాన్ని సాధారణ సమన్వయార్థంలో కూడా అనువదించవచ్చు; “అయితే” అనే పదం సందర్భంలో ముందుగా చెప్పిన మరణాలతో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: అయితే ... కుమారులు
  rationale: ו సాధారణంగా ‘మరియు’ అని అనువదించవచ్చు; అయితే ముందటి వచనాల్లో చెప్పిన మరణాలకు విరుద్ధంగా కోరహు కుమారులు బ్రతికినట్లు సందర్భం చూపుతున్నందున ‘అయితే’ సహజంగా ఆ వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది. בְנֵי వంశావళి సందర్భంలో ‘కుమారులు’ అని అనువదించబడింది.
- source_word: קֹרַח
  choice: కోరహు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לֹא
  choice: లేదు
  rationale: హెబ్రీ నిరాకరణను భూతకాల క్రియతో సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: מֵתוּ
  choice: చనిపో
  rationale: מות అనే మూలపదానికి ప్రాథమిక అర్థం ‘చనిపోవడం’; ఇక్కడ సాధారణ మరణార్థమే సందర్భానికి సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. సంక్షిప్తమైన హెబ్రీ వాక్య నిర్మాణాన్ని నిలుపుతూ సందర్భంలోని వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేశాం.
