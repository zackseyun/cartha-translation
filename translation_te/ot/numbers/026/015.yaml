translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన–వంశావళి సందర్భానికి తగిన గౌరవప్రదమైన సంక్షిప్త శైలి. వ్యక్తిపేర్లు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; ‘వంశం’ అనే పదం గోత్రంలోని ఉపవర్గాన్ని సూచిస్తుంది.
