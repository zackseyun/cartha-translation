language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: te
  text: 'గాదు కుమారులు, వారి వంశాల ప్రకారం: సెఫోను[a] యొక్క సెఫోనీయుల వంశం; హగ్గీ యొక్క హగ్గీయుల వంశం; షూనీ యొక్క షూనీయుల వంశం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాద సంప్రదాయాలు, ఆదికాండము 46:16తో పోల్చి, ఇక్కడ ‘సిఫ్యోను’ మరియు ‘సిఫ్యోనీయులు’ అనే రూపాలను చదువుతాయి. అయితే ఈ వచనంలోని మసొరా పాఠంలో צפון (‘సెఫోను’) ఉంది; అందువల్ల ప్రధాన పాఠంలో ‘సెఫోను’ ఉంచబడింది.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: గాదు కుమారులు
  rationale: గోత్ర మూలపురుషుని ద్వారా వచ్చిన వంశావళిని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు వంశావళి శైలిలో నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: జనగణన సందర్భంలో מִשְׁפָּחָה కుటుంబం కంటే విస్తృతమైన గోత్రాంతర్గత వంశవర్గాన్ని సూచిస్తుంది; ‘వంశాల ప్రకారం’ ఆ వర్గీకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִצְפוֹן
  choice: సెఫోను నుండి
  rationale: ఇక్కడ לְ వంశసంబంధ మూలాన్ని సూచిస్తుంది; తెలుగులో ‘నుండి’ ఆ వ్యక్తి నుండి వచ్చిన వంశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: సెఫోనీయుల వంశం
  rationale: మూలపురుషుడైన సెఫోను పేరు నుండి ఏర్పడిన వంశనామాన్ని తెలుగు జాతీయ/వంశీయ ప్రత్యయంతో అందిస్తుంది.
- source_word: לְחַגִּי ... מִשְׁפַּחַת הַחַגִּי
  choice: హగ్గీ నుండి హగ్గీయుల వంశం
  rationale: పునరావృతమయ్యే వంశావళి సూత్రాన్ని సమాంతరంగా నిలుపుతూ, హగ్గీ నుండి వచ్చిన వంశాన్ని సూచిస్తుంది.
- source_word: לְשׁוּנִי ... מִשְׁפַּחַת הַשּׁוּנִי
  choice: షూనీ నుండి షూనీయుల వంశం
  rationale: మూలంలోని సమాంతర నిర్మాణాన్ని కాపాడుతూ, షూనీ నుండి వచ్చిన వంశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
