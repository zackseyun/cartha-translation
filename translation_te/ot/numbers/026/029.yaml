id: NUM.26.29
reference: Numbers 26:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: te
  text: 'మనష్షే కుమారులు: మాకీరు నుండి మాకీరీయుల వంశం; మాకీరు గిలాదుకు తండ్రి అయ్యాడు; గిలాదు నుండి గిలాదీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారులు
  rationale: గోత్ర వంశావళి సందర్భంలో בְּנֵי విస్తృతంగా సంతతివారిని సూచించగలిగినా, మూలంలోని వంశావళి రూపాన్ని నిలుపుతూ సహజమైన తెలుగులో ‘కుమారులు’ అని అనువదించాం.
- source_word: לְמָכִיר
  choice: మాకీరు వంశం
  rationale: ఇక్కడ לְ అనేది మాకీరు నుండి వచ్చిన వంశశాఖను పరిచయం చేస్తుంది. తెలుగులో ఒంటరిగా ‘మాకీరుకు’ అనడం అసహజంగా ఉండటంతో, సందర్భార్థాన్ని స్పష్టంగా తెలిపే ‘మాకీరు వంశం’ ఎంచుకున్నాం.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: మాకీరీయుల వంశం
  rationale: ఈ జనగణన సందర్భంలో מִשְׁפָּחָה గోత్రంలోని వంశశాఖను సూచిస్తుంది; ‘వంశం’ సాధారణ పాఠకులకు సహజం. జాతివాచక రూపమైన הַמָּכִירִי ని ‘మాకీరీయులు’గా ఇచ్చాం.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: మాకీరు గిలాదును కనెను
  rationale: הוֹלִיד వంశావళిలో తండ్రి సంతానాన్ని కనడాన్ని సూచించే causative క్రియ. ‘కనెను’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి మూలంలోని ప్రత్యక్ష వంశావళి ప్రకటనను నిలుపుతుంది.
- source_word: לְגִלְעָד
  choice: గిలాదు వంశం
  rationale: ముందున్న לְמָכִיר కు సమాంతరంగా, గిలాదు నుండి వచ్చిన వంశశాఖను సూచిస్తుంది; సహజమైన తెలుగులో ‘గిలాదు వంశం’గా వ్యక్తపరిచాం.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: గిలాదీయుల వంశం
  rationale: מִשְׁפָּחָה ను జనగణనలోని వంశశాఖగా ‘వంశం’ అని, జాతివాచకమైన הַגִּלְעָדִי ని బహువచన సమూహార్థంలో ‘గిలాదీయులు’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. వ్యక్తిపేర్లకు తెలుగు బైబిల్ పఠనంలో సుపరిచితమైన ‘మనష్షే, మాకీరు, గిలాదు’ రూపాలు ఎంచుకోబడ్డాయి; మూలంలోని సమాంతర నిర్మాణం విరామచిహ్నాలతో స్పష్టపరచబడింది.
