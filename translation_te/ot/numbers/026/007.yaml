  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: te
  text: ఇవే రూబేనీయుల వంశాలు. వారిలో లెక్కించబడినవారు నలభై మూడు వేల ఏడు వందల ముప్పై మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిలో జనగణనలో నమోదైనవారు.” హీబ్రూ పదం జనగణనలో లెక్కించబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: సంఖ్యాకాండంలోని జనగణన, గోత్ర సందర్భంలో ఇది ఒక గోత్రంలోని బంధుత్వ ఉపవిభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָרֻאוּבֵנִי
  choice: రూబేనీయుల
  rationale: ఈ జాతివాచక రూపం రూబేను గోత్రానికి చెందినవారిని సూచిస్తుంది; ‘రూబేనీయులు’ తెలుగు బైబిలు శైలికి తగిన సహజ రూపం.
- source_word: פְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: జనగణన సందర్భంలో ఈ పదం నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. మూలంలోని కర్మణి భావాన్ని నిలుపుతూ, ఇక్కడ తిరిగి స్పష్టంగా లేని ‘పురుషులు’ అనే పదాన్ని అనవసరంగా చేర్చదు.
- source_word: וַיִּהְיוּ
  choice: మంది
  rationale: సంఖ్యను తెలుగులో సహజంగా తెలియజేయడానికి వ్యక్తుల లెక్కకు తగిన ‘మంది’ వాడబడింది; హీబ్రూ క్రియ యొక్క సంఖ్యాత్మక నిర్ధారణ భావం వాక్య నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: నలభై మూడు వేల ఏడు వందల ముప్పై
  rationale: మూలంలోని సంఖ్యను అంకెలుగా కాక పదాలతో ఇచ్చి, జనగణన జాబితా యొక్క సాహిత్య రూపాన్ని నిలిపింది.
