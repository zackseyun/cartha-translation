id: NUM.26.30
reference: Numbers 26:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: te
  text: 'గిలాదుకు చెందిన కుమారులు వీరు: ఈయెజెరు నుండి ఈయెజెరీయుల వంశం; హేలెకు నుండి హేలెకీయుల వంశం.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గిలాదు కుమారులు’ అనే హీబ్రూ మాట తక్షణ కుమారులను మాత్రమే కాకుండా, పురుష వంశంలోని సంతతివారిని లేదా వంశశాఖలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: హీబ్రూ నిర్దేశక సర్వనామం కాలరహితం; జాబితాను సహజంగా పరిచయం చేయడానికి తెలుగులో ‘వీరు’ సరిపోతుంది.
- source_word: בְּנֵי גִלְעָד
  choice: గిలాదుకు చెందిన కుమారులు
  rationale: మూలంలోని వంశావళి సంబంధమైన ‘కుమారులు’ అనే భాషను నిలుపుతూ, వీరు గిలాదుకు చెందినవారని తెలుగులో స్పష్టంగా, సహజంగా తెలిపింది; సందర్భంలో ఇది తక్షణ కుమారులకే పరిమితం కాకపోవచ్చు.
- source_word: אִיעֶזֶר
  choice: ఈయెజెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేసింది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: సంఖ్యాకాండము 26లో గోత్రంలోని వంశశాఖను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָאִיעֶזְרִי
  choice: ఈయెజెరీయుల
  rationale: ఈయెజెరు నుండి వచ్చిన వంశీయులను సూచించే హీబ్రూ జాతి/వంశ విశేషణ రూపాన్ని తెలుగులో వంశనామంగా తెలిపింది.
- source_word: לְחֵלֶק
  choice: హేలెకు నుండి
  rationale: పునరావృత జనగణన సూత్రంలో ל తదుపరి వంశమూల పురుషుణ్ణి పరిచయం చేస్తుంది; ‘నుండి’ వంశోత్పత్తి సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַחֶלְקִי
  choice: హేలెకీయుల
  rationale: హేలెకు సంతతి వంశాన్ని సూచించే హీబ్రూ రూపాన్ని తెలుగులో వంశనామంగా తెలిపింది.
