translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన-వంశావళి శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన భాష వాడబడింది. వ్యక్తినామాలు హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; సమాంతర వాక్య నిర్మాణం నిలుపబడింది.
