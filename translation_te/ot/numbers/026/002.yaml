source:
  edition: WLC
  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారుల సమాజమంతటినీ లెక్కించండి[a]—ఇరవై సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే పైబడిన, ఇశ్రాయేలులో యుద్ధానికి బయలుదేరే వారందరినీ వారి పితృగృహాల ప్రకారం లెక్కించండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మొత్తం సమాజపు తలను ఎత్తండి.” ఇది “లెక్కించండి” లేదా “జనగణన చేయండి” అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: లెక్కించండి
  rationale: అక్షరార్థంగా ‘తలను ఎత్తండి’ అయిన ఈ హీబ్రూ నుడికారం జనగణన చేయడం లేదా సంఖ్య లెక్కించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘లెక్కించండి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כָּל־עֲדַת
  choice: సమాజమంతటిలో
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు ఒడంబడిక సముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని కుటుంబ సంబంధమైన పుంలింగ వ్యక్తీకరణను నిలుపుతుంది; యుద్ధసేవకు సంబంధించిన ఈ జనగణన సందర్భంలో దాని లింగసూచన కూడా ప్రాసంగికం.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయస్సు ఉన్నవారు
  rationale: వయోపరిమితిని తెలిపే హీబ్రూ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: తండ్రి వంశానికి చెందిన గృహ లేదా వంశ విభాగాల ఆధారంగా లెక్కించడాన్ని సూచిస్తుంది. ‘పితృగృహాలు’ మూలంలోని సామాజిక నిర్మాణాన్ని నిలుపుతుంది.
- source_word: כָּל־יֹצֵא צָבָא
  choice: యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు
  rationale: అక్షర నిర్మాణానికి దగ్గరగా ఉండి, సైనిక సేవ కోసం బయలుదేరేవారిని సూచిస్తుంది; ‘సమర్థులైన’ అని మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చదు.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: సమాజపరమైన లేదా పరిధిని తెలిపే భావాన్ని తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక ఒడంబడిక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని కుటుంబసంబంధ పుంలింగ రూపాన్ని తటస్థీకరించకుండా నిలిపింది; సైనిక జనగణన సందర్భం దీనికి మద్దతిస్తుంది.
- issue: כָּל־יֹצֵא צָבָא లో సైనిక అర్హత భావం
  choice: యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు
  alternative: సైనిక సేవకు సమర్థుడైన ప్రతి పురుషుడు
  rationale: హీబ్రూ వాక్యంలోని ‘బయలుదేరు’ అనే వ్యక్తీకరణను నిలుపుతూ, అర్హత లేదా సామర్థ్యాన్ని అదనంగా స్పష్టీకరించలేదు. అందువల్ల మూలంలోని స్వల్ప భావవ్యాప్తి అలాగే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని పితృవంశ నిర్మాణం, పుంలింగ కుటుంబపదం, సైనిక ప్రయోగం నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత పదబంధం వద్ద ఉంచబడింది.
