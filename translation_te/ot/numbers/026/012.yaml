id: NUM.26.12
reference: Numbers 26:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: te
  text: 'షిమ్యోను కుమారులు వారి వంశాల చొప్పున: నెమూయేలు వలన నెమూయేలీయుల వంశం; యామీను వలన యామీనీయుల వంశం; యాకీను వలన యాకీనీయుల వంశం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులు
  rationale: వంశావళి-జనగణన సూత్రంలో בְּנֵי అనే పురుష వంశరేఖను సూచించే పదబంధాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మִשְׁפָּחָה ఇక్కడ గోత్రంలోని వంశ విభాగాన్ని సూచిస్తుంది; ‘వంశం’ ఆధునిక తెలుగులో కుటుంబం కంటే ఈ జనగణన భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: לִנְמוּאֵל / לְיָמִין / לְיָכִין
  choice: నెమూయేలు నుండి / యామీను నుండి / యాకీను నుండి
  rationale: లామెద్ ఉపసర్గ జాబితాలో పేరుగల మూలపురుషునితో వంశ సంబంధాన్ని చూపుతుంది; తెలుగులో ‘నుండి’ ఆ సంతతి మూలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / הַיָּמִינִי / הַיָּכִינִי
  choice: నెమూయేలీయుల వంశం / యామీనీయుల వంశం / యాకీనీయుల వంశం
  rationale: హీబ్రూ జాతి/వంశ విశేషణాలను తెలుగులో బహువచన వంశనామాలుగా ఇవ్వడం జనగణన సూత్రానికి, సమాంతర నిర్మాణానికి సరిపోతుంది.
- source_word: שִׁמְעוֹן / נְמוּאֵל / יָמִין / יָכִין
  choice: షిమ్యోను / నెమూయేలు / యామీను / యాకీను
  rationale: హీబ్రూ ఉచ్చారణను ఆధారంగా చేసుకొని, తెలుగులో చదవడానికి సహజంగా ఉండే లిప్యంతరీకరణలు ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన జాబితా యొక్క సంక్షిప్త, సూత్రబద్ధ సమాంతర నిర్మాణాన్ని కాపాడుతూ గౌరవప్రదంగా, సులభంగా చదవదగిన శైలి.
