  to: 'షిమ్యోను కుమారులు వారి వంశాల చొప్పున: నెమూయేలు వలన నెమూయేలీయుల వంశం; యామీను వలన యామీనీయుల వంశం; యాకీను వలన యాకీనీయుల వంశం.'
