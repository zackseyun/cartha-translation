  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘కుమారులు’ మూలంలోని వంశావళి రూపాన్ని నిలుపుతుంది; సందర్భంలో అది సంతతివారిని సూచిస్తుంది.
