source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֤ת בְּנֵי אֶפְרַ֨יִם֙ לִ/פְקֻ֣דֵי/הֶ֔ם שְׁנַ֧יִם וּ/שְׁלֹשִׁ֛ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת אֵ֥לֶּה בְנֵי יוֹסֵ֖ף לְ/מִשְׁפְּחֹתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: te
  text: ఎఫ్రాయిము కుమారుల వంశాలు ఇవి. వారి లెక్కింపు ప్రకారం ముప్పై రెండు వేల ఐదువందల మంది.[a] వీరు తమ వంశాల ప్రకారం యోసేపు కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి నమోదును బట్టి,’ ‘వారి సంఖ్య ప్రకారం.’ హీబ్రూ పదబంధం జనగణనలో నమోదు చేసి లెక్కించే ప్రక్రియను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: జనగణన, గోత్ర విభజన సందర్భంలో ఈ పదం ఒక గోత్రంలోని బంధుత్వ ఉపవిభాగాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశాలు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారులు
  rationale: హీబ్రూ వంశావళి ప్రయోగాన్ని నిలుపుతుంది; ఈ సందర్భంలో ఇది ఎఫ్రాయిము సంతతివారిని సమష్టిగా సూచిస్తుంది.
- source_word: לִפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד అనే మూలపదానికి ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారు అనే భావం ఉంది. తెలుగు వాక్య నిర్మాణంలో ఈ అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: ముప్పై రెండు వేల ఐదువందల మంది
  rationale: మూలంలోని ఖచ్చితమైన సంఖ్యను ఆధునిక తెలుగు సంఖ్యాక్రమంలో అందిస్తుంది; వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చబడింది.
- source_word: בְנֵי יוֹסֵף
  choice: యోసేపు కుమారులు
  rationale: మూలంలోని పునరుక్త వంశావళి సూత్రాన్ని నిలుపుతూ ఎఫ్రాయిము యోసేపు వంశానికి చెందినవాడనే సంబంధాన్ని కాపాడుతుంది.
- source_word: לְמִשְׁפְחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ముందు వాడిన ‘వంశాలు’ అనే పదంతో ఏకరూపతను ఉంచి, మూలంలోని విభజన సూత్రాన్ని సన్నిహితంగా అనువదిస్తుంది.
