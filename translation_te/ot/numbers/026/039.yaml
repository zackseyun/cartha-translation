lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: షూఫాము నుండి
  rationale: ఈ జనగణన వంశావళి సూత్రంలో לְ ఉపసర్గం ఒక వ్యక్తి నుండి ఏర్పడిన వంశసంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘నుండి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది. שְׁפוּפָם అనే పేరును ‘షూఫాము’గా లిప్యంతరీకరించాం.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: గోత్రంలోని బంధుత్వ ఆధారిత ఉపవిభాగాన్ని సూచించే מִשְׁפָּחָהకు ఈ జనగణన సందర్భంలో ‘వంశం’ సహజమైన, స్పష్టమైన సమానం.
- source_word: הַשּׁוּפָמִי
  choice: షూఫామీయుల
  rationale: నిర్దిష్ట ఉపజాతి/వంశ సమూహాన్ని సూచించే ఈ gentilic రూపాన్ని తెలుగులో సమూహార్థకమైన ‘షూఫామీయుల’గా ఇచ్చాం.
- source_word: לְחוּפָם
  choice: హూఫాము నుండి
  rationale: మొదటి భాగంలోని నిర్మాణానికి అనుగుణంగా לְ ఉపసర్గాన్ని ‘నుండి’గా అనువదించాం; חוּפָם అనే పేరును ‘హూఫాము’గా లిప్యంతరీకరించాం.
- source_word: הַחוּפָמִי
  choice: హూఫామీయుల
  rationale: హూఫాము నుండి వచ్చిన వంశ సమూహాన్ని సూచించే gentilic రూపాన్ని తెలుగులో ‘హూఫామీయుల’గా ఇచ్చాం.
