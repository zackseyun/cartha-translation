  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: te
  text: 'హెఫెరు కుమారుడైన సెలోఫెహాదుకు కుమారులు లేరు[a], కుమార్తెలు మాత్రమే ఉన్నారు. సెలోఫెహాదు కుమార్తెల పేర్లు ఇవి: మహ్లా, నోవా,[b] హొగ్లా, మిల్కా, తిర్సా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతనికి కుమారులు లేరు, కుమార్తెలు తప్ప” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నోవా” అనేది సెలోఫెహాదు కుమార్తెలలో ఒకరి పేరు; జలప్రళయ వృత్తాంతంలోని నోవహు పేరు కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד בֶּן חֵפֶר
  choice: హేఫెరు కుమారుడైన సెలొఫెహాదు
  rationale: వంశసంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో ఉంచి, వావ్ సంధిని సందర్భానుసారంగా ప్రత్యేక పదంతో అనువదించలేదు.
- source_word: לֹא הָיוּ ל֛/וֹ בָּנִים
  choice: కుమారులు లేరు
  rationale: హీబ్రూ స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కుమార్తెలతో ఉన్న స్పష్టమైన వ్యత్యాసం కారణంగా ‘కుమారులు’ అనే అర్థాన్ని నిలిపాం.
- source_word: כִּי אִם בָּנוֹת
  choice: కుమార్తెలు మాత్రమే ఉన్నారు
  rationale: మినహాయింపు మరియు వ్యత్యాసాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד
  choice: సెలొఫెహాదు కుమార్తెల పేర్లు
  rationale: హీబ్రూలో ‘పేరు’ ఏకవచన రూపంలో ఉన్నా జాబితాకు ముందు సమూహార్థంలో వాడబడింది; తెలుగులో సహజంగా బహువచనం వాడాం.
- source_word: מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה
  choice: మహ్లా, నోవా, హొగ్లా, మిల్కా, తిర్సా
  rationale: హీబ్రూ వ్యక్తినామాలను ఆధునిక తెలుగు పాఠకులకు పలకడానికి అనుకూలంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వంశావళి సందర్భానికి తగిన ‘కుమారుడు/కుమార్తెలు’ పదాలు నిలిపి, వ్యక్తినామాలు హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడ్డాయి.
