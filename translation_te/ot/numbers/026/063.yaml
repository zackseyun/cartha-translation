base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: te
  text: మోషేను, యాజకుడైన ఎలియాజరును లెక్కించినవారు వీరే. వారు యొర్దాను ఒడ్డున, యెరికోకు ఎదురుగా ఉన్న మోయాబు మైదానాల్లో ఇశ్రాయేలు కుమారులను[a] లెక్కించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులను’ లేదా ‘ఇశ్రాయేలు సంతానాన్ని.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యెరికో సమీపంలోని యొర్దాను ఒడ్డున’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: లెక్కించినవారు
  rationale: జనగణన సందర్భంలో ఈ నిర్మిత రూపం లెక్కలో చేర్చబడిన వ్యక్తులను సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘లెక్కించినవారు’ సహజంగా ఉండి వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: హీబ్రూలో ఉన్నది ‘యాజకుడు’ అనే బిరుదే; సందర్భాన్ని బట్టి ‘ప్రధాన యాజకుడు’ అని విస్తరించలేదు.
- source_word: פָּקְדוּ
  choice: లెక్కించారు
  rationale: మూలంలోని పקד ధాతువు పునరావృతిని తెలుగులోనూ ‘లెక్కించు’ ద్వారా నిలిపి, జనగణన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని అక్షరార్థమైన, వంశసంబంధ పురుషలింగ వ్యక్తీకరణను నిలుపుతుంది; విస్తృతార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: ఈ భౌగోళిక పదబంధంలో עֲרָבוֹת సమతల మైదానాలను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: యెరికోకు ఎదురుగా యొర్దాను దగ్గర
  rationale: ఈ భౌగోళిక నిర్మాణం మోయాబు మైదానాలను యొర్దాను నది పక్కన, యెరికోకు ఆవలివైపు ఉన్న ప్రదేశంగా సూచించగలదు. ‘ఎదురుగా’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది; మరింత సంక్షిప్త ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక వంశపదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని పురుషలింగ, వంశావళి రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సామూహిక విస్తృతార్థాన్ని పాదసూచికలో అందించాం.
- issue: ఎలియాజరు అధికారిక బిరుదు
  choice: యాజకుడు
  alternative: ప్రధాన యాజకుడు
  rationale: హీబ్రూ పాఠ్యంలో הַכֹּהֵן, ‘యాజకుడు’ మాత్రమే ఉంది. సందర్భం ఆధారంగా అదనపు బిరుదును చేర్చకుండా పాఠ్య నియంత్రణను పాటించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. జనగణనకు సంబంధించిన మూలధాతువు పునరావృతిని ‘లెక్కించినవారు/లెక్కించారు’గా నిలిపాం. స్థలవివరణలోని స్వల్ప అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
