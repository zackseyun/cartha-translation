source:
  edition: WLC
  text: אֵ֗לֶּה פְּקוּדֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל שֵׁשׁ מֵא֥וֹת אֶ֖לֶף וָ/אָ֑לֶף שְׁבַ֥ע מֵא֖וֹת וּ/שְׁלֹשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: te
  text: 'ఇవే ఇశ్రాయేలు కుమారులలో[a] లెక్కించబడినవారు[b]: మొత్తం ఆరు లక్షల ఒక వెయ్యి ఏడువందల ముప్పై మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు” లేదా “ఇశ్రాయేలు సంతానం.” అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “లెక్కలో నమోదైనవారు”; హీబ్రూ పదం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: మొత్తం
  rationale: ఈ సూచనాత్మక బహువచనం ముందున్న గోత్రాల లెక్కల సమగ్ర ఫలితాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజంగా మొత్తం అనే నిర్మాణంతో భావం వ్యక్తమవుతుంది.
- source_word: פְּקוּדֵי
  choice: లెక్కించబడిన ... మంది
  rationale: פקד మూలం ఇక్కడ జనగణనలో నమోదై లెక్కించబడిన వ్యక్తులను సూచిస్తుంది; కేవలం సంఖ్య అనే అమూర్త పదం కంటే వ్యక్తుల భావాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన పదబంధాన్ని లింగసూచనతో సహా సమీపంగా నిలుపుతూ, జాతికి చెందిన లెక్కించబడిన పురుషులను సూచిస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: ఆరు లక్షల వెయ్యి ఏడు వందల ముప్పై
  rationale: హీబ్రూ సంకలన సంఖ్యను దాని భాగాల క్రమంలోనే తెలుగులో సహజంగా అందిస్తుంది; మొత్తం 601,730.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని అక్షరార్థ కుటుంబ పదబంధాన్ని నిలుపుతుంది; ఈ జనగణన సందర్భంలో లెక్కించబడిన పురుషులను సూచించే లింగసూచనను చెరపదు.
- issue: פְּקוּדֵי యొక్క జనగణనార్థం
  choice: లెక్కించబడిన ... మంది
  alternative: లెక్కలో నమోదైనవారు / జనగణన మొత్తం
  rationale: ఇది కేవలం అమూర్త సంఖ్య కాక, జనగణనలో నమోదైన వ్యక్తుల సంఖ్య అని స్పష్టం చేస్తూ హీబ్రూ ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సంఖ్యను మూలంలోని సంకలన రూపానికి దగ్గరగా పదాలతో ఇచ్చి, ‘మంది’ ద్వారా వ్యక్తుల లెక్క అని స్పష్టం చేయబడింది.
