base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: te
  text: 'మీతో పాటు నిలబడవలసిన పురుషుల పేర్లు ఇవి: రూబేను గోత్రం తరఫున[a] షెదేయూరు కుమారుడు ఎలీషూరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రూబేను గోత్రం నుండి.” హీబ్రూ విభక్తి గోత్ర అనుబంధాన్ని గానీ, ఆ గోత్రానికి ప్రాతినిధ్యం వహించడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: పేర్లు ఇవి
  rationale: హీబ్రూ జాబితాను పరిచయం చేసే సూత్రాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో ఇచ్చాం; వావ్ తెలిపే కొనసాగింపు సందర్భంలోనే స్పష్టంగా ఉండడంతో ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: הָאֲנָשִׁים
  choice: పురుషుల
  rationale: ఇక్కడ జనగణనలో సహాయపడే నిర్దిష్ట పురుష ప్రతినిధులను సూచిస్తుంది; మూలంలోని లింగ నిర్దిష్టతను నిలిపాం.
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: మీతో పాటు నిలబడవలసిన
  rationale: עמד అనే ‘నిలబడు’ భావాన్ని నిలుపుతూ, సందర్భంలోని నియామక/సహాయక బాధ్యతను ‘వలసిన’ ద్వారా సహజంగా వ్యక్తం చేశాం. ‘మీరు’ బహువచనం.
- source_word: לִרְאוּבֵן
  choice: రూబేను గోత్రం తరఫున
  rationale: לְ ఇక్కడ గోత్ర అనుబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సందర్భానుకూలమైన ప్రాతినిధ్య భావాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֱלִיצוּר
  choice: ఎలీషూరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן שְׁדֵיאוּר
  choice: షెదేయూరు కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ సూత్రాన్ని సహజ తెలుగు పదక్రమంలో ఇచ్చాం; వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
