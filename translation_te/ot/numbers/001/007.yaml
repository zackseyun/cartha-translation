  terminology: “గోత్రం తరఫున” appropriately expresses tribal representation. “అమ్మీనాదాబు” is an acceptable established Telugu biblical transliteration. “నహష్షోను” follows established Telugu biblical name usage and more closely represents the Hebrew name.
