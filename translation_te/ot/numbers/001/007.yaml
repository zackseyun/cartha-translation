  source_fidelity: The representative sense of לִיהוּדָה is conveyed accurately by “యూదా గోత్రం తరఫున,” and the father-son relationship is preserved. However, the personal name נַחְשׁוֹן is not faithfully transliterated as “నయస్సోను”; it requires a form reflecting the initial נַחְשׁ, conventionally “నహష్షోను.”
