translation:
  language: te
  text: యూదా గోత్రం తరఫున, అమ్మీనాదాబు కుమారుడైన నహష్షోను;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִיהוּדָה
  choice: యూదా గోత్రం తరఫున
  rationale: ఉపసర్గ לְ ఈ గోత్ర ప్రతినిధుల జాబితాలో అనుబంధం లేదా ప్రాతినిధ్యాన్ని సూచిస్తోంది. ఆధునిక తెలుగులో ‘యూదా గోత్రం తరఫున’ అనే రూపం భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַחְשׁוֹן
  choice: నయస్సోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వ్యక్తినామాల మధ్యనున్న ఈ నిర్మాణం ఇక్కడ ప్రత్యక్ష పుత్ర సంబంధాన్ని సూచిస్తుంది; ‘కుమారుడు’ సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: עַמִּינָדָב
  choice: అమ్మీనాదాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
