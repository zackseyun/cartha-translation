translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా సందర్భానికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. మూలంలోని గోత్ర ప్రాతినిధ్య భావాన్ని స్పష్టం చేయడానికి ‘గోత్రం తరఫున’ వాడబడింది.
