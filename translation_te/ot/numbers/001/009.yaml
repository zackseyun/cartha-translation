  text: 'For Zebulun: Eliab son of Helon.'
translation:
  language: te
  text: 'జెబూలూనుకు: హేలోను కుమారుడు ఎలీయాబు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/זְבוּלֻן
  choice: జెబూలూను కోసం
  rationale: ఉపసర్గ ל ఈ జనగణన జాబితాలో సంబంధం లేదా నియామకాన్ని సూచిస్తూ, జెబూలూనుకు ప్రాతినిధ్యం వహించే వ్యక్తిని పరిచయం చేస్తుంది. ‘కోసం’ అనే రూపం జాబితా నిర్మాణాన్ని సహజంగా నిలుపుతుంది; మూలంలో లేని ‘గోత్రం’ అనే పదాన్ని చేర్చదు.
- source_word: אֱלִיאָב
  choice: ఏలీయాబు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశ సంబంధాన్ని తెలిపే హెబ్రీ నిర్మాణానికి సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: חֵלֹן
  choice: హేలోను
  rationale: వ్యక్తి పేరును మూల ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని, గౌరవప్రదమైన బైబిలు నామరూపాలను నిలిపాం. వివరణాత్మకంగా ‘జెబూలూను గోత్రం’ అని విస్తరించకుండా మూలంలోని సంక్షిప్తతను కాపాడాం.
