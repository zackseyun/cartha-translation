language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: te
  text: ఇశ్శాఖారు కుమారుల విషయమై, వారి తరతరాల వంశక్రమాల ప్రకారం, వారి కుటుంబగుంపుల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్య ప్రకారం, ఇరవై సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే ఎక్కువ వయస్సు గల, యుద్ధానికి వెళ్లగల ప్రతి పురుషుడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి వెళ్లే ప్రతి పురుషుడు.” హీబ్రూ నుడికారం అక్షరార్థంగా “సైన్యానికి బయలుదేరే ప్రతి ఒక్కరు”; ఇక్కడ అది సైనిక సేవకు అర్హులైన పురుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: ఇశ్శాఖారు కుమారుల
  rationale: గోత్ర జనగణన సందర్భంలో בְּנֵי అనేది ఇశ్శాఖారు వంశంలోని పురుష సభ్యులను సూచిస్తుంది; ‘కుమారులు’ మూలంలోని లింగ, వంశ సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వంశాల ప్రకారం
  rationale: ఇక్కడ ఈ పదం తరతరాల వంశక్రమ విభాగాలను సూచిస్తుంది; తెలుగులో ‘వంశాల ప్రకారం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి గోత్రాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ ఇశ్శాఖారు గోత్రంలోని చిన్న బంధుత్వ విభాగాన్ని సూచిస్తుంది. ‘గోత్రాలు’ సాధారణ పాఠకునికి అర్థమయ్యే సాంప్రదాయిక పదం, అయితే ఆధునిక ‘కుటుంబాలు’ కంటే విస్తృతమైన సమూహాన్ని తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: ఇశ్రాయేలు సమాజంలోని తండ్రి వంశాధారిత కుటుంబ వ్యవస్థను ‘పితృకుటుంబాలు’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యనుబట్టి
  rationale: పేరు పేరున వ్యక్తులను లెక్కించే జనగణన నుడికారాన్ని మూలానికి సమీపంగా నిలుపుతుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారిలో
  rationale: ఇరవై ఏళ్లను కలుపుకొని పై వయస్సుల వారందరినీ సూచించే హద్దును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: యుద్ధానికి వెళ్లగల ప్రతి పురుషుణ్ణి
  rationale: అక్షరార్థంగా ‘సైన్యానికి/యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు.’ ఈ జనగణన సందర్భంలో సైనిక సేవకు అర్హులైన పురుషులను సూచిస్తుంది; సామర్థ్య భావాన్ని స్పష్టపరుస్తూనే మూలంలోని పురుష-నిర్దిష్ట సందర్భాన్ని నిలుపుతుంది.
theological_decisions:
- issue: జనగణనలో లింగ-నిర్దిష్ట భాష
  choice: యుద్ధానికి వెళ్లగల ప్రతి పురుషుణ్ణి
  alternative: యుద్ధానికి వెళ్లే ప్రతి ఒక్కరిని
  rationale: హీబ్రూ నిర్మాణం వ్యాకరణపరంగా పుంలింగంలో ఉంది; సందర్భం కూడా సైనిక వయస్సు గల గోత్రపు పురుషుల జనగణన గురించే. అందువల్ల లింగాన్ని తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకునికి అర్థమయ్యే శైలి. మూల వాక్యం తదుపరి వచనంలో సంఖ్యతో పూర్తయ్యే జాబితా నిర్మాణం కావడంతో చివర ద్విబిందువు ఉంచబడింది. [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
