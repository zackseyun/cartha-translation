translation:
  language: te
  text: ఎఫ్రాయిము గోత్రం నుండి నమోదైనవారు నలభై వేల ఐదు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: నమోదైనవారు
  rationale: פקד మూలం నుండి వచ్చిన ఈ రూపం జనగణనలో లెక్కించి నమోదు చేసినవారిని సూచిస్తుంది. ‘నమోదైనవారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో స్పష్టంగా లేని సైనిక భావాన్ని అదనంగా చేర్చదు.
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ జనగణన సూత్రప్రయోగంలో לְמַטֵּה గోత్ర సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘గోత్రం నుండి’ సభ్యత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶפְרָיִם
  choice: ఎఫ్రాయిము
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: నలభై వేల ఐదు వందల మంది
  rationale: మూలంలోని సంఖ్యను యథాతథంగా పదాలతో తెలిపి, లెక్కించబడిన వ్యక్తులను సూచించేందుకు సహజమైన తెలుగు ప్రకారం ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జనగణన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని సంక్షిప్త సూత్రశైలిని కాపాడుతూ సహజ తెలుగు కోసం క్రియను స్పష్టంగా ఉంచాం.
