  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: te
  text: 'షిమ్యోను కుమారుల విషయమై, వారి తరాల ప్రకారం, వారి కుటుంబాల ప్రకారం, వారి పితరుల ఇళ్ల ప్రకారం, పేర్ల సంఖ్య ప్రకారం, ఒక్కొక్కరిని విడివిడిగా లెక్కించినవారు[a][c]—ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడిన, యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిలో సమీకరించబడినవారు”; פקד అనే హీబ్రూ పదం ఈ సైనిక జనగణన సందర్భంలో లెక్కించడం లేదా సమీకరించడం అనే రెండు భావఛాయలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సైనిక సేవకు తగిన ప్రతి పురుషుడు”; హీబ్రూ పదబంధానికి మరింత అక్షరార్థం, “యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “వారి తలల/పుర్రెల చొప్పున”; ఇది వ్యక్తులను ఒక్కొక్కరిని విడివిడిగా లెక్కించడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులలో
  rationale: గోత్ర జనగణన సందర్భంలో בני అనేది షిమ్యోను వంశానికి చెందిన పురుష సభ్యులను సూచిస్తుంది; ‘కుమారులు’ మూలంలోని పూర్వపితతో సంబంధాన్ని నిలుపుతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: ఈ జనగణన సందర్భంలో ఈ పదం తరాల క్రమం లేదా వంశపరంపర రికార్డులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశావళులు’ పరిపాలనా-వంశ సంబంధ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: משפחה ఇక్కడ గోత్రంలోని ఉపవంశ లేదా బంధుత్వ సమూహాన్ని సూచిస్తుంది; ‘వంశాలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: בית אבות ఇశ్రాయేలు సామాజిక వ్యవస్థలో పితృవంశ ఆధారిత గృహ సమూహం; ‘పితృగృహాలు’ మూల నిర్మాణాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: פְּקֻדָיו
  choice: లెక్కించబడినవారు
  rationale: פקד యొక్క ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది; సైనిక సమీకరణ భావాన్ని ప్రధాన వచనంలో అవసరానికి మించి బలపరచకుండా ఉంచుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: వ్యక్తుల పేర్ల ఆధారంగా చేసిన అధికారిక లెక్కింపును తెలిపే మూలపదబంధానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
- source_word: לְגֻלְגְּלֹתָם
  choice: ఒక్కొక్కరిగా
  rationale: అక్షరార్థంగా ‘వారి తలల చొప్పున’; వ్యక్తిగతంగా లెక్కించడమనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి పురుషుడు
  rationale: זכר లింగాన్ని నిర్దిష్టంగా సూచిస్తుంది; జనగణన సందర్భంలో ‘ప్రతి పురుషుడు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడిన
  rationale: వయోపరిమితిని తెలిపే హీబ్రూ సూత్రాన్ని పూర్తి భావంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు
  rationale: అక్షరార్థంలోని ‘సైన్యానికి/యుద్ధానికి బయలుదేరేవాడు’ అనే భావాన్ని నిలుపుతూ, ‘సైనిక సేవకు అర్హుడు’ అని వివరణాత్మకంగా తేల్చకుండా అసలు వ్యక్తీకరణను కాపాడుతుంది.
