translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జనగణన శైలిని ఉపయోగించాం. హీబ్రూ జాబితా నిర్మాణాన్ని నిలుపుతూ తెలుగులో చదవడానికి సహాయంగా డ్యాష్ వాడాం. לְגֻלְגְּלֹתָם యొక్క అక్షరార్థమైన ‘తలల చొప్పున’ కన్నా సహజమైన ‘ఒక్కొక్కరిగా’ ఎంచుకున్నాం; ప్రధాన వచనంలోని రెండు అడుగుజాడ సూచికలు [a], [b] సంబంధిత ప్రత్యామ్నాయాలను మాత్రమే తెలియజేస్తాయి.
