revisions:
- from: 'షిమ్యోను కుమారులలో, వారి వంశావళుల ప్రకారం, వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం, పేర్ల సంఖ్యను బట్టి ఒక్కొక్కరిగా లెక్కించబడినవారు[a]—ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడిన ప్రతి పురుషుడు, యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు[b]:'
  to: 'షిమ్యోను కుమారుల విషయమై, వారి తరాల ప్రకారం, వారి కుటుంబాల ప్రకారం, వారి పితరుల ఇళ్ల ప్రకారం, పేర్ల సంఖ్య ప్రకారం, ఒక్కొక్కరిని విడివిడిగా లెక్కించినవారు[a][c]—ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడిన, యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు[b]:'
  rationale: The revision corrects the introductory relationship, improves the formal census phrasing, and makes the age and military expressions jointly qualify “every male,” as in the Hebrew. It retains the source’s military ambiguity and adds the omitted note for the head-counting idiom.
