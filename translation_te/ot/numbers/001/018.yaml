source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: te
  text: రెండో నెల మొదటి రోజున వారు సమాజమంతటినీ సమావేశపరిచారు. అప్పుడు వారు తమ వంశాల ప్రకారం, తమ పితృకుటుంబాల ప్రకారం తమ వంశావళిని నమోదు చేసుకున్నారు.[a] పేర్ల సంఖ్య ప్రకారం, ఇరవై సంవత్సరాలు మరియు అంతకంటే ఎక్కువ వయస్సు గలవారిని ఒక్కొక్కరుగా లెక్కించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తమ వంశావళిని ప్రకటించారు” లేదా “వంశక్రమం ప్రకారం నమోదు అయ్యారు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ అరుదైన వంశావళి పదం; జన్మవంశం ఆధారంగా నమోదు కావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థం “వారి తలల ప్రకారం”; అంటే ప్రతి వ్యక్తిని ఒక్కొక్కరిగా లెక్కించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: సమావేశపరిచారు
  rationale: హిఫీల్ రూపంలోని ‘సమకూర్చడం/సమావేశపరచడం’ అనే causative భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతటినీ
  rationale: ఇశ్రాయేలు ప్రజల సమష్టి సమాజాన్ని సూచించే עֵדָה భావాన్ని, כָּל అనే సమగ్రతతో కలిపి అందిస్తుంది.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెల మొదటి రోజున
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని సహజంగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: וַיִּתְיַלְדוּ
  choice: తమ వంశావళిని నమోదు చేయించుకున్నారు
  rationale: ఈ అరుదైన హిత్పయేల్ వంశసంబంధ క్రియ జన్మవంశాన్ని ప్రకటించడం లేదా దాని ఆధారంగా నమోదవడం అనే భావాన్ని సూచిస్తుంది; census సందర్భంలో ఈ ఎంపిక రెండు అంశాలనూ కలుపుతుంది.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: జనగణన సందర్భంలో מִשְׁפָּחָה కుటుంబం కంటే విస్తృతమైన బంధుత్వ వర్గాన్ని సూచించగలదు; ‘వంశాలు’ ఆధునిక తెలుగులో సరళంగా ఉంటుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ పితృకుటుంబాల ప్రకారం
  rationale: ‘తండ్రుల ఇళ్లు’ అనే సాంకేతిక పితృవంశ గృహవిభాగ భావాన్ని అక్షరబద్ధంగా కాకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యనుబట్టి
  rationale: పేరుపేరున వ్యక్తులను లెక్కించిన పరిపాలనా స్వభావాన్ని మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్నవారు
  rationale: వయస్సు పరిమితిని ఆధునిక తెలుగులో సహజంగా, నిర్దిష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְגֻלְגְּלֹתָם
  choice: ఒక్కొక్కరుగా
  rationale: అక్షరార్థంగా ‘వారి కపాలాల/తలల ప్రకారం’; ఇక్కడ ప్రతి వ్యక్తిని విడివిడిగా లెక్కించడం అనే నుడికారార్థాన్ని సహజంగా తెలియజేస్తుంది.
