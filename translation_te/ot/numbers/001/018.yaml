translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘పితృకుటుంబాలు’ ద్వారా ప్రాచీన ఇశ్రాయేలీయ బంధుత్వ వ్యవస్థ నిలుపబడింది. అరుదైన וַיִּתְיַלְדוּ పదంలోని వంశప్రకటన/నమోదు సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
