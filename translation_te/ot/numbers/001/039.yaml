lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד మూలం నుంచి వచ్చిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. సందర్భంలో లెక్కించబడే జనాభా పురుషులని ముందే నిర్వచించినందున ఇక్కడ ప్రత్యేకంగా ‘పురుషులు’ అని చేర్చలేదు.
- source_word: לְמַטֵּה דָן
  choice: దాను గోత్రంలో
  rationale: ఈ జనగణన సూత్రంలో לְמַטֵּה గోత్ర సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దాను గోత్రంలో’ సహజంగా ఉండి, లెక్కించబడినవారు ఆ గోత్రానికి చెందినవారని తెలియజేస్తుంది.
- source_word: דָן
  choice: దాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి/గోత్ర నామరూపాన్ని ఉపయోగించాం.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: అరవై రెండు వేల ఏడు వందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని యథాతథంగా అనుకరించకుండా, మొత్తం 62,700ను సహజమైన ఆధునిక తెలుగు సంఖ్యా క్రమంలో తెలిపాం; వ్యక్తుల సంఖ్య అని స్పష్టత కోసం ‘మంది’ వాడాం.
