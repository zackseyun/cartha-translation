  text: బెన్యామీను గోత్రానికి చెందిన లెక్కించబడినవారు ముప్పై ఐదు వేల నాలుగు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד మూలం నుంచి వచ్చిన ఈ రూపం జనగణనలో లెక్కకు వచ్చినవారిని సూచిస్తుంది. ఈ వచనంలో ‘పురుషులు’ అనే పదం ప్రత్యక్షంగా లేకపోవడంతో దానిని అనవసరంగా చేర్చకుండా, సహజమైన తెలుగులో ‘లెక్కించబడినవారు’ అని అనువదించాం.
- source_word: לְמַטֵּה
  choice: గోత్రంలో
  rationale: ఈ జనగణన సూత్రప్రయోగంలో לְ ఉపసర్గతో కూడిన מַטֶּה గోత్ర సంబంధాన్ని తెలియజేస్తుంది. తెలుగులో ‘గోత్రంలో’ అనేది లెక్కించబడినవారు ఆ గోత్రానికి చెందినవారని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בִנְיָמִן
  choice: బెన్యామీను
  rationale: హీబ్రూ గోత్రనామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపాన్ని ఉపయోగించాం.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ముప్పై ఐదు వేల నాలుగు వందల మంది
  rationale: హీబ్రూ సంఖ్యా విలువ 35,400ను యథాతథంగా ఉంచి, ఆధునిక తెలుగులో సహజమైన సంఖ్యా క్రమంలో ఇచ్చాం. వ్యక్తుల సంఖ్య అని స్పష్టపరచడానికి చివర ‘మంది’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భానికి తగిన సరళమైన మరియు గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలో లేని లింగ సూచనను చేర్చలేదు.
