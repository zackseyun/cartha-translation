  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: te
  text: అప్పుడు మోషే మరియు అహరోను పేరుపేరునా గుర్తించబడిన ఈ మనుష్యులను తీసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేర్లతో పేర్కొనబడిన,” అంటే “ప్రత్యేకంగా గుర్తించబడిన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నారు
  rationale: לקח అనే క్రియ యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతూ, ఇక్కడ మోషే అహరోనులు ముందుగా గుర్తించబడిన వారిని తమతో చేర్చుకున్నారనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది. హీబ్రూలో క్రియ ఏకవచనంగా ఉన్నా, సంయుక్త కర్తకు ఆధునిక తెలుగులో బహువచన క్రియ సహజం.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలు; ‘మరియు’ స్థానంలో సహజమైన జాబితా నిర్మాణాన్ని ఉపయోగించాం.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: ఈ మనుష్యులను
  rationale: אֲנָשִׁים ఇక్కడ మునుపటి వచనాల్లో పేర్లతో చెప్పబడిన పురుష ప్రతినిధులను సూచిస్తుంది. ‘నాయకులను’ అనడం సందర్భాన్ని వ్యాఖ్యానించి చేర్చినట్లవుతుంది కాబట్టి మూలంలోని సాధారణ పదాన్నే నిలిపాం.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: పేరుపేరునా గుర్తించబడిన
  rationale: נקב యొక్క నిఫ్అల్ రూపం, בְּשֵׁמוֹתతో కలిసి, పేర్ల ద్వారా ప్రత్యేకంగా గుర్తించబడటం లేదా నిర్దేశించబడటం అనే భావాన్ని ఇస్తుంది. ‘పేరుపేరునా గుర్తించబడిన’ అనేది ఆ అధికారిక, నిర్దిష్ట గుర్తింపును సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘పేరుపేరునా’ అనే సహజ ప్రయోగం హీబ్రూ בְּשֵׁמוֹת యొక్క వ్యక్తిగత గుర్తింపు భావాన్ని అందిస్తుంది. మూలంలోని వాక్యనిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు సంయుక్త కర్తకు తగిన బహువచన క్రియను ఉపయోగించాం.
