  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
