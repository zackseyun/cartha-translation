  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: te
  text: 'యాహ్వే సీనాయి అరణ్యంలో, సమావేశ గుడారంలో[a], వారు ఐగుప్తు దేశం నుంచి బయలుదేరిన రెండవ సంవత్సరంలోని రెండవ నెల మొదటి రోజున మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘సమావేశ గుడారం’; సంప్రదాయంగా ‘గుడార మందిరం’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే సాధారణ కథన క్రియ. ‘మాట్లాడాడు’ మూలంలోని דבר భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: בְּמִדְבַּר סִינַי
  choice: సీనాయి అరణ్యంలో
  rationale: מִדְבָּר అనేది జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది; ‘అరణ్యం’ తెలుగు బైబిలు సందర్భంలో సహజంగా, విస్తృతార్థంతో ఉంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలో
  rationale: ఈ పదబంధానికి అక్షరార్థం ‘సమావేశపు గుడారం’; దేవుడు మోషేతో కలుసుకునే స్థలమనే భావాన్ని పారదర్శకంగా తెలియజేస్తుంది.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెల మొదటి రోజున
  rationale: హీబ్రూ తేదీ ప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగు క్రమంలో అందించింది.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: రెండో సంవత్సరం
  rationale: కాల సూచనను సూటిగా అనువదించింది.
- source_word: לְצֵאתָם
  choice: వారు బయలుదేరిన
  rationale: ప్రత్యయంతో కూడిన infinitive construct ఇశ్రాయేలీయుల నిర్గమనాన్ని సూచిస్తుంది; తెలుగు ఉపవాక్యంగా సహజంగా వ్యక్తమైంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుంచి
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్ని నిలుపుతూ విభక్తి సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: לֵאמֹר
  choice: 'ఆయన ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలో వచ్చే మాటలను పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా, కోలన్‌తో అందించింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించడం మూల రూపాన్ని కాపాడుతుంది.
- issue: אֹהֶל מוֹעֵד అనే ఆరాధనా స్థలపదం
  choice: సమావేశ గుడారం
  alternative: గుడార మందిరం; ప్రత్యక్షపు గుడారం
  rationale: ‘సమావేశ గుడారం’ హీబ్రూ పదబంధంలోని ‘గుడారం’ మరియు ‘సమావేశం/కలయిక’ అనే రెండు అంశాలనూ నిలుపుతుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని స్థలం, తేదీ, నిర్గమన కాలసూచనలను నిలుపుతూ, తెలుగు వాక్యప్రవాహం కోసం తేదీ భాగాన్ని రెండో వాక్యానికి అనుసంధానించి ప్రసంగ పరిచయాన్ని సహజంగా రూపొందించింది.
