translation:
  language: te
  text: జెబూలూను గోత్రంలో నమోదైనవారు 57,400 మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: నమోదైనవారు
  rationale: פקד అనే మూలపదం ఇక్కడ జనగణనలో లెక్కించి నమోదు చేయబడినవారిని సూచిస్తుంది. ‘నమోదైనవారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సైనిక సమీకరణ భావాన్ని అవసరానికి మించి స్పష్టీకరించదు.
- source_word: לְמַטֵּה
  choice: గోత్రంలో
  rationale: ఈ పునరావృత జనగణన సూత్రంలో לְמַטֵּה గోత్రానికి చెందినవారిని సూచిస్తుంది. తెలుగులో ‘గోత్రంలో నమోదైనవారు’ అనేది సహజంగా ఆ అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: హీబ్రూ గోత్రనామాన్ని తెలుగులో గుర్తించదగిన, మూల ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400 మంది
  rationale: హీబ్రూ సంఖ్యా క్రమం మొత్తం 57,400ను సూచిస్తుంది. అంకెలు ఆధునిక పాఠకులకు స్పష్టంగా ఉంటాయి; ‘మంది’ మనుషుల సంఖ్యను సహజ తెలుగులో తెలియజేస్తుంది.
