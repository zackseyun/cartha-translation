source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֖ם לְ/מַטֵּ֣ה אֲבֹתָ֑/ם לֹ֥א הָתְפָּקְד֖וּ בְּ/תוֹכָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: te
  text: అయితే లేవీయులు తమ పితరుల గోత్రం ప్రకారం వారిలో లెక్కించబడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిలో నమోదు చేయబడలేదు” లేదా “వారితోపాటు సమీకరించి లెక్కించబడలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: అయితే లేవీయులు
  rationale: మునుపటి వచనాల్లో లెక్కించబడిన ఇతర గోత్రాలతో లేవీయులను వ్యత్యాసపరుస్తున్న సందర్భం వల్ల וְ అనే సంధిని ‘అయితే’ అని అనువదించాం; לְוִיִּםకు ప్రామాణిక తెలుగు రూపం ‘లేవీయులు’.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: తమ పితరుల గోత్రం ప్రకారం
  rationale: మַטֶּה జనగణన సందర్భంలో ‘గోత్రం’ అని అర్థం; אֲבֹתָם అక్షరార్థంగా ‘వారి పితరులు’. మూలంలోని పితృవంశ సూచనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలిపాం.
- source_word: לֹא הָתְפָּקְדוּ
  choice: లెక్కించబడలేదు
  rationale: פקד హిత్పయేల్ రూపం ఇక్కడ అధికారిక జనగణనలో నమోదు చేయడం లేదా సంఖ్యలో చేర్చడాన్ని సూచిస్తుంది. ‘లెక్కించబడలేదు’ అధ్యాయ సందర్భంలో స్పష్టంగా ఉంది.
- source_word: בְּתוֹכָם
  choice: వారిలో
  rationale: בְּתוֹךְ ఇక్కడ ఇతర గోత్రాల లెక్కలో భాగంగా చేర్చబడటాన్ని సూచిస్తుంది; ‘వారిలో’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పితృవంశ నిర్మాణాన్ని ‘తమ పితరుల గోత్రం ప్రకారం’ అని నేరుగా నిలిపి, జనగణన సందర్భంలోని פקד పదానికి ప్రధాన పాఠ్యంలో సులభమైన ‘లెక్కించబడలేదు’ను ఎంచుకున్నాం.
