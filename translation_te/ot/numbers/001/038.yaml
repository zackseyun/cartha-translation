  source_fidelity: The draft generally preserves the census formula, the distinct kinship levels, the age threshold, and the explicitly male military context. However, “దాను కుమారులలో” shifts the heading-like לְ phrase toward a partitive sense (“among”), and the footnote introduces “with the army,” which is not stated by the Hebrew idiom.
