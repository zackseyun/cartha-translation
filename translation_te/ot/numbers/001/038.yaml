  terminology: “వంశావళులు,” “వంశాలు,” and “పితరుల కుటుంబాలు” suitably distinguish תּוֹלְדֹת, מִשְׁפָּחוֹת, and בֵּית אָבוֹת. “ప్రతి పురుషుడు” correctly maintains the male referent of the military census.
  issues:
  - severity: medium
    issue: Opening phrase “దాను కుమారులలో”
    rationale: The prefixed לְ introduces Dan as the tribal heading in the census formula; “లో” naturally means “among/in,” rather than “concerning/for the sons of Dan.”
  - severity: low
