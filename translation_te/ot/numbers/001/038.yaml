  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: te
  text: దాను కుమారుల విషయమై, వారి వంశావళుల ప్రకారం, వారి వంశాల ప్రకారం, వారి పితరుల కుటుంబాల ప్రకారం, పేర్ల లెక్క ప్రకారం, ఇరవై సంవత్సరాల వయసు నుండి అంతకంటే పైబడిన యుద్ధానికి వెళ్లగల ప్రతి పురుషుడు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైనిక సేవకు తగిన ప్రతి పురుషుడు.” హీబ్రూ నుడికారం అక్షరార్థంగా “యుద్ధానికి బయలుదేరడం” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: దాను కుమారులలో
  rationale: లְ ఇక్కడ జనగణనలో తెగను పరిచయం చేస్తుంది. మూలంలోని పురుషలింగ సూచనను, సైనిక సేవకు అర్హులైన పురుషుల సందర్భాన్ని ‘కుమారులు’ నిలుపుతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: ఈ జనగణన సందర్భంలో ఈ పదం కేవలం తరాలను కాక వంశపారంపర్య నమోదును సూచిస్తుంది; ‘వంశావళులు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ఇశ్రాయేలు తెగల నిర్మాణంలోని ఉపవిభాగాలను సూచించడానికి ‘వంశాలు’ సరిపోతుంది; తరువాతి ‘పితృ కుటుంబాలు’ అనే విభాగం నుంచి దీనిని వేరుచేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృ కుటుంబాల ప్రకారం
  rationale: ఇది తండ్రి వంశం ఆధారంగా ఏర్పడిన కుటుంబ గృహాన్ని సూచించే సాంకేతిక బంధుత్వ పదబంధం. ‘పితృ కుటుంబాలు’ ఆధునిక తెలుగులో అర్థవంతంగా ఉండి ఆ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల లెక్కన
  rationale: వ్యక్తులను పేరుపేరునా లెక్కించడాన్ని సూచించే హీబ్రూ పదబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని ఆ పైబడినవారిలో
  rationale: జనగణనకు వర్తించే కనిష్ఠ వయోపరిమితిని స్పష్టంగా తెలుపుతూ హీబ్రూ సూత్రబద్ధమైన మాటతీరును నిలుపుతుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: యుద్ధానికి బయలుదేరగల ప్రతి పురుషుడు
  rationale: ఈ హీబ్రూ నుడికారం సైనిక సేవకు వెళ్లే అర్హతను సూచిస్తుంది. ‘యుద్ధానికి బయలుదేరు’ అనే మూల చిత్రాన్ని నిలుపుతూ, సందర్భంలోని పురుషులను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: సైనిక జనగణనలో పురుషలింగ సూచన
  choice: యుద్ధానికి బయలుదేరగల ప్రతి పురుషుడు
  alternative: సైనిక సేవకు తగిన ప్రతి ఒక్కరు
  rationale: హీబ్రూ రూపాలు పురుషలింగంలో ఉండటమే కాక, సందర్భం తెగలో సైనిక సేవకు అర్హులైన పురుషుల జనగణనను వివరిస్తోంది. కాబట్టి లింగ సూచనను తటస్థీకరించకుండా నిలుపుతూ, సైనిక అర్హత అనే సందర్భార్థాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జనగణన శైలిని పాటించాం. ఒకే అర్థక్షేత్రంలోని תּוֹלְדֹת, מִשְׁפָּחָה, בֵּית אָבוֹת పదాలను వరుసగా ‘వంశావళులు’, ‘వంశాలు’, ‘పితృ కుటుంబాలు’గా వేరు చేశాం. వాక్యం తరువాతి వచనంలోని సంఖ్యతో కొనసాగే జాబితా నిర్మాణం కావడంతో చివర దీర్ఘ విరామ చిహ్నం ఉంచాం.
