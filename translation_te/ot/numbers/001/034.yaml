  terminology: ‘మనష్షే,’ ‘పితృకుటుంబాలు,’ మరియు ‘సైన్యసేవ’ స్థిరమైన, అర్థవంతమైన పదాలు. ‘పితృగృహాలు’ కంటే ‘పితృకుటుంబాలు’ ఇక్కడ ఉద్దేశించిన సామాజిక-వంశ విభాగాన్ని ఆధునిక పాఠకునికి మరింత సహజంగా తెలియజేస్తుంది.
