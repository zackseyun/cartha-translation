  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: te
  text: 'మనష్షే కుమారులలో, వారి తరాల ప్రకారం, వారి వంశాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్య ప్రకారం, ఇరవై సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే పైబడిన, సైన్యసేవకు బయలుదేరే ప్రతి పురుషుడు[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు.” హెబ్రీయ పదబంధం సైనిక విధికి వెళ్లేవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారులలో
  rationale: లְ ఉపసర్గ ఈ జనగణన సూత్రంలో గోత్రశీర్షికను పరిచయం చేస్తుంది; సందర్భంలోని లెక్కింపు భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘కుమారులలో’ అని ఇచ్చాం.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: ఇక్కడ పదం తరాల క్రమంలో నమోదైన వంశోత్పత్తిని సూచిస్తుంది; ‘వంశావళులు’ ఆ జనగణన సంబంధమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మִשְׁפָּחָה ఇక్కడ గోత్రంలోని బంధుత్వ విభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకునికి ‘వంశాలు’ సహజంగా అర్థమవుతుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: ఇశ్రాయేలు సమాజంలోని తండ్రి వంశాధారిత కుటుంబ విభాగాన్ని మూలానికి దగ్గరగా ఉంచే స్థిరమైన పదబంధం.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: వ్యక్తులను పేరుపేరునా సంఖ్యలో చేర్చడాన్ని సూచించే జనగణన భాషను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై సంవత్సరాలు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్నవారిలో
  rationale: సైనిక జనగణనకు వర్తించే కనిష్ఠ వయోపరిమితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: సైనిక సేవకు వెళ్లగల ప్రతి పురుషుణ్ణి
  rationale: צָבָא ఇక్కడ వ్యవస్థీకృత సైనిక విధిని సూచిస్తుంది. సందర్భం ఇరవై ఏళ్లు పైబడిన పురుషుల సైనిక జనగణన కావడంతో లింగసూచనను నిలిపి, అర్హత భావాన్ని ‘వెళ్లగల’ ద్వారా తెలిపాం.
theological_decisions:
- issue: జనగణన భాషలో లింగసూచన
  choice: ప్రతి పురుషుణ్ణి
  alternative: ప్రతి ఒక్కరిని
  rationale: ఈ సందర్భం సైనిక సేవకు అర్హులైన ఇరవై ఏళ్లు పైబడిన ఇశ్రాయేలీయ పురుషుల జనగణన. అందువల్ల మూలంలోని సందర్భానుగుణ పురుష సూచనను లింగతటస్థంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వాక్యం పరిసర వచనాల నుంచి కొనసాగుతున్న ఎలిప్టికల్ జనగణన సూత్రం; తెలుగులో సంపూర్ణత కోసం ‘లెక్కించారు’ అనే క్రియను సందర్భానుసారంగా పూరించాం.
