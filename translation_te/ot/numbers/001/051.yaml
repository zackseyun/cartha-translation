- from: నివాస గుడారం ప్రయాణానికి బయలుదేరేటప్పుడు లేవీయులు దాన్ని విప్పాలి; అది శిబిరంలో నిలిచేటప్పుడు లేవీయులు దాన్ని నిలబెట్టాలి. అనధికార వ్యక్తి[a] ఎవరైనా దాని దగ్గరకు వస్తే, అతనికి మరణశిక్ష విధించాలి.
