id: NUM.1.51
reference: Numbers 1:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: te
  text: నివాస గుడారం బయలుదేరవలసినప్పుడు లేవీయులు దాన్ని విప్పాలి; నివాస గుడారం శిబిరం వేయడానికి ఆగినప్పుడు లేవీయులు దాన్ని ఏర్పాటు చేయాలి. దాని దగ్గరకు వచ్చిన అనధికార వ్యక్తి[a]కి మరణశిక్ష విధించబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బయటి వ్యక్తి”; హీబ్రూ పదం ఇక్కడ పవిత్ర నివాస గుడారాన్ని సమీపించడానికి అధికారం లేని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: ప్రయాణానికి బయలుదేరేటప్పుడు
  rationale: ב + infinitive construct కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. נסע లోని ప్రయాణం ప్రారంభించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: מִשְׁכָּן అనేది ఇశ్రాయేలీయుల మధ్య ఉన్న పవిత్రమైన, తరలించగల నివాస స్థలాన్ని సూచిస్తుంది. ‘నివాస గుడారం’ మూలపదంలోని నివాస భావాన్నీ గుడారపు నిర్మాణాన్నీ తెలియజేస్తుంది.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: దాన్ని విప్పాలి
  rationale: ఈ సందర్భంలో ירד యొక్క హిఫీల్ రూపం ప్రయాణం కోసం గుడారాన్ని కిందికి దించి విడదీయడాన్ని సూచిస్తుంది. ‘విప్పాలి’ ఆ ఆచరణను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన, పవిత్ర గుడారం సేవకు నియమించబడినవారికి ప్రామాణిక తెలుగు రూపం.
- source_word: וּבַחֲנֹת
  choice: శిబిరంలో నిలిచేటప్పుడు
  rationale: חנה అంటే శిబిరం వేయడం లేదా విడిది చేయడం. గుడారం శిబిరంతో కలిసి ఒక చోట నిలిచే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָקִימוּ אֹתוֹ
  choice: దాన్ని నిలబెట్టాలి
  rationale: קום యొక్క హిఫీల్ రూపం ఇక్కడ గుడారాన్ని పైకెత్తి ఏర్పాటు చేయడాన్ని సూచిస్తుంది. ‘నిలబెట్టాలి’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: וְהַזָּר
  choice: అనధికార వ్యక్తి
  rationale: זָר ఇక్కడ జాతిపరమైన విదేశీయుడిని తప్పనిసరిగా సూచించదు; పవిత్రస్థల సేవకు అధికారం లేని వ్యక్తిని సూచిస్తుంది. ఈ ఎంపిక ఆ సేవాపరమైన పరిమితిని స్పష్టంగా ఉంచుతుంది.
- source_word: הַקָּרֵב
  choice: దాని దగ్గరకు వస్తే
  rationale: קרב సమీపించడాన్ని సూచిస్తుంది. సందర్భంలో సమీపించేది పవిత్ర నివాస గుడారమని సహజంగా స్పష్టం చేయబడింది.
- source_word: יוּמָת
  choice: అతనికి మరణశిక్ష విధించాలి
  rationale: מות యొక్క హోఫాల్ రూపం కేవలం చనిపోవడాన్ని కాక, మరణానికి గురిచేయబడడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం శిక్షాత్మక భావాన్ని తెలియజేస్తుంది; దాన్ని అమలు చేసే నిర్దిష్ట వ్యక్తిని పేర్కొనదు.
theological_decisions:
- issue: יוּמָת లోని శిక్ష స్వభావం
  choice: విధించబడే మరణశిక్ష
  alternative: అతడు చనిపోతాడు
  rationale: హోఫాల్ రూపం మరణం కేవలం పరిణామంగా సంభవిస్తుందని కాక, అది విధించబడుతుందని సూచిస్తుంది. అయితే మానవుడా దేవుడా ఎవరు అమలు చేస్తారో వాక్యం స్పష్టం చేయనందున అనువాదం కూడా ఆ విషయాన్ని నిర్ణయించదు.
- issue: זָר ఎవరిని సూచిస్తుంది
  choice: పవిత్రస్థల సేవకు అధికారం లేని వ్యక్తి
  alternative: జాతిపరమైన విదేశీయుడు లేదా ప్రతి లేవీయేతరుడు
  rationale: యాజకసేవ మరియు నివాస గుడారం సందర్భాల్లో זָר సాధారణంగా అధీకృత పవిత్ర బాధ్యతకు వెలుపల ఉన్నవారిని సూచిస్తుంది. అనువాదం జాతిపరమైన అర్థాన్ని రుద్దకుండా సేవాపరమైన నిషేధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నివాస గుడారం’ మూలంలోని నివాస భావాన్ని నిలుపుతుంది; ‘విప్పాలి/నిలబెట్టాలి’ తరలించగల గుడారం సందర్భానికి సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి.
