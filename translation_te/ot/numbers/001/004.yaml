language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִתְּ/כֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַ/מַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְ/בֵית אֲבֹתָ֖י/ו הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: te
  text: మీతోపాటు ప్రతి గోత్రం నుండి ఒక్కొక్క వ్యక్తి ఉండాలి; అతడు తన పితృకుటుంబానికి అధిపతి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: మీతోపాటు
  rationale: మోషే, అహరోనులకు తోడుగా ఉండవలసిన వారిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: יִהְיוּ
  choice: ఉండాలి
  rationale: సందర్భంలో భవిష్యత్ సూచనతో కూడిన ఆదేశ భావం ఉంది; తెలుగు విధ్యర్థక రూపం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ אִישׁ לַ/מַּטֶּה
  choice: ప్రతి గోత్రం నుండి ఒక్కొక్క పురుషుడు
  rationale: אִישׁ పద పునరుక్తి పంపిణీ భావాన్ని, అంటే ప్రతి గోత్రానికి ఒక ప్రతినిధిని, సూచిస్తుంది.
- source_word: לַ/מַּטֶּה
  choice: గోత్రం
  rationale: సంఖ్యాకాండపు జనగణన సందర్భంలో מַטֶּה అనేది కర్రను కాక ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: אִישׁ רֹאשׁ
  choice: అధిపతిగా
  rationale: ప్రతినిధి నాయకత్వ స్థానాన్ని తెలియజేస్తుంది; 'తల' అనే యథార్థ రూపకానికన్నా 'అధిపతి' తెలుగులో సహజంగా అర్థమవుతుంది.
- source_word: לְ/בֵית אֲבֹתָי/ו
  choice: తన పితృకుటుంబానికి
  rationale: పితృవంశాధారిత కుటుంబం లేదా వంశగృహం అనే సామాజిక నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא
  choice: అతడు
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామానికి ఉన్న పునరుద్ఘాటన భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
