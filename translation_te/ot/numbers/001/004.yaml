translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. పంపిణీ భావాన్ని 'ప్రతి... ఒక్కొక్క'తో స్పష్టంగా ఉంచి, పితృవంశ సామాజిక నేపథ్యాన్ని 'పితృకుటుంబం'తో నిలిపాం.
