translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జనగణన శైలిని ఉపయోగించాం. వరుసగా వచ్చే לְ ఉపసర్గల సూత్రబద్ధతను ‘ప్రకారం’తో నిలిపాం; అయితే తెలుగు సహజత్వం కోసం వాక్యాంతంలో సందర్భం సూచించే ‘లెక్కించారు’ను పూరించాం. ప్రధాన పాఠ్యంలోని ఏకైక పాదసూచిక గుర్తు [a] పాఠ్యంలో ఉంది.
