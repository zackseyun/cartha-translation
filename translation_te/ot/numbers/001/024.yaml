source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: te
  text: 'గాదు కుమారుల విషయమై: వారి తరతరాల ప్రకారం, వారి గోత్రకుటుంబాల ప్రకారం, వారి పితృగృహాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాలు పైబడిన సైనిక సేవకు వెళ్లే[a] వారందరూ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సైన్యానికి బయలుదేరే వారందరూ.” ఇది సైనిక సేవకు వెళ్లే పురుషుల జనగణన వర్గాన్ని సూచించే సూత్రబద్ధమైన పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: గాదు కుమారులలో
  rationale: ל ఉపసర్గ ఈ జనగణన సూత్రంలో లెక్కింపునకు చెందిన గోత్ర సభ్యులను పరిచయం చేస్తుంది. ‘కుమారులు’ అనే హెబ్రీయుల జాతీయ-వంశ సంబంధ నుడికారాన్ని నిలుపుతూ, ‘లో’ సందర్భానుసారంగా లెక్కింపులో ఎంపికను తెలుపుతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: ఈ సందర్భంలో పదం జననాలు అనే సాధారణ అర్థంకన్నా సంతతి క్రమం లేదా వంశ సంబంధ వర్గీకరణను సూచిస్తుంది; ‘వంశావళులు’ దానిని సహజంగా, అతిగా ‘లిఖిత పత్రాలు’గా నిర్ధారించకుండా వ్యక్తపరుస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచిస్తుంది. ఆధునిక అణుకుటుంబ భావాన్ని కలిగించగల ‘కుటుంబాలు’ కంటే ‘వంశాలు’ ఈ నిర్మాణానికి సరిపోతుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: హెబ్రీ పితృవంశీయ సామాజిక నిర్మాణాన్ని సూచించే సాంకేతిక బంధుత్వ పదబంధాన్ని ‘పితృగృహాలు’ సంక్షిప్తంగా, పారదర్శకంగా నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: వ్యక్తిగత పేర్ల ఆధారంగా జరిగిన నమోదు లేదా లెక్కింపును మూలానికి దగ్గరగా, సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయసుగలవారిలో
  rationale: హెబ్రీ ఏకవచన నుడికారం ‘ఇరవై ఏళ్ల కుమారుడు’ను యాంత్రికంగా అనువదించకుండా, జనగణనకు వర్తించే కనిష్ఠ వయోపరిమితిని స్పష్టంగా తెలుపుతుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: సైనిక సేవకు వెళ్లే ప్రతి ఒక్కరినీ
  rationale: יֹצֵא צָבָאను ‘యుద్ధానికి బయలుదేరు’ అని మాత్రమే పరిమితం చేయకుండా, సైన్యంలో సేవ చేయడానికి బయలుదేరే లేదా అర్హుడైన వ్యక్తి అనే సూత్రప్రాయ భావాన్ని నిలుపుతుంది. ‘సామర్థ్యమున్న’ అనే పదాన్ని మూలంలో ప్రత్యక్షంగా లేనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
