- from: గాదు కుమారులలో, వారి వంశావళుల ప్రకారం, వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయసుగలవారిలో సైనిక సేవకు వెళ్లే ప్రతి ఒక్కరినీ లెక్కించారు.[a]
  to: 'గాదు కుమారుల విషయమై: వారి తరతరాల ప్రకారం, వారి గోత్రకుటుంబాల ప్రకారం, వారి పితృగృహాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాలు పైబడిన సైనిక సేవకు వెళ్లే[a] వారందరూ:'
  rationale: The revision removes the unsupported completed action, retains the source’s open-ended census formula and colon, distinguishes kinship levels more clearly, and preserves the military idiom through an anchored literal footnote.
