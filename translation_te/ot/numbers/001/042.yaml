source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: te
  text: 'నఫ్తాలి కుమారులు[a]—వారి తరాల ప్రకారం, వారి గోత్రాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్య ప్రకారం, ఇరవై సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్న, యుద్ధానికి వెళ్లే ప్రతి పురుషుడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నఫ్తాలి సంతతివారు’ అని కూడా అనువదించవచ్చు. ఇక్కడ ‘కుమారులు’ అనేది నఫ్తాలి నుండి వచ్చిన పురుష గోత్రసభ్యులను సూచిస్తుంది. చివరి పదబంధాన్ని మరింత అక్షరార్థంగా ‘సైన్యానికి బయలుదేరే ప్రతి ఒక్కరు’ అని అనువదించవచ్చు; ఈ హీబ్రూ నుడికారం సైనిక సేవకు అర్హులైనవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: నఫ్తాలి కుమారులు
  rationale: ‘కుమారులు’ అనే పదం హీబ్రూ పదబంధంలోని పురుషలింగ, వంశావళి భావాన్ని నిలుపుతుంది; ఈ జనగణన సందర్భంలో నఫ్తాలి నుండి వచ్చిన పురుష గోత్రసభ్యులను సూచిస్తుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: కుటుంబ సంతతి లేదా వంశ విభాగాల ప్రకారం నమోదుచేయడాన్ని తెలియజేస్తుంది; పునరావృతమయ్యే జనగణన సూత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి గోత్రాల ప్రకారం
  rationale: ఈ గిరిజన-జనగణన సందర్భంలో מִשְׁפָּחָה ఆధునిక అణుకుటుంబం కంటే విస్తృతమైన వంశగుంపును సూచిస్తుంది; ‘గోత్రాలు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: తండ్రుల వైపు ఆధారపడ్డ ఇశ్రాయేలీయ కుటుంబ విభాగాలను సూచించే పదబంధం; ‘పితృకుటుంబాలు’ నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్య చొప్పున
  rationale: వ్యక్తులను పేరుపేరునా లెక్కించడాన్ని సూచించే అధికారిక జనగణన భాషను కాపాడుతుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయస్సు మొదలుకొని అంతకంటే పైబడినవారిలో
  rationale: వయోపరిమితిని తెలుగులో సహజంగా తెలుపుతూ, ‘ఇరవై సంవత్సరాల నుండి పైకి’ అనే మూల భావాన్ని నిలుపుతుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: యుద్ధానికి వెళ్లే ప్రతి పురుషుడు
  rationale: అక్షరార్థంగా ‘సైన్యానికి/యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు’; సందర్భంలో సైనిక సేవకు అర్హులైన పురుషులను సూచిస్తుంది. ప్రధాన పాఠం హీబ్రూ నుడికారానికి దగ్గరగా ఉంటుంది; సందర్భార్థం పాదటిప్పణిలో వివరించబడింది.
