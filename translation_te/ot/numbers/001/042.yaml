translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జనగణన శైలిని నిలుపుతూ, పునరావృత హీబ్రూ నిర్మాణాలకు సమాంతర పదబంధాలు వాడబడ్డాయి. ‘వంశాలు,’ ‘గోత్రాలు,’ ‘పితృకుటుంబాలు’ అనే పదాలు వరుసగా వేర్వేరు వంశ-సామాజిక స్థాయులను సూచించేలా ఎంపికయ్యాయి.
