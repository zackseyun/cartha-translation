  yaml_path: translation/ot/numbers/001/035.yaml
  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: te
  text: మనష్షే గోత్రానికి చెందిన లెక్కించబడినవారి సంఖ్య ముప్పై రెండు వేల రెండు వందలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד ధాతువు నుంచి వచ్చిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. సందర్భం వల్ల వీరు ముందటి వచనాల్లో నిర్దేశించిన యుద్ధయోగ్యులైన పురుషులని తెలుస్తుంది; అయితే ఈ వచనంలో లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా సహజంగా అనువదించాం.
- source_word: לְמַטֵּה
  choice: గోత్రంలో
  rationale: לְמַטֵּה అనే పదబంధం ఇక్కడ లెక్కించబడినవారి గోత్ర సంబంధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘గోత్రంలో’ అనేది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ పేరుకు సమీపంగా ఉండే, తెలుగు బైబిలు వాడుకలో గుర్తించదగిన లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: ముప్పై రెండు వేల రెండు వందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమంలోని ఖచ్చితమైన విలువ 32,200ను సహజమైన ఆధునిక తెలుగు సంఖ్యా క్రమంలో తెలిపాం; వ్యక్తుల సంఖ్య కావడంతో ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన సూత్రరూపాన్ని నిలిపాం. భాష సహజంగా, గౌరవప్రదంగా ఉండేలా చూసి, మూలంలో పరోక్షంగా ఉన్న సమాచారాన్ని అనవసరంగా విస్తరించలేదు.
