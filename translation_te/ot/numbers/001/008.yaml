base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/008.yaml
  text: 'For Issachar: Nethanel son of Zuar.'
translation:
  language: te
  text: ఇశ్శాఖారు గోత్రం తరఫున, సూయారు కుమారుడు నెతనేలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: ఇశ్శాఖారు గోత్రం తరఫున
  rationale: ఈ జనగణన నాయకుల జాబితాలో לְ అనుబంధాన్ని, ప్రతినిధిత్వాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘ఇశ్శాఖారుకు’ అనడం అసహజంగా లేదా వ్యక్తిని ఉద్దేశించినట్టు వినిపించవచ్చు; అందువల్ల అంతర్లీనంగా ఉన్న గోత్ర భావాన్ని స్పష్టంగా చేసి ‘గోత్రం తరఫున’ అని అనువదించాం.
- source_word: נְתַנְאֵל
  choice: నెతనేలు
  rationale: ఇది వ్యక్తి పేరు; అర్థానువాదం చేయకుండా తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశపరమైన ఈ గుర్తింపులో ప్రత్యక్ష కుమార సంబంధమే సహజమైన అర్థం; విస్తృతమైన ‘వంశస్థుడు’ అనే భావం సందర్భానికి అవసరం లేదు.
- source_word: צוּעָר
  choice: సూయారు
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను సమీపించేలా, తెలుగు పాఠకులకు పలకడానికి సహజంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా-శైలిని నిలిపి, సాధారణ పాఠకుడికి గోత్ర ప్రతినిధిత్వ సంబంధం స్పష్టంగా ఉండేలా రూపొందించాం. పేర్లను అనువదించకుండా లిప్యంతరీకరించాం.
