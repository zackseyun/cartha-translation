  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: te
  text: లేవీ గోత్రాన్ని మాత్రం లెక్కించవద్దు; ఇశ్రాయేలు కుమారులలో వారి సంఖ్యను లెక్కలో చేర్చవద్దు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది ఇక్కడ ఇశ్రాయేలీయులందరినీ సూచించే హీబ్రూ ప్రయోగం; ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతతి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే... మాత్రం
  rationale: ముందటి జనగణన ఆదేశం నుంచి లేవీ గోత్రాన్ని మినహాయిస్తున్న నిరోధక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מַטֵּה לֵוִי
  choice: లేవీ గోత్రం
  rationale: జనగణన సందర్భంలో מַטֶּה అనే పదం ‘కర్ర’ అని కాక, ‘గోత్రం’ అని అర్థమిస్తుంది.
- source_word: תִפְקֹד
  choice: లెక్కించు
  rationale: פקד ఇక్కడ జనగణనలో లెక్కించడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘లెక్కించు’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: వారి సంఖ్యను నమోదు చేయు
  rationale: అక్షరార్థంగా ‘వారి తలను ఎత్తు’ అనే నిర్మాణం జనగణనలో మొత్తం సంఖ్యను నమోదు చేసే హీబ్రూ నుడికారం; తెలుగులో భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּתוֹךְ
  choice: మధ్య
  rationale: పెద్ద సమూహంలో చేర్చి లెక్కించడాన్ని సూచించే సందర్భానుకూల సమానార్థకం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్ని, దాని సాంప్రదాయ జాతీయ designation‌ను పారదర్శకంగా నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధన-సమాజ నామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించే స్థిర నామమనే విషయాన్ని పాదటీకలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన ఆజ్ఞారూప శైలిని వాడాం. ‘లెక్కించవద్దు’ మరియు ‘సంఖ్యను నమోదు చేయవద్దు’ అనే సమాంతర పదబంధాలు మూలంలోని రెండు వేర్వేరు జనగణన క్రియలను స్పష్టంగా ప్రతిబింబిస్తాయి.
