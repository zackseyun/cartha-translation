  source_fidelity: 'హీబ్రూ జాబితా-సూత్రాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: దాను గోత్రానికి సంబంధించిన ప్రతినిధిగా అహీయెజెరును, అతడు అమ్మీషద్దయి కుమారుడని పేర్కొంటుంది. తెలుగు పదక్రమంలో తండ్రి పేరు ముందుగా వచ్చినా, “అమ్మీషద్దయి కుమారుడు అహీయెజెరు” అనే నిర్మాణం అహీయెజెరే అమ్మీషద్దయి కుమారుడని స్పష్టంగా తెలియజేస్తుంది.'
