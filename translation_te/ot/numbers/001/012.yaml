  yaml_path: translation/ot/numbers/001/012.yaml
  text: 'For Dan: Ahiezer son of Ammishaddai.'
translation:
  language: te
  text: 'దాను గోత్రం తరఫున: అమ్మీషద్దయి కుమారుడు అహీయెజెరు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/דָן
  choice: దాను గోత్రం తరఫున
  rationale: లְ ఉపసర్గ ఇక్కడ జనగణన నాయకుల జాబితాలో సంబంధిత గోత్ర ప్రతినిధిని పరిచయం చేస్తుంది. కేవలం ‘దానుకు’ అనడం తెలుగులో అసహజంగా ఉండవచ్చు; ‘దాను గోత్రం తరఫున’ అనే రూపం ప్రతినిధిత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲחִיעֶזֶר
  choice: అహీయెజెరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ పదం; ఈ గుర్తింపు సూత్రంలో ‘కుమారుడు’ సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: עַמִּישַׁדָּי
  choice: అమ్మీషద్దయి
  rationale: వ్యక్తినామాన్ని అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన జాబితా శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా రూపొందించబడింది. పేర్లలో హీబ్రూ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణ వాడబడింది.
