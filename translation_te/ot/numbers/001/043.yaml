  yaml_path: translation/ot/numbers/001/043.yaml
  text: those counted from the tribe of Naphtali were fifty-three thousand four hundred.
translation:
  language: te
  text: నఫ్తాలి గోత్రానికి చెందిన లెక్కించబడినవారు యాభై మూడు వేల నాలుగు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד అనే ధాతువు ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. తెలుగు వాక్యంలో ఈ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמַטֵּה
  choice: గోత్రంలో
  rationale: ఈ జనగణన సూత్రంలో לְמַטֵּה గోత్ర సంబంధాన్ని సూచిస్తుంది. ‘గోత్రంలో’ అనేది లెక్కించబడినవారు ఆ గోత్రానికి చెందినవారని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తి/గోత్ర నామాన్ని అనువదించకుండా ఆధునిక ప్రామాణిక తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף
  choice: యాభై మూడు వేల
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ఆధునిక తెలుగులో సహజమైన సంఖ్యా క్రమంలో ఇచ్చాం.
- source_word: וְאַרְבַּע מֵאוֹת
  choice: నాలుగు వందల
  rationale: మొత్తం సంఖ్యలోని చివరి భాగాన్ని సహజమైన తెలుగు సంఖ్యా రూపంలో అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జనగణన వాక్య నిర్మాణం. సంఖ్యకు వ్యక్తుల సూచన స్పష్టమయ్యేలా ‘మంది’ చేర్చబడింది; ఇది హీబ్రూ సందర్భంలో అంతర్భూతమైన మానవ గణనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
