  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు తమ తమ శిబిరాల వద్ద, తమ తమ పతాకాల వద్ద, తమ దళాల ప్రకారం శిబిరం వేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు తమ తమ శిబిరాల వద్దను తమ తమ ధ్వజాల వద్దను, తమ తమ విభాగాల ప్రకారం శిబిరం వేయాలి.”
    reason: בְּנֵי יִשְׂרָאֵל, עַל, דֶּגֶל, మరియు צָבָא పదాలకు సందర్భానుకూలమైన ప్రత్యామ్నాయ పదప్రయోగాలను సూచించడానికి.
lexical_decisions:
- source_word: וְחָנוּ
  choice: దిగాలి
  rationale: ఈ నియమాత్మక సందర్భంలో సంయుక్త క్రియారూపం భవిష్యత్తు కంటే ఆదేశాత్మక భావాన్ని ఇస్తుంది. శిబిరం వేయడాన్ని తెలుగులో సహజంగా ‘దిగాలి’ అని చెప్పవచ్చు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని పారదర్శకంగా, పురుషవాచకంగా నిలుపుతుంది.
- source_word: אִישׁ ... וְאִישׁ
  choice: తమ తమ ... తమ తమ
  rationale: హీబ్రూ పునరుక్తి కలిగిన పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘తమ తమ’ అనే జంట ప్రయోగం వ్యక్తం చేస్తుంది; ప్రతి పురుషుని విడిగా ఉద్దేశించిన భావం సందర్భంలో నిలుస్తుంది.
- source_word: עַל מַחֲנֵהוּ
  choice: తమ తమ శిబిరం దగ్గర
  rationale: עַל ఇక్కడ ఖచ్చితమైన ఉపరితల స్థానాన్ని కాక, స్థానం లేదా అనుబంధాన్ని సూచిస్తుంది. ‘దగ్గర’ ఆ అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: דִּגְלוֹ
  choice: తమ తమ పతాకం
  rationale: דֶּגֶל గోత్ర లేదా సైనిక సమూహాన్ని గుర్తించే పతాకాన్ని సూచిస్తుంది. ‘పతాకం’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: לְצִבְאֹתָם
  choice: తమ దళాల ప్రకారం
  rationale: צָבָא లోని క్రమబద్ధమైన సైనిక సమూహ భావాన్ని ‘దళాలు’ స్పష్టంగా అందిస్తుంది; ఇక్కడ యుద్ధంలో నిమగ్నమైన సైన్యాలు అని అతిగా సూచించదు.
