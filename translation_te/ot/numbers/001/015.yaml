translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపాం. మూలంలోని క్రమాన్ని అనుసరించి గోత్రాన్ని ముందుగా, ఆపై తండ్రి-కుమారుల పేర్లను ఇచ్చాం.
