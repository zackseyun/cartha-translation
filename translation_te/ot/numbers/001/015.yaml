  language: te
  text: 'నఫ్తాలి గోత్రానికి: అహీరా, ఏనాను కుమారుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְנַפְתָּלִי
  choice: నఫ్తాలి గోత్రానికి
  rationale: לְ ఉపసర్గం ఈ జనగణన నాయకుల జాబితాలో గోత్ర సంబంధాన్ని, ప్రతినిధిత్వాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘నఫ్తాలికి’ కంటే ‘నఫ్తాలి గోత్రానికి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֲחִירַע
  choice: అహీర
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశ సంబంధాన్ని తెలిపే సాధారణ హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: עֵינָן
  choice: ఏనాను
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించి, ‘కుమారుడు’తో సహజంగా అనుసంధానించేందుకు తెలుగు విభక్తి రూపం వాడాం.
