    rationale: כֹּל יֹצֵא צָבָא is the standard military-service/warfare formula. “యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు” is idiomatic Telugu and retains the participial ambiguity without adding an ability-to-serve interpretation.
  revised_text: 'ఇశ్రాయేలు జ్యేష్ఠ కుమారుడైన రూబేను కుమారులు—వారి వంశావళుల ప్రకారం, వారి వంశశాఖల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, తలవారీగా[a]—ఇరవై సంవత్సరాల వయసు నుండి పైబడిన, యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు:'
