id: NUM.1.20
reference: Numbers 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: te
  text: 'ఇశ్రాయేలు జ్యేష్ఠ కుమారుడైన రూబేను కుమారులు—వారి వంశావళుల ప్రకారం, వారి వంశశాఖల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, తలవారీగా[a]—ఇరవై సంవత్సరాల వయసు నుండి పైబడిన, యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారి కపాలాల ప్రకారం”; అంటే ఒక్కొక్క వ్యక్తిని విడివిడిగా లెక్కించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: నామవాచక గణన-శీర్షిక నిర్మాణంలో అంతర్భావం
  rationale: ఈ క్రియ తరువాతి వచనంలోని సంఖ్యతో పూర్తయ్యే జనగణన సూత్రాన్ని ప్రారంభిస్తుంది. తెలుగులో విడిగా ‘ఉన్నారు’ అని పెట్టడం ఈ వచనఖండాన్ని అసహజం చేస్తుంది; అందువల్ల భావాన్ని జాబితా నిర్మాణంలో అంతర్భావం చేశాం.
- source_word: בְנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: గోత్ర, వంశ సందర్భంలో మూలంలోని ‘కుమారులు’ అనే బంధపదాన్ని పారదర్శకంగా నిలుపుతుంది; ఇక్కడ అది రూబేను సంతతివారిని సూచిస్తుంది.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు జ్యేష్ఠ కుమారుడు
  rationale: ‘జ్యేష్ఠ కుమారుడు’ మొదట పుట్టిన కుమారుడనే అర్థంతో పాటు కుటుంబస్థానాన్ని కూడా సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: జనగణన సందర్భంలో తరతరాల వంశక్రమాన్ని సూచిస్తుంది; లిఖితపూర్వక దస్తావేజులని అవసరం లేకుండా ఊహించదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశశాఖల ప్రకారం
  rationale: గోత్రంలోని ఉపవిభాగాలను సూచిస్తూ, తరువాత వచ్చే పితృకుటుంబాల నుండి భేదాన్ని నిలుపుతుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: మూలంలోని పితృసంబంధ గృహవ్యవస్థను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: పేరు పేరున వ్యక్తులను లెక్కించిన విధానాన్ని మూలానికి దగ్గరగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְגֻלְגְּלֹתָם
  choice: తలవారీగా
  rationale: అక్షరార్థంలోని ‘కపాలాలు/తలలు’ అనే చిత్రాన్ని తెలుగు లెక్కింపు నుడికారంలో నిలుపుతూ, ఒక్కొక్క వ్యక్తిని విడిగా లెక్కించారనే భావాన్ని ఇస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి పురుషుడు
  rationale: వయోపరిమితి తరువాత వస్తున్నందున, ఈ సందర్భంలో పురుష లింగానికి చెందిన ప్రతి వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసుగల
  rationale: సైనిక జనగణనకు సంబంధించిన కనిష్ఠ వయోపరిమితిని స్పష్టంగా, మూల సూత్రానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: సైన్యానికి బయలుదేరే ప్రతి ఒక్కరూ
  rationale: అక్షరార్థంగా ‘సైన్యానికి బయలుదేరే ప్రతి ఒక్కరు.’ కేవలం సామర్థ్యాన్ని మాత్రమే జోడించకుండా, మూలంలోని క్రియాశీల పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: כֹּל יֹצֵא צָבָא అనే పదబంధం సైనిక అర్హతనా, వాస్తవంగా యుద్ధానికి బయలుదేరడమా
  choice: సైన్యానికి బయలుదేరే ప్రతి ఒక్కరూ
  alternative: సైనిక సేవకు అర్హులైన ప్రతి ఒక్కరూ
  rationale: జనగణన సందర్భం అర్హతను సూచించినా, మూలం అక్షరార్థంగా ‘బయలుదేరే’ అని చెబుతుంది. వ్యాఖ్యానాన్ని పాఠ్యంలో ఖరారు చేయకుండా ఆ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచాం. ఈ వచనం తరువాతి వచనంలోని మొత్తం సంఖ్యతో పూర్తయ్యే వాక్యఖండం కావడంతో చివర ద్విబిందువు ఉంచాం. ‘వంశావళులు—వంశశాఖలు—పితృకుటుంబాలు’ అనే క్రమం మూలంలోని జనగణన స్థాయులను వేరు చేస్తుంది.
