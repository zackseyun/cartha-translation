  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణనకు తగిన సంక్షిప్త, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని గోత్ర సంబంధం, లెక్కింపు భావం, ఖచ్చిత సంఖ్య నిలుపబడ్డాయి.
