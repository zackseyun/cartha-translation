translation:
  language: te
  text: షిమ్యోను గోత్రానికి చెందిన వారిలో లెక్కించబడినవారు 59,300 మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד ధాతువు ఈ జనగణన సందర్భంలో లెక్కలో నమోదు చేయబడినవారిని సూచిస్తుంది. ప్రత్యయాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ‘వారిలో’ అని ప్రతిబింబించాం; విస్తృత సందర్భం పురుషులను సూచించినా, ఈ పదబంధంలో లేని ‘పురుషులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: לְמַטֵּה
  choice: గోత్రానికి చెందిన
  rationale: לְמַטֵּה ఇక్కడ గోత్ర సంబంధాన్ని సూచిస్తుంది. ‘గోత్రానికి చెందిన’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి జనగణన సూత్రవాక్య భావాన్ని కాపాడుతుంది.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 59,300 మంది
  rationale: హీబ్రూ సంఖ్యాక్రమంలోని ఖచ్చితమైన మొత్తాన్ని ఆధునిక తెలుగు సంఖ్యా రూపంలో ఇచ్చాం. వ్యక్తుల సంఖ్య అని స్పష్టపరచడానికి సహజమైన ‘మంది’ వాడాం.
