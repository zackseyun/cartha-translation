  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: te
  text: ఇరవై సంవత్సరాల వయసు నుండీ అంతకంటే పైబడిన, ఇశ్రాయేలులో యుద్ధానికి బయలుదేరే ప్రతి పురుషుణ్ణి[a] నీవు అహరోనుతో కలిసి వారి సైనిక దళాల వారీగా[b] లెక్కించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలులో యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరిని.’ ఈ హీబ్రూ ప్రయోగం సైనిక సేవకు అర్హులైనవారిని సూచించే సైనిక నుడికారం; ఈ అధ్యాయ సందర్భం వారు పురుషులని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి విభాగాల ప్రకారం’ లేదా ‘వారి సైనిక విభాగాల ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారిలో
  rationale: ఈ హీబ్రూ ప్రయోగం అర్హతకు కనిష్ఠ వయోపరిమితిని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘మొదలుకొని’ అని అనువదించబడింది.
- source_word: כָּל יֹצֵא צָבָא
  choice: యుద్ధానికి బయలుదేరే ప్రతి పురుషుణ్ణి
  rationale: ఇది సైనిక సేవకు అర్హులైనవారిని సూచించే సైనిక నుడికారం. ‘బయలుదేరే’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది; ఈ అధ్యాయ సందర్భం జనగణన పురుషులదని స్పష్టం చేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: జాతి సమాజం మధ్య ఉన్నవారిని సూచించే ప్రత్యక్షమైన, సహజమైన తెలుగు రూపం.
- source_word: תִּפְקְדוּ אֹתָם
  choice: లెక్కించాలి
  rationale: ఈ జనగణన సందర్భంలో פקד అనేది సేవ కోసం నమోదు చేయడం లేదా లెక్కించడం. ‘లెక్కించాలి’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి ఆజ్ఞ భావాన్ని తెలియజేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: వారి వారి సైనిక దళాల ప్రకారం
  rationale: వారిని సైనిక సేవకు సంబంధించిన వ్యవస్థీకృత విభాగాల వారీగా లెక్కించాలనే భావాన్ని తెలియజేస్తుంది. ‘వారి వారి’ పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַתָּה וְאַהֲרֹן
  choice: నీవు, అహరోను కలిసి
  rationale: లెక్కింపు బాధ్యత మోషేకు, అహరోనుకు అప్పగించబడిందని స్పష్టంగా తెలుపుతుంది; ‘కలిసి’ తెలుగు వాక్యనిర్మాణాన్ని సహజంగా చేస్తుంది.
theological_decisions:
- issue: సైనిక సేవకు అర్హతను తెలిపే లింగనిర్దిష్ట భాష
  choice: యుద్ధానికి బయలుదేరే ప్రతి పురుషుణ్ణి
  alternative: యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరిని
  rationale: హీబ్రూ రూపం పుంలింగంలో ఉంది; ఈ అధ్యాయంలో ఇరవై ఏళ్లు పైబడిన పురుషుల జనగణనే సందర్భం. అందువల్ల ‘పురుషుణ్ణి’ అనేది సందర్భానికి, మూలానికి నిబద్ధమైన అనువాదం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ సైనిక నుడికారంలోని ‘బయలుదేరే’ రూపం నిలుపబడింది; దాని సేవార్హత భావం పాదటిప్పణిలో వివరించబడింది. రెండు పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
