id: NUM.1.53
reference: Numbers 1:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: te
  text: కానీ లేవీయులు సాక్ష్యపు గుడారం చుట్టూ మకాం వేయాలి. అప్పుడు ఇశ్రాయేలు కుమారుల సమాజం మీద ఉగ్రత రాదు. లేవీయులు సాక్ష్యపు గుడారపు కాపలా బాధ్యతను నిర్వర్తించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: కానీ లేవీయులు
  rationale: సంయోజక అవ్యయం ముందున్న ఇతర గోత్రాల శిబిర ఏర్పాటుతో వ్యత్యాసాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కానీ’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יַחֲנוּ סָבִיב
  choice: చుట్టూ మకాం వేయాలి
  rationale: అసంపూర్ణ క్రియ ఇక్కడ ఆదేశాత్మక బాధ్యతను సూచిస్తుంది; ‘మకాం వేయాలి’ శిబిర ఏర్పాటు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: సాక్ష్యపు గుడారం
  rationale: מִשְׁכָּן పవిత్ర నివాస గుడారాన్ని, עֵדוּת అందులో ఉంచబడిన సాక్ష్యాన్ని సూచిస్తాయి. ‘సాక్ష్యపు గుడారం’ మూలంలోని సంబంధాన్ని వివరణాత్మకంగా సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: అప్పుడు ... ఉగ్రత రాదు
  rationale: ఈ వాక్యభాగం లేవీయుల శిబిర ఏర్పాటుకు సంబంధించిన నివారణాత్మక ఫలితాన్ని తెలుపుతుంది. ‘ఉగ్రత’ సాధారణ కోపం కంటే న్యాయతీర్పుతో కూడిన తీవ్రతను నిలుపుతుంది.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల సమాజం మీద
  rationale: עֵדָהకు ‘సమాజం’ సహజమైన సమూహార్థాన్ని ఇస్తుంది; בְּנֵי יִשְׂרָאֵלలోని పుత్రసంబంధ రూపాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలుపుతుంది.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: కాపలా బాధ్యతను నిర్వర్తించాలి
  rationale: שׁמר మరియు מִשְׁמֶרֶת కలయికలో పవిత్ర స్థలాన్ని కాపాడటమూ అప్పగించిన విధిని నిర్వర్తించటమూ ఉన్నాయి; ఈ పదబంధం రెండు భావాలను సహజ తెలుగులో కలుపుతుంది.
theological_decisions:
- issue: కֶצֶף స్వభావం
  choice: ‘ఉగ్రత’గా అనువదించి, సందర్భంలో దేవుని న్యాయతీర్పుతో కూడిన ఉగ్రతకు అవకాశం ఉంచడం
  alternative: కోపం
  rationale: పరిశుద్ధ గుడారపు హద్దుల సందర్భంలో ఇది కేవలం మానవ అసంతృప్తి కాదు; అయినా మూలంలో స్పష్టంగా లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా ‘ఉగ్రత’ అనే బరువైన పదాన్ని ఉపయోగించాం.
- issue: בְּנֵי יִשְׂרָאֵל రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పాఠ్యంలోని పుత్రసంబంధ, పుంలింగ బహువచన రూపాన్ని నిలుపుతూ దాని భావాన్ని సాధారణీకరించలేదు.
- issue: లేవీయుల מִשְׁמֶרֶת స్వభావం
  choice: కాపలా బాధ్యత
  alternative: సేవా బాధ్యత
  rationale: ఈ సందర్భంలో పవిత్ర గుడారానికి అనధికార సమీపాన్ని అడ్డుకునే రక్షణాత్మక విధి ప్రధానంగా ఉంది; ‘కాపలా బాధ్యత’ దానిని మతశాఖాపరమైన అదనపు భావాలు లేకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘సాక్ష్యపు గుడారం’ వంటి పంచగ్రంథ ఆరాధనా పదజాలాన్ని స్థిరంగా ఉంచి, అతిగా సంస్కృతీకరించిన భాషను నివారించాం.
