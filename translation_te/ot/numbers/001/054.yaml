  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు యాహ్వే మోషేకు ఆజ్ఞాపించినదంతా అనుసరించి చేశారు; అట్లే చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు పిల్లలు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: చేశారు
  rationale: עשה అనే విస్తృతార్థక క్రియకు సందర్భానుగుణమైన సహజ తెలుగు రూపం; విధేయతను సంగ్రహంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ అనే పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా అనుసరించి
  rationale: ఆజ్ఞ మొత్తానికి వారి కార్యం అనుగుణంగా ఉందనే సమగ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఇశ్రాయేలీయుల చర్యకు ముందుగా ఇవ్వబడిన దైవాజ్ఞను తెలుగు సంబంధ క్రియారూపం స్పష్టంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో దైవిక వ్యక్తినామాన్ని శీర్షికతో భర్తీ చేయకుండా ఉంచుతుంది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: צוה క్రియతో వ్యక్తిని సూచించేటప్పుడు తెలుగులో ‘మోషేకు ఆజ్ఞాపించాడు’ అనే చతుర్థీ విభక్తి సహజంగా ఉంటుంది.
- source_word: כֵּן עָשׂוּ
  choice: ఆయన ఆజ్ఞాపించినట్లే వారు చేశారు
  rationale: మూలంలోని పునరుక్త ముగింపును నిలుపుతూ, כֵּן సూచించే కచ్చితమైన అనుగుణతను తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క లింగ-నిర్దిష్ట రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూలో ఉన్న పుంలింగ బహువచన నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపాం; సమూహార్థక సహజ తెలుగు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ పునరుక్తిని పూర్తిగా తొలగించకుండా సహజ తెలుగులో నిలిపాం.
