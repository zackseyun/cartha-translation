  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: te
  text: 'యోసేపు కుమారుల కొరకు: ఎఫ్రాయిము కొరకు అమ్మీహూదు కుమారుడైన ఎలీషామా; మనష్షే కొరకు పెదాహ్సూరు కుమారుడైన గమలీయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: యోసేపు కుమారులలో
  rationale: בְנֵי అనే పదానికి అక్షరార్థంగా ‘కుమారులు’; ఇక్కడ అది యోసేపు నుండి వచ్చిన ఎఫ్రాయిము, మనష్షే శాఖలను సూచిస్తుంది. జాబితా నిర్మాణాన్ని సహజమైన తెలుగులో చూపడానికి לִ ను ‘లో’గా వ్యక్తం చేశాం.
- source_word: לְאֶפְרַיִם
  choice: ఎఫ్రాయిముకు
  rationale: לְ ఉపసర్గ ఈ జనగణన జాబితాలో సంబంధిత గోత్రశాఖను సూచిస్తుంది. సందర్భంలో గోత్రం స్పష్టంగా ఉన్నందున ‘ఎఫ్రాయిము గోత్రానికి’ అని విస్తరించలేదు.
- source_word: אֱלִישָׁמָע
  choice: ఎలీషామా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా రాశాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: עַמִּיהוּד
  choice: అమ్మీహూదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా రాశాం.
- source_word: לִמְנַשֶּׁה
  choice: మనష్షేకు
  rationale: ఎఫ్రాయిముతో సమాంతరంగా לְ ఉపసర్గ సూచించే గోత్రశాఖ సంబంధాన్ని సంక్షిప్తంగా నిలిపాం.
- source_word: גַּמְלִיאֵל
  choice: గమలీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా రాశాం.
- source_word: פְּדָהצוּר
  choice: పెదాహ్సూరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా రాశాం.
