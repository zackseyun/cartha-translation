  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: te
  text: యూదా గోత్రంలో లెక్కించబడినవారు డెబ్బై నాలుగు వేల ఆరువందల మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమోదు చేయబడినవారు.’ జనగణనకు సంబంధించిన ఈ హీబ్రూ పదాన్ని రెండు విధాలుగానూ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד ధాతువు నుంచి వచ్చిన ఈ రూపం జనగణన సందర్భంలో లెక్కలో చేర్చబడిన లేదా నమోదు చేయబడినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ సహజమైన తెలుగు ప్రయోగంగా జనగణన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְמַטֵּה
  choice: గోత్రంలో
  rationale: ఇక్కడ לְ ఉపసర్గ గోత్ర సంబంధాన్ని సూచిస్తుంది. ‘యూదా గోత్రంలో’ అనే ప్రయోగం ఆధునిక తెలుగులో సహజంగా ఉండి, లెక్కించబడినవారు ఆ గోత్రానికి చెందినవారని తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఈ గోత్రనామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: డెబ్బై నాలుగు వేల ఆరువందల మంది
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని దాని విలువ మార్చకుండా సహజమైన ఆధునిక తెలుగు సంఖ్యా శైలిలో ఇచ్చాం. వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చడం తెలుగులో సహజం.
