source:
  edition: WLC
  text: לִ/בְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: te
  text: ఆషేరు కుమారుల విషయమై, వారి తరతరాల ప్రకారం, వారి కుటుంబాల ప్రకారం, వారి పితరుల ఇళ్ల ప్రకారం, పేర్ల సంఖ్య ప్రకారం, ఇరవై సంవత్సరాల వయస్సు నుండి పైబడినవారిలో యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, ‘సైన్యానికి బయలుదేరే ప్రతి ఒక్కరు’; ఇది సైన్యసేవకు అర్హులైనవారిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: ఆషేరు కుమారులలో
  rationale: లְ ఈ జనగణన సూత్రంలో గోత్రానికి సంబంధించిన శీర్షికను పరిచయం చేస్తుంది. ‘కుమారులు’ అనే పదం మూలంలోని పుత్ర/గోత్ర భాషను నిలుపుతుంది; తెలుగు వాక్యనిర్మాణానికి ‘లో’ సహజంగా సరిపోతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: ఈ సందర్భంలో ఇది సంతతి క్రమాలను లేదా వంశ విభాగాలను సూచిస్తుంది. ‘వంశావళులు’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తూ, లిఖిత దస్తావేజులనే అనవసరంగా సూచించదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని బంధుత్వ విభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశాలు’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: ఇది ఇశ్రాయేలు సమాజంలోని ప్రామాణిక బంధుత్వ పదబంధం. ‘పితృగృహాలు’ మూలంలోని పితృవంశ సామాజిక నిర్మాణాన్ని కాపాడుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: వ్యక్తులను పేరుపేరునా లెక్కించడాన్ని ఈ పదబంధం సూచిస్తుంది. ఈ అనువాదం మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారిలో
  rationale: జనగణనకు వర్తించే కనిష్ఠ వయస్సును, దానికి పైబడిన వారందరినీ ఈ రూపం స్పష్టంగా సూచిస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: సైన్యసేవకు వెళ్లే ప్రతి పురుషుడు
  rationale: పదశః ‘సైన్యానికి/యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు.’ సందర్భం సైనిక సేవకు అర్హులైన పురుషుల జనగణన కావడంతో ‘ప్రతి పురుషుడు’ లింగసందర్భాన్ని స్పష్టం చేస్తుంది; ‘వెళ్లే’ మూలంలోని క్రియాత్మక నుడికారాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. అధ్యాయం అంతటా పునరావృతమయ్యే జనగణన సూత్రపు సమాంతర నిర్మాణాన్ని ‘ప్రకారం’ అనే పునరుక్తితో నిలిపి, వచనం తరువాతి లెక్కకు దారితీసే అసంపూర్ణ నిర్మాణం కావడంతో చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
