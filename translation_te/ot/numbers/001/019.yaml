  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే, అతడు సీనాయి అరణ్యంలో వారిని లెక్కించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని నమోదు చేశాడు,” లేదా “వారి జనగణన చేశాడు.” హీబ్రూ క్రియ ప్రజలను నమోదు చేయడం లేదా జనగణన చేయడం అనే భావాలను కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר ఇక్కడ ముందుగా ఇచ్చిన దైవాజ్ఞకు చర్య సరిగ్గా అనుగుణంగా జరిగిందని సూచిస్తుంది; తెలుగులో ‘...నట్లే’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఈ క్రియ ‘ఆజ్ఞాపించు’ అనే అర్థం ఇస్తుంది. తెలుగు ఉపవాక్య నిర్మాణంలో భూతకాల సంబంధ అసమాపక రూపం, లెక్కింపు కంటే ఆజ్ఞ ముందుగా వచ్చినదని సహజంగా చూపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన రూపంగా లిప్యంతరీకరించబడింది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూలో אֶת మోషేను ‘ఆజ్ఞాపించాడు’ అనే క్రియకు కర్మగా గుర్తిస్తుంది. తెలుగులో ‘మోషేకు ఆజ్ఞాపించాడు’ అనే దత్తివిభక్తి నిర్మాణం సహజమైనది.
- source_word: וַיִּפְקְדֵם
  choice: అతడు ... వారిని లెక్కించాడు
  rationale: ఈ జనగణన సందర్భంలో פקד ప్రజలను లెక్కించడం లేదా నమోదు చేయడం సూచిస్తుంది. ‘లెక్కించాడు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది; విస్తృత భావపరిధిని పాదసూచికలో నిలుపుకున్నాం.
- source_word: בְּמִדְבַּר סִינָי
  choice: సీనాయి అరణ్యంలో
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘సీనాయి అరణ్యం’ హీబ్రూ సంబంధాన్ని సహజమైన తెలుగు భౌగోళిక ప్రయోగంలో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ అనేది సంప్రదాయ మిశ్రిత ఉచ్చారణకు దగ్గరగా ఉంటుంది.
- issue: וַיִּפְקְדֵם లోని కర్త గుర్తింపు
  choice: అతడు (సందర్భంలో మోషే)
  alternative: మోషే
  rationale: హీబ్రూ క్రియలో కర్త మూడవ పురుష ఏకవచనంగా అంతర్నిహితంగా ఉంది; ఈ వాక్యంలో పేరును మళ్లీ చేర్చలేదు. అందువల్ల మూలంలోని సూచనాత్మక నిర్మాణాన్ని ‘అతడు’గా నిలిపి, సందర్భం మోషేను సూచించనిచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యాహ్వే’ వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది; ‘అతడు’ మూలంలోని అంతర్నిహిత కర్తను అనవసరంగా స్పష్టీకరించకుండా కాపాడుతుంది.
