    rationale: సంఖ్యాకాండము 1:30 తదుపరి వచనంలో వచ్చే లెక్కింపుకు ముందుమాటగా ఉన్న వాక్యభాగం. క్రియను ఇక్కడ చేర్చితే వచన సరిహద్దు మరియు మూల వాక్యనిర్మాణం మారతాయి.
