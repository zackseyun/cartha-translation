  to: 'జెబూలూను కుమారుల విషయమై, వారి వంశావళుల ప్రకారం, వారి కుటుంబాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాల వయస్సు నుండి అంతకంటే పైబడిన, యుద్ధానికి వెళ్లగల ప్రతి పురుషుడు[a]:'
  rationale: మూలంలో లేని క్రియను తొలగించి వచనం తదుపరి లెక్కింపు ప్రకటనతో కొనసాగుతుందని కోలన్ ద్వారా సూచించాము. గోత్ర-శీర్షికను సహజంగా మార్చి, వంశావళి, కుటుంబం, పితృకుటుంబం అనే వేర్వేరు జనగణన వర్గాలను తెలుగులో స్పష్టంగా వేరు చేశాము. సైనిక నుడికారానికి ప్రధాన పాఠ్యంలో సందర్భానుకూల అనువాదం, పాదటిప్పణిలో అక్షరార్థం ఇచ్చాము.
