source:
  edition: WLC
  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: te
  text: 'జెబూలూను కుమారుల విషయమై, వారి వంశావళుల ప్రకారం, వారి కుటుంబాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాల వయస్సు నుండి అంతకంటే పైబడిన, యుద్ధానికి వెళ్లగల ప్రతి పురుషుడు[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు”; సందర్భంలో, సైనిక సేవకు అర్హుడైన ప్రతి పురుషుడు.
    reason: హీబ్రూ సైనిక నుడికారపు అక్షరార్థాన్ని, సందర్భార్థాన్ని రెండింటినీ చూపించడానికి.
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: జెబూలూను కుమారులలో
  rationale: ల ఉపసర్గ ఇక్కడ జనగణనలో గోత్ర శీర్షికను పరిచయం చేస్తుంది. ‘కుమారులు’ మూలంలోని బంధుత్వ పదాన్ని నిలుపుతుంది; సందర్భంలో వారసులనూ సూచిస్తుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: జనగణన సందర్భంలో సంతతి లేదా వంశపరమైన నమోదు అనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: గోత్రంలోని విస్తృత బంధుత్వ విభాగాలను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: తండ్రుల ఇళ్లు అనే సాంకేతిక పితృవంశ బంధుత్వ భావాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: వ్యక్తులను పేరుపేరునా లెక్కించడం అనే మూలపదబంధాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్నవారిలో
  rationale: వయోపరిమితిని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: సైన్యసేవకు వెళ్లగల ప్రతి పురుషుణ్ణి
  rationale: యుద్ధానికి బయలుదేరడం అనే హీబ్రూ సైనిక నుడికారంలోని సేవా అర్హత భావాన్ని తెలుపుతూ, ఈ జనగణన పురుషులకు సంబంధించినదని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: సైనిక జనగణనలో లింగ సూచన
  choice: సైన్యసేవకు వెళ్లగల ప్రతి పురుషుణ్ణి
  alternative: యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరిని
  rationale: ఈ జనగణన సందర్భం సైనిక సేవకు అర్హులైన పురుషులను సూచిస్తుంది. లింగాన్ని తటస్థీకరించకుండా సందర్భార్థాన్ని నిలిపాము.
- issue: יֹצֵא צָבָא నుడికారపు భావం
  choice: సైన్యసేవకు వెళ్లగల
  alternative: యుద్ధానికి బయలుదేరే
  rationale: మూల నుడికారంలో అక్షరార్థంగా ‘సైన్యానికి/యుద్ధానికి బయలుదేరేవాడు’ ఉన్నప్పటికీ, సందర్భంలో సైనిక సేవకు అర్హత ప్రధాన భావం. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి మూల రూపాన్ని సంరక్షించాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పరిపాలనా-జనగణన శైలి. హీబ్రూ వాక్యంలోని పునరావృత ‘ప్రకారం’ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో వాక్యాన్ని సంపూర్ణం చేయడానికి సందర్భం సూచించే ‘లెక్కించారు’ అనే క్రియను జోడించాం.
