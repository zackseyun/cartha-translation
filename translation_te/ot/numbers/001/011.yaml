  source_fidelity: 'హీబ్రూ జాబితా-సూత్రాన్ని విశ్వసనీయంగా ప్రతిబింబిస్తుంది: బెన్యామీను కోసం/తరఫున అబీదాను, గిద్యోనీ కుమారుడు. వ్యక్తి పేర్లు సరైన క్రమంలో ఉన్నాయి; తెలుగులో సహజ నామసూత్రం కోసం తండ్రి పేరు ముందుకు రావడం అర్థాన్ని మార్చదు.'
