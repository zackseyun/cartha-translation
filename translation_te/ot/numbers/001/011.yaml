  yaml_path: translation/ot/numbers/001/011.yaml
  text: 'For Benjamin: Abidan son of Gideoni.'
translation:
  language: te
  text: బెన్యామీను తరఫున గిద్యోనీ కుమారుడు అబీదాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: బెన్యామీను తరఫున
  rationale: జాబితాలో గోత్రానికి ప్రాతినిధ్యం వహించే వ్యక్తిని לְ ఉపసర్గ పరిచయం చేస్తోంది. ‘తరఫున’ అనే ప్రయోగం మూలంలోని సంక్షిప్తతను కాపాడుతూ ఈ ప్రాతినిధ్య భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲבִידָן
  choice: అబీదాను
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: నామాల జాబితాలో తండ్రి-కొడుకు సంబంధాన్ని సూచించే హీబ్రూ నిర్మాణానికి సహజమైన, సంక్షిప్త తెలుగు రూపం.
- source_word: גִּדְעֹנִי
  choice: గిద్యోనీ
  rationale: ఇది వ్యక్తి పేరు కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని పాటించాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘గిద్యోనీ కుమారుడు అబీదాను’ అనే సహజ తెలుగు నామసూత్రాన్ని ఉపయోగించాం.
