revisions:
- from: మోషే, అహరోను లెక్కించినవారు[a] వీరే. ఇశ్రాయేలు నాయకులు—ఒక్కొక్క పితృవంశానికి[b] ఒక్కొక్కరు చొప్పున పన్నెండు మంది—వారితో ఉన్నారు.
  to: మోషే, అహరోను, ఇశ్రాయేలు నాయకులైన పన్నెండు మంది పురుషులు లెక్కించినవారు వీరే[a]. ఆ పన్నెండు మందిలో ప్రతి ఒక్కరు తన పితృకుటుంబానికి ఒక్కరు చొప్పున ఉన్నారు[b].
  rationale: The revision makes Moses, Aaron, and the twelve Israelite leaders the coordinated agents of the census, as in the Hebrew. It retains the personal sense of the passive participle, explicitly preserves the twelve men, and expresses the distributive representative role of one man for each ancestral household. The footnote terminology is adjusted to match the revised main-text term.
