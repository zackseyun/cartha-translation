source:
  edition: WLC
  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: te
  text: మోషే, అహరోను, ఇశ్రాయేలు నాయకులైన పన్నెండు మంది పురుషులు లెక్కించినవారు వీరే[a]. ఆ పన్నెండు మందిలో ప్రతి ఒక్కరు తన పితృకుటుంబానికి ఒక్కరు చొప్పున ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జనగణనలో నమోదైనవారు.” హీబ్రూ పదం లెక్కించబడిన వ్యక్తులనో, జనగణనలో వారి నమోదునో ప్రధానంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పితృకుటుంబం” అంటే ఇశ్రాయేలు గోత్ర వ్యవస్థలో పూర్వీకుల తండ్రివంశం ఆధారంగా గుర్తించబడిన కుటుంబ లేదా వంశ విభాగం.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: లెక్కించబడినవారు
  rationale: జనగణన సందర్భంలో ఈ నిష్క్రియ కృదంతం లెక్కింపబడిన వ్యక్తులను సూచిస్తుంది; అమూర్తమైన సంఖ్యా మొత్తాన్ని మాత్రమే కాదు.
- source_word: פָּקַד
  choice: లెక్కించారు
  rationale: సంఖ్యాకాండము 1 సందర్భంలో ఇది జనగణనలో నమోదు చేయడం లేదా లెక్కించడం; ఆధునిక తెలుగులో ‘లెక్కించారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులు
  rationale: ఇక్కడ పదం గోత్ర ప్రతినిధులైన నాయకులను సూచిస్తుంది; ‘రాజకుమారులు’ అనే రాజవంశ భావాన్ని అనవసరంగా కలిగించదు.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: పన్నెండు మంది
  rationale: హీబ్రూ పురుషులను సూచిస్తోంది; తెలుగు వ్యక్తి-లెక్కింపు రూపం సహజంగా ఉండేలా ‘మంది’ వాడబడింది.
- source_word: אִישׁ אֶחָד
  choice: ఒక్కొక్కరు
  rationale: ఒక్కో వర్గానికి ఒకరు అనే పంపిణీ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָיו
  choice: ఒక్కొక్క పితృవంశానికి
  rationale: ఇది ఇశ్రాయేలు గోత్ర వ్యవస్థలో తండ్రుల వంశం ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ విభాగాన్ని సూచిస్తుంది; ప్రతినిధిత్వ భావాన్ని ‘-కి’ నిలుపుతుంది.
- source_word: הָיוּ
  choice: వారితో ఉన్నారు
  rationale: పన్నెండు మంది నాయకులు మోషే, అహరోనులతో కలిసి జనగణనలో పాల్గొన్నారని వాక్యాన్ని సంపూర్ణంగా చేస్తూ బహువచన క్రియను స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: పన్నెండు మంది నాయకులకు సంబంధించిన הָיוּ క్రియ యొక్క వాక్య సంబంధం
  choice: ‘వారితో ఉన్నారు’ అని స్వతంత్ర ఉపవాక్యంగా అనువదించడం
  alternative: నాయకులను ‘లెక్కించారు’ అనే క్రియకు మోషే, అహరోనులతో కలిపి కర్తలుగా చూపించడం
  rationale: హీబ్రూ వాక్య నిర్మాణంలోని చివరి బహువచన הָיוּను ప్రత్యక్షంగా నిలుపుతూ, నాయకులు పన్నెండు మంది మరియు ప్రతి పితృవంశానికి ఒక్కొక్కరు అనే సమాచారాన్ని స్పష్టంగా ఉంచుతుంది; ఇది సిద్ధాంతపరమైన నిర్ణయం కాక వాక్యనిర్మాణ సంబంధమైన నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పితృవంశం’ అనే సాంస్కృతిక పదానికి పాదటిప్పణి ఇచ్చి, ప్రధాన వాక్యాన్ని సంక్షిప్తంగా ఉంచాం.
