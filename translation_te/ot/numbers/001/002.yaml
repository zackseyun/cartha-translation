id: NUM.1.2
reference: Numbers 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల సమాజమంతటినీ వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం, పేర్ల సంఖ్య ప్రకారం లెక్కించండి[a]—ప్రతి పురుషుణ్ణీ ఒక్కొక్కరిగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తలను ఎత్తండి”; ఇక్కడ జనగణన కోసం నమోదు చేసి లెక్కించడమనే అర్థం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి కపాలాల చొప్పున”; అంటే ప్రతి వ్యక్తినీ ఒక్కొక్కరిగా లెక్కించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: లెక్కించండి
  rationale: అక్షరార్థంగా ‘తలను ఎత్తండి’ అనే ఈ హెబ్రీయ నుడికారం, ఈ పరిపాలనా సందర్భంలో జనగణన కోసం నమోదు చేసి లెక్కించడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘లెక్కించండి’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כָּל עֲדַת
  choice: సమాజమంతటినీ
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు ప్రజల సమష్టిని సూచిస్తుంది. ‘సమాజమంతటినీ’ సాధారణ పాఠకులకు సహజంగా ఉండి, సమూహార్థాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని పుంలింగ వంశసంబంధ పదబంధాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలుపుతూ, దానిని సాధారణ జాతినామంగా మౌనంగా మార్చలేదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని బంధుత్వ విభాగాన్ని సూచిస్తుంది. తెలుగు బైబిలు సందర్భంలో ‘వంశాలు’ ఈ సామాజిక నిర్మాణాన్ని ‘కుటుంబాలు’ కంటే మెరుగ్గా తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: తండ్రి వంశపరంపర ఆధారంగా ఏర్పడిన గృహ సమూహాలను సూచించే మూల నిర్మాణాన్ని ‘పితృగృహాలు’ సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేరుపేరున
  rationale: నమోదైన పేరుల ఆధారంగా వ్యక్తులను లెక్కించే పరిపాలనా భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వ్యక్తిగత నమోదు అనే మూల బలాన్ని నిలుపుతుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాణ్ణీ
  rationale: זָכָר ప్రత్యేకంగా పురుష లింగాన్ని సూచిస్తుంది. ‘ప్రతి మగవాణ్ణీ’ ఆ నిర్దిష్టతను తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: לְגֻלְגְּלֹתָם
  choice: ఒక్కొక్కరినీ
  rationale: అక్షరార్థంగా ‘వారి కపాలాల చొప్పున’ అనే నుడికారం ప్రతి వ్యక్తినీ విడివిడిగా లెక్కించడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘ఒక్కొక్కరినీ’ వాడి, మూల రూపకాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. హెబ్రీయ పరిపాలనా నిర్మాణాన్ని కాపాడేందుకు ‘వంశాలు,’ ‘పితృగృహాలు’ ఉంచబడ్డాయి. మూల నుడికారాల అక్షరార్థాలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి; ప్రధాన వాక్యంలో పునరుక్తిని తెలుగులో స్పష్టత కోసం రెండు సమన్విత ఆజ్ఞలుగా అమర్చాం.
