translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా నిర్మాణాన్ని నిలుపుకుంటూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే సంక్షిప్తమైన శైలి. మూలంలోని విరామ భావాన్ని ద్విబిందువు, అర్ధవిరామంతో చూపించాం.
