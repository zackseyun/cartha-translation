  text: לְ/שִׁמְע֕וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/006.yaml
  text: 'for Simeon: Shelumiel son of Zurishaddai;'
translation:
  language: te
  text: 'షిమ్యోను గోత్రం తరఫున: సూరీషద్దయి కుమారుడు షెలుమీయేలు;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: షిమ్యోను గోత్రం తరఫున
  rationale: జనగణన నాయకుల జాబితాలో לְ ఉపసర్గ గోత్రానికి నియమిత ప్రతినిధిని సూచిస్తుంది. కేవలం ‘షిమ్యోనుకు’ అనడం తెలుగులో అస్పష్టంగా ఉండవచ్చు; ‘గోత్రం తరఫున’ మూలంలోని సంబంధాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: שְׁלֻמִיאֵל
  choice: షెలుమీయేలు
  rationale: వ్యక్తి పేరును అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ వంశపరిచయ సూత్రంలో בֶּן నేరుగా తండ్రి-కొడుకు సంబంధాన్ని సూచించే సాధారణ పదం; తెలుగులో ‘కుమారుడు’ సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: צוּרִישַׁדָּי
  choice: సూరీషద్దయి
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం; ఆరంభ צ ధ్వనిని తెలుగు బైబిలు నామ సంప్రదాయానికి అనుగుణంగా ‘స’తో చూపించాం.
