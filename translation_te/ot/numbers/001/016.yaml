translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘వీరే’ అనే రూపం హీబ్రూ వాక్యంలోని గుర్తింపు-ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది. అర్థాన్ని ఒకే సామాజిక లేదా సైనిక నిర్మాణానికి పరిమితం చేయకుండా ‘వేల విభాగాలు’ అని అనువదించి, వివరణను పాదటిప్పణిలో ఉంచాం.
