source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: te
  text: వీరే సమాజానికి చెందిన పిలువబడినవారు[a], తమ పితరుల గోత్రాల నాయకులు, ఇశ్రాయేలు సహస్రాల ప్రధానులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమాజపు పిలువబడినవారు.” హీబ్రూ కృదంతం పిలువబడినవారు, పిలిపింపబడినవారు, లేదా నియమితులు అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు సహస్రాలు” అక్షరార్థంగా వెయ్యిమంది చొప్పున ఉన్న సమూహాలను సూచించవచ్చు; లేదా ఇశ్రాయేలులోని వంశ లేదా సైనిక విభాగాలను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה ... הֵם
  choice: వీరే
  rationale: ఆరంభంలోని బహువచన సూచనార్థక సర్వనామాన్నీ, చివరలో గుర్తింపును నొక్కిచెప్పే స్వతంత్ర సర్వనామాన్నీ సహజమైన తెలుగు రూపంలో కలిపి వ్యక్తపరుస్తుంది.
- source_word: קריאי
  choice: పిలువబడినవారు
  rationale: קרא ధాతువు యొక్క కర్మణి కృదంత భావాన్ని నిలుపుతుంది; ‘ఎన్నుకోబడినవారు’ అని అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇక్కడ ఇశ్రాయేలు సమూహ సమాజాన్ని సూచించే עֵדָהకు ఆధునిక తెలుగులో సహజంగా, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: נְשִׂיאֵי
  choice: నాయకులు
  rationale: గోత్ర సంబంధ పరిపాలనా సందర్భంలో ఉన్నత స్థానంలోని నాయకులను సూచిస్తుంది; ‘రాజకుమారులు’ అనే తప్పుదోవ పట్టించే రాజవంశ భావాన్ని నివారిస్తుంది.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: తమ పితరుల గోత్రాలకు
  rationale: מַטּוֹת యొక్క గోత్రార్థాన్నీ, אֲבוֹתָםలోని పితృ/వంశ సంబంధాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: רָאשֵׁי
  choice: అధిపతులు
  rationale: ‘తలలు’ అనే మూల రూపకానికి తెలుగులో సహజమైన నాయకత్వ అర్థాన్ని ఇస్తుంది; ముందున్న ‘నాయకులు’తో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వేల విభాగాలకు
  rationale: אֶלֶףలోని ‘వెయ్యి’ భావాన్ని నిలుపుతూ, ఇది వ్యక్తుల సంఖ్య మాత్రమే కాక సామాజిక లేదా సైనిక విభాగం కావచ్చనే సందర్భార్థానికి చోటిస్తుంది.
