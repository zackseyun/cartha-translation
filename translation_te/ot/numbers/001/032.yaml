id: NUM.1.32
reference: Numbers 1:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: te
  text: యోసేపు కుమారులలో ఎఫ్రాయిము కుమారుల విషయమై, వారి తరతరాల ప్రకారం, వారి వంశాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యనుబట్టి, ఇరవై సంవత్సరాల వయసు మొదలుకొని అంతకంటే పైబడిన వారందరిలో యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైనిక సేవకు వెళ్లే వారందరు.” హెబ్రీ నుడికారం అక్షరార్థంగా యుద్ధానికి బయలుదేరడాన్ని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: యోసేపు కుమారులలో
  rationale: לְ ఇక్కడ జనగణనలో గోత్ర విభాగాన్ని పరిచయం చేస్తుంది. 'కుమారులు' అనే వంశపారంపర్య పదాన్ని నిలుపుతూ, సందర్భానుసారంగా వారసులను సూచిస్తుంది.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారుల
  rationale: యోసేపు సంతతిలో ఎఫ్రాయిము గోత్ర విభాగాన్ని తెలుపుతుంది; హెబ్రీ వంశావళి నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళి ప్రకారం
  rationale: ఈ జనగణన సందర్భంలో తరతరాల వంశక్రమం లేదా సంతతి నమోదు అనే భావాన్ని ఇస్తుంది; కేవలం ఆధునిక కుటుంబాన్ని సూచించదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇశ్రాయేలు గోత్ర నిర్మాణంలోని విస్తృత బంధుత్వ సమూహాన్ని సూచిస్తుంది; 'వంశాలు' సాధారణ పాఠకులకు సహజంగా ఆ సామాజిక విభాగాన్ని తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: తండ్రుల వంశరేఖ ఆధారంగా ఏర్పడిన సాంప్రదాయిక కుటుంబ విభాగాన్ని ఖచ్చితంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యనుబట్టి
  rationale: వ్యక్తులను పేరుపేరునా నమోదు చేసి లెక్కించడాన్ని సూచించే హెబ్రీ జనగణన సూత్రానికి సమీపంగా ఉంటుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారిలో
  rationale: ఇరవై సంవత్సరాలు మరియు ఆపై అనే వయోపరిమితిని ఆధునిక, స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: సైనిక సేవకు వెళ్లే ప్రతి పురుషుణ్ణి
  rationale: హెబ్రీ నుడికారం అక్షరార్థంగా సైన్యానికి లేదా యుద్ధానికి బయలుదేరడాన్ని చెబుతుంది. జనగణనలో లెక్కించబడిన వారు సైనిక వయస్సుగల పురుషులని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: జనగణనలో లింగ సూచన
  choice: ప్రతి పురుషుణ్ణి
  alternative: సైనిక సేవకు వెళ్లే ప్రతి ఒక్కరిని
  rationale: ఈ జనగణన సూత్రం సైనిక సేవకు సంబంధించిన వయోజన పురుషులను ఉద్దేశిస్తుంది. లింగాన్ని తటస్థీకరించకుండా మూలంలోని సూచనను స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన సూత్రంలోని పునరుక్త నిర్మాణాన్ని గౌరవిస్తూ సహజ పఠనానికి విభక్తులు సర్దుబాటు చేయబడ్డాయి. వచనం ముందు వాక్యంలోని లెక్కింపు ఆజ్ఞపై ఆధారపడినా, తెలుగులో సంపూర్ణ భావం కోసం 'లెక్కించారు' చేర్చబడింది.
