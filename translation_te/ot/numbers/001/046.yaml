  text: וַ/יִּֽהְיוּ֙ כָּל הַ/פְּקֻדִ֔ים שֵׁשׁ מֵא֥וֹת אֶ֖לֶף וּ/שְׁלֹ֣שֶׁת אֲלָפִ֑ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/046.yaml
  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: te
  text: అలా లెక్కించబడిన వారందరూ ఆరు లక్షల మూడువేల ఐదువందల యాభై మంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమోదైనవారు,’ ‘సైనిక లెక్కలో చేర్చబడినవారు.’ హీబ్రూ పదం జనగణనలో నమోదు చేయబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: అలా ... మంది
  rationale: వావ్-కన్సెక్యూటివ్‌తో వచ్చిన היה జనగణన ఫలితాన్ని కథనాత్మకంగా సమగ్రపరుస్తుంది; ‘అలా’ ఫలితార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל
  choice: అందరూ
  rationale: హీబ్రూ పదంలోని సమగ్ర భావాన్ని నిలుపుతూ వ్యక్తులను సూచించే సహజ తెలుగు రూపాన్ని వాడింది.
- source_word: הַפְּקֻדִים
  choice: లెక్కించబడిన వారు
  rationale: פקד పదం ఇక్కడ జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ఈ వచనంలో ‘పురుషులు’ అని మళ్లీ స్పష్టంగా లేకపోవడంతో దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు; సందర్భం మాత్రం సైనిక సేవకు అర్హులైన పురుషుల జనగణన.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ఆరు లక్షల మూడువేల ఐదువందల యాభై మంది
  rationale: హీబ్రూ సంఖ్య విలువ 603,550ను ఆధునిక తెలుగు సంఖ్యా ప్రయోగంలో సహజంగా, ఖచ్చితంగా అందించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. సంఖ్యను భారతీయ తెలుగు సంఖ్యా పద్ధతిలో ‘ఆరు లక్షల మూడువేల ఐదువందల యాభై’గా ఇచ్చాం. ప్రధాన పాఠ్యంలో మూలంలో లేని ‘పురుషులు’ అనే పదాన్ని చేర్చకుండా, సందర్భ సమాచారాన్ని పాదటిప్పణిలో సంకేతపరిచాం.
