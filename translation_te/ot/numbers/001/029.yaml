  text: those counted from the tribe of Issachar were fifty-four thousand four hundred[a].
translation:
  language: te
  text: ఇశ్శాఖారు గోత్రం నుండి లెక్కించబడినవారు యాభై నాలుగు వేల నాలుగు వందలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి సంఖ్య” లేదా “నమోదైనవారు.” ఇక్కడి హీబ్రూ జనగణన పదం నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד మూలం నుండి వచ్చిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ అనే పదబంధం జనగణన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ జనగణన సూత్రంలో לְמַטֵּה గోత్ర సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘గోత్రం నుండి’ సహజంగా ఉంది.
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: యాభై నాలుగు వేల నాలుగు వందల
  rationale: హీబ్రూ సంఖ్యను దాని ఖచ్చిత పరిమాణం మారకుండా ఆధునిక తెలుగు సంఖ్యాక్రమంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భం స్పష్టంగా ఉండేలా గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలో ‘పురుషులు’ అనే పదం ప్రత్యక్షంగా లేకపోయినా, సంఖ్యతో సహజ తెలుగు నిర్మాణం కోసం ‘మంది’ చేర్చబడింది.
