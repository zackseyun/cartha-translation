translation:
  language: te
  text: ఆషేరు గోత్రానికి చెందిన లెక్కించబడినవారు నలభై ఒక్క వేల ఐదు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד మూలం నుంచి వచ్చిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ అనేది మూలంలోని కర్మణి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְמַטֵּה אָשֵׁר
  choice: ఆషేరు గోత్రంలో
  rationale: ఈ జనగణన సూత్రంలో לְמַטֵּה గోత్ర అనుబంధాన్ని సూచిస్తుంది. తెలుగులో ‘ఆషేరు గోత్రంలో’ అనడం ఆ గోత్రానికి చెందిన లెక్కించబడినవారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: గోత్రనామాన్ని అనువదించకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: నలభై ఒక్క వేల ఐదు వందల మంది
  rationale: హీబ్రూ సంఖ్యా విలువ 41,500ను ఆధునిక తెలుగు సంఖ్యా క్రమంలో యథాతథంగా ఇచ్చాం; వ్యక్తుల సంఖ్య కావడంతో సహజత్వం కోసం ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భానికి తగిన స్పష్టమైన మరియు గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలో ‘పురుషులు’ అనే పదం ఈ వచనంలో ప్రత్యక్షంగా లేకపోవడంతో దానిని చేర్చలేదు.
