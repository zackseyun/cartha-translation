lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... మాట్లాడాడు
  rationale: వావ్-వరుస రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; דבר యొక్క ‘మాట్లాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; మూల ఉచ్చారణ పూర్తిగా నిర్ధారితం కాదని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל ఇక్కడ ప్రసంగం ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; తెలుగులో ‘మోషేతో’ సహజమైన సమానార్థకం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రాయ రూపాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తపరచాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి ‘ప్రభువు’ అనే బిరుదుతో దాన్ని భర్తీ చేయలేదు. అయితే దాని ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయినా కథన పరిచయ సూత్రపు గంభీరతను నిలుపుతూ రూపొందించబడింది.
