  text: 'From Asher: Pagiel son of Ocran.'
translation:
  language: te
  text: ఆశేరు గోత్రం నుండి ఆక్రాను కుమారుడు పగీయేలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אָשֵׁר
  choice: ఆషేరు గోత్రం నుండి
  rationale: ఈ జనగణన నాయకుల జాబితాలో לְ గోత్ర సంబంధాన్ని సూచిస్తోంది. తెలుగులో అర్థం స్పష్టంగా, సహజంగా ఉండేందుకు ‘గోత్రం నుండి’ అని అనువదించాం.
- source_word: פַּגְעִיאֵל
  choice: పగీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరును దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశపరమైన గుర్తింపులో హీబ్రూ בֶּן‌కు సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: עָכְרָן
  choice: ఆక్రాను
  rationale: హీబ్రూ వ్యక్తిపేరు עָכְרָן‌ను మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; ఆరంభ ע అక్షరానికి ప్రత్యేక తెలుగు ధ్వని సమానం లేకపోవడంతో దీర్ఘ ‘ఆ’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా సందర్భానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. పేర్లు ఇంగ్లీషు సంప్రదాయ రూపాల నుంచి కాకుండా హీబ్రూ మూలానికి దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
