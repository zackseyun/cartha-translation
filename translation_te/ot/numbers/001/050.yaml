id: NUM.1.50
reference: Numbers 1:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: te
  text: అయితే నీవు లేవీయులను సాక్ష్యపు గుడారానికి[a], దాని సామగ్రి అంతటికీ, దానికి చెందిన సమస్తానికీ బాధ్యులుగా నియమించు. వారే ఆ గుడారాన్ని, దాని సామగ్రి అంతటినీ మోయాలి; దానికి పరిచర్య చేయాలి[b]; ఆ గుడారం చుట్టూ శిబిరం వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాక్ష్యపు నివాసస్థలం.’ హీబ్రూ מִשְׁכָּן అనే పదానికి నివాసస్థలం అనే ప్రాథమిక భావం ఉంది; ఇక్కడ అది మోయదగిన పవిత్ర గుడారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానికి సేవ చేయాలి’ లేదా ‘దాన్ని చూసుకోవాలి.’ ఈ హీబ్రూ క్రియ పవిత్రస్థలానికి సంబంధించిన సేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: అయితే నీవు
  rationale: ముందటి వాక్యాల్లో లేవీయులను ఇతర గోత్రాల లెక్కలో చేర్చకూడదనే ఆదేశానికి భిన్నంగా, ఇప్పుడు వారికి ప్రత్యేక బాధ్యత అప్పగించబడుతోంది. అందువల్ల సంధానంలోని వ్యత్యాస భావాన్ని ‘అయితే’ తెలియజేస్తుంది; ఏకవచన సంబోధనను ‘నీవు’ నిలుపుతుంది.
- source_word: הַפְקֵד
  choice: బాధ్యులుగా నియమించు
  rationale: פקד హిఫిల్ ఆజ్ఞారూపం ఇక్కడ కేవలం లెక్కించడం కాక, ఒక బాధ్యతను అధికారికంగా అప్పగించడాన్ని సూచిస్తుంది.
- source_word: עַל
  choice: మీద
  rationale: పదేపదే వచ్చిన עַל లేవీయులకు అప్పగించిన పర్యవేక్షణ లేదా బాధ్యతా పరిధిని సూచిస్తుంది. తెలుగు వాక్యంలో ‘బాధ్యులుగా’తో కలిపి ఈ భావం స్పష్టమవుతుంది.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: సాక్ష్యపు నివాసమందిరం
  rationale: מִשְׁכָּן దేవుని నివాసస్థలమైన మోయదగిన పవిత్ర మందిరాన్ని సూచిస్తుంది; הָעֵדֻת దానిలో ఉంచబడిన నిబంధన సాక్ష్యాన్ని సూచిస్తుంది. ‘నివాసమందిరం’ మూలపదంలోని నివాస భావాన్నీ ఆరాధనా సందర్భాన్నీ కలిపి తెలియజేస్తుంది.
- source_word: כֵּלָיו
  choice: దాని సామగ్రి అంతటి
  rationale: כֵּלִים ఇక్కడ పాత్రలు మాత్రమే కాక, నివాసమందిరానికి సంబంధించిన వివిధ పవిత్ర వస్తువులు, పరికరాలను విస్తృతంగా సూచిస్తుంది; ‘సామగ్రి’ ఆ పరిధిని సహజంగా అందిస్తుంది.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: దానికి చెందిన సమస్తం
  rationale: నివాసమందిరానికి అనుబంధమైనవన్నీ అనే విస్తృత భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׂאוּ
  choice: మోయాలి
  rationale: ప్రయాణ సమయంలో నివాసమందిరాన్నీ దాని సామగ్రినీ శారీరకంగా మోసుకెళ్లే బాధ్యతను נשׂא ఇక్కడ సూచిస్తుంది.
- source_word: יְשָׁרְתֻהוּ
  choice: దానికి సేవ చేయాలి
  rationale: שרת పియేల్ రూపం పవిత్రస్థల సంబంధమైన సేవను సూచిస్తుంది. వస్తు ప్రత్యయాన్ని ‘దానికి’గా నిలుపుతూ, తరువాతి యాజకత్వ భావాలను అదనంగా చేర్చకుండా అనువదించబడింది.
- source_word: סָבִיב לַמִּשְׁכָּן
  choice: నివాసమందిరం చుట్టూ
  rationale: పవిత్రస్థలాన్ని పరివేష్టించి శిబిరం వేయడాన్ని ఈ పదబంధం నేరుగా సూచిస్తుంది.
- source_word: יַחֲנוּ
  choice: దిగాలి
  rationale: శిబిరం వేసి నివసించడాన్ని חנה సూచిస్తుంది. ఆదేశ సందర్భంలోని విధిబలాన్ని ‘దిగాలి’ తెలియజేస్తుంది.
theological_decisions:
- issue: מִשְׁכַּן అనే ఆరాధనా పదం
  choice: నివాసమందిరం
  alternative: గుడారం; నివాసస్థలం
  rationale: ఇది మోయదగిన పవిత్ర నివాసస్థలాన్ని సూచిస్తుంది. ‘నివాసమందిరం’ మూలంలోని ‘నివాసం’ భావాన్ని కాపాడుతూ, సాధారణ గుడారం కంటే దాని పవిత్ర కార్యాన్ని స్పష్టపరుస్తుంది.
- issue: שרת అనే క్రియలోని పవిత్ర సేవ భావం
  choice: దానికి సేవ చేయాలి
  alternative: దాని దగ్గర పరిచర్య చేయాలి; దాన్ని చూసుకోవాలి
  rationale: ఈ క్రియకు పవిత్ర సేవ భావం ఉన్నప్పటికీ, పాఠ్యంలో లేని తరువాతి మతపరమైన ప్రత్యేకార్థాలను చేర్చకుండా మూలంలోని ప్రత్యక్ష కర్మను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ఏకవచన సంబోధనకు ‘నీవు,’ ఆదేశాలకు సహజమైన ‘నియమించు/మోయాలి/సేవ చేయాలి/దిగాలి’ రూపాలు వాడబడ్డాయి. మూలంలోని ‘వారే’ అనే కర్త ఉద్ఘాటనను మూడు బాధ్యతల్లోనూ నిలుపబడింది.
