- from: అయితే నీవు లేవీయులను సాక్ష్యపు నివాసమందిరం[a] మీద, దాని సామగ్రి అంతటి మీద, దానికి చెందిన సమస్తం మీద బాధ్యులుగా నియమించు. వారే నివాసమందిరాన్ని, దాని సామగ్రి అంతటినీ మోయాలి; వారే దానికి సేవ చేయాలి[b]; నివాసమందిరం చుట్టూ వారే దిగాలి.
  to: అయితే నీవు లేవీయులను సాక్ష్యపు గుడారానికి[a], దాని సామగ్రి అంతటికీ, దానికి చెందిన సమస్తానికీ బాధ్యులుగా నియమించు. వారే ఆ గుడారాన్ని, దాని సామగ్రి అంతటినీ మోయాలి; దానికి పరిచర్య చేయాలి[b]; ఆ గుడారం చుట్టూ శిబిరం వేయాలి.
  rationale: బాధ్యతను సూచించే హీబ్రూ עַל కు తెలుగులో సహజమైన ‘...కు బాధ్యులుగా’ అనే నిర్మాణాన్ని వాడాం. ‘శిబిరం వేయాలి’ ద్వారా חנה యొక్క నిర్దిష్ట అర్థాన్ని నిలుపాం. మోయదగిన పవిత్ర నిర్మాణాన్ని సూచించేందుకు ‘సాక్ష్యపు గుడారం’ వాడి, నివాస భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా భద్రపరిచాం. మూలంలోని మూడు కర్తవ్యాల్లో లేవీయుల ఉద్ఘాటనను మొదటి ‘వారే’ ద్వారా కాపాడాం.
