lexical_decisions:
- source_word: לְ/גָד
  choice: గాదు గోత్రం నుండి
  rationale: ఈ జనగణన నాయకుల జాబితాలో לְ ఉపసర్గ గోత్ర అనుబంధాన్ని సూచిస్తుంది. తెలుగులో అర్థం సహజంగా, స్పష్టంగా ఉండేందుకు ‘గోత్రం నుండి’ అని వ్యక్తీకరించబడింది.
- source_word: אֶלְיָסָף
  choice: ఎల్యాసాఫు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ నిర్మాణానికి సహజమైన, సంక్షిప్త తెలుగు రూపం.
- source_word: דְּעוּאֵל
  choice: దెయూయేలు
  rationale: ఈ వచనంలోని WLC/మసొరా పాఠరూపాన్ని నేరుగా లిప్యంతరీకరించాం; ‘రెయూయేలు’ అనే సమాంతర పాఠరూపాన్ని పాదసూచికలో ఉంచాం.
