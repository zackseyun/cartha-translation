translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన భాష వాడబడింది. పాఠభేదం ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో భద్రపరచబడింది.
