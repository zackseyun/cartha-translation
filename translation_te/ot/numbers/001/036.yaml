- from: 'బెన్యామీను కుమారులలో, వారి వంశావళుల ప్రకారం, వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాలు మొదలుకొని అంతకంటే ఎక్కువ వయసుగలవారిలో యుద్ధానికి వెళ్లగల ప్రతి పురుషుడు:'
  to: 'బెన్యామీను కుమారుల విషయమై, వారి వంశావళుల ప్రకారం, వారి వంశగుంపుల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాల వయస్సు నుండి పైబడినవారిలో యుద్ధసేవకు వెళ్లగల ప్రతి పురుషుడు[a]:'
