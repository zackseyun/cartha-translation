id: NUM.1.36
reference: Numbers 1:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י בִנְיָמִ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: te
  text: 'బెన్యామీను కుమారుల విషయమై, వారి వంశావళుల ప్రకారం, వారి వంశగుంపుల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల సంఖ్యను బట్టి, ఇరవై సంవత్సరాల వయస్సు నుండి పైబడినవారిలో యుద్ధసేవకు వెళ్లగల ప్రతి పురుషుడు[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యుద్ధానికి బయలుదేరే ప్రతివాడు”; ఇది సైనిక సేవకు అర్హులైనవారిని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులలో
  rationale: לִ prefixed tribal heading is represented naturally in Telugu as a group from whom the census is taken; ‘కుమారులు’ preserves the Hebrew kinship expression while functioning tribally.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశావళుల ప్రకారం
  rationale: In this census formula the term concerns descent or genealogical registration; ‘వంశావళులు’ conveys lineage without reducing it merely to present households.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה denotes the clan-level kinship grouping; ‘వంశాలు’ is current, understandable Telugu and distinguishes it from the following పితృగృహాలు.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: This preserves the named patriarchal household unit closely and in a dignified census register.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్యను బట్టి
  rationale: A close and intelligible rendering of enumeration according to named individuals, without adding ‘one by one,’ which is not explicit here.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై సంవత్సరాలు మొదలుకొని అంతకంటే ఎక్కువ వయసుగలవారిలో
  rationale: Naturally expresses the inclusive lower age threshold conveyed by מִן ... וָמַעְלָה.
- source_word: כֹּל יֹצֵא צָבָא
  choice: యుద్ధానికి వెళ్లగల ప్రతి పురుషుడు
  rationale: The phrase literally describes one going out for military service; in this male military census, ‘ప్రతి పురుషుడు’ makes the contextual referent explicit, while ‘వెళ్లగల’ communicates eligibility or fitness without overexplaining.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన జనగణన-జాబితా శైలిని నిలిపాం. వరుసగా వచ్చే ‘ప్రకారం’ అనే నిర్మాణం హీబ్రూ సూత్రబద్ధ సమాంతరతను కాపాడుతుంది. వాక్యం తదుపరి వచనంలోని సంఖ్యతో కొనసాగుతున్నందున చివర ద్విబిందువు ఉంచబడింది.
