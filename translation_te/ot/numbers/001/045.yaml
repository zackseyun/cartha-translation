  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలు కుమారులలో లెక్కించబడిన వారందరూ[a] తమ పితృగృహాల ప్రకారం, ఇరవై సంవత్సరాల వయసు నుంచీ అంతకంటే పైబడిన వారిలో ఇశ్రాయేలులో యుద్ధానికి వెళ్లగల ప్రతి ఒక్కరూ[b] ఉన్నారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు.’ హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది; ఈ జనగణన ప్రత్యేకంగా పురుషులను, సైనిక సేవను దృష్టిలో ఉంచుకొని నిర్వహించబడినందున ఆ రూపాన్నే ప్రధాన పాఠంలో ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సైనిక సేవకు అర్హుడైన ప్రతి ఒక్కరూ.’ అక్షరార్థంగా, ‘సైన్యానికి/యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కాబట్టి ... అయ్యారు
  rationale: ఈ వయ్యిక్తోల్ రూపం ముందటి లెక్కింపు వృత్తాంతాన్ని కొనసాగిస్తూ దాని సారాంశ ఫలితాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యంలో ‘కాబట్టి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פְּקוּדֵי
  choice: లెక్కించబడిన వారు
  rationale: జనగణన లేదా సైనిక నమోదు సందర్భంలోని פקד పదానికి ఉన్న నిష్క్రియాత్మక, ఫలితార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధాన్ని దగ్గరగా అనుసరిస్తూ, ఈ జనగణన పురుషులు మరియు సైనిక సేవకు సంబంధించినదనే సందర్భాన్ని కాపాడుతుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ తమ పితృగృహాల ప్రకారం
  rationale: జనగణన పితృవంశ గృహాల ఆధారంగా వ్యవస్థీకరించబడిందని తెలియజేస్తుంది; ‘తమ తమ’ పంపిణీ భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారు
  rationale: వయోపరిమితి సూత్రాన్ని ఖచ్చితంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל יֹצֵא צָבָא
  choice: యుద్ధానికి వెళ్లగల ప్రతి ఒక్కరూ
  rationale: అక్షరార్థంగా ‘సైన్యానికి/యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరూ’; సందర్భంలోని సైనిక అర్హత భావాన్ని స్పష్టంగా తెలియజేస్తూనే మూల భాషా నుడికారానికి దగ్గరగా ఉంటుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: సమాజపరమైన లేదా స్థానపరమైన హీబ్రూ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
