  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ వచనం 46వ వచనంలోని మొత్తం సంఖ్యతో పూర్తయ్యే అసంపూర్ణ వాక్యభాగం కాబట్టి చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
