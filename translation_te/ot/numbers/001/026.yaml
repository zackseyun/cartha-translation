source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: te
  text: 'యూదా కుమారులు: వారి వంశక్రమాల ప్రకారం, వారి కుటుంబాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం, పేర్ల లెక్కన, ఇరవై సంవత్సరాల వయస్సు మొదలుకొని అంతకంటే పైబడిన యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి బయలుదేరే వారందరూ.” ఈ హీబ్రూ నుడికారం సైనిక సేవకు అర్హులైనవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: యూదా కుమారులలో
  rationale: בני అనే పదానికి అక్షరార్థంగా ‘కుమారులు’ అని అర్థం; ఇక్కడ అది యూదా గోత్రానికి చెందిన పురుషులను సూచిస్తుంది. ముందున్న వచనంతో కొనసాగే జాబితా నిర్మాణానికి ‘లో’ సహజంగా సరిపోతుంది.
- source_word: תּוֹלְדֹתָם
  choice: వారి వంశక్రమాల ప్రకారం
  rationale: ఈ పదం తరాలు, వంశపరంపర లేదా వంశావళిని సూచించగలదు. లిఖిత పత్రాలనే ఉద్దేశించినట్లు నిర్ధారించకుండా, జనగణనలోని వంశపరమైన క్రమాన్ని ‘వంశక్రమాలు’ తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి గోత్రాల ప్రకారం
  rationale: ఇక్కడ משפחה అనేది మొత్తం తెగలోని ఉపవిభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుటుంబాలు’ కంటే ‘గోత్రాలు’ ఈ విస్తృత సామాజిక విభాగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృ కుటుంబాల ప్రకారం
  rationale: ‘వారి తండ్రుల ఇళ్ల ప్రకారం’ అనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో చెప్పి, మూలంలోని పితృవంశ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల లెక్కన
  rationale: వ్యక్తులను పేరుపేరునా లెక్కించడాన్ని సూచించే హీబ్రూ సూత్రప్రాయ పదబంధానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయస్సుగలవారిలో
  rationale: జనగణనకు వర్తించే కనిష్ఠ వయోపరిమితిని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כֹּל יֹצֵא צָבָא
  choice: యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు
  rationale: అక్షరార్థానికి దగ్గరగా ‘యుద్ధానికి బయలుదేరే ప్రతి ఒక్కరు’ అనే భావం ఉంది. జనగణన సందర్భంలోని సైనిక వయస్సు పురుషులను సూచించేందుకు ‘ప్రతి పురుషుడు’ వాడబడింది; మూలంలో లేని ‘సామర్థ్యంగల’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: జనగణనలో లింగ సూచన
  choice: యుద్ధానికి బయలుదేరే ప్రతి పురుషుడు
  alternative: యుద్ధానికి బయలుదేరే వారందరూ
  rationale: హీబ్రూ వ్యాకరణ రూపం పుంలింగంలో ఉండి, సందర్భం సైనిక సేవకు లెక్కించబడిన వయోజన పురుషులకు సంబంధించినది. అందువల్ల లింగాన్ని సాధారణీకరించకుండా సందర్భానుగుణంగా స్పష్టపరచబడింది.
- issue: సైనిక సేవకు అర్హత భావం
  choice: యుద్ధానికి బయలుదేరే
  alternative: సైనిక సేవకు అర్హుడైన
  rationale: హీబ్రూ పదబంధం బయలుదేరడాన్ని నేరుగా చెబుతుంది; అర్హత భావం సందర్భం ద్వారా వస్తుంది. ప్రధాన పాఠ్యంలో ఆ వ్యాఖ్యానాన్ని బలవంతంగా చేర్చకుండా, పాదటిప్పణిలో వివరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘వంశక్రమాలు—గోత్రాలు—పితృ కుటుంబాలు’ అనే క్రమంతో మూలంలోని సామాజిక విభాగాల తేడాను సాధ్యమైనంత వరకు నిలుపుతూ, జనగణన సూత్రపు పునరుక్త నిర్మాణాన్ని పరిరక్షించాం.
