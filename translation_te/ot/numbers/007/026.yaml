  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. జాబితా వాక్య నిర్మాణాన్ని నిలుపుతూ సెమీకోలన్‌తో ముగించింది. ‘ధూపపాత్ర’ అనే సందర్భానుకూల పదాన్ని వాడి, మూలంలోని సంక్షిప్త బరువు ప్రయోగాన్ని పాదటిప్పణిలో వెల్లడించింది.
