translation:
  language: te
  text: పది షెకెలుల బరువున్న ఒక బంగారు పాత్ర, ధూపద్రవ్యంతో నిండినది;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: ధూపపాత్ర
  rationale: ఇక్కడ మానవ అరచేయి కాదు, పరిశుద్ధస్థల సేవలో ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్ర ఉద్దేశించబడింది. ఆధునిక తెలుగులో ‘ధూపపాత్ర’ సహజంగా ఉండి, సందర్భానుసారమైన ఉపయోగాన్ని స్పష్టం చేస్తుంది.
- source_word: אַחַת
  choice: ఒక
  rationale: כַּף అనే ఏకవచన స్త్రీలింగ నామవాచకాన్ని విశేషించే సాధారణ సంఖ్యావాచకాన్ని నేరుగా అనువదించింది.
- source_word: עֲשָׂרָה
  choice: పది షెకెలుల బరువుగల
  rationale: హీబ్రూ పాఠంలో అక్షరార్థంగా ‘పది’ మాత్రమే ఉన్నా, వెంటనే ఉన్న పునరావృత అర్పణ జాబితా సూత్రం ప్రకారం ఇది పాత్ర బరువును షెకెలులలో సూచించే సంక్షిప్త ప్రయోగం. తెలుగులో కొలతను అర్థవంతంగా చేయడానికి ‘షెకెలుల బరువుగల’ అని పూరించింది.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ‘బంగారు పాత్ర’ అనే విశేషణ రూపం తగినది.
- source_word: מְלֵאָה
  choice: నిండి ఉంది
  rationale: స్త్రీలింగ పాత్రకు సంబంధించిన విధేయ విశేషణం. ‘ధూపద్రవ్యంతో నిండి ఉంది’ అనేది సహజమైన తెలుగు నిర్మాణం.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: పరిశుద్ధస్థల ఆరాధనలో ఉపయోగించే సుగంధ అర్పణ పదార్థాన్ని సూచిస్తుంది. ‘ధూపం’ కంటే ‘ధూపద్రవ్యం’ పాత్రలో నింపబడే పదార్థాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
