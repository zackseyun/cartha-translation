  text: Then the LORD said to Moses, saying,
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రతిబింబిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-క్రమకథన రూపంలోని కొనసాగింపును సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ నుడికారాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘చెబుతూ’ అనే అనవసర పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఈ వచనంలో దాని గుర్తింపును అస్పష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మోషేతో’ అనేది אֶל־מֹשֶׁה యొక్క సహజ తెలుగు వ్యక్తీకరణ; చివరి ద్విబిందువు తరువాతి దైవవాక్యాన్ని సూచిస్తుంది.
