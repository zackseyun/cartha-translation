  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన గౌరవప్రద భాష వాడబడింది. ‘ధూపపాత్ర’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని సంక్షిప్త బరువు ప్రయోగాన్ని పాదటిప్పణి వివరిస్తుంది.
