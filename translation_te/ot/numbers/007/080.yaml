translation:
  language: te
  text: పది షెకెల్ల బరువుగల ఒక బంగారు ధూపపాత్ర[a], ధూపద్రవ్యంతో నిండినది;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం అక్షరార్థంగా, ‘ఒక బంగారు పాత్ర, బంగారంలో పది, ధూపద్రవ్యంతో నిండినది’ అని ఉంది. ఈ అధ్యాయంలోని అర్పణల జాబితా సూత్రం ఆధారంగా ‘షెకెల్లు’ అనే బరువు ప్రమాణం అర్థం చేసుకోవాలి. ఇక్కడ ‘ధూపపాత్ర’గా అనువదించిన పదాన్ని సంప్రదాయ అనువాదాలు కొన్నిసార్లు ‘చెంచా’గా అనువదిస్తాయి; అది ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: ధూపపాత్ర
  rationale: ఇక్కడ ఈ పదం అరచేయిని లేదా ఆధునిక అర్థంలోని చెంచాను సూచించదు; ధూపద్రవ్యాన్ని ఉంచే చిన్న ఆచారపాత్రను సూచిస్తుంది. సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘ధూపపాత్ర’ ఎంచుకోబడింది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో సరిపడే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెల్ల బరువుగల
  rationale: ఈ అధ్యాయంలోని పునరావృత అర్పణల జాబితాలో సంఖ్యతో పాటు బంగారం అనే పదం బరువు ప్రమాణాన్ని సంక్షిప్తంగా సూచిస్తుంది; అందువల్ల అర్థస్పష్టత కోసం ‘షెకెల్లు’ పూరించబడింది.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సహజమైన ఆధునిక తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: מְלֵאָה
  choice: నిండినది
  rationale: పాత్రలోని పదార్థాన్ని వర్ణించే విధేయ విశేషణ భావాన్ని నిలుపుతుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: ప్రత్యక్ష గుడారపు ఆరాధన సందర్భంలో అర్పించడానికి ఉపయోగించే సుగంధ ధూప పదార్థాన్ని సూచిస్తుంది.
