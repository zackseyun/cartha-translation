translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని జంతువుల సంఖ్య, రకం, వయస్సు, బలి వర్గం అన్నీ నిలుపబడ్డాయి.
