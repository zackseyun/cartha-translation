translation:
  language: te
  text: మందలోనుండి ఒక ఎద్దును, ఒక పొట్టేలును, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్లను దహనబలిగా;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: మందలోనుండి ఒక ఎద్దును
  rationale: פַּר అనేది ఎద్దును సూచిస్తుంది; בֶּן בָּקָר దాని గోవుల మందకు చెందినదని తెలిపే హీబ్రూ ప్రయోగం. తెలుగులో అనవసర పునరుక్తి లేకుండా రెండింటి భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: אַיִל אֶחָד
  choice: ఒక పొట్టేలును
  rationale: బలి సందర్భంలో אַיִל వయోజన మగ గొర్రెను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేలు’ సహజమైన నిర్దిష్ట పదం.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ఒక మగ గొర్రెపిల్లను
  rationale: כֶּבֶשׂ గొర్రెపిల్లను, ఈ బలి జాబితాలో మగ గొర్రెపిల్లను సూచిస్తుంది; జంతువు లింగాన్ని స్పష్టంగా ఉంచింది.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: ఈ హీబ్రూ నుడికారం మొదటి సంవత్సరంలో ఉన్న లేదా ఒక సంవత్సరం వయసున్న జంతువును సూచిస్తుంది; ఈ సందర్భంలో సహజమైన తెలుగు రూపం వాడబడింది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహింపబడే బలి రకానికి ప్రామాణిక పదం; ‘దహనబలి’ స్పష్టమైన, స్థిరమైన తెలుగు బైబిలు పరిభాష.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి బలి జంతువు సంఖ్యను తెలిపే పునరావృత సంఖ్యావాచకాన్ని జాబితా శైలిలో నిలుపుకుంది.
