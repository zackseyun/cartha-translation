  yaml_path: translation/ot/numbers/007/056.yaml
  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: te
  text: పది షెకెలుల బరువున్న ఒక బంగారు ధూపపాత్ర[a]; అది ధూపద్రవ్యంతో నిండి ఉంది;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక బంగారు పాత్ర, పది, ధూపద్రవ్యంతో నిండి ఉంది.” ఇక్కడ హీబ్రూ మూలపాఠం బరువు ప్రమాణాన్ని ప్రత్యక్షంగా చెప్పదు; అయితే ఈ అధ్యాయంలో పునరావృతమయ్యే అర్పణ వివరణలో భావం పది షెకెలులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: ధూపపాత్ర
  rationale: సాధారణంగా ఈ పదానికి అరచేయి లేదా చెంచా వంటి అర్థాలు ఉన్నా, సంఖ్యాకాండము 7లోని ఆరాధనా అర్పణల జాబితాలో ఇది ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది. ఆధునిక పాఠకులకు ఉపయోగం స్పష్టంగా ఉండేందుకు ‘ధూపపాత్ర’ను ఎంచుకున్నాం.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో సరిపడే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది షెకెలుల బరువున్న
  rationale: హీబ్రూలో ‘పది’ అని మాత్రమే ఉండి బరువు ప్రమాణం సూచితంగా ఉంది. ఇదే అధ్యాయంలోని పునరావృత అర్పణ సూత్రం ఆధారంగా ‘షెకెలులు’ను స్పష్టత కోసం పాఠ్యంలో చేర్చాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: מְלֵאָה
  choice: నిండి ఉంది
  rationale: పాత్రలోని పదార్థం దానిని నింపి ఉందని తెలిపే విధేయ విశేషణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: ఆరాధనలో ఉపయోగించే సుగంధ ధూప పదార్థాన్ని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో స్పష్టత కోసం సూచిత బరువు ప్రమాణాన్ని చేర్చాం; దాన్ని పాదసూచికలో వెల్లడించాం.
