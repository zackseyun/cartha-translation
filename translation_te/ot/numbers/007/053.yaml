  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: te
  text: మరియు సమాధాన బలి కోసం రెండు పశువులు[a], ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఒక సంవత్సరం వయసున్న ఐదు గొర్రెపిల్లలు. ఇది అమ్మీహూదు కుమారుడైన ఎలీషామా అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలి” లేదా “క్షేమ బలి.” హీబ్రూ పదం శాంతి, సంపూర్ణ క్షేమం, అలాగే కలిసి పాలుపంచుకునే బలి భోజనం వంటి భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలిగా
  rationale: ఈ సంయుక్త పదబంధం జాబితాలోని మరో బలి విభాగాన్ని పరిచయం చేస్తుంది. ‘సమాధాన బలి’ సంప్రదాయంగా గుర్తించదగినదిగా ఉండి, శాంతి/సంపూర్ణత మరియు భాగస్వామ్య భోజన భావాలకు చోటిస్తుంది.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בקר అనేది గోవుల జాతికి సంబంధించిన సమూహార్థక పదం; లింగం లేదా పనిని నిర్దిష్టం చేయని మూలపాఠాన్ని ‘ఎద్దులు’ అని మరీ ప్రత్యేకం చేయకుండా ‘పశువులు’గా ఉంచాం.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם బలుల జాబితాలో మగ గొర్రెలను స్పష్టంగా సూచిస్తుంది.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; అందువల్ల లింగభేదాన్ని అనువాదంలో నిలిపాం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఒక సంవత్సరం వయసున్న ఐదు గొర్రెపిల్లలు
  rationale: בני שנה అనే హీబ్రూ ప్రయోగం ‘ఒక సంవత్సరం వయసున్న’ అని సహజంగా అనువదించబడుతుంది. ఇక్కడ כְּבָשִׂיםను సాధారణంగా ‘గొర్రెపిల్లలు’గా ఇచ్చి, మూలపాఠం ఈ సందర్భంలో స్పష్టంగా చెప్పని లింగాన్ని అదనంగా చేర్చలేదు.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పణ
  rationale: క్రియలేని హీబ్రూ వాక్యం పేరుపొందిన నాయకుడు సమర్పించిన అర్పణను గుర్తిస్తుంది; తెలుగు జాబితా శైలిలో ‘ఇది ... అర్పణ’ సహజంగా ఉంటుంది.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: అమ్మీహూదు కుమారుడైన ఎలీషామా
  rationale: పేర్లను హీబ్రూ రూపాలకు అనుగుణంగా లిప్యంతరీకరించి, patronymic సంబంధాన్ని సహజ తెలుగు పదక్రమంలో తెలిపాం.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి పదానికి అర్థవ్యాప్తి
  choice: సమాధాన బలి
  alternative: సహవాస బలి / క్షేమ బలి
  rationale: ఏకైక సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించకుండా, గుర్తించదగిన సంప్రదాయ పదాన్ని ప్రధాన పాఠంలో ఉంచి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే జాబితా శైలిని వాడాం. బలి సంబంధిత పదజాలాన్ని సంక్షిప్తంగా ఉంచి, మూలంలో లేని లింగ నిర్దిష్టతను గొర్రెపిల్లలకు చేర్చలేదు.
