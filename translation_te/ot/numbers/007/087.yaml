  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: te
  text: 'దహనబలి కోసం ఉన్న పశువుల మొత్తం: పన్నెండు మగ ఎద్దులు, పన్నెండు పొట్టేళ్లు, ఏడాది వయసున్న పన్నెండు గొర్రెపిల్లలు, వాటికి సంబంధించిన ధాన్యార్పణ; పాపపరిహార బలి[a] కోసం పన్నెండు మగ మేకలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి.” హీబ్రూ పదం חַטָּאת పాపంతోపాటు అపవిత్రత నుంచి శుద్ధీకరణను కూడా ప్రధానంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר לָעֹלָה
  choice: దహనబలి కోసం తెచ్చిన పశువులన్నీ
  rationale: כָּל సమగ్ర మొత్తాన్ని సూచిస్తుంది; הַבָּקָר గోవుల వర్గాన్ని సమూహంగా సూచించినా, తెలుగు జాబితా సందర్భంలో సహజంగా ఉండేందుకు ‘పశువులు’ అని ఇచ్చాం. לָעֹלָה ఉద్దేశాన్ని ‘దహనబలి కోసం’గా తెలిపాం.
- source_word: פָּרִים
  choice: కోడెదూడలు
  rationale: బలి సందర్భంలోని మగ గోవులను సూచించే פַּר పదానికి ఆధునిక తెలుగులో సహజమైన, ప్రత్యేకమైన పదం.
- source_word: אֵילִם
  choice: పొట్టేళ్లు
  rationale: బలికి ఉపయోగించే మగ గొర్రెలను స్పష్టంగా సూచిస్తుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ఏడాది వయసున్న గొర్రెపిల్లలు
  rationale: జంతువుల రకాన్నీ నిర్దిష్ట వయసునూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּמִנְחָתָם
  choice: వాటితో అర్పించాల్సిన ధాన్యార్పణ
  rationale: מִנְחָה బలి ధర్మశాస్త్ర సందర్భంలో ధాన్యార్పణను సూచిస్తుంది; బహువచన ప్రత్యయం ముందున్న దహనబలి జంతువులతో దాని అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: పన్నెండు మగ మేకలు
  rationale: ఈ పదబంధం మగ మేకలను ప్రత్యేకంగా సూచిస్తుంది; తెలుగు పాఠకులకు నేరుగా అర్థమయ్యే రూపం.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలి
  rationale: חַטָּאתకు బలి సందర్భంలో సంప్రదాయంగా గుర్తించదగిన తెలుగు పదబంధం; పాపంతో సంబంధాన్ని చూపుతుంది, కాగా శుద్ధీకరణ భావాన్ని పాదటీపులో నిలిపాం.
theological_decisions:
- issue: బలి ధర్మశాస్త్రంలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలినీ అపవిత్రత తొలగింపునకు సంబంధించిన శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠంలో పరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, నిజమైన భావవిస్తృతిని పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితా యొక్క సంక్షిప్తతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ధాన్యార్పణ,’ ‘దహనబలి,’ ‘పాపపరిహార బలి’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో కలిపాం.
