  yaml_path: translation/ot/numbers/007/038.yaml
  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: te
  text: ధూపద్రవ్యంతో నిండిన, పది షెకెల్ల బరువుగల ఒక బంగారు పాత్ర[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, ‘ఒక బంగారు పాత్ర, పది బంగారం, ధూపద్రవ్యంతో నిండినది.’ ఈ సందర్భంలోని సంక్షిప్త బరువు సూత్రం కారణంగా ‘షెకెల్ల బరువుగల’ అని పాఠ్యంలో స్పష్టపరచబడింది. ‘పాత్ర’కు బదులుగా ‘గిన్నె,’ ‘చిన్న పళ్లెం,’ లేదా సంప్రదాయంగా ‘చెంచా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: పాత్ర
  rationale: ఈ ప్రత్యక్ష గుడారపు అర్పణల సందర్భంలో ఇది అరచేయి లేదా సాధారణ చెంచా కాకుండా ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాత్ర’ సహజంగా ఉండి, ఆకారాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אַחַת
  choice: ఒక
  rationale: כַּף అనే ఏకవచన స్త్రీలింగ నామవాచకాన్ని విశేషించే సంఖ్యావాచకాన్ని నేరుగా అనువదించింది.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెల్ల బరువుగల
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పది బంగారం’ అని ఉన్నా, సంఖ్యాకాండము 7లోని సమాంతర జాబితా సూత్రం ప్రకారం ఇది బంగారు పాత్ర బరువును సూచించే సంక్షిప్త ప్రయోగం. తెలుగులో అర్థస్పష్టత కోసం ‘షెకెల్లు’ మరియు ‘బరువుగల’ చేర్చబడ్డాయి.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సహజమైన తెలుగు విశేషణ రూపంలో తెలిపింది.
- source_word: מְלֵאָה
  choice: నిండిన
  rationale: పాత్రలోని పదార్థాన్ని సూచించే విధేయ విశేషణ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: ఆరాధనలో అర్పించే సుగంధ పదార్థాన్ని సూచించే గౌరవప్రదమైన, స్పష్టమైన తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన జాబితా శైలిని వాడింది. మూలంలోని సంక్షిప్త బరువు ప్రయోగాన్ని పాఠ్యంలో స్పష్టం చేస్తూనే, అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపింది; כַּף ఆకారం నిర్దిష్టంగా తెలియనందున విస్తృతార్థకమైన ‘పాత్ర’ను ఎంచుకుంది.
