  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ ఇలా ఉంది: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]—ఈ బరువులు పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం[c]. ఆ రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన మెత్తని పిండితో నింపబడి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పళ్లెం’ అనే పదానికి మూలమైన קַעֲרָה, వెడల్పుగా అంత లోతులేని వెండి పాత్రను సూచిస్తుంది; ‘పాత్ర’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గిన్నె’ అనే పదానికి మూలమైన מִזְרָק, ఆరాధనా సేవలో ఉపయోగించే పాత్రను సూచిస్తుంది; ‘బేసిన్’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘పరిశుద్ధ స్థలపు షెకెలు ప్రకారం’; అంటే పరిశుద్ధ స్థలంలో నిర్ణయించిన ప్రామాణిక బరువు ప్రకారం.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ ఏమిటంటే
  rationale: కָרְבָּן ఆరాధన సందర్భంలో దేవుని సన్నిధికి తీసుకువచ్చే అర్పణను సూచిస్తుంది. హీబ్రూ నామవాక్య జాబితా నిర్మాణాన్ని సహజమైన తెలుగు పరిచయ వాక్యంతో తెలిపాం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קְעָרָה సాధారణంగా వెడల్పుగా, అంత లోతులేని పాత్రను సూచిస్తుంది; ‘పళ్లెం’ ఆధునిక తెలుగులో ఈ ఆకారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: మూలంలోని ‘దాని బరువు ముప్పై మరియు వంద’ అనే భావాన్ని తెలుగు సంఖ్యాక్రమం, వాక్యనిర్మాణానికి తగినట్లు ఇచ్చాం.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק బలుల సంబంధమైన సేవలో ఉపయోగించే లోతైన పాత్ర. సాధారణ పాఠకునికి స్పష్టమైన ‘గిన్నె’ను ఎంచుకుని, ఆరాధనాపరమైన ఉపయోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: ఈ మాట గిన్నె బరువును తెలుపుతుంది; తెలుగులో స్పష్టత కోసం ‘బరువుగల’ అని వ్యక్తం చేశాం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం కొలతకు ఉపయోగించిన అధికారిక పరిశుద్ధ స్థల ప్రమాణాన్ని సూచిస్తుంది. కేవలం స్థలాన్ని కాక ప్రమాణ బరువును సూచిస్తున్నదని తెలుగులో స్పష్టం చేశాం.
- source_word: שְׁנֵיהֶם
  choice: ఆ రెండూ
  rationale: ముందు చెప్పిన రెండు వెండి పాత్రలను ప్రత్యక్షంగా సూచించే మూల సర్వనామ భావాన్ని నిలిపాం.
- source_word: מְלֵאִים
  choice: నింపబడి ఉన్నాయి
  rationale: రెండు పాత్రలు పిండితో నిండివున్న స్థితిని సహజమైన తెలుగు కర్మణి నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలుల కోసం ఉపయోగించే బాగా శుద్ధిచేసిన సన్నని పిండిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిలో నూనె కలపబడినదనే కర్మణి భావాన్ని సరళంగా, ఖచ్చితంగా తెలిపాం.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ఈ పదం భేదాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. జాబితా స్వభావాన్ని నిలిపి, బరువుల ప్రమాణం రెండు పాత్రలకూ వర్తిస్తుందని సహజంగా స్పష్టం చేశాం. ‘షెకెలు’ అనే ప్రాచీన కొలమానాన్ని లిప్యంతరీకరించి, దాని ప్రమాణార్థాన్ని పాదసూచికలో వివరించాం.
