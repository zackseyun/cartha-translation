  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]; ఆ రెండూ నూనెతో కలిపిన మెత్తని పిండితో ధాన్యార్పణ కోసం నింపబడ్డాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక వెండి గిన్నె.” కַעֲרָה ఒక పాత్రను సూచిస్తుంది; దాని ఖచ్చితమైన ఆకారం పూర్తిగా నిశ్చితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒక వెండి ప్రోక్షణ పాత్ర.” מִזְרָק అనే పదం ఆచారంలో ద్రవాన్ని చల్లడానికి ఉపయోగించే పాత్రను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: దేవుని సన్నిధికి తీసుకొచ్చే కానుక లేదా బలిని సూచించే పదం; యాజక సంబంధ సందర్భంలో ‘అర్పణ’ సహజమైన, విస్తృతమైన తెలుగు సమానం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה ఒక వెడల్పైన, బహుశా లోతు తక్కువగల పాత్రను సూచిస్తుంది; ఖచ్చితమైన ఆకారం అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: ‘దాని బరువు నూట ముప్పై’ అనే హీబ్రూ భావాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో స్పష్టంగా తెలిపింది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק ఆచార సంబంధమైన పాత్ర; దాని క్రియాత్మక ఉపయోగాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా సాధారణమైన ‘గిన్నె’ను ఎంచుకున్నాం.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: ఈ సంఖ్య రెండవ పాత్ర బరువును సూచిస్తుందని తెలుగులో స్పష్టంగా వ్యక్తం చేసింది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది ఆరాధనా కేంద్రంలో అమలైన ప్రామాణిక బరువు కొలతను సూచిస్తుంది; ‘ప్రమాణం ప్రకారం’ అనే మాట సాంకేతిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ ... నింపబడ్డాయి
  rationale: రెండు పాత్రలూ ఒకే పదార్థంతో నిండి ఉన్నాయని హీబ్రూ స్పష్టతను నిలిపింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలులలో ఉపయోగించే సన్నగా దంచిన నాణ్యమైన పిండిని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండి నూనెతో కలపబడిన స్థితిని సరళంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ధాన్యంతో చేసే ప్రత్యేక అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణ’ ఆ బలి వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది.
