translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. జాబితా స్వభావాన్ని నిలుపుతూ తెలుగు వాక్యప్రవాహం కోసం బరువు వివరాలను ‘బరువుగల’ నిర్మాణంతో ఇచ్చాం. ‘షెకెలు’ను ప్రాచీన బరువు ప్రమాణంగా లిప్యంతరీకరించాం; ప్రధాన పాఠంలో పాత్రల ఖచ్చిత ఆకారం లేదా ఆచార వినియోగాన్ని అతిగా నిర్దిష్టం చేయలేదు.
