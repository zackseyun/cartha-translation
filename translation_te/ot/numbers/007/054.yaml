translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని సంక్షిప్త నామవాచక నిర్మాణాన్ని తెలుగులో పూర్తి అర్థమిచ్చే వాక్యంగా ఉంచాం. వివరణకు సరైన పదబంధం దగ్గరే [a] సూచికను పెట్టాం.
