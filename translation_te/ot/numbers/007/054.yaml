source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: te
  text: ఎనిమిదవ రోజున, మనష్షే కుమారుల[a] నాయకుడు పెదాహ్‌సూరు కుమారుడైన గమలీయేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనష్షే కుమారులు’ అనేది ఒక గోత్రాన్ని సూచించే హీబ్రూ ప్రయోగం; అంటే మనష్షే సంతతివారు లేదా మనష్షే గోత్రం.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: בְּ ఉపసర్గతో కూడిన ‘రోజు’ మరియు క్రమసంఖ్య కలిసి కాలాన్ని సూచిస్తున్నాయి. ‘ఎనిమిదవ రోజున’ అనేది మూలంలోని నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఈ వచనంలో స్పష్టంగా లేని ‘ప్రతిష్ఠాపన’ వంటి సందర్భాన్ని చేర్చదు.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ అర్పణల సందర్భంలో ఈ పదం గోత్రానికి గుర్తింపు పొందిన అధిపతిని సూచిస్తుంది. ‘నాయకుడు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, ‘రాజకుమారుడు’ అనే రాజవంశ సంబంధమైన అపార్థాన్ని నివారిస్తుంది.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారుల
  rationale: ఈ నిర్మాణం నాయకుడు ప్రాతినిధ్యం వహించిన సమూహాన్ని గుర్తిస్తుంది. ‘కుమారులు’ అనే కుటుంబాధారిత గోత్ర నుడికారాన్ని నిలుపుతూ, తెలుగులో ‘నాయకుడు’తో సహజంగా అనుసంధానించడానికి షష్ఠీ విభక్తి రూపం వాడబడింది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: వ్యక్తి/గోత్ర నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גַּמְלִיאֵל
  choice: గమలీయేలు
  rationale: వ్యక్తి నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: తండ్రి-కొడుకు సంబంధాన్ని తెలిపే సాధారణ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: פְּדָה צוּר
  choice: పెదాసూరు
  rationale: మసొరెటిక్ పాఠంలో భాగాలు వేరుగా కనిపించినా ఇది ఒకే వ్యక్తి నామం; తెలుగులో ఒకే పేరుగా లిప్యంతరీకరించాం.
