lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: ఐదవ రోజున
  rationale: నిర్దిష్ట క్రమసంఖ్యతో కూడిన కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని ‘ప్రతిష్ఠాపన’ వంటి సందర్భ పదాన్ని చేర్చదు.
