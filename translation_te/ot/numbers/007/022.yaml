translation:
  language: te
  text: పాపపరిహార బలిగా ఒక మగ మేకపోతును;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: ఈ సంయుక్త పదబంధం బలుల సందర్భంలో మగ మేకను సూచిస్తుంది. ‘మగ మేకపోతు’ జంతువు లింగాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: అర్పణ వస్తువుల లెక్కను తెలిపే జాబితా శైలిని ‘ఒక’ సహజంగా నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: ఈ ఆచార సంబంధ సందర్భంలో חַטָּאת నైరూప్యమైన పాపాన్ని కాక నిర్దిష్ట బలి రకాన్ని సూచిస్తుంది; ‘బలిగా’ అనే రూపం לְ ఉపసర్గపు ప్రయోజనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חַטָּאת అనే బలి సంబంధ పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: పాపం కోసం
  rationale: సంఖ్యాకాండము 7లోని అర్పణల జాబితాలో ఇది నిర్దిష్టమైన బలి వర్గాన్ని సూచిస్తుంది. అందువల్ల నైతిక పాపం అనే నైరూప్య అర్థానికి పరిమితం చేయకుండా ఆచార సంబంధ భావాన్ని నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన జాబితా శైలిని, గౌరవప్రదమైన బైబిలు భాషను నిలిపింది. మూలంలోని వాక్యఖండ స్వభావానికి అనుగుణంగా చివర అర్ధవిరామం ఉంచబడింది.
