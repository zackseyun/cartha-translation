source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: te
  text: 'బలిపీఠాన్ని అభిషేకించిన రోజున ఇశ్రాయేలు నాయకులు[b] సమర్పించిన ప్రతిష్ఠార్పణ[a] ఇదే: వెండి పళ్లెములు పన్నెండు, వెండి గిన్నెలు పన్నెండు, బంగారు పాత్రలు పన్నెండు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “బలిపీఠ ప్రతిష్ఠ ఇదే.” అయితే ఈ సందర్భంలో ఆ ప్రతిష్ఠ కోసం సమర్పించిన కానుకల మొత్తం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు ప్రధానులు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం గుర్తింపు పొందిన గోత్ర నాయకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఈ మూడు పాత్రల పేర్లను “వెండి పాత్రలు,” “వెండి పళ్లాలు,” “బంగారు చెంచాలు/గరిటెలు” అని కూడా అనువదించవచ్చు; వాటి ఖచ్చితమైన ఆకారాల విషయంలో అనిశ్చితి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: బలిపీఠానికి ... సమర్పించిన ప్రతిష్ఠార్పణ ఇదే
  rationale: זֹאת అనే సూచక పదం యొక్క బలాన్ని ‘ఇదే’ నిలుపుతుంది. חֲנֻכָּה ఇక్కడ బలిపీఠ ప్రతిష్ఠ సందర్భంలో సమర్పించిన కానుకల సమాహారాన్ని సూచిస్తున్నందున ‘ప్రతిష్ఠార్పణ’ సందర్భానుకూలంగా, సంక్షిప్తంగా ఉంది.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: బలిపీఠానికి అభిషేకం చేసిన రోజున
  rationale: కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘దానికి’ అనే అస్పష్ట సర్వనామానికి బదులు బలిపీఠాన్ని స్పష్టంగా పేర్కొంటుంది.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులు సమర్పించిన
  rationale: מֵאֵת కానుకల మూలాన్ని సూచిస్తుంది. נְשִׂיאִים ఇక్కడ గోత్రాలకు ప్రాతినిధ్యం వహించిన గుర్తింపు పొందిన నాయకులు; ఆధునిక తెలుగులో ‘నాయకులు’ స్పష్టంగా ఉంది.
- source_word: קַעֲרֹת כֶּסֶף
  choice: వెండి పళ్లెములు
  rationale: קְעָרָה వెడల్పైన పళ్లెం లేదా పెద్ద పాత్రను సూచిస్తుంది; తరువాతి మִזְרָק పదంతో తేడా కనిపించేందుకు ‘పళ్లెములు’ ఎంచుకున్నాం.
- source_word: מִזְרְקֵי כֶסֶף
  choice: వెండి గిన్నెలు
  rationale: ఆరాధనా కర్మలో ఉపయోగించే గిన్నె లేదా పళ్లాన్ని సూచించే పదం; ‘గిన్నెలు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: כַּפּוֹת זָהָב
  choice: బంగారు పాత్రలు
  rationale: כַּף అరచేయి ఆకారంతో సంబంధమున్న చెంచా, గరిటె లేదా చిన్న పాత్రను సూచించగలదు. ఖచ్చితమైన ఆకారం అనిశ్చితంగా ఉన్నందున ప్రధాన పాఠంలో విస్తృతమైన ‘పాత్రలు’ వాడి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: పన్నెండు
  rationale: మూడు రకాల పాత్రల సంఖ్యను నేరుగా తెలుగులో అందిస్తుంది.
