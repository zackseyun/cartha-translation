translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. జాబితా లయను నిలుపుతూ ప్రతి వస్తువు తరువాత సంఖ్యను ఉంచాం. హీబ్రూ వాక్యంలో స్పష్టమైన కాలక్రియ లేకపోవడంతో ‘ఇదే’ అనే రూపం గతకాలం/వర్తమానకాలం మధ్య అనవసర నిర్ణయం చేయకుండా సూచక బలాన్ని కాపాడుతుంది.
