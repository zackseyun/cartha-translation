  naturalness: The register and inventory-style rhythm are natural modern Telugu. Changing the dative phrase to the direct-object form makes the temporal clause both clearer and more idiomatic. “ప్రతిష్ఠార్పణ” is acceptable in this formal cultic context.
  terminology: “బలిపీఠం,” “అభిషేకం,” and “నాయకులు” are suitable. The broad “బంగారు పాత్రలు” responsibly avoids overstating the precise form of כַּפּוֹת; the footnote supplies narrower alternatives. Footnote a appropriately explains the contextual sense of dedication as the summarized offerings.
