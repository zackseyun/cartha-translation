  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: te
  text: నాలుగవ రోజున రూబేను కుమారుల నాయకుడు[a] షెదేయూరు కుమారుడైన ఎలీసూరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధిపతి’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం అధికారిక గోత్ర నాయకుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: నాలుగవ రోజున
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గను సహజమైన ఆధునిక తెలుగులో ‘రోజున’గా, క్రమసంఖ్యను ‘నాలుగవ’గా అనువదించాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో ఇది గోత్రానికి అధికారికంగా ప్రాతినిధ్యం వహించే అధిపతిని సూచిస్తుంది; రాజవంశార్థాన్ని సూచించగల ‘రాజకుమారుడు’ కంటే ‘నాయకుడు’ స్పష్టంగా ఉంది.
- source_word: לִבְנֵי רְאוּבֵן
  choice: రూబేను కుమారుల
  rationale: לְ ఇక్కడ అనుబంధం లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. ‘రూబేను కుమారుల’ అనే రూపం హెబ్రీ కుటుంబ-గోత్ర వ్యక్తీకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֱלִיצוּר
  choice: ఎలీసూరు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: హెబ్రీ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు గుర్తింపు వాక్యరూపంలో తెలిపాం.
- source_word: שְׁדֵיאוּר
  choice: షెదేయూరు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
