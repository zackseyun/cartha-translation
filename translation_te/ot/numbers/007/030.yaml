translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే సంక్షిప్త జాబితా-శైలిని ఉపయోగించాం. వాక్యంలో నేరుగా ప్రతిబింబించిన లְ యొక్క అనుబంధ భావానికి ప్రత్యేక పాదసూచిక అవసరం లేదు; נָשִׂיא పదంలోని ముఖ్యమైన పదార్థ ప్రత్యామ్నాయాన్ని మాత్రమే సూచించాం.
