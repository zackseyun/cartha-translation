id: NUM.7.71
reference: Numbers 7:71
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: te
  text: 'శాంతి బలి కొరకు: రెండు పశువులు,[a] ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు. ఇది అమ్మీషద్దయి కుమారుడైన అహీయెజెరు యొక్క అర్పణ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహవాస బలి’ లేదా ‘క్షేమ బలి’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలిగా
  rationale: ఈ పదబంధం జాబితాలోని చివరి బలిని పరిచయం చేస్తుంది. ‘సమాధాన బలి’ హెబ్రీ ఆరాధనా పదానికి దగ్గరగా ఉండే, తెలుగులో గుర్తించదగిన సంక్షిప్త రూపం; ఇతర సాధ్యమైన భావాలను పాదసూచికలో ఉంచాం.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సమష్టిగా సూచిస్తుంది; మూలంలో లేని లింగాన్ని నిర్దిష్టం చేయకుండా ‘పశువులు’ అని అనువదించాం.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם బలుల జాబితాలో మగ గొర్రెలను స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన పదం ‘పొట్టేళ్లు’.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; ఆ లింగ నిర్దిష్టతను స్పష్టంగా నిలిపాం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు
  rationale: ‘ఒక సంవత్సరానికి చెందిన గొర్రెపిల్లలు’ అనే మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, బలికి సంబంధించిన వయస్సు వివరాన్ని నిలిపాం.
- source_word: זֶה קָרְבַּן
  choice: ఇది … అర్పించిన అర్పణ
  rationale: కథన సందర్భంలో పూర్తయిన సమర్పణను తెలుగులో సహజంగా తెలియజేయడానికి క్రియాత్మక నిర్మాణం వాడాం; קָרְבַּן యొక్క ‘అర్పణ’ భావాన్ని నిలిపాం.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: అమ్మీషద్దయి కుమారుడు అహీయెజెరు
  rationale: వ్యక్తి పేర్లను హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, בֶּן ను ‘కుమారుడు’గా నేరుగా వ్యక్తం చేశాం.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి పదంలోని భావ పరిధి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ హెబ్రీ పదం సమాధానం, సహవాసం, క్షేమం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సంప్రదాయానికి దగ్గరైన పదాన్ని ఉంచి, నిజమైన అర్థ విస్తృతిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆరాధనా శైలిని వాడాం. జాబితా సహజంగా చదవడానికి తెలుగులో అవసరమైన క్రియను మొదటి వాక్యాంతంలో చేర్చాం; మూలంలోని లింగ, వయస్సు వివరాలను కాపాడాం.
