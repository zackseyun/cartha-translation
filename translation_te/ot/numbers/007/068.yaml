translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతూ, హీబ్రూ అర్థలోపాన్ని పాదటిప్పణిలో వెల్లడించాం.
