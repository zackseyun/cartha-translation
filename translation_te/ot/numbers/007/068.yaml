translation:
  language: te
  text: పది షెకెలుల బరువున్న ఒక బంగారు పళ్లెం, ధూపద్రవ్యంతో నిండినది;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: గిన్నె
  rationale: సంఖ్యాకాండము 7లో ఇది ధూపద్రవ్యాన్ని ఉంచే చిన్న ఆచారపాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘చెంచా’ భోజనపరికరాన్ని సూచించే అవకాశం ఉన్నందున, పాత్ర భావాన్ని సహజంగా తెలిపే ‘గిన్నె’ ఎంచుకోబడింది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో ఏకీభవించే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది
  rationale: ఈ పునరావృత అర్పణ సూత్రంలో ప్రత్యక్షంగా చెప్పని బరువు ప్రమాణాన్ని సూచించే సంఖ్య.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సూచిస్తుంది; తెలుగులో నామవాచకానికి ముందు విశేషణరూపం సహజం.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెలుల బరువున్న
  rationale: హీబ్రూలో బరువు ప్రమాణం ప్రత్యక్షంగా లేదు. సంఖ్యాకాండము 7లోని పునరావృత అర్పణ సూత్రం ఆధారంగా ‘షెకెలులు’ మరియు ‘బరువున్న’ అని స్పష్టత కోసం పూరించబడ్డాయి.
- source_word: מְלֵאָה
  choice: నిండి ఉంది
  rationale: పాత్రలోని పదార్థాన్ని తెలిపే విధేయ విశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: అర్పణలో ఉపయోగించే సుగంధ పదార్థాన్ని ‘ధూపం’ కంటే నిర్దిష్టంగా సూచిస్తుంది.
