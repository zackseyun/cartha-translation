  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: te
  text: పన్నెండవ రోజున, నఫ్తాలి కుమారుల నాయకుడు ఏనాను కుమారుడైన అహీరా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: పన్నెండవ రోజున
  rationale: హీబ్రూ కాలసూచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో క్రమసంఖ్యతో వ్యక్తపరుస్తుంది; అధ్యాయమంతటా పునరావృతమయ్యే ‘రోజు’ సూత్రాన్ని కూడా నిలుపుతుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: గోత్ర సందర్భంలో గుర్తింపు పొందిన అధిపతి లేదా నాయకుడిని సూచిస్తుంది; ‘రాజకుమారుడు’ అనే రాజవంశ సంబంధమైన అపార్థాన్ని నివారిస్తుంది.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: నఫ్తాలి కుమారుల
  rationale: לְ ఇక్కడ సంబంధాన్ని సూచిస్తుంది; בְּנֵי అనే పుంలింగ బహువచన గోత్రపదాన్ని ‘కుమారులు’గా సూటిగా నిలుపుతుంది.
- source_word: אֲחִירַע
  choice: అహీరా
  rationale: వ్యక్తిపేరును అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేసింది.
- source_word: בֶּן עֵינָן
  choice: ఏనాను కుమారుడైన
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధవాచక రూపంలో అందిస్తుంది.
theological_decisions:
- issue: బְּנֵי అనే లింగసూచక గోత్రపదం
  choice: నఫ్తాలి కుమారులు
  alternative: నఫ్తాలి సంతతివారు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని, దాని ప్రామాణిక గోత్ర designation‌ను తటస్థీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని సంక్షిప్త జాబితా-శైలిని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు విధేయాన్ని చివర ఉంచకుండా నామవాచక వాక్యంగా ఇచ్చింది.
