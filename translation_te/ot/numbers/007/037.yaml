translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హెబ్రీ జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు బరువు వివరాలను పాత్రలకు ముందు విశేషణాలుగా అమర్చాం. ‘షెకెలు’ అనే చారిత్రక కొలమానాన్ని లిప్యంతరీకరించి, దాని ప్రమాణార్థాన్ని పాదటిప్పణిలో వివరించాం.
