  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ: పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం నూట ముప్పై షెకెళ్ల బరువుగల ఒక వెండి పళ్లెం[a], డెబ్బై షెకెళ్ల బరువుగల ఒక వెండి గిన్నె[b]; ఆ రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన సన్నని పిండితో నిండి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెడల్పాటి గిన్నె’; హెబ్రీ పదం קַעֲרָה పళ్లెం, లోతు తక్కువ గిన్నె, లేదా పాత్రను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చిలకరింపు గిన్నె’; హెబ్రీ పదం מִזְרָק ఇతర సందర్భాల్లో ఆరాధనా కర్మలో చిలకరించడానికి ఉపయోగించే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధనలో సమర్పించే కానుకను సూచించే קָרְבָּןకు బలిసంబంధ సందర్భంలో సహజమైన, విస్తృతమైన తెలుగు సమానం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה పళ్లెం, పెద్ద గిన్నె, లేదా లోతు తక్కువ పాత్రను సూచించవచ్చు. జాబితా సందర్భంలో ‘పళ్లెం’ సహజంగా ఉంది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెళ్ల బరువుగల
  rationale: ‘దాని బరువు నూట ముప్పై’ అనే హెబ్రీ నామవాచక నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా తెలిపింది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק ఆరాధనా సేవలో ఉపయోగించే గిన్నె లేదా పాత్ర. దాని ప్రత్యేక వినియోగాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా సాధారణ పాత్రపదాన్ని ఎంచుకున్నాం.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెళ్ల బరువుగల
  rationale: ఇది రెండో పాత్ర బరువును తెలుపుతుంది; తెలుగులో స్పష్టత కోసం ‘బరువుగల’ అని పునరుక్తి చేశాం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం తూకానికి ఉపయోగించిన పవిత్రస్థల ప్రామాణిక షెకెలును సూచిస్తుంది. ‘ప్రమాణం ప్రకారం’ దాని కార్యార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: שְׁנֵיהֶם
  choice: ఆ రెండూ
  rationale: ముందు చెప్పిన రెండు వెండి పాత్రలను స్పష్టంగా సూచిస్తూ హెబ్రీ ద్వయార్థాన్ని నిలుపుతుంది.
- source_word: מְלֵאִים
  choice: నిండి ఉన్నాయి
  rationale: రెండు పాత్రలలోని పదార్థాన్ని తెలిపే విధేయ విశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలులలో ఉపయోగించే సన్నగా దంచిన ఉత్తమ పిండిని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో మిశ్రమం చేసిన సిద్ధీకరణను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణ’ సాధారణ పాఠకునికి స్పష్టంగా ఉంది.
