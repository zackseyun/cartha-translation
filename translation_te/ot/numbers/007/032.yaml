translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుతూ సహజంగా అనువదించబడింది. ‘ధూపపాత్ర’ అనే సందర్భస్పష్ట పదాన్ని వాడి, మూలంలోని కొలతా సంక్షిప్తతను పాదటిప్పణిలో భద్రపరచాం.
