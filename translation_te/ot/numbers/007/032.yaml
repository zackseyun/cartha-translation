  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: te
  text: పది షెకెలుల బరువుగల ఒక బంగారు పాత్ర[a], ధూపద్రవ్యంతో నిండినది;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక పాత్ర, పది, బంగారం, ధూపద్రవ్యంతో నిండినది’ అని ఉంది. చుట్టుపక్కల వచనాల్లో పునరావృతమయ్యే అర్పణ జాబితాను బట్టి ‘షెకెలుల బరువుగల’ అని పాఠ్యంలో చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: ధూపపాత్ర
  rationale: ఇక్కడ మానవ అరచేయి కాదు, ధూపద్రవ్యాన్ని ఉంచే చిన్న ఆరాధనా పాత్ర ఉద్దేశించబడింది. సందర్భానికి అనుగుణంగా ‘ధూపపాత్ర’ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌ను విశేషించే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది షెకెలుల బరువుగల
  rationale: హీబ్రూ మూలంలో ‘పది’ మాత్రమే ఉన్నా, చుట్టుపక్కల పునరావృత అర్పణ జాబితా ప్రకారం షెకెలుల బరువు భావించబడుతుంది. తెలుగులో కొలతను స్పష్టం చేయడానికి దానిని పాఠ్యంలో చేర్చాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సూచిస్తుంది; తెలుగులో ‘బంగారు పాత్ర’ సహజమైన, సంక్షిప్తమైన రూపం.
- source_word: מְלֵאָה
  choice: నిండి ఉంది
  rationale: పాత్రలోని పదార్థాన్ని తెలిపే స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: యాజక, ప్రత్యక్ష గుడార ఆరాధనా సందర్భంలో ఉపయోగించే సుగంధ అర్పణ పదార్థాన్ని స్పష్టంగా సూచిస్తుంది.
