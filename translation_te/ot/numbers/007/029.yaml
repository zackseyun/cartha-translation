id: NUM.7.29
reference: Numbers 7:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: te
  text: సమాధాన బలుల[a] కోసం రెండు పశువులు, ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు. ఇది హేలోను కుమారుడైన ఎలీయాబు అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: సమాధాన బలుల కోసం
  rationale: ఈ ఉపసర్గలు ముందటి వచనంలోని జాబితాను కొనసాగిస్తూ బలి వర్గాన్ని పరిచయం చేస్తున్నాయి. שְׁלָמִים అనే ఆచారపరమైన పదానికి గుర్తించదగిన సంప్రదాయ తెలుగు సమానార్థకంగా ‘సమాధాన బలులు’ ఎంచుకోబడింది; ఇతర భావ ఛాయలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר పశువులను సూచించే సమూహవాచకం; మూలంలో లింగం నిర్దిష్టంగా లేనందున ‘ఎద్దులు’ అని కాకుండా సాధారణమైన ‘పశువులు’ అని అనువదించబడింది.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם బలి జాబితాలో మగ గొర్రెలను స్పష్టంగా సూచిస్తుంది; సహజమైన ఆధునిక తెలుగు పదం ‘పొట్టేళ్లు’.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; మూలంలోని లింగ భేదం నిలుపబడింది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים బలి సందర్భంలో మగ గొర్రెపిల్లలను సూచిస్తుంది; בְּנֵי שָׁנָה అనే వయస్సు నుడికారాన్ని సహజంగా ‘ఏడాది వయసున్న’ అని అందించాం.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పణ
  rationale: హీబ్రూ సూచక నిర్మాణంలోని సంక్షిప్త, వర్తమానసదృశ రూపాన్ని తెలుగులో ‘ఇది ... అర్పణ’గా నిలిపాం; కָרְבַּן దేవుని దగ్గరకు తీసుకొచ్చే అర్పణకు సాధారణ పదం.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: హేలోను కుమారుడు ఏలీయాబు
  rationale: తెలుగు బైబిలు పేర్లలో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించి, హీబ్రూ పితృనామ సంబంధాన్ని సహజ తెలుగు పదక్రమంలో అందించాం.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదంలోని భావవ్యాప్తి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదం సమాధానం, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ప్రధాన పాఠంలో సంప్రదాయంగా గుర్తించదగిన పదాన్ని ఉంచి, మూలంలోని భావ విస్తృతిని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన బలి-జాబితా శైలి. ముందటి వచనం నుంచి కొనసాగే וְ భావం తెలుగు ప్రవాహంలో ప్రత్యేక ‘మరియు’ లేకుండానే కొనసాగింపుగా వ్యక్తమైంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
