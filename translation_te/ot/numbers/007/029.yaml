    issue: The draft adds “అర్పించాడు” after the animal list.
    rationale: Numbers 7:29 contains no finite verb for Eliab’s act of offering; it continues the list introduced in the preceding verse. Adding a verb slightly reshapes the syntax and exceeds the verse’s wording.
  - severity: medium
    issue: Footnote marker [a] is attached after “రెండు పశువులు.”
    rationale: The footnote discusses “సమాధాన బలులు,” not cattle; the marker must immediately follow the term it qualifies.
  - severity: low
