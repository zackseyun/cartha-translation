revisions:
- from: 'అతని అర్పణ: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]; ఆ రెండూ నూనె కలిపిన మెత్తని పిండితో ధాన్యార్పణ కోసం నింపబడ్డాయి.[c]'
  to: 'అతని అర్పణ ఇది: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం[c] డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]; ఆ రెండూ నూనె కలిపిన మెత్తని పిండితో ధాన్యార్పణ కోసం నిండి ఉన్నాయి.'
