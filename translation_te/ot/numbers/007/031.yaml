  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ ఇది: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం[c] డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]; ఆ రెండూ నూనె కలిపిన మెత్తని పిండితో ధాన్యార్పణ కోసం నిండి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెండి తట్టు’; హీబ్రూ పదం ఆచారంలో ఉపయోగించే వెడల్పైన పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వెండి బేసిన్’; హీబ్రూ పదం బలి సంబంధ వినియోగంతో ముడిపడిన పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘పరిశుద్ధస్థలపు షెకెలు’ అంటే పరిశుద్ధస్థలంలో అమలైన ప్రామాణిక తూకం ప్రకారం అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధన సంబంధ సందర్భంలో సమర్పించే కానుకను సూచించే קָרְבָּןకు ‘అర్పణ’ సహజమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה సాధారణంగా వెడల్పైన, లోతు తక్కువగల పాత్రను సూచిస్తుంది; ‘పళ్లెం’ ఆ ఆకృతిని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: మూలంలోని ‘దాని బరువు నూట ముప్పై’ అనే భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק బలి ఆచారంలో ఉపయోగించే పాత్ర; ఆధునిక తెలుగులో ‘గిన్నె’ స్పష్టంగా ఉంటుంది, దాని ఆచార సంబంధ వినియోగాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: ఈ సంఖ్య రెండవ పాత్ర బరువును తెలుపుతుందని తెలుగులో స్పష్టంగా చేస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది ఆరాధనా స్థలంలో అమలైన అధికారిక తూకపు ప్రమాణమని తెలియజేస్తూ, ‘షెకెలు’ అనే మూల కొలమానాన్ని నిలుపుతుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ ... నింపబడ్డాయి
  rationale: రెండు పాత్రలను స్పష్టంగా సూచించే మూలంలోని బహువచన భావాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణల్లో వాడే మెత్తగా తయారుచేసిన నాణ్యమైన పిండిని సూచిస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: పిండిని నూనెతో కలిపిన స్థితిని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ఇది నిర్దిష్టం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. కొలమానమైన ‘షెకెలు’ను లిప్యంతరీకరించి, దాని ప్రమాణ భావాన్ని పాఠ్యంలో స్పష్టం చేశాం. మూలంలోని జాబితా నిర్మాణం మరియు రెండు పాత్రల సంయుక్త నింపుదల నిలుపబడ్డాయి.
