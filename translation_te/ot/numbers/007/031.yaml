    issue: పాదసూచిక c గుర్తు స్థానము
    rationale: పరిశుద్ధస్థలపు షెకెలు ప్రమాణాన్ని వివరించే పాదసూచిక గుర్తు ప్రస్తుతం వాక్యాంతంలో ఉంది. దానిని ‘ప్రమాణం ప్రకారం’ వెంట ఉంచడం ద్వారా దాని సూచన స్పష్టమవుతుంది.
