    rationale: మూలంలోని מְלֵאִים ‘నిండియున్నవి/నిండినవి’ అనే స్థితిని తెలుపుతుంది. ‘నిండి ఉన్నాయి’ అనేది అనవసరమైన నింపిన చర్యను సూచించకుండా మూలానికి మరింత దగ్గరగా ఉంటుంది.
