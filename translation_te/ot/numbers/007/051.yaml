translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. వాక్యం ముందున్న జాబితాలో కొనసాగుతున్న భాగం కావడంతో చివర సెమీకోలన్ ఉంచబడింది.
