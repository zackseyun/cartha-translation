  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: te
  text: దహనబలి కోసం మందలోని ఒక కోడెను, ఒక పొట్టేలును, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్లను;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: మందలోని ఒక కోడెను
  rationale: פַּר అనేది మగ పశువును సూచిస్తుంది; בֶּן־בָּקָר దాన్ని పశువుల మందకు చెందినదిగా పేర్కొనే హీబ్రూ ప్రయోగం. ‘మందలోని కోడె’ అనేది మూలంలోని రెండు అంశాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אַיִל
  choice: ఒక పొట్టేలును
  rationale: బలుల సందర్భంలో ఇది వయోజన మగ గొర్రెకు వాడే సాధారణ పదం; ‘పొట్టేలు’ దానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: כֶּבֶשׂ
  choice: ఒక మగ గొర్రెపిల్లను
  rationale: ఈ పదం గొర్రెపిల్లను, సాధారణంగా బలి సందర్భంలో మగ గొర్రెపిల్లను సూచిస్తుంది. లింగాన్ని స్పష్టంగా తెలుపడం మూలానికి దగ్గరగా ఉంటుంది.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: అక్షరార్థంగా ‘దాని సంవత్సరపు కుమారుడు’ అనే ఈ హీబ్రూ నుడికారం ఒక సంవత్సరం వయసున్న జంతువును సూచిస్తుంది; ఎంపిక చేసిన రూపం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలి వర్గాన్ని సూచించే స్థిరమైన ఆచార పదం. ‘దహనబలి’ దాని అర్థాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి జంతువు సంఖ్యను తెలిపే పునరుక్త సంఖ్యావాచకాన్ని జాబితాలో ప్రతి అంశంతో నిలిపాం.
