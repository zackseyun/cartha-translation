id: NUM.7.1
reference: Numbers 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: te
  text: మోషే ప్రత్యక్ష గుడారాన్ని[a] నిలబెట్టడం ముగించిన రోజున, అతడు దానికి అభిషేకం చేసి, దానినీ దాని సామగ్రి అంతటినీ, బలిపీఠాన్నీ దాని ఉపకరణాలన్నిటినీ ప్రతిష్ఠించాడు; వాటికి అభిషేకం చేసి వాటిని ప్రతిష్ఠించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే ప్రత్యక్ష గుడారాన్ని నిలబెట్టడం ముగించినప్పుడు.” హీబ్రూలోని కాలప్రయోగాన్ని ఈ విధంగానూ సహజంగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[ప్రత్యేక పదంగా అనువదించకుండా కాలవాక్యంలో సహజంగా వ్యక్తీకరించబడింది]'
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని తెలుగులో ‘జరిగింది’ అని యాంత్రికంగా చేర్చడం అసహజంగా ఉంటుంది; సంఘటనను నేరుగా కాలవాక్యంతో ప్రారంభించడం అదే కథన విధిని సహజంగా నెరవేరుస్తుంది.
- source_word: בְּיוֹם כַּלּוֹת
  choice: ముగించిన రోజున
  rationale: ‘ఆ రోజున’ అనే హీబ్రూ కాలప్రయోగాన్ని నిలుపుతూ, infinitive construct భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהָקִים
  choice: నిలబెట్టడం
  rationale: హిఫిల్ రూపం ఇక్కడ ప్రత్యక్షంగా గుడార మందిరాన్ని ఏర్పాటు చేయడం లేదా నిలబెట్టడం అనే భౌతిక చర్యను సూచిస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: అరణ్యకాలపు దేవుని నివాస గుడారాన్ని సూచించే משכןకు సందర్భానుకూలమైన, సాధారణ పాఠకులకు సులభమైన పదం; పాదటిప్పణిలో మరింత స్పష్టమైన ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: וַיִּמְשַׁח
  choice: అభిషేకం చేశాడు
  rationale: నూనెతో పవిత్ర సేవకు అంకితం చేసే ఆచార చర్యను కచ్చితంగా సూచిస్తుంది.
- source_word: וַיְקַדֵּשׁ
  choice: ప్రతిష్ఠించాడు
  rationale: నైతిక మార్పు కంటే పవిత్ర వినియోగం కోసం ప్రత్యేకపరచే ఆచార భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతటికీ
  rationale: మందిరానికి సంబంధించిన విస్తృత శ్రేణి వస్తువులను సూచించేందుకు ‘సామగ్రి’ తగిన విస్తృత పదం.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: మזבחకు స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: כָּל כֵּלָיו
  choice: దాని ఉపకరణాలన్నిటికీ
  rationale: రెండవ సందర్భం ప్రత్యేకంగా బలిపీఠంతో వాడే పరికరాలను సూచిస్తున్నందున ‘ఉపకరణాలు’ మరింత ఖచ్చితమైనది.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: అతడు వాటికి అభిషేకం చేసి వాటిని ప్రతిష్ఠించాడు
  rationale: హీబ్రూలోని పునరుక్త సమాపక బహువచన నిర్మాణాన్ని తొలగించకుండా నిలిపి, పేర్కొన్న పవిత్ర వస్తువుల సమూహాన్ని సూచించే అస్పష్టతను కాపాడుతుంది.
theological_decisions:
- issue: ఆరాధనా సంబంధమైన పవిత్రత పదజాలం
  choice: ప్రతిష్ఠించాడు
  alternative: పవిత్రపరిచాడు
  rationale: ఇక్కడ నిర్జీవమైన మందిరం, బలిపీఠం, వాటి సామగ్రి పవిత్ర సేవ కోసం ప్రత్యేకపరచబడుతున్నాయి. ‘ప్రతిష్ఠించాడు’ ఆచారపరమైన అంకిత భావాన్ని తెలియజేస్తూ, నైతిక శుద్ధి భావాన్ని అనవసరంగా రప్పించదు.
- issue: చివరి బహువచన సర్వనామం యొక్క పరిధి
  choice: ‘వాటికి/వాటిని’ అనే విస్తృత సూచనను అలాగే ఉంచడం
  alternative: బలిపీఠం మరియు దాని ఉపకరణాలకు మాత్రమే స్పష్టంగా పరిమితం చేయడం
  rationale: హీబ్రూ బహువచన ప్రత్యయాలు తక్షణ పూర్వపదాలైన బలిపీఠం, దాని ఉపకరణాలను సూచించగలవు; అంతకుముందు పేర్కొన్న పవిత్ర వస్తువులన్నిటినీ సమాపకంగా సూచించే అవకాశమూ ఉంది. అనువాదం ఈ నిజమైన పరిధి అస్పష్టతను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మందిరం’ ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ఉంది; అరణ్య ఆరాధనా గుడారమనే సందర్భార్థాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది. హీబ్రూ చివరి సమాపక పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
