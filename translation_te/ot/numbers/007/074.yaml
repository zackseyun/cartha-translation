translation:
  language: te
  text: ధూపద్రవ్యంతో నిండిన పది షెకెల్ల బరువుగల ఒక బంగారు పాత్ర[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదక్షరంగా, “ఒక బంగారు పాత్ర, పది బంగారం, ధూపద్రవ్యంతో నిండినది.” మూలంలో “షెకెల్లు” అనే బరువు ప్రమాణం చెప్పబడలేదు; ఈ సందర్భంలో పునరావృతమయ్యే అర్పణ వివరణను బట్టి అది చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: పాత్ర
  rationale: ఈ ప్రత్యక్ష గుడారపు అర్పణల సందర్భంలో ఇది అరచేయి లేదా సాధారణ చెంచా కాకుండా ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పాత్ర’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో ఏకీభవించే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది
  rationale: సందర్భం ద్వారా గ్రహించాల్సిన బరువు ప్రమాణాన్ని సూచించే సంఖ్య.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర ఏ పదార్థంతో చేయబడిందో తెలిపే విశేషణార్థక ప్రయోగం; తెలుగులో ‘బంగారు పాత్ర’ సహజమైన నిర్మాణం.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెల్ల బరువుగల
  rationale: హీబ్రూలో బరువు ప్రమాణం ప్రత్యక్షంగా లేకపోయినా, ఈ అధ్యాయంలోని పునరావృత అర్పణ సూత్రం ఆధారంగా ‘షెకెల్లు’ అర్థగతంగా ఉంది. తెలుగులో బరువు అని స్పష్టం చేయడం అపార్థాన్ని నివారిస్తుంది.
- source_word: מְלֵאָה
  choice: నిండిన
  rationale: పాత్రలోని పదార్థాన్ని తెలిపే సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: పరిశుద్ధ స్థల ఆరాధనలో ఉపయోగించే సుగంధ అర్పణ పదార్థాన్ని స్పష్టంగా సూచిస్తుంది.
