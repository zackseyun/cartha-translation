translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా/అర్పణ వివరణకు తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని సంక్షిప్త నిర్మాణాన్ని కాపాడుతూ, అంతర్భూతమైన బరువు ప్రమాణాన్ని పాఠ్యంలో స్పష్టంచేసి అడుగుటపాలో మూలరూపాన్ని తెలియజేశాం.
