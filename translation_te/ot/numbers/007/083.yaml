id: NUM.7.83
reference: Numbers 7:83
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: te
  text: 'సమాధాన బలిగా[a]: రెండు పశువులు, ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు. ఇది ఏనాను కుమారుడైన అహీరా అర్పణ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులు” లేదా “క్షేమ బలులు.”
    reason: హీబ్రూ הַשְּׁלָמִים అనే బలి పదానికి సాధ్యమైన పదార్థ ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలుల కోసం
  rationale: జాబితాలోని తదుపరి బలి విభాగాన్ని సహజమైన తెలుగులో సూచిస్తుంది. זֶבַח అనే బలి భావాన్ని నిలుపుతూ, שְׁלָמִים అనే ఆచార సంబంధ పదానికి సంప్రదాయబద్ధమైన ‘సమాధాన’ను వాడింది.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר సమష్టి అర్థంలో పశువులను సూచిస్తుంది; మూలంలో లింగం స్పష్టంగా చెప్పనందున ‘ఎద్దులు’ అని ప్రత్యేకీకరించలేదు.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִים ప్రత్యేకంగా మగ గొర్రెలను సూచిస్తుంది; ‘పొట్టేళ్లు’ ఆధునిక తెలుగులో సహజమైన, నిర్దిష్టమైన పదం.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתּוּדִים మగ మేకలను నిర్దిష్టంగా సూచిస్తుంది; లింగ సూచనను స్పష్టంగా నిలిపింది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים లోని మగ లింగాన్ని, בְּנֵי שָׁנָה లోని వయస్సును రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పణ
  rationale: పునరావృతమయ్యే ముగింపు గుర్తింపు సూత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది; קָרְבַּן కు ‘అర్పణ’ సహజమైన ఆచార సంబంధ పదం.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: ఏనాను కుమారుడు అహీరా
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చి, వ్యక్తినామాలను లిప్యంతరీకరించింది.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి పదంలోని భావవ్యాప్తి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదం సమాధానం, సహవాసం, క్షేమం వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ప్రధాన పాఠ్యంలో పరిచితమైన ‘సమాధాన బలులు’ను ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చి అసలు పదంలోని భావవ్యాప్తిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
