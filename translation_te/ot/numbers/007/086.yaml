translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. బరువు ప్రమాణానికి సంబంధించిన సాంకేతిక పదం ‘షెకెలు’ నిలుపబడింది; כַּפּוֹת ఆకారాన్ని మూలం ఖచ్చితంగా నిర్ణయించనందున ప్రధాన పాఠంలో విస్తృతార్థకమైన ‘పాత్రలు’ ఎంచుకొని ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
