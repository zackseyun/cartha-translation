source:
  edition: WLC
  text: כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַ/כַּ֖ף בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ כָּל זְהַ֥ב הַ/כַּפּ֖וֹת עֶשְׂרִ֥ים וּ/מֵאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: te
  text: ధూపద్రవ్యంతో నిండిన బంగారు పాత్రలు పన్నెండు[a]. పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం ఒక్కొక్క పాత్ర బరువు పది షెకెలులు. ఆ పాత్రల బంగారం మొత్తం నూట ఇరవై షెకెలులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గిన్నెలు,’ ‘పళ్లాలు’; సంప్రదాయ అనువాదాల్లో ‘చెంచాలు.’ ఇవి ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: పాత్రలు
  rationale: ఈ సందర్భంలో ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాత్రలు’ సహజంగా ఉండి, వస్తువు నిర్దిష్ట ఆకారాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్రలు తయారైన పదార్థాన్ని సహజమైన తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: పన్నెండు
  rationale: పాత్రల మొత్తం సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: ధూపద్రవ్యంతో నిండిన
  rationale: పాత్రలు ధూపం వేయడానికి ఉపయోగించే సుగంధ మిశ్రమంతో నిండివున్నాయని మూలంలోని భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: ఒక్కొక్క పాత్ర బరువు పది షెకెలులు
  rationale: సంఖ్య పునరుక్తి పంపిణీ భావాన్ని, అంటే ప్రతి పాత్రకు పది షెకెలుల చొప్పున అని సూచిస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఆరాధనా స్థలంలో అమలైన అధికారిక బరువు ప్రమాణాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘పరిశుద్ధ స్థలం’ మూలంలోని cultic సంబంధాన్ని నిలుపుతుంది.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: ఆ పాత్రల బంగారం మొత్తం
  rationale: అన్ని పాత్రల్లో ఉన్న బంగారం యొక్క సమగ్ర బరువును సహజమైన తెలుగులో సంగ్రహిస్తుంది.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: నూట ఇరవై షెకెలులు
  rationale: మూలంలోని 120 అనే మొత్తాన్ని ఇస్తూ, వెంటనే ముందున్న బరువు ప్రమాణం ఆధారంగా ‘షెకెలులు’ను స్పష్టత కోసం పునరుద్ఘాటిస్తుంది.
