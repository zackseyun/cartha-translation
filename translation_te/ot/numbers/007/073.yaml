  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలిని అనుసరించాం. ‘షెకెలు’ అనే ప్రాచీన బరువు ప్రమాణాన్ని అనువదించకుండా ఉంచి, వాక్యంలో దాని ప్రమాణ స్వభావాన్ని స్పష్టం చేశాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
