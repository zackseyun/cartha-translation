source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ: నూట ముప్పై షెకెలుల బరువున్న ఒక వెండి పళ్లెం[a], డెబ్బై షెకెలుల బరువున్న ఒక వెండి గిన్నె, పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం[b]; ఆ రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన సన్నని పిండితో నిండి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెండి తట్టు’; కַעֲרָה పరిశుద్ధస్థల సామగ్రిలో వాడే లోతు తక్కువగల వెండి పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పరిశుద్ధస్థలపు షెకెలు ప్రకారం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం పవిత్ర స్థలంలో పాటించే బరువు ప్రమాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధనా సందర్భంలో దేవుని సమక్షానికి తీసుకువచ్చే సమర్పణను సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదబంధం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה లోతు తక్కువగల పాత్రను సూచిస్తుంది; జాబితా సందర్భంలో ‘పళ్లెం’ సహజంగా సరిపోతుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: మూలంలోని పాత్ర బరువును తెలుగులో స్పష్టమైన విశేషణ పదబంధంగా వ్యక్తపరుస్తుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק ఆచార సంబంధమైన పాత్ర; ‘గిన్నె’ ఆధునిక తెలుగులో స్పష్టంగా ఉండగా, దాని ఆచార వినియోగాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: రెండవ పాత్ర బరువును మొదటి పాత్రతో సమాంతరంగా, సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది పవిత్ర స్థలంలో వాడే నిర్దిష్ట బరువు ప్రమాణమని స్పష్టపరుస్తూ మూలార్థాన్ని కాపాడుతుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ ... నిండి ఉన్నాయి
  rationale: రెండు వెండి పాత్రలకూ వర్తించే మూలంలోని స్పష్టమైన సూచనను నిలుపుతుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలులలో ఉపయోగించే సన్నగా తయారుచేసిన నాణ్యమైన పిండిని సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెను పిండితో కలిపిన స్థితిని సరళంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה సాధారణ అర్పణకన్నా ప్రత్యేకమైన ధాన్యార్పణను సూచిస్తుంది.
