source:
  edition: WLC
  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]. ఆ రెండూ నూనె కలిపిన సన్నని పిండితో ధాన్యార్పణ కోసం నింపబడి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తట్టి’; కַעֲרָה లోతు తక్కువగా ఉండే వెడల్పాటి పాత్ర.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెండి బేసిన్’; מִזְרָק ఆచార సంబంధమైన పాత్రను సూచించే పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: కָרְבָּן ఆరాధనా సందర్భంలో దేవుని సన్నిధికి తీసుకువచ్చే అర్పణను సూచిస్తుంది. జాబితా శైలికి సహజంగా ఉండేందుకు తెలుగులో నామవాచక వాక్య నిర్మాణం వాడబడింది.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה వెడల్పుగా, లోతు తక్కువగా ఉండే పాత్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పళ్లెం’ దాని ఆకారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: హీబ్రూ పాత్ర బరువును పేర్కొంటుంది. తెలుగు వాక్యప్రవాహంలో విశేషణ రూపం సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק ఆచార సంబంధమైన పాత్ర. ఈ వచనంలో దాని ప్రత్యేక వినియోగం చెప్పబడనందున దాన్ని జోడించకుండా సాధారణమైన ‘గిన్నె’ ఎంచుకోబడింది.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: ఈ సంఖ్య వెండి గిన్నె బరువును సూచిస్తుంది; తెలుగులో సంబంధాన్ని స్పష్టంగా చూపేందుకు ‘బరువుగల’ పునరుక్తి చేయబడింది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం బరువును కొలిచే ఆరాధనా ప్రమాణాన్ని సూచిస్తుంది. ‘ప్రమాణం ప్రకారం’ దాని కొలమాన భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ ... నింపబడి ఉన్నాయి
  rationale: ద్వివచన సూచనను ‘ఆ రెండూ’ స్పష్టంగా నిలుపుతుంది. పాత్రలు పిండితో నిండిన స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: సֹלֶת అర్పణల్లో ఉపయోగించే సన్నగా చేసిన నాణ్యమైన పిండిని సూచిస్తుంది; ‘మెత్తని పిండి’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: నూనెతో కలపబడిన పిండిని సూచించే కర్మణి భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యార్పణను సూచిస్తుంది; విస్తృతమైన ‘అర్పణ’ కంటే ఈ ఎంపిక ఖచ్చితమైనది.
