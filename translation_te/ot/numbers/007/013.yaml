translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ తెలుగు సహజత్వం కోసం బరువు సూచనలను విశేషణ రూపంలో అమర్చాం. ‘షెకెలు’ అనే ప్రాచీన కొలమానాన్ని మార్చకుండా ఉంచాం.
