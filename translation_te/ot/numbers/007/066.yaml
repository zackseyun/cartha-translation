  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָ/עֲשִׂירִ֔י נָשִׂ֖יא לִ/בְנֵ֣י דָ֑ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/066.yaml
  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: te
  text: 'పదవ రోజున దాను కుమారుల నాయకుడు అమ్మీషద్దయి కుమారుడైన అహీయెజెరు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: పదవ రోజున
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గను తెలుగులో సహజమైన ‘రోజున’తో, క్రమసంఖ్యను ‘పదవ’గా అనువదించాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ ఈ పదం గోత్రానికి గుర్తింపుపొందిన ప్రతినిధి లేదా అధిపతిని సూచిస్తుంది; రాజరిక భావం కలిగించే పదం కంటే ‘నాయకుడు’ స్పష్టమైన ఆధునిక సమానార్థకం.
- source_word: לִבְנֵי דָן
  choice: దాను కుమారుల
  rationale: ఈ నిర్మాణం నాయకుడు ప్రాతినిధ్యం వహించే సమూహాన్ని గుర్తిస్తుంది; בְּנֵי లోని కుటుంబ సంబంధ వ్యక్తీకరణను ‘కుమారులు’గా నిలిపాం.
- source_word: אֲחִיעֶזֶר
  choice: అహీయెజెరు
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ పితృనామ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַמִּישַׁדָּי
  choice: అమ్మీషద్దయి
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని వాక్యాంత కోలన్ భావాన్ని తదుపరి అర్పణల జాబితాకు పరిచయంగా నిలిపాం.
