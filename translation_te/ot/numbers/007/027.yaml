  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/027.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: te
  text: పశువుల మందలోని ఒక ఎద్దు[a], ఒక పొట్టేలు, ఒక సంవత్సరం వయసున్న ఒక మగ గొర్రెపిల్ల[b], దహనబలిగా;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక ఎద్దు, పశువుల మంద కుమారుడు.’ ఈ హెబ్రీయ నుడికారం పశువుల మందకు చెందిన ఎద్దును సూచిస్తుంది; కొన్నిసార్లు దీనిని యువ ఎద్దుగా కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని సంవత్సరపు కుమారుడైన ఒక మగ గొర్రెపిల్ల’; అంటే ఒక సంవత్సరం వయసున్న లేదా తన మొదటి సంవత్సరంలో ఉన్న మగ గొర్రెపిల్ల.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: కోడెదూడ
  rationale: ఇది మందలోని మగ పశువును సూచించే హెబ్రీయ నుడికార ప్రయోగం. బలుల సందర్భంలో సహజమైన ఆధునిక తెలుగు పదంగా ‘కోడెదూడ’ను ఎంచుకున్నాం.
- source_word: אֶחָד
  choice: ఒక
  rationale: బలుల జాబితాలో ప్రతి జంతువునూ విడివిడిగా లెక్కించే మూలపాఠ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలికి అర్పించే వయోజన మగ గొర్రెను సూచించే సహజమైన తెలుగు పదం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ హెబ్రీయ పదం మగ గొర్రెపిల్లను నిర్దిష్టంగా సూచిస్తుంది; బలి సందర్భంలోని లింగ నిర్దిష్టతను నిలిపాం.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసున్న
  rationale: అక్షరార్థంగా ‘దాని సంవత్సరపు కుమారుడు’; జంతువు ఒక సంవత్సరం వయసులో లేదా మొదటి సంవత్సరంలో ఉన్నదనే వయోనిర్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: పూర్తిగా దహనం చేసే బలిని సూచించే ప్రామాణిక బైబిలు తెలుగు పదప్రయోగం; జాబితాలోని ఉద్దేశాన్ని సంక్షిప్తంగా తెలుపుతుంది.
