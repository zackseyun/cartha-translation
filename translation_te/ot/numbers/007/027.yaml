    issue: ‘కోడెదూడ’ adds a calf/young-animal nuance to פַּר.
    rationale: פַּר denotes a bull; while the construct phrase classifies it as a bovine from the herd, it does not require the Telugu term for a calf. ‘ఎద్దు’ preserves the source meaning without unnecessary age narrowing.
  - severity: low
