  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితా శైలిని మరియు పదేపదే వచ్చే ‘ఒక’ అనే సంఖ్యను నిలుపుతూ అనువదించబడింది. ‘కోడెదూడ,’ ‘పొట్టేలు,’ ‘మగ గొర్రెపిల్ల,’ ‘దహనబలి’ వంటి సాధారణంగా అర్థమయ్యే గౌరవప్రదమైన పదాలు వాడబడ్డాయి.
