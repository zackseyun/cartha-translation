  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: te
  text: దహనబలి కోసం పశుమందలోని ఒక ఎద్దు,[a] ఒక పొట్టేలు, ఒక సంవత్సరం వయసున్న ఒక మగ గొర్రెపిల్ల;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక యువ ఎద్దు, ఒక పొట్టేలు, తన మొదటి సంవత్సరంలో ఉన్న ఒక మగ గొర్రెపిల్ల—దహనబలి కోసం.” హీబ్రూలో బֶּן־בָּקָר అనే పదబంధం పశుమందకు చెందిన పశువును, బֶּן־שְׁנָתוֹ అనే పదబంధం మొదటి సంవత్సరంలో ఉన్న జంతువును సూచించే నుడికారాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: మందలోనుండి ఒక ఎద్దు
  rationale: פַּר బలిసంబంధ సందర్భంలో మగ పశువును సూచిస్తుంది; בֶּן־בָּקָר అనే హీబ్రూ నుడికారం అది పశుమందకు చెందిన పశువని తెలుపుతుంది. తెలుగులో సహజంగా ఉండేలా రెండింటినీ కలిపి అనువదించాం.
- source_word: אַיִל
  choice: ఒక పొట్టేలు
  rationale: బలుల సందర్భంలో ఇది పెద్ద మగ గొర్రెకు వాడే సాధారణ పదం; ‘పొట్టేలు’ దానికి స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: כֶּבֶשׂ
  choice: ఒక మగ గొర్రెపిల్ల
  rationale: ఈ పదం గొర్రెపిల్లను, బలుల సందర్భంలో సాధారణంగా మగ గొర్రెపిల్లను సూచిస్తుంది; లింగభేదాన్ని స్పష్టంగా నిలిపాం.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసున్న
  rationale: అక్షరార్థంగా ‘దాని సంవత్సరపు కుమారుడు’ అనే ఈ నుడికారం, మొదటి సంవత్సరంలో ఉన్న లేదా ఒక సంవత్సరం వయసుగల జంతువును సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు రూపాన్ని వాడాం.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి స్థిరమైన హీబ్రూ పదం; לְ ఉపసర్గ ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి బలి జంతువు సంఖ్యను తెలిపే పునరుక్త సంఖ్యావాచకాన్ని జాబితా నిర్మాణంలో నిలిపాం.
