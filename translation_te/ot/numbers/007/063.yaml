translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జంతువుల జాబితా నిర్మాణాన్ని మరియు మూలంలోని ‘ఒక’ అనే పద పునరుక్తిని నిలిపాం. ‘మందలోనుండి’ అనే రూపం హీబ్రూ నుడికారాన్ని పదక్షరంగా కాకుండా సహజంగా అందిస్తుంది. వచనం తదుపరి అంశాలతో కొనసాగే జాబితాలో భాగమైనందున చివర అర్ధవిరామ చిహ్నం ఉంచాం.
