source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: te
  text: మందలోని ఒక ఎద్దు, ఒక పొట్టేలు, ఒక సంవత్సరం వయసున్న ఒక మగ గొర్రెపిల్ల దహనబలి కోసం;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: మందలోనుండి ఒక కోడెదూడ
  rationale: ‘పశువుల కుమారుడైన కోడె’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం; బలికి ఉద్దేశించిన యౌవన మగ పశువును సూచిస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి బలి పశువు సంఖ్యను విడివిడిగా పేర్కొనే మూలపాఠ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: వయోజన మగ గొర్రెను సూచించే సాధారణ బలిసంబంధ పదానికి సహజమైన తెలుగు సమానం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ బలిసంబంధ సందర్భంలో మగ గొర్రెపిల్లను సూచించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసుగల
  rationale: ‘దాని సంవత్సరపు కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా అర్పించడానికి
  rationale: పూర్తిగా దహించబడే బలిని సూచించే עֹלָה పదాన్నీ, ప్రయోజనాన్ని తెలిపే לְ ఉపసర్గనూ స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పద్యాంతంలోని జాబితా కొనసాగింపును సూచించేందుకు అర్ధవిరామం ఉంచబడింది.
