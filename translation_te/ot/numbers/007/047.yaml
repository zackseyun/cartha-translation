id: NUM.7.47
reference: Numbers 7:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: te
  text: 'మరియు సమాధాన బలి[a] కోసం: రెండు పశువులు, ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు. ఇది దెయూయేలు కుమారుడైన ఎల్యాసాపు అర్పణ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహవాస బలులు” లేదా “క్షేమ బలులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలుల కోసం
  rationale: జాబితాలోని తదుపరి అర్పణను సూచించే సంధి, విభక్తి భావాలను సహజమైన తెలుగులో తెలిపి, זֶבַח మరియు שְׁלָמִים అనే బలి సంబంధిత పదబంధాన్ని గుర్తించదగిన సంప్రదాయ పదంతో అనువదిస్తుంది.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సమూహార్థంగా సూచిస్తుంది; మూలంలో లింగం పేర్కొనబడనందున తెలుగులోనూ దానిని నిర్దిష్టం చేయలేదు.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם మగ గొర్రెలను స్పష్టంగా సూచిస్తుంది; 'పొట్టేళ్లు' ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; బలి జాబితాలోని లింగభేదాన్ని నిలుపుతుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు
  rationale: బెనే షానా అనే పదబంధం ఒక్క ఏడాది వయస్సును సూచిస్తుంది; తెలుగులో సహజంగా వయస్సు నియమాన్ని స్పష్టం చేసింది.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పణ
  rationale: హీబ్రూ నామవాచక వాక్యంలోని ప్రత్యక్ష నిర్దేశాన్ని నిలుపుతూ, קָרְבַּן ను బలి సందర్భానికి తగిన విస్తృత పదమైన 'అర్పణ'గా ఇచ్చింది.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: దెయూయేలు కుమారుడు ఎల్యాసాపు
  rationale: వ్యక్తి పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని సహజ తెలుగు క్రమంలో తెలిపింది.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి పదానికి భావవ్యాప్తి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదం సమాధానం, సంపూర్ణత, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ప్రధాన పాఠంలో గుర్తించదగిన సంప్రదాయ పదాన్ని ఎంచుకున్నప్పటికీ, ఏ ఒక్క భావంతోనూ దాని అర్థాన్ని సిద్ధాంతపరంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. మూలంలో లేని పశువుల లింగాన్ని చేర్చలేదు; మగ మేకల విషయంలో మాత్రం మూలంలోని స్పష్టతను నిలిపాం. పేర్లను హీబ్రూ రూపాలకు సమీపంగా ఇచ్చాం.
