language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “రోజుకు ఒక నాయకుడు, రోజుకు ఒక నాయకుడు[a], వారు బలిపీఠపు అంకితానికి తమ అర్పణను సమర్పించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రోజుకు ఒక గోత్ర నాయకుడు.” క్రమబద్ధమైన అర్పణల వరుసను నొక్కిచెప్పడానికి హీబ్రూ పాఠం “ఒక నాయకుడు, ఒక రోజు” అనే పదబంధాన్ని పునరుక్తి చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు ... అన్నాడు’ సహజమైన కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ ఇశ్రాయేలు గోత్రాల అధిపతులను సూచిస్తుంది. ‘నాయకుడు’ రాజరిక భావాన్ని అనవసరంగా చేర్చకుండా వారి పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶחָד לַיּוֹם
  choice: రోజుకు ఒక్క ... చొప్పున
  rationale: ఒక్కొక్క రోజున ఒక్కొక్క నాయకుడు అనే పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: יַקְרִיבוּ
  choice: సమర్పించాలి
  rationale: హిఫిల్ రూపం బలి సందర్భంలో అర్పణను దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది.
- source_word: קָרְבָּנָם
  choice: తమ అర్పణను
  rationale: దేవునికి దగ్గరకు తీసుకువచ్చే కానుక లేదా బలిని సూచించే ఆరాధనా పదానికి ‘అర్పణ’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: לַחֲנֻכַּת
  choice: ప్రతిష్ఠాపన కోసం
  rationale: బలిపీఠాన్ని ఆరాధనా వినియోగానికి ప్రారంభించి అంకితం చేసే సందర్భం లేదా ఉద్దేశాన్ని సూచిస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే altar‌కు ప్రామాణికమైన తెలుగు పదం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఉపయోగించాం.
- issue: חֲנֻכָּה యొక్క ఆరాధనా భావం
  choice: ప్రతిష్ఠాపన
  alternative: అంకితం
  rationale: ఈ సందర్భంలో బలిపీఠాన్ని ఆరాధనా సేవకు అధికారికంగా ప్రారంభించడం ప్రధాన భావం. ‘ప్రతిష్ఠాపన’ ఆ సందర్భాన్ని తెలియజేస్తుంది; పదంలో స్వతంత్రంగా లేని అదనపు కర్మకాండ సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని ‘ఒక్క నాయకుడు ... ఒక్క నాయకుడు’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, పంపిణీ మరియు క్రమ భావాన్ని ‘చొప్పున’ ద్వారా స్పష్టం చేశాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా చేర్చబడింది.
