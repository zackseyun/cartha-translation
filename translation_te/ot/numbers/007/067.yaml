source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ ఇదే: నూట ముప్పై షెకెల్ల బరువున్న ఒక వెండి పళ్లెం[a], డెబ్బై షెకెల్ల బరువున్న ఒక వెండి గిన్నె[b]—రెండూ పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం[c]; అవి ధాన్యార్పణ కొరకు నూనెతో కలిపిన సన్నని పిండితో నిండివున్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పళ్లెం’కు బదులు ‘పాత్ర’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం అర్పణల జాబితాలోని ఒక పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘గిన్నె’కు బదులు ‘బలి పాత్ర’ అని కూడా అనువదించవచ్చు; ఇది ఆచార సంబంధమైన పాత్ర.
    reason: lexical_alternative
  - marker: c
    text: అంటే, పరిశుద్ధస్థలంలో అమలైన ప్రామాణిక బరువు ప్రకారం.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: బలియర్పణకు సంబంధించిన సందర్భంలో קָרְבָּן అనేది దేవునికి దగ్గరకు తీసుకువచ్చే సమర్పణను సూచిస్తుంది; ‘అర్పణ’ సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קְעָרָה లోతు తక్కువగా ఉండే పాత్రను సూచిస్తుంది; ‘పళ్లెం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి పాత్ర ఆకృతిని తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెల్ల బరువుగల
  rationale: ‘దాని బరువు నూట ముప్పై’ అనే హీబ్రూ భావాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק బలి ఆచారంలో ఉపయోగించే పాత్ర. తెలుగులో ‘గిన్నె’ పాత్రను సహజంగా సూచిస్తుంది; దాని ఆచారపరమైన వినియోగాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెల్ల బరువుగల
  rationale: ఈ సంఖ్య రెండవ పాత్ర బరువును సూచిస్తుందని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది పరిశుద్ధస్థలంలో అమలైన అధికారిక బరువు ప్రమాణాన్ని సూచిస్తుంది; పదబంధపు ఆచారపరమైన భావాన్ని కాపాడుతూ అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ ... నింపబడి
  rationale: రెండు పాత్రలూ నిండివున్నాయని తెలిపే హీబ్రూ బహువచన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ధాన్యార్పణల్లో వాడే సన్నగా తయారుచేసిన ఉత్తమ పిండిని సూచించే సరళమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండి నూనెతో కలపబడిన స్థితిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణ’ స్పష్టమైన సందర్భోచిత పదం.
