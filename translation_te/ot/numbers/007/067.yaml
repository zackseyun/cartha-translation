translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా శైలిని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన భాష. కొలత పదమైన ‘షెకెలు’ను లిప్యంతరీకరించి, దాని ప్రమాణ స్వభావాన్ని పాదటిప్పణిలో వివరించాం.
