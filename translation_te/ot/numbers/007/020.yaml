  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/020.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: te
  text: పది షెకెలుల బరువుగల ఒక బంగారు పాత్ర[a], ధూపద్రవ్యంతో నిండినది;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక బంగారు పాత్ర, పది [బంగారం]’. చుట్టుపక్కల వచనాల్లోని కానుకల సూత్రం ప్రకారం ‘షెకెలులు’ అనే బరువు ప్రమాణం సూచితమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: పాత్ర
  rationale: ఇక్కడ మానవ అరచేయి కాక, ధూపద్రవ్యాన్ని ఉంచే చిన్న ఆరాధనా పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాత్ర’ సహజంగా, విస్తృతార్థంతో సరిపోతుంది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో ఏకీభవించే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెలుల బరువుగల బంగారు
  rationale: హీబ్రూ వాక్యంలో ‘షెకెలు’ ప్రత్యక్షంగా లేకపోయినా, చుట్టుపక్కల కానుకల జాబితాలోని సూత్రబద్ధమైన ప్రయోగం ద్వారా బరువు ప్రమాణం సూచితమవుతోంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు దానిని పూరించాం.
- source_word: מְלֵאָה
  choice: నిండినది
  rationale: పాత్రలోని పదార్థాన్ని తెలిపే విధేయ విశేషణ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: గుడార ఆరాధనలో ఉపయోగించే సుగంధ సమర్పణ పదార్థాన్ని స్పష్టంగా సూచిస్తుంది; కేవలం పొగ లేదా వాసన అనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని మరియు ఆరాధనా సందర్భపు గంభీరతను కాపాడుతూ అనువదించబడింది. ‘గరిటె’ లేదా ‘చెంచా’ కంటే ‘పాత్ర’ మూలపదంలోని చిన్న భాండార్థాన్ని సహజంగా తెలియజేస్తుంది.
