source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: te
  text: సమాధాన బలి[a] కోసం రెండు పశువులు, ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు. ఇది అమ్మీనాదాబు కుమారుడు నహ్షోను అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహవాస బలి’ లేదా ‘క్షేమ బలి.’ ఈ హీబ్రూ పదం క్షేమం లేదా సమాధానంతో సంబంధం ఉన్న, బలిని పంచుకొని భుజించే అర్పణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: సమాధాన బలి కోసం
  rationale: జాబితాలోని తదుపరి అర్పణను పరిచయం చేసే సంయోజక అవ్యయం, ఉపసర్గ, బలి సంబంధ పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. שְׁלָמִים అనే ప్రత్యేక బలి పదానికి సంప్రదాయబద్ధమైన, అర్థమయ్యే రూపంగా ‘సమాధాన బలి’ ఎంచుకోబడింది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר పశువులను సమూహార్థంలో సూచిస్తుంది; మూలంలో లింగాన్ని నిర్దిష్టం చేయనందున ‘ఎద్దులు’ అని అధికంగా నిర్దిష్టం చేయలేదు.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם అంటే మగ గొర్రెలు లేదా పొట్టేళ్లు; ఆధునిక తెలుగులో స్పష్టమైన బలి జాబితా పదం.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתּוּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; లింగ సూచనను నిలుపుకుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים మగ గొర్రెపిల్లలను సూచించగల పదం; בְּנֵי שָׁנָה వాటి వయస్సు ఏడాది అని తెలియజేస్తుంది. సంఖ్యతో సహజమైన తెలుగు పదక్రమం వాడబడింది.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పించిన అర్పణ
  rationale: హీబ్రూ క్రియలేని నిర్ధారణ వాక్యాన్ని కథన సందర్భానికి సహజంగా తెలుగులో చెప్పి, קָרְבָּן యొక్క ఆరాధనా సంబంధ ‘అర్పణ’ భావాన్ని నిలుపుకుంది.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: అమ్మీనాదాబు కుమారుడు నహ్షోను
  rationale: వ్యక్తి పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, patronymic సంబంధాన్ని సహజమైన తెలుగు క్రమంలో తెలిపింది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదంలోని భావ పరిధి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ పదం సమాధానం, క్షేమం, బలిని పంచుకొని భుజించే సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో పరిచితమైన ‘సమాధాన బలి’ని ఉంచి, భావ పరిధిని పాదసూచికలో తెలిపాం; ఏకైక సిద్ధాంత వ్యాఖ్యానానికి దాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితా యొక్క సంక్షిప్తతను మరియు గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని క్రియలేని చివరి వాక్యాన్ని తెలుగులో సహజంగా చేయడానికి ‘అర్పించిన’ అనే క్రియను సరఫరా చేశాం. పాదసూచిక గుర్తు సంబంధిత ‘సమాధాన బలి’ పదంపైనే ఉంచబడింది.
