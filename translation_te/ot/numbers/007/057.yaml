  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: te
  text: పశువుల మందలోనుండి ఒక ఎద్దును,[a] ఒక పొట్టేలును, ఒక సంవత్సరం వయసున్న మగ గొర్రెపిల్లను దహనబలి కోసం;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక ఎద్దు, పశువుల మంద కుమారుడు.’ ఇది పశువుల మందకు చెందిన ఎద్దును సూచించే నుడికారం; దీనిని ‘ఒక యువ ఎద్దు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: ఎద్దు
  rationale: బలి అర్పణల జాబితాలో פַּר మగ పశువును, సాధారణంగా ఎద్దును లేదా యువ ఎద్దును సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎద్దు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: జాబితాలో ప్రతి జంతువు ఒక్కటే అని తెలిపే సంఖ్యావాచకం.
- source_word: בֶּן בָּקָר
  choice: మందలోనుండి
  rationale: అక్షరార్థంగా ‘పశుమంద కుమారుడు’; ఇది పశుమందకు చెందిన గోవంశ జంతువును సూచించే హీబ్రూ నుడికారం. ముందున్న פַּר ను ‘ఎద్దు’గా అనువదించినందున అనవసర పునరుక్తి లేకుండా వర్గీకరణ భావాన్ని నిలుపుతుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలి సందర్భంలో వయోజన మగ గొర్రెను సూచించే సహజమైన తెలుగు పదం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: כֶּבֶשׂ గొర్రెపిల్లను సూచిస్తుంది; ఈ బలి జాబితాలో లింగాన్ని స్పష్టపరచడానికి ‘మగ గొర్రెపిల్ల’ అని ఇచ్చాం.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసున్న
  rationale: అక్షరార్థంగా ‘దాని సంవత్సరపు కుమారుడు’; మొదటి సంవత్సరంలో ఉన్న లేదా సంవత్సరం వయసున్న జంతువును సూచించే నుడికారం. తెలుగు వాక్యంలో సహజమైన వయస్సు వివరణను వాడాం.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה పూర్తిగా దహింపబడే బలికి వాడే ప్రామాణిక బలిపదం; לְ దాని ఉద్దేశాన్ని సూచిస్తుంది.
