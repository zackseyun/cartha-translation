  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: te
  text: పదకొండవ రోజున, ఆషేరు వంశస్థుల నాయకుడు అక్రాను కుమారుడు పగీయేలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: పదకొండవ రోజున
  rationale: హీబ్రూలో ‘రోజు’ పదం పునరుక్తమైనా, ఇది సంఖ్యాకాండము 7లోని స్థిరమైన కాలసూచక సూత్రం. సహజమైన తెలుగులో పునరుక్తిని తొలగించి కాలసూచనను స్పష్టంగా ఉంచాం.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: పదకొండవ
  rationale: ఈ అంకితం క్రమంలో సంఖ్య పదకొండవ స్థానాన్ని సూచిస్తోంది; అందువల్ల తెలుగులో సహజమైన క్రమసంఖ్యను వాడాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ పదం ఒక గోత్రానికి గుర్తింపుపొందిన అధిపతిని సూచిస్తుంది. ‘నాయకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ‘రాజకుమారుడు’ అనే అనుచిత రాజవంశ భావాన్ని రానివ్వదు.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: ఆషేరు వంశీయుల
  rationale: అక్షరార్థంగా ‘ఆషేరు కుమారుల’ అయినా, సందర్భంలో ఆషేరు గోత్రానికి చెందిన ప్రజలను సూచిస్తుంది. ‘వంశీయుల’ అనేది బంధుత్వ నేపథ్యాన్ని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: פַּגְעִיאֵל
  choice: పగీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, బైబిలు నామరూప సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן עָכְרָן
  choice: ఆక్రాను కుమారుడు
  rationale: హీబ్రూ వంశసూచక בֶּן‌ను సహజంగా ‘కుమారుడు’ అని అనువదించి, עָכְרָן‌ను ‘ఆక్రాను’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని నిలిపి, తెలుగులో అసహజమైన ‘రోజు’ పునరుక్తిని నివారించాం.
