  text: שְׁלֹשִׁ֣ים וּ/מֵאָ֗ה הַ/קְּעָרָ֤ה הָֽ/אַחַת֙ כֶּ֔סֶף וְ/שִׁבְעִ֖ים הַ/מִּזְרָ֣ק הָ/אֶחָ֑ד כֹּ֚ל כֶּ֣סֶף הַ/כֵּלִ֔ים אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: te
  text: ప్రతి వెండి పళ్లెం నూట ముప్పై షెకెలులు, ప్రతి గిన్నె డెబ్బై షెకెలులు బరువు ఉండేది; ఆ పాత్రల వెండి మొత్తం పరిశుద్ధస్థలపు షెకెలు ప్రకారం[a] రెండువేల నాలుగువందల షెకెలులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధస్థలపు షెకెలు చొప్పున.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: నూట ముప్పై
  rationale: హీబ్రూ సంఖ్యా పదబంధాన్ని సహజమైన ఆధునిక తెలుగు సంఖ్యా క్రమంలో ఇచ్చాం.
- source_word: הַקְּעָרָה הָאַחַת
  choice: ప్రతి పళ్లెం
  rationale: ఈ జాబితా సందర్భంలో నిర్దిష్ట ఏకవచనం పంపిణీ భావంతో ప్రతి పళ్లెం బరువును సూచిస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఇక్కడ పదం ధనాన్ని కాక పాత్ర తయారైన లోహాన్ని సూచిస్తుంది.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: ప్రతి గిన్నె
  rationale: మִזְרָק ఆచార సంబంధమైన గిన్నె లేదా పాత్రను సూచిస్తుంది; సందర్భంలోని ఏకవచనానికి పంపిణీ భావం ఉంది.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: ఆ పాత్రల వెండి మొత్తం
  rationale: כֹּל తెలిపే మొత్తాన్ని, כֵּלִים తెలిపే పాత్రలను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: రెండువేల నాలుగువందల
  rationale: హీబ్రూ మొత్తానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం తూకానికి ఉపయోగించిన పరిశుద్ధస్థల ప్రమాణాన్ని సూచిస్తుంది; 'ప్రమాణం ప్రకారం' భావాన్ని స్పష్టం చేస్తుంది.
