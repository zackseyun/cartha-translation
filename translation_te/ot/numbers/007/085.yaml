translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుకుంటూ సామాన్య పాఠకులకు స్పష్టంగా అనువదించాం. 'షెకెలు' అనే ప్రాచీన తూకపు ప్రమాణాన్ని లిప్యంతరీకరించాం; మూలంలో మొదటి సంఖ్య తరువాత మాత్రమే ఉన్న 'వెండి'ని తెలుగులో సహజంగా 'వెండి పళ్లెం'గా అమర్చాం.
