  terminology: “పశువులు,” “పొట్టేళ్లు,” “మేకపోతులు,” and “మగ గొర్రెపిల్లలు” accurately retain the Hebrew distinctions. “సమాధానబలి” is a suitable established rendering of זֶבַח הַשְּׁלָמִים; the lexical alternatives are retained in a footnote with matching singular category phrasing.
