  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: te
  text: సమాధానబలి కోసం[a] రెండు పశువులు, ఐదు పొట్టేళ్లు, ఐదు మేకపోతులు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు. ఇది షెదేయూరు కుమారుడైన ఎలీసూరు అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహవాస బలి కోసం’ లేదా ‘క్షేమ బలి కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలుల కోసం
  rationale: జాబితాలోని తదుపరి అర్పణను పరిచయం చేసే సంధి-ఉపసర్గ నిర్మాణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. שְׁלָמִים అనే బలిపదానికి సంప్రదాయ అర్థమైన ‘సమాధాన బలులు’ను ఉంచి, ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సమూహవాచకంగా సూచిస్తుంది; లింగాన్ని లేదా ‘ఎద్దులు’ అని అవసరానికి మించి నిర్దిష్టం చేయకుండా అనువదించాం.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם మగ గొర్రెలను సూచించే స్పష్టమైన బలిపదం; ‘పొట్టేళ్లు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మేకపోతులు
  rationale: עַתֻּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; ‘మేకపోతులు’ ఆ లింగ విశిష్టతను నిలుపుతుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים మగ గొర్రెపిల్లలను, בְּנֵי שָׁנָה ఏడాది వయసును సూచిస్తాయి; తెలుగులో రెండింటినీ స్పష్టంగా నిలిపాం.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పణ
  rationale: హీబ్రూ నామవాచక సూత్రంలోని ‘ఇది’ అనే ప్రత్యక్ష రూపాన్ని నిలుపుతూ, קָרְבַּןకు సాధారణమైన ‘అర్పణ’ను వాడాం.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: షెదేయూరు కుమారుడైన ఎలీసూరు
  rationale: పేర్లను తెలుగులో ధ్వన్యనుకరణ చేసి, హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
theological_decisions:
- issue: שְׁלָמִים అనే బలిపదంలోని భావ విస్తృతి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదం సమాధానం, సహవాసం, క్షేమం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో స్థిరమైన బలిపరిభాషను ఉపయోగించి, భావ విస్తృతిని పాదటిప్పణిలో ఉంచడం ద్వారా ఏకైక సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. జాబితా సహజంగా పూర్తి కావడానికి ‘అర్పించాడు’ను సందర్భానుగుణంగా జోడించాం; చివరి హీబ్రూ సూత్రాన్ని మాత్రం ‘ఇది ... అర్పణ’గా సన్నిహితంగా నిలిపాం.
