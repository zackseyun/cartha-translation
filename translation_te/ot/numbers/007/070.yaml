lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: ఈ హీబ్రూ పదబంధం మగ మేకను సూచిస్తుంది. ‘మగ మేకపోతు’ బలికి అర్పించే జంతువు ఏదో ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: ఈ సంఖ్య అర్పించే జంతువును లెక్కిస్తుంది; సంఖ్యాకాండము 7లోని పునరావృత జాబితా శైలిని నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת అనేది పాపాన్ని మాత్రమే కాక, పాపం నిమిత్తం అర్పించే బలిని సూచిస్తుంది. לְ ఉపసర్గను ఇక్కడ సహజమైన తెలుగులో ‘గా’ అని వ్యక్తపరచడం జాబితా సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: బలుల సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: పాపం కోసం
  rationale: ఇది బలి అర్పణల జాబితాలో ఉంది కాబట్టి, ఈ పదానికి బలిని సూచించే ఆచార సంబంధమైన అర్థమే సందర్భోచితం. అయినప్పటికీ మూలపదానికి ‘పాపం’ అనే ప్రాథమిక అర్థం కూడా ఉందని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని సంఖ్యను, జంతువు లింగాన్ని, ఆచార సంబంధమైన అర్థాన్ని స్పష్టంగా నిలిపింది.
