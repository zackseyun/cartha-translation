id: NUM.7.89
reference: Numbers 7:89
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: te
  text: మోషే ఆయనతో మాట్లాడడానికి సమావేశపు గుడారంలోకి వెళ్లినప్పుడు, సాక్ష్యపు మందసం మీద ఉన్న ప్రాయశ్చిత్త మూత[b] పైనుండి, ఇద్దరు కెరూబుల మధ్యనుండి అతనితో మాట్లాడుతున్న[a] స్వరాన్ని విన్నాడు. అప్పుడు అతనితో మాట్లాడాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి పలకబడుతున్న స్వరాన్ని.” ఇక్కడి హీబ్రూ కృదంత రూపాన్ని స్వల్పంగా భిన్నంగా అర్థం చేసుకోవచ్చు; “అతనితో మాట్లాడుతున్న స్వరం” అనేది సూటియైన భావం.
    reason: lexical_alternative
  - marker: b
    text: “ప్రాయశ్చిత్త మూత” అనేది సాక్ష్యపు మందసం మీదున్న బంగారు మూత; దాని పైన, కెరూబుల మధ్యనుండి యెహోవా మాట్లాడేవాడు.
    reason: cultural_note
  - marker: c
    text: చివరి మాటను “యెహోవా అతనితో మాట్లాడాడు” అని స్పష్టంగా అనువదించవచ్చు. లేదా ముందు చెప్పిన “స్వరం”నే కర్తగా తీసుకొని, “అది అతనితో మాట్లాడింది” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: వెళ్లినప్పుడు
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ కాలసూచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది. సందర్భంలో గుడారంలోకి ప్రవేశించడం అనే భావాన్ని సహజమైన తెలుగులో ‘వెళ్లినప్పుడు’ వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పరిశుద్ధ గుడారానికి వాడిన పేరును అర్థవంతంగా, సాధారణ పాఠకులకు గ్రాహ్యంగా అందిస్తుంది.
- source_word: לְדַבֵּר אִתּוֹ
  choice: ఆయనతో మాట్లాడడానికి
  rationale: אִתּוֹ లోని ‘తో’ అనే సంబంధ భావాన్ని నిలుపుతుంది. గౌరవార్థక ‘ఆయన’ సందర్భంలోని దేవుణ్ణి సూచించినా, మూలంలోని సర్వనామ రూపాన్నే అనుసరిస్తుంది.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: స్వరాన్ని విన్నాడు
  rationale: קוֹל అంటే శబ్దం లేదా స్వరం కావచ్చు; తరువాతి ‘మాట్లాడుతున్న’ అనే పదం వల్ల ఇక్కడ ‘స్వరం’ సరైనది.
- source_word: מִדַּבֵּר
  choice: మాట్లాడుతున్న
  rationale: పుంలింగ ఏకవచన కృదంతం ‘స్వరం’తో సంబంధించి, కొనసాగుతున్న మాటను సజీవంగా వ్యక్తం చేస్తుంది. రూపానికి స్వల్ప భిన్న అర్థసాధ్యత ఉన్నందున పాదటిప్పణి ఇచ్చాం.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత పైనుండి
  rationale: כַּפֹּרֶת మందసం మీదున్న ప్రత్యేక ఆచార సంబంధిత మూత. ‘ప్రాయశ్చిత్త మూత’ దాని వస్తురూపాన్నీ ఆరాధనా ప్రాముఖ్యతనూ తెలియజేస్తుంది; అది ఒక ఆసనం అన్న అపార్థాన్ని నివారిస్తుంది.
- source_word: אֲרֹן הָעֵדֻת
  choice: సాక్ష్యపు మందసం
  rationale: עֵדֻת లోని సాక్ష్య/నిబంధన పత్రాల భావాన్ని, אֲרוֹן అనే పవిత్ర పెట్టెకు తెలుగులో స్థిరంగా వాడే ‘మందసం’తో కలిపి అందిస్తుంది.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: ఇద్దరు కెరూబుల మధ్యనుండి
  rationale: ప్రత్యేక పరలోక జీవుల పేరును లిప్యంతరీకరించి, మూలంలోని సంఖ్యనూ స్థానార్థాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: అప్పుడు అతనితో మాట్లాడాడు
  rationale: కర్తను పేరుతో స్పష్టం చేయకుండా తెలుగు క్రియలో అంతర్నిహితంగా ఉంచడం ద్వారా మూలంలోని కర్త-సందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుతుంది. ‘అప్పుడు’ కథన ప్రవాహాన్ని సహజంగా చేస్తుంది.
theological_decisions:
- issue: చివరి וַיְדַבֵּר אֵלָיו లో మాట్లాడిన కర్త ఎవరు?
  choice: కర్తను ‘యెహోవా’ లేదా ‘స్వరం’ అని స్పష్టంగా చేర్చకుండా, ‘అతనితో మాట్లాడాడు’ అని అనువదించడం
  alternative: ‘యెహోవా అతనితో మాట్లాడాడు’ లేదా ‘ఆ స్వరం అతనితో మాట్లాడింది’
  rationale: సందర్భం ప్రకారం దేవుడే మోషేతో మాట్లాడుతున్నాడనేది బలమైన భావం; అయితే వ్యాకరణపరంగా ముందు వచ్చిన ‘స్వరం’ కూడా కర్తగా గ్రహించవచ్చు. మూలంలో లేని స్పష్టీకరణను ప్రధాన పాఠ్యంలో చేర్చకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేయడం theological tensionను కాపాడుతుంది.
- issue: לְדַבֵּר אִתּוֹ లోని సర్వనామం
  choice: ‘ఆయనతో’ అని గౌరవార్థకంగా అనువదించి దేవుణ్ణి సూచించడం
  alternative: ‘అతనితో’ అని లింగసాధారణ సర్వనామాన్ని వాడడం
  rationale: పరిశుద్ధ గుడారంలో మోషే మాట్లాడడానికి వెళ్లిన వ్యక్తి సందర్భానుసారం దేవుడే. ఆధునిక గౌరవప్రద తెలుగు శైలిలో దేవునికి ‘ఆయన’ సహజం; అయినా దేవుని నామాన్ని మూలంలో లేనిచోట చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘సమావేశపు గుడారం,’ ‘సాక్ష్యపు మందసం,’ ‘ప్రాయశ్చిత్త మూత’ వంటి పదాలు సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండటంతో పాటు ఆరాధనా సందర్భంలోని ప్రత్యేకతను నిలుపుతాయి. చివరి క్రియలో కర్తను ఉద్దేశపూర్వకంగా పేర్కొనకుండా మూలంలోని సందిగ్ధతను కాపాడాం.
