translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని క్రియారహిత జాబితా-సూత్ర నిర్మాణం మరియు తరువాత వచ్చే అర్పణ వివరాలకు దారితీసే ద్విబిందువు నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదం వద్ద ఉంచబడింది.
