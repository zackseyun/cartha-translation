  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: te
  text: 'ఆరవ రోజున, గాదు కుమారుల[a] నాయకుడు దెయూయేలు[b] కుమారుడైన ఎల్యాసాపు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘గాదు కుమారులు’; అంటే గాదు సంతతివారు లేదా గాదు గోత్రం.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనంలోని హీబ్రూ పాఠంలో పేరు ‘దెయూయేలు’గా ఉంది; ఇతర సంబంధిత వచనాల్లో అది ‘రెయూయేలు’గా కనిపించే చోట్లతో పోల్చండి.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: ఆరవ రోజున
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గతో కూడిన ఈ కథన సూత్రానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం; הַשִּׁשִּׁי అనే క్రమసంఖ్యను స్పష్టంగా నిలుపుతుంది.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ గోత్రానికి అధికారికంగా గుర్తింపుపొందిన అధిపతిని సూచిస్తుంది. ‘రాజకుమారుడు’ అనే తప్పుదారి పట్టించే రాజవంశ భావాన్ని కలిగించకుండా హోదాను తెలియజేస్తుంది.
- source_word: לִבְנֵי גָד
  choice: గాదు కుమారుల
  rationale: హీబ్రూ కుటుంబ-గోత్ర నుడికారాన్ని నేరుగా నిలుపుతుంది; భావం గాదు సంతతి లేదా గోత్రం.
- source_word: אֶלְיָסָף
  choice: ఎలీయాసాపు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: דְּעוּאֵל
  choice: దెయూయేలు
  rationale: ఈ వచనంలోని మసొరా హీబ్రూ రూపం דְּעוּאֵל‌ను అనుసరించిన లిప్యంతరీకరణ.
