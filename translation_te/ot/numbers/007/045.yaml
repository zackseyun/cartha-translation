  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/045.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: te
  text: పశువుల మందలోని ఒక ఎద్దు, ఒక పొట్టేలు, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్ల, దహనబలి కోసం;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  choice: ఎద్దు
  rationale: బలుల సందర్భంలో ఈ పదం మగ పశువును సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎద్దు’ సహజమైన, స్పష్టమైన పదం.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి బలి జంతువు సంఖ్యను విడివిడిగా సూచించే పునరుక్తిని నిలిపింది.
- source_word: בֶּן בָּקָר
  choice: మందలోని
  rationale: అక్షరార్థంగా ‘పశువుల కుమారుడు’ అనే హీబ్రూ నుడికారం, ఇది గోవుల మందకు చెందిన జంతువని సూచిస్తుంది; ‘మందలోని’ తెలుగులో సహజంగా ఆ వర్గభేదాన్ని తెలియజేస్తుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలుల సందర్భంలో వయోజన మగ గొర్రెకు సాధారణ తెలుగు పదం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ పదం మగ గొర్రెపిల్లను సూచిస్తుంది; లింగాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: జంతువు వయసును తెలిపే హీబ్రూ నుడికారానికి స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: పూర్తిగా దహనం చేసే బలిని సూచించే ప్రామాణిక బలిపదాన్ని సహజమైన జాబితా నిర్మాణంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితా లయను మరియు ప్రతి జంతువుకు ఉన్న ‘ఒక’ అనే సంఖ్యా పునరుక్తిని కాపాడుతూ రూపొందించబడింది. మూలంలోని జాబితా కొనసాగింపును సూచించేందుకు చివర సెమికోలన్ ఉంచబడింది.
