id: NUM.7.88
reference: Numbers 7:88
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: te
  text: సమాధాన బలి[a]కి సంబంధించిన పశువుల మొత్తం ఇరవై నాలుగు ఎద్దులు, అరవై పొట్టేళ్లు, అరవై మగ మేకలు, ఒక సంవత్సరం వయసున్న అరవై గొర్రెపిల్లలు. బలిపీఠం అభిషేకించబడిన తరువాత జరిగిన ప్రతిష్ఠ ఇది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహవాస బలి’; లేదా, ‘క్షేమ బలి.’
    reason: שְׁלָמִים అనే హెబ్రీ బలి పదానికి సమాధానం, సహవాసం, క్షేమం అనే భావ ఛాయలను ప్రతిబింబించే అనేక సముచిత అనువాదాలు ఉన్నాయి.
lexical_decisions:
- source_word: וְכֹל
  choice: అన్నీ కలిపి
  rationale: ఈ బలి విభాగానికి సంబంధించిన మొత్తం సంఖ్యను వాక్యం సంగ్రహిస్తోంది; ‘కలిపి’ అనే పదం ఆ సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּקַר זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి కోసం అర్పించిన పశువులు
  rationale: వాక్యంలోని జంతువుల మొత్తం జాబితాను తెలుగులో సహజంగా పరిచయం చేస్తూ, זֶבַח הַשְּׁלָמִים అనే బలి వర్గానికి ‘సమాధాన బలి’ అనే గుర్తించదగిన పదాన్ని నిలుపుతుంది.
- source_word: פָּרִים
  choice: ఎద్దులు
  rationale: బలి సందర్భంలో మగ గోవులను సూచించే సాధారణ తెలుగు పదం; మూలంలో స్పష్టంగా లేని ‘యువ’ అనే భావాన్ని చేర్చలేదు.
- source_word: אֵילִם
  choice: పొట్టేళ్లు
  rationale: మగ గొర్రెలను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: עַתֻּדִים
  choice: మగ మేకలు
  rationale: జంతువుల లింగాన్ని మూలానికి అనుగుణంగా స్పష్టంగా ఉంచుతుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ఒక సంవత్సరం వయసున్న గొర్రెపిల్లలు
  rationale: బలి నియమాలకు ముఖ్యమైన వయస్సు వివరాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: బలిపీఠం ప్రతిష్ఠ
  rationale: బలిపీఠాన్ని ఆరాధనా వినియోగానికి ప్రారంభించి అంకితం చేసిన సందర్భాన్ని సూచిస్తుంది; మూలంలో లేని ‘అర్పణ’ అనే నామవాచకాన్ని అదనంగా చేర్చదు.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: బలిపీఠం అభిషేకించబడిన తర్వాత
  rationale: మూలంలో కర్త పేర్కొనబడనందున తెలుగులో కర్మణి రూపాన్ని వాడి, అనవసరమైన కర్తను చేర్చకుండా కాల సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి వర్గం అనువాదం
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ‘సమాధాన బలి’ సంప్రదాయంగా గుర్తించదగిన పదం; అయితే హెబ్రీ పదంలో సహవాసం, క్షేమం లేదా సంపూర్ణ శ్రేయస్సు వంటి భావ ఛాయలు కూడా ఉన్నందున వాటిని పాదసూచికలో నిలిపాం.
- issue: חֲנֻכָּה అనేది సంఘటనా లేక అర్పణలా
  choice: ప్రతిష్ఠ
  alternative: ప్రతిష్ఠ అర్పణ
  rationale: మూలపదం ప్రతిష్ఠాపన సంఘటనను లేదా దానికి సంబంధించిన అర్పణలను సందర్భానుసారం సూచించగలదు. ఇక్కడ ‘ప్రతిష్ఠ’ అని ఉంచడం మూలంలోని సంక్షిప్తతను, స్వల్ప సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. సంఖ్యల జాబితాకు ‘అన్నీ కలిపి’ అని చెప్పి సంగ్రహ స్వభావాన్ని స్పష్టం చేశాం; బలిపీఠం విషయంలో మతపరంగా స్థిరపడిన ‘అభిషేకం’, ‘ప్రతిష్ఠ’ పదాలను ఉపయోగించాం.
