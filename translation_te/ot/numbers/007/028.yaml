  text: పాపపరిహార బలికి ఒక మేకపోతు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: ఈ బలి సందర్భంలో ఈ సంయుక్త పదబంధం మగ మేకను సూచిస్తుంది. ‘మగ’ అని పేర్కొనడం మూలపాఠంలో స్పష్టమైన లింగాన్ని నిలుపుతుంది; ‘మేకపోతు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אֶחָד
  choice: ఒక
  rationale: అర్పణల లెక్కలో మూలపాఠం సంఖ్యను స్పష్టంగా పేర్కొంటుంది కాబట్టి ‘ఒక’ అని నిలుపబడింది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల జాబితా అనే సందర్భంలో חַטָּאת నైరూప్యమైన ‘పాపం’ను కాక, పాపానికి సంబంధించిన నిర్దిష్ట బలిని సూచిస్తుంది. לְ ఉపసర్గ ఇక్కడ ‘బలిగా’ అని సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: బలుల సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: పాపం కోసం
  rationale: తక్షణ సందర్భం బలికి అర్పించే జంతువుల జాబితా కాబట్టి, ఈ పదానికి బలిసంబంధమైన అర్థమే తగినది. ‘పాపపరిహార బలి’ తెలుగు పాఠకునికి బలి రకాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాతి సిద్ధాంతార్థాలను అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన బలి-జాబితా శైలిని నిలిపాం. ‘మగ మేకపోతు’లో కొంత అర్థపునరుక్తి ఉన్నప్పటికీ, మూలంలోని మగ లింగ సూచనను స్పష్టంగా ఉంచడానికి దాన్ని ఉపయోగించాం.
