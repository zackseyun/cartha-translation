lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకను
  rationale: ఈ హీబ్రూ నిర్మాణం బలికి అర్పించే మగ మేకను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మగ మేక’ స్పష్టంగా, సహజంగా ఉండి జంతువు లింగాన్ని నిలుపుతుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: సంఖ్యాకాండము 7లోని లెక్కింపు జాబితా శైలిని నిలుపుతూ ‘ఒక’ అనే సంఖ్యను స్పష్టంగా అనువదించాం.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת అనేది కేవలం ‘పాపం’ను కాక, పాపం లేదా ఆచారపరమైన అపవిత్రతతో వ్యవహరించే బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ తెలుగులో గుర్తించదగిన సంప్రదాయార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: బలుల సందర్భంలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఇక్కడ ఆ పదం పాపాన్ని కాక ఒక బలి రకాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ ప్రధాన అనువాదంగా సుపరిచితం; అయితే ఈ ఆచారం శుద్ధీకరణతోనూ సంబంధం కలిగి ఉన్నందున ‘శుద్ధీకరణ బలి’ అనే భావసాధ్యాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన బలుల జాబితా శైలిని నిలిపాం. మూలంలోని ‘ఒక’ అనే లెక్కను స్పష్టంగా ఉంచి, వాక్యభాగం కొనసాగుతున్నదని సూచించేందుకు చివర అర్ధవిరామ చిహ్నం వాడాం.
