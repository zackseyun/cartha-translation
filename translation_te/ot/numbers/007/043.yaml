  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ ఇదే: నూట ముప్పై షెకెలుల బరువున్న ఒక వెండి పళ్లెం[a], డెబ్బై షెకెలుల బరువున్న ఒక వెండి గిన్నె[b]—రెండింటి బరువులూ పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం ఉన్నాయి[c]. ధాన్యార్పణ కోసం నూనెతో కలిపిన మెత్తని పిండితో ఆ రెండూ నిండి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పళ్లెం’కు బదులు ‘పాత్ర’ అని కూడా అనువదించవచ్చు (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: ‘గిన్నె’కు బదులు ‘లోతైన పాత్ర’ అని కూడా అనువదించవచ్చు (מִזְרָק); ఇది ఆచార సంబంధమైన పాత్ర.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘పరిశుద్ధస్థలపు షెకెలు ప్రకారం’; ఇది అక్కడ అనుసరించిన ప్రామాణిక బరువును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ ఇదే
  rationale: ఆరాధనా సందర్భంలో తీసుకువచ్చే అర్పణను సూచిస్తుంది. క్రియలేని హీబ్రూ వాక్యాన్ని సహజమైన తెలుగులో చెప్పడానికి ‘ఇదే’ చేర్చబడింది.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה వెడల్పైన పళ్లెం లేదా పాత్రను సూచిస్తుంది; ‘పళ్లెం’ ఆధునిక తెలుగులో సహజంగా ఉండి పాత్ర ఆకారాన్ని తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: మూలంలోని ‘దాని బరువు నూట ముప్పై’ అనే భావాన్ని తెలుగులో సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק ఆచార సంబంధమైన ద్రవపాత్ర. దాని ప్రత్యేక వినియోగాన్ని ఊహించి చేర్చకుండా సాధారణమైన ‘గిన్నె’ ఎంచుకోబడింది.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: ఈ సంఖ్య రెండవ వెండి పాత్ర బరువును తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది పరిశుద్ధ స్థలంలో అనుసరించిన ప్రామాణిక బరువును సూచించే సూత్రప్రాయ పదబంధం; ‘ప్రమాణం’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ నిండి ఉన్నాయి
  rationale: రెండు పాత్రలనూ సూచించే హీబ్రూ ద్వివచన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణల్లో ఉపయోగించే సన్నగా తయారుచేసిన నాణ్యమైన పిండిని సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనె పిండిలో కలపబడిందనే నిష్క్రియ భావాన్ని సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను ప్రత్యేకంగా సూచిస్తుంది; కేవలం ‘అర్పణ’ అని అనువదిస్తే ఆ ప్రత్యేకత పోతుంది.
