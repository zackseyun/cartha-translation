  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే జాబితా శైలి వాడబడింది. కొలత ప్రమాణమైన ‘షెకెలు’ లిప్యంతరీకరించబడింది. పాత్రల పేర్లలోని మూలభాషా అనిశ్చితిని [a] పాదటిప్పణిలో నిలుపుకున్నాం.
