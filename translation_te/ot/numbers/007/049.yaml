source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ ఇది: నూట ముప్పై షెకెలుల బరువున్న ఒక వెండి పళ్లెం[a], పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం డెబ్బై షెకెలుల బరువున్న ఒక వెండి గిన్నె; ఆ రెండూ ధాన్యార్పణార్థంగా నూనెతో కలిపిన సన్నని పిండితో నిండినవి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెండి తట్టు’; ‘వెండి గిన్నె’ను ‘వెండి పాత్ర’ అని కూడా అనువదించవచ్చు.
    reason: కַעֲרָה మరియు מִזְרָק అనే పాత్రాపదాలు వేర్వేరు ఆచార పాత్రలను సూచిస్తాయి, కానీ వాటి ఖచ్చితమైన ఆకారాలు నిర్ధారితం కావు; అందువల్ల సాధ్యమైన తెలుగు ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధనా సందర్భంలో దేవుని సన్నిధికి తీసుకొచ్చే సమర్పణను సూచించే קָרְבָּןకు ‘అర్పణ’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה విశాలమైన పాత్రను సూచిస్తుంది; ఈ జాబితా సందర్భంలో ‘పళ్లెం’ దాని ఆకారాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: హీబ్రూ పాఠంలోని పాత్ర-బరువు సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק బలి ఆచారంలో వాడే గిన్నె లేదా లోతైన పాత్ర; ‘గిన్నె’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: రెండవ వెండి పాత్ర బరువును మొదటి పాత్రతో సమాంతరంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది బరువును కొలిచే ఆరాధనా సంబంధిత అధికారిక ప్రమాణమని స్పష్టం చేస్తుంది; ‘పరిశుద్ధ స్థలం’ మూలంలోని הַקֹּדֶשׁ భావాన్ని నిలుపుతుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ ... నింపబడ్డాయి
  rationale: రెండు వెండి పాత్రలనే సూచిస్తున్నట్టు తెలుగులో స్పష్టంగా తెలియజేస్తూ, మూలంలోని స్థితి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలుల కోసం ఉపయోగించే శుద్ధంగా దంచిన నాణ్యమైన పిండిని సాధారణ ఆధునిక తెలుగులో అర్థమయ్యేలా సూచిస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో మిశ్రమం చేసిన తయారీ విధానాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధిత సందర్భంలో מִנְחָה సాధారణ అర్పణకన్నా ప్రత్యేకమైన ధాన్యార్పణను సూచిస్తుంది.
