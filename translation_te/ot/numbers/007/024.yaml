source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: te
  text: మూడవ రోజున జెబూలూను కుమారుల నాయకుడు[a] హేలోను కుమారుడైన ఎలీయాబు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జెబూలూను కుమారుల తరఫున నాయకుడు.’ ఇక్కడ హెబ్రీ ఉపసర్గ అనుబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గను తెలుగులో సహజమైన ‘రోజున’ రూపంతో వ్యక్తం చేశాం; הַשְּׁלִישִׁי క్రమసంఖ్యగా ‘మూడవ’.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: సంఖ్యాకాండంలో ఇది గోత్రానికి అధికారికంగా గుర్తింపుపొందిన అధిపతిని సూచిస్తుంది. ‘నాయకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, రాజవంశార్థాన్ని అనవసరంగా కలిగించదు.
- source_word: לִבְנֵי זְבוּלֻן
  choice: జెబూలూను కుమారుల
  rationale: בְּנֵי అనే వంశపరమైన పదాన్ని ‘కుమారులు’గా నిలిపి, לְ సూచించగల అనుబంధ భావాన్ని ప్రధాన పాఠంలో సహజమైన సంబంధవిభక్తితో వ్యక్తం చేశాం; ప్రాతినిధ్య భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֱלִיאָב
  choice: ఏలీయాబు
  rationale: హెబ్రీ వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן חֵלֹן
  choice: హేలోను కుమారుడైన
  rationale: హెబ్రీ వంశనామ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ తండ్రి-కుమారుని సంబంధాన్ని స్పష్టంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జాబితా-శైలిని పాటించాం. మూలంలోని క్రియలేని నామవాచక నిర్మాణాన్ని నిలిపి, సందర్భం నుంచి ‘అర్పణ తీసుకొచ్చాడు’ వంటి క్రియను పాఠ్యంలో చేర్చలేదు.
