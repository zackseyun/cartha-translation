  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: te
  text: సమాధాన బలి కోసం రెండు పశువులు, ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు.[అ] ఇది సువారు కుమారుడైన నెతనేలు అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: అ
    text: లేదా, “సహవాస బలి” లేదా “క్షేమ బలి.” హీబ్రూ పదం షెలామీమ్ (שְׁלָמִים)కు ఇతర సాధ్యమైన అనువాదాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలిగా
  rationale: వావ్, లామెద్ ఉపసర్గలు ముందరి అర్పణల జాబితాను కొనసాగిస్తూ ఈ బలి విభాగాన్ని పరిచయం చేస్తున్నాయి. זֶבַח הַשְּׁלָמִים అనే ఆచారపరమైన పదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపంగా ‘సమాధాన బలి’ ఎంచుకున్నాం.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సూచించే సమూహవాచకం; మూలంలో లింగం స్పష్టంగా చెప్పబడలేదు కాబట్టి ‘ఎద్దులు’ అని పరిమితం చేయలేదు.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם ప్రత్యేకంగా మగ గొర్రెలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పొట్టేళ్లు’ సహజమైన నిర్దిష్ట పదం.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתּוּדִים మగ మేకలను సూచిస్తుంది; లింగ నిర్దిష్టతను స్పష్టంగా నిలిపాం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים ఇక్కడ మగ గొర్రెపిల్లలను, בְּנֵי שָׁנָה వాటి వయసును సూచిస్తున్నాయి; రెండింటినీ స్పష్టంగా అనువదించాం.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పించిన అర్పణ
  rationale: ఈ పదబంధం జాబితా చివర దాత అర్పణను గుర్తించే ముగింపు సూత్రం. తెలుగు వాక్య నిర్మాణంలో దాతతో కలిపి క్రియాత్మకంగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: సూయారు కుమారుడు నెతనేలు
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు ధ్వన్యనుకరణలో ఇచ్చి, patronymic సంబంధాన్ని ‘కుమారుడు’తో నిలిపాం.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి వర్గం యొక్క భావవ్యాప్తి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ హీబ్రూ పదం సమాధానం, సహవాసం, క్షేమం వంటి అనుబంధ భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సుపరిచితమైన ఆచారపరమైన ‘సమాధాన బలి’ని ఉంచి, సందర్భం నిర్దేశించని ఒకే సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా మరియు బలుల జాబితా శైలిని సంక్షిప్తంగా నిలుపుతూ అనువదించబడింది. మూలంలోని పశువుల లింగ, వయస్సు వివరాలు సాధ్యమైనంత స్పష్టంగా కాపాడబడ్డాయి.
