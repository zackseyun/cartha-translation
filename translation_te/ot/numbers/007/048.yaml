source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י אֶפְרָ֑יִם אֱלִֽישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: te
  text: ఏడవ రోజున, ఎఫ్రాయిము కుమారుల నాయకుడు[a] అమ్మీహూదు కుమారుడైన ఎలీషామా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎఫ్రాయిము కుమారులకు నాయకుడు.’ హీబ్రూ ఉపసర్గ సంబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: בְּ ఉపసర్గ, יוֹם (‘రోజు’), క్రమసంఖ్య הַשְּׁבִיעִי (‘ఏడవ’) కలిసి కాలాన్ని సూచిస్తున్నాయి. ‘ఏడవ రోజున’ సహజమైన, ఖచ్చితమైన తెలుగు ప్రయోగం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: సంఖ్యాకాండము 7లో ఈ పదం అర్పణలు తీసుకొచ్చే గోత్రాధిపతిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నాయకుడు’ స్పష్టంగా ఉండి, పరిపాలనా మరియు ప్రాతినిధ్య పాత్రను తెలియజేస్తుంది.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: ఎఫ్రాయిము కుమారుల
  rationale: לְ ఇక్కడ నాయకునికీ ఎఫ్రాయిము కుమారులకీ ఉన్న సంబంధాన్ని లేదా అతడు వారికి ప్రాతినిధ్యం వహించడాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన సంబంధార్థక రూపం వాడి, ప్రత్యామ్నాయమైన దత్తివార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֱלִישָׁמָע
  choice: ఎలీషామా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించాం.
- source_word: בֶּן עַמִּיהוּד
  choice: అమ్మీహూదు కుమారుడైన
  rationale: ఇది సాధారణ హీబ్రూ పితృనామ నిర్మాణం. తెలుగులో వ్యక్తిని సహజంగా గుర్తించేలా ‘అమ్మీహూదు కుమారుడైన’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. హీబ్రూ వాక్యంలో క్రియ లేకపోవడం, తరువాతి వచనంతో దాని అనుసంధానం దృష్టిలో ఉంచుకొని అనువాదంలో కొత్త క్రియను చేర్చలేదు. పాదసూచిక గుర్తును అది వివరించే ‘నాయకుడు’ పదబంధం వద్ద ఉంచాం.
