  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: te
  text: పది షెకెల్ల[a] బరువుగల ఒక బంగారు పాత్ర, ధూపద్రవ్యంతో నిండినది;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘ఒక బంగారు పాత్ర, పది [బంగారం], ధూపద్రవ్యంతో నిండినది’ అని ఉంది. స్పష్టత కోసం, ఈ అధ్యాయంలో పునరావృతమయ్యే బరువు సూత్రాన్ని అనుసరించి ‘షెకెల్లు’ అని చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: పాత్ర
  rationale: ఈ అర్పణల జాబితాలో ధూపద్రవ్యాన్ని ఉంచే చిన్న పూజాపాత్రను సూచిస్తుంది. ఆకారాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజమైన తెలుగులో ‘పాత్ర’ అని అనువదించాం.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌కు అనుగుణంగా ఉన్న సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెల్ల బరువుగల బంగారు
  rationale: ఈ అధ్యాయంలోని పునరావృత జాబితా సూత్రం ప్రకారం సంఖ్యతో కూడిన ‘బంగారం’ పాత్ర బరువును సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు సందర్భం ద్వారా తెలిసే ‘షెకెల్లు’ మరియు ‘బరువుగల’ అనే పదాలను చేర్చాం.
- source_word: מְלֵאָה
  choice: నిండినది
  rationale: పాత్రలోని పదార్థాన్ని తెలిపే విధేయ విశేషణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: దేవునికి అర్పించడానికి ఉపయోగించే సుగంధ పదార్థాన్ని సూచించే ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించాం. మూలంలోని బరువు సూచనను సహజంగా వ్యక్తం చేస్తూనే, చేర్చిన కొలమాన పదాన్ని పాదసూచికలో వెల్లడించాం.
