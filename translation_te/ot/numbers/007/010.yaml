translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండు సమర్పణ క్రియల పునరుక్తిని నిలుపుతూ, మొదటి వాక్యభాగంలోని అక్షరార్థ అస్పష్టతను పాదసూచిక ద్వారా సంరక్షించాం.
