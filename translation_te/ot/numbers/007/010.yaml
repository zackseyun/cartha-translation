source:
  edition: WLC
  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: te
  text: బలిపీఠం అభిషేకించబడిన రోజున నాయకులు బలిపీఠ ప్రతిష్ఠను సమర్పించారు[a]. నాయకులు తమ అర్పణను బలిపీఠం ఎదుట సమర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, “బలిపీఠ ప్రతిష్ఠార్థమైన అర్పణను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: సమర్పించారు
  rationale: హిఫీల్ రూపంలోని קרב బలి ఆరాధన సందర్భంలో ‘దగ్గరకు తీసుకురావడం’ నుంచి ‘సమర్పించడం/అర్పించడం’ అనే భావాన్ని ఇస్తుంది. ‘సమర్పించారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, రెండు సందర్భాల ఆరాధనా భావాన్ని నిలుపుతుంది.
- source_word: הַנְּשִׂאִים
  choice: నాయకులు
  rationale: సంఖ్యాకాండంలో נָשִׂיא గోత్రాలకు ప్రాతినిధ్యం వహించే ప్రధానులను సూచిస్తుంది. ‘నాయకులు’ స్పష్టమైన ఆధునిక పదం; ‘రాజకుమారులు’ అనే రాజవంశ సంబంధిత అపార్థాన్ని నివారిస్తుంది.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: దాని ప్రతిష్ఠ అర్పణలను
  rationale: חֲנֻכָּה ప్రథమంగా ‘ప్రతిష్ఠ/అంకితం’ అని అర్థం. ఇక్కడ సమర్పించబడుతున్నవి ప్రతిష్ఠ సందర్భంగా తెచ్చిన కానుకలని సందర్భం తెలియజేస్తుంది; అందువల్ల తెలుగులో సహజంగా ఉండేందుకు ‘ప్రతిష్ఠ అర్పణలను’ అని ఇచ్చి, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: బలిపీఠం అభిషేకించబడిన రోజున
  rationale: בְּతో కూడిన క్రియానామ రూపం నిర్దిష్ట సమయాన్ని సూచిస్తుంది. కర్మవాచక తెలుగు రూపం మూలంలోని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘దానిని’ అనే సర్వనామానికి బదులు ‘బలిపీఠం’ అని చెప్పడం తెలుగులో స్పష్టతనిస్తుంది.
- source_word: קָרְבָּנָם
  choice: తమ అర్పణను
  rationale: קָרְבָּן ఆరాధనా సందర్భంలోని కానుక లేదా బలిని సూచించే సాధారణ పదం. ‘అర్పణ’ ఈ సందర్భంలోని పవిత్ర సమర్పణ భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: బలిపీఠం ఎదుట
  rationale: לִפְנֵי ఇక్కడ ప్రదేశాన్ని సూచిస్తూ ‘ముందు/ఎదుట’ అని అర్థం. ‘బలిపీఠం ఎదుట’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
