translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారసంబంధ జాబితా శైలిని నిలుపుతూ వాక్యాన్ని సహజంగా రూపొందించాం. ‘పరిశుద్ధస్థలం’ అనే పదం ఆలయాన్ని మాత్రమే సూచించేలా పరిమితం కాకుండా గుడార సందర్భానికీ సరిపోతుంది. కొలమానమైన ‘షెకెలు’ను లిప్యంతరీకరించి, దాని ప్రమాణ భావాన్ని పాఠ్యంలో స్పష్టం చేశాం.
