id: NUM.7.19
reference: Numbers 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: te
  text: 'అతడు తన అర్పణను సమర్పించాడు: నూట ముప్పై షెకెల్ల బరువుగల ఒక వెండి పళ్లెం[a]; డెబ్బై షెకెల్ల బరువుగల ఒక వెండి గిన్నె[b]—పరిశుద్ధస్థలపు షెకెలు కొలమానం ప్రకారం[c]; ఈ రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన సన్నని పిండితో నింపబడి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెండి పళ్లెం’కు బదులుగా ‘వెండి తట్టు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గిన్నె’కు బదులుగా ‘పాత్ర’ లేదా ‘బౌలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ మూలంలో ‘పరిశుద్ధస్థలపు షెకెలు ప్రకారం’ అని ఉంది; ఇది పరిశుద్ధస్థలంలో అంగీకరించబడిన ప్రామాణిక తూకాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: సమర్పించాడు
  rationale: హిఫీల్ రూపం బలిగా లేదా కానుకగా దగ్గరకు తీసుకురావడం, సమర్పించడం అనే భావాన్ని ఇస్తుంది. ఈ ఆచారసంబంధ జాబితాలో ‘సమర్పించాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణను
  rationale: దేవుని సన్నిధికి తీసుకువచ్చే బలి లేదా కానుకను సూచించే సాధారణ యాజక సంబంధ పదం; ‘అర్పణ’ సందర్భానుకూలంగా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: קַעֲרַת כֶּסֶף
  choice: వెండి పళ్లెం
  rationale: కַעֲרָה సాధారణంగా వెడల్పైన, అంతగా లోతులేని పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పళ్లెం’ సహజమైన సమానార్థకం; ‘పెద్ద పళ్లెం’ కూడా సాధ్యమే.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెల్ల బరువుగల
  rationale: స్త్రీలింగ ప్రత్యయం వెండి పళ్లెాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా బరువును పాత్రకు ముందే విశేషణ రూపంలో తెలిపింది.
- source_word: מִזְרָק
  choice: గిన్నె
  rationale: ఆచారాల్లో ఉపయోగించే లోతైన పాత్రను సూచిస్తుంది. ‘గిన్నె’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘పాత్ర’ అనే విస్తృత పదం కూడా సాధ్యమే.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది పరిశుద్ధస్థల సేవలో అమలైన ప్రామాణిక తూకాన్ని సూచిస్తుంది. ‘ప్రమాణం ప్రకారం’ అనే రూపం హీబ్రూ בְּ యొక్క కొలమాన భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఈ రెండూ ... నింపబడి ఉన్నాయి
  rationale: రెండు పాత్రలనూ కలిపి స్పష్టంగా సూచించే హీబ్రూ భావాన్ని నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగించింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణల్లో ఉపయోగించే బాగా శుద్ధి చేసిన సన్నని పిండిని సూచిస్తుంది. ‘మెత్తని పిండి’ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో కలిపి సిద్ధం చేసిన విధానాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה సాధారణ కానుకకన్నా ప్రత్యేకంగా ధాన్యార్పణను సూచిస్తుంది.
