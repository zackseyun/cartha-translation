  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: te
  text: మొదటి రోజున తన అర్పణను సమర్పించినవాడు యూదా గోత్రానికి చెందిన అమ్మీనాదాబు కుమారుడు నహ్షోను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదటి రోజున తన అర్పణను సమర్పించినవాడు యూదా గోత్రం తరఫున అమ్మీనాదాబు కుమారుడు నహ్షోను.” హీబ్రూలోని కృదంతాన్ని, గోత్రంతో సంబంధాన్ని తెలిపే పదబంధాన్ని ఈ విధంగానూ అనువదించవచ్చు; భావంలో గణనీయమైన మార్పు లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: సమర్పించినవాడు ... నయస్సోను
  rationale: హీబ్రూ కథన వాక్యాన్ని తెలుగులో సహజమైన నామవాచక వాక్య నిర్మాణంతో అందించింది; ‘అప్పుడు’ వంటి అదనపు కాలసూచక పదం అవసరం లేదు.
- source_word: הַמַּקְרִיב
  choice: సమర్పించినవాడు
  rationale: హిఫిల్ కృదంతం అర్పణను దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించే వ్యక్తిని సూచిస్తుంది. ‘సమర్పించినవాడు’ ఆ ఆరాధనాపరమైన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గతో కూడిన పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: אֶת קָרְבָּנוֹ
  choice: తన అర్పణను
  rationale: קָרְבָּן ఇక్కడ ప్రత్యక్ష బలిపీఠ/ప్రతిష్ఠాపన సందర్భంలోని అర్పణను సూచిస్తుంది; ‘కానుక’ కంటే ‘అర్పణ’ సందర్భోచితం.
- source_word: נַחְשׁוֹן
  choice: నయస్సోను
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన పేరురూపాన్ని ఉపయోగించింది.
- source_word: בֶּן עַמִּינָדָב
  choice: అమ్మీనాదాబు కుమారుడు
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో నేరుగా అందించింది.
- source_word: לְמַטֵּה יְהוּדָה
  choice: యూదా గోత్రానికి చెందిన
  rationale: לְ ఇక్కడ గోత్ర సంబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన అనుబంధార్థాన్ని ఇచ్చి, ప్రాతినిధ్య భావాన్ని పాదసూచికలో నిలిపింది.
