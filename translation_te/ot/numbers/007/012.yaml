  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ఆరాధనాపరమైన సందర్భానికి ‘అర్పణ’, ‘సమర్పించినవాడు’ అనే పదాలు వాడబడ్డాయి. హీబ్రూ వాక్యంలోని గోత్ర అనుబంధం/ప్రాతినిధ్యం మధ్య స్వల్ప సందిగ్ధతను పాదసూచికలో భద్రపరిచింది.
