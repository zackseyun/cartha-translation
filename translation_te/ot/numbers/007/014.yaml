translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అర్పణల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ, అధ్యాహారమైన బరువు ప్రమాణాన్ని పాఠ్యంలో స్పష్టం చేసి పాదసూచికలో వివరించాం.
