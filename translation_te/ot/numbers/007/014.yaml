  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: te
  text: పది షెకెలుల బరువున్న, ధూపద్రవ్యంతో నిండిన ఒక బంగారు పాత్ర[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక బంగారు పాత్ర, పది, ధూపద్రవ్యంతో నిండినది.’ చుట్టుపక్కల పునరావృతమయ్యే అర్పణ వివరణనుబట్టి ‘షెకెలులు’ అనే బరువు ప్రమాణం అధ్యాహారంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: పాత్ర
  rationale: ఆరాధనా సామగ్రి సందర్భంలో ఇది అరచేతిని కాకుండా ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాత్ర’ సహజంగా, విస్తృతార్థంతో ఉంది; ‘చెంచా’ అనడం సాధారణ భోజన సామగ్రిని సూచించే ప్రమాదం ఉంది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో సరిపడే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది షెకెలుల బరువున్న
  rationale: హీబ్రూలో ఇక్కడ ‘పది’ మాత్రమే ఉన్నా, చుట్టుపక్కల పునరావృతమయ్యే అర్పణ సూత్రం ఆధారంగా ‘షెకెలులు’ అనే బరువు ప్రమాణం అధ్యాహారంగా ఉంది. తెలుగులో భావం పూర్తిగా, సహజంగా ఉండేందుకు దాన్ని స్పష్టం చేశాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: מְלֵאָה
  choice: నిండిన
  rationale: పాత్రలోని పదార్థాన్ని సూచించే స్త్రీలింగ విధేయ విశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: ఆరాధనలో ఉపయోగించే సుగంధ పదార్థాన్ని స్పష్టంగా సూచిస్తుంది; కేవలం ‘ధూపం’ కంటే పాత్రను నింపే పదార్థం అనే భావం మరింత సహజంగా వ్యక్తమవుతుంది.
