  text: మందలోని ఒక ఎద్దు, ఒక పొట్టేలు, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్ల, దహనబలికి;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: మందలోనిది ఒక ఎద్దు
  rationale: פַּר అనేది ఎద్దును సూచిస్తుంది; בֶּן בָּקָר దాని పశువుల మందకు చెందినదని తెలిపే హీబ్రూ నుడికారం. జాబితా శైలిలో సహజంగా ఉండేలా రెండింటినీ కలిపి అనువదించాం.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి బలి జంతువు సంఖ్యను స్పష్టంగా చూపించే పునరావృత లెక్కింపు రూపాన్ని నిలుపుతుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలి సందర్భంలో వయోజన మగ గొర్రెను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: మూలపదం మగ గొర్రెపిల్లను సూచిస్తుంది; లింగభేదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: జంతువు ఒక సంవత్సరం వయసులో ఉండాలనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి ప్రామాణిక బలి పదం; జాబితా వాక్యనిర్మాణంలో ‘దహనబలిగా’ సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలి జాబితాకు తగిన సంక్షిప్త, గంభీర శైలి. మూలంలోని ప్రతి జంతువుకు పునరావృతమైన ‘ఒక’ అనే లెక్కింపు రూపం నిలుపబడింది.
