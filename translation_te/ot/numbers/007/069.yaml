    text: హీబ్రూ అక్షరార్థంగా, ‘ఒక ఎద్దు, పశువుల కుమారుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక గొర్రెపిల్ల’; ఇక్కడి హీబ్రూ పదం బలి సందర్భాల్లో తరచుగా మగ గొర్రెపిల్లను సూచిస్తుంది.
    reason: lexical_alternative
