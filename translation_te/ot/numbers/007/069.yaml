- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ పదం గొర్రెపిల్లను సూచిస్తుంది; బలి జాబితా సందర్భంలో లింగాన్ని స్పష్టంగా చూపేందుకు ‘మగ గొర్రెపిల్ల’ అని ఇచ్చాం.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: వయస్సును తెలిపే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְעֹלָה
  choice: దహనబలిగా అర్పించడానికి
  rationale: עֹלָה పూర్తిగా దహించే బలికి వాడే ప్రమాణ పదం; జాబితా సందర్భంలో ఉద్దేశాన్ని సహజంగా తెలిపే రూపం.
