translation:
  language: te
  text: దహనబలి కోసం మందలోనుండి ఒక ఎద్దు[a], ఒక పొట్టేలు, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్ల[b];
  philosophy: optimal-equivalence
  footnotes:
