  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తి పేరు ముందు అతని గోత్ర నాయకత్వం, పితృసంబంధం ఉంచడం ద్వారా తెలుగు వాక్యప్రవాహం సహజంగా చేయబడింది.
