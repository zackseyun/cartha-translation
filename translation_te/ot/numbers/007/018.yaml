  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: te
  text: రెండవ రోజున ఇశ్శాఖారు గోత్ర నాయకుడైన సూయారు కుమారుడు నెతనేలు తన అర్పణను సమర్పించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో కేవలం “సమర్పించాడు” అని ఉంది; ప్రతి గోత్ర నాయకుడు అర్పణను సమర్పించే సంఖ్యాకాండము 7లోని పునరావృత సందర్భాన్ని బట్టి “తన అర్పణను” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున
  rationale: ב־ ఉపసర్గ, ‘రోజు’ అనే నామవాచకం, క్రమసంఖ్య కలిసి కాలాన్ని సూచిస్తున్నాయి. కథన క్రమాన్ని అదనపు సమాచారం లేకుండా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִקְרִיב
  choice: తన అర్పణను సమర్పించాడు
  rationale: קרב ధాతువు హిఫీల్ రూపంలో బలి లేదా ప్రతిష్ఠాపన సందర్భంలో దేనినైనా సమర్పించడం అనే భావం ఇస్తుంది. మూల వచనంలో కర్మ స్పష్టంగా లేకపోయినా, సంఖ్యాకాండము 7లో పునరావృతమయ్యే తక్షణ సందర్భం అది అర్పణ అని చూపుతుంది; తెలుగులో వాక్యం సహజంగా ఉండేందుకు కర్మను చేర్చి పాదటిప్పణిలో తెలియజేశాం.
- source_word: נְתַנְאֵל
  choice: నెతనేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: בֶּן צוּעָר
  choice: సూయారు కుమారుడు
  rationale: హీబ్రూ పుత్రసంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన ‘కుమారుడు’తో నిలిపాం.
- source_word: נְשִׂיא
  choice: గోత్ర నాయకుడు
  rationale: ఈ సందర్భంలో נָשִׂיא రాజకుమారుని కాక, గోత్రానికి గుర్తింపు పొందిన నాయకుని సూచిస్తుంది. ‘గోత్ర’ అనే పదం సందర్భంలో అంతర్లీనంగా ఉన్న సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ గోత్రనామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
