lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: బలి సందర్భంలో ఈ సంయుక్త పదబంధం మగ మేకను సూచిస్తుంది. ‘మగ మేకపోతు’ జంతువు లింగాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: బలి అర్పణల జాబితాలోని సంఖ్యను హెబ్రీ పాఠం స్పష్టంగా పేర్కొంటుంది; ‘ఒక’ ఆ లెక్కింపు శైలిని నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలి సంబంధ సందర్భంలో חַטָּאת నైరూప్యమైన ‘పాపం’ కంటే పాపానికి సంబంధించిన నిర్దిష్ట బలిని సూచిస్తుంది. ‘బలిగా’ అనే రూపం לְ యొక్క కార్యార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
