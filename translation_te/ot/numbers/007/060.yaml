source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: te
  text: తొమ్మిదవ రోజున బెన్యామీను కుమారుల నాయకుడు[a] గిద్యోనీ కుమారుడైన అబీదాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బెన్యామీను కుమారులకు నాయకుడు.’ ఈ పదబంధంలోని హెబ్రీ ఉపసర్గ సంబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: తొమ్మిదవ రోజున
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గను తెలుగులో సహజమైన ‘రోజున’తో, క్రమసంఖ్యను ‘తొమ్మిదవ’తో అనువదించాం.
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఇక్కడ గోత్రానికి ప్రాతినిధ్యం వహించే గుర్తింపు పొందిన అధిపతిని సూచిస్తుంది. రాజరిక భావాన్ని కలిగించగల ‘రాజకుమారుడు’ కంటే ‘నాయకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִבְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారుల
  rationale: לְ ఇక్కడ సంబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించగలదు. ‘కుమారుల’ అనే రూపం గోత్ర వంశసంబంధమైన హెబ్రీ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: אֲבִידָן
  choice: అబీదాను
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: హెబ్రీ వంశనామ నిర్మాణాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: גִּדְעֹנִי
  choice: గిద్యోనీ
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: בְנֵי అనే లింగసూచక గోత్రపదం
  choice: బెన్యామీను కుమారులు
  alternative: బెన్యామీను ప్రజలు / బెన్యామీనీయులు
  rationale: మూలంలోని కుటుంబ-వంశ సంబంధమైన పుంలింగ బహువచనాన్ని అనవసరంగా తటస్థీకరించకుండా నిలిపాం; ఈ సందర్భంలో అది బెన్యామీను వంశగోత్రాన్ని సూచిస్తుంది.
- issue: לְ ఉపసర్గ సూచించే సంబంధం
  choice: బెన్యామీను కుమారుల నాయకుడు
  alternative: బెన్యామీను కుమారులకు నాయకుడు
  rationale: ప్రధాన పాఠంలో గోత్రంతో నాయకునికి ఉన్న సంబంధాన్ని సహజమైన తెలుగులో తెలిపాం; ప్రాతినిధ్య భావాన్ని సూచించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని స్వల్ప అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని క్రియలేని జాబితా-శీర్షిక నిర్మాణాన్ని అనవసరమైన క్రియను చేర్చకుండా నిలిపాం.
