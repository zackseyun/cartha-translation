lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేక
  rationale: ఈ ఇబ్రీయ జతపదం మేకలలోని మగ జంతువును సూచించే నుడికారం. ఆధునిక ప్రామాణిక తెలుగులో ‘మగ మేక’ స్పష్టంగా, సహజంగా ఉండి బలి జంతువు ప్రత్యేకతను నిలుపుతుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: అర్పణల జాబితాలోని గణనశైలికి అనుగుణంగా సంఖ్యావాచకాన్ని నేరుగా ‘ఒక’ అని అనువదించాం.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת సాధారణంగా అమూర్తమైన ‘పాపం’ను కాక పాపానికి సంబంధించిన బలిని సూచిస్తుంది. తెలుగులో ‘పాపపరిహార బలిగా’ ఈ ఆచారపరమైన అర్థాన్ని సహజంగా తెలియజేస్తుంది.
