translation:
  language: te
  text: పాపపరిహార బలిగా ఒక మగ మేకను;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ పదం חַטָּאת పాపం లేదా ఆచారపరమైన అపవిత్రతను పరిష్కరించే బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేక
  rationale: ఈ హీబ్రూ ప్రయోగం మేకలలో మగదానిని సూచిస్తుంది. ‘మగ మేక’ ఆధునిక తెలుగులో సహజంగా ఉండి, బలికి అర్పించే జంతువు లింగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: సంఖ్యాకాండము 7లోని పునరావృత అర్పణల జాబితా శైలిని నిలుపుతూ, హీబ్రూ సంఖ్యావాచకాన్ని స్పష్టంగా అనువదిస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת పాపం లేదా ఆచారపరమైన అపవిత్రతను తొలగించడానికి అర్పించే బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ తెలుగులో గుర్తించదగిన సాంప్రదాయిక పదప్రయోగం; לְ ఉపసర్గలోని ప్రయోజన/నియామక భావాన్ని ‘బలిగా’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలికి సంబంధించిన חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భంలో పదం ఒక బలిని సూచిస్తుందనేది స్పష్టం; అయితే అది పాపంతో పాటు ఆచారపరమైన అపవిత్రత పరిష్కారాన్ని కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో పరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, మరో సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన బలి-జాబితా శైలిని నిలిపాము. ‘ఒక’ అనే సంఖ్యను విడిచిపెట్టకుండా మూలంలోని లెక్కింపు నిర్మాణాన్ని కాపాడాము; వాక్యభాగం కొనసాగుతున్నదని సూచించడానికి అర్ధవిరామ చిహ్నాన్ని ఉంచాము.
