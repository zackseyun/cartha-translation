source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֶת הָ/עֲגָלֹ֖ת וְ/אֶת הַ/בָּקָ֑ר וַ/יִּתֵּ֥ן אוֹתָ֖/ם אֶל הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: te
  text: అప్పుడు మోషే బండ్లను, పశువులను తీసుకొని, వాటిని లేవీయులకు ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ అధ్యాయంలోని సందర్భాన్ని బట్టి ఈ పశువులు ఎద్దులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థమైన ‘తీసుకోవడం’ను నిలుపుతూ, కానుకగా సమర్పించిన వస్తువులను మోషే స్వీకరించి పంపిణీ చేసిన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: הָעֲגָלֹת
  choice: బండ్లను
  rationale: עגלה ఇక్కడ మందిర సేవలో సరుకు రవాణాకు ఉపయోగించే చక్రాల వాహనాలను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘బండ్లు’ సహజమైన పదం.
- source_word: הַבָּקָר
  choice: పశువులను
  rationale: בקר అనేది మందలోని పశువులను సూచించే సమూహవాచకం. అధ్యాయ సందర్భంలో అవి ఎద్దులని స్పష్టమైనా, ఈ వచనంలోని విస్తృత పదప్రయోగాన్ని ‘పశువులు’ నిలుపుతుంది.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן యొక్క సూటి అర్థం ‘ఇవ్వడం’; పరిపాలనాపరమైన కేటాయింపు భావాన్ని అనవసరంగా పదంలో చేర్చకుండా సందర్భానికే వదిలివేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: బండ్లు, పశువులు అనే రెండు సమూహాలనూ కలిపి సూచించే సహజ తెలుగు సర్వనామం.
- source_word: אֶל־הַלְוִיִּם
  choice: లేవీయులకు
  rationale: אֶל ఇక్కడ స్వాధీన బదిలీ దిశను సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి ‘లేవీయులకు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, క్రియల వరుసను ‘తీసుకొని ... ఇచ్చాడు’గా సహజంగా మలిచాం. మూలంలోని విస్తృత సమూహవాచకాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భంలోని నిర్దిష్టతను పాదటిప్పణిలో తెలిపాం.
