reference: Numbers 7:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: te
  text: మరియు సమాధాన బలి[a] కోసం రెండు పశువులు[b], ఐదు పొట్టేళ్లు, ఐదు మేకపోతులు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు. ఇది సూరీషద్దాయి కుమారుడైన షెలుమీయేలు అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలి,” లేదా “క్షేమ బలి.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం గోవుల జాతిని సాధారణంగా సూచిస్తుంది; కొందరు దీనిని “ఎద్దులు” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి కోసం
  rationale: జాబితాలోని తదుపరి అర్పణను సహజమైన తెలుగులో పరిచయం చేస్తుంది. שְׁלָמִים అనే ప్రత్యేక బలిపదానికి సంప్రదాయంగా గుర్తించదగిన ‘సమాధాన బలి’ని ఎంచుకున్నాం; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר అనేది ఎద్దులకే పరిమితం కాని, గోవుల జాతిని సూచించే సమూహపదం. అందువల్ల లింగాన్ని అనవసరంగా నిర్దేశించకుండా ‘పశువులు’ అని అనువదించాం.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם బలి సందర్భంలో పెద్ద మగ గొర్రెలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పొట్టేళ్లు’ సహజంగా, నిర్దిష్టంగా ఉంటుంది.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మేకపోతులు
  rationale: עַתֻּדִים మగ మేకలను నిర్దిష్టంగా సూచిస్తుంది; ‘మేకపోతులు’ ఆ లింగభేదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים లోని మగ లింగాన్ని, בְּנֵי שָׁנָה లోని వయస్సును రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: זֶה קָרְבַּן
  choice: ఇది … అర్పణ
  rationale: హీబ్రూ నామవాచక సూత్రాన్ని అనవసర క్రియను చేర్చకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: సూరీషద్దాయి కుమారుడైన షెలుమీయేలు
  rationale: వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, בֶּן అనే వంశసంబంధాన్ని ‘కుమారుడైన’గా సహజంగా తెలిపాం.
theological_decisions:
- issue: שְׁלָמִים అనే బలిపదం యొక్క అర్థవ్యాప్తి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ పదం శాంతి, సంపూర్ణ క్షేమం, దేవునితో సహవాసం వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ప్రధాన పాఠ్యంలో పరిచితమైన బలిపదాన్ని ఉంచి, దాని నిజమైన అర్థవ్యాప్తిని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. జంతువుల లింగం లేదా వయస్సు హీబ్రూలో స్పష్టంగా ఉన్న చోట వాటిని నిలిపాం; మూలంలో లేని నిర్దిష్టతను చేర్చలేదు.
