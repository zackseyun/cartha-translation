source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: te
  text: 'సమాధాన బలి కొరకు: రెండు పశువులు,[a] ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు. ఇది గిద్యోనీ కుమారుడైన అబీదాను అర్పణ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనిని ‘సహవాస బలి’ లేదా ‘క్షేమ బలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: సమాధాన బలిగా
  rationale: זֶבַח అనే బలి సంబంధ పదాన్నీ, שְׁלָמִים అనే సాంకేతిక బలి వర్గాన్నీ సహజమైన ఆధునిక తెలుగు పదబంధంలో నిలుపుతుంది. ముందరి జాబితాతో సంబంధాన్ని తెలుగు విరామచిహ్నం మరియు వాక్యప్రవాహం తెలియజేస్తాయి.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సమూహార్థంగా సూచిస్తుంది; మూలంలో లేని లింగాన్ని లేదా పనికి ఉపయోగించే ఎద్దులనే భావాన్ని చేర్చకుండా ‘పశువులు’ విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם ప్రత్యేకంగా మగ గొర్రెలను సూచిస్తుంది; ‘పొట్టేళ్లు’ దానికి సహజమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים మగ మేకలను సూచిస్తుంది; బలి జాబితాలోని లింగ భేదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים యొక్క మగ గొర్రెపిల్లల భావాన్నీ, בְּנֵי שָׁנָה యొక్క ఏడాది వయసు అనే భావాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పించిన అర్పణ
  rationale: హీబ్రూ నామవాక్యంలోని కాల అస్పష్టతను ‘ఇది’ ద్వారా నిలుపుతూ, తెలుగులో సహజమైన ముగింపు సూత్రంగా వ్యక్తి పేరుతో ‘అర్పించిన అర్పణ’ అని కూర్చింది.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: గిద్యోనీ కుమారుడు అబీదాను
  rationale: పేర్లను తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చి, patronymic నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి పదం యొక్క బహుళార్థం
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: సంప్రదాయంగా గుర్తించదగిన ‘సమాధాన బలి’ని ప్రధాన పాఠ్యంలో ఉంచి, ఈ హీబ్రూ పదంలో ఉన్న సహవాసం లేదా క్షేమం అనే ఇతర భావ ఛాయలను పాదసూచికలో చూపించడం ద్వారా ఒకే వ్యాఖ్యానాన్ని బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితా యొక్క సంక్షిప్తతను మరియు గంభీరతను కాపాడే శైలి. జంతువుల లింగం మూలంలో స్పష్టంగా ఉన్నచోట మాత్రమే తెలుగులో పేర్కొనబడింది.
