lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: ఈ హీబ్రూ పదబంధం మేకలలోని మగ జంతువును సూచిస్తుంది. ‘మగ మేకపోతు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, బలికి అర్పించే జంతువు మగదని తెలియజేస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: అర్పణల జాబితాలోని సంఖ్యను మూలపాఠం ప్రకారం స్పష్టంగా నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת సాధారణంగా పాపానికి సంబంధించిన నిర్దిష్ట బలిని సూచిస్తుంది; తెలుగు బైబిలు వాడుకలో ‘పాపపరిహార బలి’ సహజంగా, స్పష్టంగా ఉంటుంది. לְ ఉపసర్గను సందర్భానుసారంగా ‘బలిగా’ అని వ్యక్తం చేశాం.
