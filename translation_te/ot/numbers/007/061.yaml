  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. జాబితా స్వరూపాన్ని నిలుపుతూ, రెండు పాత్రల బరువులకూ పరిశుద్ధ స్థలపు ప్రమాణం వర్తిస్తుందని తెలుగులో స్పష్టంగా అమర్చబడింది. ‘షెకెలు’ను చారిత్రక బరువు ప్రమాణంగా లిప్యంతరీకరించి ఉంచాం.
