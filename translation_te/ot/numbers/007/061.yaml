base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం నూట ముప్పై షెకెలుల బరువున్న ఒక వెండి పళ్లెం[a], డెబ్బై షెకెలుల బరువున్న ఒక వెండి గిన్నె[b]; ఆ రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన సన్నని పిండితో నిండి ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పళ్లెం’కు బదులుగా ‘పాత్ర’ అని కూడా అనువదించవచ్చు (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: ‘గిన్నె’కు బదులుగా ‘లోతైన పాత్ర’ అని కూడా అనువదించవచ్చు (מִזְרָק); ఇది పరిశుద్ధస్థల సేవలో ఉపయోగించే పాత్ర.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధనా సందర్భంలో దేవుని సమక్షానికి తీసుకువచ్చే సమర్పణను సూచించే קָרְבָּןకు ‘అర్పణ’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה సాధారణంగా వెడల్పుగా, లోతు తక్కువగా ఉండే పాత్రను సూచిస్తుంది; ‘పళ్లెం’ దాని ఆకృతిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: హీబ్రూ వాక్యంలోని ‘దాని బరువు నూట ముప్పై’ అనే భావాన్ని తెలుగులో సహజమైన విశేషణ పదబంధంగా అందిస్తుంది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק బలిపీఠ సేవలో వాడే లోతైన పాత్ర. ‘గిన్నె’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, ఆ పాత్ర యొక్క ఖచ్చిత రూపం నిర్ధారించలేని విషయాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: పాత్ర బరువును స్పష్టంగా తెలియజేస్తుంది; ‘షెకెలు’ను ఇక్కడ బరువు ప్రమాణంగానే ఉంచుతుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది ఆరాధనా కేంద్రంలో అమలైన ప్రామాణిక బరువును సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ అనే పదప్రయోగం మూలంలోని cultic భావాన్ని కాపాడుతుంది.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ఆ రెండూ నిండి ఉన్నాయి
  rationale: రెండు వెండి పాత్రలనూ స్పష్టంగా తిరిగి సూచిస్తూ హీబ్రూలోని బహువచన భావాన్ని కాపాడుతుంది.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: అర్పణకు ఉపయోగించే బాగా శుద్ధి చేసిన మెత్తని పిండిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెతో మిశ్రమం చేయబడినదనే passive participial భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ధాన్యంతో చేసే ప్రత్యేక అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ఇది సందర్భానుసారంగా మరింత ఖచ్చితం.
