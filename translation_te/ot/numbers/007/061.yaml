  terminology: ‘అర్పణ,’ ‘షెకెలు,’ ‘వెండి పళ్లెం,’ ‘వెండి గిన్నె,’ ‘సన్నని పిండి,’ ‘ధాన్యార్పణ’ అన్న ఎంపికలు సందర్భానికి, మూలానికి అనుకూలంగా ఉన్నాయి. מִזְרָק యొక్క ఖచ్చిత ఆకృతి నిర్దిష్టం కానందున ‘గిన్నె’తో పాటు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం సముచితం.
