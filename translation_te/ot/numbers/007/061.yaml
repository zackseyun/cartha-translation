  source_fidelity: మూల హీబ్రూ రెండు పాత్రల బరువులను ‘పరిశుద్ధ షెకెలు’ అనే ఆరాధనా-ప్రమాణ బరువు ప్రకారం తెలియజేస్తుంది. ముసాయిదాలోని ‘ఈ బరువులు ... లెక్కించబడినవి’ భావం మూలంలో స్పష్టంగా లేని అదనపు క్రియను ప్రవేశపెడుతుంది. ప్రమాణ-వాక్యభాగాన్ని రెండు బరువులకు నేరుగా వర్తింపజేయడం మరింత నిష్ఠావంతం.
