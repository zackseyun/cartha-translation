source:
  edition: WLC
  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: te
  text: “వాటిని వారి నుండి తీసుకోండి[a]. అవి సమావేశపు గుడారం సేవ కోసం ఉపయోగపడాలి. ప్రతి ఒక్కరి సేవకు తగినట్లుగా వాటిని లేవీయులకు ఇవ్వండి[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో అక్షరార్థంగా, “అవి సమావేశపు గుడారం సేవను చేయుటకు ఉండాలి.” ఇక్కడ సందర్భంలోని వస్తువులు సేవలో ఉపయోగించబడతాయనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ భాషలో, “ప్రతి వ్యక్తి తన సేవకు తగినట్లుగా.” ఇది ప్రతి లేవీయునికి లేదా అతనికి అప్పగించిన సేవకు అనుగుణమైన పంపిణీని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: తీసుకో
  rationale: לקח క్రియ యొక్క ఆజ్ఞారూపం; సమర్పించిన వస్తువులను మోషే స్వీకరించాలనే ప్రత్యక్ష ఆజ్ఞను సహజంగా తెలియజేస్తుంది.
- source_word: מֵאִתָּם
  choice: వారి దగ్గర నుంచి
  rationale: సమర్పించిన నాయకులే మూలమని సూచించే విభక్త్యర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: అవి ... సేవ కోసం ఉపయోగపడాలి
  rationale: సందర్భంలోని బండ్లు, ఎద్దులు జడవస్తువులు/జంతువులు కావడంతో, హీబ్రూ ఉద్దేశార్థక నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోజనార్థక వాక్యంగా అందిస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు అరణ్య పరిశుద్ధస్థలానికి తెలుగులో స్థిరపడినλισ designation; దేవుడు తన ప్రజలను కలుసుకునే గుడారాన్ని సూచిస్తుంది.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: వాటిని లేవీయులకు ఇవ్వాలి
  rationale: נתן యొక్క ప్రాథమిక ‘ఇవ్వు’ భావాన్ని నిలుపుతూ, ఉపయోగార్థం వారికి అప్పగించడాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: ఎవరి సేవకు తగినట్లు వారికి
  rationale: אִישׁ యొక్క పంపిణీ భావాన్నీ, כְּפִי అనే ‘అనుగుణంగా/అవసరానికి తగినట్లు’ భావాన్నీ సహజ తెలుగులో స్పష్టం చేస్తుంది.
