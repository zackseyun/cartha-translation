- from: “వాటిని వారి దగ్గర నుంచి తీసుకో. అవి ప్రత్యక్ష గుడారపు సేవ కోసం ఉపయోగపడాలి. వాటిని లేవీయులకు ఇవ్వాలి; ఎవరి సేవకు తగినట్లు వారికి ఇవ్వాలి.”
