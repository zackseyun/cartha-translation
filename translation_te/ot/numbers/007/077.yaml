source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: te
  text: సమాధానబలి కోసం రెండు పశువులు,[a] ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు. ఇది ఓక్రాను కుమారుడైన పగీయేలు అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని ‘సహవాస బలి’ లేదా ‘క్షేమ బలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים
  choice: సమాధాన బలిగా
  rationale: జాబితాలోని తదుపరి అర్పణ విభాగాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. שְׁלָמִים అనే ఆచార సంబంధ పదానికి సంప్రదాయబద్ధమైన ‘సమాధాన బలి’ని ఉపయోగించాం; దాని విస్తృత భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר సమూహార్థకంగా గోవుల జాతి పశువులను సూచిస్తుంది; మూలంలో లింగం నిర్దిష్టంగా లేనందున ‘రెండు ఎద్దులు’ అని పరిమితం చేయలేదు.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם ప్రత్యేకంగా మగ గొర్రెలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేళ్లు’ సహజమైన పదం.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים మగ మేకలను సూచిస్తుంది; లింగభేదాన్ని స్పష్టంగా నిలిపాం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים లోని మగ లింగ సూచనను, בְּנֵי שָׁנָה లోని ఏడాది వయసును రెండింటినీ నిలిపాం.
- source_word: זֶה קָרְבַּן
  choice: ఇది ... అర్పించిన అర్పణ
  rationale: పునరావృతమయ్యే ముగింపు సూత్రాన్ని తెలుగు కథనశైలికి సహజంగా భూతకాల క్రియతో అందించాం.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: ఆక్రాను కుమారుడు పగీయేలు
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు ధ్వన్యనుకరణలో ఇచ్చి, patronymic సంబంధాన్ని ‘కుమారుడు’తో స్పష్టం చేశాం.
theological_decisions:
- issue: הַשְּׁלָמִים అనే బలి వర్గం యొక్క భావపరిధి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ పదం సమాధానం, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో గుర్తుపట్టదగిన సంప్రదాయ పదాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం; ఏ ఒక్క భావానికీ సిద్ధాంతపరంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే జాబితా శైలిని ఉపయోగించాం. మూలంలోని జంతువుల లింగ, వయస్సు భేదాలను సాధ్యమైనంత స్పష్టంగా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
