id: NUM.7.59
reference: Numbers 7:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: te
  text: మరియు సమాధాన బలి[a] కోసం రెండు పశువులు[b], ఐదు పొట్టేళ్లు, ఐదు మగ మేకలు, ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు. ఇది పెదాహ్సూరు కుమారుడైన గమలీయేలు అర్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహవాస బలి’ లేదా ‘క్షేమ బలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీయ పదం గోవుల జాతికి చెందిన పశువులను సాధారణంగా సూచిస్తుంది; సంప్రదాయంగా ‘రెండు ఎద్దులు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి కోసం
  rationale: జాబితాలోని చివరి అర్పణాంశాన్ని పరిచయం చేసే సంధి-ఉపసర్గల భావాన్ని సహజమైన తెలుగులో తెలిపింది. זֶבַח ను ‘బలి’గా, శాస్త్రోక్త బహువచన పదమైన שְׁלָמִים ను సంప్రదాయబద్ధంగా, గుర్తుపట్టదగిన రీతిలో ‘సమాధాన బలి’గా అనువదించింది.
- source_word: בָּקָר שְׁנַיִם
  choice: రెండు పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సూచించే సమూహవాచకం; మూలంలో లింగం లేదా పనిని ప్రత్యేకంగా నిర్దేశించనందున ‘రెండు ఎద్దులు’ అని సంకుచితం చేయకుండా విస్తృతార్థాన్ని నిలిపింది.
- source_word: אֵילִם חֲמִשָּׁה
  choice: ఐదు పొట్టేళ్లు
  rationale: אֵילִם వయోజన మగ గొర్రెలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేళ్లు’ స్పష్టమైన, సహజమైన పదం.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: ఐదు మగ మేకలు
  rationale: עַתֻּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; లింగ సమాచారాన్ని స్పష్టంగా నిలిపింది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: ఏడాది వయసున్న ఐదు గొర్రెపిల్లలు
  rationale: ‘ఒక సంవత్సరపు పిల్లలు’ అనే హెబ్రీయ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ బలిపశువుల వయస్సును కాపాడింది.
- source_word: זֶה קָרְבַּן
  choice: ఇది … అర్పించిన అర్పణ
  rationale: క్రియలేని హెబ్రీయ నిర్దేశక వాక్యాన్ని తెలుగులో కాలాన్ని అనవసరంగా ముందుకు తేవకుండా అందించింది; వ్యక్తితో సంబంధాన్ని సహజంగా చూపేందుకు ‘అర్పించిన’ వాడింది.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: పెదాసూరు కుమారుడు గమలీయేలు
  rationale: హెబ్రీయ వ్యక్తినామాలను అనువదించకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ రూపాల్లో ఇచ్చి, בֶּן సంబంధాన్ని ‘కుమారుడు’గా తెలిపింది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదంలోని భావవ్యాప్తి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ పదం సమాధానం, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో గుర్తుపట్టదగిన సంప్రదాయ పదాన్ని ఉంచి, ఇతర సాధ్య భావాలను పాదసూచికలో తెలిపింది; ఒక్క భావానికే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని అనుసరించింది. ‘సమాధాన బలి,’ ‘అర్పణ’ వంటి సుపరిచిత బైబిలు పదాలను నిలిపి, జంతువుల సంఖ్య, జాతి, లింగం, వయస్సును స్పష్టంగా తెలిపింది.
