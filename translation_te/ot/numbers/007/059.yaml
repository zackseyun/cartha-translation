  terminology: ‘సమాధాన బలి’ అనేది שְׁלָמִים కు గుర్తుపట్టదగిన సంప్రదాయ తెలుగు పదం; పాదసూచికలోని ప్రత్యామ్నాయాలు దాని అర్థవ్యాప్తిని తగినంతగా సూచిస్తున్నాయి. ‘పొట్టేళ్లు,’ ‘మగ మేకలు,’ ‘గొర్రెపిల్లలు’ పదాలు సందర్భానుకూలంగా ఉన్నాయి.
  issues:
