lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: ఈ హీబ్రూ నిర్మాణం మగ మేకను సూచిస్తుంది. ‘మగ మేకపోతు’ అనేది బలికి అర్పించే జంతువు లింగాన్ని స్పష్టంగా తెలియజేస్తూ సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే రూపం.
- source_word: אֶחָד
  choice: ఒక
  rationale: హీబ్రూలో సంఖ్య స్పష్టంగా ఉంది; సంఖ్యాకాండము 7లోని పునరావృత కానుకల జాబితా శైలిని నిలుపుకోవడానికి ‘ఒక’ అని అనువదించబడింది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת అమూర్తమైన ‘పాపం’ కంటే పాపానికి సంబంధించిన ప్రత్యేక బలిని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో సహజంగా, ఆచారపరమైన అర్థం స్పష్టంగా ఉండేందుకు ‘పాపపరిహార బలిగా’ ఎంచుకోబడింది.
