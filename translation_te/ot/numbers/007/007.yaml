translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘సేవ’ అనే పదం పవిత్ర గుడారానికి సంబంధించిన నియమిత బాధ్యత భావాన్ని నిలుపుతుంది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
