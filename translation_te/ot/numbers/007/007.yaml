source:
  edition: WLC
  text: אֵ֣ת שְׁתֵּ֣י הָ/עֲגָלֹ֗ת וְ/אֵת֙ אַרְבַּ֣עַת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י גֵרְשׁ֑וֹן כְּ/פִ֖י עֲבֹדָתָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: te
  text: అతడు రెండు బండ్లను, నాలుగు పశువులను[a] గెర్షోను కుమారులకు వారి సేవ ప్రకారం ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాలుగు ఎద్దులను.’ హీబ్రూ పదం గోవుల జాతి పశువులను సమూహార్థంలో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: బండ్లు
  rationale: עֲגָלָה రవాణాకు ఉపయోగించే బండి లేదా శకటాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘బండ్లు’ సహజంగా ఉండి, ప్రత్యక్ష సందర్భానికి సరిపోతుంది.
- source_word: הַבָּקָר
  choice: పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన పశువులను సమూహార్థంలో సూచిస్తుంది. బండ్లు లాగే సందర్భం ఉన్నప్పటికీ, ‘ఎద్దులు’ అని లింగం లేదా వినియోగాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘పశువులు’ మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: గేర్షోను కుమారులకు
  rationale: హీబ్రూ పదబంధంలోని ‘గేర్షోను కుమారులు’ అనే వంశసంబంధ రూపాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: כְּפִי עֲבֹדָתָם
  choice: వారి సేవకు తగినట్లుగా
  rationale: כְּפִי అనేది ‘దానికి అనుగుణంగా/తగినట్లుగా’ అనే భావాన్ని, עֲבֹדָה ఇక్కడ వారికి అప్పగించబడిన పవిత్ర గుడార సేవను సూచిస్తుంది. ఈ అనువాదం కేటాయింపు వారి సేవ అవసరానికి అనుగుణమని సహజంగా తెలియజేస్తుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: క్రియ యొక్క సాధారణ అర్థమైన ‘ఇచ్చాడు’ను నిలుపుతుంది; ‘కేటాయించాడు’ అనే సందర్భానుసారమైన అదనపు భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
