source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: te
  text: 'వారు తమ అర్పణను యాహ్వే ఎదుట తీసుకువచ్చారు: కప్పబడిన ఆరు బండ్లు[a] మరియు పన్నెండు ఎద్దులు—ప్రతి ఇద్దరు నాయకులకు ఒక బండి, ప్రతి నాయకునికి ఒక ఎద్దు; వాటిని నివాస గుడారం ఎదుట సమర్పించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హెబ్రీ పదబంధాన్ని సంప్రదాయంగా ‘కప్పబడిన బండ్లు’ అని అర్థం చేసుకుంటారు; అరుదైన צָב పదం యొక్క ఖచ్చితమైన భావం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: తమ అర్పణను
  rationale: ఆరాధనా సందర్భంలో దేవుని సన్నిధికి తీసుకొచ్చే కానుకను సూచించే కָרְבָּן పదానికి ‘అర్పణ’ సహజమైనదీ, సందర్భోచితమైనదీ.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని, తీసుకురావడాన్ని తెలిపే క్రియతో సహజంగా కలిపి ‘సన్నిధికి’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: עֶגְלֹת צָב
  choice: కప్పు ఉన్న ... బండ్లు
  rationale: עֶגְלֹת అనగా బండ్లు; అరుదైన צָב పదాన్ని సాంప్రదాయిక అవగాహన ప్రకారం కప్పు లేదా పైకప్పు ఉన్నవిగా అనువదించాం; పదార్థ అనిశ్చితిని పాదసూచికలో సూచించాం.
- source_word: בָּקָר / שׁוֹר
  choice: ఎద్దులు / ఎద్దు
  rationale: రవాణా సందర్భం, అలాగే తరువాతి ఏకవచన שׁוֹר ఆధారంగా, పని కోసం ఉపయోగించే మగ పశువులను సూచించే ‘ఎద్దులు’ సరైన ఎంపిక.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: ప్రతి ఇద్దరు నాయకులకు ఒక బండి
  rationale: ఈ పంపిణీ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; נְשִׂיאִים ఇక్కడ గోత్ర నాయకులను సూచిస్తుంది.
- source_word: וְשׁוֹר לְאֶחָד
  choice: ప్రతి నాయకునికి ఒక ఎద్దు
  rationale: ‘ఒక్కొక్కరికి’ అనే మూలంలోని పంపిణీ భావాన్ని స్పష్టం చేయడానికి పూర్వపదమైన నాయకులను పునరుక్తి చేశాం.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: వాటిని ... సమర్పించారు
  rationale: బండ్లు, ఎద్దులను బలిగా వధించారని సూచించకుండా, పవిత్ర స్థలంలో అధికారికంగా అందజేసిన భావాన్ని ‘సమర్పించారు’ తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: מִשְׁכָּן యొక్క ‘నివాసస్థలం’ అనే మూలభావాన్ని, ఇశ్రాయేలు పవిత్ర గుడారాన్ని సూచించే సందర్భంతో కలిపి తెలియజేస్తుంది; దీనిని ‘సమావేశ గుడారం’తో కలపదు.
theological_decisions:
- issue: దేవుని నామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- issue: הקריב క్రియకు బలిపరమైన అర్థం ఇవ్వాలా
  choice: సమర్పించారు
  alternative: బలిగా అర్పించారు; దగ్గరకు తెచ్చారు
  rationale: ఇక్కడ సమర్పించిన వస్తువుల్లో బండ్లు కూడా ఉన్నాయి. కాబట్టి వధతో కూడిన బలి అని అతిగా నిర్దిష్టపరచకుండా, ఆరాధనా సంబంధమైన అధికారిక సమర్పణ భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలిని ఉపయోగించాం. పంపిణీ నిర్మాణాలను ‘ప్రతి ఇద్దరికి’, ‘ప్రతి నాయకునికి’ అని సహజంగా వ్యక్తం చేశాం; మూలంలోని సమాంతర నిర్మాణాన్ని డాష్ ద్వారా నిలిపాం.
