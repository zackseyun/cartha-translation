source:
  edition: WLC
  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/050.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: te
  text: పది షెకెలుల బరువుగల ఒక బంగారు గిన్నె[a]; అది ధూపద్రవ్యంతో నిండి ఉంది;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బంగారు పళ్ళెం’ లేదా ‘బంగారు పాత్ర.’ సంప్రదాయ అనువాదాల్లో కొన్నిసార్లు ‘చెంచా’ అని ఉంటుంది; అయితే హీబ్రూ పదం సాధారణంగా ఒక చిన్న ఆచారపాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: గిన్నె
  rationale: గుడారపు ఆరాధన సామగ్రి జాబితాలో ఈ పదం అరచేతిని కాక, ధూపద్రవ్యాన్ని ఉంచే చిన్న ఆచారపాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘గిన్నె’ సహజంగా, విస్తృతార్థంతో ఉంటుంది.
- source_word: אַחַת
  choice: ఒక
  rationale: స్త్రీలింగ నామవాచకమైన כַּף‌తో ఏకీభవించే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది షెకెలుల బరువుగల
  rationale: మూలంలో ‘షెకెలులు’ స్పష్టంగా లేకపోయినా, సంఖ్యాకాండము 7లో పునరావృతమయ్యే జాబితా సూత్రంలో బరువు ప్రమాణం సందర్భం ద్వారా గ్రహించబడుతుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు దాన్ని పూరించాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని సూచించే సహజమైన తెలుగు విశేషణ రూపం.
- source_word: מְלֵאָה
  choice: నిండి ఉంది
  rationale: పాత్రలోని పదార్థాన్ని తెలిపే విధేయ విశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: ఆరాధనలో కాల్చే సుగంధ పదార్థాన్ని స్పష్టంగా సూచిస్తుంది; కేవలం పొగ అనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని కాపాడుతూ గౌరవప్రదమైన సరళ భాష వాడబడింది. మూలంలోని సంక్షిప్త బరువు సూచనను సందర్భానుసారంగా స్పష్టం చేశాం; వాక్యాంతంలోని సెమీకోలన్ పరిసర జాబితాతో అనుసంధానాన్ని నిలుపుతుంది.
