source:
  edition: WLC
  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/075.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: te
  text: మందలోనుంచి ఒక ఎద్దును, ఒక పొట్టేలును, ఒక సంవత్సరం వయసున్న ఒక మగ గొర్రెపిల్లను దహనబలిగా;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: మందలోనుంచి ఒక కోడెను
  rationale: פַּר అనేది బలికి అర్పించే మగ పశువును సూచిస్తుంది; בֶּן־בָּקָר దానిని పశువుల మందకు చెందినదిగా నిర్దిష్టం చేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ఈ రెండింటినీ కలిపి అనువదించాం.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: వయోజన మగ గొర్రెకు, ముఖ్యంగా బలి సందర్భంలో, ‘పొట్టేలు’ సహజమైన నిర్దిష్ట తెలుగు పదం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ పదం గొర్రెపిల్లను, బలి జాబితాలో సాధారణంగా మగ గొర్రెపిల్లను సూచిస్తుంది; లింగ నిర్దిష్టతను స్పష్టంగా ఉంచాం.
- source_word: בֶּן־שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసున్న
  rationale: ‘తన సంవత్సరపు కుమారుడు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం; జంతువు వయస్సును స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచించే ప్రామాణిక బలి పదం; לְ ఉపసర్గ ప్రయోజనాన్ని సూచిస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి జంతువు సంఖ్యను విడివిడిగా చూపే పునరుక్త సంఖ్యావాచకాన్ని మూలపాఠం ప్రకారం నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బలి-జాబితా శైలి. ఇది ముందరి వచనాల నుంచి కొనసాగుతున్న జాబితా కావడంతో చివర సెమికోలన్ ఉంచబడింది.
