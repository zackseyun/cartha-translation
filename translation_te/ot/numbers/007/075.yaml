  terminology: ‘పొట్టేలు’ accurately renders אַיִל (ram), and ‘మగ గొర్రెపిల్ల’ accurately renders כֶּבֶשׂ. ‘ఒక సంవత్సరం వయసున్న’ clearly conveys בֶּן־שְׁנָתוֹ. ‘దహనబలి’ is a suitable standard rendering of עֹלָה in this concise list context.
