  text: one male goat for a sin offering;[a]
translation:
  language: te
  text: పాప పరిహార బలిగా ఒక మేకపోతు;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “పాప పరిహార బలిగా మేకలలో ఒక మగ మేక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేకపోతు
  rationale: ఈ హీబ్రూ సంయుక్త పదబంధం అక్షరార్థంగా ‘మేకలలోని బొచ్చుగల మగది’ అని ఉన్నా, వాడుకలో మగ మేకను సూచిస్తుంది. ‘మగ మేకపోతు’ బలి జంతువు లింగాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: సంఖ్యావాచకాన్ని స్పష్టంగా నిలిపి, సంఖ్యాకాండము 7లోని పునరావృత అర్పణల జాబితా శైలిని కాపాడుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల జాబితా సందర్భంలో חַטָּאת అమూర్తమైన ‘పాపం’ కంటే ప్రత్యేక బలి వర్గాన్ని సూచిస్తుంది. לְ ఉపసర్గను తెలుగులో సహజంగా ‘బలిగా’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: బలుల సందర్భంలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: పాపం
  rationale: ఇది గోత్ర నాయకులు అర్పించిన బలి సామగ్రి జాబితా. అందువల్ల ఈ నామవాచకం పాపం అనే భావాన్ని మాత్రమే కాక, పాపానికి సంబంధించిన నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది; తరువాతి సిద్ధాంతార్థాలను ఇందులోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని సంఖ్యావాచకాన్ని, జంతువు లింగాన్ని, బలి వర్గాన్ని స్పష్టంగా నిలిపాం.
