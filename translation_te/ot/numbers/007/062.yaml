  yaml_path: translation/ot/numbers/007/062.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: te
  text: పది షెకెలుల బరువుగల ఒక బంగారు ధూపపాత్ర[a]; అది ధూపద్రవ్యంతో నిండివుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక పాత్ర, పది బంగారం, ధూపద్రవ్యంతో నిండినది.’ సంఖ్యాకాండము 7లో పునరావృతమయ్యే అర్పణ సూత్రం ఆధారంగా ‘షెకెలులు’ అనే బరువు ప్రమాణం ఇక్కడ అధ్యాహారంగా తీసుకోబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: ధూపపాత్ర
  rationale: ఇక్కడ ఈ పదం అరచేతిని కాక, ధూపద్రవ్యాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది. తెలుగు పాఠకులకు సందర్భం వెంటనే స్పష్టమయ్యేలా ‘ధూపపాత్ర’ సహజంగా ఉంది.
- source_word: אַחַת
  choice: ఒక
  rationale: పాత్రల సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: עֲשָׂרָה
  choice: పది
  rationale: బంగారు పాత్ర బరువును తెలిపే సంఖ్య.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్ర తయారైన పదార్థాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: עֲשָׂרָה זָהָב
  choice: పది షెకెలుల బరువుగల
  rationale: హీబ్రూ సంక్షిప్తంగా ‘పది బంగారం’ అని ఉన్నా, సంఖ్యాకాండము 7లో పునరావృతమయ్యే అర్పణ సూత్రం ప్రకారం ‘షెకెలులు’ అనే బరువు ప్రమాణం అధ్యాహారంగా ఉంది.
- source_word: מְלֵאָה
  choice: నిండివుంది
  rationale: స్త్రీలింగ పాత్రకు సంబంధించిన విధేయ విశేషణ భావాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపద్రవ్యం
  rationale: ఆరాధనలో ఉపయోగించే సుగంధ ధూప పదార్థాన్ని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ సంక్షిప్త బరువు ప్రయోగాన్ని ప్రధాన పాఠంలో సహజంగా విప్పి చెప్పి, అక్షర నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
