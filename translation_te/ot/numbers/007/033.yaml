  yaml_path: translation/ot/numbers/007/033.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: te
  text: మందలోని ఒక ఎద్దు[a], ఒక పొట్టేలు, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్ల[b], దహనబలి కోసం;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక ఎద్దు, పశువుల మంద కుమారుడు’—ఇది మందకు చెందిన ఎద్దును సూచించే నుడికారం; దీనిని తరచుగా కోడెదూడగా కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన మొదటి సంవత్సరంలో ఉన్న ఒక మగ గొర్రెపిల్ల.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: మందలోని ఒక కోడెదూడ
  rationale: פַּר అనేది ఎద్దు లేదా కోడెదూడను సూచిస్తుంది; בֶּן בָּקָר అక్షరార్థంగా ‘పశువుల మంద కుమారుడు’ అనే హీబ్రూ నుడికారం. సహజమైన తెలుగులో జంతువు పశువుల మందకు చెందినదని తెలియజేస్తూ ‘మందలోని కోడెదూడ’గా ఇచ్చాం.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలి సందర్భంలో వయోజన మగ గొర్రెను సూచించే ప్రామాణిక పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ పదం గొర్రెపిల్లను, బలి జాబితాల్లో సాధారణంగా మగ గొర్రెపిల్లను సూచిస్తుంది; లింగ నిర్దిష్టతను స్పష్టంగా నిలిపాం.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: ఈ హీబ్రూ వయస్సు నుడికారం ‘ఒక సంవత్సరం వయసున్న’ లేదా ‘మొదటి సంవత్సరంలో ఉన్న’ అనే భావాన్ని ఇస్తుంది; ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని వాడాం.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి ప్రామాణిక బలి పదం; జాబితా నిర్మాణానికి సరిపోయేలా ‘దహనబలిగా’ అని అనువదించాం.
- source_word: אֶחָד
  choice: ఒక
  rationale: ప్రతి బలి జంతువు సంఖ్యను సూచించే పునరావృత సంఖ్యావాచకాన్ని తెలుగులో స్థిరంగా ‘ఒక’గా ఇచ్చాం.
