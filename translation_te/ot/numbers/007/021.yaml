  yaml_path: translation/ot/numbers/007/021.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: te
  text: మందలోని ఒక కోడెదూడ, ఒక పొట్టేలు, ఏడాది వయసున్న ఒక మగ గొర్రెపిల్ల దహనబలిగా;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: మందలోనుండి ఒక కోడెదూడ
  rationale: פַּר అనేది బలి సందర్భంలో ఎద్దు లేదా కోడెదూడను సూచిస్తుంది; בֶּן בָּקָר అనే హీబ్రూ జాతివాచక ప్రయోగాన్ని సహజమైన తెలుగులో ‘మందలోనుండి’ అని వ్యక్తం చేశాం.
- source_word: אֶחָד
  choice: ఒక
  rationale: బలుల జాబితాలో పదేపదే వచ్చే సంఖ్యను ప్రతి జంతువుతో ‘ఒక’ అని ఉంచడం మూలంలోని లెక్కింపు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: ఇది ఎదిగిన మగ గొర్రెకు వాడే ప్రామాణిక పదం; బలి సందర్భంలో ‘పొట్టేలు’ సహజమైన, నిర్దిష్టమైన తెలుగు సమానం.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్ల
  rationale: ఈ పదం గొర్రెపిల్లను సూచిస్తుంది; మూలంలోని పుంలింగ ఏకవచన సూచనను తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న
  rationale: వయస్సును తెలిపే ఈ హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన రూపం.
- source_word: לְעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచించే స్థిరమైన బలిపదం; לְ ఉపసర్గను జాబితా సందర్భంలో ‘కోసం’గా సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని వరుస లెక్కింపు క్రమం నిలుపబడింది; అవసరం లేని వ్యాఖ్యానాత్మక విస్తరణను నివారించాం.
