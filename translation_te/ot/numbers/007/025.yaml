    rationale: The vessel may be rendered bowl/basin, but depth is not a secure lexical component. A neutral ‘వెండి పాత్ర’ is a safer alternative. Footnote a is also made a closer alternative for ‘పళ్లెం.’
  revised_text: 'అతని అర్పణ: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]; ఈ రెండింటి బరువూ పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం. అవి రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన మెత్తని పిండితో నిండివున్నాయి.'
