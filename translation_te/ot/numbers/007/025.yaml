  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: te
  text: 'అతని అర్పణ: నూట ముప్పై షెకెలుల బరువుగల ఒక వెండి పళ్లెం[a], డెబ్బై షెకెలుల బరువుగల ఒక వెండి గిన్నె[b]; ఈ రెండింటి బరువూ పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం. అవి రెండూ ధాన్యార్పణ కోసం నూనెతో కలిపిన మెత్తని పిండితో నిండివున్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెండి తట్టు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వెండి పాత్ర.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధనా సందర్భంలో దేవుని సన్నిధికి తీసుకువచ్చే కానుకను సూచించే ఈ పదానికి ‘అర్పణ’ సహజమైన, స్థిరమైన తెలుగు సమానం.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: ఒక వెండి పళ్లెం
  rationale: קַעֲרָה నైవేద్య సామగ్రిని ఉంచే వెడల్పాటి పాత్రను సూచిస్తుంది; ‘పళ్లెం’ దాని సంభావ్య ఆకారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: నూట ముప్పై షెకెలుల బరువుగల
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని సహజ తెలుగు క్రమంలో ఇచ్చి, ‘దాని బరువు’ అనే భావాన్ని విశేషణ పదబంధంగా స్పష్టంగా వ్యక్తం చేసింది.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ఒక వెండి గిన్నె
  rationale: מִזְרָק ఆచార సంబంధమైన ద్రవాలను ఉంచే లేదా చిలకరించడానికి వాడే పాత్ర; ‘గిన్నె’ సాధారణ పాఠకునికి స్పష్టమైన సమానం, ప్రత్యామ్నాయంగా ‘లోతైన పాత్ర’ సాధ్యం.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: డెబ్బై షెకెలుల బరువుగల
  rationale: ఇది రెండవ పాత్ర బరువును తెలుపుతుంది; తెలుగులో స్పష్టత కోసం ‘బరువుగల’ అని వ్యక్తంగా ఇచ్చింది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం ఒక ప్రత్యేక ప్రమాణ బరువును సూచిస్తుంది. మూలంలోని ‘పరిశుద్ధ స్థలపు షెకెలు’ రూపాన్ని ఉంచుతూ దాని కార్యాన్ని ‘ప్రమాణం ప్రకారం’ అని స్పష్టం చేసింది.
- source_word: שְׁנֵיהֶם
  choice: అవి రెండూ
  rationale: రెండు వెండి పాత్రలకూ ఈ విషయం వర్తిస్తుందని మూలంలోని స్పష్టమైన సూచనను నిలిపింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలులలో ఉపయోగించే సన్నగా చేసిన ఉత్తమ పిండిని సూచించే సాధారణ, అర్థవంతమైన తెలుగు పదబంధం.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండి నూనెతో కలపబడినదనే కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ కోసం
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ‘ధాన్యార్పణ’ ఖచ్చితమైనది.
