translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుకుంటూనే సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘షెకెలు’ అనే ప్రాచీన బరువు ప్రమాణాన్ని అనువదించకుండా లిప్యంతరీకరించి, దాని ప్రమాణ సంబంధ భావాన్ని పాదటీకలో వివరించింది.
