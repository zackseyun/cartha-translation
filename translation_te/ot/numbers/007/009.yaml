review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the contrast, the withholding of the previously mentioned transport provisions, and the Kohathites’ duty to carry the sacred objects by shoulder. However, “పవిత్ర వస్తువుల సేవాభారం” is not fully clear in Telugu: it can sound like a burden belonging to the objects rather than the service/duty concerning them. The revision makes that relationship explicit while retaining the contextual reference to sacred objects.'
  naturalness: “కహాతీయులకు” and “భుజాల మీద” are natural and suitable for modern standard Telugu. Recasting the central duty phrase as “పవిత్ర వస్తువులకు సంబంధించిన సేవ వారి బాధ్యతగా ఉంది” is clearer, idiomatic, and avoids the slightly compressed expression “సేవాభారం.”
  terminology: “కహాతీయులు” appropriately preserves the clan designation. “పవిత్ర వస్తువులు” is contextually justified for הַקֹּדֶשׁ, while the footnote preserves the broader lexical alternative of sanctuary/holy-service language. “భుజాలపై మోయవలసి ఉంది” suitably expresses the prescribed duty of the imperfect.
  issues:
  - severity: low
    issue: The phrase “పవిత్ర వస్తువుల సేవాభారం” is semantically compressed and potentially ambiguous.
    rationale: In Telugu, the genitive construction can be read less clearly than intended. The Hebrew denotes the service/duty associated with the holy things; explicitly marking that relation improves clarity without adding meaning.
  - severity: low
    issue: The footnote’s alternative “వారు దానిని ... మోయాలి” gives an explicit singular object not present in the Hebrew and may imply that ‘service’ itself is carried.
    rationale: The Hebrew leaves the object of ‘carry’ implicit. Retaining that ellipsis in the formal alternative better preserves the source wording and avoids an unnatural referent.
