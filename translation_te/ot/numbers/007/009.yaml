source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: te
  text: కాని కహాతీయులకు అతడు ఏదీ ఇవ్వలేదు[a], ఎందుకంటే పవిత్ర వస్తువులకు సంబంధించిన సేవ వారి బాధ్యతగా ఉంది; వాటిని వారు భుజాలపై మోయవలసి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఎందుకంటే పరిశుద్ధస్థల సేవ వారి మీద ఉంది; వారు భుజంపై మోయాలి.” ఇక్కడి హీబ్రూ మాటలు కహాతీయులకు అప్పగించిన పవిత్ర వస్తువులను ప్రత్యేకంగా సూచించే అవకాశం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: కాని కహాతీయులకు
  rationale: לִבְנֵי קְהָת అక్షరార్థంగా ‘కహాతు కుమారులకు’; ఇక్కడ అది కహాతు వంశీయులైన లేవీయుల గోత్రశాఖను సూచిస్తుంది. ముందటి వచనాల్లో ఇతరులకు ఇచ్చిన వాటితో ఉన్న వ్యత్యాసాన్ని וְ సందర్భానుసారంగా ‘కాని’గా తెలియజేస్తుంది.
- source_word: לֹא נָתָן
  choice: అతడు ఏమీ ఇవ్వలేదు
  rationale: ముందటి సందర్భంలోని బండ్లు, ఎద్దులు ఇక్కడ అవ్యక్త కర్మ. ‘ఏమీ ఇవ్వలేదు’ ఆ సూచనను సహజమైన తెలుగులో స్పష్టంగా ఉంచుతుంది, ప్రత్యేక వస్తువులను అనవసరంగా మళ్లీ చేర్చదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారికి బండ్లు, ఎద్దులు ఇవ్వకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: పవిత్ర వస్తువుల సేవాభారం
  rationale: עֲבֹדָה అంటే సేవ లేదా పని; הַקֹּדֶשׁ ఈ సందర్భంలో కహాతీయులకు అప్పగించిన పవిత్ర సామగ్రిని సూచించే అవకాశం ఎక్కువ. ‘సేవాభారం’ పని మరియు బాధ్యత అనే రెండు భావాలను సహజంగా అందిస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారి మీద ఉంది
  rationale: బాధ్యత ‘వారి మీద’ ఉందనే హీబ్రూ రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: בַּכָּתֵף
  choice: భుజాల మీద
  rationale: హీబ్రూలో ఏకవచనంగా ‘భుజం మీద’ ఉన్నా, అది పంపిణీయ లేదా సమష్టి ప్రయోగం. బహువచన కర్తకు సహజమైన తెలుగులో ‘భుజాల మీద’ అని అనువదించబడింది.
- source_word: יִשָּׂאוּ
  choice: వారు వాటిని ... మోయాలి
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియారూపం నియమిత కర్తవ్యాన్ని సూచిస్తుంది. తెలుగులో ‘మోయాలి’ ఆ బాధ్యతను తెలియజేస్తుంది; ‘వాటిని’ అనేది సందర్భంలోని పవిత్ర వస్తువులను సూచిస్తూ పూరించబడింది.
theological_decisions:
- issue: הַקֹּדֶשׁ సూచించే విషయం
  choice: పవిత్ర వస్తువులు
  alternative: పరిశుద్ధస్థలం / పవిత్ర సేవ
  rationale: కహాతీయుల రవాణా బాధ్యతకు సంబంధించిన సమీప సందర్భం పవిత్ర సామగ్రినే ప్రధానంగా సూచిస్తుంది. అయినా హీబ్రూ పదబంధం ‘పరిశుద్ధస్థల సేవ’ అనే విస్తృత భావానికీ వీలు కల్పిస్తుంది; అందుకే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కహాతీయులు,’ ‘పవిత్ర వస్తువులు,’ ‘సేవాభారం’ వంటి పదాలు గోత్ర గుర్తింపును, సందర్భాన్ని, బాధ్యత భావాన్ని సంక్షిప్తంగా నిలుపుతాయి.
