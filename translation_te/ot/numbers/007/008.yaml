id: NUM.7.8
reference: Numbers 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: te
  text: అతడు నాలుగు బండ్లను, ఎనిమిది ఎద్దులను మెరారీ కుమారులకు వారి సేవకు అనుగుణంగా, యాజకుడైన అహరోను కుమారుడైన ఈతామారు పర్యవేక్షణలో ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: బండ్లు
  rationale: ఈ పదం చక్రాలుగల రవాణా వాహనాలను సూచిస్తుంది. ప్రత్యక్ష మందిర సామగ్రిని మోయు సందర్భంలో ‘బండ్లు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: ఈ సందర్భంలో బండ్లను లాగే పశువులు ఉద్దేశించబడ్డాయి; అందువల్ల సాధారణమైన ‘పశువులు’ కంటే ‘ఎద్దులు’ సందర్భానికి తగినది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: హీబ్రూ క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; అధికారికంగా కేటాయించాడనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: לִבְנֵי מְרָרִי
  choice: మెరారీ కుమారులకు
  rationale: హీబ్రూలోని కుటుంబ/వంశ సంబంధమైన వ్యక్తీకరణను సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: כְּפִי עֲבֹדָתָם
  choice: వారి సేవను బట్టి
  rationale: ‘వారి సేవకు అనుగుణంగా’ అనే హీబ్రూ నుడికార భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּיַד אִיתָמָר
  choice: ఈతామారు పర్యవేక్షణలో
  rationale: అక్షరార్థంగా ‘ఈతామారు చేతి ద్వారా/చేతిలో’ అయినా, ఈ పరిపాలనా సందర్భంలో అతని ఆధ్వర్యం లేదా పర్యవేక్షణను సూచించే నుడికారం.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: అహరోనును యాజకునిగా గుర్తించే హీబ్రూ విశేషణ సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రెండవ వాక్యంలో ‘వాటిని ఇచ్చాడు’ అని పునరుక్తి చేసి సంబంధాన్ని స్పష్టం చేశాం.
