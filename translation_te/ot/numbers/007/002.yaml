source:
  edition: WLC
  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు నాయకులు, తమ పితృకుటుంబాల అధిపతులు, అర్పణలు తీసుకొచ్చారు.[a] వారే గోత్రాల నాయకులు; లెక్కించబడినవారికి బాధ్యులుగా ఉన్నవారూ వారే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమర్పించారు” లేదా “దగ్గరకు తెచ్చారు.” హీబ్రూ క్రియకు పదశః ‘దగ్గరకు తెచ్చారు’ అనే భావం ఉంది; ఈ ప్రతిష్ఠ సందర్భంలో అర్పణలను సమర్పించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “లెక్కించబడినవారు” అంటే జనగణనలో నమోదు చేయబడినవారు. హీబ్రూలో పదశః, “వారిపై నిలిచినవారు”; అంటే వారికి బాధ్యులుగా లేదా వారిపై అధికారంతో ఉన్నవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: అర్పణలు తీసుకొచ్చారు
  rationale: קרב ధాతువు హిఫిల్ రూపంలో ‘దగ్గరకు తేవడం/సమర్పించడం’ అని అర్థం. గుడారపు ప్రతిష్ఠ సందర్భంలో అర్పణలను సమర్పించడమే భావం; సహజమైన తెలుగులో ‘అర్పణలు తీసుకొచ్చారు’ అని వ్యక్తం చేశాం. ‘అర్పణలు’ అనే కర్మపదం ఈ వాక్యంలో ప్రత్యక్షంగా లేకపోయినా, వెంటనే వచ్చే సందర్భం దానిని స్పష్టం చేస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులు
  rationale: נָשִׂיא ఇక్కడ రాజకుమారులను కాకుండా గోత్ర/సమాజ నాయకులను సూచిస్తుంది. ‘నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: తమ పితృవంశాల అధిపతులు
  rationale: בֵּית אָבוֹת అనేది పూర్వీకుల ఆధారంగా ఏర్పడిన వంశీయ కుటుంబ విభాగం. పదశః ‘తండ్రుల ఇళ్లు’ అనడం తెలుగులో అపార్థం కలిగించవచ్చు కాబట్టి, సామాజిక భావాన్ని నిలుపుతూ ‘పితృవంశాలు’ అని అనువదించాం.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: వీరు గోత్రాల నాయకులు
  rationale: מַטּוֹת పదశః ‘కర్రలు/దండాలు’ అయినప్పటికీ ఇక్కడ స్థిరమైన రూపకాలంకార ప్రయోగంగా ఇశ్రాయేలు గోత్రాలను సూచిస్తుంది.
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: లెక్కించబడినవారిపై పర్యవేక్షకులుగా నిలిచినవారు వీరే
  rationale: עמד על లోని ‘పై నిలుచుట’ అనే రూపకాన్ని ‘నిలిచినవారు’ ద్వారా నిలుపుతూ, అధికార బాధ్యతను ‘పర్యవేక్షకులుగా’ స్పష్టం చేశాం. הַפְּקֻדִים జనగణనలో లెక్కించబడిన లేదా నమోదు చేయబడిన వారిని సూచిస్తుంది.
