translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘పితృవంశాలు’ ప్రాచీన బంధుత్వ వ్యవస్థను సహజంగా తెలియజేస్తుంది. ‘పర్యవేక్షకులుగా నిలిచినవారు’ మూలంలోని עמד על రూపకాన్నీ పరిపాలనా భావాన్నీ రెండింటినీ నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
