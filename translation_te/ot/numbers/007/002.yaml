revisions:
- from: అప్పుడు ఇశ్రాయేలు నాయకులు—తమ పితృవంశాల అధిపతులు—అర్పణలు తీసుకొచ్చారు.[a] వీరు గోత్రాల నాయకులు; లెక్కించబడినవారిపై పర్యవేక్షకులుగా నిలిచినవారు వీరే.[b]
  to: అప్పుడు ఇశ్రాయేలు నాయకులు, తమ పితృకుటుంబాల అధిపతులు, అర్పణలు తీసుకొచ్చారు.[a] వారే గోత్రాల నాయకులు; లెక్కించబడినవారికి బాధ్యులుగా ఉన్నవారూ వారే.[b]
