reference: Numbers 17:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: te
  text: 'మరుసటి రోజు ఇశ్రాయేలు ప్రజల సమాజమంతా మోషేకు, అహరోనుకు వ్యతిరేకంగా సణుగుతూ ఇలా అన్నారు: “మీరు యెహోవా ప్రజలను చంపారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: సణుగుతూ
  rationale: לון అనే క్రియ అరణ్య కథనాల్లో నాయకులకు విరోధంగా అసంతృప్తితో గొణగడం లేదా ఫిర్యాదు చేయడాన్ని సూచిస్తుంది. ‘సణుగుతూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, సామూహిక విరోధ భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతా
  rationale: עֵדָהకు ‘సమాజం’ అని అనువదించడం సమష్టి సముదాయాన్ని సూచిస్తుంది. בְּנֵי יִשְׂרָאֵלను తెలుగులో సహజమైన సమూహార్థంతో ‘ఇశ్రాయేలు ప్రజలు’గా ఇచ్చాం; ఇక్కడ హెబ్రీ పురుషలింగ రూపం స్త్రీలను మినహాయించదు.
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: ఈ పదబంధం ‘తరువాతి రోజు’ అనే కాలార్థాన్ని ఇస్తుంది; ‘మరుసటి రోజు’ సహజమైన ఆధునిక తెలుగు.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: మోషేకు, అహరోనుకు విరోధంగా
  rationale: עַל పునరుక్తి ఆరోపణ ఇద్దరు నాయకులపైనా విడివిడిగా మళ్లిందని నొక్కి చెబుతుంది. తెలుగులో రెండు పేర్లకూ ‘కు’ జోడించి ఆ దృష్టిని నిలిపాం.
- source_word: לֵאמֹר
  choice: అని అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు సంభాషణ ముగింపు నిర్మాణంతో అనువదించాం.
- source_word: אַתֶּם הֲמִתֶּם
  choice: మీరే చంపారు
  rationale: రెండవ పురుష బహువచన హిఫిల్ రూపం ‘మీరు చంపారు/చావుకు కారణమయ్యారు’ అనే ప్రత్యక్ష ఆరోపణను వ్యక్తం చేస్తుంది. ‘ఏ’ ఆరోపణాత్మక నొక్కును సహజంగా తెలియజేస్తుంది.
- source_word: עַם יְהוָה
  choice: యెహోవా ప్రజలు
  rationale: దైవ నామంతో ప్రజలకున్న సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ చతురక్షర దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; సాధారణ బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో మార్చకుండా పేరు రూపంలో నిలిపాం; ‘యెహోవా’ తెలుగు పాఠకులకు పరిచితమైన రూపం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో పదబంధం మొత్తం ఒడంబడిక సమాజాన్ని సూచిస్తుంది. అక్షరార్థమైన ‘కుమారులు’ తెలుగులో పురుషులను మాత్రమే సూచిస్తున్నట్టుగా అపార్థం కలిగించవచ్చు; ‘ప్రజలు’ సందర్భార్థాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- issue: הֲמִתֶּם లోని కారణార్థ ఆరోపణ
  choice: మీరే చంపారు
  alternative: మీరే చావుకు కారణమయ్యారు
  rationale: హిఫిల్ రూపంలో కారణార్థం ఉన్నప్పటికీ, సందర్భంలో అది తీవ్రమైన ప్రత్యక్ష ఆరోపణగా పనిచేస్తుంది. ‘చంపారు’ ఆ తీవ్రతను కాపాడుతుంది; ఆరోపణ నిజమని అనువాదకుడు నిర్ధారించకుండా, మాట్లాడిన వారి మాటగానే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని సామూహిక సణుగుడు, ఇద్దరు నాయకులపై ఆరోపణ, ప్రత్యక్ష వాక్యంలోని తీవ్రత నిలుపబడ్డాయి.
