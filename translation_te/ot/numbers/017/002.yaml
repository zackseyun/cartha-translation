base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: te
  text: '“యాజకుడైన అహరోను కుమారుడు ఎలియాజరుతో ఇలా చెప్పు: ‘మంటల మధ్యనుండి ధూపపాత్రలను[a] పైకి తీయి; నిప్పును దూరంగా చల్లివేయి. ఎందుకంటే ఆ పాత్రలు పవిత్రమయ్యాయి[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిప్పుపాత్రలను.” హీబ్రూ పదం నిప్పుకణాలు లేదా ధూపం మోయడానికి ఉపయోగించే పాత్రలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పవిత్రంగా ఉన్నాయి.” హీబ్రూ పరిపూర్ణ క్రియ, అవి పవిత్రమై ఇప్పుడు ఆ స్థితిలో ఉన్నాయనే ఫలిత స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: ఇలా చెప్పు
  rationale: אמר ఆజ్ఞార్థక రూపం. మోషే ఎలియాజరుకు ఆదేశం తెలియజేయాలని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶלְעָזָר בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారుడు ఎలియాజరు
  rationale: హీబ్రూ పదబంధంలో ‘యాజకుడు’ అన్నది సహజంగా అహరోనును విశేషిస్తుంది; ఎలియాజరు కూడా యాజకుడే అయినప్పటికీ వాక్యనిర్మాణంలోని సంబంధాన్ని యథాతథంగా ఉంచాం.
- source_word: וְיָרֵם
  choice: పైకి తీయాలి
  rationale: ఆజ్ఞార్థకం తరువాత వచ్చిన జస్సివ్, ఎలియాజరుకు చెప్పవలసిన ఆదేశాన్ని సూచిస్తుంది. ‘పైకి తీయాలి’ అనేది చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּחְתֹּת
  choice: ధూపపాత్రలు
  rationale: מחתה నిప్పుకణాలు లేదా ధూపం మోయడానికి ఉపయోగించే పాత్ర. ఈ ఆరాధనా సందర్భంలో ‘ధూపపాత్ర’ సాధారణ పాఠకులకు స్పష్టమైన పదం; ‘నిప్పుపాత్రలు’ కూడా సాధ్యమేనని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: దహనం మధ్యలోనుంచి
  rationale: שׂרפה ఇక్కడ దేవుని అగ్నివల్ల జరిగిన దహనాన్ని లేదా మండుతున్న ప్రదేశాన్ని సూచించవచ్చు. ‘దహనం’ ఈ స్వల్ప అస్పష్టతను కాపాడుతుంది; ‘కాలిన అవశేషాలు’ అని అనువదించడం మరీ వివరణాత్మకం.
- source_word: וְאֶת־הָאֵשׁ זְרֵה הָלְאָה
  choice: నిప్పును దూరంగా చల్లివేయాలి
  rationale: זרה అంటే చల్లివేయడం లేదా చెదరగొట్టడం; הָלְאָה దూరానికి అనే భావాన్ని జోడిస్తుంది. సందర్భంలో ‘నిప్పు’ మండే బొగ్గులను కూడా సూచించగలదు, కాని మూలపాఠంలోని విస్తృత పదాన్నే ఉంచాం.
- source_word: כִּי קָדֵשׁוּ
  choice: ఎందుకంటే ఆ పాత్రలు పవిత్రమయ్యాయి
  rationale: బహువచన క్రియకు అత్యంత సహజ పూర్వపదం ధూపపాత్రలు. పరిపూర్ణ క్రియ గత చర్య వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సూచించగలదు కాబట్టి ‘పవిత్రమయ్యాయి’ అని అనువదించాం.
theological_decisions:
- issue: כִּי קָדֵשׁוּ లోని బహువచన క్రియ దేనిని సూచిస్తుంది?
  choice: ధూపపాత్రలను సూచిస్తుంది
  alternative: ధూపపాత్రలు, నిప్పు రెండింటినీ కలిపి లేదా అర్పణకు సంబంధించిన వస్తువులన్నింటినీ సూచిస్తుంది
  rationale: 'సరిపోలే సమీప బహువచన పూర్వపదం הַמַּחְתֹּת (‘ధూపపాత్రలు’). కథన తర్కం కూడా దీనికి అనుకూలం: పవిత్రమైన పాత్రలను తీసి భద్రపరచాలి, నిప్పును మాత్రం దూరంగా చల్లివేయాలి.'
- issue: קָדֵשׁוּ యొక్క కాలభావం
  choice: పవిత్రమయ్యాయి
  alternative: పవిత్రంగా ఉన్నాయి
  rationale: హీబ్రూ పరిపూర్ణ రూపం ఫలిత స్థితిని—అవి పవిత్రమైన స్థితిలోకి వచ్చి ఇప్పుడు అలా ఉన్నాయని—సూచించవచ్చు. ప్రధాన పాఠంలో ఆ మార్పును వ్యక్తపరచి, స్థితి భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ఆజ్ఞల క్రమం, ఆరాధనా పదజాలం, ‘దహనం’ అనే భావంలోని స్వల్ప అస్పష్టత నిలుపబడ్డాయి. పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో [a], [b]గా ఉన్నాయి.
