revisions:
- from: మరుసటి రోజు మోషే సాక్ష్యపు గుడారంలోకి[a] వెళ్లాడు. అప్పుడు ఇదిగో, లేవీ వంశానికి ప్రాతినిధ్యం వహించిన అహరోను కర్ర[b] చిగురించింది; అది మొగ్గలు తొడిగి, పూలు పూసి, బాదం కాయలను పక్వానికి తెచ్చింది.
  to: మరుసటి రోజు మోషే సాక్ష్యపు గుడారంలోకి[a] వెళ్లాడు. అప్పుడు ఇదిగో, లేవీ వంశం తరఫున ఉన్న అహరోను కర్ర[b] చిగురించింది; అది మొగ్గలు తొడిగి, పూలు పూసి, బాదం కాయలను పక్వానికి తెచ్చింది.
