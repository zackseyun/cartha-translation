id: NUM.17.23
reference: Numbers 17:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: te
  text: మరుసటి రోజు మోషే సాక్ష్యపు గుడారంలోకి[a] వెళ్లాడు. అప్పుడు ఇదిగో, లేవీ వంశం తరఫున ఉన్న అహరోను కర్ర[b] చిగురించింది; అది మొగ్గలు తొడిగి, పూలు పూసి, బాదం కాయలను పక్వానికి తెచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాక్ష్య గుడారం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘లేవీ ఇంటివారి కోసం’; అంటే లేవీ గోత్రం లేదా వంశానికి ప్రాతినిధ్యం వహించిన కర్ర.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: తరువాతి రోజును సూచించే హీబ్రూ కాలవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֹהֶל הָעֵדוּת
  choice: సాక్ష్యపు గుడారం
  rationale: עֵדוּת లోని సాక్ష్య/నిబంధన సంబంధమైన న్యాయ భావాన్ని నిలుపుతూ, స్థిరమైన పవిత్ర గుడారపు పేరుగా గౌరవప్రదంగా ఉంది.
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: అద్భుతమైన దృశ్యంపై శ్రద్ధను కేంద్రీకరించే హీబ్రూ కథన సూచికలోని ఆశ్చర్యభావాన్ని నిలుపుతుంది.
- source_word: פָּרַח
  choice: చిగురించింది
  rationale: తదుపరి మొగ్గలు, పూలు, పక్వమైన కాయల క్రమానికి ముందు ఉన్న తొలి జీవవృద్ధి దశను స్పష్టంగా సూచిస్తుంది.
- source_word: מַטֵּה
  choice: కర్ర
  rationale: గోత్ర నాయకుని దండం/కర్రను సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదంతో సూచిస్తుంది.
- source_word: לְבֵית לֵוִי
  choice: లేవీ వంశానికి ప్రాతినిధ్యం వహించిన
  rationale: ఆ కర్ర లేవీ వంశం తరఫున ఉంచబడిందనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూ రూపాన్ని పాదటీపులో ఇస్తుంది.
- source_word: וַיֹּצֵא פֶרַח
  choice: మొగ్గలు తొడిగి
  rationale: పుష్పవృద్ధిలోని మధ్యదశను తెలుగులో సహజంగా తెలియజేసి, ముందున్న చిగురించడం మరియు తరువాతి పూలు పూయడం నుంచి వేరుచేస్తుంది.
- source_word: וַיָּצֵץ צִיץ
  choice: పూలు పూసి
  rationale: హీబ్రూ క్రియా-నామ జంటలోని పుష్పించే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: బాదం కాయలను పక్వానికి తెచ్చింది
  rationale: కేవలం కాయలు రావడం కాక అవి పరిపక్వం చెందాయనే క్రియార్థాన్ని, అద్భుతంలోని పరాకాష్ఠను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. చిగురించడం, మొగ్గలు తొడగడం, పూలు పూయడం, కాయలు పక్వానికి రావడం అనే అద్భుత వృద్ధిక్రమం స్పష్టంగా నిలుపబడింది.
