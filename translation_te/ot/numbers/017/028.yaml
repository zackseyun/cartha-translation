  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: te
  text: యాహ్వే యొక్క నివాసగుడారం దగ్గరికి ఎవరైతే వస్తారో, దగ్గరికి వచ్చే వారందరూ చనిపోతారు. మేమంతా చనిపోతూ పూర్తిగా అంతమైపోవాలా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేమంతా నశించిపోవాలా?” ఇక్కడ “చనిపోతారు” అనే మాటకు వాడిన క్రియకంటే హీబ్రూలో వేరే క్రియ ఉంది; అది కేవలం మరణించడం మాత్రమే కాక, పూర్తిగా అంతమైపోవడం అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ప్రతి ఒక్కరూ
  rationale: సమీపించే ఏ వ్యక్తికైనా వర్తించే సార్వత్రిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: దగ్గరికి వచ్చే ప్రతి ఒక్కరూ—దగ్గరికి వచ్చే వారంతా—
  rationale: హీబ్రూలోని పునరుక్తిని పూర్తిగా తొలగించకుండా, ప్రజల భయభరితమైన ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מִשְׁכַּן
  choice: నివాసగుడారం
  rationale: అరణ్యకాల పరిశుద్ధ గుడారాన్ని సూచించే משכן యొక్క ‘నివాసస్థలం/గుడారం’ భావాలను రెండింటినీ ప్రతిబింబించే స్పష్టమైన పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో అందిస్తుంది.
- source_word: יָמוּת
  choice: చనిపోతారు
  rationale: సమీపించడం వల్ల కలిగే మరణఫలితాన్ని నేరుగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַאִם תַּמְנוּ לִגְוֹעַ
  choice: మేమంతా నశించిపోవాల్సిందేనా?
  rationale: תמם యొక్క పూర్తిగా అంతమవడం అనే భావాన్నీ, גוע యొక్క మరణించడం/ప్రాణం విడవడం అనే భావాన్నీ కలిపి, ఆందోళనతో కూడిన అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: చివరి ప్రశ్నలో תמם మరియు גוע భావసంబంధం
  choice: మేమంతా నశించిపోవాల్సిందేనా?
  alternative: మేము చనిపోతూ పూర్తిగా అంతమైపోవాలా?
  rationale: మరణం మరియు సంపూర్ణ అంతం అనే రెండు భావాలను సహజమైన తెలుగులో సమన్వయపరుస్తుంది; ప్రజల భయాన్ని సిద్ధాంతపరంగా వివరించకుండా యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హీబ్రూ పునరుక్తిని డ్యాష్‌తో నిలిపి ఉద్ఘాటనను కాపాడింది; చివరి ప్రశ్నలోని భావసూక్ష్మతను పాదటీపులో తెలిపింది.
