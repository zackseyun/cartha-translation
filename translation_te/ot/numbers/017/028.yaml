revisions:
- from: యెహోవా నివాసగుడారం దగ్గరికి వచ్చే ప్రతి ఒక్కరూ—దగ్గరికి వచ్చే వారంతా—చనిపోతారు. మేమంతా నశించిపోవాల్సిందేనా?[a]
  to: యాహ్వే యొక్క నివాసగుడారం దగ్గరికి ఎవరైతే వస్తారో, దగ్గరికి వచ్చే వారందరూ చనిపోతారు. మేమంతా చనిపోతూ పూర్తిగా అంతమైపోవాలా?[a]
  rationale: The revision changes the divine name to match the project’s Yahweh policy, recasts the doubled participle into idiomatic Telugu while preserving its emphatic repetition, and renders the final rhetorical question with both death and complete-ending senses present in the Hebrew. The footnote remains anchored to the final question and explains the lexical distinction without overstating it.
