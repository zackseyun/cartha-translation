source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶלְעָזָ֣ר הַ/כֹּהֵ֗ן אֵ֚ת מַחְתּ֣וֹת הַ/נְּחֹ֔שֶׁת אֲשֶׁ֥ר הִקְרִ֖יבוּ הַ/שְּׂרֻפִ֑ים וַֽ/יְרַקְּע֖וּ/ם צִפּ֥וּי לַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: te
  text: కాబట్టి యాజకుడైన ఎలియాజరు, అగ్నిలో కాలిపోయినవారు అర్పించిన కంచు ధూపపాత్రలను[a][b] తీసుకున్నాడు; వాటిని కొట్టి పలకలుగా చేసి బలిపీఠానికి లోహపు తాపడంగా చేశారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధూపపాత్రలు’కు బదులుగా ‘నిప్పుపాత్రలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో ‘కాల్చబడినవారు’ లేదా ‘కాలిపోయినవారు’; ముందటి వృత్తాంతంలో అగ్నిచేత దహించబడిన వారిని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘లోహపు తాపడం’కు బదులుగా ‘కప్పు’ లేదా ‘పూత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: ధూపపాత్రలు
  rationale: మండుతున్న నిప్పులను, ధూపాన్ని ఉంచే ఆరాధనా పాత్రలను సూచిస్తుంది; సందర్భంలో సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַנְּחֹשֶׁת
  choice: కంచు
  rationale: నెహోషెత్ రాగి లేదా కంచును సూచించగలదు; గుడారపు సామగ్రి సందర్భంలో ‘కంచు’ సంప్రదాయబద్ధమైన, సంభావ్యమైన అనువాదం.
- source_word: הִקְרִיבוּ
  choice: అర్పించిన
  rationale: హిఫీల్ రూపం ఆరాధనా సందర్భంలో అర్పించడం లేదా సమర్పించడం అనే భావాన్ని ఇస్తుంది; తెలుగు ఉపవాక్యంలో ముందుగా జరిగిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: הַשְּׂרֻפִים
  choice: అగ్నిలో కాలిపోయినవారు
  rationale: శారఫ్ ధాతువు నుంచి వచ్చిన కర్మణి అసమాపక క్రియ; ముందటి వృత్తాంతంలో అగ్నిచేత దహించబడిన వారిని సూచిస్తుంది. మూలంలోని కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: וַיְרַקְּעוּם
  choice: వాటిని ... సుత్తితో కొట్టి పలకలుగా చేశారు
  rationale: లోహాన్ని కొట్టి పలుచగా పరచడం అనే అర్థాన్ని, వస్తువును సూచించే బహువచన ప్రత్యయాన్ని వ్యక్తం చేస్తుంది. కర్తను పేర్కొనకుండా తెలుగు కర్మణి నిర్మాణం ద్వారా హెబ్రీలో సందర్భపరంగా స్పష్టంగా లేని కర్తను నిర్దిష్టం చేయదు.
- source_word: צִפּוּי
  choice: పైకప్పు
  rationale: బలిపీఠాన్ని కప్పే లోహపు పొర లేదా తాపడాన్ని సూచిస్తుంది; సాధారణ పాఠకుడికి అర్థమయ్యే పదం, సాంకేతిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: לַמִּזְבֵּחַ
  choice: బలిపీఠానికి
  rationale: 'లామెద్ ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది: కొట్టిన లోహపు పలకలు బలిపీఠానికి పైకప్పుగా అయ్యాయి.'
theological_decisions:
- issue: లోహాన్ని కొట్టిన కర్త
  choice: కర్తను పేర్కొనని కర్మణి వాక్యం
  alternative: ఎలియాజరు వాటిని కొట్టి పలకలుగా చేశాడు / వారు వాటిని కొట్టి పలకలుగా చేశారు
  rationale: וַיְרַקְּעוּם రూపం వ్యాకరణపరంగా మూడవ పురుష బహువచన కర్తను, బహువచన కర్మను సూచించినా సందర్భంలో కర్త ఎవరో స్పష్టంగా లేదు. అనువాదం ఒక నిర్దిష్ట కర్తను ఊహించి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘అగ్నిలో కాలిపోయినవారు’ మూలంలోని కర్మణి భావాన్ని సహజంగా నిలుపుతుంది. ‘వాటిని ... చేశారు’ అనే కర్తరహిత కర్మణి నిర్మాణం హెబ్రీ వాక్యంలోని కర్త అస్పష్టతను కాపాడుతుంది. అన్ని పాదసూచిక సూచికలు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
