  source_fidelity: 'మొదటి ఉపవాక్యం హెబ్రీ మూలానికి నమ్మకంగా ఉంది: ఎలియాజరు యాజకుడు కంచు ధూపపాత్రలను తీసుకున్నాడు; వాటిని అర్పించినవారు అగ్నిచేత దహించబడినవారే. అయితే ‘పైకప్పు’ అనేది צִפּוּי యొక్క అర్థమైన లోహపు కప్పు/తాపడం కాక, సాధారణంగా భవనపు పైకప్పును సూచిస్తుంది. అలాగే ‘పలకలుగా’ అనే ఫలితభావం ఉంచవచ్చు, కానీ తాపడం అనే ఉద్దేశాన్ని స్పష్టంగా చెప్పాలి.'
  naturalness: ‘బలిపీఠానికి పైకప్పుగా’ ఆధునిక ప్రామాణిక తెలుగులో అసహజంగా, తప్పుదారి పట్టించేలా ఉంది. ‘బలిపీఠానికి లోహపు తాపడంగా’ అనేది సహజమైనదీ సందర్భానుకూలమైనదీ.
