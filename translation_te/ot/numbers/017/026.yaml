  to: యాహ్వే తనకు ఆజ్ఞాపించినట్లే మోషే చేశాడు; అతడు అలాగే చేశాడు.
  rationale: The revision changes the divine name to match the required Yahweh policy and removes the unsupported affirmative interjection. It preserves the source's twofold use of 'do' and its emphasis that Moses acted in conformity with Yahweh's command.
