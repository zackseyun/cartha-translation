id: NUM.17.26
reference: Numbers 17:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: te
  text: యాహ్వే తనకు ఆజ్ఞాపించినట్లే మోషే చేశాడు; అతడు అలాగే చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు ‘చేయు/నిర్మించు’ అనే విస్తృత అర్థాలున్నాయి. ఇక్కడ ఆజ్ఞకు విధేయత సందర్భం కాబట్టి ‘చేశాడు’ సహజంగా ఉండి, చివరలోని పునరుక్తితోనూ సరిపోతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తినామానికి తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר తెలిపే అనురూపతను ‘-ినట్లే’ సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఆజ్ఞను యథాతథంగా పాటించిన భావాన్ని కాపాడుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה లోని అధికారపూర్వక ఆదేశ భావాన్ని ‘ఆజ్ఞాపించు’ స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: אֹתוֹ
  choice: తనకు
  rationale: ప్రత్యక్ష కర్మసూచకంతో ఉన్న తృతీయ పురుష ఏకవచన ప్రత్యయం మోషేను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘మోషేకు’ అనే గ్రహీత భావాన్ని సహజంగా ‘తనకు’ తెలియజేస్తుంది.
- source_word: כֵּן
  choice: అవును, ... అలాగే
  rationale: ముందటి ప్రకటనను తిరిగి ధృవీకరించి బలపరిచే כֵּן భావాన్ని తెలుగు భాషలో ‘అవును’ మరియు ‘అలాగే’ కలిపి సహజంగా నిలుపుతాయి.
- source_word: עָשָׂה
  choice: అతడు అలాగే చేశాడు
  rationale: మూలంలోని עשה పునరుక్తిని నిలుపుతూ, దాని సూచనార్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరు రూపంలో నిలిపాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘చేశాడు ... చేశాడు’ అనే ఉద్దేశపూర్వక పునరుక్తిని కాపాడి, మోషే ఖచ్చిత విధేయతపై ఉన్న ఉద్ఘాటనను నిలిపాం.
