id: NUM.17.11
reference: Numbers 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: te
  text: 'అప్పుడు మోషే అహరోనుతో ఇలా అన్నాడు: “ధూపపాత్రను[a] తీసుకొని, బలిపీఠం మీద నుంచి నిప్పు తీసి దానిలో వేసి, దానిమీద ధూపం ఉంచు. వెంటనే సమాజం దగ్గరికి వెళ్లి వారి కోసం ప్రాయశ్చిత్తం చేయి. ఎందుకంటే యాహ్వే సన్నిధి నుండి[b] ఉగ్రకోపం బయలుదేరింది; తెగులు మొదలైంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిప్పుల పాత్రను.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘యాహ్వే ఎదుటి నుంచి’; అంటే, ఆయన సన్నిధి నుంచి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: ధూపపాత్రను
  rationale: యాజక సేవలో నిప్పులు, ధూపం మోయడానికి ఉపయోగించే పాత్రను సూచిస్తుంది. సందర్భానుసారం ‘ధూపపాత్ర’ సహజంగా, స్పష్టంగా ఉంది; ‘నిప్పుల పాత్ర’ కూడా సాధ్యమే.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద నుంచి నిప్పు తీసి దానిలో వేసి
  rationale: నిప్పు బలిపీఠం మీద నుంచి తీసుకున్నదని, దాన్ని పాత్రలో ఉంచాలని తెలిపే హెబ్రీ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: קְטֹרֶת
  choice: ధూపం
  rationale: ఆరాధనా సందర్భంలో వాడే ధూపాన్ని సూచించే సాధారణ, స్థిరమైన తెలుగు పదం.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: వెంటనే ... వెళ్లి
  rationale: కదలికతో పాటు ఆజ్ఞలోని అత్యవసరతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: సంఖ్యాకాండంలో సమష్టిగా ఉన్న ఇశ్రాయేలు ప్రజలను సూచిస్తుంది. ‘సమాజం’ ఆధునిక పాఠకులకు సహజంగా ఉండి, సమూహ భావాన్ని నిలుపుతుంది.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: వారి కోసం ప్రాయశ్చిత్తం చేయి
  rationale: యాజక ఆచార సందర్భంలోని כפר పదానికి ఉన్న బలమైన ధార్మిక భావాన్ని నిర్దిష్ట సిద్ధాంత వివరణకు కుదించకుండా నిలుపుతుంది.
- source_word: הַקֶּצֶף
  choice: ఉగ్రకోపం
  rationale: దైవిక తీర్పుగా బయలుదేరిన తీవ్రమైన కోపాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధి నుండి
  rationale: ‘యాహ్వే ఎదుటి నుంచి/సన్నిధి నుంచి’ అనే హెబ్రీ స్థలరూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: הֵחֵל הַנָּגֶף
  choice: తెగులు మొదలైంది
  rationale: ప్రజల మధ్య ప్రారంభమైన ప్రాణాంతక దైవిక దెబ్బను సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా పేరుగా అందించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: యాజక సందర్భంలోని כפר క్రియ
  choice: ప్రాయశ్చిత్తం చేయి
  alternative: పాపపరిహారం చేయి
  rationale: ఆచార చర్య ద్వారా ప్రజల నిమిత్తం పరిహారం చేయాలనే భావాన్ని నిలుపుతూ, అది ఎలా పనిచేస్తుందనే ప్రత్యేక సిద్ధాంతాన్ని వచనంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఆజ్ఞల అత్యవసరతను ‘వెంటనే’ ద్వారా నిలిపి, యాజక సంబంధ పదాలకు స్థిరమైన తెలుగు పదజాలాన్ని ఉపయోగించాం.
