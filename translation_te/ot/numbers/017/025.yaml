id: NUM.17.25
reference: Numbers 17:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “అహరోను కర్రను సాక్ష్యం ముందు తిరిగి ఉంచు.[b] తిరుగుబాటు కుమారులకు[a] గుర్తుగా దానిని భద్రపరచి ఉంచు. అప్పుడు నాపై వారు చేసే గొణుగుళ్లను నువ్వు ఆపుతావు; వారు చనిపోకుండా ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా “తిరుగుబాటు కుమారులకు”; భావం “తిరుగుబాటుదారులకు” లేదా “తిరుగుబాటు చేసేవారికి.”
    reason: lexical_alternative
  - marker: b
    text: “సాక్ష్యం” అనేది మందసంతో సంబంధమున్న ఒడంబడిక సాక్ష్యాన్ని సూచించే అవకాశం ఉంది; హీబ్రూ వ్యక్తీకరణ ఇక్కడ సంక్షిప్తంగానే ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: הָשֵׁב
  choice: తిరిగి ఉంచు
  rationale: హిఫిల్ ఆజ్ఞారూపం అహరోను కర్రను దాని ముందున్న స్థానానికి మళ్లీ చేర్చాలని సూచిస్తుంది.
- source_word: מַטֵּה
  choice: కర్ర
  rationale: ఇక్కడి అధికార సూచక వస్తువుకు ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండే పదం.
- source_word: לִפְנֵי הָעֵדוּת
  choice: సాక్ష్యం ఎదుట
  rationale: హీబ్రూ సంక్షిప్త వ్యక్తీకరణను మందసం అని విస్తరించకుండా నిలిపింది; సందర్భ వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: לְמִשְׁמֶרֶת
  choice: భద్రపరచబడాలి
  rationale: ఆ కర్రను కాపాడి ఉంచాలనే ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְאוֹת
  choice: ఒక సూచనగా
  rationale: אוֹת అనే పదంలోని గుర్తు లేదా సూచన భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: לִבְנֵי מֶרִי
  choice: తిరుగుబాటు కుమారులకు
  rationale: ‘తిరుగుబాటు కుమారులు’ అనే ప్రత్యేకమైన హీబ్రూ కుటుంబరూప నుడికారాన్ని సూటిగా నిలిపింది; భావార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: וּתְכַל
  choice: నువ్వు ముగింపు పలుకుతావు
  rationale: כלה హిఫిల్ రూపంలోని ‘అంతం చేయడం/ఆపివేయడం’ అనే భావాన్ని, మోషేనే వ్యాకరణ కర్తగా ఉంచుతూ అందిస్తుంది.
- source_word: תְּלוּנֹּתָם
  choice: వారి సణుగులకు
  rationale: అరణ్య ప్రయాణ కథనాల్లో పదేపదే వచ్చే అసంతృప్తితో కూడిన గొణుగుడు లేదా ఫిర్యాదు భావాన్ని ‘సణుగులు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעָלַי
  choice: నాపై
  rationale: వారి సణుగులు యాహ్వేకు విరోధంగా ఉన్నాయని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: וְלֹא יָמֻתוּ
  choice: వారు చనిపోరు
  rationale: సణుగులు ఆగడం వల్ల కలిగే ఉద్దేశిత ఫలితాన్ని తెలుపుతూ హీబ్రూ సమన్వయ వాక్య నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణకు అనుగుణంగా తెలుగులో ధ్వన్యంతరీకరించింది.
- issue: לִבְנֵי מֶרִי లోని లింగసూచక కుటుంబ నుడికారం
  choice: తిరుగుబాటు కుమారులకు
  alternative: తిరుగుబాటుదారులకు
  rationale: హీబ్రూలోని ‘కుమారులు’ అనే గుర్తించదగిన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది తిరుగుబాటు చేసేవారిని సూచించే నుడికారమని పాదసూచికలో స్పష్టం చేసింది.
- issue: ‘సాక్ష్యం’ దేనిని సూచిస్తుంది?
  choice: సాక్ష్యం
  alternative: సాక్ష్యపు మందసం / ఒడంబడిక పత్రం
  rationale: మూలపాఠం మందసాన్ని ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల దాని సంక్షిప్తతను, సాధ్యమైన సూచన పరిధిని ప్రధాన పాఠ్యంలో నిలిపి సందర్భ సమాచారాన్ని పాదసూచికకు పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. హీబ్రూ వాక్యంలోని ఉద్దేశం–ఫలితం సంబంధాన్ని సహజంగా చూపడానికి వాక్యాన్ని మూడు భాగాలుగా విభజించింది; అయితే మోషే వ్యాకరణ కర్తగా ఉండడాన్ని, చివరి మరణ నివారణ ఫలితాన్ని నిలిపింది.
