revisions:
- from: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “అహరోను కర్రను సాక్ష్యం ఎదుట తిరిగి ఉంచు.[b] అది తిరుగుబాటు కుమారులకు[a] ఒక సూచనగా భద్రపరచబడాలి. అలా నాపై వారి సణుగులకు నువ్వు ముగింపు పలుకుతావు; వారు చనిపోరు.”'
  to: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “అహరోను కర్రను సాక్ష్యం ముందు తిరిగి ఉంచు.[b] తిరుగుబాటు కుమారులకు[a] గుర్తుగా దానిని భద్రపరచి ఉంచు. అప్పుడు నాపై వారు చేసే గొణుగుళ్లను నువ్వు ఆపుతావు; వారు చనిపోకుండా ఉంటారు.”'
  rationale: The revision retains the source’s concise reference to “the testimony,” its marked expression “sons of rebellion,” and Yahweh’s name. It improves contemporary Telugu idiom, restores the imperative force of the preservation instruction, and expresses the final clause as the intended prevention of death.
