  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: te
  text: అప్పుడు అహరోను సమాగమ గుడారం ప్రవేశద్వారం దగ్గర ఉన్న మోషే దగ్గరికి తిరిగి వచ్చాడు. తెగులు నిలిచిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆపబడింది” లేదా “అదుపు చేయబడింది.”
    reason: నిలిచిపోవడం, ఆపబడడం, అదుపు చేయబడడం అనే עצר నిఫాల్ రూపంలోని సమీప భావ ఛాయలను సూచించడానికి.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: అప్పుడు … తిరిగి వచ్చాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; שׁוּב ఇక్కడ స్థలపరంగా ‘తిరిగి రావడం’ అనే సాధారణ అర్థంలో ఉంది.
- source_word: אֶל מֹשֶׁה
  choice: మోషే దగ్గరికి
  rationale: אֶל మోషే వైపు కదలికను సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరికి’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ప్రవేశద్వారం దగ్గరికి
  rationale: פֶּתַח అంటే ప్రవేశద్వారం లేదా తెరువు. אֹהֶל מוֹעֵדను దాని పారదర్శక అర్థానికి దగ్గరగా ‘సమావేశ గుడారం’గా అనువదించాం; రెండవ אֶל సూచించే గమ్యభావాన్ని కూడా నిలిపాం.
- source_word: הַמַּגֵּפָה
  choice: తెగులు
  rationale: మరణకరమైన దైవిక తీర్పు సందర్భంలో מַגֵּפָהకు ‘తెగులు’ స్పష్టమైన, ప్రాచుర్యంలో ఉన్న తెలుగు సమానార్థకం.
- source_word: נֶעֱצָרָה
  choice: నిలిచిపోయింది
  rationale: עצר నిఫాల్ రూపం తెగులు పూర్తిగా ఆగిపోయిందని సూచిస్తుంది. ‘నిలిచిపోయింది’ సహజమైన తెలుగులో ఫలితస్థితిని తెలియజేస్తూ, దానిని ఆపిన కర్తను స్పష్టంగా చేర్చదు.
theological_decisions:
- issue: తెగులు నిలిచిపోవడంలో సూచిత దైవిక కర్తృత్వం
  choice: కర్తను పేర్కొనకుండా ‘తెగులు నిలిచిపోయింది’ అని ఉంచడం
  alternative: ‘యెహోవా తెగులును ఆపాడు’
  rationale: హీబ్రూ వాక్యంలో కర్తను స్పష్టంగా పేర్కొనని నిఫాల్ రూపం ఉంది. సందర్భం దైవిక కర్తృత్వాన్ని సూచించినా, మూలపాఠం చెప్పని కర్తను అనువాదంలో చేర్చకుండా దాని సంయమనాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘సమావేశ గుడారం’ మూలపదబంధాన్ని పారదర్శకంగా తెలియజేస్తుంది. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘నిలిచిపోయింది’ అనే పదం వద్దే ఉంచాం.
