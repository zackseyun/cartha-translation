    text: లేదా, “ఆపబడింది” లేదా “అదుపు చేయబడింది.”
    reason: నిలిచిపోవడం, ఆపబడడం, అదుపు చేయబడడం అనే עצר నిఫాల్ రూపంలోని సమీప భావ ఛాయలను సూచించడానికి.
  revision_rationale: 'The revision resolves the Telugu syntactic ambiguity by expressing the location supplied by the Hebrew phrase sequence: Aaron returned to Moses, who was at the entrance of the tent of meeting. It also adopts the more idiomatic biblical Telugu term “సమాగమ గుడారం.” The passive/agent-unspecified sense of נֶעֱצָרָה is preserved, and the footnote remains anchored to the cessation verb.'
