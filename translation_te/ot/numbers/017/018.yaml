revisions:
- from: లేవి గోత్రపు కర్ర మీద అహరోను పేరు రాయాలి. ఎందుకంటే వారి పితృకుటుంబానికి అధిపతిగా ఉన్న ఒక్కొక్కరికి ఒక్క కర్ర ఉండాలి.
  to: లేవి గోత్రపు కర్రపై అహరోను పేరు రాయాలి. ఎందుకంటే వారి పితృకుటుంబ అధిపతికి ఒక్క కర్ర ఉండాలి.[a]
  rationale: The revision retains the Hebrew’s singular, compact phrasing in the main text, improves Telugu fluency, and supplies a footnote for the distributive construal documented in the English POB audit trail. No theological interpretation is introduced.
  reviewer_model: gpt-5.6-terra
