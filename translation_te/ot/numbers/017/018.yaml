reference: Numbers 17:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ שֵׁ֣ם אַהֲרֹ֔ן תִּכְתֹּ֖ב עַל מַטֵּ֣ה לֵוִ֑י כִּ֚י מַטֶּ֣ה אֶחָ֔ד לְ/רֹ֖אשׁ בֵּ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: te
  text: లేవి గోత్రపు కర్రపై అహరోను పేరు రాయాలి. ఎందుకంటే వారి పితృకుటుంబ అధిపతికి ఒక్క కర్ర ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పితృకుటుంబాల ప్రతి అధిపతికి ఒక్క కర్ర.” హెబ్రీ పదబంధాన్ని పంపిణీ అర్థంలో, ప్రతి పితృకుటుంబాధిపతికి ఒక కర్ర అనే విధంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: —
  rationale: వావ్ మునుపటి ఆదేశాన్ని కొనసాగిస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు. אֵת ప్రత్యక్ష కర్మ సూచిక కాబట్టి విడిగా అనువదించబడదు.
- source_word: שֵׁם אַהֲרֹן
  choice: అహరోను పేరు
  rationale: వ్యక్తిగత పేరును కర్రపై రాయాలని సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: תִּכְתֹּב
  choice: రాయాలి
  rationale: ఆదేశ సందర్భంలోని ద్వితీయ పురుష ఏకవచన క్రియను ఆధునిక తెలుగులో సహజమైన విధ్యర్థక రూపంతో తెలిపింది.
- source_word: עַל מַטֵּה לֵוִי
  choice: లేవి గోత్రపు కర్ర మీద
  rationale: מַטֶּה ఇక్కడ నిజమైన కర్రను, అదే సమయంలో గోత్ర ప్రాతినిధ్యాన్ని సూచిస్తుంది. ‘లేవి గోత్రపు’ అని చెప్పడం తెలుగులో భావాన్ని స్పష్టం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అహరోను పేరు ఎందుకు రాయాలో తెలిపే కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַטֶּה אֶחָד
  choice: ఒక్క కర్ర
  rationale: ప్రతి కుటుంబాధిపతికి ఒకే ప్రాతినిధ్య కర్ర అనే సంఖ్యాపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: వారి పితృకుటుంబానికి అధిపతిగా ఉన్న ఒక్కొక్కరికి
  rationale: רֹאשׁ ను నాయకత్వార్థంలో ‘అధిపతి’గా, בֵּית אֲבוֹתָם ను వంశపారంపర్య పితృసంబంధ కుటుంబ విభాగంగా ‘పితృకుటుంబం’గా అనువదించింది. ఏకవచన రూపానికి సందర్భంలో ఉన్న పంపిణీయ భావాన్ని సహజ తెలుగులో ‘ఒక్కొక్కరికి’గా వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘దండం’ కంటే సందర్భంలోని సాధారణ వస్తువును సూచించేందుకు ‘కర్ర’ వాడబడింది; ‘పితృకుటుంబం’ మూలంలోని బంధుత్వ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
