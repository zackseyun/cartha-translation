  text: וַ/יָּבֹ֤א מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶל פְּנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను సమావేశ గుడారం ఎదుటికి[a] వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరాలా, ‘సమావేశ గుడారం ముఖం వైపుకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చారు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తూ గతకాల క్రియను సూచిస్తుంది. హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నప్పటికీ, మోషే మరియు అహరోను అనే సంయుక్త కర్తకు సహజమైన ఆధునిక తెలుగు బహువచన క్రియను వాడింది. ‘లోపలికి ప్రవేశించారు’ అనడం సందర్భం చెప్పేదానికంటే ఎక్కువ నిర్దిష్టతను కలిగిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో సాధారణంగా స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְאַהֲרֹן
  choice: అహరోను
  rationale: సంయోజకార్థాన్ని తెలుగు జాబితా నిర్మాణంలో కామాతో సహజంగా వ్యక్తపరచి, స్థిరపడిన వ్యక్తినామ రూపాన్ని వాడింది.
- source_word: אֶל־פְּנֵי
  choice: ఎదుటికి
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘ముఖం వైపుకు’ అని ఉన్నా, ఇక్కడ ఒక స్థలం ఎదుటికి చేరడాన్ని సూచిస్తుంది. ‘ఎదుటికి’ దిశాభావాన్ని మరియు స్థానార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు ఆరాధనా స్థలాన్ని సూచించే ఈ పదబంధానికి తెలుగులో సుపరిచితమైన గౌరవప్రద రూపం; ఒక సాధారణ గుడారాన్ని కాక ప్రత్యేక పరిశుద్ధ స్థలాన్ని సూచిస్తుంది.
