translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని దిశాభావాన్ని ‘ఎదుటికి’ ద్వారా నిలిపి, గుడారం లోపలికి ప్రవేశించారని అనవసరంగా నిర్ధారించలేదు.
