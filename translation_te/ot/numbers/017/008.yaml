  terminology: Replace ‘ప్రత్యక్ష గుడారం’ with ‘సమావేశ గుడారం,’ a clear modern Telugu rendering of ‘Tent of Meeting.’ The personal names are acceptable. The footnote should likewise use the corrected sanctuary term.
