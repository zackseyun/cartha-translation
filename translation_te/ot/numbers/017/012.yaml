id: NUM.17.12
reference: Numbers 17:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: te
  text: మోషే చెప్పినట్లే అహరోను దానిని[a] తీసుకొని, సమాజం మధ్యలోకి పరుగెత్తాడు. చూడగా, అప్పటికే ప్రజల్లో తెగులు మొదలైపోయింది. అప్పుడు అతడు ధూపం వేసి[b], ప్రజల కోసం ప్రాయశ్చిత్తం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘దానిని’ అనే కర్మ స్పష్టంగా లేదు; ముందరి వచనం ప్రకారం ధూపపాత్ర ఉద్దేశించబడింది.
    reason: implicit_object
  - marker: b
    text: లేదా ‘ధూపద్రవ్యాన్ని ఉంచి’; హీబ్రూ పదబంధం అక్షరార్థంగా ‘ధూపద్రవ్యాన్ని ఇచ్చాడు/ఉంచాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: దానిని తీసుకొని
  rationale: హీబ్రూలో క్రియకు ప్రత్యక్ష కర్మ లేదు; ముందరి వచనంలోని ధూపపాత్రను సందర్భం సూచిస్తుంది. సహజమైన తెలుగుకోసం ‘దానిని’ చేర్చినా, పాదసూచికలో మూలంలోని సంక్షిప్తతను తెలిపాం.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: మోషే చెప్పినట్లే
  rationale: דבר యొక్క ప్రాథమిక భావం ‘చెప్పు/మాట్లాడు.’ సందర్భంలో అది ఆదేశమైనప్పటికీ, ‘ఆజ్ఞాపించినట్లే’ అని మరింత నిర్దిష్టం చేయకుండా మూలానికి దగ్గరగా ఉంచాం.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: సమాజం మధ్యలోకి పరుగెత్తాడు
  rationale: רוץ ను ‘పరుగెత్తాడు’ అని నేరుగా అనువదించాం; קהל ఇక్కడ కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది.
- source_word: וְהִנֵּה
  choice: చూడగా, అప్పటికే
  rationale: הִנֵּה దృశ్యంలోని హఠాత్తు గ్రహింపును, పరిస్థితిపై దృష్టిని సూచిస్తుంది. ఆధునిక సహజ తెలుగులో ‘చూడగా, అప్పటికే’ ఆ కథన ప్రభావాన్ని అందిస్తుంది.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: ప్రజల్లో తెగులు మొదలైపోయింది
  rationale: נֶגֶף ఇక్కడ ప్రజలను తాకిన ప్రాణాంతక తెగులును సూచిస్తుంది. ‘మొదలైపోయింది’ అహరోను చేరేసరికే అది ఆరంభమైనదనే కథన భావాన్ని తెలియజేస్తుంది.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: ధూపం వేసి
  rationale: נתן అక్షరార్థంగా ‘ఇచ్చాడు/ఉంచాడు’; ధూపక్రియ సందర్భంలో ‘ధూపం వేసి’ సహజమైన తెలుగు. ఇది ‘అర్పించాడు’ అనే మరింత వ్యాఖ్యాత్మక పదాన్ని నివారిస్తుంది.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: ప్రజల కోసం ప్రాయశ్చిత్తం చేశాడు
  rationale: యాజక క్రియాసందర్భంలో כפר కు స్థిరమైన, గంభీరమైన సమానార్థం ‘ప్రాయశ్చిత్తం చేయడం.’ క్రియ ఎలా ఫలించింది అనే సిద్ధాంతపరమైన యంత్రాంగాన్ని అదనంగా నిర్దేశించదు.
theological_decisions:
- issue: כפר అనే ఆరాధనా సంబంధ క్రియ అనువాదం
  choice: ప్రాయశ్చిత్తం చేశాడు
  alternative: పరిహారం చేశాడు
  rationale: ఈ సందర్భం యాజక మధ్యవర్తిత్వం ద్వారా ప్రజలపై వచ్చిన తీర్పు నిలిపివేయబడటాన్ని వివరిస్తుంది. ‘ప్రాయశ్చిత్తం’ మూలంలోని ఆరాధనా-దైవశాస్త్ర గంభీరతను కాపాడుతూ, దాని విధానాన్ని అతిగా నిర్వచించదు.
- issue: קָהָל ద్వారా సూచించబడిన సమూహం
  choice: సమాజం
  alternative: సభ / జనసమూహం
  rationale: ఇది కేవలం యాదృచ్ఛిక గుంపు కాక, కూడివున్న ఇశ్రాయేలు సమాజం. ‘సమాజం’ ఆ సామూహిక గుర్తింపును కాపాడుతుంది; ప్రత్యేక మతసంస్థ భావాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, ఆరాధనా సందర్భానికి తగిన గంభీరతను కలిపాం. ‘చూడగా, అప్పటికే’ ద్వారా הִנֵּה యొక్క దృశ్యాత్మక ఉద్ఘాటనను సహజంగా వ్యక్తం చేశాం; ‘ప్రాయశ్చిత్తం’ అనే స్థిరమైన ఆరాధనా పదాన్ని నిలుపుకున్నాం.
