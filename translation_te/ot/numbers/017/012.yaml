  source_fidelity: మూల హీబ్రూ వాక్యంలోని క్రమం, సూచిత కర్మ (‘దానిని’), మోషే చెప్పినట్లే చేసిన చర్య, సమాజం మధ్యకు పరుగెత్తడం, ప్రజల్లో ఇప్పటికే ప్రారంభమైన తెగులు, ధూపం ఉంచడం, ప్రజల కొరకు ప్రాయశ్చిత్తం చేయడం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘అప్పటికే’ హీబ్రూ కథనంలో הִנֵּה తరువాత సూచితమైన ఇప్పటికే-సంభవించిన స్థితిని సహజంగా తెలియజేస్తుంది.
