  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: te
  text: వాటిని సన్నిధి గుడారంలో, సాక్ష్యం ఎదుట ఉంచు; అక్కడ నేను మీతో కలుస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అక్కడ నేను మీకు నన్ను తెలియజేసుకుంటాను’ లేదా ‘అక్కడ నేను మీతో కలిసే స్థలాన్ని నిర్ణయిస్తాను’ అని కూడా అనువదించవచ్చు. ‘సాక్ష్యం’ నిబంధనకు సాక్ష్యంగా ఉన్న పలకలను లేదా వాటితో సంబంధమున్న పవిత్ర సాక్ష్యాన్ని సూచించవచ్చు.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: వాటిని ఉంచు
  rationale: హిఫిల్ రూపం వస్తువులను ఒకచోట ఉంచించడాన్ని సూచిస్తుంది. సందర్భంలోని ఏకవచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో ‘ఉంచు’గా ఇచ్చాం.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సన్నిధి గుడారంలో
  rationale: ఇది ఇశ్రాయేలు ఆరాధనా గుడారానికి స్థిరమైన పేరు. ‘సన్నిధి గుడారం’ దేవునితో నియమిత సమావేశ స్థలమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי הָעֵדוּת
  choice: సాక్ష్యం ఎదుట
  rationale: לִפְנֵי అంటే ‘ఎదుట’; הָעֵדוּתను విస్తరించి పలకలు లేదా మందసం అని నిర్దిష్టం చేయకుండా ‘సాక్ష్యం’గా నిలిపాం.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: అక్కడ నేను ... కలుస్తాను
  rationale: יעד నిఫాల్ రూపం నియమితంగా కలుసుకోవడాన్ని సూచిస్తుంది; אֲשֶׁר మరియు שָׁמָּה కలిపి స్థలార్థకమైన ‘అక్కడ’గా సహజంగా అనువదించాం.
- source_word: לָכֶם
  choice: మీతో
  rationale: అక్షరార్థంగా ‘మీకు/మీ కొరకు’ అయినప్పటికీ, יעדతో కూడిన ఈ ప్రయోగంలో తెలుగులో ‘మీతో కలుస్తాను’ అనేది సరైన సహజార్థం.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: హీబ్రూ స్థలవాచక క్రియావిశేషణాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: ‘సాక్ష్యం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘సాక్ష్యం’ అనే విస్తరించని పదాన్ని నిలిపాం.
  alternative: ‘సాక్ష్యపు పలకలు’, ‘సాక్ష్య మందసం’, లేదా ‘నిబంధన సాక్ష్యం’
  rationale: హీబ్రూ ఇక్కడ సూచిత వస్తువును మరింత నిర్దిష్టం చేయదు. అది నిబంధన పలకలను లేదా వాటితో సంబంధమున్న పవిత్ర సాక్ష్యాన్ని సూచించవచ్చు; అనువాదంలో ఆ అస్పష్టతను కాపాడాం.
- issue: אִוָּעֵד యొక్క భావం
  choice: ‘నేను మీతో కలుస్తాను’
  alternative: ‘నేను మీకు ప్రత్యక్షమవుతాను’ లేదా ‘నేను మీతో కలుసుకోవడానికి నియమించుకున్న స్థలం’
  rationale: ఈ సందర్భంలో మూలక్రియ ప్రధానంగా నియమిత సమావేశాన్ని సూచిస్తుంది. ప్రత్యక్షత లేదా తనను తెలియజేసుకోవడం అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలిని అనుసరించాం. మోషేను ఉద్దేశించిన ఏకవచన ఆజ్ఞను ‘ఉంచు’గా, సమాజాన్ని సూచించే బహువచనాన్ని ‘మీతో’గా వేరుచేశాం. మూలంలోని ‘సాక్ష్యం’ అనే ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
