  terminology: ‘సమాజం’ עֵדָהకు అనుకూలమైన, సందర్భానికి తగిన పదం. ‘తొలగిపోండి’ మరియు ‘అంతం చేస్తాను’ తీర్పు యొక్క అత్యవసరతను, తీవ్రతను నిలుపుతాయి. పాదసూచికలు సంబంధిత ప్రధానపదాలకు సరిగ్గా అనుసంధానించబడ్డాయి.
