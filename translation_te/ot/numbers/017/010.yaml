  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: te
  text: “ఈ సమాజం మధ్యనుండి తొలగిపోండి[a]. నేను వారిని క్షణంలోనే అంతం చేస్తాను[b].” అప్పుడు వారు ముఖాలు నేలకు ఆనించి పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఈ సమాజం మధ్యనుండి పైకి లేవండి’; లేదా ‘ఈ సమూహం మధ్యనుండి మిమ్మల్ని మీరు వేరుచేసుకోండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్షణంలోనే నిర్మూలిస్తాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: తొలగిపోండి
  rationale: నిఫాల్ ఆజ్ఞారూపంలోని ‘పైకి లేవండి/ఎత్తబడండి’ అనే మూలచిత్రం ఈ సందర్భంలో సమాజం మధ్యనుండి దూరంగా వెళ్లాలనే ఆజ్ఞగా పనిచేస్తుంది. ఆధునిక తెలుగులో ‘తొలగిపోండి’ ఆ తక్షణ వియోగాన్ని సహజంగా తెలియజేస్తుంది; మరింత అక్షరార్థమైన రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִתּוֹךְ
  choice: మధ్యనుండి
  rationale: ఒక గుంపు లోపలి భాగం నుండి వేరై బయటకు రావడాన్ని ఈ పదబంధం సూచిస్తుంది.
- source_word: הָעֵדָה הַזֹּאת
  choice: ఈ సమాజం
  rationale: עֵדָה ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: וַאֲכַלֶּה
  choice: నేను … అంతం చేస్తాను
  rationale: כלה పియేల్ రూపం పూర్తిగా ముగించడం, నిర్మూలించడం అనే భావాన్ని కలిగి ఉంది. ‘అంతం చేస్తాను’ తీర్పు తీవ్రతను నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: כְּרָגַע
  choice: క్షణంలోనే
  rationale: అత్యంత స్వల్ప సమయంలో జరిగే చర్యను సూచిస్తుంది; ‘నే’ తక్షణత్వాన్ని సహజంగా నొక్కి చెబుతుంది.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: అప్పుడు వారు ముఖాలు నేలకు ఆనించి పడిపోయారు
  rationale: హీబ్రూ కథన క్రమాన్నీ, ముఖం కిందపెట్టి పడే శరీర భంగిమనూ స్పష్టంగా తెలియజేస్తుంది; అది ఆరాధనా, భయమా, విజ్ఞాపనా అని అనువాదంలో నిర్ణయించదు.
theological_decisions:
- issue: మోషే అహరోనులకు ఇచ్చిన దైవిక ఆజ్ఞ స్వభావం
  choice: రాబోయే తక్షణ తీర్పుకు ముందు సమాజం మధ్యనుండి తొలగిపోవాలనే అత్యవసర ఆజ్ఞగా అనువదించాం.
  alternative: ‘పైకి లేవండి’ లేదా ‘మిమ్మల్ని మీరు వేరుచేసుకోండి’ అని మరింత అక్షరార్థంగా అనువదించడం.
  rationale: హీబ్రూ ఆజ్ఞ వెంటనే ప్రజలను అంతం చేయాలనే దేవుని ఉద్దేశంతో అనుసంధానమై ఉంది. అందువల్ల తీర్పు తీవ్రతను తగ్గించకుండా, సందర్భంలోని వియోగ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
- issue: ముఖాలు నేలకు ఆనించి పడిపోవడం యొక్క ఉద్దేశం
  choice: కేవలం శరీర భంగిమను తెలిపాం.
  alternative: దీనిని ‘సాష్టాంగపడ్డారు’, ‘ఆరాధించారు’ లేదా ‘విజ్ఞాపన చేశారు’ అని ఉద్దేశాన్ని స్పష్టీకరించడం.
  rationale: సందర్భం విజ్ఞాపనను సూచించగలిగినా, ఈ వాక్యంలోని హీబ్రూ పదబంధం స్వయంగా ఉద్దేశాన్ని నిర్దిష్టంగా చెప్పదు; అందువల్ల ఆ అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. దైవిక తీర్పు తీవ్రతను మెత్తబరచలేదు. ‘ముఖాలు నేలకు ఆనించి’ అనే రూపం సాధారణ పాఠకునికి భంగిమను స్పష్టంగా చూపుతూ, దాని ధార్మిక ఉద్దేశాన్ని అనవసరంగా నిర్ణయించదు.
