    reason: దైవనామపు హీబ్రూ రూపాన్ని మరియు సంప్రదాయ బిరుదు-అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది. తరువాత לֵאמֹר ఉన్నందున ‘చెప్పాడు’ అనే మాట మొత్తం వాక్యసూత్రాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: హీబ్రూ దిశాసూచక విభక్తి ఇక్కడ మాటల గ్రహీతను సూచిస్తుంది; తెలుగులో ‘మోషేతో’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: ఈ క్రియానామ సూత్రం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా చెప్పాడు:’ దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. తరువాతి ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు చివర ద్విబిందువు వాడబడింది; మూలంలోని సంక్షిప్త వాక్యసూత్రం నిలుపబడింది.
