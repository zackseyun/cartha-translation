source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: te
  text: 'ఇశ్రాయేలీయులు మోషేతో ఇలా అన్నారు: “ఇదిగో, మేము చనిపోతున్నాం! నశించిపోతున్నాం! మేమంతా నశించిపోతున్నాం!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో మొదట ‘చనిపోతున్నాం’ (גוע), తరువాత రెండుసార్లు ‘నశించిపోతున్నాం’ (אבד) అనే వేర్వేరు క్రియలు ఉన్నాయి; ఈ పునరుక్తి ప్రజల భయాందోళనను తీవ్రంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: మోషేతో ఇలా అన్నారు
  rationale: తెలుగులో ప్రత్యక్ష ఉల్లేఖనాన్ని సహజంగా పరిచయం చేస్తూ, לֵאמֹר యొక్క ఉల్లేఖనాత్మక విధిని ‘ఇలా’ తెలియజేస్తుంది.
- source_word: הֵן
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షిస్తూ భయాందోళనను వ్యక్తం చేసే హీబ్రూ ఉద్గార పదానికి ప్రస్తుత ప్రామాణిక తెలుగులో తగిన రూపం.
- source_word: גָּוַעְנוּ
  choice: మేము చనిపోతున్నాం
  rationale: ప్రాణం విడవడం లేదా చనిపోవడం అనే భావాన్ని, ప్రజల తక్షణ భయాన్ని ప్రతిబింబించే వర్తమాన కొనసాగింపు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: אָבַדְנוּ
  choice: నశించిపోతున్నాం
  rationale: నాశనం కావడం, అంతరించిపోవడం అనే తీవ్ర భావాన్ని తెలియజేస్తూ, ముందున్న גוע (‘చనిపోవడం’)తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: כֻּלָּנוּ
  choice: మేమంతా
  rationale: ప్రజలందరినీ కలిపి చెప్పే హీబ్రూ ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָבָדְנוּ (repeated)
  choice: నశించిపోతున్నాం
  rationale: భయంతో కూడిన మూలపాఠపు పునరుక్తిని నిలుపుటకు అదే తెలుగు క్రియను మళ్లీ ఉపయోగించింది.
