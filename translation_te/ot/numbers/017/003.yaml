  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: te
  text: తమ ప్రాణాలను కోల్పోయేలా పాపం చేసిన ఈ మనుషుల ధూపపాత్రలను[a] సుత్తితో కొట్టి పలకలుగా చేసి బలిపీఠాన్ని కప్పే పొరగా చేయాలి. ఎందుకంటే వారు వాటిని యహ్వే సన్నిధిలో అర్పించారు; అందువల్ల అవి పవిత్రమయ్యాయి[b]. అవి ఇశ్రాయేలీయులకు ఒక సూచనగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ఈ మాటలను ‘తమ ప్రాణాల విషయంలో పాపం చేసిన ఈ పాపుల ధూపపాత్రలు’ అని మరింత అక్షరార్థంగా అనువదించవచ్చు. సందర్భంలో వారి పాపం వారి ప్రాణనష్టానికి దారితీసిందనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పవిత్రంగా ప్రతిష్ఠించబడ్డాయి’ అని కూడా అనువదించవచ్చు. ఈ బహువచన క్రియకు సహజమైన కర్త ధూపపాత్రలే.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: ధూపపాత్రలు
  rationale: తిరుగుబాటు సందర్భంలో ధూపం అర్పించడానికి ఉపయోగించిన పాత్రలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ధూపపాత్రలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: తమ ప్రాణాలనే పోగొట్టుకునేలా పాపం చేసిన ఈ మనుషులు
  rationale: పాపక్రియ వల్ల వారి ప్రాణాలు పోయాయనే సందర్భార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ‘పాపులు’ అనే స్థిరమైన ముద్రకన్నా హీబ్రూ కృదంతంలోని క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: רִקֻּעֵי פַחִים
  choice: సుత్తితో కొట్టి పలకలుగా
  rationale: లోహాన్ని కొట్టి పలుచని పలకలుగా చేసే ప్రక్రియను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: బలిపీఠానికి పైపూతగా
  rationale: కొట్టిన లోహపు పలకలు బలిపీఠాన్ని కప్పే పూతగా ఉపయోగించబడతాయనే ఉద్దేశాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: వాటిని యహ్వే సన్నిధిలో అర్పించారు
  rationale: הקריב అనే ఆరాధనా సంబంధ క్రియకు ‘అర్పించారు’ తగిన గంభీరతను ఇస్తుంది; ‘సన్నిధిలో’ לפני భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיִּקְדָּשׁוּ
  choice: అవి పవిత్రమయ్యాయి
  rationale: సమీప బహువచన పూర్వపదమైన ధూపపాత్రలనే కర్తగా తీసుకుంటూ, కర్తృత్వాన్ని అతిగా నిర్దేశించకుండా ఫలితస్థితిని నిలుపుతుంది.
- source_word: וְיִהְיוּ לְאוֹת לִבְנֵי יִשְׂרָאֵל
  choice: అవి ఇశ్రాయేలీయులకు ఒక సూచనగా ఉండాలి
  rationale: స్మారక-హెచ్చరిక పాత్రను వ్యాఖ్యానించి విస్తరించకుండా ‘సూచన’గా ఉంచుతుంది; ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజమైన సమూహపేరు.
theological_decisions:
- issue: పవిత్రమయ్యాయి అనే క్రియకు కర్త
  choice: ధూపపాత్రలు పవిత్రమయ్యాయి
  alternative: ఆ మనుషులు పవిత్రులయ్యారు; లేదా పాత్రలు కేవలం ఆచారపరంగా ప్రత్యేకించబడ్డాయి
  rationale: బహువచన క్రియకు అత్యంత సమీపమైన సహజ పూర్వపదం ధూపపాత్రలే; వాటిని బలిపీఠపు పైపూతగా మార్చడానికి ఇచ్చిన కారణంతో కూడా ఇది సరిపోతుంది. పాపంతో ముడిపడిన వస్తువులు దేవుని సన్నిధిలో అర్పించబడినందున పవిత్రస్థితి పొందాయనే పాఠ్యంలోని ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- issue: בְּנַפְשֹׁתָם యొక్క భావం
  choice: వారి పాపం వారి ప్రాణనష్టానికి దారితీసింది
  alternative: వారు తమ ప్రాణాలకు విరోధంగా పాపం చేశారు; లేదా తమ ఆత్మల విషయంలో పాపం చేశారు
  rationale: ఈ సందర్భంలో తిరుగుబాటు మరణంతో ముగిసినందున ‘ప్రాణాలు’ అనేది జీవాన్ని సూచిస్తుంది; ఆత్మ-శరీర భేదంపై అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం. హీబ్రూ వాక్యంలోని పొడవును తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; కారణ-ఫలిత సంబంధం మాత్రం నిలుపుకున్నాం.
