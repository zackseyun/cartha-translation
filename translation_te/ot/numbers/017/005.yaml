source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: te
  text: 'ఇది ఇశ్రాయేలు ప్రజలకు జ్ఞాపకంగా[a] ఉంటుంది: అహరోను సంతతికి చెందని అనధికార వ్యక్తి[b] ఎవడూ యెహోవా సన్నిధిలో ధూపం అర్పించడానికి సమీపించకుండునట్లు, అతడు కోరహువలెను అతని సమూహంవలెను కాకుండునట్లు—యెహోవా మోషే ద్వారా[c] అతనికి[d] చెప్పిన ప్రకారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జ్ఞాపకార్థమైన గుర్తు,’ ‘స్మారకం,’ లేదా ‘జ్ఞాపకం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అనధికార వ్యక్తి’ అంటే జాతిపరంగా విదేశీయుడు అని కాదు; అహరోను యాజక వంశానికి చెందక, ఈ యాజక సేవ చేయడానికి అధికారం లేని వ్యక్తి అని అర్థం.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; అంటే ‘మోషే ద్వారా.’
    reason: lexical_alternative
  - marker: d
    text: ‘అతనికి’ అన్నది బహుశా అహరోనును సూచిస్తుంది; హీబ్రూ వాక్యంలో పూర్వపదం స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: జ్ఞాపిక
  rationale: ఏదో ఒక విషయాన్ని నిరంతరం జ్ఞాపకం చేసే గుర్తు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులకు’ కంటే సమూహమంతటినీ సూచించే సహజమైన తెలుగు రూపం.
- source_word: אִישׁ זָר
  choice: బయటి వ్యక్తి
  rationale: ఇక్కడ జాతిపరంగా విదేశీయుడని కాక, అహరోను యాజక వంశానికి వెలుపల ఉండి ఈ సేవకు అధికారం లేని వ్యక్తిని సూచిస్తుంది; వివరాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: అహరోను సంతతికి చెందని
  rationale: వంశ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: ధూపం వేయడానికి
  rationale: ధూపాన్ని పొగచేయడం లేదా అర్పించడం అనే ఆరాధనా చర్యకు సాధారణంగా అర్థమయ్యే తెలుగు ప్రయోగం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దైవనామాన్ని ప్రత్యక్షంగా ఉంచుతూ, ఆరాధనా సందర్భంలోని సమక్షత భావాన్ని అందిస్తుంది.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: అతడు కోరహులాగా, అతని సమూహంలాగా కాకూడదనీ
  rationale: ఏకవచన క్రియను నిలుపుతూ, కోరహు మరియు అతని వర్గం పొందిన పరిణామం లేదా వారి మాదిరి తిరుగుబాటు రెండింటి వైపు ఉండగల సూచనను పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; మధ్యవర్తిత్వాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచింది.
- issue: యాజక సందర్భంలో זָר భావం
  choice: బయటి వ్యక్తి
  alternative: అనధికార వ్యక్తి
  rationale: మూలపదంలోని ‘వెలుపలివాడు’ అనే రూపాన్ని నిలుపుతూ, ఇది జాతిపరమైన విదేశీయత్వం కాదని పాదసూచికలో వివరిస్తుంది.
- issue: כְקֹרַח וְכַעֲדָתוֹ హెచ్చరిక స్వభావం
  choice: కోరహులాగా, అతని సమూహంలాగా కాకూడదు
  alternative: కోరహుకు, అతని సమూహానికి పట్టిన గతి అతనికి పట్టకూడదు
  rationale: మూలంలోని పోలిక తిరుగుబాటు ప్రవర్తననో దాని పరిణామాన్నో సూచించవచ్చు; ప్రధాన పాఠం ఆ ఉద్రిక్తతను పరిష్కరించదు.
- issue: చివరి לוֹ సర్వనామ పూర్వపదం
  choice: అతనికి
  alternative: అహరోనుకు
  rationale: హీబ్రూ పాఠంలోని సర్వనామ అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, సంభావ్య సూచనను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ఉద్దేశార్థక నిర్మాణాన్ని తెలుగులో సహజంగా తెలియజేయడానికి రెండో వాక్యంలో ‘ఇది వారికి గుర్తుచేస్తుంది’ అని స్పష్టీకరించాం. ‘ఎవడూ’ అనే రూపం వ్యక్తిని ఏకవచనంగా ఉంచుతుంది; మిగతా పదజాలం అతిగా ప్రాచీనంగా లేకుండా చూసాం.
