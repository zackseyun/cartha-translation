revisions:
- from: ఇది ఇశ్రాయేలు ప్రజలకు ఒక జ్ఞాపికగా[a] ఉంటుంది. అహరోను సంతతికి చెందని బయటి వ్యక్తి[b] ఎవడూ యెహోవా సన్నిధిలో ధూపం వేయడానికి సమీపించకూడదనీ, అతడు కోరహులాగా, అతని సమూహంలాగా కాకూడదనీ ఇది వారికి గుర్తుచేస్తుంది—యెహోవా మోషే ద్వారా[c] అతనికి[d] చెప్పినట్టే.
  to: 'ఇది ఇశ్రాయేలు ప్రజలకు జ్ఞాపకంగా[a] ఉంటుంది: అహరోను సంతతికి చెందని అనధికార వ్యక్తి[b] ఎవడూ యెహోవా సన్నిధిలో ధూపం అర్పించడానికి సమీపించకుండునట్లు, అతడు కోరహువలెను అతని సమూహంవలెను కాకుండునట్లు—యెహోవా మోషే ద్వారా[c] అతనికి[d] చెప్పిన ప్రకారం.'
  rationale: The revision restores the Hebrew’s single memorial statement followed by two coordinated purpose clauses, rather than adding ‘ఇది వారికి గుర్తుచేస్తుంది.’ It also uses idiomatic cultic Telugu for incense offering and a contextually precise rendering for זָר. The final pronoun remains deliberately ambiguous in the main text, with the likely reference retained in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:53:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the memorial function, the restriction to Aaron’s lineage, incense offering before Yahweh, and the warning based on Korah. However, its second sentence (‘ఇది వారికి గుర్తుచేస్తుంది’) adds an explanatory verbal construction not present in the Hebrew and weakens the direct purpose clauses. The revision keeps the Hebrew purposive sequence and its unresolved final pronoun.
  naturalness: ‘బయటి వ్యక్తి’ is understandable but somewhat unnatural in this cultic/legal context, and ‘ధూపం వేయడానికి’ is less precise than the usual worship-language expression ‘ధూపం అర్పించడానికి.’ The revised sentence is direct, modern standard Telugu, and does not introduce an extra sentence-level interpretation.
  terminology: ‘అనధికార వ్యక్తి’ accurately conveys זָר in this priestly context; the footnote preserves the clarification that ethnicity is not in view. ‘జ్ఞాపకంగా,’ ‘అహరోను సంతతి,’ ‘ధూపం అర్పించడం,’ ‘యెహోవా సన్నిధి,’ and ‘సమూహం’ are suitable. The divine name is consistently rendered ‘యెహోవా.’
  issues:
  - severity: medium
    issue: The purpose structure is recast as ‘ఇది వారికి గుర్తుచేస్తుంది.’
    rationale: The Hebrew directly states that the object is a memorial so that no unauthorized person may approach and so that he may not be like Korah. Making the memorial itself ‘remind them’ is a reasonable inference but is an added explicitation and obscures the linked purpose clauses.
  - severity: low
    issue: ‘బయటి వ్యక్తి’ is stylistically awkward and potentially broader than the intended cultic sense.
    rationale: In this context זָר denotes a person unauthorized to perform priestly incense service. ‘అనధికార వ్యక్తి,’ supported by a note, is more idiomatic and precise without implying ethnic foreignness.
  - severity: low
    issue: ‘ధూపం వేయడానికి’ is less exact cultic Telugu.
    rationale: ‘ధూపం అర్పించడానికి’ naturally expresses the ritual act of offering/burning incense before Yahweh.
  revised_text: 'ఇది ఇశ్రాయేలు ప్రజలకు జ్ఞాపకంగా[a] ఉంటుంది: అహరోను సంతతికి చెందని అనధికార వ్యక్తి[b] ఎవడూ యెహోవా సన్నిధిలో ధూపం అర్పించడానికి సమీపించకుండునట్లు, అతడు కోరహువలెను అతని సమూహంవలెను కాకుండునట్లు—యెహోవా మోషే ద్వారా[c] అతనికి[d] చెప్పిన ప్రకారం.'
  revised_footnotes:
