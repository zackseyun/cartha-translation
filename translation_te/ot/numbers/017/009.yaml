  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామానికి వాడుకలో ఉన్న ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడుతూ
  rationale: దבר అనే క్రియకు ఉన్న ‘మాట్లాడు’ భావాన్ని నిలుపుతూ, తరువాతి לֵאמֹר (‘అంటూ/అన్నాడు’)తో ఉన్న భేదాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో సాధారణంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించింది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తిని సూచించే אֶל‌ను తెలుగులో సహజంగా ‘తో’ అనే సంబంధంతో వ్యక్తం చేసింది; מֹשֶׁהకు ప్రామాణిక తెలుగు నామరూపం ‘మోషే’.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ద్విబిందువు ఆ వాక్యం కొనసాగుతుందని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; అయితే దాని పురాతన ఖచ్చిత ఉచ్చారణ పూర్తిగా నిర్ధారించలేనందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే దైవవాక్య పఠనానికి తగిన గౌరవప్రద శైలిలో ఉంచబడింది. דבר మరియు אמר మధ్యనున్న మూలభాషా భేదాన్ని ‘మాట్లాడుతూ … అన్నాడు’ ద్వారా కొంతవరకు నిలుపుకుంది.
