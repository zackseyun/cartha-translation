id: NUM.17.22
reference: Numbers 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: te
  text: అప్పుడు మోషే ఆ కర్రలను[a] యాహ్వే ఎదుట సాక్ష్యపు గుడారంలో[b] ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దండాలను.’ హీబ్రూ పదం ఇక్కడ గోత్రాలకు ప్రాతినిధ్యం వహించిన భౌతిక కర్రలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సాక్ష్యపు నివాసగుడారంలో.’ అక్షరార్థంగా, ‘సాక్ష్యపు గుడారంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: ఉంచాడు
  rationale: హిఫిల్ రూపంలోని נוח ఇక్కడ ఏదైనా వస్తువును ఒక చోట పెట్టడం లేదా ఉంచడం అనే అర్థం ఇస్తుంది. ‘ఉంచాడు’ సహజమైన ఆధునిక తెలుగు కథన రూపం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: הַמַּטֹּת
  choice: ఆ చేతికర్రలను
  rationale: מַטֶּה అనే పదానికి ‘కర్ర,’ ‘దండం,’ ‘గోత్రం’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో గోత్రాలకు ప్రాతినిధ్యం వహించే భౌతిక కర్రలే ఉద్దేశించబడ్డాయి; ‘చేతికర్రలు’ సాధారణ పాఠకులకు వస్తువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఈ ఉపసర్గకు ‘ఎదుట’ లేదా ‘సన్నిధిలో’ అనే భావం ఉంది. పవిత్ర గుడారపు సందర్భంలో ‘సన్నిధిలో’ దేవుని సమక్షంలో ఉంచడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: בְּאֹהֶל
  choice: గుడారంలో
  rationale: אֹהֶל యొక్క ప్రాథమిక అర్థం ‘గుడారం.’ ఇక్కడ అది పవిత్రస్థల నిర్మాణాన్ని సూచించినప్పటికీ, మూలంలోని దృశ్యరూపాన్ని నిలుపుకోవడానికి ‘గుడారం’ ఎంచుకున్నాం.
- source_word: הָעֵדֻת
  choice: సాక్ష్యపు
  rationale: עֵדוּת నిబంధనకు సంబంధించిన ‘సాక్ష్యం’ను సూచిస్తుంది. ‘సాక్ష్యపు గుడారం’ మూలంలోని సంబంధాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ‘యాహ్వే’గా ఇచ్చాం.
- issue: לִפְנֵי యొక్క సమక్ష భావం
  choice: యాహ్వే సన్నిధిలో
  alternative: యాహ్వే ఎదుట
  rationale: రెండు రూపాలూ సాధ్యమే. ‘సన్నిధిలో’ అనేది ఇక్కడ స్థానం మాత్రమే కాక దేవుని సమక్షంలో సమర్పించి ఉంచిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; అంతకుమించిన ఆచారార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చేతికర్రలు’ అనే పదం సందర్భంలోని భౌతిక వస్తువులను స్పష్టం చేస్తుంది; ‘సాక్ష్యపు గుడారం’ మూలభాషా రూపాన్ని కాపాడుతుంది.
