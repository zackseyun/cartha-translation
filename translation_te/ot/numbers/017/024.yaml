source:
  edition: WLC
  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: te
  text: అప్పుడు మోషే యాహ్వే సన్నిధి నుండి కర్రలన్నిటినీ ఇశ్రాయేలీయులందరికీ తీసుకువచ్చాడు. వారు వాటిని చూశారు; ఒక్కొక్కరు తన కర్రను తీసుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపం ‘బయటికి తీసుకురావడం’ అనే కారక భావాన్ని ఇస్తుంది. సందర్భంలో మోషే యెహోవా సన్నిధి నుండి కర్రలను ప్రజల దగ్గరికి తీసుకొచ్చాడు కాబట్టి ఇది సహజమైన తెలుగు.
- source_word: הַמַּטֹּת
  choice: కర్రలన్నిటినీ
  rationale: מַטֶּה ఇక్కడ గోత్రం కాదు, యెహోవా సన్నిధిలో ఉంచిన భౌతిక కర్రను సూచిస్తుంది. ‘కర్ర’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యెహోవా సన్నిధి నుండి
  rationale: మూలంలోని ‘యెహోవా ఎదుటి నుండి’ అనే స్థలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; యెహోవా అనే నిబంధన నామాన్ని పేరుగానే నిలుపుతుంది.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి దగ్గరికి
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులందరి దగ్గరికి’; ఇది జాతిని సూచించే స్థిర ప్రయోగం కాబట్టి ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులందరు’ సహజమూ సమగ్రార్థకమూ.
- source_word: וַיִּרְאוּ
  choice: వారు వాటిని చూశారు
  rationale: ראה యొక్క ప్రాథమిక అర్థం ‘చూశారు’. కర్మ మూలంలో వ్యక్తంగా లేకున్నా, తెలుగులో ‘వాటిని’ చేర్చడం ద్వారా కర్రలే సూచిత కర్మ అని సహజంగా తెలుస్తుంది; ‘పరిశీలించారు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: ప్రతి ఒక్కరూ తమ కర్రను తీసుకున్నారు
  rationale: אִישׁ ఇక్కడ విభాజక ప్రయోగంలో ‘ఒక్కొక్కరు’ అని అర్థం. తెలుగు వాక్యసమ్మతికి బహువచన గౌరవ/సమగ్ర రూపం వాడినా, ప్రతి వ్యక్తి తన కర్రను తీసుకున్నాడనే పంపిణీ భావం నిలుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలుపుతున్నాం. ఆధునిక తెలుగు బైబిలు భాషలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; హీబ్రూ ఉచ్చారణ పునర్నిర్మాణానికి దగ్గరైన ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ వరుస క్రియలను సహజ తెలుగు విరామచిహ్నాలతో అనుసంధానించాం. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
