  revision_rationale: The revision replaces the unclear additive construction with an idiomatic Telugu exclusion phrase corresponding to מִלְּבַד. It retains the source’s ambiguity in עַל־דְּבַר קֹרַח and anchors the lexical-alternative footnote directly to “కోరహు విషయమై.”
