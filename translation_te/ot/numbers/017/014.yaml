id: NUM.17.14
reference: Numbers 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: te
  text: తెగులులో చనిపోయినవారు పద్నాలుగు వేల ఏడువందల మంది; కోరహు విషయమై[a] చనిపోయినవారిని మినహాయించి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోరహు కారణంగా”; లేదా, “కోరహు వ్యవహారానికి సంబంధించి.” ఈ పదబంధం కోరహుతో సంబంధమైన సంఘటనలో ఇంతకుముందు చనిపోయినవారిని సూచిస్తుంది.
    reason: עַל דְּבַר קֹרַח అనే హీబ్రూ పదబంధంలో కారణార్థం, సంబంధార్థం రెండూ సాధ్యమైనందున ప్రత్యామ్నాయాలను చూపించడం.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: చనిపోయినవారు ... మంది
  rationale: ఈ రూపం కథన క్రమంలో ఫలితంగా వచ్చిన సంఖ్యను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చకుండా సహజ వాక్య నిర్మాణంతో దాని కథన కొనసాగింపును తెలిపాం.
- source_word: הַמֵּתִים
  choice: చనిపోయినవారు
  rationale: ‘మృతులు’ కంటే ‘చనిపోయినవారు’ సంఖ్యా నివేదికలో సహజంగా, స్పష్టంగా ఉంటుంది; రెండు సందర్భాల్లోనూ ఒకే విధంగా అనువదించాం.
- source_word: בַּמַּגֵּפָה
  choice: తెగులులో
  rationale: מגפה ఇక్కడ ప్రాణాంతకమైన తెగులును సూచిస్తుంది; בְּ అనే సంబంధాన్ని ‘లో’తో సమీపంగా నిలిపాం.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: పద్నాలుగు వేల ఏడువందల మంది
  rationale: హీబ్రూ సంఖ్యను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా ఇచ్చి, వ్యక్తుల లెక్క అని స్పష్టం చేయడానికి ‘మంది’ వాడాం.
- source_word: מִלְּבַד
  choice: దీనికి అదనం
  rationale: ముందు పేర్కొన్న 14,700 మంది లెక్కలో కోరహుతో సంబంధమైన మునుపటి మరణాలు చేరలేదని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עַל דְּבַר קֹרַח
  choice: కోరహు విషయంగా
  rationale: ఈ పదబంధానికి కారణార్థం లేదా ‘సంబంధించిన వ్యవహారం’ అనే భావం ఉండవచ్చు. ‘విషయంగా’ అనేది ఆ సంబంధాన్ని చూపుతూ కారణాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: కోరహుతో సంబంధమైన మరణాల పరిధి
  choice: 14,700 మంది తెగులు బాధితుల లెక్కకు కోరహు విషయంగా చనిపోయినవారు అదనమని మాత్రమే చెప్పడం
  alternative: ‘కోరహు తిరుగుబాటు కారణంగా చనిపోయినవారు’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం రెండు మరణ సమూహాలను వేరు చేస్తుంది, కాని రెండో సమూహంలోని వర్గాలను ఇక్కడ వివరించదు. అందువల్ల ‘తిరుగుబాటు’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన సంఖ్యా-కథన శైలి. మూలంలోని కారణ/సంబంధ అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణిలో నిలిపాం.
