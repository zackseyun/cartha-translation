review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the plague deaths and the total of 14,700. However, “కోరహు విషయంగా ... దీనికి అదనం” is syntactically awkward and does not clearly express מִלְּבַד (“besides/except for”). “కోరహు విషయమై ... చనిపోయినవారిని మినహాయించి” preserves the Hebrew’s deliberately broad connection to Korah without over-defining it as rebellion or direct causation.
  naturalness: “దీనికి అదనం” after a semicolon sounds unnatural in a Telugu numerical report. The revised exclusion phrase is idiomatic, clear, and maintains the distinction between the counted plague victims and the other deaths.
  terminology: “తెగులు,” “చనిపోయినవారు,” and “కోరహు” are suitable for modern standard Telugu. “విషయమై” is a natural formal equivalent for the potentially causal or matter-related phrase עַל־דְּבַר קֹרַח.
  issues:
  - severity: medium
    issue: The expression “కోరహు విషయంగా ... దీనికి అదనం” is unclear and unidiomatic.
    rationale: It does not naturally govern the prior death group or clearly convey that those deaths are excluded from the stated number. The Hebrew מִלְּבַד explicitly marks them as outside the 14,700 total.
  revised_text: తెగులులో చనిపోయినవారు పద్నాలుగు వేల ఏడువందల మంది; కోరహు విషయమై[a] చనిపోయినవారిని మినహాయించి.
