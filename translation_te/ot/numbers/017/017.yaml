source:
  edition: WLC
  text: דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/קַ֣ח מֵֽ/אִתָּ֡/ם מַטֶּ֣ה מַטֶּה֩ לְ/בֵ֨ית אָ֜ב מֵ/אֵ֤ת כָּל נְשִֽׂיאֵ/הֶם֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת שְׁמ֔/וֹ תִּכְתֹּ֖ב עַל מַטֵּֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారులతో[a] మాట్లాడు. వారి పితృవంశాల ప్రకారం వారి నాయకులందరి దగ్గర నుండి, ప్రతి పితృవంశానికి ఒక కర్ర చొప్పున పన్నెండు కర్రలు[b] తీసుకో. ప్రతి వ్యక్తి పేరును అతని కర్రపై రాయి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులతో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ מַטֶּה పదానికి “దండం” అనే అర్థమూ ఉంది; ఇక్కడ భౌతికమైన కర్ర ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాంప్రదాయ సమూహపదమని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: מַטֶּה
  choice: కర్ర
  rationale: ఇక్కడ పేరు రాయగలిగే, తరువాత చిగురించే భౌతిక కర్ర ఉద్దేశించబడింది. ఆధునిక తెలుగులో ‘కర్ర’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: ప్రతి పితృవంశానికి ఒక్క కర్ర చొప్పున
  rationale: పునరుక్తి తెలిపే పంపిణీ భావాన్ని ‘ప్రతి… ఒక్క… చొప్పున’ అనే సహజ తెలుగు నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: נְשִׂיאֵיהֶם
  choice: వారి నాయకులు
  rationale: గోత్ర లేదా వంశ నాయకులను సూచిస్తుంది; రాజకుమారులు అనే తప్పుదారి పట్టించే భావం లేకుండా ‘నాయకులు’ స్పష్టంగా ఉంటుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పూర్వీకుల వంశాల ప్రకారం
  rationale: నాయకులు, కర్రలు పితృసంబంధ వంశవ్యవస్థ ఆధారంగా ఉన్నాయని తెలుపుతుంది; తెలుగులో సహజత్వం కోసం ‘పూర్వీకుల వంశాలు’ వాడాం.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: పన్నెండు కర్రలు
  rationale: సంఖ్యను, మַטֶּהకు ఎంచుకున్న అనువాదాన్ని నేరుగా మరియు స్థిరంగా అందిస్తుంది.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: ప్రతి వ్యక్తి పేరును … రాయి
  rationale: אִישׁలోని పంపిణీ భావాన్ని ‘ప్రతి వ్యక్తి’తో నిలిపి, తెలుగు ఆజ్ఞారూప వాక్యక్రమాన్ని సహజంగా ఉంచాం.
- source_word: עַל מַטֵּהוּ
  choice: అతని కర్ర మీద
  rationale: ప్రతి నాయకునికి చెందిన సంబంధిత కర్రను సూచించే స్వామ్యభావాన్ని స్పష్టంగా నిలుపుతుంది.
