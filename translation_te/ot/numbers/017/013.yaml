source:
  edition: WLC
  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: te
  text: అతడు చనిపోయినవారికీ బ్రతికివున్నవారికీ మధ్య నిలబడ్డాడు. అప్పుడు తెగులు ఆగిపోయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: అతడు ... నిలబడ్డాడు
  rationale: עמד అనే క్రియకు ఇక్కడ సాధారణ అర్థం ‘నిలబడు’ లేదా ‘స్థానం తీసుకో.’ సందర్భంలోని దృశ్య స్పష్టతను సహజమైన ఆధునిక తెలుగులో ‘నిలబడ్డాడు’ నిలుపుతుంది.
- source_word: בֵּין ... וּבֵין
  choice: '...వారికి, ...వారికి మధ్య'
  rationale: జతగా వచ్చిన ఈ విభక్త్యవయవాలు రెండు వర్గాల మధ్యనున్న స్థానాన్ని సూచిస్తాయి. తెలుగులో ‘ఇద్దరి/రెండు వర్గాల మధ్య’ అనే నిర్మాణం సహజంగా ఉంటుంది.
- source_word: הַמֵּתִים
  choice: చనిపోయినవారు
  rationale: ఈ పదం అప్పటికే మరణించినవారిని సూచిస్తుంది. ‘చనిపోయినవారు’ సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన రూపం; ఎదుటి పదంతో ఉన్న తీవ్రమైన వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- source_word: הַחַיִּים
  choice: బ్రతికివున్నవారు
  rationale: నామవాచకంగా వాడిన ఈ విశేషణం ఇంకా సజీవంగా ఉన్నవారిని సూచిస్తుంది. ‘బ్రతికివున్నవారు’ అనేది ‘చనిపోయినవారు’తో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתֵּעָצַר
  choice: ఆగిపోయింది
  rationale: עצר క్రియ ఇక్కడ తెగులు ముందుకు వ్యాపించడం నిలిచిపోయిన ఫలితాన్ని సూచిస్తుంది. అకర్మకంగా వినిపించే ‘ఆగిపోయింది’ హీబ్రూ నిష్క్రియ/ఫలిత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; దాన్ని ఎవరు ఆపారో వాక్యంలో చేర్చదు.
- source_word: הַמַּגֵּפָה
  choice: తెగులు
  rationale: מגפה ఈ సందర్భంలో ప్రాణాంతకమైన వ్యాధి వ్యాప్తి లేదా దెబ్బను సూచిస్తుంది. ‘తెగులు’ సంక్షిప్తమైన, సుపరిచితమైన తెలుగు సమానార్థకం; తీర్పు గురించి మూలంలో లేని అదనపు వివరణను చేర్చదు.
theological_decisions:
- issue: తీర్పు సందర్భంలో מַגֵּפָה స్వభావం
  choice: తెగులు
  alternative: బాధ / వ్యాధి వ్యాప్తి
  rationale: సమీప సందర్భంలో ఇది ప్రాణాలు తీస్తున్న విపత్తును సూచిస్తుంది. ‘తెగులు’ దాని తీవ్రతను నిలుపుతూ, దైవిక కార్యవిధానం గురించి వాక్యం చెప్పనిదాన్ని అదనంగా నిర్ధారించదు.
- issue: וַתֵּעָצַרలో కార్యనిర్వాహకుని వ్యక్తీకరణ
  choice: తెగులు ఆగిపోయింది
  alternative: తెగులు ఆపబడింది
  rationale: హీబ్రూ రూపం తెగులు నిలిపివేయబడిన ఫలితాన్ని తెలియజేస్తుంది కానీ ఈ వాక్యంలో కార్యనిర్వాహకుని స్పష్టంగా పేర్కొనదు. ‘ఆగిపోయింది’ ఆ ఉద్దేశపూర్వక అస్పష్టతను తెలుగులో సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘మృతులు/సజీవులు’ కంటే ‘చనిపోయినవారు/బ్రతికివున్నవారు’ అనే సులభమైన సమాంతర పదజాలం ఎంచుకోబడింది. వివరణ అవసరం లేనందున పాదసూచికలు చేర్చలేదు.
