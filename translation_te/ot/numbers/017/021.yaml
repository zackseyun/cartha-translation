  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: te
  text: మోషే ఇశ్రాయేలు కుమారులతో[a] మాట్లాడాడు. వారి నాయకులందరూ తమ పితృకుటుంబాల ప్రకారం, ప్రతి నాయకుడు ఒక్కో దండం చొప్పున, మొత్తం పన్నెండు దండాలను అతనికి ఇచ్చారు. అహరోను దండం కూడా వారి దండాల మధ్య ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులతో.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులతో’ అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సంప్రదాయ సామూహిక పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: דבר అనే క్రియ ఇక్కడ ప్రజలను ఉద్దేశించి మాట్లాడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మాట్లాడాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది ఇశ్రాయేలు ప్రజలకు వాడే సామూహిక సంబోధన అని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: נְשִׂיאֵיהֶם
  choice: వారి నాయకులు
  rationale: గోత్రాలకు ప్రాతినిధ్యం వహించే అధికారిక పెద్దలను సూచించే נָשִׂיא పదానికి ఆధునిక తెలుగులో ‘నాయకులు’ స్పష్టమైన సమానార్థకం.
- source_word: מַטֶּה
  choice: కర్ర
  rationale: ఇక్కడ అందజేయబడిన భౌతిక దండాన్ని సూచించేందుకు సాధారణ పాఠకులకు సహజమైన ‘కర్ర’ను ఎంచుకున్నాం; సందర్భం దాని ప్రతినిధిత్వ పాత్రను తెలియజేస్తుంది.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: నాయకునికి ఒక్కొక్కటి చొప్పున
  rationale: హీబ్రూలోని పునరుక్తి ప్రతి నాయకుని నుండి ఒక్క కర్ర అనే పంపిణీ భావాన్ని నొక్కిచెబుతుంది; తెలుగులో ‘ఒక్కొక్కటి చొప్పున’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ పితృవంశాల ప్రకారం
  rationale: తండ్రుల వంశగృహాల ఆధారంగా ఉన్న గోత్ర/కుటుంబ ప్రాతినిధ్యాన్ని ‘పితృవంశాలు’ సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: పన్నెండు కర్రలు
  rationale: సంఖ్యను మరియు మַטֶּהకు ఎంచుకున్న పదాన్ని నేరుగా, స్థిరంగా అనువదించాం.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: అహరోను కర్ర కూడా వారి కర్రల మధ్య ఉంది
  rationale: హీబ్రూ నామవాచక వాక్యానికి తెలుగులో అవసరమైన ‘ఉంది’ను జోడించాం; בְּתוֹךְలోని మధ్య/సమూహంలో భాగంగా ఉండే భావాన్ని ‘మధ్య’ నిలుపుతుంది.
