id: NUM.17.20
reference: Numbers 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: te
  text: “అప్పుడు నేను ఎన్నుకునే మనిషి కర్ర చిగురిస్తుంది; ఇశ్రాయేలు కుమారులు[a] మీకు వ్యతిరేకంగా చేస్తున్న సణుగులను నా మీదనుండి తొలగిస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు” లేదా “ఇశ్రాయేలు ప్రజలు.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు
  rationale: భవిష్యత్తులో సంభవించే ఫలితాన్ని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: నేను ఎన్నుకునే మనిషి
  rationale: దేవుడు ఎంపిక చేసే గోత్ర ప్రతినిధిని సూచించే పుంలింగ ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּהוּ
  choice: కర్ర
  rationale: ఈ సందర్భంలో గోత్ర నాయకుని ప్రతినిధిగా సన్నిధిలో ఉంచిన staff/rodకు సాధారణ పాఠకులకు స్పష్టమైన తెలుగు పదం.
- source_word: יִפְרָח
  choice: చిగురిస్తుంది
  rationale: ఎండిన కర్రలో కొత్త జీవం మొలకెత్తే సూచనను తెలియజేస్తుంది; తరువాతి వచనంలోని పూయడం, ఫలించడం కంటే ముందరి దశను సరిగ్గా ప్రతిబింబిస్తుంది.
- source_word: וַהֲשִׁכֹּתִי
  choice: ఆపివేస్తాను
  rationale: సణుగులు అణిగి నిలిచిపోయేలా చేయడం అనే causative భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מֵעָלַי
  choice: నా మీదనుంచి
  rationale: హెబ్రీలోని స్థలాత్మక రూపకాన్ని నిలుపుతూ, ఆ సణుగులు దేవునిమీద భారంగా ఉన్న భావాన్ని మౌనంగా తొలగించకుండా ఉంచుతుంది.
- source_word: תְּלֻנּוֹת ... מַלִּינִם
  choice: చేస్తున్న సణుగులను
  rationale: ప్రజల నిరంతర అసంతృప్తి, గొణుగుడు అనే ప్రతికూల భావాన్ని ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబాధారిత సామూహిక పదబంధాన్ని రూపపరంగా నిలుపుతుంది; సహజమైన సామూహిక ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: עֲלֵיכֶם
  choice: మీకు వ్యతిరేకంగా
  rationale: మోషే, అహరోనులపై ఉద్దేశించిన ప్రతికూల సణుగును స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సణుగులు దేవునితోనూ నాయకులతోనూ ఉన్న సంబంధం
  choice: “నా మీదనుంచి” మరియు “మీకు వ్యతిరేకంగా” రెండింటినీ నిలుపడం
  alternative: రెండింటినీ ఒకే లక్ష్యంగా కలిపి “నాకు వ్యతిరేకంగా” లేదా “మీకు వ్యతిరేకంగా” అని మాత్రమే అనువదించడం
  rationale: మూలవాక్యం దేవుడు సణుగులను తన మీదనుంచి తొలగిస్తాడని చెబుతూనే, ప్రజలు వాటిని “మీకు వ్యతిరేకంగా” చేస్తున్నారని పేర్కొంటుంది. ఈ ఉద్దేశపూర్వక ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: హెబ్రీలోని బంధుత్వపరమైన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుకూల సామూహిక అర్థాన్ని పాదసూచిక ద్వారా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దేవుని ప్రత్యక్ష వాక్యానికి తగిన నిశ్చయార్థక భవిష్యత్ రూపాలు వాడబడ్డాయి; మూలంలోని “నా మీదనుంచి/మీకు వ్యతిరేకంగా” అనే ద్వంద్వ సంబంధం ఉద్దేశపూర్వకంగా నిలుపబడింది.
