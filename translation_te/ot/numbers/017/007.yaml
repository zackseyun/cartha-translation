  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: te
  text: 'సమాజం మోషేకు, అహరోనుకు వ్యతిరేకంగా కూడినప్పుడు, ఇలా జరిగింది: వారు ప్రత్యక్షపు గుడారం వైపు తిరిగారు; ఇదిగో, మేఘం దానిని కప్పింది[a], యాహ్వే మహిమ ప్రత్యక్షమైంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మేఘం దానిని కప్పింది.’ ‘దానిని’ అనే పదం అత్యంత సహజంగా ‘ప్రత్యక్షపు గుడారాన్ని’ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: హీబ్రూ కథనంలోని తదుపరి సంఘటనను పరిచయం చేసే రూపాన్ని, ప్రాచీనంగా వినిపించకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: సమాజం ... కూడినప్పుడు
  rationale: בְּ తో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; నిఫ్అల్ భావాన్ని ‘కూడినప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: మోషేకు, అహరోనుకు విరోధంగా
  rationale: ఈ సందర్భంలో עַל కేవలం దిశను కాక వ్యతిరేకతను సూచిస్తుంది.
- source_word: וַיִּפְנוּ
  choice: వారు ... వైపు తిరిగారు
  rationale: פנה సూచించే శారీరకంగా దిశ మార్చుకోవడాన్ని నేరుగా, అదనపు వ్యాఖ్యానం లేకుండా అనువదిస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు అరణ్య ఆరాధనా స్థలానికి తెలుగులో స్థిరపడిన, రెండు పదాల భావాన్నీ కలిపి తెలియజేసే పేరు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన గంభీర దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: כִסָּהוּ הֶעָנָן
  choice: మేఘం దానిని కప్పింది
  rationale: క్రియలోని పురుష ఏకవచన ప్రత్యయాన్ని ‘దానిని’గా నిలిపి, దాని సూచితార్థాన్ని ప్రధాన వచనంలో అతిగా స్పష్టం చేయకుండా ఉంచుతుంది.
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమైంది
  rationale: נראה నిఫ్అల్ రూపం తెలిపే కనబడే ప్రత్యక్షతను సహజమైన తెలుగు బైబిలు భాషలో వ్యక్తపరుస్తుంది.
- source_word: כְּבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: దేవుని ప్రత్యక్ష వైభవాన్ని తెలిపే סמיכות పదబంధాన్ని సంక్షిప్తంగా, గంభీరంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: כִסָּהוּ లోని పురుష ఏకవచన ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: ప్రధాన వచనంలో ‘దానిని’ అని ఉంచి, ప్రత్యక్ష గుడారాన్ని సూచించే అవకాశాన్ని పాదసూచికలో తెలియజేయడం
  alternative: మేఘం ప్రత్యక్ష గుడారాన్ని కప్పింది; మేఘం సమాజాన్ని లేదా ఆ ప్రదేశాన్ని కప్పింది
  rationale: సమీపంలోని పురుష ఏకవచన నామవాచకం אֹהֶל (‘గుడారం’) సహజమైన పూర్వపదం. అయినా ప్రత్యయంలో ఉన్న స్వల్ప సూచనాత్మక అస్పష్టతను ప్రధాన వచనం పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ దృశ్యంలోని నాటకీయతను నిలుపుతుంది; ‘యాహ్వే’ మూలంలోని దైవనామాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
