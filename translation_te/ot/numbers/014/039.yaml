source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: te
  text: మోషే ఈ మాటలను ఇశ్రాయేలు ప్రజలందరికీ[a] చెప్పాడు. అప్పుడు ప్రజలు ఎంతో దుఃఖించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులందరికీ’; లేదా ‘ఇశ్రాయేలీయులందరికీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: పియేల్ వయ్యిక్టోల్ రూపం ఇక్కడ మోషే దేవుని తీర్పు మాటలను ప్రజలకు తెలియజేయడాన్ని సూచిస్తుంది. తెలుగులో ‘చెప్పాడు’ సహజంగా ఉండి అదనపు వ్యాఖ్యాన భావాన్ని చేర్చదు.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: דְּבָרִים అనే పదానికి ‘మాటలు,’ ‘విషయాలు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ముందు పలికిన దేవుని ప్రకటనను సూచిస్తున్నందున ‘ఈ మాటలను’ మూలంలోని వాచిక భావాన్ని నిలుపుతుంది.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరికీ
  rationale: בְּנֵי יִשְׂרָאֵל ఇక్కడ మొత్తం సమాజాన్ని సూచించే స్థిర జాతినామం. అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులందరికీ’ కంటే ‘ఇశ్రాయేలు ప్రజలందరికీ’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉంది; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיִּתְאַבְּלוּ
  choice: దుఃఖించారు
  rationale: హిత్పయేల్ రూపం తీవ్ర శోకస్థితిలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘దుఃఖించారు’ ఆధునిక తెలుగులో సహజంగా ఉండి సామూహిక శోకాన్ని వ్యక్తపరుస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עָם సమూహంగా ఉన్న ప్రజలను సూచిస్తుంది; తెలుగులో ‘ప్రజలు’ సహజమైన సమానార్థకం.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: מְאֹד దుఃఖం తీవ్రతను పెంచుతుంది. ‘ఎంతో దుఃఖించారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
