  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. రెండవ ఉపవాక్యంలోని వరుస సంఘటనను స్పష్టపరచడానికి ‘అప్పుడు’ చేర్చబడింది; ఇది హీబ్రూ వావ్ వరుసను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
