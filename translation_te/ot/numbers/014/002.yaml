id: NUM.14.2
reference: Numbers 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులందరూ[a] మోషేకు, అహరోనుకు వ్యతిరేకంగా గొణిగారు[b]. సమాజమంతా వారితో ఇలా అన్నారు: “ఐగుప్తు దేశంలో మేము చనిపోయి ఉంటే బాగుండేది! లేక ఈ అరణ్యంలో మేము చనిపోయి ఉంటే బాగుండేది!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరూ.” హీబ్రూలో, “ఇశ్రాయేలు కుమారులందరూ.”
    reason: lexical_alternative
  - marker: b
    text: “గొణిగారు” అనే పదాన్ని “సణిగారు” లేదా “ఫిర్యాదు చేశారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: సణిగారు
  rationale: అరణ్య ప్రయాణ సందర్భంలో నాయకులకు వ్యతిరేకంగా అసంతృప్తితో ఫిర్యాదు చేయడం, గొణగడం అనే సామూహిక భావాన్ని ఈ పదం సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל
  choice: వ్యతిరేకంగా
  rationale: సణగడం ఎవరిని లక్ష్యంగా చేసిందో, దానిలోని ప్రతిఘటన భావంతో సహా స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరూ
  rationale: హీబ్రూలోని ‘ఇశ్రాయేలు కుమారులు’ అనే జాతీయ-వంశపారంపర్య పదబంధాన్ని రూపపరంగా నిలుపుతూ, כֹּל‌ను సహజంగా ‘అందరూ’ అని అనువదిస్తుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: సంఖ్యాకాండములో עֵדָה సమష్టిగా కూడిన ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజమంతా’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: לוּ
  choice: అయ్యో, … ఉంటే బాగుండేది
  rationale: జరగని గతాన్ని గురించి వ్యక్తం చేసిన తీవ్రమైన కోరికను, విచారాన్ని తెలుగులో సహజమైన ప్రతికల్పన రూపంలో తెలియజేస్తుంది.
- source_word: מַתְנוּ / מָתְנוּ
  choice: మేము చనిపోయి ఉంటే
  rationale: לוּతో కలిసి ఇది గతంలో నెరవేరని కోరికను వ్యక్తం చేస్తుంది; ‘చనిపోయి ఉంటే’ ఆ ప్రతికల్పిత గత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలోనే
  rationale: ‘ఐగుప్తు దేశం’ అనే పూర్తి భౌగోళిక పదబంధాన్ని నిలుపుతుంది; ‘నే’ వారి కోరికలోని ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: ఈ అరణ్యంలోనే
  rationale: מִדְבָּר‌కు పెంటటూకు సందర్భంలో సరిపోయే ‘అరణ్యం’ను ఉపయోగించి, הַזֶּהను ‘ఈ’గా స్పష్టంగా అనువదిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵלలోని లింగసూచక జాతీయ పదబంధం
  choice: ఇశ్రాయేలు కుమారులందరూ
  alternative: ఇశ్రాయేలీయులందరూ
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని సామూహిక తిరుగుబాటు స్వరాన్ని, గతానికి సంబంధించిన నెరవేరని కోరికను కాపాడింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
