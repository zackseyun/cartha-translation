revisions:
- from: ఇశ్రాయేలు కుమారులందరూ మోషేకు, అహరోనుకు వ్యతిరేకంగా సణిగారు[a]. సమాజమంతా వారితో, “అయ్యో, ఐగుప్తు దేశంలోనే మేము చనిపోయి ఉంటే బాగుండేది! లేదా ఈ అరణ్యంలోనే చనిపోయి ఉంటే బాగుండేది!” అని అన్నారు.
