  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: te
  text: అయితే మీరైతే, మీ మృతదేహాలు[a] ఈ అరణ్యంలో పడిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ శవాలు”; “మీ కళేబరాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: మీ మృతదేహాలు
  rationale: פֶּגֶר అంటే చనిపోయిన శరీరం లేదా శవం. ‘మృతదేహాలు’ అనే పదం తీర్పులోని భౌతికమైన, గంభీరమైన భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ప్రారంభంలోని וּ־ సందర్భానుసారమైన వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: אַתֶּם
  choice: మీరైతే
  rationale: స్వతంత్ర సర్వనామం వ్యత్యాసపూర్వక నొక్కిచెప్పడాన్ని కలిగి ఉంది. ‘మీరైతే’ దానిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: יִפְּלוּ
  choice: పడిపోతాయి
  rationale: נפל ఇక్కడ మరణించి పడిపోవడాన్ని సూచిస్తుంది. ‘మృతదేహాలు’ అనే కర్తతో కలిసి ‘పడిపోతాయి’ మూలంలోని సూటి, కఠినమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: בַּמִּדְבָּר
  choice: ఈ అరణ్యంలో
  rationale: מִדְבָּר జనావాసం లేని అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. సంఖ్యాకాండ సందర్భంలో ‘అరణ్యం’ స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: הַזֶּה
  choice: ఈ
  rationale: వారు ఉన్న నిర్దిష్ట అరణ్యాన్ని సూచించే సమీపదర్శక సర్వనామాన్ని ‘ఈ’ నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: פִגְרֵיכֶם అనే పదంలో తీర్పు యొక్క తీవ్రత, భౌతిక స్పష్టత
  choice: మీ మృతదేహాలు
  alternative: మీ శవాలు / మీ కళేబరాలు
  rationale: ఈ వాక్యం అవిశ్వాసి తరంపై వచ్చిన దైవిక తీర్పును ప్రకటిస్తుంది. ‘మృతదేహాలు’ మూలంలోని గంభీరమైన భౌతిక భావాన్ని నిలుపుతూ, ‘కళేబరాలు’లో ఉండగల అదనపు కఠినతను లేదా సాహిత్య ధోరణిని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన తీర్పు భాషను ఉపయోగించాం. ‘మీరైతే’ ద్వారా మూలంలోని వ్యత్యాసపూర్వక నొక్కిచెప్పడాన్ని, ‘మృతదేహాలు … పడిపోతాయి’ ద్వారా దాని ఉద్దేశపూర్వకమైన కఠిన చిత్రాన్ని నిలిపాం.
