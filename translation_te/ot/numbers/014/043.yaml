id: NUM.14.43
reference: Numbers 14:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: te
  text: ఎందుకంటే అమాలేకీయులు, కనానీయులు అక్కడ మీకు ఎదురుగా ఉన్నారు; మీరు ఖడ్గానికి బలైపోతారు. ఎందుకంటే మీరు యాహ్వేను అనుసరించడం మానుకొని వెనుదిరిగారు, యాహ్వే మీతో ఉండడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని హెచ్చరికకు కారణాన్ని పరిచయం చేస్తున్నందున, వాక్యారంభంలో కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: అమాలేకీయులు, కనానీయులు
  rationale: హీబ్రూలో ఏకవచన రూపాలైనా ఇవి సమూహార్థక జాతినామాలు; తెలుగులో బహువచనం సహజంగా ఉంటుంది.
- source_word: שָׁם לִפְנֵיכֶם
  choice: అక్కడ మీకు ఎదురుగా ఉన్నారు
  rationale: שָׁם అనే స్థలార్థాన్నీ, לִפְנֵיכֶם అనే ఎదుట/ముందు అనే భావాన్నీ యుద్ధ సందర్భానికి తగిన సహజ తెలుగులో నిలుపుతుంది.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: మీరు ఖడ్గానికి బలైపోతారు
  rationale: నేరుగా ‘ఖడ్గం చేత పడిపోతారు’ అనడం తెలుగులో కృత్రిమంగా ఉంటుంది; యుద్ధంలో ఖడ్గం వల్ల మరణించడం లేదా ఓడిపోవడం అనే భావాన్ని ఈ ప్రయోగం స్పష్టంగా అందిస్తుంది.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: మీరు యెహోవాను అనుసరించడం మానుకొని వెనుదిరిగారు
  rationale: ‘యెహోవా వెనుకనుండి తిరిగారు’ అనే మూల చిత్రాన్ని, ఆయనను అనుసరించడం విడిచిపెట్టారనే భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: కాబట్టి యెహోవా మీతో ఉండడు
  rationale: దైవసన్నిధి మరియు సహాయం లభించవనే నిబంధనాత్మక భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది; ‘కాబట్టి’ ముందున్న కారణంతో ఫలితాన్ని సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా ఉంచాం. లక్ష్య పాఠకులకు విస్తృతంగా తెలిసిన తెలుగు రూపం ‘యెహోవా’ను ఎంచుకున్నాం; ఇది ఉచ్చారణ పునర్నిర్మాణంపై తుదితీర్పు విధించదు.
- issue: యెహోవా వారితో ఉండకపోవడం
  choice: యెహోవా మీతో ఉండడు
  alternative: యెహోవా మీకు సహాయం చేయడు
  rationale: ‘మీతో ఉండడం’ అనే మూల నిబంధనాత్మక సన్నిధి భాషను అలాగే నిలిపి, దానిని కేవలం సైనిక సహాయంగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరమైన వచనశైలి పాటించబడింది. జాతినామాలు బహువచనంగా, యుద్ధ మరణ సూచన సహజ తెలుగు నుడికారంలో ఇవ్వబడ్డాయి.
