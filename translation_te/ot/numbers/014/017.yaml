id: NUM.14.17
reference: Numbers 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: te
  text: 'ఇప్పుడు, దయచేసి, ప్రభువు శక్తి గొప్పదిగా ఉండుగాక[a], మీరు చెప్పినట్లుగా:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు శక్తి గొప్పదగునుగాక.’
    reason: יִגְדַּל అనే జస్సివ్ క్రియకు మరింత సన్నిహితమైన, కొంత అధికారికమైన ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: మోషే విజ్ఞాపనలో కొత్త దశను పరిచయం చేసే కాలసూచక సంధానపదం. తెలుగులో ‘ఇప్పుడు’ సందర్భానుసారంగా సంధాన భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: יִגְדַּל
  choice: మహత్తరమైనదిగా కనబడనివ్వండి
  rationale: גדל యొక్క విజ్ఞాపనాత్మక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. దేవుని శక్తి స్వయంగా పెరగాలనే భావం కాకుండా, దాని మహత్తు ఈ సందర్భంలో ప్రత్యక్షం కావాలనే ప్రార్థనను తెలియజేస్తుంది; ‘ఘనపరచబడుగాక’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: נָא
  choice: దయచేసి
  rationale: విజ్ఞాపనను మృదువుగా చేసే హీబ్రూ కణం. ‘దయచేసి’ ఆధునిక తెలుగులో ప్రార్థనాత్మక అభ్యర్థనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּחַ
  choice: శక్తి
  rationale: దైవిక సామర్థ్యాన్ని సూచించే כֹּחַ కు ‘శక్తి’ సహజమైన, సందర్భోచితమైన తెలుగు సమానార్థకం.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇక్కడ వాడినది దైవిక బిరుదైన אֲדֹנָי; అది చతురక్షర దైవనామం కాదు. అందువల్ల బిరుదుగా ‘ప్రభువు’ అని అనువదించబడింది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లే
  rationale: దేవుడు మునుపు పలికిన మాటకూ ప్రస్తుత విజ్ఞాపనకూ ఉన్న ఖచ్చితమైన అనురూపతను ‘అట్లే’ భావంతో తెలియజేస్తుంది.
- source_word: דִּבַּרְתָּ
  choice: మీరు చెప్పిన
  rationale: దేవుణ్ణి నేరుగా సంబోధించే ద్వితీయ పురుష ఏకవచన క్రియ. తెలుగులో గౌరవార్థక బహువచన రూపం సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: 'చెప్పినట్లే:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఉద్ధరణ సూచకాన్ని తెలుగులో ద్విబిందువుతో సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: אֲדֹנָי అనే దైవిక బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: మూలపాఠంలో అֲדֹנָי అనే బిరుదే ఉంది, చతురక్షర దైవనామం లేదు. కాబట్టి ‘యెహోవా’ అని మార్చకుండా ‘ప్రభువు’ అని ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: దేవుని శక్తి ‘గొప్పదగుట’ అనే విజ్ఞాపన భావం
  choice: శక్తి మహత్తరమైనదిగా కనబడనివ్వండి
  alternative: శక్తి ఘనపరచబడుగాక
  rationale: హీబ్రూ రూపం విజ్ఞాపన లేదా ఆకాంక్షను తెలియజేస్తుంది. ప్రధాన అనువాదం శక్తి లోపించి తరువాత పెరుగుతుందనే తాత్త్విక నిర్ణయాన్ని రుద్దకుండా, దాని మహత్తు కార్యంలో ప్రత్యక్షమవాలనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది; మరింత శాబ్దిక ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవభావం, గంభీరత నిలుపబడ్డాయి. ‘దయచేసి’ ద్వారా נָא యొక్క విజ్ఞాపన స్వరం స్పష్టమైంది. తదుపరి వచనంలోని ఉద్ధరణతో అనుసంధానం కోసం చివర ద్విబిందువు వాడబడింది.
