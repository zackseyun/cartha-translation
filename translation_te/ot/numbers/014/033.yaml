id: NUM.14.33
reference: Numbers 14:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: te
  text: మీ కుమారులు నలభై సంవత్సరాలు అరణ్యంలో కాపరులుగా ఉంటారు[a]. మీ మృతదేహాలు అరణ్యంలో అంతమయ్యే వరకు[c], వారు మీ వ్యభిచారాన్ని భరిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అరణ్యంలో సంచరిస్తూ ఉంటారు.’ హీబ్రూ పదం అక్షరార్థంగా పశువులను మేపడం లేదా కాపరిగా ఉండటానికి సంబంధించినది; ఇక్కడ అది సంచార జీవనాన్ని నొక్కిచెబుతుందని కొందరు భావిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: ‘వ్యభిచారం’ అనే పదం ఇక్కడ లైంగిక రూపకంతో యెహోవాపట్ల ఒడంబడిక అవిశ్వాసాన్ని సూచిస్తుంది; దీనిని ‘మీ అవిశ్వాసం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అరణ్యంలో మీ శవాలు పూర్తిగా లేకుండాపోయే వరకు.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: మీ కుమారులు
  rationale: בנים అనే పుంలింగ బహువచనానికి సాధారణ అర్థం ‘కుమారులు’; సందర్భం దానిని తప్పనిసరిగా పిల్లలందరికీ విస్తరించదు.
- source_word: רֹעִים
  choice: కాపరులుగా
  rationale: ఈ పదం רעה (‘మేపడం, కాపరిగా ఉండడం’) నుంచి వచ్చింది. అరణ్య సంచారం సందర్భంలో సూచితమైనా, మూలపదంలోని కాపరి భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר జనావాసం లేని ఎడారి/అరణ్య ప్రదేశాన్ని సూచిస్తుంది; తెలుగు బైబిలు సందర్భంలో ‘అరణ్యం’ సహజంగా, విస్తృతంగా సరిపోతుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: కాలవ్యవధిని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנָשְׂאוּ
  choice: వారు ... భరిస్తారు
  rationale: נשא ఇక్కడ మోయడం లేదా దాని భారాన్ని అనుభవించడం అనే నైతిక-పర్యవసాన భావాన్ని కలిగిస్తుంది; ‘భరిస్తారు’ తెలుగు వాక్యంలో సహజంగా ఆ భారాన్ని తెలియజేస్తుంది.
- source_word: אֶת זְנוּתֵיכֶם
  choice: మీ వ్యభిచారాన్ని
  rationale: זְנוּת లైంగిక అవిశ్వాసపు బలమైన రూపకాన్ని కలిగి ఉంది; సందర్భంలో అది యెహోవాపట్ల ఒడంబడిక అవిశ్వాసాన్ని సూచించినప్పటికీ, ‘వ్యభిచారం’ మూలంలోని ఉద్దేశపూర్వక రూపకాన్ని చెరపదు.
- source_word: עַד תֹּם
  choice: అంతమయ్యే వరకు
  rationale: תמם నుంచి వచ్చిన ఈ రూపం పూర్తికావడం లేదా ముగింపుకు రావడం సూచిస్తుంది; తీర్పు పొందిన తరం పూర్తిగా చనిపోవడాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: פִּגְרֵיכֶם
  choice: మీ మృతదేహాలు
  rationale: פגר అంటే శవం లేదా మృతదేహం. ‘మృతదేహాలు’ గంభీరమైనదిగా ఉండి, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: זְנוּתֵיכֶם ను అక్షరార్థ లైంగిక పాపంగా మాత్రమే చూపాలా, లేక ఒడంబడిక అవిశ్వాసంగా సాధారణీకరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘మీ వ్యభిచారాన్ని’ అని ఉంచి లైంగిక రూపకాన్ని కాపాడటం
  alternative: మీ అవిశ్వాసాన్ని
  rationale: ఈ సందర్భం యెహోవాపట్ల ఇశ్రాయేలు తిరుగుబాటును సూచిస్తుంది; అయినా కేవలం ‘అవిశ్వాసం’ అంటే మూలంలోని లైంగిక రూపకం కనుమరుగవుతుంది. పాదటిప్పణి రూపకార్థాన్ని వివరిస్తుంది.
- issue: רֹעִים ను ‘సంచారులు’ అని సందర్భానుసారంగా అనువదించాలా
  choice: మూలపదానికి దగ్గరగా ‘కాపరులు’ అని ఉంచటం
  alternative: సంచరిస్తూ ఉండేవారు
  rationale: హీబ్రూ పదం నేరుగా మేపడం/కాపరిగా ఉండటానికి సంబంధించినది. అరణ్య సంచారం ఫలితంగా ఉన్నా, దానినే మూలపదపు ఏకైక అర్థంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ తీర్పు వాక్యంలోని గంభీరతను నిలిపే శైలి. ‘కాపరులు,’ ‘వ్యభిచారం,’ ‘మృతదేహాలు’ వంటి మూలానికి దగ్గర పదాలకు అవసరమైన వివరణలు పాదటిప్పణుల్లో ఇచ్చాం.
