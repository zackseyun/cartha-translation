source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: te
  text: అప్పుడు యాహ్వే, “నీ మాట ప్రకారం నేను క్షమించాను[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మాట చొప్పున నేను మన్నించాను.”
    reason: సָלַחְתִּיకి ‘క్షమించాను,’ ‘మన్నించాను’ అనే సమీపార్థక అనువాదాలు సాధ్యాలు; כִּדְבָרֶךָను ‘నీ మాట చొప్పున’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా వరుసను తెలియజేస్తుంది; ‘అని చెప్పాడు’ ప్రత్యక్ష వాక్యానికి సహజమైన నిర్మాణం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
- source_word: סָלַחְתִּי
  choice: నేను క్షమించాను
  rationale: סלח క్షమించడం లేదా మన్నించడం అనే అర్థాన్ని ఇస్తుంది. సంపూర్ణ క్రియారూపాన్ని తెలుగులో సహజమైన పూర్తయిన చర్యగా ‘క్షమించాను’ అని అనువదించాం.
- source_word: כִּדְבָרֶךָ
  choice: నీ మాట ప్రకారం
  rationale: כְּ + דָּבָר అనే నిర్మాణానికి సమీపమైన అర్థం ‘నీ మాట ప్రకారం.’ ఇది మోషే చేసిన విజ్ఞాపనకు ప్రతిస్పందనగా క్షమాపణ ప్రకటించబడిందని సందర్భానుసారంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: క్షమాపణ ప్రకటన యొక్క పరిధి
  choice: మూలంలోని సంక్షిప్త ప్రకటనను యథాతథంగా ఉంచడం
  alternative: ప్రజల శిక్ష అంతా తొలగించబడిందని వివరణ జోడించడం
  rationale: ‘నేను క్షమించాను’ అనే మాట తరువాతి వచనాల్లో వచ్చే తీర్పుతో ఉద్రిక్తతను కలిగి ఉంది. ఈ వచనంలో లేని వివరణను చేర్చి ఆ ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను, పూర్తయిన చర్యను, మోషే మాటతో ఉన్న సంబంధాన్ని కాపాడాం.
