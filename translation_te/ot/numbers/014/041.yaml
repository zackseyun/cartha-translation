id: NUM.14.41
reference: Numbers 14:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: te
  text: 'కానీ మోషే ఇలా అన్నాడు: “మీరు యాహ్వే ఆజ్ఞను ఎందుకు అతిక్రమిస్తున్నారు? ఇది సఫలం కాదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: కాని మోషే ఇలా అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని కొనసాగిస్తున్నా, సందర్భంలో ప్రజల సంకల్పానికి మోషే పలికిన వ్యతిరేక హెచ్చరికను ‘కాని’ సహజంగా తెలియజేస్తుంది.
- source_word: לָמָה זֶּה
  choice: ఎందుకు
  rationale: ఈ సంయోగానికి కొంత ఉద్ఘాటన ఉన్నప్పటికీ, తెలుగులో ‘ఇదేమిటి, ఎందుకు’ వంటి విస్తరణ అసహజంగా లేదా అదనపు భావంతో వినిపించవచ్చు; ప్రశ్న సందర్భమే ఆ ఉద్ఘాటనను మోస్తుంది.
- source_word: אַתֶּם עֹבְרִים
  choice: మీరు ... మీరుతున్నారు
  rationale: ఇక్కడ עבר భౌతికంగా దాటడాన్ని కాక, దేవుని ఆజ్ఞను అతిక్రమించడాన్ని సూచిస్తుంది. ‘మీరుతున్నారు’ సాధారణ ఆధునిక తెలుగులో సహజంగా, నైతిక బలంతో ఉంది.
- source_word: אֶת פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞను
  rationale: అక్షరార్థం ‘యెహోవా నోరు’; ఇది ఆయన పలికిన మాట లేదా ఆజ్ఞకు హీబ్రూ నుడికారం. ఈ సందర్భంలో ‘ఆజ్ఞ’ ఉద్దేశాన్ని స్పష్టంగా అందిస్తుంది; יְהוָה ను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: וְהִוא
  choice: ఇది
  rationale: స్త్రీలింగ సర్వనామం సందర్భంలో ప్రజలు చేపట్టబోయే యత్నాన్ని సూచిస్తున్నట్లు ఉంది. తెలుగు ‘ఇది’ ఆ పరోక్ష సూచనలోని కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: לֹא תִצְלָח
  choice: సఫలం కాదు
  rationale: צלח ఇక్కడ ఒక యత్నం విజయవంతం కావడం లేదా వర్ధిల్లడాన్ని సూచిస్తుంది. ‘సఫలం కాదు’ సంక్షిప్తమైన, సహజమైన హెచ్చరిక.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే ప్రత్యామ్నాయం.
- issue: וְהִוא సూచించే విషయం
  choice: ఇది
  alternative: మీ యత్నం
  rationale: మూల సర్వనామం ఏ విషయాన్ని సూచిస్తుందో పూర్తిగా విప్పి చెప్పదు. ‘ఇది’ ఆ నిజమైన అస్పష్టతను కాపాడుతుంది; ‘మీ యత్నం’ సందర్భార్థాన్ని స్పష్టీకరిస్తుంది కానీ మూలంలో లేని నామవాచకాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి పాటించబడింది. మూలంలోని సంక్షిప్త ప్రశ్న మరియు హెచ్చరిక అలాగే నిలుపబడ్డాయి.
