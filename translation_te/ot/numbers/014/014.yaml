id: NUM.14.14
reference: Numbers 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: te
  text: యాహ్వే, నీవు ఈ ప్రజల మధ్య ఉన్నావని, యాహ్వే, నీవు వారికి ముఖాముఖిగా కనిపిస్తున్నావని[a], నీ మేఘం వారిపై నిలిచి ఉందని, పగలు మేఘస్తంభంలోను రాత్రి అగ్నిస్తంభంలోను నీవు వారి ముందుగా వెళ్తున్నావని విన్న ఈ దేశ నివాసులకు వారు చెబుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కంటికి కన్నుగా కనిపిస్తున్నావు”; దీన్ని “ప్రత్యక్షంగా కనిపిస్తున్నావు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ నుడికారంలోని అక్షర చిత్రాన్ని, దాని సాధ్యమైన భావవ్యాప్తిని నిలుపుటకు.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: ఈ దేశ నివాసులు
  rationale: ఏకవచన కృదంతం ఇక్కడ సమూహార్థకంగా ఉంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నివాసులు’ సహజంగా ఆ దేశంలో నివసించే ప్రజలను సూచిస్తుంది.
- source_word: שָׁמְעוּ
  choice: విన్నారు
  rationale: పూర్వమే విని తెలిసికొన్న విషయాన్ని సూచించే సంపూర్ణ క్రియారూపాన్ని తెలుగులో సహజమైన భూతకాలంతో తెలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి అనుగుణమైన వ్యక్తినామ రూపంలో లిప్యంతరీకరించింది.
- source_word: בְּקֶרֶב
  choice: మధ్య
  rationale: ప్రజలలో దేవుని సన్నిధిని సూచించే స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: ముఖాముఖిగా కనిపిస్తావు
  rationale: హీబ్రూ పదచిత్రం అక్షరార్థంగా ‘కంటికి కన్నుగా’ ఉన్నప్పటికీ, దాని ప్రత్యక్ష సన్నిధి భావాన్ని ఆధునిక తెలుగులో అర్థమయ్యే విధంగా తెలిపింది; అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: నీ మేఘం వారిపై నిలిచి ఉంటుంది
  rationale: మేఘం పైగా స్థిరంగా ఉండే స్పష్టమైన దృశ్యాన్ని, עמד క్రియ యొక్క భావాన్ని నిలుపుతుంది.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: నీవు వారి ముందుగా వెళ్తావు
  rationale: ‘నడిపిస్తావు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, הלך మరియు לפני యొక్క కదలిక-స్థల భావాలను నేరుగా ఉంచుతుంది.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: మేఘస్తంభంలోను ... అగ్నిస్తంభంలోను
  rationale: ב ఉపసర్గకు ఇక్కడ కనిపించే రూపం లేదా స్థానం అనే భావాన్ని ఇచ్చి, దైవసన్నిధి ఆ స్తంభాల్లో ప్రత్యక్షమవుతున్న దృశ్యాన్ని నిలుపుతుంది.
- source_word: יוֹמָם ... לָיְלָה
  choice: పగలు ... రాత్రి
  rationale: కాలాన్ని సూచించే హీబ్రూ క్రియావిశేషణాలకు సహజమైన తెలుగు సమానార్థాలు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తినామం రెండుసార్లు ఉంది; దాన్ని బిరుదుగా మార్చకుండా రెండుసార్లూ స్పష్టంగా ఉంచింది.
- issue: עַיִן בְּעַיִן נִרְאָה యొక్క భావం
  choice: ముఖాముఖిగా కనిపిస్తావు
  alternative: కంటికి కన్నుగా కనిపిస్తావు / ప్రత్యక్షంగా కనిపిస్తావు
  rationale: తెలుగులో అర్థంకాని అక్షరానువాదాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టకుండా ప్రత్యక్ష సన్నిధి భావాన్ని సహజంగా తెలిపింది; అయితే ‘కంటికి కన్నుగా’ అనే అసలు చిత్రాన్ని పాదటిప్పణిలో ఇచ్చి భావంలోని ఉద్వేగాన్ని నిలిపింది.
- issue: שָׁמְעוּ యొక్క కర్త
  choice: ఆ నివాసులు విన్నారు
  alternative: వారు విన్నారు—అంటే 13వ వచనంలోని ఐగుప్తీయులు
  rationale: సమీప సమూహార్థక ‘ఈ దేశ నివాసి’తో బహువచన క్రియను అనుసంధానించడం సాధ్యమై, వాక్యప్రవాహంలో స్పష్టతనిస్తుంది. అయినా ముందటి వచనంలోని ఐగుప్తీయులు కర్తగా ఉండే వ్యాకరణ అవకాశాన్ని పాదటిప్పణిలో గుర్తించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. దైవనామం ‘యాహ్వే’గా నిలుపబడింది. దీర్ఘ హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత పెంచినా, సమాచారం యొక్క క్రమాన్ని కాపాడింది.
