id: NUM.14.11
reference: Numbers 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “ఈ ప్రజలు ఇంకా ఎంతకాలం నన్ను తృణీకరిస్తారు?[a] నేను వారి మధ్య[c] చేసిన సూచక కార్యాలన్నీ ఉన్నప్పటికీ, ఇంకా ఎంతకాలం వారు నన్ను నమ్మరు?[b]”


    [a] లేదా, “నన్ను చులకనగా చూస్తారు?”

    [b] లేదా, “నాపై నమ్మకం ఉంచరు?”

    [c] అక్షరార్థంగా, “దాని మధ్య”; ఇక్కడ ప్రజలందరినీ ఒక సమూహంగా సూచిస్తోంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను చులకనగా చూస్తారు?”
    reason: נאץ అనే క్రియలోని contempt/despise భావానికి సహజమైన తెలుగు ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “నాపై నమ్మకం ఉంచరు?”
    reason: אמן + ב లోని వ్యక్తిగత విశ్వాసం లేదా ఆధారపడే భావాన్ని చూపే ప్రత్యామ్నాయం.
  - marker: c
    text: అక్షరార్థంగా, “దాని మధ్య”; ఇక్కడ ప్రజలందరినీ ఒక సమూహంగా సూచిస్తోంది.
    reason: בְּקִרְבּוֹ లోని ఏకవచన ప్రత్యయం సమూహార్థకమైన ‘ఈ ప్రజలు’ అనే పూర్వపదాన్ని సూచిస్తుందని వివరిస్తుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: עַד אָנָה
  choice: ఇంకా ఎంతకాలం
  rationale: కాలవ్యాప్తిని ప్రశ్నించే హీబ్రూ అలంకారిక ప్రశ్నను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; రెండుసార్లు వచ్చిన నిర్మాణాన్ని రెండుచోట్లా నిలిపాం.
- source_word: יְנַאֲצֻנִי
  choice: నన్ను తృణీకరిస్తారు
  rationale: נאץ అనే క్రియలోని ధిక్కారంతో కూడిన అవమానకర తిరస్కార భావాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది. ‘చులకనగా చూస్తారు’ అనే మరింత సామాన్య ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: హీబ్రూలోని సమూహార్థక ఏకవచనాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ‘ఈ’ అనే సూచనలోని దూరీకరణ స్వరాన్ని కాపాడుతుంది.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: వారు నన్ను నమ్మరు
  rationale: אמן + ב నిర్మాణంలోని నమ్మడం/విశ్వసించడం మరియు ఆధారపడడం అనే భావవ్యాప్తిని తెలుగు ‘నమ్ము’ సహజంగా కొంతవరకు నిలుపుతుంది; విశ్వాసపూర్వక నమ్మకం అనే ఛాయను పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: בְּכֹל הָאֹתוֹת
  choice: సూచక కార్యాలన్నీ ఉన్నప్పటికీ
  rationale: בְּ ఉపసర్గకు సందర్భంలో ఉన్న concessive భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తూ, אוֹת ను అవసరం లేకుండా ‘అద్భుతం’గా విస్తరించకుండా ‘సూచక కార్యం’గా అనువదించాం.
- source_word: עָשִׂיתִי בְּקִרְבּוֹ
  choice: నేను వారి మధ్య చేసిన
  rationale: సమూహార్థక ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజమైన బహువచన సూచనగా ఇచ్చాం; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో నమోదు చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల బిరుదుతో భర్తీ చేయకుండా, మూల ఉచ్చారణకు సమీపమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: לֹא יַאֲמִינוּ בִי లోని నమ్మకం–విశ్వాసం భావవ్యాప్తి
  choice: వారు నన్ను నమ్మరు
  alternative: వారు నాపై నమ్మకం ఉంచరు
  rationale: హీబ్రూ రూపం వాస్తవమని నమ్మడం మరియు వ్యక్తిపై విశ్వాసం ఉంచడం అనే రెండు ఛాయలనూ కలిగి ఉండగలదు. ప్రధాన పాఠంలోని ‘నమ్మరు’ ఈ ఉద్వేగాన్ని సహజంగా ఉంచగా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని రెండు ‘ఎంతకాలం’ ప్రశ్నలను నిలిపి, దేవుని గద్దింపు స్వరాన్ని కాపాడాం. ‘తృణీకరించు’ కొంత గంభీరమైన పదమైనా సాధారణ పాఠకులకు అర్థమయ్యే స్థాయిలో ఉంది; దాని సరళ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
