  terminology: “యాహ్వే” మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది. “సూచక కార్యాలు” אוֹתకు సముచితమైన, అనవసరంగా ‘అద్భుతాలు’ అని విస్తరించని అనువాదం. నమ్మకం/విశ్వాసానికి సంబంధించిన ప్రత్యామ్నాయ పాదటిప్పణి హీబ్రూ భావవ్యాప్తిని తగిన విధంగా కాపాడుతుంది.
