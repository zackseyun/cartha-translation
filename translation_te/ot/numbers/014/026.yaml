    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవవాక్య పరిచయ సూత్రంలో דבר మాటల ద్వారా సంబోధించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చెప్పాడు’ సహజంగా ఉండి, తరువాతి వాక్యానికి స్పష్టమైన పరిచయాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించడం ద్వారా బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: మోషే, అహరోను ఇద్దరూ సంబోధితులని తెలుగులో సహజమైన ‘తో’ నిర్మాణంతో స్పష్టంగా చూపిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా’ తెలియజేస్తుంది; ‘అంటూ’ అని యాంత్రికంగా పునరుక్తి చేయడాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల ‘ప్రభువు’ అని ప్రత్యామ్నాయపరచకుండా నామరూపాన్ని ఉంచాం; తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ లిప్యంతరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేయడానికి వాక్యాంతంలో ద్విబిందువు వాడబడింది.
