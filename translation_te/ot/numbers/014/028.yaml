id: NUM.14.28
reference: Numbers 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: te
  text: 'వారితో ఇలా చెప్పు: ‘నా జీవం తోడు—ఇది యెహోవా ప్రకటన—మీరు నా చెవులకు వినబడేలా చెప్పినట్టుగానే నేను మీకు తప్పకుండా అలాగే చేస్తాను.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָ֨נִי֙
  choice: నా జీవం తోడు
  rationale: దైవ ప్రమాణసూత్రాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తపరుస్తుంది; దేవుడు జీవిస్తున్నాడనే మూల భావాన్ని నిలుపుతుంది.
- source_word: נְאֻם יְהוָה
  choice: ఇది యెహోవా ప్రకటన
  rationale: נְאֻם అనే అధికారపూర్వక దైవ ప్రకటన సూత్రాన్ని స్పష్టంగా నిలుపుతూ, దేవుని వ్యక్తిగత నామాన్ని యెహోవా అని లిప్యంతరీకరిస్తుంది.
- source_word: אִם לֹא
  choice: '[ప్రత్యేక పదంగా అనువదించకుండా ప్రమాణ నిర్మాణంలో నిశ్చయార్థంగా వ్యక్తీకరించబడింది]'
  rationale: ఇక్కడ ప్రమాణ వాక్యంలో అక్షరార్థమైన ‘కాకపోతే’ కంటే ‘తప్పకుండా’ అనే బలమైన నిశ్చయాన్ని సూచిస్తుంది; తెలుగు ప్రమాణ నిర్మాణం మరియు ‘సరిగ్గా అలాగే’ కలసి ఆ బలాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: ఎలా ... సరిగ్గా అలాగే
  rationale: మూలంలోని తులనాత్మక అనుసంధానాన్ని, ప్రజల మాటలకు తగినట్టే దేవుని చర్య ఉంటుందనే భావాన్ని నిలుపుతుంది.
- source_word: דִּבַּרְתֶּם בְּאָזְנָי
  choice: మీరు నాకు వినబడేలా ఏమన్నారో
  rationale: ‘నా చెవుల్లో మాట్లాడారు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తూ, దేవుడు వారి మాటలను ప్రత్యక్షంగా విన్నాడనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవ నామం יהוה యొక్క ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పారదర్శకంగా ప్రతిబింబిస్తుంది; ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: אִם לֹא ప్రమాణ సూత్రంలోని నిశ్చయ బలం
  choice: తెలుగు ప్రమాణ నిర్మాణం ద్వారా నిశ్చయాన్ని వ్యక్తం చేయడం
  alternative: ‘తప్పకుండా’ అనే పదాన్ని ప్రత్యక్షంగా చేర్చడం
  rationale: మూలంలోని ప్రమాణ సంబంధిత బలాన్ని నిలుపుతూ తెలుగు వాక్యాన్ని భారంగా కాకుండా చేస్తుంది; ‘నా జీవం తోడు’ మరియు ‘సరిగ్గా అలాగే’ కలిసి నిశ్చయాన్ని స్పష్టం చేస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే దైవ ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ప్రమాణం, అధికారపూర్వక ప్రకటన, మాట-చర్య సమాంతర నిర్మాణం కాపాడబడ్డాయి.
