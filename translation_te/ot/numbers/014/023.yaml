id: NUM.14.23
reference: Numbers 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יִרְאוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לַ/אֲבֹתָ֑/ם וְ/כָל מְנַאֲצַ֖/י לֹ֥א יִרְאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: te
  text: వారి పితరులకు[b] నేను ప్రమాణపూర్వకంగా వాగ్దానం చేసిన దేశాన్ని వారు ఎంతమాత్రమూ చూడరు[a]; నన్ను తృణీకరించినవారిలో ఎవరూ దాన్ని చూడరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా, “వారు ఆ దేశాన్ని చూస్తే”; ఈ ప్రమాణ సూత్రంలో దాని భావం బలమైన నిరాకరణ: “వారు ఎంతమాత్రమూ ఆ దేశాన్ని చూడరు.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారి పూర్వీకులకు.” హీబ్రూలో అక్షరార్థంగా, “వారి తండ్రులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఎంతమాత్రమూ ... చూడరు
  rationale: ఇక్కడ אִם సాధారణ షరతును సూచించకుండా, ప్రమాణ సూత్రంలో బలమైన నిరాకరణను వ్యక్తం చేస్తుంది. అందువల్ల దాని భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: יִרְאוּ
  choice: చూడరు
  rationale: ראה ఇక్కడ కేవలం కంటితో చూడడమే కాక, ఆ దేశాన్ని అనుభవించడం లేదా దానిలో ప్రవేశించడం అనే సందర్భార్థాన్ని కలిగి ఉంది; అయితే మూలంలోని సరళమైన ‘చూడు’ రూపాన్ని నిలిపాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఈ నిబంధనాత్మక సందర్భంలో ఇది దేవుడు వాగ్దానం చేసిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది. ‘దేశం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נִשְׁבַּעְתִּי
  choice: ప్రమాణం చేసిన
  rationale: שבע నిఫ్అల్ రూపం ప్రమాణం చేయడాన్ని సూచిస్తుంది. ‘ప్రమాణం చేసిన’ అనేది దాని గంభీరమైన నిబంధనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: לַאֲבֹתָם
  choice: వారి పితరులకు
  rationale: మూలపదం అక్షరార్థంగా ‘వారి తండ్రులు/పితరులు.’ ఇశ్రాయేలు పూర్వపితరులను సూచించే బైబిలీయ సందర్భానికి ‘పితరులు’ సరిపోతుంది; ‘పూర్వీకులు’ అనే భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְכָל
  choice: వారిలో ఎవరూ
  rationale: తదుపరి నిరాకరణతో కలిసి ఇది ‘అందరూ కాదు’ అనే సందిగ్ధ భావం కాకుండా, ప్రతి ఒక్కరినీ మినహాయించే ‘ఎవరూ కాదు’ అనే భావాన్ని ఇస్తుంది.
- source_word: מְנַאֲצַי
  choice: నన్ను తృణీకరించిన వారు
  rationale: נאץ దేవుణ్ణి అలక్ష్యంగా, అవమానకరంగా తిరస్కరించడాన్ని సూచిస్తుంది. ‘తృణీకరించిన’ దాని తీవ్రతను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לֹא יִרְאוּהָ
  choice: దాన్ని చూడరు
  rationale: స్త్రీలింగ ప్రత్యయ సర్వనామం ముందున్న ‘దేశం’ను సూచిస్తుంది. మూలంలోని పునరుక్తిని, తీర్పు ధ్వనిని నిలిపేందుకు ‘దాన్ని చూడరు’ అని అనువదించాం.
theological_decisions:
- issue: ప్రారంభ ప్రమాణ సూత్రంలోని אִם బలం
  choice: బలమైన నిరాకరణగా ‘ఎంతమాత్రమూ చూడరు’
  alternative: అక్షరార్థంగా ‘వారు ఆ దేశాన్ని చూస్తే’
  rationale: ఈ సందర్భంలో אִם దైవ ప్రమాణానికి చెందిన సంక్షిప్త సూత్రం; దాని పూర్తి భావం ప్రతికూలమైనది. షరతుగా మాత్రమే అనువదిస్తే తీర్పు అర్థం తెలుగులో అస్పష్టమవుతుంది. పాదటిప్పణి మూల నిర్మాణాన్ని తెలియజేస్తుంది.
- issue: אָבוֹת పదం అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘వారి పితరులు’
  alternative: ‘వారి పూర్వీకులు’
  rationale: హీబ్రూ పదం పురుషలింగ కుటుంబపదం; సందర్భంలో ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని ఉపయోగిస్తూ, దైవ తీర్పుకు తగిన గంభీరతను నిలిపాం. ‘పితరులు’ అనే బైబిలీయంగా పరిచితమైన పదాన్ని సందర్భ ఖచ్చితత్వం కోసం ఉంచాం; మిగతా పదజాలాన్ని సాధారణ పాఠకులకు సులభంగా ఉండేలా తీర్చిదిద్దాం.
