  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: te
  text: అయితే యెహోవాకు వ్యతిరేకంగా తిరుగుబాటు చేయకండి. ఆ దేశ ప్రజలకు భయపడకండి; వారు మనకు ఆహారమే[a]. వారి రక్షణ వారిని విడిచిపోయింది[b], యెహోవా మనతో ఉన్నాడు. వారికి భయపడకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారు మన రొట్టె.” ఇది వారు సులభంగా జయించబడతారనే భావాన్ని తెలిపే రూపకం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి నీడ వారిమీద నుంచి తొలగిపోయింది.” ఇక్కడ “నీడ” ఆశ్రయం లేదా రక్షణను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ఒక్కటి మాత్రం
  rationale: ఈ అవ్యయం బలమైన పరిమితిని లేదా ఉద్ఘాటనను సూచిస్తుంది. తరువాతి హెచ్చరికను సహజమైన ఆధునిక తెలుగులో గట్టిగా ముందుకు తెస్తుంది.
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: యెహోవా మీద తిరుగుబాటు చేయకండి
  rationale: מָרַד‌తో వచ్చిన בְּ తిరుగుబాటు ఎవరికి వ్యతిరేకంగా జరుగుతుందో సూచిస్తుంది. దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా ఉంచాం.
- source_word: עַם הָאָרֶץ
  choice: ఆ దేశ ప్రజలు
  rationale: ‘దేశపు ప్రజలు’ అనే మూల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలోని కనాను దేశాన్ని ‘ఆ’ స్పష్టం చేస్తుంది.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: వారు మనకు రొట్టెలాంటివారు
  rationale: ‘వారు మన రొట్టె’ అనే సంక్షిప్త హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యేలా ‘లాంటివారు’తో నిలుపుతుంది; సులభంగా జయించగలరనే భావాన్ని నేరుగా వివరణగా మార్చదు.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: వారి రక్షణ వారిని విడిచిపోయింది
  rationale: צֵל అక్షరార్థంగా ‘నీడ’; ఇక్కడ అది ఆశ్రయం లేదా రక్షణకు రూపకం. ఆధునిక పాఠకులకు సందర్భార్థం స్పష్టంగా ఉండేలా ‘రక్షణ’ను ప్రధాన పాఠ్యంలో వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיהוָה אִתָּנוּ
  choice: యెహోవా మనతో ఉన్నాడు
  rationale: సాధారణ waw అనుసంధానాన్ని తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే సహజంగా వ్యక్తపరచవచ్చు; దేవుని సన్నిధి ప్రకటనను యథాతథంగా ఉంచాం.
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: భయపడకండి / వారికి భయపడకండి
  rationale: శత్రువుల ఎదుట కలిగే భయాన్ని నేరుగా తెలియజేస్తుంది. చివరలో పునరావృతమైన నిషేధాన్ని తొలగించకుండా నిలిపాం.
theological_decisions:
