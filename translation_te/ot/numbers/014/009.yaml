  choice: ‘వారు మనకు రొట్టెలాంటివారు’ అని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘వారు మనకు ఆహారం’ లేదా ‘మనం వారిని మింగివేస్తాం’
  rationale: మూలంలోని బలమైన, సంక్షిప్త రూపకాన్ని కాపాడుతూ, అది సులభమైన జయాన్ని సూచిస్తుందనే వ్యాఖ్యానాన్ని పాఠ్యంలో బలవంతంగా చేర్చకుండా ఉంటుంది.
- issue: צִלָּם అనే ‘నీడ’ రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘రక్షణ’ అని సందర్భార్థాన్ని ఇవ్వడం
  alternative: ‘వారి నీడ వారిమీద నుంచి తొలగిపోయింది’ లేదా ‘వారి ఆశ్రయం తొలగిపోయింది’
  rationale: ‘నీడ’ అనే అక్షరార్థం తెలుగులో సందర్భం లేకుండా అస్పష్టంగా ఉండవచ్చు. ‘రక్షణ’ రూపకపు కార్యాన్ని స్పష్టం చేస్తుంది; అక్షరార్థం పాదటిప్పణిలో భద్రపరచబడింది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు లేదా యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. బహువచన ఆజ్ఞలకు ‘చేయకండి/భయపడకండి’ రూపాలను ఎంచుకున్నాం. హీబ్రూ వాక్యంలోని చివరి పునరుక్తిని ఉద్ఘాటనగా యథాతథంగా నిలిపాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
