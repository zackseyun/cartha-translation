revisions:
- from: వారు తెల్లవారగానే లేచి, కొండ శిఖరానికి ఎక్కి, “ఇదిగో, మేమున్నాం. యెహోవా చెప్పిన స్థలానికి మేము వెళ్తాం; ఎందుకంటే మేము పాపం చేశాం” అన్నారు.[a]
  to: వారు ఉదయాన్నే లేచి కొండ శిఖరానికి ఎక్కి, “ఇదిగో, మేమున్నాం; యాహ్వే చెప్పిన ఆ స్థలానికి మేము ఎక్కి వెళ్తాం, ఎందుకంటే మేము పాపం చేశాం” అన్నారు.
