id: NUM.14.40
reference: Numbers 14:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: te
  text: వారు ఉదయాన్నే లేచి కొండ శిఖరానికి ఎక్కి, “ఇదిగో, మేమున్నాం; యాహ్వే చెప్పిన ఆ స్థలానికి మేము ఎక్కి వెళ్తాం, ఎందుకంటే మేము పాపం చేశాం” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: వారు తెల్లవారగానే లేచి
  rationale: שׁכם హిఫిల్ రూపం త్వరగా లేవడం లేదా త్వరగా బయలుదేరడాన్ని సూచిస్తుంది; בַבֹּקֶרతో కలిపి ఉదయాన్నే చేసిన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: కొండ శిఖరానికి ఎక్కి
  rationale: עלה అంటే పైకి వెళ్లడం; רֹאשׁ הָהָר అనే హీబ్రూ ప్రయోగం కొండ పైభాగాన్ని లేదా శిఖరాన్ని సూచిస్తుంది.
- source_word: הִנֶּנּוּ
  choice: ఇదిగో, మేమున్నాం
  rationale: ఇది తమను తాము సమర్పించుకుంటూ ఉనికిని తెలియజేసే సూత్రప్రాయమైన పలుకు. కేవలం ‘మేము సిద్ధంగా ఉన్నాం’ అని అనువదిస్తే మూలంలో లేని సిద్ధత భావాన్ని అధికంగా చేర్చినట్లవుతుంది.
- source_word: וְעָלִינוּ
  choice: మేము వెళ్తాం
  rationale: రూపపరంగా పరిపూర్ణ క్రియ అయినా, ఈ సందర్భంలో సంకల్పించిన తదుపరి చర్యను తెలియజేస్తుంది. గమ్యం ఎత్తైన ప్రాంతమని ముందటి వాక్యభాగమే స్పష్టం చేస్తుండటంతో సహజ తెలుగులో ‘వెళ్తాం’ అని ఇచ్చాం.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: యెహోవా చెప్పిన స్థలానికి
  rationale: אָמַר యొక్క ప్రాథమిక అర్థం ‘చెప్పాడు.’ ‘వాగ్దానం చేసిన’ అని ఇవ్వడం సందర్భానుకూలమైనా మూలపదం కంటే బలమైన వ్యాఖ్యానం అవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כִּי חָטָאנוּ
  choice: ఎందుకంటే మేము పాపం చేశాం
  rationale: כִּי ఇక్కడ కారణాన్ని పరిచయం చేస్తుంది; חטא నైతిక, ఆధ్యాత్మిక అపరాధ భావాన్ని కలిగి ఉన్నందున దాన్ని బలహీనపరచకుండా ‘పాపం చేశాం’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో స్థిరపడి, సాధారణ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
- issue: వారి పాపాంగీకారం మరియు వెళ్లాలనే సంకల్పం మధ్య సంబంధం
  choice: ‘ఎందుకంటే’ అనే కారణార్థక సంబంధాన్ని నిలిపాం
  alternative: ‘నిజంగా మేము పాపం చేశాం’ అనే ఉద్ఘాటనార్థం
  rationale: כִּיకి కారణార్థం, ఉద్ఘాటనార్థం రెండూ సాధ్యమైనప్పటికీ, ఇక్కడ తమ చర్యకు వారు చెప్పే కారణంగా చదవడం సందర్భానికి బాగా సరిపోతుంది; వారి పశ్చాత్తాపం నిజమైనదా కాదా అన్న తీర్పును అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలిపాం. ప్రత్యక్ష వాక్యంలో సహజమైన తెలుగు వాక్యక్రమాన్ని ఉపయోగించాం.
