id: NUM.14.4
reference: Numbers 14:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו נִתְּנָ֥ה רֹ֖אשׁ וְ/נָשׁ֥וּבָה מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: te
  text: వారు ఒకరితో ఒకరు[a], “మనకు ఒక నాయకుణ్ణి[b] నియమించుకుందాం; ఐగుప్తుకు తిరిగి వెళ్దాం” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒకడు తన సోదరునితో.’ ఈ హీబ్రూ నుడికారం వారు తమలో తాము పరస్పరం మాట్లాడుకున్నారని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఒక తలను ఉంచుకుందాం.’ ఇక్కడ ‘తల’ అంటే సమూహంపై నియమించబడే వ్యక్తి, అంటే నాయకుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అని చెప్పుకున్నారు
  rationale: ఈ క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది. పరస్పరం మాట్లాడుకున్నారనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘చెప్పుకున్నారు’ అని అనువదించాం.
- source_word: אִישׁ אֶל אָחִיו
  choice: ఒకరితో ఒకరు
  rationale: అక్షరార్థంగా ‘ఒకడు తన సహోదరునితో’ అయినా, ఇది సమూహంలోని వారు పరస్పరం మాట్లాడుకున్నారని తెలిపే హీబ్రూ నుడికారం. ‘ఒకరితో ఒకరు’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: נִתְּנָה
  choice: నియమించుకొని
  rationale: ఇది ప్రథమ పురుష బహువచన సంకల్పార్థక రూపం. רֹאשׁ అనే కర్మతో కలిసినప్పుడు ఒకరిని అధిపతిగా నిలపడం లేదా నియమించడం అనే భావం వస్తుంది. తరువాతి ‘తిరిగి వెళ్దాం’తో సహజంగా అనుసంధానించడానికి ‘నియమించుకొని’ వాడాం.
- source_word: רֹאשׁ
  choice: ఒక నాయకుణ్ణి
  rationale: పదానికి అక్షరార్థం ‘తల’; ఇక్కడ సమూహంపై ఉంచబడే అధికారిని సూచిస్తుంది. అందువల్ల ‘నాయకుడు’ సందర్భోచితమైన, స్పష్టమైన తెలుగు పదం.
- source_word: וְנָשׁוּבָה
  choice: తిరిగి వెళ్దాం
  rationale: ఇది కూడా సంకల్పార్థక బహువచన రూపం. ‘తిరిగి వెళ్దాం’ అనే రూపం తిరుగు ప్రయాణాన్నీ, సమూహపు ప్రతిపాదననూ సహజంగా తెలియజేస్తుంది.
- source_word: מִצְרָיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే చివరి ప్రత్యయం ఐగుప్తు వైపు ప్రయాణాన్ని తెలియజేస్తుంది. ‘తిరిగి’ అనే పదం వెనక్కి వెళ్లే భావాన్ని ఇప్పటికే వ్యక్తపరుస్తుంది.
