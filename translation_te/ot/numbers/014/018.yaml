revisions:
- from: యెహోవా కోపించడానికి నిదానించేవాడు, నిలకడైన ప్రేమలో సమృద్ధిగలవాడు[a]. ఆయన దోషాన్ని, తిరుగుబాటును క్షమిస్తాడు[b]. అయితే దోషిని ఏమాత్రం నిర్దోషిగా ఎంచడు[c]. తండ్రుల దోషాన్ని పిల్లల మీదికి, మూడో తరంవరకు, నాలుగో తరంవరకు రప్పిస్తాడు[d].
  to: యాహ్వే కోపానికి నెమ్మదించేవాడు, నిలకడైన ప్రేమలో సమృద్ధిగలవాడు[a]. ఆయన దోషాన్ని, తిరుగుబాటును క్షమిస్తాడు[b]. అయితే దోషిని ఏమాత్రం నిర్దోషిగా తీర్పు చెప్పడు[c]. తండ్రుల దోషాన్ని పిల్లలపైకి, మూడో మరియు నాలుగో తరాలపైకి తీసుకువస్తాడు[d].
  rationale: POB దైవనామ విధానానికి అనుగుణంగా “యెహోవా”ను “యాహ్వే”గా మార్చాం. ఆధునిక తెలుగు సహజత్వం కోసం రెండు నుడికారాలను సవరించాం. తండ్రుల దోషం పిల్లలు, మూడో మరియు నాలుగో తరాలపైకి వస్తుందనే కఠినమైన మూల వాక్యాన్ని మృదువుపరచకుండా, సిద్ధాంతపరమైన వివరణను జోడించకుండా ఉంచాం.
