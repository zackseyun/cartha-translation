id: NUM.14.18
reference: Numbers 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: te
  text: యాహ్వే కోపానికి నెమ్మదించేవాడు, నిలకడైన ప్రేమలో సమృద్ధిగలవాడు[a]. ఆయన దోషాన్ని, తిరుగుబాటును క్షమిస్తాడు[b]. అయితే దోషిని ఏమాత్రం నిర్దోషిగా తీర్పు చెప్పడు[c]. తండ్రుల దోషాన్ని పిల్లలపైకి, మూడో మరియు నాలుగో తరాలపైకి తీసుకువస్తాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిబంధన విశ్వసనీయతలో గొప్పవాడు,” “కృపలో సమృద్ధిగలవాడు.”
    reason: lexical_alternative
  - marker: b
    text: “క్షమిస్తాడు” అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థంగా “దోషాన్ని, తిరుగుబాటును మోస్తాడు” అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “శిక్షించకుండా ఎంతమాత్రమూ విడిచిపెట్టడు,” “నిర్దోషిగా తీర్పు చెప్పడు.”
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూలో “మూడో, నాలుగో [తరాల]పైకి” అని ఉంది; ఇక్కడ తరువాతి తరాలు ఉద్దేశించబడ్డాయి.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: אֶרֶךְ אַפַּיִם
  choice: కోపించడానికి నిదానించేవాడు
  rationale: అక్షరార్థంగా ‘ముక్కుపుటాలు దీర్ఘంగా ఉన్నవాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; కోపాన్ని ఆలస్యం చేసే స్వభావాన్ని తెలియజేస్తుంది.
- source_word: רַב חֶסֶד
  choice: నిలకడైన ప్రేమలో సమృద్ధిగలవాడు
  rationale: חֶסֶדలోని స్థిరమైన ప్రేమ, కృప, నిబంధన విశ్వసనీయత అనే భావవ్యాప్తిని సాధ్యమైనంతగా నిలుపుతుంది; רַבను ‘సమృద్ధిగలవాడు’గా ప్రతిబింబిస్తుంది.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: దోషాన్ని, తిరుగుబాటును క్షమిస్తాడు
  rationale: נשא పాపపదాలతో వచ్చినప్పుడు ‘మోయడం/తొలగించడం’ ద్వారా క్షమించడాన్ని సూచిస్తుంది. עָוֺן, פָשַׁע మధ్య భేదాన్ని ‘దోషం’, ‘తిరుగుబాటు’గా నిలిపింది.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: అయితే దోషిని ఏమాత్రం నిర్దోషిగా ఎంచడు
  rationale: అనంతక్రియ-సమాపక క్రియ నిర్మాణంలోని బలమైన నిరాకరణను ‘ఏమాత్రం ... ఎంచడు’గా తెలిపింది; న్యాయపరమైన נקה భావానికి తెలుగులో సహజంగా ఉండేందుకు అంతర్భావిత కర్మ ‘దోషిని’ను చేర్చింది.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: తండ్రుల దోషాన్ని పిల్లల మీదికి ... రప్పిస్తాడు
  rationale: פקדను కేవలం సహజ పరిణామాలుగా లేదా నేరుగా ‘శిక్షిస్తాడు’గా ముందే తీర్మానించకుండా, దోషపు న్యాయపరమైన ఫలితాన్ని వారిమీదికి తీసుకురావడం అనే భావాన్ని ఉంచింది.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: మూడో తరంవరకు, నాలుగో తరంవరకు
  rationale: హీబ్రూలో అంతర్భావంగా ఉన్న ‘తరం’ను స్పష్టత కోసం చేర్చి, పునరుక్త ఉపసర్గను రెండు చోట్ల ‘వరకు’గా ప్రతిబింబించింది.
theological_decisions:
- issue: దైవ క్షమాపణ, న్యాయం, తరాలపై దోషపు పరిణామాల మధ్య ఉద్రిక్తత
  choice: దేవుడు క్షమిస్తాడనీ, అయినా దోషిని నిర్దోషిగా ఎంచడనీ, తండ్రుల దోషాన్ని తరువాతి తరాల మీదికి రప్పిస్తాడనీ పాఠ్యంలో ఉన్న ఉద్రిక్తతను యథాతథంగా ఉంచడం.
  alternative: దీనిని కేవలం సహజ పరిణామాలుగా వివరించడం లేదా వ్యక్తిగత బాధ్యతను తెలిపే ఇతర వచనాలకు అనుగుణంగా మృదువుగా మార్చడం.
  rationale: మూల హీబ్రూ ఈ అంశాలను పక్కపక్కనే ఉంచుతుంది. అనువాదం వాటి సంబంధాన్ని సిద్ధాంతపరంగా పరిష్కరించకుండా మూలంలోని ఉద్రిక్తతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దోషం/తిరుగుబాటు,’ ‘క్షమించడం/నిర్దోషిగా ఎంచడం’ వంటి భేదాలను నిలిపి, అతిగా సంస్కృతీకృతమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది.
