  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: te
  text: అప్పుడు సమాజమంతా వారిని రాళ్లతో కొట్టాలని అన్నారు. అయితే యాహ్వే మహిమ సమాగమపు గుడారంలో ఇశ్రాయేలు ప్రజలందరికీ కనిపించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇక్కడ సమావేశమైన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతా’ అనే రూపం సమష్టి భావాన్నీ, כָּל యొక్క సంపూర్ణతనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: వారిని రాళ్లతో కొట్టాలని
  rationale: רגם అంటే రాళ్లతో కొట్టడం. మరణం ఉద్దేశంగా ఉండవచ్చుగానీ మూలపాఠంలో ‘చంపడం’ స్పష్టంగా లేదు; అందువల్ల దాన్ని చేర్చలేదు. אֹתָם అనే సర్వనామాన్ని యెహోషువ, కాలేబు పేర్లతో భర్తీ చేయకుండా ‘వారిని’గా ఉంచాం.
- source_word: כְבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: כָּבוֹד ఇక్కడ దేవుని ప్రత్యక్షమయ్యే మహిమను సూచిస్తుంది; יהוה అనే వ్యక్తిగత నామాన్ని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: נִרְאָה
  choice: కనిపించింది
  rationale: ראה యొక్క నిఫ్అల్ రూపం దృశ్య ప్రత్యక్షతను తెలియజేస్తుంది. ‘కనిపించింది’ మూలంలోని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵדకు తెలుగులో స్థిరంగా, అర్థవంతంగా వినిపించే ‘ప్రత్యక్ష గుడారం’ వాడాం; בְּ యొక్క స్థానార్థాన్ని ‘లో’తో నిలిపాం.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరికీ
  rationale: בְּנֵי יִשְׂרָאֵל ఇక్కడ జాతీయ సమూహాన్ని సూచించే స్థిర ప్రయోగం; ‘ఇశ్రాయేలు కుమారులందరికీ’ అనే అక్షరార్థం తెలుగులో అనవసరంగా పురుషులకే పరిమితమైనట్లు వినిపించవచ్చు. అందువల్ల సమగ్ర జాతీయ భావాన్ని ‘ఇశ్రాయేలు ప్రజలందరికీ’గా అందించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ‘యాహ్వే’ రూపాన్ని ఉంచాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతీయ సంజ్ఞ
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ స్థిర హీబ్రూ ప్రయోగం సందర్భంలో మొత్తం ఇశ్రాయేలు జనసమూహాన్ని సూచిస్తుంది. తెలుగులో అసలు సూచన పరిధిని స్పష్టంగా నిలిపేందుకు సమగ్ర జాతీయ పదబంధాన్ని ఎంచుకున్నాం.
- issue: כְבוֹד యొక్క ప్రత్యక్షత
  choice: యాహ్వే మహిమ కనిపించింది
  alternative: యాహ్వే మహిమ ప్రత్యక్షమైంది
  rationale: నిఫ్అల్ נִרְאָהలోని దృశ్యంగా కనిపించడం అనే భావాన్ని నిలిపాం; మహిమ యొక్క స్వరూపం లేదా విధానం గురించి మూలం చెప్పనిదాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గంభీరమైన వాక్యనిర్మాణంతో అనువదించాం. హీబ్రూ వాక్యంలోని మలుపును וּ־ వద్ద ‘అయితే’తో వ్యక్తం చేశాం. వివరణ అవసరమైన పాఠాంతరమో నిజమైన ద్వంద్వార్థమో లేనందున పాదటీకలు చేర్చలేదు.
