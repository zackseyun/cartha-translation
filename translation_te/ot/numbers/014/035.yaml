id: NUM.14.35
reference: Numbers 14:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: te
  text: '“యాహ్వే అయిన నేను చెప్పాను: నాకు విరోధంగా కూడిన ఈ దుష్ట సమాజమంతటికీ[a] నేను తప్పకుండా[b] ఇదే చేస్తాను. ఈ అరణ్యంలో వారు అంతమైపోతారు; అక్కడే వారు చనిపోతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమాజం’కు బదులుగా ‘సభ’ లేదా ‘సమూహం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తప్పకుండా’ అని అనువదించిన హెబ్రీ ప్రయోగానికి అక్షరార్థం ‘కాకపోతే’; ఇక్కడ అది ప్రమాణసదృశంగా బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: דִּבַּרְתִּי
  choice: నేను చెప్పాను
  rationale: పూర్తయిన, అధికారపూర్వకమైన దైవ ప్రకటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם לֹא
  choice: తప్పకుండా
  rationale: ఇక్కడ ఇది అక్షరార్థమైన షరతు కాదు; ప్రమాణసదృశమైన బలమైన నిశ్చయోక్తి. ‘తప్పకుండా’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: זֹאת אֶעֱשֶׂה
  choice: నేను ఇదే చేస్తాను
  rationale: ‘ఇదే’ అనే రూపం సూచనార్థక పదంలోని ఉద్ఘాటనను నిలుపుతూ, భవిష్య కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే పదానికి ‘సమాజం’ సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానం; తరువాతి కాలపు సంఘవ్యవస్థను అనవసరంగా సూచించదు.
- source_word: הָרָעָה
  choice: దుష్ట
  rationale: ఇది కేవలం అననుకూల స్థితిని కాక, వారి తిరుగుబాటుపై నైతిక తీర్పును సూచిస్తుంది.
- source_word: הַנּוֹעָדִים עָלָי
  choice: నాకు విరోధంగా కూడిన
  rationale: వారు సమష్టిగా సమావేశమవడాన్నీ, ఆ సమీకరణ దేవునికి వ్యతిరేకమైనదనే భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: ఈ అరణ్యంలో
  rationale: మిద్బార్ సూచించే జనావాసరహిత ప్రాంతాన్ని పంచగ్రంథ సందర్భానికి తగిన విధంగా ‘అరణ్యం’గా అనువదించాం.
- source_word: יִתַּמּוּ
  choice: అంతమైపోతారు
  rationale: ‘పూర్తిగా ముగియడం’ అనే క్రియార్థాన్ని నిలుపుతూ, వెంటనే వచ్చే ‘చనిపోతారు’ అనే వేరైన క్రియలో కలిపివేయదు.
- source_word: וְשָׁם יָמֻתוּ
  choice: ఇక్కడే వారు చనిపోతారు
  rationale: ‘అక్కడ’ అనే మూలపాఠ దిశాసూచకాన్ని తెలుగు ప్రత్యక్ష వాక్యంలో ముందున్న ‘ఈ అరణ్యం’ వైపు చూపే సహజమైన ‘ఇక్కడే’గా ఇచ్చి, స్థల ఉద్ఘాటనను నిలిపాం.
theological_decisions:
- issue: אִם לֹא అనే దైవ ప్రమాణసదృశ ప్రయోగం
  choice: ‘నేను తప్పకుండా ఇదే చేస్తాను’ అనే బలమైన నిశ్చయోక్తి
  alternative: ‘నేను ఇలా చేయకపోతే...’ అనే అక్షరార్థ షరతు
  rationale: ఈ సందర్భంలో హెబ్రీ ప్రయోగం అసంపూర్ణ షరతుగా కాక, దేవుని తీర్పు నిశ్చయంగా నెరవేరుతుందనే గంభీర ప్రకటనగా పనిచేస్తుంది.
- issue: עֵדָה అనే సమష్టి పదం
  choice: సమాజం
  alternative: సభ లేదా సమూహం
  rationale: తీర్పు వ్యక్తులపై విడివిడిగా కాక, దేవునికి విరోధంగా కూడిన ప్రజాసమష్టిపై ఉందనే భావాన్ని ‘సమాజం’ నిలుపుతుంది; దానిలో తరువాతి కాలపు ప్రత్యేక మతసంస్థ భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే దైవ తీర్పు యొక్క గంభీరతను నిలుపుతూ రచించబడింది. ‘సమాజం’ను ‘సంఘం’కన్నా ఎంచుకోవడం ద్వారా అనవసరమైన తరువాతి కాలపు మతసంస్థ భావాన్ని నివారించాం. రెండు ముగింపు క్రియలను వేరుగా ఉంచి హెబ్రీ సమాంతర నిర్మాణాన్ని కాపాడాం.
