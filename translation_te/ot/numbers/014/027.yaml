  variant: modern standard Telugu
source:
  edition: WLC
  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: te
  text: నాకు విరోధంగా ఫిర్యాదు చేస్తున్న ఈ దుష్ట సమాజాన్ని[a] నేను ఇంకెంతకాలం సహించాలి?[b] ఇశ్రాయేలు కుమారులు[c] నాకు విరోధంగా చేస్తున్న ఫిర్యాదులను నేను విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమాజం’కు ‘సభ’ లేదా ‘సమూహం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సహించాలి’ అనే క్రియ హీబ్రూ పాఠంలో స్పష్టంగా లేదు; వాక్యసందర్భం నుంచి పూరించబడింది.
    reason: source_ambiguity
  - marker: c
    text: ‘ఇశ్రాయేలు కుమారులు’కు ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతానం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: ఇంకెంతకాలం
  rationale: విసుగు, ఆగ్రహం వ్యక్తమయ్యే కాలప్రశ్నను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לָעֵדָה
  choice: సమాజాన్ని
  rationale: עֵדָה ఇక్కడ కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది; ‘సమాజం’ సామూహిక భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: הָרָעָה הַזֹּאת
  choice: ఈ దుష్ట
  rationale: רָעָה ఇక్కడ కేవలం చెడ్డదనే సాధారణ భావం కాక, దేవుని నైతిక తీర్పును సూచిస్తుంది; ‘దుష్ట’ ఆ తీవ్రతను నిలుపుతుంది.
- source_word: מַלִּינִים
  choice: సణుగుతున్న / చేస్తున్న సణుగులు
  rationale: అరణ్య కథనాల్లో ఈ పదం అసంతృప్తితో కూడిన తిరుగుబాటు స్వభావపు ఫిర్యాదును సూచిస్తుంది; ‘సణుగు’ క్రియారూపం, నామరూపం రెండింటిలోనూ పునరుక్తిని నిలుపుతుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: ఫిర్యాదు దేవునికి వ్యతిరేకంగా మళ్లించబడిందనే విరోధార్థాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: תְּלֻנּוֹת
  choice: సణుగులను
  rationale: వ్యక్తం చేసిన అసంతృప్తి, ఫిర్యాదులను సూచిస్తుంది; సమీపంలోని సంబంధిత క్రియతో ఉన్న మూలపాఠపు పదపునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పురుష బహువచన నిర్మాణాన్ని ప్రత్యక్షంగా నిలుపుతూ, తెలుగు పాఠకులకు అర్థమయ్యే సంప్రదాయబద్ధమైన వ్యక్తీకరణను ఇస్తుంది.
- source_word: שָׁמָעְתִּי
  choice: నేను విన్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను సహజమైన తెలుగు భూతకాలంలో అందిస్తూ, దేవుడు వారి సణుగులను నిజంగా విన్నాడనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధంలోని లింగరూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని వ్యాకరణపరమైన పురుష బహువచనాన్ని అనవసరంగా లింగతటస్థం చేయకుండా కాపాడుతుంది; ప్రత్యామ్నాయ సహజ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: మొదటి ప్రశ్నలో హీబ్రూలో స్పష్టంగా లేని క్రియ
  choice: సహించాలి అని సందర్భానుసారంగా పూరించడం
  alternative: క్రియ లేకుండా అత్యంత అక్షరార్థమైన, కానీ తెలుగులో అసంపూర్ణమైన ప్రశ్నగా ఉంచడం
  rationale: హీబ్రూ వాక్యంలో ప్రధాన క్రియ అధ్యాహారంగా ఉంది. సందర్భం సహించడం లేదా భరించడం అనే భావాన్ని కోరుతుంది; దానిని ప్రధాన పాఠంలో సహజంగా పూరించి, మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సణుగు’ మూలంలోని క్రియా-నామ పునరుక్తిని నిలుపుతుంది; ‘సహించాలి’ తెలుగు వాక్యాన్ని సహజంగా పూర్తిచేస్తూ దాని అధ్యాహార స్వభావాన్ని పాదటిప్పణిలో వెల్లడిస్తుంది.
