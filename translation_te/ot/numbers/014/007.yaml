translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. హెబ్రీయు מְאֹד מְאֹד పునరుక్తిని ‘ఎంతో ఎంతో’గా నిలిపి వాక్యంలోని ఉద్ఘాటనను సంరక్షించాం.
