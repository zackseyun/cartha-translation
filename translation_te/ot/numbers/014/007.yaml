  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: te
  text: 'వారు ఇశ్రాయేలీయుల సమాజమంతటికీ ఇలా చెప్పారు: “మేము పరిశీలించడానికి సంచరించిన ఆ దేశం చాలా చాలా మంచి దేశం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: వారు ... అన్నారు
  rationale: אמר యొక్క సాధారణ కథనార్థాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ ప్రవేశంతో అందిస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల సమాజమంతటితో
  rationale: עֵדָה అనేది సమకూడిన సమాజాన్ని సూచిస్తుంది; בְּנֵי יִשְׂרָאֵל‌ను ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులు’ అని ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: హెబ్రీయులలో మాటను పరిచయం చేసే ప్రయోగాన్ని తెలుగులో సహజమైన సంభాషణ సూత్రంగా కలిపి అనువదించాం.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: సందర్భంలో చర్చలో ఉన్న కనాను దేశాన్ని నిర్దిష్టంగా సూచిస్తుంది.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: మేము ... వెళ్లిన
  rationale: ఆ దేశంలో ప్రయాణించిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తరువాతి ఉద్దేశపూర్వక క్రియతో కలిపి వాక్యాన్ని సులభంగా ఉంచుతుంది.
- source_word: לָתוּר אֹתָהּ
  choice: పరిశీలించడానికి
  rationale: תור ఇక్కడ భూభాగాన్ని గమనించి తెలుసుకునే నిఘా/అన్వేషణ భావాన్ని కలిగి ఉంది; ‘పరిశీలించడానికి’ ఆ విస్తృత భావాన్ని అతిగా సైనికీకరించకుండా అందిస్తుంది.
- source_word: טוֹבָה
  choice: మంచి
  rationale: మూల విశేషణం యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; తీవ్రతను తరువాతి పునరుక్తి తెలియజేస్తుంది.
- source_word: מְאֹד מְאֹד
  choice: ఎంతో ఎంతో
  rationale: హెబ్రీయు ద్విరుక్తిని నిలిపి దాని బలమైన ఉద్ఘాటనను సహజమైన తెలుగులో అందిస్తుంది.
