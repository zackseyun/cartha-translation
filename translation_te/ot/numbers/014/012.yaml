base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: te
  text: “నేను ఈ ప్రజలను తెగులుతో కొట్టి, వారిని వారి స్వాస్థ్యం నుండి తొలగిస్తాను[a]. నిన్ను వారికంటే గొప్పదైన, బలమైన జాతిగా చేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారి వారసత్వ హక్కును తొలగిస్తాను.” హెబ్రీ క్రియకు స్వాధీనంలోనుండి తొలగించడం, వారసత్వాన్ని కోల్పోయేలా చేయడం అనే రెండు భావఛాయలు ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: ఈ ప్రజలను ... కొట్టి
  rationale: נכה హిఫిల్ రూపానికి ‘కొట్టు’ సహజమైన ఆధునిక తెలుగు సమానం. హెబ్రీలో ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది; తెలుగులో స్పష్టత కోసం ‘ఈ ప్రజలను’ అని భావానుగుణ బహువచనంగా ఇచ్చాం.
- source_word: בַדֶּבֶר
  choice: తెగులుతో
  rationale: דֶּבֶר తీర్పు సందర్భంలో వ్యాపించే ప్రాణాంతక వ్యాధిని సూచిస్తుంది; ‘తెగులు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: వారిని వారి స్వాస్థ్యం నుండి తొలగిస్తాను
  rationale: ירשׁ హిఫిల్ రూపంలో స్వాధీనాన్ని లేదా వారసత్వాన్ని కోల్పోయేలా చేయడం అనే భావం ఉంది. ‘స్వాస్థ్యం నుండి తొలగించడం’ ఆ రెండు ఛాయలను కొంతవరకు నిలుపుతుంది.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: నీ నుండి ... జనాన్ని ఏర్పరుస్తాను
  rationale: మోషేను ఒక జనంగా మార్చడం కాక, అతని నుండి ఒక జనాన్ని ఉద్భవింపజేయడం సందర్భార్థం; ఆధునిక తెలుగులో ఇదే సహజమైన వ్యక్తీకరణ.
- source_word: גָּדוֹל וְעָצוּם
  choice: గొప్పదైన, బలమైన
  rationale: గొప్పతనం మరియు శక్తి అనే సమాంతర లక్షణాలను నిలుపుతుంది. מן తో వచ్చే పోలికను ‘వారికంటే’ ద్వారా మొత్తం పదబంధానికి వర్తింపజేశాం.
- source_word: מִמֶּנּוּ
  choice: వారికంటే
  rationale: హెబ్రీ ఏకవచనం ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. సహజ తెలుగులో అదే సూచ్యార్థాన్ని బహువచన సర్వనామంతో స్పష్టంగా తెలిపాం.
theological_decisions:
- issue: తీర్పుకు గురయ్యే వారి సంఖ్యా సూచన
  choice: ‘ఈ ప్రజలను/వారిని/వారికంటే’ అనే బహువచన రూపాలు
  alternative: సమష్టి ఏకవచనంగా ‘దానిని/దానికంటే’
  rationale: హెబ్రీ 3 పురుష ఏకవచన ప్రత్యయాలు ఇశ్రాయేలును ఒక సమష్టి జనంగా చూపుతాయి. అయితే తెలుగులో ప్రజలను సూచిస్తూ నిర్జీవ ఏకవచనం వాడటం అసహజం; బహువచనం సూచ్యార్థాన్ని మార్చకుండా స్పష్టతనిస్తుంది.
- issue: ירשׁ క్రియలోని స్వాధీనచ్యుతి–వారసత్వచ్యుతి ఉద్వేగం
  choice: ‘వారి స్వాస్థ్యం నుండి తొలగిస్తాను’
  alternative: ‘వారిని వారసత్వం నుండి తొలగిస్తాను’ లేదా ‘వారిని నిర్మూలిస్తాను’
  rationale: ఈ మాట భూస్వాస్థ్యం కోల్పోవడాన్నీ, వారసత్వ హక్కు పోవడాన్నీ సూచించగలదు. ప్రధాన పాఠం రెండింటికీ స్థలం ఇస్తుంది; పాదటిప్పణి ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. సందర్భం స్పష్టంగా ఉండేందుకు హెబ్రీ సమష్టి ఏకవచనాన్ని తెలుగులో సహజమైన బహువచనంగా వ్యక్తం చేశాం.
