language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: te
  text: కత్తిచేత పడిపోవడానికి యాహ్వే మనలను ఈ దేశంలోకి ఎందుకు తీసుకువస్తున్నాడు? మన భార్యలూ చిన్నపిల్లలూ కొల్లసొమ్ము అవుతారు[a]. ఐగుప్తుకు తిరిగి వెళ్లడం మనకు మేలు కాదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శత్రువులకు ఎరగా అవుతారు’; హీబ్రూ పదం శత్రువులు స్వాధీనం చేసుకునే కొల్లసొమ్మును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: ఎందుకు
  rationale: ముందటి మాటకు కొనసాగింపును తెలుగులో వాక్యప్రవాహమే స్పష్టం చేస్తుంది; కృత్రిమంగా ‘మరి’ చేర్చకుండా సహజమైన ప్రశ్నగా అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מֵבִיא
  choice: తీసుకొచ్చి ... చేస్తున్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా సమీప చర్య భావాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: కత్తికి బలయ్యేలా
  rationale: యుద్ధంలో కత్తివల్ల మరణించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: మన భార్యలు, చిన్నపిల్లలు
  rationale: కుటుంబ సందర్భంలో נָשִׁים ను ‘భార్యలు’గా, ముఖ్యంగా అసహాయులైన చిన్నవారిని సూచించే טַף ను ‘చిన్నపిల్లలు’గా అనువదించాం.
- source_word: יִהְיוּ לָבַז
  choice: దోపుడు సొమ్ముగా మారిపోతారు
  rationale: బַּז యుద్ధంలో శత్రువులు స్వాధీనం చేసుకునే దోపుడు లేదా కొల్లసొమ్మును సూచిస్తుంది; తెలుగు యుద్ధసందర్భంలో ఇది స్పష్టమైన రూపం.
- source_word: הֲלוֹא טוֹב לָנוּ
  choice: మనం ... మేలు కాదా?
  rationale: ప్రతికూల ప్రత్యుత్తరాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్న బలాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలిపాం.
- source_word: שׁוּב מִצְרָיְמָה
  choice: ఐగుప్తుకు తిరిగి వెళ్లడం
  rationale: తిరిగి మళ్లే భావాన్ని స్పష్టంగా నిలుపుతూ గమ్యార్థక ה ను తెలుగులో ‘కు’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించడానికి వాడే ప్రత్యామ్నాయ రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రజల భయం మరియు ఆరోపణతో కూడిన అలంకారప్రశ్న స్వరాన్ని నిలిపాం. భాష గౌరవప్రదంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు నేరుగా అర్థమయ్యేలా ఉంచాం; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
