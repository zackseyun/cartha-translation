source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: te
  text: అయితే నా సేవకుడైన కాలేబుకు భిన్నమైన ఆత్మ ఉంది[a], అతడు నన్ను సంపూర్ణంగా అనుసరించాడు[b] కాబట్టి, అతడు వెళ్లిన దేశంలోకి నేను అతణ్ణి తీసుకువస్తాను; అతని సంతానం దాన్ని స్వాధీనం చేసుకుంటుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి భిన్నమైన మనోభావం ఉంది.’ హీబ్రూ పదం ‘ఆత్మ,’ ‘స్వభావం,’ లేదా ‘మనోభావం’ అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారాన్ని పదశః అనువదిస్తే, ‘అతడు నా వెనుక నింపాడు’; దాని భావం అతడు యెహోవాను హృదయపూర్వకంగా లేదా పూర్తిగా అనుసరించాడని.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దాన్ని వారసత్వంగా పొందుతుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: అయితే నా సేవకుడైన కాలేబు
  rationale: ముందటి వచనాల్లోని అవిశ్వాసులైన తరంతో కాలేబును వ్యతిరేకంగా చూపుతున్నందున וְ అనే సంధిని సందర్భానుసారంగా ‘అయితే’ అని అనువదించాం. עֶבֶדకు ఇక్కడ దేవునికి నమ్మకంగా లోబడినవాడు అనే భావంలో సహజమైన ‘సేవకుడు’ వాడాం.
- source_word: עֵקֶב
  choice: కాబట్టి
  rationale: కాలేబును దేశంలోకి తీసుకువస్తాననే దేవుని వాగ్దానానికి ముందు చెప్పిన లక్షణాలు కారణమని చూపేందుకు తెలుగులో సహజమైన కారణ-ఫలిత సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: అతనితో భిన్నమైన ఆత్మ ఉంది
  rationale: רוּחַ అనే పదంలోని ‘ఆత్మ/స్వభావం/మనోభావం’ అనే విస్తృత అర్థాన్ని కుదించకుండా, עִמּוֹలోని ‘అతనితో’ అనే సంబంధాన్ని సాధ్యమైనంత దగ్గరగా నిలిపాం.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: అతడు నన్ను సంపూర్ణంగా అనుసరించాడు
  rationale: ‘నా వెనుక నింపాడు’ అనే హీబ్రూ నుడికారాన్ని పదశః అనువదిస్తే తెలుగులో అస్పష్టంగా ఉంటుంది. దాని భావమైన సంపూర్ణమైన, హృదయపూర్వకమైన అనుసరణను స్పష్టంగా తెలిపాం.
- source_word: וַהֲבִיאֹתִיו
  choice: నేను అతణ్ణి తీసుకువస్తాను
  rationale: ప్రవచనాత్మక ప్రకటనలోని హీబ్రూ క్రియను భవిష్యత్తులో దేవుడు నెరవేర్చే వాగ్దానంగా సహజమైన తెలుగు భవిష్యత్ రూపంలో ఇచ్చాం.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: అతడు వెళ్లిన దేశంలోకి
  rationale: కాలేబు వేగువాడిగా వెళ్లిన దేశాన్ని సూచించే בוא ... שמה యొక్క కదలిక భావాన్ని ‘వెళ్లిన’ అని, אֶל యొక్క గమ్యాన్ని ‘దేశంలోకి’ అని తెలిపాం.
- source_word: וְזַרְעוֹ
  choice: అతని సంతానం
  rationale: זֶרַע ఇక్కడ సమష్టిగా వంశస్థులను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ‘సంతానం’ ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: יוֹרִשֶׁנָּה
  choice: దాన్ని స్వాధీనం చేసుకుంటుంది
  rationale: ירשׁకు భూమిని వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం అనే రెండు సమీప భావాలున్నాయి. దేశ వాగ్దాన సందర్భంలో క్రియాశీల స్వాధీన భావాన్ని ప్రధాన పాఠంలో ఉంచి, వారసత్వ భావాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: కాలేబుతో ఉన్న ‘భిన్నమైన ఆత్మ’ యొక్క గుర్తింపు
  choice: ‘భిన్నమైన ఆత్మ’ అని విస్తృతంగానే ఉంచడం
  alternative: ‘భిన్నమైన మనోభావం’ లేదా ప్రత్యేకంగా ‘దేవుని ఆత్మ’ అని పేర్కొనడం
  rationale: רוּחַ అనేది ఆత్మను, అంతరంగ స్వభావాన్ని లేదా మనోభావాన్ని సూచించవచ్చు. మూలపాఠం పరిశుద్ధాత్మనే అని స్పష్టంగా గుర్తించదు; అందువల్ల అనువాదం ఏ ఒక్క సిద్ధాంతార్థాన్నీ బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా రూపొందించాం. హీబ్రూ నుడికారాలను అవసరమైన చోట భావస్పష్టతతో అనువదిస్తూ, మూలంలోని ఆత్మ/మనోభావం మరియు స్వాధీనం/వారసత్వం అనే అర్థవిస్తృతిని పాదసూచికల్లో కాపాడాం.
