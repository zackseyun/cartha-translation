id: NUM.14.37
reference: Numbers 14:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: te
  text: ఆ దేశం గురించి చెడ్డ నివేదికను ప్రచారం చేసిన ఆ మనుషులు యాహ్వే సన్నిధిలో తెగులువల్ల చనిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: చనిపోయారు
  rationale: מות అనే క్రియ యొక్క ఖల్ వయ్యిక్టోల్ రూపం గత కథనంలోని మరణాన్ని నేరుగా తెలియజేస్తుంది. తెలుగు సహజ కథనశైలిలో ప్రారంభ సంధికారకాన్ని విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: నిర్దిష్ట బహువచనం సందర్భంలో ముందుగా ప్రస్తావించిన గూఢచారులను సూచిస్తుంది; ‘ఆ మనుషులు’ అనాఫరిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: ఆ దేశం గురించి చెడ్డ నివేదిక తెచ్చిన
  rationale: కృదంత నిర్మాణం వారిని వారి మునుపటి చర్య ద్వారా గుర్తిస్తుంది. דִבָּה ప్రతికూలమైన, అపకీర్తికరమైన నివేదికను సూచిస్తుంది; הוציא లోని ‘బయటకు తేవడం’ భావాన్ని ‘తెచ్చిన’ కొంతవరకు నిలుపుతుంది.
- source_word: רָעָה
  choice: చెడ్డ
  rationale: ఇది నివేదికను విశేషిస్తుంది; హానికరమైన ప్రతికూల స్వభావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמַּגֵּפָה
  choice: తెగులు వల్ల
  rationale: מַגֵּפָה ప్రాణాంతక తెగులు లేదా దైవిక దెబ్బను సూచించగలదు. בְּ ఇక్కడ సాధన లేదా కారణ భావంలో ఉండడంతో ‘వల్ల’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי దేవుని సమక్షాన్ని సూచిస్తుంది; ‘సన్నిధిలో’ ఆ గంభీరమైన ప్రత్యక్షత భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఒడంబడిక నామమైన చతురక్షరి నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది.
- issue: לִפְנֵי יְהוָה లోని తీర్పు మరియు సన్నిధి భావం
  choice: యాహ్వే సన్నిధిలో
  alternative: యాహ్వే ఎదుట
  rationale: ఈ పదబంధం సంఘటన దేవుని సమక్షంలో జరిగిందని చెబుతుంది; అది ఆయన ప్రత్యక్ష తీర్పును సూచించవచ్చుగాని, మూలపాఠం చెప్పినదానికంటే ఎక్కువ కారణార్థాన్ని జోడించకుండా సన్నిధి భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయినా వాక్యంలోని తీర్పు గంభీరతను నిలుపుతూ రూపొందించబడింది. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజ తెలుగు క్రమాన్ని వాడింది.
