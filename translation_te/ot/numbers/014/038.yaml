revisions:
- from: అయితే, దేశాన్ని వేగుచూడడానికి వెళ్లిన ఆ మనుషుల్లో నూను కుమారుడు యెహోషువ, యెఫున్నె కుమారుడు కాలేబు సజీవంగా మిగిలారు[a].
  to: అయితే, దేశాన్ని పరిశీలించడానికి వెళ్లిన ఆ మనుషులలో నూను కుమారుడైన యెహోషువ, యెఫున్నె కుమారుడైన కాలేబు సజీవంగా మిగిలారు[a].
  rationale: 'The revision retains every element of the Hebrew: the contextual contrast, both named survivors and their patronymics, their survival as exceptions within the specified group, and that group’s mission to survey the land. It replaces an archaic main-text expression with natural modern Telugu and preserves the more traditional/scouting nuances in the footnote.'
