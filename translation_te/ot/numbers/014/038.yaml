    text: లేదా, ‘దేశాన్ని వేగు చూడడానికి’ లేదా ‘దేశంపై నిఘా వేయడానికి.’
    reason: lexical_alternative
  revision_rationale: 'The revision retains every element of the Hebrew: the contextual contrast, both named survivors and their patronymics, their survival as exceptions within the specified group, and that group’s mission to survey the land. It replaces an archaic main-text expression with natural modern Telugu and preserves the more traditional/scouting nuances in the footnote.'
