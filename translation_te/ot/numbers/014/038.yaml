id: NUM.14.38
reference: Numbers 14:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/כָלֵ֖ב בֶּן יְפֻנֶּ֑ה חָיוּ֙ מִן הָ/אֲנָשִׁ֣ים הָ/הֵ֔ם הַֽ/הֹלְכִ֖ים לָ/ת֥וּר אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: te
  text: అయితే, దేశాన్ని పరిశీలించడానికి వెళ్లిన ఆ మనుషులలో నూను కుమారుడైన యెహోషువ, యెఫున్నె కుమారుడైన కాలేబు సజీవంగా మిగిలారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశాన్ని వేగు చూడడానికి’ లేదా ‘దేశంపై నిఘా వేయడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: అయితే, ... యెహోషువ
  rationale: ముందటి వచనంలో ఇతరులు మరణించిన దానికి ఉన్న వ్యత్యాసాన్ని וְ సూచిస్తున్నందున సహజమైన తెలుగులో ‘అయితే’ అని అనువదించాం; పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో ఉంచాం.
- source_word: בִּן נוּן
  choice: నూను కుమారుడు
  rationale: హీబ్రూ పుత్రసంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన ‘కుమారుడు’ రూపంతో నిలిపాం.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడు కాలేబు
  rationale: రెండవ వ్యక్తిని మొదటి వ్యక్తితో సమన్వయపరుస్తూ, తెలుగులో సహజమైన తండ్రిపేరు–కుమారుడు–వ్యక్తిపేరు క్రమాన్ని వాడాం.
- source_word: חָיוּ
  choice: సజీవంగా మిగిలారు
  rationale: ఇతరులు చనిపోగా వీరిద్దరు బతికి ఉన్నారనే సందర్భానుగత వ్యత్యాసాన్ని, కేవలం ‘జీవించారు’ కంటే స్పష్టంగా తెలియజేస్తుంది; ‘తప్పించుకున్నారు’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: ఆ మనుషుల్లో
  rationale: ఆ నిర్దిష్ట పురుషుల సమూహంలో వీరిద్దరే మినహాయింపుగా మిగిలారనే מִן భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַהֹלְכִים
  choice: వెళ్లిన
  rationale: వివరించబడుతున్న పురుషులు గతంలో చేసిన కార్యాన్ని తెలుగు సంబంధార్థక క్రియారూపంతో సహజంగా తెలిపాం.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: దేశాన్ని వేగుచూడడానికి
  rationale: తూర్ అనే పదం ఇక్కడ కనాను దేశాన్ని పరిశీలించే గూఢచర్య/నిఘా యాత్రను సూచిస్తుంది. ‘వేగుచూడు’ ఆ సందర్భాన్ని స్పష్టంగా అందిస్తుండగా, ‘పరిశీలించు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. ‘వేగుచూడడం’ బైబిలు సందర్భంలోని నిఘా భావాన్ని నిలుపుతుంది; అది తప్పనిసరిగా రహస్య గూఢచర్యంలోని ప్రతి సూక్ష్మభావాన్ని సూచించకపోవచ్చని ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
