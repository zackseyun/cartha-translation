revisions:
- from: 'అయితే మోషే యెహోవాతో ఇలా అన్నాడు: “అప్పుడు ఐగుప్తీయులు వింటారు[a]; ఎందుకంటే నీ శక్తితో నీవే ఈ ప్రజలను వారి మధ్యనుంచి పైకి తీసుకొచ్చావు.”'
  to: 'అయితే మోషే యాహ్వేతో ఇలా అన్నాడు: “అప్పుడు ఐగుప్తీయులు వింటారు[a]; ఎందుకంటే నీ శక్తితో ఈ ప్రజలను వారి మధ్యనుంచి పైకి తీసుకొచ్చావు.”'
