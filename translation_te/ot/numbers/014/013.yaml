id: NUM.14.13
reference: Numbers 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: te
  text: 'అయితే మోషే యాహ్వేతో ఇలా అన్నాడు: “అప్పుడు ఐగుప్తీయులు వింటారు[a]; ఎందుకంటే నీ శక్తితో ఈ ప్రజలను వారి మధ్యనుంచి పైకి తీసుకొచ్చావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తీయులు విన్నారు; ఎందుకంటే నీ శక్తితో ఈ ప్రజలను వారి మధ్యనుంచి పైకి తీసుకొచ్చావు.” హెబ్రీ క్రియారూపాన్ని గతార్థంగా గానీ, మోషే విన్నపంలో ముందుకు సంభవించే ఫలితంగా గానీ అర్థం చేసుకోవచ్చు. చుట్టుపక్కల వాదనకు సరిపోయే భవిష్యత్ భావాన్ని ప్రధాన పాఠంలో ఇచ్చాం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే మోషే ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందరి వచనంలో ప్రకటించిన తీర్పుకు మోషే ప్రతిస్పందిస్తున్న వ్యతిరేక సందర్భాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וְשָׁמְעוּ
  choice: అప్పుడు ... వింటారు
  rationale: 'ఈ సంపూర్ణ క్రియారూపాన్ని మోషే విన్నపంలోని భవిష్యత్ ఫలితంగా గ్రహించాం: ఇశ్రాయేలుపై తీర్పు జరిగితే ఐగుప్తీయులు దాని గురించి వింటారు. గతకాల భావం కూడా వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచాం.'
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: ఈ నామం దేశాన్నీ ప్రజలనూ సూచించగలదు; ‘వింటారు’ అనే బహువచన క్రియతో ఇక్కడ ప్రజలను సూచించడం సహజం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఐగుప్తీయులు వినడానికి సంబంధించిన వివరణ లేదా ఆధారాన్ని పరిచయం చేసే కారణార్థక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הֶעֱלִיתָ
  choice: పైకి తీసుకొచ్చావు
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే మూల చిత్రాన్ని కాపాడుతూ, ఐగుప్తు మధ్యనుంచి ప్రజలను నడిపించిన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְכֹחֲךָ
  choice: నీ శక్తితో
  rationale: ב ఉపసర్గ ఇక్కడ సాధనార్థాన్ని తెలియజేస్తుంది; ‘నీ శక్తితో’ దైవ బలాన్ని స్పష్టంగా నొక్కిచెబుతుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: ఏకవచన సమూహవాచకమైన עם మరియు సూచకపదం యొక్క భావాన్ని సహజమైన తెలుగు సమూహవాచక రూపంలో నిలుపుతుంది.
- source_word: מִקִּרְבּוֹ
  choice: వారి మధ్యనుంచి
  rationale: ఏకవచన ప్రత్యయం సమూహంగా భావించిన ఐగుప్తును సూచిస్తుంది; తెలుగులో ఐగుప్తీయులను ఉద్దేశించి ‘వారి మధ్యనుంచి’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సాధారణంగా గుర్తించదగిన లిప్యంతరీకరణను ఉపయోగించాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: וְשָׁמְעוּ క్రియ యొక్క కాలభావం
  choice: భవిష్యత్/ఫలితార్థం—‘వింటారు’
  alternative: గతార్థం—‘విన్నారు’
  rationale: తరువాతి వచనంలో కొనసాగే మోషే వాదనను బట్టి, ఇది యెహోవా చర్యకు కలిగే ఫలితాన్ని ముందుచూపుగా చెప్పడం సందర్భానికి బాగా సరిపోతుంది. అయినా హెబ్రీ రూపం గతార్థాన్నీ అనుమతిస్తుంది; అందుకే ఆ సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హెబ్రీ మూలంలోని కారణ సంబంధం, దైవ శక్తిపై నొక్కు, క్రియాకాల సందిగ్ధతను నిలిపాం.
