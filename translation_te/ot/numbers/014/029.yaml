language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: te
  text: మీ పూర్తి లెక్క ప్రకారం నమోదైన మీరందరి[b]—ఇరవై సంవత్సరాల వయసు నుండి అంతకంటే పైబడినవారైన, నాపై గొణిగిన[c] మీరందరి—మృతదేహాలు[a] ఈ అరణ్యంలో పడిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ శవాలు పడిపోతాయి.’ హీబ్రూ పదప్రయోగం అరణ్యంలో సంభవించే శారీరక మరణాన్ని స్పష్టంగా, తీవ్రంగా చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నమోదైన’ అనేది జనగణనలో లేదా సైనిక లెక్కలో చేర్చబడినవారిని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘నాపై సణిగిన.’ ఇక్కడి హీబ్రూ క్రియ అసంతృప్తితో గొణగడం లేదా సణగడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: ఈ అరణ్యంలో
  rationale: מִדְבָּר అనేది జనావాసం లేని అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. సంఖ్యాకాండంలోని భౌగోళిక, కథన సందర్భానికి ‘అరణ్యం’ సహజంగా సరిపోతుంది.
- source_word: יִפְּלוּ
  choice: పడిపోతాయి
  rationale: נפל యొక్క ప్రత్యక్ష అర్థమైన ‘పడిపోవడం’ను నిలుపుతూ, దానికి కర్తగా ఉన్న ‘మృతదేహాలు’తో కలిసి మరణతీర్పు యొక్క స్పష్టమైన హీబ్రూ చిత్రాన్ని కాపాడుతుంది.
- source_word: פִגְרֵיכֶם
  choice: మీ మృతదేహాలు
  rationale: פגר అంటే శవం లేదా మృతదేహం. ‘మృతదేహాలు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉండడంతో పాటు తీర్పు యొక్క భౌతిక తీవ్రతను తగ్గించదు.
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: మీ పూర్తి లెక్క ప్రకారం నమోదైన మీరందరి
  rationale: פְּקֻדִים జనగణనలో లేదా సైనిక లెక్కలో నమోదైనవారిని సూచిస్తుంది; לְכָל מִסְפַּרְכֶם ఆ లెక్కలోని సంపూర్ణతను బలపరుస్తుంది. తెలుగు వాక్య నిర్మాణం సహజంగా ఉండేందుకు సంబంధాన్ని షష్ఠీ రూపంలో వ్యక్తం చేశాం.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే పైబడినవారు
  rationale: జనగణన సందర్భంలోని వయోపరిమితి సూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: నాకు విరోధంగా సణిగిన
  rationale: לון యొక్క ఈ రూపం అసంతృప్తితో గొణగడం లేదా సణగడాన్ని సూచిస్తుంది. ‘సణిగిన’ తిరుగుబాటు ధోరణిగల ఫిర్యాదును సహజంగా తెలియజేస్తుంది; עָלָי లోని ప్రతికూల దిశను ‘నాకు విరోధంగా’ నిలుపుతుంది.
theological_decisions:
- issue: తీర్పును శారీరక మరణంగా తెలిపే స్పష్టమైన రూపకం
  choice: ‘మృతదేహాలు ... పడిపోతాయి’ అనే స్పష్టమైన హీబ్రూ చిత్రాన్ని నిలుపడం
  alternative: ‘మీరు ఈ అరణ్యంలో చనిపోతారు’ అని భావానువాదం చేయడం
  rationale: మూలపాఠం కేవలం మరణాన్ని తెలియజేయకుండా, అరణ్యంలో పడిపోయే మృతదేహాలను ముందుకు తెస్తుంది. ఆ కఠినమైన తీర్పు చిత్రాన్ని మృదువుగా మార్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. మూలంలోని ప్రధాన తీర్పు చిత్రాన్ని వాక్యాంతంలో ఉంచి తెలుగు వాక్య నిర్మాణాన్ని సహజం చేశాం. డాష్‌ల మధ్యనున్న భాగం తీర్పుకు గురయ్యే సమూహాన్ని స్పష్టంగా నిర్వచిస్తుంది.
