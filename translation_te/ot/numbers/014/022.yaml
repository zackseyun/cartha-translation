  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: te
  text: ఎందుకంటే, నా మహిమను, ఐగుప్తులోను అరణ్యంలోను నేను చేసిన నా సూచకాలను చూసి, నన్ను ఈ పది సార్లు పరీక్షించి, నా మాట వినని[a] పురుషులందరూ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు విధేయత చూపని.” “నా మాట వినడం” అనే హీబ్రూ నుడికారం ఆయన మాటకు లోబడడం అనే భావాన్నీ కలిగివుంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి దైవిక ప్రమాణం/తీర్పుకు కారణాన్ని పరిచయం చేసే సందర్భోచిత సంబంధాన్ని తెలుపుతుంది.
- source_word: כָל הָאֲנָשִׁים
  choice: పురుషులందరూ
  rationale: ఈ కథన సందర్భంలో తీర్పుకు లోబడిన తరంలోని వయోజన పురుషులను సూచించే లింగనిర్దిష్ట పదబంధాన్ని నిలుపుతుంది.
- source_word: הָרֹאִים
  choice: చూసిన
  rationale: గతంలో ప్రత్యక్షంగా అనుభవించిన విషయాన్ని వర్ణించే హీబ్రూ కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּבֹדִי
  choice: నా మహిమను
  rationale: దేవుని ప్రత్యక్షమైన వైభవాన్ని సూచించే ప్రామాణికమైన, సందర్భోచిత పదం.
- source_word: אֹתֹתַי
  choice: నా సూచకక్రియలను
  rationale: అవి కేవలం అద్భుతాలు మాత్రమే కాక, దేవుని కార్యానికి సాక్ష్యంగా నిలిచే సూచనలు అనే אוֹת భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: నేను చేసిన
  rationale: עשה అనే సాధారణ క్రియను అదనపు వివరణ లేకుండా సహజంగా అందిస్తుంది.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: ఐగుప్తులోను అరణ్యంలోను
  rationale: నిర్గమకాండ కథనంలోని భౌగోళిక, ధార్మిక సందర్భాన్ని సంప్రదాయబద్ధంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: וַיְנַסּוּ אֹתִי
  choice: నన్ను పరీక్షించి
  rationale: נסה యొక్క ‘పరీక్షించు/పరీక్షకు గురిచేయు’ భావాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: ఈ పది సార్లు
  rationale: זֶה లోని నిర్దేశక బలాన్ని ‘ఈ’ ద్వారా నిలుపుతుంది.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: నా మాట వినలేదు
  rationale: హీబ్రూ ‘నా స్వరాన్ని విను’ నుడికారాన్ని సహజ తెలుగులో ఉంచుతూ, దాని ‘లెక్కచేయు/విధేయత చూపు’ భావాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
theological_decisions:
- issue: దేవుని ప్రథమపురుష స్వీయసూచన
  choice: ‘నా మహిమను,’ ‘నా సూచకక్రియలను,’ ‘నా మాట’ అని ప్రత్యక్ష దైవిక వాక్యాన్ని నిలుపడం
  alternative: వివరణాత్మకంగా దేవుని మహిమ లేదా అధికారాన్ని విస్తరించడం
  rationale: మూలపాఠం దేవుని ప్రత్యక్ష వాక్యంగా ఉంది; అందులో లేని సిద్ధాంతపరమైన వివరణను చేర్చకుండా దాని గంభీరతను నిలుపుతుంది.
- issue: הָאֲנָשִׁים యొక్క లింగ సూచన
  choice: పురుషులందరూ
  alternative: ప్రజలందరూ
  rationale: హీబ్రూ పదం మరియు కథన సందర్భం పురుషులను ప్రత్యేకంగా సూచిస్తున్నందున లింగనిర్దిష్టతను సమతలీకరించకుండా కాపాడుతుంది.
- issue: שׁמע בקול లో వినడం మరియు విధేయత మధ్య భావ ఉద్రిక్తత
  choice: ముఖ్యపాఠంలో ‘నా మాట వినలేదు’
  alternative: ‘నాకు విధేయత చూపలేదు’
  rationale: మూల నుడికారానికి దగ్గరగా ఉండి, దానిలో అంతర్లీనమైన విధేయత భావాన్ని పాదటిప్పణి ద్వారా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దైవిక ప్రకటన శైలిని ఉపయోగించాం. వాక్యం తరువాతి వచనంలో పూర్తయ్యే నిర్మాణం కావడంతో చివర దీర్ఘ విరామచిహ్నాన్ని ఉంచాం.
