- from: ఎందుకంటే, నా మహిమను, ఐగుప్తులోను అరణ్యంలోను నేను చేసిన నా సూచకక్రియలను చూసిన పురుషులందరూ—నన్ను ఈ పది సార్లు పరీక్షించి, నా మాట వినలేదు[a]—
