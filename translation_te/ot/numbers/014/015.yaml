  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: te
  text: 'నీవు ఈ ప్రజలందరినీ ఒక్క మనిషిలా చంపివేస్తే[a], నీ గురించి విన్న జాతులు ఇలా అంటారు[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఒక్క మనిషిలా’; అంటే ఈ ప్రజలందరినీ ఒకే సమష్టిగా లేదా ఒక్కసారిగా చంపడం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ కీర్తి గురించి విన్న జాతులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: నీవు ... చంపితే
  rationale: מות హిఫీల్ రూపానికి ‘చంపు/చనిపోయేలా చేయు’ అనే భావం ఉంది. వావ్ మాత్రమే ఉన్నప్పటికీ, ముందరి వాక్యంతో కొనసాగుతున్న మోషే వాదనలోని షరతు భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘చంపితే’ అని అనువదించాం.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలందరినీ
  rationale: עָם ఇక్కడ ఇశ్రాయేలీయులను సమష్టిగా సూచిస్తుంది. ‘ఈ ప్రజలు’ అనే నిర్దేశక భావాన్ని నిలిపి, כְּאִישׁ אֶחָד సూచించే సంపూర్ణతను సహజ తెలుగులో ‘అందరినీ’ ద్వారా స్పష్టం చేశాం.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒక్క మనిషిని చంపినట్లు
  rationale: అక్షరార్థంగా ‘ఒక్క మనిషిలా’ అనే ఈ జాతీయం ప్రజలందరికీ ఒకే గతి కలగడాన్ని, వారిని సమష్టిగా నిర్మూలించడాన్ని సూచిస్తుంది. మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: גּוֹיִם ఇక్కడ ఇశ్రాయేలుకు వెలుపల ఉన్న ఇతర జనసమూహాలను సూచిస్తుంది. ఆధునిక తెలుగు పాత నిబంధన సందర్భంలో ‘జనాలు’ సహజమైనదీ, తరువాతి కాలపు ‘అన్యజనులు’ అనే ప్రత్యేక అనుబంధాన్ని నివారించేదీ.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: నీ గురించిన వార్త విన్న
  rationale: שֵׁמַע కు ‘వార్త, నివేదిక, కీర్తి’ అనే భావాలు సాధ్యం. ‘నీ గురించిన వార్త’ అనేది పదబంధంలోని నిజమైన సందిగ్ధతను బలవంతంగా ‘కీర్తి’గా నిర్ధారించకుండా, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అంటారు:'
  rationale: ఈ క్రియారూపం తరువాతి వచనంలో వచ్చే జనాల మాటలను పరిచయం చేస్తుంది. తెలుగులో భవిష్యత్ భావంతో ‘ఇలా అంటారు:’ అని ఇవ్వడం సహజం; ద్విబిందువు తరువాతి ప్రత్యక్ష వాక్యాన్ని సూచిస్తుంది.
theological_decisions:
- issue: పుంలింగ ఏకవచనంతో ఉన్న మానవసంబంధ జాతీయాన్ని అనువదించడం
  choice: ఒక్క మనిషిని చంపినట్లు
  alternative: ఒక్కసారిగా అందరినీ
  rationale: אִישׁ אֶחָד అక్షరార్థ రూపాన్ని నిలిపితే మూలంలోని బలమైన సమష్టి చిత్రణ కనిపిస్తుంది. ఇది పురుషులకే పరిమితమైన ప్రకటన కాదు; ప్రజలందరినీ ఒకే వ్యక్తిగా పరిగణించి ఒకే గతికి గురిచేయడాన్ని తెలిపే జాతీయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. దేవునికి సందర్భానుకూల ఏకవచన సంబోధన ‘నీవు/నీ’ వాడాం. వాక్యం తరువాతి వచనంలోని ఉల్లేఖనానికి దారితీసేలా ద్విబిందువుతో ముగుస్తుంది.
