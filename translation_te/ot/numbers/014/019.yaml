revisions:
- from: నీ అపారమైన నిబద్ధ ప్రేమను బట్టి, నీవు ఐగుప్తు నుండి ఇప్పటివరకు ఈ ప్రజలను మోస్తూ వచ్చినట్లే[a], ఈ ప్రజల దోషాన్ని దయచేసి క్షమించు.
  to: నీ గొప్ప నిబద్ధ ప్రేమను బట్టి, నీవు ఐగుప్తు నుండి ఇప్పటివరకు ఈ ప్రజలను భరిస్తూ వచ్చినట్లే[a], ఈ ప్రజల దోషాన్ని దయచేసి క్షమించు.
  rationale: The revision retains the source order of thought and the draft's stated handling of the lexical ambiguity, while making the principal rendering of נָשָׂאתָה idiomatic Telugu and less liable to be read as literal carrying. The footnote continues to preserve the viable 'forgive' reading without resolving the ambiguity doctrinally.
