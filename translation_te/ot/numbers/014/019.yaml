source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: te
  text: నీ గొప్ప నిబద్ధ ప్రేమను బట్టి, నీవు ఐగుప్తు నుండి ఇప్పటివరకు ఈ ప్రజలను భరిస్తూ వచ్చినట్లే[a], ఈ ప్రజల దోషాన్ని దయచేసి క్షమించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఐగుప్తు నుండి ఇప్పటివరకు ఈ ప్రజలను క్షమిస్తూ వచ్చినట్లే.” ఇక్కడి హీబ్రూ క్రియకు “మోయడం” లేదా “భరించడం” అనే అర్థం ఉంది; కొన్ని సందర్భాల్లో అది “క్షమించడం” అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: దయచేసి క్షమించు
  rationale: సלח ఆజ్ఞారూపానికి నָא కలవడం గాఢమైన విన్నపాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దయచేసి క్షమించు’ ఆ విన్నప స్వరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲוֺן
  choice: దోషాన్ని
  rationale: עָוֹן అపరాధం, దోషం, దోషభారం అనే సంబంధిత భావాలను కలిగి ఉంది. ఇక్కడ క్షమాపణకు గురయ్యే ప్రజల నైతిక అపరాధాన్ని ‘దోషం’ స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలను / ఈ ప్రజల
  rationale: עַם ఏకవచన సమూహవాచకం. తెలుగులో ‘ఈ ప్రజలు’ సహజంగా ఉండి, ఇశ్రాయేలు సమాజాన్ని సమూహంగా సూచిస్తుంది.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: నీ అపారమైన నిబద్ధ ప్రేమను బట్టి
  rationale: גֹּדֶל ప్రేమ యొక్క గొప్పతనాన్ని, חֶסֶד స్థిరమైన విశ్వసనీయతతో కూడిన ప్రేమను సూచిస్తాయి. ‘అపారమైన నిబద్ధ ప్రేమ’ ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְכַאֲשֶׁר
  choice: వచ్చినట్లే
  rationale: ఈ పదం దేవుని గత చర్యను ప్రస్తుత విన్నపానికి పోలికగా చూపిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘వచ్చినట్లే’ ఆ పోలికను సహజంగా తెలియజేస్తుంది.
- source_word: נָשָׂאתָה
  choice: మోస్తూ వచ్చిన
  rationale: נשא యొక్క ప్రాథమిక భావం మోయడం లేదా భరించడం; పాపసంబంధ సందర్భాల్లో క్షమించడం అనే భావం కూడా కలుగుతుంది. ఇక్కడ ప్రత్యక్ష కర్మ ప్రజలే కావడంతో, ‘మోస్తూ వచ్చిన’ దేవుడు వారిని సహనంతో భరించి నడిపించిన రూపకాన్ని కాపాడుతుంది.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: ఐగుప్తు నుండి ఇప్పటివరకు
  rationale: ఈ పదబంధం ఐగుప్తు నుండి ప్రస్తుత సమయం/స్థలం వరకు కొనసాగిన చర్యను సూచిస్తుంది. సందర్భంలో ‘ఇప్పటివరకు’ సహజంగా ఆ కొనసాగింపును వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషే విన్నపంలో נָשָׂאתָה భావం
  choice: దేవుడు ప్రజలను మోస్తూ వచ్చాడని, అంటే వారిని సహనంతో భరించి నడిపించాడని చెప్పడం
  alternative: దేవుడు ఈ ప్రజలను ఇప్పటివరకు క్షమిస్తూ వచ్చాడని చెప్పడం
  rationale: ప్రత్యక్ష కర్మ ‘ఈ ప్రజలు’; ‘వారి దోషం’ కాదు. అందువల్ల మోయడం/భరించడం అనే విస్తృత రూపక భావం వాక్య నిర్మాణానికి బాగా సరిపోతుంది. అయినప్పటికీ పాపసందర్భంలో ‘క్షమించడం’ అనే భావం సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా స్వరం ఉపయోగించబడింది. మూలంలోని ఒకే వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో సహజంగా చదవడానికి ఉపవాక్యాల క్రమాన్ని మార్చాం. ‘మోస్తూ వచ్చిన’ అనే రూపకం ప్రధాన పాఠ్యంలో నిలిపి, ‘క్షమిస్తూ వచ్చిన’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
