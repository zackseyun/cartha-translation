  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను ఇశ్రాయేలు కుమారుల సమాజపు మొత్తం సభ ఎదుట ముఖాలు నేలకు ఆనించి పడిపోయారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతతి.’ హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: ‘సమాజపు మొత్తం సభ’ అనే హీబ్రూ వ్యక్తీకరణ ఉద్ఘాటన కోసం పరస్పర సంబంధమున్న రెండు సామూహిక పదాలను ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: సాష్టాంగపడ్డారు
  rationale: נפל అనే క్రియకు ప్రాథమికంగా ‘పడడం’ అనే అర్థం ఉంది; עַל־פְּנֵיהֶםతో కలిసినప్పుడు ముఖం నేలకు ఆనేటట్లు పడడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘సాష్టాంగపడ్డారు’ ఆ భంగిమను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עַל־פְּנֵיהֶם
  choice: సాష్టాంగపడ్డారు
  rationale: అక్షరార్థంగా ‘తమ ముఖాల మీద’; ఇది వినయం, విన్నపం లేదా తీవ్ర స్పందనను వ్యక్తం చేసే హీబ్రూ నుడికారం. తెలుగులో క్రియతో సమగ్రంగా అనువదించబడింది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: సమస్త సమాజం సమక్షంలో బహిరంగంగా జరిగిన చర్యను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: כָּל
  choice: అంతటి
  rationale: సామూహిక నామవాచకంతో కలిసి సంపూర్ణతను సూచిస్తుంది; ‘సభ అంతటి ఎదుట’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: קְהַל
  choice: సభ
  rationale: సమకూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. עֲדַתతో ఉన్న ద్వంద్వ సామూహిక వ్యక్తీకరణను చెరపకుండా ప్రత్యేక పదంగా ఉంచబడింది.
- source_word: עֲדַת
  choice: సమాజం
  rationale: వ్యవస్థీకృతమైన జనసముదాయాన్ని సూచిస్తుంది. קְהַל‌తో కలిపి ‘సమాజపు సభ’గా మూలంలోని సంబంధిత రెండు సామూహిక పదాలను నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థ సమీపమైన రూపం; జాతిపరమైన సమూహాన్ని సూచించే సంప్రదాయ బైబిలు వ్యక్తీకరణను నిలుపుతుంది.
theological_decisions:
- issue: קְהַל עֲדַת అనే రెండు సామూహిక పదాలను ఒకే పదంగా సరళీకరించాలా
  choice: ‘సమాజపు సభ’గా రెండు పదాలనూ నిలుపడం
  alternative: ‘సమాజమంతటి ఎదుట’ లేదా ‘సభ అంతటి ఎదుట’
  rationale: మూలపాఠం రెండు సంబంధిత సామూహిక నామాలను ఉద్దేశపూర్వకంగా కలిపింది. వాటిని నిలుపడం దృశ్యంలోని బహిరంగతను, గంభీరతను కాపాడుతుంది; ఒకే పదంగా మార్చడం మూలంలోని ఉద్ఘాటనను తగ్గించవచ్చు.
- issue: בְּנֵי יִשְׂרָאֵלను లింగతటస్థంగా అనువదించాలా
  choice: ‘ఇశ్రాయేలు కుమారులు’
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతతి’
  rationale: మూలంలో ఉన్న ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించగల జాతీయ సమూహపదమని పాదటిప్పణిలో స్పష్టం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ప్రజలకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘సాష్టాంగపడ్డారు’ మూలంలోని ‘తమ ముఖాల మీద పడ్డారు’ అనే భంగిమను సహజంగా అందిస్తుంది. ‘సమాజపు సభ’ కొద్దిగా అధికారికంగా వినిపించినా, మూలంలోని ద్వంద్వ సామూహిక పదబంధాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
