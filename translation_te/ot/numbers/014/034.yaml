  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: te
  text: మీరు ఆ దేశాన్ని గూఢచారులుగా పరిశీలించిన రోజుల సంఖ్య ప్రకారం—నలభై రోజులు—ఒక్కో రోజుకు ఒక సంవత్సరం చొప్పున, ఒక్కో రోజుకు ఒక సంవత్సరం చొప్పున, నలభై సంవత్సరాలు మీరు మీ దోషాలను భరిస్తారు; అప్పుడు నా వ్యతిరేకతను[a] తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ఎడబాటును,’ ‘నా విరోధాన్ని,’ లేదా ‘నా అసంతృప్తిని.’ కొన్ని సంప్రదాయ అనువాదాల్లో ‘నా వాగ్దానభంగాన్ని’ అనే భావం కనిపిస్తుంది; అయితే అరుదైన ఈ హీబ్రూ పదం దేవుని వైఫల్యాన్ని కాకుండా, తిరుగుబాటు చేసిన ఈ తరం పట్ల ఆయన వ్యతిరేకతను లేదా వారి నుండి ఆయన దూరమవడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: రోజుల సంఖ్య ప్రకారం
  rationale: ב + מִסְפָּר సూచించే అనురూపతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; పరిశీలన కాలానికీ శిక్షాకాలానికీ ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: תַּרְתֶּם
  choice: గూఢచారులుగా పరిశీలించిన
  rationale: ఈ సందర్భంలో תור కనాను దేశంలో చేసిన గూఢచారి పరిశీలనను సూచిస్తుంది. ‘పరిశీలించిన’ అనే సహజ పదంతో పాటు ‘గూఢచారులుగా’ అని చేర్చడం ఆ ప్రత్యేక సందర్భాన్ని కాపాడుతుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశాన్ని
  rationale: సందర్భంలో ఇది ఇశ్రాయేలీయులు పరిశీలించిన వాగ్దాన దేశాన్ని సూచిస్తుంది. ‘ఆ దేశం’ సందర్భ నిర్దిష్టతను సహజంగా తెలియజేస్తుంది.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: సంవత్సరానికి ఒక రోజు చొప్పున, సంవత్సరానికి ఒక రోజు చొప్పున
  rationale: హీబ్రూలోని ఉద్దేశపూర్వక పునరుక్తిని నిలిపి, నలభై రోజులకు నలభై సంవత్సరాల అనురూపతను స్పష్టం చేస్తుంది.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: మీ దోషాలను భరిస్తారు
  rationale: נשא עון అనే బరువైన నుడికారంలో దోషాన్నీ దాని పర్యవసానాలనూ భరించడం రెండూ అంతర్లీనంగా ఉన్నాయి. ‘దోషాలను భరిస్తారు’ ఆ భావవిస్తృతిని అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: וִידַעְתֶּם
  choice: అప్పుడు ... తెలుసుకుంటారు
  rationale: ידע జ్ఞానంతో పాటు అనుభవపూర్వకంగా తెలుసుకోవడాన్నీ సూచించగలదు. ‘తెలుసుకుంటారు’ ఈ రెండు అవకాశాలనూ తెరిచి ఉంచుతుంది; ‘అప్పుడు’ వాక్యంలోని ఫలిత సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: תְּנוּאָתִי
  choice: నా వ్యతిరేకతను
  rationale: అరుదైన ఈ నామవాచకం వ్యతిరేకత, ఎడబాటు లేదా అసంతృప్తిని సూచించవచ్చు. తిరుగుబాటు చేసిన తరానికి దేవుని న్యాయపూర్వక వైఖరిని ‘వ్యతిరేకత’ స్పష్టంగా వ్యక్తం చేస్తుంది; దేవుడు తన వాగ్దానాన్ని తప్పాడనే భావాన్ని కలిగించదు.
theological_decisions:
- issue: תְּנוּאָתִי అనే అరుదైన, దైవిక వైఖరిని సూచించే పదం
  choice: నా వ్యతిరేకతను
  alternative: నా ఎడబాటును; నా విరోధాన్ని; నా అసంతృప్తిని; నేను వాగ్దానం తప్పడాన్ని
  rationale: మూలపదం దేవుని వాగ్దాన వైఫల్యాన్ని తప్పనిసరిగా సూచించదు; తిరుగుబాటు చేసిన తరంపట్ల ఆయనకు ఏర్పడిన వ్యతిరేక లేదా దూరమైన వైఖరిని సూచించే అవకాశం ఎక్కువ. ‘వ్యతిరేకత’ తీర్పు తీవ్రతను నిలుపుతూ, మూలంలో లేని దైవ అవిశ్వసనీయత భావాన్ని చొప్పించదు. ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే తీర్పు ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ‘సంవత్సరానికి ఒక రోజు’ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. అరుదైన తుదిపదంలోని భావసందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
