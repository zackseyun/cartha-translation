  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: te
  text: “యెహోవా వారికి ఇస్తానని ప్రమాణం చేసిన దేశంలోకి ఈ ప్రజలను తీసుకురాలేకపోయాడు కాబట్టి, వారిని అరణ్యంలో వధించాడు” అని వారు అంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాకు ఈ ప్రజలను తాను వారికి ప్రమాణం చేసిన దేశంలోకి తీసుకురాగల శక్తి లేకపోవడం వల్ల, వారిని అరణ్యంలో వధించాడు.”
    reason: మִבִּלְתִּי יְכֹלֶת ను ‘తీసుకురాలేకపోయాడు కాబట్టి’ అనే వాక్యరూపంలోనూ, ‘శక్తి లేకపోవడం వల్ల’ అనే నామవాచక రూపంలోనూ అనువదించవచ్చు. ప్రత్యామ్నాయం హెబ్రీయులో ప్రమాణపు అంతర్నిహిత కర్మాన్ని స్పష్టంగా జోడించకుండా ఉంచుతుంది.
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: తీసుకురాలేకపోయాడు కాబట్టి
  rationale: ఈ నిర్మాణం అసమర్థతను కారణంగా చూపే ఇతర జనాల ఆరోపణను వ్యక్తం చేస్తుంది. తెలుగులో ‘రాలేకపోయాడు కాబట్టి’ సహజంగా ఉండి మూలంలోని కారణార్థక సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించింది.
- source_word: לְהָבִיא
  choice: దేశంలోకి ... తీసుకురా-
  rationale: בוא యొక్క హిఫీల్ రూపం ప్రవేశింపజేయడం లేదా లోపలికి తీసుకురావడం అనే భావాన్ని ఇస్తుంది; గమ్యస్థానంతో కలిపి ఈ తెలుగు ప్రయోగం సహజంగా ఉంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: עָם సమూహవాచక ఏకవచనమైనప్పటికీ, ఆధునిక తెలుగులో ‘ఈ ప్రజలు’ సహజమైన సమానార్థకం.
- source_word: אֶל הָאָרֶץ
  choice: దేశంలోకి
  rationale: ‘తీసుకురావడం’తో కలిసి אֶל ప్రవేశ గమ్యాన్ని సూచిస్తుంది; ‘దేశంలోకి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: తాను వారికి ప్రమాణం చేసిన
  rationale: మూలంలో ‘ఇస్తానని’ అనే క్రియ స్పష్టంగా లేదు. అందువల్ల అస్పష్టతను నిలుపుతూ, దేశాన్ని సంబంధపరిచే ఉపవాక్యంగా నేరుగా అనువదించింది.
- source_word: וַיִּשְׁחָטֵם
  choice: వారిని ... వధించాడు
  rationale: שׁחט సాధారణ ‘చంపడం’కన్నా తీవ్రమైన వధ లేదా సంహార భావాన్ని కలిగి ఉంది; ‘వధించాడు’ గంభీరంగా, సహజంగా ఆ తీవ్రతను నిలుపుతుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: పంచగ్రంథ సందర్భంలో מִדְבָּרకు ‘అరణ్యం’ ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: యెహోవా సామర్థ్యంపై ఇతర జనాలు చేసే ఆరోపణ
  choice: యెహోవా ... తీసుకురాలేకపోయాడు
  alternative: యెహోవాకు ... తీసుకురాగల శక్తి లేకపోవడం వల్ల
  rationale: సందర్భంలో ఇది దేవుని నిజమైన పరిమితిని బోధించే వాక్యం కాదు; ఇతర జనాలు పలుకుతారని మోషే ఊహించిన ఆరోపణ. అయినా మూలంలోని ధార్మిక ఉద్రిక్తతను మృదువుచేయకుండా ఆరోపణను యథాతథంగా ఉంచింది.
- issue: ప్రమాణంలోని అంతర్నిహిత భావం
  choice: తాను వారికి ప్రమాణం చేసిన దేశం
  alternative: వారికి ఇస్తానని ప్రమాణం చేసిన దేశం
  rationale: ‘ఇవ్వడం’ సందర్భం ద్వారా అర్థమైనా, హీబ్రూ వాక్యంలో అది స్పష్టంగా లేదు. ప్రధాన పాఠంలో మూలంలోని సంక్షిప్తతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యంలోని గంభీరత మరియు ఆరోపణ తీవ్రత నిలిచేలా రూపొందించబడింది. 14:15తో వాక్య సంబంధాన్ని తెలుగులో పూర్తిచేయడానికి ‘అని అంటారు’ చేర్చబడింది.
