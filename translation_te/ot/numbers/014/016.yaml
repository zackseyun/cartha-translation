- from: “యెహోవా తాను వారికి ప్రమాణం చేసిన దేశంలోకి ఈ ప్రజలను తీసుకురాలేకపోయాడు కాబట్టి, వారిని అరణ్యంలో వధించాడు” అని అంటారు.[a]
  to: “యెహోవా వారికి ఇస్తానని ప్రమాణం చేసిన దేశంలోకి ఈ ప్రజలను తీసుకురాలేకపోయాడు కాబట్టి, వారిని అరణ్యంలో వధించాడు” అని వారు అంటారు.[a]
  rationale: The revision resolves the unnatural and potentially misleading Telugu construction for the land sworn to the people by supplying the contextually implicit ‘to give.’ The footnote now preserves both the Hebrew’s more compact oath expression and the principal lexical alternative for the causal phrase. The verse’s rhetorical, accusatory force remains intact.
