id: NUM.14.42
reference: Numbers 14:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: te
  text: పైకి వెళ్లకండి[a], ఎందుకంటే యాహ్వే మీ మధ్య లేడు; లేకపోతే మీ శత్రువుల ఎదుట మీరు దెబ్బతింటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పైకి వెళ్లడం’ అనే భావం ఇక్కడ కొండప్రాంతం వైపు వెళ్లడాన్నిగానీ, యుద్ధానికి దండెత్తి వెళ్లడాన్నిగానీ సూచించవచ్చు.
    reason: contextual_ambiguity
  - marker: b
    text: లేదా, ‘మీరు ఓడిపోతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: పైకి వెళ్లకండి
  rationale: אַל తో కూడిన క్రియ నిషేధాన్ని తెలియజేస్తుంది. עלה యొక్క ప్రాథమిక అర్థమైన ‘పైకి వెళ్లడం’ను నిలుపుతూ, సందర్భంలోని సైనిక ముందడుగును కూడా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: כִּי אֵין יְהוָה בְּקִרְבְּכֶם
  choice: ఎందుకంటే యాహ్వే మీ మధ్య లేడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; בְּקֶרֶב సమాజం మధ్యలో ఉండే సన్నిధిని సూచిస్తుంది. దైవనామం יְהוָהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: లేకపోతే ... మీరు దెబ్బతింటారు
  rationale: పదశః ‘మరియు మీరు దెబ్బతినకండి/దెబ్బతినరు’ అనే నిర్మాణం ఈ హెచ్చరికలో తప్పించుకోవలసిన ప్రతికూల పరిణామాన్ని సూచిస్తుంది. ‘లేకపోతే’ ఆధునిక తెలుగులో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; נגף యొక్క ‘దెబ్బతినడం/యుద్ధంలో ఓడిపోవడం’ అనే విస్తృతిని ‘దెబ్బతింటారు’ నిలుపుతుంది.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: మీ శత్రువుల ఎదుట
  rationale: యుద్ధ సందర్భంలో לִפְנֵיకి ‘ఎదుట’, אֹיְבֵיכֶםకు ‘మీ శత్రువులు’ సహజమైన, అర్థనిష్ఠమైన అనువాదాలు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ‘Yahweh’ ఉచ్చారణకు సమీపంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- issue: בְּקִרְבְּכֶםలో దైవసన్నిధి భావం
  choice: మీ మధ్య లేడు
  alternative: మీతో లేడు
  rationale: ‘మీ మధ్య’ అనేది సమాజం నడుమ సన్నిధి అనే స్థానిక-సామూహిక భావాన్ని నిలుపుతుంది; దానికంటే విస్తృతమైన సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చదు.
- issue: וְלֹא תִּנָּגְפוּ యొక్క హెచ్చరిక సంబంధం
  choice: లేకపోతే ... దెబ్బతింటారు
  alternative: మీరు ... ఓడిపోకుండా
  rationale: హెబ్రీ నిర్మాణం ప్రతికూల పరిణామం లేదా దాన్ని తప్పించాలనే ఉద్దేశం రెండింటి ఛాయను అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన హెచ్చరికగా ఇచ్చి, యుద్ధపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడాం. వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచుతూ, ‘పైకి వెళ్లడం’లోని భౌగోళిక/సైనిక ద్వంద్వ ఛాయను మరియు נגףలోని ‘దెబ్బతినడం/ఓడిపోవడం’ భావవిస్తృతిని పాదసూచికల ద్వారా నిలిపాం.
