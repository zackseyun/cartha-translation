id: NUM.14.44
reference: Numbers 14:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: te
  text: అయితే వారు కొండ శిఖరానికి ఎక్కడానికి దుస్సాహసపడ్డారు[a]. కానీ యాహ్వే నిబంధన మందసమూ మోషే కూడా శిబిరం మధ్య నుండి కదలలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు దుస్సాహసంగా ప్రవర్తిస్తూ ఎక్కారు,” లేదా “వారు ధిక్కారంగా ఎక్కారు.” హీబ్రూ క్రియ ఉద్దేశపూర్వకమైన, దుస్సాహసపూరితమైన చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యాహ్వే నిబంధన మందసం”; మరో విధంగా, “యాహ్వే యొక్క నిబంధన మందసం.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: వారు తెగించి
  rationale: హిత్పయేల్ రూపంలోని ఈ క్రియ ఉద్దేశపూర్వకమైన, దుస్సాహసపూరితమైన చర్యను సూచిస్తుంది. ‘తెగించి’ అనేది వారి ఎక్కే ప్రయత్నంలోని అవిధేయతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲלוֹת
  choice: ఎక్కారు
  rationale: עלה ఇక్కడ పైకి వెళ్లడాన్ని సూచిస్తుంది; కొండ సందర్భంలో ‘ఎక్కారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אֶל רֹאשׁ הָהָר
  choice: కొండ శిఖరానికి
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’ అయినా ఇక్కడ ‘పైభాగం/శిఖరం’ అనే నానుడి అర్థంలో ఉంది; הָהָר ను సందర్భానుసారం ‘కొండ’గా అనువదించాం.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ సమాసబంధాన్ని సహజమైన తెలుగులో ‘యాహ్వే నిబంధన మందసం’గా ఇచ్చాం; ఇది ‘యాహ్వే నిబంధనకు చెందిన మందసం’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וּמֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో ఇచ్చాం.
- source_word: לֹא מָשׁוּ
  choice: కదలలేదు
  rationale: מוש ఇక్కడ ఉన్న స్థలం నుంచి కదలడం లేదా తొలగిపోవడం అనే భావాన్ని ఇస్తుంది. మందసం, మోషే ఇద్దరూ శిబిరాన్ని విడిచి వెళ్లలేదనే అంశాన్ని ‘కదలలేదు’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: శిబిరం మధ్యనుంచి
  rationale: קֶרֶב యొక్క ‘మధ్య/లోపలి భాగం’ అనే భావాన్ని దగ్గరగా, పఠనసౌలభ్యంతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఉంచాం.
- issue: וַיַּעְפִּלוּ లోని ఇశ్రాయేలీయుల చర్య స్వభావం
  choice: వారు తెగించి
  alternative: వారు దుస్సాహసంగా ప్రవర్తించారు / వారు ధిక్కారంగా ఎక్కారు
  rationale: ఈ క్రియ కేవలం పైకి వెళ్లడాన్ని కాక, హెచ్చరికను లెక్కచేయని ఉద్దేశపూర్వక దుస్సాహసాన్ని సూచిస్తుంది. ‘తెగించి’ ఆ నైతిక భావాన్ని చూపుతుంది; ‘ధిక్కారంగా’ అనేది సందర్భసమ్మతమైనప్పటికీ మూలక్రియకంటే కాస్త స్పష్టీకరణాత్మకం.
- issue: వాక్యంలోని మందసం, మోషేకు వర్తించే బహువచన క్రియ
  choice: యాహ్వే నిబంధన మందసం, మోషే ... కదలలేదు
  alternative: యాహ్వే నిబంధన మందసమూ మోషే కూడా ... కదలలేదు
  rationale: హీబ్రూలో రెండు కర్తలకు బహువచన క్రియ ఉంది. తెలుగులో సంయుక్త కర్తను సహజంగా ఉంచుతూ, ఇద్దరూ వారితో వెళ్లలేదనే భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. ‘తెగించి’ సహజమైనదిగా ఉండి మూలంలోని దుస్సాహస భావాన్ని మోస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
