revisions:
- from: అయితే వారు తెగించి కొండ శిఖరానికి ఎక్కారు[a]. కానీ యాహ్వే నిబంధన మందసం[b], మోషే శిబిరం మధ్యనుంచి కదలలేదు.
  to: అయితే వారు కొండ శిఖరానికి ఎక్కడానికి దుస్సాహసపడ్డారు[a]. కానీ యాహ్వే నిబంధన మందసమూ మోషే కూడా శిబిరం మధ్య నుండి కదలలేదు[b].
  rationale: The revision preserves the Hebrew’s culpable presumption while avoiding an unwarranted implication that the people reached the summit. It removes a redundant Telugu contrast, explicitly joins the ark and Moses under the shared predicate, and refines the construct-chain footnote into idiomatic Telugu. Footnote anchors remain present and correctly associated with the relevant wording.
