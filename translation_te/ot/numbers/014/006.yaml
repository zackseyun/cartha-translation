  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: te
  text: ఆ దేశాన్ని పరిశీలించినవారిలో నూను కుమారుడైన యెహోషువ, యెఫున్నె కుమారుడైన కాలేబు తమ బట్టలు చింపుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బట్టలు చింపుకోవడం దుఃఖం, దిగ్భ్రాంతి లేదా తీవ్రమైన వేదనను వ్యక్తం చేసే ఆచారం.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడు యెహోషువ
  rationale: హీబ్రూ వంశపరిచయ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, పేర్లకు ప్రాచుర్యంలో ఉన్న తెలుగు రూపాలను వాడాం.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడు కాలేబు
  rationale: యెహోషువతో కలిపి రెండవ కర్తగా ఉన్న కాలేబును, అతని తండ్రి పేరుతో సహజమైన తెలుగులో గుర్తించాం.
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: ఆ దేశాన్ని వేగుచూసినవారిలో
  rationale: מִן ఇక్కడ సమూహంలో సభ్యత్వాన్ని సూచించే భాగార్థక ప్రయోగం; అందువల్ల ‘వారిలో’ అని అనువదించాం. תור సందర్భానుసారంగా పరిశీలించడానికి పంపబడినవారి చర్యను సూచిస్తుంది; ‘వేగుచూసిన’ అనే పరిచిత బైబిలీయ తెలుగు పదం ఆ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: తమ బట్టలు చింపుకున్నారు
  rationale: కర్తలే తమ వస్త్రాలను చింపుకున్నారని తెలుగులో సహజంగా తెలియజేయడానికి ఆత్మనేపద రూపాన్ని వాడాం; ‘బట్టలు’ ఆధునిక సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘వేగుచూసినవారు’ అనే పదం సందర్భంలోని గూఢ పరిశీలన భావాన్ని నిలుపుతుంది; సాంస్కృతిక చర్యను పాదటిప్పణిలో వివరించాం.
