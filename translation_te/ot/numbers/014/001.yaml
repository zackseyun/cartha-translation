translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని ‘సమాజం/ప్రజలు’ పదవైవిధ్యాన్ని నిలిపి, సామూహిక ఏకవచనమైన ‘సమాజమంతా’కు అనుగుణంగా క్రియను ఏకవచనంలో ఉంచాం.
