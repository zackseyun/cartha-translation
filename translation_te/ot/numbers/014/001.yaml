source:
  edition: WLC
  text: וַ/תִּשָּׂא֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יִּתְּנ֖וּ אֶת קוֹלָ֑/ם וַ/יִּבְכּ֥וּ הָ/עָ֖ם בַּ/לַּ֥יְלָה הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: te
  text: అప్పుడు సమాజమంతా గొంతెత్తి కేకలు వేసింది[a]; ఆ రాత్రి ప్రజలు ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సమాజమంతా [తమ స్వరాన్ని] ఎత్తింది… వారు తమ స్వరం ఇచ్చారు”; ఇది సామూహికంగా బిగ్గరగా కేకలు వేయడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: గొంతెత్తి
  rationale: נשׂא అనే క్రియకు మౌలికంగా ‘ఎత్తు’ అనే భావం ఉంది. తరువాతి ‘తమ స్వరాన్ని ఇచ్చారు’ అనే పదబంధంతో కలిసి ఇది బిగ్గరగా సామూహికంగా మొరపెట్టుకోవడాన్ని సూచిస్తుంది; ‘గొంతెత్తి’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇక్కడ కూడివున్న ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదం; ‘అంతా’ כָּל భావాన్ని కాపాడుతుంది.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: కేకలు వేసింది
  rationale: అక్షరార్థంగా ‘తమ స్వరాన్ని ఇచ్చారు’; ఇది బిగ్గరగా సామూహికంగా కేకలు వేయడాన్ని సూచించే హీబ్రూ నుడికారం. ‘కేకలు వేసింది’ దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עָם కు నేరమైన అనువాదం. ముందున్న ‘సమాజం’తో సూచిత సమూహం ఒకటే అయినప్పటికీ, మూలంలోని పదవైవిధ్యాన్ని నిలుపుతుంది.
- source_word: וַיִּבְכּוּ
  choice: ఏడ్చారు
  rationale: בכה అంటే ఏడవడం లేదా కన్నీరు కార్చడం. ముందున్న బిగ్గర కేకల నుండి ఈ చర్యను వేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: ‘ఆ రాత్రిలో’ అనే కాలసూచక పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
