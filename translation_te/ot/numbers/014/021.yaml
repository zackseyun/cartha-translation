id: NUM.14.21
reference: Numbers 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: te
  text: అయితే, నా జీవం తోడు—యెహోవా మహిమ భూమినంతటినీ[a] నింపుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశమంతటినీ.’ హీబ్రూ אֶרֶץ అనే పదానికి సందర్భానుసారంగా ‘భూమి’ లేదా ‘దేశం’ అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ముందున్న మాటకు బలమైన వ్యతిరేకతను చూపుతుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంది.
- source_word: חַי אָ֑נִי
  choice: నా జీవం తోడు
  rationale: ఇది దేవుడు తన జీవం మీద చేసే ప్రమాణ సూత్రం. అక్షరార్థాన్ని కఠినంగా అనుసరించకుండా, దాని ప్రమాణబలాన్ని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: וְיִמָּלֵא
  choice: నింపుతుంది
  rationale: రూపం నిఫాల్ అయినప్పటికీ, వాక్యనిర్మాణంలో ‘యెహోవా మహిమ’ కర్తగా, אֶת గుర్తుతో ‘భూమినంతటినీ’ కర్మగా ఉన్నాయి; అందువల్ల మహిమ భూమినంతటినీ ఆవరించే ఫలితార్థాన్ని క్రియాశీల తెలుగులో వ్యక్తం చేసింది. ‘నిండిపోతుంది’ అనే భావసంభావ్యతను మౌనంగా అతిగా నిర్దేశించలేదు.
- source_word: כְבוֹד
  choice: మహిమ
  rationale: దేవుని ప్రత్యక్షత, ఘనత, వైభవం అనే భావవిస్తృతిని తెలుగులో సంప్రదాయబద్ధంగా, స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపంలో ఉంచుతుంది.
- source_word: אֶת כָּל הָאָרֶץ
  choice: భూమినంతటినీ
  rationale: ప్రధాన పాఠ్యంలో విశ్వవ్యాప్త భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘దేశమంతటినీ’ అనే స్థానిక భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: הָאָרֶץ పదం సూచించే పరిధి
  choice: భూమినంతటినీ
  alternative: దేశమంతటినీ
  rationale: దైవ ప్రమాణం, యెహోవా మహిమ గురించిన విస్తృత ప్రకటన విశ్వవ్యాప్త భావానికి అనుకూలంగా ఉన్నాయి. అయినప్పటికీ אֶרֶץ పదానికి స్థానిక ‘దేశం’ అనే అర్థం కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో సంరక్షించింది.
- issue: וְיִמָּלֵא నిర్మాణంలోని క్రియారూపం
  choice: యెహోవా మహిమ ... నింపుతుంది
  alternative: భూమి ... మహిమతో నిండుతుంది
  rationale: నిఫాల్ రూపం సాధారణంగా నిష్క్రియ లేదా ఫలితస్థితిని సూచించినా, ఇక్కడి పదక్రమం మరియు אֶת కర్మసూచకం ‘యెహోవా మహిమ’ను కర్తగా చదవడానికి ఆధారం ఇస్తాయి. అందువల్ల మూలంలోని అసాధారణ నిర్మాణానికి సరిపోయే క్రియాశీల అనువాదాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా దైవ ప్రమాణానికి తగిన గంభీరతతో రూపొందించబడింది. దీర్ఘ గీత ప్రమాణ వాక్యానికీ దాని తరువాతి ప్రకటనకీ మధ్య ఉన్న బలమైన సంబంధాన్ని చూపుతుంది.
