source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: te
  text: యాహ్వే మనపట్ల ప్రసన్నంగా ఉంటే[a], ఆయన మనలను ఈ దేశంలోకి తీసుకువెళ్లి దానిని మనకు ఇస్తాడు; అది పాలు, తేనె ప్రవహించే దేశం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనపట్ల సంతోషంగా ఉంటే,” “మనకు అనుకూలంగా ఉంటే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: సంతోషిస్తే
  rationale: אִם స్పష్టమైన షరతును పరిచయం చేస్తుంది; తెలుగులో ‘-తే’ రూపం ఆ షరతును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָפֵץ בָּנוּ
  choice: మనపట్ల సంతోషిస్తే
  rationale: חפץ ఆనందం, ఇష్టం, అనుకూల వైఖరి అనే భావాలను కలిగి ఉంది. ‘మనపట్ల సంతోషిస్తే’ వ్యక్తిగతమైన అనుకూలతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: ఆయన మనలను ఈ దేశంలోకి తీసుకువెళ్లి
  rationale: షరతు నెరవేరితే కలిగే ఫలితాన్ని భవిష్యదర్థంలో తెలియజేస్తుంది; ‘దేశంలోకి’ అనేది కేవలం దాని దగ్గరకు రావడం కాక, దానిలో ప్రవేశించడాన్ని సూచిస్తుంది.
- source_word: וּנְתָנָהּ לָנוּ
  choice: దాన్ని మనకు ఇస్తాడు
  rationale: స్త్రీలింగ ప్రత్యయం ముందున్న ‘దేశం’ను సూచిస్తుంది; נתן యొక్క సూటి అర్థమైన ‘ఇవ్వు’ను నిలుపుకుంది.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: ఇది పాలు తేనెలు ప్రవహించే దేశం
  rationale: హీబ్రూలో ‘దేశం’ పునరుక్తమై వివరణాత్మకంగా వస్తుంది. దాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా ఉంచి, సమృద్ధి మరియు సారవంతతను సూచించే మూలభాషా రూపకాన్ని నిలుపుకుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ మూలనామానికి సాధారణంగా అంగీకరించబడిన ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: యాహ్వే అనుకూలతకు సంబంధించిన షరతు
  choice: మనపట్ల సంతోషిస్తే
  alternative: మనలను అనుగ్రహిస్తే
  rationale: వాక్యంలో ఉన్న నిజమైన షరతును అలాగే ఉంచి, దాన్ని నిశ్చయార్థంగా మార్చలేదు. అలాగే חפץ లోని ఆనందం లేదా ఇష్టం అనే వ్యక్తిగత భావాన్ని కేవలం ‘అనుగ్రహం’గా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని షరతు, దైవనామం, ‘పాలు తేనెలు ప్రవహించే’ రూపకం, ‘దేశం’ అనే వివరణాత్మక పునరుక్తి నిలుపబడ్డాయి.
