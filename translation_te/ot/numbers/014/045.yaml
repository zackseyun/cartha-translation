translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘కొట్టి చితకగొట్టారు’ అనే జంట క్రియలు మూలంలోని వరుసగా వచ్చే రెండు సైనిక క్రియల తీవ్రతను నిలుపుతాయి.
