id: NUM.14.45
reference: Numbers 14:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: te
  text: అప్పుడు ఆ కొండప్రాంతంలో నివసిస్తున్న అమాలేకీయులు, కనానీయులు దిగివచ్చి, వారిని హోర్మా[a] వరకు కొట్టి చితకగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హోర్మా ఒక స్థలనామం. ఈ హీబ్రూ పేరు ‘నాశనం’ లేదా ‘నాశనానికి అంకితం చేయడం’ అనే భావంగల పదంతో సంబంధం కలిగి ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివచ్చి
  rationale: కొండప్రాంతం నుంచి కిందికి జరిగిన సైనిక కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది. ఏకవచన క్రియ సంయుక్త సమూహ కర్తకు ముందు రావడం హీబ్రూ వాక్యనిర్మాణంలో సాధారణం; తెలుగులో సమూహాల భావానికి అనుగుణంగా చెప్పబడింది.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: అమాలేకీయులు, కనానీయులు
  rationale: రూపపరంగా ఏకవచన జాతినామాలైనా ఇక్కడ సమూహార్థంలో ఉన్నాయి; తరువాతి క్రియలు కూడా బహువచనంగా ఉండటంతో తెలుగులో బహువచనం సహజం.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: ఆ కొండప్రాంతంలో నివసిస్తున్న
  rationale: יֹשֵׁב నివాసాన్ని సూచిస్తుంది; הָר ఇక్కడ ఒక్క కొండకన్నా ప్రాంతీయ ఎత్తైన భూభాగాన్ని సూచించే సందర్భం ఉన్నందున ‘కొండప్రాంతం’ సరిపోతుంది.
- source_word: וַיַּכּוּם
  choice: వారిని ... కొట్టి
  rationale: נכה యొక్క కొట్టడం/దెబ్బతీయడం అనే విస్తృత, స్పష్టమైన భావాన్ని ఉంచుతుంది; ఓటమి పరిమాణాన్ని ఈ క్రియలోనే అతిగా నిర్ణయించదు.
- source_word: וַיַּכְּתוּם
  choice: చితకగొట్టారు
  rationale: మొదటి దాడిని తీవ్రతరం చేస్తూ నలగగొట్టడం లేదా ఘోరంగా ఓడించడం అనే సైనిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పూర్తిగా నిర్మూలించారనే అతిశయార్థాన్ని రుద్దదు.
- source_word: עַד הַחָרְמָה
  choice: హోర్మా వరకు
  rationale: עַד సూచించే గమ్యపరిమితిని ‘వరకు’ స్పష్టంగా తెలుపుతుంది; స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించింది.
