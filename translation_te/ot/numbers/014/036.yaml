id: NUM.14.36
reference: Numbers 14:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: te
  text: మోషే దేశాన్ని పరిశీలించడానికి[a] పంపిన ఆ మనుషులు తిరిగి వచ్చి, ఆ దేశం గురించి చెడ్డ నివేదికను తీసుకొచ్చి[b], సమాజమంతా అతనికి వ్యతిరేకంగా సణుగుకొనేలా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశాన్ని వేగు చూడడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ దేశం గురించి చెడ్డ నివేదికను వ్యాప్తి చేసి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: తెలుగు కథనంలో ముందుగా ప్రస్తావించిన వ్యక్తులను తిరిగి సూచించడానికి ‘ఆ మనుషులు’ సహజంగా ఉంటుంది; వావ్ యొక్క అనుసంధాన భావాన్ని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండానే వాక్యప్రవాహం తెలియజేస్తుంది.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: మోషే ... పంపిన
  rationale: మూలంలోని సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంతో అందిస్తుంది.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: దేశాన్ని పరిశీలించడానికి
  rationale: תור ఇక్కడ కనాను దేశాన్ని గమనించి తెలుసుకోవడానికి చేసిన పర్యటనను సూచిస్తుంది. ‘పరిశీలించడానికి’ అనేది గూఢచర్యం అనే ప్రతికూల భావాన్ని తప్పనిసరిగా చేర్చకుండా ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּשֻׁבוּ
  choice: తిరిగి వచ్చి
  rationale: שוב యొక్క సాధారణ కథనార్థాన్ని తెలుగులో సహజమైన వరుసక్రియ రూపంలో వ్యక్తపరుస్తుంది.
- source_word: וילונו עָלָיו
  choice: అతనికి వ్యతిరేకంగా సణుగుకొనేలా చేశారు
  rationale: ఈ రూపం, వెంట వచ్చే ప్రత్యక్ష కర్మతో కలిపి, ఆ మనుషులు సమాజం సణుగడానికి కారణమయ్యారని సూచిస్తుంది. ‘సణుగు’ అరణ్యప్రయాణంలోని పదేపదే వచ్చే అసంతృప్తి వ్యక్తీకరణను నిలుపుతుంది.
- source_word: אֶת כָּל־הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలీయుల సమూహాన్ని సూచిస్తుంది; ‘సమాజమంతా’ ఆధునిక తెలుగులో సహజంగా ఉండి సమగ్రతను కూడా తెలియజేస్తుంది.
- source_word: לְהוֹצִיא דִבָּה
  choice: చెడ్డ నివేదికను తీసుకొచ్చి
  rationale: הוציא యొక్క ‘బయటకు తేవడం’ అనే భావాన్ని, דִבָּה యొక్క హానికరమైన లేదా నిరుత్సాహపరిచే నివేదిక భావంతో కలిపి సహజ తెలుగులో అందిస్తుంది.
- source_word: עַל־הָאָרֶץ
  choice: ఆ దేశం గురించి
  rationale: ఇక్కడ עַל నివేదిక యొక్క విషయాన్ని సూచిస్తుంది; ‘గురించి’ సాధారణమైన, స్పష్టమైన తెలుగు ప్రయోగం.
