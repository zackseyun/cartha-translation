  source_fidelity: 'హీబ్రూ వాక్యనిర్మాణం మరియు ప్రధాన పదార్థం మొత్తంగా సరిగ్గా ప్రతిబింబించబడ్డాయి: టַפְּכֶם‌కు ‘మీ చిన్నపిల్లలను,’ לָבַז‌కు ‘దోపుడుసొమ్ముగా,’ וְיָדְעוּకు ‘తెలుసుకుంటారు,’ మְאַסְתֶּםకు ‘తిరస్కరించిన’ తగినవి. అయితే וְהֵבֵאתִי (‘లోనికి/దేశంలోకి తీసుకువస్తాను’)కు ప్రధాన పాఠంలోని ‘అక్కడికి తీసుకొస్తాను’ కొద్దిగా అస్పష్టంగా ఉంది; గమ్యమైన దేశంలో ప్రవేశింపజేయడం అనే క్రియా భావాన్ని స్పష్టంగా చూపడం మంచిది.'
