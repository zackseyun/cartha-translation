id: NUM.14.31
reference: Numbers 14:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: te
  text: కానీ, దోపుడుసొమ్ముగా మారిపోతారని[a] మీరు చెప్పిన మీ చిన్నపిల్లలను నేను ఆ దేశంలోకి తీసుకొస్తాను. మీరు తిరస్కరించిన[c] ఆ దేశాన్ని వారు తెలుసుకుంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎర అవుతారని’; లేదా ‘కొల్లసొమ్ముగా మారిపోతారని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ దేశాన్ని వారు అనుభవిస్తారు.’ ఇక్కడ ‘తెలుసుకోవడం’ అనే హీబ్రూ పదానికి అనుభవపూర్వకంగా తెలుసుకోవడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తృణీకరించిన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలను
  rationale: טַף ఇక్కడ ప్రత్యేకంగా చిన్నపిల్లలను సూచిస్తుంది. సందర్భంలో వారి నిస్సహాయతను కూడా ఈ పదప్రయోగం నిలుపుతుంది.
- source_word: לָבַז
  choice: దోపుడుసొమ్ముగా మారిపోతారని
  rationale: בַּז యుద్ధంలో శత్రువు పట్టుకుపోయే దోపుడుసొమ్ము లేదా కొల్లసొమ్మును సూచిస్తుంది. సైనిక సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: వారిని నేను అక్కడికి తీసుకొస్తాను
  rationale: בוא అనే క్రియ హిఫీల్ రూపంలో ‘ప్రవేశింపజేయడం/లోపలికి తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. గమ్యం తరువాత పేర్కొన్న దేశమే కాబట్టి తెలుగులో ‘అక్కడికి’ అని సహజంగా వ్యక్తం చేయబడింది.
- source_word: וְיָדְעוּ
  choice: వారు తెలుసుకుంటారు
  rationale: יָדַע యొక్క ప్రాథమిక అర్థమైన ‘తెలుసుకొను’ను నిలుపుతూ, సందర్భంలో ఉండగల అనుభవపూర్వక భావాన్ని పాదసూచికలో చూపించాం.
- source_word: הָאָרֶץ
  choice: ఆ దేశాన్ని
  rationale: ఈ సందర్భంలో הָאָרֶץ ఇశ్రాయేలీయులు ప్రవేశించవలసిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది. తెలుగులో నిర్దిష్టతను సహజంగా తెలియజేయడానికి ‘ఆ దేశం’ వాడబడింది; మూలంలో లేని ‘వాగ్దాన దేశం’ లేదా ‘కనాను’ చేర్చలేదు.
- source_word: מְאַסְתֶּם בָּהּ
  choice: మీరు తిరస్కరించిన
  rationale: מָאַס అంటే తిరస్కరించడం, తృణీకరించడం లేదా అసహ్యించుకోవడం. భావోద్వేగ తీవ్రతను అతిగా పెంచకుండా వారి నిరాకరణను తెలియజేయడానికి ‘తిరస్కరించిన’ ఎంచుకోబడింది.
theological_decisions:
- issue: ‘ఆ దేశం’ను వాగ్దాన దేశం లేదా కనాను అని స్పష్టంగా పేర్కొనాలా?
  choice: మూలంలోని విధంగానే ‘ఆ దేశం’ అని ఉంచడం.
  alternative: ‘వాగ్దాన దేశం’ లేదా ‘కనాను దేశం’ అని అనువదించడం.
  rationale: హీబ్రూ పాఠంలో కేవలం הָאָרֶץ (‘ఆ దేశం’) మాత్రమే ఉంది. సందర్భం దాని గుర్తింపును స్పష్టం చేస్తుంది; ‘వాగ్దాన’ లేదా ‘కనాను’ అని చేర్చడం ఈ వచనంలో లేని వివరణను ప్రధాన పాఠంలోకి తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘చిన్నపిల్లలు,’ ‘దోపుడుసొమ్ము,’ ‘తిరస్కరించిన’ వంటి పదాలు మూలపాఠంలోని అర్థ ఛాయలను నిలుపుతూ సహజంగా ఉన్నాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
