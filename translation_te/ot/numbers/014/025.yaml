translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. ‘మళ్లి’ మూలంలోని దిశ మార్చమనే ఆజ్ఞను, ‘వెనక్కి’ అని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘ఎర్ర సముద్రం’ పదబంధంపైనే ఉంచబడింది.
