  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: te
  text: అమాలేకీయులూ కనానీయులూ లోయలో నివసిస్తున్నారు. రేపు మీరు తిరిగి, ఎర్ర సముద్రం దారిన అరణ్యానికి బయలుదేరండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: “రెల్ల సముద్రం.” సంప్రదాయంగా “ఎర్ర సముద్రం” అని అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: అమాలేకీయులు, కనానీయులు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఏకవచన జాతివాచకాలు ఇక్కడ ఆయా ప్రజాసమూహాలను సమష్టిగా సూచిస్తున్నాయి; అందుకే తెలుగులో సహజమైన బహువచన రూపాలు వాడబడ్డాయి. మొదటి וְ కు విడిగా ‘మరియు’ చేర్చకుండా, రెండు సమూహాలను జాబితాగా ఉంచడం సహజ తెలుగు వాక్యనిర్మాణానికి సరిపోతుంది.
- source_word: יוֹשֵׁב
  choice: నివసిస్తున్నారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది; ప్రజాసమూహాలకు అనుగుణంగా గౌరవ/బహువచన క్రియారూపం వాడబడింది.
- source_word: בָּעֵמֶק
  choice: లోయలో
  rationale: עֵמֶק సాధారణంగా లోయను లేదా తక్కువ ఎత్తున్న భూభాగాన్ని సూచిస్తుంది; ‘లోయ’ సూటిగా, సహజంగా ఉంది.
- source_word: מָחָר
  choice: రేపు
  rationale: తరువాతి రోజును సూచించే కాలక్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: פְּנוּ
  choice: మళ్లి
  rationale: פנה ఆజ్ఞారూపం దిశ మార్చడాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘వెనక్కి’ అనే భావాన్ని చేర్చకుండా ‘మళ్లి’ అని అనువదించబడింది.
- source_word: וּסְעוּ
  choice: బయలుదేరండి
  rationale: ప్రయాణ సందర్భంలో נסע శిబిరం ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరండి’ ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపం.
- source_word: לָכֶם
  choice: మీరు
  rationale: హీబ్రూలోని దాత్య సర్వనామం ఆజ్ఞ ఎవరికి ఉద్దేశించబడిందో నొక్కిచెబుతుంది. తెలుగులో ‘మీరు’ను స్పష్టంగా ఉంచడం ఆ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది; ‘మీ కోసం’ అనడం ఇక్కడ తప్పుడు ప్రయోజనార్థాన్ని కలిగించవచ్చు.
- source_word: הַמִּדְבָּר
  choice: అరణ్యానికి
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారి కాదు; జనావాసం తక్కువగా ఉన్న అరణ్య/వన్య ప్రాంతాన్ని సూచించగలదు. బైబిలు భౌగోళిక సందర్భానికి ‘అరణ్యం’ అనుకూలం.
- source_word: דֶּרֶךְ יַם סוּף
  choice: ఎర్ర సముద్రం దారిగా
  rationale: דֶּרֶךְ మార్గం లేదా ప్రయాణ దిశను సూచిస్తుంది. יַם־סוּף కు సంప్రదాయంగా పరిచయమైన ‘ఎర్ర సముద్రం’ ప్రధాన పాఠ్యంలో ఉంచి, మరింత అక్షరార్థమైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
