  source_fidelity: 'ప్రధాన భావం మూల హీబ్రూకు నమ్మకంగా ఉంది: రెండు ప్రజాసమూహాలు లోయలో నివసించడం, మరుసటి రోజు దిశ మార్చి అరణ్యానికి బయలుదేరమనే ఆజ్ఞ, అలాగే యామ్ సూఫ్ మార్గసూచన అన్నీ నిలిచాయి. అయితే “మళ్లి” ఆధునిక ప్రామాణిక తెలుగులో ఈ ఆజ్ఞార్థక సందర్భంలో స్పష్టంగా లేదు; “తిరిగి” మూలంలోని పְּנוּ (‘తిరుగు/దిశ మార్చు’) భావాన్ని సహజంగా అందిస్తుంది.'
