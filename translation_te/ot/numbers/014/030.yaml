source:
  edition: WLC
  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: te
  text: యెఫున్నె కుమారుడైన కాలేబు, నూను కుమారుడైన యెహోషువ తప్ప, నేను నా చేయి ఎత్తి మిమ్మల్ని నివసింపజేస్తానని ప్రమాణం చేసిన ఆ దేశంలోకి మీలో ఎవరూ ప్రవేశించరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “మిమ్మల్ని దానిలో నివసింపజేయడానికి నేను నా చేయి ఎత్తిన దేశం.” చేయి ఎత్తడం ప్రమాణం చేసే సంకేతం.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: మీలో ఎవరూ ప్రవేశించరు
  rationale: దైవ ప్రమాణ ప్రకటన ఆరంభంలో ఉన్న אִם బలమైన నిషేధార్థాన్ని ఇస్తుంది. తెలుగులో సహజంగా, సందర్భంలోని తీర్పు బలాన్ని నిలుపుతూ ‘ఎవరూ ప్రవేశించరు’ అని అనువదించాం.
- source_word: אֶל הָאָרֶץ
  choice: ఆ దేశంలోకి
  rationale: בוא అనే చలన క్రియతో ‘దేశంలోకి ప్రవేశించడం’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: నేను నా చెయ్యెత్తి ప్రమాణం చేసిన
  rationale: చెయ్యెత్తడం అనే హీబ్రూ ప్రమాణ సంకేతాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని భావాన్ని స్పష్టంచేయడానికి ‘ప్రమాణం చేసిన’ అని చేర్చాం.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: మిమ్మల్ని నివసింపజేస్తానని
  rationale: హిఫీల్ రూపంలోని ‘నివసించేలా చేయడం/స్థిరపరచడం’ అనే కారణార్థాన్ని ‘నివసింపజేయడం’ నేరుగా నిలుపుతుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ముందున్న నిషేధానికి ఏకైక మినహాయింపులను సూచించే నిర్మాణాన్ని తెలుగులో ‘తప్ప’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడైన కాలేబు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజ తెలుగు పదక్రమంలో నిలిపాం.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: వ్యక్తిపేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని స్పష్టంగా ఉంచాం.
theological_decisions:
- issue: దైవ ప్రమాణంలోని నిషేధం మరియు తీర్పు బలాన్ని వ్యక్తం చేయడం
  choice: మీలో ఎవరూ ప్రవేశించరు
  alternative: మీరు ఆ దేశంలోకి ప్రవేశిస్తే…
  rationale: ఇక్కడి אִם సాధారణ షరతును కాక, ప్రమాణసంబంధమైన బలమైన నిషేధాన్ని సూచిస్తుంది. అందువల్ల వాక్యాన్ని అసంపూర్ణ షరతుగా కాక దైవ తీర్పు ప్రకటనగా అనువదించాం.
- issue: చెయ్యెత్తడం అనే ప్రమాణ సంకేతాన్ని పాఠ్యంలో నిలుపడం
  choice: నేను నా చెయ్యెత్తి ప్రమాణం చేసిన
  alternative: నేను ఇస్తానని ప్రమాణం చేసిన
  rationale: మూలంలోని శరీర సంకేతాన్ని పూర్తిగా తొలగించకుండా, ఆధునిక పాఠకునికి దాని ప్రమాణార్థాన్ని స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన దైవ తీర్పు స్వరం. మూలంలోని ప్రమాణ సంకేతాన్ని కాపాడుతూ, అర్థం వెంటనే గ్రహించేందుకు దాని భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం. మినహాయింపులను ముందుంచిన తెలుగు పదక్రమం వాక్యాన్ని సహజంగా చేస్తుంది.
