  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: te
  text: కిత్తీము తీరం నుండి ఓడలు వస్తాయి[a]; అవి అష్షూరును[b] బాధిస్తాయి, ఏబెరును[c] కూడా బాధిస్తాయి. అతడు కూడా[d] నాశనానికి గురవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కిత్తీము ప్రత్యేకంగా సైప్రస్‌ను లేదా విస్తృతంగా పాశ్చాత్య సముద్ర ప్రాంతాల ప్రజలను సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అష్షూరు అనే పేరు అష్షూరియా దేశాన్ని లేదా దాని ప్రజలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఏబెరు అనేది ఒక ప్రజాపేరు కావచ్చు; హెబ్రీయులను లేదా యూఫ్రటీసు వంటి సరిహద్దుకు ‘ఆవల’ నివసించే ప్రజలను కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: d
    text: హెబ్రీలో ‘అతడు కూడా’ అని ఉంది. ‘అతడు’ ఎవరిని సూచిస్తున్నాడో అనిశ్చితం; కొందరు దీనిని కిత్తీము నుండి వచ్చిన శక్తిని సమూహార్థంలో లేదా ఆ శక్తికి ప్రాతినిధ్యం వహించే పాలకుణ్ణి సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: ఓడలు
  rationale: ఈ నామవాచకం సముద్రయాన నౌకలను సూచిస్తుంది. యుద్ధనౌకలు లేదా నౌకాదళాలు అనే అదనపు భావాన్ని చేర్చకుండా సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: מִיַּד
  choice: తీరం నుండి
  rationale: అక్షరార్థంగా ‘చేతి నుండి’; భౌగోళిక సందర్భంలో ఒక ప్రాంతపు వైపు, తీరం లేదా పరిసరాన్ని సూచించే ప్రయోగం. ఓడల ప్రస్తావన ఉన్నందున ‘తీరం నుండి’ సహజంగా సరిపోతుంది.
- source_word: כִּתִּים
  choice: కిత్తీము
  rationale: ఇది స్థలాన్ని లేదా ప్రజాసమూహాన్ని సూచించే సొంత పేరు. కుప్రు లేదా పాశ్చాత్య సముద్ర ప్రజలు అని నిర్దిష్టంగా నిర్ణయించకుండా మూలపేరును నిలుపుతుంది.
- source_word: וְעִנּוּ
  choice: బాధిస్తాయి
  rationale: పియేల్ రూపంలోని ענה బాధించడం, అణచివేయడం, అవమానపరచడం వంటి భావాలను ఇవ్వగలదు. ‘బాధిస్తాయి’ విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אַשּׁוּר
  choice: అష్షూరు
  rationale: మూలంలోని సొంత పేరును నిలుపుతూ, దేశం లేదా ప్రజలు అనే సాధ్యమైన సూచనల మధ్య ఉన్న అస్పష్టతను కాపాడుతుంది.
- source_word: עֵבֶר
  choice: ఏబెరు
  rationale: వ్యక్తి/ప్రజాపేరు, హెబ్రీయులు, లేదా సరిహద్దుకు ఆవలివారు అనే వివిధ వ్యాఖ్యానాలు సాధ్యమైనందున పేరును లిప్యంతరీకరించడం అస్పష్టతను నిలుపుతుంది.
- source_word: וְגַם הוּא
  choice: అతడు కూడా
  rationale: మూలంలో పుంలింగ ఏకవచన సర్వనామం ఉంది. దాని పూర్వపదం అనిశ్చితమైనప్పటికీ వ్యాకరణ రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: עֲדֵי אֹבֵד
  choice: చివరికి నాశనమవుతాడు
  rationale: ఈ పదబంధం నాశనం వరకు లేదా నశించిపోవడం అనే అంతిమ ఫలితాన్ని సూచిస్తుంది. ‘చివరికి నాశనమవుతాడు’ దిశాత్మక ముగింపును సహజమైన తెలుగులో తెలియజేస్తూ శాశ్వత నాశనం అనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: కిత్తీము, అష్షూరు, ఏబెరు మరియు చివరి ఏకవచన సర్వనామం యొక్క గుర్తింపు
  choice: మూల పేర్లను నిలిపి, చివరి సర్వనామాన్ని పుంలింగ ఏకవచనంగా ‘అతడు’ అని అనువదించడం
  alternative: కిత్తీమును కుప్రు లేదా పాశ్చాత్య సముద్ర శక్తులుగా; అష్షూరును అష్షూరియా దేశంగా; ఏబెరును హెబ్రీయులు లేదా యూఫ్రటీసుకు ఆవలి ప్రజలుగా; చివరి సర్వనామాన్ని కిత్తీము శక్తి, దాని పాలకుడు, లేదా మరొక సామ్రాజ్యంగా అర్థం చేసుకోవడం
  rationale: ఈ ప్రవచనంలోని చారిత్రక గుర్తింపులు వివాదాస్పదమైనవి. హెబ్రీ మూలం స్పష్టంగా నిర్ణయించని గుర్తింపును అనువాదం నిర్ణయించకుండా, దాని నిజమైన వ్యాఖ్యాన అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రవచన శైలి. వివాదాస్పద సొంత పేర్లను లిప్యంతరీకరించి, మూలంలోని ఏకవచన సర్వనామ అస్పష్టతను నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
