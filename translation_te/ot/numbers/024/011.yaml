id: NUM.24.11
reference: Numbers 24:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు[a] నీ చోటికి పారిపో! ‘నేను నిన్ను తప్పకుండా గౌరవిస్తాను’ అని చెప్పాను; అయితే, ఇదిగో[b], యాహ్వే నిన్ను గౌరవం పొందకుండా అడ్డుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇక ఇప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే నీకు గౌరవం దక్కనివ్వలేదు” లేదా “యాహ్వే నిన్ను గౌరవం నుండి దూరంగా ఉంచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సంభాషణలో ముగింపు ప్రతిస్పందనను సూచిస్తూ, సంధానార్థకమైన וְతో పాటు కాలార్థకమైన עַתָּהను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּרַח
  choice: పారిపో
  rationale: ఈ ఆజ్ఞారూపం త్వరగా వెళ్లిపోవడం లేదా పారిపోవడం అనే బలమైన భావాన్ని కలిగిస్తుంది; బాలాకు పలికిన కఠినమైన, తోసిపుచ్చే స్వరాన్ని నిలుపుతుంది.
- source_word: מְקוֹמֶךָ
  choice: నీ చోటికి
  rationale: మూలంలోని ‘నీ స్థలం’ అనే సాధారణ భావాన్ని కాపాడుతుంది; సందర్భంలో బిలాము తిరిగి వెళ్లవలసిన ప్రదేశాన్ని సూచించినా ‘ఇంటికి’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: אָמַרְתִּי
  choice: అని అనుకున్నాను
  rationale: పదశః ‘నేను అన్నాను’; అయితే ఇక్కడ బాలాకు ముందుగా చేసిన ఉద్దేశం లేదా వాగ్దానాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. ‘అని చెప్పాను’ అనే పఠనం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: నిన్ను తప్పకుండా ఘనపరుస్తాను
  rationale: క్రియానామం మరియు సమాన మూలక్రియ కలయికలోని గాఢతను ‘తప్పకుండా’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: וְהִנֵּה
  choice: అయితే ఇదిగో
  rationale: మునుపటి వాగ్దానానికి ప్రస్తుత ఫలితానికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని, అలాగే הִנֵּהలోని తక్షణ దృష్టి ఆకర్షణను నిలుపుతుంది.
- source_word: מְנָעֲךָ
  choice: నిన్ను ... అడ్డుకున్నాడు
  rationale: מנעకు ‘నిరోధించు/అడ్డగించు/దూరంగా ఉంచు’ అనే భావాలున్నాయి. తరువాతి מִן నిర్మాణంతో, వాగ్దానం చేసిన ఘనత బిలాముకు లభించకుండా చేశాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: מִכָּבוֹד
  choice: ఘనత పొందకుండా
  rationale: כָּבוֹד ఇక్కడ దైవిక మహిమకన్నా బాలాకు వాగ్దానం చేసిన గౌరవం, స్థానం, బహుమానాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘ఘనత పొందకుండా’ మూలంలోని నిరోధ భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడి, సాధారణ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: బిలాము ఘనత పొందకపోవడంలో యెహోవా పాత్ర
  choice: యెహోవా నిన్ను ఘనత పొందకుండా అడ్డుకున్నాడు
  alternative: యెహోవా నీకు ఘనత దక్కనివ్వలేదు
  rationale: బాలాకు చేసిన ఆరోపణను మూలంలోని కారణకర్తతోనే నేరుగా ఉంచుతుంది; వాక్యం ఆ ఆరోపణకు దైవశాస్త్రీయ సమర్థన ఇస్తుందా అనే ప్రశ్నను అదనంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బాలాకు మాటల్లోని కఠినమైన ఆజ్ఞ, వ్యంగ్యభరిత ఆరోపణ, మరియు హీబ్రూ గాఢతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే గౌరవప్రదమైన శైలి. ప్రధాన పాఠ్యంలో అన్ని పాదసూచిక గుర్తులు చేర్చబడ్డాయి.
