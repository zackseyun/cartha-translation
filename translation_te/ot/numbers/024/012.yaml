source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל בָּלָ֑ק הֲ/לֹ֗א גַּ֧ם אֶל מַלְאָכֶ֛י/ךָ אֲשֶׁר שָׁלַ֥חְתָּ אֵלַ֖/י דִּבַּ֥רְתִּי לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: te
  text: 'బిలాము బాలాకుతో ఇలా అన్నాడు: “నీవు నా దగ్గరికి పంపిన నీ దూతలతో[a] కూడా నేను ఇలా చెప్పలేదా:[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూతలు’ అనే హీబ్రూ పదం ఇతర సందర్భాల్లో దేవదూతలను కూడా సూచించగలదు; ఇక్కడ సందర్భం ప్రకారం మానవ సందేశవాహకులు లేదా ప్రతినిధులు ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ప్రారంభమైన ఉద్ధరణ తరువాతి వచనంలో కొనసాగుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר בִּלְעָם אֶל בָּלָק
  choice: బిలాము బాలాకుతో ఇలా అన్నాడు
  rationale: וַיֹּאמֶר అనే సాధారణ కథన క్రియను సహజమైన తెలుగులో ‘ఇలా అన్నాడు’గా, אֶל ద్వారా సూచితమైన సంబోధితుణ్ణి ‘బాలాకుతో’గా ఇచ్చాం.
- source_word: הֲלֹא
  choice: చెప్పలేదా?
  rationale: సమ్మతికరమైన జవాబును ఆశించే ప్రతికూల ప్రశ్నను తెలుగులో సహజమైన ‘చెప్పలేదా?’ రూపం తెలియజేస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: బిలాము బాలాకు పంపిన దూతలతోనూ ఇదే విషయం ముందే చెప్పాడనే అదనపు భావాన్ని సూచిస్తుంది.
- source_word: מַלְאָכֶיךָ
  choice: నీ దూతలతో
  rationale: מַלְאָך పదం సందర్భానుసారం మానవ సందేశవాహకుడినీ దేవదూతనూ సూచించగలదు; ఇక్కడ బాలాకు పంపిన మానవ ప్రతినిధులే ఉద్దేశం. ‘దూతలు’ ఆధునిక తెలుగులో రెండింటికీ వాడబడగల పదం కాబట్టి సందర్భమే అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: నీవు నా దగ్గరికి పంపిన
  rationale: దూతలను విశేషించే సంబంధవాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో ముందుంచాం.
- source_word: דִּבַּרְתִּי
  choice: నేను ముందే ... చెప్పలేదా?
  rationale: పూర్తయిన గత చర్యను తెలుగులో ‘చెప్పలేదా?’గా ఇచ్చి, వాక్యంలోని పునరుద్ఘాటన భావాన్ని ‘ముందే’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో కొనసాగే ప్రత్యక్ష ఉద్ధరణను పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా’గా ఇచ్చాం; డ్యాష్ కొనసాగింపును సూచిస్తుంది.
