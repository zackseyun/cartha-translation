source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: te
  text: “ఇప్పుడు ఇదిగో, నేను నా ప్రజల వద్దకు వెళ్తున్నాను. రా, చివరి రోజుల్లో[b] ఈ ప్రజలు నీ ప్రజలకు[a] ఏమి చేస్తారో నీకు సలహా ఇస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ప్రజలకు విరోధంగా.” హీబ్రూలో అక్షరార్థంగా “నీ ప్రజలకు” అని ఉంది; సందర్భంలో అది శత్రుత్వ చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాబోయే రోజుల్లో.” హీబ్రూ పదబంధం విస్తృతంగా భవిష్య కాలాన్ని సూచించవచ్చు; “చివరి రోజుల్లో” దానిలోని ప్రవచనాత్మక బరువును నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తదుపరి మాటను పరిచయం చేసే కాలసూచక సంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేను
  rationale: బిలాము తాను వెంటనే వెళ్లబోతున్న సంగతిని నొక్కిచెప్పే సూచనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: הוֹלֵךְ לְעַמִּי
  choice: నా ప్రజల దగ్గరికి వెళ్తున్నాను
  rationale: వర్తమాన కృదంతంలోని సమీప లేదా కొనసాగుతున్న చర్య భావాన్ని సహజంగా వ్యక్తం చేస్తూ, గమ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְכָה
  choice: రా
  rationale: శ్రద్ధ చూపమని లేదా దగ్గరకు రమ్మని పిలిచే ఏకవచన ఆజ్ఞార్థక ప్రయోగానికి నేరమైన, సహజమైన అనువాదం.
- source_word: אִיעָצְךָ
  choice: నీకు తెలియజేస్తాను
  rationale: పదానికి మూలంగా ‘సలహా ఇస్తాను/ఆలోచన చెబుతాను’ అనే భావం ఉన్నా, వెంట వచ్చే భవిష్య చర్యను ప్రకటించే వాక్యంతో తెలుగులో ‘తెలియజేస్తాను’ సహజంగా సరిపోతుంది; ఇది కేవలం వ్యూహాత్మక సలహాగా భావాన్ని పరిమితం చేయదు.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: హీబ్రూ ఏకవచన సమూహనామాన్ని తెలుగులో సహజమైన సమూహార్థక రూపంతో అందిస్తుంది.
- source_word: לְעַמְּךָ
  choice: నీ ప్రజలకు
  rationale: לְ అనే విభక్తి యొక్క నేరమైన సంబంధ లేదా ప్రభావిత పక్ష భావాన్ని నిలుపుతుంది; సందర్భంలో శత్రుత్వ చర్య సాధ్యమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: చివరి రోజుల్లో
  rationale: భవిష్య కాలాన్ని సూచించే హీబ్రూ నానుడిలోని ప్రవచనాత్మక బరువును నిలుపుతూ, తప్పనిసరిగా ఒక నిర్దిష్ట అంత్యకాల వ్యవస్థను దానిపై మోపదు.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים అనే ప్రవచనాత్మక కాలవ్యక్తీకరణ
  choice: చివరి రోజుల్లో
  alternative: రాబోయే రోజుల్లో
  rationale: ఈ మాట సాధారణ భవిష్య కాలాన్ని సూచించవచ్చు; అదే సమయంలో అంత్యకాల సూచనను కూడా మోసే అవకాశం ఉంది. ‘చివరి రోజుల్లో’ ఆ రెండు అవకాశాల మధ్య ఉన్న భావ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఇదిగో’ మరియు ‘చివరి రోజుల్లో’ వంటి కొద్దిగా ఉన్నతమైన పదప్రయోగాలు మూలంలోని ఉద్ఘాటనను, ప్రవచనాత్మక స్వరాన్ని నిలుపుతాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచబడ్డాయి.
