  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: te
  text: 'యాకోబూ, నీ గుడారాలు ఎంత బాగున్నాయి![a]

    ఇశ్రాయేలూ, నీ నివాసాలు ఎంత బాగున్నాయి!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ గుడారాలు ఎంత అందంగా/ఆహ్లాదంగా ఉన్నాయి … నీ నివాసాలు ఎంత అందంగా/ఆహ్లాదంగా ఉన్నాయి!” హెబ్రీలోని ఈ ఆశ్చర్యోక్తి గాఢమైన ప్రశంసను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה טֹּבוּ
  choice: ఎంత బాగున్నాయి
  rationale: ఇక్కడ מַה ప్రశ్నను కాదు, ప్రశంసతో కూడిన ఆశ్చర్యాన్ని వ్యక్తం చేస్తుంది. טוֹב యొక్క విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘బాగున్నాయి’ నిలుపుతుంది; సందర్భానుసారం ‘అందంగా/ఆహ్లాదంగా’ అనే భావం కూడా సాధ్యమే.
- source_word: אֹהָלֶיךָ
  choice: నీ గుడారాలు
  rationale: אֹהֶל సాధారణంగా ‘గుడారం’ అని అర్థం. బిలాము ఇశ్రాయేలు శిబిరాన్ని చూస్తున్న సందర్భంలో ఇది ఆరాధనా మందిరాన్ని ప్రత్యేకంగా సూచించదు.
- source_word: יַעֲקֹב
  choice: యాకోబూ
  rationale: పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఉంచి, హెబ్రీ కవితలోని ప్రత్యక్ష సంబోధనను ‘ఊ’ సంబోధనతో వ్యక్తం చేశాం.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: నీ నివాసాలు
  rationale: מִשְׁכָּן నివసించే స్థలాన్ని సూచిస్తుంది. ‘నివాసాలు’ మొదటి పాదంలోని ‘గుడారాలు’తో సమాంతరతను నిలుపుతూ, దానితో పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ
  rationale: పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఉంచి, ‘యాకోబు’కు సమాంతరంగా ప్రజలను కవితాత్మకంగా సంబోధించే రూపాన్ని నిలిపాం.
theological_decisions:
- issue: ఈ వాక్యంలో ఆరాధనా గుడారం భావాన్ని సూచించే సంప్రదాయ పదాన్ని వాడాలా?
  choice: ‘గుడారాలు’, ‘నివాసాలు’ అని అనువదించడం
  alternative: ‘గుడారాలు’, ‘మందిరాలు’ లేదా ఆరాధనా సంబంధ భావం కలిగిన పదాలు వాడడం
  rationale: సందర్భం ఇశ్రాయేలు శిబిరం మరియు వారి నివాస స్థలాల గురించి. హెబ్రీ పదాలు ఇక్కడ ప్రత్యేకంగా పరిశుద్ధ మందిరాన్ని సూచించవు; కాబట్టి ఆరాధనా సంబంధ భావాన్ని దిగుమతి చేయకుండా సాధారణ నివాసార్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా సంబోధన వాడబడింది. హెబ్రీ సమాంతర నిర్మాణాన్ని స్పష్టంగా చూపేందుకు రెండు పాదాలుగా అమర్చాం. ఆశ్చర్యోక్తి బలాన్ని విస్మయార్థక చిహ్నంతో నిలిపాం.
