id: NUM.24.3
reference: Numbers 24:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: te
  text: 'అప్పుడు అతడు తన కావ్యవచనాన్ని పలికి ఇలా అన్నాడు:


    “బెయోరు కుమారుడైన బిలాము ప్రకటన;


    కన్ను మూసియున్న మనిషి ప్రకటన[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కన్ను తెరవబడిన మనిషి.” ప్రవచన దర్శన సందర్భం మరియు ప్రాచీన వ్యాఖ్యాన సంప్రదాయాన్ని బట్టి కొందరు ఈ పదబంధాన్ని ఇలా అర్థం చేసుకుంటారు; అయితే హీబ్రూ రూపం మరింత నేరుగా “మూసిన” లేదా “మూయబడిన” అనే భావాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: అప్పుడు అతడు ఈ కావ్యవచనం పలికాడు
  rationale: నשׂא משל అనే హీబ్రూ నుడికారం గంభీరమైన కవితాత్మక వాక్యాన్ని ప్రారంభించడాన్ని సూచిస్తుంది. హీబ్రూ రూపకాన్ని తెలుగులో కృత్రిమంగా ‘ఎత్తుకున్నాడు’ అని అనకుండా, దాని భావాన్ని సహజంగా ‘కావ్యవచనం పలికాడు’ అని ఇచ్చాం.
- source_word: וַיֹּאמַר
  choice: పలికాడు
  rationale: אָמַר యొక్క సాధారణ భావం ‘అన్నాడు.’ ముందున్న నుడికారంతో కలిపి తెలుగులో పునరుక్తి లేకుండా సహజంగా ‘పలికాడు’ అని అనువదించాం.
- source_word: נְאֻם
  choice: ప్రకటన
  rationale: ఇది గంభీరమైన ప్రవచనాత్మక ఉక్తిని పరిచయం చేసే పదం. ‘ప్రకటన’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మూలంలోని అధికారిక స్వరాన్ని నిలుపుతుంది.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: బెయోరు కుమారుడైన బిలాము
  rationale: పితృనామ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేశాం; పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַגֶּבֶר
  choice: మనిషి
  rationale: ఈ స్వీయవర్ణనలో גֶּבֶר పురుషుణ్ణి సూచిస్తుంది; సందర్భానికి సహజమైన సాధారణ పదం ‘మనిషి.’
- source_word: שְׁתֻם הָעָיִן
  choice: కన్ను మూయబడిన
  rationale: మసొరెటిక్ హీబ్రూ రూపం నేరుగా ‘మూయబడిన/మూసిన’ అనే భావాన్ని సూచిస్తుంది. ప్రవచన దర్శన సందర్భం కారణంగా ‘తెరవబడిన’ అనే ప్రాచీన ప్రత్యామ్నాయ అవగాహన ఉన్నప్పటికీ, ప్రధాన పాఠంలో మూలరూపానికి దగ్గరైన భావాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: שְׁתֻם הָעָיִן అనే బిలాము దర్శనవర్ణన యొక్క అర్థం
  choice: కన్ను మూయబడిన
  alternative: కన్ను తెరవబడిన
  rationale: ఇది ప్రధాన సిద్ధాంత వివాదం కాదు; అయితే పాఠార్థపరంగా క్లిష్టమైన పదబంధం. దర్శన సందర్భానికి అనుగుణంగా అర్థాన్ని సవరించకుండా, మసొరెటిక్ రూపం సూచించే ‘మూయబడిన’ భావాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రాచీన వ్యాఖ్యాన సంప్రదాయంలో కనిపించే ‘తెరవబడిన’ అర్థాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలిని ఉపయోగించాం. మూలంలోని రెండు ‘ప్రకటన’ పాదాల సమాంతర నిర్మాణాన్ని నిలిపాం; వివాదాస్పద పాఠార్థాన్ని ప్రధాన పాఠంలో పరిష్కరించినట్లు చూపకుండా పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని సంరక్షించాం.
