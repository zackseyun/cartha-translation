source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: te
  text: 'నేను అతన్ని చూస్తున్నాను[a], కాని ఇప్పుడు కాదు;

    నేను అతన్ని తిలకిస్తున్నాను, కాని సమీపంలో కాదు.

    యాకోబు నుండి ఒక నక్షత్రం ఉద్భవించింది;

    ఇశ్రాయేలు నుండి ఒక రాజదండం లేచింది.

    అది మోయాబు అంచులను[b] నలగగొడుతుంది,

    షేతు కుమారులందరినీ[c] కూలదోస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేను అతన్ని చూస్తాను’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ వర్తమాన దర్శనాన్నీ, భవిష్యత్తులో నెరవేరబోయేదాన్నీ సూచించగలదు.
    reason: కాలరూప ప్రత్యామ్నాయం
  - marker: b
    text: అక్షరార్థంగా ‘మోయాబు మూలలను.’ ఇది మోయాబు సరిహద్దులు, పక్కలు లేదా దాని బలాన్ని సూచించే రూపకం కావచ్చు.
    reason: రూపక వివరణ
  - marker: c
    text: ‘సేతు కుమారులందరినీ’ అని కూడా చదవవచ్చు. ‘షేతు’ ఒక వ్యక్తినామం కావచ్చు; మరికొందరు దీన్ని మానవాళికి లేదా ఒక శత్రు జనానికి కవితాత్మక సూచనగా అర్థం చేసుకుంటారు.
    reason: అనిశ్చిత పఠనం
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: నేను అతన్ని చూస్తున్నాను
  rationale: ראה క్రియకు 3వ పురుష ఏకవచన పుంలింగ కర్మప్రత్యయం ఉంది. ప్రవచన దర్శనంలోని సజీవ వర్తమాన భావాన్ని నిలుపుతూ వ్యక్తిగత సూచనను ‘అతన్ని’ ద్వారా వ్యక్తం చేసింది; భవిష్యత్ భావం కూడా సాధ్యమేనని పాదటిప్పణిలో తెలిపింది.
- source_word: אֲשׁוּרֶנּוּ
  choice: నేను అతన్ని తిలకిస్తున్నాను
  rationale: שׁור అంటే చూడడం లేదా తేరి చూడడం. మొదటి పాదంలోని ‘చూస్తున్నాను’తో సమాంతరతను ఉంచి, భిన్న క్రియను ‘తిలకిస్తున్నాను’గా గౌరవప్రదంగా అనువదించింది.
- source_word: קָרוֹב
  choice: సమీపంలో
  rationale: ఈ పదం కాలపరమైన ‘త్వరలో’ భావాన్నీ, సాధారణ ‘దగ్గర’ భావాన్నీ కలిగి ఉండగలదు. ‘సమీపంలో’ ఆ రెండు ఛాయలను పూర్తిగా కాకపోయినా సాధ్యమైనంత వరకు తెరిచి ఉంచుతుంది.
- source_word: דָּרַךְ כּוֹכָב
  choice: ఒక నక్షత్రం బయలుదేరింది
  rationale: דָּרַךְ మూలంగా అడుగువేయడం లేదా ముందుకు రావడం అనే భావం ఇస్తుంది. నక్షత్రంతో కలిసినప్పుడు ‘బయలుదేరింది’ దాని ఆవిర్భావం, ముందుకు రావడం అనే కవితాత్మక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְקָם שֵׁבֶט
  choice: ఒక రాజదండం లేచింది
  rationale: שֵׁבֶטకు కర్ర, దండం, రాజదండం, గోత్రం అనే అర్థాలు ఉండవచ్చు. నక్షత్రానికి సమాంతరంగా, తరువాతి విజయభాష నేపథ్యంలో ‘రాజదండం’ రాజరిక ప్రతీకను స్పష్టంగా కాని వ్యాఖ్యానాత్మక అతిశయంలేకుండా అందిస్తుంది.
- source_word: פַּאֲתֵי מוֹאָב
  choice: మోయాబు అంచులను
  rationale: פֵּאָהకు అంచు, పక్క, మూల అనే అర్థాలున్నాయి. తెలుగులో ‘అంచులు’ భూభాగపు సరిహద్దులు లేదా మొత్తం శక్తి అనే రూపక భావానికి వీలు ఇస్తూ సహజంగా ఉంటుంది.
- source_word: וְקַרְקַר
  choice: కూలదోస్తుంది
  rationale: ఈ అరుదైన క్రియ అర్థం అనిశ్చితం; కూలదోయడం, ధ్వంసం చేయడం, పాడుచేయడం వంటి ప్రతిపాదనలు ఉన్నాయి. ‘కూలదోస్తుంది’ జయభాషకు సరిపోతూ అనవసరమైన ఖచ్చితత్వాన్ని మోపదు.
- source_word: כָּל בְּנֵי שֵׁת
  choice: షేతు కుమారులందరినీ
  rationale: హీబ్రూ వ్యంజనాలు షేతు/సేతు అనే వ్యక్తినామంగా సహజంగా చదవవచ్చు. పేరును లిప్యంతరీకరించడం ద్వారా దాని అస్పష్ట గుర్తింపును నిలిపి, విస్తృత ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణికి వదిలింది.
theological_decisions:
- issue: బిలాము ప్రవచనంలోని మెస్సీయ సంబంధ భావం
  choice: ప్రధాన పాఠ్యంలో ‘నక్షత్రం,’ ‘రాజదండం’ అనే రాజరిక ప్రతీకలనే ఉంచి, సూచిత పాలకుణ్ణి నేరుగా మెస్సీయగా గుర్తించలేదు.
  alternative: దీనిని నేరుగా మెస్సీయ గురించిన ప్రవచనంగా అనువదించడం; లేదా దావీదు వంటి తక్షణ చారిత్రక రాజుకే పరిమితం చేయడం.
  rationale: హీబ్రూ పాఠ్యం రాజరిక ప్రతీకలతో రాబోయే విజేతను సూచిస్తుంది గాని అతనికి నిర్దిష్ట పేరు ఇవ్వదు. అందువల్ల చారిత్రక, మెస్సీయ సంబంధ పఠనాల మధ్య ఉన్న వేదాంత ఉద్వేగాన్ని అనువాదం ముందుగానే పరిష్కరించదు.
- issue: నక్షత్రం/రాజదండం మరియు వ్యక్తిగత పాలకుని మధ్య సంబంధం
  choice: ఆరంభంలో పుంలింగ కర్మప్రత్యయాల ప్రకారం ‘అతన్ని’ అని అనువదించి, తరువాత ప్రతీకాత్మక నామవాచకాలను అలాగే ఉంచింది; చివరి క్రియలకు సమీప ప్రతీకను సూచించే నపుంసక రూపం వాడింది.
  alternative: మొత్తం వాక్యాన్ని ‘అతడు’ అనే వ్యక్తిగత సూచనతో చేయడం; లేదా ఆరంభం నుంచే పూర్తిగా అవ్యక్త ప్రతీకగా చేయడం.
  rationale: మూలంలో దర్శించబడేది పుంలింగ ఏకవచన వ్యక్తిగా సూచించబడినా, తరువాత ‘నక్షత్రం,’ ‘రాజదండం’ కర్తలుగా వస్తాయి. తెలుగు వ్యాకరణంలో తప్పనిసరైన లింగ ఎంపిక కారణంగా సమీప ప్రతీకతో అన్వయం చేసి, వ్యక్తిగత రాజు భావాన్ని పాదటిప్పణిలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రవచన-కావ్య శైలిని ఉపయోగించింది. హీబ్రూ సమాంతర పాదాలను పంక్తి విభజనతో నిలిపింది. ‘తిలకిస్తున్నాను,’ ‘రాజదండం’ వంటి పదాలు ఘనతను ఇస్తాయి; అయినా సాధారణ పాఠకునికి అర్థమయ్యే పదజాలాన్నే ఎంచుకుంది.
