revisions:
- from: 'నేను అతన్ని చూస్తున్నాను[a], కాని ఇప్పుడు కాదు;

    నేను అతన్ని తిలకిస్తున్నాను, కాని సమీపంలో కాదు.

    యాకోబులోనుండి ఒక నక్షత్రం బయలుదేరింది;

