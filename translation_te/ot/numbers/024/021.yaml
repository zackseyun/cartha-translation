  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּרְא֙ אֶת הַ/קֵּינִ֔י וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר אֵיתָן֙ מֽוֹשָׁבֶ֔/ךָ וְ/שִׂ֥ים בַּ/סֶּ֖לַע קִנֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: te
  text: 'అప్పుడు అతడు కేనీయుణ్ణి చూసి, తన ప్రవచనోక్తిని[a] పలికి ఇలా అన్నాడు:


    “నీ నివాసం స్థిరమైనది;

    నీ గూడు శిలలో అమర్చబడి ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన ఉక్తిని.” హీబ్రూ מָשָׁל అనే పదం సామెతను, వ్యంగ్యవాక్యాన్ని లేదా ప్రవచన ఉక్తిని సూచించవచ్చు; ఇక్కడ అది బిలాము పలికిన కావ్యరూప ప్రవచనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: కేనీయుణ్ణి
  rationale: హీబ్రూలో ఇది నిర్దేశక ఉపపదంతో కూడిన ఏకవచన రూపం; కేనీయుల ప్రజాసమూహాన్ని ఒక ప్రతినిధి ఏకవచనంగా సూచిస్తుంది. తరువాతి ఏకవచన సంబోధనతోనూ ఇది సరిపోతుంది.
- source_word: מְשָׁלוֹ
  choice: తన ప్రవచన వాక్కును
  rationale: మָשָׁל అనే పదం సామెత, వ్యంగ్యవాక్యం, గంభీరమైన కావ్యవాక్కు లేదా ప్రవచన ఉక్తి అనే అర్థాలు కలిగి ఉంటుంది. బిలాము పలికిన కావ్యరూప ప్రవచన సందర్భంలో ‘ప్రవచన వాక్కు’ సహజంగా, స్పష్టంగా ఉంటుంది; పదంలోని విస్తృత భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֵיתָן
  choice: స్థిరమైనది
  rationale: ఈ విశేషణం దృఢత్వం, నిలకడ, భద్రత అనే భావాలను తెలియజేస్తుంది. ‘స్థిరమైనది’ అనేది నివాసస్థలపు దీర్ఘకాల భద్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מוֹשָׁבֶךָ
  choice: నీ నివాసం
  rationale: ఈ పదం నివసించే స్థలాన్ని లేదా స్థావరాన్ని సూచిస్తుంది. ‘నీ నివాసం’ సంక్షిప్తంగా, కవితాత్మకంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וְשִׂים
  choice: అమర్చబడింది
  rationale: రూపపరంగా ఆజ్ఞార్థకంగా అర్థం చేసుకునే అవకాశం ఉన్నప్పటికీ, ఈ కవితా నిర్మాణంలో కేనీయుని గూడు ఉన్న స్థితిని వర్ణించే విధంగా గ్రహించడం సందర్భోచితం. అందువల్ల బలవంతపు ఆజ్ఞార్థక అనువాదానికి బదులు స్థితిని తెలిపే కర్మణి రూపం వాడాం.
- source_word: בַּסֶּלַע
  choice: శిలలో
  rationale: סֶלַע అంటే బండ, శిల, కొండచరియ లేదా రాతికొండ. గూడు రాతిలో భద్రంగా ఉన్న దృశ్యాన్ని ‘శిలలో’ గౌరవప్రదమైన, కవితాత్మక తెలుగులో నిలుపుతుంది.
- source_word: קִנֶּךָ
  choice: నీ గూడు
  rationale: మూలపదం అక్షరార్థంగా ‘గూడు.’ కేనీయుని సురక్షిత స్థావరాన్ని పక్షిగూడుతో పోల్చే రూపకాన్ని యథాతథంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్యశైలిని వాడాం. ఏకవచన సమూహసూచనను, గూడు–శిల రూపకాన్ని, హీబ్రూ కవితా సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
