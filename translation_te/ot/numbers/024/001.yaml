id: NUM.24.1
reference: Numbers 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: te
  text: బిలాము ఇశ్రాయేలును ఆశీర్వదించడం యాహ్వే దృష్టిలో మంచిదని గ్రహించాడు. అతడు మునుపటిలా శకునాల కోసం[a] వెళ్లలేదు; అరణ్యం వైపు తన ముఖాన్ని తిప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శకునాలను ఎదుర్కొనడానికి,’ ‘దైవజ్ఞాన సూచనలను పొందడానికి.’ ఈ హెబ్రీ పదబంధం బిలాము గతంలో దైవజ్ఞాన సంకేతాలను వెదికే ఆచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: గ్రహించాడు
  rationale: ראה అనే క్రియకు ప్రాథమికంగా ‘చూశాడు’ అనే అర్థం ఉన్నా, ఇక్కడ బిలాము పరిస్థితిని గుర్తించి అర్థం చేసుకున్నాడనే భావం ప్రధానంగా ఉంది. ‘గ్రహించాడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో మంచిదని
  rationale: ‘యాహ్వే కళ్లలో మంచిది’ అనే హెబ్రీ నుడికారంలోని దృశ్యరూపాన్ని తెలుగులో సహజమైన ‘దృష్టిలో మంచిది’ ద్వారా నిలుపుతుంది; ఇది ఆయనకు ఇష్టమైనది లేదా ఆమోదయోగ్యమైనది అనే భావాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: לְבָרֵךְ
  choice: ఆశీర్వదించడం
  rationale: ברך క్రియ యొక్క సందర్భానుగుణమైన సూటి అర్థాన్ని సహజమైన తెలుగు క్రియారూపంలో అందిస్తుంది.
- source_word: כְּפַעַם בְּפַעַם
  choice: మునుపటిలా
  rationale: అక్షరార్థంగా ఒక సందర్భాన్ని మరొక సందర్భంతో పోల్చే ఈ హెబ్రీ ప్రయోగం, బిలాము గతంలో పదేపదే అనుసరించిన పద్ధతిని సూచిస్తుంది. ‘మునుపటిలా’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לִקְרַאת נְחָשִׁים
  choice: శకునాల కోసం
  rationale: נְחָשִׁים ఇక్కడ పాములను కాక, భవిష్య సూచనలుగా భావించే శకునాలను లేదా దైవజ్ఞాన సంకేతాలను సూచిస్తుంది. ‘శకునాల కోసం’ బిలాము వాటిని వెదకడానికి వెళ్లే ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ నిర్మాణాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: తన ముఖాన్ని తిప్పాడు
  rationale: ఇది ఒక దిశవైపు ఉద్దేశపూర్వకంగా తిరగడాన్ని తెలిపే హెబ్రీ నుడికారం. ‘ముఖాన్ని తిప్పాడు’ తెలుగు పాఠకులకు సహజంగా ఉండి, మూలంలోని శరీరరూపకాన్ని కూడా నిలుపుతుంది.
- source_word: אֶל הַמִּדְבָּר
  choice: అరణ్యం వైపు
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘అరణ్యం’ సహజమైన బైబిలు పదం; ‘వైపు’ దిశను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలవచనంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, అలాగే ‘Jehovah’కు అనుగుణమైన ‘యెహోవా’ రూపాన్ని ఎంచుకోకుండా, ‘Yahweh’ ఉచ్చారణను తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. హెబ్రీ నుడికారమైన ‘దృష్టిలో మంచిది’ని నిలిపి, వాక్యప్రవాహం కోసం మొదటి సముచ్చయ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించాం. పాదటిప్పణి గుర్తును అది వివరించే ‘శకునాల కోసం’ అన్న పదబంధం వద్ద ఉంచాం.
