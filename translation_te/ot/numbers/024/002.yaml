source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: te
  text: అప్పుడు బిలాము తన కళ్లెత్తి, ఇశ్రాయేలు తన గోత్రాలవారీగా నివసిస్తూ ఉండడాన్ని చూశాడు[a]. దేవుని ఆత్మ అతని మీదికి వచ్చింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన గోత్రాలవారీగా శిబిరం వేసి ఉండడం,” లేదా “గోత్రం గోత్రంగా ఉండడం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని ఆత్మ అతని మీద ఉంది.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: తన కళ్లెత్తి
  rationale: ‘కళ్లెత్తడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా, మూలంలోని శరీరాంగ ప్రస్తావనతో సహా నిలుపుతుంది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: బిలాము కళ్లెత్తిన తరువాత అతనికి కనిపించిన దృశ్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: שֹׁכֵן
  choice: నివసించడం
  rationale: వర్తమాన కృదంత భావాన్ని నిలుపుతూ, సైనిక శిబిరార్థాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు; సందర్భంలో గోత్రాలవారీగా ఏర్పాటై ఉన్న శిబిరం భావం ఉంది.
- source_word: לִשְׁבָטָיו
  choice: తన గోత్రాల ప్రకారం
  rationale: ל ఉపసర్గ ఇక్కడ విభజన లేదా ఏర్పాటు భావాన్ని సూచిస్తుంది. సమష్టివాచకమైన ‘ఇశ్రాయేలు’కు అనుగుణంగా ‘తన గోత్రాల ప్రకారం’ అని అనువదించబడింది.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: ప్రవచన సందర్భంలో దేవుని నుంచి కలిగే ఆత్మీయ ప్రేరణను సహజంగా వ్యక్తపరుస్తుంది; హీబ్రూలో నిర్దిష్ట ఉపపదం లేకపోయినా తెలుగు నిర్మాణంలో ఈ రూపం సహజం.
- source_word: וַתְּהִי עָלָיו
  choice: అతని మీదికి వచ్చింది
  rationale: ప్రవచనానికి శక్తినిచ్చే ఆత్మ సన్నిధి ఆరంభమైన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; స్థిరార్థమైన ‘అతని మీద ఉంది’ కూడా వ్యాకరణపరంగా సాధ్యమే.
theological_decisions:
- issue: ప్రవచన సందర్భంలో רוּחַ אֱלֹהִים అనువాదం
  choice: దేవుని ఆత్మ
  alternative: దేవుని ఆత్మ అతని మీద ఉంది
  rationale: తరువాత వచ్చే బిలాము ప్రవచనంతో ఈ పదబంధం దైవిక ప్రేరణను సూచిస్తుంది. ‘మీదికి వచ్చింది’ ఆ సందర్భంలోని ఆరంభ లేదా ప్రవేశ భావాన్ని వ్యక్తపరుస్తుంది; అయితే హీబ్రూ వాక్యాన్ని స్థితిగా కూడా అర్థం చేసుకునే వీలును పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కళ్లెత్తి’ అనే బైబిలీయ నుడికారాన్ని అర్థమయ్యే విధంగా నిలిపి, గోత్రాల అమరిక మరియు ఆత్మ అతని మీద ఉండడం/రావడం విషయంలోని మూలభాషా విస్తృతిని పాదసూచికల్లో సంరక్షించాం.
