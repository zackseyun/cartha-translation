source:
  edition: WLC
  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: te
  text: 'దేవుడు అతణ్ణి ఐగుప్తులోనుండి బయటకు తీసుకొస్తున్నాడు;


    అతనికి అడవి ఎద్దు కొమ్ముల వంటి బలం ఉంది.[a]


    అతడు తన విరోధులైన జనాలను మింగివేస్తాడు;


    వారి ఎముకలను కొరికి వేస్తాడు[b],


    తన బాణాలతో వారిని నలిపివేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనికి అడవి ఎద్దువంటి బలం ఉంది.’ כְּתוֹעֲפֹת רְאֵם అనే హిబ్రూ పదబంధం అర్థం కఠినమైనది; అది అడవి ఎద్దు ఎత్తైన కొమ్ములనో, దాని మహాబలాన్నో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి ఎముకలను విరగ్గొడతాడు,’ లేదా ‘వారి ఎముకలను వలిచివేస్తాడు.’ יְגָרֵם అనే హిబ్రూ క్రియ అరుదైనది; దాని ఖచ్చితమైన భావం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలును ఐగుప్తులోనుండి వెలుపలికి తీసుకొచ్చే కర్తను సూచించే సహజమైన, స్పష్టమైన అనువాదం.
- source_word: מוֹצִיאוֹ
  choice: అతణ్ణి ... బయటకు తీసుకొస్తున్నాడు
  rationale: ప్రత్యయంతో ఉన్న హిబ్రూ కృదంతం కావ్యంలోని సజీవమైన వర్తమాన భావాన్ని ఇస్తుంది; తెలుగు వర్తమాన ప్రగతిశీల రూపం దానిని నిలుపుతుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులోనుండి
  rationale: నిర్గమన సందర్భంలోని భౌగోళిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: అడవి ఎద్దు కొమ్ములవంటి శక్తి
  rationale: కఠినమైన ఈ హిబ్రూ పదబంధంలో ఎత్తైన కొమ్ములు లేదా మహాబలం అనే భావాలు సంభవిస్తాయి. ప్రధాన పాఠ్యంలో జంతువు-కొమ్ముల రూపకాన్ని ఉంచుతూ, తెలుగులో దాని భావాన్ని స్పష్టంగా చేయడానికి ‘శక్తి’ చేర్చబడింది.
- source_word: לוֹ
  choice: అతనికి ... ఉంది
  rationale: స్వాధీనత లేదా అతని పక్షంగా ఉన్న ప్రయోజనాన్ని సూచించే హిబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు అస్తిత్వ నిర్మాణంతో తెలిపింది.
- source_word: יֹאכַל
  choice: మింగివేస్తాడు
  rationale: అక్షరార్థంగా ‘తింటాడు’; యుద్ధకావ్యంలో శత్రువులను పూర్తిగా నాశనం చేయడాన్ని సూచించే భక్షణ రూపకాన్ని ఈ ఎంపిక నిలుపుతుంది.
- source_word: גּוֹיִם צָרָיו
  choice: తన విరోధులైన జనాలను
  rationale: ‘జనాలు—అతని విరోధులు’ అనే అన్వయాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో తెలిపింది.
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: వారి ఎముకలను కొరికి వేస్తాడు
  rationale: అరుదైన క్రియను భక్షణ రూపకానికి సరిపోయే ‘కొరికి వేయడం’గా అనువదించింది; దాని ఖచ్చితమైన భావం అనిశ్చితమైనందున ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: וְחִצָּיו יִמְחָץ
  choice: తన బాణాలతో వారిని చితకగొడతాడు
  rationale: ‘బాణాలు’ను సాధనార్థకంగా గ్రహించి, מחץ యొక్క బలమైన ‘నలగగొట్టు/చితకగొట్టు’ భావాన్ని సహజమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: బిలాము ప్రవచనంలోని ఏకవచన సర్వనామాల నిర్దేశ్యం
  choice: ‘అతణ్ణి/అతనికి/అతడు/తన’ అనే ఏకవచన రూపాలను అలాగే నిలిపింది; అవి సమష్టిగా ఇశ్రాయేలునో, దాని రాజప్రతినిధినో సూచిస్తున్నాయని పాఠ్యంలో నిర్ణయించలేదు.
  alternative: వాటిని స్పష్టంగా ‘ఇశ్రాయేలు’గా మార్చడం; లేదా ఇశ్రాయేలు రాజు/భవిష్యత్తు పాలకుడు/మెస్సీయ వ్యక్తి అని నిర్దిష్టీకరించడం.
  rationale: హిబ్రూ పాఠ్యం ఏకవచన రూపాలను వాడినా, తక్షణ సందర్భం సమష్టి లేదా ప్రతినిధి ఏకవచనానికి అవకాశం ఇస్తుంది. అనువాదం ఈ ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కావ్యోచిత గాంభీర్యం ఉండేలా రూపొందించబడింది. హింసాత్మక భక్షణ, అడవి ఎద్దు, బాణాల రూపకాలను మృదువుచేయకుండా నిలిపింది. పాఠ్యంలోని ఏకవచన సర్వనామాల అస్పష్ట నిర్దేశ్యాన్ని ఉద్దేశపూర్వకంగా కాపాడింది.
