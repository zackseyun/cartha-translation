  source_fidelity: The singular pronouns are appropriately retained without resolving their referent. The difficult wild-ox expression is represented as a comparison of strength, with the horn-related ambiguity responsibly documented. The final colon is rendered instrumentally, following the English audit trail; supplying ‘వారిని’ makes the implied hostile target explicit in Telugu, though it is not expressed as an object in the Hebrew.
