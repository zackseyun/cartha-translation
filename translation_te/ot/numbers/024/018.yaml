source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: te
  text: ఎదోము స్వాధీనంగా మారుతుంది; శేయీరు కూడా అతని శత్రువులకు స్వాధీనంగా మారుతుంది[a]. ఇశ్రాయేలు పరాక్రమాన్ని ప్రదర్శిస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శేయీరు తన శత్రువులకు స్వాధీనంగా మారుతుంది.” హీబ్రూలో “అతని శత్రువులు” అనే పదంలో పుంలింగ ఏకవచన ప్రత్యయం ఉంది. అది శేయీరు/ఎదోమును సూచిస్తుందా, లేక సమీప సందర్భంలోని ప్రవచనంలో చెప్పబడిన పాలకుణ్ణి సూచిస్తుందా అనే విషయంలో భిన్న అభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ నుడికారానికి అక్షరార్థం “పరాక్రమం చేయడం”; అంటే బలాన్ని ప్రదర్శించడం లేదా పరాక్రమంగా ప్రవర్తించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: స్వాధీనమవుతుంది
  rationale: ప్రవచన సందర్భంలోని భవిష్యత్/ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘ఉంటుంది’ అనడం కంటే స్థితి మార్పును స్పష్టం చేస్తుంది.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: ఏశావు వంశానికి సంబంధించిన దేశం/ప్రాంతం యొక్క పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: יְרֵשָׁה
  choice: స్వాధీనము
  rationale: ఆక్రమించి అధీనంలో ఉంచుకున్న దానిని సూచించే ఈ నామవాచకానికి సైనిక సందర్భంలో ‘స్వాధీనము’ సహజంగా సరిపోతుంది; ‘వారసత్వము’ అనే కుటుంబపరమైన భావాన్ని అనవసరంగా రప్పించదు.
- source_word: שֵׂעִיר
  choice: శేయీరు
  rationale: ఎదోముకు సమాంతరంగా ఉన్న స్థలనామాన్ని లిప్యంతరీకరించింది; హీబ్రూలో ఇక్కడ ‘కొండ’ అనే పదం లేనందున దాన్ని చేర్చలేదు.
- source_word: אֹיְבָיו
  choice: అతని శత్రువులకు
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనంలో ఉంది. దాని సంభావ్య పూర్వపదాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా, రూపాన్ని యథాతథంగా నిలిపింది.
- source_word: וְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: సాధారణ సంధానార్థాన్ని వాక్య విరామంతో సహజ తెలుగులో వ్యక్తం చేసింది; తప్పనిసరిగా సమకాలీనతను సూచించే అదనపు భావాన్ని రుద్దలేదు.
- source_word: עֹשֶׂה חָיִל
  choice: పరాక్రమంతో కార్యాలు చేస్తుంది
  rationale: ‘బలం/పరాక్రమం ప్రదర్శిస్తూ కార్యం చేయడం’ అనే హీబ్రూ నుడికారపు సజీవమైన సైనిక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘అతని శత్రువులు’లోని ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతని’ అని పుంలింగ ఏకవచన రూపాన్ని నిలిపి, అది ముందటి ప్రవచనంలోని పాలకుని సూచించే అవకాశాన్ని తెరిచి ఉంచడం.
  alternative: శేయీరు/ఎదోమును సూచిస్తున్నదని భావించి ‘దాని శత్రువులకు’ అని అనువదించడం.
  rationale: హీబ్రూ రూపం పుంలింగ ఏకవచనం; 17–19 వచనాల్లో ఇశ్రాయేలు నుండి వచ్చే ఏకవచన పాలకునిపై దృష్టి ఉంది. అయితే సూచిత వ్యక్తిని పూర్తిగా నిర్ణయించడం వివాదాస్పదం కాబట్టి పాదసూచికలో ప్రత్యామ్నాయాన్ని తెలిపింది; స్పష్టమైన మెస్సీయ సంబంధ నిర్ధారణను పాఠ్యానికి మించి జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. స్థలనామాలకు సుపరిచితమైన తెలుగు లిప్యంతరీకరణను అనుసరించింది. హీబ్రూ ఏకవచన ప్రత్యయంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా కాపాడింది.
