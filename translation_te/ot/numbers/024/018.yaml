revisions:
- from: ఎదోము స్వాధీనమవుతుంది; శేయీరు కూడా అతని శత్రువులకు స్వాధీనమవుతుంది[a]. ఇశ్రాయేలు పరాక్రమంతో కార్యాలు చేస్తుంది[b].
  to: ఎదోము స్వాధీనంగా మారుతుంది; శేయీరు కూడా అతని శత్రువులకు స్వాధీనంగా మారుతుంది[a]. ఇశ్రాయేలు పరాక్రమాన్ని ప్రదర్శిస్తుంది[b].
