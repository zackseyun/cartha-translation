id: NUM.24.6
reference: Numbers 24:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: te
  text: 'వాగులోయల్లా అవి విస్తరించి ఉన్నాయి,

    నది పక్కన తోటల్లా,

    యాహ్వే నాటిన అగరు చెట్లలా[a],

    నీళ్ల పక్కన దేవదారు చెట్లలా ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం సువాసనగల అగరు చెట్లను లేదా వాటి కలపను సూచిస్తుంది; ఇక్కడ దాని అర్థం ‘గుడారాలు’ కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: వాగులోయలు
  rationale: ఈ పదం నీరు ప్రవహించే లోయలను లేదా వాగు పడగలను సూచించగలదు. నీటి సమృద్ధిని తెలిపే సమాంతర కవితా చిత్రాన్ని నిలుపుతూ ‘వాగులోయలు’ రెండు భావ ఛాయలనూ అందిస్తుంది.
- source_word: נִטָּיוּ
  choice: విస్తరించి ఉన్నాయి
  rationale: נטה అనే క్రియకు ‘చాచుకొను, విస్తరించు’ అనే భావం ఉంది. ఇక్కడ ప్రజల నివాసాలు విశాలంగా పరచుకొని ఉన్న దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גַנֹּת
  choice: తోటలు
  rationale: సాగుచేసిన, సారవంతమైన ప్రదేశాల కవితా చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: עֲלֵי נָהָר
  choice: నది పక్కన
  rationale: על అనే పదబంధం ఇక్కడ నదికి సమీపాన్ని సూచిస్తుంది; ‘నది పక్కన’ సాధారణమైన, స్పష్టమైన తెలుగు.
- source_word: אֲהָלִים
  choice: అగరు చెట్లు
  rationale: కవితా సందర్భంలో ఇది గుడారాలను కాక సువాసనగల అగరు/అలోవుడ్ చెట్లను సూచిస్తుంది. ‘అగరు చెట్లు’ ఆధునిక తెలుగులో వృక్షార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָטַע
  choice: నాటిన
  rationale: యాహ్వే చేసిన నాటే కార్యాన్ని తెలిపే సంపూర్ణ క్రియను తెలుగు సంబంధక క్రియారూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֲרָזִים
  choice: దేవదారు చెట్లు
  rationale: అరזיםకు సాధారణ తెలుగు సమానం; బలం, ఎత్తు, స్థిరత్వం అనే కవితా భావాలను నిలుపుతుంది.
- source_word: עֲלֵי מָיִם
  choice: నీళ్ల పక్కన
  rationale: హీబ్రూలోని బహువచన ‘జలాలు’ భావాన్ని సాధారణ తెలుగులో సహజంగా ఉంచి, సమృద్ధిగా నీరు ఉన్న దృశ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితా సమాంతరతను స్పష్టంగా కనిపించేలా ప్రతి ఉపమానాన్ని విడి పాదంలో ఉంచాం. ‘అవి’ అనే సర్వనామం ముందు వచనంలోని ఇశ్రాయేలు నివాసాలను సూచించే మూలపాఠపు అంతర్నిహిత విషయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
