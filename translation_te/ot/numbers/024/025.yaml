  edition: WLC
  text: וַ/יָּ֣קָם בִּלְעָ֔ם וַ/יֵּ֖לֶךְ וַ/יָּ֣שָׁב לִ/מְקֹמ֑/וֹ וְ/גַם בָּלָ֖ק הָלַ֥ךְ לְ/דַרְכּֽ/וֹ־׃פ
base_translation:
