translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూలోని వరుస క్రియలను తెలుగులో సహజంగా వినిపించే అసమాపక క్రియల క్రమంగా మలిచాం; ‘తన స్థలం’ అనే మూలపాఠంలోని నిర్దిష్టతలేని వ్యక్తీకరణను అలాగే నిలిపాం.
