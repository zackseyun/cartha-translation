  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: te
  text: అప్పుడు బిలాము లేచి, బయలుదేరి, తన స్థలానికి తిరిగి వెళ్లాడు. బాలాకు కూడా తన దారిన వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ కథన క్రమంలో లేవడాన్ని లేదా బయలుదేరడానికి సిద్ధపడడాన్ని సూచిస్తుంది. ఇక్కడ తరువాత వచ్చే వెళ్లడమనే క్రియతో సహజంగా కలిసేలా ‘లేచి’ అని అనువదించాం.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: וַיֵּלֶךְ
  choice: బయలుదేరి
  rationale: הלך సాధారణంగా ‘వెళ్లాడు’ అని అర్థం. అయితే వెంటనే וַיָּשָׁב కూడా రావడం వల్ల, మూడు క్రియల క్రమాన్ని సహజమైన తెలుగులో నిలుపుతూ ఇక్కడ ‘బయలుదేరి’ అని ఇచ్చాం.
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שׁוב మరియు గమ్యాన్ని తెలిపే పదబంధం కలిసి, ఇంతకు ముందు ఉన్న స్థలానికి తిరిగి వెళ్లడాన్ని సూచిస్తున్నాయి.
- source_word: לִמְקֹמוֹ
  choice: తన స్థలానికి
  rationale: מקום అక్షరార్థంగా ‘స్థలం.’ మూలపాఠం ‘ఇల్లు’ అని స్పష్టంగా చెప్పనందున ఆ భావాన్ని చేర్చకుండా ‘తన స్థలానికి’ అని ఉంచాం.
- source_word: וְגַם
  choice: కూడా
  rationale: బిలాము చేసిన ప్రయాణానికి సమాంతరంగా బాలాకు చేసిన ప్రయాణాన్ని చేర్చే అదనపు భావాన్ని ‘కూడా’ సహజంగా తెలియజేస్తుంది.
- source_word: בָּלָק
  choice: బాలాకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: הָלַךְ
  choice: వెళ్లాడు
  rationale: కథన ముగింపులో బాలాకు చేసిన చర్యను సూటిగా తెలిపే సాధారణ తెలుగు క్రియ.
- source_word: לְדַרְכּוֹ
  choice: తన దారిన
  rationale: דרך అంటే ‘దారి/మార్గం.’ ‘తన దారిన వెళ్లాడు’ అనే తెలుగు నుడికారం మూలంలోని భావాన్ని సహజంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
