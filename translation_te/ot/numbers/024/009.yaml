  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: te
  text: 'అతడు సింహంలా వంగి పడుకున్నాడు,

    సింహిలా కూడా[a]—అతన్ని ఎవరు లేపగలరు?


    నిన్ను దీవించేవారు దీవించబడినవారు[b];

    నిన్ను శపించేవారు శపించబడినవారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సింహిలా’ అనే పదాన్ని ‘బలమైన సింహంలా’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం బలమైన లేదా పరిణత సింహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ దీవెన-శాప వాక్యరూపం ఆదికాండము 12:3; 27:29లను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: వంగి
  rationale: ఈ క్రియ వంగడం లేదా ముడుచుకుని కూర్చోవడాన్ని సూచిస్తుంది. పడుకోవడం మరియు సింహపు ఉపమానంతో కలిసి ఉన్నందున, ఆరాధనార్థకంగా కాక జంతువు పడుకునే ముందు వంగే భంగిమగా అనువదించబడింది.
- source_word: שָׁכַב
  choice: పడుకున్నాడు
  rationale: సాధారణంగా పడుకోవడాన్ని సూచించే క్రియ; సింహం విశ్రాంతిగా స్థిరపడిన చిత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כַּאֲרִי
  choice: సింహంలా
  rationale: כְּ ఉపమానార్థాన్ని, אֲרִי అనే సాధారణ ‘సింహం’ పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּכְלָבִיא
  choice: సింహిలా
  rationale: לָבִיא బలమైన లేదా పరిణత సింహాన్ని, సందర్భానుసారం సింహిని కూడా సూచించవచ్చు. ముందున్న אֲרִיతో పదభేదాన్ని నిలుపుతూ ‘సింహి’ని ప్రధాన పాఠంలో ఎంచుకున్నాం; ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: מִי יְקִימֶנּוּ
  choice: అతన్ని లేపగలవాడెవడు?
  rationale: విశ్రాంతిలో ఉన్న సింహపు సందర్భంలో קום హిఫీల్ రూపం దానిని లేపడం లేదా కదిలించడం అనే భావాన్ని ఇస్తుంది. తెలుగు ప్రశ్నలో సందర్భానుగుణ ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: నిన్ను దీవించేవారు దీవించబడతారు
  rationale: దీవించేవారిని సూచించే కృదంత రూపాన్ని సహజమైన బహువచన వాక్యంగా ఇచ్చి, ఆశీర్వాద ప్రకటనను నిలిపాం.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: నిన్ను శపించేవారు శపించబడతారు
  rationale: దీవెనకు సమాంతరమైన శాప ప్రకటనను నేరుగా, సమమితితో అనువదించాం.
theological_decisions:
- issue: ‘నిన్ను దీవించేవారు... నిన్ను శపించేవారు’లో ద్వితీయ పురుష ఏకవచన సంబోధన ఎవరికి వర్తిస్తుంది
  choice: కావ్యాత్మక ఏకవచనంలో యాకోబు/ఇశ్రాయేలును సూచించే ‘నిన్ను’ నిలుపడం
  alternative: ఇశ్రాయేలు రాజునకు మాత్రమే లేదా ప్రజాసమూహానికి స్పష్టంగా విస్తరించి అనువదించడం
  rationale: సమీప సందర్భం యాకోబు/ఇశ్రాయేలును కావ్యాత్మక ఏకవచనంలో చూపుతుంది. అనువాదం సూచిత వ్యక్తిని మరింత సంకుచితం చేయకుండా హెబ్రీ రూపంలోని ప్రతినిధి-సామూహిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: పితృపురుషుల దీవెన-శాప సూత్రంతో ప్రతిధ్వని
  choice: ప్రధాన పాఠంలో సూటి దీవెన-శాప ప్రకటనను మాత్రమే ఉంచి, అంతర్వాక్య సంబంధాన్ని పాదసూచికలో తెలపడం
  alternative: అబ్రాహామీయ నిబంధన సంబంధాన్ని ప్రధాన పాఠంలో వివరణాత్మకంగా చేర్చడం
  rationale: ఆదికాండము 12:3; 27:29తో బలమైన ప్రతిధ్వని ఉన్నప్పటికీ, మూలపాఠం చెప్పినదానికంటే అధికంగా సిద్ధాంతార్థాన్ని ప్రధాన అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్య గద్యాన్ని ఉపయోగించాం. హెబ్రీ కవితలోని సమాంతరత, సింహపు చిత్రం, ఏకవచన సంబోధన నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
