  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వచనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. పేర్లు ‘బాలాకు,’ ‘బిలాము’గా తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఇచ్చబడ్డాయి.
