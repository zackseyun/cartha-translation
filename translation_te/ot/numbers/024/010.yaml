  text: וַ/יִּֽחַר אַ֤ף בָּלָק֙ אֶל בִּלְעָ֔ם וַ/יִּסְפֹּ֖ק אֶת כַּפָּ֑י/ו וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם לָ/קֹ֤ב אֹֽיְבַ/י֙ קְרָאתִ֔י/ךָ וְ/הִנֵּה֙ בֵּרַ֣כְתָּ בָרֵ֔ךְ זֶ֖ה שָׁלֹ֥שׁ פְּעָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: te
  text: 'అప్పుడు బిలాముమీద బాలాకు కోపం మండింది. అతడు తన అరచేతులను ఒకదానితో ఒకటి కొట్టుకొని, బిలాముతో ఇలా అన్నాడు: “నా శత్రువులను శపించడానికి నిన్ను పిలిపించాను. కాని చూడు, నువ్వు ఈ మూడు సార్లూ వారిని దీవించనే దీవించావు![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దీవించావు, దీవించడం.” ఈ నిర్మాణం దీవించడాన్ని బలంగా నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: బిలాముమీద బాలాకు కోపం మండింది
  rationale: హీబ్రూ కోపం ‘మండడం’ అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, אֶל లోని ప్రతికూల దిశను ‘మీద’ ద్వారా తెలియజేస్తుంది.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: తన అరచేతులను ఒకదానితో ఒకటి కొట్టుకొని
  rationale: కోపంతో చేతులు కలిపి కొట్టే హావను స్పష్టంగా తెలియజేస్తుంది; ‘చప్పట్లు కొట్టాడు’ అని అనువదిస్తే ప్రశంస లేదా ఆనందం అనే ఆధునిక భావం కలిగే అవకాశం ఉంది.
- source_word: לָקֹב
  choice: శపించడానికి
  rationale: బిలామును పిలిపించిన ఉద్దేశాన్ని తెలిపే క్రియారూపానికి సూటిగా, సందర్భోచితంగా సరిపోతుంది.
- source_word: אֹיְבַי
  choice: నా శత్రువులను
  rationale: మొదటి పురుష బహువచన స్వామ్యార్థాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קְרָאתִיךָ
  choice: నిన్ను పిలిపించాను
  rationale: రాజు తన దగ్గరకు బిలామును రప్పించిన సందర్భంలో ‘పిలిపించాను’ అనేది קרא లోని పిలవడం/రప్పించడం భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וְהִנֵּה
  choice: కాని చూడు
  rationale: ఊహించని ఫలితాన్ని ఎత్తిచూపే విరుద్ధతను, శ్రద్ధను ఆకర్షించే సూచనను రెండింటినీ నిలుపుతుంది.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: దీవించనే దీవించావు
  rationale: సమాపక క్రియతో infinitive absolute పునరుక్తి కలిగించే బలమైన ఉద్ఘాటనను తెలుగు సహజ పునరుక్తి నిర్మాణంతో ప్రతిబింబిస్తుంది.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: ఈ మూడు సార్లూ
  rationale: ఇప్పటివరకు జరిగిన మూడు సందర్భాలను సూచించే demonstrative భావాన్ని ‘ఈ’ ద్వారా, ప్రతి సందర్భంలోనూ అలాగే జరిగిందనే భావాన్ని ‘సార్లూ’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
