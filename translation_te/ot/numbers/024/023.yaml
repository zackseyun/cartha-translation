  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: te
  text: 'తరువాత అతడు తన ప్రవచన వాక్యాన్ని ఎత్తి ఇలా అన్నాడు: “అయ్యో! దేవుడు దీనిని జరిగించినప్పుడు ఎవరు బ్రతకగలరు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హీబ్రూ పదబంధం క్లిష్టమైనది. దీనిని “దేవుడు దీనిని స్థాపించినప్పుడు ఎవరు బ్రతకగలరు?” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: తన ప్రవచన వాక్యాన్ని పలికి
  rationale: נשׂא + מָשָׁל అనేది ఒక వాక్యాన్ని లేదా కవితాత్మక ప్రవచనాన్ని పలకడం అనే జాతీయ ప్రయోగం. తెలుగు సహజత్వం కోసం ‘పలికి’ అని, సందర్భానుసారంగా מָשָׁל‌ను ‘ప్రవచన వాక్యం’ అని అనువదించాం.
- source_word: אֹוי
  choice: అయ్యో!
  rationale: ఇది భయాన్ని లేదా విలాపాన్ని వ్యక్తం చేసే ఆశ్చర్యార్థకం. ఆధునిక తెలుగులో ‘అయ్యో!’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִי יִחְיֶה
  choice: ఎవరు బ్రతకగలరు?
  rationale: అక్షరార్థంగా ‘ఎవరు బ్రతుకుతారు?’ అయినా, రాబోయే విపత్తులో ప్రాణాలతో నిలవగల సామర్థ్యాన్ని ప్రశ్నిస్తున్న సందర్భంలో ‘బ్రతకగలరు’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מִשֻּׂמוֹ אֵל
  choice: దేవుడు దీనిని జరిగించినప్పుడు
  rationale: ఈ సంక్షిప్త హీబ్రూ పదబంధం క్లిష్టమైనది. אֵל‌ను కర్తగా తీసుకొని, שׂום యొక్క ‘పెట్టడం/స్థాపించడం/కలుగజేయడం’ భావాన్ని సందర్భానుసారంగా ‘జరిగించినప్పుడు’ అని ఇచ్చాం; అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: מִשֻּׂמוֹ אֵל అనే క్లిష్టమైన చివరి పదబంధం
  choice: אֵל‌ను కర్తగా తీసుకొని ‘దేవుడు దీనిని జరిగించినప్పుడు’ అని అనువదించడం
  alternative: ‘దేవుడు దీనిని స్థాపించినప్పుడు’ లేదా మరింత అక్షరార్థంగా ‘దేవుడు దీనిని ఉంచినప్పుడు’
  rationale: హీబ్రూ వాక్య నిర్మాణం సంక్షిప్తంగా, సందిగ్ధంగా ఉంది. సందర్భంలో రాబోయే కల్లోలానికి దేవుని కార్యమే కారణమనే భావం సరిపోతుంది; అయితే ‘జరిగించినప్పుడు’ మూలంలోని שׂום భావాలన్నిటినీ పూర్తిగా నిర్ణయించదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక స్వరం ఉంచాం. ‘ప్రవచన వాక్యం’ అనేది מָשָׁל యొక్క సందర్భార్థాన్ని తెలియజేస్తుంది; ‘అయ్యో!’ విలాపం మరియు భయాన్ని సహజంగా వ్యక్తం చేస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
