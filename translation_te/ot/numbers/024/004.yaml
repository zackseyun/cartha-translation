  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: te
  text: 'దేవుని మాటలు వినేవాని ప్రకటన[a],

    సర్వశక్తిమంతుని దర్శనాన్ని చూసేవాని,

    పడిపోతూ కళ్లు తెరిచినవాని ప్రకటన[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని మాటలు వినేవాని దైవోక్తి.’ హెబ్రీ נְאֻם అనేది గంభీరమైన ప్రవచనాత్మక ఉచ్చారణను సూచించే అధికారిక పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పడిపోయి, కళ్లు తెరిచినవాని.’ హెబ్రీలో అక్షరార్థంగా కళ్లను ‘విప్పబడినవి’ లేదా ‘ఆవరణ తొలగించబడినవి’గా చిత్రిస్తుంది; ఇది దర్శనానికి సంబంధించిన రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: ప్రకటన
  rationale: గంభీరమైన ప్రవచనోక్తిని పరిచయం చేసే ఈ పదానికి ‘ప్రకటన’ సహజమైన, గౌరవప్రదమైన తెలుగు రూపం; సాధారణ ‘మాట’ కంటే దాని అధికారిక స్వరాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: దేవుని మాటలు వినేవాని
  rationale: కర్తృవాచక వర్తమాన కృదంతం వ్యక్తిని నిరంతర లక్షణంతో వర్ణిస్తుంది. ‘వినేవాని’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది; אֵל ఇక్కడ దైవ బిరుదుగా ఉన్నందున ‘దేవుడు’ అని అనువదించబడింది.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: సర్వశక్తిమంతుని దర్శనం చూసేవాని
  rationale: మూలంలోని దర్శనానుభవ భావాన్ని ‘దర్శనం’ తెలియజేస్తుంది; కవితాత్మక సమాంతరత కోసం యెహెజెహ్‌ను లక్షణాత్మక వర్తమానంగా ‘చూసేవాని’ అని ఇచ్చాం.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: ఇది దైవ బిరుదు. లిప్యంతరీకరణ చేయకుండా దాని సాంప్రదాయ అర్థాన్ని తెలిపే ‘సర్వశక్తిమంతుడు’ ఉపయోగించబడింది.
- source_word: נֹפֵל
  choice: పడిపోతూ
  rationale: కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని నిలుపుతుంది; ‘సాష్టాంగపడినవాడు’ వంటి నిర్దిష్ట శరీరభంగిమను మూలంలో లేనంతగా విధించదు.
- source_word: וּגְלוּי עֵינָיִם
  choice: అయినా కళ్లు తెరవబడినవాడై ఉంటాడు
  rationale: ‘కళ్లు బయలుపరచబడినవి/తెరవబడినవి’ అనే మూల చిత్రాన్ని నిలుపుతూ, పడిపోవడం మరియు దర్శనాత్మకంగా చూడడం మధ్యనున్న ఉద్వేగాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: వ్యక్తినామంలా లిప్యంతరీకరించకుండా దైవ బిరుదును అర్థానువాదం చేశాం. ఇది మూలంలోని బిరుదు భావాన్ని తెలియజేస్తుంది; అదనపు మతశాఖాపరమైన వివరణను చేర్చదు.
- issue: పడిపోవడం మరియు తెరవబడిన కళ్ల మధ్య సంబంధం
  choice: పడిపోతూ, అయినా కళ్లు తెరవబడినవాడై
  alternative: పడిపోతూ, కళ్లు తెరవబడినవాడై
  rationale: హెబ్రీ ו సాధారణంగా ‘మరియు’ అనే అనుసంధానాన్ని కలిగించినా, ఈ సందర్భంలో పడిపోవడం మధ్యనే దర్శనాత్మక చూపు ఉండటం విరుద్ధభావాన్ని సూచించవచ్చు. ‘అయినా’ ఆ కవితాత్మక ఉద్వేగాన్ని తెలియజేస్తుంది; దానిని సిద్ధాంతపరంగా మరింత నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక-ప్రవచన శైలి పాటించబడింది. ‘వినేవాని/చూసేవాని’ అనే సమాంతర నిర్మాణం హెబ్రీ కవితా సమతూకాన్ని నిలుపుతుంది. వాక్యం తరువాతి పద్యభాగానికి దారితీసే ప్రకటన సూత్రంలో భాగమైనందున చివర ద్విబిందువు ఉంచబడింది.
