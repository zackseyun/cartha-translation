id: NUM.24.13
reference: Numbers 24:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: te
  text: బాలాకు తన ఇల్లు నిండా వెండి బంగారం నాకు ఇస్తే, నా సొంత మనసు ప్రకారం మంచి గానీ చెడు గానీ చేయడానికి యాహ్వే నోటి మాటను[a] దాటి వెళ్లలేను. యాహ్వే ఏది పలుకుతాడో, దానినే నేను పలుకుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే నోటిని దాటి వెళ్లడం.’ అంటే, ఆయన పలికిన మాటకు మించి వెళ్లడం.
    reason: మూలంలోని ‘నోరు’ అనే రూపకాన్ని తెలియజేసే అక్షరార్థ వివరణ.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: ఇచ్చినా
  rationale: אִם తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ ఊహాత్మక షరతును సూచిస్తుంది. తెలుగు ‘ఇచ్చినా’ ఆ భావాన్ని సహజంగా, ‘అలా జరిగినప్పటికీ’ అనే concessive బలంతో వ్యక్తం చేస్తుంది.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: తన ఇల్లు నిండా వెండి బంగారాలు
  rationale: ఇల్లు వెండి బంగారాలతో నిండినదనే విస్తారమైన పారితోషికపు చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לֹא אוּכַל
  choice: దాటి వెళ్లలేను
  rationale: షరతుతో సంబంధమున్న అసమర్థతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: యాహ్వే నోటి మాటను దాటి వెళ్లడం
  rationale: ‘యాహ్వే నోరు’ అనే మూల రూపకాన్ని ‘నోటి మాట’గా నిలుపుతూ, పలికిన హద్దును అతిక్రమించడమనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ వ్యక్తినామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: మంచి గానీ చెడు గానీ చేయడానికి
  rationale: మూలంలోని నైతిక ద్వంద్వాన్ని నేరుగా, గంభీరంగా నిలుపుతుంది.
- source_word: מִלִּבִּי
  choice: నా సొంత హృదయం నుంచి
  rationale: బిలాము తనంతట తానే చర్యకు మూలం కాలేడనే వ్యత్యాసాన్ని, ‘హృదయం నుంచి’ అనే మూల చిత్రంతో కలిపి నిలుపుతుంది.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ
  choice: యాహ్వే ఏది పలుకుతాడో, దానినే
  rationale: హీబ్రూలోని సంబంధవాచక–పునరుద్ధరణ నిర్మాణాన్ని సహజమైన తెలుగు ‘ఏది… దానినే’ రూపంలో కాపాడుతుంది.
- source_word: אֲדַבֵּר
  choice: నేను పలుకుతాను
  rationale: భవిష్యత్/నిశ్చయార్థక అసంపూర్ణ క్రియను సహజంగా చూపుతూ, ముందున్న ‘పలుకుతాడో’తో పదసామ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: వచనం వ్యక్తినామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇస్తుంది.
- issue: బిలాము యొక్క పరిమితి స్వరూపం
  choice: యాహ్వే పలికిన మాటను దాటి తన సొంత ప్రేరణతో మంచి లేదా చెడు చేయలేడు
  alternative: ఆశీర్వాదం లేదా శాపాన్ని మాత్రమే మార్చలేడు
  rationale: మూలవచనం ‘మంచి లేదా చెడు’ మరియు ‘నా హృదయం నుంచి’ అని విస్తృతంగా చెబుతుంది. తక్షణ సందర్భానికి మించిన ప్రవచన సిద్ధాంతాన్ని చేర్చకుండా ఆ ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘యాహ్వే నోటి మాట’, ‘హృదయం నుంచి’, ‘పలుకుతాను’ వంటి మూల చిత్రాలు మరియు గంభీరత నిలుపబడ్డాయి. [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
