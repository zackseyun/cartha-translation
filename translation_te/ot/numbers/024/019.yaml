  edition: WLC
  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: te
  text: యాకోబు నుండి ఒకడు పరిపాలిస్తాడు[a]; అతడు పట్టణం నుండి మిగిలినవాణ్ణి[b] నాశనం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకడు అధికారం చెలాయిస్తాడు.” హీబ్రూ క్రియకు “పరిపాలించు” లేదా “అధికారం చెలాయించు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శేషాన్ని.” హీబ్రూ పదం మిగిలిన వ్యక్తిని లేదా సమష్టిగా శేషాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: ఒకడు పరిపాలిస్తాడు
  rationale: ఈ రూపం רדה (‘పరిపాలించు, అధికారం చెలాయించు’) ధాతువునుండి వచ్చినదిగా సందర్భానికి సరిపోతుంది. కర్త స్పష్టంగా లేకపోయినా, ముందున్న రాజసంబంధమైన వాక్యభాగాన్ని అనుసరించి ‘ఒకడు’ అని సహజంగా వ్యక్తపరచబడింది.
- source_word: מִיַּעֲקֹב
  choice: యాకోబులోనుండి
  rationale: מן ఉపసర్గం ఇక్కడ మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది; యాకోబు వంశం/ప్రజలలోనుండి పాలకుడు రావడాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: וְהֶאֱבִיד
  choice: అతడు ... నాశనం చేస్తాడు
  rationale: אבד ధాతువు హిఫీల్ రూపం ‘నశింపజేయు’ అనే బలమైన కారణార్థాన్ని ఇస్తుంది; ‘నాశనం చేస్తాడు’ ఆధునిక తెలుగులో స్పష్టంగా, నేరుగా ఉంది.
- source_word: שָׂרִיד
  choice: మిగిలినవాణ్ణి
  rationale: ఈ ఏకవచన నామవాచకం మిగిలిన లేదా ప్రాణాలతో తప్పించుకున్న వ్యక్తిని సూచించగలదు. ‘మిగిలినవాడు’ రూపం ఏకవచనాన్ని నిలుపుతూ, సందర్భంలో చివరగా మిగిలిన వ్యక్తి భావాన్ని ఇస్తుంది.
- source_word: מֵעִיר
  choice: పట్టణంలో
  rationale: עִיר సాధారణంగా ‘పట్టణం/నగరం.’ מן ఇక్కడ తొలగింపు లేదా పరిధి భావంలో, పట్టణంలో మిగిలినవాణ్ణి నిర్మూలించడం అని సహజ తెలుగులో ‘పట్టణంలో’ వ్యక్తమవుతుంది; ‘కోట పట్టణం’ వంటి అదనపు విశేషణం మూలంలో లేదు.
theological_decisions:
- issue: బిలాము ప్రవచనంలోని రాజసంబంధమైన లేదా మెస్సీయసంబంధమైన సూచన
  choice: వ్యక్తిని ప్రత్యేకంగా మెస్సీయ అని గుర్తించకుండా, సాధారణ రాజపాలన భాషలో అనువదించడం
  alternative: దీనిని కేవలం తక్షణ చారిత్రక రాజుగా లేదా నేరుగా మెస్సీయగా స్పష్టీకరించడం
  rationale: విస్తృత సందర్భంలో రాజసంబంధమైన వ్యక్తి కనిపిస్తున్నా, ఈ వచనం అతణ్ణి ‘మెస్సీయ’ అని స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని విస్తృత వ్యాఖ్యాన అవకాశాన్నీ theological tension‌నూ నిలుపుతూ సాధారణంగా ‘ఒకడు పరిపాలిస్తాడు’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన శైలిని ఉంచాం. ‘పరిపాలిస్తాడు,’ ‘నాశనం చేస్తాడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, మూలంలో లేని మతపరమైన గుర్తింపును చేర్చలేదు. ప్రతి పాదంలోని భవిష్యత్ భావం సహజ తెలుగు క్రియారూపాలతో వ్యక్తమైంది.
