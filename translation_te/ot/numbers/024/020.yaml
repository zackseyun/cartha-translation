source:
  edition: WLC
  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: te
  text: 'తరువాత అతడు అమాలేకును చూశాడు. తన ప్రవచనాత్మక పలుకును పలికి[b] ఇలా అన్నాడు:


    “అమాలేకు జాతులలో మొదటిది[a];

    కాని దాని అంతం నాశనమే[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జాతులలో అగ్రగామి.” హీబ్రూ మాట కాలక్రమంలో మొదటిదానినైనా, ప్రాముఖ్యంలో అగ్రస్థానంలో ఉన్నదానినైనా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తన ప్రవచన వాక్కును పలికాడు,” “తన సామెతను పలికాడు.” ఇక్కడి హీబ్రూ పదం కావ్యోక్తి, సామెత, ఎద్దేవా గీతం లేదా ప్రవచన వాక్కును సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “దాని తుదిగతి నశించడమే.” హీబ్రూ ప్రయోగం సంక్షిప్తంగా ఉండి సంపూర్ణ పతనాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: తరువాత అతడు అమాలేకును చూశాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; ראה యొక్క సాధారణ అర్థం ‘చూశాడు’. ‘తరువాత’ సహజమైన తెలుగు క్రమాన్ని తెలియజేస్తుంది.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: తన కావ్యవాక్కును పలుకుతూ
  rationale: מָשָׁל సామెత, ఎద్దేవా గీతం, కావ్యోక్తి లేదా ప్రవచన వాక్కును సూచించగలదు. బిలాము పలికిన ఉన్నత శైలిగల వాక్యాల సందర్భంలో ‘కావ్యవాక్కు’ దాని కవితాత్మక, ప్రవచన స్వభావాలను అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: רֵאשִׁית גּוֹיִם
  choice: జనాలలో ... మొదటివాడు
  rationale: רֵאשִׁית కాలక్రమంలో మొదటిదానినీ, స్థానంలో ముఖ్యమైనదానినీ సూచించగలదు. ‘మొదటివాడు’ ఆ రెండు భావాలకు వీలైనంత అవకాశం ఉంచుతుంది; పాదటిప్పణి సందిగ్ధతను స్పష్టం చేస్తుంది.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: వ్యక్తి పేరుగా కనిపించినా, ఇక్కడ ఆ పేరుతో సూచించబడిన ప్రజలను లేదా జనాన్ని సూచిస్తుంది. తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וְאַחֲרִיתוֹ
  choice: కాని అమాలేకు అంతం
  rationale: אַחֲרִית అంతం, తుదిఫలితం లేదా భవిష్యత్తులో కలిగే గతి అనే భావాలను ఇస్తుంది. ముందటి పాదంతో వ్యత్యాసాన్ని తెలుగులో ‘కాని’ సహజంగా వ్యక్తం చేస్తుంది. అస్పష్ట సర్వనామాన్ని నివారించడానికి పేరును మళ్లీ వాడాం.
- source_word: עֲדֵי אֹבֵד
  choice: నాశనమే
  rationale: హీబ్రూ ప్రయోగం సంక్షిప్తంగా ఉండి తుదిగా నశించడాన్ని సూచిస్తుంది. ‘నాశనమే’ అదే సంక్షిప్తతను, తుది భావాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘శాశ్వతంగా’ వంటి కాలసూచక పదాన్ని చేర్చదు.
theological_decisions:
- issue: ‘జనాలలో మొదటివాడు’ అనే మాటలో అమాలేకు స్థానం
  choice: కాలక్రమంలో మొదటివాడా లేక ప్రాముఖ్యంలో అగ్రగామియా అనే హీబ్రూ సందిగ్ధతను ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘జనాలలో అత్యంత పురాతనమైనది’ లేదా ‘జనాలలో అగ్రగామి’ అని ఒకే భావాన్ని నిర్ణయించడం
  rationale: వచనం స్వయంగా ఏ భావం ఉద్దేశించబడిందో వివరించదు. అందువల్ల చారిత్రక లేదా వేదాంతపరమైన నిర్ణయాన్ని అనువాదంలోకి చేర్చకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కావ్యశైలిని ఉపయోగించాం. హీబ్రూ పాదాల సంక్షిప్తతను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. ‘కావ్యవాక్కు’ అరుదైన సాంకేతిక పదం కాకుండా మషాల్ అనే బహుఅర్థక ప్రక్రియను విస్తృతంగా సూచిస్తుంది.
