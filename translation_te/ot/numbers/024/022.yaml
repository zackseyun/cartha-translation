  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: te
  text: కయీను[a] కాల్చివేయబడవలసి ఉంటే, అష్షూరు[b] నిన్ను చెరగా తీసుకుపోయే వరకు ఇంకా ఎంతకాలం?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘కయీను’ అనే పేరు వ్యక్తియైన కయీనుకన్నా కేనీయులను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: సందర్భంలో ‘అష్షూరు’ అంటే ‘అష్షూరు దేశం’ లేదా ‘అష్షూరీయుడు/అష్షూరీయ శక్తి’ కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: అయితే
  rationale: ఈ సంయోగం ముందున్న ప్రవచనంతో సంబంధాన్ని కొనసాగిస్తూ వివరణాత్మక లేదా వ్యతిరేక మలుపును సూచిస్తుంది. తెలుగు వాక్యంలో ‘అయితే’ ఆ అనుసంధానాన్ని సహజంగా ఉంచుతుంది; షరతు భావం సాధ్యమైనప్పటికీ దానిని అతిగా నిర్ధారించదు.
- source_word: יִהְיֶה לְבָעֵר
  choice: దహనానికి గురవుతాడు
  rationale: ‘కాల్చివేయబడే స్థితికి రావడం/దహనానికి కావడం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ఇది అగ్ని రూపకాన్ని నిలుపుతూ, దానిని కేవలం సాధారణ ‘నాశనం’గా మార్చదు.
- source_word: קָיִן
  choice: కయీను
  rationale: హీబ్రూ రూపాన్ని వ్యక్తినామంలా లిప్యంతరీకరించాం. సందర్భంలో ఇది కేనీయుల సమూహాన్ని సూచించే అవకాశం ఉన్నందున ఆ విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: עַד מָה
  choice: ఇంకా ఎంతకాలం
  rationale: కాలవ్యవధిని ప్రశ్నించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. తరువాతి క్రియతో కలిపి ‘అది జరగడానికి ఇంకా ఎంతకాలం?’ అనే భావం వస్తుంది.
- source_word: אַשּׁוּר
  choice: అష్షూరు
  rationale: మూలంలోని సొంత పేరును లిప్యంతరీకరించాం. సందర్భానుసారం ఇది అష్షూరు దేశాన్ని లేదా అష్షూరీయ అధికారాన్ని సూచించవచ్చని పాదటిప్పణిలో ఉంచాం.
- source_word: תִּשְׁבֶּךָּ
  choice: నిన్ను చెరగా తీసుకుపోవడానికి
  rationale: שבה అనే క్రియలోని పట్టుకొని చెరగా తరలించే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; కేవలం ‘పట్టుకోవడం’ కంటే ప్రవాసం/చెర భావాన్ని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: మొదటి భాగం షరతా లేక వ్యతిరేక ప్రకటననా
  choice: ‘అయితే’తో వ్యతిరేక/సంధాన భావాన్ని నిలిపి, ‘కయీను దహనానికి గురవుతాడు’ అని ప్రత్యేక ప్రకటనగా అనువదించాం.
  alternative: ‘ఎందుకంటే కయీను దహనానికి గురికావలసి ఉంటే’ అని షరతు వాక్యంగా చదవవచ్చు.
  rationale: మసొరా విరామచిహ్న నిర్మాణం మొదటి భాగాన్ని ఒక సంపూర్ణ ప్రకటనగా చూడటానికి అనుకూలిస్తుంది; అయితే כִּי אִם కు షరతు భావం కూడా సాధ్యమే. ప్రధాన పాఠ్యంలో సహజమైన ప్రకటనను ఇచ్చి, భావాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘దహనం’ మూలంలోని అగ్ని చిత్రాన్ని నిలుపుతుంది; ‘చెరగా తీసుకుపోవడం’ బందీగా పట్టుకొని తరలించే భావాన్ని స్పష్టపరుస్తుంది. రెండు పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పేర్ల వెంట ఉంచబడ్డాయి.
