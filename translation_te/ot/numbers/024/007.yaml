source:
  edition: WLC
  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: te
  text: అతని బొక్కెనల నుండి నీళ్లు ప్రవహిస్తాయి[a]; అతని విత్తనం విస్తారమైన జలాల్లో ఉంటుంది[b]. అతని రాజు అగాగు కంటే ఉన్నతంగా ఉంటాడు; అతని రాజ్యం ఉన్నతమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ నామవాచకాన్ని సాధారణ అర్థమైన ‘బొక్కెనలు’ కాక రూపకంగా తీసుకుంటే, ‘అతని కొమ్మల నుండి’ అని ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని విత్తనం’ అనే మాటను ‘అతని సంతానం’ లేదా ‘అతని వంశస్థులు’ అని కూడా అర్థం చేసుకోవచ్చు; హీబ్రూ పదం సంతానాన్నీ సారవంతత దృశ్యాన్నీ ఒకేసారి ప్రతిధ్వనింపజేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: ప్రవహిస్తాయి
  rationale: ద్రవం కారడం లేదా ప్రవహించడం అనే క్రియాభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘బొట్లు బొట్లుగా కారడం’ అని పరిమితం చేయదు.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: హీబ్రూలో రూపపరంగా బహువచనమైనా, సాధారణ ఆధునిక తెలుగులో ఈ సందర్భానికి ‘నీళ్లు’ సహజం.
- source_word: מִדָּלְיוֹ
  choice: అతని బొక్కెనల నుండి
  rationale: דלי అనే నామవాచకానికి సాధారణ అర్థం నీళ్లు తోడే బొక్కెన లేదా బకెట్. నీటి దృశ్యానికి సరిపడే ప్రాథమిక అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచింది.
- source_word: וְזַרְעוֹ
  choice: అతని విత్తనం
  rationale: זֶרַע విత్తనాన్నీ, సంతానాన్నీ సూచించగలదు. ‘విత్తనం’ కవితాత్మక వ్యవసాయ-సంతాన ద్వంద్వార్థాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: בְּמַיִם רַבִּים
  choice: సమృద్ధిగా ఉన్న జలాల్లో
  rationale: బహుళమైన లేదా విస్తారమైన జలాల మధ్య ఉన్న సమృద్ధి దృశ్యాన్ని తెలుగులో స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తుంది; בְ యొక్క ‘లో’ భావాన్ని నిలుపుతుంది.
- source_word: וְיָרֹם מֵאֲגַג
  choice: అగగు కంటే ఉన్నతంగా ఉంటాడు
  rationale: רוּם యొక్క ఎత్తు/ఔన్నత్య భావాన్నీ, מן యొక్క తులనాత్మక భావాన్నీ నేరుగా నిలుపుతుంది.
- source_word: מַלְכּוֹ
  choice: అతని రాజు
  rationale: מֶלֶךְ యొక్క సాధారణ అర్థం ‘రాజు’; ఆ రాజు ఎవరో అనువాదంలో నిర్దేశించలేదు.
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: అతని రాజ్యం ఘనంగా హెచ్చింపబడుతుంది
  rationale: రాజ్యం పైకెత్తబడటం, గొప్పదిగా చేయబడటం అనే నిఫాల్ భావాన్ని గంభీరమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘అతని విత్తనం’ యొక్క సూచన
  choice: వ్యవసాయ విత్తనం, సంతానం, లేదా రెండింటి ప్రతిధ్వని సాధ్యమయ్యేలా ‘విత్తనం’ అని ఉంచడం
  alternative: అతని సంతానం / అతని వంశస్థులు
  rationale: హీబ్రూ זרע రెండు భావాలనూ మోయగలదు; కవిత్వంలోని ఉద్దేశపూర్వక సమృద్ధిని ఒక్క అర్థానికి కుదించలేదు.
- issue: ‘అతని రాజు’ ఎవరు, అగగుతో సంబంధం ఏమిటి
  choice: ‘అతని రాజు అగగు కంటే ఉన్నతంగా ఉంటాడు’ అని నిర్దిష్ట గుర్తింపు లేకుండా అనువదించడం
  alternative: సౌలు, దావీదు, మెస్సీయ, లేదా ఇశ్రాయేలు భవిష్యత్ రాజరికానికి స్పష్టమైన సూచనగా పేర్కొనడం
  rationale: మూలవచనం రాజును పేరుతో గుర్తించదు; అందువల్ల తరువాతి ధార్మిక నిర్ధారణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గంభీరతను నిలిపే శైలి. ‘బొక్కెనలు’ గ్రామీణ నీళ్లు తోడే పాత్రకు సుపరిచితమైన పదం; ‘జలాలు’ రెండో పాదంలో కవితాత్మక వైవిధ్యాన్ని ఇస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
