revisions:
- from: అతని బొక్కెనల నుండి నీళ్లు ప్రవహిస్తాయి[a]; అతని విత్తనం సమృద్ధిగా ఉన్న జలాల్లో ఉంటుంది[b]. అతని రాజు అగగు కంటే ఉన్నతంగా ఉంటాడు; అతని రాజ్యం ఘనంగా హెచ్చింపబడుతుంది.
  to: అతని బొక్కెనల నుండి నీళ్లు ప్రవహిస్తాయి[a]; అతని విత్తనం విస్తారమైన జలాల్లో ఉంటుంది[b]. అతని రాజు అగాగు కంటే ఉన్నతంగా ఉంటాడు; అతని రాజ్యం ఉన్నతమవుతుంది.
  rationale: The revision improves precision for ‘many/great waters,’ idiomatic Telugu for the kingdom’s exaltation, the spelling of Agag, and footnote style. It retains the source’s poetic ambiguity concerning ‘seed’ and does not identify the king or impose a theological interpretation. Footnote anchors remain attached to the relevant expressions.
