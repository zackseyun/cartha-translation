  to: 'అప్పుడు అతడు తన ప్రవచనాన్ని ప్రారంభించి ఇలా అన్నాడు:


    “బెయోరు కుమారుడైన బిలాము ప్రకటన;


    కన్ను తెరవబడిన[a] మనిషి ప్రకటన:”'
  rationale: ‘తన ప్రవచనాన్ని ప్రారంభించి’ נשׂא משל అనే అధికారిక ప్రవచన-ప్రారంభ సూత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తర్వాతి ‘ఇలా అన్నాడు’ వాక్యంతో మూలంలోని రెండు క్రియల క్రమం స్పష్టంగా ఉంటుంది. మిగతా పదప్రయోగాలు మూలానికీ, ఆంగ్ల పరిశీలనా పాఠానికీ సరిపోతున్నాయి.
