source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: te
  text: 'అప్పుడు అతడు తన ప్రవచనాన్ని ప్రారంభించి ఇలా అన్నాడు:


    “బెయోరు కుమారుడైన బిలాము ప్రకటన;


    కన్ను తెరవబడిన[a] మనిషి ప్రకటన:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కన్ను మూయబడిన.” ఈ హీబ్రూ పదబంధం క్లిష్టమైనది; దీనిని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: తన కావ్యోక్తిని పలికి
  rationale: నָשָׂא + מָשָׁל ఇక్కడ లాంఛనప్రాయమైన కవితాత్మక ప్రవచనాన్ని ప్రారంభించే ప్రయోగం. ‘కావ్యోక్తి’ పదం సామెత లేదా ఉపమానం అనే అర్థానికి పరిమితం కాకుండా ఈ సందర్భంలోని కవితాత్మక ప్రకటనను తెలియజేస్తుంది; ‘పలికి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: ఉటంకించబడే మాటలను పరిచయం చేసే సాధారణ కథన రూపాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: נְאֻם
  choice: ప్రకటన
  rationale: గంభీరమైన, అధికారపూర్వక ఉక్తిని సూచిస్తుంది. మూలంలో రెండుసార్లు ఉన్న పదాన్ని తెలుగులోనూ ఒకే విధంగా అనువదించాం.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: బెయోరు కుమారుడైన బిలాము
  rationale: వ్యక్తిపేర్లను ప్రామాణిక తెలుగు రూపాల్లో లిప్యంతరీకరించి, హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగులో ఇచ్చాం.
- source_word: הַגֶּבֶר
  choice: మనిషి
  rationale: ఈ సందర్భంలో పురుష వ్యక్తిని సూచించే సాధారణ అర్థమే ప్రధానమైనది; బలం అనే సంభావ్య ఛాయను అనవసరంగా ముందుకు తేవలేదు.
- source_word: שְׁתֻם הָעָיִן
  choice: కన్ను తెరవబడిన
  rationale: ఈ క్లిష్టమైన పదబంధాన్ని 16వ వచనంలోని దర్శన సంబంధ సందర్భానికి అనుగుణంగా గ్రహణశక్తి తెరవబడినదనే భావంతో అనువదించాం. హీబ్రూ రూపానికి ‘మూయబడిన’ అనే అర్థం కూడా ప్రతిపాదించబడినందున దాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: బిలాము స్వవర్ణనలోని שְׁתֻם הָעָיִן అర్థం
  choice: దర్శన సంబంధ గ్రహణాన్ని సూచించేలా ‘కన్ను తెరవబడిన’
  alternative: ‘కన్ను మూయబడిన’ లేదా ‘మూసిన కన్నుగల’
  rationale: సమీప సాహిత్య సందర్భం బిలామును దేవుని దర్శనాలు చూసేవాడిగా, కళ్లు తెరవబడినవాడిగా వర్ణిస్తుంది. అయినా హీబ్రూ పదబంధం వివాదాస్పదమైనందున ప్రత్యామ్నాయ అర్థాన్ని తొలగించకుండా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచనంలోని గంభీరమైన కవితాత్మక స్వరాన్ని నిలుపుతూ రూపొందించబడింది. మూలంలోని పునరుక్తి మరియు పంక్తి నిర్మాణం సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
