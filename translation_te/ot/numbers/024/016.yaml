- from: 'దేవుని మాటలు వినేవాని ప్రకటన[a]; మహోన్నతుని జ్ఞానాన్ని ఎరిగినవాని ప్రకటన; సర్వశక్తిమంతుని దర్శనాన్ని చూసేవాని ప్రకటన; అతడు పడిపోతూ[b], అయినా కళ్లు తెరవబడినవాడై ఉన్నాడు:'
  to: 'దేవుని మాటలు వినేవాడు, మహోన్నతుని జ్ఞానాన్ని తెలిసినవాడు, సర్వశక్తిమంతుని దర్శనాన్ని దర్శించేవాడు, పడిపోతూ కళ్లు తెరచి ఉన్నవాడు పలికిన ప్రకటన[a]:'
  rationale: నְאֻםను ఒక్కసారి మాత్రమే ఉంచి, దానికి అనుసంధానమైన మూడు సమాంతర స్వీయవర్ణనలను ఒకే వాక్యనిర్మాణంలో నిలిపాం. చివరి భాగంలో మూలంలోని సాధారణ సమన్వయాన్ని కాపాడటానికి ‘అయినా’ను తొలగించాం. ‘పడిపోతూ’ అనే ప్రధాన పాఠం నֹפֵל యొక్క ప్రత్యక్ష భావాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ నిర్మాణం మరియు సాధ్యమైన దర్శన-స్థితి వ్యాఖ్యానం పాదటిప్పణిలో ఉన్నాయి.
