  terminology: దేవుడు, మహోన్నతుడు, సర్వశక్తిమంతుడు అనే దైవిక బిరుదులు సముచితమైనవి. ‘దైవోక్తి’ పాదటిప్పణిలో నְאֻם‌కు సరైన ప్రత్యామ్నాయం. ‘కళ్లు తెరచి ఉన్నవాడు’ గలוי עינים అనే ‘వెల్లడైన/తెరచిన కళ్లుగల’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
