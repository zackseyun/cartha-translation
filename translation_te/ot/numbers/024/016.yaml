  source_fidelity: ముసాయిదా ప్రధాన భావాలను సరిగ్గా అందిస్తుంది; అయితే נְאֻם (‘ప్రకటన/దైవోక్తి’) మొత్తం సమాంతర స్వీయవర్ణనను పరిచయం చేసే ఒక్క పదం మాత్రమే. దానిని ప్రతి ఉపవాక్యానికీ పునరావృతం చేయడం హీబ్రూ నిర్మాణాన్ని మార్చుతుంది. అలాగే చివరి וּ (‘మరియు’)ను ‘అయినా’గా చేయడం మూలంలో స్పష్టంగా లేని విరోధార్థాన్ని కలుపుతుంది.
