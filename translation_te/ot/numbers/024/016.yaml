id: NUM.24.16
reference: Numbers 24:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: te
  text: 'దేవుని మాటలు వినేవాడు, మహోన్నతుని జ్ఞానాన్ని తెలిసినవాడు, సర్వశక్తిమంతుని దర్శనాన్ని దర్శించేవాడు, పడిపోతూ కళ్లు తెరచి ఉన్నవాడు పలికిన ప్రకటన[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని పలుకులు వినేవాడు పలికిన దైవోక్తి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: ప్రకటన
  rationale: గంభీరమైన ప్రవచన ఉచ్చారణను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: שֹׁמֵעַ
  choice: వినేవాని
  rationale: నామవాచక విధిలో ఉన్న వర్తమాన కృదంతపు నిరంతర లక్షణ భావాన్ని నిలుపుతుంది.
- source_word: אִמְרֵי אֵל
  choice: దేవుని మాటలు
  rationale: దేవుడు పలికిన మాటలు అనే నిర్మాణార్థాన్ని సరళంగా, సహజంగా అందిస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇది లిప్యంతరీకరించాల్సిన వ్యక్తినామం కాక, దేవుణ్ణి సూచించే బిరుదు.
- source_word: וְיֹדֵעַ
  choice: ఎరిగినవాని
  rationale: ముందున్న కృదంతంతో సమాంతరమైన స్వీయవర్ణనను తెలుగులో కవితాత్మకంగా నిలుపుతుంది.
- source_word: דַּעַת עֶלְיוֹן
  choice: మహోన్నతుని జ్ఞానం
  rationale: ఈ జ్ఞానం మహోన్నతునికి చెందినదా లేక ఆయననుంచి వచ్చినదా అనే మూలంలోని సంక్షిప్తతను, సాధ్యమైన సందిగ్ధతను నిలుపుతుంది.
- source_word: עֶלְיוֹן
  choice: మహోన్నతుడు
  rationale: దైవిక బిరుదులోని అత్యున్నత స్థితి భావాన్ని సహజమైన తెలుగు బిరుదుతో వ్యక్తం చేస్తుంది.
- source_word: מַחֲזֵה
  choice: దర్శనం
  rationale: ప్రవచనాత్మకంగా కనిపించే దృశ్యం లేదా బయల్పాటును సూచించే సహజమైన తెలుగు పదం.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవిక బిరుదును దాని అర్థంతో అనువదిస్తుంది.
- source_word: יֶחֱזֶה
  choice: చూసేవాని
  rationale: కవితలోని ఇతర కృదంత వాక్యభాగాలతో సమాంతరతను కలిగిస్తూ దర్శన అనుభవాన్ని స్పష్టంగా చెబుతుంది.
- source_word: נֹפֵל
  choice: పడిపోతూ
  rationale: మూలంలోని 'పడడం' అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; దర్శన మైమరపు అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וּגְלוּי עֵינָיִם
  choice: అయినా కళ్లు తెరవబడినవాడై
  rationale: కళ్లపై ఆవరణ తొలగించబడినదనే హీబ్రూ రూపకాన్ని నిలుపుతూ, పడిపోవడం మరియు చూడగలగడం మధ్య భావవ్యతిరేకతను తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: אֵל, עֶלְיוֹן, שַׁדַּי అనే దైవిక బిరుదుల అనువాదం
  choice: దేవుడు / మహోన్నతుడు / సర్వశక్తిమంతుడు
  alternative: ఏల్ / ఎల్యోను / షద్దయి
  rationale: ఇక్కడ ఇవి వ్యక్తినామాలుగా కాక దైవిక బిరుదులుగా పనిచేస్తున్నందున, వాటి అర్థాన్ని తెలుగులో అందించడం సముచితం.
- issue: נֹפֵל ను దర్శన మైమరపుగా వ్యాఖ్యానించాలా
  choice: పడిపోతూ
  alternative: దర్శన మైమరపులో ఉండి
  rationale: హీబ్రూ పదం ప్రత్యక్షంగా 'పడడం' అని చెబుతుంది. దర్శన మైమరపు అనేది సాధ్యమైన వ్యాఖ్యానం మాత్రమే కనుక దానిని పాదటిప్పణిలో ఉంచడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. 'ప్రకటన' పదాన్ని పునరావృతం చేయడం ద్వారా హీబ్రూ ప్రవచన సూత్రానికి తెలుగు వాక్యనిర్మాణంలో స్పష్టత కల్పించబడింది.
