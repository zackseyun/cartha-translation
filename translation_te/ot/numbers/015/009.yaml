  yaml_path: translation/ot/numbers/015/009.yaml
  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: te
  text: అప్పుడు ఆ కోడె ఎద్దుతో పాటు, అర హీను నూనెతో కలిపిన ఏఫాలో మూడు పదవ వంతుల[a] సన్నని పిండిని ధాన్యార్పణంగా అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మూడు పదవ వంతులు’; ఈ బలిసంబంధ కొలత సందర్భంలో ఏఫాలో మూడు పదవ వంతులని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: అప్పుడు ... అర్పించాలి
  rationale: హిఫిల్ రూపం బలిసంబంధ సందర్భంలో దగ్గరకు తీసుకురావడం లేదా అర్పించడం అనే భావాన్ని ఇస్తుంది; వావ్ క్రమాన్ని సూచిస్తున్నందున ‘అప్పుడు’ సహజంగా ఉంది.
- source_word: עַל בֶּן הַבָּקָר
  choice: ఆ కోడెతో పాటు
  rationale: עַל ఇక్కడ స్థలార్థం కాక, జంతుబలితో కూడి వచ్చే ధాన్యార్పణను సూచిస్తుంది. בֶּן הַבָּקָר బలికి తగిన గోవంశపు మగ జంతువును సూచించే నుడికారం; ఆధునిక తెలుగులో ‘కోడె’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణగా
  rationale: యాజక బలి నియమాల్లో ఇది సాధారణ కానుకను కాక ధాన్యంతో చేసే ప్రత్యేక అర్పణను సూచిస్తుంది.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: బలులలో వాడే మెత్తగా శుద్ధి చేసిన పిండిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: మూడు పదవ వంతుల ఏఫా
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మూడు పదవ వంతులు’; ఈ బలిసంబంధ కొలతలో ఏఫా అనే ఆధార ప్రమాణం అధ్యాహారంగా ఉంది. దానిని పాఠ్యంలో చేర్చడం కొలతను స్పష్టం చేస్తుంది.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెను పిండితో కలపడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חֲצִי הַהִין
  choice: అర హీను
  rationale: ప్రాచీన ద్రవ కొలతను ఊహాత్మక ఆధునిక మార్పిడి చేయకుండా లిప్యంతరీకరించి మూలపాఠ ప్రత్యేకతను నిలుపుతుంది.
