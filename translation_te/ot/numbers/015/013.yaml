source:
  edition: WLC
  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: te
  text: స్వదేశంలో పుట్టిన ప్రతి వ్యక్తి యాహ్వేకు ఇంపైన సువాసనగా అగ్న్యర్పణను సమర్పించడానికి ఈ సంగతులన్నిటినీ ఈ విధంగా చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగ్నితో అర్పించే అర్పణను.’ హెబ్రీ పదం అగ్నితో సమర్పించే బలి సంబంధిత అర్పణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: దేశంలో పుట్టిన ప్రతి వ్యక్తి
  rationale: సందర్భంలో పరదేశికి భిన్నంగా, ఇశ్రాయేలు సమాజంలో స్వదేశీయుడైన వ్యక్తిని సూచిస్తుంది. హెబ్రీ ఏకవచన పుంలింగ రూపం న్యాయనియమంలో ప్రతినిధ్యార్థకంగా ఉంది; తెలుగులో ‘ప్రతి వ్యక్తి’ ఆ సాధారణ వర్తింపును సహజంగా తెలియజేస్తుంది.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: వీటిని ఈ విధంగానే చేయాలి
  rationale: అసంపూర్ణ క్రియారూపానికి ఇక్కడ నియమాత్మక భావం ఉంది. ‘చేయాలి’ ఆధునిక తెలుగులో ఆ విధిబద్ధతను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘ఈ విధంగానే’ నిర్దేశించిన పద్ధతిని నిలుపుతుంది.
- source_word: לְהַקְרִיב
  choice: సమర్పించడానికి
  rationale: బలి సందర్భంలో ఈ క్రియకు అర్పణను దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడం అనే భావం ఉంది.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఇది బలుల సందర్భంలోని సాంకేతిక పదం. ‘దహనబలి’ అని అనువదిస్తే ప్రత్యేకమైన עֹלָה బలితో కలిసిపోయే ప్రమాదం ఉంది; అందువల్ల అగ్నితో అర్పించే అర్పణ అనే విస్తృత భావాన్ని ఉంచాం.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: దేవునికి ఆమోదయోగ్యమైన అర్పణను సూచించే స్థిరమైన బలి సంబంధిత నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హెబ్రీ దైవనామమైన יהוהను సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: הָאֶזְרָח లోని వ్యాకరణ పుంలింగ ఏకవచనం
  choice: ప్రతి వ్యక్తి
  alternative: ప్రతి స్వదేశీయుడు
  rationale: ఈ న్యాయనియమంలో పుంలింగ ఏకవచనం ప్రతినిధ్యార్థకంగా సమాజంలోని ప్రతి స్వదేశీయునికి వర్తిస్తుంది. ‘వ్యక్తి’ ఆ సాధారణ పరిధిని తెలియజేస్తూ, మూలంలో లేని పురుషులకు మాత్రమే పరిమితమైన భావాన్ని కలిగించదు.
- issue: אִשֵּׁה అనే బలి పదం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: అగ్న్యర్పణ
  rationale: పదం అగ్నితో సంబంధించిన అర్పణను సూచిస్తుంది; దానిని ‘ఆహార అర్పణ’గా మాత్రమే నిర్ణయించడం మూలంలోని భావసందిగ్ధతను తగ్గిస్తుంది. వివరణాత్మక తెలుగు ఎంపిక ప్రత్యేక బలి రకంతో గందరగోళాన్ని నివారిస్తుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయనియమ శైలిని వాడాం. వాక్యక్రమాన్ని తెలుగు సహజత్వానికి అనుగుణంగా మార్చినా, ‘వీటిని ఈ విధంగానే చేయాలి’ అనే మూలంలోని విధానాత్మక బలాన్ని నిలిపాం.
