source:
  edition: WLC
  text: תּוֹרָ֥ה אַחַ֛ת וּ/מִשְׁפָּ֥ט אֶחָ֖ד יִהְיֶ֣ה לָ/כֶ֑ם וְ/לַ/גֵּ֖ר הַ/גָּ֥ר אִתְּ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: te
  text: మీకు, మీతో నివసిస్తున్న పరదేశికి ఒకే ధర్మశాస్త్రం, ఒకే న్యాయవిధానం ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నివాస పరదేశి.’ హీబ్రూ పదం גֵּר ఇశ్రాయేలు సమాజ నిబంధనల కింద వారి మధ్య నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: ఈ న్యాయసందర్భంలో ఇది సాధారణ బోధను కాక బద్ధమైన దైవనియమాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ తెలుగు బైబిలు వాడుకలో సహజంగా ఉండి, చట్టబద్ధ భావాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁפָּט
  choice: విధి
  rationale: ఇది నిర్ణయించబడిన న్యాయనియమం లేదా ఆచరణ ప్రమాణాన్ని సూచిస్తుంది. ‘విధి’ దాని నియమాత్మక భావాన్ని నిలుపుతూ תּוֹרָה నుండి పదపరంగా వేరు చేస్తుంది.
- source_word: אַחַת / אֶחָד
  choice: ఒకే
  rationale: రెండుసార్లు వచ్చిన సంఖ్యావాచకం ఒకే ప్రమాణం వర్తిస్తుందనే సమానత్వాన్ని నొక్కిచెబుతుంది; తెలుగు సహజత్వంతో పాటు ఆ పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియ భవిష్యత్ అంచనాను కాక న్యాయపరమైన ఆదేశాన్ని వ్యక్తం చేస్తుంది; ‘ఉండాలి’ ఆ నియమాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచించడానికి ‘పరదేశి’ సంక్షిప్తమైన, గౌరవప్రదమైన పదం. దాని ప్రత్యేక సామాజిక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: הַגָּר
  choice: నివసించే
  rationale: ఈ కృదంతం పరదేశి వారితో స్థిరంగా నివసిస్తున్నాడనే భావాన్ని ఇస్తుంది. హీబ్రూలోని సమానమూల పదప్రయోగాన్ని తెలుగులో యథాతథంగా పునరుత్పత్తి చేయడం అసహజం కాబట్టి అర్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: אִתְּכֶם
  choice: మీతో
  rationale: హీబ్రూ ఉపసర్గకు నేరుగా సరిపోతూ, ఆ వ్యక్తి సమాజంతో కలిసి నివసిస్తున్నాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: స్థానిక ఇశ్రాయేలీయులకు, వారితో నివసించే పరదేశులకు వర్తించే న్యాయ ప్రమాణం
  choice: ఇద్దరికీ ఒకే ధర్మశాస్త్రం, ఒకే విధి ఉండాలని వాక్యం చెప్పే విస్తృత రూపాన్ని నిలుపుకున్నాం.
  alternative: ఈ సమానత్వాన్ని సమీప సందర్భంలోని బలి నియమాలకు మాత్రమే స్పష్టంగా పరిమితం చేయవచ్చు.
  rationale: వచన పదాలు విస్తృతంగా ఉన్నా అవి నిర్దిష్ట న్యాయవిభాగంలో వస్తాయి. అనువాదం ఆ విస్తృత ప్రకటనను యథాతథంగా ఉంచి, దాని పరిధిని అనవసరంగా విస్తరించదు లేదా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. హీబ్రూలో ‘ఒకటి/ఒకడు’ అనే రూపాల పునరుక్తిని తెలుగులో ‘ఒకే ... ఒకే ...’గా నిలిపి, సమాన ప్రమాణంపై ఉన్న ఉద్ఘాటనను కాపాడాం.
