  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: te
  text: నేను మీ దేవుడైన యాహ్వేను; మీ దేవుడిగా ఉండటానికి మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను.[a] నేను మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “మీకు దేవుడిగా ఉండటానికి.”'
    reason: హీబ్రూలోని లె- నిర్మాణం అక్షరార్థంగా ‘మీకు దేవుడిగా’ అని ఉంది; ప్రధాన పాఠ్యంలో సహజమైన సంబంధాత్మక రూపం వాడబడింది.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపపరంగా బహువచనమైనప్పటికీ, ఇక్కడ ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది; అందువల్ల సందర్భానుసారంగా ఏకవచనం వాడాం.
- source_word: הוֹצֵאתִי
  choice: బయటకు తీసుకొచ్చిన
  rationale: יצא హిఫిల్ రూపంలోని కారణార్థక భావాన్ని, నిర్గమన సూత్రవాక్యానికి సహజమైన ఆధునిక తెలుగు ప్రయోగంతో తెలిపాం.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: ‘దేశం’ అనే మూలపదాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి సహజంగా అనువదించాం.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: మీకు దేవుడిగా ఉండటానికి
  rationale: ‘మీకు దేవుడిగా ఉండటం’ అనే హీబ్రూ సంబంధసూత్రాన్ని నేరుగా నిలిపి, ఒడంబడిక సంబంధ భావాన్ని కాపాడాం.
- source_word: אֲנִי
  choice: నేనే
  rationale: క్రియలేని హీబ్రూ వాక్యంలో ఉన్న బలమైన స్వీయ-గుర్తింపును తెలుగులో సహజంగా ‘నేనే’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవిక నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים అనే ఒడంబడిక సూత్రం
  choice: మీకు దేవుడిగా ఉండటానికి
  alternative: మీ దేవుడిగా ఉండటానికి
  rationale: హీబ్రూలోని ‘మీకు దేవుడిగా’ అనే నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సంబంధాత్మకమైన ఒడంబడిక భావాన్ని అనవసరంగా కుదించకుండా ఉంచాం.
- issue: నిర్గమన ఉద్దేశాన్ని తెలిపే לִהְיוֹת
  choice: ఉండటానికే అలా చేశాను
  alternative: ఉండటానికి
  rationale: లామెద్‌తో కూడిన అనంతక్రియ ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ఉద్దేశ భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం; ఆ అర్థసూక్ష్మతను పాదటిప్పణిలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన ఒడంబడిక శైలిని అనుసరించాం. ‘ఐగుప్తు’ అనే స్థిరపడిన బైబిలు స్థలనామాన్ని, దైవనామానికి ‘యెహోవా’ రూపాన్ని వాడాం. రెండు సార్లు వచ్చే స్వీయ-గుర్తింపు సూత్రాన్ని ‘మీ దేవుడైన యెహోవాను నేనే’గా సమాంతరంగా నిలిపాం.
