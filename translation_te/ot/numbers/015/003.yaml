revisions:
- from: మీరు పశువుల మందలో నుంచైనా, గొర్రెమేకల మందలో నుంచైనా తీసుకొని, యెహోవాకు ఇంపైన సువాసన కలిగేలా దహనబలినిగానీ మరొక బలినిగానీ అగ్న్యర్పణగా[a] అర్పించవచ్చు. మొక్కుబడిని తీర్చడానికైనా, స్వేచ్ఛార్పణగానైనా, మీ నియమిత సమయాల్లో[b] అయినా దాన్ని అర్పించవచ్చు.
  to: మీరు యెహోవాకు అగ్న్యర్పణను—దహనబలినిగానీ బలినిగానీ—అర్పించి, మొక్కుబడిని నెరవేర్చడానికైనా, స్వచ్ఛంద అర్పణగానైనా, లేదా మీ నియమిత సమయాల్లోనైనా, పశువుల మందనుండిగానీ గొర్రెలమేకల మందనుండిగానీ యెహోవాకు ఇంపైన సువాసన కలిగించడానికి అర్పించినప్పుడు,
  rationale: The revision removes unsupported permission language and the added anaphoric object, restores a single conditional legislative sequence, and retains the source’s alternatives without treating זֶבַח as merely ‘another’ sacrifice. It preserves the open scope of ‘appointed times’ and the sacrificial metaphor of a pleasing aroma.
