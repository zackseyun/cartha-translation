id: NUM.15.3
reference: Numbers 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: te
  text: మీరు యెహోవాకు అగ్న్యర్పణను—దహనబలినిగానీ బలినిగానీ—అర్పించి, మొక్కుబడిని నెరవేర్చడానికైనా, స్వచ్ఛంద అర్పణగానైనా, లేదా మీ నియమిత సమయాల్లోనైనా, పశువుల మందనుండిగానీ గొర్రెలమేకల మందనుండిగానీ యెహోవాకు ఇంపైన సువాసన కలిగించడానికి అర్పించినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: అగ్న్యర్పణగా అర్పించవచ్చు
  rationale: సాధారణ క్రియ అయిన עשה బలి సందర్భంలో ‘అర్పించడం’ అనే భావాన్ని ఇస్తుంది; אִשֶּׁה అగ్నిలో అర్పించే బలిని సూచించే ఆరాధనా పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సాధారణంగా తెలిసిన ‘యెహోవా’ రూపంతో అందించింది.
- source_word: עֹלָה אוֹ זֶבַח
  choice: దహనబలినిగానీ మరొక బలినిగానీ
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలి; זֶבַח ఇక్కడ దానికి భిన్నమైన సాధారణ బలిని సూచిస్తుంది. తెలుగులో అనవసర పునరుక్తి లేకుండా ఈ వ్యత్యాసాన్ని చూపింది.
- source_word: לְפַלֵּא נֶדֶר
  choice: మొక్కుబడిని తీర్చడానికి
  rationale: మొక్కుకున్న బలిని నెరవేర్చే చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִנְדָבָה
  choice: స్వేచ్ఛార్పణగా
  rationale: బాధ్యత లేదా మొక్కుబడి వల్ల కాకుండా స్వచ్ఛందంగా ఇచ్చే బలికి సంక్షిప్తమైన ఆరాధనా పదం.
- source_word: בְּמֹעֲדֵיכֶם
  choice: మీ నియమిత సమయాల్లో
  rationale: מוֹעֵד అనే పదానికి ఉన్న విస్తృత భావాన్ని నిలుపుతుంది; అది నియమిత పండుగ సందర్భాలను కూడా సూచించగలదు.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: యెహోవాకు ఇంపైన సువాసన కలిగేలా
  rationale: బలి సందర్భంలోని రూపకాన్ని సహజంగా ఉంచుతూ, దేవుణ్ణి శాంతింపజేసే యాంత్రిక భావాన్ని అదనంగా చేర్చదు.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: పశువుల మందలో నుంచైనా, గొర్రెమేకల మందలో నుంచైనా
  rationale: בקר పెద్ద పశువులను, צאן గొర్రెలు-మేకలతో కూడిన చిన్న పశువుల మందను సూచిస్తాయి; రెండవ పదపు పరిధిని స్పష్టంగా తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచింది; ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపాన్ని ఎంచుకుంది.
- issue: רֵיחַ נִיחֹחַ అనే మానవరూపక బలి నుడికారం
  choice: ఇంపైన సువాసన
  alternative: శాంతిని కలిగించే సువాసన
  rationale: మూలంలోని బలి రూపకాన్ని నిలుపుతూ, దేవుని ప్రసన్నత ఎలా కలుగుతుందనే సిద్ధాంతపరమైన వివరణను పాఠంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వాక్యం చుట్టుపక్కల ఆజ్ఞలోని షరతును కొనసాగిస్తున్నందున భావాన్ని స్పష్టంగా విడదీసి చెప్పినా, బలి రకాలు మరియు సందర్భాల మధ్య ఉన్న మూల సంబంధాన్ని కాపాడింది.
