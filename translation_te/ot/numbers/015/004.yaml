source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: te
  text: అప్పుడు తన అర్పణను యాహ్వేకు అర్పించే వ్యక్తి, హీనులో నాలుగోవంతు నూనెతో కలిపిన ఏఫాలో పదోవంతు[a] మెత్తని పిండితో కూడిన ధాన్యార్పణను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయులో: “పదోవంతు”; ఈ బలుల సందర్భంలో ఇది ఏఫాలో పదోవంతును సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: అప్పుడు ... సమర్పించాలి
  rationale: వావ్‌తో కూడిన క్రియ ముందటి వచనంలోని ఆచార క్రమాన్ని కొనసాగిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּקְרִיב קָרְבָּנוֹ
  choice: తన అర్పణను సమర్పించే వ్యక్తి
  rationale: హిఫిల్ కృదంతం అర్పణను తీసుకువచ్చే వ్యక్తిని సూచిస్తుంది; పదపునరుక్తి మూలంలోని הקריב/קרבן సంబంధాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను వ్యక్తినామంగా లిప్యంతరీకరించి, ל ఉపసర్గను ‘కు’గా నిలిపాం.
- source_word: מִנְחָה
  choice: ధాన్యార్పణగా
  rationale: బలుల నియమాల సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ఇది సాధారణ పాఠకునికి స్పష్టమైన సందర్భానుసార అనువాదం.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ఇది అర్పణల కోసం ఉపయోగించే బాగా దంచిన శ్రేష్ఠమైన పిండిని సూచిస్తుంది; ‘మెత్తని పిండి’ సహజమైన ఆధునిక తెలుగు.
- source_word: עִשָּׂרוֹן
  choice: పదోవంతు ఏఫా
  rationale: మూలంలో అక్షరార్థంగా ‘పదోవంతు’; బలుల కొలతల సందర్భంలో ఇది ఏఫాలో పదోవంతును సూచిస్తుంది. తెలుగులో కొలతను స్పష్టంగా తెలిపాం.
- source_word: בָּלוּל
  choice: కలిపిన
  rationale: నూనెతో పిండి కలపబడిన స్థితిని సూచించే నిష్క్రియ కృదంతాన్ని సహజంగా అందిస్తుంది.
- source_word: בִּרְבִעִית הַהִין שָׁמֶן
  choice: ఆ నూనె పరిమాణం హీనులో నాలుగోవంతు
  rationale: ప్రాచీన కొలమానమైన ‘హీను’ను నిలిపి, నూనె పరిమాణ సంబంధాన్ని తెలుగులో సందిగ్ధత లేకుండా తెలిపాం; మూలం ‘నూనె’ మాత్రమే అంటుంది కాబట్టి ‘ఒలీవ నూనె’ అని విస్తరించలేదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర నియమానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. ప్రాచీన కొలమానాలైన ఏఫా, హీను అలాగే నిలిపాం.
