  terminology: ‘దహనబలి,’ ‘ధాన్యార్పణం,’ and ‘పానార్పణం’ are suitable sacrificial terms. ‘పాపపరిహార బలి’ is retained with a footnote preserving the legitimate ‘purification offering’ alternative. ‘యాహ్వే’ reflects יהוה and the supplied English POB decision.
