source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: te
  text: సమాజం గమనించకుండానే అది అనుకోకుండా జరిగితే, సమాజమంతా యాహ్వేకు ఇంపైన సువాసనగా మందలోనుండి ఒక ఎద్దును దహనబలిగా, నియమం ప్రకారం దానికి సంబంధించిన ధాన్యార్పణతోను పానార్పణతోను అర్పించాలి; అలాగే పాపపరిహార బలిగా[a] ఒక మగ మేకను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ పదం חַטָּאת పాపంతో సంబంధమున్న బలినీ, దాని ఆచారపరమైన శుద్ధీకరణ ప్రభావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: సమాజం గమనించకుండానే
  rationale: ‘సమాజం కళ్లకు దూరంగా’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు భావాన్ని ఇస్తూ, విషయం సమాజం దృష్టికి రాలేదనే అర్థాన్ని నిలుపుతుంది.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: అది పొరపాటున జరిగితే
  rationale: ఉద్దేశపూర్వకంగా కాక అనుకోకుండా జరిగిన తప్పును సూచించే న్యాయ-బలిసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָל הָעֵדָה
  choice: సమాజమంతా
  rationale: ఒడంబడిక సమాజమంతటినీ సూచించే כָל మరియు עֵדָה రెండింటి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: మందలోనుండి ఒక ఎద్దు
  rationale: పశువుల మందకు చెందిన ఒక ఎద్దు అనే బలి నిర్దేశాన్ని అక్షరబద్ధత లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే బలికి వాడే ప్రామాణిక బైబిలు పదాన్ని ఉపయోగిస్తుంది.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: దేవునికి ఆమోదయోగ్యమైన బలిని సూచించే ఆచార నుడికారంలోని సువాసన రూపకాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను పేరుగానే ప్రతిబింబిస్తుంది.
- source_word: וּמִנְחָתוֹ
  choice: దానితోపాటు దాని ధాన్యార్పణను
  rationale: మూలంలోని ప్రత్యయం ఎద్దుతో అనుబంధమైన అర్పణను సూచిస్తుందని స్పష్టం చేస్తూ, מִנְחָה యొక్క బలిసందర్భ అర్థాన్ని అందిస్తుంది.
- source_word: וְנִסְכּוֹ
  choice: పానార్పణను
  rationale: బలితో కూడిన ద్రవార్పణను తెలిపే స్పష్టమైన, సంక్షిప్తమైన తెలుగు ఆచారపదం.
- source_word: כַּמִּשְׁפָּט
  choice: నియమం ప్రకారం
  rationale: ముందుగా నిర్దేశించిన బలి విధానానికి అనుగుణంగా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: ఒక మగ మేకను
  rationale: మూలంలో పేర్కొన్న మేక యొక్క లింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: పాపంతో సంబంధమున్న బలి అనే సాంప్రదాయ అర్థాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది; శుద్ధీకరణ భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
theological_decisions:
- issue: యాజక బలి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో బలికి ఉన్న సంబంధాన్నీ, ఆచారపరమైన శుద్ధీకరణ ఫలితాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో పరిచితమైన పదాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇస్తుంది.
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే ఉంచుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలిసంబంధ సాంకేతిక పదాలకు స్థిరమైన పదజాలం వాడబడింది; హీబ్రూ నుడికారాలు అవసరమైన చోట సహజీకరించబడ్డాయి.
