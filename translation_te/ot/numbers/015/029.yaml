revisions:
- from: ఇశ్రాయేలీయుల్లో స్వదేశీయునికైనా, మీ మధ్య నివసించే పరదేశికైనా[a], అనుకోకుండా ఏదైనా చేసినప్పుడు ఒకే ధర్మశాస్త్రం వర్తిస్తుంది.
  to: స్వదేశీయ ఇశ్రాయేలీయునికీ, మీ మధ్య నివసిస్తున్న పరదేశికీ[a], అనుకోకుండా చేసే విషయంలో ఒకే ధర్మశాస్త్రం వర్తిస్తుంది.
  rationale: The revision removes the unsupported addition “ఏదైనా,” improves the native-Israelite expression, and preserves the legal equality of the two groups specifically in cases of unintentional action. The footnote remains correctly anchored and adequately explains the resident sense of גֵּר.
