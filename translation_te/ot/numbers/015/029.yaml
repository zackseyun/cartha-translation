source:
  edition: WLC
  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: te
  text: స్వదేశీయ ఇశ్రాయేలీయునికీ, మీ మధ్య నివసిస్తున్న పరదేశికీ[a], అనుకోకుండా చేసే విషయంలో ఒకే ధర్మశాస్త్రం వర్తిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అంటే ఇశ్రాయేలు సమాజంలో నివసిస్తున్న స్థానికేతరుడు.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో స్వదేశీయుడు
  rationale: ఈ పదబంధం ఇశ్రాయేలు సమాజంలో స్థానిక సభ్యునిగా ఉన్న వ్యక్తిని సూచిస్తుంది; తెలుగు వాక్యంలో సమాజ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: גֵּר ఇక్కడ తాత్కాలిక బాటసారి కంటే ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసించే స్థానికేతరుణ్ని సూచిస్తుంది. ‘మీ మధ్య’ అని అనువదించడం లָכֶם లోని ప్రత్యక్ష సంబోధనతో సరిపోతుంది.
- source_word: תּוֹרָה אַחַת
  choice: ఒకే ధర్మశాస్త్రం
  rationale: రెండు వర్గాలకూ ఒకటే నియమం వర్తిస్తుందనే సమానత్వ భావాన్ని ‘ఒకే’ స్పష్టంగా తెలియజేస్తుంది; תּוֹרָה యొక్క ఈ న్యాయ సందర్భానికి ‘ధర్మశాస్త్రం’ తగిన గౌరవప్రదమైన పదం.
- source_word: יִהְיֶה לָכֶם
  choice: వర్తిస్తుంది
  rationale: అక్షరార్థమైన ‘మీకు ఉంటుంది’ కంటే న్యాయ నియమం సమాజానికి వర్తించడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: అనుకోకుండా ఏదైనా చేసినప్పుడు
  rationale: సాధారణ ఏకవచన కర్త రెండు వర్గాల్లోని ఎవరికైనా వర్తిస్తుంది; בִּשְׁגָגָה ఉద్దేశపూర్వకత లేని చర్యను సూచిస్తుంది.
theological_decisions:
- issue: అనుకోకుండా చేసిన చర్యల విషయంలో స్వదేశీయునికీ నివాస పరదేశికీ న్యాయ సమానత్వం
  choice: రెండు వర్గాలకూ ఒకే ధర్మశాస్త్రం వర్తిస్తుందని అనువదించబడింది.
  alternative: ‘ఒకే ఉపదేశం’ లేదా ‘ఒకే నియమం’ అని అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యం తక్షణ సందర్భంలోని నియమం రెండు వర్గాలకూ సమానంగా వర్తించడాన్ని నొక్కిచెబుతుంది; దాని పరిధిని మించి విస్తృత సిద్ధాంత వాదనను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయశైలిని ఉపయోగించాం. ‘స్వదేశీయుడు—పరదేశి’ అనే వ్యత్యాసాన్ని, ‘ఒకే ధర్మశాస్త్రం’ అనే సమాన వర్తింపును స్పష్టంగా నిలిపాం.
