    reason: cultural_note
  revision_rationale: The revision removes the unsupported addition “ఏదైనా,” improves the native-Israelite expression, and preserves the legal equality of the two groups specifically in cases of unintentional action. The footnote remains correctly anchored and adequately explains the resident sense of גֵּר.
