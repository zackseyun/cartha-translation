source:
  edition: WLC
  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: te
  text: సమాజమంతటికీ—మీకు, మీ మధ్య నివసించే పరదేశికీ—ఒకే నియమం ఉండాలి. అది మీ తరతరాలకు శాశ్వత నియమం. యెహోవా సన్నిధిలో మీరెలాగో పరదేశి కూడా అలాగే ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: సమాజానికి
  rationale: కָהָל ఇక్కడ కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, అనవసరమైన సంఘపరమైన భావాన్ని రుద్దదు.
- source_word: חֻקָּה אַחַת
  choice: ఒకే నియమం
  rationale: חֻקָּהకు నిర్దేశించబడిన చట్టం లేదా నియమం అనే భావం ఉంది. ‘ఒకే నియమం’ దాని న్యాయబలాన్నీ, రెండు వర్గాలకు సమానంగా వర్తించే ఏకత్వాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: మీకు, మీ మధ్య నివసించే పరదేశికి కూడా
  rationale: גֵּר స్వదేశీయుడు కాకపోయినా ఇశ్రాయేలు మధ్య స్థిరంగా నివసించే వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ అనే నామవాచకంతో పాటు ‘మీ మధ్య నివసించే’ అని చెప్పడం వల్ల హీబ్రూ మూలపద పునరుక్తిలోని నివాస భావం నిలుస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వత నియమం
  rationale: న్యాయసూత్ర సందర్భంలో עוֹלָם తరతరాలుగా కొనసాగే స్థిరత్వాన్ని తెలియజేస్తుంది. ‘శాశ్వత’ తెలుగు బైబిలు శైలిలో సహజమైనదే; వెంటనే వచ్చే ‘మీ తరతరాలకు’ దాని సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: ఈ ప్రయోగం వరుస తరాలన్నిటిలోనూ నియమం కొనసాగడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: మీరు ఎలాగో పరదేశి కూడా అలాగే ఉండాలి
  rationale: כ...כ తులనాత్మక నిర్మాణం స్వదేశీయులకు, నివాస పరదేశికి మధ్య ఈ విషయంలో ఉన్న సమాన స్థితిని నొక్కిచెబుతుంది. తెలుగు సమాంతర నిర్మాణం ఆ బలాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో.’ ఇక్కడ ‘సన్నిధిలో’ ఆరాధన-న్యాయ సందర్భానికి సహజంగా సరిపోతుంది; יְהוָהను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: ఇశ్రాయేలు ఆరాధన నియమంలో నివాస పరదేశి స్థానం
  choice: ఈ సందర్భంలోని నియమం సమాజానికీ, వారి మధ్య నివసించే పరదేశికీ ఒకే విధంగా వర్తిస్తుందని అనువాదం స్పష్టం చేస్తుంది.
  alternative: ఈ సమానత్వాన్ని తక్షణ సందర్భంలోని బలి అర్పణ నియమాలకే పరిమితమైనదిగా మరింత స్పష్టంగా వ్యాఖ్యానించడం.
  rationale: వచనం ‘ఒకే నియమం’ అని, ‘యెహోవా సన్నిధిలో’ ఇరువురి సమాన స్థితిని నొక్కి చెబుతుంది. అయితే ఇది అన్ని సామాజిక లేదా న్యాయ రంగాల గురించిన సమగ్ర ప్రకటన అని అనువాదం విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన న్యాయ-ఆరాధన శైలి వాడబడింది. హీబ్రూ సమాంతరతను నిలుపుతూ తెలుగు వాక్యప్రవాహం సహజంగా ఉండేలా క్రమం స్వల్పంగా సర్దుబాటు చేయబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
