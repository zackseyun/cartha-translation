review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the single statute for Israelites and the resident foreigner, its enduring force through the generations, and their parity before Yahweh. A small syntactic revision better reflects the Hebrew's framing of the whole assembly and avoids making 'the assembly' sound like a third party distinct from 'you.'
  naturalness: The Telugu is modern, clear, and appropriately formal. Recasting the opening as 'సమాజమంతటికీ—మీకు ... పరదేశికీ—' makes the legal scope and parallelism more natural.
  terminology: ‘నియమం,’ ‘పరదేశి,’ ‘శాశ్వత నియమం,’ and ‘యెహోవా సన్నిధిలో’ are suitable. ‘మీ మధ్య నివసించే’ appropriately preserves the resident sense of גֵּר and the participial repetition.
  issues:
  - severity: low
    issue: Opening syntactic scope
    rationale: ‘సమాజానికి ఒకే నియమం ఉండాలి—మీకు ... పరదేశికి కూడా’ can momentarily present ‘సమాజం’ as separate from ‘మీకు.’ The Hebrew frames the statute as applying to the assembly, namely to the Israelites addressed and to the resident foreigner. ‘సమాజమంతటికీ’ resolves this without adding interpretation.
  revised_text: సమాజమంతటికీ—మీకు, మీ మధ్య నివసించే పరదేశికీ—ఒకే నియమం ఉండాలి. అది మీ తరతరాలకు శాశ్వత నియమం. యెహోవా సన్నిధిలో మీరెలాగో పరదేశి కూడా అలాగే ఉండాలి.
  revised_footnotes:
