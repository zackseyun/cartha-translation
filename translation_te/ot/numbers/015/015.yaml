revisions:
- from: సమాజానికి[a] ఒకే నియమం ఉండాలి—మీకు, మీ మధ్య నివసించే పరదేశికి కూడా. అది మీ తరతరాలకు శాశ్వత నియమంగా ఉండాలి.[b] యెహోవా సన్నిధిలో మీరు ఎలాగో పరదేశి కూడా అలాగే ఉండాలి.
  to: సమాజమంతటికీ—మీకు, మీ మధ్య నివసించే పరదేశికీ—ఒకే నియమం ఉండాలి. అది మీ తరతరాలకు శాశ్వత నియమం. యెహోవా సన్నిధిలో మీరెలాగో పరదేశి కూడా అలాగే ఉండాలి.
  rationale: The revision preserves the draft's meaning while making the opening's distributive legal scope explicit in idiomatic Telugu. Footnote anchors remain attached to ‘సమాజమంతటికీ[a]’ and ‘శాశ్వత నియమం[b]’ in the revised text, respectively.
