translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధికి తగిన గౌరవప్రదమైన ఆదేశ శైలిని ఉపయోగించింది. మూలంలోని సంఖ్యాపరమైన పునరుక్తిని నిలిపి, తెలుగులో సూచ్యవస్తువు స్పష్టంగా ఉండేందుకు ‘వాటి’ మరియు ‘ఒక్కొక్కదాని’ అనే నపుంసక రూపాలను ఉపయోగించింది.
