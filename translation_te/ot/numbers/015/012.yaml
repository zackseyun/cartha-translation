  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: te
  text: మీరు సిద్ధం చేసేవాటి సంఖ్యను బట్టి, వాటి సంఖ్య ప్రకారం ఒక్కోదానికీ అలాగే సిద్ధం చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు చేసేవాటి సంఖ్యను బట్టి, వాటి సంఖ్య ప్రకారం ఒక్కోదానికీ అలాగే చేయాలి.” హీబ్రూ క్రియ עשה సాధారణంగా ‘చేయు’ లేదా ‘తయారుచేయు’ అని అర్థమిస్తుంది; ఇక్కడ బలుల సందర్భాన్ని స్పష్టం చేయడానికి ప్రధాన పాఠంలో ‘సిద్ధం చేయు’ అని వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּ/מִּסְפָּר
  choice: సంఖ్యను బట్టి
  rationale: כְּ ఉపసర్గలోని ‘ప్రకారం/అనుపాతంగా’ అనే భావాన్ని, מִסְפָּר లోని ‘సంఖ్య’ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: మీరు సిద్ధం చేసే వాటి
  rationale: עָשָׂה సాధారణంగా ‘చేయు/తయారుచేయు’ అని అర్థమిస్తుంది; ఇక్కడ బలి అర్పణల సందర్భం కావడంతో ‘సిద్ధం చేసే’ అని అనువదించడం చర్యను స్పష్టం చేస్తుంది. אֲשֶׁר సంబంధ వాక్యాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: כָּכָה תַּעֲשׂוּ
  choice: ఇలాగే సిద్ధం చేయాలి
  rationale: כָּכָה లోని ‘ఈ విధంగా’ అనే భావాన్ని ‘ఇలాగే’ తెలియజేస్తుంది; ఆజ్ఞాత్మక సందర్భంలోని రెండవ బహువచన క్రియను తెలుగులో సహజమైన విధి సూచక ‘చేయాలి’తో వ్యక్తం చేసింది.
- source_word: לָ/אֶחָד
  choice: ఒక్కొక్కదాని కోసం
  rationale: అక్షరార్థంగా ‘ఒకదాని కోసం’ అయినప్పటికీ, సందర్భంలో ప్రతి బలి జంతువు లేదా అర్పణ అంశాన్ని విడివిడిగా సూచించే పంపిణీ భావం ఉంది; ‘ఒక్కొక్కదాని కోసం’ దానిని స్పష్టంగా ఉంచుతుంది.
- source_word: כְ/מִסְפָּרָם
  choice: వాటి సంఖ్య ప్రకారం
  rationale: బహువచన స్వామ్య ప్రత్యయం ‘వాటి’గా నిలుపబడింది; ‘సంఖ్య ప్రకారం’ మూలంలోని పరిమాణాధారిత విధానాన్ని ప్రతిబింబిస్తుంది.
