  to: మీరు సిద్ధం చేసేవాటి సంఖ్యను బట్టి, వాటి సంఖ్య ప్రకారం ఒక్కోదానికీ అలాగే సిద్ధం చేయాలి.[a]
  rationale: The revision preserves the Hebrew repetition of “according to the number,” the distributive singular “for each one,” and the contextual rendering “prepare.” It also restores the correlative force of כָּכָה by placing “అలాగే” directly with the second prescribed action.
