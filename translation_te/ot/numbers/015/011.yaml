translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల గురించిన నియమవాక్యానికి తగిన గంభీరమైన కానీ సులభమైన శైలి. మూలంలోని ఏకవచన వర్తింపును ‘ఒక్కో’తో స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
