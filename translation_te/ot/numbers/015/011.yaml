id: NUM.15.11
reference: Numbers 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּ֣כָה יֵעָשֶׂ֗ה לַ/שּׁוֹר֙ הָֽ/אֶחָ֔ד א֖וֹ לָ/אַ֣יִל הָ/אֶחָ֑ד אֽוֹ לַ/שֶּׂ֥ה בַ/כְּבָשִׂ֖ים א֥וֹ בָ/עִזִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: te
  text: ఒక్కో ఎద్దుకైనా, ఒక్కో పొట్టేలుకైనా, గొర్రెలలోనిదైన గానీ మేకలలోనిదైన గానీ ఒక్కో మందపశువుకైనా ఈ విధంగా చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּכָה
  choice: ఈ విధంగానే
  rationale: నిర్దేశించిన పద్ధతిని సూచించే క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా ఉంటూనే విధినియమ భావాన్ని నిలుపుతుంది.
- source_word: יֵעָשֶׂה
  choice: చేయాలి
  rationale: నిఫ్అల్ అసంపూర్ణ క్రియలోని అవ్యక్త కర్తగల విధినిర్దేశ భావాన్ని సహజమైన తెలుగు నియమవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: ఒక్కో ఎద్దుకు
  rationale: నిర్దిష్ట పదంతో కూడిన ‘ఒకటి’ ప్రతి బలిపశువుకు విడివిడిగా ఈ నియమం వర్తిస్తుందని సూచిస్తుంది; ‘ఒక్కో’ తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: మగ గొర్రెను సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: הָאֶחָד
  choice: ఒక్కో
  rationale: పునరుక్త సంఖ్యావాచకం ప్రతి జంతువుకు నియమం విడిగా వర్తించడాన్ని నొక్కిచెబుతుంది.
- source_word: שֶׂה
  choice: చిన్న పశువు
  rationale: ఈ హెబ్రీ పదం గొర్రె లేదా మేక జాతికి చెందిన ఒక చిన్న పశువును విస్తృతంగా సూచించగలదు; వెంట వచ్చే రెండు వర్గాలనూ కలుపుకునేందుకు సాధారణ పదాన్ని ఎంచుకున్నాం.
- source_word: בַכְּבָשִׂים
  choice: గొర్రెలలోనిదైన
  rationale: ב ఇక్కడ వర్గసభ్యత్వాన్ని సూచిస్తుంది; ఆ జంతువు గొర్రెల వర్గానికి చెందినదని తెలుపుతుంది.
- source_word: בָעִזִּים
  choice: మేకలలోనిదైన
  rationale: ముందటి పదబంధానికి సమాంతరంగా, మేకల వర్గానికి చెందిన జంతువును సూచిస్తుంది.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: గానీ ... గానీ ... లేదా ... గానీ
  rationale: త్యాగానికి ఉపయోగించే ప్రత్యామ్నాయ జంతువుల జాబితాను తెలుగులో సహజంగా చూపుతూ మూలంలోని విభాజక నిర్మాణాన్ని నిలుపుతుంది.
