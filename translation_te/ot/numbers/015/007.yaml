source:
  edition: WLC
  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: te
  text: మరియు పానార్పణగా హీనులో మూడవ వంతు ద్రాక్షారసాన్ని యెహోవాకు ఇంపైన సువాసనగా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీను అనేది ప్రాచీన కాలంలోని ద్రవ కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וְיַיִן
  choice: ద్రాక్షారసాన్ని
  rationale: יַיִןకు సాధారణ అర్థం ద్రాక్షారసం. తెలుగు వాక్యనిర్మాణంలో క్రియతో సహజంగా కలిసేందుకు ద్వితీయా విభక్తి వాడబడింది; וְ సందర్భానుసారంగా ముందటి ఆదేశంతో అనుసంధానమవుతుంది.
- source_word: לַנֶּסֶךְ
  choice: పానార్పణ కోసం
  rationale: נֶסֶךְ బలితో పాటు పోసే ద్రవార్పణను సూచిస్తుంది. ‘పానార్పణ’ సంక్షిప్తంగా, ఆరాధనా సందర్భానికి తగినట్లుగా ఉంది.
- source_word: שְׁלִשִׁית הַהִין
  choice: హీను కొలతలో మూడవ వంతు
  rationale: మూలంలోని ప్రాచీన ద్రవ కొలమానాన్ని అంచనా పరిమాణంతో భర్తీ చేయకుండా ‘హీను’గా నిలిపి, అది కొలమానమని పాఠ్యంలో స్పష్టం చేయబడింది.
- source_word: תַּקְרִיב
  choice: అర్పించాలి
  rationale: קרב హిఫీల్ రూపం బలుల సందర్భంలో ‘సమర్పించు/అర్పించు’ అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘అర్పించాలి’ సహజమైన ఆజ్ఞార్థక ప్రయోగం.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: ఈ స్థిరమైన బలార్పణ పదబంధం ఆ అర్పణ దేవునికి ప్రీతికరంగా ఉండడాన్ని సూచిస్తుంది. రూపక చిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండే పదప్రయోగం ఎంచుకోబడింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలిపింది.
- issue: רֵיחַ נִיחֹחַ బలార్పణ ప్రయోగం
  choice: ఇంపైన సువాసనగా
  alternative: శాంతికరమైన సువాసనగా
  rationale: దేవుడు శాంతింపబడతాడనే ఒకే వ్యాఖ్యానాన్ని బలవంతంగా మోపకుండా, మూలంలోని సువాసన రూపకాన్నీ అంగీకార భావాన్నీ నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బలార్పణ సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ఏకవచన రెండవ పురుష ఆజ్ఞను తెలుగులో సహజమైన ‘అర్పించాలి’ రూపంలో వ్యక్తీకరించింది.
