id: NUM.15.36
reference: Numbers 15:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: te
  text: అప్పుడు సమాజమంతా అతనిని శిబిరం వెలుపలికి తీసుకువెళ్లి, రాళ్లతో కొట్టగా అతడు చనిపోయాడు; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలు ప్రజల సమష్టి సమాజాన్ని సూచిస్తుంది; ‘సమాజమంతా’ అనే రూపం כָּל భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: అతణ్ణి ... తీసుకువెళ్లి
  rationale: హిఫీల్ రూపంలోని יצא ‘బయటికి తీసుకురావడం/తీసుకువెళ్లడం’ అనే causative భావాన్ని ఇస్తుంది; గమ్యాన్ని బట్టి ‘తీసుకువెళ్లి’ తెలుగులో సహజంగా ఉంది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: ఈ పదబంధం శిబిరం బయట ఉన్న ప్రదేశం వైపు కదలికను సూచిస్తుంది; ‘వెలుపలికి’ ఆ దిశాభావాన్ని నిలుపుతుంది.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: రాళ్లతో కొట్టింది
  rationale: רגם రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది; בָּאֲבָנִים అనే సాధనార్థక పదాన్ని ‘రాళ్లతో’ స్పష్టంగా నిలిపాం.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: מות సాధారణంగా ‘చనిపోవడం’; ‘చంపివేశారు’ అని మార్చకుండా మూలంలోని ఫలిత వాక్యాన్ని నేరుగా ఉంచాం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר అనురూపతను (‘చెప్పినట్టే/ఆజ్ఞాపించినట్టే’) తెలియజేస్తుంది; יְהוָהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- issue: చివరి ఉపవాక్యంలోని కర్త
  choice: వారు చేశారు అని స్పష్టీకరించడం
  alternative: యెహోవా మోషేకు ఆజ్ఞాపించినట్టే అనే అసంపూర్ణ అనుసంధానం
  rationale: హీబ్రూలో ‘యెహోవా మోషేకు ఆజ్ఞాపించినట్టే’ అన్నది ముందున్న కార్యాలన్నిటిని వివరిస్తుంది. తెలుగులో వాక్యసంబంధం సహజంగా, అపార్థం లేకుండా ఉండేందుకు అంతర్భూతమైన బహువచన కర్తను ‘వారు చేశారు’ అని తెలిపాం; కొత్త కార్యాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘అతణ్ణి’ వ్యవహారిక-ప్రమాణ సంధిరూపం; న్యాయశిక్ష దృశ్యంలోని కఠినతను మృదువుచేయలేదు.
