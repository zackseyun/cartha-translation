review_pass:
  verdict: revise
  source_fidelity: ‘ఆ దేశపు ఆహారం’ is semantically possible in a broad sense, but לֶחֶם specifically denotes bread here and is especially pertinent to the surrounding dough-offering context. Rendering it ‘రొట్టె’ better preserves the source’s lexical specificity. The temporal clause and the offering command are otherwise represented accurately.
  naturalness: The draft is clear modern Telugu, but ‘ఒక అర్పణను సమర్పించాలి’ is somewhat repetitive. ‘ఒక ప్రత్యేక కానుకను సమర్పించాలి’ is more idiomatic while conveying תְּרוּמָה as a contribution set apart for God.
  terminology: ‘యెహోవా’ appropriately represents יהוה consistently with the draft’s stated naming policy. ‘ప్రత్యేక కానుక’ distinguishes תְּרוּמָה from a generic sacrifice without importing a denominationally loaded technical term.
  issues:
  - severity: medium
    issue: ‘ఆహారం’ replaces the specific ‘bread’ (לֶחֶם).
    rationale: Although לֶחֶם can at times have a broader food-related sense, this verse’s immediate context concerns dough and a portion taken from it. ‘రొట్టె’ retains the concrete wording and contextual connection.
  - severity: low
    issue: ‘అర్పణను సమర్పించాలి’ is stylistically redundant and does not explicitly convey the set-apart/contribution nuance of תְּרוּמָה.
    rationale: Using ‘ప్రత్యేక కానుకను సమర్పించాలి’ is natural Telugu and more closely reflects an offering set apart for Yahweh.
  revised_text: మీరు దేశపు రొట్టె తినేటప్పుడు, యెహోవాకు ఒక ప్రత్యేక కానుకను సమర్పించాలి.[a]
