revisions:
- from: మీరు ఆ దేశపు ఆహారం తినేటప్పుడు, యెహోవాకు ఒక అర్పణను సమర్పించాలి.[a]
  to: మీరు దేశపు రొట్టె తినేటప్పుడు, యెహోవాకు ఒక ప్రత్యేక కానుకను సమర్పించాలి.[a]
  rationale: The revision restores the specific sense of לֶחֶם as ‘bread’ and renders תְּרוּמָה as a contribution set apart for Yahweh in idiomatic modern Telugu. The footnote preserves the Hebrew ‘lift up’ imagery without making it an unnatural main-text expression.
