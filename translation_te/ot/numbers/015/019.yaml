id: NUM.15.19
reference: Numbers 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: te
  text: మీరు దేశపు రొట్టె తినేటప్పుడు, యెహోవాకు ఒక ప్రత్యేక కానుకను సమర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “యెహోవాకు ఒక కానుకను పైకెత్తాలి.” ఇక్కడ హీబ్రూ పదబంధం దేవునికి ప్రత్యేకించి సమర్పించే కానుకను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: మీరు ... తినేటప్పుడు
  rationale: היה తో కూడిన ב־ప్రత్యయ అనంతక్రియ భవిష్యత్తులో సంభవించే కాలసంబంధ పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘తినేటప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: ఆ దేశపు ఆహారం
  rationale: לֶחֶם ఇక్కడ కేవలం కాల్చిన రొట్టెనే కాక, దేశపు పంటతో చేసిన ప్రధాన ఆహారాన్ని సూచించగలదు. מן మూలం/భాగస్వామ్య భావం తెలుగులో సందర్భానుసారంగా ఈ నిర్మాణంలో అంతర్లీనంగా ఉంది.
- source_word: תָּרִימוּ תְרוּמָה
  choice: ఒక అర్పణను సమర్పించాలి
  rationale: רום హిఫీల్ మరియు תְּרוּמָה కలయిక దేవునికి ప్రత్యేకించి ఇచ్చే కానుకను ‘పైకెత్తే’ ఆరాధనా పదబంధం. సహజమైన ఆధునిక తెలుగులో ‘అర్పణను సమర్పించాలి’ అని ఇచ్చి, మూలంలోని రూపకాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל అర్పణ గ్రహీతను సూచిస్తుంది; יהוה అనే దైవనామాన్ని వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’ రూపంలో ఉంచడం వ్యక్తినామ స్వభావాన్ని కాపాడుతుంది.
- issue: תָּרִימוּ תְרוּמָה లోని ఆరాధనా రూపకం
  choice: ప్రధాన పాఠంలో సహజమైన ‘అర్పణను సమర్పించాలి’; పాదసూచికలో అక్షరార్థం
  alternative: పైకెత్తిన అర్పణను అర్పించాలి
  rationale: ఈ పదబంధం సాంకేతిక ఆరాధనా భాషను కలిగి ఉంది. ప్రధాన పాఠంలో అర్థాన్ని స్పష్టంగా ఉంచుతూ, ‘పైకెత్తడం’ అనే నిజమైన మూలరూపకాన్ని పాదసూచిక ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘దేశపు ఆహారం’ సందర్భంలోని విస్తృత ఆహారార్థాన్ని తెలియజేస్తుంది; ఆరాధనా పదబంధంలోని రూపకాన్ని పాదసూచిక వివరిస్తుంది.
