  edition: WLC
  text: וַ/יַּקְרִ֣יבוּ אֹת֔/וֹ הַ/מֹּצְאִ֥ים אֹת֖/וֹ מְקֹשֵׁ֣שׁ עֵצִ֑ים אֶל מֹשֶׁה֙ וְ/אֶֽל אַהֲרֹ֔ן וְ/אֶ֖ל כָּל הָ/עֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/033.yaml
  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: te
  text: కట్టెలు ఏరుకుంటున్న అతణ్ణి కనుగొన్నవారు అతణ్ణి మోషే దగ్గరికి, అహరోను దగ్గరికి, సమాజమంతటి వద్దకు తీసుకువచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పుల్లలు ఏరుకుంటున్న.” హీబ్రూ పదం עֵצִים సాధారణంగా చెక్కను లేదా కట్టెలు, పుల్లలు వంటి చెక్క ముక్కలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: అతణ్ణి ... తీసుకొచ్చారు
  rationale: హిఫీల్ రూపం ఒకరిని దగ్గరికి తీసుకురావడం లేదా సమక్షంలో ప్రవేశపెట్టడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘తీసుకొచ్చారు’ సహజంగా ఉండి, తరువాత వచ్చే ‘దగ్గరికి’తో గమ్యభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: అతణ్ణి కనుగొన్నవారు
  rationale: నిర్దేశక ఉపపదంతో ఉన్న కృదంతం అతణ్ణి కనుగొన్న వ్యక్తులను సూచిస్తుంది; ఈ రూపం తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: కట్టెలు ఏరుకుంటున్న
  rationale: מְקֹשֵׁשׁ ఏరడం లేదా పోగుచేయడం అనే కొనసాగుతున్న చర్యను సూచిస్తుంది. עֵצִים చెక్కను సాధారణంగా గానీ, కట్టెలు/పుల్లలను గానీ సూచించగలదు; సందర్భంలో ‘కట్టెలు’ సహజమైన విస్తృత ఎంపిక.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: మోషే దగ్గరికి, అహరోను దగ్గరికి, సమాజమంతటి దగ్గరికి
  rationale: మూలంలోని אֶל పదం మూడుసార్లు పునరావృతమవడాన్ని తెలుగులో ‘దగ్గరికి’ పునరావృతం చేసి నిలిపాం. כָּל הָעֵדָה సమస్త కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది.
- source_word: עֵדָה
  choice: సమాజం
  rationale: పంచగ్రంథాలలో ఈ పదం కూడిన నిబంధన సముదాయాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సమాజం’ సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా అర్థమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. మూలంలోని గమ్యపద పునరావృతాన్ని నిలిపి, పద్యానికి ఉన్న అధికారిక సమాజ-న్యాయ సందర్భాన్ని గౌరవప్రదమైన భాషలో కాపాడాం.
