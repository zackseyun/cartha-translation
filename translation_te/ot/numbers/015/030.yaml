id: NUM.15.30
reference: Numbers 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: te
  text: అయితే, దేశంలో పుట్టినవాడైనా నివాస పరదేశియైనా, ధిక్కారపూర్వకంగా[a] ప్రవర్తించే వ్యక్తి యాహ్వేను దూషిస్తున్నాడు. ఆ వ్యక్తి తన ప్రజల మధ్యనుండి కొట్టివేయబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “ఎత్తిన చేతితో”; అంటే గర్వంతో లేదా బహిరంగంగా ఎదిరిస్తూ.'
    reason: హీబ్రూ నుడికారం యొక్క అక్షర రూపాన్నీ, దాని ధిక్కారపూర్వక భావపరిధినీ తెలియజేయడానికి.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: వ్యక్తి
  rationale: న్యాయసంబంధ సందర్భంలో נֶפֶשׁ మొత్తం వ్యక్తిని సూచిస్తుంది; ‘ఆత్మ’ కంటే ‘వ్యక్తి’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: תַּעֲשֶׂה
  choice: ప్రవర్తించే
  rationale: עשה ఇక్కడ నిర్దిష్టమైన ఒక్క కార్యాన్ని పేర్కొనకుండా చేసే పనిని విస్తృతంగా సూచిస్తుంది; తెలుగులో ‘ప్రవర్తించే’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בְּיָד רָמָה
  choice: ధిక్కారపూర్వకంగా[a]
  rationale: అక్షరార్థమైన ‘ఎత్తిన చేతితో’ అనే హీబ్రూ నుడికారం బహిరంగమైన, అహంకారపూర్వకమైన ఎదిరింపును సూచిస్తుంది. ప్రధాన పాఠంలో భావాన్ని సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: הָאֶזְרָח
  choice: దేశంలో పుట్టినవాడు
  rationale: సమాజం లేదా దేశానికి చెందిన స్థానికుణ్ణి నివాస పరదేశితో వ్యత్యాసంగా సూచిస్తుంది; ‘పౌరుడు’ అనే ఆధునిక న్యాయపరమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: הַגֵּר
  choice: నివాస పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతరుణ్ణి సూచించే గేర్ పదంలోని నివాస మరియు పరదేశిత్వ భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: אֶת־יְהוָה הוּא מְגַדֵּף
  choice: యెహోవాను దూషిస్తున్నాడు
  rationale: גדף దేవునిపట్ల తీవ్రమైన అవమానం లేదా తిరస్కారాన్ని తెలియజేస్తుంది; ‘దూషిస్తున్నాడు’ దాని గంభీరతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరించాం.
- source_word: וְנִכְרְתָה
  choice: కొట్టివేయబడాలి
  rationale: ఒడంబడిక-న్యాయ సందర్భంలోని తీవ్రమైన తొలగింపు లేదా తీర్పు సూత్రాన్ని నిలుపుతుంది; అది మరణశిక్షా, సమాజం నుంచి బహిష్కరణా, లేక దేవుని ప్రత్యక్ష తీర్పా అన్నది అనువాదంలో ముందుగానే నిర్ణయించదు.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: తన ప్రజల మధ్యనుండి
  rationale: ఒడంబడిక సమాజం మధ్యనుండి తొలగింపును సూచిస్తుంది; హీబ్రూలోని వ్యాకరణ లింగాన్ని తెలుగులో అసహజంగా ప్రతిబింబించకుండా ‘తన’ వాడాం.
theological_decisions:
- issue: అపరాధ స్వభావం మరియు ‘కొట్టివేయబడడం’ అనే శిక్ష
  choice: బహిరంగ ధిక్కారంతో చేసిన కార్యం యెహోవాను దూషించడంగా పేర్కొని, అపరాధి తన ప్రజల మధ్యనుండి ‘కొట్టివేయబడాలి’ అని అనువదించాం.
  alternative: దీనిని ప్రత్యేకంగా ఉద్దేశపూర్వక పాపం, మరణశిక్ష, బహిష్కరణ లేదా దేవుని ప్రత్యక్ష తీర్పుగా నిర్వచించడం.
  rationale: హీబ్రూ నుడికారం అపరాధంలోని ధిక్కారాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే כרת సూత్రం శిక్ష అమలయ్యే ఖచ్చిత విధానాన్ని ఈ వచనంలో వివరించదు. అందువల్ల ఆ ఉద్దేశపూర్వక అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ధార్మిక శైలి ఉపయోగించబడింది. ‘కొట్టివేయబడాలి’ అనే పదబంధం గంభీరతను నిలుపుతూ శిక్ష యొక్క ఖచ్చిత స్వరూపాన్ని నిర్ధారించదు.
