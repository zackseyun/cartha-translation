id: NUM.15.6
reference: Numbers 15:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: te
  text: లేదా, ఒక పొట్టేలు కోసం హీనులో మూడవ వంతు నూనెతో కలిపిన రెండు పదోవంతుల[a] సన్నని పిండితో ధాన్యార్పణం సిద్ధం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రెండు పదోవంతులు.’ బలి కొలతల విధానం ప్రకారం ఇక్కడ పెద్ద ప్రమాణమైన ఏఫా సూచితమై ఉంది; ఇతర చోట్ల ఇది పూర్తిగా ‘ఏఫాలో రెండు పదోవంతులు’ అని ఉంటుంది.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: లేదా
  rationale: ముందటి బలి సందర్భాలకు ప్రత్యామ్నాయంగా ఈ నియమాన్ని అనుసంధానించే సాధారణ వికల్ప అవ్యయం.
- source_word: לָ/אַ֨יִל֙
  choice: పొట్టేలుతో పాటు
  rationale: אַיִל అంటే పొట్టేలు; ל ఇక్కడ దానికి సంబంధించిన అనుబంధ అర్పణను సూచిస్తుంది. తెలుగు బలి సందర్భంలో ‘తో పాటు’ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂ֣ה
  choice: సిద్ధం చేయాలి
  rationale: עשה యొక్క ‘చేయు’ భావం ఇక్కడ అర్పణను తయారుచేసే ఆచార సందర్భంలో ‘సిద్ధం చేయాలి’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: מִנְחָ֔ה
  choice: నైవేద్యంగా
  rationale: యాజక బలి సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; వెంటనే ‘సన్నని పిండి’ అని పదార్థం పేర్కొనబడటం వల్ల సంక్షిప్తమైన ‘నైవేద్యం’ సహజంగా సరిపోతుంది.
- source_word: סֹ֖לֶת
  choice: సన్నని పిండి
  rationale: బలిలో ఉపయోగించే మెత్తగా శుద్ధిచేసిన పిండిని సూచించే సాధారణ, స్పష్టమైన తెలుగు పదబంధం.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: రెండు పదోవంతులు
  rationale: హీబ్రూలో ఉన్న కొలత సంక్షిప్తతను నిలుపుతుంది; ఏఫా అనే పెద్ద ప్రమాణం సందర్భం ద్వారా అర్థమవుతుంది, దానిని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెను పిండితో కలపడాన్ని సూచించే కర్మణి భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: హీను నూనెలో మూడవ వంతు
  rationale: ప్రాచీన కొలమానమైన హీనును మార్చకుండా ఉంచి, దాని మూడవ భాగాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార నియమానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ప్రాచీన కొలమానమైన ‘హీను’ను అలాగే ఉంచాం; ‘రెండు పదోవంతులు’ అనే మూలంలోని సంక్షిప్త కొలతను పాదటిప్పణితో వివరించాం.
