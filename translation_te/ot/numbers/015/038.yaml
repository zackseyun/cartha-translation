source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు: వారు తరతరాలపాటు తమ వస్త్రాల మూలలకు కుచ్చులు[a] చేసుకోవాలి; ప్రతి మూల కుచ్చుకు నీలం[b] దారాన్ని జోడించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “అంచు దారాలు.” హీబ్రూ: צִיצִת (త్సీత్సీత్).'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం תְּכֵלֶת (తెఖేలెత్) ఇశ్రాయేలు పవిత్ర సామగ్రిలో ఉపయోగించిన నీలం లేదా నీలి-ఊదా రంగును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పురుషలింగ బంధుత్వ పదబంధాన్ని పారదర్శకంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: וְעָשׂוּ לָהֶם
  choice: వారు ... చేసుకోవాలి
  rationale: לָהֶם లోని ‘తమ కోసం’ అనే భావాన్ని తెలుగు ఆత్మార్థక క్రియారూపమైన ‘చేసుకోవాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִיצִת
  choice: కుచ్చులు
  rationale: వస్త్రపు మూలకు వేలాడే దారాల సమూహాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది; ‘అంచు దారాలు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: తమ వస్త్రాల అంచుల మూలల్లో
  rationale: כָּנָף అక్షరార్థంగా ‘రెక్క’ అయినా, వస్త్ర సందర్భంలో దాని అంచు లేదా మూలను సూచిస్తుంది. ‘అంచుల మూలల్లో’ భౌతిక స్థానాన్ని స్పష్టం చేస్తుంది.
- source_word: לְדֹרֹתָם
  choice: తరతరాలపాటు
  rationale: వరుస తరాలన్నిటికీ ఈ ఆజ్ఞ వర్తిస్తుందనే నిరంతర భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַל צִיצִת הַכָּנָף
  choice: ప్రతి మూలలోని కుచ్చుకు
  rationale: హీబ్రూలో ఏకవచన నిర్మాణం ఉన్నప్పటికీ సందర్భంలో అది విభజనార్థకంగా, ప్రతి మూలను సూచిస్తుంది.
- source_word: פְּתִיל
  choice: దారం
  rationale: మెలిపెట్టిన నూలు లేదా సన్నని తాడును సూచించే హీబ్రూ పదానికి వస్త్ర సందర్భంలో ‘దారం’ అత్యంత సహజమైన తెలుగు పదం.
- source_word: תְּכֵלֶת
  choice: నీలిరంగు
  rationale: ఇశ్రాయేలు పవిత్ర సామగ్రిలో వాడిన నీలం లేదా నీలి-ఊదా వర్ణాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో సులభమైన ‘నీలిరంగు’ను ఉంచి వర్ణ పరిధిని పాదసూచికలో వివరించాం.
