translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞా శైలిని వాడాం. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే బంధుత్వ రూపాన్ని నిలిపి, వస్త్రానికి సంబంధించిన పదాలను సహజమైన తెలుగులో వ్యక్తం చేశాం.
