source:
  edition: WLC
  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: te
  text: అది మీకు కుచ్చుగా[a] ఉండాలి. మీరు దానిని చూసినప్పుడు యాహ్వే ఆజ్ఞలన్నిటినీ జ్ఞాపకం చేసుకొని వాటిని పాటించాలి. మీరు మీ హృదయం వెంటే, మీ కళ్ల వెంటే తిరగకూడదు[b]. వాటి వెంట మీరు వ్యభిచరిస్తున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అంచు కుచ్చు.’ హీబ్రూ పదం వస్త్రపు అంచుకు జతచేసే కుచ్చును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ హృదయాన్ని, మీ కళ్లను అనుసరించకూడదు.’ హీబ్రూ క్రియలో వాటి వెంట వెదుకుతూ లేదా తిరుగుతూ పోవడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠం లైంగిక అవిశ్వాసాన్ని నిబంధనాపరమైన అవిశ్వాసానికి రూపకంగా వాడుతుంది. భావాన్ని మృదువుగా చెప్పాలంటే, ‘వాటి వెంట దారితప్పుతున్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: కుచ్చు
  rationale: వస్త్రపు అంచులకు కట్టే కుచ్చు వంటి అలంకారపు అంచును సూచిస్తుంది; ఆధునిక తెలుగులో సందర్భానికి స్పష్టమైన పదం.
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: అది మీకు ఒక కుచ్చుగా ఉండాలి
  rationale: మునుపటి వచనంలోని ఏకవచన వస్తువును సూచించే సరళమైన విధేయ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: మీరు దాన్ని చూసినప్పుడు
  rationale: హీబ్రూ వాక్యక్రమంలోని కాలసంబంధమైన ఆచరణాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִצְוֺת יְהוָה
  choice: యాహ్వే ఆజ్ఞలు
  rationale: מִצְוֺת యొక్క నిబంధనాత్మక, ధర్మశాస్త్ర సంబంధ బలాన్ని ‘ఆజ్ఞలు’ నిలుపుతుంది; దేవుని వ్యక్తినామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని పాటించాలి
  rationale: ఆజ్ఞలను ‘చేయడం’ అనే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానార్థకం; విధేయత భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: תָתֻרוּ אַחֲרֵי
  choice: వెంట తిరగకూడదు
  rationale: תור లోని వెదుకుతూ లేదా అన్వేషిస్తూ పోవడం అనే చలనభావాన్ని పూర్తిగా సాధారణమైన ‘అనుసరించకూడదు’గా చదును చేయకుండా నిలుపుతుంది.
- source_word: לְבַבְכֶם ... עֵינֵיכֶם
  choice: మీ హృదయాల వెంటా మీ కళ్ల వెంటా
  rationale: అంతరంగ కోరిక, చూపు ఆకర్షణలను సూచించే శరీరాంగ రూపకాలను వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: వాటి వెంట వ్యభిచరిస్తున్నారు
  rationale: లైంగిక అవిశ్వాసాన్ని నిబంధనాపరమైన అవిశ్వాసానికి రూపకంగా వాడిన హీబ్రూ తీవ్రతను మృదువుచేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే నిబంధన నామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న దేవుని వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- issue: זנה లోని లైంగిక అవిశ్వాస రూపకం
  choice: వ్యభిచరిస్తున్నారు
  alternative: దారితప్పుతున్నారు
  rationale: ఇశ్రాయేలు నిబంధన అవిశ్వాసాన్ని లైంగిక అవిశ్వాసంగా చిత్రించే మూల రూపకపు తీవ్రతను నిలుపుతుంది; దానిని సాధారణ నైతిక దారితప్పుదలగా కుదించదు.
- issue: హృదయం, కళ్లు అనే రూపకాల పరిధి
  choice: అక్షర రూపకాలను నిలుపడం
  alternative: మీ కోరికల వెంట, మీరు చూసి ఆశించిన వాటి వెంట
  rationale: హీబ్రూ మానవశాస్త్రంలోని అంతరంగం మరియు చూపు మధ్య ఉన్న భావపరమైన విస్తృతిని ఒక నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘వ్యభిచరిస్తున్నారు’ అనే ఉద్దేశపూర్వకంగా బలమైన పదం మూలంలోని తీవ్ర రూపకాన్ని నిలుపుతుంది. హృదయం, కళ్లు అనే మూల రూపకాలు వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఉంచబడ్డాయి.
