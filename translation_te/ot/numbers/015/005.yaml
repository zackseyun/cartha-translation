source:
  edition: WLC
  text: וְ/יַ֤יִן לַ/נֶּ֨סֶךְ֙ רְבִיעִ֣ית הַ/הִ֔ין תַּעֲשֶׂ֥ה עַל הָ/עֹלָ֖ה א֣וֹ לַ/זָּ֑בַח לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: te
  text: దహనబలితో పాటు[a] లేదా బలికోసం, ఒక్కో గొర్రెపిల్లకు[b] పానార్పణగా పావు హీను ద్రాక్షారసాన్ని సిద్ధం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “దహనబలి మీద.” ఇక్కడ హీబ్రూ ఉపసర్గ బలిక్రియలో దహనబలితో అనుబంధాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆ ఒక్క గొర్రెపిల్లకు”; ఆదేశంలోని విభజనాత్మక భావాన్ని “ఒక్కో గొర్రెపిల్లకు” అని వ్యక్తం చేశాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: ద్రాక్షారసాన్ని
  rationale: וְ ముందటి ఆదేశంతో ఈ వాక్యాన్ని కలుపుతుంది; יַיִן సాధారణంగా ద్రాక్షారసాన్ని సూచిస్తుంది. తెలుగులో సహజ వాక్యక్రమం కోసం సంధానార్థం వాక్య నిర్మాణంలో వ్యక్తమైంది.
- source_word: לַ/נֶּסֶךְ
  choice: పానార్పణగా
  rationale: బలి సందర్భంలో נֶסֶךְ పోసి అర్పించే ద్రవార్పణను సూచిస్తుంది; ‘పానార్పణ’ సంక్షిప్తంగా, స్పష్టంగా ఆ ఆచారార్థాన్ని తెలియజేస్తుంది.
- source_word: רְבִיעִית הַ/הִין
  choice: పావు హీను
  rationale: మూలంలోని ప్రాచీన కొలమానమైన ‘హీను’ను మార్చకుండా ఉంచి, רְבִיעִיתను సహజ ఆధునిక తెలుగులో ‘పావు’గా అనువదించాం.
- source_word: תַּעֲשֶׂה
  choice: సిద్ధం చేయాలి
  rationale: עָשָׂה ప్రాథమికంగా ‘చేయు’ అని అర్థమైనా, ఈ బలిసంబంధ ఆదేశంలో ద్రాక్షారసాన్ని అర్పణకు సిద్ధం చేయడాన్ని సూచిస్తుంది.
- source_word: עַל הָ/עֹלָה
  choice: దహనబలితో పాటు
  rationale: עַל అక్షరార్థంగా ‘మీద’ కావచ్చు; ఇక్కడ బలితో అనుబంధాన్ని లేదా సహగమనాన్ని సూచించే అవకాశమే ఎక్కువ. అందువల్ల సహజ తెలుగులో ‘తో పాటు’ వాడాం.
- source_word: א֣וֹ לַ/זָּבַח
  choice: లేదా బలితో పాటు
  rationale: זֶבַח సాధారణంగా వధించి అర్పించే బలిని సూచిస్తుంది; עֹלָהతో ఉన్న భేదాన్ని నిలుపుతూ అదనపు నిర్దిష్టతను చేర్చకుండా ‘బలి’గా అనువదించాం.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: ఒక్కో గొర్రెపిల్లకు
  rationale: అక్షరార్థం ‘ఆ ఒక్క గొర్రెపిల్లకు’; ఆదేశ సందర్భంలోని విభజనాత్మక భావాన్ని తెలుగులో ‘ఒక్కో’ స్పష్టంగా తెలియజేస్తుంది.
