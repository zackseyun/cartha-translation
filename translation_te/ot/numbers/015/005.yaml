revisions:
- from: దహనబలితో లేదా బలితో పాటు, ఒక్కో గొర్రెపిల్లకు పానార్పణగా పావు హీను ద్రాక్షారసాన్ని సిద్ధం చేయాలి.[a][b]
  to: దహనబలితో పాటు[a] లేదా బలికోసం, ఒక్కో గొర్రెపిల్లకు[b] పానార్పణగా పావు హీను ద్రాక్షారసాన్ని సిద్ధం చేయాలి.
  rationale: The revision clarifies the distinct Hebrew relations attached to the burnt offering and the sacrifice, while retaining the deliberately nonliteral but contextually appropriate rendering of עַל as ‘తో పాటు.’ It also corrects the grammatical terminology in footnote a and moves both footnote anchors to their respective words or phrases.
