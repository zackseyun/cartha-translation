  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆదేశ శైలిని వాడాం. ప్రాచీన కొలమానం ‘హీను’ను నిలిపి ఉంచాం; బలి సంబంధ పదాల్లో అవసరానికి మించిన మతసాంప్రదాయ ప్రత్యేకతను చేర్చలేదు.
