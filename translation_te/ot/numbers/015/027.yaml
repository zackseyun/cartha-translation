source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: te
  text: అయితే ఒక వ్యక్తి అనుకోకుండా పాపం చేస్తే, పాపపరిహార బలిగా[a] ఏడాది వయసున్న ఆడ మేకను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుద్ధీకరణ బలిగా.” హీబ్రూ పదం חַטָּאת పాపాన్ని మాత్రమే కాక, పాపం లేదా అపవిత్రతకు పరిష్కారం కలిగించే బలిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... చేస్తే
  rationale: ముందున్న సామూహిక అపరాధ నియమానికి భిన్నంగా, ఇప్పుడు ఒక వ్యక్తికి సంబంధించిన షరతును పరిచయం చేసే స్వల్ప వ్యత్యాస భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֶפֶשׁ אַחַת
  choice: ఒక వ్యక్తి
  rationale: న్యాయసంబంధ సందర్భంలో נֶפֶשׁ అంటే ‘ప్రాణం’ కంటే ‘వ్యక్తి’; אַחַת ఏకవచనాన్ని నొక్కిచెబుతుంది.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: అనుకోకుండా పాపం చేస్తే
  rationale: ఈ పదబంధం ఉద్దేశపూర్వకంగా కాక, పొరపాటున జరిగిన పాపాన్ని సూచిస్తుంది; యాజక ధర్మశాస్త్రంలోని న్యాయపరమైన భేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְהִקְרִיבָה
  choice: అర్పించాలి
  rationale: קרב హిఫీల్ రూపం బలి సందర్భంలో బలిపశువును తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది; తెలుగులో ‘అర్పించాలి’ సహజమైన, గౌరవప్రదమైన విధి ప్రయోగం.
- source_word: עֵז
  choice: ఆడ మేక
  rationale: హీబ్రూ నామవాచకం ఆడ మేకను ప్రత్యేకంగా సూచిస్తుంది; జంతువు లింగాన్ని అనువాదంలో నిలిపింది.
- source_word: בַּת שְׁנָתָהּ
  choice: ఏడాది వయసున్న
  rationale: ఈ హీబ్రూ నుడికారం మొదటి సంవత్సరంలో ఉన్న లేదా ఏడాది వయసుగల జంతువును సూచిస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలి సందర్భంలో חַטָּאת పాపంతో వ్యవహరించే ప్రత్యేక బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆధునిక తెలుగు పాఠకులకు అర్థవంతంగా ఉండి, కేవలం ‘పాపం’ అనే భావానికి పరిమితం కాకుండా బలి అర్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఏకవచన అపరాధి లింగం
  choice: ‘ఒక వ్యక్తి ... అర్పించాలి’ అనే తెలుగులో సహజమైన లింగనిరపేక్ష వ్యక్తీకరణ
  alternative: హీబ్రూ స్త్రీలింగ వ్యాకరణ రూపాలను అనుసరించి ‘ఆమె’ అని పేర్కొనడం
  rationale: נֶפֶשׁ అనే నామవాచకం వ్యాకరణపరంగా స్త్రీలింగం కావడం వల్ల క్రియలు స్త్రీలింగ ఏకవచనంలో ఉన్నాయి; ఇది అపరాధి తప్పనిసరిగా స్త్రీ అని నిర్దేశించదు. తెలుగు వాక్యంలో ‘ఒక వ్యక్తి’తో క్రియకు లింగ సూచన అవసరం లేకుండా మూలంలోని వర్తింపును సహజంగా నిలుపవచ్చు.
- issue: חַטָּאת బలి పేరు మరియు ఆచార విధి
  choice: ప్రధాన పాఠంలో ‘పాపపరిహార బలి’
  alternative: ‘శుద్ధీకరణ బలి’
  rationale: חַטָּאת పాపానికి సంబంధించిన బలిని సూచించినప్పటికీ, యాజక గ్రంథ సందర్భాల్లో దాని ఆచారపరమైన శుద్ధీకరణ విధి కూడా ప్రధానంగా ఉండవచ్చు. సాధారణంగా అర్థమయ్యే పేరును ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. మూలంలోని షరతు, ఏకవచనం, అనుద్దేశిత అపరాధం, ఆడ మేక, వయస్సు అన్నీ నిలిపాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
