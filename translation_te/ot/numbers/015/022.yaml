id: NUM.15.22
reference: Numbers 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: te
  text: అయితే మీరు తెలియకుండానే దారితప్పి, యాహ్వే మోషేకు చెప్పిన ఈ ఆజ్ఞలన్నిటినీ పాటించకపోతే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు పొరబడితే,” లేదా “మీరు తెలియక పాపం చేస్తే.” హెబ్రీ క్రియ దారితప్పడం లేదా పొరబడడం అనే భావాన్ని ఇస్తుంది; ఈ సందర్భంలో అది ఆజ్ఞలను అనుద్దేశపూర్వకంగా పాటించకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: అయితే
  rationale: కొనసాగుతున్న ధర్మశాస్త్ర ఉపదేశంలో ఒక షరతుతో కూడిన, స్వల్ప వ్యత్యాసాన్ని సూచించే సందర్భాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: תִשְׁגּוּ
  choice: మీరు తెలియకుండానే దారితప్పి
  rationale: שׁגה అనే క్రియలోని దారితప్పడం లేదా పొరబడడం అనే భావాన్ని నిలుపుతూ, ఈ యాజక-ధర్మశాస్త్ర సందర్భంలో ఉన్న అనుద్దేశపూర్వకతను తెలియజేస్తుంది.
- source_word: וְלֹא תַעֲשׂוּ
  choice: పాటించకపోతే
  rationale: ఆజ్ఞలకు సంబంధించిన עשה అనే ‘చేయు’ క్రియను సహజమైన ఆధునిక తెలుగులో ‘పాటించు’ అని అందిస్తుంది; ఇది ఆ పొరపాటు వల్ల ఆజ్ఞలు నెరవేర్చబడకపోవడాన్ని సూచిస్తుంది.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: ఈ ఆజ్ఞలన్నిటినీ
  rationale: כָּל యొక్క సమగ్రతను, הָאֵלֶּה యొక్క నిర్దిష్ట సూచనను, מִצְוֺת యొక్క నిబంధన-ధర్మశాస్త్ర భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: యాహ్వే మోషేకు చెప్పిన
  rationale: ఆజ్ఞలు యాహ్వే మోషేకు పలికినవని తెలిపే సంబంధవాక్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: ఈ వ్యక్తినామానికి తెలుగులో విస్తృతంగా అర్థమయ్యే ప్రామాణిక రూపం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: שׁגה క్రియలోని ఉద్దేశపూర్వకత స్థాయి
  choice: తెలియకుండానే దారితప్పడం
  alternative: పొరబడడం; తెలియక పాపం చేయడం
  rationale: సమీప సందర్భం అనుద్దేశపూర్వక అపరాధాన్ని ఉద్దేశపూర్వక ధిక్కారంతో వేరుచేస్తుంది. అయినా క్రియలోని ‘దారితప్పు/పొరబడు’ చిత్రణను ‘పాపం చేయు’ అని పూర్తిగా వ్యాఖ్యానించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. వాక్యం తరువాతి వచనాల్లో కొనసాగుతుండటాన్ని సూచించేందుకు చివర విరామచిహ్నంగా కామా ఉంచబడింది.
