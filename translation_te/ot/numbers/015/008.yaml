source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: te
  text: నీవు యాహ్వేకు దహనబలిగానో, బలిగానో ఒక ఎద్దును సిద్ధం చేసినప్పుడు—మొక్కుబడిని నెరవేర్చడానికో[a], సమాధాన బలిగానో[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొక్కుబడిని చెల్లించడానికి.’ హెబ్రీయ నుడికారం మొక్కుకున్నదాన్ని కార్యరూపంలో నెరవేర్చడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సహవాస బలి,’ ‘క్షేమ బలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: చేసినప్పుడు
  rationale: బలుల నియమావళిలో ఇది ముందటి సూచనను కొనసాగిస్తూ ఒక సందర్భాన్ని ప్రవేశపెడుతుంది; షరతు భావం ఉన్నప్పటికీ తెలుగులో కాలార్థకంగా చెప్పడం సహజం.
- source_word: תַעֲשֶׂה
  choice: సిద్ధం చేసినప్పుడు
  rationale: עשה సాధారణంగా ‘చేయు’ అనే అర్థం కలిగినప్పటికీ, బలిగా అర్పించడానికి పశువును ఏర్పాటు చేసే సందర్భంలో ‘సిద్ధం చేయు’ సహజంగా ఉండి, మూలంలో లేనంత నిర్దిష్టంగా ‘అర్పించు’ అని చెప్పదు.
- source_word: בֶן בָּקָר
  choice: ఒక ఎద్దును
  rationale: అక్షరార్థంగా ‘మందకు చెందిన పశువు’; సందర్భంలో గోవంశానికి చెందిన మగ పశువును సూచించే సహజమైన తెలుగు పదం ‘ఎద్దు’. వయస్సును మూలం స్పష్టంగా నిర్దేశించదు.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహించబడే బలి రకానికి స్థిరమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: אוֹ זָבַח
  choice: బలిగానైనా
  rationale: זבח విస్తృతార్థక బలి పదం; దహనబలి అనే నిర్దిష్ట వర్గానికి భిన్నంగా సాధారణ ‘బలి’ భావాన్ని నిలుపుతుంది.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: మొక్కుబడిని నెరవేర్చడానికి
  rationale: ఇక్కడి హెబ్రీయ నుడికారం చేసిన మొక్కుబడికి అనుగుణంగా దానిని కార్యరూపంలో నెరవేర్చడాన్ని సూచిస్తుంది.
- source_word: אוֹ שְׁלָמִים
  choice: సమాధాన బలిగానైనా
  rationale: שְׁלָמִים అనే బలి వర్గానికి సంప్రదాయబద్ధమైన పదాన్ని ఉంచుతుంది; సహవాసం లేదా క్షేమం అనే ఒక్క భావానికి మాత్రమే పరిమితం చేయదు.
- source_word: לַ/יהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను పేరుగానే ప్రతిబింబిస్తూ, ל ఉపసర్గను బలి గ్రహీతను సూచించే ‘కు’తో సహజంగా అనువదించింది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హెబ్రీయ వ్యంజన నామాన్ని సాధారణ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచింది; ‘ప్రభువు’గా మార్చి మూలంలోని నామాన్ని మరుగుపరచలేదు.
- issue: שְׁלָמִים బలి వర్గం అర్థం
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: మూలపదంలో సమాధానం, క్షేమం, సహవాసం వంటి అనుబంధ భావాలు ఉన్నాయి. ప్రధాన పాఠంలో స్థిరమైన వర్గపదాన్ని వాడి, ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలిని ఉపయోగించింది. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో విరామచిహ్నంగా డ్యాష్‌తో కూడిన అసంపూర్ణ నిర్మాణాన్ని నిలిపింది. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో ఉంది.
