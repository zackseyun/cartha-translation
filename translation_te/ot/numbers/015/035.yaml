  to: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఆ మనిషిని తప్పకుండా మరణశిక్షకు గురిచేయాలి[a]. సమాజమంతా అతణ్ణి శిబిరం వెలుపల రాళ్లతో కొట్టి చంపాలి[b].”'
