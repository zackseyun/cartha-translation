  source_fidelity: 'The main sense is substantially accurate: the emphatic passive death sentence, communal stoning, and location outside the camp are retained. However, יְהוָה should follow the project’s stated rendering policy as “యాహ్వే,” rather than the alternative traditional form “యెహోవా.”'
