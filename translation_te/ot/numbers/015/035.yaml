    issue: The divine name is rendered “యెహోవా” rather than “యాహ్వే.”
    rationale: The source has יְהוָה, and the supplied project audit trail explicitly selects “Yahweh.” “యాహ్వే” is the corresponding Telugu transliteration and best preserves the project’s source-oriented naming decision.
