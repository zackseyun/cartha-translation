id: NUM.15.35
reference: Numbers 15:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఆ మనిషిని తప్పకుండా మరణశిక్షకు గురిచేయాలి[a]. సమాజమంతా అతణ్ణి శిబిరం వెలుపల రాళ్లతో కొట్టి చంపాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “ఆ మనిషి తప్పకుండా చంపబడాలి.”'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో పదశః: “అతణ్ణి రాళ్లతో కొట్టాలి”; క్రియ పునరుక్తి రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయాలనే ఆజ్ఞను బలంగా వ్యక్తం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- source_word: מוֹת יוּמַת
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలమైన నిశ్చయార్థాన్ని ‘తప్పకుండా’ ద్వారా, పాసివ్ న్యాయార్థాన్ని ‘మరణశిక్ష విధించాలి’ ద్వారా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: ఇంతకుముందే గుర్తించబడిన వ్యక్తిని సూచించే నిర్దిష్ట నామవాచకాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: అతణ్ణి రాళ్లతో కొట్టి చంపాలి
  rationale: హీబ్రూ పదబంధంలోని రాళ్లతో కొట్టే చర్యను, దాని న్యాయపరమైన మరణదండన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పదశః పునరుక్తిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: כָּל־הָעֵדָה
  choice: సమాజమంతా
  rationale: ఒడంబడిక సమాజం మొత్తాన్ని సూచించే సమూహార్థాన్ని ఆధునిక, సాధారణ తెలుగులో అందిస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం బయట
  rationale: మరణదండన జరగవలసిన ప్రదేశాన్ని సూచించే స్థలార్థక పదబంధానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో బిరుదు కాకుండా దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా, తెలుగులో సుపరిచితమైన దైవనామ రూపాన్ని ఉపయోగించడం మూలానికి సమీపంగా ఉంటుంది.
- issue: మరణదండన ఆజ్ఞలోని బలమైన నిశ్చయార్థం
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  alternative: చంపాలి
  rationale: מוֹת יוּמַת నిర్మాణం కేవలం మరణాన్ని చెప్పడం కాకుండా తీర్పు యొక్క బలమైన, న్యాయపరమైన అనివార్యతను వ్యక్తం చేస్తుంది; ఆ ఉద్రిక్తతను సున్నితపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయ-కథన శైలి వాడబడింది. మూలంలోని ఆజ్ఞ తీవ్రతను తగ్గించలేదు; అసహజమైన హీబ్రూ పునరుక్తులను ప్రధాన పాఠ్యంలో సహజీకరించి పాదటిప్పణుల్లో వివరించింది.
