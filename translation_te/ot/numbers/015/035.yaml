  terminology: Use “యాహ్వే” for the Tetragrammaton, consistently with the English POB audit trail. “సమాజమంతా” appropriately conveys כָּל־הָעֵדָה, and “రాళ్లతో కొట్టి చంపాలి” naturally expresses the judicial execution by stoning.
  issues:
