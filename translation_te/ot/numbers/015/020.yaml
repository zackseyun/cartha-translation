  verdict: revise
  source_fidelity: The draft conveys the required separation and presentation of a bread portion from the first of the dough, and it retains the comparison with the threshing-floor contribution. However, “ప్రతిష్ఠిత” can imply that the gift has already been consecrated, rather than translating the source term for a contribution set apart; it is less precise and less natural here.
  naturalness: The sentence is generally clear modern Telugu. Replacing the repeated, somewhat formal “ప్రతిష్ఠిత కానుక” with “కానుక” makes the instruction more idiomatic, while “ఎత్తి అర్పించాలి” and the footnote retain the specific offering sense.
  terminology: “కళ్లం,” “పిండి,” and “రొట్టె” are suitable. “కానుక” is an appropriate transparent rendering of תְּרוּמָה when accompanied by the retained lifting language and explanatory footnote. This avoids imposing a technical ritual term while preserving the source’s sense.
  issues:
  - severity: low
    issue: “ప్రతిష్ఠిత కానుక” is not the best rendering for תְּרוּמָה.
