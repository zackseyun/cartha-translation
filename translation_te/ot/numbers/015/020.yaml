  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: te
  text: మీ పిండిలోని[a] మొదటి భాగంతో ఒక రొట్టెను కానుకగా ఎత్తి అర్పించాలి; కళ్లం నుండి ఇచ్చే కానుకలాగే దానిని ఎత్తి అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు పిసికిన పిండిలోని.’ ఈ హీబ్రూ పదం పిండిని లేదా, దాని సంబంధంతో, పిండి పిసికే పాత్రను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: మొదటి భాగం
  rationale: ఈ సందర్భంలో ఇది ఆరంభాన్ని మాత్రమే కాకుండా పిండిలో నుండి వేరుచేసే మొదటి భాగాన్ని సూచిస్తుంది.
- source_word: עֲרִסֹתֵיכֶם
  choice: మీ పిండి
  rationale: ఈ నామవాచకం పిసికిన పిండిని లేదా పిండి పిసికే పాత్రను సూచించగలదు; ఇక్కడ దానిలోని భాగంతో రొట్టె చేయడం వల్ల ‘పిండి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: חַלָּה
  choice: ఒక రొట్టె
  rationale: ఇది పిండితో రూపొందించిన రొట్టెను సూచిస్తుంది; ఆధునిక తెలుగు పాఠకునికి ‘రొట్టె’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: תָּרִימוּ
  choice: ఎత్తి అర్పించాలి
  rationale: רום అనే మూలంలోని ‘ఎత్తు’ భావాన్ని నిలుపుతూ, ఆరాధనా సందర్భంలో దానిని సమర్పించే కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְרוּמָה
  choice: ప్రతిష్ఠిత కానుక
  rationale: దేవుని కోసం ప్రత్యేకంగా వేరుచేసి సమర్పించే భాగమనే భావాన్ని వ్యక్తం చేస్తుంది; కేవలం ‘కానుక’ కంటే మూలపదపు ప్రత్యేకతను మెరుగ్గా నిలుపుతుంది.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: కళ్లం నుండి ఇచ్చే ప్రతిష్ఠిత కానుకలాగే
  rationale: ధాన్యాన్ని నూర్చే కళ్లం వద్ద ఉత్పత్తిలో నుండి వేరుచేసి ఇచ్చే కానుకతో చేసిన పోలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֹּרֶן
  choice: కళ్లం
  rationale: ధాన్యాన్ని నూర్చి, తూర్పారబట్టే స్థలానికి ప్రామాణికమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందున్న పోలికను ముగించి, అదే విధంగా చేయాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹתָהּ
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న రొట్టె లేదా ప్రతిష్ఠిత కానుకను సూచిస్తుంది; మూలంలోని స్వల్ప సూచనాత్మక అనిశ్చితిని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: תְרוּמָה అనే ఆరాధనా పదానికి అనువాదం
  choice: ప్రతిష్ఠిత కానుక
  alternative: ఎత్తి అర్పించే కానుక / అర్పణ
  rationale: ఏదైనా ప్రత్యేక ఆచార విధానాన్ని అతిగా నిర్దేశించకుండా, దేవునికి వేరుచేసి సమర్పించే భాగమనే మూలభావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఎత్తి అర్పించాలి’ ద్వారా תָּרִימוּ–תְרוּמָה మధ్య ఉన్న పదసంబంధం కొంతవరకు నిలుపబడింది; ‘కళ్లం’ వ్యవసాయ నేపథ్యాన్ని సంక్షిప్తంగా కాపాడుతుంది.
