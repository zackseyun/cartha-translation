id: NUM.15.28
reference: Numbers 15:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: te
  text: యాజకుడు యాహ్వే సన్నిధిలో, అనుకోకుండా తప్పుచేసి అనుకోకుండానే పాపం చేసిన వ్యక్తి కోసం ప్రాయశ్చిత్తం చేయాలి, అతని కోసం ప్రాయశ్చిత్తం చేయుటకై; అతడు క్షమించబడతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయాలి / ప్రాయశ్చిత్తం చేసినప్పుడు
  rationale: యాజక సంబంధ సందర్భంలో פיעל రూపమైన כפר పాపానికి పరిహారం కలిగించే ఆచారక్రియను సూచిస్తుంది. ‘ప్రాయశ్చిత్తం చేయడం’ తెలుగులో ఈ ఆరాధనాపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది; పదం పునరావృతమైన సంగతి కూడా అనువాదంలో నిలుపబడింది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనాపరమైన కార్యాన్ని నిర్వహించే వ్యక్తిని సూచించే నేరుగా, స్థిరంగా అర్థమయ్యే తెలుగు పదం.
- source_word: עַל הַנֶּפֶשׁ
  choice: వ్యక్తి కోసం
  rationale: ఇక్కడ נֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాక ఒక మనిషిని, అంటే వ్యక్తిని సూచిస్తుంది.
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: అనుకోకుండా తప్పుచేసి అనుకోకుండానే పాపం చేసిన వ్యక్తి
  rationale: שׁגג మూలం పునరావృతాన్ని ‘అనుకోకుండా … అనుకోకుండానే’ అనే సహజమైన తెలుగు నిర్మాణంతో నిలిపి, అది ఉద్దేశపూర్వక పాపం కాదనే భావాన్ని స్పష్టం చేసింది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనే సంబంధార్థాన్ని ‘సన్నిధిలో’ సహజంగా తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְנִסְלַח לוֹ
  choice: అతడు క్షమించబడతాడు
  rationale: סלח యొక్క నిష్క్రియార్థాన్ని నిలుపుతూ, ప్రాయశ్చిత్త క్రియకు ఫలితంగా క్షమాపణ లభిస్తుందని సహజమైన తెలుగులో తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: ప్రాయశ్చిత్తం యొక్క విధానం
  choice: ప్రాయశ్చిత్తం చేయడం
  alternative: పాపాన్ని తొలగించడం / దేవుణ్ణి శాంతింపజేయడం
  rationale: כפר యొక్క ఆరాధనాపరమైన విస్తృతిని నిలిపి, ప్రాయశ్చిత్తం ఎలా పనిచేస్తుందనే ఒక ప్రత్యేక సిద్ధాంతాన్ని వాక్యంలోకి చేర్చలేదు.
- issue: క్షమాపణలో కర్త
  choice: అతడు క్షమించబడతాడు
  alternative: యాహ్వే అతణ్ణి క్షమిస్తాడు
  rationale: హీబ్రూ మూలంలోని నిష్క్రియ నిర్మాణాన్ని నిలిపి, అక్కడ స్పష్టంగా చెప్పని కర్తను అనువాదంలో ప్రత్యక్షంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని שׁגג భావపునరావృతాన్ని పూర్తిగా తొలగించకుండా, తెలుగులో అతిగా కృత్రిమంగా వినిపించని విధంగా నిర్మించబడింది.
