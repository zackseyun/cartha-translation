revisions:
- from: యాజకుడు యాహ్వే సన్నిధిలో, అనుకోకుండా తప్పుచేసి అనుకోకుండానే పాపం చేసిన వ్యక్తి కోసం ప్రాయశ్చిత్తం చేయాలి. అతని కోసం ప్రాయశ్చిత్తం చేసినప్పుడు, అతడు క్షమించబడతాడు.
  to: యాజకుడు యాహ్వే సన్నిధిలో, అనుకోకుండా తప్పుచేసి అనుకోకుండానే పాపం చేసిన వ్యక్తి కోసం ప్రాయశ్చిత్తం చేయాలి, అతని కోసం ప్రాయశ్చిత్తం చేయుటకై; అతడు క్షమించబడతాడు.
  rationale: Only the second atonement clause is adjusted from a temporal formulation to a purposive infinitive. This preserves the Hebrew repetition of כפר and the repeated inadvertence language without adding an interpretation of how atonement works.
