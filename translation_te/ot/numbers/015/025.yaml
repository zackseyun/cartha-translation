id: NUM.15.25
reference: Numbers 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: te
  text: యాజకుడు ఇశ్రాయేలు ప్రజల సమాజమంతటి కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు వారికి క్షమాపణ లభిస్తుంది. ఎందుకంటే అది అనుకోకుండా జరిగిన తప్పు, మరియు వారు తమ అర్పణను—యహ్వేకు అగ్ని అర్పణను[a]—అలాగే తమ తప్పు నిమిత్తం యహ్వే సన్నిధిలో తమ పాపపరిహార బలిని[b] తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యహ్వేకు ఆహార అర్పణ.’ హీబ్రూ పదం అగ్నితో సంబంధమున్న అర్పణను సూచిస్తుంది; కొన్ని సందర్భాల్లో దానిని ‘ఆహార అర్పణ’గా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి శుద్ధీకరణ బలిని.’ ‘పాపపరిహార బలి’గా అనువదించిన హీబ్రూ పదం బలి సందర్భాల్లో శుద్ధీకరణ కోసం అర్పించే బలిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: బలుల సందర్భంలో పియేల్ రూపం పాపానికి పరిహారం కలిగించే యాజక చర్యను సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు భాషలో ‘ప్రాయశ్చిత్తం చేయడం’ స్పష్టమైన, గౌరవప్రదమైన పదబంధం.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతటి కోసం
  rationale: עַל ఇక్కడ ‘కోసం/పక్షంగా’ అనే భావం కలిగిస్తుంది. עֲדָהను ‘సమాజం’గా, בְּנֵי יִשְׂרָאֵלను సహజమైన సమష్టి ప్రయోగమైన ‘ఇశ్రాయేలు ప్రజలు’గా అనువదించడం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וְנִסְלַח לָהֶם
  choice: అప్పుడు వారికి క్షమాపణ లభిస్తుంది
  rationale: హీబ్రూ నిఫాల్ కర్మణి భావాన్ని నిలుపుతూ, క్షమించేవారి పేరును మూలంలో లేనందున అనువాదంలో చేర్చలేదు.
- source_word: כִּי שְׁגָגָה הִוא / עַל שִׁגְגָתָם
  choice: అది అనుకోకుండా జరిగిన తప్పు / ఆ తప్పు నిమిత్తం
  rationale: שְׁגָגָה ఉద్దేశపూర్వకంగా కాకుండా జరిగిన అపరాధం లేదా పొరపాటును సూచిస్తుంది. ‘అనుకోకుండా జరిగిన తప్పు’ ఈ న్యాయ-బలి సందర్భంలోని అనుద్దేశితత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת קָרְבָּנָם
  choice: తమ అర్పణను
  rationale: קָרְבָּן దేవుని ఎదుటికి తీసుకొచ్చే సాధారణ అర్పణను సూచిస్తుంది; ‘అర్పణ’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אִשֶּׁה לַיהוָה
  choice: యహ్వేకు అగ్నితో అర్పించే అర్పణను
  rationale: אִשֶּׁהను బలిపీఠపు అగ్నితో సంబంధమున్న అర్పణగా ప్రధాన పాఠంలో వ్యక్తం చేశాం. ‘ఆహార అర్పణ’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణ రూపాన్ని ఉపయోగించాం.
- source_word: וְחַטָּאתָם
  choice: తమ పాపపరిహార బలిని
  rationale: ఇక్కడ חַטָּאת తీసుకొచ్చే బలిని సూచిస్తుంది; కేవలం ‘పాపం’ కాదు. ‘పాపపరిహార బలి’ పరిచితమైన అర్థాన్ని ఇస్తుంది; ‘శుద్ధీకరణ బలి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో బలిని సమర్పించే ఆరాధనా సందర్భాన్ని సహజ తెలుగు నుడికారంతో తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ధ్వన్యనుకరణ చేయడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: חַטָּאת యొక్క బలి సంబంధమైన అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: వారు దానిని యహ్వే సన్నిధికి ‘తీసుకొచ్చారు’ కాబట్టి ఇక్కడ పదం బలిని సూచించడం స్పష్టం. అయితే ఆ బలి శుద్ధీకరణ కార్యాన్ని నొక్కిచెప్పే ప్రత్యామ్నాయ అర్థం కూడా సమర్థనీయమైనందున పాదసూచికలో ఇచ్చాం.
- issue: క్షమాపణకు సంబంధించిన కారణ వాక్యాల అనుసంధానం
  choice: తప్పు అనుకోకుండా జరిగింది; ఆ తప్పు నిమిత్తం అవసరమైన అర్పణలను వారు తీసుకొచ్చారు
  alternative: ‘అది అనుకోకుండా జరిగిన తప్పు కాబట్టి, వారు తమ అర్పణను తీసుకొచ్చారు’ అని ఒకే కారణ-ఫలిత వాక్యంగా చదవడం
  rationale: హీబ్రూలో כִּי తరువాత వచ్చే వాక్య భాగాల సంబంధం కొంత సంక్షిప్తంగా ఉంది. ప్రధాన పాఠం అనుద్దేశిత తప్పును, అర్పణలు తీసుకురావడాన్ని క్షమాపణ నేపథ్యంలోని దగ్గరగా అనుసంధానమైన అంశాలుగా ఉంచుతుంది; మరో సాధ్యమైన అనుసంధానాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన ధార్మిక శైలి. ‘ప్రాయశ్చిత్తం,’ ‘సన్నిధి,’ ‘పాపపరిహార బలి’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం. హీబ్రూ దీర్ఘ వాక్యాన్ని తెలుగులో మూడు దగ్గరగా అనుసంధానమైన వాక్యాలుగా విభజించాం; సమాచార క్రమం మరియు కారణ సంబంధం నిలిచాయి.
