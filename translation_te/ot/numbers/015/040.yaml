    text: లేదా, “మీ దేవునికి ప్రత్యేకపరచబడినవారిగా.”
    reason: కְדֹשִׁים לֵאלֹהֵיכֶם అనే పదబంధంలో ‘పరిశుద్ధులుగా’ అనే విస్తృత భావానికి ‘మీ దేవునికి ప్రత్యేకపరచబడినవారిగా’ అనేది సముచితమైన, అయితే కొద్దిగా సంకుచితమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: לְמַעַן
  choice: ఉండేలా
  rationale: ఇది ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో చివర ఉంచిన ‘ఉండేలా’ ఆ ప్రయోజనార్థక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תִּזְכְּרוּ
  choice: మీరు గుర్తుంచుకొని
  rationale: זכר అనే క్రియకు ఇక్కడ ‘గుర్తుంచుకోవడం’ సహజమైన ఆధునిక తెలుగు రూపం; ప్రయోజన వాక్యంలోని క్రియల క్రమాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם
  choice: ఆచరించి
  rationale: עשה ఇక్కడ ఆజ్ఞలను చేయడం లేదా అమలు చేయడం అనే భావంలో ఉంది. ‘ఆచరించి’ అనేది కేవలం తెలుసుకోవడం కాక క్రియలో పెట్టడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: నా ఆజ్ఞలన్నిటినీ
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం, כָּל యొక్క సమగ్రత, מִצְוֺת యొక్క నిబంధనాత్మక అర్థం అన్నీ ఈ రూపంలో నిలుస్తాయి.
- source_word: וִהְיִיתֶם
  choice: ఉండేలా
  rationale: היה తరువాత విశేషణం రావడం స్థితిని సూచిస్తుంది. ‘ఉండేలా’ అనేది ‘అవ్వడం’ అనే ప్రక్రియను అనవసరంగా బలపరచకుండా, ప్రయోజన నిర్మాణంతో సహజంగా కలుస్తుంది.
- source_word: קְדֹשִׁים
  choice: పరిశుద్ధులుగా
  rationale: ‘పరిశుద్ధులు’ అనే పదం నైతిక, నిబంధనాత్మక, ఆరాధనాసంబంధమైన విస్తృత భావాలను నిలుపుతుంది; ‘ప్రత్యేకపరచబడినవారు’ అనే ఒక్క కోణానికి అర్థాన్ని పరిమితం చేయదు.
- source_word: לֵאלֹהֵיכֶם
  choice: మీ దేవునికి
  rationale: ל ఉపసర్గ సూచించే దేవునితో సంబంధం లేదా దేవుని వైపు అంకితభావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘మీ’ అనే రూపం నిబంధన సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలోని పరిశుద్ధత భావం
  choice: ‘పరిశుద్ధులుగా’ అనే విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘మీ దేవునికి ప్రత్యేకపరచబడినవారిగా’
  rationale: ఈ వచనం ఆజ్ఞలను గుర్తుంచుకొని ఆచరించడాన్ని దేవునికి పరిశుద్ధులుగా ఉండటంతో కలుపుతుంది. ‘పరిశుద్ధులు’ అనే అనువాదం నైతికత, దేవునికి చెందినవారిగా ప్రత్యేకత, ఆరాధన సంబంధం అనే భావాల మధ్య ఉన్న ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన భాషతో పాటు వచనానికి తగిన గౌరవప్రదమైన నిబంధనాత్మక శైలి. మూలంలోని ప్రయోజన నిర్మాణం వాక్యాంత ‘ఉండేలా’ ద్వారా నిలుపబడింది.
