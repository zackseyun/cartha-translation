revisions:
- from: 'మీరు గుర్తుంచుకొని, నా ఆజ్ఞలన్నిటినీ ఆచరించి, మీ దేవునికి పరిశుద్ధులుగా[a] ఉండేలా.


    [a] లేదా, “మీ దేవునికి ప్రత్యేకపరచబడినవారిగా.”'
  to: మీరు నా ఆజ్ఞలన్నిటినీ గుర్తుంచుకొని, ఆచరించి, మీ దేవునికి పరిశుద్ధులుగా ఉండునట్లు.[a]
