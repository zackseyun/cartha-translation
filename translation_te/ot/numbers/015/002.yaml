  terminology: “ఇశ్రాయేలు కుమారులు,” “దేశం,” మరియు “నేను మీకు ఇస్తున్న” అనే ప్రయోగాలు మూలపాఠ్యానికి, స్థిరమైన బైబిలు పరిభాషకు అనుగుణంగా ఉన్నాయి. ప్రత్యామ్నాయమైన “ఇశ్రాయేలీయులు/ఇశ్రాయేలు సంతానం” పాదటిప్పణిలో సముచితంగా ఇవ్వబడ్డాయి.
