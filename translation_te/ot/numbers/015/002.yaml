  source_fidelity: హీబ్రూ ఆజ్ఞా-సూత్రం ("మాట్లాడి ... చెప్పు"), బְּנֵי יִשְׂרָאֵל యొక్క కుటుంబసంబంధ రూపం, ప్రవేశానికి సంబంధించిన కాలవాక్యం, అలాగే నֹתֵן‌లోని కొనసాగుతున్న దానభావం అన్నీ తగినట్లుగా ప్రతిఫలించాయి. “మీరు నివసించబోయే దేశం” మוֹשְׁבֹתֵיכֶם యొక్క సందర్భానుగుణమైన, స్పష్టమైన అనువాదం; పాదటిప్పణి అక్షరార్థ నిర్మాణాన్ని కూడా కాపాడుతుంది.
