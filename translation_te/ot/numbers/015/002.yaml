id: NUM.15.2
reference: Numbers 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారులతో మాట్లాడి, వారికి ఇలా చెప్పు:[a] ‘నేను మీకు ఇస్తున్న, మీరు నివసించబోయే దేశంలోకి[b] మీరు వచ్చినప్పుడు,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులతో” లేదా “ఇశ్రాయేలు సంతానంతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులతో.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “మీ నివాసాల దేశంలోకి”; లేదా “మీ స్థిరనివాసాల దేశంలోకి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడి
  rationale: దివ్య ఆదేశాన్ని మోషే ప్రజలకు తెలియజేయాలనే పీయేల్ ఆజ్ఞార్థక ప్రయోగాన్ని, తరువాతి ‘వారికి ఇలా చెప్పు’ అనే సూత్రబద్ధ వాక్యంతో సహజంగా కలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధమైన, పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు నిబంధన సమాజాన్ని సూచిస్తుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారికి ఇలా చెప్పు
  rationale: హీబ్రూ వరుస ఆజ్ఞా సూత్రాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్షోక్తి పరిచయంగా అందిస్తుంది.
- source_word: כִּי
  choice: వచ్చినప్పుడు
  rationale: తరువాతి నియమాలు వర్తించే, ఎదురుచూస్తున్న భవిష్యత్ పరిస్థితిని సూచిస్తుంది; కారణార్థకంగా మార్చదు.
- source_word: תָבֹאוּ
  choice: మీరు వచ్చినప్పుడు
  rationale: בוא అనే క్రియలోని ‘రావడం/ప్రవేశించడం’ భావాన్ని ‘దేశంలోకి’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ
  choice: దేశం
  rationale: వాగ్దాన భూభాగాన్ని సూచించే సాధారణ, గౌరవప్రదమైన తెలుగు పదం; ‘భూమి’ కంటే ఇక్కడ రాజకీయ-నివాస భూభాగ భావం స్పష్టంగా ఉంటుంది.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించబోయే
  rationale: అక్షరార్థమైన ‘మీ నివాసాల దేశం’ తెలుగులో అసహజంగా ఉండటంతో, నివాస స్థలం/స్థిరనివాసం అనే భావాన్ని స్పష్టంగా, కాలసందర్భానికి తగిన విధంగా అందిస్తుంది.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: నేను మీకు ఇస్తున్న
  rationale: נֹתֵן అనే కృదంత రూపంలోని కొనసాగుతున్న లేదా సమీపమైన దైవిక దాన భావాన్ని సాధారణ భవిష్యత్తుగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని పుత్రసంబంధమైన పుంలింగ రూపాన్ని నిలిపి, దాన్ని లింగతటస్థ సమూహపదంగా నిశ్శబ్దంగా మార్చలేదు; అదే సమయంలో ప్రత్యామ్నాయ సహజ ప్రయోగాలను పాదటిప్పణిలో సూచిస్తుంది.
- issue: נֹתֵן లో దైవిక దానపు కాలాంశం
  choice: నేను మీకు ఇస్తున్న
  alternative: నేను మీకు ఇచ్చే / నేను మీకు ఇవ్వబోయే
  rationale: దేవుని దానం సమీపంలోనూ నిశ్చయంగానూ ఉందనే కృదంత భావాన్ని కాపాడుతుంది; హీబ్రూలో తప్పనిసరిగా లేని సరళ భవిష్యత్ భావాన్ని చేర్చదు.
- issue: מוֹשְׁבֹתֵיכֶם యొక్క అసాధారణ నిర్మాణం
  choice: మీరు నివసించబోయే దేశం
  alternative: మీ నివాసాల దేశం / మీ స్థిరనివాసాల దేశం
  rationale: మూలంలోని ‘నివాసాలు/స్థిరనివాసాలు’ భావాన్ని ఉంచుతూ తెలుగులో అర్థవంతంగా చేస్తుంది; ఇది ఇప్పటికే ఉన్న నివాసాలా లేక భవిష్యత్ నివాస స్థలమా అనే నిర్మాణాత్మక ఒత్తిడిని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ ఆజ్ఞా సూత్రాన్ని నిలుపుతూ, అసహజమైన ‘నివాసాల దేశం’ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి పాదటిప్పణిలో అక్షరార్థాన్ని భద్రపరచింది.
