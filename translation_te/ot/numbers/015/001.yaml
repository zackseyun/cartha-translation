    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవ ప్రసంగాన్ని ముందుకు నడిపించే సాధారణ కథన రూపం. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘చెప్పాడు’ తరువాత వచ్చే మాటల విషయాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: దైవ ప్రసంగం ఎవరిని ఉద్దేశించిందో తెలుగులో సహజంగా తెలిపే విభక్తి రూపం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రాయ నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా’ మరియు ద్విబిందువుతో వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మూల హీబ్రూ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ ‘మాట్లాడి, చెబుతూ’ అనే పునరుక్త సూత్రాన్ని తెలుగులో అసహజంగా ప్రతిబింబించకుండా ‘ఇలా చెప్పాడు:’గా అందించాం.
