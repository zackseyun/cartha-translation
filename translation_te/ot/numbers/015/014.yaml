id: NUM.15.14
reference: Numbers 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: te
  text: ఒక పరదేశి మీతో నివసిస్తూ ఉంటే, లేదా మీ తరతరాల్లో మీ మధ్య ఉండే ఎవరైనా యెహోవాకు ఇంపైన సువాసనగా ఉండే అగ్న్యర్పణం అర్పిస్తే, మీరు ఎలా చేస్తారో ఆ వ్యక్తీ అలాగే చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: నివసించినా ... అర్పిస్తే
  rationale: ముందున్న నియమానికి అనుసంధానమైన షరతును సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలీయుడు కానప్పటికీ వారి మధ్య నివసించే వ్యక్తిని సూచించే న్యాయపరమైన భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָגוּר אִתְּכֶם
  choice: మీతో నివసించినా
  rationale: גור అనే ధాతువులోని తాత్కాలిక లేదా పరదేశ నివాస భావాన్ని, אִתְּכֶם లోని ‘మీతో’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: లేదా ... మీ మధ్య ఉండే ఎవరైనా
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణంలోని విస్తృత, కొంత అస్పష్టమైన పరిధిని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాల్లో
  rationale: ఈ నియమం తరువాతి తరాలన్నిటిలో వర్తిస్తుందనే కొనసాగింపు భావాన్ని తెలియజేస్తుంది.
- source_word: אִשֵּׁה
  choice: అగ్నిపై అర్పించే అర్పణ
  rationale: ఇది అగ్నితో సంబంధమున్న బలిని సూచిస్తుందని స్పష్టంగా చెబుతుంది; దీనిని ప్రత్యేకమైన ‘దహనబలి’గా పరిమితం చేయదు. ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగల
  rationale: దేవునికి ఆమోదయోగ్యమైన బలిని సూచించే బలిపూజా రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలపాఠంలోని దైవనామాన్ని పేరుగానే ప్రతిబింబిస్తుంది; לְ యొక్క దిశ/గ్రహీత భావాన్ని ‘కు’ తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: మీరు ఎలా చేస్తారో అతడూ అలాగే చేయాలి
  rationale: ఒకే ఆచార విధానం వర్తించాలనే పోలికను, న్యాయవిధిలోని ఆదేశ బలాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయుడు కాని నివాసికి బలిపూజా విధానం వర్తించే తీరు
  choice: ఈ సందర్భంలో పరదేశి లేదా వారి మధ్యనున్న వ్యక్తి ఇశ్రాయేలీయులు అనుసరించే అదే బలిపూజా విధానాన్ని అనుసరించాలి.
  alternative: ఇది ఇశ్రాయేలు నిబంధనా సమాజంలో ఇప్పటికే కలిసిపోయిన నివాస పరదేశికి మాత్రమే వర్తిస్తుందని మరింత సంకుచితంగా చదవవచ్చు.
  rationale: ‘మీరు ఎలా చేస్తారో అతడూ అలాగే చేయాలి’ అనే హీబ్రూ న్యాయసూత్రం ఈ కార్యంలో సమాన విధానాన్ని నొక్కిచెబుతుంది. అయితే ఆ వ్యక్తి నిబంధనా స్థితి గురించి వచనం చెప్పనిదాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయపరమైన మరియు బలిపూజా గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ‘పరదేశి’ అనే పదం వ్యక్తి స్థానికేతర స్థితిని తెలియజేస్తుంది; ‘అగ్నిపై అర్పించే అర్పణ’ ప్రత్యేక బలి రకంతో అనవసరంగా సమానం చేయకుండా మూలంలోని విస్తృత పదాన్ని ప్రతిబింబిస్తుంది.
