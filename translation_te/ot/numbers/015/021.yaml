source:
  edition: WLC
  text: מֵ/רֵאשִׁית֙ עֲרִסֹ֣תֵי/כֶ֔ם תִּתְּנ֥וּ לַ/יהוָ֖ה תְּרוּמָ֑ה לְ/דֹרֹ֖תֵי/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: te
  text: మీ పిండిలోని తొలిభాగం నుండి యెహోవాకు ఒక ప్రత్యేక కానుకను ఇవ్వాలి; మీ తరతరాలపాటు ఇలా ఇవ్వాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ పిండి కలిపే పాత్రలలోని’; హీబ్రూ పదం పిండిని గానీ, దానితో అనుబంధంగా పిండి కలిపే పాత్రను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రత్యేక కానుక’కు ‘అర్పణ’ లేదా సంప్రదాయంగా ‘ఎత్తి అర్పించే కానుక’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: మొదటి భాగం నుండి
  rationale: רֵאשִׁית ఇక్కడ కాలారంభాన్ని కాకుండా పిండిలో మొదట వేరుచేసే భాగాన్ని సూచిస్తుంది; מן ఉపసర్గలోని భాగార్థాన్ని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
- source_word: עֲרִסֹתֵיכֶם
  choice: మీ పిండిలోని
  rationale: עֲרִסָה పిండిని లేదా దానితో అనుబంధంగా పిండి కలిపే పాత్రను సూచించగలదు. సమర్పించేది పాత్రలోని పదార్థపు భాగం కాబట్టి ప్రధాన పాఠంలో ‘పిండి’ సహజంగా సరిపోతుంది.
- source_word: תִּתְּנוּ
  choice: ఇవ్వాలి
  rationale: נתן అనే సాధారణ ‘ఇవ్వు’ క్రియలోని నేరుగా ఉన్న ఆజ్ఞార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలపాఠంలోని יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’ రూపంతో సూచిస్తుంది.
- source_word: תְּרוּמָה
  choice: ఒక ప్రతిష్ఠిత కానుకను
  rationale: תְּרוּמָה సాధారణ కానుక మాత్రమే కాక, వేరుచేసి దేవునికి సమర్పించే భాగాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠిత కానుక’ ఆ భావాన్ని అర్థమయ్యే ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: తరతరాలుగా
  rationale: ఈ నిబంధన వరుస తరాలన్నిటిలో కొనసాగాలనే కాలవ్యాప్తి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: תְּרוּמָה యొక్క ఆరాధనా భావం
  choice: ప్రతిష్ఠిత కానుక
  alternative: అర్పణ / ఎత్తి అర్పించే కానుక
  rationale: మూలపదం వేరుచేసి సమర్పించిన భాగాన్ని సూచిస్తుంది. సాంకేతికమైన ఆచారపదాన్ని ప్రధాన పాఠంలో బలవంతంగా పెట్టకుండా, దాని ప్రత్యేకతను ‘ప్రతిష్ఠిత’ ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూలోని ఒకే వాక్యాన్ని తెలుగులో రెండు చిన్న వాక్యాలుగా విభజించి, నిరంతర తరాల ఆజ్ఞను స్పష్టంగా తెలిపాం; పదార్థం–పాత్ర అనే నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
