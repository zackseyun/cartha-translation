source:
  edition: WLC
  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: te
  text: వారు అతనిని నిర్బంధంలో ఉంచారు,[a] ఎందుకంటే అతని విషయంలో ఏమి చేయాలో ఇంకా స్పష్టంగా నిర్దేశించబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని విషయంలో ఏమి చేయాలో ఇంకా స్పష్టంగా తెలియజేయబడలేదు.”
    reason: פרש అనే క్రియకు ‘స్పష్టంగా నిర్దేశించు’ లేదా ‘స్పష్టంగా తెలియజేయు’ అనే సమీపార్థాలు ఉండవచ్చు.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: ఉంచారు
  rationale: హిఫిల్ రూపంలోని נוח ఇక్కడ ఒక వ్యక్తిని నిర్బంధ స్థితిలో ఉంచడాన్ని సూచిస్తుంది; ‘ఉంచారు’ సహజంగా, అతిశయోక్తి లేకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֹתוֹ
  choice: అతన్ని
  rationale: ముందటి సందర్భంలో కట్టెలు ఏరుతూ కనిపించిన పురుషునిని సూచించే పుంలింగ ఏకవచన ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: בַּמִּשְׁמָר
  choice: కాపలాలో
  rationale: מִשְׁמָר కాపలా, నిర్బంధం లేదా నిర్బంధ స్థలాన్ని సూచించవచ్చు. ‘కాపలాలో’ అనేది అధికారిక జైలుశిక్ష అని అధికంగా చెప్పకుండా, పర్యవేక్షణలో నిర్బంధించిన భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: నిర్బంధానికి కారణాన్ని తెలిపే కారణార్థక సంబంధాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: לֹא פֹרַשׁ
  choice: ఇంకా స్పష్టంగా నిర్దేశించబడలేదు
  rationale: פרש యొక్క కర్మణి రూపం విషయం స్పష్టంగా ప్రకటించబడకపోవడం లేదా నిర్దేశించబడకపోవడాన్ని సూచిస్తుంది. ‘స్పష్టంగా నిర్దేశించబడలేదు’ న్యాయపరమైన అనిశ్చితిని కాపాడుతుంది; ‘ఇంకా’ సందర్భానుగుణమైన కాలభావాన్ని తెలుపుతుంది.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: అతనికి ఏమి చేయాలో
  rationale: అతని విషయంలో ఏ చర్య తీసుకోవాలనే న్యాయపరమైన ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయ ప్రక్రియలో అనిశ్చితి స్వభావం
  choice: అతనికి చేయవలసినది ఇంకా స్పష్టంగా నిర్దేశించబడలేదని మాత్రమే వచనం చెబుతుంది.
  alternative: ప్రత్యేకంగా ఏ శిక్ష విధించాలో ఇంకా ప్రకటించబడలేదని సంకుచితంగా అర్థం చేసుకోవచ్చు.
  rationale: לֹא פֹרַשׁ అనే కర్మణి పదబంధం స్పష్టమైన నిర్దేశం లేకపోవడంపై దృష్టి పెడుతుంది. అనువాదం సాధారణంగా ధర్మశాస్త్రం తెలియదని గానీ, కేవలం శిక్ష మాత్రమే తెలియదని గానీ నిర్ణయించకుండా మూలంలోని ప్రక్రియాపరమైన అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. ‘కాపలాలో’ అనే పదం తాత్కాలిక నిర్బంధాన్ని సూచిస్తూ ‘జైలులో’ అనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
