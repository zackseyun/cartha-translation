  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH” (יהוה); సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: దైవనామానికి సంబంధించిన హీబ్రూ మూలరూపాన్ని, సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: వావ్-కన్సిక్యూటివ్‌తో కూడిన דבר కొత్త దైవిక ప్రసంగ సంఘటనను ప్రారంభిస్తుంది. పునరావృతమయ్యే ఈ సూత్రప్రాయ వాక్యంలో ‘మాట్లాడాడు’ సహజంగా ఉండి, మూలంలోని క్రియను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל సంబోధింపబడిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మోషేతో మాట్లాడాడు’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ ఇన్ఫినిటివ్ నిర్మాణం తరువాత వచ్చే ప్రసంగ విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా మాట్లాడాడు:’ అనే నిర్మాణం దాని కార్యాన్ని సహజంగా తెలియజేస్తుంది; ‘అంటూ’ అని యాంత్రికంగా అనువదించడాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ఉచ్చారణ పునర్నిర్మాణంలో ఉన్న పరిమితిని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి ప్రత్యక్ష ప్రసంగాన్ని సూచించేందుకు చివర ద్విబిందువు వాడబడింది. మూలంలోని సూత్రప్రాయ ‘మాట్లాడి, చెప్పాడు’ నిర్మాణాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా ‘ఇలా మాట్లాడాడు’గా ఇచ్చాం.
