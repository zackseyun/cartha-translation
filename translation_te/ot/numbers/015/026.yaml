source:
  edition: WLC
  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: te
  text: ఇశ్రాయేలీయుల సమాజమంతటికీ, వారి మధ్య నివసిస్తున్న పరదేశికీ క్షమాపణ లభిస్తుంది; ఎందుకంటే ప్రజలందరూ తెలియక తప్పు చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే ప్రజలందరికీ అది పొరపాటున జరిగినది.” హీబ్రూ చివరి వాక్యభాగం సంక్షిప్తంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: క్షమాపణ లభిస్తుంది
  rationale: నిఫాల్ రూపం ఇక్కడ భావకర్మకమైన అర్థాన్ని ఇస్తుంది. తెలుగులో సహజమైన ‘క్షమాపణ లభిస్తుంది’ అనే ప్రయోగం సమాజానికీ పరదేశికీ క్షమ లభించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల సమాజమంతటికీ
  rationale: עֵדָה అనే పదంలోని సమూహ భావాన్ని ‘సమాజం’ సహజంగా వ్యక్తపరుస్తుంది; בְּנֵי יִשְׂרָאֵל అనే హీబ్రూ జాతీయ సంజ్ఞను ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’గా అందించడం సులభగ్రాహ్యం.
- source_word: וְלַגֵּר
  choice: పరదేశికీ
  rationale: גֵּר అనేది ఇశ్రాయేలు సమాజం మధ్య స్థిరంగా నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ ఈ న్యాయ-సామాజిక వర్గాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: הַגָּר בְּתוֹכָם
  choice: వారి మధ్య నివసించే
  rationale: גור ధాతువు యొక్క నివాస భావాన్ని సహజ తెలుగులో ‘నివసించే’గా వ్యక్తపరుస్తుంది; హీబ్రూలోని నామ-క్రియా పదప్రతిధ్వనిని తెలుగులో బలవంతంగా పునరావృతం చేయలేదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సంధిపదం ముందున్న క్షమాపణ ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: ప్రజలందరికీ అది పొరపాటున జరిగినదే
  rationale: హీబ్రూ చివరి వాక్యభాగం సంక్షిప్తంగా ఉంది. לְను ‘ప్రజలందరికీ’గా నిలుపుతూ, בִּשְׁגָגָהలోని అనుద్దేశపూర్వక తప్పిద భావాన్ని ‘పొరపాటున’గా అందించాం; తెలుగులో వాక్యం పూర్తికావడానికి ‘అది జరిగినదే’ను పూరించాం.
theological_decisions:
- issue: క్షమాపణ యొక్క సామూహిక పరిధి
  choice: క్షమాపణ ఇశ్రాయేలీయుల సమాజమంతటికీ, వారి మధ్య నివసించే పరదేశికీ వర్తిస్తుందని అనువదించాం.
  alternative: ‘ఇశ్రాయేలు కుమారుల సమాజమంతటికీ’ అని మరింత రూపనిష్ఠంగా అనువదించవచ్చు.
  rationale: వచనం క్షమాపణలో సమాజాన్నీ నివాస పరదేశినీ కలిపి చూపుతుంది; దీనికి అదనపు సిద్ధాంత వివరణను జోడించలేదు.
- issue: చివరి వాక్యభాగంలోని సంక్షిప్తత
  choice: ‘ప్రజలందరికీ అది పొరపాటున జరిగినదే’ అని ప్రధాన పాఠ్యంలో ఉంచాం.
  alternative: ‘ప్రజలందరూ పొరపడ్డారు’ అని కూడా అర్థం చేసుకోవచ్చు.
  rationale: לְכָל הָעָם בִּשְׁגָגָה అనే హీబ్రూ నిర్మాణం సంక్షిప్తమైనది. ప్రధాన అనువాదం అనుద్దేశపూర్వకంగా జరిగిన కార్యాన్ని సూచిస్తుండగా, ప్రత్యామ్నాయం ప్రజల సామూహిక తప్పిదాన్ని ముందుకు తెస్తుంది; ఈ నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ-ఆరాధనా సందర్భానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ రూపొందించబడింది. ‘పరదేశి’కి సందర్భానుసార అర్థం వచ్చేలా ‘వారి మధ్య నివసించే’ అనే విశేషణ భాగాన్ని ఉంచాం.
