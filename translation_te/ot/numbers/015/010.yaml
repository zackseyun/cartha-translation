source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: te
  text: పానార్పణగా అర హీను ద్రాక్షమద్యాన్ని అర్పించాలి. అది యెహోవాకు ఇంపైన సువాసన కలిగించే అగ్న్యర్పణ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహారార్పణ.”
    reason: אִשֶּׁה అనే హీబ్రూ బలి సంబంధ పదాన్ని ‘అగ్న్యర్పణ’గా లేదా విస్తృత కార్యార్థంలో ‘ఆహారార్పణ’గా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְיַיִן
  choice: ద్రాక్షమద్యాన్ని
  rationale: יַיִן అంటే ద్రాక్షతో చేసిన మద్యం. ఆధునిక తెలుగు పాఠకులకు అర్థం స్పష్టంగా ఉండేలా ‘ద్రాక్షమద్యం’ అని అనువదించాం; వాక్యారంభంలోని וְ భావం తెలుగు వాక్యప్రవాహంలో సహజంగా అంతర్లీనమైంది.
- source_word: תַּקְרִיב
  choice: అర్పించాలి
  rationale: קרב ధాతువు హిఫీల్ రూపంలో బలి లేదా అర్పణను దేవుని సన్నిధికి తీసుకురావడం, సమర్పించడం అనే భావం ఇస్తుంది. బలుల సందర్భంలో ‘అర్పించాలి’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: לַנֶּסֶךְ
  choice: పానార్పణగా
  rationale: נֶסֶךְ పోసి అర్పించే ద్రవ అర్పణను సూచిస్తుంది. ‘పానార్పణ’ స్థిరమైన బైబిలు సంబంధ పదమే కాక సాధారణ పాఠకుడికీ సందర్భంలో గ్రాహ్యంగా ఉంటుంది.
- source_word: חֲצִי הַהִין
  choice: అర హీను
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక అంచనాగా మార్చకుండా ‘హీను’ అనే పేరునే నిలిపి, పరిమాణాన్ని ‘అర’ అని సహజంగా తెలిపాం.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఈ యాజక సంబంధ పదానికి సంప్రదాయంగా అగ్నితో అర్పించే అర్పణ అనే భావం ఇవ్వబడుతుంది. అయితే ‘ఆహారార్పణ’ అనే క్రియాత్మక అర్థం కూడా ప్రతిపాదించబడినందున దానిని పాదటిప్పణిలో నిలిపాం.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: ఇది దేవునికి అర్పణ ఆమోదయోగ్యంగా ఉండడాన్ని తెలిపే స్థిరమైన బలి సంబంధ పదబంధం. ‘ఇంపైన సువాసన’ సహజంగా ఉండి, వాసనే దేవుణ్ణి శాంతింపజేస్తుందనే అనవసర భావాన్ని బలవంతంగా చేర్చదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను ప్రాజెక్టు విధానానికి అనుగుణంగా ‘యెహోవా’గా లిప్యంతరీకరించాం; לְ ఉపసర్గను ‘-కు’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: אִשֵּׁה యొక్క బలి సంబంధ భావం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహారార్పణ
  rationale: పదానికి అగ్నితో సంబంధమున్న సంప్రదాయ అవగాహనను ప్రధాన పాఠ్యంలో ఉంచాం. దాని ఖచ్చితమైన వ్యుత్పత్తి, కార్యార్థంపై ఉన్న నిజమైన అనిశ్చితిని పాదటిప్పణిలో ప్రత్యామ్నాయంగా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ సమన్వయ నిర్మాణాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి భావసంబంధాన్ని స్పష్టంగా ఉంచాం.
