  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בְּ/בֹֽאֲ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֛י מֵבִ֥יא אֶתְ/כֶ֖ם שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] మాట్లాడు; వారితో ఇలా చెప్పు: ‘నేను మిమ్మల్ని తీసుకువెళ్తున్న దేశంలోకి మీరు ప్రవేశించినప్పుడు,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; సందర్భంలో ‘ఇశ్రాయేలు సంతానం’ లేదా ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: దైవ ఆదేశాన్ని మోషే ప్రజలకు తెలియజేయాలనే ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ పదబంధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: ‘మాట్లాడు ... చెప్పు’ అనే వరుస ఆజ్ఞల నిర్మాణాన్ని కాపాడుతూ, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: בְּבֹאֲכֶם
  choice: మీరు ప్రవేశించినప్పుడు
  rationale: ఇక్కడ בוא అనేది దేశంలోకి రావడం, అంటే ప్రవేశించడం అనే భావాన్ని ఇస్తుంది; בְּతో కూడిన క్రియారూపం కాలార్థకమైన ‘...ప్పుడు’గా అనువదించబడింది.
- source_word: אֶל הָאָרֶץ
  choice: దేశంలోకి
  rationale: భూభాగంలోకి ప్రవేశించే గమనాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: నేను మిమ్మల్ని తీసుకువెళ్తున్న
  rationale: מֵבִיא అనే కర్తరి భాగధాతువు దేవుడు కొనసాగిస్తూ, లక్ష్యం వైపు చేస్తున్న కార్యాన్ని సూచిస్తుంది. שָׁמָּהలోని ‘అక్కడికి’ భావం ‘దేశంలోకి’లో సహజంగా అంతర్భవిస్తుంది.
