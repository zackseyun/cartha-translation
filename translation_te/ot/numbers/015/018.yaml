  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని సూత్రబద్ధమైన ‘మాట్లాడు; ... చెప్పు’ నిర్మాణం నిలుపబడింది; లింగరూపమున్న హీబ్రూ కుటుంబసంబంధ వ్యక్తీకరణకు పాదటిప్పణి ద్వారా సమష్టి భావం వివరించబడింది.
