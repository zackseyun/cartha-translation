  text: אֵת֩ כָּל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶׁ֑ה מִן הַ/יּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה וָ/הָ֖לְאָה לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: te
  text: యాహ్వే మోషే ద్వారా[a] మీకు ఆజ్ఞాపించినదంతా—యాహ్వే ఆజ్ఞాపించిన రోజు మొదలుకొని, ఇకముందు మీ తరతరాలన్నిటిలో—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “మోషే చేతివల్ల”; ఇది “మోషే ద్వారా” అని అర్థమిచ్చే నానుడి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: אֵת అనే కర్మ సూచికతో కూడిన כָּל אֲשֶׁר తరువాత చెప్పబడే ఆజ్ఞల సంపూర్ణతను సూచిస్తుంది; తెలుగులో ‘ఆజ్ఞాపించినదంతా’ సహజంగా, సమగ్ర భావంతో ఉంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: పూర్తయిన ఆజ్ఞాపన క్రియను, ప్రస్తుతం వర్తించే ఆదేశాల సముదాయంగా సందర్భం చూపుతుంది; తెలుగు అసమాపక రూపం వాక్య నిర్మాణంలో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించబడింది.
- source_word: אֲלֵיכֶם
  choice: మీకు
  rationale: హీబ్రూ ఉపసర్గ భావాన్ని తెలుగులో ప్రత్యక్షంగా చూపుతూ, ఆజ్ఞలను అందుకున్న వారిని స్పష్టపరుస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; ఇక్కడ בְּיַד మధ్యవర్తిత్వం లేదా సాధనాన్ని సూచించే నానుడి కాబట్టి ‘మోషే ద్వారా’ సహజమైన తెలుగు.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: ఆజ్ఞాపించిన రోజు మొదలుకొని
  rationale: ఆజ్ఞలు ఇవ్వబడిన కాలారంభ బిందువును దగ్గరగా, చదవడానికి సులభంగా తెలియజేస్తుంది.
- source_word: וָהָלְאָה
  choice: ఇకముందు
  rationale: పేర్కొన్న ఆరంభ కాలం నుండి ముందుకు కొనసాగడాన్ని సూచిస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలన్నిటిలో
  rationale: వరుస తరాలన్నిటి అంతటా కొనసాగే వర్తనను ‘తరతరాలన్నిటిలో’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామమైన יהוה ను నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఉంచడం మూలంలోని నామాన్ని సంరక్షిస్తుంది.
- issue: בְּיַד מֹשֶׁה లో మోషే పాత్ర
  choice: మోషే ద్వారా
  alternative: మోషే చేతి ద్వారా
  rationale: ఈ నానుడి మోషే ఆజ్ఞల మూలమని కాక, యెహోవా ఆజ్ఞలను అందించిన మధ్యవర్తి అని సూచిస్తుంది; ‘ద్వారా’ ఆ సంబంధాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం 22వ వచనంలో మొదలైన షరతు వాక్యాన్ని కొనసాగిస్తున్నందున, మూలంలోని అసంపూర్ణ వాక్య ప్రవాహాన్ని చివరి దీర్ఘ విరామచిహ్నంతో నిలిపి ఉంచింది.
