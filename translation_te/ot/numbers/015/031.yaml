source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: te
  text: ఎందుకంటే అతడు యహ్వే మాటను తృణీకరించి, ఆయన ఆజ్ఞను ఉల్లంఘించాడు. ఆ వ్యక్తి తప్పక తొలగించబడతాడు[a]; అతని దోషం అతనిమీదే ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యప్రయోగం అక్షరార్థంగా, “ఆ వ్యక్తి తప్పక తొలగించబడతాడు.” ఈ తీర్పు ఏ రూపంలో అమలవుతుందో ఈ వచనం నిర్దిష్టంగా చెప్పదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “అతని అక్రమం అతనిమీదే ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి తీర్పుకు కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: דְבַר יְהוָה
  choice: యెహోవా మాటను
  rationale: דָּבָר యొక్క ‘మాట’ అనే భావాన్ని, యెహోవా అనే నిబంధన నామాన్ని నేరుగా నిలుపుతుంది.
- source_word: בָּזָה
  choice: తృణీకరించి
  rationale: కేవలం నిర్లక్ష్యం కాకుండా ఉద్దేశపూర్వకమైన ధిక్కారాన్ని సూచిస్తుంది.
- source_word: מִצְוָתוֹ
  choice: ఆయన ఆజ్ఞను
  rationale: హీబ్రూలోని ఏకవచనాన్ని నిలుపుతూ, తెలుగులో సహజమైన గౌరవ సూచక సర్వనామాన్ని ఉపయోగిస్తుంది.
- source_word: הֵפַר
  choice: ఉల్లంఘించాడు
  rationale: దైవ ఆజ్ఞను భంగపరచడం అనే న్యాయసంబంధ భావాన్ని సహజంగా అందిస్తుంది; ‘రద్దుచేశాడు’ అనే సంభావ్య అర్థం ఈ సందర్భంలో అతిగా సాంకేతికంగా ఉంటుంది.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: తప్పక సమాజం నుండి తొలగించబడాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలాన్ని ‘తప్పక’ ద్వారా నిలుపుతుంది. ‘సమాజం నుండి’ అనేది సందర్భార్థాన్ని స్పష్టం చేసినా, తీర్పు అమలయ్యే ఖచ్చిత రూపాన్ని పాదటిప్పణిలో అనిర్ణీతంగా ఉంచింది.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి
  rationale: న్యాయ సందర్భంలో נֶפֶשׁ మొత్తం వ్యక్తిని సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే తప్పుదారి పట్టించే మానవశాస్త్రీయ భావం కలగవచ్చు.
- source_word: עֲוֺנָהּ בָּהּ
  choice: అతని దోషం అతనిమీదే ఉంటుంది
  rationale: అపరాధానికి సంబంధించిన బాధ్యత అపరాధిపైనే ఉందనే న్యాయభావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘ఏ’ బాధ్యతను నొక్కిచెబుతుంది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా లిప్యంతరీకరిస్తుంది.
- issue: ‘తొలగించబడటం’ అనే నిబంధనాత్మక తీర్పు యొక్క ఖచ్చిత స్వరూపం
  choice: తీర్పు యొక్క ఖచ్చిత అమలు విధానాన్ని నిర్ణయించకుండా ఉంచడం
  alternative: మరణశిక్ష పొందాలి / సమాజం నుండి బహిష్కరించబడాలి
  rationale: כרת నిఫాల్ రూపం తీవ్రమైన నిబంధనాత్మక-న్యాయ తీర్పును సూచిస్తుంది; అయితే అది మరణమా, దైవ తీర్పా, లేక సమాజ బహిష్కరణమా అన్నది ఈ వచనం స్పష్టంచేయదు. అందువల్ల పాదటిప్పణి ఆ అనిశ్చితిని కాపాడుతుంది.
- issue: עָוֹן యొక్క భావం
  choice: దోషం
  alternative: అక్రమం
  rationale: ఇక్కడ పదం పాపకార్యంతో పాటు దాని న్యాయబద్ధ బాధ్యతను సూచిస్తుంది; ‘దోషం’ రెండవ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన న్యాయ-నిబంధన శైలిని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం ఉపయోగించబడింది. గౌరవ సూచకంగా దేవునికి ‘ఆయన’ వాడబడింది.
