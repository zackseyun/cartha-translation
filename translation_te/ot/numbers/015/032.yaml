  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు అరణ్యంలో ఉన్నప్పుడు, సబ్బాతు దినాన కట్టెలు ఏరుకుంటున్న[a] ఒక మనిషిని వారు కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిన్న కర్రలను ఏరుకుంటున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఉన్నప్పుడు
  rationale: ఈ సందర్భంలో היה క్రియ కథనానికి నేపథ్యాన్ని ఏర్పరుస్తోంది. తదుపరి సంఘటనతో సహజంగా కలపడానికి ‘ఉన్నప్పుడు’ అని అనువదించాం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు.’ అయితే ఇక్కడ అది ఒడంబడిక ప్రజలను సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר ఇశ్రాయేలీయుల సంచార ప్రాంతమైన జనావాసం లేని అరణ్య ప్రదేశాన్ని సూచిస్తుంది; కేవలం ఇసుక ఎడారి అనే అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיִּמְצְאוּ
  choice: వారు కనుగొన్నారు
  rationale: מצא అనే క్రియకు కథన సందర్భంలో నేరమైన సమానార్థకం; ఆ మనిషి చేస్తున్న పనిని వారు గమనించి పట్టుకున్నారనే అదనపు భావాన్ని చేర్చదు.
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: ఇక్కడ אִישׁ ఒక పురుష వ్యక్తిని స్పష్టంగా సూచిస్తుంది; లింగనిరపేక్షమైన ‘ఒకరిని’ కంటే ఇది మూలానికి దగ్గరగా ఉంది.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: కట్టెలు ఏరుకుంటున్న
  rationale: קשש క్రియ ఏరడం లేదా పోగుచేయడాన్ని, עֵצִים ఇక్కడ ఇంధనానికి పనికివచ్చే చెక్క ముక్కలను సూచిస్తాయి. ‘కట్టెలు ఏరుకుంటున్న’ సహజమైన తెలుగు; ‘చిన్న కర్రలు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: విశ్రాంతి దినాన
  rationale: హీబ్రూలో ‘దినం’ స్పష్టంగా ఉంది. ‘విశ్రాంతి దినాన’ అనే రూపం పూర్తి కాలసూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనే ఒడంబడిక ప్రజల సంబోధన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: అక్షరరూపం ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఈ సందర్భంలో పదబంధం ప్రజాసమూహాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ అనేది లింగాన్ని అనవసరంగా పరిమితం చేయకుండా మూలంలోని సామూహిక సూచనను సహజంగా అందిస్తుంది.
- issue: שַׁבָּת పదప్రయోగం
  choice: విశ్రాంతి దినం
  alternative: సబ్బాతు దినం
  rationale: వచనం ఆ దినాన జరిగిన చర్యను మాత్రమే నివేదిస్తుంది. ‘విశ్రాంతి దినం’ మూలపద భావాన్నీ, יוֹם అనే ‘దినం’ అంశాన్నీ నిలుపుతూ అదనపు ధార్మిక వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వాక్య నిర్మాణం కథనాత్మకంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉంది. పాదటిప్పణి సూచికను దానికి సంబంధించిన ‘కట్టెలు ఏరుకుంటున్న’ పదబంధం వెంట ఉంచాం.
