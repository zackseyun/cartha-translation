source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: te
  text: '“అహరోనుకూ అతని కుమారులకూ ఇలా చెప్పు: ‘మీరు ఇశ్రాయేలు కుమారులను[a] ఈ విధంగా ఆశీర్వదించాలి; వారితో ఇలా చెప్పండి:’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “ఇశ్రాయేలు ప్రజలను” లేదా “ఇశ్రాయేలీయులను.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: דבר యొక్క పియేల్ ఆజ్ఞార్థక ఏకవచన రూపం; మోషేకు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: וְאֶל בָּנָיו
  choice: అతని కుమారులతో
  rationale: సందర్భంలో בנים అహరోను కుమారులైన పురుష యాజకులను సూచిస్తుంది; అందువల్ల విస్తృతార్థకమైన ‘పిల్లలు’ కంటే ‘కుమారులు’ కచ్చితమైనది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ ఉక్తి నిర్మాణాన్ని సహజమైన తెలుగు మాటల క్రమంలో అందిస్తుంది.
- source_word: כֹּה
  choice: ఈ విధంగా
  rationale: నిర్దేశిత ఆశీర్వాద సూత్రాన్ని పరిచయం చేస్తుంది; ‘ఈ విధంగా’ మూలంలోని విధానార్థాన్ని స్పష్టంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: תְבָרֲכוּ
  choice: మీరు … ఆశీర్వదించాలి
  rationale: పియేల్ అసంపూర్ణ క్రియారూపం ఈ సందర్భంలో ఆదేశాత్మక బలాన్ని కలిగి ఉంది; ‘ఆశీర్వదించాలి’ దానిని కేవలం భవిష్యత్తుగా కాక నిర్దేశంగా తెలియజేస్తుంది.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; జాతీయ గుర్తింపుతో పాటు కుటుంబ-నిబంధన భావాన్ని నిలుపుతుంది. సహజ తెలుగు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אָמֹר לָהֶם
  choice: వారితో ఇలా చెప్పండి
  rationale: తదుపరి వచనంలోని ఆశీర్వాద పదాలను ప్రవేశపెట్టే ఆజ్ఞ. బహువచన ఆజ్ఞను స్పష్టంగా నిలుపుతూ సహజమైన తెలుగులో అనువదించాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధనాత్మక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులను
  alternative: ఇశ్రాయేలు ప్రజలను / ఇశ్రాయేలీయులను
  rationale: ఈ పదబంధం సంప్రదాయ జాతీయ నామంగా మొత్తం ప్రజలను సూచించగలిగినా, మూలంలోని కుటుంబ-నిబంధన రూపకాన్ని పాఠ్యంలో నిలిపి, విస్తృత సామూహిక అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: యాజక ఆశీర్వాదానికి సంబంధించిన నిర్దేశ సూత్రం
  choice: మీరు … ఈ విధంగా ఆశీర్వదించాలి
  alternative: మీరు … ఇలా ఆశీర్వదిస్తారు
  rationale: హీబ్రూ వాక్యం ఆశీర్వాద విధానాన్ని అధికారపూర్వకంగా నిర్దేశిస్తుంది. ‘ఆశీర్వదించాలి’ దాని ఆదేశాత్మక బలాన్ని నిలుపుతుంది; కేవలం భవిష్యత్తు చర్యగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. మోషేకు ఇచ్చిన ఏకవచన ఆజ్ఞకు ‘మాట్లాడు’, అహరోను మరియు అతని కుమారులకు ఇచ్చిన బహువచన ఆజ్ఞకు ‘చెప్పండి’ వాడి హీబ్రూ సంఖ్యాభేదాన్ని నిలిపాం. మూలంలోని పునరుక్త ఉక్తి నిర్మాణాన్ని ‘ఇలా మాట్లాడు … ఇలా చెప్పండి’ ద్వారా ప్రతిబింబించాం.
