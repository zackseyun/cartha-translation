  terminology: “అహరోను,” “ఆశీర్వదించాలి,” and “ఇశ్రాయేలు కుమారులను” are suitable. The footnote appropriately identifies “ఇశ్రాయేలీయులు” and “ఇశ్రాయేలు ప్రజలు” as idiomatic alternatives without replacing the source-form expression in the text.
