    rationale: Hebrew דַּבֵּר אֶל directs Moses to speak to Aaron and his sons as recipients. Telugu “అహరోనుకూ అతని కుమారులకూ ఇలా చెప్పు” makes that directional relationship explicit while preserving the command’s sense.
