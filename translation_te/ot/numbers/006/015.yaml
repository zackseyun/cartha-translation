source:
  edition: WLC
  text: וְ/סַ֣ל מַצּ֗וֹת סֹ֤לֶת חַלֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וּ/מִנְחָתָ֖/ם וְ/נִסְכֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: te
  text: 'పులియని రొట్టెలతో కూడిన ఒక గంపను కూడా తీసుకురావాలి: నూనెతో కలిపిన మెత్తని పిండితో చేసిన రొట్టెలు[a], నూనె పూసిన పలుచని పులియని రొట్టెలు[b], వాటితోపాటు వాటి ధాన్యార్పణం మరియు పానార్పణాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మొదట వచ్చిన מַצּוֹת అనే పదాన్ని ‘పులియని రొట్టెలు’ అని అనువదించాం. హీబ్రూ పదం విస్తృతార్థకమైనది; తరువాత ఈ వర్గంలోని రొట్టెలు, పలుచని రొట్టెలు విడిగా పేర్కొనబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘నూనెతో అభిషేకించిన’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ సాధారణంగా అభిషేకించడాన్ని సూచిస్తుంది; ఇక్కడ మాత్రం పలుచని రొట్టెలపై నూనె పూసే తయారీ విధానాన్ని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: గంప
  rationale: అర్పణకు సంబంధించిన రొట్టెలను ఉంచే పాత్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘గంప’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: ఈ పదం పులియబెట్టని రొట్టె పదార్థాల విస్తృత వర్గాన్ని సూచిస్తుంది; తరువాత రొట్టెలు, పలుచని రొట్టెలు అని రకాలు పేర్కొనబడ్డాయి.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: బలుల సందర్భంలో ఉపయోగించే మెత్తగా మిల్లుచేసిన ఉత్తమ పిండిని సూచించే సాధారణ పదబంధం.
- source_word: חַלֹּת
  choice: రొట్టెలు
  rationale: ఇక్కడ ఆకారమిచ్చి తయారుచేసిన అర్పణ రొట్టెలను సూచిస్తుంది; తెలుగు పాఠకులకు ‘రొట్టెలు’ సహజంగా ఉంటుంది.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: రొట్టెల పిండిలో నూనెను కలిపిన తయారీ విధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רְקִיקֵי מַצּוֹת
  choice: పులియని పలుచని రొట్టెలు
  rationale: רְקִיקִים అనే పదంలోని పలుచదనాన్ని తెలియజేస్తూ, సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా అనువదిస్తుంది.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: నూనె పూసిన
  rationale: మూల క్రియ సాధారణంగా ‘అభిషేకించు’ అని అర్థమిచ్చినా, ఆహార తయారీ సందర్భంలో రొట్టెలపై నూనె పూయడమే ఉద్దేశం.
- source_word: מִנְחָתָם
  choice: వాటికి సంబంధించిన ధాన్యార్పణ
  rationale: బలి నియమావళిలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది; హీబ్రూ బహువచన ప్రత్యయానికి సంబంధించిన సూచనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִסְכֵּיהֶם
  choice: పానార్పణలు
  rationale: బలులతో పాటు పోసి అర్పించే ద్రవ అర్పణలను సూచించే సంక్షిప్తమైన, స్థిరమైన తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమావళికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. మూలంలోని నామవాచక పదబంధాన్ని తెలుగులో సహజమైన ఆజ్ఞారూప వాక్యాలుగా వ్యక్తం చేశాం; ‘ధాన్యార్పణ’, ‘పానార్పణలు’ వంటి ఆచార సంబంధ పదాలను స్పష్టత కోసం నిలుపుకున్నాం.
