  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ధర్మశాసన శైలిని వాడాం. మూలంలోని పానీయాల మధ్య భేదాన్ని, వరుస నిషేధాల నిర్మాణాన్ని నిలిపాం; מִשְׁרָה యొక్క అర్థపరిధిని ప్రధాన పాఠ్యంలో అతిగా విస్తరించకుండా పాదసూచికలో తెలిపాం.
