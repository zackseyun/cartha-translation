id: NUM.6.3
reference: Numbers 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: te
  text: అతడు ద్రాక్షమద్యానికీ మత్తుపానీయానికీ దూరంగా ఉండాలి. ద్రాక్షమద్యం నుంచి వచ్చిన పులిసిన పానీయాన్నిగాని, మత్తుపానీయం నుంచి వచ్చిన పులిసిన పానీయాన్నిగాని తాగకూడదు. ద్రాక్షలను నానబెట్టడం ద్వారా వచ్చిన ఏ పానీయాన్నీ[a] తాగకూడదు; తాజా ద్రాక్షపండ్లనుగాని ఎండు ద్రాక్షపండ్లనుగాని[b] తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ద్రాక్షల నుంచి వచ్చిన ఏ ద్రవాన్నీ” లేదా “ఏ ద్రాక్షరసాన్నీ.” హీబ్రూ పదం ద్రాక్షలను నానబెట్టడం ద్వారా, లేదా ఇతర విధంగా సిద్ధమైన ద్రాక్ష-ద్రవాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ద్రాక్షలు—తాజావి, ఎండినవి.” ఎండిన ద్రాక్షపండ్లను “కిస్మిస్” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן
  choice: ద్రాక్ష మద్యం
  rationale: יַיִן సాధారణంగా ద్రాక్షతో చేసిన మద్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో కేవలం మద్యరహిత రసం అనే అపార్థం రాకుండా ‘ద్రాక్ష మద్యం’ అని అనువదించాం.
- source_word: וְשֵׁכָר
  choice: మత్తుపానీయం
  rationale: שֵׁכָר సాధారణ ద్రాక్ష మద్యానికి భిన్నమైన మత్తు కలిగించే పానీయాన్ని సూచిస్తుంది; పానీయపు నిర్దిష్ట రకాన్ని అనవసరంగా నిర్ణయించకుండా ఈ భేదాన్ని నిలిపాం.
- source_word: יַזִּיר
  choice: దూరంగా ఉండాలి
  rationale: నజీరుకు సంబంధించిన ఈ సందర్భంలో హిఫిల్ రూపం పేర్కొన్న పదార్థాలకు దూరంగా ఉండడం లేదా వాటిని మానుకోవడం అనే అర్థం ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: חֹמֶץ יַיִן
  choice: ద్రాక్ష మద్యంతో చేసిన పులిసిన పానీయం
  rationale: חֹמֶץ పులిసిపోయిన లేదా వెనిగర్‌గా మారిన పానీయాన్ని సూచించగలదు. ఆధునిక వంట వెనిగర్‌కే అర్థాన్ని పరిమితం చేయకుండా, יַיִן‌తో ఉన్న నిర్మాణ సంబంధాన్ని స్పష్టం చేశాం.
- source_word: וְחֹמֶץ שֵׁכָר
  choice: మత్తుపానీయంతో చేసిన పులిసిన పానీయం
  rationale: ముందటి పదబంధంతో ఉన్న సమాంతర నిర్మాణాన్ని నిలిపి, మత్తుపానీయం నుంచి వచ్చిన పులిసిన పానీయమూ నిషిద్ధమని తెలిపాం.
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: ద్రాక్షలను నానబెట్టిన ఏ పానీయం
  rationale: מִשְׁרָה నానబెట్టడం ద్వారా ఏర్పడిన ద్రవాన్ని సూచిస్తుంది. మూలంలోని నిర్దిష్ట చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత సాధ్యార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: తాజా ద్రాక్షపండ్లు, ఎండు ద్రాక్షపండ్లు
  rationale: לַחִים మరియు יְבֵשִׁים ఇక్కడ తాజా/తేమగలవి, ఎండినవి అనే వ్యత్యాసాన్ని తెలుపుతాయి. ఆహార సందర్భంలో సహజమైన తెలుగు జంటను ఉపయోగించాం.
- source_word: לֹא יִשְׁתֶּה / לֹא יֹאכֵל
  choice: తాగకూడదు / తినకూడదు
  rationale: హీబ్రూ నిషేధార్థక అసంపూర్ణ క్రియలను ధర్మశాసన సందర్భానికి తగిన స్పష్టమైన తెలుగు నిషేధ రూపాలతో అనువదించాం.
