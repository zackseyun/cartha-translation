source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: te
  text: అతడు తన నాజీరత్వ దినాలను యెహోవాకు మళ్లీ ప్రతిష్ఠించాలి[a]. అపరాధ పరిహార బలిగా ఏడాది వయసున్న మగ గొర్రెపిల్లను తీసుకురావాలి. అయితే అతని నాజీరత్వం అపవిత్రమైనందున, ముందటి దినాలు లెక్కలోకి రావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన వేరుపాటు దినాలను” లేదా “తన ప్రతిష్ఠ దినాలను.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ముందటి దినాలు పడిపోతాయి”; అంటే, అపవిత్రతకు ముందున్న దినాలు ఇక నాజీరత్వ కాలంలో లెక్కించబడవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: మళ్లీ ప్రతిష్ఠించాలి
  rationale: హిఫిల్ రూపం ఇక్కడ అపవిత్రతతో అంతరాయం కలిగిన నాజీరత్వ కాలాన్ని తిరిగి ప్రారంభించి యెహోవాకు అంకితం చేయడాన్ని సూచిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, לְ ఉపసర్గను ‘కు’తో తెలిపింది.
- source_word: יְמֵי נִזְרוֹ
  choice: తన నాజీరత్వ దినాలను
  rationale: సంఖ్యాకాండము 6లో נזר అనేది ప్రతిష్ఠిత విభజనతో కూడిన నాజీరత్వ వ్యవస్థను సూచిస్తుంది; ‘నాజీరత్వ దినాలు’ ఆ నిర్దిష్ట కాలాన్ని సహజంగా తెలుపుతుంది.
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: బలిని సమర్పణ స్థలానికి తీసుకురావడాన్ని సూచించే సాధారణ బలిసంబంధ పదప్రయోగం.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న మగ గొర్రెపిల్లను
  rationale: ‘తన మొదటి సంవత్సరంలో ఉన్న గొర్రెపిల్ల’ అనే హెబ్రీయ భావాన్ని సహజమైన తెలుగులో, దాని లింగ నిర్దేశంతో వ్యక్తం చేస్తుంది.
- source_word: לְאָשָׁם
  choice: అపరాధ పరిహార బలిగా
  rationale: אָשָׁם అపరాధంతో పాటు దానికి సంబంధించిన పరిహార భావమున్న నిర్దిష్ట బలి వర్గం; ఈ పదబంధం రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים
  choice: ముందటి దినాలు
  rationale: అపవిత్రతకు ముందు పూర్తయిన నాజీరత్వ దినాలను సూచిస్తుంది.
- source_word: יִפְּלוּ
  choice: లెక్కలోకి రావు
  rationale: అక్షరార్థం ‘పడిపోతాయి’; ఈ న్యాయ-ఆచార సందర్భంలో ఆ దినాలు నాజీరత్వ కాలానికి ఇక లెక్కించబడవనే ప్రభావాన్ని సహజంగా తెలియజేస్తుంది. అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: అతని నాజీరత్వం అపవిత్రమైనందున
  rationale: טָמֵא యొక్క ఆచారపరమైన అపవిత్రత భావాన్ని, נִזְרוֹ యొక్క నాజీరత్వ సందర్భాన్ని కాపాడుతుంది.
theological_decisions:
- issue: נזר/נזרו పదాల అనువాదం
  choice: నాజీరత్వం
  alternative: వేరుపాటు; ప్రతిష్ఠ
  rationale: మూలపదంలో ప్రతిష్ఠిత వేరుపాటు భావం ఉన్నా, సంఖ్యాకాండము 6లో అది నాజీరత్వమనే నిర్దిష్ట ఆచార స్థితిని సూచిస్తుంది. పాదటిప్పణి మూలపద విస్తృతిని కాపాడుతుంది.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- issue: יִפְּלוּ యొక్క న్యాయ-ఆచార ప్రభావం
  choice: లెక్కలోకి రావు
  alternative: పడిపోతాయి; రద్దవుతాయి
  rationale: ముందటి దినాలు ఇక ప్రమాణకాలంలో భాగంగా పరిగణించబడవనే సందర్భార్థాన్ని తెలుపుతూ, మూలంలోని రూపకాన్ని పాదటిప్పణిలో చూపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆచార శైలిని ఉపయోగించింది. ‘నాజీరత్వం’ అనే సాంకేతిక పదాన్ని నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించింది; వాక్యనిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా చేసింది.
