id: NUM.6.13
reference: Numbers 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: te
  text: 'నాజీరు యొక్క ధర్మవిధి ఇదే: అతని ప్రత్యేకపరచబడిన దినాలు పూర్తయ్యే రోజున,[b] అతనిని సమావేశపు గుడారం ప్రవేశద్వారం వద్దకు తీసుకురావాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపానుగుణంగా, “అతడు అతనిని సమావేశపు గుడారం ప్రవేశద్వారం వద్దకు తీసుకురావాలి” అని అనువదించవచ్చు. హీబ్రూ క్రియ కర్తరి ప్రయోగంలో ఉంది; అయితే దాని కర్తను ఈ వచనం స్పష్టంగా పేర్కొనదు.
    reason: lexical_alternative
  - marker: b
    text: “అతని ప్రత్యేకపరచబడిన దినాలు” అనే మాటను “అతని నాజీరు వ్రత దినాలు” లేదా “అతని ప్రతిష్ఠా కాలం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת הַנָּזִיר
  choice: నాజీరు వ్రతస్థునికి సంబంధించిన ధర్మవిధి ఇదే
  rationale: וְזֹאת introduces the prescription, תּוֹרָה here denotes a binding ritual instruction, and הַנָּזִיר is the technical designation for one under the Nazirite vow. Telugu word order makes the clause natural while preserving its formal legal character.
- source_word: בְּיוֹם מְלֹאת
  choice: పూర్తయ్యే రోజున
  rationale: This retains the explicit temporal expression ‘on the day’ and the sense of reaching completion conveyed by מלא.
- source_word: יְמֵי נִזְרוֹ
  choice: అతడు ప్రత్యేకంగా ఉండే కాలం
  rationale: נֵזֶר in this context refers to the period or state in which the Nazirite is set apart. This wording communicates that sense naturally without reducing the phrase merely to the vow itself.
- source_word: יָבִיא אֹתוֹ
  choice: అతన్ని ... తీసుకురావాలి
  rationale: The Hebrew verb is active and means ‘he shall bring him,’ but its subject is unexpressed. Telugu can leave the agent implicit with the obligation form తీసుకురావాలి, thereby preserving the procedural sense without inventing an agent.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గరికి
  rationale: פֶּתַח is the entrance, and אֹהֶל מוֹעֵד is the established sanctuary designation ‘Tent of Meeting,’ conventionally rendered ప్రత్యక్ష గుడారం in Telugu biblical usage.
theological_decisions:
- issue: Meaning of נָזִיר and נִזְרוֹ
  choice: Use the technical expression ‘నాజీరు వ్రతస్థుడు’ and describe נִזְרוֹ as the period of being specially set apart
  alternative: Translate both terms generically with consecration language, or render יְמֵי נִזְרוֹ simply as ‘the days of his Nazirite vow’
  rationale: The technical term preserves the distinct Israelite institution, while ‘ప్రత్యేకంగా ఉండే కాలం’ retains the root concept of separation without imposing a later doctrinal understanding of consecration.
- issue: Voice and unidentified subject of יָבִיא אֹתוֹ
  choice: Use the agentless Telugu obligation ‘అతన్ని ... తీసుకురావాలి’
  alternative: Render formally as ‘అతడు అతన్ని ... తీసుకురావాలి,’ or use an explicit passive
  rationale: The Hebrew form is active, but the subject is not identified. The Telugu construction preserves that ambiguity and avoids specifying who performs the action.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయవిధి శైలిని ఉంచుతూ, సాధారణ పాఠకునికి అర్థమయ్యే పదాలను వాడాం. ‘నాజీరు వ్రతస్థుడు’ అనే సాంకేతిక పదాన్ని సంస్థాగత ప్రత్యేకత కోసం నిలిపాం; ‘ధర్మవిధి’ תּוֹרָה యొక్క ఈ సందర్భంలోని నియమార్థాన్ని తెలియజేస్తుంది. ప్రధాన వాక్యంలో ఉన్న [a], [b] గుర్తులు అందించిన పాదసూచనలకు సరిపోతాయి.
