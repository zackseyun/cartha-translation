id: NUM.6.18
reference: Numbers 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: te
  text: అప్పుడు నాజీరుడు ప్రత్యక్షపు గుడారపు ప్రవేశద్వారం దగ్గర తన ప్రతిష్ఠిత తలను క్షౌరం చేసుకోవాలి. తన ప్రతిష్ఠకు సంబంధించిన తల వెంట్రుకలను తీసుకొని, సమాధాన బలి కింద ఉన్న అగ్నిమీద వేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּזִיר
  choice: నాజీరుడు
  rationale: ఈ అధ్యాయంలో పేర్కొన్న ప్రత్యేక నాజీర వ్రతం చేసిన వ్యక్తిని సూచించే సాంకేతిక పదాన్ని లిప్యంతరీకరణ ద్వారా నిలిపింది.
- source_word: וְגִלַּח
  choice: క్షౌరం చేసుకోవాలి
  rationale: వెంట్రుకలను పూర్తిగా క్షౌరం చేసే ఆచారపరమైన చర్యను, నియమాత్మక సందర్భానికి తగిన సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: పరిశుద్ధ స్థలంలోని నిర్దిష్ట ప్రదేశాన్ని స్పష్టంగా తెలిపే, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
- source_word: רֹאשׁ נִזְרוֹ
  choice: తన ప్రతిష్ఠిత తల
  rationale: అక్షరార్థమైన ‘తన ప్రతిష్ఠ తల’ అనే అసహజ నిర్మాణాన్ని నివారిస్తూ, నాజీర ప్రతిష్ఠతో తలకు ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: తన ప్రతిష్ఠిత తల వెంట్రుకలు
  rationale: మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, వెంట్రుకలు నాజీర ప్రతిష్ఠకు సంబంధించినవని స్పష్టం చేస్తుంది.
- source_word: הָאֵשׁ
  choice: అగ్ని
  rationale: సందర్భంలో ఉన్న సాధారణ, ప్రత్యక్ష అర్థాన్ని ఇస్తుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: మూలంలోని స్థలసంబంధాన్ని వ్యాఖ్యానించి మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి
  rationale: ఇది స్థిరమైన బలివిధిని సూచిస్తుంది; ‘సమాధాన బలి’ సంప్రదాయ సాంకేతిక అర్థాన్ని, శాంతి/సంపూర్ణ క్షేమం అనే భావసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: שְׁלָמִים అనే బలిసంబంధ పదం అనువాదం
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ‘సమాధాన బలి’ స్థిరమైన బలివర్గాన్ని నిలుపుతుంది; ‘సహవాసం’ అనే ఒక్క అంశానికే భావాన్ని పరిమితం చేయదు. అయితే సహవాసం లేదా క్షేమం అనే భావాలను చూపే ఇతర అనువాదాలు కూడా సాధ్యమైనందున వాటిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నాజీరుడు,’ ‘ప్రత్యక్షపు గుడారం,’ ‘సమాధాన బలి’ వంటి సాంకేతిక పదాలను సందర్భానుగుణంగా నిలిపాం.
