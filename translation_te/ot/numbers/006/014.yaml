id: NUM.6.14
reference: Numbers 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: te
  text: 'అతడు యెహోవాకు తన అర్పణను సమర్పించాలి: దహనబలిగా ఒక సంవత్సరం వయసున్న లోపంలేని మగ గొర్రెపిల్లను; పాపబలిగా[a] ఒక సంవత్సరం వయసున్న లోపంలేని ఆడ గొర్రెపిల్లను; సమాధాన బలుల కోసం[b] లోపంలేని ఒక పొట్టేలును.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపబలి’కి బదులుగా ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం חַטָּאת పాపంతో సంబంధమున్న బలినీ, అపవిత్రత లేదా అపరాధం నుంచి శుద్ధీకరించే బలినీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: ‘సమాధాన బలులు’కి బదులుగా ‘క్షేమ బలులు’ లేదా ‘సహవాస బలులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב אֶת־קָרְבָּנוֹ
  choice: తన అర్పణను ... సమర్పించాలి
  rationale: הקריב అనే హిఫీల్ క్రియ బలుల సందర్భంలో ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అని సూచిస్తుంది. ఆధునిక తెలుగు ఆచారపరమైన సందర్భంలో ‘సమర్పించాలి’ సహజంగాను ఖచ్చితంగాను ఉంది; קָרְבָּנוֹ ను ‘తన అర్పణ’గా ఇచ్చాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוה ను సాధారణ ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘యెహోవా’ అని లిప్యంతరీకరించి, గమ్యార్థక విభక్తితో ఇచ్చాం.
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసున్న ... మగ గొర్రెపిల్ల
  rationale: כֶּבֶשׂ మగ గొర్రెపిల్లను సూచిస్తుంది; בֶּן־שְׁנָתוֹ దాని వయస్సు ఒక సంవత్సరమని సూచిస్తుంది. తరువాతి ఆడ గొర్రెపిల్లతో ఉన్న లింగభేదాన్ని స్పష్టంగా నిలిపాం.
- source_word: תָמִים / תְּמִימָה
  choice: లోపంలేని
  rationale: బలుల నియమాలలో ఈ పదం శారీరక లోపం లేదా కళంకం లేని జంతువును సూచిస్తుంది. ‘లోపంలేని’ అనేది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహించబడే బలి వర్గాన్ని సూచిస్తుంది; ‘దహనబలి’ తెలుగు బైబిలు పరిభాషలో స్పష్టమైన పదం.
- source_word: כַבְשָׂה ... בַּת־שְׁנָתָהּ
  choice: ఒక సంవత్సరం వయసున్న ... ఆడ గొర్రెపిల్ల
  rationale: כַבְשָׂה ఆడ గొర్రెపిల్లను, בַּת־שְׁנָתָהּ ఒక సంవత్సరం వయస్సును సూచిస్తాయి. మూలంలోని లింగ, వయో విశేషాలను నిలిపాం.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: חַטָּאת పాపానికై అర్పించే బలినీ, శుద్ధీకరణ కార్యాన్ని నిర్వహించే బలినీ సూచించగలదు. ప్రధాన పాఠంలో పరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אַיִל אֶחָד
  choice: ఒక పొట్టేలు
  rationale: אַיִל ప్రత్యేకంగా వయోజన మగ గొర్రెను సూచిస్తుంది; తెలుగులో ‘పొట్టేలు’ ఖచ్చితమైన సహజ పదం.
- source_word: לִשְׁלָמִים
  choice: సమాధాన బలులుగా
  rationale: שְׁלָמִים శాంతి, క్షేమం, సహవాసం వంటి భావాలతో సంబంధమున్న బలి వర్గం. పరిచితమైన ‘సమాధాన బలులు’ను ప్రధాన పాఠంలో ఉంచి, ఇతర సాధ్యమైన భావాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపాం; సాధారణ తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: חַטָּאת బలి యొక్క స్వభావం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలినీ, అపవిత్రత తొలగింపునకు సంబంధించిన శుద్ధీకరణ బలినీ సూచించవచ్చు. ప్రధాన పాఠంలో సంప్రదాయంగా అర్థమయ్యే రూపాన్ని ఉంచి, భావపరిధిని పాదసూచికలో తెలిపాం.
- issue: שְׁלָמִים యొక్క భావపరిధి
  choice: సమాధాన బలులు
  alternative: క్షేమ బలులు; సహవాస బలులు
  rationale: హీబ్రూ పదంలో సమాధానం, క్షేమం, సహవాసం అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారనియమానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస జాబితాను తెలుగులో స్పష్టంగా చూపేందుకు అర్ధవిరామ చిహ్నాలు వాడి, చివర క్రియను పునరుక్తి చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
