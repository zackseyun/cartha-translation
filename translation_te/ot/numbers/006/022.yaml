  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా పలికాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు మూలరూపం మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే דבר క్రియకు గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు రూపం; కథనంలోని తదుపరి ఘట్టాన్ని కూడా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన YHWHను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంగా లిప్యంతరీకరించింది; దానిని బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కలిసిన אֶל‌ను తెలుగులో సహజంగా వ్యక్తితో సంభాషణను సూచించే ‘తో’ విభక్తితో వ్యక్తం చేసింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తం చేసింది; చివరలో ద్విబిందువు అదే కార్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచి, మూలరూపం YHWH అని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, తదుపరి ప్రత్యక్ష వాక్యానికి సహజమైన పరిచయంగా ‘ఇలా పలికాడు:’ ఉపయోగించబడింది.
