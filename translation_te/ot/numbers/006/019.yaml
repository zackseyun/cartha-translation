reference: Numbers 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: te
  text: తర్వాత యాజకుడు పొట్టేలు నుండి ఉడికించిన ముందుకాలి భాగాన్ని, బుట్టనుండి పులియని ఒక రొట్టెను, పులియని ఒక పలుచని రొట్టెను తీసుకొని, నాజీరు తన నాజీరుత్వానికి చెందిన జుట్టును[a] క్షౌరం చేసుకున్న తర్వాత వాటిని అతని అరచేతులపై ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘అతడు తన నాజీరుత్వాన్ని క్షౌరం చేసుకున్న తర్వాత.’ ఈ సందర్భంలో అతని నాజీరుత్వంతో సంబంధమున్న జుట్టు ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తర్వాత ... తీసుకొని
  rationale: ఆచార విధానంలోని వరుస చర్యను సహజమైన ఆధునిక తెలుగులో తెలిపేందుకు వావ్‌తో కూడిన క్రియను ‘తర్వాత’ అనే క్రమసూచక పదంతో అనువదించాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సేవ నిర్వహించే వ్యక్తికి సాధారణంగా వాడే స్పష్టమైన తెలుగు పదం.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: ఉడికించిన ముందుకాలు
  rationale: זְרוֹעַ బలిజంతువు ముందుకాలి భాగాన్ని సూచిస్తుంది; בְּשֵׁלָה అది ఉడికించబడినదని తెలుపుతుంది. ‘భుజం’ కంటే ‘ముందుకాలు’ శరీర భాగాన్ని మరింత నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: מִן הָאַיִל
  choice: పొట్టేలు నుండి
  rationale: מן మూలాన్ని సూచిస్తుంది; אַיִל‌కు సందర్భానుసారంగా ‘పొట్టేలు’ సహజమైన సమానార్థకం.
- source_word: חַלַּת מַצָּה אַחַת
  choice: పులియని ఒక రొట్టె
  rationale: חַלָּה ఇక్కడ ఒక రొట్టెను సూచిస్తుంది; מַצָּהలోని పులియబెట్టని స్వభావాన్ని ‘పులియని’ అని స్పష్టంగా ఉంచాం.
- source_word: מִן הַסַּל
  choice: బుట్టలో నుండి
  rationale: సాధారణ ప్రాదేశిక సంబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: పులియని ఒక పలుచని రొట్టె
  rationale: רְקִיק పలుచని రొట్టె పదార్థాన్ని సూచిస్తుంది. ‘పలుచని రొట్టె’ రూపాన్ని స్పష్టంగా తెలిపి, ముందున్న חַלָּהతో తేడాను నిలుపుతుంది.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: అరచేతులపై వాటిని ఉంచాలి
  rationale: כַּפֵּי ప్రత్యేకంగా చేతుల అరలను సూచిస్తుంది; ‘అరచేతులపై’ మూలంలోని దృశ్యాన్ని కాపాడుతుంది. తెలుగులో క్రియకు అవసరమైన కర్మను ‘వాటిని’ అని స్పష్టం చేశాం.
- source_word: הַנָּזִיר
  choice: నాజీరు
  rationale: ప్రత్యేక ప్రతిజ్ఞతో దేవునికి అంకితమైన వ్యక్తిని సూచించే స్థిరమైన పారిభాషిక రూపం.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: క్షౌరం చేసుకున్న తర్వాత
  rationale: ప్రధాన ఆచార చర్యకు ముందు పూర్తయిన క్రియను కాలసంబంధ ఉపవాక్యంగా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: נִזְרוֹ అనే పదాన్ని నాజీరు ఆచార సందర్భంలో ఎలా అనువదించాలి
  choice: తన నాజీరుత్వానికి సూచనగా ఉన్న జుట్టును
  alternative: తన నాజీరుత్వాన్ని; తన ప్రతిష్ఠను
  rationale: నామవాచకం అక్షరార్థంగా అతని నాజీరుత్వం లేదా ప్రతిష్ఠను సూచించినా, ఇక్కడ క్షౌరం చేయబడేది దానికి బాహ్య సూచనగా ఉన్న జుట్టు. ప్రధాన పాఠంలో సందర్భార్థాన్ని స్పష్టం చేసి, పాదసూచికలో అక్షరార్థాన్ని ఉంచడం ద్వారా ఆచారంలోని దేహసంబంధ చర్యను తెలియజేస్తూనే మూలంలోని భావసాంద్రతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆచారవిధి శైలిని వాడాం. ‘నాజీరు’ అనే పారిభాషిక పదాన్ని నిలుపుతూ, దాని సందర్భార్థాన్ని వాక్యంలోనే స్పష్టం చేశాం.
