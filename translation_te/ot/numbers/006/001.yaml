  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా పలికాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה); దీనిని ‘యాహ్వే’గా లిప్యంతరీకరిస్తారు. అనేక అనువాదాల్లో సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ మరొక లిప్యంతరీకరణ.'
    reason: దైవనామానికి ఉన్న లిప్యంతరీకరణ, సంప్రదాయ అనువాద ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు తీసుకెళ్లి దైవిక ప్రసంగాన్ని పరిచయం చేస్తుంది. తెలుగులో తరువాతి לֵאמֹר భావంతో కలిపి ‘ఇలా అన్నాడు’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటానికి సంబంధించిన אֶל ఇక్కడ సంభాషణ ఎవరితో జరిగిందో సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషేతో’ సహజ ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష ప్రసంగ విషయాన్ని పరిచయం చేసే సూత్రప్రాయ పదం. ‘ఇలా అన్నాడు’ అనే తెలుగు నిర్మాణం దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం. ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సహజమైన కథన శైలి. హీబ్రూ ‘మాట్లాడి—చెప్పాడు’ అనే పునరుక్త సూత్రాన్ని యాంత్రికంగా నిలుపకుండా, దాని ప్రసంగ-పరిచయ కార్యాన్ని ‘ఇలా అన్నాడు’లో వ్యక్తం చేశాం.
