source:
  edition: WLC
  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: te
  text: యాహ్వే తన ముఖం నీ మీద ప్రకాశించునట్లు చేసి, నీపై కృప చూపుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే తన ముఖం నీ వైపు ప్రకాశించునట్లు చేసి, నీకు అనుగ్రహం చూపుగాక.”
    reason: אֵלֶיךָకు ‘నీ వైపు’ అనే దిశార్థాన్ని, וִיחֻנֶּךָకు ‘నీకు అనుగ్రహం చూపుగాక’ అనే సమీప ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: יָאֵר
  choice: ప్రకాశింపజేసి
  rationale: אוֹר ధాతువు హిఫిల్ యుసివ్ రూపంలో ఉండి, ఆశీర్వాదపూర్వకమైన కోరికతో ‘ప్రకాశింపజేయుగాక’ అనే కారణార్థాన్ని వ్యక్తపరుస్తుంది. తెలుగులో వాక్యాంతంలోని ‘చూపించుగాక’ ఈ రెండు సమన్విత క్రియలకూ ఆశీర్వాద భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: ఇది బిరుదు కాక దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం. ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపం దైవనామాన్ని పేరుగానే నిలుపుతుంది.
- source_word: פָּנָיו
  choice: తన ముఖాన్ని
  rationale: మూలంలోని ‘ఆయన ముఖం’ అనే స్పష్టమైన మానవరూప చిత్రణను ‘సన్నిధి’ లేదా ‘అనుగ్రహ దృష్టి’గా వ్యాఖ్యానించకుండా నిలిపింది. తెలుగు పరావర్తన సర్వనామం ‘తన’ కర్త అయిన యెహోవాను సహజంగా సూచిస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీ మీద
  rationale: אֶל ప్రాథమికంగా ‘నీ వైపు’ అని దిశను సూచించగలదు; అయితే వెలుగు ముఖం నుండి వ్యక్తిమీద పడే ఈ రూపకంలో ‘నీ మీద’ సహజమైన తెలుగు ప్రయోగం. ‘నీ వైపు’ అనే ప్రత్యామ్నాయం పాదసూచికలో నిలిపింది.
- source_word: וִיחֻנֶּךָּ
  choice: నీపై కృప చూపించుగాక
  rationale: חנן అనేది అనుగ్రహించడం లేదా ఆదరణ చూపడం అనే భావం కలిగి ఉంది. ‘కృప చూపించు’ మూలార్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో ఇస్తుంది; ‘కరుణించు’ అనడం జాలి భావాన్ని అతిగా ముందుకు తేవవచ్చు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక చతురక్షర దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే నామరూపంతో ఇచ్చింది.
- issue: ‘తన ముఖాన్ని ప్రకాశింపజేయడం’ అనే మానవరూప ప్రయోగం
  choice: ముఖం అనే చిత్రణను ప్రధాన పాఠంలో యథాతథంగా నిలుపడం
  alternative: తన సన్నిధితో నిన్ను వెలిగించడం / నిన్ను అనుగ్రహంతో చూడడం
  rationale: ఈ హీబ్రూ ఆశీర్వాదం దేవుని అనుకూల సన్నిధి, అనుగ్రహాన్ని ముఖం వెలిగే సజీవ చిత్రంతో తెలియజేస్తుంది. దాన్ని అమూర్తమైన వివరణగా మార్చకుండా కావ్యాత్మక, వేదాంతపరమైన ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆశీర్వాద శైలిని వాడింది. మూలంలోని ఏకవచన సంబోధనను ‘నీ’తో నిలిపింది. ‘ముఖం ప్రకాశించడం’ అనే కవితాత్మక రూపకాన్ని సరళీకరించకుండా, అయినా సాధారణ పాఠకుడికి అర్థమయ్యే పదాలతో అందించింది.
