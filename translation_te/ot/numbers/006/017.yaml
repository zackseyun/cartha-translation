id: NUM.6.17
reference: Numbers 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: te
  text: అతడు ఆ పొట్టేలును పులియని రొట్టెల బుట్టతోపాటు యాహ్వేకు సమాధాన బలిగా[a] అర్పించాలి. యాజకుడు దానికి సంబంధించిన ధాన్యార్పణను, పానార్పణను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలి.’ హీబ్రూ שְׁלָמִים అనే పదాన్ని ‘సమాధాన బలి’ లేదా ‘సహవాస బలి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ఆ పొట్టేలు
  rationale: బలుల సందర్భంలో אַיִל మగ గొర్రెను, ప్రత్యేకంగా పొట్టేలును సూచిస్తుంది; తెలుగు బలి పరిభాషలో ‘పొట్టేలు’ సహజమైన నిర్దిష్ట పదం.
- source_word: יַעֲשֶׂה
  choice: అర్పించాలి
  rationale: עשה సాధారణంగా ‘చేయు’ అయినా, ఇక్కడ זֶבַחతో కూడిన బలిసంబంధ సందర్భంలో బలిని నిర్వహించి అర్పించడాన్ని సూచిస్తుంది.
- source_word: זֶבַח שְׁלָמִים
  choice: సమాధాన బలి
  rationale: זֶבַח అనే బలి భావాన్ని, שְׁלָמִים అనే బలి వర్గాన్ని తెలుగులో స్థిరమైన బైబిలు పరిభాషతో సంక్షిప్తంగా తెలియజేస్తుంది; పదంలోని సహవాస భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ అర్పణ యొక్క గ్రహీతను/అంకిత దిశను సూచిస్తుంది; יהוהను వ్యక్తిగత దైవనామంగా లిప్యంతరీకరించాం.
- source_word: עַל סַל הַמַּצּוֹת
  choice: పులియని రొట్టెల బుట్టతోపాటు
  rationale: ఇక్కడ עַל కేవలం స్థలసంబంధమైన ‘మీద’ కాక, బలితో కలిసి వచ్చే ఆచారసంబంధ అనుబంధాన్ని సూచిస్తుంది.
- source_word: מִנְחָתוֹ
  choice: దానికి సంబంధించిన ధాన్యార్పణను
  rationale: యాజక గ్రంథసందర్భంలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది. ఏకవచన ప్రత్యయం ఈ బలికి అనుబంధమైన అర్పణను సూచిస్తుందని స్పష్టపరచడానికి ‘దానికి సంబంధించిన’ అన్నాం.
- source_word: נִסְכּוֹ
  choice: పానార్పణను
  rationale: నైవేద్యంగా పోసే ద్రవ అర్పణకు ‘పానార్పణ’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం; ప్రాచీన ఉచ్చారణను ‘యాహ్వే’గా ఇవ్వడం కూడా సాధ్యం.
- issue: שְׁלָמִים యొక్క బలి వర్గం
  choice: సమాధాన బలి
  alternative: సహవాస బలి
  rationale: ఈ హీబ్రూ పదం శాంతి/సంపూర్ణతతో పాటు సహవాసాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సంప్రదాయమైన ‘సమాధాన బలి’ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి అర్థ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని రెండు కర్తలను స్పష్టంగా ఉంచి, బలికి అనుబంధమైన ధాన్యార్పణ మరియు పానార్పణ సంబంధాన్ని సహజంగా వ్యక్తపరచాం.
