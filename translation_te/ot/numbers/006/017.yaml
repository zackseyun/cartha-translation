    issue: The divine name is rendered “యెహోవాకు” rather than “యాహ్వేకు.”
    rationale: The Hebrew text contains יהוה, and the supplied English POB audit trail explicitly adopts “Yahweh.” Telugu “యాహ్వే” more directly represents that chosen source-oriented form; “యెహోవా” reflects a later traditional vocalization.
