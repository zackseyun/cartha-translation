id: NUM.6.2
reference: Numbers 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: te
  text: 'ఇశ్రాయేలీయులతో మాట్లాడి, వారితో ఇలా చెప్పు: “ఒక పురుషుడైనా స్త్రీయైనా, యెహోవాకు తమను ప్రత్యేకించుకోవడానికి నాజీరు మొక్కుబడి అనే ప్రత్యేక మొక్కుబడి చేస్తే,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ కుటుంబసంబంధ నుడికారాన్ని అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని అనడం కంటే, ఆధునిక తెలుగు పాఠకులకు సహజంగా మరియు సమూహమంతటినీ సూచించేలా ‘ఇశ్రాయేలీయులు’ అని అనువదించాం.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ఒక పురుషుడైనా, స్త్రీయైనా
  rationale: ధర్మశాసనంలోని ఈ నియమం రెండు లింగాలవారికీ వర్తిస్తుందని మూలపాఠం స్పష్టంగా చెప్పడాన్ని నిలిపాం.
- source_word: כִּי
  choice: చేస్తే
  rationale: ఇక్కడ כִּי ఒక న్యాయపరమైన సంభావ్య సందర్భాన్ని ప్రవేశపెడుతుంది; తెలుగులో షరతును సహజంగా తెలిపే ‘చేస్తే’ సరిపోతుంది.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: ప్రత్యేకంగా ... మొక్కుబడి చేస్తే
  rationale: פלא హిఫీల్ రూపంలోని అసాధారణమైన లేదా ప్రత్యేకమైన చర్య భావాన్నీ, נדר పదమూలం పునరుక్తిలోని మొక్కుబడి భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేశాం.
- source_word: נֶדֶר נָזִיר
  choice: నాజీరుదీక్ష మొక్కుబడి
  rationale: నాజీరుగా ప్రత్యేకించబడే సాంకేతిక వ్యవస్థను ‘నాజీరు’ అనే లిప్యంతరీకరణతో నిలిపి, దీక్ష మరియు మొక్కుబడి అనే పదాలతో దాని స్వరూపాన్ని స్పష్టం చేశాం.
- source_word: לְהַזִּיר
  choice: తమను ప్రత్యేకంగా అంకితం చేసుకోవడానికి
  rationale: ఈ క్రియలో వేరుపరచుకోవడం మరియు దేవునికి అంకితం కావడం అనే భావాలు రెండూ ఉన్నాయి. పురుషుడు లేదా స్త్రీ ఇద్దరూ ఉద్దేశించబడినందున తెలుగు ప్రతిబింబక బహువచన రూపమైన ‘తమను’ సహజంగా రెండింటినీ కలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో దైవనామంగా అందించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగానే నిలిపాం. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కాదనే విషయాన్ని అనువాదంలో పరిష్కరించినట్లు చూపలేదు.
- issue: నాజీరు దీక్షలో లింగ సమావిష్కరణ
  choice: ‘ఒక పురుషుడైనా, స్త్రీయైనా’ అని స్పష్టంగా ఉంచి, ‘తమను’ అనే సహజ తెలుగు రూపం వాడటం
  alternative: ‘ఎవరైనా’ అని సాధారణీకరించడం లేదా పురుష ఏకవచన సర్వనామం వాడటం
  rationale: హీబ్రూ మూలం పురుషుణ్ణీ స్త్రీనీ ప్రత్యేకంగా పేర్కొంటుంది. తెలుగు వాక్యంలో అసహజమైన పురుషకేంద్ర సర్వనామాన్ని చేర్చకుండా, మూలంలోని స్పష్టమైన సమావిష్కరణను నిలిపాం.
- issue: נזר క్రియలో వేరుపరచుకోవడం మరియు అంకితం కావడం మధ్య భావసంబంధం
  choice: ప్రత్యేకంగా అంకితం చేసుకోవడం
  alternative: తమను వేరుపరచుకోవడం
  rationale: సందర్భం యెహోవాకు అంకితమయ్యే దీక్షను సూచిస్తుంది; ‘ప్రత్యేకంగా’ అనే పదం వేరుపరచబడే భావాన్నీ, ‘అంకితం’ దాని దేవునివైపు ఉద్దేశాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాసన ఆజ్ఞకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ రూపొందించాం. వచనం తరువాతి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివర కామాను ఉంచాం.
