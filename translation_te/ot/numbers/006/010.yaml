id: NUM.6.10
reference: Numbers 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: te
  text: ఎనిమిదవ రోజున అతడు రెండు తాబేలు పావురాలను లేదా రెండు పావురపు పిల్లలను[a] సమావేశ గుడారం ద్వారం వద్ద ఉన్న యాజకుని దగ్గరకు తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెండు గువ్వ పిల్లలు.’ హెబ్రీలో అక్షరార్థంగా ‘పావురం కుమారులు’ అని ఉంది; ఇది చిన్న పావురాలను లేదా గువ్వలను సూచించే నుడికార ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: వావ్ సంధి ఇక్కడ ముందటి ఆదేశాల క్రమాన్ని కొనసాగిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అనకుండా కాలసూచక రూపమే సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: יָבִא
  choice: తీసుకురావాలి
  rationale: בוא ధాతువు హిఫీల్ రూపం ‘తీసుకురావడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; ధర్మశాస్త్ర ఆదేశ సందర్భంలోని విధ్యర్థక బలాన్ని ‘వాలి’ రూపం సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁתֵּי תֹרִים
  choice: రెండు తెల్లగువ్వలు
  rationale: תֹרִים సాధారణ పక్షులను కాక తాబేలు గువ్వల జాతిని (turtledoves) సూచిస్తుంది; బలి సందర్భంలో వాడుకలో ఉన్న, సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు పదంగా ‘తెల్లగువ్వలు’ ఎంచుకున్నాం.
- source_word: אוֹ
  choice: అయినా లేదా ... అయినా
  rationale: అర్పణకు అనుమతించబడిన రెండు ప్రత్యామ్నాయాలను తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: రెండు పావురపు పిల్లలు
  rationale: అక్షరార్థంగా ‘పావురపు కుమారులు’ అనే హెబ్రీ జాతీయ ప్రయోగం చిన్న పావురాలను సూచిస్తుంది; తెలుగులో సహజంగా ‘పావురపు పిల్లలు’ అని అనువదించాం.
- source_word: אֶל הַכֹּהֵן אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ప్రవేశద్వారం దగ్గర ఉన్న యాజకుని వద్దకు
  rationale: రెండు אֶל పదబంధాలు యాజకుని మరియు సమావేశ గుడార ప్రవేశద్వారాన్ని గమ్యస్థానంగా అనుసంధానిస్తాయి. తెలుగులో వాటి సంబంధాన్ని సహజంగా తెలియజేస్తూ, אֹהֶל מוֹעֵד యొక్క ‘meeting tent’ భావాన్ని ‘సమావేశ గుడారం’గా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆదేశ శైలిని వాడాం. బలి సంబంధిత ప్రత్యేక పక్షిపేరును నిలుపుతూ, హెబ్రీ జాతీయ ప్రయోగాన్ని ప్రధాన వాక్యంలో స్పష్టమైన తెలుగులో అందించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘పావురపు పిల్లలు’ అనే పదబంధం వెంట ఉంచాం.
