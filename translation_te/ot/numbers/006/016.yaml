id: NUM.6.16
reference: Numbers 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: te
  text: యాజకుడు వాటిని యాహ్వే సన్నిధికి తీసుకువచ్చి[a], అతని పాపపరిహార బలినీ[b], దహనబలినీ అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాహ్వే సన్నిధిలో వాటిని సమర్పించి.’ హీబ్రూ క్రియ అసలు బలి అర్పణకు ముందు దేవుని సన్నిధికి తీసుకురావడం లేదా అక్కడ ఉంచడం అనే భావాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘పాపపరిహార బలి’ని యాజక బలి భాషలో ‘శుద్ధీకరణ బలి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: సమర్పించి
  rationale: קרב హిఫిల్ రూపం బలి సందర్భంలో ‘దగ్గరకు తీసుకురావడం/సన్నిధిలో సమర్పించడం’ అనే భావాన్ని ఇస్తుంది. తరువాతి וְעָשָׂה తెలిపే బలి అర్పణ క్రియతో దీనికి ఉన్న తేడాను ఈ పదం నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా, బలి సందర్భంలో כֹּהֵןకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי ఇక్కడ దేవుని సమక్షాన్ని సూచిస్తుంది; יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְעָשָׂה
  choice: అర్పించాలి
  rationale: עשה అక్షరార్థంగా ‘చేయడం’ అయినప్పటికీ, నిర్దిష్ట బలులతో వాడినప్పుడు ఆ బలులను ఆచారప్రకారం అర్పించడం అనే భావం వస్తుంది.
- source_word: אֶת חַטָּאתוֹ
  choice: అతని పాపపరిహార బలిని
  rationale: חַטָּאת బలి నియమాల సందర్భంలో పాపానికి సంబంధించిన బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, ‘శుద్ధీకరణ బలి’ అనే సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְאֶת עֹלָתוֹ
  choice: దహనబలిని
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే స్థిరమైన బలి పదం.
- source_word: implicit object of וְהִקְרִיב
  choice: వాటిని
  rationale: హీబ్రూ వాక్యంలో కర్మ స్పష్టంగా లేకపోయినా, ముందరి వచనంలోని బలి జంతువులే ఉద్దేశం. ‘వాటిని’ సందర్భాధారితత్వాన్ని నిలుపుతూ తెలుగులో వాక్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో బిరుదు కాకుండా יהוה అనే ఒడంబడిక నామమే ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, మూల ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా ఇచ్చాం.
- issue: חַטָּאת బలి పదానికి అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలినీ, ఆచార శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సుపరిచితమైన రూపాన్ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘సమర్పించి’ మరియు ‘అర్పించాలి’ అనే వేర్వేరు క్రియలతో దేవుని సన్నిధికి తీసుకురావడం, తరువాత బలి అర్పించడం అనే క్రమాన్ని నిలిపాం. ‘బలినీ … బలినీ’ నిర్మాణం రెండు బలులూ ఒకే వ్యక్తికి చెందినవని సహజంగా తెలియజేస్తుంది.
