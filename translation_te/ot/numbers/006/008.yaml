  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: te
  text: అతని నాజీరత్వపు రోజులన్నిటిలో అతడు యాహ్వేకు పరిశుద్ధుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని నాజీరు ప్రమాణం’ లేదా ‘అతని ప్రత్యేకపరచబడిన స్థితి.’ హీబ్రూ పదం నాజీరుగా ప్రత్యేకపరచబడిన స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: కొనసాగే రోజులన్నిటిలో
  rationale: ఈ పదబంధం నాజీరు ప్రత్యేకత కొనసాగే పూర్తి కాలాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా సమగ్ర భావాన్ని ‘రోజులన్నిటిలో’ అని వ్యక్తం చేశాం.
- source_word: נִזְרוֹ
  choice: అతని నాజీరుతనం
  rationale: ఇక్కడ ఈ పదం ప్రమాణం చేసిన క్షణాన్ని మాత్రమే కాక, నాజీరుగా ప్రత్యేకంగా ఉంచబడిన స్థితిని సూచిస్తుంది. ‘నాజీరుతనం’ ఆ సందర్భానుకూల భావాన్ని సంక్షిప్తంగా కాపాడుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: קָדֹשׁ
  choice: పరిశుద్ధుడు
  rationale: హీబ్రూ పదంలోని దేవునికి ప్రత్యేకంగా ఉంచబడిన పవిత్ర స్థితి మరియు దైవశాస్త్ర సంబంధమైన బరువును ‘పరిశుద్ధుడు’ నిలుపుతుంది.
- source_word: הוּא
  choice: అతడు
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామం వాక్యానికి కర్త. తెలుగులో ‘అతడు ... పరిశుద్ధుడు’ అనే నామవాచక వాక్యం సహజంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గ ఇక్కడ సంబంధం లేదా అంకితభావాన్ని సూచిస్తుంది. దేవుని వ్యక్తిగత నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, దానికి ‘కు’ విభక్తి చేర్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా covenant నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: నాజీరుల నియమంలో נִזְרוֹ భావం
  choice: అతని నాజీరుతనం
  alternative: అతని నాజీరు ప్రమాణం; అతని ప్రతిష్ఠిత స్థితి
  rationale: ఈ వచనం నాజీరు ప్రమాణం పలికిన చర్యకన్నా, ఆ వ్యక్తి ప్రత్యేకంగా ఉంచబడిన స్థితి కొనసాగే కాలాన్ని ప్రధానంగా చెబుతుంది. తద్వారా ఆ స్థితి మరియు దాని ఫలితమైన యాహ్వేకు పరిశుద్ధత మధ్య వ్యత్యాసం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నాజీరుతనం’ సందర్భానికి ప్రత్యేకమైన పదం కాబట్టి దాని భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
