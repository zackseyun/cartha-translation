    issue: నֵזֶר అర్థాన్ని ప్రధాన పాఠ్యంలో అస్పష్టమైన ‘ప్రతిష్ఠితుడై ఉన్నదానికి గుర్తు’గా వ్యక్తీకరించడం
    rationale: హీబ్రూ పదబంధం ‘అతని దేవుని నేజెర్/ప్రతిష్ఠ అతని తలపై ఉంది’ అని చెబుతుంది. ప్రస్తుత తెలుగు నిర్మాణం ఎవరు ప్రతిష్ఠితులు, దేనికి గుర్తు అన్నదాన్ని స్పష్టంగా తెలియనీయదు; అలాగే మూలంలో లేని ‘గుర్తు’ను అనువాదపు ప్రధాన భాగంగా చేస్తుంది.
