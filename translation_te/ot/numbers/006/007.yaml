  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: te
  text: తన తండ్రి గానీ, తల్లి గానీ, సోదరుడు గానీ, సోదరి గానీ చనిపోయినప్పుడు, వారి నిమిత్తం అతడు తనను అపవిత్రపరచుకోకూడదు[a]. ఎందుకంటే అతని దేవునికి అంకితమైన ప్రతిష్ఠ అతని తలపై ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు చనిపోయినప్పుడు వారి వల్ల అతడు అపవిత్రుడు కాకూడదు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: నేజెర్. నాజీరు సందర్భంలో ఇది దేవునికి ప్రత్యేకించబడిన స్థితిని లేదా ప్రతిష్ఠను సూచిస్తుంది; అతని తలపై పెరిగిన జుట్టు దానికి కనిపించే గుర్తు.'
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: తన తండ్రి గానీ, తల్లి గానీ, సోదరుడు గానీ, సోదరి గానీ
  rationale: మూలంలోని ఏకవచన బంధుత్వ పదాలనూ, ముందుకు తెచ్చిన వాటి ఉద్ఘాటననూ సహజమైన తెలుగు ‘గానీ’ నిర్మాణంతో నిలిపింది.
- source_word: לֹא יִטַּמָּא
  choice: అతడు తనను అపవిత్రపరచుకోకూడదు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనిష్ఠ భావాన్ని ‘తనను ... పరచుకో’ స్పష్టంగా తెలియజేస్తుంది. సందర్భం ఇది ఆచారపరమైన అపవిత్రత అని నిర్ధారిస్తుంది; నైతిక దోషాన్ని సూచించదు.
- source_word: לָהֶם בְּמֹתָם
  choice: చనిపోయినప్పుడు, వారి నిమిత్తం
  rationale: మరణమే అపవిత్రత కలిగే సందర్భమని, సర్వనామం ముందున్న బంధువులను సూచిస్తుందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన ఆధునిక తెలుగు సంధానపదం.
- source_word: נֵזֶר אֱלֹהָיו
  choice: అతని దేవునికి ప్రతిష్ఠితుడై ఉన్నదానికి గుర్తు
  rationale: నాజీరు సందర్భంలో נֵזֶר దేవునికి ప్రత్యేకించబడిన స్థితినీ దాని కనిపించే చిహ్నాన్నీ సూచిస్తుంది. ‘గుర్తు’ తలపై ఉన్న జుట్టుతో సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; పాదసూచిక మూలపద విస్తృతిని కాపాడుతుంది.
- source_word: עַל רֹאשׁוֹ
  choice: అతని తలపై ఉంది
  rationale: మూలంలోని స్పష్టమైన శిరస్సు-చిత్రణను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: నాజీరు నియమంలో అపవిత్రత స్వభావం
  choice: ‘తనను అపవిత్రపరచుకోకూడదు’ అని అనువదించి, ఇది మరణదేహ సంబంధమైన ఆచారపరమైన అపవిత్రత అని సందర్భానుసారంగా గ్రహించేటట్లు చేయడం
  alternative: నైతిక కలుషాన్ని బలంగా సూచించే పదజాలాన్ని వివరణ లేకుండా వాడడం
  rationale: ఈ వాక్యం శవసంబంధ ఆచారపరమైన అపవిత్రతను గురించి చెబుతుంది; పాఠ్యం చెప్పనంత నైతిక అపరాధ భావాన్ని అనువాదం చేర్చకూడదు.
- issue: נֵזֶר యొక్క అర్థపరిధి
  choice: ప్రతిష్ఠిత స్థితి మరియు దాని తలపై కనిపించే గుర్తు రెండింటినీ అనువాదం, పాదసూచిక ద్వారా నిలుపడం
  alternative: దానిని కేవలం భౌతిక ‘కిరీటం’గా లేదా కేవలం సారాంశ ‘ప్రతిష్ఠ’గా పరిమితం చేయడం
  rationale: నాజీరు సందర్భంలో పదం దేవునికి ప్రత్యేకించబడిన స్థితిని సూచిస్తూ, పెంచిన జుట్టులో కనిపించే దాని చిహ్నాన్నీ ఉద్దేశిస్తుంది; ఒకే భావానికి పరిమితం చేయడం మూలంలోని ఘనతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సోదరుడు/సోదరి’ ప్రమాణ భాషకు తగినవి. ప్రధాన వాక్యంలో ఆచారపరమైన భావాన్ని నిలుపుతూ, נֵזֶר యొక్క నిజమైన భావవిస్తృతిని పాదసూచికలో వివరించాం.
