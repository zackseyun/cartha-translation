- from: తన తండ్రి గానీ, తల్లి గానీ, సోదరుడు గానీ, సోదరి గానీ చనిపోయినప్పుడు, వారి నిమిత్తం అతడు తనను అపవిత్రపరచుకోకూడదు[a]. ఎందుకంటే అతని దేవునికి ప్రతిష్ఠితుడై ఉన్నదానికి గుర్తు[b] అతని తలపై ఉంది.
  to: తన తండ్రి గానీ, తల్లి గానీ, సోదరుడు గానీ, సోదరి గానీ చనిపోయినప్పుడు, వారి నిమిత్తం అతడు తనను అపవిత్రపరచుకోకూడదు[a]. ఎందుకంటే అతని దేవునికి అంకితమైన ప్రతిష్ఠ అతని తలపై ఉంది[b].
  rationale: నిషేధం, బంధుత్వ సంబంధాలు, మరణసందర్భం అన్నీ నిలుపుతూ, నֵזֶרను ‘అతని దేవునికి అంకితమైన ప్రతిష్ఠ’గా నేరుగా అనువదించాం. ఇలా చేయడం ద్వారా మూలంలోని ‘అతని దేవుడు’ అనే సంబంధాన్ని, తలపై ఉన్న ప్రతిష్ఠ అనే సాక్షాత్తు చిత్రణను కాపాడాం. జుట్టు కనిపించే గుర్తు అనే సందర్భానుగుణ వివరణను పాదసూచికకే పరిమితం చేశాం.
