id: NUM.6.5
reference: Numbers 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: te
  text: అతని నాజీరు ప్రతిజ్ఞ ఉన్న రోజులన్నిటిలో[a] క్షౌరకత్తి అతని తలపైకి పోకూడదు. అతడు యెహోవాకు తనను ప్రత్యేకించుకొనే రోజులు పూర్తయ్యే వరకు అతడు పవిత్రునిగా ఉండాలి; తన తల వెంట్రుకలను కత్తిరించకుండా పెరగనివ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని ప్రత్యేకించుకొనే ప్రతిజ్ఞ రోజులన్నిటిలో.’ ‘నాజీరు’కు సంబంధించిన హీబ్రూ పదం వేరుపడడం లేదా దేవునికి అంకితమవడం అనే భావంతో ముడిపడి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: అతని నాజీరు వ్రతకాలం
  rationale: ‘నాజీరు’ అనే సాంకేతిక పదాన్ని నిలుపుతూ, వ్రతం కొనసాగిన రోజులన్నిటినీ సూచించే సహజమైన తెలుగు రూపం.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: అతని తలమీదికి క్షురకత్తి రాకూడదు
  rationale: క్షురకత్తి తలమీదికి రాకూడదనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: రోజులు పూర్తయ్యే వరకు
  rationale: కాలపరిమితి సంపూర్ణంగా ముగియడాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: అతడు యెహోవా కోసం తనను ప్రత్యేకించుకునే
  rationale: నזר ధాతువులోని వేరుపరచుకోవడం లేదా ప్రత్యేకించుకోవడం అనే భావాన్ని, యెహోవాకు అంకితమైన దిశను నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: దైవ నామాన్ని వ్యక్తినామంగా లిప్యంతరీకరిస్తూ, ל ఉపసర్గలోని అంకితార్థాన్ని తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: קָדֹשׁ יִהְיֶה
  choice: అతడు పవిత్రుడిగా ఉండాలి
  rationale: קדוש అనే ప్రధాన ధార్మిక పదాన్ని ‘పవిత్రుడు’గా నేరుగా నిలుపుతుంది.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: తన తల వెంట్రుకలను కత్తిరించకుండా పెరగనివ్వాలి
  rationale: పెరగనివ్వడం అనే causative భావంతో పాటు פֶרַע సూచించే కత్తిరించని, స్వేచ్ఛగా పెరిగే వెంట్రుకల భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే నిబంధన నామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- issue: קדוש ను వివరణాత్మక పదంతో మార్చాలా
  choice: పవిత్రుడిగా ఉండాలి
  alternative: ప్రత్యేకింపబడినవాడిగా ఉండాలి; ప్రతిష్ఠితుడిగా ఉండాలి
  rationale: మూలంలోని ధార్మిక ప్రాధాన్యం గల ‘పవిత్రుడు’ అనే భావాన్ని నిలుపుతుంది; ప్రత్యేకించుకోవడం అనే అంశం ముందటి వాక్యభాగంలో ఇప్పటికే స్పష్టంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. హీబ్రూ న్యాయవాక్యపు ఆజ్ఞాత్మక బలాన్ని ‘రాకూడదు’, ‘ఉండాలి’, ‘పెరగనివ్వాలి’ రూపాలతో నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
