source:
  edition: WLC
  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: te
  text: కాబట్టి వారు నా నామాన్ని ఇశ్రాయేలు కుమారుల మీద ఉంచుతారు[b][a]; నేనే వారిని ఆశీర్వదిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “ఇశ్రాయేలీయులు,” “ఇశ్రాయేలు ప్రజలు.” హీబ్రూ అక్షరార్థం: “ఇశ్రాయేలు కుమారులు.”'
    reason: lexical_alternative
  - marker: b
    text: “నా నామాన్ని ... మీద ఉంచుతారు” అనే మాట, యెహోవా నిబంధన నామాన్ని వారిమీద ఉచ్చరించి, వారు ఆయనకు చెందినవారిగా గుర్తించబడడాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: కాబట్టి వారు ... ఉంచాలి
  rationale: שׂוּם అనే క్రియకు ‘ఉంచు, పెట్టు’ అనే ప్రాథమిక అర్థం ఉంది. ముందున్న యాజక ఆశీర్వాదానికి ఫలితంగా వచ్చే ఆదేశాన్ని וְ అనుసంధానిస్తున్నందున ‘కాబట్టి’ అని, క్రియారూపంలోని ఆదేశాత్మక భావాన్ని ‘ఉంచాలి’ అని అందించాం.
- source_word: אֶת שְׁמִי
  choice: నా నామాన్ని
  rationale: దైవ నామానికి ఉన్న నిబంధనాత్మక, ప్రతినిధిత్వ ప్రాధాన్యాన్ని నిలుపుటకు ‘నామం’ అనే సూటి పదాన్ని వాడాం; ‘అధికారం’ లేదా ‘ఆశీర్వాదం’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: עַל
  choice: మీద
  rationale: దైవ నామాన్ని ప్రజల మీద ఉంచడం అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో ‘మీద’ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇది మొత్తం నిబంధన సమాజాన్ని సూచించినప్పటికీ, మూలంలోని సాంప్రదాయిక పురుష బహువచన జాతీయ నామరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: וַאֲנִי
  choice: నేనే
  rationale: ప్రత్యేకంగా వాడిన אֲנִי సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో ‘నేనే’ వ్యక్తం చేస్తుంది.
- source_word: אֲבָרֲכֵם
  choice: వారిని ఆశీర్వదిస్తాను
  rationale: ברך అంటే ‘ఆశీర్వదించు.’ దైవ వాగ్దాన భావాన్ని తెలుగు భవిష్యత్ రూపం స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని నామాన్ని ఇశ్రాయేలు మీద ఉంచడం
  choice: ‘నా నామాన్ని ... మీద ఉంచాలి’ అనే స్పష్టమైన నిబంధనాత్మక రూపకాన్ని యథాతథంగా నిలుపుట
  alternative: ‘నా నామాన్ని వారిమీద ఉచ్చరించాలి’ లేదా ‘వారు నాకు చెందినవారని గుర్తించాలి’
  rationale: ఈ పదబంధం యాజక ఆశీర్వాదంలో యెహోవా నామాన్ని ప్రజలపై ఉచ్చరించడం, వారు దేవునికి చెందినవారనే నిబంధనాత్మక గుర్తింపు వంటి భావాలను సూచించవచ్చు. అయితే మూలపాఠ్యం వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయదు; అందువల్ల రూపకాన్ని పాఠ్యంలో ఉంచి గమనికలో వివరించాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని అక్షరార్థ రూపాన్ని, పంచగ్రంథంలోని దాని నిరంతర వాడుకను నిలిపాం. ఈ పదబంధం పురుషులను మాత్రమే కాక మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించగలదని గమనిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. దైవ నామానికి ఉన్న గంభీరతను ప్రతిబింబించేందుకు ‘పేరు’కు బదులుగా ‘నామం,’ ఉద్ఘాటిత సర్వనామానికి ‘నేనే’ ఎంచుకున్నాం. మూలంలోని రూపకాన్ని వివరణాత్మక అనువాదంతో భర్తీ చేయకుండా ప్రధాన పాఠ్యంలో నిలిపాం.
