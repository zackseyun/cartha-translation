  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: te
  text: ఒకవేళ ఎవరైనా అతని పక్కనే అకస్మాత్తుగా[a] చనిపోయి, అతని ప్రతిష్ఠితమైన తలను[b] అపవిత్రం చేస్తే, అతడు తాను శుద్ధి పొందే రోజున తన తల వెంట్రుకలను గీయించుకోవాలి; ఏడవ రోజున వాటిని గీయించుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అకస్మాత్తుగా’ అనే భావాన్ని తెలిపే రెండు సమీపార్థక పదాలు వరుసగా ఉన్నాయి; అవి హఠాత్తుగా, ఊహించని విధంగా జరిగిన మరణాన్ని బలంగా సూచిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని ప్రతిష్ఠ యొక్క తల.’ ఈ హీబ్రూ పదబంధం తలను అతని నాజీరత్వ ప్రతిష్ఠతో నేరుగా అనుసంధానిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ఒకవేళ
  rationale: నాజీరత్వ నియమాలలో సంభవించగల షరతుతో కూడిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; హీబ్రూ సంధాన భావం వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: יָמוּת מֵת
  choice: ఎవరైనా ... చనిపోయి
  rationale: ‘చనిపోయినవాడు చనిపోతే’ అనే హీబ్రూ ధాతుసంబంధ నిర్మాణం ఒక వ్యక్తి మరణించడాన్ని సూచించే నుడికారం; తెలుగులో సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: עָלָיו
  choice: అతని పక్కనే
  rationale: మృతదేహ అపవిత్రత సందర్భంలో నాజీరుకు అతి సమీపంలో మరణం సంభవించడాన్ని సూచిస్తుంది; కేవలం శారీరకంగా ‘అతని మీద’ పడటమనే అర్థానికి పరిమితం చేయదు.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: జంటగా వచ్చిన హీబ్రూ పదాలు మరణం హఠాత్తుగా, ఊహించని విధంగా సంభవించడాన్ని బలంగా వ్యక్తం చేస్తాయి; తెలుగులో ‘అకస్మాత్తుగా’ సంక్షిప్తంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וְטִמֵּא
  choice: అపవిత్రం చేస్తే
  rationale: మరణించిన వ్యక్తి లేదా ఆ మరణ సంఘటన నాజీరు ప్రతిష్ఠిత తలను ఆచారపరంగా అపవిత్రం చేసే ఫలితాన్ని షరతు వాక్యంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רֹאשׁ נִזְרוֹ
  choice: అతని ప్రతిష్ఠితమైన తలను
  rationale: נזר సూచించే నాజీరత్వ ప్రతిష్ఠను, ముఖ్యంగా కత్తిరించని జుట్టుతో సంబంధమున్న తలను, మతశాఖాపరమైన అదనపు భావాలు చేర్చకుండా తెలియజేస్తుంది.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: తన తలను క్షౌరం చేసుకోవాలి
  rationale: అపవిత్రత తరువాత చేయవలసిన ఆచారపరమైన చర్యను సహజమైన శాసన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: తాను శుద్ధి పొందే రోజున
  rationale: అపవిత్రత తరువాత ఆచారపరంగా శుద్ధి పొందే సమయాన్ని అందుబాటులో ఉండే భాషలో వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: హీబ్రూ కాలనిర్దేశాన్ని నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: יְגַלְּחֶנּוּ
  choice: దాన్ని క్షౌరం చేసుకోవాలి
  rationale: ప్రత్యయ సర్వనామం ముందు పేర్కొన్న తలను సూచిస్తుంది; హీబ్రూలోని పునరుక్త శాసన నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నాజీరత్వ అపవిత్రతలో נזר పదం యొక్క భావం
  choice: ‘ప్రతిష్ఠితమైన తల’ అని ఆచారపరమైన ప్రతిష్ఠ భాషలో అనువదించడం
  alternative: ‘వేరుపరచబడిన తల’ లేదా ‘మొక్కుబడి తల’
  rationale: ఈ వచనం నాజీరత్వ ప్రతిష్ఠకు మరణ అపవిత్రత వల్ల కలిగే అంతరాయాన్ని గురించి చెబుతుంది. ‘ప్రతిష్ఠితమైన తల’ అనే రూపం తల/జుట్టు యొక్క ఆచారపరమైన ప్రాముఖ్యతను నిలుపుతూ, ఈ పదబంధంలో ప్రత్యక్షంగా లేని ప్రత్యేక సిద్ధాంతార్థాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శాసన శైలిని ఉపయోగించాం. ‘క్షౌరం చేసుకోవాలి,’ ‘శుద్ధి పొందే రోజు,’ ‘ప్రతిష్ఠితమైన తల’ వంటి పదబంధాలు ఆచార సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. సంప్రదింపుగా ఇచ్చిన ఆంగ్ల పాఠ్యంలో పాదసూచికల విషయాలు వాటి గుర్తుల స్థానాలతో తారుమారుగా కనిపించినందున, మూల హీబ్రూ ఆధారంగా [a]ను ‘అకస్మాత్తుగా’ వద్ద, [b]ను ‘ప్రతిష్ఠితమైన తల’ వద్ద ఉంచాం.
