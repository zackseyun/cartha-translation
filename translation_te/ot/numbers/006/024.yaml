base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: te
  text: యాహ్వే నిన్ను ఆశీర్వదించుగాక, నిన్ను కాపాడుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH”; సాధారణంగా “యాహ్వే” అని లిప్యంతరీకరిస్తారు; సాంప్రదాయ అనువాదాల్లో “ప్రభువు” అని వాడుతారు.'
    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని, ప్రధాన పాఠంలోని లిప్యంతరీకరణను, సంప్రదాయ ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: నిన్ను ఆశీర్వదించి ... గాక
  rationale: పియేల్ జస్సివ్ రూపంలోని ఆశీర్వచన భావాన్ని తెలుగులో సహజమైన ‘గాక’ నిర్మాణంతో వ్యక్తం చేశాం. తరువాతి సమాంతర క్రియతో కలిపి ‘ఆశీర్వదించి ... కాపాడుగాక’ అని చెప్పడం సంక్షిప్తమైన కవితా లయను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְיִשְׁמְרֶךָ
  choice: నిన్ను కాపాడుగాక
  rationale: שמר అనే క్రియ ఇక్కడ రక్షిస్తూ భద్రపరచడం అనే భావాన్ని ఇస్తుంది. ‘కాపాడుగాక’ జస్సివ్ ఆశీర్వచన స్వరాన్ని, దేవుని సంరక్షణ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగు వాడుకలో స్థిరపడిన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి, మూలంలోని YHWH రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనాత్మక గాంభీర్యాన్ని మరియు హీబ్రూ ఆశీర్వచనపు సంక్షిప్త సమాంతరతను నిలుపుతూ అనువదించాం. ఏకవచన ద్వితీయ పురుష సూచనగా ‘నిన్ను’ వాడాం.
