reference: Numbers 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: te
  text: 'తన నాజీరత్వం నిమిత్తం యెహోవాకు అర్పణను మొక్కుకున్న నాజీరు విషయమైన నియమం ఇదే: అతని సామర్థ్యం బట్టి అతడు సమకూర్చగల దానికితోడు, తన నాజీరత్వం కోసం యెహోవాకు అర్పించాల్సిన అర్పణ ఇదే.[a] అతడు చేసిన మొక్కుబడి ప్రకారం, తన నాజీరత్వానికి సంబంధించిన నియమం ప్రకారం అతడు అలాగే చేయాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని చెయ్యి చేరగలిగిన దానికితోడు”; అంటే అతని ఆర్థిక సామర్థ్యాన్ని బట్టి అతడు సమకూర్చగల దానికితోడు.
    reason: హీబ్రూ నుడికారంలోని ‘చెయ్యి చేరడం’ అనే రూపకాన్ని నిలుపుతూ, అది వ్యక్తి సామర్థ్యం లేదా వనరులను సూచిస్తుందని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: నాజీరుగా మొక్కుబడి చేసుకున్న వ్యక్తికి సంబంధించిన నియమం
  rationale: תּוֹרָה ఇక్కడ నాజీరుకు వర్తించే విధి లేదా నియమాన్ని సూచిస్తుంది. נָזִיר అనే సాంకేతిక పదాన్ని ‘నాజీరు’గా ఉంచి, ఆధునిక తెలుగు పాఠకునికి దాని భావాన్ని సందర్భంలో స్పష్టం చేశాం.
- source_word: קָרְבָּנוֹ לַיהוָה עַל נִזְרוֹ
  choice: తన నాజీరత్వం నిమిత్తం యెహోవాకు అర్పించాల్సిన అర్పణ
  rationale: קָרְבָּןను సాధారణ బలి-అర్పణ పదమైన ‘అర్పణ’గా, לַיהוָהను దిశ/సమర్పణ భావంతో ‘యెహోవాకు’గా, נִזְרוֹను నాజీరుగా వేరుపరచబడిన స్థితి మరియు మొక్కుబడిని సూచించే ‘నాజీరత్వం’గా అనువదించాం.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: తోపాటు, తనకు అందుబాటులో ఉన్నదానిని కూడా
  rationale: ‘అతని చెయ్యి చేరగలిగినది’ అనే హీబ్రూ నుడికారం అతని ఆర్థిక సామర్థ్యం లేదా సమకూర్చగలిగిన అదనపు అర్పణను సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר כֵּן יַעֲשֶׂה
  choice: అతడు చేసిన మొక్కుబడి ప్రకారం ... అలాగే చేయాలి
  rationale: హీబ్రూలోని మొక్కుబడి-చర్య అనుసరణను మరియు విధిబద్ధతను సహజమైన న్యాయశైలి తెలుగులో నిలిపాం.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: తన నాజీరత్వ నియమానికి అనుగుణంగా
  rationale: ముగింపు పదబంధం అతని చర్యను నాజీరత్వాన్ని పాలించే నియమంతో తిరిగి అనుసంధానిస్తుంది; ‘అనుగుణంగా’ ఈ సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చి వ్యక్తినామాన్ని మరుగుపరచలేదు.
- issue: נִזְרוֹ యొక్క భావపరిధి
  choice: నాజీరత్వం
  alternative: నాజీర మొక్కుబడి / ప్రత్యేక ప్రతిష్ఠ
  rationale: ఈ పదం మొక్కుబడినే కాక దాని ఫలితమైన వేరుపరచబడిన ప్రతిష్ఠిత స్థితినీ సూచించగలదు. ‘నాజీరత్వం’ ఆ సాంకేతిక మరియు ఉద్దేశపూర్వకంగా విస్తృతమైన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన న్యాయ/ఆరాధనా శైలిని ఉపయోగించాం. ‘నాజీరు’, ‘నాజీరత్వం’ అనే సాంకేతిక పదాలను నిలిపి, వాక్యనిర్మాణం ద్వారా అవి మొక్కుబడి మరియు ప్రత్యేక ప్రతిష్ఠకు సంబంధించినవని స్పష్టం చేశాం. హీబ్రూ పునరుక్తిని పూర్తిగా యాంత్రికంగా అనుకరించకుండా, దాని విధిబద్ధతను నిలిపాం.
