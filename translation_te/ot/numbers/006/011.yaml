id: NUM.6.11
reference: Numbers 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: te
  text: యాజకుడు ఒకదానిని పాపపరిహార బలిగా, మరొకదానిని దహనబలిగా అర్పించి, మృతుని విషయంలో అతడు పాపం చేసినందుకు అతని కొరకు ప్రాయశ్చిత్తం చేయాలి; ఆ రోజునే అతని తలను పవిత్రపరచాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: యాజకుడు ... అర్పించాలి
  rationale: עָשָׂה అక్షరార్థంగా ‘చేయు’ అయినా, బలుల సందర్భంలో వాటిని అర్పించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అర్పించాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶחָד לְחַטָּאת
  choice: ఒకదానిని పాపపరిహార బలిగా
  rationale: חַטָּאת యాజకధర్మ సందర్భంలో పాపానికి లేదా ఆచార అపవిత్రతకు సంబంధించిన బలిని సూచిస్తుంది. తెలుగులో పరిచితమైన ‘పాపపరిహార బలి’ని ప్రధాన పాఠ్యంలో ఉంచి, ‘శుద్ధీకరణ బలి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְאֶחָד לְעֹלָה
  choice: మరొకదానిని దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహించబడే బలి; ‘దహనబలి’ స్థిరమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר యొక్క బలిసంబంధమైన భావాన్ని ‘ప్రాయశ్చిత్తం చేయు’ తెలియజేస్తుంది; ప్రాయశ్చిత్త సిద్ధాంతాన్ని మరింత సంకుచితంగా నిర్వచించకుండా మూలంలోని ధార్మిక బలాన్ని కాపాడుతుంది.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: మృతుని విషయంలో అతడు పాపం చేసినందుకు
  rationale: సందర్భంలో נֶפֶשׁ మృత వ్యక్తిని, అంటే అపవిత్రత కలిగించిన మృతదేహాన్ని సూచిస్తుంది. עַל యొక్క కొంత విస్తృత సంబంధార్థాన్ని ‘విషయంలో’ నిలుపుతుంది; మరణం ఉద్దేశపూర్వక నైతిక అపరాధమని అనవసరంగా సూచించదు.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: అతడు తన తలను తిరిగి ప్రతిష్ఠించుకోవాలి
  rationale: క్రియ స్వయంగా ‘ప్రతిష్ఠించు/పవిత్రపరచు’ అని ఉన్నప్పటికీ, ముందరి అపవిత్రతతో భంగమైన నాజీరు అంకితాన్ని అదే రోజు పునరుద్ధరించడం సందర్భం. తెలుగు పాఠకునికి ఈ సందర్భార్థాన్ని ‘తిరిగి’ స్పష్టం చేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: అక్షరార్థమైన ‘ఆ రోజున’తో పాటు అదే రోజున జరగవలసిన తక్షణ చర్యను తెలుగు ‘ఆ రోజే’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חַטָּאת అనే బలి పేరు
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భం మృతదేహం వల్ల కలిగిన ఆచార అపవిత్రతకు సంబంధించినది కాబట్టి ‘శుద్ధీకరణ బలి’కి బలమైన ఆధారం ఉంది. అయినా חַטָּאת యొక్క సాంప్రదాయ బలివర్గాన్ని గుర్తించేందుకు ‘పాపపరిహార బలి’ని పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: הַנָּפֶשׁ యొక్క సూచన
  choice: మృతుడు
  alternative: మృతదేహం
  rationale: ఇక్కడ పదం అక్షరార్థంగా ‘ప్రాణి/వ్యక్తి’ అయినా, సంఖ్యాకాండము 6 సందర్భంలో మరణించిన మనిషిని సూచిస్తుంది. ‘మృతుడు’ మానవ సూచనను నిలుపుతుంది; అపవిత్రత మృతదేహ సంబంధం వల్లనే అని పాదసూచిక వివరిస్తుంది.
- issue: నాజీరు తలను ప్రతిష్ఠించడం
  choice: తిరిగి ప్రతిష్ఠించుకోవాలి
  alternative: ప్రతిష్ఠించుకోవాలి
  rationale: హీబ్రూ క్రియలో ‘తిరిగి’ అనే ఉపసర్గ ప్రత్యక్షంగా లేదు. అయితే అపవిత్రత తరువాత నాజీరు అంకితకాలం పునఃప్రారంభమవుతుందనే సమీప సందర్భాన్ని సహజ తెలుగులో స్పష్టం చేయడానికి దీనిని ఉపయోగించాం; ఇది కొత్త సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసనశైలిని ఉపయోగించాం. ‘యాజకుడు,’ ‘దహనబలి,’ ‘ప్రాయశ్చిత్తం,’ ‘ప్రతిష్ఠించుకోవాలి’ వంటి సాధారణ బైబిల్ పదజాలాన్ని ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకునికి సులభంగా అర్థమయ్యేలా విభజించాం. మూలంలోని బలి-సంబంధ అస్పష్టతను పాదసూచికలో సంరక్షించాం.
