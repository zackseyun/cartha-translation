revisions:
- from: యాజకుడు ఒకదానిని పాపపరిహార బలిగా[a], మరొకదానిని దహనబలిగా అర్పించాలి. మృతుని విషయంలో అతడు పాపం చేసినందుకు[b] యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి. ఆ రోజే అతడు తన తలను తిరిగి ప్రతిష్ఠించుకోవాలి.
  to: యాజకుడు ఒకదానిని పాపపరిహార బలిగా, మరొకదానిని దహనబలిగా అర్పించి, మృతుని విషయంలో అతడు పాపం చేసినందుకు అతని కొరకు ప్రాయశ్చిత్తం చేయాలి; ఆ రోజునే అతని తలను పవిత్రపరచాలి.
  rationale: The revision retains the draft’s accurate sacrificial terminology and its careful handling of the corpse-impurity idiom, while restoring the priest as the grammatical agent of consecrating the Nazirite’s head. It also removes the non-explicit ‘again’ nuance and makes the final ritual action natural in modern standard Telugu.
  reviewer_model: gpt-5.6-terra
