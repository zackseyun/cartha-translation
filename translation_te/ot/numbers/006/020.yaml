revisions:
- from: యాజకుడు వాటిని అల్లాడించి అర్పించే కానుకగా యహ్వే సన్నిధిలో అల్లాడించాలి. అల్లాడించి అర్పించే కానుకలోని రొమ్ముభాగంతోనూ, ప్రత్యేకంగా సమర్పించిన కానుకలోని తొడభాగంతోనూ[a] పాటు అది యాజకునికి చెందిన పవిత్ర భాగం. ఆ తరువాత నాజీరుడు ద్రాక్షారసం తాగవచ్చు[b].
  to: యాజకుడు వాటిని యహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి. ఈ అర్పణ యాజకునికి పవిత్రమైనది; అది ఊపే అర్పణలోని రొమ్ముభాగానికి, ప్రత్యేక అర్పణలోని తొడభాగానికి అదనం.[a] ఆ తరువాత నాజీరుడు ద్రాక్షామద్యం తాగవచ్చు.[b]
  rationale: The revision corrects the inaccurate wine term, replaces an unnatural ritual verb, and clarifies the syntactic relation of the priestly portion to the breast and thigh. It preserves the Hebrew’s singular collective reference (“ఈ అర్పణ ... అది”), the distinction between the two ritual offerings, and the contextual permissive force of the final imperfect. Footnote anchors remain attached to the relevant Telugu expressions.
