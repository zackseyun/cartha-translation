source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: te
  text: యాజకుడు వాటిని యహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి. ఈ అర్పణ యాజకునికి పవిత్రమైనది; అది ఊపే అర్పణలోని రొమ్ముభాగానికి, ప్రత్యేక అర్పణలోని తొడభాగానికి అదనం.[a] ఆ తరువాత నాజీరుడు ద్రాక్షామద్యం తాగవచ్చు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రత్యేక అర్పణ”కు మూలపదాన్ని మరింత అక్షరార్థంగా “ఎత్తి సమర్పించే కానుక” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఆ తరువాత నాజీరుడు ద్రాక్షామద్యం తాగుతాడు.” సందర్భం ప్రకారం ఇక్కడ ప్రతిజ్ఞ ముగిసిన తరువాత తాగడానికి లభించిన అనుమతి ఉద్దేశించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: అల్లాడించి అర్పించే కానుకగా ... అల్లాడించాలి
  rationale: బలుల ఆచారంలో נוּף అనే క్రియ, దానికి సంబంధించిన תְּנוּפָה అనే నామవాచకం కలిసి కానుకను యహ్వే సన్నిధిలో ఆచారబద్ధంగా అల్లాడించి సమర్పించడాన్ని సూచిస్తాయి. తెలుగు పాఠకునికి ఆ క్రియ స్పష్టంగా ఉండేలా, హెబ్రీలోని పదబంధ సంబంధాన్ని కూడా సాధ్యమైనంతవరకు నిలిపాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనేది ఇక్కడ దేవుని సమక్షంలో జరిగే ఆరాధనా క్రియను సూచిస్తుంది; యహ్వే అనే ఒడంబడిక నామాన్ని పేరుగానే ఉంచాం.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: అది యాజకునికి చెందిన పవిత్ర భాగం
  rationale: హెబ్రీ ఏకవచన సర్వనామాన్ని ‘అది’గా నిలిపి, לַכֹּהֵן తెలిపే యాజకునికి కేటాయించిన పవిత్ర భాగం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: עַל
  choice: తోనూ పాటు
  rationale: ఇక్కడ עַל భౌతికంగా ‘మీద’ అనే అర్థంలో కాక, యాజకునికి ఇప్పటికే కేటాయించిన ఇతర భాగాలకు అదనంగా అనే పంపిణీ భావంలో ఉంది.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: అల్లాడించి అర్పించే కానుకలోని రొమ్ముభాగం
  rationale: బలిలో యాజకునికి కేటాయించే నిర్దిష్ట భాగాన్ని సూచిస్తూ, תְּנוּפָהకు మొదటి వాక్యంతో ఒకే పదప్రయోగాన్ని కొనసాగించాం.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: ప్రత్యేకంగా సమర్పించిన కానుకలోని తొడభాగం
  rationale: שׁוֹקను శరీర భాగంగా ‘తొడభాగం’ అని, תְּרוּמָהను ప్రత్యేకంగా వేరుచేసి సమర్పించిన కానుకగా పాఠకునికి స్పష్టంగా అనువదించాం.
- source_word: הַנָּזִיר
  choice: నాజీరుడు
  rationale: సంఖ్యాకాండము 6లోని ప్రత్యేక ప్రతిజ్ఞ చేసిన వ్యక్తికి వాడే స్థిరమైన బైబిలు పదాన్ని నిలిపాం.
- source_word: יִשְׁתֶּה ... יָיִן
  choice: ద్రాక్షారసం తాగవచ్చు
  rationale: ప్రతిజ్ఞ ముగిసిన తరువాత మునుపటి నిషేధం తొలగిపోయి తాగే అనుమతి కలుగుతుందని సందర్భం సూచిస్తుంది; ‘తాగవచ్చు’ ఆ న్యాయపరమైన అనుమతిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం.
- issue: יִשְׁתֶּה క్రియారూపం యొక్క భావబలం
  choice: తాగవచ్చు
  alternative: తాగుతాడు / తాగాలి
  rationale: వ్యాకరణపరంగా సాధారణ భవిష్యత్ లేదా నియమవాక్యంగా అనువదించే వీలున్నా, నాజీరుని ఆచారం ముగిసిన సందర్భంలో ఇది తాగవలసిన ఆజ్ఞకన్నా తిరిగి లభించిన అనుమతిని సూచిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకునికి అర్థమయ్యే శైలిని వాడాం. బలి ఆచారానికి సంబంధించిన సాంకేతిక పదాలను అపారదర్శకమైన సంప్రదాయ పదాలుగా కాక వివరణాత్మక పదబంధాలుగా ఇచ్చాం; ‘నాజీరుడు’ మాత్రం అధ్యాయమంతటా అవసరమైన స్థిరపదంగా ఉంచాం.
