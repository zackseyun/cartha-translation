source:
  edition: WLC
  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: te
  text: యెహోవాకు తాను ప్రత్యేకించబడిన రోజులన్నిటిలో[a], అతడు ఏ శవం[b] దగ్గరికీ వెళ్లకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని నాజీరు మొక్కుబడి కాలమంతటిలో” లేదా “అతని ప్రతిష్ఠాకాలమంతటిలో.” హెబ్రీ పదం నాజీరుగా ప్రత్యేకించబడిన స్థితిని లేదా కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “చనిపోయిన నెఫెష్”; ఇక్కడ అది చనిపోయిన మనిషి దేహాన్ని, అంటే శవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: రోజులన్నిటిలో
  rationale: మొత్తం కాలవ్యవధిని సూచించే హెబ్రీ పరిమాణార్థాన్ని సహజమైన తెలుగు కాలప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: הַזִּירוֹ
  choice: అతడు ప్రత్యేకంగా ఉండే
  rationale: נזר మూలానికి చెందిన ఈ పదం నాజీరుగా వేరుపరచబడిన స్థితిని లేదా కాలాన్ని సూచిస్తుంది. మూలపాఠంలో లేని ‘మొక్కుబడి’ అనే భావాన్ని ప్రధాన వాక్యంలో చేర్చకుండా ఆ అర్థాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహ్వేకు
  rationale: దైవనామమైన יהוהను తెలుగు ధ్వన్యంతరీకరణతో ఇస్తూ, לַ ఉపసర్గలోని అంకితభావ సంబంధాన్ని ‘కు’ ద్వారా తెలియజేస్తుంది.
- source_word: עַל נֶפֶשׁ מֵת
  choice: ఏ మృతదేహం దగ్గరికీ
  rationale: בוא ... עַל అనే సందర్భోచిత ప్రయోగం సమీపించడాన్ని సూచిస్తుంది; נֶפֶשׁ מֵת శుద్ధి నియమాల సందర్భంలో మానవ శవాన్ని సూచిస్తుంది.
- source_word: לֹא יָבֹא
  choice: వెళ్లకూడదు
  rationale: నిషేధార్థక న్యాయనియమాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నాజీరు సంబంధమైన పదాన్ని అతిగా నిర్దిష్టీకరించకుండా అనువదించడం
  choice: అతడు ప్రత్యేకంగా ఉండే
  alternative: అతని నాజీరు మొక్కుబడి కాలంలో; అతని ప్రతిష్ఠిత కాలంలో
  rationale: ఈ నామవాచకం నాజీరు వ్యవస్థకు సంబంధించినదే అయినా, ఇక్కడ నేరుగా మొక్కుబడిని కాక వేరుగా ఉంచబడిన స్థితి లేదా కాలాన్ని సూచిస్తుంది. సందర్భం నాజీరు భావాన్ని అందిస్తుండగా ప్రధాన వాక్యం మూలంలోని విస్తృతిని కాపాడుతుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని పేరుగానే నిలుపుతుంది; బిరుదుతో భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. న్యాయనియమపు నిషేధాన్ని ‘వెళ్లకూడదు’ అని స్పష్టంగా చెప్పి, నాజీరు పదంలోని భావవిస్తృతిని పాదసూచికలో నిలిపాం.
