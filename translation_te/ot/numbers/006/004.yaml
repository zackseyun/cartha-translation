  source_fidelity: హీబ్రూ వచనంలోని కాలవ్యాప్తి (כֹּל יְמֵי), నాజీరు ప్రత్యేక దీక్ష/వ్రత సందర్భం (נִזְרוֹ), ద్రాక్షావల్లి నుండి ఉత్పన్నమైన సమస్తంపై నిషేధం, అలాగే ‘గింజల నుండి తొక్క వరకు’ అనే సమగ్రతను సూచించే పదబంధం అన్నీ సరిగ్గా ప్రతిఫలించబడ్డాయి. నిషేధార్థక క్రియకు ‘తినకూడదు’ తగిన శాసనాత్మక బలం ఇస్తుంది.
