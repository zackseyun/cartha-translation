  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: te
  text: అతని నాజీరు దీక్షాకాలమంతా, ద్రాక్షావల్లి నుండి తయారయ్యే దేనినీ—గింజల మొదలుకొని తొక్క వరకు—అతడు తినకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “గింజల నుండి తొక్క వరకు.” ఇది ద్రాక్షలోని ప్రతి భాగాన్నీ సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי נִזְרוֹ
  choice: అతని నాజీరు దీక్షాకాలమంతా
  rationale: ఈ పదబంధం నాజీరు వ్యక్తిగా ప్రత్యేకించబడిన పూర్తి కాలాన్ని సూచిస్తుంది. ‘దీక్షాకాలం’ అనే పదం వ్రతం, ప్రత్యేక ప్రతిష్ఠ అనే భావాలను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: తయారయ్యే దేనినీ
  rationale: హీబ్రూ వాక్యంలో నిషేధం చివరి క్రియతో వ్యక్తమవుతుంది. తెలుగులో ‘దేనినీ ... తినకూడదు’ అనే నిర్మాణం నిషేధపు సమగ్రతను సహజంగా నిలుపుతుంది.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: ద్రాక్షావల్లి నుండి
  rationale: అక్షరార్థంగా ‘ద్రాక్షారసపు తీగ’ అనే హీబ్రూ నుడికారం సాధారణ ద్రాక్షావల్లిని సూచిస్తుంది; ‘ద్రాక్షావల్లి’ స్పష్టమైన సహజ తెలుగు సమానం.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: గింజల మొదలుకొని తొక్క వరకు
  rationale: ద్రాక్షలోని రెండు అంచు భాగాలను పేర్కొని మొత్తం ద్రాక్షకు సంబంధించిన ప్రతిదానినీ సూచించే హీబ్రూ సమగ్ర నుడికారాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: לֹא יֹאכֵל
  choice: అతడు తినకూడదు
  rationale: ధర్మశాస్త్ర సందర్భంలోని నిషేధార్థక అసంపూర్ణ క్రియను ఆధునిక తెలుగులో స్పష్టమైన విధినిషేధంగా అందిస్తుంది.
theological_decisions:
- issue: נִזְרוֹ అనే పదంలోని ప్రత్యేకత/ప్రతిష్ఠ మరియు నాజీరు వ్రతం మధ్య సంబంధం
  choice: నాజీరు దీక్షాకాలం
  alternative: అతని ప్రత్యేక ప్రతిష్ఠాకాలం
  rationale: తక్షణ సందర్భం నాజీరు వ్యవస్థను స్పష్టంగా సూచిస్తుంది. ‘నాజీరు దీక్ష’ సాంకేతిక సందర్భాన్ని తెలియజేస్తూనే ప్రత్యేకించబడిన స్థితి అనే మూలభావాన్ని పూర్తిగా సాధారణ ‘వ్రతం’గా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర నిషేధానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వివరణాత్మక పాదసూచిక గుర్తును సంబంధిత ‘గింజల మొదలుకొని తొక్క వరకు’ అనే పదబంధం తర్వాత ఉంచాం.
