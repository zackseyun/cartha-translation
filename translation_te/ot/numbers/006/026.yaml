  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: te
  text: యాహ్వే తన ముఖాన్ని నీ వైపు ఎత్తుగాక; నీకు శాంతిని ఇవ్వుగాక[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదమైన ‘షాలోమ్’కు శాంతితో పాటు సంపూర్ణత, క్షేమం, సౌఖ్యం అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: ఎత్తుగాక
  rationale: נשׂא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు’ అనే అర్థం ఉంది. ‘ముఖం’తో కలిసి ఇది అనుకూలమైన దృష్టిని సూచించే నుడికారమైనా, హీబ్రూ రూపకాన్ని నిలుపుకోవడానికి ‘ఎత్తుగాక’ అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిప్యంతరీకరణలో ‘యాహ్వే’గా ఉంచడం మూలపాఠంలోని వ్యక్తిగత నామాన్ని కాపాడుతుంది.
- source_word: פָּנָיו
  choice: తన ముఖాన్ని
  rationale: פנים యొక్క ప్రత్యక్ష అర్థం ‘ముఖం.’ ‘సన్నిధి’ లేదా ‘అనుగ్రహం’ అని భావానువాదం చేయకుండా, దైవానుకూలతను వ్యక్తం చేసే సజీవ రూపకాన్ని నిలిపింది.
- source_word: אֵלֶיךָ
  choice: నీ వైపు
  rationale: אל దిశను సూచిస్తూ ‘వైపు’ అనే అర్థాన్ని ఇస్తుంది. రెండవ పురుష ఏకవచన ప్రత్యయం కారణంగా ‘నీ వైపు’ అని అనువదించబడింది.
- source_word: וְיָשֵׂם
  choice: ఇవ్వుగాక
  rationale: שׂיםకు అక్షరార్థంగా ‘ఉంచు/పెట్టు’ అనే భావం ఉన్నా, ‘నీ కోసం శాంతిని ఉంచు’ అనే హీబ్రూ నిర్మాణాన్ని సహజ తెలుగులో ‘నీకు శాంతిని ఇవ్వు’ అని వ్యక్తం చేయడం సందర్భంలోని ఆశీర్వాద భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: לְ ఉపసర్గ లబ్ధిదారుని సూచిస్తుంది; ఏకవచన సంబోధనను సహజ తెలుగులో ‘నీకు’ అని ఇచ్చింది.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: שָׁלוֹםకు శాంతి, సంపూర్ణ క్షేమం, సౌఖ్యం వంటి విస్తృత భావపరిధి ఉంది. ఆశీర్వాద వాక్యంలో ‘శాంతి’ సహజమైన ప్రధాన అనువాదం; విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం నిబంధన సంబంధమైన వ్యక్తిగత నామాన్ని కాపాడుతుంది.
- issue: ‘తన ముఖాన్ని నీ వైపు ఎత్తు’ అనే మానవరూప నుడికారం
  choice: ముఖానికి సంబంధించిన మూల రూపకాన్ని నిలుపుకోవడం
  alternative: నీపై అనుగ్రహం చూపుగాక / నిన్ను అనుకూలంగా చూడుగాక
  rationale: ఈ నుడికారం దైవానుకూలతను సూచించినప్పటికీ, దాన్ని పూర్తిగా అమూర్త భావంగా మార్చకుండా మూలంలోని సాహిత్య, దైవశాస్త్రీయ చిత్రణను నిలుపుకుంది.
- issue: ఆశీర్వాదంలోని క్రియారూపాల స్వరూపం
  choice: ఎత్తుగాక ... ఇవ్వుగాక
  alternative: ఎత్తుతాడు ... ఇస్తాడు
  rationale: హీబ్రూ సందర్భంలో ఇవి యాజక ఆశీర్వాదాన్ని వ్యక్తం చేసే జస్సివ్ భావంతో ఉన్నాయి. తెలుగు ‘-గాక’ రూపం ప్రార్థనాత్మక ఆశీర్వాద భావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆశీర్వాద శైలి వాడబడింది. ఏకవచన సంబోధనను ‘నీ/నీకు’తో నిలిపి, హీబ్రూ ముఖరూపకాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో కాపాడింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
