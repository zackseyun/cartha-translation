id: NUM.20.10
reference: Numbers 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: te
  text: అప్పుడు మోషే, అహరోనులు సమాజాన్ని బండ ఎదుట సమకూర్చారు. అతడు వారితో, “తిరుగుబాటుదారులారా, ఇప్పుడు వినండి! ఈ బండలోనుంచి మేము మీ కోసం నీళ్లు రప్పించాలా?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: సమకూర్చారు
  rationale: קהל హిఫీల్ రూపంలోని ‘కూడేలా చేయడం/సమకూర్చడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַקָּהָל
  choice: సమాజాన్ని
  rationale: ఇక్కడ కూడిన ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ సాధారణ పాఠకులకు సహజంగా ఉండి, తరువాతి మతసంస్థ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: బండ ఎదుట
  rationale: ‘బండ ముందు/ఎదుట’ అనే స్థానార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అతడు ... అన్నాడు
  rationale: హీబ్రూలో క్రియ ఏకవచనంలో ఉంది. మోషే అని అదనంగా స్పష్టీకరించకుండా మూలరూపాన్ని నిలుపుతుంది.
- source_word: שִׁמְעוּ נָא
  choice: ఇప్పుడు వినండి
  rationale: ఆజ్ఞతో కూడిన తక్షణ శ్రద్ధాపిలుపును తెలియజేస్తుంది; נָאను కేవలం మర్యాదార్థక ‘దయచేసి’గా పరిమితం చేయదు.
- source_word: הַמֹּרִים
  choice: తిరుగుబాటుదారులారా
  rationale: מרה మూలంలోని తిరుగుబాటు/ఎదిరింపు భావాన్ని నేరుగా సంబోధన రూపంలో కాపాడుతుంది.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: ఈ బండలోనుంచి
  rationale: מן సూచించే మూలస్థానాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נוֹצִיא
  choice: మేము ... రప్పించాలా
  rationale: יצא హిఫీల్‌లోని ‘బయటికి వచ్చేలా చేయడం’ అనే కారణార్థాన్ని ప్రశ్నార్థక సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: מָיִם
  choice: నీళ్లు
  rationale: సాధారణ ఆధునిక తెలుగులో సహజమైన బహువచనసదృశ ద్రవ్యనామ రూపం.
theological_decisions:
- issue: మోషే ప్రశ్నలోని ప్రథమ పురుష బహువచనం
  choice: మేము మీ కోసం నీళ్లు రప్పించాలా?
  alternative: దేవుడు మీ కోసం నీళ్లు రప్పించాలా?
  rationale: נוֹצִיא స్పష్టంగా ప్రథమ పురుష బహువచనం. దేవుని క్రియాశీలతను అనువాదంలో చేర్చి ఉద్రిక్తతను పరిష్కరించకుండా, మోషే-అహరోనుల పాత్ర మరియు దేవుని కార్యం మధ్య కథనంలోని తాత్త్విక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. సంబోధనలోని తీవ్రతను, ప్రశ్నలోని అస్పష్టతను నిలిపింది.
