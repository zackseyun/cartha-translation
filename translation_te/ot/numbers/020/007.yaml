lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దేవుడు మాటలాడి తదుపరి వచనంలో ఆదేశం ఇవ్వడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు కథన ప్రయోగం; హీబ్రూ వావ్-క్రమబద్ధ పియేల్ రూపంలోని ప్రసంగారంభ సూత్రాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఇస్తుంది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: హీబ్రూలోని ప్రసంగ దిశను తెలుగులో సహజంగా తెలియజేసే విభక్తి ప్రయోగం.
- source_word: לֵּאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో ప్రత్యక్ష వాక్యం వస్తుందని సూచించే హీబ్రూ ప్రసంగ పరిచయ సూత్రానికి సహజమైన తెలుగు సమానం; ‘చెబుతూ’ అనే కృత్రిమ పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా నిలుపుతుంది. దాని ప్రాచీన ఉచ్చారణ పూర్తిగా నిశ్చితం కానందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రసంగారంభ శైలి. హీబ్రూ నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, తదుపరి వచనానికి దారితీసే సూత్రాన్ని ‘ఇలా అన్నాడు’గా అందించింది.
