id: NUM.20.16
reference: Numbers 20:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: te
  text: మేము యాహ్వేకు మొరపెట్టుకున్నాం. ఆయన మా స్వరం విని, ఒక దూతను[a] పంపి, మమ్మల్ని ఐగుప్తు నుండి బయటకు రప్పించాడు. ఇదిగో, మేము నీ సరిహద్దు అంచున ఉన్న పట్టణమైన కాదేషులో ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక సందేశకుణ్ణి.’ హీబ్రూ పదం మానవ సందేశకుణ్ణి గానీ పరలోక దూతను గానీ సూచించగలదు; ఈ సందర్భంలో చాలామంది దీన్ని దేవుడు పంపిన పరలోక దూతగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: మొరపెట్టుకున్నాం
  rationale: צעק ఆపదలో సహాయం కోసం చేసే తీవ్రమైన మొరను సూచిస్తుంది; ‘మొరపెట్టుకున్నాం’ ఆ అత్యవసర భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా లిప్యంతరీకరించింది.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: ఆయన మా స్వరం విని
  rationale: మూలంలోని ‘మా స్వరం విన్నాడు’ అనే స్పష్టమైన రూపకాన్ని సహజంగా నిలుపుతూ, వారి మొరను దేవుడు ఆలకించాడనే భావాన్ని అందిస్తుంది.
- source_word: מַלְאָךְ
  choice: ఒక దూతను
  rationale: מַלְאָךְ అనే పదం మానవ సందేశకుణ్ణి గానీ పరలోక దూతను గానీ సూచించగలదు. తెలుగు ‘దూత’ కూడా ఆ మూలపదపు విస్తృతిని, సందర్భంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: మమ్మల్ని ఐగుప్తు నుండి బయటకు రప్పించాడు
  rationale: హిఫిల్ రూపంలోని ‘బయటకు తీసుకురావడం’ అనే కారణార్థక భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో, ఇప్పుడు
  rationale: הִנֵּה ప్రస్తుత పరిస్థితిపై శ్రోత దృష్టిని మళ్లించే సంభాషణ సూచకం; ‘ఇదిగో, ఇప్పుడు’ దాని దృష్ట్యాకర్షణ శక్తిని ఆధునిక గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: నీ సరిహద్దు అంచున ఉన్న పట్టణం
  rationale: కాదేషు ఎదోము సరిహద్దు చివరి అంచున ఉందనే స్థల సంబంధాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిర్గమనాన్ని ప్రస్తావించే సందర్భంలో מַלְאָךְ యొక్క గుర్తింపు
  choice: ‘దూత’ అని అనువదించి, అతని ఖచ్చితమైన స్వరూపాన్ని నిర్దేశించకుండా ఉంచడం
  alternative: ‘దేవదూత’ లేదా ‘సందేశకుడు’
  rationale: ఈ వాక్యం యాహ్వే ఒక מַלְאָךְను పంపాడని మాత్రమే చెబుతుంది; అతడు ఎవరో మరింత నిర్దిష్టంగా గుర్తించదు. ‘దూత’ మూలంలోని మానవ లేదా పరలోక సందేశకుడనే అవకాశాలను అనవసరంగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ఇదిగో’ అనే బైబిలీయమైనప్పటికీ సజీవంగా ఉన్న రూపాన్ని దృష్ట్యాకర్షణ సూచకంగా ఉంచింది; వాక్య నిర్మాణాన్ని అతిగా పదానువాదంగా కాకుండా సహజంగా చేసింది.
