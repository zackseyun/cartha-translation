  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קַ֚ח אֶֽת אַהֲרֹ֔ן וְ/אֶת אֶלְעָזָ֖ר בְּנ֑/וֹ וְ/הַ֥עַל אֹתָ֖/ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: te
  text: “అహరోనును, అతని కుమారుడైన ఎలియాజరును తీసుకో; వారిని హోరు కొండపైకి తీసుకువెళ్లు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח
  choice: తీసుకొని
  rationale: לקח క్రియ యొక్క Qal ఆజ్ఞారూపం ఇక్కడ ‘తీసుకో’ అనే అర్థం ఇస్తుంది; తరువాతి ఆజ్ఞతో సహజంగా కలిసేలా ‘తీసుకొని’ అని అనువదించబడింది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం సందర్భానుసారం అహరోనును సూచిస్తుంది; ఎలియాజరు ఎవరో స్పష్టంగా గుర్తిస్తుంది.
- source_word: וְהַעַל
  choice: ఎక్కించు
  rationale: עלה యొక్క Hiphil ఆజ్ఞారూపం ‘పైకి వెళ్లేలా చేయు/పైకి తీసుకెళ్లు’ అనే కారణార్థాన్ని కలిగి ఉంది; కొండ సందర్భంలో ‘ఎక్కించు’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: అహరోను, ఎలియాజరు ఇద్దరినీ సూచించే బహువచన కర్మ సర్వనామం.
- source_word: הֹר הָהָר
  choice: హోరు కొండ
  rationale: అక్షరార్థంగా ‘హోరు, ఆ కొండ’; ఆధునిక తెలుగులో స్థలనామాన్ని సహజంగా తెలిపే రూపం ‘హోరు కొండ’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. మూలంలోని రెండు ఆజ్ఞల క్రమం—ముందు వారిని తీసుకోవడం, తరువాత కొండపైకి ఎక్కించడం—నిలుపబడింది.
