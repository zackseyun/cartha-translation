- from: “అహరోనును, అతని కుమారుడు ఎలియాజరును తీసుకొని, వారిని హోరు కొండపైకి ఎక్కించు.”
  to: “అహరోనును, అతని కుమారుడైన ఎలియాజరును తీసుకో; వారిని హోరు కొండపైకి తీసుకువెళ్లు.”
  rationale: 'The revision preserves the Hebrew sequence and imperative force: Moses is commanded first to take Aaron and Eleazar, then to bring both of them up to Mount Hor. It uses established Telugu biblical names and a natural appositional expression without adding interpretive content. No footnote is needed, since “హోరు కొండ” naturally represents the conventional place name and no unresolved ambiguity is introduced.'
