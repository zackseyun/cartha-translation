  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: te
  text: “ఆ దండాన్ని[a] తీసుకో. నువ్వూ నీ సహోదరుడు అహరోనూ సమాజాన్ని సమకూర్చండి. వారి కళ్ల ఎదుట ఆ బండను ఉద్దేశించి మాట్లాడండి; అప్పుడు అది తన నీటిని ఇస్తుంది. నువ్వు వారి కోసం ఆ బండలోనుంచి నీటిని రప్పించి, సమాజానికీ వారి పశువులకూ తాగించాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చేతికర్రను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: ఆ దండం
  rationale: מַטֶּה అంటే దండం లేదా చేతికర్ర. సందర్భంలో ముందే తెలిసిన ప్రత్యేక దండాన్ని సూచించే నిర్దిష్టతను ‘ఆ’ తెలియజేస్తుంది; ‘దండం’ గౌరవప్రదమైన, సహజమైన తెలుగు పదం.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: עֵדָה ఇశ్రాయేలీయుల సమకూడిన సముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, సమిష్టి భావాన్ని నిలుపుతుంది.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: ఆ బండతో మాట్లాడండి
  rationale: דבר אל అనే ప్రయోగానికి నేరమైన అర్థం ‘తో మాట్లాడు.’ క్రియ బహువచనంలో ఉండటం వల్ల మోషే, అహరోను ఇద్దరినీ ఉద్దేశించిన ‘మాట్లాడండి’ను వాడాం.
- source_word: לְעֵינֵיהֶם
  choice: వారి కళ్ల ఎదుట
  rationale: హీబ్రూ నుడికారంలోని దృశ్యమైన, బహిరంగ సాక్ష్య భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְנָתַן מֵימָיו
  choice: అప్పుడు అది తన నీటిని ఇస్తుంది
  rationale: ఏకవచన క్రియకు బండే కర్త. ‘తన నీటిని’ అనేది హీబ్రూలోని స్వామ్య ప్రత్యయాన్ని కాపాడుతుంది; ‘అప్పుడు’ ఆజ్ఞకు అనుసరించే ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: నువ్వు వారి కోసం ఆ బండలోనుంచి నీటిని రప్పించి
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటికి వచ్చేలా చేయు’ అనే causative భావాన్ని ‘రప్పించి’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהִשְׁקִיתָ
  choice: తాగించాలి
  rationale: שקה హిఫీల్ రూపంలోని ‘తాగేలా చేయు/తాగడానికి ఇవ్వు’ అనే causative అర్థాన్ని ‘తాగించాలి’ సరిగ్గా అందిస్తుంది.
- source_word: בְּעִירָם
  choice: వారి పశువులు
  rationale: בְּעִיר గృహపాలిత జంతువులు లేదా భారవాహక జంతువులను విస్తృతంగా సూచిస్తుంది. ‘పశువులు’ సాధారణ ఆధునిక తెలుగులో తగిన విస్తృత పదం.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: నువ్వూ నీ సహోదరుడు అహరోనూ
  rationale: ఇద్దరు నాయకులను స్పష్టంగా గుర్తించే హీబ్రూ పదక్రమ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అద్భుతానికి సంబంధించిన ఆజ్ఞ యొక్క బహిరంగ స్వభావం
  choice: ‘వారి కళ్ల ఎదుట’ అని స్పష్టంగా అనువదించడం
  alternative: ‘వారి ఎదుట’ లేదా ‘వారు చూస్తుండగా’
  rationale: לְעֵינֵיהֶם అనే హీబ్రూ నుడికారం ప్రజల కళ్లముందు జరిగే బహిరంగ చర్యను నొక్కిచెబుతుంది. తరువాతి కథనంలో మోషే వైఫల్యాన్ని అర్థం చేసుకోవడానికి ఈ అంశం ప్రాముఖ్యమైనది.
- issue: బండకు చెప్పవలసిన ఆజ్ఞలో కర్తల సంఖ్య
  choice: మోషే, అహరోను ఇద్దరినీ చేర్చే బహువచనం ‘మాట్లాడండి’
  alternative: మోషే ఒక్కడినే ఉద్దేశించినట్లుగా ‘మాట్లాడు’
  rationale: וְדִבַּרְתֶּם రెండవ పురుష బహువచన క్రియ. కాబట్టి వ్యాకరణపరంగా ఉన్న సమిష్టి బాధ్యతను ఏకవచనంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ప్రత్యక్ష సంభాషణలో ‘నువ్వు’ అనే ఏకవచన సంబోధనను, మోషే-అహరోను ఇద్దరికీ వర్తించే చోట బహువచన క్రియను నిలిపాం. మూలంలోని బహిరంగ దృశ్య భావం, బండే నీటిని ఇచ్చే కర్తగా ఉన్న నిర్మాణం, ‘తన నీరు’ అనే స్వామ్య భావం అన్నీ సంరక్షించబడ్డాయి.
