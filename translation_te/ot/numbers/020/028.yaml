id: NUM.20.28
reference: Numbers 20:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: te
  text: అప్పుడు మోషే అహరోను వస్త్రాలను తీసివేసి, వాటిని అహరోను కుమారుడైన ఎలియాజరుకు తొడిగించాడు[a]. అహరోను అక్కడ పర్వత శిఖరంపై మరణించాడు[b]. తరువాత మోషే, ఎలియాజరు పర్వతం మీద నుంచి దిగివచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చుట్టుపక్కల సందర్భం ప్రకారం, అహరోను అధికారిక యాజక వస్త్రాలను ఎలియాజరుకు తొడిగించడం యాజక బాధ్యత అతనికి బదిలీ కావడాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘పర్వతం పైభాగంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: వస్త్రాలను తీసివేసి
  rationale: హిఫిల్ రూపంలో ఈ క్రియ ఒకరి మీద ఉన్న దుస్తులను తొలగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తీసివేసి’ సహజంగా ఉండి, చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּגָדָיו
  choice: అహరోను వస్త్రాలను
  rationale: בגד అనేది సాధారణంగా వస్త్రాలు లేదా దుస్తులు అనే అర్థమిచ్చే పదం. సందర్భంలో ఇవి యాజక వస్త్రాలైనా, మూలపాఠం ఈ వాక్యంలో ప్రత్యేక పదాన్ని వాడనందున ‘వస్త్రాలు’ అని ఉంచాం.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: వాటిని అతని కుమారుడైన ఎలియాజరుకు తొడిగించాడు
  rationale: לבש హిఫిల్ రూపం మరొకరికి దుస్తులు తొడిగించడాన్ని సూచిస్తుంది. ‘వాటిని ... తొడిగించాడు’ అనేది వస్త్రాల బదిలీని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּמָת
  choice: మరణించాడు
  rationale: מות సాధారణంగా ‘చనిపోవడం/మరణించడం’ అనే అర్థం. గౌరవప్రదమైన ఆధునిక లిఖిత తెలుగుకు ‘మరణించాడు’ సరిపోతుంది; భావాన్ని మృదూకరించే పర్యాయాన్ని వాడలేదు.
- source_word: שָׁם
  choice: అక్కడ
  rationale: అహరోను మరణించిన స్థలాన్ని సూచించే అవ్యయాన్ని మూలపాఠం ప్రకారం స్పష్టంగా నిలిపాం.
- source_word: בְּרֹאשׁ הָהָר
  choice: పర్వత శిఖరం మీద
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’ అయినా, పర్వతానికి సంబంధించి ‘పైభాగం/శిఖరం’ అనే భావం ఇస్తుంది. ‘శిఖరం మీద’ స్థలసంబంధ చిత్రాన్ని సహజంగా కాపాడుతుంది.
- source_word: וַיֵּרֶד
  choice: దిగివచ్చారు
  rationale: ירד అంటే దిగడం. కథనం పర్వతం నుంచి తిరిగి రావడాన్ని తెలియజేస్తున్నందున ‘దిగివచ్చారు’ సహజమైన తెలుగు కథన రూపం.
- source_word: מִן הָהָר
  choice: పర్వతం మీద నుంచి
  rationale: מִן విడిపోవడం లేదా బయలుదేరిన స్థానాన్ని సూచిస్తుంది. తెలుగులో ‘పర్వతం మీద నుంచి’ అనేది కదలిక ప్రారంభమైన స్థానాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: ఎలియాజరుకు బదిలీ చేసిన అహరోను వస్త్రాల స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘వస్త్రాలు’ అని అనువదించడం
  alternative: ‘యాజక వస్త్రాలు’ లేదా ‘ప్రధాన యాజక వస్త్రాలు’ అని స్పష్టీకరించడం
  rationale: చుట్టుపక్కల సందర్భం ఇవి అహరోను అధికారిక యాజక వస్త్రాలని తెలియజేస్తుంది. అయితే ఈ వచనంలోని హెబ్రీ పదం సాధారణంగా ‘వస్త్రాలు’ అనే అర్థమే ఇస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో అదనపు విశేషణం చేర్చకుండా, వారసత్వ సందర్భాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలపాఠంలోని వరుస చర్యలను స్పష్టంగా ఉంచుతూ, సందర్భం సూచించే యాజక వారసత్వ భావాన్ని ప్రధాన పాఠ్యంలో అతిగా విస్తరించలేదు.
