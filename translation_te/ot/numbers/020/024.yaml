id: NUM.20.24
reference: Numbers 20:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: te
  text: అహరోను తన ప్రజలలో చేర్చబడతాడు[a]; ఎందుకంటే నేను ఇశ్రాయేలు కుమారులకు ఇచ్చిన దేశంలోకి అతడు ప్రవేశించడు, ఎందుకంటే మెరీబా జలాల దగ్గర మీరు నా ఆజ్ఞకు తిరుగుబాటు చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన ప్రజలలో చేర్చబడతాడు’ అనేది మరణించి తనవారితో చేరడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా నోటికి తిరుగుబాటు చేశారు’; అంటే నేను పలికిన ఆజ్ఞను ధిక్కరించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: చేర్చబడతాడు
  rationale: మరణ సందర్భంలో నిఫాల్ రూపం తనవారి దగ్గరకు మరణంలో చేర్చబడడాన్ని సూచించే హీబ్రూ నుడికారాన్ని నిలుపుతుంది; కేవలం ‘చనిపోతాడు’ అని సరళీకరించదు.
- source_word: אֶל עַמָּיו
  choice: తన ప్రజల దగ్గరకు
  rationale: ‘తన ప్రజల వద్దకు’ అనే మూలభావాన్ని సహజమైన తెలుగులో ఇస్తూ, పూర్వీకులకే పరిమితం చేసే వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: יָבֹא אֶל הָאָרֶץ
  choice: దేశంలోకి ప్రవేశించడు
  rationale: చలన క్రియతో కూడిన భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: వాగ్దాన దేశ సందర్భాన్ని అదనపు పదం చేర్చకుండా మూలంలోని సాధారణ నిర్దిష్ట పదంతోనే నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַתִּי
  choice: నేను ... ఇచ్చిన
  rationale: దేవుడు ఇప్పటికే నిశ్చయంగా ప్రసాదించిన దానిగా హీబ్రూ పరిపూర్ణ క్రియను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: సూత్రబద్ధమైన హీబ్రూ జాతీయ వాచకంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: מְרִיתֶם
  choice: మీరు ... తిరుగుబాటు చేశారు
  rationale: మరా అనే క్రియలోని అధికారాన్ని ధిక్కరించే నైతిక తీవ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת־פִּי
  choice: నా ఆజ్ఞకు
  rationale: అక్షరార్థంగా ‘నా నోటికి’; ఇక్కడ దేవుడు పలికిన ఆజ్ఞను సూచించే నుడికారాన్ని సహజ తెలుగులో అర్థస్పష్టంగా అందిస్తుంది.
- source_word: לְמֵי מְרִיבָה
  choice: మెరీబా నీళ్ల దగ్గర
  rationale: సంఘటన/స్థల నామాన్ని అనువదించకుండా ఉంచి, అది జరిగిన ప్రదేశాన్ని సహజ తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: ‘తన ప్రజల దగ్గరకు చేర్చబడటం’ అనే మరణ నుడికారం
  choice: నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘అహరోను చనిపోతాడు’ అని మాత్రమే అనువదించడం
  rationale: ఈ వ్యక్తీకరణ కేవలం శారీరక మరణ ప్రకటనకన్నా తనవారితో పూర్వీక సంబంధాన్ని సూచిస్తుంది; అయితే పరలోక స్థితి గురించి ప్రత్యేక సిద్ధాంతాన్ని జోడించదు.
- issue: בְּנֵי יִשְׂרָאֵל లింగరూపం
  choice: ‘ఇశ్రాయేలు కుమారులు’ అని ఉంచడం
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’
  rationale: మూలంలోని సూత్రబద్ధమైన పుంలింగ రూపాన్ని నిలుపుతూ, అది జాతి మొత్తాన్ని సూచిస్తుందని పాదసూచికలో స్పష్టం చేస్తుంది.
- issue: మోషే, అహరోనుల సంయుక్త బాధ్యత
  choice: ‘మీరు’ అనే బహువచనాన్ని నిలుపడం
  alternative: అహరోనును మాత్రమే ఉద్దేశించిన ఏకవచనంగా మార్చడం
  rationale: మూలంలోని מְרִיתֶם బహువచనం ఇద్దరిపైనా ఆరోపణను ఉంచుతుంది; దానిని ఏకవచనంగా మార్చడం తీర్పు పరిధిని సంకుచితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. హీబ్రూ మరణ నుడికారాన్ని నిలిపి, ‘నా నోరు’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘నా ఆజ్ఞ’గా ఇచ్చాం. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోతాయి.
