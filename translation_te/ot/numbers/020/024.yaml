  source_fidelity: 'సవరించిన పాఠ్యం హీబ్రూ వాక్యంలోని రెండు కారణసంబంధాలను స్పష్టంగా నిలుపుతుంది: అహరోను దేశంలో ప్రవేశించనందువల్ల తన ప్రజలలో చేర్చబడతాడు; ఆ ప్రవేశనిరాకరణకు కారణం మెరీబా జలాల వద్ద మోషే, అహరోనులు దేవుని ఆజ్ఞకు తిరుగుబాటు చేయడమే. బహువచనమైన ‘మీరు’ యథాతథంగా ఉంది.'
  naturalness: ‘తన ప్రజల దగ్గరకు చేర్చబడతాడు’ కంటే ‘తన ప్రజలలో చేర్చబడతాడు’ మరింత సహజంగా, అలాగే హీబ్రూ మరణనుడికారానికి సన్నిహితంగా ఉంటుంది. అసలు ముసాయిదాలోని సెమీకోలన్ కారణసంబంధాన్ని కొంత అస్పష్టంగా చేసింది; దానిని స్పష్టమైన ‘ఎందుకంటే’తో సరిచేశాం.
