id: NUM.20.11
reference: Numbers 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: te
  text: అప్పుడు మోషే తన చెయ్యి ఎత్తి తన దండంతో ఆ బండను రెండుసార్లు కొట్టాడు. పుష్కలంగా నీరు వెలువడింది; సమాజమూ వారి పశువులూ తాగాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם ... אֶת־יָדוֹ
  choice: తన చెయ్యి ఎత్తి
  rationale: רוּם హిఫిల్ రూపం ‘ఎత్తడం’ అనే ప్రత్యక్ష శారీరక చర్యను సూచిస్తుంది. ‘చెయ్యి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיַּךְ
  choice: కొట్టాడు
  rationale: נכה ఇక్కడ బండపై దెబ్బకొట్టడాన్ని సూచిస్తుంది. ‘కొట్టాడు’ స్పష్టమైన, సహజమైన కథన పదం.
- source_word: הַסֶּלַע
  choice: ఆ బండను
  rationale: סֶלַע పెద్ద బండ లేదా శిలను సూచిస్తుంది. ముందే ప్రస్తావించబడిన నిర్దిష్ట బండ కావడంతో ‘ఆ బండ’ సందర్భానుగుణం.
- source_word: בְּמַטֵּהוּ
  choice: తన కర్రతో
  rationale: מַטֶּה చేతిలో పట్టుకునే కర్ర లేదా దండను సూచిస్తుంది. ‘కర్ర’ సాధారణ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: פַּעֲמָיִם
  choice: రెండుసార్లు
  rationale: ద్వివచన రూపంలోని క్రియావిశేషణ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: విస్తారంగా నీళ్లు బయటికి వచ్చాయి
  rationale: מַיִם רַבִּים నీటి అధిక పరిమాణాన్ని తెలియజేస్తుంది. ఈ రూపం నీరు సమృద్ధిగా వెలువడిన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: עֵדָה ఇశ్రాయేలు ప్రజల సమూహాన్ని సూచించే సమష్టి నామవాచకం. ‘సమాజం’ ప్రస్తుత తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וּבְעִירָם
  choice: వారి పశువులు
  rationale: בְּעִיר సాధారణంగా పెంపుడు జంతువులు లేదా పశుసంపదను విస్తృతంగా సూచిస్తుంది; ‘పశువులు’ దీనిని ‘పశువులలో ఒక జాతి’ అనే సంకుచిత భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: మోషే బండను రెండుసార్లు కొట్టిన చర్యను ఎలా వర్ణించాలి
  choice: చర్యను ‘తన కర్రతో ఆ బండను రెండుసార్లు కొట్టాడు’ అని ఎటువంటి వివరణాత్మక తీర్పు జోడించకుండా వర్ణించడం
  alternative: ఈ వాక్యంలోనే మోషే అవిధేయతను లేదా దాని ఆధ్యాత్మిక అర్థాన్ని స్పష్టంగా జోడించడం
  rationale: విస్తృత సందర్భంలో మోషే చర్య సమస్యాత్మకమైనదిగా వెల్లడైనా, ఈ వాక్యం చర్యను మరియు దాని ఫలితాన్ని కథన రూపంలో మాత్రమే తెలియజేస్తుంది. మూలపాఠంలో లేని వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. హీబ్రూ పరంపరలోని వరుస సంఘటనలను తెలుగులో సహజమైన వాక్య విభజనతో అందించాం. పాదసూచికలు అవసరం లేదు.
