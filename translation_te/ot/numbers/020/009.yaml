id: NUM.20.9
reference: Numbers 20:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: te
  text: మోషే యాహ్వే సన్నిధి నుండి ఆ దండాన్ని[a] తీసుకున్నాడు, యాహ్వే తనకు ఆజ్ఞాపించినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చేతికర్రను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే క్రియ యొక్క సాధారణ కథనార్థం ‘తీసుకున్నాడు’; మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామం מֹשֶׁה కు ప్రామాణిక తెలుగు రూపం.
- source_word: הַמַּטֶּה
  choice: ఆ దండాన్ని
  rationale: מַטֶּה ఇక్కడ భౌతిక దండాన్ని సూచిస్తుంది. ముందే తెలిసిన నిర్దిష్ట వస్తువును సూచించే హీబ్రూ నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’ సహజంగా తెలియజేస్తుంది.
- source_word: מִלִּפְנֵי
  choice: ఆయన సన్నిధి నుండి
  rationale: మూలంలోని స్థలసంబంధమైన ‘యెహోవా ఎదుట నుండి’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచుతుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר తెలిపే అనురూపతను ‘తనకు ఆజ్ఞాపించినట్లే’ సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: צִוָּהוּ
  choice: తనకు ఆజ్ఞాపించిన
  rationale: పురుష ఏకవచన కర్త మరియు కర్మను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ఆ ఆజ్ఞ ఈ చర్యకు ముందే ఇవ్వబడిందని సందర్భం తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది; అందువల్ల ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తించదగిన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కథనశైలి, గౌరవప్రదమైన దైవసూచన వాడబడింది. ‘కాబట్టి’ ముందు ఆజ్ఞకు ఈ చర్యను అనుసంధానిస్తుంది; ‘ఆయన సన్నిధి నుండి’ ఆరాధనా స్థల సందర్భాన్ని సహజంగా నిలుపుతుంది.
