translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో మర్యాదపూర్వక విన్నపం, స్పష్టమైన ప్రయాణ హామీలు, గౌరవప్రదమైన వచనశైలి ఉపయోగించబడ్డాయి. సంబోధనలో మూలంలోని ఏకవచన ద్వితీయ పురుషాన్ని ‘నీ’ రూపంతో నిలుపుకున్నాం.
