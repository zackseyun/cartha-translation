source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: te
  text: దయచేసి మమ్మల్ని నీ దేశం గుండా వెళ్లనివ్వు. మేము పొలాల గుండా గానీ ద్రాక్షతోటల గుండా గానీ వెళ్లము; బావి నీళ్లు తాగము. మేము రాజమార్గంలో వెళ్తాము[a]. నీ సరిహద్దును దాటి వెళ్లే వరకు కుడికైనా ఎడమకైనా తిరగము[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజు మార్గం.” ఇది రాజమార్గం లేదా ప్రధాన రహదారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో “నీ సరిహద్దు”; సందర్భంలో భావం: నీ భూభాగపు అవతలి హద్దును దాటి వెళ్లే వరకు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא בְאַרְצֶךָ
  choice: దయచేసి మమ్మల్ని నీ దేశం గుండా వెళ్లనివ్వు
  rationale: కోహోర్టేటివ్ రూపంతో కూడిన נָא మర్యాదపూర్వక విన్నపాన్ని వ్యక్తం చేస్తుంది; עבר + ב ఇక్కడ ఒక ప్రాంతం గుండా ప్రయాణించడాన్ని సూచిస్తుంది.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: మేము పొలాల గుండా గానీ ద్రాక్షతోటల గుండా గానీ వెళ్లము
  rationale: ఏ సాగుభూమిలోకీ లేదా ద్రాక్షతోటలోకీ దారి మళ్లించబోమనే భావాన్ని సహజమైన తెలుగు జంట నిర్మాణంతో తెలియజేస్తుంది.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: బావి నీళ్లు తాగము
  rationale: మూలంలోని ‘బావి నీళ్లు’ అనే సరళ భావాన్ని ఆధునిక, సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: דֶּרֶךְ הַמֶּלֶךְ נֵלֵךְ
  choice: మేము రాజమార్గంలోనే వెళ్తాము
  rationale: దֶּרֶךְ הַמֶּלֶךְ అక్షరార్థంగా ‘రాజు మార్గం’; సందర్భంలో గుర్తింపబడిన ప్రధాన మార్గాన్ని సూచిస్తుంది. ‘నే’ మార్గం విడవబోమనే వాగ్దానాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: కుడికైనా ఎడమకైనా తిరగము
  rationale: నిర్దేశిత మార్గం నుంచి పక్కకు తొలగకపోవడాన్ని సూచించే హెబ్రీ దిశాజంటను సహజ తెలుగులో నిలుపుతుంది.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: నీ సరిహద్దును దాటే వరకు
  rationale: גְּבוּל ‘సరిహద్దు’ లేదా ‘ప్రాంతం’ అని అర్థమవుతుంది; ఇక్కడ ఎదోము భూభాగపు అవతలి హద్దును దాటి వెళ్లే భావాన్ని ‘సరిహద్దును దాటే వరకు’ స్పష్టంగా అందిస్తుంది.
