- from: అహరోను వస్త్రాలను అతని మీద నుంచి తీసివేసి, వాటిని అతని కుమారుడైన ఎలియాజరుకు తొడిగించు.[a] అప్పుడు అహరోను చేర్చబడతాడు[b]; అక్కడే చనిపోతాడు.
