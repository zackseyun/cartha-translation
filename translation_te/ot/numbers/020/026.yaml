source:
  edition: WLC
  text: וְ/הַפְשֵׁ֤ט אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/הִלְבַּשְׁתָּ֖/ם אֶת אֶלְעָזָ֣ר בְּנ֑/וֹ וְ/אַהֲרֹ֥ן יֵאָסֵ֖ף וּ/מֵ֥ת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: te
  text: అహరోను మీదనున్న వస్త్రాలను తీసివేసి, వాటిని అతని కుమారుడైన ఎలియాజరుకు తొడిగించు.[a] అప్పుడు అహరోను చేర్చబడతాడు[b]; అక్కడే చనిపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “అతని యాజక వస్త్రాలను.” హెబ్రీలో కేవలం “అతని వస్త్రాలను” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “చేర్చబడతాడు” అనేది మరణాన్ని సూచించే హెబ్రీ నుడికారం. ఇతర చోట్ల దీని విస్తృత రూపం “తన ప్రజలతో చేర్చబడతాడు” అని కనిపిస్తుంది; ఈ వచనంలో ఆ విస్తృత పదబంధం లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: అహరోను వస్త్రాలను అతని మీద నుంచి తీసివేసి
  rationale: פשט హిఫిల్ ఆజ్ఞారూపం ఇక్కడ ఒకరి మీద ఉన్న వస్త్రాలను తీసివేయించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘అతని మీద నుంచి తీసివేసి’ అని ఇచ్చాం.
- source_word: בְּגָדָיו
  choice: అహరోను వస్త్రాలను
  rationale: בגד సాధారణంగా ‘వస్త్రం’ అని అర్థం. సందర్భంలో ఇవి యాజక వస్త్రాలే అయినా, మూలపదంలో ‘యాజక’ అనే విశేషణం లేదు; అందువల్ల దానిని పాదసూచికలో తెలిపాం.
- source_word: וְהִלְבַּשְׁתָּם
  choice: వాటిని ... తొడిగించు
  rationale: హిఫిల్ రూపం వస్త్రాలను మరొకరికి ధరింపజేయాలనే ఆజ్ఞను తెలియజేస్తుంది. ‘వాటిని’ అనే పదం హెబ్రీలోని బహువచన సర్వనామ ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: אֶת־אֶלְעָזָר בְּנוֹ
  choice: అతని కుమారుడైన ఎలియాజరుకు
  rationale: సహజమైన తెలుగు పదక్రమంలో బంధుత్వ సంబంధాన్నీ వ్యక్తిపేరునూ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יֵאָסֵף
  choice: చేర్చబడతాడు
  rationale: మరణ సందర్భాల్లో אסף నిఫల్ ఒక స్థిరమైన హెబ్రీ నుడికారంగా వాడబడుతుంది. ఈ వచనంలో ‘తన ప్రజల దగ్గరకు’ అనే మాటలు లేనందున వాటిని ప్రధాన పాఠ్యంలో చేర్చకుండా, నుడికారాన్ని నిలిపాం.
- source_word: וּמֵת שָׁם
  choice: అక్కడే చనిపోతాడు
  rationale: ముందున్న భవిష్యత్ భావాన్ని కొనసాగిస్తూ, మరణం జరిగే స్థలాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יֵאָסֵף అనే మరణ నుడికారం
  choice: ‘చేర్చబడతాడు’ అని నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలపడం
  alternative: ‘తన ప్రజల దగ్గరకు చేర్చబడతాడు’ లేదా కేవలం ‘చనిపోతాడు’
  rationale: ఈ వచనంలోని హెబ్రీ పాఠ్యంలో ‘తన ప్రజల దగ్గరకు’ అనే విస్తృత పదబంధం లేదు. దాన్ని చేర్చడం ఇతర సమాంతర ప్రయోగాల నుంచి మాటలను దిగుమతి చేసినట్లవుతుంది; కేవలం ‘చనిపోతాడు’ అనడం నుడికారంలోని సాహిత్య, దైవశాస్త్ర సూక్ష్మతను చెరిపేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్తతను, మరణ నుడికారంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం; సందర్భ సమాచారాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా విస్తరించలేదు.
