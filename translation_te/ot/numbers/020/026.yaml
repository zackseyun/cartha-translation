review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two actions of removing Aaron’s garments and clothing Eleazar with them. It also properly avoids adding “to his people” to the main text, since that complement is absent from the Hebrew of this verse. The death idiom and “there” are retained.
  naturalness: “అతని మీద నుంచి తీసివేసి” is somewhat cumbersome after “అహరోను వస్త్రాలను.” “అహరోను మీదనున్న వస్త్రాలను తీసివేసి” is clearer and idiomatic. The passive “చేర్చబడతాడు” is necessarily elliptical, as is the Hebrew idiom; the explanatory footnote adequately supplies the needed context.
  terminology: “వస్త్రాలు,” “తొడిగించు,” and the established biblical forms “అహరోను” and “ఎలియాజరు” suit modern standard Telugu and the formal narrative register. The footnote should state that the fuller Hebrew expression is “his people,” not “his people near/with,” to avoid an unnecessary spatial nuance.
  issues:
  - severity: low
    issue: The opening phrase is mildly awkward.
    rationale: “అహరోను వస్త్రాలను అతని మీద నుంచి తీసివేసి” repeats referential information in an unnatural order. “అహరోను మీదనున్న వస్త్రాలను తీసివేసి” directly expresses removal from Aaron.
  - severity: low
    issue: Footnote b’s fuller expression is phrased less precisely than needed.
    rationale: “తన ప్రజల దగ్గరకు” adds a locative sense. The conventional fuller Hebrew phrase is more directly represented by “తన ప్రజలతో/తన ప్రజలలో చేర్చబడతాడు”; the note should also clarify that this fuller wording is not present in this verse.
  revised_text: అహరోను మీదనున్న వస్త్రాలను తీసివేసి, వాటిని అతని కుమారుడైన ఎలియాజరుకు తొడిగించు.[a] అప్పుడు అహరోను చేర్చబడతాడు[b]; అక్కడే చనిపోతాడు.
