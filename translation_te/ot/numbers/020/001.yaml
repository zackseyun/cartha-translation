  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: te
  text: మొదటి నెలలో ఇశ్రాయేలీయులు[a]—సమాజమంతా[b]—సీను అరణ్యంలోకి వచ్చారు. ప్రజలు కాదేషులో బస చేశారు. మిర్యాము అక్కడ చనిపోయింది; అక్కడే సమాధి చేయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ‘ఇశ్రాయేలు సంతానం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సమాజమంతా’ అనే మాట ఇశ్రాయేలీయులందరినీ ఒకటిగా కూడిన సమాజంగా సూచిస్తుంది; ‘సమూహమంతా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఆధునిక తెలుగులో మొత్తం జనసమూహాన్ని సహజంగా సూచించేందుకు ‘ఇశ్రాయేలీయులు’ అని అనువదించి, మూలంలోని కుటుంబపరమైన నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇక్కడ కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; כָּל లోని సమగ్రతను ‘అంతా’ తెలియజేస్తుంది. డాష్‌లతో ఇది ముందున్న ‘ఇశ్రాయేలీయులు’కు సమానార్థక వివరణగా ఉన్న నిర్మాణాన్ని నిలిపాం.
- source_word: מִדְבַּר צִן
  choice: సీను అరణ్యం
  rationale: מִדְבָּר అనేది జనావాసం తక్కువగా ఉన్న అరణ్యప్రాంతాన్ని సూచిస్తుంది. తెలుగు బైబిలు భౌగోళిక నామరూపానికి అనుగుణంగా צִן ను ‘సీను’గా లిప్యంతరీకరించాం.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: హీబ్రూ వాక్యం నెల పేరును ఇవ్వకుండా ‘మొదటి నెల’ అని మాత్రమే చెబుతుంది; ఆ అనిర్దిష్టతను అలాగే ఉంచాం.
- source_word: וַיֵּשֶׁב
  choice: బస చేశారు
  rationale: కాదేషులో ప్రజలు కొంతకాలం ఉండడాన్ని తెలుపుతుంది. ‘స్థిరపడ్డారు’ అనేది శాశ్వత నివాస భావాన్ని ఎక్కువగా కలిగించవచ్చు; ‘బస చేశారు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בְּקָדֵשׁ
  choice: కాదేషులో
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించి, అక్కడ ఉండడాన్ని సహజమైన విభక్తితో తెలిపాం.
- source_word: מִרְיָם
  choice: మిర్యాము
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు రూపంలో ఇచ్చాం.
- source_word: וַתָּמָת
  choice: చనిపోయి
  rationale: מות అనే క్రియలోని సూటి అర్థాన్ని మృదూకరించకుండా తెలిపాం; తరువాతి సమాపక క్రియతో సహజ తెలుగు వాక్యంగా అనుసంధానించాం.
- source_word: וַתִּקָּבֵר
  choice: సమాధి చేయబడింది
  rationale: హీబ్రూ క్రియలోని కర్మణి రూపాన్ని నిలిపి, సమాధి చేసినవారు ఎవరనే విషయాన్ని మూలంలో లేనట్లే అనిర్దిష్టంగా ఉంచాం.
- source_word: שָׁם ... שָׁם
  choice: అక్కడ ... అక్కడే
  rationale: మిర్యాము మరణం, సమాధి రెండూ అదే చోట జరిగినట్లు హీబ్రూలో ఉన్న పునరుక్తిని తెలుగులో సహజంగా నిలిపాం.
