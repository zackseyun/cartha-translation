  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సమానార్థక నిర్మాణాన్ని డాష్‌లతో చూపించి, ‘అక్కడ ... అక్కడే’ అనే పునరుక్తిని నిలిపాం.
