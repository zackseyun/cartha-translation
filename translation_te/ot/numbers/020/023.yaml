source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: te
  text: 'ఎదోము దేశ సరిహద్దులోని హోరు కొండపై యాహ్వే[a] మోషేతోను అహరోనుతోను ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: YHWH.'
    reason: దైవనామపు హీబ్రూ వ్యంజనరూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמר అనే క్రియకు ప్రాథమిక అర్థం ‘అను/చెప్పు’. తరువాతి వచనంలో ప్రత్యక్ష వాక్యం వస్తున్నందున ఆధునిక తెలుగు కథనంలో ‘ఇలా అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచాం; మూలంలోని వ్యక్తిగత నామాన్ని ఇది కాపాడుతుంది.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: మూలంలో ఇద్దరు సంబోధితుల ముందు אֶל పునరుక్తమైంది. తెలుగులో ‘మోషేతో, అహరోనుతో’ అని చెప్పడం ఆ ఇద్దరికీ మాట చెప్పబడిందనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּהֹר הָהָר
  choice: హోరు కొండ దగ్గర
  rationale: בְּ ఇక్కడ స్థలసూచకం; הֹר הָהָר అనేది హోరు అనే కొండను సూచిస్తుంది. ‘దగ్గర’ అనేది ‘వద్ద/సమీపంలో’ అనే స్థలార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: ఎదోము దేశపు సరిహద్దులో ఉన్న
  rationale: עַל גְּבוּל అనే పదబంధం ‘సరిహద్దు వద్ద/మీద’ అనే భావాన్ని ఇస్తుంది. తెలుగులో కొండ స్థానాన్ని స్పష్టంగా అనుసంధానించడానికి ‘సరిహద్దులో ఉన్న’ అని నిర్మించాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రపదం. తెలుగులో ‘ఇలా అన్నాడు’ అదే వాక్యప్రారంభ కార్యాన్ని సహజంగా నిర్వహిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని నాలుగు అక్షరాల దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచాం. దాని ప్రాచీన ఉచ్చారణ ఖచ్చితంగా తెలియనందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, స్థలవివరాన్ని ముందుకు తెచ్చి తెలుగు సహజ ప్రవాహాన్ని కాపాడాం.
