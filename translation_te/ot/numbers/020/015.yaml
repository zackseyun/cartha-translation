translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బైబిలు శైలి ఉపయోగించబడింది. ‘పితరులు’ మూలంలోని కుటుంబ-చారిత్రక పదాన్ని నిలుపుతుంది; సాధారణ పాఠకుల కోసం ‘పూర్వీకులు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చబడింది. హీబ్రూ వాక్యంలోని మూడు సమన్విత భాగాలు తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించబడ్డాయి.
