  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: te
  text: మా పితరులు[a] ఐగుప్తుకు దిగివెళ్లారు; మేము ఐగుప్తులో చాలా కాలం[b] నివసించాము. ఐగుప్తీయులు మాతోను మా పితరులతోను చెడుగా ప్రవర్తించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మా పూర్వీకులు’; హీబ్రూలో అక్షరార్థం ‘మా తండ్రులు.’ ఇదే ప్రత్యామ్నాయం ఈ వాక్యంలో రెండోసారి వచ్చే ‘మా పితరులు’కూ వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థం ‘అనేక దినాలు’; ఇది దీర్ఘకాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మమ్మల్నీ మా పితరులనూ బాధించారు,’ లేదా ‘మాకు, మా పితరులకు కీడు చేశారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: దిగివెళ్లారు
  rationale: ירד అనే క్రియలోని ‘దిగిపోవడం’ అనే భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲבֹתֵינוּ
  choice: మా పితరులు
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘మా తండ్రులు’; ఇక్కడ పూర్వీకులను సూచించే చారిత్రక భావాన్ని ‘పితరులు’ గౌరవప్రదంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: מִצְרַיְמָה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే హీబ్రూ రూపాన్ని సహజమైన గమ్యార్థక తెలుగులో తెలియజేస్తుంది.
- source_word: וַנֵּשֶׁב
  choice: నివసించాము
  rationale: ישב ఇక్కడ ఉండడం లేదా నివసించడం అనే అర్థంలో ఉంది; ‘నివసించాము’ ఆధునికమైనదీ గౌరవప్రదమైనదీ.
- source_word: יָמִים רַבִּים
  choice: చాలా కాలం
  rationale: అక్షరార్థంగా ‘అనేక దినాలు’; సందర్భంలో ఇది దీర్ఘకాలాన్ని సూచించే నుడికారం. ‘చాలా కాలం’ తెలుగులో సహజంగా అదే భావాన్ని ఇస్తుంది, సంవత్సరాల సంఖ్యను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיָּרֵעוּ
  choice: చెడుగా చూశారు
  rationale: רעע హిఫిల్ రూపం హాని చేయడం లేదా చెడుగా ప్రవర్తించడం అనే విస్తృత ప్రతికూల భావాన్ని కలిగి ఉంది. ‘చెడుగా చూశారు’ సహజమైన తెలుగు ప్రయోగం; ‘హింసించారు’ వంటి మరింత సంకుచిత అర్థాన్ని బలవంతంగా చేర్చదు.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: రూపం ‘ఐగుప్తు’ అయినప్పటికీ క్రియ బహువచనంలో ఉంది; కాబట్టి ఇక్కడ దేశ ప్రజలే కర్తలు. తెలుగులో ‘ఐగుప్తీయులు’ అని స్పష్టీకరించడం సహజం.
- source_word: לָנוּ ... וְלַאֲבֹתֵינוּ
  choice: మమ్మల్నీ మా పితరులనూ
  rationale: ప్రభావిత పక్షాలైన ‘మమ్మల్ని’ మరియు ‘మా పితరులను’ రెండింటినీ హీబ్రూ పునరుక్తికి అనుగుణంగా నిలుపుతుంది.
