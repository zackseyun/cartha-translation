  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: te
  text: ప్రజలు మోషేతో వాదులాడి, “యాహ్వే సన్నిధిలో మా సోదరులు చనిపోయినప్పుడు[a] మేమూ చనిపోయి ఉంటే ఎంత బాగుండేది!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సన్నిధిలో మా సోదరులు చనిపోయినట్లే మేమూ చనిపోయి ఉంటే ఎంత బాగుండేది!”
    reason: బִּגְוַע అనే నిర్మాణాన్ని కాలసంబంధంగా ‘చనిపోయినప్పుడు’ అని లేదా పోలికార్థంగా ‘చనిపోయినట్లే’ అని గ్రహించవచ్చు.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: వాదించి
  rationale: ריב శత్రుత్వభావంతో కూడిన వివాదాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వాదించి’ సహజంగా ఉండి, కేవలం ఫిర్యాదు చేయడం కంటే బలమైన ప్రతిఘటనను తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עם ఇక్కడ ఇశ్రాయేలు సమాజాన్ని సమగ్రంగా సూచిస్తుంది; ‘ప్రజలు’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: עִם מֹשֶׁה
  choice: మోషేతో
  rationale: עִם యొక్క సాధారణ అర్థం ‘తో’. ‘మోషేతో వాదించి’ అన్న ప్రయోగమే విరోధభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: అన్నారు
  rationale: ఇది హీబ్రూలో సాధారణమైన వాక్యప్రవేశ సూత్రం. రెండు క్రియలను యాంత్రికంగా పునరుత్పత్తి చేయకుండా తెలుగులో ‘అన్నారు’ అని సహజంగా అనువదించబడింది.
- source_word: וְלוּ
  choice: ఎంత బాగుండేది!
  rationale: לוּ ఇక్కడ నెరవేరని తీవ్రమైన కోరిక లేదా విలాపాన్ని వ్యక్తం చేస్తుంది. వాక్యాంతంలోని ‘ఎంత బాగుండేది’ ఆధునిక తెలుగులో ఆ భావోద్వేగ బలాన్ని సహజంగా అందిస్తుంది.
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: చనిపోయినప్పుడు మేమూ చనిపోయి ఉంటే
  rationale: గוע అనే ఒకే మూలాన్ని రెండుసార్లు ‘చనిపోవు’తో పునరావృతం చేసి మూలపాఠంలోని పదబంధ ఐక్యతను నిలిపింది. ב + infinitive construct కాలసంబంధ పరిస్థితిని సూచించేందున ‘చనిపోయినప్పుడు’ అని అనువదించబడింది.
- source_word: אַחֵינוּ
  choice: మా సహోదరులు
  rationale: ఈ పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; సందర్భంలో ముందుగా మరణించిన తోటి ఇశ్రాయేలీయులను సూచించే అవకాశం ఉంది. ‘సహోదరులు’ లింగరూపాన్నీ సమూహబంధాన్నీ నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో’. తెలుగు బైబిలు భాషలో సహజంగా, గౌరవప్రదంగా ఉండే ‘సన్నిధిలో’ను ఎంచుకుని, יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపాం; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אַחֵינוּ లోని లింగరూపం
  choice: మా సహోదరులు
  alternative: మా బంధువులు / మా సహోదర సహోదరీలు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని స్పష్టమైన సందర్భాధారం లేకుండా లింగతటస్థంగా లేదా విస్తృతంగా మార్చలేదు.
- issue: వారు ఎవరితో కలిసి చనిపోవాలని కోరుకున్నారనే సంబంధం
  choice: మా సహోదరులు చనిపోయినప్పుడు మేమూ చనిపోయి ఉంటే
  alternative: మా సహోదరులు చనిపోయినట్లే మేమూ చనిపోయి ఉంటే
  rationale: בִּגְוַע కాలాన్ని (‘చనిపోయినప్పుడు’) లేదా పోలికను (‘చనిపోయినట్లే’) సూచించగలదు. ప్రధాన పాఠంలో కాలసంబంధ అర్థాన్ని ఎంచుకుని, నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని అనుసరించాం. ప్రత్యక్ష సంభాషణలోని విలాపభావాన్ని ‘ఎంత బాగుండేది!’ ద్వారా నిలిపాం. మూలంలోని గוע పునరుక్తిని తెలుగులోనూ ‘చనిపోయి/చనిపోయినప్పుడు’గా కాపాడాం; పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
