id: NUM.20.4
reference: Numbers 20:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: te
  text: మరి, యాహ్వే సమాజాన్ని ఈ అరణ్యంలోకి ఎందుకు తీసుకొచ్చారు? మేమూ మా పశువులూ అక్కడ చనిపోవడానికా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָמָה
  choice: ఎందుకు
  rationale: తెలుగులో ప్రశ్నకు సహజమైన ఆరంభం. ముందు వాక్యంతోని అనుసంధానం సందర్భం ద్వారా స్పష్టమవుతుంది; ‘మరి ఎందుకు’ అని కూడా అనువదించవచ్చు, కాని ఇక్కడ అది అనవసరంగా భారంగా ఉంటుంది.
- source_word: הֲבֵאתֶם
  choice: తీసుకొచ్చారు
  rationale: בוא హిఫీల్ రూపం ‘రప్పించడం/తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. బహువచన సంబోధనను గౌరవార్థక బహువచనంతో సహజంగా వ్యక్తం చేసింది.
- source_word: קְהַל יְהוָה
  choice: యెహోవా సమాజాన్ని
  rationale: קהל అనేది కూడిన సముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, సంఘటిత సమూహ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: ఈ అరణ్యంలోకి
  rationale: מִדְבָּר నివాసరహిత అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ బైబిలు సందర్భంలో విస్తృత భావాన్ని ఇస్తుంది; אֶל యొక్క గమన భావాన్ని ‘లోకి’ నిలుపుతుంది.
- source_word: לָמוּת שָׁם
  choice: ఇక్కడ చనిపోవాలనా
  rationale: ఇన్ఫినిటివ్ ఉద్దేశం లేదా ఫలితం అనే రెండు భావాలకు వీలిస్తుంది. ఫిర్యాదు స్వరాన్ని సహజ తెలుగు ప్రశ్నగా మలచి, ఆ ఉద్దేశం/ఫలితం మధ్య ఉద్రిక్తతను కఠినంగా నిర్ణయించలేదు. పలుకుతున్నవారు అదే అరణ్యంలో ఉన్నందున שָׁם ను సహజ తెలుగులో ‘ఇక్కడ’గా వ్యక్తం చేసింది.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: మేమూ మా పశువులూ
  rationale: స్పష్ట సర్వనామాన్నీ, בעיר యొక్క సమష్టి పశుసంపద భావాన్నీ నిలుపుతుంది. ‘పశువులు’ సాధారణ ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది; తెలుగు పాఠకులకు సుపరిచితమైన రూపంగా ‘యెహోవా’ ఎంచుకుంది.
- issue: לָמוּת యొక్క ఉద్దేశం లేదా ఫలిత భావం
  choice: చనిపోవాలనా?
  alternative: చనిపోయేలా / చనిపోవడానికి
  rationale: హీబ్రూ నిర్మాణం ఉద్దేశాన్నీ ఫలితాన్నీ సూచించగలదు. ప్రశ్నార్థక తెలుగు రూపం ప్రజల ఆరోపణను స్పష్టంగా ఉంచుతూ, మోషే ఉద్దేశపూర్వకంగా మరణానికి తెచ్చాడని అనువాదమే తేల్చివేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రజల ఆవేదనతో కూడిన ప్రత్యక్ష ప్రశ్న స్వరాన్ని నిలుపుతూ రూపొందించబడింది. ‘సమాజం,’ ‘అరణ్యం,’ ‘పశువులు’ సాధారణ పాఠకులకు స్పష్టమైనవిగా, zugleich గౌరవప్రదమైన బైబిలు శైలికి తగినవిగా ఉన్నాయి.
