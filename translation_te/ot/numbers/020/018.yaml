source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑/י פֶּן בַּ/חֶ֖רֶב אֵצֵ֥א לִ/קְרָאתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: te
  text: 'అయితే ఎదోము అతనితో ఇలా అన్నాడు: “నీవు నా గుండా[a] వెళ్లకూడదు; లేకపోతే నేను కత్తితో నీకు ఎదురుగా బయలుదేరి వస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నాలో.” ఇక్కడ ఎదోము ఒక దేశం/భూభాగంగా మాట్లాడుతున్నందున, ఎదోము భూభాగం గుండా వెళ్లడమే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱדוֹם
  choice: అయితే ఎదోము అతనితో … అన్నాడు
  rationale: וַיֹּאמֶר అనే సాధారణ కథన క్రియను సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ క్రమంలో చివర ఉంచాం. אֵלָיוను ‘అతనితో’గా, אֱדוֹםను జాతి/దేశానికి వ్యక్తిత్వం ఆపాదించిన ఏకవచన కర్తగా అనువదించాం.
- source_word: לֹא תַעֲבֹר
  choice: నీవు … వెళ్లకూడదు
  rationale: Qal imperfect ద్వితీయ పురుష ఏకవచనం ఇక్కడ దృఢమైన నిరాకరణ/నిషేధ భావాన్ని ఇస్తుంది. ‘వెళ్లకూడదు’ ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: בִּי
  choice: నా గుండా
  rationale: అక్షరార్థంగా ‘నాలో’ అయినా, మాట్లాడుతున్న ‘ఎదోము’ దేశాన్ని/భూభాగాన్ని సూచిస్తుంది. ‘నా గుండా’ ఆ వ్యక్తీకరణను నిలుపుతూ భూభాగం గుండా ప్రయాణించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ఇక్కడ פֶּן నిషేధాన్ని అతిక్రమిస్తే కలిగే బెదిరింపు పర్యవసానాన్ని పరిచయం చేస్తుంది. ‘లేకపోతే’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: בַּחֶרֶב
  choice: కత్తితో
  rationale: సాయుధ శత్రుత్వ చర్యను సూచించే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తంగా, నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֵצֵא לִקְרָאתֶךָ
  choice: నేను … నీకు ఎదురుగా వస్తాను
  rationale: יצא యొక్క ‘బయలుదేరి రావడం’ భావం సందర్భంలో ‘వస్తాను’తో సహజంగా వ్యక్తమవుతుంది. לִקְרָאתֶךָకు అక్షరార్థంగా ‘నిన్ను కలవడానికి’ అనే భావం ఉన్నా, ఇక్కడ అది శత్రుత్వపూర్వక ఎదుర్కోలును సూచిస్తుంది; ‘నీకు ఎదురుగా’ ఆ సందర్భార్థాన్ని తెలియజేస్తూనే మూలంలోని ఎదురుపడే భావాన్ని నిలుపుతుంది.
