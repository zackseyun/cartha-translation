translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ఎదోము దేశం తనను తాను ఏకవచనంలో వ్యక్తీకరించుకున్న మూలభాషా రూపాన్ని ‘నా గుండా’ ద్వారా నిలిపాం; బెదిరింపు భావాన్ని అతిగా విస్తరించకుండా ‘కత్తితో నీకు ఎదురుగా వస్తాను’గా ఇచ్చాం.
