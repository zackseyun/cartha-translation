translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ఎదోము, ఇశ్రాయేలు అనే సమూహనామాలకు మూలంలోని ఏకవచన సర్వనామ అన్వయాన్ని నిలుపుతూ ‘తన’, ‘అతని’ వాడాం. మూలంలోని פ విభాగాంత సూచికను పాఠ్యంలో అనువదించలేదు.
