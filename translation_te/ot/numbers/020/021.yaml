revisions:
- from: కాని ఎదోము ఇశ్రాయేలును తన భూభాగం గుండా వెళ్లనివ్వడానికి నిరాకరించాడు. కాబట్టి ఇశ్రాయేలు అతని దగ్గరనుండి దారి మళ్లింది.
  to: కాని ఎదోము ఇశ్రాయేలును తన భూభాగం గుండా వెళ్లనివ్వడానికి నిరాకరించాడు. కాబట్టి ఇశ్రాయేలు అతని నుండి దారి మళ్లింది.
