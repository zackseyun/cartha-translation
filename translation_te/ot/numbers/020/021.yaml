id: NUM.20.21
reference: Numbers 20:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: te
  text: కాని ఎదోము ఇశ్రాయేలును తన భూభాగం గుండా వెళ్లనివ్వడానికి నిరాకరించాడు. కాబట్టి ఇశ్రాయేలు అతని నుండి దారి మళ్లింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: నిరాకరించాడు
  rationale: మָאֵן అనే క్రియ నిరాకరణను లేదా సమ్మతించకపోవడాన్ని సూచిస్తుంది; కథన సందర్భంలో ‘నిరాకరించాడు’ సహజంగా, తగిన బలంతో అర్థాన్ని తెలియజేస్తుంది.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: జాతి/దేశానికి సంబంధించిన హీబ్రూ నామాన్ని తెలుగులో స్థిరమైన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: נְתֹן
  choice: వెళ్లనివ్వడానికి
  rationale: מָאֵן‌తో కలిసిన נְתֹן ఇక్కడ అనుమతిని ఇవ్వకపోవడం అనే నుడికారార్థాన్ని ఇస్తుంది; తరువాతి עֲבֹר‌తో కలిపి ‘వెళ్లనివ్వడానికి’ అని సహజంగా వ్యక్తీకరించాం.
- source_word: עֲבֹר
  choice: గుండా వెళ్ల
  rationale: భూభాగాన్ని సూచించే పదబంధంతో עָבַר ప్రయాణించి దాటిపోవడాన్ని సూచిస్తుంది; ‘గుండా వెళ్ల’ సందర్భానికి స్పష్టమైన ఆధునిక తెలుగు.
- source_word: בִּגְבֻלוֹ
  choice: తన భూభాగం గుండా
  rationale: גְּבוּל అంటే సరిహద్దు, హద్దు లేదా ఆ హద్దులలోని భూభాగం కావచ్చు. ఇక్కడ ఎదోము దేశం గుండా ప్రయాణించడమే సందర్భం కాబట్టి ‘తన భూభాగం గుండా’ సరైన భావాన్ని అందిస్తుంది.
- source_word: וַיֵּט
  choice: దారి మళ్లింది
  rationale: נָטָה పక్కకు తిరగడం లేదా దిశ మార్చుకోవడం అనే భావాన్ని ఇస్తుంది. ఎదోము భూభాగంలోకి ప్రవేశించకుండా ఇశ్రాయేలు ప్రయాణదిశ మార్చుకున్న సందర్భంలో ‘దారి మళ్లింది’ సహజంగా ఉంటుంది.
- source_word: מֵעָלָיו
  choice: అతని దగ్గరనుండి
  rationale: అక్షరార్థంగా ‘అతని మీదనుండి’ అనే నిర్మాణం ఇక్కడ ఎదోమునుండి దూరంగా కదలడాన్ని సూచిస్తుంది; ‘అతని దగ్గరనుండి’ దిశాత్మక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
