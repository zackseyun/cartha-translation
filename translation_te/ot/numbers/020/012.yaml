source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: te
  text: 'యెహోవా మోషేకూ అహరోనుకూ ఇలా అన్నాడు: “మీరు నన్ను నమ్మలేదు కాబట్టి, ఇశ్రాయేలు కుమారుల[c] ఎదుట నన్ను పరిశుద్ధుడని ఎంచలేదు[b]. అందువల్ల నేను వారికి ఇచ్చిన దేశంలోకి ఈ సమాజాన్ని మీరు తీసుకెళ్లరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా “నన్ను పరిశుద్ధపరచలేదు,” లేదా “నన్ను పరిశుద్ధునిగా గౌరవించలేదు.”
    reason: lexical_alternative
  - marker: c
    text: అంటే “ఇశ్రాయేలీయుల.” అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: మీరు నన్ను నమ్మక
  rationale: אמן హిఫీల్ రూపం בְּ ఉపసర్గతో నమ్మడం లేదా విశ్వసించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహంలో కారణాన్ని సహజంగా కలిపేందుకు వ్యతిరేక క్రియావిశేషణ రూపం వాడింది; ‘నాపై విశ్వాసముంచక’ కూడా సాధ్యమే.
- source_word: לְהַקְדִּישֵׁנִי
  choice: నన్ను పరిశుద్ధునిగా నిలబెట్టలేదు
  rationale: దేవుణ్ణి ప్రజల ఎదుట పరిశుద్ధుడిగా గుర్తించి ప్రదర్శించాల్సిన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; దేవుణ్ణి తాము పరిశుద్ధునిగా ‘చేస్తారు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: לְעֵינֵי
  choice: కళ్ల ఎదుట
  rationale: హెబ్రీయుల ప్రత్యక్ష దృశ్యరూపాన్ని నిలుపుతూ, అపరాధం బహిరంగంగా జరిగినదనే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీయుల వంశపరమైన పదబంధాన్ని సూటిగా నిలుపుతుంది; సహజ తెలుగు ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’.
- source_word: הַקָּהָל
  choice: ఈ సమాజం
  rationale: అరణ్యంలో కూడిన ప్రజాసముదాయాన్ని సూచించే קהל భావాన్ని మతసంస్థకు మాత్రమే పరిమితం చేయకుండా అందిస్తుంది.
- source_word: תָבִיאוּ
  choice: మీరు తీసుకెళ్లరు
  rationale: בוא హిఫీల్ రూపంలోని ‘ప్రవేశింపజేయడం/తీసుకెళ్లడం’ భావాన్ని గమ్యస్థానంతో సహజమైన తెలుగులో అందిస్తుంది; ఇది గంభీరమైన దైవతీర్పు ప్రకటన.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָהֶם
  choice: నేను వారికి ఇచ్చిన దేశం
  rationale: పరిపూర్ణ క్రియారూపాన్ని పూర్తయిన దానంగా ఉంచి, వాగ్దాన నిశ్చయాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మోషే, అహరోనుల వైఫల్య స్వభావం
  choice: దేవుణ్ణి నమ్మకపోవడాన్నీ, ఇశ్రాయేలు ఎదుట ఆయనను పరిశుద్ధునిగా నిలబెట్టకపోవడాన్నీ రెండింటినీ పేర్కొంది.
  alternative: వారి వైఫల్యాన్ని కేవలం అవిధేయతగా, కోపంగా లేదా బండను కొట్టడంగా వివరించడం.
  rationale: ఈ వచనం స్వయంగా ఉంచిన నమ్మకం మరియు పరిశుద్ధత అనే రెండు అంశాలను అనువాదం నిలుపుతుంది; వారి చర్య ఏ విధంగా అవిశ్వాసమైందో వచనానికి మించి నిర్దిష్టం చేయదు.
- issue: దేవుని పరిశుద్ధతను వ్యక్తం చేసే విధానం
  choice: ‘నన్ను పరిశుద్ధునిగా నిలబెట్టలేదు’
  alternative: ‘నన్ను పరిశుద్ధపరచలేదు’ లేదా ‘నా పరిశుద్ధతను చూపలేదు’
  rationale: దేవుడు స్వభావతః పరిశుద్ధుడనే భావాన్ని దెబ్బతీయకుండా, ప్రజల ఎదుట ఆయన పరిశుద్ధతను గుర్తించి ప్రదర్శించాల్సిన బాధ్యతను తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచింది.
- issue: בני ישראל యొక్క రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు లేదా ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ వంశపరమైన పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సహజ సామూహిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దైవతీర్పు స్వరాన్ని ఉంచింది. వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు భాగాలుగా విభజించినా, కారణం–పర్యవసానం సంబంధాన్ని ‘కాబట్టి’తో స్పష్టంగా నిలిపింది. ‘యెహోవా’ను తెలుగు పాఠకులకు సుపరిచితమైన దైవనామ రూపంగా వాడింది.
