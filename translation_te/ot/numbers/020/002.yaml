  edition: WLC
  text: וְ/לֹא הָ֥יָה מַ֖יִם לָ/עֵדָ֑ה וַ/יִּקָּ֣הֲל֔וּ עַל מֹשֶׁ֖ה וְ/עַֽל אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: te
  text: సమాజానికి[a] నీరు లేదు; వారు మోషేకు, అహరోనుకు వ్యతిరేకంగా కూడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సభకు’ లేదా ‘ప్రజాసమూహానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ עֵדָה ఇక్కడ సమకూడిన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: లేవు
  rationale: היהతో నిర్దిష్టం కాని నామవాచకం కలిసినప్పుడు ఉనికిని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘నీళ్లు లేవు’ ఈ అస్తిత్వార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ప్రారంభ וְ యొక్క కథన అనుసంధానం తరువాతి వాక్యంలోని ‘అప్పుడు’ ద్వారా సహజంగా కొనసాగుతుంది.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: హీబ్రూలో ఇది పదార్థాన్ని సూచించే బహువచన రూపం. ఆధునిక ప్రామాణిక తెలుగులో తాగడానికి లేదా వినియోగానికి అవసరమైన నీటిని సాధారణంగా ‘నీళ్లు’ అని సహజంగా అంటారు.
- source_word: לָ/עֵדָה
  choice: సమాజానికి
  rationale: עֵדָה ఇక్కడ సమకూడిన ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజం’ సామూహిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: וַ/יִּקָּהֲלוּ
  choice: గుమికూడారు
  rationale: קהל ధాతువు ఒక సమూహంగా కూడడాన్ని సూచిస్తుంది. ఫిర్యాదు సందర్భంలోని ఉద్దేశపూర్వక సమీకరణను ‘గుమికూడారు’ సహజంగా తెలియజేస్తుంది.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: మోషేకు, అహరోనుకు విరోధంగా
  rationale: ఈ వివాద సందర్భంలో עַל స్థలసంబంధం కంటే వ్యతిరేకతను సూచిస్తుంది. రెండు నాయకులపట్లనున్న విరోధాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేయడానికి ఇద్దరి పేర్లకు దత్తివిభక్తిని జోడించి ‘విరోధంగా’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘సమాజం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ మూలంలోని సామూహిక భావాన్ని నిలుపుతుంది. మూలంలోని రెండు ఉపవాక్యాలను తెలుగులో సహజ పఠనానికి రెండు వాక్యాలుగా ఇచ్చాం; [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదానికి వెంటనే ఉంచాం.
