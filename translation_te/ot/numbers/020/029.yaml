source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: te
  text: సమాజమంతా అహరోను మరణించాడని చూసినప్పుడు[a], ఇశ్రాయేలు వంశమంతా[b] అహరోను కోసం ముప్పై రోజులు ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహరోను మరణించాడని గ్రహించినప్పుడు.’ హీబ్రూలో అక్షరార్థంగా ‘చూసినప్పుడు’ అని ఉంది; ఈ క్రియ ఒక సంగతిని గుర్తించడం లేదా గ్రహించడం అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు వంశమంతా’ అనేది ఇశ్రాయేలు ప్రజలందరినీ ఒక సమష్టిగా సూచించే వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియకు ప్రాథమిక అర్థం ‘చూచుట.’ ఈ సందర్భంలో జరిగిన సంగతిని గ్రహించడం అనే భావం కూడా ఉండవచ్చు; ‘చూసినప్పుడు’ మూలంలోని రూపాన్ని, దాని భావవిస్తృతిని నిలుపుతుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలీయుల సమూహాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సమాజమంతా’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי వారు చూసిన లేదా గ్రహించిన విషయం—అహరోను చనిపోయాడనే సంగతిని—పరిచయం చేస్తుంది.
- source_word: גָוַע
  choice: చనిపోయాడు
  rationale: גוע ప్రాణం విడవడం లేదా మరణించడం అనే గౌరవభరిత భావాన్ని కలిగి ఉంది. ‘చనిపోయాడు’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיִּבְכּוּ
  choice: ఏడ్చారు
  rationale: בכה నేరుగా ఏడవడాన్ని సూచిస్తుంది; విస్తృతమైన ‘దుఃఖించారు’ కంటే మూలంలోని భావోద్వేగ చర్యను ‘ఏడ్చారు’ బాగా నిలుపుతుంది.
- source_word: אֶת אַהֲרֹן
  choice: అహరోను కోసం
  rationale: בכה తో వచ్చిన ప్రత్యక్ష కర్మ సూచకం దుఃఖించి ఏడ్చిన వ్యక్తిని తెలియజేస్తుంది. తెలుగులో ‘అహరోను కోసం ఏడ్చారు’ సహజమైన ప్రయోగం.
- source_word: שְׁלֹשִׁים יוֹם
  choice: ముప్పై రోజులు
  rationale: ఇది కాలవ్యవధిని సూచించే ప్రయోగం; తెలుగులో ‘ముప్పై రోజులు’ అనే రూపమే సహజంగా ఆ వ్యవధిని తెలియజేస్తుంది.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారంతా
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే సామూహిక రూపకాన్ని పూర్తిగా చదునుచేయకుండా, మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
