- from: సమాజమంతా అహరోను చనిపోయాడని చూసినప్పుడు[a], ఇశ్రాయేలు ఇంటివారంతా[b] అహరోను కోసం ముప్పై రోజులు ఏడ్చారు.
  to: సమాజమంతా అహరోను మరణించాడని చూసినప్పుడు[a], ఇశ్రాయేలు వంశమంతా[b] అహరోను కోసం ముప్పై రోజులు ఏడ్చారు.
