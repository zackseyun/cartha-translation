translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘చూసినప్పుడు’ ద్వారా హీబ్రూ పదప్రయోగాన్ని నిలుపుతూ, ‘గ్రహించినప్పుడు’ అనే సందర్భోచిత భావాన్ని పాదటిప్పణిలో ఇచ్చాం. రెండు పాదటిప్పణి సూచికలు ప్రధాన వచనంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
