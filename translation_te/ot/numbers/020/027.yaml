  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: te
  text: మోషే యహ్వే ఆజ్ఞాపించినట్లే చేశాడు; సమాజమంతటి కళ్ల ఎదుట వారు హోరు కొండపైకి ఎక్కారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “సమాజమంతటి కళ్ల ఎదుట”; అంటే, కూడివున్న ప్రజలందరికీ కనిపించేలా బహిరంగంగా.'
    reason: హీబ్రూ నుడికారం לְעֵינֵי లోని ‘కళ్ల ఎదుట’ అనే దృశ్యరూపం, బహిరంగతా భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: ఇక్కడ עשה, దేవుడు ఇచ్చిన ఆజ్ఞను మోషే పాటించి అమలు చేశాడని తెలిపే సాధారణ కథన క్రియ. ‘చేశాడు’ సహజంగా ఉండి మూలంలోని సరళతను నిలుపుతుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר మోషే చేసిన పనిని యెహోవా ఆజ్ఞతో నేరుగా అనుసంధానిస్తుంది. ‘-ినట్లే’ ఆ అనుగుణతను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞాపించిన’ దైవిక ఆజ్ఞ యొక్క బలాన్ని తగ్గించకుండా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וַיַּעֲלוּ
  choice: వారు ... మీదికి ఎక్కారు
  rationale: עלה పైకి వెళ్లడం లేదా ఎక్కడాన్ని సూచిస్తుంది. కొండ సందర్భంలో ‘మీదికి ఎక్కారు’ ఆధునిక తెలుగులో సహజంగా, దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל הֹר הָהָר
  choice: హోరు కొండ మీదికి
  rationale: הֹר అనే స్థలనామాన్ని ‘హోరు’గా లిప్యంతరీకరించి, הָהָרను సహజమైన తెలుగు నామక్రమంలో ‘కొండ’గా ఇచ్చాం.
- source_word: לְעֵינֵי
  choice: చూస్తుండగా
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘కళ్ల ఎదుట’ అని ఉన్నా, ఇక్కడ కార్యం బహిరంగంగా సమాజమంతటి సమక్షంలో జరిగిందనే భావాన్ని ‘చూస్తుండగా’ సహజ తెలుగులో అందిస్తుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה కూడి ఉన్న ఇశ్రాయేలు సముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ సంఖ్యాకాండంలోని సామూహిక సందర్భానికి సరిపోతుంది; כָּל భావాన్ని ‘-మంతా’ అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ఒక బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు వరుస కార్యాలను రెండు తెలుగు వాక్యాలుగా ఇచ్చి చదవడానికి సహజంగా చేశాం; భావసంబంధం యథాతథంగా ఉంది.
