source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: te
  text: వారు కాదేషు నుండి బయలుదేరారు. ఇశ్రాయేలు ప్రజల సమాజమంతా హోరు కొండకు వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: נסע అనే క్రియ శిబిరాన్ని విడిచి తదుపరి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִקָּדֵשׁ
  choice: కాదేషు నుండి
  rationale: మూలపాఠంలో ఉన్నది ‘కాదేషు’ మాత్రమే; సందర్భం ఆధారంగా ‘కాదేషు-బర్నేయ’ అని విస్తరించలేదు.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא ఇక్కడ గమ్యస్థానానికి రావడాన్ని సూచిస్తుంది; కొండ పేరుతో ‘వచ్చారు’ సహజమైన, మూలానికి సమీపమైన ప్రయోగం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఆధునిక తెలుగులో మొత్తం జాతిని సహజంగా సూచించేందుకు ‘ఇశ్రాయేలు ప్రజలు’ ఎంచుకున్నాం.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה సమకూడిన ఒడంబడిక సమాజాన్ని సూచిస్తుంది; כָּל తెలిపే సంపూర్ణతను ‘అంతా’ నిలుపుతుంది.
- source_word: הֹר הָהָר
  choice: హోరు కొండకు
  rationale: అక్షరార్థంగా ‘హోరు, ఆ కొండ’ అనే నిర్మాణం ఇక్కడ స్థలనామంగా పనిచేస్తుంది; తెలుగులో సహజమైన రూపం ‘హోరు కొండ’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని విషయ పునర్నిర్దేశాన్ని ‘అంటే’ ద్వారా స్పష్టం చేసి, బయలుదేరినవారే ఇశ్రాయేలు సమాజమంతా అనే భావాన్ని నిలిపాం.
