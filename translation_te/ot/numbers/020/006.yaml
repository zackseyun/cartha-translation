  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను సమాజం సమక్షం నుండి సమావేశపు గుడారం ప్రవేశద్వారం వద్దకు వచ్చి, ముఖాలు నేలకు ఆనించి పడ్డారు. యాహ్వే మహిమ వారికి ప్రత్యక్షమైంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చారు
  rationale: בוא సందర్భానుసారంగా ‘వచ్చు/వెళ్లు/ప్రవేశించు’ అనే అర్థాలు కలిగి ఉంటుంది. నిర్దిష్ట గమ్యస్థానానికి మోషే, అహరోనుల కదలికను ఇక్కడ ‘వచ్చారు’ సహజంగా తెలియజేస్తుంది.
- source_word: מִפְּנֵי הַקָּהָל
  choice: సమాజం ఎదుటి నుండి
  rationale: మూలంలోని ‘సమాజం సన్నిధి నుండి/ఎదుటి నుండి’ అనే స్థలసంబంధ నుడికారాన్ని అతి వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: קהל అంటే కూడిన ప్రజాసమూహం. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి సమష్టి భావాన్ని అందిస్తుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం
  rationale: פתח అంటే ప్రవేశద్వారం; אֹהֶל מוֹעֵד ఇశ్రాయేలీయుల ఆరాధనా గుడారానికి స్థిరమైన పేరు. ‘ప్రత్యక్ష గుడారం’ అనే తెలుగు పదబంధం దేవునితో సమావేశమయ్యే స్థల భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: సాష్టాంగపడ్డారు
  rationale: అక్షరార్థంగా ‘తమ ముఖాలపై పడ్డారు.’ తెలుగులో ‘సాష్టాంగపడడం’ ముఖం నేలకు ఆనేటట్లు పడే వినయపూర్వక భంగిమను సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమైంది
  rationale: ראה నిఫల్ రూపం ఇక్కడ కనబడే విధంగా వ్యక్తమవడాన్ని సూచిస్తుంది. ‘ప్రత్యక్షమైంది’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְבוֹד יְהוָה
  choice: యెహోవా మహిమ
  rationale: כבוד ఇక్కడ దేవుని ప్రత్యక్ష మహిమను సూచిస్తుంది; నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధ పదబంధంగా అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- source_word: אֲלֵיהֶם
  choice: వారికి
  rationale: אל దిశను లేదా సంబంధిత వ్యక్తులను సూచిస్తుంది; ‘వారికి ప్రత్యక్షమైంది’ సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను వాడటం పేరును నిలుపుతుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిశ్చితంగా తెలియదు.
- issue: ‘ముఖాలపై పడ్డారు’ అనే భంగిమ యొక్క భావం
  choice: సాష్టాంగపడ్డారు
  alternative: ముఖాలు నేలకు ఆనించి పడ్డారు
  rationale: ఈ చర్య వినయం, భయం లేదా ప్రార్థనను సూచించవచ్చు; వాటిలో ఏ ఒక్క ఉద్దేశాన్నీ పాఠ్యంలో చేర్చకుండా శరీరభంగిమను మాత్రమే సహజ తెలుగులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, దైవ ప్రత్యక్షతను స్పష్టంగా నిలిపాం. ఈ వచనానికి అవసరమైన పాఠాంతర లేదా వివరణాత్మక పాదటిప్పణులు లేవు.
