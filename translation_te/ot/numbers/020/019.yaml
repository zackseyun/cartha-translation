translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ప్రత్యక్ష ప్రసంగంలో హీబ్రూలో ఉన్న బహువచనం నుంచి ఏకవచనానికి మార్పును ఉద్దేశపూర్వకంగా నిలిపింది; మాట్లాడేవాడు సమూహం తరఫున ఏకవచనంలో అభ్యర్థిస్తున్నాడు.
