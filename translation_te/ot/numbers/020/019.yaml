  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులు[a] అతనితో ఇలా అన్నారు: “మేము ప్రధాన మార్గం మీదుగా పైకి వెళ్తాం[b]. నేనూ నా పశువులూ నీ నీళ్లు తాగితే, వాటి ధర చెల్లిస్తాను. మరేమీ వద్దు; నేను కాలినడకన మాత్రమే దాటిపోవనివ్వు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.” హీబ్రూలో అక్షరాలా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ఎత్తుగా నిర్మించిన రహదారి లేదా ప్రధాన మార్గాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరాలా “నా కాళ్లతో నేను దాటుతాను.” ఇది కేవలం కాలినడకన దాటిపోవడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే సహజ నిర్మాణాన్ని ఉపయోగించింది.
- source_word: בַּמְסִלָּה
  choice: ప్రధాన మార్గం మీదుగా
  rationale: מְסִלָּה ఎత్తుగా నిర్మించిన లేదా ముఖ్యమైన రహదారిని సూచించగలదు; ప్రయాణానికి నిర్దేశిత మార్గం అనే భావాన్ని ‘ప్రధాన మార్గం’ సహజంగా తెలియజేస్తుంది.
- source_word: נַעֲלֶה
  choice: పైకి వెళ్తాం
  rationale: ‘పైకి వెళ్లడం’ అనే మూల క్రియార్థాన్ని సందర్భానికి విరుద్ధం కాకుండా నిలుపుతుంది.
- source_word: מֵימֶיךָ
  choice: నీ నీళ్లు
  rationale: హీబ్రూలోని బహువచన రూపం నీటికి సహజమైనది; తెలుగులో ‘నీళ్లు’ సాధారణ, సహజ ప్రయోగం.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: నేనూ నా పశువులూ నీ నీళ్లు తాగితే
  rationale: ప్రజల తరఫున మాట్లాడే వ్యక్తి ఏకవచనాన్ని, అతని పశుసంపదను మూలంలోని విధంగానే నిలుపుతుంది.
- source_word: וְנָתַתִּי מִכְרָם
  choice: వాటి వెల చెల్లిస్తాను
  rationale: తాగిన నీటికి తగిన ధర చెల్లిస్తాననే లావాదేవీ భావాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: רַק אֵין דָּבָר
  choice: మరేమీ వద్దు; ... మాత్రమే
  rationale: అభ్యర్థనను కేవలం దాటివెళ్లడానికి పరిమితం చేసే హీబ్రూ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: కాలినడకన మాత్రమే నన్ను దాటిపోనివ్వు
  rationale: ‘నా కాళ్లతో దాటుతాను’ అనే అక్షరార్థంలోని పాదయాత్ర భావాన్నీ, సందర్భంలోని వినయపూర్వక అభ్యర్థన శక్తినీ నిలుపుతుంది.
