revisions:
- from: ఇశ్రాయేలు కుమారులు[a] అతనితో, “మేము ప్రధాన మార్గం మీదుగా పైకి వెళ్తాం[b]. నేనూ నా పశువులూ నీ నీళ్లు తాగితే, వాటి వెల చెల్లిస్తాను. మరేమీ వద్దు; కాలినడకన మాత్రమే నన్ను దాటిపోనివ్వు[c]” అన్నారు.
  to: 'ఇశ్రాయేలు కుమారులు[a] అతనితో ఇలా అన్నారు: “మేము ప్రధాన మార్గం మీదుగా పైకి వెళ్తాం[b]. నేనూ నా పశువులూ నీ నీళ్లు తాగితే, వాటి ధర చెల్లిస్తాను. మరేమీ వద్దు; నేను కాలినడకన మాత్రమే దాటిపోవనివ్వు[c].”'
  rationale: The revision corrects the direction and grammar of the final request, improves the payment expression, and aligns each footnote more precisely with its anchor while preserving the Hebrew’s singular speaker representing the group and its literal “go up” wording.
