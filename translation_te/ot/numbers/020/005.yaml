id: NUM.20.5
reference: Numbers 20:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: te
  text: మరి మమ్మల్ని ఐగుప్తు నుండి పైకి తీసుకొచ్చి, ఈ దుర్భరమైన చోటికి ఎందుకు తీసుకొచ్చారు? ఇది విత్తనాలు విత్తడానికి అనువైన చోటు కాదు[a]; ఇక్కడ అంజూర పండ్లు, ద్రాక్షతీగలు, దానిమ్మ పండ్లు లేవు. తాగడానికి నీళ్లు కూడా లేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘విత్తనం యొక్క స్థలం కాదు.’ దీని భావం ‘విత్తడానికి అనువైన చోటు కాదు’ లేదా ‘ధాన్యపంటలు పండే చోటు కాదు’ కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: మరి ... ఎందుకు
  rationale: ముందటి ఫిర్యాదును కొనసాగించే וְ సంధిని సహజమైన తెలుగు ‘మరి’తో నిలిపి, ప్రశ్నార్థక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: మమ్మల్ని ఐగుప్తు నుండి పైకి తీసుకొచ్చి
  rationale: עלה హిఫిల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే నిర్గమన ప్రయోగాన్ని వీలైనంతగా నిలుపుతుంది.
- source_word: לְהָבִיא אֹתָנוּ
  choice: తీసుకొచ్చారు
  rationale: ఉద్దేశం లేదా ఫలితాన్ని తెలిపే బוא ధాతువు భావాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: ఈ దుర్భరమైన చోటికి
  rationale: ఇక్కడ רַע నైతిక చెడును తప్పనిసరిగా సూచించకుండా, నివసించడానికి హానికరమైన లేదా దయనీయమైన స్థలాన్ని సూచిస్తుంది; ‘దుర్భరమైన’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: לֹא מְקוֹם זֶרַע
  choice: ఇది విత్తనాలు విత్తడానికి అనువైన చోటు కాదు[a]
  rationale: అక్షరార్థంగా ‘విత్తనం యొక్క స్థలం కాదు’; వ్యవసాయ సందర్భంలో సాగుకు లేదా విత్తడానికి పనికిరాని నేల అనే సాధ్యమైన భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: ఇక్కడ అంజూర పండ్లు, ద్రాక్షతీగలు, దానిమ్మ పండ్లు లేవు
  rationale: పంటల లేదా మొక్కల జాబితాను ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; גֶפֶןను ‘ద్రాక్షతీగలు’గా అనువదించడం మొక్కను నిర్దిష్టంగా సూచిస్తుంది.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: తాగడానికి నీళ్లు కూడా లేవు
  rationale: అస్తిత్వ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ‘కూడా’ ద్వారా హీబ్రూ וּ యొక్క జోడింపు బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: רַע అనే పదం స్థలాన్ని నైతికంగా చెడ్డదిగా చిత్రిస్తుందా, లేక దుర్భరమైనదిగా చిత్రిస్తుందా
  choice: దుర్భరమైన
  alternative: చెడ్డ
  rationale: సందర్భం నీరు, సాగు, పండ్ల కొరత గురించినది; అందువల్ల ఇది ప్రధానంగా ఆ స్థలం హానికరమైనది లేదా నివాసయోగ్యం కానిదనే అనుభవాత్మక భావాన్ని సూచిస్తుంది. నైతిక చెడు అనే అర్థాన్ని అనవసరంగా మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఫిర్యాదులోని తీవ్రతను నిలుపుతూ, సందర్భంలో లేని నైతిక అర్థాన్ని చేర్చలేదు.
