id: NUM.20.14
reference: Numbers 20:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִ/קָּדֵ֖שׁ אֶל מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣י/ךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כָּל הַ/תְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: te
  text: 'అప్పుడు మోషే కాదేషు నుంచి ఎదోము రాజునకు దూతలను పంపాడు: “నీ సహోదరుడైన ఇశ్రాయేలు ఇలా చెబుతున్నాడు: మాకు ఎదురైన కష్టమంతా నీకు తెలుసు.[a][b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ బంధువైన ఇశ్రాయేలు.” హీబ్రూలో అక్షరార్థంగా “నీ సహోదరుడు ఇశ్రాయేలు”; ఇది ఎదోము, ఇశ్రాయేలు మధ్యనున్న పూర్విక బంధాన్ని గుర్తుచేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మాకు ఎదురైన ఇబ్బందంతా” లేదా “మాకు ఎదురైన బాధంతా.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “మమ్మల్ని కనుగొన్న”; అంటే “మాకు ఎదురైన” లేదా “మాపైకి వచ్చిన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ దౌత్య సందర్భంలో ఇది పరలోక దూతలను కాదు, మానవ సందేశవాహకులను సూచిస్తుంది; ‘దూతలు’ తెలుగులో ఈ రెండు అర్థాలను కలిగి ఉన్నప్పటికీ సందర్భం మానవ ప్రతినిధులనే స్పష్టం చేస్తుంది.
- source_word: מִקָּדֵשׁ
  choice: కాదేషు నుండి
  rationale: హీబ్రూ పాఠంలో ఉన్న స్థలనామాన్ని మాత్రమే అనువదించి, ఈ వచనంలో లేని ‘కాదేషు-బర్నేయ’ను చేర్చలేదు.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: ఎదోము రాజు దగ్గరకు
  rationale: గమ్యాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ఇది ప్రామాణిక దూత-సూత్రం; సందేశాన్ని అందిస్తున్న సందర్భంలో వర్తమాన కాలపు తెలుగు రూపం సహజంగా ఉంటుంది.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: నీ సహోదరుడైన ఇశ్రాయేలు
  rationale: ఎదోము, ఇశ్రాయేలు మధ్య పూర్విక బంధాన్ని సూచించే ప్రత్యక్ష కుటుంబ రూపకాన్ని నిలుపుతుంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: పరిపూర్ణ క్రియ ఇక్కడ ప్రస్తుత జ్ఞానస్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం సహజమైనది, స్పష్టమైనది.
- source_word: כָּל הַתְּלָאָה
  choice: కష్టమంతా
  rationale: తీవ్రమైన ఇబ్బంది, శ్రమ, దుఃఖం అనే భావ పరిధిని సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: మాకు సంభవించిన
  rationale: అక్షరార్థంగా ‘మమ్మల్ని కనుగొన్న’ అనే హీబ్రూ నుడికారాన్ని, అర్థాన్ని కాపాడుతూ సహజ తెలుగులో ‘మాకు సంభవించిన’గా అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు–ఎదోము బంధుత్వ భాష
  choice: నీ సహోదరుడైన ఇశ్రాయేలు
  alternative: నీ బంధువైన ఇశ్రాయేలు
  rationale: వచనం యాకోబు–ఏశావుల పూర్విక సంబంధంపై ఆధారపడిన కుటుంబ భాషను ఉద్దేశపూర్వకంగా వాడుతోంది. సాధారణ ‘బంధువు’గా సడలించకుండా ‘సహోదరుడు’ అనే ప్రత్యక్ష రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దౌత్య సందేశానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘దూతలు’ సందర్భానుసారంగా మానవ సందేశవాహకులను సూచిస్తుంది. ప్రధాన పాఠంలో కుటుంబ రూపకాన్ని, హీబ్రూ నుడికారపు భావాన్ని కాపాడుతూ సహజ తెలుగు వాక్యనిర్మాణం వాడబడింది.
