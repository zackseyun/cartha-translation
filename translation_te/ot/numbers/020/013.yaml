source:
  edition: WLC
  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: te
  text: ఇవి మెరీబా[a] జలాలు; అక్కడ ఇశ్రాయేలు కుమారులు యెహోవాతో వాదించారు, ఆయన వారిలో తన పరిశుద్ధతను కనబరిచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెరీబా’ అనే పేరుకు ‘వాదం’ లేదా ‘కలహం’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన వారిలో పరిశుద్ధునిగా కనబడ్డాడు”; లేదా, “వారి ద్వారా తన పరిశుద్ధతను నిరూపించుకున్నాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: ఇవి
  rationale: జలాలను గుర్తించి పేరుపెట్టే సూచన వాక్యంగా సహజమైన వర్తమాన రూపం.
- source_word: מֵי מְרִיבָה
  choice: మెరీబా జలాలు
  rationale: מְרִיבָה ఇక్కడ స్థలనామంగా పనిచేస్తుంది; దాని ‘వాదం/కలహం’ అనే అర్థాన్ని పాదటీకలో ఉంచాం.
- source_word: רָבוּ
  choice: వాదించిన
  rationale: ריב లోని వివాదం లేదా కలహం భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పురుష బహువచన నిర్మాణాన్ని నిలుపుతూ సంప్రదాయ జాతివాచక రూపాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקָּדֵשׁ
  choice: తన పరిశుద్ధతను కనబరిచాడు
  rationale: నిఫాల్ రూపంలోని ప్రత్యక్షీకరణ/ప్రతిఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మనుషులు దేవుణ్ణి పరిశుద్ధునిగా చేశారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: בָּם
  choice: వారిలో
  rationale: ‘వారిలో/వారి మధ్య/వారి ద్వారా’ అనే సాధ్యమైన భావాల్లో మూలంలోని సంక్షిప్తతను అత్యంత సమీపంగా నిలుపుతుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో యెహోవా పరిశుద్ధత వ్యక్తమవడాన్ని ఎలా అనువదించాలి
  choice: ఆయన వారిలో తన పరిశుద్ధతను కనబరిచాడు
  alternative: ఆయన వారిలో పరిశుద్ధునిగా కనబడ్డాడు / వారి ద్వారా తన పరిశుద్ధతను నిరూపించుకున్నాడు
  rationale: קדש నిఫాల్ రూపం ఇక్కడ యెహోవా పరిశుద్ధత సంఘటన ద్వారా వెల్లడైందనే భావాన్ని ఇస్తుంది. ఎంచుకున్న రూపం ఆ భావాన్ని సహజంగా చెబుతుంది; ప్రత్యామ్నాయ వ్యాకరణ పఠనాన్ని పాదటీకలో నిలుపుతుంది.
- issue: בְנֵי יִשְׂרָאֵל ను సమూహవాచకంగా సరళీకరించాలా
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: హీబ్రూ పదబంధంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; దానిని లింగనిరపేక్ష సమూహపదంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవనామం మరియు పరిశుద్ధతకు సంబంధించిన గంభీరతను నిలుపుతూ అనువదించబడింది. ‘మెరీబా’ స్థలనామంగా ఉంచబడింది; చివరి ఉపవాక్యంలోని నిఫాల్ మరియు בָּם యొక్క నిజమైన అస్పష్టత పాదటీకలో సంరక్షించబడింది.
