  verdict: revise
  source_fidelity: The draft accurately conveys Edom’s refusal, its coming out, the substantial accompanying body, and the idiom of the strong hand. However, ఎదురు్కోవడానికి makes לִקְרָאתוֹ explicitly confrontational, whereas the Hebrew expression is lexically neutral even in this hostile setting. The revised wording retains that restraint.
  naturalness: The revised text uses clear modern standard Telugu. ఎదురుుగా రావడానికి is more natural and less interpretively loaded than ఎదురు్కోవడానికి in this context. బయలుదేరింది agrees naturally with ఎదోము as a collective political entity.
  terminology: ఎదోము is retained. గొప్ప జనసమూహంతో reflects בְּעַם כָּבֵד without specifying a military unit more narrowly than the Hebrew does. బలమైన చేతితో preserves the Hebrew image, with its idiomatic force explained in the footnote.
