base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: te
  text: కాని అతడు, “నీవు దాటిపోకూడదు” అని చెప్పాడు. అప్పుడు ఎదోము అతనిని ఎదురుగా రావడానికి[a] గొప్ప జనసమూహంతో[b], బలమైన చేతితో[c] బయలుదేరింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనిని ఎదుర్కోవడానికి.” హీబ్రూ వ్యక్తీకరణ స్వతహాగా తటస్థమైనది; అయితే ఇక్కడి సందర్భం శత్రుత్వపూర్వకమైనది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “భారీ ప్రజలతో”; అంటే పెద్దదైన లేదా ప్రభావశీలమైన జనసమూహంతో.
    reason: lexical_alternative
  - marker: c
    text: లేదా “బలమైన శక్తితో”; అక్షరార్థంగా, “బలమైన చేతితో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: కాని అతడు ... అని చెప్పాడు
  rationale: వావ్ వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి మనవికి విరుద్ధమైన నిరాకరణను సందర్భానుసారంగా ‘కాని’ తెలియజేస్తుంది. కర్తను మూలంలాగే సాధారణంగా ఉంచింది.
- source_word: לֹא תַעֲבֹר
  choice: నీవు దాటిపోకూడదు
  rationale: ఇక్కడ అసంపూర్ణ క్రియ దృఢమైన నిషేధం లేదా అనుమతి నిరాకరణను వ్యక్తం చేస్తుంది; భూభాగం గుండా వెళ్లడాన్ని సూచిస్తుంది.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: అప్పుడు ఎదోము ... బయలుదేరి వచ్చింది
  rationale: יצא యొక్క ప్రాథమిక భావమైన బయలుదేరడాన్ని నిలుపుతూ, తరువాతి పదబంధాల్లోని సైనిక సందర్భాన్ని క్రియలో అతిగా చేర్చలేదు.
- source_word: לִקְרָאתוֹ
  choice: అతనిని ఎదుర్కోవడానికి
  rationale: לקראת స్వతహాగా కలవడానికి/ఎదురుగా రావడానికి అనే తటస్థ భావం కలిగి ఉన్నా, ఇక్కడి సందర్భం శత్రుత్వపూర్వకమైనది. తెలుగు ‘ఎదుర్కోవడానికి’ ఆ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בְּעַם כָּבֵד
  choice: పెద్ద సైన్యంతో
  rationale: అక్షరార్థంగా ‘భారీ ప్రజలతో’; כבד ఇక్కడ పెద్దదైన లేదా ప్రభావశీలమైన జనబలాన్ని సూచించే నుడికారం. సందర్భంలో అది సైనిక బలగం కావడంతో ‘పెద్ద సైన్యం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וּבְיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ బలం లేదా శక్తిని సూచిస్తుంది; ‘బలప్రయోగంతో’ అనే భావానువాదం పాదటిప్పణిలో ఇవ్వబడింది.
