translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఎదోము’ను సమష్టి రాజకీయ ప్రజాసమూహంగా భావించి ఏకవచన స్త్రీలింగ క్రియారూపం ‘వచ్చింది’ వాడబడింది. మూలంలోని చేతి రూపకం ప్రధాన పాఠ్యంలో నిలుపబడింది.
