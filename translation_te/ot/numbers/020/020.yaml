    issue: The main text renders לִקְרָאתוֹ as ఎదురు్కోవడానికి.
    rationale: This Telugu verb explicitly means ‘to confront/oppose’ and imports the hostile implication into a Hebrew expression whose basic meaning is ‘to meet.’ The hostility may be noted in a footnote rather than made lexical in the main text.
  - severity: low
    issue: పెద్ద సైన్యంతో narrows עַם (‘people/body of people’) to a formal army.
    rationale: The context strongly suggests an armed or imposing force, but the Hebrew wording itself says ‘with a weighty/great people.’ A broader Telugu expression better preserves the source wording.
  - severity: low
    issue: The translation note identifies వచ్చింది as the verbal form used, while the text actually has బయలుదేరి వచ్చింది.
    rationale: This is an internal explanatory inconsistency. The revised text uses the simpler, natural collective form బయలుదేరింది.
