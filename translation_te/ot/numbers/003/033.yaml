id: NUM.3.33
reference: Numbers 3:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: te
  text: 'మెరారికి చెందిన వంశాలు: మహలీయుల వంశం మరియు మూషీయుల వంశం; ఇవే మెరారి వంశాలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: మెరారికి చెందినవారు
  rationale: లְ ఉపసర్గ ఇక్కడ జనగణన జాబితాలో మెరారికి చెందిన సంతతి వర్గాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘మెరారికి చెందినవారు’ అనే ప్రయోగం ఆ వర్గీకరణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: వంశం / వంశాలు
  rationale: ఈ వంశావళి సందర్భంలో מִשְׁפָּחָה ఒక గోత్రంలోని ఉపవంశ సమూహాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘వంశం’ స్పష్టంగా, సహజంగా ఉంటుంది; ‘గోత్రం’ అనే విస్తృత స్థాయి పదంతో కలవరపడకుండా చేస్తుంది.
- source_word: הַמַּחְלִי
  choice: మహలీయులు
  rationale: ఇది మహలి నుండి వచ్చిన వారిని సూచించే వంశనామం. తెలుగు బహువచన వ్యక్తిసూచక రూపం మూలంలోని సమూహ భావాన్ని నిలుపుతుంది.
- source_word: וּמִשְׁפַּחַת
  choice: మూషీయుల వంశం
  rationale: וּ రెండవ వంశాన్ని మొదటిదానితో సమన్వయపరుస్తుంది. తెలుగులో అల్పవిరామంతో కూడిన జాబితా సహజంగా ఉండటంతో ‘మరియు’ను తప్పించినా సమన్వయ భావం స్పష్టంగానే ఉంటుంది.
- source_word: הַמּוּשִׁי
  choice: మూషీయులు
  rationale: ఇది మూషి నుండి వచ్చిన వారిని సూచించే వంశనామం. వ్యక్తిసమూహాన్ని తెలిపే తెలుగు బహువచన రూపం ఉపయోగించబడింది.
- source_word: אֵלֶּה הֵם
  choice: ఇవే
  rationale: సూచక సర్వనామం మరియు వ్యక్తిసర్వనామం కలిగించే నొక్కిచెప్పే గుర్తింపు భావాన్ని తెలుగు ‘ఇవే’ సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: మెరారి వంశాలు
  rationale: ముందు పేర్కొన్న రెండు ఉపవంశాలను సమగ్రంగా సూచించే బహువచన నిర్మాణం; తెలుగు సంబంధ నిర్మాణంలో సహజంగా ఇవ్వబడింది.
