  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. వ్యక్తినామాలను హెబ్రీయ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; ఉపవంశ సూచనకు ‘వంశం’ను స్థిరంగా వాడాం.
