  terminology: “వంశం/వంశాలు” consistently conveys the clan-level kinship groups in accessible Telugu. “మహలీయులు” and “మూషీయులు” appropriately represent the gentilic group names, while “మెరారి” is retained as the personal/ancestral name.
  issues:
