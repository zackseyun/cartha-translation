id: NUM.3.8
reference: Numbers 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: te
  text: వారు సమాగమ గుడారంలోని సామగ్రినంతటినీ సంరక్షించాలి; నివాస గుడారపు సేవను చేయడానికి ఇశ్రాయేలు కుమారుల కర్తవ్యాన్ని నిర్వర్తించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు కుమారుల బాధ్యతను.”
    reason: מִשְׁמֶרֶתకు కర్తవ్యం, బాధ్యత, అప్పగించిన సంరక్షణ వంటి సమీపార్థాలు ఉన్నాయి. ఈ సందర్భంలో ఇశ్రాయేలు కుమారుల కర్తవ్యాన్ని లేవీయులు నిర్వహిస్తారనే భావం ఉంది.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: పర్యవేక్షించాలి / నిర్వర్తించాలి
  rationale: యాజక సంబంధ సందర్భంలో שׁמר కేవలం కాపలా కాయడమే కాక, అప్పగించిన సంరక్షణ బాధ్యతను చూసుకోవడం, నిర్వర్తించడం అనే భావాన్ని కలిగి ఉంది. తెలుగులో ఒకే పదాన్ని అసహజంగా పునరావృతం చేయకుండా సందర్భానుసారంగా రెండు సహజ క్రియలు వాడబడ్డాయి.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: సమాగమ గుడారంలోని సామగ్రినంతటినీ
  rationale: כְּלִים అనేది పాత్రలకే పరిమితం కాకుండా ఉపకరణాలు, వస్తువులు, సామగ్రి అన్నింటినీ సూచించగలదు; ‘సామగ్రి’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమాగమ గుడారం
  rationale: אֹהֶל అనే గుడార భావాన్నీ, מוֹעֵד లోని నియమిత సమావేశం/కలయిక భావాన్నీ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: מִשְׁמֶרֶת
  choice: అప్పగించబడిన బాధ్యత
  rationale: ఈ నామవాచకం కాపలా, బాధ్యత, నియమిత కర్తవ్యం అనే సంబంధిత భావాలను కలిగి ఉంది. ఇక్కడ లేవీయులకు అప్పగించబడిన సేవా బాధ్యత అనే సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ భాషలోని పుంలింగ బహువచన జాతీయ సంజ్ఞను రూపపరంగా నిలుపుతూ, అది సమూహాన్ని సూచించే సంప్రదాయ ప్రయోగమని గౌరవిస్తుంది.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: మందిర గుడారపు సేవను నిర్వహించడానికి
  rationale: עבד/עֲבֹדָה ఇక్కడ ఆరాధనా సంబంధ నియమిత సేవను సూచిస్తాయి. ‘సేవను నిర్వహించడం’ ఆధునిక తెలుగులో సహజంగా ఉంది. מִשְׁכָּן యొక్క నివాసస్థల భావాన్ని ‘మందిర గుడారం’ ద్వారా అరణ్యకాల పవిత్ర గుడార సందర్భంలో తెలియజేస్తుంది.
theological_decisions:
- issue: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל అనే సంబంధపదబంధం
  choice: ఇశ్రాయేలు కుమారులకు అప్పగించబడిన బాధ్యత
  alternative: ఇశ్రాయేలు కుమారుల తరఫున అప్పగించబడిన బాధ్యత; ఇశ్రాయేలు కుమారుల కర్తవ్యం
  rationale: హీబ్రూ పదబంధం ఇశ్రాయేలీయుల కర్తవ్యాన్ని లేవీయులు చేపట్టడం లేదా వారి తరఫున బాధ్యత వహించడం అనే భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠం బాధ్యత అప్పగింపును తెలియజేస్తూ, ప్రత్యామ్నాయ సంబంధాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక సమూహపదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ రూపాన్ని చెరపకుండా జాతీయ సమూహసంజ్ఞగా అనువదించబడింది; ఈ వచనం వ్యక్తిగత పురుషులకు మాత్రమే పరిమితం చేస్తుందని అదనంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘సమాగమ గుడారం’ మరియు ‘మందిర గుడారం’ ద్వారా אֹהֶל מוֹעֵד, מִשְׁכָּן అనే వేర్వేరు హీబ్రూ పదాల మధ్య తేడా సాధ్యమైనంతవరకు నిలుపబడింది. ప్రధాన వాక్యాన్ని తెలుగులో స్పష్టంగా చేయడానికి సమాంతర బాధ్యతలను రెండు క్రియలతో వ్యక్తం చేసినా, మూలంలోని బాధ్యత/కర్తవ్య సంబంధ అస్పష్టతను పాదటిప్పణిలో భద్రపరచారు.
