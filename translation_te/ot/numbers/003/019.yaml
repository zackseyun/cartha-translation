translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి జాబితా శైలిని ఉపయోగించాం. పేర్లను గౌరవప్రదమైన, సులభంగా చదవగల తెలుగు రూపాల్లో ఇచ్చాం; మూలంలోని సామాజిక విభాగార్థాన్ని తెలియజేయడానికి ‘వంశాలు’ ఎంచుకున్నాం.
