  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: te
  text: 'కెహాతు కుమారులు, వారి వంశాల ప్రకారం: అమ్రాము, ఇశ్హారు, హెబ్రోను, ఉజ్జీయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: కహాతు కుమారులు
  rationale: בְּנֵי అనే నిర్మిత బహువచనం ఇక్కడ కహాతు కుమారులను సూచిస్తుంది. వంశావళి సందర్భంలో ఇది వంశస్థులను కూడా సూచించగలిగినా, తరువాత పేర్కొన్నవారు కహాతు వంశశాఖల మూలపురుషులుగా ఇవ్వబడినందున హెబ్రీ రూపాన్ని దగ్గరగా నిలుపుతూ ‘కుమారులు’ అని అనువదించాం. ముందు వచనంతో జాబితా కొనసాగింపును తెలుగులో సహజమైన వాక్యనిర్మాణం ద్వారా చూపించాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇశ్రాయేలు సామాజిక నిర్మాణంలోని కుటుంబ-వంశ శాఖను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుటుంబాలు’ కేవలం గృహ కుటుంబాలుగా అర్థమయ్యే అవకాశం ఉన్నందున, ఈ వంశపరమైన జాబితాలో ‘వంశాలు’ స్పష్టంగా ఉంటుంది.
- source_word: עַמְרָם
  choice: అమ్రాము
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יִצְהָר
  choice: ఇస్హారు
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగులో పలకడానికి సహజంగా, మూల ధ్వనులకు సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: ఇది ఇక్కడ స్థలపేరు కాదు, వ్యక్తిపేరు. మూలపేరును తెలుగు నామరూపంగా లిప్యంతరీకరించాం.
- source_word: עֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: హెబ్రీ వ్యక్తిపేరును మూలంలోని బలమైన జ్ ధ్వనిని ప్రతిబింబించేలా తెలుగు నామరూపంగా లిప్యంతరీకరించాం.
