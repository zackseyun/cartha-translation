  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. వ్యక్తి పేర్లను హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించి, מִשְׁפָּחָהకు సందర్భానుగుణంగా ‘వంశం’ ఎంచుకున్నాం.
