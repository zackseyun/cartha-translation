  source_fidelity: హీబ్రూ వాక్యంలోని కహాతుకు సంబంధించిన నాలుగు కుటుంబ/వంశ ఉపవిభాగాల జాబితా, అలాగే వాటిని కహాతీయుల వంశాలుగా సంగ్రహించడం నమ్మకంగా ప్రతిఫలించింది. ‘కహాతుకు చెందిన వంశాలు’ అనే ప్రవేశిక לְקְהָת (‘కహాతుకు/కహాతు విషయమై’) యొక్క వర్గీకరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
