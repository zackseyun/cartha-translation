  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: te
  text: 'కహాతుకు చెందిన వంశాలు: అమ్రామీయుల వంశం, ఇస్హారీయుల వంశం, హెబ్రోనీయుల వంశం, ఉజ్జీయేలీయుల వంశం. ఇవే కహాతీయుల వంశాలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: కహాతుకు చెందిన వంశాలు
  rationale: హీబ్రూ సంధి, సంబంధవాచక విభక్తి తదుపరి వంశవర్గాన్ని పరిచయం చేస్తున్నాయి. తెలుగులో సహజంగా ఉండేందుకు శీర్షికసదృశ నిర్మాణంలో ‘చెందిన వంశాలు’ అని స్పష్టీకరించబడింది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: జనగణన, వంశావళి సందర్భంలో ఇది పెద్ద గోత్రంలోని బంధుత్వ ఉపవిభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘వంశం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הַֽ/עַמְרָמִי
  choice: అమ్రామీయులు
  rationale: అమ్రాము సంతతిని సూచించే జాతివాచక రూపాన్ని తెలుగు బహువచన సంతతివాచకంగా ఇచ్చాం.
- source_word: הַ/יִּצְהָרִי
  choice: ఇస్హారీయులు
  rationale: ఇస్హారు సంతతిని సూచించే జాతివాచక రూపాన్ని మూలనామానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַֽ/חֶבְרֹנִי
  choice: హెబ్రోనీయులు
  rationale: హెబ్రోను సంతతిని సూచించే జాతివాచక రూపాన్ని తెలుగులో సహజమైన సంతతివాచక బహువచనంగా ఇచ్చాం.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: ఉజ్జీయేలీయులు
  rationale: ఉజ్జీయేలు సంతతిని సూచించే జాతివాచక రూపం; హీబ్రూ పేరులోని దీర్ఘ స్వర, ద్విత్వ ధ్వనులను సాధ్యమైనంతగా నిలిపాం.
- source_word: אֵלֶּה הֵם
  choice: ఇవే
  rationale: సూచక సర్వనామం, గుర్తింపునిచ్చే సర్వనామం కలిసి జాబితాను నిర్దిష్టంగా సంగ్రహిస్తున్నందున ‘ఇవే’ సంక్షిప్తంగా ఆ ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: కహాతీయుల వంశాలు
  rationale: పైన పేర్కొన్న ఉపవంశాలన్నీ కహాతు సంతతికి చెందినవని సంగ్రహించే బహువచన నిర్మాణాన్ని నిలిపాం.
