  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారం, మోషే ఇశ్రాయేలు కుమారులలోని తొలిచూలు వారందరినీ లెక్కించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు’; ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతతి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: లెక్కించాడు
  rationale: జనగణన సందర్భంలో פקד వ్యక్తులను లెక్కించడం లేదా సంఖ్య నమోదు చేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘లెక్కించాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టుగానే
  rationale: దైవ ఆజ్ఞకు మోషే చేసిన పని సరిగ్గా అనుగుణంగా ఉందనే భావాన్ని ‘ట్టుగానే’ తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: మోషే లెక్కించడానికి ముందు యెహోవా ఇచ్చిన ఆజ్ఞను సహజమైన తెలుగు అనుబంధ క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֹתוֹ
  choice: తనకు
  rationale: ఆజ్ఞను పొందిన మోషేనే సర్వనామం సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘తనకు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֶת כָּל בְּכֹר
  choice: ప్రతి తొలిచూలు సంతానాన్ని
  rationale: ‘ప్రతి’ సమగ్ర-వితరణ భావాన్ని నిలుపుతుంది. ఈ వచనంలో ‘మగ’ అని స్పష్టంగా లేకపోవడంతో దానిని చేర్చలేదు; ‘సంతానం’ వ్యక్తిని సూచించడాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోని
  rationale: בְּ ఉపసర్గకు ఈ లెక్కింపు సందర్భంలో ‘లోని’ సరిపోతుంది; ‘కుమారులు’ మూలంలోని masculine kinship పదమైన בנים ను నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు బాగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: బְּנֵי יִשְׂרָאֵל లోని లింగసూచక బంధుత్వ పదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని בנים అనే పుంలింగ బంధుత్వ పదాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన సమూహనామ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని క్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు వాక్య ప్రవాహానికి అనుగుణంగా దైవ ఆజ్ఞ భాగాన్ని ముందుకు తెచ్చాం. పాదటిప్పణి సూచిక ప్రధాన పాఠంలో స్పష్టంగా ఉంచబడింది.
