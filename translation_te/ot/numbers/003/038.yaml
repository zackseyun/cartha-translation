source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: te
  text: నివాస గుడారానికి ఎదుట, తూర్పువైపున—సమావేశ గుడారానికి ఎదుట, సూర్యోదయ దిశలో—మోషే, అహరోను, అహరోను కుమారులు మకాం వేసి ఉండేవారు. వారు ఇశ్రాయేలీయుల తరఫున పరిశుద్ధస్థలపు బాధ్యతను నిర్వర్తించేవారు. అయితే అనధికార వ్యక్తి[b] పరిశుద్ధస్థలానికి దగ్గరవుతాడో, అతనికి మరణశిక్ష విధించబడాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘తూర్పువైపున’, ‘సూర్యోదయ దిశలో’ అనే పరస్పర సంబంధమైన రెండు దిశా పదబంధాలు ఉద్ఘాటన కోసం వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అనధికార వ్యక్తి’ అంటే జాతిపరంగా విదేశీయుడు కాదు; పరిశుద్ధస్థల సేవకు లేదా దాని సమీపానికి రావడానికి అనుమతి లేని వ్యక్తి అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: మకాం వేశారు
  rationale: నిర్దిష్ట స్థలంలో నియమించబడినవారిని సూచించే substantival participle; అధ్యాయంలోని శిబిర ఏర్పాటు సందర్భంలో సహజమైన తెలుగు భూతకాల వర్ణన.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: గుడారానికి ఎదురుగా
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని సహజంగా తెలుపుతుంది; מִשְׁכָּןకు సంక్షిప్తంగా ‘గుడారం’ వాడి, తరువాతి ‘ప్రత్యక్ష గుడారం’తో భేదాన్ని నిలుపుతుంది.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: తూర్పు వైపున ... సూర్యోదయ దిశలో
  rationale: హీబ్రూలోని రెండు సంబంధిత దిశా వ్యక్తీకరణలను ఒకేలా చేయకుండా, తూర్పు దిశపై ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే, తెలుగు బైబిలు వాడుకలో గుర్తించదగిన పదబంధం.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: మోషే, అహరోను, అతని కుమారులు
  rationale: ‘అతని’ అనే ఏకవచన ప్రత్యయం సమీపంలోని అహరోనును సూచిస్తుందనే సహజ వ్యాకరణ సంబంధాన్ని నిలుపుతుంది.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: బాధ్యతను నిర్వర్తించాలి
  rationale: ఒకే మూలానికి చెందిన హీబ్రూ పదజంట వ్యక్తపరచే అప్పగించిన సంరక్షణాత్మక విధిని సహజ తెలుగులో అందిస్తుంది.
- source_word: הַמִּקְדָּשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: ఈ సందర్భంలో పవిత్ర ఆలయ ప్రాంగణం మరియు దాని సేవను విస్తృతంగా సూచిస్తుంది.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల తరఫున
  rationale: ఇశ్రాయేలు సమాజానికి సంబంధించిన పవిత్ర బాధ్యతను నియమిత నాయకులు నిర్వహిస్తున్న ప్రతినిధిత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהַזָּר הַקָּרֵב
  choice: అధికారంలేని వ్యక్తి ఎవరైనా దాని దగ్గరికి వస్తే
  rationale: זָרను జాతిపరమైన విదేశీయుడిగా కాక, పవిత్ర సేవకు చేరేందుకు అనుమతి లేని వ్యక్తిగా సందర్భానుసారంగా వ్యక్తపరుస్తుంది; קרב యొక్క చేరువ కావడం అనే భావాన్ని నిలుపుతుంది.
- source_word: יוּמָת
  choice: అతనికి మరణశిక్ష విధించాలి
  rationale: హొఫాల్ causative-passive రూపం సహజ మరణాన్ని కాక విధించబడే మరణదండనను సూచిస్తుంది.
theological_decisions:
- issue: ‘అతని కుమారులు’ అనే మాటలోని సర్వనామ సూచన
  choice: అహరోను కుమారులు
  alternative: మోషే, అహరోను ఇద్దరి కుటుంబాలకు చెందిన కుమారులు
  rationale: ‘అహరోను’ తరువాత వచ్చే ఏకవచన పురుష ప్రత్యయం సహజంగా అహరోనునే సూచిస్తుంది; యాజక బాధ్యత కూడా సందర్భంలో అహరోను కుమారులది.
- issue: పరిశుద్ధ స్థల నియమంలో זָר అర్థం
  choice: అక్కడికి చేరేందుకు అధికారం లేని వ్యక్తి
  alternative: జాతిపరమైన విదేశీయుడు లేదా సాధారణ అపరిచితుడు
  rationale: తక్షణ సందర్భం గుడారపు సేవ, యాజక బాధ్యత, ప్రవేశ పరిమితుల గురించి ఉంది; కాబట్టి ఇది జాతిని కాక అధికారాన్ని సూచిస్తుంది.
- issue: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל సంబంధం
  choice: ఇశ్రాయేలు ప్రజల తరఫున బాధ్యత నిర్వహించడం
  alternative: ఇశ్రాయేలు ప్రజలను కాపాడడం లేదా వారిపై కాపలా ఉంచడం
  rationale: మునుపటి ‘పరిశుద్ధ స్థలపు బాధ్యత’తో ఉన్న సమాంతర నిర్మాణం, సమాజానికి చెందిన ఆరాధనా బాధ్యతను నియమితులు నిర్వహిస్తున్నారని సూచిస్తుంది; అయితే సంబంధంలోని సంక్షిప్తతను అతిగా సిద్ధాంతీకరించకుండా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘గుడారం’ మరియు ‘ప్రత్యక్ష గుడారం’ మధ్య మూలంలోని పదభేదాన్ని నిలిపి, ‘బయటి వ్యక్తి’ వల్ల కలిగే జాతిపరమైన అపార్థాన్ని నివారించేందుకు ‘అధికారంలేని వ్యక్తి’ వాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
