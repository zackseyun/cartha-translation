revisions:
- from: గుడారానికి ఎదురుగా తూర్పు వైపున[a], అంటే సూర్యోదయ దిశలో ప్రత్యక్ష గుడారానికి ఎదురుగా మోషే, అహరోను, అతని కుమారులు మకాం వేశారు. వారు ఇశ్రాయేలు ప్రజల తరఫున పరిశుద్ధ స్థలపు బాధ్యతను నిర్వర్తించాలి. అయితే అధికారంలేని వ్యక్తి ఎవరైనా దాని దగ్గరికి వస్తే అతనికి మరణశిక్ష విధించాలి.[b]
  to: నివాస గుడారానికి ఎదుట, తూర్పువైపున—సమావేశ గుడారానికి ఎదుట, సూర్యోదయ దిశలో—మోషే, అహరోను, అహరోను కుమారులు మకాం వేసి ఉండేవారు. వారు ఇశ్రాయేలీయుల తరఫున పరిశుద్ధస్థలపు బాధ్యతను నిర్వర్తించేవారు. అయితే అనధికార వ్యక్తి[b] పరిశుద్ధస్థలానికి దగ్గరవుతాడో, అతనికి మరణశిక్ష విధించబడాలి.[a]
  rationale: The revision restores the descriptive force of the Hebrew participles, keeps the sanctuary approach explicit, uses distinct Telugu terms for the tabernacle and tent of meeting, and relocates the cultural-note anchor to the term it explains. The directional footnote anchor is retained at the end of the sentence because both directional expressions occur within the intervening appositional phrase.
  reviewer_model: gpt-5.6-terra
