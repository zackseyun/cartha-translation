source:
  edition: WLC
  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: te
  text: మరియు మెరారీ వంశాల పితృకుటుంబపు నాయకుడు అబీహయీలు కుమారుడైన సూరీయేలు. వారు నివాసమందిరానికి ఉత్తర వైపున విడిది చేయవలసి ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: నాయకుడు
  rationale: నָשִׂיא ఇక్కడ వంశపరమైన వ్యవస్థలో గుర్తింపు పొందిన అధిపతిని సూచిస్తుంది. ఆధునిక తెలుగులో రాజరిక భావం కలిగించే పదం కంటే ‘నాయకుడు’ సహజంగా, సందర్భోచితంగా ఉంది; వావ్‌ను ప్రత్యేకంగా ‘మరియు’ అని ఇవ్వకుండా జాబితా కొనసాగింపుగా గ్రహించాం.
- source_word: בֵית אָב
  choice: పితృకుటుంబం
  rationale: అక్షరార్థంగా ‘తండ్రి ఇల్లు’; ఇక్కడ పితృవంశ క్రమంలోని విస్తృత కుటుంబ/వంశ విభాగాన్ని సూచిస్తుంది. ‘పితృకుటుంబం’ మూలంలోని బంధుత్వ నిర్మాణాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: మెరారి వంశాల
  rationale: మִשְׁפָּחוֹת ఇక్కడ గోత్రంలోని వంశ విభాగాలను సూచిస్తుంది. లְ ఉపసర్గాన్ని తెలుగు సంబంధ నిర్మాణంలో సహజంగా విలీనం చేశాం.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: అబీహయిలు కుమారుడైన సూరీయేలు
  rationale: తెలుగు వాక్యక్రమానికి అనుగుణంగా ‘అబీహయిలు కుమారుడు’ అనే వంశావళి సంబంధాన్ని పేరు ముందు ఉంచాం; వ్యక్తి పేర్లను తెలుగు బైబిలు నామరూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: నివాసమందిరానికి ఉత్తరం వైపున
  rationale: יֶרֶךְ అంటే పక్క/ప్రక్కభాగం; צָפֹנָה దిశను నిర్దేశిస్తుంది. రెండింటినీ సహజ తెలుగులో ‘ఉత్తరం వైపున’గా కలిపాం. מִשְׁכָּן యొక్క ‘నివసించే స్థలం’ భావాన్ని ‘నివాసమందిరం’ కాపాడుతుంది.
- source_word: יַחֲנוּ
  choice: విడిది చేయాలి
  rationale: ఈ అసంపూర్ణ క్రియారూపం శిబిర ఏర్పాటుకు నిర్దేశించిన స్థానాన్ని తెలియజేస్తుంది. ‘చేయాలి’ ఆ నియామక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
