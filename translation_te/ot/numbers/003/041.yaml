  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులలోని[a] ప్రతి తొలిపుట్టినవానికి బదులుగా లేవీయులను నాకోసం తీసుకో; నేను యాహ్వేను. అలాగే ఇశ్రాయేలు కుమారుల పశువులలోని ప్రతి తొలిపుట్టిన దానికి బదులుగా లేవీయుల పశువులను తీసుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులలోని.’ హీబ్రూలో, ‘ఇశ్రాయేలు కుమారులలోని’ అని ఉంది.
    reason: హీబ్రూ בִּבְנֵי יִשְׂרָאֵל కు ఆంగ్ల POB audit trailలో ఇచ్చిన పదార్థ ప్రత్యామ్నాయాన్ని ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తీసుకో
  rationale: సంయోజకంతో కూడిన Qal perfect 2ms ఈ ఆదేశ సందర్భంలో మోషేకు ఇచ్చిన ప్రత్యక్ష విధిగా పనిచేస్తుంది; ఆధునిక తెలుగులో ‘తీసుకో’ సహజమైన ఆజ్ఞారూపం.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి వంశీయుల గుంపుకు తెలుగులో స్థిరపడిన రూపం; నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: לִי
  choice: నా కోసం
  rationale: ఇక్కడ సమర్పణ లేదా ప్రత్యేక స్వాధీనతను సూచిస్తుంది; ‘నా కోసం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేనే యెహోవాను
  rationale: దైవ స్వీయగుర్తింపు సూత్రంలోని ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయలేదు.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఈ లెక్కింపు, ప్రతిస్థాపన సందర్భంలో మరొకరి స్థానాన్ని తీసుకోవడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: כָּל בְּכֹר
  choice: ప్రతి తొలిచూలు కుమారుడు / ప్రతి తొలిచూలు దాని
  rationale: כָּל + ఏకవచనం యొక్క విభజనాత్మక భావాన్ని ‘ప్రతి’ నిలుపుతుంది. మొదటి సందర్భంలో మానవ మగ తొలిసంతానం కావడం వల్ల ‘కుమారుడు’ స్పష్టం చేయబడింది; పశువుల సందర్భంలో లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘దాని’ వాడబడింది.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోని
  rationale: హీబ్రూ పదబంధంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతూ, సమూహంలోనివారనే సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: లేవీయుల పశువులను
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు జంతువుల సమూహాన్ని సూచిస్తుంది; ‘పశువులు’ సాధారణ ఆధునిక తెలుగు సమూహపదం.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తిగత నామరూపం ‘యెహోవా’ను వాడి, దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; ఉచ్చారణ పునర్నిర్మాణంలోని అనిశ్చితిని పాదసూచికలో తెలిపాం.
- issue: בְּנֵי יִשְׂרָאֵל రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగ బహువచన రూపాన్ని నిలిపి, జాతీయ సమూహార్థాన్ని మరింత సాధారణీకరించే ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞాశైలిని ఉపయోగించాం. మానవులు మరియు పశువుల మధ్య ఉన్న సమాంతర నిర్మాణాన్ని నిలిపాం; మధ్యలోని దైవ స్వీయగుర్తింపును డాష్‌లతో వేరు చేశాం. ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు కుమారులు’ అనే మూలానికి సమీపమైన రూపం ఉంచబడింది.
