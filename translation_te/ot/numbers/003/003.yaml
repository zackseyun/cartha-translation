  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: te
  text: యాజకులుగా సేవ చేయడానికి వారి చేతిని నింపిన అభిషేకించబడిన యాజకులైన అహరోను కుమారుల పేర్లు ఇవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారి చేతిని నింపిన.” ఇది యాజక సేవ కోసం వారిని నియమించడం లేదా ప్రతిష్ఠించడం అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారుల పేర్లు ఇవి
  rationale: హీబ్రూ పరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో అందిస్తుంది; בְּנֵי పురుష సంతానాన్ని సూచిస్తున్నందున ‘కుమారులు’ అని ఉంచబడింది.
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: అభిషేకించబడిన యాజకులు
  rationale: రెండు నిర్దిష్ట బహువచన పదాలు అహరోను కుమారులను సమానాధికరణంగా వివరిస్తాయి; משׁח సూచించే అభిషేక క్రియను ‘ప్రతిష్ఠించబడిన’ అనే విస్తృత భావంతో మార్చకుండా నిలుపుతుంది.
- source_word: מִלֵּא יָדָם
  choice: వారి చేతులు నింపబడ్డాయి
  rationale: యాజక సేవలో నియమించే ఆచారానికి సంబంధించిన హీబ్రూ నుడికారంలోని స్పష్టమైన ‘చేతులు నింపడం’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. క్రియ ఏకవచన కర్తృవాచక రూపంలో ఉన్నా కర్త పాఠ్యంలో వ్యక్తం కాలేదు; తెలుగులో కర్తను ఊహించి చేర్చకుండా కర్మణి రూపం వాడబడింది.
- source_word: לְכַהֵן
  choice: యాజకులుగా సేవ చేయడానికి
  rationale: ఈ క్రియ యొక్క ఉద్దేశ్యార్థాన్ని, యాజక బాధ్యతను నిర్వర్తించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מִלֵּא יָדָם అనే యాజక నియామక నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘వారి చేతులు నింపబడ్డాయి’ అని రూపకాన్ని నిలిపి, పాదటిప్పణిలో దాని భావాన్ని వివరించడం
  alternative: ‘వారు యాజకులుగా నియమించబడ్డారు’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: భావానువాదం సాధారణ పాఠకునికి వెంటనే స్పష్టమైనా, మూలంలోని ప్రత్యేక యాజక ఆచార నుడికారాన్ని దాచేస్తుంది. రూపకాన్ని ఉంచి వివరణ ఇవ్వడం మూలానికి పారదర్శకతను, పాఠకునికి స్పష్టతను రెండింటినీ కాపాడుతుంది.
- issue: מִלֵּא క్రియలో వ్యక్తం కాని కర్త
  choice: తెలుగులో కర్తను పేర్కొనని కర్మణి నిర్మాణం
  alternative: ‘అతడు వారి చేతులను నింపాడు’ లేదా ‘మోషే వారి చేతులను నింపాడు’
  rationale: మూల క్రియ కర్తృవాచక ఏకవచనమైనప్పటికీ ఈ వాక్యంలో కర్త స్పష్టంగా పేర్కొనబడలేదు. ‘మోషే’ అని చేర్చడం సందర్భాధారిత వివరణ అవుతుంది; ‘అతడు’ అనడం తెలుగులో అస్పష్టంగా ఉంటుంది. కర్మణి రూపం ఆ కర్త-అవ్యక్తతను సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అభిషేకించబడిన’, ‘యాజకులు’ వంటి స్థిర బైబిలు పదజాలాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత నుడికారానంతరం ఉంచబడింది.
