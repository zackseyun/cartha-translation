- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే మాటలను పరిచయం చేసే హీబ్రూ ప్రసంగ సూత్రాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా వ్యక్తిగత దైవ నామం ఉంది. అందువల్ల దానిని ‘యాహ్వే’గా లిప్యంతరీకరించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘పలికాడు’ దైవిక ప్రసంగ సందర్భానికి తగిన గంభీరతను ఇస్తుంది; ‘ఇలా’ తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని సూచిస్తుంది.
