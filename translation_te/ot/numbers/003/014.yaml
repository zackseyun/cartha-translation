lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన సూత్రానికి గంభీరమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: יְהוָה
