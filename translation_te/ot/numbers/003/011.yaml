    text: లేదా, “మరియు యాహ్వే మోషేతో ఇలా చెప్పాడు.” హీబ్రూలోని మొదటి సంధిపదాన్ని “మరియు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; అందువల్ల ‘అప్పుడు’ సహజమైన తెలుగు సమానం. דּבר అనే క్రియను ఈ ప్రత్యక్షవాక్య పరిచయ సూత్రంలో ‘అన్నాడు’ అని ఇవ్వడం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל దిశను లేదా సంబోధిత వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘మోషేతో’ సహజమైన ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: తరువాత వచ్చే దైవవాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజమైన ‘ఇలా అన్నాడు’ రూపంలో వ్యక్తపరిచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను ఉంచాం; మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన ప్రవాహానికి ‘అప్పుడు’, తదుపరి వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా అన్నాడు’ వాడాం. భాష సరళంగా, గౌరవప్రదంగా ఉంది.
