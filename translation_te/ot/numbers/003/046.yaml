  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల తొలిపుట్టినవారిలో లేవీయుల సంఖ్యను మించిన 273 మంది విమోచన మూల్యాన్ని,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ 273 మంది విమోచితులను.” హీబ్రూ రూపాన్ని మరింత అక్షరార్థంగా ఇలా తీసుకోవచ్చు. అయితే వెంటనే వచ్చే సందర్భం మిగులు తొలిపుట్టినవారి కోసం చెల్లించాల్సిన మూల్యాన్ని గురించి చెబుతుంది (47–48 వచనాలు); అందువల్ల ఇక్కడ “విమోచన మూల్యం” సందర్భ భావాన్ని బాగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: విమోచన మూల్యంగా
  rationale: ఈ రూపాన్ని అక్షరార్థంగా ‘విమోచించబడినవారు’ అని తీసుకోవచ్చు. అయితే వెంటనే వచ్చే వచనాలు మిగులు తొలిపుట్టినవారి కోసం చెల్లించాల్సిన మొత్తాన్ని వివరిస్తున్నందున, సందర్భానుసారంగా ‘విమోచన మూల్యం’ అనే భావం సహజంగా సరిపోతుంది.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: 273 మంది
  rationale: హీబ్రూలో సంఖ్యను కూడిక రూపంలో చెప్పినా, తెలుగులో అంకెలతో ఇవ్వడం ఖచ్చితమైన సంఖ్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: లేవీయుల సంఖ్యకు మించి ఉన్న
  rationale: ఈ పదబంధం ప్రత్యామ్నాయంగా నిలిచిన లేవీయుల సంఖ్యకంటే అధికంగా మిగిలినవారిని సూచిస్తుంది. ‘సంఖ్యకు మించి ఉన్న’ అనేది పోలిక మరియు మిగులు అనే రెండు భావాలనూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల తొలిపుట్టినవారిలో
  rationale: מִן యొక్క భాగసూచక భావాన్ని ‘లో’ తెలియజేస్తుంది; בני ישראל అనే ఒడంబడిక సంబంధిత పదబంధాన్ని ‘ఇశ్రాయేలు కుమారులు’గా లింగసూచకంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది 45వ వచనంలో ప్రారంభమైన ఆజ్ఞలో కొనసాగుతున్న అసంపూర్ణ ఉపవాక్యం కాబట్టి, మూలంలోని వాక్యనిర్మాణ కొనసాగింపును సూచించేందుకు చివర కామా ఉంచబడింది. ‘ఇశ్రాయేలు కుమారులు’ ద్వారా בני ישראל యొక్క రూపాన్ని నిలుపుతూ, ‘లేవీయుల సంఖ్యకు మించి’ అని సహజ తెలుగులో సంబంధాన్ని స్పష్టం చేశాం.
