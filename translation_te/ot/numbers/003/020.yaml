source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: te
  text: 'మెరారీ కుమారులు, వారి వంశాల ప్రకారం: మహ్లీ మరియు మూషీ. ఇవే వారి పితృకుటుంబాల ప్రకారం లేవీయుల వంశాలు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేవి వంశాలు.” హీబ్రూలో “లేవీయుడు” అనే ఏకవచన జాతివాచక రూపం ఉంది; అది సమూహంగా లేవీయులను సూచించవచ్చు, లేదా గోత్రపిత అయిన లేవిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: మెరారి కుమారులు
  rationale: בְּנֵי అనే వంశావళి పదానికి సహజమైన ‘కుమారులు’ను వాడి, וְ సంధిని జాబితా ప్రవాహంలో ప్రత్యేకంగా అనువదించలేదు; מְרָרִי అనే పేరును ‘మెరారి’గా లిప్యంతరీకరించాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: לְ ఇక్కడ వర్గీకరణ భావాన్ని ఇస్తుంది; מִשְׁפָּחוֹת గోత్రంలోని బంధుత్వ విభాగాలను సూచించేందున ‘వంశాలు’ సహజంగా సరిపోతుంది.
- source_word: מַחְלִי וּמוּשִׁי
  choice: మహలి, మూషి
  rationale: వ్యక్తినామాలను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, జాబితాలో సహజమైన విరామంతో ఇచ్చాం.
- source_word: אֵלֶּה הֵם
  choice: ఇవే
  rationale: సూచకపదం మరియు సర్వనామం కలిగిన గుర్తింపు వాక్యంలోని ఉద్ఘాటనను సంక్షిప్తమైన, సహజమైన తెలుగు రూపం ‘ఇవే’ నిలుపుతుంది.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: లేవీయుల వంశాలు
  rationale: మూలంలోని הַלֵּוִי ఏకవచన జాతివాచక రూపమైనప్పటికీ సందర్భంలో సమూహార్థం సహజం; ప్రధాన పాఠంలో స్పష్టమైన తెలుగు బహువచనం వాడి, మూలరూపంలోని సందిగ్ధతను పాదసూచికలో తెలిపాం.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ పితృ కుటుంబాల ప్రకారం
  rationale: בֵּית אָבוֹת అనే వంశపారంపర్య-పరిపాలనా పదబంధాన్ని ఆధునిక తెలుగులో అర్థమయ్యేలా ‘పితృ కుటుంబాలు’గా, వర్గీకరణను సూచించే לְ ను ‘ప్రకారం’గా అనువదించాం.
theological_decisions:
- issue: הַלֵּוִי అనే ఏకవచన జాతివాచక పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో సమూహార్థంగా ‘లేవీయుల’
  alternative: ‘లేవి వంశాలు’ లేదా అక్షరార్థంగా ‘లేవీయుని వంశాలు’
  rationale: బహువచనమైన ‘వంశాలు’తో కూడిన జాబితా సందర్భంలో సమూహార్థం సహజం. అయినా ఇది గోత్రపిత లేవిని సూచించే అవకాశాన్ని మూసివేయకుండా పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని పాటించాం. ‘వంశాలు,’ ‘పితృ కుటుంబాలు’ అనే పదాలు గోత్ర సంబంధిత విభాగాలను సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తాయి; మూలంలోని ఏకవచన జాతివాచక సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
