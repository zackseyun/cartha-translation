  source_fidelity: 'భావం మొత్తంగా మూలానికి నమ్మకంగా ఉంది: మెరారీ వంశంలోని మహ్లీ, మూషీని పేర్కొని, వాటిని లేవీయుల వంశాలుగా వర్గీకరిస్తుంది. అయితే వ్యక్తినామాలలో చివరి దీర్ఘ ‘ీ’ మూల హీబ్రూ ఉచ్చారణకు మరింత సమీపంగా ఉండాలి. అలాగే చివరి వర్గీకరణ పదబంధంలో ‘తమ’కు స్పష్టమైన సూచ్యపదం లేకపోవడం నివారించాలి.'
