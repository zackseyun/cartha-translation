  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה). సంప్రదాయంగా కొన్ని అనువాదాల్లో ‘ప్రభువు’ అని అనువదిస్తారు; దీనిని ‘యాహ్వే’ అని లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అనే క్రియ ఇక్కడ దైవవాక్యాన్ని పరిచయం చేసే సాధారణ కథన సూత్రంలో ఉంది. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘అన్నాడు’ తదుపరి ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది; అయితే మూలంలోని אמרతో ఉన్న రూపభేదం తెలుగులో పూర్తిగా నిలవదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో אֶל సూచించే సంబోధితుణ్ణి ఆధునిక తెలుగులో సహజంగా ‘మోషేతో’ అని వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వాక్యంలోని విషయాన్ని పరిచయం చేసే హీబ్రూ infinitive constructను తెలుగులో సహజమైన ‘ఇలా’తో తెలిపాం; ద్వంద్వంగా వినిపించే ‘చెబుతూ’ అనే రూపాన్ని నివారించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితంగా లేనందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సహజంగా ఉండే దైవవాక్య పరిచయ సూత్రం. తరువాతి వాక్యంతో అనుసంధానాన్ని చూపేందుకు చివరలో ద్విబిందువు వాడాం.
