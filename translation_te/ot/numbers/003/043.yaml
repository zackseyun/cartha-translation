id: NUM.3.43
reference: Numbers 3:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: te
  text: పేరు పేరున లెక్కించిన, ఒక నెల వయసు నుంచీ అంతకంటే ఎక్కువ వయసున్న మగ తొలిచూలు అందరి సంఖ్య, వారి లెక్కింపు ప్రకారం, ఇరవై రెండు వేల మూడు వందల డెబ్బై మూడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: సంఖ్య మొత్తం ...
  rationale: ఈ క్రియ జనగణనలో తేలిన మొత్తాన్ని పరిచయం చేస్తుంది. తెలుగు సహజ వాక్య నిర్మాణంలో చివర ‘సంఖ్య మొత్తం’తో ఫలితాన్ని తెలిపాం.
- source_word: כָל בְּכוֹר זָכָר
  choice: మగ తొలిచూలు వారందరి
  rationale: ‘అందరు’ అనే సమగ్ర భావాన్ని, పురుష లింగాన్ని, మొదట పుట్టినవారు అనే భావాన్ని నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేరు పేరున లెక్కించబడిన
  rationale: ఇది అంచనా సంఖ్య కాకుండా ప్రతి వ్యక్తిని పేరుతో నమోదు చేసి లెక్కించిన జనగణన ప్రయోగమని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: జనగణనకు వర్తించే కనిష్ఠ వయోపరిమితిని స్పష్టంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: לִפְקֻדֵיהֶם
  choice: సంఖ్య మొత్తం
  rationale: వారి అధికారిక లెక్కింపు లేదా నమోదులో తేలిన మొత్తాన్ని సూచిస్తుంది. ముందున్న పేరువారీ లెక్కింపు భావంతో కలిపి తెలుగులో అనవసర పునరుక్తి లేకుండా అందించబడింది.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: ఇరవై రెండు వేల మూడు వందల డెబ్బై మూడు
  rationale: హీబ్రూ సంఖ్యా భాగాల మొత్తం 22,373; ఆధునిక తెలుగు సంఖ్యా క్రమంలో స్పష్టంగా ఇచ్చాం.
