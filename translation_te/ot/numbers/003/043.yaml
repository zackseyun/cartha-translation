translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘పేరు పేరున’ అనే సహజ ప్రయోగం ద్వారా హీబ్రూ జనగణన నుడికారాన్ని స్పష్టం చేశాం.
