source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: te
  text: 'యహ్వే సీనాయి పర్వతంపై మోషేతో[c] మాట్లాడిన సమయంలో[b] అహరోను, మోషేల తరాల వివరాలు[a] ఇవి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహరోను, మోషేల సంతతి.’ ఇక్కడి హీబ్రూ పదం కుటుంబ పరంపరను లేదా ఒకరి నుంచి కొనసాగిన వారి వృత్తాంతాన్ని పరిచయం చేసే శీర్షికగా వాడబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘ఆ దినంలో’; ఇది ‘ఆ సమయంలో’ లేదా ‘అప్పుడు’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మోషేకు.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ఇదే
  rationale: కొత్త విభాగాన్ని పరిచయం చేసే హీబ్రూ సూచనాత్మక సూత్రాన్ని సహజమైన తెలుగు శీర్షికా నిర్మాణంలో నిలుపుతుంది.
- source_word: תּוֹלְדֹת
  choice: తరాల వృత్తాంతం
  rationale: ఈ పదం వంశపరంపరను గానీ, ఒకరి నుంచి కొనసాగిన వారి వివరాలను గానీ పరిచయం చేయగలదు. ‘తరాలు’ అనే మూల భావాన్ని ఉంచుతూ, తెలుగులో శీర్షికగా సహజంగా ఉండేందుకు ‘వృత్తాంతం’ చేర్చబడింది.
- source_word: אַהֲרֹן וּ/מֹשֶׁה
  choice: అహరోను, మోషే
  rationale: మూలంలో ఇద్దరి పేర్లూ స్పష్టంగా ఉన్నందున, తరువాతి జాబితా ప్రధానంగా అహరోను కుమారులపై కేంద్రీకృతమైనా ఇద్దరి పేర్లను అలాగే ఉంచింది.
- source_word: בְּ/י֗וֹם
  choice: కాలంలో
  rationale: అక్షరార్థంగా ‘దినంలో’ అయినా, ఇక్కడ అది ‘ఆ సమయంలో’ లేదా ‘అప్పుడు’ అనే హీబ్రూ కాలసూచక నుడికారం. ఆధునిక తెలుగులో సహజంగా ‘కాలంలో’ అని అనువదించబడింది.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: మోషేతో మాట్లాడిన
  rationale: דבר తో కూడిన אֶת వ్యక్తిని ఉద్దేశించి మాట్లాడడాన్ని సూచిస్తుంది; ‘మోషేతో’ సంభాషణాత్మక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది, అయితే ‘మోషేకు’ కూడా సాధ్యమే.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּ/הַר סִינָי
  choice: సీనాయి పర్వతం మీద
  rationale: భౌగోళిక స్థలాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: అహరోను, మోషే ఇద్దరినీ పేర్కొనే תּוֹלְדֹת శీర్షిక పరిధి
  choice: అహరోను, మోషేల తరాల వృత్తాంతం
  alternative: అహరోను, మోషేల సంతతి; అహరోను వంశావళి
  rationale: తదుపరి భాగం ప్రధానంగా అహరోను కుమారులను పేర్కొన్నప్పటికీ, హీబ్రూ శీర్షిక ఇద్దరి పేర్లనూ కలుపుతుంది. అనువాదం ఆ ఉద్రిక్తతను తొలగించకుండా అలాగే ఉంచుతుంది.
- issue: דִּבֶּר ... אֶת మోషే సంబంధం
  choice: మోషేతో మాట్లాడిన
  alternative: మోషేకు చెప్పిన
  rationale: హీబ్రూ నిర్మాణం ‘తో’ లేదా ‘కు’ అనే రెండింటికీ అనువాద అవకాశాన్ని ఇస్తుంది; ప్రధాన పాఠం సంభాషణ భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శీర్షికా శైలి ఉపయోగించబడింది. ‘తరాల వృత్తాంతం’ హీబ్రూ సూత్రంలోని వంశపరమైన భావాన్ని నిలుపుతూ, కేవలం జీవసంబంధ సంతతికే అర్థాన్ని పరిమితం చేయదు. చివరి దీర్ఘరేఖ తరువాతి వచనాల్లో వచ్చే జాబితాకు ఈ వాక్యం శీర్షికగా పనిచేస్తుందని సూచిస్తుంది.
