  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన/వంశావళి జాబితాకు తగిన గంభీరమైన కానీ సులభమైన శైలి. పేర్ల లిప్యంతరీకరణలో హీబ్రూ రూపాలకు సమీపంగా ‘గేర్షోను,’ ‘లిబ్నీ,’ ‘షిమీ’ ఆధారిత జనసమూహ రూపాలు వాడబడ్డాయి.
