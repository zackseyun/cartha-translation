translation:
  language: te
  text: గేర్షోనుకు చెందినవి లిబ్నీయుల వంశమూ షిమీయుల వంశమూ; ఇవే గేర్షోనీయుల వంశాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: గేర్షోనుకు … చెందినవి
  rationale: లְ ఉపసర్గం ఇక్కడ జనగణన జాబితాలో సంబంధాన్ని లేదా అనుబంధాన్ని సూచిస్తుంది. తెలుగులో ‘గేర్షోనుకు … చెందినవి’ అనడం సహజంగా ఉండి ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: వంశం / వంశాలు
  rationale: ఇక్కడ מִשְׁפָּחָה గోత్రం కంటే చిన్నదైన విస్తృత బంధుత్వ సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుటుంబం’ కంటే ‘వంశం’ ఈ జనావళి సందర్భానికి తగినది; ‘గోత్రం’ అయితే అతి విస్తృతమైన సమూహాన్ని సూచించవచ్చు.
- source_word: הַלִּבְנִי
  choice: లిబ్నీయుల
  rationale: ఈ నిస్బా రూపం లిబ్నీ సంతతి సమూహాన్ని సూచిస్తుంది. ‘లిబ్నీయుల’ అనే రూపం ఆ వంశసంబంధ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַשִּׁמְעִי
  choice: షిమీయుల
  rationale: ఈ నిస్బా రూపం షిమీ సంతతి సమూహాన్ని సూచిస్తుంది. ‘షిమీయుల’ అనేది పేరుతో సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֵלֶּה הֵם
  choice: ఇవే
  rationale: హీబ్రూ గుర్తింపు సూత్రంలోని ఉద్ఘాటనను తెలుగులో సంక్షిప్తంగా, సహజంగా ‘ఇవే’ వ్యక్తపరుస్తుంది.
- source_word: הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుల
  rationale: ఈ నిస్బా రూపం గేర్షోను నుండి వచ్చిన విస్తృత లేవీయ శాఖను సూచిస్తుంది. ‘గేర్షోనీయుల’ ఆ వంశపరమైన గుర్తింపును నిలుపుతుంది.
