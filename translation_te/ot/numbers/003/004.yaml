  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: te
  text: కానీ నాదాబు, అబీహూ సీనాయి అరణ్యంలో యాహ్వే సన్నిధిలో అన్యమైన అగ్నిని అర్పించినప్పుడు, యాహ్వే సన్నిధిలో చనిపోయారు.[a] వారికి కుమారులు లేరు. ఎలియాజరు, ఈతామారు తమ తండ్రి అహరోను సమక్షంలో యాజకులుగా సేవచేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరైన’ లేదా ‘విదేశీ అగ్ని.’ ఇక్కడ అర్పణకు అనుమతించబడని అగ్నిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ తండ్రి అహరోను ఎదుట’ అని కూడా అనువదించవచ్చు; ఎలియాజరు, ఈతామారు అహరోను జీవించి ఉన్న కాలంలో యాజకులుగా సేవచేశారనే భావం కూడా ఈ హీబ్రూ ప్రయోగంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయారు
  rationale: מות క్రియ ఇక్కడ మరణ సంఘటనను నేరుగా వర్ణిస్తుంది; నాదాబు, అబీహులు అనే సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచనం వాడబడింది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఈ హీబ్రూ ప్రయోగం ‘యెహోవా ఎదుట/సన్నిధిలో’ అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘సన్నిధిలో’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించబడింది.
- source_word: בְּהַקְרִבָם
  choice: అర్పించినప్పుడు
  rationale: קרב యొక్క ఇన్ఫినిటివ్ నిర్మాణం సంఘటన జరిగిన సందర్భం లేదా సమయాన్ని సూచిస్తుంది; బల్యారాధన సందర్భంలో ‘అర్పించినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: אֵשׁ זָרָה
  choice: అనుమతి లేని అగ్ని
  rationale: זרה పదానికి అక్షరార్థంగా ‘అన్యమైన/వేరైన’ అనే భావం ఉన్నప్పటికీ, ఈ ఆరాధనా సందర్భంలో నియమించబడని లేదా అనుమతించబడని అగ్నిని సూచించే అవకాశముంది. ప్రధాన పాఠంలో అర్థస్పష్టతకు ‘అనుమతి లేని’ అని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּמִדְבַּר סִינַי
  choice: సీనాయి అరణ్యంలో
  rationale: స్థలనామాన్ని మరియు מִדְבָּר యొక్క అరణ్య భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: వారికి కుమారులు లేరు
  rationale: בנים ఇక్కడ ప్రత్యేకంగా ‘కుమారులు’ అని అర్థం; యాజకత్వ వారసత్వ సందర్భంలో ఈ నిర్దిష్టతను నిలిపాం.
- source_word: וַיְכַהֵן
  choice: యాజకులుగా సేవచేశారు
  rationale: כהן అంటే యాజక విధిని నిర్వహించడం. సంయుక్త కర్తకు అనుగుణంగా బహువచన రూపం వాడబడింది.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: తమ తండ్రి అహరోను సమక్షంలో
  rationale: ఈ ప్రయోగం ‘ఎదుట/సమక్షంలో’ అనే స్థల లేదా సంబంధ భావాన్ని, అలాగే అతని జీవితకాలంలో అనే కాలసూచనను కలిగి ఉండవచ్చు. ప్రధాన పాఠం హీబ్రూ రూపకాన్ని అధికంగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: אֵשׁ זָרָה యొక్క ఆరాధనా భావం
  choice: అనుమతి లేని అగ్ని
  alternative: అన్యమైన అగ్ని
  rationale: పదబంధం ఏ విధంగా ‘వేరైనది’ అనే విషయాన్ని ఈ వాక్యం మాత్రమే పూర్తిగా వివరించదు. సందర్భం దైవానుమతి లేమిని సూచించినా, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి ఉద్వేగాన్ని కాపాడాం.
- issue: עַל פְּנֵי אַהֲרֹן యొక్క సంబంధం
  choice: అహరోను సమక్షంలో
  alternative: అహరోను జీవించి ఉన్న కాలంలో
  rationale: హీబ్రూ ప్రయోగం సమక్షతను లేదా సమకాలీనతను సూచించవచ్చు. ప్రధాన పాఠం ‘సమక్షంలో’ అని ఉంచి, కాలార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. దైవనామానికి ‘యెహోవా’, priestly service‌కు ‘యాజకులుగా సేవచేశారు’ వాడబడ్డాయి. మూలంలోని రెండు సాధ్యమైన అస్పష్టతలు పాదసూచికల్లో నిలుపబడ్డాయి.
