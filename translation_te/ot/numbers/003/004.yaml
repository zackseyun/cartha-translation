revisions:
- from: అయితే నాదాబు, అబీహులు సీనాయి అరణ్యంలో యెహోవా సన్నిధిలో అనుమతి లేని అగ్నిని అర్పించినప్పుడు, యెహోవా సన్నిధిలోనే చనిపోయారు.[a] వారికి కుమారులు లేరు. ఎలియాజరు, ఈతామారు తమ తండ్రి అహరోను సమక్షంలో యాజకులుగా సేవచేశారు.[b]
