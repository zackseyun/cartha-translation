translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని శిబిర స్థానం మరియు నిర్దేశక క్రియాభావం నిలుపబడ్డాయి. తెలుగు పాఠకునికి అపారదర్శకంగా ఉండే ‘సముద్రం వైపు’ అనే హీబ్రూ నుడికారానికి బదులుగా దాని సందర్భార్థమైన ‘పడమటి వైపున’ వాడబడింది.
