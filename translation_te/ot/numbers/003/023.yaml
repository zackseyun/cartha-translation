  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: te
  text: గేర్షోనీయుల వంశాలు నివాస గుడారానికి వెనుకగా, పడమటి వైపు మకాం వేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: సంఖ్యాకాండంలోని గోత్ర, జనగణన సందర్భంలో ఈ పదం పెద్ద లేవీయ సమూహంలోని వంశాధారిత ఉపవిభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కుటుంబాలు’ కంటే ‘వంశాలు’ ఆ సామూహిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుల
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ గేర్షోను సంతతివారిని సమూహంగా సూచిస్తుంది; ‘గేర్షోనీయులు’ ఆ సామూహిక అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: אַחֲרֵי
  choice: వెనుక
  rationale: ఇక్కడ ఇది కాలసంబంధమైన ‘తర్వాత’ అనే అర్థంలో కాకుండా, శిబిర స్థానం తెలిపే ప్రదేశార్థంలో ఉంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు గుడారం
  rationale: ఈ సందర్భంలో పదం దేవుని పవిత్ర గుడారాన్ని సూచిస్తుంది; ‘మందిరపు గుడారం’ సాధారణ పాఠకునికి దాని ఆరాధనా సంబంధమైన ప్రత్యేకతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַחֲנוּ
  choice: మకాం వేయాలి
  rationale: అసంపూర్ణ క్రియ ఇక్కడ నియమించబడిన శిబిర ఏర్పాటును సూచిస్తుంది; ‘వేయాలి’ ఆ నిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יָמָּה
  choice: పడమటి వైపున
  rationale: ఇది అక్షరార్థంగా ‘సముద్రం వైపుకు’ అయినా, బైబిలు హీబ్రూలో పడమటిని సూచించే స్థిర దిశావాచక ప్రయోగం; సందర్భంలో స్థానం ప్రధానమైనందున ‘పడమటి వైపున’ స్పష్టంగా ఉంటుంది.
