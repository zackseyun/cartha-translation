  to: ప్రతి వ్యక్తికి, పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం, ఐదేసి షెకెల్లు తీసుకోవాలి[a]; ఒక షెకెలు ఇరవై గేరాలు[b].
  rationale: The revision retains the directive and distributive force of the Hebrew while placing the sanctuary-shekel phrase where it naturally modifies the required amount. It renders the final clause as the stated weight equivalence, in line with the source context and the English audit trail. The lexical footnote now gives a genuinely more literal alternative.
