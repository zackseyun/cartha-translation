source:
  edition: WLC
  text: וְ/לָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַ/גֻּלְגֹּ֑לֶת בְּ/שֶׁ֤קֶל הַ/קֹּ֨דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַ/שָּֽׁקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: te
  text: ప్రతి వ్యక్తికి, పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం, ఐదేసి షెకెల్లు తీసుకోవాలి[a]; ఒక షెకెలు ఇరవై గేరాలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక్కో తలకు ఐదు షెకెల్లు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, పరిశుద్ధస్థలంలో ఉపయోగించిన ప్రామాణిక తూకం ప్రకారం; ఒక షెకెలు ఇరవై గేరాలకు సమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తీసుకోవాలి
  rationale: ఆజ్ఞాత్మక సందర్భంలోని క్రియను ఆధునిక తెలుగు నియమాత్మక శైలిలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: ఐదేసి షెకెల్లు
  rationale: ‘ఐదు’ అనే పదపు పునరుక్తిలో ఉన్న పంపిణీ భావాన్ని తెలుగు ‘ఐదేసి’ సహజంగా తెలియజేస్తుంది.
- source_word: לַגֻּלְגֹּלֶת
  choice: ప్రతి ఒక్కరి కోసం
  rationale: అక్షరార్థంగా ‘ఒక్కో తలకు’; ఇక్కడ అది ఒక్కో వ్యక్తిని సూచించే జనగణన/లెక్కింపు నుడికారం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం పరిశుద్ధస్థలంలో అమలైన ప్రామాణిక తూకాన్ని సూచిస్తుంది; ప్రత్యేకమైన ‘పవిత్ర నాణెం’ అన్న అపార్థాన్ని నివారిస్తుంది.
- source_word: תִּקָּח
  choice: తీసుకోవాలి
  rationale: హీబ్రూలో మళ్లీ వచ్చిన రెండవ పురుష ఏకవచన క్రియను విడిచిపెట్టకుండా, తూక ప్రమాణం ప్రకారం వసూలు చేయాలనే ఆదేశంగా నిలుపుతుంది.
- source_word: עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: ఒక షెకెలు ఇరవై గేరాలు
  rationale: షెకెలు తూకపు విలువను స్పష్టంగా తెలిపే వివరణాత్మక సమానత్వంగా సహజ తెలుగులో అందిస్తుంది.
