  terminology: “లేవీయులు,” “పశువులు,” and “బదులుగా” are suitable. “తొలిచూలు కుమారుడు” appropriately represents the masculine singular בכור in this context. “యాహ్వే” is used consistently for יהוה, with a note supplying the traditional alternative.
