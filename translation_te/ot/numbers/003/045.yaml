id: NUM.3.45
reference: Numbers 3:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులలోని ప్రతి తొలిచూలు కుమారునికి బదులుగా లేవీయులను తీసుకోండి,[a] వారి పశువులకు బదులుగా లేవీయుల పశువులను తీసుకోండి.[b] లేవీయులు నావారు అవుతారు. నేను యాహ్వేను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులలోని.” హీబ్రూలో, “ఇశ్రాయేలు కుమారులలోని.”
    reason: lexical_alternative
  - marker: b
    text: “బదులుగా” అనే హీబ్రూ పదం ప్రతిస్థాపన భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో יהוה (YHWH); సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు. “యెహోవా” అనేది సాంప్రదాయ తెలుగు రూపం.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: తీసుకో
  rationale: לקח క్రియ యొక్క ఆజ్ఞార్థక రూపం; ఇక్కడ మోషే లేవీయులను ప్రత్యామ్నాయంగా స్వీకరించాలని లేదా నియమించాలని ఇచ్చిన ప్రత్యక్ష ఆజ్ఞ. ‘తీసుకో’ మూలభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: గోత్రనామానికి ప్రామాణికమైన తెలుగు రూపం; విభక్తితో సహజంగా వాడబడింది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఈ సందర్భంలో స్థలార్థమైన ‘కింద’ కాకుండా ప్రతిస్థాపనను సూచిస్తుంది. రెండు సమాంతర వాక్యభాగాల్లో అదే భావం నిలుపబడింది.
- source_word: כָּל בְּכוֹר
  choice: ప్రతి తొలిచూలు కుమారునికి
  rationale: ఏకవచన בכורతో కూడిన כל పంపిణీ భావాన్ని ‘ప్రతి’ తెలియజేస్తుంది. ఇక్కడ లెక్కించబడిన మగ తొలిచూలువారిని సందర్భానుసారంగా ‘తొలిచూలు కుమారుడు’ స్పష్టం చేస్తుంది.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోని
  rationale: ב యొక్క భాగసూచక భావాన్నీ, בני ישראל అనే హీబ్రూ నుడికారాన్నీ దగ్గరగా నిలుపుతుంది; ‘ఇశ్రాయేలీయులలోని’ అనేది మరింత సహజమైన ప్రత్యామ్నాయం.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: లేవీయుల పశువులను
  rationale: בהמה ఇక్కడ సమూహార్థంగా పెంపుడు పశుసంపదను సూచిస్తుంది; ‘పశువులు’ సాధారణ ఆధునిక తెలుగులో సహజం.
- source_word: בְּהֶמְתָּם
  choice: వారి పశువులకు
  rationale: తృతీయ పురుష బహువచన ప్రత్యయం ఇశ్రాయేలు కుమారులను సూచిస్తుంది; సమాంతర ప్రతిస్థాపన నిర్మాణం నిలుపబడింది.
- source_word: וְהָיוּ לִי
  choice: నావారిగా ఉంటారు
  rationale: దేవునికి చెందినవారనే సంబంధాత్మక, స్వామ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేనే యెహోవాను
  rationale: దైవ స్వీయ-గుర్తింపు మరియు ఆజ్ఞకు అధికార ముద్రగా ఉన్న సూత్రవాక్యాన్ని గంభీరంగా అందిస్తుంది; יהוה అనే వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. బిరుదైన ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగా నిలుపబడింది; తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం ఎంచుకోబడింది. ఉచ్చారణ పునర్నిర్మాణాన్ని అనుసరించే ‘యాహ్వే’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: లేవీయుల ప్రతిస్థాపన సంబంధం
  choice: బదులుగా
  alternative: స్థానంలో
  rationale: תחת ఇక్కడ ప్రతిస్థాపనను సూచిస్తుంది. అది ఎలా కార్యసాధకమవుతుందో అదనపు సిద్ధాంత వివరణను వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన ఆజ్ఞా శైలి వాడబడింది. హీబ్రూ సమాంతర నిర్మాణం మరియు ప్రతిస్థాపన భావం కాపాడబడ్డాయి. ‘ఇశ్రాయేలు కుమారులు’ మూల నుడికారాన్ని నిలుపుతుంది; విస్తృత సమూహార్థం ఉద్దేశించినట్లు సందర్భం సూచించినా దాన్ని నిశ్శబ్దంగా ‘ఇశ్రాయేలీయులు’గా సాధారణీకరించలేదు.
