    issue: The text renders יהוה as “యెహోవా.”
    rationale: The supplied POB theological decision and English audit trail specify “Yahweh” for the Tetragrammaton. In Telugu, “యాహ్వే” best reflects that selected rendering; the familiar traditional form may be noted as an alternative.
  - severity: low
    issue: “లేవీయులు నావారిగా ఉంటారు” is somewhat stiff.
    rationale: The Hebrew וְהָיוּ לִי expresses belonging. “లేవీయులు నావారు అవుతారు” is more idiomatic Telugu and preserves the covenantal-possession sense.
