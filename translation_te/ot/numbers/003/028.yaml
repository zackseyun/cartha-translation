  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: te
  text: ఒక నెల వయసు నుండి అంతకంటే పై వయసున్న మగవారందరి సంఖ్య ఎనిమిది వేల ఆరువందలు; వారు పవిత్రస్థల[a] సంరక్షణ బాధ్యతను నిర్వర్తించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్రమైన వస్తువుల సంరక్షణ బాధ్యతను.”
    reason: הַקֹּדֶשׁ అనే హెబ్రీయ పదం సందర్భానుసారంగా పవిత్రస్థలాన్ని లేదా పవిత్రమైన వస్తువులను సూచించవచ్చు.
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: మగవారందరి సంఖ్య
  rationale: ఇది జనగణనకు సంబంధించిన సంఖ్యను తెలిపే సూత్రప్రాయమైన పదబంధం. తెలుగులో సహజంగా ఉండేలా, మూలంలోని పురుషులను ప్రత్యేకంగా లెక్కించే భావాన్ని నిలిపింది.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: లెక్కింపుకు వర్తించే కనీస వయస్సును స్పష్టంగా తెలిపే హెబ్రీయ వయోపరిమితి ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: ఎనిమిది వేల ఆరువందలు
  rationale: WLCలో ఉన్న సంఖ్యను యథాతథంగా, వచన శైలికి అనుగుణంగా అక్షరాల్లో ఇచ్చింది.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: సంరక్షణ బాధ్యతను నిర్వర్తించేవారు
  rationale: ఒకే మూలానికి సంబంధించిన హెబ్రీయ పదాల కలయిక కాపలా, పర్యవేక్షణ, అప్పగించబడిన విధి అనే భావాలను కలిగిస్తుంది. ఈ అనువాదం నిరంతర అధికారిక బాధ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పవిత్రస్థలం
  rationale: యాజక సంబంధ సందర్భంలో పవిత్ర పరిధి లేదా పరిశుద్ధ స్థలాన్ని సూచించే సాధ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చింది; ‘పవిత్రమైన వస్తువులు’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: הַקֹּדֶשׁ అనే పదం స్థలాన్ని సూచిస్తుందా, పవిత్ర వస్తువులను సూచిస్తుందా అనే సందిగ్ధత
  choice: ప్రధాన పాఠ్యంలో ‘పవిత్రస్థలం’
  alternative: ‘పవిత్రమైన వస్తువులు’
  rationale: సందర్భం లేవీయులకు అప్పగించబడిన పవిత్ర పరిధి సంరక్షణను సూచించగలదు; అయితే హెబ్రీయ పదం పవిత్ర వస్తువులను కూడా సూచించవచ్చు. అందువల్ల ఒక భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరొకదాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన శైలిని స్పష్టంగా ఉంచుతూ రెండు సహజ వాక్యాలుగా రూపొందించబడింది. ‘సంరక్షణ బాధ్యత’ అనే పదబంధం లేవీయులకు అప్పగించబడిన నిరంతర విధిని గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
