language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: te
  text: లేవీయులను అహరోనుకు, అతని కుమారులకు అప్పగించాలి. వారు ఇశ్రాయేలు కుమారులలో నుండి[b] అతనికి పూర్తిగా అప్పగించబడినవారే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ఉద్ఘాటన కోసం “అప్పగించబడినవారు” అనే మాట రెండుసార్లు ఉంది: “అప్పగించబడినవారు, అప్పగించబడినవారు”; లేదా “నిశ్చయంగా అప్పగించబడినవారు.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా “ఇశ్రాయేలీయులలో నుండి.” హీబ్రూ: “ఇశ్రాయేలు కుమారులలో నుండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: అప్పగించాలి
  rationale: సూచనాత్మక సందర్భంలో సంయోజకంతో కూడిన ఖల్ పర్ఫెక్ట్ ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. ‘అప్పగించాలి’ ఆ నిర్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందిన, పరిశుద్ధస్థల సేవకు ప్రత్యేకించబడినవారిని సూచించే స్థిరమైన బైబిలు పదం.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు
  rationale: לְ పరోక్ష కర్మను లేదా లబ్ధిదారుని సూచిస్తుంది; ఈ అనువాదం మూలంలోని బదలాయింపు భావాన్ని నిలుపుతుంది.
- source_word: נְתוּנִם נְתוּנִם
  choice: పూర్తిగా అప్పగించబడినవారు
  rationale: ‘అప్పగించబడిన’ అనే నిష్క్రియార్థక కృదంతం రెండుసార్లు రావడం ఉద్ఘాటనను సూచిస్తుంది. తెలుగులో అసహజమైన పునరుక్తికి బదులుగా ‘పూర్తిగా’ ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూల పునరుక్తి పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: הֵמָּה
  choice: వారు
  rationale: స్వతంత్ర సర్వనామం కర్తను ఉద్ఘాటిస్తుంది. తెలుగులో ప్రత్యేక సర్వనామంతో ఆ నిర్మాణం తగినంతగా నిలుస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: సమీప సందర్భంలో ఇది అహరోనును సూచిస్తుంది; అప్పగింపు భావానికి ‘అతనికి’ సరిపోతుంది.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలో నుండి
  rationale: מֵאֵת మూలాన్ని లేదా ఎక్కడి నుండి తీసుకున్నారో సూచిస్తుంది. ‘లో నుండి’ ఎంపిక భావాన్ని స్పష్టం చేస్తూ, ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ కుటుంబ/నిబంధన సంబంధ వ్యక్తీకరణను నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇక్కడ కుటుంబ మరియు నిబంధన సంబంధ వ్యక్తీకరణకు ప్రాముఖ్యత ఉన్నందున దానిని ప్రధాన పాఠంలో నిలిపి, సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘అప్పగించాలి’ ఆజ్ఞార్థక భావాన్ని, ‘పూర్తిగా’ హీబ్రూ పునరుక్తి ఉద్ఘాటనను సహజంగా తెలియజేస్తాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
