  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: te
  text: వారిలో లెక్కించబడినవారు[a]—ఒక నెల వయసు నుండి పైబడిన ప్రతి మగవారి లెక్క ప్రకారం—ఏడు వేల ఐదువందల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిలో జనగణనలో నమోదైనవారు.’ హెబ్రీలో ఈ వచనంలో ఇదే జనగణన పదం రెండుసార్లు వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד మూలానికి చెందిన ఈ రూపం జనగణనలో నమోదు చేసి లెక్కించిన వ్యక్తులను సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ జనగణన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּמִסְפַּר
  choice: లెక్కించగా
  rationale: లెక్కకు ఆధారమైన వర్గాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవానిని
  rationale: జనగణన సందర్భంలోని పురుషలింగ నిర్దిష్టతను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: వయోపరిమితిని తెలిపే సూత్రప్రాయమైన హెబ్రీ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: ఏడు వేల ఐదువందల మంది
  rationale: సంఖ్యను తెలుగు గద్యానికి అనువైన పదరూపంలో ఇచ్చి, వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ని చేర్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హెబ్రీలోని పునరుక్తిని తెలుగులో భారంగా కాకుండా ప్రధాన పదబంధం మరియు లెక్కింపు క్రియ ద్వారా ప్రతిబింబించింది.
