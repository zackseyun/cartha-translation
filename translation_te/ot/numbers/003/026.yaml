revisions:
- from: ప్రాంగణపు తెరలు[a], మందిర గుడారం చుట్టూ, బలిపీఠం చుట్టూ ఉన్న ప్రాంగణ ప్రవేశద్వారపు అడ్డతెర, దాని తాళ్లు[b]—వాటికి సంబంధించిన సేవ అంతా.
  to: ప్రాంగణపు తెరలు[a], మందిర గుడారాన్నీ బలిపీఠాన్నీ చుట్టుముట్టి ఉన్న ప్రాంగణ ప్రవేశద్వారపు అడ్డతెర, దాని తాళ్లు[b]—ప్రాంగణపు సమస్త సేవకోసం.
  rationale: The revision clarifies that the court surrounds the tabernacle and altar, retains the source’s inventory-like structure and cultic terminology, and repairs the lexical-alternative footnote for the ropes. No doctrinal interpretation has been added.
