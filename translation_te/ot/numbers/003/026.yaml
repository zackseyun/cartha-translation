  text: וְ/קַלְעֵ֣י הֶֽ/חָצֵ֗ר וְ/אֶת מָסַךְ֙ פֶּ֣תַח הֶֽ/חָצֵ֔ר אֲשֶׁ֧ר עַל הַ/מִּשְׁכָּ֛ן וְ/עַל הַ/מִּזְבֵּ֖חַ סָבִ֑יב וְ/אֵת֙ מֵֽיתָרָ֔י/ו לְ/כֹ֖ל עֲבֹדָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: te
  text: ప్రాంగణపు తెరలు[a], మందిర గుడారాన్నీ బలిపీఠాన్నీ చుట్టుముట్టి ఉన్న ప్రాంగణ ప్రవేశద్వారపు అడ్డతెర, దాని తాళ్లు[b]—ప్రాంగణపు సమస్త సేవకోసం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రాంగణపు వేలాడే వస్త్రాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘త్రాళ్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: తెరలు
  rationale: ప్రాంగణాన్ని చుట్టుముట్టే వస్త్రపు తెరలను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: חָצֵר
  choice: ప్రాంగణం
  rationale: మందిర గుడారం చుట్టూ ఆవరించబడిన బాహ్య స్థలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: מָסַךְ
  choice: అడ్డతెర
  rationale: ప్రవేశద్వారంలో అమర్చిన వస్త్రపు తెరను, ప్రాంగణపు చుట్టుతెరల నుండి భేదిస్తూ తెలియజేస్తుంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: గట్టి తలుపు లేదా గేటు అనే భావాన్ని రుద్దకుండా ప్రవేశించే చోటును స్పష్టంగా సూచిస్తుంది.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: మందిర గుడారం చుట్టూ, బలిపీఠం చుట్టూ ఉన్న
  rationale: עַל ... סָבִיב యొక్క ప్రాదేశిక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ప్రాంగణం రెండింటినీ చుట్టి ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: מִשְׁכָּן
  choice: మందిర గుడారం
  rationale: ఇశ్రాయేలీయుల పవిత్ర గుడారాన్ని సాధారణ పాఠకునికి స్పష్టంగా సూచించే స్థిరమైన తెలుగు పదబంధం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే వేదికకు ప్రామాణికమైన తెలుగు పదం.
- source_word: מֵיתָרָיו
  choice: దాని తాళ్లు
  rationale: నిర్మాణాన్ని బిగించి నిలిపే ropes/cords ను సహజమైన తెలుగులో సూచిస్తుంది; సర్వనామంలోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: వాటికి సంబంధించిన సేవ అంతా
  rationale: పదశః ఏకవచన నిర్మాణాన్ని తెలుగులో అర్థస్పష్టత కోసం సమూహార్థంగా వ్యక్తపరుస్తూ, సాధారణ పని కంటే నియమిత పవిత్ర సేవ భావాన్ని నిలుపుతుంది.
