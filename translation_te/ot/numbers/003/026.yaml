  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. జాబితాగా కొనసాగుతున్న మూలవాక్య నిర్మాణాన్ని నిలుపుతూ, చివరి పదబంధాన్ని సహజమైన తెలుగులో ఇచ్చాం.
