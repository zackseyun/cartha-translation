source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי אַהֲרֹ֖ן הַ/בְּכ֣וֹר נָדָ֑ב וַ/אֲבִיה֕וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: te
  text: 'అహరోను కుమారుల పేర్లు ఇవి: మొదటిపుట్టినవాడు నాదాబు, అబీహు, ఎలియాజరు, ఈతామారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: జాబితాను సూచిస్తూ పరిచయం చేసే సంయోజక అవ్యయం-సర్వనామ సమాసాన్ని సహజమైన ఆధునిక తెలుగులో వాక్యాంత సూచనగా అందించింది; వచన సందర్భంలో వְ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం అవసరం లేదు.
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారుల పేర్లు
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ విభక్తి నిర్మాణంతో తెలిపింది.
- source_word: הַבְּכֹר
  choice: మొదటిపుట్టినవాడు
  rationale: ఇది కేవలం వయసులో పెద్దవాడని కాక, మొదట జన్మించిన కుమారుని స్థితిని సూచిస్తుంది.
- source_word: נָדָב
  choice: నాదాబు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וַאֲבִיהוּא
  choice: తరువాత అబీహు
  rationale: నాదాబు మొదటిపుట్టినవాడని చెప్పిన తరువాత మిగిలిన పేర్ల జాబితాకు సహజమైన తెలుగు సంధానాన్ని ఇచ్చింది; హీబ్రూ వ conjunction జాబితా కొనసాగింపును సూచిస్తుంది.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన బైబిలు నామరూపంలో ఇచ్చింది.
- source_word: וְאִיתָמָר
  choice: ఈతామారు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది; తెలుగు జాబితా నిర్మాణంలో చివరి సంయోజకాన్ని విరామచిహ్నాల ద్వారా సహజంగా తెలిపింది.
