translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే జాబితా నిర్మాణం. ‘మొదటిపుట్టినవాడు’ అనే పదంతో בכור యొక్క నిర్దిష్ట భావం నిలుపబడింది. మూలంలోని పేర్ల క్రమం యథాతథంగా ఉంచబడింది.
