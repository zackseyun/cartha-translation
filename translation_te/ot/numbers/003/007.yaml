- from: వారు అతని బాధ్యతను[a], సన్నిధి గుడారం ఎదుట సమాజమంతటి బాధ్యతను నిర్వర్తిస్తూ, మందిరపు సేవను చేయాలి.[b]
  to: నివాసగుడారపు సేవ చేయడానికి, వారు సన్నిధి గుడారం ఎదుట అతని బాధ్యతను[a], సమస్త సమాజపు బాధ్యతను కాపాడాలి.[b]
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని ‘బాధ్యతలను కాపాడుట’ మరియు ‘నివాసగుడారపు సేవ చేయుట’ అనే ఉద్దేశ సంబంధాన్ని స్పష్టపరిచాం. ‘అతని’ అనే అస్పష్ట సర్వనామాన్ని అలాగే ఉంచి, అహరోను అని ప్రధాన వచనంలో చేర్చలేదు. అరణ్యకాలపు మిష్కాన్‌ను ‘నివాసగుడారం’గా అనువదించి, సన్నిధి గుడారంతో పదభేదాన్ని కాపాడాం. రెండు పాదటిప్పణి సూచికలు ప్రధాన వచనంలో సరైన స్థానాల్లో ఉన్నాయి.
