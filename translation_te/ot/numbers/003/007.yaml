source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: te
  text: నివాసగుడారపు సేవ చేయడానికి, వారు సన్నిధి గుడారం ఎదుట అతని బాధ్యతను[a], సమస్త సమాజపు బాధ్యతను కాపాడాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాపాడాలి’ అనే మాటను ‘అప్పగించిన విధిని పాటించాలి’ లేదా ‘జాగ్రత్తగా నిర్వహించాలి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ-నామ జంటలో సంరక్షణ, నమ్మకమైన విధినిర్వహణ—రెండు భావాలూ ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అంటే, లేవీయులు అహరోనుకు సంబంధించిన బాధ్యతను, సమస్త సమాజానికి సంబంధించిన బాధ్యతను నిర్వహిస్తారు. మూలభాషలో ఈ సంబంధం ‘సమాజం తరఫున’ అని మరింత నిర్దిష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: నిర్వర్తిస్తూ ... చేయాలి
  rationale: שׁמר మరియు మִשְׁמֶרֶת కలయిక అప్పగించిన బాధ్యతను జాగ్రత్తగా పాటించి నిర్వర్తించడాన్ని సూచిస్తుంది. తెలుగులో సహజత్వం కోసం క్రియార్థాన్ని ‘బాధ్యతను నిర్వర్తిస్తూ’గా వ్యక్తం చేశాం.
- source_word: מִשְׁמַרְתּוֹ
  choice: అతని బాధ్యతను
  rationale: మִשְׁמֶרֶת ఇక్కడ అప్పగించబడిన సంరక్షణాత్మక విధి లేదా బాధ్యతను సూచిస్తుంది. ‘అతని’ అనే సర్వనామం మూలంలోని 3వ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది; సందర్భంలో అది సహజంగా అహరోనును సూచిస్తుంది.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: సమాజమంతటి బాధ్యతను
  rationale: మొదటి מִשְׁמֶרֶתతో ఉన్న సమాంతరతను ‘బాధ్యత’ పునరావృతితో నిలిపాం. ఇది సమాజమంతటికీ సంబంధించిన లేదా వారి పక్షాన నిర్వహించాల్సిన బాధ్యత అనే అర్థాన్ని తెరిచి ఉంచుతుంది.
- source_word: הָעֵדָה
  choice: సమాజమంతటి
  rationale: సంఖ్యాకాండంలో עֵדָה ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, విస్తృతంగా అర్థమవుతుంది.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: సన్నిధి గుడారం ఎదుట
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని ‘ఎదుట’ నిలుపుతుంది. אֹהֶל מוֹעֵדకు ‘సన్నిధి గుడారం’ దేవునితో కలుసుకునే నియమిత స్థల భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לַעֲבֹד
  choice: చేయాలి
  rationale: ఉద్దేశాన్ని తెలిపే עבד ధాతువు తరువాతి సంబంధిత నామవాచకం עֲבֹדַתతో కలిసి వస్తుంది. తెలుగులో అసహజమైన ధాతు-నామ పునరుక్తిని నివారిస్తూ ఉద్దేశార్థాన్ని స్పష్టంగా ఉంచాం.
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  choice: మందిరపు సేవను
  rationale: עֲבֹדָה ఆరాధనా స్థలానికి సంబంధించిన నియమిత సేవను సూచిస్తుంది. מִשְׁכָּן ఇక్కడ అరణ్యకాలపు పవిత్ర నివాస గుడారాన్ని సూచిస్తుంది; ‘మందిరం’ అనే ఎంపిక దాని పవిత్ర నివాస భావాన్ని సహజ తెలుగులో అందిస్తుంది, అయితే ఇది తరువాతి శాశ్వత దేవాలయమని భావించకూడదని పాదటిప్పణి స్పష్టం చేస్తుంది.
theological_decisions:
- issue: מִשְׁמַרְתּוֹలోని 3వ పురుష ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ‘అతని’ అని సర్వనామాన్ని నిలిపి, సందర్భానుసారం అహరోనును సహజ పూర్వపదంగా గ్రహించడం
  alternative: దీనిని సాధారణ యాజక బాధ్యతగా లేదా పవిత్రస్థల బాధ్యతగా విస్తృతంగా అర్థం చేసుకోవడం
  rationale: సంఖ్యాకాండము 3లో సమీప సందర్భం లేవీయులను అహరోనుకు, అతని కుమారులకు అప్పగించడం గురించి చెబుతుంది. అయినా మూలంలో పేరు మళ్లీ చెప్పబడలేదు కాబట్టి ప్రధాన వచనంలో ‘అహరోను’ అని చేర్చి అస్పష్టతను పూర్తిగా తొలగించలేదు.
- issue: ‘సమాజమంతటి బాధ్యత’ యొక్క సంబంధార్థం
  choice: లేవీయులు సమాజమంతటికీ సంబంధించిన బాధ్యతను నిర్వర్తిస్తారు అనే విస్తృత రూపం
  alternative: లేవీయులు సమాజం స్థానంలో లేదా సమాజం తరఫున మాత్రమే సేవ చేస్తారు అని స్పష్టీకరించడం
  rationale: హీబ్రూ సంబంధ నిర్మాణం బాధ్యత సమాజానికి చెందినదని చెబుతుంది; ‘తరఫున’ లేదా ‘స్థానంలో’ అనే నిర్దిష్ట సంబంధాన్ని ప్రత్యక్షంగా గుర్తించదు. అందువల్ల ప్రధాన వచనం ఆ భావసాధ్యతను తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బాధ్యత’ పునరావృతితో హీబ్రూ సమాంతర నిర్మాణాన్ని నిలిపి, ‘నిర్వర్తిస్తూ ... చేయాలి’తో తెలుగులో సహజమైన వాక్యప్రవాహాన్ని సాధించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన వచనంలో ఉన్నాయి.
