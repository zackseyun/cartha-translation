  source_fidelity: ముసాయిదా మిష్మెరెత్ అనే పదపు పునరావృత్తిని ‘బాధ్యత’తో సముచితంగా నిలుపుతుంది; ‘అతని’ అనే పదం మూలంలోని అస్పష్టమైన ఏకవచన ప్రత్యయాన్ని కూడా కాపాడుతుంది. అయితే ‘నిర్వర్తిస్తూ ... చేయాలి’ నిర్మాణం שׁמר (‘కాపాడుట/పాటించుట’) మరియు లַעֲבֹד (‘సేవ చేయుటకు’) మధ్య ఉన్న సంబంధాన్ని అస్పష్టం చేస్తోంది. అలాగే מִשְׁכָּןను ‘మందిరం’గా అనువదించడం అనవసరంగా తరువాతి స్థిర దేవాలయ భావాన్ని తెస్తుంది.
