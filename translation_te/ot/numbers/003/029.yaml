  yaml_path: translation/ot/numbers/003/029.yaml
  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: te
  text: కహాతు కుమారుల కుటుంబ వర్గాలు[a] నివాస గుడారానికి దక్షిణ వైపున శిబిరం వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కహాతు సంతతివారి కుటుంబ వర్గాలు’ లేదా ‘కహాతీయుల కుటుంబ వర్గాలు.’ హీబ్రూలో అక్షరార్థంగా ‘కహాతు కుమారుల కుటుంబ వర్గాలు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: గోత్ర జనగణన, శిబిర క్రమం సందర్భంలో ఇది ఉమ్మడి పూర్వికుని ఆధారంగా ఏర్పడిన బంధుత్వ విభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కుటుంబాలు’ కంటే ‘వంశాలు’ ఈ విస్తృత సమూహ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי קְהָת
  choice: కహాతు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే వంశపరమైన రూపకాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది కహాతు సంతతివారిని సూచిస్తుంది.
- source_word: יַחֲנוּ
  choice: మకాం వేయాలి
  rationale: ఇక్కడ imperfect రూపం శిబిర ఏర్పాటుకు సంబంధించిన నిర్దేశాన్ని వ్యక్తం చేస్తుంది; ‘మకాం వేయాలి’ సహజమైన ఆధునిక తెలుగులో ఆ ఆదేశ భావాన్ని అందిస్తుంది.
- source_word: עַל יֶרֶךְ
  choice: వైపున
  rationale: నివాసమందిరానికి సంబంధించి ఒక పక్కన ఉన్న స్థానాన్ని తెలిపే ఈ సంయుక్త స్థానార్థక ప్రయోగానికి ‘వైపున’ సహజమైన తెలుగు రూపం.
- source_word: הַמִּשְׁכָּן
  choice: నివాసమందిరం
  rationale: మూలపదం ‘నివాస స్థలం’ అనే భావంతో ఇశ్రాయేలు పవిత్ర గుడారాన్ని సూచిస్తుంది; ‘నివాసమందిరం’ ఆ పదార్థాన్ని, ఆరాధనా సందర్భాన్ని రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: תֵּימָנָה
  choice: దక్షిణం
  rationale: దిశార్థక రూపం దక్షిణ దిక్కున ఉన్న స్థానాన్ని సూచిస్తుంది; ‘దక్షిణం వైపున’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
