  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: te
  text: 'వారి వంశాల వారీగా గెర్షోను కుమారుల పేర్లు ఇవి: లిబ్నీ, షిమీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ఇవి
  rationale: జాబితాను పరిచయం చేసే సూచనార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ముందున్న వాక్యంతో సంబంధం సందర్భంలో స్పష్టంగా ఉన్నందున హెబ్రీ సంధికారకమైన וను ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: שְׁמוֹת
  choice: పేర్లు
  rationale: తరువాతి ‘గెర్షోను కుమారుల’తో సంబంధాన్ని తెలుగు షష్ఠీ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: గెర్షోను కుమారుల
  rationale: בְּנֵי అనే పదానికి ఇక్కడ ‘కుమారులు’ అనే నిర్దిష్ట అర్థమే సరిపోతుంది; వెంటనే ఇద్దరు పురుష సంతానం పేర్లు ఇవ్వబడ్డాయి.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: వారి వంశాల ప్రకారం
  rationale: గణన, వంశావళి సందర్భంలో מִשְׁפָּחָה కుటుంబానికన్నా విస్తృతమైన వంశగుంపును సూచిస్తుంది; ‘వంశాల ప్రకారం’ దాని వర్గీకరణ భావాన్ని నిలుపుతుంది.
- source_word: לִבְנִי
  choice: లిబ్నీ
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְ/שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ఇద్దరి పేర్ల చిన్న జాబితాలో తెలుగు విరామచిహ్నం సహజమైన అనుసంధానాన్ని అందిస్తుంది.
