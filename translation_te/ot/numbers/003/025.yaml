  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: te
  text: 'సమావేశపు గుడారంలో గెర్షోను కుమారుల బాధ్యత[a] ఇవి: నివాసస్థలం, గుడారం, దాని కప్పు, సమావేశపు గుడారపు ప్రవేశద్వారానికి ఉన్న తెర[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బాధ్యత’ అని అనువదించిన పదానికి ‘అప్పగించబడిన సంరక్షణ కార్యం’ లేదా ‘కాపలా విధి’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తెర’ను ‘పరదా’ అని కూడా అనువదించవచ్చు; ఇది ప్రవేశద్వారం వద్ద వేలాడదీసే ఆవరణ వస్త్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: బాధ్యత
  rationale: లేవీయులకు అప్పగించిన సంరక్షణ కార్యాన్ని ఈ సందర్భంలో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: గెర్షోను కుమారులు
  rationale: హీబ్రూలోని కుటుంబ సంబంధ పదబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం దగ్గర
  rationale: ఇక్కడ ב సేవ జరిగే స్థలాన్ని సూచిస్తుంది; తెలుగులో ‘దగ్గర’ సహజంగా ఉంటుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: ఈ సంచార పవిత్ర నివాసాన్ని సూచించే సాంకేతిక పదంగా, తరువాత వచ్చే ‘గుడారం’తో భేదాన్ని నిలుపుతుంది.
- source_word: וְהָאֹהֶל
  choice: గుడారం
  rationale: మందిర నిర్మాణంలోని గుడారపు భాగాన్ని జాబితాలో ప్రత్యేక అంశంగా నిలుపుతుంది.
- source_word: מִכְסֵהוּ
  choice: దాని కప్పు
  rationale: గుడారానికి సంబంధించిన పై కప్పును సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: מָסַךְ
  choice: తెర
  rationale: ప్రవేశద్వారం వద్ద వేలాడే ఆవరణ వస్త్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారానికి ఉన్న
  rationale: తెరతో ప్రవేశద్వారానికి ఉన్న కార్యసంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: హీబ్రూ పదబంధానికి పారదర్శకమైన, స్థిరమైన అనువాదం.
