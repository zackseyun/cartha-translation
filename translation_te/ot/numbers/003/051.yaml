source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే, యాహ్వే ఆజ్ఞ ప్రకారం మోషే విమోచన సొమ్మును[a] అహరోనుకూ అతని కుమారులకూ ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “విమోచించబడినవారి వెండి”; అంటే, వారి విమోచన కోసం వసూలు చేసిన చెల్లింపు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు ఇది సహజమైన భూతకాల కథన రూపం; సందర్భంలో మోషే ఆ మొత్తాన్ని అహరోనుకు, అతని కుమారులకు అప్పగించినట్లు తెలుపుతుంది.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: విమోచించబడినవారి వెండి
  rationale: హీబ్రూ నిర్మాణంలోని ‘వెండి’ మరియు ‘విమోచించబడినవారు’ అనే రెండు అంశాలను నేరుగా నిలుపుతుంది. పూర్వ వచనాల సందర్భంలో ఇది విమోచన కోసం వసూలు చేసిన వెండి మొత్తాన్ని సూచిస్తుంది.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు
  rationale: పునరుక్తమైన לְ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ‘అతని కుమారులు’ అహరోను కుమారులేనని స్పష్టం చేస్తుంది.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’ అనే హీబ్రూ నుడికారం ఇక్కడ దైవ ఆజ్ఞకు అనుగుణంగా చేసిన చర్యను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది; దానిని బిరుదుతో భర్తీ చేయదు.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר తెలిపే సరిగ్గా అనుసరించిన భావాన్ని ‘ఆజ్ఞాపించినట్టే’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: כֶּסֶף הַפְּדֻיִם లో విమోచన భావం
  choice: విమోచించబడినవారి వెండి
  alternative: విమోచన సొమ్ము
  rationale: మూలంలోని ‘విమోచించబడినవారు’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది వారి విమోచన కోసం చెల్లించిన మొత్తమని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూల హీబ్రూలోని రెండు సమానార్థక ఆజ్ఞా వాక్యభాగాలను తొలగించకుండా నిలిపాం; ‘వెండి’ అనే మూల పదాన్ని ప్రధాన పాఠంలో ఉంచి దాని ఆర్థిక ప్రయోజనాన్ని పాదటిప్పణిలో వివరించాం.
