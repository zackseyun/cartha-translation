  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా నిర్మాణ సంబంధ పదాలను ఉపయోగించాం. వాక్యాన్ని హీబ్రూ జాబితా నిర్మాణానికి దగ్గరగా ఉంచుతూ సహజ తెలుగు విరామచిహ్నాలతో అందించాం.
