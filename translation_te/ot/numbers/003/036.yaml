source:
  edition: WLC
  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: te
  text: 'మెరారీ కుమారులకు అప్పగించబడిన బాధ్యత ఇదే: నివాస మందిరపు చట్రాలు[a], దాని అడ్డకమ్మీలు, దాని స్తంభాలు, దాని పాదపీఠాలు[b], దాని సామగ్రి అంతా, దానికి సంబంధించిన సేవ అంతా[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాస మందిరపు పలకలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని మూలదిమ్మలు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దానికి సంబంధించిన పని అంతా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: అప్పగించబడిన బాధ్యత
  rationale: ఈ సంయుక్త పదబంధం అధికారికంగా అప్పగించిన సంరక్షణ బాధ్యతను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో రెండు పదాల భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְּנֵי מְרָרִי
  choice: మెరారీ కుమారులు
  rationale: హీబ్రూ మూలంలోని వంశసంబంధ వ్యక్తీకరణను నేరుగా నిలుపుతుంది.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: నివాస మందిరపు చట్రాలు
  rationale: קֶרֶשׁ ఇక్కడ నిర్మాణానికి ఆధారమైన నిలువు పలకలు లేదా ఫ్రేములను సూచిస్తుంది; 'చట్రాలు' వాటి నిర్మాణాత్మక పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస మందిరం
  rationale: మూలపదంలోని 'నివాసం' భావాన్ని నిలుపుతూ, ఆరాధనా నిర్మాణాన్ని సహజంగా సూచిస్తుంది.
- source_word: בְרִיחָיו
  choice: దాని అడ్డకమ్మీలు
  rationale: చట్రాలను కలిపి నిలిపే అడ్డంగా అమర్చిన కమ్మీలను ఈ పదం సూచిస్తుంది.
- source_word: עַמֻּדָיו
  choice: దాని స్తంభాలు
  rationale: నిలువు ఆధారాలను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲדָנָיו
  choice: దాని పాదపీఠాలు
  rationale: స్తంభాలు లేదా చట్రాలు అమరే అడుగు భాగపు ఆధారాలను సూచిస్తుంది; 'మూలదిమ్మలు' కూడా సాధ్యమైన సాంకేతిక ప్రత్యామ్నాయం.
- source_word: כָל כֵּלָיו
  choice: దాని సామగ్రి అంతా
  rationale: כֵּלִים అనే విస్తృత పదం పరికరాలు, ఉపకరణాలు, సంబంధిత వస్తువులన్నిటినీ కలుపుతుంది; 'సామగ్రి' ఈ విస్తృతిని నిలుపుతుంది.
- source_word: כֹל עֲבֹדָתוֹ
  choice: వాటికి సంబంధించిన పని అంతా
  rationale: సర్వనామం సమీపంలోని నిర్మాణ భాగాలు, సామగ్రికి సంబంధించిన సేవ లేదా పనిని సమగ్రంగా సూచిస్తుంది. తెలుగులో అస్పష్టమైన 'దాని సేవ' కంటే ఇది సహజం.
