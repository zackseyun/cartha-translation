language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פְּקֹד֙ אֶת בְּנֵ֣י לֵוִ֔י לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָ֛ר מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה תִּפְקְדֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: te
  text: లేవి కుమారులను[a] వారి పితృకుటుంబాల ప్రకారం, వారి వంశాల ప్రకారం లెక్కించు. ఒక నెల వయసు నుంచీ పైబడిన ప్రతి పురుష శిశువును లెక్కించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేవీయులను.’ హెబ్రీలో అక్షరార్థంగా ‘లేవి కుమారులను’ అని ఉంది; ఇది సంతతిని, వంశ నిర్మాణాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: లెక్కించు / లెక్కించు
  rationale: ఈ పరిపాలనా సందర్భంలో פקד వ్యక్తులను లెక్కించడం లేదా జనగణనలో నమోదు చేయడాన్ని సూచిస్తుంది. తెలుగు పాఠంలో రెండుసార్లు ‘లెక్కించు’ అని ఉంచడం మూలంలోని పునరుక్తిని, ఆజ్ఞార్థాన్ని నిలుపుతుంది; సైనిక సమీకరణ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בְּנֵי לֵוִי
  choice: లేవి కుమారులు
  rationale: ఇది హెబ్రీ పదబంధానికి నేరమైన అర్థం. తరువాత వచ్చే పితృగృహాలు, వంశాలు అనే వంశావళి నిర్మాణంతో అనుసంధానమై, లేవి సంతతి అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాలవారీగా
  rationale: ఈ పదబంధం పితృవంశానికి చెందిన కుటుంబ-గృహ విభాగాలను సూచిస్తుంది. ‘పితృగృహాలు’ మూలంలోని సామాజిక, వంశావళి నిర్మాణాన్ని నిలుపుతూ, ‘వారీగా’ వర్గీకరణ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాలవారీగా
  rationale: ముందున్న ‘పితృగృహాలు’తో దీనిని కలిపేయకుండా ప్రత్యేక బంధుత్వ విభాగంగా చూపేందుకు ‘వంశాలు’ ఎంచుకోబడింది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాడు
  rationale: זָכָר వయోజన పురుషులను మాత్రమే కాక పురుష లింగానికి చెందిన వారందరినీ సూచిస్తుంది; ఈ వాక్యంలో నెల వయసున్న శిశువులు కూడా చేర్చబడినందున ‘ప్రతి మగవాడు’ తగినది.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: ఈ హెబ్రీ నానుడి జనగణనకు కనిష్ఠ వయోపరిమితిని నిర్దేశిస్తుంది. ఎంపిక చేసిన రూపం ఆ పరిమితిని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
