translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘పితృగృహాలు,’ ‘వంశాలు’ అనే వేర్వేరు పదాలతో మూలంలోని రెండు బంధుత్వ విభాగాల భేదం నిలుపబడింది; ఆజ్ఞలోని פקד పునరుక్తి కూడా ఉద్దేశపూర్వకంగా కాపాడబడింది.
