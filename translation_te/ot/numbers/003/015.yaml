revisions:
- from: లేవి కుమారులను[a] వారి పితృగృహాలవారీగా, వారి వంశాలవారీగా లెక్కించు. ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న ప్రతి మగవాణ్ణీ లెక్కించు.
  to: లేవి కుమారులను[a] వారి పితృకుటుంబాల ప్రకారం, వారి వంశాల ప్రకారం లెక్కించు. ఒక నెల వయసు నుంచీ పైబడిన ప్రతి పురుష శిశువును లెక్కించు.
  rationale: The revision keeps the Hebrew’s twofold command to count, its literal ‘sons of Levi,’ and the distinct ancestral-household and clan categories. It replaces wording that may suggest adult males with an idiomatic expression that clearly includes male infants, as required by the one-month age threshold.
