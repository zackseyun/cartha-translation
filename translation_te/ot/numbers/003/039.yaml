    text: 3:22, 3:28, 3:34లో ఇచ్చిన మూడు వంశాల సంఖ్యలను కలిపితే 22,300 అవుతుంది; అయితే హీబ్రూ మూలపాఠం ఈ వచనంలో 22,000 అని ఉంది.
    reason: textual_numerical_tension
  revision_rationale: The revision retains the Hebrew census formula and its stated total, preserves the documented numerical tension in the anchored footnote, improves the collective sense of the census wording, and changes the divine name to “యాహ్వే” in line with the supplied POB audit trail.
