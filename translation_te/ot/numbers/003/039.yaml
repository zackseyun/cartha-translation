revisions:
- from: యెహోవా ఆజ్ఞ ప్రకారం మోషే, అహరోనులు వంశాలవారీగా లెక్కించిన లేవీయులందరిలో, ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న ప్రతి మగవారి సంఖ్య ఇరవై రెండు వేలు.[a]
