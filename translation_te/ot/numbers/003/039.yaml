source:
  edition: WLC
  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: te
  text: యాహ్వే ఆజ్ఞ ప్రకారం మోషే, అహరోను వారి వంశాలవారీగా లెక్కించిన లేవీయులందరిలో, ఒక నెల వయసు నుండి పైబడిన మగవారందరి సంఖ్య ఇరవై రెండు వేలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 3:22, 3:28, 3:34లో ఇచ్చిన మూడు వంశాల సంఖ్యలను కలిపితే 22,300 అవుతుంది; అయితే హీబ్రూ మూలపాఠం ఈ వచనంలో 22,000 అని ఉంది.
    reason: textual_numerical_tension
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: లెక్కించిన / సంఖ్య
  rationale: ఇక్కడ פקד పదరూపాలు జనగణనలో వ్యక్తులను లెక్కించడం, దాని మొత్తాన్ని సూచిస్తున్నాయి. సైనిక భావాన్ని చేర్చకుండా ఆధునిక తెలుగులో స్పష్టంగా ఉండేందుకు ‘లెక్కించిన’, ‘సంఖ్య’ అని అనువదించాం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ప్రజలను సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: עַל־פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’ అనే హీబ్రూ నుడికారం ఇక్కడ ఆయన ఆజ్ఞ లేదా అధికారాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ఆ భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపంతో ఇచ్చాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వంశాలవారీగా
  rationale: ఈ జనగణన సందర్భంలో מִשְׁפָּחָה ఆధునిక చిన్న కుటుంబం కంటే విస్తృతమైన బంధుత్వ సమూహాన్ని సూచిస్తుంది; ‘వంశాలవారీగా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవారు
  rationale: మూలపాఠం లింగాన్ని స్పష్టంగా పేర్కొంటుంది. ఒక నెల వయసున్న శిశువులనూ కలుపుతున్నందున ‘ప్రతి పురుషుడు’ కంటే ‘ప్రతి మగవారు’ పరిధిని మెరుగ్గా నిలుపుతుంది.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: వయోపరిమితిని తెలిపే హీబ్రూ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: ఇరవై రెండు వేలు
  rationale: హీబ్రూ సంఖ్యకు నేరమైన తెలుగు రూపం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
- issue: మొత్తం 22,000 మరియు 3:22, 3:28, 3:34లోని ఉపమొత్తాల మధ్య సంఖ్యాపరమైన ఉద్రిక్తత
  choice: మూలపాఠంలోని ‘ఇరవై రెండు వేలు’ను యథాతథంగా ఉంచి గమనికలో ఉద్రిక్తతను తెలిపాం
  alternative: ఉపమొత్తాలకు సరిపడేలా 22,300గా సవరించడం
  rationale: మసొరా మూలపాఠం ఇక్కడ స్పష్టంగా 22,000 అని చెబుతుంది. సమీప ఉపమొత్తాలతో కనిపించే వ్యత్యాసాన్ని ఊహాత్మకంగా సరిచేయకుండా పాఠకుడికి తెలియజేయడం మూలపాఠ నిబద్ధతను, నిజమైన పాఠ్య ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. జనగణన సందర్భాన్ని స్పష్టంగా ఉంచుతూ, హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుకరించకుండా సహజమైన తెలుగు ప్రవాహాన్ని అనుసరించాం.
