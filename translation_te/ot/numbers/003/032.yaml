source:
  edition: WLC
  text: וּ/נְשִׂיא֙ נְשִׂיאֵ֣י הַ/לֵּוִ֔י אֶלְעָזָ֖ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: te
  text: మరియు, లేవీయుల నాయకులపై ప్రధాన నాయకుడు యాజకుడైన అహరోను కుమారుడు ఎలియాజరు. పవిత్ర స్థలపు కాపలా బాధ్యతను నిర్వర్తించేవారిపై పర్యవేక్షణ బాధ్యత ఎలియాజరుదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర వస్తువులు.’ హెబ్రీ పదం పవిత్ర స్థలాన్నిగానీ, దానితో సంబంధమున్న పవిత్ర వస్తువులనుగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: లేవీయుల నాయకులపై ప్రధాన నాయకుడు
  rationale: నָשִׂיא పదపు పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, రాజరిక భావాన్ని అనవసరంగా చేర్చకుండా నాయకత్వ శ్రేణిని స్పష్టంగా తెలియజేస్తుంది. ప్రారంభంలోని וּ సందర్భానుసార కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారుడు ఎలియాజరు
  rationale: తెలుగు వాక్యనిర్మాణానికి సహజంగా పేరును చివర ఉంచి, הַכֹּהֵן అనే విశేషణం అహరోనును సూచిస్తుందని స్పష్టంగా చూపుతుంది.
- source_word: פְּקֻדַּת
  choice: పర్యవేక్షణ అతనిది
  rationale: ఈ సందర్భంలో ఈ నామవాచకం నియామకం కంటే పర్యవేక్షణ, అధికార బాధ్యత అనే భావాన్ని సూచిస్తుంది. హెబ్రీలోని క్రియలేని నిర్మాణాన్ని సహజమైన తెలుగు విధేయ వాక్యంగా అందిస్తుంది.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: తమకు అప్పగించిన బాధ్యతను నిర్వర్తించేవారు
  rationale: ఒకే మూలానికి చెందిన ‘కాపాడు/బాధ్యత’ పదాల హెబ్రీ ప్రయోగం, కేవలం కాపలాదారులను కాక అప్పగించబడిన సేవాబాధ్యతను నమ్మకంగా నిర్వహించడాన్ని సూచిస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పవిత్రస్థలం
  rationale: గుడార సంబంధ సందర్భంలో పవిత్రమైన ఆరాధనా ప్రదేశాన్ని సహజంగా సూచిస్తుంది; అయితే ఈ పదం పవిత్ర వస్తువులను కూడా సూచించగలందున ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా శైలిని వాడాం. మూలంలోని నాయకత్వ క్రమం, యాజక వంశసంబంధం, పర్యవేక్షణ బాధ్యత స్పష్టంగా ఉండేలా చూశాం; הַקֹּדֶשׁ లోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
