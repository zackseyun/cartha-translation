  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: te
  text: వారిలో మిగులుగా ఉన్నవారి విమోచన ధరగా ఆ వెండిని అహరోనుకు, అతని కుమారులకు ఇవ్వాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘వారిలో మిగులుగా ఉన్నవారి విమోచింపబడినవారి కొరకు.’ హీబ్రూలోని సంక్షిప్త నిర్మాణం విమోచింపబడినవారినీ, వారికి సంబంధించిన విమోచన చెల్లింపునీ సూచించగలదు; సందర్భంలో ప్రధాన పాఠం దీనిని విమోచన ధరగా వ్యక్తం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: ఇవ్వాలి
  rationale: సూచనాత్మక సందర్భంలో సంయోజకంతో కూడిన Qal perfect 2ms ఆజ్ఞాత్మక భావాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘ఇవ్వాలి’ సహజంగా ఆ నిర్దేశాన్ని తెలియజేస్తుంది.
- source_word: הַכֶּסֶף
  choice: ఆ వెండిని
  rationale: כֶּסֶף యొక్క ప్రాథమిక అర్థం ‘వెండి’; సందర్భంలో అది చెల్లింపు ధనం అయినప్పటికీ, ‘వెండి’ మూలపదానికి దగ్గరగా ఉండి తెలుగులో స్పష్టంగా ఉంది.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు
  rationale: రెండుసార్లు వచ్చిన לְ సంబంధాన్ని తెలుగులో రెండు సంప్రదాన రూపాలతో చూపించాం; ‘కుమారులు’ యాజక కుటుంబంలోని పురుష సంతానాన్ని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: פְּדוּיֵי
  choice: విమోచన వెలగా
  rationale: פדה మూలం నుంచి వచ్చిన నిర్మాణ బహువచనం విమోచించబడినవారిని లేదా వారితో సంబంధమైన విమోచన మొత్తాన్ని సూచించగలదు. ‘వెండి’ కర్మగా ఉన్న ఈ సందర్భంలో చెల్లింపు భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘విమోచన వెలగా’ ఎంచుకున్నాం.
- source_word: הָעֹדְפִים
  choice: సంఖ్యకు మించినవారి
  rationale: עודף క్రియావిశేషణ రూపం సరిపోల్చిన సంఖ్యకు మిగులుగా ఉన్నవారిని సూచిస్తుంది; ఇక్కడ లేవీయుల సంఖ్యకంటే ఎక్కువగా ఉన్న ఇశ్రాయేలు తొలిచూలు కుమారులే ఉద్దేశ్యం. మూలంలో లేని వివరాలను ప్రధాన వాక్యంలో చేర్చకుండా సంఖ్యాపరమైన భావాన్ని తెలిపాం.
- source_word: בָּהֶם
  choice: వారిలో
  rationale: בְּ ఉపసర్గతో ఉన్న సర్వనామం లెక్కించబడిన సమూహం మధ్య లేదా ఆ సమూహంలో అనే సంబంధాన్ని సూచిస్తుంది; ‘వారిలో’ సంక్షిప్తంగా, సహజంగా ఉంది.
