language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: te
  text: ఎందుకంటే ప్రతి తొలిచూలు నాదే.[a] ఐగుప్తు దేశంలో ప్రతి తొలిచూలును నేను సంహరించిన రోజున, ఇశ్రాయేలులో మనుషుల నుండి పశువుల వరకు ప్రతి తొలిచూలును నాకోసం ప్రతిష్ఠపరచుకున్నాను. వారు నావారవుతారు.[b] నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు చెందుతుంది.’ ‘నాదే / నాకోసం / నావారు’ అనే స్వామ్యభావం ఈ వచనంలో మూడుసార్లు వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘మనిషి నుండి పశువు వరకు’; ఇది మనుషుల నుండి జంతువుల వరకు అనే సమగ్ర పరిధిని సూచించే స్థిరమైన పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో లేవీయుల గురించి చేసిన ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לִי
  choice: నాదే / నా కోసం / నావారై
  rationale: దైవిక స్వామ్యాన్ని నొక్కిచెప్పే హీబ్రూ పదం మూడుసార్లు రావడాన్ని సహజమైన తెలుగు రూపాల్లో నిలిపింది.
- source_word: כָּל בְּכוֹר
  choice: ప్రతి తొలిచూలు
  rationale: మొదట పుట్టిన సంతానాన్ని సూచిస్తుంది; మూలంలో స్పష్టంగా లేని ‘మగ’ అనే భావాన్ని చేర్చలేదు.
- source_word: בְּיוֹם הַכֹּתִי
  choice: నేను సంహరించిన రోజున
  rationale: ఐగుప్తు తొలిచూలు మరణించిన తీర్పు సందర్భంలో נכה యొక్క ప్రాణాంతక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִקְדַּשְׁתִּי
  choice: ప్రతిష్ఠించుకున్నాను
  rationale: దేవునికి పవిత్రంగా ప్రత్యేకించుకోవడం, తనకోసం ఉంచుకోవడం అనే రెండు భావాలను అందిస్తుంది.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: మనుషుల మొదలు పశువుల వరకు
  rationale: మానవుల నుంచి జంతువుల వరకు అన్న సమగ్ర పరిధిని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יִהְיוּ
  choice: నావారై ఉంటారు
  rationale: కొనసాగుతూ ఉండే దైవిక హక్కును ప్రకటనాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేనే యెహోవాను
  rationale: ఒడంబడిక నామాన్ని లిప్యంతరీకరించి, ముగింపు సూత్రంలోని దైవిక అధికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపాన్ని వాడి, మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చలేదు.
- issue: אָדָם–בְּהֵמָה సమగ్ర పదబంధం
  choice: మనుషుల మొదలు పశువుల వరకు
  alternative: మనిషి మొదలు పశువు వరకు
  rationale: ఇది ఒక్క పురుషుడిని కాక మానవ వర్గం నుంచి జంతు వర్గం వరకు ఉన్న పరిధిని సూచిస్తుంది; అందువల్ల సమూహార్థాన్ని స్పష్టంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తొలిచూలు’ అనే పరిచిత బైబిలు పదాన్ని ఉంచి, స్వామ్యాన్ని తెలిపే పునరుక్తిని సాధ్యమైనంతగా పరిరక్షించాం.
