translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణనాత్మక జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. బంధుత్వ స్థాయుల మధ్య తేడాను ‘వంశాలు’ మరియు ‘పితృకుటుంబం’ ద్వారా నిలుపుకున్నాం.
