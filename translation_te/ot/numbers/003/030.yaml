source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י אֶלִיצָפָ֖ן בֶּן עֻזִּיאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: te
  text: కహాతీయుల వంశాల పితృకుటుంబపు అధిపతి[a] ఉజ్జీయేలు కుమారుడైన ఎలీసాఫాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘అధిపతి’ అనే పదానికి ‘నాయకుడు’ లేదా ‘ప్రధానుడు’ అని కూడా అనువదించవచ్చు (హీబ్రూ: נָשִׂיא).'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘తండ్రి ఇల్లు’; ఇది పితృవంశానికి చెందిన విస్తృత కుటుంబ లేదా గోత్ర విభాగాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: అధిపతి
  rationale: נָשִׂיא ఇక్కడ గోత్ర సంబంధమైన అధికార బాధ్యతగల నాయకుణ్ణి సూచిస్తుంది. ‘అధిపతి’ రాజరిక భావాన్ని తప్పిస్తూ గుర్తింపుపొందిన అధికారాన్ని తెలియజేస్తుంది. వావ్ ఈ జాబితాలో కొనసాగింపును సూచించినా, సహజమైన తెలుగు వాక్యంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టనవసరం లేదు.
- source_word: בֵּית אָב
  choice: పితృకుటుంబం
  rationale: ఇది అక్షరార్థంగా ‘తండ్రి ఇల్లు’; ఇశ్రాయేలు పితృవంశ సామాజిక నిర్మాణంలోని విస్తృత కుటుంబ విభాగాన్ని సూచించే నుడికారం. ‘పితృకుటుంబం’ ఆ బంధుత్వ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹת
  choice: వంశాల
  rationale: מִשְׁפָּחוֹת కుటుంబ లేదా వంశ సమూహాలను సూచిస్తుంది. ‘వంశాల’ అనే రూపం కహాతీయులలోని బహువచన ఉపవిభాగాలను సహజంగా తెలియజేస్తుంది.
- source_word: הַקְּהָתִי
  choice: కహాతీయుల
  rationale: నిర్దిష్ట ప్రత్యయ నామవాచకం సమూహార్థంలో కహాతు సంతతిని సూచిస్తుంది; తెలుగులో ‘కహాతీయులు’ స్పష్టమైన సమూహనామం.
- source_word: אֶלִיצָפָן
  choice: ఎలీషాఫాను
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן עֻזִּיאֵל
  choice: ఉజ్జీయేలు కుమారుడైన
  rationale: సాధారణ వంశావళి సూత్రాన్ని సహజమైన తెలుగు గుర్తింపు వాక్యంగా అందిస్తుంది.
