id: NUM.3.49
reference: Numbers 3:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: te
  text: మోషే లేవీయులచేత విమోచించబడినవారి సంఖ్యకు మించి ఉన్నవారి దగ్గర నుంచి విమోచన సొమ్మును[a] తీసుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విడుదల మూల్యాన్ని.” హీబ్రూ పదబంధం విమోచన కోసం చెల్లించే మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, విమోచన లెక్కలో లేవీయులు ప్రాతినిధ్యం వహించిన వారి సంఖ్యకంటే ఎక్కువగా ఉన్న ఇశ్రాయేలీయుల తొలి సంతానం దగ్గర నుంచి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే సాధారణ కథన క్రియకు నేరమైన అర్థం; ఈ సందర్భంలో ‘స్వీకరించాడు’ అనవచ్చుగానీ, మూలంలోని సరళ భావాన్ని ‘తీసుకున్నాడు’ నిలుపుతుంది.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: విమోచన సొమ్ము
  rationale: విమోచన కోసం చెల్లించే మొత్తాన్ని సూచిస్తుంది. ‘వెండి’ అని అక్షరార్థంగా అనువదించడంకంటే ఆధునిక తెలుగులో ‘సొమ్ము’ సహజంగా ఉండి న్యాయపరమైన/ఆచారపరమైన భావాన్ని నిలుపుతుంది.
- source_word: מֵאֵת
  choice: దగ్గర నుంచి
  rationale: మొత్తం ఎవరి నుంచి తీసుకోబడిందో తెలియజేసే మూలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעֹדְפִים
  choice: మించి ఉన్నవారు
  rationale: ముందటి సందర్భంలో లేవీయుల సంఖ్యకంటే అధికంగా ఉన్న ఇశ్రాయేలీయుల తొలి సంతానాన్ని సూచించే తులనాత్మక మిగులును వ్యక్తం చేస్తుంది; ఈ వాక్యంలో స్పష్టంగా లేని ‘తొలి సంతానం’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: עַל
  choice: సంఖ్యకు మించి
  rationale: ఇక్కడ సంఖ్యాపరమైన అధిక్యతను తెలిపే తులనాత్మక ప్రయోగం; తెలుగులో స్పష్టత కోసం ‘సంఖ్యకు’ సందర్భానుగుణంగా చేర్చబడింది.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: లేవీయులచేత విమోచించబడినవారు
  rationale: హీబ్రూ నిర్మాణం ‘లేవీయులకు సంబంధించిన విమోచితులు’ అనే విస్తృత సంబంధాన్ని అనుమతించినా, సందర్భంలో లేవీయులు ప్రతిగా లెక్కించబడటం ద్వారా విమోచన పొందినవారిని సూచిస్తుంది. ఈ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: פְּדוּיֵי הַלְוִיִּם లోని సంబంధం
  choice: లేవీయులచేత విమోచించబడినవారు
  alternative: లేవీయులకు సంబంధించిన విమోచితులు
  rationale: సంఖ్యాకాండము 3లో లేవీయులు ఇశ్రాయేలీయుల తొలి సంతానానికి బదులుగా తీసుకోబడిన సందర్భం ఈ సాధనార్థక భావానికి మద్దతిస్తుంది. అయినప్పటికీ హీబ్రూ సమాస సంబంధం స్వతహాగా మరింత విస్తృతమైనదని గమనించాలి; అనువాదం ఏ ప్రత్యేక సిద్ధాంతాన్ని అదనంగా విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంఖ్యాపరమైన సంబంధం అర్థమయ్యేలా ‘సంఖ్యకు’ చేర్చబడింది. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
