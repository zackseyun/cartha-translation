id: NUM.3.12
reference: Numbers 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: te
  text: “మరియు నేను, ఇదిగో, ఇశ్రాయేలు కుమారులలోనుండి[a] లేవీయులను, ఇశ్రాయేలు కుమారులలో గర్భాన్ని తెరిచే ప్రతి తొలిపుట్టిన కుమారునికి బదులుగా, తీసుకున్నాను; లేవీయులు నావారై ఉంటారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలు కుమారులు” అనే చోట “ఇశ్రాయేలీయులు” అని కూడా అనువదించవచ్చు. హీబ్రూ వ్యక్తీకరణ అక్షరార్థంగా పుంలింగంలో ఉండి, సూత్రబద్ధంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: ఇదిగో, నేను
  rationale: హీబ్రూలోని స్పష్టమైన ప్రథమ పురుష సర్వనామాన్నీ, הִנֵּה ఇచ్చే శ్రద్ధాకర్షకమైన ఉద్ఘాటననూ సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: לָקַחְתִּי
  choice: తీసుకున్నాను
  rationale: పూర్తయిన దైవ చర్యను, దాని కొనసాగుతున్న ఫలితంతో సహా, సరళంగా వ్యక్తం చేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోనుండి
  rationale: ఒక పెద్ద సమూహం మధ్యనుండి ఎంపిక చేయడాన్ని, అలాగే మూలంలోని సూత్రబద్ధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే వ్యక్తీకరణను కాపాడుతుంది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఈ ఆరాధనాపరమైన, న్యాయపరమైన సందర్భంలోని ప్రతిస్థాపన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל בְּכוֹר פֶּטֶר רֶחֶם
  choice: గర్భాన్ని తెరిచే ప్రతి తొలిచూలు కుమారుడు
  rationale: మూలంలోని శరీరాధారిత న్యాయపదబంధాన్ని నిలుపుతూ, ఇక్కడ ఉద్దేశించిన మగ తొలిసంతానాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְהָיוּ לִי
  choice: నావారై ఉంటారు
  rationale: దేవునికి ప్రత్యేకంగా చెందినవారనే స్వాధీనత మరియు ప్రతిష్ఠిత సంబంధాన్ని, అదనపు సిద్ధాంత పదజాలం లేకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగమైన, నిబంధనాపరమైన సూత్రబద్ధ వ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపింది; మరింత సహజమైన సామూహిక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: וְהָיוּ לִי లో లేవీయుల దేవసంబంధం
  choice: లేవీయులు నావారై ఉంటారు
  alternative: లేవీయులు నాకు చెందుతారు
  rationale: వాక్యం తెలియజేసే దైవ హక్కును, ప్రతిష్ఠితమైన చెందుదలను ప్రత్యక్షంగా ఉంచుతుంది; తరువాతి సిద్ధాంత వర్గీకరణలను దీనిలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు చర్య వాక్యాలుగా విభజించినా, ప్రతిస్థాపన సంబంధం మరియు చివరి దైవ హక్కు ప్రకటన యథాతథంగా ఉంచబడ్డాయి.
