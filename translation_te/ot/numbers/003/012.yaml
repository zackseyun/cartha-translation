revisions:
- from: “ఇదిగో, నేను ఇశ్రాయేలు కుమారులలోనుండి లేవీయులను తీసుకున్నాను. ఇశ్రాయేలు కుమారులలో గర్భాన్ని తెరిచే ప్రతి తొలిచూలు కుమారునికి బదులుగా వారిని తీసుకున్నాను. లేవీయులు నావారై ఉంటారు.[a]”
  to: “మరియు నేను, ఇదిగో, ఇశ్రాయేలు కుమారులలోనుండి[a] లేవీయులను, ఇశ్రాయేలు కుమారులలో గర్భాన్ని తెరిచే ప్రతి తొలిపుట్టిన కుమారునికి బదులుగా, తీసుకున్నాను; లేవీయులు నావారై ఉంటారు.”
