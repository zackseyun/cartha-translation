  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַמֻּדֵ֧י הֶ/חָצֵ֛ר סָבִ֖יב וְ/אַדְנֵי/הֶ֑ם וִ/יתֵדֹתָ֖/ם וּ/מֵֽיתְרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/037.yaml
  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: te
  text: ప్రాంగణం చుట్టూ ఉన్న స్తంభాలు, వాటి ఆధారాలు[a], వాటి మేకులు, వాటి తాళ్లు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పీఠాలు’ లేదా ‘గుంటలుగల ఆధారాలు.’ హీబ్రూ పదం, ముఖ్యంగా నివాస గుడారపు వర్ణనల్లో, స్తంభాలను నిలబెట్టే నిర్మాణాత్మక అడుగు ఆధారాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తాడులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: స్తంభాలు
  rationale: ప్రాంగణపు తెరలకు ఆధారంగా నిలిచే నిటారు నిర్మాణ భాగాలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘స్తంభాలు’ సహజమైన, స్పష్టమైన పదం.
- source_word: הֶחָצֵר
  choice: ప్రాంగణం
  rationale: నివాస గుడారం చుట్టూ ఉన్న ఆవరణ స్థలాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ నిర్మాణ సందర్భానికి తగిన సులభమైన పదం.
- source_word: סָבִיב
  choice: చుట్టూ ఉన్న
  rationale: ప్రాంగణం చుట్టుకొలత అంతటినీ సూచించే భావాన్ని సహజమైన తెలుగు పదబంధంతో నిలుపుతుంది.
- source_word: אַדְנֵיהֶם
  choice: వాటి పీఠాలు
  rationale: స్తంభాలను నిలబెట్టే అడుగు భాగాలు లేదా లోహపు ఆధారాలను సూచిస్తుంది; ‘పీఠాలు’ పాఠకులకు అర్థమయ్యే నిర్మాణపరమైన పదం. ‘దిమ్మలు’ కూడా సందర్భానుసారం సాధ్యం.
- source_word: יְתֵדֹתָם
  choice: వాటి మేకులు
  rationale: నిర్మాణాన్ని బిగించడానికి నేలలో పాతే గుడారపు మేకులను సూచిస్తుంది; మూలంలోని సంక్షిప్తతను నిలుపుతూ ‘మేకులు’ సహజంగా ఉంది.
- source_word: מֵיתְרֵיהֶם
  choice: వాటి తాళ్లు
  rationale: మేకులతో నిర్మాణాన్ని బిగించే తాళ్లను సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అర్థమవుతుంది.
- source_word: וְ
  choice: మరియు/జాబితా అనుసంధానం
  rationale: మూలంలోని పునరావృత సంధికారకం జాబితా కొనసాగింపును సూచిస్తుంది. తెలుగులో సహజత్వం కోసం ప్రతి అంశం మధ్య దాన్ని విడిగా అనువదించకుండా కామాలతో జాబితా నిర్మాణాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వరూపాన్ని కాపాడుతూ సంక్షిప్తంగా అనువదించబడింది. ఈ వాక్యం ముందరి వచనంలోని జాబితాకు కొనసాగింపు కావడంతో క్రియను చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
