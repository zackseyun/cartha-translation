  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: te
  text: 'వారి బాధ్యత: మందసం[a], బల్ల, దీపస్తంభం, బలిపీఠాలు, పరిచర్య చేయడానికి ఉపయోగించే పవిత్రస్థలపు ఉపకరణాలు[b], ప్రవేశ తెర[c], దానికి సంబంధించిన సేవ అంతా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి పర్యవేక్షణలో’ లేదా ‘వారి సంరక్షణ బాధ్యతలో’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పవిత్ర ఉపకరణాలు’ లేదా ‘పవిత్రస్థలపు పాత్రలు’.
    reason: lexical_alternative
  - marker: c
    text: ఇది ప్రవేశద్వారం వద్ద ఉండే వేలాడే తెర; లోపలి అడ్డతెర కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: వారి బాధ్యతలో ... ఉన్నాయి
  rationale: యాజక సంబంధమైన సందర్భంలో ఈ పదం అప్పగించబడిన బాధ్యత లేదా సంరక్షణ కర్తవ్యాన్ని సూచిస్తుంది. తెలుగులో జాబితాతో సహజంగా కలిసేలా ఈ నిర్మాణం వాడబడింది.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: గుడార సందర్భంలో ఇది పవిత్ర మందసాన్ని సూచిస్తుంది. మూలంలో లేని ‘సాక్ష్యపు’ అనే వివరణను చేర్చలేదు.
- source_word: הַשֻּׁלְחָן
  choice: బల్ల
  rationale: మూలంలోని సాధారణ నామవాచకాన్ని సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభం
  rationale: ఆరాధనలో ఉపయోగించే దీపాలను నిలిపే ప్రత్యేక సామగ్రిని సూచించే సహజ తెలుగు పదం.
- source_word: הַמִּזְבְּחֹת
  choice: బలిపీఠాలు
  rationale: హీబ్రూ బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: పవిత్రస్థలపు ఉపకరణాలు
  rationale: כְּלִים అనేది పాత్రలు లేదా పనిముట్లను విస్తృతంగా సూచించగలదు; ఇక్కడ పవిత్రస్థల సేవకు ఉపయోగించే సామగ్రి అనే భావాన్ని ‘ఉపకరణాలు’ సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: వాటితో వారు పరిచర్య చేసే
  rationale: పవిత్ర సేవలో ఆ ఉపకరణాలు సాధనాలుగా ఉపయోగించబడుతున్నాయని చూపుతుంది; שׁרת లోని ఆరాధనా సందర్భాన్ని ‘పరిచర్య’ నిలుపుతుంది.
- source_word: הַמָּסָךְ
  choice: ప్రవేశ తెర
  rationale: ఇది లోపలి అడ్డతెర కంటే ప్రవేశద్వారం వద్ద వేలాడే తెరను సూచిస్తుంది; ప్రధాన పాఠంలో సంక్షిప్తంగా స్పష్టం చేయబడింది.
- source_word: וְכָל עֲבֹדָתוֹ
  choice: దానికి సంబంధించిన సేవ అంతా
  rationale: ఏకవచన ప్రత్యయపు సూచనను అతిగా నిర్ధారించకుండా ‘దానికి సంబంధించిన’ అని ఉంచి, ఆరాధనా సందర్భంలోని עֲבֹדָה ను ‘సేవ’గా అనువదించింది.
theological_decisions:
- issue: గుడార ఆరాధనకు సంబంధించిన సేవా పదజాలం
  choice: ‘పరిచర్య’ మరియు ‘సేవ’
  alternative: ‘పని చేయడం’ మరియు ‘పని’
  rationale: ఈ వచనం పరిపాలనా బాధ్యతలను తెలిపినా, మూల పదజాలానికి పవిత్ర ఆరాధనా నేపథ్యం ఉంది. తరువాతి సంఘ వ్యవస్థకు చెందిన ప్రత్యేక అర్థాలను రుద్దకుండా ఆ నేపథ్యాన్ని నిలుపుతుంది.
- issue: עֲבֹדָתוֹ లోని ఏకవచన ప్రత్యయపు పూర్వపదం
  choice: ‘దానికి సంబంధించిన సేవ అంతా’ అని అస్పష్టతను నిలుపడం
  alternative: ‘తెరకు సంబంధించిన సేవ అంతా’ లేదా ‘ఈ వస్తువుల సేవ అంతా’ అని నిర్దిష్టీకరించడం
  rationale: వ్యాకరణపరంగా ఏకవచన సూచన ఉన్నప్పటికీ దాని పరిధిని సందర్భం పూర్తిగా నిర్ధారించదు; అందువల్ల అనువాదం దానిని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. జాబితా సహజంగా వినిపించేందుకు ‘వారి బాధ్యతలో ... ఉన్నాయి’ అనే నిర్మాణం ఉపయోగించబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
