revisions:
- from: వారి బాధ్యతలో మందసం[a], బల్ల, దీపస్తంభం, బలిపీఠాలు, వాటితో వారు పరిచర్య చేసే పవిత్రస్థలపు ఉపకరణాలు[b], ప్రవేశ తెర[c], దానికి సంబంధించిన సేవ అంతా ఉన్నాయి.
  to: 'వారి బాధ్యత: మందసం[a], బల్ల, దీపస్తంభం, బలిపీఠాలు, పరిచర్య చేయడానికి ఉపయోగించే పవిత్రస్థలపు ఉపకరణాలు[b], ప్రవేశ తెర[c], దానికి సంబంధించిన సేవ అంతా.'
  rationale: The revision makes the assignment construction idiomatic and removes an unnecessary explicit subject from the instrumental relative clause. It retains the source list, cultic register, plurality of the altars, and the deliberately non-specific antecedent of ‘దానికి సంబంధించిన సేవ అంతా.’ All footnote anchors and their corresponding notes are retained.
