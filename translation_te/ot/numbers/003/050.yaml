  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘తొలిచూలువారు’ సమూహార్థాన్ని, ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని మగ సంతాన సూచనను నిలుపుతాయి. ‘షెకెలు’ను ప్రాచీన బరువు ప్రమాణంగా లిప్యంతరీకరించాం.
