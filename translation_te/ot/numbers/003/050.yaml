  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల తొలిచూలువారి నుండి[a] అతడు వెండిని తీసుకున్నాడు—పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం వెయ్యి మూడు వందల అరవై ఐదు షెకెల్లు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయుల తొలిచూలువారి నుండి.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల తొలిచూలువారి నుండి” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరిశుద్ధస్థలపు షెకెలు ప్రకారం.” ఈ పదబంధం పరిశుద్ధస్థలంలో ఉపయోగించే ప్రామాణిక బరువు ప్రమాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: నుండి
  rationale: విమోచన వెండి ఎవరి నుండి తీసుకోబడిందో సూచిస్తుంది; సందర్భానికి సహజమైన తెలుగు రూపం.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల తొలిచూలువారు
  rationale: ఏకవచన సమాసరూపమైన בְּכוֹר ఇక్కడ సమూహార్థంలో ఉంది. ముందరి జనగణన, విమోచన సందర్భంలోని మగ తొలిచూలు సంతానాన్ని సూచిస్తూ హెబ్రీ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: לָקַח
  choice: అతడు ... తీసుకున్నాడు
  rationale: క్రియ యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతుంది; ‘స్వీకరించాడు’ అని ఆర్థిక సందర్భాన్ని అతిగా వివరణ చేయదు.
- source_word: הַכָּסֶף
  choice: వెండి
  rationale: כֶּסֶף యొక్క ప్రాథమిక పదార్థార్థం ‘వెండి’; తరువాత షెకెల్ల బరువు చెప్పబడటం వల్ల ఇదే సందర్భానికి సరిపోతుంది.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: వెయ్యి మూడు వందల అరవై ఐదు
  rationale: హెబ్రీ సంఖ్యా భాగాలను సహజమైన ఆధునిక తెలుగు సంఖ్యా క్రమంలో అందిస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది ప్రత్యేక నాణెం కంటే పరిశుద్ధస్థలంలో వాడే ప్రామాణిక బరువును సూచిస్తుందని స్పష్టం చేస్తూ, మూలంలోని ఆరాధనా సంబంధాన్ని నిలుపుతుంది.
