    rationale: The sequence ‘లేవి కుమారులు వారి పేర్ల ప్రకారం వీరు’ is not a natural modern Telugu construction. ‘పేర్ల ప్రకారం లేవి కుమారులు వీరు’ clearly introduces the following list and corresponds to the Hebrew ‘These were the sons of Levi, by their names.’
