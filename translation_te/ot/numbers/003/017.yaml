translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని పేర్లను పరిచయం చేసే సూత్రవాక్యాన్ని కాపాడుతూ సహజమైన తెలుగు పదక్రమాన్ని ఉపయోగించాం.
