  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: te
  text: 'పేర్ల ప్రకారం లేవి కుమారులు వీరు: గేర్షోను, కహాతు, మెరారి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: వీరు
  rationale: వంశావళి జాబితాను పరిచయం చేసే సందర్భంలో היה యొక్క సాధారణ భూతార్థాన్ని, אֵלֶּה యొక్క సూచనార్థాన్ని సహజమైన తెలుగు నామవాక్య నిర్మాణంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: בְנֵי לֵוִי
  choice: లేవి కుమారులు
  rationale: ఇక్కడ ప్రస్తావించబడినవారు లేవి ప్రత్యక్ష కుమారులు; అందువల్ల విస్తృతార్థమైన ‘సంతతి’ కంటే ‘కుమారులు’ మూలానికి మరింత ఖచ్చితంగా సరిపోతుంది.
- source_word: בִּשְׁמֹתָם
  choice: వారి పేర్ల ప్రకారం
  rationale: ‘వారి పేర్లతో/వారి పేర్ల ప్రకారం’ అనే మూలార్థాన్ని నిలుపుతూ, తరువాత వచ్చే పేర్ల జాబితాను సహజంగా పరిచయం చేస్తుంది.
- source_word: גֵּרְשׁוֹן
  choice: గేర్షోను
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సులభంగా పలికే విధంగా, మూల ధ్వనులకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: מְרָרִי
  choice: మెరారి
  rationale: హీబ్రూ వ్యక్తిపేరును మూల ధ్వనులకు సమీపంగా తెలుగులో లిప్యంతరీకరించింది.
