source:
  edition: WLC
  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: te
  text: “లేవి గోత్రాన్ని దగ్గరకు తీసుకువచ్చి, యాజకుడైన అహరోను ఎదుట నిలబెట్టు. వారు అతనికి సేవ చేయాలి.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి పరిచర్య చేయాలి.” హీబ్రూ క్రియ సహాయక సేవను లేదా ఆరాధనా సంబంధమైన పరిచర్యను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: దగ్గరకు తీసుకువచ్చి
  rationale: קרב అనే క్రియ హిఫీల్ రూపంలో ‘దగ్గరకు తీసుకురా’ అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం దాని స్పష్టమైన సమీపింపజేసే భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה לֵוִי
  choice: లేవి గోత్రాన్ని
  rationale: מַטֶּה అనే పదానికి అక్షరార్థంగా ‘దండం’ అని ఉన్నా, ఇక్కడ అది గోత్ర సమూహాన్ని సూచిస్తుంది; అందువల్ల ‘లేవి గోత్రం’ సందర్భోచితం.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: నిలబెట్టు
  rationale: עמד హిఫీల్ రూపం ‘నిలిచేలా చేయడం’ లేదా ‘నియమిత స్థానంలో ఉంచడం’ అని సూచిస్తుంది. ‘నిలబెట్టు’ మూలంలోని కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను ఎదుట
  rationale: לִפְנֵי సాధారణంగా ‘ఎదుట’ లేదా ‘సమక్షంలో’ అని అర్థం. అధికారికంగా సమర్పించి నిలబెట్టే సందర్భానికి ‘ఎదుట’ సరిపోతుంది.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: వారు అతనికి సేవ చేయాలి
  rationale: שרת అనేది సహాయక లేదా ఆరాధనా సంబంధమైన సేవను సూచించగలదు. אֹתוֹ అనే ప్రత్యక్ష కర్మ సర్వనామం అహరోనును సూచిస్తుంది; ఏకవచన సమష్టివాచకమైన ‘గోత్రం’ తర్వాత మూలంలో బహువచన క్రియ రావడాన్ని ‘వారు’ ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: అహరోనుకు లేవీయులు చేసే సేవ స్వభావం
  choice: లేవీయులు అహరోనుకు సేవ చేయాలి
  alternative: లేవీయులు అహరోనుతో కలిసి సేవ చేయాలి
  rationale: וְשֵׁרְתוּ אֹתוֹ లోని ప్రత్యక్ష కర్మ సర్వనామం సేవ అహరోనుకు చేయబడుతుందని సహజంగా సూచిస్తుంది. కాబట్టి మూలంలో లేని ‘అతనితో కలిసి’ అనే భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘యాజకుడైన అహరోను’ అధికారిక పరిచయాన్ని స్పష్టంగా ఉంచుతుంది; ‘సేవ చేయాలి’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ‘పరిచర్య’ అనే ఆరాధనా సంబంధమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
