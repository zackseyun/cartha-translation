  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఇశ్రాయేలు కుమారులలో నెల వయసు నిండినవారి నుండి పై వయసు వారివరకు ఉన్న ప్రతి తొలిపుట్టిన మగబిడ్డను లెక్కించి, వారి పేర్ల సంఖ్యను నమోదు చేయి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని పేరుపేరునా లెక్కించు.” అక్షరార్థంగా, “వారి పేర్ల సంఖ్యను తీసుకో.”
    reason: హీబ్రూ నుడికారం పేర్లవారీగా లెక్కింపు చేయడాన్ని సూచిస్తుంది; ప్రధాన పాఠంలోని సహజమైన తెలుగు రూపానికి ప్రత్యామ్నాయాన్ని అందిస్తుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో వ్యక్తపరచడం ద్వారా అది సాధారణ బిరుదుగా మారిపోకుండా కాపాడాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פְּקֹד
  choice: లెక్కించు
  rationale: ఈ జనగణన సందర్భంలో క్రియకు ‘లెక్కించు/సంఖ్య తీసుకో’ అనే అర్థం ఉంది; ‘లెక్కించు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: כָּל בְּכֹר זָכָר
  choice: ప్రతి తొలిచూలు మగబిడ్డను
  rationale: בכור మొదట పుట్టినవాణ్ణి, זכר మగవాణ్ణి సూచిస్తాయి; ఈ ఎంపిక రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలో
  rationale: హీబ్రూ పదబంధంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే వంశసంబంధ రూపాన్ని నిలుపుతూ, జనగణనలో వారిలోనుండి లెక్కించాలనే భావానికి ‘లో’ వాడాం.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: ఇది లెక్కింపుకు కనిష్ఠ వయోపరిమితిని సూచించే హీబ్రూ నుడికారం; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలిపాం.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: వారిని పేరుపేరునా లెక్కించి, వారి సంఖ్యను నమోదు చేయి
  rationale: అక్షరార్థంగా ‘వారి పేర్ల సంఖ్యను ఎత్తు/తీసుకో’ అనే ఈ నుడికారం పేర్లవారీగా సంఖ్యను తీసుకోవడాన్ని సూచిస్తుంది. తెలుగు వాక్యం ఆ కార్యార్థాన్ని స్పష్టంగా ఇస్తుంది; అక్షరరూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. కథన క్రమం, వయోపరిమితి, మగ తొలిచూలువారి ప్రత్యేకత, పేర్లవారీ లెక్కింపు అన్నీ నిలుపబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత వాక్యభాగం చివర ఉంచబడింది.
