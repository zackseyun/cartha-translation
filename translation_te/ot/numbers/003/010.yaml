  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: te
  text: నీవు అహరోనును, అతని కుమారులను నియమించాలి; వారు తమ యాజకత్వాన్ని కాపాడాలి. అయితే సమీపించే అనధికార వ్యక్తి[a] మరణశిక్ష పొందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బయటి వ్యక్తి.’ ఇక్కడ హీబ్రూ పదానికి అక్షరార్థం ‘బయటి వ్యక్తి’; అది జాతిపరంగా విదేశీయుణ్ణి కాక, యాజక సేవకు అనుమతి లేని ఎవరినైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: నియమించాలి
  rationale: פקד అనే క్రియకు పర్యవేక్షించడం, లెక్కించడం, నియమించడం వంటి అర్థాలు ఉన్నాయి. ఇక్కడ అహరోను, అతని కుమారులు యాజకత్వాన్ని కాపాడాలనే తరువాతి మాటను బట్టి, వారిని ఆ బాధ్యతకు నియమించడం అనే భావం సరిపోతుంది.
- source_word: וְשָׁמְרוּ
  choice: కాపాడాలి
  rationale: שׁמר అంటే కాపాడడం, జాగ్రత్తగా నిర్వహించడం, పాటించడం. ఇక్కడ యాజక సేవకు సంబంధించిన బాధ్యతలను, హద్దులను కాపాడే భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: כְּהֻנָּתָם
  choice: తమ యాజకత్వాన్ని
  rationale: ఈ నామవాచకం యాజక హోదాను మాత్రమే కాక, యాజకుని కార్యబాధ్యతను కూడా సూచిస్తుంది. ‘యాజకత్వం’ సంక్షిప్తంగా రెండు కోణాలనూ నిలుపుతుంది.
- source_word: הַזָּר
  choice: బయటి వ్యక్తి
  rationale: ఇక్కడ זָר జాతిపరంగా విదేశీయుణ్ణి కాక, యాజక పరిధిలో అధికారం లేని బయటి వ్యక్తిని సూచిస్తుంది. మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: הַקָּרֵב
  choice: సమీపించే
  rationale: קרב అనే పదం పవిత్ర స్థలానికి లేదా పరిమిత యాజక సేవకు దగ్గరగా రావడాన్ని సూచిస్తుంది. ‘సమీపించే’ మూలంలోని స్పష్టమైన చేరువ భావాన్ని నిలుపుతుంది.
- source_word: יוּמָת
  choice: మరణశిక్ష పొందాలి
  rationale: מות యొక్క హోఫల్ రూపం కేవలం చనిపోవడాన్ని కాక, మరణానికి గురిచేయబడడాన్ని సూచిస్తుంది. అందువల్ల ఇది న్యాయపరమైన శిక్ష అని ‘మరణశిక్ష పొందాలి’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యాజక సేవకు పరిమిత ప్రవేశం
  choice: అహరోను, అతని కుమారులే యాజకత్వాన్ని నిర్వహించి కాపాడేందుకు నియమించబడ్డారని, ఆ పరిధికి అనధికారంగా సమీపించే వ్యక్తికి మరణశిక్ష ఉందని పాఠ్యం తెలియజేస్తుంది.
  alternative: ఈ వాక్యం ఒక్కటే నిర్దిష్ట ఆచార హద్దులను వివరించకుండా, సాధారణంగా యాజకుడు కాని వ్యక్తిని పవిత్ర సేవకు సమీపించకుండా నిషేధిస్తున్నదని చదవవచ్చు.
  rationale: హీబ్రూ పాఠ్యం యాజకత్వంపై నియమిత సంరక్షణను, బయటి వ్యక్తి సమీపిస్తే కలిగే ప్రాణదండనను బలంగా చెబుతుంది. తరువాతి సంప్రదాయాల వివరాలను చేర్చకుండా ఆ ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఆజ్ఞారూప భావానికి ‘నియమించాలి,’ ‘కాపాడాలి’ అనేవి ఉపయోగించబడ్డాయి; న్యాయపరమైన నిష్క్రియార్థాన్ని ‘మరణశిక్ష పొందాలి’ నిలుపుతుంది.
