  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: te
  text: యాహ్వే ఆజ్ఞ ప్రకారం, తనకు ఆజ్ఞాపించబడినట్టుగానే మోషే వారిని లెక్కించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే నోటి ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: లెక్కించాడు
  rationale: లేవీయుల జనగణన సందర్భంలో פקד వ్యక్తులను లెక్కించి నమోదు చేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘లెక్కించాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: సందర్భంలో ముందుగా ప్రస్తావించబడిన లేవీయులను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’ అని ఉన్నా, ఇక్కడ దైవ ఆజ్ఞకు అనుగుణంగా చేయడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించబడినట్టే
  rationale: ముందుగా ఇవ్వబడిన ఆజ్ఞతో మోషే చర్య ఖచ్చితంగా సరిపోవడాన్ని ‘-ట్టే’ సహజంగా తెలియజేస్తుంది.
- source_word: צֻוָּה
  choice: తనకు ఆజ్ఞాపించబడినట్టే చేశాడు
  rationale: పుయల్ కర్మణి రూపంలోని ‘అతడు ఆజ్ఞాపించబడ్డాడు’ అనే భావాన్ని నిలుపుతూ, తెలుగులో అసంపూర్ణంగా వినిపించకుండా సందర్భానుగుణంగా ‘చేశాడు’ చేర్చబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ విస్తృతంగా పరిచితమైన రూపం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితమై లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞ–విధేయత సంబంధాన్ని నిలుపుతూ, హీబ్రూ నుడికారానికి అర్థానువాదం ప్రధాన పాఠంలోను అక్షరార్థం పాదటిప్పణిలోను ఇచ్చాం.
