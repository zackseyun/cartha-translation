translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జనగణన శైలి. మూలంలోని దీర్ఘ లెక్కింపు సూత్రాన్ని పఠనసౌలభ్యం కోసం విరామచిహ్నాలతో అమర్చాం; అర్థాన్ని సంక్షిప్తం చేయలేదు.
