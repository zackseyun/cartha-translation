  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: te
  text: వారిలో లెక్కించబడినవారు[a]—ఒక నెల వయసు మొదలుకొని పైబడిన మగవారందరి సంఖ్య ప్రకారం—ఆరు వేల రెండువందల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి లెక్కింపబడినవారు” లేదా “వారిలో నమోదు చేయబడినవారు.” హీబ్రూ పదం ఈ వంశానికి చెందిన జనగణన మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד నుంచి వచ్చిన ఈ నామరూపం, 3mp ప్రత్యయంతో, ఆ వంశంలో జనగణనలో నమోదైన వ్యక్తులను సూచిస్తుంది. వ్యక్తుల భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: בְּמִסְפַּר
  choice: లెక్క ప్రకారం
  rationale: జనగణనకు ఆధారమైన గణనను పరిచయం చేసే పదబంధం; తెలుగు లెక్కింపు సందర్భంలో సహజమైన ప్రయోగం.
- source_word: כָּל זָכָר
  choice: మగవారందరి
  rationale: హీబ్రూ పాఠంలోని స్పష్టమైన పురుషలింగ సూచనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ఒక నెల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: కనిష్ఠ వయోపరిమితి ఒక నెల అని, దాని పై వయసులన్నీ కలుస్తాయని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: ఆరు వేల రెండువందల మంది
  rationale: హీబ్రూ సంఖ్యను గద్యశైలిలో పదాలతో ఇస్తూ, లెక్కించబడిన వారు వ్యక్తులని ‘మంది’ ద్వారా స్పష్టం చేస్తుంది.
