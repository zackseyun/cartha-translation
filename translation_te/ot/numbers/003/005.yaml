  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’; దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామపు హీబ్రూ రూపాన్ని మరియు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: హీబ్రూ కథనంలో దైవవాక్యాన్ని పరిచయం చేసే సాధారణ సూత్రప్రయోగం. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘అన్నాడు’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన నామరూపంగా అందిస్తుంది.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో హీబ్రూ אֶל సూచించే సంబోధిత వ్యక్తిని తెలుగులో సహజమైన ‘తో’ విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే మాటల విషయాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ద్విరుక్తిగా అనిపించే ‘చెబుతూ అన్నాడు’ను నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. హీబ్రూ నామోచ్చారణ ఖచ్చితంగా నిర్ధారించలేనందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచి, తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో వాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన దైవవాక్య పరిచయ సూత్రం. తరువాతి వచనంలోని ప్రత్యక్ష వాక్యం కొనసాగుతుందని సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
