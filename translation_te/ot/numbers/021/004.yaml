id: NUM.21.4
reference: Numbers 21:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: te
  text: తరువాత వారు హోరు కొండనుండి బయలుదేరి, ఎదోము దేశాన్ని చుట్టివెళ్లడానికి ఎర్ర సముద్రం దారిన[a] వెళ్లారు. దారిలో ప్రజలు సహనం కోల్పోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘రెల్లుల సముద్రం దారిన.’ హీబ్రూ: యామ్ సూఫ్.'
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రజలు నిరుత్సాహపడ్డారు,’ లేదా ‘దారిలో ధైర్యం కోల్పోయారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: అరణ్య ప్రయాణ వర్ణనల్లో נסע శిబిరాన్ని విడిచి తదుపరి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరారు’ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מֵהֹר הָהָר
  choice: హోరు కొండనుండి
  rationale: הֹר הָהָר స్థలనామాన్ని తెలుగులో సహజమైన ‘హోరు కొండ’గా ఇచ్చాం.
- source_word: דֶּרֶךְ יַם סוּף
  choice: ఎర్ర సముద్రం వైపు వెళ్లే మార్గంలో
  rationale: דֶּרֶךְ ఇక్కడ మార్గాన్ని సూచిస్తుంది. యַם סוּף‌కు సంప్రదాయ అనువాదమైన ‘ఎర్ర సముద్రం’ ప్రధాన పాఠ్యంలో ఉంచి, ‘రెల్లుల సముద్రం’ అనే సాధ్యమైన పదార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לִסְבֹב
  choice: చుట్టివెళ్లడానికి
  rationale: ఈ క్రియారూపం ప్రయోజనాన్ని వ్యక్తం చేస్తుంది—ఎదోము దేశం గుండా కాక దాని చుట్టూ వెళ్లడం.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: ఎదోము దేశాన్ని
  rationale: אֶרֶץ ఒక జాతి లేదా ప్రాంత నామంతో ఉన్నప్పుడు ‘దేశం’ లేదా ‘ప్రాంతం’ అనే అర్థం ఇస్తుంది; ఇక్కడ ‘ఎదోము దేశం’ సూటిగా, సహజంగా ఉంది.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: ప్రజలు సహనం కోల్పోయారు
  rationale: ‘ప్రజల ప్రాణం చిన్నదైంది’ అనే హీబ్రూ నుడికారం అసహనం, విసుగు లేదా నిరుత్సాహాన్ని సూచిస్తుంది. సందర్భంలో ‘సహనం కోల్పోయారు’ స్పష్టంగా, సహజంగా ఉంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: בַּדָּרֶךְ
  choice: దారిలో
  rationale: בַּדָּרֶךְ‌ను ప్రధానంగా స్థల/ప్రయాణ సందర్భార్థంలో ‘దారిలో’గా అనువదించాం; ‘ఆ దారి కారణంగా’ అనే కారణార్థ ఛాయ కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ప్రయాణ మార్గం మరియు హీబ్రూ నుడికారంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణుల్లో సంరక్షించాం.
