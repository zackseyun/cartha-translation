  revised_text: తరువాత వారు హోరు కొండనుండి బయలుదేరి, ఎదోము దేశాన్ని చుట్టివెళ్లడానికి ఎర్ర సముద్రం దారిన[a] వెళ్లారు. దారిలో ప్రజలు సహనం కోల్పోయారు.[b]
