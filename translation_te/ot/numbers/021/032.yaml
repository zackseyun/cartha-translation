source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח מֹשֶׁה֙ לְ/רַגֵּ֣ל אֶת יַעְזֵ֔ר וַֽ/יִּלְכְּד֖וּ בְּנֹתֶ֑י/הָ ו/יירש אֶת הָ/אֱמֹרִ֥י אֲשֶׁר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: te
  text: మోషే యాజేరును నిఘా వేయడానికి మనుషులను పంపాడు. వారు దాని అనుబంధ గ్రామాలను[a] స్వాధీనం చేసుకున్నారు; అక్కడ ఉన్న అమోరీయులను మోషే వెళ్లగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాని కుమార్తెలను.” పట్టణానికి చెందిన లేదా దానిపై ఆధారపడిన చిన్న నివాసాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: కథన సందర్భంలో שׁלח అనే క్రియకు సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: לְרַגֵּל
  choice: గూఢంగా పరిశీలించడానికి
  rationale: పీయేల్ రూపంలోని רגל ఇక్కడ ఒక ప్రాంతాన్ని సైనిక ఉద్దేశంతో రహస్యంగా పరిశీలించడాన్ని సూచిస్తుంది; ఈ తెలుగు పదబంధం గూఢచర్యం మరియు భూభాగ పరిశీలన అనే రెండు భావాలనూ అందిస్తుంది.
- source_word: יַעְזֵר
  choice: యాజేరు
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో స్పష్టంగా పలికే లిప్యంతరీకరణ.
- source_word: וַיִּלְכְּדוּ
  choice: వారు ... స్వాధీనం చేసుకున్నారు
  rationale: לכד సైనిక సందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ గ్రామాల విషయంగా ‘స్వాధీనం చేసుకున్నారు’ సహజం.
- source_word: בְּנֹתֶיהָ
  choice: దాని అనుబంధ గ్రామాలను
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలను’; అయితే హీబ్రూ భౌగోళిక వాడుకలో ప్రధాన పట్టణంపై ఆధారపడిన చిన్న నివాసాలను సూచిస్తుంది. ‘అనుబంధ గ్రామాలు’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיּוֹרֶשׁ
  choice: మోషే వెళ్లగొట్టాడు
  rationale: హిఫీల్ ఏకవచన క్రియ ఇక్కడ మునుపటి బహువచన కర్త నుంచి మోషే వైపు తిరుగుతుంది; ירש యొక్క ఈ రూపం అక్కడున్న ప్రజలను వారి స్థలం నుంచి తొలగించడం అనే భావాన్ని ఇస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: హీబ్రూలో జాతిని సూచించే సమూహవాచక ఏకవచనాన్ని తెలుగులో సహజంగా బహువచన జాతినామంగా ఇచ్చాం.
- source_word: אֲשֶׁר שָׁם
  choice: అక్కడ ఉన్న
  rationale: ఆ ప్రాంతంలో నివసిస్తున్న అమోరీయులను సూచించే సహజమైన తెలుగు సంబంధవాచక నిర్మాణం.
theological_decisions:
- issue: చివరి క్రియలో కర్త మార్పు
  choice: ‘మోషే వెళ్లగొట్టాడు’ అని ఏకవచన కర్తను స్పష్టపరచడం
  alternative: ‘వారు వెళ్లగొట్టారు’ అని ముందు ఉన్న బహువచన కర్తను కొనసాగించడం
  rationale: మసొరెటిక్ పాఠంలోని וַיּוֹרֶשׁ ఏకవచనం. అందువల్ల మూలంలోని వ్యాకరణ కర్త మార్పును నిలుపుతూ, తెలుగులో అపార్థం రాకుండా ‘మోషే’ను మళ్లీ పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సైనిక భావాన్ని అతిగా కఠినమైన పదజాలం లేకుండా నిలిపాం; చివరి క్రియలోని ఏకవచన కర్త మార్పును స్పష్టంగా సంరక్షించాం.
