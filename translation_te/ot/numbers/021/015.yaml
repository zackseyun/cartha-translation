translation:
  language: te
  text: అర్ ఉన్న స్థలం వరకు[b] విస్తరించి, మోయాబు సరిహద్దుకు ఆనుకొని ఉన్న వాగులోయల[a] ఏటవాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోయల’ లేదా ‘కనుమల.’ హెబ్రీ పదం נְחָלִים తరచుగా కాలానుగుణంగా నీరు ప్రవహించే వాగులను లేదా వాటి లోయలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అర్ నివాసస్థలం వరకు’ లేదా ‘అర్ ఆసనం వరకు.’ ఈ హెబ్రీ పదబంధం కష్టమైనది; ఇది అర్ ఉన్న ప్రదేశాన్ని లేదా అర్ అనే నివాసస్థలాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: వాలు
  rationale: ఈ నామవాచకం లోయ లేదా కనుమకు సంబంధించిన ఏటవాలు భూభాగాన్ని సూచిస్తుంది; సందర్భానికి సహజమైన తెలుగు పదం ‘వాలు’.
- source_word: הַנְּחָלִים
  choice: వాగులోయల
  rationale: נחל సాధారణంగా కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా దాని లోయను సూచిస్తుంది. ‘వాగులోయలు’ తెలుగు పాఠకులకు భౌగోళిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָטָה
  choice: విస్తరించి
  rationale: נטה అనే క్రియకు చాపడం, విస్తరించడం, వాలడం అనే భావాలున్నాయి; ఇక్కడ భౌగోళిక విస్తరణను ‘విస్తరించి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְשֶׁבֶת עָר
  choice: అర్ ఉన్న స్థలం వరకు
  rationale: కఠినమైన ఈ హెబ్రీ పదబంధం అర్ ఉన్న ప్రదేశాన్ని లేదా నివాసస్థానాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో భౌగోళిక సందర్భానికి సరిపోయే స్థానార్థాన్ని ఉంచాం.
- source_word: עָר
  choice: అర్
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: וְנִשְׁעַן
  choice: ఆనుకొని ఉన్న
  rationale: שען అక్షరార్థంగా ‘ఆనుకోవడం, ఆధారపడడం’ అని అర్థం. భౌగోళిక వర్ణనలోని రూపకాన్ని ‘ఆనుకొని ఉన్న’ నిలుపుతుంది.
- source_word: לִגְבוּל מוֹאָב
  choice: మోయాబు సరిహద్దును
  rationale: גבול ఇక్కడ సరిహద్దు లేదా హద్దును సూచిస్తుంది; ‘మోయాబు సరిహద్దు’ సూటిగా, సహజంగా ఉంది.
