base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: te
  text: అక్కడి నుంచి వారు బేయేరు[a]కు వెళ్లారు. యహ్వే మోషేతో, “ప్రజలను సమకూర్చు; నేను వారికి నీళ్లు ఇస్తాను[b]” అని చెప్పిన బావి ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బేయేరు’ అనేది ఈ స్థలం పేరు; హీబ్రూలో ఈ పేరు ‘బావి’ అనే పదాన్ని పోలి ఉంటుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “నేను వారికి నీళ్లు ఇచ్చేలా.” హీబ్రూ రూపం సంకల్పాన్ని లేదా ప్రయోజనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: అక్కడి నుంచి
  rationale: సంఘటనల ప్రయాణ క్రమాన్ని కొనసాగించే సహజమైన తెలుగు ప్రయోగం. హీబ్రూలోని సంధానార్థం సందర్భంలోనే స్పష్టమవుతుంది.
- source_word: בְּאֵרָה
  choice: వారు బేయేరుకు వెళ్లారు
  rationale: బְּאֵר అనే స్థలనామానికి ఉన్న దిశార్థక ప్రత్యయం ‘బేయేరు వైపుకు’ అనే భావాన్ని ఇస్తుంది. హీబ్రూలో క్రియ లేకపోయినా, తెలుగు ప్రయాణ వర్ణనలో అర్థాన్ని సహజంగా వ్యక్తం చేయడానికి ‘వెళ్లారు’ చేర్చబడింది.
- source_word: הִוא הַבְּאֵר
  choice: బావి ఇదే
  rationale: స్థలనామానికి ప్రాముఖ్యతనిచ్చే గుర్తింపు వాక్యాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: యహ్వే మోషేతో … అని చెప్పిన
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజంగా బావిని విశేషించే వాక్యఖండంగా మార్చింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱסֹף אֶת־הָעָם
  choice: ప్రజలను సమకూర్చు
  rationale: మోషే ప్రజలను ఒకచోట చేర్చాలనే ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: నేను వారికి నీళ్లు ఇస్తాను
  rationale: ఆజ్ఞ తరువాత వచ్చిన ప్రథమ పురుష సంకల్పార్థక రూపాన్ని దేవుని ఉద్దేశం లేదా హామీగా సహజంగా వ్యక్తం చేస్తుంది; దాని ప్రయోజనార్థక ఛాయను పాదటిప్పణిలో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠ భేదాన్ని కాపాడుతుంది.
- issue: וְאֶתְּנָה లోని సంకల్పార్థక/ప్రయోజనార్థక భావం
  choice: నేను వారికి నీళ్లు ఇస్తాను
  alternative: నేను వారికి నీళ్లు ఇచ్చేలా
  rationale: ఈ రూపం దేవుని సంకల్పం, తదనంతర ఫలితం, లేదా ప్రయోజనం అనే ఛాయలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సహజమైన హామీ రూపాన్ని వాడి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రయాణ సూచన, స్థలనామ పదక్రీడ, దైవ నామం, సంకల్పార్థక క్రియలోని అస్పష్టతలను కాపాడింది.
