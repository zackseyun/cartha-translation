revisions:
- from: అప్పుడు ఇశ్రాయేలు యెహోవాకు ఒక మొక్కుబడి చేసుకొని, “నీవు ఈ ప్రజలను నిజంగా నా చేతికి అప్పగిస్తే[a], వారి పట్టణాలను నాశనానికి ప్రతిష్ఠిస్తాను[b]” అని చెప్పాడు.
  to: 'అప్పుడు ఇశ్రాయేలు యెహోవాకు మొక్కుబడి చేసి ఇలా అన్నాడు: “నీవు ఈ ప్రజలను నిజంగా నా చేతికి అప్పగిస్తే[a], వారి పట్టణాలను సంపూర్ణ నాశనానికి అంకితం చేస్తాను[b].”'
  rationale: The revision changes only the rendering of the ḥerem action and its supporting note, making the Telugu idiomatic and semantically precise while preserving the source text's formal vow and its grave destruction terminology. Punctuation has also been normalized for direct speech.
