source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు యెహోవాకు మొక్కుబడి చేసి ఇలా అన్నాడు: “నీవు ఈ ప్రజలను నిజంగా నా చేతికి అప్పగిస్తే[a], వారి పట్టణాలను సంపూర్ణ నాశనానికి అంకితం చేస్తాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇస్తూ ఇస్తే.” హీబ్రూలో ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో క్రియను బలపరిచారు; “నిశ్చయంగా అప్పగిస్తే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి పట్టణాలను నాశనానికి అప్పగిస్తాను” లేదా “వారి పట్టణాలపై హేరెమ్ విధిస్తాను.” ఇక్కడి హీబ్రూ పదం జయించిన దానిని తిరుగులేని విధంగా నాశనానికి అంకితం చేసే హేరెమ్ చర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: ఒక మొక్కుబడి చేసుకొని
  rationale: ఒకే మూలానికి చెందిన క్రియ-నామవాచక సమాసాన్ని సహజమైన ఆధునిక తెలుగులో గంభీరమైన ప్రమాణాన్ని సూచించే ‘మొక్కుబడి చేసుకొను’గా అనువదించాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామం יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אִם נָתֹן תִּתֵּן
  choice: నీవు ... నిజంగా ... అప్పగిస్తే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో బలపరచబడిన క్రియలోని నిశ్చయార్థక ఉద్ఘాటనను ‘నిజంగా’ ద్వారా సహజంగా తెలిపాం.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: సామూహిక ఏకవచనమైన עָםను తెలుగు సందర్భానికి సహజంగా ‘ప్రజలు’ అనే గౌరవ బహువచన రూపంలో ఉంచాం.
- source_word: בְּיָדִי
  choice: నా చేతికి
  rationale: అధీనంలోకి అప్పగించడాన్ని తెలిపే హీబ్రూ ‘చేతి’ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలిపాం.
- source_word: וְהַחֲרַמְתִּי
  choice: నాశనానికి ప్రతిష్ఠిస్తాను
  rationale: חרםలోని కేవలం ధ్వంసం చేయడం కంటే విస్తృతమైన, తిరుగులేని విధంగా నాశనానికి అంకితం చేసే ఆచార-యుద్ధ భావాన్ని నిలిపాం.
- source_word: עָרֵיהֶם
  choice: వారి పట్టణాలను
  rationale: עִירకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘పట్టణం’; బహువచనాన్ని యథాతథంగా ఉంచాం.
theological_decisions:
- issue: యుద్ధ మొక్కుబడిలో חרם పదప్రయోగం
  choice: వారి పట్టణాలను నాశనానికి ప్రతిష్ఠిస్తాను
  alternative: వారి పట్టణాలను పూర్తిగా నాశనం చేస్తాను; వారి పట్టణాలపై నిషేధం విధిస్తాను
  rationale: ఈ పదం సాధారణ సైనిక విధ్వంసాన్ని మాత్రమే కాక, జయించిన దానిని తిరుగులేని విధంగా నాశనానికి అంకితం చేసే ఆచారపరమైన చర్యను కూడా సూచిస్తుంది. ‘నాశనానికి ప్రతిష్ఠిస్తాను’ ఆ గంభీరతను నిలుపుతూ తరువాతి సిద్ధాంత వివరణలను పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘మొక్కుబడి,’ ‘నా చేతికి,’ ‘నాశనానికి ప్రతిష్ఠిస్తాను’ అనే పదబంధాలు మూలంలోని ప్రమాణం, రూపకం, חרם భావాలను సాధ్యమైనంత స్పష్టంగా నిలుపుతాయి.
