source:
  edition: WLC
  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: te
  text: 'అధిపతులు తవ్విన బావి[a],

    ప్రజల ప్రముఖులు పాలకుని దండంతో,

    తమ చేతికర్రలతో తవ్వి తీసిన బావి.

    అరణ్యం నుండి వారు మత్తానాకు వెళ్లారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పాలకుని దండంతో” అని అనువదించిన హీబ్రూ పదానికి “శాసనకర్తతో” అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ మూలంలో పదశః, “అరణ్యం నుండి మత్తానా”; సందర్భంలోని ప్రయాణస్థలాల వరుసను బట్టి “మత్తానాకు వెళ్లారు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: బావి
  rationale: ముందరి వచనంలో పాడిన నిర్దిష్ట బావినే సూచిస్తుంది; తెలుగులో పునరుక్తి కవితా పాదాల అనుసంధానాన్ని స్పష్టం చేస్తుంది.
- source_word: חֲפָרוּהָ
  choice: తవ్విన
  rationale: חפר యొక్క సాధారణ అర్థం ‘తవ్వడం’; స్త్రీలింగ ప్రత్యయం బావిని సూచిస్తుంది.
- source_word: שָׂרִים
  choice: అధిపతులు
  rationale: ఉన్నత స్థాయి నాయకులను సూచించే గౌరవభరిత పదం; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כָּרוּהָ
  choice: తవ్వి ఏర్పరచిన
  rationale: כרה అనే రెండవ తవ్వే క్రియను సూచిస్తూ, మొదటి క్రియతో ఉన్న సమాంతరతను నిలుపుతుంది; బావిని తవ్వి సిద్ధం చేయడం అనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: נְדִיבֵי הָעָם
  choice: ప్రజలలోని ఘనులు
  rationale: שָׂרִיםతో సమాంతరంగా సామాజికంగా గౌరవనీయులైన లేదా ఉన్నత స్థాయి వ్యక్తులను సూచిస్తుంది.
- source_word: בִּמְחֹקֵק
  choice: పాలకుని దండంతో
  rationale: מְחֹקֵק పాలకుడు, శాసనకర్త, లేదా పాలనా దండాన్ని సూచించగలదు. తరువాతి ‘తమ చేతికర్రలతో’ అనే సమాంతర పదబంధం కారణంగా సాధనార్థక భావం ప్రధాన పాఠ్యంలో ఎంచుకోబడింది.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: తమ చేతికర్రలతో
  rationale: ఆనుకోవడానికి లేదా పట్టుకోవడానికి ఉపయోగించే కర్రలను సూచిస్తుంది; ‘దండం’తో పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: తర్వాత వారు అరణ్యం నుండి మత్తానాకు వెళ్లారు
  rationale: హీబ్రూలో క్రియ, గమ్యార్థక విభక్తి స్పష్టంగా లేకపోయినా, 18–20 వచనాల ప్రయాణస్థలాల వరుసలో ఇది అరణ్యం నుండి మత్తానాకు ప్రయాణాన్ని సూచిస్తుంది.
theological_decisions:
- issue: בִּמְחֹקֵק అనే బహుఅర్థ పదం
  choice: సాధనార్థకంగా ‘పాలకుని దండంతో’
  alternative: వ్యక్తిని సూచిస్తూ ‘శాసనకర్తతో/శాసనకర్త చేత’
  rationale: ‘తమ చేతికర్రలతో’ అనే సమాంతర పదబంధం ఒక సాధనాన్ని సూచించే అర్థానికి బలం ఇస్తుంది. అయినప్పటికీ మూలంలోని వ్యక్తి/సాధనం అనే సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- issue: וּמִמִּדְבָּר מַתָּנָה యొక్క సంక్షిప్త నిర్మాణం
  choice: ప్రయాణ దశగా ‘అరణ్యం నుండి మత్తానాకు వెళ్లారు’
  alternative: పదశః ‘అరణ్యం నుండి—మత్తానా’
  rationale: తదుపరి వచనాలతో కలిసి ఇది ప్రయాణ దశల వరుసగా పనిచేస్తుంది; చేర్చిన క్రియను మరియు గమ్యార్థాన్ని పాదటిప్పణి వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితా ధోరణి పాటించబడింది. మొదటి మూడు పాదాల్లో సమాంతర నిర్మాణాన్ని నిలిపి, చివరి వాక్యాన్ని ప్రయాణవివరణగా సహజంగా మలిచాం. ‘అధిపతులు’, ‘ఘనులు’, ‘పాలకుని దండం’ వంటి పదాలు సామాజిక-పాలనా భావాన్ని కాపాడుతాయి; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చలేదు.
