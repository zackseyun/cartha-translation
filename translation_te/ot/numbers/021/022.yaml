translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుకు పంపిన దౌత్యపరమైన అభ్యర్థనకు తగిన సరళమైన గౌరవభావంతో అనువదించబడింది. మొదటి వాక్యంలోని ఏకవచనం, తరువాతి వాక్యాల్లోని బహువచనం మూలపాఠం ప్రకారం నిలుపబడ్డాయి. అడుగుచిహ్నం సంబంధిత ‘రాజమార్గం’ పదం వద్ద ఉంచబడింది.
