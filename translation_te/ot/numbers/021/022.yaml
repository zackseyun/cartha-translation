source:
  edition: WLC
  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: te
  text: “నీ దేశం గుండా నన్ను వెళ్లనివ్వు. పొలంలోకిగానీ ద్రాక్షతోటలోకిగానీ మేము పక్కకు మళ్లము; ఏ బావి నీళ్లూ తాగము. నీ సరిహద్దు దాటి వెళ్లే వరకు రాజమార్గం[a] వెంటే వెళ్తాము.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు రహదారి.”
    reason: בְּדֶרֶךְ הַמֶּלֶךְ అనే పదబంధానికి మరింత అక్షరార్థమైన అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: నన్ను వెళ్లనివ్వు
  rationale: మొదటి పురుష ఏకవచన cohortative ఇక్కడ రాజుకు చేస్తున్న వినయపూర్వక అభ్యర్థనను సూచిస్తుంది; తరువాతి బహువచన వాక్యాలతో ఉన్న వ్యాకరణ భేదాన్ని అలాగే ఉంచుతుంది.
- source_word: בְאַרְצְךָ
  choice: నీ దేశం గుండా
  rationale: אֶרֶץ ఇక్కడ రాజు అధీనంలోని భూభాగాన్ని సూచిస్తుంది; ‘దేశం గుండా’ ఆధునిక తెలుగులో ప్రయాణ సందర్భానికి సహజంగా ఉంటుంది.
- source_word: לֹא נִטֶּה
  choice: మేము పక్కకు మళ్లము
  rationale: נטה ప్రయాణ మార్గం నుంచి పక్కకు తిరగడాన్ని సూచిస్తుంది; ‘పక్కకు మళ్లము’ ఆ చలన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: పొలంలోకిగానీ ద్రాక్షతోటలోకిగానీ
  rationale: ఏ పొలంలోకీ లేదా ద్రాక్షతోటలోకీ ప్రవేశించబోమనే విభజనాత్మక, సాధారణ భావాన్ని తెలుగు ‘గానీ…గానీ’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: ఏ బావి నీళ్లూ తాగము
  rationale: అక్షరార్థంగా ‘బావి నీళ్లు’; స్థానిక జలవనరులను వినియోగించబోమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: రాజమార్గం వెంటే
  rationale: అక్షరార్థంగా ‘రాజు మార్గం’; ప్రధాన ప్రజా రహదారిని సూచించే సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం ‘రాజమార్గం’. ‘వెంటే’ ఆ మార్గం నుంచి తొలగకుండా ప్రయాణించే భావాన్ని ఇస్తుంది.
- source_word: נֵלֵךְ
  choice: వెళ్తాము
  rationale: הלך అనే సాధారణ ప్రయాణ క్రియకు సరళమైన, సహజమైన సమానం.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבֻלֶךָ
  choice: నీ సరిహద్దు దాటి వెళ్లే వరకు
  rationale: ప్రయాణం పూర్తయ్యే హద్దును సూచిస్తుంది. גְּבוּל యొక్క ‘సరిహద్దు/భూహద్దు’ అనే స్పష్టమైన ప్రాదేశిక భావాన్ని నిలుపుతుంది.
