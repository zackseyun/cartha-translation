base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: te
  text: 'ప్రజలు దేవునికీ మోషేకూ విరోధంగా ఇలా అన్నారు: “అరణ్యంలో చనిపోవడానికి మమ్మల్ని ఐగుప్తు నుండి ఎందుకు తీసుకొచ్చారు? ఎందుకంటే రొట్టె లేదు, నీళ్లు లేవు; ఈ నికృష్టమైన[a] రొట్టె మాకు అసహ్యం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నికృష్టమైన” అనే పదానికి “తృణీకరించదగినది” లేదా “పనికిరానిది” అని కూడా అర్థం కావచ్చు. ఇక్కడి హీబ్రూ విశేషణం అరుదైనది; దేవుడు సమకూర్చిన రొట్టె పట్ల ప్రజల తృణీకారాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: ప్రజలు దేవునికి, మోషేకు విరోధంగా మాట్లాడుతూ
  rationale: דבר ב అనే నిర్మాణం సందర్భానుసారం ప్రతికూలంగా మాట్లాడడాన్ని సూచిస్తుంది; వెంట వచ్చే నిందాపూర్వక మాటలు ఆ భావాన్ని నిర్ధారిస్తున్నాయి. ‘విరోధంగా’ అనేది శత్రుత్వ స్వరాన్ని చూపుతూ, ‘దూషించారు’ వంటి అధిక బలమైన పదాన్ని నివారిస్తుంది.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: మమ్మల్ని ఐగుప్తు నుండి ఎందుకు తీసుకొచ్చారు?
  rationale: עלה హిఫీల్ రూపానికి ‘పైకి తీసుకురావడం’ మూలభావమైనప్పటికీ, ఆధునిక తెలుగులో ఇక్కడ ‘తీసుకొచ్చారు’ సహజంగా ఉండి నిర్గమన దిశను నిలుపుతుంది.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: ఈ అరణ్యంలో చనిపోవడానికి
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే సూచించదు; ‘అరణ్యం’ విస్తృతమైన జనావాసరహిత ప్రాంత భావాన్ని, బైబిలు వాడుకను నిలుపుతుంది. సమీప సందర్భాన్ని తెలుగులో సహజంగా చూపడానికి ‘ఈ’ చేర్చబడింది.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: ఇక్కడ ఆహారమూ లేదు, నీళ్లూ లేవు
  rationale: לֶחֶם పదానికి ‘రొట్టె’ అనే నిర్దిష్ట అర్థంతో పాటు ‘ఆహారం’ అనే విస్తృత అర్థమూ ఉంది. అరణ్య సందర్భంలో ప్రజలు సాధారణ ఆహారలేమిని ఆరోపిస్తున్నందున ‘ఆహారం’ సహజమైన ఎంపిక; אֵין యొక్క పునరుక్తి ‘లేదు… లేవు’ ద్వారా నిలిచింది.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: మాకు అసహ్యం
  rationale: అక్షరార్థంగా ‘మా ప్రాణం/మనసు విసిగిపోయింది’ అనే నిర్మాణం. తెలుగులో ‘మాకు అసహ్యం’ తీవ్రమైన విరక్తిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: ఈ నీచమైన ఆహారం
  rationale: అరుదైన קְלֹקֵל పదం తృణీకారం, హీనత లేదా పనికిరానితనాన్ని వ్యక్తం చేస్తుంది. ‘నీచమైన’ ప్రజల అవహేళనను నిలుపుతుంది; ‘ఈ’ హీబ్రూలో ప్రత్యక్షంగా లేకపోయినా వారి ముందున్న సరఫరాను సూచించే సహజ తెలుగు ప్రయోగం.
theological_decisions:
- issue: దేవుని పట్ల ప్రజల మాటల స్వభావం
  choice: ‘దేవునికి, మోషేకు విరోధంగా’ అని ప్రతికూల ప్రసంగంగా అనువదించడం
  alternative: ‘దేవునితో, మోషేతో మాట్లాడారు’ లేదా ‘దేవుని గురించి, మోషే గురించి మాట్లాడారు’
  rationale: తర్వాతి ప్రశ్న నిందాపూర్వకంగా, తిరుగుబాటు స్వరంతో ఉంది. అందువల్ల తటస్థ అనువాదం సందర్భంలోని ప్రతిఘటనను తగ్గిస్తుంది; అయితే ‘దూషించారు’ అని మరింత తీవ్రమైన ధార్మిక అర్థాన్ని చేర్చలేదు.
- issue: לֶחֶם యొక్క పునరుక్తి మరియు మన్నా సూచన
  choice: రెండు చోట్లా ‘ఆహారం’ అని అనువదించి, చివరి పదబంధంలోని తృణీకారాన్ని పాదసూచికలో వివరించడం
  alternative: రెండు చోట్లా ‘రొట్టె’ అని పెట్టి పదపునరుక్తిని ప్రత్యక్షంగా నిలపడం
  rationale: తెలుగు పాఠకునికి ‘రొట్టె లేదు’ అని చెప్పిన వెంటనే ఉన్న దైవిక సరఫరాను ‘రొట్టె’ అని పిలవడం అనవసర విరోధాభాసంగా అనిపించవచ్చు. హీబ్రూ לֶחֶם సాధారణ ఆహారాన్ని కూడా సూచిస్తుంది. అయినా ప్రజలు దేవుడు ఇచ్చిన ఆహారాన్నే తృణీకరించిన ఉద్రిక్తతను వాక్యం, పాదసూచిక నిలుపుతున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘ఐగుప్తు’, ‘అరణ్యం’ వంటి సుపరిచిత బైబిలు పదాలను నిలిపి, అసహజమైన అక్షరానువాదాలను నివారించాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తర్వాత ఉంచబడింది.
