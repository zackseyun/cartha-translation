  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలు అమోరీయుల దేశంలో నివసించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశః: “ఇశ్రాయేలు అమోరీయుల దేశంలో నివాసముండింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించింది
  rationale: ישׁב అనే క్రియకు ‘కూర్చోవడం, నివసించడం, స్థిరపడడం’ అనే అర్థాలు ఉన్నాయి. ఈ కథన సారాంశంలో ‘నివసించింది’ సహజమైన ఆధునిక తెలుగు; వారు ఆ దేశంలో ఉండసాగారనే భావాన్ని తెలియజేస్తుంది, అయితే శాశ్వతంగా స్థిరపడ్డారనే అదనపు భావాన్ని బలవంతంగా చేర్చదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఒడంబడిక ప్రజలను సూచించే పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ. సమూహాన్ని ఏకవచన నామంగా పరిగణించి క్రియను ‘నివసించింది’ అని ఇచ్చాం.
- source_word: בְּאֶרֶץ
  choice: దేశంలో
  rationale: אֶרֶץ ఇక్కడ ఒక నిర్దిష్ట ప్రజల అధీన ప్రాంతాన్ని సూచిస్తుంది. ‘దేశం’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి ‘land/territory’ భావాన్ని అందిస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయుల
  rationale: హీబ్రూలో రూపం ఏకవచన జాతివాచకమైనా, సందర్భంలో అది అమోరీ ప్రజలను సమష్టిగా, వారి దేశాన్ని సూచిస్తుంది. అందువల్ల తెలుగులో సహజమైన సమూహ బహువచన సంబంధరూపం ‘అమోరీయుల’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. వాక్యారంభంలోని וַ־ను ముందరి సంఘటనకు ఫలితాత్మక అనుసంధానంగా ‘అలా’ అని అనువదించాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
