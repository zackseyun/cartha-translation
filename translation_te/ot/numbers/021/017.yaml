  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֚ז יָשִׁ֣יר יִשְׂרָאֵ֔ל אֶת הַ/שִּׁירָ֖ה הַ/זֹּ֑את עֲלִ֥י בְאֵ֖ר עֱנוּ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు ఈ పాట పాడింది:


    “ఓ బావీ, పైకి పొంగు![a]


    దానికి ప్రతిస్పందించండి!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఓ బావీ, పైకి రా!” ఈ మాటలు పిలుపు–ప్రతిస్పందన పద్ధతిలో పాడే గీతాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కథన క్రమంలో తదుపరి చర్యను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కాలసూచకం.
- source_word: יָשִׁיר
  choice: పాడింది
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, אָז తో కలిసి ఇక్కడ గత కథనార్థం కలిగివుంది. సమూహంగా భావించిన ‘ఇశ్రాయేలు’కు తెలుగు ఏకవచన క్రియ సహజం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజాసమూహపు ప్రామాణిక తెలుగు నామరూపం.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ఈ పాట
  rationale: తరువాత వచ్చే కవితాత్మక గీతాన్ని నేరుగా సూచిస్తుంది.
- source_word: עֲלִי
  choice: పైకి పొంగు
  rationale: బావిని ఉద్దేశించిన స్త్రీలింగ ఏకవచన ఆజ్ఞ. ‘పైకి రా’ అనే మూలచిత్రాన్ని కాపాడుతూ, నీరు పైకి రావడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְאֵר
  choice: బావీ
  rationale: ప్రత్యక్ష సంబోధనను తెలుగు సంబోధన రూపంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֱנוּ לָהּ
  choice: దానికి ప్రతిస్పందనగా పాడండి
  rationale: ענה యొక్క ప్రాథమిక ‘జవాబివ్వండి/ప్రతిస్పందించండి’ భావాన్నీ, పాట సందర్భంలోని ప్రతిగాన సూచననూ కలిపి చూపుతుంది; అస్పష్టతను పూర్తిగా తొలగించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే పదప్రయోగం. సంబోధనను ‘బావీ’తో, ప్రతిగాన భావాన్ని ‘ప్రతిస్పందనగా పాడండి’తో వ్యక్తం చేశాం.
