  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: te
  text: అయితే సీహోను ఇశ్రాయేలును తన భూభాగం గుండా వెళ్లనివ్వలేదు.[a] కాబట్టి సీహోను తన ప్రజలందరినీ[b] సమకూర్చుకొని, ఇశ్రాయేలును కలుసుకోవడానికి ఎడారిలోకి బయలుదేరాడు. అతడు యాహసుకు[c] వచ్చి ఇశ్రాయేలుపై యుద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సరిహద్దు గుండా వెళ్లనివ్వలేదు.” ఇక్కడి హీబ్రూ పదం ‘సరిహద్దు’ను గానీ, ఆ సరిహద్దులలోని ‘భూభాగం’ను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “తన ప్రజలందరినీ” అని ఉంది; యుద్ధ సందర్భం సాయుధ బలగాన్ని సూచించినప్పటికీ, మూలపాఠం ‘సైన్యం’ అని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: c
    text: ఈ స్థలనామాన్ని “యాహజు” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא נָתַן
  choice: అయితే ... వెళ్లనివ్వలేదు
  rationale: ముందటి వచనంలోని ప్రయాణ అనుమతి అభ్యర్థనకు వ్యతిరేక ఫలితాన్ని ‘అయితే’ తెలియజేస్తుంది; נָתַן + infinitive ఇక్కడ అనుమతించడం అనే సహజార్థాన్ని ఇస్తుంది.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: తన భూభాగం గుండా వెళ్ల
  rationale: עֲבֹר ఇక్కడ ఒక ప్రాంతం గుండా ప్రయాణించడాన్ని సూచిస్తుంది. גְּבוּל సరిహద్దు లేదా ఆ సరిహద్దులలోని భూభాగం అనే రెండు అర్థాలు కలిగి ఉండగలదు; సందర్భంలో ‘భూభాగం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: తన ప్రజలందరినీ సమకూర్చుకొని
  rationale: మూలపాఠం ‘అతని ప్రజలందరినీ’ అంటుంది; యుద్ధ సందర్భం ఉన్నప్పటికీ ‘సైన్యం’ అని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని విస్తృత పదాన్నే నిలిపాం.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును ఎదుర్కొనేందుకు
  rationale: ఈ పదబంధం ఇశ్రాయేలును కలుసుకోవడానికి లేదా ఎదుర్కోవడానికి వెళ్లడాన్ని సూచిస్తుంది. వెంటనే వచ్చే యుద్ధ సందర్భంలో ‘ఎదుర్కొనేందుకు’ సహజంగా ఉన్నా, చివరి క్రియలోని యుద్ధ భావాన్ని ముందుగానే అతిగా విస్తరించదు.
- source_word: הַמִּדְבָּרָה
  choice: ఎడారిలోకి
  rationale: చివరి దిశాసూచక రూపం ఎడారి వైపు లేదా ఎడారిలోకి కదలికను సూచిస్తుంది; తెలుగులో ‘ఎడారిలోకి’ ఆ గమనాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָהְצָה
  choice: యాహసుకు
  rationale: ఇది స్థలనామం; దిశాసూచక రూపాన్ని తెలుగులో ‘-కు’తో చూపించాం. ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా ‘యాహసు’ రూపాన్ని వాడాం.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేశాడు
  rationale: לחם క్రియకు בְ తో కూడిన ఈ నిర్మాణం శత్రుత్వపూర్వక యుద్ధాన్ని సూచిస్తుంది. ‘యుద్ధం చేశాడు’ తెలుగులో స్పష్టమైన, సహజమైన వ్యక్తీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యథాశక్తి నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు క్రియావిశేషణ మరియు గమనసూచక నిర్మాణాలను సర్దుబాటు చేశాం.
