source:
  edition: WLC
  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: te
  text: ఇశ్రాయేలు ఈ పట్టణాలన్నిటినీ స్వాధీనం చేసుకుంది; ఇశ్రాయేలు అమోరీయుల పట్టణాలన్నిటిలో, హెష్బోనులోను దానికి చెందిన చిన్న అనుబంధ పట్టణాలన్నిటిలోను నివసించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాని కుమార్తెలన్నిటిలో.” ఇది ఒక ప్రధాన పట్టణానికి చెందిన చిన్న అనుబంధ పట్టణాలను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: స్వాధీనం చేసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉన్నా, ఇక్కడ యుద్ధ సందర్భంలో పట్టణాలను జయించి ఆధీనంలోకి తెచ్చుకోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలన్నిటినీ
  rationale: עיר అనేది పట్టణం లేదా నగరాన్ని సూచించగలదు; సందర్భానికి సరిపోయే సాధారణ తెలుగు పదంగా ‘పట్టణాలు’ ఎంచుకొని, הָאֵלֶּה లోని సూచనార్థాన్ని ‘ఈ’తో నిలిపాం.
- source_word: וַיֵּשֶׁב
  choice: నివసించింది
  rationale: ישב ఇక్కడ జయించిన ప్రాంతాల్లో స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ‘నివసించింది’ మూలార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: అమోరీయుల పట్టణాలన్నిటిలో
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, అమోరీయులకు చెందిన పట్టణాలు అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּחֶשְׁבּוֹן
  choice: హెష్బోనులో
  rationale: హెబ్రీ వ్యక్తినామం חֶשְׁבּוֹן ను తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: దాని పరిధిలోని చిన్న పట్టణాలన్నిటిలో
  rationale: ‘దాని కుమార్తెలు’ అనే హెబ్రీ నుడికారం ప్రధాన పట్టణానికి అనుబంధంగా ఉన్న చిన్న నివాస ప్రాంతాలను సూచిస్తుంది. అర్థం సాధారణ పాఠకులకు వెంటనే గ్రాహ్యమయ్యేలా అనువదించి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
