translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వచనం. హెబ్రీ వాక్యంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, ‘కుమార్తెలు’ అనే అస్పష్ట నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థస్పష్టంగా ఇచ్చి పాదసూచికలో అక్షరార్థాన్ని భద్రపరిచాం.
