- from: ఇశ్రాయేలు ఈ పట్టణాలన్నిటినీ స్వాధీనం చేసుకొని, అమోరీయుల పట్టణాలన్నిటిలో—హెష్బోనులో, దాని పరిధిలోని చిన్న పట్టణాలన్నిటిలో—నివసించింది.[a]
  to: ఇశ్రాయేలు ఈ పట్టణాలన్నిటినీ స్వాధీనం చేసుకుంది; ఇశ్రాయేలు అమోరీయుల పట్టణాలన్నిటిలో, హెష్బోనులోను దానికి చెందిన చిన్న అనుబంధ పట్టణాలన్నిటిలోను నివసించింది.[a]
  rationale: సవరణ హెబ్రీలోని రెండు సమన్వయ క్రియలను, అలాగే “ఇశ్రాయేలు” అనే పునరుక్త విషయాన్ని నిలిపింది. “దాని” అనేది హెష్బోనును సూచిస్తుందని సందర్భం స్పష్టం చేస్తుంది; అనుబంధ పట్టణాల నుడికారానికి సంబంధించిన అక్షరార్థం పాదసూచికలో భద్రపరచబడింది.
