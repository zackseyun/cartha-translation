translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి ఉపయోగించబడింది. హెబ్రీయ వాక్యంలోని వివరణాత్మక సంబంధం, కాలక్రమం, ‘చేతి’ అనే అధికారం-రూపకం కాపాడబడ్డాయి.
