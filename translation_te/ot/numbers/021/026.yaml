source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: te
  text: ఎందుకంటే హెష్బోను అమోరీయుల రాజైన సీహోనుకు చెందిన నగరం. అతడు మోయాబు మునుపటి రాజుతో యుద్ధం చేసి, అర్నోను వరకు ఆ రాజు దేశమంతటినీ ఆ రాజు చేతిలోనుండి[a] స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ రాజు అధికారం నుండి’; హెబ్రీయ నుడికారం అక్షరార్థంగా ‘ఆ రాజు చేతిలోనుండి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִיר
  choice: నగరం
  rationale: హెష్బోను రాజకేంద్రంగా ఉన్న ప్రాముఖ్యతకు సరిపోయే సాధారణ పదం.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజు
  rationale: హెబ్రీలో ఏకవచన జాతినామం సమూహాన్ని సూచిస్తుంది; తెలుగులో సహజంగా బహువచన జాతినామంతో అనువదించబడింది.
- source_word: נִלְחַם
  choice: యుద్ధం చేసి
  rationale: ఎదుటివానితో యుద్ధంలో తలపడటాన్ని తెలియజేస్తూ, తరువాతి స్వాధీన చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: הָרִאשׁוֹן
  choice: మునుపటి
  rationale: ఇక్కడ ‘మొదటి’ అనే క్రమసంఖ్యకన్నా ముందున్న లేదా పూర్వపు రాజును సూచించే భావమే సందర్భానికి తగినది.
- source_word: כָּל אַרְצוֹ
  choice: అతని దేశమంతటినీ
  rationale: ప్రత్యయం మోయాబు రాజుకు చెందిన భూభాగాన్ని సూచిస్తుంది; మూలంలోని సర్వసమగ్ర భావాన్ని కాపాడుతుంది.
- source_word: מִיָּדוֹ
  choice: అతని చేతిలోనుండి
  rationale: అధికారం లేదా అదుపు నుండి లాక్కోవడాన్ని తెలిపే హెబ్రీయ రూపకాన్ని తెలుగులోనూ గ్రాహ్యంగా నిలుపుతుంది.
- source_word: עַד אַרְנֹן
  choice: అర్నోను వరకు
  rationale: స్వాధీనం చేసుకున్న భూభాగపు సరిహద్దును నేరుగా తెలియజేస్తుంది.
