- from: ఎందుకంటే హెష్బోను అమోరీయుల రాజైన సీహోను నగరం. అతడు మోయాబు మునుపటి రాజుతో యుద్ధం చేసి, అర్నోను వరకు అతని దేశమంతటినీ అతని చేతిలోనుండి[a] స్వాధీనం చేసుకున్నాడు.
  to: ఎందుకంటే హెష్బోను అమోరీయుల రాజైన సీహోనుకు చెందిన నగరం. అతడు మోయాబు మునుపటి రాజుతో యుద్ధం చేసి, అర్నోను వరకు ఆ రాజు దేశమంతటినీ ఆ రాజు చేతిలోనుండి[a] స్వాధీనం చేసుకున్నాడు.
