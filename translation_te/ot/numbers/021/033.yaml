  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘బాషాను,’ ‘ఓగు,’ ‘ఎద్రెయి’ అనే రూపాలు తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా ఉన్నాయి.
