  to: తరువాత వారు దిశ మార్చుకొని బాషాను మార్గంలో పైకి వెళ్లారు. అప్పుడు బాషాను రాజైన ఓగు, తన ప్రజలందరితో కలిసి, ఎద్రెయిలో యుద్ధం చేయడానికి వారిని కలవడానికి బయలుదేరాడు.[a]
