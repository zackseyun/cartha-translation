base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: te
  text: తరువాత వారు దిశ మార్చుకొని బాషాను మార్గంలో పైకి వెళ్లారు. అప్పుడు బాషాను రాజైన ఓగు, తన ప్రజలందరితో కలిసి, ఎద్రెయిలో యుద్ధం చేయడానికి వారిని కలవడానికి బయలుదేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిని ఎదుర్కొనడానికి’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదబంధం స్వతహాగా తటస్థంగా ఉండవచ్చు; అయితే ఇక్కడ ‘యుద్ధం చేయడానికి’ అనే మాట శత్రుత్వపూర్వక సందర్భాన్ని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: దిశ మార్చుకొని
  rationale: פנה ఇక్కడ ప్రయాణ దిశ మారడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దిశ మార్చుకొని’ సందర్భాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లారు
  rationale: עלה యొక్క దిశాత్మక లేదా భౌగోళిక భావాన్ని కాపాడుతూ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: బాషాను దారిలో
  rationale: דרך తో కూడిన ప్రాంతనామం ఆ ప్రాంతానికి సంబంధించిన మార్గాన్ని సూచిస్తుంది; ఈ రూపం హెబ్రీ నిర్మాణానికి సమీపంగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగు
  rationale: వ్యక్తి, ప్రాంత నామాలను తెలుగు లిప్యంతరీకరణలో ఉంచి, రాజు అనే బిరుదును సహజమైన విశేషణ నిర్మాణంలో ఇచ్చాం.
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצא అంటే బయటికి వెళ్లడం లేదా బయలుదేరడం. సైనిక సందర్భాన్ని అనవసరంగా విస్తరించకుండా ‘బయలుదేరాడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִקְרָאתָם
  choice: వారిని ఎదుర్కొనేందుకు
  rationale: ఈ పదబంధం స్వతహాగా ‘వారిని కలుసుకోవడానికి’ అనే తటస్థ భావాన్ని కూడా కలిగి ఉండవచ్చు; అయితే వెంటనే వచ్చే ‘యుద్ధం చేయడానికి’ అనే మాట ఇక్కడ శత్రుత్వపూర్వక ఎదుర్కొనడాన్ని స్పష్టం చేస్తుంది.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: తన ప్రజలందరితో కలిసి
  rationale: עַם అక్షరార్థంగా ‘ప్రజలు’; సైనిక సందర్భం ఉన్నప్పటికీ ‘సైన్యం’ అని పాఠంలో లేని నిర్దిష్టతను చేర్చలేదు.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: లక్ష్యం లేదా ఉద్దేశాన్ని తెలిపే ఈ పదబంధాన్ని ఆధునిక తెలుగులో సహజమైన క్రియారూపంతో ఇచ్చాం.
- source_word: אֶדְרֶעִי
  choice: ఎద్రెయిలో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, యుద్ధం జరిగిన ప్రదేశాన్ని సూచించే సందర్భానుసార స్థానవిభక్తిని ఉపయోగించాం.
