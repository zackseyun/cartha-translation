source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు అమోరీయుల రాజైన సీహోనుకు ఇలా చెప్పమని దూతలను పంపాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘పంపి’ తరువాతి לֵאמֹרతో అనుసంధానమవుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఇక్కడ వ్యక్తి పేరుకన్నా ప్రజాసమూహాన్ని సూచించే సమూహవాచక నామం. తెలుగులో ప్రామాణిక బైబిలు రూపాన్ని ఉపయోగించాం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: రాజదౌత్య సందర్భంలో ఇది మానవ సందేశవాహకులను సూచిస్తుంది; పరలోక దూతలను కాదు. ‘దూతలు’ సహజమైన, విస్తృతార్థక తెలుగు పదం.
- source_word: אֶל סִיחֹן
  choice: సీహోనుకు
  rationale: దిశను/గ్రహీతను సూచించే אֶל తెలుగులో చతుర్థీ విభక్తి ‘-కు’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజైన
  rationale: హీబ్రూ నిర్మాణం సీహోను అమోరీ ప్రజల రాజని సూచిస్తుంది. తెలుగులో ‘అమోరీయుల రాజైన’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పాడు
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజ కథన శైలిలో అందించాం. ఏకవచన క్రియ సమూహవాచకమైన ‘ఇశ్రాయేలు’తో సరిపోతుంది.
