translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలితో అనువదించబడింది. మూలంలోని కథన క్రమం మరియు సమూహవాచక ఏకవచనం నిలుపబడ్డాయి.
