source:
  edition: WLC
  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: te
  text: మేము వారిపై బాణాలు వేశాము[a]; హెష్బోను దీబోను వరకూ నశించింది; మేము నోఫహు వరకూ పాడుచేశాము[b], అది మేదెబా వరకూ విస్తరించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ప్రారంభ పదబంధంలోని హీబ్రూ పాఠం క్లిష్టమైనది. దీనిని “మేము వారిని కూలదోశాము” లేదా “వారి ఆధిపత్యం నశించింది” అని కూడా అర్థం చేసుకున్నారు.
    reason: textual_variant
  - marker: b
    text: “మేము పాడుచేశాము” అని అనువదించిన రూపం కూడా అనిశ్చితమైనది. కొందరు దీనిని వేరుగా అర్థం చేసుకుంటారు; అయితే ఈ విజయగీత సందర్భంలో విధ్వంసాన్ని తెలిపే క్రియ సరిపోతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: మేము వారిపై బాణాలు వేశాము
  rationale: ఈ రూపం అత్యంత క్లిష్టమైనది. దాని వ్యంజనాలు, యుద్ధగీత సందర్భం ఆధారంగా ‘వారిపై బాణాలు వేశాము’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాము.
- source_word: אָבַד
  choice: నాశనమైంది
  rationale: ‘నశించు/నాశనమగు’ అనే సంపూర్ణ కార్య భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాము.
- source_word: עַד דִּיבוֹן
  choice: దీబోను వరకూ
  rationale: עַד సూచించే భౌగోళిక హద్దును ‘వరకూ’ సహజంగా తెలియజేస్తుంది.
- source_word: וַנַּשִּׁים
  choice: మేము పాడుచేశాము
  rationale: రూపం అనిశ్చితమైనప్పటికీ, విజయగీతపు సైనిక సందర్భంలో విధ్వంసాన్ని తెలిపే బహువచన క్రియార్థం సరిపోతుంది; అనిశ్చితిని పాదసూచికలో తెలిపాము.
- source_word: עַד נֹפַח
  choice: నోఫహు వరకూ
  rationale: ప్రదేశ విస్తృతిని సూచించే עַד ను ‘వరకూ’గా అనువదించి, స్థలనామాన్ని లిప్యంతరీకరించాము.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: అది మేదెబా వరకూ విస్తరించింది
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో స్పష్టంగా చేస్తూనే, భౌగోళిక విస్తృతి భావాన్ని కాపాడుతుంది.
- source_word: מֵידְבָא
  choice: మేదెబా
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాము.
