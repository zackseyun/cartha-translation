source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: te
  text: తరువాత ఇశ్రాయేలు కుమారులు[a] బయలుదేరి ఓబోతులో మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఈ జాతినామక ప్రయోగాన్ని ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితా సందర్భంలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీ వ్యక్తీకరణను సన్నిహితంగా ప్రతిబింబిస్తూ, ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే స్థిర జాతినామక ప్రయోగాన్ని నిలుపుతుంది. సహజమైన ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’ అని పాదసూచికలో తెలిపాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అరణ్య ప్రయాణ సందర్భంలో ఒక చోట శిబిరం వేసి ఆగడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ ప్రస్తుత తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּאֹבֹת
  choice: ఓబోతులో
  rationale: אֹבֹת స్థలనామం కాబట్టి అనువదించకుండా ‘ఓబోతు’గా లిప్యంతరీకరించాం; בְ ఉపసర్గను తెలుగు స్థానవాచక రూపమైన ‘-లో’తో వ్యక్తం చేశాం.
- source_word: וַ
  choice: తరువాత
  rationale: మొదటి క్రియకు ముందున్న వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. ‘తరువాత’ ప్రయాణంలోని తదుపరి దశను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని క్రమబద్ధ ప్రయాణ భావం మరియు జాతినామక వ్యక్తీకరణ నిలుపబడ్డాయి.
