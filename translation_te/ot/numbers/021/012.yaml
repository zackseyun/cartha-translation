translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని భౌగోళిక పదానికి ఉన్న అర్థవిస్తృతిని పాదసూచికలో నిలిపి ఉంచాం.
