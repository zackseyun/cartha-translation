  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: te
  text: అక్కడి నుండి వారు బయలుదేరి జెరెదు వాగు దగ్గర[a] శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జెరెదు లోయలో,” “జెరెదు ఇరుకైన లోయలో,” లేదా “జెరెదు వాగు పడక వద్ద”; హీబ్రూ పదం నహల్ లోయను, ఇరుకైన లోయను, లేదా కాలానుగుణంగా నీరు ప్రవహించే వాగు పడకను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: మునుపటి ప్రదేశం నుండి ప్రయాణం కొనసాగిందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נָסָעוּ
  choice: వారు బయలుదేరి
  rationale: ప్రయాణ కథనాల్లో נסע శిబిరాన్ని ఎత్తి ముందుకు సాగడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అనే క్రియకు ప్రయాణ సందర్భంలో స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: בְּנַחַל
  choice: వాగు దగ్గర
  rationale: נחל లోయ, కనుమ, కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా దాని పాతను సూచించవచ్చు. ఈ అరణ్య ప్రయాణ సందర్భంలో ‘వాగు’ సహజమైన తెలుగు భౌగోళిక పదం; בְ సంబంధాన్ని ‘దగ్గర’గా ఇవ్వడం శిబిర స్థలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זָרֶד
  choice: జెరెదు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది.
