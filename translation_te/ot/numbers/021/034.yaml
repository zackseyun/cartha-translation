source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: te
  text: 'యెహోవా మోషేతో ఇలా అన్నాడు: “అతనికి భయపడకు. ఎందుకంటే అతనినీ, అతని ప్రజలందరినీ, అతని దేశాన్నీ నీ చేతికి అప్పగించాను.[a] హెష్బోనులో నివసించిన అమోరీయుల రాజు సీహోనుకు నీవు చేసినట్లే అతనికీ చేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ చేతిలో ఉంచాను”; అంటే, “నీ అధికారానికి అప్పగించాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: אַל תִּירָא אֹתוֹ
  choice: అతనికి భయపడకు
  rationale: యרא అనే క్రియకు ఇక్కడ ఉన్న నేరమైన నిషేధార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְיָדְךָ נָתַתִּי
  choice: నీ చేతికి అప్పగించాను
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హెబ్రీయ నుడికారంలోని అధికారానికి లోబరచే భావాన్ని కాపాడుతూ తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: అతనినీ, అతని ప్రజలందరినీ, అతని దేశాన్నీ
  rationale: రాజు, ప్రజలు, దేశం అనే మూడు కర్మలనూ హెబ్రీయ మూలంలోని వరుసకు దగ్గరగా స్పష్టంగా ఉంచుతుంది.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: అతనికీ చేయాలి
  rationale: తదుపరి పోలికతో కలిసి ‘అతనికి అలాగే చేయాలి’ అనే ఆజ్ఞాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: హెష్బోనులో నివసించిన
  rationale: יֹשֵׁב అనే నివాసాన్ని సూచించే కృదంతాన్ని సందర్భానుసారమైన భూతకాల సంబంధవాచక రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది; తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: נָתַתִּי అనే సంపూర్ణ క్రియారూపపు హామీభావం
  choice: అప్పగించాను
  alternative: అప్పగిస్తాను
  rationale: ఇంకా జరగబోయే విజయాన్ని దేవుడు నిశ్చయంగా పూర్తయిన కార్యంలా పలికే మూలంలోని ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. మూలంలోని దైవిక హామీకి సంబంధించిన సంపూర్ణ క్రియారూపాన్ని నిలిపి, హెబ్రీయ నుడికారాన్ని పాఠ్యంలో సహజంగా ఇచ్చి పాదటిప్పణిలో అక్షరార్థాన్ని తెలిపింది.
