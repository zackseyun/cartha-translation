  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל כֵּ֛ן יֹאמְר֥וּ הַ/מֹּשְׁלִ֖ים בֹּ֣אוּ חֶשְׁבּ֑וֹן תִּבָּנֶ֥ה וְ/תִכּוֹנֵ֖ן עִ֥יר סִיחֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: te
  text: 'అందుచేత సామెతలు చెప్పేవారు[a] ఇలా అంటారు:


    “హెష్బోనుకు రండి;

    సీహోనుకు చెందిన పట్టణం నిర్మించబడి,

    స్థాపించబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సామెతలు రచించేవారు,” “గాయక కవులు”; సంప్రదాయకంగా “పాలకులు.” ఇక్కడి హీబ్రూ పదం రాజకీయ పాలకులకంటే సామెత లేదా గేయరూప సూక్తులను రచించే లేదా వల్లించే వారిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందున్న కథనం నుంచి వచ్చే వివరణాత్మక లేదా అనుమానాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֹאמְרוּ
  choice: ఇలా అంటారు
  rationale: ఇక్కడి అసంపూర్ణ క్రియ అలవాటుగా ఉటంకించే సూక్తిని పరిచయం చేసే వర్తమానార్థంలో ఉంది; ‘ఇలా అంటారు’ ఉద్ధరణను సహజంగా పరిచయం చేస్తుంది.
- source_word: הַמֹּשְׁלִים
  choice: సామెతలు చెప్పేవారు
  rationale: משל మూలానికి ‘పాలించేవారు’ అనే అర్థం ఉండగలిగినా, ఈ సందర్భంలో సామెత లేదా గేయరూప సూక్తిని రచించే లేదా వల్లించే వారినే సూచించడం ఎక్కువ సంభావ్యం. ఈ ఎంపిక మూలంలోని రూపాన్ని ‘కవులు’ కంటే ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
- source_word: בֹּאוּ
  choice: రండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను గౌరవప్రదమైన, సహజమైన తెలుగు బహువచన రూపంలో ఇస్తుంది.
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యనుకరణ పద్ధతిలో లిప్యంతరీకరించింది.
- source_word: תִּבָּנֶה
  choice: కట్టబడాలి
  rationale: కావ్య ఉద్ధరణలోని సంకల్పార్థక లేదా జస్సివ్ ఛాయను తెలుగులో ‘కట్టబడాలి’గా నిలుపుతుంది.
- source_word: וְתִכּוֹנֵן
  choice: స్థిరపరచబడాలి
  rationale: כון క్రియలోని స్థాపించబడటం, దృఢపరచబడటం అనే భావాన్ని కర్మణి రూపంలో నిలిపి, ముందరి సమాంతర పాదంతో సరిపోలుస్తుంది.
- source_word: עִיר סִיחוֹן
  choice: సీహోను పట్టణం
  rationale: హీబ్రూ నిర్మిత సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో ఇది సీహోనుకు చెందిన పట్టణమని అర్థం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని వాడాం. ఉద్ధరణలోని రెండు సమాంతర కర్మణి క్రియలను వేర్వేరు పాదాలుగా ఉంచి హీబ్రూ కవితా నిర్మాణాన్ని స్పష్టంగా చూపించాం.
