  to: 'అందుచేత సామెతలు చెప్పేవారు[a] ఇలా అంటారు:


    “హెష్బోనుకు రండి;

    సీహోనుకు చెందిన పట్టణం నిర్మించబడి,

    స్థాపించబడాలి.”'
  rationale: The revision makes the Hebrew construct relationship (“the city of Sihon”) explicit and improves the natural Telugu expression of the second poetic passive clause. It retains the source’s ambiguity concerning הַמֹּשְׁלִים, the plural imperative, and the volitive force of the poetic quotation.
  reviewer_model: gpt-5.6-terra
