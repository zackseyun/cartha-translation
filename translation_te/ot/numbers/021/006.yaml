id: NUM.21.6
reference: Numbers 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: te
  text: కాబట్టి యెహోవా ప్రజల మధ్యకు మండే పాములను[a] పంపాడు. అవి ప్రజలను కరిచాయి; ఇశ్రాయేలీయులలో అనేకమంది చనిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విషపాములను,’ లేదా ‘మండుతున్న పాములను.’ హీబ్రూలో అక్షరార్థంగా, ‘పాములను, మండేవాటిని’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: పంపాడు
  rationale: שׁלח అనే క్రియకు ఇక్కడి వరుస కథన రూపంలో నేరుగా ‘పంపాడు’ అనే అర్థం సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం వ్యక్తిగత నామాన్ని కాపాడుతుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: בָּעָם
  choice: ప్రజల మధ్యకు
  rationale: ב ఉపసర్గ ఇక్కడ పాములు పంపబడిన స్థలాన్ని సూచిస్తుంది. తెలుగు గమనార్థక నిర్మాణంలో ‘మధ్యకు’ సహజంగా ఉంటుంది.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: మండించే పాములను
  rationale: నామవాచకం–విశేషణం కలయికను నిలుపుతూ, שׂרפים సూచించే మంట లేదా మండించే ప్రభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అది తప్పనిసరిగా ‘విషపూరితమైన’ అని మాత్రమే నిర్ధారించదు.
- source_word: וַיְנַשְּׁכוּ
  choice: అవి ... కరిచాయి
  rationale: נשׁך అనే క్రియకు నేరమైన అర్థం ‘కరచు’; పాముల సందర్భంలో ‘కరిచాయి’ సహజమైన తెలుగు.
- source_word: וַיָּמָת
  choice: చనిపోయారు
  rationale: מות అనే సాధారణ ‘చనిపోవు’ క్రియను స్పష్టమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో అనేకమంది
  rationale: మూలంలోని ‘ఇశ్రాయేలు నుండి/మధ్య నుండి అనేక ప్రజలు’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, మృతులు ఇశ్రాయేలు సమాజంలోనివారని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో స్థిరంగా ప్రాచుర్యంలో ఉన్న నామరూపమైన ‘యెహోవా’ను ఎంచుకోవడం ద్వారా దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా కాపాడాం.
- issue: הַשְּׂרָפִים అనే విశేషణ భావం
  choice: మండించే పాములు
  alternative: విషపాములు; అగ్ని పాములు
  rationale: ఈ పదం పాముల రూపాన్ని సూచించవచ్చు లేదా వాటి కాటు కలిగించే మండే ప్రభావాన్ని సూచించవచ్చు. ‘మండించే’ మూలంలోని అగ్ని/మంట చిత్రాన్ని నిలుపుతూ, దాన్ని కేవలం విషానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. చిన్న వాక్య విభజనతో వరుస సంఘటనలు స్పష్టంగా ఉన్నాయి; మూలంలోని הַשְּׂרָפִים పదానికి గల భావసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
