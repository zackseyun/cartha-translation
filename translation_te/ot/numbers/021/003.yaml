source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: te
  text: యాహ్వే ఇశ్రాయేలు మొర ఆలకించి, కనానీయులను వారికి అప్పగించాడు. ఇశ్రాయేలీయులు వారినీ వారి పట్టణాలనూ నాశనానికి అంకితం చేశారు. అందుచేత ఆ ప్రదేశానికి హోర్మా[a] అనే పేరు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హోర్మా’ అనే పేరు, ‘నాశనానికి అంకితం చేయడం’ లేదా ‘నిషేధం కింద ఉంచడం’ అనే అర్థం గల హీబ్రూ పదాన్ని పోలి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో దేవుని వ్యక్తిగత నామాన్ని ఉంచి, దానికి బదులుగా ఒక బిరుదును వాడలేదు.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: మొర ఆలకించి
  rationale: హీబ్రూ నుడికారానికి పదశః అర్థం ‘స్వరాన్ని విన్నాడు’; సందర్భంలో ఇశ్రాయేలు చేసిన విన్నపాన్ని దేవుడు విని స్పందించాడనే భావాన్ని సహజమైన తెలుగులో ‘మొర ఆలకించాడు’ తెలియజేస్తుంది.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: కనానీయులను వారికి అప్పగించాడు
  rationale: נתן ఇక్కడ శత్రువులను మరొకరి అధికారానికి అప్పగించడం అనే భావం కలిగిస్తుంది. ఏకవచన జాతివాచకానికి తెలుగులో సహజమైన సమూహ బహువచనం వాడబడింది.
- source_word: וַיַּחֲרֵם
  choice: నాశనానికి అంకితం చేశారు
  rationale: חרם అనే పదంలోని ప్రత్యేక భావమైన తిరిగి తీసుకోలేని విధంగా నాశనానికి నియమించడం లేదా అంకితం చేయడం నిలుపబడింది; కేవలం ‘నాశనం చేశారు’ అని చదును చేయలేదు.
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: వారినీ వారి పట్టణాలనూ
  rationale: వ్యక్తులనూ వారి నివాస పట్టణాలనూ ప్రత్యక్ష కర్మలుగా స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: ఆ ప్రదేశానికి ... అనే పేరు వచ్చింది
  rationale: హీబ్రూలో క్రియ ఏకవచనమైనా కర్త వ్యక్తంగా లేదు. తెలుగు భావవాచక నిర్మాణం దేవుడా, ఇశ్రాయేలా, లేక సామాన్య వాడుకా అని అనవసరంగా నిర్ణయించకుండా పేరు ఏర్పడిన ఫలితాన్ని తెలుపుతుంది.
- source_word: חָרְמָה
  choice: హోర్మా
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, חרם పదంతో దాని శబ్దార్థ సంబంధాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: חרם యుద్ధ పరిభాష అనువాదం
  choice: వారినీ వారి పట్టణాలనూ నాశనానికి అంకితం చేశారు
  alternative: వారినీ వారి పట్టణాలనూ పూర్తిగా నాశనం చేశారు; వారినీ వారి పట్టణాలనూ నిషేధానికి గురిచేశారు
  rationale: ‘నాశనానికి అంకితం’ అనేది హీబ్రూ ḥērem భావంలోని మతపరమైన అంకితభావాన్నీ దాని విధ్వంసక ఫలితాన్నీ రెండింటినీ నిలుపుతుంది. హింసను మృదువుగా చూపదు; అలాగే ప్రధాన వాక్యంలో అపారదర్శకమైన సాంకేతిక పదాన్ని మాత్రమే పెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని కర్త అస్పష్టతను పేరు పెట్టే వాక్యంలో నిలిపి, కనానీయుడు అనే ఏకవచన జాతివాచకాన్ని తెలుగులో సహజమైన సమూహ బహువచనంగా ఇచ్చాం.
