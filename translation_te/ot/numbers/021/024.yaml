id: NUM.21.24
reference: Numbers 21:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: te
  text: ఇశ్రాయేలు అతనిని కత్తి ధారతో కొట్టి, అర్నోను నుండి యబ్బోకు వరకు, అమ్మోనీయుల వరకు విస్తరించిన అతని దేశాన్ని స్వాధీనం చేసుకుంది[a]; ఎందుకంటే అమ్మోనీయుల సరిహద్దు బలంగా ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అమ్మోను కుమారుల వరకు’; ఇది అమ్మోనీయులను సూచించే హీబ్రూ జాతీయతా నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: అతణ్ణి హతమార్చి
  rationale: נכה యొక్క ప్రాథమిక భావం ‘కొట్టు’; కత్తివాత అనే సందర్భంలో తెలుగు సహజ వాడుకకు ‘హతమార్చి’ సరిపోతుంది. అయితే ఇది మరణాన్ని స్పష్టంగా సూచించే సందర్భానుగుణ అనువాదం.
- source_word: לְפִי חָרֶב
  choice: కత్తివాత
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి/అంచుకు’ అనే హీబ్రూ యుద్ధప్రయోగాన్ని సహజమైన తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: וַיִּירַשׁ
  choice: స్వాధీనం చేసుకుంది
  rationale: సైనిక సందర్భంలో భూమిని జయించి ఆధీనంలోకి తీసుకోవడాన్ని స్పష్టంగా తెలుపుతుంది; ‘వారసత్వంగా పొందింది’ అనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: אַרְצוֹ
  choice: అతని దేశాన్ని
  rationale: אֶרֶץ కు నేరమైన తెలుగు సమానం; ఇక్కడ రాజు ఆధీనంలోని భూభాగాన్ని సూచిస్తుంది.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: అర్నోను నుండి యబ్బోకు వరకు
  rationale: రెండు భౌగోళిక సరిహద్దుల మధ్య విస్తారాన్ని సహజంగా తెలుపుతుంది.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల ప్రాంతం వరకు
  rationale: ‘అమ్మోను కుమారులు’ అనే హీబ్రూ జాతీయతా నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ప్రజాపేరు ద్వారా అందిస్తూ, עַד సూచించే భౌగోళిక పరిమితిని ‘ప్రాంతం’తో స్పష్టం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి భూవిస్తారం అక్కడితో ఎందుకు ఆగిందో తెలిపే కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַז
  choice: బలంగా
  rationale: ‘బలమైన/శక్తిమంతమైన’ అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘కోటలతో పటిష్ఠమైన’ వంటి అధిక నిర్దిష్టతను చేర్చదు.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల సరిహద్దు
  rationale: జాతి భూభాగపు పరిమితిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: בְּנֵי עַמּוֹן అనే జాతీయతా వ్యక్తీకరణ
  choice: అమ్మోనీయులు
  alternative: అమ్మోను కుమారులు
  rationale: ఇక్కడ పుంలింగ బంధుత్వపదం వ్యక్తిగత కుమారులను మాత్రమే కాక మొత్తం జాతిని సూచించే హీబ్రూ నుడికారం. ‘అమ్మోనీయులు’ ఆ సమూహార్థాన్ని లింగపరంగా తప్పుదారి పట్టించకుండా సహజ తెలుగులో అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యుద్ధవివరణకు తగిన గంభీరతను ఉంచి, సాధారణ పాఠకులకు సహజంగా ఉండే పదప్రయోగం వాడబడింది. స్థలనామాలు అర్నోను, యబ్బోకు అని తెలుగు బైబిలు సంప్రదాయానికి అనుకూలంగా లిప్యంతరీకరించబడ్డాయి.
