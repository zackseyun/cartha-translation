id: NUM.21.8
reference: Numbers 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: te
  text: అప్పుడు యాహ్వే మోషేతో, “నీ కోసం ఒక మండే పామును[a] తయారుచేసి, దాన్ని ఒక ధ్వజస్తంభం[b] మీద ఉంచు. పాము కాటుకు గురైన ప్రతి ఒక్కరూ దాన్ని చూసినప్పుడు జీవిస్తారు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సెరాఫు’ లేదా ‘దహించేది’; హీబ్రూ పదం ఈ సందర్భంలో ప్రాణాంతకమైన పామును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సంకేతస్తంభం’; హీబ్రూ పదం ధ్వజాన్ని లేదా గుర్తుగా ఎత్తి నిలిపే వస్తువును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హీబ్రూ అక్షరాలను వ్యక్తిగత నామంగా నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని వాడింది.
- source_word: עֲשֵׂה לְךָ
  choice: నీ కోసం ... తయారుచేసి
  rationale: ఆజ్ఞతో కూడిన దత్తివాచక సర్వనామాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, మోషేకు వ్యక్తిగతంగా ఇచ్చిన ఆదేశాన్ని నిలుపుతుంది.
- source_word: שָׂרָף
  choice: మండే పాము
  rationale: హీబ్రూ పదంలోని ‘మండేది’ అనే రూపకాన్ని, ముందటి వచనాల్లోని ప్రాణాంతక పాముల సందర్భాన్ని నిలుపుతుంది; ‘విషపాము’ అనేది ప్రభావాన్ని స్పష్టపరిచినా మరింత వ్యాఖ్యానాత్మకం.
- source_word: נֵס
  choice: ధ్వజస్తంభం
  rationale: ఈ పదం సాధారణంగా గుర్తుగా ఎత్తి నిలిపే ధ్వజం లేదా సంకేతస్తంభాన్ని సూచిస్తుంది. కేవలం ‘స్తంభం’ కంటే మూలపదంలోని సంకేతార్థాన్ని ఇది బాగా నిలుపుతుంది.
- source_word: הַנָּשׁוּךְ
  choice: పాము కాటుకు గురైన ప్రతి ఒక్కరూ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కర్మణి అసమాపక క్రియను సామాన్యంగా వర్తించే వ్యక్తుల సమూహంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְרָאָה אֹתוֹ
  choice: దాన్ని చూసినప్పుడు
  rationale: చూడటం జీవించడానికి సంబంధించిన సందర్భోచిత షరతుగా ఉన్న ప్రవాహాన్ని సహజ తెలుగులో తెలియజేస్తుంది; మూలంలోని సంబంధాన్ని మించి కారణాన్ని జోడించదు.
- source_word: וָחָי
  choice: బతుకుతారు
  rationale: కాటు తరువాత మరణించకుండా జీవించడం అనే ఫలితాన్ని సూటిగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: שָׂרָף పదం సూచించే రూపం
  choice: ప్రధాన పాఠ్యంలో ‘మండే పాము’
  alternative: ‘సెరాఫు’ లేదా ‘విషపాము’
  rationale: కథా సందర్భం పాము రూపాన్ని కోరుతుంది. ‘మండే పాము’ మూలపదంలోని అగ్ని/మంట భావాన్ని నిలుపుతూ, తరువాతి దేవదూత సంబంధిత ‘సెరాఫు’ భావాన్ని అనవసరంగా దిగుమతి చేయదు; ‘విషపాము’ ప్రభావాన్ని మాత్రమే వ్యాఖ్యానిస్తుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. మూలంలోని ఆజ్ఞ, షరతు, ఫలితం అనే క్రమాన్ని నిలిపింది. వివరణలు ప్రధాన పాఠ్యంలో కలపకుండా పదసంబంధ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఉంచింది.
