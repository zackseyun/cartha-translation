translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వచనం. భౌగోళిక సంబంధాన్ని స్పష్టంగా ఉంచుతూ, מֵעֵבֶר లోని దృక్కోణాధారిత సందిగ్ధతను పాదటిప్పణిలో నిలిపాం. ‘మకాం వేశారు’ ప్రయాణ కథనానికి సహజమైన పదప్రయోగం.
