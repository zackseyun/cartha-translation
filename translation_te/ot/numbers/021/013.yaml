source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: te
  text: అక్కడి నుంచి వారు బయలుదేరి, అర్నోను నదికి అవతల, ఎమోరీయుల సరిహద్దు నుంచి విస్తరించే అరణ్యంలో మకాం వేశారు.[a] ఎందుకంటే అర్నోను మోయాబుకూ ఎమోరీయులకూ మధ్యనున్న మోయాబు సరిహద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అర్నోను నదికి ఆవలి వైపున.’ హీబ్రూ పదబంధం చూసే దిశను బట్టి ఒక సరిహద్దుకు అవతలి వైపును లేదా దానికి ఆవల ఉన్న ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: మునుపటి స్థలం నుంచి ప్రయాణం కొనసాగిందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נָסָעוּ
  choice: వారు బయలుదేరి
  rationale: ప్రయాణ వర్ణనలో ఈ క్రియ మకాం ఎత్తి ముందుకు సాగడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: నివాసార్థం కాకుండా ప్రయాణమధ్య శిబిరం వేసిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: అర్నోను అవతల
  rationale: עֵבֶר సూచించే అవతలి వైపు లేదా సరిహద్దుకు ఆవల ఉన్న ప్రాంతం అనే దృక్కోణాధారిత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר בַּמִּדְבָּר הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: ఎమోరీయుల సరిహద్దు నుంచి విస్తరించే అరణ్యంలో ఉన్న
  rationale: హీబ్రూ సంబంధవాక్యాన్ని భౌగోళిక వివరణగా సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది; יצא అనే పదంలోని ‘బయటకు సాగడం’ భావాన్ని ‘విస్తరించే’గా వ్యక్తం చేస్తుంది.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: రెండు భూభాగాల మధ్య హద్దును సూచించే రెండు సందర్భాలకూ స్పష్టమైన, స్థిరమైన అనువాదం.
- source_word: הָאֱמֹרִי
  choice: ఎమోరీయులు
  rationale: రూపరీత్యా ఏకవచనమైనా ఇక్కడ ఒక జనసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న భౌగోళిక వివరానికి కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: అర్నోను ... మోయాబు సరిహద్దు
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని ప్రస్తుత భౌగోళిక వాస్తవంగా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: మోయాబుకు, ఎమోరీయులకు మధ్యనున్న
  rationale: అర్నోను సరిహద్దు వేరుచేసే రెండు పక్షాలను స్పష్టంగా వ్యక్తం చేస్తుంది.
