id: NUM.21.1
reference: Numbers 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: te
  text: నెగెబులో నివసించే అరాదు రాజైన కనానీయుడు, ఇశ్రాయేలు అతారీము[a] మార్గంలో వస్తున్నాడని విన్నప్పుడు, ఇశ్రాయేలుతో యుద్ధం చేసి, వారిలో కొందరిని చెరపట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతారీము మార్గంలో.’ ‘అతారీము’ అనే పదం అర్థం అనిశ్చితం. కొందరు దాన్ని స్థలనామంగా భావిస్తారు; మరికొందరు ప్రాచీన అనువాదాల ఆధారంగా ‘గూఢచారుల మార్గంలో’ లేదా ‘వేగుల మార్గంలో’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: కథన సందర్భంలో שׁמע వార్త వినడాన్ని సూచిస్తుంది; తరువాతి చర్యకు కారణమైన సమాచారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: అరాదు రాజైన కనానీయుడు
  rationale: నిర్దిష్ట కనానీయ పాలకుణ్ణి, అరాదు రాజుగా గుర్తించే హీబ్రూ పదబంధాన్ని సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: నెగెబులో నివసించే
  rationale: יֹשֵׁב నివాసాన్ని సూచిస్తుంది; הַנֶּגֶבను సాధారణంగా ‘దక్షిణ ప్రాంతం’గా మార్చకుండా భౌగోళిక నామమైన ‘నెగెబు’గా ఉంచుతుంది.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ... వస్తున్నాడని
  rationale: ఇశ్రాయేలు ఇక్కడ సమష్టి ప్రజను ఏకవచన నామంగా సూచిస్తుంది; రాజు విన్న సమాచారంగా వారి రాకను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: అతారీము మార్గంలో
  rationale: అస్పష్టమైన אֲתָרִיםను ఊహాత్మకంగా పరిష్కరించకుండా స్థలనామంలా లిప్యంతరీకరించి, ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేసి
  rationale: హీబ్రూ యుద్ధపదబంధాన్ని పోరాట పరిమాణాన్ని అతిశయింపజేయకుండా నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: వారిలో కొందరిని చెరపట్టాడు
  rationale: సమష్టిగా ఉన్న ఇశ్రాయేలు ప్రజలలో కొందరిని యుద్ధ ఖైదీలుగా పట్టుకున్న భావాన్ని సహజమైన తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. భౌగోళిక నామాలను లిప్యంతరీకరించాం; మూలంలోని అస్పష్టతను పాదసూచికలో నిలిపాం.
