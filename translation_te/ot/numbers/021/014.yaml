id: NUM.21.14
reference: Numbers 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: te
  text: 'అందుచేత యాహ్వే యుద్ధాల గ్రంథంలో ఇలా చెప్పబడింది:


    “సూఫాలో[a] వాహేబు[b],

    మరియు అర్నోను వాగులోయలు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సూఫా అనేది స్థలనామం కాక సాధారణ నామవాచకమైతే, “తుఫానులో.”
    reason: alternative_reading
  - marker: b
    text: ఉల్లేఖించిన ఈ హీబ్రూ పాదం అస్పష్టంగా ఉంది. కొందరు “వాహేబు”ను స్థలనామంగా కాక, ఒక క్రియాత్మక వాక్యభాగంగా కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ఉల్లేఖనాన్ని పరిచయం చేసే కారణార్థక అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יֵאָמַר
  choice: ఇలా చెప్పబడింది
  rationale: אמר క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ కర్తలేని ప్రయోగంగా ఉండి ఉల్లేఖనాన్ని పరిచయం చేస్తుంది.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: యెహోవా యుద్ధాల గ్రంథంలో
  rationale: తెలిసిన లిఖిత మూలగ్రంథపు శీర్షికగా ఉన్న హీబ్రూ సమాసాన్ని సూటిగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది; దానిని ఒక బిరుదుతో భర్తీ చేయదు.
- source_word: אֶת וָהֵב
  choice: వాహేబు
  rationale: అస్పష్టమైన కవితా పాదంలో וָהֵב‌ను స్థలనామంగా తీసుకోవడం అతిగా వ్యాఖ్యానించకుండా మూలరూపాన్ని కాపాడుతుంది.
- source_word: בְּסוּפָה
  choice: సూఫాలోని
  rationale: סוּפָה‌ను స్థలనామంగా పరిగణించి వాహేబుతో సహజమైన తెలుగు సంబంధాన్ని చూపుతుంది; ‘తుఫానులో’ అనే సాధారణ నామార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְאֶת הַנְּחָלִים אַרְנוֹן
  choice: అర్నోను వాగులోయలు
  rationale: נְחָלִים ఇక్కడ కాలానుగుణంగా నీరు ప్రవహించే లోయలు లేదా వాడీలను సూచిస్తుంది; ‘వాగులోయలు’ భౌగోళిక భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది ఇశ్రాయేలు దేవుని వ్యక్తిగత నామమని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది.
- issue: అస్పష్టమైన పురాతన కవితా ఉల్లేఖనం
  choice: వాహేబు, సూఫా అనే స్థలనామాలుగా ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘తుఫానులో వాహేబు’ లేదా וָהֵב‌ను క్రియాపద భాగంగా అర్థం చేసుకోవడం
  rationale: హీబ్రూ పాదం అత్యంత అస్పష్టమైనది; ప్రధాన పాఠం సాధ్యమైన స్థలనామ పఠనాన్ని ఇస్తూ, ప్రత్యామ్నాయాలను పాదసూచికల్లో వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన శైలి. పురాతన భౌగోళిక పదమైన נחל‌కు అర్థస్పష్టత కోసం ‘వాగులోయలు’ వాడబడింది. మూలంలోని కవితాత్మక అస్పష్టతను పాదసూచికలతో సంరక్షించాం; అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
