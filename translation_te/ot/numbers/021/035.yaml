translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. యుద్ధసందర్భంలోని సంపూర్ణ సంహారాన్ని మృదుపరచకుండా, మూలంలోని భావాన్ని స్పష్టంగా నిలిపాం. రెండు పాదాల చర్యల క్రమాన్ని ‘ఆ తరువాత’తో సహజంగా తెలిపాం; మూలంలో లేని సిద్ధాంతార్థాన్ని చేర్చలేదు.
