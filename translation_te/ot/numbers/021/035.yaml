- from: కాబట్టి వారు అతణ్ణి, అతని కుమారులను, అతని ప్రజలందరినీ హతమార్చారు; అతనికి ఒక్కరు కూడా మిగలకుండా చేశారు.[a] ఆ తరువాత వారు అతని దేశాన్ని స్వాధీనం చేసుకున్నారు.[b]
