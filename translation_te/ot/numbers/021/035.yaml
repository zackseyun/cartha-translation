  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: te
  text: వారు అతణ్ణి, అతని కుమారులను, అతని ప్రజలందరినీ హతమార్చి, అతనికి బతికి మిగిలినవారు ఎవరూ లేకుండా చేశారు.[a] తరువాత వారు అతని దేశాన్ని స్వాధీనం చేసుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి బతికి మిగిలినవారు ఎవరూ లేకపోయే వరకు.’
    reason: హీబ్రూ నుడికారంలోని కాల-పరిమితి రూపాన్ని మరింత సమీపంగా ప్రతిబింబించే అనువాద ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, ‘అతని దేశాన్ని తమ అధీనంలోకి తెచ్చుకున్నారు.’
    reason: ירשׁ అనే క్రియలోని ఆక్రమించి అధీనంలో ఉంచుకోవడం అనే భావానికి అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: నכה అనే క్రియ యుద్ధ సందర్భంలో కొట్టడం లేదా ఓడించడం అనే భావంతో పాటు ప్రాణాంతక సంహారాన్ని కూడా సూచిస్తుంది. తరువాతి వాక్యభాగం ఒక్క ప్రాణి కూడా మిగలలేదని స్పష్టం చేస్తున్నందున, ఇక్కడ ‘హతమార్చారు’ సందర్భానుగుణమైన సహజ తెలుగు.
- source_word: אֹתוֹ
  choice: అతణ్ణి
  rationale: ఈ ప్రత్యక్ష కర్మ సర్వనామం ముందటి వచనంలో ప్రస్తావించిన ఓగును సూచిస్తుంది.
- source_word: בָּנָיו
  choice: అతని కుమారులను
  rationale: బָּנִים పుంలింగ బహువచనం; ఇక్కడ సాధారణీకరించకుండా ‘కుమారులు’ అని లింగార్థాన్ని నిలిపాం.
- source_word: כָּל־עַמּוֹ
  choice: అతని ప్రజలందరినీ
  rationale: עַם ప్రాథమికంగా ‘ప్రజలు’ అని అర్థం. ఇది సైన్యానికి మాత్రమే పరిమితం కాకుండా అతని పాలనలోని ప్రజలను విస్తృతంగా సూచిస్తుంది.
- source_word: עַד־בִּלְתִּי הִשְׁאִיר־לוֹ שָׂרִיד
  choice: అతనికి ఒక్కరు కూడా మిగలకుండా చేశారు
  rationale: హీబ్రూ నుడికారం సంపూర్ణ సంహారాన్ని తెలియజేస్తుంది. ‘ఒక్కరు కూడా మిగలకుండా’ అనేది שָׂרִיד యొక్క ‘బతికి మిగిలినవాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; క్రియకు ఉన్న అనిర్దిష్ట కర్తను సందర్భానుసారంగా ‘వారు’గా తెలిపాం.
- source_word: וַיִּירְשׁוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: ירשׁ ఇక్కడ యుద్ధవిజయం తరువాత భూభాగాన్ని ఆక్రమించి అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘స్వాధీనం చేసుకున్నారు’ శాంతియుత వారసత్వం అనే అనవసర భావాన్ని కలిగించదు.
- source_word: אַרְצוֹ
  choice: అతని దేశాన్ని
  rationale: אֶרֶץ ఇక్కడ ఓగు పాలించిన భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అతని దేశం’ సహజంగా ఉండి, అతని అధికార పరిధిని తెలియజేస్తుంది.
