id: NUM.21.7
reference: Numbers 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: te
  text: అప్పుడు ప్రజలు మోషే దగ్గరకు వచ్చి, “మేము పాపం చేశాము; ఎందుకంటే మేము యాహ్వేకు, నీకు విరోధంగా మాట్లాడాము. యాహ్వే మా మీద నుండి పామును[a] తొలగించేలా ఆయనను ప్రార్థించు” అన్నారు. కాబట్టి మోషే ప్రజల కోసం ప్రార్థించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సర్పాన్ని.” హీబ్రూ పదం ఏకవచనంలో ఉంది; ఇక్కడ అది పాముల విపత్తును సమూహార్థంగా సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: అప్పుడు ప్రజలు ... వచ్చి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సమూహవాచకమైన ‘ప్రజలు’ను సహజమైన తెలుగు బహువచనంగా వ్యక్తపరచాం.
- source_word: חָטָאנוּ
  choice: మేము పాపం చేశాము
  rationale: పూర్తయిన చర్యను ప్రస్తుత అంగీకారంగా ఒప్పుకునే భావాన్ని సహజమైన తెలుగు పశ్చాత్తాప భాషలో నిలిపింది.
- source_word: כִּי דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: ఎందుకంటే మేము యాహ్వేకు, నీకు విరోధంగా మాట్లాడాము
  rationale: כִּי యొక్క కారణార్థాన్ని, דבר ב యొక్క వ్యతిరేకంగా మాట్లాడే భావాన్ని స్పష్టంగా నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: యాహ్వేకు ప్రార్థించు
  rationale: פלל హిత్పయేల్ రూపంలోని ప్రార్థన/విన్నప భావాన్ని సూటిగా, సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: ఆయన మా మీదినుంచి ... తొలగించేలా
  rationale: ఆజ్ఞ తరువాతి క్రియలోని అభ్యర్థన లేదా ఉద్దేశ భావాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా వ్యక్తపరుస్తూ, מֵעָלֵינוּలోని ‘మా మీదినుంచి’ భావాన్ని నిలిపింది.
- source_word: אֶת הַנָּחָשׁ
  choice: పామును
  rationale: హీబ్రూలో ఉన్న ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; సందర్భంలో అది పాముల విపత్తును సమూహార్థంగా సూచించే అవకాశాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: కాబట్టి మోషే ప్రజల కోసం ప్రార్థించాడు
  rationale: בְּעַדలోని ప్రజల పక్షాన చేసే మధ్యవర్తిత్వ భావాన్ని సాధారణ తెలుగు ‘కోసం ప్రార్థించాడు’ అనే ప్రయోగంతో స్పష్టంగా అందించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా, ‘Jehovah’ రూపాన్ని అనుసరించకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించాం.
- issue: הַנָּחָשׁ ఏకవచనం యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘పామును’ అనే ఏకవచనం
  alternative: పాములను
  rationale: మూలంలోని వ్యాకరణ ఏకవచనాన్ని కాపాడుతూ, అది పాముల విపత్తును సమూహార్థంగా సూచించవచ్చనే నిజమైన అర్థసంభావ్యతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ప్రత్యక్ష సంభాషణ సహజంగా ఉంచబడింది; మూలంలోని దైవనామం, కారణ సంబంధం, ఏకవచన అస్పష్టత పరిరక్షించబడ్డాయి.
