id: NUM.21.20
reference: Numbers 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: te
  text: బామోతు నుండి మోయాబు ప్రాంతంలో ఉన్న లోయకు, అక్కడి నుండి బంజరు ప్రాంతాన్ని[a] తిలకించే పిస్గా శిఖరానికి వెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెషీమోను.’ ఇక్కడి హీబ్రూ పదాన్ని బంజరు ప్రాంతాన్ని సూచించే సాధారణ నామంగా కాకుండా ప్రాంతనామంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘బంజరు ప్రాంతపు ముఖంపైకి.’ ఇది బంజరు ప్రాంతానికి ఎదురుగా ఉండి దానిని తిలకించే స్థలమనే భావాన్ని ఇస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: బామోతు నుండి
  rationale: బָּמוֹת ఈ ప్రయాణ వివరణలో స్థలనామంగా పనిచేస్తుంది; అందువల్ల ‘ఉన్నత స్థలాలు’ అని అనువదించకుండా ‘బామోతు’ అని లిప్యంతరీకరించాం. מִן భావాన్ని ‘నుండి’ తెలియజేస్తుంది.
- source_word: הַגַּיְא
  choice: లోయకు
  rationale: גַּיְא అంటే లోయ లేదా కనుమ; ఈ భౌగోళిక సందర్భంలో సాధారణ పాఠకులకు సహజమైన ‘లోయ’ను ఎంచుకున్నాం.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: మోయాబు మైదానంలో ఉన్న
  rationale: שָׂדֶה పదానికి అక్షరార్థంగా ‘పొలం’ ఉన్నా, ఇక్కడ అది బహిరంగ భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది. భౌగోళిక వర్ణనలో ‘మైదానం’ సహజంగా ఉండి మూలంలోని దృశ్యాన్ని నిలుపుతుంది.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: పిస్గా శిఖరానికి
  rationale: భూస్వరూప సందర్భంలో רֹאשׁ (‘తల’) అంటే పైభాగం లేదా శిఖరం. פִּסְגָּהను స్థలనామంగా ‘పిస్గా’ అని లిప్యంతరీకరించాం.
- source_word: וְנִשְׁקָפָה עַל־פְּנֵי
  choice: అభిముఖంగా ఉన్న
  rationale: ఈ రూపం పిస్గా శిఖరం ఆ ప్రాంతం వైపు ఉండి దానిని వీక్షించే స్థానంలో ఉందని సూచిస్తుంది. తెలుగు భౌగోళిక వర్ణనలో ‘అభిముఖంగా ఉన్న’ సహజంగా ఉంది; మూలంలోని ‘ముఖం’ నుడికారాన్ని పాదసూచికలో తెలిపాం.
- source_word: הַיְשִׁימֹן
  choice: బంజరు ప్రాంతం
  rationale: יְשִׁימוֹן నిర్జనమైన, పాడుబడిన భూభాగాన్ని సూచిస్తుంది. అది ప్రాంతనామంగా కూడా అర్థం కావచ్చు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
