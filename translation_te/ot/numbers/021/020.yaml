translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూ వాక్యం మునుపటి ప్రయాణ జాబితాపై ఆధారపడిన క్రియారహిత కొనసాగింపు; తెలుగు వచనం స్వతంత్రంగా చదవడానికి సహజంగా ఉండేందుకు ‘వెళ్లారు’ను స్పష్టంగా చేర్చాం. ‘మైదానం,’ ‘శిఖరం,’ ‘అభిముఖంగా’ వంటి పదాలు భౌగోళిక క్రమాన్ని స్పష్టంగా ఉంచుతాయి.
