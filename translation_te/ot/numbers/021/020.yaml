- from: బామోతు నుండి మోయాబు మైదానంలో ఉన్న లోయకు, అక్కడి నుండి బంజరు ప్రాంతానికి[a] అభిముఖంగా ఉన్న[b] పిస్గా శిఖరానికి వెళ్లారు.
  to: బామోతు నుండి మోయాబు ప్రాంతంలో ఉన్న లోయకు, అక్కడి నుండి బంజరు ప్రాంతాన్ని[a] తిలకించే పిస్గా శిఖరానికి వెళ్లారు.[b]
  rationale: The revision preserves the Hebrew geographic progression and supplies a more natural Telugu expression for the summit’s outlook over the wasteland. It also corrects the explanatory footnote while retaining the source ambiguity that יְשִׁימוֹן may be a regional name.
