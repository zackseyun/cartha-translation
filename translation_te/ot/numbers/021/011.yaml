  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: te
  text: వారు ఓబోతు నుండి బయలుదేరి, మోయాబుకు ఎదురుగా సూర్యోదయ దిశలో ఉన్న అరణ్యంలోని ఇయ్యే-అబారీములో[a] శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇయ్యే-అబారీము” అనే పేరును అర్థానుసారంగా “అబారీము శిథిలాలు” లేదా “అబారీము కుప్పలు” అని కూడా గ్రహించవచ్చు; అయితే ఇక్కడ అది స్థలనామంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ వర్ణనలో נסע శిబిరాన్ని విడిచి తదుపరి మజిలీకి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: מֵאֹבֹת
  choice: ఓబోతు నుండి
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: దిగారు
  rationale: חנה అంటే శిబిరం వేయడం. ప్రయాణ మజిలీ సందర్భంలో ‘దిగారు’ సహజమైన తెలుగు ప్రయోగం; వారు అక్కడ బస చేసిన భావాన్ని ఇస్తుంది.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: ఈయే-అబారీములో
  rationale: ప్రయాణ మజిలీల జాబితాలో ఇది స్థలనామంగా పనిచేస్తుంది. עִיֵּיకి ‘శిథిలాలు/కుప్పలు’ అనే అర్థసూచన ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలోని
  rationale: מִדְבָּר నిర్జనమైన అరణ్య లేదా ఎడారి మైదాన ప్రాంతాన్ని సూచించగలదు; ఇశ్రాయేలు ప్రయాణ సందర్భంలో ‘అరణ్యం’ సుపరిచితమైన, తగిన పదం.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: మోయాబుకు ఎదురుగా
  rationale: భౌగోళిక వర్ణనలో עַל־פְּנֵי ‘ఎదురుగా’ లేదా ‘ముఖంగా’ అనే స్థాన సంబంధాన్ని సూచిస్తుంది.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: సూర్యోదయ దిశలో
  rationale: హీబ్రూ పదబంధం సూర్యుడు ఉదయించే వైపును, అంటే తూర్పును సూచిస్తుంది. ‘సూర్యోదయ దిశలో’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
