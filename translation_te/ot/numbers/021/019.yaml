translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త ప్రయాణ-జాబితా శైలిని సహజంగా అందించాం. హీబ్రూ వాక్యంలో క్రియ స్పష్టంగా లేకపోయినా, సందర్భం సూచించే ‘వెళ్లారు’ను తెలుగులో చేర్చాం. స్థలనామాలను గౌరవప్రదమైన, సులభంగా చదవగల లిప్యంతరీకరణలో ఉంచాం.
