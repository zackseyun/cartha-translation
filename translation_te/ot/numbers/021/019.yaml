translation:
  language: te
  text: మత్తానా నుండి నహలీయేలుకు, నహలీయేలు నుండి బామోతుకు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ “బామోత్”కు “ఎత్తైన ప్రదేశాలు” అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ అది ప్రయాణక్రమంలోని ఒక స్థలనామంగా తీసుకోవడం సముచితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: మత్తానా నుండి
  rationale: వావ్ సంధి ప్రయాణ దశలను అనుసంధానిస్తుంది; מן ఉపసర్గకు ‘నుండి’ అని అనువదించాం. మַתָּנָה ఇక్కడ స్థలనామం కాబట్టి లిప్యంతరీకరించాం.
- source_word: נַחֲלִיאֵל
  choice: నహలీయేలుకు
  rationale: హీబ్రూలో గమ్యార్థక ఉపసర్గ లేకపోయినా, ప్రయాణ జాబితాలోని సంక్షిప్త శైలి ఒక స్థలం నుండి మరొక స్థలానికి వెళ్లడాన్ని సూచిస్తుంది; సహజమైన తెలుగుకోసం ‘కు’ చేర్చాం.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: నహలీయేలు నుండి
  rationale: מן ఉపసర్గను ‘నుండి’గా అనువదించి, స్థలనామాన్ని మొదటి ప్రస్తావనతో ఏకరీతిగా ఉంచాం.
- source_word: בָּמוֹת
  choice: బామోతుకు
  rationale: ఈ ప్రయాణ క్రమంలో בָּמוֹת ఒక స్థలనామంగా పనిచేస్తుంది; అందువల్ల దాన్ని అనువదించకుండా లిప్యంతరీకరించాం. గమ్యాన్ని స్పష్టం చేయడానికి తెలుగు విభక్తి ‘కు’ చేర్చాం.
