source:
  edition: WLC
  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: te
  text: 'ఎందుకంటే హెష్బోను నుండి అగ్ని వెలువడింది,

    సీహోను పట్టణం నుండి జ్వాల బయలుదేరింది;

    అది మోయాబులోని ఆరును,

    అర్నోను ఉన్నత స్థలాల అధిపతులను[a][b] మింగివేసింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధిపతులను’ అని అనువదించిన హీబ్రూ పదానికి ‘యజమానులను,’ ‘స్వాధీనదారులను,’ లేదా సందర్భానుసారంగా ‘నివాసులను’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘అర్నోను ఎత్తైన ప్రదేశాల అధిపతులను.’ ఈ హీబ్రూ పదబంధం అర్నోను ప్రాంతంతో సంబంధమున్న ఉన్నత స్థలాలను లేదా సాధారణంగా అక్కడి ఎత్తైన ప్రదేశాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న గీత పాదానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵשׁ יָצְאָה
  choice: అగ్ని వెలువడింది
  rationale: ఒక స్థలం నుండి అగ్ని ఉద్భవించి బయటకు రావడం అనే కావ్యచిత్రాన్ని నిలుపుతుంది.
- source_word: מֵחֶשְׁבּוֹן
  choice: హెష్బోను నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, మూలంలోని విభక్తి సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לֶהָבָה
  choice: జ్వాల
  rationale: ముందటి ‘అగ్ని’కి సమాంతరంగా ఉన్న స్పష్టమైన కావ్యరూపకాన్ని కాపాడుతుంది.
- source_word: מִקִּרְיַת סִיחֹן
  choice: సీహోను పట్టణం నుండి
  rationale: קִרְיָהను ఇక్కడ స్థలనామంగా కాక సాధారణ నామవాచకమైన ‘పట్టణం’గా తీసుకొని, నిర్మాణ సంబంధాన్ని సహజంగా తెలుపుతుంది.
- source_word: אָכְלָה
  choice: మింగివేసింది
  rationale: అగ్ని ‘తినివేయడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజమైన, బలమైన విధంగా నిలుపుతుంది.
- source_word: עָר מוֹאָב
  choice: మోయాబులోని ఆరు
  rationale: עָרను తెలిసిన మోయాబు స్థలనామమైన ‘ఆరు’గా తీసుకొని, అది మోయాబుకు చెందిన ప్రదేశమని తెలుపుతుంది.
- source_word: בַּעֲלֵי
  choice: అధిపతులను
  rationale: ‘యజమానులు/అధిపతులు’ అనే ప్రత్యక్ష అర్థాన్ని, కర్మస్థానాన్ని మరియు ఉన్నత కావ్యశైలిని నిలుపుతుంది; ‘నివాసులు’ అనే వివరణాత్మక అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: בָּמוֹת
  choice: ఉన్నత స్థలాల
  rationale: ఆరాధనా ఎత్తైన స్థలాలు లేదా భౌగోళిక ఎత్తులు అనే రెండు భావాలకు కొంత తెరచి ఉండే విధంగా మూలపదాన్ని సన్నిహితంగా అనువదిస్తుంది.
- source_word: אַרְנֹן
  choice: అర్నోను
  rationale: నది/లోయ ప్రాంతపు పేరును తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: בַּעֲלֵי בָּמוֹת אַרְנֹן అనే పదబంధంలోని వ్యక్తులు మరియు భౌగోళిక స్థలాల సంబంధం
  choice: అర్నోను ఉన్నత స్థలాల అధిపతులను
  alternative: అర్నోను ఉన్నత స్థలాల నివాసులను; లేదా అర్నోను ఎత్తైన ప్రాంతాలను
  rationale: మసొరేటిక్ పాఠంలోని בַּעֲלֵיను విస్మరించకుండా ప్రత్యక్షంగా అనువదిస్తూ, ‘ఉన్నత స్థలాలు’ ఆరాధనా ప్రదేశాలా లేక భౌగోళిక ఎత్తులా అనే నిజమైన అనిశ్చితిని పాదటిప్పణుల్లో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మక సమాంతర నిర్మాణాన్ని పాదవిభజనతో నిలిపిన గౌరవప్రదమైన శైలి. స్థలనామాలకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణ ధోరణిని అనుసరించబడింది; అస్పష్టతలను ప్రధాన పాఠంలో అతిగా వివరణ చేయకుండా పాదటిప్పణుల్లో ఉంచబడింది.
