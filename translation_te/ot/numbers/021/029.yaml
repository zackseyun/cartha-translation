  to: మోయాబూ, నీకు అయ్యో! కెమోషు ప్రజలారా, మీరు నాశనమయ్యారు! అతడు తన కుమారులు పారిపోవలసినవారిగా చేసి, తన కుమార్తెలను బందీలుగా అమోరీయుల రాజైన సీహోనుకు అప్పగించాడు.[a]
