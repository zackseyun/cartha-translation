id: NUM.21.29
reference: Numbers 21:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: te
  text: మోయాబూ, నీకు అయ్యో! కెమోషు ప్రజలారా, మీరు నాశనమయ్యారు! అతడు తన కుమారులు పారిపోవలసినవారిగా చేసి, తన కుమార్తెలను బందీలుగా అమోరీయుల రాజైన సీహోనుకు అప్పగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఈ ప్రత్యయాలు కెమోషును కాక మోయాబును సూచిస్తున్నట్లయితే: “దాని కుమారులు పారిపోవలసినవారిగా, దాని కుమార్తెలు బందీలుగా.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: నీకు అయ్యో
  rationale: విపత్తును ప్రకటించే విలాపోక్తి; సంబోధనలోని తీవ్రతను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: אָבַדְתָּ
  choice: మీరు నాశనమయ్యారు
  rationale: సంభవించిన ఘోర వినాశాన్ని సూచించే పరిపూర్ణ క్రియను, 'కెమోషు ప్రజలారా' అనే సమూహ సంబోధనకు సహజంగా అనుసంధానిస్తుంది.
- source_word: עַם כְּמוֹשׁ
  choice: కెమోషు ప్రజలారా
  rationale: కెమోషుతో గుర్తింపబడిన ప్రజలను సూచించే నిర్మాణాన్ని ప్రత్యక్ష సంబోధనగా అందిస్తుంది.
- source_word: נָתַן
  choice: అప్పగించాడు
  rationale: మూలార్థమైన 'ఇచ్చాడు'ను, శత్రు రాజు అధీనానికి ఇచ్చివేయబడిన సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది; ఫలితస్థితులను కూడా మోయగలదు.
- source_word: בָּנָיו פְּלֵיטִם
  choice: తన కుమారులను పారిపోయినవారిగా
  rationale: పుంలింగ ఏకవచన ప్రత్యయాన్ని నిలిపి, פְּלֵיטִם లోని పారిపోవడం/తప్పించుకోవడం అనే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: తన కుమార్తెలను బందీలుగా
  rationale: మొదటి సమాంతర పదబంధానికి అనుగుణంగా, చెరలో ఉన్న స్థితిని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: అమోరీయుల రాజైన సీహోనుకు
  rationale: లామెద్ సూచించే గమ్యం/గ్రహీతను, సీహోను గురించిన రాజపదవిని సహజ తెలుగు క్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: “తన కుమారులు,” “తన కుమార్తెలు”లోని మూడవ పురుష ఏకవచన ప్రత్యయాల సూచ్యం
  choice: కెమోషును సూచిస్తున్నట్లుగా “తన” అని అనువదించడం
  alternative: మోయాబును సమూహంగా సూచిస్తూ “దాని కుమారులు, దాని కుమార్తెలు” అని అనువదించడం
  rationale: సమీప పూర్వపదం కెమోషు కావడం వల్ల వ్యక్తీకరించబడిన దేవునికి ఈ ప్రత్యయాలను అన్వయించడం సహజం. అయితే మోయాబును సూచించే అవకాశం నిజమైన పాఠ్య సందిగ్ధతగా పాదటీకలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కావ్యాత్మక శాపవాక్యపు గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. ఏకవచన మోయాబు సంబోధన నుంచి సమూహమైన కెమోషు ప్రజల సంబోధనకు జరిగే మార్పును తెలుగు వ్యాకరణానికి అనుగుణంగా చూపింది.
