id: NUM.21.9
reference: Numbers 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: te
  text: అప్పుడు మోషే కంచుతో ఒక సర్పాన్ని చేసి, దాన్ని ఒక స్తంభం మీద ఉంచాడు.[a] సర్పం ఎవరినైనా కరిచినప్పుడు, ఆ వ్యక్తి కంచు సర్పాన్ని చూస్తే బతికేవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కంచు’ అని అనువదించిన హిబ్రీ పదం రాగిని లేదా కంచును సూచించవచ్చు. ‘స్తంభం’ అనే పదానికి ‘ధ్వజస్తంభం’ లేదా ‘పతాకం’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ సంఘటనను యోహాను 3:14–15లో ప్రతీకాత్మకంగా ప్రస్తావించారు.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: సర్పం
  rationale: సందర్భంలోని నిజమైన పామునూ, తయారు చేసిన దాని ఆకృతినీ ఒకే పదంతో సూచిస్తూ, బైబిలు కథనానికి తగిన గౌరవప్రదమైన సాహిత్య స్వరాన్ని నిలుపుతుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ లోహపదం రాగి లేదా కంచును సూచించగలదు; లోహంతో చేసిన వస్తువుల సందర్భంలో సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘కంచు’ ఎంచుకోబడింది.
- source_word: הַנֵּס
  choice: స్తంభం
  rationale: ఇక్కడ సర్పాన్ని పైకి ఉంచిన నిటారైన ఆధారాన్ని సూచిస్తుంది. మూలపదానికి ‘ధ్వజస్తంభం/పతాకం’ అనే అర్థపరిధి కూడా ఉన్నప్పటికీ, సందర్భంలో ‘స్తంభం’ సహజంగా ఉంది.
- source_word: וְהָיָה
  choice: కరిచినప్పుడు
  rationale: ఈ రూపం తరువాతి పరిస్థితిని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యేకంగా ‘అది జరిగేది’ అని చేర్చకుండా కాలవాచక ఉపవాక్యంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: సర్పం ఎవరినైనా కరిచినప్పుడు
  rationale: మూలంలోని אִישׁ వ్యాకరణపరంగా పురుష ఏకవచనమైనా, ఇక్కడ కరవబడిన ఏ వ్యక్తినైనా ప్రతినిధిగా సూచిస్తుంది; తెలుగులో ‘ఎవరినైనా’ ఆ సాధారణ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהִבִּיט אֶל
  choice: వైపు చూస్తే
  rationale: హెబ్రీయులోని సాధారణ దృష్టిచర్యను తెలియజేస్తుంది; తరువాతి ధార్మిక ప్రతీకార్థాన్ని ప్రధాన వాక్యంలో ముందుగానే చొప్పించదు.
- source_word: וָחָי
  choice: బతికేవాడు
  rationale: పాము కరవబడిన వ్యక్తి చూసిన ప్రతిసారీ కలిగే ఫలితాన్ని తెలుగు అలవాటుసూచక భూతకాల రూపంలో సహజంగా వ్యక్తం చేస్తుంది; ‘రక్షించబడేవాడు’ వంటి వ్యాఖ్యాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: אִישׁ లోని ప్రతినిధి పురుష ఏకవచనం
  choice: ఎవరినైనా / ఆ వ్యక్తి
  alternative: ఒక పురుషుణ్ణి / అతడు
  rationale: మూలరూపం పురుష ఏకవచనమైనా, సందర్భంలో అది పాము కరవబడిన ఏ వ్యక్తికైనా వర్తిస్తుంది. ఆధునిక తెలుగులో సాధారణ సూచనను సహజంగా వ్యక్తం చేయడం మూలంలోని ప్రయోజనాన్ని కాపాడుతుంది.
- issue: ‘చూడడం’లో తరువాతి ప్రతీకార్థాన్ని ముందుగానే చేర్చే అవకాశం
  choice: వైపు చూస్తే
  alternative: ఆశతో చూస్తే / విశ్వాసంతో చూస్తే
  rationale: యోహాను 3:14–15 ఈ సంఘటనను తరువాత ప్రతీకాత్మకంగా వినియోగిస్తుంది; అయితే సంఖ్యాకాండము వచనంలోని హిబ్రీ క్రియ విశ్వాసం లేదా ఆశను స్పష్టంగా జోడించదు. అందువల్ల ప్రధాన పాఠం తటస్థంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని పునరుక్తి—సర్పం, కంచు సర్పం—నిలుపబడింది. ‘ఎవరినైనా/ఆ వ్యక్తి’ ద్వారా ప్రతినిధి భావం స్పష్టమైంది; తరువాతి క్రైస్తవ ప్రతీకార్థం ప్రధాన పాఠంలో కాక పాదటిప్పణిలో ఉంచబడింది.
