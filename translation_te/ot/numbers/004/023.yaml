  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקֹ֣ד אוֹתָ֑/ם כָּל הַ/בָּא֙ לִ/צְבֹ֣א צָבָ֔א לַ/עֲבֹ֥ד עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: te
  text: ముప్పై సంవత్సరాల వయసు నుండి యాభై సంవత్సరాల వయసు వరకు, సమావేశ గుడారంలో సేవా విధి నిర్వహించడానికి[a], పని చేయడానికి వచ్చే వారందరినీ నీవు లెక్కించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విధి నిర్వహించడానికి”; హీబ్రూ పదబంధం క్రమబద్ధమైన గుడారపు సేవను సూచించడానికి సైనిక సేవకు సంబంధించిన భాషను రూపకంగా వాడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: ముప్పై ఏళ్ల వయసు మొదలుకొని యాభై ఏళ్ల వయసు వరకు
  rationale: హీబ్రూ వయస్సు-పరిధి నుడికారాన్ని అక్షరార్థమైన ‘కుమారుడు’ అనే పదం లేకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దిగువ, ఎగువ పరిమితులు రెండింటినీ నిలుపుతుంది.
- source_word: תִּפְקֹד אֹתָם
  choice: వారిని లెక్కించాలి
  rationale: జనగణన/పరిపాలనా సందర్భంలో פקד యొక్క ‘లెక్కించు, నమోదు చేయు’ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: כָּל הַבָּא
  choice: వచ్చే ప్రతి ఒక్కరినీ
  rationale: సర్వనామసదృశంగా వాడిన participle యొక్క పంపిణీ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לִצְבֹא צָבָא
  choice: సేవాబాధ్యతను నిర్వర్తించడానికి
  rationale: צבא పదబంధంలోని వ్యవస్థీకృత విధి/దళసేవ ఛాయను నిలుపుతూ, ఈ సందర్భం యుద్ధం కాదని స్పష్టం చేస్తుంది.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: పని చేయడానికి
  rationale: సమాన మూలపదాల నిర్మాణాన్ని తెలుగులో అసహజంగా పునరావృతం చేయకుండా, అప్పగించిన పనిని చేయడం అనే భావాన్ని అందిస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారంలో
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి వాడిన స్థిర నామాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: צבא అనే సైనిక-సేవ పదజాలాన్ని ప్రత్యక్ష యుద్ధభాషలో అనువదించాలా?
  choice: ఆరాధనా సంబంధమైన వ్యవస్థీకృత ‘సేవాబాధ్యత’గా అనువదించడం
  alternative: సైనిక విధి చేయడానికి / యుద్ధం చేయడానికి
  rationale: సంఖ్యాకాండము 4లో లేవీయులకు సమావేశపు గుడారం వద్ద అప్పగించిన సేవ గురించే ఉంది. కాబట్టి అసలు పదంలోని క్రమబద్ధమైన విధి ఛాయను నిలుపుతూ నిజమైన పోరాటాన్ని సూచించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన శైలి. ‘సేవాబాధ్యత’ ద్వారా צבא యొక్క వ్యవస్థీకృత విధి భావం, ‘పని’ ద్వారా עבד యొక్క కార్యభావం వేరుగా నిలుపబడ్డాయి.
