source:
  edition: WLC
  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: te
  text: అప్పుడు వారు పరిశుద్ధస్థలంలో సేవ చేయడానికి ఉపయోగించే సేవా సామగ్రినంతటినీ తీసుకొని, నీలి వస్త్రంలో ఉంచాలి. వాటిని తహషు తోలుతో చేసిన ఆవరణంతో[a] కప్పి, మోసే దండె మీద[b] ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తహషు’ అనే హీబ్రూ పదం ఏ జంతువును లేదా ఏ రకమైన తోలును సూచిస్తుందో ఖచ్చితంగా తెలియదు; ఇది ఒక ప్రత్యేక జంతువు తోలు గానీ, నాణ్యమైన లేదా మన్నికైన తోలు రకం గానీ కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దండె మీద.’ హీబ్రూ మూలంలో ‘దండె/కడ్డీ’ అనే పదం ఏకవచనంలో ఉంది; అది మోసే ఏర్పాటు మొత్తాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: అప్పుడు వారు ... తీసుకొని
  rationale: క్రమంగా ఇచ్చిన ఆచార నిర్దేశాల్లో వావ్‌తో కూడిన క్రియ తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: సేవా సామగ్రినంతటినీ
  rationale: כְּלִי ఇక్కడ పాత్రలు మాత్రమే కాక పరిశుద్ధ సేవలో ఉపయోగించే వివిధ ఉపకరణాలను సూచిస్తుంది; ‘సామగ్రి’ ఆ విస్తృత అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם בַּקֹּדֶשׁ
  choice: పరిశుద్ధస్థలంలో సేవ చేయడానికి ఉపయోగించే
  rationale: שרת అనే ఆరాధనా-సేవ భావాన్ని ‘సేవ చేయడానికి’గా, בַּקֹּדֶשׁ‌ను నిర్దిష్ట అంతర్గది అని అతిగా పరిమితం చేయకుండా ‘పరిశుద్ధస్థలంలో’గా అనువదించింది.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: నీలి వస్త్రం
  rationale: ప్యాకింగ్ సందర్భంలో בֶּגֶד‌కు ‘వస్త్రం’ సహజం; תְּכֵלֶת సూచించే నీలి లేదా నీలి-ఊదా రంగును సంక్షిప్తంగా ‘నీలి’గా ఇచ్చింది.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: తహషు తోలుతో చేసిన కప్పు
  rationale: תָּחַשׁ సూచించే జంతువు లేదా తోలు రకం అనిశ్చితం. ఊహాత్మక జంతు పేరును లేదా ‘నాణ్యమైన’ వంటి మూలంలో స్పష్టంగా లేని గుణాన్ని ఎంచుకోకుండా పదాన్ని లిప్యంతరీకరించి, అనిశ్చితిని పాదసూచికలో వివరించింది.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: మోసే దండె మీద ఉంచాలి
  rationale: הַמּוֹט ఏకవచనంలోని దండె లేదా కడ్డీని సూచిస్తుంది. ‘చట్రం’ అని విస్తరించకుండా మూలంలోని ఏకవచనాన్ని నిలిపి, రవాణా పనిని ‘మోసే’ అనే పదంతో స్పష్టం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞాత్మక శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; చర్యల క్రమం మారలేదు. మూలపదాల అనిశ్చితిని ప్రధాన పాఠంలో ఊహతో పరిష్కరించకుండా పాదసూచికల్లో నిలిపాం.
