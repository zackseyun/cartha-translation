id: NUM.4.8
reference: Numbers 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: te
  text: వాటి మీద ఎర్రని నూలుతో చేసిన వస్త్రాన్ని పరచాలి. దానిని తహషు[a] చర్మపు కప్పుతో కప్పి, దాని మోయు కర్రలను అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: తహషు. ఇది ఏ జంతువునో లేదా ఏ పదార్థాన్నో ఖచ్చితంగా తెలియదు. సంప్రదాయ అనువాదాల్లో దీనిని ‘బాడ్జర్ చర్మం,’ ‘సముద్ర జంతువు చర్మం,’ లేదా సాధారణంగా ‘మంచి తోలు’ అని అనువదించారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: వాటి మీద ... పరచాలి
  rationale: క్రియ ఆ పవిత్ర వస్తువులపై వస్త్రాన్ని పరచడాన్ని సూచిస్తుంది; బహువచన ప్రత్యయం ముందరి వచనంలో పేర్కొన్న వస్తువులను సూచిస్తుంది.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలుతో చేసిన వస్త్రం
  rationale: בגד ఇక్కడ ధరించే బట్టకన్నా కప్పడానికి ఉపయోగించే వస్త్రం. תולעת שני ప్రకాశవంతమైన ఎర్ర రంగుతో రంగువేసిన నూలు లేదా దానితో చేసిన వస్త్రాన్ని సూచించే సంప్రదాయ పదబంధం; తెలుగు పాఠకునికి సహజంగా ఉండేలా రెండింటినీ కలిపి అనువదించాం.
- source_word: וְכִסּוּ אֹתוֹ
  choice: దానిని ... కప్పాలి
  rationale: హీబ్రూలో బహువచనమైన ‘వాటి మీద’ నుంచి ఏకవచన కర్మకు మార్పు ఉంది; ఇది బల్లను ఒక సమగ్ర వస్తువుగా సూచించవచ్చు. ఆ సంఖ్యామార్పును అనువాదంలో నిలిపాం.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: తహషు చర్మపు కప్పుతో
  rationale: מכסה ఒక పైకప్పు పొరను సూచిస్తుంది. תחשׁ ఏ జంతువునో లేదా ఏ రకమైన పదార్థాన్నో ఖచ్చితంగా గుర్తించడం సాధ్యం కానందున ఊహాత్మక జంతుపేరును ఇవ్వకుండా హీబ్రూ పదాన్ని లిప్యంతరీకరించాం.
- source_word: וְשָׂמוּ אֶת־בַּדָּיו
  choice: దాని మోతకర్రలను అమర్చాలి
  rationale: בדים పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలు. שׂים అనే సాధారణ ‘పెట్టు/ఉంచు’ క్రియకు ఈ రవాణా సందర్భంలో ‘అమర్చాలి’ సహజమైన తెలుగు సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సంబంధమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. విధి సూచనకు ‘పరచాలి/కప్పాలి/అమర్చాలి’ రూపాలను ఉపయోగించాం. అనిశ్చితమైన תחשׁ పదాన్ని ‘తహషు’గా నిలిపి, వివరణను పాదసూచికలో ఇచ్చాం.
