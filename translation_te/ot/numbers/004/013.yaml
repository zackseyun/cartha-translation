source:
  edition: WLC
  text: וְ/דִשְּׁנ֖וּ אֶת הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֔י/ו בֶּ֖גֶד אַרְגָּמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: te
  text: తరువాత వారు బలిపీఠం మీదున్న బూడిదను తొలగించి, దాని మీద ఊదా రంగు వస్త్రాన్ని పరచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలిపీఠాన్ని శుభ్రపరచి,’ లేదా ‘బలిపీఠం మీదున్న కొవ్వుతో కూడిన బూడిదను తొలగించి.’ హీబ్రూ క్రియ బలుల సందర్భంలో బలిపీఠంపై మిగిలిన బూడిద అవశేషాన్ని ప్రత్యేకంగా తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: బూడిదను తొలగించి
  rationale: దశేన్ అనే క్రియ పియేల్ రూపంలో బలిపీఠంపై యజ్ఞాల వల్ల మిగిలిన బూడిద లేదా కొవ్వుతో కూడిన అవశేషాన్ని తొలగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బూడిదను తొలగించడం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: గుడారపు ఆరాధన, బలి సందర్భాల్లో מִזְבֵּחַకు ప్రామాణికమైన తెలుగు పదం.
- source_word: וּפָרְשׂוּ
  choice: పరచాలి
  rationale: פרשׂకు విప్పి పరచడం అనే అర్థం ఉంది; ఒక వస్త్రాన్ని వస్తువుమీద కప్పే ఈ సందర్భంలో ‘పరచాలి’ సహజంగా ఉంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: עַל మరియు సర్వనామ ప్రత్యయం వస్త్రాన్ని బలిపీఠం మీద ఉంచి కప్పడాన్ని సూచిస్తున్నాయి.
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: בגד సాధారణంగా దుస్తి అని అర్థమిచ్చినా, ఇక్కడ పవిత్ర సామగ్రిని కప్పడానికి ఉపయోగించే బట్టను సూచిస్తుంది; ‘వస్త్రం’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: אַרְגָּמָן
  choice: ఊదారంగు
  rationale: אַרְגָּמָן ఊదా రంగు వేసిన పదార్థాన్ని సూచిస్తుంది. בֶּגֶד వస్త్ర భావాన్ని ఇప్పటికే ఇస్తున్నందున ‘ఊదారంగు వస్త్రం’ స్పష్టమైన అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ ఆజ్ఞాత్మక భవిష్యత్ భావాన్ని తెలుగులో ‘తొలగించి ... పరచాలి’ అనే నిర్మాణంతో వ్యక్తం చేశాం. మూలంలోని కర్మకాండ సంబంధిత ప్రత్యేకతను పాదసూచికలో నిలిపాం.
