translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పాత్రల నాలుగు వేర్వేరు వర్గాలు నిలుపబడ్డాయి. అడుగుగమనిక సూచికలు అవి వివరించే పదబంధాల వెంటనే ఉంచబడ్డాయి.
