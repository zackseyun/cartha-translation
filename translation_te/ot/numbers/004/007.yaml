  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: te
  text: సన్నిధి బల్లపై[a] వారు నీలి వస్త్రాన్ని పరచాలి. దానిమీద పళ్లెములను, కప్పులను, గిన్నెలను, పానార్పణకు ఉపయోగించే కూజాలను ఉంచాలి. బల్లమీద నిత్యం ఉంచే రొట్టె[b] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “సన్నిధి రొట్టెల బల్ల” అని కూడా అనువదిస్తారు. హీబ్రూలో అక్షరార్థంగా “సన్నిధి బల్ల” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నిత్య రొట్టె.” ఇది యెహోవా సన్నిధిలో బల్లపై క్రమంగా ఉంచే రొట్టెను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: సన్నిధి బల్ల
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘ముఖము/సన్నిధి యొక్క బల్ల’ అనే భావం ఉంది. ఆరాధన సందర్భంలోని దేవుని సన్నిధి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִפְרְשׂוּ
  choice: వారు ... పరచాలి
  rationale: బల్లపై వస్త్రాన్ని విప్పి కప్పే చర్యను సహజంగా వ్యక్తం చేస్తుంది; ‘కప్పాలి’ అని అనువదించి క్రియార్థాన్ని అనవసరంగా కుదించదు.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: నీలి వస్త్రం
  rationale: ప్రత్యక్ష గుడార సందర్భంలో వాడే ప్రత్యేక నీలి లేదా ఊదా-నీలి వర్ణాన్ని సూచిస్తుంది. ఖచ్చితమైన ఛాయను అతిగా నిర్ణయించకుండా సులభంగా అర్థమయ్యే రూపం.
- source_word: הַקְּעָרֹת
  choice: పళ్లెములు
  rationale: బల్లపై ఉపయోగించే చదునైన వడ్డించే పాత్రలకు తగిన ఆధునిక తెలుగు పదం.
- source_word: הַכַּפֹּת
  choice: కప్పులు
  rationale: ఈ ఆరాధనా పాత్రల ఆకృతి ఖచ్చితంగా స్పష్టం కానందున, అతిగా నిర్దిష్టతను చేర్చకుండా బల్ల పాత్రగా సులభంగా అర్థమయ్యే పదం ఎంచుకోబడింది.
- source_word: הַמְּנַקִּיֹּת
  choice: గిన్నెలు
  rationale: అర్థనిర్ణయం కష్టమైన ఈ పాత్రపేరుకు ప్రాచీనమైన లేదా అస్పష్టమైన పదం బదులు విస్తృతార్థకమైన సహజ తెలుగు పదం వాడబడింది.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: పానార్పణకు ఉపయోగించే కూజాలు
  rationale: ఈ పాత్రలు ద్రవ పానార్పణను పోయడానికి సంబంధించినవని స్పష్టపరుస్తూ, ‘కూజాలు’ ద్వారా పోయే పాత్రల భావాన్ని అందిస్తుంది.
- source_word: לֶחֶם הַתָּמִיד
  choice: నిత్యం ఉంచే రొట్టె
  rationale: ఈ రొట్టె బల్లపై నిరంతరం లేదా క్రమంగా ఉంచబడేదనే ఆరాధనా భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘నిత్య రొట్టె’ అనే అసహజ సంక్షిప్త రూపాన్ని నివారిస్తుంది.
- source_word: עָלָיו יִהְיֶה
  choice: దానిమీద ఉండాలి
  rationale: రొట్టె బల్లమీద ఉండాలనే సరళమైన వాక్యార్థాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘అలాగే ఉండిపోవాలి’ వంటి అదనపు భావాన్ని చేర్చదు.
