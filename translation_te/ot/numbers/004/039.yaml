revisions:
- from: ముప్పై ఏళ్ల వయసు మొదలుకొని యాభై ఏళ్ల వయసు వరకు, ప్రత్యక్ష గుడారంలో పని చేయడానికి సేవలో చేరే ప్రతి ఒక్కరినీ—
  to: ముప్పై ఏళ్ల వయసు నుంచీ యాభై ఏళ్ల వయసు వరకు, సేవా విధిలో చేరడానికి, సమావేశ గుడారంలో పని చేయడానికి వచ్చే వారందరూ—
  rationale: The revision corrects the Telugu case error, renders the sanctuary designation according to its Hebrew sense, and preserves the distinction between organized service (לַצָּבָא) and work (לַעֲבֹדָה). No footnote is required, since the resulting Telugu is direct and unambiguous.
  reviewer_model: gpt-5.6-terra
