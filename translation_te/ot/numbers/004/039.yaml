  yaml_path: translation/ot/numbers/004/039.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: te
  text: ముప్పై ఏళ్ల వయసు నుంచీ యాభై ఏళ్ల వయసు వరకు, సేవా విధిలో చేరడానికి, సమావేశ గుడారంలో పని చేయడానికి వచ్చే వారందరూ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: ముప్పై ఏళ్ల వయసు మొదలుకొని
  rationale: హీబ్రూ వయోపరిమితి నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో కనిష్ఠ వయసుగా వ్యక్తపరుస్తుంది.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: యాభై ఏళ్ల వయసు వరకు
  rationale: వయోపరిమితి యొక్క గరిష్ఠ హద్దును స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: సేవలో చేరే ప్రతి ఒక్కరినీ
  rationale: בוא అనే పదంలోని రావడం/ప్రవేశించడం భావాన్నీ, צבא ఇక్కడ సూచించే వ్యవస్థీకృత లేవీయ సేవనూ కలిపి సహజంగా వ్యక్తపరుస్తుంది; సైనిక భావాన్ని అనవసరంగా రుద్దదు.
- source_word: לַעֲבֹדָה
  choice: పని చేయడానికి
  rationale: עֲבֹדָה అనే పని/సేవ భావాన్ని ముందున్న צבאకు వేరుగా నిలుపుతూ ప్రయోజనార్థక నిర్మాణాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵדకు తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన, గౌరవప్రదమైన సమానార్థక పదబంధం; בְ అనే స్థానసూచక అవ్యయాన్ని ‘లో’తో ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున ముగింపులో దీర్ఘ విరామచిహ్నం ఉంచబడింది. మూలంలో ఉన్న రెండు సేవాసంబంధ పదాల మధ్య తేడాను ‘సేవలో చేరే’ మరియు ‘పని చేయడానికి’ అనే రూపాలతో నిలిపాం.
