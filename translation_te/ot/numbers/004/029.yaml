translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞను నేరుగా మరియు గౌరవప్రదంగా వ్యక్తపరిచే శైలి. ‘పితృగృహాలు’ అనే వంశావళి పదాన్ని మూలంలోని తండ్రి వంశరేఖ ఆధారిత సమూహ నిర్మాణాన్ని కాపాడేందుకు ఉపయోగించాం. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
