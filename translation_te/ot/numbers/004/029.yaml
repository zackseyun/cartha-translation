  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: te
  text: మెరారి కుమారులను[a] వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం లెక్కించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెరారి వంశస్థులను’ లేదా ‘మెరారీయులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: మెరారి కుమారులను
  rationale: వ్యక్తి పేరుతో వచ్చిన בְּנֵי అనే పదబంధం అక్షరార్థంగా ‘కుమారులు’ అని ఉన్నప్పటికీ, ఈ జనగణన సందర్భంలో మెరారి వంశస్థులను సూచిస్తుంది. మూలంలోని కుటుంబ సంబంధ రూపాన్ని నిలుపుతూ సహజమైన తెలుగులో ‘మెరారి కుమారులు’ అని అనువదించబడింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మూలంలోని מִשְׁפָּחָה గోత్రంలోని బంధుత్వ ఆధారిత ఉపవిభాగాన్ని సూచిస్తుంది. తెలుగు బైబిలు-వంశావళి సందర్భంలో ‘వంశాలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: ఇది తండ్రి వంశరేఖ ఆధారంగా ఏర్పడిన కుటుంబ సమూహాలను సూచించే ఇశ్రాయేలీయ వంశావళి పదబంధం. ‘పితృగృహాలు’ మూలంలోని సామాజిక నిర్మాణాన్ని ‘కుటుంబాలు’గా సరళీకరించకుండా నిలుపుతుంది.
- source_word: תִּפְקֹד
  choice: లెక్కించు
  rationale: ఈ జనగణన సందర్భంలో פקד అంటే వ్యక్తులను లెక్కించి నమోదు చేయడం. ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజంగా ‘లెక్కించు’ అని వ్యక్తపరచవచ్చు.
- source_word: אֹתָם
  choice: వారిని
  rationale: మెరారి కుమారులను సూచించే ప్రత్యక్ష కర్మ సర్వనామం; తెలుగులో కర్మ విభక్తి ప్రధాన నామపదబంధంలోనే వ్యక్తమైంది.
