id: NUM.4.19
reference: Numbers 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: te
  text: 'అయితే, వారు అత్యంత పరిశుద్ధమైన వస్తువుల[a] దగ్గరకు వచ్చినప్పుడు బ్రతికి, చనిపోకుండా ఉండేలా వారి కోసం ఇలా చేయండి: అహరోను, అతని కుమారులు వచ్చి, ఒక్కొక్క మనిషిని[b] అతని సేవకు, అతడు మోయవలసిన భారానికి నియమించాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధాతిపరిశుద్ధ స్థలం” లేదా “అతి పరిశుద్ధ స్థలం.” అయితే ఇక్కడి సందర్భం మోయవలసిన పవిత్ర వస్తువుల గురించి కాబట్టి, ఈ మాట అత్యంత పరిశుద్ధమైన వస్తువులను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో “మనిషి మనిషి” అని ఉంది; ఇది ప్రతి పురుషునికి అతని సొంత సేవను, మోయవలసిన భారాన్ని విడివిడిగా నియమించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: వారి కోసం ఇలా చేయండి
  rationale: עשה with ל is benefactive in this context. This rendering is natural Telugu and presents the demonstrative as the content of the command.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: బ్రతికి, చనిపోకుండా ఉండేలా
  rationale: The coordinated clauses express the intended result of the command; the Telugu purposive construction conveys that relation clearly.
- source_word: בְּגִשְׁתָּם
  choice: దగ్గరకు వచ్చినప్పుడు
  rationale: The infinitive construct with בְּ is temporal here, while దగ్గరకు రావడం retains the cultic sense of approaching.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: అత్యంత పరిశుద్ధమైన వస్తువులు
  rationale: In the transport context, this most plausibly denotes the supremely sacred objects rather than only the inner sanctuary. A footnote preserves the spatial alternative.
- source_word: יָבֹאוּ
  choice: వచ్చి
  rationale: The imperfect has prescriptive force; within the coordinated Telugu sentence, వచ్చి naturally leads into the main directive నియమించాలి.
- source_word: וְשָׂמוּ אוֹתָם
  choice: నియమించాలి
  rationale: Literally 'set/place them,' the phrase here means assigning the Kohathites to their respective duties and loads.
- source_word: אִישׁ אִישׁ
  choice: ఒక్కొక్క పురుషుణ్ణి
  rationale: The repeated noun is distributive, and the masculine reference is appropriate because the immediate context concerns male Levites.
- source_word: עַל עֲבֹדָתוֹ
  choice: అతని సేవకు
  rationale: עֲבֹדָה denotes each Levite's assigned sacred service or duty.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: అతడు మోయవలసిన భారానికి
  rationale: מַשָּׂא refers concretely to the load assigned for transport; the expanded Telugu form makes the carrying sense explicit without changing the referent.
theological_decisions:
- issue: Referent of קֹדֶשׁ הַקֳּדָשִׁים
  choice: అత్యంత పరిశుద్ధమైన వస్తువులు
  alternative: అతి పరిశుద్ధ స్థలం / పరిశుద్ధాతిపరిశుద్ధ స్థలం
  rationale: The surrounding instructions concern covered sacred furnishings that the Kohathites must carry. The object-oriented reading therefore fits the immediate context, while the traditional spatial reading remains possible and is retained in a footnote.
- issue: Gender and distributive force of אִישׁ אִישׁ
  choice: ఒక్కొక్క పురుషుణ్ణి
  alternative: ఒక్కొక్కరిని
  rationale: The Hebrew explicitly uses the masculine noun in reference to the male Kohathites, and its repetition assigns service and load individually.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞాత్మక శైలి వాడబడింది. “బ్రతికి, చనిపోకుండా” అనే జంట మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతుంది. “అతడు మోయవలసిన భారం” అనేది రవాణా సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది.
