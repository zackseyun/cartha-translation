    rationale: וְזֹאת introduces an instructional transition with a contrastive nuance in context; “అయితే” suitably preserves this.
  - severity: low
    issue: “ఒక్కొక్క పురుషుణ్ణి” is unnatural in modern standard Telugu.
    rationale: Although the referents are male Levites, “ఒక్కొక్క మనిషిని” is the more natural Telugu distributive expression. The footnote preserves the Hebrew masculine repetition and its contextual reference.
  - severity: low
    issue: Footnote a conflates two alternative spatial renderings.
    rationale: “పరిశుద్ధాతిపరిశుద్ధ స్థలం” and “అతి పరిశుద్ధ స్థలం” should be offered as alternatives, rather than defining one as the other.
