source:
  edition: WLC
  text: אַל תַּכְרִ֕יתוּ אֶת שֵׁ֖בֶט מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י מִ/תּ֖וֹךְ הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: te
  text: కహాతీయుల కుటుంబాల గోత్రాన్ని లేవీయులలోనుండి నిర్మూలం చేయకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కహాతీయుల కుటుంబాల గోత్రం లేవీయులలోనుండి అంతరించిపోవడానికి కారణం కాకండి.” హీబ్రూ క్రియకు “తొలగించు,” “నిర్మూలం చేయు,” లేదా “నాశనం చేయు” అనే అర్థాలు రావచ్చు; “కుటుంబాలు”ను “వంశాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: చూడండి ... పోకుండా
  rationale: నిషేధార్థక ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: תַּכְרִיתוּ
  choice: అంతరించిపోకుండా చూడండి
  rationale: హిఫిల్ రూపంలోని ‘తొలగించడానికి/నాశనం కావడానికి కారణమవడం’ అనే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది; వారి అంతానికి బాధ్యులు కావద్దనే హెచ్చరికను వ్యక్తం చేస్తుంది.
- source_word: שֵׁבֶט
  choice: గోత్రం
  rationale: వంశావళి సందర్భంలో ఒక గోత్ర సంబంధ సమూహాన్ని సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: מִשְׁפְּחֹת
  choice: వంశాల
  rationale: కహాతీయ సమూహంలోని కుటుంబ లేదా వంశ విభాగాలను సూచిస్తుంది; ‘కుటుంబాల’ అనే అనువాదం కూడా సాధ్యమే.
- source_word: הַקְּהָתִי
  choice: కహాతీయుల
  rationale: హీబ్రూ ఏకవచన సమూహవాచక రూపాన్ని తెలుగులో సహజమైన బహువచన సమూహార్థంతో అందిస్తుంది.
- source_word: מִתּוֹךְ
  choice: మధ్య నుండి
  rationale: ఒక పెద్ద సమూహం లోపలి నుండి వేరైపోవడం లేదా తొలగిపోవడం అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయుల
  rationale: గోత్రనామానికి ప్రామాణిక తెలుగు రూపం; కహాతీయులు లేవీయులలోని ఒక ఉపసమూహమని తెలియజేస్తుంది.
theological_decisions:
- issue: కహాతీయుల గతి గురించి నిషేధం యొక్క భావం
  choice: కహాతీయుల వంశ సమూహం లేవీయుల మధ్య నుండి అంతరించిపోవడానికి కారణం కావద్దనే హెచ్చరిక
  alternative: కహాతీయుల వంశాన్ని నాశనం చేయవద్దనే సాధారణ ఆజ్ఞ
  rationale: ఈ వచనం వారి అంతానికి దారితీసే విధానాన్ని స్వయంగా పేర్కొనదు; తరువాతి సందర్భం పరిశుద్ధ వస్తువుల విషయంలో తప్పిదం మరణానికి దారితీయగలదని వివరిస్తుంది. అందువల్ల ఆ వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా విస్తృత భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అంతరించిపోకుండా చూడండి’ కారణకర్తృక హెచ్చరికను తెలుగులో సులభంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ ప్రత్యక్ష రూపాన్ని పాదటిప్పణిలో ఉంచాం.
