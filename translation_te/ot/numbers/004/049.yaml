source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: te
  text: 'యాహ్వే ఆజ్ఞ[a] ప్రకారం మోషే ద్వారా[b] వారిని లెక్కించారు—ప్రతి వ్యక్తి తన సేవకూ తాను మోయవలసిన భారానికీ అనుగుణంగా. ప్రతి వ్యక్తికి అప్పగించిన బాధ్యత[c] కూడా యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారమే ఉంది.


    [a] అక్షరార్థంగా, “యాహ్వే నోటి మాట ప్రకారం.”


    [b] అక్షరార్థంగా, “మోషే చేతి ద్వారా.” ఇది మోషే మాధ్యమంగా కార్యం జరిగిందని తెలిపే హీబ్రూ నుడికారం.


    [c] ఇక్కడి హీబ్రూ పదాన్ని “నియామకం,” “పర్యవేక్షణ” లేదా “అప్పగించిన పని” అని కూడా అర్థం చేసుకోవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే నోటి మాట ప్రకారం.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మోషే చేతి ద్వారా.” ఇది మోషే మాధ్యమంగా కార్యం జరిగిందని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హీబ్రూ పదాన్ని “నియామకం,” “పర్యవేక్షణ” లేదా “అప్పగించిన పని” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: యాహ్వే ఆజ్ఞ ప్రకారం
  rationale: עַל־פִּי అనే నుడికారం అక్షరార్థంగా ‘నోటి మాట ప్రకారం’ అని ఉన్నా, సందర్భంలో ఆజ్ఞను సూచిస్తుంది. יְהוָהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: פָּקַד אֹתָם
  choice: వారిని లెక్కించారు
  rationale: פקדకు లెక్కించడం, సమీకరించడం, నియమించడం వంటి అర్థాలున్నాయి. సంఖ్యాకాండము 4లోని లేవీయుల జనగణన సందర్భం వల్ల ‘లెక్కించారు’ అనేది ప్రధాన భావానికి తగినది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థమైన ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారం ఇక్కడ మోషే మాధ్యమంగా కార్యం జరగడాన్ని సూచిస్తుంది. సహజమైన తెలుగుకోసం ‘ద్వారా’ వాడి, అక్షరరూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: אִישׁ אִישׁ
  choice: ప్రతి వ్యక్తిని
  rationale: పదపునరుక్తి ఒక్కొక్కరిని విడివిడిగా సూచించే విభాజక ప్రయోగం. ఆధునిక తెలుగులో ‘ప్రతి వ్యక్తిని’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַל עֲבֹדָתוֹ
  choice: అతని సేవను బట్టి
  rationale: עֲבֹדָה ఇక్కడ ప్రత్యక్ష గుడారానికి సంబంధించిన కేటాయించిన సేవ లేదా విధిని సూచిస్తుంది.
- source_word: וְעַל מַשָּׂאוֹ
  choice: అతడు మోయవలసిన బరువును బట్టి
  rationale: מַשָּׂא అనేది ప్రయాణంలో మోయాల్సిన సామగ్రి లేదా బరువును సూచిస్తుంది. ‘మోయవలసిన బరువు’ సందర్భాన్ని స్పష్టంగా, అతిగా వ్యాఖ్యానించకుండా తెలుపుతుంది.
- source_word: וּפְקֻדָיו
  choice: అతనికి అప్పగించిన బాధ్యత
  rationale: ఈ క్లిష్ట రూపం నియామకం, బాధ్యత, పర్యవేక్షణ లేదా అప్పగించిన పనిని సూచించవచ్చు. ‘అప్పగించిన బాధ్యత’ వ్యక్తిగత కేటాయింపు భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది; ఇతర అవకాశాలను పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారమే
  rationale: సాపేక్ష వాక్యం ముందున్న బాధ్యత లేదా మొత్తం లెక్కింపు-కేటాయింపు ఏర్పాటును విశేషించవచ్చు. ప్రధాన పాఠంలో సమీప పదమైన బాధ్యతతో అనుసంధానించాం; ‘ప్రకారమే’ దైవాజ్ఞకు అనుగుణతను తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో దైవనామమైన చతురక్షరి నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- issue: וּפְקֻדָיו అనే క్లిష్ట రూపం యొక్క సంబంధం
  choice: ప్రతి వ్యక్తికి అప్పగించిన బాధ్యత
  alternative: వారు లెక్కించబడడం లేదా సమీకరించబడడం
  rationale: ఈ రూపం פקד ధాతువు నుంచి వచ్చి పలు అర్థాలకు వీలిస్తుంది. సందర్భంలో వ్యక్తిగత సేవ, మోయవలసిన బరువు తరువాత రావడం వల్ల ‘అప్పగించిన బాధ్యత’ సరిపోతుంది; అయితే లెక్కింపు భావానికి ఉన్న అవకాశాన్ని పూర్తిగా నిరాకరించకుండా పాదసూచికలో పదార్థ విస్తృతిని చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘సేవ,’ ‘బాధ్యత’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో ఆరాధనా-పరిపాలనా సందర్భాన్ని నిలిపాం. మూలంలోని విభాజక ఏకవచనాన్ని ‘ప్రతి వ్యక్తిని/అతని’ రూపాలతో కాపాడాం; క్లిష్టమైన పקד పదకుటుంబ భావాన్ని పాదసూచిక ద్వారా తెరిచి ఉంచాం.
