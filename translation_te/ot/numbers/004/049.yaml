    rationale: ‘ప్రతి వ్యక్తిని అతని సేవను, అతడు మోయవలసిన బరువును బట్టి’లో ‘ప్రతి వ్యక్తిని’ మరియు తరువాతి పదాలు రెండూ కర్మరూపంలో రావడం వల్ల అతని సేవ/భారం ఎవరికి సంబంధించినవో, లెక్కింపు ఎలా పంపిణీ చేయబడిందో స్పష్టంగా ఉండదు. హీబ్రూ నిర్మాణం ప్రతి వ్యక్తి తన సేవ మరియు తన భారానికి సంబంధించి అని చెబుతుంది.
  revised_text: 'యాహ్వే ఆజ్ఞ[a] ప్రకారం మోషే ద్వారా[b] వారిని లెక్కించారు—ప్రతి వ్యక్తి తన సేవకూ తాను మోయవలసిన భారానికీ అనుగుణంగా. ప్రతి వ్యక్తికి అప్పగించిన బాధ్యత[c] కూడా యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారమే ఉంది.


    [a] అక్షరార్థంగా, “యాహ్వే నోటి మాట ప్రకారం.”


