revisions:
- from: శిబిరం బయలుదేరేటప్పుడు అహరోను, అతని కుమారులు లోపలికి వచ్చి, ముసుగు అడ్డతెరను దించి, దానితో సాక్ష్యపు మందసాన్ని[a] కప్పాలి.
  to: శిబిరం బయలుదేరేటప్పుడు అహరోను, అతని కుమారులు వచ్చి ముసుగు తెరను దించి, దానితో సాక్ష్యపు మందసాన్ని[a] కప్పాలి.
