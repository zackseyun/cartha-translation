id: NUM.4.5
reference: Numbers 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: te
  text: శిబిరం బయలుదేరేటప్పుడు అహరోను, అతని కుమారులు వచ్చి ముసుగు తెరను దించి, దానితో సాక్ష్యపు మందసాన్ని[a] కప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా, “నిబంధన మందసం” అని కూడా అంటారు. అయితే ఇక్కడి హీబ్రూ పదానికి అక్షరార్థం “సాక్ష్యం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: లోపలికి వచ్చి
  rationale: రూపపరంగా ఏకవచనంలో ఉన్నా, తరువాతి బహువచన క్రియలు ‘అహరోను, అతని కుమారులు’ అనే సమష్టి కర్తను సూచిస్తున్నాయి. సందర్భం పరిశుద్ధస్థలంలోకి ప్రవేశించడాన్ని సూచించే అవకాశం ఉన్నందున ‘లోపలికి వచ్చి’ అని అనువదించాం.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: శిబిరం బయలుదేరేటప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది. ప్రయాణం కోసం శిబిరం కదలడం ప్రారంభించే భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇది స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהוֹרִדוּ
  choice: దించి
  rationale: గుడారాన్ని ప్రయాణానికి సిద్ధం చేసే సందర్భంలో తెరను దాని స్థానంనుంచి కిందికి దించడం లేదా తొలగించడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: ముసుగు అడ్డతెరను
  rationale: פָּרֹכֶת పరిశుద్ధస్థలాన్ని విభజించే ప్రత్యేక తెరను, הַמָּסָךְ కప్పే లేదా మరుగుచేసే దాని స్వభావాన్ని సూచిస్తాయి. ‘ముసుగు అడ్డతెర’ అనే పదబంధం ఈ రెండు భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְכִסּוּ בָהּ
  choice: దానితో ... కప్పాలి
  rationale: כסה యొక్క ప్రాథమిక భావం ‘కప్పడం.’ స్త్రీలింగ సర్వనామం ముందున్న అడ్డతెరను సూచిస్తుంది; ‘దానితో’ సాధనార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲרֹן הָעֵדֻת
  choice: సాక్ష్యపు మందసం
  rationale: హీబ్రూ עֵדוּת అంటే ‘సాక్ష్యం’; ఇక్కడ בְּרִית (‘నిబంధన’) లేదు. అందువల్ల పరిచితమైన సంప్రదాయ పదబంధం కంటే మూలపాఠంలోని పదాన్ని అనుసరించాం.
theological_decisions:
- issue: אֲרֹן הָעֵדֻת అనే పదబంధానికి సంప్రదాయ అనువాదం
  choice: సాక్ష్యపు మందసం
  alternative: నిబంధన మందసం
  rationale: మూలపాఠం ‘సాక్ష్యం’ అనే עֵדוּת పదాన్ని ఉపయోగిస్తుంది. ‘నిబంధన’ అనే వేరే హీబ్రూ భావాన్ని ప్రధాన పాఠంలోకి తీసుకురాకుండా, ప్రసిద్ధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆజ్ఞాత్మక శైలిని వాడాం. ‘అడ్డతెర,’ ‘మందసం’ వంటి ఆరాధనా సందర్భానికి తగిన పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
