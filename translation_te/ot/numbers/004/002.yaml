  text: נָשֹׂ֗א אֶת רֹאשׁ֙ בְּנֵ֣י קְהָ֔ת מִ/תּ֖וֹךְ בְּנֵ֣י לֵוִ֑י לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: te
  text: లేవి కుమారులలోనుండి కహాతు కుమారుల జనగణనను వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం తీసుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కహాతు కుమారుల తలను ఎత్తండి”; ఇది వారిని లెక్కించడం లేదా వారి జనగణనను తీసుకోవడం అనే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: జనసంఖ్యను ... లెక్కించండి
  rationale: ఈ హీబ్రూ పదబంధానికి అక్షరార్థం ‘తలను ఎత్తండి’; అయితే జనగణన సంబంధ సందర్భంలో ఇది ఒక సమూహంలోని వారిని లెక్కించడం లేదా జనసంఖ్యను నమోదు చేయడం అనే నానుడి భావాన్ని ఇస్తుంది.
- source_word: בְּנֵי קְהָת
  choice: కహాతు కుమారులు
  rationale: హీబ్రూలోని వంశావళి రూపాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది కహాతు సంతతివారిని సూచిస్తుంది.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: లేవి కుమారులలో
  rationale: పెద్ద వంశసమూహమైన లేవి కుమారుల మధ్యనుంచి కహాతు వంశస్థులను లెక్కించాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: జనగణన, గోత్ర వ్యవస్థ సందర్భంలో מִשְׁפָּחָה కుటుంబం కంటే విస్తృతమైన వంశ విభాగాన్ని సూచిస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: ఇశ్రాయేలు బంధుత్వ, పరిపాలనా వ్యవస్థలో తండ్రి వంశానికి చెందిన గృహ విభాగాన్ని సూచించే మూలపద రూపాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘పితృగృహాలు’ అనే పదం మూలంలోని ప్రత్యేక వంశ-గృహ నిర్మాణాన్ని కాపాడుతుంది; పాదసూచిక నానుడి అక్షరార్థాన్ని తెలియజేస్తుంది.
