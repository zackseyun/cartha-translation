translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆదేశ శైలి వాడబడింది. మూలంలోని క్రియల బహువచన కర్త సందర్భం ద్వారా స్పష్టంగా ఉండటంతో తెలుగులో సహజమైన విధ్యర్థక రూపాలు వాడాం. תחש పదంలోని నిజమైన నిఘంటు అనిశ్చితిని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలిపాం.
