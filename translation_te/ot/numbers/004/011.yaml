    reason: lexical_alternative
  revision_rationale: The revision explicitly identifies the altar as the object to be covered, thereby preserving the Hebrew grammatical reference and avoiding a natural Telugu ambiguity. It also uses more idiomatic terms for the skin covering and carrying poles while retaining the disputed term “తహషు” and its explanatory footnote.
