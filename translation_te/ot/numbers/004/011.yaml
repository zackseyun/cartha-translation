id: NUM.4.11
reference: Numbers 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֣ל מִזְבַּ֣ח הַ/זָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: te
  text: బంగారు బలిపీఠంపై నీలి వస్త్రాన్ని పరచి, బలిపీఠాన్ని తహషు చర్మపు ఆవరణంతో[a] కప్పి, దాని మోయు కర్రలను అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తహషు’ అనే హీబ్రూ పదం ఏ జంతువును సూచిస్తుందో ఖచ్చితంగా తెలియదు. దీనికి ‘నాణ్యమైన తోలు,’ ‘దుగాంగ్ చర్మం’ వంటి అనువాదాలు ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: బంగారు బలిపీఠం
  rationale: హీబ్రూ నిర్మాణం అక్షరార్థంగా ‘బంగారపు బలిపీఠం’; ఆధునిక తెలుగులో ‘బంగారు బలిపీఠం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יִפְרְשׂוּ
  choice: పరచాలి
  rationale: פרשׂ అంటే పరచడం లేదా విప్పి పరచడం. ఆచార సంబంధమైన ఆదేశాన్ని తెలుగులో సహజంగా తెలిపేందుకు విధ్యర్థక ‘పరచాలి’ వాడబడింది.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: నీలి వస్త్రం
  rationale: בגד అంటే వస్త్రం; תכלת గుడారపు ఆరాధన సందర్భాల్లో వాడిన నీలి లేదా నీలి-ఊదా రంగును సూచిస్తుంది. ప్రాచీన వర్ణఛాయను అతిగా నిర్దిష్టం చేయకుండా ‘నీలి వస్త్రం’ స్పష్టంగా ఉంచుతుంది.
- source_word: וְכִסּוּ אֹתוֹ
  choice: దానిని ... కప్పి
  rationale: వావ్‌తో కూడిన క్రియ ముందున్న ఆదేశ క్రమాన్ని కొనసాగిస్తుంది. ‘కప్పి’ తరువాతి చర్యతో సహజంగా అనుసంధానమవుతుంది.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: తహషు చర్మంతో చేసిన కప్పు
  rationale: מכסה అంటే కప్పు; עור అంటే చర్మం లేదా తోలు. תחש సూచించే జంతువు ఖచ్చితంగా తెలియదు కాబట్టి ఊహాత్మక జంతు పేరును లేదా ‘శ్రేష్ఠమైన తోలు’ అనే నిర్ధారణను ప్రధాన పాఠంలో పెట్టకుండా మూలపదాన్ని లిప్యంతరీకరించి, అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: దాని మోతకర్రలను అమర్చాలి
  rationale: בדים అనేవి పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ వాటి కార్యాన్ని స్పష్టం చేస్తుంది; ‘అమర్చాలి’ שׂים క్రియకు సహజమైన సందర్భానుకూల అనువాదం.
