id: NUM.4.33
reference: Numbers 4:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: te
  text: సమాగమపు గుడారంలో వారి సమస్త సేవ విషయంలో, యాజకుడైన అహరోను కుమారుడైన ఈతామారు పర్యవేక్షణలో ఉండే మెరారి కుమారుల వంశాల సేవ ఇదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఈతామారు చేతి ద్వారా’; ఇది పర్యవేక్షణను లేదా నిర్వహణ బాధ్యతను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: చేయవలసిన సేవ అంతా ఇదే
  rationale: సారాంశాన్ని పరిచయం చేసే సూచన సర్వనామాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ఉంచి, ఆరాధనా గుడారానికి సంబంధించిన నియమిత సేవ అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: మెరారి కుమారుల వంశాలు
  rationale: מִשְׁפְּחֹת అనేది గోత్రంలోని విస్తృత వంశ విభాగాలను సూచిస్తుంది; ‘వంశాలు’ ఆధునిక ‘కుటుంబాలు’ కంటే ఈ సామూహిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘కుమారులు’ మూలంలోని వంశావళి రూపాన్ని నిలుపుతుంది.
- source_word: לְכָל עֲבֹדָתָם
  choice: చేయవలసిన సేవ అంతా
  rationale: వారికి అప్పగించబడిన సేవల సమగ్రతను తెలుగులో సహజంగా తెలియజేస్తుంది; עֲבֹדָה యొక్క సేవ/విధి భావాన్ని కాపాడుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలో
  rationale: אֹהֶל מוֹעֵד అనే పేరును దాని సమావేశ స్థల భావంతో పారదర్శకంగా అనువదిస్తుంది; בְּ ఉపసర్గ సూచించే సేవా పరిధి లేదా స్థలాన్ని ‘లో’ తెలియజేస్తుంది.
- source_word: בְּיַד
  choice: పర్యవేక్షణలో
  rationale: అక్షరార్థంగా ‘చేతి ద్వారా/చేతి కింద’ అయిన ఈ హీబ్రూ నుడికారం ఇక్కడ పరిపాలనా బాధ్యత లేదా పర్యవేక్షణను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పర్యవేక్షణలో’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారుడు ఈతామారు
  rationale: వ్యక్తుల పేర్లను లిప్యంతరీకరించి, ఈతామారును అతని తండ్రి మరియు యాజక సంబంధం ద్వారా గుర్తించే మూల వాక్యంలోని అనుబంధాన్ని సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని దీర్ఘ నామవాచక వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; కొత్త భావాన్ని చేర్చకుండా బాధ్యతా స్వరాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘జరగాలి’ వాడాం.
