translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆదేశాత్మక విధానానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ఆలయ/బలిపీఠ సేవకు సంబంధించిన పదాలను సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచుతూ, תַּחַשׁ విషయంలోని నిజమైన పదార్థ అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచికలో సంరక్షించాం.
