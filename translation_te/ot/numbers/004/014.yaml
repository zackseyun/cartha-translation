source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: te
  text: తర్వాత వారు దానిమీద సేవ చేయడానికి ఉపయోగించే దాని ఉపకరణాలన్నిటినీ—నిప్పు పళ్లాలను, ఫోర్కులను, పారలను, గిన్నెలను, అంటే బలిపీఠపు ఉపకరణాలన్నిటినీ—దానిమీద ఉంచాలి. తర్వాత వారు దానిమీద తహష్ తోలుతో చేసిన ఆవరణాన్ని[a] పరచి, దాని మోసే కర్రలను అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తహష్’ అని అనువదించిన హీబ్రూ పదం ఏ జంతువును లేదా ఏ రకమైన తోలును సూచిస్తుందో ఖచ్చితంగా తెలియదు. దీనికి మేకతోలు, సముద్ర జంతువు తోలు, లేదా సాధారణంగా మన్నికైన తోలు అనే అర్థాలు సూచించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: తర్వాత వారు దానిమీద ... ఉంచాలి
  rationale: క్రమంగా ఇచ్చే ఆదేశంలో וְנָתְנוּ యొక్క భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, עָלָיוను బలిపీఠాన్ని సూచించే ‘దానిమీద’గా అనువదించాం.
- source_word: כָּל־כֵּלָיו
  choice: దాని ... సామగ్రి అంతటినీ
  rationale: כְּלִי ఇక్కడ బలిపీఠ సేవలో ఉపయోగించే అనేక రకాల ఉపకరణాలను సూచిస్తుంది; ‘సామగ్రి’ విస్తృతమైనదీ సహజమైనదీ.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: దాని దగ్గర సేవ చేయడానికి ఉపయోగించే
  rationale: שרת యొక్క పవిత్ర సేవ భావాన్ని ‘సేవ చేయడానికి’ నిలుపుతుంది. అక్షరార్థమైన ‘దానిమీద వాటితో సేవ చేసే’ అనే అసహజ నిర్మాణాన్ని నివారించి, బలిపీఠం వద్ద జరిగే సేవను స్పష్టంగా తెలిపాం.
- source_word: הַמַּחְתֹּת
  choice: నిప్పు పళ్లెములు
  rationale: మంటలను లేదా నిప్పులను తీసుకెళ్లే పళ్లెముల వంటి ఉపకరణాలనే సూచిస్తుంది; ధూపానికి మాత్రమే పరిమితం చేసే ‘ధూపార్తులు’ కంటే ఇది సందర్భానికి తగినది.
- source_word: הַמִּזְלָגֹת
  choice: ముళ్ల గరిటెలు
  rationale: ఇవి కొమ్ములు లేదా ముళ్లు గల fork-వంటి బలిపీఠ ఉపకరణాలు. కేవలం ‘ముళ్లు’ లేదా ఆధునిక భోజన ‘ఫోర్కులు’ కంటే ‘ముళ్ల గరిటెలు’ ఉపయోగాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: הַיָּעִים
  choice: పారలు
  rationale: బూడిద మొదలైన వాటిని తొలగించడానికి ఉపయోగించే shovel/scoop ఉపకరణాలకు సాధారణంగా అర్థమయ్యే పదం.
- source_word: הַמִּזְרָקֹת
  choice: గిన్నెలు
  rationale: ద్రవాలను పట్టడానికి లేదా చల్లడానికి ఉపయోగించే పాత్రలను సూచించే సహజ తెలుగు పదం; నిర్దిష్ట వినియోగాన్ని మూలపాఠం చెప్పనందున దానిని అధికంగా నిర్ధారించలేదు.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: అంటే బలిపీఠపు సామగ్రి అంతటినీ
  rationale: ఇది ముందు జాబితాను సంగ్రహించే సమానాధికార పదబంధం. ‘అంటే’ తెలుగులో ఆ సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: దానిమీద ... కప్పును పరచి
  rationale: פרשׂ యొక్క ‘పరచు’ భావాన్నీ, כְּסוּי అనే నామవాచకంలోని ‘కప్పు’ భావాన్నీ వేరువేరుగా నిలిపాం.
- source_word: עוֹר תַּחַשׁ
  choice: తహష్ తోలుతో చేసిన
  rationale: תַּחַשׁ ఏ జంతువును సూచిస్తుందో అనిశ్చితి ఉన్నందున ఊహాత్మక జంతు గుర్తింపును ప్రధాన పాఠ్యంలో పెట్టకుండా మూలపదాన్ని లిప్యంతరీకరించాం; అనిశ్చితిని పాదసూచికలో వివరించాం.
- source_word: וְשָׂמוּ בַדָּיו
  choice: దాని మోతకర్రలను అమర్చాలి
  rationale: בַּדִּים అనేవి వస్తువును మోయడానికి ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ ప్రయోజనాన్ని స్పష్టంగా తెలియజేస్తుంది; שׂוםను సందర్భానుసారంగా ‘అమర్చాలి’గా ఇచ్చాం.
