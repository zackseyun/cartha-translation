  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: te
  text: వారు నివాస గుడారపు తెరలను, సమావేశ గుడారాన్ని, దాని కప్పును, దాని మీద పైగా ఉన్న తహషు కప్పును, సమావేశ గుడారపు ప్రవేశద్వారపు తెరను మోయాలి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: వారు ... మోయాలి
  rationale: ప్రయాణ సమయంలో పవిత్ర గుడారపు సామగ్రిని మోసుకెళ్లే సందర్భంలో נשׂא అనే క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: నివాసమందిరపు తెరలను
  rationale: יְרִיעֹת అంటే వస్త్రపు తెరలు లేదా విస్తారమైన వస్త్ర భాగాలు; מִשְׁכָּן యొక్క ‘నివసించే స్థలం’ అనే భావాన్ని ‘నివాసమందిరం’ నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారం అనే పేరును సంక్షిప్తంగా, తెలుగు బైబిలు పరిభాషకు అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: מִכְסֵהוּ
  choice: దాని కప్పును
  rationale: ఏకవచన ప్రత్యయాన్ని ప్రత్యక్ష గుడారానికి అన్వయిస్తూ, మూలంలోని సాధారణ ‘కప్పు’ భావాన్ని అధిక నిర్దిష్టత లేకుండా నిలుపుతుంది.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: తహషు చర్మపు కప్పును
  rationale: תַּחַשׁ ఏ జంతువు లేదా పదార్థాన్ని సూచిస్తుందో అనిశ్చితం. ఊహాత్మకమైన జంతు పేరును లేదా ‘నాణ్యమైన తోలు’ వంటి మూలంలో లేని గుణవిశేషాన్ని చేర్చకుండా లిప్యంతరీకరణతో అస్పష్టతను నిలుపుతుంది.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: దానిపైన పైగా ఉన్న
  rationale: ఈ కప్పు పై పొరగా ఉన్నదనే స్థానిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָסַךְ פֶּתַח
  choice: ప్రవేశద్వారపు తెరను
  rationale: מָסָךְ ప్రవేశాన్ని కప్పే వేలాడే తెరను సూచిస్తుంది; ‘ప్రవేశద్వారపు తెర’ తెలుగులో సహజంగా సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. పవిత్ర గుడారానికి సంబంధించిన పదజాలంలో ‘నివాసమందిరం,’ ‘ప్రత్యక్ష గుడారం,’ ‘తెర,’ ‘కప్పు’ అనే స్పష్టమైన రూపాలు ఎంచుకోబడ్డాయి. వాక్యం తరువాతి వచనంతో కొనసాగే జాబితా కావడంతో చివర కామా ఉంచబడింది.
