revisions:
- from: వారు నివాసమందిరపు తెరలను, ప్రత్యక్ష గుడారాన్ని, దాని కప్పును, దానిపైన పైగా ఉన్న తహషు చర్మపు[a] కప్పును, ప్రత్యక్ష గుడారపు ప్రవేశద్వారపు తెరను మోయాలి.
  to: వారు నివాస గుడారపు తెరలను, సమావేశ గుడారాన్ని, దాని కప్పును, దాని మీద పైగా ఉన్న తహషు కప్పును, సమావేశ గుడారపు ప్రవేశద్వారపు తెరను మోయాలి,
  rationale: The revision translates the sanctuary title according to its lexical meeting sense rather than importing an interpretive ‘manifestation’ meaning. It also removes the unsupported specification ‘skin’ from the uncertain term תַּחַשׁ, while the footnote supplies the necessary lexical uncertainty. The final comma is retained because the Hebrew verse continues a list into the following verse.
