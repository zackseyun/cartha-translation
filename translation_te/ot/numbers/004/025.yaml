    text: ‘తహషు’ అని లిప్యంతరీకరించిన హీబ్రూ పదం ఏ పదార్థాన్ని లేదా ఏ జంతువు చర్మాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు. సాంప్రదాయ అనువాదాలు దీనికి వివిధ జంతు చర్మాల పేర్లను ఉపయోగిస్తాయి.
    reason: lexical_alternative
