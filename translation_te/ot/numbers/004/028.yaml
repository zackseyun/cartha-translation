source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַ/גֵּרְשֻׁנִּ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד וּ/מִ֨שְׁמַרְתָּ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: te
  text: సమాగమ గుడారంలో గేర్షోను కుమారుల కుటుంబాల సేవ ఇదే. వారి బాధ్యత[a] యాజకుడైన అహరోను కుమారుడు ఈతామారు పర్యవేక్షణలో[b] ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి అప్పగించిన కర్తవ్యం”; హీబ్రూ పదం నియమించబడిన బాధ్యతను లేదా సంరక్షణ విధిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఈతామారు చేతిలో” లేదా “ఈతామారు చేతి ద్వారా”; ఇది అతని పర్యవేక్షణలో లేదా అధికారంలో అని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: చేయవలసిన సేవ ఇదే
  rationale: హీబ్రూ నామవాచక వాక్యంలోని గుర్తింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, ఇది వారికి నియమించబడిన సేవ అని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుల కుటుంబాలు
  rationale: వంశపరమైన సమూహాలను సూచించే מִשְׁפְּחֹת‌కు ‘కుటుంబాలు’ సరళమైన సమానార్థకం; ‘గేర్షోనీయులు’ అనే సమూహనామం మూలంలోని వంశ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమాగమ గుడారంలో
  rationale: מועד‌లోని కలుసుకోవడం/నియమిత సమాగమ భావాన్ని తెలిపే స్థిరమైన బైబిలు పదబంధం; בְ‌ను సేవ జరిగే పరిధిగా ‘లో’తో అనువదించింది.
- source_word: וּמִשְׁמַרְתָּם
  choice: వారి బాధ్యత
  rationale: ఈ సందర్భంలో מִשְׁמֶרֶת అప్పగించబడిన కర్తవ్యం, బాధ్యత లేదా సంరక్షణను సూచిస్తుంది; ‘బాధ్యత’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בְּיַד
  choice: పర్యవేక్షణలో
  rationale: అక్షరార్థంగా ‘చేతిలో/చేతికింద’ అయిన ఈ హీబ్రూ నుడికారం ఇక్కడ అధికారం లేదా పర్యవేక్షణను సూచిస్తుంది; సహజమైన తెలుగులో భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చింది.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారుడు ఈతామారు
  rationale: పేరు, తండ్రి-కొడుకు సంబంధం, అహరోను యాజకుడనే గుర్తింపును తెలుగులో స్పష్టమైన క్రమంలో నిలుపుతుంది.
