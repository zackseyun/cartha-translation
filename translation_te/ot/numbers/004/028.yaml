  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ నుడికారం ప్రధాన పాఠ్యంలో సహజంగా అనువదించబడి, దాని అక్షరార్థ రూపం పాదసూచికలో భద్రపరచబడింది.
