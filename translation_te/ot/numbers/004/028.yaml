    issue: “చేయవలసిన సేవ” adds an explicit ‘must be done’ formulation.
    rationale: The Hebrew identifies the service assigned to these families; it does not use a verbal form requiring a modal expression. “సేవ ఇదే” preserves the nominal identification more closely.
