source:
  edition: WLC
  text: וְ/לָקְח֣וּ בֶּ֣גֶד תְּכֵ֗לֶת וְ/כִסּ֞וּ אֶת מְנֹרַ֤ת הַ/מָּאוֹר֙ וְ/אֶת נֵ֣רֹתֶ֔י/הָ וְ/אֶת מַלְקָחֶ֖י/הָ וְ/אֶת מַחְתֹּתֶ֑י/הָ וְ/אֵת֙ כָּל כְּלֵ֣י שַׁמְנָ֔/הּ אֲשֶׁ֥ר יְשָׁרְתוּ לָ֖/הּ בָּ/הֶֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: te
  text: వారు నీలిరంగు వస్త్రాన్ని[a] తీసుకొని, వెలుగు కోసం ఉన్న దీపస్తంభాన్ని, దాని దీపాలను, దాని పట్టకార్లను, దాని అగ్నిపాత్రలను, వాటితో దానికి పరిచర్య చేయడానికి ఉపయోగించే దాని నూనె పాత్రలన్నిటినీ కప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీలి వస్త్రం,’ ‘నీలి-ఊదా రంగు వస్త్రం.’ తెకేలెత్ అనే హీబ్రూ పదం పవిత్ర గుడారపు సామగ్రిలో ఉపయోగించిన ప్రత్యేకంగా రంగు వేసిన వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: నీలిరంగు వస్త్రం
  rationale: בֶּגֶד ఇక్కడ వస్త్రాన్ని సూచిస్తుంది; תְּכֵלֶת ప్రత్యక్ష మందిరపు వస్త్రాల్లో వాడిన ప్రత్యేక నీలి లేదా నీలి-ఊదా రంగును సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘నీలిరంగు’ను ఉంచి, రంగు ఛాయలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: వెలుగు కోసం ఉన్న దీపస్తంభం
  rationale: מְנוֹרָה అంటే ‘దీపస్తంభం’; הַמָּאוֹר అనే సంబంధపదాన్ని కేవలం స్వామ్యార్థంగా కాక, వెలుగు కలిగించే దాని కార్యాన్ని సూచించే సహజ తెలుగు రూపంలో అనువదించాం.
- source_word: נֵרֹתֶיהָ
  choice: దాని దీపాలు
  rationale: దీపస్తంభంతో అనుసంధానమైన విడివిడి దీపాలను సూచించే స్పష్టమైన, సహజమైన తెలుగు పదబంధం.
- source_word: מַלְקָחֶיהָ
  choice: దాని పట్టకార్లు
  rationale: దీపాల వత్తులు లేదా మంటను సరిచేయడానికి ఉపయోగించే పట్టుకునే పనిముట్టును సూచిస్తుంది. మూలపదం తెలిపే పనిముట్టు స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘పట్టకార్లు’ అని ఇచ్చాం.
- source_word: מַחְתֹּתֶיהָ
  choice: దాని నిప్పు పళ్లాలు
  rationale: మంట, నిప్పుకణాలు లేదా దీపాలను శుభ్రపరచిన అవశేషాలను ఉంచే పళ్లాలను సందర్భానుగుణంగా సూచిస్తుంది; ‘ధూపపాత్రలు’ అనడం ఇక్కడ ధూపసేవ భావాన్ని అనవసరంగా చేర్చవచ్చు.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: నూనె పాత్రలన్నీ
  rationale: దీపస్తంభపు నూనెను ఉంచడానికి లేదా దాని సేవలో ఉపయోగించడానికి సంబంధించిన పాత్రలు, పనిముట్లను సంక్షిప్తంగా సూచిస్తుంది.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: దానికి సేవ చేయడానికి ఉపయోగించే
  rationale: שׁרת లోని పవిత్ర సేవ భావాన్ని ‘సేవ చేయడానికి’ నిలుపుతూ, בָּהֶם యొక్క సాధనార్థాన్ని సహజ తెలుగులో ‘ఉపయోగించే’ అని వ్యక్తం చేశాం.
