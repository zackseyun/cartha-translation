translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. జాబితా నిర్మాణాన్ని మూలపాఠ్యానికి దగ్గరగా ఉంచి, చివరి సాధనార్థక వాక్యభాగాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
