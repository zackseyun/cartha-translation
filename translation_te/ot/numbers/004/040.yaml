source:
  edition: WLC
  text: וַ/יִּֽהְיוּ֙ פְּקֻ֣דֵי/הֶ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם אַלְפַּ֕יִם וְ/שֵׁ֥שׁ מֵא֖וֹת וּ/שְׁלֹשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: te
  text: వారి వంశాల ప్రకారం, వారి పితృకుటుంబాల ప్రకారం లెక్కించబడినవారు[a] రెండువేల ఆరువందల ముప్పై మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమోదైనవారు,’ ‘జనగణనలో లెక్కకు వచ్చినవారు.’ హీబ్రూ పదం జనగణన కోసం నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఉన్నారు / మొత్తం అయ్యారు అనే భావాన్ని సంఖ్యా వాక్య నిర్మాణంలో సహజంగా వ్యక్తీకరించడం
  rationale: ఇక్కడ היה జనగణన సూత్రంలో సాధారణ సంధానాత్మక/ఫలితార్థక క్రియగా ఉంది; తెలుగులో సంఖ్యను నేరుగా విధేయంగా ఉంచడం సహజం.
- source_word: פְּקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: פקד యొక్క నిష్క్రియార్థం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. సందర్భం వ్యక్తుల సంఖ్యను స్పష్టం చేస్తున్నందున ఈ రూపం సహజంగా, మూలార్థానికి దగ్గరగా ఉంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మִשְׁפָּחָה ఇక్కడ ఇశ్రాయేలు బంధుత్వ విభాగాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘వంశాలు’ స్పష్టమైన సమానార్థకం.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: ఇది వంశావళి మరియు జనగణన సందర్భాల్లో పితృవంశ ఆధారిత కుటుంబ గృహాన్ని సూచించే స్థిర పదబంధం. ‘పితృకుటుంబాలు’ నిర్మాణార్థాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: రెండువేల ఆరువందల ముప్పై
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంఖ్యా రూపంలో నేరుగా అందిస్తుంది.
