revisions:
- from: ముప్పై సంవత్సరాల వయస్సు మొదలుకొని ఆపైబడినవారిలో, యాభై సంవత్సరాల వయస్సు వరకూ, ప్రత్యక్ష గుడారంలో పని చేయడానికి సేవకు వచ్చే ప్రతి ఒక్కరినీ లెక్కించారు.[a]
  to: ముప్పై సంవత్సరాల వయస్సు నుండి యాభై సంవత్సరాల వయస్సు వరకు, సేవా విధికి సమాగమ గుడారంలో పని చేయడానికి వచ్చే వారందరినీ లెక్కించారు.[a]
  rationale: The revision replaces an unnatural age expression, restores the source-faithful designation “tent of meeting,” and distinguishes the organized service-duty from the work performed. The supplied counting verb remains, because the Hebrew clause depends on the preceding verse; the note continues to identify that addition transparently.
