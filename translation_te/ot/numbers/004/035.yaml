  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: te
  text: ముప్పై సంవత్సరాల వయస్సు నుండి యాభై సంవత్సరాల వయస్సు వరకు, సేవా విధికి సమాగమ గుడారంలో పని చేయడానికి వచ్చే వారందరినీ లెక్కించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లెక్కించారు’ అనే క్రియ ఈ వచనంలో ప్రత్యక్షంగా లేదు; ఇది 34వ వచనంలోని లెక్కింపు క్రియకు కొనసాగింపుగా ఉంది.
    reason: supplied_context
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: ముప్పై సంవత్సరాల వయస్సు మొదలుకొని ఆపైబడినవారిలో
  rationale: מִן + בֶּן + సంఖ్య + שָׁנָה అనే వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపి, וָמַעְלָה లోని ‘ఆపై’ భావాన్ని నిలుపుతుంది.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: యాభై సంవత్సరాల వయస్సు వరకూ
  rationale: עַד సూచించే వయోపరిమితిని స్పష్టంగా, అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: כָּל הַבָּא
  choice: వచ్చే ప్రతి ఒక్కరినీ
  rationale: בוא క్రియలోని వచ్చుట/ప్రవేశించుట భావాన్ని, సమూహాన్ని సూచించే substantival participle నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַצָּבָא
  choice: సేవకు
  rationale: ఈ లేవీయుల సందర్భంలో צָבָא యుద్ధసేనను కాక క్రమబద్ధమైన విధి లేదా సేవను సూచిస్తుంది; ‘సేవకు’ ఆ భావాన్ని మతశాఖాపరమైన పదజాలం లేకుండా అందిస్తుంది.
- source_word: לַעֲבֹדָה
  choice: పని చేయడానికి
  rationale: עֲבֹדָה లోని పని/కార్యం భావాన్ని ముందు ఉన్న ‘సేవకు’ అనే పదం నుంచి వేరు చేసి స్పష్టంగా తెలుపుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵד కు తెలుగులో స్థిరపడి, అర్థవంతంగా ఉన్న బైబిలు పదబంధం; בְּ సూచించే సేవా పరిధిని ‘లో’ ద్వారా నిలుపుతుంది.
