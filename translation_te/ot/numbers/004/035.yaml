translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ మూలవాక్యం 34వ వచనంలోని లెక్కింపు క్రియపై ఆధారపడే వాక్యఖండం కావడంతో, తెలుగులో పూర్తి వాక్యంగా చదవడానికి ‘లెక్కించారు’ చేర్చి దానిని పాదటిప్పణిలో వెల్లడించాం.
