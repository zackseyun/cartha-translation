source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: te
  text: సమాగమ గుడారంలో సేవచేసే కెహాతీయుల వంశాల వారిలో లెక్కించబడినవారు వీరే. యాహ్వే ఆజ్ఞ ప్రకారం మోషే ద్వారా[a] మోషే, అహరోను వీరిని లెక్కించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మోషే చేతి ద్వారా.”
    reason: హీబ్రూ בְּיַד מֹשֶׁה నుడికారంలోని అక్షరార్థ రూపాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: פְקוּדֵי
  choice: లెక్కించబడినవారు
  rationale: జనగణన లేదా సేవకు అర్హులైనవారిని లెక్కించే సందర్భంలో פקד ధాతువు సూచించే ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: కహాతీయుల వంశాలు
  rationale: מִשְׁפְּחֹת కుటుంబాధారిత వంశ గుంపులను సూచిస్తుంది; 'వంశాలు' ఈ సందర్భంలో 'కుటుంబాలు' కంటే సమూహ నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל הָעֹבֵד
  choice: సేవచేసే వారందరూ
  rationale: వర్తమాన కృదంతం నిరంతర సేవలో నిమగ్నమైన సమూహాన్ని సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారంలో
  rationale: בְּ యొక్క స్థలార్థాన్ని నిలుపుతూ אֹהֶל מוֹעֵד అనే స్థిర నామాన్ని అర్థవంతంగా అందిస్తుంది.
- source_word: אֲשֶׁר פָּקַד
  choice: వీరిని లెక్కించారు
  rationale: ఇక్కడ కూడా פקד నియమించడం కాకుండా జనగణనలో లెక్కించడాన్ని సూచిస్తుంది.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: '''యెహోవా నోటి ప్రకారం'' అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం.'
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: ఈ హీబ్రూ నుడికారం సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; 'మోషే ద్వారా' తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని 'ప్రభువు' అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన 'యెహోవా' రూపాన్ని ఎంచుకున్నప్పటికీ, మూల ఉచ్చారణకు దగ్గరైన 'యాహ్వే' కూడా సాధ్యమైన రూపం.
- issue: בְּיַד מֹשֶׁה లోని మధ్యవర్తిత్వ భావం
  choice: మోషే ద్వారా
  alternative: మోషే చేతి ద్వారా
  rationale: దేవుని ఆజ్ఞ మోషే మధ్యవర్తిత్వంలో అమలైందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచి మూల నుడికారాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యంలోని పునరుక్త మోషే ప్రస్తావన మూలపాఠంలో ఉన్నందున నిలుపబడింది; దీర్ఘ వాక్యాన్ని స్పష్టత కోసం రెండు భాగాలుగా విభజించాం.
