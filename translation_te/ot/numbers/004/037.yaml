revisions:
- from: కహాతీయుల వంశాలలో లెక్కించబడినవారు వీరే—సమావేశపు గుడారంలో సేవచేసే వారందరూ. యెహోవా ఆజ్ఞ ప్రకారం మోషే ద్వారా[a] మోషే, అహరోను వీరిని లెక్కించారు.
  to: సమాగమ గుడారంలో సేవచేసే కెహాతీయుల వంశాల వారిలో లెక్కించబడినవారు వీరే. యాహ్వే ఆజ్ఞ ప్రకారం మోషే ద్వారా[a] మోషే, అహరోను వీరిని లెక్కించారు.
