  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో, అహరోనుతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘య్హ్వ్హ్’ (YHWH); ‘యెహోవా’ అని కూడా లిప్యంతరీకరించబడుతుంది.'
    reason: దైవనామపు హీబ్రూ రూపాన్ని తెలియజేసి, సంప్రదాయ ప్రత్యామ్నాయ లిప్యంతరీకరణను సూచించడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: דבר అనే క్రియకు ఇది సహజమైన ఆధునిక తెలుగు సమానార్థకం; కథనంలో దేవుడు పలికిన మాటలను పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: ఇద్దరూ విడివిడిగా సంబోధితులని మూలంలోని పునరుక్త אֶל సూచిస్తుంది; తెలుగులో ‘తో’ ప్రయోగం మాటలాడే సందర్భంలో సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ద్విరుక్తమైన ‘చెబుతూ’ నిర్మాణాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం, కాగా ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. తరువాతి ప్రత్యక్ష వాక్యానికి దారితీయడానికి చివరలో ద్విబిందువు వాడబడింది.
