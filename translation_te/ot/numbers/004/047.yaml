source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּ֗א לַ/עֲבֹ֨ד עֲבֹדַ֧ת עֲבֹדָ֛ה וַ/עֲבֹדַ֥ת מַשָּׂ֖א בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: te
  text: ముప్పై ఏళ్ల వయసు నుండి యాభై ఏళ్ల వయసు వరకు, సమావేశపు గుడారంలో సేవా పనిని, భారాలు మోసే సేవను చేయడానికి వచ్చేవారందరూ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పని చేసే సేవను, భారాలు మోసే పనిని.” హెబ్రూ మూలంలో ఒకే పదమూలానికి చెందిన ‘పని/సేవ’ రూపాలు పునరుక్తమవుతాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: ముప్పై సంవత్సరాల వయసు మొదలుకొని యాభై సంవత్సరాల వయసు వరకు
  rationale: హెబ్రూ పదబంధం ముప్పైని దిగువ వయోపరిమితిగా, యాభైని ఎగువ వయోపరిమితిగా సూచిస్తుంది. ‘మొదలుకొని ... వరకు’ ఆధునిక తెలుగులో సహజంగా ఆ పరిధిని తెలియజేస్తుంది.
- source_word: כָּל הַבָּא
  choice: వచ్చే ప్రతి ఒక్కరూ
  rationale: בוא క్రియారూపంలోని వర్తమాన కృదంత భావాన్ని నిలుపుతూ, విధి నిర్వహణకు వచ్చేవారిని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: לַעֲבֹד
  choice: చేయడానికి
  rationale: ఈ క్రియ తరువాత వచ్చే పని, సేవ పదబంధాలకు ఉద్దేశాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘చేయడానికి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: సేవా పనిని
  rationale: ఒకే మూలానికి చెందిన పదాల పునరుక్తిని అసహజంగా పదేపదే చెప్పకుండా, పని మరియు సేవ అనే రెండు భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: భారాలు మోసే సేవను
  rationale: מַשָּׂא మోయబడే భారం లేదా బరువును సూచిస్తుంది. లేవీయుల రవాణా బాధ్యతను అనవసర విస్తరణ లేకుండా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: ఇది אֹהֶל מוֹעֵדకు తెలుగులో స్థిరపడిన, అర్థవంతమైన పేరు; בְ అనే స్థలసూచక విభక్తిని ‘లో’ ద్వారా నిలుపుతుంది.
