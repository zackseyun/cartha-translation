translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలవాక్యం విస్తృత సందర్భంలోని లెక్కింపును వివరించే అసంపూర్ణ నిర్మాణంగా ఉన్నందున, తెలుగులోనూ కొత్త సమాపక క్రియను చేర్చకుండా ఆ నిర్మాణం నిలుపబడింది.
