lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: లెక్కించబడిన పురుషులు
  rationale: పקד అనే మూలం ఇక్కడ జనగణనలో నమోదు చేయబడినవారిని సూచిస్తుంది. సందర్భం ప్రకారం లెక్కింపబడినవారు పురుషులే కాబట్టి సహజమైన తెలుగులో ‘పురుషులు’ అని స్పష్టం చేయబడింది.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: మెరారి కుమారుల వంశాలవారిలో
  rationale: מִשְׁפָּחָה అనే పదానికి ఈ వంశావళి సందర్భంలో ‘వంశం’ సహజమైన సమానార్థకం; ‘కుమారులు’ అనే బంధుత్వ రూపాన్ని నిలిపి ఉంచింది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ పితృకుటుంబాల ప్రకారం
  rationale: బహువచన ‘తండ్రుల ఇళ్లు’ అనే హీబ్రూ సామాజిక నిర్మాణాన్ని అక్షరార్థంగా కాకుండా స్పష్టమైన ‘పితృకుటుంబాలు’గా అందించింది.
