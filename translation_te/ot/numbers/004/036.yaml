  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ פְקֻדֵי/הֶ֖ם לְ/מִשְׁפְּחֹתָ֑/ם אַלְפַּ֕יִם שְׁבַ֥ע מֵא֖וֹת וַ/חֲמִשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/036.yaml
  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: te
  text: వారి వంశాల వారీగా వారిలో లెక్కించబడినవారు రెండువేల ఏడువందల యాభై మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: '... మంది'
  rationale: వావ్-కన్సెక్యూటివ్ కథన ఫలితాన్ని ముందుకు తీసుకెళ్తుంది. తెలుగులో విడిగా ‘మరియు ... అయ్యారు’ అని పెట్టడం అసహజం; సంఖ్య చివర ‘మంది’తో అస్తిత్వార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: פְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: జనగణన సందర్భంలో פקד ధాతువునుంచి వచ్చిన ఈ రూపం నమోదు చేయబడిన లేదా లెక్కించబడినవారిని సూచిస్తుంది. ‘వారిలో’ అనే పదం ప్రత్యయార్థాన్ని నిలుపుతుంది; మూలంలో ఈ వాక్యభాగంలో ‘పురుషులు’ స్పష్టంగా లేనందున దాన్ని చేర్చలేదు.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇశ్రాయేలు గోత్ర నిర్మాణంలోని కుటుంబ-వంశ విభాగాన్ని సూచిస్తుంది. ‘వంశాలు’ ఆధునిక తెలుగులో ఆ సమూహార్థాన్ని సహజంగా తెలియజేస్తుంది; לְ యొక్క వర్గీకరణ భావాన్ని ‘ప్రకారం’ నిలుపుతుంది.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: రెండువేల ఏడువందల యాభై
  rationale: హీబ్రూ సంఖ్యా క్రమాన్ని ఖచ్చితమైన మొత్తం 2,750గా, పాఠ్యానికి తగిన తెలుగు పదరూపంలో అందించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భానికి తగిన గౌరవప్రదమైన మరియు సులభంగా అర్థమయ్యే శైలి. మూలంలో ఈ వాక్యంలో స్పష్టంగా లేని ‘పురుషులు’ అనే పదాన్ని చేర్చకుండా, తెలుగు సంఖ్యా ప్రయోగానికి అవసరమైన ‘మంది’ మాత్రమే ఉపయోగించబడింది.
