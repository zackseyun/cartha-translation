source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: te
  text: ముప్పై ఏళ్ల వయసు మొదలుకొని యాభై ఏళ్ల వయసు వరకు, ప్రత్యక్ష గుడారంలో పని చేయడానికి సేవకు[b] వచ్చే[a] ప్రతి ఒక్కరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవలో ప్రవేశించే ప్రతి ఒక్కరు.’ హీబ్రూ కృదంతం నియమిత సేవకు హాజరయ్యేవారిని లేదా ప్రవేశించేవారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సేవ’ అని అనువదించిన హీబ్రూ పదం వ్యవస్థీకృత విధిని, కొన్ని సందర్భాల్లో సైనిక భావంతో కూడిన విధిని కూడా సూచించగలదు; ఇక్కడ అది లేవీయుల సేవను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: ముప్పై ఏళ్ల వయసు మొదలుకొని
  rationale: בֶּן + సంఖ్య + שָׁנָה వయసును సూచించే హీబ్రూ నుడికారం. וָמַעְלָה కలిపి ముప్పై ఏళ్లను కలుపుకొని ప్రారంభమయ్యే దిగువ పరిమితిని తెలియజేస్తుంది.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: యాభై ఏళ్ల వయసు వరకు
  rationale: ఈ పదబంధం వయోపరిమితి యొక్క ఎగువ హద్దును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הַבָּא
  choice: వచ్చే ప్రతి ఒక్కరినీ
  rationale: בוא క్రియ యొక్క కృదంత రూపం ఇక్కడ నియమిత సేవకు వచ్చేవారిని లేదా ప్రవేశించేవారిని సూచిస్తుంది; మూలంలోని చలన భావాన్ని ‘వచ్చే’ నిలుపుతుంది.
- source_word: לַצָּבָא
  choice: సేవకు
  rationale: צָבָא అనే పదానికి వ్యవస్థీకృత విధి లేదా సైనిక దళం అనే భావాలు ఉండవచ్చు; లేవీయుల సందర్భంలో ఇది వ్యవస్థీకృత సేవను సూచిస్తుంది.
- source_word: לַעֲבֹדָה
  choice: పని చేయడానికి
  rationale: עֲבֹדָה పని లేదా సేవను సూచిస్తుంది. ముందున్న לַצָּבָאను ‘సేవకు’ అని అనువదించినందున, రెండు వేర్వేరు పదాల భేదాన్ని ఇది నిలుపుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵדకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ప్రత్యక్ష గుడారం’ అనే గౌరవప్రదమైన పదబంధాన్ని ఉపయోగించి, בְּను ‘లో’గా ప్రతిబింబించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. అయితే మూల వచనంలో ప్రత్యక్ష క్రియ లేకపోవడం గమనార్హం; సంఖ్యాకాండము 4లోని జనగణన వాక్య నిర్మాణానికి అనుగుణంగా తెలుగులో వాక్యపూర్ణత కోసం ‘లెక్కించారు’ చేర్చబడింది. ‘ప్రత్యక్ష గుడారం’ సంప్రదాయ తెలుగు బైబిలు పదప్రయోగంగా నిలుపబడింది.
