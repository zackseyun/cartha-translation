    rationale: The Hebrew combines מִשְׁמֶרֶת (assigned charge) with מַשָּׂא (load/burden). Adding “వస్తువుల” preserves the concrete transport sense indicated by the subsequent list.
  - severity: medium
    issue: “దిమ్మలు” is insufficiently precise for אֲדָנִים.
    rationale: In this tabernacle inventory, אֲדָנִים are base or socket pieces that support/receive structural members. “పాదపీఠాలు” is clearer and better matched to the stated alternative.
