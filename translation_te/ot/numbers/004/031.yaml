  to: 'సమావేశపు గుడారంలో వారు చేయవలసిన సమస్త సేవకు, వారు మోయవలసిన వస్తువుల బాధ్యత ఇదే: నివాస మందిరపు పలకలు[a], దాని అడ్డకమ్మీలు, దాని స్తంభాలు, దాని పాదపీఠాలు[b].'
