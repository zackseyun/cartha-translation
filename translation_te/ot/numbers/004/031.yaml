language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: te
  text: 'సమావేశపు గుడారంలో వారు చేయవలసిన సమస్త సేవకు, వారు మోయవలసిన వస్తువుల బాధ్యత ఇదే: నివాస మందిరపు పలకలు[a], దాని అడ్డకమ్మీలు, దాని స్తంభాలు, దాని పాదపీఠాలు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నివాస మందిరపు చట్రాలు.’ హెబ్రీ పదం నిర్మాణ పలకలను లేదా చట్ర భాగాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాని పునాది గుంటలు.’ హెబ్రీ పదం పలకలు లేదా స్తంభాలు అమరే పునాది భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ఇదే
  rationale: ముందటి వాక్యంతో సంబంధాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగు జాబితా పరిచయంలో ‘ఇదే’ సహజంగా, నిర్దిష్టంగా ఉంటుంది.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: వారు మోయాల్సిన బాధ్యత
  rationale: మִשְׁמֶרֶת‌లోని అప్పగించబడిన బాధ్యత భావాన్ని, מַשָּׂאలోని మోయవలసిన సామగ్రి భావాన్ని తెలుగులో సహజమైన ఒకే పదబంధంలో నిలుపుతుంది.
- source_word: לְכָל עֲבֹדָתָם
  choice: వారు చేయవలసిన సేవ అంతటికి
  rationale: עֲבֹדָה ఇక్కడ గుడార సంబంధిత నియమిత సేవను సూచిస్తుంది; ‘సేవ’ ఆ సందర్భోచిత భావాన్ని కాపాడుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారంలో
  rationale: ఇది దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పేరు.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: నివాస మందిరపు పలకలు
  rationale: קֶרֶשׁ నిర్మాణానికి ఉపయోగించిన పలకలను సూచిస్తుంది. ‘పలకలు’ మూలపదానికి నేరమైనది; వాటి నిర్మాణ పాత్రను పాఠకుడు సందర్భం ద్వారా గ్రహించగలడు.
- source_word: בְרִיחָיו
  choice: దాని అడ్డకమ్మీలు
  rationale: చట్రపు పలకలను కలిపి బిగించే అడ్డంగా అమర్చిన కమ్మీలను స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַמּוּדָיו
  choice: దాని స్తంభాలు
  rationale: నిలువుగా ఆధారమిచ్చే నిర్మాణ భాగాలకు సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲדָנָיו
  choice: దాని దిమ్మలు
  rationale: స్తంభాలు లేదా పలకలు అమరే పునాది భాగాలను తెలుగులో సంక్షిప్తంగా సూచిస్తుంది; మరింత సాంకేతికంగా ‘పాదపీఠాలు’ అని కూడా చెప్పవచ్చు.
