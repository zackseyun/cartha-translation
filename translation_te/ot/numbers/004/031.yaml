translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ అతిగా సాంకేతికం కాని శైలి వాడబడింది. హెబ్రీ వాక్యంలోని బాధ్యత–మోయుట అనే సంయుక్త భావం సహజ తెలుగు పదబంధంగా వ్యక్తమైంది.
