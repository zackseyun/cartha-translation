- from: గేర్షోను కుమారుల కుటుంబాల్లో లెక్కించబడినవారు వీరే[a]—సమావేశపు గుడారంలో సేవచేసిన వారందరూ. యెహోవా ఆజ్ఞ ప్రకారం మోషే, అహరోనులు వీరిని లెక్కించారు.
