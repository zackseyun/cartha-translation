id: NUM.4.41
reference: Numbers 4:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: te
  text: గేర్షోను కుమారుల కుటుంబాలకు చెందిన లెక్కించబడినవారు వీరే—సమావేశపు గుడారంలో సేవచేసిన వారందరూ; వీరిని యెహోవా ఆజ్ఞ ప్రకారం మోషే, అహరోనులు లెక్కించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: లెక్కించబడినవారు వీరే
  rationale: జనగణన సందర్భంలో פקד మూలం లెక్కలో నమోదు చేయబడినవారిని సూచిస్తుంది. హీబ్రూ నామవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ఫలితార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: గేర్షోను కుమారుల కుటుంబాలు
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను నిలుపుతూ מִשְׁפְּחֹת ను సాధారణ పాఠకులకు స్పష్టమైన ‘కుటుంబాలు’గా అనువదించింది.
- source_word: כָּל הָעֹבֵד
  choice: సేవచేసిన వారందరూ
  rationale: ఏకవచన సమూహార్థక కృదంతం అర్హులైన మొత్తం సమూహాన్ని సూచిస్తుంది; కథన సందర్భానికి సహజమైన తెలుగులో గతకాల రూపం వాడబడింది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారంలో
  rationale: నిర్దిష్ట పరిశుద్ధస్థల నామాన్ని సూటిగా నిలుపుతుంది; בְּ అనే ఉపసర్గను ‘లో’తో వ్యక్తం చేసింది.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోనులు వీరిని లెక్కించారు
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో స్పష్టత కోసం స్వతంత్ర వాక్యంగా మార్చి, פקד కు అదే ‘లెక్కించారు’ పదాన్ని నిలిపింది.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: ‘యెహోవా నోటి ప్రకారం’ అనే హీబ్రూ నుడికారానికి సహజమైన అర్థానువాదం; ఆజ్ఞ యొక్క దైవిక మూలాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చలేదు. తెలుగులో సంప్రదాయంగా విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నప్పటికీ, ‘యాహ్వే’ అనేది సంభావ్య ఉచ్చారణ ఆధారిత ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత పెంచబడింది. ‘సమావేశపు గుడారం’ అనే స్థిర పదబంధం, ‘మోషే’, ‘అహరోను’, ‘గేర్షోను’ అనే పరిచిత బైబిలు నామరూపాలు వాడబడ్డాయి.
