  text: וַ/יִּפְקֹ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י הָ/עֵדָ֖ה אֶת בְּנֵ֣י הַ/קְּהָתִ֑י לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను, సమాజపు నాయకులు కహాతీయులను[b] వారి వంశాల ప్రకారం, వారి పితృగృహాల ప్రకారం[c] లెక్కించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లెక్కించారు’ అనే మాటకు ‘సంఖ్య నమోదు చేశారు’ లేదా ‘జనగణన చేశారు’ అని కూడా అనువదించవచ్చు. ఇదే హీబ్రూ క్రియ ఇతర సందర్భాల్లో ‘నియమించారు’ అనే అర్థాన్నివ్వగలదు; ఇక్కడ మాత్రం సేవ కోసం లెక్కించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘కహాతీయుని కుమారులు’; అంటే కహాతు నుండి వచ్చిన వంశసమూహం.
    reason: lexical_alternative
  - marker: c
    text: ‘పితృగృహాలు’ అనేది ఇశ్రాయేలీయుల సంప్రదాయ బంధుత్వ పదం; ఇది పూర్విక కుటుంబాలను లేదా వంశ విభాగాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: లెక్కించారు
  rationale: సంఖ్యాకాండము 4లోని జనగణన సందర్భంలో פקד అనేది సేవకు అర్హులైనవారిని లెక్కించి నమోదు చేయడాన్ని సూచిస్తుంది; ‘లెక్కించారు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: సమాజపు నాయకులు
  rationale: נְשִׂיאִים సమాజంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; עֵדָהకు అరణ్యకాల ఇశ్రాయేలు సమూహం అనే భావంలో ‘సమాజం’ సహజమైన తెలుగు రూపం.
- source_word: בְּנֵי הַקְּהָתִי
  choice: కహాతీయులను
  rationale: అక్షరార్థంగా ‘కహాతీయుని కుమారులు’ అయినా, ఇక్కడ కహాతు సంతతి వంశసమూహమంతటినీ సూచిస్తుంది. తెలుగులో ‘కహాతీయులు’ ఆ సామూహిక వంశార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה జనగణన సందర్భంలో గోత్రంలోని బంధుత్వ విభాగాన్ని సూచిస్తుంది; ‘వంశాలు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: וּלְבֵית אֲבֹתָם
  choice: వారి పితృగృహాల ప్రకారం
  rationale: בֵּית אָבוֹת తోరాలోని సాంకేతిక బంధుత్వ పదబంధం. ‘పితృగృహాలు’ మూలంలోని పితృవంశ కుటుంబ విభాగ భావాన్ని కాపాడుతుంది; వివరణ పాదసూచికలో ఉంది.
