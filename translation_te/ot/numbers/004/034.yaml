translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు స్థాయుల బంధుత్వ వర్గీకరణను ‘వంశాలు’ మరియు ‘పితృగృహాలు’గా వేరు చేసి నిలిపాం; సాంకేతిక పదాలకు పాదసూచికలు జోడించాం.
