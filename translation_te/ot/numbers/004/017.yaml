source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: te
  text: 'అప్పుడు యెహోవా[a] మోషేకూ అహరోనుకూ ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: ‘YHWH’; మరో లిప్యంతరీకరణ: ‘యాహ్వే’.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమానుసార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఇక్కడ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తున్నందున ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: మోషే, అహరోను ఇద్దరూ నేరుగా సంబోధించబడుతున్నారని చూపుతూ, పునరుక్త ఉపసర్గ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నిలుపుతూ, తెలుగు బైబిల్ వాడుకలో సాధారణంగా గుర్తించబడే రూపాన్ని ప్రధాన పాఠ్యంలో ఉపయోగించాం; ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. వాక్యం తరువాతి ప్రత్యక్ష ప్రకటనను పరిచయం చేస్తుందని చూపడానికి చివర ద్విబిందువు వాడబడింది.
