id: NUM.4.10
reference: Numbers 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתְנ֤וּ אֹתָ/הּ֙ וְ/אֶת כָּל כֵּלֶ֔י/הָ אֶל מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: te
  text: వారు దానినీ దాని ఉపకరణాలన్నిటినీ తహషు చర్మంతో చేసిన కవచంలో[a] ఉంచి, దానిని మోసే దండపై పెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘తహషు’ (హీబ్రూ: תַּחַשׁ) అనే పదం ఏ జంతువును లేదా ఏ రకమైన చర్మాన్ని సూచిస్తుందో నిర్ధారించలేం. ఇది ఒక ప్రత్యేక జంతువు చర్మాన్నిగానీ, మన్నికైన తోలునుగానీ సూచించవచ్చు. సంప్రదాయ అనువాదాల్లో దీనిని సముద్ర ఆవు చర్మం, పోర్పస్ చర్మం మొదలైన రీతుల్లో అనువదించారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ אֹתָהּ
  choice: వారు దానిని ... ఉంచి
  rationale: విధి విధానాన్ని తెలిపే సందర్భంలో సంయోజకంతో కూడిన క్రియను తెలుగులో సహజమైన ఆదేశార్థక క్రమంగా అనువదించాం. స్త్రీలింగ ఏకవచన సర్వనామం మునుపటి వచనంలోని దీపస్తంభాన్ని సూచిస్తుంది.
- source_word: וְאֶת כָּל כֵּלֶיהָ
  choice: దాని ఉపకరణాలన్నిటినీ
  rationale: כֵּלִים అనే విస్తృత పదానికి, దీపస్తంభంతో ఉపయోగించే సామగ్రిని సూచించే సహజమైన ఆధునిక తెలుగు పదంగా ‘ఉపకరణాలు’ ఎంచుకున్నాం.
- source_word: אֶל מִכְסֵה
  choice: కప్పులో
  rationale: ఇక్కడ אֶל, נתן క్రియతో కలిసి వస్తువులను కప్పు లోపల ఉంచడాన్ని సూచిస్తుంది. ‘కప్పులో’ అనేది ఆ ఆవరించే చర్యను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: עוֹר תַּחַשׁ
  choice: తహషు చర్మపు
  rationale: תַּחַשׁ సూచించే జంతువు లేదా చర్మ రకం నిర్ధారించబడలేదు. ఊహాత్మక జంతు గుర్తింపును లేదా ‘శ్రేష్ఠమైన’ వంటి మూలంలో స్పష్టంగా లేని గుణాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, పదాన్ని లిప్యంతరీకరించి సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: మోసే కాడపై పెట్టాలి
  rationale: మళ్లీ వచ్చిన נתן తదుపరి చర్యను సూచిస్తుంది. מוֹט ఏకవచనంలో ఉన్న మోసేందుకు ఉపయోగించే కాడ లేదా దండను సూచిస్తుంది; కాబట్టి ఏకవచనాన్ని నిలిపి ‘మోసే కాడ’గా అనువదించాం.
