revisions:
- from: వారు దానిని, దాని ఉపకరణాలన్నిటినీ తహషు చర్మపు[a] కప్పులో ఉంచి, మోసే కాడపై పెట్టాలి.
  to: వారు దానినీ దాని ఉపకరణాలన్నిటినీ తహషు చర్మంతో చేసిన కవచంలో[a] ఉంచి, దానిని మోసే దండపై పెట్టాలి.
  rationale: The revision makes the skin covering explicit in natural modern Telugu, improves the term for the carrying pole, and retains the source’s singular anaphoric object in the second action. The disputed meaning of תַּחַשׁ remains unresolved in the main text and is preserved in the footnote.
  reviewer_model: gpt-5.6-terra
