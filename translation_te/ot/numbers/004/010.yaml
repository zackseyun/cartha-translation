translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సంబంధమైన విధి సూచనకు తగిన గౌరవప్రదమైనా సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని వరుస చర్యలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘ఉంచి ... పెట్టాలి’ అనే నిర్మాణంతో తెలిపాం.
