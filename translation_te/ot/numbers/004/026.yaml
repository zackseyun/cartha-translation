id: NUM.4.26
reference: Numbers 4:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: te
  text: ఆవరణపు తెరలను, నివాస గుడారం మరియు బలిపీఠం చుట్టూ ఉన్న ఆవరణ ద్వారం ప్రవేశ తెరను, వాటి తాళ్లను[a], వాటి సేవకు అవసరమైన సామగ్రినంతటినీ, వాటితో చేయవలసినదంతటినీ[b] వారు నిర్వహించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీగలను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాటి కోసం చేయవలసినదంతటినీ.” హెబ్రీ వాక్యం ఈ వస్తువులతో చేసే పనులను గానీ, సేవలో భాగంగా వాటి కోసం చేసే పనులను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: ఆవరణపు తెరలు
  rationale: ఆవరణకు చుట్టూ కట్టిన వస్త్రపు తెరలను సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: חָצֵר
  choice: ఆవరణం
  rationale: నివాసమందిరం వెలుపల చుట్టూ ఉన్న పరిమిత ప్రదేశాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: מָסַךְ
  choice: ద్వార ప్రవేశపు తెర
  rationale: ప్రవేశాన్ని కప్పే వస్త్ర తెర అనే ఆలయ సంబంధ అర్థాన్ని తెలియజేస్తుంది; פֶתַח שַׁעַר లోని ప్రవేశ భావాన్నీ నిలుపుతుంది.
- source_word: מֵיתְרֵיהֶם
  choice: వాటి తాళ్లు
  rationale: తెరలను బిగించడానికి ఉపయోగించే ropes/cords అనే అర్థానికి సాధారణంగా అర్థమయ్యే పదం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: వాటి సేవకు కావలసిన సామగ్రి
  rationale: כְּלֵי యొక్క విస్తృతమైన పరికరాలు/సామగ్రి భావాన్ని, עֲבֹדָה యొక్క సేవా భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: వాటితో చేయవలసినదంతా
  rationale: ఈ వస్తువులను ఉపయోగించి లేదా నిర్వహిస్తూ చేసే పనులను సూచించే సందర్భోచిత పఠనం; לָהֶם లోని సంభావ్య ‘వాటి కోసం’ భావాన్ని పాదటిప్పణిలో కాపాడాం.
- source_word: וְעָבָדוּ
  choice: ఈ విధంగా వారు సేవ చేయాలి
  rationale: గేర్షోనీయులు తమకు అప్పగించిన పరిశుద్ధ మందిరపు పనిని నిర్వర్తించాలనే ఆజ్ఞాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: לָהֶם యొక్క సంబంధార్థం
  choice: వాటితో చేయవలసినదంతా
  alternative: వాటి కోసం చేయవలసినదంతా
  rationale: సందర్భంలో జాబితా చేసిన వస్తువుల వినియోగం, నిర్వహణ ప్రధానంగా కనిపించినా, హెబ్రీ పదబంధం రెండు సంబంధాలను అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. 24–26 వచనాల్లో కొనసాగుతున్న బాధ్యతల జాబితికి అనుగుణంగా క్రియను చివర ఉంచి, ముగింపు సేవా ఆజ్ఞను స్పష్టంగా వ్యక్తం చేశాం.
