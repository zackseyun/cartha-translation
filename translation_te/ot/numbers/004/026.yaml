- from: ఆవరణపు తెరలను, నివాసమందిరం చుట్టూ, బలిపీఠం చుట్టూ ఉన్న ఆవరణ ద్వార ప్రవేశపు తెరను, వాటి తాళ్లను[a], వాటి సేవకు కావలసిన సామగ్రినంతటినీ, వాటితో చేయవలసినదంతటినీ[b] వారు చూసుకోవాలి; ఈ విధంగా వారు సేవ చేయాలి.
