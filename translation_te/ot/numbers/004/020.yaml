id: NUM.4.20
reference: Numbers 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: te
  text: అయితే వారు పవిత్ర వస్తువులను క్షణమాత్రమైనా చూడటానికి లోపలికి వెళ్లకూడదు[a]; అలా చేస్తే వారు చనిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవి కప్పబడుతున్నప్పుడు.’ ఈ హెబ్రీ ప్రయోగం క్లిష్టమైనది; పవిత్ర వస్తువులను క్షణకాలమే చూడటాన్ని గానీ, అవి కప్పబడుతున్న సమయంలో చూడటాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: అయితే ... కూడదు
  rationale: సంయోజక అవ్యయంతో కూడిన నిషేధం ముందున్న ఆదేశానికి హెచ్చరికాత్మక వ్యత్యాసాన్ని జోడిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָבֹאוּ
  choice: లోపలికి వెళ్లకూడదు
  rationale: క్రియకు ‘రావడం/లోపలికి వెళ్లడం, ప్రవేశించడం’ అనే అర్థం ఉంది. సందర్భంలో ఇది కహాతీయులకు ఇచ్చిన నిషేధం కాబట్టి ఈ రూపం సహజంగా ఉంది.
- source_word: לִרְאוֹת
  choice: చూడటానికి
  rationale: మూలంలోని సాధారణ ‘చూడడం’ అనే భావాన్ని అనవసరంగా ‘తదేకంగా చూడడం’గా బలపరచకుండా నిలుపుతుంది.
- source_word: כְבַלַּע
  choice: క్షణమాత్రమైనా
  rationale: ఇది క్లిష్టమైన ప్రయోగం. చాలా కొద్దిసేపు చూడడాన్ని సూచించే పఠనాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇస్తూ, కప్పబడుతున్నప్పుడు అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: אֶת־הַקֹּדֶשׁ
  choice: పవిత్ర వస్తువులను
  rationale: ఏకవచన రూపంలో ఉన్నప్పటికీ, తక్షణ సందర్భంలో గుడారపు పవిత్ర సామగ్రిని సమష్టిగా సూచిస్తుంది.
- source_word: וָמֵתוּ
  choice: అలా చేస్తే వారు చనిపోతారు
  rationale: నిషేధాన్ని ఉల్లంఘించిన ఫలితాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: הַקֹּדֶשׁ పదబంధపు సూచన
  choice: పవిత్ర వస్తువులకు సమష్టి సూచన
  alternative: పరిశుద్ధ స్థలం లేదా నైరూప్యమైన ‘పవిత్రమైనది’
  rationale: సంఖ్యాకాండము 4లోని సమీప సందర్భం గుడారపు సామగ్రిని కప్పడం, మోయడం గురించి చెబుతుంది; అందువల్ల స్థలాన్ని సూచించే అర్థాన్ని రుద్దకుండా వస్తువుల సమష్టి భావం సరిపోతుంది.
- issue: כְבַלַּע యొక్క క్లిష్టత
  choice: క్షణమాత్రమైనా
  alternative: అవి కప్పబడుతున్నప్పుడు
  rationale: హెబ్రీ ప్రయోగం కొద్దికాలాన్ని లేదా పవిత్ర వస్తువులు కప్పబడే ప్రక్రియను సూచించవచ్చు. ప్రధాన పాఠ్యం మొదటి భావాన్ని స్వీకరిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన హెచ్చరికగా అనువదించబడింది. ‘పవిత్ర వస్తువులు’ సందర్భంలోని గుడారపు సామగ్రిని స్పష్టంగా సూచిస్తుంది; మూలంలోని క్లిష్టమైన కాల/కప్పివేత ప్రయోగం పాదసూచికలో నిలుపబడింది.
