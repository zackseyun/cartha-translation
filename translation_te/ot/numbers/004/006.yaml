source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: te
  text: దాని మీద తహష్ చర్మంతో చేసిన ఆవరణాన్ని ఉంచాలి[a]. దాని పైన పూర్తిగా నీలి రంగులో ఉన్న వస్త్రాన్ని పరచాలి. ఆ తరువాత దాని మోయు కర్రలను అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“తహష్” (హీబ్రూ: תַּחַשׁ) ఏ జంతువును సూచిస్తుందో ఖచ్చితంగా తెలియదు. దీనిని మేకచర్మం, పర్పాయిస్ లేదా డుగాంగ్ వంటి సముద్రజంతువు చర్మం, లేదా మరొక ప్రత్యేక జంతువు చర్మం అని వివిధ రకాలుగా అనువదించారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: దాని మీద ... ఉంచాలి
  rationale: ఆచార సంబంధమైన వరుస సూచనల్లో సంయోజక వావుతో వచ్చిన సంపూర్ణ క్రియకు విధ్యర్థక భావం ఉంది. ‘ఉంచాలి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; עָלָיו పైభాగంలో ఉంచడాన్ని సూచిస్తుంది.
- source_word: כְּסוּי
  choice: కప్పు
  rationale: వస్తువుపై ఉంచే ఆవరణాన్ని సూచించే నామవాచకం; ఈ సందర్భంలో ‘కప్పు’ సంక్షిప్తంగానూ సహజంగానూ ఉంది.
- source_word: עוֹר תַּחַשׁ
  choice: తహష్ చర్మంతో చేసిన
  rationale: תַּחַשׁ సూచించే జంతువు ఏదో అనిశ్చితం. ఊహాత్మకమైన జంతు గుర్తింపును ప్రధాన పాఠ్యంలో పెట్టకుండా, మూలపదాన్ని లిప్యంతరీకరించి దాని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וּפָרְשׂוּ
  choice: పరచాలి
  rationale: వస్త్రాన్ని విప్పి ఒక ఉపరితలంపై వేయడాన్ని సూచించే క్రియకు ‘పరచాలి’ సహజమైన తెలుగు సమానం.
- source_word: בֶגֶד
  choice: వస్త్రం
  rationale: ఈ సందర్భంలో ధరించే బట్టకన్నా మందసంపై పరచే వస్త్రపు పొరను సూచిస్తుంది; ‘వస్త్రం’ గౌరవప్రదమైన, స్పష్టమైన ఎంపిక.
- source_word: כְּלִיל תְּכֵלֶת
  choice: పూర్తిగా నీలి రంగులో ఉన్న
  rationale: כְּלִיל సంపూర్ణతను నొక్కిచెబుతుంది; תְּכֵלֶת గుడారపు సామగ్రిలో ఉపయోగించిన నీలి లేదా నీలి-ఊదా వర్ణాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సాధారణంగా అర్థమయ్యే ‘నీలి రంగు’ను ఎంచుకున్నాం.
- source_word: מִלְמָעְלָה
  choice: దాని పైన
  rationale: అక్షరార్థంగా పైభాగాన్ని సూచిస్తుంది; పొరల వరుసలో నీలి వస్త్రం చర్మపు కప్పుకు పైన ఉండాలని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: దాని మోతకర్రలను అమర్చాలి
  rationale: בַּדִּים మోయడానికి ఉపయోగించే కర్రలు. ‘అమర్చాలి’ అవి తగిన స్థానంలో పెట్టబడతాయని సహజంగా వ్యక్తపరుస్తుంది.
