  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సూచనలకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని వాడాం. תַּחַשׁ విషయంలో మూలంలోని నిజమైన పదార్థ అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలిపాం.
