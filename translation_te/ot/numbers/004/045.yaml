source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: te
  text: మెరారీ కుమారుల కుటుంబాలకు చెందిన లెక్కింపబడినవారు వీరే. మోషే, అహరోను యాహ్వే ఆజ్ఞ ప్రకారం[a], మోషే ద్వారా[b] వారిని లెక్కించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యాహ్వే నోటి ప్రకారం”; అంటే, “యాహ్వే ఆజ్ఞ ప్రకారం.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “మోషే చేతి ద్వారా”; అంటే, “మోషే ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: లెక్కించబడినవారు వీరే
  rationale: జనగణన సందర్భంలో פְקוּדֵי అనేది నమోదుచేసి లెక్కించిన వ్యక్తులను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి సహజంగా ఉండేలా నిర్దేశక పదాన్ని చివర ఉంచాం.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: మెరారీ కుమారుల వంశాలకు చెందిన
  rationale: బంధుత్వాన్ని సూచించే בְּנֵי అనే మూలభాషా రూపాన్ని ‘కుమారులు’గా నిలిపి, מִשְׁפְּחֹת‌ను ఈ గోత్రీయ సందర్భంలో సహజమైన ‘వంశాలు’గా అనువదించాం.
- source_word: פָּקַד
  choice: లెక్కించారు
  rationale: ఇది నియామకం కంటే జనగణనలో వ్యక్తులను నమోదు చేసి లెక్కించడాన్ని సూచిస్తుంది; సంబంధిత פְקוּדֵיతో భావసామ్యాన్ని నిలుపుతుంది.
- source_word: עַל פִּי יְהוָה
  choice: యాహ్వే ఆజ్ఞ ప్రకారం
  rationale: ‘యాహ్వే నోటి ప్రకారం’ అనే హీబ్రూ నుడికారం ఇక్కడ ఆయన ఆజ్ఞకు అనుగుణంగా అని అర్థం; ప్రధాన పాఠ్యంలో సహజమైన తెలుగు భావాన్ని ఇచ్చి, మూలభాషా రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మోషేను సాధనంగా లేదా మధ్యవర్తిగా చూపుతుంది; సహజ తెలుగు భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, అలాగే ‘Jehovah’ సంప్రదాయ రూపమైన ‘యెహోవా’ను ఎంచుకోకుండా, ‘Yahweh’కు దగ్గరైన ‘యాహ్వే’గా ఇచ్చాం.
- issue: దైవ ఆజ్ఞను తెలిపే עַל פִּי నుడికారం
  choice: ఆజ్ఞ ప్రకారం
  alternative: నోటి ప్రకారం
  rationale: నుడికారపు ఉద్దేశం యాహ్వే ఇచ్చిన ఆజ్ఞను సూచించడం. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా తెలిపి, దాని స్పష్టమైన మూలభాషా రూపకాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని అనుసరించాం. హీబ్రూ నుడికారాలను ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తపరచి, వాటి మూల రూపాలను పాదసూచికల్లో నిలిపాం.
