  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: te
  text: 'గేర్షోనీయుల కుటుంబాల సేవ ఇదే: సేవ చేయడం, మోయడం.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవ చేయడం, భారాలు మోయడం.”
    reason: מַשָּׂא అనే పదం మోయడాన్ని మాత్రమే కాక మోయబడే భారాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: זֹאת
  choice: ఇదే
  rationale: స్త్రీలింగ ఏకవచన సూచనార్థక పదం తరువాతి ‘సేవ’ను సూచిస్తుంది; హెబ్రీ నామవాచక వాక్యంలోని అంతర్నిహిత అనుసంధానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עֲבֹדַת
  choice: సేవ
  rationale: עֲבֹדָה సేవ, పని, విధి అనే అర్థాలు కలిగి ఉంది; లేవీయుల పరిచర్య సందర్భంలో ‘సేవ’ సరళంగా, సందర్భోచితంగా ఉంది.
- source_word: מִשְׁפְּחֹת
  choice: కుటుంబాల
  rationale: గేర్షోను వంశంలోని కుటుంబ సమూహాలను సూచించే బహువచన నిర్మాణం; ‘కుటుంబాలు’ ఆధునిక తెలుగు పాఠకులకు నేరుగా అర్థమవుతుంది.
- source_word: הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుల
  rationale: గేర్షోను సంతతిని సమూహంగా సూచించే వంశనామం; ‘కుటుంబాల’తో సహజంగా కలిసే తెలుగు బహువచన సంబంధరూపం.
- source_word: לַעֲבֹד
  choice: సేవ చేయడం
  rationale: ל ఉపసర్గతో ఉన్న క్రియానామం పని లేదా విధిని సూచిస్తుంది; తరువాతి సమాంతర పదబంధంతో నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וּלְמַשָּׂא
  choice: మోయడం
  rationale: מַשָּׂא మోయబడేది, భారం, మోయుట అనే అర్థ పరిధి కలిగి ఉంది; మూలంలోని సంక్షిప్తతను కాపాడుతూ ‘మోయడం’ గుడారపు సామగ్రి రవాణా సందర్భానికి సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హెబ్రీలోని ‘సేవ చేయడం—మోయడం’ అనే సమాంతరతను నిలుపుతూ, מַשָּׂא పదంలోని ‘భారం’ భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
