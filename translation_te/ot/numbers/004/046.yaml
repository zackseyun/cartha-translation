  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: te
  text: లెక్కింపబడినవారందరూ—అంటే మోషే, అహరోను, ఇశ్రాయేలు నాయకులు లేవీయులలో లెక్కించినవారు—తమ వంశాల ప్రకారం, తమ పితృకుటుంబాల[b] ప్రకారం—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘పితృకుటుంబాలు’ అనేది వంశాలలోని పూర్వీకుల కుటుంబ-గృహ విభాగాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים ... פָּקַד
  choice: లెక్కించినవారందరూ
  rationale: పקד అనే పదం ఇక్కడ జనగణనలో అధికారికంగా లెక్కించడం లేదా నమోదు చేయడం అనే భావంలో రెండుసార్లు వస్తుంది. తెలుగు వాక్యంలో సహజత్వం కోసం ఆ పునరుక్తిని ఒకే సమగ్ర ప్రయోగంగా వ్యక్తం చేశాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులు
  rationale: נְשִׂיאִים గోత్రాలకు ప్రాతినిధ్యం వహించే అధిపతులను సూచిస్తుంది. ఆధునిక తెలుగులో స్పష్టమైన, అతిశయార్థం లేని పదం ‘నాయకులు’.
- source_word: אֶת הַלְוִיִּם
  choice: లేవీయులలో
  rationale: אֵת ప్రత్యక్ష కర్మను సూచించినా, లెక్కించబడినవారు లేవీయుల సమూహానికి చెందినవారని తెలుగులో సహజంగా తెలియజేయడానికి ‘లేవీయులలో’ అని అనువదించాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ జనగణనలోని వంశ లేదా కుల ఉపవిభాగాన్ని సూచిస్తుంది. ‘వంశాలు’ కుటుంబాలకన్నా విస్తృతమైన ఈ సామాజిక విభాగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְבֵית אֲבֹתָם
  choice: తమ పితృగృహాల ప్రకారం
  rationale: בֵּית אָבוֹת ఇశ్రాయేలు వంశవ్యవస్థలో పితృపారంపర్య కుటుంబ-గృహ విభాగాన్ని సూచించే స్థిరపదబంధం. మూల నిర్మాణాన్ని నిలుపుతూ అర్థాన్ని వివరించే పాదటిప్పణి జోడించాం.
