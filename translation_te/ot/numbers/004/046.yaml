translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ఈ వచనం తరువాతి వచనంలో కొనసాగే సమగ్ర లెక్క వాక్యంలో భాగం కాబట్టి చివర దీర్ఘవిరామ సూచకంగా డాష్ ఉంచాం. ‘పితృగృహాలు’కు సంబంధించిన [b] సూచిక ప్రధాన పాఠ్యంలో అవసరం: సవరించిన పాఠ్యం ‘తమ పితృగృహాల[b] ప్రకారం’గా చదవాలి.'
