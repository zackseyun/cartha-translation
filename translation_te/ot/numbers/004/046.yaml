  to: లెక్కింపబడినవారందరూ—అంటే మోషే, అహరోను, ఇశ్రాయేలు నాయకులు లేవీయులలో లెక్కించినవారు—తమ వంశాల ప్రకారం, తమ పితృకుటుంబాల[b] ప్రకారం—
