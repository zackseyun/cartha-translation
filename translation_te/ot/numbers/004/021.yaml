  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేకు ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’ (יהוה); సంప్రదాయ అనువాదాల్లో ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు మూలరూపాన్ని, అలాగే సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: తరువాత ... అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘తరువాత’ ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. דּבר ఇక్కడ మాటలాడడం లేదా సంబోధించడం అనే భావంలో ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కలిసిన אֶל తెలుగులో సహజంగా ‘మోషేతో’ అని వ్యక్తమవుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: హీబ్రూ ప్రసంగ-పరిచయ సూత్రాన్ని తెలుగులో సహజంగా తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ‘ఇలా అన్నాడు:’గా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరు రూపంలో నిలిపాం; తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠంలో ఉంచి, మూల హీబ్రూ రూపాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. తదుపరి దైవవాక్యాన్ని పరిచయం చేయడానికి ముగింపులో ద్విబిందువు వాడబడింది.
