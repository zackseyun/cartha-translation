  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: te
  text: గేర్షోనీయుల కుమారుల సమస్త సేవ—వారు మోయవలసిన వాటన్నిటి విషయంలోను, వారు చేయవలసిన సేవ అంతటిలోను—అహరోను, అతని కుమారుల ఆదేశం ప్రకారం జరగాలి.[a] వారు మోయవలసిన వాటన్నిటినీ వారి బాధ్యతగా మీరు వారికి అప్పగించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అహరోను, అతని కుమారుల నోటి ప్రకారం.” ఈ హీబ్రూ నుడికారం వారి మాట లేదా ఆదేశం ప్రకారం అని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి కర్తవ్యంగా.” హీబ్రూ పదం అప్పగించబడిన బాధ్యతను లేదా విధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: ఆదేశం ప్రకారం
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘నోటి ప్రకారం’ అని ఉన్నా, ఇక్కడ అధికారపూర్వకమైన ఆదేశం లేదా నిర్దేశం ప్రకారం జరగడాన్ని సూచిస్తుంది.
- source_word: תִּהְיֶה
  choice: జరగాలి
  rationale: పరిపాలనా నిర్దేశంలోని విధ్యర్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲבֹדַת
  choice: సేవ
  rationale: ప్రత్యక్ష శ్రమతోపాటు గుడారానికి సంబంధించిన నియమిత విధిని కూడా సూచించే విస్తృత పదం.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయుల కుమారులు
  rationale: వంశీయ సమూహాన్ని సూచించే హీబ్రూ పుత్రత్వ భాషను నిలుపుతూ తెలుగులో స్పష్టంగా ఉంది.
- source_word: לְכָל מַשָּׂאָם
  choice: వారు మోయవలసిన వాటన్నిటి విషయంలో
  rationale: מַשָּׂא ఇక్కడ గుడారపు వస్తువుల రవాణాలో వారు మోయాల్సిన సామగ్రిని సూచిస్తుంది; రూపకాలంకారమైన ‘భారాలు’ కంటే ఈ రూపం స్పష్టం.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: వారి సేవ అంతటి విషయంలో
  rationale: లְ ఉపసర్గ ఇక్కడ అహరోనీయుల నిర్దేశం వర్తించే పరిధిని సూచిస్తున్నట్లు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: మీరు వారికి అప్పగించాలి
  rationale: פקד ఈ నిర్మాణంలో నియమించడం లేదా బాధ్యత అప్పగించడం అనే భావం ఇస్తుంది; తరువాతి ప్రత్యక్ష కర్మతో ఈ అర్థం బాగా సరిపోతుంది.
- source_word: בְּמִשְׁמֶרֶת
  choice: వారి బాధ్యతగా
  rationale: מִשְׁמֶרֶת అప్పగించబడిన కర్తవ్యం, బాధ్యత లేదా పరిరక్షణాధికారాన్ని సూచించగలదు; ‘బాధ్యతగా’ ఆధునిక తెలుగులో స్పష్టం.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: వారు మోయవలసిన వాటన్నిటినీ
  rationale: వారికి అప్పగించబడే రవాణా సామగ్రి మొత్తాన్ని స్పష్టంగా తెలుపుతూ మూలంలోని పునరుక్తిని నిలుపుతుంది.
