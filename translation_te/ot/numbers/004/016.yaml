  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: te
  text: యాజకుడైన అహరోను కుమారుడు ఎలియాజరుకు దీపవెలుగు కోసం నూనె[a], సుగంధ ధూపం, నిత్య ధాన్యార్పణ[b], అభిషేక తైలం, అలాగే మొత్తం నివాసగుడారంపైనా దానిలోనున్న సమస్తంపైనా—పవిత్రస్థలంపైనా[c] దాని ఉపకరణాలపైనా[d]—పర్యవేక్షణ బాధ్యత ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పర్యవేక్షణ బాధ్యత’ అని అనువదించిన హెబ్రీ పదానికి ‘అప్పగించబడిన బాధ్యత’ లేదా ‘పర్యవేక్షణ’ అనే అర్థాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘నిత్య ధాన్యార్పణ’ను ‘క్రమంగా అర్పించే ధాన్యార్పణ’ లేదా ‘ఎడతెగని ధాన్యార్పణ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘పవిత్రస్థలం’ అనే పదబంధాన్ని ‘పవిత్ర ప్రదేశం’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది పవిత్ర ప్రాంతాన్ని లేదా పవిత్రమైన వాటిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_and_referential_ambiguity
  - marker: d
    text: ‘ఉపకరణాలు’ అని అనువదించిన పదానికి ‘పాత్రలు,’ ‘సామగ్రి,’ లేదా ‘పనిముట్లు’ అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: పర్యవేక్షణ బాధ్యత
  rationale: ఈ సందర్భంలో అప్పగించబడిన పర్యవేక్షణతో కూడిన బాధ్యతను సూచిస్తుంది; కేవలం ‘నియామకం’ అనే భావం కంటే ఇది యాజక సంబంధ పరిపాలనా సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: దీపాల కోసం నూనె
  rationale: అక్షరార్థంగా ‘వెలుగు కోసం నూనె’; దీపస్తంభంలో వెలిగించడానికి ఉపయోగించే నూనె అనే ప్రయోజనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ధూపం
  rationale: సుగంధ ద్రవ్యాలతో తయారైన ధూపాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִנְחַת הַתָּמִיד
  choice: నిత్య ధాన్యార్పణ
  rationale: מִנְחָהను ధాన్యార్పణగా, תָּמִידను క్రమంగా కొనసాగేదిగా ప్రతిబింబిస్తుంది; ‘రోజువారీ’ అని మూలంలో లేని కాల పరిమితిని అధికంగా నిర్దిష్టం చేయదు.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: ఆరాధనా సందర్భంలోని అభిషేకానికి వాడే నూనెను తెలిపే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదబంధం.
- source_word: כָּל הַמִּשְׁכָּן
  choice: నివాసగుడారం అంతటికీ
  rationale: מִשְׁכָּן యొక్క ‘నివాసస్థలం/గుడారం’ భావాన్ని, כָּל యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: בְּקֹדֶשׁ
  choice: పవిత్రస్థలానికీ
  rationale: ఇక్కడ పదం అమూర్తమైన ‘పవిత్రత’ కంటే ఆరాధనా సంబంధ పవిత్ర ప్రదేశాన్ని సూచిస్తుంది; అయితే దాని పరిధి ఎంత విస్తృతమో పాదసూచికలో తెరిచి ఉంచబడింది.
- source_word: וּבְכֵלָיו
  choice: దాని ఉపకరణాలకీ
  rationale: כֵּלִים పాత్రలు, పనిముట్లు, సామగ్రి వంటి విస్తృత పరిధిని కలిగి ఉండటంతో ‘ఉపకరణాలు’ సముచితమైన సమగ్ర పదం.
theological_decisions:
- issue: రెండుసార్లు వచ్చిన פְקֻדַּת యొక్క సంబంధం మరియు వాక్య నిర్మాణం
  choice: మొదటి భాగంలో ఎలియాజరుకు అప్పగించిన వస్తువులను తెలిపి, రెండవ భాగంలో నివాసగుడారం అంతటిపై అతని విస్తృత పర్యవేక్షణ బాధ్యతను సంగ్రహంగా పేర్కొనడం
  alternative: రెండవ פְקֻדַּתను మొదటి జాబితాకు సమానాధికరణంగా కలిపి, హెబ్రీయులోని క్రియలేని నిర్మాణాన్ని ఒకే దీర్ఘ వాక్యంగా ఉంచవచ్చు.
  rationale: హెబ్రీయు నిర్మాణం నామవాచక ప్రధానమైనదిగా, కొంత సమానాధికరణ భావంతో ఉంది. తెలుగులో అర్థస్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చినా, రెండవ భాగం వేరొక సిద్ధాంతపరమైన బాధ్యతను ప్రవేశపెట్టకుండా మొదటి బాధ్యతను విస్తరించి సంగ్రహిస్తుంది.
- issue: בְּקֹדֶשׁ וּבְכֵלָיו యొక్క భావసంబంధం
  choice: నివాసగుడారంలో ఉన్న సమస్తానికి వివరణాత్మకంగా ‘పవిత్రస్థలానికీ, దాని ఉపకరణాలకీ’ అని అనువదించడం
  alternative: ‘పవిత్రమైన వాటి విషయంలోను వాటి పాత్రల విషయంలోను’ లేదా ‘పవిత్రస్థలంలోను దాని ఉపకరణాల్లోను’ అని అనువదించవచ్చు.
  rationale: בְּ ఉపసర్గ ఇక్కడ స్థలార్థం లేదా బాధ్యతా పరిధిని సూచించవచ్చు. ప్రధాన పాఠం సందర్భానుకూలమైన పరిధి భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హెబ్రీయులోని నామవాచక ప్రధాన నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి ‘ఉంటాయి,’ ‘అతనిదే’ అనే విధేయ పదాలు పూరించబడ్డాయి. ‘నివాసగుడారం,’ ‘ధాన్యార్పణ,’ ‘అభిషేక తైలం’ వంటి పదాలు ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతూ ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చవు.
