revisions:
- from: యాజకుడైన అహరోను కుమారుడు ఎలియాజరు పర్యవేక్షణ బాధ్యతలో[a] దీపాల కోసం నూనె, సుగంధ ధూపం, నిత్య ధాన్యార్పణ[b], అభిషేక తైలం ఉంటాయి. నివాసగుడారం అంతటికీ, దానిలో ఉన్న సమస్తానికీ—పవిత్రస్థలానికీ[c], దాని ఉపకరణాలకీ[d]—పర్యవేక్షణ బాధ్యత అతనిదే.
  to: యాజకుడైన అహరోను కుమారుడు ఎలియాజరుకు దీపవెలుగు కోసం నూనె[a], సుగంధ ధూపం, నిత్య ధాన్యార్పణ[b], అభిషేక తైలం, అలాగే మొత్తం నివాసగుడారంపైనా దానిలోనున్న సమస్తంపైనా—పవిత్రస్థలంపైనా[c] దాని ఉపకరణాలపైనా[d]—పర్యవేక్షణ బాధ్యత ఉంటుంది.
  rationale: ‘దీపాల’ అనే మూలంలో లేని బహువచనాన్ని తొలగించి, שֶׁמֶן הַמָּאוֹר యొక్క విస్తృతమైన ‘వెలుగు కోసం నూనె’ భావాన్ని ఉంచాము. అలాగే రెండుసార్లు వచ్చిన פְקֻדַּתను ఒకే వాక్యంలో ఎలియాజరుకు అప్పగించబడిన విస్తృత పర్యవేక్షణగా వ్యక్తం చేశాము. బַּקֹּדֶשׁ యొక్క పరిధి గురించిన అనిశ్చితిని పాదసూచికలో నిలుపుతూ, ప్రధాన పాఠంలో సందర్భానుకూల బాధ్యతా-పరిధి భావాన్ని ఉంచాము.
