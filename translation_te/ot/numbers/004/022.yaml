  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: te
  text: గేర్షోను కుమారులనూ వారి పితృకుటుంబాల ప్రకారం, వారి వంశాల ప్రకారం లెక్కించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: జనసంఖ్యను ... లెక్కించు
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘తలను ఎత్తు’ అని ఉన్నా, జనగణన సందర్భంలో లెక్కించడం లేదా జనసంఖ్యను నమోదు చేయడం అనే అర్థం ఇస్తుంది. తెలుగు వాక్యంలో ఆ పరిపాలనా భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: గేర్షోను కుమారులు
  rationale: మూలంలోని వంశావళి సంబంధమైన ‘కుమారులు’ నిర్మాణాన్ని నిలుపుతుంది; సందర్భంలో ఇది గేర్షోను సంతతివారిని సూచిస్తుంది.
- source_word: גַּם הֵם
  choice: కూడా
  rationale: ముందు లెక్కించబడిన వర్గంతోపాటు వీరినీ చేర్చాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְבֵית אֲבֹתָם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: తండ్రుల వంశరేఖ ఆధారంగా ఏర్పడిన పూర్వీకుల కుటుంబ విభాగాలను సూచిస్తుంది; ‘పితృకుటుంబాలు’ ఆ సామాజిక నిర్మాణాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: జనగణన సందర్భంలో מִשְׁפָּחָה సాధారణ అణుకుటుంబం కంటే విస్తృతమైన వంశ లేదా కుల ఉపవిభాగాన్ని సూచిస్తుంది; ‘వంశాలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. జనగణనకు సంబంధించిన హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో భావానువాదంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం. ‘పితృకుటుంబాలు’ మరియు ‘వంశాలు’ అనే పదాలతో మూలంలోని రెండు సామాజిక విభాగాల మధ్య తేడాను కాపాడాం.
