id: NUM.4.15
reference: Numbers 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: te
  text: శిబిరం బయలుదేరేటప్పుడు అహరోను, అతని కుమారులు పరిశుద్ధస్థలాన్ని, పరిశుద్ధస్థలపు సామగ్రినంతటినీ కప్పడం పూర్తిచేసిన తరువాత, కహాతు కుమారులు[a] వాటిని మోయడానికి రావాలి. అయితే వారు పరిశుద్ధ వస్తువులను[b] తాకకూడదు; తాకితే చనిపోతారు.[c] ప్రత్యక్ష గుడారంలో కహాతు కుమారులు మోయవలసిన భారం ఇవే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ‘కహాతీయులు.’ హీబ్రూలో అక్షరార్థంగా ‘కహాతు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పరిశుద్ధస్థలాన్ని.’ హీబ్రూ పదం పవిత్ర వస్తువుల సమాహారాన్ని లేదా విస్తృతంగా పరిశుద్ధస్థలాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూ వాక్యం ఫలితాన్ని మరింత నేరుగా, ‘వారు తాకకూడదు, మరియు చనిపోతారు’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: కప్పడం పూర్తిచేసిన తరువాత
  rationale: כִלָּהతో కూడిన לְכַסֹּת చర్య పూర్తవడాన్ని సూచిస్తుంది. తెలుగులో ‘కప్పడం పూర్తిచేసిన తరువాత’ సహజంగా ఉండి, ఆ పనికి ముగింపు వచ్చిన తరువాతే కహాతీయులు రావాలనే క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలం
  rationale: మొదటి సందర్భంలో ఇది గుడారంలోని పవిత్ర స్థలాన్ని సూచిస్తుందని సందర్భం తెలియజేస్తుంది. ‘పరిశుద్ధస్థలం’ ఆరాధనా సంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు సామగ్రినంతటినీ
  rationale: כְּלֵי అనేది పాత్రలు, పనిముట్లు, ఇతర సామగ్రి అన్నింటినీ కలుపగల విస్తృత పదం. ‘సామగ్రి’ అనవసరంగా ఒకే రకమైన వస్తువులకు పరిమితం చేయదు.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: శిబిరం బయలుదేరేటప్పుడు
  rationale: ఈ కాలసూచక నిర్మాణం శిబిరం ప్రయాణానికి బయలుదేరే సందర్భాన్ని తెలియజేస్తుంది. ‘బయలుదేరేటప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְנֵי קְהָת
  choice: కహాతు కుమారులు
  rationale: హీబ్రూ బంధుత్వ-వంశ పదబంధాన్ని నేరుగా నిలుపుతూ, అది కహాతీయులను సూచించగలదనే విషయాన్ని పాదసూచికలో తెలిపాం.
- source_word: לָשֵׂאת
  choice: వాటిని మోయడానికి
  rationale: కప్పబడిన పవిత్ర సామగ్రి సమీప పూర్వపదంగా ఉన్నందున, తెలుగులో అవసరమైన కర్మను ‘వాటిని’ అని స్పష్టపరిచాం. ‘మోయడానికి’ రవాణా బాధ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: అయితే వారు పరిశుద్ధ వస్తువులను తాకకూడదు
  rationale: తక్షణ సందర్భం కప్పబడిన పవిత్ర సామగ్రిని మోయడం గురించి కాబట్టి, ఇక్కడ הַקֹּדֶשׁను వస్తువుల సమాహారంగా అనువదించాం. అయినా ‘పరిశుద్ధస్థలాన్ని’ అనే విస్తృత పఠనాన్ని పాదసూచికలో నిలిపాం.
- source_word: וָמֵתוּ
  choice: తాకితే చనిపోతారు
  rationale: నిషేధాన్ని అతిక్రమిస్తే కలిగే ప్రాణాంతక ఫలితాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది. హీబ్రూలోని నేరుగా కలిపిన ఫలిత వాక్యరూపాన్ని పాదసూచికలో సూచించాం.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: కహాతు కుమారులు మోయవలసిన భారం ఇవే
  rationale: מַשָּׂאలోని భౌతిక ‘భారం’ భావాన్ని కాపాడుతూ, అది వారికి అప్పగించబడిన మోయు బాధ్యత అని వాక్యనిర్మాణం తెలియజేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: בְּ యొక్క సహజ స్థానార్థాన్ని నిలుపుతూ, אֹהֶל מוֹעֵדకు స్థిరమైన, గౌరవప్రదమైన తెలుగు పదబంధాన్ని ఉపయోగించాం.
theological_decisions:
- issue: నిషేధ వాక్యంలో הַקֹּדֶשׁ దేనిని సూచిస్తుంది?
  choice: పరిశుద్ధ వస్తువులు
  alternative: పరిశుద్ధస్థలం
  rationale: ముందటి భాగంలో కప్పబడిన పవిత్ర సామగ్రిని కహాతు కుమారులు మోయడం ప్రధాన సందర్భం. అందువల్ల ప్రత్యక్షంగా ఆ వస్తువులను తాకకూడదనే అర్థం ప్రధాన పాఠంలో సరిపోతుంది; అయినా హీబ్రూ పదం స్థలాన్ని లేదా పవిత్ర పరిధిని సూచించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- issue: וָמֵתוּ అనే ఫలిత వాక్యాన్ని ఎలా వ్యక్తీకరించాలి?
  choice: తాకితే చనిపోతారు
  alternative: తాకి చనిపోకూడదు / మరియు చనిపోతారు
  rationale: హెచ్చరిక యొక్క భావాన్ని తెలుగులో స్పష్టంగా అందించాం; అయితే హీబ్రూ ఫలితాన్ని నేరుగా ‘మరియు వారు చనిపోతారు’ అన్నట్టుగా కలుపుతుందనే నిర్మాణ భేదాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. కార్యాచరణ క్రమం స్పష్టంగా ఉండేలా దీర్ఘ హీబ్రూ వాక్యాన్ని తెలుగు వాక్యప్రవాహానికి సరిపడేలా అమర్చాం. ‘పరిశుద్ధస్థలం,’ ‘ప్రత్యక్ష గుడారం,’ ‘భారం’ వంటి పదాలు ఆరాధనా గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
