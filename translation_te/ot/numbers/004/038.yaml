  text: 'And the numbered men of the sons of Gershon, by their clans and by their fathers'' houses:'
translation:
  language: te
  text: 'గేర్షోను కుమారులలో తమ వంశాల ప్రకారం, తమ పితృగృహాల ప్రకారం లెక్కించబడినవారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: లెక్కించబడినవారు
  rationale: פקד యొక్క ఈ సందర్భార్థం జనగణనలో నమోదు చేసి లెక్కించడం. ‘పురుషులు’ అనే పదం మూలంలో స్పష్టంగా లేకపోవడంతో దాన్ని చేర్చలేదు; సందర్భం ద్వారా ఉద్దేశిత వర్గం తెలుస్తుంది.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: గేర్షోను కుమారులలో
  rationale: ‘గేర్షోను కుమారులు’ అనే వంశసమూహాన్ని సూచిస్తుంది; తెలుగులో లెక్కించబడినవారు ఆ సమూహానికి చెందినవారని సహజంగా తెలియజేయడానికి ‘కుమారులలో’ వాడబడింది.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని ఉపవంశం లేదా clan‌ను సూచిస్తుంది; ‘వంశాలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఎంపిక.
- source_word: וּלְבֵית אֲבֹתָם
  choice: తమ పితృగృహాల ప్రకారం
  rationale: בֵּית אָבוֹת అనేది తండ్రి వంశపరమైన కుటుంబ విభాగానికి స్థిరమైన హెబ్రీయ పదబంధం; ‘పితృగృహాలు’ దాని సామాజిక-వంశ నిర్మాణాన్ని కాపాడుతుంది.
