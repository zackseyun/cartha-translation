translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. వచనం తరువాతి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివరలో ద్విబిందువు ఉంచబడింది. మూలంలోని ప్రారంభ וּ ను తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సందర్భానుసారమైన కొనసాగింపుగా వ్యక్తం చేశాం.
