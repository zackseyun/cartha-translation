translation:
  language: te
  text: వారి లెక్కలో నమోదైన పురుషులు ఎనిమిది వేల ఐదువందల ఎనభై మంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిలో జనగణనలో నమోదైనవారు’ లేదా ‘వారి లెక్కలో నమోదైనవారు.’ హెబ్రీ పదం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: మంది
  rationale: ఇక్కడ היה రూపం జనగణన మొత్తాన్ని తెలిపే సాధారణ భూతకాల వాక్యనిర్మాణంలో ఉంది. తెలుగులో సంఖ్య చివర ‘మంది’ వాడటం ద్వారా ‘వారు ... ఉన్నారు’ అనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: פְּקֻדֵיהֶם
  choice: వారిలో లెక్కించబడిన పురుషులు
  rationale: פקד మూలం నుండి వచ్చిన ఈ పదం జనగణనలో నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. సంఖ్యాకాండము 4 సందర్భంలో ప్రత్యక్షంగా పురుషులే లెక్కించబడుతున్నారు కాబట్టి ‘పురుషులు’ అని పేర్కొనడం మూల సందర్భానికి లింగపరంగా ఖచ్చితమైనది; ‘వారిలో’ అనేది హెబ్రీయులోని సంబంధాన్ని సహజ తెలుగులో చూపుతుంది.
- source_word: שְׁמֹנַת אֲלָפִים
  choice: ఎనిమిది వేల
  rationale: హెబ్రీ సంఖ్యా నిర్మాణాన్ని ప్రామాణిక తెలుగు సంఖ్యా రూపంలో నేరుగా అనువదించాం.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: ఐదువందల
  rationale: వేల సంఖ్యకు కలిపే తదుపరి సంఖ్యా భాగాన్ని సహజ తెలుగు సమాస సంఖ్యారూపంలో అందించాం.
- source_word: וּשְׁמֹנִים
  choice: ఎనభై
  rationale: కూడిక సంఖ్యా శ్రేణిలోని చివరి భాగాన్ని తెలుగు సంఖ్యా క్రమానుసారం అందించాం.
theological_decisions:
- issue: జనగణన పదంలోని లింగ సూచన
  choice: వారిలో లెక్కించబడిన పురుషులు
  alternative: వారిలో లెక్కించబడినవారు; వారి లెక్కింపబడినవారు
  rationale: హెబ్రీ పదరూపం స్వతహాగా ‘లెక్కించబడినవారు’ అనే భావాన్ని కలిగించినా, సమీప సందర్భం ప్రత్యక్ష గుడార సేవకు నిర్ణీత వయస్సులోని లేవీయ పురుషులను లెక్కిస్తుంది. అందువల్ల లింగాన్ని తటస్థం చేయకుండా వాస్తవ సూచితులను స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన సందర్భానికి తగిన గౌరవప్రదమైన, సులభమైన భాష. సంఖ్యను సహజ తెలుగు పద్ధతిలో ‘ఎనిమిది వేల ఐదువందల ఎనభై’గా ఇచ్చి, వ్యక్తుల సంఖ్య కావడంతో ‘మంది’ వాడాం.
