source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: te
  text: ముప్పై ఏళ్ల వయసు నుండి యాభై ఏళ్ల వయసు వరకు ఉన్నవారిలో, సమావేశపు గుడారం పనిని చేయడానికి సేవలో[a] చేరే ప్రతి ఒక్కరినీ లెక్కించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేవ’ అని అనువదించిన హీబ్రూ పదం వ్యవస్థీకృత దళాన్ని లేదా సమూహాన్ని కూడా సూచించగలదు; ఇక్కడ అది లేవీయులకు అప్పగించిన సేవను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: ముప్పై ఏళ్ల వయసు మొదలుకొని యాభై ఏళ్ల వయసు వరకు
  rationale: హీబ్రూ వయోపరిమితి నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దిగువ మరియు ఎగువ హద్దులను స్పష్టంగా నిలుపుతుంది.
- source_word: תִּפְקְדֵם
  choice: వారిని లెక్కించాలి
  rationale: ఈ జనగణన సందర్భంలో פקד అనేది సేవకు అర్హులైన వారిని లెక్కించి నమోదు చేయడాన్ని సూచిస్తుంది; ‘లెక్కించాలి’ సూటిగా, సహజంగా ఉంది.
- source_word: כָּל הַבָּא
  choice: చేరే ప్రతి ఒక్కరినీ
  rationale: כָּל తో కూడిన ఏకవచన కృదంతం ఒక్కొక్క అర్హ వ్యక్తిని సమష్టిగా సూచిస్తుంది; తెలుగు ప్రయోగం ఆ పంపిణీ భావాన్ని కాపాడుతుంది.
- source_word: לַצָּבָא
  choice: నియమిత సేవలో
  rationale: צָבָא కు సైన్యం లేదా సమూహం అనే అర్థాలు ఉండగలిగినా, ఇక్కడ క్రమబద్ధంగా అప్పగించిన లేవీయుల సేవను సూచిస్తుంది. ‘నియమిత సేవ’ సైనిక యుద్ధ భావాన్ని అనవసరంగా రుద్దకుండా సంస్థాగత స్వభావాన్ని తెలియజేస్తుంది.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: పనిని చేయడానికి
  rationale: ఒకే మూలానికి చెందిన క్రియ, నామవాచక పునరుక్తిని తెలుగులో సహజంగా ‘పనిని చేయడానికి’ అని అందిస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి వాడిన స్థిరమైన హీబ్రూ పేరును స్పష్టంగా, సంప్రదాయానికి అనుగుణంగా అందిస్తుంది.
theological_decisions:
- issue: לַצָּבָא లోని సంభావ్య సైనిక భావఛాయ
  choice: నియమిత సేవ
  alternative: సైన్యం; సేవాదళం; విధి
  rationale: ఈ వచనం యుద్ధాన్ని కాక సమావేశపు గుడారంలో లేవీయులకు అప్పగించిన క్రమబద్ధమైన పనిని వివరిస్తుంది. ‘నియమిత సేవ’ వ్యవస్థీకృత విధి భావాన్ని కాపాడి, అనవసరమైన సైనిక అర్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజమైన విధ్యర్థక ‘లెక్కించాలి’తో అందించాం. ప్రధాన పాఠ్యంలో [a] సూచికను సంబంధిత పదబంధం తరువాత ఉంచాం.
