translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూలోని చివరి సంక్షిప్త పదబంధం భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేసి, దాని నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
