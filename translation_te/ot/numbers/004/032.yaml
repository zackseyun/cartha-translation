source:
  edition: WLC
  text: וְ/עַמּוּדֵי֩ הֶ/חָצֵ֨ר סָבִ֜יב וְ/אַדְנֵי/הֶ֗ם וִֽ/יתֵדֹתָ/ם֙ וּ/מֵ֣יתְרֵי/הֶ֔ם לְ/כָל כְּלֵי/הֶ֔ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/בְ/שֵׁמֹ֣ת תִּפְקְד֔וּ אֶת כְּלֵ֖י מִשְׁמֶ֥רֶת מַשָּׂאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: te
  text: ఆవరణం చుట్టూ ఉన్న స్తంభాలు, వాటి అడుగుపీఠాలు, వాటి మేకులు, వాటి తాళ్లు, వాటి సమస్త సామగ్రి, వాటికి సంబంధించిన సమస్త సేవ; వారు మోయవలసిన సామగ్రిలో ప్రతి దానిని మీరు పేరుపేరునా కేటాయించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: ‘వారి మోయు బరువు బాధ్యతకు చెందిన సామగ్రిని మీరు పేర్ల ప్రకారం నియమించాలి.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: చుట్టూ ఉన్న ఆవరణపు స్తంభాలు
  rationale: עַמּוּדִים నిర్మాణాన్ని నిలబెట్టే స్తంభాలను, חָצֵר ప్రత్యక్ష గుడారం చుట్టూ ఉన్న ఆవరణాన్ని సూచిస్తాయి; סָבִיב వాటి చుట్టూరా ఉన్న స్థానాన్ని తెలియజేస్తుంది.
- source_word: אַדְנֵיהֶם
  choice: వాటి పీఠాలు
  rationale: ప్రత్యక్ష గుడారపు నిర్మాణ సందర్భంలో אֶדֶן స్తంభాన్ని నిలబెట్టే అడుగు పీఠం లేదా గాడి గల ఆధారాన్ని సూచిస్తుంది. ‘పీఠాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: יְתֵדֹתָם
  choice: వాటి మేకులు
  rationale: יָתֵד తాళ్లతో నిర్మాణాన్ని బిగించడానికి నేలలో పాతే మేకు లేదా కొయ్యను సూచిస్తుంది; ‘మేకులు’ ఈ సందర్భంలో సహజమైన పదం.
- source_word: מֵיתְרֵיהֶם
  choice: వాటి తాళ్లు
  rationale: מֵיתָר గుడారం లేదా ఆవరణ నిర్మాణాన్ని బిగించే తాడు; ‘తాళ్లు’ ఆధునిక తెలుగులో సహజంగా అర్థమవుతుంది.
- source_word: לְכָל כְּלֵיהֶם
  choice: వాటి సమస్త సామగ్రి
  rationale: כְּלִים అనే విస్తృత పదం ఇక్కడ పాత్రలకన్నా నిర్మాణానికి సంబంధించిన వస్తువులు, పనిముట్లు అన్నింటినీ సూచిస్తుంది; అందువల్ల ‘సామగ్రి’ తగిన సమగ్ర పదం.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: వాటికి సంబంధించిన సేవ అంతా
  rationale: עֲבֹדָה పని, సేవ, నియమిత విధి అనే భావాలను కలిగి ఉంది. లేవీయుల నియమిత పరిచర్య సందర్భాన్ని నిలుపుతూ ‘సేవ’ అని అనువదించబడింది.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: మీరు పేరుపేరునా అప్పగించాలి
  rationale: פקד ఇక్కడ కేవలం లెక్కించడం కాకుండా వ్యక్తిగత బాధ్యతను నియమించడం లేదా అప్పగించడం; בְשֵׁמֹת ప్రతి వ్యక్తిని పేరుతో గుర్తించి అప్పగించడాన్ని సూచిస్తుంది.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: ఏ సామగ్రిని మోసే బాధ్యత ఎవరిదో
  rationale: ఈ సంక్షిప్త హీబ్రూ పదబంధంలో ‘సామగ్రి,’ ‘బాధ్యత/కాపలా విధి,’ ‘మోయవలసిన బరువు’ అనే భావాలు కలిసివున్నాయి. తెలుగులో సహజంగా ఉండేలా, ప్రతి వ్యక్తి మోయాల్సిన సామగ్రి బాధ్యతను నిర్ణయించాలనే భావాన్ని వ్యక్తం చేసింది; మరింత పదానుసారమైన రూపం పాదసూచికలో ఉంచబడింది.
