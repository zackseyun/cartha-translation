  source_fidelity: 'హీబ్రూ వాక్యంలోని జనగణన-సూత్రాన్ని అనువాదం నిష్ఠగా ప్రతిబింబిస్తుంది: పక్వుదీహెమ్‌కు ‘లెక్కించబడినవారు,’ లెమిష్పెహోతామ్‌కు ‘వారి వంశాల ప్రకారం,’ సంఖ్యకు ‘మూడు వేల రెండు వందల మంది’ సరైన సమానార్థకాలు. తెలుగులో క్రియను స్పష్టంగా చేర్చకపోయినా సంఖ్యా-నివేదిక శైలిలో అది సహజమైన అన్వయం; మూలంలోని వావ్-క్రమ భావానికి విరుద్ధం కాదు.'
