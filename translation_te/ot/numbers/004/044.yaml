  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: te
  text: వారి వంశాల ప్రకారం లెక్కించబడినవారు మూడు వేల రెండు వందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఉన్నారు అనే భావాన్ని వాక్య నిర్మాణంలో సహజంగా వ్యక్తపరచడం
  rationale: వావ్-కన్సెక్యూటివ్‌తో కూడిన היה కథన కొనసాగింపును, లెక్క యొక్క ఫలితాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు ... ఉన్నారు’ అని పెట్టకుండా, సంఖ్యతో ముగిసే సహజ వాక్య నిర్మాణమే ఆ భావాన్ని అందిస్తుంది.
- source_word: פְקֻדֵיהֶם
  choice: లెక్కించబడినవారు
  rationale: ఈ జనగణన సందర్భంలో פקד మూలం నుంచి వచ్చిన రూపం నమోదు చేసి లెక్కించినవారిని సూచిస్తుంది. ‘లెక్కించబడినవారు’ అనే పదం జనగణన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని కుటుంబ లేదా వంశ విభాగాన్ని సూచిస్తుంది. ‘వంశాల ప్రకారం’ అనేది సంఖ్యాకాండంలోని జనగణన సందర్భానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: మూడు వేల రెండు వందల మంది
  rationale: హీబ్రూ సంఖ్యను సూటిగా, ఆధునిక తెలుగులో సహజమైన క్రమంలో అందిస్తుంది. వ్యక్తుల లెక్క అని స్పష్టం చేయడానికి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. మూలంలోని సమాచార క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ సహజమైన తెలుగు వాక్యంగా రూపొందించబడింది.
