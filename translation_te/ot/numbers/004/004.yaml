source:
  edition: WLC
  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: te
  text: సమావేశపు గుడారంలో అతి పరిశుద్ధమైన వస్తువులకు సంబంధించిన కహాతు కుమారుల సేవ ఇదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి పరిశుద్ధ స్థలం,” “మహాపరిశుద్ధ స్థలం.” ఇక్కడ ఈ పదబంధం లోపలి పరిశుద్ధ స్థలాన్ని మాత్రమే కాకుండా, అత్యంత పవిత్రమైన వస్తువులను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: ఇదే
  rationale: ఈ స్త్రీలింగ ఏకవచన సూచన సర్వనామం తరువాతి ‘సేవ’ను సూచిస్తోంది; హీబ్రూలో అంతర్లీనంగా ఉన్న సంధాయక క్రియను తెలుగులో సహజంగా ‘ఇదే’ తెలియజేస్తుంది.
- source_word: עֲבֹדַת
  choice: సేవ
  rationale: ఇక్కడ ఈ పదం నియమించబడిన పవిత్ర పరిచర్యను సూచిస్తుంది; ‘సేవ’ ఆ ఆరాధనా సంబంధమైన బాధ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי קְהָת
  choice: కహాతు కుమారుల
  rationale: మూలంలోని బంధుత్వ వ్యక్తీకరణను నిలుపుతూ, కహాతు వంశస్థులను సూచించే రూపంగా ఇది తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారంలో
  rationale: ב అనే ఉపసర్గ సేవ జరిగే పరిధి లేదా స్థలాన్ని సూచిస్తోంది; ‘సమావేశపు గుడారం’ ఈ గుడారానికి ప్రామాణికమైన, అర్థవంతమైన తెలుగు పేరు.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధమైన వస్తువులకు
  rationale: సంఖ్యాకాండము 4లోని సందర్భం కహాతీయులు మోయవలసిన గుడారపు పవిత్ర సామగ్రిని వివరిస్తుంది. అందువల్ల స్థలాన్ని మాత్రమే సూచించకుండా, అత్యంత పవిత్రమైన వస్తువులను సూచించే భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים అనే పదబంధం దేనిని సూచిస్తుంది?
  choice: కహాతీయుల బాధ్యతలోని అతి పరిశుద్ధమైన వస్తువులు
  alternative: అతి పరిశుద్ధ స్థలం / మహాపరిశుద్ధ స్థలం
  rationale: తదుపరి వచనాలు గుడారపు సామగ్రిని కప్పడం, మోయడం గురించి చెబుతున్నందున వస్తువులు అనే భావం సందర్భానికి బాగా సరిపోతుంది. అయితే హీబ్రూ పదబంధానికి స్థలార్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘కుమారులు’ అనే మూల బంధుత్వ రూపాన్ని నిలిపాం; ‘వస్తువులకు సంబంధించిన’ అనే అనుసంధానం వాక్య సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
