  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: te
  text: ముప్పై ఏళ్ల వయసు నుండి యాభై ఏళ్ల వయసు వరకు, సమావేశపు గుడారంలో పని చేయడానికి సేవలోకి వచ్చే ప్రతి ఒక్కరినీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: ముప్పై ఏళ్ల వయసు మొదలుకొని
  rationale: בֶּן + సంఖ్య + שָׁנָה వయసును తెలిపే హీబ్రూ నుడికారం; וָמַעְלָה దిగువ వయోపరిమితి నుండి పైబడిన వారిని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: యాభై ఏళ్ల వయసు వరకు
  rationale: వయోపరిమితి యొక్క ఎగువ హద్దును స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל בָּא לַצָּבָא
  choice: సేవలో చేరే ప్రతి ఒక్కరిని
  rationale: בָּא అనే కృదంతం రావడం లేదా ప్రవేశించడాన్ని సూచిస్తుంది; צָבָא ఇక్కడ సైనిక యుద్ధాన్ని కాక క్రమబద్ధమైన లేవీయ సేవను సూచిస్తుంది. 'సేవలో చేరే' ఈ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: పని చేయడానికి
  rationale: కేటాయించిన పనిని చేయాలనే ఉద్దేశాన్ని సరళంగా నిలుపుతుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵד కు తెలుగులో స్థిరపడ్డ, అర్థవంతమైన అనువాదం; בְּ యొక్క స్థలసూచక భావాన్ని 'లో' నిలుపుతుంది.
theological_decisions:
- issue: צָבָא యొక్క సేవా లేదా సైనిక భావం
  choice: సేవ
  alternative: సైన్యం / దండు
  rationale: సంఖ్యాకాండము 4లో సందర్భం లేవీయులు ప్రత్యక్ష గుడారానికి చేసే క్రమబద్ధమైన పని; యుద్ధసేవ కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన శైలి. అయితే మూలపాఠంలో ప్రత్యక్ష ఆజ్ఞారూపమైన ‘లెక్కించాలి’ లేదు; 4:2లోని లెక్కింపు ఆజ్ఞకు ఈ వచనం కొనసాగింపుగా ఉండడం వల్ల తెలుగులో వాక్యపూర్ణత కోసం చేర్చబడింది.
