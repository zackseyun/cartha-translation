source:
  edition: WLC
  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: te
  text: కాబట్టి నువ్వూ, నీ సమూహమంతా యహ్వేకు వ్యతిరేకంగా కూడారు. అహరోను ఎవరు, మీరు అతనిపై సణుగుకోవడానికి?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి ఆరోపణ నుంచి మోషే తీసే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֲדָתְךָ
  choice: నీ సమూహమంతా
  rationale: కోరహుతో కూడిన వర్గాన్ని సూచిస్తుంది; సందర్భానికి తగిన సాధారణ పదం.
- source_word: הַנֹּעָדִים
  choice: కూడి ఉన్నారు
  rationale: ఒక ఉద్దేశంతో సమావేశమైనవారనే నిఫాల్ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; వారి ఉద్దేశాన్ని అవసరానికి మించి నిర్వచించదు.
- source_word: עַל יְהוָה
  choice: యెహోవాకు విరోధంగా
  rationale: తిరుగుబాటు సందర్భంలో עַל పదానికి ఉన్న ప్రతికూల, వ్యతిరేక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన YHWHను తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: అహరోను ఎంతటివాడు
  rationale: అసలు తిరుగుబాటు యెహోవాకు విరోధమైనదని చూపుతూ, అహరోను వ్యక్తిగత ప్రాముఖ్యాన్ని తగ్గించే అలంకారిక ప్రశ్నను నిలుపుతుంది.
- source_word: תלונו
  choice: సణుగుకోవడానికి
  rationale: అరణ్య కథనాల్లోని ప్రతికూలమైన, తిరుగుబాటు స్వభావం గల ఫిర్యాదును ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עָלָיו
  choice: అతనికి విరోధంగా
  rationale: ఫిర్యాదు అహరోనుకు వ్యతిరేకంగా మళ్లించబడిందనే adversative భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన నామరూపంగా ఉంచాం.
- issue: తిరుగుబాటు యొక్క అసలు లక్ష్యం
  choice: సమూహం యెహోవాకు విరోధంగా కూడిందని ప్రధానంగా చూపించి, అహరోనును అలంకారిక ప్రశ్నలో ద్వితీయంగా చూపడం
  alternative: వారు యెహోవాకు, అహరోనుకు సమానంగా విరోధంగా కూడారని చూపడం
  rationale: హీబ్రూ వాక్యనిర్మాణం మొదట యెహోవాకు విరోధంగా కూడడాన్ని పేర్కొని, తరువాత ‘అహరోను ఎంతటివాడు?’ అని అతని వ్యక్తిగత ప్రాముఖ్యాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ఏకవచన సంబోధన ‘నువ్వూ’ కోరహును ఉద్దేశిస్తుంది; తరువాతి బహువచన క్రియ మొత్తం సమూహాన్ని ఉద్దేశిస్తుంది. హీబ్రూలోని రెండు భాగాల వాక్య నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి అలంకారిక బలాన్ని నిలిపాం.
