base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: te
  text: '“ఇది చేయండి: కోరహా, నువ్వూ నీ సమూహమంతా ధూపపాత్రలను తీసుకొండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: మీరు చేయవలసింది ఇదే
  rationale: ముందుగా చెప్పబోయే ఆజ్ఞను సూచించే హెబ్రీయ సమాసాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קְחוּ לָכֶם
  choice: మీ కోసం ... తీసుకోండి
  rationale: బహువచన ఆజ్ఞతో పాటు לָכֶם లోని స్వప్రయోజన భావాన్ని నిలుపుతుంది.
- source_word: מַחְתּוֹת
  choice: ధూపపాత్రలు
  rationale: నిప్పుకణాలను ఉంచి ధూపం వేయడానికి ఉపయోగించే ఆరాధనా పాత్రలను ఈ సందర్భంలో సహజంగా సూచిస్తుంది; విస్తృతార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హెబ్రీ పేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְכָל עֲדָתוֹ
  choice: అతని సమూహమంతా
  rationale: עֵדָה అనే పదంలోని కూడిన సమాజం/సభ భావాన్ని, కోరహుకు సంబంధించిన వర్గం అనే సందర్భార్థంతో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆజ్ఞారూపం వాడబడింది. సంబోధనను తెలుగులో సహజంగా ఉండేందుకు వాక్యారంభంలో ఉంచి, మూలంలోని బహువచన ఆజ్ఞను నిలిపాం.
