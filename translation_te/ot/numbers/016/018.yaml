translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. కర్మకాండ సంబంధిత పదాలను సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ, హెబ్రీ వాక్యంలోని వరుస చర్యలు మరియు మోషే, అహరోనుల సమక్షతను నిలిపాం.
