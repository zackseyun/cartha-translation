  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: te
  text: అప్పుడు ప్రతి ఒక్కరూ తన ధూపపాత్రను[a] తీసుకొని, వాటిలో నిప్పు వేసి వాటిమీద ధూపం ఉంచి, మోషేతో, అహరోనుతో కలిసి ప్రత్యక్షపు గుడారపు ప్రవేశద్వారం దగ్గర నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిప్పుపాత్రను.’ హెబ్రీ పదం ధూపార్పణ కోసం మండుతున్న నిప్పులను ఉంచే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: ప్రతి ఒక్కరూ తమ ధూపపాత్రను
  rationale: אִישׁ ఇక్కడ సమూహంలోని ప్రతి వ్యక్తిని విడివిడిగా సూచిస్తుంది; ఏకవచన స్వామ్యప్రత్యయం ప్రతి ఒక్కరూ తమ సొంత పాత్రను తీసుకున్నారని తెలియజేస్తుంది. מַחְתָּה నిప్పులపై ధూపం వేయడానికి ఉపయోగించే పాత్ర; ఆధునిక తెలుగు ఆరాధనా సందర్భంలో ‘ధూపపాత్ర’ సహజంగా అర్థమవుతుంది.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: వాటిలో నిప్పు వేసి
  rationale: עַל అక్షరార్థంగా ‘వాటిమీద’ అయినా, పాత్రల్లో నిప్పును ఉంచే చర్యను తెలుగులో సహజంగా ‘వాటిలో నిప్పు వేశారు’ అని చెబుతారు.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: దానిపై ధూపం ఉంచారు
  rationale: ధూపం పాత్రలలోని నిప్పుపై ఉంచబడిన క్రమాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఉంచారు’ שׂים యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: קְטֹרֶת
  choice: ధూపం
  rationale: ఆరాధనలో కాల్చే సుగంధ పదార్థానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే ప్రవేశం లేదా ద్వారం. אֹהֶל מוֹעֵדకు తెలుగు బైబిలు వాడుకలో ప్రసిద్ధమైన ‘ప్రత్యక్ష గుడారం’ను తీసుకొని, స్థల సంబంధాన్ని సహజమైన తెలుగులో తెలిపాం.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోనులతో కలిసి
  rationale: స్థలవాక్యం తర్వాత వచ్చిన నామవాచక సముచ్చయం మోషే, అహరోనులు కూడా అక్కడ నిలబడ్డారని సూచిస్తుంది; తెలుగులో ‘తో కలిసి’ సహవాసాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
