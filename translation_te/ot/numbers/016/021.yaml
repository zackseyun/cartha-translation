id: NUM.16.21
reference: Numbers 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: te
  text: “నేను వారిని క్షణంలోనే నాశనం చేయడానికి, ఈ సమాజం[a] మధ్యనుండి మీరు విడిపోయి వెళ్లండి.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సభ.”
    reason: హీబ్రూ עֵדָהకు సందర్భానుకూలమైన నిఘంటు ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “ఒక్క క్షణంలో.”
    reason: హీబ్రూ כְּרָגַעకు సందర్భానుకూలమైన నిఘంటు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: మీరు వేరుగా వెళ్లండి
  rationale: בדל నిఫాల్ ఆజ్ఞార్థక బహువచనం ఇక్కడ సమూహం నుంచి స్పష్టంగా విడివడి వెళ్లాలనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִתּוֹךְ
  choice: మధ్యనుండి
  rationale: תוך తో కూడిన מן ఒక సమూహం లోపలి నుంచి బయటకు వేరుపడటాన్ని సూచిస్తుంది; ‘మధ్యనుండి’ దాని స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: הָעֵדָה הַזֹּאת
  choice: ఈ సమాజం
  rationale: עֵדָה ఇక్కడ కూడి ఉన్న ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: וַאֲכַלֶּה
  choice: నేను ... నాశనం చేస్తాను
  rationale: כלה యొక్క పియేల్ రూపం పూర్తిగా అంతం చేయడం అనే తీవ్రమైన తీర్పు భావాన్ని కలిగిస్తుంది. ఆజ్ఞ తరువాత వచ్చే ఈ రూపం ఉద్దేశించిన తదుపరి చర్యను తెలియజేస్తుంది; తెలుగు సమన్వయ వాక్యంలో సాధారణ భవిష్యద్రూపం సహజంగా ఉంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: తీర్పుకు గురయ్యే సమాజాన్ని సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: כְּרָגַע
  choice: క్షణంలో
  rationale: רֶגַע అతి స్వల్ప కాలాన్ని సూచిస్తుంది; ‘క్షణంలో’ చర్య యొక్క వేగాన్ని, ఆకస్మికతను సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పు ప్రకటన స్వభావం
  choice: సమాజాన్ని వేగంగా నాశనం చేసే నిజమైన దైవిక ఉద్దేశంగా అనువదించడం
  alternative: ‘వారితో వ్యవహరిస్తాను’ లేదా ‘వారిని తొలగిస్తాను’ అని తీవ్రతను తగ్గించడం
  rationale: ఈ సందర్భంలో כלה పూర్తిగా అంతం చేసే బలమైన తీర్పు భావాన్ని కలిగిస్తుంది. తరువాతి సిద్ధాంతపరమైన పరిష్కారాలను చేర్చకుండా వాక్యంలోని తీవ్రతను, ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, దైవిక ఆజ్ఞ మరియు తీర్పుకు తగిన గంభీరతతోనూ రూపొందించబడింది. మూలంలోని బహువచన ఆజ్ఞను ‘మీరు’తో స్పష్టం చేసింది.
