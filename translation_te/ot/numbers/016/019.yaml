source:
  edition: WLC
  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: te
  text: కోరహు వారికి వ్యతిరేకంగా సమాజమంతటినీ సమాగమపు గుడారం ప్రవేశద్వారం వద్ద సమకూర్చాడు. అప్పుడు యహ్వే[a] మహిమ సమాజమంతటికీ ప్రత్యక్షమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: సమకూర్చాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, కోరహే సమాజాన్ని కూడగట్టాడని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారిద్దరికీ విరోధంగా
  rationale: సందర్భంలో మోషే, అహరోనుల పట్ల ఉన్న ప్రతికూల వైఖరిని సూచిస్తుంది; ద్వివచన భావాన్ని తెలుగులో స్పష్టంగా చూపడానికి ‘వారిద్దరికీ’ వాడబడింది.
- source_word: כָּל־הָעֵדָה
  choice: సమాజమంతటినీ / సమాజమంతటికీ
  rationale: עֵדָה ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది; כָּל యొక్క సంపూర్ణతను ‘అంతటి’ ద్వారా నిలిపింది.
- source_word: אֶל־פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ప్రవేశద్వారం దగ్గర
  rationale: పదబంధంలోని స్థలాన్ని ఖచ్చితంగా తెలియజేస్తూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమైంది
  rationale: నిఫాల్ రూపం సూచించే కనిపించే దైవ ప్రత్యక్షతను, అది ఏ విధంగా జరిగిందో అదనంగా నిర్వచించకుండా వ్యక్తం చేస్తుంది.
- source_word: כְבוֹד יְהוָה
  choice: యహ్వే మహిమ
  rationale: దైవ సన్నిధి యొక్క ప్రత్యక్ష అభివ్యక్తిని సూచించే כָּבוֹד ను ‘మహిమ’గా, వ్యక్తిగత దైవనామాన్ని ‘యహ్వే’గా అనువదించింది.
- source_word: אֶל כָּל־הָעֵדָה
  choice: సమాజమంతటికీ
  rationale: ప్రత్యక్షత ఎవరికీ కలిగిందో తెలిపే దిశా/గ్రాహక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: హెబ్రీ మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘సమావేశ గుడారం’ మూలంలోని אֹהֶל מוֹעֵד కు దగ్గరగా ఉండే పదబంధం. ‘వారిద్దరికీ’ అనే రూపం పూర్వసందర్భంలోని మోషే, అహరోనులను సూచిస్తుంది.
