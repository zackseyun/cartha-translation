  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: te
  text: మోషే అది విన్నప్పుడు,[a] బోర్లాపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముఖం నేలకు ఆనించి పడ్డాడు.” హెబ్రీ నుడికారం అక్షరార్థంగా “తన ముఖంపై పడ్డాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: అది విన్నప్పుడు
  rationale: שׁמע ఇక్కడ కథన క్రమంలో ‘విన్నాడు’ అని అర్థం. హెబ్రీలో కర్మ స్పష్టంగా లేకపోయినా, ముందటి వచనంలోని మాటలను సూచించే ‘అది’ తెలుగులో సహజత్వం కోసం చేర్చబడింది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: సాష్టాంగపడ్డాడు
  rationale: ‘తన ముఖం మీద పడ్డాడు’ అనే హెబ్రీ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం. ఇది నేలపై ముఖం మోపి పడిన శరీర భంగిమను తెలియజేస్తుంది; ప్రార్థన, దుఃఖం, వినయం లేదా విజ్ఞాపనలో ఏది ఉద్దేశమో నిర్దిష్టంగా తేల్చదు.
theological_decisions:
- issue: మోషే భంగిమకు ఉన్న భావార్థం
  choice: శరీర చర్యను ‘సాష్టాంగపడ్డాడు’ అని మాత్రమే పేర్కొనడం
  alternative: ‘ప్రార్థించడానికి సాష్టాంగపడ్డాడు’ లేదా ‘దుఃఖంతో బోర్లాపడ్డాడు’
  rationale: హెబ్రీ పాఠం చర్యను చెబుతుంది గాని దాని ఉద్దేశాన్ని స్పష్టంగా వివరించదు. అందువల్ల ప్రార్థన, దిగ్భ్రాంతి, వినయం లేదా మధ్యవర్తిత్వం అనే భావాల్లో దేనినీ అనువాదంలో ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. ‘సాష్టాంగపడ్డాడు’ సాధారణ బైబిలు వాడుకలో అర్థమయ్యే సహజ నుడికారం; మూలంలోని స్పష్టతలేని భావాన్ని పాదటిప్పణి కాపాడుతుంది.
