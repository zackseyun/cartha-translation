  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇలా అన్నాడు: “ఈ కార్యాలన్నిటిని చేయడానికి యెహోవా నన్ను పంపాడనీ, నేను వాటిని నా సొంత ఆలోచనతో చేయలేదనీ దీనివల్ల మీరు తెలుసుకుంటారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ కార్యాలన్నిటిని చేయడానికి యెహోవా నన్ను పంపాడని దీనివల్ల మీరు తెలుసుకుంటారు; ఎందుకంటే ఇవి నా హృదయం నుండి వచ్చినవి కావు.” హీబ్రూలో “నా హృదయం నుండి కాదు” అనేది నా సొంత చొరవతో లేదా అధికారంతో కాదు అనే నుడికారం.
    reason: రెండవ כִּיని ‘మీరు తెలుసుకుంటారు’కు సంబంధించిన రెండవ విషయవాక్యంగా లేదా కారణార్థకంగా గ్రహించవచ్చు; అలాగే హీబ్రూ నుడికారం యొక్క అక్షరార్థం మరియు భావం రెండింటినీ నిలుపుతుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: అప్పుడు మోషే ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol కొనసాగింపును సహజమైన ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’తో వ్యక్తం చేస్తుంది.
- source_word: בְּזֹאת
  choice: దీనివల్ల
  rationale: ఇక్కడ בְּ సాధనార్థకంగా ఉంది; వెంటనే సంభవించబోయే సూచన లేదా సంఘటన మోషే మాటలను నిరూపిస్తుందని తెలియజేస్తుంది.
- source_word: תֵּדְעוּן
  choice: మీరు తెలుసుకుంటారు
  rationale: రెండవ పురుష బహువచన imperfect రూపానికి సందర్భానుగుణమైన భవిష్యదర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచుతుంది.
- source_word: שְׁלָחַנִי
  choice: నన్ను పంపాడని
  rationale: పూర్తయిన దైవిక నియామకాన్ని తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: ఈ కార్యాలన్నిటిని చేయడానికి
  rationale: מַעֲשִׂים అనేది చర్యలు లేదా కార్యాలను సూచిస్తుంది; ‘కార్యాలు’ గంభీరతతో కూడిన సహజమైన తెలుగు పదం.
- source_word: כִּי לֹא מִלִּבִּי
  choice: ఇవి నా సొంత ఆలోచనతో చేసినవి కావని
  rationale: ‘నా హృదయం నుండి కాదు’ అనే హీబ్రూ నుడికారాన్ని, స్వీయ చొరవ లేదా స్వంత సంకల్పం నుండి ఉద్భవించలేదనే భావంతో సహజమైన తెలుగులో అందిస్తుంది; రెండవ כִּיని ‘మీరు తెలుసుకుంటారు’పై ఆధారపడిన మరో విషయవాక్యంగా గ్రహిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది; ఆధునిక ప్రామాణిక తెలుగు బైబిల్ వాడుకలో ‘యెహోవా’ విస్తృతంగా గుర్తించబడే రూపం.
- issue: రెండవ כִּי యొక్క సంబంధం
  choice: ‘మీరు తెలుసుకుంటారు’కు సంబంధించిన రెండవ విషయవాక్యం
  alternative: ముందటి వాక్యానికి కారణార్థకంగా ‘ఎందుకంటే’
  rationale: హీబ్రూ నిర్మాణం రెండింటినీ అనుమతించగలిగినా, ‘యెహోవా నన్ను పంపాడు’ మరియు ‘ఇది నా హృదయం నుండి కాదు’ అనే రెండు విషయాలను రాబోయే సూచన నిరూపిస్తుందనే సమాంతర పఠనం సందర్భానికి బాగా సరిపోతుంది; కారణార్థక పఠనాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచన గాంభీర్యాన్ని కాపాడుతూ రూపొందించబడింది. ‘నా హృదయం నుండి కాదు’ అనే అక్షరార్థ నుడికారాన్ని ప్రధాన వాక్యంలో సహజీకరించి, పాదటిప్పణిలో మూలరూపం మరియు వ్యాకరణ ప్రత్యామ్నాయాన్ని నిలిపాం.
