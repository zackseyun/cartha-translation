  source_fidelity: 'హీబ్రూ ఆజ్ఞాత్మక నిర్మాణం దృఢంగా ప్రతిఫలించింది: “సమాజంతో ... చెప్పు” (דַּבֵּר אֶל־הָעֵדָה), తరువాతి ప్రత్యక్ష ఆజ్ఞ, అలాగే “చుట్టుపక్కల నుంచి పైకి వెళ్లిపోండి” ద్వారా הֵעָלוּ מִסָּבִיב భావం నిలిచింది. కోరహు, దాతాను, అబీరాము పేర్లు మరియు వారి నివాసస్థలానికి సంబంధించిన సంబంధం సరిగ్గా ఉన్నాయి.'
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది. “ఇలా చెప్పు” తరువాత ద్విబిందువు, ప్రత్యక్ష ఉల్లేఖనం వాడకం సజావుగా ఉంది. “పైకి వెళ్లిపోండి” అనేది అక్షరార్థ దిశను, సందర్భంలోని తొలగిపోవాలనే అత్యవసరతను రెండింటినీ తెలియజేస్తుంది.
  terminology: “సమాజం” הָעֵדָהకు సందర్భోచితమైన పదం. “నివాసం” מִשְׁכָּןకు ఇక్కడ తటస్థంగా, సహజంగా సరిపోతుంది; అనవసరంగా ప్రత్యేక మతపరమైన అర్థాన్ని రుద్దదు. వ్యక్తిపేర్ల తెలుగు రూపాలు స్థిరంగా, గుర్తించదగినవిగా ఉన్నాయి.
