  text: 'సమాజంతో ఇలా చెప్పు: ‘కోరహు, దాతాను, అబీరాము నివాసం చుట్టుపక్కల నుంచి పైకి వెళ్లిపోండి.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇశ్రాయేలు ప్రజల సమకూడిన సమూహాన్ని సూచించే సహజమైన, సందర్భోచితమైన పదం.
- source_word: הֵעָלוּ
  choice: పైకి వెళ్లిపోండి
  rationale: హీబ్రూ క్రియలోని ‘పైకి వెళ్లండి’ అనే దిశార్థాన్ని నిలుపుతూ, ప్రమాదస్థలం నుంచి తొలగిపోవాలనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִסָּבִיב לְמִשְׁכַּן
  choice: నివాసం చుట్టుపక్కల నుంచి
  rationale: מִשְׁכָּן ను ఇక్కడ వ్యక్తుల నివాసస్థలంగా తీసుకొని, מִסָּבִיב యొక్క పరిసరార్థాన్ని స్పష్టంగా నిలుపుతుంది.
