source:
  edition: WLC
  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: te
  text: భూమి తన నోరు తెరిచి వారిని, వారి ఇళ్లను[a], కోరహుకు చెందిన ప్రతి మనిషిని[b], వారి ఆస్తి అంతటినీ మింగివేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి ఇంటివారిని.” హీబ్రూ పదం భౌతిక ఇళ్లను లేదా విస్తృతార్థంలో ఇంటివారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కోరహుకు చెందిన వారందరిని.” హీబ్రూలో “ప్రతి మనిషి” అనే పదబంధం సమూహార్థంలో వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: భూమి తన నోరు తెరిచి
  rationale: హీబ్రూ వాక్యంలోని భూమిని వ్యక్తీకరించే ‘తన నోరు’ అనే సజీవ రూపకాన్ని యథాతథంగా నిలిపింది; פתח కు సహజమైన అర్థం ‘తెరవడం.’
- source_word: וַתִּבְלַע
  choice: మింగివేసింది
  rationale: בלע యొక్క ప్రత్యక్ష అర్థం ‘మింగడం’; సందర్భంలోని ఆకస్మికమైన, సంపూర్ణమైన చర్యను సహజ తెలుగులో ‘మింగివేసింది’ తెలియజేస్తుంది.
- source_word: בָּתֵּיהֶם
  choice: వారి ఇంటివారిని
  rationale: పదశః ‘వారి ఇళ్లు’ అయినప్పటికీ, בית కుటుంబం లేదా ఇంటివారిని కూడా సూచించగలదు. వ్యక్తులతో కూడిన కర్మల జాబితాలో ‘ఇంటివారు’ సందర్భానికి సహజంగా సరిపోతుంది; పదశః ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: కోరహుకు చెందిన వారందరిని
  rationale: ఏకవచన రూపంలోని אָדָם ఇక్కడ సమూహార్థకంగా వాడబడింది. తెలుగులో ‘వారందరిని’ ఆ సమూహ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; לְקֹרַח లోని అనుబంధాన్ని ‘కోరహుకు చెందిన’గా తెలిపింది.
- source_word: כָּל־הָרֲכוּשׁ
  choice: వారి ఆస్తి అంతటినీ
  rationale: רְכוּשׁ సంపద, సొత్తు లేదా ఆస్తిని సూచిస్తుంది. ‘ఆస్తి అంతటినీ’ ఆధునిక తెలుగులో స్పష్టంగా, సమగ్రంగా ఉంది.
theological_decisions:
- issue: כָּל־הָאָדָם లోని אָדָם యొక్క సమూహార్థం
  choice: కోరహుకు చెందిన వారందరిని
  alternative: కోరహుకు చెందిన ప్రతి మనిషిని
  rationale: వ్యాకరణ రూపం ఏకవచనమైనా, כָּל తో కూడిన ఈ ప్రయోగం సమూహాన్ని సూచిస్తుంది. తెలుగు ప్రధాన పాఠంలో సహజమైన సమూహార్థాన్ని ఉంచడం మూలభాష ఉద్దేశాన్ని లింగపరంగా అనవసరంగా కుదించకుండా కాపాడుతుంది; రూపపరంగా దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: בָּתֵּיהֶם భౌతిక ఇళ్లనా, కుటుంబ సభ్యులనా
  choice: వారి ఇంటివారిని
  alternative: వారి ఇళ్లను
  rationale: ఈ పదానికి రెండు భావాలూ సాధ్యమే. మింగబడిన వ్యక్తుల జాబితా సందర్భంలో కుటుంబ సభ్యులు అనే భావాన్ని ప్రధాన పాఠంలో ఎంచుకున్నప్పటికీ, అసలులోని నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని ‘భూమి తన నోరు తెరిచింది’ అనే వ్యక్తీకరణను నిలిపి, జాబితాను సహజ తెలుగు క్రమంలో అందించింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
