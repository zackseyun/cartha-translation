id: NUM.16.30
reference: Numbers 16:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: te
  text: కాని యాహ్వే కొత్తదేదైనా సృష్టించి[a], నేల తన నోరు తెరిచి వారినీ వారికి చెందిన సమస్తాన్నీ మింగివేసి, వారు సజీవులుగానే షియోల్‌లోకి[b] దిగిపోతే, ఈ మనుషులు యాహ్వేను తృణీకరించారని అప్పుడు మీరు తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలిసి ఉన్నాయి; అక్షరార్థంగా ‘ఒక సృష్టిని సృష్టించి’ అని కూడా అనువదించవచ్చు. ఈ ప్రయోగం దేవుడు చేసే అసాధారణమైన కొత్త కార్యాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘షియోల్’ అనేది మృతుల లోకాన్ని సూచించే హీబ్రూ పదం; సందర్భాన్ని బట్టి ‘సమాధి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: కొత్తదేదైనా సృష్టించి
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలిసి అసాధారణమైన దైవకార్యాన్ని నొక్కిచెబుతాయి. తెలుగులో అసహజమైన ‘సృష్టిని సృష్టించి’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో తప్పించి, భావాన్నీ ‘సృష్టించు’ అనే క్రియనూ నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: నేల తన నోరు తెరిచి
  rationale: אֲדָמָה ఇక్కడ వారి కిందనున్న నేలను సూచిస్తుంది; ‘తన నోరు తెరచడం’ అనే సజీవ చిత్రణను యథాతథంగా నిలిపాం.
- source_word: וּבָלְעָה
  choice: మింగివేసి
  rationale: వారిని పూర్తిగా కబళించే చర్యను సహజమైన, బలమైన తెలుగు క్రియ వ్యక్తం చేస్తుంది.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: వారికి చెందిన సమస్తాన్నీ
  rationale: హీబ్రూ పదబంధంలోని విస్తృత పరిధిని నిలిపి, అది కేవలం వస్తువులకే పరిమితమని అనవసరంగా నిర్ధారించలేదు.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: వారు సజీవులుగానే షియోల్‌లోకి దిగిపోతే
  rationale: ‘సజీవులుగా’ అనే ఆశ్చర్యకరమైన అంశానికి ‘-గానే’ ద్వారా తగిన ఉద్ఘాటన ఇచ్చి, שְׁאוֹל యొక్క విస్తృత భావాన్ని కేవలం ‘సమాధి’గా కుదించకుండా లిప్యంతరీకరించాం.
- source_word: וִידַעְתֶּם
  choice: అప్పుడు మీరు తెలుసుకుంటారు
  rationale: షరతుకు కలిగే ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: נִאֲצוּ
  choice: తృణీకరించారని
  rationale: దేవునిపట్ల చూపిన అవమానకరమైన నిరాదరణ, ధిక్కార భావాలను ఈ పదం సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ఈ మనుషులు
  rationale: మూలంలోని నిర్దిష్ట పురుష బహువచన సూచనను నిలిపాం.
theological_decisions:
- issue: שְׁאוֹל పదం అనువాదం
  choice: షియోల్
  alternative: మృతుల లోకం; సమాధి
  rationale: ఈ హీబ్రూ పదం ఒక నిర్దిష్ట సమాధికన్నా విస్తృతంగా మృతుల లోకాన్ని సూచించగలదు. లిప్యంతరీకరణ ఆ భావ విస్తృతినీ వేదాంతపరమైన అనిశ్చితినీ నిలుపుతుంది.
- issue: בְּרִיאָה יִבְרָא లోని దైవ సృజనాత్మక చర్య
  choice: కొత్తదేదైనా సృష్టించి
  alternative: ఒక కొత్త కార్యాన్ని జరిగించి; ఒక సృష్టిని సృష్టించి
  rationale: అది సాధారణ సంఘటనా, పూర్తిగా కొత్త రకమైన సృష్టిక్రియా అనే దానిని అతిగా నిర్వచించకుండా, కొత్తదనాన్నీ యెహోవా సృష్టించే చర్యనూ రెండింటినీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘నేల తన నోరు తెరిచి’, ‘సజీవులుగానే దిగిపోతే’ వంటి మూల చిత్రణలను నిలిపి, అధిక సంస్కృతీకరణను నివారించాం.
