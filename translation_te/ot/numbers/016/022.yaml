  text: וַ/יִּפְּל֤וּ עַל פְּנֵי/הֶם֙ וַ/יֹּ֣אמְר֔וּ אֵ֕ל אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר הָ/אִ֤ישׁ אֶחָד֙ יֶחֱטָ֔א וְ/עַ֥ל כָּל הָ/עֵדָ֖ה תִּקְצֹֽף־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: te
  text: 'అప్పుడు వారు సాష్టాంగపడి ఇలా అన్నారు: “దేవా, సమస్త శరీరుల ఆత్మల దేవా[a], ఒక మనిషి పాపం చేస్తే[b], సమాజమంతటిమీద కోపపడతావా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమస్త శరీరుల ఊపిరుల దేవా.” ఈ పఠనం దేవుడు సమస్త జీవులకు ఊపిరి, ప్రాణం ఇచ్చేవాడని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఒక మనిషి” అనే మాట ఇక్కడ ప్రతినిధిగా ఒక వ్యక్తిని సూచించవచ్చు; ఒక వ్యక్తి చేసిన పాపం కారణంగా సమాజమంతటిమీద కోపం రాకూడదనేది ఈ విజ్ఞప్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: వారు సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనించి పడడంలో ఉన్న వినయం, భయం, విజ్ఞాపన భావాలను సహజమైన ఆధునిక తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: אֵל
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం మూలంలోని పిలుపు భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: సకల శరీరుల ఆత్మలకు దేవుడా
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని, ‘ఆత్మలు’ అనే బహువచనాన్ని, ‘సకల శరీరులు’ అనే విస్తృత మానవార్థక హీబ్రూ నుడికారాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: הָאִישׁ אֶחָד
  choice: ఒక్కడు
  rationale: హీబ్రూలోని పురుష ఏకవచనాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతూ, ఒక వ్యక్తి చేసిన పాపం అనే వ్యత్యాసాన్ని బలంగా చూపుతుంది.
- source_word: יֶחֱטָא
  choice: పాపం చేస్తే
  rationale: తరువాతి ప్రశ్నతో సహజంగా అనుసంధానమయ్యే షరతు భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని క్రియార్థాన్ని అదనపు వివరణ లేకుండా ఉంచుతుంది.
- source_word: וְעַל כָּל־הָעֵדָה תִּקְצֹף
  choice: సమాజమంతటిమీద కోపపడతావా
  rationale: עַל‌ను కోపానికి గురయ్యే సమూహాన్ని సూచించే ‘మీద’గా, עֵדָהను ఇశ్రాయేలు సమూహార్థంలో ‘సమాజం’గా సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: ‘సకల శరీరుల ఆత్మలు’ అనే దైవ బిరుదు యొక్క మానవశాస్త్రీయ భావం
  choice: ప్రతి మనిషి అంతరాత్మను ఎరిగి, దానిపై అధికారం కలిగిన దేవునిని సూచించే బిరుదుగా ప్రధాన పాఠంలో ‘ఆత్మలు’ అని ఉంచడం
  alternative: సమస్త జీవులకు ఊపిరి లేదా ప్రాణం ఇచ్చే దేవునిని సూచించే బిరుదుగా ‘ఊపిరి’ అని అనువదించడం
  rationale: సందర్భంలో ఒకరి అపరాధాన్ని సమాజమంతటి అపరాధం నుండి వేరు చేయమని మోషే, అహరోనులు విజ్ఞప్తి చేస్తున్నారు. అయినప్పటికీ רוּחֹתకు ‘ఊపిరులు’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో నిలిపి, భావసందిగ్ధతను తొలగించలేదు.
- issue: הָאִישׁ אֶחָדలోని లింగం మరియు ప్రతినిధి భావం
  choice: పురుష ఏకవచనాన్ని ‘ఒక్కడు’గా నిలుపడం
  alternative: లింగనిరపేక్షంగా ‘ఒక వ్యక్తి’ అని అనువదించడం
  rationale: మూలపదం పురుష ఏకవచనంలో ఉంది. అది సందర్భంలో ఒక వ్యక్తిని ప్రతినిధిగా సూచించవచ్చుననే అవకాశాన్ని పాదటిప్పణిలో తెలిపినా, ప్రధాన పాఠంలో లింగరూపాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. ‘సాష్టాంగపడి’ సహజమైన ఆరాధనా నుడికారంగా వాడబడింది; ‘సకల శరీరులు’ మూలంలోని బైబిలీయ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. ప్రశ్న యొక్క తీవ్రతను, వ్యక్తిగత పాపం మరియు సామూహిక కోపం మధ్య ఉన్న ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా ఉంచింది.
