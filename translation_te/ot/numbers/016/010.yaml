revisions:
- from: ఆయన నిన్ను, నీతోపాటు లేవి కుమారులైన నీ సహోదరులందరినీ తన దగ్గరికి చేర్చుకున్నాడు; అయినా మీరు యాజకత్వాన్ని కూడా కోరుతున్నారా?
  to: ఆయన నిన్ను, నీతోపాటు లేవి కుమారులైన నీ సహోదరులందరినీ తన దగ్గరకు చేర్చాడు; అయినా మీరు యాజకత్వాన్ని కూడా కోరుతున్నారు.
  rationale: The revision removes the source-unmarked interrogative while retaining the adversative force of ‘అయినా,’ the shift from singular Korah to plural company, and the distinction between Levites and the priesthood. It also uses a more direct Telugu equivalent for ‘has brought near.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:52:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the singular ‘you’ followed by the plural address, the inclusion of Korah’s fellow Levites, and the distinction between Levitical privilege and priesthood. However, the Hebrew final clause is formally declarative (‘and you [plural] seek the priesthood also’), not an explicit question. The added Telugu question changes the clause’s form and gives it a rhetorical force not marked in the source.
  naturalness: The Telugu is generally clear and appropriately formal. ‘తన దగ్గరికి చేర్చుకున్నాడు’ is understandable, but ‘తన దగ్గరకు చేర్చాడు’ more directly represents the causative ‘brought near’ and avoids an unnecessarily reflexive nuance.
  terminology: ‘లేవి కుమారులు,’ ‘సహోదరులు,’ and ‘యాజకత్వం’ are suitable modern-standard Telugu renderings. ‘యాజకత్వం’ properly retains the status/office distinction at issue rather than reducing it to priestly service.
  issues:
  - severity: medium
    issue: 'The final clause is rendered as an explicit question: ‘కోరుతున్నారా?’'
    rationale: וּבִקַּשְׁתֶּם is a plural finite verb with no interrogative particle. Although the surrounding rebuke can imply rhetorical force, the translation should preserve the source’s declarative form.
  - severity: low
    issue: ‘చేర్చుకున్నాడు’ adds a slightly more personal/reflexive shading than the Hiphil ‘brought near.’
    rationale: ‘తన దగ్గరకు చేర్చాడు’ is more direct, natural, and keeps the cultic-access sense without adding an unnecessary nuance.
  revised_text: ఆయన నిన్ను, నీతోపాటు లేవి కుమారులైన నీ సహోదరులందరినీ తన దగ్గరకు చేర్చాడు; అయినా మీరు యాజకత్వాన్ని కూడా కోరుతున్నారు.
  revised_footnotes: []
  revision_rationale: The revision removes the source-unmarked interrogative while retaining the adversative force of ‘అయినా,’ the shift from singular Korah to plural company, and the distinction between Levites and the priesthood. It also uses a more direct Telugu equivalent for ‘has brought near.’
