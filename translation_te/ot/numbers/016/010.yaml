id: NUM.16.10
reference: Numbers 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: te
  text: ఆయన నిన్ను, నీతోపాటు లేవి కుమారులైన నీ సహోదరులందరినీ తన దగ్గరకు చేర్చాడు; అయినా మీరు యాజకత్వాన్ని కూడా కోరుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: తన దగ్గరికి చేర్చుకున్నాడు
  rationale: హిఫీల్ రూపంలోని קרב ‘దగ్గరికి తీసుకురావడం, సమీపించే అవకాశం కల్పించడం’ అనే అర్థాలను ఇస్తుంది. ఆరాధనా సేవకు దేవుడు అనుగ్రహించిన సమీపతనాన్ని, హోదాను ఈ పదబంధం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֹתְךָ
  choice: నిన్ను
  rationale: కోరహును వ్యక్తిగతంగా సూచించే ఏకవచన పుంలింగ ప్రత్యక్ష కర్మ.
- source_word: וְאֶת כָּל אַחֶיךָ בְּנֵי לֵוִי
  choice: లేవి కుమారులైన నీ సహోదరులందరినీ
  rationale: ‘నీ సహోదరులు’ అనే బంధుత్వ భాషను, వారిని వివరిస్తున్న ‘లేవి కుమారులు’ అనే వంశపరమైన గుర్తింపును రెండింటినీ నిలుపుతుంది.
- source_word: אִתָּךְ
  choice: నీతోపాటు
  rationale: కోరహుతో కలసి అతని తోటి లేవీయులు దేవుని సమీపానికి చేర్చబడ్డారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבִקַּשְׁתֶּם
  choice: అయినా మీరు ... కోరుతున్నారా?
  rationale: క్రియ బహువచనంలో ఉండి కోరహును, అతని వర్గాన్ని సమష్టిగా సంబోధిస్తుంది. సందర్భంలోని గద్దింపు, వ్యతిరేక భావాన్ని ‘అయినా’ చూపుతుంది; హీబ్రూ ప్రశ్నార్థక కణం లేకపోయినా సందర్భానుసారమైన వాక్చాతుర్య ప్రశ్నను తెలుగు సహజంగా వ్యక్తపరుస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: ఇప్పటికే లభించిన లేవీయ సేవకు అదనంగా మరొక హోదాను కోరుతున్నారనే భావాన్ని సూచిస్తుంది.
- source_word: כְּהֻנָּה
  choice: యాజకత్వాన్ని
  rationale: సాధారణ యాజక సేవను మాత్రమే కాక, అహరోను వంశానికి సంబంధించిన యాజక హోదా లేదా వ్యవస్థను సూచిస్తుంది.
theological_decisions:
- issue: లేవీయుల సేవకు, యాజకత్వానికి మధ్య ఆరాధనా హోదా భేదం
  choice: యాజకత్వాన్ని
  alternative: యాజక సేవను / యాజక పదవిని
  rationale: ఈ సందర్భంలో కోరహు వర్గం తమకు ఇప్పటికే అనుగ్రహించబడిన లేవీయ సేవకన్నా అహరోనీయ యాజక హోదాను కోరుతోంది. ‘యాజకత్వం’ ఆ సంస్థాగత, ధార్మిక భేదాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: దేవుని సమీపానికి చేర్చడం అనే ఆరాధనా భావం
  choice: తన దగ్గరికి చేర్చుకున్నాడు
  alternative: దగ్గరికి తీసుకొచ్చాడు
  rationale: కేవలం భౌతిక సమీపతనే కాక, దేవుని సేవలో ప్రవేశం మరియు ప్రత్యేక హోదా అనుగ్రహించబడిన భావాన్ని కూడా నిలుపుతుంది; అయితే దాని భావాన్ని ఒక నిర్దిష్ట సిద్ధాంతంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘లేవి కుమారులు,’ ‘సహోదరులు,’ ‘యాజకత్వం’ వంటి పదాలు మూలంలోని వంశ, బంధుత్వ, ఆరాధనా హోదా భాషను నిలుపుతున్నాయి.
