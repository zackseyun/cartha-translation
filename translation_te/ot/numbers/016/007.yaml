id: NUM.16.7
reference: Numbers 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: te
  text: రేపు యెహోవా సన్నిధిలో వాటిలో నిప్పు పెట్టి, వాటిమీద ధూపం వేయండి. అప్పుడు యెహోవా ఎవరిని ఎన్నుకుంటాడో అతడే పరిశుద్ధుడైనవాడు. లేవీ కుమారులారా, మీరు మితిమీరారు![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేవీ కుమారులారా, మీకు మరీ ఎక్కువైంది!”
    reason: రַב לָכֶם అనే హీబ్రూ నుడికారాన్ని మరింత అక్షరార్థంగా అనువదించే అవకాశం ఉంది.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: వాటిలో నిప్పు పెట్టి
  rationale: మునుపటి వచనంలోని ధూపార్తులను సూచించే స్త్రీలింగ బహువచన సర్వనామాన్ని ‘వాటిలో’గా సహజంగా వ్యక్తం చేసి, נתן ב అనే నిర్మాణంలోని ‘లోపల పెట్టడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: వాటిమీద ధూపం వేసి
  rationale: שים עַל ఇక్కడ ధూపార్తులలోని నిప్పుమీద ధూపం ఉంచడాన్ని సూచిస్తుంది. తెలుగు ఆరాధనా సందర్భంలో ‘ధూపం వేయడం’ సహజమైన ప్రయోగం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఆరాధనా సమర్పణ చేయడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מָחָר
  choice: రేపు
  rationale: సూటిగా ఉన్న కాలవాచక క్రియావిశేషణం.
- source_word: וְהָיָה
  choice: అప్పుడు
  rationale: ఈ పరీక్ష ఫలితాన్ని పరిచయం చేసే వాక్యసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: యెహోవా ఎవరిని ఎన్నుకుంటాడో
  rationale: రాబోయే ఎంపికను తెలిపే సంబంధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భంలో పురుషులే ఉన్నందున తదుపరి ఏకవచనం ‘అతడు’గా నిలుపబడింది.
- source_word: הוּא הַקָּדוֹשׁ
  choice: అతడే పరిశుద్ధుడు
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘అతడే’తో, విశేషణానికి ఉన్న నిర్దిష్ట ఉపపదాన్ని నామవాచక రూపమైన ‘పరిశుద్ధుడు’తో నిలుపుతుంది.
- source_word: רַב לָכֶם
  choice: మీరు మితిమీరారు
  rationale: అక్షరార్థంగా ‘మీకు చాలా/ఎక్కువ’ అనే ఈ సంక్షిప్త నుడికారం సందర్భంలో హద్దు మీరిన వారిపై గద్దింపుగా పనిచేస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు గద్దింపును ఇచ్చి, మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּנֵי לֵוִי
  choice: లేవీ కుమారులారా
  rationale: నేరుగా సంబోధించే కుటుంబవంశ పదబంధాన్ని ‘లేవీయులారా’గా సాధారణీకరించకుండా హీబ్రూ రూపానికి దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: הוּא הַקָּדוֹשׁ యొక్క నిర్దిష్టత
  choice: అతడే పరిశుద్ధుడు
  alternative: అతడు పరిశుద్ధుడు
  rationale: ఇది కేవలం గుణవర్ణనగా కాక, దేవుడు ఎంపికచేసిన వ్యక్తిని ప్రత్యేకంగా గుర్తించే ప్రకటనగా ఉన్నందున సర్వనామ ఉద్ఘాటనను, నిర్దిష్ట భావాన్ని నిలిపాం.
- issue: רַב לָכֶם గద్దింపు యొక్క భావం
  choice: మీరు మితిమీరారు
  alternative: మీకు మరీ ఎక్కువైంది
  rationale: యాజకత్వాన్ని సవాలు చేసిన సందర్భంలో ఈ మాట హద్దుమీరడాన్ని గద్దిస్తుంది; అయినా హీబ్రూ పదబంధంలోని పరిమాణాత్మక అస్పష్టతను పాదసూచికలో నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఆజ్ఞల క్రమం, రేపటి పరీక్ష, యెహోవా ఎంపిక, చివరి గద్దింపు అనే మూలవాక్య ప్రవాహం నిలుపబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని సంబంధిత గద్దింపు వద్ద ఉంచబడింది.
