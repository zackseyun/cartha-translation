id: NUM.16.5
reference: Numbers 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: te
  text: 'అతడు కోరహుతో, అతని సమాజమంతటితో ఇలా అన్నాడు: “ఉదయాన యాహ్వే తనవాడు ఎవరో, పవిత్రుడు ఎవరో తెలియజేస్తాడు[a]; అతన్ని తన దగ్గరికి రప్పిస్తాడు[b]. తాను ఎవరిని ఎన్నుకుంటాడో అతన్ని తన దగ్గరికి రప్పిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యాహ్వే తనవాడు ఎవరో తెలుసుకుంటాడు.” ఇక్కడ హెబ్రీ క్రియ, ఎవరు తనవారో యాహ్వే బహిరంగంగా చూపిస్తాడనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దగ్గరికి రప్పించడం” అనేది యాజక, ఆరాధనా సందర్భంలోని భాష; పవిత్ర సేవ కోసం యాహ్వే సన్నిధికి చేరడానికి అధికారపూర్వకంగా అనుమతించడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: దీనిలో ‘మాట్లాడాడు’ అనే కథన క్రియతో పాటు ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ‘అంటూ’ అనే భావం ఉంది. ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’ రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: עֲדָתוֹ
  choice: అతని సమాజమంతటి
  rationale: עֵדָה ఇక్కడ కోరహుతో కూడిన సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ అర్థాన్ని స్పష్టంగా ఉంచుతుంది; ‘మంతటి’ כל యొక్క సమగ్రతను వ్యక్తం చేస్తుంది.
- source_word: בֹּקֶר
  choice: ఉదయాన
  rationale: కాలాన్ని సూచించే ఈ నామవాచకం క్రియావిశేషణంగా వాడబడింది. ‘ఉదయాన’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: וְיֹדַע יְהוָה
  choice: యాహ్వే ... తెలియజేస్తాడు
  rationale: ידע యొక్క ప్రాథమిక అర్థం ‘తెలుసుకొను/తెలిసియుండు’; ఈ సందర్భంలో జరగబోయే పరీక్ష ద్వారా వ్యక్తి స్థితిని బహిరంగంగా వెల్లడించడం భావం. ప్రధాన పాఠంలో ‘తెలియజేస్తాడు’ సందర్భార్థాన్ని ఇస్తూ, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: తనవాడు ఎవరో
  rationale: ‘తనకు చెందినవాడు’ అనే స్వామ్య భావాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో నిలుపుతుంది.
- source_word: וְאֶת הַקָּדוֹשׁ
  choice: పవిత్రుడు ఎవరో
  rationale: విశేషణం నామవాచకంగా వాడబడింది. ‘పవిత్రుడు ఎవరో’ ముందున్న సమాంతర నిర్మాణాన్ని నిలుపుతూ, పవిత్ర సేవ కోసం ప్రత్యేకపరచబడిన వ్యక్తిని సూచిస్తుంది.
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: తన దగ్గరికి రప్పిస్తాడు
  rationale: קרב యొక్క హిఫీల్ రూపం ‘దగ్గరికి తీసుకురావడం/రానివ్వడం’ అనే కారణార్థాన్ని, ముఖ్యంగా పవిత్ర సేవలో అనుమతించబడిన సమీపతను సూచిస్తుంది. హెబ్రీ పునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: తాను ఎవరిని ఎన్నుకుంటాడో
  rationale: בחר యొక్క ఎంపిక భావాన్ని వ్యక్తిగతంగానూ సహజంగానూ తెలియజేస్తుంది; ఎంపిక చేసేవాడు యాహ్వేయే అని ‘తాను’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ידע అనే క్రియ దేవుడు అప్పుడే తెలుసుకుంటాడనే అర్థమా, లేక బహిరంగంగా తెలియజేస్తాడనే అర్థమా?
  choice: ప్రధాన పాఠంలో ‘తెలియజేస్తాడు’
  alternative: ‘తెలుసుకుంటాడు’ లేదా ‘ఎవరు తనవాడో యాహ్వేకు తెలుస్తుంది’
  rationale: సందర్భంలో ఉదయాన జరిగే పరీక్ష దేవుడు ఆమోదించిన వ్యక్తిని సమాజం ఎదుట వెల్లడిస్తుంది. అయినా హెబ్రీ క్రియ యొక్క అక్షరార్థమైన ‘తెలుసుకొను’ను పాదటిప్పణిలో ఉంచి అసలు భాషలోని భావ విస్తృతిని కాపాడాం.
- issue: יְהוָה దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూల పాఠం వ్యక్తిగత దైవిక నామాన్ని వాడుతుంది. దానిని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: ‘దగ్గరికి రప్పించడం’ యొక్క ఆరాధనా సంబంధ భావం
  choice: ప్రధాన పాఠంలో రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘పవిత్ర సేవకు అనుమతిస్తాడు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ పదబంధం యాహ్వే సన్నిధిలో అధికారపూర్వకంగా సేవ చేయడానికి అనుమతించడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో మూల రూపకాన్ని నిలిపి, దాని సాంస్కృతిక భావాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘సమాజం,’ ‘పవిత్రుడు,’ ‘ఎన్నుకుంటాడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, అరణ్య సమాజం మరియు పవిత్ర సేవ నేపథ్యాన్ని నిలుపుతాయి. హెబ్రీలో రెండుసార్లు వచ్చే ‘దగ్గరికి రప్పిస్తాడు’ అనే పదబంధాన్ని ఉద్దేశపూర్వకంగా పునరావృతం చేశాం.
