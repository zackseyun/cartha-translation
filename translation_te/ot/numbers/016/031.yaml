  yaml_path: translation/ot/numbers/016/031.yaml
  text: And as soon as he had finished speaking all these words, the ground beneath them split open.
translation:
  language: te
  text: అతడు ఈ మాటలన్నీ చెప్పడం ముగించగానే, వారి కింద ఉన్న నేల చీలిపోయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: చెప్పడం ముగించగానే
  rationale: ‘అతడు మాట్లాడడం ముగించినప్పుడు/ముగించగానే’ అనే కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వెంటనే జరిగిన పరిణామాన్ని సందర్భానుసారంగా ప్రతిబింబిస్తుంది.
- source_word: הָאֲדָמָה
  choice: నేల
  rationale: ఇక్కడ మనుషుల కిందనున్న భూమి ఉపరితలాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: וַתִּבָּקַע
  choice: చీలిపోయింది
  rationale: నిఫాల్ రూపంలోని ‘పగిలి తెరుచుకోవడం/చీలిపోవడం’ అనే భావాన్ని స్పష్టంగా, క్రియాశీల కారకుడిని చేర్చకుండా అందిస్తుంది.
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: వారి కింద ఉన్న
  rationale: సంబంధవాచక నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ, నేల వారి కిందనే ఉందని మూలంలోని భావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. మూలంలోని సంఘటనల తక్షణ క్రమాన్ని ‘ముగించగానే’ ద్వారా సహజంగా నిలిపింది.
