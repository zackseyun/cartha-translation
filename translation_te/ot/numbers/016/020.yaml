  terminology: Use “యాహ్వే” for יהוה, in alignment with the English POB’s “Yahweh” and the stated project treatment of the divine name. “మోషే” and “అహరోను” are standard Telugu biblical name forms; their oblique forms here are “మోషేతోను” and “అహరోనుతోను.”
