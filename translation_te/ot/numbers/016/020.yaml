base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతోను అహరోనుతోను ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; సాధారణంగా “యాహ్వే” అని లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దבר అనే క్రియ మాటలాడడాన్ని సూచిస్తుంది; לֵאמֹרతో కలిసి వచ్చే ఈ సాధారణ హీబ్రూ వాక్యప్రారంభ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా అన్నాడు’ అని వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షరి יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: ఇద్దరూ వాక్యానికి వేర్వేరు సంబోధితులని చూపే పునరుక్త אֶלను తెలుగులో ప్రతి పేరుకు ‘తో’ జోడించి నిలిపాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని సహజమైన తెలుగు సూచకపదం ‘ఇలా’తో తెలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా ఇవ్వాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ఉచ్చారణపై అనిశ్చితి ఉన్నప్పటికీ తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠ్యంలో ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా, కథన ప్రవాహానికి సహజంగా అనువదించబడింది. వచనం తరువాతి ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేస్తున్నందున చివరలో ద్విబిందువు వాడబడింది.
