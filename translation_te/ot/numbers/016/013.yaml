- from: పాలు తేనెలు ప్రవహించే దేశం నుండి మమ్మల్ని పైకి తీసుకొచ్చి, అరణ్యంలో మమ్మల్ని చంపడం చాలదన్నట్టు,[a] నీవు మాపై పెత్తనం కూడా చెలాయిస్తావా?[b]
  to: పాలు, తేనెలు ప్రవహించే దేశం నుండి మమ్మల్ని పైకి తీసుకువచ్చి అరణ్యంలో చంపడం చిన్న విషయమా?[a] పైగా నీవు మాపై పెత్తనం కూడా చెలాయించాలా?[b]
