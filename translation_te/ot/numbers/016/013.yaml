source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: te
  text: పాలు, తేనెలు ప్రవహించే దేశం నుండి మమ్మల్ని పైకి తీసుకువచ్చి అరణ్యంలో చంపడం చిన్న విషయమా?[a] పైగా నీవు మాపై పెత్తనం కూడా చెలాయించాలా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వక్తలు ఐగుప్తును వ్యంగ్యంగా ‘పాలు, తేనెలు ప్రవహించే దేశం’ అంటున్నారు. ఇతర చోట్ల ఈ మాట వాగ్దానదేశాన్ని వర్ణిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “నీవు మాపై పాలకునిగా కూడా అధికారము చెలాయించాలా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: చాలదన్నట్టు
  rationale: ఆగ్రహంతో కూడిన అలంకారప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘ఇది చిన్న విషయమా?’ అనే మరింత అక్షరార్థ రూపంలోని భావాన్ని నిలుపుతుంది.
- source_word: הֶעֱלִיתָנוּ
  choice: మమ్మల్ని పైకి తీసుకొచ్చి
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే నిర్గమణ-సంబంధిత గమనభావాన్ని కాపాడుతుంది.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం నుండి
  rationale: సమృద్ధిని సూచించే హీబ్రూ నుడికారాన్ని అక్షరార్థంగా ఉంచి, ఐగుప్తుకు వాగ్దానదేశపు వర్ణనను వర్తింపజేసిన వక్తల వ్యంగ్యాన్ని సందర్భమే తెలియజేయనిస్తుంది.
- source_word: לַהֲמִיתֵנוּ
  choice: మమ్మల్ని చంపడం
  rationale: ఉద్దేశాన్ని తెలిపే క్రియారూపంలోని నేరుగా, తీవ్రంగా ఉన్న ఆరోపణను సహజ తెలుగులో అందిస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: మִדְבָּר‌కు పంచగ్రంథ సందర్భంలో సాధారణమైన, ఇసుక ఎడారికే పరిమితం కాని తెలుగు పదం.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: పెత్తనం కూడా చెలాయిస్తావా
  rationale: పాలకునిగా తనను తాను నిలబెట్టుకొని ఆధిపత్యం చూపడం అనే שׂרר భావాన్ని, ధాతురూప పునరుక్తి ఇచ్చే తీవ్రతతో సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: మొదటి ఆరోపణకు తోడైన మరొక అభియోగాన్ని స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఐగుప్తును ‘పాలు తేనెలు ప్రవహించే దేశం’గా పేర్కొనడంలోని వ్యంగ్యం
  choice: ప్రధాన పాఠ్యంలో ఆ పదబంధాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మీరు చెప్పే పాలు తేనెలు ప్రవహించే దేశం’ వంటి వివరణతో వ్యంగ్యాన్ని బహిర్గతం చేయడం
  rationale: హీబ్రూ పాఠ్యం వ్యంగ్యాన్ని సందర్భం ద్వారానే తెలియజేస్తుంది. అనువాదంలో దానిని స్పష్టీకరించడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
- issue: שׂרר క్రియలోని పాలన మరియు ఆధిపత్య భావం
  choice: ‘పెత్తనం చెలాయించు’
  alternative: ‘మాకు పాలకునిగా చేసుకొను’
  rationale: సందర్భంలోని ఆరోపణాత్మక స్వరం మరియు హీబ్రూ పునరుక్తి తీవ్రతను సహజ తెలుగులో బలంగా నిలుపుతుంది; మోషే పాలన చట్టబద్ధమా కాదా అనే ప్రశ్నను అనువాదం స్వయంగా తీర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ ఆరోపణలోని కటుత్వాన్ని నిలిపే శైలి. ‘చాలదన్నట్టు’ అలంకారప్రశ్నను సహజంగా చేస్తుంది; ‘పెత్తనం చెలాయించు’ שׂרר యొక్క ప్రతికూల ఆధిపత్య భావాన్ని అందిస్తుంది. అన్ని పాదసూచి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
