  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: te
  text: అప్పుడు యాహ్వే నుండి అగ్ని బయలుదేరి, ధూపం అర్పిస్తున్న రెండువందల యాభై మందిని దహించివేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అధికారికంగా, “యాహ్వే సన్నిధి నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: అప్పుడు ... అగ్ని
  rationale: אֵשׁ అంటే ‘అగ్ని.’ వావ్ కథన క్రమాన్ని కొనసాగిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: יָצְאָה
  choice: బయలుదేరి
  rationale: יצא అంటే బయటకు రావడం లేదా బయలుదేరడం. ఇక్కడ అగ్ని దైవసన్నిధి నుండి వెలువడిన భావాన్ని ‘బయలుదేరి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵ/אֵת יְהוָה
  choice: యెహోవా సన్నిధి నుండి
  rationale: מֵאֵת అనేది మూలాన్ని సూచిస్తూ అక్షరార్థంగా ‘యెహోవా సమక్షం/సన్నిధి నుండి’ అనే భావాన్ని కలిగి ఉంది. ఇది హీబ్రూ పదబంధంలోని దైవసన్నిధి ఛాయను నిలుపుతుంది; యెహోవా అనే ఒడంబడిక నామాన్ని లిప్యంతరీకరించాం.
- source_word: וַ/תֹּאכַל
  choice: దహించివేసింది
  rationale: אכל అక్షరార్థంగా ‘తిను’; అగ్ని కర్తగా ఉన్నప్పుడు ‘దహించు/భస్మం చేయు’ అని అర్థం. ‘దహించివేసింది’ తీర్పు యొక్క తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: ఆ రెండువందల యాభై మందిని
  rationale: ఈ సంఖ్యాపదబంధం లెక్కించబడిన 250 మంది పురుషులను సూచిస్తుంది. సందర్భంలో ఇప్పటికే తెలిసిన సమూహం కాబట్టి హీబ్రూ నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో ప్రతిబింబించాం.
- source_word: מַקְרִיבֵי
  choice: అర్పిస్తున్న
  rationale: קרב యొక్క హిఫిల్ కృదంతం ఆ సమయంలో కొనసాగుతున్న అర్పణ చర్యచేత వారిని వర్ణిస్తుంది. ‘అర్పిస్తున్న’ ఆ కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: הַ/קְּטֹרֶת
  choice: ధూపం
  rationale: קְטֹרֶת ఆరాధనలో అర్పించే సుగంధ ధూపాన్ని సూచిస్తుంది. తెలుగులో ‘ధూపం’ స్పష్టమైన, సాధారణ పదం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; అసలు ఉచ్చారణపై అనిశ్చితి ఉన్నందున ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: מֵאֵת యొక్క దైవసన్నిధి భావం
  choice: యెహోవా సన్నిధి నుండి
  alternative: యెహోవా నుండి
  rationale: పదబంధం మూలం/ఏజెన్సీని సూచించగలిగినా, אֵת యొక్క ‘సమక్షం/సన్నిధి’ ఛాయను పూర్తిగా తొలగించకుండా ప్రధాన పాఠంలో నిలిపాం. సరళమైన మూలార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, గంభీరమైన తీర్పు స్వరాన్ని ఉపయోగించాం. ‘సన్నిధి నుండి’ మూలంలోని מֵאֵת పదబంధపు రూపబద్ధ ఛాయను నిలుపుతుండగా, పాదటిప్పణి మరింత సరళమైన అర్థాన్ని అందిస్తుంది.
