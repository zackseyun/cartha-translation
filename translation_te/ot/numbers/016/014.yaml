id: NUM.16.14
reference: Numbers 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: te
  text: నిజానికి, పాలు, తేనె ప్రవహించే దేశంలోకి నీవు మమ్మల్ని తీసుకురాలేదు; పొలాలనూ ద్రాక్షతోటలనూ వారసత్వంగా మాకు ఇవ్వలేదు. ఆ మనుష్యుల కళ్లను పెరికివేస్తావా?[a] మేము పైకి రాము.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మనుష్యులను గుడ్డివారిని చేస్తావా?” హీబ్రూ నుడికారం అక్షరార్థంగా “కళ్లను పెరికివేయడం”; వారిని నిజానికి గుడ్డివారిగా పరిగణించడం అనే భావం కూడా దీనిలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: నిజానికి, ... తీసుకురాలేదు
  rationale: אַף ఫిర్యాదును బలపరుస్తుంది; లֹאతో కూడిన నిరాకరణను సహజమైన ఆధునిక తెలుగులో గట్టిగా వ్యక్తం చేయడానికి ‘నిజానికి’ వాడబడింది.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశంలోకి
  rationale: సమృద్ధిని సూచించే స్థిరమైన హీబ్రూ రూపకాన్ని నిలుపుతూ, הֲבִיאֹתָנוּలోని గమన భావానికి ‘దేశంలోకి’ సరిపోతుంది.
- source_word: הֲבִיאֹתָנוּ
  choice: నీవు మమ్మల్ని తీసుకురాలేదు
  rationale: రూపపరంగా ప్రశ్నార్థకమైనా, సందర్భంలో ఇది నిందారోపణతో కూడిన అలంకారిక ప్రశ్న. తెలుగులో ప్రకటన రూపం ఆ ఆరోపణను సహజంగా అందిస్తుంది.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: పొలాలు, ద్రాక్షతోటలు స్వాస్థ్యంగా మాకు ఇవ్వనూ లేదు
  rationale: נַחֲלָהను వారసత్వంగా లభించే భాగం లేదా స్వాధీన ఆస్తి అనే భావంలో ‘స్వాస్థ్యం’గా అనువదించాం. ఏకవచన సమూహార్థక పదాలను సహజ తెలుగులో బహువచనంగా ఇచ్చాం.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: ఆ మనుష్యుల కళ్లను పెరికివేస్తావా?
  rationale: נקר పీయేల్ రూపంలోని కళ్లను పెరికివేయడం అనే తీవ్రమైన ప్రత్యక్ష చిత్రాన్ని ప్రధాన పాఠంలో నిలిపాం; మోసంతో నిజం కనిపించకుండా చేయడం అనే సాధ్యమైన వ్యంగ్యార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: לֹא נַעֲלֶה
  choice: మేము పైకి రాము
  rationale: עלה యొక్క ‘పైకి వెళ్లడం/రావడం’ అనే దిశాత్మక భావాన్ని, మోషే పిలుపును తిరస్కరించే సందర్భంలో ‘పైకి రాము’గా నిలిపాం.
