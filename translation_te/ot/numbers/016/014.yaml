translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. హీబ్రూలోని ప్రత్యక్షమైన, ఘాటైన కళ్లను పెరికివేసే చిత్రాన్ని తగ్గించకుండా ఉంచి, దాని సాధ్యమైన రూపకార్థాన్ని పాదసూచికలో సంరక్షించాం.
