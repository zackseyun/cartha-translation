  to: 'వారు మోషేకూ అహరోనుకూ వ్యతిరేకంగా గుమికూడి వారితో ఇలా అన్నారు: “మీరు హద్దు మీరారు![a] సమాజమంతా—వారిలో ప్రతి ఒక్కరూ—పరిశుద్ధులే; యాహ్వే వారి మధ్య ఉన్నాడు.[b] అలాంటప్పుడు యాహ్వే సమూహం పైన మిమ్మల్ని మీరు ఎందుకు హెచ్చించుకుంటున్నారు?”'
