source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: te
  text: 'వారు మోషేకూ అహరోనుకూ వ్యతిరేకంగా గుమికూడి వారితో ఇలా అన్నారు: “మీరు హద్దు మీరారు![a] సమాజమంతా—వారిలో ప్రతి ఒక్కరూ—పరిశుద్ధులే; యాహ్వే వారి మధ్య ఉన్నాడు.[b] అలాంటప్పుడు యాహ్వే సమూహం పైన మిమ్మల్ని మీరు ఎందుకు హెచ్చించుకుంటున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారానికి అక్షరార్థం: “మీకు చాలా” లేదా “మీ సంగతి చాలు.” ఇక్కడ అది కఠినమైన గద్దింపు.'
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే” అనేది יהוה (YHWH) అనే దైవనామానికి తెలుగు లిప్యంతరీకరణ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: వ్యతిరేకంగా గుమికూడి
  rationale: నిఫాల్ రూపంలోని సమూహంగా కూడడాన్ని ‘గుమికూడి’ సహజంగా తెలియజేస్తుంది; עַל ఈ ఘర్షణాత్మక సందర్భంలో ‘వ్యతిరేకంగా’ అనే భావాన్ని ఇస్తుంది.
- source_word: רַב לָכֶם
  choice: మీరు హద్దు మీరారు!
  rationale: అక్షరార్థంగా ‘మీకు చాలా’ లేదా ‘మీ సంగతి చాలు’ అనే కఠిన గద్దింపు. ఆధునిక తెలుగులో ఆరోపణ బలాన్ని సహజంగా వ్యక్తం చేయడానికి ‘హద్దు మీరారు’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: సమాజమంతా—వారిలో ప్రతి ఒక్కరూ—
  rationale: כָל ... כֻּלָּם లోని సంపూర్ణతను, పునరుద్ఘాటనను రెండు భాగాలుగానే నిలిపి ఉంచుతుంది.
- source_word: קְדֹשִׁים
  choice: పరిశుద్ధులే
  rationale: קדושׁ యొక్క ప్రామాణిక, ధార్మిక ప్రాధాన్యం గల అర్థాన్ని నిలుపుతూ, ‘ప్రతి ఒక్కరూ’ అనే వాదనలోని ఉద్ఘాటనకు ‘ఏ’ చేర్చబడింది.
- source_word: וּבְתוֹכָם יְהוָה
  choice: యెహోవా వారి మధ్య ఉన్నాడు
  rationale: సమాజం మధ్య దేవుని సన్నిధిని స్పష్టంగా తెలియజేస్తుంది; יהוה అనే వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: కంటే మిమ్మల్ని మీరు ఎందుకు హెచ్చించుకుంటున్నారు
  rationale: హిత్పయేల్ రూపంలోని స్వీయ-ఉన్నతీకరణ భావాన్ని ‘మిమ్మల్ని మీరు హెచ్చించుకోవడం’గా, עַל లోని ఇతరులపై/కంటే పైస్థాయికి లేవనెత్తుకునే భావాన్ని ‘కంటే’గా వ్యక్తం చేస్తుంది.
- source_word: קְהַל יְהוָה
  choice: యెహోవా సమూహం
  rationale: קהל ను ‘సమూహం’గా అనువదించడం ద్వారా ముందున్న עֵדָה (‘సమాజం’)తో స్వల్ప పదభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం. ఉచ్చారణకు సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: ‘సమాజమంతా ... పరిశుద్ధులే’ అనే కోరహు వర్గపు వాదనను ఎలా చూపాలి
  choice: మాట్లాడినవారి వాదనగానే ఎటువంటి వ్యాఖ్యాత్మక అర్హత లేకుండా నేరుగా అనువదించడం
  alternative: ‘పరిశుద్ధులని చెప్పుకుంటున్నారు’ వంటి సందేహార్థక లేదా విమర్శాత్మక పదజాలం చేర్చడం
  rationale: వచనం వారి వాదనను నివేదిస్తుంది; దానిపై కథనపు తీర్పును అనువాదంలో ముందుగానే చొప్పించకుండా ధార్మిక ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి వాడబడింది. ‘సమాజం/సమూహం’ ద్వారా עֵדָה/קהל పదభేదం సాధ్యమైనంతవరకు నిలుపబడింది. వక్తల ఆరోపణలోని తీవ్రతను ఆశ్చర్యార్థకం, ప్రశ్నార్థకం ద్వారా చూపించాం.
