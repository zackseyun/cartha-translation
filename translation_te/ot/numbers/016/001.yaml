revisions:
- from: లేవి కుమారుడైన కహాతు కుమారుడు ఇస్హారు కుమారుడైన కోరహు కొంతమంది మనుష్యులను తనతో చేర్చుకున్నాడు.[a] అతనితో రూబేను వంశస్థులైన ఏలీయాబు కుమారులు దాతాను, అబీరాము, పెలెతు కుమారుడు ఓను ఉన్నారు.
  to: లేవి కుమారుడైన కహాతు కుమారుడైన ఇస్హారు కుమారుడు కోరహు, అతనితో పాటు ఏలీయాబు కుమారులైన దాతాను, అబీరాము, పెలెతు కుమారుడైన ఓను—ఈ ముగ్గురూ రూబేను వంశస్థులు—మనుష్యులను తీసుకున్నారు.[a]
  rationale: The revision keeps the source’s full genealogy and makes Korah and the three named Reubenites joint participants in the action. It supplies only ‘men,’ as warranted by the immediate context and disclosed in the footnote, without introducing a further numerical or interpretive nuance.
