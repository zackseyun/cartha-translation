  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: te
  text: లేవి కుమారుడైన కహాతు కుమారుడైన ఇస్హారు కుమారుడు కోరహు, అతనితో పాటు ఏలీయాబు కుమారులైన దాతాను, అబీరాము, పెలెతు కుమారుడైన ఓను—ఈ ముగ్గురూ రూబేను వంశస్థులు—మనుష్యులను తీసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘తీసుకున్నాడు’ అని ఉంది; తీసుకున్నది ఏమిటో అక్కడ చెప్పలేదు. తరువాతి వచన సందర్భాన్ని బట్టి ‘మనుష్యులను’ చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: కొంతమంది మనుష్యులను తనతో చేర్చుకున్నాడు
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకున్నాడు’ అని అర్థం; అయితే హీబ్రూలో కర్మ చెప్పబడలేదు. తరువాతి వచనంలోని మనుష్యుల ప్రస్తావనను బట్టి తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘మనుష్యులను’ చేర్చబడింది. ‘తిరుగుబాటు చేశాడు’ వంటి అధిక వ్యాఖ్యానాన్ని నివారించి, సహచరులను కూడగట్టుకున్న భావాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించింది.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: లేవి కుమారుడైన కహాతు కుమారుడు ఇస్హారు కుమారుడు
  rationale: పునరుక్త ‘కుమారుడు’ నిర్మాణాన్ని నిలిపి, వంశావళి క్రమాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: ఏలీయాబు కుమారులు దాతాను, అబీరాము
  rationale: ఇద్దరూ ఏలీయాబు కుమారులని తెలిపే హీబ్రూ వంశసంబంధాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: పెలెతు కుమారుడు ఓను
  rationale: వ్యక్తినామాలను లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְּנֵי רְאוּבֵן
  choice: రూబేను వంశస్థులు
  rationale: ఇక్కడ ‘రూబేను కుమారులు’ అనేది ప్రత్యక్ష కుమారులకంటే గోత్ర/వంశ సభ్యత్వాన్ని సూచిస్తుంది; ‘వంశస్థులు’ ఆధునిక తెలుగులో ఆ భావాన్ని అపార్థం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రారంభ క్రియలో కర్మ లేకపోవడం
  choice: సందర్భం ఆధారంగా ‘కొంతమంది మనుష్యులను’ చేర్చి, దానిని పాదసూచికలో వెల్లడించడం
  alternative: కర్మను చేర్చకుండా ‘తీసుకున్నాడు’ అని మాత్రమే అనువదించడం; లేదా ‘తిరుగుబాటు చేశాడు/కూటమి కట్టాడు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: హీబ్రూ వాక్యంలో ఉద్దేశపూర్వకంగా లేదా శైలిపరంగా ఉన్న సంక్షిప్తతను పాదసూచిక తెలియజేస్తుంది. ప్రధాన పాఠం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంటుంది; అదే సమయంలో తిరుగుబాటు స్వభావాన్ని క్రియలోనే అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. పేర్లకు సుపరిచితమైన తెలుగు బైబిలు రూపాలు తీసుకోబడ్డాయి. పొడవైన హీబ్రూ వాక్యనిర్మాణాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి సంబంధాలను స్పష్టంచేశాం; మూలంలోని వంశావళి వివరాలు అన్నీ నిలిపాం.
