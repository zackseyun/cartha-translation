  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: te
  text: మీరు ఒక్కొక్కరు తమ నిప్పుపాత్రను[a] తీసుకొని, వాటిపై ధూపద్రవ్యాన్ని వేసి, ఒక్కొక్కరు తమ నిప్పుపాత్రను యాహ్వే[b] సన్నిధి ఎదుట తీసుకురండి—మొత్తం రెండువందల యాభై నిప్పుపాత్రలు. నువ్వూ అహరోనూ ఒక్కొక్కరు తమ నిప్పుపాత్రను తీసుకురండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిప్పుపాత్ర’ అంటే మండే బొగ్గులు ఉంచి వాటిపై ధూపద్రవ్యం వేయడానికి ఉపయోగించే పాత్ర; దీనిని ‘ధూపపాత్ర’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఇక్కడ దేవుని వ్యక్తిగత నామమైన יהוה (YHWH) ఉంది. దాని ప్రాచీన ఉచ్చారణ పూర్తిగా నిశ్చితం కాదు; ‘యెహోవా’ అనే రూపం కూడా సుపరిచితం, అనేక అనువాదాలు దీనిని ‘ప్రభువు’ అని సూచిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: మీలో ఒక్కొక్కరు తమ నిప్పుపాత్రను తీసుకొని
  rationale: బహువచన ఆజ్ఞతో పాటు ఉన్న אִישׁ మరియు ఏకవచన స్వామ్యరూపం పంపిణీ భావాన్ని ఇస్తాయి. తెలుగులో సహజంగా ‘ఒక్కొక్కరు తమ…’ అని వ్యక్తపరిచాం.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: నిప్పుపాత్ర / నిప్పుపాత్రలు
  rationale: ఇది నిప్పుకణాలు ఉంచి ధూపం వేయడానికి ఉపయోగించే పాత్ర. ‘నిప్పుపాత్ర’ మూలపద భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఆచార సంబంధమైన ‘ధూపపాత్ర’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: దానిపై ధూపద్రవ్యాన్ని వేసి
  rationale: עַל యొక్క ‘పై’ భావాన్ని నిలిపి, ప్రతి వ్యక్తి తన పాత్రపై ధూపద్రవ్యం వేయాలనే పంపిణీ సంబంధాన్ని తెలుగులో స్పష్టం చేశాం.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి తీసుకురావాలి
  rationale: קרב హిఫిల్ రూపంలోని ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ భావాన్ని సహజమైన తెలుగులో ఇచ్చాం; לִפְנֵי అనే దైవసన్నిధి ప్రయోగాన్ని ‘సన్నిధికి’గా అనువదించాం.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: రెండువందల యాభై నిప్పుపాత్రలు
  rationale: హీబ్రూ సంఖ్యా పదబంధాన్ని అక్షరరూపంలో సహజంగా ఇచ్చాం. ఇవి తిరుగుబాటు వర్గానికి చెందిన 250 పాత్రలు; తరువాత మోషే, అహరోనుల పాత్రలు వేరుగా పేర్కొనబడ్డాయి.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: నువ్వూ అహరోనూ కూడా ఒక్కొక్కరు తమ నిప్పుపాత్రను తీసుకురావాలి
  rationale: హీబ్రూలో క్రియను పునరుక్తి చేయని సంక్షిప్త నిర్మాణం ఉంది. తెలుగులో అర్థం సంపూర్ణంగా ఉండేందుకు ముందున్న క్రియను సహజంగా పూరించాం; ‘ఒక్కొక్కరు’ పంపిణీ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న దైవనామమే ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం; ఉచ్చారణ పూర్తిగా నిశ్చితం కాదనే విషయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పొడవైన సమన్వయ నిర్మాణాన్ని తెలుగులో మూడు వాక్యాలుగా విభజించాం; ఆజ్ఞ, 250 పాత్రల మొత్తం, మోషే-అహరోనుల అదనపు భాగస్వామ్యం అన్నీ నిలిపాం. ‘తమ’ను లింగతటస్థమైన సహజ పంపిణీ స్వామ్యరూపంగా వాడాం.
