id: NUM.16.8
reference: Numbers 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: te
  text: అప్పుడు మోషే కోరహుతో, “లేవి కుమారులారా, ఇప్పుడు వినండి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దయచేసి వినండి, లేవి కుమారులారా,” లేదా “ఇప్పుడు వినండి, లేవీయులారా.”
    reason: נָא అనే పదం ‘ఇప్పుడు’ అనే తక్షణతను లేదా ‘దయచేసి’ అనే మృదుత్వాన్ని సూచించగలదు; అలాగే בְּנֵי לֵוִי అక్షరార్థంగా ‘లేవి కుమారులు,’ భావార్థంగా ‘లేవీయులు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు ... అన్నాడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל־קֹרַח
  choice: కోరహుతో
  rationale: אֶל సంబోధన ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది; తెలుగులో ‘కోరహుతో ... అన్నాడు’ సహజమైన ప్రయోగం.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: ఇది שׁמע ధాతువు యొక్క బహువచన ఆజ్ఞారూపం; ‘వినండి’ గౌరవప్రదమైన/బహువచన పిలుపును, దాని వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: נָא
  choice: ఇప్పుడు
  rationale: నָא ఆజ్ఞను మృదువుగా చేయగలదు లేదా దానికి తక్షణతను జోడించగలదు. ఈ ఘర్షణాత్మక సందర్భంలో ‘ఇప్పుడు’ అత్యవసర పిలుపును సహజంగా వ్యక్తం చేస్తుంది; ‘దయచేసి’ కూడా సాధ్యమే.
- source_word: בְּנֵי לֵוִי
  choice: లేవి కుమారులారా
  rationale: మూలంలో ఉన్న ‘లేవి కుమారులు’ అనే పురుష బహువచన బంధుత్వ రూపాన్ని ప్రత్యక్ష సంబోధనగా నిలుపుతుంది; ‘లేవీయులారా’ అనేది సహజమైన ప్రత్యామ్నాయం అయినా రూపకాన్ని సాధారణీకరిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: קֹרַח
  choice: కోరహు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ లిప్యంతరీకరణ.
theological_decisions:
- issue: ప్రత్యక్ష సంబోధనలో లింగసూచక బంధుత్వ పదం
  choice: లేవి కుమారులారా
  alternative: లేవీయులారా / లేవి సంతానమా
  rationale: హీబ్రూ మూలం పురుష బహువచనమైన ‘కుమారులు’ అనే పదాన్ని వాడుతుంది. తక్షణ సందర్భంలో సంబోధించబడిన పురుష లేవీయులను సూచించే ఈ రూపాన్ని లింగనిరపేక్షంగా మార్చకుండా నిలుపుతూ, తెలుగులో సహజమైన సంబోధనగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. మూలంలోని బహువచన ఆజ్ఞ, పురుష బంధుత్వ రూపం, נָא యొక్క భావసందిగ్ధత నిలుపబడ్డాయి.
