source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: te
  text: 'అప్పుడు అతడు సమాజంతో ఇలా అన్నాడు: “దయచేసి ఈ దుష్టుల గుడారాల దగ్గర నుంచి దూరంగా వెళ్లండి. వారికి చెందిన దేనినీ ముట్టుకోవద్దు. లేకపోతే వారి పాపాలన్నిటితోపాటు మీరు కూడా తుడిచిపెట్టుకుపోతారు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పాపాలన్నిటి కారణంగా మీరు నాశనమవుతారు.” హీబ్రూ వాక్యాన్ని మరింత స్పష్టమైన కారణార్థంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇక్కడ עֵדָה సమకూడిన ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సమాజం’ సహజంగా ఉండి సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: סוּרוּ נָא
  choice: దయచేసి ... దూరంగా వెళ్లండి
  rationale: סוּר ఆ ప్రదేశం నుంచి తొలగిపోవాలనే ఆజ్ఞను, נָא విజ్ఞప్తితో కూడిన అత్యవసరతను తెలియజేస్తాయి.
- source_word: מֵעַל אָהֳלֵי
  choice: గుడారాల దగ్గర నుంచి
  rationale: מֵעַל యొక్క స్థలసంబంధ భావం ఇక్కడ గుడారాల పరిసరాల నుంచి తొలగిపోవడాన్ని సూచిస్తుంది; ‘దగ్గర నుంచి’ సందర్భాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: ఈ దుష్టులు
  rationale: רְשָׁעִים లోని నైతిక, న్యాయపరమైన ప్రతికూల భావాన్ని ‘దుష్టులు’ స్పష్టంగా అందిస్తుంది; సూచనాత్మక నిర్దిష్టతను ‘ఈ’ నిలుపుతుంది.
- source_word: וְאַל תִּגְּעוּ
  choice: ముట్టుకోవద్దు
  rationale: נגע యొక్క సూటి అర్థమైన తాకడం లేదా సంపర్కంలోకి రావడం అనే భావాన్ని అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: వారికి చెందిన దేనినీ
  rationale: నిషేధ వాక్యంలో వారి ఆస్తులన్నింటినీ సమగ్రంగా సూచించే సహజమైన తెలుగు నిర్మాణం.
- source_word: פֶּן תִּסָּפוּ
  choice: లేకపోతే ... తుడిచిపెట్టుకుపోతారు
  rationale: ספה నిఫాల్ రూపం తీర్పులో ఇతరులతోపాటు పూర్తిగా నాశనం కావడాన్ని సూచిస్తుంది. ‘తుడిచిపెట్టుకుపోతారు’ నిష్క్రియాత్మకమైన, సమూల తీర్పు భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל חַטֹּאתָם
  choice: వారి పాపాలన్నిటితోపాటు
  rationale: בְּ ఉపసర్గలోని సహవాసం లేదా సంబంధిత పరిస్థితి భావాన్ని నిలుపుతూ, తీర్పులో వారితో కలిసి నాశనం కావడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దుష్టులతో సంబంధం వల్ల వారి మీదికి వచ్చే తీర్పులో సమాజం కూడా చిక్కుకునే ప్రమాదం
  choice: వారి పాపాలతో సంబంధమున్న తీర్పులో వారితోపాటు తుడిచిపెట్టుకుపోయే ప్రమాదంగా వాక్యాన్ని అనువదించాం.
  alternative: ‘వారి పాపాలన్నిటి కారణంగా మీరు నాశనమవుతారు’ అని పూర్తిగా కారణార్థకంగా అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యం సమీపం, సహవాసం, పాపాలతో సంబంధమున్న తీర్పు మధ్య ఉన్న ఉద్రిక్తతను ఉంచుతుంది. ఇది వారి అపరాధం నేరుగా ఇతరులకు ఆపాదించబడిందని చెప్పకుండా, కేవలం కారణార్థానికి కూడా కుదించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘గుడారాల దగ్గర నుంచి’ స్థలసంబంధ హెచ్చరికను సహజంగా తెలియజేస్తుంది; ‘తుడిచిపెట్టుకుపోతారు’ రాబోయే తీర్పు తీవ్రతను సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
