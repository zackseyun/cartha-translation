id: NUM.16.29
reference: Numbers 16:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: te
  text: ఈ మనుషులు మానవులందరిలాగే చనిపోయి, మానవులందరికీ కలిగే గతి[a] వీరికీ కలిగితే, యహ్వే నన్ను పంపలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవులందరిపైకి వచ్చే సందర్శన వీరిపైకీ వస్తే.” హీబ్రూలో ఇక్కడ פקד అనే ఒకే ధాతువు నామవాచకంగానూ క్రియగానూ పునరావృతమైంది; అది సందర్శన, నియామకం లేదా ఎవరికైనా సంభవించేది అనే భావాలను కలిగి ఉండవచ్చు.
    reason: మూలంలోని పదపునరుక్తినీ פְּקֻדָּה/פקד పదాల అర్థవిస్తృతినీ తెలియజేయడం.
lexical_decisions:
- source_word: אִם
  choice: '...కలిగితే'
  rationale: హీబ్రూ షరతును తెలుగులో సహజంగా వాక్యాంతంలోని ‘అయితే/కలిగితే’ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: כְּמוֹת כָּל־הָאָדָם יְמֻתוּן אֵלֶּה
  choice: ఈ మనుషులు మానవులందరిలాగే చనిపోయి
  rationale: כְּמוֹת నిర్మాణంలోని పోలికను సహజమైన తెలుగులో నిలుపుతూ, אָדָם యొక్క సామూహిక మానవార్థాన్ని ‘మానవులందరు’ అని వ్యక్తం చేస్తుంది.
- source_word: וּפְקֻדַּת כָּל־הָאָדָם
  choice: మానవులందరికీ కలిగే గతి
  rationale: פְּקֻדָּה ఇక్కడ సాధారణంగా మనుషులకు కలిగే నియతి, పరిణామం లేదా సందర్శనను సూచించగలదు. ‘గతి’ సందర్భానికి సహజంగా ఉండి, శిక్ష అనే అర్థాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: יִפָּקֵד עֲלֵיהֶם
  choice: వీరికీ కలిగితే
  rationale: פקד ధాతువు సూచించే ‘వారిమీదికి రావడం/వారికి సంభవించడం’ అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; మూలంలోని పదపునరుక్తి పాదసూచికలో తెలియజేయబడింది.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: యెహోవా నన్ను పంపలేదు
  rationale: మోషేకు దేవుడు ఇచ్చిన పంపుదల నిజం కాదనే షరతుబద్ధమైన నిర్ధారణను నేరుగా అందిస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమైన చతురక్షర నామం ఉంది; అందువల్ల తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపం ఉపయోగించబడింది.
- issue: כָּל הָאָדָם యొక్క సామూహిక అర్థం
  choice: మానవులందరు
  alternative: మనుష్యులందరు
  rationale: ఇక్కడ אָדָם పురుషులను మాత్రమే కాక సాధారణ మానవజాతిని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ సమగ్ర అర్థాన్ని నిలుపుతుంది.
- issue: פְּקֻדָּה యొక్క సందర్భార్థం
  choice: గతి
  alternative: సందర్శన / శిక్ష / నియతి
  rationale: ఈ పదానికి పర్యవేక్షణ, సందర్శన, నియామకం, సంభవించే పరిణామం వంటి విస్తృత అర్థాలు ఉన్నాయి. సందర్భంలో ‘గతి’ సాధారణ మానవ పరిణామాన్ని సూచిస్తూ, దానిని తప్పనిసరిగా శిక్షగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘గతి’ సాధారణ పాఠకులకు అర్థమయ్యే పదం; అయితే మూలంలోని న్యాయపరమైన లేదా ‘సందర్శన’ భావసంభావ్యతను పాదసూచికలో కాపాడింది.
