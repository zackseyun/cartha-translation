base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు[a] యాహ్వే మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “మరియు యాహ్వే మోషేతో మాట్లాడుతూ ఇలా అన్నాడు.” ప్రారంభ సంధిని “అప్పుడు”కు బదులుగా “మరియు” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది. మాటల పరిచయ సూత్రంలో ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటాన్ని సూచించే సందర్భంలో אֶל యొక్క భావాన్ని ఆధునిక తెలుగులో సహజమైన సహచర్య విభక్తి ‘తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ రూపం తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ద్విరుక్తి లేకుండా ఆ కార్యాన్ని కోలన్‌తో సహజంగా సూచించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం; సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి ప్రత్యక్ష వాక్యంతో ఈ వచనానికి ఉన్న అనుసంధానాన్ని కోలన్ కాపాడుతుంది.
