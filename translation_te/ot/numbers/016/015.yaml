language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: te
  text: అప్పుడు మోషేకు చాలా కోపం వచ్చింది. అతడు యాహ్వేతో, “వారి అర్పణను పరిగణించవద్దు[a]. వారిలో ఒక్క గాడిదనైనా నేను తీసుకోలేదు; వారిలో ఒక్కరికీ హాని చేయలేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి అర్పణను అనుకూలంగా చూడవద్దు,” లేదా “వారి అర్పణను అంగీకరించవద్దు.” హీబ్రూ వాక్యం అక్షరార్థంగా “వారి అర్పణవైపు తిరగవద్దు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: మోషేకు చాలా కోపం వచ్చింది
  rationale: కోపం రగులుకోవడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, מְאֹד సూచించే తీవ్రతను ‘చాలా’తో నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: వారి అర్పణవైపు తిరగవద్దు
  rationale: פנה אל లోని ‘వైపు తిరుగు’ అనే రూపకాన్ని నిలుపుతుంది; ఈ ప్రార్థనా సందర్భంలో అది అనుకూలంగా చూడడం లేదా అంగీకరించడం అనే భావాన్ని కూడా సూచించవచ్చు, కాబట్టి ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
- source_word: מִנְחָתָם
  choice: వారి అర్పణ
  rationale: מִנְחָה కానుక, కప్పం లేదా అర్పణను సూచించగలదు. తక్షణ సందర్భం ధాన్యార్పణ అని తప్పనిసరిగా నిర్దిష్టపరచనందున ‘అర్పణ’ అనే విస్తృత పదాన్ని ఎంచుకుంది.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: వారిలో ఒక్క గాడిదనైనా నేను తీసుకోలేదు
  rationale: నాయకుడిగా మోషే వారిని వస్తుపరంగా దోచుకోలేదనే వాదనను, హీబ్రూలోని స్పష్టమైన గాడిద ఉదాహరణతో సహజంగా తెలుపుతుంది.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: వారిలో ఒక్కరికీ హాని చేయలేదు
  rationale: רעע హిఫీల్ రూపంలోని హాని చేయడం లేదా చెడు చేయడం అనే భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
- issue: దేవుడు అర్పణవైపు ‘తిరగకూడదు’ అనే వాక్యంలోని భావం
  choice: రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతూ అర్థవికల్పాలను పాదసూచికలో ఇవ్వడం
  alternative: వారి అర్పణను లక్ష్యపెట్టవద్దు; వారి అర్పణను అంగీకరించవద్దు
  rationale: పదబంధం అనుకూల దృష్టి లేదా అంగీకారాన్ని సూచించవచ్చు; అయితే వాటిలో ఒక్క భావాన్నే ఖరారు చేస్తే మూలంలోని ఉద్దేశపూర్వక విస్తృతి తగ్గుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సహజ భావవికల్పాలను పాదసూచికలో ఇచ్చింది.
