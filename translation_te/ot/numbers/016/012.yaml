translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. ‘పైకి రాము’ అనే పదబంధం మూలంలోని దిశాసూచక అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
