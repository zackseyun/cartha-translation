id: NUM.16.12
reference: Numbers 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: te
  text: అప్పుడు మోషే ఎలీయాబు కుమారులైన దాతానును అబీరామును పిలిపించడానికి పంపాడు. అయితే వారు, “మేము పైకి రాము[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము పైకి వెళ్లము.” హీబ్రూ క్రియకు అక్షరార్థంగా “పైకి వెళ్లడం/ఎక్కడం” అని అర్థం. ఇక్కడ అది మోషే ఉన్న చోటికి వెళ్లడాన్ని లేదా అతని పిలుపు మేరకు అతని ఎదుట హాజరవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపాడు
  rationale: మోషే వారిని పిలిపించడానికి దూతలను పంపిన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; పంపబడినవారు ఎవరో మూలంలో నిర్దిష్టంగా లేనందున సాధారణ పదాన్ని వాడాం.
- source_word: לִקְרֹא
  choice: పిలిపించడానికి
  rationale: ఈ సందర్భంలో קרא అనేది సాధారణంగా పేరు పెట్టి పిలవడం కాక, తన దగ్గరకు రమ్మని కబురు పంపడం లేదా సమన్లు చేయడం అనే భావాన్ని ఇస్తుంది.
- source_word: דָתָן וַאֲבִירָם
  choice: దాతానును అబీరామును
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాల్లో లిప్యంతరీకరించాం.
- source_word: בְּנֵי אֱלִיאָב
  choice: ఎలీయాబు కుమారులైన
  rationale: దాతాను, అబీరాము ఇద్దరినీ ఎలీయాబు కుమారులుగా గుర్తించే మూలంలోని సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో ఉంచాం.
- source_word: וַיֹּאמְרוּ
  choice: అయితే వారు ... అన్నారు
  rationale: హీబ్రూ waw కథనాన్ని కొనసాగించినా, ఇక్కడ మోషే పిలుపుకు వారి నిరాకరణ వ్యతిరేక ప్రతిస్పందన కాబట్టి ‘అయితే’ సందర్భ సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: לֹא נַעֲלֶה
  choice: మేము పైకి రాము
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం/రావడం’ భావాన్ని నిలుపుతూ, imperfect రూపంలోని దృఢమైన నిరాకరణను ‘రాము’గా వ్యక్తపరచాం.
