- from: అప్పుడు మోషే లేచి దాతాను, అబీరాము దగ్గరికి వెళ్లాడు. ఇశ్రాయేలు పెద్దలు అతని వెనుక వెళ్లారు.
  to: అప్పుడు మోషే లేచి దాతాను మరియు అబీరాము దగ్గరికి వెళ్లాడు. ఇశ్రాయేలు పెద్దలు అతని వెనుక వెళ్లారు.
