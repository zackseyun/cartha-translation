source:
  edition: WLC
  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וַ/יֵּ֖לֶךְ אֶל דָּתָ֣ן וַ/אֲבִירָ֑ם וַ/יֵּלְכ֥וּ אַחֲרָ֖י/ו זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: te
  text: అప్పుడు మోషే లేచి దాతాను మరియు అబీరాము దగ్గరికి వెళ్లాడు. ఇశ్రాయేలు పెద్దలు అతని వెనుక వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום క్రియ ఇక్కడ వరుస కథన చర్యను సూచిస్తుంది. ‘లేచి’ అనేది చర్యకు ఉపక్రమించేందుకు లేవడాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך సాధారణంగా ‘వెళ్లు/నడుచు’ అని అర్థం. ఇక్కడ ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘వెళ్లాడు’ సహజమైన కథన రూపం.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: వ్యక్తుల వైపు సాగి వారి వద్దకు వెళ్లడాన్ని సందర్భానుసారంగా ‘దగ్గరికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּתָן וַאֲבִירָם
  choice: దాతాను, అబీరాము
  rationale: వ్యక్తి పేర్లను ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లారు
  rationale: ఇది הלך క్రియ యొక్క బహువచన రూపం. తరువాతి אַחֲרָיו అనుసరణ భావాన్ని అందిస్తున్నందున, క్రియను ‘వెళ్లారు’గా ఉంచడం మూల నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אַחֲרָיו
  choice: అతని వెనుక
  rationale: మోషే వెనుకగా, అతన్ని అనుసరిస్తూ కదలడాన్ని ఈ పదబంధం సూచిస్తుంది. ‘అతని వెనుక’ మూలంలోని దృశ్యాత్మకతను నిలుపుతుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: ఇది ఇశ్రాయేలు సమాజంలోని గుర్తింపు పొందిన పెద్దలను లేదా నాయకులను సూచించే construct phrase. ‘ఇశ్రాయేలు పెద్దలు’ పారదర్శకమైన, ప్రాచుర్యంలో ఉన్న తెలుగు రూపం.
- source_word: וַ
  choice: అప్పుడు
  rationale: వచనారంభంలోని waw కథనాన్ని తదుపరి వరుస చర్యకు తీసుకెళ్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
