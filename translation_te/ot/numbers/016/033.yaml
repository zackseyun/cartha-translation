source:
  edition: WLC
  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: te
  text: వారు—వారూ, వారికి చెందిన సమస్తమూ—సజీవులుగానే షెయోలులోకి[a] దిగిపోయారు. భూమి వారిని కప్పివేసింది; వారు సమాజం మధ్యనుండి నశించిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాధి’ లేదా ‘మృతుల లోకం.’ హీబ్రూలో ‘షెయోల్.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: దిగిపోయారు
  rationale: ירד అనే క్రియ యొక్క కిందికి వెళ్లే కథన చలనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: వారూ, వారికి చెందిన సమస్తమూ
  rationale: ఈ హీబ్రూ పదబంధం మనుషులు, వస్తువులు రెండింటినీ కలుపుకోగలదు; ‘సమస్తమూ’ ఆ విస్తృతిని అనవసరంగా కుదించదు.
- source_word: חַיִּים
  choice: సజీవులుగానే
  rationale: వారు ఇంకా బతికుండగానే దిగిపోయారనే ఉద్ఘాటనను ‘గానే’ సహజంగా నిలుపుతుంది.
- source_word: שְׁאֹלָה
  choice: షెయోలులోకి
  rationale: దిశను తెలిపే ప్రత్యయాన్ని ‘లోకి’ ప్రతిబింబిస్తుంది; షెయోల్‌ను కేవలం సమాధిగా కుదించకుండా మూలపదాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: భూమి వారిని కప్పివేసింది
  rationale: భూమినే కర్తగా ఉంచి, כסה యొక్క స్పష్టమైన దృశ్యాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיֹּאבְדוּ
  choice: నశించిపోయారు
  rationale: אבד ఇక్కడ సూచించే నాశనం లేదా అంతరించిపోవడాన్ని, దాని విధానాన్ని అదనంగా నిర్దేశించకుండా తెలియజేస్తుంది.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: సమాజం మధ్యనుండి
  rationale: קהל యొక్క కూడిన ప్రజాసమూహ భావాన్ని ‘సమాజం’ అందిస్తుంది; ‘మధ్యనుండి’ హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: שְׁאֹל పదం అనువాదం
  choice: షెయోల్
  alternative: సమాధి; మృతుల లోకం
  rationale: ఈ పదం కేవలం ఒక సమాధి గోతికంటే విస్తృతమైన మృతుల లోక భావాన్ని కలిగి ఉంది. లిప్యంతరీకరణ దాని పాత నిబంధన సంబంధిత భావవిస్తృతిని నిలుపుతూ, తరువాతి కాలపు ‘నరకం’ సిద్ధాంతాన్ని వాక్యంలోకి దిగుమతి చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని వరుస చర్యలను చిన్న వాక్యాలుగా స్పష్టంగా ఇచ్చి, ‘షెయోల్’ అనే భావపరమైన అస్పష్టతను పాదటిప్పణిలో వివరించాం.
