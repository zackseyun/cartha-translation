reference: Numbers 16:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: te
  text: అప్పుడు వారు కోరహు, దాతాను, అబీరాముల నివాసస్థలం[a][b] చుట్టుపక్కల నుండి దూరంగా వెళ్లిపోయారు. దాతాను, అబీరాము తమ భార్యలతో, కుమారులతో, చిన్నపిల్లలతో కలిసి బయటికి వచ్చి తమ గుడారాల ప్రవేశద్వారాల వద్ద నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోరహు, దాతాను, అబీరాముల నివాసస్థలం చుట్టుపక్కల నుండి పైకి వెళ్లారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “పైకి వెళ్లారు” అని అర్థం; అయితే ఇక్కడ అది ఆ ప్రాంతం నుంచి తొలగిపోవడాన్ని సూచించే నుడికారంగా వాడబడినట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “నివాసస్థలం” ఇక్కడ కోరహు, దాతాను, అబీరాములతో సంబంధమున్న నివాసస్థలాన్ని లేదా శిబిరభాగాన్ని సూచిస్తుంది; ఇది యెహోవా ప్రత్యక్షపు గుడారాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: చుట్టుపక్కల నుండి దూరంగా వెళ్లిపోయారు
  rationale: యָלָה అనే క్రియ అక్షరార్థంగా ‘పైకి వెళ్లారు’ అని ఉన్నా, מֵעַל మరియు מִסָּבִיבలతో కూడిన ఈ సందర్భంలో ఆ ప్రదేశం నుంచి వెనక్కి తొలగడమే భావం. ఆధునిక తెలుగులో ‘దూరంగా వెళ్లిపోయారు’ ఆ కదలికను సహజంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִשְׁכַּן
  choice: నివాసం
  rationale: ఇక్కడ ఇది యెహోవా పరిశుద్ధ నివాసాన్ని సూచించదు; కోరహు, దాతాను, అబీరాములతో సంబంధమున్న నివాసస్థలాన్ని లేదా శిబిరభాగాన్ని సూచిస్తుంది. ‘నివాసం’ ఈ తేడాను స్పష్టంగా ఉంచుతుంది.
- source_word: יָצְאוּ
  choice: బయటికి వచ్చి
  rationale: దాతాను, అబీరాము తమ గుడారాల నుంచి కనిపించేలా వెలుపలికి రావడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: נִצָּבִים
  choice: నిలబడ్డారు
  rationale: వారు గుడారాల ప్రవేశద్వారం వద్ద ఉన్న భంగిమను నేరుగా తెలియజేస్తుంది; ‘ఎదిరించి నిలబడ్డారు’ వంటి సందర్భానుమానాన్ని పదంలోకి చేర్చదు.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: తమ గుడారాల ప్రవేశద్వారం దగ్గర
  rationale: బహువచనమైన ‘వారి గుడారాలు’ను నిలుపుతూ, వాటి ప్రవేశం వద్దనున్న స్థలాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּנְשֵׁיהֶם
  choice: తమ భార్యలతో
  rationale: కుటుంబ సభ్యులు వారితో పాటు ఉన్నారనే సహచర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבְנֵיהֶם
  choice: కుమారులతో
  rationale: తరువాతి טַף చిన్నపిల్లలను ప్రత్యేకంగా పేర్కొంటుంది కాబట్టి, בניםను విస్తృతమైన ‘పిల్లలు’గా కాక ‘కుమారులు’గా అనువదించి మూలంలోని భేదాన్ని నిలిపాం.
- source_word: וְטַפָּם
  choice: చిన్నపిల్లలతో
  rationale: טַף చిన్న పిల్లలు లేదా ఆధారపడిన చిన్నవారిని సూచిస్తుంది. ‘చిన్నపిల్లలు’ స్పష్టమైనది, సహజమైనది, దృశ్యంలోని గంభీరతను నిలుపుతుంది.
