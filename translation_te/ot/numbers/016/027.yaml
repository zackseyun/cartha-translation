translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన కథన శైలి వాడబడింది. ‘నివాసం’ అనే పదం పరిశుద్ధ గుడారంతో గందరగోళం రాకుండా చేస్తుంది; ‘నిలబడ్డారు’ అనే తటస్థ పదం ధిక్కార భావాన్ని మూలపదానికి మించి జోడించదు. పాదసూచిక సూచిక [a] ప్రధాన వచనంలో ఉంచబడింది.
