id: NUM.16.16
reference: Numbers 16:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: te
  text: 'మోషే కోరహుతో ఇలా అన్నాడు: “నువ్వూ, నీ సమాజమంతా రేపు యహ్వే సన్నిధిలో ఉండండి—నువ్వూ, వారూ, అహరోనూ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל קֹרַח
  choice: మోషే కోరహుతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: నువ్వూ, నీ సమాజమంతా
  rationale: עֵדָה ఇక్కడ కోరహుతో కలిసి ఉన్న సమూహాన్ని సూచిస్తుంది; ‘సమాజం’ సామూహిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הֱיוּ
  choice: ఉండండి
  rationale: హీబ్రూ היה క్రియ యొక్క బహువచన ఆజ్ఞార్థక రూపాన్ని నేరుగా నిలుపుతూ, సన్నిధిలో హాజరై ఉండాలనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనే పదబంధంలోని ‘ఎదుట/సన్నిధిలో’ భావాన్ని స్పష్టమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: నువ్వూ, వారూ, అహరోనూ
  rationale: హాజరుకావలసిన పక్షాలను హీబ్రూ మూలం మళ్లీ స్పష్టంగా విడివిడిగా పేర్కొన్న విధానాన్ని నిలుపుతుంది.
- source_word: מָחָר
  choice: రేపు
  rationale: కాలసూచక అవ్యయానికి సహజమైన, ఖచ్చితమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిల్ వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: לִפְנֵי יְהוָה యొక్క భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: రెండు రూపాలూ సాధ్యమే. ఇక్కడ ఆజ్ఞాపించబడిన హాజరు భావాన్ని సహజంగా తెలియజేయడానికి ‘సన్నిధిలో’ ఎంచుకున్నాం; అదనపు ఆరాధనా లేదా న్యాయపరమైన భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే మాటలు వాడబడ్డాయి. కోరహును నేరుగా సంబోధిస్తున్నందున ‘నువ్వు’ రూపం ఉపయోగించబడింది. మూలంలోని చివరి స్పష్టీకరణను డ్యాష్‌తో నిలిపాం.
