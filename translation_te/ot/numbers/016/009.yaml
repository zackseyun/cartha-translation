source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: te
  text: “ఇశ్రాయేలు దేవుడు మిమ్మల్ని ఇశ్రాయేలు సమాజం నుండి వేరుచేసి, తన దగ్గరకు చేర్చి, యాహ్వే గుడారపు సేవ చేయడానికి, సమాజం ఎదుట నిలబడి వారికి పరిచర్య చేయడానికి మిమ్మల్ని దగ్గరకు తీసుకోవడం మీకు చిన్న విషయమా?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది మీకు చాలదా?” హీబ్రూ నుడికారాన్ని ‘ఇది చిన్న విషయమా?’ అని లేదా మరింత భావానువాదంగా ‘ఇది చాలదా?’ అని చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: మీకు చిన్న విషయంగా అనిపిస్తోందా?
  rationale: హీబ్రూ అలంకారప్రశ్న, ఇప్పటికే లభించిన గొప్ప ఆధిక్యతను అల్పంగా ఎంచుతున్నారా అనే మందలింపును వ్యక్తం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ఆ భావాన్ని నిలుపుతుంది.
- source_word: הִבְדִּיל
  choice: వేరుచేసి
  rationale: హిఫిల్ రూపంలోని ‘వేరు చేయడం’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; సందర్భంలోని ప్రత్యేక నియామక భావం తరువాతి క్రియల ద్వారా స్పష్టమవుతుంది.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజం
  rationale: עֵדָה ఇక్కడ సమకూడిన ఇశ్రాయేలు సముదాయాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా, విస్తృతంగా అర్థమవుతుంది.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: తన దగ్గరకు చేర్చుకొని
  rationale: קרב యొక్క సమీపానికి తీసుకురావడం అనే సంబంధాత్మక, ఆరాధనాసంబంధ భావాన్ని కాపాడుతూ, బలిగా అర్పించడం అనే అతివ్యాఖ్యను నివారిస్తుంది.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: యెహోవా గుడారపు సేవ చేయడానికి
  rationale: עבד–עֲבֹדָה లోని సేవ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. מִשְׁכָּן‌ను అరణ్య పవిత్రస్థలమైన ‘గుడారం’గా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: సమాజం ఎదుట నిలబడి
  rationale: ప్రజల సమక్షంలో అధికారిక సేవకై నిలబడే భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: לְשָׁרְתָם
  choice: వారికి పరిచర్య చేయడానికి
  rationale: שרת సూచించే అధికారిక లేదా పవిత్ర సేవ భావాన్ని ‘పరిచర్య’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది; ‘యాహ్వే’ మరొక సాధ్యమైన ఉచ్చారణాధారిత రూపం.
- issue: లేవీయులను దేవుని దగ్గరకు తీసుకురావడం
  choice: తన దగ్గరకు చేర్చుకొని
  alternative: తనకు సమర్పించుకొని
  rationale: పాఠం వారి పవిత్ర సేవకై దేవుని సమీపానికి తీసుకురాబడటాన్ని చెబుతుంది; వారిని బలిగా సమర్పించారనే భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దీర్ఘ హీబ్రూ అలంకారప్రశ్నను ఒకే వాక్యంగా ఉంచి దాని మందలింపు స్వరాన్ని కాపాడింది.
