id: NUM.16.2
reference: Numbers 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: te
  text: వారు మోషే ఎదుట లేచారు. వారితో పాటు ఇశ్రాయేలు కుమారుల్లోనుండి[a] రెండువందల యాభై మంది పురుషులు కూడా లేచారు. వీరు సమాజ నాయకులు, సభకు పిలువబడినవారు[b], పేరుపొందినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయుల్లోనుండి.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల్లోనుండి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నియమిత సమావేశానికి పిలిపించబడినవారు.’ ఈ హీబ్రూ పదబంధం సమాజపు అధికారిక సమావేశానికి పిలువబడిన పురుషులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచారు
  rationale: קום క్రియ యొక్క కథన రూపాన్ని సహజంగా వ్యక్తపరుస్తుంది. సందర్భంలో ప్రతిఘటన భావం ఉన్నా, క్రియలోనే ‘తిరుగుబాటు చేశారు’ అని అతివ్యాఖ్యానం చేయదు.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ‘ముందు/సమక్షంలో’ అనే స్థల-సంబంధ భావాన్ని నిలుపుతుంది; ఎదుర్కొనే భావాన్ని సందర్భమే సూచించేలా ఉంచుతుంది.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל
  choice: వారితో ఇశ్రాయేలు కుమారుల్లోనుండి ... మంది పురుషులు
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్త సమన్వయాన్ని తెలుగులో స్పష్టంగా చేస్తూ, בְּנֵי יִשְׂרָאֵל అనే ఒడంబడిక సంబంధ పదబంధాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: రెండువందల యాభై
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంఖ్యా రూపం.
- source_word: נְשִׂיאֵי עֵדָה
  choice: సమాజపు నాయకులు
  rationale: נָשִׂיא యొక్క నాయకత్వ భావాన్ని, עֵדָה యొక్క సమూహ/సమాజ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: קְרִאֵי מוֹעֵד
  choice: సభకు పిలువబడినవారు
  rationale: సామూహిక సమావేశానికి అధికారికంగా పిలువబడినవారనే సంభావ్య భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: אַנְשֵׁי שֵׁם
  choice: పేరుపొందినవారు
  rationale: అక్షరార్థంగా ‘పేరు గల మనుషులు’ అనే హీబ్రూ నుడికారానికి తగిన, ఆధునిక తెలుగులో సహజమైన ఖ్యాతి/ప్రతిష్ఠ భావం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ వాక్యంలోని వరుస విశేషణాలను చిన్న రెండవ వాక్యంలో ఉంచి స్పష్టత పెంచబడింది; ప్రతిఘటన భావాన్ని క్రియలో అదనంగా చేర్చలేదు.
