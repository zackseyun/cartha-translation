id: NUM.16.34
reference: Numbers 16:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: te
  text: వారి చుట్టూ ఉన్న ఇశ్రాయేలీయులందరూ వారి కేకలకు పారిపోయారు; ఎందుకంటే, “భూమి మనల్ని మింగివేస్తుందేమో!” అని వారు చెప్పారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ సమష్టిగా ప్రజలను సూచిస్తోంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులందరూ’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: వారి చుట్టూ ఉన్న
  rationale: తీర్పుకు గురైనవారి పరిసరాల్లో ఉన్న ఇశ్రాయేలీయులను ఈ సంబంధ వాక్యం గుర్తిస్తోంది; మూలంలోని బహువచన ప్రత్యయాన్ని ‘వారి’గా నిలిపింది.
- source_word: נָסוּ
  choice: పారిపోయారు
  rationale: נוּס భయంతో వేగంగా తప్పించుకోవడాన్ని సూచిస్తుంది; ‘పారిపోయారు’ సాధారణ ఆధునిక తెలుగులో ఆ అత్యవసరతను సహజంగా తెలియజేస్తుంది.
- source_word: לְ/קֹלָם
  choice: వారి అరుపు విని
  rationale: קוֹל అనేది శబ్దం, స్వరం, అరుపు అనే అర్థాలను కలిగి ఉంటుంది. ఈ సందర్భంలో తీర్పుకు గురైనవారి అరుపు సహజమైన భావం; అయినా మూలంలోని విస్తృతార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּי אָמְרוּ
  choice: ఎందుకంటే … అని వారు అనుకున్నారు
  rationale: כִּי వారి పారిపోవడానికి కారణాన్ని పరిచయం చేస్తుంది. אָמַר పదశః ‘చెప్పారు’ అయినా, ఈ భయప్రతిస్పందనను తెలుగులో ‘అనుకున్నారు’ అనడం సహజం; ఇది వారి మాటను అంతరంగ ఆలోచనగా అతిగా నిర్ధారించకుండా సాధారణ వాడుకను అనుసరిస్తుంది.
- source_word: פֶּן
  choice: …మో
  rationale: פֶּן భయపడుతున్న సంభావ్య పరిణామాన్ని సూచిస్తుంది. తెలుగు ‘మింగివేస్తుందేమో’ ఆ భయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּבְלָעֵנוּ
  choice: మనల్ని కూడా మింగివేస్తుందేమో
  rationale: בלע ఇక్కడ భూమి తెరుచుకుని మనుషులను మింగడాన్ని సూచిస్తుంది. ‘మింగివేస్తుంది’ దృశ్యరూపకాన్ని నిలుపుతుంది; సందర్భానుగుణమైన ‘కూడా’ వారికీ అదే జరగవచ్చనే భయాన్ని స్పష్టం చేస్తుంది.
- source_word: הָ/אָרֶץ
  choice: భూమి
  rationale: ముందటి వచనంలో భూమి నోరు తెరవడంతో ప్రత్యక్ష సంబంధం ఉన్నందున ‘భూమి’ సరైన, సహజమైన ఎంపిక.
