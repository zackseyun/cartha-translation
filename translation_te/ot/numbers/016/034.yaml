translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. భయంతో పలికిన మాటలో ‘మింగివేస్తుందేమో’ అనే రూపం פֶּן యొక్క భావాన్ని సహజంగా అందిస్తుంది; קוֹל యొక్క పదార్థ విస్తృతిని పాదసూచికలో నిలిపాం.
