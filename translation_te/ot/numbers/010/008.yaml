source:
  edition: WLC
  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: te
  text: యాజకులైన అహరోను కుమారులు బూరలు ఊదాలి; అవి మీకు తరతరాలకు శాశ్వతమైన[a] శాసనంగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎప్పటికీ ఉండే శాసనంగా” లేదా “నిరంతర శాసనంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: בְּנֵי అనే కుటుంబసంబంధ పదాన్ని అర్థస్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో ‘కుమారులు’గా ఉంచాం.
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: ‘అహరోను కుమారులు’ ఎవరనేది వివరిస్తున్న appositional పదబంధాన్ని సహజమైన తెలుగులో విశేషణ రూపంలో ఇచ్చాం.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: బూరలు ఊదాలి
  rationale: תקע + חצצרות ఇక్కడ బూరలను ఊదడాన్ని సూచిస్తుంది. న్యాయనియమ సందర్భంలోని ఆదేశబలాన్ని ‘ఊదాలి’ సహజంగా వ్యక్తం చేస్తుంది; ఈ వచనంలో లేని ‘వెండి’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: וְהָיוּ לָכֶם
  choice: ఇది ... మీకు ... ఉండాలి
  rationale: మూలంలోని బహువచన క్రియను యథాతథంగా అనుసరిస్తే తెలుగులో దాని సూచన అస్పష్టంగా ఉంటుంది. ముందున్న మొత్తం నియమాన్ని సంగ్రహంగా సూచిస్తూ ‘ఇది’ అని ఇవ్వడం సహజంగా మరియు సందర్భానుగుణంగా ఉంది.
- source_word: לְחֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనంగా
  rationale: חֻקָּה యొక్క న్యాయపరమైన భావాన్ని ‘శాసనం’, עוֹלָם యొక్క నిరంతర/చిరస్థాయి భావాన్ని ‘శాశ్వతమైన’ వ్యక్తం చేస్తాయి; దాని పరిధిని తరువాతి ‘తరతరాలుగా’ సందర్భబద్ధం చేస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: తరతరాలుగా
  rationale: తరువాతి తరాలన్నిటిలో కొనసాగుతున్న వర్తింపును సహజమైన ఆధునిక తెలుగులో తెలిపే సంక్షిప్త రూపం.
theological_decisions:
- issue: חֻקַּת עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతమైన శాసనం
  alternative: ఎప్పటికీ ఉండే శాసనం / నిరంతర శాసనం
  rationale: עוֹלָם దీర్ఘకాల స్థిరత్వం లేదా నిత్యత్వాన్ని సందర్భానుసారంగా సూచించగలదు. ‘శాశ్వతమైన’ మూలపదంలోని బలాన్ని కాపాడుతుంది; ‘తరతరాలుగా’ అనే సమీప పదబంధం దాని ఒడంబడికా-చారిత్రక పరిధిని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన న్యాయనియమ శైలి. ‘బూరలు’ సాధారణంగా అర్థమయ్యే పదం; ఈ వచనంలో ప్రత్యక్షంగా లేని ‘వెండి’ చేర్చబడలేదు. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
