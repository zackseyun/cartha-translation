source:
  edition: WLC
  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: te
  text: యూదా కుమారుల శిబిరపు పతాకం తమ దళాల ప్రకారం ముందుగా[a] బయలుదేరింది[b]. దాని దళానికి అధిపతి అమ్మీనాదాబు కుమారుడైన నహ్షోను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొదట’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం ప్రయాణ క్రమంలో మొదటి స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ దళాల ప్రకారం’ అనే మాటకు ‘తమ కంపెనీల ప్రకారం’ లేదా ‘తమ సైన్యాల ప్రకారం’ అని కూడా అనువదించవచ్చు. ఇక్కడి హెబ్రీ పదం క్రమబద్ధంగా ఏర్పాటు చేసిన గోత్ర విభాగాలను సూచించే సైనిక-సంస్థాగత పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: బయలుదేరింది
  rationale: అరణ్య ప్రయాణ సందర్భంలో נסע శిబిరాన్ని ఎత్తి తదుపరి స్థలానికి కదలడాన్ని సూచిస్తుంది; ‘బయలుదేరింది’ సహజమైన ఆధునిక తెలుగు.
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: గోత్ర శిబిర విభాగం కింద కదిలిన గుర్తు లేదా ధ్వజాన్ని సూచించే పదం; ‘పతాకం’ సైనిక-శిబిర భావాన్ని నిలుపుతుంది.
- source_word: מַחֲנֵה
  choice: శిబిరం
  rationale: דֶּגֶל מַחֲנֵה అనే నిర్మాణంలో గోత్రపు శిబిర సమూహాన్ని సూచిస్తుంది.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా కుమారులు
  rationale: గోత్ర-వంశ సందర్భంలోని హెబ్రీయ రూపాన్ని లింగసూచకంగా, సాంప్రదాయికంగా నిలుపుతుంది.
- source_word: בָּרִאשֹׁנָה
  choice: ముందుగా
  rationale: ప్రయాణ క్రమంలో మొదటి స్థానాన్ని సూచించే క్రియావిశేషణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: వారి సైనిక విభాగాల ప్రకారం
  rationale: צבא ఇక్కడ క్రమబద్ధంగా ఏర్పాటు చేసిన గోత్ర దళాలను సూచిస్తుంది; ‘సైనిక విభాగాలు’ ఆ సంస్థాగత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְעַל צְבָאוֹ
  choice: దాని సైనిక విభాగానికి అధిపతి
  rationale: על నాయకత్వాన్ని, ఏకవచన ప్రత్యయం యూదా శిబిర-పతాక విభాగాన్ని సూచిస్తాయి; సహజ తెలుగు కోసం నామవాక్యంగా అందించబడింది.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: అమ్మీనాదాబు కుమారుడైన నయస్సోను
  rationale: వ్యక్తినామాలను తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించి, వంశ సంబంధాన్ని స్పష్టంగా ఉంచింది.
