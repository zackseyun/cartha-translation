source:
  edition: WLC
  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: te
  text: 'మందసం బయలుదేరినప్పుడల్లా[a] మోషే ఇలా అన్నాడు: “యాహ్వే, లేచు[b]! నీ శత్రువులు చెదరిపోవాలి; నిన్ను ద్వేషించేవారు నీ ఎదుటినుండి పారిపోవాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందసం బయలుదేరినప్పుడు ఇలా జరిగింది.” హీబ్రూ నుడికారాన్ని ఈ విధంగా మరింత పదానుసారంగా అనువదించవచ్చు; అయితే ఇక్కడ అది మందసం బయలుదేరిన ప్రతిసారీ జరిగినదాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: “లేచు” అనేది యాహ్వే తన శక్తితో కార్యం చేయాలనే విన్నపం; దేవుడు అక్షరార్థంగా నిష్క్రియగా ఉన్నాడని దీని భావం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: బయలుదేరినప్పుడల్లా
  rationale: ఈ సందర్భంలో మందసం ప్రయాణం ప్రారంభించిన ప్రతిసారీ జరిగిన చర్యను ఈ హీబ్రూ నిర్మాణం సూచిస్తుంది. ‘బయలుదేరినప్పుడల్లా’ ఆ పునరావృత కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: మూలంలో ‘మందసం’ మాత్రమే ఉంది; ‘నిబంధన మందసం’ అని విస్తరించడం ఈ వచనంలో స్పష్టంగా లేని సమాచారాన్ని చేర్చుతుంది.
- source_word: קוּמָה
  choice: లేచు
  rationale: యెహోవాను ఉద్దేశించిన ఆజ్ఞార్థక విన్నపం ఇది. ‘లేచు’ అనే రూపం దేవుడు శక్తితో కార్యం చేయాలని కోరే సజీవ రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וְיָפֻצוּ
  choice: చెదరిపోవాలి
  rationale: ఆజ్ఞార్థక క్రియ తరువాత వచ్చిన ఈ అసంపూర్ణ క్రియ విన్నపాత్మక భావాన్ని కలిగిస్తుంది. ‘చెదరిపోవాలి’ ఆ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹיְבֶיךָ
  choice: నీ శత్రువులు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన నామానికి సూటియైన అనువాదం.
- source_word: וְיָנֻסוּ
  choice: పారిపోవాలి
  rationale: మునుపటి క్రియలాగే ఇది కూడా విన్నపాత్మక భావం కలిగిన క్రియ; సమాంతర నిర్మాణాన్ని ‘పారిపోవాలి’ నిలుపుతుంది.
- source_word: מְשַׂנְאֶיךָ
  choice: నిన్ను ద్వేషించేవారు
  rationale: ఈ కృదంత రూపం నిరంతర లక్షణాన్ని సూచిస్తుంది; ‘నిన్ను ద్వేషించేవారు’ వ్యక్తిగత విరోధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటినుండి
  rationale: యెహోవా సమక్షంలో శత్రువులు వెనుదిరిగి పారిపోవడాన్ని ఈ పదబంధం సూచిస్తుంది. ‘నీ ఎదుటినుండి’ సైనిక సందర్భంలో సహజంగా ఉండి మూలంలోని దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం יהוה అనే వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. బిరుదును పెట్టకుండా పేరును నిలిపి, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: ‘లేచు’ అనే విన్నపం యొక్క భావం
  choice: రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని కార్యాత్మక భావాన్ని పాదసూచికలో వివరించడం
  alternative: ‘శక్తితో కార్యం చేయి’ అని ప్రధాన పాఠంలో భావానువాదం చేయడం
  rationale: మూలంలోని సజీవ రూపకాన్ని తొలగించకుండా ఉంచడం మంచిది. అదే సమయంలో ఇది దేవుడు అక్షరార్థంగా నిష్క్రియగా ఉన్నాడనే భావం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. పాతకాలపు క్రియారూపాలను నివారించాం; హీబ్రూ కవితాత్మక సమాంతరతను ‘చెదరిపోవాలి / పారిపోవాలి’ రూపాలతో నిలిపాం.
