  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: te
  text: తరువాత రూబేను శిబిరపు పతాకం[a] వారి సైన్య విభాగాల[b] ప్రకారం బయలుదేరింది. దాని సైన్య విభాగానికి అధిపతిగా షెదేయూరు కుమారుడు ఎలీసూరు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధ్వజం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి దళాల ప్రకారం’; హీబ్రూ పదం క్రమబద్ధమైన, సైనిక శైలిలో ఏర్పాటైన సమూహాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: తరువాత ... బయలుదేరింది
  rationale: వావ్-క్రమరూపం కథనంలోని తదుపరి కదలికను సూచిస్తుంది; נסע శిబిర ప్రయాణ సందర్భంలో ‘బయలుదేరు’ అని సహజంగా అర్థమవుతుంది.
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: గోత్ర శిబిరం ఏ గుర్తు కింద కదిలిందో తెలిపే స్పష్టమైన దృశ్యార్థాన్ని ‘పతాకం’ నిలుపుతుంది.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: రూబేను శిబిరం
  rationale: హీబ్రూ సంయుక్త నామబంధంలోని సంబంధాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: వారి సైన్య విభాగాల ప్రకారం
  rationale: చివరి ప్రత్యయం బహువచన సమూహాన్ని సూచిస్తుంది; צבא ఇక్కడ పోరాటాన్ని మాత్రమే కాక, క్రమబద్ధంగా ఏర్పాటైన దళ విభాగాలను కూడా సూచిస్తుంది.
- source_word: וְעַל צְבָאוֹ
  choice: దాని సైన్య విభాగానికి అధిపతిగా ... ఉన్నాడు
  rationale: עַל అధికారాన్ని లేదా పర్యవేక్షణను సూచిస్తుంది. צבא ఏకవచనాన్ని నిలుపుతూ, తెలుగు వాక్య నిర్మాణానికి అవసరమైన ‘అధిపతిగా ... ఉన్నాడు’ అనే రూపాన్ని ఉపయోగించింది.
- source_word: אֱלִיצוּר
  choice: ఎలీసూరు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן שְׁדֵיאוּר
  choice: షెదేయూరు కుమారుడు
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తూ పేరును లిప్యంతరీకరించింది.
