translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన మరియు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యం సందర్భానుసారంగా ముందటి వాక్యంతో అనుసంధానమైనప్పటికీ, తెలుగు వచనం స్వతంత్రంగా సహజంగా చదవడానికి క్రియను స్పష్టంగా చేర్చాం.
