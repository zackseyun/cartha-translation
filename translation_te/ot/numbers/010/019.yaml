source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: te
  text: షిమ్యోను కుమారుల గోత్రపు దళానికి నాయకుడిగా జూరీషద్దయి కుమారుడు షెలుమీయేలు ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘దళం’ అనే పదానికి ‘సైన్యదళం’ లేదా ‘విభాగం’ అని కూడా అనువదించవచ్చు (హీబ్రూ: צְבָא). ఇది వ్యవస్థీకృతమైన గోత్ర సమూహాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధిపతిగా
  rationale: ప్రయాణ క్రమాన్ని తెలిపే ఈ సందర్భంలో עַל ఒక గోత్ర సైన్యదళంపై నియమితుడైన నాయకుణ్ణి సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు వాక్య నిర్మాణంలో ‘అధిపతిగా’ అని వ్యక్తీకరించబడింది.
- source_word: צְבָא
  choice: సైన్యదళం
  rationale: ఇక్కడ ఈ పదం ఇశ్రాయేలు శిబిర ప్రయాణ క్రమంలోని వ్యవస్థీకృత గోత్ర దళాన్ని సూచిస్తుంది. ‘సైన్యదళం’ దాని క్రమబద్ధమైన, సైనిక స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘దళం’ కూడా సాధ్యమే.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: జనగణన, శిబిర క్రమ సందర్భాల్లో ఈ పదానికి ‘గోత్రం’ అనే అర్థమే సందర్భోచితం.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, సంప్రదాయ గోత్ర designationను తెలుగులో సహజంగా అందిస్తుంది.
- source_word: שְׁלֻמִיאֵל
  choice: షెలుమీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ప్రత్యక్ష పితృనామ సంబంధంలో మూలంలోని అర్థాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: צוּרִי שַׁדָּי
  choice: సూరీషద్దయి
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఒకే పేరుగా తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
