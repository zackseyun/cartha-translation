  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: te
  text: జెబూలూను కుమారుల గోత్రపు దళానికి అధిపతిగా హేలోను కుమారుడు ఏలీయాబు ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
