id: NUM.10.7
reference: Numbers 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: te
  text: సమాజాన్ని సమకూర్చేటప్పుడు మీరు బూరలు ఊదాలి; అయితే హెచ్చరిక సంకేతాన్ని ఊదకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: సమకూర్చేటప్పుడు
  rationale: 'కהל అనే ధాతువు హిఫీల్ క్రియార్థక నామరూపంలో ఉండి, ముందున్న בְతో కాలార్థాన్ని ఇస్తోంది: ‘సమకూర్చేటప్పుడు’. మునుపటి వచనంలోని బయలుదేరే సంకేతంతో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.'
- source_word: הַקָּהָל
  choice: సమాజాన్ని
  rationale: קָהָל ఇక్కడ సమకూడే ఇశ్రాయేలు ప్రజాసముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సమకూర్చే చర్యనుంచి ప్రజాసమూహాన్ని వేరుచేస్తుంది.
- source_word: תִּתְקְעוּ
  choice: బూరలు ఊదాలి
  rationale: תקע ఈ సందర్భంలో బూరలు ఊదడాన్ని సూచిస్తుంది. హీబ్రూలో ఈ వచనంలో ‘బూరలు’ మళ్లీ లేకపోయినా, తెలుగులో కేవలం ‘ఊదాలి’ అనడం అస్పష్టంగా ఉంటుంది; సందర్భంలో స్పష్టంగా ఉన్న కర్మను చేర్చడం సహజమైన భావసమానతను ఇస్తుంది.
- source_word: וְלֹא
  choice: అయితే ... కూడదు
  rationale: సాధారణంగా బూరలు ఊదడానికీ ప్రత్యేక హెచ్చరిక సంకేతాన్ని ఊదడానికీ మధ్యనున్న వ్యత్యాసాన్ని ‘అయితే’ స్పష్టంగా చూపుతుంది; నిషేధాత్మక ఆజ్ఞను ‘కూడదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תָרִיעוּ
  choice: హెచ్చరిక సంకేతాన్ని ఊదకూడదు
  rationale: הֵרִיעַ బూరల సందర్భంలో సాధారణ ధ్వని కాకుండా, బయలుదేరడానికి ఉపయోగించే ప్రత్యేక సంకేత ధ్వనిని సూచిస్తుంది. ‘హెచ్చరిక సంకేతం’ ఆ సాంకేతిక వ్యత్యాసాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞాత్మక ధోరణిని గౌరవప్రదంగా, సులభంగా ఉంచాం. ‘బూరలు’ సందర్భం నుంచి స్పష్టపరచబడింది. సాధారణ ఊదడానికీ ప్రత్యేక హెచ్చరిక సంకేతానికీ మధ్య హీబ్రూ వ్యత్యాసం ప్రధాన వాక్యంలోనే నిలుపబడినందున పాదటిప్పణి అవసరం లేదు.
