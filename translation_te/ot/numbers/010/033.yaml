id: NUM.10.33
reference: Numbers 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: te
  text: వారు యాహ్వే పర్వతం నుండి మూడు రోజుల ప్రయాణానికి బయలుదేరారు[a]; యాహ్వే నిబంధన మందసం వారికి విశ్రాంతి స్థలాన్ని వెదకడానికి[b] వారి ముందుగా మూడు రోజుల ప్రయాణం సాగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూడు రోజుల ప్రయాణదూరం.’ ఇదే మాట వచనంలో రెండుసార్లు వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వెదకడానికి’ అనే మాటకు ‘అన్వేషించడానికి’ లేదా ‘గాలించడానికి’ అని కూడా అర్థం చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: נסע శిబిరాన్ని ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరారు’ సహజంగా ఆ కదలికను వ్యక్తం చేస్తుంది.
- source_word: מֵהַר יְהוָה
  choice: యాహ్వే పర్వతం నుండి
  rationale: הַר ను ‘పర్వతం’గా, יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా నేరుగా అందిస్తుంది.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజుల ప్రయాణం
  rationale: కాల పరిమాణంతో ఉన్న דֶּרֶךְ ప్రయాణ దూరం లేదా ప్రయాణ విస్తృతిని సూచిస్తుంది; కేవలం మూడు రోజుల కాలవ్యవధి అని పరిమితం చేయదు.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా నిలుపుతుంది; ‘మందసం’ పవిత్ర పెట్టెను సూచించే గౌరవప్రదమైన బైబిలు పదం.
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: వారి ముందుగా … ప్రయాణం సాగింది
  rationale: కృదంత రూపంలోని కొనసాగుతున్న అనుబంధ చర్యను, మందసం సమూహానికి ముందుగా సాగిందనే స్థలార్థంతో సహజంగా తెలియజేస్తుంది.
- source_word: לָתוּר
  choice: వెదకడానికి
  rationale: תור ఇక్కడ అనుకూలమైన స్థలాన్ని అన్వేషించడం లేదా వెదకడాన్ని సూచిస్తుంది; సైనిక గూఢచర్య భావాన్ని అనవసరంగా చేర్చదు.
- source_word: מְנוּחָה
  choice: విశ్రాంతి స్థలం
  rationale: ప్రయాణ సందర్భంలో ఇది భావరూపమైన విశ్రాంతికన్నా ఆగి బస చేయదగిన స్థలాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: మందసం ముందుగా సాగడం మరియు విశ్రాంతి స్థలాన్ని వెదకడం
  choice: మూలపాఠంలోని వ్యక్తీకరణను యథాతథంగా నిలుపుట
  alternative: యాహ్వే మందసం ద్వారా నడిపించాడని వివరణాత్మకంగా చెప్పుట
  rationale: వచనం మందసాన్నే వ్యాకరణ కర్తగా ఉంచుతుంది. అంతర్లీన దైవ కార్యసాధనను వ్యాఖ్యానంగా స్పష్టీకరించకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘నిబంధన మందసం’ అనే స్థిర బైబిలు పదబంధాన్ని ఉపయోగించి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
