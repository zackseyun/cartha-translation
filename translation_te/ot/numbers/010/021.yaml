source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: te
  text: అప్పుడు కహాతీయులు పరిశుద్ధ వస్తువులను మోస్తూ బయలుదేరారు[a]; వారు చేరుకునేలోపే నివాస గుడారం నిలబెట్టబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “పరిశుద్ధస్థలాన్ని మోసేవారు” లేదా “పరిశుద్ధస్థలాన్ని మోసుకువెళ్లేవారు.” ఇక్కడ ఈ మాట కహాతీయులు మోసిన పరిశుద్ధ ఉపకరణాలను సూచిస్తుంది; తరువాత ప్రస్తావించిన నివాస గుడారపు నిర్మాణాన్ని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: అప్పుడు ... బయలుదేరారు
  rationale: ప్రయాణ కథనంలోని వరుస క్రమాన్ని వావ్ సూచిస్తోంది; ఆధునిక తెలుగులో ‘బయలుదేరారు’ సహజంగా ఉంది.
- source_word: הַקְּהָתִים
  choice: కహాతీయులు
  rationale: కహాతు వంశానికి చెందిన గోత్రవర్గాన్ని సూచించే బహువచన జాతినామానికి సంక్షిప్తమైన సహజ రూపం.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: పవిత్ర వస్తువులను మోస్తూ
  rationale: అక్షరార్థంగా ‘పవిత్రస్థలాన్ని మోసేవారు’; సందర్భంలో ఇది గుడార నిర్మాణాన్ని కాక దానిలోని పవిత్ర ఉపకరణాలను సూచించే లక్షణార్థ ప్రయోగం.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: మందిర నివాసం నిలబెట్టబడింది
  rationale: క్రియ బహువచన కర్తను సూచించినా కర్తను స్పష్టంగా పేర్కొనలేదు. కహాతీయులే దాన్ని నిలబెట్టారనే అపార్థం రాకుండా, సందర్భానుగుణంగా కర్మణి రూపం వాడబడింది.
- source_word: הַמִּשְׁכָּן
  choice: మందిర నివాసం
  rationale: מִשְׁכָּן యొక్క ‘నివాసం’ భావాన్ని నిలుపుతూ, అరణ్యకాలపు దేవుని గుడార నివాసాన్ని స్పష్టంగా సూచించే పదబంధం.
- source_word: עַד בֹּאָם
  choice: వారు చేరుకునేలోగా
  rationale: కహాతీయులు పవిత్ర వస్తువులతో వచ్చే సమయానికల్లా మందిర నివాసం సిద్ధంగా ఉండే కాలసంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: మందిర నివాసాన్ని నిలబెట్టినవారి గుర్తింపు
  choice: కర్తను పేర్కొనని కర్మణి వాక్యం
  alternative: ‘వారు మందిర నివాసాన్ని నిలబెట్టారు’
  rationale: హీబ్రూ క్రియలో కర్త అంతర్లీనంగా ఉన్నా, సమీపంలోని కహాతీయులనే కర్తగా తీసుకుంటే సందర్భపరమైన తప్పుదారి కలుగుతుంది. నిజమైన కర్తను పేరుపెట్టి వచనంలోని అంతర్లీనతను పరిష్కరించకుండా కర్మణి రూపం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పవిత్ర వస్తువులు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; పాదసూచిక అక్షరార్థాన్ని భద్రపరుస్తుంది. ‘మందిర నివాసం’ అనే రూపం సాంకేతికమైన ‘గుడార మందిరం’ కన్నా మూలంలోని నివాస భావాన్ని ముందుకు తెస్తుంది.
