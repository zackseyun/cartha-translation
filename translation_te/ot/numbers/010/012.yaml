  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] తమ ప్రయాణ దశల ప్రకారం సీనాయి అరణ్యం నుండి బయలుదేరారు. ఆ మేఘం పారాను అరణ్యంలో నిలిచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో, “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: ప్రయాణ కథనంలో נסע శిబిరాన్ని ఎత్తి ముందుకు సాగడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబ సంబంధ రూపాన్ని పారదర్శకంగా నిలుపుతుంది; సహజమైన సామూహిక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְמַסְעֵיהֶם
  choice: విడిది విడిదిగా
  rationale: ప్రయాణంలోని వరుస మజిలీలు లేదా దశలను తెలిపే బహువచన భావాన్ని సాధారణ తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: מִמִּדְבַּר סִינָי
  choice: సీనాయి అరణ్యం నుండి
  rationale: מִדְבָּר అనే సాగుచేయని విశాల ప్రాంత భావాన్ని ‘అరణ్యం’ నిలుపుతుంది; కేవలం ఇసుక ఎడారి అనే సంకుచిత భావాన్ని రుద్దదు.
- source_word: וַיִּשְׁכֹּן
  choice: నిలిచింది
  rationale: ఇక్కడ మేఘం ఒక ప్రాంతంలో ఆగి ఉండడాన్ని సూచిస్తుంది; ‘నిలిచింది’ తెలుగు ప్రయాణ సందర్భంలో సహజంగా ఉంది.
- source_word: הֶעָנָן
  choice: ఆ మేఘం
  rationale: అరణ్య ప్రయాణంలో ముందే తెలిసిన నిర్దిష్ట మార్గదర్శక మేఘాన్ని సూచిస్తున్నందున ‘ఆ మేఘం’ సహజమైన నిర్దిష్ట రూపం.
- source_word: בְּמִדְבַּר פָּארָן
  choice: పారాను అరణ్యంలో
  rationale: מִדְבָּר కు ‘అరణ్యం’ అనే సమాన పదాన్ని కొనసాగిస్తూ, పారాను అనే స్థలనామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל పదబంధ అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ కుటుంబ సంబంధ వ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపి, మరింత సహజమైన సామూహిక రూపాన్ని పాదసూచికలో అందించింది; దీనివల్ల మూల పారదర్శకతతో పాటు పాఠక స్పష్టత కూడా నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘విడిది విడిదిగా’ ప్రయాణ దశల భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
