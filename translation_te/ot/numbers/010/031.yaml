id: NUM.10.31
reference: Numbers 10:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “దయచేసి మమ్మల్ని విడిచిపెట్టకు, ఎందుకంటే అరణ్యంలో మేము ఎక్కడ మకాం వేయాలో నీకు తెలుసు[a]; నీవు మాకు కళ్లుగా ఉంటావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా “అరణ్యంలో మా మకాం వేయడం” లేదా “మా మకాంలు.” ఇది మకాం వేసే స్థలాలను, లేదా మకాం వేసే విధానాన్ని సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: b
    text: “మాకు కళ్లుగా” అంటే, అరణ్యం గురించి నీకున్న పరిజ్ఞానంతో మాకు దారి చూపేవాడిగా ఉండడం.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని సాధారణ వాక్యారంభాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఇలా’ ప్రత్యక్ష సంభాషణను సులభంగా పరిచయం చేస్తుంది.
- source_word: אַל נָא
  choice: దయచేసి ... వద్దు
  rationale: אַל నిషేధాన్ని, נָא వినయపూర్వకమైన వేడుకోలును తెలియజేస్తాయి. ఈ రెండింటినీ తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: మమ్మల్ని విడిచిపెట్టకు
  rationale: ప్రయాణ సందర్భంలో עזב అనే పదానికి ‘విడిచిపెట్టు’ సహజమైన అర్థం; ‘త్యజించు’ వంటి అధిక భారమున్న పదాన్ని నివారిస్తుంది.
- source_word: כִּי עַל כֵּן
  choice: ఎందుకంటే
  rationale: ఈ పదబంధం ముందున్న వేడుకోలుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: పూర్తయిన క్రియారూపానికి వర్తమాన ప్రాసంగికత ఉంది; హోబాబు వద్ద కొనసాగుతున్న పరిజ్ఞానాన్ని తెలుగు వర్తమాన రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: అరణ్యంలో మా మకాం గురించి
  rationale: חֲנֹתֵנוּ అక్షరార్థంగా ‘మేము మకాం వేయడం/మా మకాం’ అని సూచిస్తుంది. అది స్థలాలనో, మకాం వేసే తీరునో సూచించగల అస్పష్టతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינַיִם
  choice: నీవు మాకు కళ్లుగా ఉంటావు
  rationale: ‘మాకు కళ్లుగా’ అనే హీబ్రూ రూపకాన్ని అలాగే నిలుపుతూ, హోబాబు అరణ్య పరిజ్ఞానం ఇశ్రాయేలీయులకు దారి చూపుతుందనే సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: దేవుని మార్గదర్శకత్వం ఉన్నప్పటికీ హోబాబు ‘కళ్లుగా’ ఉండడం
  choice: హీబ్రూ రూపకాన్ని వివరణ లేకుండా ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘నీవు మాకు మార్గదర్శిగా ఉంటావు’ అని రూపకాన్ని పూర్తిగా విప్పి చెప్పడం
  rationale: వచనం మానవ పరిజ్ఞానం మరియు దైవ మార్గదర్శకత్వం మధ్య ఉన్న సాధ్యమైన ఉద్రిక్తతను స్వయంగా పరిష్కరించదు. ‘కళ్లుగా’ అనే రూపకాన్ని నిలపడం ద్వారా పాఠకుడిపై ఒక నిర్దిష్ట సిద్ధాంతపరమైన వివరణను రుద్దకుండా మూలపాఠానికి నిబద్ధంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘మకాం’ సాధారణ వాడుకలో ఉన్న ప్రయాణ-శిబిర పదంగా ఎంపికైంది. మూలంలోని ‘కళ్లుగా’ అనే స్పష్టమైన రూపకం నిలుపబడింది; దాని భావం పాదసూచికలో మాత్రమే వివరించబడింది.
