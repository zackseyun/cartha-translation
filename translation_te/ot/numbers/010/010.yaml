id: NUM.10.10
reference: Numbers 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: te
  text: మీ సంతోష దినాన, మీ నియమిత సమయాల్లో, మీ నెలల ఆరంభాల్లో[a], మీరు మీ దహనబలుల మీదా, మీ సమాధాన బలుల మీదా బాకాలు ఊదాలి. ఆ బాకాల ధ్వనులు మీ దేవుని సన్నిధిలో మీకు జ్ఞాపకార్థంగా ఉంటాయి. నేను యెహోవాను, మీ దేవుడను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ అమావాస్య దినాల్లో.” హెబ్రీలో అక్షరార్థంగా “మీ నెలల ఆరంభాల్లో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: మీ సంతోష దినాన
  rationale: שִׂמְחָה ఆనందం లేదా సంతోషాన్ని సూచిస్తుంది; יוֹם‌తో కలిసి తెలుగులో ‘మీ సంతోష దినాన’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: מוֹעֲדֵיכֶם
  choice: మీ నియమిత సమయాల్లో
  rationale: מוֹעֵד నియమించబడిన సమయం, సభ లేదా పండుగ సందర్భాన్ని సూచించగలదు; ‘నియమిత సమయాలు’ దాని విస్తృతిని కాపాడుతుంది.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: మీ నెలల ఆరంభాల్లో
  rationale: అక్షరార్థంగా ‘మీ నెలల ఆరంభాలు’; సందర్భంలో అమావాస్య దినాలను సూచించవచ్చు గాని ప్రధాన పాఠం హెబ్రీ రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: మీరు ... బాకాలు ఊదాలి
  rationale: תקע బాకాల సందర్భంలో ఊదడం లేదా మోగించడం; ‘బాకాలు ఊదాలి’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: עַל עֹלֹתֵיכֶם
  choice: మీ దహనబలుల మీదా
  rationale: עַל యొక్క ప్రాథమిక భావాన్ని, బలుల అర్పణతో పాటు బాకాలు ఊదే ఆచార దృశ్యాన్ని ‘మీద’ నిలుపుతుంది.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: మీ సమాధాన బలుల అర్పణలు
  rationale: שְׁלָמִיםకు సమాధానం, క్షేమం, సంపూర్ణత అనే భావక్షేత్రం ఉంది; זִבְחֵי అనే నిర్మాణ పదాన్ని ‘అర్పణలు’ వ్యక్తం చేస్తుంది.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: అవి ... మీకు జ్ఞాపకార్థంగా ఉంటాయి
  rationale: బహువచన క్రియ యొక్క సూచనను ఉద్దేశపూర్వకంగా విస్తృతంగానే ఉంచి, ఆచార సంబంధమైన జ్ఞాపకార్థ భావాన్ని కాపాడుతుంది.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: మీ దేవుని సన్నిధిలో
  rationale: לִפְנֵי అక్షరార్థంగా ‘ముందు’; దేవుని సమక్షం అనే భావాన్ని తెలుగులో ‘సన్నిధిలో’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; దీనిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా దైవనామంగా ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హెబ్రీ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: שְׁלָמִים అనే బలి పదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: ఈ పదంలో క్షేమం/సమాధానం మరియు భాగస్వామ్య భోజనం రెండూ సంబంధిత భావాలు; ప్రధాన పాఠంలో సంప్రదాయమైన ‘సమాధాన బలులు’ను ఉంచడం ఏకైక సామాజిక వివరణకు భావాన్ని పరిమితం చేయదు.
- issue: לְזִכָּרוֹן యొక్క ఆచార సంబంధ భావం
  choice: మీ దేవుని సన్నిధిలో మీకు జ్ఞాపకార్థంగా
  alternative: మీ దేవుడు మిమ్మల్ని జ్ఞాపకం చేసుకునేలా
  rationale: ఎవరికి జ్ఞాపకం కలుగుతుందో హెబ్రీ వాక్యం స్పష్టంగా విప్పి చెప్పదు; అందువల్ల దేవుని చర్యగా నిర్దిష్టీకరించకుండా అసలు పాఠంలోని ఉద్వేగం, అస్పష్టత నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, ఆచార సంబంధ పదాలకు గంభీరతను నిలిపాం. ప్రధాన పాఠంలో ఉన్న ఏకైక పాదసూచిక గుర్తు [a] పాఠంలోనూ చేర్చబడింది.
