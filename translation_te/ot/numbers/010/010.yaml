revisions:
- from: మీ సంతోష దినాన, మీ నియమిత సమయాల్లో, మీ నెలల ఆరంభాల్లో[a], మీరు మీ దహనబలుల మీదా, మీ సమాధాన బలుల అర్పణల మీదా బాకాలు ఊదాలి. అప్పుడు అవి మీ దేవుని సన్నిధిలో మీకు జ్ఞాపకార్థంగా ఉంటాయి. నేనే మీ దేవుడైన యెహోవాను.
  to: మీ సంతోష దినాన, మీ నియమిత సమయాల్లో, మీ నెలల ఆరంభాల్లో[a], మీరు మీ దహనబలుల మీదా, మీ సమాధాన బలుల మీదా బాకాలు ఊదాలి. ఆ బాకాల ధ్వనులు మీ దేవుని సన్నిధిలో మీకు జ్ఞాపకార్థంగా ఉంటాయి. నేను యెహోవాను, మీ దేవుడను.
