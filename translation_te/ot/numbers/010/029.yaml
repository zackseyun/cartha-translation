language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: te
  text: 'మోషే మిద్యానీయుడైన రెయూయేలు కుమారుడూ మోషేకు మామయిన హోబాబుతో[a] ఇలా అన్నాడు: “యాహ్వే, ‘దాన్ని మీకు ఇస్తాను’ అని చెప్పిన స్థలానికి మేము బయలుదేరుతున్నాం. నువ్వు మాతో రా; మేము నీకు మేలు చేస్తాం. ఎందుకంటే యాహ్వే ఇశ్రాయేలు గురించి మేలైన మాటలు పలికాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మామ’ అని అనువదించిన హీబ్రూ పదం వివాహం ద్వారా ఏర్పడిన బంధాన్ని విస్తృతంగా సూచించగలదు. అందువల్ల కొందరు హోబాబును మోషే బావగా లేదా వివాహబంధువుగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: హోబాబు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో అందించాం.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: హీబ్రూ వ్యక్తి పేరుకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: הַמִּדְיָנִי
  choice: మిద్యానీయుడు
  rationale: నిర్దిష్ట జాతి అనుబంధాన్ని సహజమైన తెలుగు నామరూపంలో తెలిపాం.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ
  rationale: חֹתֵן సాధారణంగా వివాహబంధంలోని పురుష బంధువును, తరచుగా మామను సూచిస్తుంది. ఖచ్చిత బంధుత్వంపై ఉన్న సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: మేము బయలుదేరుతున్నాం
  rationale: కృదంతం మరియు సర్వనామం సూచించే ప్రస్తుత లేదా సమీప ప్రయాణారంభ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: యెహోవా, ‘దాన్ని మీకు ఇస్తాను’ అని చెప్పిన
  rationale: ‘దాన్ని’ అనేది ఏకవచనంలోని ‘స్థలం’ను సూచిస్తుంది; ‘మీకు’ హీబ్రూలోని బహువచన సంబోధనను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడ్డ లిప్యంతరీకరణతో అందించాం.
- source_word: לְכָה אִתָּנוּ
  choice: నువ్వు మాతో రా
  rationale: ఏకవచన ఆహ్వానాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: మేము నీకు మేలు చేస్తాం
  rationale: יטב హిఫీల్ రూపంలోని ఒకరి మేలు కోసం ప్రవర్తించడం అనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు మేలు చేస్తానని చెప్పాడు
  rationale: హీబ్రూ ‘మేలు పలికాడు’ అనే భావాన్ని సహజ తెలుగులో వాగ్దానసదృశంగా వ్యక్తం చేస్తుంది; మేలు ఇశ్రాయేలు పట్ల ఉద్దేశించబడిందనే సందర్భార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో లిప్యంతరీకరించాం.
- issue: חֹתֵן מֹשֶׁה సూచించే ఖచ్చిత బంధుత్వం
  choice: మోషే మామ
  alternative: మోషే బావ / వివాహబంధువు
  rationale: ‘మామ’ సాధారణమైన ప్రధాన అర్థం. అయితే ఈ పదం విస్తృతంగా వివాహబంధువును కూడా సూచించగలదు కాబట్టి వంశసంబంధ సమస్యను ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని తెలిపాం.
- issue: דִּבֶּר טוֹב యొక్క భావం
  choice: మేలు చేస్తానని చెప్పాడు
  alternative: ఇశ్రాయేలు గురించి మేలుగా పలికాడు
  rationale: సందర్భంలో ఈ మాట ఇశ్రాయేలుకు కలిగే మేలును సూచిస్తుంది. అయినా మూలంలోని ‘మాట్లాడు’ అనే క్రియను ‘చెప్పాడు’గా నిలిపి, పూర్తిగా ‘వాగ్దానం చేశాడు’ అని నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు’ మూలంలోని వ్యాకరణ సంఖ్యను సహజంగా ప్రతిబింబిస్తుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పేరుకు జతచేయబడింది.
