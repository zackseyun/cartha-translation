source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: te
  text: నీవు మాతో వస్తే, యాహ్వే మాకు చేసే[a] మేలును మేము నీకు చేస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే మాతో చేసే ఆ మేలును మేము నీకు చేస్తాం.”
    reason: עִמָּנוּ అంటే అక్షరార్థంగా ‘మాతో’; ప్రధాన పాఠంలో సందర్భానికి సహజమైన ‘మాకు’ ఉపయోగించబడింది.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: నీవు … వస్తే
  rationale: ఈ సందర్భంలో ఈ పదబంధం షరతును పరిచయం చేస్తుంది. హెబ్రీ నుడికారాన్ని పదేపదే అనువదించకుండా, ఆధునిక తెలుగులో సహజమైన షరతు వాక్యంగా వ్యక్తం చేశాం.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: నీవు మాతో వస్తే
  rationale: הלך ఇక్కడ ప్రయాణంలో తోడుగా వెళ్లడాన్ని సూచిస్తుంది. మాట్లాడుతున్నవారు బయలుదేరుతున్న ప్రయాణంలో తనతో రావాలని ఆహ్వానిస్తున్నందున తెలుగులో ‘మాతో వస్తే’ సహజంగా ఉంది.
- source_word: הַטּוֹב הַהוּא
  choice: మేలును
  rationale: ఈ నిర్దిష్టమైన ‘మేలు’ను తరువాతి సంబంధ వాక్యం వివరిస్తుంది. తెలుగులో ‘యాహ్వే మాకు చేసే మేలు’ అనే నిర్మాణం భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: యాహ్వే మాకు చేసే మేలు
  rationale: יטב హిఫీల్ రూపం మేలు చేయడం లేదా ప్రయోజనం కలిగించడం అనే భావాన్ని ఇస్తుంది. עִמָּנוּ అక్షరార్థంగా ‘మాతో’ అయినా, ఇక్కడ సందర్భానుసారంగా ‘మాకు’ అని అనువదించడం సహజం; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: మేము నీకు చేస్తాం
  rationale: ముందున్న ‘మేలు’నే కర్మగా కొనసాగిస్తూ, హెబ్రీలో పునరావృతమైన יטב మూలపద భావాన్ని ‘మేలును … చేస్తాం’గా నిలిపాం. మూలంలో లేని ‘అదే’ అనే పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: యాహ్వే చేసే మేలుకు ఇశ్రాయేలీయుల ప్రతిస్పందనలో సమానత్వ భావం
  choice: ‘మేలును మేము నీకు చేస్తాం’
  alternative: ‘అదే మేలును మేము నీకు చేస్తాం’
  rationale: రెండు ఉపవాక్యాల్లోనూ יטב మూలం ఉండటం పరస్పర సంబంధాన్ని సూచిస్తుంది; అయితే ‘అదే’ అని స్పష్టంగా చెప్పడం మూలపాఠం కంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది. అందువల్ల పునరుక్తిని నిలిపి, అదనపు పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘నీవు’ అనే ఏకవచన సంబోధన మూలంలోని ఏకవచన క్రియారూపానికి అనుగుణం. షరతు–ఫలిత నిర్మాణాన్ని తెలుగులో సంక్షిప్తంగా ఉంచి, హెబ్రీలోని ‘మేలు చేయు’ పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
