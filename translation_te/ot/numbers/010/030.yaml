source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו לֹ֣א אֵלֵ֑ךְ כִּ֧י אִם אֶל אַרְצִ֛/י וְ/אֶל מוֹלַדְתִּ֖/י אֵלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: te
  text: అయితే అతడు అతనితో, “లేదు, నేను వెళ్లను; దానికి బదులుగా నా స్వదేశానికీ నా బంధువుల దగ్గరకూ వెళ్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֵלֵךְ
  choice: నేను రాను
  rationale: మోషేతో కలిసి ప్రయాణించాలన్న ఆహ్వానానికి ఇచ్చిన నిరాకరణ కాబట్టి, సహజమైన తెలుగు సంభాషణలో ‘నేను రాను’ అని అనువదించాం.
- source_word: כִּי אִם
  choice: (వేరుగా పదం చేర్చకుండా వాక్య విభజన)
  rationale: ఇక్కడ ఇది ముందున్న నిరాకరణకు భిన్నంగా తాను చేయబోయేదాన్ని తెలియజేస్తుంది. తెలుగులో రెండు వాక్యాలుగా చెప్పడం ద్వారా ఆ వ్యత్యాసం సహజంగా స్పష్టమవుతుంది.
- source_word: אֶל אַרְצִי
  choice: నా స్వదేశానికి
  rationale: ‘నా దేశానికి/భూమికి’ అనే భావాన్ని ఈ సందర్భంలో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: నా బంధువుల దగ్గరికి
  rationale: מוֹלֶדֶת పదం జన్మస్థలం, స్వజనం లేదా బంధువర్గాన్ని సూచించగలదు; సమాంతరంగా ఇప్పటికే ‘స్వదేశం’ ఉన్నందున ఇక్కడ కుటుంబ/బంధుత్వ భావాన్ని ఎంచుకున్నాం.
- source_word: אֵלֵךְ
  choice: వెళ్తాను
  rationale: తన స్వదేశం, బంధువుల వైపు తిరిగి వెళ్లాలనే ఉద్దేశాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. మూలంలోని నిరాకరణ మరియు ప్రత్యామ్నాయ ఉద్దేశం స్పష్టంగా నిలిపాం; వ్యాఖ్యానాత్మక లేదా మతశాఖాపరమైన పదాలను చేర్చలేదు.
