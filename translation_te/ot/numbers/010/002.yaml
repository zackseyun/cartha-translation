id: NUM.10.2
reference: Numbers 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: te
  text: “నీ కోసం రెండు వెండి బూరలు తయారుచేయి. వాటిని సుత్తితో కొట్టి తయారుచేయి. సమాజాన్ని పిలిచి సమకూర్చడానికి, శిబిరాలు బయలుదేరడానికి అవి నీకు ఉపయోగపడతాయి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: నీ కోసం ... చేయించు
  rationale: לְךָ లోని ప్రయోజనార్థక భావాన్ని ‘నీ కోసం’ నిలుపుతుంది. సందర్భంలో మోషే స్వయంగా లోహపని చేయడం కంటే వాటిని తయారు చేయించాలనే ఆజ్ఞ సహజంగా ఉద్దేశించబడింది; అందువల్ల తెలుగు వాడుకలో ‘చేయించు’ సహజం.
- source_word: שְׁתֵּי חֲצֽוֹצְרֹת כֶּסֶף
  choice: రెండు వెండి బూరలు
  rationale: חֲצֹצְרָה వంపుగల కొమ్ము కాకుండా లోహంతో చేసిన నిటారైన ఊదువాద్యాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘వెండి బూరలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో మలిచిన పనిగా
  rationale: లోహాన్ని కొట్టి లేదా సుత్తితో మలిచి తయారు చేసే విధానాన్ని తెలియజేస్తుంది. ‘ఒకే ముక్కగా’ అనడం మూలపదం స్పష్టంగా చెప్పనిదాన్ని జోడించే అవకాశం ఉన్నందున నివారించబడింది.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: వాటిని ... చేయించాలి
  rationale: మొదటి ఆజ్ఞను బలపరుస్తూ తయారీ విధానాన్ని నిర్దేశించే హెబ్రీయ ఉపదేశాత్మక అసంపూర్ణ క్రియను తెలుగులో సహజమైన విధిగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיוּ לְךָ
  choice: అవి నీకు ఉపయోగపడాలి
  rationale: కేవలం స్వామ్యాన్ని కాకుండా తరువాత పేర్కొన్న రెండు ప్రయోజనాల కోసం అవి సేవ చేయడాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְמִקְרָא הָעֵדָה
  choice: సమాజాన్ని సమావేశపరచడానికి
  rationale: מִקְרָא ఇక్కడ పిలుపు లేదా సమకూర్చే సంకేతం; הָעֵדָה ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ఈ ప్రయోజనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: శిబిరాలు బయలుదేరడానికి
  rationale: מַסַּע బయలుదేరడం, ప్రయాణం మొదలుపెట్టడం అనే భావాన్ని ఇస్తుంది. శిబిరాలకు బయలుదేరే సంకేతంగా బూరలు ఉపయోగపడతాయనే సందర్భార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ఆజ్ఞాత్మకమైన గౌరవప్రద శైలిని నిలుపుతూ అనువదించబడింది. మూలంలోని తయారీ విధానం మరియు బూరల రెండు ప్రయోజనాలు స్పష్టంగా ఉంచబడ్డాయి.
