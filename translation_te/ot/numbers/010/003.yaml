    text: 'లేదా, మరింత అక్షరార్థంగా: “వారు వాటిని ఊదాలి; సమాజమంతా నీ దగ్గరకు చేరాలి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  choice: వారు ... ఊదినప్పుడు
  rationale: వావ్‌తో కూడిన క్రియారూపం ఆదేశాల క్రమంలో కాలసూచక భావాన్ని ఇస్తోంది; అందువల్ల సహజమైన తెలుగులో ‘ఊదినప్పుడు’ అని అనువదించాం.
- source_word: בָּהֵן
  choice: ఆ బాకాలు
  rationale: స్త్రీలింగ బహువచన సర్వనామం ముందటి వచనంలోని రెండు వెండి బాకాలను సూచిస్తుంది. తెలుగులో సూచ్యం స్పష్టంగా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేశాం.
- source_word: וְנוֹעֲדוּ
  choice: సమావేశం కావాలి
  rationale: నిఫాల్ రూపం పిలుపు మేరకు సమాజం ఒకచోట చేరడాన్ని సూచిస్తుంది; విధి సందర్భాన్ని తెలుగులో ‘కావాలి’ తెలియజేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీ వద్దకు
  rationale: హీబ్రూ పదబంధానికి నేరమైన దిశార్థం ‘నీ వద్దకు’; మోషే ఉన్న చోటికి సమాజం చేరడాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది. ‘సమాజమంతా’ ఆధునిక తెలుగులో సమగ్రతను, సామూహిక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం దగ్గర
  rationale: పదం గుడారంలోకి ప్రవేశించే చోటును సూచిస్తుంది; స్థలసంబంధ వాక్య నిర్మాణంలో ‘ప్రవేశద్వారం దగ్గర’ సహజంగా ఉంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సన్నిధి గుడారం
  rationale: దేవుడు తన ప్రజలను నియమితంగా కలిసే పవిత్ర గుడారాన్ని సూచించే స్థిరమైన, సంక్షిప్త తెలుగు పదబంధం.
