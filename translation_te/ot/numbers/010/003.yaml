translation:
  language: te
  text: వారు ఆ బాకాలు ఊదినప్పుడు[a], సమాజమంతా సమావేశ గుడారం ప్రవేశద్వారం దగ్గర నీ దగ్గరకు చేరాలి.
  philosophy: optimal-equivalence
  footnotes:
