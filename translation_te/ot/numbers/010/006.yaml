- from: మీరు రెండవసారి హెచ్చరిక సంకేతాన్ని[a] ఊదినప్పుడు, దక్షిణం వైపున మకాం వేసిన శిబిరాలు బయలుదేరాలి. వారు బయలుదేరేందుకు హెచ్చరిక సంకేతాన్ని ఊదాలి.
  to: మీరు రెండవ హెచ్చరిక సంకేతాన్ని[a] ఊదినప్పుడు, దక్షిణం వైపున మకాం వేసిన శిబిరాలు బయలుదేరాలి. వారి బయలుదేరే సందర్భాల కోసం వారు హెచ్చరిక సంకేతాన్ని ఊదాలి.
