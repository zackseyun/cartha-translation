source:
  edition: WLC
  text: וּ/תְקַעְתֶּ֤ם תְּרוּעָה֙ שֵׁנִ֔ית וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים תֵּימָ֑נָ/ה תְּרוּעָ֥ה יִתְקְע֖וּ לְ/מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: te
  text: మీరు రెండవ హెచ్చరిక సంకేతాన్ని[a] ఊదినప్పుడు, దక్షిణం వైపున మకాం వేసిన శిబిరాలు బయలుదేరాలి. వారి బయలుదేరే సందర్భాల కోసం వారు హెచ్చరిక సంకేతాన్ని ఊదాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంకేత ధ్వనిని’ లేదా ‘బూరధ్వనిని’; హీబ్రూ תְּרוּעָה శిబిరాలు కదలాలని సూచించే ప్రత్యేకమైన బూర సంకేతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: మీరు ... ఊదినప్పుడు
  rationale: תקע అనే క్రియ ఇక్కడ బూరలు ఊదడాన్ని సూచిస్తుంది. ద్వితీయ పురుష బహువచన సంబోధనను నిలుపుతూ, ఆదేశాల క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְּרוּעָה
  choice: హెచ్చరిక సంకేతం
  rationale: ఈ సందర్భంలో ఇది సాధారణ శబ్దం లేదా కేక కాదు; శిబిరాలు కదలడానికి నిర్దేశించే ప్రత్యేక బూరధ్వని. ‘హెచ్చరిక సంకేతం’ దాని కార్యాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: שֵׁנִית
  choice: రెండవసారి
  rationale: రెండవ సంకేతాన్ని సూచించే క్రమసంఖ్యార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנָסְעוּ
  choice: బయలుదేరాలి
  rationale: נסע శిబిరాన్ని ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. విధి లేదా ఆదేశ భావాన్ని ‘బయలుదేరాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: మకాం వేసిన శిబిరాలు
  rationale: గోత్రాలవారీగా ఏర్పాటైన శిబిర సమూహాలను, అవి ఆ స్థానంలో మకాం వేసి ఉన్న స్థితిని కలిపి సూటిగా వ్యక్తం చేస్తుంది.
- source_word: תֵּימָנָה
  choice: దక్షిణం వైపున
  rationale: ఇక్కడ ప్రయాణ దిశకన్నా శిబిరాల స్థానాన్ని సూచిస్తుంది; అందువల్ల స్థానార్థకమైన ఈ రూపం తగినది.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: వారు ... హెచ్చరిక సంకేతాన్ని ఊదాలి
  rationale: హీబ్రూ క్రియ తృతీయ పురుష బహువచనంలో ఉంది; కాబట్టి దానిని కర్తృవాచకంగానే ఉంచి, నామవాచకం-క్రియ పునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది.
- source_word: לְמַסְעֵיהֶם
  choice: వారు బయలుదేరేందుకు
  rationale: מסע ఇక్కడ శిబిరాన్ని ఎత్తి బయలుదేరే సందర్భాలను సూచిస్తుంది. తెలుగు వాక్యంలో ప్రయోజనార్థాన్ని సహజంగా తెలియజేస్తుంది.
