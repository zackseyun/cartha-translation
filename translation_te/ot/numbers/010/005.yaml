  edition: WLC
  text: וּ/תְקַעְתֶּ֖ם תְּרוּעָ֑ה וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים קֵֽדְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: te
  text: మీరు హెచ్చరిక ధ్వని[a] మోగించినప్పుడు, తూర్పు వైపున మకాం వేసిన శిబిరాలు బయలుదేరాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంకేత ధ్వని.” ఇక్కడి హీబ్రూ పదం శిబిరం కదలాలని తెలియజేసే ప్రత్యేకమైన బాకా ధ్వనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: మీరు ... మోగించినప్పుడు
  rationale: תקע బాకాలు ఊదడాన్ని లేదా వాటితో ధ్వని చేయడాన్ని సూచిస్తుంది. వావ్‌తో కూడిన క్రియారూపం ఇక్కడ తరువాతి ఆజ్ఞ జరిగే సందర్భాన్ని తెలియజేస్తున్నందున, సహజమైన తెలుగులో కాలార్థక ఉపవాక్యంగా అనువదించాం.
- source_word: תְּרוּעָה
  choice: హెచ్చరిక ధ్వని
  rationale: ఈ బాకా-సంకేతాల సందర్భంలో תְּרוּעָה సాధారణ శబ్దం కాకుండా, శిబిరాలు కదలడానికి ఇచ్చే ప్రత్యేక సంకేత ధ్వనిని సూచిస్తుంది. 'హెచ్చరిక ధ్వని' ఆ ప్రత్యేకతను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְנָסְעוּ
  choice: బయలుదేరాలి
  rationale: נסע శిబిర ప్రయాణ సందర్భంలో మకాం ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. నియమాత్మక భావాన్ని తెలుగులో 'బయలుదేరాలి' సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּחֲנוֹת
  choice: శిబిరాలు
  rationale: బహువచన పదం గుడారం చుట్టూ ఏర్పాటైన గోత్ర శిబిర విభాగాలను సూచిస్తుంది; 'శిబిరాలు' ప్రత్యక్షమైన, సరిపడే అనువాదం.
- source_word: הַחֹנִים
  choice: మకాం వేసిన
  rationale: ఈ క్రియావిశేషణ రూపం శిబిరాల స్థిరమైన స్థానాన్ని వివరిస్తుంది. 'మకాం వేసిన' ఆధునిక తెలుగులో సహజంగా ఉండి ఆ స్థితిని నిలుపుతుంది.
- source_word: קֵדְמָה
  choice: తూర్పు వైపున
  rationale: ఇక్కడ ఈ పదం ప్రయాణ దిశను కాకుండా శిబిరాల తూర్పు స్థానాన్ని గుర్తిస్తుంది. అందువల్ల స్థానార్థాన్ని స్పష్టంగా తెలిపే 'తూర్పు వైపున' ఎంచుకున్నాం.
