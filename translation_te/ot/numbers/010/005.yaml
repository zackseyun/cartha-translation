translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. బాకా అనే సాధనాన్ని సందర్భం ఇప్పటికే అందిస్తున్నందున వాక్యంలో అనవసరంగా చేర్చకుండా, ధ్వని యొక్క సంకేత స్వభావాన్ని ప్రధాన పాఠ్యం మరియు పాదసూచికలో నిలిపాం.
