  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: te
  text: ఇశ్శాఖారు కుమారుల గోత్ర సమూహానికి అధిపతిగా సూయారు కుమారుడు నెతనేలు ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమూహం’కు ‘సైన్యం’ లేదా ‘విభాగం’ అని కూడా అనువదించవచ్చు. హీబ్రూ צְבָא ప్రయాణ క్రమంలో ఏర్పాటుచేయబడిన గోత్ర సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధిపతిగా
  rationale: ముందటి వచనాల జాబితాతో అనుసంధానమయ్యే ఈ సూత్రబద్ధ వాక్యంలో עַל ఒక సమూహంపై నియమించబడిన నాయకత్వాన్ని సూచిస్తుంది; తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం ఈ భావాన్ని ‘అధిపతిగా’ అని వ్యక్తం చేశాం.
- source_word: צְבָא
  choice: సమూహం
  rationale: ఇక్కడ ఈ పదం ప్రయాణ క్రమంలో ఏర్పాటుచేయబడిన గోత్ర విభాగాన్ని సూచిస్తుంది; ‘సమూహం’ సైనిక భావాన్ని అతిగా మోపకుండా సంఘటిత దళం అనే భావాన్ని అందిస్తుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఈ సందర్భంలో מַטֵּה చేతికర్రను కాక ఇశ్రాయేలు గోత్ర విభాగాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: בְּנֵי יִשָׂשכָר
  choice: ఇశ్శాఖారు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే బంధుత్వ రూపాన్ని నిలుపుతూ, గోత్ర సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נְתַנְאֵל
  choice: నెతనేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בֶּן צוּעָר
  choice: సూయారు కుమారుడు
  rationale: నెతనేలు తండ్రి సంబంధాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని నేరుగా నిలిపాం.
