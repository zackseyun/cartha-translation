  register: ఆధునిక ప్రామాణిక తెలుగులో, లెక్కింపు మరియు ప్రయాణ క్రమాన్ని వివరించే సందర్భానికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని గోత్రపరమైన ‘కుమారులు’ రూపాన్ని నిలిపాం.
