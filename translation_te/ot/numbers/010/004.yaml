source:
  edition: WLC
  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: te
  text: అయితే వారు ఒక్క బూరనే ఊదితే, ఇశ్రాయేలు వేల విభాగాలకు అధిపతులైన నాయకులు[a] నీ దగ్గరికి సమకూడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు వేల విభాగాలకు అధిపతులు’ అనే హీబ్రూ మాట, ఇశ్రాయేలులోని వెయ్యి-విభాగాల నాయకులను సూచించే అవకాశం ఉంది. కొందరు దీనిని భావానువాదంగా ‘ఇశ్రాయేలు వంశాల అధిపతులు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... ఊదితే
  rationale: ముందటి వచనంలో రెండు బూరలు ఊదడం గురించి ఉన్న ఆదేశానికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּאַחַת
  choice: ఒక్క బూరనే
  rationale: హీబ్రూలో ‘ఒక్కదానితో’ అని సంక్షిప్తంగా ఉంది; ముందు సందర్భం బూరలను సూచిస్తున్నందున ‘బూర’ను స్పష్టంగా చేర్చి, ‘నే’తో రెండు బూరలకు వ్యతిరేకమైన భావాన్ని నిలిపాం.
- source_word: יִתְקָעוּ
  choice: వారు ... ఊదితే
  rationale: బూరల ద్వారా సంకేతమిచ్చే సందర్భంలో תקע అంటే ఊదడం లేదా మోగించడం; బూరకు ‘ఊదడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וְנוֹעֲדוּ
  choice: సమకూడాలి
  rationale: יעד అనే ధాతువు నిఫాల్ రూపం ఇక్కడ సంకేతం అందినప్పుడు నియమితంగా కూడడాన్ని సూచిస్తుంది; ‘సమకూడాలి’ ఆజ్ఞాత్మక సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీ దగ్గరికి
  rationale: మోషే వైపు వచ్చి కూడడాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: הַנְּשִׂיאִים
  choice: నాయకులు
  rationale: נשיאים గోత్ర లేదా సమూహ నాయకులను సూచిస్తుంది; రాజకుమారులు అనే అపార్థాన్ని నివారిస్తూ పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వెయ్యిమంది విభాగాలకు అధిపతులైన
  rationale: హీబ్రూ నిర్మాణంలోని ‘ఇశ్రాయేలు వేలమందికి అధిపతులు’ అనే పరిపాలనా లేదా సైనిక భావాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యేలా ‘విభాగాలు’ అని ఇచ్చాం; ‘వంశాల అధిపతులు’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో ఖరారు చేయలేదు.
