  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఒక్క బూరనే’ సందర్భంలో దాగి ఉన్న నామవాచకాన్ని స్పష్టం చేస్తుంది. ‘వెయ్యిమంది విభాగాలు’ అనే పదబంధం మూలంలోని పరిపాలనా/సైనిక పదజాలాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయమైన ‘వంశాలు’ అనే అర్థాన్ని పాదసూచికలో ఉంచింది.
