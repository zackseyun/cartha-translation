  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన గౌరవప్రద వాక్య నిర్మాణం వాడబడింది. ‘ఆషేరు కుమారులు’ మూలభాష రూపాన్ని నిలుపుతుంది; ‘దళం’ సాధారణ పాఠకునికి అర్థమయ్యేలా క్రమబద్ధమైన గోత్ర సమూహ భావాన్ని అందిస్తుంది.
