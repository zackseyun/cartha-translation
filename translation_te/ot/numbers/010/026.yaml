source:
  edition: WLC
  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: te
  text: ఆషేరు కుమారుల గోత్ర దళంపై నాయకుడిగా ఓక్రాను కుమారుడు పగీయేలు ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దళం’కు ‘సైన్యం,’ ‘విభాగం,’ లేదా ‘సైనిక దళం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం ఇశ్రాయేలు శిబిర క్రమంలోని ఒక వ్యవస్థీకృత సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: అధిపతిగా
  rationale: ముందటి వచనాల జాబితా నిర్మాణాన్ని కొనసాగిస్తూ, గోత్ర దళంపై నియమించబడిన నాయకత్వాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; וְ భావం వాక్యసందర్భంలోని కొనసాగింపులో అంతర్భూతమైంది.
- source_word: צְבָא
  choice: దళం
  rationale: ఇశ్రాయేలు శిబిర ప్రయాణ క్రమంలో ఏర్పాటుచేయబడిన గోత్ర సమూహాన్ని సూచిస్తుంది. ‘దళం’ సైన్యార్థాన్ని పూర్తిగా బలవంతం చేయకుండా క్రమబద్ధమైన విభాగ భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ అక్షరార్థమైన ‘కర్ర’ కాదు; ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచించే సందర్భోచిత అర్థం.
- source_word: בְּנֵי אָשֵׁר
  choice: ఆషేరు కుమారులు
  rationale: హీబ్రూ నిర్మాణంలోని ‘ఆషేరు కుమారులు’ అనే రూపాన్ని నిలుపుతూ, గోత్రానికి చెందిన వారిని సూచిస్తుంది.
- source_word: פַּגְעִיאֵל
  choice: పగీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן עָכְרָן
  choice: ఆక్రాను కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజంగా ‘కుమారుడు’ అని అనువదించి, తండ్రి పేరును లిప్యంతరీకరించింది.
