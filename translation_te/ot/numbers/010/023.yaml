  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: te
  text: మనష్షే కుమారుల గోత్రపు దళానికి అధిపతిగా పెదాసూరు కుమారుడు గమలీయేలు ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దళం’ అని అనువదించిన హీబ్రూ పదాన్ని ‘సైన్యం,’ ‘సేన,’ లేదా ‘విభాగం’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది క్రమబద్ధంగా ఏర్పాటైన గోత్ర సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధిపతిగా
  rationale: ఈ శిబిర ప్రయాణ క్రమంలో עַל ఒక గోత్ర దళానికి నియమించబడిన నాయకుణ్ణి సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘అధిపతిగా’ సహజంగా ఈ సంబంధాన్ని తెలియజేస్తుంది; ప్రారంభ וְ సందర్భానుసారమైన వరుసను సూచించినా, విడి వచనంలో ప్రత్యేకంగా ‘మరియు’ అనడం అసహజం.
- source_word: צְבָא
  choice: దళం
  rationale: ఇక్కడ ఈ పదం యుద్ధ సైన్యాన్ని మాత్రమే కాక, ప్రయాణానికి క్రమబద్ధంగా ఏర్పాటైన గోత్ర విభాగాన్ని సూచిస్తుంది. ‘దళం’ సంక్షిప్తంగా, సహజంగా ఉండి ఆ వ్యవస్థీకృత సమూహ భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: సంఖ్యాకాండంలోని ఈ సందర్భంలో מַטֵּה కర్రను కాక ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది; అందువల్ల ‘గోత్రం’ సందర్భోచితమైన అర్థం.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారులు
  rationale: హీబ్రూ పదబంధంలోని వంశ సంబంధాన్ని ‘కుమారులు’ అని నిలుపుతూ, ఇది మనష్షే పేరుతో గుర్తించబడిన గోత్ర వంశాన్ని సూచించేలా అనువదించబడింది.
- source_word: גַּמְלִיאֵל
  choice: గమలీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి సంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: פְּדָה צוּר
  choice: పెదాసూరు
  rationale: మూల పాఠంలో రెండు భాగాలుగా కనిపించినా ఇది ఒకే వ్యక్తినామం; అందువల్ల తెలుగులో ఒకే పేరుగా లిప్యంతరీకరించాం.
