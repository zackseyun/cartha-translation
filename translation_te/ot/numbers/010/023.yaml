  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. గోత్ర ప్రయాణ క్రమాన్ని తెలిపే పరిపాలనా భావం స్పష్టంగా ఉండేలా ‘గోత్రపు దళానికి అధిపతిగా’ అనే నిర్మాణాన్ని ఎంచుకున్నాం.
