source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: te
  text: వారు యాహ్వే ఆజ్ఞ ప్రకారం మోషే ద్వారా మొదటిసారిగా బయలుదేరారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘మోషే చేతి ద్వారా’; ఇది మోషేను సాధనంగా లేదా మధ్యవర్తిగా సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: ప్రయాణ వర్ణనలో נסע శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరారు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּרִאשֹׁנָה
  choice: మొదటిసారిగా
  rationale: ఈ క్రియావిశేషణ రూపం ‘మొదట’ లేదా ‘మొదటిసారిగా’ అని అర్థమవుతుంది; సీనాయి నుండి ఇశ్రాయేలీయుల తొలి క్రమబద్ధ ప్రయాణాన్ని ఇక్కడ సూచిస్తున్నందున ‘మొదటిసారిగా’ సముచితం.
- source_word: עַל פִּי
  choice: ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘నోటి ప్రకారం’ అనే ఈ హీబ్రూ నుడికారం, సందర్భంలో దేవుని ఆదేశానికి అనుగుణంగా చర్య తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మోషే యొక్క సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘మోషే ద్వారా’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ నుడికారాలను అక్షరార్థంగా కాక భావస్పష్టంగా అనువదించి, ‘మోషే చేతి ద్వారా’ అనే మూలరూపాన్ని పాదటిప్పణిలో నిలిపాం.
