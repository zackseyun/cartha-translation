source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: te
  text: ఆ తర్వాత దాను కుమారుల శిబిరపు పతాకం కిందనున్న దళం[a] బయలుదేరింది. అది తమ తమ విభాగాల ప్రకారం ఉన్న అన్ని శిబిరాలకు వెనుక రక్షక దళంగా[b] కదిలింది[c]. దాని దళానికి నాయకుడిగా అమ్మీషద్దాయి కుమారుడు అహీయెజెరు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దాను కుమారుల శిబిరపు పతాకం.’ ఇక్కడ పతాకం దాని కింద కదిలిన శిబిర దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెనుక భాగాన్ని కాపాడే దళంగా.’ హెబ్రీ పదానికి వెనుక మిగిలినవారిని సమకూర్చే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘విభాగాలు’ అని అనువదించిన హెబ్రీ పదాన్ని ‘దళాలు’ లేదా ‘సైన్య సమూహాలు’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది ప్రయాణ క్రమంలో ఏర్పాటైన గోత్ర విభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: ఆ తర్వాత ... బయలుదేరింది
  rationale: వావ్-క్రమకథనం ఇక్కడ తదుపరి ప్రయాణ దశను ముందుకు తీసుకెళ్తుంది. ఆధునిక తెలుగులో ‘ఆ తర్వాత ... బయలుదేరింది’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: דֶּגֶל מַחֲנֵה בְנֵי דָן
  choice: దాను కుమారుల శిబిరపు పతాక దళం
  rationale: דֶּגֶל కేవలం వస్తువైన పతాకాన్నే కాక, ఆ పతాకం కింద క్రమబద్ధమైన శిబిర సమూహాన్ని కూడా సూచిస్తుంది. ‘పతాక దళం’ ఈ సందర్భార్థాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది; בְנֵי דָן లోని కుటుంబ-గోత్ర రూపాన్ని ‘దాను కుమారులు’గా నిలుపుతుంది.
- source_word: מְאַסֵּף
  choice: వెనుక దళంగా
  rationale: ఈ ప్రయాణ సందర్భంలో ఈ పదం చివరగా కదులుతూ మొత్తం శిబిర సమూహానికి వెనుక భాగాన్ని కాపాడే దళాన్ని సూచిస్తుంది. ‘వెనుక దళం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: לְכָל הַמַּחֲנֹת
  choice: శిబిరాలన్నిటికీ
  rationale: దాను దళం మొత్తం ప్రయాణ ఏర్పాటుకు సంబంధించి నిర్వర్తించిన వెనుక దళపు పాత్రను దత్తివాచక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ సైన్య విభాగాల ప్రకారం
  rationale: צְבָאוֹת ఇక్కడ యుద్ధ సైన్యాలనే పరిమితంగా కాక, క్రమబద్ధమైన గోత్ర ప్రయాణ విభాగాలను సూచిస్తుంది. ‘తమ తమ’ బహువచన సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וְעַל צְבָאוֹ
  choice: దాని సైన్య విభాగానికి అధిపతిగా ... ఉన్నాడు
  rationale: עַל నాయకత్వాన్ని, צָבָא క్రమబద్ధమైన దళాన్ని సూచిస్తున్నాయి. తెలుగు వాక్యనిర్మాణంలో ఈ రూపం సహజంగా ఉండి మూలంలోని నాయకత్వ సంబంధాన్ని కాపాడుతుంది.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: అమ్మీషద్దాయి కుమారుడు అహీయెజెరు
  rationale: వ్యక్తి పేర్లను తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, హెబ్రీ పితృనామ సూత్రాన్ని ‘కుమారుడు’తో నిలిపింది.
