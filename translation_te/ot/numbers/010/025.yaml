    issue: ‘పతాక దళం’ can imply a distinct type of military unit not explicitly denoted by the Hebrew.
    rationale: דֶּגֶל is a banner/standard and, by metonymy in this marching formula, the formation identified by it. Making the metonymy explicit avoids an opaque or misleading Telugu compound.
  - severity: low
