translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి వాడబడింది. మూలంలోని సైనిక-శిబిర పదజాలాన్ని పూర్తిగా యుద్ధార్థానికి పరిమితం చేయకుండా, ప్రయాణ క్రమంలోని క్రమబద్ధమైన గోత్ర విభాగాల భావాన్ని నిలిపాం. పేర్లకు సాధారణ తెలుగు బైబిల్ ధ్వన్యరూపాలకు దగ్గరైన రూపాలు ఎంచుకున్నాం.
