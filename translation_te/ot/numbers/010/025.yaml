  terminology: ‘వెనుక రక్షక దళం’ communicates מְאַסֵּף well without requiring a narrowly combat-specific reading. ‘విభాగాలు’ appropriately renders the ordered tribal units. Personal names and the patronymic are retained in standard, intelligible Telugu transliteration.
  issues:
