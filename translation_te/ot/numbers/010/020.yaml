  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: te
  text: మరియు గాదు కుమారుల గోత్ర దళానికి[a] అధిపతిగా దెవూయేలు కుమారుడు ఎల్యాసాఫు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దళం’కు బదులుగా ‘సైనిక సమూహం’ లేదా ‘విభాగం’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం צְבָאకు తరచుగా సైనిక భావఛాయ ఉంటుంది; ఇక్కడ అది క్రమపద్ధతిలో ప్రయాణించే గోత్ర సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: అధిపతిగా
  rationale: ఈ పునరావృత నాయకత్వ జాబితా సూత్రంలో עַל ఒక గోత్రదళంపై నియమించబడిన నాయకుణ్ణి సూచిస్తుంది. తెలుగులో ‘అధిపతిగా’ సహజంగా ఆ పర్యవేక్షణ భావాన్ని అందిస్తుంది; వాక్యారంభంలోని וְ సందర్భానుసార అనుసంధానాన్ని కలిగించినా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: צְבָא
  choice: దళం
  rationale: ఈ పదానికి సైన్యం లేదా సైనిక సమూహం అనే ఛాయ ఉన్నప్పటికీ, సంఖ్యాకాండము 10లో క్రమబద్ధంగా ప్రయాణించే గోత్ర సమూహాన్ని సూచిస్తుంది. ‘దళం’ వ్యవస్థీకృత సమూహ భావాన్నీ, మూలంలోని సైనిక ఛాయనూ మితంగా నిలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ מַטֶּה కర్రను కాకుండా ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది; అందువల్ల ‘గోత్రం’ సందర్భోచితమైన సాధారణ తెలుగు పదం.
- source_word: בְנֵי גָד
  choice: గాదు వంశపు
  rationale: అక్షరార్థంగా ‘గాదు కుమారులు’ అయినా, ఇది గాదు సంతతికి చెందిన గోత్ర సమూహాన్ని సూచించే స్థిరమైన హెబ్రీ ప్రయోగం. ‘గాదు వంశపు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶלְיָסָף
  choice: ఎల్యాసాఫు
  rationale: హెబ్రీ ఉచ్చారణకు దగ్గరగా వ్యక్తిపేరును తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: בֶּן דְּעוּאֵל
  choice: దెయూయేలు కుమారుడు
  rationale: హెబ్రీ వంశసంబంధ సూత్రాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
