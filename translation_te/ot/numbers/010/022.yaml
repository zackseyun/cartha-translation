source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: te
  text: తర్వాత ఎఫ్రాయిము కుమారుల శిబిరపు పతాకం[a] కిందనున్నవారు తమ తమ దళాల ప్రకారం[b] బయలుదేరారు. ఆ దళానికి అధిపతిగా అమ్మీహూదు కుమారుడు ఎలీషామా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పతాకం’కు బదులు ‘ధ్వజం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం శిబిరం ప్రయాణించినప్పుడు దాని గోత్రాన్ని గుర్తించే పతాకాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ తమ సైనిక విభాగాల ప్రకారం’ లేదా ‘తమ తమ సమూహాల ప్రకారం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం శిబిరంలోని క్రమబద్ధమైన, సైనిక శైలిలో ఏర్పాటైన విభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: తర్వాత ... బయలుదేరారు
  rationale: వావ్‌తో కూడిన క్రియ కథనంలోని తదుపరి క్రమాన్ని సూచిస్తుంది. ప్రయాణానికి సిద్ధమైన శిబిర సమూహం కదలడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘తర్వాత ... బయలుదేరారు’ అని అనువదించాం.
- source_word: דֶּגֶל
  choice: పతాకం
  rationale: ఈ పదం గోత్ర శిబిరం ఏ గుర్తు కింద కదిలిందో తెలిపే పతాకాన్ని సూచిస్తుంది. ‘పతాకం’ ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: מַחֲנֵה
  choice: శిబిరం
  rationale: అరణ్య ప్రయాణ సందర్భంలో మకాం వేసిన గోత్ర సమూహాన్ని ‘శిబిరం’ సహజంగా సూచిస్తుంది.
- source_word: בְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారులు
  rationale: మూలంలోని సాధారణ గోత్ర నామకరణాన్ని పారదర్శకంగా నిలుపుతుంది; దీన్ని ‘ప్రజలు’ లేదా ‘సంతతి’గా సవరించలేదు.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ దళాల ప్రకారం
  rationale: צָבָא ఇక్కడ కేవలం యుద్ధ సైన్యాన్ని కాక, క్రమబద్ధంగా ఏర్పాటైన శిబిర విభాగాలను సూచిస్తుంది. ‘తమ తమ దళాల ప్రకారం’ ఆ వ్యవస్థీకృత కదలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעַל צְבָאוֹ
  choice: ఆ దళానికి అధిపతిగా ... ఉన్నాడు
  rationale: עַל నాయకత్వ సంబంధాన్ని సూచిస్తుంది. మూలంలోని ఏకవచన ప్రత్యయాన్ని ‘ఆ దళానికి’గా నిలుపుతూ, తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని ఉపయోగించాం.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: అమ్మీహూదు కుమారుడు ఎలీషామా
  rationale: హీబ్రూ పేర్లను తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చి, మూలంలోని ‘కుమారుడు’ అనే వంశ సంబంధాన్ని నిలిపాం.
