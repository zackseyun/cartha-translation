translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పతాకం కిందివారు’ అనే రూపం హీబ్రూలో పతాకమే బయలుదేరినట్లు ఉన్న సంక్షిప్త రూపకాన్ని తెలుగులో అర్థవంతంగా విప్పి చెబుతుంది; అయితే శిబిరపు పతాక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
