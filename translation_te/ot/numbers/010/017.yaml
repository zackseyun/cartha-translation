translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని రెండు ప్రధాన క్రియలను విడి వాక్యాలుగా ఇచ్చి స్పష్టత పెంచినా, భావక్రమం మరియు గుడారం అనే పద పునరుక్తి నిలుపబడ్డాయి.
