id: NUM.10.17
reference: Numbers 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הוּרַ֖ד הַ/מִּשְׁכָּ֑ן וְ/נָסְע֤וּ בְנֵֽי גֵרְשׁוֹן֙ וּ/בְנֵ֣י מְרָרִ֔י נֹשְׂאֵ֖י הַ/מִּשְׁכָּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: te
  text: అప్పుడు నివాస గుడారం దించబడింది. గెర్షోను కుమారులు, మెరారీ కుమారులు నివాస గుడారాన్ని మోస్తూ బయలుదేరారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  choice: దించబడింది
  rationale: ירד ధాతువు హొఫాల్ రూపం ఇక్కడ నిలబెట్టిన గుడారాన్ని కిందికి దించడం అనే నిష్క్రియార్థాన్ని ఇస్తుంది. ‘విప్పబడింది’ సందర్భానుకూలమైనా, మూలంలోని క్రియకంటే యాంత్రిక విధానాన్ని ఎక్కువగా నిర్దిష్టం చేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: ప్రత్యక్ష గుడారం
  rationale: మִשְׁכָּן ఇశ్రాయేలు పరిశుద్ధ గుడారాన్ని సూచించే స్థిర పదం. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ప్రత్యక్ష గుడారం’ స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: וְנָסְעוּ
  choice: బయలుదేరారు
  rationale: ప్రయాణ సందర్భంలో נסע శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది; ‘బయలుదేరారు’ సహజమైన ఆధునిక తెలుగు.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: గెర్షోను కుమారులు
  rationale: మూలంలోని ‘గెర్షోను కుమారులు’ అనే వంశపరమైన వ్యక్తీకరణను నిలుపుతుంది; ‘గెర్షోనీయులు’ కూడా సందర్భార్థంగా సాధ్యమే.
- source_word: וּבְנֵי מְרָרִי
  choice: మెరారి కుమారులు
  rationale: మూలంలోని పుత్ర/వంశ నిర్మాణాన్నీ, గెర్షోను కుమారులతో ఉన్న సమాంతరతనూ నిలుపుతుంది.
- source_word: נֹשְׂאֵי
  choice: మోస్తూ
  rationale: వర్తమాన క్రియావిశేషణ భావంతో, వారు ప్రయాణిస్తూ నిర్వహించిన పనిని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: ప్రత్యక్ష గుడారాన్ని
  rationale: మూలం రెండోసారి కూడా అదే నామవాచకాన్ని పునరుక్తి చేస్తుంది. సందర్భంలో దాని విడిభాగాలు ఉద్దేశించబడ్డా, మూలంలో లేని ‘భాగాలు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
