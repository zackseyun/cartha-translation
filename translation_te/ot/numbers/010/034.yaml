source:
  edition: WLC
  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: te
  text: వారు శిబిరం నుండి బయలుదేరినప్పుడు, పగటిపూట యాహ్వే మేఘం వారి పైన ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పగటిపూట వారి మీద ఉండేది.’
    reason: עֲלֵיהֶם అనే పదబంధాన్ని ‘వారి పైన’ లేదా ‘వారి మీద’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַעֲנַן
  choice: మేఘం
  rationale: עָנָן అంటే ‘మేఘం.’ వావ్ పూర్వ వాక్యంతో కథన సంబంధాన్ని చూపుతుంది; తెలుగులో వాక్య క్రమం, సందర్భం ద్వారానే ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: עֲלֵיהֶם
  choice: వారి పైన ఉండేది
  rationale: עַל ఇక్కడ మేఘం వారి మీద/పైన ఉన్న స్థాన సంబంధాన్ని సూచిస్తుంది. ‘వారి పైన’ మూలంలోని భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יוֹמָם
  choice: పగటిపూట
  rationale: יוֹמָם అంటే ‘పగటివేళ’ లేదా ‘పగటిపూట.’ ఆధునిక తెలుగులో ‘పగటిపూట’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּנָסְעָם
  choice: వారు ... బయలుదేరినప్పుడు
  rationale: נסע క్రియారూపం శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది. కాలార్థక בְּను ‘బయలుదేరినప్పుడు’గా సహజంగా వ్యక్తం చేశాం.
- source_word: מִן הַמַּחֲנֶה
  choice: శిబిరం నుండి
  rationale: מַחֲנֶה అంటే ‘శిబిరం.’ מִן విభక్తి మూలస్థానాన్ని సూచిస్తున్నందున ‘నుండి’గా అనువదించాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా వ్యక్తినామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా.’
- issue: עֲלֵיהֶם యొక్క స్థానార్థం
  choice: వారి పైన ఉండేది
  alternative: వారి మీద ఉండేది
  rationale: మూలంలోని עַל ‘పైన/మీద’ అనే రెండింటినీ అనుమతిస్తుంది. మేఘం యొక్క స్థానాన్ని స్పష్టంగా చూపేందుకు ‘పైన’ ఎంచుకున్నాం; రక్షణాత్మక భావాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. హెబ్రీ వాక్య క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కాల ఉపవాక్యాన్ని ముందుంచి సహజమైన తెలుగు ప్రవాహాన్ని సాధించాం. మూలంలో లేని రక్షణ లేదా మార్గదర్శకత్వ భావాలను పాఠ్యంలో చేర్చలేదు.
