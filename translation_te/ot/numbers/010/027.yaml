- from: నఫ్తాలి కుమారుల గోత్రపు దళానికి అధిపతిగా ఏనాను కుమారుడు అహీర ఉన్నాడు[a].
  to: మరియు నఫ్తాలి కుమారుల గోత్ర దళానికి అధిపతిగా ఏనాను కుమారుడైన అహీరా ఉన్నాడు[a].
