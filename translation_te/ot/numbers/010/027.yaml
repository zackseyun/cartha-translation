id: NUM.10.27
reference: Numbers 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: te
  text: మరియు నఫ్తాలి కుమారుల గోత్ర దళానికి అధిపతిగా ఏనాను కుమారుడైన అహీరా ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దళం’ అనే చోట ‘సైన్యం,’ ‘సేన,’ లేదా ‘విభాగం’ అని కూడా అనువదించవచ్చు. హీబ్రూ צְבָא ఇక్కడ శిబిరం వేసే, ప్రయాణించే క్రమంలో ఏర్పాటైన గోత్రపు వ్యవస్థీకృత దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధిపతిగా
  rationale: ఈ పునరావృత నాయకత్వ సూత్రంలో עַל ఒక వ్యవస్థీకృత గోత్ర దళంపై నియమితుడైన నాయకుణ్ణి సూచిస్తుంది. తెలుగులో ‘దళానికి అధిపతిగా’ సహజంగా, స్పష్టంగా ఆ సంబంధాన్ని తెలియజేస్తుంది; వాక్యారంభంలోని וְ సందర్భానుసంధానకమైనది, తెలుగులో విడిగా ‘మరియు’ చేర్చకపోయినా భావం నిలుస్తుంది.
- source_word: צְבָא
  choice: దళం
  rationale: ఇక్కడ ఈ పదం మొత్తం జాతీయ సైన్యాన్ని కాక, శిబిర-ప్రయాణ క్రమంలో ఏర్పాటైన గోత్రపు వ్యవస్థీకృత సైనిక విభాగాన్ని సూచిస్తుంది. ‘దళం’ ఆధునిక తెలుగులో ఆ భావాన్ని అతిశయింపకుండా అందిస్తుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఈ సందర్భంలో పదానికి ‘కర్ర’ అనే భౌతిక అర్థం కాదు; ఇశ్రాయేలు గోత్ర విభాగమే ఉద్దేశ్యం.
- source_word: בְּנֵי נַפְתָּלִי
  choice: నఫ్తాలి కుమారులు
  rationale: హీబ్రూ కుటుంబ సంబంధ వ్యక్తీకరణను నేరుగా నిలుపుతుంది; గోత్ర సందర్భంలో ఇది నఫ్తాలి సంతతివారిని సూచిస్తుంది.
- source_word: אֲחִירַע
  choice: అహీర
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: בֶּן עֵינָן
  choice: ఏనాను కుమారుడు
  rationale: సాధారణ హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హీబ్రూ నాయకత్వ సూత్రాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో ఇచ్చి, ‘నఫ్తాలి కుమారులు’ అనే మూలంలోని కుటుంబ-గోత్ర వ్యక్తీకరణను నిలిపాం.
