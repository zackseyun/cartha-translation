reference: Numbers 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: te
  text: మీ దేశంలో మిమ్మల్ని పీడించే శత్రువుపై యుద్ధానికి వెళ్లినప్పుడు[a], మీరు బూరలతో హెచ్చరిక సంకేతం ఇవ్వాలి. అప్పుడు మీ దేవుడైన యాహ్వే[c] సన్నిధిలో మీరు జ్ఞాపకానికి తీసుకురాబడతారు[b], మరియు మీ శత్రువుల నుండి రక్షించబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దేశంలో యుద్ధానికి వెళ్లవలసి వస్తే.” హీబ్రూ సంధిపదం పరిస్థితిని లేదా షరతును సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మీ దేవుడైన యాహ్వే ఎదుట మీరు జ్ఞాపకానికి తీసుకురాబడతారు”; భావానువాదంగా, “మీ దేవుడైన యాహ్వే మిమ్మల్ని జ్ఞాపకం చేసుకుంటాడు.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలోని YHWH అనే దైవనామాన్ని ఇక్కడ “యాహ్వే” అని లిప్యంతరీకరించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: వెళ్లినప్పుడు
  rationale: నియమబోధ సందర్భంలో ఈ సంధి భవిష్యత్తులో ఎదురయ్యే పరిస్థితిని ‘ఎప్పుడు’ లేదా ‘ఒకవేళ’ అనే భావంతో పరిచయం చేయగలదు. ప్రధాన పాఠంలో సహజమైన ‘వెళ్లినప్పుడు’ ఉంచి, షరతు భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: యుద్ధానికి వెళ్లినప్పుడు
  rationale: హీబ్రూ నుడికారం యుద్ధంలో పాల్గొనడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘యుద్ధానికి వెళ్లడం’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: בְּאַרְצְכֶם
  choice: మీ దేశంలో
  rationale: ఇక్కడ אֶרֶץ ఇశ్రాయేలీయుల స్వదేశ భూభాగాన్ని సూచిస్తుంది. ‘మీ దేశంలో’ సాధారణ పాఠకుడికి స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: మిమ్మల్ని పీడించే శత్రువుతో
  rationale: צַר అనే శత్రువును సూచించే నామపదాన్నీ, צֹרֵר అనే కొనసాగుతున్న విరోధక చర్యనూ ఈ పదబంధం నిలుపుతుంది.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: మీరు బూరలతో హెచ్చరిక సంకేతం ఇవ్వాలి
  rationale: రוע హిఫీల్ రూపం బూరల సందర్భంలో కేవలం పెద్ద శబ్దం కాక, యుద్ధ హెచ్చరిక సంకేతాన్ని ఇవ్వడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వే సన్నిధిలో మీరు జ్ఞాపకం చేయబడతారు
  rationale: זכר నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలిపి, యాహ్వేను ప్రత్యక్ష కర్తగా మార్చకుండా మూలపాఠంలోని భావపరమైన ఉద్రిక్తతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: మీ శత్రువుల నుండి రక్షించబడతారు
  rationale: ישׁע నిఫాల్ రూపంలోని రక్షించబడే భావాన్నీ, సైనిక సందర్భాన్నీ నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం ఉంది. దానిని బిరుదుతో మార్చకుండా ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- issue: וֲנִזְכַּרְתֶּם యొక్క కర్మణి భావం
  choice: మీరు జ్ఞాపకం చేయబడతారు
  alternative: మీ దేవుడైన యాహ్వే మిమ్మల్ని జ్ఞాపకం చేసుకుంటాడు
  rationale: ప్రత్యామ్నాయం భావాన్ని స్పష్టంగా వివరిస్తుంది గాని, దేవుణ్ణి వ్యాకరణ కర్తగా ప్రత్యక్షంగా చేర్చుతుంది. ప్రధాన పాఠం హీబ్రూ కర్మణి రూపాన్నీ దాని దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఆజ్ఞాత్మక-నియమబోధ గాంభీర్యం మరియు హీబ్రూ కర్మణి నిర్మాణం నిలుపబడ్డాయి. ‘బూరలు’ అధ్యాయ సందర్భంలోని లోహపు సంకేత వాద్యాలను సూచిస్తుంది; మూల వచనంలో ఈ చోట ‘వెండి’ లేకపోవడంతో ఆ విశేషణం చేర్చలేదు.
