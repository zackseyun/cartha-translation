  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “యెహోవా” అనే సాంప్రదాయిక రూపం కూడా వాడబడుతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవిక ప్రసంగాన్ని ప్రారంభించే ఈ సాధారణ హీబ్రూ కథన సూత్రానికి ఆధునిక తెలుగులో ‘చెప్పాడు’ సహజంగా ఉంటుంది; తరువాతి לֵאמֹר భావాన్ని ‘ఇలా’ ద్వారా కలిపి అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపమైన ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటాన్ని సూచించే తెలుగు క్రియతో వ్యక్తిని సహజంగా సూచించే ‘తో’ విభక్తి వాడబడింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: రాబోయే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ infinitive construct భావాన్ని ఆధునిక తెలుగులో సహజమైన ‘ఇలా’ వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు. హీబ్రూ ఉచ్చారణ పునర్నిర్మాణంలో అనిశ్చితి ఉన్నందున, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటీపుగా సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. తరువాతి ప్రత్యక్ష ఆజ్ఞకు దారితీసేలా చివర ద్విబిందువు ఉంచబడింది.
