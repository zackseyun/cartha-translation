source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: te
  text: 'రెండవ సంవత్సరంలో, రెండవ నెల ఇరవయ్యవ రోజున ఇలా జరిగింది: సాక్ష్యపు నివాసస్థలం[b] మీద నుంచి మేఘం పైకి లేచింది[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి వెళ్లింది’ లేదా ‘ఎగసింది.’
    reason: עלה క్రియ మేఘం పైకి కదలడాన్ని సూచిస్తుంది; ఈ తెలుగు రూపాలూ సందర్భానుగుణమైన ప్రత్యామ్నాయాలు.
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘సాక్ష్యపు నివాసం’; దీనిని ‘సాక్ష్యపు గుడారం’ అని కూడా అనువదించవచ్చు.
    reason: మִשְׁכַּן పవిత్ర నివాసాన్ని సూచిస్తుంది; ‘గుడారం’ సందర్భానికి తగిన సాధ్యమైన ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: וַיְהִי
  choice: జరిగింది
  rationale: హీబ్రూ కథన క్రమంలో కొత్త సంఘటనను పరిచయం చేసే రూపం. తెలుగులో వాక్యాంతంలోని ‘లేచింది’ ద్వారానే సంఘటన సహజంగా వ్యక్తమవుతున్నందున ప్రత్యేకంగా ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చలేదు.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: రెండో సంవత్సరం
  rationale: కాలాన్ని సూచించే పదబంధానికి నేరమైన, ఆధునిక తెలుగు రూపం.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెలలో
  rationale: సంవత్సరంలోని నెలను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: ఆ నెల ఇరవయ్యో రోజున
  rationale: ‘నెలలో ఇరవై’ అనే హీబ్రూ కాలవాచక నుడికారాన్ని తెలుగులో స్పష్టత కోసం ‘రోజు’తో వ్యక్తం చేసింది.
- source_word: נַעֲלָה
  choice: పైకి లేచింది
  rationale: עלה అనే క్రియ మేఘం పైకి కదలడాన్ని సూచిస్తుంది. ‘పైకి లేచింది’ మూలార్థాన్ని, ప్రయాణానికి సంకేతమైన సందర్భాన్ని రెండింటినీ సహజంగా అందిస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: ఇశ్రాయేలీయులకు మార్గదర్శకమైన, ఇప్పటికే పరిచితమైన నిర్దిష్ట మేఘాన్ని సూచించే సరళ అనువాదం.
- source_word: מֵעַל
  choice: పైనుండి
  rationale: మందిరం పైన ఉన్న స్థానం నుంచి మేఘం కదిలిన స్థలార్థాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: מִשְׁכַּן
  choice: మందిరం
  rationale: అరణ్య ప్రయాణంలోని దేవుని మోసుకెళ్లగల పవిత్ర నివాసాన్ని సూచించే స్థిరపడిన తెలుగు బైబిలు పదం. ఇది శాశ్వత ఆలయమనే భావం కలిగించకుండా సందర్భం ద్వారా అర్థమవుతుంది; మూలంలోని ‘నివాసం’ భావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: הָעֵדֻת
  choice: సాక్ష్య
  rationale: నిబంధనకు సాక్ష్యంగా ఉంచబడిన పలకలతో సంబంధమున్న ఆరాధనా పదాన్ని వ్యాఖ్యానాత్మకంగా ‘నిబంధన’గా మార్చకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: మִשְׁכַּן הָעֵדֻת అనే పవిత్రస్థల నామం
  choice: సాక్ష్య మందిరం
  alternative: సాక్ష్యపు నివాసం; సాక్ష్యపు గుడారం
  rationale: మִשְׁכָּן ప్రధానంగా ‘నివాసం/మందిరం’ను సూచిస్తుంది; ‘గుడారం’ సాధారణంగా אֹהֶלకు సరిపోతుంది. ‘సాక్ష్య మందిరం’ తెలుగు బైబిలు సంప్రదాయంతో అనుసంధానాన్ని కాపాడుతూ, עֵדוּתను వ్యాఖ్యానాత్మకంగా ‘నిబంధన’గా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ‘రెండో,’ ‘ఇరవయ్యో’ వంటి సహజ సంఖ్యారూపాలు వాడబడ్డాయి. వాక్యం గంభీరతను నిలుపుకుంటూనే పాతకాలపు ‘లేచెను,’ ‘ఇరువదియవ’ వంటి రూపాలను నివారించింది. పాదటిప్పణి గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచబడ్డాయి.
