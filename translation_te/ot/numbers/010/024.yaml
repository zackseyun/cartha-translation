source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: te
  text: మరియు బెన్యామీను కుమారుల గోత్రపు దళంపై గిద్యోని కుమారుడైన అబీదాను అధిపతిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దళం’ అనే పదాన్ని ‘సైన్యం’ లేదా ‘విభాగం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం సైనిక పద్ధతిలో క్రమబద్ధంగా ఏర్పాటైన సమూహాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధిపతిగా
  rationale: ముందటి వచనాల యాత్రాక్రమ జాబితాను కొనసాగిస్తూ, గోత్రపు దళంపై నియమించబడిన నాయకుణ్ణి సూచిస్తుంది. తెలుగులో ‘అధిపతిగా’ పర్యవేక్షణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צְבָא
  choice: దళం
  rationale: ఈ సందర్భంలో యుద్ధసైన్యాన్ని సంకుచితార్థంలో కాక, క్రమబద్ధంగా ప్రయాణించే గోత్ర విభాగాన్ని సూచిస్తుంది; ‘దళం’ ఆ వ్యవస్థీకృత సమూహ భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ భౌతికమైన కర్ర అనే అర్థం కాక, జనగణన మరియు యాత్రా వ్యవస్థలోని గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని, ఈ భాగంలోని పునరావృత గోత్ర సూత్రాన్ని నిలుపుతూ తెలుగులో గంభీరంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲבִידָן
  choice: అబీదాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, బైబిలు నామరూప సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן גִּדְעוֹנִי
  choice: గిద్యోనీ కుమారుడు
  rationale: వంశపరిచయాన్ని తెలిపే בן పదానికి సహజమైన తెలుగు సమానార్థక నిర్మాణం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గోత్ర యాత్రాక్రమపు సూత్రబద్ధ శైలిని నిలుపుతూ, అసహజమైన పదక్రమాన్ని నివారించాం.
