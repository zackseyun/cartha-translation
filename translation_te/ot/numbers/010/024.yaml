revisions:
- from: బెన్యామీను కుమారుల గోత్రపు దళానికి అధిపతిగా గిద్యోనీ కుమారుడు అబీదాను ఉన్నాడు.[a]
  to: మరియు బెన్యామీను కుమారుల గోత్రపు దళంపై గిద్యోని కుమారుడైన అబీదాను అధిపతిగా ఉన్నాడు.[a]
  rationale: The revision restores the source’s connective ‘and,’ makes the supervisory force of ‘over’ explicit, and standardizes the patronymic name transliteration. The lexical footnote remains appropriately anchored to ‘దళం’ and states viable alternatives without implying a narrowly combatant sense.
