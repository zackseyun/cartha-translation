id: NUM.10.36
reference: Numbers 10:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: te
  text: 'అది నిలిచినప్పుడల్లా మోషే ఇలా అనేవాడు: “యాహ్వే[a], ఇశ్రాయేలీయుల పదివేలల వేలమంది వద్దకు తిరిగి రా[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో దేవుని వ్యక్తిగత నామమైన יהוה (YHWH) ఉంది.
    reason: divine_name
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు యొక్క పదివేలల వేలమంది”; ఇది ఇశ్రాయేలు ప్రజల అపార సంఖ్యను బలంగా తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: అది నిలిచినప్పుడల్లా
  rationale: בְּ + infinitive construct temporal clause; the feminine suffix refers back to the covenant chest. The context also gives the clause an iterative force, represented by ‘అప్పుడల్లా’.
- source_word: יֹאמַר
  choice: మోషే ఇలా అనేవాడు
  rationale: In this narrative setting the imperfect describes Moses’ customary words whenever the chest rested. Supplying Moses’ name from the immediate context makes the Telugu natural without changing the referent.
- source_word: שׁוּבָה
  choice: తిరిగి రా
  rationale: The imperative of שוב with paragogic ה is a direct appeal to return. This rendering preserves the movement implied by the verb and does not add a theological explanation.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: The Hebrew text has the divine personal name YHWH, so it is transliterated rather than replaced with a title.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వారి అసంఖ్యాక వేలమంది
  rationale: The Hebrew combines two large-number nouns for emphatic magnitude. Natural Telugu conveys the vast multitude while a footnote preserves the unusually stacked wording.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: The source directly uses the Tetragrammaton. Transliteration preserves the covenant name instead of substituting a title or a less direct traditional form.
- issue: The force of שׁוּבָה addressed to YHWH
  choice: దగ్గరకు తిరిగి రా
  alternative: వారి మధ్య నివసించు
  rationale: The imperative explicitly says ‘return’; translating it as ‘dwell’ would resolve its theological implication rather than preserve the source wording.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘అది’ అనే స్త్రీలింగ సూచన ముందటి సందర్భంలోని నిబంధన మందసాన్ని సూచిస్తుంది; మూల వాక్యంలో లేని నామాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
