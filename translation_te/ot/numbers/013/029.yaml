translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. భౌగోళిక నామాలను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించి, సామూహిక జాతినామాలను సహజమైన బహువచనంలో ఇచ్చాం. హీబ్రూ వాక్యంలోని మూడు నివాస ప్రాంతాల సమాంతర నిర్మాణాన్ని అర్ధవిరామాలతో స్పష్టపరిచాం.
