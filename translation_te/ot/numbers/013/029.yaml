  variant: modern standard Telugu
source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: te
  text: అమాలేకీయులు నెగెవు ప్రాంతంలో[a] నివసిస్తున్నారు; హిత్తీయులు, యెబూసీయులు, అమోరీయులు కొండ ప్రాంతంలో నివసిస్తున్నారు; కనానీయులు సముద్రం పక్కన, యొర్దాను పొడవునా[b] నివసిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నెగెవు’ను ‘దక్షిణ ప్రాంతం’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది కనానులోని నిర్దిష్ట దక్షిణ ప్రాంతాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారానికి అక్షరార్థం ‘యొర్దాను పక్కన’; భావం ‘యొర్దాను వెంట’ లేదా ‘యొర్దాను పొడవునా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: అమాలేకీయులు
  rationale: ఇక్కడ వ్యక్తికన్నా ఆ పేరుగల ప్రజలను సూచించే సామూహిక నామంగా ఉంది; సహజమైన ఆధునిక తెలుగులో ప్రజావాచక బహువచనంగా అనువదించాం.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: నివసిస్తున్నారు
  rationale: హీబ్రూ వర్తమాన కృదంతం స్థిరంగా నివసించడాన్ని సూచిస్తుంది; ‘నివసిస్తున్నారు’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: నెగెవు ప్రాంతంలో
  rationale: నֶגֶב ఇక్కడ కనాను దక్షిణానున్న నిర్దిష్ట భౌగోళిక ప్రాంతాన్ని సూచించే అవకాశమే ఎక్కువ; אֶרֶץ భావాన్ని తెలుగులో సహజంగా ‘ప్రాంతం’తో వ్యక్తం చేశాం.
- source_word: הַחִתִּי
  choice: హిత్తీయులు
  rationale: రూపంలో ఏకవచనమైనా ప్రజాసమూహాన్ని సూచించే సామూహిక జాతినామం కాబట్టి తెలుగులో బహువచనంగా ఇచ్చాం.
- source_word: הַיְבוּסִי
  choice: యెబూసీయులు
  rationale: ప్రజాసమూహాన్ని సూచించే జాతినామం కాబట్టి సహజమైన తెలుగు బహువచనం వాడాం.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: ప్రజాసమూహాన్ని సూచించే జాతినామం కాబట్టి సహజమైన తెలుగు బహువచనం వాడాం.
- source_word: בָּהָר
  choice: కొండ ప్రాంతంలో
  rationale: הַר ఇక్కడ ఒకే కొండను కాక పర్వతమయమైన భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; ‘కొండ ప్రాంతం’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: ప్రజాసమూహాన్ని సూచించే సామూహిక జాతినామం కాబట్టి బహువచనంగా ఇచ్చాం.
- source_word: עַל הַיָּם
  choice: సముద్రం పక్కన
  rationale: హీబ్రూ పదబంధంలోని ‘సముద్రం వద్ద/పక్కన’ అనే సాధారణ స్థలార్థాన్ని, ‘తీరంలో’ అని మరీ నిర్దిష్టం చేయకుండా నిలిపాం.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: యొర్దాను పొడవునా
  rationale: యָד అక్షరార్థంగా ‘చేయి’ అయినా ఈ స్థలసూచక నుడికారంలో ‘పక్కన/వెంబడి’ అని అర్థం; నది వెంట విస్తరించిన నివాసాన్ని తెలుగులో సహజంగా తెలిపాం.
