lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ ప్రతినిధుల జాబితాలో לְ + מַטֶּה గోత్ర సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘గోత్రం నుండి’ సహజంగా ఉండి, ఆ వ్యక్తి ఆ గోత్రానికి చెందిన ప్రతినిధి అనే భావాన్ని అందిస్తుంది.
- source_word: אֶפְרָיִם
  choice: ఎఫ్రాయిము
  rationale: హీబ్రూ గోత్రనామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: הוֹשֵׁעַ
  choice: హోషేయ
  rationale: ఇది తరువాత యెహోషువ అని పేరు పెట్టబడిన వ్యక్తి పూర్వనామం (సంఖ్యాకాండము 13:16). హీబ్రూ రూపాన్ని స్పష్టంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: בִּן
  choice: కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణానికి జాబితా సందర్భంలో సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: נוּן
  choice: నూను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
