source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: te
  text: అక్కడ మేము నెఫీలీయులను—నెఫీలీయుల నుండి వచ్చిన అనాకు కుమారులను[a]—చూశాం. మా దృష్టికి మేము మిడతల్లా కనిపించాం; వారి దృష్టికి కూడా అలాగే కనిపించాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ అనువాదంలో, ‘నెఫీలీయులు’ను ‘దైత్యులు’ అని కూడా అనువదిస్తారు. హెబ్రీ పదం యొక్క అర్థం అనిశ్చితంగా ఉన్నందున ప్రధాన పాఠ్యంలో దాన్ని లిప్యంతరీకరించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: నెఫీలీయులు
  rationale: ఈ పదం ఎవరిని సూచిస్తుందో అనిశ్చితంగా ఉండడంతో, ‘దైత్యులు’ వంటి వ్యాఖ్యానాత్మక అనువాదానికి బదులు హెబ్రీ పేరును తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּנֵי עֲנָק
  choice: అనాకు కుమారులు
  rationale: హెబ్రీ భాషలోని పుత్రసంబంధ వ్యక్తీకరణను సన్నిహితంగా నిలుపుతుంది; సందర్భంలో ఇది అనాకు వంశస్థులను సూచించగలదు.
- source_word: מִן הַנְּפִלִים
  choice: నెఫీలీయుల నుండి వచ్చిన
  rationale: מן అనే పూర్వప్రత్యయం ఇక్కడ మూలం లేదా వంశసంబంధాన్ని సూచించే అవకాశముంది; సంబంధాన్ని మరీ నిర్దిష్టంగా నిర్ణయించకుండా ‘నుండి వచ్చిన’ అని అనువదించాం.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: మా దృష్టికి మేము ... కనిపించాం
  rationale: ఇది వాస్తవ రూపాంతరాన్ని కాక వారి స్వీయ అంచనాను తెలిపే జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּחֲגָבִים
  choice: మిడతల్లా
  rationale: חגב మిడత లేదా గడ్డిమిడతను సూచించగలదు; ఇక్కడ అల్ప పరిమాణాన్ని తెలిపే ఉపమానంగా సాధారణమైన ‘మిడత’ను ఎంచుకున్నాం.
- source_word: וְכֵן
  choice: కూడా అలాగే
  rationale: ముందటి స్వీయ దృష్టితో ఇతరుల దృష్టిని సమాంతరంగా అనుసంధానించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְעֵינֵיהֶם
  choice: వారి దృష్టికి
  rationale: హెబ్రీ జాతీయంలోని అంచనా లేదా భావనను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ‘మా దృష్టికి’ అనే మునుపటి పదబంధంతో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: נְפִילִים పద అనువాదం
  choice: నెఫీలీయులు
  alternative: దైత్యులు; పతితులు
  rationale: ఆదికాండం 6:4లో కూడా కనిపించే ఈ పదార్థం వివాదాస్పదం. హెబ్రీ మూలం నిర్బంధించని నిర్దిష్ట వివరణను ప్రధాన పాఠ్యంలో ప్రవేశపెట్టకుండా లిప్యంతరీకరణను ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. మూలంలోని పునరుక్తి, దృష్టి-సంబంధ సమాంతరత, నెఫీలీయులతో అనాకు కుమారుల సంబంధంలోని కొంత అస్పష్టతను సాధ్యమైనంతవరకు నిలిపాం.
