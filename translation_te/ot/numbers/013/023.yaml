translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. భౌగోళిక పదంలోని భావవిస్తృతిని పాదసూచికలో నిలిపి, ప్రధాన పాఠ్యాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
