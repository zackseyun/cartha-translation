id: NUM.13.23
reference: Numbers 13:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד נַ֣חַל אֶשְׁכֹּ֗ל וַ/יִּכְרְת֨וּ מִ/שָּׁ֤ם זְמוֹרָה֙ וְ/אֶשְׁכּ֤וֹל עֲנָבִים֙ אֶחָ֔ד וַ/יִּשָּׂאֻ֥/הוּ בַ/מּ֖וֹט בִּ/שְׁנָ֑יִם וּ/מִן הָ/רִמֹּנִ֖ים וּ/מִן הַ/תְּאֵנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: te
  text: వారు ఎష్కోలు లోయకు[a] వచ్చారు. అక్కడినుంచి ఒకే ద్రాక్షగుత్తి ఉన్న తీగకొమ్మను[b] కోసి, దానిని ఒక కర్రపై ఇద్దరు మోశారు. వారు కొన్ని దానిమ్మ పండ్లను, కొన్ని అంజూరపు పండ్లను కూడా తీసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎష్కోలు వాగులోయకు,’ ‘ఎష్కోలు వాగు దగ్గరకు.’ హీబ్రూ נַחַל అనే పదం లోయతోపాటు కనుమలోని కాలానుగుణ వాగును లేదా దాని మార్గాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక ద్రాక్షగుత్తి ఉన్న తీగకొమ్మను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: ఎష్కోలు లోయ
  rationale: נַחַל అనే పదం లోయ, కనుమలోని కాలానుగుణ వాగు లేదా వాగుమార్గాన్ని సూచించగలదు. సాధారణ పాఠకులకు సహజంగా ఉండే ‘లోయ’ను ప్రధాన పాఠ్యంలో ఉంచి, ఇతర భౌగోళిక భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: זְמוֹרָה
  choice: తీగకొమ్మ
  rationale: ఈ పదం ప్రత్యేకంగా ద్రాక్షతీగ కొమ్మను సూచిస్తుంది. ‘కొమ్మ’ కంటే ‘తీగకొమ్మ’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: ఒకే ద్రాక్షగెల
  rationale: אֶחָד వల్ల గెల ఒక్కటేననే సంఖ్యాపరమైన ఉద్ఘాటన నిలుస్తుంది; ‘ఒకే’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיִּשָּׂאֻהוּ
  choice: దానిని ... మోశారు
  rationale: ఏకవచన ప్రత్యయం కోసిన తీగకొమ్మ-ద్రాక్షగెలను ఒకే వస్తువుగా వెనక్కి సూచిస్తుంది. ‘మోశారు’ రవాణా భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: בַמּוֹט
  choice: ఒక మోపుకర్రపై
  rationale: מוֹט అనేది బరువు మోయడానికి ఉపయోగించే కర్ర లేదా దండం. ‘మోపుకర్ర’ ఆ ప్రయోజనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּשְׁנָיִם
  choice: ఇద్దరు కలిసి
  rationale: అక్షరార్థంగా ‘ఇద్దరిచేత/ఇద్దరితో’ అని ఉంది. సందర్భంలోని వేగులలో ఇద్దరు మోశారని తెలుగులో సహజంగా వ్యక్తం చేశాం; ‘మనుషులు’ వంటి అదనపు నిర్దిష్టతను చేర్చలేదు.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: కొన్ని దానిమ్మ పండ్లను, కొన్ని అంజూరపు పండ్లను కూడా తీసుకున్నారు
  rationale: హీబ్రూ వాక్యంలో ముందటి క్రియ భావం కొనసాగుతుంది. తెలుగులో సంపూర్ణత కోసం ‘తీసుకున్నారు’ను స్పష్టంగా చేర్చి, రెండు ఫలాల ముందు ఉన్న מִן భావాన్ని ‘కొన్ని’తో నిలిపాం.
