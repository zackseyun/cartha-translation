source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: te
  text: “నీ కొరకు పురుషులను పంపు. నేను ఇశ్రాయేలు కుమారులకు[b] ఇస్తున్న కనాను దేశాన్ని వారు పరిశీలించాలి[a]. ప్రతి పితృగోత్రం నుండి ఒక్కొక్క పురుషుణ్ణి మీరు పంపాలి; వారిలో ప్రతివాడూ నాయకుడై ఉండాలి[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అన్వేషించాలి’ లేదా ‘వేగు చూడాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది స్త్రీపురుషులందరితో కూడిన ఇశ్రాయేలు ప్రజలను సూచించే హీబ్రూ నిబంధనాత్మక ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: ‘వారిలో ప్రతివాడూ అధిపతిగా ఉండాలి’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం గోత్ర నాయకుణ్ణి, ప్రధానుణ్ణి లేదా అధిపతిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: నీ కోసం ... పంపు
  rationale: శׁלח అనే ఏకవచన ఆజ్ఞను ‘పంపు’గా అనువదించి, לְךָను ‘నీ కోసం’గా నిలిపాం. దీనివల్ల అది అనుమతి, వ్యక్తిగత ప్రమేయం లేదా ఉద్ఘాటనను సూచిస్తుందా అనే మూలంలోని భావసూక్ష్మతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: אֲנָשִׁים
  choice: పురుషులను
  rationale: ఈ సందర్భంలో ప్రతి గోత్రానికి చెందిన పురుష ప్రతినిధులను సూచిస్తున్నందున లింగాన్ని స్పష్టంగా తెలిపే ‘పురుషులు’ అనే పదాన్ని ఎంచుకున్నాం.
- source_word: וְיָתֻרוּ
  choice: వారు పరిశీలించాలి
  rationale: תור ఇక్కడ దేశాన్ని సంచరించి తెలుసుకోవడం లేదా గూఢంగా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. ‘పరిశీలించాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘వేగు చూడాలి’ అనే ఒక్క అర్థానికే పరిమితం చేయదు.
- source_word: אֶרֶץ כְּנַעַן
  choice: కనాను దేశం
  rationale: אֶרֶץను స్పష్టంగా ప్రతిబింబిస్తూ, తెలుగు పదక్రమానికి అనుగుణంగా ‘కనాను దేశం’ అని ఇచ్చాం.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: నేను ... ఇస్తున్న
  rationale: నֹתֵן అనే కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తులో నెరవేరే దైవిక అనుగ్రహ భావాన్ని ‘ఇస్తున్న’ నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని కుటుంబసంబంధమైన, నిబంధనాత్మకమైన ప్రయోగాన్ని నిలిపేందుకు సాధారణ జాతినామమైన ‘ఇశ్రాయేలీయులకు’ బదులు ‘ఇశ్రాయేలు కుమారులకు’ అని ఇచ్చాం.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: ఒక్కో గోత్రం నుండి ఒక్కొక్క పురుషుణ్ణి
  rationale: హీబ్రూ పునరుక్తిలోని విభజనాత్మక ఉద్ఘాటనను తెలుగులో సహజమైన ‘ఒక్కో... ఒక్కొక్క’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: వారి పితరుల గోత్రాలలో ఒక్కో గోత్రం నుండి
  rationale: מַטֶּהను ‘గోత్రం’గా, אֲבֹתָיוలోని పితృపారంపర్య వంశ భావాన్ని ‘వారి పితరుల’గా స్పష్టంగా నిలిపాం.
- source_word: תִּשְׁלָחוּ
  choice: మీరు పంపాలి
  rationale: మొదటి ఏకవచన ఆజ్ఞ తర్వాత మూలంలో ఉన్న ద్వితీయ పురుష బహువచన రూపాన్ని ‘మీరు’గా నిలిపాం; ఇది మోషేతో పాటు బాధ్యత వహించే సమూహాన్ని ఉద్దేశించి ఉండవచ్చు, కాని ఆ వ్యాఖ్యానాన్ని పాఠ్యంలో ఖరారు చేయలేదు.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: వారిలో ప్రతి ఒక్కడూ నాయకుడై ఉండాలి
  rationale: נָשִׂיאకు నాయకుడు, అధిపతి లేదా ప్రధానుడు అనే అర్థాలు ఉండవచ్చు. ఆధునిక పాఠకులకు స్పష్టమైన ‘నాయకుడు’ను ప్రధాన పాఠ్యంలో వాడాం.
theological_decisions:
- issue: దైవిక ఆజ్ఞలో לְךָ యొక్క భావసూక్ష్మత
  choice: ‘నీ కోసం’ అని ప్రధాన పాఠ్యంలో నిలిపాం
  alternative: తెలుగులో విడిగా అనువదించకుండా ‘పురుషులను పంపు’ అని మాత్రమే ఇవ్వడం; లేదా ‘నీ తరఫున’ అని ఇవ్వడం
  rationale: మూలంలో ఉన్న దత్తివాచక సర్వనామాన్ని నిలపడం వల్ల అది అనుమతినా, వ్యక్తిగత ప్రమేయమా, ఉద్ఘాటనా అనే వ్యాఖ్యానాన్ని అనువాదమే నిర్ణయించదు.
- issue: בני ישראל అనే నిబంధనాత్మక కుటుంబ ప్రయోగం
  choice: ‘ఇశ్రాయేలు కుమారులు’
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతతి’
  rationale: ఈ పదబంధం మొత్తం ఇశ్రాయేలు ప్రజలను సూచించినప్పటికీ, మూలంలోని కుటుంబసంబంధ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; దాని సమూహార్థాన్ని పాదటిప్పణిలో వివరించాం.
- issue: ఏకవచన ఆజ్ఞ నుంచి బహువచన ఆదేశానికి మార్పు
  choice: ‘పంపు’ తరువాత ‘మీరు పంపాలి’ అని సంఖ్యామార్పును నిలిపాం
  alternative: రెండు చోట్లా ‘నీవు పంపాలి’ అని ఏకవచనంగా సమతలీకరించడం
  rationale: హీబ్రూ రూపాల్లోని నిజమైన వ్యాకరణ మార్పును నిలిపి, అది మోషే ఒక్కడినేనా లేక అతనితో కూడిన సమూహాన్నా ఉద్దేశిస్తుందనే ప్రశ్నను మౌనంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘పితరులు’, ‘గోత్రం’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలను నిలిపి, అత్యంత ప్రాచీనమైన ‘వేగు చూడుట’ వంటి ప్రయోగాలను నివారించాం. మూలంలోని ఏకవచన ‘నీ’ నుంచి బహువచన ‘మీరు’కు మార్పును ఉద్దేశపూర్వకంగా సంరక్షించాం.
