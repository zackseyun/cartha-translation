  to: ఆ దేశం సారవంతమైనదో నిస్సారమైనదో, అందులో చెట్లు ఉన్నాయో లేవో చూడండి.[a] ధైర్యంగా ఉండండి, ఆ దేశపు పండ్లలో కొన్నిటిని తీసుకోండి.” అది తొలిపక్వ ద్రాక్షపండ్ల కాలం.[b]
