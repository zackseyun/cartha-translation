id: NUM.13.20
reference: Numbers 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: te
  text: ఆ దేశం సారవంతమైనదో నిస్సారమైనదో, అందులో చెట్లు ఉన్నాయో లేవో చూడండి.[a] ధైర్యంగా ఉండండి, ఆ దేశపు పండ్లలో కొన్నిటిని తీసుకోండి.” అది తొలిపక్వ ద్రాక్షపండ్ల కాలం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందులో కలప ఉందో లేదో.” హీబ్రూ పదానికి “చెట్టు” లేదా “కలప” అని అర్థం రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆ రోజులు తొలిపక్వ ద్రాక్షపండ్ల రోజులు”; అంటే ద్రాక్ష కోతకాలం ఆరంభం.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה
  choice: సారవంతమైనది
  rationale: అక్షరార్థంగా ‘కొవ్వైనది’; నేలను గురించి వాడినప్పుడు సారవంతమైన, దిగుబడినిచ్చే భూమిని సూచిస్తుంది.
- source_word: רָזָה
  choice: బీడైనది
  rationale: అక్షరార్థంగా ‘చిక్కినది/సన్ననిది’; భూమి సందర్భంలో సారం తక్కువగా ఉన్న నేలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: అందులో చెట్లు ఉన్నాయో లేవో
  rationale: עֵץ అనే పదానికి ‘చెట్టు’ లేదా ‘కలప’ అనే అర్థాలు ఉండవచ్చు. దేశ స్వభావాన్ని పరిశీలించే సందర్భంలో ‘చెట్లు’ ప్రధాన పఠనం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: ధైర్యంగా ఉండి
  rationale: తమను తాము బలపరచుకోవాలనే ఆజ్ఞాత్మక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; కేవలం శారీరక బలాన్ని మాత్రమే సూచించదు.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: ఆ దేశపు పండ్లలో కొన్నిటిని తీసుకురండి
  rationale: מִן పండ్లలో కొంతను సూచిస్తుంది. పరిశీలకులు తిరిగి రావాల్సిన సందర్భం వల్ల ‘తీసుకురండి’ సహజంగా, అంతర్భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: ద్రాక్షపండ్లు మొదట పక్వానికి వచ్చే కాలం
  rationale: ద్రాక్షలు తొలిసారిగా పక్వమయ్యే ఋతుదశను సూచిస్తుంది; ఇక్కడ ఆరాధనా సంబంధమైన ‘ప్రథమఫలాలు’ అనే భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: וְהַיָּמִים יְמֵי
  choice: అప్పుడు ... కాలం
  rationale: హెబ్రీ కథనంలోని కాలసూచనను పదపునరుక్తి వల్ల తెలుగులో కలిగే అసహజత లేకుండా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. భూమి గుణాన్ని ‘సారవంతమైనదో బీడైనదో’ అని స్పష్టంగా తెలిపి, עֵץ లోని చెట్టు/కలప సందిగ్ధతను పాదసూచికలో నిలిపాం. ప్రధాన పాఠ్యంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇచ్చాం.
