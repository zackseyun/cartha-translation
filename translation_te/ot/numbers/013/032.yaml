  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: te
  text: 'అప్పుడు వారు తాము పరిశీలించిన ఆ దేశం గురించి ఇశ్రాయేలు కుమారులకు[c] చెడ్డ నివేదికను[a] తెలియజేస్తూ ఇలా అన్నారు: “మేము పరిశీలించడానికి[b] దాటివెళ్లిన ఆ దేశం తన నివాసులను మింగివేసే దేశం[d]. అందులో మేము చూసిన ప్రజలందరూ అసాధారణ శరీర పరిమాణం గల పురుషులే[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చెడ్డ నివేదికను వ్యాప్తి చేశారు”; మరింత బలంగా, “ఆ దేశంపై అపవాదు మోపారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “వేగుచూడడానికి,” “గూఢచారులుగా పరిశీలించడానికి.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో “ఇశ్రాయేలు కుమారులు”; ఇశ్రాయేలు ప్రజలను సూచించే స్థిరమైన సామూహిక పేరు.
    reason: cultural_note
  - marker: d
    text: అక్షరార్థంగా, “తన నివాసులను తినే దేశం”; లేదా “తన నివాసులను కబళించే దేశం.”
    reason: metaphor_note
  - marker: e
    text: లేదా “ఎత్తైన దేహాకృతి గల పురుషులు”; ఇక్కడ అసాధారణ శారీరక పరిమాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: చెడ్డ నివేదికను ప్రచారం చేస్తూ
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థంగా నివేదికను ‘బయటికి తేవడం’ అనే భావాన్ని కలిగించినా, సందర్భంలో దానిని ప్రజల్లో వ్యాప్తి చేయడమే ఉద్దేశం. ‘ప్రచారం చేస్తూ’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, అపవాదు అనే మరింత బలమైన తీర్పును ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ నిర్దిష్ట భూభాగాన్ని సూచించే ‘దేశం’ సాధారణ తెలుగు పాఠకులకు సహజంగా ఉంటుంది; వాగ్దాన దేశపు భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: תָּרוּ / לָתוּר
  choice: పరిశీలించిన / పరిశీలించడానికి
  rationale: ఈ క్రియ అన్వేషించడం లేదా గూఢచర్యంగా పరిశీలించడం అనే పరిధి కలిగి ఉంది. ‘పరిశీలించడం’ సందర్భానికి తగిన సహజమైన పదం; గూఢచర్య భావాన్ని అనవసరంగా ప్రధానార్థం చేయదు.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే నిబంధనాత్మక సామూహిక సంబోధనను రూపపరంగా నిలుపుతుంది.
- source_word: עָבַרְנוּ בָהּ
  choice: దాటివెళ్లిన
  rationale: భూభాగం గుండా ప్రయాణించిన భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: తన నివాసులను మింగివేసే దేశం
  rationale: ‘మింగివేసే’ అనే రూపకం హీబ్రూలోని భయానక, అతిశయోక్తితో కూడిన వాక్చాతుర్యాన్ని బలంగా నిలుపుతుంది.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: గొప్ప దేహాకృతి గల పురుషులు
  rationale: ఈ పదబంధం సామాజిక హోదాను కాక అసాధారణ శారీరక పరిమాణాన్ని సూచిస్తుంది. ‘దేహాకృతి’ ఆ భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక పదబంధం
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలీయులకు
  rationale: ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే స్థిర నిబంధనాత్మక పేరు అయినప్పటికీ, మూలంలోని స్పష్టమైన ‘కుమారులు’ రూపాన్ని పాఠ్యంలో కనిపించేలా ఉంచాం.
- issue: దేశం తన నివాసులను ‘మింగివేస్తుంది’ అనే వాక్యం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: నివాసులు నశించే దేశం అని వివరణాత్మకంగా మార్చడం
  rationale: వక్తల మాటలోని భయపెట్టే అతిశయోక్తి మరియు దాని అర్థసందిగ్ధతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘ఇశ్రాయేలు కుమారులు’ ద్వారా మూలంలోని నిబంధనాత్మక సామూహిక రూపం నిలుపబడింది; ‘మింగివేసే దేశం’ అనే సజీవ రూపకం సున్నితపరచబడలేదు.
