  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు అక్కడి నుండి కోసిన గుత్తి కారణంగా ఆ స్థలానికి ఎష్కోలు లోయ[a][b][c] అని పేరు పెట్టబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎష్కోలు వాడి’ లేదా ‘ఎష్కోలు కనుమ.’ హీబ్రూ నహల్ అనే పదం ఋతుపరంగా నీరు ప్రవహించే వాగు పడకను లేదా దానితో సంబంధమైన లోయను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎష్కోలు’ అనే పేరు హీబ్రూలో ‘గుత్తి’ అని అర్థమిచ్చే పదంలా వినిపిస్తుంది. ఇశ్రాయేలు కుమారులు అక్కడి నుండి కోసిన గుత్తి కారణంగా ఆ స్థలానికి ఈ పేరు పెట్టబడింది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతానం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: ఆ ప్రదేశానికి
  rationale: ముందు వచనంలో పేర్కొన్న స్థలాన్ని సూచించే నిర్దిష్ట పదబంధం; తెలుగు వాక్యనిర్మాణంలో పేరుపెట్టడాన్ని సహజంగా వ్యక్తం చేయడానికి సంప్రదాన విభక్తి వాడబడింది.
- source_word: קָרָא
  choice: అని పేరు వచ్చింది
  rationale: హీబ్రూలో క్రియ మూడవ పురుష ఏకవచన కర్తరిలో ఉన్నా, కర్తను పేర్కొనని నామకరణ నిర్మాణంగా పనిచేస్తుంది. ‘పేరు వచ్చింది’ ఆధునిక తెలుగులో సహజమైన కర్మణి భావ సమానం.
- source_word: נַחַל
  choice: లోయ
  rationale: ఈ పదం కాలానుగుణ జలప్రవాహపు పల్లం, వాగు పాయ లేదా దానితో ముడిపడిన లోయను సూచించగలదు. స్థలనామంలో ‘లోయ’ సహజమైన, విస్తృతమైన తెలుగు సమానం.
- source_word: אֶשְׁכּוֹל
  choice: ఎష్కోలు
  rationale: ఇక్కడ ఇది స్థలనామంలోని పేరుగా పనిచేస్తున్నందున లిప్యంతరీకరించబడింది.
- source_word: עַל אֹדוֹת
  choice: కారణంగా
  rationale: ఈ పదబంధం ఆ స్థలానికి ఆ పేరు రావడానికి గల కారణాన్ని తెలియజేస్తుంది.
- source_word: הָאֶשְׁכּוֹל
  choice: గెల
  rationale: తక్షణ సందర్భంలో ఇది ద్రాక్షగెలను సూచిస్తుంది; మూల వచనంలో ఈ వాక్యంలో ‘ద్రాక్ష’ పదం లేకపోవడంతో ‘గెల’ మాత్రమే ఉంచబడింది.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: కోసిన
  rationale: పంట గెలను తీగనుంచి వేరుచేయడాన్ని తెలుగులో సహజంగా ‘కోసిన’ అని చెబుతారు.
- source_word: מִשָּׁם
  choice: అక్కడ
  rationale: ఆ ప్రదేశం నుంచే గెలను కోశారనే స్థానిక భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ రూపాన్ని సన్నిహితంగా నిలుపుతూ, దాని ప్రామాణిక జనసమూహార్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధపు అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: ఇక్కడ ప్రధాన సిద్ధాంత వివాదం లేదు. అయితే మూలంలోని కుటుంబసంబంధ రూపం మరియు ఒడంబడిక జనసమూహ గుర్తింపును దగ్గరగా నిలుపడానికి ‘ఇశ్రాయేలు కుమారులు’ ఎంచుకోబడింది; మరింత సహజమైన జననామ ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. స్థలనామాన్ని ‘ఎష్కోలు లోయ’గా ఉంచి, נַחַל పదంలోని భౌగోళిక విస్తృతిని పాదటిప్పణిలో సంరక్షించాం. ప్రధాన వాక్యంలో మూడు పాదటిప్పణి సూచికలూ చేర్చబడ్డాయి.
