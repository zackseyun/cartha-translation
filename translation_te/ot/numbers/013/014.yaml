lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: గోత్రం నుండి
  rationale: ప్రతినిధుల జాబితాలో לְ ఉపసర్గతో కూడిన מַטֶּה ఆ వ్యక్తి ఏ గోత్రానికి చెందినవాడో సూచిస్తుంది. ఆధునిక తెలుగులో ‘గోత్రం నుండి’ సహజంగా, సంక్షిప్తంగా ఆ అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: హీబ్రూ గోత్రనామాన్ని ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: נַחְבִּי
  choice: నహ్బీ
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ పదబంధానికి జాబితా సందర్భంలో సహజమైన తెలుగు రూపం.
- source_word: וָפְסִי
  choice: వొఫ్సీ
  rationale: మసొరెతిక్ స్వరచిహ్నాలతో ఉన్న హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు సమీపంగా ‘వొఫ్సీ’గా లిప్యంతరీకరించాం.
