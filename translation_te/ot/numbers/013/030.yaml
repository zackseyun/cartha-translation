  naturalness: ‘ప్రజలను నిశ్శబ్దంగా ఉండేలా చేసి’ అర్థమయ్యేలా ఉన్నప్పటికీ కొంత భారంగా ఉంది. ‘ప్రజలను నిశ్శబ్దం చేసి’ ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది. చివరి వాక్యాన్ని క్రియారూపంలో మార్చడం కూడా ప్రవాహాన్ని మెరుగుపరుస్తుంది.
