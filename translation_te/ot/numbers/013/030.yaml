  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: te
  text: అప్పుడు కాలేబు మోషే ఎదుట ప్రజలను నిశ్శబ్దం చేసి[a], “మనం తప్పకుండా పైకి వెళ్లి ఆ దేశాన్ని స్వాధీనం చేసుకుందాం[b]; ఎందుకంటే మనం దాన్ని తప్పకుండా స్వాధీనం చేసుకోగలం[c]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలను నిశ్శబ్దపరిచాడు.’ హీబ్రూ క్రియకు ‘శాంతింపజేశాడు,’ ‘నిశ్చలంగా చేశాడు,’ లేదా ‘నిశ్శబ్దం చేశాడు’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘పైకి వెళ్లడం—మనం పైకి వెళ్దాం’; ఇది బలమైన నిశ్చయాన్ని తెలిపే నిర్మాణం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఎందుకంటే మనం దానికి బాగా సమర్థులం.’ హీబ్రూలోని నిర్మాణం బలమైన నిశ్చయాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: నిశ్శబ్దంగా ఉండేలా చేసి
  rationale: ఈ క్రియ ప్రజలను శాంతింపజేయడం, నిశ్శబ్దం చేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండి, బలవంతంగా అణచివేశాడనే అనవసర భావాన్ని కలిగించదు.
- source_word: אֶת־הָעָם
  choice: ప్రజలను
  rationale: ఇక్కడ עַם సమకూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; ‘ప్రజలు’ సహజమైన ప్రామాణిక అనువాదం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషే ఎదుట
  rationale: ఈ సందర్భంలో ప్రజలు మోషే సమక్షంలో ఉన్న దృశ్యాన్ని సూచిస్తుంది. ‘మోషే ఎదుట’ తెలుగు వాక్యంలో సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עָלֹה נַעֲלֶה
  choice: మనం తప్పకుండా పైకి వెళ్లి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను కాపాడుతుంది; మూలంలో లేని ‘వెంటనే’ అనే కాలభావాన్ని చేర్చదు.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: ఆ దేశాన్ని స్వాధీనం చేసుకుందాం
  rationale: יִרַשׁ ఇక్కడ కనాను దేశాన్ని అధీనంలోకి తీసుకొని నివసించే భావంలో ఉంది. స్త్రీలింగ ఏకవచన ప్రత్యయం దేశాన్ని సూచిస్తున్నందున తెలుగులో దాన్ని స్పష్టంగా పేర్కొనడం సహజం.
- source_word: כִּי יָכוֹל נוּכַל
  choice: శక్తి మనకు తప్పకుండా ఉంది
  rationale: మరొక ఉద్ఘాటక నిర్మాణం కాలేబు యొక్క దృఢ విశ్వాసాన్ని తెలియజేస్తుంది. ఈ రూపం సామర్థ్యాన్నీ బలమైన నిశ్చయాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָהּ
  choice: దాన్ని స్వాధీనం చేసుకునే
  rationale: ఈ స్త్రీలింగ ప్రత్యయం దేశాన్ని సూచిస్తుంది. ఒంటరిగా ‘దాని విషయంలో’ అనడం తెలుగులో అస్పష్టంగా ఉండటంతో, మునుపటి చర్యను పునరుద్ఘాటించడం ద్వారా భావాన్ని సహజంగా వెల్లడించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఎక్కి’ కంటే భౌగోళిక ప్రయాణాన్ని సహజంగా తెలిపే ‘పైకి వెళ్లి’ వాడబడింది. మూలంలోని రెండు ఉద్ఘాటక నిర్మాణాల బలం ‘తప్పకుండా’ ద్వారా నిలుపబడింది.
