  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: గోత్రం నుండి
  rationale: ప్రతినిధుల జాబితాలో לְ ఉపసర్గతో కూడిన מַטֶּה, పేరుపొందిన వ్యక్తి ఏ గోత్రానికి చెందినవాడో సూచిస్తుంది. ఆధునిక తెలుగులో ‘గోత్రం నుండి’ సహజంగా ఉండి ఆ ప్రతినిధిత్వ భావాన్ని నిలుపుతుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: యూదా గోత్రాన్ని సూచించే పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: కన్‌స్ట్రక్ట్ సంబంధం కాలేబును అతని తండ్రి ద్వారా గుర్తిస్తుంది; ‘కుమారుడు’ సంక్షిప్తమైన, సహజమైన వంశసంబంధ పదం.
- source_word: יְפֻנֶּה
  choice: యెఫున్నె
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించిన రూపం.
