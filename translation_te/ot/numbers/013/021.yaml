  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. భౌగోళిక నామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; మూలంలోని భౌగోళిక పఠన అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
