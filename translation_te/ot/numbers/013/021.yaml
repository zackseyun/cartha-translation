- from: కాబట్టి వారు పైకి వెళ్లి, సీను అరణ్యం మొదలుకొని హమాతు ప్రవేశద్వారం దగ్గర ఉన్న రెహోబు[a] వరకు ఆ దేశాన్ని గూఢచర్యం చేశారు.
  to: వారు పైకి వెళ్లి, సీను అరణ్యం నుండి లెబో-హమాతు[a] వద్దనున్న రెహోబు వరకు ఆ దేశాన్ని పరిశీలించారు.
