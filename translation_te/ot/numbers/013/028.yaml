source:
  edition: WLC
  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: te
  text: అయితే, ఆ దేశంలో నివసిస్తున్న ప్రజలు బలవంతులు; పట్టణాలు ప్రాకారాలతో బలపరచబడినవీ, చాలా పెద్దవీ ఉన్నాయి. అంతేకాక, అక్కడ అనాకు వంశస్థులను[a] కూడా మేము చూశాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘అనాకు పిల్లలు’; ఈ హీబ్రూ ప్రయోగం అనాకు వంశస్థులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: అయితే
  rationale: మునుపటి వచనంలోని సానుకూల నివేదికకు బలమైన పరిమితిని జోడించే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַז
  choice: బలవంతులు
  rationale: ప్రజల బలాన్ని, వారిని ఎదుర్కోవడం కష్టమనే భావాన్ని తెలియజేస్తుంది; ‘క్రూరులు’ అని అనవసరంగా శత్రుత్వాన్ని పెంచదు.
- source_word: הַיֹּשֵׁב בָּאָרֶץ
  choice: ఆ దేశంలో నివసిస్తున్న
  rationale: హీబ్రూ కృదంత నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ ఉపవాక్యంగా అందిస్తుంది.
- source_word: בְּצֻרוֹת
  choice: ప్రాకారాలతో దృఢపరచబడి
  rationale: పట్టణాలు రక్షణ నిర్మాణాలతో పటిష్ఠంగా ఉన్నాయనే సైనిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: גְּדֹלֹת מְאֹד
  choice: చాలా పెద్దవిగా
  rationale: పట్టణాల పరిమాణాన్ని సూచించే విశేషణాన్నీ מְאֹד ఇచ్చే తీవ్రతనూ నేరుగా నిలుపుతుంది.
- source_word: יְלִדֵי הָעֲנָק
  choice: అనాకు వంశస్థులను
  rationale: ఇది అనాకు సంతతి లేదా వంశానికి చెందినవారిని సూచించే వంశావళి ప్రయోగం; ఆధునిక తెలుగులో ‘వంశస్థులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: רָאִינוּ שָׁם
  choice: అక్కడ ... మేము చూశాం
  rationale: నివేదికలోని పూర్తయిన ప్రత్యక్ష దర్శనాన్ని సహజమైన భూతకాల రూపంలో, స్థల సూచనను నిలుపుతూ అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన కథనశైలిని నిలుపుతూ అనువదించబడింది. హీబ్రూ సమన్వయ నిర్మాణాన్ని తెలుగులో సహజమైన రెండు వాక్య ప్రవాహాలుగా అమర్చింది.
