  text: from the tribe of Issachar, Igal son of Joseph;
translation:
  language: te
  text: ఇశ్శాఖారు గోత్రం నుండి యోసేపు కుమారుడు ఇగాలు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ప్రతినిధుల జాబితాలో לְ ఉపసర్గతో కూడిన מַטֶּה, పేరుపొందిన వ్యక్తి ఏ గోత్రానికి ప్రాతినిధ్యం వహిస్తున్నాడో సూచిస్తుంది. తెలుగులో ‘గోత్రం నుండి’ సహజంగా ఈ అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: יִשָּׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ గోత్రనామాన్ని తెలుగు బైబిలు నామశైలికి తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: יִגְאָל
  choice: ఇగాలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ వంశపరిచయ సందర్భంలో בֶּן యొక్క సాధారణ, ప్రత్యక్ష అర్థం ‘కుమారుడు’; ‘వంశస్థుడు’ అని విస్తరించాల్సిన సందర్భసూచన లేదు.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని పాటించాం. ఇది కొనసాగుతున్న గోత్ర ప్రతినిధుల జాబితాలోని ఒక అంశం కావడంతో చివర అర్ధవిరామ చిహ్నం ఉంచాం.
