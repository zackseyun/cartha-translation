source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בַ/נֶּגֶב֮ וַ/יָּבֹ֣א עַד חֶבְרוֹן֒ וְ/שָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְ/תַלְמַ֔י יְלִידֵ֖י הָ/עֲנָ֑ק וְ/חֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִ/פְנֵ֖י צֹ֥עַן מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: te
  text: వారు నెగెబులోకి ఎక్కి వెళ్లారు; అతడు హెబ్రోను దాకా వచ్చాడు.[a] అక్కడ అనాకు వంశస్థులైన అహీమాను, షేషయి, తల్మయి ఉన్నారు. హెబ్రోను ఐగుప్తులోని సోయాను కంటే ఏడు సంవత్సరాల ముందే నిర్మించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో మొదటి క్రియ ‘వారు ఎక్కి వెళ్లారు’ అని బహువచనంలో, తర్వాతి క్రియ ‘అతడు వచ్చాడు’ అని ఏకవచనంలో ఉంది. కొన్ని అనువాదాలు రెండవ క్రియను కూడా బహువచనంగా ఇస్తాయి.
    reason: మూలంలోని ఆకస్మిక సంఖ్యా మార్పును పాఠకుడికి తెలియజేసి, దానిని నిశ్శబ్దంగా సరిచేయకుండా ఉండేందుకు.
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: నెగెబు
  rationale: ఇది దక్షిణ దిక్కును మాత్రమే సూచించే సాధారణ పదంగా కాక, నిర్దిష్ట ప్రాంతనామంగా ఇక్కడ వాడబడింది; అందువల్ల లిప్యంతరీకరించబడింది.
- source_word: יְלִידֵי הָעֲנָק
  choice: అనాకు వంశస్థులు
  rationale: యెలీదే అనే రూపం పుట్టినవారు/సంతతి అనే భావాన్ని ఇస్తుంది; సహజమైన ఆధునిక తెలుగులో వంశ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: צֹעַן מִצְרָיִם
  choice: ఐగుప్తులోని సోయాను
  rationale: సోయాను అనే స్థలాన్ని ఐగుప్తుతో సంబంధింపజేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు భౌగోళిక వ్యక్తీకరణగా అందిస్తుంది.
theological_decisions:
- issue: బహువచన కర్త తర్వాత ఏకవచన క్రియ
  choice: ‘వారు ... వెళ్లారు; అతడు ... వచ్చాడు’ అని హీబ్రూ వచన మార్పును నిలిపివేయడం
  alternative: ‘వారు ... వెళ్లి హెబ్రోను వరకు వచ్చారు’ అని రెండింటినీ బహువచనంగా చేయడం
  rationale: మూలపాఠంలో וַיַּעֲלוּ బహువచనం కాగా וַיָּבֹא ఏకవచనం. ఆ అసమతౌల్యాన్ని భావానువాదంతో తొలగించకుండా, నిజమైన పాఠ్య అస్పష్టతను సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి పాటించబడింది. వ్యక్తి మరియు స్థల నామాలు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని ఏకవచన–బహువచన ఉద్రిక్తత ప్రధాన పాఠంలోనే నిలుపబడింది.
