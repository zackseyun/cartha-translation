  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: మַטֶּה ఇక్కడ ఇశ్రాయేలు ‘గోత్రం’ను సూచిస్తుంది. జాబితాలోని ప్రతినిధి ఏ గోత్రానికి చెందినవాడో సహజమైన తెలుగులో తెలిపేందుకు לְ ఉపసర్గను ‘నుండి’గా వ్యక్తపరిచాం.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: గోత్రపిత/గోత్రం పేరు; హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שָׁפָט
  choice: షాఫాతు
  rationale: వ్యక్తి పేరు; అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధ గుర్తింపులోని తండ్రి–కొడుకు సంబంధాన్ని సహజమైన తెలుగు నామబంధంతో వ్యక్తపరుస్తుంది.
- source_word: חוֹרִי
  choice: హోరీ
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
