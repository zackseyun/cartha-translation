  register: ఆధునిక ప్రామాణిక తెలుగులో, గోత్ర ప్రతినిధుల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని పదక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ సహజమైన తెలుగు వాక్య నిర్మాణం వాడబడింది.
