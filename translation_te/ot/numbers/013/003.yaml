id: NUM.13.3
reference: Numbers 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: te
  text: మోషే యహ్వే ఆజ్ఞ ప్రకారం[a] పారాను అరణ్యం నుండి వారిని పంపాడు. వారందరూ ఇశ్రాయేలు కుమారుల నాయకులైన పురుషులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యహ్వే మాట ప్రకారం.’ హీబ్రూ నానుడి అక్షరార్థం, ‘యహ్వే నోటి ప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, ‘వారందరూ ఇశ్రాయేలీయుల నాయకులు.’ హీబ్రూ: ‘ఇశ్రాయేలు కుమారుల శిరస్సులు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שׁלח క్రియ ఇక్కడ కథనంలోని గత చర్యను సూచిస్తుంది; ‘పంపాడు’ సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: מִמִּדְבַּר פָּארָן
  choice: పారాను అరణ్యం నుండి
  rationale: מִדְבָּר సాగుచేయని అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. బైబిలు భౌగోళిక సందర్భంలో ‘అరణ్యం’ సహజంగా ఉంటుంది; פָּארָן స్థలనామాన్ని ‘పారాను’గా లిప్యంతరీకరించాం.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: ఈ హీబ్రూ నానుడి అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’ అయినా, సందర్భంలో ఆయన ఆజ్ఞ లేదా నిర్దేశం ప్రకారం అని అర్థం; తెలుగులో ‘ఆజ్ఞ ప్రకారం’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
- source_word: כֻּלָּם
  choice: వారందరూ
  rationale: గుంపులోని ప్రతి వ్యక్తినీ కలుపుకునే సంపూర్ణతను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנָשִׁים
  choice: పురుషులు
  rationale: ఇక్కడ పదం పురుష గోత్ర ప్రతినిధులను సూచిస్తుంది; అందువల్ల లింగార్థాన్ని నిలుపుతూ ‘పురుషులు’ అని అనువదించాం.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలో నాయకులు
  rationale: רָאשֵׁי యొక్క నాయకత్వ భావాన్ని సహజమైన తెలుగులో ‘నాయకులు’గా అందిస్తూ, בְנֵי יִשְׂרָאֵל అనే కుటుంబ సంబంధిత వ్యక్తీకరణను ‘ఇశ్రాయేలు కుమారులు’గా నిలిపాం.
- source_word: הֵמָּה
  choice: పురుషులే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘-ఏ’ నిశ్చయార్థక ప్రత్యయంతో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: אֲנָשִׁים / בְנֵי יִשְׂרָאֵל లోని లింగసూచక భాష
  choice: పురుషులు ... ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయుల నాయకులు
  rationale: వచనం పురుష ప్రతినిధులను గుర్తిస్తోంది; కాబట్టి ఆ లింగసూచనను నిలిపాం. అలాగే ‘ఇశ్రాయేలు కుమారులు’ అనే మూలంలోని కుటుంబ-ఒడంబడిక వ్యక్తీకరణను ప్రధాన పాఠంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే బైబిలు కథనానికి తగిన గౌరవప్రద శైలిని నిలిపాం. మూలంలోని దైవనామం, పురుష లింగసూచన, కుటుంబ సంబంధిత ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని సంరక్షించాం.
