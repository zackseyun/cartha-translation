translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సైనిక సందర్భాన్ని ‘మీదికి వెళ్లడం’ సహజంగా వ్యక్తం చేస్తుంది; అవసరం లేని వివరణాత్మక పదాలను చేర్చలేదు.
