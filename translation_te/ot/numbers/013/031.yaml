language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: te
  text: కానీ అతనితో కలిసి వెళ్లిన మనుషులు, “ఆ ప్రజలకు ఎదిరిగా మనం వెళ్లలేం; ఎందుకంటే వారు మనకంటే బలవంతులు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: కానీ ... మనుషులు
  rationale: ముందటి వచనంలో కాలేబు చెప్పిన మాటలకు వ్యతిరేక భావాన్ని సందర్భం సూచిస్తున్నందున וְ ను సహజమైన తెలుగులో ‘కానీ’గా అనువదించాం; אֲנָשִׁים కు ‘మనుషులు’ అని ఇచ్చాం.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: అతనితో కలిసి వెళ్లిన
  rationale: కాలేబుతో పాటు దేశాన్ని పరిశీలించడానికి వెళ్లిన వారినే ఈ సంబంధవాక్యం గుర్తిస్తోంది. తెలుగులో ‘వెళ్లిన’ అనే భూతకాల రూపం కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא נוּכַל לַעֲלוֹת אֶל־הָעָם
  choice: ఆ ప్రజల మీదికి మనం వెళ్లలేం
  rationale: יכל సామర్థ్యాన్ని సూచిస్తుంది కాబట్టి ‘వెళ్లలేం’ అని ఇచ్చాం. עלה యొక్క ‘పైకి వెళ్లడం’ భావాన్నీ, אֶל־הָעָם యొక్క సందర్భానుసారమైన సైనిక ప్రతిఘటన భావాన్నీ కలిపి తెలుగులో సహజమైన ‘ప్రజల మీదికి వెళ్లడం’గా అనువదించాం.
- source_word: כִּי חָזָק הוּא מִמֶּנּוּ
  choice: ఎందుకంటే వారు మనకంటే బలవంతులు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది. הָעָם వ్యాకరణపరంగా ఏకవచన సమూహనామం; అయితే అనేక మంది నివాసులను సూచిస్తున్నందున తెలుగులో సహజమైన బహువచనమైన ‘వారు ... బలవంతులు’ వాడాం. מִן యొక్క తులనాత్మక భావాన్ని ‘మనకంటే’ నిలిపాం.
