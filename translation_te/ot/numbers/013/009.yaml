  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపాం. గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం వాడాం; మూలంలోని గోత్ర అనుబంధ నిర్మాణానికి ఉన్న ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఉంచాం.
