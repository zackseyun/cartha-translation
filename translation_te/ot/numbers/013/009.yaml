lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ ప్రతినిధుల జాబితాలో לְ ఉపసర్గతో వచ్చిన מַטֶּה, పేర్కొన్న వ్యక్తి ఏ గోత్రానికి చెందినవాడో సూచిస్తుంది. ఆధునిక తెలుగులో ‘గోత్రం నుండి’ అనేది ఆ అనుబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִנְיָמִן
  choice: బెన్యామీను
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פַּלְטִי
  choice: పల్తీ
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని పేర్ల జాబితాలో సహజమైన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: רָפוּא
  choice: రాఫూ
  rationale: వ్యక్తి పేరును హీబ్రూ అచ్చులకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
