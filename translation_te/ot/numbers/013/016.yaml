  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: te
  text: మోషే దేశాన్ని పరిశీలించడానికి[a] పంపిన పురుషుల పేర్లు ఇవే. మోషే నూను కుమారుడైన హోషేయకు[b][c] యెహోషువ అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేశాన్ని వేగు చూడడానికి’ లేదా ‘దేశాన్ని అన్వేషించడానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ అన్వేషణతో పాటు సమాచార సేకరణ కోసం చేసే పరిశీలనను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హోషేయ అనేది యెహోషువకు ముందున్న పేరు; ఇక్కడ మోషే అతనికి యెహోషువ అనే పేరు పెట్టాడు.
    reason: cultural_note
  - marker: c
    text: ‘హోషేయ’ అనే పేరును కొన్నిసార్లు ‘హోషే’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: పురుషుల పేర్లు ఇవే
  rationale: ఇది ముందుగా పేర్కొన్న జాబితాను సూచిస్తుంది. సందర్భంలో గోత్రాలకు ప్రాతినిధ్యం వహించిన పురుషులే ఉద్దేశించబడ్డారు; అందువల్ల లింగనిర్దిష్టతను నిలుపుతూ సహజమైన తెలుగు వాక్యక్రమాన్ని వాడాం.
- source_word: שָׁלַח מֹשֶׁה
  choice: మోషే … పంపిన
  rationale: కథన సందర్భంలోని సాధారణ ‘పంపు’ భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: దేశాన్ని పరిశీలించడానికి
  rationale: תור అనే క్రియలో అన్వేషణ, పరిశీలన, సమాచార సేకరణతో కూడిన నిఘా భావాలు ఉన్నాయి. ‘పరిశీలించడానికి’ అనేది గూఢచర్యం అనే ఒక్క భావానికే పరిమితం చేయకుండా ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַיִּקְרָא … יְהוֹשֻׁעַ
  choice: యెహోషువ అని పేరు పెట్టాడు
  rationale: ఈ నిర్మాణం ఇక్కడ ఒక వ్యక్తికి పేరు పెట్టడాన్ని సూచిస్తుంది. కేవలం ‘పిలిచాడు’ అనడం కంటే ‘పేరు పెట్టాడు’ సందర్భార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהוֹשֵׁעַ בִּן־נוּן
  choice: నూను కుమారుడైన హోషేయకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే రూపాన్ని ఎంచుకున్నాం; ఇది హీబ్రూ పేరును కూడా సముచితంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: హోషేయకు యెహోషువ అనే పేరు ఇవ్వడం
  choice: ‘పేరు పెట్టాడు’ అని మాత్రమే పేర్కొనడం
  alternative: ఈ పేరుమార్పుకు ఒక నిర్దిష్ట ఆధ్యాత్మిక లేదా దైవశాస్త్రీయ ఉద్దేశాన్ని వివరణలో చేర్చడం
  rationale: వచనం పేరు పెట్టిన విషయాన్ని తెలుపుతుంది గాని, దాని ఉద్దేశాన్ని ఇక్కడ వివరించదు. కాబట్టి వచనంలో లేని సిద్ధాంతపరమైన కారణాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పాతకాలపు ‘వేగు చూచుట’ను ప్రధాన పాఠ్యంలో కాకుండా ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం. పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలైన ‘మోషే’, ‘హోషేయ’, ‘యెహోషువ’ వాడాం.
