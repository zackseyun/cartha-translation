translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘చూడండి’ అనేది ముందున్న గూఢచర్య ఆదేశాల ప్రవాహాన్ని తెలుగులో నిలుపుతుంది. మూలంలోని సమష్టి ఏకవచనాన్ని ‘అతడు’గా కాపాడుతూ, దాని సాధ్యమైన సామూహిక సూచనను నిఘంటు నిర్ణయంలో పేర్కొంది.
