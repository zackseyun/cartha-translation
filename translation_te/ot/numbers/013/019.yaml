source:
  edition: WLC
  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: te
  text: వారు నివసిస్తున్న దేశం ఎలా ఉంది? అది మంచిదా లేక చెడ్డదా? వారు నివసిస్తున్న పట్టణాలు ఎలా ఉన్నాయి? అవి శిబిరాలా లేక కోటబలమున్న స్థలాలా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “శిబిరాల్లోనా, లేక దుర్గాల్లోనా?” హీబ్రూ పాఠం శిబిరాల వంటి నివాసాలను కోటబలమున్న స్థలాలతో పోలుస్తోంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: దేశం ఎలాంటిదో
  rationale: ప్రశ్న దేశ స్వభావం లేదా స్థితి గురించి అడుగుతోంది. ఆధునిక తెలుగులో ‘ఎలాంటిదో’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; הָאָרֶץకు సందర్భానుసారంగా ‘దేశం’ సరిపోతుంది.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: అతడు నివసిస్తున్న
  rationale: హీబ్రూ పాఠంలోని ఏకవచన పురుష సర్వనామాన్ని నిలుపుతూ, నివాస భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ఇది సమష్టిగా అక్కడి నివాసిని లేదా ప్రజలను సూచించవచ్చు.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: అది మంచిదా, చెడ్డదా?
  rationale: ‘మంచి/చెడు’ అనే హీబ్రూ విశాల మూల్యాంకనాన్ని అలాగే ఉంచుతుంది; దానిని కేవలం సారవంతతకు పరిమితం చేయదు.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: עָרִיםకు సాధారణ సందర్భోచిత తెలుగు పదం; ఇక్కడ నివాస స్థలాల రక్షణ స్థితి ప్రధానంగా ప్రశ్నించబడుతోంది.
- source_word: הַבְּמַחֲנִים
  choice: శిబిరాల్లాంటి నివాసాలు
  rationale: מַחֲנִים శిబిరాలు లేదా శిబిరాకార, రక్షణ గోడలు లేని నివాసాలను సూచించగలదు. ‘శిబిరాలు’ మాత్రమే అన్నప్పుడు తెలుగులో తాత్కాలిక సైనిక శిబిరాల భావం మితిమీరవచ్చు కాబట్టి ప్రధాన పాఠంలో భావాన్ని స్పష్టం చేసింది.
- source_word: בְּמִבְצָרִים
  choice: కోటలుగల పట్టణాలు
  rationale: מִבְצָרִים యొక్క దృఢ రక్షణగల స్థలాలు/కోటలు అనే అర్థాన్ని, పట్టణాల గురించిన ప్రశ్నతో సహజంగా అనుసంధానిస్తుంది.
