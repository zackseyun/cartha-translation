translation:
  language: te
  text: ఆషేరు గోత్రం నుండి, మీఖాయేలు కుమారుడైన సెతూరు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ గోత్ర ప్రతినిధుల జాబితాలో לְ ఉపసర్గతో కూడిన מַטֶּה, పేర్కొన్న వ్యక్తి ఏ గోత్రానికి చెందినవాడో సూచిస్తుంది. తెలుగులో ‘గోత్రం నుండి’ అనేది ఆ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: హీబ్రూ వ్యక్తి/గోత్రనామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: סְתוּר
  choice: సెతూరు
  rationale: హీబ్రూ స్వరపాఠం סְתוּר‌కు అనుగుణంగా వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వ్యక్తినామంతో కూడిన בֶּן ఇక్కడ తండ్రి-కొడుకు సంబంధాన్ని తెలిపే సాధారణ వంశనిర్దేశం.
- source_word: מִיכָאֵל
  choice: మిఖాయేలు
  rationale: హీబ్రూ מִיכָאֵל పేరులోని ఖ్ ధ్వనిని నిలుపుతూ, తెలుగు బైబిలు నామరూపాలకు సహజమైన ముగింపుతో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జాబితా శైలి. మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలిపి, సందర్భానుసారంగా ‘నుండి’ చేర్చాం. ఈ వచనానికి పాదటిప్పణులు అవసరం లేదు.
