  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: te
  text: ఆ దేశం ఎలాంటిదో[a], దానిలో నివసించే ప్రజలు బలమైనవారో బలహీనులో, కొద్దిమందో అనేకమందో చూడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆ దేశం ఏమిటో.’ ఇక్కడ భావం ఆ దేశపు స్వభావం లేదా పరిస్థితిని అంచనా వేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: చూడండి
  rationale: ראה క్రియ ఇక్కడ వేగులవారికి ఇచ్చిన పరిశీలనా ఆజ్ఞగా ఉంది. ఆధునిక తెలుగులో ‘చూడండి’ సహజంగా ఉండి, పరిశీలించి తెలుసుకోవాలనే సందర్భార్థాన్ని మోస్తుంది.
- source_word: הָאָרֶץ מַה הִוא
  choice: ఆ దేశం ఎలాంటిదో
  rationale: అక్షరార్థంగా ‘ఆ దేశం ఏమిటో’ అయినా, ఈ ప్రశ్న దేశపు స్వభావం లేదా పరిస్థితిని అంచనా వేయమని అడుగుతోంది. ‘ఎలాంటిదో’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: దానిలో నివసించే ప్రజలు
  rationale: עַל అనే ఉపసర్గ అక్షరార్థంగా ‘దానిమీద’ అని ఉన్నా, దేశంలో స్థిరంగా నివసించడమే సందర్భార్థం. తెలుగులో ‘దానిలో నివసించే’ సహజమైన ప్రయోగం.
- source_word: הֶחָזָק
  choice: బలవంతులో
  rationale: חזק ప్రజల శక్తి లేదా బలాన్ని సూచిస్తుంది; జత ప్రశ్నలో ‘బలవంతులో’ స్పష్టంగా సరిపోతుంది.
- source_word: הֲרָפֶה
  choice: బలహీనులో
  rationale: רפה ఇక్కడ חזקకు వ్యతిరేకంగా శక్తి కొరవడిన స్థితిని సూచిస్తుంది. ‘బలహీనులో’ ఆధునిక, స్పష్టమైన సమానార్థకం.
- source_word: הַמְעַט
  choice: కొద్దిమందో
  rationale: מעט ఇక్కడ ప్రజల సంఖ్య తక్కువగా ఉండటాన్ని సూచిస్తుంది. వ్యక్తులను లెక్కించే తెలుగు రూపం ‘కొద్దిమంది’ సరైనది.
- source_word: רָב
  choice: అనేకమందో
  rationale: רב ఇక్కడ מעטకు వ్యతిరేకంగా ప్రజలు సంఖ్యలో ఎక్కువగా ఉండటాన్ని సూచిస్తుంది. ‘అనేకమంది’ గౌరవప్రదమైన, సహజమైన రూపం.
- source_word: אִם
  choice: …ఓ …ఓ
  rationale: ఇక్కడ ప్రత్యామ్నాయ పరోక్ష ప్రశ్నలను కలుపుతుంది. తెలుగులో ‘బలవంతులో బలహీనులో’, ‘కొద్దిమందో అనేకమందో’ అనే నిర్మాణం ‘whether…or…’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
