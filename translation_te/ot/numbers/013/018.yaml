translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ జత ప్రశ్నల నిర్మాణాన్ని సహజమైన తెలుగు ‘…ఓ …ఓ’ రూపంతో నిలిపాం. ప్రధాన పాఠ్యంలో [a] సూచిక చేర్చబడింది.
