translation:
  language: te
  text: 'వారి పేర్లు ఇవి: రూబేను గోత్రం నుండి జక్కూరు కుమారుడైన షమ్మూవా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: హీబ్రూ సంధానకారకమైన ו జాబితా కొనసాగింపును సూచిస్తుంది; తెలుగులో సహజమైన జాబితా పరిచయంలో దానిని ప్రత్యేకంగా ‘మరియు’ అని పలకకుండానే ఆ కొనసాగింపు స్పష్టమవుతుంది. אֵלֶּהను ‘ఇవి’గా అనువదించాం.
- source_word: שְׁמוֹתָם
  choice: వారి పేర్లు
  rationale: ప్రత్యయం ‘వారి’ అనే అర్థాన్ని ఇస్తుంది; ‘వారి పేర్లు ఇవి’ అనేది హీబ్రూ శీర్షికా నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ ప్రతినిధుల జాబితాలో לְ tribal affiliation/representationను సూచిస్తుంది; ‘గోత్రం నుండి’ అనేది ఆ గోత్రానికి చెందిన ప్రతినిధిని సహజంగా తెలియజేస్తుంది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: హీబ్రూ గోత్రనామాన్ని ప్రామాణిక తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שַׁמּוּעַ
  choice: షమ్మూయ
  rationale: వ్యక్తినామాన్ని దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశ సంబంధాన్ని తెలిపే హీబ్రూ పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: זַכּוּר
  choice: జక్కూరు
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించాం.
