  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా, జాబితా శైలికి తగిన సహజ వాక్య నిర్మాణం వాడబడింది. పేర్లు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి.
