translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. హీబ్రూ కథనంలోని రెండు క్రియలను ‘నివేదిస్తూ … అన్నారు’గా కలిపి తెలుగు వాక్యప్రవాహాన్ని మెరుగుపరిచినా, నివేదించడం మరియు పలకడం అనే రెండు భావాలూ నిలుపబడ్డాయి. ‘దేశం’ అనే పదం పునరుక్తి కావడం హీబ్రూ సర్వనామానికి తెలుగులో స్పష్టమైన సహజ రూపం ఇస్తుంది.
