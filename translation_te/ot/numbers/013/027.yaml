revisions:
- from: వారు అతనికి నివేదిస్తూ, “నువ్వు మమ్మల్ని పంపిన దేశంలోకి మేము వెళ్లాం. అది నిజంగానే[a] పాలు తేనెలు ప్రవహించే దేశం; ఇదిగో, ఇది దాని ఫలం” అన్నారు.
  to: వారు అతనికి నివేదించి ఇలా అన్నారు, “నువ్వు మమ్మల్ని పంపిన దేశంలోకి మేము వెళ్లాం. అది నిజంగానే[a] పాలు, తేనె ప్రవహించే దేశం; ఇది దాని ఫలం.”
  rationale: The revision preserves the Hebrew narrative sequence more transparently, improves modern Telugu idiom for the abundance formula, and removes an unnecessary added deictic expression. The emphasis of וְגַם remains anchored to ‘నిజంగానే,’ with the lexical alternative retained in the footnote.
