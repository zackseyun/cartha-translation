  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְסַפְּרוּ ל/וֹ֙ וַ/יֹּ֣אמְר֔וּ בָּ֕אנוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֣ר שְׁלַחְתָּ֑/נוּ וְ֠/גַם זָבַ֨ת חָלָ֥ב וּ/דְבַ֛שׁ הִ֖וא וְ/זֶה פִּרְיָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: te
  text: వారు అతనికి నివేదించి ఇలా అన్నారు, “నువ్వు మమ్మల్ని పంపిన దేశంలోకి మేము వెళ్లాం. అది నిజంగానే[a] పాలు, తేనె ప్రవహించే దేశం; ఇది దాని ఫలం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది పాలు, తేనె ప్రవహించే దేశమే.” హీబ్రూ וְגַם ఆ దేశ సమృద్ధి గురించిన మాటను నొక్కి ధ్రువీకరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: నివేదిస్తూ
  rationale: פִּעֵל రూపంలోని ספר ఇక్కడ చూసిన విషయాలను అధికారికంగా వివరించడం లేదా నివేదించడం అనే అర్థం ఇస్తుంది. తరువాతి וַיֹּאמְרוּతో సహజమైన తెలుగులో కలిపి చెప్పడానికి ‘నివేదిస్తూ … అన్నారు’ అని అనువదించబడింది.
- source_word: לוֹ
  choice: అతనికి
  rationale: హీబ్రూ మూలంలో మోషే పేరు కాకుండా పురుష ఏకవచన సర్వనామమే ఉంది; అందువల్ల సందర్భంలోని వ్యక్తిని పేరుతో స్పష్టీకరించకుండా ‘అతనికి’ అని ఉంచబడింది.
- source_word: בָּאנוּ אֶל־הָאָרֶץ
  choice: దేశంలోకి మేము వెళ్లాం
  rationale: בוא అనే క్రియ రావడం, వెళ్లడం లేదా ప్రవేశించడం అనే భావాన్ని సందర్భానుసారం ఇస్తుంది; אֶל గమ్యాన్ని సూచిస్తుంది. పంపబడినవారు తమ ప్రయాణాన్ని నివేదిస్తున్నందున ఆధునిక తెలుగులో ‘దేశంలోకి మేము వెళ్లాం’ సహజంగా ఉంది.
- source_word: וְגַם
  choice: నిజంగానే
  rationale: ఇక్కడ וְגַם కేవలం ‘మరియు’ అనే అనుసంధానం కాకుండా, ఆ దేశ సమృద్ధిని బలంగా ధ్రువీకరిస్తుంది. ‘నిజంగానే’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం
  rationale: ఇది వ్యవసాయ సమృద్ధిని సూచించే హీబ్రూ నానుడి. చిత్రాత్మక భాషను నిలుపుతూ తెలుగులో సుపరిచితమైన రూపం ఉపయోగించబడింది.
- source_word: וְזֶה פִּרְיָהּ
  choice: ఇదిగో, ఇది దాని ఫలం
  rationale: זֶה చూపిస్తూ సమర్పించే భావాన్ని కలిగిస్తుంది; వారు తెచ్చిన ఫలాన్ని ప్రత్యక్ష సాక్ష్యంగా చూపుతున్న సందర్భాన్ని ‘ఇదిగో’ స్పష్టం చేస్తుంది. פְּרִי ఏకవచన/సమూహార్థాన్ని ‘ఫలం’ నిలుపుతుంది.
