revisions:
- from: నలభై రోజులు పూర్తయిన తరువాత వారు ఆ దేశాన్ని పరిశీలించడం ముగించుకొని తిరిగి వచ్చారు.[a]
  to: నలభై రోజులు పూర్తయ్యాక వారు ఆ దేశాన్ని పరిశీలించి తిరిగి వచ్చారు.[a]
  rationale: The revision preserves the sequence and temporal sense of the Hebrew while avoiding the added assertion that the act of inspection itself was explicitly ‘finished.’ It also improves the footnote’s modern Telugu phrasing and preserves the non-pejorative primary sense of reconnaissance.
