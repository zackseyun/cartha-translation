  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: te
  text: నలభై రోజులు పూర్తయ్యాక వారు ఆ దేశాన్ని పరిశీలించి తిరిగి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ దేశాన్ని అన్వేషించి’ లేదా ‘ఆ దేశాన్ని నిఘా కోసం పరిశీలించి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ఒక అన్వేషణ లేదా నిఘా యాత్రలో దేశాన్ని పరిశీలించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: వారు తిరిగి వచ్చారు
  rationale: שוב క్రియ యొక్క ఖల్ వయిక్టోల్ రూపం కథనంలో తదుపరి సంఘటనను తెలియజేస్తుంది. తెలుగు సహజ కథనశైలిలో సంధానకర్తను ప్రత్యేకంగా అనువదించకుండా భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מִתּוּר
  choice: పరిశీలించడం ముగించుకొని
  rationale: תור క్రియ ఈ సందర్భంలో దేశాన్ని సంచరిస్తూ పరిశీలించే నిఘా యాత్రను సూచిస్తుంది. మִן ఉపసర్గతో కూడిన క్రియానామ రూపాన్ని తిరిగి రావడానికి ముందున్న కార్యంగా సహజ తెలుగులో వ్యక్తపరచింది.
- source_word: הָאָרֶץ
  choice: ఆ దేశాన్ని
  rationale: ఇక్కడ אָרֶץ భూమండలాన్ని కాక, వారు పరిశీలించడానికి పంపబడిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఆ దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מִקֵּץ
  choice: పూర్తయిన తరువాత
  rationale: מִן + קֵץ ఒక కాలవ్యవధి ముగిసిన బిందువును సూచిస్తుంది. ‘పూర్తయిన తరువాత’ అనే రూపం నలభై రోజుల వ్యవధి ముగింపును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אַרְבָּעִים יוֹם
  choice: నలభై రోజులు
  rationale: హీబ్రూలో సంఖ్యతో ఏకవచన నామవాచకం ఉన్నప్పటికీ, తెలుగులో సాధారణ కాలపరిమాణ ప్రయోగం ‘నలభై రోజులు’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘గూఢచర్యం’ అనే ప్రతికూల భావాన్ని ప్రధాన పాఠ్యంలో మోపకుండా, మూలపదంలోని అన్వేషణ–నిఘా భావపరిధిని పాదసూచికలో నిలిపింది.
