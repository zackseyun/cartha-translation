  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హీబ్రూ క్రియాక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అసహజమైన పదానువాదాన్ని నివారించాం. మతపరమైన ప్రత్యేక వ్యాఖ్యానాన్ని చేర్చలేదు.
