language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכ֡וּ וַ/יָּבֹאוּ֩ אֶל מֹשֶׁ֨ה וְ/אֶֽל אַהֲרֹ֜ן וְ/אֶל כָּל עֲדַ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל אֶל מִדְבַּ֥ר פָּארָ֖ן קָדֵ֑שָׁ/ה וַ/יָּשִׁ֨יבוּ אוֹתָ֤/ם דָּבָר֙ וְ/אֶת כָּל הָ֣/עֵדָ֔ה וַ/יַּרְא֖וּ/ם אֶת פְּרִ֥י הָ/אָֽרֶץ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: te
  text: వారు వెళ్లి, పారాను అరణ్యంలోని కాదేషుకు మోషేకు, అహరోనుకు, ఇశ్రాయేలు ప్రజల సమాజమంతటికీ వచ్చారు. వారు మోషేకు, అహరోనుకు, సమాజమంతటికీ వార్తను తిరిగి తెలియజేసి, ఆ దేశపు పండ్లను వారికి చూపించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: వారు వెళ్లి ... వచ్చారు
  rationale: రెండు సమన్విత హీబ్రూ క్రియల కథన క్రమాన్ని నిలుపుతూ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతటి
  rationale: עֲדָה అనే ‘సమాజం/సభ’ భావాన్ని నిలుపుతూ, בְּנֵי יִשְׂרָאֵל అనే జాతి సమూహ సూచనను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִדְבַּר פָּארָן
  choice: పారాను అరణ్యం
  rationale: ప్రయాణ కథన సందర్భంలో מִדְבָּרకు ప్రామాణికమైన ‘అరణ్యం’ పదాన్ని ఉపయోగిస్తుంది.
- source_word: קָדֵשָׁה
  choice: కాదేషు దగ్గర
  rationale: దిశను సూచించే అంత్యప్రత్యయం కాదేషు వైపు గమనం/అక్కడికి చేరికను సూచిస్తుంది; వాక్య సందర్భంలో అది వారి చేరిక స్థలాన్ని తెలుపుతుంది.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: వారికి సమాచారం అందించి
  rationale: తిరిగి వచ్చి విషయం లేదా నివేదిక తెలియజేయడం అనే హీబ్రూ ప్రయోగ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיַּרְאוּם
  choice: వారికి చూపించారు
  rationale: ראה యొక్క హిఫీల్ రూపానికి ఇక్కడ ఉన్న ‘చూపించు’ అనే కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: פְּרִי הָאָרֶץ
  choice: ఆ దేశపు పండ్లు
  rationale: ప్రత్యక్షంగా తీసుకొచ్చి చూపించిన దిగుబడిని సందర్భానుసారంగా ‘పండ్లు’ అని స్పష్టంగా, సజీవంగా అనువదిస్తుంది.
