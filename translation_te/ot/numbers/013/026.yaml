revisions:
- from: వారు వెళ్లి పారాను అరణ్యంలో కాదేషు దగ్గర ఉన్న మోషే, అహరోనుల వద్దకు, ఇశ్రాయేలు ప్రజల సమాజమంతటి వద్దకు వచ్చారు. వారు మోషే అహరోనులకు, సమాజమంతటికీ సమాచారం అందించి, ఆ దేశపు పండ్లను వారికి చూపించారు.
  to: వారు వెళ్లి, పారాను అరణ్యంలోని కాదేషుకు మోషేకు, అహరోనుకు, ఇశ్రాయేలు ప్రజల సమాజమంతటికీ వచ్చారు. వారు మోషేకు, అహరోనుకు, సమాజమంతటికీ వార్తను తిరిగి తెలియజేసి, ఆ దేశపు పండ్లను వారికి చూపించారు.
  rationale: The revision clarifies that Kadesh in the wilderness of Paran is the destination/location of arrival, preserves the coordinated ‘went and came,’ and renders the returned דָּבָר as ‘word’ in natural Telugu. No footnote is required because no textual or lexical ambiguity needs special signaling in the Telugu text.
  reviewer_model: gpt-5.6-terra
