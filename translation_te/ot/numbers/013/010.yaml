  yaml_path: translation/ot/numbers/013/010.yaml
  text: from the tribe of Zebulun, Gaddiel son of Sodi;
translation:
  language: te
  text: జెబూలూను గోత్రం నుంచి, సోదీ కుమారుడు గద్దీయేలు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: గోత్రం నుంచి
  rationale: ఈ పునరావృత జాబితా సూత్రంలో לְ ఉపసర్గతో కూడిన מַטֶּה గోత్ర అనుబంధాన్ని, ఆ గోత్రానికి ప్రాతినిధ్యం వహించే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘గోత్రం నుంచి’ సహజంగా ఉంది.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: గోత్రనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: גַּדִּיאֵל
  choice: గద్దీయేలు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; మధ్య ద్విత్వ ధ్వనిని ‘ద్దీ’తో సూచించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని తెలుగు పేర్ల జాబితాలో సహజమైన సంక్షిప్త రూపంతో తెలిపాం.
- source_word: סוֹדִי
  choice: సోదీ
  rationale: వ్యక్తి పేరును హీబ్రూ స్వరరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనగణన/ప్రతినిధుల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని జాబితా కొనసాగింపును చివరి అర్ధవిరామంతో నిలిపాం.
