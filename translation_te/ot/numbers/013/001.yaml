lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: וַיְדַבֵּר కథనంలోని తదుపరి సంఘటనగా దేవుడు మాట్లాడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పలికాడు’ గౌరవప్రదంగా, సహజంగా ఉండి, తరువాతి לֵאמֹר‌తో కలిసిన వాక్యారంభ సూత్రాన్ని చక్కగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో אֶל సంభాషణ ఎవరిని ఉద్దేశించిందో సూచిస్తుంది. తెలుగులో ‘మోషేతో’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: లֵאמֹר తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సూత్రప్రయోగం. తెలుగులో ‘ఇలా పలికాడు:’ అనే నిర్మాణం దాని కార్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని రూపాన్ని కాపాడుతుంది. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన దైవవాక్య పరిచయ శైలిని ఉపయోగించాం. ‘ఇలా పలికాడు:’ తరువాతి ప్రత్యక్ష వాక్యానికి సహజంగా దారి తీస్తుంది.
