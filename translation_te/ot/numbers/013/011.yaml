  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: te
  text: 'యోసేపు గోత్రం నుండి, మనష్షే గోత్రం నుండి: సూసీ కుమారుడు గద్దీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రం నుండి
  rationale: ఈ ప్రతినిధుల జాబితాలో לְ ఉపసర్గతో కూడిన מַטֶּה గోత్ర అనుబంధాన్ని సూచిస్తుంది. తెలుగులో “గోత్రం నుండి” సహజంగా ఉండి, ఆ గోత్రానికి చెందిన ప్రతినిధి అనే భావాన్ని అందిస్తుంది.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని ఉపయోగించాం.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: మనష్షే గోత్రం నుండి
  rationale: యోసేపు వంశంలోని నిర్దిష్ట శాఖ మనష్షే అని స్పష్టం చేసే హీబ్రూ పునరుక్తిని కుదించకుండా నిలిపాం.
- source_word: גַּדִּי
  choice: గద్దీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ద్విత్వ వ్యంజన ధ్వనికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ, సహజమైన తెలుగు ప్రయోగం.
- source_word: סוּסִי
  choice: సూసీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని దీర్ఘ స్వరాలను ప్రతిబింబించేలా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన గౌరవప్రద భాష. మూలంలోని “గోత్రం నుండి” అనే పునరుక్తిని యథాతథంగా ఉంచి, యోసేపుతో మనష్షేకు ఉన్న శాఖాసంబంధాన్ని పాఠ్యంలోనే స్పష్టంగా నిలిపాం; అందువల్ల ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
