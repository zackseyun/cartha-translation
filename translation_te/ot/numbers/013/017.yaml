base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: te
  text: 'మోషే వారిని కనాను దేశాన్ని పరిశీలించడానికి[a] పంపించాడు; వారితో ఇలా అన్నాడు: “ఈ దారిగా నెగెబు ప్రాంతంలోకి[b] వెళ్లండి, తరువాత కొండ ప్రాంతానికి[c] ఎక్కి వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంపై గూఢచర్యం చేయడానికి.”
    reason: lexical_alternative
  - marker: b
    text: “నెగెబు” అంటే కనాను దేశ దక్షిణ భాగంలోని పొడి ప్రాంతం.
    reason: cultural_note
  - marker: c
    text: లేదా, “పర్వత ప్రాంతానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שׁלח క్రియకు సహజమైన కథనార్థం ‘పంపు’; తరువాతి וַיֹּאמֶר‌తో వాక్యాన్ని సహజంగా కలపడానికి ‘పంపి’ అని ఇచ్చాం.
- source_word: לָתוּר
  choice: పరిశీలించడానికి
  rationale: ఇక్కడ תור దేశాన్ని తిరిగి చూసి సమాచారం సేకరించే పనిని సూచిస్తుంది. ‘గూఢచర్యం చేయడానికి’ అనే పదం ఆధునిక పాఠకునికి అవసరానికి మించిన రహస్య సైనిక భావాన్ని కలిగించవచ్చు; ఆ భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: אֶרֶץ כְּנָעַן
  choice: కనాను దేశాన్ని
  rationale: మూలంలోని పూర్తి భౌగోళిక నామప్రయోగాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: עֲלוּ זֶה בַּנֶּגֶב
  choice: మీరు ఈ దారిలో నెగెబు ప్రాంతంలోకి వెళ్లి
  rationale: עֲלוּ యొక్క గమనార్థాన్ని తెలుగులో సహజమైన ‘వెళ్లి’తో తెలిపి, זֶה యొక్క క్రియావిశేషణ భావాన్ని ‘ఈ దారిలో’గా, בַּנֶּגֶב యొక్క దిశార్థాన్ని ‘నెగెబు ప్రాంతంలోకి’గా నిలిపాం.
- source_word: וַעֲלִיתֶם אֶת־הָהָר
  choice: అక్కడి నుంచి కొండ ప్రాంతానికి ఎక్కి వెళ్లండి
  rationale: ముందున్న ఆజ్ఞను కొనసాగించే భావాన్ని తెలుగులో స్పష్టంగా చూపుతూ, הָהָר‌ను సందర్భానుసారంగా ఒకే కొండగా కాక ఎత్తైన కొండ ప్రాంతంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచనానికి తగిన గౌరవభరిత కథన శైలిలో అనువదించాం. భౌగోళిక నామమైన ‘నెగెబు’ను లిప్యంతరీకరించి వివరణను పాదసూచికలో ఇచ్చాం.
