  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: te
  text: వారు నీ బాధ్యతను, గుడారం మొత్తానికి సంబంధించిన బాధ్యతను నిర్వర్తించాలి. అయితే వారు పరిశుద్ధస్థలపు సామగ్రి[a] దగ్గరికిగాని బలిపీఠం దగ్గరికిగాని రాకూడదు; లేకపోతే వారూ మీరూ[b] చనిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధమైన వస్తువులు” లేదా “పవిత్ర సామగ్రి.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, “వారిద్దరూ, మీరందరూ” అనే భావం ఉంది; నిషేధం సందర్భంలో ఇది వారూ మీరూ మరణించకుండేందుకు ఉద్దేశించిన హెచ్చరికను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: వారు నీకు అప్పగించిన బాధ్యతను నిర్వర్తించాలి
  rationale: שׁמר మరియు מִשְׁמֶרֶת కలయిక అప్పగించబడిన విధి లేదా కాపలా బాధ్యతను నెరవేర్చడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘బాధ్యతను నిర్వర్తించాలి’ అని అనువదించాం.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: గుడారం అంతటికీ సంబంధించిన బాధ్యతను
  rationale: పునరుక్తమైన מִשְׁמֶרֶתను ‘బాధ్యత’గానే నిలిపి, כָּל הָאֹהֶל యొక్క సంపూర్ణ పరిధిని ‘గుడారం అంతటికీ సంబంధించిన’ అని వ్యక్తం చేశాం.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: אֹהֶל యొక్క ప్రత్యక్ష అర్థం ‘గుడారం’. సందర్భంలో ఇది పవిత్ర గుడారాన్ని సూచించినా, మూలపదంలోని సరళతను కాపాడాం.
- source_word: אַךְ
  choice: అయితే
  rationale: ముందు చెప్పిన బాధ్యతకు పరిమితిని విధించే వ్యతిరేక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כְּלֵי הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు సామగ్రి
  rationale: כְּלֵי అంటే పాత్రలు, పరికరాలు లేదా సామగ్రి; הַקֹּדֶשׁ ఇక్కడ పవిత్ర పరిధి లేదా పరిశుద్ధస్థలాన్ని సూచించగలదు. ‘సామగ్రి’ విభిన్న పవిత్ర వస్తువులను సహజంగా సమాహరిస్తుంది.
- source_word: לֹא יִקְרָבוּ
  choice: దగ్గరికి రాకూడదు
  rationale: קרב యొక్క స్థలసంబంధమైన ‘సమీపించడం’ భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో నిలిపింది.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: లేకపోతే వారూ మీరూ చనిపోతారు
  rationale: నిషేధాన్ని అతిక్రమిస్తే కలిగే ప్రమాదాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, גַם...גַם ద్వారా రెండు వర్గాలూ మరణానికి లోబడతాయనే స్పష్టతను కాపాడింది.
theological_decisions:
- issue: ఎవరిని ఉద్దేశించారు, ఎవరిపై నిషేధం ఉంది
  choice: ఏకవచన ‘నీకు’ ద్వారా అహరోనును ఉద్దేశించి, లేవీయుల బాధ్యతను మరియు పవిత్ర సామగ్రి, బలిపీఠం దగ్గరకు రాకూడదనే వారి పరిమితిని తెలిపాం.
  alternative: యాజకులందరినీ సాధారణంగా ఉద్దేశించినట్లు అనువదించడం.
  rationale: מִשְׁמַרְתְּךָలోని ద్వితీయ పురుష ఏకవచన ప్రత్యయం సందర్భంలో అహరోనును నేరుగా సూచిస్తుంది; వచనం యాజకులు-లేవీయుల పాత్రలను కలపదు.
- issue: మరణ హెచ్చరిక ఎవరిని కలుపుతుంది
  choice: ‘వారూ మీరూ’ అని రెండు వర్గాలనూ స్పష్టంగా చేర్చాం.
  alternative: లేవీయులు మాత్రమే చనిపోతారని చూపించడం.
  rationale: גַם הֵם גַּם אַתֶּם స్పష్టంగా ‘వారు’ మరియు ‘మీరు’ అనే రెండు పక్షాలనూ కలుపుతుంది. ‘మీరు’ బహువచనం మూలంలోని אַתֶּםను ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బాధ్యతను నిర్వర్తించాలి’, ‘దగ్గరికి రాకూడదు’ వంటి సహజ ప్రయోగాలతో మూలంలోని విధి, పరిమితి, మరణ హెచ్చరికలను నిలిపాం.
