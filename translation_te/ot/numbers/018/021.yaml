source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: te
  text: లేవి కుమారులకు ఇదిగో, ఇశ్రాయేలులోని దశమభాగమంతటినీ వారు చేసే సమావేశ గుడారపు సేవకు ప్రతిఫలంగా వారసత్వంగా ఇచ్చాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమావేశ గుడారం” అంటే లేవీయులు తమకు నియమించబడిన విధులను నిర్వహించిన గుడారం.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: లేవి కుమారులకు
  rationale: హీబ్రూ వంశావళి ప్రయోగాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది లేవీయులను సూచిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ప్రకటనపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָתַתִּי
  choice: ఇచ్చాను
  rationale: సందర్భంలో స్థిరపరచబడిన దైవిక అనుగ్రహాన్ని సూచించే సంపూర్ణ క్రియారూపానికి సరిపోతుంది.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని దశమభాగమంతటినీ
  rationale: מַעֲשֵׂר యొక్క సాంకేతిక భావాన్ని ‘దశమభాగం’గా, כָּל యొక్క సమగ్ర భావాన్ని ‘అంతటినీ’గా అందిస్తుంది.
- source_word: לְנַחֲלָה
  choice: వారసత్వంగా
  rationale: కేటాయించబడిన వారసత్వపు వాటా అనే న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: חֵלֶף עֲבֹדָתָם
  choice: వారు చేసే సేవకు ప్రతిఫలంగా
  rationale: חֵלֶף లోని మార్పిడి లేదా పరిహార భావాన్ని అతిగా వాణిజ్యపరంగా వినిపించకుండా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הֵם עֹבְדִים
  choice: వారు చేసే
  rationale: ‘సేవను సేవించడం’ అనే అసహజ పునరుక్తిని నివారిస్తూ సంబంధవాచక ఉపవాక్యాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం సంబంధమైన సేవకు
  rationale: ఆ సేవ స్వరూపాన్ని వివరించే హీబ్రూ అనుబంధాన్ని నిలుపుతూ, అది గుడారంతో సంబంధమున్న విధి అని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: లేవీయుల సేవకు దశమభాగం ఇచ్చిన సంబంధం
  choice: దశమభాగం వారసత్వంగా కూడా, వారి సేవకు ప్రతిఫలంగా కూడా ఇవ్వబడిందని అనువదించడం
  alternative: సేవతో పరిహార సంబంధాన్ని తగ్గించి, దశమభాగాన్ని కేవలం కేటాయించిన వాటాగా చూపించడం
  rationale: మూలపాఠం לְנַחֲלָה (‘వారసత్వంగా’) మరియు חֵלֶף עֲבֹדָתָם (‘వారి సేవకు ప్రతిఫలంగా’) అనే రెండు భావాలనూ స్పష్టంగా కలుపుతుంది; అనువాదం రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కాని సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఉద్ఘాటన, వారసత్వ భావం, సేవకు ప్రతిఫలమనే సంబంధం నిలుపబడ్డాయి. చివరి వాక్య పునర్నిర్మాణం తెలుగులో కర్త-కర్మ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
