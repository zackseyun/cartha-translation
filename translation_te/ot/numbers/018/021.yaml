revisions:
- from: లేవి కుమారులకు ఇదిగో, ఇశ్రాయేలులోని దశమభాగమంతటినీ వారసత్వంగా ఇచ్చాను. వారు చేసే సేవకు ప్రతిఫలంగా—సమావేశపు గుడారం సంబంధమైన సేవకు—దానిని వారికి ఇచ్చాను.[a]
  to: లేవి కుమారులకు ఇదిగో, ఇశ్రాయేలులోని దశమభాగమంతటినీ వారు చేసే సమావేశ గుడారపు సేవకు ప్రతిఫలంగా వారసత్వంగా ఇచ్చాను.[a]
