  source_fidelity: ముసాయిదా ప్రధాన పదాలను సరిగ్గా ప్రతిబింబిస్తుంది; అయితే చివరి భాగంలో ‘వారు చేసే సేవకు ... సమావేశపు గుడారం సంబంధమైన సేవకు’ అని రెండు దత్తివ ప్రయోగాలు రావడం వల్ల మూలంలోని ఒకే సేవను వివరించే నిర్మాణం అస్పష్టమవుతోంది. అలాగే ‘దానిని వారికి ఇచ్చాను’ మూలంలో లేని రెండవ ‘ఇచ్చాను’ను జోడించి వాక్యాన్ని అనవసరంగా పునరుక్తం చేస్తోంది.
