id: NUM.18.31
reference: Numbers 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: te
  text: మీరు, మీ ఇంటివారు[b] దానిని ఎక్కడైనా తినవచ్చు[a]. ఎందుకంటే, సమావేశ గుడారంలో మీరు చేసే సేవకు బదులుగా అది మీ వేతనం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తినాలి’ లేదా ‘తినండి’; ఈ న్యాయసంబంధ సందర్భంలో హీబ్రూ రూపం అనుమతిని లేదా ఆదేశాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇంటివారు’ అంటే భౌతిక ఇల్లు మాత్రమే కాదు, కుటుంబంతో కూడిన గృహసముదాయం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘ప్రతిఫలం,’ ‘పారితోషికం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: దానిని ... తినవచ్చు
  rationale: న్యాయసంబంధ సందర్భంలో ఈ హీబ్రూ రూపం సాధారణ భూతకాలాన్ని కాక అనుమతి లేదా ఆదేశాన్ని సూచించగలదు. ఇక్కడ పరిశుద్ధ స్థలానికి వెలుపల కూడా తినే అనుమతిని సందర్భం బలపరుస్తుంది.
- source_word: בְּכָל מָקוֹם
  choice: ఎక్కడైనా
  rationale: ప్రతి స్థలంలో అనే పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ఈ భాగాన్ని తినడానికి పరిశుద్ధ స్థల పరిమితి లేదని సూచిస్తుంది.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: మీరు, మీ ఇంటివారు
  rationale: בֵּיתְכֶם ఇక్కడ భౌతిక ఇంటిని మాత్రమే కాక గృహసముదాయాన్ని సూచిస్తుంది; 'ఇంటివారు' ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న అనుమతికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: שָׂכָר
  choice: వేతనం
  rationale: చేసిన సేవకు లభించే పారితోషికం అనే మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֵלֶף
  choice: ప్రతిఫలంగా
  rationale: సేవకు బదులుగా ఇచ్చే పారితోషిక సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది; కేవలం స్థానాపన్నత అనే భావానికి పరిమితం చేయదు.
- source_word: עֲבֹדַתְכֶם
  choice: మీరు చేసే సేవ
  rationale: లేవీయులకు అప్పగించబడిన ఆరాధనా సంబంధమైన విధిని 'పని' కంటే 'సేవ' మెరుగ్గా సూచిస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: ఈ పరిశుద్ధ గుడారానికి తెలుగులో ప్రాచుర్యంలో ఉన్న గౌరవప్రదమైన పేరును ఉపయోగిస్తూ, בְּ అనే స్థానసూచక సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లేవీయుల భాగం స్వరూపం
  choice: ఈ ఆహార భాగం ప్రత్యక్ష గుడార సేవకు న్యాయమైన వేతనమని, దానిని ఎక్కడైనా తినవచ్చని పాఠం చెబుతోంది.
  alternative: దీనిని పరిశుద్ధ ప్రదేశంలోనే తినవలసిన బలిభోజనంగా మరింత సంకుచితంగా అర్థం చేసుకోవడం.
  rationale: '''ఎక్కడైనా'' అనే స్పష్టమైన పదబంధం పరిశుద్ధ స్థల పరిమితి లేదని తెలియజేస్తుంది. కాబట్టి అనువాదం ఈ భాగాన్ని లేవీయుల సేవకు ఇచ్చే పారితోషికంగా చూపిస్తూ, ఇతర పరిమిత పరిశుద్ధ అర్పణలతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవచన శైలి. 'తినవచ్చు' ద్వారా సందర్భంలోని అనుమతి ముందుకు వస్తుంది; ప్రత్యామ్నాయ ఆదేశార్థాన్ని పాదటిప్పణిలో ఉంచాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
