revisions:
- from: నీ సహోదరులైన లేవి గోత్రాన్ని, అంటే నీ తండ్రి గోత్రాన్ని, కూడా నీతోపాటు దగ్గరకు తీసుకురా. వారు నీతో జతచేరి[a] నీకు సేవచేస్తారు. అయితే నీవూ నీతోపాటు నీ కుమారులూ సాక్ష్యపు గుడారం ఎదుట ఉండాలి.[b]
  to: నీ సహోదరులను—నీ తండ్రి గోత్రమైన లేవి గోత్రాన్ని కూడా—నీతోపాటు దగ్గరకు తీసుకురా. వారు నీతో జతచేరి[a] నీకు సేవ చేయాలి. అయితే నీవును, నీతో ఉన్న నీ కుమారులును సాక్ష్యపు గుడారం ఎదుట ఉంటారు.[b]
  rationale: లేవి గోత్రం అహరోను సహోదరులని స్పష్టంగా చూపడానికి సమానాధికార పదబంధాన్ని పునర్నిర్మించాం. లేవీయుల సేవను ఆజ్ఞ యొక్క ఉద్దేశ్య/ఫలితంగా తెలుపడానికి ‘సేవ చేయాలి’ వాడాం. అహరోను, అతని కుమారుల గురించి చివరి వాక్యంలో మూలంలో లేని బలమైన విధి భావాన్ని తొలగించి, వారి ప్రత్యేక స్థానాన్ని సూచించే సహజమైన తెలుగును వాడాం. పాదసూచికల అర్థం, గుర్తులు యథాతథంగా నిలిపాం.
