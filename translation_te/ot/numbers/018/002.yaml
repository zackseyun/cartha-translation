id: NUM.18.2
reference: Numbers 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: te
  text: నీ సహోదరులను—నీ తండ్రి గోత్రమైన లేవి గోత్రాన్ని కూడా—నీతోపాటు దగ్గరకు తీసుకురా. వారు నీతో జతచేరి[a] నీకు సేవ చేయాలి. అయితే నీవును, నీతో ఉన్న నీ కుమారులును సాక్ష్యపు గుడారం ఎదుట ఉంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ వెంట ఉండి” లేదా “నీకు అనుబంధింపబడి” అని కూడా అనువదించవచ్చు. ఇక్కడి హెబ్రీ క్రియకు “లేవి” అనే పేరుతో ధ్వని సంబంధం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ మూలంలో అక్షరార్థంగా “సాక్ష్యపు గుడారం” అని ఉంది; సంబంధిత గుడారపు పదప్రయోగాల ప్రభావంతో కొన్ని అనువాదాలు ఇక్కడ “సమావేశపు గుడారం” అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ఆజ్ఞలోని అదనపు అంశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַחֶיךָ מַטֵּה לֵוִי שֵׁבֶט אָבִיךָ
  choice: నీ సహోదరులైన లేవి గోత్రాన్ని, అంటే నీ తండ్రి గోత్రాన్ని
  rationale: ‘సహోదరులు’ అనే కుటుంబ సంబంధ పదాన్ని నిలుపుతూ, అది లేవి గోత్రాన్ని సూచిస్తున్నదని ఉపపదబంధాల ద్వారా స్పష్టం చేస్తుంది.
- source_word: הַקְרֵב אִתָּךְ
  choice: నీతోపాటు దగ్గరకు తీసుకురా
  rationale: హిఫీల్ రూపంలోని ‘దగ్గరకు తీసుకురావడం’ అనే ఆరాధనా-సేవ సంబంధ ఛాయను, అలాగే సహవాస భావాన్ని నిలుపుతుంది.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: వారు నీతో జతచేరి
  rationale: లేవీయులు అహరోనుతో అనుబంధింపబడే భావాన్ని తెలియజేస్తుంది; ఈ క్రియకు ‘లేవి’ పేరుతో ఉన్న ధ్వని సంబంధాన్ని పాదసూచికలో గుర్తిస్తుంది.
- source_word: וִישָׁרְתוּךָ
  choice: నీకు సేవచేస్తారు
  rationale: שרת అనే క్రియలోని సేవ/పరిచర్య భావాన్ని సాధారణ పాఠకులకు నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ לִפְנֵי אֹהֶל הָעֵדֻת
  choice: అయితే నీవూ నీతోపాటు నీ కుమారులూ సాక్ష్యపు గుడారం ఎదుట ఉండాలి
  rationale: లేవీయుల సేవకు ప్రతిగా అహరోను, అతని కుమారుల యాజక బాధ్యతను చూపే వ్యత్యాసాన్ని ‘అయితే’తో సహజంగా వ్యక్తం చేస్తూ, మూలంలోని ‘సాక్ష్యపు గుడారం’ను నిలుపుతుంది.
theological_decisions:
- issue: אֹהֶל הָעֵדֻת పదబంధం
  choice: సాక్ష్యపు గుడారం
  alternative: సన్నిధి గుడారం / సమావేశపు గుడారం
  rationale: ఈ వచనంలోని హెబ్రీ పాఠం సాధారణంగా కనిపించే ‘సమావేశపు గుడారం’ అని కాకుండా అక్షరార్థంగా ‘సాక్ష్యపు గుడారం’ అని చెబుతుంది. పరిచిత పదబంధంతో సమన్వయం చేయకుండా మూలంలోని ప్రత్యేకతను నిలిపాం.
- issue: లేవీయులు అహరోనుతో చేరడం
  choice: నీతో జతచేరి
  alternative: నీ వెంట ఉండి / నీకు అనుబంధింపబడి
  rationale: లేవీయుల సహకార సేవను మాత్రమే కాక, అహరోనుకు వారిని అనుబంధించే మూల క్రియ భావాన్ని కూడా నిలుపుతుంది; సంస్థాగత లేదా మతశాఖాపరమైన అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘గోత్రం,’ ‘సాక్ష్యం,’ ‘గుడారం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచినా, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
