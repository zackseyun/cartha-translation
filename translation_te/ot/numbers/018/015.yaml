id: NUM.18.15
reference: Numbers 18:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: te
  text: 'వారు యెహోవాకు సమర్పించే సమస్త జీవుల్లో గర్భాన్ని తెరిచే ప్రతి తొలిసంతానం[a]—మనిషిదైనా జంతువుదైనా—నీదవుతుంది. అయితే మనిషి తొలిసంతానాన్ని తప్పక వెల చెల్లించి విడిపించాలి; అపవిత్రమైన జంతువు తొలిసంతానాన్ని కూడా వెల చెల్లించి విడిపించాలి.


    [a] లేదా, “గర్భం నుంచి మొదట బయటికి వచ్చేది.” ఇది గర్భం నుంచి మొదట పుట్టే సంతానాన్ని సూచించే హీబ్రూ నుడికారం.


    [b] లేదా, “యెహోవా దగ్గరికి తీసుకొచ్చేది,” “యెహోవాకు అర్పించేది.” ఇక్కడి హీబ్రూ క్రియకు అర్పణ సందర్భాల్లో “దగ్గరికి తీసుకురావడం” లేదా “సమర్పించడం” అనే అర్థాలు ఉండవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గర్భం నుంచి మొదట బయటికి వచ్చేది.” ఇది గర్భం నుంచి మొదట పుట్టే సంతానాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యెహోవా దగ్గరికి తీసుకొచ్చేది,” “యెహోవాకు అర్పించేది.” ఇక్కడి హీబ్రూ క్రియకు అర్పణ సందర్భాల్లో “దగ్గరికి తీసుకురావడం” లేదా “సమర్పించడం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: గర్భాన్ని తెరిచే ప్రతి తొలిసంతానం
  rationale: గర్భం నుంచి మొదట బయటికి వచ్చే సంతానాన్ని సూచించే హీబ్రూ నుడికారంలోని చిత్రాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: సమస్త జీవుల్లో ... ప్రతి
  rationale: ఈ నిర్మాణం మనుషులు, జంతువులు అన్న సమగ్ర పరిధిని సూచిస్తుంది. ‘సమస్త జీవుల్లో’ అనేది ‘సమస్త శరీరం’ అనే అసహజ పదానువాదాన్ని నివారిస్తుంది.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: వారు యెహోవాకు సమర్పించేది
  rationale: הקריב అర్పణ సందర్భంలో దగ్గరికి తీసుకురావడం లేదా సమర్పించడం అని అర్థమిస్తుంది. మనుష్య తొలిసంతానం బలిగా అర్పించబడదు కాబట్టి, ‘బలి అర్పించడం’ కంటే విస్తృతమైన ‘సమర్పించడం’ ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: మనిషిదైనా జంతువుదైనా
  rationale: తొలిసంతాన నియమం వర్తించే రెండు వర్గాలను సహజమైన తెలుగు విభజనతో వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה לָּךְ
  choice: నీదవుతుంది
  rationale: యాజకునికి దక్కే హక్కును నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి హక్కుకు వెంటనే వచ్చే ముఖ్యమైన పరిమితిని సూచిస్తుంది.
- source_word: פָּדֹה תִפְדֶּה
  choice: తప్పక వెల చెల్లించి విడిపించాలి
  rationale: క్రియతో కూడిన infinitive absolute ఆజ్ఞను బలపరుస్తుంది. ‘తప్పక’ ఆ బలాన్ని, ‘వెల చెల్లించి విడిపించడం’ పణం చెల్లించే భావాన్ని స్పష్టం చేస్తాయి.
- source_word: בְּכוֹר הָאָדָם
  choice: మనిషి తొలిసంతానం
  rationale: జంతువుతో వ్యత్యాసంగా ఉన్న మానవ తొలిసంతానాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: అపవిత్రమైన జంతువు తొలిసంతానం
  rationale: బలికి తగని ఆచారపరంగా అపవిత్రమైన జంతువు అనే హీబ్రూ వర్గాన్ని సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: אָדָם అనే పదాన్ని జంతువుతో వ్యత్యాసంగా అనువదించడం
  choice: మనిషి
  alternative: మానవుడు; మానవజాతి
  rationale: ఇక్కడ పదం మానవ తొలిసంతానాన్ని జంతు తొలిసంతానంతో పోల్చుతోంది. ‘మనిషి’ ఈ వ్యత్యాసాన్ని సహజంగా కాపాడుతుంది.
- issue: తొలిసంతానంపై యాజకుని హక్కు స్వభావం
  choice: తొలిసంతానం యాజకునిదవుతుంది; అయితే మనిషి తొలిసంతానం, అపవిత్ర జంతువు తొలిసంతానం వెల చెల్లించి విడిపించబడాలి
  alternative: ప్రతి తొలిసంతానం తప్పనిసరిగా బలిగా అర్పించబడుతుంది
  rationale: వచనంలోని స్పష్టమైన మినహాయింపు, మనిషి మరియు అపవిత్ర జంతువు తొలిసంతానాలు బలిగా చంపబడకుండా విమోచించబడాలని చూపుతుంది. అందువల్ల ప్రధాన వాక్యంలో ‘సమర్పించేది’ అనే విస్తృత పదం వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘గర్భాన్ని తెరిచే’ అనే మూలభాషా చిత్రాన్ని ఉంచి, ‘తొలిసంతానం’ ద్వారా అర్థాన్ని స్పష్టం చేశాం. ‘విమోచించాలి’ అనే సాంకేతిక పదం మాత్రమే వాడకుండా, సందర్భంలోని పణం చెల్లింపు భావాన్ని సాధారణ పాఠకునికి తెలియజేయడానికి ‘వెల చెల్లించి విడిపించాలి’ అని ఇచ్చాం.
