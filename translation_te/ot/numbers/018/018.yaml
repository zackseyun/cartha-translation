  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: te
  text: అయితే వాటి మాంసం నీదే అవుతుంది; అల్లాడింపు అర్పణలోని రొమ్మువలెను, కుడి తొడవలెను అది నీదే అవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అల్లాడింపు అర్పణ’ అనేది యెహోవా సన్నిధిలో ఆచారపూర్వక కదలికతో సమర్పించబడే భాగాన్ని సూచిస్తుంది; దీనిని ‘సమర్పణ అర్పణ’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: అయితే వాటి మాంసం
  rationale: בָּשָׂר అనే పదానికి అక్షరార్థం ‘మాంసం’. ఇక్కడ అది బలిగా అర్పించిన జంతువులలో తినదగిన భాగాన్ని సూచిస్తుంది. ముందరి వచనంలోని రక్తం, కొవ్వు యెహోవాకు చెందుతాయనే మాటకు భిన్నంగా ఉండటాన్ని וּ సందర్భానుసారంగా ‘అయితే’ అని వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה לָּךְ
  choice: నీదవుతుంది
  rationale: היה + ל అనే హెబ్రీ నుడికారం స్వాధీనతను లేదా హక్కుగా కేటాయించబడటాన్ని సూచిస్తుంది. ‘నీదవుతుంది’ సహజమైన తెలుగులో ఆ న్యాయబద్ధ కేటాయింపును నిలుపుతుంది.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: అల్లాడించే అర్పణలోని బోరువలె
  rationale: חָזֶה బలి జంతువు ఛాతీ భాగాన్ని సూచిస్తుంది; తెలుగులో మాంసపు భాగానికి ‘బోరు’ సహజమైన పదం. תְּנוּפָה యెహోవా సన్నిధిలో ఆచారపూర్వకంగా అల్లాడించి సమర్పించే భాగాన్ని సూచిస్తుంది.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: కుడి తొడవలె
  rationale: שׁוֹק బలి పంపకంలో కాలిలోని పైభాగమైన తొడను సూచిస్తుంది; הַיָּמִין ‘కుడి’ అని స్పష్టంగా తెలుపుతుంది.
- source_word: לְךָ יִהְיֶה
  choice: అది నీదవుతుంది
  rationale: వచనం చివర స్వాధీనత సూత్రాన్ని పునరుక్తి చేయడం ద్వారా యాజకునికి కేటాయింపును నొక్కిచెబుతుంది; ‘అది’ అనే ఏకవచనం సమష్టిగా పేర్కొన్న బలి మాంసపు కేటాయింపును సూచిస్తుంది.
theological_decisions:
- issue: రెండవ పురుష ఏకవచన ప్రత్యయాల రూపభేదం
  choice: రెండింటినీ అహరోనును ఉద్దేశించిన ఏకవచన ‘నీ’ రూపంతో అనువదించడం
  alternative: అహరోనును పేరుతో చేర్చడం లేదా యాజకులందరినీ ఉద్దేశిస్తూ బహువచనంగా అనువదించడం
  rationale: హెబ్రీ పాఠంలో మొదటి לָּךְ స్త్రీలింగ రూపంలో, తరువాతి לְךָ పుంలింగ రూపంలో కనిపించినా, సందర్భంలోని హక్కు అహరోనుకు ప్రతినిధి యాజకునిగా కేటాయించబడుతోంది. పేరును లేదా బహువచనాన్ని చేర్చి వ్యాకరణ అసమానతను అతిగా పరిష్కరించకుండా ఏకవచనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. బలి సంబంధిత దృశ్యభాషను నిలుపుతూ ‘మాంసం’, ‘బోరు’, ‘తొడ’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. హెబ్రీ వాక్యంలో ఉన్న స్వాధీనత పునరుక్తిని కాపాడాం.
