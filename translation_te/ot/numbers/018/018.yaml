    reason: cultural_note
  revision_rationale: The revision replaces unclear or awkward sacrificial vocabulary with clear modern-standard Telugu while preserving the Hebrew sequence, the contrast with the preceding entitlement, the comparison of priestly portions, and the repeated statement of possession. No doctrinal interpretation is added.
