id: NUM.18.17
reference: Numbers 18:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: te
  text: అయితే ఎద్దు తొలిచూలును గానీ, గొర్రె తొలిచూలును గానీ, మేక తొలిచూలును గానీ మీరు వెల చెల్లించి విడిపించకూడదు; అవి పవిత్రమైనవి. వాటి రక్తాన్ని బలిపీఠంపై చిలకరించాలి; వాటి కొవ్వును అగ్ని అర్పణగా[a] దహించి, యాహ్వేకు ఇంపైన సువాసన కలిగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అగ్ని అర్పణ” అనే హీబ్రూ పదబంధాన్ని కొందరు “ఆహార అర్పణ” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందున్న నియమానికి మినహాయింపు లేదా పరిమితిని పరిచయం చేసే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכוֹר
  choice: తొలిచూలు
  rationale: మొదట పుట్టిన జంతువును, దాని ఆరాధనాపరమైన ప్రాధాన్యంతో సహా, సంక్షిప్తంగా తెలియజేసే స్థిరమైన తెలుగు పదం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఇక్కడ పశుజాతికి చెందిన బలి జంతువును సూచించే సాధారణ ఏకవచన పదంగా వాడబడింది.
- source_word: כֶּשֶׂב
  choice: గొర్రె
  rationale: ఎద్దు, మేకలతో పాటు జంతువుల వర్గాన్ని సాధారణంగా సూచిస్తున్నందున ‘గొర్రెపిల్ల’ కంటే ‘గొర్రె’ తగినది.
- source_word: עֵז
  choice: మేక
  rationale: జాతిని నేరుగా సూచించే సహజమైన తెలుగు పదం.
- source_word: לֹא תִפְדֶּה
  choice: వెల చెల్లించి విడిపించకూడదు
  rationale: ప్రత్యామ్నాయ చెల్లింపు ద్వారా ఆరాధనాపరమైన బాధ్యత నుంచి విడిపించే న్యాయపరమైన భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: קֹדֶשׁ הֵם
  choice: అవి పవిత్రమైనవి
  rationale: వాటిని విడిపించకూడదనే నియమానికి కారణమైన దేవునికి ప్రత్యేకించబడిన స్థితిని నిలుపుతుంది.
- source_word: תִּזְרֹק
  choice: చిలకరించాలి
  rationale: బలిపీఠంపై రక్తాన్ని విసరడం లేదా చల్లడం అనే బలివిధి చర్యను సహజమైన ఆరాధనాపరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: ఆరాధనాపరమైన altarకు ప్రామాణికమైన తెలుగు పదం.
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలిలో దహించడానికి ప్రత్యేకించిన కొవ్వు భాగాలను పాఠ్యంలో ఉన్నంత మేరకే సూచిస్తుంది.
- source_word: תַּקְטִיר
  choice: దహించాలి
  rationale: బలిపీఠంపై అర్పణను కాల్చి పొగగా పైకి పంపే ఆరాధనాపరమైన చర్యను గౌరవప్రదంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: అగ్ని ద్వారా సమర్పించే అర్పణ అనే మూలపద భావాన్ని అనవసరంగా ‘ఆహారం’గా నిర్ణయించకుండా నిలుపుతుంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: దేవునికి ఆమోదకరమైన సువాసన అనే ఆరాధనాపరమైన రూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన నామరూపాన్ని ఉపయోగిస్తూ, మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని ‘ప్రభువు’గా మార్చకుండా నిలుపుతుంది.
- issue: אִשֶּׁה అనే బలిసంబంధ పదం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదం అగ్నితో సమర్పించే అర్పణను సూచిస్తుంది; ‘ఆహార అర్పణ’ అనే వ్యాఖ్యాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- issue: רֵיחַ נִיחֹחַ యొక్క ఆరాధనాపరమైన రూపకం
  choice: యెహోవాకు ఇంపైన సువాసన కలిగించే
  alternative: యెహోవాకు అంగీకారమైన అర్పణగా
  rationale: మూలంలోని సువాసన రూపకాన్ని వివరణాత్మక భావంతో భర్తీ చేయకుండా యథాశక్తి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-ఆరాధనాపరమైన శైలి ఉపయోగించబడింది. వరుస జంతువుల జాబితాలోని పునరుక్తిని నిలుపుతూ తెలుగు వాక్యప్రవాహానికి ‘గానీ’ నిర్మాణం ఎంచుకోబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
