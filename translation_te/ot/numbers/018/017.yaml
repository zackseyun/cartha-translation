  terminology: “తొలిచూలు,” “వెల చెల్లించి విడిపించకూడదు,” “బలిపీఠం,” and “కొవ్వు” are suitable in this cultic/legal context. “అగ్ని అర్పణ” appropriately preserves the broad sacrificial sense of אִשֶּׁה; the alternative “ఆహార అర్పణ” may remain in a footnote.
