id: NUM.18.19
reference: Numbers 18:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: te
  text: ఇశ్రాయేలీయులు యెహోవాకు ఎత్తి అర్పించే పరిశుద్ధమైన అర్పణలలోని కానుకలన్నిటినీ నేను నీకూ, నీతోపాటు నీ కుమారులకూ నీ కుమార్తెలకూ శాశ్వతమైన నియమంగా ఇచ్చాను. ఇది యెహోవా సన్నిధిలో నీకూ, నీతోపాటు నీ సంతానానికీ శాశ్వతమైన ఉప్పు నిబంధన.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఉప్పు నిబంధన” అనేది స్థిరమైన, నిలిచివుండే నిబంధనను సూచించే ప్రాచీన రూపకం కావచ్చు; చూడండి 2 దినవృత్తాంతాలు 13:5.
    reason: ఆధునిక పాఠకులకు అపరిచితమైన సాంస్కృతిక రూపకాన్ని, దాని భావాన్ని అతిగా నిర్ణయించకుండా వివరిస్తుంది.
lexical_decisions:
- source_word: תְּרוּמֹת הַקֳּדָשִׁים
  choice: పరిశుద్ధమైన వాటిలోని ప్రతిష్ఠిత అర్పణలు
  rationale: תְּרוּמָה అనేది ప్రత్యేకంగా వేరుచేసి లేదా ఎత్తి సమర్పించే అర్పణను సూచిస్తుంది; הַקֳּדָשִׁים అనేది దేవునికి ప్రతిష్ఠితమైన వస్తువులను సూచిస్తుంది. ఈ రెండింటి భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: יָרִימוּ
  choice: ఎత్తి అర్పించే
  rationale: మూలంలోని רום హిఫిల్ రూపానికి ఉన్న ‘ఎత్తడం’ అనే స్పష్టమైన చిత్రాన్ని, అర్పణ సందర్భంతో కలిపి పరిరక్షిస్తుంది.
- source_word: חָק עוֹלָם
  choice: శాశ్వతమైన నియమం
  rationale: חֹק యొక్క స్థిరమైన శాసనం/నియమం భావాన్నీ, עוֹלָם యొక్క నిరంతర కాలబలాన్నీ సూటిగా వ్యక్తం చేస్తుంది.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: శాశ్వతమైన ఉప్పు నిబంధన
  rationale: సాంస్కృతిక రూపకాన్ని వివరణతో భర్తీ చేయకుండా, మూలపాఠంలోని ‘ఉప్పు నిబంధన’ అనే అపూర్వమైన పదబంధాన్ని అలాగే నిలిపింది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: ‘విత్తనం’ అనే అక్షరార్థం కంటే ఈ వంశసంబంధ సందర్భంలో సహజమైన సమూహార్థక తెలుగు పదాన్ని ఎంచుకుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క ప్రతిరూపం
  choice: యెహోవా
  alternative: యహ్వే / ప్రభువు
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపాన్ని ఉపయోగించి, మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చలేదు.
- issue: ‘ఉప్పు నిబంధన’ రూపకానికి అర్థవివరణ
  choice: మూల రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, పాదటిప్పణిలో సంక్షిప్తంగా వివరించడం
  alternative: ‘శాశ్వతంగా నిలిచే నిబంధన’ అని నేరుగా వ్యాఖ్యానించడం
  rationale: ఈ రూపకం శాశ్వతత్వం, స్థిరత్వం లేదా భంగపరచరాని బంధాన్ని సూచించవచ్చు; ఒకే భావాన్ని ఖచ్చితమని నిర్ణయించకుండా మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. యాజక సంబంధ పదజాలం అర్థమయ్యేలా ఉంచుతూ, ‘ఎత్తి అర్పించే’ అనే మూలచిత్రాన్నీ ‘ఉప్పు నిబంధన’ అనే సాంస్కృతిక రూపకాన్నీ పరిరక్షించాం.
