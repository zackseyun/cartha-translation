source:
  edition: WLC
  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: te
  text: వారి దేశంలో ఉన్న సమస్తపు ప్రథమ ఫలాలను వారు యెహోవాకు తీసుకువస్తే, అవి నీకు చెందుతాయి. నీ ఇంటివారిలో శుద్ధులైన వారందరూ వాటిని తినవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఆచారపరంగా శుద్ధులైన వారు.
    reason: టָהוֹר అనే పదం ఈ యాజక ధర్మశాస్త్ర సందర్భంలో ఆచారపరమైన శుద్ధతను సూచిస్తుందని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: ప్రథమ ఫలాలు
  rationale: పంట దిగుబడిలో మొదట పండిన వాటిని దేవునికి అర్పించే ఆచారపరమైన భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: వారి దేశంలో పండిన ప్రతిదానిలో
  rationale: హీబ్రూ పదబంధం విస్తృతంగా ఉన్నా, ‘ప్రథమ ఫలాలు’తో దాని సంబంధాన్ని తెలుగులో సహజంగా చూపడానికి ‘పండిన’ అని సందర్భానుగుణంగా స్పష్టం చేయబడింది.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: వారు యెహోవాకు తీసుకొచ్చే
  rationale: ‘తీసుకురావడం’ అనే మూల క్రియను నిలుపుతూ, ఆరాధన సంబంధమైన సమర్పణ సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను వ్యక్తినామంగా ప్రతిబింబించే, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం.
- source_word: לְךָ יִהְיֶה
  choice: నీవి అవుతాయి
  rationale: ఆ ప్రథమ ఫలాలు అహరోనుకు చెందుతాయని తెలిపే హీబ్రూ స్వామ్యార్థక నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: నీ ఇంటివారిలో శుద్ధుడైన ప్రతి వ్యక్తి
  rationale: ‘ఇల్లు’ అనే మూల రూపాన్ని కుటుంబం/ఇంటివారు అనే అర్థంలో సహజంగా తెలియజేస్తూ, טָהוֹר యొక్క ‘శుద్ధుడు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: יֹאכֲלֶנּוּ
  choice: వాటిని తినవచ్చు
  rationale: ఈ సందర్భంలో క్రియ భవిష్యత్తు చర్యకన్నా అనుమతించబడిన హక్కును సూచిస్తుంది. ‘ప్రథమ ఫలాలు’ తెలుగులో బహువచనం కాబట్టి సర్వనామం ‘వాటిని’గా సరిపోల్చబడింది.
theological_decisions:
- issue: యాజక ధర్మశాస్త్ర సందర్భంలో טָהוֹר యొక్క స్వభావం
  choice: ఆచారపరంగా శుద్ధుడైన అహరోను ఇంటి సభ్యుడు యాజకులకు కేటాయించిన భాగాన్ని తినవచ్చు
  alternative: సాధారణ నైతిక అర్థంలో పవిత్రుడు లేదా నిర్మలుడు
  rationale: సంఖ్యాకాండము 18లోని యాజక బాధ్యతలు, అర్పణలు, వాటిని తినే అర్హతల సందర్భం కారణంగా ఇక్కడి శుద్ధత ప్రధానంగా ఆచారపరమైనది. అయితే మూలంలోని సంక్షిప్తతను ప్రధాన పాఠ్యంలో ఉంచి, ఆ భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అలాగే యాజక ఆచార సందర్భానికి తగిన గౌరవప్రదమైన పదజాలం ఉపయోగించబడింది. మూలంలోని ఏకవచన సమూహార్థక ప్రత్యయాన్ని తెలుగులో ‘ప్రథమ ఫలాలు’కు అనుగుణంగా బహువచనంగా ఇచ్చాం.
