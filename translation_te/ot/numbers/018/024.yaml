source:
  edition: WLC
  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: te
  text: ఎందుకంటే, ఇశ్రాయేలీయులు యెహోవాకు ప్రతిష్ఠిత అర్పణగా ఎత్తి అర్పించే దశమభాగాన్ని నేను లేవీయులకు స్వాస్థ్యంగా ఇచ్చాను. అందుచేతనే, ‘ఇశ్రాయేలీయుల మధ్య వారికి స్వాస్థ్యం ఉండదు’ అని వారితో చెప్పాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: దశమభాగం
  rationale: మూలపదం ఆదాయంలో లేదా దిగుబడిలో పదోవంతును సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన, స్థిరమైన బైబిలు పదం.
- source_word: יָרִימוּ ... תְּרוּמָה
  choice: ప్రతిష్ఠిత అర్పణగా ఎత్తి అర్పించే
  rationale: רוּם క్రియలోని ‘ఎత్తడం’ అనే రూపకాన్ని నిలుపుతూ, תְּרוּמָה దేవునికి ప్రత్యేకంగా సమర్పించే అర్పణ అని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యం
  rationale: లేవీయులకు దశమభాగమే దేవుడు ఇచ్చిన వాటా/స్వాస్థ్యమని, ఇశ్రాయేలీయుల మధ్య భూస్వాస్థ్యం లేకపోవడంతో ఏర్పడే ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు / ఇశ్రాయేలీయుల మధ్య
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే ఆధునిక ప్రామాణిక తెలుగులో సమస్త ఇశ్రాయేలు ప్రజలను సహజంగా సూచిస్తుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: లేవీయుల స్వాస్థ్యం యొక్క స్వరూపం
  choice: దశమభాగాన్ని లేవీయులకు స్వాస్థ్యంగా ఇచ్చినట్లు నేరుగా పేర్కొనడం
  alternative: దశమభాగాన్ని కేవలం వారి పోషణ కోసం ఇచ్చినదిగా వివరణాత్మకంగా అనువదించడం
  rationale: మూలవాక్యం נַחֲלָה అనే పదాన్ని రెండుసార్లు ఉపయోగించి, దశమభాగ స్వాస్థ్యాన్ని ఇశ్రాయేలు మధ్య లేని స్వాస్థ్యంతో వ్యతిరేకిస్తుంది; ‘పోషణ’ అని మాత్రమే చెప్పడం ఈ న్యాయపరమైన, ధార్మికమైన భావాన్ని కుదిస్తుంది.
- issue: తెరూమా అర్పణ చర్య
  choice: ‘ప్రతిష్ఠిత అర్పణగా ఎత్తి అర్పించే’ అని చర్యతో సహా అనువదించడం
  alternative: ‘అర్పించే కానుక’ అని సాధారణీకరించడం
  rationale: మూలంలోని יָרִימוּ క్రియను తొలగించకుండా కాపాడుతుంది; అదే సమయంలో ఆ చర్య యొక్క ఖచ్చిత ఆచార విధానం గురించి పాఠ్యం చెప్పనిదాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం ఉపయోగించబడింది. ‘ఎత్తి అర్పించే’ ద్వారా హీబ్రూ రూపకం నిలుపబడింది; ‘ప్రతిష్ఠిత అర్పణ’ ద్వారా దాని ఆచార సంబంధ భావం స్పష్టమైంది. మూలంలోని కారణసూచక నిర్మాణం ‘ఎందుకంటే… అందుచేతనే’గా కాపాడబడింది.
