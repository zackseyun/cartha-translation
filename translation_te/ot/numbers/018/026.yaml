  to: 'లేవీయులతో మాట్లాడి, వారికి ఇలా చెప్పు: “ఇశ్రాయేలు కుమారుల నుండి నేను మీకు మీ స్వాస్థ్యంగా ఇచ్చిన దశమభాగాన్ని మీరు తీసుకున్నప్పుడు,[a] దానిలో నుండి యాహ్వేకు కానుకగా[b] దశమభాగంలో ఒక దశమభాగాన్ని సమర్పించాలి.[c]”'
