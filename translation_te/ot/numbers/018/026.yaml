source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: te
  text: 'లేవీయులతో మాట్లాడి, వారికి ఇలా చెప్పు: “ఇశ్రాయేలు కుమారుల నుండి నేను మీకు మీ స్వాస్థ్యంగా ఇచ్చిన దశమభాగాన్ని మీరు తీసుకున్నప్పుడు,[a] దానిలో నుండి యాహ్వేకు కానుకగా[b] దశమభాగంలో ఒక దశమభాగాన్ని సమర్పించాలి.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలు కుమారులు” అనే హీబ్రూ వ్యక్తీకరణను “ఇశ్రాయేలీయులు” లేదా “ఇశ్రాయేలు ప్రజలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: దీనిని “యాహ్వే యొక్క కానుక” లేదా “యాహ్వేకు అర్పించే కానుక” అని కూడా అనువదించవచ్చు; సంప్రదాయంగా దీనిని “యాహ్వేకు ఎత్తే అర్పణ” అని అంటారు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “దశమభాగం నుండి దశమభాగం”; అంటే లేవీయులు పొందిన దశమభాగంలో పదవ వంతు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్ర సభ్యులను సూచించే ప్రామాణికమైన, సహజమైన తెలుగు రూపం.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: ఇలా చెప్పాలి
  rationale: హీబ్రూలోని రెండు మాటల క్రియలు ఒకే ఆజ్ఞాపక పరిచయ సూత్రంగా పనిచేస్తాయి; తెలుగులో రెండింటినీ యాంత్రికంగా పునరుక్తి చేయకుండా సహజంగా తెలిపింది.
- source_word: כִּי תִקְחוּ
  choice: మీరు తీసుకున్నప్పుడు
  rationale: כִּי ఇక్కడ కారణాన్ని కాక, ఆ ఆజ్ఞ వర్తించే సందర్భాన్ని పరిచయం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే లింగసూచక ఒడంబడికా వ్యక్తీకరణను నిలుపుతుంది.
- source_word: הַמַּעֲשֵׂר
  choice: దశమభాగం
  rationale: ఆరాధనా ధర్మశాస్త్రంలో ఇవ్వవలసిన పదవ వంతుకు స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם בְּנַחֲלַתְכֶם
  choice: నేను మీకు మీ స్వాస్థ్యంగా ఇచ్చిన
  rationale: ఆ భాగం ఇశ్రాయేలీయుల నుండి వచ్చినప్పటికీ దేవుడు లేవీయులకు స్వాస్థ్యంగా ఇచ్చాడనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַהֲרֵמֹתֶם
  choice: సమర్పించాలి
  rationale: రום హిఫిల్‌కు ఈ ఆరాధనా సందర్భంలో ఉన్న అర్పించడం లేదా ప్రత్యేకించి సమర్పించడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: תְּרוּמַת יְהוָה
  choice: యెహోవాకు ప్రతిష్ఠించిన భాగం
  rationale: תְּרוּמָהను ప్రత్యేకించి సమర్పించిన భాగంగా చూపుతూ, సంబంధబోధక నిర్మాణం యెహోవాకు చెందినదా లేక ఆయన కొరకు ఉద్దేశించినదా అన్న స్వల్ప సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: దశమభాగంలో ఒక దశమభాగం
  rationale: లేవీయులు పొందిన దశమభాగం నుండి పదవ వంతును ఇవ్వాలనే partitive מִן భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగ రూపాన్ని నిలుపుతూ, అది సమస్త ఒడంబడికా ప్రజలను సూచించగల సంప్రదాయ వ్యక్తీకరణ అని పాదసూచికలో తెలియజేసింది.
- issue: תְּרוּמַת יְהוָה లోని సంబంధార్థం
  choice: యెహోవాకు ప్రతిష్ఠించిన భాగం
  alternative: యెహోవా భాగం
  rationale: హీబ్రూ సంయుక్త నిర్మాణం యెహోవాకు చెందిన భాగం లేదా యెహోవా కొరకు సమర్పించే భాగం అనే రెండు సమీప భావాలకు వీలు కల్పిస్తుంది; ప్రధాన పాఠం ఉద్దేశ్యార్థాన్ని సహజంగా ఇస్తూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. వాక్య నిర్మాణాన్ని సహజీకరించినప్పటికీ మూలంలోని సందర్భం, స్వాస్థ్య భావం, దశమభాగం నుండి పదవ వంతు అనే నిష్పత్తి నిలుపబడ్డాయి.
