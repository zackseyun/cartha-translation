    rationale: שׁמר with מִשְׁמֶרֶת conveys keeping/performing a custodial charge, but does not explicitly say “carefully.” Removing it avoids a small interpretive expansion.
  - severity: low
    issue: The lexical alternative underlying ‘ఇశ్రాయేలు ప్రజలు’ is not footnoted.
    rationale: The Hebrew literally reads ‘sons of Israel’; a footnote preserves the audit trail and source-form transparency while retaining the natural Telugu corporate expression in the main text.
