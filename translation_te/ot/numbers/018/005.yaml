source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: te
  text: మీరు పరిశుద్ధ స్థలపు బాధ్యతను, బలిపీఠపు బాధ్యతను నిర్వర్తించాలి; అప్పుడు ఇశ్రాయేలు ప్రజల[a] మీద ఇక ఉగ్రత రాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: బాధ్యతను జాగ్రత్తగా నిర్వర్తించాలి
  rationale: שׁמר మరియు מִשְׁמֶרֶת కలిసిన యాజకసేవా ప్రయోగం అప్పగించిన కాపలా బాధ్యతను నమ్మకంగా నిర్వహించడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా, కాపాడటం మరియు విధి నిర్వహణ అనే రెండు భావాలను ఈ పదబంధం కలిపి వ్యక్తం చేస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: బలిపీఠంతో జతగా ఉన్న ఈ సందర్భంలో ఇది అమూర్తమైన పరిశుద్ధతను కాక, పవిత్ర ప్రదేశాన్ని సూచిస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే altar‌కు ఆధునిక ప్రామాణిక తెలుగు బైబిలు పదం.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: అప్పుడు ... ఇక ... రాదు
  rationale: హీబ్రూ వావ్‌తో కూడిన నిషేధార్థక అసంపూర్ణ క్రియను సందర్భానుసారమైన ఫలిత సంబంధంగా సహజ తెలుగులో చూపిస్తుంది; עוֹד భావాన్ని ‘ఇక’ నిలుపుతుంది.
- source_word: קֶצֶף
  choice: ఉగ్రత
  rationale: సాధారణ కోపం కంటే తీర్పుతో కూడిన తీవ్రమైన ఆగ్రహాన్ని సూచిస్తుంది; మూలంలో దేవుని పేరు స్పష్టంగా లేకపోవడంతో దాన్ని జోడించలేదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: ఈ సమూహవాచక హీబ్రూ ప్రయోగం ఇశ్రాయేలు సమాజమంతటినీ సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలు కుమారులు’ అనేది అనవసరంగా పురుషులకు మాత్రమే వర్తించినట్టు వినిపించవచ్చు; ‘ప్రజలు’ భావాన్ని సహజంగా, సమగ్రంగా అందిస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యం కేవలం భవిష్యత్ ప్రకటననా, లేక బాధ్యత నిర్వహణ ఫలితాన్నా సూచిస్తుంది?
  choice: 'ఫలిత సంబంధం: ‘అప్పుడు ... ఇక ... రాదు’'
  alternative: ‘మరియు ... ఇక ఉండదు’ అనే సరళ భవిష్యత్ ప్రకటన
  rationale: సమీప సందర్భంలో పరిశుద్ధ స్థలం, బలిపీఠం పట్ల విధులను సక్రమంగా నిర్వర్తించడం ఇశ్రాయేలుపై మరింత తీర్పు రాకుండా చేయడం ప్రధాన భావం. ‘అప్పుడు’ ఈ సంబంధాన్ని స్పష్టం చేస్తుంది; దాన్ని కఠినమైన ఉద్దేశార్థంగా మాత్రమే నిర్ధారించదు.
- issue: ఉగ్రత ఎవరిదో అనువాదంలో స్పష్టంగా చేర్చాలా?
  choice: మూలంలాగే కర్తను అవ్యక్తంగా ఉంచడం
  alternative: ‘దేవుని ఉగ్రత’ అని స్పష్టంగా చేర్చడం
  rationale: సందర్భం దైవిక ఉగ్రతను సూచించినా, ఈ వాక్యంలో హీబ్రూ పాఠం దేవుని పేరును ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల అనువాదం ఆ నియంత్రణను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. ‘పరిశుద్ధ స్థలం,’ ‘బలిపీఠం,’ ‘ఉగ్రత’ వంటి స్థిరమైన ధార్మిక పదాలను ఉంచి, ‘బాధ్యతను జాగ్రత్తగా నిర్వర్తించాలి’ అనే సహజ వాక్యనిర్మాణాన్ని ఉపయోగించాం.
