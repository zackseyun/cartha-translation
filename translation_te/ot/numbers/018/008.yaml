- from: 'అప్పుడు యాహ్వే అహరోనుతో ఇలా అన్నాడు: “ఇదిగో, నేనే నా ప్రతిష్ఠిత అర్పణలను[a] చూసుకునే బాధ్యతను నీకు అప్పగించాను. ఇశ్రాయేలు కుమారుల[c] పవిత్ర కానుకలన్నిటినీ నీకు నీ అభిషేక భాగంగా[b], నీ కుమారులకు శాశ్వతమైన శాసనంగా ఇచ్చాను.”'
  to: 'అప్పుడు యాహ్వే అహరోనుతో ఇలా అన్నాడు: “ఇదిగో, నేనే ఇశ్రాయేలు కుమారుల[c] పవిత్ర కానుకలన్నిటిలోని నా ప్రతిష్ఠిత అర్పణల[a] నిర్వహణ బాధ్యతను నీకు అప్పగించాను. వాటిని నీకు నీ అభిషేక భాగంగా[b], నీ కుమారులకు శాశ్వతమైన నియమంగా ఇచ్చాను.”'
