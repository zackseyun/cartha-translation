reference: Numbers 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: te
  text: 'అప్పుడు యాహ్వే అహరోనుతో ఇలా అన్నాడు: “ఇదిగో, నేనే ఇశ్రాయేలు కుమారుల[c] పవిత్ర కానుకలన్నిటిలోని నా ప్రతిష్ఠిత అర్పణల[a] నిర్వహణ బాధ్యతను నీకు అప్పగించాను. వాటిని నీకు నీ అభిషేక భాగంగా[b], నీ కుమారులకు శాశ్వతమైన నియమంగా ఇచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా కానుకలు”; మరింత సాంకేతికంగా, “నా ఎత్తి అర్పించే అర్పణలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “అభిషేకం కోసం.” ఇక్కడి హెబ్రీ పదబంధం, అహరోను అభిషిక్త యాజక పదవివల్ల అతనికి చెందే భాగాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; ఇది ఇశ్రాయేలు ప్రజలకు వాడే సాధారణ ఒడంబడిక సంబంధ నామం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో స్పష్టమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיְדַבֵּר
  choice: ఇలా అన్నాడు
  rationale: దైవ వాక్యాన్ని పరిచయం చేసే హెబ్రీ కథన సూత్రానికి సహజమైన తెలుగు రూపం; తరువాత ప్రత్యక్ష వాక్యం వస్తున్నందున ఇది సులభంగా చదవబడుతుంది.
- source_word: וַאֲנִי הִנֵּה
  choice: ఇదిగో, నేనే
  rationale: הִנֵּה లోని దృష్టిని ఆకర్షించే భావాన్నీ, స్వతంత్ర సర్వనామమైన אֲנִי లోని ఉద్ఘాటననూ నిలిపింది.
- source_word: נָתַתִּי לְךָ
  choice: నీకు అప్పగించాను
  rationale: ఇక్కడ ఇవ్వబడుతున్నది కాపాడే బాధ్యత కాబట్టి, נתן యొక్క ఇవ్వడం అనే భావాన్ని బాధ్యత అప్పగింపుగా సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: מִשְׁמֶרֶת
  choice: చూసుకునే బాధ్యత
  rationale: కాపాడటం, పర్యవేక్షించడం, అప్పగించబడిన విధి అనే భావాలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּרוּמֹתַי
  choice: నా ప్రతిష్ఠిత అర్పణలు
  rationale: యాహ్వేకు ప్రత్యేకంగా సమర్పించిన కానుకల భావాన్ని తెలియజేస్తుంది; సాంకేతికమైన ‘ఎత్తి అర్పించే అర్పణలు’ను ప్రధాన పాఠ్యంలో నివారించి పాదసూచికలో ఉంచాం.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల పవిత్ర కానుకలన్నిటినీ
  rationale: కార్యసందర్భంలో קָדְשֵׁי అనేది ప్రతిష్ఠిత వస్తువులు లేదా కానుకలను సూచిస్తుంది; בְנֵי יִשְׂרָאֵל యొక్క ఒడంబడిక సంబంధ జాతీయ పదబంధాన్ని రూపపరంగా నిలిపాం.
- source_word: לְמָשְׁחָה
  choice: నీ అభిషేక భాగంగా
  rationale: అహరోను అభిషిక్త యాజక పదవివల్ల అతనికి కేటాయించబడిన భాగమనే సందర్భార్థాన్ని సంక్షిప్తంగా తెలియజేస్తూ, పదబంధంలోని అభిషేక సంబంధాన్ని నిలిపింది.
- source_word: וּלְבָנֶיךָ
  choice: నీ కుమారులకు
  rationale: అహరోను తరువాత అతని కుమారులకు వర్తించే యాజక హక్కును నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לְחָק עוֹלָם
  choice: శాశ్వతమైన శాసనంగా
  rationale: חָק లోని స్థిరమైన చట్టబద్ధ నియమ భావాన్నీ, עוֹלָם లోని నిరంతరత్వాన్నీ గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְמָשְׁחָה లోని యాజక హక్కు భావం
  choice: నీ అభిషేక భాగంగా
  alternative: అభిషేకం కోసం; నీ ప్రతిష్ఠిత వాటాగా
  rationale: ఈ వచనం కొత్త అభిషేక క్రియను ఆదేశించడంకన్నా, అహరోను అభిషిక్త యాజక పదవికి సంబంధించిన కేటాయింపును సూచించే అవకాశం ఎక్కువ. అయినా పదానికి ఉన్న ‘అభిషేకం కోసం’ అనే అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
- issue: בְנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు; ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ బహువచన కుటుంబ-జాతీయ రూపాన్ని, దాని ఒడంబడిక సంబంధ స్వరూపాన్ని నిలిపింది; ఇది మొత్తం ఇశ్రాయేలు సమాజానికి వాడే స్థిర పదబంధమని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘చూసుకునే బాధ్యత’ సాధారణ పాఠకునికి అర్థమయ్యేలా యాజక పరిరక్షణ విధిని తెలియజేస్తుంది. ‘ప్రతిష్ఠిత అర్పణలు,’ ‘అభిషేక భాగం,’ ‘శాశ్వతమైన శాసనం’ వంటి పదాలు యాజక-చట్ట సందర్భపు గంభీరతను నిలుపుతాయి.
