id: NUM.18.12
reference: Numbers 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: te
  text: నూనెలోని అత్యుత్తమ భాగమంతా,[a] కొత్త ద్రాక్షారసంలోను ధాన్యంలోను అత్యుత్తమ భాగమంతా—అవి వారు యెహోవాకు ఇచ్చే ప్రథమఫలాలు—నేను నీకు ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘కొవ్వు’; నూనె, కొత్త ద్రాక్షారసం, ధాన్యం వంటి పంట ఉత్పత్తుల సందర్భంలో అత్యుత్తమమైన లేదా శ్రేష్ఠమైన భాగాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: శ్రేష్ఠమైనది
  rationale: ఈ పదానికి అక్షరార్థంగా ‘కొవ్వు’ అని అర్థం ఉన్నా, పంట ఉత్పత్తుల సందర్భంలో అత్యుత్తమమైన లేదా మేలైన భాగాన్ని సూచించే నుడికారంగా వాడబడింది.
- source_word: יִצְהָר
  choice: నూనె
  rationale: ఈ పదం సాధారణంగా తాజాగా తీసిన నూనెను, ఇశ్రాయేలు సందర్భంలో ఎక్కువగా ఒలీవ నూనెను సూచిస్తుంది; అయితే ‘ఒలీవ’ అనేది పదంలో స్పష్టంగా లేకపోవడంతో ‘నూనె’ అని అనువదించాం.
- source_word: תִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: ఇది సాధారణ ద్రాక్షారసం కంటే తాజాగా ఉత్పత్తి చేసిన ద్రాక్షారసాన్ని సూచిస్తుంది; మూలపదంలోని ప్రత్యేకతను ఈ అనువాదం నిలుపుతుంది.
- source_word: דָּגָן
  choice: ధాన్యం
  rationale: ఈ విస్తృత పదం ధాన్యపు పంటలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ధాన్యం’ సహజమైన సమానార్థకం.
- source_word: רֵאשִׁיתָם
  choice: వాటి ప్రథమఫలాలు
  rationale: వ్యవసాయ అర్పణల సందర్భంలో ఈ పదం మొదటి దిగుబడిని లేదా మొదటి భాగాన్ని సూచిస్తుంది; ‘ప్రథమఫలాలు’ ఆ ఆరాధనా సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: వారు యెహోవాకు ఇచ్చే
  rationale: נתן అనే క్రియకు దగ్గరగా ఉంటూ, ఈ ప్రథమఫలాలు యెహోవాకు ఇవ్వబడేవని సహజంగా తెలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ వ్యక్తినామమైన יהוהను వ్యక్తినామంగానే ‘యెహోవా’ అని ప్రతిబింబించాం.
- source_word: לְךָ נְתַתִּים
  choice: నేను నీకు ఇచ్చాను
  rationale: పూర్తిక్రియ రూపం, ఈ కేటాయింపు స్థిరంగా మంజూరు చేయబడిందనే పూర్తయిన ప్రకటన భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక వ్యక్తినామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. חֵלֶב యొక్క అక్షరార్థాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠంలో దాని సందర్భార్థమైన ‘శ్రేష్ఠమైనది’ని ఇచ్చాం. ఏకవచన సంబోధనను ‘నీకు’గా నిలిపాం.
