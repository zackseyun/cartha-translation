revisions:
- from: నూనెలో శ్రేష్ఠమైనదంతా,[a] కొత్త ద్రాక్షారసంలోను ధాన్యంలోను శ్రేష్ఠమైనదంతా—వారు యెహోవాకు ఇచ్చే వాటి ప్రథమఫలాలను—నేను నీకు ఇచ్చాను.
  to: నూనెలోని అత్యుత్తమ భాగమంతా,[a] కొత్త ద్రాక్షారసంలోను ధాన్యంలోను అత్యుత్తమ భాగమంతా—అవి వారు యెహోవాకు ఇచ్చే ప్రథమఫలాలు—నేను నీకు ఇచ్చాను.
  rationale: The revision preserves every source element while clarifying that the choicest portions are the firstfruits given to YHWH. It also retains the singular “నీకు,” the completed force of “ఇచ్చాను,” and the explanatory footnote for the literal lexical alternative.
