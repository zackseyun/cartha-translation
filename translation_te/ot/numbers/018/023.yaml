source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: te
  text: అయితే లేవీయుడే సమాజపు గుడారపు సేవను చేయాలి; వారు తమ దోషాన్ని మోయాలి.[a] ఇది మీ తరతరాలకు శాశ్వతమైన శాసనం. ఇశ్రాయేలు కుమారుల మధ్య[b] వారు ఏ స్వాస్థ్యాన్నీ పొందరు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ అపరాధాన్ని మోయాలి.’ హీబ్రూ నుడికారం దోషాన్ని, అపరాధాన్ని, లేదా దానితో ముడిపడిన బాధ్యతనూ పర్యవసానాలనూ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలీయుల మధ్య.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల మధ్య’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘వారసత్వంగా పొందడం’ మరియు ‘స్వాస్థ్యం’ అనే ఒకే మూలానికి చెందిన క్రియా-నామాలు ఉన్నాయి; ఈ పునరుక్తి వారికి గోత్ర భూభాగపు స్వాస్థ్యం ఉండదనే విషయాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: సేవను చేయాలి
  rationale: న్యాయపరమైన ఆదేశ సందర్భంలో ఈ క్రియకు విధి/భవిష్యత్ బలం ఉంది. ‘చేయాలి’ దాని నిర్దేశాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַלֵּוִי הוּא
  choice: లేవీయుడే
  rationale: స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను ‘-ఏ’ నిపాతం సహజంగా వ్యక్తం చేస్తుంది; సందర్భానికి మించిన ప్రత్యేకాధికార భావాన్ని చేర్చదు.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారపు సేవ
  rationale: עֲבֹדָה ఇక్కడ ఆరాధనా సంబంధమైన విధి లేదా సేవను సూచిస్తుంది. אֹהֶל מוֹעֵדకు ‘ప్రత్యక్షపు గుడారం’ గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదబంధం.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: వారు తమ దోషాన్ని మోయాలి
  rationale: נשא עון అనే న్యాయ-ఆరాధనా నుడికారాన్ని ‘దోషాన్ని మోయడం’గా నిలిపి, అది దోషభావాన్నా, బాధ్యతనో, దాని పర్యవసానాలనో ప్రధానంగా సూచిస్తుందనే అంశాన్ని అనవసరంగా నిర్ణయించలేదు.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: ఇశ్రాయేలు నిబంధనా వ్యవస్థలో కొనసాగుతూ ఉండే నియమం అనే భావాన్ని గౌరవప్రదమైన, స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: వరుస తరాలన్నిటికీ వర్తించే కొనసాగింపును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్య
  rationale: మూలంలోని ‘కుమారులు’ అనే పుంలింగ బహువచన రూపాన్ని నిలిపి, בתוך యొక్క సందర్భోచిత భావాన్ని ‘మధ్య’తో తెలిపింది.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: వారు ఏ స్వాస్థ్యాన్నీ పొందరు
  rationale: మూలంలోని సమానమూల క్రియా-నామ పునరుక్తి తెలుగులో యథాతథంగా పెడితే కృత్రిమంగా ఉంటుంది. ‘ఏ స్వాస్థ్యాన్నీ పొందరు’ భూభాగపు స్వాస్థ్యం నిరాకరించబడిందనే ఉద్ఘాటనను సహజంగా అందిస్తుంది; రూపపరమైన పునరుక్తిని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: లేవీయుల సేవకు సంబంధించిన దోషం లేదా బాధ్యతను మోయడం
  choice: ‘తమ దోషాన్ని మోయాలి’ అనే న్యాయ-ఆరాధనా నుడికారాన్ని నిలిపివేయడం
  alternative: ‘తమ అపరాధానికి శిక్ష అనుభవించాలి’ లేదా ‘తమ బాధ్యతను భరించాలి’
  rationale: మూలపాఠం దోషం, దోషబాధ్యత, దాని పర్యవసానాలు అనే పరస్పర సంబంధిత భావాలలో దేనిని ప్రత్యేకంగా ముందుకు తెస్తుందో పూర్తిగా నిర్దిష్టం చేయదు. అందువల్ల వివరణాత్మకంగా కుదించకుండా దాని వేదాంత ఉద్వేగాన్ని నిలిపింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహ సూచన
  choice: ఇశ్రాయేలు కుమారుల మధ్య
  alternative: ఇశ్రాయేలీయుల మధ్య
  rationale: మూలంలోని పుంలింగ సమూహవ్యక్తీకరణను ప్రత్యక్షంగా నిలిపింది; సాధారణ జాతిసూచక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: లేవీయులకు స్వాస్థ్యం లేకపోవడం
  choice: ఏ స్వాస్థ్యాన్నీ పొందరు
  alternative: స్వాస్థ్యాన్ని స్వాస్థ్యంగా పొందరు
  rationale: ఇది గోత్ర భూభాగపు స్వాస్థ్య నిరాకరణను తెలియజేస్తుంది. అసహజమైన తెలుగు పునరుక్తిని ప్రధాన వాక్యంలో బలవంతంగా పెట్టకుండా, మూల రూపాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి వాడబడింది. ‘లేవీయుడే’ ఉద్ఘాటనను, ‘దోషాన్ని మోయాలి’ మూల నుడికారంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతాయి. ప్రధాన వాక్యంలో అసహజ పునరుక్తిని నివారించి, దాని రూపం మరియు ఉద్ఘాటనను పాదసూచికలో సంరక్షించాం.
