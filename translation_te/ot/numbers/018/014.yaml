source:
  edition: WLC
  text: כָּל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: te
  text: ఇశ్రాయేలులో తిరుగులేని విధంగా అంకితం చేయబడినదంతా[a] నీదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులో నిషేధం కింద ఉంచబడినదంతా.” ఇక్కడి హీబ్రూ పదం దేవునికి తిరుగులేని విధంగా అంకితం చేసినదాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో అది నాశనానికి అంకితం చేసినదాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: అంతా
  rationale: ఏకవచన సమష్టి భావంతో ఉన్న חֵרֶם వర్గమంతటినీ సూచిస్తుంది; తెలుగులో ‘ప్రతిష్ఠితమైనదంతా’ సహజంగా ఉంటుంది.
- source_word: חֵרֶם
  choice: ప్రతిష్ఠితమైనది
  rationale: సాధారణ వినియోగం నుండి శాశ్వతంగా వేరుచేసి దేవునికి అంకితం చేసినదాన్ని సూచించే న్యాయ-ఆరాధనా సాంకేతిక పదం. ఈ వచనం స్వయంగా నాశన భావాన్ని నిర్దిష్టం చేయనందున విస్తృతార్థాన్ని ప్రధాన పాఠంలో ఉంచాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ב ఇక్కడ స్థలం లేదా పరిధిని సూచిస్తుంది; ఇశ్రాయేలు సమాజంలో ఈ వర్గానికి చెందినదంతా అనే భావం.
- source_word: לְךָ
  choice: నీది
  rationale: అహరోనుకు ఇచ్చిన స్వామ్య హక్కు లేదా కేటాయింపును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה
  choice: అవుతుంది
  rationale: היה యొక్క అసంపూర్ణ క్రియారూపం భవిష్య న్యాయపరమైన కేటాయింపును సూచిస్తుంది; ‘నీదవుతుంది’ ఆధునిక తెలుగులో సహజం.
theological_decisions:
- issue: חֵרֶם అనే ఆరాధనా-న్యాయ సాంకేతిక పదం అనువాదం
  choice: ప్రతిష్ఠితమైనది
  alternative: నాశనానికి అంకితం చేయబడినది; నిషేధం కింద ఉంచబడినది
  rationale: חֵרֶם సందర్భానుసారంగా దేవునికి తిరుగులేకుండా అంకితం చేసినదాన్ని, కొన్ని సందర్భాల్లో నాశనానికి అంకితం చేసినదాన్ని సూచించగలదు. ఈ వచనం ఆ బలమైన భావాన్ని స్పష్టంగా నిర్దేశించదు కాబట్టి ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపర శైలిని ఉపయోగించాం. సాంకేతిక హీబ్రూ పదంలోని ఉద్దేశపూర్వక విస్తృతార్థాన్ని ప్రధాన పాఠంలో నిలిపి, నాశన భావాన్ని పాదసూచికకు పరిమితం చేశాం.
