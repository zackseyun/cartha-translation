source:
  edition: WLC
  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: te
  text: మీ కానుకలన్నిటిలోనుండి యాహ్వేకు ప్రత్యేక అర్పణ అంతటినీ మీరు ఎత్తి అర్పించాలి—ప్రతి కానుకలోని అత్యుత్తమ భాగమంతటినుండి దాని పవిత్ర భాగాన్ని.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాని కొవ్వు అంతటినుండి”; అంటే, ప్రతి కానుకలోని అత్యుత్తమ భాగమంతటినుండి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని ప్రతిష్ఠిత భాగాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: మీ కానుకలన్నిటిలోనుంచి
  rationale: מִן + כֹּל మూలం లేదా మొత్తం నుంచి వేరుచేయడాన్ని సూచిస్తుంది; מַתָּנוֹת సాధారణంగానూ యాజకసంబంధ సందర్భానికీ సరిపోయేలా ‘కానుకలు’గా అనువదించబడింది.
- source_word: תָּרִימוּ
  choice: ఎత్తి అర్పించాలి
  rationale: רוּם హిఫీల్ రూపంలోని ‘ఎత్తడం’ అనే బలమైన చిత్రాన్ని నిలుపుతూ, ఆరాధనా సందర్భంలో దాని సాంకేతిక అర్థమైన అర్పణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: యెహోవా ప్రతిష్ఠార్పణలన్నిటినీ
  rationale: תְּרוּמָה అనేది వేరుచేసి ఎత్తి అర్పించే కానుకకు వాడే ఆరాధనా పదం. ‘యెహోవా ప్రతిష్ఠార్పణ’ అనే నిర్మాణం దిశను లేదా స్వామ్యాన్ని అతిగా నిర్ణయించకుండా హెబ్రీయ genitive సంక్షిప్తతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: מִכָּל חֶלְבּוֹ
  choice: వాటిలోని శ్రేష్ఠమైన భాగమంతటిలోనుంచి
  rationale: חֵלֶב అక్షరార్థంగా ‘కొవ్వు’; ఇక్కడ కానుకలోని అత్యుత్తమ లేదా మేలైన భాగాన్ని సూచించే రూపకాలంకార ప్రయోగం. సమష్టి కానుకలను సూచించేందుకు తెలుగులో బహువచన సూచన సహజంగా వాడబడింది.
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: దాని పవిత్ర భాగాన్ని వేరుచేసి అర్పించాలి
  rationale: מִקְדְּשׁוֹ ఇక్కడ కానుకలో దేవునికోసం పవిత్రంగా వేరుచేసిన భాగం. చివరి מִמֶּנּוּలోని ‘దానిలోనుంచి’ భావాన్ని ‘వేరుచేసి’ ద్వారా తెలుగులో స్పష్టంగా తెలియజేసి, ముందున్న క్రియను సహజంగా పునరుద్ధరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా సుపరిచితమైన లిప్యంతరీకరణ; అయితే ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: תְּרוּמַת יְהוָהలోని సంబంధం
  choice: యెహోవా ప్రతిష్ఠార్పణ
  alternative: యెహోవాకు ప్రతిష్ఠార్పణ
  rationale: హెబ్రీయ సంబంధ నిర్మాణం అర్పణ యెహోవాకు చెందుతుందా లేక ఆయనకు సమర్పించబడుతుందా అన్న రెండు పరస్పర సమీప భావాలను అనుమతిస్తుంది. తెలుగు సమాస నిర్మాణం ఆ సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. ‘ఎత్తి అర్పించాలి’ మూలంలోని బలి సంబంధ దృశ్యాన్ని నిలుపుతూనే సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంది; ‘ప్రతిష్ఠార్పణ’ సాంకేతిక భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
