translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వ్యవసాయ సమాంతరతను నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని పాదసూచనలో ఇచ్చాం.
