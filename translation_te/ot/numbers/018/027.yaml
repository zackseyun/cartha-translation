  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: te
  text: మీ ప్రతిష్ఠిత భాగం మీకు నూర్పిడి కళ్లం నుండి వచ్చే ధాన్యంలా, ద్రాక్షతొట్టి నుండి వచ్చే పూర్తి దిగుబడిలా లెక్కించబడుతుంది[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ లెక్కలో చేర్చబడుతుంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ అర్పణ”; సాంప్రదాయంగా, “ఎత్తి అర్పించే కానుక.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో, “ద్రాక్షతొట్టి నుండి వచ్చే నిండుదనం”; అంటే ద్రాక్షతొట్టి ఇచ్చే పూర్తి దిగుబడి లేదా ఉత్పత్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: పరిగణించబడుతుంది
  rationale: నిఫాల్ రూపం ఇక్కడ ఒకదాన్ని మరొకదానికి సమానమైనదిగా లెక్కించడం లేదా భావించడం అనే న్యాయ-ఆరాధనా భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: תְּרוּמַתְכֶם
  choice: మీరు ఇచ్చే ప్రతిష్ఠిత భాగం
  rationale: తెరూమా అనేది పరిశుద్ధ వినియోగం కోసం వేరుచేసి ఇచ్చే భాగం. సందర్భంలో లేవీయులు దశమభాగం నుండి ఇచ్చే భాగాన్ని సూచిస్తున్నందున ఈ రూపం అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַּדָּגָן
  choice: ధాన్యంలా
  rationale: దాగాన్ ధాన్యపు పంటను సూచిస్తుంది; ఉపమానార్థక כను ‘లా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הַגֹּרֶן
  choice: నూర్పిడి కళ్లం నుండి వచ్చే
  rationale: గోరెన్ ధాన్యాన్ని నూర్చే కళ్లాన్ని సూచిస్తుంది; ఇక్కడ అది అక్కడి నుండి లభించే ధాన్య దిగుబడికి లక్షణార్థకంగా వాడబడింది.
- source_word: וְכַמְלֵאָה
  choice: సమృద్ధిగల దిగుబడిలా
  rationale: మెలేఆహ్ అక్షరార్థంగా ‘నిండుదనం’; ఈ వ్యవసాయ సందర్భంలో ద్రాక్షతొట్టి ఇచ్చే పూర్తి దిగుబడిని సూచిస్తుంది. తెలుగులో కేవలం ‘నిండుదనం’ కంటే ‘సమృద్ధిగల దిగుబడి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִן הַיָּקֶב
  choice: ద్రాక్షతొట్టి నుండి వచ్చే
  rationale: యేకెవ్ ద్రాక్షరసం తీసే తొట్టి లేదా గానుగను సూచిస్తుంది. ‘ద్రాక్షతొట్టి’ వ్యవసాయ దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
