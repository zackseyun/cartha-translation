- from: మీరు ఇచ్చే ప్రతిష్ఠిత భాగం మీకు నూర్పిడి కళ్లం నుండి వచ్చే ధాన్యంలా, ద్రాక్షతొట్టి నుండి వచ్చే సమృద్ధిగల దిగుబడిలా పరిగణించబడుతుంది[a][b][c].
  to: మీ ప్రతిష్ఠిత భాగం మీకు నూర్పిడి కళ్లం నుండి వచ్చే ధాన్యంలా, ద్రాక్షతొట్టి నుండి వచ్చే పూర్తి దిగుబడిలా లెక్కించబడుతుంది[a][b][c].
  rationale: The revision replaces ‘abundant yield’ with ‘full yield’ to avoid adding a nuance absent from the Hebrew. It also makes the alternative traditional terminology in footnote b intelligible in modern Telugu. The possessive wording is retained without the added verbal phrase “మీరు ఇచ్చే,” keeping closer to the Hebrew ‘your contribution.’
