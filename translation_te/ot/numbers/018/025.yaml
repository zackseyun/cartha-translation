  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; ‘యాహ్వే’ అని లిప్యంతరీకరిస్తారు; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దבר అనే క్రియకు ప్రాథమికంగా ‘మాట్లాడు’ అనే భావం ఉన్నా, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఈ స్థిర సూత్రంలో ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל సంబంధాన్ని ఆధునిక తెలుగులో సహజమైన ‘మోషేతో’ అనే రూపంలో వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రపదాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని అనువదించాం; తరువాతి వాక్యం వస్తుందని సూచించడానికి ద్విబిందువు వాడాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపాం. ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా ఉండవచ్చుగానీ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ప్రత్యామ్నాయ సంప్రదాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే సంక్షిప్త వాక్య నిర్మాణం వాడాం. తరువాతి వచనంలోని ప్రత్యక్ష మాటను పరిచయం చేయడానికి ద్విబిందువు ఉంచాం.
