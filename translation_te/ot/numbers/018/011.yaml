  terminology: ‘ప్రతిష్ఠిత భాగం’ తేరూమా యొక్క వేరుచేయబడిన పవిత్ర భాగం అనే భావాన్ని సముచితంగా తెలియజేస్తుంది. ‘ఊపి అర్పించే అర్పణలు,’ ‘శాశ్వతమైన నియమం,’ మరియు ‘ఆచారపరంగా శుద్ధి’ సందర్భానికి తగిన పదాలే. ఫుట్‌నోట్ bలో కూడా పురుషార్థక ఏకవచనాన్ని తొలగించాలి.
