source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: te
  text: 'నీకు చెందేది ఇదే: ఇశ్రాయేలు కుమారులు ఊపి అర్పించే అర్పణలన్నిటితో పాటు, వారి కానుకల ప్రతిష్ఠిత భాగం[a]. వాటిని నీకూ, నీతోపాటు నీ కుమారులకు, నీ కుమార్తెలకు శాశ్వతమైన నియమంగా ఇచ్చాను. నీ ఇంటివారిలో ఆచారపరంగా శుద్ధిగా ఉన్న ప్రతి ఒక్కరూ[b] దానిని తినవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రతిష్ఠిత భాగం’ అని అనువదించిన హీబ్రూ పదం, పవిత్ర వినియోగం కోసం వేరుచేసి సమర్పించిన భాగాన్ని సూచిస్తుంది; దీనిని ‘ఎత్తి అర్పించే అర్పణ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘శుద్ధిగా ఉన్న’ అంటే కేవలం శారీరకంగా శుభ్రంగా లేదా నైతికంగా మంచిగా ఉన్న వ్యక్తి కాదు; ధర్మశాస్త్రం ప్రకారం ఆచారపరంగా శుద్ధిగా ఉన్న వ్యక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת
  choice: ప్రతిష్ఠిత భాగం
  rationale: పవిత్ర వినియోగం కోసం వేరుచేసిన కానుక భాగమనే యాజకసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం సాధారణ ‘అర్పణ’గా కుదించదు.
- source_word: מַתָּנָם
  choice: వారి కానుకల
  rationale: מַתָּנָה యొక్క ప్రాథమిక ‘కానుక’ భావాన్నీ, బహువచన స్వామ్య ప్రత్యయమైన ‘వారి’నూ నిలుపుతుంది.
- source_word: תְּנוּפֹת
  choice: ఊపి అర్పించే అర్పణలు
  rationale: దేవుని సన్నిధిలో ఆచారపూర్వకంగా ఊపి సమర్పించే క్రియను స్పష్టంగా తెలిపి, సాంకేతిక బలివిధి భావాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని సంప్రదాయ సమూహపదాన్ని రూపపరంగా నిలుపుతుంది; దానిని నిశ్శబ్దంగా లింగతటస్థ పదంగా మార్చదు.
- source_word: נְתַתִּים
  choice: వాటిని ... ఇచ్చాను
  rationale: పూర్తయిన అనుగ్రహాన్ని తెలిపే క్రియారూపాన్నీ, ముందు ప్రస్తావించిన అర్పణ భాగాలను సూచించే బహువచన కర్మప్రత్యయాన్నీ కాపాడుతుంది.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: నీతోపాటు నీ కుమారులకు, నీ కుమార్తెలకు
  rationale: మూలం కుమారులనూ కుమార్తెలనూ విడిగా పేర్కొన్నందున రెండింటినీ స్పష్టంగా ఉంచుతుంది; ‘నీతోపాటు’ వారు అహరోను కుటుంబ పరిధిలో ఉన్నారని సూచిస్తుంది.
- source_word: לְחָק עוֹלָם
  choice: శాశ్వతమైన నియమంగా
  rationale: నిర్దేశిత, కొనసాగుతూ ఉండే నిబంధన అనే న్యాయపరమైన భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: నీ ఇంటివారిలో ఆచారపరంగా శుద్ధుడైన ప్రతి ఒక్కరూ
  rationale: ‘ఇల్లు’ అనే పదబంధాన్ని కుటుంబసభ్యుల పరిధిగా సహజంగా వ్యక్తం చేస్తూ, యాజక ధర్మశాస్త్ర సందర్భంలోని ఆచారశుద్ధిని ప్రధాన వాక్యంలోనే స్పష్టం చేస్తుంది.
- source_word: יֹאכַל אֹתוֹ
  choice: దానిని తినవచ్చు
  rationale: ఇక్కడి అసంపూర్ణ క్రియారూపం తెలిపే అనుమతి లేదా హక్కును ‘తినవచ్చు’ సహజంగా తెలియజేస్తుంది; ఏకవచన కర్మప్రత్యయాన్ని ‘దానిని’గా నిలుపుతుంది.
theological_decisions:
- issue: ఆచారశుద్ధి భాష
  choice: טָהוֹר ను ‘ఆచారపరంగా శుద్ధుడు’గా అనువదించడం
  alternative: నైతికంగా పవిత్రుడు లేదా కేవలం శుభ్రంగా ఉన్నవాడు
  rationale: ఇది యాజక ధర్మశాస్త్రంలో పవిత్ర అర్పణ భాగాలను ఎవరు తినవచ్చో నియంత్రించే సందర్భం; కాబట్టి ఇక్కడ ఉద్దేశించినది శారీరక పరిశుభ్రత లేదా నైతిక నీతి మాత్రమే కాదు, ఆచారపరమైన శుద్ధి.
- issue: చివరి కర్మప్రత్యయంలో సంఖ్య మార్పు
  choice: ‘వాటిని ... ఇచ్చాను’ తరువాత ‘దానిని తినవచ్చు’ అని మూలంలోని బహువచన–ఏకవచన మార్పును నిలుపడం
  alternative: రెండు చోట్లా బహువచనం వాడి ‘వాటిని తినవచ్చు’ అనడం
  rationale: హీబ్రూలో ఇచ్చిన వాటిని బహువచనంగా పేర్కొని, చివరలో సమష్టిగా భావించిన అర్పణ భాగాన్ని ఏకవచనంతో సూచిస్తుంది. ఈ స్వల్ప ఉద్రిక్తతను సరిచేయకుండా అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యాజకసంబంధ సాంకేతిక భావాలను అవసరమైన చోట వివరణాత్మకంగా వ్యక్తం చేశాం. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపాన్ని నిలిపి, కుమారులు–కుమార్తెల ప్రస్తావనను సంక్షిప్తం చేయలేదు.
