  source_fidelity: 'మొత్తంగా మూలానికి నమ్మకంగా ఉంది: తేరూమా, కానుకలు, ఊపి అర్పించే అర్పణలు, కుమారులు–కుమార్తెలు, శాశ్వత నియమం, మరియు తినుటకు అనుమతి అన్నీ సరిగ్గా ప్రతిఫలించాయి. అయితే כָּל טָהוֹר (‘శుద్ధిగా ఉన్న ప్రతి వ్యక్తి’) లింగపరంగా నిర్దిష్టం కాదు; ప్రధాన వాక్యంలోని ‘శుద్ధుడైన’ రూపం అనవసరంగా పురుషార్థకమవుతుంది.'
