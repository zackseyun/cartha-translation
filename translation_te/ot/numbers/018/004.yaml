id: NUM.18.4
reference: Numbers 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: te
  text: వారు నీతో చేరి, సమాగమ గుడారపు బాధ్యతను నిర్వహిస్తూ, గుడారానికి సంబంధించిన సేవ అంతటినీ చేయాలి. అయితే అనుమతి లేని వ్యక్తి[a] మీ దగ్గరికి రాకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయటి వ్యక్తి.” ఇక్కడి హీబ్రూ పదం జాతిపరంగా విదేశీయుడిని తప్పనిసరిగా సూచించదు; పవిత్రస్థలంలో అనుమతించబడిన సేవా పాత్రకు వెలుపల ఉన్న వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: వారు నీతో చేరి
  rationale: נלוה అనే క్రియతో על ఒక వ్యక్తితో అనుబంధమై సహాయక సేవ చేయడాన్ని సూచిస్తుంది. ‘నీతో చేరి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, అహరోనుతో లేవీయుల కార్యసంబంధాన్ని నిలుపుతుంది.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: బాధ్యతను ... నిర్వర్తించాలి
  rationale: యాజక సంబంధ సందర్భంలో שמר + משמרת అప్పగించబడిన విధిని జాగ్రత్తగా చేపట్టి నిర్వర్తించడాన్ని సూచిస్తుంది. తెలుగులో ‘బాధ్యతను నిర్వర్తించాలి’ ఈ అధికారిక విధి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి వాడే స్థిరమైన బైబిలు పదబంధంగా ‘ప్రత్యక్ష గుడారం’ను ఎంచుకున్నాం.
- source_word: לְכָל עֲבֹדַת הָאֹהֶל
  choice: గుడారంలోని సేవ అంతటినీ
  rationale: עֲבֹדָה ఇక్కడ సాధారణ పని మాత్రమే కాక, గుడారానికి సంబంధించిన నియమిత పవిత్ర సేవను సూచిస్తుంది. ‘సేవ అంతటినీ’ ఆ ఆరాధనా సందర్భాన్ని నిలుపుతుంది.
- source_word: וְזָר
  choice: అయితే అనుమతి లేని వ్యక్తి
  rationale: זָר ఇక్కడ జాతిపరంగా విదేశీయుడని కాక, పవిత్రస్థల సేవలో ప్రవేశాధికారం లేని వ్యక్తిని సూచిస్తుంది. అందువల్ల ‘అనుమతి లేని వ్యక్తి’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: మీ దగ్గరికి రాకూడదు
  rationale: קרב పవిత్రస్థల నియమాలలో నిషిద్ధమైన సమీప ప్రవేశాన్ని సూచిస్తుంది. ఏకవచన ‘నీతో’ నుంచి బహువచన אֲלֵיכֶםకు మార్పును ‘మీ’ ద్వారా స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: పవిత్రస్థల నియమాలలో זָר యొక్క అర్థం
  choice: అనుమతి లేని వ్యక్తి—అనుమతించబడిన యాజక లేదా లేవీయ సేవా పరిధికి వెలుపలివాడు
  alternative: పరదేశి / విదేశీయుడు / బయటి వ్యక్తి
  rationale: సందర్భం జాతి లేదా దేశ మూలాన్ని గురించి కాక, పవిత్ర సేవకు ఎవరికున్న అధికారం గురించి మాట్లాడుతోంది. ‘అనుమతి లేని వ్యక్తి’ అనేది జాతిపరమైన అపార్థాన్ని నివారిస్తూ ఆ నియంత్రిత ప్రవేశ భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నీతో’ అనే ఏకవచన సంబోధనను, చివరనున్న ‘మీ’ అనే బహువచన సంబోధనను మూలంలోని సంఖ్యా మార్పుకు అనుగుణంగా నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
