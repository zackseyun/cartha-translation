review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Yahweh's speech to Aaron, the two parallel obligations, the inclusion of Aaron's sons and paternal household in the first clause, and the narrower inclusion of his sons in the second. It appropriately retains the Hebrew נשא עון idiom without deciding whether it chiefly denotes guilt, liability, or responsibility.
  naturalness: The wording is generally clear modern Telugu, but “నీ పితృగృహం” is somewhat bookish and can be mistaken for a physical ancestral house. “నీ పితృకుటుంబం” naturally conveys the wider paternal household/clan meant by בֵּית אָבִיךָ. Keeping “నీతోపాటు” directly with that group also improves readability.
  terminology: “యాహ్వే,” “పరిశుద్ధస్థలం,” “దోషం,” and “యాజకత్వం” are appropriate. “దోషాన్ని భరించాలి” usefully preserves the semantic breadth of עון and should remain in the main text. The footnotes correctly give the responsibility/liability alternative.
  issues:
  - severity: low
    issue: “పితృగృహం” may be read as a building rather than the paternal family/household.
    rationale: בֵּית אָבִיךָ is a kinship expression for Aaron's paternal household or clan. “పితృకుటుంబం” communicates this sense more directly in modern standard Telugu.
