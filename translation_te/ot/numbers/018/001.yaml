source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే అహరోనుతో ఇలా అన్నాడు: “నీవు, నీ కుమారులు, నీతోపాటు నీ పితృకుటుంబం పరిశుద్ధస్థలానికి సంబంధించిన దోషాన్ని భరించాలి[a]. నీవు, నీతోపాటు నీ కుమారులు మీ యాజకత్వానికి సంబంధించిన దోషాన్ని భరించాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధస్థలపు అపరాధబాధ్యతను మోయాలి.” హీబ్రూ నుడికారం పరిశుద్ధస్థలానికి సంబంధించిన అపరాధాల బాధ్యతను వహించడం అనే భావాన్నీ ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీ యాజకత్వపు అపరాధబాధ్యతను మోయాలి.” హీబ్రూ నుడికారం యాజక సేవకు సంబంధించిన అపరాధాల బాధ్యతను వహించడం అనే భావాన్నీ ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉంచింది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ తెలిపే కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵית אָבִיךָ
  choice: నీ పితృగృహం
  rationale: ఇది భౌతిక ఇంటిని మాత్రమే కాక పితృవంశ కుటుంబాన్ని సూచించే హీబ్రూ బంధుత్వ నుడికారాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אִתָּךְ
  choice: నీతోపాటు
  rationale: రెండు వాక్యభాగాల్లోని సహచర్య భావాన్నీ, మూలంలోని పునరుక్తినీ నిలుపుతుంది.
- source_word: תִּשְׂאוּ
  choice: భరించాలి
  rationale: נשא עון అనే నుడికారంలో ఉన్న దోషం, అపరాధబాధ్యత, పరిణామాన్ని మోయడం వంటి విస్తృత భావాన్ని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: עֲוֺן
  choice: దోషం
  rationale: ఈ పదానికి పాపకార్యం, అపరాధం, అపరాధబాధ్యత లేదా దాని శిక్ష అనే భావపరిధి ఉంది; 'దోషం' తెలుగులో ఈ సందర్భానికి సహజంగా ఉండి కొంత భావవిస్తృతిని నిలుపుతుంది.
- source_word: הַמִּקְדָּשׁ
  choice: పరిశుద్ధస్థలం
  rationale: దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించబడిన పవిత్ర ప్రదేశాన్ని సూచించే స్పష్టమైన, ప్రస్తుత తెలుగు పదప్రయోగం.
- source_word: כְּהֻנַּתְכֶם
  choice: మీ యాజకత్వం
  rationale: అహరోను కుమారుల యాజక పదవి, సేవ, బాధ్యతల సమష్టి భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యాజక సందర్భంలో 'దోషాన్ని భరించడం' అనే నుడికారం
  choice: '''దోషాన్ని భరించాలి'' అనే నుడికారాన్ని ఉంచి, పరిశుద్ధస్థలం లేదా యాజకత్వానికి సంబంధించిన అపరాధం, అపరాధబాధ్యత, పరిణామం అనే భావాల మధ్య ఉద్రిక్తతను నిలిపింది.'
  alternative: '''అపరాధబాధ్యత వహించాలి'' లేదా ''అపరాధాన్ని మోయాలి'''
  rationale: హీబ్రూ నుడికారం కేవలం పరిపాలనా బాధ్యతను గానీ, వ్యక్తిగత అపరాధాన్ని గానీ మాత్రమే సూచిస్తున్నదని తేల్చదు. అందువల్ల ప్రధాన పాఠ్యంలో మూల నుడికారానికి దగ్గరగా ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర వాక్యభాగాలు, 'నీతోపాటు' అనే పునరుక్తి, దోషాన్ని భరించే నుడికారంలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
