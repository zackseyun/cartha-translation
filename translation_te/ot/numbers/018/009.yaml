revisions:
- from: 'అత్యంత పవిత్రమైన వాటిలో, అగ్ని కోసం అర్పించిన వాటి నుంచి నీ కోసం ఉంచబడేది[a] ఇదే: వారి అర్పణలన్నిటిలో ప్రతి ధాన్యార్పణ, ప్రతి పాపపరిహార బలి[b], ప్రతి అపరాధపరిహార బలి[c]—వారు నాకు తిరిగి అర్పించేవన్నీ. అది నీకూ నీ కుమారులకూ అత్యంత పవిత్రమైనది.'
  to: 'అత్యంత పవిత్రమైన వాటిలో, అగ్ని నుండి నీకు చెందేది ఇదే[a]: వారి ప్రతి అర్పణ, వారి ప్రతి ధాన్యార్పణ, వారి ప్రతి పాపపరిహార బలి[b], వారి ప్రతి అపరాధపరిహార బలి[c]—వారు నాకు తిరిగి ఇచ్చేవన్నీ. అవి నీకూ నీ కుమారులకూ అత్యంత పవిత్రమైనవి.'
  rationale: The revision restores the four coordinated sacrificial expressions, keeps the disputed cultic idiom literal in the text with a qualified contextual note, and uses a coherent plural referent ('అవి') for the listed offerings. It preserves the explicit reference to Aaron's sons and the established technical sacrificial terminology.
