source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: te
  text: 'అత్యంత పవిత్రమైన వాటిలో, అగ్ని నుండి నీకు చెందేది ఇదే[a]: వారి ప్రతి అర్పణ, వారి ప్రతి ధాన్యార్పణ, వారి ప్రతి పాపపరిహార బలి[b], వారి ప్రతి అపరాధపరిహార బలి[c]—వారు నాకు తిరిగి ఇచ్చేవన్నీ. అవి నీకూ నీ కుమారులకూ అత్యంత పవిత్రమైనవి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అగ్ని నుండి.” సందర్భంలో, అగ్నికి అర్పించబడే బలులలో యాజకునికి ప్రత్యేకంగా కేటాయించిన భాగాలను ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పాపపరిహార బలి”ని “శుద్ధీకరణ బలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “అపరాధపరిహార బలి”ని “నష్టపరిహార బలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: అత్యంత పవిత్రమైన వాటిలో
  rationale: ఈ సందర్భంలో ఈ హెబ్రీ అతిశయోక్తి నిర్మాణం గర్భాలయాన్ని కాక, బలులలో అత్యున్నత పవిత్రతగల వర్గాన్ని సూచిస్తుంది.
- source_word: מִן הָאֵשׁ
  choice: అగ్ని కోసం అర్పించిన వాటి నుంచి నీ కోసం ఉంచబడేది
  rationale: అక్షరార్థంగా ‘అగ్ని నుండి.’ యాజకునికి చెందే భాగం అగ్నిపై పూర్తిగా దహించకుండా ప్రత్యేకంగా ఉంచబడుతుందనే ఆచారసంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో భద్రపరచింది.
- source_word: קָרְבָּנָם
  choice: వారి అర్పణలన్నిటిలో
  rationale: קָרְבָּן దేవుని సన్నిధికి తీసుకువచ్చే అర్పణకు సాధారణ పదం; ‘అర్పణ’ స్పష్టమైన, విస్తృతమైన తెలుగు పదం.
- source_word: מִנְחָתָם
  choice: ప్రతి ధాన్యార్పణ
  rationale: యాజక బలుల సందర్భంలో מִנְחָה సాధారణంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: חַטָּאתָם
  choice: ప్రతి పాపపరిహార బలి
  rationale: బలుల జాబితాలో ఇది పాపం లేదా శుద్ధీకరణకు సంబంధించిన బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ పాఠకునికి గుర్తించదగినది; శుద్ధీకరణ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֲשָׁמָם
  choice: ప్రతి అపరాధపరిహార బలి
  rationale: אָשָׁם అపరాధం వల్ల కలిగిన బాధ్యతతో, తరచుగా నష్టపరిహారంతో సంబంధమున్న బలి; ఈ రెండింటి భావాన్ని ‘అపరాధపరిహార బలి’ సంక్షిప్తంగా అందిస్తుంది.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: వారు నాకు తిరిగి అర్పించేవన్నీ
  rationale: שוב హిఫిల్ రూపంలోని ‘తిరిగి ఇవ్వడం/చెల్లించడం’ అనే చిత్రాన్ని ఉంచుతూ, బలుల సందర్భానికి తగిన ‘అర్పించు’ క్రియను ఉపయోగించింది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పవిత్రమైనది
  rationale: ఇది అర్పణ భాగాల ఆచారపరమైన స్థితిని తెలిపే అతిశయోక్తి పదబంధం; స్థలాన్ని సూచించే ‘అతి పరిశుద్ధ స్థలం’గా అనువదించలేదు.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: నీకూ నీ కుమారులకూ
  rationale: హెబ్రీ పాఠం అహరోనును, అతని పురుష యాజక వారసులను ప్రత్యేకంగా ఉద్దేశిస్తుంది; అందువల్ల లింగసూచనను నిలిపింది.
theological_decisions:
- issue: బలుల పవిత్రతను సూచించే పదాన్ని గర్భాలయానికి సంబంధించిన స్థలపదంగా అర్థం చేసుకోవడం
  choice: అత్యంత పవిత్రమైన వాటిలో / అత్యంత పవిత్రమైనది
  alternative: అతి పరిశుద్ధ స్థలానికి చెందినది / పరిశుద్ధాతిపరిశుద్ధమైనది
  rationale: ఈ వాక్యంలో పదబంధం బలి భాగాల ఆచారపరమైన వర్గాన్ని సూచిస్తుంది, పరిశుద్ధ మందిరంలోని అంతర్గదిని కాదు.
- issue: అహరోను వారసుల లింగసూచన
  choice: నీ కుమారులకూ
  alternative: నీ పిల్లలకూ / నీ సంతానానికీ
  rationale: ఇక్కడ యాజక సేవకు నియమించబడిన అహరోను కుమారులే ప్రత్యేకంగా ఉద్దేశించబడ్డారు; సాధారణీకరించడం మూలపాఠంలోని నిర్దిష్టతను తగ్గిస్తుంది.
- issue: חַטָּאת బలి యొక్క పాపం–శుద్ధీకరణ భావాలు
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: సంప్రదాయంగా సులభంగా గుర్తించగల పదాన్ని ప్రధాన పాఠంలో ఉంచి, ఆచారపరమైన శుద్ధీకరణ భావాన్ని పాదసూచికలో భద్రపరిచింది.
- issue: אָשָׁם బలి యొక్క అపరాధం–నష్టపరిహారం భావాలు
  choice: అపరాధపరిహార బలి
  alternative: నష్టపరిహార బలి
  rationale: మూలపదంలోని అపరాధబాధ్యతను ప్రధాన పాఠంలో నిలిపి, దాని పరిహారాత్మక కోణాన్ని కూడా ‘పరిహార’ ద్వారా సూచించింది; మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. బలుల సాంకేతిక పదాలకు స్థిరమైన సమాసాలను వాడి, మూలంలోని జాబితా నిర్మాణాన్ని దీర్ఘ డ్యాష్‌తో స్పష్టంచేసింది. ‘నీవు/నీ’ రూపాలు ఏకవచన సంబోధనను నిలుపుతాయి.
