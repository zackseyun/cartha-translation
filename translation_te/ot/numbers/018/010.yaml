source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: te
  text: అతి పరిశుద్ధమైన స్థలంలో[a] దాన్ని నీవు తినాలి; మగవారందరూ దాన్ని తినవచ్చు. అది నీకు పరిశుద్ధమైనదిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “పరిశుద్ధమైన వాటిలో అత్యంత పరిశుద్ధమైనదానిలో.” ఇక్కడ ఈ పదబంధం దాన్ని తినడానికి నియమించబడిన అతి పరిశుద్ధమైన ప్రదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధమైన స్థలంలో
  rationale: בְּ అనే స్థానార్థక ప్రయోగాన్ని నిలుపుతూ, హెబ్రీ సర్వోత్తమార్థక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ఇది కేవలం గర్భాలయంలోనే తినాలని తప్పుగా సూచించకుండా, నియమించబడిన అత్యంత పరిశుద్ధ ప్రదేశాన్ని తెలియజేస్తుంది.
- source_word: תֹּאכֲלֶנּוּ
  choice: దాన్ని నీవు తినాలి
  rationale: 3వ పురుష ఏకవచన కర్మప్రత్యయంతో కూడిన 2వ పురుష పుంలింగ ఏకవచన క్రియారూపాన్ని, అహరోనును ప్రతినిధిగా ఉద్దేశించిన విధినిర్దేశంగా నిలుపుతుంది.
- source_word: כָּל זָכָר
  choice: మగవారందరూ
  rationale: యాజక కుటుంబంలో లింగపరమైన అర్హతను హెబ్రీ పదబంధం స్పష్టంగా పరిమితం చేస్తుంది; ‘మగవారు’ దానిని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: יֹאכַל אֹתוֹ
  choice: దాన్ని తినవచ్చు
  rationale: ఇక్కడి అసంపూర్ణ క్రియారూపం అర్హులైన మగవారికి అనుమతిని తెలియజేస్తుంది; ‘తినవచ్చు’ ఆ అధికారార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: అది నీకు పరిశుద్ధమైనదిగా ఉండాలి
  rationale: కֹדֶשׁ పదంలోని ఆరాధనా సంబంధమైన పరిశుద్ధ స్థితిని నిలుపుతూ, అహరోనుతో దాని సంబంధాన్ని ఏకవచన ‘నీకు’ ద్వారా కాపాడుతుంది.
theological_decisions:
- issue: యాజక సంబంధమైన ఆదేశం ఎవరిని ఉద్దేశిస్తుంది, దాని పరిధి ఏమిటి
  choice: ఏకవచనంలో అహరోనును యాజకత్వ ప్రతినిధిగా ఉద్దేశించి, తినే అనుమతిని అర్హులైన మగవారందరికీ విస్తరించినట్లు అనువదించబడింది.
  alternative: ఏకవచన ఆదేశం అహరోనుకు మాత్రమే వ్యక్తిగతంగా వర్తిస్తుందని చదవవచ్చు.
  rationale: సమీప సందర్భం అహరోనుకు, అతని కుమారులకు ఇవ్వబడిన యాజక భాగాల గురించి చెబుతుంది. మొదటి వాక్యంలో ఏకవచన ‘నీవు’ను నిలిపి, తరువాతి వాక్యంలో విస్తృత యాజక అర్హతను స్పష్టం చేయడం మూలపాఠంలోని రూపాన్నీ సందర్భాన్నీ గౌరవిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘పరిశుద్ధ’ అనే ప్రధాన ఆరాధనా పదాన్ని రెండు చోట్ల స్థిరంగా నిలిపాం; ఏకవచన సంబోధనను, లింగపరమైన పరిమితిని స్పష్టంగా ఉంచాం.
