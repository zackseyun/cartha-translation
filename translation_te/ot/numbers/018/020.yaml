id: NUM.18.20
reference: Numbers 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: te
  text: 'యాహ్వే అహరోనుతో ఇలా అన్నాడు: “వారి దేశంలో నీకు వారసత్వం లభించదు; వారి మధ్య నీకు ఎలాంటి భాగమూ ఉండదు. ఇశ్రాయేలు కుమారుల మధ్య నేనే నీ భాగం, నీ వారసత్వం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగులో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపం; బిరుదుతో భర్తీ చేయకుండా హీబ్రూ దైవనామాన్ని వ్యక్తినామంగానే నిలుపుతుంది.
- source_word: בְּאַרְצָם
  choice: వారి దేశంలో
  rationale: ఇశ్రాయేలీయులకు కేటాయించబడిన భూభాగాన్ని సూచిస్తుంది; వారసత్వ సందర్భంలో ‘దేశం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: תִנְחָל
  choice: నీకు వారసత్వం లభించదు
  rationale: నחל క్రియలోని వారసత్వాన్ని పొందడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֵלֶק
  choice: భాగం
  rationale: కేటాయించబడిన వాటా అనే అర్థాన్ని ఇస్తుంది; తరువాతి ‘నేనే నీ భాగం’ అనే ప్రకటనతో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: בְּתוֹכָם
  choice: వారి మధ్య
  rationale: ప్రజల సమూహంలో అహరోనుకు భూవాటా ఉండదనే సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲנִי חֶלְקְךָ
  choice: నేనే నీ భాగం
  rationale: హీబ్రూ వాక్యంలోని బలమైన దైవ స్వీయప్రకటనను, ముందున్న חֵלֶקతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది.
- source_word: נַחֲלָתְךָ
  choice: నీ వారసత్వం
  rationale: భూస్వాస్థ్యంతో కూడిన న్యాయపరమైన, నిబంధనాపరమైన భావాన్ని కాపాడుతుంది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్య
  rationale: హీబ్రూ రూపంలోని కుటుంబ-నిబంధనాత్మక చిత్రాన్ని నిలుపుతూ, స్థిరమైన తెలుగు బైబిలు పదబంధాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నిబంధనానామం నేరుగా ఉంది; అందువల్ల దాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా వ్యక్తినామ రూపంలో అందించబడింది.
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు / ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ కుటుంబపదాన్ని, దాని నిబంధనాత్మక వంశసంబంధ స్వరాన్ని నిలుపుతుంది; సందర్భంలో ఇది సమస్త ఇశ్రాయేలు ప్రజలను సమూహంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘భాగం—వారసత్వం’ అనే మూలపాఠంలోని పునరుక్త వారసత్వ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
