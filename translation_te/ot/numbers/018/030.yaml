- from: 'నీవు వారికి ఇలా చెప్పాలి: ‘మీరు దానిలోని శ్రేష్ఠమైన భాగాన్ని[a] ప్రతిష్ఠించినప్పుడు, అది లేవీయులకు కళ్లం దిగుబడిలాగా, ద్రాక్షగానుగ దిగుబడిలాగా పరిగణించబడుతుంది.’'
