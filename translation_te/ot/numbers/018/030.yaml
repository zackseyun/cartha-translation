id: NUM.18.30
reference: Numbers 18:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: te
  text: 'నీవు వారికి ఇలా చెప్పాలి: ‘మీరు దానిలోనుండి దాని శ్రేష్ఠమైన భాగాన్ని[a] వేరుచేసి అర్పించినప్పుడు, అది లేవీయులకు కళ్లం దిగుబడిగా, ద్రాక్ష గానుగ దిగుబడిగా పరిగణించబడుతుంది.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘దాని కొవ్వు’; ఇక్కడ ఈ మాట పంటలోని అత్యుత్తమమైన లేదా శ్రేష్ఠమైన భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: నీవు వారికి ఇలా చెప్పాలి
  rationale: మోషేకు ఇవ్వబడిన ప్రత్యక్ష ఆదేశంలోని రెండవ పురుష ఏకవచన రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בַּהֲרִימְכֶם
  choice: మీరు ... ప్రతిష్ఠించినప్పుడు
  rationale: רום హిఫీల్ రూపం అర్పణగా వేరుచేసి సమర్పించడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించు’ అనేది కేవలం పైకెత్తడం కంటే ఈ అర్పణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֶלְבּוֹ
  choice: దానిలోని శ్రేష్ఠమైన భాగాన్ని
  rationale: అక్షరార్థంగా ‘దాని కొవ్వు’; ధాన్యాదుల సందర్భంలో అత్యుత్తమమైన లేదా సమృద్ధిగల భాగాన్ని సూచించే నుడికారార్థాన్ని ప్రధాన పాఠ్యంలో అందిస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలోని
  rationale: దశమభాగం నుండి తీసే శ్రేష్ఠ భాగాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంతో సూచిస్తుంది.
- source_word: וְנֶחְשַׁב
  choice: పరిగణించబడుతుంది
  rationale: నిఫల్ కర్మణి రూపాన్ని, లెక్కింపు లేదా న్యాయపరంగా ఒక విధంగా గుర్తించబడే భావాన్ని నిలుపుతుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవీయుల సంబంధంగా ఆ అర్పణ ఎలా పరిగణించబడుతుందో తెలిపే దత్తి సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: కళ్లం దిగుబడిలాగా
  rationale: תבואה అనే ‘దిగుబడి/పంట’ భావాన్నీ, גֹּרֶן అనే నూర్పిడి కళ్లం వ్యవసాయ చిత్రాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: ద్రాక్షగానుగ దిగుబడిలాగా
  rationale: יֶקֶב ద్రాక్షను తొక్కి రసం తీసే గానుగ లేదా తొట్టిని సూచిస్తుంది; సమాంతర వ్యవసాయ నిర్మాణాన్ని నిలుపుతుంది.
