translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞార్థక బలం, అర్పణ సందర్భం, వ్యవసాయ సమాంతరత నిలుపబడ్డాయి.
