source:
  edition: WLC
  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు ఇకమీదట సమాగమ గుడారం దగ్గరికి రాకూడదు; అలా వస్తే వారు పాపాన్ని మోసి చనిపోతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దోషానికి బాధ్యులవుతారు.” హీబ్రూ మూలంలో అక్షరార్థంగా “పాపాన్ని మోసి” అని ఉంది; ఇది తప్పుకు సంబంధించిన బాధ్యతను లేదా దాని పరిణామాన్ని భరించడాన్ని సూచించే యాజకసంబంధమైన/న్యాయసంబంధమైన పదప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: దగ్గరికి రాకూడదు
  rationale: קרב అంటే ‘దగ్గరికి రావడం/సమీపించడం.’ నిషేధార్థక సందర్భంలో ‘దగ్గరికి రాకూడదు’ సహజమైన ఆధునిక తెలుగు; పవిత్ర స్థలాన్ని సమీపించే ఆరాధనా భావాన్ని నిలుపుతుంది.
- source_word: עוֹד
  choice: ఇకమీదట
  rationale: לֹא తో కలిసి עוֹד ‘ఇకపై కాదు/ఇకమీదట కాదు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో నిషేధక క్రియతో ‘ఇకమీదట’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపాన్ని లింగపరంగా యథాతథంగా ప్రతిబింబించే అనువాదం; ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచించినప్పటికీ మూలపాఠంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదబంధం; ‘గుడారం’ మూలంలోని אֹהֶל ను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: לָשֵׂאת חֵטְא
  choice: పాపాన్ని మోసి
  rationale: మూలంలోని ‘పాపాన్ని మోయడం’ అనే యాజకసంబంధమైన/న్యాయసంబంధమైన రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది; దోషబాధ్యతను భరించడం అనే భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: לָמוּת
  choice: చనిపోతారు
  rationale: అనధికారికంగా సమీపించడం వల్ల కలిగే ప్రాణాంతక పరిణామాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. హీబ్రూలోని ఉద్దేశం/పర్యవసానం సంబంధాన్ని ‘అలా వస్తే’ అనే నిర్మాణం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: పవిత్ర స్థలానికి అనధికారికంగా సమీపించడం వల్ల కలిగే దోషబాధ్యతను ఎంతవరకు స్పష్టీకరించాలి
  choice: ‘వారు పాపాన్ని మోసి చనిపోతారు’ అనే హీబ్రూ న్యాయ-యాజక పదప్రయోగాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘వారు దోషానికి బాధ్యులై చనిపోతారు’
  rationale: తక్షణ సందర్భం ప్రకారం లేవీయులకు/యాజకులకు అప్పగించిన పవిత్ర సేవా పరిధిని సాధారణ ఇశ్రాయేలీయులు అతిక్రమించకూడదు. అయినా మూలపాఠం ‘అనధికారికంగా’ అని ప్రత్యక్షంగా చెప్పదు; కాబట్టి దానిని ప్రధాన పాఠంలో చేర్చకుండా, ‘పాపాన్ని మోయడం’ అనే సంక్షిప్తమైన మరియు ధార్మిక ఉద్రిక్తతగల వ్యక్తీకరణను నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇశ్రాయేలు కుమారులు’ మరియు ‘పాపాన్ని మోసి’ అనే మూలరూపాలకు దగ్గరైన పదబంధాలను ఉద్దేశపూర్వకంగా నిలిపి, అర్థస్పష్టత కోసం వాక్య సంబంధాన్ని ‘అలా వస్తే’తో వ్యక్తం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
