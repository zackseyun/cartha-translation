id: NUM.18.16
reference: Numbers 18:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: te
  text: విమోచించవలసిన వ్యక్తిని ఒక నెల వయసు నుంచీ, నీ నిర్ణయించిన విలువ ప్రకారం, పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం ఐదు షెకెలుల వెండితో విమోచించాలి; ఆ షెకెలు[a] ఇరవై గేరాలకు సమానం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అది ఇరవై గేరాలు.” సందర్భంలో “అది” అనేది ప్రమాణ తూకమైన పరిశుద్ధ స్థలపు షెకెలును సూచిస్తుంది.
    reason: హెబ్రీ సర్వనామానికి ఉన్న సందర్భానుసార సూచనను స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: విమోచించవలసినవాణ్ణి
  rationale: పదరూపం వాక్యనిర్మాణపరంగా క్లిష్టమైనదైనా, సందర్భంలో విమోచనకు లోబడే మొదటి సంతానాన్ని సూచిస్తుంది. హెబ్రీలోని ఏకవచన, సాధారణ న్యాయనియమ భావాన్ని తెలుగులో సహజంగా నిలిపింది.
- source_word: מִבֶּן חֹדֶשׁ
  choice: ఒక నెల వయసు మొదలుకొని
  rationale: విమోచన చేయవలసిన కనిష్ఠ వయస్సు ఒక నెల అని తెలిపే హెబ్రీ ప్రయోగాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּפְדֶּה
  choice: విమోచించాలి
  rationale: న్యాయపరమైన ఆదేశంలో ఉన్న రెండవ పురుష ఏకవచన క్రియ యొక్క విధ్యర్థక బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֶרְכְּךָ
  choice: నీ అంచనా ప్రకారం
  rationale: యాజకునికి సంబోధించిన రెండవ పురుష ప్రత్యయాన్ని, న్యాయపరమైన విలువ నిర్ణయ భావాన్ని కాపాడుతుంది.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: ఐదు షెకెలుల వెండిని
  rationale: వెండి పరిమాణాన్ని తెలిపే హెబ్రీ ద్రవ్య-తూక ప్రయోగాన్ని తెలుగులో సులభంగా అర్థమయ్యేలా అందిస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణంతో
  rationale: ఇది విలువను కొలిచే ప్రామాణిక తూకమని స్పష్టం చేస్తూ, ‘పరిశుద్ధ స్థలం’తో దాని సంబంధాన్ని నిలుపుతుంది.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: ఆ షెకెలు ఇరవై గేరాలకు సమానం
  rationale: హెబ్రీ సర్వనామం సూచించే ప్రమాణ షెకెలును తెలుగులో స్పష్టంగా పేర్కొని, ఇరవై గేరాల తూక సమానత్వాన్ని తెలియజేస్తుంది.
