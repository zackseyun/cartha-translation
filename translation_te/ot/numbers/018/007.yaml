revisions:
- from: అయితే నీవు, నీతోపాటు నీ కుమారులు, బలిపీఠానికి సంబంధించిన ప్రతి విషయంలోనూ, తెర లోపల ఉన్న వాటి విషయంలోనూ మీ యాజకత్వ బాధ్యతను కాపాడాలి; మీరు సేవ చేయాలి. మీ యాజకత్వాన్ని సేవ అనే బహుమానంగా నేను మీకు ఇస్తున్నాను.[a] అధికారంలేని వ్యక్తి ఎవరైనా దగ్గరకు వస్తే అతనికి మరణశిక్ష విధించాలి.[b]
  to: అయితే నీవు, నీతో ఉన్న నీ కుమారులు బలిపీఠానికి సంబంధించిన ప్రతి విషయంలోనూ, తెర లోపల ఉన్న వాటి విషయంలోనూ మీ యాజకత్వ బాధ్యతను కాపాడుకోవాలి; మీరు సేవ చేయాలి. మీ యాజకత్వాన్ని బహుమానమైన సేవగా నేను మీకు ఇస్తున్నాను.[a] సమీపించే అధికారంలేని వ్యక్తికి మరణశిక్ష విధించాలి.[b]
  rationale: The revision resolves the singular/plural shift, improves the Telugu flow of the veil clause, and renders the gift-service construction more faithfully while explicitly preserving its syntactic ambiguity in the anchored footnote. The final legal clause remains impersonal and reflects the passive legal force of the Hebrew.
