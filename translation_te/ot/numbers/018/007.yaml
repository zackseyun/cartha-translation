source:
  edition: WLC
  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: te
  text: అయితే నీవు, నీతో ఉన్న నీ కుమారులు బలిపీఠానికి సంబంధించిన ప్రతి విషయంలోనూ, తెర లోపల ఉన్న వాటి విషయంలోనూ మీ యాజకత్వ బాధ్యతను కాపాడుకోవాలి; మీరు సేవ చేయాలి. మీ యాజకత్వాన్ని బహుమానమైన సేవగా నేను మీకు ఇస్తున్నాను.[a] సమీపించే అధికారంలేని వ్యక్తికి మరణశిక్ష విధించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ యాజకత్వాన్ని సేవకు బహుమానంగా నేను మీకు ఇస్తున్నాను” లేదా “బహుమానంగా ఇచ్చిన సేవగా.” హీబ్రూ పదబంధం సేవ బహుమానమా, లేక యాజకత్వం సేవ కోసం ఇచ్చిన బహుమానమా అనే రెండు విధాలుగా అన్వయించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠంలో “బయటి వ్యక్తి.” ఇక్కడ ఇది పరదేశిని ప్రత్యేకంగా సూచించదు; యాజక సేవ చేయడానికి అధికారం లేని ఎవరినైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: బాధ్యతను కాపాడాలి
  rationale: ఈ సందర్భంలో క్రియ యాజక బాధ్యతను జాగ్రత్తగా నిర్వహించడం, దానిపై కాపలా ఉంచడం అనే భావాలను కలిగి ఉంది.
- source_word: כְּהֻנַּתְכֶם
  choice: మీ యాజకత్వ బాధ్యత
  rationale: యాజకుల హోదాతోపాటు వారికి అప్పగించిన విధిని కూడా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: బలిపీఠానికి సంబంధించిన ప్రతి విషయంలోనూ
  rationale: דבר అనే విస్తృత పదాన్ని ప్రత్యేక ఆచారాలకు పరిమితం చేయకుండా, బలిపీఠానికి సంబంధించిన సమస్త విషయాలుగా వ్యక్తం చేస్తుంది.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: తెర లోపల ఉన్న వాటి విషయంలోనూ
  rationale: పరిశుద్ధ స్థలంలోని తెరకు అవతల ఉన్న పరిధిని సూచించే మూలపాఠపు స్థలార్థాన్ని నిలుపుతుంది.
- source_word: וַעֲבַדְתֶּם
  choice: మీరు సేవ చేయాలి
  rationale: ఆరాధన సంబంధమైన యాజక సేవను సూచిస్తుంది; తరువాతి సంక్షిప్త పదబంధాన్ని ముందుగానే అతివ్యాఖ్యానించదు.
- source_word: עֲבֹדַת מַתָּנָה אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: మీ యాజకత్వాన్ని సేవ అనే బహుమానంగా నేను మీకు ఇస్తున్నాను
  rationale: సేవ, బహుమానం, యాజకత్వం మధ్య ఉన్న సంక్షిప్త హీబ్రూ నిర్మాణాన్ని చదవదగిన తెలుగులో అందిస్తూ దాని వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
- source_word: הַזָּר
  choice: అధికారంలేని వ్యక్తి
  rationale: ఇక్కడ జాతిపరమైన పరదేశిని కాక, యాజక సేవ చేయడానికి అనుమతి లేని వ్యక్తిని సూచిస్తుంది.
- source_word: הַקָּרֵב
  choice: దగ్గరకు వస్తే
  rationale: నిషిద్ధ పవిత్ర పరిధిని లేదా సేవను సమీపించడమనే భౌతిక, ఆరాధన సంబంధమైన భావాలను నిలుపుతుంది.
- source_word: יוּמָת
  choice: మరణశిక్ష విధించాలి
  rationale: హోఫల్ రూపంలోని కారణార్థక నిష్క్రియను, న్యాయపరమైన మరణదండన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: עֲבֹדַת מַתָּנָה యొక్క అన్వయం
  choice: యాజకత్వం సేవ అనే బహుమానంగా ఇవ్వబడింది
  alternative: బహుమానంగా ఇచ్చిన సేవ
  rationale: యాజకత్వం స్వయంగా చేపట్టేది కాక దేవుడు అనుగ్రహించిన సేవ అని ప్రధాన పాఠం తెలియజేస్తుంది; అయితే సంక్షిప్త హీబ్రూ నిర్మాణానికి మరో సహజ అన్వయం కూడా సాధ్యమని పాదసూచిక గుర్తిస్తుంది.
- issue: זָר అనే పదం సూచించే వర్గం
  choice: యాజక సేవకు అధికారంలేని వ్యక్తి
  alternative: బయటి వ్యక్తి; పరదేశి
  rationale: ఈ యాజక ధర్మశాస్త్ర సందర్భంలో నిషేధం జాతి ఆధారితం కాదు; నియమిత యాజక అధికారానికి వెలుపల ఉన్నవారిని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞాత్మక భావానికి “చేయాలి” రూపాన్ని వాడాం. “తెర” అనే పదం గుడారంలోని అంతర్గత విభజన తెరను సూచిస్తుంది. మూలంలోని సేవ-బహుమానం నిర్మాణపు నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
