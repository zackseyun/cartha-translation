id: NUM.18.28
reference: Numbers 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: te
  text: ఈ విధంగా, ఇశ్రాయేలు కుమారుల[a] నుండి మీరు స్వీకరించే మీ దశమభాగాలన్నిటిలోనుండి మీరు కూడా యెహోవాకు ప్రత్యేకించి అర్పించే భాగాన్ని సమర్పించాలి. దానిలోనుండి యెహోవాకు ప్రత్యేకించి అర్పించే భాగాన్ని యాజకుడైన అహరోనుకు మీరు ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయుల.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందటి ఆజ్ఞకు అనుగుణంగా లేవీయులు కూడా చేయవలసిన కార్యాన్ని సూచిస్తుంది.
- source_word: תָּרִימוּ
  choice: సమర్పించాలి
  rationale: רוּם హిఫిల్ రూపం תְּרוּמָהతో కలిసి, ఒక భాగాన్ని ప్రత్యేకించి సమర్పించే ఆచార సంబంధమైన చర్యను సూచిస్తుంది.
- source_word: גַם אַתֶּם
  choice: మీరు కూడా
  rationale: ఇశ్రాయేలీయులు ఇచ్చినట్లే లేవీయులు కూడా ఒక భాగాన్ని సమర్పించాలనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: תְּרוּמַת יְהוָה
  choice: యెహోవాకు ప్రతిష్ఠిత భాగం
  rationale: תְּרוּמָה అనేది ప్రత్యేకించి అర్పించిన భాగాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠిత భాగం’ దాని భాగార్థాన్నీ పవిత్ర ప్రయోజనాన్నీ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సహజమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: మీ దశమభాగాలన్నిటిలోనుండి
  rationale: బహువచన రూపాన్నీ, వాటిలోనుండి ఒక భాగం తీసే భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల నుండి మీరు స్వీకరించే
  rationale: ఈ పరిపాలనా-ఆరాధనా సందర్భంలో לקחకు ‘స్వీకరించే’ సహజంగా సరిపోతుంది; בְּנֵי יִשְׂרָאֵל యొక్క పదశః రూపం ప్రధాన పాఠ్యంలో నిలుపబడింది.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: దానిలోనుండి ... ఇవ్వాలి
  rationale: స్వీకరించిన దశమభాగం నుండి కొంత భాగాన్ని ఇవ్వాలనే విభాగార్థాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోనుకు
  rationale: לְను గ్రహీతను సూచించే ‘కు’గా అనువదించి, హోదాను సహజ తెలుగు విశేషణ నిర్మాణంలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా నిలిపి, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ అనే ఒడంబడిక సంబంధమైన పుంలింగ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: תְּרוּמַת יְהוָהలోని సంబంధ భావం
  choice: యెహోవాకు ప్రతిష్ఠిత భాగం
  alternative: యెహోవా ప్రతిష్ఠిత భాగం
  rationale: ఈ భాగం యెహోవాకు అంకితమైనదనే గమ్యార్థాన్ని తెలుగులో స్పష్టం చేస్తూ, అది అహరోనుకు ఇవ్వబడుతుందనే వాక్యంలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడింది. ఆచార సంబంధమైన תְּרוּמָהకు అతిగా సాంకేతికమైన పదం కాకుండా ‘ప్రతిష్ఠిత భాగం’ను ఎంచుకుంది; వాక్యంలోని పునరుక్తిని మూలానికి అనుగుణంగా నిలిపింది.
