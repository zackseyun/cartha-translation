- from: అలాగే, ఇశ్రాయేలు కుమారుల[a] నుండి మీరు స్వీకరించే మీ దశమభాగాలన్నిటిలోనుండి మీరు కూడా యెహోవాకు ప్రతిష్ఠిత భాగాన్ని సమర్పించాలి. దానిలోనుండి యెహోవాకు ప్రతిష్ఠిత భాగాన్ని యాజకుడైన అహరోనుకు ఇవ్వాలి.
