  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: te
  text: “మరియు నేను—ఇదిగో—ఇశ్రాయేలు కుమారుల[a] మధ్యనుండి మీ సహోదరులైన లేవీయులను తీసుకున్నాను; వారు మీకు బహుమానంగా, యహ్వేకు ఇవ్వబడినవారిగా, సమావేశ గుడారపు సేవ చేయడానికి నియమించబడ్డారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయుల మధ్యనుండి.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల మధ్యనుండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: ఇదిగో, నేనే
  rationale: సందర్భంతో ఉన్న అనుసంధానాన్ని సహజమైన తెలుగులో ఉంచుతూ, మొదటి పురుష సర్వనామంలోని నొక్కిచెప్పడాన్ని మరియు הִנֵּה లోని ప్రకటనాత్మక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: לָקַחְתִּי
  choice: తీసుకున్నాను
  rationale: לקח అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ‘ఎన్నుకున్నాను’ అని అనువదిస్తే మూలంలో లేని ఎంపిక భావం మరింత స్పష్టంగా చేరుతుంది.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: మీ సహోదరులైన లేవీయులను
  rationale: గోత్ర సంబంధమైన బంధుత్వాన్ని సూచించే ‘సహోదరులు’ అనే కుటుంబ భాషను నిలుపుతూ, తెలుగులో లేవీయులతో దాని సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్య నుండి
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతుంది; సాధారణ తెలుగు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: מַתָּנָה נְתֻנִים
  choice: ఇవ్వబడిన వారిని మీకు బహుమానంగా ఇచ్చాను
  rationale: ‘బహుమానం/ఇవ్వడం’ అనే హెబ్రీ పదపునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో వాక్య సంబంధాన్ని స్పష్టంగా చేస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: సేవను నిర్వహించడానికి
  rationale: క్రియ-నామ పునరుక్తి తెలుగులో అసహజంగా మారకుండా, ఆరాధనా సంబంధమైన నియమిత సేవ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత స్థలాన్ని సూచించే పదబంధానికి స్పష్టమైన, ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక కుటుంబ భాష
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని రూపకల్పనను ప్రధాన పాఠంలో నిలుపుతూ, అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుందనే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో అందిస్తుంది.
- issue: లేవీయులు అహరోనీయులకు బహుమానమా, యహ్వేకు ఇవ్వబడినవారా అనే ద్వంద్వ సంబంధం
  choice: యహ్వేకు ఇవ్వబడిన వారిని మీకు బహుమానంగా ఇచ్చాను
  alternative: వారిని మీకు బహుమానంగా, యహ్వేకు ఇవ్వబడినవారిగా ఇచ్చాను
  rationale: లేవీయులు యహ్వేకు అంకితమైనవారే అయినప్పటికీ అహరోను మరియు అతని కుమారులకు సేవార్థం బహుమానంగా అప్పగించబడ్డారనే మూలపాఠంలోని రెండు సంబంధాలను రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఇదిగో, నేనే’ అనే రూపం దైవ ప్రకటనలోని ఉద్ఘాటనను ఉంచుతుంది; ‘సమావేశ గుడారం’ పారదర్శకమైన పదప్రయోగంగా ఎంపికైంది.
