id: NUM.18.32
reference: Numbers 18:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: te
  text: దానిలోని శ్రేష్ఠమైన భాగాన్ని దానిలోనుండి ఎత్తి అర్పించినప్పుడు[a], దానివల్ల మీరు దోషభారం మోయరు. ఇశ్రాయేలు కుమారుల పవిత్రమైన వాటిని[b] మీరు అపవిత్రపరచకూడదు; అప్పుడు మీరు చనిపోరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శ్రేష్ఠమైన భాగం’కు అక్షరార్థం ‘దాని కొవ్వు’; అర్పణల సందర్భంలో ఈ హీబ్రూ పదం తరచుగా అత్యంత మేలైన లేదా ఉత్తమమైన భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలను సూచించే స్థిరమైన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: మీరు పాపభారం మోయరు
  rationale: נשא ... חטא అనే పదబంధం పాపానికి సంబంధించిన దోషభారం లేదా బాధ్యతను మోయడాన్ని సూచిస్తుంది. ‘పాపభారం మోయరు’ మూలరూపకాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంది.
- source_word: עָלָיו
  choice: దాని విషయంగా
  rationale: ఇది ముందున్న దశమభాగం లేదా దాని సమర్పణ విషయాన్ని తిరిగి సూచించి, దానికి సంబంధించిన దోషబాధ్యతను తెలియజేస్తుంది.
- source_word: בַּהֲרִימְכֶם
  choice: ప్రతిష్ఠార్పణగా వేరు చేసినప్పుడు
  rationale: רום హిఫీల్ రూపం పైకెత్తడం అనే మూలభావంతో పాటు దేవునికి అర్పించేందుకు భాగాన్ని ప్రత్యేకంగా వేరు చేయడాన్ని సూచిస్తుంది. సందర్భంలో కేవలం భౌతికంగా ‘పైకెత్తడం’ కంటే ఈ భావం స్పష్టమైనది.
- source_word: חֶלְבּוֹ
  choice: దానిలోని శ్రేష్ఠమైన భాగం
  rationale: חלב అక్షరార్థంగా ‘కొవ్వు’; అయితే కానుకల సందర్భంలో అత్యుత్తమమైన లేదా మేలైన భాగాన్ని సూచించే నుడికారంగా వాడబడుతుంది. ఇక్కడ పంటల దశమభాగం సందర్భం కావడంతో ‘శ్రేష్ఠమైన భాగం’ అపార్థాన్ని నివారిస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుంచి
  rationale: శ్రేష్ఠమైన భాగం ఏ దశమభాగం నుంచి వేరు చేయబడుతుందో నేరుగా సూచిస్తుంది.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ప్రతిష్ఠితమైన వాటిని
  rationale: קָדְשֵׁי విస్తృతంగా పవిత్రపరచబడిన వస్తువులు లేదా అర్పణలను సూచిస్తుంది. ‘ప్రతిష్ఠితమైనవి’ వాటిని దేవునికోసం ప్రత్యేకపరచిన భావాన్ని నిలుపుతుంది; בני ישראל మూలంలోని స్థిర జాతినామాన్ని ‘ఇశ్రాయేలు కుమారులు’గా ఉంచాం.
- source_word: תְחַלְּלוּ
  choice: అపవిత్రపరచకూడదు
  rationale: חלל పియేల్ రూపం పవిత్రమైనదాన్ని అపవిత్రం చేయడం లేదా సామాన్యమైనదిగా చూడడాన్ని సూచిస్తుంది. ‘అపవిత్రపరచకూడదు’ పవిత్రత–అపవిత్రత వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְלֹא תָמֻתוּ
  choice: అప్పుడు మీరు చనిపోరు
  rationale: హీబ్రూలో ఇది వావ్‌తో అనుసంధానించిన నిషేధ/ఫలిత వాక్యం. ‘అప్పుడు’ ఆజ్ఞను పాటించడానికీ మరణం తప్పడానికీ ఉన్న సందర్భ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; స్పష్టమైన ఉద్దేశార్థాన్ని బలవంతంగా చేర్చదు.
theological_decisions:
- issue: בני ישראל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని, సంప్రదాయ జాతినామపు నిర్మాణాన్ని నిలుపుతుంది. పాదసూచిక ద్వారా ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే స్థిర ప్రయోగమని స్పష్టం చేశాం.
- issue: అర్పణ సందర్భంలో חלב భావం
  choice: శ్రేష్ఠమైన భాగం
  alternative: కొవ్వు / అత్యుత్తమ భాగం
  rationale: ఇక్కడ జంతు కొవ్వు ప్రత్యేకంగా ఉద్దేశించబడలేదు; దశమభాగంలోని మేలైన భాగాన్ని దేవునికి వేరు చేయడం ప్రధాన భావం. అయినా అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: చివరి వాక్యంలోని సంబంధం
  choice: అప్పుడు మీరు చనిపోరు
  alternative: మరియు మీరు చనిపోరు / మీరు చనిపోకుండా ఉండేందుకు
  rationale: וְלֹא תָמֻתוּ లోని సమన్వయాన్ని మరియు సందర్భానుసార ఫలితభావాన్ని రెండింటినీ తెలుగులో సహజంగా ఉంచుతుంది. మూలంలో వ్యాకరణపరంగా స్పష్టంగా లేని ఉద్దేశార్థాన్ని ఖచ్చితంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆచార సంబంధ పదాలకు అతిగా సంస్కృతీకరించిన భాషను నివారిస్తూ, ‘ప్రతిష్ఠార్పణ’, ‘ప్రతిష్ఠితమైనవి’, ‘అపవిత్రపరచడం’ వంటి సందర్భోచిత పదాలను ఉపయోగించాం. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
