  to: దానిలోని శ్రేష్ఠమైన భాగాన్ని దానిలోనుండి ఎత్తి అర్పించినప్పుడు[a], దానివల్ల మీరు దోషభారం మోయరు. ఇశ్రాయేలు కుమారుల పవిత్రమైన వాటిని[b] మీరు అపవిత్రపరచకూడదు; అప్పుడు మీరు చనిపోరు.
  rationale: మూలంలోని అర్పణక్రియను అనవసరమైన సాంకేతిక పదం లేకుండా ‘ఎత్తి అర్పించినప్పుడు’గా అనువదించాం. కారణార్థక పదబంధాన్ని సహజమైన ‘దానివల్ల’గా, మరియు పవిత్ర వస్తువుల పదాన్ని స్పష్టమైన ‘పవిత్రమైన వాటిని’గా మార్చాం. చివరి వాక్యంలోని హెచ్చరిక/ఫలిత సంబంధాన్ని ‘అప్పుడు’ ద్వారా ఉంచి, మూలంలోని సమన్వయాన్ని మించిపోయే నిర్దిష్ట ఉద్దేశార్థాన్ని చేర్చలేదు.
