source:
  edition: WLC
  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: te
  text: యాహ్వే ఇశ్రాయేలు సమాజం[a] ఎదుట కొట్టిన ఆ భూమి పశుసంపదకు అనువైన భూమి[c]; నీ సేవకులమైన మాకు పశుసంపద ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు సభ’.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం పశువులు, మందలు మొదలైన పెంపుడు జంతువులను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: ఈ దేశం
  rationale: אֶרֶץ ఇక్కడ వారు కోరుతున్న నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఈ దేశం’ సహజంగా ఆ నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: הִכָּה
  choice: దెబ్బకొట్టిన
  rationale: נכה అనే క్రియలోని ‘కొట్టడం’ అనే బలాన్ని నిలుపుతూ, యాహ్వే చేసిన సైనిక చర్యను అతిగా వివరణాత్మకంగా మార్చకుండా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: לִפְנֵי עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజం ఎదుట
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సమక్షంలో’ భావాన్నీ, עֵדָה యొక్క సమూహాత్మక భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶרֶץ מִקְנֶה
  choice: పశువుల పెంపకానికి అనువైన దేశం
  rationale: హీబ్రూ పదబంధం ఆ భూమి పశుసంపదకు తగినదని సూచిస్తుంది. ‘పశువుల దేశం’ కంటే ఈ రూపం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: నీ సేవకులమైన మాకు పశువులు ఉన్నాయి
  rationale: మోషేను ఉద్దేశించిన రెండవ పురుష ఏకవచనాన్ని, మాట్లాడేవారి వినయపూర్వక స్వీయసూచనను, పశువుల యాజమాన్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: యాహ్వే ‘దేశాన్ని కొట్టడం’ అనే రూపకం
  choice: దేశం అనే మూలపాఠ వస్తువును ఉంచి ‘దెబ్బకొట్టిన’ అని అనువదించడం
  alternative: ఆ దేశ ప్రజలను ఓడించిన / దేశాన్ని జయించిన
  rationale: మూలంలో ‘దేశం’ నేరుగా క్రియకు కర్మగా ఉంది. సందర్భం సైనిక ఓటమిని సూచించినప్పటికీ, ప్రజలను అని చేర్చడం లేదా ‘జయించాడు’ అని పూర్తిగా అర్థవివరణ చేయడం మూలంలోని ప్రయోగాన్ని సంకుచితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మోషేను ఉద్దేశించిన ఏకవచన ‘నీ’ను, మాట్లాడేవారి వినయపూర్వక ‘నీ సేవకులమైన మాకు’ రూపాన్ని నిలిపాం.
