source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: te
  text: కెనిజ్జీయుడైన యెఫున్నె కుమారుడు కాలేబు, నూను కుమారుడైన యెహోషువ తప్ప; వారు యాహ్వేను పూర్తిగా అనుసరించారు కాబట్టి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘యాహ్వే వెనుక నింపారు’; ఇది యాహ్వేను సంపూర్ణ నిబద్ధతతో అనుసరించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: తప్ప మరెవరూ
  rationale: ముందటి వాక్యంలో చెప్పిన తీర్పుకు కాలేబు, యెహోషువ మాత్రమే మినహాయింపులని తెలుగు వాక్యప్రవాహంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: కెనిజ్జీయుడైన యెఫున్నె కుమారుడు కాలేబు
  rationale: వంశ/గోత్ర సంబంధ సూచనను పేరుతో సహజంగా అనుసంధానిస్తూ, బైబిలు తెలుగు నామరూపాలను నిలుపుతుంది.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడు యెహోషువ
  rationale: వావ్ సంధిని జాబితా నిర్మాణంలో సహజంగా వ్యక్తం చేసి, తండ్రి-కొడుకు సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ ఇద్దరు ఎందుకు మినహాయించబడ్డారో తెలిపే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִלְאוּ אַחֲרֵי
  choice: సంపూర్ణంగా అనుసరించారు
  rationale: అక్షరార్థంగా ‘వెనుక నింపారు’ అనే హీబ్రూ నుడికారంలోని సంపూర్ణ విధేయత, నిబద్ధత భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన దైవనామ రూపం; మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని చతురక్షర దైవనామాన్ని వ్యక్తిగత నామంగానే ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే రూపాన్ని ఎంచుకుంది.
- issue: מִלְאוּ אַחֲרֵי నుడికారం
  choice: సంపూర్ణంగా అనుసరించారు
  alternative: హృదయపూర్వకంగా అనుసరించారు
  rationale: కాలేబు, యెహోషువల సంపూర్ణ నిబద్ధతను వ్యక్తం చేస్తుంది; భావాన్ని కేవలం అంతరంగ భావోద్వేగానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ఇది మునుపటి వాక్యంలోని ‘ప్రవేశించరు’ అనే క్రియను సందర్భానుసారంగా పూరిస్తుంది; మూల వచనంలో ఆ క్రియ ప్రత్యక్షంగా పునరుక్తం కాలేదు.
