source:
  edition: WLC
  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: te
  text: మనష్షే కుమారుడైన యాయీరు వెళ్లి వారి గ్రామాలను స్వాధీనం చేసుకొని, వాటికి హవ్వోత్‌-యాయీరు[a] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హవ్వోత్‌-యాయీరు” అంటే “యాయీరు గ్రామాలు” లేదా “యాయీరు నివాసాలు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: యాయీరు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן מְנַשֶּׁה
  choice: మనష్షే కుమారుడైన
  rationale: హీబ్రూ నిర్మాణంలోని ‘మనష్షే కుమారుడు’ అనే అక్షరార్థాన్ని నిలుపుతూ, సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగించాం; ఇది విస్తృత వంశార్థాన్ని కూడా సందర్భానుసారం నిరాకరించదు.
- source_word: הָלַךְ
  choice: వెళ్లి
  rationale: కథన క్రమంలో సాధారణ గమనాన్ని సూచించే సహజమైన తెలుగు రూపం; దిశ లేదా ఉద్దేశాన్ని అదనంగా చేర్చదు.
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకొని
  rationale: సైనిక లేదా భూభాగ సంబంధ సందర్భంలో పట్టుకోవడం/ఆక్రమించుకోవడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חַוֺּתֵיהֶם
  choice: వారి గ్రామాలను
  rationale: చిన్న, సాధారణంగా ప్రాకారంలేని నివాస సముదాయాలను సూచించే పదానికి ఆధునిక పాఠకులకు స్పష్టమైన సమానార్థకం.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: వాటికి … అని పేరు పెట్టాడు
  rationale: ఈ సందర్భంలో קרא అంటే పేరు పెట్టడం; తెలుగులో ‘వాటిని … అని పిలిచాడు’ కంటే ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: חַוֺּת יָאִיר
  choice: హవ్వోత్‌-యాయీరు
  rationale: ఇది స్థలనామంగా పనిచేస్తున్నందున ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, దాని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
