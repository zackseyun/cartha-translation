translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస క్రియలను సహజమైన తెలుగు సంయుక్త క్రియారూపాలతో అందించాం.
