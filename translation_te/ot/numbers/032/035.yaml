translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త స్థలనామాల జాబితాగా ఉంచబడింది. ఈ వచనం మునుపటి వాక్యాన్ని కొనసాగిస్తున్నందున పూర్తి క్రియను చేర్చకుండా ‘కూడా’తో అనుసంధానం చూపించబడింది.
