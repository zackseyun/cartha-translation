    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: కూడా
  rationale: וְ ఈ జాబితా మునుపటి వచనంలో మొదలైన స్థలాల వరుసను కొనసాగిస్తున్నదని తెలుగులో సహజంగా తెలియజేయడానికి ‘కూడా’ వాడబడింది. אֶת అనే ప్రత్యక్ష కర్మ సూచికకు ప్రత్యేక పదం అవసరం లేదు.
- source_word: עַטְרֹת שׁוֹפָן
  choice: అత్రోత్-షోఫాను
  rationale: ఇది సంయుక్త స్థలనామం; అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: יַעְזֵר
  choice: యాజేరు
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సులభంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
- source_word: יָגְבֳּהָה
  choice: యొగ్బెహా
  rationale: స్థలనామాన్ని హీబ్రూ వ్యంజన, స్వర నిర్మాణానికి దగ్గరగా లిప్యంతరీకరించాం.
