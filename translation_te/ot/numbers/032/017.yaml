id: NUM.32.17
reference: Numbers 32:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: te
  text: అయితే మేము ఆయుధాలు ధరించి, ఇశ్రాయేలీయుల ముందుగా[a] త్వరగా వెళ్తాం; వారిని వారి స్థలానికి చేర్చేవరకు వెళ్తాం. దేశ నివాసుల కారణంగా మా పిల్లలు[b] కోటగోడలున్న పట్టణాల్లో ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారుల ముందు’; ఇక్కడ యుద్ధంలో ఇశ్రాయేలీయుల సైన్యానికి ముందుగా వెళ్లడం భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పిల్లలు’ అనే మూలపదం చిన్నపిల్లలతోపాటు కుటుంబంలోని ఆధారపడిన వారినీ విస్తృతంగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: ఆయుధాలు ధరించి ... వెళ్తాం
  rationale: నిఫల్ రూపం ఇక్కడ మధ్యమ/ఆత్మార్థక భావంలో, యుద్ధానికి తమను తాము సిద్ధం చేసుకోవడాన్ని సూచిస్తుంది. తెలుగులో ‘ఆయుధాలు ధరించి వెళ్తాం’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: חֻשִׁים
  choice: త్వరగా
  rationale: ఈ క్రియావిశేషణం త్వరిత సిద్ధతను లేదా వేగాన్ని సూచిస్తుంది. ఆయుధధారణ భావం נֵחָלֵץ లో ఇప్పటికే ఉన్నందున పునరుక్తిని నివారిస్తూ ‘త్వరగా’ అని అనువదించాం.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల ముందుగా
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల ముందు’. సైనిక సందర్భంలో వారి సైన్యానికి ముందుగా వెళ్లడమే భావం; ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయుల ముందుగా’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַד אֲשֶׁר אִם
  choice: చేర్చేవరకు
  rationale: ఈ పదబంధం చర్య ముగిసే కాలపరిమితిని సూచించే జాతీయ ప్రయోగం; తెలుగులో ‘వరకు’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: הֲבִיאֹנֻם
  choice: వారిని ... చేర్చే
  rationale: בוא యొక్క హిఫిల్ రూపం ‘రప్పించు/తీసుకురా’ అనే కారణార్థాన్ని ఇస్తుంది. గమ్యస్థానానికి నడిపించి చేర్చే సందర్భంలో ‘చేర్చు’ సహజమైన తెలుగు.
- source_word: אֶל מְקוֹמָם
  choice: వారి స్థలానికి
  rationale: మూలంలోని విస్తృతతను అలాగే ఉంచుతుంది; అది వారికి కేటాయించబడిన నివాసస్థలాన్ని సూచించవచ్చు, కానీ పాఠ్యం దాన్ని ఇక్కడ మరింత నిర్దిష్టం చేయదు.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: మా పిల్లలు ... ఉంటారు
  rationale: טַף అనేది ప్రధానంగా చిన్నపిల్లలను, సందర్భానుసారం కుటుంబంలోని ఆధారపడిన వారిని కలిపి సూచించే సమూహపదం. ఆధునిక తెలుగులో ‘పిల్లలు’ సహజం; విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: ప్రాకారాలుగల పట్టణాల్లో
  rationale: ఈ నిర్మాణం రక్షణకై బలపరచబడిన పట్టణాలను సూచిస్తుంది. ‘ప్రాకారాలుగల పట్టణాలు’ సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన తెలుగు.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: ఈ దేశ నివాసుల నుంచి రక్షణ కోసం
  rationale: מִפְּנֵי ఇక్కడ దేశ నివాసుల వల్ల కలిగే ముప్పును సూచిస్తుంది. ప్రాకార పట్టణాల సందర్భం రక్షణ ఉద్దేశాన్ని స్పష్టం చేస్తుంది; అందువల్ల తెలుగులో ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ, ‘వారి స్థలం’ అనే అనిర్దిష్టతను కాపాడాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
