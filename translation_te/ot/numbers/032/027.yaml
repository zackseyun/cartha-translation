source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: te
  text: అయితే నీ సేవకులమైన మేము, యుద్ధానికి ఆయుధాలు ధరించిన ప్రతి ఒక్కరమూ[a], యాహ్వే ఎదుట[b] యుద్ధానికి[c] దాటి వెళ్తాం—నా ప్రభువు చెప్పినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైనిక సేవకు సిద్ధమైన ప్రతి ఒక్కరం.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యాహ్వే ఎదుట.’ వారు యాహ్వే అధికారంలోను ఆయన సమక్షంలోను ఈ సైనిక యాత్రలో పాల్గొంటున్నారనే భావాన్ని ఈ మాట సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘పోరాటానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: అయితే నీ సేవకులమైన మేము
  rationale: వక్తలు తమను తాము మోషే సేవకులుగా వినయపూర్వకంగా పేర్కొంటున్నారు. తెలుగులో కర్త స్పష్టంగా, సహజంగా ఉండేందుకు ‘మేము’ చేర్చబడింది; వావ్ సందర్భంలోని ప్రతిస్పందనాత్మక భావాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: יַעַבְרוּ
  choice: దాటి వెళ్తాం
  rationale: ఇక్కడ עבר సరిహద్దు లేదా యొర్దాను దాటి సైనిక కార్యానికి వెళ్లడాన్ని సూచిస్తుంది; ‘దాటి వెళ్తాం’ ఆ చలన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: כָּל חֲלוּץ צָבָא
  choice: యుద్ధానికి సన్నద్ధులమైన ప్రతి ఒక్కరం
  rationale: כָּל మరియు ఏకవచన חֲלוּץ కలయిక పంపిణీ భావంతో ‘ప్రతి ఒక్కరు’ అని సూచిస్తుంది. חֲלוּץ צָבָא ఆయుధాలు ధరించి సైనిక సేవకు సిద్ధమైన వ్యక్తిని సూచిస్తుంది; ‘సన్నద్ధులమైన’ అనే పదం కేవలం ఆయుధధారణకన్నా విస్తృతమైన మూలార్థాన్ని కాపాడుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో.’ ఈ యుద్ధయాత్ర యెహోవా అధికారంలోను ఆయన సమక్షంలోను జరుగుతుందనే భావాన్ని ‘సన్నిధిలో’ సహజంగా తెలియజేస్తుంది; יהוה అనే నామం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: లామెడ్ ఇక్కడ గమ్యం లేదా ఉద్దేశాన్ని సూచిస్తుంది. ‘యుద్ధానికి’ అనే అనువాదం ‘యుద్ధం చేయడానికి’ అని అతిగా వివరణ చేయకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: నా ప్రభువు చెప్పినట్టే
  rationale: אֲדֹנִי ఇక్కడ దేవునికి కాక మోషేకు ఇచ్చే గౌరవసూచక సంబోధన. דֹּבֵר ప్రస్తుత సంభాషణ సందర్భంలో ‘చెప్పినట్టు/చెబుతున్నట్టు’ అనే భావం ఇస్తుంది; సహజ తెలుగులో ‘చెప్పినట్టే’ అనుకూలంగా ఉంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చాం.
- issue: לִפְנֵי יְהוָה యొక్క భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: ఈ పదబంధం భౌగోళిక ముందువరుసను మాత్రమే కాక దేవుని సమక్షం మరియు అధికారాన్ని కూడా సూచించగలదు. ఆ theological tension‌ను వివరణాత్మకంగా విస్తరించకుండా ‘సన్నిధిలో’ నిలుపుతుంది.
- issue: אֲדֹנִי అనే మానవ గౌరవ సంబోధన
  choice: నా ప్రభువు
  alternative: నా యజమాని
  rationale: ఇది మోషేకు ఉద్దేశించిన గౌరవపూర్వక సంబోధన, దైవనామం కాదు. ‘నా ప్రభువు’ ఆ భేదాన్ని సందర్భంలో కాపాడుతూ గౌరవ స్థాయిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మోషేకు చేసే వినయపూర్వక సంబోధనను నిలిపి, సైనిక పదబంధాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఇచ్చాం. ప్రధాన పాఠ్యంలో [a], [b], [c] గుర్తులు అన్నీ చేర్చబడ్డాయి.
