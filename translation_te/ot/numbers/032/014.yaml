language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: te
  text: ఇదిగో, మీరు మీ తండ్రుల స్థానంలో, పాపులైన మనుష్యుల సంతతిగా లేచారు; యాహ్వే ఇశ్రాయేలుపై మండుతున్న కోపాన్ని మరింత పెంచడానికి!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: మోషే చేస్తున్న గట్టి హెచ్చరికలోని చూపించే, దృష్టిని ఆకర్షించే బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: మీరు మీ తండ్రుల స్థానంలో లేచారు
  rationale: קום అనే క్రియలోని ‘లేవడం’ రూపకాన్ని, תחת తెలిపే మునుపటి తరానికి బదులుగా వచ్చిన భావాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: పాపులైన మనుష్యుల సంతతిగా
  rationale: תַּרְבּוּתకు సంతానం, పెరుగుదల అనే భావాలు ఉన్నాయి. సందర్భంలోని తరాల సంబంధాన్ని, మందలింపు స్వరాన్ని ‘సంతతి’ స్పష్టంగా అందిస్తుంది; אֲנָשִׁים యొక్క పురుష బహువచన సూచనను ‘మనుష్యులు’ నిలుపుతుంది.
- source_word: לִסְפּוֹת עוֹד
  choice: మరింత పెంచుతున్నారు
  rationale: ఇప్పటికే ఉన్న కోపానికి ఇంకను చేర్చడం లేదా దాన్ని అధికం చేయడం అనే సంయుక్త భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. తెలుగు వాక్యప్రవాహం కోసం హీబ్రూ ఉద్దేశార్థక క్రియారూపాన్ని సందర్భానుసార ఫలితార్థక అభివ్యక్తిగా అందించింది.
- source_word: חֲרוֹן אַף
  choice: మండే కోపం
  rationale: తీవ్రమైన కోపాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘మండడం’ అనే రూపకాన్ని చదవదగిన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: אֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: కోపం ఎవరిమీదికి మళ్లిందో తెలిపే אֶל యొక్క సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్నే వాడుతుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: אֲנָשִׁים חַטָּאִים లో లింగ సూచన
  choice: పాపులైన మనుష్యులు
  alternative: పాపాత్ములైన ప్రజలు; పాపులు
  rationale: హీబ్రూ పదబంధం పురుష బహువచనంలో ఉండి, ఇక్కడ మోషే సంబోధిస్తున్న గోత్రాల పురుషులను సూచిస్తుంది; అందువల్ల ఆ సూచనను తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన మందలింపు స్వరాన్ని ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. ‘ఇదిగో’ మరియు ఆశ్చర్యార్థకం మూలంలోని ఆకస్మిక, ఆరోపణాత్మక బలాన్ని నిలుపుతాయి.
