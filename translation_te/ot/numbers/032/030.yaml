  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּ/כֶ֑ם וְ/נֹֽאחֲז֥וּ בְ/תֹכְ/כֶ֖ם בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: te
  text: కాని వారు సాయుధులై మీతో కలిసి దాటకపోతే, కనాను దేశంలో మీ మధ్య వారు స్వాస్థ్యాన్ని పొందుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు కనాను దేశంలో మీ మధ్య స్థిరపరచబడతారు.” హీబ్రూ క్రియ కేవలం స్వాస్థ్యం పొందడాన్ని మాత్రమే కాక, స్వాస్థ్యంగా స్థిరపరచబడడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: కాని … దాటకపోతే
  rationale: ముందరి వచనంలోని షరతుకు విరుద్ధమైన ప్రత్యామ్నాయాన్ని ఈ సంధి పరిచయం చేస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘కాని … అయితే’ భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: יַעַבְרוּ
  choice: దాటకపోతే
  rationale: עבר అనే క్రియ ఇక్కడ యొర్దాను దాటి కనానులోకి వెళ్లడాన్ని సూచిస్తుంది; తెలుగు షరతు వాక్యంలో నిరాకరణతో కలిపి సహజంగా అనువదించాం.
- source_word: חֲלוּצִים
  choice: ఆయుధాలు ధరించి
  rationale: ఈ పదం యుద్ధానికి సన్నద్ధమై, ఆయుధసజ్జులై ఉండడాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టమైన సహజ తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אִתְּ/כֶם
  choice: మీతో కలిసి
  rationale: ఇశ్రాయేలీయుల మిగిలిన వారితో పాటు వెళ్లే సహచర్య భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְ/נֹאחֲזוּ
  choice: వారికి స్వాస్థ్యం కలుగుతుంది
  rationale: Niphal రూపం భూమిలో స్వాస్థ్యంగా స్థిరపరచబడడం లేదా స్వాస్థ్యం పొందడం అనే ఫలితభావాన్ని కలిగి ఉంది. కర్తృత్వాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలుగు వాక్యం ఆ భావాన్ని నిలుపుతుంది.
- source_word: בְ/תֹכְ/כֶם
  choice: మీ మధ్య
  rationale: సమాజం మధ్య లేదా వారి భాగంలో అనే స్థానిక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: హీబ్రూ భౌగోళిక పదబంధాన్ని పూర్తిగా నిలుపుతూ ఆధునిక తెలుగు వాడుకకు అనుగుణంగా ఉంది.
