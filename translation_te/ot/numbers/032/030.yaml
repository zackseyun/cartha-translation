translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలు శైలిని పాటించాం. భూస్వాస్థ్య సందర్భాన్ని తెలియజేయడానికి ‘స్వాస్థ్యం’ వాడి, హీబ్రూ క్రియలోని పొందడం/స్థిరపడడం అనే అర్థ విస్తృతిని పాదటిప్పణిలో నిలిపాం.
