id: NUM.32.21
reference: Numbers 32:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: te
  text: మీలోని ప్రతి ఆయుధధారి యొర్దాను దాటి యహ్వే సమక్షంలో వెళ్లాలి; ఆయన తన శత్రువులను తన ఎదుటనుండి వెళ్లగొట్టే వరకు[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిని స్వాధీనంనుండి తొలగించే వరకు’ అని కూడా అనువదించవచ్చు. హెబ్రీ క్రియకు ‘వెళ్లగొట్టు’ లేదా ‘స్వాధీనంనుండి తొలగించు’ అనే భావాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన తన శత్రువులను తన ఎదుటనుండి’ అనే మాటల్లోని ఏకవచన సర్వనామాలు అత్యంత సహజంగా యహ్వేను సూచిస్తాయి. అయితే కొందరు అవి ఇశ్రాయేలును సమూహంగా లేదా దాని సైన్యాన్ని సూచిస్తాయని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: దాటి ... ముందుకు వెళ్లాలి
  rationale: మునుపటి వచనంలోని షరతుకు కొనసాగింపుగా ఉన్న ఈ క్రియకు భవిష్యత్తు/విధి భావం ఉంది. తెలుగులో ‘వెళ్లాలి’ ఆ నిబంధనను సహజంగా తెలియజేస్తుంది.
- source_word: לָכֶם כָּל חָלוּץ
  choice: మీలో ఆయుధాలు ధరించిన ప్రతి పురుషుడు
  rationale: לָכֶם ఇక్కడ సంబోధించబడిన గోత్రాల మధ్యనుండి అనే సంబంధాన్ని సూచిస్తుంది; חָלוּץ యుద్ధానికి ఆయుధాలు ధరించి సిద్ధమైన వ్యక్తిని సూచిస్తుంది. ఏకవచన పంపిణీ భావాన్ని ‘ప్రతి పురుషుడు’ నిలుపుతుంది.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: నదిపేరుకు తెలుగులో స్థిరంగా వాడే రూపం; సందర్భంలో ‘నది’ అని చేర్చనవసరం లేదు.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనేది ఆయన ఎదుట/సన్నిధిలో ఉండడాన్ని సూచిస్తుంది. యహ్వే అనే రూపం హెబ్రీ దైవనామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: עַד
  choice: వరకు
  rationale: కాలపరమైన అంతిమ పరిమితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹרִישׁוֹ
  choice: ఆయన ... వెళ్లగొట్టే
  rationale: ירשׁ హిఫీల్ రూపం ఇక్కడ వెళ్లగొట్టడం లేదా స్వాధీనాన్ని తొలగించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘వెళ్లగొట్టు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֹיְבָיו
  choice: తన శత్రువులను
  rationale: హెబ్రీలోని తృతీయ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది; సమీప సందర్భంలో అది యహ్వేను సూచించడం అత్యంత సహజం.
- source_word: מִפָּנָיו
  choice: తన సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘అతని ముఖం/సన్నిధి ఎదుటనుండి.’ తెలుగులో ‘సన్నిధి నుండి’ మూలంలోని సాన్నిధ్య భావాన్ని గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. ‘యహ్వే’ ఒడంబడిక నామాన్ని పేరుగానే నిలుపుతుంది; దానిని బిరుదుతో భర్తీ చేయదు.
- issue: הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו లోని తృతీయ పురుష ఏకవచన రూపాల నిర్దేశ్యం
  choice: అవి యహ్వేను సూచిస్తాయి
  alternative: అవి ఇశ్రాయేలును సమూహంగా లేదా ఆయుధధారుల సైన్యాన్ని సూచిస్తాయి
  rationale: ‘యహ్వే సన్నిధిలో’ అనే వెంటనే ముందున్న పదబంధం, అలాగే శత్రువులను ఇశ్రాయేలు ఎదుటనుండి యహ్వే వెళ్లగొట్టే పెంటటూకు విజయభాష, ఈ నిర్దేశ్యాన్ని బలపరుస్తాయి. అయినా ప్రత్యామ్నాయ అవగాహన వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సైనిక అర్థం, విధి భావం, దైవనామం, సర్వనామాల అస్పష్టత నిలుపబడ్డాయి. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
