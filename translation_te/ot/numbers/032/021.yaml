revisions:
- from: మీలో ఆయుధాలు ధరించిన ప్రతి పురుషుడు యొర్దాను దాటి యహ్వే సన్నిధిలో ముందుకు వెళ్లాలి; ఆయన తన శత్రువులను తన సన్నిధి నుండి వెళ్లగొట్టే వరకు[a] అలా చేయాలి.[b]
  to: మీలోని ప్రతి ఆయుధధారి యొర్దాను దాటి యహ్వే సమక్షంలో వెళ్లాలి; ఆయన తన శత్రువులను తన ఎదుటనుండి వెళ్లగొట్టే వరకు[a].[b]
  rationale: మూలానికి లేని దిశాభావం, పునరుక్తిని తొలగించాను. ‘తన ఎదుటనుండి’ ద్వారా మִפָּנָיוలోని ప్రత్యక్ష స్థానిక భావాన్ని నిలిపాను. హిఫీల్ ירשׁకు సంబంధించిన ప్రత్యామ్నాయ పాదసూచికను స్పష్టీకరించాను. సర్వనామాల ప్రత్యామ్నాయ నిర్దేశ్యాన్ని ప్రధాన పాఠ్యంలో నిర్ణయాత్మకంగా మార్చకుండా పాదసూచికలో ఉంచాను.
  reviewer_model: gpt-5.6-terra
