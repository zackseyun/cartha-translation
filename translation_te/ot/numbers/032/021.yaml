    rationale: హిఫీల్ ירשׁకు ఇక్కడ ‘వారిని స్వాధీనంనుండి తొలగించు/స్వాస్థ్యహక్కును కోల్పోయేలా చేయు’ అనే భావం వస్తుంది; ‘వారి స్వాధీనం’ అని చెప్పడం ఎవరి స్వాధీనమో స్పష్టం చేయదు మరియు మూలంలోని కర్మాన్ని సరిగా చూపదు.
