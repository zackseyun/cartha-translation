translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; మర్యాదపూర్వక విన్నప ధోరణి, నిష్క్రియ అభ్యర్థన నిర్మాణం, కారణార్థక క్రియాభావం నిలుపబడ్డాయి. ‘ఇవ్వబడుగాక’ మరియు ‘స్వాస్థ్యంగా’ గౌరవప్రదమైన లేఖన శైలిని కాపాడుతూనే సాధారణ పాఠకులకు అర్థమయ్యే పదాలు.
