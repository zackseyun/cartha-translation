source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: te
  text: వారు, “మేము నీ దృష్టిలో అనుగ్రహం పొందినట్లయితే, ఈ భూమి నీ సేవకులకు స్వాస్థ్యంగా ఇవ్వబడుగాక. మమ్మల్ని యొర్దాను దాటించవద్దు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్మల్ని యొర్దాను అవతలికి తీసుకువెళ్లవద్దు.” హీబ్రూ క్రియ కారణార్థక రూపంలో ఉంది; దాన్ని ఈ రెండు సమీప భావాలతో అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: మేము నీ దృష్టిలో అనుగ్రహం పొందినట్లయితే
  rationale: హీబ్రూ మర్యాదపూర్వక విన్నప జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. ‘కృప’ కంటే ‘అనుగ్రహం’ ఇక్కడ అనుకూల ఆదరణ అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֻתַּן
  choice: ఇవ్వబడుగాక
  rationale: నిష్క్రియ రూపంలోని విన్నప భావాన్ని నిలుపుతూ, గౌరవపూర్వక అభ్యర్థనగా సహజంగా వినిపిస్తుంది.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ఈ దేశం
  rationale: ఈ సందర్భంలో אֶרֶץ వారు కోరుతున్న భూభాగాన్ని సూచిస్తుంది; ‘ఈ దేశం’ సూటిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לַעֲבָדֶיךָ
  choice: నీ సేవకులకు
  rationale: వక్తలు మోషే ఎదుట తమను తాము వినయంగా సూచించుకుంటున్నారు; అందువల్ల బానిసత్వ భావం కంటే గౌరవపూర్వకమైన ‘సేవకులు’ సందర్భానికి సరిపోతుంది.
- source_word: לַאֲחֻזָּה
  choice: స్వాస్థ్యంగా
  rationale: אֲחֻזָּה స్థిరమైన భూస్వామ్యపు హక్కు లేదా స్వాధీనాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన బైబిలు తెలుగులో తెలియజేస్తుంది; ‘వారసత్వం’ అనే మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చదు.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: మమ్మల్ని యొర్దాను దాటించవద్దు
  rationale: హిఫీల్ కారణార్థక రూపాన్ని ‘దాటించవద్దు’ నేరుగా నిలుపుతుంది. ఇది కేవలం వారు దాటకుండా అనుమతించమనే భావం కాకుండా, వారిని దాటించకూడదనే విన్నపాన్ని వ్యక్తపరుస్తుంది.
