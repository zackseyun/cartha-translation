source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: te
  text: మరి, యాహ్వే వారికి ఇచ్చిన దేశంలోకి ఇశ్రాయేలీయులు దాటి వెళ్లకుండా మీరు వారి హృదయాన్ని ఎందుకు నిరుత్సాహపరుస్తున్నారు?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలీయుల హృదయాన్ని.” ఇక్కడ “హృదయం” వారి ధైర్యాన్ని లేదా సంకల్పాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు”; దీనిని “ఇశ్రాయేలు సంతతి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: మరి ... ఎందుకు
  rationale: సందర్భంలోని ముందరి మాటతో ప్రశ్నను అనుసంధానించే וְ సంధిని, ప్రశ్నార్థకమైన לָמָּהను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תנואון
  choice: నిరుత్సాహపరుస్తున్నారు
  rationale: నוא ధాతువు హిఫీల్ రూపం ఇక్కడ ప్రవేశించాలనే ధైర్యాన్ని లేదా సంకల్పాన్ని బలహీనపరచడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֶת לֵב
  choice: వారి హృదయాలను
  rationale: మూలంలోని ‘హృదయం’ అనే రూపకాన్ని నిలుపుతూ, సమూహంలోని వ్యక్తులకు పంపిణీ అయ్యే భావాన్ని తెలుగులో సహజమైన బహువచనంతో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఆధునిక తెలుగులో మొత్తం జాతిని సహజంగా, స్పష్టంగా సూచించే రూపం ‘ఇశ్రాయేలీయులు’.
- source_word: מֵעֲבֹר אֶל־הָאָרֶץ
  choice: దేశంలోకి వారు దాటి వెళ్లకుండా
  rationale: מִן తో కూడిన క్రియానామం నిరోధాన్ని సూచిస్తుంది; אֶל గమ్యాన్ని తెలియజేస్తుంది. ఈ సందర్భంలో యొర్దాను దాటి దేశంలో ప్రవేశించే భావాన్ని ఈ నిర్మాణం స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: వారికి ఇచ్చిన
  rationale: పూర్తయిన దైవిక అనుగ్రహాన్ని సూచించే perfect రూపాన్ని సరళంగా ‘ఇచ్చిన’ అని అనువదిస్తుంది; వాగ్దానం యొక్క ప్రస్తుత ప్రాముఖ్యతను సందర్భమే తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక వ్యక్తినామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తినామమే ఉంది; అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా సాధారణ పండిత లిప్యంతరీకరణను ఉపయోగించింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతీయ-వంశీయ పదబంధం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు; ఇశ్రాయేలు సంతతి
  rationale: ఇది కేవలం పురుషులను మాత్రమే కాక జాతీయ సమూహాన్ని సూచించే స్థిరమైన హీబ్రూ వ్యక్తీకరణ. సహజమైన తెలుగు ప్రధాన పాఠంలో సమగ్ర జాతీయ అర్థాన్ని ఇస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘హృదయాలు’ అనే మూలరూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో తెలిపింది. వాక్య క్రమం నిరోధ భావాన్ని స్పష్టంగా చూపేలా అమర్చబడింది.
