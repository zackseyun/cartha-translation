source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ מֹשֶׁ֔ה אִֽם תַּעֲשׂ֖וּ/ן אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה אִם תֵּחָֽלְצ֛וּ לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: te
  text: 'మోషే వారితో ఇలా అన్నాడు: “మీరు ఈ పని చేస్తే, యుద్ధానికి యాహ్వే సన్నిధిలో ఆయుధసన్నద్ధులైతే[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యుద్ధానికి ఆయుధాలు ధరించి సిద్ధపడితే,” “ఆయుధాలు ధరించినవారిగా బయలుదేరితే.” ఈ హీబ్రూ క్రియకు యుద్ధం కోసం ఆయుధాలు ధరించి సిద్ధపడే సైనిక భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: మోషే వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: మీరు ఈ పని చేస్తే
  rationale: דָּבָר ఇక్కడ ముందుగా చేసిన ప్రతిపాదనను సూచిస్తుంది; ‘ఈ పని’ సందర్భానికి సహజంగా ఉండి భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: אִם תֵּחָלְצוּ
  choice: ఆయుధాలు ధరించి సిద్ధపడితే
  rationale: חלץ నిఫాల్ రూపానికి ఈ సైనిక సందర్భంలో ఆయుధసన్నద్ధత అనే భావం ఉంది; తెలుగు ప్రయోగం ఆయుధాలు ధరించడం, యుద్ధానికి సిద్ధపడడం అనే రెండు పార్శ్వాలను స్పష్టంగా అందిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, చర్య యెహోవా సమక్షంలో జరుగుతుందనే అంశాన్ని కాపాడుతుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: సందర్భంలోని సైనిక కార్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపంలో ఉంచింది.
- issue: לִפְנֵי יְהוָה యొక్క భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: వారి సైనిక చర్య దేవుని సమక్షంలో జరుగుతుందనే మూలపాఠ భావాన్ని నిలుపుతుంది; ‘ఆయన అధికారంలో’ అని విస్తరించి మూలంలో లేని వివరణను ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున ముగింపులో కామా ఉంచబడింది. మూలంలోని పునరుక్త షరతు నిర్మాణాన్ని రెండు ‘చేస్తే/సిద్ధపడితే’ రూపాలతో నిలిపాం.
