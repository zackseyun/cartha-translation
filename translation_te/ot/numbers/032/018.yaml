revisions:
- from: ఇశ్రాయేలు కుమారులు[a] ప్రతి ఒక్కరూ తమ తమ స్వాస్థ్యాన్ని స్వాధీనం చేసుకునే వరకు మేము మా ఇళ్లకు తిరిగి రాము.
  to: ఇశ్రాయేలు కుమారులలో ప్రతి ఒక్కరూ తమ స్వాస్థ్యాన్ని స్వాధీనం చేసుకొనే వరకు మేము మా ఇళ్లకు తిరిగి రాము.
  rationale: A minor syntactic revision improves natural modern Telugu and makes the Hebrew distributive construction explicit. The negation, future commitment, temporal boundary, familial designation, and inheritance-possession sense are retained. The existing footnote remains correctly anchored and accurately states the lexical alternative.
  reviewer_model: gpt-5.6-terra
