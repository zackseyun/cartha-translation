id: NUM.32.18
reference: Numbers 32:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులలో ప్రతి ఒక్కరూ తమ స్వాస్థ్యాన్ని స్వాధీనం చేసుకొనే వరకు మేము మా ఇళ్లకు తిరిగి రాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: మేము ... తిరిగి రాము
  rationale: నిషేధంతో కూడిన Qal అసంపూర్ణ క్రియ సందర్భంలో భవిష్యత్తు సంకల్పాన్ని తెలియజేస్తుంది; ఈ తెలుగు రూపం వారి దృఢమైన వాగ్దానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל בָּתֵּינוּ
  choice: మా ఇళ్లకు
  rationale: దిశను సూచించే విభక్తిని ‘తిరిగి రాము’తో సహజంగా కలిపి, ‘ఇళ్లు’ అనే స్పష్టమైన మూలార్థాన్ని నిలిపింది.
- source_word: עַד
  choice: వరకు
  rationale: వారు తిరిగి రాకపోవడానికి కాలపరమైన హద్దును నేరుగా సూచిస్తుంది.
- source_word: הִתְנַחֵל
  choice: స్వాధీనం చేసుకునే
  rationale: Hitpael రూపం కేటాయించబడిన భూస్వాస్థ్యాన్ని పొందుకొని దానిపై హక్కు స్థాపించుకోవడాన్ని సూచిస్తుంది; ‘స్వాధీనం చేసుకోవడం’ ఈ సందర్భంలోని స్థిరపడే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీలోని కుటుంబ సంబంధమైన ఒడంబడిక పదబంధాన్ని, దాని వ్యాకరణపరమైన పుంలింగ రూపంతో సహా, నేరుగా నిలిపింది.
- source_word: אִישׁ נַחֲלָתוֹ
  choice: ప్రతి ఒక్కరూ తమ తమ స్వాస్థ్యాన్ని
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో ‘ప్రతి ఒక్కరూ’ అని అర్థం. తెలుగు ‘తమ తమ’ ప్రతి వ్యక్తికి సంబంధించిన కేటాయింపును సహజంగా తెలియజేస్తూ, నַחֲלָה యొక్క వారసత్వ భూభాగ భావాన్ని ‘స్వాస్థ్యం’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక ఒడంబడిక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ కుటుంబ పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక సామూహిక జాతినామ రూపాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చాం; ఏ ప్రత్యేక సిద్ధాంతపరమైన అర్థాన్నీ అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘మా ఇళ్లకు తిరిగి రాము’ అనే రూపం ప్రతిజ్ఞ ధోరణిని స్పష్టంగా ఉంచుతుంది; ‘ప్రతి ఒక్కరూ తమ తమ స్వాస్థ్యాన్ని’ పంపిణీ భావాన్ని సాధారణ పాఠకులకు సులభంగా తెలియజేస్తుంది.
