  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: te
  text: అయితే మీరు అలా చేయకపోతే, ఇదిగో, మీరు యాహ్వేకు విరోధంగా పాపం చేసినవారే. మీ పాపం మిమ్మల్ని పట్టుకుంటుందని తెలుసుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ పాపం మిమ్మల్ని కనుగొంటుంది.” దీనిని “మీ పాపం మిమ్మల్ని చేరుకుంటుంది” లేదా “మీ అపరాధం మిమ్మల్ని వెంబడించి చేరుతుంది” అని కూడా అనువదించవచ్చు. ఈ హెబ్రీ ప్రయోగం పాపం తప్పక బయల్పడడాన్ని, దాని పర్యవసానం పాపం చేసినవారిని చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … చేయకపోతే
  rationale: ముందటి ఆజ్ఞకు విరుద్ధమైన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: మీరు అలా చేయకపోతే
  rationale: ముందు చెప్పిన కార్యాన్ని తిరిగి సూచించే ‘అలా’ అనే పదంతో హెబ్రీ ప్రయోగాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: హెచ్చరికలోని శ్రద్ధాకర్షణనూ గంభీరమైన ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: חֲטָאתֶם לַיהוָה
  choice: మీరు యాహ్వేకు విరోధంగా పాపం చేసినవారవుతారు
  rationale: షరతు నెరవేరని పక్షంలో కలిగే ఫలితాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, לַ అనే విభక్తి సూచించే ‘విరోధంగా’ అనే భావాన్ని కాపాడుతుంది.
- source_word: וּדְעוּ
  choice: తెలుసుకోండి
  rationale: బహువచన ఆజ్ఞారూపంలోని నిశ్చయపూర్వక హెచ్చరికను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: חַטַּאתְכֶם
  choice: మీ పాపం
  rationale: ‘పాపం’ లేదా ‘అపరాధభారం’ అనే సాధ్యార్థాల్లో, ఈ సందర్భంలోని నైతిక హెచ్చరికకు ప్రత్యక్షమైన ‘పాపం’ సరిపోతుంది.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: మిమ్మల్ని తప్పక పట్టుకుంటుందని
  rationale: పాపం దోషిని కనుగొనడం అనే హెబ్రీ వ్యక్తీకరణలోని అనివార్యమైన బహిర్గతత మరియు పర్యవసాన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘తప్పక’ దాని నిశ్చితత్వాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- issue: షరతు వాక్యంలో חֲטָאתֶם యొక్క కాలభావం
  choice: పాపం చేసినవారవుతారు
  alternative: పాపం చేశారు
  rationale: హెబ్రీ సంపూర్ణ క్రియారూపం షరతు నెరవేరని పక్షంలో ఏర్పడే నిశ్చిత ఫలితాన్ని సూచిస్తుంది. తెలుగులో భూతకాలంగా మాత్రమే ఇస్తే షరతుతో కాలపరమైన అసహజత వస్తుంది కాబట్టి ఫలితభావాన్ని నిలిపింది.
- issue: పాపం ‘కనుగొనడం’ అనే వ్యక్తీకరణ
  choice: మిమ్మల్ని తప్పక పట్టుకుంటుంది
  alternative: మిమ్మల్ని కనుగొంటుంది / మీ అపరాధం మిమ్మల్ని వెంబడించి చేరుతుంది
  rationale: పాపానికి వ్యక్తిత్వం ఇచ్చే మూలరూపాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, దాని బహిర్గతత మరియు తప్పించుకోలేని పర్యవసానం రెండింటినీ సహజమైన తెలుగులో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన హెచ్చరిక స్వరాన్ని ఉంచింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది.
