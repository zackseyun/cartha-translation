  naturalness: ‘మనసు విరిచారు’ ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం కాదు; అది వ్యక్తిగత బాధ లేదా హృదయభంగం అనే భిన్న భావాన్ని కలిగించవచ్చు. ‘ధైర్యాన్ని తగ్గించారు’ ఇక్కడ వారి సమష్టి సంకల్పాన్ని/ధైర్యాన్ని క్షీణింపజేశారనే భావాన్ని స్పష్టంగా ఇస్తుంది. వాక్యాన్ని ఒకే అనుసంధాన కథనంగా ఉంచడం కూడా సహజంగా ఉంటుంది.
