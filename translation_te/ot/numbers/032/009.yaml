  to: వారు ఎష్కోలు వాగులోయ వరకు పైకి వెళ్లి ఆ దేశాన్ని చూశారు; ఇశ్రాయేలు కుమారుల[a] ధైర్యాన్ని తగ్గించారు[b], తద్వారా యాహ్వే[c] వారికి ఇచ్చిన ఆ దేశంలోకి వారు ప్రవేశించకుండా చేశారు.
