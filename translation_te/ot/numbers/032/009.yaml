  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: te
  text: వారు ఎష్కోలు వాగులోయ వరకు పైకి వెళ్లి ఆ దేశాన్ని చూశారు; ఇశ్రాయేలు కుమారుల[a] ధైర్యాన్ని తగ్గించారు[b], తద్వారా యాహ్వే[c] వారికి ఇచ్చిన ఆ దేశంలోకి వారు ప్రవేశించకుండా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయుల.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల’ అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలకు వాడే సాధారణ జాతీయ, నిబంధనాత్మక పేరు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారిని నిరుత్సాహపరిచారు’ లేదా ‘వారి మనసును వెనక్కి మళ్లించారు.’ హీబ్రూ క్రియ వారిని ఆ దేశంలోకి ప్రవేశించకుండా వెనుకంజ వేయించిన భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘యాహ్వే’ అనేది హీబ్రూ יהוה (YHWH) అనే దైవనామానికి లిప్యంతరీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: వారు ... వెళ్లి
  rationale: עלה దిశాపరంగా ‘పైకి వెళ్లడం’ అనే భావం కలిగినా, ఈ సందర్భంలో సహజమైన తెలుగు కథనానికి ‘వెళ్లి’ సరిపోతుంది; ప్రయాణ గమ్యాన్ని తరువాతి పదబంధం స్పష్టం చేస్తుంది.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: ఎష్కోలు వాగులోయ వరకు
  rationale: נחל సాధారణ లోయ మాత్రమే కాక కాలానుగుణంగా నీరు ప్రవహించే వాగులోయను సూచించగలదు. ‘వాగులోయ’ భౌగోళిక భావాన్ని స్పష్టంగా ఉంచుతుంది; עַד ను ‘వరకు’గా అనువదించాం.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: ఆ దేశాన్ని చూశారు
  rationale: ראה యొక్క సరళమైన అర్థం ‘చూడు.’ הארץ ఇక్కడ పరిశీలించిన దేశాన్ని సూచిస్తున్నందున ‘ఆ దేశం’ సహజంగా ఉంది.
- source_word: וַיָּנִיאוּ
  choice: మనసు విరిచారు
  rationale: ఈ హిఫిల్ రూపం వెనుకంజ వేయించడం, నిరుత్సాహపరచడం లేదా ప్రవేశించకుండా అడ్డగించడం అనే కారణార్థాన్ని ఇస్తుంది. ‘మనసు విరిచారు’ సాధారణ తెలుగు వాడుకలో ధైర్యం కోల్పోయేలా చేశారనే భావాన్ని అందిస్తుంది.
- source_word: אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మనసు
  rationale: లేబ్ అనే ఏకవచనం ఇక్కడ సమూహపు అంతరంగ సంకల్పం లేదా ధైర్యాన్ని సూచిస్తుంది. ‘మనసు’ ఆ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ సమూహ ఏకవచనాన్ని నిలుపుతుంది.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: ఆ దేశంలోకి ప్రవేశించకుండా
  rationale: לבלתי తో కూడిన క్రియారూపం నివారణ లేదా ఫలితాన్ని సూచిస్తుంది. בוא אל సందర్భానుసారంగా ‘దేశంలోకి ప్రవేశించడం’ అని అనువదించబడింది.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: యాహ్వే వారికి ఇచ్చిన
  rationale: נתן సంపూర్ణ క్రియను తెలుగులో సహజమైన భూతకాల సంబంధవాచక నిర్మాణంతో ఇచ్చాం. יהוה ను బిరుదుతో భర్తీ చేయకుండా దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో నాలుగు అక్షరాల దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: ‘ఇశ్రాయేలు కుమారులు’ అనే జాతీయ/నిబంధనాత్మక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని בני ישראל రూపాన్ని ప్రధాన పాఠంలో నిలిపి, మరింత సహజమైన జాతీయ నామరూపాన్ని పాదటిప్పణిలో సూచించాం; దీని ద్వారా మూలంలోని సమూహ సంబంధ భావం పోకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వాగులోయ,’ ‘మనసు విరిచారు’ వంటి పదాలు సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండటంతో పాటు మూలంలోని భౌగోళిక, భావోద్వేగ సంకేతాలను కాపాడుతాయి. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
