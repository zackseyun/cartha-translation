source:
  edition: WLC
  text: בְּנֽוּ לָ/כֶ֤ם עָרִים֙ לְ/טַפְּ/כֶ֔ם וּ/גְדֵרֹ֖ת לְ/צֹנַאֲ/כֶ֑ם וְ/הַ/יֹּצֵ֥א מִ/פִּי/כֶ֖ם תַּעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: te
  text: మీ చిన్నపిల్లల కోసం పట్టణాలను, మీ మందల కోసం దొడ్లను కట్టుకోండి; మీ నోటినుంచి వెలువడిన మాట ప్రకారం చేయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, “మీరు వాగ్దానం చేసినదాన్ని నెరవేర్చండి.” హీబ్రూలో అక్షరార్థంగా, “మీ నోటినుంచి వెలువడినదాన్ని చేయండి” అని ఉంది; ఇది తాము పలికిన మాటను అమలు చేయడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ לָכֶם
  choice: కట్టుకోండి
  rationale: బנה అనే బహువచన ఆజ్ఞతో పాటు לָכֶםలోని ప్రయోజనార్థక భావాన్ని సహజమైన తెలుగు ఆత్మార్థక క్రియారూపం తెలియజేస్తుంది.
- source_word: עָרִים
  choice: పట్టణాలను
  rationale: עיר అనేది నగరం లేదా పట్టణాన్ని సూచించగలదు; ఈ స్థిరనివాస సందర్భంలో ‘పట్టణాలు’ సహజమైన, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: לְטַפְּכֶם
  choice: మీ చిన్నపిల్లల కోసం
  rationale: טַף ప్రధానంగా కుటుంబాల్లోని చిన్నపిల్లలను సూచిస్తుంది; మూలంలోని స్పష్టమైన కుటుంబ భావాన్ని ఇది నిలుపుతుంది.
- source_word: וּגְדֵרֹת
  choice: దొడ్లను
  rationale: గొర్రెలు, మేకలు వంటి పశువులను ఉంచే కంచెగల ప్రదేశాలను גדרות సూచిస్తుంది; ‘దొడ్లు’ ఆధునిక తెలుగులో సహజమైన పశుపోషణ పదం.
- source_word: לְצֹנַאֲכֶם
  choice: మీ మందల కోసం
  rationale: צאן సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది; ‘మందలు’ సమూహార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַיֹּצֵא מִפִּיכֶם תַּעֲשׂוּ
  choice: మీ నోటినుంచి వెలువడిన మాట ప్రకారం చేయండి
  rationale: హీబ్రూ నుడికారంలోని ‘నోటినుంచి వెలువడినది’ అనే చిత్రాన్ని నిలుపుతూ, తెలుగులో వాక్యార్థం స్పష్టంగా ఉండేందుకు ‘మాట ప్రకారం’ అని అనుసంధానించబడింది.
