translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. మూలంలోని నోటి నుంచి మాట వెలువడటం అనే నుడికార చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని వాగ్దానార్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
