review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately identifies Moses, the Gadites and Reubenites, their fellow Israelites as ‘brothers,’ and the contrast between going to war and remaining here. However, ‘యుద్ధానికి వెళ్లాలి’ normally carries a deontic sense (‘must/should go’), whereas the Hebrew imperfect in this rebuking question depicts the prospective action: ‘shall/will go.’'
  naturalness: The revised wording is natural modern standard Telugu and preserves the rhetorical rebuke. Using ‘అన్నాడు’ is sufficient and closer to the speech verb אמר; the interrogative direct speech itself makes clear that Moses is asking a question.
  terminology: ‘గాదు కుమారులు,’ ‘రూబేను కుమారులు,’ and ‘సహోదరులు’ appropriately preserve the Hebrew tribal and kinship wording. The cultural footnote is accurate and its anchor is correctly placed.
  issues:
  - severity: medium
    issue: ‘యుద్ధానికి వెళ్లాలి’ introduces obligation.
    rationale: The Hebrew יָבֹאוּ is a rhetorical future/question (‘shall your brothers go’), not an explicit ‘must/should go.’ ‘యుద్ధానికి వెళ్లగా’ retains the prospective contrast without adding deontic force.
  - severity: low
    issue: ‘అని అడిగాడు’ is more specific than the Hebrew speech verb.
    rationale: אָמַר means ‘said.’ Though a question is spoken, ‘అన్నాడు’ preserves the source wording and remains fully idiomatic in Telugu.
  revised_text: మోషే గాదు కుమారులతోను రూబేను కుమారులతోను, “మీ సహోదరులు[a] యుద్ధానికి వెళ్లగా, మీరు మాత్రం ఇక్కడే కూర్చుంటారా?” అన్నాడు.
  revised_footnotes:
  - marker: a
    text: “మీ సహోదరులు” అంటే ఇతర గోత్రాలకు చెందిన తోటి ఇశ్రాయేలీయులు.
    reason: cultural_note
  revision_rationale: The revision removes the added obligation implied by ‘వెళ్లాలి,’ retains the Hebrew rhetorical future and contrast, and renders the introductory speech verb without unnecessary specification. No doctrinal or interpretive change is made.
