revisions:
- from: మోషే గాదు కుమారులతో, రూబేను కుమారులతో, “మీ సహోదరులు[a] యుద్ధానికి వెళ్లాలి, మీరు మాత్రం ఇక్కడే కూర్చుంటారా?” అని అడిగాడు.
  to: మోషే గాదు కుమారులతోను రూబేను కుమారులతోను, “మీ సహోదరులు[a] యుద్ధానికి వెళ్లగా, మీరు మాత్రం ఇక్కడే కూర్చుంటారా?” అన్నాడు.
  rationale: The revision removes the added obligation implied by ‘వెళ్లాలి,’ retains the Hebrew rhetorical future and contrast, and renders the introductory speech verb without unnecessary specification. No doctrinal or interpretive change is made.
