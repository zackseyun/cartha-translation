language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: te
  text: మోషే గాదు కుమారులతోను రూబేను కుమారులతోను, “మీ సహోదరులు[a] యుద్ధానికి వెళ్లగా, మీరు మాత్రం ఇక్కడే కూర్చుంటారా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ సహోదరులు” అంటే ఇతర గోత్రాలకు చెందిన తోటి ఇశ్రాయేలీయులు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: ఈ వాక్యం ప్రశ్నారూప ప్రత్యక్ష సంభాషణ కావడంతో, సాధారణ ‘అన్నాడు’ కంటే తెలుగు వాక్య నిర్మాణంలో ‘అని అడిగాడు’ సహజంగా ఉంది; హీబ్రూ אמר యొక్క మాటలాడే భావం నిలుస్తుంది.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: గాదు కుమారులతో, రూబేను కుమారులతో
  rationale: בני అనే ‘కుమారులు/సంతతి’ రూపాన్ని నిలుపుతూ, ఇక్కడ గోత్ర సమూహాలను ఉద్దేశిస్తున్న సంగతి సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: הַאַחֵיכֶם
  choice: మీ సహోదరులు
  rationale: హీబ్రూ పదంలోని కుటుంబ సంబంధ రూపాన్ని నిలిపింది; సందర్భంలో ఇది ఇతర ఇశ్రాయేలు గోత్రాలవారిని సూచిస్తుంది.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: యుద్ధానికి వెళ్లాలి
  rationale: ‘యుద్ధంలోకి రావడం/ప్రవేశించడం’ అనే హీబ్రూ సైనిక నుడికారాన్ని సహజ తెలుగులో తెలిపింది. ప్రశ్నలోని గద్దింపు భావాన్ని ‘వెళ్లాలి’ వ్యక్తం చేస్తుంది.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: మీరు మాత్రం ఇక్కడే కూర్చుంటారా?
  rationale: ישב యొక్క స్పష్టమైన ‘కూర్చుండు/ఉండు’ భావాన్ని నిలిపి, וְ ద్వారా వ్యక్తమైన వ్యత్యాసాన్ని ‘మాత్రం’తో సహజంగా వెల్లడించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలి. మోషే ప్రశ్నలోని మందలింపు, గాదు-రూబేను గోత్రాలవారికీ మిగిలిన ఇశ్రాయేలీయులకీ ఉన్న సహోదర సంబంధం నిలుపబడ్డాయి.
