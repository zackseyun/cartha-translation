id: NUM.32.22
reference: Numbers 32:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: te
  text: యహ్వే[a] సన్నిధిలో ఆ దేశం వశపరచబడిన తరువాత, మీరు తిరిగి రావచ్చు; అప్పుడు యహ్వే పట్ల, ఇశ్రాయేలు పట్ల బాధ్యత నుంచి విముక్తులవుతారు[b]. ఈ దేశం యహ్వే సన్నిధిలో మీకు స్వాస్థ్యంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే’ అనేది హీబ్రూ దైవనామమైన YHWHకు ధ్వన్యంతరీకరణ. కొన్ని అనువాదాలు దీనిని ‘ప్రభువు’ అని ఇస్తాయి.
    reason: divine_name
  - marker: b
    text: లేదా ‘యహ్వే ఎదుట, ఇశ్రాయేలు ఎదుట నిర్దోషులుగా ఉంటారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: ఆ దేశం లోబరచబడిన తరువాత
  rationale: נכבשה అనే నిఫాల్ రూపంలోని కర్మణి భావాన్ని ‘లోబరచబడిన’ నిలుపుతుంది. తరువాతి క్రియతో షరతు-కాల సంబంధాన్ని సహజమైన తెలుగులో ‘తరువాత’ ద్వారా వ్యక్తం చేశాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי పదబంధంలోని ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది; ఒడంబడికపరమైన బాధ్యత భావాన్నీ నిలుపుతుంది.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: మీరు తిరిగి రావచ్చు
  rationale: ముందు చెప్పిన కార్యం నెరవేరిన తరువాత తిరిగి రావడానికి లభించే అనుమతి లేదా అవకాశం సందర్భంలో సూచించబడుతుంది.
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: యహ్వే పట్ల, ఇశ్రాయేలు పట్ల బాధ్యత నుంచి విముక్తులై ఉంటారు
  rationale: נְקִיִּים అంటే నిర్దోషులు లేదా బాధ్యత నుంచి విడుదలైనవారు కావచ్చు. ఇక్కడ సైనిక వాగ్దానాన్ని నెరవేర్చే సందర్భం కాబట్టి బాధ్యత నుంచి విముక్తి అనే సంబంధాత్మక-న్యాయ భావం సహజంగా సరిపోతుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לַאֲחֻזָּה
  choice: స్వాస్థ్యంగా
  rationale: אֲחֻזָּה సూచించే స్థిరమైన భూస్వాధీనాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా, బైబిలీయ సందర్భానికి తగిన రీతిలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ మూలంలోని వ్యక్తిగత దైవనామాన్ని పారదర్శకంగా నిలుపుతూ ‘యహ్వే’ అని ధ్వన్యంతరీకరించాం.
- issue: נְקִיִּים యొక్క ఒడంబడికపరమైన భావం
  choice: బాధ్యత నుంచి విముక్తులై ఉంటారు
  alternative: నిర్దోషులుగా ఉంటారు; అపరాధం లేనివారిగా ఉంటారు
  rationale: ఈ సందర్భంలో రూబేను, గాదు గోత్రాలు తమ వాగ్దానబద్ధమైన సైనిక కర్తవ్యాన్ని పూర్తి చేయడం ప్రధానాంశం. అయినా పదంలోని నిర్దోషిత్వ భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవభరితమైన శైలి వాడబడింది. ‘సన్నిధిలో,’ ‘స్వాస్థ్యంగా’ వంటి పదాలు వాక్యపు ఒడంబడికపరమైన గంభీరతను నిలుపుతాయి; అస్పష్టత ఉన్న נְקִיִּיםకు ప్రధాన సందర్భార్థంతో పాటు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
