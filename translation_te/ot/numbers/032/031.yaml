id: NUM.32.31
reference: Numbers 32:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: te
  text: 'గాదు కుమారులూ రూబేను కుమారులూ జవాబుగా ఇలా అన్నారు: “యాహ్వే నీ సేవకులతో చెప్పిన ప్రకారమే మేము చేస్తాము.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నీ సేవకులతో చెప్పినదాన్నే మేము చేస్తాము.”
    reason: אֵת אֲשֶׁר ... כֵּן నిర్మాణాన్ని ‘ప్రకారమే’ అనే విధార్థ సంబంధంగా లేదా ‘చెప్పినదాన్నే’ అనే ప్రత్యక్ష కర్మ సంబంధంగా సహజంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: וַיַּעֲנוּ ... לֵאמֹר
  choice: జవాబుగా ఇలా అన్నారు
  rationale: సందర్భంలో ענה పలికిన మాటకు ప్రతిస్పందించడాన్ని సూచిస్తుంది. ‘జవాబుగా ఇలా అన్నారు’ అనేది ‘జవాబిచ్చి చెబుతూ’ అనే అసహజ నిర్మాణాన్ని నివారిస్తూ, హీబ్రూ వాక్యంలోని ప్రత్యుత్తర భావాన్నీ మాటల పరిచయాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: గాదు కుమారులూ రూబేను కుమారులూ
  rationale: హీబ్రూలో రెండుసార్లు ఉన్న בְּנֵי అనే పుత్ర సంబంధ నిర్మాణాన్ని నిలుపుతుంది; ‘గాదీయులు, రూబేనీయులు’ అని జాతిపేర్లుగా మార్చదు.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: చెప్పిన ప్రకారమే
  rationale: ఈ పరస్పర సంబంధ నిర్మాణం ‘ఏ విధంగా/ఏది చెప్పాడో, అలాగే’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘చెప్పిన ప్రకారమే’ సంక్షిప్తంగా, సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయ ప్రత్యక్ష కర్మ నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
- source_word: דִּבֶּר
  choice: చెప్పిన
  rationale: ఇప్పుడే ముందుగా పలికిన ఆజ్ఞను సూచించే హీబ్రూ సంపూర్ణ క్రియను తెలుగు సంబంధ క్రియారూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶל עֲבָדֶיךָ
  choice: నీ సేవకులతో
  rationale: ఇక్కడ עֲבָדֶיךָ మోషే ఎదుట తమను తాము వినయంగా పేర్కొనే సంబోధన; ‘బానిసలు’ అనే అర్థం సందర్భంలో ప్రధానమైనది కాదు. דִּבֶּר אֶל నిర్మాణానికి ‘సేవకులతో చెప్పిన’ సహజ తెలుగు సమానం.
- source_word: נַעֲשֶׂה
  choice: మేము చేస్తాము
  rationale: ఆజ్ఞను అమలు చేస్తామనే సరళమైన భవిష్యత్ సంకల్పాన్ని తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని కర్మను అదనంగా చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం; ‘యాహ్వే’ రూపం హీబ్రూ నామానికి ‘యెహోవా’ కంటే దగ్గరైన లిప్యంతరీకరణ.
- issue: ‘నీ సేవకులు’ అనే స్వీయసూచన
  choice: వినయపూర్వక స్వీయసూచనగా ‘నీ సేవకులు’
  alternative: నీ బానిసలు
  rationale: మాట్లాడేవారు మోషేకు విధేయతను ప్రకటిస్తున్నారు. ఇక్కడ సామాజిక బానిసత్వాన్ని ప్రత్యేకంగా ప్రతిపాదించకుండా, మూలంలోని వినయాన్నీ అధీనతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. హీబ్రూలోని పుత్ర సంబంధ పదబంధం రెండుసార్లు నిలుపబడింది. ఏకవచన రెండవ పురుష సూచనను ‘నీ’గా అనువదించడం ద్వారా మోషే ఒక్కడే సంబోధితుడని స్పష్టం చేయబడింది.
