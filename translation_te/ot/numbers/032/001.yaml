translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. గోత్రపేర్లను పారదర్శకంగా ఉంచి, హీబ్రూ పునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది.
