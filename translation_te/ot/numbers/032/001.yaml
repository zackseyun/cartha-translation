id: NUM.32.1
reference: Numbers 32:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: te
  text: రూబేను కుమారులకు, గాదు కుమారులకు పశుసంపద అత్యధికంగా ఉండేది.[a] వారు యాజేరు దేశాన్నీ గిలాదు దేశాన్నీ చూశారు. ఇదిగో, ఆ ప్రదేశం పశువులకు అనువైన ప్రదేశం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రూబేనీయులకు, గాదీయులకు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘రూబేను కుమారులకు, గాదు కుమారులకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ మూలం నొక్కిచెప్పడానికి ‘ప్రదేశం’ అనే పదాన్ని పునరుక్తి చేస్తుంది: ‘ఆ ప్రదేశం పశువులకు అనువైన ప్రదేశం.’'
    reason: source_form
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: పశుసంపద అత్యధికంగా
  rationale: מִקְנֶה అనేది పశువుల వంటి చరాస్తిని విస్తృతంగా సూచిస్తుంది; ‘పశుసంపద’ దాని పరిధిని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. רַב మరియు עָצוּם מְאֹד కలిపి తెలిపే బలమైన సమృద్ధిని ‘అత్యధికంగా’ వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: రూబేను కుమారులకు, గాదు కుమారులకు
  rationale: గోత్రసంబంధ అర్థం ఉన్నప్పటికీ, మూలంలోని ‘కుమారులు’ అనే పదాన్నీ రెండు పేర్లతో దాని పునరుక్తినీ పారదర్శకంగా నిలుపుతుంది.
- source_word: וַיִּרְאוּ
  choice: వారు ... చూశారు
  rationale: సరళమైన కథన క్రమాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని కాలార్థక ‘చూసినప్పుడు’ అనే భావాన్ని చేర్చదు.
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: యాజేరు దేశాన్నీ గిలాదు దేశాన్నీ
  rationale: אֶרֶץ యొక్క విస్తృత అర్థాన్ని ‘దేశం’ సహజంగా అందిస్తుంది; మూలంలోని పదపునరుక్తిని తెలుగులోని సమాంతర నిర్మాణం ప్రతిబింబిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: గమనించిన విషయంపై శ్రద్ధను ఆకర్షించే హీబ్రూ సంభాషణ సూచిక యొక్క ప్రత్యక్షతను నిలుపుతుంది.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: ఆ ప్రదేశం పశువులకు అనువైన ప్రదేశం
  rationale: మూలంలోని מָקוֹם పునరుక్తిని నిలుపుతూ, ‘పశువుల కోసం ఉన్న ప్రదేశం’ అనే ఉద్దేశించిన అనుకూలతను సహజమైన తెలుగులో తెలియజేస్తుంది.
