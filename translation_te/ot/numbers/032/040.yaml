  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: te
  text: మోషే గిలాదును మనష్షే కుమారుడైన మాకీరుకు ఇచ్చాడు, అతడు దానిలో స్థిరపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిలో నివసించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు ఈ భూభాగ పంపిణీ సందర్భంలో సహజమైన, నేరమైన అర్థం ‘ఇచ్చాడు’; ‘కేటాయించాడు’ అనేది సందర్భానుకూలమైనా మూలంలో లేని పరిపాలనా భావాన్ని కొంత జోడిస్తుంది.
- source_word: הַגִּלְעָד
  choice: గిలాదును
  rationale: ఇది స్థలనామం. హెబ్రీలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ తెలుగులో స్థలనామంతో దానిని ప్రత్యేకంగా వ్యక్తపరచాల్సిన అవసరం లేదు.
- source_word: לְמָכִיר
  choice: మాకీరుకు
  rationale: לְ ఇక్కడ స్వీకర్తను సూచిస్తోంది; తెలుగు సంప్రదాన విభక్తి ‘కు’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן מְנַשֶּׁה
  choice: మనష్షే కుమారుడైన
  rationale: בֶּן యొక్క ప్రత్యక్ష అర్థమైన ‘కుమారుడు’ను నిలిపి, విస్తృతమైన ‘వంశస్థుడు’ అనే భావాన్ని అనవసరంగా చేర్చలేదు.
- source_word: וַיֵּשֶׁב
  choice: స్థిరపడ్డాడు
  rationale: ישׁבకు ‘నివసించు/స్థిరపడు’ అనే అర్థాలు ఉన్నాయి. భూమిని ఇచ్చిన ఈ సందర్భంలో అక్కడ నివాసం ఏర్పరచుకున్న భావాన్ని ‘స్థిరపడ్డాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: בָּהּ
  choice: దానిలో
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం గిలాదు భూభాగాన్ని తిరిగి సూచిస్తోంది; తెలుగులో స్థలాన్ని సూచించేందుకు ‘దానిలో’ సహజమైన రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని వరుస క్రియల సంబంధాన్ని ‘కాబట్టి’ మరియు అర్ధవిరామంతో సహజంగా వ్యక్తపరిచాం. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
