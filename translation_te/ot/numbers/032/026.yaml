  terminology: ‘చిన్నపిల్లలు,’ ‘భార్యలు,’ ‘పశుసంపద,’ and ‘గిలాదు పట్టణాలు’ are suitable. ‘జంతువులన్నీ’ is preferable to ‘పెంపుడు జంతువులన్నీ’ for the final Hebrew term.
