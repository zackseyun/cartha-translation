source:
  edition: WLC
  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: te
  text: మా చిన్నపిల్లలు[a], మా భార్యలు, మా పశుసంపద, మా జంతువులన్నీ గిలాదు పట్టణాల్లో అక్కడే ఉంటాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మా పిల్లలు.’ హీబ్రూ పదం טַף ముఖ్యంగా చిన్నపిల్లలను లేదా ఇతరులపై ఆధారపడిన పిల్లలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అక్కడ ఉంటాయి.’ హీబ్రూ క్రియ కేవలం ‘ఉంటాయి’ అని చెబుతుంది; అయితే ఇతరులు యుద్ధానికి వెళ్లేటప్పుడు ఇవి అక్కడే ఉండిపోతాయనే భావం సందర్భంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: మా చిన్నపిల్లలు
  rationale: טַף సాధారణంగా చిన్నవారిని లేదా ఆధారపడిన పిల్లలను సూచిస్తుంది; సందర్భంలో యుద్ధానికి వెళ్లని కుటుంబంలోని చిన్నపిల్లలు ఉద్దేశించబడ్డారు.
- source_word: נָשֵׁינוּ
  choice: మా భార్యలు
  rationale: కుటుంబ, గోత్ర సందర్భంలో ఈ బహువచన రూపానికి సహజమైన అర్థం ‘మా భార్యలు’.
- source_word: מִקְנֵנוּ
  choice: మా పశుసంపద
  rationale: מִקְנֶה మందలు, పశువులు వంటి చరాస్తి రూపంలోని పశుసంపదను సూచిస్తుంది.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: మా పెంపుడు జంతువులన్నీ
  rationale: בְּהֵמָה విస్తృతంగా జంతువులను, ముఖ్యంగా మనుషుల అధీనంలోని జంతువులను సూచిస్తుంది; ముందున్న ‘పశుసంపద’తో పూర్తిగా కలిపివేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יִהְיוּ שָׁם
  choice: అక్కడే ఉంటారు
  rationale: క్రియ అక్షరార్థంగా ‘ఉంటారు’; అయితే యోధులు బయలుదేరగా వీరు అక్కడే ఉండే సందర్భార్థాన్ని ‘అక్కడే’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: గిలాదులోని పట్టణాల్లో
  rationale: గిలాదు ప్రాంతంలోని నివాస పట్టణాలను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘పశుసంపద’ మరియు ‘పెంపుడు జంతువులన్నీ’ ద్వారా సమీపార్థకమైన రెండు హీబ్రూ పదాల మధ్య ఉన్న స్వల్ప భేదం సాధ్యమైనంతవరకు నిలుపబడింది.
