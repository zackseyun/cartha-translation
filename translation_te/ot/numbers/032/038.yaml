source:
  edition: WLC
  text: וְ/אֶת נְב֞וֹ וְ/אֶת בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְ/אֶת שִׂבְמָ֑ה וַ/יִּקְרְא֣וּ בְ/שֵׁמֹ֔ת אֶת שְׁמ֥וֹת הֶ/עָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: te
  text: వారు నెబోను[a], బాల్-మెయోనును (వీటి పేర్లు మార్చబడ్డాయి), సిబ్మాను కట్టారు. తాము కట్టిన పట్టణాలకు వారు పేర్లు పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మార్చబడిన పేర్లతో.” హీబ్రూ పదబంధం నెబో, బాల్-మెయోను అనే పట్టణాల పేర్లు మార్చబడ్డాయని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: నెబో
  rationale: స్థల నామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: בַּעַל מְעוֹן
  choice: బాల్-మెయోను
  rationale: సంయుక్త స్థల నామాన్ని లిప్యంతరీకరించాం; దాని రెండు భాగాలు స్పష్టంగా కనిపించేందుకు హైఫన్ వాడాం.
- source_word: מוּסַבֹּת שֵׁם
  choice: పేర్లు మార్చబడిన
  rationale: ఈ పదబంధంలోని కర్మణి, ఫలితార్థాన్ని నిలుపుతూ, నెబో మరియు బాల్-మెయోను పేర్లు మారినట్లు సహజమైన తెలుగులో తెలిపాం; వాక్యనిర్మాణ సంబంధంలో ఉన్న స్వల్ప సందిగ్ధతను పాదటిప్పణిలో గుర్తించాం.
- source_word: שִׂבְמָה
  choice: సిబ్మా
  rationale: స్థల నామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: వారు పేర్లు పెట్టారు
  rationale: పేర్లు నిర్ణయించి పిలవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: పట్టణాలకు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పట్టణాల పేర్లను’ ఉన్నా, తెలుగు నామకరణ ప్రయోగంలో ‘పట్టణాలకు పేర్లు పెట్టారు’ అనడం సహజం.
- source_word: אֲשֶׁר בָּנוּ
  choice: తాము కట్టిన
  rationale: בנה అనే సాధారణ ‘కట్టు’ అర్థాన్నే ఉంచాం; సందర్భాన్ని బట్టి ‘తిరిగి కట్టారు’ అని విస్తరించలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. స్థల నామాలు లిప్యంతరీకరించబడ్డాయి; హీబ్రూ వాక్యంలోని నామకరణ పునరుక్తిని సహజ తెలుగు వాక్యనిర్మాణానికి తగినట్లు మృదువుగా మార్చాం.
