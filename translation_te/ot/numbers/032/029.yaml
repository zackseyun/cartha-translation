- from: 'మోషే వారితో ఇలా అన్నాడు: “గాదు వంశస్థులు, రూబేను వంశస్థులు—యుద్ధానికి ఆయుధాలు ధరించిన వారందరూ—యెహోవా సన్నిధిలో మీతో కలిసి యొర్దాను దాటి, ఆ దేశం మీ ఎదుట లోబడితే, గిలాదుదేశాన్ని వారికి స్వాస్థ్యంగా ఇవ్వాలి.”'
  to: 'మోషే వారితో ఇలా అన్నాడు: “గాదు వంశస్థులూ రూబేను వంశస్థులూ, యుద్ధానికి సాయుధులైన వారందరూ, యాహ్వే సన్నిధిలో మీతో కలిసి యొర్దాను దాటి, ఆ దేశం మీ ఎదుట లోబడితే, అప్పుడు మీరు వారికి గిలాదు దేశాన్ని స్వాస్థ్యంగా ఇవ్వాలి.”'
