id: NUM.32.29
reference: Numbers 32:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: te
  text: 'మోషే వారితో ఇలా అన్నాడు: “గాదు వంశస్థులూ రూబేను వంశస్థులూ, యుద్ధానికి సాయుధులైన వారందరూ, యాహ్వే సన్నిధిలో మీతో కలిసి యొర్దాను దాటి, ఆ దేశం మీ ఎదుట లోబడితే, అప్పుడు మీరు వారికి గిలాదు దేశాన్ని స్వాస్థ్యంగా ఇవ్వాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: గాదు వంశస్థులు, రూబేను వంశస్థులు
  rationale: పదశః ‘కుమారులు’ అన్నది ఇక్కడ గోత్రసభ్యులను సూచిస్తుంది; ‘వంశస్థులు’ తెలుగు పాఠకులకు ఆ సమూహార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: యొర్దాను దాటి
  rationale: עבר క్రియకు ఈ సందర్భంలో సహజమైన తెలుగు సమానార్థకం; నదిని దాటడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: యుద్ధానికి ఆయుధాలు ధరించిన వారందరూ
  rationale: חָלוּץ ఇక్కడ యుద్ధానికి సన్నద్ధమై ఆయుధాలు ధరించిన వారిని సూచిస్తుంది; అర్థాన్ని అతిగా విస్తరించకుండా స్పష్టపరుస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: లִפְנֵי యొక్క సన్నిధి/ముఖత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; యుద్ధం దేవుని సమక్షంలో జరుగుతున్నదనే ధార్మిక బలాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ לִפְנֵיכֶם
  choice: ఆ దేశం మీ ఎదుట లోబడితే
  rationale: నిఫ్అల్ రూపంలోని కర్మణి/ఫలిత భావాన్ని ‘లోబడితే’ సహజంగా తెలియజేస్తుంది; లִפְנֵיכֶם ను ‘మీ ఎదుట’గా నిలుపుతుంది.
- source_word: וּנְתַתֶּם לָהֶם ... לַאֲחֻזָּה
  choice: వారికి ... స్వాస్థ్యంగా ఇవ్వాలి
  rationale: షరతు నెరవేరిన తరువాత కలిగే బాధ్యతను తెలుగులో సహజంగా చూపిస్తూ, אֲחֻזָּה యొక్క స్థిర భూస్వామ్య భావాన్ని ‘స్వాస్థ్యం’గా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: לִפְנֵי יְהוָה యొక్క భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: ఇది కేవలం భౌగోళిక స్థానాన్ని కాక దేవుని సమక్షంలో, ఆయనకు సంబంధించిన కార్యంగా యుద్ధాన్ని చూపుతుంది; ‘సన్నిధిలో’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన హీబ్రూ షరతు వాక్యాన్ని డాష్‌లతో స్వల్పంగా క్రమబద్ధం చేసి, షరతు–ఫలిత సంబంధాన్ని స్పష్టంగా ఉంచాం. పాదటిప్పణులు అవసరం లేదు.
