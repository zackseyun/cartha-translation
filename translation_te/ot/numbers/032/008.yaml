  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: te
  text: నేను వారిని కాదేషు-బర్నేయ నుండి దేశాన్ని చూడడానికి పంపినప్పుడు మీ పితరులు ఇలాగే చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశాన్ని పరిశీలించడానికి” లేదా “దేశంపై నిఘా వేయడానికి.” హీబ్రూ క్రియకు అక్షరార్థం “చూడడం”; అయితే ఈ సందర్భంలో అది దేశాన్ని అన్వేషించి పరిశీలించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: ఇలాగే
  rationale: ప్రస్తుత పరిస్థితిని పూర్వతరంవారి ప్రవర్తనతో పోల్చే సూచనార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָשׂוּ
  choice: చేశారు
  rationale: గతంలో జరిగిన కార్యాన్ని తెలిపే సాధారణ భూతకాల రూపం.
- source_word: אֲבֹתֵיכֶם
  choice: మీ పితరులు
  rationale: మూలంలోని ‘మీ తండ్రులు/పితరులు’ అనే తరాల సంబంధాన్ని నిలుపుతుంది; సందర్భంలో ఇది మునుపటి తరాన్ని సూచిస్తుంది.
- source_word: בְּשָׁלְחִי
  choice: నేను ... పంపినప్పుడు
  rationale: בְּ + క్రియానామ రూపం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో కూడి, ఇక్కడ కాలార్థకంగా ‘నేను పంపినప్పుడు’ అని సహజంగా అనువదించబడుతుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: మునుపు ప్రస్తావించిన పితరులను, అంటే పూర్వతరంవారిని సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: కాదేష్‌-బర్నేయ నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, מִן ఉపసర్గంలోని ‘నుండి’ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה క్రియ యొక్క ప్రాథమిక అర్థమైన ‘చూడడం’ను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో దేశాన్ని పరిశీలించడం అనే విస్తృత భావం ఉందని పాదసూచిక తెలియజేస్తుంది.
- source_word: אֶת הָאָרֶץ
  choice: దేశాన్ని
  rationale: הָאָרֶץ ఇక్కడ వారు వెళ్లి చూడవలసిన నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
