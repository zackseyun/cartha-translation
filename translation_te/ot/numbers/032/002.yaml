  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: te
  text: 'అప్పుడు గాదు వంశస్థులు, రూబేను వంశస్థులు వచ్చి మోషేతో, యాజకుడైన ఎలియాజరుతో, సమాజపు నాయకులతో ఇలా అన్నారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד / בְנֵי רְאוּבֵן
  choice: గాదు వంశస్థులు / రూబేను వంశస్థులు
  rationale: హీబ్రూ ‘కుమారులు’ అనే పదాన్ని ఇక్కడ గోత్రసంబంధ సమూహాలను సూచించే సహజమైన ఆధునిక తెలుగు ‘వంశస్థులు’గా అందించాం.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: సమాజపు నాయకులు
  rationale: נְשִׂיאִים ఇక్కడ సమాజానికి ప్రాతినిధ్యం వహించే అధిపతులు లేదా నాయకులు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే ‘నాయకులు’ను ఎంచుకున్నాం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
