translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని భావసంబంధాలను నిలిపాం.
