source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בְּנֵי גָד֙ וּ/בְנֵ֣י רְאוּבֵ֔ן אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר עֲבָדֶ֣י/ךָ יַעֲשׂ֔וּ כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י מְצַוֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: te
  text: 'అప్పుడు గాదు వంశస్థులూ రూబేను వంశస్థులూ మోషేతో ఇలా అన్నారు: “మా ప్రభువు ఆజ్ఞాపించినట్టే మీ సేవకులమైన మేము చేస్తాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: గాదు వంశస్థులూ రూబేను వంశస్థులూ
  rationale: ఇక్కడ בְּנֵי అనేది ప్రత్యక్ష కుమారులను కాక గోత్ర/వంశ సభ్యులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: హీబ్రూ వాక్యప్రవేశకాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా కలిపి అనువదించింది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులమైన మేము
  rationale: మోషేను ఉద్దేశించిన రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, వినయపూర్వక స్వీయసూచనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנִי
  choice: మా ప్రభువు
  rationale: ఇది మోషేకు గౌరవసూచక సంబోధన; దైవనామంగా కాక మానవ అధిపతిని సూచించే భావాన్ని నిలుపుతుంది.
- source_word: מְצַוֶּה
  choice: ఆజ్ఞాపించినట్టే
  rationale: ఆజ్ఞాపించడం అనే మూలభావాన్ని, כַּאֲשֶׁר తో కూడిన ‘చెప్పిన ప్రకారమే’ అనే బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: אֲדֹנִי అనే పదం ఎవరిని సూచిస్తుంది
  choice: మోషేను ఉద్దేశించిన ‘మా ప్రభువు’
  alternative: దేవుణ్ణి సూచించే ‘ప్రభువు’
  rationale: వ్యాకరణపరంగా మూడవ పురుష దైవసూచన కాక, ఎదుట ఉన్న మోషేకు చేసిన గౌరవసూచక మొదటి పురుష సంబోధనగా ఉంది; ‘నీ సేవకులు’ అనే సమీప సందర్భమూ దీనికి మద్దతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ‘అని చెప్పి’ అనే పునరుక్తి తెలుగులో అసహజంగా ఉండకుండా ‘ఇలా అన్నారు’గా వ్యక్తీకరించబడింది. ‘చేస్తాం’ సాధారణ ఆధునిక భాషలో దృఢమైన భవిష్యత్ సంకల్పాన్ని తెలియజేస్తుంది.
