id: NUM.32.16
reference: Numbers 32:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֤וּ אֵלָי/ו֙ וַ֣/יֹּאמְר֔וּ גִּדְרֹ֥ת צֹ֛אן נִבְנֶ֥ה לְ/מִקְנֵ֖/נוּ פֹּ֑ה וְ/עָרִ֖ים לְ/טַפֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: te
  text: అప్పుడు వారు అతని దగ్గరకు వచ్చి, “మా పశువుల కోసం ఇక్కడ గొర్రెల దొడ్లు, మా చిన్నపిల్లల కోసం పట్టణాలు కట్టుకుంటాం[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కట్టుకుందాం.” ఇక్కడి హీబ్రూ క్రియ వారి సంకల్పాన్ని లేదా ప్రతిపాదనను సూచించవచ్చు.
    reason: వ్యాకరణ సంబంధమైన ప్రత్యామ్నాయం
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: వారు అతని దగ్గరికి వచ్చి
  rationale: נגשׁ భౌతికంగా సమీపించడాన్ని సూచిస్తుంది; ‘దగ్గరికి వచ్చి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం, అలాగే אֵלָיוలోని దిశాభావాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ కథన క్రియ; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ఉద్ధరణ తర్వాత ఉంచబడింది.
- source_word: גִּדְרֹת צֹאן
  choice: గొర్రెల దొడ్లు
  rationale: ఈ నిర్మాణ పదబంధం మంద కోసం కంచెతో ఏర్పరచిన ఆవరణలను సూచిస్తుంది; ‘గొర్రెల దొడ్లు’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נִבְנֶה
  choice: కట్టుకుంటాం
  rationale: మొదటి పురుష బహువచన అసంపూర్ణ క్రియ ఇక్కడ సంకల్పం లేదా ప్రతిపాదనను వ్యక్తం చేస్తుంది. ‘కట్టుకుంటాం’ వారి అవసరార్థం వారు నిర్మించాలనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִקְנֵנוּ
  choice: మా పశువుల కోసం
  rationale: מִקְנֶה కేవలం పశువులలో ఒక జాతిని కాక, విస్తృతంగా పెంపుడు పశుసంపదను సూచిస్తుంది; ‘పశువులు’ సందర్భానికి తగిన సమగ్ర పదం.
- source_word: פֹּה
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే సరళ అవ్యయానికి ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
- source_word: וְעָרִים
  choice: పట్టణాలు
  rationale: עָרִים నివాస స్థావరాలను సూచిస్తుంది. సందర్భంలోని రక్షిత నివాస ప్రాంతాల భావాన్ని అతిశయింపకుండా ‘పట్టణాలు’ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לְטַפֵּנוּ
  choice: మా చిన్నపిల్లల కోసం
  rationale: טַף ముఖ్యంగా సమాజంలోని చిన్నవారిని, ఆధారపడిన బలహీన సభ్యులను సూచించగలదు; ‘చిన్నపిల్లలు’ వయస్సు మరియు బలహీనత భావాలను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని భావక్రమాన్ని మరియు ప్రత్యక్ష వాక్యంలోని ప్రతిపాదన స్వరాన్ని కాపాడే తెలుగు నిర్మాణం ఎంచుకోబడింది.
