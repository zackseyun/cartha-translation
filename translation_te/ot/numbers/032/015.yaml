source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: te
  text: ఎందుకంటే, మీరు ఆయనను అనుసరించడం మానుకొని వెనుదిరిగితే[a], ఆయన మరొకసారి అతనిని అరణ్యంలో ఉండనిస్తాడు[b]; అప్పుడు మీరు ఈ ప్రజలందరికీ నాశనం కలిగిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆయన వెనుక నుండి తిరిగితే’; ఇది ఆయనను అనుసరించడం మానుకోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘అతనిని అరణ్యంలో ఉండనిస్తాడు’ అని ఏకవచన సర్వనామం ఉంది. ఇది ఇశ్రాయేలును లేదా ఆ ప్రజలను సమష్టిగా సూచిస్తుండవచ్చు. కొన్ని అనువాదాలు దీన్ని ‘వారిని’ లేదా ‘ఇశ్రాయేలును’ అని స్పష్టం చేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే, … వెనుదిరిగితే
  rationale: ముందటి హెచ్చరికకు కారణాన్ని తెలియజేసే భావాన్నీ, షరతును తెలియజేసే భావాన్నీ కలిపి వ్యక్తం చేస్తుంది.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: ఆయనను అనుసరించడం మానుకొని వెనుదిరిగితే
  rationale: అక్షరార్థంగా ‘ఆయన వెనుకనుండి తిరిగితే’; సందర్భంలో ఆయనను అనుసరించడం విడిచిపెట్టడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְיָסַף עוֹד
  choice: మరొకసారి
  rationale: ఈ పదబంధం ఒక కార్యం మళ్లీ జరుగుతుందని సూచిస్తుంది.
- source_word: לְהַנִּיחוֹ
  choice: అతణ్ణి … ఉండనిస్తాడు
  rationale: హిఫీల్ రూపం ‘ఉండనివ్వడం/విడిచిపెట్టడం’ అనే భావాన్ని ఇస్తుంది. హీబ్రూలోని ఏకవచన ప్రత్యయాన్ని ప్రధాన పాఠ్యంలో నిలిపి ఉంచింది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలోనే
  rationale: మిద్బార్‌కు పెంటటూకులో సహజమైన సమానార్థకం ‘అరణ్యం’; ‘నే’ అక్కడే మిగిలే తీర్పు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשִׁחַתֶּם
  choice: నాశనం కలిగిస్తారు
  rationale: ప్రజలపై వినాశకరమైన ఫలితాన్ని తీసుకురావడం అనే కారణార్థక భావాన్ని వ్యక్తం చేస్తుంది; తక్షణ భౌతిక సంహారానికి మాత్రమే అర్థాన్ని పరిమితం చేయదు.
- source_word: לְכָל הָעָם הַזֶּה
  choice: ఈ ప్రజలందరికీ
  rationale: హీబ్రూ సమష్టి ఏకవచనమైన ‘ఈ ప్రజలందరికీ’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: לְהַנִּיחוֹలోని ఏకవచన సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతణ్ణి’ అనే ఏకవచనాన్ని నిలిపి, అది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే అవకాశం ఉందని పాదసూచికలో తెలిపింది.
  alternative: ‘వారిని’ అని బహువచనంగా సులభీకరించడం లేదా ‘ఇశ్రాయేలును’ అని స్పష్టంగా పేర్కొనడం.
  rationale: హీబ్రూ పాఠ్యంలో ప్రత్యయం ఏకవచనంలో ఉంది. అది ‘ఈ ప్రజలు’ అనే సమష్టిని ఒక వ్యక్తిలా సూచిస్తుండవచ్చు; దాన్ని నిశ్శబ్దంగా బహువచనంగా మార్చకుండా మూలంలోని ఉద్వేగాన్ని కాపాడటం సముచితం.
- issue: וְשִׁחַתֶּם యొక్క వినాశకర భావం
  choice: ‘నాశనం కలిగిస్తారు’
  alternative: ‘నాశనం చేస్తారు’
  rationale: ఇక్కడ వారి వెనుదిరుగుదల వల్ల ప్రజలపై తీర్పు రావడం ప్రధాన భావం. కారణార్థక ఫలితాన్ని నిలిపి, వారు స్వయంగా ప్రజలను నేరుగా సంహరిస్తారనే అర్థానికి మాత్రమే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’తో దేవుని సూచించి, తరువాతి హీబ్రూ సమష్టి ఏకవచనాన్ని ‘అతణ్ణి’గా వేరుచేసింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా ఉన్నప్పటికీ, మూలంలోని ఏకవచన అస్పష్టతను పాదసూచికతో సంరక్షించింది.
