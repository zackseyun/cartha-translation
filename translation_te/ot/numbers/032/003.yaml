  yaml_path: translation/ot/numbers/032/003.yaml
  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: te
  text: అతారోతు, దీబోను, యాజేరు, నిమ్రా, హెష్బోను, ఎల్యాలే, సెబాము[a], నెబో, మరియు బెఓను[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘సెబాము’; సంబంధిత స్థలనామం ఇతర చోట్ల ‘సిబ్మా’ లేదా ‘షిబ్మా’ అనే రూపంలో కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘బెఓను’; సంబంధిత స్థలనామం ఇతర చోట్ల ‘బాల్-మెయోను’ అనే విస్తృత రూపంలో కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: అతారోతు
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: דִיבֹן
  choice: దీబోను
  rationale: హీబ్రూ దీబోన్ అనే స్థలనామాన్ని సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: יַעְזֵר
  choice: యాజేరు
  rationale: హీబ్రూ యా‘జేర్ రూపాన్ని తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: נִמְרָה
  choice: నిమ్రా
  rationale: ఈ వచనంలోని సంక్షిప్త స్థలనామాన్నే నిలిపాం; ఇతర సందర్భాల్లో కనిపించే విస్తృత రూపంతో సమన్వయపరచలేదు.
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: స్థిరపడిన బైబిలు స్థలనామ రూపానికి దగ్గరగా, హీబ్రూ వ్యంజనాలను కాపాడుతూ లిప్యంతరీకరించాం.
- source_word: אֶלְעָלֵה
  choice: ఎల్యాలే
  rationale: హీబ్రూ అక్షర క్రమాన్ని ప్రతిబింబిస్తూ, తెలుగులో సహజంగా పలికే రూపాన్ని ఎంచుకున్నాం.
- source_word: שְׂבָם
  choice: సెబాము
  rationale: ఈ వచనంలోని שׂבם రూపాన్నే నేరుగా ప్రతిబింబించాం; ఇతర చోట్ల కనిపించే సిబ్మా/షిబ్మా రూపాలతో మౌనంగా సమన్వయపరచలేదు.
- source_word: נְבוֹ
  choice: నెబో
  rationale: ప్రచలితమైన స్థలనామ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: בְּעֹן
  choice: బెయోను
  rationale: ఈ వచనంలో ఉన్న సంక్షిప్త రూపాన్నే నిలిపాం; ఇతర చోట్ల కనిపించే ‘బయల్-మెయోను’ అనే విస్తృత రూపాన్ని ఇక్కడ చేర్చలేదు.
- source_word: וְ / וּ
  choice: జాబితాలో విరామచిహ్నాలు, చివరి పేరుకు ముందు సంధి లేకుండా వరుస
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు వావ్ ఉన్నా, ఆధునిక తెలుగులో ప్రతి పేరుకు ‘మరియు’ పునరావృతం చేయడం భారంగా ఉంటుంది. కామాలతో కూడిన వరుస మూలంలోని జాబితా భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ స్థలనామాల జాబితాను సహజంగా అందించాం. మూలపాఠంలోని పేర్ల ప్రత్యేక రూపాలను సమన్వయం చేయకుండా నిలిపాం. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచాం; పాదసూచిక గుర్తులను అవి వివరిస్తున్న ‘సెబాము’, ‘బెయోను’ పేర్లకే జతచేశాం.
