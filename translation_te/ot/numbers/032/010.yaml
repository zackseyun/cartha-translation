base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: te
  text: 'ఆ రోజున యాహ్వే[a] కోపం రగిలి, ఆయన ఇలా ప్రమాణం చేశాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; ‘యెహోవా’ అని కూడా లిప్యంతరీకరించబడుతుంది.'
    reason: దైవనామమైన יהוהకు వాడుకలో ఉన్న ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: חרה + אף అనే హీబ్రూ నుడికారం కోపం వేడెక్కడం లేదా మండడాన్ని సూచిస్తుంది. ‘కోపం రగులుకుంది’ మూలంలోని రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కథన సందర్భంలో కాలాన్ని సహజంగా, నేరుగా తెలియజేసే ఆధునిక తెలుగు రూపం.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: నిఫాల్ రూపం ప్రమాణం చేయడం లేదా ఒట్టు పెట్టుకోవడం అనే అర్థాన్ని ఇస్తుంది. ‘ప్రమాణం చేశాడు’ గంభీరమైనదిగా, స్పష్టమైనదిగా ఉంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే ప్రమాణ వాక్యాన్ని పరిచయం చేసే ఈ హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని అందించి, కోలన్‌తో దాని కొనసాగింపును చూపించాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచాం; తెలుగు పాఠకులకు బాగా పరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో వాడి, ‘యాహ్వే’ను పాదసూచికలో ప్రత్యామ్నాయ లిప్యంతరీకరణగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కోపం మండే రూపకాన్ని నిలుపుతూ, తదుపరి వచనానికి దారితీసే ప్రమాణ పరిచయాన్ని కోలన్‌తో స్పష్టం చేశాం.
