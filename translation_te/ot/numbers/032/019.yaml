  source_fidelity: 'ప్రధాన అనువాదం హెబ్రీ వాక్యార్థాన్ని నమ్మకంగా అందిస్తుంది: నది అవతలి/ఆపై ప్రాంతంలో ఇతర గోత్రాలతో వారసత్వం పొందబోమని, యొర్దాను తూర్పున తమకు స్వాస్థ్యం లభించిందని చెబుతుంది. పాదసూచికలో మాత్రం בָאָה ... אֵלֵינוּ యొక్క ప్రత్యామ్నాయాన్ని మరింత నేరుగా, పూర్తి పదబంధంగా ఇవ్వడం అవసరం.'
