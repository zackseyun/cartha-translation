translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘స్వాస్థ్యం’ అనే బైబిలు భూవాటా పదాన్ని నిలిపి, రెండు దిశా పదబంధాల మధ్య ఉన్న వక్త-కేంద్రిత భేదాన్ని సహజంగా తెలిపింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
