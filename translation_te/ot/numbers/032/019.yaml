source:
  edition: WLC
  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: te
  text: ఎందుకంటే, యొర్దాను అవతల, ఇంకా ముందుకు వారితో కలిసి మేము స్వాస్థ్యం పొందము; యొర్దానుకు తూర్పువైపున మా స్వాస్థ్యం మాకు లభించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను తూర్పువైపున మా స్వాస్థ్యం మాకు వచ్చింది.”
    reason: בָאָה ... אֵלֵינוּ అనే పదబంధాన్ని ‘లభించింది’కి బదులుగా మరింత నేరుగా ‘మాకు వచ్చింది’ అని అనువదించవచ్చు; నַחֲלָתֵנוּ యొక్క భూవాటా/వారసత్వ భావం ప్రధాన పాఠ్యంలోని ‘స్వాస్థ్యం’ ద్వారా నిలుస్తుంది.
lexical_decisions:
- source_word: נִנְחַל
  choice: మేము స్వాస్థ్యం పొందము
  rationale: נחל అనే క్రియ భూభాగాన్ని వారసత్వ వాటాగా పొందడాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం పొందము’ అనేది భవిష్యదర్థాన్ని, భూవాటా భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אִתָּם
  choice: వారితో కలిసి
  rationale: ఇతర గోత్రాలతో ఉమ్మడిగా స్వాస్థ్యం పొందడాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: యొర్దాను అవతల ఇంకా ముందుకు
  rationale: וָהָלְאָה లోని ‘ఇంకా ముందుకు/ఆపైకి’ అనే స్థలవిస్తరణ భావాన్ని తొలగించకుండా, వక్తల దృష్టికోణంలో యొర్దాను అవతలి ప్రాంతాన్ని సూచిస్తుంది.
- source_word: בָאָה
  choice: లభించింది
  rationale: అక్షరార్థంగా ‘వచ్చింది’ అయినా, స్వాస్థ్య వాటా సందర్భంలో ‘మాకు లభించింది’ సహజంగా ఉంటుంది; పూర్తయిన పొందికను సూచించే పరిపూర్ణ క్రియ భావాన్ని కాపాడుతుంది.
- source_word: נַחֲלָתֵנוּ
  choice: మా స్వాస్థ్యం
  rationale: భూవాటాగా లభించిన వారసత్వ ఆస్తి అనే నిబంధనాత్మక భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֵלֵינוּ
  choice: మాకు
  rationale: בָאָה తో కలిసి ‘మాకు లభించింది’ అనే సహజ తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: యొర్దానుకు తూర్పువైపున
  rationale: מִזְרָחָה ను స్పష్టంగా ‘తూర్పువైపున’ అని అందిస్తూ, ఇక్కడ עֵבֶר సూచించే యొర్దాను తూర్పు ప్రాంతాన్ని సందర్భానుసారంగా నిర్దిష్టం చేస్తుంది.
