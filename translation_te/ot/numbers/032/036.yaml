translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యం 34వ వచనంలోని ‘కట్టారు’ అనే క్రియపై ఆధారపడుతుంది; స్వతంత్ర వచనంగా సులభంగా చదవడానికి ఆ క్రియను ఇక్కడ పునరుద్ధరించాం. స్థలనామాలను అనువదించకుండా లిప్యంతరీకరించాం.
