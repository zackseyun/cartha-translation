  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: te
  text: బేత్-నిమ్రా, బేత్-హారాన్ అనే బలపరచబడిన పట్టణాలనూ[a], గొర్రెల కొట్టాలనూ[b] కట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోటపట్టణాలు.”
    reason: עָרֵי מִבְצָרకు సాధ్యమైన సంక్షిప్త ప్రత్యామ్నాయ రూపం.
  - marker: b
    text: లేదా, “గొర్రెల దొడ్లు” లేదా “మందల కొట్టాలు.”
    reason: גִדְרֹת צֹאןకు సాధ్యమైన ప్రత్యామ్నాయ రూపాలు.
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: బేత్-నిమ్రా
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: בֵּית הָרָן
  choice: బేత్-హారాను
  rationale: ఇది స్థిరమైన పట్టణనామం; ‘హారాను ఇల్లు’ అని అర్థానువాదం చేస్తే స్థలనామ స్వభావం మరుగునపడుతుంది. వాక్యంలో కర్మరూపానికి అనుగుణంగా ‘ను’ చేర్చబడింది.
- source_word: עָרֵי מִבְצָר
  choice: ప్రాకార పట్టణాలు
  rationale: ఈ సంయుక్త పదబంధం రక్షణ కోసం బలపరచబడిన పట్టణాలను సూచిస్తుంది; ‘ప్రాకార పట్టణాలు’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: גִדְרֹת צֹאן
  choice: గొర్రెల మందల దొడ్లు
  rationale: ఈ పదబంధం గొర్రెలు లేదా చిన్న పశువుల మందలను ఉంచే కంచెగల ప్రదేశాలను సూచిస్తుంది. సందర్భంలో పశుసంపద ప్రధానంగా ఉన్నందున ఈ రూపం స్పష్టంగా ఉంటుంది.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: '...ను, ...ను ... కూడా'
  rationale: పునరుక్త సంధులు, కర్మసూచకాలు ముందరి వచనం నుంచి కొనసాగే జాబితాను చూపుతాయి. తెలుగులో ‘కూడా’తో కూడిన జాబితా ఆ అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
