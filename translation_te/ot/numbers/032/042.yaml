source:
  edition: WLC
  text: וְ/נֹ֣בַח הָלַ֔ךְ וַ/יִּלְכֹּ֥ד אֶת קְנָ֖ת וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יִּקְרָ֧א לָ֦/ה נֹ֖בַח בִּ/שְׁמֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: te
  text: నోబహు వెళ్లి కెనాతును, దాని అనుబంధ గ్రామాలను[a] స్వాధీనం చేసుకొని, దానికి తన పేరుమీద నోబహు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దాని కుమార్తెలు”; ఇది కెనాతుపై ఆధారపడిన చిన్న నివాస ప్రాంతాలను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: నోబహు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం; పట్టణానికి పెట్టిన పేరులోనూ అదే రూపాన్ని నిలిపాం.
- source_word: הָלַךְ
  choice: వెళ్లి
  rationale: కథన క్రమంలో ఇది సాధారణ గమనాన్ని సూచిస్తుంది; తదుపరి క్రియతో సహజంగా కలిసే తెలుగు రూపం.
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకొని
  rationale: లכד అనే పదం ఇక్కడ సైనిక సందర్భంలో పట్టుకోవడం లేదా వశపరచుకోవడం అనే భావం ఇస్తుంది; ‘స్వాధీనం చేసుకొని’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קְנָת
  choice: కెనాతు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּנֹתֶיהָ
  choice: దాని అనుబంధ గ్రామాలను
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలను’; ప్రధాన పట్టణంపై ఆధారపడిన చిన్న నివాస ప్రాంతాలను సూచించే హీబ్రూ నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: וַיִּקְרָא לָהּ
  choice: దానికి ... అని పెట్టాడు
  rationale: קרא + ל నిర్మాణం పేరు పెట్టడాన్ని సూచిస్తుంది; తెలుగులో ‘పేరు పెట్టాడు’ సహజమైన ప్రయోగం.
- source_word: בִּשְׁמוֹ
  choice: తన పేరునే
  rationale: ఆ స్థలానికి నోబహు తన పేరును పెట్టాడనే సంబంధాన్ని స్పష్టంగా చూపుతుంది; ‘నే’ మూలంలోని పేరుపునరావృత ప్రాధాన్యాన్ని సహజంగా తెలియజేస్తుంది.
