source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: te
  text: మనష్షే కుమారుడైన మాకీరు కుమారులు గిలాదుకు వెళ్లి, దాన్ని స్వాధీనం చేసుకున్నారు; దానిలో ఉన్న అమోరీయులను[a] వెళ్లగొట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అమోరీయుడు’ అని ఏకవచన రూపం ఉంది; అది ఇక్కడ అమోరీయ ప్రజలను సమూహంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ముందున్న క్రియలు బహువచనంలో ఉన్నప్పటికీ, హీబ్రూ పాఠంలో ఇక్కడ ‘వెళ్లగొట్టాడు’ అనే ఏకవచన క్రియ ఉంది. ఇది మాకీరు వంశాన్ని ఒక సమూహంగా ఏకవచనంలో పేర్కొనవచ్చు; లేదా పాఠ్యపరమైన లేదా శైలీపరమైన మార్పు కావచ్చు. కొన్ని అనువాదాలు దీనిని ‘వారు వెళ్లగొట్టారు’ అని సవరించి చెబుతాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లి
  rationale: הלך ఇక్కడ సాధారణ కథన క్రియగా ‘వెళ్లారు’ అనే భావాన్ని ఇస్తుంది; ఎత్తైన ప్రాంతానికి వెళ్లారనే భావాన్ని మూలపాఠం తప్పనిసరిగా సూచించదు.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: మనష్షే కుమారుడైన మాకీరు కుమారులు
  rationale: בני అనే బంధుత్వ పదబంధాన్ని సాధ్యమైనంత ప్రత్యక్షంగా నిలుపుతుంది; సందర్భంలో ఇది కుమారులు లేదా వంశస్థులను సమూహంగా సూచించవచ్చు.
- source_word: גִּלְעָדָה
  choice: గిలాదుకు
  rationale: దిశను సూచించే ה־ను తెలుగులో గమ్యస్థాన విభక్తితో సహజంగా వ్యక్తం చేసింది.
- source_word: וַיִּלְכְּדֻהָ
  choice: దాన్ని స్వాధీనం చేసుకున్నారు
  rationale: לכד ఒక ప్రాంతాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే సైనిక భావాన్ని ఇస్తుంది; ‘దాన్ని’ గిలాదును సూచిస్తుంది.
- source_word: וַיּוֹרֶשׁ
  choice: అతడు వెళ్లగొట్టాడు
  rationale: హిఫీల్ రూపంలోని ירש అక్కడి ప్రజలను వారి భూభాగం నుంచి తొలగించడం అనే భావాన్ని ఇస్తుంది. మసొరేటిక్ పాఠంలోని ఏకవచన క్రియను ‘అతడు’తో బహిర్గతం చేసి, ముందున్న బహువచన క్రియలతో ఉన్న ఉద్రిక్తతను అడుగుసూచనలో నిలిపాము.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: హీబ్రూలో రూపం ఏకవచనమైనా, జాతిపేరుగా సమూహార్థంలో ఉంది; తెలుగులో బహువచనం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּהּ
  choice: అక్కడ ఉన్న
  rationale: గిలాదులో నివసించిన అమోరీయులను సూచించే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
