translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని బహువచనం నుంచి ఏకవచనానికి వచ్చే ఆకస్మిక మార్పును ప్రధాన పాఠంలోనూ అడుగుసూచనలోనూ నిలిపి, అస్పష్టతను పరిష్కరించకుండా ఉంచాం.
