translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పట్టణాలను’ అనే పదం హెబ్రీలో ప్రత్యక్షంగా లేకపోయినా, వరుసగా వచ్చిన స్థలనామాలు నిర్మించబడిన పట్టణాలని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేయడానికి చేర్చబడింది.
