source:
  edition: WLC
  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: te
  text: రూబేను కుమారులు[a] హెష్బోను, ఎల్యాలే, కిర్యాతయీములను నిర్మించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రూబేనీయులు హెష్బోను, ఎల్యాలే, కిర్యాతయీములను నిర్మించారు.”
    reason: ‘రూబేను కుమారులు’ అనే హెబ్రీ పదబంధం రూబేను గోత్రస్థులను సూచిస్తుంది; అక్షరార్థ రూపంతో పాటు సహజమైన గోత్రనామ ప్రత్యామ్నాయాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: בְנֵי అనే పదానికి అక్షరార్థంగా ‘కుమారులు’ అని అర్థం; గోత్రపిత పేరుతో కూడిన ఈ నిర్మాణం అతని వంశస్థులను సూచిస్తుంది. తెలుగు భాషలో సహజంగా ఉండేలా వంశపరమైన హెబ్రీయ రూపాన్ని నిలిపింది.
- source_word: בָּנוּ
  choice: నిర్మించారు
  rationale: בנה క్రియ యొక్క సాధారణ అర్థం ‘కట్టడం/నిర్మించడం’. ఈ సందర్భంలో పునర్నిర్మాణం లేదా పట్టణాలను స్థిరపరచడం సూచితమై ఉండవచ్చుగానీ, మూలపాఠం దానిని స్పష్టంగా చెప్పదు; అందువల్ల విస్తృతమైన ప్రాథమిక అర్థాన్ని ఎంచుకున్నాం.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది హెబ్రీ భాషలో నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు. ‘పట్టణాలను’ అనే కర్మరూపంలో వాక్య సంబంధం వ్యక్తమైంది.
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: హెబ్రీ స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֶלְעָלֵא
  choice: ఎలాలే
  rationale: మసొరేటిక్ పాఠంలోని హెబ్రీ స్థలనామాన్ని తెలుగు పాఠకులకు పలకడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: קִרְיָתָיִם
  choice: కిర్యాతయిము
  rationale: హెబ్రీ స్థలనామంలోని ప్రధాన ధ్వనులను నిలుపుతూ తెలుగు లిపిలో సాంప్రదాయికంగా చదవగల రూపాన్ని ఉపయోగించాం.
