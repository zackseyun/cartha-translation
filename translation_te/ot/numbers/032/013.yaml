source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: te
  text: యాహ్వే కోపం ఇశ్రాయేలుపై రగిలింది[a]. యాహ్వే దృష్టిలో చెడు చేసిన ఆ తరమంతా అంతమయ్యే వరకు ఆయన వారిని నలభై సంవత్సరాలు అరణ్యంలో తిరిగేలా చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో విధంగా: ‘యాహ్వే ఇశ్రాయేలుపై కోపపడ్డాడు.’ హీబ్రూ నుడికారంలో అక్షరార్థంగా ‘యాహ్వే నాసిక మండింది’ అని ఉంది; ఇది తీవ్రమైన కోపాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'మరో విధంగా: ‘ఆయన వారిని అరణ్యంలో సంచరింపజేశాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: యాహ్వే కోపం రగులుకుంది
  rationale: కోపం ‘మండడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; కేవలం ‘కోపపడ్డాడు’ అనడం కంటే మూలంలోని తీవ్రతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: కోపానికి గురైన పక్షాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: וַיְנִעֵם
  choice: ఆయన వారిని ... తిరిగేలా చేశాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థక భావాన్ని నిలుపుతుంది; వారు తమంతట తాము తిరిగారని కాక, ఆయన వారిని అలా చేశాడని తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: నిర్గమణ సందర్భంలోని మిద్బార్‌కు తెలుగులో స్థిరమైన, విస్తృతార్థకమైన పదం.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: సంఖ్యా కాలవ్యవధిని నేరుగా అనువదిస్తుంది.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: ఆ తరం వారందరూ అంతమయ్యే వరకు
  rationale: తరం మొత్తము ముగింపుకు రావడం, అంటే ఆ తరానికి చెందిన వారందరూ లేకపోవడం అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הָעֹשֶׂה הָרַע
  choice: చెడు చేసిన
  rationale: సమూహవాచకమైన ‘తరం’ను విశేషించే హీబ్రూ కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక రూపంలో ఇస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: ‘యాహ్వే కళ్లలో’ అనే హీబ్రూ మూలరూపంలోని మూల్యాంకన భావాన్ని సహజమైన తెలుగు నుడికారంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- issue: దైవకోప చిత్రణ
  choice: యాహ్వే కోపం రగులుకుంది
  alternative: యాహ్వే ఇశ్రాయేలుపై కోపపడ్డాడు
  rationale: కోపం మండిందనే మూలభాషా రూపకాన్ని మెత్తబరచకుండా నిలిపింది; దానికి అదనపు సిద్ధాంత వివరణను జోడించలేదు.
- issue: అరణ్య సంచారంలో దేవుని కారణకర్తృత్వం
  choice: ఆయన వారిని ... తిరిగేలా చేశాడు
  alternative: వారు ... తిరిగారు
  rationale: וַיְנִעֵם లోని కారణార్థక వ్యాకరణాన్ని కాపాడి, దేవుని తీర్పు మరియు మానవ క్రియ మధ్య మూలపాఠంలో ఉన్న ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే దైవకోప రూపకం, దైవనామం, కారణార్థక క్రియ వంటి మూలపాఠ విశేషాలు నిలుపబడ్డాయి. ‘తరం వారందరూ’ అనే ప్రయోగం సమూహవాచక భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
