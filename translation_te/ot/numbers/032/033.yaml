  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. గోత్రపేర్లు సాధారణ పాఠకులకు సహజంగా ఉండేందుకు ‘వంశీయులు’ ఉపయోగించబడింది; మూలంలోని చివరి పదబంధపు అస్పష్టతను పాదసూచికలో నిలిపాం.
