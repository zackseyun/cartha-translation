source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: te
  text: మోషే గాదు వంశీయులకు, రూబేను వంశీయులకు, యోసేపు కుమారుడైన మనష్షే అర్ధగోత్రానికి అమోరీయుల రాజైన సీహోను రాజ్యాన్నీ, బాషాను రాజైన ఓగు రాజ్యాన్నీ—ఆ దేశాన్నీ, దాని పట్టణాలనూ, వాటి ప్రాంతాల్లోని చుట్టుపక్కల దేశపు పట్టణాలనూ—ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశాన్ని దాని పట్టణాలతో, వాటి సరిహద్దులతో సహా—చుట్టుపక్కల దేశపు పట్టణాలను—ఇచ్చాడు.” చివరి హీబ్రూ పదబంధం వాక్యనిర్మాణపరంగా సంక్షిప్తంగా ఉంది; అందువల్ల దగ్గరి సంబంధమున్న అనేక అనువాదాలు సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: ఈ భూభాగాన్ని అప్పగించిన సందర్భంలో נתן అనే క్రియకు సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: గాదు వంశీయులకు ... రూబేను వంశీయులకు
  rationale: హీబ్రూ ‘కుమారులు’ అనే గోత్ర సంబంధ నుడికారాన్ని తెలుగులో సహజంగా అర్థమయ్యే ‘వంశీయులు’గా వ్యక్తం చేస్తుంది.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה בֶן יוֹסֵף
  choice: యోసేపు కుమారుడైన మనష్షే అర్ధగోత్రానికి
  rationale: మనష్షే వంశావళి గుర్తింపును నిలుపుతూ ‘అర్ధగోత్రం’ అనే నిర్మాణాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: מַמְלֶכֶת
  choice: రాజ్యం
  rationale: సీహోను, ఓగు పరిపాలించిన భూభాగాలను సూచించే ממלכה కు ప్రత్యక్షమైన తెలుగు సమానం.
- source_word: הָאָרֶץ לְעָרֶיהָ בִּגְבֻלֹת עָרֵי הָאָרֶץ סָבִיב
  choice: ఆ దేశాన్ని, దాని పట్టణాలను వాటి సరిహద్దులతో సహా, చుట్టుపక్కల దేశంలోని పట్టణాలను
  rationale: హీబ్రూ ముగింపు వాక్యభాగం సంక్షిప్తంగా, వాక్యనిర్మాణపరంగా అనిశ్చితంగా ఉంది; ఈ రూపం దేశం, పట్టణాలు, వాటి సరిహద్దులు అనే అంశాలను చదవదగిన తెలుగులో నిలుపుతుంది.
