revisions:
- from: మేమే ఆయుధాలు ధరించి యెహోవా సన్నిధిలో కనాను దేశంలోకి దాటి వెళ్తాము; యొర్దాను ఇవతల ఉన్న మా స్వాస్థ్యపు భాగం మాదిగానే ఉంటుంది.[a]
  to: మేమే ఆయుధసన్నద్ధులమై యెహోవా ముందు కనాను దేశంలోకి దాటి వెళ్తాము; యొర్దాను ఇవతల ఉన్న మా వారసత్వ స్వాస్థ్యం మాతోనే ఉంటుంది.[a]
  rationale: The revision removes the unsupported exclusivity of “మాదిగానే,” retains the Hebrew ‘with us’ with “మాతోనే,” and uses “వారసత్వ స్వాస్థ్యం” to represent both possession and inheritance. “యెహోవా ముందు” preserves the source wording’s breadth without imposing a narrower interpretation. The footnote continues to signal the deictic ambiguity of מֵעֵבֶר לַיַּרְדֵּן.
