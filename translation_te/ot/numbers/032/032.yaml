  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: te
  text: మేమే ఆయుధసన్నద్ధులమై యెహోవా ముందు కనాను దేశంలోకి దాటి వెళ్తాము; యొర్దాను ఇవతల ఉన్న మా వారసత్వ స్వాస్థ్యం మాతోనే ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను అవతల” లేదా “యొర్దాను ఆవలి వైపున.” హీబ్రూ పదబంధం వక్త చూసే దిశపై ఆధారపడి అర్థమవుతుంది. ఇక్కడ మాట్లాడుతున్నవారు యొర్దానుకు తూర్పున ఉన్నందున “ఇవతల” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: మేమే
  rationale: స్వతంత్ర సర్వనామం క్రియలో ఇప్పటికే ఉన్న ప్రథమ పురుష బహువచన భావాన్ని నొక్కిచెబుతుంది; ‘మేమే’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: נַעֲבֹר
  choice: దాటి వెళ్తాము
  rationale: עבר క్రియ ఇక్కడ యొర్దాను నదిని దాటే భవిష్యత్ నిబద్ధతను సూచిస్తుంది.
- source_word: חֲלוּצִים
  choice: ఆయుధాలు ధరించి
  rationale: ఈ సైనిక సందర్భంలో యుద్ధానికి ఆయుధసన్నద్ధులై ఉండడాన్ని సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనే పదంలోని ‘ముందు/సన్నిధిలో’ భావాన్ని, అలాగే దైవసన్నిధికి సంబంధించిన వాక్యబలాన్ని నిలుపుతుంది; יהוהను దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: אֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోకి
  rationale: మూలంలో ప్రత్యేక విభక్త్యర్థక అవ్యయం లేకపోయినా, గమనక్రియతో కూడిన గమ్యస్థాన భావాన్ని తెలుగులో ‘దేశంలోకి’ సహజంగా తెలియజేస్తుంది.
- source_word: וְאִתָּנוּ
  choice: మాదిగానే ఉంటుంది
  rationale: హీబ్రూలో ఇది క్రియలేని పదబంధం; ముందున్న భవిష్యత్ ప్రతిజ్ఞకు అనుగుణంగా తెలుగులో ‘ఉంటుంది’ను పూరించాం. ‘మాదిగానే’ అనేది ‘మాతో’ అనే అక్షరార్థాన్ని స్వాధీనత సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: మా స్వాస్థ్యపు భాగం
  rationale: אֲחֻזָּהలోని కేటాయించబడిన భూభాగం/ఆస్తి భావాన్నీ, נַחֲלָהలోని వారసత్వ స్వాస్థ్య భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను ఇవతల
  rationale: ఈ దిక్సూచక పదబంధం వక్త ఉన్న స్థలాన్ని బట్టి అర్థమవుతుంది; వక్తలు యొర్దానుకు తూర్పున తమకు కేటాయించిన భూమిని ఉద్దేశిస్తున్నందున ‘ఇవతల’ సందర్భానికి సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపమైన ‘యెహోవా’ దాన్ని పేరుగానే నిలుపుతుంది; బిరుదుగా మార్చదు.
- issue: לִפְנֵי יְהוָה యొక్క సంబంధార్థం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ముందు
  rationale: ఇది కేవలం సైన్యపు భౌగోళిక ముందువరుసను కాక, యెహోవా సమక్షంలో చేసిన యుద్ధసేవ/నిబద్ధత భావాన్నీ కలిగి ఉండవచ్చు. ‘సన్నిధిలో’ ఆ theological tensionను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీర శైలిని వాడాం. హీబ్రూ వాక్యంలోని ఉద్ఘాటన, సైనిక సిద్ధత, దైవసన్నిధి, స్వాస్థ్య భావాలను సహజ తెలుగు నిర్మాణంలో నిలిపాం.
