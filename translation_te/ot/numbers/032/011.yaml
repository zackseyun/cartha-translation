revisions:
- from: ఈజిప్టు నుండి బయలుదేరి వచ్చినవారిలో ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్న పురుషుల్లో ఒక్కరు కూడా నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు ప్రమాణం చేసిన దేశాన్ని చూడరు[a]. ఎందుకంటే వారు నన్ను సంపూర్ణంగా అనుసరించలేదు[b].
  to: ఈజిప్టు నుండి బయలుదేరి వచ్చినవారిలో ఇరవై సంవత్సరాలు లేదా అంతకంటే ఎక్కువ వయస్సున్న పురుషుల్లో ఒక్కరు కూడా నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు ప్రమాణం చేసిన భూమిని చూడరు[a]. ఎందుకంటే వారు నన్ను పూర్తిగా అనుసరించలేదు[b].
  rationale: స్వల్ప శైలీ సవరణలు మాత్రమే చేశాం. వయస్సు సూత్రాన్ని సహజంగా, సమగ్రంగా వ్యక్తపరిచాం; వాగ్దాన భూభాగానికి ‘భూమి’ ఉపయోగించాం. ప్రమాణ-నిరాకరణ, కారణార్థకం, మరియు ‘పూర్తిగా అనుసరించడం’ అనే మూల నుడికారాన్ని మార్చలేదు.
