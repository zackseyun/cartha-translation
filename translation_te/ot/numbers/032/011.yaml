source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: te
  text: ఈజిప్టు నుండి బయలుదేరి వచ్చినవారిలో ఇరవై సంవత్సరాలు లేదా అంతకంటే ఎక్కువ వయస్సున్న పురుషుల్లో ఒక్కరు కూడా నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు ప్రమాణం చేసిన భూమిని చూడరు[a]. ఎందుకంటే వారు నన్ను పూర్తిగా అనుసరించలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ప్రమాణ సూత్రం ‘ఒకవేళ ఆ పురుషులు ... భూమిని చూస్తే’ అని ఉంటుంది; సందర్భంలో అది ‘వారిలో ఒక్కరు కూడా తప్పకుండా చూడరు’ అనే బలమైన నిరాకరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు నన్ను పూర్తిగా వెంబడించలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఒక్కరు కూడా ... చూడరు
  rationale: ఇక్కడ אִם అసంపూర్ణంగా వ్యక్తమైన ప్రమాణ సూత్రంలో బలమైన నిరాకరణను సూచిస్తుంది. తెలుగులో షరతుగా అనిపించే ‘ఒకవేళ’ కంటే ‘ఒక్కరు కూడా ... చూడరు’ అనే రూపం అసలు భావబలాన్ని సహజంగా అందిస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: పురుషులు
  rationale: హీబ్రూ పదం పురుష లింగ బహువచనం; జనగణన, సైనిక వయస్సు సందర్భానికి అనుగుణంగా లింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: ఈజిప్టు నుండి బయలుదేరి వచ్చినవారు
  rationale: עלה מן నిర్గమ సందర్భంలో ‘పైకి వచ్చుట/బయలుదేరి వచ్చుట’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘బయలుదేరి వచ్చిన’ అనేది సహజంగా ఉండి నిర్గమ భావాన్ని నిలుపుతుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయస్సున్న
  rationale: వయోపరిమితిని తెలిపే హీబ్రూ సూత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יִרְאוּ
  choice: చూడరు
  rationale: ראה ఇక్కడ కేవలం కంటితో చూడటం మాత్రమే కాక ఆ దేశాన్ని అనుభవించడం లేదా చేరుకోవడం అనే సందర్భార్థాన్ని కలిగి ఉన్నా, మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను కాపాడేందుకు ‘చూడరు’ ఎంచుకున్నాం.
- source_word: הָאֲדָמָה
  choice: దేశం
  rationale: אֲדָמָה సాధారణంగా నేల అని అర్థమివ్వగలిగినా, ఇక్కడ పితరులకు ప్రమాణం చేసిన వాగ్దాన భూభాగాన్ని సూచిస్తుంది; అందువల్ల ‘దేశం’ సందర్భోచితం.
- source_word: נִשְׁבַּעְתִּי
  choice: ప్రమాణం చేసిన
  rationale: దైవిక ప్రమాణాన్ని తెలిపే సాధారణ హీబ్రూ రూపానికి గంభీరమైన, సూటి తెలుగు సమానం.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: ప్రతి పేరుతో హీబ్రూలో పునరావృతమైన לְను తెలుగులో ‘కు’ ద్వారా నిలిపి ఒడంబడిక సంబంధమైన లయను కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తీర్పుకు కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא מִלְאוּ אַחֲרָי
  choice: నన్ను సంపూర్ణంగా అనుసరించలేదు
  rationale: מלא אחרי అనే నుడికారానికి ‘పూర్తిగా/సంపూర్ణంగా అనుసరించుట’ అనే భావం ఉంది. సంబంధాత్మకమైన ‘అనుసరించుట’ను నిలుపుతూ అర్థాన్ని అనవసరంగా విస్తరించదు.
theological_decisions:
- issue: אִםతో ప్రారంభమయ్యే ప్రమాణ సూత్రం
  choice: ఒక్కరు కూడా ... చూడరు
  alternative: ఒకవేళ ఆ పురుషులు ... దేశాన్ని చూస్తే
  rationale: హీబ్రూలోని ‘అయితే’ రూపం బలమైన ప్రతికూల ప్రమాణాన్ని సూచిస్తుంది. దాన్ని తెలుగులో అక్షరార్థంగా షరతుగా అనువదిస్తే దైవిక తీర్పు భావం అస్పష్టమవుతుంది; ఎంపిక చేసిన రూపం దాని బలాన్ని నిలుపుతుంది.
- issue: לֹא מִלְאוּ אַחֲרָי నుడికారం యొక్క పరిధి
  choice: వారు నన్ను సంపూర్ణంగా అనుసరించలేదు
  alternative: వారు నాకు పూర్తిగా నమ్మకంగా ఉండలేదు
  rationale: మూలపాఠం సంపూర్ణంగా వెంబడించడం/అనుసరించడం అనే సంబంధాత్మక చిత్రాన్ని ఉపయోగిస్తుంది. ‘నమ్మకంగా ఉండటం’ భావపరంగా సమీపమైనా, మూలంలోని క్రియాచిత్రాన్ని విస్తరించి వ్యాఖ్యానిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ వాక్యనిర్మాణం, అయితే దైవిక ప్రమాణం మరియు తీర్పుకు తగిన గంభీరతను నిలిపాం. వ్యక్తినామాలకు విస్తృతంగా వినియోగంలో ఉన్న తెలుగు బైబిలు రూపాలు వాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
