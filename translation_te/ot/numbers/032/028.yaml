source:
  edition: WLC
  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: te
  text: మోషే వారి విషయమై యాజకుడైన ఎలియాజరుకు, నూను కుమారుడైన యెహోషువకు, ఇశ్రాయేలీయుల గోత్రాల పితృకుటుంబాల పెద్దలకు ఆజ్ఞాపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే యాజకుడైన ఎలియాజరుకు, నూను కుమారుడైన యెహోషువకు, ఇశ్రాయేలీయుల గోత్రాల పితృకుటుంబాల పెద్దలకు ఆజ్ఞాపించాడు.” ఈ అర్థంలో ‘వారికి’ అనే భావం ముందుగా ప్రస్తావించిన గోత్రాలవారిని కాక, ఈ వచనంలో పేరుపొందిన నాయకులనే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అధికారపూర్వకంగా ఆదేశించడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ఆజ్ఞాపించాడు’ ఈ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారి విషయమై
  rationale: సందర్భంలో ఈ సర్వనామం ముందుగా ప్రస్తావించిన రూబేనీయులు, గాదీయులను సూచించే అవకాశం ఎక్కువ. పేరుపేరున చెప్పబడిన నాయకులే ఆజ్ఞను స్వీకరించేవారు కాబట్టి ‘వారి విషయమై’ వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది; అయితే వేరొక వ్యాకరణ అవగాహనను పాదసూచికలో ఉంచాం.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరుకు
  rationale: אֵת ఇక్కడ צוה క్రియతో ఆజ్ఞ అందుకున్న వ్యక్తిని పరిచయం చేస్తుంది. తెలుగులో ‘-కు’ విభక్తి ఆ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువకు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: గోత్రాల పితృకుటుంబాల పెద్దలకు
  rationale: ఇది గోత్రాల్లోని పూర్వీకుల కుటుంబ విభాగాలకు నాయకులైన వారిని సూచించే పరిపాలనా పదబంధం. ‘పితృకుటుంబాల పెద్దలు’ మూల నిర్మాణాన్నీ అర్థాన్నీ సమతుల్యంగా కాపాడుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల’ అయినా, ఇక్కడ మొత్తం ప్రజాసమూహానికి చెందిన గోత్ర వ్యవస్థను సూచిస్తుంది. ‘ఇశ్రాయేలీయుల’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
