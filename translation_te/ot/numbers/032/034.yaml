base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: te
  text: గాదు కుమారులు దిబోను, అతారోతు, అరోయేరును నిర్మించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భంలో “తిరిగి నిర్మించారు” లేదా “కోటలుగా బలపరిచారు” అని కూడా అర్థం చేసుకోవచ్చు; అయితే హీబ్రూ క్రియకు నేర అర్థం “నిర్మించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: కట్టారు
  rationale: בנה అనే క్రియకు ప్రాథమిక అర్థం ‘కట్టు/నిర్మించు.’ ఈ సందర్భంలో తిరిగి కట్టడం లేదా బలపరచడం ఉద్దేశమై ఉండవచ్చు; అయితే ఆ భావాన్ని క్రియ స్వయంగా తప్పనిసరిగా తెలియజేయదు.
- source_word: בְנֵי גָד
  choice: గాదు కుమారులు
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను దగ్గరగా నిలుపుతూ, ఇక్కడ గాదు గోత్ర సభ్యులను సూచిస్తుంది.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదరూపం అవసరం లేదు.
- source_word: דִּיבֹן
  choice: దీబోను
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֲטָרֹת
  choice: అతారోతు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֲרֹעֵר
  choice: అరోయేరు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
