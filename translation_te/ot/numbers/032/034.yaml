  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘గాదు కుమారులు’ అనే గోత్ర సంబంధ వ్యక్తీకరణను నిలిపాం. మూడు పేర్లకూ వర్తించేలా ‘పట్టణాలను’ చేర్చడం తెలుగులో సహజత కోసం చేసిన స్పష్టీకరణ.
