id: NUM.29.8
reference: Numbers 29:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: te
  text: 'మీరు యాహ్వేకు ఇంపైన సువాసనగా[a] దహనబలిని అర్పించాలి: మందలోనుండి ఒక కోడెను, ఒక పొట్టేలును, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలను అర్పించాలి; అవి మీ కొరకు లోపంలేనివిగా ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాంతిపరచే సువాసన.” హీబ్రూలో ఇది యాహ్వేకు ఆమోదయోగ్యమైన బలిని సూచించే స్థిరమైన బలి సంబంధ వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: మీరు ... అర్పించాలి
  rationale: హిఫిల్ రూపమైన קרב బలి సందర్భంలో బలిని సమర్పించడం లేదా అర్పించడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘అర్పించాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలి పూర్తిగా అగ్నిలో దహించబడే అర్పణను సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలపాఠంలోని ఒడంబడిక నామమైన יהוהను పేరుగానే ఉంచి, ל ఉపసర్గ సూచించే అంకితం లేదా దిశను ‘కు’తో తెలిపింది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఆయనకు ఇంపైన సువాసన
  rationale: ఇది దేవునికి ఆమోదయోగ్యమైన బలిని సూచించే స్థిరమైన బలి సంబంధ రూపకం. ‘ఇంపైన సువాసన’ రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: ఒక కోడెను
  rationale: ఈ హీబ్రూ పదబంధం మందలోని మగ పశువును సూచిస్తుంది. ‘కోడె’ సంక్షిప్తంగా, లింగాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు పదం.
- source_word: אַיִל אֶחָד
  choice: ఒక పొట్టేలును
  rationale: אַיִל అనే బలి జంతువుకు లింగనిర్దిష్టమైన సాధారణ తెలుగు సమానం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలను
  rationale: జంతువుల మగ లింగాన్ని, בני שנה తెలిపే ఏడాది వయసును రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: תְּמִימִם
  choice: లోపంలేనివిగా
  rationale: బలి సందర్భంలో శారీరక దోషం లేదా కళంకం లేని జంతువులను సూచిస్తుంది.
- source_word: יִהְיוּ לָכֶם
  choice: అవి మీ కోసం ... ఉండాలి
  rationale: లָכֶםలోని దాత్యర్థాన్ని వదలకుండా ‘మీ కోసం’ అని ప్రతిబింబించింది; ఇది అర్పించేవారు సిద్ధం చేసే జంతువులకు వర్తించే అర్హతను సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా పేరుగా ఉంచింది. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మూల ఉచ్చారణను మరింత దగ్గరగా ప్రతిబింబించే ప్రత్యామ్నాయం.
- issue: רֵיחַ נִיחֹחַ యొక్క బలి సంబంధ రూపకం
  choice: ఆయనకు ఇంపైన సువాసన
  alternative: శాంతిపరచే సువాసన
  rationale: దేవునికి బలి ఆమోదయోగ్యమనే భావాన్ని తెలిపే రూపకాన్ని నిలిపి, దేవుణ్ణి యాంత్రికంగా శాంతింపజేస్తున్నట్టు నిర్దిష్టంగా వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే బలి సంబంధ పదజాలం వాడబడింది. మూల వాక్యంలోని జాబితాను తెలుగులో సహజంగా విభజించి, ‘ఇంపైన సువాసన’ను పూర్తి వాక్యంగా ఇచ్చింది. జంతువుల లింగం, వయసు, లోపరాహిత్యం అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
