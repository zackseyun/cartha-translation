translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని బహువచన అస్పష్టతను పాఠ్యంలో నిలిపి, పాదసూచికలో వివరించాం.
