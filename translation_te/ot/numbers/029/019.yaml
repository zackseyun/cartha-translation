source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/019.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: te
  text: పాపపరిహార బలిగా ఒక మగ మేకపోతును నిత్య దహనబలికి, దానితో కూడిన ధాన్యార్పణానికి, వాటి పానార్పణలకు అదనంగా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో “వాటి పానార్పణలు” అని బహువచనంలో ఉంది; ఇది నిర్దేశించిన బలుల సముదాయానికి సంబంధించిన పానార్పణలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: ఒక మగ మేకపోతును
  rationale: שׂעיר עזים బలుల సందర్భంలో మగ మేకను సూచించే స్థిరమైన పదబంధం; אֶחָד సంఖ్యను స్పష్టంగా తెలుపుతుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల నియమావళిలో ఈ పదం సాధారణంగా పాపం అనే భావనకన్నా పాపానికి సంబంధించిన నిర్దిష్ట బలిని సూచిస్తుంది.
- source_word: מִלְּבַד
  choice: అదనంగా
  rationale: ఈ బలి నిత్యంగా అర్పించే బలి సముదాయానికి తోడుగా అర్పించబడుతుందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: నిత్య దహనబలి
  rationale: תמיד నిరంతరం లేదా క్రమంగా అర్పించబడే నిర్దేశిత బలిని సూచిస్తుంది; 'నిత్య' సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: וּמִנְחָתָהּ
  choice: దాని ధాన్యార్పణ
  rationale: బలుల సందర్భంలో מנחה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ఏకవచన స్త్రీలింగ ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: וְנִסְכֵּיהֶם
  choice: వాటి పానార్పణలు
  rationale: హీబ్రూలో నామవాచకమూ ప్రత్యయమూ బహువచనంలో ఉన్నాయి. వాటిని ఏకవచనంగా సవరించకుండా మూలంలోని సంఖ్యాభేదాన్ని నిలిపాం.
