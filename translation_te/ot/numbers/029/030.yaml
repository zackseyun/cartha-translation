translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే బలి-ఆచార పదజాలం వాడాం. హెబ్రీ వాక్యం ముందటి ఆజ్ఞపై ఆధారపడిన అసంపూర్ణ సమన్వయ నిర్మాణం; తెలుగులో స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు ‘అర్పించాలి’ని సందర్భానుగుణంగా పూరించాం. పాదటిప్పణి సూచికను ప్రధాన పాఠ్యంలో ఉంచాం.
