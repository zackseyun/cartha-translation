  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: te
  text: వాటి ధాన్యార్పణను, పానీయార్పణలను ఎద్దులకోసం, పొట్టేళ్లకోసం, గొర్రెపిల్లలకోసం వాటి సంఖ్య ప్రకారం, నియమించిన విధంగా[a] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నియమం ప్రకారం.’ హెబ్రీ పదం כַּמִּשְׁפָּט ఈ అర్పణలు ఎలా సమర్పించాలో స్థిరపరచిన నియమాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: వాటి ధాన్యార్పణను
  rationale: బలి సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది. హెబ్రీలోని ఏకవచన రూపాన్ని సమూహార్థక ఏకవచనంగా ఉంచాం.
- source_word: נִסְכֵּיהֶם
  choice: వాటి పానార్పణలను
  rationale: נֶסֶךְ బలులతోపాటు పోసే పానీయ అర్పణలను సూచిస్తుంది; ‘పానార్పణలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, బలిసంబంధ ప్రత్యేకతతో ఉంది.
- source_word: לַפָּרִים
  choice: ఎద్దులకు
  rationale: פַּר బలుల జాబితాల్లో ఎద్దును సూచిస్తుంది; మూలంలో వయస్సు స్పష్టంగా చెప్పనందున ‘కోడెదూడలు’ అని అధిక నిర్దిష్టత ఇవ్వలేదు.
- source_word: לָאֵילִם
  choice: పొట్టేళ్లకు
  rationale: אַיִל బలి సందర్భంలో మగ గొర్రెను సూచిస్తుంది; సహజమైన తెలుగు పదం ‘పొట్టేలు’ ఎంచుకున్నాం.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כֶּבֶשׂ గొర్రెపిల్లను సూచిస్తుంది. ఈ వాక్యంలో లింగాన్ని అనవసరంగా అధిక నిర్దిష్టతతో తెలుపలేదు.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్య ప్రకారం
  rationale: నిర్దేశించిన జంతువుల లెక్కకు అనుగుణంగా అర్పణలు ఉండాలనే విధానార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כַּמִּשְׁפָּט
  choice: నియమించిన విధంగా
  rationale: מִשְׁפָּט ఇక్కడ స్థాపితమైన ఆచార-న్యాయ నియమాన్ని, అర్పణలు చేయవలసిన నిర్దేశిత పద్ధతిని సూచిస్తుంది.
