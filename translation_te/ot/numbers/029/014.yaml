translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. కొలత విషయంలో మూలపాఠంలోని సంక్షిప్తతను ప్రధాన పాఠ్యంలో నిలిపి, సాంస్కృతిక వివరణను పాదసూచికలో ఉంచాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
