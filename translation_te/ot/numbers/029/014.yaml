  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: te
  text: 'వాటి ధాన్యార్పణం నూనెతో కలిపిన సన్నని పిండి అయి ఉండాలి: పదమూడు ఎద్దుల కోసం ఒక్కో ఎద్దుకు మూడు పదవ వంతులు[a], రెండు పొట్టేళ్ల కోసం ఒక్కో పొట్టేలుకు రెండు పదవ వంతులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘మూడు పదవ వంతులు’, ‘రెండు పదవ వంతులు’ అనే మాటలు పదవ భాగపు కొలతలను సూచిస్తాయి; సంప్రదాయంగా ఇవి ఏఫాలో పదవ వంతులుగా అర్థం చేసుకోబడతాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: వాటి ధాన్యార్పణగా
  rationale: బలి సందర్భంలో מִנְחָה సాధారణ అర్పణ కంటే ప్రత్యేకంగా ధాన్యార్పణను సూచిస్తుంది. 3 పుం. బహు. ప్రత్యయం సందర్భంలోని బలిపశువులను సూచిస్తున్నందున తెలుగులో సహజంగా ‘వాటి’ అని అనువదించబడింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ధాన్యార్పణకు ఉపయోగించే సన్నగా విసిరిన ఉత్తమ పిండిని సూచించే ఆరాధనా పదం; ఆధునిక తెలుగులో ‘మెత్తని పిండి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెతో పిండి కలపబడిన సిద్ధీకరణను నిష్క్రియార్థక కృదంతం తెలియజేస్తుంది.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: మూడు పదవ వంతులు
  rationale: עִשָּׂרוֹן ఒక పదవ భాగపు కొలత. మూలపాఠం ఈ వచనంలో ‘ఏఫా’ను స్పష్టంగా పునరుక్తి చేయనందున దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా, వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: לַפָּר הָאֶחָד
  choice: ఒక్కొక్క ఎద్దుకు
  rationale: అక్షరార్థంగా ‘ఒక ఎద్దుకు’ అయినా, పదమూడు ఎద్దుల సమూహంలో ప్రతి ఎద్దుకు వర్తించే పంపిణీ భావాన్ని ‘ఒక్కొక్క’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: పదమూడు ఎద్దుల్లో
  rationale: ఒక్కో పశువుకు నిర్దేశించిన పరిమాణం మొత్తం పదమూడు ఎద్దుల సమూహానికి వర్తిస్తుందని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదవ వంతులు
  rationale: ముందటి కొలతకు సమాంతరంగా అదే పదవ భాగపు కొలతను స్థిరంగా అనువదిస్తుంది.
- source_word: לָאַיִל הָאֶחָד
  choice: ఒక్కొక్క పొట్టేలుకు
  rationale: రెండు పొట్టేళ్లలో ప్రతి దానికి వర్తించే పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: రెండు పొట్టేళ్లలో
  rationale: నిర్దేశిత పరిమాణం వర్తించే మొత్తం రెండు పొట్టేళ్ల సమూహాన్ని సూచిస్తుంది.
