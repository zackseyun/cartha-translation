id: NUM.29.12
reference: Numbers 29:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: te
  text: ఏడవ నెల పదిహేనవ రోజున మీకు పవిత్ర సభ జరగాలి. మీరు ఏ సాధారణ పనీ చేయకూడదు. ఏడు రోజులపాటు యెహోవాకు పండుగ జరపాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల పదిహేనవ రోజున
  rationale: హీబ్రూ కాలసూచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు క్రమంలో వ్యక్తపరుస్తుంది; వాక్యారంభంలోని וּ సందర్భానుసార కొనసాగింపును సూచించినా తెలుగులో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: అధికారికంగా పిలువబడిన ఆరాధనా సమాగమాన్ని సూచించే స్థిరమైన ఆచార సంబంధ పదబంధానికి స్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... జరగాలి
  rationale: అక్షరార్థమైన ‘మీకు ఉండాలి’ కంటే సభ సందర్భంలో సహజంగా ఉండి, విధిగా నిర్వహించవలసిన భావాన్ని నిలుపుతుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: మీరు ఏ సాధారణ పనీ చేయకూడదు
  rationale: מְלֶאכֶת עֲבֹדָה సాధారణ వృత్తి లేదా దైనందిన శ్రమను సూచిస్తుంది; ప్రతి రకమైన చర్యనూ నిషేధిస్తున్నట్టు అతిశయింపకుండా న్యాయపరమైన నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְחַגֹּתֶם חַג
  choice: పండుగ జరపాలి
  rationale: సజాత క్రియా-నామ నిర్మాణంలోని పండుగను ఆచరించే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది; לְ పండుగ దేవునికి అంకితమైనదనే దిశా/గౌరవ భావాన్ని సూచిస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: పండుగ కొనసాగే వ్యవధిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ దానిని బిరుదుగా మార్చకుండా సంరక్షిస్తుంది; అసలు ఉచ్చారణపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించినట్టు చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ధర్మశాస్త్ర సంబంధ గంభీరతను నిలుపుతూ సంక్షిప్త వాక్యాలుగా రూపొందించబడింది. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
