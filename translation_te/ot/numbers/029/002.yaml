reference: Numbers 29:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: te
  text: 'మీరు యాహ్వేకు ఇంపైన సువాసనగా[a] దహనబలిని అర్పించాలి: మందలోని ఒక ఎద్దు, ఒక పొట్టేలు, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలు; ఇవన్నీ లోపంలేనివిగా ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇంపైన సువాసనగా” అనే హీబ్రూ పదబంధాన్ని “శాంతినిచ్చే సువాసనగా” లేదా “మధురమైన సువాసనగా” అని కూడా అనువదించవచ్చు. ఇది బలి యాహ్వేకు ఆమోదయోగ్యమని సూచించే స్థిరమైన బలిసంబంధ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: మీరు ... అర్పించాలి
  rationale: క్రియకు అక్షరార్థంగా ‘చేయాలి’ అనే భావం ఉన్నా, עֹלָה అనే బలి సందర్భంలో సహజమైన తెలుగు అర్థం ‘అర్పించాలి’.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలి పూర్తిగా దహించబడి పొగగా పైకి వెళ్లే అర్పణను సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: ఇది బలి దేవునికి ఆమోదయోగ్యమై ఉండడాన్ని తెలిపే స్థిరమైన బలిసంబంధ సూత్రవాక్యం; మూలంలోని సువాసన రూపకాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలో ఉన్న దైవనామం יהוהను పేరుగానే ప్రతిబింబిస్తుంది; לְ ఉపసర్గ బలి ఎవరికి అర్పించబడుతుందో తెలుపుతుంది.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: మందలోనుంచి ఒక ఎద్దును
  rationale: ‘పశువుల కుమారుడైన ఒక ఎద్దు’ అనే హీబ్రూ నుడికారాన్ని జంతువు రకాన్ని నిలుపుతూ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אַיִל אֶחָד
  choice: ఒక పొట్టేలును
  rationale: బలుల జాబితాలో אַיִל అనేది మగ గొర్రెను, అంటే పొట్టేలును సూచిస్తుంది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలను
  rationale: వయస్సు, సంఖ్య, జంతువు లింగసూచనలను సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: תְּמִימִם
  choice: లోపంలేని
  rationale: బలికి సంబంధించిన సందర్భంలో శారీరక దోషం లేదా కళంకం లేకపోవడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: వచనంలో దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచడం మూలపాఠాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- issue: לְרֵיחַ נִיחֹחַ యొక్క బలిసంబంధ భావం
  choice: ఇంపైన సువాసనగా
  alternative: శాంతినిచ్చే సువాసనగా
  rationale: మూలంలోని రూపకాన్ని నిలుపుతూ బలి యాహ్వేకు ఆమోదయోగ్యమనే భావాన్ని సూచిస్తుంది; దేవుని ఘ్రాణానుభూతిని స్థూలంగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. బలిసంబంధ పదజాలంలో ‘దహనబలి’, ‘అర్పించాలి’, ‘లోపంలేని’ వంటి స్థిరమైన పదాలను ఉపయోగించాం. హీబ్రూ జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో క్రియను చివర పునరుక్తం చేసి వాక్యాన్ని సహజంగా చేశాం.
