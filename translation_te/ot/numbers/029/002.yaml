  to: 'మీరు యాహ్వేకు ఇంపైన సువాసనగా[a] దహనబలిని అర్పించాలి: మందలోని ఒక ఎద్దు, ఒక పొట్టేలు, ఏడాది వయసున్న ఏడు మగ గొర్రెపిల్లలు; ఇవన్నీ లోపంలేనివిగా ఉండాలి.'
