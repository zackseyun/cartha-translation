source:
  edition: WLC
  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: te
  text: ప్రాయశ్చిత్తపు పాపపరిహార బలికి, క్రమంగా అర్పించే దహనబలికి[b], దాని ధాన్యార్పణకు, వాటి పానార్పణలకు అదనంగా, పాపపరిహార బలిగా ఒక మగ మేకను[a] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపపరిహార బలి’ అని వచ్చిన రెండు చోట్లా ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిరంతర దహనబలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: మగ మేక
  rationale: బలిగా అర్పించే జంతువు మగదని స్పష్టంగా తెలియజేస్తూ, హెబ్రీ నిర్మాణాన్ని అసహజంగా పదేపదే అనుసరించకుండా ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: నిర్దేశించిన బలి సంఖ్యను యథాతథంగా ఉంచుతుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలుల జాబితాలో ఈ పదం పాపాన్ని కాక ఒక నిర్దిష్ట బలిని సూచిస్తుంది. స్థిరపడిన ఆచార సంబంధ పదాన్ని వాడుతూ, ‘శుద్ధీకరణ బలి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִלְּבַד
  choice: అదనం
  rationale: ఈ బలి మిగతా బలులకు బదులుగా కాక, వాటికి అదనంగా అర్పించబడుతుందని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్తం కోసం అర్పించే పాపపరిహార బలి
  rationale: ప్రాయశ్చిత్త క్రియతో ఈ బలికి ఉన్న సంబంధాన్ని కాపాడుతుంది; సందర్భాన్ని మించి ప్రత్యేక పండుగ పేరును చేర్చదు.
- source_word: עֹלַת הַתָּמִיד
  choice: క్రమంగా అర్పించే దహనబలి
  rationale: תָּמִיד సూచించే నియమితమైన లేదా నిరంతర పునరావృతిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘రోజువారీ’ అని పరిమితం చేయదు.
- source_word: מִנְחָתָהּ
  choice: దానికి చెందిన ధాన్యార్పణ
  rationale: మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది; బలుల జాబితాలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది.
- source_word: נִסְכֵּיהֶם
  choice: వాటి పానార్పణలు
  rationale: హెబ్రీ బహువచన ప్రత్యయాన్ని నిలుపుతూ, సంబంధిత బలులతో కూడిన ద్రవార్పణలను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: חַטָּאת అనే ఆచార సంబంధ పదం
  choice: రెండు చోట్లా ‘పాపపరిహార బలి’
  alternative: ‘శుద్ధీకరణ బలి’
  rationale: ఈ వచనం బలుల విధాన జాబితా కావడంతో స్థిరపడిన ‘పాపపరిహార బలి’ పాఠకులకు స్పష్టంగా ఉంటుంది. అయితే ఈ బలి శుద్ధీకరణ కార్యాన్ని ప్రధానంగా సూచించవచ్చనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆచార సంబంధ శైలి వాడబడింది. మూలంలోని జాబితా నిర్మాణాన్ని చదవడానికి సులభంగా చేయడానికి ‘అర్పించాలి’ అనే క్రియను సందర్భానుసారంగా స్పష్టపరిచాం. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
