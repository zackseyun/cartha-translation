source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: te
  text: మీరు యాహ్వేకు ఇంపైన సువాసనగా ఉండే అగ్న్యర్పణమైన దహనబలిని అర్పించాలి:[a] ఒక ఎద్దు, ఒక పొట్టేలు, ఏడాది వయసున్న ఏడు లోపంలేని గొర్రెపిల్లలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇంపైన సువాసన’ అనే హెబ్రీ నుడికారాన్ని ‘సాంత్వనకరమైన సువాసన’ అని కూడా అనువదించవచ్చు. ఇది యాహ్వేకు ఆమోదయోగ్యమైన బలిని సూచించే స్థిరమైన బలిసంబంధ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: మీరు అర్పించాలి
  rationale: హిఫిల్ రూపం బలుల సందర్భంలో సమర్పించడం లేదా అర్పించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘అర్పించాలి’ సహజంగా ఉండి ఆచార సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా అగ్నిలో దహింపబడే బలిని సూచించే స్థిరమైన బైబిలు పదం.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: అగ్ని ద్వారా అర్పించబడే బలి అనే మూల భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; ‘ఆహార అర్పణ’ అనే వివాదాస్పద విస్తరణను నివారిస్తుంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: సువాసనగల అర్పణ
  rationale: దేవునికి ఆమోదయోగ్యమైన అర్పణను సూచించే స్థిరమైన బలిసంబంధ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ల ఉపసర్గ అర్పణ ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: פַּר אֶחָד
  choice: ఒక ఎద్దు
  rationale: పశువుల మందలోని మగ జంతువును నేరుగా సూచిస్తుంది; హెబ్రీలో ఇక్కడ ‘యువ’ అని తప్పనిసరిగా లేదు.
- source_word: אַיִל אֶחָד
  choice: ఒక పొట్టేలు
  rationale: బలుల జాబితాలో אַיִל‌కు సహజమైన, నిర్దిష్టమైన తెలుగు సమానార్థకం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ఏడాది వయసుగల ఏడు గొర్రెపిల్లలు
  rationale: ‘ఒక సంవత్సరపు పిల్లలు’ అనే వయోనిర్దేశాన్ని సహజమైన తెలుగులో కచ్చితంగా అందిస్తుంది; మూలంలో అవసరం లేని లింగ సూచనను చేర్చదు.
- source_word: תְּמִימִם
  choice: ఏ లోపమూ లేని
  rationale: బలికి ఉపయోగించే జంతువులు శారీరక దోషం లేనివిగా ఉండాలనే ఆచారపరమైన అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: רֵיחַ נִיחֹחַ యొక్క బలిసంబంధ భావం
  choice: సువాసనగల అర్పణ
  alternative: మనోహరమైన సువాసన
  rationale: ఇది దేవునికి ఆమోదయోగ్యమైన బలిని సూచించే స్థిర నుడికారం. దేవుడు శారీరకంగా వాసనను ఆస్వాదిస్తాడనే భావాన్ని అతిగా ముందుకు తేవకుండా, మూలంలోని సువాసన రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. బలుల సాంకేతిక పదజాలంలో ‘దహనబలి’, ‘అర్పణ’, ‘లోపం లేని’ వంటి స్పష్టమైన రూపాలను నిలిపాం.
