- from: మీరు యెహోవాకు దహనబలిగా, అగ్నితో అర్పించే సువాసనగల అర్పణగా, ఒక ఎద్దును, ఒక పొట్టేలును, ఏ లోపమూ లేని ఏడాది వయసుగల ఏడు గొర్రెపిల్లలను అర్పించాలి.[a]
