translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి ఆచార పదజాలాన్ని స్పష్టంగా మరియు గౌరవప్రదంగా ఉంచాం. మూలంలోని జాబితా కొనసాగింపును తెలుగులో సంపూర్ణ ఆజ్ఞారూప వాక్యంగా సహజీకరించాం; [a], [b] సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
