source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: te
  text: మరియు పాపపరిహార బలిగా ఒక మేకను[a] అర్పించాలి; ఇది నిత్య దహనబలికి[b], దాని ధాన్యార్పణకు, దాని పానార్పణకు అదనం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపపరిహార బలిగా ఒక మగ మేకను.” హీబ్రూ పదం ప్రత్యేకంగా మగ మేకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నిత్య’ అని అనువదించిన హీబ్రూ పదం క్రమంగా, నిరంతరం అర్పించే బలిని సూచిస్తుంది; దీనిని ‘క్రమమైన’ లేదా ‘రోజువారీ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: ఒక మగ మేకను
  rationale: שׂעיר మగ మేకను సూచిస్తుంది; אֶחָד సంఖ్యను స్పష్టంగా నిలుపుతుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు రెండింటినీ కలిపి అనువదించాం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలి సందర్భంలో ఈ పదం అమూర్తమైన ‘పాపం’ కంటే పాపానికి సంబంధించిన నిర్దిష్ట బలిని సూచిస్తుంది.
- source_word: מִ/לְּ/בַד
  choice: అదనం
  rationale: ఈ బలి నిత్య దహనబలికి తోడుగా అర్పించబడుతుందని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֹלַת הַ/תָּמִיד
  choice: నిత్య దహనబలి
  rationale: עֹלָהకు స్థిరమైన ‘దహనబలి’ని, תָּמִידలోని నిరంతరం పునరావృతమయ్యే అర్పణ భావానికి ‘నిత్య’ను వాడాం.
- source_word: מִנְחָתָ/הּ
  choice: దాని ధాన్యార్పణ
  rationale: బలి ఆచార సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: וְ/נִסְכָּ/הּ
  choice: దాని పానార్పణ
  rationale: נֶסֶךְ బలితో కూడిన ద్రవ అర్పణను సూచిస్తుంది; ‘పానార్పణ’ ఆధునిక పాఠకునికి ఆచారార్థాన్ని స్పష్టంగా అందిస్తుంది.
