translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారబలి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. హీబ్రూలోని విభాజక పునరుక్తిని సహజమైన ‘ఒక్కొక్క ... చొప్పున’ నిర్మాణంతో వ్యక్తం చేశాం.
