translation:
  language: te
  text: ఆ పద్నాలుగు గొర్రెపిల్లల్లో ఒక్కొక్క గొర్రెపిల్లకు పదోవంతు చొప్పున[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘పదోవంతు’ అనే మాట రెండుసార్లు (‘పదోవంతు, పదోవంతు’) వస్తుంది. ప్రతి గొర్రెపిల్లకు విడివిడిగా అంతే పరిమాణం ఇవ్వాలని తెలిపే ప్రయోగం ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: పదోవంతు చొప్పున
  rationale: బలి అర్పణ సందర్భంలో עִשָּׂרוֹן పదం పదోవంతు కొలతను సూచిస్తుంది; పదం పునరుక్తి ప్రతి గొర్రెపిల్లకు విడివిడిగా అదే పరిమాణం వర్తిస్తుందని తెలియజేస్తుంది. తెలుగులో ‘చొప్పున’ ఆ విభాజక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: అక్షరార్థంగా ‘ఆ ఒక్క గొర్రెపిల్లకు’; ఇక్కడ పద్నాలుగు గొర్రెపిల్లల్లో ప్రతిదానికి వర్తించే పరిమాణాన్ని తెలిపే విభాజక ప్రయోగం. ‘ఒక్కొక్క’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: ఆ పద్నాలుగు గొర్రెపిల్లల్లో
  rationale: ఈ పరిమాణం వర్తించే, సందర్భంలో ముందే నిర్దిష్టమైన పద్నాలుగు గొర్రెపిల్లల సమూహాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఆ ... లో’ అని ముందుంచడం సహజంగా ఉంటుంది.
