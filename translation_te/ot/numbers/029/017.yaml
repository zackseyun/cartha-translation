translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలి అర్పణల జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. మూలంలోని అసంపూర్ణ జాబితా కొనసాగింపును చివరి కామాతో నిలుపుకుంది.
