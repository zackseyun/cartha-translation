id: NUM.29.17
reference: Numbers 29:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שֵּׁנִ֗י פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנֵ֥ים עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: te
  text: 'మరియు రెండవ రోజున: మందలోని పన్నెండు ఎద్దులు[a], రెండు పొట్టేళ్లు, ఒక సంవత్సరం వయసున్న లోపంలేని పద్నాలుగు గొర్రెపిల్లలు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “పన్నెండు ఎద్దులు, పశువుల మందకు చెందినవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: రెండవ రోజున
  rationale: పండుగ అర్పణల వరుసలో తదుపరి రోజును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; జాబితా కొనసాగింపు సందర్భం నుంచే స్పష్టమవుతుంది.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: మందలోని కోడెదూడలు
  rationale: పలి సందర్భంలోని బలి పశువులను సూచించే פָּרִיםకు ‘కోడెదూడలు’ సహజంగా సరిపోతుంది; בְּנֵי בָקָר అనే వర్గీకరణను ‘మందలోని’ అని వ్యక్తం చేసింది.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండు
  rationale: కోడెదూడల సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: אֵילִם שְׁנָיִם
  choice: పొట్టేళ్లు రెండు
  rationale: אֵילִם బలికి ఉపయోగించే మగ గొర్రెలను సూచిస్తుంది; తెలుగు జాబితా శైలిలో నామవాచకం తర్వాత సంఖ్యను ఉంచింది.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ఏడాది వయసుగల గొర్రెపిల్లలు
  rationale: בְּנֵי שָׁנָה అనే వయస్సు సూచించే హీబ్రూ నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אַרְבָּעָה עָשָׂר
  choice: పద్నాలుగు
  rationale: గొర్రెపిల్లల సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: תְּמִימִם
  choice: ఏ లోపమూ లేని
  rationale: బలి నియమాల సందర్భంలో శారీరక దోషం లేదా కళంకం లేని జంతువులను సూచించే పదబంధం.
