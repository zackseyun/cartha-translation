revisions:
- from: 'రెండవ రోజున: మందలోని కోడెదూడలు పన్నెండు[a], పొట్టేళ్లు రెండు, ఏ లోపమూ లేని ఏడాది వయసుగల గొర్రెపిల్లలు పద్నాలుగు,'
  to: 'మరియు రెండవ రోజున: మందలోని పన్నెండు ఎద్దులు[a], రెండు పొట్టేళ్లు, ఒక సంవత్సరం వయసున్న లోపంలేని పద్నాలుగు గొర్రెపిల్లలు,'
