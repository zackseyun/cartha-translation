source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: te
  text: వాటి ధాన్యార్పణలూ పానార్పణలూ ఎద్దులకూ, పొట్టేళ్లకూ, గొర్రెపిల్లలకూ, వాటి సంఖ్య చొప్పున, నియమం ప్రకారం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్దేశించిన విధానం ప్రకారం.” ఇక్కడి హీబ్రూ పదం ఈ అర్పణలకు నిర్ణయించబడిన నియమబద్ధమైన పద్ధతిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: వాటి ధాన్యార్పణలను
  rationale: బలి సందర్భంలో מִנְחָה సాధారణ అర్పణను కాకుండా జంతుబలులతో పాటు అర్పించే ధాన్యార్పణను సూచిస్తుంది. అనేక జంతువులకు సంబంధించిన సమష్టి భావాన్ని సహజమైన తెలుగులో బహువచనంతో వ్యక్తం చేశాం.
- source_word: וְנִסְכֵּיהֶם
  choice: పానార్పణలను
  rationale: נֶסֶךְ పోసి అర్పించే పానీయ అర్పణను సూచిస్తుంది; ‘పానార్పణ’ సంక్షిప్తంగా, స్పష్టంగా ఆ ఆచారార్థాన్ని తెలియజేస్తుంది.
- source_word: לַפָּרִים
  choice: ఎద్దులకు
  rationale: ל ఉపసర్గ ఆయా బలిజంతువులకు సంబంధించిన అనుబంధ అర్పణలను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָאֵילִם
  choice: పొట్టేళ్లకు
  rationale: אֵילִים బలికి ఉపయోగించే మగ గొర్రెలను సూచిస్తుంది; ‘పొట్టేళ్లు’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כְּבָשִׂים ఈ బలి సందర్భంలో గొర్రెపిల్లలను సూచిస్తుంది; జాబితాలోని సంబంధాన్ని చతుర్థీ విభక్తితో కొనసాగించాం.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్య చొప్పున
  rationale: అనుబంధ అర్పణలు జంతువుల సంఖ్యకు అనుగుణంగా ఉండాలని ఈ పదబంధం సూచిస్తుంది; ‘సంఖ్య చొప్పున’ తెలుగులో సహజమైన విధానాత్మక వ్యక్తీకరణ.
- source_word: כַּמִּשְׁפָּט
  choice: నియమించిన విధి ప్రకారం
  rationale: బలి ధర్మశాస్త్ర సందర్భంలో מִשְׁפָּט స్థిరపరచబడిన నియమాన్ని లేదా నిర్దేశిత పద్ధతిని సూచిస్తుంది. ఈ అనువాదం న్యాయపరమైన నియమ భావాన్నీ, ఆచరణ విధానాన్నీ కలిపి ఉంచుతుంది.
