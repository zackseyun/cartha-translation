  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. మూలంలోని నామవాచక వాక్యభాగాన్ని తెలుగు సందర్భంలో సంపూర్ణ ఆజ్ఞగా సహజంగా చదవడానికి ‘అర్పించాలి’ అని స్పష్టం చేశాం; ఇది పరిసర బలి ఆదేశాల నుంచి గ్రహించబడే క్రియ.
