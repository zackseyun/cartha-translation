translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల నియమావళికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని నామవాచక శకలాన్ని సందర్భానుసారంగా పూర్తి ఆజ్ఞార్థ వాక్యంగా సహజీకరించాం; కొత్త సిద్ధాంతార్థం చేర్చలేదు.
