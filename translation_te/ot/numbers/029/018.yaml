  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: te
  text: ఎద్దులకూ, పొట్టేళ్లకూ, గొర్రెపిల్లలకూ వాటి సంఖ్యను బట్టి, నిర్ణయించిన విధానం ప్రకారము[a], వాటి ధాన్యార్పణ, పానార్పణలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్ణయించిన పద్ధతి ప్రకారం.” హీబ్రూ כַּמִּשְׁפָּט స్థాపించబడిన నియమాన్ని లేదా విధానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: వాటికి అర్పించాల్సిన ధాన్యార్పణను
  rationale: బలుల సందర్భంలో מִנְחָה అనేది దహనబలితో పాటు అర్పించే ధాన్యార్పణను సూచిస్తుంది. హీబ్రూలోని ఏకవచన రూపాన్ని తెలుగు ఏకవచనంతో నిలిపి, సంబంధార్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: נִסְכֵּיהֶם
  choice: పానార్పణలను
  rationale: נֶסֶךְ బలులతో పాటు పోసి అర్పించే ద్రవార్పణను సూచిస్తుంది. ‘పానార్పణలు’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: לַפָּרִים
  choice: ఎద్దులకు
  rationale: ఉపసర్గ ל ఇక్కడ ఆయా బలిపశువులకు సంబంధించిన అనుబంధ అర్పణలను పంచి చూపుతుంది.
- source_word: לָאֵילִם
  choice: పొట్టేళ్లకు
  rationale: אֵילִים బలికి ఉపయోగించే మగ గొర్రెలను సూచిస్తుంది; ‘పొట్టేళ్లు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כְּבָשִׂים బలుల జాబితాలో గొర్రెపిల్లలను సూచిస్తుంది; పంపిణీ భావాన్ని ‘-కు’ విభక్తితో నిలిపాం.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్యను బట్టి
  rationale: అర్పణల పరిమాణం బలిపశువుల సంఖ్యకు అనుగుణంగా ఉండాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּמִּשְׁפָּט
  choice: నియమం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ స్థాపితమైన బలివిధానాన్ని లేదా నిర్దేశిత పద్ధతిని సూచిస్తుంది. ‘నియమం ప్రకారం’ దాని న్యాయ-ఆచార భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
