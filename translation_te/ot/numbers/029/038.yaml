source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: te
  text: పాపపరిహార బలిగా ఒక మేకపోతును అర్పించాలి. ఇది నిత్య దహనబలికి, దాని ధాన్యార్పణకు, దాని పానార్పణకు అదనంగా అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ఒక మేకపోతును
  rationale: బలుల సందర్భంలో שָׂעִיר సాధారణంగా మగ మేకను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మేకపోతు’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: యాజక బలుల సందర్భంలో חַטָּאת నైరూప్యమైన ‘పాపం’ కంటే పాపానికి సంబంధించిన బలిని సూచిస్తుంది; ‘పాపపరిహార బలి’ సాధారణ పాఠకులకు ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: అర్పించవలసిన జంతువు సంఖ్యను నిర్దేశించే సంఖ్యావాచకం.
- source_word: מִ/לְּ/בַד
  choice: అదనంగా
  rationale: ఈ బలి ముందే నియమించబడిన నిత్య బలితోపాటు అదనంగా అర్పించబడాలని సూచిస్తుంది.
- source_word: עֹלַת הַ/תָּמִיד
  choice: నిత్య దహనబలి
  rationale: עֹלָה పూర్తిగా దహించబడే బలి; תָּמִיד నిరంతరం లేదా క్రమంగా అర్పించే నియమిత బలిని సూచిస్తుంది. ‘నిత్య దహనబలి’ సంక్షిప్తమైన, గౌరవప్రదమైన అనువాదం.
- source_word: וּ/מִנְחָתָ/הּ
  choice: దాని ధాన్యార్పణ
  rationale: యాజక బలుల సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: וְ/נִסְכָּ/הּ
  choice: దాని పానార్పణ
  rationale: נֶסֶךְ బలితోపాటు పోసే పానీయ అర్పణను సూచిస్తుంది; ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: חַטָּאת అనే బలి పదానికి తెలుగు రూపం
  choice: పాపపరిహార బలి
  alternative: పాపబలి
  rationale: మూలపదం బలి యొక్క ఖచ్చితమైన కార్యవిధానంపై అన్ని సిద్ధాంత ప్రశ్నలనూ పరిష్కరించదు. అయినా ‘పాపపరిహార బలి’ ఆధునిక తెలుగులో బలి వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది; ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్నీ చేర్చకుండా వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, బలుల సంబంధిత పదజాలంలో గౌరవప్రదమైన సంక్షిప్త శైలి. మూలంలోని సంక్షిప్త జాబితాను సహజ తెలుగు వాక్యాలుగా విభజించాం; భావసంబంధాన్ని మార్చలేదు.
