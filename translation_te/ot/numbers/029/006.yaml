revisions:
- from: నెలకు సంబంధించిన దహనబలిని, దానితో కూడిన ధాన్యార్పణను[a], నిత్య దహనబలిని, దానితో కూడిన ధాన్యార్పణను, వాటి పానార్పణలను—వాటికి నిర్దేశించిన విధంగా—అర్పించాలి. అది యహ్వేకు ఇంపైన సువాసన కలిగించే అగ్నిబలి[b].
  to: నెల దహనబలితోను దాని ధాన్యార్పణతోను[a], నిత్య దహనబలితోను దాని ధాన్యార్పణతోను, వాటి పానార్పణలతోను పాటు, వాటికి నిర్దేశించిన విధంగా అర్పించాలి; అవి యహ్వేకు ఇంపైన సువాసనగా ఉండే అగ్నిబలి[b].
