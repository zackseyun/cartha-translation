source:
  edition: WLC
  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: te
  text: నెల దహనబలితోను దాని ధాన్యార్పణతోను[a], నిత్య దహనబలితోను దాని ధాన్యార్పణతోను, వాటి పానార్పణలతోను పాటు, వాటికి నిర్దేశించిన విధంగా అర్పించాలి; అవి యహ్వేకు ఇంపైన సువాసనగా ఉండే అగ్నిబలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నెల దహనబలి” అనేది అమావాస్య రోజున అర్పించే బలిని సూచించవచ్చు; హీబ్రూ పాఠ్యంలో అక్షరార్థంగా “నెల యొక్క దహనబలి” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆహార అర్పణ.” సంప్రదాయంగా “అగ్నిలో అర్పించే అర్పణ” లేదా “అగ్నిబలి” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: వీటితో పాటు అర్పించాలి
  rationale: ఈ బలులు ముందటి వచనాల్లో ఆదేశించిన బలులకు అదనంగా అర్పించాల్సినవని సందర్భం తెలుపుతుంది; తెలుగులో వాక్యాంత క్రియతో ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: నెలకు సంబంధించిన దహనబలి
  rationale: హీబ్రూ అక్షరార్థంగా ‘నెల యొక్క దహనబలి’ అని ఉంది. ఇది అమావాస్య బలిని సూచించే అవకాశం ఉన్నా, ఆ భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా మూలంలోని విస్తృత పదప్రయోగాన్ని నిలిపాం.
- source_word: מִנְחָתָהּ
  choice: దానితో కూడిన ధాన్యార్పణ
  rationale: బలుల సందర్భంలో מִנְחָה సాధారణంగా జంతుబలితో పాటు అర్పించే ధాన్యార్పణను సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: నిత్య దహనబలి
  rationale: תָּמִיד క్రమంగా, నిరంతరం జరిగే నిర్దేశిత బలిని సూచిస్తుంది. ‘నిత్య’ అనేది తెలుగు బైబిలు సందర్భంలో సంక్షిప్తంగా, సహజంగా ఉంది; దాని నియమిత స్వభావాన్ని నిలుపుతుంది.
- source_word: וְנִסְכֵּיהֶם
  choice: వాటి పానార్పణలు
  rationale: נֶסֶךְ పోసి అర్పించే పానీయ అర్పణను సూచిస్తుంది; బహువచన ప్రత్యయాన్ని ‘వాటి’తో నిలిపాం.
- source_word: כְּמִשְׁפָּטָם
  choice: వాటికి నిర్దేశించిన విధంగా
  rationale: ఆరాధనా నియమాల సందర్భంలో מִשְׁפָּט నిర్ణయించబడిన పద్ధతి లేదా క్రమాన్ని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: బలి దేవునికి ఆమోదయోగ్యంగా ఉండడాన్ని తెలిపే స్థిరమైన హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: אִשֶּׁה
  choice: అగ్నిబలి
  rationale: ఇది అగ్నిపై సమర్పించే అర్పణకు వాడే సాంకేతిక బలిపదం. సంక్షిప్తమైన ‘అగ్నిబలి’ మూలంలోని అగ్ని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘ఆహార అర్పణ’ అనే ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఇచ్చాం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యహ్వే’గా ఇచ్చాం; לְ యొక్క సమర్పణ భావాన్ని ‘కు’ తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా పునర్నిర్మించిన ఉచ్చారణకు సమీపమైన తెలుగు రూపాన్ని వాడాం.
- issue: אִשֶּׁה అనే బలిపదం అర్థం
  choice: అగ్నిబలి
  alternative: ఆహార అర్పణ
  rationale: పదం అగ్నితో సమర్పించే బలిని సూచించే సాంకేతిక పదంగా పనిచేస్తుంది. దాని అర్థవ్యాప్తిపై ఉన్న నిజమైన అనిశ్చితిని ప్రధాన పాఠ్యంలో ఒకే సిద్ధాంతంగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూ వాక్యంలోని క్రియారహిత జాబితాను తెలుగులో సహజంగా చదవడానికి ‘అర్పించాలి’ అనే సందర్భసిద్ధ క్రియను చేర్చాం. రెండు పాదసూచిక సూచికలూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
