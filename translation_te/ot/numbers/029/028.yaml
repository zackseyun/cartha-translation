source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: te
  text: నిత్య దహనబలి, దాని ధాన్యార్పణ, దాని పానార్పణలకు అదనంగా పాపపరిహార బలిగా ఒక మగ మేకను అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: పాపపరిహార బలిగా ఒక మగ మేకను
  rationale: שָׂעִיר మగ మేకను సూచిస్తుంది; אֶחָד సంఖ్యను స్పష్టంగా నిలుపుతుంది; బలుల సందర్భంలో חַטָּאת పాపపరిహార బలిని సూచిస్తుంది.
- source_word: מִ/לְּ/בַד
  choice: అదనంగా
  rationale: ఈ బలి నిత్య బలి సముదాయానికి తోడుగా అర్పించబడుతుందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת הַ/תָּמִיד
  choice: నిత్య దహనబలి
  rationale: עֹלָה పూర్తిగా దహించబడే బలిని, תָּמִיד నిరంతరం నియమితంగా అర్పించే స్వభావాన్ని సూచిస్తాయి; 'నిత్య దహనబలి' సంక్షిప్తంగా మరియు గౌరవప్రదంగా ఉంది.
- source_word: וּ/מִנְחָתָ/הּ
  choice: దాని ధాన్యార్పణకు
  rationale: యాజక బలుల జాబితాలో מִנְחָה తోడుగా అర్పించే ధాన్యార్పణను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: וְ/נִסְכָּ/הּ
  choice: దాని పానార్పణకు
  rationale: נֶסֶךְ బలితో కూడిన ద్రవార్పణను సూచిస్తుంది; 'పానార్పణ' ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి ఆచార సంబంధ భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బలి-ఆచార పదజాలం వాడబడింది. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చినా, సమస్త వివరాలు మరియు సంబంధాలు నిలుపబడ్డాయి.
