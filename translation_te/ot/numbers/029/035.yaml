  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: te
  text: ఎనిమిదవ రోజున మీకు గంభీరమైన సభ[a] ఉండాలి; మీరు ఏ సాధారణ పనీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముగింపు సభ.’ హీబ్రూ పదమైన עֲצֶרֶת పండుగ ముగింపులో జరిగే సభను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: నిర్దిష్ట క్రమసంఖ్యతో కూడిన కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: עֲצֶרֶת
  choice: గంభీరమైన సమాజం
  rationale: పండుగ సందర్భంలోని పవిత్రమైన, ఆచారపూర్వక సమావేశ భావాన్ని తెలియజేస్తుంది; అది ముగింపు సమావేశమనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: תִּהְיֶה לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: అక్షరార్థమైన ‘మీకు ఉండును’ అనే నిర్మాణాన్ని తెలుగులో ఆజ్ఞార్థక న్యాయశైలికి తగిన విధంగా అందిస్తుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: ఏ సాధారణ పనీ
  rationale: పవిత్ర దినాల్లో నిషేధించబడిన నిత్య వృత్తి లేదా సామాన్య శ్రమను సూచిస్తుంది; ప్రతి రకమైన క్రియనూ పూర్తిగా నిషేధిస్తున్నట్టు అతిగా విస్తరించదు.
- source_word: לֹא תַעֲשׂוּ
  choice: చేయకూడదు
  rationale: బహువచన సంబోధనలోని నిషేధాత్మక న్యాయ ఆదేశాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: עֲצֶרֶת అనే పండుగ పదానికి అర్థం
  choice: గంభీరమైన సమాజం
  alternative: ముగింపు సమాజం
  rationale: ఈ పదం పవిత్ర సమావేశాన్ని సూచిస్తుంది; పండుగ ముగింపులో జరిగే సమావేశం అనే భావం కూడా ఉండవచ్చు. ప్రధాన పాఠ్యంలో దానిని అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆచార శైలి. ‘సమాజం’ ఇక్కడ ప్రజల సమూహం కంటే సమావేశం/సభ అనే భావంలో వాడబడింది; హీబ్రూ పదంలోని ముగింపు భావసాధ్యతను పాదసూచికలో నిలిపాం.
