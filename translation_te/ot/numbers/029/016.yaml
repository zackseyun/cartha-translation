  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: te
  text: పాపపరిహార బలిగా ఒక మగ మేకను[a] అర్పించాలి; ఇది నిత్య దహనబలికి, దాని ధాన్యార్పణకూ పానార్పణకూ అదనం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలిగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: ఒక మగ మేకను
  rationale: బలి జంతువు మగదని సూచించే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; אֶחָד సంఖ్యను ‘ఒక’గా నిలుపుతుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో ఈ పదం పాపం అనే భావనకన్నా పాపానికి సంబంధించిన బలిని సూచిస్తుంది. తెలుగులో సుపరిచితమైన ‘పాపపరిహార బలి’ని ప్రధాన పాఠంలో ఉంచి, ‘శుద్ధీకరణ బలి’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מִלְּבַד
  choice: అదనం
  rationale: ఈ బలి నిత్య దహనబలికి అదనంగా అర్పించబడుతుందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: నిత్య దహనబలి
  rationale: నిర్దేశితంగా పునరావృతమయ్యే దహనబలిని సూచించే సంప్రదాయబద్ధమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: מִנְחָתָהּ
  choice: దానితోపాటు అర్పించే ధాన్యార్పణ
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘దానితోపాటు’ అని వ్యక్తం చేశాం.
- source_word: וְנִסְכָּהּ
  choice: పానార్పణ
  rationale: పోయబడి అర్పించబడే ద్రవ అర్పణను సాధారణ పాఠకులకు అర్థమయ్యే, బైబిలు సందర్భానికి తగిన పదంతో తెలిపింది.
theological_decisions:
- issue: חַטָּאת అనే బలి పదానికి అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ‘పాపపరిహార బలి’ విస్తృతంగా గుర్తించదగిన పదం; అయితే ఈ బలి శుద్ధీకరణ కార్యాన్ని ముందుకు తెచ్చే అనువాదం కూడా సాధ్యమే కాబట్టి ఆ నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బలి సంబంధ పదజాలం వాడబడింది. హీబ్రూ వాక్యం మునుపటి ఆజ్ఞలతో కొనసాగుతున్నందున తెలుగులో సహజమైన విధి వాక్యంగా ‘అర్పించాలి’ని సరఫరా చేశాం. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికతో సరిపోతుంది.
