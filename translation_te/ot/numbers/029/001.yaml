id: NUM.29.1
reference: Numbers 29:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: te
  text: ఏడవ నెలలో, ఆ నెల మొదటి రోజున, మీకు పవిత్ర సభ జరగాలి. శ్రమతో కూడిన ఏ పనీ మీరు చేయకూడదు. అది మీకు బూరధ్వని దినం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేకల దినం,” “జయధ్వని దినం.” హీబ్రూ పదం తేరూఆ పెద్దగా ఎత్తిన ధ్వనిని సూచిస్తుంది; సందర్భాన్ని బట్టి అది బూరధ్వని, కేక లేదా జయధ్వని కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: ב అనే ఉపసర్గ ఇక్కడ కాలాన్ని సూచిస్తుంది. వచనం ముందటి నియమావళిని కొనసాగిస్తున్నప్పటికీ, తెలుగులో వాక్యారంభంలో ‘మరియు’ చేర్చడం సహజం కానందున కొనసాగింపు భావాన్ని సందర్భానికే వదిలాం.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ఆ నెల మొదటి రోజున
  rationale: అక్షరార్థంగా ‘నెలలో ఒకటవ రోజున’ అనే హీబ్రూ పంచాంగ ప్రయోగం; ఆధునిక తెలుగులో స్పష్టంగా ‘మొదటి రోజున’ అని ఇచ్చాం.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: అధికారికంగా పిలిచి కూడబెట్టే పవిత్ర సమాజాన్ని సూచించే స్థిర ఆరాధనా పదబంధం. ‘పవిత్ర సభ’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: శ్రమతో కూడిన ఏ పనీ
  rationale: పండుగ రోజున నిషేధించబడిన సాధారణ శ్రమ లేదా వృత్తిపరమైన పనిని సూచిస్తుంది; సమస్త క్రియాకలాపాలను నిషేధించినట్లు విస్తరించకుండా ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు చేయకూడదు
  rationale: రెండవ పురుష బహువచనంలోని న్యాయపరమైన నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יוֹם תְּרוּעָה
  choice: బూరధ్వని చేసే రోజు
  rationale: תְּרוּעָה పెద్దగా ఎత్తిన ధ్వనిని—బూర సంకేతాన్ని, కేకను లేదా జయధ్వనిని—సూచించగలదు. ఈ ఆరాధనా పంచాంగ సందర్భంలో బూరధ్వని సముచితం; అయినా మూలపదంలోని విస్తృతార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יִהְיֶה לָכֶם
  choice: అది మీకు ... రోజు
  rationale: ఆ రోజు ప్రజల కోసం నియమించబడిన స్వభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יוֹם תְּרוּעָה అనే పండుగ దినపు వివరణ
  choice: బూరధ్వని చేసే రోజు
  alternative: కేకలు లేదా జయధ్వని చేసే రోజు
  rationale: మూలవచనం తరువాతి కాలపు పండుగ పేరును ఉపయోగించకుండా, ఆ దినాన్ని దాని ప్రత్యేక ధ్వనితో వర్ణిస్తుంది. ఆరాధనా సందర్భంలో బూరధ్వనిని ప్రధాన పాఠంలో ఉంచి, תְּרוּעָה పదంలోని నిజమైన అర్థ విస్తృతిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నియమావళికి తగిన గౌరవప్రదమైన, స్పష్టమైన శైలి. ‘పవిత్ర సభ,’ ‘చేయకూడదు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, పాతకాలపు లేదా మతశాఖాపరమైన ప్రత్యేక పరిభాషను నివారించాం.
