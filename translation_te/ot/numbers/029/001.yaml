  to: ఏడవ నెలలో, ఆ నెల మొదటి రోజున, మీకు పవిత్ర సభ జరగాలి. శ్రమతో కూడిన ఏ పనీ మీరు చేయకూడదు. అది మీకు బూరధ్వని దినం[a].
