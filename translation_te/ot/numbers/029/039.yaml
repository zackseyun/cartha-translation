source:
  edition: WLC
  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: te
  text: మీ నియమిత సమయాల్లో యెహోవాకు వీటిని అర్పించాలి. మీ మొక్కుబడి అర్పణలకు, స్వేచ్ఛార్పణలకు అదనంగా మీ దహనబలులు, ధాన్యార్పణలు, పానార్పణలు, సమాధాన బలులు[a] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహవాస బలులు.” హీబ్రూ పదం శాంతి, క్షేమం లేదా సంపూర్ణతకు సంబంధించిన ఒక బలి వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תַּעֲשׂוּ
  choice: వీటిని అర్పించాలి
  rationale: תַּעֲשׂוּ అక్షరార్థంగా ‘చేయాలి’ అయినా, బలుల సందర్భంలో ‘అర్పించాలి’ అనేది సహజంగా ఉండి భావాన్ని స్పష్టంగా తెలియజేస్తుంది; אֵלֶּה ముందుగా నిర్దేశించిన పండుగ అర్పణలను సూచిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దేవుని ఒడంబడిక నామమైన יהוהను వ్యక్తినామంగా ఉంచి, לְ సూచించే సమర్పణ దిశను ‘కు’తో తెలిపింది.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: మీరు నియమించుకున్న సమయాల్లో
  rationale: מוֹעֵדకు నియమిత సమయం లేదా పండుగ సందర్భం అనే పరిధి ఉంది. ‘నియమించుకున్న సమయాలు’ అనే రూపం పండుగలకు మాత్రమే భావాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: לְבַד
  choice: అదనం
  rationale: నిర్దేశిత పండుగ బలులు మొక్కుబడి, స్వేచ్ఛార్పణలకంటే వేరుగా, వాటికి అదనంగా అర్పించాలనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִנִּדְרֵיכֶם
  choice: మీ మొక్కుబడి అర్పణలకు
  rationale: נֶדֶר ఇక్కడ కేవలం పలికిన మొక్కును కాక, ఆ మొక్కు ప్రకారం సమర్పించే అర్పణను సూచిస్తుంది.
- source_word: וְנִדְבֹתֵיכֶם
  choice: స్వేచ్ఛార్పణలకు
  rationale: నిర్బంధం వల్ల కాక స్వచ్ఛందంగా ఇచ్చే అర్పణలను సూచించే సంక్షిప్తమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: לְעֹלֹתֵיכֶם
  choice: మీ దహనబలులు
  rationale: עֹלָה పూర్తిగా దహనం చేసే ప్రామాణిక బలి వర్గాన్ని సూచిస్తుంది; ‘దహనబలి’ ఆ వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: ధాన్యార్పణలు
  rationale: యాజక సంబంధమైన ఈ సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: וּלְנִסְכֵּיכֶם
  choice: పానార్పణలు
  rationale: נֶסֶךְ పోసి సమర్పించే ద్రవ అర్పణను సూచిస్తుంది; ‘పానార్పణ’ సహజమైన బైబిలు తెలుగు పదం.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: సమాధాన బలులు
  rationale: שְׁלָמִים అనే బలి వర్గానికి శాంతి, క్షేమం, సంపూర్ణత అనే భావసంబంధాన్ని నిలిపే తెలుగు రూపం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా అందించింది.
- issue: שְׁלָמִים అనే బలి వర్గం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: మూలపదంలోని శాంతి, క్షేమం, సంపూర్ణత భావసంబంధాన్ని ప్రధాన పాఠంలో నిలిపి, సహవాసాన్ని నొక్కిచెప్పే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, לְבַד సంబంధం తెలుగులో అస్పష్టంగా కాకుండా చివర ‘అదనం’ అని సహజంగా అమర్చబడింది.
