revisions:
- from: మీరు నియమించుకున్న సమయాల్లో యెహోవాకు వీటిని అర్పించాలి. ఇవి మీ దహనబలులు, ధాన్యార్పణలు, పానార్పణలు, సమాధాన బలులు[a]గా మీరు అర్పించే మొక్కుబడి అర్పణలకు, స్వేచ్ఛార్పణలకు అదనం.
  to: మీ నియమిత సమయాల్లో యెహోవాకు వీటిని అర్పించాలి. మీ మొక్కుబడి అర్పణలకు, స్వేచ్ఛార్పణలకు అదనంగా మీ దహనబలులు, ధాన్యార్పణలు, పానార్పణలు, సమాధాన బలులు[a] అర్పించాలి.
  rationale: The revision replaces the potentially misleading active expression “మీరు నియమించుకున్న” with “మీ నియమిత,” preserving the sense of appointed sacred occasions. It also places “మొక్కుబడి అర్పణలకు, స్వేచ్ఛార్పణలకు అదనంగా” before the sacrificial list, making clear that the required appointed-time offerings are additional to those voluntary/vowed offerings while retaining the Hebrew list and its cultic terminology.
  reviewer_model: gpt-5.6-terra
