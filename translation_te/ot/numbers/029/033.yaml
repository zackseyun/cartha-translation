id: NUM.29.33
reference: Numbers 29:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: te
  text: వాటి ధాన్యార్పణను, పానార్పణలను ఎద్దులకు, పొట్టేళ్లకు, గొర్రెపిల్లలకు వాటి సంఖ్య ప్రకారం, వాటికి నిర్దేశించిన విధానం ప్రకారం సమర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: సమర్పించాల్సిన ధాన్యార్పణను
  rationale: బలుల సందర్భంలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది. హీబ్రూలోని ఏకవచన సమష్టి భావాన్ని తెలుగు ఏకవచనంతో నిలిపాము; వాక్యఖండాన్ని సహజ తెలుగులో పూర్తి చేయడానికి సందర్భం నుంచి ‘సమర్పించాలి’ అనే క్రియను పూరించాము.
- source_word: נִסְכֵּיהֶם
  choice: పానార్పణలను
  rationale: נֶסֶךְ బలితోపాటు పోసే పానీయ అర్పణను సూచిస్తుంది; హీబ్రూ బహువచనాన్ని నిలిపాము.
- source_word: לַפָּרִים
  choice: ఎద్దులకు
  rationale: పలువిధాల బలుల జాబితాలో פָּרִים అంటే ఎద్దులు; మూలంలో లేని వయస్సు సూచనను చేర్చలేదు.
- source_word: לָאֵילִם
  choice: పొట్టేళ్లకు
  rationale: אַיִל బలి సందర్భంలో మగ గొర్రెను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన ‘పొట్టేలు’ వాడాము.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כֶּבֶשׂ గొర్రెపిల్లను సూచిస్తుంది. ఈ వచనంలో అవసరం లేని లింగ నిర్దిష్టతను చేర్చలేదు.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్య ప్రకారం
  rationale: జంతువుల నిర్దేశిత సంఖ్యకు అనుగుణంగా అర్పణలు ఉండాలని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: כְּמִשְׁפָּטָם
  choice: వాటికి నిర్దేశించిన విధానం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ ఆ అర్పణలకు నిర్దేశించబడిన ఆచారపద్ధతి లేదా నియమాన్ని సూచిస్తుంది. प्रत्यయం దేనిని సూచిస్తుందో తెలుగులో సహజంగా చూపుతూ భావంలోని స్వల్ప అనిశ్చితిని అతిగా పరిష్కరించలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూల వచనం ముందరి ఆజ్ఞకు అనుసంధానమైన వాక్యఖండం కావడంతో, తెలుగులో స్వతంత్రంగా చదవడానికి ‘సమర్పించాలి’ అనే సందర్భానుగుణ క్రియను పూరించాము.
