source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: te
  text: వాటికి సంబంధించిన ధాన్యార్పణను, పానీయార్పణలను ఎద్దుల కోసం, పొట్టేళ్ల కోసం, గొర్రెపిల్లల కోసం, వాటి సంఖ్య ప్రకారం నిర్దేశించిన విధంగా[a] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్దేశిత నియమం ప్రకారం.” హెబ్రీ పదం כַּמִּשְׁפָּט ఈ అర్పణల కోసం స్థిరపరచబడిన నియమాన్ని లేదా విధానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: వాటితోపాటు అర్పించాల్సిన ధాన్యార్పణను
  rationale: బలుల సందర్భంలో מִנְחָה అనేది జంతుబలితోపాటు అర్పించే ధాన్యార్పణను సూచిస్తుంది. హెబ్రీలో ఏకవచనం ఉన్నందున తెలుగులోనూ ఏకవచనాన్ని నిలిపాం; సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘వాటితోపాటు అర్పించాల్సిన’ అని వ్యక్తం చేశాం.
- source_word: נִסְכֵּיהֶם
  choice: పానార్పణలను
  rationale: נֶסֶךְ పోసి అర్పించే ద్రవార్పణను సూచిస్తుంది. ‘పానార్పణలు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని బహువచనాన్ని నిలుపుతుంది.
- source_word: לַפָּרִים
  choice: ఎద్దులకు
  rationale: ל ఉపసర్గ ఇక్కడ అనుబంధ అర్పణలు ఏ జంతుబలులకు సంబంధించినవో సూచిస్తుంది.
- source_word: לָאֵילִם
  choice: పొట్టేళ్లకు
  rationale: אַיִל అనేది బలుల జాబితాలో మగ గొర్రెను సూచిస్తుంది; ‘పొట్టేలు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כֶּבֶשׂ బలి సందర్భంలో గొర్రెపిల్లను సూచిస్తుంది; జాబితాలోని సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్య ప్రకారం
  rationale: అనుబంధ అర్పణల పరిమాణం జంతువుల సంఖ్యకు అనుగుణంగా ఉండాలని ఈ పదబంధం సూచిస్తుంది.
- source_word: כַּמִּשְׁפָּט
  choice: నియమించిన విధంగా
  rationale: מִשְׁפָּט ఇక్కడ స్థిరపరచబడిన ఆచార నియమం లేదా నిర్దేశిత పద్ధతిని సూచిస్తుంది. ‘నియమించిన విధంగా’ న్యాయ తీర్పు అనే అనవసర భావాన్ని రానివ్వకుండా ఆచరణాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּ
  choice: వాటితోపాటు
  rationale: ఈ వాక్యం ముందటి వచనంలోని జంతుబలుల జాబితాపై వాక్యనిర్మాణపరంగా ఆధారపడింది. ప్రారంభ సంధి అనుబంధ అర్పణలను సూచిస్తున్నందున తెలుగులో ‘వాటితోపాటు’ అని స్పష్టం చేశాం.
