translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూల వాక్యం ముందటి వచనంపై ఆధారపడుతున్నందున తెలుగులో సంపూర్ణ ఆజ్ఞార్థ వాక్యంగా సహజీకరించాం; కొత్త ధార్మిక భావాన్ని చేర్చలేదు.
