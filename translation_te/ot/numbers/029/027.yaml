revisions:
- from: ఎద్దులకు, పొట్టేళ్లకు, గొర్రెపిల్లలకు వాటి సంఖ్య ప్రకారం నియమించిన విధంగా, వాటితోపాటు అర్పించాల్సిన ధాన్యార్పణను, పానార్పణలను అర్పించాలి.
  to: వాటికి సంబంధించిన ధాన్యార్పణను, పానీయార్పణలను ఎద్దుల కోసం, పొట్టేళ్ల కోసం, గొర్రెపిల్లల కోసం, వాటి సంఖ్య ప్రకారం నిర్దేశించిన విధంగా[a] అర్పించాలి.
  rationale: 'The revision follows the Hebrew sequence more closely: accompanying grain and drink offerings are named first, then assigned to bulls, rams, and lambs, in proportion to their number and according to the prescribed procedure. It retains a complete Telugu sentence through the contextually implied command while removing repetitive phrasing and anchoring the lexical note.'
