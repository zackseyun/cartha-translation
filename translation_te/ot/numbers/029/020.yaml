source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י פָּרִ֥ים עַשְׁתֵּי עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: te
  text: 'మూడవ రోజున: పదకొండు ఎద్దులు, రెండు పొట్టేళ్లు, ఒక సంవత్సరం వయసున్న పద్నాలుగు లోపంలేని గొర్రెపిల్లలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: వావ్ సంధికారకం వరుస జాబితాను కొనసాగిస్తుంది; తెలుగులో సహజమైన లెక్కింపు శైలిలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ కొనసాగింపు స్పష్టంగా ఉంటుంది.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: పదకొండు కోడెదూడలను
  rationale: פָּרִים బలికి ఉపయోగించే మగ పశువులను సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘కోడెదూడలు’ సహజంగా, నిర్దిష్టంగా ఉంటుంది.
- source_word: אֵילִם שְׁנָיִם
  choice: రెండు పొట్టేళ్లను
  rationale: אֵילִם అనేది మగ గొర్రెలకు, ముఖ్యంగా బలి సందర్భంలో, వాడే సాధారణ పదం; ‘పొట్టేళ్లు’ దానికి సహజ తెలుగు సమానం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ఒక సంవత్సరం వయసున్న పద్నాలుగు మగ గొర్రెపిల్లలను
  rationale: בְּנֵי שָׁנָה అనే హీబ్రూ ప్రయోగం ‘ఒక సంవత్సరం వయసున్న’ అని అర్థం; כְּבָשִׂיםను ఇక్కడ బలి జంతువులుగా స్పష్టంగా తెలియజేయడానికి ‘మగ గొర్రెపిల్లలు’గా అనువదించాం.
- source_word: תְּמִימִם
  choice: లోపం లేనివాటిని
  rationale: బలి నియమాల సందర్భంలో ఈ పదం శారీరక దోషం లేదా లోపం లేని జంతువులను సూచిస్తుంది; ‘పరిపూర్ణమైన’ అనే విస్తృత భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: తְּמִימִם ఏ జంతువులను విశేషిస్తుంది?
  choice: జాబితాలోని జంతువులన్నిటినీ విశేషించేలా ‘అన్నిటినీ లోపం లేనివాటిని’
  alternative: చివరిగా పేర్కొన్న గొర్రెపిల్లలను మాత్రమే విశేషించేలా అనువదించడం
  rationale: ఈ అధ్యాయంలోని సమాంతర బలి జాబితాలు అన్ని జంతువులూ లోపం లేనివిగా ఉండాలని చూపుతాయి. హీబ్రూ పదం పుంలింగ బహువచనంలో ఉండటం కూడా మొత్తం సమూహానికి వర్తించడానికి అనుకూలంగా ఉంది.
- issue: మూలంలో స్పష్టంగా లేని క్రియ
  choice: తెలుగు వాక్యం సంపూర్ణంగా ఉండేందుకు ‘అర్పించాలి’ని సందర్భానుసారంగా చేర్చడం
  alternative: క్రియ లేకుండా కేవలం జంతువుల జాబితాగా ఉంచడం
  rationale: మునుపటి వచనాల నుంచి బలి అర్పణ ఆజ్ఞ కొనసాగుతోంది. తెలుగులో స్వతంత్ర వచనం సహజంగా, స్పష్టంగా ఉండేందుకు క్రియను పూరించాం; కొత్త ఆచారార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, బలి నియమాల గంభీరతను నిలుపుతూ సహజమైన వాక్య నిర్మాణం ఉపయోగించబడింది. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
