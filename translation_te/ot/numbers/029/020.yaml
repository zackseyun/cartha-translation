  terminology: פָּרִים‌కు ‘ఎద్దులు’ అనేది ‘కోడెదూడలు’ కంటే వయస్సును అనవసరంగా తగ్గించకుండా సరిపోతుంది. אֵילִם‌కు ‘పొట్టేళ్లు’ సరైనది. תְּמִימִם‌కు ‘లోపంలేని’ బలి-సందర్భంలోని శారీరక దోషరాహిత్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
