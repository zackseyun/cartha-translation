  source_fidelity: సవరించిన పాఠం హీబ్రూ జాబితా-రూపాన్నీ, జంతువుల సంఖ్యలనూ, వయస్సు నిర్దేశాన్నీ, చివరి విశేషణమైన תְּמִימִם‌ను కాపాడుతుంది. మూలంలో క్రియ లేదు; కాబట్టి ‘అర్పించాలి’ని చేర్చలేదు. תְּמִימִם వ్యాకరణపరంగా వెంటనే ముందున్న గొర్రెపిల్లలకు సంబంధించినదిగా ఉంచబడింది; అది జాబితాలోని ప్రతి జంతువుకూ వర్తిస్తుందని పాఠ్యంలో స్పష్టపరచలేదు.
