  text: וּ/בַ/יּ֧וֹם הָ/רְבִיעִ֛י פָּרִ֥ים עֲשָׂרָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: te
  text: 'మరియు నాలుగవ రోజున: పది ఎద్దులు, రెండు పొట్టేళ్లు, ఏడాది వయసున్న పద్నాలుగు గొర్రెపిల్లలు, దోషరహితమైనవి,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: నాలుగవ రోజున
  rationale: వరుసగా పేర్కొంటున్న ఆచార జాబితాలోని తదుపరి దినాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చనవసరం లేదు.
- source_word: פָּרִים עֲשָׂרָה
  choice: పది కోడెదూడలను
  rationale: బలుల సందర్భంలో פָּרִים మగ పశువులను సూచిస్తుంది; ‘కోడెదూడలు’ సాధారణ పాఠకులకు స్పష్టంగా, బలి జంతువుల భావానికి అనుకూలంగా ఉంది.
- source_word: אֵילִם שְׁנָיִם
  choice: రెండు పొట్టేళ్లను
  rationale: אֵילִםకు బలి సందర్భంలో సహజమైన తెలుగు సమానార్థకం ‘పొట్టేళ్లు’.
- source_word: כְּבָשִׂים בְּנֵי־שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ఏడాది వయసున్న పద్నాలుగు గొర్రెపిల్లలను
  rationale: בְּנֵי־שָׁנָה అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజంగా ‘ఏడాది వయసున్న’ అని అనువదించి, సంఖ్యను జంతువుతో స్పష్టంగా కలిపింది.
- source_word: תְּמִימִם
  choice: అవన్నీ లోపం లేనివిగా
  rationale: బలి ధర్మశాస్త్రంలో ఈ పదం శారీరక దోషం లేదా కళంకం లేని జంతువులను సూచిస్తుంది. ‘లోపం లేనివి’ ఆధునిక పాఠకులకు స్పష్టమైనది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సంబంధమైన గంభీరతను కాపాడుతూ సహజమైన జాబితా వాక్యంగా రూపొందించబడింది. మూలంలో క్రియ లేకపోయినా ముందున్న ఆజ్ఞల నుంచి గ్రహించాల్సిన ‘అర్పించాలి’ని తెలుగులో వాక్యపూర్ణత కోసం స్పష్టంచేశాం.
