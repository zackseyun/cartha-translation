translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆచార భాష వాడబడింది. హెబ్రీలో క్రియ లేకపోయినా, సందర్భంలో ఆజ్ఞార్థం స్పష్టంగా ఉన్నందున తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘అర్పించాలి’ చేర్చబడింది.
