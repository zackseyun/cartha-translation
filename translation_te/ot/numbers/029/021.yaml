  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: te
  text: ఎద్దులకు, పొట్టేళ్లకు, గొర్రెపిల్లలకు వాటి సంఖ్యను బట్టి, నిర్ణయించిన విధి[a] ప్రకారం వాటి ధాన్యార్పణలను, పానార్పణలను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిర్దేశించిన ఆచారక్రమం ప్రకారం.’ ఇక్కడి హెబ్రీ పదం ఈ అర్పణలకు స్థిరపరచిన ఆచార నియమాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: వాటి ధాన్యార్పణలను
  rationale: బలి సంబంధ సందర్భంలో מִנְחָה ధాన్యంతో చేసే అనుబంధ అర్పణను సూచిస్తుంది. హెబ్రీ ఏకవచన రూపానికి బహువచన ప్రత్యయం ఉన్నా, జాబితాలోని పశువులకు సంబంధించిన సమష్టి అర్థం తెలుగులో సహజంగా బహువచనంతో వ్యక్తమవుతుంది.
- source_word: נִסְכֵּיהֶם
  choice: వాటి పానార్పణలను
  rationale: నైవేద్యంగా ద్రవాన్ని కుమ్మరించే అర్పణలను సూచించే నֶסֶךְకు ‘పానార్పణలు’ స్పష్టమైన, గౌరవప్రదమైన ఆచారపదం.
- source_word: לַפָּרִים
  choice: ఎద్దులకు
  rationale: బలుల జాబితాలో פָּרִים అంటే ఎద్దులు. మూలంలో వయస్సును ప్రత్యేకంగా చెప్పనందున ‘కోడెదూడలు’ అని అధిక నిర్దిష్టత ఇవ్వలేదు.
- source_word: לָאֵילִם
  choice: పొట్టేళ్లకు
  rationale: బలి సందర్భంలో אַיִל మగ గొర్రెను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేలు’ సహజమైన పదం.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כֶּבֶשׂ గొర్రెపిల్లను సూచిస్తుంది. ఈ వాక్యంలో మూలం లింగాన్ని స్పష్టంగా ముందుకు తేవకపోవడంతో ‘మగ గొర్రెపిల్లలు’ అని విస్తరించలేదు.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్యను బట్టి
  rationale: ప్రతి పశువుల వర్గానికి నిర్ణయించిన సంఖ్యకు అనుగుణంగా అనుబంధ అర్పణలు ఉండాలని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: כַּמִּשְׁפָּט
  choice: నిర్ణయించిన విధి ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ సాధారణ అలవాటు కాక, స్థిరపరచిన ఆచార నియమం లేదా విధానాన్ని సూచిస్తుంది. ‘నిర్ణయించిన విధి’ న్యాయపరమైన మరియు ఆచారపరమైన భావాలను సహజ తెలుగులో నిలుపుతుంది.
