id: NUM.29.9
reference: Numbers 29:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: te
  text: 'వాటితో కూడిన ధాన్యార్పణం: నూనెతో కలిపిన మెత్తని పిండి—ఎద్దుకు మూడు పదోవంతులు[a], ఆ ఒక్క పొట్టేలుకు రెండు పదోవంతులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘మూడు పదోవంతులు,’ ‘రెండు పదోవంతులు’ అనేవి పదోవంతు కొలతలను సూచిస్తాయి; సంప్రదాయంగా ఒక్కొక్కటి ఏఫాలో పదోవంతుగా అర్థం చేసుకుంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: వాటి ధాన్యార్పణగా
  rationale: బలి సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది. మూడవ పురుష బహువచన ప్రత్యయం ముందటి వచనంలో పేర్కొన్న బలి జంతువులను సూచిస్తున్నందున ‘వాటి’ అని అనువదించబడింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణల కోసం వాడే నాణ్యమైన, సన్నగా దంచిన పిండిని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెను పిండితో కలిపిన తయారీ విధానాన్ని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים / שְׁנֵי עֶשְׂרֹנִים
  choice: మూడు పదోవంతుల కొలతలు / రెండు పదోవంతుల కొలతలు
  rationale: עִשָּׂרוֹן ఒక పదోవంతు కొలతను సూచిస్తుంది. మూలంలోని పరిమాణాన్ని నిలుపుతూ, తెలుగులో అసంపూర్ణంగా వినిపించకుండా ‘కొలతలు’ చేర్చబడింది; సంప్రదాయ ఏఫా సంబంధం పాదసూచికలో ఇవ్వబడింది.
- source_word: לַפָּר
  choice: కోడెదూడకు
  rationale: פַּר ఇక్కడ బలిగా అర్పించే మగ పశువును సూచిస్తుంది. ‘కోడెదూడ’ బలి జాబితా సందర్భంలో ‘ఎద్దు’ కంటే లింగం, వయస్సు భావాన్ని మెరుగ్గా అందిస్తుంది.
- source_word: לָאַיִל הָאֶחָד
  choice: ఆ ఒక్క పొట్టేలుకు
  rationale: אַיִל అంటే మగ గొర్రె లేదా పొట్టేలు. నిర్దిష్ట ఉపపదం మరియు אֶחָד కలసి జాబితాలో పేర్కొన్న ఒక్క పొట్టేలును ప్రత్యేకంగా సూచిస్తాయి; ‘ఆ ఒక్క’ ఈ నిర్దిష్టతను నిలుపుతుంది.
