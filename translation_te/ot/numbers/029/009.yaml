translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సంబంధిత గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం వాడబడింది. వచనం ముందటి బలి జాబితాపై ఆధారపడుతున్నందున ప్రారంభ సంధానం భావపరంగా నిలుపబడింది.
