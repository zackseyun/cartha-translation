revisions:
- from: 'వాటి ధాన్యార్పణగా నూనెతో కలిపిన మెత్తని పిండిని అర్పించాలి: కోడెదూడకు మూడు పదోవంతుల కొలతలు[a], ఆ ఒక్క పొట్టేలుకు రెండు పదోవంతుల కొలతలు.'
  to: 'వాటితో కూడిన ధాన్యార్పణం: నూనెతో కలిపిన మెత్తని పిండి—ఎద్దుకు మూడు పదోవంతులు[a], ఆ ఒక్క పొట్టేలుకు రెండు పదోవంతులు.'
  rationale: The revision removes the unsupported imperative, corrects the bull/calf distinction, and recasts the possessive phrase idiomatically as an accompanying grain offering. It retains the oil-mixed fine flour, both quantities, and the specificity of ‘the one ram.’
