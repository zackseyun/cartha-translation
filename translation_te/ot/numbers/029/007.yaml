    issue: బాధించుకోవాలి is potentially over-specific and awkward for the ritual idiom.
    rationale: It can imply self-inflicted pain or emotional suffering, whereas the Hebrew idiom denotes prescribed self-affliction/self-denial in a ritual context. శ్రమపరచుకోవాలి better retains the source expression's breadth and solemnity.
  - severity: low
