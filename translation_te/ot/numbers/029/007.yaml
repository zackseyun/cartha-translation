source:
  edition: WLC
  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: te
  text: ఈ ఏడవ నెల పదవ రోజున మీకు పవిత్ర సమావేశం ఉండాలి. మిమ్మల్ని మీరు శ్రమపరచుకోవాలి[a]. ఏ పనీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని మీరు దీనపరచుకోవాలి’ లేదా ‘స్వీయనిగ్రహం పాటించాలి.’ హీబ్రూ నుడికారం అక్షరార్థంగా, ‘మీ ప్రాణాలను శ్రమపరచాలి’ అని చెబుతుంది. ఇది స్వీయనిగ్రహాన్ని సూచించే ఆచార సంబంధ వ్యక్తీకరణ; ముఖ్యంగా ఉపవాసంతో సంబంధం కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ఈ ఏడవ నెల పదో రోజున
  rationale: హీబ్రూ పదబంధం నెలలోని తేదీని సూచిస్తుంది. ‘ఈ’ అనే పదం הַזֶּה లోని సూచనార్థాన్ని నిలుపుతుంది; తెలుగులో సహజమైన కాలనిర్దేశంగా ‘పదో రోజున’ వాడబడింది.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: ఇది అధికారికంగా పిలువబడిన ఆరాధనా సమాజాన్ని సూచించే స్థిరమైన ఆచార సంబంధ పదబంధం. ‘పవిత్ర సభ’ దాని పవిత్రతను, సామూహిక సమావేశ స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... జరగాలి
  rationale: ప్రజల కోసం ఆ సభ నియమించబడిందనే భావాన్ని సహజమైన తెలుగు న్యాయశైలిలో వ్యక్తం చేస్తుంది.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు బాధించుకోవాలి
  rationale: పదశః ఉన్న ‘మీ ప్రాణాలను బాధించాలి’ అనే హీబ్రూ నుడికారాన్ని తెలుగు ప్రతిబింబక రూపంలో అందించింది. ఇది ఉపవాసం వంటి స్వీయనిగ్రహాన్ని సూచించగల ఆచార సంబంధ గంభీరతను నిలుపుతూ, అర్థాన్ని ఉపవాసానికే పరిమితం చేయదు.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: ఏ పనీ చేయకూడదు
  rationale: כָּל తో కూడిన నిషేధం సంపూర్ణమైనది. ‘ఏ పనీ చేయకూడదు’ అనేది దాని సమగ్ర బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם అనే ఆచార సంబంధ నుడికార అనువాదం
  choice: మిమ్మల్ని మీరు బాధించుకోవాలి
  alternative: మిమ్మల్ని మీరు తగ్గించుకోవాలి; మిమ్మల్ని మీరు నిరాకరించుకోవాలి
  rationale: ఎంచుకున్న రూపం పశ్చాత్తాపం, స్వీయనిగ్రహం కలిగిన ఆచార ఆజ్ఞ బలాన్ని నిలుపుతుంది. దానిని కేవలం అంతరంగ వినయంగా మృదువు చేయదు; అదే సమయంలో ఉపవాసం మాత్రమే అని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి పాటించబడింది. ‘పవిత్ర సభ’ ప్రజలకు అర్థమయ్యే సహజ రూపం; ‘బాధించుకోవాలి’ మూలంలోని ఉద్దేశపూర్వక అసౌకర్యం మరియు ఆచార గంభీరతను నిలుపుతుంది.
