  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: te
  text: 'ఐదవ రోజున: తొమ్మిది ఎద్దులు[a], రెండు పొట్టేళ్లు, లోపంలేని ఏడాది వయసు గల పద్నాలుగు మగ గొర్రెపిల్లలు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరియు ఐదవ రోజున.’ హీబ్రూ వాక్యం ఆరంభంలో ఒక అనుసంధాన పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: ఐదవ రోజున
  rationale: ఆరంభంలోని సంధాయక వావ్‌తో కూడిన కాలసూచక పదబంధం బలుల వరుసలో కొనసాగింపును సూచిస్తుంది. తెలుగులో జాబితా శైలికి సహజంగా ‘ఐదవ రోజున’ అని ఇచ్చి, ‘మరియు’ అనే ప్రత్యక్ష ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: פָּרִים תִּשְׁעָה
  choice: తొమ్మిది ఎద్దులు
  rationale: బలి సందర్భంలో פָּרִים అనేది ఎద్దులను సూచిస్తుంది; ఈ వచనం మాత్రమే వాటిని ‘యువ ఎద్దులు’గా నిర్దిష్టం చేయదు.
- source_word: אֵילִם שְׁנָיִם
  choice: రెండు పొట్టేళ్లు
  rationale: బలి జంతువుగా אַיִל యొక్క బహువచనానికి ఆధునిక తెలుగులో సహజమైన, లింగాన్ని స్పష్టంగా తెలిపే పదం ‘పొట్టేళ్లు’.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ఏడాది వయసున్న పద్నాలుగు మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂים బలి సందర్భంలో మగ గొర్రెపిల్లలను సూచిస్తుంది; בְּנֵי שָׁנָה వాటి వయసును తెలిపే హీబ్రూ నుడికారం.
- source_word: תְּמִימִם
  choice: లోపంలేని
  rationale: బలి సందర్భంలో శారీరక దోషం లేదా కళంకం లేని జంతువులను సూచిస్తుంది; ‘పరిపూర్ణమైన’ కంటే ‘లోపంలేని’ స్పష్టంగా, సహజంగా ఉంది.
