source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: te
  text: 'వాటి ధాన్యార్పణగా నూనెతో కలిపిన మెత్తని పిండి అర్పించాలి: ఎద్దుకు ఏఫాలో పదోవంతులు మూడు[a], పొట్టేలుకు పదోవంతులు రెండు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పదోవంతులు మూడు,” “పదోవంతులు రెండు” అంటే వరుసగా ఏఫాలో మూడు పదోవంతులు, రెండు పదోవంతులు. ఏఫా ఇశ్రాయేలీయుల బలి వ్యవస్థలో ఉపయోగించిన పొడి పదార్థాల కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: వాటి ధాన్యార్పణగా ... అర్పించాలి
  rationale: బలుల సందర్భంలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది. హీబ్రూలో క్రియలేని వాక్యాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో వ్యక్తం చేశాం; బహువచన ప్రత్యయం ముందటి బలులను సూచిస్తున్నందున ‘వాటి’ అని అనువదించాం.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణల కోసం ఉపయోగించే బాగా దంచిన, నాణ్యమైన పిండిని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో కలిపి సిద్ధం చేయాలనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ఏఫాలో పదోవంతులు మూడు
  rationale: עִשָּׂרוֹן ఇక్కడ ఏఫాలో పదోవంతు కొలత. కొలమానాన్ని పాఠ్యంలోనే తెలపడం సాధారణ తెలుగు పాఠకునికి అస్పష్టతను తగ్గిస్తుంది.
- source_word: לַפָּר
  choice: ఎద్దుకు
  rationale: פַּר బలిగా అర్పించే మగ పశువును సూచిస్తుంది; మూలంలోని ఏకవచనాన్ని నిలిపాం.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: పదోవంతులు రెండు
  rationale: ముందు పేర్కొన్న ఏఫా కొలమానమే దీనికీ వర్తిస్తుంది; హీబ్రూ పరిమాణాన్ని యథాతథంగా ఉంచాం.
- source_word: לָאָיִל
  choice: పొట్టేలుకు
  rationale: אַיִל బలుల సందర్భంలో పూర్తిగా ఎదిగిన మగ గొర్రెను సూచిస్తుంది; ‘పొట్టేలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానం.
