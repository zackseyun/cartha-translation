translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. బలి సంబంధ పదజాలంలో ‘ధాన్యార్పణ’, ‘మెత్తని పిండి’ వాడాం. హీబ్రూ కొలతలోని భావాన్ని స్పష్టపరచేందుకు ‘ఏఫా’ను ప్రధాన పాఠ్యంలో చేర్చి, సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం.
