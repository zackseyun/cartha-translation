source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: te
  text: పాపబలిగా ఒక మగ మేకను, నిత్య దహనబలికి[a] దానితో కూడిన ధాన్యార్పణానికీ పానార్పణానికీ అదనంగా అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిరంతర దహనబలి.’ హీబ్రూలో ‘దాని ధాన్యార్పణం, దాని పానార్పణం’ అనేవి నిత్య దహనబలినే సూచిస్తున్నాయి.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ఒక మగ మేకను కూడా
  rationale: שָׂעִיר మగ మేకను సూచిస్తుంది; וּ అనే సంధిని తెలుగు వాక్యనిర్మాణానికి సహజంగా ‘కూడా’తో వ్యక్తం చేశాం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת నైరూప్యమైన ‘పాపం’ కంటే పాపానికి సంబంధించిన ప్రత్యేక బలిని సూచిస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: బలిపశువు సంఖ్యను తెలిపే మూలంలోని సంఖ్యావాచకాన్ని స్పష్టంగా నిలిపాం.
- source_word: מִ/לְּ/בַד
  choice: అదనంగా
  rationale: ఈ బలి నిత్యంగా అర్పించే బలి సముదాయానికి తోడుగా అర్పించబడుతుందని ఈ పదబంధం సూచిస్తుంది.
- source_word: עֹלַת
  choice: దహనబలి
  rationale: యాజక బలి నియమాలలో עֹלָה పూర్తిగా దహించబడే బలికి వాడే స్థిర పదం; ‘దహనబలి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: הַ/תָּמִיד
  choice: నిత్య
  rationale: תָּמִיד ఇక్కడ క్రమంగా, నిరంతరం నిర్ణీత పద్ధతిలో అర్పించే దహనబలిని విశేషిస్తుంది; ‘నిత్య’ సంక్షిప్తంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: וּ/מִנְחָתָהּ
  choice: దాని ధాన్యార్పణకు
  rationale: యాజక సందర్భంలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న దహనబలిని సూచిస్తున్నందున ‘దాని’ అని అనువదించాం.
- source_word: וְ/נִסְכָּהּ
  choice: దాని పానార్పణకు
  rationale: נֶסֶךְ పోసి అర్పించే ద్రవ అర్పణను సూచిస్తుంది; ‘పానార్పణ’ గౌరవప్రదంగా, స్పష్టంగా ఉంది. ప్రత్యయం దహనబలినే సూచిస్తుంది.
