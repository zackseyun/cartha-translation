  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: te
  text: నిత్య దహనబలికి, దాని ధాన్యార్పణానికి, దాని పానార్పణానికి అదనంగా, పాపపరిహార బలిగా ఒక మగ మేకను అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిరంతర దహనబలి.’
    reason: תָּמִיד అనే పదం నిత్యంగా/నిరంతరంగా కొనసాగించే నియమిత అర్పణను సూచిస్తుంది.
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ఒక మగ మేకను కూడా
  rationale: שְׂעִיר עִזִּים అనేది బలిగా అర్పించే మగ మేకను సూచించే సాధారణ పదబంధం. జాబితాలోని అనుసంధానాన్ని సహజమైన తెలుగులో చూపడానికి וּ־ను ‘కూడా’గా వ్యక్తం చేశాం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: యాజక సంబంధమైన ఈ సందర్భంలో ఈ పదం ‘పాపం’ అనే భావనకన్నా పాపం నిమిత్తం అర్పించే బలిని సూచిస్తుంది.
- source_word: מִ/לְּ/בַד
  choice: అదనం
  rationale: ఈ బలి ముందే నియమించబడిన అర్పణలకు అదనంగా చేయవలసినదని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: עֹלַת הַ/תָּמִיד
  choice: క్రమంగా అర్పించే దహనబలి
  rationale: תָּמִיד ఇక్కడ నియమితంగా, కొనసాగుతూ అర్పించే బలిని సూచిస్తుంది. ‘క్రమంగా అర్పించే’ అనేది దానిని కేవలం ‘రోజువారీ’ అని పరిమితం చేయకుండా ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִנְחָתָהּ
  choice: దాని ధాన్యార్పణ
  rationale: బలుల జాబితాలో מִנְחָה అనుబంధ ధాన్యార్పణను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: וְ/נִסְכָּהּ
  choice: దాని పానార్పణ
  rationale: נֶסֶךְ బలితో పాటు పోసి అర్పించే పానీయ అర్పణను సూచిస్తుంది; ప్రత్యయం దహనబలినే తిరిగి సూచిస్తుంది.
