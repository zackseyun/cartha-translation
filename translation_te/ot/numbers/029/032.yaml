  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: te
  text: 'ఏడవ రోజున: ఏడు ఎద్దులు, రెండు పొట్టేళ్లు, ఏడాది వయసున్న పద్నాలుగు మచ్చలేని గొర్రెపిల్లలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: సందర్భంలోని పండుగ దినాల వరుసను సహజమైన తెలుగులో కొనసాగిస్తుంది; వాక్యారంభంలోని హీబ్రూ సంధికారకాన్ని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పలకకపోయినా క్రమబద్ధత నిలుస్తుంది.
- source_word: פָּרִים
  choice: ఎద్దులు
  rationale: బలుల సందర్భంలో పַּר అనే పదం మగ పశువులను సూచిస్తుంది; వయస్సు ఈ వచనంలో స్పష్టంగా చెప్పబడనందున ‘కోడెదూడలు’ అని పరిమితం చేయలేదు.
- source_word: אֵילִם
  choice: పొట్టేళ్లు
  rationale: బలుల జాబితాలో אַיִלకు సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ఏడాది వయసున్న ... గొర్రెపిల్లలు
  rationale: ‘ఒక సంవత్సరపు పిల్లలు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక సహజ తెలుగులో వయస్సును స్పష్టంగా తెలిపేలా అనువదించింది.
- source_word: תְּמִימִם
  choice: లోపం లేనివి
  rationale: బలి జంతువుల విషయంలో శారీరక దోషం లేదా కళంకం లేకపోవడాన్ని సూచించే ఆచార సంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గంభీరతతో కూడిన సరళమైన జాబితా శైలి. హీబ్రూలో చివరనున్న బహువచన విశేషణం జాబితాలోని జంతువులన్నిటికీ వర్తించేలా ‘ఇవన్నీ ... ఉండాలి’ అని స్పష్టం చేయబడింది.
