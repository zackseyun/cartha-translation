  verdict: revise
  source_fidelity: The inventory, quantities, and ages are rendered accurately. However, ‘ఉండాలి’ introduces an explicit prescriptive sense (“must be”) that is not stated in this verbless Hebrew list; תְּמִימִם is an attributive description of the animals.
