  terminology: ‘ఎద్దులు,’ ‘పొట్టేళ్లు,’ and ‘గొర్రెపిల్లలు’ appropriately render bulls, rams, and lambs. ‘మచ్చలేని’ is a natural sacrificial-context rendering of תְּמִימִם (“without blemish”).
  issues:
