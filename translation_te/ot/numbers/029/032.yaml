    issue: The phrase ‘ఇవన్నీ లోపం లేనివిగా ఉండాలి’ adds an explicit obligation.
    rationale: The Hebrew concludes with the plural adjective תְּמִימִם, “without blemish/unblemished,” describing the listed animals. It does not use a verb meaning “must be.”
