translation:
  language: te
  text: ఆ ఏడు గొర్రెపిల్లల్లో ఒక్కోదానికి పదోవంతు చొప్పున[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘పదోవంతు, పదోవంతు’ అని ఉంది; బలుల సందర్భంలో ఇది సాధారణంగా ఏఫాలో పదోవంతు కొలతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: పదోవంతు చొప్పున
  rationale: 'పదం పునరుక్తి పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది: ప్రతి గొర్రెపిల్లకు ఒక్కో పదోవంతు. మూలపాఠంలో ‘ఏఫా’ స్పష్టంగా లేకపోవడంతో దాన్ని ప్రధాన వాక్యంలో చేర్చకుండా, బలి సందర్భంలో సూచితమైన కొలతను పాదసూచికలో వివరించాం.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: అక్షరార్థంగా ‘ఒక గొర్రెపిల్లకు’; ఈ బలి జాబితాలో పంపిణీ భావం ఉన్నందున ఆధునిక తెలుగులో ‘ఒక్కొక్క ... కు’ సహజంగా దాన్ని తెలియజేస్తుంది.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ఆ ఏడు గొర్రెపిల్లల్లో
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదబంధం ముందుగా పేర్కొన్న మొత్తం ఏడు గొర్రెపిల్లలను సూచిస్తుంది. తెలుగులో ‘ఆ’ ఆ నిర్దిష్టతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమావళికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. పంపిణీ భావాన్ని సహజంగా తెలియజేస్తూనే మూలంలోని సంక్షిప్తతను నిలిపాం.
