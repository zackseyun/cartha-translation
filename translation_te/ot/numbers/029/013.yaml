id: NUM.29.13
reference: Numbers 29:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: te
  text: 'యాహ్వేకు ఇంపైన సువాసనగా ఉండే[a] అగ్నిద్వారా అర్పించే దహనబలిని మీరు సమర్పించాలి: పశువుల మందలోని పదమూడు ఎద్దులను, రెండు పొట్టేళ్లను, ఏడాది వయసున్న పద్నాలుగు మగ గొర్రెపిల్లలను సమర్పించాలి; ఇవన్నీ లోపంలేనివై ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇంపైన సువాసన” అనే హీబ్రూ నుడికారం, ఆ అర్పణ యాహ్వేకు ఆమోదయోగ్యమైనదని సూచిస్తుంది. దీనిని “ప్రీతికరమైన సువాసన” లేదా “శాంతికరమైన సువాసన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: మీరు ... సమర్పించాలి
  rationale: హిఫీల్ రూపం బలుల సందర్భంలో అర్పణను సమర్పించడం అనే భావాన్ని ఇస్తుంది; ఇది ఆధునిక తెలుగులో సహజంగా, ఆరాధనా సందర్భానికి తగినట్లు ఉంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలి మొత్తం అగ్నిలో దహించబడే అర్పణకు తెలుగులో స్థిరంగా అర్థమయ్యే పదం.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే ... అర్పణ
  rationale: అగ్ని ద్వారా అర్పించబడే బలి అనే మూలభావాన్ని స్పష్టంగా ఉంచుతుంది; దహనబలితో సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: యెహోవాకు అర్పణ ఆమోదయోగ్యంగా, ప్రీతికరంగా ఉండటాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను వ్యక్తిగత నిబంధన నామంగా లిప్యంతరీకరించింది.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: మందలోనుంచి ... కోడెదూడలు
  rationale: పశువుల మందకు చెందిన మగ పశువులు అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; హీబ్రూ చెప్పనంత ఖచ్చితమైన వయస్సును నిర్దేశించదు.
- source_word: אֵילִם
  choice: పొట్టేళ్లు
  rationale: పెరిగిన మగ గొర్రెలకు సాధారణ ఆధునిక తెలుగు పదం.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ఏడాది వయసుగల ... మగ గొర్రెపిల్లలు
  rationale: כְּבָשִׂיםలోని పుంలింగాన్ని, בְּנֵי שָׁנָהలోని వయస్సు సూచనను రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: תְּמִימִם
  choice: లోపంలేనివి
  rationale: బలిపశువులకు శారీరక దోషం ఉండకూడదనే ఆచారపరమైన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నిబంధన దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచుతుంది; తెలుగులో విస్తృతంగా గుర్తింపున్న రూపాన్ని ఉపయోగించింది.
- issue: רֵיחַ נִיחֹחַ నుడికారం
  choice: ఇంపైన సువాసన
  alternative: శాంతికరమైన సువాసన / ప్రీతికరమైన సువాసన
  rationale: వాసనను కేవలం భౌతికంగా మాత్రమే కాక, అర్పణ యెహోవాకు ఆమోదయోగ్యమనే ఆచారపరమైన భావంతో తెలిపే నుడికారాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలుల జాబితాకు తగిన గంభీరతను ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. సంఖ్యలు, జంతువుల లింగం, వయస్సు, లోపరాహిత్యం అన్నీ మూలపాఠానుసారం స్పష్టంగా నిలుపబడ్డాయి.
