  source_fidelity: హెబ్రీ వచనం ముందరి ఆజ్ఞకు అనుసంధానమైన దీర్ఘవాక్య భాగం మాత్రమే; ఇందులో స్వతంత్రంగా ‘అర్పించాలి’ అనే క్రియ లేదు. ముసాయిదా ఆ అంతర్లీన క్రియను చేర్చడం భావానికి విరుద్ధం కాకపోయినా, ఈ వచనంలోని ఎలిప్టికల్ నిర్మాణాన్ని మించిపోతుంది. దానిని తొలగించి, బలి జంతువులకు అనుసరించి ఉండే ధాన్యార్పణం మరియు పానార్పణల జాబితాను అలాగే ఉంచడం మూలానికి మరింత నిష్ఠగా ఉంటుంది.
  naturalness: ‘ధాన్యార్పణం,’ ‘పానార్పణలు,’ ‘పొట్టేలు,’ ‘గొర్రెపిల్లలు’ ఆధునిక ప్రామాణిక తెలుగులో బలి-సందర్భానికి తగిన, అర్థమయ్యే పదాలు. ‘వాటి సంఖ్య ప్రకారం’లోని ‘వాటి’ జంతువుల సంఖ్యను స్పష్టంగా సూచించేందుకు ‘ఆ జంతువుల సంఖ్య ప్రకారం’గా చేయబడింది.
