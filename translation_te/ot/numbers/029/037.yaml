source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֗ם לַ/פָּ֨ר לָ/אַ֧יִל וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: te
  text: వాటి ధాన్యార్పణం, పానార్పణలు ఎద్దుకు, పొట్టేలుకు, గొర్రెపిల్లలకు ఆ జంతువుల సంఖ్య ప్రకారం, నిర్దేశిత నియమం ప్రకారం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: వాటి ధాన్యార్పణను
  rationale: బలి సందర్భంలో מִנְחָה సాధారణ అర్పణను కాకుండా జంతుబలులతో పాటు అర్పించే ధాన్యార్పణను సూచిస్తుంది. హెబ్రీలోని సమూహార్థక ఏకవచనాన్ని తెలుగులోనూ ఏకవచనంగా ఉంచాం.
- source_word: וְנִסְכֵּיהֶם
  choice: పానార్పణలను
  rationale: נֶסֶךְ పోసి అర్పించే ద్రవ అర్పణను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘పానార్పణ’ స్పష్టంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: לַפָּר
  choice: ఎద్దుకు
  rationale: פַּר మందలోని మగ పశువును సూచిస్తుంది; మూలపదం వయస్సును స్పష్టంగా నిర్దేశించనందున ‘ఎద్దు’ అని అనువదించాం.
- source_word: לָאַיִל
  choice: పొట్టేలుకు
  rationale: אַיִל బలుల జాబితాలో మగ గొర్రెను సూచిస్తుంది; దీనికి సహజమైన ప్రామాణిక తెలుగు పదం ‘పొట్టేలు’.
- source_word: וְלַכְּבָשִׂים
  choice: గొర్రెపిల్లలకు
  rationale: כֶּבֶשׂ గొర్రెపిల్లను, బలి సందర్భంలో తరచుగా మగ గొర్రెపిల్లను సూచిస్తుంది. ఈ జాబితాలో ‘గొర్రెపిల్లలు’ సహజంగా ఉండి, మూలంలో ఇక్కడ ప్రత్యేకంగా లేని అదనపు వివరణను చేర్చదు.
- source_word: בְּמִסְפָּרָם
  choice: వాటి సంఖ్య ప్రకారం
  rationale: బలిపశువుల లెక్కకు అనుగుణంగా అర్పణలు ఉండాలనే విధానార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: כַּמִּשְׁפָּט
  choice: నియమం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ బలులకు సంబంధించిన స్థిరపరచిన ధర్మనియమం లేదా నిర్దేశిత విధానాన్ని సూచిస్తుంది. ‘నియమం ప్రకారం’ చట్టపరమైన భావాన్ని కాపాడుతూ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: כַּמִּשְׁפָּט యొక్క విధానపరమైన లేదా చట్టపరమైన భావం
  choice: నియమం ప్రకారం
  alternative: నిర్దేశించిన విధానం ప్రకారం
  rationale: ఈ పదం స్థాపిత నియమాన్నీ, దాని ప్రకారం పాటించాల్సిన విధానాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సంక్షిప్తమైన చట్టపరమైన భావాన్ని ఉంచి, సందర్భంలో ఉన్న విధానార్థాన్ని దానిలోనే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే బలి సంబంధ పదజాలం వాడబడింది. వచనం ముందున్న ఆజ్ఞాపూర్వక నిర్మాణంపై ఆధారపడిన జాబితా భాగం కావడంతో, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘అర్పించాలి’ చేర్చబడింది.
