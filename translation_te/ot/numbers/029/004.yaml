translation:
  language: te
  text: మరియు ఏడు గొర్రెపిల్లలలో ప్రతిదానికి ఒక పదోవంతు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఒక పదోవంతు.’ బలి అర్పణల సందర్భంలో ఇది సాధారణంగా ఏఫాలో ఒక పదోవంతును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: పదోవంతు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఒక పదోవంతు’ అని కొలతను సూచిస్తుంది. బలి అర్పణల సందర్భంలో ఇది సాధారణంగా ఏఫాలో పదోవంతును సూచించినా, మూలవాక్యంలో ‘ఏఫా’ స్పష్టంగా లేదు; అందువల్ల ప్రధాన పాఠ్యంలో సంక్షిప్త రూపమే ఉంచబడింది.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్కొక్క గొర్రెపిల్లకు
  rationale: అక్షరార్థంగా ‘ఆ ఒక్క గొర్రెపిల్లకు’; ఈ నియమావళి సందర్భంలో ప్రతి గొర్రెపిల్లకూ ఆ పరిమాణం వర్తిస్తుందనే విభజనార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ఆ ఏడు గొర్రెపిల్లల్లో
  rationale: ముందుగా పేర్కొన్న నిర్దిష్టమైన ఏడు గొర్రెపిల్లల సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘ఆ ఏడు ...ల్లో’ అనే నిర్మాణం ఒక్కొక్కదానికి వర్తించే పరిమాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని కొలతను విస్తరించకుండా ఉంచి, అవసరమైన సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం.
