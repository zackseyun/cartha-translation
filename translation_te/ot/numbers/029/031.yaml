  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: te
  text: నిత్య దహనబలికి, దానికి చెందిన ధాన్యార్పణకూ పానార్పణలకూ అదనంగా పాపపరిహార బలిగా ఒక మేకను అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: మేక
  rationale: బలి సందర్భంలో ఈ పదం మగ మేకను సూచించగలిగినా, సహజమైన ఆధునిక తెలుగులో ‘మేక’ సరిపోతుంది; బలి స్వభావాన్ని తరువాతి పదబంధం స్పష్టం చేస్తుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: ఆరాధనా సందర్భంలో ఇది ‘పాపం’ అనే భావం కంటే పాపం నిమిత్తం అర్పించే బలిని సూచిస్తుంది.
- source_word: אֶחָד
  choice: ఒక
  rationale: అర్పించవలసిన మేక సంఖ్యను తెలియజేసే సంఖ్యావాచకం.
- source_word: מִלְּבַד
  choice: అదనంగా
  rationale: ఈ బలి నిత్య దహనబలితో పాటు అదనంగా అర్పించబడుతుందని సహజంగా తెలియజేస్తుంది.
- source_word: עֹלַת הַתָּמִיד
  choice: నిత్య దహనబలి
  rationale: నిర్దేశిత క్రమంలో నిరంతరం పునరావృతమయ్యే దహనబలిని సూచిస్తుంది; ‘నిత్య’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: מִנְחָתָהּ
  choice: దానితో అర్పించే ధాన్యార్పణ
  rationale: బలి జాబితాల్లో מִנְחָה అనుబంధ ధాన్యార్పణను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం దహనబలిని తిరిగి సూచిస్తుంది.
- source_word: וּנְסָכֶיהָ
  choice: పానార్పణలు
  rationale: పోసి అర్పించే ద్రవ అర్పణలను సూచించే బహువచనం; ‘పానార్పణలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బలి సంబంధ పదజాలం వాడబడింది. మూలంలోని జాబితా సంబంధాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా వ్యక్తం చేశాం. అందించిన ఆంగ్ల పాదసూచిక గుర్తులు వాటి వాక్యస్థానాలతో సరిపోలకపోవడం వల్ల, మూల హెబ్రీ పాఠంలో ప్రత్యేక పాఠాంతర అవసరం లేకపోవడంతో పాదసూచికలు చేర్చలేదు.
