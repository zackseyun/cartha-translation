  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: te
  text: మరియు మీ కొరకు ప్రాయశ్చిత్తం చేయడానికి పాపపరిహార బలిగా ఒక మగ మేక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ఒక మగ మేకను
  rationale: שְׂעִיר עִזִּים అనేది బలికి ఉద్దేశించిన మగ మేకను సూచిస్తుంది; אֶחָד సంఖ్యను స్పష్టంగా ‘ఒక’ అని తెలియజేస్తుంది. వావ్‌ను తెలుగు జాబితా ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సహజంగా అంతర్భావించాం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: యాజక బలుల సందర్భంలో ఈ పదం కేవలం ‘పాపం’ కాక, పాపానికి సంబంధించిన ప్రత్యేక బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆధునిక తెలుగు పాఠకునికి ఆ ఆచారార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְ/כַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: כפר అనే యాజక బలి సంబంధిత పదంలోని పరిహార/ప్రాయశ్చిత్త భావాన్ని, దాని విధానాన్ని సంకుచిత సిద్ధాంతంతో నిర్వచించకుండా, విస్తృతంగా నిలుపుతుంది.
- source_word: עֲלֵי/כֶם
  choice: మీ కోసం
  rationale: כפרతో వచ్చిన עַל ఇక్కడ ఎవరి పక్షంగా ప్రాయశ్చిత్తం జరుగుతుందో సూచిస్తుంది; ‘మీ కోసం’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
theological_decisions:
- issue: బలి సంబంధిత כפר పదప్రయోగం
  choice: మీ కోసం ప్రాయశ్చిత్తం చేయడానికి
  alternative: మీ పాపానికి పరిహారం చేయడానికి
  rationale: హీబ్రూ పాఠం యాజక బలి ద్వారా జరిగే ప్రాయశ్చిత్తాన్ని చెబుతుంది గాని, దాని తరువాతి సిద్ధాంతపరమైన యంత్రాంగాన్ని నిర్దేశించదు. ‘ప్రాయశ్చిత్తం’ ఆ వేదగ్రంథ సంబంధిత విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సందర్భంలోని బలుల జాబితికి తగినట్లుగా తెలుగులో అవసరమైన ‘అర్పించాలి’ అనే క్రియను స్పష్టీకరణార్థం చేర్చాం; అది హీబ్రూ వాక్యఖండంలో సందర్భం ద్వారా అంతర్భావితమై ఉంది.
