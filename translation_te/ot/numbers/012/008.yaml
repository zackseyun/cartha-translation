- from: “నేను అతనితో నోటికి నోటిగా[a] మాట్లాడుతాను—స్పష్టంగా, నిగూఢమైన మాటల్లో కాదు. అతడు యాహ్వే రూపాన్ని[b] చూస్తాడు. అలాంటప్పుడు నా సేవకునికి—మోషేకే—విరోధంగా మాట్లాడడానికి మీరు ఎందుకు భయపడలేదు?”
  to: “నేను అతనితో నోటికి నోటిగా[a] మాట్లాడుతాను—స్పష్టంగా, నిగూఢమైన మాటల్లో కాదు. అతడు యాహ్వే రూపాన్ని[b] చూస్తాడు. అలాంటప్పుడు నా సేవకుడైన మోషేకు వ్యతిరేకంగా మాట్లాడడానికి మీరు ఎందుకు భయపడలేదు?”
  rationale: చివరి గద్దింపు వాక్యాన్ని ఆధునిక తెలుగులో సహజమైన సమానాధికరణంతో సవరించాను; దీని వల్ల మోషే ‘నా సేవకుడు’ అనే మూలపాఠంలోని గుర్తింపు స్పష్టంగా నిలుస్తుంది. పాదసూచిక బిలో మూలంలోని תְּמוּנָה పదానికి దగ్గరైన ప్రత్యామ్నాయాలను ఇచ్చాను. ఇతర పదప్రయోగాలు మూలంలోని ఉద్దేశపూర్వక అసాధారణతను మరియు తటస్థతను సముచితంగా కాపాడుతున్నాయి.
