id: NUM.12.8
reference: Numbers 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: te
  text: “నేను అతనితో నోటికి నోటిగా[a] మాట్లాడుతాను—స్పష్టంగా, నిగూఢమైన మాటల్లో కాదు. అతడు యాహ్వే రూపాన్ని[b] చూస్తాడు. అలాంటప్పుడు నా సేవకుడైన మోషేకు వ్యతిరేకంగా మాట్లాడడానికి మీరు ఎందుకు భయపడలేదు?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముఖాముఖిగా.” హీబ్రూలో అక్షరార్థంగా “నోటికి నోటిగా”; ఇది ప్రత్యక్ష సంభాషణను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే పోలికను” లేదా “యాహ్వే స్వరూపాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: నోటికి నోటిగా
  rationale: హీబ్రూ పదబంధంలోని ‘నోరు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, మధ్యవర్తిత్వం లేని ప్రత్యక్ష సంభాషణను సూచిస్తుంది.
- source_word: אֲדַבֶּר בּוֹ
  choice: నేను అతనితో ... మాట్లాడుతాను
  rationale: דבר తో ב వచ్చినందున, కేవలం ‘అతనికి’ చెప్పడం కంటే అతనితో సంభాషించడాన్ని ‘అతనితో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמַרְאֶה
  choice: స్పష్టంగా
  rationale: ‘నిగూఢమైన మాటల్లో కాదు’ అనే వ్యతిరేక సమాంతరతలో, దర్శనీయమైన లేదా స్పష్టమైన ప్రకటన అనే భావాన్ని క్రియావిశేషణంగా సహజంగా అందిస్తుంది; దీనిని వేరొక దర్శనవస్తువుగా నిర్ణయించదు.
- source_word: וְלֹא בְחִידֹת
  choice: నిగూఢమైన మాటల్లో కాదు
  rationale: חִידוֹת అనేది చిక్కుముడిగల, గూఢార్థకమైన లేదా పొడుపు మాటలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా ప్రత్యక్ష ప్రకటనతో దాని వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: וּתְמֻנַת יְהוָה
  choice: యాహ్వే రూపాన్ని
  rationale: תְּמוּנָהలోని రూపం, పోలిక, ప్రత్యక్ష ఆకృతి అనే పరిధిని ‘రూపం’ సంక్షిప్తంగా నిలుపుతుంది; దైవ ప్రత్యక్షత స్వభావాన్ని అవసరానికి మించి నిర్వచించదు. יְהוָהను వ్యక్తిగత నామమైన ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: יַבִּיט
  choice: చూస్తాడు
  rationale: నిశితంగా చూడడం అనే భావాన్ని సందర్భంలో సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అసహజమైన కావ్యపదాన్ని ఉపయోగించలేదు.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: అలాంటప్పుడు ... మీరు ఎందుకు భయపడలేదు?
  rationale: ముందున్న ప్రకటన ఆధారంగా వచ్చే గద్దింపు మరియు కారణానుమాన బలాన్ని ‘అలాంటప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: నా సేవకునికి—మోషేకే—విరోధంగా మాట్లాడడానికి
  rationale: పునరుక్త ב యొక్క విరోధార్థాన్ని ‘విరోధంగా’ తెలియజేస్తూ, మోషేను ‘నా సేవకుడు’తో సమానాధికరణంగా ఉద్ఘాటిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా, ఆధునిక తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: మోషేకు కలిగిన విశిష్ట దైవ ప్రత్యక్షత
  choice: యాహ్వే రూపాన్ని చూస్తాడు
  alternative: యాహ్వే పోలికను చూస్తాడు; యాహ్వే ప్రత్యక్షతను చూస్తాడు
  rationale: దైవాన్ని మోషే ఏ విధంగా చూశాడనే తాత్త్విక ప్రశ్నను పరిష్కరించకుండా, תְּמוּנָה యొక్క స్పష్టమైన కానీ విస్తృతమైన ‘రూపం’ భావాన్ని నిలుపుతుంది.
- issue: మోషేతో సంభాషణ యొక్క ప్రత్యక్షత
  choice: నోటికి నోటిగా
  alternative: ముఖాముఖిగా; నేరుగా
  rationale: మూలంలోని ‘నోరు’ రూపకాన్ని నిలిపి, మోషేకు కలిగిన మధ్యవర్తిత్వరహిత సంభాషణను వ్యక్తం చేస్తుంది; ‘ముఖాముఖి’ అనే సుపరిచిత భావానువాదాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. ‘నోటికి నోటిగా’ అనే అసాధారణమైనా మూలానికి ముఖ్యమైన రూపకాన్ని పాఠ్యంలో ఉంచి, సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది. గద్దింపులోని బలాన్ని ‘మోషేకే’ అనే ఉద్ఘాటనతో నిలుపుకుంది.
