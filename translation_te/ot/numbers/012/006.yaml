id: NUM.12.6
reference: Numbers 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “ఇప్పుడు నా మాటలు వినండి. మీలో ఒక ప్రవక్త ఉంటే,[a] యాహ్వేనైన నేను దర్శనంలో అతనికి నన్ను తెలియజేస్తాను;[b] కలలో అతనితో మాట్లాడతాను.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో ఎవరైనా ప్రవక్త అయితే.” హీబ్రూ పదబంధం అక్షరార్థంగా “మీ ప్రవక్త ఉంటే” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతనికి నన్ను బయలుపరచుకుంటాను.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “కలలో అతనికి మాట్లాడతాను.” హీబ్రూలో అక్షరార్థంగా “అతనిలో/అతనితో మాట్లాడతాను” అనే రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆయన ఇలా అన్నాడు
  rationale: సాధారణ హీబ్రూ కథన సూత్రాన్ని సహజమైన తెలుగులో చూపుతుంది; మునుపటి సందర్భంలో మాట్లాడుతున్నది యాహ్వే అని తెలుస్తుంది.
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: ఇప్పుడు నా మాటలు వినండి
  rationale: బహువచన ఆజ్ఞను, נָא ఇచ్చే గంభీరమైన విజ్ఞాపన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: మీలో ఒక ప్రవక్త ఉంటే
  rationale: అక్షరార్థంగా ‘మీ ప్రవక్త ఉంటే’ అనే అసహజ నిర్మాణాన్ని సమూహంలో ప్రవక్త ఉన్నాడనే సహజ తెలుగు భావంతో అందిస్తుంది; మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: בַּמַּרְאָה
  choice: దర్శనంలో
  rationale: మַרְאָה ఇక్కడ ప్రవచనాత్మక దర్శనం లేదా ప్రత్యక్షతను సూచిస్తుంది; తరువాతి ‘కలలో’ అనే పదబంధంతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: అతనికి నన్ను తెలియజేస్తాను
  rationale: దేవుడు తనను తాను ప్రవక్తకు వెల్లడించుకుంటాడనే ప్రతిబింబార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: కలలో అతనితో మాట్లాడతాను
  rationale: కల వెల్లడికి మాధ్యమమని చూపుతూ, בּוֹ లోని ‘అతనితో/అతనిలో’ రూపాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ప్రవక్తకు దేవుని ప్రత్యక్షత విధానం
  choice: దర్శనంలో తనను తెలియజేయడం, కలలో అతనితో మాట్లాడడం
  alternative: దర్శనంలో ప్రత్యక్షమవడం, కల ద్వారా అతనికి చెప్పడం
  rationale: మూలంలోని రెండు సమాంతర వాక్యాలను, వాటిలోని దర్శనం–కల భేదాన్ని నిలుపుతూ, తరువాతి వచనంలో మోషేతో చేసే వ్యత్యాసాన్ని ముందుగానే సిద్ధాంతపరంగా వివరించలేదు.
- issue: אֲדַבֶּר בּוֹ లోని సంబంధ సూచన
  choice: అతనితో మాట్లాడతాను
  alternative: అతనికి మాట్లాడతాను
  rationale: בּוֹ అక్షరార్థంగా ‘అతనిలో/అతనితో’ అని ఉండటం వల్ల ‘అతనితో’ మూల రూపాన్ని దగ్గరగా నిలుపుతుంది; అయితే సందర్భంలో ‘అతనికి’ అనే ఏకదిశ భావం కూడా సాధ్యం, అందుకే పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దైవ ప్రసంగ శైలిని ఉపయోగించింది. ‘దర్శనం,’ ‘ప్రవక్త’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచినా, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దింది.
