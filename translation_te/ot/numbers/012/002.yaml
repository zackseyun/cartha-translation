- from: 'వారు[a] ఇలా అన్నారు: “యెహోవా కేవలం మోషే ద్వారానే మాట్లాడాడా? మా ద్వారా కూడా మాట్లాడలేదా?” యెహోవా అది విన్నాడు.'
  to: 'వారు అన్నారు: “యాహ్వే కేవలం మోషే ద్వారానే మాట్లాడాడా? మా ద్వారా కూడా మాట్లాడలేదా?” యాహ్వే అది విన్నాడు.'
  rationale: యెహోవా స్థానంలో యాహ్వేను వాడి, అందించిన POB దైవనామ విధానానికి అనుగుణం చేశాం. ప్రధాన పాఠంలో సందర్భానుసారమైన మధ్యవర్తి అర్థం (“ద్వారా”) నిలిపాం; పాదసూచికలో గ్రహీత అర్థాన్ని తెలుగులో మరింత స్పష్టంగా చూపించాం. ఇతర మార్పులు అర్థాన్ని మార్చవు.
