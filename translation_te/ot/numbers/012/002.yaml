id: NUM.12.2
reference: Numbers 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: te
  text: 'వారు అన్నారు: “యాహ్వే కేవలం మోషే ద్వారానే మాట్లాడాడా? మా ద్వారా కూడా మాట్లాడలేదా?” యాహ్వే అది విన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: వారు ఇలా అన్నారు
  rationale: బహువచన వయ్యిక్తోల్ రూపం కథన క్రమంలో ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఇలా అన్నారు’ సహజంగా ఉంది.
- source_word: הֲרַק אַךְ
  choice: కేవలం ... ద్వారానే ... ఆ?
  rationale: ప్రశ్నార్థక రూపంతో కూడిన రెండు నిర్బంధక అవ్యయాల బలాన్ని ‘కేవలం’ మరియు ‘-నే’ కలిపి వ్యక్తం చేస్తాయి; ఇది సవాలు నిండిన అలంకారిక ప్రశ్నను నిలుపుతుంది.
- source_word: בְּמֹשֶׁה
  choice: మోషే ద్వారా
  rationale: దైవిక ప్రకటన సందర్భంలో בְ అనే పూర్వప్రత్యయం సందేశాన్ని అందించే మధ్యవర్తిని లేదా సాధనాన్ని సూచించగలదు. ఇక్కడ ప్రవక్తృత్వ అధికారమే వివాదాంశం కాబట్టి ‘ద్వారా’ను ప్రధాన పాఠంలో ఎంచుకున్నాం.
- source_word: דִּבֶּר יְהוָה
  choice: యెహోవా ... మాట్లాడాడా
  rationale: דבר దైవిక వాక్యప్రకటనను సూచిస్తుంది. తెలుగు ప్రశ్నలో సహజమైన పదక్రమం కోసం దైవనామాన్ని క్రియకు ముందు ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: మా ద్వారా కూడా మాట్లాడలేదా?
  rationale: మొదటి ప్రశ్నలోని నిర్మాణానికే సమాంతరంగా ‘ద్వారా’ను వాడటం, మిర్యాము అహరోనులు తామూ దైవిక సందేశానికి మధ్యవర్తులమని చేస్తున్న వాదనను చూపుతుంది.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: యెహోవా అది విన్నాడు
  rationale: హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భం వారు చెప్పిన మాటలను సూచిస్తుంది. తెలుగులో సహజత కోసం ‘అది’ను చేర్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను నిలిపాం.
- issue: דבר తో వచ్చిన בְ ఇక్కడ గ్రహీతను సూచిస్తుందా, మధ్యవర్తిని సూచిస్తుందా
  choice: మోషే ద్వారా / మా ద్వారా
  alternative: మోషేతో / మాతో లేదా మోషేకు / మాకు
  rationale: సందర్భంలో ప్రశ్న కేవలం దేవుని మాట వినడం గురించి కాక, ప్రవక్తృత్వ స్థానం మరియు దైవిక ప్రకటనకు మధ్యవర్తిత్వం గురించి ఉంది. అయినా హీబ్రూ పూర్వప్రత్యయానికి ఉన్న నిజమైన ద్వంద్వార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. అలంకారిక ప్రశ్నల తీవ్రతను ‘కేవలం’ మరియు ‘-నే’తో నిలిపాం. ప్రధాన పాఠంలో ప్రవక్తృత్వ మధ్యవర్తిత్వ భావాన్ని ఎంచుకుని, మూలంలోని వ్యాకరణ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
