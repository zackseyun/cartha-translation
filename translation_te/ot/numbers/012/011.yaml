id: NUM.12.11
reference: Numbers 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: te
  text: అప్పుడు అహరోను మోషేతో, “నా ప్రభూ, దయచేసి, మేము అవివేకంగా ప్రవర్తించి పాపం చేశాము కాబట్టి, ఆ పాపాన్ని[a] మా మీద మోపవద్దు” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అపరాధాన్ని మా మీద మోపవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: నా ప్రభూ, దయచేసి
  rationale: בִּי వినయపూర్వకమైన వేడుకోలును సూచిస్తుంది; אֲדֹנִי ఇక్కడ మోషేను గౌరవంగా సంబోధించే మానవ బిరుదు. తెలుగు సహజ పదక్రమంలో రెండింటినీ ‘నా ప్రభూ, దయచేసి’ అని వ్యక్తం చేశాం.
- source_word: אַל נָא
  choice: మోపవద్దు
  rationale: నిషేధార్థాన్ని ‘వద్దు’ తెలియజేస్తుంది; נָא లోని విన్నప భావం ముందున్న ‘దయచేసి’లో ఇప్పటికే వ్యక్తమైంది.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: పాపాన్ని మా మీద మోపవద్దు
  rationale: ‘మా మీద ఉంచడం/మోపడం’ అనే మూల రూపకాన్ని నిలుపుతూ, חַטָּאת ను ప్రత్యక్షంగా ‘పాపం’గా అనువదించాం. సందర్భంలో ‘అపరాధం’ అనే భావమూ సాధ్యమే.
- source_word: אֲשֶׁר נוֹאַלְנוּ וַאֲשֶׁר חָטָאנוּ
  choice: మేము అవివేకంగా ప్రవర్తించి చేసిన
  rationale: యాల Niphal రూపంలోని అవివేక ప్రవర్తనను, חטא లోని పాపం చేయడాన్ని రెండింటినీ సహజమైన తెలుగు సంబంధ వాక్యంగా కలిపాం; దీనివల్ల ఆ పాపం వారి అవివేక ప్రవర్తనతో చేసినదేననే అనుబంధం నిలుస్తుంది.
theological_decisions:
- issue: మోషేను ఉద్దేశించిన אֲדֹנִי అనువాదం
  choice: నా ప్రభూ
  alternative: అయ్యా
  rationale: ఇది దేవునికి సంబంధించిన బిరుదు కాదు; మోషే పట్ల అహరోను చూపిన గౌరవం, వినయం, సామాజిక సంబంధాన్ని ‘నా ప్రభూ’ మరింత స్పష్టంగా నిలుపుతుంది.
- issue: חַטָּאת యొక్క సందర్భార్థం
  choice: పాపం
  alternative: అపరాధం
  rationale: మూలపదంలోని నైతిక తప్పిద భావాన్ని ‘పాపం’ నేరుగా నిలుపుతుంది; అయితే శిక్షార్హత లేదా దోషభారం ప్రధానంగా గ్రహిస్తే ‘అపరాధం’ కూడా సాధ్యమైన పఠనం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. అహరోను వేడుకోలు, మోషే పట్ల అతని వినయపూర్వక సంబోధన, అలాగే ‘మోపడం’ అనే హీబ్రూ రూపకం నిలుపబడ్డాయి.
