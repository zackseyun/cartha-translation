  revision_rationale: The revised wording explicitly preserves both coordinated Hebrew confessions—acting foolishly and sinning—while expressing their force naturally as the grounds of Aaron’s plea. The metaphor of laying sin upon them is retained, and the footnote is anchored to the corresponding lexical term.
