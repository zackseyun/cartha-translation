source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: te
  text: మోషే పెళ్లి చేసుకున్న కూషీయురాలి[a] కారణంగా మిర్యాము, అహరోను మోషేకు విరోధంగా మాట్లాడారు.[b] ఎందుకంటే అతడు కూషీయురాలిని పెళ్లి చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, కూషు ప్రాంతానికి చెందిన స్త్రీ. దీనిని సంప్రదాయంగా ‘ఇథియోపియా స్త్రీ’ అని కూడా అనువదించారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘మాట్లాడింది’ అనే క్రియ ఏకవచన స్త్రీలింగంలో ఉంది; ఇది మిర్యాము మాట ప్రారంభించి ఉండవచ్చని సూచించవచ్చు.
    reason: textual_grammar
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: మోషేకు విరోధంగా మాట్లాడారు
  rationale: דבר తో కూడిన ב ఇక్కడ ప్రతికూలంగా ఒకరికి విరోధంగా మాట్లాడడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సంయుక్త కర్తకు సహజంగా బహువచన క్రియ వాడబడింది; హీబ్రూలోని ఏకవచన స్త్రీలింగ క్రియ మిర్యాము ప్రధానంగా మాట ప్రారంభించి ఉండవచ్చని సూచించినా, దాన్ని ప్రధాన పాఠంలో నిర్దిష్టంగా ప్రకటించలేదు.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: మిర్యాము, అహరోను
  rationale: హీబ్రూ క్రమాన్ని అలాగే ఉంచి, తెలుగు బైబిలు పేర్లకు అనుగుణమైన రూపాలను వాడాం.
- source_word: עַל אֹדוֹת
  choice: కారణంగా
  rationale: ఈ పదబంధంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאִשָּׁה הַכֻּשִׁית
  choice: కూషీయురాలు
  rationale: ఆమె కూషు ప్రాంతానికి చెందినదని తెలిపే జాతి/భౌగోళిక విశేషణాన్ని నేరుగా నిలుపుతుంది; ఆధునిక ఇథియోపియాతో అనవసరంగా సమానం చేయదు.
- source_word: אֲשֶׁר לָקָח / לָקָח
  choice: పెండ్లి చేసుకున్న
  rationale: לקח అక్షరార్థంగా ‘తీసుకొను’ అయినా, స్త్రీని తీసుకోవడం అనే ఈ సందర్భంలో ‘భార్యగా తీసుకొను/పెండ్లి చేసుకొను’ అనే వివాహ సంబంధిత హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన కారణాన్ని వివరణాత్మకంగా మళ్లీ చెప్పే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: అతడు కూషీయురాలిని పెండ్లి చేసుకున్నాడు
  rationale: హీబ్రూ పాఠంలోని ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా నిలిపాం.
theological_decisions:
- issue: మోషే భార్య గుర్తింపు, జాతి/భౌగోళిక నిర్దేశం
  choice: כֻשִׁית ను ‘కూషీయురాలు’గా అనువదించడం
  alternative: ‘ఇథియోపియా స్త్రీ’ అని అనువదించడం లేదా ఆమెను సిప్పోరాతో స్పష్టంగా సమీకరించడం
  rationale: వచనం ఆమెను కూషీయురాలిగా మాత్రమే పేర్కొంటుంది. చారిత్రక గుర్తింపు లేదా ఇతర సంప్రదాయాలతో సమన్వయం చేసే నిర్ణయాన్ని అనువాదంలోకి దిగుమతి చేయకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: హీబ్రూ ఏకవచన స్త్రీలింగ క్రియ మరియు ఇద్దరు కర్తలు
  choice: ప్రధాన పాఠంలో సహజమైన తెలుగు బహువచనం వాడి, మిర్యాము ముందుండి మాట్లాడి ఉండవచ్చనే సూచనను పాదసూచికలో పేర్కొనడం
  alternative: ‘మిర్యాము మాట్లాడింది, అహరోను ఆమెతో ఉన్నాడు’ అని వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ వ్యాకరణంలోని అసాధారణతను గమనించాలి; అయితే అది మిర్యామే ప్రారంభించిందని నిర్దిష్టంగా నిరూపించదు. కాబట్టి అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తీసుకున్నాడు’ అనే అస్పష్టమైన అక్షరానువాదం బదులు వివాహ నుడికారానికి సరిపడే ‘పెండ్లి చేసుకున్నాడు’ వాడాం. హీబ్రూ పునరుక్తిని నిలిపాం; ‘కూషీయురాలు’ అనే మూలానికి పారదర్శకమైన పదాన్ని ఉపయోగించాం.
