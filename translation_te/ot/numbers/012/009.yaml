base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: te
  text: యాహ్వే కోపం వారిమీద రగులుకుంది[a]; ఆయన వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారం పదశః: ‘యాహ్వే ముక్కు వారిమీద మండింది’; దీని అర్థం ‘యాహ్వే కోపం వారిమీద రగులుకుంది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: రగులుకుంది
  rationale: חרה అనే క్రియ కోపం వేడెక్కడం లేదా మండడం అనే రూపకాన్ని వ్యక్తం చేస్తుంది. ‘రగులుకుంది’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని వేడి రూపకాన్ని నిలుపుతుంది.
- source_word: אַף
  choice: కోపం
  rationale: పదశః ‘ముక్కు’; అయితే חרהతో కలిసిన ఈ హీబ్రూ నుడికారంలో కోపాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘కోపం’ సహజమైన అర్థానువాదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’గా లిప్యంతరీకరించడం ద్వారా బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతున్నాం.
- source_word: בָּם
  choice: వారిమీద
  rationale: కోప నుడికారంలో בְּ ఉపసర్గ కోపానికి గురైనవారిని సూచిస్తుంది; తెలుగులో ‘వారిమీద’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיֵּלַךְ
  choice: ఆయన అక్కడి నుండి వెళ్లిపోయాడు
  rationale: הלך ఇక్కడ దేవుడు సంభాషణ అనంతరం వైదొలగడాన్ని సూచిస్తుంది. ‘అక్కడి నుండి వెళ్లిపోయాడు’ సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలో దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచాం; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని కోపపు వేడి రూపకాన్ని ‘రగులుకుంది’తో నిలుపుతూ, పదశః ‘ముక్కు’ అనే నుడికారాన్ని పాదటిప్పణిలో వివరించాం.
