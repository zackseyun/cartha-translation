source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: te
  text: అప్పుడు మోషే యాహ్వేకు మొరపెట్టి, “దేవా, దయచేసి ఆమెను స్వస్థపరచు—దయచేసి!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: మొరపెట్టి
  rationale: צעק ఇక్కడ బలమైన, అత్యవసరమైన ప్రార్థనాపూర్వక మొరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మొరపెట్టు’ ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవాకు
  rationale: אֶל దిశను సూచించే విభక్తి; יְהוָה దేవుని వ్యక్తిగత నామం. తెలుగులో సహజమైన సంప్రదాయ లిప్యంతరీకరణగా ‘యెహోవా’ను ఉపయోగించాం.
- source_word: לֵאמֹר
  choice: అన్నాడు
  rationale: ఈ క్రియారూపం మోషే మొరలోని ప్రత్యక్ష మాటలను పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: אֵל
  choice: దేవా
  rationale: אֵל ఇక్కడ సంబోధన. ‘దేవా’ దాని ప్రార్థనాత్మక సంబోధనా భావాన్ని నేరుగా అందిస్తుంది.
- source_word: נָא ... נָא
  choice: దయచేసి ... దయచేసి
  rationale: రెండుసార్లు వచ్చిన נָא మోషే విన్నపంలోని తీవ్రతను పెంచుతుంది. మూలంలోని పునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: רְפָא
  choice: స్వస్థపరచు
  rationale: רפא యొక్క ఆజ్ఞార్థక రూపం మిర్యామును వ్యాధి నుంచి నయం చేయమనే విన్నపం. ‘స్వస్థపరచు’ ప్రస్తుత ప్రమాణ తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఎంపిక.
- source_word: לָהּ
  choice: ఆమెను
  rationale: మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం మిర్యామును సూచిస్తుంది; తెలుగులో కర్మరూపంగా ‘ఆమెను’ అని స్పష్టంగా అనువదించాం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ అనే లిప్యంతరీకరణతో నిలిపాం.
- issue: రెండుసార్లు వచ్చిన נָאను నిలపడం
  choice: ‘దయచేసి’ని రెండుసార్లు ఉంచడం
  alternative: తెలుగు సహజత్వం కోసం ఒక్కసారి మాత్రమే ఉంచడం
  rationale: ఈ పునరుక్తి మోషే మధ్యవర్తిత్వ ప్రార్థనలోని ఆతురతను తెలియజేస్తుంది. దాన్ని తొలగిస్తే మూలంలోని భావతీవ్రత తగ్గుతుంది; విరామచిహ్నం ద్వారా తెలుగులో సహజమైన అత్యవసర విన్నపంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘మొరపెట్టి’ అత్యవసర మధ్యవర్తిత్వ భావాన్ని, ‘దేవా’ ప్రత్యక్ష సంబోధనను, రెండుసార్లు వచ్చిన ‘దయచేసి’ హెబ్రీ పాఠంలోని పునరుక్తి మరియు ఆతురతను నిలుపుతాయి.
