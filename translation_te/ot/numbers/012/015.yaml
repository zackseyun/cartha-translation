id: NUM.12.15
reference: Numbers 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּסָּגֵ֥ר מִרְיָ֛ם מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים וְ/הָ/עָם֙ לֹ֣א נָסַ֔ע עַד הֵאָסֵ֖ף מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: te
  text: అప్పుడు మిర్యాము ఏడు రోజులపాటు శిబిరం వెలుపల ఉంచబడింది. మిర్యాము చేర్చబడే వరకు[a] ప్రజలు బయలుదేరలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘మిర్యాము చేర్చబడే వరకు.’ ఇక్కడ హీబ్రూ క్రియ వెలుపల ఉంచబడిన మిర్యాము మళ్లీ సమాజంలో చేర్చబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: నిర్బంధించబడింది
  rationale: סגר నిఫాల్ రూపం మిర్యాము ఇతరుల నుండి వేరుచేయబడి, శిబిరం వెలుపల ఉండేలా చేయబడిందని సూచిస్తుంది. ‘నిర్బంధించబడింది’ ఆ విధించబడిన స్థితిని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: ఇశ్రాయేలీయుల అరణ్య ప్రయాణ సందర్భంలోని స్థల సూచనను సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְהָעָם לֹא נָסַע
  choice: ప్రజలు బయలుదేరలేదు
  rationale: נסע అరణ్య ప్రయాణ వర్ణనల్లో శిబిరాన్ని ఎత్తి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది; ‘బయలుదేరలేదు’ ఆ ప్రయాణార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: మిర్యాము తిరిగి శిబిరంలోకి చేర్చబడే వరకు
  rationale: אסף నిఫాల్ రూపానికి మౌలికంగా ‘సమకూర్చబడడం/చేర్చబడడం’ అనే భావం ఉంది. సందర్భంలో ఇది వెలుపల ఉంచబడిన మిర్యాము మళ్లీ శిబిర సమాజంలోకి చేర్చబడడాన్ని సూచిస్తుంది; ఆ సందర్భార్థాన్ని తెలుగులో స్పష్టంగా చెప్పి, మూలంలోని పదప్రయోగాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వచనశైలిలో అనువదించబడింది. హీబ్రూ వాక్యంలోని రెండు ప్రధాన భాగాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం; కారణ–ఫలిత అనుసంధానాన్ని ‘కాబట్టి’తో నిలిపాం.
