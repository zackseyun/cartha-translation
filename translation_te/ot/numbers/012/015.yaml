    text: మరింత అక్షరార్థంగా, ‘మిర్యాము చేర్చబడే వరకు.’ ఇక్కడ హీబ్రూ క్రియ వెలుపల ఉంచబడిన మిర్యాము మళ్లీ సమాజంలో చేర్చబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the exclusion and seven-day duration, while rendering the final Hebrew passive more closely as ‘until Miriam was gathered in.’ It removes the explicit additions ‘back’ and ‘into the camp,’ which are inferable from context but not directly stated in the clause. The revised footnote gives a clear, idiomatic Telugu lexical explanation.
