revisions:
- from: కాబట్టి మిర్యాము ఏడు రోజులపాటు శిబిరం వెలుపల నిర్బంధించబడింది. మిర్యాము తిరిగి శిబిరంలోకి చేర్చబడే వరకు[a] ప్రజలు బయలుదేరలేదు.
  to: అప్పుడు మిర్యాము ఏడు రోజులపాటు శిబిరం వెలుపల ఉంచబడింది. మిర్యాము చేర్చబడే వరకు[a] ప్రజలు బయలుదేరలేదు.
  rationale: The revision retains the exclusion and seven-day duration, while rendering the final Hebrew passive more closely as ‘until Miriam was gathered in.’ It removes the explicit additions ‘back’ and ‘into the camp,’ which are inferable from context but not directly stated in the clause. The revised footnote gives a clear, idiomatic Telugu lexical explanation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:51:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Miriam's seven-day exclusion outside the camp and the people's delayed departure. However, ‘తిరిగి శిబిరంలోకి’ makes explicit both ‘back’ and the camp destination, whereas the Hebrew says more compactly, ‘until Miriam was gathered in.’ The context supports restoration, but the translation should not state more than the wording requires.
  naturalness: The Telugu is generally clear and modern. ‘శిబిరం వెలుపల ఉంచబడింది’ is more idiomatic and contextually precise than ‘నిర్బంధించబడింది,’ which can suggest detention or imprisonment. ‘చేర్చబడే వరకు’ is natural in context and avoids unnecessary expansion.
  terminology: ‘శిబిరం,’ ‘ప్రజలు,’ and ‘బయలుదేరలేదు’ are appropriate for the wilderness-travel setting. The footnote’s ‘సమకూర్చబడే’ is not a natural Telugu equivalent here; ‘చేర్చబడే’ better represents the contextual sense of the Hebrew passive ‘be gathered in.’
  issues:
  - severity: medium
    issue: The main text adds ‘తిరిగి శిబిరంలోకి’ (‘back into the camp’) to the final clause.
    rationale: Restoration to the camp is contextually clear, but the Hebrew expression itself is simply ‘until Miriam was gathered in.’ Removing the added locative and ‘back’ preserves the source’s concise wording and avoids over-specification.
  - severity: low
    issue: ‘నిర్బంధించబడింది’ can sound like imprisonment or legal detention.
    rationale: The Hebrew depicts Miriam as shut out/excluded outside the camp. ‘శిబిరం వెలుపల ఉంచబడింది’ expresses this naturally without importing a stronger modern detention nuance.
  - severity: low
    issue: The footnote’s ‘సమకూర్చబడే’ is awkward and potentially unclear in Telugu.
    rationale: A footnote should clarify the lexical alternative. ‘చేర్చబడే’ is understandable and fits the restoration/exclusion context.
  revised_text: అప్పుడు మిర్యాము ఏడు రోజులపాటు శిబిరం వెలుపల ఉంచబడింది. మిర్యాము చేర్చబడే వరకు[a] ప్రజలు బయలుదేరలేదు.
  revised_footnotes:
