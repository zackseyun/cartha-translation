revisions:
- from: దయచేసి, ఆమెను చనిపోయినదానిలా ఉండనివ్వకు—తన తల్లి గర్భంలోనుంచి బయటికి వచ్చేటప్పటికే శరీరంలో సగం క్షీణించిపోయిన శిశువులా![a]
  to: దయచేసి, ఆమెను చనిపోయినవానిలా ఉండనివ్వకు[a]—అతడు తన తల్లి గర్భం నుండి బయటికి వచ్చినప్పుడు అతని మాంసంలో సగం క్షీణించిపోయి ఉంటుంది.
  rationale: The revision retains the feminine referent (‘ఆమె,’ Miriam) while preserving the Hebrew simile’s masculine singular grammar and its non-explicit description of the dead figure. It restores ‘flesh’ rather than ‘body’ and moves the explicit stillborn-child interpretation to the footnote, where it can inform readers without narrowing the main text.
