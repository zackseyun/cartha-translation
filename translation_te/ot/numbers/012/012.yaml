source:
  edition: WLC
  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: te
  text: దయచేసి, ఆమెను చనిపోయినవానిలా ఉండనివ్వకు[a]—అతడు తన తల్లి గర్భం నుండి బయటికి వచ్చినప్పుడు అతని మాంసంలో సగం క్షీణించిపోయి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పుట్టగానే చనిపోయిన శిశువులా, తన తల్లి గర్భం నుండి బయటికి వచ్చినప్పుడు దాని మాంసంలో సగం క్షీణించిపోయి ఉంటుంది.” హీబ్రూ పాఠం అక్షరార్థంగా ‘చనిపోయినవానిలా’ అని చెబుతుంది; తరువాతి వర్ణనను బట్టి కొందరు అనువాదాలు మృతజనన చిత్రాన్ని స్పష్టంగా వ్యక్తం చేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: దయచేసి, ... ఉండనివ్వకు
  rationale: אַל నిషేధాన్ని, נָא అత్యవసరమైన వేడుకోలును వ్యక్తం చేస్తాయి; అందువల్ల మర్యాదతో కూడిన తీవ్రమైన మనవిగా అనువదించబడింది.
- source_word: תְהִי
  choice: ఆమెను ... ఉండనివ్వకు
  rationale: హయా క్రియ యొక్క 3వ పురు. స్త్రీ. ఏక. రూపం ప్రతికూల అభ్యర్థనను సూచిస్తుంది; సందర్భంలో ‘ఆమె’ మిర్యామును సూచిస్తుంది.
- source_word: כַּמֵּת
  choice: చనిపోయినదానిలా
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘చనిపోయిన వ్యక్తిలా’ అని పోలుస్తుంది; తదుపరి వాక్యభాగం జనన సమయంలోని మృతస్థితి చిత్రాన్ని వివరిస్తుంది.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: తన తల్లి గర్భంలోనుంచి బయటికి వచ్చేటప్పటికే
  rationale: בְּతో కూడిన క్రియార్థక నామరూపం కాలార్థాన్ని ఇస్తుంది. ‘బయటికి వచ్చేటప్పుడు’ అనే మూలచిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיֵּאָכֵל
  choice: క్షీణించిపోయిన
  rationale: అక్షరార్థం ‘తినివేయబడింది’; ఇక్కడ శరీరం నశించిన లేదా కుళ్లిన ఫలితస్థితిని సూచిస్తుంది. తెలుగు పాఠకునికి సహజంగా ఉండేలా ‘క్షీణించిపోయిన’ అని ఇచ్చి, భౌతిక భయానకతను నిలిపింది.
- source_word: חֲצִי בְשָׂרוֹ
  choice: శరీరంలో సగం
  rationale: בשר ఇక్కడ భౌతిక మాంసాన్ని సూచిస్తుంది. తెలుగులో ‘మాంసంలో సగం’ కంటే ‘శరీరంలో సగం’ జన్మించిన శిశువు గురించిన ఈ ఉపమానంలో సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: స్త్రీలింగ ఏకవచన సర్వనామం సూచించే వ్యక్తి
  choice: ‘ఆమె’ మిర్యామును సూచిస్తుంది
  alternative: సర్వనామాన్ని స్పష్టంగా పేర్కొనకుండా క్రియారూపంతో మాత్రమే వ్యక్తపరచడం
  rationale: తక్షణ సందర్భంలో అహరోను మిర్యాము కోసం వేడుకుంటున్నాడు. ‘ఆమె’ అని స్పష్టం చేయడం సిద్ధాంతపరమైన అదనాన్ని చేర్చకుండా సూచ్యవ్యక్తిని తెలియజేస్తుంది.
- issue: మృతజనన చిత్రాన్ని ప్రధాన పాఠ్యంలో ఎంత స్పష్టం చేయాలి
  choice: ‘బయటికి వచ్చేటప్పటికే ... శిశువులా’ అని జననసమయ మృతస్థితిని స్పష్టం చేయడం
  alternative: ‘చనిపోయిన వ్యక్తిలా, అతడు తన తల్లి గర్భం నుండి బయటికి వచ్చేటప్పుడు...’ అనే వ్యాకరణ లింగాన్ని యథాతథంగా ఉంచడం
  rationale: హీబ్రూలో כמת సాధారణంగా ‘చనిపోయినవానిలా’ ఉన్నప్పటికీ, తరువాతి గర్భనిష్క్రమణ వాక్యం మృతజనన చిత్రాన్ని కలిగిస్తుంది. ‘శిశువు’ దీనిని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణి నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించింది. మూలంలోని తీవ్రమైన శారీరక చిత్రాన్ని మృదువుపరచకుండా, ‘తినివేయబడిన’ అనే అసహజ అక్షరానువాదం బదులు ‘క్షీణించిపోయిన’ అని సహజీకరించింది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
