source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: te
  text: అప్పుడు యహ్వే మేఘస్తంభంలో దిగి వచ్చి, గుడారపు ప్రవేశద్వారం దగ్గర నిలబడ్డాడు.[a] ఆయన అహరోనును, మిర్యామును పిలిచాడు; వారిద్దరూ ముందుకు వచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘గుడారం’; సందర్భం ప్రకారం ఇది సమావేశ గుడారాన్ని సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా ‘వారిద్దరూ బయటికి వచ్చారు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘బయటికి వెళ్లారు/వచ్చారు’ అని అర్థం; ఇక్కడ యహ్వే పిలుపుకు స్పందించి వారు ముందుకు వచ్చినట్లు సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగి వచ్చి
  rationale: ירד అనే క్రియలోని ‘దిగడం’ అనే స్పష్టమైన కదలికను సహజమైన తెలుగు కథనశైలిలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּעַמּוּד עָנָן
  choice: మేఘస్తంభంలో
  rationale: యహ్వే దిగివచ్చిన ప్రత్యక్షత లేదా మాధ్యమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: కథనంలోని వరుస చర్యను, మానవరూప వర్ణనను యథాతథంగా నిలుపుతుంది.
- source_word: פֶּתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: פתח యొక్క ‘ప్రవేశం/ద్వారం’ భావాన్ని స్పష్టంగా అందిస్తుంది; మూలంలో ఉన్న సాధారణ ‘గుడారం’ అనే పదాన్నే ప్రధాన పాఠ్యంలో ఉంచుతుంది.
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: קרא యొక్క సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: అహరోనును, మిర్యామును
  rationale: హీబ్రూ వ్యక్తినామాలకు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణలను, వాక్యానికి తగిన కర్మవిభక్తితో ఉపయోగిస్తుంది.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: వారిద్దరూ ముందుకు వచ్చారు
  rationale: שְׁנֵיהֶם లోని ‘ఇద్దరూ’ అనే భావాన్ని నిలుపుతూ, పిలుపుకు స్పందించి సమక్షానికి రావడాన్ని సందర్భానుసారంగా తెలుపుతుంది; יצא యొక్క అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- issue: యహ్వే దిగివచ్చాడనే మానవరూప వర్ణన
  choice: ‘దిగి వచ్చి’ అనే స్పష్టమైన కదలికను నిలుపడం
  alternative: ‘ప్రత్యక్షమై’ అని సారాంశంగా చెప్పడం
  rationale: మూలపాఠం దిగివచ్చే చర్యను స్పష్టంగా చెబుతుంది; దానిని నిలుపడం దైవసన్నిధి గురించి అదనపు తాత్త్విక వివరణను పాఠ్యంలోకి చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని వరుస చర్యలు, దైవనామం, మానవరూప దిగివచ్చే వర్ణన నిలుపబడ్డాయి. ఇచ్చిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు విరుద్ధ స్థానాల్లో కనిపించినందున, తెలుగు ముసాయిదాలో ‘గుడారం’ సూచికను [a]గా ప్రవేశద్వారం వద్ద, יצא క్రియ సూచికను [b]గా చివరి చర్య వద్ద సరిగా అనుసంధానించాం.
