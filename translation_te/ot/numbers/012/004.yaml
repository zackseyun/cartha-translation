revisions:
- from: యెహోవా అకస్మాత్తుగా మోషే, అహరోను, మిర్యాములతో, “మీరు ముగ్గురూ ప్రత్యక్షపు గుడారం దగ్గరికి బయటికి రండి[a]” అని చెప్పాడు. అప్పుడు ఆ ముగ్గురూ బయటికి వెళ్లారు.
  to: 'యాహ్వే అకస్మాత్తుగా మోషే, అహరోను, మిర్యాములతో ఇలా అన్నాడు: “మీ ముగ్గురూ సమావేశపు గుడారం వద్దకు బయటికి రండి[a].” అప్పుడు ఆ ముగ్గురూ బయటికి వెళ్లారు.'
  rationale: The revision aligns the divine name with the POB Yahweh policy, renders 'tent of meeting' more directly in modern Telugu, and improves the command's Telugu syntax without removing the Hebrew verb's directional flexibility. The repeated emphasis on all three persons remains intact.
