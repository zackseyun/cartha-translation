  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: te
  text: 'యాహ్వే అకస్మాత్తుగా మోషే, అహరోను, మిర్యాములతో ఇలా అన్నాడు: “మీ ముగ్గురూ సమావేశపు గుడారం వద్దకు బయటికి రండి[a].” అప్పుడు ఆ ముగ్గురూ బయటికి వెళ్లారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయటికి వెళ్లండి.” హీబ్రూ క్రియ ఒక స్థలం నుంచి బయటికి కదలడాన్ని మాత్రమే సూచిస్తుంది; సందర్భాన్ని బట్టి ‘రండి’ లేదా ‘వెళ్లండి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించాం.
- source_word: פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: మాట పలికిన తీరు తక్షణమూ అనూహ్యమూ అయినదని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: צְאוּ
  choice: బయటికి రండి
  rationale: יצא క్రియ ఏదో స్థలం నుంచి బయటికి కదలడాన్ని సూచిస్తుంది; పిలుపు సందర్భంలో ‘బయటికి రండి’ సహజంగా ఉంటుంది, అయితే దిశను బట్టి ‘బయటికి వెళ్లండి’ అని కూడా అనువదించవచ్చు.
- source_word: שְׁלָשְׁתְּכֶם
  choice: మీరు ముగ్గురూ
  rationale: సంబోధించబడిన ముగ్గురినీ కలిపి స్పష్టంగా నొక్కిచెప్పే సహజ తెలుగు రూపం.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే, తెలుగు బైబిలు వాడుకలో గుర్తించదగిన పదబంధం.
- source_word: וַיֵּצְאוּ
  choice: బయటికి వెళ్లారు
  rationale: హీబ్రూ కథన క్రియను సరళమైన భూతకాల కథన రూపంలో అందిస్తుంది.
- source_word: שְׁלָשְׁתָּם
  choice: ఆ ముగ్గురూ
  rationale: ముగ్గురూ ఆ ఆజ్ఞకు లోబడినట్లు హీబ్రూ పునరుద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు సాధారణ బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘మీరు ముగ్గురూ’ మరియు ‘ఆ ముగ్గురూ’ అనే పునరుద్ఘాటన నిలుపబడింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
