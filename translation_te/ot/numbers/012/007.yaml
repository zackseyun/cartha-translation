source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: te
  text: నా సేవకుడైన మోషే విషయంలో మాత్రం అలా కాదు; అతడు నా ఇల్లంతటిలో[a] నమ్మకమైనవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఇంటివారందరిలో.” హీబ్రూ పదమైన “ఇల్లు” భౌతిక కట్టడాన్ని మాత్రమే కాకుండా ఇంటివారిని లేదా అధికార పరిధిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: అలా కాదు
  rationale: ముందటి వాక్యంలోని సాధారణ విధానానికి మోషేను బలమైన వ్యత్యాసంగా చూపించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עַבְדִּי
  choice: నా సేవకుడు
  rationale: ఇక్కడ עֶבֶד బానిసత్వాన్ని ప్రధానంగా సూచించకుండా, దేవునితో సంబంధంలో మోషేకు గౌరవప్రదమైన అధికారిక హోదాను సూచిస్తుంది; అందువల్ల ‘సేవకుడు’ తగినది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בְּכָל בֵּיתִי
  choice: నా ఇల్లంతటిలో
  rationale: בְּ అనే విభక్తి సూచించే ‘లో’ భావాన్ని, כָל యొక్క సమగ్రతను, בֵּיתִי అనే ‘నా ఇల్లు’ రూపకాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: נֶאֱמָן
  choice: నమ్మకమైనవాడు
  rationale: ఈ పదం విశ్వసనీయత, ఆధారపడదగిన స్వభావం, విధేయత అనే భావాలను కలిగి ఉంది; వ్యక్తిని వర్ణించే తెలుగులో ‘నమ్మకమైనవాడు’ సహజంగా ఉంటుంది.
- source_word: הוּא
  choice: అతడు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, తెలుగులో స్పష్టమైన కర్తగా పనిచేస్తుంది.
theological_decisions:
- issue: మోషే పాత్రకు సంబంధించి ‘నా ఇల్లు’ అనే పదబంధం అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నా ఇల్లు’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘నా ఇంటివారందరిలో’ లేదా ‘నా ప్రజలందరిలో’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ בַּיִת భౌతిక గృహంతో పాటు ఇంటివారు, కుటుంబ వ్యవస్థ లేదా అధికార పరిధిని సూచించగలదు. అయితే ఇక్కడ రూపకాన్ని అలాగే ఉంచడం దాని ఉద్దేశపూర్వక విస్తృతతను, ఇతర బైబిలు భాగాలతో ఉన్న ప్రతిధ్వనిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అలా కాదు’ అనే ప్రారంభం వ్యత్యాసాన్ని బలంగా ఉంచుతుంది; ‘నా ఇల్లంతటిలో’ మూలంలోని రూపకాన్ని కాపాడుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
