revisions:
- from: మోషే అనే ఆ మనిషి భూమి మీద ఉన్న మనుషులందరికంటే ఎంతో వినయంగలవాడు.[a]
  to: మోషే అనే మనిషి భూమిమీద ఉన్న మనుషులందరికంటే ఎంతో వినయశీలుడు.[a]
  rationale: 'The revision preserves every major element of the Hebrew: the explicit reference to Moses as ‘the man,’ the strong description of his disposition, and his surpassing comparison with all humans on earth. It improves modern Telugu idiom and replaces a potentially misleading alternative in the footnote with a closer lexical option.'
