id: NUM.12.3
reference: Numbers 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: te
  text: మోషే అనే మనిషి భూమిమీద ఉన్న మనుషులందరికంటే ఎంతో వినయశీలుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో మృదుస్వభావి.”
    reason: ענו అనే హీబ్రూ పదం ఈ సందర్భంలో వినయం లేదా మృదుత్వాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో ‘వినయశీలుడు’ను ఎంచుకున్నాం.
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: మోషే అనే ఆ మనిషి
  rationale: וְ కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే వాక్యసందర్భం దానిని సహజంగా తెలియజేస్తుంది. הָאִישׁ అనే పదాన్ని విడిచిపెట్టకుండా, మోషేను సూచించే సహజ తెలుగు పదబంధంగా అనువదించాం.
- source_word: ענו
  choice: వినయంగలవాడు
  rationale: ఇక్కడ ఈ విశేషణం మోషే స్వభావాన్ని ‘వినయంగలవాడు’ అని వర్ణిస్తుంది. ‘సాత్వికుడు’ కూడా సాధ్యమే గాని, అది అదనపు భావఛాయలను కలిగించవచ్చు; ‘బాధింపబడినవాడు’ అనే మూలసంబంధ అర్థం ఈ సందర్భానికి తక్కువగా సరిపోతుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: తీవ్రతను తెలిపే సాధారణ క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִ/כֹּל הָאָדָם
  choice: మనుషులందరికంటే
  rationale: מן + כֹּל తులనాత్మక నిర్మాణాన్ని తెలుగులో సహజంగా ‘అందరికంటే’ అని వ్యక్తం చేశాం. הָאָדָם ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది.
- source_word: אֲשֶׁר עַל פְּנֵי הָ/אֲדָמָה
  choice: భూమి మీద ఉన్న
  rationale: ‘భూమి ముఖం మీద’ అనే హీబ్రూ రూపకాన్ని అర్థస్పష్టమైన, సహజ ఆధునిక తెలుగు నుడికారంగా అందించాం.
theological_decisions:
- issue: ענו అనే పదం సూచించే స్వభావగుణం
  choice: వినయంగలవాడు
  alternative: సాత్వికుడు / దీనుడు
  rationale: ఈ సందర్భంలో మోషే స్వభావంలోని వినయమే ప్రధాన భావం. ‘దీనుడు’ బాధ లేదా అణచివేత భావాన్ని, ‘సాత్వికుడు’ నిర్దిష్ట ఆధ్యాత్మిక భావఛాయను ఎక్కువగా సూచించవచ్చు; అందుచేత మూలంలోని సాధ్యమైన ఉద్రిక్తతను సిద్ధాంతపరంగా విస్తరించకుండా ‘వినయంగలవాడు’ ఎంచుకున్నాం.
- issue: הָאָדָם యొక్క సాధారణ మానవార్థం
  choice: మనుషులందరికంటే
  alternative: ప్రతి వ్యక్తికంటే / సమస్త మానవులకంటే
  rationale: హీబ్రూ ఏకవచన రూపం ఇక్కడ జాతివాచకంగా మానవులందరినీ సూచిస్తుంది. తెలుగు తులనాత్మక వాక్యంలో బహువచన రూపం సహజంగా అదే సమగ్ర భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా దాని ప్రధాన పదాలను నిలిపి, తెలుగు తులనాత్మక నిర్మాణాన్ని సహజంగా వాడాం.
