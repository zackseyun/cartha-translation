source:
  edition: WLC
  text: וְ/אַחַ֛ר נָסְע֥וּ הָ/עָ֖ם מֵ/חֲצֵר֑וֹת וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּ֥ר פָּארָֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: te
  text: ఆ తరువాత ప్రజలు హజేరోతు నుండి బయలుదేరి పారాను అరణ్యంలో శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: మునుపటి సంఘటనల అనంతర క్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: נָסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ వర్ణనలో శిబిరాన్ని విడిచి ముందుకు సాగడమనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచించే עָםకు సాధారణమైన, సహజమైన తెలుగు రూపం.
- source_word: מֵחֲצֵרוֹת
  choice: హజేరోతు నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యంతరీకరించి, מִן ఉపసర్గలోని బయలుదేరిన స్థల భావాన్ని ‘నుండి’తో వ్యక్తం చేసింది.
- source_word: וַיַּחֲנוּ
  choice: బస చేశారు
  rationale: חנהలోని శిబిరం వేసి ఉండడమనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּמִדְבַּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר సూచించే జనావాసం తక్కువైన అరణ్య ప్రాంత భావాన్ని, తెలుగు బైబిలు భాషలో సుపరిచితమైన పదంతో వ్యక్తం చేస్తుంది.
- source_word: פָּארָן
  choice: పారాను
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా ధ్వన్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన కథన శైలిని నిలుపుతూ, ఆధునిక ప్రమాణ తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన భాషను ఉపయోగించాం. వాక్యంలోని వరుస ప్రయాణ క్రియలు స్పష్టంగా ఉండేలా ‘బయలుదేరి, ... బస చేశారు’ అని నిర్మించాం.
