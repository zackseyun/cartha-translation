id: NUM.12.14
reference: Numbers 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “ఆమె తండ్రి ఆమె ముఖం మీద ఉమ్మివేసి ఉంటే, ఆమె ఏడు రోజులు అవమానానికి గురికాదా[a]? ఆమెను ఏడు రోజులు శిబిరం వెలుపల ఉంచాలి; ఆ తర్వాత ఆమెను తిరిగి చేర్చాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ఏడు రోజులు సిగ్గుపడదా?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ తర్వాత ఆమెను మళ్లీ స్వీకరించాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: יָרֹק יָרַק
  choice: ఉమ్మివేసి ఉంటే
  rationale: క్రియకు ముందున్న infinitive absolute చర్యను బలపరుస్తుంది; ఊహాత్మక షరతును సహజ తెలుగులో వ్యక్తం చేస్తూ, అసహజమైన పదపునరుక్తిని నివారించాం.
- source_word: בְּפָנֶיהָ
  choice: ఆమె ముఖం మీద
  rationale: ఉమ్మివేయడం అనే సందర్భంలో ఇది ప్రత్యక్షమైన అవమానకర చర్యను సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִכָּלֵם
  choice: అవమానానికి గురికాదా
  rationale: כלם నిఫాల్ రూపంలోని బహిరంగ అవమానం, అపకీర్తి భావాన్ని నిలుపుతూ మూలంలోని అలంకారప్రశ్నను కాపాడాం.
- source_word: תִּסָּגֵר
  choice: నిర్బంధించాలి
  rationale: మూలంలోని నిఫాల్/కర్మణి భావం సూచించే వేరుగా మూసివేయడం లేదా నిర్బంధించడం అనే అర్థాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: బహిష్కరణ జరిగే ప్రదేశాన్ని నేరుగా, సహజంగా తెలిపే సమీప రూపాంతరం.
- source_word: תֵּאָסֵף
  choice: తిరిగి చేర్చుకోవాలి
  rationale: אסף నిఫాల్ రూపం బహిష్కరణ తర్వాత ఆమెను మళ్లీ సమూహంలోకి స్వీకరించే కర్మణి భావాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: తండ్రి ఉమ్మివేయడం గురించిన వాక్య స్వభావం
  choice: అవమానం మరియు తాత్కాలిక బహిష్కరణను వివరించే ఊహాత్మక సాదృశ్యం
  alternative: నిజంగా జరిగిన ఒక సంఘటనను జ్ఞాపకం చేయడం
  rationale: హీబ్రూ నిర్మాణం మిర్యాము ఏడు రోజులపాటు శిబిరం వెలుపల ఉండటానికి కారణాన్ని వివరించే అలంకారప్రశ్నతో కూడిన ఊహాత్మక షరతుగా ఉంది; అదనపు ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన అర్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని అలంకారప్రశ్న, ఏడు రోజుల కాలపరిమితి, శిబిరం వెలుపల నిర్బంధం, అనంతర పునఃచేర్పు అన్నీ నిలుపుకున్నాం.
