review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the divine name, the hypothetical father's spitting, the rhetorical question, the seven-day exclusion, and subsequent restoration. However, తిరిగి చేర్చుకోవాలి is active and reflexive (‘should take [her] back for themselves’), whereas תֵּאָסֵף is passive (‘she shall be gathered/received back’).
  naturalness: The Telugu is generally clear and modern. Recasting the final restoration clause in a passive form is both more natural in this context and closer to the Hebrew. శిబిరం వెలుపల ... ఉంచాలి communicates the required exclusion without importing the potentially stronger prison-like nuance of నిర్బంధించాలి.
  terminology: యాహ్వే, మోషే, శిబిరం, అవమానానికి గురికాదా, and the rendering of the public insult are appropriate. The footnote for the final clause should offer a genuine natural lexical alternative rather than the awkward literalism సమకూర్చాలి.
  issues:
  - severity: medium
    issue: 'The final clause uses an active/reflexive construction: ఆమెను తిరిగి చేర్చుకోవాలి.'
    rationale: The Hebrew Niphal תֵּאָסֵף presents Miriam as the one being gathered back in. Telugu should preserve this passive sense and avoid implying that Miriam herself, or an unspecified group acting for its own benefit, ‘takes her back.’
  - severity: low
    issue: The second footnote’s wording, ఆమెను తిరిగి సమకూర్చాలి, is not idiomatic modern Telugu.
    rationale: It is an overly literal calque and does not clearly communicate restoration to the camp/community. A natural alternative can retain the lexical sense of being received back.
