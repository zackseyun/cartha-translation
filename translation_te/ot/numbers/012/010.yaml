source:
  edition: WLC
  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: te
  text: ఆ మేఘం గుడారం మీదనుండి తొలగిపోయింది; ఇదిగో, మిర్యాముకు చర్మవ్యాధి[a] సోకి, ఆమె మంచువలె కనిపించింది. అప్పుడు అహరోను మిర్యాము వైపు తిరిగాడు; ఇదిగో, ఆమె చర్మవ్యాధిగ్రస్తురాలై ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘చర్మవ్యాధి’గా అనువదించిన హీబ్రూ పదాన్ని సంప్రదాయంగా ‘కుష్ఠు’ అని అనువదిస్తారు. అయితే అది ఆధునిక వైద్యంలో హాన్సెన్ వ్యాధిగా పిలిచే కుష్ఠును మాత్రమే కాకుండా, మరింత విస్తృతమైన చర్మరోగాన్ని లేదా ఆచారపరంగా అపవిత్రత కలిగించే చర్మస్థితిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: నిర్దిష్ట రూపంలో ఉన్న ఈ పదం సందర్భంలో యెహోవా సన్నిధితో సంబంధమున్న దృశ్యమైన మేఘాన్ని సూచిస్తుంది.
- source_word: סָר
  choice: తొలగిపోయింది
  rationale: పై నుండి పక్కకు వెళ్లిపోవడం లేదా ఉపసంహరించుకోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעַל הָאֹהֶל
  choice: గుడారం మీద నుండి
  rationale: గుడారం పైనున్న స్థానం నుండి మేఘం తొలగిపోయిందనే దిశార్థాన్ని నిలుపుతుంది; మూలంలో లేని ‘సన్నిధి గుడారం’ అనే విస్తరణను చేర్చలేదు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన స్థితిని సజీవంగా, ఆశ్చర్యభావంతో చూపించే హీబ్రూ అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: מְצֹרַעַת
  choice: చర్మవ్యాధి సోకి
  rationale: ఈ హీబ్రూ పదం ఆధునిక వైద్యంలో హాన్సెన్ వ్యాధిగా గుర్తించే కుష్ఠుకు మాత్రమే పరిమితం కాదు. అందువల్ల ప్రధాన పాఠ్యంలో విస్తృతమైన ‘చర్మవ్యాధి’ని వాడి, సంప్రదాయ అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: כַּשָּׁלֶג
  choice: మంచులా కనిపించింది
  rationale: మూలంలోని సంక్షిప్తమైన ‘మంచులా’ అనే పోలికను నిలుపుతూ, తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘కనిపించింది’ అని వ్యక్తీకరించాం; పోలికను స్పష్టంగా ‘తెల్లగా’ అని మాత్రమే నిర్ధారించలేదు.
- source_word: וַיִּפֶן ... אֶל
  choice: వైపు తిరిగాడు
  rationale: అహరోను మిర్యాము దిశగా శారీరకంగా తిరిగిన చర్యను నేరుగా తెలియజేస్తుంది.
