translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదాన్ని రెండుసార్లు ఉంచి మూలంలోని సజీవతను, ఉద్దేశపూర్వక పునరుక్తిని నిలిపాం. వైద్యపరంగా అతిసంకుచితమైన అర్థం రాకుండా ప్రధాన పాఠ్యంలో ‘చర్మవ్యాధి’ని ఎంచుకున్నాం.
