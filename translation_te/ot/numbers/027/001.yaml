source:
  edition: WLC
  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: te
  text: 'అప్పుడు యోసేపు కుమారుడైన మనష్షే వంశాలకు చెందిన సెలోపెహాదు కుమార్తెలు ముందుకు వచ్చారు[a]. సెలోపెహాదు హెఫెరు కుమారుడు; హెఫెరు గిలాదు కుమారుడు; గిలాదు మాకీరు కుమారుడు; మాకీరు మనష్షే కుమారుడు. సెలోపెహాదు కుమార్తెల పేర్లు: మహ్లా, నోవా[b], హొగ్లా, మిల్కా, తిర్సా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘దగ్గరకు వచ్చారు’ అని ఉంది; ‘సమీపించారు’ అని కూడా అనువదించవచ్చు. తరువాతి వచనాల్లో వివరించబడే అధికారిక విన్నపం కోసం వారు ముందుకు వచ్చిన భావం ఈ పదప్రయోగంలో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘నోవా’ అనేది సెలోపెహాదు కుమార్తెలలో ఒకరి పేరు; ఆదికాండంలో ప్రస్తావించబడిన పురుషుడైన నోవహు కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: ముందుకు వచ్చారు
  rationale: קרב అనే క్రియ ఇక్కడ అధికారుల సమక్షానికి వచ్చి తమ విన్నపాన్ని ఉంచే సందర్భాన్ని సూచిస్తుంది. ‘ముందుకు వచ్చారు’ అనేది కేవలం భౌతికంగా దగ్గరకు రావడాన్నే కాక, అధికారికంగా హాజరైన భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנוֹת
  choice: కుమార్తెలు
  rationale: పేరుపెట్టబడిన తండ్రితో ఉన్న నిర్మాణం ఇక్కడ అక్షరార్థంగా కుమార్తెలనే సూచిస్తుంది; తరువాతి పేర్ల జాబితా కూడా దీనిని నిర్ధారిస్తుంది.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: కుమారుడు ... కుమారుడు ... కుమారుడు ... కుమారుడు
  rationale: వారసత్వ విన్నపానికి ఆధారమైన పూర్తి వంశక్రమాన్ని కుదించకుండా నిలిపేందుకు హెబ్రీ మూలంలోని ప్రతి తరాన్ని స్పష్టంగా అనువదించాం.
- source_word: לְמִשְׁפְּחֹת
  choice: వంశాలకు చెందిన
  rationale: మִשְׁפָּחָה గోత్ర సంబంధ సందర్భంలో పెద్ద గోత్రంలోని వంశ విభాగాన్ని సూచిస్తుంది. ఇక్కడ לְ అనుబంధాన్ని తెలియజేస్తున్నందున ‘వంశాలకు చెందిన’ సహజమైన, స్పష్టమైన రూపం.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: యోసేపు కుమారుడైన మనష్షే
  rationale: మనష్షేను యోసేపు వంశంతో కలిపే మూలపాఠంలోని పూర్తి గోత్ర సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: సెలోపెహాదు కుమార్తెల పేర్లు
  rationale: తెలుగులో సర్వనామ సందిగ్ధత రాకుండా ‘అతని’ స్థానంలో సూచిత వ్యక్తి పేరును మళ్లీ పేర్కొని, పేర్ల జాబితాను సహజంగా పరిచయం చేశాం.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: మహ్లా, నోవా, హొగ్లా, మిల్కా, తిర్సా
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. ఇక్కడ ‘నోవా’ స్త్రీ పేరు.
