translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన వంశావళి తెలుగులో స్పష్టంగా వినిపించేందుకు దానిని రెండు వాక్యాలుగా అమర్చినా, మూలంలోని ప్రతి వంశ సంబంధాన్ని యథాతథంగా నిలిపాం. పాదసూచిక గుర్తులను వాటి విషయానికి సరిపోయే పదాల దగ్గర ఉంచాం.
