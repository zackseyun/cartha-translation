source:
  edition: WLC
  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: te
  text: “మానవులందరి ఆత్మలకు దేవుడైన యహ్వే[a], సమాజంపై ఒక పురుషుణ్ణి నియమించుగాక.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘మానవులందరి ఆత్మలకు దేవుడైన యహ్వే సమాజంపై ఒక పురుషుణ్ణి నియమించునుగాక.’'
    reason: హెబ్రీయ క్రియను విన్నపాత్మకంగా వ్యక్తపరచడానికి మరో తెలుగు రూపం.
  - marker: b
    text: మూలంలోని ‘సమస్త శరీరులు’ అనేది మర్త్యులైన మానవులందరినీ సూచించే హెబ్రీయ నుడికారం.
    reason: లְכָל־בָּשָׂר అనే హెబ్రీయ నుడికారానికి వివరణ.
  - marker: c
    text: ‘సమాజం’కు బదులుగా ‘సభ’ అని కూడా అనువదించవచ్చు.
    reason: עֵדָה పదానికి సందర్భోచితమైన మరో అనువాదం.
lexical_decisions:
- source_word: יִפְקֹד
  choice: నియమించుగాక
  rationale: פקד అనే క్రియకు అనేక అర్థాలున్నా, ఒక వ్యక్తిని ప్రత్యక్ష కర్మగా తీసుకొని ‘సమాజం మీద’ అనే పదబంధంతో రావడం వల్ల ఇక్కడ నాయకత్వ బాధ్యతకు నియమించడం అనే భావం సరిపోతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: ఆత్మలకు దేవుడు
  rationale: ప్రత్యేకమైన ఈ దైవ బిరుదులోని రוּחוֹת పదాన్ని ‘ఆత్మలు’గా అనువదించడం ద్వారా మానవుల అంతరంగ జీవితం దేవుని అధికారానికి లోబడినదనే భావాన్ని నిలిపాం.
- source_word: לְכָל בָּשָׂר
  choice: సమస్త శరీరుల
  rationale: ‘సమస్త శరీరం’ అనే హెబ్రీయ జాతీయాన్ని పూర్తిగా విప్పి చెప్పకుండా, మానవుల మర్త్య సృష్టిత్వాన్ని సూచించే దాని బైబిలీయ రూపకాన్ని తెలుగులో సహజంగా ‘సమస్త శరీరులు’ అని నిలిపాం.
- source_word: אִישׁ
  choice: ఒక పురుషుణ్ణి
  rationale: మూలంలోని పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం; సందర్భంలో మోషేకు వారసుడయ్యే పురుష నాయకుణ్ణి సూచిస్తుంది. అందువల్ల లింగాన్ని తటస్థీకరించలేదు.
- source_word: עַל הָעֵדָה
  choice: సమాజం మీద
  rationale: עֵדָה ఇశ్రాయేలు ఒడంబడిక సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, సమీకృత సమూహ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: విన్నపంలో దైవ నామం, దైవ బిరుదు అనువాదం
  choice: సమస్త శరీరుల ఆత్మలకు దేవుడైన యహ్వే ... నియమించుగాక
  alternative: ప్రభువు ... నియమించునుగాక
  rationale: మూలంలో יהוה అనే వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా ఇచ్చాం. విన్నప స్వరాన్ని ‘నియమించుగాక’ నిలుపుతుంది.
- issue: אִישׁ పదంలోని లింగ సూచన
  choice: ఒక పురుషుణ్ణి
  alternative: ఒక వ్యక్తిని / ఒకరిని
  rationale: మూలంలోని స్పష్టమైన పుంలింగ ఏకవచనాన్ని, అలాగే యెహోషువను మోషే వారసునిగా నియమించే సందర్భాన్ని నిలిపేందుకు లింగ-నిర్దిష్ట అనువాదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘సమస్త శరీరుల ఆత్మలకు దేవుడు’ అనే అసాధారణమైన బైబిలీయ బిరుదును దాని ఉద్దేశపూర్వక ప్రత్యేకతతో నిలిపాం; అయితే తెలుగు వాక్యనిర్మాణం సహజంగా ఉండేందుకు ‘దేవుడైన యహ్వే’గా కూర్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
