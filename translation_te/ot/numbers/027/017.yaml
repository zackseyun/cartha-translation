  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: te
  text: వారి ముందుగా బయలుదేరి, వారి ముందుగా వచ్చేవాడిని[a], వారిని బయటికి నడిపించి, వారిని లోపలికి తీసుకువచ్చేవాడిని[b] నియమించు. అప్పుడు యాహ్వే సమాజం కాపరి లేని గొర్రెల్లా ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి ముందుగా’ అనే మాటను రెండు చోట్లా ‘వారికి ముందుగా’ లేదా ‘వారి ఎదుట’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘బయలుదేరడం, రావడం, వారిని బయటికి నడిపించడం, లోపలికి తీసుకురావడం’ అనే వరుస మాటలు ప్రజల కార్యకలాపాలన్నిటిలో సమగ్రంగా నాయకత్వం వహించడాన్ని తెలిపే హీబ్రూ విధానం.
    reason: cultural_note
lexical_decisions:
- source_word: לִפְנֵיהֶם
  choice: వారి ముందుగా
  rationale: ‘వారి సన్నిధిలో/ముందు’ అనే మూలార్థాన్ని, నాయకుడు ప్రజలకు ముందుండే భావంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יֵצֵא ... יָבֹא
  choice: బయలుదేరి ... తిరిగి వచ్చేవాడు
  rationale: పరస్పరపూరకమైన గమన క్రియలను నిలుపుతూ, ప్రజా నాయకత్వపు సమగ్రతను సూచించే హీబ్రూ ప్రయోగాన్ని కాపాడుతుంది.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: వారిని బయటికి నడిపించి ... లోపలికి తీసుకువచ్చేవాడు
  rationale: హిఫిల్ కారణార్థక రూపాలను వ్యక్తం చేస్తూ, యాంత్రికంగా ‘తీసుకుపోవడం’ కంటే వ్యక్తిగత నాయకత్వ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עֲדַת יְהוָה
  choice: యాహ్వే సమాజం
  rationale: עֵדָה ఇక్కడ కూడిన నిబంధన ప్రజలను సూచిస్తుంది; יְהוָהను బిరుదుతో మార్చకుండా దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: כַצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: కాపరి లేని గొర్రెల్లా
  rationale: నాయకత్వాన్ని గొర్రెల కాపరితనంతో పోల్చే స్పష్టమైన రూపకాన్ని సహజమైన తెలుగులో యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: బయలుదేరడం–తిరిగి రావడం అనే నాయకత్వ ప్రయోగం
  choice: చలనాన్ని సూచించే స్పష్టమైన భాషను నిలిపి ఉంచడం
  alternative: ‘వారిని పరిపాలించేవాడు’ అని అమూర్తంగా సంక్షిప్తీకరించడం
  rationale: మూలంలోని వరుస క్రియలు సమగ్ర ప్రజా నాయకత్వాన్ని సూచించినప్పటికీ, వాటిని అమూర్తీకరించకుండా ఉంచడం తరువాతి కాపరి రూపకంతో ఉన్న సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వచనం మునుపటి వచనంలో ప్రారంభమైన మోషే అభ్యర్థనకు కొనసాగింపు కావడంతో, తెలుగులో వాక్యసంపూర్ణత కోసం ‘నియమించు’ అనే సందర్భసిద్ధ క్రియను చేర్చాం; అది 16వ వచనంలోని నియామక అభ్యర్థననుంచి గ్రహించబడింది.
