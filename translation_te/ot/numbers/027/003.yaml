review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the father's death in the wilderness, his nonparticipation in Korah's faction assembled against Yahweh, and his lack of sons. However, «కారణంగానే» adds an emphatic/exclusive nuance (“precisely/only because”) not expressed by בְּחֶטְאוֹ. A non-emphatic causal rendering better preserves the Hebrew's stated but unspecified connection to his sin.
  naturalness: The Telugu is clear, modern, and appropriately dignified. The revised wording remains natural while avoiding added emphasis.
  terminology: «అరణ్యం», «సమూహం», «యెహోవా», and «కుమారులు» are suitable modern-standard Telugu choices. «కోరహు» is retained as the established Telugu form of Korah.
  issues:
  - severity: low
    issue: Unwarranted emphasis in «తన పాపం కారణంగానే»
    rationale: The emphatic particle «నే» is not represented in the Hebrew. The verse contrasts his death with participation in Korah's rebellion, but does not explicitly say that his death was exclusively or precisely because of his sin.
  revised_text: “మా తండ్రి అరణ్యంలో చనిపోయాడు. యెహోవాకు వ్యతిరేకంగా కూడిన కోరహు సమూహంలో అతడు లేడు; తన పాపం కారణంగా[a] చనిపోయాడు. అతనికి కుమారులు లేరు.”
