- from: “మా తండ్రి అరణ్యంలో చనిపోయాడు. యెహోవాకు వ్యతిరేకంగా కూడిన కోరహు సమూహంలో అతడు లేడు; తన పాపం కారణంగానే[a] చనిపోయాడు. అతనికి కుమారులు లేరు.”
  to: “మా తండ్రి అరణ్యంలో చనిపోయాడు. యెహోవాకు వ్యతిరేకంగా కూడిన కోరహు సమూహంలో అతడు లేడు; తన పాపం కారణంగా[a] చనిపోయాడు. అతనికి కుమారులు లేరు.”
