source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: te
  text: “మా తండ్రి అరణ్యంలో చనిపోయాడు. యెహోవాకు వ్యతిరేకంగా కూడిన కోరహు సమూహంలో అతడు లేడు; తన పాపం కారణంగా[a] చనిపోయాడు. అతనికి కుమారులు లేరు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పాపంలో చనిపోయాడు.” హీబ్రూ పదబంధం అతని పాపం ఏమిటో చెప్పదు; అతడు కోరహు తిరుగుబాటులో భాగంగా చనిపోలేదని మాత్రమే స్పష్టం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: మా తండ్రి
  rationale: మాట్లాడుతున్న కుమార్తెలకు ప్రత్యక్ష కుటుంబ సంబంధాన్ని సూచిస్తుంది; ‘పూర్వికుడు’ అనే విస్తృత అర్థం ఇక్కడ తగదు.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు అరణ్య సంచార నేపథ్యాన్ని సహజంగా, సంప్రదాయబద్ధంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הָעֵדָה הַנּוֹעָדִים
  choice: కూడిన ... సమూహంలో
  rationale: ‘మధ్యలో/వారిలో’ అనే בְּתוֹךְ భావాన్ని తెలుగులో సహజమైన స్థానవాచక నిర్మాణంతో వ్యక్తం చేస్తూ, עֵדָה యొక్క సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: యెహోవాకు వ్యతిరేకంగా కూడిన
  rationale: నిఫాల్ కృదంతంలోని సమష్టిగా కూడడం అనే భావాన్నీ, עַל ద్వారా వ్యక్తమయ్యే ప్రతికూలతనూ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: בַּעֲדַת קֹרַח
  choice: కోరహు సమూహంలో
  rationale: కోరహుతో సంబంధమున్న నిర్దిష్ట తిరుగుబాటు వర్గాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఉంటుంది.
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: తన పాపం కారణంగానే చనిపోయాడు
  rationale: כִּי యొక్క వివరణాత్మక-వ్యతిరేక సంబంధాన్నీ, בְ యొక్క సాధ్యమైన కారణార్థాన్నీ తెలియజేస్తుంది; ‘తన’ అనేది మూడవ పురుష ఏకవచన ప్రత్యయాన్ని, కోరహు తిరుగుబాటుతో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: అతనికి కుమారులు లేరు
  rationale: היה + לְ నిర్మాణానికి సహజమైన తెలుగు రూపం; వారసత్వ సందర్భానికి ముఖ్యమైన ‘కుమారులు’ అనే పురుష సంతాన సూచనను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణను ఉపయోగించాం.
- issue: వ్యక్తిగత పాపం మరియు కోరహు సమూహపు తిరుగుబాటు మధ్య వ్యత్యాసం
  choice: తన పాపం కారణంగానే చనిపోయాడు
  alternative: తన పాపంలో చనిపోయాడు
  rationale: అతడు కోరహు తిరుగుబాటులో భాగం కాదని, అయినా తన పాపంతో సంబంధించి చనిపోయాడని వాక్యం వేరు చేస్తుంది. ఏ నిర్దిష్ట పాపమో పాఠ్యం చెప్పనందున దానిని చేర్చలేదు; בְ యొక్క ప్రత్యామ్నాయ సమీప అనువాదాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. హీబ్రూ వాక్యంలోని వ్యత్యాసాన్ని సెమీకోలన్‌తో స్పష్టపరిచాం; మూలంలో లేని నిర్దిష్ట పాపాన్ని లేదా సిద్ధాంత వివరణను చేర్చలేదు.
