source:
  edition: WLC
  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: te
  text: “మా తండ్రికి కుమారుడు లేడనే కారణంతో ఆయన పేరు ఆయన వంశం మధ్యనుండి ఎందుకు తొలగిపోవాలి?[a] మా తండ్రి సోదరుల మధ్య మాకు భూమిలో ఒక వాటా ఇవ్వండి.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తగ్గిపోవాలి” లేక “తీసివేయబడాలి.” కుమారుడు లేనందువల్ల తమ తండ్రి ‘పేరు’ ఆయన వంశంలో నుండి తొలగిపోవడం ఎందుకని హీబ్రూ పాఠం ప్రశ్నిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: “భూమిలో ఒక వాటా” అంటే వంశానికి కేటాయించిన భూమిలో వారసత్వంగా లభించే స్వాస్థ్య భాగం.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు ... పోవాలి?
  rationale: ఇది అభ్యంతర భావంతో కూడిన అలంకారప్రశ్న. ఆధునిక తెలుగులో ‘ఎందుకు ... పోవాలి?’ ఆ ప్రశ్ననూ నిరసన స్వరాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִגָּרַע
  choice: తొలగిపోవాలి
  rationale: גרע నిఫల్ రూపం ఇక్కడ వంశపు పరిధిలో తండ్రి పేరు కోల్పోవడాన్ని సూచిస్తుంది. ‘తొలగిపోవాలి’ నష్టభావాన్ని తెలియజేస్తూ, ‘తగ్గిపోవాలి’ అనే ప్రత్యామ్నాయ అర్థానికి సూచనను పాదసూచికలో ఉంచుతుంది.
- source_word: שֵׁם
  choice: పేరు
  rationale: హీబ్రూ రూపకాన్ని యథాతథంగా నిలుపుతుంది; సందర్భంలో ఇది వంశంలో తండ్రి జ్ఞాపకం, స్థానం, వారసత్వ కొనసాగింపును సూచిస్తుంది.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: ఆయన వంశం మధ్యనుండి
  rationale: భూవిభజన సందర్భంలో מִשְׁפָּחָה విస్తృత గోత్రంలోని వంశ సమూహాన్ని సూచిస్తుంది. ‘వంశం’ సాధారణ తెలుగు పాఠకునికి సహజంగా ఉండి కుటుంబశాఖ భావాన్ని అందిస్తుంది.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: మా తండ్రికి కుమారుడు లేడనే కారణంతో
  rationale: మూలంలోని పురుషలింగ వారసత్వ పదాన్ని ‘కుమారుడు’గా నిలుపుతూ, మరణించిన తండ్రి గురించి కుమార్తెలు మాట్లాడుతున్న కథన సందర్భానికి సహజమైన తెలుగు నిర్మాణాన్ని వాడింది.
- source_word: תְּנָה לָּנוּ
  choice: మాకు ... ఇవ్వండి
  rationale: ప్రత్యక్షమైన ఆజ్ఞార్థక విజ్ఞప్తిని గౌరవప్రదమైన ఆధునిక తెలుగు బహువచన రూపంలో తెలియజేస్తుంది.
- source_word: אֲחֻזָּה
  choice: ఒక భూవాటా
  rationale: ఇక్కడ పదం వంశానికి కేటాయించిన భూమిలో చట్టబద్ధమైన స్వాస్థ్య భాగాన్ని సూచిస్తుంది. ‘భూవాటా’ సాధారణ ‘ఆస్తి’కన్నా భూమి కేటాయింపు భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: మా తండ్రి సహోదరుల మధ్య
  rationale: హీబ్రూలోని నిర్దిష్ట పురుష సంబంధాన్ని విశాలమైన ‘బంధువులు’గా మార్చకుండా నిలుపుతుంది; ‘సహోదరులు’ గౌరవప్రదమైన ప్రామాణిక తెలుగు.
theological_decisions:
- issue: లింగ-నిర్దిష్ట వారసత్వ భాష
  choice: కుమారుడు / మా తండ్రి సహోదరులు
  alternative: సంతానం / బంధువులు
  rationale: హీబ్రూ పాఠం వారసత్వ సమస్యను కుమారుడు మరియు తండ్రి సహోదరుల పరంగా స్పష్టంగా చెబుతుంది. అందువల్ల లింగ-నిర్దిష్టతను తటస్థీకరించలేదు.
- issue: తండ్రి ‘పేరు’ కోల్పోవడం
  choice: పేరు ... తొలగిపోవాలి
  alternative: వంశం అంతరించిపోవాలి
  rationale: ‘పేరు’ అనే మూల రూపకాన్ని నిలిపి, దాని భావాన్ని ఒకే విధంగా సిద్ధాంతీకరించలేదు; ఇది జ్ఞాపకం, వంశస్థానం, వారసత్వ హక్కు వంటి పరస్పర సంబంధిత భావాలను మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విజ్ఞప్తి స్వరం వాడబడింది. ‘వంశం,’ ‘సహోదరులు,’ ‘భూవాటా’ పదాలు ప్రాచీన ఇశ్రాయేలు వారసత్వ సందర్భాన్ని స్పష్టంగా ఉంచుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపికయ్యాయి. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
