  to: “మా తండ్రికి కుమారుడు లేడనే కారణంతో ఆయన పేరు ఆయన వంశం మధ్యనుండి ఎందుకు తొలగిపోవాలి?[a] మా తండ్రి సోదరుల మధ్య మాకు భూమిలో ఒక వాటా ఇవ్వండి.”[b]
