id: NUM.27.13
reference: Numbers 27:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: te
  text: నీవు దానిని చూసిన తర్వాత, నీ సోదరుడైన అహరోను చేర్చబడినట్లే, నీవు కూడా నీ ప్రజలలో చేర్చబడతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే, ‘నీవు చనిపోతావు’ లేదా ‘నీ పూర్వీకుల వద్దకు చేర్చబడతావు.’ హీబ్రూ నుడికారానికి అక్షరార్థం, ‘నీ ప్రజలలో చేర్చబడతావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  choice: నీవు దానిని చూసిన తరువాత
  rationale: ראה యొక్క ఖల్ ద్వితీయ పురుష ఏకవచన రూపం ముందున్న దేశాన్ని చూడమనే ఆజ్ఞకు అనుసంధానమై ఉంది. అందువల్ల సంఘటనల క్రమాన్ని సహజమైన తెలుగులో తెలిపేందుకు ‘చూసిన తరువాత’ అని అనువదించాం; אֹתָהּ లోని స్త్రీలింగ ఏకవచన కర్మప్రత్యయం సందర్భంలోని దేశాన్ని సూచిస్తుంది.
- source_word: וְנֶאֱסַפְתָּ אֶל־עַמֶּיךָ
  choice: నీ ప్రజల దగ్గరకు చేర్చబడతావు
  rationale: אסף నిఫల్ రూపం ఇక్కడ మరణించి తనవారితో చేరడాన్ని సూచించే హీబ్రూ నుడికారం. కేవలం ‘చనిపోతావు’ అని భావాన్ని కుదించకుండా, మూలంలోని కుటుంబసంబంధమైన ప్రతీకను నిలిపాం.
- source_word: גַּם אָתָּה
  choice: నీవు కూడా
  rationale: మోషే కూడా అహరోను పొందిన అదే గమ్యాన్ని పొందుతాడనే ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר נֶאֱסַף
  choice: చేర్చబడినట్లే
  rationale: అహరోనుతో పోలికను స్పష్టంగా చూపుతూ, రెండు చోట్లా ఉన్న אסף అనే ఒకే క్రియకు అనువాద సారూప్యతను కాపాడుతుంది.
- source_word: אַהֲרֹן אָחִיךָ
  choice: నీ సహోదరుడైన అహరోను
  rationale: బంధుత్వ పదాన్ని నిలిపి, ఆధునిక ప్రామాణిక తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అందించాం.
theological_decisions:
- issue: אסף אל־עמיו అనే మరణ నుడికారాన్ని ఎలా అనువదించాలి
  choice: ‘తన/నీ ప్రజల దగ్గరకు చేర్చబడుట’ అనే మూల ప్రతీకను నిలుపుట
  alternative: ‘చనిపోవుట’ లేదా ‘పూర్వీకుల దగ్గరకు చేర్చబడుట’
  rationale: మూల హీబ్రూ కేవలం మరణాన్ని చెప్పకుండా, వ్యక్తి తన ప్రజలతో చేరడమనే కుటుంబ-సమాజ ప్రతీకను ఉపయోగిస్తుంది. దానిని నిలపడం వాక్యంలోని సాహిత్య, ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది; అయితే మరణానంతర స్థితి గురించి మూలం చెప్పనిదాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మరణాన్ని సూచించే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో కాపాడి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
