translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘స్వాస్థ్యం’ వారసత్వ ఆస్తి భావాన్ని నిలుపుతుంది; ప్రధాన పాఠంలో బంధుత్వ నిర్మాణాన్ని అక్షరార్థానికి దగ్గరగా ఉంచి, వాడుక రూపాన్ని పాదసూచికలో ఇచ్చాం.
