  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: te
  text: అయితే అతనికి అన్నదమ్ములు లేకపోతే, అతని స్వాస్థ్యాన్ని అతని తండ్రి అన్నదమ్ములకు ఇవ్వాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత వాడుక భాషలో, “అతని పినతండ్రులు, పెదతండ్రులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... లేకపోతే
  rationale: న్యాయపరమైన వరుసలో తదుపరి పరిస్థితిని షరతుగా, స్వల్ప వ్యత్యాసంతో పరిచయం చేస్తుంది.
- source_word: אֵין לוֹ אַחִים
  choice: అతనికి అన్నదమ్ములు లేకపోతే
  rationale: హీబ్రూ అస్తిత్వ-నిరాకరణను తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో అనువదించింది; אַחִים ఇక్కడ పురుష సహోదరులను సూచిస్తుంది.
- source_word: וּנְתַתֶּם
  choice: ఇవ్వాలి
  rationale: సమాజానికి లేదా బాధ్యతగల అధికారులకు ఇచ్చిన బహువచన న్యాయ ఆదేశాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: נַחֲלָתוֹ
  choice: అతని స్వాస్థ్యాన్ని
  rationale: న్యాయ సందర్భంలో వారసత్వంగా సంక్రమించే ఆస్తి లేదా వంశపారంపర్య భాగాన్ని సూచించే స్థిరమైన తెలుగు పదం.
- source_word: לַאֲחֵי אָבִיו
  choice: అతని తండ్రి అన్నదమ్ములకు
  rationale: మూలంలోని ‘అతని తండ్రి సహోదరులకు’ అనే కుటుంబ సంబంధ నిర్మాణాన్ని దగ్గరగా కాపాడుతుంది.
