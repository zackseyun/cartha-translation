  text: וַ/יִּסְמֹ֧ךְ אֶת יָדָ֛י/ו עָלָ֖י/ו וַ/יְצַוֵּ֑/הוּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: te
  text: అతడు తన చేతులను అతనిమీద ఉంచి, యెహోవా మోషే ద్వారా[b] చెప్పినట్లే అతనికి ఆదేశమిచ్చాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతనికి ఆజ్ఞాపించాడు’ లేదా, ఈ సందర్భంలో, ‘అతనికి బాధ్యత అప్పగించాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ఆజ్ఞ ఇవ్వడాన్ని సూచించగలదు; ఇక్కడ అది యెహోషువను అధికారికంగా నాయకత్వ బాధ్యతలో ఉంచే సందర్భంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘మోషే చేతి ద్వారా.’ ఇది యెహోవా మోషేను తన ప్రతినిధిగా ఉపయోగించి చెప్పాడనే భావమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: అతని మీద తన చేతులు ఉంచి
  rationale: సמך అనే క్రియ చేతులను ఒక వ్యక్తి మీద ఉంచే ఆచారసంబంధ చర్యను సూచిస్తుంది. మూలంలోని బహువచనమైన ‘చేతులు’ను, עַל యొక్క సహజ భావమైన ‘మీద’ను యథాతథంగా నిలుపుతుంది.
- source_word: וַיְצַוֵּהוּ
  choice: అతనికి ఆదేశమిచ్చాడు
  rationale: צוה సాధారణంగా ఆజ్ఞాపించడం లేదా ఆదేశించడం అనే అర్థం ఇస్తుంది. ఈ సందర్భంలో యెహోషువకు నాయకత్వ బాధ్యత అప్పగించే అధికారిక చర్య కూడా అంతర్భూతంగా ఉంది; ‘ఆదేశమిచ్చాడు’ ఆ రెండు భావాల మధ్య ఉన్న ఉద్వేగాన్ని అతిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లే
  rationale: మోషే చేసినది యెహోవా ముందుగా చెప్పినదానికి సరిగ్గా అనుగుణమని తెలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మోషే యెహోవా సందేశాన్ని అందించిన సాధనమని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మోషే ద్వారా’ అదే కార్యసాధక భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యెహోషువ నియామక సందర్భంలో צוה క్రియ భావం
  choice: అతనికి ఆదేశమిచ్చాడు
  alternative: అతనిని బాధ్యతకు నియమించాడు / అతనికి ఆజ్ఞాపించాడు
  rationale: సందర్భం అధికారిక నాయకత్వ బాధ్యత అప్పగింపును సూచించినా, క్రియ యొక్క ప్రత్యక్ష అర్థం ఆజ్ఞ లేదా ఆదేశం ఇవ్వడం. ప్రధాన పాఠంలో విస్తృతమైన ‘ఆదేశమిచ్చాడు’ను ఉంచి, నియామక సందర్భాన్ని పాదసూచికలో వివరిస్తుంది; తద్వారా తరువాతి మతపరమైన అభిషేక లేదా దీక్ష భావాలను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘చేతులు ఉంచి’ అనే ఆచారసంబంధ చర్యను స్పష్టంగా నిలిపి, ‘మోషే ద్వారా’ అనే సహజ ప్రయోగంతో హీబ్రూ నుడికారపు భావాన్ని అందించింది. భాష గౌరవప్రదంగా ఉన్నప్పటికీ పాతకాలపు లేదా మతశాఖకు ప్రత్యేకమైన పదజాలాన్ని నివారించింది.
