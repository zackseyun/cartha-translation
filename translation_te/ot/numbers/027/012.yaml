source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “అబారీము పర్వతంలోని ఈ కొండపైకి ఎక్కి[a], నేను ఇశ్రాయేలు కుమారులకు ఇచ్చిన దేశాన్ని చూడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అబారీముల ఈ కొండపైకి” లేదా “అబారీము యొక్క ఈ కొండపైకి.” దీనిని “అబారీము పర్వతప్రాంతంలోని ఈ కొండ” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ הַר הָעֲבָרִים నిర్మాణం అక్షరార్థంగా “అబారీముల కొండ”; అబారీము స్థలనామం/పర్వతప్రాంతంతో కొండకు ఉన్న సంబంధాన్ని తెలుగులో వ్యక్తం చేసే విధానంలో పదబంధ వైవిధ్యం ఉంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కాన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపే క్రమార్థాన్ని ఆధునిక తెలుగు కథనశైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲלֵה
  choice: పైకి ఎక్కి
  rationale: עלה ఆజ్ఞారూపంలోని పైకి వెళ్లే భావాన్ని సహజంగా తెలియజేస్తుంది; తరువాతి וּרְאֵהతో కలిపి తెలుగు వరుస ఆజ్ఞ నిర్మాణంగా ఇచ్చాం.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: ఈ అబారీము కొండ
  rationale: עֲבָרִיםను స్థలనామంగా లిప్యంతరీకరించి, הַזֶּה సూచనార్థాన్ని ‘ఈ’తో నిలిపాం. తెలుగు సహజ పదక్రమం కోసం ‘అబారీము కొండ’ అని ఇచ్చాం.
- source_word: וּרְאֵה
  choice: చూడు
  rationale: ראה ఆజ్ఞారూపాన్ని నేరుగా, గౌరవప్రదమైన సాధారణ తెలుగులో అనువదించాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ ఇశ్రాయేలుకు అనుగ్రహించిన భూభాగాన్ని సూచిస్తున్నందున ‘దేశం’ సహజమైన సందర్భోచిత సమానార్థకం.
- source_word: נָתַתִּי
  choice: ఇచ్చిన
  rationale: హీబ్రూ పరిపూర్ణ క్రియ సూచించే స్థిరమైన దైవానుగ్రహాన్ని తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా నిలిపింది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: ఈ స్థిర జాతివాచక ప్రయోగంలో בני అక్షరార్థంగా కేవలం పురుష సంతానాన్ని కాక సమస్త ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో అర్థస్పష్టమైన ‘ప్రజలు’ను ఎంచుకున్నాం.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా కాపాడుతుంది; ఒక ప్రత్యేక సంఘ సంప్రదాయపు రూపాన్ని బలవంతంగా రుద్దదు.
- issue: בני ישראל యొక్క సామూహిక అర్థం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు; ఇశ్రాయేలీయులు
  rationale: మూల రూపం వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ, ఈ సందర్భంలో జాతి సమాజమంతటినీ సూచిస్తుంది. ‘ప్రజలు’ ఆ పరిధిని సహజంగా, తప్పుదారి పట్టించకుండా అందిస్తుంది.
- issue: נתתי యొక్క కాల-దృష్టి
  choice: ఇచ్చిన
  alternative: ఇచ్చాను; ఇస్తున్న
  rationale: దైవానుగ్రహం పూర్తయినదిగా చెప్పే హీబ్రూ పరిపూర్ణ రూపాన్ని నిలుపుతూ, అది భౌతిక స్వాధీనత అంతా అప్పటికే పూర్తయిందని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. ‘యాహ్వే’ను నామంగా నిలిపాం; ‘ఇశ్రాయేలు ప్రజలు’తో జాతివాచక సమగ్రతను స్పష్టం చేశాం. ప్రధాన వాక్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
