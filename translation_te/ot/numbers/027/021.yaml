source:
  edition: WLC
  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: te
  text: అతడు యాజకుడైన ఎలియాజరు ఎదుట నిలబడాలి. ఎలియాజరు అతని కోసం యెహోవా సన్నిధిలో ఊరీము తీర్పు ద్వారా విచారణ చేయాలి.[a] అతని ఆజ్ఞ ప్రకారం వారు బయలుదేరాలి; అతని ఆజ్ఞ ప్రకారం వారు రావాలి—అతడూ, అతనితో ఉన్న ఇశ్రాయేలీయులందరూ, అంటే సమాజమంతా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఊరీము నిర్ణయం ద్వారా.” ఈ మాట యెహోవా సన్నిధిలో ఊరీము ద్వారా యాజకుడు చేసే విచారణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఇశ్రాయేలు కుమారులందరూ”; అంటే ఇశ్రాయేలీయులందరూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: ఎదుట / సన్నిధిలో
  rationale: వ్యక్తి ఎదుట నిలబడటానికి ‘ఎదుట’, యెహోవా సమక్షంలో యాజక విచారణకు ‘సన్నిధిలో’ సహజమైన ఆధునిక తెలుగు రూపాలు.
- source_word: יַעֲמֹד
  choice: నిలబడాలి
  rationale: నియామక సందర్భంలోని ఆదేశార్థక భావాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: וְשָׁאַל לוֹ
  choice: ఎలియాజరు అతని కోసం ... విచారణ చేయాలి
  rationale: సందర్భం ప్రకారం కర్త ఎలియాజరు; ‘అతని కోసం’ యెహోషువ పక్షంగా చేసే యాజక విచారణను స్పష్టం చేస్తుంది.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: ఊరీము తీర్పు ద్వారా
  rationale: మִשְׁפָּט‌లోని నిర్ణయాత్మక/న్యాయపరమైన భావాన్ని ‘తీర్పు’ నిలుపుతుంది; ఊరీము సాంకేతిక యాజక పదం కావడంతో లిప్యంతరీకరించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: עַל פִּיו
  choice: అతని ఆజ్ఞ ప్రకారం
  rationale: ‘అతని నోటి ప్రకారం’ అనే హీబ్రూ నుడికారంలోని అధికారిక నిర్దేశ భావాన్ని సహజంగా తెలియజేస్తూ, సర్వనామ సూచనలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: బయలుదేరాలి ... తిరిగి రావాలి
  rationale: సమాజం లేదా సైన్యం నాయకత్వంలో వెళ్లి రావడాన్ని సూచించే జత నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’కు బదులు సందర్భంలోని ఇశ్రాయేలు ప్రజల సమగ్ర సమూహాన్ని సహజంగా తెలియజేస్తుంది; మూలరూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: הָעֵדָה
  choice: సమాజమంతా
  rationale: నిబంధన సమాజమంతటినీ సూచించే సమూహార్థాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘అతని ఆజ్ఞ ప్రకారం’లోని సర్వనామ సూచన
  choice: ఏకవచన ‘అతని’ని అలాగే ఉంచి, దాని పూర్వపదాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టంగా పేర్కొనలేదు.
  alternative: ఎలియాజరు ఆజ్ఞ ప్రకారం; లేదా యెహోషువ ఆజ్ఞ ప్రకారం; లేదా ఊరీము ద్వారా లభించిన యెహోవా నిర్ణయం ప్రకారం అని వివరణాత్మకంగా అనువదించడం.
  rationale: హీబ్రూ వాక్యం తక్షణ పూర్వపదాన్ని సంక్షిప్తంగా ఉంచుతుంది. అనువాదం ఆ ఉద్దేశపూర్వక అస్పష్టతను తొలగించకుండా అధికార పరంపరలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ఆదేశ భావానికి ‘నిలబడాలి/చేయాలి’, సమూహ కదలికకు ‘బయలుదేరాలి/తిరిగి రావాలి’ వాడబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
