  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: te
  text: “సెలోపెహాదు కుమార్తెలు చెప్పిన మాట సరైనదే.[a] వారి తండ్రి సోదరుల మధ్య వారికి వారసత్వ భూస్వాస్థ్యాన్ని తప్పక ఇవ్వాలి; వారి తండ్రి వారసత్వాన్ని వారికి బదిలీ చేయాలి.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదబంధానికి అక్షరార్థం: “సెలోపెహాదు కుమార్తెలు సరిగ్గా మాట్లాడుతున్నారు.”'
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యంలో “వారికి” అనే పదానికి హీబ్రూ పాఠంలో ఒకచోట పుంలింగ బహువచన ప్రత్యయం ఉంది; అయితే సందర్భంలో అది సెలోపెహాదు కుమార్తెలనే సూచిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: చెప్పేది సరైనదే
  rationale: న్యాయపరమైన సందర్భంలో కుమార్తెల వాదన సరైనదని అంగీకరించే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘సరిగ్గా మాట్లాడుతున్నారు’ అనే మూల రూపాన్నీ పాదసూచికలో నిలుపుతుంది.
- source_word: נָתֹן תִּתֵּן
  choice: తప్పక ఇవ్వాలి
  rationale: క్రియతో కూడిన infinitive absolute ఆజ్ఞను బలపరుస్తుంది. ‘తప్పక’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: వారసత్వపు స్వాస్థ్యం
  rationale: ఈ నిర్మాణంలో ఉన్న వారసత్వం మరియు స్థిరమైన ఆధీన ఆస్తి అనే రెండు భావాలను ‘వారసత్వపు స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: వారి తండ్రి సహోదరుల మధ్య
  rationale: తండ్రి వంశంలోని సహోదరుల కేటాయింపుల మధ్య కుమార్తెలకు భాగం ఇవ్వాలనే స్థలిక, కులపరమైన భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וְהַעֲבַרְתָּ
  choice: సంక్రమింపజేయాలి
  rationale: హిఫీల్ రూపంలోని ఆస్తిని ఒకరి నుంచి మరొకరికి చట్టబద్ధంగా బదిలీ చేయించే భావాన్ని వారసత్వ సందర్భానికి సహజమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: వారి తండ్రి వారసత్వం
  rationale: మరణించిన తండ్రికి చెందిన వారసత్వ ఆస్తి అనే కుటుంబ, న్యాయ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: హీబ్రూ రూపంలో పుంలింగ బహువచన ప్రత్యయం ఉన్నప్పటికీ సందర్భంలోని సూచితులు సెలోపెహాదు కుమార్తెలే; తెలుగు రూపం లింగభేదం చూపనందున ‘వారికి’ సందర్భాన్నీ మూలరూపంలోని సంఖ్యనూ సహజంగా ప్రతిబింబిస్తుంది.
