translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ/వారసత్వ శైలిని ఉపయోగించాం. మూలంలోని ఆజ్ఞాబలాన్ని ‘తప్పక’తో, చట్టబద్ధమైన బదిలీ భావాన్ని ‘సంక్రమింపజేయాలి’తో వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
