source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “అతనిలో ఆత్మ ఉన్న మనిషియైన నూను కుమారుడైన యెహోషువను తీసుకో; అతని మీద నీ చెయ్యి ఉంచు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ రూపానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: קַח לְךָ
  choice: తీసుకో
  rationale: లְךָ కలిగిన హీబ్రూ ఆజ్ఞారూపం ఇక్కడ సహజమైన తెలుగు వాడుకలో ‘తీసుకో’ అని సరిపోతుంది; ‘నీ కోసం’ అని చేరిస్తే అవసరం లేని భావం కలగవచ్చు.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: పేర్లను తెలుగు సంప్రదాయ రూపాల్లో ఉంచి, హీబ్రూ పుత్రసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో తెలిపాం.
- source_word: אִישׁ
  choice: మనిషి
  rationale: హీబ్రూ పదంలోని పురుష ఏకవచన భావాన్ని లింగతటస్థ పదంతో చెరపకుండా స్పష్టంగా నిలిపాం.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: తనలో ఆత్మ ఉన్న
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల అది దేవుని ఆత్మను సూచిస్తుందా, సాధారణ జీవాత్మ లేదా అంతర్గత సామర్థ్యాన్ని సూచిస్తుందా అన్న అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: అతని మీద నీ చెయ్యి ఉంచు
  rationale: చెయ్యి ఉంచే నియామక చర్యను సహజమైన తెలుగులో తెలిపి, హీబ్రూలో ఉన్న ఏకవచన ‘చెయ్యి’ని నిలిపాం.
theological_decisions:
- issue: רוּחַ అనే పదం దేవుని ఆత్మను సూచిస్తుందా లేక సాధారణంగా ఆత్మను సూచిస్తుందా
  choice: ఆత్మ
  alternative: దేవుని ఆత్మ
  rationale: హీబ్రూ పాఠ్యంలో నిర్దిష్ట ఉపపదం లేదు. సందర్భం దేవుని అనుగ్రహించిన నాయకత్వ సామర్థ్యాన్ని సూచించవచ్చుగానీ, ప్రధాన పాఠ్యంలో ‘దేవుని’ అని చేర్చడం మూలంలోని నిజమైన అస్పష్టతను పరిష్కరించినట్లవుతుంది; అందువల్ల ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా చిన్న వాక్యాలుగా రూపొందించాం. దైవ నామాన్ని ‘యాహ్వే’గా ఉంచాం; నియామక సందర్భానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం.
