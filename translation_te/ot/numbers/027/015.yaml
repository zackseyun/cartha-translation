  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: te
  text: 'అప్పుడు మోషే యహ్వేతో[a] ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: ‘YHWH’; దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు హెబ్రీ రూపం, ప్రత్యామ్నాయ లిప్యంతరీకరణ, సంప్రదాయ అనువాదం తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది. తరువాత לֵאמֹר ఉన్నందున, ‘ఇలా అన్నాడు’ అనే సమగ్ర మాటల పరిచయం సహజంగా ఉంటుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడబడుతున్న వ్యక్తిని తెలుగులో సహజంగా సూచించే విభక్తి; ఇక్కడ మోషే తన మాటలను యెహోవాకు ఉద్దేశిస్తున్నాడు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ ఇన్ఫినిటివ్ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. హెబ్రీ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, వַיְדַבֵּר ... לֵאמֹר అనే సంయుక్త మాటల పరిచయాన్ని తెలుగులో సహజమైన ‘ఇలా అన్నాడు’గా ఇచ్చాం.
