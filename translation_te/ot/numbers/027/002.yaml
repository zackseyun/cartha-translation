source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: te
  text: 'వారు మోషే ఎదుట, యాజకుడైన ఎలియాజరు ఎదుట, నాయకుల ఎదుట, సమాజమంతటి ఎదుట సమాగమ గుడారపు ప్రవేశద్వారం దగ్గర నిలబడి ఇలా అన్నారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: వారు ... నిలబడి
  rationale: עמד క్రియ యొక్క స్త్రీలింగ బహువచన రూపం వారు అధికారికంగా వచ్చి నిలబడిన భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘నిలబడి’ అని అనువదించాం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: అధికారుల సమక్షంలో తమ విన్నపాన్ని ఉంచిన బహిరంగ న్యాయపర సందర్భాన్ని ‘ఎదుట’ స్పష్టంగా నిలుపుతుంది; మూలంలోని పునరుక్తిని కూడా కాపాడుతుంది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: హీబ్రూ వచనం ‘యాజకుడు’ అని మాత్రమే చెబుతుంది; ‘ప్రధాన యాజకుడు’ అనే విస్తరణను చేర్చలేదు. పేరును తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַנְּשִׂיאִם
  choice: నాయకులు
  rationale: ఇక్కడ గోత్ర లేదా సమాజ అధికారులను సూచిస్తుంది. ‘నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, రాజవంశ సంబంధమైన ‘రాజకుమారులు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: כָל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలు సమూహ సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతా’ כָּל యొక్క సంపూర్ణతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח‌కు ‘ప్రవేశద్వారం దగ్గర’ స్థలార్థాన్ని స్పష్టంగా ఇస్తుంది. אֹהֶל מוֹעֵד‌కు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ప్రత్యక్షపు గుడారం’ను ఎంచుకున్నాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నారు:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష మాటలను పరిచయం చేసే సూత్రప్రయోగం. తెలుగు కథన ప్రవాహంలో ‘ఇలా అన్నారు:’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కుమార్తెల విజ్ఞప్తి జరిగిన బహిరంగ న్యాయపర సందర్భం
  choice: ‘ఎదుట’ అనే పదాన్ని ప్రతి వర్గం ముందు పునరావృతం చేసి, అధికారులూ సమాజమూ కలిగిన పూర్తి జాబితాను నిలుపడం
  alternative: జాబితాను సంక్షిప్తం చేసి ఒకే ‘ఎదుట’తో చెప్పడం
  rationale: మోషే, యాజకుడైన ఎలియాజరు, నాయకులు, సమాజమంతా అనే బహిరంగ వేదికను మూలవచనం ఉద్దేశపూర్వకంగా నొక్కి చెబుతుంది. దానిని సంక్షిప్తం చేయకుండా న్యాయపరమైన, సామూహికమైన గంభీరతను కాపాడాం.
- issue: עֵדָה అనువాదం
  choice: సమాజం
  alternative: సభ
  rationale: ‘సమాజం’ ఇక్కడ కేవలం సమావేశాన్ని కాక ఇశ్రాయేలు సమూహ ప్రజలను సూచిస్తుంది. అయినా దానిలో అదనపు సంఘసంబంధ సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: אֹהֶל מוֹעֵד అనువాదం
  choice: ప్రత్యక్షపు గుడారం
  alternative: సమావేశపు గుడారం
  rationale: హీబ్రూ పదబంధం సమావేశ స్థలాన్ని సూచించినా, తెలుగు బైబిలు పాఠకులకు ‘ప్రత్యక్షపు గుడారం’ సుపరిచితమైన ఆరాధనా స్థలపేరు. ఇది ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘ఎదుట’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ఈ వచనం ముందు వచనంలోని స్త్రీలను సూచిస్తున్నందున తెలుగు క్రియలో లింగం వ్యక్తం కాకపోయినా ‘వారు’ సందర్భానుసారంగా సరిపోతుంది.
