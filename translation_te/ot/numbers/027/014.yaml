source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: te
  text: ఎందుకంటే, సీను అరణ్యంలో సమాజపు వివాదంలో, వారి కళ్ల ఎదుట ఆ నీళ్ల దగ్గర నన్ను పరిశుద్ధునిగా కనబరచకుండా మీరు నా ఆజ్ఞకు తిరుగుబాటు చేశారు.[a] అవి సీను అరణ్యంలో ఉన్న మెరీబత్‌-కాదేషు నీళ్లు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘నన్ను పరిశుద్ధునిగా కనబరచడానికి’ అని సానుకూల రూపం ఉంది; అయితే సందర్భం ప్రకారం వారు అలా చేయడంలో విఫలమయ్యారని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: ‘మెరీబత్‌-కాదేషు’ను ‘కాదేషు మెరీబా’ లేదా మరింత అక్షరార్థంగా ‘కాదేషు వివాదం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో ఈ పదం మోషే, అహరోనుల చర్యకు వచ్చిన పరిణామానికి కారణాన్ని సూచిస్తోంది; అందువల్ల కారణార్థక అనువాదం సహజంగా ఉంది.
- source_word: מְרִיתֶם
  choice: మీరు ... తిరుగుబాటు చేశారు
  rationale: מרה అనే క్రియ అధికారానికి ఎదురు తిరగడం లేదా ధిక్కరించడం అనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: פִּי
  choice: నా ఆజ్ఞకు
  rationale: అక్షరార్థంగా ‘నా నోరు’; ఇక్కడ దేవుని నోటినుంచి వచ్చిన ఆదేశాన్ని సూచించే హీబ్రూ నుడికారం.
- source_word: בְּמִדְבַּר צִן
  choice: సీను అరణ్యంలో
  rationale: מִדְבָּרకు ‘అరణ్యం’ సహజమైన భౌగోళిక అనువాదం; צִן స్థలనామంగా ‘సీను’ అని లిప్యంతరీకరించబడింది.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: సమాజం వాదించినప్పుడు
  rationale: మూలంలోని ‘సమాజపు వివాదంలో’ అనే భావాన్ని ఆధునిక తెలుగులో సంఘటనగా సహజంగా వ్యక్తం చేస్తుంది; עֵדָהకు ‘సమాజం’ సాధారణ పాఠకులకు స్పష్టం.
- source_word: לְהַקְדִּישֵׁנִי
  choice: నన్ను పరిశుద్ధునిగా కనబరచకుండా
  rationale: హిఫీల్ రూపం దేవుని పరిశుద్ధతను ప్రజల ఎదుట ప్రకటించడం లేదా కనబరచడం అని సూచిస్తుంది. క్రియారూపం సానుకూలమైనదే అయినా సందర్భం వారి వైఫల్యాన్ని తెలుపుతుంది.
- source_word: בַּמַּיִם
  choice: ఆ నీళ్ల దగ్గర
  rationale: ఈ పదబంధం సంఘటన జరిగిన నీళ్ల వద్దనున్న సందర్భాన్ని సూచిస్తుంది; ‘దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לְעֵינֵיהֶם
  choice: వారి కళ్ల ఎదుట
  rationale: హీబ్రూ నుడికారంలోని బహిరంగ దృశ్యతను స్పష్టంగా, సజీవంగా నిలుపుతుంది.
- source_word: הֵם
  choice: అవి
  rationale: ముందు పేర్కొన్న నీళ్లను గుర్తించి తెలిపే సూచన సర్వనామం.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: మెరీబత్‌-కాదేషు నీళ్లు
  rationale: సంయుక్త స్థలనామాన్ని లిప్యంతరీకరించడం ద్వారా దాని భౌగోళిక గుర్తింపును నిలుపుతూ, ‘నీళ్లు’తో నిర్మాణాన్ని తెలుగులో సహజంగా ఉంచుతుంది.
theological_decisions:
- issue: לְהַקְדִּישֵׁנִיలోని సానుకూల క్రియారూపాన్ని వైఫల్య సందర్భంలో అనువదించడం
  choice: నన్ను పరిశుద్ధునిగా కనబరచకుండా
  alternative: నన్ను పరిశుద్ధునిగా కనబరచడానికి
  rationale: మూల infinitive సానుకూల రూపంలో ఉన్నప్పటికీ, వాక్య సందర్భం మోషే, అహరోనులు అలా చేయడంలో విఫలమయ్యారని సూచిస్తుంది. తెలుగులో అర్థస్పష్టత కోసం సందర్భంలో అంతర్లీనంగా ఉన్న నిరాకరణను ప్రధాన పాఠ్యంలో వ్యక్తం చేశాం; ప్రత్యక్ష రూపాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. స్థలనామాలను ‘సీను,’ ‘మెరీబత్‌-కాదేషు’గా లిప్యంతరీకరించాం. మూలంలోని కారణార్థం, బహిరంగంగా దేవుని పరిశుద్ధతను కనబరచడంలో వైఫల్యం, మరియు స్థలనామంలోని పదప్రయోగం అన్నీ నిలుపబడ్డాయి.
