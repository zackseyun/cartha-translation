  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: te
  text: అతనికి కుమార్తె లేకపోతే, మీరు అతని వారసత్వాన్ని అతని సోదరులకు ఇవ్వాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: లేకపోతే
  rationale: న్యాయపరమైన వరుస షరతుల్లో తదుపరి సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; ముందున్న ప్రతికూల పరిస్థితిని షరతుగా కొనసాగిస్తుంది.
- source_word: אֵין ל/וֹ
  choice: అతనికి ... లేకపోతే
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణం సహజమైన తెలుగులో ‘అతనికి లేకపోతే’ అనే స్వామ్యార్థాన్ని ఇస్తుంది.
- source_word: בַּת
  choice: కుమార్తె
  rationale: హీబ్రూ ఏకవచన స్త్రీలింగ నామవాచకాన్ని యథార్థంగా ప్రతిబింబిస్తుంది.
- source_word: וּ/נְתַתֶּם
  choice: ఇవ్వాలి
  rationale: రెండవ పురుష బహువచనానికి ఇచ్చిన న్యాయపరమైన ఆదేశాన్ని తెలుగులో సహజమైన విధ్యర్థక రూపంతో తెలియజేస్తుంది; కర్త సందర్భం ద్వారా గ్రహించబడుతుంది.
- source_word: נַחֲלָת/וֹ
  choice: అతని స్వాస్థ్యాన్ని
  rationale: ఈ వారసత్వ న్యాయ సందర్భంలో נַחֲלָה వారసత్వంగా సంక్రమించే ఆస్తి లేదా భూస్వామ్య హక్కును సూచిస్తుంది; ‘స్వాస్థ్యం’ సంక్షిప్తమైన, గౌరవప్రదమైన న్యాయపదం.
- source_word: לְ/אֶחָי/ו
  choice: అతని సోదరులకు
  rationale: హీబ్రూ పురుష బహువచనమైన ‘అతని సోదరులు’ అనే అర్థాన్ని లింగనిర్దిష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, సంక్షిప్తమైన న్యాయశైలి. మూలంలోని షరతు–ఆదేశ నిర్మాణం సహజంగా నిలుపబడింది.
