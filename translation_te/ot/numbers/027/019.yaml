source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֣ אֹת֗/וֹ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָ֑ה וְ/צִוִּיתָ֥ה אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: te
  text: నీవు అతణ్ణి యాజకుడైన ఎలియాజరు ఎదుటను, సమాజమంతటి ముందును నిలబెట్టి, వారి కళ్లముందు అతనికి బాధ్యతను అప్పగించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి ఆజ్ఞాపించాలి’ లేదా ‘అతనికి ఆదేశం ఇవ్వాలి.’ హీబ్రూ క్రియకు ‘ఆజ్ఞాపించు’ అనే అర్థం ఉండవచ్చు; ఇక్కడ అది యెహోషువకు బహిరంగంగా బాధ్యత అప్పగించడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: నిలబెట్టి
  rationale: עמד యొక్క హిఫిల్ రూపం ఇక్కడ ఒకరిని ఇతరుల ఎదుట నిలబెట్టడం లేదా ఉంచడం అనే కారణార్థాన్ని ఇస్తుంది. సందర్భంలోని బహిరంగ నియామక చర్యను ‘నిలబెట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: వ్యక్తుల సమక్షంలో లేదా వారి ముందు అనే స్థలార్థాన్నీ, అధికారిక సమక్షాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఎలియాజరు అధికారిక పాత్రను స్పష్టంగా గుర్తిస్తుంది; తెలుగు వాక్యంలో సహజమైన విశేషణ నిర్మాణం.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతటి
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు సమూహాన్ని, ముఖ్యంగా కూడివచ్చిన సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతటి’ సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְצִוִּיתָה
  choice: బాధ్యత అప్పగించాలి
  rationale: צוה సాధారణంగా ఆజ్ఞాపించడం అని అర్థమవుతుంది; అయితే ఈ బహిరంగ వారసత్వ నియామక సందర్భంలో అధికారంతో కూడిన బాధ్యతను అప్పగించడం అనే ప్రయోగార్థం ప్రధానంగా కనిపిస్తుంది. ప్రత్యక్ష ‘ఆజ్ఞాపించాలి’ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לְעֵינֵיהֶם
  choice: వారి కళ్లముందు
  rationale: ‘వారి కళ్లకు’ అనే హీబ్రూ దృశ్యరూపాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతూ, కార్యం బహిరంగంగా సాక్షుల సమక్షంలో జరిగినదని తెలియజేస్తుంది.
theological_decisions:
- issue: యెహోషువకు బహిరంగంగా అధికార బాధ్యత అప్పగించడం
  choice: צוה ను ప్రధాన పాఠ్యంలో ‘బాధ్యత అప్పగించాలి’ అని అనువదించడం
  alternative: ‘అతనికి ఆజ్ఞాపించాలి’ లేదా ‘అతనికి ఆదేశం ఇవ్వాలి’
  rationale: చుట్టుపక్కల వచనాలు యెహోషువ నియామకాన్ని వర్ణిస్తున్నందున, ఈ క్రియ ఇక్కడ కేవలం ఒక ఆజ్ఞ ఇవ్వడంకన్నా అధికారిక బాధ్యతను అప్పగించే చర్యను సూచిస్తుంది. అయినా మూలక్రియలోని సాధారణ ‘ఆజ్ఞాపించు’ అర్థాన్ని పాదటిప్పణి ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని ఉపయోగించాం. ‘ఎదుట’, ‘కళ్లముందు’ అనే పదబంధాలు వేడుక యొక్క బహిరంగ స్వభావాన్ని నిలుపుతాయి; ‘బాధ్యత అప్పగించాలి’ సందర్భానుగుణ అర్థాన్ని ఇస్తూ, మూలంలోని పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
