source:
  edition: WLC
  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: te
  text: అప్పుడు మోషే వారి న్యాయవిషయాన్ని యాహ్వే ఎదుట ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి న్యాయదావాను యాహ్వే సన్నిధిలో సమర్పించాడు.”
    reason: מִשְׁפָּטָןకు ‘న్యాయదావా’ మరియు וַיַּקְרֵבకు ‘సమర్పించాడు’ అనే సందర్భోచిత ప్రత్యామ్నాయాలను చూపించడానికి.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: తీసుకువచ్చాడు
  rationale: קרב ధాతువు హిఫీల్ రూపంలో ‘దగ్గరకు తీసుకురావడం’ లేదా ‘సమర్పించడం’ అనే అర్థం ఇస్తుంది. న్యాయపరమైన ఈ సందర్భంలో ‘తీసుకువచ్చాడు’ సహజంగా ఉండి, మోషే ఆ విషయాన్ని దేవుని నిర్ణయానికి ఉంచాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁפָּטָן
  choice: వారి వ్యాజ్యాన్ని
  rationale: מִשְׁפָּט అనే పదానికి తీర్పు, న్యాయం, న్యాయవిషయం, వ్యాజ్యం వంటి అర్థాలు ఉన్నాయి. ఇక్కడ స్త్రీలింగ బహువచన ప్రత్యయం సెలొఫెహాదు కుమార్తెలను సూచిస్తుంది; ‘వారి వ్యాజ్యం’ వారి వారసత్వ హక్కుకు సంబంధించిన న్యాయవిషయాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధికి
  rationale: ఈ పదబంధం ‘ఎదుట’ లేదా ‘సన్నిధిలో’ అని అర్థం. ‘యెహోవా సన్నిధికి తీసుకువచ్చాడు’ అనే ప్రయోగం తెలుగులో సహజంగా ఉండి, నిర్ణయం కోసం ఆయన ఎదుట విషయాన్ని ఉంచడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్ ఇక్కడ కథనాన్ని ముందుకు నడిపిస్తూ, ముందటి విన్నపానికి మోషే చేసిన తదుపరి చర్యను కలుపుతుంది. ‘అప్పుడు’ ఈ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంలో ఉంచడం మూలంలోని భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయపరమైన పదజాలం. మూలంలోని సంక్షిప్త కథనశైలిని నిలుపుకున్నాం.
