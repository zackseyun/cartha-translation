  text: Then Yahweh said to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమానుసార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటాన్ని సూచించే తెలుగు ప్రయోగంలో ‘మోషేతో’ సహజంగా హీబ్రూ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ క్రియారూపాన్ని తెలుగులో సహజమైన ‘ఇలా అన్నాడు’ అనే నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ అనిశ్చితమైనందున, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యానికి సంకేతంగా చివర ద్విబిందువు వాడబడింది.
