  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: te
  text: అతని తండ్రికి అన్నదమ్ములు లేకపోతే, అతని స్వాస్థ్యాన్ని అతని వంశంలో అతనికి అత్యంత సమీప రక్తసంబంధికి[a] ఇవ్వాలి; అతడు దాన్ని స్వాధీనం చేసుకోవాలి[b]. యాహ్వే మోషేకు ఆజ్ఞాపించినట్లుగా, ఇది ఇశ్రాయేలీయులకు[c] న్యాయశాసనంగా[d] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని రక్తసంబంధి, అతనికి అత్యంత సమీపంగా ఉన్నవాడు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతడు దాన్ని వారసత్వంగా పొందాలి.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ అక్షరార్థం ‘ఇశ్రాయేలు కుమారులకు’; ఇది ఇశ్రాయేలు ప్రజలకు వాడే సాధారణ నిబంధనాపరమైన సంజ్ఞ.
    reason: cultural_note
  - marker: d
    text: లేదా ‘న్యాయవిధి,’ ‘తీర్పుకు సంబంధించిన శాసనం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים לְאָבִיו
  choice: అతని తండ్రికి అన్నదమ్ములు
  rationale: వారసత్వ క్రమంలో తండ్రి సహోదర పురుషులనే సూచించే సరళమైన కుటుంబార్థాన్ని నిలుపుతుంది.
- source_word: נַחֲלָתוֹ
  choice: అతని స్వాస్థ్యం
  rationale: వంశపారంపర్యంగా సంక్రమించే ఆస్తిని తెలిపే సహజమైన తెలుగు న్యాయపదం.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: అతనికి అత్యంత సమీప రక్తసంబంధి
  rationale: שְׁאֵר లోని రక్తబంధుత్వ భావాన్నీ, הַקָּרֹב లోని అత్యంత దగ్గరి బంధుత్వ స్థాయినీ రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: అతని వంశంలో
  rationale: ఇక్కడ מִשְׁפָּחָה కేవలం చిన్న కుటుంబాన్ని కాక, ఇశ్రాయేలు సామాజిక నిర్మాణంలోని విస్తృత బంధువర్గం లేదా వంశాన్ని సూచిస్తుంది.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: అతడు దాన్ని స్వాధీనం చేసుకోవాలి
  rationale: ירשׁ కు వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం అనే రెండూ సాధ్యమైన భావాలు ఉన్నాయి; ముందు వాక్యంలో వారసత్వం ఇవ్వడం ఉన్నందున ఇక్కడ దాని న్యాయపరమైన స్వాధీన ఫలితాన్ని వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ జాతీయ-నిబంధనాపరమైన సంజ్ఞను ఆధునిక తెలుగులో సహజంగా ప్రజలందరినీ సూచించేలా అందిస్తుంది; మూల రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: న్యాయవిధి
  rationale: חֻקָּה లోని స్థిరమైన శాసన భావాన్నీ מִשְׁפָּט లోని న్యాయపరమైన తీర్పు/నియమ భావాన్నీ సంక్షిప్తంగా, సహజంగా కలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: לִבְנֵי יִשְׂרָאֵל అనే సమూహ సంజ్ఞ
  choice: ఇశ్రాయేలీయులకు
  alternative: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, సందర్భంలో అది జాతి మొత్తానికి వర్తించే నిబంధనాపరమైన సంజ్ఞ. ఆధునిక తెలుగులో అపార్థం రాకుండా సహజ జాతీయ నామాన్ని వాడి, మూల రూపాన్ని పాదసూచికలో తెలిపింది.
- issue: וְיָרַשׁ యొక్క భావ విస్తృతి
  choice: స్వాధీనం చేసుకోవాలి
  alternative: వారసత్వంగా పొందాలి
  rationale: రెండు భావాలూ హీబ్రూ క్రియకు సాధ్యమే. ముందే స్వాస్థ్యాన్ని ఇవ్వడం చెప్పబడినందున, ఇక్కడ దాన్ని స్వాధీనంలోకి తీసుకోవడాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించింది. ‘ఇవ్వాలి,’ ‘స్వాధీనం చేసుకోవాలి,’ ‘న్యాయవిధి’ వంటి పదాలు ఆజ్ఞాత్మక-శాసన స్వరాన్ని సహజంగా నిలుపుతాయి. మూలంలోని బంధుత్వ క్రమం, సమీప రక్తసంబంధి భావం, మరియు దైవనామం స్పష్టంగా సంరక్షించబడ్డాయి.
