id: NUM.27.20
reference: Numbers 27:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: te
  text: నీవు నీ మహిమలో కొంత భాగాన్ని అతనిపై ఉంచాలి[a]; తద్వారా ఇశ్రాయేలు కుమారుల సమాజమంతా అతని మాట వింటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మహిమ” అనే హీబ్రూ పదాన్ని “ఘనత,” “వైభవం,” లేదా పదవికి సంబంధించిన “అధికారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు “వింటారు,” “ఆలకిస్తారు,” లేదా “విధేయులవుతారు” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: ఉంచాలి
  rationale: נתן అనే క్రియకు మౌలికంగా ‘ఇవ్వు’ అనే అర్థమున్నా, עַלతో కూడిన ఈ నియామక సందర్భంలో ‘అతనిమీద ఉంచు’ అనేది బదలాయింపు చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: מֵהוֹדְךָ
  choice: నీ మహిమలో కొంత
  rationale: הוֹד మహిమ, వైభవం, ఘనత లేదా పదవితో ముడిపడిన గౌరవాన్ని సూచించగలదు. מן భాగార్థాన్ని సూచిస్తున్నందున ‘కొంత’ను స్పష్టంగా ఉంచి, సందర్భం మాత్రమే ఆధారంగా ‘అధికారం’ అని పరిమితం చేయకుండా మూలపదపు విస్తృతిని కాపాడింది.
- source_word: עָלָיו
  choice: అతనిమీద
  rationale: עַלతో కూడిన సర్వనామ రూపానికి నేరమైన, సహజమైన తెలుగు అనువాదం; అనుగ్రహించడం లేదా బదలాయించడం అనే చిత్రాన్ని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని తెలిపే సంబంధాన్ని సహజ తెలుగులో చూపుతుంది; ముందరి ఆజ్ఞ ఫలితంగా సమాజం స్పందిస్తుందని తెలియజేస్తుంది.
- source_word: יִשְׁמְעוּ
  choice: అతని మాట వింటారు
  rationale: שׁמע వినడం, ఆలకించడం, విధేయత చూపడం అనే భావాలను మోయగలదు. ‘మాట వింటారు’ అనే తెలుగు ప్రయోగం వినడాన్నీ విధేయతనూ సహజంగా కలిపి, మూలంలోని అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: כָּל עֲדַת
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలు సమూహాన్ని లేదా సమాజాన్ని సూచిస్తుంది; ‘సమాజమంతా’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పురుష లింగ కుటుంబపదబంధాన్ని కనిపించేలా ఉంచే సన్నిహిత అనువాదం.
theological_decisions:
- issue: మోషే నుండి యెహోషువకు ఉంచబడే లక్షణం స్వభావం
  choice: ‘నీ మహిమలో కొంత’ అని అనువదించి, పాక్షిక బదలాయింపును మరియు הוֹד పదపు మహిమ/ఘనత భావాన్ని నిలుపడం.
  alternative: ‘నీ అధికారంలో కొంత’ లేదా ‘నీ ఘనతలో కొంత’.
  rationale: సందర్భం అధికారిక నాయకత్వ నియామకమైనప్పటికీ הוֹדను కేవలం ‘అధికారం’గా నిర్ణయించడం దాని నిజమైన పదార్థ విస్తృతిని కుదించవచ్చు. ‘మహిమ’ మూలానికి దగ్గరగా ఉండగా, పాదటిప్పణి సందర్భోచిత ప్రత్యామ్నాయాలను తెలియజేస్తుంది.
- issue: יִשְׁמְעוּ యొక్క భావబలం
  choice: ‘అతని మాట వింటారు’ అని అనువదించి వినడం మరియు విధేయత అనే రెండింటినీ మోయనివ్వడం.
  alternative: ‘అతనికి విధేయులవుతారు’ లేదా ‘అతని మాట ఆలకిస్తారు’.
  rationale: שׁמע నాయకత్వ సందర్భంలో విధేయతను సూచించగలదు, కాని దాని ప్రాథమిక వినికిడి భావం కూడా నిజమైనది. తెలుగు ‘మాట వినడం’ ఈ ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘మాట వింటారు’ అనే సహజ తెలుగు నుడికారం మూలంలోని వినడం–విధేయత ఉద్వేగాన్ని నిలుపుతుంది. పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
