  to: నీవు నీ మహిమలో కొంత భాగాన్ని అతనిపై ఉంచాలి[a]; తద్వారా ఇశ్రాయేలు కుమారుల సమాజమంతా అతని మాట వింటారు[b].
  rationale: The revision corrects the purpose relationship expressed by לְמַעַן and makes the Hebrew partitive construction explicit in idiomatic Telugu. It retains “మహిమ” and “అతని మాట వింటారు” to preserve the lexical breadth and contextual nuance of הוֹד and שׁמע, with alternatives documented at the relevant anchors.
