revisions:
- from: 'నీవు ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పాలి: ‘ఒక పురుషుడు చనిపోయి, అతనికి కుమారుడు లేకపోతే, అతని స్వాస్థ్యాన్ని అతని కుమార్తెకు బదలాయించాలి.’'
  to: 'నీవు ఇశ్రాయేలు కుమారులకు[a] ఇలా చెప్పాలి: ‘ఒక పురుషుడు మరణించి, అతనికి కుమారుడు లేకపోతే, మీరు అతని వారసత్వ ఆస్తిని అతని కుమార్తెకు బదలాయించాలి.’'
  rationale: The revision corrects the Telugu case marker for the speech recipient, explicitly reflects the source’s singular-to-plural shift, and uses a clear contemporary legal expression for inherited property. The footnote alternatives have also been adjusted to fit the dative syntax of the sentence.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T18:47:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the legal condition, the absence of a son, and the transfer to the daughter. However, కుమారులతో means “with the sons,” whereas Hebrew אֶל requires a dative addressee (“to the sons”). The Hebrew also shifts from singular “you shall speak” to plural “you shall transfer”; making the latter explicit in Telugu preserves this feature.
  naturalness: The sentence is otherwise clear and appropriately formal. కుమారులకు is the natural Telugu form for the addressee, and వారసత్వ ఆస్తి is clearer in current standard Telugu than the somewhat bookish, potentially broad స్వాస్థ్యం.
  terminology: ఇశ్రాయేలు కుమారులు preserves the masculine familial expression in the source. కుమారుడు and కుమార్తె correctly retain the sex-specific inheritance terms. వారసత్వ ఆస్తి communicates נחלה in this legal context without introducing interpretive detail.
  issues:
  - severity: medium
    issue: The phrase ఇశ్రాయేలు కుమారులతో uses an associative/instrumental postposition (“with”) rather than the required dative sense (“to”).
    rationale: The Hebrew phrase וְאֶל בְּנֵי יִשְׂרָאֵל directs speech to its audience. Telugu కుమారులకు accurately marks that audience.
  - severity: low
    issue: The plural addressee in וְהַעֲבַרְתֶּם is not represented explicitly.
    rationale: After singular תדבר, the Hebrew uses a plural verb for the legal action. Adding మీరు retains this grammatical detail and makes the legal directive clear.
  - severity: low
    issue: స్వాస్థ్యం is less immediately clear than a phrase explicitly denoting inherited property.
    rationale: נחלה here concerns inherited estate/property rights. వారసత్వ ఆస్తి is natural modern Telugu and contextually precise.
  revised_text: 'నీవు ఇశ్రాయేలు కుమారులకు[a] ఇలా చెప్పాలి: ‘ఒక పురుషుడు మరణించి, అతనికి కుమారుడు లేకపోతే, మీరు అతని వారసత్వ ఆస్తిని అతని కుమార్తెకు బదలాయించాలి.’'
  revised_footnotes:
