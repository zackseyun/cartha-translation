    text: లేదా ‘ఇశ్రాయేలీయులకు’ / ‘ఇశ్రాయేలు సంతానానికి.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  revision_rationale: The revision corrects the Telugu case marker for the speech recipient, explicitly reflects the source’s singular-to-plural shift, and uses a clear contemporary legal expression for inherited property. The footnote alternatives have also been adjusted to fit the dative syntax of the sentence.
