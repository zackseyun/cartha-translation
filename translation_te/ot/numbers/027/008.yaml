id: NUM.27.8
reference: Numbers 27:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: te
  text: 'నీవు ఇశ్రాయేలు కుమారులకు[a] ఇలా చెప్పాలి: ‘ఒక పురుషుడు మరణించి, అతనికి కుమారుడు లేకపోతే, మీరు అతని వారసత్వ ఆస్తిని అతని కుమార్తెకు బదలాయించాలి.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులకు’ / ‘ఇశ్రాయేలు సంతానానికి.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: హీబ్రూ పదబంధంలోని కుటుంబసంబంధమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సహజమైన సమూహార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: ఇలా చెప్పాలి
  rationale: హీబ్రూ ప్రసంగారంభ సూత్రంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ כִּי יָמוּת
  choice: ఒక పురుషుడు చనిపోయి
  rationale: న్యాయపరమైన ఊహాత్మక సందర్భంలో אִישׁ యొక్క పుంలింగ ఏకవచనాన్ని నిలుపుతూ, తరువాతి షరతుతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וּבֵן אֵין לוֹ
  choice: అతనికి కుమారుడు లేకపోతే
  rationale: ‘అతనికి కుమారుడు లేడు’ అనే హీబ్రూ నిర్మాణాన్ని స్పష్టమైన షరతుగా అందిస్తుంది; మగ వారసుడు లేని పరిస్థితిపై ఉన్న దృష్టిని నిలుపుతుంది.
- source_word: וְהַעֲבַרְתֶּם
  choice: బదలాయించాలి
  rationale: హిఫిల్ రూపం ఇక్కడ స్వాస్థ్య హక్కును ఒకరి నుండి మరొకరికి చట్టబద్ధంగా బదిలీ చేయడాన్ని సూచిస్తుంది.
- source_word: נַחֲלָתוֹ
  choice: అతని స్వాస్థ్యాన్ని
  rationale: ఈ సందర్భంలో నַחֲלָה వంశపారంపర్య ఆస్తి లేదా వారసత్వ హక్కును సూచిస్తుంది; ‘స్వాస్థ్యం’ న్యాయపరమైన భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לְבִתּוֹ
  choice: అతని కుమార్తెకు
  rationale: לְ స్వాస్థ్యాన్ని అందుకునే వ్యక్తిని సూచిస్తుంది; ఈ అనువాదం ప్రత్యక్షంగా మరియు సహజంగా ఉంది.
