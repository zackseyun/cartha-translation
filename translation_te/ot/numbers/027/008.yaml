translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘ఇలా చెప్పాలి’ ప్రసంగారంభాన్ని సహజీకరిస్తుంది; ‘బదలాయించాలి’ వారసత్వ హక్కు చట్టబద్ధంగా మారడాన్ని స్పష్టపరుస్తుంది.
