id: NUM.27.22
reference: Numbers 27:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: te
  text: యాహ్వే తనకు ఆజ్ఞాపించినట్టే మోషే చేశాడు. అతడు యెహోషువను తీసుకొని, యాజకుడైన ఎలియాజరు ఎదుట, సమాజమంతటి సమక్షంలో అతన్ని నిలబెట్టాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని ఎదుట నిలిచేలా చేశాడు”; ఈ హీబ్రూ క్రియను “అతన్ని సమర్పించాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే ... చేశాడు
  rationale: మోషే ముందుగా ఇచ్చిన దైవాజ్ఞకు విధేయంగా వ్యవహరించాడనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నేరుగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: అతడు యెహోషువను తీసుకొని
  rationale: לקח అనే సాధారణ క్రియలోని ‘తీసుకొను’ భావాన్ని నిలుపుతూ, నియామక సందర్భంలో తదుపరి చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וַיַּעֲמִדֵהוּ
  choice: అతన్ని నిలబెట్టాడు
  rationale: עמד యొక్క హిఫీల్ రూపం ‘నిలబడేలా చేయడం/నిలబెట్టడం’ అనే భౌతిక భావంతో పాటు బహిరంగంగా సమర్పించే సందర్భార్థాన్నీ కలిగి ఉంది; ‘నిలబెట్టాడు’ మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఎలియాజరు మరియు సమాజం సమక్షంలో యెహోషువను ఉంచిన బహిరంగ చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఎలియాజరు పదవిని స్పష్టంగా గుర్తిస్తూ తెలుగులో సహజమైన విశేషణ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: כָּל־הָעֵדָה
  choice: సమాజమంతటి
  rationale: עֵדָה ఇక్కడ కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది; ‘సమాజమంతటి’ כָּל భావాన్ని కూడా స్పష్టంగా కలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. తెలుగు బైబిలు వినియోగంలో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నప్పటికీ, హీబ్రూ నామ ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: וַיַּעֲמִדֵהוּ యొక్క ఆచారసంబంధ భావం
  choice: నిలబెట్టాడు
  alternative: సమర్పించాడు
  rationale: ఈ సందర్భంలో యెహోషువను ప్రజల సమక్షంలో నియామకార్థం ప్రవేశపెట్టడం సూచితమైనా, క్రియ యొక్క భౌతిక ‘నిలబెట్టడం’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత వ్యాఖ్యాత్మకమైన ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని వరుస చర్యలను సహజమైన తెలుగు ప్రవాహంతో అందించాం; నియామక ఆచారాన్ని మించిపోయి వ్యాఖ్యానించకుండా క్రియలోని అస్పష్టతను పాదటీపులో నిలిపాం.
