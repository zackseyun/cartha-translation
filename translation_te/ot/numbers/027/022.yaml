- from: యెహోవా తనకు ఆజ్ఞాపించినట్టే మోషే చేశాడు. అతడు యెహోషువను తీసుకొని, యాజకుడైన ఎలియాజరు ఎదుట, సమాజమంతటి ఎదుట అతన్ని నిలబెట్టాడు[a].
  to: యాహ్వే తనకు ఆజ్ఞాపించినట్టే మోషే చేశాడు. అతడు యెహోషువను తీసుకొని, యాజకుడైన ఎలియాజరు ఎదుట, సమాజమంతటి సమక్షంలో అతన్ని నిలబెట్టాడు[a].
