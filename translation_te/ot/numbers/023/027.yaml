  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: te
  text: అప్పుడు బాలాకు బిలాముతో, “దయచేసి రా; నేను నిన్ను మరో చోటికి తీసుకువెళ్తాను. బహుశా అది దేవుని దృష్టికి సరైనదిగా ఉండవచ్చు[a]; అక్కడినుండి నాకోసం అతనిని శపించు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దృష్టికి ఇంపుగా ఉండవచ్చు.” హీబ్రూ నుడికారం ఒకరి దృష్టికి ఏదైనా సరైనదిగా లేదా ఇంపుగా ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: దయచేసి రా
  rationale: הלך యొక్క ఆజ్ఞారూపం ఇక్కడ ఆహ్వానం లేదా పిలుపుగా ఉంది; נָּא దానిని మర్యాదపూర్వకమైన విన్నపంగా చేస్తుంది.
- source_word: אֶקָּחֲךָ
  choice: నేను నిన్ను … తీసుకెళ్తాను
  rationale: రూపరీత్యా ప్రథమ పురుష అసంపూర్ణ క్రియ అయినా, సందర్భంలో బాలాకు ప్రతిపాదిస్తున్న ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָקוֹם אַחֵר
  choice: మరో చోటికి
  rationale: వేరొక దర్శనస్థలానికి తీసుకెళ్లాలనే నిర్దిష్ట స్థలార్థాన్ని సరళంగా నిలుపుతుంది.
- source_word: אוּלַי
  choice: బహుశా … ఉండవచ్చేమో
  rationale: బాలాకు ఆశను అనిశ్చితితో వ్యక్తం చేస్తుంది; తెలుగులో సహజత్వం కోసం సంభావన భావం వాక్యాంత క్రియలోనూ ప్రతిఫలించింది.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: దేవుని దృష్టిలో సరైనదై ఉండవచ్చు
  rationale: ‘ఒకరి దృష్టిలో సరైనదిగా/ఇంపైనదిగా ఉండడం’ అనే హీబ్రూ నుడికారాన్ని అర్థవంతమైన ఆధునిక తెలుగులో నిలుపుతుంది; క్రియకు స్పష్టమైన కర్త లేకపోవడంతో ప్రతిపాదిత కార్యాన్నే ‘అది’గా గ్రహించాం.
- source_word: וְקַבֹּתוֹ לִי מִשָּׁם
  choice: అక్కడి నుంచి నాకోసం వారిని శపించడం
  rationale: קבב అంటే ‘శపించు.’ హీబ్రూలో ఇశ్రాయేలు ప్రజలను సమష్టిగా ఏకవచన ప్రత్యయంతో సూచించినా, తెలుగులో ప్రజాసమూహాన్ని సహజంగా ‘వారిని’ అని అనువదించాం; מִשָּׁם యొక్క స్థలార్థాన్ని ‘అక్కడి నుంచి’ నిలుపుతుంది.
theological_decisions:
- issue: బాలాకు మాటల్లో הָאֱלֹהִים ఎవరిని సూచిస్తుంది?
  choice: దేవుడు
  alternative: ఆ దేవుడు / ఒక దేవుడు
  rationale: తక్షణ కథన సందర్భంలో బిలాము సంప్రదిస్తున్న ఇశ్రాయేలు దేవుడే ఉద్దేశితుడు. ‘దేవుడు’ అనే అనువాదం కథన సూచనను స్పష్టంగా ఉంచుతూ అనవసరమైన బహుదేవతార్థాన్ని చేర్చదు.
- issue: יִישַׁר యొక్క భావం
  choice: సరైనదై ఉండడం
  alternative: ఇంపైనదై ఉండడం / అనుకూలంగా అనిపించడం
  rationale: ఈ పదబంధం నైతికంగా ‘సరైనది’ అనే భావాన్నీ, ఒకరి దృష్టికి ‘ఇంపైనది/ఆమోదయోగ్యమైనది’ అనే భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో ‘సరైనది’ ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం; దీనివల్ల బాలాకు దేవుని అనుమతిని తన కోరికకు అనుకూలంగా ఆశిస్తున్న కథన ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణలో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘దయచేసి రా’ విన్నప స్వరాన్ని, ‘మరో చోటికి’ స్థలమార్పును స్పష్టంగా తెలియజేస్తాయి. హీబ్రూ సమష్టి ఏకవచనాన్ని తెలుగులో సహజమైన బహువచన సర్వనామంతో వ్యక్తం చేశాం.
