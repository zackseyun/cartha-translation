- from: అప్పుడు బాలాకు బిలాముతో, “దయచేసి రా; నేను నిన్ను మరో చోటికి తీసుకెళ్తాను. బహుశా అక్కడి నుంచి నాకోసం వారిని శపించడం దేవుని దృష్టిలో సరైనదై ఉండవచ్చేమో[a]” అన్నాడు.
