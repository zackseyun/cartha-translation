  edition: WLC
  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: te
  text: ఇదిగో[a], ఆశీర్వదించడానికి నేను స్వీకరించాను; ఆయన ఆశీర్వదించాడు[b], దాన్ని నేను వెనక్కి తిప్పలేను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇదిగో’ అనే మాట తరువాతి ప్రకటనపై దృష్టి పెట్టమని పిలుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన’ అనే కర్త హీబ్రూలో ప్రత్యేక పదంగా లేదు; క్రియారూపంలో అంతర్లీనంగా ఉంది. సందర్భం దేవుని సూచిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘దాన్ని నేను రద్దు చేయలేను’, ‘దాన్ని నేను తిరిగి తీసుకోలేను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని తరువాతి ప్రకటనపై నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָרֵךְ
  choice: ఆశీర్వదించడానికి
  rationale: ఇక్కడ ఈ రూపం לָקָחְתִּיతో కలిసి స్వీకరించిన కార్యం లేదా నియోగం యొక్క విషయాన్ని సూచిస్తుంది; మూలంలో స్పష్టంగా లేని ‘ఆజ్ఞ’ అనే నామవాచకాన్ని చేర్చకుండా క్రియార్థాన్ని నిలుపుతుంది.
- source_word: לָקָחְתִּי
  choice: నేను స్వీకరించాను
  rationale: లָקַח్ యొక్క ‘తీసుకొను/స్వీకరించు’ భావాన్ని ప్రవచన సందర్భానికి తగినట్లుగా ఇస్తూ, మూలంలో అంతర్లీనంగా ఉన్న కర్మను అనవసరంగా స్పష్టం చేయదు.
- source_word: וּבֵרֵךְ
  choice: ఆయన ఆశీర్వదించాడు
  rationale: మూడవ పురుష ఏకవచన కర్త హీబ్రూలో క్రియారూపంలోనే అంతర్లీనంగా ఉంది. సందర్భం దేవుని సూచించినా, మూలంలోని సంక్షిప్తతను కాపాడటానికి ప్రధాన పాఠ్యంలో ‘ఆయన’ అని ఉంచబడింది.
- source_word: אֲשִׁיבֶנָּה
  choice: దాన్ని నేను వెనక్కి తిప్పలేను
  rationale: שׁוב హిఫీల్ రూపంలోని ‘తిరిగి వెళ్లేలా చేయు/వెనక్కి తిప్పు’ భావాన్ని నిలుపుతూ, ఇప్పటికే పలికిన ఆశీర్వాదాన్ని రద్దు చేయలేననే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆయన ఆశీర్వదించాడు’ అనే వాక్యంలో అంతర్లీన కర్త
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అని ఉంచి, సందర్భం దేవుని సూచిస్తుందని పాదటీకలో తెలిపాం.
  alternative: ‘దేవుడు ఆశీర్వదించాడు’ అని కర్తను స్పష్టంగా పేర్కొనడం; లేదా ‘ఒకడు ఆశీర్వదించాడు’ అనే అనిర్దిష్ట కర్తను వాడడం.
  rationale: సమీప సందర్భం కర్త దేవుడేనని బలంగా సూచిస్తుంది. అయితే హీబ్రూ పాఠ్యంలో దేవుని పేరు ఈ వాక్యంలో ప్రత్యక్షంగా లేదు; అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని సంక్షిప్తత, స్వల్ప అస్పష్టత కాపాడబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆజ్ఞ’ లేదా ‘వాక్యం’ వంటి మూలంలో ప్రత్యక్షంగా లేని కర్మను చేర్చలేదు. హీబ్రూ పదక్రమాన్ని పూర్తిగా అనుకరించకుండా, దాని సంక్షిప్తతను మరియు అంతర్లీన కర్తను సాధ్యమైనంతవరకు నిలిపాం.
