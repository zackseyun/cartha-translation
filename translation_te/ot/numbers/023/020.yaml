  source_fidelity: హీబ్రూ వాక్యంలోని ఉద్ఘాటకమైన הִנֵּהను ‘ఇదిగో’ సరిగ్గా ఇస్తుంది. ‘ఆశీర్వదించడానికి నేను స్వీకరించాను’లో లָקָחְתִּיకి కర్మ అంతర్లీనంగానే ఉంచబడింది; మూలంలో లేని ‘ఆజ్ఞ’ వంటి పదాన్ని జోడించలేదు. וּבֵרֵךְ యొక్క అంతర్లీన మూడవ పురుష ఏకవచన కర్తను ‘ఆయన’గా ఉంచడం సందర్భానికి తగినదే అయినా దేవుని నామాన్ని ప్రత్యక్షంగా చేర్చదు. అֲשִׁיבֶנָּהకు ‘వెనక్కి తిప్పలేను’ సందర్భోచితంగా ‘తిరస్కరించు/రద్దుచేయు/మార్చివేయు’ భావాన్ని కాపాడుతుంది.
