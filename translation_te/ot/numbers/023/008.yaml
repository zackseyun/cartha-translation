  edition: WLC
  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: te
  text: 'దేవుడు శపించనివారిని నేను ఎలా శపించగలను?

    యాహ్వే ఖండించనివారిని నేను ఎలా ఖండించగలను?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఎవరి మీద ఆగ్రహించలేదో, వారి మీద నేను ఎలా ఆగ్రహించగలను?” రెండో పాదంలోని హీబ్రూ క్రియ ఆగ్రహాన్ని లేదా ఆగ్రహంతో చేసే ఖండనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: ఎలా … గలను?
  rationale: ఇక్కడ ప్రశ్న సమాచారం కోసం కాదు; ఆ పని చేయడం అసాధ్యమని తెలిపే అలంకారప్రశ్న. ఆధునిక తెలుగులో ‘ఎలా … గలను?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶקֹּב / קַבֹּה
  choice: శపించగలను / శపించనివాణ్ణి
  rationale: రెండు రూపాల్లోనూ ఉన్న శపించే క్రియను ఒకే తెలుగు మూలంతో అనువదించడం మొదటి పాదంలోని పదసంబంధాన్ని, కవితా సమాంతరతను నిలుపుతుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: אֵל ఇక్కడ దేవునికి సాధారణ బిరుదుగా సహజంగా అర్థమవుతుంది; లిప్యంతరీకరణకన్నా ‘దేవుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֶזְעֹם / זָעַם
  choice: ఖండించగలను / ఖండించనివాణ్ణి
  rationale: זעם ఆగ్రహాన్ని వ్యక్తం చేయడం లేదా ఆగ్రహంతో దూషించి ఖండించడం అనే పరిధి కలిగిన క్రియ. ‘ఖండించు’ మొదటి పాదంలోని ‘శపించు’తో తేడాను నిలుపుతూ, సందర్భంలోని ప్రతికూల వాక్కును సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
theological_decisions:
- issue: אֵל మరియు יְהוָה అనే రెండు దైవసూచనలను వేరుగా నిలుపడం
  choice: אֵל ను ‘దేవుడు’గా, יְהוָה ను ‘యెహోవా’గా అనువదించడం
  alternative: రెండింటినీ ‘దేవుడు’గా అనువదించడం లేదా יְהוָה స్థానంలో ‘ప్రభువు’ వాడడం
  rationale: మూలంలోని కవితా సమాంతరతలో సాధారణ దైవబిరుదు, వ్యక్తిగత దైవనామం రెండూ ఉన్నాయి. వాటిని వేరుగా ఉంచడం మూలపాఠంలోని భేదాన్ని కాపాడుతుంది.
- issue: זעם క్రియలోని ఆగ్రహం–ఖండన భావవ్యాప్తి
  choice: ప్రధాన పాఠంలో ‘ఖండించు’; పాదసూచికలో ‘ఆగ్రహించు’ అనే ప్రత్యామ్నాయం
  alternative: రెండు పాదాల్లోనూ ‘శపించు’ అని సమానీకరించడం
  rationale: హీబ్రూ రెండో క్రియ మొదటి పాదంలోని ‘శపించు’తో పూర్తిగా ఒకటే కాదు. ప్రధాన సందర్భంలోని ప్రతికూల ప్రకటనను ‘ఖండించు’ అందిస్తుండగా, అంతర్గత ఆగ్రహభావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. రెండు పాదాల అలంకారప్రశ్న నిర్మాణాన్ని, క్రియల పదసంబంధాన్ని కాపాడాం. ‘నివాణ్ణి’ రూపం ఏకవచన సంబంధార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడకపోయినా సందర్భంలో ఇశ్రాయేలు/ప్రజలు ఉద్దేశింపబడుతున్నారు.
