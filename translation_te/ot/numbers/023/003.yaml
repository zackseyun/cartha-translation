  to: అప్పుడు బిలాము బాలాకుతో, “నీ దహనబలి దగ్గర నిలబడు. నేను వెళ్తాను. ఒకవేళ యాహ్వే నన్ను కలుసుకోవడానికి వస్తాడేమో; ఆయన నాకు ఏది చూపిస్తాడో అది నీకు తెలియజేస్తాను” అన్నాడు. తరువాత అతడు బట్టబయలైన ఎత్తైన ప్రదేశానికి[a] వెళ్లాడు.
  rationale: The revision removes the unwarranted implication that Balaam says he will return, retaining only his stated intention to go. It also renders שֶׁפִי as an exposed or bare height in the main text and places the more interpretive ‘treeless’ nuance in the footnote. No doctrinal or interpretive expansion has been introduced.
