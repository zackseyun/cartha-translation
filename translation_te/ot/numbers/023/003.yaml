id: NUM.23.3
reference: Numbers 23:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: te
  text: అప్పుడు బిలాము బాలాకుతో, “నీ దహనబలి దగ్గర నిలబడు. నేను వెళ్తాను. ఒకవేళ యాహ్వే నన్ను కలుసుకోవడానికి వస్తాడేమో; ఆయన నాకు ఏది చూపిస్తాడో అది నీకు తెలియజేస్తాను” అన్నాడు. తరువాత అతడు బట్టబయలైన ఎత్తైన ప్రదేశానికి[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వృక్షాలు లేని ఎత్తైన ప్రదేశానికి”; “బట్టబయలైన కొండపైకి.” హీబ్రూ పదం బహిరంగమైన, బట్టబయలైన ఎత్తైన స్థలాన్ని సూచిస్తుంది; దీనిలో వృక్షాలు లేకపోవాలనే భావం కూడా ఉండవచ్చు.
    reason: అరుదైన హీబ్రూ పదమైన שֶׁפִיకి ఉన్న సంభావ్య భౌగోళిక ప్రత్యామ్నాయాలను సూచించి, ప్రధాన పాఠంలో దాని ప్రాథమిక ‘బహిరంగ/బట్టబయలు’ భావాన్ని ఉంచడం.
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: నీ దహనబలి దగ్గర నిలబడు
  rationale: హిత్పయేల్ ఆజ్ఞారూపం ఒక స్థానంలో నిలబడమనే భావాన్ని ఇస్తుంది; ఇక్కడ עַל అనేది బలి మీద నిలబడడం కాకుండా దాని దగ్గర లేదా పక్కన నిలబడడాన్ని సూచిస్తుంది. עֹלָה ప్రత్యేకంగా పూర్తిగా దహనం చేసే బలిని సూచిస్తుంది.
- source_word: וְאֵלְכָה
  choice: నేను వెళ్లి వస్తాను
  rationale: మొదటి పురుష కోహోర్టేటివ్ బిలాము ఇప్పుడు వెళ్లాలనే ఉద్దేశాన్ని తెలియజేస్తుంది. సందర్భంలో అతడు తిరిగి వచ్చి బాలాకుకు తెలియజేస్తానని చెబుతున్నందున, సహజమైన తెలుగులో ‘వెళ్లి వస్తాను’ అని ఇచ్చాం.
- source_word: אוּלַי
  choice: ఒకవేళ … ఏమో
  rationale: దైవిక భేటీ జరుగుతుందనే నిశ్చయాన్ని కాకుండా అవకాశాన్ని, అనిశ్చితిని నిలుపుతుంది.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: యాహ్వే నన్ను కలుసుకోవడానికి వస్తాడేమో
  rationale: נקרה/קרה ఇక్కడ ఎదురుపడడం లేదా భేటీ కావడం అనే భావం ఇస్తుంది. ‘ఒకవేళ … ఏమో’ అనే నిర్మాణం బిలాము వ్యక్తం చేసిన అనిశ్చితిని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: ఆయన నాకు ఏది చూపిస్తాడో అది
  rationale: సంక్షిప్తమైన హీబ్రూ వాక్యనిర్మాణం వెల్లడించబడే విషయాన్ని సూచిస్తుంది. హిఫిల్ రూపమైన יראניకి ‘నాకు చూపిస్తాడు’ నేరమైన సమానార్థకం.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: నీకు తెలియజేస్తాను
  rationale: נגד హిఫిల్ రూపం చెప్పడం, ప్రకటించడం లేదా నివేదించడం అనే అర్థం ఇస్తుంది; ‘తెలియజేస్తాను’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: שֶׁפִי
  choice: చెట్లు లేని ఎత్తైన ప్రదేశం
  rationale: ఈ అరుదైన పదం బట్టబయలైన, వృక్షాలు లేని ఎత్తైన ప్రదేశాన్ని సూచించే అవకాశముంది. తెలుగులో ‘చెట్లు లేని ఎత్తైన ప్రదేశం’ భౌగోళిక భావాన్ని స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా దేవుని వ్యక్తిగత నామం ఉంది; అందువల్ల దానిని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: యాహ్వే బిలామును కలుసుకోవడం గురించి ఉన్న అనిశ్చితి
  choice: ఒకవేళ యాహ్వే … వస్తాడేమో
  alternative: యాహ్వే తప్పకుండా వస్తాడు
  rationale: אוּלַי స్పష్టంగా అవకాశాన్ని సూచిస్తుంది. అందువల్ల దైవిక భేటీని నిశ్చితమైనదిగా మార్చకుండా బిలాము మాటల్లోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వాక్యశైలిని పాటించాం. బిలాము మాటల్లోని అనిశ్చితిని ‘ఒకవేళ … ఏమో’తో నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఎత్తైన ప్రదేశానికి’ అన్న పదబంధం వెంట ఉంచాం.
