source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר מִן אֲ֠רָם יַנְחֵ֨/נִי בָלָ֤ק מֶֽלֶךְ מוֹאָב֙ מֵֽ/הַרְרֵי קֶ֔דֶם לְכָ/ה֙ אָֽרָ/ה לִּ֣/י יַעֲקֹ֔ב וּ/לְכָ֖/ה זֹעֲמָ֥/ה יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: te
  text: 'అప్పుడు అతడు తన ఉక్తిని[a] ఎత్తి ఇలా అన్నాడు:


    “మోయాబు రాజైన బాలాకు అరాము నుండి,

    తూర్పు పర్వతాల నుండి[b] నన్ను నడిపించి తీసుకొచ్చాడు:

    ‘రా, నా కోసం యాకోబును శపించు;

    రా, ఇశ్రాయేలును ఖండించు[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కవితాత్మక ప్రకటనను.” హీబ్రూ నుడికారం అక్షరార్థంగా “అతడు తన మషాల్‌ను ఎత్తుకున్నాడు”; ఇది గంభీరమైన కవితాత్మక పలుకును పరిచయం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తూర్పుదిక్కు పర్వతాల నుండి.” ఈ మాట మోయాబుకు తూర్పున ఉన్న ప్రాంతాన్ని భౌగోళికంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హీబ్రూ క్రియ ముందున్న “శపించు” అనే క్రియకు భిన్నమైనది. దీన్ని “తీవ్రంగా శపించు” లేదా “దూషించు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: తన ప్రవచన వాక్యాన్ని ఎత్తుకొని
  rationale: ‘మషాల్’ ఇక్కడ సామెతకన్నా గంభీరమైన కవితాత్మక ప్రకటనను సూచిస్తుంది. ‘ఎత్తుకొని’ అనే హీబ్రూ నుడికారాన్ని నిలిపి, తెలుగులో అర్థమయ్యేలా ‘ప్రవచన వాక్యం’ అని ఇచ్చాం.
- source_word: מִן אֲרָם
  choice: అరాము నుండి
  rationale: అరాము స్థలనామం; తరువాతి కాలపు ‘సిరియా’ అనే పేరుతో మార్చకుండా లిప్యంతరీకరించాం.
- source_word: יַנְחֵנִי
  choice: నన్ను నడిపించి తీసుకొచ్చాడు
  rationale: נחה హిఫీల్ రూపంలోని నడిపించడం/మార్గనిర్దేశం చేయడం అనే భావాన్ని, సందర్భంలోని తీసుకురావడాన్ని సహజ తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: తూర్పు పర్వతాల నుండి
  rationale: కֶדֶםను ఇక్కడ అరాముతో సమాంతరంగా భౌగోళికమైన ‘తూర్పు’ అర్థంలో తీసుకున్నాం.
- source_word: לְכָה
  choice: రా
  rationale: ప్రత్యక్ష సంభాషణలోని ఆహ్వానాత్మక ఆజ్ఞకు సహజమైన తెలుగు రూపం.
- source_word: אָרָה
  choice: శపించు
  rationale: శాపం పలకడం అనే క్రియ యొక్క సూటి, సహజ అర్థాన్ని ఇస్తుంది.
- source_word: לִּי
  choice: నా కోసం
  rationale: బాలాకు ప్రయోజనం కోసం చేయవలసిన చర్య అనే దాతృత్వ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: వ్యక్తి/జాతి పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో నిలిపాం.
- source_word: זֹעֲמָה
  choice: ఆగ్రహం ప్రకటించు
  rationale: ఈ క్రియ ముందున్న ‘శపించు’కు భిన్నమైనది; తీవ్ర ఆగ్రహంతో ఖండించడం లేదా శాపానికి గురిచేయడం అనే భావాన్ని, రెండు క్రియలను ఒకటిగా చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: వ్యక్తి/జాతి పేరును ప్రామాణిక తెలుగు రూపంలో నిలిపాం.
theological_decisions:
- issue: బాలాకు పలికిన అభ్యర్థనలో యాకోబు–ఇశ్రాయేలు సంబంధం
  choice: రెండు పేర్లనూ వేర్వేరుగా, కవితాత్మక సమాంతర పదాలుగా ఉంచడం
  alternative: రెండింటినీ కలిపి ‘ఇశ్రాయేలీయులు’ వంటి ఒకే సమూహపదంతో అనువదించడం
  rationale: హీబ్రూ ఉద్దేశపూర్వకంగా ‘యాకోబు’, ‘ఇశ్రాయేలు’ అనే జత పేర్లను ఉపయోగిస్తుంది. వాటిని నిలపడం సాహిత్య, నిబంధనాత్మక ప్రతిధ్వనులను కాపాడుతుంది; అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉండే పదజాలం. ప్రత్యక్ష వాక్య నిర్మాణం మరియు యాకోబు–ఇశ్రాయేలు సమాంతరత నిలిపివేయబడ్డాయి.
