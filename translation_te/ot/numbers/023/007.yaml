    issue: “ప్రవచన వాక్యం” for מָשָׁל
    rationale: The term may imply a specifically prophetic oracle. In this context מָשָׁל introduces a formal poetic utterance, but the Hebrew word itself should not be narrowed to prophecy.
  - severity: high
    issue: “ఇశ్రాయేలుపై ఆగ్రహం ప్రకటించు” for זֹעֲמָה יִשְׂרָאֵל
    rationale: This wording describes announcing anger toward Israel, whereas the imperative calls for a hostile act directed against Israel—denouncing or execrating it. “ఇశ్రాయేలును ఖండించు” better represents the verb and preserves its distinction from “శపించు.”},{
