source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: te
  text: 'అప్పుడు బాలాకు అతనితో ఇలా అన్నాడు: “దయచేసి నాతో పాటు మరొక చోటికి రా. అక్కడి నుంచి నువ్వు వారిని చూస్తావు. వారి చివరి భాగాన్ని మాత్రమే చూస్తావు[a]; వారందరినీ చూడవు. అక్కడి నుంచి నా కోసం వారిని శపించు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి అంచు భాగాన్ని మాత్రమే చూస్తావు.” హెబ్రీ పదం అంచు, అంతం లేదా చివరి భాగం అని అర్థమివ్వగలదు; భావం ఇశ్రాయేలు ప్రజల్లో కొంత భాగం మాత్రమే కనిపిస్తుందనేది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ఇశ్రాయేలు ప్రజలను ఒక సమష్టిగా తీసుకొని “అతనిని,” “అతనంతటినీ” అనే ఏకవచన ప్రత్యయాలు వాడబడ్డాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: దయచేసి నాతో పాటు ... రా
  rationale: נָא అభ్యర్థన ధోరణిని సూచిస్తుంది; אִתִּי సహవాసాన్ని స్పష్టంగా తెలియజేస్తుంది. సందర్భంలో బాలాకు బిలామును తనతో కొత్త ప్రదేశానికి రావాలని కోరుతున్నాడు.
- source_word: מָקוֹם אַחֵר
  choice: మరొక చోటికి
  rationale: కొత్త వీక్షణ స్థలానికి తరలిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: అక్కడి నుంచి నువ్వు వారిని చూడగలవు
  rationale: కొత్త స్థలం ఒక వీక్షణ బిందువని తెలియజేస్తుంది. హెబ్రీలో ఇశ్రాయేలును సమష్టిగా సూచించే ఏకవచన ప్రత్యయం ఉన్నా, తెలుగులో ప్రజలను సూచించడానికి గౌరవ/బహువచన రూపం సహజం.
- source_word: אֶפֶס קָצֵהוּ תִרְאֶה
  choice: అయితే వారి అంచున ఉన్నవారిని మాత్రమే చూస్తావు
  rationale: אֶפֶס పరిమితిని చూపుతుంది; קָצֶה అంతం, అంచు లేదా చివరి భాగాన్ని సూచిస్తుంది. ఇశ్రాయేలు ప్రజల్లో అంచున కనిపించే కొంతమందినే చూడటం అనే దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: వారందరినీ చూడవు
  rationale: పాక్షిక దృశ్యానికీ మొత్తం ప్రజలను చూడటానికీ ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: అక్కడి నుంచి నా కోసం వారిని శపించు
  rationale: קבב ఇక్కడ శపించడాన్ని సూచిస్తుంది; לִי బాలాకు ప్రయోజనం కోసం చేయమనే భావాన్ని, מִשָּׁם ఆ ప్రదేశం నుంచే చేయమనే స్థల భావాన్ని నిలుపుతాయి.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే ఏకవచన ప్రత్యయాలు
  choice: ప్రధాన పాఠ్యంలో ‘వారు/వారిని’ అనే సమష్టి బహువచన రూపాలు
  alternative: వ్యాకరణ రూపాన్ని అనుసరించి ‘అతడు/అతనిని’ లేదా నపుంసక సమష్టి రూపం వాడటం
  rationale: హెబ్రీ ఇశ్రాయేలును ఒక సమష్టి ప్రజగా ఏకవచనంలో సూచిస్తుంది. తెలుగులో మనుషుల సమూహానికి ‘అతనిని’ అనడం తప్పుదారి పట్టించగలదు; ‘వారిని’ సహజంగా ఉండి అదే సమష్టి సూచనను అందిస్తుంది. మూలంలోని ఏకవచన లక్షణాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- issue: קָצֵהוּ యొక్క దృశ్యార్థం
  choice: ‘వారి అంచున ఉన్నవారిని’
  alternative: ‘వారి చివరి భాగాన్ని’ లేదా ‘వారి అంచును’
  rationale: ఇక్కడ ఒక ప్రజాసమూహం పాక్షికంగా మాత్రమే కనిపించడం భావం. ‘అంచున ఉన్నవారు’ తెలుగులో దృశ్యాన్ని స్పష్టంగా చేస్తుంది; ‘చివరి భాగం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే ప్రత్యక్ష సంభాషణ. మూలంలోని పాక్షిక వీక్షణ భావాన్ని నిలుపుతూ, హెబ్రీ సమష్టి ఏకవచనాన్ని తెలుగులో సహజమైన బహువచనంతో అందించి పాదటిప్పణిలో వివరించాం.
