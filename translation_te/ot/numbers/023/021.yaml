revisions:
- from: యాకోబులో కీడును ఆయన గమనించలేదు; ఇశ్రాయేలులో దుఃఖాన్ని ఆయన చూడలేదు.[a] అతని దేవుడైన యెహోవా అతనితో ఉన్నాడు; రాజును కొనియాడే కేక వారి మధ్య వినిపిస్తోంది.[b][c]
  to: యాకోబులో కీడును ఆయన గమనించలేదు; ఇశ్రాయేలులో దుఃఖాన్ని ఆయన చూడలేదు.[a] అతని దేవుడైన యెహోవా అతనితో ఉన్నాడు; రాజు జయధ్వని అతనిలో ఉంది.[b][c]
  rationale: The revision preserves the source’s collective-singular personification in the final clause and removes the interpretive addition that the cry is explicitly directed toward the king. The revised note set retains the lexical and contextual alternatives without determining whether the king is Yahweh or another referent.
