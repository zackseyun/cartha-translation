reference: Numbers 23:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: te
  text: యాకోబులో కీడును ఆయన గమనించలేదు; ఇశ్రాయేలులో దుఃఖాన్ని ఆయన చూడలేదు.[a] అతని దేవుడైన యెహోవా అతనితో ఉన్నాడు; రాజు జయధ్వని అతనిలో ఉంది.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాకోబులో దోషాన్ని ఆయన గమనించలేదు; ఇశ్రాయేలులో వక్రతను ఆయన చూడలేదు’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదాలు నైతిక దోషాన్నిగానీ, కీడు లేదా బాధనుగానీ సూచించగలవు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘అతనిలో.’ ఈ వాక్యంలో ఇశ్రాయేలు ఒక సమూహ ఏకవచనంగా చెప్పబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘రాజు జయధ్వని’ అనే పదబంధం రాజసంబంధమైన జయధ్వనిని లేదా రాజుకు సంబంధించిన కేకను సూచించవచ్చు; యెహోవా రాజుగా వారి మధ్య ఉన్నాడనే భావన కూడా ఇందులో ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: గమనించలేదు
  rationale: నבט అనేది శ్రద్ధగా చూడడం లేదా పరిగణించడం అనే భావాన్ని ఇస్తుంది. సమాంతర పాదంలోని సాధారణ ‘చూడలేదు’తో భేదాన్ని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: אָוֶן
  choice: కీడు
  rationale: ఈ పదానికి దుష్టత్వం, అపాయం, బాధ అనే అర్థపరిధి ఉంది. ‘కీడు’ నైతిక దోషానికీ సంభవించే అపాయానికీ తెరచి ఉండి మూలంలోని సందిగ్ధతను కొంతవరకు నిలుపుతుంది.
- source_word: רָאָה
  choice: చూడలేదు
  rationale: ראהకు నేరమైన, సహజమైన తెలుగు సమానం; మొదటి పాదంతో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: עָמָל
  choice: దుఃఖం
  rationale: עמל శ్రమ, బాధ, దురవస్థను సూచించగలదు. ‘దుఃఖం’ మొదటి పదమైన ‘కీడు’తో భేదాన్ని ఉంచి బాధ అనే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: యాకోబులో / ఇశ్రాయేలులో
  rationale: ב ఉపసర్గను స్థానార్థకంగా అనువదించి, హీబ్రూ కవిత్వంలోని సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన లిప్యంతరీకరణతో అందించాం.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: అతని దేవుడైన ... అతనితో ఉన్నాడు
  rationale: ఏకవచన ప్రత్యయాలను అలాగే ఉంచి, యాకోబు/ఇశ్రాయేలు సమూహాన్ని ఒక వ్యక్తిగా సూచించే మూలరూపాన్ని కాపాడాం.
- source_word: תְרוּעַת מֶלֶךְ
  choice: రాజును కొనియాడే కేక
  rationale: תרועה ఆనందకేక, యుద్ధకేక లేదా రాజసంబంధ ప్రశంసధ్వని కావచ్చు. ‘కొనియాడే కేక’ రాజసంబంధ సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఖచ్చిత సూచనపై గమనికలో సందిగ్ధతను నిలిపాం.
- source_word: בּוֹ
  choice: వారి మధ్య
  rationale: రూపపరంగా ‘అతనిలో’ అయినప్పటికీ, ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచించే సహజ తెలుగు కోసం ‘వారి మధ్య’ వాడాం; ఈ మార్పును గమనికలో తెలిపాం.
theological_decisions:
- issue: ఇశ్రాయేలు పాపరహితమని వాక్యం చెబుతోందా, లేక కీడు/బాధ దానిపై ప్రబలలేదని చెబుతోందా
  choice: ప్రధాన పాఠంలో ‘కీడు’ మరియు ‘దుఃఖం’ అని ఉంచి, సంపూర్ణ నైతిక పాపరాహిత్యాన్ని నిర్బంధంగా ప్రకటించలేదు.
  alternative: ‘యాకోబులో దోషాన్ని ఆయన చూడలేదు; ఇశ్రాయేలులో దుర్మార్గాన్ని ఆయన చూడలేదు.’
  rationale: אָוֶן, עָמָל పదాలకు నైతిక మరియు బాధ/అపాయ సంబంధ అర్థాలు రెండూ సాధ్యమే. ‘కీడు’ కొంత ఉద్దేశపూర్వక సందిగ్ధతను నిలుపుతుంది; స్పష్టమైన నైతిక పఠనాన్ని పాదటిప్పణిలో అందించాం.
- issue: ‘రాజు’ దేవునినే సూచిస్తున్నాడా
  choice: రాజసంబంధ కొనియాడే కేకగా అనువదించి, రాజు ఎవరో ప్రధాన పాఠంలో స్పష్టంగా నిర్ణయించలేదు.
  alternative: ‘దైవరాజును కొనియాడే కేక’ లేదా ‘వారి రాజుకు జయధ్వని’
  rationale: సందర్భం యెహోవా రాజసన్నిధిని సూచించవచ్చు, కానీ హీబ్రూ పదబంధం రాజును ప్రత్యక్షంగా గుర్తించదు. అందువల్ల గమనికలో సాధ్యతను మాత్రమే పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ కవితాత్మక సమాంతరతను సాధ్యమైనంతవరకు నిలిపి, సమూహ ఏకవచనాన్ని మొదటి భాగంలో కాపాడాం. ‘వారి మధ్య’ అనే రూపం తెలుగులో సహజత కోసం వాడి పాదటిప్పణిలో అక్షరార్థాన్ని ఇచ్చాం.
