source:
  edition: WLC
  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: te
  text: 'ఎందుకంటే బండల శిఖరాల నుంచి నేను వారిని చూస్తున్నాను;

    కొండల నుంచి వారిని తిలకిస్తున్నాను.

    ఇదిగో, ఒంటరిగా నివసించే,

    జనాంగాల మధ్య తనను తాను లెక్కించుకోని ఒక ప్రజ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాంగాల మధ్య లెక్కించబడని ఒక ప్రజ.” హీబ్రూ క్రియను ప్రతిబింబక/మధ్యమ అర్థంలోనే కాక కర్మణి అర్థంలో కూడా గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న బిలాము ప్రవచనంతో ఈ మాటను వివరణాత్మకంగా అనుసంధానిస్తుంది; కారణార్థాన్ని అతిగా బలపరచకుండా సహజమైన తెలుగు అనుసంధానాన్ని ఇస్తుంది.
- source_word: מֵרֹאשׁ צֻרִים
  choice: బండల శిఖరాల నుంచి
  rationale: רֹאשׁ యొక్క స్థలసంబంధమైన ‘శిఖరం’ భావాన్నీ, צֻרִים యొక్క రాతిబండల దృశ్యాన్నీ నిలుపుతుంది.
- source_word: אֶרְאֶנּוּ
  choice: నేను వారిని చూస్తున్నాను
  rationale: హీబ్రూలో ఏకవచన సర్వనామం సమూహమైన ఇశ్రాయేలును సూచిస్తుంది. తెలుగులో ప్రజాసమూహాన్ని ‘వారిని’ అని చెప్పడం సహజం; వ్యక్తిగత పురుషుణ్ణి సూచిస్తున్నట్టు అపార్థం రాకుండా చేస్తుంది.
- source_word: וּמִגְּבָעוֹת
  choice: కొండల మీద నుంచి
  rationale: మొదటి పాదంలోని ఎత్తైన వీక్షణస్థల దృశ్యానికి సమాంతరంగా ఉండే సహజమైన ఆధునిక తెలుగు.
- source_word: אֲשׁוּרֶנּוּ
  choice: వారిని తిలకిస్తున్నాను
  rationale: ראה కంటే శ్రద్ధగా చూడడాన్ని సూచించే కవితాత్మక భేదాన్ని ‘తిలకిస్తున్నాను’ నిలుపుతుంది.
- source_word: הֶן
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై శ్రద్ధను ఆకర్షించే సూచనాత్మక కణానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: עָם
  choice: ప్రజ
  rationale: ఒక సామూహిక జాతీయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రజ’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְבָדָד יִשְׁכֹּן
  choice: ఒంటరిగా నివసించే
  rationale: ప్రత్యేకంగా ఉండే స్థితిని, అలవాటైన లేదా లక్షణాత్మక నివాసాన్ని తెలియజేస్తుంది; భవిష్యత్తు భావాన్ని అనవసరంగా నిర్బంధించదు.
- source_word: וּבַגּוֹיִם
  choice: జనాంగాల మధ్య
  rationale: ఇక్కడ גּוֹיִם ఇతర జాతీయ/జాతి సముదాయాలను సూచిస్తుంది. ‘జనాంగాలు’ సాధారణ ‘జనాలు’ కంటే ఈ భేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא יִתְחַשָּׁב
  choice: తనను తాను లెక్కించుకోదు
  rationale: హిత్పయేల్ రూపంలోని ప్రతిబింబక లేదా మధ్యమ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది; సాధ్యమైన కర్మణి అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: చివరి క్రియను ప్రతిబింబకంగా అర్థం చేసుకోవాలా, కర్మణిగా అర్థం చేసుకోవాలా
  choice: అది జనాంగాల మధ్య తనను తాను లెక్కించుకోదు
  alternative: అది జనాంగాల మధ్య లెక్కించబడదు
  rationale: יִתְחַשָּׁב అనే హిత్పయేల్ రూపం ప్రతిబింబక/మధ్యమ అర్థాన్నీ, కర్మణి అర్థాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠం ప్రతిబింబక భావాన్ని ఉంచగా, నిజమైన కర్మణి ప్రత్యామ్నాయాన్ని పాదటిప్పణి సంరక్షిస్తుంది; ఇశ్రాయేలు ప్రత్యేకతకు తరువాతి సిద్ధాంతార్థాలను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను పాదవిభజనతో నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ సమూహ ఏకవచనాన్ని తెలుగులో సహజమైన ‘వారిని’తో వ్యక్తం చేశాం; చివరి క్రియలోని అర్థసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
