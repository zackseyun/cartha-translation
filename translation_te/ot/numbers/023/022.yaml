id: NUM.23.22
reference: Numbers 23:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: te
  text: దేవుడు వారిని ఐగుప్తు నుండి బయటికి తీసుకొస్తున్నాడు; అడవి ఎద్దు[b] కొమ్ములవంటి శక్తి అతనికి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అడవి ఎద్దువంటి బలం అతనికి ఉంది.” హెబ్రీ పదబంధం క్లిష్టమైనది; ప్రధాన పాఠం జంతువు కొమ్ముల రూపకాన్ని, బలం భావాన్ని రెండింటినీ నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “అడవి ఎద్దు” అనే పదం బహుశా ఇప్పుడు అంతరించిపోయిన ఆరక్స్ అనే పెద్ద అడవి గోవుజాతి జంతువును సూచిస్తుంది. సాంప్రదాయ అనువాదాల్లో “ఒంటి కొమ్ము జంతువు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ אֵל వాక్యానికి కర్తగా ఉంది. సందర్భానికి సహజమైన, అతిశయార్థం జోడించని అనువాదం ‘దేవుడు’.
- source_word: מוֹצִיאָם
  choice: వారిని ... బయటికి తీసుకొస్తున్నాడు
  rationale: హిఫిల్ కృదంతం దేవుడు వారిని వెలుపలికి తీసుకువచ్చే క్రియను సజీవంగా చూపుతుంది. తెలుగు వర్తమాన ప్రగతిశీల రూపం ఈ కవితాత్మక సజీవతను నిలుపుతుంది; నిర్గమన సంఘటనను సూచిస్తుంది.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తులోనుండి
  rationale: చలన క్రియతో కలిసి ‘ఐగుప్తులోనుండి బయటికి’ మూలంలోని מן భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּתוֹעֲפֹת
  choice: కొమ్ములవంటి బలం
  rationale: ఈ క్లిష్టమైన బహువచన పదం కొమ్ములు, ఉన్నతమైన పొడుచుకొచ్చిన భాగాలు, లేదా వాటితో సూచితమయ్యే శక్తి అనే భావాలను కలిగి ఉండవచ్చు. తెలుగులో ‘కొమ్ములవంటి బలం’ అని ఇవ్వడం జంతు రూపకాన్ని, శక్తి భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: רְאֵם
  choice: అడవి ఎద్దు
  rationale: ఈ పదం బలమైన అడవి గోవుజాతి జంతువును, బహుశా ఇప్పుడు అంతరించిపోయిన aurochs‌ను సూచిస్తుంది; ఆధునిక పాఠకులకు ‘అడవి ఎద్దు’ స్పష్టంగా ఉంటుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: మసొరా పాఠంలోని మూడవ పురుష ఏకవచన ప్రత్యయాన్ని అలాగే నిలుపుతుంది. ముందున్న ‘వారిని’ అనే బహువచనంతో ఉన్న వ్యాకరణ ఉద్రిక్తతను సవరించకుండా, ఇశ్రాయేలును సమిష్టి ఏకవచనంగా సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: רְאֵם జంతు రూపకం
  choice: అడవి ఎద్దు
  alternative: అంతరించిపోయిన అడవి ఎద్దు (aurochs); సాంప్రదాయంగా ‘ఒంటి కొమ్ము జంతువు’
  rationale: మూలపదం పురాణజీవిని బోధించకుండా శక్తివంతమైన అడవి గోవుజాతి జంతువును సూచించే అవకాశం ఎక్కువ. అందువల్ల ఆధునికంగా అర్థమయ్యే ‘అడవి ఎద్దు’ను ప్రధాన పాఠంలో ఉంచాం.
- issue: כְּתוֹעֲפֹת యొక్క క్లిష్ట రూపకం
  choice: కొమ్ములవంటి బలం
  alternative: అడవి ఎద్దువంటి బలం; అడవి ఎద్దు కొమ్ములు
  rationale: హెబ్రీ పదం అర్థం నిశ్చితం కాదు. కేవలం ‘బలం’ అని రూపకాన్ని తొలగించకుండా, కేవలం ‘కొమ్ములు’ అని అర్థాన్ని అతిగా స్థిరపరచకుండా, రెండు భావాలను కలిపి సహజమైన తెలుగులో ఇచ్చాం.
- issue: לוֹ లోని ఏకవచన సూచన
  choice: అతనికి
  alternative: వారికి
  rationale: ‘వారిని’ తరువాత మూలపాఠం ఏకవచన ప్రత్యయానికి మారుతుంది. ఇశ్రాయేలును సమిష్టి వ్యక్తిగా చూడవచ్చు; మూలంలోని genuine ambiguityను నిలుపుటకు బహువచనంగా సవరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక శైలి. మూలంలోని బహువచనం నుండి ఏకవచనానికి మార్పును ‘వారిని ... అతనికి’గా ఉద్దేశపూర్వకంగా నిలిపాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
