translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. స్థలవర్ణనను అతి అక్షరార్థంగా కాకుండా స్పష్టంగా అందిస్తూ, הַיְשִׁימֹן లోని నిజమైన పదార్థ/స్థలనామ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
