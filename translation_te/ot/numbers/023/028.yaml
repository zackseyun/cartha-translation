source:
  edition: WLC
  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: te
  text: అప్పుడు బాలాకు బిలామును నిర్జన ప్రదేశం మీదికి తిలకించే పెయోరు శిఖరానికి తీసుకువెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెషీమోను మీదికి తిలకించే పెయోరు శిఖరానికి.” హీబ్రూ పదాన్ని “ఎడారి” లేదా “నిర్జన ప్రదేశం” అనే వర్ణనాత్మక పదంగానో, “యెషీమోను” అనే స్థలనామంగానో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అప్పుడు ... తీసుకువెళ్లాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; לקח యొక్క ‘తీసుకొను’ భావాన్ని ఈ ప్రయాణ సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּלָק
  choice: బాలాకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת בִּלְעָם
  choice: బిలామును
  rationale: నేర కర్మ సూచకమైన אֶת‌కు తెలుగులో ప్రత్యేక పదం అవసరం లేదు; పేరుకు కర్మ విభక్తి జోడించాం.
- source_word: רֹאשׁ
  choice: శిఖరం
  rationale: భౌగోళిక సందర్భంలో רֹאשׁ ఒక ఎత్తైన ప్రదేశపు పైభాగాన్ని లేదా శిఖరాన్ని సూచిస్తుంది.
- source_word: הַפְּעוֹר
  choice: పెయోరు
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం; హీబ్రూ నిర్దేశక ఉపపదాన్ని పేరులో ప్రత్యేకంగా చూపలేదు.
- source_word: הַנִּשְׁקָף
  choice: వైపు కనిపించే
  rationale: שׁקף నిఫాల్ కృదంతం ఎత్తైన ప్రదేశం నుంచి ఒక ప్రాంతం కనిపించడం లేదా దానిపైకి దృష్టి విస్తరించడం అనే స్థలవర్ణనను ఇస్తుంది; తెలుగులో సహజంగా ఉండేలా అనువదించాం.
- source_word: עַל פְּנֵי
  choice: వైపు
  rationale: ‘ముఖం మీద’ అనే అక్షరార్థ రూపం తెలుగులో ఈ భౌగోళిక సందర్భంలో అసహజం; దిశ లేదా ఎదురుగా విస్తరించిన ప్రాంతం అనే సంబంధాన్ని ‘వైపు’ సహజంగా తెలియజేస్తుంది.
- source_word: הַיְשִׁימֹן
  choice: ఎడారి
  rationale: יְשִׁימֹן నిర్జనమైన ఎడారి ప్రాంతాన్ని సూచించవచ్చు; సాధారణ పాఠకులకు స్పష్టమైన ‘ఎడారి’ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం, స్థలనామ సాధ్యతను పాదటిప్పణిలో ఉంచాం.
