language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: te
  text: 'బిలాము బాలాకుకు జవాబిచ్చి ఇలా అన్నాడు: “యాహ్వే చెప్పేదంతా నేను చేస్తానని నేను నీకు చెప్పలేదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని రెండు క్రియల సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, ఇది బాలాకు మాటకు ఇచ్చిన ప్రత్యుత్తరమని స్పష్టం చేస్తుంది.
- source_word: הֲלֹא
  choice: చెప్పలేదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకారిక ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִּבַּרְתִּי אֵלֶיךָ לֵאמֹר
  choice: నేను నీతో ... అని చెప్పలేదా
  rationale: אֶל యొక్క ‘నీతో/నీకు’ భావాన్ని, לֵאמֹר యొక్క ఉల్లేఖన పాత్రను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: యాహ్వే ఏది చెబుతాడో
  rationale: ‘యాహ్వే చెప్పేదంతా/ఏది చెప్పినా’ అనే సమగ్ర భావాన్ని కాపాడుతూ, సందర్భానుసార సాధారణ నియమాన్ని వర్తమాన రూపంలో తెలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: దానినే నేను చేస్తాను
  rationale: אֹתוֹ ముందున్న యాహ్వే పలికే విషయాన్ని తిరిగి సూచిస్తుంది; ‘-నే’ హీబ్రూలోని పునరుద్ఘాటిత నిర్మాణ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా ఉంచుతుంది; ‘యెహోవా’ కంటే సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉంటుంది.
- issue: బిలాము చేయబోయేది యాహ్వే పలికినదానికే పరిమితమా అన్న భావం
  choice: దానినే నేను చేస్తాను
  alternative: దాన్ని నేను చేస్తాను
  rationale: ఈ వాక్యంలోని పునఃసూచక నిర్మాణాన్ని కాపాడి, బిలాము తన చర్యను యాహ్వే పలికే విషయంతో అనుసంధానిస్తున్నాడని చూపుతుంది; అంతకుమించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణ సహజంగా ఉండేలా, అయితే బైబిలు కథనానికి తగిన గౌరవప్రదమైన శైలిని నిలిపాం. మూలంలో ప్రత్యేక పాఠాంతర లేదా అనువాద వివరణ అవసరం లేకపోవడంతో పాదటిప్పణి ఇవ్వలేదు; ఆంగ్ల సంప్రదింపు పాఠంలోని [a] సూచిక దాని పాదటిప్పణితో సరైన సంబంధం చూపకపోవడం వల్ల అనుసరించలేదు.
