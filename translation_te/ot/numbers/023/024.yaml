  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: te
  text: ఇదిగో[a], ఒక జనం సింహిలా లేస్తుంది, సింహంలా తలెత్తుతుంది; ఎరను తిని, హతుల రక్తాన్ని తాగే వరకు అది పడుకోదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సింహంలా.’ హీబ్రూ לָבִיא అనే పదాన్ని సాధారణంగా ‘సింహం’ అని కూడా అనువదించవచ్చు; అయితే ‘సింహి’ అనడం తరువాత వచ్చే אֲרִי (‘సింహం’)తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: బలమైన దృష్టి ఆకర్షణను తెలిపే సూచనాత్మక అవ్యయం; ఆధునిక గౌరవప్రద తెలుగు వాక్యశైలిలో సహజంగా ఉంటుంది.
- source_word: עָם
  choice: ఒక ప్రజ
  rationale: ఇశ్రాయేలీయులను సమష్టిగా సూచిస్తుంది; కవితాత్మక ప్రవచనంలోని సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: כְּלָבִיא
  choice: సింహిలా
  rationale: לָבִיא అనే పదం సాధారణంగా సింహాన్ని కూడా సూచించగలిగినా, ఇక్కడ స్త్రీ సింహం అనే భావం తీసుకోవడం తరువాతి אֲרִיతో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: יָקוּם
  choice: లేస్తుంది
  rationale: קום యొక్క కవితాత్మక జంతు రూపకాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְכַאֲרִי
  choice: సింహంలా
  rationale: אֲרִיకి సాధారణ అర్థమైన సింహాన్ని ఇస్తూ, ముందున్న לָבִיאతో సమాంతరతనూ పదభేదాన్నీ కాపాడుతుంది.
- source_word: יִתְנַשָּׂא
  choice: పైకి లేచి నిలబడుతుంది
  rationale: జంతువు బలంగా తనను తాను పైకి ఎత్తుకొని నిలిచే భంగిమను సహజ తెలుగులో చూపుతుంది; నైరూప్యమైన ‘తన్నుతాను హెచ్చించుకుంటుంది’ అనే అర్థాన్ని నివారిస్తుంది.
- source_word: לֹא יִשְׁכַּב
  choice: అది పడుకోదు
  rationale: సింహ రూపకంలోని స్పష్టమైన శారీరక క్రియను నిలుపుతుంది; సందర్భంలో కొనసాగుతున్న లేదా భవిష్యత్ ధోరణి తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: עַד יֹאכַל טֶרֶף
  choice: ఎరను తిని ... వరకు
  rationale: יֹאכַל అనే ‘తిను’ క్రియను తీవ్రత పెంచకుండా సన్నిహితంగా అనువదిస్తుంది; טֶרֶףను వేటాడి పట్టిన ఆహారం అనే భావంలో ‘ఎర’గా ఇస్తుంది.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: హతుల రక్తాన్ని తాగే
  rationale: యుద్ధ సందర్భంలో חֲלָלִיםను ‘హతులు’గా తీసుకొని, మూలంలోని ఉద్దేశపూర్వకంగా ఘాటైన విజయ రూపకాన్ని మృదువు చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: బిలాము ప్రవచనంలోని హింసాత్మక సింహ రూపకం
  choice: ఎరను తినడం, హతుల రక్తాన్ని తాగడం అనే ఘాటైన చిత్రణను యథాతథంగా నిలుపడం
  alternative: దీనిని సాధారణ విజయ భాషగా మృదువు చేయడం
  rationale: హీబ్రూ పాఠం ఇశ్రాయేలు యొక్క అడ్డుకోలేని సైనిక బలాన్ని సింహ రూపకంతో ఉద్దేశపూర్వకంగా చిత్రిస్తుంది. ఇది అక్షరార్థంగా రక్తపానం చేయమనే ఆజ్ఞ కాదు; అయినా మూలంలోని కఠినమైన ధార్మిక-కవితాత్మక ఉద్వేగాన్ని అనువాదం తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలి. ‘ఇదిగో’ ప్రవచన ఉద్ఘాటనను నిలుపుతుంది; ‘పైకి లేచి నిలబడుతుంది’ జంతు భంగిమను స్పష్టంగా చేస్తుంది. మూలంలోని హింసాత్మక రూపకాన్ని మృదువు చేయలేదు.
