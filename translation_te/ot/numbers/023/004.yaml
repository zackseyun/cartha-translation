source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: te
  text: దేవుడు బిలామును కలిశాడు[a]. అప్పుడు బిలాము ఆయనతో, “నేను ఆ ఏడు బలిపీఠాలను సిద్ధం చేసి, బలిపీఠం మీద ఒక కోడెను, ఒక పొట్టేలును అర్పించాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుడు బిలాముకు ఎదురుపడ్డాడు’; హీబ్రూ క్రియ ఒక సమాగమాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో అనుకోకుండా ఎదురుపడటం అనే ఛాయ కూడా దానికి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: కలిశాడు
  rationale: קרה అనే క్రియ ఇక్కడ ఎదురుపడటం లేదా కలవటం అనే భావాన్ని ఇస్తుంది. దేవుడు కర్తగా ఉన్న ఈ సందర్భంలో ‘కలిశాడు’ సహజంగా ఉండి, ఇది యాదృచ్ఛికంగా జరిగిందనే భావాన్ని బలవంతంగా రుద్దదు; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: క్రియ ఏకవచనంలో ఉంది; సందర్భంలో ఇది ఏకవచన దైవనామంగా వాడబడింది.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అప్పుడు బిలాము ఆయనతో ... అన్నాడు
  rationale: తరువాతి ప్రథమపురుష మాటల వల్ల మాట్లాడింది బిలామేనని స్పష్టమవుతుంది. హీబ్రూ సర్వనామాల అస్పష్టత తెలుగులో గందరగోళం కలిగించకుండా వ్యక్తుల పేర్లను స్పష్టపరిచాం.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: ఆ ఏడు బలిపీఠాలను
  rationale: నిర్దిష్ట రూపం సందర్భంలో ముందే తెలిసిన ఏడు బలిపీఠాలను సూచిస్తుంది; అందువల్ల ‘ఆ’ వాడాం.
- source_word: עָרַכְתִּי
  choice: సిద్ధం చేసి
  rationale: ערך యొక్క మూలభావం క్రమపరచడం లేదా అమర్చడం. బలిపీఠాల సందర్భంలో ‘సిద్ధం చేసి’ సాధారణ పాఠకులకు సహజంగా, సందర్భానుకూలంగా ఉంటుంది.
- source_word: וָאַעַל
  choice: అర్పించాను
  rationale: עלה బలుల సందర్భంలో ‘పైకి అర్పించు’ అనే సాంకేతిక భావంతో వస్తుంది; తెలుగులో ‘అర్పించాను’ స్పష్టమైన సహజ సమానార్థకం.
- source_word: פָּר
  choice: ఒక కోడెను
  rationale: బలిసందర్భంలో פר మగ పశువును సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘కోడె’ సంక్షిప్తమైన, స్పష్టమైన ఎంపిక.
- source_word: וָאַיִל
  choice: ఒక పొట్టేలును
  rationale: אַיִל యొక్క బలిసందర్భ అర్థం మగ గొర్రె; ‘పొట్టేలు’ దానికి సాధారణ తెలుగు పదం.
- source_word: בַּמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: మూలంలో నామవాచకం నిర్దిష్ట ఏకవచనంలో ఉంది. సందర్భం పంపిణీ భావాన్ని సూచించగలిగినా, ‘ప్రతి బలిపీఠం మీద’ అని మూలంలో లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: וַיִּקָּרలో దైవసమాగమ స్వభావం
  choice: నిజమైన దైవసమాగమాన్ని ‘కలిశాడు’ అని అనువదించడం
  alternative: ‘ఎదురుపడ్డాడు’ లేదా యాదృచ్ఛిక భావం బలంగా ఉండే రూపం
  rationale: ఈ ధాతువు కొన్ని సందర్భాల్లో అనుకోకుండా ఎదురుపడే ఛాయను కలిగి ఉండవచ్చు. అయితే ఇక్కడ దేవుడు బిలాముతో ఉద్దేశపూర్వకంగా సంభాషించే కథన సందర్భం ఉంది. ప్రధాన పాఠ్యం యాదృచ్ఛికతను నిర్ణయాత్మకంగా సూచించకుండా, పదంలోని విస్తృతిని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘బలిపీఠం’ వంటి స్థిర బైబిలు పదాన్ని నిలుపుతూ, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం. ప్రధాన పాఠ్యంలో మూలంలోని ఏకవచన ‘బలిపీఠం’ను కాపాడాం.
