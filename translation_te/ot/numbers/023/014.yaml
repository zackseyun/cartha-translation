translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బలిపీఠం,’ ‘అర్పించాడు’ వంటి సాధారణ బైబిలు పదజాలాన్ని ఉంచి, స్థలనామం/వర్ణనలోని నిజమైన అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
