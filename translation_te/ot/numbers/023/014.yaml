id: NUM.23.14
reference: Numbers 23:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקָּחֵ֨/הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל רֹ֖אשׁ הַ/פִּסְגָּ֑ה וַ/יִּ֨בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: te
  text: అప్పుడు అతడు అతన్ని పిస్గా శిఖరంలోని కాపలాదారుల క్షేత్రానికి[a] తీసుకువెళ్లాడు. అక్కడ అతడు ఏడు బలిపీఠాలను నిర్మించి, ప్రతి బలిపీఠంపై ఒక కోడెను, ఒక పొట్టేలును అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘త్సోఫీము క్షేత్రానికి.’ హీబ్రూ మాటను ‘కాపలాదారుల క్షేత్రం’ అనే వర్ణనగా గానీ, ‘త్సోఫీము క్షేత్రం’ అనే స్థలనామంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: అప్పుడు అతడు అతన్ని తీసుకువెళ్లాడు
  rationale: לקח అనే క్రియకు 3వ పురుష ఏకవచన కర్మప్రత్యయం ఉంది. వావ్-కన్సిక్యూటివ్ తెలిపే కథన క్రమాన్ని ఆధునిక తెలుగులో సహజంగా చూపేందుకు ‘అప్పుడు’ వాడబడింది; సందర్భంలో బాలాకు బిలామును తీసుకువెళ్తున్నాడు.
- source_word: שְׂדֵה צֹפִים
  choice: కాపలాదారుల క్షేత్రం
  rationale: ఈ నిర్మాణబంధానికి అక్షరార్థంగా ‘కాపలాదారుల/గమనించేవారి క్షేత్రం’ అని అర్థం. అదే సమయంలో ఇది స్థలనామంగా ఉండవచ్చు కాబట్టి, ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: పిస్గా శిఖరంపై ఉన్న
  rationale: భౌగోళిక సందర్భంలో רֹאשׁ అంటే ‘పైభాగం/శిఖరం.’ הַפִּסְגָּהను ఇక్కడ ‘పిస్గా’ అనే స్థలనామంగా తీసుకున్నాం. గమ్యస్థానాల మధ్య సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు వాక్య నిర్మాణాన్ని పునర్వ్యవస్థీకరించాం.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: ఏడు బలిపీఠాలను కట్టి
  rationale: בנה మరియు ‘ఏడు బలిపీఠాలు’ అనే కర్మకు నేరమైన, సహజమైన అనువాదం.
- source_word: וַיַּעַל
  choice: అర్పించాడు
  rationale: బలి సందర్భంలో עלהకు ‘పైకి ఎక్కించడం’ అనే మూలభావం ఉన్నప్పటికీ, ఇక్కడ దాని సహజమైన ఆచారపరమైన అర్థం ‘అర్పించడం.’
- source_word: פָּר וָאַיִל
  choice: ఒక కోడెను, ఒక పొట్టేలును
  rationale: ఏకవచన జంతు నామాలను తెలుగులో స్పష్టంగా చూపేందుకు ‘ఒక’ చేర్చాం. פָּרకు బలికి ఉపయోగించే మగ పశువు అనే భావంలో ‘కోడె,’ אַיִלకు ‘పొట్టేలు’ వాడాం.
- source_word: בַּמִּזְבֵּחַ
  choice: ప్రతి బలిపీఠంపై
  rationale: హీబ్రూలో పదం ఏకవచనంలో ఉన్నా, ముందుగా ఏడు బలిపీఠాలు కట్టినట్లు చెప్పడం మరియు ఈ భాగంలోని సమాంతర వచనాలు పంపిణీ భావాన్ని సూచిస్తాయి. అందువల్ల తెలుగులో ‘ప్రతి’ అని స్పష్టం చేశాం.
