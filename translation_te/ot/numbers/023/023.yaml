id: NUM.23.23
reference: Numbers 23:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: te
  text: ఎందుకంటే యాకోబుకు వ్యతిరేకంగా శకునవిచారణ ఏదీ లేదు[a]; ఇశ్రాయేలుకు వ్యతిరేకంగా మంత్రవిద్య లేదు. ఈ సమయంలో యాకోబు గురించీ, ఇశ్రాయేలు గురించీ, ‘దేవుడు ఏమి చేశాడో!’ అని చెప్పబడుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాకోబులో శకునవిచారణ లేదు; ఇశ్రాయేలులో మంత్రవిద్య లేదు.” హీబ్రూ ఉపసర్గను రెండు విధాలుగా అర్థం చేసుకోవచ్చు; సందర్భం “వ్యతిరేకంగా” అనే భావానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: “యాకోబు గురించీ, ఇశ్రాయేలు గురించీ” అనే మాటలను “యాకోబుతో, ఇశ్రాయేలుతో” అని కూడా అనువదించవచ్చు. చివరి మాటలు ప్రశ్నగా కాక, దేవుని కార్యాన్ని కొనియాడే ఆశ్చర్యార్థక ప్రకటనగా గ్రహించబడ్డాయి.
    reason: grammatical_and_punctuation_alternative
lexical_decisions:
- source_word: נַחַשׁ
  choice: శకునవిచారణ
  rationale: ఈ సందర్భంలో ఈ నామవాచకం శకునాలను గమనించి గూఢజ్ఞానం పొందే ఆచారాన్ని సూచిస్తుంది. కֶסֶםతో కొంత భేదం నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: קֶסֶם
  choice: మంత్రవిద్య
  rationale: ఇది మాంత్రిక లేదా గూఢమైన మార్గాల ద్వారా జ్ఞానం లేదా ప్రభావం పొందే ఆచారాన్ని సూచిస్తుంది. נַחַשׁకు వాడిన ‘శకునవిచారణ’తో పదభేదాన్ని నిలుపుతుంది.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: యాకోబుకు వ్యతిరేకంగా / ఇశ్రాయేలుకు వ్యతిరేకంగా
  rationale: బిలాము ప్రవచన సందర్భంలో ఇశ్రాయేలుపై శకునవిచారణ లేదా మంత్రవిద్య ప్రభావం చూపలేవనే భావం ప్రధానంగా కనిపిస్తుంది. అయితే בְ ఉపసర్గకు ‘యాకోబులో/ఇశ్రాయేలులో’ అనే సన్నిహిత పఠనం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచబడింది.
- source_word: כָּעֵת
  choice: తగిన సమయంలో
  rationale: ఈ పదబంధం ‘ఇప్పుడు/ఈ సమయంలో’ అని కూడా అర్థమవుతుంది; ఇక్కడ దేవుని కార్యం వెల్లడై ప్రకటించబడే సముచిత సమయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יֵאָמֵר
  choice: చెప్పబడుతుంది
  rationale: నిఫాల్ అసంపూర్ణ క్రియలోని కర్మణి, భవిష్యత్ స్వరాన్ని నిలుపుతుంది.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: యాకోబుతో, ఇశ్రాయేలుతో
  rationale: לְ ఉపసర్గ యొక్క ప్రత్యక్ష దాతృ భావాన్ని నిలుపుతూ, ప్రకటన వారిని ఉద్దేశించి చెప్పబడుతుందని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘యాకోబు, ఇశ్రాయేలు గురించి’ అనే పఠనం కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: מַה פָּעַל אֵל
  choice: దేవుడు ఎంత గొప్ప కార్యం చేశాడు!
  rationale: מַהను ఇక్కడ ప్రశ్నార్థకంగా కాక ఆశ్చర్యార్థక తీవ్రతతో గ్రహించడం ప్రవచనపు ఉత్సవ స్వరానికి సరిపోతుంది. తెలుగులో కేవలం ‘దేవుడు ఏమి చేశాడు!’ అనడం అసహజంగా లేదా ప్రశ్నలా వినిపించవచ్చు కాబట్టి ‘ఎంత గొప్ప కార్యం’ అని సహజంగా వ్యక్తీకరించబడింది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఈ సందర్భంలో సాధారణ దైవ బిరుదుగా ఉంది; ‘సర్వశక్తిమంతుడు’ వంటి విస్తరణకు తక్షణ సందర్భంలో ఆధారం లేదు.
theological_decisions:
- issue: ఈ వాక్యం ఇశ్రాయేలులో గూఢాచారాలు లేవని చెబుతుందా, లేక అవి ఇశ్రాయేలుకు వ్యతిరేకంగా ఫలించవని చెబుతుందా?
  choice: శకునవిచారణ, మంత్రవిద్య యాకోబు/ఇశ్రాయేలుకు వ్యతిరేకంగా ఫలించవని ప్రధాన పాఠంలో వ్యక్తం చేయబడింది.
  alternative: యాకోబులో శకునవిచారణ లేదు; ఇశ్రాయేలులో మంత్రవిద్య లేదు.
  rationale: బిలాము ప్రవచనంలో ఇశ్రాయేలును శపించలేకపోవడం, దేవుని ఆశీర్వాదాన్ని గూఢశక్తులు మార్చలేకపోవడం ప్రధాన సందర్భం. అయినా హీబ్రూ ఉపసర్గలోని నిజమైన అస్పష్టతను పాదటిప్పణి కాపాడుతుంది.
- issue: מַה פָּעַל אֵל ప్రశ్నా లేక ఆశ్చర్యార్థక ప్రకటననా?
  choice: దేవుని గొప్ప కార్యాన్ని ప్రకటించే ఆశ్చర్యార్థక వాక్యంగా అనువదించబడింది.
  alternative: ‘దేవుడు ఏమి చేశాడు?’ అనే ప్రశ్నార్థక పఠనం.
  rationale: ప్రవచనపు శిఖరంలో దేవుని కార్యాన్ని బహిరంగంగా కొనియాడే భావానికి ఆశ్చర్యార్థక పఠనం మెరుగ్గా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సమాంతర నిర్మాణం, ప్రవచన స్వరం నిలుపబడ్డాయి. ‘ఫలించదు’ అనేది సందర్భానుసారంగా జోడించిన భావవ్యక్తీకరణ; అది గూఢాచారాల ఉనికిని మాత్రమే కాక ఇశ్రాయేలుపై వాటి అసమర్థతను తెలియజేస్తుంది.
