id: NUM.23.1
reference: Numbers 23:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: te
  text: అప్పుడు బిలాము బాలాకుతో, “నాకోసం ఇక్కడ ఏడు బలిపీఠాలు కట్టు; నాకోసం ఇక్కడ ఏడు ఎద్దులను, ఏడు పొట్టేళ్లను సిద్ధం చేయి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּלְעָם ... אֶל בָּלָק
  choice: బిలాము బాలాకుతో
  rationale: వ్యక్తి పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించి, మాట చెప్పబడిన వ్యక్తిని ‘తో’ ద్వారా సహజంగా సూచించాం.
- source_word: בְּנֵה לִי
  choice: నాకోసం ... కట్టించు
  rationale: సందర్భంలో బాలాకు స్వయంగా నిర్మించడం కంటే నిర్మింపజేయడం సహజం; ‘నాకోసం’ לִי యొక్క ప్రయోజనార్థాన్ని నిలుపుతుంది.
- source_word: בָּזֶה
  choice: ఇక్కడ
  rationale: అక్షరార్థంగా ‘ఈ [స్థలంలో]’; స్థలసూచనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. మూలంలోని రెండు పునరుక్తులనూ నిలిపాం.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: ఏడు బలిపీఠాలు
  rationale: సంఖ్యను, ఆరాధనా సందర్భంలోని ‘బలిపీఠాలు’ అనే ఖచ్చితమైన పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְהָכֵן לִי
  choice: నాకోసం ... సిద్ధం చేయించు
  rationale: హిఫీల్ ఆజ్ఞారూపం వస్తువులను సిద్ధంగా ఉంచే కారక భావాన్ని కలిగి ఉంది; ‘సిద్ధం చేయించు’ సందర్భానికి సహజం.
- source_word: שִׁבְעָה פָרִים
  choice: ఏడు ఎద్దులను
  rationale: פַּר బలి సందర్భంలో మగ పశువును సూచిస్తుంది; మూలంలో వయస్సు స్పష్టంగా లేకపోవడంతో ‘కోడెదూడలు’ అని ప్రత్యేకీకరించలేదు.
- source_word: וְשִׁבְעָה אֵילִים
  choice: ఏడు పొట్టేళ్లను
  rationale: אֵילִים మగ గొర్రెలను సూచిస్తుంది; ‘పొట్టేళ్లు’ ఆధునిక తెలుగులో సహజమైన, నిర్దిష్టమైన రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఇక్కడ’ అనే స్థలసూచన పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. వివరణ అవసరమైన పాఠాంతరమో నిజమైన అర్థసందిగ్ధతో లేకపోవడంతో పాదటిప్పణి ఇవ్వలేదు.
