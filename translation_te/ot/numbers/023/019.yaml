source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: te
  text: దేవుడు అబద్ధం చెప్పడానికి మనిషి కాడు; మనసు మార్చుకోవడానికి మానవుడు[a] కాడు. ఆయన చెప్పి దానిని చేయకుండా ఉంటాడా? ఆయన పలికి దానిని నెరవేర్చకుండా[b] ఉంటాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హీబ్రూలో ఉన్న ‘మనిషి కుమారుడు’ అనే పదబంధం ఒక మానవుణ్ణి సూచించే నుడి; ఇది మెస్సీయను సూచించే బిరుదు కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘దానిని స్థిరపరచకుండా.’ హీబ్రూలో అక్షరార్థంగా ‘దానిని నిలిచేలా చేయడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఈ పదం ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; మనిషితో ఉన్న వ్యత్యాసంలో ‘దేవుడు’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: אִישׁ
  choice: మనిషి
  rationale: దేవునికీ మానవునికీ మధ్యనున్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וִיכַזֵּב
  choice: అబద్ధమాడడానికి
  rationale: כזב అనే క్రియలోని అబద్ధం చెప్పడం లేదా నమ్మకద్రోహిగా తేలడం అనే భావాల్లో, దేవుని విశ్వసనీయతను చెప్పే ఈ సందర్భంలో ‘అబద్ధమాడడం’ నేరుగా సరిపోతుంది.
- source_word: בֶן אָדָם
  choice: నరపుత్రుడు
  rationale: ‘మనిషి కుమారుడు’ అనే హీబ్రూ కవితాత్మక సమాంతరాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఇక్కడ దీని అర్థం సాధారణ మానవుడే అని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וְיִתְנֶחָם
  choice: మనసు మార్చుకోవడానికి
  rationale: נחם హిత్పయేల్ రూపం ఇక్కడ ఉద్దేశాన్ని మార్చుకోవడం లేదా వెనక్కి తగ్గడం అనే భావాన్ని ఇస్తుంది; నైతిక పశ్చాత్తాపాన్ని సూచించకుండా ఆధునిక తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: הַהוּא אָמַר
  choice: ఆయన చెప్పి
  rationale: హీబ్రూ వాక్య నిర్మాణం తరువాతి నిషేధ ప్రశ్నతో కలిసి అలంకారిక ప్రశ్నగా పనిచేస్తుంది; తెలుగులో ‘చెప్పి చేయకుండా ఉంటాడా?’ సహజంగా అదే బలాన్ని ఇస్తుంది.
- source_word: יַעֲשֶׂה
  choice: చేయకుండా ఉంటాడా
  rationale: ఆయన చెప్పిన దానిని కార్యరూపంలో పెట్టడమే ఇక్కడ అంతర్భూత కర్మ; ఈ రూపం అలంకారిక ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְדִבֶּר
  choice: ఆయన పలికి
  rationale: మొదటి పాదంలోని ‘చెప్పి’తో సమాంతరతను నిలుపుతూ, పలికిన మాట లేదా వాగ్దానాన్ని సూచిస్తుంది.
- source_word: יְקִימֶנָּה
  choice: దానిని నిలబెట్టకుండా
  rationale: קום హిఫీల్‌లోని ‘నిలిచేలా చేయడం’ అనే దృశ్యరూపాన్ని నిలుపుతూ, పలికిన మాటను అమలు చేయడం లేదా నెరవేర్చడం అనే సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: וְיִתְנֶחָם లో దేవుని మార్పుకు సంబంధించిన భాష
  choice: మనసు మార్చుకోవడానికి
  alternative: వెనక్కి తగ్గడానికి; పశ్చాత్తాపపడడానికి
  rationale: వాక్యం దేవుని విశ్వసనీయతను చంచలమైన మానవ ప్రవర్తనతో వ్యత్యాసపరుస్తుంది. ఈ ఎంపిక నైతిక పశ్చాత్తాపాన్ని దేవునికి ఆపాదించదు; అదే సమయంలో పాఠ్యం చెప్పేదానికంటే విస్తృతమైన తాత్త్విక సిద్ధాంతాన్ని చొప్పించదు.
- issue: בֶן אָדָם ను మెస్సీయ బిరుదుగా పరిగణించాలా
  choice: సాధారణ మానవుణ్ణి సూచించే కవితాత్మక పదబంధం
  alternative: మెస్సీయ బిరుదు
  rationale: సంఖ్యాకాండము 23:19లో ఇది ‘మనిషి’కి సమాంతరంగా వచ్చిన సాధారణ హీబ్రూ మానవ సూచన; ఇక్కడ బిరుదు భావాన్ని దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక శైలి. రెండు సమాంతర అలంకారిక ప్రశ్నలను నిలిపి, దేవుని విశ్వసనీయతపై పాఠ్య బలాన్ని కాపాడింది.
