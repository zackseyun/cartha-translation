source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר ק֤וּם בָּלָק֙ וּֽ/שֲׁמָ֔ע הַאֲזִ֥ינָ/ה עָדַ֖/י בְּנ֥/וֹ צִפֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: te
  text: 'అప్పుడు అతడు తన గంభీర పలుకును[a] ఎత్తి ఇలా అన్నాడు: “బాలాకూ, లేచి విను; సిప్పోరు కుమారుడా, నా మాట ఆలకించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గంభీర పలుకు” అనే చోట “సామెతవంటి పలుకు” లేదా “గంభీర ప్రకటన” అని కూడా అనువదించవచ్చు. హీబ్రూ מָשָׁל (మాషాల్) అనే పదం సామెతను, రూపకాలంకార పలుకును, లేదా ఉన్నతమైన కవితాత్మక ప్రకటనను సూచించవచ్చు; ఇక్కడ అది బిలాము పలికిన గంభీరమైన కవితాత్మక ఉచ్చారణను పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: తన కావ్యవాక్యాన్ని ఎత్తుకొని
  rationale: నשׂא + מָשָׁל అనే హీబ్రూ ప్రయోగం గంభీరమైన కవితాత్మక పలుకును ప్రారంభించడాన్ని సూచిస్తుంది. ‘ఎత్తుకొని’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘కావ్యవాక్యం’ ఈ సందర్భంలోని ఉన్నత శైలిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ కథన రూపం; తెలుగులో సహజంగా ఉంటుంది.
- source_word: קוּם
  choice: లేచి
  rationale: బాలాకును ఉద్దేశించిన ఆజ్ఞ. ‘లేచి’ గంభీరతను కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וּשֲׁמָע
  choice: విను
  rationale: తరువాతి הַאֲזִינָהతో ఉన్న సమాంతరతను నిలుపుతూ మొదటి క్రియను సరళంగా ‘విను’ అని అనువదించింది.
- source_word: הַאֲזִינָה עָדַי
  choice: నా మాట ఆలకించు
  rationale: ఈ రూపం శ్రద్ధగా చెవియొగ్గి వినడాన్ని సూచిస్తుంది. ‘ఆలకించు’ మొదటి ‘విను’ కంటే బలమైన శ్రద్ధను, కవితాత్మక స్వరాన్ని తెలియజేస్తుంది; ‘నా మాట’ తెలుగులో సహజంగా దిశను వ్యక్తం చేస్తుంది.
- source_word: בְּנוֹ צִפֹּר
  choice: సిప్పోరు కుమారుడా
  rationale: సంబోధనను స్పష్టంగా చూపిస్తూ హీబ్రూ పితృనామ రూపాన్ని నిలుపుతుంది.
