id: NUM.23.5
reference: Numbers 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: te
  text: అప్పుడు యహ్వే బిలాము నోటిలో ఒక మాటను ఉంచి, “బాలాకు తిరిగి వెళ్లు; ఇలా నీవు మాట్లాడాలి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచి
  rationale: שׂוּם అనే క్రియకు ‘ఉంచు, పెట్టు’ అనే అర్థాలున్నాయి. ‘నోటిలో మాటను ఉంచడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణంగా గుర్తించగల లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: דָּבָר
  choice: ఒక మాటను
  rationale: ఏకవచనాన్ని, అలాగే దేవుడు పలకవలసిన మాటను ప్రసాదించాడనే మూలభాషా ప్రయోగాన్ని కాపాడుతుంది; ‘సందేశం’ అనేది సాధ్యమైనా కొంత వివరణాత్మకం.
- source_word: בְּפִי בִלְעָם
  choice: బిలాము నోటిలో
  rationale: మూలంలోని ‘బిలాము నోటిలో’ అనే సజీవ రూపకాన్ని యథాతథంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: שׁוּב אֶל בָּלָק
  choice: బాలాకు దగ్గరకు తిరిగి వెళ్లు
  rationale: שׁוּב యొక్క తిరిగి వెళ్లే భావాన్నీ, אֶל సూచించే గమ్యాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְכֹה תְדַבֵּר
  choice: నీవు ఈ విధంగా మాట్లాడాలి
  rationale: כֹה లోని ‘ఈ విధంగా/ఇలా’ అనే భావాన్ని, תְדַבֵּר లోని ఆజ్ఞాత్మక బలాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘నోటిలో ఒక మాటను ఉంచి’ అనే సెమిటిక్ రూపకాన్ని దాని ప్రవచనాత్మక బలాన్ని కాపాడేందుకు నిలిపాం.
