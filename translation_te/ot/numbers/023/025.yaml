source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם גַּם קֹ֖ב לֹ֣א תִקֳּבֶ֑/נּוּ גַּם בָּרֵ֖ךְ לֹ֥א תְבָרֲכֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: te
  text: 'బాలాకు బిలాముతో అన్నాడు: “అతన్ని అసలు శపించకు; అసలు దీవించకు!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “శపించడం—అతన్ని శపించకు ... దీవించడం—అతన్ని దీవించకు” అని ఉంది. ప్రతి భాగంలో క్రియానామక అవ్యయం తరువాత సమాపక క్రియ రావడం బలమైన ఉద్ఘాటనను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר בָּלָק אֶל בִּלְעָם
  choice: బాలాకు బిలాముతో ఇలా అన్నాడు
  rationale: వావ్-క్రమ కథన రూపాన్ని తెలుగు కథన ప్రవాహంలో సహజంగా వ్యక్తం చేస్తూ, పలికిన మాటలను పరిచయం చేయడానికి ‘ఇలా అన్నాడు’ వాడబడింది.
- source_word: גַּם ... גַּם
  choice: '...; ...'
  rationale: రెండు సమాంతర నిషేధాలను తెలుగులో సమతుల్యంగా ఉంచడం ద్వారా ‘ఇదీ చేయకు, అదీ చేయకు’ అనే భావం స్పష్టమవుతుంది; హెబ్రీ గַּם‌ను యాంత్రికంగా ‘కూడా’ అని రెండుసార్లు అనువదించలేదు.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: అతణ్ణి అసలు శపించకు
  rationale: קבב అంటే ఈ సందర్భంలో శపించడం. క్రియానామక అవ్యయం తరువాత పరిమిత క్రియ రావడం వల్ల కలిగే బలమైన నిషేధాన్ని ‘అసలు ...కు’ సహజంగా తెలియజేస్తుంది.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: అసలు దీవించకూ
  rationale: ברךను ‘దీవించు’గా అనువదించాం. ముందటి భాగానికి సమాంతరంగా ఉన్న బలమైన నిషేధాన్ని ‘అసలు’ నిలుపుతుంది; ‘దీవించకూ’ రెండో నిషేధానికి సహజమైన తెలుగు సమన్వయ రూపం.
