translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. మూలంలోని రెండు సమాంతర ఉద్ఘాటనలను ‘అసలు’ పునరావృతితో నిలిపాం; వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘బాలాకు’, ‘బిలాము’గా ఇచ్చాం.
