id: NUM.23.17
reference: Numbers 23:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: te
  text: 'అతడు అతని దగ్గరికి వచ్చాడు. ఇదిగో, అతడు తన దహనబలి దగ్గర నిలబడి ఉన్నాడు; మోయాబు అధిపతులు[a] అతనితో ఉన్నారు. బాలాకు అతనితో ఇలా అన్నాడు: “యాహ్వే ఏమి పలికాడు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోయాబు అధికారులు.”
    reason: שָׂרֵי అనే పదానికి ‘అధిపతులు,’ ‘అధికారులు,’ ‘నాయకులు’ అనే భావాలు ఉండవచ్చు.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: అతడు అతని దగ్గరికి వచ్చాడు
  rationale: בוא అనే క్రియకు ప్రాథమిక అర్థం ‘రావడం.’ సందర్భంలో బిలాము తిరిగి వస్తున్నప్పటికీ, మూలపాఠం ‘అతని దగ్గరికి వచ్చాడు’ అని మాత్రమే చెబుతుంది; కాబట్టి ‘తిరిగి వచ్చాడు’ అనే సందర్భార్థాన్ని పాఠ్యంలో చేర్చలేదు.
- source_word: וְהִנּוֹ
  choice: ఇదిగో
  rationale: తరువాతి దృశ్యంపై పాఠకుని దృష్టిని ఆకర్షించే హీబ్రూ సంభాషణ సూచకంలోని సజీవతను నిలుపుతుంది.
- source_word: נִצָּב
  choice: నిలబడి ఉన్నాడు
  rationale: భూతకాలంలోని కొనసాగుతున్న స్థితిని సూచించే కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל עֹלָתוֹ
  choice: తన దహనబలి దగ్గర
  rationale: ఈ సందర్భంలో עַל స్థలసంబంధంగా ‘దగ్గర/ప్రక్కన’ అనే భావాన్ని ఇస్తుంది; ‘దగ్గర’ అనేది అతడు బలి మీద ఉన్నాడనే అపార్థం లేకుండా సహజంగా ఉంది.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: మోయాబు అధిపతులు అతనితో ఉన్నారు
  rationale: שָׂרִים పాలకులు, అధిపతులు లేదా అధికారులు అనే విస్తృత భావం కలిగిన పదం. రాజసభ నేపథ్యానికి ‘అధిపతులు’ సరిపోతుంది; ‘అధికారులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַה דִּבֶּר
  choice: ఏమి పలికాడు?
  rationale: దైవిక వాక్కు సందర్భంలో דבר యొక్క ‘మాట్లాడు/పలుకు’ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: పురుష సర్వనామాల సూచిత వ్యక్తులు
  choice: మూలంలోని ‘అతడు/అతని’ రూపాలను నిలుపుకోవడం
  alternative: ‘బిలాము బాలాకు దగ్గరికి వచ్చాడు; బాలాకు...’ అని పేర్లను స్పష్టంగా చేర్చడం
  rationale: సందర్భం వ్యక్తులను గుర్తించడానికి సహాయపడినా, ఈ వాక్యంలోని హీబ్రూ పాఠం మొదటి భాగంలో పేర్లకు బదులు సర్వనామాలనే వాడుతుంది. అనువాదం ఆ రూపాన్ని, దానిలోని స్వల్ప సూచనాత్మక అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఇదిగో’ ద్వారా హీబ్రూ వాక్యంలోని దృశ్యాత్మక ఉద్ఘాటనను నిలిపాం. పాదసూచిక గుర్తును దాని సంబంధిత పదమైన ‘అధిపతులు’ వెంట ఉంచాం.
