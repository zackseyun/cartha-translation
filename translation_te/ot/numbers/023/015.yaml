id: NUM.23.15
reference: Numbers 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: te
  text: అతడు బాలాకుతో, “నీవు నీ దహనబలి పక్కన ఇక్కడ నిలబడు; నేను అక్కడికి వెళ్లి కలుసుకుంటాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అక్కడ కలుసుకుంటాను,” లేదా “నేను అక్కడ ఎదురుపడతాను.” హీబ్రూ క్రియ సంక్షిప్తంగా ఉంది; ఎవరిని కలుసుకుంటాడో ఈ వచనంలో స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: అతడు బాలాకుతో ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ wayyiqtol నిర్మాణాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందిస్తుంది; కర్తను సందర్భానుసారంగా ‘అతడు’గా ఉంచుతుంది.
- source_word: הִתְיַצֵּב
  choice: నిలబడు
  rationale: Hitpael ఆజ్ఞారూపం ఒక చోట స్థానం తీసుకొని నిలబడడాన్ని సూచిస్తుంది; ‘నిలబడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: כֹּה
  choice: ఇక్కడ
  rationale: మొదటి כֹּה బాలాకు నిలవవలసిన ప్రదేశాన్ని సూచించే స్థలవాచక సంకేతపదం.
- source_word: עַל עֹלָתֶךָ
  choice: నీ దహనబలి పక్కన
  rationale: עַל ఇక్కడ ‘దగ్గర/పక్కన’ అనే స్థాన సంబంధాన్ని తెలియజేస్తుంది; עֹלָה పూర్తిగా దహనం చేసే బలిని సూచిస్తుంది.
- source_word: וְאָנֹכִי
  choice: నేను
  rationale: స్పష్టంగా ఉన్న ప్రథమ పురుష సర్వనామం బాలాకు చేయవలసినదానికీ వక్త చేయబోయేదానికీ మధ్య స్వల్ప వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: אִקָּרֶה
  choice: కలుసుకోవడానికి వెళ్తాను
  rationale: קרה Niphal రూపం ఇక్కడ దైవిక సన్నిధిని ఎదుర్కొనేందుకు వెళ్లడాన్ని సందర్భం సూచిస్తుంది; తెలుగు సహజత్వం కోసం గమన భావాన్ని స్పష్టంగా వ్యక్తపరుస్తూ, అస్పష్ట కర్మను పాదసూచికలో గుర్తిస్తుంది.
- source_word: כֹּה
  choice: అక్కడ
  rationale: రెండవ כֹּה బాలాకు ఉన్న ‘ఇక్కడ’కు భిన్నమైన ప్రదేశాన్ని సూచిస్తుంది; ‘ఇక్కడ/అక్కడ’ వ్యత్యాసం మూలంలోని ద్వంద్వ సంకేతాన్ని కాపాడుతుంది.
theological_decisions:
- issue: బిలాము కలుసుకోబోయే వ్యక్తి మూలపాఠంలో ప్రత్యక్షంగా పేర్కొనబడలేదు
  choice: ప్రధాన పాఠంలో ‘ఆయనను’ అని సందర్భసిద్ధమైన వ్యక్తిగత కర్మను వాడి, పాదసూచికలో హీబ్రూ సంక్షిప్తతను తెలియజేయడం
  alternative: ‘అక్కడ కలుసుకుంటాను’ లేదా ‘అక్కడ నాకు ఎదురవుతుంది’ అని కర్మను పేర్కొనకుండా అనువదించడం
  rationale: సందర్భం యెహోవాతో దైవిక భేటీని సూచించినా, ఈ వచనం కర్మను పేరుతో చెప్పదు. ‘ఆయనను’ తెలుగు వాక్యాన్ని సహజంగా చేస్తుంది; పాదసూచిక అసలు పాఠంలోని నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దహనబలి’ బైబిలు బలిపద్ధతికి ఖచ్చితమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే పదం. మూలంలోని ‘ఇక్కడ/అక్కడ’ స్థల వ్యత్యాసం మరియు కలయికకు సంబంధించిన సంక్షిప్తత పాదసూచికతో నిలుపబడ్డాయి.
