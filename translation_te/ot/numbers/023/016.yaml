revisions:
- from: యెహోవా బిలామును కలుసుకొని, అతని నోటిలో ఒక మాట ఉంచి[a], “బాలాకు దగ్గరకు తిరిగి వెళ్లి, ఈ విధంగా మాట్లాడు” అని చెప్పాడు.
  to: 'యాహ్వే బిలామును కలిశాడు[a], అతని నోటిలో ఒక మాటను ఉంచాడు, ఇలా చెప్పాడు: “తిరిగి బాలాకు వెళ్లి, ఈ విధంగా మాట్లాడు.”'
  rationale: The revision aligns the Telugu divine name with the source and the English POB audit trail, changes the narrative actions to finite verbs, and retains the Hebrew idiom and command structure in natural modern standard Telugu. The footnote remains anchored to the encounter verb and preserves the lexical ambiguity without implying a vision.
