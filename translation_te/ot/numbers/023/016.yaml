id: NUM.23.16
reference: Numbers 23:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: te
  text: 'యాహ్వే బిలామును కలిశాడు[a], అతని నోటిలో ఒక మాటను ఉంచాడు, ఇలా చెప్పాడు: “తిరిగి బాలాకు వెళ్లి, ఈ విధంగా మాట్లాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బిలాముకు ఎదురుపడ్డాడు’ లేదా ‘బిలాము వద్దకు వచ్చాడు.’
    reason: וַיִּקָּר క్రియకు సందర్భానుసారంగా ‘కలిశాడు,’ ‘ఎదురుపడ్డాడు,’ లేదా ‘వద్దకు వచ్చాడు’ అనే భావాలు ఉండవచ్చు.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: కలుసుకొని
  rationale: קָרָה ఇక్కడ నేరుగా ఎదురుపడడం లేదా కలుసుకోవడం అనే భావాన్ని ఇస్తుంది. ‘కలుసుకొని’ సహజమైన తెలుగులో ఆ ప్రత్యక్ష సమాగమ భావాన్ని ఉంచుతుంది; దర్శనమిచ్చాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: అతని నోటిలో ఒక మాట ఉంచి
  rationale: దేవుడు పలకవలసిన మాటను ఇచ్చాడని తెలిపే హెబ్రీయుల జాతీయాన్ని, ఏకవచనమైన דָּבָרను కాపాడుతూ దగ్గరగా అనువదించాం.
- source_word: דָּבָר
  choice: ఒక మాట
  rationale: ఇక్కడ బిలాము తెలియజేయవలసిన నిర్దిష్ట దైవవాక్కును సూచిస్తుంది. ‘సందేశం’ సాధ్యమైనప్పటికీ మరింత వ్యాఖ్యాత్మకంగా ఉంటుంది.
- source_word: שׁוּב אֶל בָּלָק
  choice: బాలాకు దగ్గరకు తిరిగి వెళ్లి
  rationale: ఈ ఆజ్ఞ బిలాము బాలాకు దగ్గరకు మళ్లీ వెళ్లాలని సూచిస్తుంది. తెలుగులో గమ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: וְכֹה תְדַבֵּר
  choice: ఈ విధంగా మాట్లాడు
  rationale: כֹה తరువాత చెప్పబోయే మాటల విధానాన్ని లేదా విషయాన్ని పరిచయం చేస్తుంది. ‘ఈ విధంగా మాట్లాడు’ మూలార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో మార్చకుండా తెలుగులో పరిచయమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: దేవుడు బిలాముకు ఇచ్చిన పలుకుబడి స్వరూపం
  choice: అతని నోటిలో ఒక మాట ఉంచి
  alternative: అతనికి ఒక సందేశం ఇచ్చి
  rationale: మూలంలోని ప్రవచనాత్మక జాతీయాన్ని నిలిపి, బిలాము పలకబోయే మాట దేవునిచేత ఇవ్వబడిందనే ఉద్వేగాన్ని కాపాడాం; దాని ప్రక్రియను మరింత వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ప్రవచనాత్మక జాతీయాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
