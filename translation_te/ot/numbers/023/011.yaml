source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: te
  text: 'అప్పుడు బాలాకు బిలాముతో ఇలా అన్నాడు: “నీవు నాకు చేసినదేమిటి? నా శత్రువులను శపించడానికి నిన్ను తీసుకొచ్చాను. కాని ఇదిగో, నీవు వారిని ఆశీర్వదించావే![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘ఆశీర్వదించి ఆశీర్వదించావు’ అనే ఉద్ఘాటనాత్మక నిర్మాణం ఉంది; దీనిని ‘నీవు నిజంగానే ఆశీర్వదించావు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా కాలక్రమాన్ని తెలియజేస్తుంది.
- source_word: מֶה עָשִׂיתָ לִי
  choice: నీవు నాకు చేసినదేమిటి?
  rationale: ప్రశ్నలోని నిందాభావాన్ని నిలుపుతూ, హీబ్రూ పదబంధానికి దగ్గరగా ఉండే సహజమైన తెలుగు రూపం.
- source_word: לָקֹב
  choice: శపించడానికి
  rationale: ఈ సందర్భంలో קבב శాపం పలకడాన్ని సూచిస్తుంది; ‘శపించు’ స్పష్టమైన సాధారణ తెలుగు సమానం.
- source_word: אֹיְבַי
  choice: నా శత్రువులను
  rationale: బహువచన స్వామ్యరూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: לְקַחְתִּיךָ
  choice: నిన్ను తీసుకొచ్చాను
  rationale: לקח యొక్క ‘తీసుకొను’ భావాన్ని నిలుపుతూ, బాలాకు బిలామును ఈ కార్యం కోసం అక్కడికి తీసుకొచ్చిన సందర్భాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘కూలికి పెట్టుకున్నాను’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: וְהִנֵּה
  choice: కాని ఇదిగో
  rationale: హీబ్రూ పదంలోని ఆకస్మిక గమనార్హతను ‘ఇదిగో’ నిలుపుతుంది; సందర్భంలోని విరుద్ధతను ‘కాని’ స్పష్టం చేస్తుంది.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: నీవు వారిని తప్పక ఆశీర్వదించావు
  rationale: సమాపక క్రియతో కూడిన infinitive absolute ఇచ్చే ఉద్ఘాటనను ‘తప్పక’ తెలియజేస్తుంది. హీబ్రూలో కర్మ అంతర్లీనంగా ఉన్నందున సందర్భానుసారంగా ‘వారిని’ చేర్చబడింది.
