translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఇదిగో’ మూలంలోని הִנֵּה భావాన్ని నిలుపుతుంది; ‘తప్పక’ హీబ్రూ ఉద్ఘాటనాత్మక నిర్మాణాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
