  text: וַ/יָּ֣שָׁב אֵלָ֔י/ו וְ/הִנֵּ֥ה נִצָּ֖ב עַל עֹלָת֑/וֹ ה֖וּא וְ/כָל שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: te
  text: అప్పుడు అతడు అతని దగ్గరికి తిరిగి వచ్చాడు. ఇదిగో, అతడు తన దహనబలి పక్కన నిలబడి ఉన్నాడు—అతడూ మోయాబు అధిపతులందరూ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: అప్పుడు అతడు అతని దగ్గరికి తిరిగి వచ్చాడు
  rationale: హీబ్రూ వాక్యంలోని పురుష సర్వనామాల అస్పష్టతను అలాగే ఉంచుతూ, సహజమైన తెలుగు ప్రయోగాన్ని వాడింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యంగా కనిపించిన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సూచనను ప్రత్యక్షంగా నిలిపింది.
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: తన దహనబలి పక్కన నిలబడి ఉన్నాడు
  rationale: נצב యొక్క స్థిరంగా నిలిచి ఉండే భావాన్ని, על యొక్క సందర్భానుగుణ సమీపార్థాన్ని, עֹלָה అనే సంపూర్ణ దహనబలి పదాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי מוֹאָב
  choice: మోయాబు అధిపతులు
  rationale: שָׂרִים అనే పదం ఇక్కడ రాజసభకు చెందిన ఉన్నత నాయకులను సూచిస్తుంది; 'అధిపతులు' ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. బిలాము, బాలాకు అనే పేర్లను చేర్చి మూలంలోని సర్వనామ అస్పష్టతను తొలగించలేదు. ఎమ్ డాష్ చివరి సమూహాన్ని ప్రధాన కర్తతో బలంగా అనుసంధానిస్తుంది.
