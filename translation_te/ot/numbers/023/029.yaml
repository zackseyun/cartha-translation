  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: te
  text: అప్పుడు బిలాము బాలాకుతో, “ఇక్కడ నా కోసం ఏడు బలిపీఠాలు కట్టు; ఇక్కడ నా కోసం ఏడు ఎద్దులను, ఏడు పొట్టేళ్లను సిద్ధం చేయి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּלְעָם אֶל בָּלָק
  choice: బిలాము బాలాకుతో
  rationale: వ్యక్తి పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించాం; మాట్లాడే వ్యక్తి, సంబోధితుడు స్పష్టంగా ఉండే సహజ తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగించాం.
- source_word: בְּנֵה לִי בָזֶה
  choice: ఇక్కడ నా కోసం ... కట్టించి
  rationale: בָּזֶה అనే స్థలసూచక భావాన్ని ‘ఇక్కడ’గా, לִי అనే ప్రయోజనార్థక భావాన్ని ‘నా కోసం’గా ఇచ్చాం. బలిపీఠాలను బాలాకు తన చేతనే కట్టాడని తప్పనిసరిగా సూచించకుండా, ఏర్పాటుచేయమనే ఆజ్ఞను ‘కట్టించి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: ఏడు బలిపీఠాలు
  rationale: సంఖ్యను, ఆరాధనా సందర్భంలోని מִזְבֵּחַ అర్థాన్ని నేరుగా నిలిపాం.
- source_word: וְהָכֵן לִי בָזֶה
  choice: ఇక్కడ నా కోసం ... సిద్ధం చేయి
  rationale: హిఫిల్ ఆజ్ఞారూపమైన הָכֵן ఇక్కడ బలికోసం జంతువులను సమకూర్చి సిద్ధంగా ఉంచడాన్ని సూచిస్తుంది.
- source_word: שִׁבְעָה פָרִים
  choice: ఏడు ఎద్దులను
  rationale: బలి సందర్భంలో פָרִים మగ పశువులను సూచిస్తుంది. వయస్సును మూలపాఠం ఈ చోట స్పష్టంగా నిర్దేశించనందున ‘కోడెదూడలు’ అని ప్రత్యేకీకరించకుండా ‘ఎద్దులు’ అని ఇచ్చాం.
- source_word: וְשִׁבְעָה אֵילִים
  choice: ఏడు పొట్టేళ్లను
  rationale: אֵילִים అంటే మగ గొర్రెలు; ఆధునిక సాధారణ తెలుగులో ‘పొట్టేళ్లు’ స్పష్టమైన, సహజమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని రెండు సార్ల ‘ఇక్కడ నా కోసం’ అనే నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపి, ఆజ్ఞల సమాంతరత్వాన్ని కాపాడాం.
