  rationale: తెలుగు వ్యాకరణం మరియు సహజ ప్రయోగాన్ని సరిచేస్తూ, హెబ్రీయ కవితా నిర్మాణం, רֹבַע యొక్క ‘నాలుగవ వంతు’ అర్థం, נַפְשִׁי యొక్క ‘నా ప్రాణం,’ మరియు כָּמֹהוּ యొక్క ఏకవచన పుంలింగ సూచనను కాపాడాం. పాదటిప్పణి గుర్తులు మూల ఆడిట్-ట్రెయిల్‌కు అనుగుణంగా అలాగే ఉంచబడ్డాయి; [b] గుర్తు ఈ వచనంలో లేనందున దాని పాదటిప్పణిని సమితిలో నిలిపాం.
