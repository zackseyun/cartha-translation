  source_fidelity: 'మొత్తంగా హెబ్రీయ మూలార్థాన్ని బాగా ప్రతిబింబిస్తుంది: యాకోబు ధూళి, ఇశ్రాయేలు నాలుగవ వంతు, యథార్థవంతుల మరణం, చివరి గమ్యం అనే సమాంతరతలు నిలిచాయి. అయితే כָּמֹהוּలోని ఏకవచన పుంలింగ ప్రత్యయాన్ని తెలుగులో ‘అతనిదానివలె’ అని ఇవ్వడం అసహజం; ‘అతని అంతమువలె’ అనడం మూలంలోని ఏకవచనాన్ని, ఉద్దేశించిన పోలికను స్పష్టంగా కాపాడుతుంది.'
