id: NUM.23.10
reference: Numbers 23:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: te
  text: 'యాకోబు ధూళిని ఎవరు లెక్కించగలరు?

    ఇశ్రాయేలు యొక్క నాలుగవ వంతును[a] ఎవరు లెక్కపెట్టగలరు?

    నా ప్రాణం యథార్థవంతుల మరణాన్ని పొందుగాక;

    నా అంతం అతని అంతమువలె[c] ఉండుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు శిబిర విభాగాలను’; వ్యాఖ్యానాత్మకంగా, ‘ఇశ్రాయేలు నాలుగవ వంతునైనా.’
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీయంలో ‘అతనివలె’ అని ఏకవచనంలో ఉంది. ‘యథార్థవంతులు’ సమూహాన్ని సూచించినప్పటికీ, ఈ ఏకవచనం వారిలో ఒక ప్రతినిధి యథార్థవంతుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: ఎవరు లెక్కించగలరు?
  rationale: מִי అనే ప్రశ్నార్థకం, מָנָה అనే ‘లెక్కించు’ క్రియ కలిసి అసాధ్యతను సూచించే అలంకార ప్రశ్నగా ఉన్నాయి. తెలుగులో ‘గలరు’ చేర్చడం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲפַר יַעֲקֹב
  choice: యాకోబు ధూళి
  rationale: అసంఖ్యాకమైన సంతానాన్ని ధూళితో పోల్చే మూలరూపకాన్ని అలాగే ఉంచుతుంది; కవితా సమాంతరంలో ఉన్న ‘యాకోబు’ అనే పేరును మార్చలేదు.
- source_word: וּמִסְפָּר
  choice: లెక్కపెట్టగలరు
  rationale: ఇది రూపపరంగా నామవాచక ప్రయోగమైనా, ముందున్న מָנָהతో సమాంతరంగా సంఖ్యను నిర్ధారించడాన్ని సూచిస్తుంది. తెలుగులో క్రియారూపం సహజంగా ఉంటుంది.
- source_word: אֶת רֹבַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలులో నాలుగవ భాగాన్ని
  rationale: רֹבַע యొక్క సాధారణ అర్థమైన ‘నాలుగవ భాగం’ను నిలుపుతుంది. ‘ఇశ్రాయేలు సమూహం’ వంటి వ్యాఖ్యానాత్మక పరిష్కారాన్ని ప్రధాన పాఠ్యంలోకి తేవకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: תָּמֹת נַפְשִׁי
  choice: నా ప్రాణం ... మరణం పొందుగాక
  rationale: నేరుగా ‘నా ప్రాణం చనిపోవుగాక’ అనడం తెలుగులో కఠినంగా వినిపిస్తుంది. ‘నా ప్రాణం ... మరణం పొందుగాక’ అనే కవితాత్మక రూపం נַפְשִׁיని స్పష్టంగా నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: מוֹת יְשָׁרִים
  choice: యథార్థవంతుల మరణం
  rationale: יְשָׁרִים అనే పదంలోని నిటారుతనం, నిజాయితీ, సదాచార భావాలను ‘యథార్థవంతులు’ తెలియజేస్తుంది; మరింత వ్యవస్థీకృత న్యాయశాస్త్ర భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: నా అంతం ... ఉండుగాక
  rationale: אַחֲרִיתִי ఇక్కడ మరణంతో సమాంతరంగా వ్యక్తి చివర లేదా తుదిగతిని సూచిస్తుంది. ‘అంతం’ సంక్షిప్తమైన, సహజమైన తెలుగు పదం.
- source_word: כָּמֹהוּ
  choice: అతనిదానివలె
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనం. ముందున్న ‘యథార్థవంతులు’ సమూహార్థక బహువచనమైనప్పటికీ, మూలంలోని ఏకవచన రూపాన్ని ఈ అనువాదం నిలుపుతుంది.
theological_decisions:
- issue: יְשָׁרִים పదానికి అనువాదం
  choice: యథార్థవంతులు
  alternative: నీతిమంతులు
  rationale: ‘యథార్థవంతులు’ అనే పదం ישר యొక్క ‘నిటారైన/సత్యసంధమైన’ మూలభావాన్ని దగ్గరగా ప్రతిబింబిస్తుంది. ‘నీతిమంతులు’ కూడా సాధ్యమే కాని, అది కొన్ని సందర్భాల్లో మరింత నిర్దిష్టమైన సిద్ధాంతపరమైన భావాన్ని మోసుకురావచ్చు.
- issue: רֹבַע יִשְׂרָאֵל యొక్క అర్థం
  choice: ఇశ్రాయేలులో నాలుగవ భాగం
  alternative: ఇశ్రాయేలు జనసమూహం; ఇశ్రాయేలు శిబిర విభాగాలు
  rationale: ‘నాలుగవ భాగం’ మూలపదానికి అత్యంత ప్రత్యక్షమైన అర్థం. సందర్భంలో ఇశ్రాయేలులో నాలుగవ వంతును కూడా లెక్కించలేమనే అతిశయోక్తి కావచ్చు; అయితే ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించలేదు.
- issue: כָּמֹהוּలోని ఏకవచనం
  choice: అతనిదానివలె
  alternative: వారిదానివలె
  rationale: సమూహాన్ని సూచించే ‘యథార్థవంతులు’ తర్వాత మూలంలో ఉన్న ఏకవచన ప్రత్యయాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. అది ఆదర్శ యథార్థవంతుడిని ప్రతినిధిగా సూచించవచ్చు; బహువచనంగా సవరించడం మూలంలోని వ్యాకరణ ఉద్రిక్తతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. రెండు అలంకార ప్రశ్నల సమాంతర నిర్మాణాన్ని స్పష్టంచేశాం. ‘నా ప్రాణం,’ ‘మరణం,’ ‘అంతం’ వంటి మూల కవితా పదాలను నిలుపుతూ, తెలుగులో అసహజమైన పదానువాదాన్ని నివారించాం.
