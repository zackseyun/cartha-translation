  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: te
  text: అప్పుడు బాలాకు బిలాము చెప్పినట్లే చేశాడు; బలిపీఠం మీద ఒక కోడెను, ఒక పొట్టేలును అర్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేసి
  rationale: עשה అనే క్రియ כַּאֲשֶׁר אָמַר అనే నిర్మాణంతో కలిసి ‘చెప్పినట్లే చేయడం’ అనే అర్థాన్ని ఇస్తుంది; తెలుగులో వాక్యప్రవాహానికి ‘చేసి’ సహజంగా ఉంటుంది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లే
  rationale: బిలాము ఇచ్చిన మాట లేదా ఆదేశానికి అనుగుణంగా బాలాకు నడుచుకున్నాడనే పోలికతో కూడిన అనుసరణ భావాన్ని తెలియజేస్తుంది.
- source_word: אָמַר
  choice: చెప్పిన
  rationale: బాలాకు చేసిన కార్యానికి ముందు బిలాము చెప్పిన మాటను సూచిస్తుంది; తెలుగు అసమాపక విశేషణ రూపం కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעַל
  choice: అర్పించాడు
  rationale: עלה ఇక్కడ బలిసంబంధ సందర్భంలో బలిపీఠం మీద బలిని అర్పించడం అనే ప్రత్యేక అర్థంలో వాడబడింది.
- source_word: פָּר
  choice: ఒక కోడెను
  rationale: బలికి ఉపయోగించే మగ పశువును సూచించే ఆధునిక, సులభమైన తెలుగు పదం.
- source_word: אַיִל
  choice: ఒక పొట్టేలును
  rationale: אַיִל సూచించే మగ గొర్రెకు ప్రామాణికమైన, సాధారణ తెలుగు పదం.
- source_word: בַּמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలిని బలిపీఠంపై అర్పించిన స్థలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַ
  choice: కాబట్టి
  rationale: ప్రారంభ వావ్ మునుపటి ఆదేశానికి ఫలితంగా జరిగిన కార్యాన్ని కథనంలో కొనసాగిస్తుంది; ‘కాబట్టి’ ఆ పర్యవసాన సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
