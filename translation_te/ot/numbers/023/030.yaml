translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని బలిసంబంధ పదజాలాన్ని స్పష్టంగా ఉంచుతూ, అనవసరమైన మతపరమైన వివరణను చేర్చలేదు.
