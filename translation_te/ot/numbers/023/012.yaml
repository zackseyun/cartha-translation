  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: te
  text: 'అతడు జవాబిచ్చి ఇలా అన్నాడు: “యహ్వే నా నోట ఉంచేదానినే నేను జాగ్రత్తగా పలకవలసిందే కదా?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా, “యహ్వే నా నోట ఉంచేదానినే పలకడానికి నేను జాగ్రత్తగా కట్టుబడవలసిందే కదా?” అని అనువదించవచ్చు. ఇక్కడి క్రియ ఇచ్చిన మాటలకే జాగ్రత్తగా కట్టుబడి పలకడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: అతడు జవాబుగా ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి అన్నాడు’ అనే జంట క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֲלֹא
  choice: పలకాలి కదా?
  rationale: సమ్మతిని ఆశించే అలంకారప్రశ్నను, అలాగే బాలాము తనపై ఉన్న బాధ్యతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: ఉంచేదానినే
  rationale: సంబంధవాచక నిర్మాణాన్నీ, తిరిగి వచ్చిన కర్మ సర్వనామాన్నీ కలిపి ‘దానినే’ అనే ఉద్ఘాటనతో సహజంగా అందిస్తుంది.
- source_word: יָשִׂים
  choice: ఉంచే
  rationale: ‘నోటిలో ఉంచడం’ అనే దేవుడు పలకవలసిన మాటలను ఇవ్వడాన్ని సూచించే మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- source_word: בְּפִי
  choice: నా నోట
  rationale: హీబ్రూ రూపకాన్ని తెలుగులో స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: జాగ్రత్తగా పలకాలి
  rationale: שׁמר క్రియలోని జాగ్రత్తగా పాటించడం లేదా కట్టుబడి ఉండడం అనే భావాన్ని, దాని అనుబంధ క్రియ ‘పలకడం’తో కలిపి వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా, పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా చూపుతుంది.
- issue: బాలాము మాటల్లోని నిర్బంధం మరియు జాగ్రత్తగా అనుసరించే భావం
  choice: జాగ్రత్తగా పలకాలి కదా?
  alternative: పలకాలి కదా?; పలకకూడదా?
  rationale: הֲלֹא బాధ్యతను సూచించే అలంకారప్రశ్న; אֶשְׁמֹר לְדַבֵּר ఇచ్చిన మాటలకు జాగ్రత్తగా కట్టుబడి పలకడాన్ని సూచిస్తుంది. ఈ పఠనం యాంత్రిక నిర్బంధాన్ని అతిశయింపకుండా రెండు భావాలనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని నోటి రూపకాన్నీ, అలంకారప్రశ్ననూ నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణం ఉపయోగించబడింది.
