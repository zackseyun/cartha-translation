  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: te
  text: బిలాము చెప్పిన ప్రకారం బాలాకు చేశాడు. బాలాకు, బిలాము కలిసి బలిపీఠం మీద ఒక ఎద్దును, ఒక పొట్టేలును అర్పించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పైకి ఎక్కించారు’; బలి సందర్భంలో దీని అర్థం ‘బలిగా అర్పించారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה כאשר דבר అనే ప్రయోగంలో, చెప్పినదాన్ని చేయడం లేదా అమలు చేయడం అనే అర్థం వస్తుంది; ఆధునిక తెలుగులో ‘చేశాడు’ సహజంగా ఉంది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్లే
  rationale: ఈ తులనాత్మక పదబంధం బిలాము చెప్పిన సూచనకు బాలాకు సరిగ్గా అనుగుణంగా చేశాడని తెలియజేస్తుంది.
- source_word: וַיַּעַל
  choice: అర్పించారు
  rationale: עלה ధాతువు హిఫీల్ రూపంలో బలిపశువులు, బలిపీఠం అనే సందర్భంలో ‘పైకి ఎక్కించడం’ అనే అక్షరార్థం నుంచి బలిగా అర్పించడం అనే ఆచారార్థాన్ని ఇస్తుంది.
- source_word: בָּלָק וּבִלְעָם
  choice: బాలాకు, బిలాము కలిసి
  rationale: రెండు సమన్విత కర్తలను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా చూపుతుంది.
- source_word: פָּר
  choice: ఒక ఎద్దును
  rationale: פָּר బలి సందర్భంలో మగ పశువును సూచిస్తుంది; వయస్సును వచనం ప్రత్యేకంగా పేర్కొననందున ‘ఎద్దు’ సరైన సాధారణ పదం.
- source_word: וָאַיִל
  choice: ఒక పొట్టేలును
  rationale: אַיִל మగ గొర్రెను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేలు’ సహజమైన సమానార్థకం.
- source_word: בַּמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలి సందర్భంలో בְּ ఉపసర్గను తెలుగులో ‘మీద’ అని సహజంగా వ్యక్తపరుస్తుంది.
