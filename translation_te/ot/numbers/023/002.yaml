translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని రెండు కర్తలను ‘కలిసి’ అని స్పష్టం చేసి, బలి సంబంధిత క్రియకు పాఠకులకు సులభంగా అర్థమయ్యే ‘అర్పించారు’ అనే పదాన్ని ఎంచుకున్నాం.
