id: NUM.35.34
reference: Numbers 35:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: te
  text: మీరు నివసిస్తున్న దేశాన్ని అపవిత్రపరచకూడదు; దాని మధ్యలో నేను నివసిస్తున్నాను; ఎందుకంటే నేను, యాహ్వేను, ఇశ్రాయేలీయుల[a] మధ్య నివసిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల మధ్య.”
    reason: మూలంలోని בְּתוֹךְ בְּנֵי יִשְׂרָאֵל అనే పదబంధానికి అక్షరార్థ ప్రత్యామ్నాయం; ఇది పురుషలింగ సమూహపదాన్ని మరియు “మధ్య” అనే స్థానార్థాన్ని రెండింటినీ తెలియజేస్తుంది.
lexical_decisions:
- source_word: תְטַמֵּא
  choice: అపవిత్రం చేయకూడదు
  rationale: పియేల్ రూపంలోని טמא ఆచారపరమైన, నైతికమైన అపవిత్రతను కలిగించడం అనే భావాన్ని ఇక్కడ ఇస్తుంది. ‘అపవిత్రం చేయడం’ ఈ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ אֶרֶץ భూమి అంతటినీ కాక, ఇశ్రాయేలు నివసించే నిర్దిష్ట దేశాన్ని సూచిస్తుంది.
- source_word: יֹשְׁבִים בָּהּ
  choice: మీరు నివసిస్తున్న
  rationale: వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న నివాస భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֹׁכֵן
  choice: నివసిస్తున్నాను / నివసించే
  rationale: దేవుని సన్నిధికి సంబంధించిన అంతర్భావాన్ని కాపాడుతూ, సాంకేతికమైన అదనపు భావాన్ని చేర్చకుండా שכן యొక్క ప్రాథమిక అర్థాన్ని ఇస్తుంది.
- source_word: בְּתוֹכָהּ
  choice: దాని మధ్యలో
  rationale: תוך సూచించే లోపలి లేదా మధ్యస్థ సన్నిధిని స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల మధ్య
  rationale: ‘ఇశ్రాయేలు కుమారుల మధ్య’ అనే మూలపదబంధానికి సహజమైన, సమూహాన్ని సూచించే ఆధునిక తెలుగు రూపం; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: దేవుడు దేశం మధ్యలోను ఇశ్రాయేలీయుల మధ్యను నివసించడం
  choice: రెండు నివాస వాక్యాలనూ స్పష్టంగా నిలుపడం
  alternative: రెండింటినీ ఒకే సాధారణ సన్నిధి వాక్యంగా కలపడం
  rationale: మూలంలోని שכן పునరుక్తి దేవుని సన్నిధిని దేశంతోనూ ప్రజలతోనూ అనుసంధానిస్తుంది; ఆ ఉద్రిక్తతను సరళీకరించలేదు.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క లింగరూపం
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలీయులు’; పాదసూచికలో అక్షరార్థం
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: తెలుగులో మొత్తం ఒడంబడిక సమాజాన్ని సహజంగా సూచించేందుకు ‘ఇశ్రాయేలీయులు’ వాడాం; మూలంలోని వ్యాకరణపరమైన పురుషరూపాన్ని పాదసూచికలో పారదర్శకంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని దీర్ఘ సంబంధ నిర్మాణాన్ని తెలుగులో మూడు వాక్యాలుగా విభజించి స్పష్టత పెంచాం; భావసంబంధాన్ని ‘ఎందుకంటే’ ద్వారా నిలిపాం.
