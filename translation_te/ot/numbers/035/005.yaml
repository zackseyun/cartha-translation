  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: te
  text: 'మీరు పట్టణం వెలుపల కొలవాలి: తూర్పు వైపు రెండు వేల మూరలు, దక్షిణం వైపు రెండు వేల మూరలు, పడమర వైపు[a] రెండు వేల మూరలు, ఉత్తరం వైపు రెండు వేల మూరలు; పట్టణం మధ్యలో ఉండగా, ఇవి వారికి పట్టణాల మేతభూములు[b] అవుతాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సముద్రం వైపు’; మధ్యధరా సముద్రం ఉన్న దిశ ఆధారంగా ఇది పడమరను సూచించే సాధారణ దిక్సూచక ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పట్టణాల ఉమ్మడి భూమి’, ‘పట్టణాల చుట్టూ ఉన్న బహిరంగ భూమి’. హీబ్రూ పదం పట్టణాన్ని చుట్టి ఉండే, తరచుగా పశువుల మేతకు ఉపయోగించే భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: మీరు ... కొలవాలి
  rationale: న్యాయనియమ సందర్భంలో సంయోజకంతో వచ్చిన క్రియకు ఆదేశార్థక బలం ఉంది. బహువచన సంబోధనను ‘మీరు’తో నిలిపి, కొలత వేయడమనే స్పష్టమైన చర్యను కాపాడింది.
- source_word: מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల
  rationale: కొలత పట్టణ సరిహద్దుల బయట చేయబడుతుందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פְּאַת
  choice: వైపు
  rationale: నాలుగు దిక్కుల ప్రకారం కొలిచే సందర్భంలో ‘అంచు’ లేదా ‘మూల’ కంటే ‘వైపు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: తూర్పు / దక్షిణం / పడమర / ఉత్తరం
  rationale: దిక్సూచక అర్థాలను నేరుగా అందించింది. יָם అక్షరార్థంగా ‘సముద్రం’ అయినా, ఇక్కడ పశ్చిమ దిశను సూచించే హీబ్రూ వాడుక.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: రెండు వేల మూరలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా, తెలుగులో స్థిరపడిన బైబిలు కొలమాన పదమైన ‘మూర’తో నిలిపింది.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: పట్టణం మధ్యలో ఉండాలి
  rationale: కొలవబడిన నాలుగు వైపుల మధ్య పట్టణం ఉండే ప్రాదేశిక అమరికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: ఇదే వారికి ... అవుతుంది
  rationale: ఈ భూమిని వారి ఉపయోగానికి నియమించే న్యాయపరమైన భావాన్ని నిలిపి, యాజమాన్యాన్ని అవసరానికి మించి నిర్ధారించదు.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: పట్టణాల చుట్టూ ఉన్న మేతభూమి
  rationale: పట్టణాల పరిసరాల్లో పశువుల మేతకు సాధారణంగా ఉపయోగించే బహిరంగ భూమిని సూచిస్తుంది. ‘చుట్టూ ఉన్న’ అనే పదబంధం దాని స్థానాన్ని సహజంగా స్పష్టం చేస్తుంది; ఇతర సాధ్య అర్థాలను పాదటిప్పణిలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయనియమ శైలిని అనుసరించింది. పునరుక్త దిక్కులు, ప్రతి వైపున రెండువేల మూరల కొలత, పట్టణం మధ్యలో ఉండే అమరిక అన్నీ మూలానికి దగ్గరగా నిలిపబడ్డాయి. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు తూర్పు వైపున ఉన్నప్పటికీ దాని గమనిక יָם ‘సముద్రం/పడమర’కు సంబంధించినది కాబట్టి, మూలభాష ఆధారంగా గుర్తును ‘పడమర’ వద్ద ఉంచింది. హీబ్రూలో చివరి పదబంధం బహువచన రూపంలో ఉన్నప్పటికీ తెలుగులో ‘మేతభూమి’ని సమూహార్థక ఏకవచనంగా సహజంగా వ్యక్తం చేసింది.
