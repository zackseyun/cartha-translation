id: NUM.35.16
reference: Numbers 35:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: te
  text: అయితే అతడు ఇనుప పనిముట్టుతో[a] ఒక వ్యక్తిని కొట్టి, ఆ వ్యక్తి చనిపోతే, అతడు హంతకుడు; ఆ హంతకుడు తప్పక మరణశిక్షకు గురి చేయబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇనుప పరికరంతో,’ ‘ఇనుప వస్తువుతో.’ హీబ్రూ పదం విస్తృతార్థకమైనది; అది ప్రత్యేకంగా ఏ ఆయుధాన్నీ పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందున్న న్యాయవిధానానికి భిన్నమైన షరతును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఈ మార్పును తెలియజేస్తుంది.
- source_word: בִּכְלִי בַרְזֶל
  choice: ఇనుప పనిముట్టుతో
  rationale: כְּלִי అనేది వస్తువు, పరికరం, పనిముట్టు వంటి విస్తృతార్థ పదం. మూలంలో ప్రత్యేక ఆయుధపేరు లేనందున ‘పనిముట్టు’ దాని విస్తృతిని కాపాడుతుంది.
- source_word: הִכָּהוּ
  choice: ఒకరిని కొట్టగా
  rationale: נכה హిఫీల్ రూపం ఇక్కడ బలంగా కొట్టడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సర్వనామాల సందిగ్ధత తగ్గించేందుకు బాధితుణ్ణి ‘ఒకరిని’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోతే
  rationale: దెబ్బ తరువాత మరణం సంభవించిన క్రమాన్ని నిలుపుతుంది; మూలంలో లేని అదనపు కారణార్థాన్ని స్పష్టంగా చేర్చదు.
- source_word: רֹצֵחַ הוּא
  choice: కొట్టినవాడు హంతకుడు
  rationale: ఈ న్యాయసందర్భంలో רצח దోషపూరిత హత్యను సూచిస్తుంది. ‘కొట్టినవాడు’ అని కర్తను స్పష్టం చేసి, ‘హంతకుడు’ ద్వారా అతని న్యాయస్థితిని తెలుపుతుంది.
- source_word: מוֹת יוּמַת
  choice: తప్పక మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ మరణదండన యొక్క నిశ్చితమైన, తప్పనిసరి స్వభావాన్ని బలపరుస్తుంది. ఆధునిక న్యాయశైలిలో ఈ పదబంధం సహజంగా ఉంటుంది.
- source_word: הָרֹצֵחַ
  choice: ఆ హంతకుడు
  rationale: నిర్దిష్ట రూపం ముందే హంతకుడిగా గుర్తించిన వ్యక్తినే మళ్లీ సూచిస్తుంది; ‘ఆ’ దీనిని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలో רצח యొక్క న్యాయ వర్గీకరణ
  choice: హంతకుడు
  alternative: నరహంతకుడు / చంపినవాడు
  rationale: అధ్యాయంలోని అనుకోకుండా చంపడం–దోషపూరిత హత్య భేదంలో ఈ వచనం మరణశిక్షకు పాత్రమైన హత్యను పేర్కొంటుంది. ‘హంతకుడు’ ఆ న్యాయ, నైతిక తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టమైన న్యాయశైలి. కర్త–బాధితుడి సర్వనామ సందిగ్ధతను తగ్గిస్తూ మూలంలోని షరతు, సంఘటన క్రమం, శిక్ష యొక్క బలమైన ఆజ్ఞాత్మక భావం నిలుపబడింది.
