source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: te
  text: మీరు యొర్దాను అవతల ఉన్న పట్టణాల్లో మూడింటిని, కనాను దేశంలోని పట్టణాల్లో మూడింటిని నియమించాలి[a]. అవి ఆశ్రయ పట్టణాలుగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు కేటాయించాలి.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘ఇవ్వాలి’ అని అర్థం; ఇక్కడ ఈ ప్రయోజనం కోసం పట్టణాలను కేటాయించడం లేదా నిర్దేశించడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: మీరు నియమించాలి
  rationale: נתן అనే క్రియకు అక్షరార్థంగా ‘ఇవ్వాలి’ అని అర్థం. అయితే ఈ న్యాయపరమైన సందర్భంలో నిర్దిష్ట ప్రయోజనం కోసం పట్టణాలను కేటాయించడం లేదా నియమించడం భావం; ఆధునిక తెలుగులో ‘నియమించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: ఈ పదబంధం యొర్దాను నదికి ఆవలి వైపును సూచిస్తుంది. మూలంలోని సంబంధాత్మక భౌగోళిక భావాన్ని అనవసరంగా నిర్దిష్ట దృక్కోణానికి పరిమితం చేయకుండా ‘అవతల’ నిలుపుతుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: మూలంలో ‘దేశం’ అనే నామవాచకం స్పష్టంగా ఉన్నందున భూభాగ సంబంధమైన ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: עָרֵי מִקְלָט
  choice: ఆశ్రయ పట్టణాలు
  rationale: అనుకోకుండా ఒకరిని చంపిన వ్యక్తికి రక్షణ కల్పించేందుకు ప్రత్యేకంగా ఏర్పాటు చేసిన పట్టణాలను సూచించే న్యాయపరమైన పదబంధం. ‘ఆశ్రయ పట్టణాలు’ స్పష్టమైనది, ఆధునిక రాజకీయ లేదా సంస్థాగత భావాలను దిగుమతి చేయదు.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: పట్టణాల్లో మూడింటిని ... పట్టణాల్లో మూడింటిని
  rationale: నిర్దిష్ట బహువచన నామవాచకం ఇప్పటికే చర్చలో ఉన్న పెద్ద పట్టణ సమూహం నుంచి మూడింటిని చొప్పున సూచిస్తుంది; ‘పట్టణాల్లో మూడింటిని’ ఈ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶינָה
  choice: అవి ... ఉండాలి
  rationale: היה క్రియ యొక్క ఈ రూపం నియమించబడిన ఆరు పట్టణాల ఫలిత స్థితి లేదా విధిని తెలిపే న్యాయపరమైన భావాన్ని కలిగిస్తుంది; ‘ఉండాలి’ తెలుగులో ఆ నిర్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన ఆజ్ఞ స్వరాన్ని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదజాలం ఉపయోగించబడింది. ‘పట్టణాల్లో మూడింటిని’ అనే నిర్మాణం మూలంలోని నిర్దిష్టతను ప్రతిబింబిస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
