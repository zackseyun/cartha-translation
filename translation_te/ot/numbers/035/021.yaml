source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: te
  text: లేదా అతడు శత్రుత్వంతో తన చేతితో అతనిని కొట్టి అతడు చనిపోతే[a], కొట్టినవానికి తప్పక మరణశిక్ష విధించబడాలి; అతడు హంతకుడు. రక్త ప్రతీకారం తీర్చువాడు[b] ఆ హంతకుణ్ణి ఎదుర్కొన్నప్పుడు అతణ్ణి చంపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శత్రుత్వంతో’ అనే మాటకు ‘ద్వేషంతో’ లేదా ‘వైరంతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘రక్తానికి ప్రతీకారం తీర్చే బంధువు’; సాధారణంగా ఈ బాధ్యతను చనిపోయినవాని సమీప బంధువు నిర్వహించేవాడు.
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: శత్రుత్వంతో
  rationale: אֵיבָה శత్రుత్వం, వైరం, ద్వేషభావం అనే ఉద్దేశపూర్వక విరోధాన్ని సూచిస్తుంది. ఆధునిక తెలుగు న్యాయసందర్భంలో ‘శత్రుత్వంతో’ సహజంగా ఉండి, హత్య వెనుకనున్న విరోధపూరిత ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: తన చేతితో అతన్ని కొట్టగా
  rationale: נכה యొక్క సాధారణ అర్థం ‘కొట్టు’; בְיָדוֹ దాడికి ఉపయోగించిన శారీరక సాధనాన్ని స్పష్టంగా పేర్కొంటుంది. ‘తన చేతితో’ అనే రూపం మూలంలోని వివరాన్ని నిలుపుతుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోతే
  rationale: హీబ్రూలో వరుస సంఘటనగా ‘అతడు చనిపోయాడు’ ఉన్నప్పటికీ, ఇది షరతులతో కూడిన న్యాయవాక్య శ్రేణిలో భాగం. తెలుగులో ‘చనిపోతే’ ఆ న్యాయ షరతును సహజంగా వ్యక్తపరుస్తుంది; కారణాన్ని అతిగా వివరించదు.
- source_word: מוֹת יוּמַת
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: క్రియావిశేషక infinitive absolute మరియు నిష్క్రియ క్రియ కలయిక శిక్ష యొక్క నిశ్చితత్వాన్ని బలపరుస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను, ‘మరణశిక్ష విధించాలి’ న్యాయపరమైన భావాన్ని తెలియజేస్తాయి.
- source_word: הַמַּכֶּה
  choice: కొట్టినవాడు
  rationale: ఇది అక్షరార్థంగా ‘కొట్టినవాడు.’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉండి ముందున్న చర్యను స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: רֹצֵחַ הוּא
  choice: అతడు హంతకుడు
  rationale: శత్రుత్వంతో ప్రాణం తీసిన సందర్భం కావడంతో רֹצֵחַ ఇక్కడ ఉద్దేశపూర్వక హత్య చేసినవాణ్ణి సూచిస్తుంది. ‘హంతకుడు’ ఆ నైతిక-న్యాయ వర్గాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చేవాడు
  rationale: ఈ న్యాయపదబంధం చంపబడిన వ్యక్తి రక్తానికి ప్రతీకారం తీర్చే బాధ్యతగల వ్యక్తిని సూచిస్తుంది. ప్రధాన పాఠంలో సంస్థాగత భావాన్ని నిలుపుతూ, బంధుత్వ సంబంధాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: יָמִית
  choice: మరణశిక్ష అమలు చేయాలి
  rationale: మూలక్రియ ‘చంపాలి/మరణానికి గురిచేయాలి’ అని అర్థమిచ్చినా, ఇక్కడ అది ముందే ప్రకటించిన న్యాయశిక్ష అమలును సూచిస్తుంది. ఈ ఎంపిక న్యాయపరమైన సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּפִגְעוֹ בוֹ
  choice: అతన్ని ఎదుర్కొన్నప్పుడు
  rationale: פגע ఇక్కడ ‘కలుసుకొను, ఎదురుపడు’ అనే భావం ఇస్తుంది. ‘ఎదుర్కొన్నప్పుడు’ ఉద్దేశపూర్వకంగా వెదికి పట్టుకున్నాడనే అదనపు భావాన్ని చేర్చకుండా, ఎదురుపడిన సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఉద్దేశపూర్వక ప్రాణహరణానికి న్యాయపరమైన వర్గీకరణ
  choice: హంతకుడు
  alternative: ప్రాణం తీసినవాడు
  rationale: వాక్యంలో శత్రుత్వం స్పష్టంగా పేర్కొనబడినందున, ఇది ప్రమాదవశాత్తు జరిగిన ప్రాణహరణం కాదు. ‘హంతకుడు’ అధ్యాయంలోని ఉద్దేశపూర్వక హత్య—అనుద్దేశ ప్రాణహరణం మధ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- issue: גֹּאֵל הַדָּם అనే ఇశ్రాయేలీయ న్యాయపాత్ర
  choice: రక్తప్రతీకారం తీర్చేవాడు
  alternative: రక్తానికి ప్రతీకారం తీర్చే బంధువు
  rationale: ప్రధాన పాఠం మూలంలోని అధికారిక న్యాయపదాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది. גֹּאֵלలో ఉండగల సమీప బంధువు అనే సామాజిక పాత్రను ప్రధాన పాఠంలో తప్పనిసరిగా చేర్చకుండా పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘మరణశిక్ష విధించాలి/అమలు చేయాలి’ అనే పదజాలం మూలంలోని శిక్ష ప్రకటనను, దాని అమలును వేరు చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
