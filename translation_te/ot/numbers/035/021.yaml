revisions:
- from: లేదా అతడు శత్రుత్వంతో తన చేతితో అతన్ని కొట్టగా అతడు చనిపోతే[a], కొట్టినవాడికి తప్పకుండా మరణశిక్ష విధించాలి; అతడు హంతకుడు. రక్తప్రతీకారం తీర్చేవాడు[b] ఆ హంతకుణ్ణి ఎదుర్కొన్నప్పుడు అతనికి మరణశిక్ష అమలు చేయాలి.
  to: లేదా అతడు శత్రుత్వంతో తన చేతితో అతనిని కొట్టి అతడు చనిపోతే[a], కొట్టినవానికి తప్పక మరణశిక్ష విధించబడాలి; అతడు హంతకుడు. రక్త ప్రతీకారం తీర్చువాడు[b] ఆ హంతకుణ్ణి ఎదుర్కొన్నప్పుడు అతణ్ణి చంపాలి.
  rationale: చివరి వాక్యంలో మూలంలోని క్రియాశీల నిర్మాణాన్ని నిలుపుటకు ‘అతణ్ణి చంపాలి’ అని సవరించబడింది. ఇది ప్రాచీన ఇశ్రాయేలీయ న్యాయవ్యవస్థ వర్ణనను యథాతథంగా తెలియజేస్తుంది; ఆధునిక న్యాయ ప్రక్రియను దానిలో ప్రవేశపెట్టదు. ఇతర పదాలు, షరతు నిర్మాణం, మరియు పాదసూచిక గుర్తులు మూలార్థాన్నీ ఆధునిక తెలుగు శైలినీ సంతులితం చేస్తాయి.
