id: NUM.35.32
reference: Numbers 35:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: te
  text: తన ఆశ్రయ నగరానికి పారిపోయినవాడు[b] యాజకుడు చనిపోయేలోపు తిరిగి వచ్చి దేశంలో నివసించడానికి, మీరు అతని కోసం విమోచన ధరను[a] తీసుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరిహార చెల్లింపు’ లేదా ‘విడిపింపు ధర’ అని కూడా అనువదించవచ్చు. హెబ్రీ כֹּפֶר చట్టపరమైన పరిణామానికి బదులుగా ఇచ్చే ధరను లేదా పరిహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది. దీనిని ‘తన ఆశ్రయ నగరానికి పారిపోవడానికి’ అని కూడా అనువదించవచ్చు; లేదా యాజకుడు చనిపోయే ముందు అతడు ఆశ్రయ నగరంలో ఉండడం లేదా అక్కడి నుంచి తిరిగి రావడంతో సంబంధం ఉన్న చెల్లింపును నిషేధిస్తున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: విమోచన వెల
  rationale: చట్టపరంగా విధించబడిన పరిణామానికి బదులుగా స్వీకరించే విడిపింపు ధర లేదా పరిహార చెల్లింపు అనే భావాన్ని ఇది తెలియజేస్తుంది. ‘లంచం’ అనడం మూలంలో లేని ప్రతికూల ఉద్దేశాన్ని చేర్చుతుంది.
- source_word: לָנוּס אֶל עִיר מִקְלָטוֹ
  choice: తన ఆశ్రయ నగరానికి పారిపోయినవాడు
  rationale: נוּס అనే క్రియ పారిపోవడాన్ని సూచిస్తుంది; עִיר מִקְלָטוֹ అనేది అతనికి నియమించబడిన ఆశ్రయ నగరాన్ని సూచిస్తుంది. హెబ్రీ వాక్యనిర్మాణం సంక్షిప్తంగా ఉన్నందున ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: తిరిగి వచ్చి దేశంలో నివసించడానికి
  rationale: జతగా ఉన్న రెండు క్రియారూపాలు తిరిగి రావడం, మళ్లీ నివసించడం అనే వరుస భావాలను వ్యక్తం చేస్తాయి.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: యాజకుడు చనిపోయేలోపు
  rationale: నిషేధ సందర్భంలో, యాజకుని మరణానికి ముందు తిరిగి నివసించేందుకు చెల్లింపు స్వీకరించకూడదనే కాలపరిమితిని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; మూలంలో ‘యాజకుడు’ మాత్రమే ఉంది, కాబట్టి ‘ప్రధాన యాజకుడు’ అని విస్తరించలేదు.
theological_decisions:
- issue: ఆశ్రయ నగరంతో సంబంధం ఉన్న వ్యక్తి తరఫున చెల్లింపు స్వీకరించడంపై నిషేధపు పరిధి
  choice: ఆ వ్యక్తి యాజకుని మరణానికి ముందే తిరిగి వచ్చి దేశంలో నివసించడానికి వీలు కల్పించే విమోచన వెలను స్వీకరించకూడదని అనువదించాం.
  alternative: ఆశ్రయ నగరానికి పారిపోవడానికే చెల్లింపు తీసుకోవద్దని, లేదా అతడు అక్కడ ఉండడం/అక్కడి నుంచి తిరిగి రావడంతో సంబంధం ఉన్న ఏ చెల్లింపునైనా తీసుకోవద్దని కూడా సంక్షిప్త హెబ్రీ వాక్యనిర్మాణాన్ని అర్థం చేసుకోవచ్చు.
  rationale: ప్రధాన పాఠం సమీప సందర్భంలోని ముందస్తు తిరుగు నిషేధాన్ని సహజంగా తెలియజేస్తుంది; అయితే హెబ్రీలోని లָנוּס మరియు తరువాతి క్రియారూపాల సంబంధాన్ని పూర్తిగా ఒక్క విధంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చట్టపరమైన శైలి వాడాం. ‘ఆశ్రయ నగరం’ సులభంగా అర్థమయ్యే స్థిర పదబంధం; ‘విమోచన వెల’ మూలంలోని చట్టపరమైన ధర భావాన్ని నిలుపుతుంది. మూలంలో బహువచన ఆజ్ఞ ఉన్నందున ‘మీరు’ వాడాం.
