revisions:
- from: తన ఆశ్రయ నగరానికి పారిపోయినవాడు[b] యాజకుడు చనిపోయేలోపు తిరిగి వచ్చి దేశంలో నివసించడానికి, మీరు అతని తరఫున విమోచన వెల[a] తీసుకోకూడదు.
  to: తన ఆశ్రయ నగరానికి పారిపోయినవాడు[b] యాజకుడు చనిపోయేలోపు తిరిగి వచ్చి దేశంలో నివసించడానికి, మీరు అతని కోసం విమోచన ధరను[a] తీసుకోకూడదు.
  rationale: 'The revision makes two minor Telugu idiom and precision improvements only: it replaces ‘వెల’ with the more natural ‘ధర’ and replaces ‘తరఫున’ with ‘కోసం.’ The verse’s contextual primary reading remains intact, and the alternative syntactic analysis is retained at the same footnote anchor.'
