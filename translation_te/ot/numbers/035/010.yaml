source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులతో మాట్లాడి, వారికి ఇలా చెప్పు: ‘మీరు యొర్దాను నదిని దాటి కనాను దేశంలోకి ప్రవేశించినప్పుడు,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు
  rationale: దַּבֵּר అనే పీయేల్ ఆజ్ఞారూపంలోని ప్రత్యక్ష ఆదేశాన్ని నిలుపుతూ, אֶל‌ను తెలుగులో సహజమైన ‘తో’తో వ్యక్తం చేసింది. בְּנֵי יִשְׂרָאֵל‌కు అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ను నిలిపింది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: ఇలా చెప్పు
  rationale: హీబ్రూలోని ‘మాట్లాడు ... చెప్పు’ అనే పునరుక్త ఆజ్ఞా నిర్మాణం తెలుగులో యథాతథంగా వస్తే కృత్రిమంగా ఉంటుంది. ‘ఇలా చెప్పు’ రెండవ క్రియను సహజంగా వ్యక్తం చేసి, తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేస్తుంది.
- source_word: כִּי
  choice: ఎప్పుడు
  rationale: ఇక్కడ భవిష్యత్తులో సంభవించే పరిస్థితిని పరిచయం చేస్తుంది; కాలార్థకమైన ‘ఎప్పుడు/అప్పుడు’ భావం సందర్భానికి సరిపోతుంది.
- source_word: אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: మీరు యొర్దాను నదిని దాటి
  rationale: సర్వనామంతో కూడిన కృదంత నిర్మాణం సమీప భవిష్యత్తు చర్యను సూచిస్తుంది. ‘దాటి’ సహజ తెలుగు; భౌగోళిక నామం స్పష్టంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న నది భావాన్ని తెలిపింది.
- source_word: אַרְצָה כְּנָעַן
  choice: కనాను దేశంలోకి ప్రవేశించినప్పుడు
  rationale: אַרְצָה లోని దిశాసూచక ప్రత్యయం కనాను దేశం వైపు మాత్రమే కాక దానిలోనికి సాగే గమనాన్ని సూచిస్తుంది. ‘దేశంలోకి ప్రవేశించినప్పుడు’ ఆ గమ్యప్రవేశ భావాన్ని సహజంగా అందిస్తుంది.
