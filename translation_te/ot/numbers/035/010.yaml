translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని సంబోధనను అక్షరార్థానికి దగ్గరగా ఉంచి, హీబ్రూ క్రియాపునరుక్తిని తెలుగులో సహజంగా సంక్షిప్తం చేసింది.
