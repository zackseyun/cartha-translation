- from: ఎందుకంటే, అతడు ప్రధాన యాజకుడు చనిపోయే వరకు తన ఆశ్రయపట్టణంలోనే ఉండాలి; ప్రధాన యాజకుడు చనిపోయిన తరువాత, చంపినవాడు[a] తన స్వాధీన భూమికి[b] తిరిగి వెళ్లవచ్చు.
  to: ఎందుకంటే అతడు ప్రధాన యాజకుని మరణం వరకు తన ఆశ్రయ నగరంలోనే ఉండాలి; ప్రధాన యాజకుని మరణం తరువాత, చంపినవాడు[a] తన సొంత భూమికి[b] తిరిగి వెళ్లవచ్చు.
