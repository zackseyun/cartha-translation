source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: te
  text: ఎందుకంటే అతడు ప్రధాన యాజకుని మరణం వరకు తన ఆశ్రయ నగరంలోనే ఉండాలి; ప్రధాన యాజకుని మరణం తరువాత, చంపినవాడు[a] తన సొంత భూమికి[b] తిరిగి వెళ్లవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చంపిన వ్యక్తి.’ ఇక్కడి హీబ్రూ పదం ఆశ్రయ నగరాల చట్టాల్లో ఒక న్యాయవర్గాన్ని సూచిస్తుంది; దానిని తప్పనిసరిగా ‘హంతకుడు’ అని అర్థం చేసుకోకూడదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన సొంత భూస్వామ్యానికి’ లేదా ‘తన ఆస్తి భూమికి.’ హీబ్రూ పదం అతనికి చెందిన భూమి-ఆస్తి హక్కును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న న్యాయనియమానికి కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְעִיר מִקְלָטוֹ
  choice: తన ఆశ్రయపట్టణంలోనే
  rationale: ‘ఆశ్రయపట్టణం’ ఈ న్యాయవ్యవస్థలోని సాంకేతిక భావాన్ని స్పష్టంగా ఇస్తుంది; ‘నే’ అక్కడే ఉండవలసిన పరిమితిని సహజంగా బలపరుస్తుంది.
- source_word: יֵשֵׁב
  choice: ఉండాలి
  rationale: క్రియ యొక్క నివసించడం/ఉండడం అనే భావంతో పాటు, ఈ న్యాయసందర్భంలోని విధిబద్ధతను తెలియజేస్తుంది.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: ప్రధాన యాజకుడు చనిపోయే వరకు
  rationale: హీబ్రూలోని కాలపరిమితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అధికారపదవికి ‘ప్రధాన యాజకుడు’ స్పష్టమైన సమానార్థకం.
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: ప్రధాన యాజకుడు చనిపోయిన తరువాత
  rationale: మూలంలోని పునరుక్తిని నిలుపుతూ న్యాయపరమైన కాలక్రమాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: הָרֹצֵחַ
  choice: చంపినవాడు
  rationale: ఇది ఆశ్రయపట్టణాల చట్టంలోని న్యాయవర్గం. ‘హంతకుడు’ అనడం ఉద్దేశపూర్వక హత్యగా ముందే తీర్పు చెప్పిన భావాన్ని కలిగించవచ్చు; ‘చంపినవాడు’ మూలంలోని నైతిక/న్యాయ అనిశ్చితిని కాపాడుతుంది.
- source_word: יָשׁוּב
  choice: తిరిగి వెళ్లవచ్చు
  rationale: మునుపటి నిషేధం తొలగిన తరువాత లభించే న్యాయపరమైన అనుమతిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: తన స్వాధీన భూమికి
  rationale: אֲחֻזָּה యొక్క భూస్వామ్య/ఆస్తి భావాన్ని ‘స్వాధీన భూమి’ సంక్షిప్తంగా, న్యాయపరంగా అందిస్తుంది.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదాన్ని ఉద్దేశపూర్వక హత్య చేసినవాడిగా అనువదించాలా, లేక తటస్థమైన న్యాయవర్గంగా ఉంచాలా
  choice: చంపినవాడు
  alternative: హంతకుడు
  rationale: ఆశ్రయపట్టణాల చట్టం ఉద్దేశపూర్వక హత్యను ఇతర రకాల చంపడం నుండి వేరు చేస్తుంది. ‘హంతకుడు’ అని అనువదిస్తే ఈ వచనం ఇవ్వని నైతిక తీర్పును అనువాదమే చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని ప్రధాన యాజకుని మరణం గురించిన ఉద్దేశపూర్వక పునరుక్తిని నిలిపాం. రెండు పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
