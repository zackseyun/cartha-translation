source:
  edition: WLC
  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: te
  text: రక్తానికి ప్రతీకారం తీర్చే బంధువే[a] హంతకుణ్ణి చంపాలి; అతడు హంతకుణ్ణి ఎదుర్కొన్నప్పుడు, అతడే అతణ్ణి చంపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ఇది ‘రక్త ప్రతీకారకుడు’ అనే స్థిరమైన న్యాయపదం; అక్రమంగా చిందిన రక్తానికి ప్రతీకారం తీర్చే బాధ్యతగల కుటుంబ సభ్యుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: రక్తానికి ప్రతీకారం తీర్చే బంధువు
  rationale: ఇది అక్రమంగా చిందిన రక్తానికి ప్రతీకారం తీర్చే బాధ్యతగల సమీప బంధువును సూచించే స్థిరమైన ఇశ్రాయేలు న్యాయపదం. ‘బంధువు’ అని చేర్చడం గֹּאֵלలోని కుటుంబ సంబంధాన్ని స్పష్టం చేస్తుంది; విమోచన సంబంధమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: הוּא
  choice: అతడే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, ఆ చర్యను ఆ బంధువే స్వయంగా చేయాలని తెలుపుతుంది.
- source_word: יָמִית
  choice: చంపాలి
  rationale: מות హిఫీల్ రూపంలోని ‘మరణానికి గురిచేయడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. సందర్భంలోని న్యాయపరమైన అధికారం మొత్తం అధ్యాయం ద్వారా తెలుస్తుంది; ‘మరణశిక్ష అమలు చేయాలి’ అని అనువదిస్తే మూలంలో లేని అధికారిక శిక్షావిధానాన్ని మరీ నిర్దిష్టం చేసే ప్రమాదం ఉంది.
- source_word: הָרֹצֵחַ
  choice: హంతకుడు
  rationale: רצח సూచించే అక్రమ హత్యను, ఈ సందర్భంలో మరణానికి పాత్రుడిగా నిర్ణయించబడిన వ్యక్తిని, ‘హంతకుడు’ సహజంగా సూచిస్తుంది.
- source_word: בְּפִגְעוֹ בוֹ
  choice: అతడు హంతకుణ్ణి ఎదుర్కొన్నప్పుడు
  rationale: פגע ఇక్కడ ఎదురుపడడం లేదా ఎదుర్కోవడం అనే భావాన్ని ఇస్తుంది. కర్త-కర్మల విషయంలో తెలుగులో కలగగల సందిగ్ధతను నివారించేందుకు ‘హంతకుణ్ణి’ అని మళ్లీ పేర్కొనబడింది.
- source_word: הוּא יְמִיתֶנּוּ
  choice: అతడే అతణ్ణి చంపాలి
  rationale: మూలంలోని పునరుక్తినీ, కార్యనిర్వాహకుడిపై ఉన్న ఉద్ఘాటననీ నిలుపుతుంది.
theological_decisions:
- issue: גֹּאֵל הַדָּם యొక్క న్యాయపరమైన పాత్ర
  choice: ఇశ్రాయేలు హత్యా న్యాయవ్యవస్థలో రక్తప్రతీకారం తీర్చే బాధ్యతగల మానవ బంధువుగా అనువదించడం
  alternative: ‘రక్త విమోచకుడు’ లేదా విమోచన సిద్ధాంతంతో ముడిపడిన పదప్రయోగం
  rationale: ఈ వచనం కుటుంబ-ఆధారిత న్యాయపాత్రను వివరిస్తోంది; తరువాతి సిద్ధాంతపరమైన ‘విమోచకుడు’ భావాన్ని ఇక్కడికి తీసుకురావడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించాం. ‘రక్తానికి ప్రతీకారం తీర్చే బంధువు’ సాధారణ పాఠకునికి సంస్థాగత పాత్రను అర్థమయ్యేలా చేస్తుంది. మూలంలోని రెండుసార్ల ఉద్ఘాటనను ‘అతడే’ అనే రూపంతో నిలిపాం.
