  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָי֨וּ אֵ֧לֶּה לָ/כֶ֛ם לְ/חֻקַּ֥ת מִשְׁפָּ֖ט לְ/דֹרֹתֵי/כֶ֑ם בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: te
  text: ఇవి మీకు, మీ తరతరాలపాటు, మీ నివాస స్థలాలన్నిటిలో న్యాయానికి సంబంధించిన శాసనంగా ఉండాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయ శాసనంగా” లేదా “న్యాయనిర్ణయానికి సంబంధించిన శాసనంగా.” హెబ్రీ పదబంధం విధించబడిన శాసనం అనే భావాన్నీ న్యాయ తీర్పు లేదా న్యాయ ప్రక్రియ అనే భావాన్నీ కలిపి తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ స్థిరనివాస ప్రాంతాలన్నిటిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה לָכֶם
  choice: ఇవి మీకు ... ఉండాలి
  rationale: న్యాయశాసన సందర్భంలో וְהָיוּ భవిష్యత్ భావంతో కూడిన విధిని సూచిస్తుంది; తెలుగులో ‘ఉండాలి’ ఆ నిర్దేశాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: న్యాయవిచారణకు సంబంధించిన శాశ్వత నియమాలుగా
  rationale: חֻקַּת మరియు מִשְׁפָּט కలయిక చట్టబద్ధమైన స్థిర నియమాన్నీ న్యాయ నిర్ణయ ప్రక్రియనూ సూచిస్తుంది. ‘న్యాయవిచారణకు సంబంధించిన ... నియమాలు’ ఈ సంయుక్త న్యాయార్థాన్ని స్పష్టంగా ఉంచుతుంది; తరతరాల వర్తింపును బట్టి ‘శాశ్వత’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలన్నిటిలో
  rationale: ఈ హెబ్రీయ భాషాప్రయోగం వరుస తరాలన్నిటికీ కొనసాగే వర్తింపును సూచిస్తుంది.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే ప్రదేశాలన్నిటిలో
  rationale: מוֹשְׁבֹתֵיכֶם నివాస స్థలాలు లేదా స్థిరనివాస ప్రాంతాలను సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి స్థానార్థాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశాసన శైలిని ఉపయోగించాం. మూలంలోని బహువచన సూచన ‘ఇవి’ను నిలిపి, తెలుగులో సహజమైన వాక్యక్రమం కోసం కాలం మరియు స్థల పరిధులను ప్రధాన విధేయానికి ముందు ఉంచాం.
