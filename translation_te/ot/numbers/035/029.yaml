review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the demonstrative, addressees, generational duration, and geographical scope. However, לְחֻקַּת מִשְׁפָּט is singular, whereas the Telugu has plural “నియమాలుగా”; “శాశ్వత” adds an absolute sense not explicitly present in “throughout your generations.” The revision retains the juridical ambiguity of מִשְׁפָּט without restricting it to an investigation.
  naturalness: The revised wording is idiomatic modern standard Telugu while retaining a suitably formal legal register. “నివాస స్థలాలన్నిటిలో” is concise and natural.
  terminology: “శాసనం” appropriately renders חֻקָּה in a legal context. “న్యాయానికి సంబంధించిన” conveys the juridical force of מִשְׁפָּט without over-specifying either a particular verdict or legal procedure.
  issues:
  - severity: medium
    issue: Singular Hebrew legal expression rendered as plural
    rationale: לְחֻקַּת מִשְׁפָּט is grammatically singular (“as a statute of judgment”), but “శాశ్వత నియమాలుగా” is plural.
  - severity: medium
    issue: “శాశ్వత” overstates the temporal expression
    rationale: לְדֹרֹתֵיכֶם means “throughout/for your generations”; it does not by itself assert timeless perpetuity.
  - severity: low
    issue: “న్యాయవిచారణ” is narrower than the Hebrew term
    rationale: מִשְׁפָּט can cover judgment, legal decision, or judicial procedure. “న్యాయానికి సంబంధించిన” preserves this breadth.
  revised_text: ఇవి మీకు, మీ తరతరాలపాటు, మీ నివాస స్థలాలన్నిటిలో న్యాయానికి సంబంధించిన శాసనంగా ఉండాలి.[a][b]
