  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: te
  text: మీరు ఇచ్చే పట్టణాలు మీకు ఆరు ఆశ్రయ పట్టణాలు కావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: పట్టణాలు
  rationale: నిర్దిష్ట బహువచన నామవాచకాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ఉంచాం. వాక్యారంభంలోని וְ ఇక్కడ ముందటి ఆదేశానికి కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: אֲשֶׁר
  choice: మీరు ఇచ్చే
  rationale: సంబంధవాచక అవ్యయం తరువాతి క్రియతో కలిసి ‘పట్టణాలు’ను విశేషిస్తుంది; తెలుగులో కృదంత నిర్మాణం సహజంగా ఉంటుంది.
- source_word: תִּתֵּנוּ
  choice: మీరు ఇచ్చే
  rationale: נתן ధాతువు Qal అసంపూర్ణరూపం, ద్వితీయ పురుష బహువచనం. భావి ఆదేశ సందర్భాన్ని తెలుగు సంబంధవాచక కృదంతం సహజంగా తెలియజేస్తుంది; ‘కేటాయించే’ అనడం సందర్భాన్ని స్పష్టీకరించినా మూలంలోని సాధారణ ‘ఇవ్వు’ భావాన్ని సంకుచితం చేస్తుంది.
- source_word: שֵׁשׁ
  choice: ఆరు
  rationale: సంఖ్యను నేరుగా అనువదించాం.
- source_word: עָרֵי מִקְלָט
  choice: ఆశ్రయ పట్టణాలు
  rationale: ‘ఆశ్రయం’ అనే భావంతో కూడిన construct chain. తెలుగు న్యాయ-కథన సందర్భంలో ‘ఆశ్రయ పట్టణాలు’ సంక్షిప్తంగా, స్పష్టంగా ఉండి ఈ ప్రత్యేక సంస్థను సూచిస్తుంది.
- source_word: תִּהְיֶינָה
  choice: ఉండాలి
  rationale: היה ధాతువు Qal అసంపూర్ణరూపం, తృతీయ పురుష స్త్రీలింగ బహువచనం. న్యాయపరమైన ఆదేశ సందర్భంలో ‘ఉండాలి’ విధిని మరియు ఉద్దేశించిన ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָ/כֶם
  choice: మీకు
  rationale: ל ఉపసర్గతో ద్వితీయ పురుష బహువచన ప్రత్యయం; లబ్ధిదారు లేదా సంబంధ భావాన్ని ‘మీకు’ నేరుగా తెలియజేస్తుంది.
