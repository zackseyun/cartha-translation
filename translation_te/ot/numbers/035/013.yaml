translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, న్యాయపరమైన ఆదేశ స్వరాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని ‘మీరు’ బహువచన సంబోధన తెలుగులో రూపపరంగా ప్రత్యేకంగా గుర్తించబడదు; సందర్భమే దానిని తెలియజేస్తుంది.
