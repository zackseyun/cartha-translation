- from: 'యెరికో సమీపంలో యొర్దాను నది పక్కనున్న మోయాబు మైదానాల్లో యహ్వే మోషేతో ఇలా పలికాడు:'
  to: 'యెరికో దగ్గర యొర్దాను నది ఒడ్డున ఉన్న మోయాబు మైదానాలలో యహ్వే మోషేతో ఇలా మాట్లాడాడు:'
  rationale: The revision preserves the narrative speech formula, the divine name, and every geographic component while using a more natural Telugu location phrase. ‘ఇలా’ appropriately introduces the following speech, corresponding functionally to לֵאמֹר.
