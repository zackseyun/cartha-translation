id: NUM.35.1
reference: Numbers 35:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: te
  text: 'యెరికో దగ్గర యొర్దాను నది ఒడ్డున ఉన్న మోయాబు మైదానాలలో యహ్వే మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: దైవ ప్రసంగాన్ని ప్రారంభించే హీబ్రూ కథన సూత్రాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మోషే ప్రసంగాన్ని స్వీకరించిన వ్యక్తి అని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עֲרָבוֹת సూచించే విశాలమైన మైదాన లేదా మైదాన-ప్రాంత భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: עַל־יַרְדֵּן
  choice: యొర్దాను నది పక్కనున్న
  rationale: ఈ భౌగోళిక సందర్భంలో עַל సమీపాన్ని సూచిస్తుంది; ‘నది’ అనే వివరణ తెలుగులో స్థలాన్ని వెంటనే స్పష్టం చేస్తుంది.
- source_word: יְרֵחוֹ
  choice: యెరికో సమీపంలో
  rationale: నగరానికి ఎదురుగా లేదా దాని దగ్గరనున్న యొర్దాను ప్రాంతాన్ని సూచించే భౌగోళిక సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ‘పలికాడు’తో కలిపి అనవసర పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, స్థల సంబంధాలను స్పష్టంగా క్రమబద్ధీకరించాం; అయినప్పటికీ మూలంలోని భౌగోళిక సమాచారమంతా నిలుపుకున్నాం.
