source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: te
  text: మీరు నివసిస్తున్న దేశాన్ని అపవిత్రపరచకూడదు[a]. ఎందుకంటే రక్తం దేశాన్ని అపవిత్రం చేస్తుంది. దానిలో చిందించబడిన రక్తం నిమిత్తం, దాన్ని చిందించినవాని రక్తం ద్వారా తప్ప ఆ దేశానికి ప్రాయశ్చిత్తం జరగదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశాన్ని కలుషితం చేయకూడదు.’ హీబ్రూ క్రియ దేశాన్ని నైతికంగా లేదా పవిత్రతపరంగా కలుషితం చేయడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'మరొక విధంగా: ‘దానిలో చిందించబడిన రక్తం విషయంలో, దాన్ని చిందించినవాని రక్తం ద్వారా తప్ప ఆ దేశం కోసం ప్రాయశ్చిత్తం చేయబడదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: అపవిత్రపరచకూడదు / అపవిత్రం చేస్తుంది
  rationale: ఈ సందర్భంలో రక్తపాతం దేశాన్ని నైతికంగా, పవిత్రతపరంగా కలుషితం చేయడాన్ని సూచిస్తుంది. ‘అపవిత్రం’ అనే పదం కేవలం పర్యావరణ కాలుష్యాన్ని కాక ఈ నైతిక-పవిత్రత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ మొత్తం భూమి కాక ఇశ్రాయేలీయులు నివసించే నిర్దిష్ట భూభాగమే ఉద్దేశం. ఆధునిక తెలుగులో ‘దేశం’ ఆ ప్రాంతీయ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כִּי הַדָּם הוּא
  choice: ఎందుకంటే రక్తం
  rationale: הוּא రక్తాన్నే వాక్య విషయంగా నొక్కి చూపుతుంది. తెలుగులో ప్రత్యేకంగా ‘అదే’ అని చేరిస్తే మూలంలో లేని విరుద్ధార్థ సూచన కలగవచ్చు; సహజ వాక్య నిర్మాణమే తగిన ఉద్ఘాటనను ఇస్తుంది.
- source_word: יְכֻפַּר
  choice: ప్రాయశ్చిత్తం జరగదు
  rationale: כפר యొక్క నిష్క్రియ రూపం దేశంపై ఉన్న రక్తదోషం తొలగించబడటాన్ని సూచిస్తుంది. ‘ప్రాయశ్చిత్తం జరగదు’ ఆ ఆరాధనా-నైతిక భావాన్ని గౌరవప్రదమైన, అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: שֻׁפַּךְ
  choice: చిందించబడిన
  rationale: న్యాయసంబంధమైన రక్తపాత సందర్భంలో రక్తం ‘చిందించడం’ సహజమైన తెలుగు ప్రయోగం; నిష్క్రియ రూపాన్ని కూడా నిలుపుతుంది.
- source_word: כִּי אִם
  choice: ద్వారానే తప్ప
  rationale: ఈ పదబంధం ఏకైక మినహాయింపును లేదా సాధనాన్ని సూచిస్తుంది. ‘ద్వారానే తప్ప’ ఆ పరిమితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: దాన్ని చిందించినవాని రక్తం ద్వారా
  rationale: సర్వనామం ముందున్న రక్తాన్ని సూచిస్తుంది; భావం రక్తం చిందించిన వ్యక్తి సొంత రక్తం. మూలంలోని సంక్షిప్తతను, న్యాయపరమైన తీవ్రతను ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: రక్తపాతం వల్ల దేశం అపవిత్రం కావడం
  choice: రక్తపాతం దేశంపై నిజమైన నైతిక-పవిత్రత సంబంధమైన అపవిత్రతను కలిగిస్తుందని వచనం చెప్పేలా అనువదించబడింది.
  alternative: ఇది సామాజిక అవ్యవస్థను సూచించే కేవలం రూపకాలంకార భాషగా తీసుకోవడం.
  rationale: חנף పదం రెండుసార్లు రావడం, כפרతో దాని సంబంధం, రక్తం మరియు దేశంపై ఉన్న స్పష్టమైన దృష్టి—ఇవి కేవలం పౌర అవ్యవస్థకన్నా రక్తదోషం అనే లోతైన భావాన్ని సూచిస్తాయి.
- issue: హంతకుని రక్తమే ప్రాయశ్చిత్త సాధనం అనే వాక్య తీవ్రత
  choice: ‘దాన్ని చిందించినవాని రక్తం ద్వారానే తప్ప’ అని మూలంలోని ఏకైక మినహాయింపును యథాతథంగా ఉంచడం.
  alternative: దీనిని సాధారణంగా ‘న్యాయం జరిగితే తప్ప’ అని సడలించి చెప్పడం.
  rationale: మూలపాఠం న్యాయాన్ని సాధారణ పదాల్లో కాక రక్తం చిందించినవాని రక్తం అనే నిర్దిష్ట భాషలో చెబుతుంది. అనువాదం దాన్ని విస్తరించకుండా లేదా తరువాతి సిద్ధాంతాలతో వివరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి వాడబడింది. ‘అపవిత్రం’, ‘ప్రాయశ్చిత్తం’ వంటి స్థిరమైన బైబిలు పదాలు సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణంలో ఉంచబడ్డాయి; మూలంలోని పునరుక్తి మరియు నైతిక తీవ్రత నిలుపబడ్డాయి.
