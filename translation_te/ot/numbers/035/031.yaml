source:
  edition: WLC
  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: te
  text: మరణశిక్షకు పాత్రుడైన హంతకుని ప్రాణం కోసం మీరు విమోచనధనాన్ని[a] స్వీకరించకూడదు; అతడు తప్పకుండా మరణశిక్ష పొందాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరిహారం’ లేదా ‘విడుదల కోసం చెల్లించే ధనం’ అని కూడా అనువదించవచ్చు. హెబ్రీ כֹּפֶר శిక్షను తప్పించడానికి లేదా విడుదల పొందడానికి ఇచ్చే చెల్లింపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతడు తప్పక చంపబడాలి.’ హెబ్రీలోని ఉద్ఘాటిత నిర్మాణం మరణశిక్ష యొక్క నిశ్చయాన్ని, విధిబద్ధతను బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: స్వీకరించకూడదు
  rationale: כֹּפֶר అనే చెల్లింపుతో కూడిన న్యాయ సందర్భంలో ఈ క్రియకు కేవలం ‘తీసుకోవడం’ కాక, చెల్లింపును ‘స్వీకరించడం’ అనే భావం ఉంది.
- source_word: כֹּפֶר
  choice: విమోచన వెల
  rationale: శిక్షను తప్పించడానికి లేదా విడుదల పొందడానికి చెల్లించే మొత్తాన్ని సూచిస్తుంది. ‘విమోచన వెల’ న్యాయపరమైన విడుదల భావాన్ని తెలియజేస్తుంది; దీనిని కేవలం లంచంగా పరిమితం చేయదు.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: హంతకుని ప్రాణాన్ని విడిచిపెట్టడానికి
  rationale: నెఫెష్ ఇక్కడ ‘ప్రాణం/వ్యక్తి’ అనే భావంలో ఉంది. చెల్లింపు ద్వారా హంతకుని ప్రాణాన్ని కాపాడే ఉద్దేశాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: רֹצֵחַ
  choice: హంతకుడు
  rationale: సంఖ్యాకాండము 35లో అనుకోకుండా చంపినవారికి, ఉద్దేశపూర్వక నరహత్య చేసినవారికి మధ్య భేదం ఉంది. మరణశిక్షకు పాత్రుడని చెప్పబడినందున ‘హంతకుడు’ సరైన పదం.
- source_word: רָשָׁע לָמוּת
  choice: మరణశిక్షకు పాత్రుడైన
  rationale: అక్షరార్థంగా ‘చనిపోవడానికి దోషి/దుష్టుడు’; న్యాయ సందర్భంలో ఇది మరణదండనకు చట్టపరంగా అర్హుడని సూచిస్తుంది.
- source_word: כִּי מוֹת יוּמָת
  choice: అతడు తప్పకుండా మరణశిక్ష పొందాలి
  rationale: క్రియానామంతో కూడిన క్రియారూపం నిశ్చయాన్ని, విధిబద్ధతను బలపరుస్తుంది. ఈ అనువాదం ఆ ఉద్ఘాటనను, కర్మణి భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: మరణదండన తీర్పు యొక్క న్యాయబద్ధమైన బలం
  choice: మరణశిక్షకు పాత్రుడైన హంతకుని శిక్షను చెల్లింపు ద్వారా మార్చకూడదనే బద్ధమైన న్యాయ ఆజ్ఞగా అనువదించడం.
  alternative: ఇది బలమైన విధి కాకుండా అప్పటి ఆచారాన్ని మాత్రమే వివరిస్తుందని తీసుకోవడం.
  rationale: לֹא תִקְחוּ అనే నిషేధం, מוֹת יוּמָת అనే ఉద్ఘాటిత నిర్మాణం కలిపి ఇది సాధారణ వర్ణన కాక దృఢమైన న్యాయ ఆజ్ఞ అని చూపుతున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన గంభీరతను నిలిపి, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని ‘ప్రాణం’ భావాన్ని సందర్భానుగుణంగా ‘ప్రాణాన్ని విడిచిపెట్టడానికి’ అని వ్యక్తం చేశాం; ఉద్ఘాటిత మరణదండన ఆజ్ఞను ‘తప్పకుండా ... పొందాలి’తో నిలిపాం.
