translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్య నిర్మాణానికి దగ్గరగా ఉండడంతో పాటు తెలుగు సహజత్వం కోసం ‘మొదలుకొని ... ఉండాలి’ అనే నిర్మాణాన్ని ఎంచుకున్నాం.
