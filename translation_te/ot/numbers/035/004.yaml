- from: మీరు లేవీయులకు ఇచ్చే పట్టణాల మేతభూములు[a], పట్టణ ప్రాకారం[b] మొదలుకొని వెలుపలికి చుట్టూ వెయ్యి మూరలు ఉండాలి.
  to: మీరు లేవీయులకు ఇచ్చే పట్టణాల మేతభూములు[a] పట్టణ ప్రాకారం నుండి అన్ని వైపులా వెలుపలికి వెయ్యి మూరల వరకు ఉండాలి[b].
