id: NUM.35.4
reference: Numbers 35:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִגְרְשֵׁי֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/לְוִיִּ֑ם מִ/קִּ֤יר הָ/עִיר֙ וָ/ח֔וּצָ/ה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: te
  text: మీరు లేవీయులకు ఇచ్చే పట్టణాల మేతభూములు[a] పట్టణ ప్రాకారం నుండి అన్ని వైపులా వెలుపలికి వెయ్యి మూరల వరకు ఉండాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉమ్మడి భూములు’ లేదా ‘బహిరంగ భూములు’; పట్టణాల చుట్టూ ఉన్న భూమిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘పట్టణ ప్రాకారం నుండి’; కొందరు దీన్ని మరింత సాధారణంగా ‘పట్టణ సరిహద్దు నుండి’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: మేతభూములు
  rationale: ఈ సందర్భంలో పట్టణాల చుట్టూ లేవీయుల ఉపయోగానికి కేటాయించిన ఖాళీ భూమిని సూచిస్తుంది; దాని ఆచరణాత్మక ఉపయోగాన్ని ‘మేతభూములు’ సహజంగా తెలియజేస్తుంది.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: עִיר అనే పదం పట్టణం లేదా నగరం అని అర్థం; ఈ సందర్భంలో ఆధునిక తెలుగు పాఠకులకు ‘పట్టణాలు’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: మీరు ... ఇచ్చే
  rationale: సంబంధ వాక్యంలోని ఆదేశాత్మక-భవిష్యత్ భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: పట్టణాలు, వాటి చుట్టూ ఉన్న భూములు ఎవరికి ఇవ్వాలో నేరుగా తెలియజేస్తుంది.
- source_word: מִקִּיר הָעִיר
  choice: పట్టణ ప్రాకారం మొదలుకొని
  rationale: קִיר యొక్క సాధారణ అర్థం ‘గోడ’; కొలత పట్టణ ప్రాకారం వద్ద మొదలవుతుందని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וָחוּצָה
  choice: వెలుపలికి
  rationale: పట్టణం నుంచి బయటివైపు వెళ్లే దిశను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶלֶף אַמָּה
  choice: వెయ్యి మూరలు
  rationale: ప్రాచీన కొలమానాన్ని మార్చకుండా ఉంచుతూ, cubit‌కు తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘మూర’ను ఉపయోగిస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: ఈ కొలత పట్టణం అన్ని వైపులా వర్తిస్తుందనే పరివేష్టన భావాన్ని తెలియజేస్తుంది.
