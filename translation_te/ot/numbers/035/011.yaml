id: NUM.35.11
reference: Numbers 35:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: te
  text: అప్పుడు మీరు మీ కోసం పట్టణాలను కేటాయించాలి[a]. అవి మీకు ఆశ్రయ పట్టణాలుగా ఉండాలి. అనుకోకుండా ఒక వ్యక్తిని చంపినవాడు[b] అక్కడికి పారిపోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నియమించాలి’ లేదా ‘ప్రత్యేకించాలి’.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఒక వ్యక్తిని కొట్టినవాడు’; సందర్భంలో ఇది ఉద్దేశపూర్వక హత్య చేసినవాడిని కాక, అనుకోకుండా ఒకరి మరణానికి కారణమైనవాడిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: నియమించుకోవాలి
  rationale: హిఫీల్ రూపం ఇక్కడ నిర్దిష్ట పట్టణాలను ఎంపిక చేసి నియమించడాన్ని సూచిస్తుంది; న్యాయసంబంధ సందర్భంలో ఈ తెలుగు ప్రయోగం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: పట్టణాలను ... ఆశ్రయ పట్టణాలుగా
  rationale: మూలంలోని ‘పట్టణాలు’ అనే పునరుక్తిని న్యాయపరమైన స్పష్టత కోసం నిలిపి, מִקְלָטను రక్షణ కోసం పారిపోయే స్థలాన్ని సూచించే ‘ఆశ్రయ’గా అనువదించాం.
- source_word: וְנָס שָׁמָּה
  choice: అక్కడికి పారిపోవాలి
  rationale: న్యాయనిర్దేశ క్రమంలో ఈ క్రియ భవిష్యత్/విధ్యర్థక బలాన్ని కలిగి ఉంది; ‘పారిపోవాలి’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רֹצֵחַ מַכֵּה נֶפֶשׁ
  choice: ఒక వ్యక్తిని చంపినవాడు
  rationale: ఈ సందర్భంలో పదబంధం ఒక మనిషి మరణానికి కారణమైన వ్యక్తిని సూచిస్తుంది. ‘హంతకుడు’ ఉద్దేశపూర్వక హత్య భావాన్ని ముందుగానే మోపవచ్చు; అందువల్ల వివరణాత్మకమైన ఈ రూపం సరైనది.
- source_word: נֶפֶשׁ
  choice: వ్యక్తిని
  rationale: ఇక్కడ נֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాక, హతమైన మానవ వ్యక్తిని సూచిస్తుంది.
- source_word: בִּשְׁגָגָה
  choice: అనుకోకుండా
  rationale: ఉద్దేశం లేకుండా, పొరపాటున జరిగిన కార్యమనే న్యాయపరమైన భేదాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చంపిన వ్యక్తి యొక్క న్యాయపరమైన వర్గీకరణ
  choice: ‘హంతకుడు’ అని కాక ‘అనుకోకుండా ఒక వ్యక్తిని చంపినవాడు’ అని అనువదించడం
  alternative: హంతకుడు; నరహంతకుడు
  rationale: בִּשְׁגָגָה ఉద్దేశరాహిత్యాన్ని స్పష్టంగా పేర్కొంటుంది. కాబట్టి ఉద్దేశపూర్వక హత్య లేదా దానికి సంబంధించిన నైతిక తీర్పును అనువాదమే ముందుగా విధించకుండా, తోరాలోని ఉద్దేశపూర్వక హత్య–అనుద్దేశ హత్య భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయనిర్దేశ ధోరణిని నిలిపాం. ‘ఆశ్రయ పట్టణాలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండటంతో పాటు సంస్థాగత న్యాయపరమైన భావాన్ని కూడా మోస్తుంది. మూలంలోని భావపునరుక్తిని రెండు వాక్యాల ద్వారా స్పష్టంగా ఉంచాం.
