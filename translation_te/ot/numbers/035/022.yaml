  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: te
  text: అయితే అతడు శత్రుత్వం లేకుండా అకస్మాత్తుగా అతన్ని తోసినా, లేదా మాటువేయకుండా[a] ఏ వస్తువునైనా అతనిపై విసిరినా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పొంచి ఉండకుండా”; భావపరంగా, ముందే పథకం వేసుకోకుండా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి సందర్భాలకు భిన్నమైన షరతును ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో వ్యతిరేక భావంతో కూడిన షరతును సహజంగా తెలియజేస్తుంది.
- source_word: בְּפֶתַע
  choice: అకస్మాత్తుగా
  rationale: హఠాత్తుగా లేదా అనుకోకుండా జరిగిన చర్యను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בְּלֹא אֵיבָה
  choice: శత్రుత్వం లేకుండా
  rationale: אֵיבָה వ్యక్తుల మధ్య వైరం లేదా శత్రుభావాన్ని సూచిస్తుంది; ఈ రూపం అర్థాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: הֲדָפוֹ
  choice: అతన్ని తోసినా
  rationale: మూల క్రియలోని తోసడం లేదా నెట్టడం అనే సాధారణ భావాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אוֹ
  choice: లేదా
  rationale: ప్రత్యామ్నాయ పరిస్థితిని పరిచయం చేసే సాధారణ విభాజక సంధి.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: అతనిపై విసిరినా
  rationale: עַל‌తో కూడిన క్రియ వస్తువును ఆ వ్యక్తి మీదికి లేదా అతనిపైకి విసరడాన్ని సూచిస్తుంది.
- source_word: כָּל כְּלִי
  choice: ఏ వస్తువునైనా
  rationale: כְּלִי ఇక్కడ పాత్రకే పరిమితం కాకుండా వస్తువు, సాధనం వంటి విస్తృత భావాన్ని కలిగి ఉంది.
- source_word: בְּלֹא צְדִיָּה
  choice: మాటువేయకుండా[a]
  rationale: צְדִיָּה మాటువేసి ఎదురుచూడడం లేదా ఆకస్మిక దాడికి పొంచి ఉండడం అనే స్పష్టమైన చిత్రాన్ని ఇస్తుంది; విస్తృత ఆధునిక న్యాయపదమైన 'ముందస్తు పథకం'ను మూలంలోకి దిగుమతి చేయదు.
