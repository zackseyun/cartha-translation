id: NUM.35.6
reference: Numbers 35:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: te
  text: మీరు లేవీయులకు ఇచ్చే పట్టణాలు, ఒక మనిషిని చంపినవాడు[a] అక్కడికి పారిపోవడానికి మీరు ఇవ్వవలసిన ఆరు ఆశ్రయ పట్టణాలు; వాటితోపాటు మీరు మరో నలభై రెండు పట్టణాలను ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చంపినవాడు,’ ‘హంతకుడు.’ ఇక్కడి హీబ్రూ పదం ఆశ్రయ పట్టణాలకు సంబంధించిన న్యాయ సందర్భంలో వాడబడింది. చంపడం ఉద్దేశపూర్వకంగా జరిగిందా, అనుకోకుండా జరిగిందా అనేది ఆ పదం ఒక్కటే నిర్ధారించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: עִיר అనేది పట్టణం లేదా నగరాన్ని సూచించగలదు; ఈ భూకేటాయింపు సందర్భంలో సహజమైన ఆధునిక తెలుగు పదంగా ‘పట్టణాలు’ ఎంచుకున్నాం.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: పట్టణాలను పొందేవారిని తెలిపే దత్తార్థక రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: ఆరు ఆశ్రయ పట్టణాలు
  rationale: מִקְלָט రక్షణ కోసం ఆశ్రయించే స్థలాన్ని సూచిస్తుంది; ‘ఆశ్రయ పట్టణాలు’ చట్టపరమైన వ్యవస్థను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָנוּס שָׁמָּה
  choice: అక్కడికి పారిపోవడానికి
  rationale: נוּס లోని ‘పారిపోవడం’ అనే భావాన్నీ, שָׁמָּה లోని దిశార్థక ‘అక్కడికి’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: הָרֹצֵחַ
  choice: నరహంతకుడు
  rationale: ఈ న్యాయ సందర్భంలో ఈ పదం ఒక మనిషిని చంపిన వ్యక్తిని సూచిస్తుంది; చంపడం ఉద్దేశపూర్వకమా, అనుకోకుండా జరిగిందా అనేది ఈ పదమే నిర్ధారించదు.
- source_word: וַעֲלֵיהֶם
  choice: వాటితోపాటు మరో
  rationale: ఇక్కడ עַל భౌతికంగా ‘మీద’ అనే అర్థంలో కాక, అదనాన్ని సూచించే నుడికారంగా ఉంది; ‘మరో’ సంఖ్యాపరమైన అదనాన్ని స్పష్టం చేస్తుంది.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: నలభై రెండు పట్టణాలు
  rationale: హీబ్రూ లెక్కింపు నిర్మాణంలోని ఏకవచన నామవాచకాన్ని తెలుగు వ్యాకరణానికి అనుగుణంగా బహువచనంలో అందించాం.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదంలో ఉద్దేశపూర్వక హత్య భావం ఉందా?
  choice: నరహంతకుడు
  alternative: హంతకుడు / చంపినవాడు
  rationale: ఆశ్రయ పట్టణాల న్యాయ సందర్భంలో మూలపదం చంపిన వ్యక్తిని సూచించినా, చంపడం ఉద్దేశపూర్వకమని స్వయంగా నిర్ధారించదు. ‘నరహంతకుడు’ ఆ అస్పష్టతను నిలుపుతుంది; పాదటిప్పణి దాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. పొడవైన హీబ్రూ వాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం; సమాచార క్రమం, న్యాయపరమైన అస్పష్టత నిలుపబడ్డాయి.
