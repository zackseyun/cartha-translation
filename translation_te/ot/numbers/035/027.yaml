- from: రక్తప్రతీకారం తీర్చేవాడు అతణ్ణి అతని ఆశ్రయపట్టణపు సరిహద్దు వెలుపల కనుగొని, ఆ నరహంతకుణ్ణి చంపితే, అతనికి రక్తాపరాధం ఉండదు.[a]
  to: రక్తప్రతీకారం తీర్చేవాడు మనిషిని చంపినవాణ్ణి అతని ఆశ్రయపట్టణపు సరిహద్దు వెలుపల కనుగొని, అతన్ని చంపితే, ఆ రక్తప్రతీకారం తీర్చేవాడికి రక్తాపరాధం ఉండదు.[a]
  rationale: The revision retains the source’s legal sequence and terminology while using a neutral expression for the person who killed someone, rather than a term that can imply murder. It also resolves the final pronoun’s possible ambiguity by explicitly identifying the avenger as the person free from bloodguilt. The footnote remains correctly anchored to the legal idiom in the final clause.
