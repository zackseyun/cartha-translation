source:
  edition: WLC
  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: te
  text: రక్తప్రతీకారం తీర్చేవాడు మనిషిని చంపినవాణ్ణి అతని ఆశ్రయపట్టణపు సరిహద్దు వెలుపల కనుగొని, అతన్ని చంపితే, ఆ రక్తప్రతీకారం తీర్చేవాడికి రక్తాపరాధం ఉండదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారంలో, ‘అతనికి రక్తం లేదు’; అంటే, ఆ రక్తప్రతీకారం తీర్చేవాడికి రక్తాపరాధం కలగదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చేవాడు
  rationale: ఈ న్యాయ సందర్భంలో రక్తపాతానికి ప్రతీకారం తీర్చే అధికారమున్న వ్యక్తిని సూచిస్తుంది. బంధుత్వాన్ని మూలపాఠం ఇక్కడ స్పష్టంగా చెప్పనందున దాన్ని అనువాదంలో చేర్చలేదు.
- source_word: מִחוּץ לִגְבוּל
  choice: సరిహద్దు వెలుపల
  rationale: ఆశ్రయపట్టణం కల్పించే రక్షణ వర్తించే భౌగోళిక, న్యాయ పరిమితులకు బయట ఉండటాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִיר מִקְלָטוֹ
  choice: అతని ఆశ్రయపట్టణం
  rationale: సంఖ్యాకాండంలోని ఈ న్యాయవ్యవస్థకు సంబంధించిన స్థిరమైన సంస్థాగత భావాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְרָצַח
  choice: చంపితే
  rationale: తరువాతి వాక్యం ఈ చర్యకు రక్తాపరాధం లేదని చెబుతుంది; కాబట్టి నేరపూరిత హత్యను సూచించే పదం కాకుండా తటస్థమైన క్రియను ఎంచుకున్నాం.
- source_word: הָרֹצֵחַ
  choice: నరహంతకుడు
  rationale: ఇక్కడ ఒక మనిషిని చంపి ఆశ్రయపట్టణానికి పారిపోయిన వ్యక్తిని సూచించే న్యాయపరమైన పదంగా వాడబడింది; ఉద్దేశపూర్వక హత్యను తప్పనిసరిగా సూచించదు.
- source_word: אֵין לוֹ דָּם
  choice: అతనికి రక్తాపరాధం ఉండదు
  rationale: హీబ్రూ న్యాయ నుడికారంలోని ‘అతనికి రక్తం లేదు’ అనే భావాన్ని సహజమైన తెలుగులో, దాని న్యాయపరమైన బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అనుమతించబడిన చంపడం అనే సందర్భంలో רצח పదానికి ఉన్న నైతిక/న్యాయ బలం
  choice: ‘చంపితే’ అని తటస్థంగా అనువదించడం
  alternative: ‘హత్య చేస్తే’ అని అనువదించడం
  rationale: రక్తప్రతీకారం తీర్చేవాడికి రక్తాపరాధం లేదని వచనం స్పష్టంగా చెబుతుంది. అందువల్ల నేరపూరిత హత్యను సూచించే తెలుగు పదం వాడితే హీబ్రూ న్యాయ సందర్భంలో లేని విరోధం ఏర్పడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘రక్తప్రతీకారం తీర్చేవాడు,’ ‘ఆశ్రయపట్టణం,’ ‘రక్తాపరాధం’ వంటి పదాలు సందర్భంలోని సంస్థాగత, న్యాయ భావాలను కాపాడుతాయి.
