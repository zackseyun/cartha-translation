source:
  edition: WLC
  text: א֣וֹ בְ/כָל אֶ֜בֶן אֲשֶׁר יָמ֥וּת בָּ/הּ֙ בְּ/לֹ֣א רְא֔וֹת וַ/יַּפֵּ֥ל עָלָ֖י/ו וַ/יָּמֹ֑ת וְ/הוּא֙ לֹא אוֹיֵ֣ב ל֔/וֹ וְ/לֹ֥א מְבַקֵּ֖שׁ רָעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: te
  text: లేదా, ఎవరైనా దానివల్ల చనిపోగల ఏ రాయినైనా, చూడకుండా[a], అతడు అతని మీద పడవేసి అతడు చనిపోతే—అతడు అతనికి శత్రువు కాకపోయినా, అతనికి హాని చేయాలని కోరుకోకపోయినా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చూడకుండా.” ఈ పదబంధం తప్పనిసరిగా శారీరకంగా చూడలేకపోవడాన్ని మాత్రమే కాదు, తెలియకపోవడం లేదా గమనించకపోవడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: లేదా
  rationale: ముందటి వచనంలోని న్యాయపరమైన ప్రత్యామ్నాయాల వరుసను కొనసాగించే సాధారణ విభాజక పదం.
- source_word: בְּכָל אֶבֶן
  choice: ఏ రాయినైనా
  rationale: בְּ ఇక్కడ సాధనార్థకంగా ఉంది; כָל యొక్క విస్తృత పరిధిని సహజమైన తెలుగులో చూపుతుంది.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: చంపగల
  rationale: ఆ రాయి మరణం కలిగించగలదనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּלֹא רְאוֹת
  choice: చూడకుండా
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన ‘చూడకపోవడం’ అనే భావాన్ని కాపాడి, ‘అనుకోకుండా’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וַיִּפֵּל עָלָיו
  choice: మరొకరి మీద పడవేయగా
  rationale: נפל యొక్క హిఫీల్ రూపంలోని కారణార్థక భావాన్ని, అంటే కర్త రాయిని పడేలా చేశాడనే క్రియాశీలతను, కాపాడుతుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోతే
  rationale: న్యాయనిబంధన శైలికి సరిపోయే షరతు-ఫలిత నిర్మాణంలో మరణ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: అతడు అతనికి శత్రువు కాకపోయినా
  rationale: మరణానికి పూర్వవైరము కారణం కాదనే అనుమతార్థక/విరుద్ధార్థక సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: అతనికి హాని చేయాలని కోరుకోకపోయినా
  rationale: רָעָה ను ఈ వ్యక్తుల మధ్య న్యాయసందర్భంలో ‘హాని’గా అనువదించి, హాని చేయాలనే ఉద్దేశం లేదని తెలియజేస్తుంది.
