translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. సర్వనామాల అయోమయాన్ని తగ్గించేందుకు బాధితుణ్ణి మొదట ‘మరొకరి’గా పేర్కొన్నాం. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
