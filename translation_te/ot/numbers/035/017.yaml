id: NUM.35.17
reference: Numbers 35:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: te
  text: లేదా, ప్రాణం తీయగల రాయితో[a] అతడు అతనిని కొట్టి అతడు చనిపోతే, అతడు హంతకుడు; ఆ హంతకునికి తప్పక మరణశిక్ష విధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘చేతి రాయి’; అంటే చేతిలో పట్టుకున్న రాయి లేదా చేతితో ఆయుధంగా ఉపయోగించడానికి తగిన రాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: లేదా
  rationale: న్యాయపరమైన వరుసలో మరొక ప్రత్యామ్నాయ పరిస్థితిని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘లేదా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֶבֶן יָד
  choice: చేతి రాయితో
  rationale: అక్షరార్థంగా ‘చేతి రాయి’; చేతిలో పట్టుకొని ఆయుధంగా ఉపయోగించగల రాయిని సూచించే మూలభాషా రూపాన్ని ప్రధాన పాఠంలో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: ప్రాణం తీయగల
  rationale: ఆ రాయికి చంపగల సామర్థ్యం ఉందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అది తప్పనిసరిగా ఫలితాన్ని సూచించదు.
- source_word: הִכָּהוּ
  choice: అతడు అతన్ని కొట్టగా
  rationale: נכה అనే క్రియలోని ‘కొట్టు’ భావాన్ని కాపాడుతూ, మరణాన్ని తరువాతి ఉపవాక్యమే తెలియజేసేలా ఫలితాన్ని ముందుగానే చేర్చదు.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోతే
  rationale: తెలుగు షరతు వాక్య నిర్మాణంలో సహజంగా సరిపోతూ, దెబ్బ తరువాత మరణం సంభవించిందనే క్రమాన్ని నిలుపుతుంది.
- source_word: רֹצֵחַ הוּא
  choice: అతడు హంతకుడు
  rationale: ఈ న్యాయ సందర్భంలో ఉద్దేశపూర్వకమైన, దోషపూరిత నరహత్యకు సంబంధించిన తీర్పును ‘హంతకుడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מוֹת יוּמַת
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో బలపరచబడిన మరణదండన ఆజ్ఞను న్యాయపరమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָרֹצֵחַ
  choice: ఆ హంతకుడు
  rationale: మూలంలోని న్యాయపరమైన నామవాచక పునరుక్తిని నిలుపుతూ, ఇప్పటికే వర్గీకరించిన వ్యక్తినే తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: ఆశ్రయ పట్టణాల చట్ట సందర్భంలో చంపిన వ్యక్తికి ఇచ్చే న్యాయ వర్గీకరణ
  choice: רצח ను ‘హంతకుడు’గా అనువదించడం
  alternative: ‘చంపినవాడు’ లేదా ‘నరహంతకుడు’
  rationale: చుట్టుపక్కల సందర్భం ప్రమాదవశాత్తు జరిగిన హత్య నుండి దోషపూర్వకమైన హత్యను వేరు చేస్తుంది. ‘హంతకుడు’ ఈ న్యాయ, నైతిక తీర్పును స్పష్టంగా తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘చేతి రాయి’ అనే మూలభాషకు దగ్గరైన పదబంధాన్ని పాఠంలో ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం. ‘మరణశిక్ష విధించాలి’ అనేది నేటి పాఠకులకు స్పష్టమైన న్యాయపరమైన వాడుక.
