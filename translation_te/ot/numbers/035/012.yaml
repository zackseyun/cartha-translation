  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: te
  text: ఆ పట్టణాలు ప్రతీకారం తీర్చుకునేవాని[a] నుండి మీకు ఆశ్రయంగా ఉండాలి; తద్వారా చంపినవాడు న్యాయతీర్పు కోసం సమాజం ఎదుట నిలబడే వరకు మరణించకుండా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్తప్రతీకారం తీర్చుకునే బంధువు.” ఇక్కడి హీబ్రూ పదం గోయేల్; రక్తపాతానికి ప్రతీకారం తీర్చుకునే బాధ్యతగల సమీప బంధువును ఈ సందర్భంలో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לָכֶם הֶעָרִים לְמִקְלָט
  choice: ఆ పట్టణాలు ... మీకు ఆశ్రయంగా ఉండాలి
  rationale: న్యాయనియమ సందర్భంలో భవిష్యత్-ఆదేశాత్మక భావాన్ని ‘ఉండాలి’ సహజంగా వ్యక్తం చేస్తుంది; ‘ఆ పట్టణాలు’ సమీప సందర్భంలో ముందుగా నియమించిన పట్టణాలను సూచిస్తుంది.
- source_word: מִגֹּאֵל
  choice: ప్రతీకారం తీర్చుకునేవాని నుండి
  rationale: గోయేల్ అనే బంధుత్వపదం ఈ హత్యాసంబంధ న్యాయసందర్భంలో రక్తపాతానికి ప్రతీకారం తీర్చుకునే బంధువును సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన సంక్షిప్త రూపం ఉంచి, బంధుత్వ ఛాయను పాదటిప్పణిలో తెలిపాం.
- source_word: וְלֹא יָמוּת
  choice: చనిపోకుండా ఉండేందుకు
  rationale: ఆశ్రయపట్టణాల ఉద్దేశం లేదా ఫలితాన్ని సహజ తెలుగులో చూపుతుంది; ఎవరి చేత మరణం సంభవిస్తుందో అనవసరంగా స్పష్టీకరించదు.
- source_word: הָרֹצֵחַ
  choice: చంపినవాడు
  rationale: తీర్పుకు ముందే అతన్ని ‘హంతకుడు’గా నిర్ధారించకుండా, ఒకరిని చంపిన వ్యక్తి అనే తటస్థ న్యాయస్థితిని నిలుపుతుంది; ఈ సందర్భంలో అనుకోకుండా చంపినవాడూ ఈ వర్గంలో ఉండవచ్చు.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: తీర్పు కోసం సమాజం ఎదుట నిలబడే వరకు
  rationale: హీబ్రూ కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది. ‘సమాజం’ న్యాయపరంగా కూడిన ప్రజాసమూహాన్ని, ‘తీర్పు కోసం’ న్యాయనిర్ణయ ప్రక్రియను సూచిస్తాయి.
theological_decisions:
- issue: తీర్పుకు ముందు הָרֹצֵחַ యొక్క న్యాయస్థితి
  choice: చంపినవాడు
  alternative: హంతకుడు
  rationale: ఈ వాక్యమే సమాజం ఎదుట తీర్పు జరగవలసి ఉందని చెబుతుంది. కాబట్టి అపరాధ ఉద్దేశం లేదా హత్యాదోషం ముందుగానే నిర్ణయించని పదాన్ని ఎంచుకున్నాం.
- issue: హత్యాసంబంధ న్యాయంలో גֹאֵל పదం యొక్క ప్రత్యేక భావం
  choice: ప్రధాన వాక్యంలో ‘ప్రతీకారం తీర్చుకునేవాడు’; పాదటిప్పణిలో రక్తప్రతీకారం తీర్చుకునే సమీప బంధువు అనే వివరణ
  alternative: రక్తప్రతీకారి / బంధు-ప్రతీకారి
  rationale: హీబ్రూ పదంలోని బంధుత్వ పాత్రను కోల్పోకుండా, ప్రధాన వాక్యాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. ‘చంపినవాడు’ అనే తటస్థ పదం తీర్పుకు ముందున్న అనిశ్చిత న్యాయస్థితిని కాపాడుతుంది. మూలంలో ఆశ్రయ భావం ఒక్కసారే ఉన్నందున తెలుగు ముసాయిదాలోనూ పునరుక్తి నివారించి వాక్యాన్ని సంక్షిప్తంగా ఉంచడం మెరుగైన పాఠ్యరూపం.
