source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: te
  text: ఎవరైనా ఒక వ్యక్తిని చంపితే, సాక్షుల వాంగ్మూలం ఆధారంగా[a] ఆ హంతకునికి మరణశిక్ష విధించాలి[b]; అయితే ఒక్క సాక్షి వాంగ్మూలం ఆధారంగా ఒక వ్యక్తికి మరణశిక్ష విధించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సాక్షుల నోటి ప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యంలో ‘హంతకుడు’ అనే పదానికీ అతనిని మరణానికి గురిచేసే క్రియకీ ఒకే పదమూలం వాడబడింది. న్యాయస్థానం చేసే చర్యను చట్టవిరుద్ధ హత్యగా భావించకుండా ఉండేందుకు అనువాదంలో ‘మరణశిక్ష విధించాలి’ అని ఇవ్వబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: ఒక వ్యక్తిని చంపితే
  rationale: ఈ న్యాయ సందర్భంలో ఈ పదబంధం ఒక మనిషి ప్రాణం తీయడాన్ని సూచిస్తుంది. ‘వ్యక్తిని చంపితే’ అనేది ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: נֶפֶשׁ
  choice: వ్యక్తి
  rationale: ఇక్కడ נֶפֶשׁ శరీరానికి వేరైన ‘ఆత్మ’ను కాకుండా మనిషిని లేదా మానవ ప్రాణాన్ని సూచిస్తుంది; అందువల్ల ‘వ్యక్తి’ సందర్భోచితం.
- source_word: לְפִי עֵדִים
  choice: సాక్షుల వాంగ్మూలం ఆధారంగా
  rationale: అక్షరార్థమైన ‘సాక్షుల నోటి ప్రకారం’ అనే హీబ్రూ న్యాయ నుడికారానికి తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: ఆ హంతకునికి మరణశిక్ష విధించాలి
  rationale: హీబ్రూలో רצח మూలం హంతకునికీ అతనిని చంపే న్యాయ చర్యకీ వాడబడింది. తెలుగులో ‘హంతకుణ్ణి హత్య చేయాలి’ అంటే చట్టవిరుద్ధ హత్యగా తప్పుగా వినిపిస్తుంది; ఈ అనువాదం న్యాయపరమైన శిక్షను స్పష్టం చేస్తుంది.
- source_word: הָרֹצֵחַ
  choice: హంతకుడు
  rationale: ఈ సందర్భంలో మరణశిక్షకు పాత్రమైన ఉద్దేశపూర్వక నరహంతకుడు ఉద్దేశించబడ్డాడు; ‘చంపినవాడు’ కంటే ‘హంతకుడు’ న్యాయార్థంలో కచ్చితం.
- source_word: וְעֵד אֶחָד
  choice: అయితే ఒక్క సాక్షి
  rationale: వావ్ సంధి ఇక్కడ అనేక సాక్షుల సరిపడే వాంగ్మూలానికి, ఒక్క సాక్షి సరిపోకపోవడానికి మధ్య వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: לֹא יַעֲנֶה
  choice: వాంగ్మూలం ఆధారంగా ... విధించకూడదు
  rationale: ענה న్యాయ సందర్భంలో సాక్ష్యమివ్వడం లేదా వాంగ్మూలం పలకడం. తెలుగు వాక్యంలో దాని న్యాయపరమైన ప్రభావాన్ని సహజంగా వ్యక్తం చేయడానికి నిర్మాణాన్ని పునర్వ్యవస్థీకరించాం.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: ఒక వ్యక్తికి మరణశిక్ష విధించకూడదు
  rationale: సంక్షిప్త హీబ్రూ న్యాయ పదబంధం ఒక వ్యక్తికి మరణదండన కలిగించే సాక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ఈ భావాన్ని స్పష్టంగా తెలిపే సహజ న్యాయ ప్రయోగం ఇది.
theological_decisions:
- issue: ఒక్క సాక్షి వల్ల కలిగే నిషేధిత ఫలితం
  choice: ఒక్క సాక్షి వాంగ్మూలం ఆధారంగా మరణశిక్ష విధించకూడదు
  alternative: ఒక్క సాక్షి ఒక వ్యక్తికి మరణం కోసం సాక్ష్యమివ్వకూడదు
  rationale: לָמוּת అనే లక్ష్య/ఫలిత భావాన్ని అసహజమైన అక్షరానువాదం లేకుండా న్యాయ సందర్భంలో వ్యక్తం చేస్తుంది; ఇది సాక్షి అసలు మాట్లాడకూడదని కాకుండా, ఒక్క సాక్ష్యం మరణశిక్షకు సరిపోదని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ శైలి. ‘వాంగ్మూలం ఆధారంగా,’ ‘మరణశిక్ష విధించాలి’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని న్యాయ స్వభావాన్ని నిలుపుతాయి. ప్రధాన వాక్యంలో [a], [b] సూచికలు రెండూ చేర్చబడ్డాయి.
