source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: te
  text: అప్పుడు సమాజం రక్తానికి ప్రతీకారం తీర్చేవాని చేతిలోనుండి ఆ చంపిన వ్యక్తిని రక్షించాలి[a]. అతడు పారిపోయిన తన ఆశ్రయ పట్టణానికి సమాజం అతణ్ణి తిరిగి పంపాలి. పవిత్ర తైలంతో ఎవరో అభిషేకించిన ప్రధాన యాజకుడు చనిపోయే వరకు అతడు ఆ పట్టణంలో నివసించాలి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రక్త ప్రతీకారకుడు.’ ఈ హీబ్రూ పదబంధం చిందించబడిన రక్తానికి ప్రతీకారం తీర్చే చట్టబద్ధ బాధ్యతగల వ్యక్తిని—సాధారణంగా సమీప బంధువును—సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అక్కడే ఉండాలి’ లేదా ‘అక్కడ నివసించాలి.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరాలా, ‘పవిత్ర తైలంతో అతనిని అభిషేకించిన [వాడు].’ ‘అభిషేకించిన’ క్రియకు కర్త ఎవరో ఇక్కడ స్పష్టంగా చెప్పబడలేదు. అనేక అనువాదాలు దీనిని ‘అభిషేకించబడిన ప్రధాన యాజకుడు’ అని సులభీకరిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: రక్షించాలి
  rationale: హిఫిల్ రూపం మరొకరి అధికారం లేదా చేతిలోనుండి విడిపించడాన్ని సూచిస్తుంది; న్యాయపరమైన రక్షణ సందర్భంలో ‘రక్షించాలి’ సహజంగా ఉంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: సంఖ్యాకాండంలో న్యాయనిర్ణయం చేసే సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సమాజం’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: הָרֹצֵחַ
  choice: చంపినవాడు
  rationale: ఈ అధ్యాయంలో ఉద్దేశపూర్వక హత్యతో పాటు అనుకోకుండా చంపడాన్నీ ఈ పదం సూచించగలదు. ‘హంతకుడు’ అని అనువదిస్తే ఇంకా నిర్ణయించని దోషభావాన్ని చేర్చే ప్రమాదం ఉంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చుకునేవాడు
  rationale: చిందించబడిన రక్తానికి ప్రతీకారం తీర్చే చట్టబద్ధ బాధ్యతగల వ్యక్తిని సూచిస్తుంది. సమీప బంధువు అనే భావం సందర్భంలో ఉండవచ్చు గాని ఈ పదబంధంలో ప్రత్యక్షంగా లేదు.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: అతణ్ణి తిరిగి పంపాలి
  rationale: హిఫిల్ రూపంలోని ‘తిరిగి వెళ్లేలా చేయడం’ అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עִיר מִקְלָטוֹ
  choice: తన ఆశ్రయపట్టణం
  rationale: ఈ అధ్యాయంలోని చట్టపరమైన ఆశ్రయ స్థలానికి సంక్షిప్తమైన, సహజమైన తెలుగు పదబంధం.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: అతడు పారిపోయిన
  rationale: అతడు ఏ పట్టణానికి పారిపోయాడో తెలిపే సంబంధవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְיָשַׁב בָּהּ
  choice: ఆ పట్టణంలో నివసించాలి
  rationale: ישב లోని నివసించడం లేదా అక్కడే ఉండడం అనే భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: ప్రధాన యాజకుడు చనిపోయే వరకు
  rationale: హీబ్రూ నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంగా అందిస్తుంది.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: అతడు అభిషేకించిన
  rationale: హీబ్రూలో క్రియ కర్తరి ప్రయోగంలో ఉంది; కర్త స్పష్టంగా పేర్కొనబడలేదు. ఆ అస్పష్టతను పరిష్కరించకుండా ‘అతడు’తో నిలుపుతుంది.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: పవిత్ర తైలంతో
  rationale: ప్రతిష్ఠాపనకు ఉపయోగించే పవిత్ర అభిషేక తైలాన్ని సమీపంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: הָרֹצֵחַ అనే వ్యక్తి యొక్క న్యాయస్థితి
  choice: ‘చంపినవాడు’ అని అనువదించబడింది.
  alternative: ‘హంతకుడు’ లేదా ‘ఖూనీ’
  rationale: ఈ అధ్యాయం ఉద్దేశపూర్వక హత్యను అనుకోకుండా జరిగిన చంపడం నుండి వేరు చేస్తుంది. ‘హంతకుడు’ అనడం న్యాయవిచారణకు ముందే అపరాధ ఉద్దేశాన్ని నిర్ధారించినట్టు కావచ్చు.
- issue: מָשַׁח אֹתוֹ లో గుప్త కర్త
  choice: కర్తరి రూపాన్ని ‘అతడు అభిషేకించిన’గా నిలిపి, ‘అతడు’ ఎవరనేది నిర్ధారించలేదు.
  alternative: ‘అభిషేకించబడిన ప్రధాన యాజకుడు’
  rationale: హీబ్రూ పాఠంలో క్రియ 3వ పురుష ఏకవచన కర్తరి రూపంలో ఉంది, కాని కర్త పేరు చెప్పబడలేదు. కర్మణి రూపానికి మార్చడం ఆ వాక్యనిర్మాణ అస్పష్టతను తొలగిస్తుంది కాబట్టి ప్రధాన పాఠంలో అలా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘చంపినవాడు’ ఉద్దేశపూర్వక హత్య అని ముందే తీర్పు ఇవ్వదు. చివరి ఉపవాక్యంలోని హీబ్రూ కర్తరి ప్రయోగం మరియు గుప్త కర్త ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
