translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూలోని క్రియాపురుష మార్పును ‘వారికి ... ఇవ్వాలని’ నుంచి ‘మీరు ... ఇవ్వాలి’ అనే మార్పుతో నిలుపుతూ, భూహక్కులకు సంబంధించిన ద్వంద్వ పదబంధాన్ని అతిగా కఠినంగా కాకుండా సంరక్షించాం.
