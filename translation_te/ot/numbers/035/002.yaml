source:
  edition: WLC
  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారులు[a] తమ స్వాధీనంలోని వారసత్వ భూమిలోనుంచి లేవీయులకు నివసించడానికి పట్టణాలను ఇవ్వాలని వారికి ఆజ్ఞాపించు. ఆ పట్టణాల చుట్టూ ఉన్న బయలు భూములను[b] కూడా మీరు లేవీయులకు ఇవ్వాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ ఈ పదబంధం ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బయలు భూములు’ అనే మాట పట్టణాల చుట్టూ పశువులను మేపడానికి, ఇతర సామూహిక అవసరాలకు ఉపయోగించే తెరచిన భూమిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించు
  rationale: మోషేను ఉద్దేశించిన ఏకవచన ఆజ్ఞార్థక క్రియ యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: וְנָתְנוּ
  choice: ఇవ్వాలని
  rationale: ముందున్న ఆజ్ఞకు లోబడిన ఆదేశార్థాన్ని సహజమైన తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: స్వీకర్తను సూచించే హీబ్రూ దత్తివ భావాన్ని నేరుగా అందిస్తుంది.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: తమ స్వాధీనంలోని వారసత్వ భూమిలోనుంచి
  rationale: נַחֲלָה లోని ‘వారసత్వం’, אֲחֻזָּה లోని ‘స్వాధీనం’ అనే రెండు భూహక్కుల భావాలనూ సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: עָרִים לָשָׁבֶת
  choice: నివసించడానికి పట్టణాలను
  rationale: అనంతరూపం సూచించే ఉద్దేశాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִגְרָשׁ
  choice: బయలు భూములను
  rationale: పట్టణాల చుట్టూ పశువులను మేపడం మరియు ఇతర సామూహిక అవసరాల కోసం ఉంచిన తెరచిన భూమి అనే విస్తృత భావాన్ని ‘పచ్చిక బయళ్లు’ కంటే సమగ్రంగా అందిస్తుంది.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: ఆ పట్టణాల చుట్టూ ఉన్న
  rationale: చుట్టుపక్కల భూమి ఏ పట్టణాలకు సంబంధించినదో తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: תִּתְּנוּ
  choice: మీరు ... ఇవ్వాలి
  rationale: ముందటి మూడవ పురుష బహువచన క్రియ నుంచి ఇక్కడి రెండవ పురుష బహువచనానికి వచ్చే మార్పును స్పష్టంగా నిలుపుతుంది.
