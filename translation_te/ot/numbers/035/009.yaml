    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని, సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దבר అనే క్రియ ఇక్కడ కొత్త వాక్యభాగాన్ని ప్రారంభించే సాధారణ దైవవాక్య సూత్రంలో ఉంది. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘చెప్పాడు’ సహజంగా ఉండి, వెంట వచ్చే לֵאמֹר భావాన్ని ‘ఇలా’ ద్వారా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుకున్నాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిసిన אֶל ఇక్కడ మాట ఎవరిని ఉద్దేశించి పలికిందో సూచిస్తుంది. ఆధునిక సహజ తెలుగులో ‘మోషేతో చెప్పాడు’ అనేది స్పష్టమైన ప్రయోగం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామం מֹשֶׁהకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ క్రియానామ రూపం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా చెప్పాడు:’ అనే నిర్మాణం మూల సూత్రప్రయోగం యొక్క పనిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల ‘ప్రభువు’ అని ప్రత్యామ్నాయం చేయకుండా వ్యక్తిగత నామాన్ని నిలిపాం. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, దాని హీబ్రూ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. తరువాతి వచనంలోని ప్రత్యక్ష వాక్యానికి దారితీయడానికి చివర ద్విబిందువు వాడబడింది.
