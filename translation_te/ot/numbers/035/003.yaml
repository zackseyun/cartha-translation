base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: te
  text: ఆ పట్టణాలు వారు నివసించడానికి ఉండాలి; వాటి చుట్టూ ఉన్న మేతభూములు[a] వారి పశువుల కోసం, వారి ఆస్తిపాస్తుల కోసం[b], వారి జంతువులన్నిటి కోసం ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటి చుట్టూ ఉన్న బహిరంగ భూములు.’ హీబ్రూ పదం పట్టణాల చుట్టూ ఉన్న ఖాళీ ప్రదేశాన్ని సూచిస్తుంది; ఇక్కడ అది ముఖ్యంగా పశువులను మేపడానికి అనువైన భూమి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి సంపద కోసం’ లేదా ‘వారి స్వాధీన వస్తువుల కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: ఆ పట్టణాలు
  rationale: עִיר అనేది పట్టణం లేదా నగరాన్ని సూచిస్తుంది. ఈ నియమావళి సందర్భంలో సహజమైన ఆధునిక తెలుగు పదంగా ‘పట్టణాలు’ ఎంచుకున్నాం.
- source_word: לָשָׁבֶת
  choice: వారు నివసించడానికి
  rationale: ישׁב ధాతువులోని నివసించడం అనే ఉద్దేశార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִגְרְשֵׁיהֶם
  choice: వాటి చుట్టూ ఉన్న మేతభూములు
  rationale: מִגְרָשׁ పట్టణం చుట్టూ వినియోగానికి కేటాయించిన బహిరంగ భూమిని, ఈ సందర్భంలో ముఖ్యంగా పశువుల మేతకు ఉపయోగించే భూమిని సూచిస్తుంది. ‘చుట్టూ ఉన్న’ అనే మాట స్థలసంబంధ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לִבְהֶמְתָּם
  choice: వారి పశువుల కోసం
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు పశువులను సమష్టిగా సూచిస్తుంది; ‘పశువులు’ సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: לִרְכֻשָׁם
  choice: వారి ఆస్తిపాస్తుల కోసం
  rationale: רְכוּשׁ సంపద, ఆస్తి లేదా స్వాధీన వస్తువులను సూచిస్తుంది. ‘ఆస్తిపాస్తులు’ తరువాతి జంతువుల ప్రస్తావనతో కూడిన విస్తృత స్వాధీన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּלְכֹל חַיָּתָם
  choice: వారి జంతువులన్నిటి కోసం
  rationale: חַיָּה ఇక్కడ జీవులు లేదా జంతువులను సూచిస్తుంది. ముందే పశువులు ప్రస్తావించబడినందున, ఈ పదబంధంలోని విస్తృత భావాన్ని ‘జంతువులన్నిటి’గా నిలిపాం.
