translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి సందర్భానికి తగిన గంభీరతతో కూడిన సహజమైన వాక్య నిర్మాణం వాడబడింది. ఇద్దరు పురుషులను సూచించే అస్పష్ట సర్వనామాల వల్ల కలిగే గందరగోళాన్ని తగ్గించేందుకు మొదటి సూచనలో ‘ఒకడు,’ రెండవదిలో ‘మరొకణ్ణి’ అని పేర్కొని, తరువాత మూలంలోని సర్వనామ నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుకున్నాం.
