id: NUM.35.20
reference: Numbers 35:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: te
  text: అయితే, ఒకడు ద్వేషంతో మరొకణ్ణి తోసినా, లేదా దురుద్దేశంతో[a] అతనిపై ఏదైనా విసిరినా, అతడు చనిపోతే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కావాలని,” లేదా “పొంచి ఉండి.” హెబ్రీ పదం శత్రుత్వంతో కూడిన ఉద్దేశపూర్వక చర్యను సూచిస్తుంది; పొంచి దాడి చేయడం అనే భావం కూడా ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి అనుకోని మరణం సందర్భానికి భిన్నమైన షరతును ప్రవేశపెడుతుంది; ఆధునిక తెలుగు న్యాయ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: בְּשִׂנְאָה
  choice: ద్వేషంతో
  rationale: ఈ పదబంధం చర్య వెనుక ఉన్న ద్వేషపూరిత ఉద్దేశాన్ని లేదా చర్య జరిగిన తీరును వ్యక్తం చేస్తుంది.
- source_word: יֶהְדָּפֶנּוּ
  choice: మరొకణ్ణి తోసినా
  rationale: హెబ్రీ క్రియ తోసడం లేదా బలంగా నెట్టడం అనే అర్థం ఇస్తుంది; దెబ్బకొట్టడం అని అతిశయంగా చెప్పకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: אוֹ
  choice: లేదా
  rationale: ప్రత్యామ్నాయ చర్యను పరిచయం చేసే సాధారణ విభజక సంధి.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: అతని మీద ఏదైనా విసిరినా
  rationale: హెబ్రీలో విసిరిన వస్తువు స్పష్టంగా చెప్పబడలేదు; తెలుగులో వాక్యం సహజంగా, అర్థవంతంగా ఉండేందుకు ‘ఏదైనా’ చేర్చబడింది. ‘అతని మీద’ శత్రుత్వ దిశను నిలుపుతుంది.
- source_word: בִּצְדִיָּה
  choice: కావాలని[a]
  rationale: ఈ అరుదైన న్యాయపదం ఉద్దేశపూర్వకమైన శత్రుత్వ చర్యను సూచిస్తుంది; పొంచి ఉండడం లేదా దురుద్దేశం అనే మరింత నిర్దిష్ట భావాలను పాదసూచికలో నిలుపుతున్నాం.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోతే
  rationale: హెబ్రీలోని ఫలితాన్ని తెలుగు షరతు వాక్య నిర్మాణానికి సహజంగా అనుసంధానిస్తుంది; మరణానికి దారితీసిన చర్యతో సంబంధాన్ని సందర్భమే తెలియజేస్తుంది.
