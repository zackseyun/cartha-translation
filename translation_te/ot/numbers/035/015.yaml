  to: ఇశ్రాయేలు కుమారులకూ[a], వారి మధ్య నివసించే పరదేశికీ, నివాసికీ[b] ఈ ఆరు పట్టణాలు ఆశ్రయంగా ఉండాలి. అనుకోకుండా ఒక వ్యక్తిని చంపినవాడెవరైనా[c] అక్కడికి పారిపోవచ్చు.
