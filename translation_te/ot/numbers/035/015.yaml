id: NUM.35.15
reference: Numbers 35:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులకూ[a], వారి మధ్య నివసించే పరదేశికీ, నివాసికీ[b] ఈ ఆరు పట్టణాలు ఆశ్రయంగా ఉండాలి. అనుకోకుండా ఒక వ్యక్తిని చంపినవాడెవరైనా[c] అక్కడికి పారిపోవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులకు,’ లేదా ‘ఇశ్రాయేలు సంతానానికి.’
    reason: lexical_alternative
  - marker: b
    text: ‘పరదేశి,’ ‘నివాసి’ అనే మాటలు ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తుల కోసం వాడిన రెండు వేర్వేరు హీబ్రూ పదాలను (גֵּר, תּוֹשָׁב) సూచిస్తున్నాయి.
    reason: cultural_note
  - marker: c
    text: మూలభాషలో అక్షరార్థంగా, ‘ఒక వ్యక్తిని కొట్టినవాడెవరైనా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ జాతీయ-నిబంధనాత్మక సంజ్ఞలోని పుంలింగ రూపాన్ని నిలుపుతూ, తెలుగులో సహజమైన దత్తివిభక్తితో ఇచ్చాం.
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో స్థానికుడు కాకపోయినా అక్కడ నివసించే వ్యక్తిని సూచించే న్యాయ-సామాజిక భావాన్ని ఈ సాధారణ తెలుగు పదం అందిస్తుంది.
- source_word: תּוֹשָׁב
  choice: ఇతర నివాసి
  rationale: גֵּר నుండి వేరైన హీబ్రూ పదమని పాఠ్యంలోనే కొంత స్పష్టంగా ఉండేలా, అక్కడ నివసిస్తున్నా పూర్తి స్థానిక హోదా లేని వ్యక్తిని సూచించడానికి వేరే తెలుగు పదబంధాన్ని వాడాం.
- source_word: בְּתוֹכָם
  choice: వారి మధ్య నివసించే
  rationale: ఇశ్రాయేలీయుల సమాజం మధ్య ఆ వ్యక్తులు నివసిస్తున్నారనే సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: ఈ ఆరు పట్టణాలు ఆశ్రయంగా ఉండాలి
  rationale: పట్టణాలకు విధించిన న్యాయపరమైన ఉద్దేశాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు శాసన శైలిలో తెలియజేస్తుంది.
- source_word: לָנוּס שָׁמָּה
  choice: అక్కడికి పారిపోవచ్చు
  rationale: ఆశ్రయ పట్టణాల ఉద్దేశాన్ని తెలుగులో సహజంగా తెలుపుతుంది; అనుమతి లేదా అవకాశ భావం సందర్భానుసారంగా నిలుస్తుంది.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: ఒక వ్యక్తిని చంపినవాడెవరైనా
  rationale: అక్షరార్థంగా ‘ప్రాణిని/వ్యక్తిని కొట్టిన ప్రతి వాడు’; ఈ నరహత్య న్యాయసందర్భంలో మరణం కలిగించిన వ్యక్తి అని స్పష్టంగా, సహజంగా అనువదించాం.
- source_word: נֶפֶשׁ
  choice: వ్యక్తి
  rationale: ఇక్కడ ఇది ‘ఆత్మ’ అనే అమూర్త భావాన్ని కాక, చంపబడిన మానవ వ్యక్తిని సూచిస్తుంది.
- source_word: בִּשְׁגָגָה
  choice: అనుకోకుండా
  rationale: ఉద్దేశపూర్వకంగా కాకుండా జరిగిన చర్య అనే న్యాయపరమైన వ్యత్యాసాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל లోని పుంలింగ జాతీయ-నిబంధనాత్మక సంజ్ఞ
  choice: ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు కుమారులు’ అని నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతానం’
  rationale: మూలంలోని ప్రామాణిక జాతీయ సంజ్ఞ రూపాన్ని పారదర్శకంగా నిలుపుతూ, ప్రత్యామ్నాయ సహజ రూపాలను పాదటిప్పణిలో ఇచ్చాం.
- issue: גֵּר మరియు תּוֹשָׁב మధ్య సామాజిక-న్యాయ భేదం
  choice: ‘పరదేశి’ మరియు ‘ఇతర నివాసి’ అనే రెండు వేర్వేరు పదాలు
  alternative: రెండింటినీ కలిపి ‘వారి మధ్య నివసించే పరదేశులు’ అని అనువదించడం
  rationale: మూలంలో ఉద్దేశపూర్వకంగా ఉన్న రెండు వర్గాల భేదాన్ని ఒకే పదంలో కలిపి తొలగించకుండా నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-కథన శైలిని వాడాం. ‘ఇశ్రాయేలు కుమారులు’ ద్వారా మూలంలోని రూపం నిలిచింది; గేర్/తోషావ్ భేదం అతిగా సాంకేతికంగా కాకుండా రెండు వేర్వేరు పదాలతో కాపాడబడింది.
