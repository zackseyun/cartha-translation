    reason: עֵץ יָד అనే హీబ్రూ పదబంధం చేతిలో ఉన్న లేదా చేతితో పట్టుకొని ఉపయోగించే చెక్క వస్తువు/పనిముట్టు అనే దగ్గరి భావాలను అనుమతిస్తుంది.
  revision_rationale: The revision removes the added striking action from the implement’s descriptive clause, expresses lethal capacity directly, and clarifies that the person struck is the one who dies. It preserves the source’s legal sequence and the existing footnote anchor.
