id: NUM.35.18
reference: Numbers 35:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: te
  text: లేదా, ఒకడు ఒకరు చనిపోయేంతటి చేతిలో పట్టుకునే చెక్క వస్తువుతో[a] ఒకరిని కొట్టి, ఆ వ్యక్తి చనిపోతే, అతడు హంతకుడు; హంతకుడికి తప్పక మరణశిక్ష విధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చేతిలో ఉన్న చెక్క వస్తువుతో,” “చేతితో పట్టుకునే చెక్క పనిముట్టుతో,” లేదా “చేతిలో పట్టుకున్న చెక్క వస్తువుతో.”
    reason: עֵץ יָד అనే హీబ్రూ పదబంధం చేతిలో ఉన్న లేదా చేతితో పట్టుకొని ఉపయోగించే చెక్క వస్తువు/పనిముట్టు అనే దగ్గరి భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: చేతిలో ఉన్న చెక్క వస్తువుతో
  rationale: כְּלִי అనే పదానికి వస్తువు, పనిముట్టు, ఆయుధం వంటి విస్తృత అర్థపరిధి ఉంది; ఈ హత్యా చట్ట సందర్భంలో ‘వస్తువు’ ఆ విస్తృతిని నిలుపుతుంది. יָד చేతితో పట్టుకొని ఉపయోగించగలదనే భావాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: దానితో కొడితే మనిషి చనిపోవచ్చు
  rationale: ఈ సంబంధవాక్యం కేవలం ఈ సంఘటన ఫలితాన్ని కాక, ఆ వస్తువుకు ప్రాణాంతక సామర్థ్యం ఉందని వివరిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు సందర్భంలోని ‘కొట్టడం’ భావాన్ని స్పష్టపరచబడింది.
- source_word: הִכָּהוּ
  choice: అతణ్ణి కొట్టగా
  rationale: נכה యొక్క సాధారణ అర్థం ‘కొట్టు’; తరువాతి వాక్యమే మరణాన్ని తెలియజేస్తుంది కాబట్టి ‘కొట్టి చంపాడు’ అని ముందుగానే ఫలితాన్ని కలపలేదు.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోతే
  rationale: హీబ్రూ వరుసలోని ఫలితాన్ని తెలుగులో చట్టపరమైన షరతు నిర్మాణానికి సహజంగా అనుసంధానిస్తుంది.
- source_word: רֹצֵחַ
  choice: హంతకుడు
  rationale: ఈ సందర్భం ప్రమాదవశాత్తు జరిగిన హత్యను ఉద్దేశపూర్వకమైన లేదా దోషపూరితమైన ప్రాణహరణం నుంచి వేరు చేసి శిక్షను నిర్దేశిస్తుంది; ‘హంతకుడు’ ఆ న్యాయపరమైన తీర్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מוֹת יוּמַת
  choice: తప్పక మరణశిక్ష విధించాలి
  rationale: క్రియానామ అవ్యయం మరియు నిష్క్రియ క్రియ కలయికలోని బలమైన న్యాయ ఆజ్ఞను ‘తప్పక’ నిలుపుతుంది; ‘మరణశిక్ష విధించాలి’ ఆధునిక తెలుగులో స్పష్టమైన న్యాయపరమైన వ్యక్తీకరణ.
theological_decisions:
- issue: హత్యా చట్టంలో רֹצֵחַ యొక్క న్యాయపరమైన వర్గీకరణ
  choice: హంతకుడు
  alternative: చంపినవాడు; నరహంతకుడు
  rationale: సమీప సందర్భం ప్రమాదవశాత్తు జరిగిన ప్రాణహరణాన్ని దోషపూర్వక హత్య నుంచి వేరు చేసి దీనికి మరణశిక్షను నిర్దేశిస్తుంది. ‘హంతకుడు’ ఈ న్యాయ-నైతిక నిర్ణయాన్ని తెలియజేస్తూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించాం. మూలంలోని షరతు, ప్రాణాంతక సామర్థ్యం, ‘హంతకుడు’ అనే వర్గీకరణ, తప్పనిసరి శిక్ష అనే బలాన్ని నిలిపాం. [a] సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
