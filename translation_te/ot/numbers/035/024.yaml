  naturalness: The legal sense is clear, but “తీర్పు తీర్చాలి” is less idiomatic than “తీర్పు చెప్పాలి” in modern standard Telugu. Explicit correlative dative endings and light punctuation make the two parties and the judicial relationship easier to read.
