source:
  edition: WLC
  text: וְ/שָֽׁפְטוּ֙ הָֽ/עֵדָ֔ה בֵּ֚ין הַ/מַּכֶּ֔ה וּ/בֵ֖ין גֹּאֵ֣ל הַ/דָּ֑ם עַ֥ל הַ/מִּשְׁפָּטִ֖ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/024.yaml
  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: te
  text: అప్పుడు సమాజం, కొట్టినవానికీ రక్తానికి ప్రతీకారం తీర్చేవానికీ[a] మధ్య, ఈ న్యాయనియమాల[b] ప్రకారం తీర్పు చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్త ప్రతీకారకుడు.’ ఈ హీబ్రూ పదబంధం చంపబడిన బంధువు రక్తానికి ప్రతీకారం తీర్చే బాధ్యతగల వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ న్యాయతీర్పుల ప్రకారం.’ హీబ్రూ పదం న్యాయ నియమాలను లేదా న్యాయపరమైన తీర్పులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: అప్పుడు ... తీర్పు తీర్చాలి
  rationale: సంయోజక అవ్యయంతో వచ్చిన క్రియారూపం ఈ న్యాయవిధానంలోని తదుపరి చర్యను సూచిస్తుంది. ‘తీర్పు తీర్చాలి’ అనేది న్యాయపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఇది ఇశ్రాయేలు సమూహాన్ని సమష్టిగా, ఇక్కడ న్యాయపరమైన బాధ్యత వహించే వర్గంగా సూచిస్తుంది. ‘సమాజం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, దానిని కేవలం ప్రత్యేక న్యాయస్థానంగా పరిమితం చేయదు.
- source_word: בֵּין ... וּבֵין
  choice: '... వానికి, ... వానికి మధ్య'
  rationale: హీబ్రూలోని పరస్పర పక్షాల నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: הַמַּכֶּה
  choice: కొట్టినవాడు
  rationale: హీబ్రూ కృదంతానికి సన్నిహితమైన పదం. ఈ దశలో అతణ్ణి ‘హంతకుడు’గా నిర్ధారించకుండా న్యాయపరమైన తటస్థతను కాపాడుతుంది; హీబ్రూలో స్పష్టంగా లేని కర్మను కూడా చేర్చదు.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చుకునేవాడు
  rationale: బంధువు రక్తానికి ప్రతీకారం తీర్చే చట్టబద్ధ పాత్రను హీబ్రూ నుడికారానికి దగ్గరగా, తెలుగులో అర్థమయ్యేలా తెలియజేస్తుంది. బంధుత్వం ఈ వచనంలోని పదబంధంలో ప్రత్యక్షంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: עַל
  choice: ప్రకారం
  rationale: ఇక్కడ పేర్కొన్న న్యాయ ప్రమాణాలకు అనుగుణంగా తీర్పు ఇవ్వాలనే నియమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ఈ న్యాయనియమాలు
  rationale: מִשְׁפָּטִים అనే పదంలోని చట్టపరమైన తీర్పులు/నియమాలు అనే అర్థపరిధిని ‘న్యాయనియమాలు’ స్పష్టంగా అందిస్తుంది; కేవలం ఇప్పటికే ఇచ్చిన తీర్పులు అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: నరహత్య వ్యవహారంలో సమాజపు న్యాయపాత్ర
  choice: సమాజం కొట్టినవానికి, రక్తప్రతీకారం తీర్చుకునే వానికి మధ్య తీర్పు తీర్చాలి
  alternative: ‘సమాజం’ను ఒక పరిమిత న్యాయస్థానంగా పేర్కొనడం లేదా కొట్టినవాణ్ణి ముందుగానే ‘హంతకుడు’గా అనువదించడం
  rationale: హీబ్రూ పాఠ్యం సమాజానికి మధ్యవర్తి న్యాయపాత్రను అప్పగిస్తుంది; అయితే ఈ వచనంలో నిందితుడు ఉద్దేశపూర్వక హంతకుడని ముందుగానే తేల్చదు. అందువల్ల అనువాదం విధానపరమైన తటస్థతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘సమాజం,’ ‘కొట్టినవాడు,’ ‘న్యాయనియమాలు’ వంటి పదాలు మూలంలోని విధానపరమైన తటస్థతను, చట్టపరమైన స్వరాన్ని కాపాడుతాయి. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
