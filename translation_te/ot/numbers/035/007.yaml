  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: te
  text: లేవీయులకు మీరు ఇవ్వవలసిన పట్టణాలు, వాటి చుట్టూ ఉన్న మేతభూములతో[a] సహా, మొత్తం నలభై ఎనిమిది పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సామూహిక భూములు’ లేదా ‘బహిరంగ భూములు’; ఇది పట్టణాల చుట్టూ ఉన్న భూభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: పట్టణాలు మొత్తం
  rationale: כָּל ఇక్కడ ఇవ్వవలసిన పట్టణాల సంపూర్ణ సంఖ్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మొత్తం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: మీరు ఇవ్వవలసిన
  rationale: נתן అనే క్రియ యొక్క ద్వితీయ పురుష బహువచన అసంపూర్ణ రూపం ఈ న్యాయనిర్దేశ సందర్భంలో బాధ్యతను సూచిస్తుంది; ‘ఇవ్వవలసిన’ ఆ నిర్దేశ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: నలభై ఎనిమిది
  rationale: హీబ్రూ సంఖ్యా ప్రయోగాన్ని సహజమైన తెలుగు సంఖ్యా రూపంలో అందిస్తుంది; ‘పట్టణాలు’ ఇప్పటికే వాక్యంలోని కర్తగా ఉంది.
- source_word: אֶתְהֶן
  choice: ఆ పట్టణాలను
  rationale: సర్వనామ ప్రత్యయంతో కూడిన కర్మ సూచిక ముందుగా పేర్కొన్న పట్టణాలను మళ్లీ స్పష్టంగా సూచిస్తుంది. దానిని విడిచిపెట్టకుండా తెలుగులో సహజంగా పునరుద్ఘాటించాం.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: వాటి చుట్టూ ఉన్న పచ్చికబయళ్లను
  rationale: מִגְרָשׁ పట్టణం చుట్టూ ఉండే బహిరంగ లేదా సామూహిక భూమిని, ఈ సందర్భంలో పశువుల మేతకు ఉపయోగించే భూమిని సూచిస్తుంది. ‘చుట్టూ ఉన్న పచ్చికబయళ్లు’ ప్రధాన సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
