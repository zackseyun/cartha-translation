  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: te
  text: ఇశ్రాయేలీయుల[a] స్వాస్థ్యం నుంచి మీరు ఇచ్చే పట్టణాల విషయంలో—ఎక్కువ స్వాస్థ్యం ఉన్నవారు ఎక్కువగా, తక్కువ స్వాస్థ్యం ఉన్నవారు తక్కువగా ఇవ్వాలి.[b] ప్రతి గోత్రం తనకు లభించే స్వాస్థ్యానికి తగినట్లుగా తన పట్టణాల్లో కొన్నిటిని లేవీయులకు ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ ఆ పదబంధం ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో అక్షరార్థంగా, ‘ఎక్కువ నుంచి ఎక్కువ చేయాలి; తక్కువ నుంచి తగ్గించాలి.’ భావం: పెద్ద స్వాస్థ్య వాటా పొందినవారు ఎక్కువ పట్టణాలు, చిన్న వాటా పొందినవారు తక్కువ పట్టణాలు ఇవ్వాలి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: עִיר అనేది నగరం లేదా పట్టణాన్ని సూచించగలదు; ఈ భూవిభజన సందర్భంలో సాధారణ పాఠకులకు సహజంగా ఉండే ‘పట్టణాలు’ అనువైనది.
- source_word: אֲחֻזַּת
  choice: స్వాస్థ్యం
  rationale: అప్పగించబడిన భూహక్కు లేదా వంశపారంపర్య భూవాటా అనే నిబంధనాత్మక భావాన్ని ‘స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ అది నిబంధన సమాజమంతటినీ సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన సమూహపదం వాడబడింది.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: ఎక్కువ స్వాస్థ్యం ఉన్నవారు ఎక్కువగా, తక్కువ స్వాస్థ్యం ఉన్నవారు తక్కువగా ఇవ్వాలి
  rationale: ‘ఎక్కువ/తక్కువ’ అనే హీబ్రూ సంక్షిప్త ప్రయోగం గోత్రాల స్వాస్థ్య పరిమాణానికి అనుగుణంగా పట్టణాలు ఇవ్వాలనే భావాన్ని సూచిస్తుంది; తెలుగు వాక్యం ఆ నిష్పత్తి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  choice: ఒక్కొక్క గోత్రంవారు తాము స్వాస్థ్యంగా పొందే వాటాకు తగినట్లుగా
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని ‘ఒక్కొక్క’ నిలుపుతుంది. బహువచన క్రియ יִנְחָלוּను గౌరవిస్తూ, సందర్భంలో పట్టణాలు ఇచ్చే గోత్ర సమూహాలను ‘గోత్రంవారు/తాము’గా వ్యక్తం చేసింది.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: తమ పట్టణాల్లో కొన్నిటిని లేవీయులకు ఇవ్వాలి
  rationale: విభక్తి מִן యొక్క భాగార్థాన్ని ‘కొన్నిటిని’ సహజంగా తెలియజేస్తుంది; לַלְוִיִּםకు ప్రామాణిక రూపం ‘లేవీయులకు’.
theological_decisions:
- issue: ఆజ్ఞ ఎవరికి పంపిణీ చేయబడింది
  choice: ఒక్కొక్క గోత్రంవారు
  alternative: ఒక్కొక్కరు
  rationale: వ్యక్తిగత ఇశ్రాయేలీయులు కాకుండా గోత్ర స్వాస్థ్యాల నుంచి పట్టణాలు కేటాయించబడుతున్న సందర్భం కావడంతో, ‘గోత్రంవారు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ఏ ప్రత్యేక సిద్ధాంత భావననూ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే రూపం. ‘స్వాస్థ్యం,’ ‘వాటా,’ ‘పట్టణాలు’ వంటి పదాలు భూవిభజన సందర్భాన్ని స్పష్టంగా ఉంచుతాయి; హీబ్రూ వాక్యంలోని సంక్షిప్తత వల్ల కలిగే అస్పష్టతను పాదటిప్పణిలో సంరక్షించింది.
