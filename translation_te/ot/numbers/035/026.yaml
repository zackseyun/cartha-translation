  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: te
  text: అయితే, నరహంతకుడు తాను పారిపోయిన ఆశ్రయపట్టణపు సరిహద్దును దాటి నిజంగా బయటికి వెళ్తే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను పారిపోయిన ఆశ్రయపట్టణపు సరిహద్దు వెలుపలికి వెళ్తే.” హెబ్రీలో “బయటికి వెళ్లడం, బయటికి వెళ్తే” అని ఒకే క్రియను పునరుక్తి చేసి నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … వెళ్తే
  rationale: ముందున్న న్యాయనిబంధనకు భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָצֹא יֵצֵא
  choice: ఎప్పుడైనా బయటికి వెళ్తే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, అతడు నిజంగా సరిహద్దు దాటే సందర్భాన్ని నొక్కిచెబుతుంది.
- source_word: הָרֹצֵחַ
  choice: నరహంతకుడు
  rationale: ఆశ్రయపట్టణాల న్యాయసందర్భంలో ఇతడు తప్పనిసరిగా ఉద్దేశపూర్వక హంతకుడు కాదు; అందువల్ల దోషనిర్ణయాన్ని ముందుగానే సూచించని పదాన్ని ఎంచుకున్నాం.
- source_word: אֶת גְּבוּל
  choice: సరిహద్దును దాటి
  rationale: יצאతో కలిసినప్పుడు సరిహద్దు వెలుపలికి వెళ్లడం అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִיר מִקְלָטוֹ
  choice: ఆశ్రయపట్టణపు
  rationale: ఈ న్యాయవ్యవస్థలోని ప్రత్యేక ఆశ్రయనగరాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలిపే సంక్షిప్త రూపం; ప్రత్యయం సందర్భంలో అతనికి సంబంధించిన పట్టణాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: తాను పారిపోయిన
  rationale: שָׁמָּהలోని గమనదిశ భావాన్ని పట్టణంతో సహజంగా అనుసంధానిస్తూ సంబంధవాక్యాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదం దోషస్థాయిని ఎలా సూచించాలి
  choice: నరహంతకుడు
  alternative: హంతకుడు
  rationale: సందర్భం అనుకోకుండా చంపి ఆశ్రయం పొందిన వ్యక్తినీ కలుపుతుంది; ‘హంతకుడు’ ఉద్దేశపూర్వక హత్యదోషాన్ని సూచించే అవకాశమున్నందున తటస్థమైన న్యాయపదాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయసంబంధ గంభీరతను నిలుపుతూ, సాధారణ పాఠకునికి అర్థమయ్యే పదాలను వాడాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
