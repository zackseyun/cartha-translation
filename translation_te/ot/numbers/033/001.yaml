revisions:
- from: మోషే, అహరోనుల ద్వారా[d] తమ తమ దళాలుగా[c] ఐగుప్తు దేశం నుండి బయలుదేరిన ఇశ్రాయేలు కుమారుల[b] ప్రయాణ మజిలీలు[a] ఇవి.
  to: ఇవి ఇశ్రాయేలు కుమారులు[b] ఐగుప్తు దేశం నుండి తమ దళాల ప్రకారం[c] మోషే, అహరోనుల చేత[d] బయలుదేరిన ప్రయాణ దశలు[a].
  rationale: The revision preserves the Hebrew itinerary heading, the familial expression “sons of Israel,” the explicit “land of Egypt,” and the ambiguity of צָבָא as organized divisions that may have a military connotation. It improves the representation of the preposition in לְצִבְאֹתָם and uses a natural Telugu agency idiom for בְּיַד without imposing an interpretive theological claim.
