  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: te
  text: ఇవి ఇశ్రాయేలు కుమారులు[b] ఐగుప్తు దేశం నుండి తమ దళాల ప్రకారం[c] మోషే, అహరోనుల చేత[d] బయలుదేరిన ప్రయాణ దశలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రయాణాలు’ లేదా ‘బయలుదేరిన దశలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఇశ్రాయేలీయుల ప్రయాణ క్రమంలోని వరుస దశలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు సంతానం’ లేదా ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘తమ తమ సైన్యాల ప్రకారం’ లేదా ‘తమ తమ విభాగాలుగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి క్రమబద్ధమైన, సైనిక అమరిక భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూ నుడికారంలో అక్షరార్థంగా ‘మోషే, అహరోనుల చేత’ అని ఉంది; అంటే వారి కార్యసాధకత్వం లేదా నాయకత్వంలో అని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: తరువాత వచ్చే జాబితాను పరిచయం చేసే హీబ్రూ సూచక సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: מַסְעֵי
  choice: ప్రయాణ మజిలీలు
  rationale: ఇది కేవలం ప్రయాణాలను మాత్రమే కాకుండా, ప్రయాణ క్రమంలోని వరుస దశలను లేదా ఒక చోటు నుండి మరొక చోటుకు బయలుదేరిన ఘట్టాలను సూచిస్తుంది. ‘ప్రయాణ మజిలీలు’ జాబితా స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబ సంబంధ వ్యక్తీకరణను నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: אֲשֶׁר יָצְאוּ
  choice: బయలుదేరిన
  rationale: יצא అనే క్రియలోని ఒక ప్రదేశం నుండి వెలుపలికి వెళ్లే భావాన్ని సహజమైన తెలుగు సంబంధ క్రియారూపంలో వ్యక్తపరుస్తుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలో ఉన్న ‘దేశం’ అనే పదాన్ని నిలుపుతూ, బయలుదేరిన స్థలాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: לְצִבְאֹתָם
  choice: తమ తమ దళాలుగా
  rationale: צָבָא లోని క్రమబద్ధమైన విభాగాలు లేదా సైనిక సమూహాలు అనే భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో తప్పనిసరిగా యుద్ధంలో ఉన్న సైన్యాలు అని అతిగా నిర్ధారించదు.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: హీబ్రూ ‘చేతి ద్వారా’ అనే నుడికారంలోని కార్యసాధకత్వం లేదా నాయకత్వ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో అందిస్తుంది.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపాలు; వాక్యంలో సంబంధ విభక్తితో ‘మోషే, అహరోనుల’ అని ఉంది.
