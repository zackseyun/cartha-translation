translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వాక్య క్రమాన్ని యథాతథంగా అనుసరించకుండా, ప్రధాన పదబంధమైన ‘ప్రయాణ మజిలీలు ఇవి’ చివర ఉంచి సహజమైన తెలుగు ప్రవాహం సాధించబడింది. ‘మజిలీలు’ సాధారణంగా అర్థమయ్యే ప్రయాణ-దశల పదంగా వాడబడింది; దాని భావ పరిధిని పాదసూచిక వివరిస్తుంది.
