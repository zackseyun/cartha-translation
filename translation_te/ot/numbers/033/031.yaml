translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రయాణ-జాబితా శైలిని పాటించాం. పేర్లను మూల హీబ్రూ ఉచ్చారణకు సమీపంగా ధ్వన్యంతరీకరించాం.
