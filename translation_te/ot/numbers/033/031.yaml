base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: te
  text: వారు మోసేరోతు నుండి బయలుదేరి బెనేయాకానులో[a] శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘బెనేయాకాను’ అనే పేరుకు అక్షరార్థం ‘యాకాను కుమారులు’; అయితే ఇక్కడ అది స్థలనామంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాలో נסע అనే క్రియ శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִמֹּסֵרֹות
  choice: మోసేరోతు నుండి
  rationale: מִן ఉపసర్గకు ‘నుండి’ అని అనువదించాం; స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: ప్రయాణ సందర్భంలో חנה అంటే ఒక చోట ఆగి శిబిరం వేయడం; ఈ తెలుగు పదబంధం సహజంగా, స్పష్టంగా ఉంది.
- source_word: בִּבְנֵי יַעֲקָן
  choice: బెనేయాకానులో
  rationale: בְּ ఉపసర్గను స్థలసూచకంగా ‘లో’ అని అందించాం. పదబంధానికి అక్షరార్థంగా ‘యాకాను కుమారులు’ అయినప్పటికీ, ఇక్కడ అది ప్రయాణ జాబితాలోని స్థలనామంగా పనిచేస్తుంది కాబట్టి ధ్వన్యంతరీకరించాం.
