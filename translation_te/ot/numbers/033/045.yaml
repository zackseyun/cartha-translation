  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: te
  text: వారు ఇయ్యీము[b] నుండి బయలుదేరి, దీబోను-గాదు వద్ద మకాం వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శిబిరం వేశారు’ అని కూడా అనువదించవచ్చు. ప్రయాణ దశలను తెలిపే హీబ్రూ వాక్యాల్లో ఈ క్రియ సాధారణంగా శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇయ్యీము అనే స్థలనామాన్ని ‘ఇయీము’ లేదా ‘ఈము’ అని కూడా ధ్వన్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: సంఖ్యాకాండంలోని ప్రయాణ దశల సూత్రంలో נסע ఒక మకాం నుండి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఈ కదలిక భావాన్ని తెలియజేస్తుంది.
- source_word: מֵעִיִּים
  choice: ఈయీము నుండి
  rationale: מֵ ఉపసర్గకు ‘నుండి’ అని అనువదించబడింది. עִיִּים స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ప్రయాణ వర్ణనల్లో חנה శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: בְּדִיבֹן גָּד
  choice: దీబోను-గాదులో
  rationale: ప్రయాణ దశల సందర్భంలో בְּ స్థలాన్ని సూచిస్తుంది. דִיבֹן גָּדను విడదీసి అర్థం చెప్పకుండా, సమగ్ర స్థలనామంగా ‘దీబోను-గాదు’ అని ధ్వన్యంతరీకరించబడింది.
