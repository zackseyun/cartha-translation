  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: te
  text: అయితే మీరు దేశ నివాసులను మీ ఎదుటనుండి వెళ్లగొట్టకపోతే, వారిలో ఎవరినైతే మీరు మిగిలి ఉండనిస్తారో, వారు మీ కళ్లలో గుచ్చే మొనలుగా[a], మీ పక్కల్లో ముళ్లుగా[b] ఉంటారు. మీరు నివసించే దేశంలో వారు మిమ్మల్ని వేధిస్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ కళ్లలో గుచ్చే ముళ్లుగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ నామవాచకం అరుదైనది; అది గుచ్చే పదునైన వస్తువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మీ పక్కల్లో కొక్కేలుగా’ లేదా ‘మీ పక్కల్లో గుచ్చే మొనలుగా’ అని కూడా అనువదించవచ్చు. జతగా వచ్చిన ఈ రెండు రూపకాలూ మిగిలిపోయిన నివాసుల వల్ల కలిగే నిరంతరమైన బాధను వర్ణిస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: ‘వారు మిమ్మల్ని ఇబ్బంది పెడతారు’ లేదా ‘వారు మిమ్మల్ని అణచివేస్తారు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ శత్రుత్వంతో కలిగించే వివిధ రకాల బాధను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: వెళ్లగొట్టడం
  rationale: హిఫిల్ రూపం ప్రస్తుత నివాసులను వారి స్వాధీనస్థలం నుండి తొలగించడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, బలవంతపు తొలగింపు భావాన్ని నిలుపుతుంది.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: దేశ నివాసులు
  rationale: భూమి/దేశంలో నివసిస్తున్నవారిని సూచించే కృదంత నిర్మాణానికి సరళమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: ఇశ్రాయేలు ముందుకు సాగుతుండగా వారి ఎదుటనుండి తొలగించబడే స్థలసంబంధ హీబ్రూ నుడికారాన్ని నిలుపుతుంది.
- source_word: תּוֹתִירוּ
  choice: మీరు మిగిలి ఉండనిచ్చేవారు
  rationale: హిఫిల్ రూపంలోని ‘మిగిలేలా చేయడం/మిగిలి ఉండనివ్వడం’ అనే కారక భావాన్ని వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని ‘కనికరించి విడిచిపెట్టడం’ అనే భావాన్ని చేర్చదు.
- source_word: לְשִׂכִּים
  choice: గుచ్చుకునే మొనలు
  rationale: అరుదైన ఈ నామవాచకం గుచ్చే పదునైన వస్తువును సూచిస్తుంది. తదుపరి ‘ముళ్లు’ అనే రూపకంతో భేదాన్ని ఉంచేందుకు ‘గుచ్చుకునే మొనలు’ ఎంచుకోబడింది.
- source_word: בְּעֵינֵיכֶם
  choice: మీ కళ్లలో
  rationale: స్పష్టమైన శరీర రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לִצְנִינִם
  choice: ముళ్లు
  rationale: పదునుగా గుచ్చే వస్తువులను సూచించే ఈ పదానికి ‘ముళ్లు’ సహజమైన తెలుగు రూపం; పక్కల్లో నిరంతర బాధ కలిగించే రూపకాన్ని నిలుపుతుంది.
- source_word: בְּצִדֵּיכֶם
  choice: మీ పక్కల్లో
  rationale: శరీర భాగాన్ని సూచించే రూపకానికి ఆధునిక తెలుగులో సహజమైన పదబంధం.
- source_word: וְצָרֲרוּ
  choice: వేధిస్తారు
  rationale: צרר అనే క్రియలోని శత్రుత్వం చూపడం, ఇబ్బంది పెట్టడం, బాధించడం అనే విస్తృత భావాన్ని ‘వేధిస్తారు’ సహజంగా వ్యక్తం చేస్తుంది; ‘అణచివేస్తారు’ కంటే తక్కువ నిర్దిష్టంగా ఉండి మూలంలోని పరిధిని కాపాడుతుంది.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: మీరు నివసించే దేశంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, నివాసస్థలాన్ని తెలుగులో ‘దేశంలో’ అనడం సహజం. కృదంతంలోని కొనసాగుతున్న నివాస భావం కూడా నిలుస్తుంది.
