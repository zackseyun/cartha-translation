  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు హెచ్చరికకు తగిన గంభీరతను ఉంచింది. కళ్లూ పక్కలూ అనే స్పష్టమైన శరీర రూపకాలను నిలిపి, అరుదైన రెండు పదునైన వస్తువుల పదాల మధ్య సాధ్యమైనంత భేదాన్ని చూపింది.
