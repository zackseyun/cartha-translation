  text: They set out from Terah and camped at Mithkah.
translation:
  language: te
  text: వారు తెరహు నుండి బయలుదేరి మిత్కాలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణ స్థలాల జాబితాలో נסע ఒక శిబిర స్థలం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రయాణ క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִתָּרַח
  choice: తెరహు నుండి
  rationale: మִן ఉపసర్గ బయలుదేరిన మూలస్థలాన్ని సూచిస్తుంది. תָּרַח ఇక్కడ స్థలనామం కాబట్టి ‘తెరహు’గా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఈ ప్రయాణ జాబితా సందర్భంలో ఆగి శిబిరం వేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన ప్రయోగం.
- source_word: בְּמִתְקָה
  choice: మిత్కాలో
  rationale: בְּ ఉపసర్గ స్థలాన్ని సూచిస్తుంది. מִתְקָה స్థలనామం కాబట్టి ‘మిత్కా’గా లిప్యంతరీకరించి, తెలుగు స్థానవాచక విభక్తితో ‘మిత్కాలో’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన ప్రయాణ జాబితా శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని రెండు వరుస క్రియల క్రమం యథాతథంగా నిలుపబడింది.
