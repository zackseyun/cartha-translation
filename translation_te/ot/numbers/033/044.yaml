source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֛וּ בְּ/עִיֵּ֥י הָעֲבָרִ֖ים בִּ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: te
  text: వారు ఓబోతు నుండి బయలుదేరి, మోయాబు సరిహద్దులోని ఇయ్యే-అబారీములో[a] మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇయ్యే-హా-అబారీము”; హీబ్రూ స్థలనామంలోని పదాలకు “శిథిలాలు” మరియు “అబారీము/అవతలి ప్రాంతాలు” అనే భావాలతో సంబంధం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ఆరంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: מֵאֹבֹת
  choice: ఓబోతు నుండి
  rationale: מֵ మూలస్థానాన్ని సూచిస్తుంది; אֹבֹת స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ప్రయాణంలో శిబిరం వేసి నిలవడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: ఇయ్యే-అబారీములో
  rationale: ఈ పదబంధం ప్రయాణ జాబితాలో స్థలనామంగా పనిచేస్తుంది. దాని భాగాలకు ‘శిథిలాలు/కుప్పలు’ మరియు ‘అబారీము/అవతలి ప్రాంతాలు’ అనే వ్యుత్పత్తి సంబంధాలు ఉండవచ్చు; అయితే వాటిని అర్థానువాదం చేయకుండా స్థలనామంగా ధ్వన్యంతరీకరించడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: בִּגְבוּל
  choice: సరిహద్దులోని
  rationale: גְּבוּל సరిహద్దు, హద్దు, లేదా ప్రాంతాన్ని సూచించగలదు. ఇక్కడ మోయాబుతో ఉన్న స్థానసూచనలో ‘సరిహద్దులోని’ అనేది శిబిరం మోయాబు అంతర్భాగంలో ఉందని అతిగా నిర్ధారించకుండా మూలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా స్థల/జననామం ధ్వన్యంతరీకరించబడింది.
