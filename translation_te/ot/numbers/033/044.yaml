translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రయాణ జాబితాకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. స్థలనామాలు ధ్వన్యంతరీకరించబడ్డాయి; సందిగ్ధమైన వ్యుత్పత్తిని పాదసూచికలో ఉంచాం.
