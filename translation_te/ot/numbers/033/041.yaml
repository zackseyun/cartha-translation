  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: te
  text: వారు హోరు పర్వతం నుండి బయలుదేరి సల్మోనాలో శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: ప్రయాణ మజిలీల జాబితాలో נסע శిబిరాన్ని ఎత్తి తదుపరి ప్రదేశానికి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: מֵהֹר הָהָר
  choice: హోరు కొండనుండి
  rationale: הֹר הָהָר ఒక స్థలనామం; తెలుగులో స్థిరమైన బైబిలు నామరూపాన్ని నిలుపుతూ ‘హోరు కొండ’ అని సహజంగా వ్యక్తీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: బసచేశారు
  rationale: חנה ఇక్కడ శిబిరం వేసి మజిలీ చేయడాన్ని సూచిస్తుంది. ‘బసచేశారు’ ప్రయాణ జాబితా సందర్భంలో సహజమైన ఆధునిక తెలుగు; ‘శిబిరం వేశారు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: בְּצַלְמֹנָה
  choice: సల్మోనాలో
  rationale: בְ స్థానార్థకంగా ఉంది; పేరుగల మజిలీ ప్రదేశంలో బసచేయడాన్ని తెలుగులో ‘సల్మోనాలో’ సహజంగా తెలియజేస్తుంది.
