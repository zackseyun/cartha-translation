id: NUM.33.3
reference: Numbers 33:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: te
  text: వారు మొదటి నెలలో, ఆ నెల పదిహేనవ రోజున రామెసేసు నుండి బయలుదేరారు. పస్కా పండుగ మరుసటి రోజున ఇశ్రాయేలు కుమారులు[a] ఈజిప్టీయులందరి కళ్ల ఎదుట ఎత్తిన చేతితో[b] బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు.’ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఎత్తిన చేతితో’ అనేది అందరికీ కనిపించేలా బహిరంగంగా, ధైర్యంగా వ్యవహరించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: ప్రయాణ మజిలీల సందర్భంలో נסע శిబిరాన్ని ఎత్తి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది; ‘బయలుదేరారు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מֵרַעְמְסֵס
  choice: రామెసేసు నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో గుర్తించదగిన ప్రామాణిక రూపంలో ఉంచింది.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ఆ నెల పదిహేనవ రోజున
  rationale: హీబ్రూ తేదీ వ్యక్తీకరణను తెలుగులో సహజంగా అందిస్తుంది; ముందే పేర్కొన్న ‘మొదటి నెల’నే ‘ఆ నెల’ సూచిస్తుంది.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: పస్కా పండుగ మరుసటి రోజున
  rationale: מָחֳרַת అంటే మరుసటి రోజు; הַפֶּסַח ఇక్కడ పస్కా ఆచరణ లేదా పండుగను సూచిస్తుంది.
- source_word: יָצְאוּ
  choice: బయలుదేరారు
  rationale: יצא యొక్క ‘బయటకు వెళ్లారు’ అనే భావాన్ని కథన సందర్భంలో సహజంగా తెలియజేస్తూ నిర్గమన భావాన్ని నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధపు రూపాన్ని పారదర్శకంగా నిలుపుతుంది; దాని సమూహార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: בְּיָד רָמָה
  choice: ఎత్తిన చేతితో
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ, దాని బహిరంగమైన ధైర్య చర్య అనే భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: ఈజిప్టీయులందరి కళ్ల ఎదుట
  rationale: అందరికీ కనిపించేలా జరిగిన చర్యను సూచించే హీబ్రూ వ్యక్తీకరణను స్పష్టమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ బహువచన సమూహపదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సాధారణ జాతిసమూహార్థాన్ని పాదసూచికలో తెలిపింది.
- issue: בְיָד רָמָה నుడికారం
  choice: ఎత్తిన చేతితో
  alternative: ధైర్యంగా / విజయగర్వంతో / ఎదిరిస్తూ
  rationale: హీబ్రూ స్పష్టమైన రూపకాన్ని నిలిపింది; ‘ఎదిరిస్తూ’ లేదా ‘విజయగర్వంతో’ వంటి మరింత నిర్దిష్ట భావాన్ని మూలంలోకంటే ఎక్కువగా చేర్చకుండా, విస్తృత భావాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించింది. ప్రయాణ మజిలీల కథనానికి తగిన సంక్షిప్తతను నిలిపి, హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదసూచికలో స్పష్టం చేసింది.
