  yaml_path: translation/ot/numbers/033/035.yaml
  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: te
  text: వారు అబ్రోనా నుండి బయలుదేరి ఎజ్యోను-గెబెరు వద్ద శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణస్థలాల జాబితాలో נסע ఒక మకాం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఉండి, కదలిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעַבְרֹנָה
  choice: అబ్రోనా నుండి
  rationale: מֵ అనే ఉపసర్గను ‘నుండి’గా అనువదించాం. עַבְרֹנָה స్థలనామం కాబట్టి దాని ధ్వనిని అనుసరించి ‘అబ్రోనా’గా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ప్రయాణ వివరణలో חנה తాత్కాలికంగా శిబిరం వేసి ఉండడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన ప్రయోగం.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: ఎస్యం-గెబెరులో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గను తెలుగు విభక్తి ‘లో’తో తెలిపాం. עֶצְיוֹן גָּבֶר అనే సంయుక్త స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా ‘ఎస్యం-గెబెరు’గా లిప్యంతరీకరించి, దాని రెండు భాగాలను హైఫన్‌తో కలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణస్థలాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. స్థలనామాలు మూల హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
