    text: లేదా, “యెహోవా మాట ప్రకారం”; అక్షరార్థంగా, “యెహోవా నోటి ప్రకారం.”
    reason: హీబ్రూ నుడికారం యొక్క ప్రత్యామ్నాయ, అక్షరార్థ రూపాలను నమోదు చేయడానికి.
  revision_rationale: The revision attaches the calendrical date unambiguously to Aaron’s death, the event dated by the Hebrew clause, and makes the upward/directional sense of Aaron’s movement to Mount Hor explicit. It otherwise preserves the draft’s wording, register, divine-name rendering, and footnote.
