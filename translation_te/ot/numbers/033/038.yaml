  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: te
  text: యాజకుడైన అహరోను యెహోవా ఆజ్ఞ ప్రకారం హోరు పర్వతంపైకి ఎక్కి, అక్కడే మరణించాడు. ఇశ్రాయేలీయులు ఐగుప్తు దేశం నుండి బయలుదేరిన నలభయ్యవ సంవత్సరంలోని ఐదవ నెల మొదటి రోజున అతడు మరణించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కి
  rationale: עלה అనే క్రియలోని పైకి వెళ్లే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: అహరోను హోదాను సహజమైన విశేషణ రూపంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל הֹר הָהָר
  choice: హోరు కొండ
  rationale: స్థలనామమైన హోరును నిలుపుతూ, భౌగోళిక రూపాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’ అయిన హీబ్రూ నుడికారానికి ఇక్కడ ఆజ్ఞానుసరణ అనే భావం ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וַיָּמָת שָׁם
  choice: అక్కడ చనిపోయాడు
  rationale: క్రియను, స్థల సూచనను నేరుగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: నలభయ్యవ సంవత్సరంలో
  rationale: హీబ్రూ కాలనిర్ణయ సూత్రాన్ని తెలుగులో సహజమైన క్రమసంఖ్య రూపంలో అందిస్తుంది.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు ... బయలుదేరిన
  rationale: నిర్గమన సంఘటనను కాలగణనకు ఆధారబిందువుగా స్పష్టంగా చూపిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఇక్కడ వ్యక్తిగత కుమారులను కాక ప్రజాజాతిని సూచిస్తున్నందున ఈ రూపం ఖచ్చితమైనది, సహజమైనది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్నీ, బయటకు రావడాన్ని సూచించే విభక్తినీ నిలుపుతుంది.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: ఐదవ నెల
  rationale: కాలెండరు పదబంధానికి నేరమైన తెలుగు అనువాదం.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: మొదటి రోజున
  rationale: ‘నెలలో ఒకటవ రోజున’ అనే తేదీ సూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాము.
- issue: עַל פִּי יְהוָה అనే నుడికారం
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  alternative: యెహోవా మాట ప్రకారం; అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’
  rationale: మరణం దైవ ఆజ్ఞ వల్ల సంభవించిందని అదనంగా నిర్ణయించకుండా, అహరోను కొండ ఎక్కడం యెహోవా నిర్దేశానుసారం జరిగిందనే వాక్య సంబంధాన్ని సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. దీర్ఘమైన హీబ్రూ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; ‘ఇది జరిగింది’ అనేది తేదీని ముందటి సంఘటన మొత్తానికి అనుసంధానించే స్పష్టీకరణ.
