source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: te
  text: వారు అల్మోను-దిబ్లాతాయిము నుండి బయలుదేరి, నెబోకు ఎదురుగా[a] ఉన్న అబారీము పర్వతాల్లో శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నెబో ముందు’ లేదా ‘నెబోకు అభిముఖంగా.’ హీబ్రూ ఉపసర్గ స్థలసంబంధాన్ని సూచిస్తుంది గాని, దాని ఖచ్చితమైన సూక్ష్మభేదాన్ని నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: సంఖ్యాకాండము 33లోని ప్రయాణ-జాబితా సూత్రంలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: అల్మోను-దిబ్లాతయీము నుండి
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; ఒకే స్థలనామంలోని రెండు భాగాలను సూచించడానికి సంధిరేఖ ఉంచబడింది.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అనే క్రియకు ప్రయాణ సందర్భంలో ‘శిబిరం వేయడం’ అనే అర్థం ఉంది; ఈ రూపం సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּהָרֵי
  choice: పర్వతాల్లో
  rationale: הַר యొక్క బహువచన నిర్మాణ రూపం. ఇక్కడ పర్వత ప్రాంతంలో శిబిరం వేసిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעֲבָרִים
  choice: అబారీము
  rationale: ఇక్కడ ఇది స్థిరపడిన భౌగోళిక నామంగా పనిచేస్తుంది; అందువల్ల దాని వ్యుత్పత్తి భావాన్ని అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: לִפְנֵי
  choice: ఎదురుగా
  rationale: ఈ ఉపసర్గ ‘ముందు/ఎదురుగా’ అనే స్థలసంబంధాన్ని సూచిస్తుంది. ‘ఎదురుగా’ సహజమైన తెలుగు అయినప్పటికీ, ఖచ్చితమైన దిశ లేదా స్థాన సూక్ష్మభేదాన్ని నిర్ణయించదు; అందుకే ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: נְבוֹ
  choice: నెబో
  rationale: స్థలనామం కాబట్టి తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
