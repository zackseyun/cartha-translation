  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: te
  text: వారు రిస్సా నుండి బయలుదేరి, కెహేలాతాలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణస్థలాల జాబితాలో נסע ఒక స్థలం నుండి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రయాణ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵרִסָּה
  choice: రిస్సా నుండి
  rationale: מֵ ఉపసర్గ ‘నుండి’ అనే అర్థాన్ని ఇస్తుంది. רִסָּה స్థలనామం కావడంతో దానిని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ ప్రయాణంలో ఒక స్థలంలో శిబిరం వేసి నిలవడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన ప్రయాణ-వివరణ పదబంధం.
- source_word: בִּקְהֵלָתָה
  choice: కెహేలాతాలో
  rationale: בְּ ఉపసర్గ ఇక్కడ మకాం వేసిన స్థలాన్ని సూచిస్తుంది. קְהֵלָתָה స్థలనామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన ప్రయాణస్థలాల జాబితా శైలిని నిలిపాం. స్థలనామాలను మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; భాషను సహజంగా, గౌరవప్రదంగా ఉంచాం.
