  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: te
  text: వారు బెనేయాకాను నుండి బయలుదేరి హోర్‌హగ్గిద్గాద్‌లో శిబిరం వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బెనేయాకాను’ బహుశా ఒక స్థలనామం; అయితే హీబ్రూ రూపానికి అక్షరార్థం ‘యాకాను కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: అరణ్య ప్రయాణస్థలాల వరుసలో נסע ఒక మకాం నుండి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִבְּנֵי יַעֲקָן
  choice: బెనేయాకాను నుండి
  rationale: ఇక్కడ בְּנֵי יַעֲקָן అక్షరార్థంగా ‘యాకాను కుమారులు’ అనే రూపం కలిగివున్నా, ప్రయాణ జాబితాలో స్థలనామంగా పనిచేస్తుంది. అందువల్ల లిప్యంతరీకరణ చేసి, מִן‌ను ‘నుండి’గా అనువదించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ప్రయాణ వర్ణనలో శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ప్రయాణస్థలంలో ఆగి బస చేసిన భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: హోర్‌హగ్గిద్గాదులో
  rationale: ఇది స్థలనామం కాబట్టి లిప్యంతరీకరించాం. בְּ స్థానాన్ని సూచిస్తున్నందున తెలుగులో ‘-లో’ విభక్తిని వాడాం; హీబ్రూ నిర్దిష్ట ఉపపదం ధ్వనిని ‘హగ్గిద్గాద్’ అనే సమాస లిప్యంతరీకరణలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రయాణవర్ణన శైలిని వాడాం. స్థలనామాలను హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; పద్యంలో [a] సూచికను చేర్చాం.
