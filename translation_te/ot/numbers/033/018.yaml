  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: te
  text: వారు హజేరోతు నుండి బయలుదేరి రిత్మాలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: נסע అనే క్రియ ప్రయాణ పట్టికలో శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి కథనంలోని గమనాన్ని నిలుపుతుంది.
- source_word: מֵחֲצֵרֹת
  choice: హజేరోతు నుండి
  rationale: מִן ఉపసర్గ మూలస్థానాన్ని (‘నుండి’) సూచిస్తుంది. חֲצֵרֹת అనే స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ప్రయాణ పట్టికల్లో శిబిరం వేసి నిలవడాన్ని సూచించే సాధారణ క్రియ. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన ప్రయోగం.
- source_word: בְּרִתְמָה
  choice: రిత్మాలో
  rationale: בְּ ఉపసర్గ ఇక్కడ శిబిరం వేసిన ప్రదేశాన్ని సూచిస్తుంది. רִתְמָה అనే స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ పట్టికకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని వరుస క్రియలు తెలుగులో సహజంగా వినిపించేలా ‘బయలుదేరి ... మకాం వేశారు’గా అందించబడ్డాయి.
