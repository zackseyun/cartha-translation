translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] రామెసేసు[b] నుండి బయలుదేరి సుక్కోతులో శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు’; హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: ఈ స్థలనామాన్ని కొన్ని అనువాదాల్లో ‘రామ్సేసు’ అని కూడా రాస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: נסע అనే క్రియ ప్రయాణ జాబితాలో శిబిరాన్ని విడిచి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు.’ మూలంలోని రూపాన్ని నిలుపుతూ, ‘ఇశ్రాయేలీయులు’ అనే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מֵרַעְמְסֵס
  choice: రామెసేసు నుండి
  rationale: מִן ఉపసర్గ బయలుదేరిన స్థలాన్ని సూచిస్తుంది. స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ ప్రయాణ మధ్యలో శిబిరం వేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ పాఠకులకు సహజంగా ఉండి, తాత్కాలికంగా బస చేసిన భావాన్ని అందిస్తుంది.
- source_word: בְּסֻכֹּת
  choice: సుక్కోతులో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది. సుక్కోతు అనే స్థలనామాన్ని అనువదించకుండా ధ్వన్యనుకరణ చేసి, తెలుగు స్థానవిభక్తిని జోడించాం.
