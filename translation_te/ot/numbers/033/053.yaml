  edition: WLC
  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: te
  text: మీరు ఆ దేశాన్ని స్వాధీనం చేసుకొని[a] అందులో నివసించండి; ఎందుకంటే దాన్ని స్వాధీనం చేసుకోవడానికి నేను ఆ దేశాన్ని మీకు ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారసత్వంగా పొంది.” ఇక్కడ వాడిన హెబ్రీ క్రియ వాగ్దాన దేశ సందర్భాల్లో స్వాధీనం చేసుకోవడం అనే భావంతో పాటు వారసత్వంగా పొందడం అనే భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: స్వాధీనం చేసుకొని
  rationale: హిఫిల్ రూపంలోని ירשׁ తొలగించి స్వాధీనం చేసుకోవడం లేదా స్వాధీనపరచుకోవడం అనే భావాన్ని ఇవ్వగలదు. ఇక్కడ ప్రత్యక్ష కర్మ ‘దేశం’ కావడంతో, దేశాన్నే వెళ్లగొట్టినట్లు వినిపించే పదప్రయోగం కాకుండా ఫలితమైన స్వాధీనాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: సందర్భంలో ఇది వాగ్దానం చేయబడిన నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆ దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: అందులో నివసించండి
  rationale: ישׁב ఇక్కడ స్థిరంగా ఉండడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది. ‘నివసించండి’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగానూ సహజంగానూ ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక సంధాన పదం.
- source_word: לָכֶם נָתַתִּי
  choice: నేను ... మీకు ఇచ్చాను
  rationale: పూర్తయిన దైవిక అనుగ్రహమే ఆజ్ఞకు ఆధారమని హెబ్రీ పరిపూర్ణ క్రియ సూచిస్తుంది; తెలుగు భూతకాల రూపం ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: దాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: ఈ క్రియారూపం దేశాన్ని ఇచ్చిన ఉద్దేశాన్ని లేదా ఫలితాన్ని తెలుపుతుంది. ‘స్వాధీనం చేసుకోవడానికి’ తక్షణ సందర్భంలోని భూస్వాధీన భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: వాగ్దాన దేశ సందర్భంలో ירשׁ పదం యొక్క భావం
  choice: స్వాధీనం చేసుకోవడం
  alternative: వారసత్వంగా పొందడం
  rationale: ఈ వాక్యపు తక్షణ సందర్భం దేవుడు ఇచ్చిన దేశాన్ని వాస్తవంగా ఆక్రమించి నివసించడాన్ని ఉద్ఘాటిస్తుంది. అయినప్పటికీ ירשׁ వాగ్దాన దేశ సందర్భాల్లో వారసత్వ భావాన్నీ కలిగి ఉండగలదు; అందువల్ల ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. పాతకాలపు లేదా అతిగా మతపరమైన పదజాలాన్ని నివారిస్తూ, దేశాన్ని దేవుడు ఇచ్చిన వరంగా మరియు ప్రజలు స్వాధీనం చేసుకొని నివసించాల్సిన భూభాగంగా చూపించే మూలపాఠ్య ఉద్రిక్తతను నిలిపాం.
