id: NUM.33.4
reference: Numbers 33:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: te
  text: ఐగుప్తీయులు యాహ్వే వారిలో హతమార్చిన వారిని—అంటే మొదట పుట్టినవారందరినీ—పాతిపెడుతుండగా, యాహ్వే వారి దేవుళ్లకు వ్యతిరేకంగా[a] తీర్పులు అమలు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, ‘వారి దేవుళ్ల మీద.’
    reason: హీబ్రూ בְּ ఉపసర్గను ‘మీద’ అని రూపానికి దగ్గరగా అనువదించవచ్చు; ప్రధాన పాఠంలోని ‘వ్యతిరేకంగా’ దాని సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: ఆ సమయంలో ఐగుప్తీయులు ... పాతిపెడుతున్నారు
  rationale: నామవాచకంతో కూడిన సంయోజకం, కొనసాగుతున్న క్రియను తెలిపే కృదంతం కలిసి ఇశ్రాయేలీయుల ప్రయాణానికి నేపథ్యంగా ఏకకాలిక చర్యను సూచిస్తున్నాయి. ఆధునిక తెలుగులో ‘ఆ సమయంలో ... పాతిపెడుతున్నారు’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם כָּל־בְּכוֹר
  choice: యాహ్వే తమ మధ్య హతమార్చిన వారిని—అంటే మొదట పుట్టినవారందరినీ—
  rationale: హీబ్రూ వాక్యక్రమంలో ముందుగా సంబంధవాచక నిర్మాణం వచ్చి, తరువాత ‘మొదట పుట్టినవారందరూ’ అనే వివరణ వస్తుంది. డాష్‌తో కూడిన ‘అంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘తమ’ అనేది ఐగుప్తీయులను తిరిగి సూచిస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చిన
  rationale: נכה ప్రాథమికంగా ‘కొట్టు’ అనే భావం కలిగినా, ఇక్కడ మొదట పుట్టినవారి మరణాన్ని సూచిస్తుంది. ‘హతమార్చిన’ ప్రాణాంతక ఫలితాన్ని స్పష్టపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: כָּל־בְּכוֹר
  choice: మొదట పుట్టినవారందరినీ
  rationale: ‘తొలిచూలు’ వంటి అరుదైన సంప్రదాయ పదం బదులు, లింగాన్ని అనవసరంగా పరిమితం చేయని, సాధారణ ఆధునిక పాఠకులకు స్పష్టమైన పదబంధం ఎంచుకోబడింది.
- source_word: וּבֵאלֹהֵיהֶם
  choice: వారి దేవుళ్లకు వ్యతిరేకంగా
  rationale: ఇక్కడ בְּ ఉపసర్గ తీర్పు ఎవరికి వ్యతిరేకంగా జరిగిందో సూచిస్తుంది. ‘వ్యతిరేకంగా’ తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָשָׂה ... שְׁפָטִים
  choice: తీర్పులు అమలు చేశాడు
  rationale: ‘తీర్పులు చేయడం’ అనే హీబ్రూ నుడికారానికి, న్యాయతీర్పులను కార్యరూపంలో నెరవేర్చడం అనే భావాన్ని తెలిపే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణతో నిలుపబడింది.
- issue: ‘వారి దేవుళ్లు’ అనే పదబంధం దేనిని సూచిస్తుంది
  choice: ఐగుప్తీయుల దేవుళ్లు
  alternative: వారి విగ్రహాలు; వారి పాలకులు
  rationale: אֱלֹהֵיהֶם అనే పదాన్ని మూలపాఠం చెప్పినట్టే ‘వారి దేవుళ్లు’గా ఉంచి, వారిని కేవలం విగ్రహాలుగా లేదా మానవ పాలకులుగా పునర్వ్యాఖ్యానించలేదు.
- issue: దేవుళ్లపై జరిగిన చర్య స్వరూపం
  choice: యాహ్వే వారికి వ్యతిరేకంగా తీర్పులు అమలు చేశాడు
  alternative: యాహ్వే వారి దేవుళ్ల మధ్య తీర్పులు చేశాడు
  rationale: בְּ ఉపసర్గ కొంత రూపాత్మక విస్తృతిని కలిగివున్నా, עשה שפטים అనే నుడికారంతో కలిసి లక్ష్యానికి వ్యతిరేకంగా న్యాయచర్యను సూచించడం సందర్భానికి బాగా సరిపోతుంది. ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వివరణాత్మక వాక్యక్రమాన్ని డాష్ మరియు ‘అంటే’తో నిలిపి, సంప్రదాయమైన కానీ నేటి పాఠకులకు అస్పష్టమయ్యే ‘తొలిచూలు’ వంటి పదాన్ని నివారించాం.
