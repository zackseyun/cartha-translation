  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: te
  text: వారు రెఫీదీము నుండి బయలుదేరి, సీనాయి అరణ్యంలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: ప్రయాణ మజిలీల జాబితాలో נסע ఒక స్థలం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, కదలిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מֵרְפִידִם
  choice: రెఫీదీము నుండి
  rationale: ఉపసర్గ מ־ మూలస్థానం లేదా బయలుదేరిన స్థలాన్ని సూచిస్తుంది. రెఫీదీము స్థలనామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ అనేది సాధారణ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన ప్రయోగం.
- source_word: בְּמִדְבַּר סִינָי
  choice: సీనాయి అరణ్యంలో
  rationale: מִדְבָּר జనావాసాలు తక్కువగా ఉన్న అరణ్య/ఎడారి ప్రాంతాన్ని సూచించగలదు. సందర్భాన్ని అతిగా శుష్క ఎడారిగా నిర్దిష్టం చేయకుండా ‘అరణ్యం’ అని అనువదించబడింది; నిర్మాణ సంబంధం తెలుగులో ‘సీనాయి అరణ్యం’గా సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన ప్రయాణ-మజిలీ శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన మరియు గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది.
