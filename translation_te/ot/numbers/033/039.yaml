  text: అహరోను హోరు పర్వతంపై చనిపోయినప్పుడు, అతనికి నూట ఇరవై మూడు సంవత్సరాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: అహరోను
  rationale: వావ్ సంధి కథన కొనసాగింపును సూచిస్తుంది; అయితే ఈ ఒక్క వచనంలో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు. వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపమైన ‘అహరోను’గా లిప్యంతరీకరించాం.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: అతని వయసు నూట ఇరవై మూడు సంవత్సరాలు
  rationale: בן + సంఖ్య + שנה అనే హీబ్రూ వయస్సు సూచక నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సంఖ్య 123ను స్పష్టంగా పదరూపంలో ఇచ్చాం.
- source_word: בְּ/מֹת/וֹ
  choice: చనిపోయినప్పుడు
  rationale: בְּ ఉపసర్గతో కూడిన ‘అతని మరణం’ అనే రూపం ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది; తెలుగులో ‘చనిపోయినప్పుడు’ సహజమైన సమానార్థకం.
- source_word: בְּ/הֹר הָ/הָר
  choice: హోరు కొండ మీద
  rationale: స్థలనామాన్ని ‘హోరు కొండ’గా ఇచ్చి, కొండపై మరణించిన సందర్భానికి తగినట్లుగా בְּను ‘మీద’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమాచార క్రమాన్ని తెలుగు సహజ వాక్యక్రమానికి అనుగుణంగా మార్చినా భావాన్ని పూర్తిగా నిలిపాం.
