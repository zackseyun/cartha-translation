  terminology: స్థలనామాలను ధ్వన్యంతరీకరించడం సరైన విధానం. రిమ్మోను-పెరెజు అనే సంయుక్త స్థలనామంలో హైఫన్‌ను నిలిపాం. లిబ్నా పేరును యథాతథంగా ఉంచాం.
