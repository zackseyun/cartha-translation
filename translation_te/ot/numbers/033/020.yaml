translation:
  language: te
  text: వారు రిమ్మోను-పెరెజు నుండి బయలుదేరి, లిబ్నాలో శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: ప్రయాణ మజిలీల జాబితాలో נסע ఒక స్థలం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: రిమ్మోను-పెరెసు నుండి
  rationale: מִן ఉపసర్గకు ‘నుండి’ అని అనువదించి, సంయుక్త స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: బసచేశారు
  rationale: חנה ఇక్కడ ప్రయాణమధ్యంలో శిబిరం వేసి నిలిచిపోవడాన్ని సూచిస్తుంది; ‘బసచేశారు’ సాధారణ పాఠకులకు సహజంగా ఉండి మజిలీ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּלִבְנָה
  choice: లిబ్నాలో
  rationale: ప్రయాణ మజిలీని సూచించే ב ఉపసర్గను తెలుగులో సహజంగా ‘లో’తో తెలిపి, స్థలనామాన్ని ధ్వన్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన ప్రయాణ-జాబితా శైలిని నిలిపాం. స్థలనామాలను అనువదించకుండా ధ్వన్యంతరీకరించాం; వాక్యం సహజంగా, గౌరవప్రదంగా ఉంది.
