  source_fidelity: 'హీబ్రూ ప్రయాణ-జాబితా సూత్రాన్ని ముసాయిదా సరిగానే ప్రతిబింబిస్తుంది: రిమ్మోను-పెరెజు నుండి బయలుదేరడం, లిబ్నాలో శిబిరం వేయడం అనే రెండు చర్యలూ ఉన్నాయి. అయితే פָּרֶץ‌లోని చివరి צ ధ్వనికి ‘పెరెసు’ కంటే ‘పెరెజు’ దగ్గరగా ఉంటుంది; అలాగే חנהకు ‘శిబిరం వేశారు’ అనేది మరింత నిర్దిష్టమైన సమానార్థకం.'
