  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: te
  text: వారు ఎర్ర సముద్రం[a] నుండి బయలుదేరి, సీను అరణ్యంలో[b] శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెల్ల సముద్రం.’ హీబ్రూ పేరు ‘యామ్ సూఫ్’ సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదించబడింది; అయితే మరింత అక్షరార్థంగా దీనిని ‘రెల్ల సముద్రం’ అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సీను’ అనేది ఒక అరణ్య ప్రాంతపు పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: נסע అనే క్రియ సంఖ్యాకాండము 33లో ఒక మకాం నుంచి ప్రయాణం ప్రారంభించడాన్ని సూచించే పునరావృత ప్రయాణసూత్రంలో వస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִיַּם סוּף
  choice: ఎర్ర సముద్రం దగ్గరనుంచి
  rationale: יַם־סוּף సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని ప్రసిద్ధి చెందిన భౌగోళిక నామం. מִן ఉపసర్గకు ఇక్కడ ‘దగ్గరనుంచి’ అని ఇవ్వడం, వారు సముద్రజలాల లోపల నుంచి కాక దాని సమీప మకాం నుంచి బయలుదేరారనే సహజ తెలుగు భావాన్ని అందిస్తుంది; పేరుకు సాధ్యమైన అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అరణ్యప్రయాణ సందర్భంలో మకాం చేయడాన్ని సూచిస్తుంది. ‘శిబిరం వేశారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన, సజీవమైన ప్రయోగం.
- source_word: בְּמִדְבַּר סִין
  choice: సీను అరణ్యంలో
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది; పంచగ్రంథ సందర్భానికి ‘అరణ్యం’ సరిపోతుంది. סִין ఒక ప్రాంతనామం కాబట్టి దాన్ని అనువదించకుండా ‘సీను’గా లిప్యంతరీకరించాం.
