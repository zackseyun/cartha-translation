id: NUM.33.7
reference: Numbers 33:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: te
  text: వారు ఏతాము నుండి బయలుదేరి, బయలు-సెఫోనుకు ఎదురుగా ఉన్న పీ-హహీరోతు వైపుకు వెనుదిరిగి[a], మిగ్దోలు ఎదుట శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తిరిగి వెళ్లి’. హీబ్రూ క్రియ తిరిగి వెళ్లడాన్నైనా, దిశ మార్చుకొని వెనుదిరగడాన్నైనా సూచించగలదు; ఇక్కడ అది ప్రయాణ మార్గంలో మార్పును సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: వారు ఏతాము నుండి బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాల్లో נסע శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది; ఏతాము స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: וַיָּשָׁב
  choice: వెనుదిరిగి
  rationale: שׁוב అనే క్రియ తిరిగి వెళ్లడం లేదా దిశ మార్చుకొని వెనుదిరగడం అనే భావాలను ఇవ్వగలదు. ఇక్కడ ప్రయాణ మార్గంలో దిశ మార్పును ‘వెనుదిరిగి’ సహజంగా తెలియజేస్తుంది; అసలు పదంలోని ప్రత్యామ్నాయ భావం పాదసూచికలో ఉంచబడింది.
- source_word: עַל־פִּי הַחִירֹת
  choice: పీ-హహీరోతు వైపుకు
  rationale: ఇక్కడ עַל స్థలసంబంధ ప్రయోగంగా గమ్యస్థానం లేదా దిశను సూచిస్తుంది. ‘వైపుకు’ అని అనువదించడం భౌగోళిక గమనాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; పీ-హహీరోతు స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עַל־פְּנֵי בַּעַל צְפֹן
  choice: బయలు-సెఫోనుకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי ఇక్కడ ఒక ప్రదేశానికి ఎదురుగా లేదా దాని ముఖంగా ఉన్న భౌగోళిక సంబంధాన్ని సూచిస్తుంది. ‘ఎదురుగా’ స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం; బయలు-సెఫోను పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ לִפְנֵי מִגְדֹּל
  choice: మిగ్దోలు ఎదుట మకాం వేశారు
  rationale: חנה శిబిరం వేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది. לִפְנֵי యొక్క స్థలసంబంధ భావాన్ని ‘ఎదుట’ తెలియజేస్తుంది. మిగ్దోలు ఇక్కడ స్థలనామం కాబట్టి లిప్యంతరీకరించబడింది.
