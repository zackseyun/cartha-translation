translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రయాణ వర్ణన. స్థలనామాలు లిప్యంతరీకరించబడ్డాయి; ‘వెనుదిరిగి’లోని అసలు భాషా సందిగ్ధతను పాదసూచికలో నిలిపాం.
