  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: te
  text: వారు సీన్ అరణ్యం నుండి బయలుదేరి దొఫ్కాలో శిబిరం వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సీన్’ అనేది ఒక అరణ్య ప్రాంతం పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: ప్రయాణ శిబిరాన్ని ఎత్తి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచించే נסע క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מִמִּדְבַּר
  choice: అరణ్యం నుండి
  rationale: מִדְבָּר ఇక్కడ జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది; ప్రయాణ వర్ణనలో ‘అరణ్యం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: סִין
  choice: సీన్
  rationale: ఇది ప్రాంతనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: బస చేశారు
  rationale: חנה ప్రయాణ సందర్భంలో శిబిరం వేసి నిలవడాన్ని సూచిస్తుంది; ‘బస చేశారు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: בְּדָפְקָה
  choice: దొఫ్కాలో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; דָּפְקָה అనే స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి తెలుగు స్థానవిభక్తి జోడించబడింది.
