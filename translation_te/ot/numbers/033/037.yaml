  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: te
  text: వారు కాదేషు నుండి[b] బయలుదేరి, ఎదోము దేశపు అంచున ఉన్న హోరు పర్వతం[a] వద్ద శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “హోరు, ఆ కొండ”; సంప్రదాయంగా దీనిని “హోరు పర్వతం” అని అనువదిస్తారు.
    reason: lexical_alternative
