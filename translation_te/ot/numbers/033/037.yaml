    text: హీబ్రూ పాఠంలో ఇక్కడ “కాదేషు” అని మాత్రమే ఉంది; విస్తృత సందర్భం ఆధారంగా కొన్ని అనువాదాలు “కాదేషు-బర్నేయ” అని విస్తరించాయి.
    reason: alternative_reading
