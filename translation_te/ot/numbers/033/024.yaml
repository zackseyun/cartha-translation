translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ప్రధాన వాక్యంలో [a] సూచికను ఉంచి లిప్యంతరీకరణ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
