  text: וַ/יִּסְע֖וּ מֵֽ/הַר שָׁ֑פֶר וַֽ/יַּחֲנ֖וּ בַּ/חֲרָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: te
  text: వారు షెఫెరు కొండ నుండి బయలుదేరి హరాదాలో మకాం వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెఫెరు’ అనే స్థలనామాన్ని ‘షాఫెరు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: అరణ్య ప్రయాణాల జాబితాలో נסע ఒక మకాం నుండి తదుపరి మకాంకు బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: מֵהַר
  choice: కొండ నుండి
  rationale: מן + הַר అంటే ‘కొండ/పర్వతం నుండి.’ స్థలనామానికి ముందు తెలుగులో ‘కొండ’ సహజమైన, స్పష్టమైన రూపం.
- source_word: שָׁפֶר
  choice: షెఫెరు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ప్రయాణ సందర్భంలో חנה ఆగి శిబిరం ఏర్పాటు చేసుకోవడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: בַּחֲרָדָה
  choice: హరాదాలో
  rationale: ב అనే ఉపసర్గ ఇక్కడ ప్రయాణంలో ఆగిన స్థలాన్ని సూచిస్తుంది; తెలుగులో స్థలనామానికి ‘-లో’ చేర్చడం సహజం. חֲרָדָה స్థలనామంగా లిప్యంతరీకరించబడింది.
