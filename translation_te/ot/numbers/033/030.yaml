  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: te
  text: వారు హష్మోనా నుండి బయలుదేరి మోసేరోతులో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: అరణ్య ప్రయాణస్థలాల జాబితాలో נסע ఒక స్థలం నుండి తదుపరి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఉండి ప్రయాణక్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵחַשְׁמֹנָה
  choice: హష్మోనా నుండి
  rationale: מֵ ఉపసర్గకు ‘నుండి’ సరిపోతుంది. חַשְׁמֹנָה స్థలనామం కాబట్టి అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ గుడారాలు వేసుకొని ఆగడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజమైన ప్రయాణవివరణగా ఉండి, తాత్కాలికంగా శిబిరం చేసిన భావాన్ని నిలుపుతుంది.
- source_word: בְּמֹסֵרוֹת
  choice: మోసేరోతులో
  rationale: ప్రయాణంలోని నిలయాన్ని సూచించే בְ తెలుగులో స్థలవాచక ‘లో’తో సహజంగా వ్యక్తమవుతుంది. מֹסֵרוֹת స్థలనామం కాబట్టి హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన ప్రయాణ-జాబితా శైలిని నిలుపుతూ, సాధారణ ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. మూలంలో ప్రత్యేకమైన పాఠాంతర లేదా తాత్త్విక సందిగ్ధత లేదు; అందువల్ల పాదటిప్పణి అవసరం లేదు.
