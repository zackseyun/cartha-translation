  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: te
  text: వారు హరాదా నుండి బయలుదేరి మక్హేలోతులో మకాం వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు హరాదా నుండి ప్రయాణించి మక్హేలోతులో శిబిరం వేశారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణాల జాబితాలో נסע ఒక మకాం స్థలం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ప్రయాణ భావాన్ని నిలుపుతుంది.
- source_word: מֵחֲרָדָה
  choice: హరాదా నుండి
  rationale: మֵ ఉపసర్గ బయలుదేరిన మూలస్థలాన్ని సూచిస్తుంది; స్థలనామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ఈ ప్రయాణ సందర్భంలో חנה బస చేయడానికి శిబిరం వేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన వ్యక్తీకరణ.
- source_word: בְּמַקְהֵלֹת
  choice: మక్హేలోతులో
  rationale: స్థలనామంతో ఉన్న בְ ఇక్కడ మకాం వేసిన ప్రదేశాన్ని సూచిస్తుంది. మక్హేలోతు అనే పేరును లిప్యంతరీకరించి తెలుగు విభక్తి చేర్చాం.
