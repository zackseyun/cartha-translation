translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రయాణ-జాబితా శైలి. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్య నిర్మాణంలో ఉంచి, స్థలనామాలను లిప్యంతరీకరించాం.
