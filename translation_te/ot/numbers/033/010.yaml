  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: te
  text: వారు ఏలీము నుండి బయలుదేరి, ఎర్ర సముద్రం[a] దగ్గర శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రెల్లుల సముద్రం.’ యామ్ సూఫ్ అనే హెబ్రీ పేరు సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: అరణ్య ప్రయాణస్థలాల జాబితాలో נסע ఒక మజిలీ నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఉండి, ప్రయాణ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵאֵילִם
  choice: ఏలీము నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; אֵילִם స్థలనామం కాబట్టి ‘ఏలీము’గా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה ప్రయాణ వివరాల్లో మకాం చేయడాన్ని తెలిపే సాధారణ క్రియ. ‘శిబిరం వేశారు’ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన వ్యక్తీకరణ.
- source_word: עַל
  choice: దగ్గర
  rationale: నీటి ప్రదేశం సందర్భంలో עַל ఇక్కడ దాని పక్కన లేదా సమీపంలో ఉన్న స్థానాన్ని సూచిస్తుంది; ‘దగ్గర’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: יַם סוּף
  choice: ఎర్ర సముద్రం
  rationale: יַם סוּף అనే హెబ్రీ భౌగోళిక నామానికి సంప్రదాయ అనువాదం ‘ఎర్ర సముద్రం.’ סוּף ఆధారంగా సాధ్యమైన ‘రెల్లుల సముద్రం’ అనే ప్రత్యామ్నాయాన్ని పారదర్శకత కోసం పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణస్థలాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్య నిర్మాణంలో నిలిపాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
