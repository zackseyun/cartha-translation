  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: te
  text: వారు దీబోను-గాదు నుండి బయలుదేరి, అల్మోను-దిబ్లాతయిములో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: సంఖ్యాకాండము 33లోని ప్రయాణ జాబితా సూత్రంలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִדִּיבֹן גָּד
  choice: దీబోను-గాదు నుండి
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; מִן ఉపసర్గ భావాన్ని ‘నుండి’ తెలియజేస్తుంది, రెండు భాగాలను ఒక సంయుక్త స్థలనామంగా హైఫన్‌తో చూపించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ఈ ప్రయాణ సూత్రంలో חנה ఒక చోట శిబిరం వేయడం లేదా బస చేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: అల్మోను-దిబ్లాతయిములో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాం; בְ ఉపసర్గను తెలుగు విభక్తి ‘లో’తో వ్యక్తం చేశాం. చివరి దిశార్థక ה ఇక్కడ గమ్యస్థాన భావాన్ని బలపరుస్తుంది; ప్రయాణ సూత్రంలో సహజ తెలుగుగా స్థలాధికరణ రూపం వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ప్రయాణ-జాబితా శైలి. స్థలనామాలు మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; వివరణాత్మకంగా అనువదించబడలేదు.
