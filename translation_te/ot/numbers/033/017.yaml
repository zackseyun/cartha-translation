  rationale: ‘దిగారు’ స్థానంలో ‘శిబిరం వేశారు’ ఉంచి חנה యొక్క నిర్దిష్టమైన ‘శిబిరం వేయడం’ అనే అర్థాన్ని పునరుద్ధరించాం. పాదటిప్పణి గుర్తును అది వివరించే కిబ్రోత్-హత్తావా వద్దకు మార్చాం; ‘దురాశ’కు బదులుగా విస్తృతమైన, మూలపదానికి దగ్గరైన ‘కోరిక’ను వాడాం.
