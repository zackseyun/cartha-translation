base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/017.yaml
  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: te
  text: వారు కిబ్రోత్-హత్తావా[a] నుండి బయలుదేరి, హజేరోతులో శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కిబ్రోత్-హత్తావా” అనే పేరుకు బహుశా “కోరికల సమాధులు” లేదా “తీవ్ర కోరికల సమాధులు” అని అర్థం.
    reason: స్థలనామంలోని సాధ్యమైన పదార్థాన్ని తెలియజేస్తూ, ప్రధాన పాఠంలో స్థలనామాన్ని యథాతథంగా ఉంచడం.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణస్థలాల జాబితాలో נסע ఒక శిబిరస్థలం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: కిబ్రోత్-హత్తావా నుండి
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; מִן ఉపసర్గకు ‘నుండి’ వాడబడింది.
- source_word: וַיַּחֲנוּ
  choice: దిగారు
  rationale: חנה అంటే ఇక్కడ శిబిరం వేయడం లేదా ప్రయాణంలో ఒక చోట బస చేయడం. ప్రయాణ సందర్భంలో ‘దిగారు’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: בַּחֲצֵרֹת
  choice: హజేరోతులో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, అక్కడ శిబిరం వేసిన భావాన్ని తెలిపేందుకు ב ఉపసర్గను ‘లో’గా వ్యక్తం చేశాము.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ వివరాల సంక్షిప్త శైలిని నిలుపుతూ సహజంగా రూపొందించబడింది. స్థలనామాలు తెలుగు లిపిలో లిప్యంతరీకరించబడ్డాయి; [a] గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
