  register: సంక్షిప్తమైన ప్రయాణ-జాబితా శైలిని నిలుపుకుంటూ, సాధారణ ఆధునిక ప్రమాణ తెలుగులో గౌరవప్రదంగా అనువదించబడింది. స్థలనామాలు మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
