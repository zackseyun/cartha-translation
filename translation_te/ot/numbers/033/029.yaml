  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: te
  text: వారు మిత్కా నుండి బయలుదేరి హష్మోనాలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ స్థలాల జాబితాలో נסע ఒక మకాం నుండి తదుపరి మకాంకు బయలుదేరడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִמִּתְקָה
  choice: మిత్కా నుండి
  rationale: מִן ఉపసర్గకు ‘నుండి’ అని అనువదించాం; מִתְקָה స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా ‘మిత్కా’గా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ ప్రయాణంలో శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּחַשְׁמֹנָה
  choice: హష్మోనాలో
  rationale: మకాం చేసిన స్థలాన్ని తెలిపే בְּను తెలుగులో సహజమైన స్థానవాచక విభక్తితో అందించాం; חַשְׁמֹנָהను ‘హష్మోనా’గా లిప్యంతరీకరించాం.
