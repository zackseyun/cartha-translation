source:
  edition: WLC
  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: te
  text: మీ ఎదుటనుండి ఆ దేశ నివాసులందరినీ వెళ్లగొట్టాలి. వారి ఆకృతులతో కూడిన రాళ్లన్నిటినీ[a] నాశనం చేయాలి; పోతపోసిన లోహ విగ్రహాలన్నిటినీ[b] నాశనం చేయాలి; వారి ఎత్తైన ఆరాధనా స్థలాలన్నిటినీ కూల్చివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి చెక్కిన ప్రతిరూపాలన్నిటినీ.’ హీబ్రూ పదం מַשְׂכִּיּוֹת ఆకృతిగల ప్రతినిధానాలను సూచిస్తుంది; వాటి ఖచ్చితమైన రూపం లేదా పదార్థం వివాదాస్పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి కరిగించి పోతపోసిన విగ్రహాలన్నిటినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: వెళ్లగొట్టాలి
  rationale: హిఫీల్ రూపంలోని ירשׁ ఇక్కడ దేశంలో ఉన్నవారిని వారి స్థానం నుండి తొలగించడం లేదా స్వాధీనాన్ని కోల్పోయేలా చేయడం సూచిస్తుంది. ‘వెళ్లగొట్టాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి מִפְּנֵיכֶם అనే తరువాతి పదబంధంతో సరిపోతుంది.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఆ దేశ నివాసులందరినీ
  rationale: ఈ కృదంత నిర్మాణం దేశంలో నివసిస్తున్న వారిని సూచిస్తుంది. ‘నివాసులు’ సంక్షిప్తమైన, ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: హీబ్రూ నుడికారంలోని ‘మీ ముఖం ఎదుటనుండి’ అనే స్థానిక చిత్రాన్ని అతిగా శాబ్దికం చేయకుండా నిలుపుతుంది.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: నాశనం చేయాలి
  rationale: אבד పీయేల్ రూపాలు ఇక్కడ ఆరాధనా వస్తువులను నశింపజేయడాన్ని సూచిస్తాయి. హీబ్రూలోని పునరుక్తిని తెలుగులోనూ నిలిపి ఆజ్ఞ యొక్క బలాన్ని కాపాడింది.
- source_word: מַשְׂכִּיֹּתָם
  choice: వారి చెక్కిన ప్రతిరూపాలన్నిటినీ
  rationale: ఈ పదం ఆకృతులతో చేసిన లేదా అలంకరించిన ప్రతిరూపాలను సూచిస్తుంది; అవి ఏ పదార్థంతో చేసినవో స్పష్టంగా లేదు. ‘చెక్కిన ప్రతిరూపాలు’ రూపకల్పనను తెలియజేస్తూ అనిశ్చితిని కొంతవరకు నిలుపుతుంది.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: పోతపోసిన లోహ విగ్రహాలన్నిటినీ
  rationale: צֶלֶם ప్రతిమను లేదా విగ్రహాన్ని, מַסֵּכָה కరిగించిన లోహాన్ని పోతపోసి చేసిన వస్తువును సూచిస్తుంది. ఈ అనువాదం వస్తువు స్వరూపాన్నీ తయారీ విధానాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּמֹתָם
  choice: వారి ఉన్నత స్థలాలన్నిటినీ
  rationale: בָּמוֹת ఎత్తైన ప్రదేశాల్లోని ఆరాధనా స్థలాలకు ప్రామాణిక హీబ్రూ పదం. ‘ఉన్నత స్థలాలు’ మూలపద చిత్రాన్ని నిలుపుతుంది; పాదటిప్పణి దాని ఆరాధనా భావాన్ని వివరిస్తుంది.
- source_word: תַּשְׁמִידוּ
  choice: కూల్చివేయాలి
  rationale: שׁמד హిఫీల్ రూపం ఇక్కడ వ్యక్తులకు కాక ఆరాధనా స్థలాలకు వర్తిస్తుంది. నిర్మాణాలు లేదా స్థలాలను పూర్తిగా తొలగించడాన్ని ‘కూల్చివేయాలి’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కనాను నివాసుల తొలగింపును, వారి ఆరాధనా వస్తువులు మరియు స్థలాల నిర్మూలనను తెలిపే ఆజ్ఞలు
  choice: నివాసులను వెళ్లగొట్టాలని, నిర్దిష్ట ఆరాధనా వస్తువులు మరియు స్థలాలను నాశనం చేయాలని వచనం చెప్పినట్లే నేరుగా అనువదించబడింది.
  alternative: మొదటి క్రియను కేవలం ఆస్తి స్వాధీనం కోల్పోయేలా చేయడంగా బలహీనపరచడం; లేదా ఆరాధనా పదాలను సాధారణ మతాచారాలుగా మార్చడం.
  rationale: హీబ్రూ పాఠం నివాసుల తొలగింపునూ, నిర్దిష్ట ఆరాధనా వస్తువులు మరియు స్థలాల నాశనాన్నీ స్పష్టంగా ఆజ్ఞాపిస్తుంది. అనువాదం తీవ్రతను తగ్గించదు; అదే సమయంలో వచనంలో లేని నైతిక లేదా సిద్ధాంతపరమైన సమర్థనను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. హీబ్రూ పునరుక్తిని నిలిపాం. ‘ఉన్నత స్థలాలు’ అనే స్థిరమైన బైబిలు పదబంధాన్ని ఉంచి, సాధారణ పాఠకుడికి దాని ఆరాధనా సందర్భం అర్థమయ్యేలా పదనిర్ణయ వివరణ ఇచ్చాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
