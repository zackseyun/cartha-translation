  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: te
  text: వారు కెహేలాతా నుండి బయలుదేరి షాఫెర్ పర్వతం వద్ద శిబిరం వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
