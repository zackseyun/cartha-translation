  terminology: Use "షాఫెర్ పర్వతం" for בְּהַר שָׁפֶר, preserving both the mountain designation and the Hebrew place name. A lexical-alternative footnote preserves the English audit trail's conventional "Shepher" spelling without treating it as a different site.
