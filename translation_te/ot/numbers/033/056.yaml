  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: te
  text: అప్పుడు నేను వారికి చేయాలని ఉద్దేశించినదే మీకు చేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు … చేస్తాను
  rationale: ముందటి హెచ్చరికకు పర్యవసానాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో వ్యక్తం చేశాం; ప్రత్యేకంగా ‘జరుగుతుంది’ అని చేర్చితే తెలుగు వాక్యం భారంగా మారుతుంది.
- source_word: כַּאֲשֶׁר
  choice: …దే
  rationale: తరువాతి ఉద్దేశిత కార్యాన్ని ప్రధాన క్రియతో అనుసంధానించే భావాన్ని ‘చేయాలని ఉద్దేశించినదే … చేస్తాను’ అనే సహజ నిర్మాణంలో నిలిపాం.
- source_word: דִּמִּיתִי
  choice: ఉద్దేశించిన
  rationale: పీయేల్ రూపం ఈ సందర్భంలో కేవలం ఆలోచనకన్నా నిర్ణీత ఉద్దేశాన్ని సూచిస్తుంది; ‘ఉద్దేశించిన’ దాని గంభీరతను అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: చేయాలని
  rationale: עשה అనే విస్తృతార్థక క్రియను సరళమైన ‘చేయు’తో అనువదించి, శిక్షాత్మక భావాన్ని సందర్భానికే వదిలాం.
- source_word: לָהֶם
  choice: వారికి
  rationale: లామెద్ సూచించే పరోక్ష కర్మను యథాతథంగా ఉంచాం; ‘వారికి విరోధంగా’ అని స్పష్టీకరించి మూలంలో లేని అంశాన్ని చేర్చలేదు.
- source_word: אֶעֱשֶׂה
  choice: చేస్తాను
  rationale: ముందటి עשהతో పదసామ్యాన్ని, హెచ్చరికలోని స్పష్టమైన భవిష్యత్ కార్యాన్ని నిలిపాం.
- source_word: לָכֶם
  choice: మీకు
  rationale: ‘వారికి—మీకు’ అనే మూలంలోని సమాంతర విరుద్ధతను కాపాడుతుంది.
theological_decisions:
- issue: హెచ్చరికలోని తీర్పు తీవ్రత
  choice: దేవుడు వారికి చేయాలని ఉద్దేశించినదానినే ఇశ్రాయేలీయులకు చేస్తానని నేరుగా హెచ్చరిస్తున్నట్లు అనువదించడం
  alternative: దైవ ఉద్దేశాన్ని తగ్గించి, ఇది కేవలం సహజ పర్యవసానమని చెప్పడం
  rationale: ఈ వాక్యం ప్రత్యక్ష దైవ తీర్పు హెచ్చరికను ముగిస్తుంది. మూలంలోని ఉద్దేశం మరియు ప్రతిచర్య సమాంతరతను ఉంచి, శిక్ష వివరాలను అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన హెచ్చరిక శైలి. మూలంలోని ‘వారికి—మీకు’ మరియు ‘చేయాలని—చేస్తాను’ సమాంతరతలను సహజంగా నిలిపింది.
