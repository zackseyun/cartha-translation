translation:
  language: te
  text: వారు యొత్బాతా నుండి బయలుదేరి, అబ్రోనాలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణాల స్థలపట్టిక సూత్రంలో נסע ఒక మజిలీ నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి, కదలిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִיָּטְבָתָה
  choice: యొత్బాతా నుండి
  rationale: מִן ఉపసర్గను ‘నుండి’గా అనువదించాం. יָטְבָתָה అనే స్థలనామాన్ని దాని హీబ్రూ రూపానికి దగ్గరగా ‘యొత్బాతా’ అని లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ఈ ప్రయాణ స్థలపట్టిక సందర్భంలో חנה తదుపరి ప్రదేశంలో శిబిరం ఏర్పాటు చేసుకొని నిలవడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: בְּעַבְרֹנָה
  choice: అబ్రోనాలో
  rationale: בְּ ఇక్కడ స్థలార్థకమైనది; తెలుగులో దాన్ని ‘లో’ విభక్తితో సహజంగా వ్యక్తం చేశాం. עַבְרֹנָה స్థలనామాన్ని ‘అబ్రోనా’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన ప్రయాణ స్థలపట్టిక శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. స్థలనామాలు హీబ్రూ మూలరూపాల ఆధారంగా లిప్యంతరీకరించబడ్డాయి.
