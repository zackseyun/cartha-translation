  text: וַ/יִּסְע֖וּ מֵ/אָל֑וּשׁ וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ם וְ/לֹא הָ֨יָה שָׁ֥ם מַ֛יִם לָ/עָ֖ם לִ/שְׁתּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: te
  text: వారు ఆలూషు నుండి బయలుదేరి రెఫీదీములో మకాం వేశారు. అయితే అక్కడ ప్రజలు తాగడానికి నీళ్లు లేవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాలో נסע అనేది శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఉంది.
- source_word: מֵאָלוּשׁ
  choice: ఆలూషు నుండి
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ ప్రయాణ మధ్యలో శిబిరం ఏర్పాటు చేసి నిలవడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: בִּרְפִידִם
  choice: రెఫీదీములో
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం; స్థలంలో మకాం వేయడాన్ని తెలుగులో స్థానవిభక్తితో తెలిపాం.
- source_word: וְלֹא הָיָה שָׁם
  choice: అయితే అక్కడ ... లేవు
  rationale: వావ్ ఇక్కడ ముందటి వాక్యానికి విరుద్ధమైన పరిస్థితిని పరిచయం చేస్తుంది; ‘అయితే’ ఆ ప్రతికూల మలుపును అతిశయింపకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: מים కు సాధారణ, సహజ తెలుగు సమానార్థకం; బహువచన క్రియతో వాడటం ఆధునిక తెలుగు ప్రయోగానికి అనుగుణం.
- source_word: לָעָם
  choice: ప్రజలు
  rationale: עם ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ప్రజలు తాగడానికి’ అని చెప్పడం సహజం.
- source_word: לִשְׁתּוֹת
  choice: తాగడానికి
  rationale: ఈ ఉద్దేశార్థక క్రియారూపం నీరు ఏ అవసరానికి లేదో స్పష్టంగా తెలియజేస్తుంది.
