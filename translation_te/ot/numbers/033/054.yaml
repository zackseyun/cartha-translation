source:
  edition: WLC
  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: te
  text: మీ వంశాల ప్రకారం చీట్లు వేసి దేశాన్ని వారసత్వ భాగాలుగా పంచుకోవాలి. ఎక్కువమంది ఉన్న వంశానికి దాని వారసత్వ భాగాన్ని ఎక్కువగా ఇవ్వాలి; తక్కువమంది ఉన్న వంశానికి దాని వారసత్వ భాగాన్ని తక్కువగా ఇవ్వాలి. ఎవరికైతే చీటి ఏ స్థలానికి పడుతుందో, ఆ స్థలం అతనిదే అవుతుంది.[a] మీ పితరుల గోత్రాల ప్రకారం మీరు వారసత్వ భాగాలను పొందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఎవరికైతే చీటి ఏ స్థలానికి వెలువడుతుందో, అక్కడ అది అతనిదే అవుతుంది.”'
    reason: హీబ్రూ నుడికారంలో చీటి ‘వెలువడడం’ మరియు దానికి అనుసరించి ఆ స్థలం అతనికి చెందడం అనే భావాలు ఉన్నాయి; ప్రధాన పాఠం దీనిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם אֶת־הָאָרֶץ
  choice: దేశాన్ని స్వాస్థ్యంగా పంచుకోవాలి
  rationale: హిత్పయేల్ రూపం ఇక్కడ దేశాన్ని వంశాల మధ్య స్వాస్థ్యంగా కేటాయించడాన్ని సూచిస్తుంది. ‘పంచుకోవాలి’ పంపిణీ భావాన్ని, ‘స్వాస్థ్యంగా’ נחל పదకుటుంబంలోని వారసత్వ భావాన్ని నిలుపుతాయి.
- source_word: בְּגוֹרָל
  choice: చీట్లు వేసి
  rationale: גורל భూభాగ కేటాయింపులో చీటి ద్వారా నిర్ణయించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: మీ వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ ఆధునిక చిన్న కుటుంబం కంటే గోత్రంలోని విస్తృత బంధుత్వ సమూహాన్ని సూచిస్తుంది; ‘వంశాలు’ ఆ సామాజిక విభాగాన్ని తెలియజేస్తుంది.
- source_word: לָרַב ... וְלַמְעַט
  choice: ఎక్కువమంది ఉన్న వంశానికి ... తక్కువమంది ఉన్న వంశానికి
  rationale: భూవిభజన సందర్భంలో ఈ పదాలు జనసంఖ్య ఎక్కువగా లేదా తక్కువగా ఉన్న సమూహాలను పోల్చుతున్నాయి. ‘వంశానికి’ అనేది సందర్భం నుంచి స్పష్టపరచబడింది.
- source_word: תַּרְבּוּ אֶת־נַחֲלָתוֹ ... תַּמְעִיט אֶת־נַחֲלָתוֹ
  choice: స్వాస్థ్యాన్ని ఎక్కువగా ఇవ్వాలి ... స్వాస్థ్యాన్ని తక్కువగా ఇవ్వాలి
  rationale: హిఫీల్ క్రియల పరిమాణాన్ని పెంచడం, తగ్గించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, נַחֲלָה యొక్క ఒడంబడిక-భూస్వాస్థ్య భావాన్ని ‘స్వాస్థ్యం’తో నిలుపుతుంది.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל לוֹ יִהְיֶה
  choice: ఎవరికైతే చీటి ఏ స్థలానికి వస్తుందో, ఆ స్థలం అతనిదవుతుంది
  rationale: హీబ్రూ వాక్యంలో చీటి ‘బయటకు రావడం’ అనే నుడికారాన్ని తెలుగులో ‘చీటి ... వస్తుంది’గా ఉంచి, ఫలితంగా ఆ స్థలం అతనికి చెందుతుందని స్పష్టంగా తెలిపింది.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: మీ పితరుల గోత్రాల ప్రకారం
  rationale: מַטּוֹת ఇశ్రాయేలు గోత్ర విభాగాలను, אֲבֹתֵיכֶם పితృపారంపర్య సంబంధాన్ని సూచిస్తాయి; ‘పితరుల గోత్రాలు’ రెండింటినీ నిలుపుతుంది.
- source_word: תִּתְנֶחָלוּ
  choice: మీరు స్వాస్థ్యాన్ని పొందాలి
  rationale: ముగింపు క్రియ భూమిని వారసత్వ స్వాస్థ్యంగా స్వీకరించడాన్ని సూచిస్తుంది; ‘పొందాలి’ కేటాయింపు ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
