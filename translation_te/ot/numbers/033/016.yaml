  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּ֣ר סִינָ֑י וַֽ/יַּחֲנ֖וּ בְּ/קִבְרֹ֥ת הַֽתַּאֲוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/016.yaml
  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: te
  text: వారు సీనాయి అరణ్యం నుండి బయలుదేరి, కిబ్రోత్-హత్తావాలో[a] శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కిబ్రోత్-హత్తావా అంటే ‘కోరికల సమాధులు.’
    reason: స్థలనామంలోని హీబ్రూ పదార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: సంఖ్యాకాండము 33లోని ప్రయాణాల జాబితాలో נסע ఒక స్థలం నుంచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి, పునరావృత ప్రయాణ సూత్రాన్ని కాపాడుతుంది.
- source_word: מִמִּדְבַּר סִינָי
  choice: సీనాయి అరణ్యం నుండి
  rationale: מִדְבָּר జనావాసం తక్కువగా ఉన్న అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘సీనాయి అరణ్యం’ భౌగోళిక నామాన్ని, మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה ప్రయాణ వృత్తాంతాల్లో ఒక చోట బసకోసం శిబిరం ఏర్పాటు చేయడాన్ని సూచించే సాధారణ క్రియ. ‘శిబిరం వేశారు’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: కిబ్రోత్-హత్తావాలో
  rationale: ఇది స్థలనామంగా వాడబడింది కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించబడింది. దాని అర్థాన్ని పాదటిప్పణిలో అందించడం ద్వారా స్థలనామ స్వరూపం, పదార్థం రెండూ నిలుస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రయాణ వృత్తాంత శైలి ఉపయోగించబడింది. మూలంలోని సంక్షిప్త రెండు-క్రియల నిర్మాణం సహజమైన తెలుగు వాక్యంగా నిలుపబడింది.
