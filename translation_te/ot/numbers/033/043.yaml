  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: te
  text: వారు పూనోను నుండి బయలుదేరి ఓబోతులో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణపు మజిలీల సందర్భంలో נסע శిబిరాన్ని ఎత్తి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఉంది.
- source_word: מִפּוּנֹן
  choice: పూనోను నుండి
  rationale: מִן ఉపసర్గ ప్రయాణం మొదలైన స్థలాన్ని సూచిస్తుంది. పూనోను స్థలనామం కావడంతో లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ ప్రయాణ మజిలీ సందర్భంలో సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: בְּאֹבֹת
  choice: ఓబోతులో
  rationale: בְּ ఇక్కడ మకాం వేసిన ప్రదేశాన్ని సూచిస్తుంది. ఓబోతు స్థలనామం కావడంతో లిప్యంతరీకరించబడింది; తెలుగు స్థలవాచక విభక్తితో ‘ఓబోతులో’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ మజిలీల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు వరుస క్రియలను సహజ తెలుగు వాక్య నిర్మాణంలో కలిపి అందించింది.
