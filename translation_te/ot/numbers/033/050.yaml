source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: te
  text: 'యాహ్వే యెరికో ఎదురుగా యొర్దాను నది ఒడ్డున ఉన్న మోయాబు మైదానాల్లో[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోయాబు మెట్టప్రాంతాల్లో.”
    reason: 'లెక్సికల్ ప్రత్యామ్నాయం: עַרְבוֹת అనేది మైదానాలు లేదా మెట్ట/స్టెప్పు ప్రాంతాలను సూచించవచ్చు.'
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: వావ్-క్రమంతో కూడిన דבר కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో ‘మోషేతో ఇలా చెప్పాడు’ అనేది సహజంగా ఉండి, తరువాత వచ్చే לֵאמֹר పరిచయార్థాన్నీ కలిపి వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עֲרָבוֹת ఇక్కడ మోయాబుకు చెందిన విశాలమైన మైదాన/మెట్ట ప్రాంతాన్ని సూచిస్తుంది; ‘మైదానాలు’ సాధారణ ఆధునిక తెలుగులో సహజమైన భౌగోళిక పదం.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: యెరికో దగ్గర యొర్దాను నది పక్కన
  rationale: ఈ భౌగోళిక నిర్మాణంలో עַל నది ఒడ్డున లేదా సమీపంలో ఉన్న స్థానాన్ని సూచిస్తుంది; ‘యెరికో దగ్గర’ అనే సంబంధాన్ని స్పష్టంగా, సహజ తెలుగు క్రమంలో ఉంచింది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజమైన ‘ఇలా చెప్పాడు:’తో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా నిలుపుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా, స్థల సూచనలను సహజ తెలుగు క్రమంలో అమర్చి, తరువాతి ప్రత్యక్ష వాక్యానికి ద్విబిందువుతో మార్గం సిద్ధం చేసింది.
