  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ మజిలీల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. స్థలనామాలను హెబ్రీ రూపాలకు అనుగుణంగా లిప్యంతరీకరించాం; వాక్యప్రవాహం కోసం రెండు వాక్యాలుగా విభజించాం.
