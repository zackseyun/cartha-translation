  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: te
  text: వారు హహీరోత్ ఎదుటనుండి[a] బయలుదేరి, సముద్రం మధ్యగుండా అరణ్యంలోకి వెళ్లారు. వారు ఏతాము అరణ్యంలో మూడు రోజుల ప్రయాణం చేసి[b], మారాలో మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “హహీరోత్ ఎదుటనుండి.” నిర్గమకాండములో ఈ స్థలం సాధారణంగా “పీ-హహీరోత్” అని వస్తుంది; అయితే ఇక్కడ “పీ-” లేదు కాబట్టి, సమన్వయపరచకుండా సంక్షిప్త రూపాన్నే ఉంచాం.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఏతాము అరణ్యంలో మూడు రోజుల దూరం ప్రయాణించి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: ప్రయాణ మజిలీల సందర్భంలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִפְּנֵי הַחִירֹת
  choice: హహీరోత్ ఎదుటనుండి
  rationale: మూలపాఠంలో ‘హహీరోత్ ఎదుటనుండి’ అని ఉంది; నిర్గమకాండములో కనిపించే ‘పీ-హహీరోత్’ అనే రూపంతో సమన్వయపరచకుండా ఇక్కడి సంక్షిప్త స్థలనామాన్ని నిలిపాం.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: సముద్రం మధ్యగుండా వెళ్లారు
  rationale: בְתוֹךְ అంటే ‘మధ్యలో/మధ్యగుండా’; సముద్రం పక్కగా కాక దాని మధ్యగుండా సాగిన భావాన్ని ఇది నిలుపుతుంది.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యంలోకి
  rationale: చివర ఉన్న దిశార్థక ה అరణ్యం వైపు లేదా అరణ్యంలోకి సాగిన కదలికను సూచిస్తుంది; సందర్భంలో ‘అరణ్యంలోకి’ సహజమైన ఎంపిక.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజుల ప్రయాణం చేసి
  rationale: ఈ హెబ్రీ నిర్మాణం మూడు రోజుల ప్రయాణాన్ని లేదా అంత ప్రయాణదూరాన్ని సూచించగలదు; ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని వాడి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּמִדְבַּר אֵתָם
  choice: ఏతాము అరణ్యంలో
  rationale: ఇది స్థలనామంతో కూడిన construct chain; తెలుగులో ‘ఏతాము అరణ్యం’ సహజమైన నిర్మాణం.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: మారాలో మకాం వేశారు
  rationale: חנה ప్రయాణ మజిలీల సందర్భంలో శిబిరం వేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
