  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: te
  text: వారు హోర్-హగ్గిద్గాదు నుండి బయలుదేరి, యొట్బాతాలో శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు … నుండి బయలుదేరి
  rationale: ప్రయాణ మజిలీల జాబితాలో נסע ఒక మజిలీ నుండి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి, తదుపరి క్రియతో ప్రయాణ క్రమాన్ని స్పష్టంగా కలుపుతుంది.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: హోర్-హగ్గిద్గాదు నుండి
  rationale: מִן ఉపసర్గ మూలస్థానాన్ని సూచిస్తుంది; దానిని ‘నుండి’గా అనువదించాం. స్థలనామాన్ని అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; రెండు భాగాల అనుబంధాన్ని హైఫన్‌తో చూపించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ప్రయాణ వర్ణనలో శిబిరం వేసి ఆగడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, మజిలీ వద్ద బస చేసిన భావాన్ని అందిస్తుంది.
- source_word: בְּיָטְבָתָה
  choice: యొట్బాతాలో
  rationale: בְּ ఇక్కడ స్థలార్థకంగా ఉంది; తెలుగు స్థానవాచక విభక్తి ‘లో’తో దాన్ని వ్యక్తం చేశాం. స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన ప్రయాణ-జాబితా శైలిని నిలిపాం. ‘ప్రయాణించి’ వంటి కొంత అస్పష్టమైన రూపం బదులు బయలుదేరడాన్ని స్పష్టంగా తెలిపే ‘బయలుదేరి’ని, ‘శిబిరం వేశారు’ కంటే సహజమైన ‘మకాం వేశారు’ను ఉపయోగించాం. పాఠ్యంలో పాదటిప్పణులు లేవు.
