  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: te
  text: వారు సుక్కోతు నుండి బయలుదేరి ఏతాములో శిబిరం వేశారు; అది అరణ్యపు అంచున ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరణ్యపు సరిహద్దులో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు ... బయలుదేరి
  rationale: נסע అనే క్రియ ప్రయాణ పట్టికలో ఒక స్థలం నుండి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘బయలుదేరి’ అని అనువదించాం.
- source_word: מִסֻּכֹּת
  choice: సుక్కోతు నుండి
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అంటే బస కోసం శిబిరం వేయడం; ‘శిబిరం వేశారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בְאֵתָם
  choice: ఏతాములో
  rationale: ఇది ב ఉపసర్గతో వచ్చిన స్థలనామం; గమ్యస్థలంలో శిబిరం వేసిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר
  choice: ఉన్న
  rationale: ఏతాము ఉన్న ప్రదేశాన్ని వివరించే సంబంధ వాక్యాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో ఇచ్చాం.
- source_word: בִּקְצֵה
  choice: అంచున
  rationale: קצה ఇక్కడ ఒక భౌగోళిక ప్రాంతపు చివర లేదా సరిహద్దును సూచిస్తుంది; ‘అంచున’ రాజకీయ సరిహద్దు భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַמִּדְבָּר
  choice: అరణ్యపు
  rationale: מִדְבָּר సాగుచేయని జనావాసరహిత ప్రాంతాన్ని సూచించవచ్చు; తప్పనిసరిగా ఇసుక ఎడారి కాదు కాబట్టి ‘అరణ్యం’ అనువైనది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ పట్టికకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. స్థలనామాలు హీబ్రూ ఆధారంగా లిప్యంతరీకరించబడ్డాయి; בִּקְצֵה లోని ‘అంచు/సరిహద్దు’ భావభేదాన్ని పాదటీపులో నిలిపాం.
