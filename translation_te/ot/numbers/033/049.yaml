id: NUM.33.49
reference: Numbers 33:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּחֲנ֤וּ עַל הַ/יַּרְדֵּן֙ מִ/בֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּ/עַֽרְבֹ֖ת מוֹאָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: te
  text: వారు మోయాబు మైదానాల్లో[a], యొర్దాను నది పక్కన, బేత్-యెషీమోత్ నుండి ఆబేల్-షిత్తీమ్ వరకు శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోయాబు స్టెప్పీ మైదాన ప్రాంతంలో.” హీబ్రూ పదం మోయాబులోని సమతల, పొడి గడ్డి మైదాన ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה క్రియ ఇశ్రాయేలీయుల ప్రయాణంలోని తదుపరి శిబిర దశను సూచిస్తుంది. ‘మకాం వేశారు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, తాత్కాలికంగా బసచేసిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הַיַּרְדֵּן
  choice: యొర్దాను నది పక్కన
  rationale: నదితో వాడిన עַל ఇక్కడ అక్షరార్థంగా ‘మీద’ కాకుండా ‘దగ్గర/పక్కన’ అనే స్థానార్థాన్ని ఇస్తుంది. తెలుగులో స్పష్టత కోసం ‘నది’ చేర్చబడింది.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: బేత్-యెషీమోతు నుండి
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం; מִן ఉపసర్గ శిబిర విస్తృతి ప్రారంభబిందువును సూచిస్తుంది.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: ఆబేల్-షిత్తీము వరకు
  rationale: עַד భౌగోళిక విస్తృతి ముగింపు బిందువును సూచిస్తుంది; స్థలనామం లిప్యంతరీకరించబడింది.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עֲרָבוֹת అనేది సమతలమైన, కొంత పొడిగా ఉండే మైదాన/స్టెప్పీ ప్రాంతాన్ని సూచిస్తుంది. ‘మైదానాలు’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని భౌగోళిక పరిధిని నిలుపుతూ, స్థలనామాలను తెలుగు లిపిలో లిప్యంతరీకరించాం.
