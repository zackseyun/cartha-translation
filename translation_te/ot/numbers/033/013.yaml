  yaml_path: translation/ot/numbers/033/013.yaml
  text: They set out from Dophkah and camped at Alush.
translation:
  language: te
  text: వారు దోఫ్కా నుండి బయలుదేరి, ఆలూషులో శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాలో נסע ఒక మకాం నుండి తదుపరి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రయాణారంభ భావాన్ని నిలుపుతుంది.
- source_word: מִדָּפְקָה
  choice: దొఫ్కా నుండి
  rationale: మִן ఉపసర్గ బయలుదేరిన మూలస్థలాన్ని (‘నుండి’) సూచిస్తుంది. דָּפְקָה అనే స్థలనామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: ప్రయాణ మకాముల సందర్భంలో חנה బస చేయడానికి శిబిరం ఏర్పాటు చేయడాన్ని సూచిస్తుంది. ‘శిబిరం వేశారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన ప్రయోగం.
- source_word: בְּאָלוּשׁ
  choice: ఆలూషులో
  rationale: בְּ ఉపసర్గ ఇక్కడ మకాం వేసిన స్థలాన్ని సూచిస్తుంది. אָלוּשׁ అనే స్థలనామాన్ని అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా ‘ఆలూషు’గా లిప్యంతరీకరించి, స్థానార్థక విభక్తిని జోడించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన ప్రయాణ-మకాం సూత్రాన్ని సహజంగా అందించాం. స్థలనామాలను మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; వచనంలో అస్పష్టమైన లేదా సిద్ధాంతపరమైన అంశాలు లేవు.
