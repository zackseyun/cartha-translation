source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: te
  text: మోషే యాహ్వే ఆజ్ఞ ప్రకారం వారి ప్రయాణాలనుబట్టి వారి బయలుదేరే స్థలాలను నమోదు చేశాడు.[a][b] వారి బయలుదేరే స్థలాలనుబట్టి వారి ప్రయాణాలు ఇవే.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే ఆజ్ఞ ప్రకారం’ అనే మాటకు అక్షరార్థం ‘యాహ్వే నోటి ప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: ‘బయలుదేరే స్థలాలు’ అని అనువదించిన హీబ్రూ పదాన్ని ‘వారి బయలుదేరడాలు’ లేదా ‘వారి నిష్క్రమణలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'ఈ వాక్యంలో పదాలు ఉద్దేశపూర్వకంగా తిరగబడతాయి: ‘ప్రయాణాలనుబట్టి బయలుదేరే స్థలాలు’—‘బయలుదేరే స్థలాలనుబట్టి ప్రయాణాలు.’'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: నమోదు చేశాడు
  rationale: ఈ క్రియ గతంలో జరిగిన వ్రాతపూర్వక నమోదును సూచిస్తుంది; ‘నమోదు చేశాడు’ అనేది కేవలం ‘రాశాడు’ కంటే ప్రయాణవివరాలను లిఖించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מוֹצָאֵיהֶם
  choice: వారి బయలుదేరిన స్థలాలు
  rationale: מוֹצָא అనేది బయలుదేరడం లేదా బయలుదేరే స్థలాన్ని సూచించగలదు. ఈ ప్రయాణపట్టిక సందర్భంలో స్థలార్థం అనుకూలంగా ఉంది; అయినా క్రియార్థంలోని సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: לְמַסְעֵיהֶם
  choice: వారు ప్రయాణించిన క్రమంలో
  rationale: לְ అనే సంబంధసూచక రూపాన్ని, ప్రయాణదశలతో అనుసంధానాన్ని తెలిపే సహజ తెలుగు పదబంధంగా ఇచ్చాం. ఇది తరువాతి పదక్రమ మార్పునూ నిలుపుతుంది.
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘యెహోవా నోటి ప్రకారం’; ఇది ఆజ్ఞ లేదా నిర్దేశాన్ని సూచించే హీబ్రూ నుడికారం. సహజ తెలుగులో దాని భావాన్ని ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: מַסְעֵיהֶם
  choice: వారి ప్రయాణాలు
  rationale: מַסָּע ప్రయాణాన్ని లేదా ప్రయాణదశను సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టమైన ‘ప్రయాణాలు’ను ప్రధాన పాఠ్యంలో వాడాం.
- source_word: לְמוֹצָאֵיהֶם
  choice: వారి బయలుదేరిన స్థలాల క్రమంలో
  rationale: మొదటి భాగంలోని ‘ప్రయాణాలు—బయలుదేరిన స్థలాలు’ సంబంధాన్ని రెండో భాగంలో తిరగవేసిన హీబ్రూ నిర్మాణాన్ని తెలుగులో కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. హీబ్రూ వాక్యంలోని తిరగబడిన సమాంతర నిర్మాణాన్ని సాధ్యమైనంత సహజంగా నిలుపుతూ, అర్థసందిగ్ధతలను పాదసూచికల్లో పేర్కొన్నాం.
