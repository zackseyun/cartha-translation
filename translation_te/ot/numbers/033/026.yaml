  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: te
  text: వారు మక్హెలోతు నుండి బయలుదేరి తాహతులో శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణ దశల వివరణలో נסע ఒక శిబిర స్థలం నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ప్రయాణ భావాన్ని నిలుపుతుంది.
- source_word: מִמַּקְהֵלֹת
  choice: మక్హేలోతు నుండి
  rationale: מִן ఉపసర్గను ‘నుండి’గా అనువదించి, స్థలనామాన్ని అనువదించకుండా తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ తదుపరి ప్రదేశంలో శిబిరం ఏర్పాటు చేసి నిలవడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ అనేది సాధారణ ఆధునిక తెలుగులో సహజమైన ప్రయాణపట్టిక పదబంధం.
- source_word: בְּתָחַת
  choice: తాహతులో
  rationale: בְּ ఉపసర్గను శిబిర స్థలాన్ని సూచించే ‘లో’గా సహజంగా అందించాం; תָחַת‌ను ఇక్కడ సాధారణ పదార్థంతో అనువదించకుండా స్థలనామంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన ప్రయాణపట్టిక శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణాన్ని ఉపయోగించాం. హీబ్రూ క్రియల వరుసను తెలుగులో ‘బయలుదేరి ... మకాం వేశారు’ అనే సహజ నిర్మాణంతో అందించాం.
