  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: te
  text: వారు తాహతు నుండి బయలుదేరి, తెరహు వద్ద శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణాల జాబితాలో נסע అనే క్రియ శిబిరాన్ని విడిచి తదుపరి ప్రదేశానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִתָּחַת
  choice: తాహతు నుండి
  rationale: מִן ఉపసర్గకు ‘నుండి’ అని అనువదించాం; תָּחַת అనే స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా ‘తాహతు’గా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ఈ ప్రయాణ సందర్భంలో חנה శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּתָרַח
  choice: తెరహులో
  rationale: శిబిర స్థలంతో వచ్చిన בְּ ఉపసర్గను తెలుగులో స్థానార్థక ‘లో’తో వ్యక్తం చేశాం; תָּרַח అనే స్థలనామాన్ని ‘తెరహు’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ స్థలాల జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. మూలంలోని వరుస చర్యలను సహజ తెలుగు సంయుక్త క్రియ నిర్మాణంతో అందించాం.
