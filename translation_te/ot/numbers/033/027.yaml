  - severity: low
    issue: ‘మకాం వేశారు’ is less specific than the camping imagery
    rationale: While acceptable, ‘శిబిరం వేశారు’ directly conveys חנה, ‘to camp/pitch camp,’ and suits the wilderness-travel register.
