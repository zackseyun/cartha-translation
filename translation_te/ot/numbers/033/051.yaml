source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אֶל אֶ֥רֶץ כְּנָֽעַן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులతో[a] మాట్లాడు; వారితో ఇలా చెప్పు: ‘మీరు యొర్దాను దాటి కనాను దేశంలోకి ప్రవేశించబోతున్నప్పుడు,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులతో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీరు యొర్దాను దాటి కనాను దేశంలోకి ప్రవేశిస్తున్నప్పుడు” లేదా “ప్రవేశించబోతున్నారు.” హీబ్రూ కృదంతం జరుగుతున్న లేదా అతి సమీపంలో జరగబోయే దాటడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: దבר పియేల్ ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి ‘చెప్పు’తో ఉన్న రెండు క్రియలనూ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ పదబంధాన్ని పారదర్శకంగా, లింగసూచనతో సహా నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’ను పాదసూచికలో ఇచ్చాం.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: אמר క్రియను, దాని పరోక్ష కర్మను నిలుపుతూ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: మీరు … దాటి … ప్రవేశించబోతున్నారు
  rationale: כִּי ఇక్కడ చెప్పవలసిన సందేశాన్ని పరిచయం చేస్తుంది; సర్వనామం మరియు వర్తమాన కృదంతం సమీప భవిష్యత్తులో జరగబోయే దాటడాన్ని సూచిస్తాయి. సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ప్రవేశించబోతున్నారు’ అని ఇచ్చాం.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దాను దాటి
  rationale: ప్రదేశనామం ఇక్కడ నదిని సూచిస్తుంది; ‘దాటి’ అనే సకర్మక నిర్మాణంలో తెలుగు వాడుకకు నిర్దేశక పదం అవసరం లేదు.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోకి
  rationale: אֶל యొక్క గమ్యార్థాన్నీ, אֶרֶץ అనే నామవాచకాన్నీ స్పష్టంగా నిలుపుతూ ఆ దేశంలోకి ప్రవేశించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: כִּי మరియు עֹבְרִים కలయికలో కాల/వాక్య సంబంధం
  choice: సందేశ పరిచయంగా తీసుకొని, సమీప భవిష్యత్తును ‘ప్రవేశించబోతున్నారు’తో వ్యక్తం చేయడం
  alternative: ‘మీరు దాటినప్పుడు’ లేదా ‘ఎందుకంటే మీరు దాటుతున్నారు’
  rationale: మూలంలోని కృదంతం ప్రస్తుతంలో మొదలైన చర్యగానూ, సమీపంలో జరగబోయే చర్యగానూ అర్థమవవచ్చు. ఇక్కడ తరువాత వచ్చే ఆదేశాల సందర్భంలో సమీప భవిష్యత్తు సహజమైనది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి నిజమైన కాలభేదాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని ‘మాట్లాడు/చెప్పు’ అనే రెండు క్రియలు నిలుపబడ్డాయి. వాక్యం తరువాతి వచనంలో కొనసాగే ప్రత్యక్ష ఉక్తి కావడంతో ముగింపులో ముగింపు ఉద్ధరణ చిహ్నం పెట్టలేదు.
