revisions:
- from: కనాను దేశంలోని నెగెవులో నివసిస్తున్న కనానీయుడైన అరాదు రాజు, ఇశ్రాయేలు కుమారులు వస్తున్నప్పుడు ఆ సంగతి విన్నాడు.[a]
  to: కనాను దేశంలోని నెగెవు[a]లో నివసించే కనానీయుడైన అరాదు రాజు, ఇశ్రాయేలు కుమారులు వచ్చారని విన్నాడు.
  rationale: The revision removes the progressive implication of “వస్తున్నప్పుడు,” replaces the vague supplied phrase “ఆ సంగతి” with an idiomatic Telugu report construction, and moves the footnote marker to its lexical anchor. It preserves the verse’s entities, geographical relationship, and its restrained statement that the king heard of Israel’s coming.
