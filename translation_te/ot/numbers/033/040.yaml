  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. భౌగోళిక నామాలను ‘అరాదు,’ ‘నెగెవు,’ ‘కనాను’గా లిప్యంతరీకరించాం; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపాం.
