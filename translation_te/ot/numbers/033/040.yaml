  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: te
  text: కనాను దేశంలోని నెగెవు[a]లో నివసించే కనానీయుడైన అరాదు రాజు, ఇశ్రాయేలు కుమారులు వచ్చారని విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నెగెవు’ అనే పేరును ‘దక్షిణ ప్రాంతం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ఆ సంగతి విన్నాడు
  rationale: שׁמע అనే క్రియకు ప్రాథమిక అర్థం ‘విన్నాడు.’ తెలుగులో కర్మను పూర్తిగా వదిలేస్తే వాక్యం అసహజంగా ఉంటుంది; సందర్భంలో అంతర్భూతమైన సమాచారాన్ని సూచించేందుకు ‘ఆ సంగతి’ చేర్చబడింది.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: కనానీయుడైన అరాదు రాజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ‘కనానీయుడు’ రాజు యొక్క జాతి/రాజకీయ గుర్తింపును తెలియజేస్తుంది; తెలుగు సహజ వాక్యనిర్మాణంలో విశేషణ సంబంధంగా ఇచ్చాం.
- source_word: וְהוּא יֹשֵׁב
  choice: నివసిస్తున్న
  rationale: సర్వనామం మరియు వర్తమాన కృదంతం నేపథ్య వివరణను ఇస్తాయి; ‘నివసిస్తున్న’ ఆ కొనసాగుతున్న వివరణాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּנֶּגֶב
  choice: నెగెవులో
  rationale: ఇక్కడ נֶגֶב గుర్తించదగిన భౌగోళిక ప్రాంతనామంగా తీసుకోబడింది; ‘దక్షిణ ప్రాంతంలో’ అనే అర్థం కూడా సాధ్యమని పాదటిప్పణిలో సూచించాం.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోని
  rationale: మూలంలోని ‘కనాను దేశంలో’ అనే పూర్తి భౌగోళిక సూచనను నిలుపుతూ, నెగెవుతో సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּבֹא
  choice: వస్తున్నప్పుడు
  rationale: 'ב + בוא క్రియానామ రూపం ఇక్కడ కాలసంబంధమైనది: ‘వచ్చినప్పుడు/వస్తున్నప్పుడు.’ ప్రవేశించే స్థలం స్పష్టంగా చెప్పబడలేదు కాబట్టి ‘ప్రవేశించినప్పుడు’ అని విస్తరించలేదు.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని పారదర్శకంగా నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలీయులను సమూహంగా సూచిస్తుంది.
