source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: te
  text: వారు మారా నుండి బయలుదేరి ఏలీముకు వచ్చారు. ఏలీములో పన్నెండు నీటి ఊటలు, డెబ్బై ఖర్జూర చెట్లు ఉన్నాయి; వారు అక్కడ శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: ప్రయాణ వృత్తాంత సూత్రంలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִמָּרָה
  choice: మారా నుండి
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించి, מִן విభక్తిని ‘నుండి’గా వ్యక్తం చేశాం.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא ఇక్కడ గమ్యస్థానానికి రావడం/చేరడం అనే అర్థంలో ఉంది; మూలంలోని సాధారణ క్రియకు దగ్గరగా ‘వచ్చారు’ ఎంచుకున్నాం.
- source_word: אֵילִמָה / בְאֵילִם
  choice: ఏలీముకు / ఏలీములో
  rationale: మొదటి రూపంలోని గమనదిశను ‘ఏలీముకు’గా, తరువాతి בְּ స్థానార్థాన్ని ‘ఏలీములో’గా వేరు చేసి నిలిపాం.
- source_word: עֵינֹת מַיִם
  choice: నీటి ఊటలు
  rationale: עַיִן ఇక్కడ తవ్విన బావులను కాక సహజ జలధారలను సూచిస్తుంది; ‘నీటి ఊటలు’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: תְּמָרִים
  choice: ఖర్జూర చెట్లు
  rationale: תָּמָר సాధారణంగా ఖర్జూరపు పామ్ చెట్టును సూచిస్తుంది; తెలుగు పాఠకులకు ‘ఖర్జూర చెట్లు’ ‘తాటి చెట్లు’ కంటే వృక్ష రకాన్ని మరింత ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: וַיַּחֲנוּ שָׁם
  choice: వారు అక్కడే మకాం వేశారు
  rationale: חנה ప్రయాణ సందర్భంలో శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది. ‘అక్కడే’లోని ఏవకారం వాక్యాంతంలోని שָׁם־ను సహజంగా బలపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రయాణ వృత్తాంత శైలి. హీబ్రూ వాక్యక్రమంలోని వరుస సంఘటనలను నిలుపుతూ, తెలుగులో సహజ ప్రవాహం కోసం రెండో వాక్యంలో సముచ్చయాన్ని అర్ధవిరామంతో అమర్చాం. పాదటిప్పణులు అవసరం లేదు.
