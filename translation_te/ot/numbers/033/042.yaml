  text: They set out from Zalmonah and camped at Punon.
translation:
  language: te
  text: వారు సల్మోనా నుండి బయలుదేరి, పూనోనులో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు … బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రయాణ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִצַּלְמֹנָה
  choice: సల్మోనా నుండి
  rationale: מִן ఉపసర్గకు ‘నుండి’ అని అనువదించాం. צַלְמֹנָה అనే స్థలనామాన్ని దాని హీబ్రూ ఉచ్చారణకు సమీపంగా ‘సల్మోనా’ అని లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: ప్రయాణ జాబితా సందర్భంలో חנה ఒక చోట శిబిరం వేసి బస చేయడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రయోగం.
- source_word: בְּפוּנֹן
  choice: పూనోనులో
  rationale: శిబిర స్థలాన్ని సూచించే בְּ ఉపసర్గను తెలుగులో స్థానార్థకమైన ‘లో’తో వ్యక్తం చేశాం. פּוּנֹן అనే స్థలనామాన్ని ‘పూనోన్’గా లిప్యంతరీకరించి విభక్తితో ‘పూనోనులో’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని వరుస చర్యలు ‘బయలుదేరి, … మకాం వేశారు’ అనే సహజ తెలుగు నిర్మాణంతో నిలుపబడ్డాయి.
