translation:
  language: te
  text: వారు లిబ్నా నుండి బయలుదేరి రిస్సాలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరి
  rationale: అరణ్య ప్రయాణ జాబితాలో נסע ఒక మకాం నుండి తదుపరి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; కదలిక ఆరంభ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִלִּבְנָה
  choice: లిబ్నా నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది. לִבְנָה స్థలనామం కావడంతో దానిని అర్థానువాదం చేయకుండా ‘లిబ్నా’గా లిప్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ ప్రయాణంలో శిబిరం వేసి బస చేయడాన్ని సూచించే సాధారణ క్రియ. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּרִסָּה
  choice: రిస్సాలో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది. רִסָּה స్థలనామాన్ని ‘రిస్సా’గా లిప్యంతరీకరించి, తెలుగు స్థానవిభక్తితో ‘రిస్సాలో’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన ప్రయాణ-జాబితా శైలిని నిలిపాం. స్థలనామాలను అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
