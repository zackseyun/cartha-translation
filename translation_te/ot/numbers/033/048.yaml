  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: te
  text: వారు అబారీము పర్వతాల నుంచి బయలుదేరి, యెరికో వద్ద యొర్దాను నది ఒడ్డున ఉన్న మోయాబు మైదానాల్లో[a][b] మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోయాబు మెట్టభూముల్లో.’ ఇక్కడి హీబ్రూ పదం మైదానాలను లేదా మెట్టభూములను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: చివరి పదబంధాన్ని ‘యెరికోకు ఎదురుగా యొర్దాను నది పక్కన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: ప్రయాణ జాబితాల్లో נסע మకాం ఎత్తి తదుపరి స్థలానికి బయలుదేరడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: అబారీము పర్వతాల నుంచి
  rationale: הָרֵי అనే నిర్మాణ బహువచనానికి ‘పర్వతాలు’ నేరమైన అనువాదం; అబారీము స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ శిబిరం ఏర్పాటు చేసి బస చేయడాన్ని సూచిస్తుంది; ‘మకాం వేశారు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עַרְבֹת మైదాన లేదా గడ్డి తక్కువగా ఉండే విశాల మెట్టభూమిని సూచించగలదు; ప్రధాన పాఠ్యంలో సులభమైన ‘మైదానాలు’ వాడబడింది.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: యెరికో దగ్గర యొర్దాను నది పక్కన
  rationale: עַל నదితో వచ్చినప్పుడు ‘పక్కన/వద్ద’ అనే స్థానార్థం ఇస్తుంది. יְרֵחוֹతో సంబంధం సంక్షిప్తంగా ఉన్నందున ‘యెరికో దగ్గర’ అని సహజంగా ఇచ్చి, ‘యెరికోకు ఎదురుగా’ అనే సాధ్యమైన భౌగోళిక వివరణను పాదసూచికలో ఉంచాం.
