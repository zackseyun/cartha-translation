translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. స్థలనామాలు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని భౌగోళిక సందిగ్ధత పాదసూచికల్లో నిలుపబడింది.
