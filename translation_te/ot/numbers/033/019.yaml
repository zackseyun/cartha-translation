base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: te
  text: వారు రిత్మా నుండి బయలుదేరి రిమ్మోను-పెరెసులో[a] మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రిత్మా నుండి ప్రయాణించి రిమ్మోను-పెరెసులో శిబిరం వేశారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: అరణ్య ప్రయాణాల జాబితాలో נסע శిబిరాన్ని విడిచి తదుపరి స్థలానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఈ ప్రయాణ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵרִתְמָה
  choice: రిత్మా నుండి
  rationale: మִן ఉపసర్గ ప్రయాణ ఆరంభస్థానాన్ని సూచిస్తుంది; అందువల్ల ‘నుండి’ అని అనువదించబడింది. స్థలనామం అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה ఇక్కడ ప్రయాణ మధ్యలో శిబిరం వేయడాన్ని సూచించే సాధారణ వృత్తాంత క్రియ. ‘మకాం వేశారు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉంది.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: రిమ్మోను-పెరెసులో
  rationale: בְּ ఇక్కడ నిలిచిన ప్రదేశాన్ని సూచిస్తుంది; తెలుగులో స్థలనామానికి ‘లో’ విభక్తి సహజం. రెండు భాగాలుగల హెబ్రీ స్థలనామాన్ని ఒకే ప్రదేశనామంగా సూచించేందుకు హైఫన్‌తో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ స్థలాల వరుసకు తగిన సంక్షిప్తమైన వృత్తాంత శైలి. ‘బయలుదేరి’ మరియు ‘మకాం వేశారు’ అనే సహజ ప్రయోగాలు మూలంలోని పునరావృత ప్రయాణ సూత్రాన్ని కాపాడుతాయి.
