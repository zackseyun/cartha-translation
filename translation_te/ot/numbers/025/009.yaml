  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: te
  text: ఆ తెగులులో చనిపోయినవారు ఇరవై నాలుగు వేలమంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: '...వారు ... వేలమంది'
  rationale: ఇక్కడ היה రూపం మరణించినవారి మొత్తం సంఖ్యను తెలిపే సంధాన క్రియగా పనిచేస్తుంది. తెలుగులో సంఖ్యావాచక విధేయంతో వాక్యాన్ని సహజంగా నిర్మించినప్పుడు ప్రత్యేకంగా ‘ఉన్నారు/అయ్యారు’ అని చేర్చనవసరం లేదు.
- source_word: הַמֵּתִים
  choice: చనిపోయినవారు
  rationale: מות ధాతువు నుంచి వచ్చిన ఈ కృదంతం ‘మృతులు’ అని కూడా అనువదించవచ్చు; అయితే ‘చనిపోయినవారు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి వ్యక్తులనే సూచిస్తుంది.
- source_word: בַּמַּגֵּפָה
  choice: ఆ తెగులులో
  rationale: מַגֵּפָה ప్రాణాంతకమైన తెగులు లేదా మహమ్మారిని సూచిస్తుంది. ב అనే ఉపసర్గను ఇక్కడ సంఘటన పరిధిని తెలిపే ‘లో’గా ఉంచడం మూల నిర్మాణానికి దగ్గరగా ఉంటుంది; నిర్దిష్ట ప్రత్యయం הַను ‘ఆ’తో వ్యక్తం చేశాం.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: హీబ్రూ సంఖ్యా ప్రయోగాన్ని ఆధునిక తెలుగు క్రమంలో ‘ఇరవై నాలుగు వేలు’గా ఇచ్చి, లెక్కించబడుతున్నది మనుషులని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యం. ‘మహమ్మారి’ కంటే మూలంలోని విస్తృతార్థాన్ని నిలుపుకునే ‘తెగులు’ను ఎంచుకున్నాం; కారణార్థకమైన ‘తెగులువల్ల’ అని పెట్టకుండా ב ఉపసర్గలోని సంఘటనాత్మక భావాన్ని ‘తెగులులో’గా నిలిపాం.
