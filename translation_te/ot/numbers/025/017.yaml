  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: te
  text: మిద్యానీయుల పట్ల శత్రుత్వం చూపండి, వారిని దెబ్బతీయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిద్యానీయులను వేధించండి, వారిని దెబ్బతీయండి.” ఇక్కడి హీబ్రూ క్రియ శత్రువులుగా పరిగణించడం లేదా శత్రుత్వంతో వ్యవహరించడం అనే అర్థాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: వేధించి
  rationale: צרר క్రియ ఇక్కడ మిద్యానీయులపట్ల శత్రుత్వంతో వ్యవహరించమనే ఆజ్ఞను ఇస్తుంది. ‘వేధించి’ అనే పదం ఆ నిరంతర విరోధ చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దానిని ఒక నిర్దిష్ట సైనిక వ్యూహానికి పరిమితం చేయదు.
- source_word: הַמִּדְיָנִים
  choice: మిద్యానీయులను
  rationale: మిద్యాను ప్రజలను సూచించే ప్రామాణిక తెలుగు జాతినామ రూపం; కర్మవిభక్తితో అనువదించబడింది.
- source_word: וְהִכִּיתֶם
  choice: వారిని దెబ్బతీయండి
  rationale: נכה హిఫీల్ రూపం కొట్టడం, దెబ్బతీయడం లేదా ఓడించడం అనే విస్తృత హింసాత్మక భావాన్ని కలిగి ఉంటుంది. ‘దెబ్బతీయండి’ దాని బలాన్ని నిలుపుతూ, క్రియ ఒక్కటే నిర్దిష్టంగా చెప్పని ‘చంపండి’ అనే అర్థాన్ని అతిగా జోడించదు.
- source_word: אוֹתָם
  choice: వారిని
  rationale: మిద్యానీయులను తిరిగి సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; దాని వ్యాకరణ పాత్ర తెలుగు కర్మవిభక్తిలో వ్యక్తమైంది.
theological_decisions:
- issue: దేవుడు ఆజ్ఞాపించిన శత్రుత్వపూర్వక హింసను మృదువుచేయకుండా లేదా విస్తరించకుండా అనువదించడం
  choice: మిద్యానీయులను వేధించి, వారిని దెబ్బతీయండి
  alternative: మిద్యానీయులను శత్రువులుగా పరిగణించి, వారిని దెబ్బతీయండి
  rationale: హీబ్రూ పాఠం శత్రుత్వంతో వ్యవహరించమని, హింసాత్మకంగా దెబ్బతీయమని నేరుగా ఆజ్ఞాపిస్తుంది. అనువాదం ఆ తీవ్రతను నిలుపుతుంది; అయితే ఈ వచనంలో లేని ధార్మిక సమర్థనను గానీ, తప్పనిసరిగా వారందరినీ చంపాలనే విస్తరణను గానీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే ఆజ్ఞారూపం వాడబడింది. మూలంలోని రెండు సమాంతర ఆజ్ఞల తీవ్రతను నిలుపుతూ, మొదటి క్రియలోని భావ పరిధిని పాదటిప్పణిలో చూపించాం.
