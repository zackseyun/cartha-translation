source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: te
  text: షిత్తీములో ఇశ్రాయేలు ఉండగా, ప్రజలు మోయాబు కుమార్తెలతో వేశ్యాచారం చేయడం మొదలుపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోయాబు కుమార్తెలతో లైంగిక అక్రమ సంబంధాలు పెట్టుకోవడం మొదలుపెట్టారు.’ హీబ్రూలో అక్షరార్థంగా, ‘మోయాబు కుమార్తెలతో వేశ్యాచారం చేయడం మొదలుపెట్టారు.’
    reason: זנה అనే హీబ్రూ క్రియ అక్రమ లైంగిక ప్రవర్తనను సూచిస్తుంది; దానిలో ‘వేశ్యాచారం చేయు’ అనే బలమైన భావచిత్రం కూడా ఉంది.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసిస్తున్నప్పుడు
  rationale: ישׁב అనే క్రియకు కూర్చోవడం, ఉండడం, నివసించడం అనే అర్థాలు ఉన్నాయి. ఇక్కడ ఇశ్రాయేలు షిత్తీములో కొంతకాలం మకాం వేసి ఉన్న సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; శాశ్వతంగా స్థిరపడినట్లు సూచించదు.
- source_word: בַּשִּׁטִּים
  choice: షిత్తీములో
  rationale: ఇది స్థలనామం. హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించి, בְּ ఉపసర్గ సూచించే స్థానార్థాన్ని ‘లో’ ద్వారా తెలిపాం.
- source_word: וַיָּחֶל
  choice: మొదలుపెట్టారు
  rationale: ఈ సందర్భంలో హిఫీల్ రూపం ‘ప్రారంభించు’ అనే ప్రయోగార్థాన్ని ఇస్తుంది. ‘మొదలుపెట్టారు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇది ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో ‘ప్రజలు’ సహజమైన సమానార్థకం.
- source_word: לִזְנוֹת
  choice: వ్యభిచారం చేయడం
  rationale: זנה అక్రమ లైంగిక సంబంధాన్ని సూచిస్తూ వేశ్యాచారపు బలమైన భావచిత్రాన్ని కూడా కలిగి ఉంటుంది. ప్రధాన వాక్యంలో ‘వ్యభిచారం చేయడం’ స్పష్టమైన, సహజమైన తెలుగు; మరింత అక్షరార్థమైన వేశ్యాచార భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֶל
  choice: తో
  rationale: זנה క్రియతో వ్యక్తులను సూచించే אֶל ఇక్కడ వారితో అక్రమ లైంగిక సంబంధాన్ని తెలియజేస్తుంది. తెలుగులో ‘తో’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנוֹת מוֹאָב
  choice: మోయాబు కుమార్తెలతో
  rationale: హీబ్రూ వ్యక్తీకరణను దగ్గరగా అనుసరిస్తూ ‘మోయాబు కుమార్తెలు’ అని అనువదించాం. సందర్భంలో ఇది మోయాబు స్త్రీలను సూచిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ప్రజల పాప స్వభావాన్ని ఎలా వ్యక్తం చేయాలి
  choice: లైంగిక అక్రమ సంబంధాన్ని స్పష్టంగా సూచించే ‘వ్యభిచారం చేయడం’ అని అనువదించడం
  alternative: ‘వేశ్యాచారం చేయడం’ లేదా సాధారణంగా ‘లైంగిక దుర్నీతికి పాల్పడడం’
  rationale: హీబ్రూ זנה సాధారణ నైతిక తప్పిదం కంటే బలమైన లైంగిక అర్థాన్ని కలిగి ఉంది. ‘వ్యభిచారం’ ఆ తీవ్రతను స్పష్టంగా ఉంచుతుంది; అదే సమయంలో ఈ వచనం చెప్పనిదాన్ని చేర్చి పాపానికి ప్రత్యేకమైన తరువాతి దైవశాస్త్రీయ వ్యాఖ్యానాన్ని రుద్దదు. హీబ్రూలోని వేశ్యాచార భావచిత్రం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం వాడుతూ, స్థలనామం మరియు ‘మోయాబు కుమార్తెలు’ అనే హీబ్రూ వ్యక్తీకరణను గౌరవప్రదంగా, మూలానికి దగ్గరగా నిలిపాం.
