id: NUM.25.18
reference: Numbers 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: te
  text: ఎందుకంటే, వారు తమ కుయుక్తులతో[b] మీ పట్ల శత్రుత్వం చూపుతున్నారు; ఆ కుయుక్తుల ద్వారానే వారు పెయోరు విషయంలో[a], మిద్యాను నాయకుని కుమార్తెయైన తమ సహోదరి[c] కోజ్బీ విషయంలో మిమ్మల్ని మోసగించారు. పెయోరు విషయం కారణంగా వచ్చిన తెగులు రోజున ఆమె చంపబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పెయోరు’ అనేది ఈ అధ్యాయంలో ముందుగా వివరించిన బయలు-పెయోరు సంఘటనను సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా ‘తమ మాయోపాయాల ద్వారా’; ఈ పదానికి ద్రోహపూరిత కుతంత్రాలు అనే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘వారి సహోదరి’; ఇక్కడ అది వారి సొంత ప్రజకు లేదా బంధువర్గానికి చెందిన స్త్రీ అని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: మీ పట్ల శత్రుత్వం వహిస్తున్నారు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న విరోధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సైనిక శత్రుత్వానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: בְּנִכְלֵיהֶם
  choice: తమ కుయుక్తులతో
  rationale: బెత్ విభక్తి తెలిపే సాధనార్థాన్ని, అలాగే నామవాచకంలోని మోసపూరిత యుక్తుల భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: נִכְּלוּ
  choice: మిమ్మల్ని మోసగించారు
  rationale: ఇది ముందున్న נְכָלִים అనే నామవాచకానికి సమాన మూలం గల క్రియ. ఇశ్రాయేలీయులపై జరిగిన మోసపూరిత చర్యను స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַל דְּבַר פְּעוֹר
  choice: పెయోరు విషయంలో / పెయోరు విషయం కారణంగా
  rationale: మొదటి సందర్భంలో సంబంధార్థాన్ని, చివరి సందర్భంలో తెగులుకు కారణమైన భావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది; మూలంలోని ఒకే పదబంధానికి ఉన్న రెండు సందర్భ ఛాయలను నిలుపుతుంది.
- source_word: כָּזְבִּי
  choice: కోజ్బీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా అందిస్తుంది.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: మిద్యాను నాయకుని కుమార్తె
  rationale: נָשִׂיא అనే పదంలోని నాయకుడు లేదా గోత్రాధిపతి భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది; రాజకుమారుడు అనే అనవసర రాజవంశ భావాన్ని చేర్చదు.
- source_word: אֲחֹתָם
  choice: వారి సహోదరి
  rationale: మూలంలోని అక్షరార్థ బంధుత్వ భాషను నిలుపుతుంది; ఇది ఒకే ప్రజకు లేదా బంధువర్గానికి చెందిన స్త్రీ అనే విస్తృత అర్థాన్ని కూడా కలిగి ఉండవచ్చు.
- source_word: הַמֻּכָּה
  choice: చంపబడింది
  rationale: נכה క్రియ యొక్క నిష్క్రియ కృదంతం సందర్భంలో మరణాన్ని సూచిస్తుంది. తెలుగులో ‘చంపబడింది’ ఫలితాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: తెగులు వచ్చిన రోజున
  rationale: మూలంలోని కాలసూచక పదబంధాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘పెయోరు’ అనే పేరుకు సూచన
  choice: ప్రధాన పాఠ్యంలో మూలంలో ఉన్నట్లే ‘పెయోరు’ అని ఉంచి, దాని సందర్భాన్ని పాదటిప్పణిలో వివరించడం.
  alternative: ‘బయలు-పెయోరు’ అని ప్రధాన పాఠ్యంలో విస్తరించడం.
  rationale: హీబ్రూ పాఠ్యంలో ఇక్కడ ‘పెయోరు’ మాత్రమే ఉంది. ‘బయలు-పెయోరు’ అని విస్తరించడం స్పష్టతనిచ్చినా మూలంలో లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చుతుంది.
- issue: రెండుసార్లు వచ్చిన עַל דְּבַר פְּעוֹר పదబంధం
  choice: మొదట ‘పెయోరు విషయంలో,’ చివర ‘పెయోరు విషయం కారణంగా’ అని సందర్భానుసారంగా అనువదించడం.
  alternative: రెండు చోట్లా ఒకే పదబంధాన్ని ఉపయోగించడం.
  rationale: మొదటి వాడుక మోసానికి సంబంధించిన సందర్భాన్ని సూచిస్తే, చివరి వాడుక తెగులుకు కారణమైన విషయాన్ని సూచిస్తుంది. స్వల్ప భేదం హీబ్రూ పదబంధంలోని సందర్భ ఛాయలను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం. ‘సహోదరి’ అనే మూలానికి దగ్గరైన పదాన్ని ఉంచి దాని సంభావ్య సామూహిక-బంధుత్వ అర్థాన్ని పాదటిప్పణిలో వివరించాం.
