  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: te
  text: 'కాబట్టి ఇలా చెప్పు: ‘ఇదిగో, నేను అతనికి నా శాంతి ఒడంబడికను ఇస్తున్నాను.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి సంఘటనకు ఈ ప్రకటనను ఫలితంగా అనుసంధానించే హేతు-ఫల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేను
  rationale: హీబ్రూ పదంలోని వక్త తనను తాను ఉద్ఘాటిస్తూ దృష్టిని ఆకర్షించే భావాన్ని నిలుపుతుంది.
- source_word: נֹתֵן
  choice: ఇస్తున్నాను
  rationale: హీబ్రూ కృదంత రూపంలోని కొనసాగుతున్న లేదా నిశ్చయంగా చేపడుతున్న కార్య భావాన్ని తెలుగులో సహజ వర్తమాన రూపంతో వ్యక్తం చేస్తుంది.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: నా శాంతి ఒడంబడికను
  rationale: ‘నా ఒడంబడిక’ మరియు ‘శాంతి’ మధ్య ఉన్న హీబ్రూ నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా ఉంచుతూ, దైవిక ఒడంబడిక భావానికి స్పష్టమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘శాంతి’ అనే పదం ఒడంబడికతో కలిగిన సంబంధం
  choice: నా శాంతి ఒడంబడిక
  alternative: శాంతికి సంబంధించిన నా ఒడంబడిక
  rationale: మూలంలోని సంక్షిప్తతను, అలాగే శాంతి ఒడంబడిక స్వభావమా లేక దాని ఫలమా అనే స్వల్ప విస్తృతార్థాన్ని అనవసరంగా విడమరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘ఒడంబడిక’ సాధారణ పాఠకుడికి అర్థమయ్యే బైబిలు సందర్భోచిత పదం.
