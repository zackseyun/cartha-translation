  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: YHWH (יהוה); సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు. “యెహోవా” అనే రూపం కూడా వాడుకలో ఉంది.'
    reason: దైవనామానికి సంప్రదాయ అనువాదం మరియు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దేవుని సంభాషణను పరిచయం చేసే సూత్రప్రాయ కథన క్రియ. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘మోషేతో ఇలా అన్నాడు’ అనే నిర్మాణం సహజంగా ఉండి, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంగా లిప్యంతరీకరించింది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తి ఎవరిని ఉద్దేశించాడో తెలిపే హీబ్రూ నిర్మాణానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రపదాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తపరచింది; ముగింపులో ద్విబిందువు అదే కార్యాన్ని బలపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంలో ఉంచాం; ఉచ్చారణ పునర్నిర్మాణంలోని అనిశ్చితిని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ మాటల పరిచయ సూత్రాన్ని పదేపదే అనుకరించకుండా, సహజమైన తెలుగు ‘ఇలా అన్నాడు:’ రూపంలో అందించింది.
