  text: And it happened after the plague[a].
translation:
  language: te
  text: తెగులు తరువాత ఇలా జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సాంప్రదాయిక శైలిలో: ‘తెగులు తరువాత సంభవించింది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: ఇక్కడ ఈ రూపం కథనాన్ని ముందుకు నడిపించే సంధి ప్రయోగం. ‘ఇలా జరిగింది’ ఆధునిక తెలుగులో సహజంగా ఉండి, హెబ్రీ కథన సూత్రంలోని సంఘటనార్థాన్ని నిలుపుతుంది.
- source_word: אַחֲרֵי
  choice: ముగిసిన తరువాత
  rationale: ఈ అవ్యయం కాలక్రమంలో ‘తరువాత’ అనే అర్థాన్ని ఇస్తుంది. సందర్భంలో తెగులు ఆగిపోయిందని ముందే చెప్పబడినందున ‘ముగిసిన తరువాత’ సహజమైన తెలుగు; అయితే ‘ముగిసిన’ అన్నది మూలంలో స్పష్టంగా లేదు కాబట్టి ప్రత్యక్ష రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַמַּגֵּפָה
  choice: తెగులు
  rationale: מַגֵּפָה ఇక్కడ దేవుని తీర్పుగా సంభవించిన ప్రాణాంతక వ్యాధి/విపత్తును సూచిస్తుంది. ‘తెగులు’ ఈ సందర్భానికి స్పష్టమైన, సహజమైన తెలుగు పదం.
theological_decisions:
- issue: సంక్షిప్త కథన సంధిని స్వతంత్ర వాక్యంగా అనువదించడం
  choice: ఈ భాగాన్ని స్వతంత్ర సంధి వాక్యంగా ఇచ్చాం.
  alternative: తదుపరి వాక్యానికి ప్రారంభ భాగంగా కలిపి చదవడం.
  rationale: మసొరెటిక్ పాఠంలో ఇది సంక్షిప్త కథన సంధి మాత్రమే అయినప్పటికీ, ఇచ్చిన వచన విభజనను గౌరవిస్తూ పూర్తి వాక్యంగా అందించాం. దీనివల్ల ఎలాంటి సిద్ధాంతపరమైన నిర్ణయం విధించబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. అక్షరార్థపు నిర్మాణం వల్ల కలిగే అసహజతను ప్రధాన పాఠంలో తగ్గించి, దానిని పాదటిప్పణిలో భద్రపరిచాం.
