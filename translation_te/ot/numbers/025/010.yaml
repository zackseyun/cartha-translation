base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH అనే దైవనామం; సాంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. דבר ఇక్కడ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే మాటక్రియ కాబట్టి ‘అన్నాడు’ సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో తెలిపాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిసి אֶל సంభాషణ ఉద్దేశిత వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషేతో అన్నాడు’ సహజమైన నిర్మాణం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ క్రియావిశేష రూపం తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. ప్రత్యేకంగా ‘చెప్పుతూ’ అని పునరుక్తి చేయకుండా, ‘ఇలా’తో కలిపిన ద్విబిందువు దాని ప్రవచన-పరిచయ కార్యాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక దైవనామమే ఉంది. అందువల్ల ‘ప్రభువు’ అని భర్తీ చేయకుండా వ్యక్తినామాన్ని నిలిపాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ‘యాహ్వే’ అనే ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. తరువాతి వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని ‘ఇలా అన్నాడు:’గా వ్యక్తం చేశాం.
