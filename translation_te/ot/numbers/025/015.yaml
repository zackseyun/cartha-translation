source:
  edition: WLC
  text: וְ/שֵׁ֨ם הָֽ/אִשָּׁ֧ה הַ/מֻּכָּ֛ה הַ/מִּדְיָנִ֖ית כָּזְבִּ֣י בַת צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית אָ֛ב בְּ/מִדְיָ֖ן הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: te
  text: హతమైన మిద్యానీయ స్త్రీ పేరు సూరు కుమార్తె కొజ్బీ. సూరు మిద్యానులోని ఒక పితృగృహంలోని[a] వంశ సమూహాల[b] అధిపతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘తండ్రి ఇల్లు’; ఇది విస్తృత కుటుంబం లేదా పూర్విక కుటుంబ విభాగాన్ని సూచించే బంధుత్వ పదం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ప్రజలు’. హీబ్రూ పదం ‘ప్రజలు’ అని అర్థమివ్వగలదు; ఈ బంధుత్వ సందర్భంలో అది వంశ సమూహాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: పేరు
  rationale: హీబ్రూ కథన అనుసంధానాన్ని తెలుగులో సహజ వాక్యప్రవాహంతో వ్యక్తం చేస్తూ, పేరును పరిచయం చేసే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הַמֻּכָּה
  choice: వధించబడిన
  rationale: נכה ధాతువు యొక్క కర్మణి భావాన్ని నిలుపుతూ, ముందరి వచనం ప్రకారం ఆమె మరణించిన సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּדְיָנִית
  choice: మిద్యాను స్త్రీ
  rationale: స్త్రీకి చెందిన జాతి గుర్తింపును ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּזְבִּי בַת־צוּר
  choice: సూరు కుమార్తె కొజ్బీ
  rationale: హీబ్రూ పుత్రికా సంబంధాన్ని సహజ తెలుగు క్రమంలో చూపిస్తూ వ్యక్తినామాలను లిప్యంతరీకరిస్తుంది.
- source_word: רֹאשׁ
  choice: అధిపతి
  rationale: అక్షరార్థమైన ‘తల’ ఇక్కడ నాయకత్వ హోదాను సూచిస్తుంది; ‘అధిపతి’ ఆ భావాన్ని గౌరవప్రదంగా, స్పష్టంగా అందిస్తుంది.
- source_word: אֻמּוֹת
  choice: వంశ సమూహాలు
  rationale: ఈ పదం ‘ప్రజలు’ అని కూడా అర్థమివ్వగలిగినా, పితృగృహ సంబంధ సందర్భంలో బంధుత్వ ఆధారిత సమూహాలను సూచించే అవకాశం ఎక్కువ; అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: בֵּית אָב
  choice: పితృగృహం
  rationale: విస్తృత కుటుంబం లేదా పూర్విక కుటుంబ విభాగాన్ని సూచించే హీబ్రూ సామాజిక-బంధుత్వ పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּמִדְיָן הוּא
  choice: సూరు మిద్యానులోని … అధిపతి
  rationale: הוּא సూచించే పురుష ఏకవచన పూర్వపదం సూరు అని తెలుగులో స్పష్టపరుస్తూ, స్థలార్థక భావాన్ని సహజంగా అందిస్తుంది.
