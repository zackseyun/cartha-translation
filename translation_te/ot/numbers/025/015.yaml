translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. చివరి హీబ్రూ సర్వనామం సూరును సూచిస్తుందని స్పష్టత కోసం రెండవ వాక్యంలో అతని పేరు పునరుక్తం చేయబడింది; మూలంలోని బంధుత్వ పదజాలం పాదసూచికలతో సంరక్షించబడింది.
