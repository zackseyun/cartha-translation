source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: te
  text: 'మోషే ఇశ్రాయేలు న్యాయాధిపతులతో ఇలా అన్నాడు: “ప్రతి ఒక్కరూ బయలు-పెయోరుతో[a] తమను తాము కలుపుకున్న తన అధీనంలోని పురుషులను[b] చంపాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెయోరు బయలుతో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “ప్రతి వ్యక్తి తన పురుషులను” అని ఉంది; అంటే ప్రతి న్యాయాధిపతి తన అధికార పరిధిలో ఉండి బయలు-పెయోరుతో తమను తాము కలుపుకున్న పురుషులను చంపాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: న్యాయాధిపతులు
  rationale: ఈ నామవాచకం ఇశ్రాయేలులో న్యాయపరమైన, పరిపాలనాపరమైన అధికారం నిర్వహించినవారిని సూచిస్తుంది; ‘న్యాయాధిపతులు’ మూలపదానికి నేరమైన, సందర్భోచితమైన అనువాదం.
- source_word: הִרְגוּ
  choice: చంపాలి
  rationale: బహువచన ఆజ్ఞ యొక్క బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘మరణశిక్ష విధించాలి’ అనే న్యాయపరమైన భావం సందర్భంలో సాధ్యమైనప్పటికీ, హీబ్రూ క్రియ స్వయంగా ‘చంపడం’ అనే సాధారణ అర్థాన్నే ఇస్తుంది.
- source_word: אִישׁ אֲנָשָׁיו
  choice: మీలో ప్రతి ఒక్కరూ ... తమ అధీనంలోని పురుషులను
  rationale: ‘ఒక్కొక్క వ్యక్తి—అతని మనుషులు’ అనే విభజనాత్మక నిర్మాణం, ప్రతి న్యాయాధిపతి తన అధికార పరిధిలోని పురుషులపై చర్య తీసుకోవాలని సూచిస్తుంది. తెలుగు వాక్యంలో అస్పష్టత రాకుండా అధికార సంబంధాన్ని స్పష్టం చేయబడింది.
- source_word: הַנִּצְמָדִים
  choice: తమను తాము కలుపుకున్న
  rationale: צמד క్రియ యొక్క నిఫాల్ రూపం దగ్గరగా చేరడం లేదా అనుబంధించుకోవడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం వారి స్వచ్ఛంద అనుబంధాన్ని తెలియజేస్తూ రూపకాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: לְבַעַל פְּעוֹר
  choice: పెయోరు బయలుతో
  rationale: ఈ పదబంధం పెయోరుతో సంబంధమున్న దేవతను సూచిస్తుంది. ‘పెయోరు బయలు’ అనే రూపం తెలుగు పదక్రమంలో సహజంగా ఉండి, ‘బయలు-పెయోరు’ అనే సంయుక్త నామరూపాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: ఆజ్ఞాపించబడిన హత్య స్వభావం
  choice: మోషే న్యాయాధిపతులకు అపరాధులైన పురుషులను చంపమని ఇచ్చిన ఆజ్ఞను నేరుగా అనువదించడం
  alternative: ‘మరణశిక్ష విధించండి’ అని అనువదించి న్యాయపరమైన శిక్షను ముందుకు తేవడం
  rationale: ఈ వచనం ఆజ్ఞను స్పష్టంగా చెబుతుంది గాని, న్యాయవిచారణ పద్ధతినో ఆచారపరమైన వివరణనో ఇక్కడ ఇవ్వదు. కాబట్టి ఆజ్ఞ తీవ్రతను నిలుపుతూ అదనపు న్యాయ లేదా సిద్ధాంతపరమైన భావాన్ని చేర్చలేదు.
- issue: אִישׁ אֲנָשָׁיו లోని పురుష లింగ సూచన
  choice: ‘పురుషులను’ అని పురుష లింగ సూచనను నిలుపుకోవడం
  alternative: ‘తమ అధీనంలోని వారిని’ అని లింగనిరపేక్షంగా అనువదించడం
  rationale: హీబ్రూ రూపం స్పష్టంగా పురుష లింగంలో ఉంది; సందర్భంలోనూ పురుష అపరాధులనే సూచిస్తుంది. అందువల్ల మూలంలోని లింగ సూచనను నిలుపుకున్నాం.
- issue: ‘తమ అధీనంలోని’ అనే సంబంధ వివరణ
  choice: ప్రతి న్యాయాధిపతికి అప్పగించబడిన పురుషులనే సూచించేలా ప్రధాన పాఠ్యంలో తెలియజేయడం
  alternative: అక్షరార్థంగా ‘తన పురుషులను’ అని ఉంచడం
  rationale: హీబ్రూ విభజనాత్మక నిర్మాణం సంక్షిప్తంగా ఉండి సంబంధాన్ని సందర్భం ద్వారా తెలియజేస్తుంది. ‘తన పురుషులు’ తెలుగులో స్వామ్య సంబంధంగా అపార్థమయ్యే అవకాశం ఉన్నందున, సందర్భసిద్ధమైన అధికార సంబంధాన్ని సహజంగా వ్యక్తం చేశాం; పాదటిప్పణిలో అక్షర నిర్మాణాన్ని తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘న్యాయాధిపతులు,’ ‘అధీనంలోని పురుషులు’ వంటి పదాలు న్యాయ-పరిపాలనా సందర్భాన్ని సహజంగా తెలియజేస్తాయి; మూలంలో లేని ఆచారపరమైన లేదా మతశాఖాపరమైన వివరణ చేర్చబడలేదు.
