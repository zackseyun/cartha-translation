- from: అతడు ఆ ఇశ్రాయేలీయుని వెంబడిస్తూ లోపలి గదిలోకి వెళ్లి, వారిద్దరినీ—ఆ ఇశ్రాయేలీయుని, ఆ స్త్రీని—ఆమె కడుపులోనుంచి పొడిచాడు.[a][b] అప్పుడు ఇశ్రాయేలు కుమారుల మీదికి వచ్చిన తెగులు ఆగిపోయింది.[c]
