base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: te
  text: అతడు ఆ ఇశ్రాయేలీయుని వెంబడిస్తూ లోపలి గదిలోకి[a] వెళ్లి, వారిద్దరినీ—ఆ ఇశ్రాయేలీయుని, ఆ స్త్రీని—ఆమె కడుపులోకి[b] పొడిచాడు. అప్పుడు ఇశ్రాయేలు కుమారుల మీదున్న తెగులు ఆగిపోయింది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లోపలి గది” అని అనువదించిన హీబ్రూ పదం అరుదైనది; “గుడారంలోని గది,” “ఏకాంతపు గది,” లేదా “మంటపం” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆమె ఉదరంలోకి.” హీబ్రూ పదం ప్రత్యేకంగా కడుపు లేదా ఉదర కుహరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “ఇశ్రాయేలు కుమారులు” అనేది ఇశ్రాయేలు ప్రజలను సూచించే ప్రామాణిక హీబ్రూ పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: లోపలి గది
  rationale: అరుదైన ఈ హీబ్రూ నామవాచకం లోపలి విభాగాన్ని లేదా గదిని సూచిస్తుంది. నిర్మాణం గుడారమా, మంటపమా అని నిర్ధారించకుండా సహజమైన తెలుగులో స్థల భావాన్ని తెలియజేస్తుంది.
- source_word: וַיִּדְקֹר
  choice: పొడిచాడు
  rationale: דקר లోని ఆయుధంతో బలంగా చొప్పించే హింసాత్మక భావాన్ని సహజంగా, అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరినీ
  rationale: ఒకే చర్యలో ఆ ఇద్దరూ పొడవబడ్డారనే మూలపాఠ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֶל קֳבָתָהּ
  choice: ఆమె కడుపులోనుంచి
  rationale: קֳבָה కడుపు లేదా ఉదర కుహరాన్ని సూచిస్తుంది. ఎల అనే దిశాత్మక ప్రయోగం ఇక్కడ ఆయుధం ఆమె కడుపు వరకు లేదా దాని గుండా వెళ్లిన భావాన్ని ఇస్తుంది; తెలుగు ప్రయోగంలో 'కడుపులోనుంచి పొడిచాడు' ఆ శారీరక వివరాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַתֵּעָצַר
  choice: ఆగిపోయింది
  rationale: నిఫాల్ రూపంలోని తెగులు నిలిపివేయబడిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּגֵּפָה
  choice: తెగులు
  rationale: తీర్పుగా వచ్చిన విపత్తు లేదా మహమ్మారి భావంలో מַגֵּפָה కు సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మీదికి వచ్చిన
  rationale: מֵעַל లోని 'మీదనుండి' అనే స్థల సంబంధాన్ని తెలుగులో అర్థవంతంగా తెలియజేయడానికి తెగులు వారిమీదికి వచ్చిందనే సంబంధాన్ని స్పష్టం చేస్తూ, בְּנֵי יִשְׂרָאֵל రూపాన్ని నిలుపుతుంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఆ ఇశ్రాయేలీయుడు
  rationale: వ్యక్తి పురుషుడనీ, ఇశ్రాయేలీయుడనీ మూలపాఠంలో ఉన్న రెండు అంశాలను సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: ఇది మొత్తం సమాజాన్ని సూచించగల ప్రామాణిక నిబంధనాత్మక పదబంధమైనప్పటికీ, మూలంలోని 'కుమారులు' అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపి, విస్తృత సామూహిక సూచనను పాదటిప్పణిలో వివరిస్తుంది.
- issue: తీర్పు సంఘటనలోని స్పష్టమైన శరీర వివరము
  choice: ఆమె కడుపులోనుంచి పొడిచాడు
  alternative: ఆమె ఉదరంలో పొడిచాడు
  rationale: హీబ్రూ పాఠంలోని నిర్దిష్టమైన శరీర వివరాన్ని మృదూకరించకుండా, అయితే అదనపు రక్తపాత చిత్రణను చేర్చకుండా అనువదిస్తుంది.
- issue: אֶל קֳבָתָהּ క్రియతో ఎవరి గుండా పొడిచాడనే వాక్యనిర్మాణ అస్పష్టత
  choice: ఆమె కడుపులోనుంచి
  alternative: ఆమె కడుపులోకి / వారిద్దరి కడుపుల గుండా
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం స్పష్టంగా స్త్రీని సూచిస్తుంది. ఆయుధం ఇద్దరినీ గుచ్చి చివరికి ఆమె కడుపులోకి లేదా దాని గుండా వెళ్లిన భావం సాధ్యమైనందున, మూలంలోని ప్రత్యేక సూచనను నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని ఉపయోగించాం. అరుదైన స్థలపదాన్ని అతిగా నిర్దిష్టీకరించలేదు; హింసాత్మక చర్యను మూలానికి తగిన స్పష్టతతో, అలంకారరహితంగా తెలిపాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో వరుసగా ఉంచబడ్డాయి.
