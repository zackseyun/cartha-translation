source:
  edition: WLC
  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: te
  text: అది అతనికీ, అతని తరువాత అతని సంతానానికీ శాశ్వత యాజకత్వపు నిబంధనగా ఉంటుంది; ఎందుకంటే అతడు తన దేవుని కొరకు అత్యుత్సాహం చూపి[a], ఇశ్రాయేలు కుమారుల[b] కోసం ప్రాయశ్చిత్తం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన దేవుని కొరకు అసూయతో మండిపడి.” హీబ్రూ క్రియ దేవుని పట్ల ఒడంబడిక సంబంధమైన అసూయను లేదా తీవ్ర ఉత్సాహాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు కుమారులు” అనేది హీబ్రూలోని సంప్రదాయ జాతీయ నామం; ఇది ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: అది ... నిబంధనగా ఉంటుంది
  rationale: స్త్రీలింగ ఏకవచన క్రియను తరువాత వచ్చే ‘నిబంధన’తో అనుసంధానిస్తూ, తెలుగు వాక్యనిర్మాణానికి సహజంగా భావాన్ని ముందుకు తీసుకెళ్తుంది.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: అతనికీ, అతని తరువాత అతని సంతానానికీ
  rationale: זֶרַע యొక్క సమష్టి ఏకవచన భావాన్ని ‘సంతానం’ నిలుపుతుంది; ‘అతని తరువాత’ వారసత్వ పరంపరను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: దేవుడు అనుగ్రహించే ఒడంబడిక సందర్భంలో స్థిరపడిన, గౌరవప్రదమైన తెలుగు బైబిలు పదం.
- source_word: כְּהֻנַּת עוֹלָם
  choice: శాశ్వతమైన యాజకత్వం
  rationale: עוֹלָם ఇక్కడ యాజక వ్యవస్థ యొక్క నిరంతర కొనసాగింపును సూచిస్తుంది; ‘శాశ్వతమైన’ సహజమైన తెలుగు కాగా, తప్పనిసరిగా తాత్త్విక అనంతత్వాన్ని నిర్ధారించదు.
- source_word: תַּחַת אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ఈ నిబంధన ప్రసాదించబడటానికి కారణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: తన దేవుని కోసం రోషపడి
  rationale: קנא లోని ఒడంబడిక నిబద్ధతతో కూడిన అసూయ/తీవ్ర ఉత్సాహ భావాన్ని ‘రోషపడి’ సందర్భానుకూలంగా తెలియజేస్తుంది; ‘ఆసక్తి చూపి’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וַיְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేశాడు
  rationale: యాజక సంబంధమైన כפר భావానికి అందుబాటులో ఉన్న, స్థిరపడిన తెలుగు పదబంధం.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల కోసం
  rationale: మూలంలోని בְּנֵי అనే పుంలింగ రూపాన్ని నిలుపుతూ, ఇది ఇశ్రాయేలు ప్రజలకు సంబంధించిన సంప్రదాయ జాతీయ నామమని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: కనא క్రియలోని అసూయ/ఉత్సాహ భావం
  choice: తన దేవుని కోసం రోషపడి
  alternative: తన దేవుని కోసం ఆసక్తి చూపి; తన దేవుని పక్షంగా తీవ్ర ఉత్సాహం చూపి
  rationale: మూలపదంలో దేవుని ప్రత్యేక హక్కు, గౌరవం కోసం కలిగే ఒడంబడిక సంబంధమైన రోషం మరియు ఉత్సాహం రెండూ ఉన్నాయి. ప్రధాన పాఠం ఆ తీవ్రతను ఉంచగా, పాదసూచిక నిజమైన పదార్థ విస్తృతిని కాపాడుతుంది.
- issue: עוֹלָם సూచించే యాజకత్వ కాలవ్యాప్తి
  choice: శాశ్వతమైన యాజకత్వం
  alternative: నిరంతర యాజకత్వం; నిత్య యాజకత్వం
  rationale: ఈ పదం సంస్థాగతంగా తరతరాలపాటు కొనసాగే స్థిరత్వాన్ని సూచించగలదు. ‘శాశ్వతమైన’ ఆ బలాన్ని నిలుపుతుంది; సందర్భం అనుమతించేదానికంటే ఎక్కువ తాత్త్విక నిర్ధారణను పాఠ్యంలో చేర్చదు.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క లింగరూపం మరియు జాతీయ ప్రయోగం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు; ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, ఆ పదబంధం మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సంప్రదాయ జాతీయ నామమని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘నిబంధన,’ ‘యాజకత్వం,’ ‘ప్రాయశ్చిత్తం’ వంటి స్థిరపడిన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
