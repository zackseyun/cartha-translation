source:
  edition: WLC
  text: וַ/תִּקְרֶ֣אןָ לָ/עָ֔ם לְ/זִבְחֵ֖י אֱלֹהֵי/הֶ֑ן וַ/יֹּ֣אכַל הָ/עָ֔ם וַ/יִּֽשְׁתַּחֲוּ֖וּ לֵֽ/אלֹהֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: te
  text: వారు ప్రజలను తమ దేవతల బలులకు ఆహ్వానించారు. ప్రజలు తిని, వారి దేవతలకు సాగిలపడ్డారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దేవతలను ఆరాధించారు.” హీబ్రూ క్రియ శరీరాన్ని వంచి సాగిలపడడాన్ని సూచిస్తుంది; ఈ చర్య తరచుగా ఆరాధనగా చేయబడేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: వారు … ఆహ్వానించారు
  rationale: קרא అనే క్రియ לְతో వ్యక్తులను ఏదో కార్యక్రమానికి పిలవడం లేదా ఆహ్వానించడం అనే భావాన్ని ఇస్తుంది. స్త్రీలింగ బహువచన కర్త మునుపటి వచనంలోని మోయాబు స్త్రీలను సూచిస్తుంది; తెలుగులో సహజమైన ‘వారు’ను వాడాం.
- source_word: לָעָם
  choice: ప్రజలను
  rationale: నిర్దిష్ట రూపంలోని עָםకు నేరుగా ‘ప్రజలు’ అని అనువదించాం. సందర్భంలో వారు ఇశ్రాయేలీయులే అయినా, మూలపాఠం ఇక్కడ ‘ఇశ్రాయేలు’ అని మళ్లీ పేర్కొనదు.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: తమ దేవతల బలులకు
  rationale: זִבְחֵי అనేది ‘బలులు’ అనే పదం యొక్క బహువచన సంబంధరూపం. ‘తమ’ అనే ఆత్మార్థక సర్వనామం ఆ దేవతలు ఆహ్వానించిన స్త్రీలకు చెందినవారని సహజంగా తెలియజేస్తుంది; బలి ఆచారాలు లేదా బలి భోజనాల భావాన్ని ‘బలులు’ నిలుపుతుంది.
- source_word: וַיֹּאכַל
  choice: తిని
  rationale: సమూహవాచక ఏకవచన కర్తతో ఉన్న సాధారణ కథన క్రియ ఇది. తెలుగులో ‘ప్రజలు తిని’ అని బహువచన భావానికి అనుగుణంగా సహజంగా అనువదించాం.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: సాగిలపడ్డారు
  rationale: ఈ క్రియ శరీరాన్ని వంచి సాష్టాంగపడే చర్యను సూచిస్తుంది; ఆరాధన సందర్భాల్లో తరచుగా వాడబడుతుంది. ‘సాగిలపడ్డారు’ భౌతిక చర్యను నిలుపుతూ, దాని విగ్రహారాధనార్థాన్ని సందర్భం ద్వారా గ్రహించనిస్తుంది.
- source_word: לֵאלֹהֵיהֶן
  choice: వారి దేవతలకు
  rationale: השתחוה తర్వాతి לְ నమస్కారం ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది. ‘వారి దేవతలకు’ మూలంలోని స్త్రీలింగ బహువచన స్వామ్యప్రత్యయాన్ని తెలుగులో సందర్భానుగుణంగా నిలుపుతుంది.
theological_decisions:
- issue: וַיִּשְׁתַּחֲווּ వర్ణించే విగ్రహారాధనా చర్యను ఎలా అనువదించాలి
  choice: వారి దేవతలకు సాగిలపడ్డారు
  alternative: వారి దేవతలను ఆరాధించారు
  rationale: మూలంలోని నిర్దిష్ట శారీరక చర్యను నేరుగా నిలిపాం; ‘ఆరాధించారు’ అనే అర్థవ్యాఖ్యను ప్రధాన పాఠ్యంలో పెట్టలేదు. బలి భోజనంలో పాల్గొనడం, దేవతలకు సాగిలపడడం అనే సందర్భమే ఆ చర్య యొక్క ఆరాధనా స్వభావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘బలులు,’ ‘సాగిలపడ్డారు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని ఆచారపరమైన మరియు శారీరక భావాలను నిలుపుతాయి.
