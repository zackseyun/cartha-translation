id: NUM.25.4
reference: Numbers 25:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు[a]: “ప్రజల నాయకులందరినీ పట్టుకొని, పట్టపగలు[b] యాహ్వే కోసం వారిని కొయ్యలకు గుచ్చి చంపు. అప్పుడు యాహ్వే మండుతున్న కోపం ఇశ్రాయేలు మీదనుంచి తొలగిపోతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల నాయకులందరినీ పిలిచి, దోషులను యాహ్వే కోసం పట్టపగలు చంపించు.” హీబ్రూలోని ‘వారిని’ అనే సర్వనామం అత్యంత నేరుగా నాయకులనే సూచిస్తుంది. అయితే కొందరు, నాయకులు శిక్షను అమలు చేయాలని వారికి ఆజ్ఞ ఇచ్చినట్లు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “సూర్యుని ఎదుట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో గుర్తించదగిన ధ్వన్యంతరీకరణగా ఉంచింది.
- source_word: קַח
  choice: పట్టుకొని
  rationale: ఇక్కడి ఆజ్ఞ నాయకులను అదుపులోకి తీసుకొని తదుపరి శిక్షకు గురిచేయడాన్ని సూచిస్తుంది; ‘పట్టుకొని’ సందర్భానికి సహజంగా ఉంది.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: ప్రజల నాయకులందరినీ
  rationale: రָאשֵׁי అక్షరార్థంగా ‘తలలు’ అయినా, ఇక్కడ ప్రజల అధిపతులు లేదా నాయకులను సూచిస్తుంది. ‘నాయకులు’ ఆధునిక తెలుగులో అపార్థం లేకుండా భావాన్ని అందిస్తుంది.
- source_word: וְהוֹקַע אֹתָם
  choice: వారిని కొయ్యలకు గుచ్చి చంపు
  rationale: יקע హిఫీల్ రూపం తీవ్రమైన, బహిరంగ మరణశిక్షను మరియు శరీరాన్ని ప్రదర్శనకు ఉంచడాన్ని సూచించగలదు. ‘కొయ్యలకు గుచ్చి చంపు’ ఆ హింసాత్మక, బహిరంగ శిక్ష భావాన్ని సాధారణ ‘చంపు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వే కోసం
  rationale: ל ఉపసర్గ ఇక్కడ కార్యం యాహ్వేకు సంబంధించినదిగా లేదా ఆయన నిమిత్తం జరిగేదిగా సూచిస్తుంది. మూలంలో ‘యాహ్వే ఎదుట’ అనే ప్రత్యేక పదబంధం లేనందున ‘కోసం’ ఎంచుకుంది.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: పట్టపగలు
  rationale: అక్షరార్థంగా ‘సూర్యుని ఎదుట’; బహిరంగంగా పగటి వెలుగులో చేయడమనే నుడికార భావాన్ని ‘పట్టపగలు’ సహజంగా అందిస్తుంది.
- source_word: וְיָשֹׁב חֲרוֹן אַף יְהוָה מִיִּשְׂרָאֵל
  choice: అప్పుడు యాహ్వే మండుతున్న కోపం ఇశ్రాయేలు మీదనుంచి తొలగిపోతుంది
  rationale: ఆజ్ఞను పాటించడం వల్ల కలిగే ఉద్దేశిత ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; חֲרוֹן אַף లోని వేడి/మండుట అనే రూపకాన్ని ‘మండుతున్న కోపం’ నిలుపుతుంది.
theological_decisions:
- issue: ‘వారిని’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: వాక్య నిర్మాణం ప్రకారం అది సమీప బహువచన పూర్వపదమైన ‘ప్రజల నాయకులను’ సూచిస్తుంది.
  alternative: నాయకులే శిక్షకు గురికాక, బయల్పెయోరుతో జతకట్టిన దోషులను నాయకులు పట్టుకొని బహిరంగంగా చంపాలని ఆజ్ఞ ఇచ్చినట్లు అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ వ్యాకరణంలో אֹתָם నేరుగా ‘ప్రజల నాయకులు’ వైపు చూపుతుంది. అయితే తరువాతి వచనంలో న్యాయాధిపతులు దోషులను చంపాలని మోషే చెప్పడం ప్రత్యామ్నాయ పఠనానికి ఆధారమిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ప్రత్యక్ష వ్యాకరణ పఠనాన్ని ఉంచి, నిజమైన వ్యాఖ్యాన అనిశ్చితిని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి వాడింది. ‘ప్రజల తలలు’ అనే అక్షరానువాదం శరీర భాగాలుగా అపార్థమయ్యే అవకాశం ఉన్నందున ‘ప్రజల నాయకులు’ అని ఇచ్చింది. హింసాత్మక శిక్షను మూలంలోని తీవ్రత తగ్గకుండా, కానీ అనవసర విస్తరణ లేకుండా వ్యక్తం చేసింది.
