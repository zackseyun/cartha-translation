source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: te
  text: 'ఇదిగో, ఇశ్రాయేలు కుమారుల్లో ఒకడు వచ్చి, మోషే కళ్లముందే, ఇశ్రాయేలు కుమారుల సమాజమంతటి కళ్లముందే, తన సహోదరుల దగ్గరికి[a] ఒక మిద్యాను స్త్రీని[b] తీసుకొచ్చాడు; ఆ సమయంలో వారు సమాగమ గుడారపు ప్రవేశద్వారం దగ్గర ఏడుస్తూ ఉన్నారు.


    [a] లేదా “తన బంధువుల దగ్గరికి,” లేదా “తన తోటి ఇశ్రాయేలీయుల దగ్గరికి.” హీబ్రూ పదబంధానికి అక్షరార్థం “తన సహోదరుల దగ్గరికి.”


    [b] హీబ్రూలో అక్షరార్థంగా “ఆ మిద్యాను స్త్రీ” అని ఉంది. అయితే కథలో ఆమెను ఇక్కడ పరిచయం చేస్తున్నందున “ఒక మిద్యాను స్త్రీ” అని అనువదించబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన బంధువుల దగ్గరికి,” లేదా “తన తోటి ఇశ్రాయేలీయుల దగ్గరికి.” హీబ్రూ పదబంధానికి అక్షరార్థం “తన సహోదరుల దగ్గరికి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఆ మిద్యాను స్త్రీ” అని ఉంది. అయితే కథలో ఆమెను ఇక్కడ పరిచయం చేస్తున్నందున “ఒక మిద్యాను స్త్రీ” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా గమనాన్ని ఆకర్షించే కథన సూచకపు బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల్లో
  rationale: హీబ్రూలోని కుటుంబసంబంధమైన పురుషలింగ పదప్రయోగాన్ని నిలుపుతూ, తెలుగులో సహజమైన బహువచన రూపాన్ని వాడుతుంది.
- source_word: וַיַּקְרֵב
  choice: దగ్గరికి ... తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపంలోని ‘దగ్గరకు రప్పించడం/తీసుకురావడం’ అనే దిశాత్మక భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: אֶל אֶחָיו
  choice: తన సహోదరుల దగ్గరికి
  rationale: ‘తన సహోదరుల వద్దకు’ అనే హీబ్రూ కుటుంబసంబంధ పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భానుసార ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇస్తుంది.
- source_word: הַמִּדְיָנִית
  choice: ఒక మిద్యాను స్త్రీని
  rationale: స్త్రీలింగ విశేషణం నామవాచకంగా పనిచేస్తున్నందున ‘స్త్రీ’ని స్పష్టంగా చేర్చింది; కథనంలో మొదటి పరిచయానికి సహజంగా ఉండేందుకు అనిర్దిష్ట రూపాన్ని వాడింది.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: కళ్లముందే ... కళ్లముందే
  rationale: ఈ చర్య బహిరంగంగా, ధిక్కారపూర్వకంగా జరిగిందనే ఉద్ఘాటనను చూపేందుకు హీబ్రూ పునరుక్తిని నిలుపుతుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల సమాజమంతటి
  rationale: עֵדָהను కూడిన ఒడంబడిక సమూహంగా సూచిస్తూ, మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: וְהֵמָּה בֹכִים
  choice: ఆ సమయంలో వారు ... ఏడుస్తూ ఉన్నారు
  rationale: ప్రధాన చర్య జరుగుతున్నప్పుడు కొనసాగుతున్న నేపథ్య చర్యను తెలుగు వ్యాకరణంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: సమాగమ గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: నిర్దిష్ట పరిశుద్ధస్థలాన్ని సూచించే పదబంధాన్ని ఆధునిక, సులభమైన తెలుగులో అందిస్తుంది; מוֹעֵדలోని సమావేశ భావాన్ని ‘సమాగమ’ నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל మరియు אֶחָיוలోని లింగసూచక కుటుంబ భాష
  choice: ప్రధాన పాఠ్యంలో “ఇశ్రాయేలు కుమారులు,” “సహోదరులు” అని నిలుపడం
  alternative: “ఇశ్రాయేలీయులు,” “బంధువులు,” లేదా “తోటి ఇశ్రాయేలీయులు”
  rationale: మూల హీబ్రూ పురుషలింగ కుటుంబ పదాలను ఉపయోగిస్తుంది. వాటిని లింగతటస్థంగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానికి సరిపోయే విస్తృత అర్థాలను పాదటిప్పణిలో సూచించడం మూలంలోని ఒడంబడిక-కుటుంబ భాషను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే ‘ఇదిగో,’ ‘ఇశ్రాయేలు కుమారులు,’ ‘కళ్లముందే’ వంటి మూలపాఠ్య ఉద్ఘాటనలను గంభీరంగా నిలుపింది. ‘సమాగమ గుడారం’ పరిశుద్ధస్థలపు ప్రత్యేకతను స్పష్టంగా తెలియజేస్తుంది.
