id: NUM.25.3
reference: Numbers 25:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు పెయోరు బయలుకు జతపడింది[a]. యాహ్వే కోపం ఇశ్రాయేలుపై రగిలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెయోరు-బయలుకు జతపడింది”; లేదా “పెయోరు బయలు కాడికి తనను తాను కట్టుకుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: జతకట్టింది
  rationale: నిఫాల్ రూపంలోని צמד, దగ్గరగా జతపడడం లేదా తనను తాను అనుబంధించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘జతకట్టింది’ అనే పదం ఇక్కడి విగ్రహారాధన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కాడికి కట్టుకుంది’ అనే రూపకం మూలంలోని సాధ్యమైన భావఛాయను చూపినా ప్రధాన పాఠ్యంలో కొంత వ్యాఖ్యానాత్మకంగా ఉంటుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: జాతిని సూచించే పేరుకు తెలుగులో ప్రామాణికమైన రూపం.
- source_word: לְבַעַל פְּעוֹר
  choice: పెయోరు బయలుతో
  rationale: בעל అనేది దేవతా నామం/బిరుదు; פעור దాని స్థానిక సంబంధాన్ని నిర్దేశిస్తుంది. ‘పెయోరు బయలు’ అనే నిర్మాణం ఆ సంబంధాన్ని నిలుపుతుంది; తెలుగు క్రియ ‘జతకట్టు’తో ‘తో’ విభక్తి సహజంగా ఉంటుంది.
- source_word: וַיִּחַר אַף
  choice: కోపం రగిలింది
  rationale: హీబ్రూ నుడికారం కోపాన్ని మండే వేడిగా చిత్రిస్తుంది. ‘కోపం రగిలింది’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: חרה אף అనే కోప నుడికారంతో ב కోపానికి గురైనవారిని సూచిస్తుంది; తెలుగులో ‘ఇశ్రాయేలుమీద’ సహజమైన సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి దగ్గరైన ‘యాహ్వే’ రూపాన్ని వాడాం.
- issue: ఇశ్రాయేలు బయలుతో ఏర్పరచుకున్న సంబంధ స్వభావం
  choice: జతకట్టింది
  alternative: కాడికి కట్టుకుంది
  rationale: צמד సన్నిహితంగా జతపడటం అనే భావాన్ని ఇస్తుంది; ఇది విగ్రహారాధనతో కూడిన అనుబంధాన్ని సూచిస్తుంది. అయితే ‘కాడి’ అనే నిర్దిష్ట రూపకాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలంలోని విస్తృత భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘కోపం రగిలింది’ ద్వారా హీబ్రూ రూపకం నిలుపబడింది; ప్రత్యామ్నాయ భావఛాయలు పాదసూచికలో ఇవ్వబడ్డాయి.
