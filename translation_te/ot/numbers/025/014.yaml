    reason: lexical_alternative
  - marker: b
    text: ‘పితృకుటుంబం’ అంటే ఒక తెగలో తండ్రి వంశరేఖ ఆధారంగా ఏర్పడిన కుటుంబ లేదా కుల విభాగం.
