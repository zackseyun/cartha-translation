  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: te
  text: హతమార్చబడిన[a], మిద్యాను స్త్రీతో కలిసి హతమార్చబడిన ఇశ్రాయేలీయుని పేరు సలూ కుమారుడైన జిమ్రీ; అతడు షిమ్యోనీయులలోని ఒక పితృకుటుంబానికి నాయకుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ మూలపాఠంలో ‘హతమార్చబడిన’ అనే క్రియ రెండుసార్లు వచ్చి, జరిగిన దానిని ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: పేరు
  rationale: వావ్ ఇక్కడ ముందరి కథనంతో గుర్తింపు సమాచారాన్ని అనుసంధానిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా వాక్య క్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుడు
  rationale: ఈ పదబంధం ఇశ్రాయేలు జాతికి చెందిన పురుషుణ్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయుడు’ లింగం, జాతీయ గుర్తింపు రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: హతమార్చబడిన ... హతమార్చబడిన
  rationale: నכה క్రియారూపం హెబ్రీలో ఉద్దేశపూర్వకంగా పునరుక్తమైంది. ఆ ఉద్ఘాటనను కోల్పోకుండా తెలుగులోనూ పునరుక్తిని నిలిపాం.
- source_word: אֶת הַמִּדְיָנִית
  choice: మిద్యాను స్త్రీతోపాటు
  rationale: స్త్రీలింగ ఏకవచన విశేషణం మిద్యాను స్త్రీని సూచిస్తుంది; ఈ నిర్మాణంలో אֶת సహచర్య భావాన్ని, అంటే ఆమెతో కలసి అతడూ చంపబడినట్లు, తెలియజేస్తుంది.
- source_word: זִמְרִי בֶּן סָלוּא
  choice: సాలూ కుమారుడు జిమ్రీ
  rationale: వ్యక్తి పేర్లను అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, హెబ్రీ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం.
- source_word: נְשִׂיא
  choice: నాయకుడు
  rationale: ఈ సందర్భంలో పదం సమూహానికి అధిపతి లేదా నాయకుణ్ని సూచిస్తుంది; రాజకుమారుడు అనే అపార్థం రాకుండా ‘నాయకుడు’ ఎంచుకున్నాం.
- source_word: בֵית אָב
  choice: పితృవంశ కుటుంబం
  rationale: ఇది తెగలోని తండ్రి వంశరేఖ ఆధారిత కుటుంబ లేదా కుల విభాగానికి సాంకేతిక పదం. ‘పితృవంశ కుటుంబం’ ఆ సామాజిక నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַשִּׁמְעֹנִי
  choice: షిమ్యోనీయులలో
  rationale: ఈ రూపం షిమ్యోను తెగకు చెందినవారిలో అతని కుటుంబ విభాగం ఉందని సూచిస్తుంది; ‘షిమ్యోనీయులలో’ ఆ అనుబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
