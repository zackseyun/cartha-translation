  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హెబ్రీ పునరుక్తిని డాష్‌ల మధ్య ఉన్న వివరణాత్మక నిర్మాణంతో నిలిపి, సాంకేతిక బంధుత్వ పదానికి పాదటిప్పణి ఇచ్చాం.
