revisions:
- from: హతమార్చబడిన ఇశ్రాయేలీయుడి పేరు—మిద్యాను స్త్రీతోపాటు హతమార్చబడిన అతని పేరు[a]—సాలూ కుమారుడు జిమ్రీ. అతడు షిమ్యోనీయులలో ఒక పితృవంశ కుటుంబానికి[b] నాయకుడు.
  to: హతమార్చబడిన[a], మిద్యాను స్త్రీతో కలిసి హతమార్చబడిన ఇశ్రాయేలీయుని పేరు సలూ కుమారుడైన జిమ్రీ; అతడు షిమ్యోనీయులలోని ఒక పితృకుటుంబానికి నాయకుడు.
