id: NUM.25.11
reference: Numbers 25:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: te
  text: యాజకుడైన అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు, ఇశ్రాయేలీయుల మధ్య నా ఉత్సాహంతో ఉత్సాహపడి[a], వారిమీద నుండి నా ఉగ్రకోపాన్ని తిప్పివేశాడు; అందువల్ల నా ఉత్సాహంలో నేను ఇశ్రాయేలీయులను పూర్తిగా నిర్మూలించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అసూయతో అసూయపడి … నా అసూయలో.” ఫీనెహాసు చర్యకూ దేవుని ప్రతిస్పందనకూ హీబ్రూలో ఒకే మూలానికి చెందిన పదాలు వాడబడ్డాయి.
    reason: కנא పదకుటుంబానికి “ఉత్సాహం” మరియు “అసూయ” రెండూ సందర్భానుకూలమైన సాధ్యమైన అనువాదాలు. ప్రధాన పాఠం సజాతి పదప్రయోగాన్ని “ఉత్సాహంతో ఉత్సాహపడి” అని నిలుపుతుంది; పాదసూచిక నిబంధనకు సంబంధించిన అసూయ అనే ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: הֵשִׁיב
  choice: తొలగించాడు
  rationale: ఇక్కడ שוב హిఫిల్ రూపం ఉగ్రకోపాన్ని వెనక్కి మళ్లించడం లేదా దూరం చేయడం అనే కారణార్థాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘తొలగించాడు’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חֲמָתִי
  choice: నా ఉగ్రకోపం
  rationale: חֵמָה తీవ్రమైన, మండే కోపాన్ని సూచిస్తుంది. ‘ఉగ్రకోపం’ దాని తీవ్రతను నిలుపుతుంది.
- source_word: מֵעַל
  choice: వారిమీద ఉన్న … తొలగించాడు
  rationale: מֵעַל‌లోని ‘మీదనుండి’ అనే చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి కోపం ‘వారిమీద ఉన్నది’ అని నిర్మాణాన్ని మార్చి చెప్పబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ జాతీయ-నిబంధనాత్మక పదబంధానికి తెలుగులో స్థిరమైన, సహజమైన సమానార్థక రూపం ‘ఇశ్రాయేలీయులు’. ఇది సందర్భంలోని సమస్త ప్రజలను స్పష్టంగా సూచిస్తుంది.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: నా ఆసక్తితోనే ఆసక్తి కనబరచి
  rationale: క్రియ, నామవాచకం రెండూ קנא అనే ఒకే మూలం నుండి వచ్చినవని కనిపించేలా ‘ఆసక్తి’ పదాన్ని పునరుక్తి చేశాం. ‘అసూయ’ కూడా సాధ్యమే కాని ఆధునిక తెలుగులో అది తరచుగా ఇతరుల మేలు చూసి కలిగే ఈర్ష్యను సూచిస్తుంది; ఈ సందర్భంలో నిబంధనపట్ల ప్రత్యేక నిబద్ధతతో కూడిన ఉత్సాహాన్ని ‘ఆసక్తి’ మెరుగ్గా తెలియజేస్తుంది.
- source_word: בְּתוֹכָם
  choice: వారి మధ్య
  rationale: సమాజం నడుమ ఫీనెహాసు చేసిన చర్యను సహజమైన తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: כִלִּיתִי
  choice: పూర్తిగా నాశనం చేయలేదు
  rationale: כלה పియేల్ రూపం ముగించివేయడం లేదా సమూలంగా నాశనం చేయడం అనే బలమైన భావాన్ని కలిగి ఉంది. ‘పూర్తిగా నాశనం’ ఆ సంపూర్ణతను నిలుపుతుంది.
- source_word: בְּקִנְאָתִי
  choice: నా ఆసక్తిలో
  rationale: ముందటి קנא పదాలతో ఉన్న మూలపద సంబంధాన్ని నిలుపుతూ, దేవుని తీవ్ర నిబంధనా నిబద్ధతను వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఈ బిరుదు అహరోనును విశేషిస్తున్నట్లు తెలుగులో స్పష్టంగా, సహజంగా ఉంచబడింది.
theological_decisions:
- issue: ఫీనెహాసు చర్యకూ దేవుని ప్రతిస్పందనకూ వాడిన קנא / קִנְאָה పదజాలం
  choice: ఆసక్తి / ఆసక్తి కనబరచడం
  alternative: అసూయ / అసూయపడడం; ఉత్సాహం / ఉత్సాహపడడం
  rationale: హీబ్రూ ఒకే మూలానికి చెందిన పదాలను ఉద్దేశపూర్వకంగా పునరావృతం చేస్తుంది. ప్రధాన పాఠంలో ఆ సంబంధాన్ని పునరుక్తితో నిలిపి, ఆధునిక తెలుగులో సాధారణంగా ప్రతికూలమైన ‘అసూయ’ భావం అనవసరంగా ముందుకు రాకుండా ‘ఆసక్తి’ ఎంచుకోబడింది. అయితే నిబంధనాత్మక అసూయ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క అనువాదం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ హీబ్రూ పదబంధం ఇక్కడ జాతి సమూహాన్నంతటినీ సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజమైన ప్రామాణిక జాతీయ నామం; ఇది పురుషులకు మాత్రమే పరిమితమనే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే వంశావళి సంబంధం, దైవిక ఉగ్రకోపం, సంపూర్ణ నాశనం అనే మూలపాఠపు బలమైన భావాలు నిలుపబడ్డాయి. పద్యం గంభీరంగా ఉన్నప్పటికీ అతిగా ప్రాచీనమైన పదజాలం నివారించబడింది.
