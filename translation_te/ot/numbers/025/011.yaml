revisions:
- from: యాజకుడైన అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు, ఇశ్రాయేలీయుల మధ్య నా ఆసక్తితోనే ఆసక్తి కనబరచి[a], వారిమీద ఉన్న నా ఉగ్రకోపాన్ని తొలగించాడు. అందుచేత నా ఆసక్తిలో నేను ఇశ్రాయేలీయులను పూర్తిగా నాశనం చేయలేదు.
