- from: యాజకుడైన అహరోను కుమారుడు ఎలియాజరు కుమారుడైన ఫీనెహాసు అది చూసి[a], సమాజం మధ్యనుంచి లేచి, తన చేతిలో ఒక ఈటె తీసుకున్నాడు[b].
  to: యాజకుడైన అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు చూసి[a], సమాజం[b] మధ్యలోనుండి లేచి, తన చేతిలో ఒక ఈటెను తీసుకున్నాడు.
  rationale: The revision preserves the Hebrew's unstated object with the natural Telugu ‘చూసి’ and retains the possible contextual supplement in a footnote. It clarifies the genealogical apposition, improves the idiom for taking the spear, and replaces the nonessential word-order note with a source-based alternative for עֵדָה. No doctrinal interpretation is introduced.
