id: NUM.25.7
reference: Numbers 25:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: te
  text: యాజకుడైన అహరోను కుమారుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు చూసి[a], సమాజం[b] మధ్యలోనుండి లేచి, తన చేతిలో ఒక ఈటెను తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అది చూసి.’ హీబ్రూలో కర్మ చెప్పబడలేదు; ముందరి సందర్భం ద్వారా అది అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సభ’ లేదా ‘జనసమూహం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: అది చూసి
  rationale: హీబ్రూలో క్రియకు కర్మ స్పష్టంగా లేదు; ముందరి వచనంలో జరిగినదే సూచిత కర్మ. సహజమైన తెలుగుకోసం ‘అది’ చేర్చబడింది, కానీ సంఘటనను మరింత నిర్దిష్టంగా వ్యాఖ్యానించలేదు.
- source_word: פִּינְחָס
  choice: ఫీనెహాసు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడ్డ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారుడు ఎలియాజరు కుమారుడైన
  rationale: వంశావళి సంబంధాన్ని స్పష్టంగా, సహజ తెలుగు క్రమంలో ఉంచాం. הַכֹּהֵן అన్నది ‘యాజకుడు’ మాత్రమే; ‘ప్రధాన యాజకుడు’ అని విస్తరించలేదు.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: క్రియలోని లేవడం/నిలబడడం భావాన్ని కథన ప్రవాహానికి తగిన సహజ తెలుగు రూపంలో ఇచ్చాం.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: సమాజం మధ్యనుంచి
  rationale: תּוֹךְ యొక్క ‘మధ్య’ భావాన్ని, עֵדָה యొక్క కూడిన ఇశ్రాయేలు సమూహ భావాన్ని నిలిపాం.
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: సాధారణ ‘తీసుకొను’ అనే అర్థమే సందర్భానికి సరిపోతుంది; ‘లాక్కున్నాడు’ వంటి అధిక బలార్థాన్ని చేర్చలేదు.
- source_word: רֹמַח
  choice: ఒక ఈటె
  rationale: ఈ ఆయుధానికి సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం ‘ఈటె’.
- source_word: בְּיָדוֹ
  choice: తన చేతిలో
  rationale: ఆయుధాన్ని చేతిలోకి తీసుకున్నాడనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הָעֵדָה పదం అనువాదం
  choice: సమాజం
  alternative: సభ / జనసమూహం
  rationale: ఇక్కడ ఈ పదం కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆ సామూహిక భావాన్ని సహజ ఆధునిక తెలుగులో ఇస్తుంది; తరువాతి సంఘసంబంధ ప్రత్యేక అర్థాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. వంశావళి సంబంధం అయోమయం కాకుండా తెలుగు సహజ క్రమంలో అమర్చబడింది; మూలంలోని సూచిత కర్మకు సంబంధించిన అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
