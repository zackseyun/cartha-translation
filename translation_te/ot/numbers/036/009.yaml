id: NUM.36.9
reference: Numbers 36:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: te
  text: ఒక గోత్రం నుండి మరొక గోత్రానికి స్వాస్థ్యం మారకూడదు; ఎందుకంటే ఇశ్రాయేలు కుమారుల ప్రతి గోత్రం[a] తన స్వాస్థ్యానికే అంటిపెట్టుకొని ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు గోత్రాలు.” హీబ్రూలో, “ఇశ్రాయేలు కుమారుల గోత్రాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִסֹּב
  choice: మారకూడదు
  rationale: ఈ న్యాయసంబంధ సందర్భంలో క్రియ భౌతికంగా తిరగడాన్ని కాక, స్వాస్థ్యం ఒక గోత్రపు ఆధీనంనుంచి మరొక గోత్రపు ఆధీనానికి మారడాన్ని సూచిస్తుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యం
  rationale: ఇక్కడ పదం ఇశ్రాయేలు గోత్రాలకు కేటాయించబడిన వారసత్వ భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆధునిక తెలుగులో ఆ వారసత్వ-ఆస్తి భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: ఒక గోత్రపు ... మరొక గోత్రానికి
  rationale: מַטֶּה అక్షరార్థంగా ‘దండం’ కావచ్చుగాని, ఈ భూస్వాస్థ్య సందర్భంలో గోత్రాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో సంబంధాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: כִּי
  choice: ;
  rationale: כִּי ఇక్కడ ముందున్న నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో అర్ధవిరామం ద్వారా ఆ వివరణాత్మక సంబంధం సహజంగా నిలుస్తుంది; ‘ఎందుకంటే’ అని స్పష్టంగా కూడా అనువదించవచ్చు.
- source_word: אִישׁ
  choice: ప్రతి గోత్రం
  rationale: వ్యాకరణరీత్యా ఏకవచన పుంలింగమైనప్పటికీ, తరువాతి బహువచన కర్తతో కలిసి ఇది గోత్రాలన్నిటికీ వర్తించే పంపిణీ భావాన్ని ఇస్తుంది.
- source_word: בְּנַחֲלָתוֹ יִדְבְּקוּ
  choice: తన స్వాస్థ్యాన్నే అంటిపెట్టుకొని ఉండాలి
  rationale: דבק లోని ‘అంటుకొని ఉండటం/గట్టిగా పట్టుకోవటం’ అనే రూపకాన్ని నిలుపుతూ, ప్రతి గోత్రం తనకు కేటాయించిన స్వాస్థ్యంతోనే అనుబంధంగా ఉండాలనే న్యాయార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గోత్రాలు
  rationale: హీబ్రూ మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే లింగసూచక ఒడంబడిక పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక ఒడంబడిక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని వ్యాకరణపరమైన, సాంప్రదాయిక పుంలింగ రూపాన్ని మార్చకుండా ఉంచింది; సందర్భంలో ఇది పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- issue: ఏకవచన אִישׁ మరియు బహువచన יִדְבְּקוּ మధ్య నిర్మాణం
  choice: గోత్రాల్లో ప్రతి గోత్రం తన స్వాస్థ్యాన్ని అంటిపెట్టుకొని ఉండాలి
  alternative: ప్రతి వ్యక్తి తన స్వాస్థ్యాన్ని అంటిపెట్టుకొని ఉండాలి
  rationale: వాక్యపు కర్త చివర ఉన్న ‘ఇశ్రాయేలు కుమారుల గోత్రాలు’; అందువల్ల వ్యక్తిగత పురుషునిగా కాక ప్రతి గోత్రానికి పంపిణీగా అర్థం చేయడం సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయప్రకటనకు తగిన గంభీరమైన కాని సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. ‘అంటిపెట్టుకొని’ అనే రూపం మూలంలోని דבק రూపకాన్ని నిలుపుతుంది. ఫుట్‌నోట్ సూచికను సంబంధిత పదబంధం తరువాత ఉంచడం పాఠకులకు స్పష్టతనిస్తుంది.
