source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: te
  text: 'యాహ్వే మాట ప్రకారం[a] మోషే ఇశ్రాయేలీయులకు ఇలా ఆజ్ఞాపించాడు: “యోసేపు కుమారుల గోత్రంవారు చెప్పేది సరైనదే[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “యాహ్వే నోటి ప్రకారం.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యోసేపు కుమారుల గోత్రంవారు సరిగానే మాట్లాడుతున్నారు” లేదా “వారి మాట సరైనది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అధికారపూర్వకమైన ఆజ్ఞను ఇవ్వడాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ ఆ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ అది ఇశ్రాయేలు ప్రజలను సూచిస్తున్నందున ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: עַל פִּי יְהוָה
  choice: యాహ్వే మాట ప్రకారం
  rationale: అక్షరార్థంగా ‘యాహ్వే నోటి ప్రకారం’; దైవిక అధికారంతో పలికిన మాట అనే భావాన్ని ఈ సహజమైన తెలుగు నుడికారం నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా అందించింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ రూపాన్ని ‘ఇలా ఆజ్ఞాపించాడు’ అనే సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేసింది.
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: యోసేపు కుమారుల గోత్రంవారు
  rationale: מַטֶּה ఇక్కడ ‘గోత్రం’ అని అర్థం; సామూహిక గోత్రం మాట్లాడుతున్నదనే భావాన్ని తెలుగులో సహజంగా చూపడానికి ‘గోత్రంవారు’ వాడింది.
- source_word: כֵּן ... דֹּבְרִים
  choice: చెప్పేది సరైనదే
  rationale: כֵּן ఇక్కడ వారి వాదన సరైనదని ధృవీకరిస్తుంది; דֹּבְרִיםలోని మాట్లాడటం అనే భావాన్ని ‘చెప్పేది’ నిలుపుతూ, మొత్తం వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ‘Jehovah’కు సాధారణంగా సంబంధించిన ‘యెహోవా’ రూపం బదులు ‘Yahweh’ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా ఇచ్చింది.
- issue: యోసేపు గోత్రపు ప్రతినిధుల మాటపై తీర్పు
  choice: చెప్పేది సరైనదే
  alternative: సరిగానే మాట్లాడుతున్నారు
  rationale: వారి ప్రతిపాదన సరైనదని వాక్యం ధృవీకరిస్తుంది. అయితే דֹּבְרִים అనే ‘మాట్లాడు’ క్రియను పూర్తిగా తొలగించకుండా ‘చెప్పేది’లో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించింది. ‘ఇశ్రాయేలీయులు’ సహజమైన ప్రజానామంగా, ‘గోత్రంవారు’ సామూహిక కర్తను స్పష్టంగా చూపే రూపంగా వాడబడ్డాయి. అక్షరార్థ హీబ్రూ నుడికారాన్ని పాదటిప్పణిలో భద్రపరిచింది.
