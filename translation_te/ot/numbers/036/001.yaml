id: NUM.36.1
reference: Numbers 36:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: te
  text: అప్పుడు యోసేపు కుమారుల వంశాలకు చెందిన, మనష్షే కుమారుడైన మాకీరు కుమారుడైన గిలాదు కుమారుల వంశపు పితృకుటుంబాల పెద్దలు[a] దగ్గరకు వచ్చి, మోషే ఎదుటను ఇశ్రాయేలీయుల[b] పితృకుటుంబాల పెద్దలైన నాయకుల ఎదుటను మాట్లాడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పితృకుటుంబాల నాయకులు.” హెబ్రీయ నుడికారం ఇశ్రాయేలు గోత్ర వ్యవస్థలో గుర్తింపు పొందిన పితృవంశ కుటుంబాల నాయకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల.” ఇది ఇశ్రాయేలీయులను సూచించే సాంప్రదాయ హెబ్రీయ వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: దగ్గరకు వచ్చి
  rationale: కేసును అధికారుల ముందుకు తీసుకురావడానికి వారు చేరువ కావడాన్ని సూచించే קרב క్రియ యొక్క కదలికనూ, అధికారిక సందర్భాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: అక్షరార్థంగా ‘తండ్రుల పెద్దలు’ అనే హెబ్రీయ సామాజిక నుడికారాన్ని పదశః కాకుండా, ఇశ్రాయేలు వంశ-కుటుంబ వ్యవస్థలో గుర్తింపు పొందిన నాయకులను సూచించేలా అనువదిస్తుంది.
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: గిలాదు కుమారుల వంశపు
  rationale: לְ ఇక్కడ దిశను కాక సంబంధాన్ని సూచిస్తుంది. ‘వంశపు’ ఆ బంధాన్ని సహజంగా తెలుపుతుంది; ‘కుమారులు’ అనే వంశావళి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: మనష్షే కుమారుడు మాకీరు కుమారుడైన
  rationale: పునరుక్తమైన ‘కుమారుడు’ నిర్మాణాన్ని ఉంచి, తెలుగులో గిలాదును విశేషించే క్రమంలో వంశావళిని స్పష్టంగా అందిస్తుంది.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: యోసేపు కుమారుల వంశాలలోనివారైన
  rationale: מִן సూచించే విస్తృత వంశసమూహంలోని మూలం లేదా సభ్యత్వాన్ని తెలుపుతూ, యోసేపు సంతానంతో సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: మోషే సమక్షంలోను నాయకుల సమక్షంలోను
  rationale: לִפְנֵי యొక్క అధికారుల ఎదుట హాజరై మాట్లాడే భావాన్ని ‘సమక్షంలో’ గౌరవప్రదంగా తెలుపుతుంది; נְשִׂיאִים కు ఆధునికంగా స్పష్టమైన ‘నాయకులు’ వాడబడింది.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల పితృకుటుంబాల పెద్దలు
  rationale: నాయకులను మరింత ఖచ్చితంగా గుర్తించే అన్వయ పదబంధాన్ని సహజ తెలుగు క్రమంలో అందిస్తుంది; ‘ఇశ్రాయేలీయులు’ సాధారణ పాఠకులకు ‘ఇశ్రాయేలు కుమారులు’ కంటే సులభంగా అర్థమవుతుంది.
