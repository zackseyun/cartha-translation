translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. సంక్లిష్ట వంశావళి సంబంధాలు మూలంలోని క్రమాన్ని సాధ్యమైనంతగా నిలుపుతూ తెలుగులో స్పష్టంగా ఉండేలా అమర్చబడ్డాయి. నాయకులను వివరిస్తున్న అన్వయ భాగాన్ని దీర్ఘ విరామ చిహ్నాల మధ్య ఉంచి వాక్య నిర్మాణాన్ని స్పష్టం చేశాం.
