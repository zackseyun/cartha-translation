id: NUM.36.12
reference: Numbers 36:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: te
  text: వారు యోసేపు కుమారుడైన మనష్షే సంతానపు వంశాలలోని పురుషులకు భార్యలయ్యారు[a]. దాంతో వారి స్వాస్థ్యం వారి తండ్రి వంశపు గోత్రంలోనే నిలిచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోసేపు కుమారుడైన మనష్షే సంతానపు వంశాల నుండే వారు భార్యలయ్యారు.’ హీబ్రూ వాక్యనిర్మాణం వారు ఆ వంశాల పరిధిలోనే వివాహం చేసుకున్నారని చెబుతుంది; వరులను ప్రధానంగా చూపకుండా కూడా దీనిని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: వంశాలలోని
  rationale: מִן మూలం లేదా సమూహం లోపలి ఎంపికను సూచిస్తుంది; ఈ సందర్భంలో ఆ స్త్రీలు మనష్షే సంతానపు వంశాల పరిధిలోనే వివాహం చేసుకున్నారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: యోసేపు కుమారుడైన మనష్షే సంతానం
  rationale: בְּנֵי ఇక్కడ తక్షణ కుమారులను కాక గోత్రీయ వారసులను సూచిస్తుంది. ‘సంతానం’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా ఇస్తూ, ‘యోసేపు కుమారుడైన మనష్షే’ అనే వంశావళి సంబంధాన్ని నిలుపుతుంది.
- source_word: הָיוּ לְנָשִׁים
  choice: పురుషులకు భార్యలయ్యారు
  rationale: అక్షరార్థంగా ‘భార్యలుగా అయ్యారు.’ స్త్రీలనే వాక్య కర్తలుగా ఉంచి, తెలుగులో వివాహ సంబంధాన్ని సహజంగా వ్యక్తం చేయడానికి ‘పురుషులకు’ను సందర్భానుసారంగా స్పష్టం చేశాం.
- source_word: נַחֲלָתָן
  choice: వారి స్వాస్థ్యం
  rationale: సంఖ్యాకాండంలోని ఈ న్యాయపరమైన సందర్భంలో נַחֲלָה వారసత్వంగా లభించిన గోత్రీయ భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆస్తి మరియు వారసత్వ భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: וַתְּהִי
  choice: నిలిచింది
  rationale: క్రియ ప్రాథమికంగా ‘ఉంది/అయింది’ అయినా, వివాహానంతరం స్వాస్థ్యం అదే గోత్రంలో కొనసాగిందనే సందర్భార్థాన్ని ‘నిలిచింది’ సహజంగా తెలియజేస్తుంది.
- source_word: עַל מַטֵּה
  choice: గోత్రంలోనే
  rationale: מַטֶּה ఇక్కడ ‘దండం’ కాదు, ఇశ్రాయేలు గోత్ర విభాగం. עַל సంబంధం లేదా అనుబంధాన్ని సూచిస్తుంది; ‘లోనే’ ఆ స్వాస్థ్యం ఆ గోత్ర పరిధిని విడిచిపోలేదనే భావాన్ని అందిస్తుంది.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: వారి తండ్రి వంశం
  rationale: ఏకవచన సమాసం సమిష్టిగా వారి పితృవంశాన్ని సూచిస్తుంది. ‘తండ్రి వంశం’ ఆధునిక తెలుగులో కుటుంబం కంటే విస్తృతమైన వంశ సమూహాన్ని స్పష్టంగా తెలుపుతుంది.
