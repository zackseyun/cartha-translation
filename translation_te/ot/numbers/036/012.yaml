  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గోత్ర-స్వాస్థ్య సందర్భానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘వంశం’ను מִשְׁפָּחָהకు, ‘గోత్రం’ను מַטֶּהకు వాడి సామాజిక స్థాయుల మధ్య తేడాను నిలిపాం.
