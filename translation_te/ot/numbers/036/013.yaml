    text: లేదా, ‘యెరికోకు ఎదురుగా యొర్దాను దగ్గర.’
    reason: alternative_reading
  revision_rationale: The revision retains the Hebrew legal-summary formulation and all principal lexical choices, while using a neutral main-text rendering for the geographically compact final phrase and preserving the ‘opposite Jericho’ interpretation in a separately anchored footnote. It also aligns the Telugu form of the Tetragrammaton with the English POB audit trail.
