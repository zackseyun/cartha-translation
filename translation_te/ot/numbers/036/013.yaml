source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: te
  text: యాహ్వే మోషే ద్వారా ఇశ్రాయేలు కుమారులకు ఆజ్ఞాపించిన ఆజ్ఞలు, న్యాయవిధులు ఇవే—మోయాబు మైదానాల్లో, యెరికో సమీపంలోని యొర్దాను దగ్గర.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది ఇశ్రాయేలు ప్రజలందరినీ సమష్టిగా సూచించే నిబంధనాపరమైన వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యెరికోకు ఎదురుగా యొర్దాను దగ్గర.’
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: ముగింపు సారాంశ సూత్రాన్ని సూచించే బహువచన నిర్దేశక పదం; తెలుగులో ‘ఇవే’ సహజంగా, ఉద్ఘాటనతో ఉంటుంది.
- source_word: הַמִּצְוֺת
  choice: ఆజ్ఞలు
  rationale: మִצְוָה యొక్క అధికారపూర్వకమైన ఆదేశ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: చట్టసంబంధ సందర్భంలో מִשְׁפָּטִים సూచించే తీర్పులు/విధుల భావాన్ని ‘న్యాయవిధులు’ స్పష్టంగా అందిస్తుంది; ‘తీర్పులు’ అనే పదం ఇక్కడ వ్యక్తిగత తీర్పులుగా అపార్థమయ్యే అవకాశం ఉంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ‘ఆజ్ఞలు’తో ఉన్న మూలపద సంబంధాన్ని, అధికారపూర్వక క్రియను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; ఇది మధ్యవర్తిత్వం లేదా సాధనాన్ని సూచించే హీబ్రూ నుడికారం. ‘మోషే ద్వారా’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: బְּנֵי యొక్క అక్షరార్థమైన ‘కుమారులు’ను నిలుపుతూ, ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే నిబంధనాపరమైన వ్యక్తీకరణను సంరక్షిస్తుంది.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עַרְבֹת సూచించే మైదాన/గడ్డి మైదాన ప్రాంతాన్ని సహజమైన భౌగోళిక పదబంధంతో అందిస్తుంది.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: యెరికోకు ఎదురుగా యొర్దాను దగ్గర
  rationale: ప్రదేశం యొర్దాను అవతల, యెరికోకు ఎదురుగా ఉందనే భౌగోళిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని సంక్షిప్త పదబంధానికి ఉన్న స్వల్ప సందిగ్ధతను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామంగానే ఉంచాం; తెలుగులో పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమష్టి భావం
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలీయులకు
  rationale: మూలంలోని లింగసూచక నిబంధనా వ్యక్తీకరణను నిలిపి ఉంచాం; ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమం వాడబడింది; అయితే ముగింపు చట్టసారాంశానికి తగిన గంభీరతను, ‘ఆజ్ఞలు—న్యాయవిధులు’ అనే న్యాయపరమైన జోడిని కాపాడాం. దైవనామం బిరుదుగా కాక వ్యక్తిగత నామంగా నిలుపబడింది.
