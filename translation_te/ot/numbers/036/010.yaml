id: NUM.36.10
reference: Numbers 36:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే సెలోఫెహాదు కుమార్తెలు చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר ... כֵּן నిర్మాణం ఆజ్ఞకూ కార్యానికీ ఉన్న ఖచ్చితమైన అనురూపతను సూచిస్తుంది; తెలుగులో ‘-ినట్టే ... చేశారు’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఈ క్రియ ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది. ఆ ఆజ్ఞ కుమార్తెల చర్యకు ముందే ఇవ్వబడిందనే క్రమం తెలుగు భూతకాల కృదంత నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: אֶת మోషేను ఆజ్ఞ అందుకున్న వ్యక్తిగా సూచిస్తుంది. ‘మోషేకు ఆజ్ఞాపించాడు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: כֵּן עָשׂוּ
  choice: చేశారు
  rationale: כַּאֲשֶׁרతో కలిసిన כֵּן ... עָשׂוּ అనురూప చర్యను తెలుపుతుంది. తెలుగులో ‘ఆజ్ఞాపించినట్టే ... చేశారు’ అనే సమగ్ర నిర్మాణమే ‘అలాగే చేశారు’ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: בְּנוֹת צְלָפְחָד
  choice: సెలోఫెహాదు కుమార్తెలు
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని స్పష్టంగా నిలుపుతూ, వ్యక్తి పేరును ఆధునిక తెలుగు ఉచ్చారణకు తగినట్లుగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల ‘ప్రభువు’ వంటి బిరుదును పెట్టలేదు. తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితమై లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని כַּאֲשֶׁר ... כֵּן అనురూప నిర్మాణాన్ని ‘ఆజ్ఞాపించినట్టే ... చేశారు’గా సహజంగా ప్రతిబింబించాం.
