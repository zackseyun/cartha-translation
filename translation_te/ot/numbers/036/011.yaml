source:
  edition: WLC
  text: וַ/תִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְ/חָגְלָ֧ה וּ/מִלְכָּ֛ה וְ/נֹעָ֖ה בְּנ֣וֹת צְלָפְחָ֑ד לִ/בְנֵ֥י דֹדֵי/הֶ֖ן לְ/נָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: te
  text: సెలొఫెహాదు కుమార్తెలైన మహ్లా, తిర్సా, హొగ్లా, మిల్కా, నోయా తమ తండ్రి సోదరుల కుమారులకు భార్యలయ్యారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: భార్యలయ్యారు
  rationale: హయా క్రియ ఇక్కడ వివాహం ద్వారా ఏర్పడిన కొత్త స్థితిని సూచిస్తుంది. ‘భార్యలయ్యారు’ అనే ప్రయోగం ఆ మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנוֹת צְלָפְחָד
  choice: సెలొఫెహాదు కుమార్తెలైన
  rationale: వంశసంబంధాన్ని స్పష్టంగా, తెలుగు వాక్యనిర్మాణానికి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: తమ తండ్రి సోదరుల కుమారులకు
  rationale: דֹדֵיהֶן ఇక్కడ తండ్రి వంశంలోని సోదరులను సూచిస్తుంది; వారసత్వం తండ్రి గోత్రంలోనే నిలవాలనే సందర్భానికి అనుగుణంగా, అస్పష్టమైన ‘బంధువులు’ కంటే ఈ రూపం ఖచ్చితంగా ఉంటుంది.
- source_word: לְנָשִׁים
  choice: భార్యలయ్యారు
  rationale: వివాహ సూత్రంలో לְנָשִׁים అంటే ‘భార్యలుగా’ అని అర్థం. తెలుగులో ముందు ఉన్న క్రియతో కలిపి ‘భార్యలయ్యారు’ అనడం సహజం.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: మహ్లా, తిర్సా, హొగ్లా, మిల్కా, నోయా
  rationale: హీబ్రూ మూలంలోని పేర్ల క్రమాన్ని నిలిపి, తెలుగులో ఉచ్చరించదగిన లిప్యంతరీకరణలను ఉపయోగించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. బంధుత్వ సంబంధాన్ని ‘తమ తండ్రి సోదరుల కుమారులు’ అని స్పష్టంగా చెప్పి, మూలంలోని తండ్రి వంశ సందర్భాన్ని నిలిపింది.
