id: NUM.36.2
reference: Numbers 36:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ఇశ్రాయేలు కుమారులకు[a] చీటి ద్వారా దేశాన్ని స్వాస్థ్యంగా ఇవ్వమని యాహ్వే నా ప్రభువైన మీకు ఆజ్ఞాపించాడు. అలాగే, మా సహోదరుడైన సెలోపెహాదు స్వాస్థ్యాన్ని అతని కుమార్తెలకు ఇవ్వమని నా ప్రభువైన మీరు యాహ్వే నుండి ఆజ్ఞ పొందారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు సంతతికి” లేదా “ఇశ్రాయేలీయులకు.” హీబ్రూ మూలంలో “ఇశ్రాయేలు కుమారులకు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: ప్రభువైన మీకు
  rationale: ఇది మోషేను గౌరవంగా సంబోధించే మానవ బిరుదు; దైవ బిరుదు కాదు. తెలుగులో ప్రత్యక్ష సంబోధనకు సహజంగా ఉండేలా రెండవ పురుష గౌరవ రూపంతో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: לָתֵת אֶת הָאָרֶץ בְּנַחֲלָה
  choice: దేశాన్ని ... స్వాస్థ్యంగా ఇవ్వాలని
  rationale: దేవుడు కనాను దేశాన్ని వారసత్వ భూభాగంగా అనుగ్రహించడాన్ని సూటిగా, చట్టపరమైన భావం నిలిచేలా వ్యక్తం చేస్తుంది.
- source_word: בְּגוֹרָל
  choice: చీటి ప్రకారం
  rationale: భూమి పంపిణీని నిర్ణయించే సాధనాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘చీటి’ అనే భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని ‘కుమారులు’ అనే పుంలింగ బహువచన రూపాన్ని కాపాడుతూ, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేశాం.
- source_word: צֻוָּה בַיהוָה
  choice: యాహ్వే ... ఆజ్ఞాపించాడు
  rationale: హీబ్రూ కర్మణి నిర్మాణంలోని ఆజ్ఞకు మూలమైన యాహ్వేను తెలుగులో సహజమైన కర్తరి వాక్యంతో స్పష్టంగా వ్యక్తం చేశాం; అర్థాన్ని మార్చలేదు.
- source_word: נַחֲלַת צְלָפְחָד
  choice: సెలోపెహాదు స్వాస్థ్యాన్ని
  rationale: సెలోపెహాదు వంశానికి చెందిన వారసత్వ భూభాగాన్ని సంక్షిప్తమైన న్యాయపర పదబంధంతో తెలుపుతుంది.
- source_word: אָחִינוּ
  choice: మా సహోదరుడైన
  rationale: మూలంలోని కుటుంబసంబంధ భాషను ‘బంధువు’గా వ్యాఖ్యానించకుండా నిలిపింది.
- source_word: לִבְנֹתָיו
  choice: అతని కుమార్తెలకు
  rationale: స్వాస్థ్యాన్ని పొందే వ్యక్తులను మూలానికి నేరుగా అనుగుణంగా సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇచ్చాం.
- issue: לִבְנֵי יִשְׂרָאֵל లోని లింగసూచక సమష్టి భాష
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతతి / ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదరూపంలోని ‘కుమారులు’ను ప్రధాన పాఠంలో నిలిపి, అది సమష్టి ప్రజలను సూచించగలదని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, న్యాయపర సందర్భానికి తగిన శైలి వాడబడింది. మోషేకు వాడిన మానవ గౌరవ బిరుదు దైవ బిరుదుగా అపార్థం కాకుండా ‘ప్రభువైన మీకు’ అని ప్రత్యక్ష సంబోధనలో ఇచ్చాం.
