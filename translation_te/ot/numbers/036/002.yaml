  source_fidelity: మొదటి వాక్యభాగంలో భావం ప్రధానంగా సరియే ఉంది. అయితే రెండవ వాక్యభాగంలో హీబ్రూ కర్మణి నిర్మాణం—మోషే యాహ్వే నుండి ఆజ్ఞ పొందాడు—స్థానంలో యాహ్వే నేరుగా ఆజ్ఞాపించాడనే ఒకే కర్తరి నిర్మాణం వచ్చింది. దీనివల్ల మూలంలోని వాక్యనిర్మాణ భేదం చెరిగింది. అలాగే אֲדֹנִי లోని ‘నా’ అనే స్వామ్యసూచక భావం ప్రధాన పాఠంలో స్పష్టంగా ఉండాలి.
