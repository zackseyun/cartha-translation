- from: ఇశ్రాయేలీయులకు[a] సునాద సంవత్సరం వచ్చినప్పుడు, వారి స్వాస్థ్యం వారు చేరిన గోత్రపు స్వాస్థ్యానికి కలుస్తుంది; అప్పుడు వారి స్వాస్థ్యం మా పితరుల గోత్రపు స్వాస్థ్యం నుండి తగ్గిపోతుంది.
