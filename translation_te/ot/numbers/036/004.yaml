review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Jubilee and the transfer of the daughters’ inheritance between tribal inheritances. However, “వారు చేరిన” presents the relationship as already completed, whereas the Hebrew relative clause is prospective/contextual (“the tribe to which they will belong”). “తగ్గిపోతుంది” communicates diminution but is less exact than the passive removal expressed by יִגָּרַע.
  naturalness: “ఇశ్రాయేలీయులకు సునాద సంవత్సరం” is not a natural Telugu construction. “ఇశ్రాయేలీయులకు యోబేలు సంవత్సరం వచ్చినప్పుడు” is clear and idiomatic in modern standard Telugu. “జతచేయబడుతుంది” and “తీసివేయబడుతుంది” retain the legal-register passive sense naturally.
  terminology: Use “యోబేలు సంవత్సరం” for יוֹבֵל, a clear established biblical term in modern Telugu. “స్వాస్థ్యం” and “గోత్రం” are appropriate for hereditary tribal landholding and tribe. The footnote properly records the literal familial expression without imposing an interpretation.
  issues:
  - severity: medium
    issue: “ఇశ్రాయేలీయులకు సునాద సంవత్సరం” is awkward and “సునాద సంవత్సరం” is less transparent than the established term.
    rationale: The Hebrew refers to the Jubilee; “యోబేలు సంవత్సరం” is the direct, recognizable biblical designation, and the clause needs an idiomatic Telugu subject-and-event construction.
  - severity: medium
    issue: “వారు చేరిన గోత్రపు” changes the temporal force of the relative clause.
    rationale: אֲשֶׁר תִּהְיֶינָה לָהֶם has prospective force in this legal scenario. “వారు చెందే గోత్రపు” preserves that force without adding details about marriage.
  - severity: low
    issue: “తగ్గిపోతుంది” weakens the explicit removal sense.
    rationale: יִגָּרַע is passive and denotes being removed/deducted from the ancestral tribal inheritance. “తీసివేయబడుతుంది” expresses this more precisely.
  revised_text: ఇశ్రాయేలీయులకు[a] యోబేలు సంవత్సరం వచ్చినప్పుడు, వారి స్వాస్థ్యం వారు చెందే గోత్రపు స్వాస్థ్యానికి జతచేయబడుతుంది; వారి స్వాస్థ్యం మా పితరుల గోత్రపు స్వాస్థ్యం నుండి తీసివేయబడుతుంది.
