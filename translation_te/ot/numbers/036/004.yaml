  rationale: 'The revision improves idiomatic modern Telugu while preserving the Hebrew legal argument: when the Jubilee arrives for Israel, the daughters’ inheritance is added to the tribe to which they will belong and removed from their ancestral tribe’s inheritance. It retains the source’s passive legal consequences and the footnote anchor for “sons of Israel.”'
