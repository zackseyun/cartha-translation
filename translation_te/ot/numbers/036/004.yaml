id: NUM.36.4
reference: Numbers 36:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: te
  text: ఇశ్రాయేలీయులకు[a] యోబేలు సంవత్సరం వచ్చినప్పుడు, వారి స్వాస్థ్యం వారు చెందే గోత్రపు స్వాస్థ్యానికి జతచేయబడుతుంది; వారి స్వాస్థ్యం మా పితరుల గోత్రపు స్వాస్థ్యం నుండి తీసివేయబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులకు”; భావార్థంగా, “ఇశ్రాయేలీయులకు” లేదా “ఇశ్రాయేలు ప్రజలకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: వచ్చినప్పుడు
  rationale: ఈ న్యాయపరమైన వాదనలో సునాద సంవత్సరాన్ని ఎదురుచూస్తున్న సంభావ్య సందర్భంగా సూచిస్తుంది. షరతు ఛాయ ఉన్నప్పటికీ, సహజమైన తెలుగులో కాలసూచకంగా అనువదించడం సందర్భబలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַיֹּבֵל
  choice: సునాద సంవత్సరం
  rationale: యోబేలు సంవత్సరాన్ని సూచించే స్థిరమైన బైబిలు పదబంధం; కేవలం లిప్యంతరీకరణకన్నా సాధారణ పాఠకునికి భావాన్ని కొంత స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులకు’; ఇక్కడ మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే జాతివాచక ప్రయోగం కావడంతో సహజమైన ఆధునిక తెలుగు రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְנוֹסְפָה
  choice: కలుస్తుంది
  rationale: నిఫాల్ రూపం ఒక స్వాస్థ్యం మరొక గోత్రపు స్వాస్థ్యానికి జతకావడం అనే ఫలితాన్ని తెలియజేస్తుంది.
- source_word: נַחֲלָתָן
  choice: వారి స్వాస్థ్యం
  rationale: స్త్రీలైన కుమార్తెలకు చెందిన వంశపారంపర్య భూభాగాన్ని సూచిస్తుంది; ‘వారి’ అనే రూపం తెలుగులో సహజంగా ఉండి మూలంలోని స్త్రీ బహువచన సూచనను సందర్భం ద్వారా నిలుపుతుంది.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: గోత్రపు స్వాస్థ్యానికి
  rationale: יסף తో వచ్చిన עַל ఇక్కడ ఒక భూవాటా మరొకదానికి జతకావడాన్ని సూచిస్తుంది; ‘గోత్రం’ భూవిభజన సందర్భానికి తగిన పదం.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: వారు చేరిన
  rationale: కుమార్తెలు వివాహం ద్వారా ఏ గోత్రానికి సంబంధించినవారవుతారో ఆ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని సంబంధ సూచనను అతిగా వివరించదు.
- source_word: מַטֵּה אֲבֹתֵינוּ
  choice: మా పితరుల గోత్రం
  rationale: వక్తల పూర్వీకుల గోత్రాన్ని నేరుగా సూచిస్తూ కుటుంబ-గోత్ర న్యాయ నేపథ్యాన్ని నిలుపుతుంది.
- source_word: יִגָּרַע
  choice: తగ్గిపోతుంది
  rationale: నిఫాల్ రూపం తగ్గించబడటం లేదా కోల్పోవడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ ఒక గోత్రపు భూవాటా మరొక గోత్రానికి మారడం వల్ల మొదటి వాటా తగ్గిపోవడాన్ని తెలియజేస్తుంది.
