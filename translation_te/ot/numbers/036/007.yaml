source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల స్వాస్థ్యం ఒక గోత్రం నుండి మరొక గోత్రానికి మారకూడదు; ఎందుకంటే ఇశ్రాయేలు కుమారులు ప్రతి ఒక్కరూ తన పితరుల గోత్ర స్వాస్థ్యాన్ని అంటిపెట్టుకొని ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: మారకూడదు
  rationale: ఈ సందర్భంలో స్వాస్థ్యం భౌతికంగా తిరగడం కాదు, ఒక గోత్రపు అధీనంనుంచి మరో గోత్రపు అధీనానికి మారడాన్ని సూచిస్తుంది. ‘మారకూడదు’ న్యాయపరమైన నిషేధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యం
  rationale: ఇక్కడ ఇది ఇశ్రాయేలు గోత్రాలకు పితృపారంపర్యంగా కేటాయించబడిన భూభాగాన్ని సూచించే న్యాయపరమైన పదం. ‘స్వాస్థ్యం’ ఆ వారసత్వ ఆస్తి భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: ఒక గోత్రం నుండి మరొక గోత్రానికి
  rationale: ఈ భూవిభజన సందర్భంలో מַטֶּה అంటే ‘గోత్రం’. తెలుగులో పూర్తి రూపం భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ వంశావళి-నిబంధనాత్మక వ్యక్తీకరణలోని పుంలింగ రూపాన్ని నిలుపుతూ, పదబంధాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כִּי
  choice: కాబట్టి ... ;
  rationale: మొదటి వాక్యం సందర్భంలోని ఆజ్ఞకు ఫలితాన్ని తెలియజేస్తుండగా, తరువాతి భాగం దానికి ఆధారమైన బాధ్యతను చెబుతుంది. తెలుగులో ‘కాబట్టి’ మరియు అర్ధవిరామం ఈ తార్కిక అనుసంధానాన్ని సహజంగా మోస్తాయి.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఇక్కడ אִישׁ పంపిణీయ భావంతో ప్రతి ఇశ్రాయేలీయుని వ్యక్తిగత బాధ్యతను సూచిస్తుంది. ‘ప్రతి ఒక్కరూ’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יִדְבְּקוּ
  choice: అంటిపెట్టుకొని ఉండాలి
  rationale: דבק దృఢంగా హత్తుకొని లేదా అనుబంధంగా ఉండే భావాన్ని ఇస్తుంది. ఈ న్యాయ సందర్భంలో స్వగోత్ర స్వాస్థ్యంతో స్థిరంగా అనుబంధమై ఉండాలనే భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: తమ పితరుల గోత్ర స్వాస్థ్యాన్నే
  rationale: ‘పితరులు’, ‘గోత్రం’, ‘స్వాస్థ్యం’ అనే మూడు అంశాలను నిలుపుతుంది. సమూహ కర్తకు అనుగుణంగా తెలుగు ప్రతిబింబ సర్వనామం ‘తమ’ వాడబడింది; ‘-నే’ దృఢ అనుబంధాన్ని సహజంగా బలపరుస్తుంది.
theological_decisions:
- issue: సామూహిక న్యాయ ప్రకటనలో లింగం మరియు వంశావళి భాష
  choice: ఇశ్రాయేలు కుమారులు ... ప్రతి ఒక్కరూ ... తమ పితరుల
  alternative: ఇశ్రాయేలీయులు ... ప్రతి వ్యక్తి ... తమ పూర్వీకుల
  rationale: మూలంలోని בְּנֵי, אִישׁ, אֲבֹתָיו అనే పుంలింగ-వంశావళి పదాలను పూర్తిగా లింగతటస్థం చేయకుండా నిలుపుతుంది. అయితే אִישׁ యొక్క పంపిణీయ కార్యాన్ని సహజ తెలుగులో ‘ప్రతి ఒక్కరూ’గా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘స్వాస్థ్యం’, ‘గోత్రం’, ‘పితరులు’ వంటి స్థిరమైన బైబిలు పదజాలం ఉపయోగించబడింది.
