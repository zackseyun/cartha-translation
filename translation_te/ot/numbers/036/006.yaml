source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: te
  text: 'యెహోవా సెలోఫెహాదు కుమార్తెల విషయంగా ఆజ్ఞాపించిన మాట ఇదే: “తమకు నచ్చిన ఎవరినైనా వారు పెళ్లి చేసుకోవచ్చు[a]; కానీ తమ తండ్రి గోత్రపు కుటుంబానికి చెందినవారినే వారు పెళ్లి చేసుకోవాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ దృష్టికి మంచివాడనిపించిన వాణ్ణి.” హీబ్రూ నుడికారం అక్షరార్థంగా “వారి కళ్లలో మంచివాడు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ తండ్రి గోత్రంలోని కులశాఖకు చెందినవారినే.” హీబ్రూలో ‘కుటుంబం/కులశాఖ,’ ‘గోత్రం’ అనే రెండు పదాలూ ఉన్నాయి; వారసత్వం పితృగోత్ర పరిధిలోనే ఉండాలనే విషయాన్ని అవి నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: ఆజ్ఞాపించిన మాట ఇదే
  rationale: דָּבָר అంటే ‘మాట,’ ‘విషయం,’ లేదా ‘కార్యం’ కావచ్చు. ఇక్కడ అది అధికారపూర్వకమైన దైవ ఆదేశాన్ని పరిచయం చేస్తుంది; ‘మాట’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: צִוָּה יְהוָה
  choice: యెహోవా ... ఆజ్ఞాపించిన
  rationale: צוה స్పష్టంగా ఆజ్ఞాపించడాన్ని సూచిస్తుంది. יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: సెలోఫెహాదు కుమార్తెల విషయంగా
  rationale: ל ఇక్కడ ఆజ్ఞ ఎవరికి సంబంధించినదో సూచిస్తుంది. ‘విషయంగా’ అనే రూపం ఆ ఆదేశం వారి వివాహానికి సంబంధించినదని స్పష్టం చేస్తుంది.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: తమ దృష్టికి మంచివాడనిపించిన వాణ్ణి
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘వారి కళ్లలో మంచివాడు’ అని ఉంటుంది. తెలుగు పాఠకునికి సహజంగా ఉండేలా ‘తమ దృష్టికి మంచివాడనిపించిన’ అని ఇచ్చి, ఎంపిక కుమార్తెలదేననే భావాన్ని నిలిపాం.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: వారు పెళ్లి చేసుకోవచ్చు / పెళ్లి చేసుకోవాలి
  rationale: అక్షరార్థం ‘భార్యలుగా ఉండాలి.’ మొదటి సందర్భంలో అనుమతి, పునరుక్తమైన రెండో సందర్భంలో పరిమితితో కూడిన బాధ్యత వ్యక్తమవుతున్నందున తెలుగులో వరుసగా ‘చేసుకోవచ్చు,’ ‘చేసుకోవాలి’ అని సహజంగా వ్యక్తీకరించాం.
- source_word: אַךְ
  choice: అయితే
  rationale: אַךְ ఇక్కడ ముందున్న స్వేచ్ఛకు పరిమితి విధిస్తుంది. ‘అయితే’ ఆ నియంత్రణను సహజంగా పరిచయం చేస్తుంది.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: తమ తండ్రి గోత్రంలోని వంశానికి చెందినవాణ్ణే
  rationale: మూలంలో מִשְׁפָּחָה (వంశం/కులశాఖ), מַטֶּה (గోత్రం) రెండూ ఉన్నాయి. ‘గోత్రంలోని వంశం’ రెండింటినీ వేరుగా నిలిపి, పితృగోత్ర పరిధిలోనే వివాహం జరగాలనే నియమాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఇచ్చాం.
- issue: వివాహ ఎంపికలో స్వేచ్ఛ మరియు గోత్రపరమైన పరిమితి
  choice: ఎంపికకు అనుమతిని, పితృగోత్ర వంశంలోనే వివాహం చేసుకోవాలనే పరిమితిని రెండింటినీ స్పష్టంగా నిలిపాం
  alternative: పరిమితిని మాత్రమే ముందుకు తెచ్చి స్వేచ్ఛను తగ్గించడం
  rationale: వాక్యం మొదట కుమార్తెల ఎంపికను అనుమతించి, אַךְ ద్వారా దానికి పరిమితి విధిస్తుంది. ఈ ఉద్రిక్తతను పరిష్కరించకుండా రెండూ అనువాదంలో ప్రతిఫలించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పెళ్లి చేసుకోవచ్చు/చేసుకోవాలి’ అనే సహజ రూపాలు అనుమతి మరియు విధి మధ్య తేడాను స్పష్టం చేస్తాయి. ‘గోత్రం,’ ‘వంశం’ అనే సుపరిచిత పదాలతో మూలంలోని సామాజిక నిర్మాణ భేదాన్ని కాపాడాం.
