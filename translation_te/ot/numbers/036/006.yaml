revisions:
- from: 'యెహోవా సెలోఫెహాదు కుమార్తెల విషయంగా ఆజ్ఞాపించిన మాట ఇదే: “తమ దృష్టికి మంచివాడనిపించిన వాణ్ణి వారు పెళ్లి చేసుకోవచ్చు[a]. అయితే తమ తండ్రి గోత్రంలోని వంశానికి చెందినవాణ్ణే వారు పెళ్లి చేసుకోవాలి[b].”'
  to: 'యెహోవా సెలోఫెహాదు కుమార్తెల విషయంగా ఆజ్ఞాపించిన మాట ఇదే: “తమకు నచ్చిన ఎవరినైనా వారు పెళ్లి చేసుకోవచ్చు[a]; కానీ తమ తండ్రి గోత్రపు కుటుంబానికి చెందినవారినే వారు పెళ్లి చేసుకోవాలి[b].”'
  rationale: సవరణలు అర్థాన్ని మార్చవు. మొదటి భాగంలో హీబ్రూ నుడికారానికి సమానమైన, సహజమైన తెలుగు వ్యక్తీకరణను వాడాం; రెండో భాగంలో పరిమితి సూచకమైన אַךְ ను ‘కానీ’గా స్పష్టం చేశాం. ‘కుటుంబం’ మరియు ‘గోత్రం’ రెండింటినీ నిలుపుతూ, సంబంధ పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా మార్చాం. పాదటిప్పణి గుర్తులను వాటి నిజమైన సంబంధిత పదబంధాలకు అనుసంధానించాం.
  reviewer_model: gpt-5.6-terra
