review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional marriage scenario, the removal of the women's inheritance from the speakers' ancestral inheritance, its addition to another tribe, and the consequent loss from the speakers' allotted share. However, “వారు చేరే గోత్రం” can make the women themselves the primary referent of the relative clause and is less precise than the Hebrew, which identifies the tribe of the men to whom they become wives. The final phrase is also clearer when the allotment-by-lot sense is expressed as a modifier of “వాటా.”
  naturalness: The Telugu is generally modern and readable. “చీటి వాటా” is somewhat compressed and can sound like a type of lottery share rather than a land portion assigned by lot. “చీటి ద్వారా కేటాయించబడిన ... వాటా” is more idiomatic and explicit in this legal land-allotment context.
  terminology: “స్వాస్థ్యం” consistently renders נַחֲלָה well in context. “పితరులు” appropriately preserves the ancestral/legal register. “ఇశ్రాయేలీయుల గోత్రాల కుమారులు” is a natural modern Telugu rendering of the layered Hebrew expression without losing its tribal sense.
  issues:
  - severity: medium
    issue: The phrase “వారు చేరే గోత్రపు” does not explicitly identify the tribe as that of the men whom the women marry.
    rationale: אֲשֶׁר תִּהְיֶינָה לָהֶם refers to the men/tribe to whom the women become wives. “వారు భార్యలయ్యే గోత్రం” retains this relationship clearly and avoids an imprecise general idea of joining a tribe.
  - severity: low
    issue: “మా స్వాస్థ్యపు చీటి వాటా” is not the clearest Telugu expression for a portion assigned by lot.
    rationale: גוֹרָל means lot and, contextually, the allocation made by lot. Stating “చీటి ద్వారా కేటాయించబడిన ... వాటా” clearly preserves both the literal and contextual sense.
  revised_text: వారు ఇశ్రాయేలీయుల గోత్రాల కుమారుల్లో ఒకరికి భార్యలైతే, వారి స్వాస్థ్యం మా పితరుల స్వాస్థ్యం నుండి తీసివేయబడి, వారు భార్యలయ్యే గోత్రపు స్వాస్థ్యానికి చేర్చబడుతుంది. అప్పుడు మా స్వాస్థ్యానికి చీటి ద్వారా కేటాయించబడిన వాటా నుండి అది తీసివేయబడుతుంది.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “మా స్వాస్థ్యపు చీటి నుండి.” ఇక్కడ “చీటి” అనేది చీటి వేయడం ద్వారా కేటాయించబడిన వాటాను సూచిస్తుంది.
    reason: lexical_alternative
