source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: te
  text: వారు ఇశ్రాయేలీయుల గోత్రాల కుమారుల్లో ఒకరికి భార్యలైతే, వారి స్వాస్థ్యం మా పితరుల స్వాస్థ్యం నుండి తీసివేయబడి, వారు భార్యలయ్యే గోత్రపు స్వాస్థ్యానికి చేర్చబడుతుంది. అప్పుడు మా స్వాస్థ్యానికి చీటి ద్వారా కేటాయించబడిన వాటా నుండి అది తీసివేయబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా స్వాస్థ్యపు చీటి నుండి.” ఇక్కడ “చీటి” అనేది చీటి వేయడం ద్వారా కేటాయించబడిన వాటాను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: భార్యలైతే
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘భార్యలవుతారు/అవుతే’ అని ఉన్నా, సందర్భంలోని సంభావ్య పరిస్థితిని తెలుగులో సహజంగా షరతు రూపంలో తెలిపింది.
- source_word: מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల కుమారుల్లో
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారుల గోత్రాల కుమారులు’ అనే పొరలుగల వంశ-గోత్ర భావాన్ని అతిగా కఠినంగా కాకుండా, కుమారులనే సూచనను నిలిపి సహజ తెలుగులో ఇచ్చింది.
- source_word: וְנִגְרְעָה נַחֲלָתָן
  choice: వారి స్వాస్థ్యం ... తీసివేయబడి
  rationale: גרע నిఫల్ రూపం ఇక్కడ కేవలం తగ్గుదలకన్నా ఒక గోత్రపు ఆస్తి నుండి పోవడాన్ని సూచిస్తుంది; ‘తీసివేయబడి’ ఆ నష్టాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: మా పితరుల స్వాస్థ్యం నుండి
  rationale: ‘పితరులు’ మూలంలోని אבות అనే పురుష పూర్వీకుల సూచనను, గోత్ర వారసత్వ నిరంతరతను కాపాడుతుంది.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: గోత్రపు స్వాస్థ్యానికి కలుస్తుంది
  rationale: మరొక గోత్రపు భూవారసత్వానికి ఆ భాగం జతకావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: వారు చేరే
  rationale: వివాహం వల్ల స్త్రీలు భర్తల గోత్ర సంబంధంలోకి రావడాన్ని సంక్షిప్తంగా తెలుపుతుంది; యాజమాన్యార్థాన్ని అనవసరంగా బలపరచదు.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: మా స్వాస్థ్యపు చీటి వాటా నుండి
  rationale: גורל యొక్క అక్షరార్థమైన ‘చీటి’ని, సందర్భార్థమైన ‘కేటాయించబడిన వాటా’ను రెండింటినీ కలిపి భూవిభజన భావాన్ని స్పష్టం చేసింది.
