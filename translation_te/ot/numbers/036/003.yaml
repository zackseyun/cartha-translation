  to: వారు ఇశ్రాయేలీయుల గోత్రాల కుమారుల్లో ఒకరికి భార్యలైతే, వారి స్వాస్థ్యం మా పితరుల స్వాస్థ్యం నుండి తీసివేయబడి, వారు భార్యలయ్యే గోత్రపు స్వాస్థ్యానికి చేర్చబడుతుంది. అప్పుడు మా స్వాస్థ్యానికి చీటి ద్వారా కేటాయించబడిన వాటా నుండి అది తీసివేయబడుతుంది.[a]
