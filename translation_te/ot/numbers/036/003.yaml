  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గోత్ర-భూవారసత్వ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. కీలక పదమైన נַחֲלָהను అంతటా ‘స్వాస్థ్యం’గా ఏకరీతిగా అనువదించాం.
