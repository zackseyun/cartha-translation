- from: ఇశ్రాయేలు కుమారుల[b] గోత్రాల్లో వారసత్వ స్వాస్థ్యం కలిగిన[a] ప్రతి కుమార్తె, తన తండ్రి గోత్రంలోని వంశానికి[c] చెందిన ఒకనికి భార్య కావాలి. అప్పుడు ఇశ్రాయేలు కుమారుల్లో ప్రతి ఒక్కరూ తమ పితరుల స్వాస్థ్యాన్ని కలిగి ఉంటారు[d].
  to: ఇశ్రాయేలు కుమారుల[b] గోత్రాలకు చెందిన, వారసత్వ స్వాస్థ్యం కలిగిన[a] ప్రతి కుమార్తె తన తండ్రి గోత్రంలోని వంశానికి[c] చెందిన ఒకరికి భార్య కావాలి; అప్పుడు ఇశ్రాయేలు కుమారుల్లో ప్రతి ఒక్కరు తన పితరుల స్వాస్థ్యాన్ని కలిగి ఉండునట్లు[d].
  rationale: మూలంలోని ఉద్దేశ్య సూచక నిర్మాణం లְמַעַן יִירְשׁוּను తెలుగులో ‘కలిగి ఉండునట్లు’గా సవరించాం. అలాగే אִישׁ యొక్క వ్యక్తిగత పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరు తన’గా స్పష్టపరిచాం. మిగతా పదజాలం మూలంలోని గోత్ర, వంశ, భూవారసత్వ న్యాయపరమైన భేదాలను కాపాడుతుంది.
