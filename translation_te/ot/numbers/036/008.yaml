id: NUM.36.8
reference: Numbers 36:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల[b] గోత్రాలకు చెందిన, వారసత్వ స్వాస్థ్యం కలిగిన[a] ప్రతి కుమార్తె తన తండ్రి గోత్రంలోని వంశానికి[c] చెందిన ఒకరికి భార్య కావాలి; అప్పుడు ఇశ్రాయేలు కుమారుల్లో ప్రతి ఒక్కరు తన పితరుల స్వాస్థ్యాన్ని కలిగి ఉండునట్లు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారసత్వ స్వాస్థ్యాన్ని పొందే’; హీబ్రూ కృదంతం ఆమె వారసురాలిగా ఉన్న స్థితిని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తన తండ్రి గోత్రంలోని కుటుంబానికి’; ఇక్కడ హీబ్రూ పదం గోత్రంలోపలి విస్తృత బంధుత్వ సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘ప్రతి ఒక్కరు తన పితరుల స్వాస్థ్యాన్ని వారసత్వంగా పొందునట్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: వారసత్వ స్వాస్థ్యం కలిగిన
  rationale: హీబ్రూ వర్తమాన కృదంతం ఆ కుమార్తె వారసురాలిగా ఉన్న స్థితిని సూచించగలదు. తెలుగు సహజత్వం కోసం ‘స్వాస్థ్యాన్ని వారసత్వంగా పొందుతున్న’ అనే క్రియాత్మక రూపం కంటే ఈ స్థితి-కేంద్రీకృత రూపం ఎంచుకోబడింది.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గోత్రాల్లో
  rationale: מַטֶּה ఇక్కడ గోత్ర విభాగాన్ని సూచిస్తుంది. בְּנֵי יִשְׂרָאֵל యొక్క లింగసూచక, ఒడంబడిక సంబంధమైన మూలరూపాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలిపింది.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: తన తండ్రి గోత్రంలోని వంశానికి చెందిన
  rationale: מִשְׁפָּחָה గోత్రంలోపలి బంధుత్వ సమూహాన్ని సూచిస్తుంది. ‘వంశం’ ఆధునిక తెలుగులో ‘కుటుంబం’ కంటే ఈ విస్తృత కులబంధ నిర్మాణాన్ని మెరుగ్గా తెలియజేస్తుంది.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: భార్య కావాలి
  rationale: అక్షరార్థంగా ‘భార్యగా ఉండాలి’ అనే న్యాయపరమైన ఆజ్ఞను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִירְשׁוּ ... אִישׁ
  choice: ప్రతి ఒక్కరూ ... కలిగి ఉంటారు
  rationale: ירשׁ ఇక్కడ పూర్వీకుల భూస్వాస్థ్యాన్ని ఆధీనంలో నిలుపుకోవడం అనే భావాన్ని కలిగి ఉంది; אִישׁ యొక్క పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరూ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: తమ పితరుల స్వాస్థ్యం
  rationale: ‘పితరులు’ మూలంలోని పితృవంశ న్యాయ నిర్మాణాన్ని నిలుపుతుంది; ‘స్వాస్థ్యం’ వారసత్వంగా సంక్రమించే భూహక్కును సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: లింగసూచక ఒడంబడిక మరియు వారసత్వ భాష
  choice: ‘ఇశ్రాయేలు కుమారులు’ మరియు ‘పితరులు’ అనే రూపాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు’ మరియు ‘పూర్వీకులు’
  rationale: ఈ వచనం పితృవంశ ఆధారిత గోత్ర భూవారసత్వ నియమాన్ని వివరిస్తుంది. అందువల్ల మూలంలోని పురుషలింగ రూపాలు కేవలం సాధారణ వ్యాకరణ రూపాలు కాక, చెప్పబడుతున్న న్యాయ నిర్మాణంలో భాగం; వాటిని లింగతటస్థంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన గంభీరతను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘గోత్రం,’ ‘వంశం,’ ‘స్వాస్థ్యం’ అనే పదాలు వరుసగా tribal unit, clan-level kinship group, inherited landholding మధ్య తేడాను కాపాడుతాయి.
