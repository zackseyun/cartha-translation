id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: te
  text: “శ్వాసల శ్వాస[a],” అని కోహెలెత్[b] అంటున్నారు, “శ్వాసల శ్వాస; అంతా వట్టి శ్వాసే.”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: హీబ్రూ הֶבֶל (హెవెల్) పదానికి అక్షరార్థంగా ‘శ్వాస’ లేదా ‘ఆవిరి’ అని అర్థం. ప్రసంగి గ్రంథంలో ఈ పదం 38 సార్లు వస్తుంది; క్షణికత్వం, పట్టుకోలేనితనం, ఆశించినదానికీ జరిగేదానికీ మధ్యనున్న వ్యంగ్యమైన అసమతుల్యత అనే పరస్పర సంబంధిత భావాలను ఇది సూచిస్తుంది. ఒక్క తెలుగు పదం ఈ మూడింటినీ పూర్తిగా వ్యక్తం చేయదు. అందుకే ఇక్కడ మూర్తమైన రూపకాన్ని నిలుపుతూ నిర్మాణంలో ‘శ్వాసల శ్వాస,’ చివర ‘వట్టి శ్వాస’ అని అనువదించాం. హీబ్రూ הֲבֵל הֲבָלִים అనేది ‘పాటల పాట’ లేదా ‘పరిశుద్ధ స్థలాల పరిశుద్ధ స్థలం’ వంటి అత్యుత్తమతను సూచించే నిర్మాణం.
    reason: Clarifies the full semantic range documented in the audit trail and explains the superlative without narrowing it to particular senses.
lexical_decisions:
- source_word: הֶבֶל (hevel)
  choice: శ్వాస
  rationale: ఈ హీబ్రూ పదానికి అక్షరార్థంగా ‘శ్వాస’ లేదా ‘ఆవిరి’ అనే భావం ఉంది. ప్రసంగి గ్రంథమంతటా ఇది క్షణికత్వం, పట్టుకోలేని స్వభావం, ఆశించినదానికీ జరిగినదానికీ మధ్య వ్యత్యాసం అనే పరస్పర సంబంధిత భావాలను మోస్తుంది. ‘వ్యర్థం’ లేదా ‘అర్థరహితం’ వంటి నైరూప్య పదాలు వాటిలో ఒక్క భావాన్నే ముందుకు తెస్తాయి; ‘శ్వాస’ మూలంలోని సజీవ దృశ్యాన్ని, ఉద్దేశపూర్వకమైన బహుఅర్థత్వాన్ని నిలుపుతుంది.
- source_word: הֲבֵל הֲבָלִים
  choice: శ్వాసల శ్వాస
  rationale: నిర్మాణం ‘పాటల పాట’, ‘పరిశుద్ధ స్థలాల పరిశుద్ధ స్థలం’ వంటి హీబ్రూ అత్యుత్తమతా ప్రయోగం. ‘శ్వాసల శ్వాస’ దాని రూపాన్నీ, తీవ్రతనూ, concrete imageనూ నిలుపుతుంది.
- source_word: קֹהֶלֶת
  choice: కోహెలెత్
  rationale: ఈ హీబ్రూ బిరుదు/పేరు యొక్క భావపరిధి ఖచ్చితంగా ఒకే విధంగా నిర్ణయించలేం. ‘బోధకుడు’, ‘ప్రసంగి’, ‘సభను సమకూర్చేవారు’ అనే అనువాదాల్లో ప్రతి ఒక్కటి భావాన్ని కొంత సంకుచితం చేస్తుంది; అందుచేత ధ్వన్యనువాదం ఉపయోగించబడింది.
- source_word: הַכֹּל הָבֶל
  choice: అంతా వట్టి శ్వాసే
  rationale: הַכֹּל యొక్క సమగ్రతను ‘అంతా’ సహజంగా తెలియజేస్తుంది. విధేయ స్థానంలో ‘వట్టి’ చేర్చడం వల్ల ఇది పదార్థ స్వరూపం గురించిన నిర్వచనంలా కాక, హీబ్రూ సందర్భంలోని తగ్గించి చూపే మూల్యాంకన తీర్పుగా వినిపిస్తుంది.
- source_word: אָמַר
  choice: అంటున్నారు
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినా, సాహిత్య ప్రకటన సూత్రంలో వర్తమాన కాలం తెలుగు పాఠకుడికి సహజంగా, సజీవంగా ఉంటుంది. ‘అంటున్నారు’ గౌరవప్రదమైనదిగా ఉండి, అనవసరంగా వక్త లింగాన్ని ముందుకు తేవదు.
theological_decisions:
- issue: ప్రసంగి గ్రంథంలోని ప్రధాన రూపకమైన הֶבֶל ను ఎలా అనువదించాలి
  choice: మూర్తమైన రూపకాన్ని నిలుపుతూ ‘శ్వాసల శ్వాస’ మరియు ‘వట్టి శ్వాస’ అని అనువదించడం
  alternative: వ్యర్థం; అర్థరహితం; నిష్ఫలం; మాయ; ఆవిరి
  rationale: మూలపదం క్షణికమైనది, అందనిది, మన అంచనాలను తలకిందులు చేసేది అనే భావాలను ఒకేసారి తెరపై ఉంచుతుంది. ‘అర్థరహితం’ సంపూర్ణ నిరర్థకతను అనవసరంగా నిర్ణయిస్తుంది; ‘వ్యర్థం’ లక్ష్యవిఫలత వైపు భావాన్ని కుదిస్తుంది. ‘శ్వాస’ మూలంలోని బహుఅర్థ రూపకాన్ని పాఠ్యసందర్భమే అభివృద్ధి చేయనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సులభంగా చదవగలిగేలా, అయితే కవితాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. ‘శ్వాసల శ్వాస’ అనే ఉద్దేశపూర్వకంగా అసాధారణమైన నిర్మాణం హీబ్రూ అత్యుత్తమతా రూపాన్ని ప్రతిబింబిస్తుంది. ‘వట్టి’ సాధారణ పాఠకునికి తీర్పు యొక్క దిగజార్చే స్వరాన్ని స్పష్టంచేస్తుంది; మూలంలోని బహుఅర్థత్వాన్ని మాత్రం ఒకే నైరూప్య వ్యాఖ్యానంగా మూసివేయదు.
