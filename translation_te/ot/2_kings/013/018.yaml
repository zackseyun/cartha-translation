source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר קַ֥ח הַ/חִצִּ֖ים וַ/יִּקָּ֑ח וַ/יֹּ֤אמֶר לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ הַךְ אַ֔רְצָ/ה וַ/יַּ֥ךְ שָֽׁלֹשׁ פְּעָמִ֖ים וַֽ/יַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: te
  text: అప్పుడు అతడు, “బాణాలను తీసుకో” అన్నాడు; రాజు వాటిని తీసుకున్నాడు. అతడు ఇశ్రాయేలు రాజుతో, “నేలను కొట్టు” అన్నాడు. రాజు మూడుసార్లు కొట్టి ఆపేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిలిచిపోయాడు”; హీబ్రూ క్రియకు అక్షరార్థంగా “నిలిచాడు” అని అర్థం. ఇక్కడ అది మూడుసార్లు కొట్టిన తర్వాత ఆ చర్యను ఆపాడనే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: బాణాలను తీసుకో
  rationale: ఆజ్ఞార్థక క్రియను, నిర్దిష్ట బహువచన నామవాచకాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וַיִּקָּח
  choice: రాజు వాటిని తీసుకున్నాడు
  rationale: హీబ్రూలో కర్త సందర్భం ద్వారా తెలుస్తుంది; తెలుగులో గందరగోళం రాకుండా ‘రాజు’ అని స్పష్టం చేసి, ముందున్న బాణాలను సూచించేందుకు ‘వాటిని’ చేర్చబడింది.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుతో
  rationale: ప్రత్యక్ష సంభాషణకు సహజమైన తెలుగు నిర్మాణం; మూలంలోని రాజ బిరుదును యథాతథంగా ఉంచుతుంది.
- source_word: הַךְ אַרְצָה
  choice: నేలను కొట్టు
  rationale: נכה యొక్క బలమైన చర్యను ‘కొట్టు’ సహజంగా తెలియజేస్తుంది; אַרְצָה ఇక్కడ క్రిందనున్న నేలను సూచిస్తుంది. ‘బాణం వేయి’ అని అనువదించడం మూలంలో స్పష్టంగా లేని విధానాన్ని చేర్చుతుంది.
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: మూడుసార్లు కొట్టి
  rationale: ఆజ్ఞలోని క్రియతో పదసంబంధాన్ని నిలిపి, సంఖ్యా వ్యక్తీకరణను సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיַּעֲמֹד
  choice: ఆపేశాడు
  rationale: క్రియ యొక్క అక్షరార్థం ‘నిలిచాడు’; పునరావృతంగా కొట్టిన చర్య తరువాత ఇక్కడ సందర్భానుసారంగా ‘ఆపేశాడు’ అనే భావం వస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. వరుసగా వచ్చే అస్పష్టమైన ‘అతడు’ సూచనలను నివారించేందుకు అవసరమైన చోట ‘రాజు’ అని సందర్భానుసారంగా స్పష్టం చేయబడింది; మూలంలో లేని బాణం ప్రయోగ విధానాన్ని చేర్చలేదు.
