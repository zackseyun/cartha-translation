source:
  edition: WLC
  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: te
  text: అప్పుడు యెహోయాహాజు యాహ్వే అనుగ్రహాన్ని వేడుకున్నాడు[a]; యాహ్వే అతని మొర ఆలకించాడు, ఎందుకంటే అరాము రాజు వారిని అణచివేస్తున్నందున ఇశ్రాయేలు అనుభవిస్తున్న అణచివేతను ఆయన చూశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేను బతిమాలుకున్నాడు.” అక్షరార్థంగా, “యాహ్వే ముఖాన్ని వేడుకున్నాడు”; ఇది ఆయన అనుగ్రహాన్ని కోరడమనే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “అరాము” హీబ్రూ పేరు; పాత అనువాదాల్లో దీనిని తరచుగా “సిరియా” అని పేర్కొన్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: యాహ్వే అనుగ్రహాన్ని వేడుకున్నాడు
  rationale: חלה את־פני అనే నుడికారం ఒకరి అనుగ్రహాన్ని కోరుతూ వేడుకోవడాన్ని సూచిస్తుంది. ‘ముఖాన్ని మృదువుచేశాడు’ అనే అక్షరార్థం తెలుగులో సహజం కాదు; ఈ అనువాదం వేడుకోలు, అనుగ్రహాన్వేషణ అనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: అతని మొర ఆలకించాడు
  rationale: שמע אל కేవలం శబ్దం వినడంకన్నా శ్రద్ధగా వినడం అనే భావం ఇస్తుంది. సందర్భంలో యెహోయాహాజు చేసిన వేడుకోలే సూచితం కావడంతో ‘మొర’ సహజంగా ఉంది; అయితే దేవుడు ఏ నిర్దిష్ట చర్య తీసుకున్నాడని ఈ పదబంధం అతిగా చెప్పదు.
- source_word: לַחַץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అనుభవిస్తున్న అణచివేత
  rationale: לַחַץ శత్రు రాజు కలిగించిన ఒత్తిడి, పీడన లేదా అణచివేతను సూచిస్తుంది. తరువాత అదే మూలం నుంచి వచ్చిన క్రియతో ఉన్న పదప్రయోగ సంబంధాన్ని ‘అణచివేత/అణచివేస్తుండగా’ ద్వారా సాధ్యమైనంతగా నిలిపాం.
- source_word: כִּי לָחַץ אֹתָם
  choice: ఇశ్రాయేలీయులను అణచివేస్తుండగా
  rationale: ఈ క్రియ కొనసాగుతున్న పీడన పరిస్థితిని వర్ణిస్తుంది. ‘వారిని’ అనే సర్వనామానికి తెలుగు పాఠకుడు సులభంగా గ్రహించే సూచ్యార్థంగా ‘ఇశ్రాయేలీయులను’ వాడాం.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: אֲרָם అనే హీబ్రూ స్థలనామాన్ని తరువాతి కాలపు ‘సిరియా’ అనే పేరుతో మార్చకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాని ప్రత్యేకతను నిలుపుతూ ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: וַיְחַל אֶת־פְּנֵי יְהוָה లో దేవునికి చేసిన విజ్ఞప్తి
  choice: యాహ్వే అనుగ్రహాన్ని వేడుకున్నాడు
  alternative: యాహ్వేను బతిమాలుకున్నాడు; యాహ్వే ముఖాన్ని ప్రసన్నం చేశాడు
  rationale: ఈ నుడికారం దేవుని అనుగ్రహం కోరుతూ చేసిన విజ్ఞప్తిని తెలియజేస్తుంది. దేవుని స్వభావంలో మార్పు వచ్చిందని లేదా ఏదైనా ప్రాయశ్చిత్త క్రియ జరిగిందని మూలపాఠం కంటే ఎక్కువగా చెప్పకుండా అనువదించాం.
- issue: וַיִּשְׁמַע אֵלָיו లో దేవుని స్పందన
  choice: యాహ్వే అతని మొర ఆలకించాడు
  alternative: యాహ్వే అతని మాట విన్నాడు; యాహ్వే అతనికి జవాబిచ్చాడు
  rationale: ‘ఆలకించాడు’ దేవుడు శ్రద్ధగా విన్నాడనే భావాన్ని అందిస్తుంది; అయితే ఈ వాక్యంలో స్పష్టంగా లేని నిర్దిష్ట జవాబు లేదా విమోచన చర్యను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ‘వేడుకున్నాడు,’ ‘మొర ఆలకించాడు,’ ‘అణచివేత’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని కారణ సంబంధాన్ని ‘ఎందుకంటే’తో, לַחַץ నామ-క్రియా పునరుక్తిని ‘అణచివేత/అణచివేస్తుండగా’తో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
