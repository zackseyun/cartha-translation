source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹאָחָז֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יוֹאָ֥שׁ בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: te
  text: యెహోయాహాజు తన పూర్వీకులతో కలిసి నిద్రించాడు. అతన్ని షోమ్రోనులో పాతిపెట్టారు. అతని కుమారుడు యోవాషు[a] అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును ‘యెహోయాషు’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: నామానికి ఉన్న విస్తృత ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ఇది రాజు మరణాన్ని తెలిపే సంప్రదాయ హీబ్రూ ప్రయోగం. ‘చనిపోయాడు’ అని భావాన్ని మాత్రమే చెప్పకుండా, మూలంలోని నిద్ర రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పూర్వీకులతో కూడ
  rationale: మూలంలోని ‘తన తండ్రులతో’ అనే రాజవంశ మరణ సూత్రాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ‘పూర్వీకులతో’ అని అందిస్తుంది.
- source_word: וַיִּקְבְּרֻהוּ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: హీబ్రూలో ఉన్న అనిర్దిష్ట తృతీయ పురుష బహువచన కర్తను కర్మణి వాక్యంగా మార్చకుండా క్రియాశీల రూపంలో నిలుపుతుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: బְ ఇక్కడ సమాధి చేసిన ప్రదేశాన్ని సూచిస్తుంది; స్థల నామానికి తెలుగు లిప్యంతరీకరణను వాడింది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ ప్రకటనలో క్రియ ముఖ్యంగా రాజ్యాధికార స్వీకరణను సూచిస్తుంది; ‘పాలించాడు’ కంటే ‘రాజయ్యాడు’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవంశ వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించడాన్ని సహజమైన తెలుగులో ఖచ్చితంగా తెలుపుతుంది.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: יוֹאָשׁ
  choice: యోవాషు
  rationale: ఈ వచనంలోని సంక్షిప్త హీబ్రూ నామరూపం יוֹאָשׁను నేరుగా లిప్యంతరీకరించింది; విస్తృత రూపమైన ‘యెహోయాషు’ను పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: ‘పూర్వీకులతో కూడ నిద్రించాడు’ అనే మరణ సూత్రం
  choice: మూలంలోని నిద్ర రూపకాన్ని నిలుపుట
  alternative: చనిపోయాడు
  rationale: ఈ సూత్రప్రయోగం మరణాన్ని సూచించినప్పటికీ, దాని రూపకాన్ని నేరుగా సిద్ధాంతపరంగా వివరిస్తూ తొలగించకుండా మూలంలోని భావ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక శైలి వాడబడింది. హీబ్రూ రాజమరణ సూత్రంలోని రూపకం నిలుపబడింది; అసహజమైన పదానువాదాన్ని నివారించేందుకు ‘తండ్రులు’కు బదులు ‘పూర్వీకులు’ వాడబడింది.
