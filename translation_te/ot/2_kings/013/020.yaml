  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֥מָת אֱלִישָׁ֖ע וַֽ/יִּקְבְּרֻ֑/הוּ וּ/גְדוּדֵ֥י מוֹאָ֛ב יָבֹ֥אוּ בָ/אָ֖רֶץ בָּ֥א שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: te
  text: తరువాత ఎలీషా చనిపోయాడు; వారు అతణ్ణి పాతిపెట్టారు. మోయాబు దోపిడీ దళాలు సంవత్సరం ఆరంభమయ్యే కాలంలో[a] దేశంలోకి వస్తుండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వసంతకాలంలో.’ హీబ్రూ అక్షరార్థంగా ‘సంవత్సరం వచ్చేటప్పుడు’ అని ఉంది; ఇది సంవత్సర మలుపును, తరచుగా సైనిక దండయాత్రలు మొదలయ్యే కాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: తరువాత ... చనిపోయాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘తరువాత’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తూ מות అనే క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וַיִּקְבְּרֻהוּ
  choice: వారు అతణ్ణి పాతిపెట్టారు
  rationale: హీబ్రూలో ఇది మూడవ పురుష బహువచన కర్తతో, పుంలింగ ఏకవచన కర్మ ప్రత్యయంతో ఉన్న క్రియ; కర్త ఎవరో పేర్కొనని బహువచనాన్ని తెలుగులోనూ నిలిపింది.
- source_word: גְדוּדֵי מוֹאָב
  choice: మోయాబు దోపిడీ దళాలు
  rationale: גְדוּד సాధారణంగా క్రమబద్ధ సైన్యం కంటే దాడులు లేదా దోపిడీలు చేసే దళాన్ని సూచిస్తుంది; నిర్మాణ సంబంధాన్నీ సైనిక భావాన్నీ ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יָבֹאוּ
  choice: వస్తుండేవి
  rationale: ఇక్కడ అసంపూర్ణ క్రియ పునరావృతమయ్యే అలవాటు చర్యను సూచిస్తుంది; ‘వస్తుండేవి’ ఆ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בָאָרֶץ
  choice: దేశంలోకి
  rationale: בוא (‘రావడం/ప్రవేశించడం’)తో కలిసి ఈ పదబంధం లోపలికి ప్రవేశించే భావాన్ని ఇస్తుంది; ‘దేశంలోకి’ ఆ దిశాభావాన్ని నిలుపుతుంది.
- source_word: בָּא שָׁנָה
  choice: సంవత్సరం ఆరంభమయ్యే కాలంలో
  rationale: అక్షరార్థంగా ‘సంవత్సరం వచ్చేటప్పుడు’; ఇది సంవత్సర మలుపును, సాధారణంగా సైనిక దండయాత్రల కాలమైన వసంతాన్ని సూచించే నుడికారంగా ఉండవచ్చు. ప్రధాన పాఠం మూలంలోని రూపకాన్ని అధికంగా అసహజం చేయకుండా నిలుపుతుంది.
