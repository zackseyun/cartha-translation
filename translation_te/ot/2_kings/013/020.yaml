translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని క్రియాశీల బహువచనం, అలవాటు చర్య, కాల నుడికారంలోని స్వల్ప సందిగ్ధత నిలుపబడ్డాయి.
