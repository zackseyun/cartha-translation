base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: te
  text: యూదా రాజు యోవాషు పాలనలోని ముప్పై ఏడవ సంవత్సరంలో[a], యెహోయాహాజు కుమారుడైన యెహోవాషు షోమ్రోనులో ఇశ్రాయేలుమీద రాజయ్యాడు. అతడు పదహారు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠం యూదా రాజు יוֹאָשׁ (యోవాషు) పేరును ఇశ్రాయేలు రాజు יְהוֹאָשׁ (యెహోవాషు) పేరుతో భేదపరుస్తుంది. కొన్ని అనువాద సంప్రదాయాలు ఇద్దరి పేర్లనూ ఒకే విధంగా రాస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֶׁבַע שָׁנָה
  choice: పరిపాలనలో ముప్పై ఏడవ సంవత్సరంలో
  rationale: హీబ్రూ రాజ్యకాల తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో క్రమసంఖ్యతో వ్యక్తం చేస్తుంది.
- source_word: לְ/יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యోవాషు పరిపాలనలో
  rationale: לְ ఇక్కడ రాజు పాలనను తేదీకి ప్రమాణకాలంగా సూచిస్తుంది; יוֹאָשׁను యోవాషు అని లిప్యంతరీకరించడం ద్వారా తరువాతి יְהוֹאָשׁతో ఉన్న హీబ్రూ రూపభేదం నిలుస్తుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: రాజ్యారంభ ప్రకటనలో Qal perfect ప్రవేశార్థాన్ని సూచిస్తుంది; తరువాతి వాక్యం పాలనకాలాన్ని విడిగా తెలియజేస్తుంది.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: యెహోయాహాజు కుమారుడైన యెహోవాషు
  rationale: ఉత్తర రాజు పేరులోని יְהוֹ రూపాన్ని యెహోవాషు అని చూపించి, యూదా రాజు యోవాషు పేరుతో ఉన్న మూలపాఠ భేదాన్ని కాపాడుతుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు రాజయ్యాడు
  rationale: מלך ... על అంటే ప్రజలపై రాజ్యాధికారం చేపట్టడం; తెలుగులో ‘ఇశ్రాయేలుకు రాజయ్యాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּ/שֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: בְ స్థలాన్ని సూచిస్తుంది; షోమ్రోను ఉత్తర రాజ్య రాజధానిగా పాలనాస్థలాన్ని తెలియజేస్తుంది.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: పదహారు సంవత్సరాలు పరిపాలించాడు
  rationale: ఈ సంఖ్యాపదబంధం పాలన వ్యవధిని సూచిస్తుంది; తెలుగులో క్రియను పునరుక్తి చేయడం స్పష్టంగా, సహజంగా ఉంటుంది.
