source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడు చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యరొబాము పాపాల్లో దేనినీ అతడు విడిచిపెట్టలేదు; వాటిలోనే[a] నడిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “దానిలోనే నడిచాడు”; ఏకవచన సర్వనామం యరొబాము అనుసరించిన పాపపు విధానాన్ని సమూహార్థంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: అతడు ... చెడ్డది చేశాడు
  rationale: రాజుల గ్రంథంలోని స్థిరమైన నైతిక మూల్యాంకన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దైవిక మూల్యాంకనాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా నిలుపుతుంది; יְהוָה అనే దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించింది.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: పాపాల్లో దేనినీ ... విడిచిపెట్టలేదు
  rationale: నిరాకరణతో కూడిన מִכָּל భావాన్ని తెలుగులో సహజంగా ‘దేనినీ ... లేదు’ అని అందించి, ఏ పాపాన్నీ వదలలేదనే సమగ్ర అర్థాన్ని కాపాడుతుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడు యరొబాము
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచుతుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేయడానికి కారకుడైన
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; సంబంధవాక్యాన్ని యరొబాముకు అన్వయించడం హీబ్రూ వాక్యనిర్మాణానికి సహజంగా సరిపోతుంది.
- source_word: בָּהּ הָלָךְ
  choice: వాటిలోనే నడిచాడు
  rationale: הלך యొక్క ప్రవర్తనా రూపకాన్ని నిలుపుతుంది. ఏకవచన స్త్రీలింగ ప్రత్యయం సమూహార్థక పాపపు మార్గాన్ని సూచించినా, తెలుగులో ముందున్న బహువచన ‘పాపాలు’కు అనుగుణంగా ‘వాటిలో’ సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే సంప్రదాయ లిప్యంతరీకరణతో అందించింది.
- issue: యరొబాము ఇశ్రాయేలును పాపంలోకి నడిపించిన కారణత్వం
  choice: ఇశ్రాయేలు పాపం చేయడానికి కారకుడైన
  alternative: వాటి ద్వారా అతడు ఇశ్రాయేలుతో పాపం చేయించాడు
  rationale: సంబంధసర్వనామం వ్యక్తిని గానీ పాపాలను గానీ సూచించే అవకాశాన్ని హీబ్రూ నిర్మాణం కొంతవరకు అనుమతిస్తుంది. సమీపంలోని వ్యక్తి యరొబామును సంబంధవాక్యానికి పూర్వపదంగా తీసుకోవడం సహజమైనది; కారణార్థాన్ని మాత్రం స్పష్టంగా కాపాడింది.
- issue: בָּהּ యొక్క వ్యాకరణ ఏకవచనం
  choice: వాటిలోనే నడిచాడు
  alternative: దానిలోనే నడిచాడు
  rationale: ప్రత్యయం రూపపరంగా ఏకవచనమైనప్పటికీ పాపపు విధానాన్ని సమూహార్థంగా సూచించవచ్చు. ప్రధాన వాక్యంలో సహజమైన బహువచనం వాడి, రూపపరమైన ఏకవచనాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజుల గ్రంథంలోని గంభీరమైన నైతిక తీర్పు మరియు ‘నడిచాడు’ అనే బైబిలీయ రూపకం నిలుపబడ్డాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
