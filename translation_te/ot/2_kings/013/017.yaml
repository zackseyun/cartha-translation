language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: te
  text: 'అప్పుడు అతడు, “తూర్పువైపు ఉన్న కిటికీని తెరువు” అన్నాడు; రాజు దాన్ని తెరిచాడు. అప్పుడు ఎలీషా, “బాణం వేయి” అన్నాడు; అతడు బాణం వేశాడు. అప్పుడు అతడు ఇలా అన్నాడు: “యెహోవా విజయబాణం, అరాముపై విజయబాణం![a] నీవు అఫేకులో అరామును పూర్తిగా నాశనం చేసేవరకు దెబ్బతీస్తావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా నుండి వచ్చే రక్షణబాణం, అరాముకు వ్యతిరేకంగా రక్షణబాణం.” హీబ్రూ పదానికి “విజయం,” “రక్షణ,” లేదా “విమోచన” అనే అర్థాలు ఉండవచ్చు.
    reason: תְּשׁוּעָה యొక్క పదార్థ ప్రత్యామ్నాయాలను, అలాగే לַיהוָהకు సాధ్యమైన మూల/కర్తృత్వ భావాన్ని సంరక్షిస్తుంది.
lexical_decisions:
- source_word: הַחַלּוֹן קֵדְמָה
  choice: తూర్పువైపు ఉన్న కిటికీని
  rationale: קֵדְמָה దిశను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ దిశలో ఉన్న కిటికీని తెరవాలనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְרֵה
  choice: బాణం వేయి
  rationale: విలువిద్య సందర్భంలో ירהకు ఇదే సహజమైన తెలుగు ఆజ్ఞారూపం. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, తెలుగులో సందర్భాన్ని సహజంగా వ్యక్తం చేయడానికి ‘బాణం’ చేర్చబడింది.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: యెహోవా అనుగ్రహించే విజయబాణం
  rationale: תְּשׁוּעָה ఇక్కడ సైనిక విజయాన్ని సూచిస్తుంది. לַיהוָהలోని సంబంధాన్ని కేవలం స్వామ్యార్థంగా కాక, విజయానికి యెహోవాయే మూలమనే భావంతో సహజంగా వ్యక్తం చేసింది.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: అరాముపై విజయాన్ని ఇచ్చే బాణం
  rationale: రెండవ పదబంధం మొదటిదాన్ని వివరిస్తుంది; בַאֲרָםను సందర్భానుసారం ‘అరాముపై’ అని అనువదించింది.
- source_word: אֲרָם
  choice: అరాము
  rationale: హీబ్రూ భౌగోళిక నామాన్ని ఆధునిక దేశనామంతో మార్చకుండా లిప్యంతరీకరించింది.
- source_word: וְהִכִּיתָ אֶת אֲרָם בַאֲפֵק עַד כַּלֵּה
  choice: నీవు అఫేకులో అరామును పూర్తిగా ఓడిస్తావు
  rationale: נכה మరియు עַד כַּלֵּה కలసి ఇక్కడ యుద్ధంలో సంపూర్ణ ఓటమిని సూచిస్తున్నాయి. అరాము ప్రజల నిర్మూలన అని అవసరానికి మించి అర్థం రాకుండా, సైనిక సందర్భాన్ని ‘పూర్తిగా ఓడిస్తావు’గా వ్యక్తం చేసింది.
- source_word: יהוה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో అందించింది.
theological_decisions:
- issue: תְּשׁוּעָה యొక్క భావం
  choice: విజయం
  alternative: రక్షణ / విమోచన
  rationale: ఈ సంకేతాత్మక యుద్ధచర్యలో తక్షణ భావం సైనిక విజయం. అయినా పదానికి ఉన్న విస్తృతమైన ‘రక్షణ’ లేదా ‘విమోచన’ భావాన్ని పాదటిప్పణిలో నిలిపింది.
- issue: לַיהוָה యొక్క సంబంధం
  choice: యెహోవా అనుగ్రహించే
  alternative: యెహోవాకు చెందిన / యెహోవా నుండి వచ్చిన
  rationale: లామెద్ సూచించే సంబంధం మూలం, కర్తృత్వం లేదా స్వామ్యాన్ని కలిగి ఉండవచ్చు. సందర్భంలో విజయం యెహోవా నుండి వస్తుందనే భావాన్ని సహజమైన తెలుగులో తెలిపింది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- issue: עַד כַּלֵּה యొక్క తీవ్రత
  choice: పూర్తిగా ఓడిస్తావు
  alternative: నాశనం చేసేవరకు దెబ్బతీస్తావు
  rationale: యుద్ధసందర్భంలోని సంపూర్ణ విజయాన్ని నిలుపుతూ, రాజ్యం లేదా సైన్యంపై పలికిన మాటను ప్రజల సంపూర్ణ నిర్మూలనగా అనవసరంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి సరళమైన గౌరవప్రద శైలి. వక్త మార్పు అస్పష్టంగా ఉండకుండా ‘రాజు’, ‘ఎలీషా’ అనే సూచనలు సందర్భానుసారం చేర్చబడ్డాయి. బాణం వేయడాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలిపింది.
