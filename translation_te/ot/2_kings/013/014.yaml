source:
  edition: WLC
  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: te
  text: ఎలీషా తాను చనిపోబోయే వ్యాధితో అనారోగ్యానికి గురయ్యాడు. అప్పుడు ఇశ్రాయేలు రాజైన యోవాషు అతని దగ్గరికి దిగివచ్చి, అతని ముఖం ఎదుట ఏడ్చి, “నా తండ్రీ,[a] నా తండ్రీ! ఇశ్రాయేలు రథమా, దాని రౌతులారా!” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పిలుపు 2 రాజులు 2:12లో ఏలీయాను గురించి ఎలీషా పలికిన మాటలను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: వ్యాధితో జబ్బుపడ్డాడు
  rationale: మూలంలోని క్రియా-నామ పదపునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: తాను చనిపోబోయే
  rationale: కథన దృష్టిలో ముందున్న మరణాన్ని సూచించే సంబంధ వాక్య భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: וַיֵּרֶד אֵלָיו
  choice: అతని దగ్గరికి దిగివచ్చి
  rationale: ירד లోని దిశాసూచకమైన ‘దిగు’ భావాన్ని విడిచిపెట్టకుండా తెలుగులో సహజమైన గమనవ్యక్తీకరణను ఇస్తుంది.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: అతని మీద పడి ఏడుస్తూ
  rationale: అక్షరార్థంగా ‘అతని ముఖం మీద/ఎదుట ఏడ్చాడు’; ఇక్కడ రాజు ఎలీషా మీదకు వాలి దుఃఖించిన దృశ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది, అయితే ఖచ్చిత భంగిమను అతిగా నిర్ణయించదు.
- source_word: אָבִי אָבִי
  choice: నా తండ్రీ, నా తండ్రీ!
  rationale: ప్రథమ పురుష స్వామ్య ప్రత్యయాన్నీ, గౌరవం మరియు దుఃఖంతో కూడిన పిలుపు తీవ్రతనూ నిలుపుతుంది.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: ఇశ్రాయేలు రథం, దాని రౌతులు!
  rationale: רֶכֶב ఏకవచన రూపాన్ని ‘రథం’గా ఉంచి, రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నేరుగా నిలుపుతుంది; פָרָשָׁיו బహువచనాన్ని ‘రౌతులు’గా అందిస్తుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలు రథం, దాని రౌతులు’ అనే రూపకం
  choice: ఎలీషాను ఉద్దేశించిన ప్రత్యక్ష విలాపంగా, రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ఎలీషానే ఇశ్రాయేలు యొక్క నిజమైన సైనిక రక్షణ అని వివరణాత్మకంగా అనువదించడం; లేదా పరలోక రథాల దర్శనంగా స్పష్టీకరించడం
  rationale: ఈ మాటలు 2 రాజులు 2:12ను ప్రతిధ్వనిస్తాయి. ప్రవక్త ప్రాముఖ్యతను సూచించినప్పటికీ, రూపకం ఏ విధంగా పనిచేస్తుందో అనువాదంలో పూర్తిగా తీర్మానించకపోవడం మూలంలోని భావఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. ప్రారంభ וַ־ను అనవసరమైన ‘ఇప్పుడు’గా మార్చలేదు. ‘రౌతులు’ అనే పదం రథసైన్య సందర్భానికి తగిన సంక్షిప్త, గౌరవప్రద రూపం.
