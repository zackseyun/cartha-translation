id: 2KI.13.5
reference: 2 Kings 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: te
  text: యెహోవా ఇశ్రాయేలుకు ఒక విమోచకుణ్ణి[a] ఇచ్చాడు. అప్పుడు వారు అరాము అధికారం కిందనుండి[b] బయటపడ్డారు; ఇశ్రాయేలు కుమారులు మునుపటిలాగే[c] తమ గుడారాల్లో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షకుడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం రక్షణ లేదా విముక్తి కలిగించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అరాము చేతి కిందనుండి’; అంటే అరాము ఆధిపత్యం నుండి.
    reason: cultural_note
  - marker: c
    text: ‘పూర్వంలా’ లేదా ‘పూర్వకాలంలోలాగా’ అని కూడా అనువదించవచ్చు. ఇది గత దినాలను ప్రస్తావిస్తూ మునుపటి స్థితిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామంలోని నాలుగు హల్లుల పేరును తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో నిలుపుతుంది; సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చదు.
- source_word: מוֹשִׁיעַ
  choice: ఒక విమోచకుణ్ణి
  rationale: ఈ కర్తృవాచక రూపం రక్షణ లేదా విడుదల కలిగించే వ్యక్తిని సూచిస్తుంది. అరామీయుల అణచివేతనుండి చారిత్రక విముక్తి సందర్భానికి ‘విమోచకుడు’ సరిపోతుంది; వ్యక్తి ఎవరో వచనం చెప్పని అస్పష్టతను అలాగే ఉంచుతుంది.
- source_word: מִתַּחַת יַד אֲרָם
  choice: అరాము అధికారం కిందనుండి
  rationale: ‘అరాము చేతి కిందనుండి’ అనే హీబ్రూ రూపకం ఆధిపత్యాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో దాని భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి భౌగోళిక పేరైన ‘సిరియా’కు బదులు మూలంలోని ప్రాచీన రాజ్యనామాన్ని నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ సంబంధమైన, వ్యాకరణపరంగా పుంలింగ రూపాన్ని సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: בְּאָהֳלֵיהֶם
  choice: తమ గుడారాల్లో
  rationale: మూలంలోని స్పష్టమైన ‘గుడారాలు’ అనే పదాన్ని నిలుపుతూ, కర్తతో సహజ అన్వయానికి ‘తమ’ను వాడుతుంది.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: మునుపటిలాగే
  rationale: అక్షరార్థంగా గత దినాలను ప్రస్తావించే హీబ్రూ నుడికారం ‘పూర్వంలా’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘మునుపటిలాగే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיֵּצְאוּ
  choice: బయటపడ్డారు
  rationale: יצא అనే ‘బయటకు రావడం’ భావాన్ని ఉంచి, ఆధిపత్యం కిందనుండి విడుదలైన సందర్భంలో సహజంగా వినిపిస్తుంది.
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ישב ఇక్కడ కూర్చోవడం కాక నివసించడం అనే భావంలో ఉంది; గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: מוֹשִׁיעַ ను ‘విమోచకుడు’గా లేదా ‘రక్షకుడు’గా అనువదించాలా
  choice: విమోచకుడు
  alternative: రక్షకుడు
  rationale: తక్షణ సందర్భం అరాము ఆధిపత్యం నుండి రాజకీయ-చారిత్రక విడుదల. ‘విమోచకుడు’ ఆ భావాన్ని తెలియజేస్తూ, వచనం స్పష్టంగా చేయని మెస్సీయ సంబంధ గుర్తింపును అనువాదంలో చేర్చదు.
- issue: בְנֵי יִשְׂרָאֵל అనే కుటుంబపరమైన పదబంధాన్ని నిలుపాలా
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబపరమైన covenant గుర్తింపును, పుంలింగ రూపాన్ని నిలుపుతుంది; అయితే ఈ సమూహపదం సందర్భంలో ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, చారిత్రక గంభీరతను నిలిపింది. మూలంలోని దైవనామం, ప్రాచీన రాజ్యనామం, కుటుంబపరమైన ‘ఇశ్రాయేలు కుమారులు,’ ‘గుడారాలు’ అనే స్పష్ట పదాలను ఉంచింది; హీబ్రూ నుడికారాలను పాదసూచికల్లో వివరించింది.
