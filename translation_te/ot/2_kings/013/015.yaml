source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ אֱלִישָׁ֔ע קַ֖ח קֶ֣שֶׁת וְ/חִצִּ֑ים וַ/יִּקַּ֥ח אֵלָ֖י/ו קֶ֥שֶׁת וְ/חִצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: te
  text: అప్పుడు ఎలీషా అతనితో ఇలా అన్నాడు, “ఒక విల్లును బాణాలను తీసుకో.” అతడు ఒక విల్లును బాణాలను ఎలీషా దగ్గరికి తీసుకొచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని దగ్గరికి”; సందర్భంలో ఇది ఎలీషాను సూచిస్తుంది. కొందరు దీనిని “తన కోసం ఒక విల్లును బాణాలను తీసుకున్నాడు” అని కూడా అర్థం చేసుకునే అవకాశం ఉందని సూచిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: לּוֹ
  choice: అతనితో
  rationale: ל ఉపసర్గకు జతైన మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం, ఎలీషా మాటల పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో ‘అతనితో ... అన్నాడు’ సహజ ప్రయోగం.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: హెబ్రీ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: קַח
  choice: తీసుకో
  rationale: לקח క్రియ యొక్క ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קֶשֶׁת
  choice: ఒక విల్లు
  rationale: ఆయుధమైన విల్లును సూచిస్తుంది; హెబ్రీలో నిర్దిష్టత లేకపోవడాన్ని తెలుగులో ‘ఒక’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְחִצִּים
  choice: బాణాలను
  rationale: חֵץ పదానికి బహువచనం; విల్లుతో సమన్వయంగా ఉన్న బాణాలను సూచిస్తుంది.
- source_word: וַיִּקַּח
  choice: అతడు ... తీసుకొచ్చాడు
  rationale: కథనంలో ఆజ్ఞకు ప్రతిస్పందనగా జరిగిన తదుపరి చర్యను తెలియజేస్తుంది; తరువాతి אֵלָיו యొక్క దిశార్థాన్ని కలిపి తెలుగులో సహజంగా అనువదించబడింది.
- source_word: אֵלָיו
  choice: ఎలీషా దగ్గరికి
  rationale: אֶל ఉపసర్గతో మూడవ పురుష ఏకవచన ప్రత్యయం సాధారణంగా ‘అతని దగ్గరికి’ అనే దిశార్థాన్ని ఇస్తుంది; సందర్భంలో ఆ వ్యక్తి ఎలీషా అని స్పష్టత కోసం పేరు పునరుక్తి చేయబడింది.
- source_word: קֶשֶׁת וְחִצִּים
  choice: ఒక విల్లును, బాణాలను
  rationale: హెబ్రీ మూలంలో వస్తువులు రెండోసారి స్పష్టంగా పునరుక్తమైనందున తెలుగులోనూ వాటిని నిలిపి ఉంచింది.
