  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. אֵלָיו లోని దిశార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఇచ్చాం.
