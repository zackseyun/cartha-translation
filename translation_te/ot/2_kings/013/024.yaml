lexical_decisions:
- source_word: וַיָּמָת
  choice: అప్పుడు ... చనిపోయాడు
  rationale: מות ధాతువు యొక్క ఖల్ వయ్యిక్తోల్ రూపం గతంలో జరిగిన మరణాన్ని సూటిగా తెలియజేస్తుంది; వావ్ సూచించే కథన క్రమాన్ని సహజమైన తెలుగులో ‘అప్పుడు’తో వ్యక్తం చేశాం.
- source_word: חֲזָאֵל
  choice: హజాయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: אֲרָם చారిత్రక రాజ్యనామం కాబట్టి, వ్యాఖ్యాత్మకమైన ‘సిరియా’కు బదులు మూలంలోని పేరును నేరుగా నిలిపాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజవారసత్వ సందర్భంలో מלך కేవలం పరిపాలనా కాలాన్ని కాక సింహాసనారోహణాన్ని సూచిస్తుంది; ‘రాజయ్యాడు’ సహజంగాను కచ్చితంగాను ఉంది.
- source_word: בֶּן־הֲדַד
  choice: బెన్హదదు
  rationale: హీబ్రూ వ్యక్తి లేదా వంశనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: సర్వనామ ప్రత్యయం హజాయేలును సూచిస్తుంది; తండ్రీకొడుకుల సంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవారసత్వ సూత్రంలో תחת ప్రత్యామ్నాయం లేదా వారసత్వాన్ని సూచిస్తుంది; ‘అతని స్థానంలో’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
