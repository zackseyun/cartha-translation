  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: te
  text: యోవాషు తన పితరులతో నిద్రించాడు[a]. యరొబాము యోవాషు సింహాసనం మీద కూర్చున్నాడు. యోవాషు షోమ్రోనులో ఇశ్రాయేలు రాజులతో సమాధి చేయబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పితరులతో పడుకున్నాడు”; ఇది ఒక రాజు మరణాన్ని తెలిపే సంప్రదాయ హీబ్రూ సూత్రప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ‘తన పితరులతో నిద్రించాడు’ అనే రాజమరణ సూత్రప్రయోగంలోని రూపకాన్ని నిలుపుతుంది; కేవలం ‘చనిపోయాడు’ అని చెప్పి మూలంలోని చిత్రణను తొలగించదు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: వంశపారంపర్య సందర్భంలోని ‘తండ్రులు/పితరులు’ అనే హీబ్రూ పదబంధాన్ని దగ్గరగా ప్రతిబింబిస్తుంది; ఇక్కడ అది పూర్వీకులను సూచిస్తుంది.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: అతని సింహాసనం మీద కూర్చున్నాడు
  rationale: రాజ్యాధికార వారసత్వాన్ని సూచించే హీబ్రూ సింహాసన చిత్రణను యథాతథంగా నిలుపుతుంది.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: కర్తను పేర్కొనని హీబ్రూ క్రియను సహజమైన తెలుగు కర్మణి రూపంలో అందిస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: ב అనే స్థానార్థక ఉపసర్గను సహజంగా తెలుపుతూ, హీబ్రూ స్థలనామానికి దగ్గరైన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులతో పాటు
  rationale: మునుపటి ఇశ్రాయేలు రాజుల సమాధుల మధ్య అతడు సమాధి చేయబడ్డాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
