  source_fidelity: 'The Telugu accurately reflects the Hebrew narrative sequence: the men were burying a man, saw a raiding band, threw the man into Elisha’s grave, and the man ‘went and touched’ Elisha’s bones, lived, and stood on his feet. The otherwise awkward וַיֵּלֶךְ (‘went’) is retained rather than harmonized away, consistent with the English audit trail.'
  naturalness: The wording is fluent modern standard Telugu with an appropriately restrained biblical narrative register. ‘దోపిడీ దండు,’ ‘సమాధిలో పడేశారు,’ and ‘తన కాళ్ల మీద నిలబడ్డాడు’ are clear and natural. ‘ఇదిగో’ suitably represents the discourse force of וְהִנֵּה.
  terminology: 'Names and key terms are handled consistently: ‘ఎలీషా’ is standard, ‘దోపిడీ దండు’ conveys a hostile raiding band, and ‘తిరిగి బతికి’ appropriately communicates the contextual sense of coming back to life without importing a doctrinal explanation.'
