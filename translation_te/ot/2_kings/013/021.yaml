source:
  edition: WLC
  text: וַ/יְהִ֞י הֵ֣ם קֹבְרִ֣ים אִ֗ישׁ וְ/הִנֵּה֙ רָא֣וּ אֶֽת הַ/גְּד֔וּד וַ/יַּשְׁלִ֥יכוּ אֶת הָ/אִ֖ישׁ בְּ/קֶ֣בֶר אֱלִישָׁ֑ע וַ/יֵּ֜לֶךְ וַ/יִּגַּ֤ע הָ/אִישׁ֙ בְּ/עַצְמ֣וֹת אֱלִישָׁ֔ע וַ/יְחִ֖י וַ/יָּ֥קָם עַל רַגְלָֽי/ו׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: te
  text: వారు ఒక మనిషిని పాతిపెడుతుండగా, ఇదిగో, ఒక దోపిడీ దండు వారికి కనిపించింది. దాంతో వారు ఆ మనిషిని ఎలీషా సమాధిలో పడేశారు. ఆ మనిషి వెళ్లి[a] ఎలీషా ఎముకలకు తగలగానే, అతడు తిరిగి బతికి తన కాళ్ల మీద నిలబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా “ఆ మనిషి వెళ్లి తాకాడు” అని ఉంది. అతని శరీరం ఎలీషా ఎముకలకు తగిలిందనే భావంలో కొందరు “వెళ్లి” అనే మాటను అనువాదంలో వదిలేస్తారు.
    reason: The source wording is unusual because ‘went’ precedes the statement that the dead man came to life; the note preserves the textual ambiguity and explains the common alternative.
lexical_decisions:
- source_word: הַגְּדוּד
  choice: దోపిడీ దండు
  rationale: גדוד here denotes a raiding troop or band; this rendering conveys both its organized-group sense and its hostile activity.
- source_word: וַיַּשְׁלִיכוּ
  choice: పడేశారు
  rationale: The verb means ‘threw/cast’; in Telugu, పడేశారు naturally communicates their hurried action without weakening it to merely ‘placed.’
- source_word: וַיְחִי
  choice: తిరిగి బతికి
  rationale: In context the buried man returns to life; ‘తిరిగి’ makes the contextual force clear while retaining the verb’s basic sense ‘lived/came alive.’
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: తన కాళ్ల మీద నిలబడ్డాడు
  rationale: A direct, natural Telugu equivalent of ‘stood/rose upon his feet.’
theological_decisions:
- issue: The sequence וַיֵּלֶךְ וַיִּגַּע before the man comes to life
  choice: ఆ మనిషి వెళ్లి[a] ... తగలగానే
  alternative: ఆ మనిషి ... ఎముకలకు తగలగానే
  rationale: The Hebrew explicitly contains ‘went’ before ‘touched,’ although this creates narrative tension because the man is not said to revive until afterward. The main text preserves that wording and the footnote identifies the difficulty rather than silently resolving it.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ అనే పదం וְהִנֵּה యొక్క ఆకస్మిక దృశ్యమార్పును నిలుపుతుంది; ‘దాంతో’ సంఘటనల కారణ-ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
