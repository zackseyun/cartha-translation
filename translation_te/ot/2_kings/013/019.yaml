id: 2KI.13.19
reference: 2 Kings 13:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: te
  text: 'అప్పుడు దైవజనుడు అతనిపై కోపపడి ఇలా అన్నాడు: “నువ్వు నేలను ఐదు లేదా ఆరుసార్లు కొట్టి ఉండాల్సింది[a]. అప్పుడు అరామును అంతం చేసేవరకు దెబ్బకొట్టి ఉండేవాడివి[b]. కానీ ఇప్పుడు అరాముపై మూడుసార్లు మాత్రమే దెబ్బకొడతావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ కేవలం ‘కొట్టడం’ అని ఉంది; ‘నేలను’ అనేది 18వ వచనంలో వెంటనే ముందు జరిగిన చర్యనుబట్టి చేర్చబడింది.
    reason: cross_reference
  - marker: b
    text: ‘అరాముకు పూర్తిగా అంతం కలిగించేవరకు’ లేదా ‘పూర్తిగా నాశనం చేసేవరకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: కోపపడి
  rationale: קצף కోపాన్ని సూచిస్తుంది. సందర్భంలోని తీవ్రతను అతిశయింపజేయకుండా, ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుడు
  rationale: ‘దేవుని మనిషి’ అనే హీబ్రూ బిరుదుకు తెలుగులో స్థిరపడిన, గౌరవప్రదమైన సమానార్థక పదం; ‘ప్రవక్త’ అని పాత్రను వ్యాఖ్యానించి చేర్చదు.
- source_word: לְהַכּוֹת
  choice: నేలపై ... దెబ్బకొట్టాల్సింది
  rationale: హీబ్రూలో కేవలం ‘కొట్టడం’ అని ఉంది; 18వ వచనంలోని వెంటనే ముందు జరిగిన చర్యనుబట్టి ‘నేలపై’ అనే కర్మసంబంధ భావాన్ని స్పష్టంచేశాం. సూచక చర్యకూ సైనిక ఫలితానికీ ఉన్న క్రియాపద సంబంధాన్ని నిలుపుటకు ‘దెబ్బకొట్టు’ వాడాం.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: ఐదుసార్లు లేదా ఆరుసార్లు
  rationale: సంఖ్యా వ్యక్తీకరణను నేరుగా, సహజమైన తెలుగులో అనువదించాం.
- source_word: אָז
  choice: అప్పుడు
  rationale: జరిగి ఉండాల్సిన చర్యకు కలిగే ఊహాత్మక ఫలితాన్ని సహజంగా సూచిస్తుంది.
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: అరాముపై దెబ్బకొట్టేవాడివి
  rationale: సూచకంగా నేలను కొట్టడం, యుద్ధంలో అరామును దెబ్బతీయడం—ఈ రెండింటికీ మూలంలో ఒకే נכה క్రియ ఉన్నందున తెలుగులోనూ ‘దెబ్బకొట్టు’ అనే సంబంధాన్ని నిలిపాం.
- source_word: עַד כַּלֵּה
  choice: అరాము అంతమయ్యేవరకు
  rationale: כלה ఇక్కడ సంపూర్ణ ముగింపును సూచిస్తుంది. ‘పూర్తిగా నాశనం’ అని మాత్రమే నిర్ధారించకుండా, హీబ్రూ పదబంధంలోని ముగింపు/సంపూర్ణత భావాన్ని నిలుపుతుంది.
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: జరిగి ఉండగల సంపూర్ణ ఫలితానికి, ఇక కలగబోయే పరిమిత ఫలితానికి మధ్యనున్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: అరాముపై మూడుసార్లు మాత్రమే దెబ్బకొడతావు
  rationale: అసంపూర్ణ క్రియను ఇక్కడ భవిష్యద్వచనంగా అనువదించాం. ముందు చెప్పిన ఐదు లేదా ఆరు సార్లతో ఉన్న వ్యత్యాసంలో అంతర్లీనమైన పరిమితిని ‘మాత్రమే’ స్పష్టంచేస్తుంది.
theological_decisions:
- issue: నేలను కొట్టే సూచక చర్యకూ అరాముపై సాధించే సైనిక విజయాలకూ ఉన్న సంబంధం
  choice: రెండు చోట్లా ‘దెబ్బకొట్టు’ అనే ఒకే క్రియను నిలిపి, మొదటి చోట సందర్భం నుంచి ‘నేలపై’ అని చేర్చడం.
  alternative: మొదటి చోట ‘నేలను కొట్టు,’ తరువాతి చోట ‘అరామును ఓడించు’ అని వేర్వేరు క్రియలు వాడడం.
  rationale: రాజు ఎన్నిసార్లు నేలపై దెబ్బకొట్టాడో, అరాముపై అన్నిసార్లు విజయం సాధిస్తాడనే ప్రవచనాత్మక సూచక చర్య కథనానికి కీలకం. ఒకే క్రియను వాడడం ఈ సంబంధాన్ని వ్యాఖ్యానాత్మక సిద్ధాంతం చేర్చకుండా పాఠకుడికి కనిపించేలా చేస్తుంది.
- issue: עַד כַּלֵּה సూచించే ముగింపు ఎంత తీవ్రంగా అనువదించాలి
  choice: ‘అరాము అంతమయ్యేవరకు’ అని అనువదించడం.
  alternative: ‘అరామును పూర్తిగా నాశనం చేసేవరకు’ లేదా ‘సమూలంగా నిర్మూలించేవరకు.’
  rationale: మూలపదం సంపూర్ణ ముగింపును సూచించినా, అది తప్పనిసరిగా జనసమూల నిర్మూలననే నిర్దిష్టంగా చెబుతోందని అనువాదంలో నిర్ణయించకూడదు. ప్రధాన పాఠం సైనికంగా సంపూర్ణ అంతం అనే భావాన్ని ఉంచి, బలమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దైవజనుడు’ సంప్రదాయపరంగా అర్థమయ్యే బిరుదు; మిగతా వాక్యనిర్మాణం సాధారణ పాఠకుడికి సులభంగా ఉండేలా ఉంచబడింది. ‘దెబ్బకొట్టు’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా మూలంలోని సూచక-సైనిక క్రియాసంబంధాన్ని కాపాడుతుంది.
