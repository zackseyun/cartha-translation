source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: te
  text: యాహ్వే కోపం ఇశ్రాయేలుమీద రగులుకుంది. ఆయన ఆ రోజులన్నిటా వారిని అరాము[c] రాజైన హజాయేలు చేతికీ, హజాయేలు కుమారుడైన బెన్హదదు చేతికీ అప్పగించాడు[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ కాలమంతా.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘చేతిలోకి ఇచ్చాడు’; ఇది ఒకరి అధికారం లేదా నియంత్రణకు అప్పగించడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘అరాము’ హీబ్రూ స్థలనామం; పాత అనువాదాల్లో దీనిని తరచుగా ‘సిరియా’ అని అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: హీబ్రూ నుడికారంలోని ‘కోపం మండడం’ అనే సజీవ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: కోపాన్ని సూచించే క్రియతో ఈ ఉపసర్గ ఇశ్రాయేలుకు విరోధంగా కోపం మళ్లిందనే భావాన్ని ఇస్తుంది.
- source_word: וַיִּתְּנֵם
  choice: ఆయన వారిని ... అప్పగించాడు
  rationale: సైనిక తీర్పు సందర్భంలో נתן యొక్క భావాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיַד
  choice: చేతికీ ... చేతికీ అప్పగించాడు
  rationale: అధికారం లేదా నియంత్రణకు లోబరచడాన్ని తెలిపే హీబ్రూ ‘చేతిలో’ నుడికారపు రూపచిత్రాన్ని తెలుగులో గుర్తించదగిన విధంగా నిలుపుతుంది.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: అరాము రాజైన హజాయేలు
  rationale: వ్యక్తి పేరును, హీబ్రూ స్థలనామాన్ని నేరుగా లిప్యంతరీకరించి రాజపదవిని స్పష్టంగా ఉంచుతుంది.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: హజాయేలు కుమారుడైన బెన్హదదు
  rationale: హీబ్రూలోని వంశసంబంధాన్ని స్పష్టంగా నిలుపుతూ పేరును తెలుగు ధ్వనిరీతికి అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: ఆ కాలమంతా
  rationale: సందర్భంలోని నిర్దిష్ట కాలవ్యవధిని సహజమైన తెలుగులో తెలియజేస్తూ, ‘అన్ని దినాలు’ అనే అతి అక్షరార్థ రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. చివరి వాక్యంలో ‘వారు వారి అధీనంలో ఉన్నారు’ అనేది మూలంలోని కాలవ్యాప్తిని తెలుగులో సంపూర్ణ వాక్యంగా సహజీకరిస్తుంది; ‘వారు’ అనేది హజాయేలు మరియు బెన్హదదును సమష్టిగా సూచిస్తుంది.
