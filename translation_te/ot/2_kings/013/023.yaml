source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: te
  text: అయితే యాహ్వే వారికి కృప చూపి, వారిపై కనికరపడి, అబ్రాహాము, ఇస్సాకు, యాకోబుతో చేసిన తన నిబంధనను బట్టి[a] వారి వైపు తిరిగాడు. వారిని నాశనం చేయడానికి ఆయన ఇష్టపడలేదు; వారిని తన సన్నిధి నుండి త్రోసివేయలేదు—ఇప్పటివరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్రాహాము, ఇస్సాకు, యాకోబుతో చేసిన తన నిబంధన నిమిత్తం.’
    reason: לְמַעַן అనే పదబంధం కారణం లేదా ఒకరి/ఒకదాని నిమిత్తం జరిగే చర్య అనే దగ్గరి భావాలను వ్యక్తపరచగలదు.
lexical_decisions:
- source_word: וַיָּחָן
  choice: కృప చూపాడు
  rationale: חנן సూచించే అనుగ్రహపూర్వకమైన ఆదరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: וַיְרַחֲמֵם
  choice: వారిపై కనికరపడ్డాడు
  rationale: רחםలోని లోతైన జాలి, కరుణ భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: ఆయన వారి వైపు తిరిగాడు
  rationale: అనుకూలమైన దృష్టిని సూచించే మూలభాషా దృశ్యరూపాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: తనకున్న నిబంధనను బట్టి
  rationale: దేవుని చర్యకు నిబంధనే ఆధారం లేదా ప్రేరణ అని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబుతో
  rationale: హీబ్రూ సంక్షిప్త నిర్మాణాన్ని పితరులతో ఉన్న నిబంధనగా సందర్భానుగుణంగా, స్పష్టంగా అందిస్తుంది.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: వారిని నాశనం చేయడానికి ఆయన ఇష్టపడలేదు
  rationale: אָבָהలోని సంకల్పం లేదా సమ్మతి అనే భావాన్ని నిలుపుతుంది.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: వారిని తన సన్నిధి నుండి తోసివేయలేదు
  rationale: ముఖము ఎదుటనుండి విసరడం అనే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో సంబంధాత్మక భావంతో అందిస్తుంది.
- source_word: עַד עָתָּה
  choice: ఇప్పటివరకు
  rationale: కథకుని ప్రస్తుత కాలం వరకు పరిస్థితి కొనసాగిందనే కాలసూచనను నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలోని నిబంధన నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా, Yahweh‌కు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: దైవిక కనికరానికి నిబంధన ఆధారం
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబుతో తనకున్న నిబంధనను బట్టి
  alternative: అబ్రాహాము, ఇస్సాకు, యాకోబుతో తనకున్న నిబంధన నిమిత్తం
  rationale: దేవుని కృపాపూర్వకమైన చర్య, నియంత్రణ పితరులతో చేసిన నిబంధనలో ఆధారపడినట్లు పాఠం చెబుతుంది; తరువాతి సిద్ధాంత వివరణలను ఇందులో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘కృప,’ ‘నిబంధన,’ ‘సన్నిధి’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచుతూ వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
