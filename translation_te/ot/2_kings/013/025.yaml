  text: וַ/יָּ֜שָׁב יְהוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז וַ/יִּקַּ֤ח אֶת הֶֽ/עָרִים֙ מִ/יַּד֙ בֶּן הֲדַ֣ד בֶּן חֲזָאֵ֔ל אֲשֶׁ֣ר לָקַ֗ח מִ/יַּ֛ד יְהוֹאָחָ֥ז אָבִ֖י/ו בַּ/מִּלְחָמָ֑ה שָׁלֹ֤שׁ פְּעָמִים֙ הִכָּ֣/הוּ יוֹאָ֔שׁ וַ/יָּ֖שֶׁב אֶת עָרֵ֥י יִשְׂרָאֵֽל־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: te
  text: 'యెహోయాహాజు కుమారుడైన యెహోయాషు, హజాయేలు కుమారుడైన బెన్‌హదదు చేతిలోనుండి ఆ పట్టణాలను తిరిగి స్వాధీనం చేసుకున్నాడు. బెన్‌హదదు యుద్ధంలో యెహోయాషు తండ్రియైన యెహోయాహాజు చేతిలోనుండి వాటిని స్వాధీనం చేసుకున్నాడు. యోవాషు[a] మూడుసార్లు అతనిని ఓడించి[b], ఇశ్రాయేలు పట్టణాలను తిరిగి ఇశ్రాయేలు ఆధీనంలోకి తెచ్చాడు.


    [a] ఈ వచనంలో ఒకే రాజు పేరుకు హీబ్రూ రెండు రూపాలను ఉపయోగిస్తుంది: మొదట “యెహోయాషు,” తరువాత “యోవాషు.”


    [b] అక్షరార్థంగా “అతనిని కొట్టాడు.” యుద్ధ సందర్భంలో ఈ హీబ్రూ క్రియకు “అతనిని ఓడించాడు” అనే అర్థం ఉండవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ వచనంలో ఒకే రాజు పేరుకు హీబ్రూ రెండు రూపాలను ఉపయోగిస్తుంది: మొదట “యెహోయాషు,” తరువాత “యోవాషు.”'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “అతనిని కొట్టాడు.” యుద్ధ సందర్భంలో ఈ హీబ్రూ క్రియకు “అతనిని ఓడించాడు” అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: తిరిగి స్వాధీనం చేసుకున్నాడు
  rationale: שוב లోని తిరిగి పొందే భావాన్ని “తిరిగి” ద్వారా, לקח లోని తీసుకోవడం/స్వాధీనం చేసుకోవడం భావాన్ని ప్రధాన క్రియ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; రెండు సమానార్థక క్రియలను అసహజంగా పేర్చదు.
- source_word: הֶעָרִים
  choice: ఆ పట్టణాలను
  rationale: మునుపు కోల్పోయిన నిర్దిష్ట నివాస కేంద్రాలను సూచిస్తుంది; ఆధునిక తెలుగులో “పట్టణాలు” సహజంగా ఉంటుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా ఆధీనాన్ని సూచించే హీబ్రూ నుడికారపు రూపాన్ని తెలుగులో కూడా అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: בֶּן־הֲדַד
  choice: బెన్‌హదదు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యంతరీకరణలో అందిస్తుంది.
- source_word: בַּמִּלְחָמָה
  choice: యుద్ధంలో
  rationale: మునుపటి పట్టణ నష్టం జరిగిన సైనిక సందర్భాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: మూడుసార్లు
  rationale: సంఖ్యా నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: הִכָּהוּ
  choice: అతణ్ణి ఓడించి
  rationale: נכה అక్షరార్థంగా కొట్టడాన్ని సూచించినా, ఇక్కడ పునరావృత యుద్ధ విజయాలను సూచించే సైనిక సందర్భంలో “ఓడించాడు” సహజం; అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: יוֹאָשׁ
  choice: యోవాషు
  rationale: వచనపు చివరి భాగంలో ఉన్న సంక్షిప్త హీబ్రూ నామరూపాన్ని ప్రతిబింబిస్తుంది; మొదటి యెహోయాషుతో ఒకే వ్యక్తి అని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పట్టణాలను తిరిగి స్వాధీనం చేసుకున్నాడు
  rationale: పట్టణాలు మళ్లీ ఇశ్రాయేలు అధీనంలోకి వచ్చిన ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: הִכָּהוּ అనే క్రియ యుద్ధంలో శారీరకంగా కొట్టడాన్నా లేక సైనికంగా ఓడించడాన్నా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో “ఓడించి”
  alternative: “అతణ్ణి కొట్టి”
  rationale: మూడుసార్లు జరిగిన యుద్ధ చర్యలు, పట్టణాల పునరుద్ధరణ అనే సందర్భం సైనిక పరాజయాన్ని సూచిస్తుంది; అయినా మూలపదపు విస్తృతిని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే చారిత్రక వర్ణనా శైలి. వ్యక్తిపేర్ల రెండు హీబ్రూ రూపాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. “చేతిలోనుండి” అనే బైబిలీయ నుడికారం అర్థవంతంగా ఉండటంతో సంరక్షించబడింది.
