- from: అయినా వారు యెరోబాము వంశం చేసిన పాపాలను విడిచిపెట్టలేదు. వాటి ద్వారా అతడు ఇశ్రాయేలును పాపం చేయించాడు; అతడు వాటిలోనే నడుచుకున్నాడు. అషేరా[a] కూడా సమరయలో నిలిచే ఉంది.
