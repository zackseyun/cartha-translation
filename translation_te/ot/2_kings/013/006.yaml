source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: te
  text: అయినా, వారు ఇశ్రాయేలును పాపం చేయించిన యెరోబాము ఇంటి పాపాలనుండి తొలగిపోలేదు; అతడు వాటిలోనే నడుచుకున్నాడు. అషేరా[a] కూడా సమరయలో నిలిచి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అషేరా స్తంభం.’ హీబ్రూ పదం కనానీయ దేవత అషేరాను గానీ, బహుశా ఇక్కడ ఉన్నట్లుగా, ఆమె ఆరాధనకు సంబంధించిన పూజావస్తువును గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయినా
  rationale: ముందటి వచనంలో చెప్పిన విమోచనకు, ఇక్కడ కొనసాగిన పాపానికి మధ్య ఉన్న వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: పాపాలను విడిచిపెట్టలేదు
  rationale: מִן‌తో వచ్చిన סור పాపపు ఆచారాలను వదిలి తొలగిపోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘విడిచిపెట్టలేదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בֵּית יָרָבְעָם
  choice: యెరోబాము వంశం
  rationale: ‘యెరోబాము ఇల్లు’ అనే అక్షరార్థం ఇక్కడ అతని రాజవంశం మరియు దానితో కొనసాగిన మతపరమైన వారసత్వాన్ని సూచిస్తుంది; తెలుగులో ‘వంశం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: వాటి ద్వారా అతడు ఇశ్రాయేలును పాపం చేయించాడు
  rationale: חטא హిఫీల్ రూపంలోని ‘పాపం చేయించు’ అనే కారణార్థాన్ని నిలుపుతుంది; సంబంధవాచక భాగంలోని సాధనార్థాన్ని ‘వాటి ద్వారా’ తెలియజేస్తుంది.
- source_word: בָּהּ הָלָךְ
  choice: అతడు వాటిలోనే నడుచుకున్నాడు
  rationale: הלך ב־ జీవన ప్రవర్తనలో అనుసరించడం లేదా కొనసాగడాన్ని సూచిస్తుంది. ‘నడుచుకున్నాడు’ బైబిలు శైలిలోని రూపకాన్ని నిలుపుతుంది; హీబ్రూలో ఏకవచన క్రియ ఉన్నందున ‘అతడు’ను అలాగే ఉంచి, పాపాల సమూహార్థాన్ని ‘వాటిలోనే’ తెలియజేస్తుంది.
- source_word: וְגַם
  choice: కూడా
  rationale: చివరి వాక్యంలోని అదనపు, గమనార్హమైన విషయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֲשֵׁרָה
  choice: అషేరా
  rationale: ఈ పదం కనానీయ దేవతను గానీ, ఆమె ఆరాధనకు సంబంధించిన పూజావస్తువును గానీ సూచించవచ్చు. మూలంలోని అనిశ్చితిని ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో వివరిస్తుంది.
- source_word: עָמְדָה
  choice: నిలిచే ఉంది
  rationale: ‘నిలిచింది’ అనే ప్రత్యక్ష చిత్రాన్నీ, అది అక్కడ కొనసాగి ఉందనే భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: రాజధాని నగరాన్ని సూచించే సహజమైన స్థానవాచక అనువాదం.
theological_decisions:
- issue: הָאֲשֵׁרָה పదం సూచించేది దేవతనా లేక పూజావస్తువా
  choice: ప్రధాన పాఠ్యంలో ‘అషేరా’ అని ఉంచి, పూజావస్తువు కావచ్చని పాదసూచికలో వివరించడం
  alternative: ‘అషేరా స్తంభం’ లేదా ‘అషేరా దేవత’ అని స్పష్టీకరించడం
  rationale: ‘సమరయలో నిలిచే ఉంది’ అనే సందర్భం నిలబెట్టిన పూజావస్తువును బలంగా సూచించినా, హీబ్రూ పదమే ఆ అర్థాన్ని తప్పనిసరిగా పరిమితం చేయదు. అందువల్ల నిజమైన అర్థసందిగ్ధతను నిలుపడం సముచితం.
- issue: בָּהּ הָלָךְ లోని ఏకవచన కర్త
  choice: హీబ్రూ ఏకవచనాన్ని అనుసరించి ‘అతడు వాటిలోనే నడుచుకున్నాడు’
  alternative: ముందున్న బహువచన కర్తకు అనుగుణంగా ‘వారు వాటిలోనే నడుచుకున్నారు’
  rationale: మసొరెటిక్ పాఠ్యంలో క్రియ ఏకవచనంలో ఉంది. దానిని బహువచనంగా సరిచేయకుండా, పాఠ్యంలోని ఉద్రిక్తతను నిలిపాము; సమీపంలోని పురుష ఏకవచన కర్త యెరోబాముతో దానిని అనుసంధానించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నడుచుకున్నాడు’ అనే రూపకం మూలంలోని జీవనప్రవర్తన భావాన్ని నిలుపుతుంది. ‘సమరయ’ సంప్రదాయ తెలుగు బైబిలు స్థలనామ రూపానికి అనుగుణంగా ఉంది.
