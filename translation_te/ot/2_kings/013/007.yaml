  source_fidelity: సైనిక జాబితాను ‘సైన్యం’గా అర్థం చేసుకోవడం సందర్భానికి, మూల హెబ్రీకి తగినదే. అయితే మొదటి వాక్యంలోని ‘అతడు’కు తెలుగులో స్పష్టమైన పూర్వపదం లేదు. చివరి ఉపమానంలో לָדוּשׁ నూర్పిడి/తొక్కివేత భావచిత్రాన్ని సూచిస్తుంది; ‘నూర్పిడిలో దుమ్ములా’ కంటే ‘నూర్పిడికి దుమ్ములా’ మూలంలోని ఉద్దేశ్యాత్మక-చిత్రాత్మక భావాన్ని మరింత నేరుగా ఇస్తుంది.
