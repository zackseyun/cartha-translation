source:
  edition: WLC
  text: כִּ֣י לֹא֩ הִשְׁאִ֨יר לִ/יהוֹאָחָ֜ז עָ֗ם כִּ֣י אִם חֲמִשִּׁ֤ים פָּֽרָשִׁים֙ וַ/עֲשָׂ֣רָה רֶ֔כֶב וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רַגְלִ֑י כִּ֤י אִבְּדָ/ם֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יְשִׂמֵ֥/ם כֶּֽ/עָפָ֖ר לָ/דֻֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: te
  text: ఎందుకంటే అరాము రాజు యెహోయాహాజుకు యాభైమంది గుర్రపు రౌతులు, పది రథాలు, పదివేలమంది కాలినడక సైనికులు తప్ప మరే సైన్యాన్నీ మిగల్చలేదు; అతడు వారిని నాశనం చేసి, నూర్పిడికి దుమ్ములా చేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తొక్కబడేందుకు దుమ్ములా చేశాడు.” హెబ్రీ పదం నూర్పిడిలో తొక్కబడే ధూళి భావచిత్రాన్ని సూచించవచ్చు.
    reason: לָדוּשׁ అనే హెబ్రీ రూపం నూర్పిడి లేదా తొక్కివేతతో సంబంధమైన భావచిత్రాన్ని కలిగి ఉంది; ఈ ప్రత్యామ్నాయం కారకార్థాన్ని జోడించకుండా ఆ అర్థఛాయను నిలుపుతుంది.
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: మిగలనివ్వలేదు
  rationale: హిఫీల్ రూపంలోని ‘మిగిలేలా చేయడం/మిగల్చడం’ అనే ఫలితార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָם
  choice: సైన్యం
  rationale: సాధారణంగా ‘ప్రజలు’ అని అర్థమయ్యే ఈ పదం ఇక్కడ గుర్రపు రౌతులు, రథాలు, కాల్బల సైనికులు అనే సైనిక జాబితా కారణంగా సందర్భానుసారంగా ‘సైన్యం’ను సూచిస్తుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: నిరాకరణ తరువాత మిగిలిన ఏకైక పరిమితిని తెలిపే హెబ్రీ ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: פָּרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: గుర్రాలపై యుద్ధం చేసే సైనికులను స్పష్టంగా సూచించే సుపరిచితమైన తెలుగు పదబంధం.
- source_word: רֶכֶב
  choice: రథాలు
  rationale: ఏకవచన రూపం సమూహార్థకంగా ఉండగలిగినా, సంఖ్యతో కలిసి ఇక్కడ పది యుద్ధ రథాలను సూచిస్తుంది.
- source_word: רַגְלִי
  choice: కాల్బల సైనికులు
  rationale: కాలినడకన పోరాడే సైనికులనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִבְּדָם
  choice: వారిని నాశనం చేసి
  rationale: పియేల్ రూపంలోని బలమైన విధ్వంస భావాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది.
- source_word: וַיְשִׂמֵם
  choice: వారిని … చేశాడు
  rationale: తదుపరి ఉపమానంతో కలిసి ఒక స్థితికి చేర్చడం అనే שׂים క్రియార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: כֶּעָפָר
  choice: దుమ్ములా
  rationale: పూర్తిగా అణచివేయబడిన స్థితిని సూచించే మూలపాఠంలోని ఉపమానాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: לָדוּשׁ
  choice: నూర్పిడిలో
  rationale: דושׁ క్రియలోని ధాన్యాన్ని తొక్కి నూర్చే వ్యవసాయ భావచిత్రాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘తొక్కించడానికి’ అనే అర్థఛాయ కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సైనిక పదజాలాన్ని సందర్భానికి తగినంత స్పష్టంగా ఉంచి, చివరి నూర్పిడి భావచిత్రంలోని నిజమైన భాషాపరమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
