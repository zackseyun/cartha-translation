  terminology: యెహోయాహాజు, అరాము, గుర్రపు రౌతులు, రథాలు అనే పేర్లు/పదాలు సముచితంగా ఉన్నాయి. ‘సైన్యం’ అనేది עָםకు ఇక్కడి సైనిక సందర్భంలో సరైన అనువాదం. పాదసూచికలోని ‘తొక్కించడానికి’ అనేది తెలుగులో అనవసరమైన కారక భావాన్ని కలిగించగలదు; ‘తొక్కబడేందుకు’ లేదా ‘నూర్పిడికి’ మెరుగైనది.
