reference: 2 Kings 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: యెహోయాహాజు ఇతర కార్యాలు, అతడు చేసినదంతా, అతని పరాక్రమం[b]—ఇవన్నీ ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథంలో[a] వ్రాయబడి లేవా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘పరాక్రమం’ అనే పదాన్ని ‘బలం,’ ‘శౌర్యం,’ లేదా ‘పరాక్రమ కార్యాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: యెహోయాహాజు చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనాసారాంశాల్లో דִּבְרֵי అనేది కేవలం మాటలను కాకుండా రాజుకు సంబంధించిన కార్యాలు, విషయాలను సూచిస్తుంది. తెలుగు సహజత్వం కోసం సంబంధాన్ని ‘చేసిన’తో వ్యక్తం చేశాం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: హీబ్రూ సంబంధవాక్యంలోని విస్తృత అర్థాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో నిలుపుతుంది.
- source_word: וּגְבוּרָתוֹ
  choice: అతని పరాక్రమం
  rationale: גְּבוּרָה బలం, శౌర్యం లేదా శక్తిమంతమైన కార్యాలను సూచించగలదు. ‘పరాక్రమం’ ఈ అర్థవిస్తృతిని సందర్భానుకూలంగా నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ఇవి ... రాయబడి ఉన్నాయి కదా?
  rationale: הֲלוֹא ప్రవేశపెట్టే అలంకారప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, బహువచన సూచనను ‘ఇవి’తో నిలుపుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సూత్రప్రయోగంలో తెలుగులో ‘గ్రంథంలో’ సహజమైన సమానార్థకం.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథం
  rationale: דִּבְרֵי הַיָּמִים రాజుల పాలనకు సంబంధించిన కాలక్రమ వృత్తాంతాలు లేదా వార్షిక నమోదులను సూచిస్తుంది. ‘వృత్తాంతాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలంలోని పత్రసంబంధ భావాన్ని కాపాడుతుంది.
