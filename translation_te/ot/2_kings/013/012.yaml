id: 2KI.13.12
reference: 2 Kings 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: యోవాషు గురించిన మిగిలిన విషయాలు, అతడు చేసినవన్నీ, యూదా రాజైన అమజ్యాతో యుద్ధం చేయడంలో అతడు చూపిన పరాక్రమం[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[b] రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘అమజ్యాతో యుద్ధం చేసిన అతని పరాక్రమం.’ ఇక్కడ ‘తో’ అనే హీబ్రూ విభక్తి యుద్ధ సందర్భంలో ప్రత్యర్థితో తలపడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’ అనేది రాజుల గ్రంథంలో ప్రస్తావించబడే రాజవృత్తాంతాల మూలం; ఇది బైబిలులోని ‘దినవృత్తాంతములు’ గ్రంథం కాదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: యోవాషు గురించిన మిగిలిన విషయాలు
  rationale: రాజుల పాలనాసారాంశాల్లో דִּבְרֵי అనేది కేవలం ‘మాటలు’ కాక, రాజుకు సంబంధించిన కార్యాలు లేదా విషయాలను సూచిస్తుంది. ‘మిగిలిన విషయాలు’ అనే పదబంధం ఈ సూత్రప్రాయ వాడుకను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినవన్నీ
  rationale: כָל యొక్క సమగ్ర భావాన్నీ, עָשָׂה యొక్క విస్తృత అర్థాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וּגְבוּרָתוֹ
  choice: అతడు చూపిన పరాక్రమం
  rationale: גְּבוּרָה బలం, శౌర్యం, పరాక్రమం అనే భావాలను కలిగి ఉంది. యుద్ధ సందర్భంలో ‘పరాక్రమం’ సహజంగా ఉంటుంది; ‘చూపిన’ అనేది తరువాతి సంబంధవాక్యంతో దాని అనుబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: యుద్ధం చేయడంలో
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినప్పటికీ, యుద్ధ సందర్భంలో ప్రత్యర్థితో పోరాడటాన్ని సూచిస్తుంది. ‘యుద్ధం చేయడంలో’ అనే రూపం పరాక్రమం మరియు యుద్ధం మధ్యనున్న సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన అమజ్యాతో
  rationale: వ్యక్తి పేరు, రాజబిరుదు, యుద్ధ సంబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాసి ఉన్నాయి కదా?
  rationale: హీబ్రూ అలంకారప్రశ్న రూపాన్నీ, బహువచన సూచననూ కాపాడుతుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో
  rationale: עַל‌ను లిఖిత మూలం విషయంలో సహజమైన తెలుగు స్థలవాచక రూపమైన ‘గ్రంథంలో’గా, దస్తావేజు శీర్షికను ‘దినవృత్తాంతాల గ్రంథం’గా అందిస్తుంది.
theological_decisions:
- issue: పోరాటంలో עִם యొక్క సంబంధార్థం
  choice: అమజ్యాతో యుద్ధం చేయడంలో
  alternative: అమజ్యాతో కలిసి యుద్ధం చేయడంలో
  rationale: ఇక్కడ సందర్భం ఇద్దరు రాజుల మధ్య శత్రుత్వపూర్వక పోరాటాన్ని సూచిస్తుంది; ‘తో’ అనేది సహచర్యంగా అపార్థం కాకుండా ‘యుద్ధం చేయడంలో’ అని అనువదించబడింది.
- issue: దినవృత్తాంతాల గ్రంథం యొక్క గుర్తింపు
  choice: రాజుల కాలానికి చెందిన రాజవృత్తాంత మూలంగా ఉంచడం
  alternative: బైబిలులోని దినవృత్తాంతములు గ్రంథంగా గుర్తించడం
  rationale: రాజుల గ్రంథంలో ఉటంకించబడే ఈ మూలం రాజసంబంధమైన వృత్తాంత గ్రంథం; దానిని కానానికల్ దినవృత్తాంతములు గ్రంథంతో సమానం చేయడానికి మూలపాఠం ఆధారం ఇవ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే చారిత్రక వచనశైలి ఉపయోగించబడింది. హీబ్రూ రాజసారాంశపు పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, అలంకారప్రశ్నను ‘కదా?’ రూపంలో కాపాడాం.
