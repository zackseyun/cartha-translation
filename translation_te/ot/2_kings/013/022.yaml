translation:
  language: te
  text: అరాము[a] రాజైన హజాయేలు, యెహోయాహాజు కాలమంతా ఇశ్రాయేలును అణచివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అరాము’; కొన్ని సంప్రదాయ అనువాదాల్లో ‘సిరియా’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: హజాయేలు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం. ఆరంభంలోని వావ్ కథనాన్ని కొనసాగిస్తుంది; తెలుగులో సహజమైన వాక్యప్రవాహం ద్వారా దాని పని వ్యక్తమవుతుంది కాబట్టి అదనంగా ‘అప్పుడు’ లేదా ‘ఇక’ చేర్చలేదు.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజైన
  rationale: హీబ్రూ స్థలనామమైన אֲרָםను ‘అరాము’గా ఉంచి, నిర్మాణబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: לָחַץ
  choice: అణచివేశాడు
  rationale: ఈ క్రియ ఇక్కడ నిరంతర రాజకీయ-సైనిక పీడనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అణచివేశాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ప్రత్యక్ష కర్మ సూచికతో ఉన్న జాతి/రాజ్యనామాన్ని తెలుగులో కర్మరూపంగా అనువదించాం; సందర్భంలో ఇది ఉత్తర రాజ్యాన్ని సూచిస్తుంది.
- source_word: כֹּל יְמֵי
  choice: కాలమంతా
  rationale: ‘దినాలన్నీ’ అనే అక్షరార్థం కంటే, పూర్తి వ్యవధిని సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో ‘కాలమంతా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
