translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యెహోయాహాజు కాలమంతా’ అనే రూపం సందర్భానికి తగిన పూర్తి వ్యవధిని తెలుపుతూ, అది అతని జీవితకాలమా లేక పాలనాకాలమా అన్న విషయాన్ని అనవసరంగా నిర్ధారించదు.
