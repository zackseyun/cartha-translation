  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: te
  text: అతడు యహ్వే దృష్టిలో చెడ్డదాన్ని చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యెరోబాము పాపాలను అనుసరించాడు; వాటి నుండి తొలగిపోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దాని నుండి తొలగిపోలేదు.” హీబ్రూలోని ప్రత్యయం స్త్రీలింగ ఏకవచనంలో ఉంది; అది బహుశా యెరోబాము పాపపు విధానాన్ని సమష్టిగా సూచిస్తుంది.
    reason: మూలంలోని ఏకవచన ప్రత్యయాన్ని ప్రధాన పాఠ్యంలో సందర్భానుసారంగా బహువచనంగా వ్యక్తం చేసిన విషయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: హీబ్రూ కథనంలోని వరుస క్రియను సహజమైన ఆధునిక తెలుగు వాక్యంగా అందించింది; వాక్యారంభంలోని וַ־ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా కథన క్రమం నిలిచింది.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: యహ్వే దృష్టిలో చెడ్డదాన్ని
  rationale: రాజుల గ్రంథంలో తరచుగా వచ్చే నైతిక మూల్యాంకన సూత్రాన్ని సహజమైన తెలుగులో ఉంచుతూ, ‘దృష్టిలో’ అనే రూపంతో హీబ్రూ రూపకాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: וַיֵּלֶךְ אַחַר
  choice: మార్గంలోనే నడిచాడు
  rationale: ‘వెనుక నడిచాడు/అనుసరించాడు’ అనే హీబ్రూ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ నడక-మార్గ రూపకాన్ని కూడా నిలిపింది; ‘నే’ కొనసాగింపుపై వాక్యంలోని గట్టిపట్టును తెలియజేస్తుంది.
- source_word: חַטֹּאת
  choice: పాపాలు
  rationale: మూలంలోని బహువచన రూపాన్ని నిలిపి, యరొబాము నెలకొల్పిన పాపకార్యాలు లేదా పాపపు విధానాన్ని సూచిస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించింది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థాన్ని నేరుగా తెలియజేస్తుంది; యరొబాము ఇశ్రాయేలును పాపానికి నడిపించిన బాధ్యతను తగ్గించదు.
- source_word: לֹא סָר מִמֶּנָּה
  choice: వాటినుండి తొలగిపోలేదు
  rationale: סור యొక్క ‘తొలగిపోవడం/విడిచిపెట్టడం’ భావాన్ని ఉంచింది. హీబ్రూ ప్రత్యయం స్త్రీలింగ ఏకవచనమైనప్పటికీ, సందర్భంలోని యరొబాము పాపాలను సమష్టిగా సూచిస్తుందని భావించి ప్రధాన పాఠ్యంలో సహజమైన బహువచనం వాడింది; రూప సంబంధిత భేదాన్ని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలానికి సన్నిహితంగా ఉంటుంది.
- issue: מִמֶּנָּהలోని స్త్రీలింగ ఏకవచన ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘వాటినుండి’ అని, యరొబాము పాపాలను సమష్టిగా సూచించేలా అనువదించడం
  alternative: ‘దానినుండి’ లేదా ‘ఆ పాపపు విధానం నుండి’
  rationale: ప్రత్యయం వ్యాకరణపరంగా ఏకవచనమైనప్పటికీ, సమీపంలోని חַטֹּאת అనే పాపాల సమూహాన్ని లేదా మొత్తం పాపపు విధానాన్ని సమష్టిగా సూచించగలదు. బహువచనం తెలుగులో భావాన్ని స్పష్టంగా చేస్తుంది; ఏకవచన రూపాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యహ్వే దృష్టిలో’ మరియు ‘పాపాల మార్గంలో నడిచాడు’ అనే రూపాలు రాజుల గ్రంథంలోని మూల మూల్యాంకన సూత్రాన్నీ నడక రూపకాన్నీ పాఠకులకు అర్థమయ్యే విధంగా నిలుపుతాయి.
