revisions:
- from: అతడు యహ్వే దృష్టిలో చెడ్డదాన్ని చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యరొబాము పాపాల మార్గంలోనే నడిచాడు; వాటినుండి తొలగిపోలేదు.[a]
  to: అతడు యహ్వే దృష్టిలో చెడ్డదాన్ని చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యెరోబాము పాపాలను అనుసరించాడు; వాటి నుండి తొలగిపోలేదు.[a]
  rationale: సవరణ ‘మార్గంలోనే నడిచాడు’ స్థానంలో ‘పాపాలను అనుసరించాడు’ అని ఉంచి, וַיֵּלֶךְ אַחַר యొక్క అనుసరణ భావాన్ని మరింత నేరుగా, అనవసర నొక్కింపు లేకుండా అందిస్తుంది. యెరోబాము అనే తెలుగు బైబిలు-సంప్రదాయ పేరు-రూపం వాడబడింది. స్త్రీలింగ ఏకవచన ప్రత్యయంపై ఉన్న పాదసూచిక ప్రధాన పాఠ్యంలోని సందర్భానుగుణ బహువచనాన్ని పారదర్శకంగా వివరిస్తూనే, మూలంలోని సూచనను నిర్దిష్టంగా తీర్మానించదు.
