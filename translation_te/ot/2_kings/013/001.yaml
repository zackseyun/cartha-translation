  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: te
  text: యూదా రాజైన అహజ్యా కుమారుడు యోవాషు పరిపాలన ఇరవై మూడవ సంవత్సరంలో, యెహూ కుమారుడు యెహోయాహాజు షోమ్రోనులో ఇశ్రాయేలుపై పరిపాలన ప్రారంభించి పదిహేడు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: పాలించడం మొదలుపెట్టి
  rationale: ఈ రాజ్యారంభ సూత్రవాక్యంలో మాలక్ క్రియ కొత్త రాజు పాలన ప్రారంభాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి సహజంగా ఉండేలా ‘పాలించడం మొదలుపెట్టి’ అని అనువదించాం.
- source_word: עַל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాలించడం
  rationale: హీబ్రూ ‘ఇశ్రాయేలు మీద రాజ్యమేలాడు’ అనే భావాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: ఇది యెహోయాహాజు పరిపాలించిన రాజధాని/స్థలాన్ని సూచిస్తుంది; మూలంలోని స్థానసూచనను నిలిపాం.
theological_decisions: []
