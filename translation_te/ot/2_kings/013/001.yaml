  register: ఆధునిక ప్రామాణిక తెలుగు; రాజుల గ్రంథంలోని కాలక్రమ సూత్రవాక్య శైలిని గౌరవిస్తూ, సాధారణ పాఠకులకు స్పష్టంగా మరియు గంభీరంగా రూపొందించబడింది.
