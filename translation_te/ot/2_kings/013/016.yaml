source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: te
  text: అప్పుడు అతడు ఇశ్రాయేలు రాజుతో, “విల్లుమీద నీ చెయ్యి ఉంచు[a]” అన్నాడు. అతడు తన చెయ్యి దానిమీద ఉంచాడు. అప్పుడు ఎలీషా తన చేతులను రాజు చేతుల మీద ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విల్లుపై నీ చెయ్యి ఉంచు.”
    reason: ‘విల్లుమీద’కు సమానమైన స్థానసంబంధ పదప్రయోగ ప్రత్యామ్నాయం; ఆంగ్ల audit trailలోని ‘upon’ ప్రత్యామ్నాయాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: הַרְכֵּב
  choice: ఉంచు
  rationale: רכב అనే ధాతువు హిఫీల్ ఆజ్ఞారూపంలో ఇక్కడ చెయ్యిని విల్లుమీద పెట్టే చర్యను సూచిస్తుంది. అక్షరార్థమైన ‘ఎక్కించు’ కంటే ‘ఉంచు’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భంలోని శారీరక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָדְךָ עַל־הַקֶּשֶׁת
  choice: విల్లుమీద నీ చెయ్యి
  rationale: עַל సూచించే స్థాన సంబంధాన్ని సహజమైన తెలుగు పదమైన ‘మీద’తో వ్యక్తం చేశాం; పదక్రమాన్ని తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా మార్చాం.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: అతడు తన చెయ్యి దానిమీద ఉంచాడు
  rationale: హీబ్రూలో ‘విల్లు’ మళ్లీ చెప్పబడకపోయినా, తెలుగులో ‘దానిమీద’ చేర్చడం ద్వారా ముందున్న విల్లును సహజంగా సూచించి చర్యను స్పష్టం చేస్తుంది.
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: శారీరకంగా చేతులను రాజు చేతుల మీద పెట్టిన చర్యను వ్యాఖ్యానం జోడించకుండా సాధారణంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: తన చేతులను రాజు చేతుల మీద
  rationale: ఎలీషా చేతులకూ రాజు చేతులకూ మూలపాఠంలో ఉన్న బహువచనాన్ని నిలిపి, ఆ చర్య యొక్క స్పష్టమైన దృశ్యాన్ని కాపాడాం.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: అప్పుడు అతడు ఇశ్రాయేలు రాజుతో ... అన్నాడు
  rationale: కథన క్రమాన్ని ‘అప్పుడు’ సహజంగా సూచిస్తుంది. మూలపాఠంలో ఈ క్రియ వద్ద కర్త పేరు మళ్లీ చెప్పబడలేదు కాబట్టి ‘అతడు’ అని ఉంచి సందర్భసంబంధాన్ని కాపాడాం.
theological_decisions:
- issue: ఎలీషా తన చేతులను రాజు చేతుల మీద ఉంచిన చర్య యొక్క ప్రాముఖ్యత
  choice: చర్యను ఉన్నట్లుగా మాత్రమే అనువదించి, దాని సంకేతార్థాన్ని ప్రధాన వచనంలో చేర్చలేదు.
  alternative: దీనిని ప్రవక్త ఇచ్చిన శక్తిగా లేదా యుద్ధంలో దేవుని మార్గదర్శకత్వానికి సూచనగా నేరుగా వివరించడం.
  rationale: ఈ చర్యకు సందర్భంలో సంకేతార్థం ఉండవచ్చు; అయితే ఈ వచనం దానిని స్వయంగా వివరించదు. అందువల్ల వ్యాఖ్యానాన్ని అనువాదంలో కలపకుండా ఉన్న ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘చెయ్యి’ సాధారణ పాఠకులకు సహజంగా ఉండగా, బహువచనంలో ‘చేతులు’ వ్యాకరణపరంగా సులభంగా ప్రవహిస్తుంది. మూలపాఠంలోని చర్యను స్పష్టంగా ఉంచి దాని సంకేతార్థాన్ని వివరించలేదు.
