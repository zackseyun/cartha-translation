  text: וַ/יַּגֵּ֤ד הַ/צֹּפֶה֙ לֵ/אמֹ֔ר בָּ֥א עַד אֲלֵי/הֶ֖ם וְ/לֹֽא שָׁ֑ב וְ/הַ/מִּנְהָ֗ג כְּ/מִנְהַג֙ יֵה֣וּא בֶן נִמְשִׁ֔י כִּ֥י בְ/שִׁגָּע֖וֹן יִנְהָֽג־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: te
  text: 'కాపలాదారుడు ఇలా నివేదించాడు: “అతడు వారి దగ్గరికి చేరుకున్నాడు, కానీ తిరిగి రాలేదు. నడిపే తీరు నిమ్షీ కుమారుడైన యెహూ నడిపే తీరులా ఉంది; అతడు ఉన్మాదంగా నడుపుతాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పిచ్చివాడిలా నడుపుతాడు,” లేక “పిచ్చిగా నడుపుతాడు.” హీబ్రూ పదబంధం యెహూ రథాన్ని వెర్రెత్తినట్లు, అదుపులేకుండా నడిపే తీరును నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד הַצֹּפֶה
  choice: కాపలాదారుడు ఇలా నివేదించాడు
  rationale: నגד అనే క్రియ ఇక్కడ కాపలా విధిలో ఉన్న వ్యక్తి రాజుకు సమాచారాన్ని తెలియజేయడాన్ని సూచిస్తుంది; ‘నివేదించాడు’ సైనిక-రాజసభ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: అతడు వారి దగ్గరికి చేరుకున్నాడు
  rationale: בוא తో עַד אֶל కలయిక ఆ గుంపు వరకు వచ్చి చేరడాన్ని సూచిస్తుంది.
- source_word: וְלֹא שָׁב
  choice: కానీ తిరిగి రాలేదు
  rationale: שׁוב అంటే తిరిగి రావడం; సందర్భంలో దూత ఇంకా తిరిగి రాలేదనే ప్రస్తుత ఫలితాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: నడిపే తీరు ... నడిపే తీరులా
  rationale: మూలంలోని పునరుక్తిని సాధ్యమైనంతగా నిలుపుతూ, రథసంచార సందర్భంలో מִנְהָג సూచించే నడిపే విధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: నిమ్షీ కుమారుడైన యెహూ
  rationale: హీబ్రూ వ్యక్తిపేర్లను ఆధునిక తెలుగు లిపిలో ధ్వన్యనుసారంగా అందించి, patronymic సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: అతడు ఉన్మాదంగా నడుపుతాడు
  rationale: בְשִׁגָּעוֹן అనేది పిచ్చితనం లేదా ఉన్మత్తమైన ప్రవర్తనను సూచించే నామవాచకాధారిత క్రియావిశేషణ ప్రయోగం. ‘ఉన్మాదంగా’ అనే పదం వేగం మాత్రమే కాక అదుపులేని, వెర్రెత్తిన నడిపే తీరును కూడా తెలియజేస్తుంది.
