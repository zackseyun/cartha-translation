id: 2KI.9.23
reference: 2 Kings 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּהֲפֹ֧ךְ יְהוֹרָ֛ם יָדָ֖י/ו וַ/יָּנֹ֑ס וַ/יֹּ֥אמֶר אֶל אֲחַזְיָ֖הוּ מִרְמָ֥ה אֲחַזְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: te
  text: 'అప్పుడు యెహోరాము తన చేతులను తిప్పి[a] పారిపోయాడు. అతడు అహజ్యాతో ఇలా అన్నాడు: “ద్రోహం[b], అహజ్యా!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన చేతులను తిప్పాడు.” ఈ వ్యక్తీకరణ బహుశా చేతులతో పగ్గాలను నడిపి రథాన్ని మళ్లించడాన్ని సూచిస్తుంది; అయితే ఇక్కడ హీబ్రూ పాఠం పగ్గాలను గానీ రథాన్ని గానీ స్పష్టంగా పేర్కొనదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మోసం, అహజ్యా!”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: తిప్పి
  rationale: הפך అనే క్రియకు ప్రాథమికంగా ‘తిప్పు’ అనే అర్థం ఉంది. రథాన్ని వెనక్కి తిప్పిన సందర్భం సూచితమైనా, మూలపాఠంలో రథం లేదా పగ్గాలు స్పష్టంగా లేవు కాబట్టి వాటిని ప్రధాన వచనంలో చేర్చలేదు.
- source_word: יָדָיו
  choice: తన చేతులను
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా బహువచనంలో ‘అతని చేతులు’ అని ఉంది. ఇది పగ్గాలను ఉపయోగించి రథాన్ని తిప్పడాన్ని సూచించే అవకాశం ఉన్నా, ‘చేతులు’ అనే స్పష్టమైన రూపాన్ని నిలిపాం.
- source_word: וַיָּנֹס
  choice: పారిపోయాడు
  rationale: నారేటివ్ సందర్భంలో נוס భయంతో లేదా ప్రమాదం నుంచి పారిపోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పారిపోయాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִרְמָה
  choice: మోసం
  rationale: מִרְמָהకు మోసం, కపటం, ద్రోహం అనే భావపరిధి ఉంది. ‘మోసం’ మూలపదంలోని విస్తృత భావాన్ని నిలుపుతుంది; రాజద్రోహం వంటి మరీ నిర్దిష్టమైన రాజకీయ అర్థాన్ని రుద్దదు.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: అహజ్యా
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరమైన బైబిలు లిప్యంతరీకరణకు దగ్గరగా ఇచ్చాం. చివర ప్రత్యక్ష సంబోధనలో పేరును పునరుక్తి చేయడం మూలపాఠంలోని ఆవేశాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ ... אֲחַזְיָה
  choice: అతడు అహజ్యాతో, “మోసం, అహజ్యా!” అన్నాడు
  rationale: అహజ్యాకు చెప్పి, అతని పేరునే మళ్లీ సంబోధనగా పలికిన హీబ్రూ నిర్మాణాన్ని, దాని అత్యవసర స్వరాన్ని నిలిపాం.
