translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సంక్షిప్తత, హఠాత్తు ప్రమాదాన్ని తెలిపే వేగం ఉంచాం. ‘తన చేతులను తిప్పి’ అనే హీబ్రూ వ్యక్తీకరణ తెలుగులో కొంత అసాధారణంగా ఉన్నప్పటికీ మూలంలోని స్పష్టమైన పదాలను నిలిపి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
