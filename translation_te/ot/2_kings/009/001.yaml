source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: te
  text: అప్పుడు ప్రవక్త ఎలీషా ప్రవక్తల కుమారుల్లో ఒకరిని[b] పిలిచి అతనితో, “నీ నడుము బిగించుకో[a], ఈ నూనె సీసాను నీ చేతిలో తీసుకుని రామోత్-గిలాదుకు వెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ నడుము కట్టుకో.” పొడవాటి వస్త్రాన్ని నడుము దగ్గర బిగించి చర్యకు లేదా ప్రయాణానికి సిద్ధపడడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రవక్తల కుమారుల్లో.” ఇది సాధారణంగా ప్రవక్తల సమూహానికి చెందిన సభ్యులను సూచిస్తుంది; వారు తప్పనిసరిగా ప్రవక్తల సొంత కుమారులు కారు.
    reason: cultural_note
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: అప్పుడు ప్రవక్త ఎలీషా
  rationale: వావ్ సంధి కథనాన్ని ముందుకు నడిపే భావాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది; הַנָּבִיאను ఎలీషాకు నిర్దిష్టమైన బిరుదుగా ఉంచింది.
- source_word: קָרָא לְאַחַד
  choice: ఒకణ్ణి పిలిచి
  rationale: ‘ఒకరిని పిలిచాడు’ అనే ప్రాథమిక భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో మాటల పరిచయంతో కలిపింది.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: ప్రవక్తల శిష్యుల్లో
  rationale: అక్షరార్థమైన ‘ప్రవక్తల కుమారులు’ జీవసంబంధ కుమారులని తప్పుగా సూచించవచ్చు; ఇక్కడ ప్రవక్తల సమూహంలో శిక్షణ పొందే సభ్యులను సూచించే స్థిరప్రయోగాన్ని ‘శిష్యులు’ సహజంగా అందిస్తుంది. అక్షరరూపం పాదసూచికలో ఇచ్చింది.
- source_word: וַיֹּאמֶר לוֹ
  choice: అతనితో … అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ మాటల పరిచయాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: నీ నడుము బిగించుకో
  rationale: ప్రయాణానికి లేదా చర్యకు సిద్ధమవడానికి పొడవాటి వస్త్రాన్ని నడుము దగ్గర బిగించే దృశ్యాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే రూపం.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: ఈ నూనె సీసాను
  rationale: פַּךְ నూనె వంటి ద్రవం ఉంచే చిన్న పాత్రను సూచిస్తుంది; ‘సీసా’ సాధారణ పాఠకుడికి స్పష్టమైన, సంక్షిప్త సమానార్థకం.
- source_word: בְּיָדֶךָ
  choice: నీ చేతిలో
  rationale: మూలంలోని స్పష్టమైన శరీర సంబంధ చిత్రణను సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: וְלֵךְ רָמֹת גִּלְעָד
  choice: గిలాదులోని రామోతుకు వెళ్లు
  rationale: స్థలనామాన్ని తెలుగు పాఠకుడికి సహజమైన సంబంధ నిర్మాణంతో అందిస్తుంది; ఆజ్ఞారూపాన్ని నేరుగా ఉంచుతుంది.
theological_decisions:
- issue: ‘ప్రవక్తల కుమారులు’ అనే సమూహపదం యొక్క అర్థం
  choice: ప్రవక్తల శిష్యులు
  alternative: ప్రవక్తల కుమారులు
  rationale: ఇది జీవసంబంధాన్ని తప్పనిసరిగా చెప్పదు; ప్రవక్తల సమూహానికి చెందిన సభ్యులు లేదా శిష్యులను సూచిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో అర్థాన్ని స్పష్టంచేసి, అక్షరార్థాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ నుడికారంలోని స్పష్టమైన దృశ్యాన్ని ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు నిలిపి, దాని అక్షరార్థం మరియు సాంస్కృతిక నేపథ్యాన్ని పాదసూచికల్లో వివరించింది. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల వెంట ఉంచింది.
