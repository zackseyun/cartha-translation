id: 2KI.9.22
reference: 2 Kings 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: te
  text: యెహోరాము యేహూను చూడగానే, “యేహూ, శాంతేనా?” అని అడిగాడు. అందుకు యేహూ, “నీ తల్లి యెజెబెలు వేశ్యాచారాలు[a], ఆమె అనేక మంత్రవిద్యలు కొనసాగుతున్నంతకాలం శాంతి ఎలా ఉంటుంది?[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ తల్లి యెజెబెలు వ్యభిచారాలు.’ హీబ్రూ పదం అక్షరార్థ, రూపకార్థ ఛాయలు రెండింటినీ కలిగి ఉండవచ్చు; నైతిక, ఆరాధనా అవిశ్వాసాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏమి శాంతి?’ యెహోరాము ప్రశ్నలోని ‘శాంతి’ అనే పదాన్నే హీబ్రూ ఇక్కడ వ్యంగ్యాత్మక ప్రభావం కోసం పునరావృతం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: యెహోరాము యేహూను చూసినప్పుడు ఇలా జరిగింది
  rationale: హీబ్రూ కథన సూత్రాన్ని పూర్తిగా వదలకుండా, ఆధునిక తెలుగులో సహజంగా వినిపించేలా ‘ఇలా జరిగింది’ అని ఉంచబడింది.
- source_word: הֲשָׁלוֹם
  choice: శాంతేనా?
  rationale: ఇది శాంతియుత ఉద్దేశం లేదా క్షేమాన్ని ప్రశ్నించే మాట. తరువాతి జవాబులోని అదే పదపు పునరుక్తిని నిలుపుకోవడానికి ‘శాంతి’ అనే నామవాచకమే ఉపయోగించబడింది.
- source_word: מָה הַשָּׁלוֹם
  choice: శాంతి ఎలా ఉంటుంది?
  rationale: ప్రస్తుత పరిస్థితుల్లో శాంతి అసాధ్యమని తెలిపే అలంకారిక ప్రశ్నను సహజ తెలుగులో వ్యక్తం చేస్తూ, మొదటి ప్రశ్నలోని ‘శాంతి’ పదాన్ని పునరావృతం చేస్తుంది.
- source_word: עַד
  choice: కొనసాగుతున్నంతకాలం
  rationale: యెజెబెలు చర్యలు కొనసాగుతున్న కాలమంతా శాంతి ఉండదనే కాలవ్యాప్తి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זְנוּנֵי
  choice: వేశ్యాచారాలు
  rationale: మూలంలోని ఉద్దేశపూర్వకంగా కఠినమైన రూపకాన్ని నిలుపుతుంది; ఇది అక్షరార్థ లైంగిక ప్రవర్తనతో పాటు నైతిక, ఆరాధనా అవిశ్వాసాన్ని కూడా సూచించగలదు.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: నీ తల్లి యెజెబెలు
  rationale: మూలంలోని నేరుగా నిందించే పదక్రమం, సంబోధనా తీవ్రత సాధ్యమైనంతవరకు నిలుపబడింది.
- source_word: וּכְשָׁפֶיהָ
  choice: ఆమె మంత్రవిద్యలు
  rationale: మాంత్రిక లేదా క్షుద్ర ఆచారాలను సూచించే బహువచన భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: הָרַבִּים
  choice: అనేక
  rationale: యెజెబెలు మంత్రవిద్యల విస్తారాన్ని సూచించే విశేషణ బలాన్ని సరళంగా నిలుపుతుంది.
theological_decisions:
- issue: זְנוּנֵי అనే పదాన్ని అక్షరార్థ రూపకంగా ఉంచాలా, లేక సాధారణ నైతిక లేదా మతపరమైన పదంగా మృదువుగా అనువదించాలా
  choice: ‘వేశ్యాచారాలు’ అని కఠిన రూపకాన్ని నిలుపడం
  alternative: వ్యభిచారాలు; లైంగిక దుర్నీతి; విగ్రహారాధనలు
  rationale: ఈ చారిత్రక, ధార్మిక సందర్భంలో పదానికి లైంగిక, నైతిక, ఆరాధనా అవిశ్వాస భావాలు కలిసివుండవచ్చు. ‘విగ్రహారాధనలు’ వంటి సన్నని వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని ఉద్రేకాన్ని, బహుఅర్థకతను కాపాడుతుంది.
- issue: שָׁלוֹם ను రెండు చోట్లా ఒకే పదంతో అనువదించాలా
  choice: రెండు చోట్లా ‘శాంతి’ అని అనువదించడం
  alternative: క్షేమం; అంతా క్షేమమేనా; సురక్షితమేనా
  rationale: యెహోరాము ప్రశ్నలోనూ యేహూ జవాబులోనూ ఉన్న పదపునరుక్తి, వ్యంగ్య విరుద్ధత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘శాంతి’ పదపు పునరుక్తి, యేహూ జవాబులోని తీవ్రత, ‘వేశ్యాచారాలు’ అనే రూపకంలోని ఉద్దేశపూర్వక కఠినత్వం నిలుపబడ్డాయి. మూలంలో స్పష్టమైన క్రియ లేని చివరి కాలవాచక నిర్మాణాన్ని తెలుగులో సంపూర్ణంగా చేయడానికి ‘కొనసాగుతున్నంతకాలం’ ఉపయోగించబడింది.
