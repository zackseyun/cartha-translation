- from: 'యెహోరాము యేహూను చూసినప్పుడు ఇలా జరిగింది: అతడు, “యేహూ, శాంతేనా?” అని అడిగాడు. అందుకు యేహూ, “నీ తల్లి యెజెబెలు వేశ్యాచారాలు[a], ఆమె అనేక మంత్రవిద్యలు కొనసాగుతున్నంతకాలం శాంతి ఎలా ఉంటుంది?[b]” అన్నాడు.'
