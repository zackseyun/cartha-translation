id: 2KI.9.12
reference: 2 Kings 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ שֶׁ֔קֶר הַגֶּד נָ֖א לָ֑/נוּ וַ/יֹּ֗אמֶר כָּ/זֹ֤את וְ/כָ/זֹאת֙ אָמַ֤ר אֵלַ/י֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: te
  text: 'వారు, “అది అబద్ధం! దయచేసి మాకు చెప్పు” అన్నారు. అప్పుడు అతడు, “అతడు నాతో ఇలా అలా[a] చెప్పాడు: ‘యాహ్వే ఇలా అంటున్నాడు: నేను నిన్ను ఇశ్రాయేలుమీద రాజుగా అభిషేకించాను’” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇలాంటిది, ఇలాంటిది”; ఇది నిర్దిష్టంగా చెప్పని లేదా పాక్షికంగా సంగ్రహించిన విషయాన్ని సూచించే నుడికారం. “అటువంటి మాటలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: అది అబద్ధం
  rationale: మూలంలో ఉన్న ‘అబద్ధం/అసత్యం’ అనే నామవాచకపు ఆకస్మిక ఆరోపణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; యెహూ విషయాన్ని దాచిపెడుతున్నాడనే వారి భావాన్ని నిలుపుతుంది.
- source_word: הַגֶּד נָא לָנוּ
  choice: దయచేసి మాకు చెప్పు
  rationale: הַגֵּד అనే ఆజ్ఞార్థక క్రియలోని ‘చెప్పు/తెలియజేయి’ భావాన్నీ, נָא తెలిపే మర్యాదతో కూడిన విన్నపాన్నీ సహజంగా అందిస్తుంది.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ఇలా అలా
  rationale: ఇది మాటకు మాటగా నివేదించకుండా, నిర్దిష్టంగా చెప్పని లేదా సంక్షిప్తంగా తెలిపిన విషయాన్ని సూచించే హీబ్రూ నుడికారం. ‘ఇలా అలా’ ఆ అస్పష్టతను తెలుగులో నిలుపుతుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజమైన, గంభీరమైన తెలుగులో అందిస్తూ, దైవనామాన్ని ప్రత్యక్షంగా ‘యెహోవా’ అని ఉంచుతుంది.
- source_word: מְשַׁחְתִּיךָ
  choice: నేను నిన్ను ... అభిషేకించాను
  rationale: משׁח యొక్క రాజనియామక, ధార్మిక ప్రాధాన్యాన్ని ‘అభిషేకించాను’ నిలుపుతుంది; సంపూర్ణ క్రియను జరిగిన కార్యంగా అనువదిస్తుంది.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజుగా
  rationale: לְמֶלֶךְ నియామక పదవిని, ఈ సందర్భంలోని אֶל పాలనా పరిధిని సూచిస్తాయి; తెలుగులో ‘ఇశ్రాయేలుమీద రాజుగా’ స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా పేరుగా ప్రతిబింబించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: రాజుగా అభిషేకించడం
  choice: అభిషేకించాను
  alternative: రాజుగా నియమించాను
  rationale: ‘నియమించాను’ భావాన్ని మాత్రమే తెలుపుతుంది; ‘అభిషేకించాను’ రాజనియామక చర్యతో కూడిన మూలపదపు ధార్మిక, రాజసంబంధ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంభాషణను, ప్రవచన వాక్యంలో గంభీరతను కలిపి ఉంచాం. మూలంలోని అస్పష్ట నుడికారాన్ని వివరణాత్మకంగా విప్పకుండా ప్రధాన పాఠంలో నిలిపి, పాదటిప్పణిలో వివరించాం.
