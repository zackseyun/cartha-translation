  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: te
  text: యేహూ ఎక్కి[a] యెజ్రెయేలుకు వెళ్లాడు. ఎందుకంటే యోరాము అక్కడ పడుకొని ఉన్నాడు; యూదా రాజైన అహజ్యా యోరామును చూడడానికి[b] అప్పటికే దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వారీ చేసి.” హీబ్రూ వాక్యం యేహూ ఎక్కడాన్ని, ఆ తర్వాత యెజ్రెయేలుకు వెళ్లడాన్ని రెండు వేర్వేరు క్రియలతో చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యోరామును చూడడానికి”; ఈ సందర్భంలో అతన్ని పరామర్శించడానికి అని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ఎక్కి
  rationale: רכב అనే క్రియలో ఉన్న ‘వాహనం లేదా జంతువుపై ఎక్కడం’ అనే స్పష్టమైన చర్యను నిలుపుతుంది. సందర్భం రథాన్ని సూచించినప్పటికీ మూలవాక్యంలో ‘రథం’ అనే నామవాచకం లేదు కాబట్టి దాన్ని పాఠ్యంలో చేర్చలేదు.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך అనే సాధారణ గమన క్రియకు సహజమైన ఆధునిక తెలుగు సమానం; ముందున్న ‘ఎక్కి’ అనే క్రియతో కలపకుండా ప్రత్యేక చర్యగా ఉంచుతుంది.
- source_word: יִזְרְעֶאלָה
  choice: యెజ్రెయేలుకు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה, యెజ్రెయేలు వైపు గమనాన్ని తెలియజేస్తుంది; తెలుగులో ‘-కు’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో యేహూ యెజ్రెయేలుకు వెళ్లడానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֹׁכֵב
  choice: పడుకొని ఉన్నాడు
  rationale: שׁכב యొక్క వర్తమాన స్థితిని అక్షరార్థానికి దగ్గరగా నిలుపుతుంది. గాయాల కారణంగా మంచాన ఉన్నాడనే సందర్భం ఉన్నా, మూలపదం చెప్పిన దానికంటే ఎక్కువ వైద్యార్థాన్ని చేర్చదు.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: సాధారణ స్థలసూచక అవ్యయానికి సహజమైన తెలుగు రూపం.
- source_word: יָרַד
  choice: దిగివచ్చాడు
  rationale: ‘దిగడం’ అనే భౌగోళిక భావాన్ని నిలుపుతూ, అహజ్యా యెజ్రెయేలుకు చేరిన దిశను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘అప్పటికే’ అనే పదం ఈ చర్య యేహూ బయలుదేరడానికి ముందే జరిగిందనే కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: לִרְאוֹת אֶת
  choice: చూడడానికి
  rationale: ‘చూడడానికి’ అనే ప్రత్యక్ష పదార్థాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది అనారోగ్యంతో ఉన్న రాజును పరామర్శించడాన్ని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: యేహూ / యోరాము / అహజ్యా / యెజ్రెయేలు / యూదా
  rationale: హీబ్రూ వ్యక్తి, స్థలనామాలను ఆధునిక తెలుగు బైబిలు పఠనానికి అనువైన లిప్యంతరీకరణలో అందించాయి.
