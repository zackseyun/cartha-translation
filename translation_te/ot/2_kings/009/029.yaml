reference: 2 Kings 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בִ/שְׁנַת֙ אַחַ֣ת עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֖ם בֶּן אַחְאָ֑ב מָלַ֥ךְ אֲחַזְיָ֖ה עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: te
  text: అహాబు కుమారుడైన యోరాము పరిపాలనలో పదకొండవ సంవత్సరంలో[a], అహజ్యా యూదాపై రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోరాము, అహజ్యా పరిపాలనలకు సంబంధించిన కాలసూచనలను రాజులు, దినవృత్తాంతాలు గ్రంథాల్లో ఒకదానితో ఒకటి సమన్వయపరచడం కష్టం. కాలక్రమాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించడానికి ప్రయత్నించకుండా, ఈ అనువాదం హెబ్రీ పాఠాన్ని ఉన్నట్లుగానే అందిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: సంవత్సరంలో
  rationale: వాక్యారంభంలోని וּ సహజమైన తెలుగు కాలసూచనలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు; בִ కాలాన్ని సూచిస్తూ ‘లో’ అనే భావాన్ని ఇస్తుంది.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: పదకొండో సంవత్సరంలో
  rationale: ఇది రాజపాలన సంవత్సరాన్ని సూచించే హెబ్రీ జాతీయ ప్రయోగం; తెలుగులో క్రమసంఖ్యతో సహజంగా వ్యక్తమవుతుంది.
- source_word: לְיוֹרָם
  choice: యోరాము పరిపాలనలో
  rationale: రాజుల కాలగణన సూత్రంలో לְ మరొక రాజు పాలనను కాలసూచికగా చూపుతుంది; ‘పరిపాలనలో’ అనేది తెలుగులో అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בֶּן אַחְאָב
  choice: అహాబు కుమారుడైన
  rationale: ఏ యోరాము ఉద్దేశించబడ్డాడో తెలియజేసే సరళమైన పితృనామ సూచన.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజవంశ కాలసూచనలో క్రియ సింహాసనారోహణను సూచిస్తుంది; ‘రాజయ్యాడు’ ఆ ఆరంభ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: אֲחַזְיָה
  choice: అహజ్యా
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: עַל יְהוּדָה
  choice: యూదా మీద
  rationale: מָלַךְ తో వచ్చిన עַל ఒక రాజ్యం మీద అధికారాన్ని సూచిస్తుంది; ‘యూదా మీద’ మూల నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
