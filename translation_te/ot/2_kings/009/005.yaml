source:
  edition: WLC
  text: וַ/יָּבֹ֗א וְ/הִנֵּ֨ה שָׂרֵ֤י הַ/חַ֨יִל֙ יֹֽשְׁבִ֔ים וַ/יֹּ֕אמֶר דָּבָ֥ר לִ֛/י אֵלֶ֖י/ךָ הַ/שָּׂ֑ר וַ/יֹּ֤אמֶר יֵהוּא֙ אֶל מִ֣י מִ/כֻּלָּ֔/נוּ וַ/יֹּ֖אמֶר אֵלֶ֥י/ךָ הַ/שָּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: te
  text: అతడు వచ్చాడు; ఇదిగో, సైన్యాధిపతులు కూర్చుని ఉన్నారు. అతడు, “సైన్యాధిపతీ, మీకు చెప్పడానికి నా దగ్గర ఒక మాట ఉంది[a]” అన్నాడు. యేహూ, “మాలో ఎవరిని ఉద్దేశించి?” అని అడిగాడు. అతడు, “మిమ్మల్ని ఉద్దేశించి, సైన్యాధిపతీ” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైన్యాధిపతీ, మీకు చెప్పడానికి నా దగ్గర ఒక సందేశం ఉంది.” హీబ్రూ పదబంధంలో, “నాకు మీకొరకు ఒక మాట ఉంది” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అతడు వచ్చాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సరళమైన భూతకాల క్రియ సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: అక్కడ
  rationale: הִנֵּה దృశ్యాన్ని ప్రత్యక్షంగా ముందుంచుతుంది. ఆధునిక సహజ తెలుగులో ‘అక్కడ’ సందర్భాన్ని చూపిస్తుంది; కృత్రిమంగా వినిపించే ‘ఇదిగో’ను నివారిస్తుంది.
- source_word: שָׂרֵי הַחַיִל
  choice: సైన్యాధిపతులు
  rationale: సైనిక సందర్భంలో שָׂרִים నాయకులు లేదా అధికారులను సూచిస్తుంది. ‘సైన్యాధిపతులు’ హోదాను అతిగా నిర్దిష్టం చేయకుండా స్పష్టంగా ఉంది.
- source_word: יֹשְׁבִים
  choice: కూర్చుని ఉన్నారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న స్థితిని వర్ణిస్తుంది; ఈ రూపం దృశ్య నేపథ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: דָּבָר
  choice: ఒక మాట
  rationale: דָּבָר యొక్క ప్రాథమిక అర్థమైన ‘మాట’ను నిలుపుతూ, సందేశం అనే సందర్భార్థాన్నీ అనుమతిస్తుంది.
- source_word: לִי אֵלֶיךָ
  choice: మీకోసం నా దగ్గర ... ఉంది
  rationale: హీబ్రూ పదబంధంలోని మొదటి పురుష సంబంధాన్నీ, మాట నిర్దిష్ట వ్యక్తికి ఉద్దేశించబడినదన్న భావాన్నీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַשַּׂר
  choice: సైన్యాధిపతీ
  rationale: ఇది సైనిక నాయకునికి ప్రత్యక్ష సంబోధన. తెలుగు సంబోధనా రూపం సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: మాలో ఎవరి కోసం?
  rationale: సమూహంలో ఏ వ్యక్తిని ఉద్దేశించాడో యేహూ అడుగుతున్నాడు. ‘మాలో ఎవరి కోసం?’ విభాగార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: సైన్యాధిపతీ, మీ కోసమే
  rationale: ఉద్దేశించబడిన వ్యక్తిని పునరుద్ఘాటిస్తూ ప్రత్యక్ష సంబోధనను నిలుపుతుంది; ‘ఏ’ నిశ్చయార్థాన్ని సహజంగా ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘మాట’ అనే మూలభాషా రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘సందేశం’ను పాదసూచికలో ఇచ్చాం. యేహూ మరియు ఇతర సైన్యాధిపతుల హోదా కారణంగా గౌరవ బహువచన సంబోధన వాడబడింది.
