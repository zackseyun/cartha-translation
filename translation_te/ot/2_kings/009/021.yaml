  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. రాజసంబంధమైన సందర్భానికి తగిన సంక్షిప్త ఆజ్ఞను ఉపయోగించి, హీబ్రూ క్రియలోని అక్షరార్థం–సందర్భార్థం మధ్య ఉన్న ఉద్రిక్తతను పాదటిప్పణిలో నిలిపాం.
