source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹרָם֙ אֱסֹ֔ר וַ/יֶּאְסֹ֖ר רִכְבּ֑/וֹ וַ/יֵּצֵ֣א יְהוֹרָ֣ם מֶֽלֶךְ יִ֠שְׂרָאֵל וַ/אֲחַזְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה אִ֣ישׁ בְּ/רִכְבּ֗/וֹ וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את יֵה֔וּא וַ/יִּמְצָאֻ֔/הוּ בְּ/חֶלְקַ֖ת נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: te
  text: అప్పుడు యెహోరాము, “రథానికి గుర్రాలను కట్టు!” అన్నాడు. వారు అతని రథాన్ని సిద్ధం చేశారు.[a] ఆపై ఇశ్రాయేలు రాజు యెహోరాము, యూదా రాజు అహజ్యా ఇద్దరూ తమ తమ రథాల్లో బయలుదేరి యెహూను కలవడానికి వెళ్లారు. యెజ్రెయేలీయుడైన నాబోతు భూభాగంలో వారు అతన్ని కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “అతడు తన రథాన్ని కట్టాడు” అని ఉంది; అయితే రాజు ఇచ్చిన ఆజ్ఞను పరిచారకులు అమలు చేశారనే సందర్భార్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: రథాన్ని సిద్ధం చేయి!
  rationale: అక్షరార్థంగా ‘కట్టు’ అనే భావమున్నా, రథ సందర్భంలో గుర్రాలను రథానికి కట్టి ప్రయాణానికి సిద్ధం చేయడాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘రథాన్ని సిద్ధం చేయి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: అతని రథం సిద్ధం చేయబడింది
  rationale: హీబ్రూ క్రియ వ్యాకరణరీత్యా మూడవ పురుష ఏకవచనం—‘అతడు తన రథాన్ని కట్టాడు.’ అయితే రాజాజ్ఞను సేవకుడు అమలు చేశాడనే సందర్భార్థాన్ని తెలుగు కర్మణి ప్రయోగం సహజంగా తెలియజేస్తుంది; రాజే స్వయంగా రథాన్ని సిద్ధం చేశాడని అనవసరంగా నిర్ధారించదు.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: ఇద్దరూ తమ తమ రథాల్లో
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ఒక్కొక్కరు’ అని సూచిస్తుంది. ఇద్దరు రాజులు వేర్వేరు రథాల్లో ఉన్నారని ‘తమ తమ రథాల్లో’ సహజంగా తెలియజేస్తుంది.
- source_word: לִקְרַאת יֵהוּא
  choice: యెహూను ఎదుర్కొనడానికి
  rationale: לקראת అంటే ఒకరిని కలుసుకోవడానికి లేదా ఎదురుగా వెళ్లడం. ఉద్రిక్తమైన ఈ సందర్భంలో ‘ఎదుర్కొనడానికి’ దిశను, ఉద్దేశాన్ని సహజంగా నిలుపుతుంది; అది తప్పనిసరిగా యుద్ధం చేయడమని మాత్రం చెప్పదు.
- source_word: וַיִּמְצָאֻהוּ
  choice: వారు అతన్ని కలుసుకున్నారు
  rationale: מצא కథనంలో ‘కనుగొను’ లేదా ‘ఎదురుపడు/కలుసుకొను’ అనే అర్థాలు కలిగి ఉంటుంది. వారు వెతుకుతూ వెళ్లి ఎదురుపడిన సందర్భానికి ‘కలుసుకున్నారు’ సహజంగా సరిపోతుంది.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: నాబోతు భూభాగంలో
  rationale: חֶלְקָה ఒక నిర్దిష్ట భూఖండం లేదా భూమి భాగాన్ని సూచిస్తుంది. ‘భూభాగం’ ఆస్తి సంబంధిత భావాన్ని నిలుపుతూ, ‘పొలం’ అని మరీ సంకుచితం చేయదు.
- source_word: הַיִּזְרְעֵאלִי
  choice: యెజ్రెయేలీయుడైన
  rationale: ఈ జాతి/స్థలనామ విశేషణం నాబోతును యెజ్రెయేలు ప్రాంతానికి చెందినవాడిగా గుర్తిస్తుంది; పూర్వ కథనంలోని స్థిరమైన గుర్తింపును నిలుపుతుంది.
