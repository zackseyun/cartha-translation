id: 2KI.9.26
reference: 2 Kings 9:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: te
  text: “నాబోతు రక్తాన్నీ, అతని కుమారుల రక్తాన్నీ నిన్న నేను తప్పక చూశాను[a],” అని యాహ్వే ప్రకటిస్తున్నాడు. “ఈ భూభాగంలో నీ మీద ప్రతీకారం తీర్చుతాను,” అని యాహ్వే ప్రకటిస్తున్నాడు. “కాబట్టి ఇప్పుడు అతన్ని ఎత్తుకుని, యాహ్వే మాట ప్రకారం ఈ భూభాగంలో విసిరివేయి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాబోతు రక్తాన్నీ, అతని కుమారుల రక్తాన్నీ నిన్న నేను నిజంగా చూశాను.” హీబ్రూ ప్రారంభ నుడికారం ప్రమాణంలాంటి బలమైన నిశ్చయ ప్రకటన.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: తప్పక
  rationale: ఈ సందర్భంలో ఇది షరతును సూచించకుండా, ప్రమాణపూర్వకమైన బలమైన నిశ్చయ ప్రకటనగా పనిచేస్తుంది.
- source_word: דְּמֵי
  choice: రక్తం
  rationale: హీబ్రూలోని బహువచన రూపం హింసాత్మకంగా చిందించబడిన రక్తాన్ని సూచించే నుడికారం; తెలుగులో సహజమైన ఏకవచన రూపం భావాన్ని నిలుపుతుంది.
- source_word: בָנָיו
  choice: అతని కుమారులు
  rationale: మూలపాఠం సాధారణంగా పిల్లలు అని కాకుండా ప్రత్యేకంగా కుమారులు అని చెబుతుంది.
- source_word: אֶמֶשׁ
  choice: నిన్న
  rationale: గత పగలు లేదా రాత్రిని సూచించగల పదానికి ఈ సందర్భంలో అతి తక్కువ వ్యాఖ్యానభారం గల సహజ తెలుగు సమానం.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: నీకు ప్రతిఫలం చేస్తాను
  rationale: పీయేల్ రూపం న్యాయపరమైన ప్రతికారాన్ని లేదా తగిన ప్రతిఫలాన్ని సూచిస్తుంది; ఈ ఎంపిక ఆ గంభీరతను నిలుపుతుంది.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: ఈ భూభాగంలోనే
  rationale: חֶלְקָה ఒక నిర్దిష్ట భూఖండాన్ని సూచిస్తుంది; ‘నే’ ప్రత్యయం తీర్పు అదే స్థలంలో జరుగుతుందనే ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: అతన్ని ఎత్తి ... పడవేయి
  rationale: రెండు ఆజ్ఞారూపాల ప్రత్యక్షతను, శవాన్ని తీసి ఆ స్థలంలో వేయించాలనే సందర్భార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు సాధారణ బైబిలు వాడుకలో గుర్తించదగిన దైవనామ రూపాన్ని ఉపయోగిస్తూ, మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా ఉంచింది.
- issue: నాబోతు కుమారుల ప్రస్తావన
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు
  rationale: న్యాయతీర్పుకు సంబంధించిన ఈ ప్రకటనలో మూలపాఠంలోని లింగ-నిర్దిష్ట పదాన్ని సాధారణీకరించలేదు.
- issue: אִם לֹא యొక్క ప్రమాణసదృశ బలం
  choice: తప్పక చూశాను
  alternative: నిజంగా చూశాను
  rationale: షరతుగా కాకుండా బలమైన నిశ్చయ ప్రకటనగా ఉన్నప్పటికీ, తెలుగులో అసహజమైన ప్రమాణ సూత్రాన్ని సృష్టించకుండా దాని ఉద్ఘాటనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన-ప్రవచన శైలి. మూలంలోని పునరుక్త ‘యెహోవా ప్రకటిస్తున్నాడు’ సూత్రాన్ని రెండుసార్లూ నిలిపి, ఆజ్ఞను నేరుగా ఉంచింది.
