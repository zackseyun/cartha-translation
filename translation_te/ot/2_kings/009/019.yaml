  edition: WLC
  text: וַ/יִּשְׁלַ֗ח רֹכֵ֣ב סוּס֮ שֵׁנִי֒ וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַ/יֹּ֛אמֶר כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ שָׁל֑וֹם וַ/יֹּ֧אמֶר יֵה֛וּא מַה לְּ/ךָ֥ וּ/לְ/שָׁל֖וֹם סֹ֥ב אֶֽל אַחֲרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: te
  text: 'అప్పుడు అతడు రెండవ గుర్రపు రౌతును పంపాడు. అతడు వారి దగ్గరికి వచ్చి, “రాజు ఇలా అంటున్నాడు: ‘శాంతేనా?’[a]” అని అడిగాడు. అందుకు యెహూ, “శాంతితో నీకేమి పని? నా వెనుకకు తిరుగు!” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్షేమమేనా?” హీబ్రూ పదం שָׁלוֹם (షాలోమ్) ‘శాంతి,’ ‘క్షేమం,’ లేదా ‘బాగుండడం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: రెండవ గుర్రపు రౌతు
  rationale: అక్షరార్థంగా ‘రెండవ గుర్రపు స్వారీదారు.’ ‘గుర్రపు రౌతు’ అనేది కథన సందర్భంలో సహజంగా ఉండి, మూలంలో స్పష్టంగా లేని ‘దూత’ అనే పాత్రను పాఠ్యంలో చేర్చదు.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: రాజు ఇలా అంటున్నాడు
  rationale: ఇది రాజసందేశ సూత్రాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שָׁלוֹם
  choice: శాంతి / శాంతేనా?
  rationale: ఈ పదానికి శాంతి, క్షేమం, సుభిక్షం అనే అర్థవ్యాప్తి ఉంది. ప్రశ్నలో ‘శాంతేనా?’ అని, యెహూ జవాబులో ‘శాంతితో’ అని అనువదించడం ద్వారా మూలంలోని పదపునరుక్తిని నిలిపాం.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: శాంతితో నీకేమి పని?
  rationale: దూత శాంతి విషయాన్ని అడగడానికి హక్కు లేదన్న యెహూ తిరస్కార ధోరణిని ఈ తెలుగు నుడికారం సహజంగా కాపాడుతుంది.
- source_word: סֹב אֶל אַחֲרָי
  choice: నా వెనుకకు మళ్లి
  rationale: అక్షరార్థంలోని ‘నా వెనుకకు తిరుగు’ అనే దిశను కాపాడుతూ, ‘నన్ను అనుసరించు’ అని మూలానికి మించిన వివరణను చేర్చకుండా సహజమైన ఆజ్ఞగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘గుర్రపు రౌతు’ కొంత సాహిత్యపూర్వకమైనా సాధారణ పాఠకులకు అర్థమయ్యే పదం. మూలంలోని ‘శాంతి’ పదపునరుక్తి మరియు యెహూ మాటల ఢీకొనే ధోరణి నిలుపబడ్డాయి.
