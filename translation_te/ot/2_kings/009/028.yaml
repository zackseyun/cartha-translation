translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘పితరులు’ అనే మూలభాషకు దగ్గరైన రాజవంశ పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సాంస్కృతిక భావాన్ని పాదసూచికలో వివరించాం. ‘తీసుకువెళ్లి’ సందర్భానుకూలంగా సహజమైనది; హీబ్రూ క్రియలోని వాహనంపై ఎక్కించి తరలించే సంభావ్య చిత్రాన్ని పాదసూచిక సంరక్షిస్తుంది.
