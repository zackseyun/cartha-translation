  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: te
  text: అతని సేవకులు అతన్ని యెరూషలేముకు తీసుకువెళ్లి[a], దావీదు నగరంలో అతని పితరులతో పాటు[b] అతని సమాధిలో పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని యెరూషలేముకు తరలించారు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘అతన్ని ఎక్కించి ప్రయాణింపజేశారు’ లేదా ‘మోయించి తీసుకువెళ్లారు’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని పితరులతో పాటు’ అనేది అతని రాజవంశ పూర్వీకుల మధ్య పాతిపెట్టడాన్ని సూచించే హీబ్రూ సమాధి సంబంధమైన నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: తీసుకువెళ్లి
  rationale: רכב హిఫీల్ రూపానికి అక్షరార్థంగా ‘ఎక్కించి ప్రయాణింపజేశారు’ లేదా ‘మోయించి తరలించారు’ అనే భావం ఉంది. ఇక్కడ మరణించిన అహజ్యా దేహాన్ని యెరూషలేముకు తరలించడం సందర్భం కాబట్టి, జీవించి స్వారీ చేశాడనే అపార్థం రాకుండా సహజమైన ‘తీసుకువెళ్లి’ ఎంచుకున్నాం; మూలపద చిత్రాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עבד సాధారణంగా ‘సేవకుడు’ అని, రాజసందర్భంలో రాజసేవకుడు లేదా అధికారి అని సూచించవచ్చు. ఇక్కడ నేరుగా, విస్తృతార్థాన్ని అనవసరంగా కుదించకుండా ‘సేవకులు’ సరిపోతుంది.
- source_word: יְרוּשָׁלָמָה
  choice: యెరూషలేముకు
  rationale: దిశను సూచించే ־ה అంత్యప్రత్యయం యెరూషలేము వైపు కదలికను తెలుపుతుంది; తెలుగులో ‘యెరూషలేముకు’ సహజమైన సమానార్థకం.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: క్రియతో పాటు ప్రత్యక్ష కర్మను స్పష్టంగా ప్రతిబింబించే సహజ తెలుగు నిర్మాణం; కర్తగా ముందున్న సేవకులే కొనసాగుతారు.
- source_word: בִקְבֻרָתוֹ
  choice: అతని సమాధిలో
  rationale: קְבֻרָה ఇక్కడ పాతిపెట్టే స్థలాన్ని సూచిస్తుంది. రాజవంశీయ సందర్భంలో ‘సమాధి’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: עִם אֲבֹתָיו
  choice: అతని పితరులతో పాటు
  rationale: హీబ్రూ బంధుత్వ పదప్రయోగాన్ని, రాజవంశ సంబంధాన్ని నిలుపుతుంది. ఇది కేవలం జీవశాస్త్రీయ తండ్రులను కాక పూర్వీకులను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: స్థలనామ పదబంధానికి నేరుగా, తెలుగులో సహజంగా ఉన్న అనువాదం.
