  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֣א הַ/בַּ֔יְתָ/ה וַ/יִּצֹ֥ק הַ/שֶּׁ֖מֶן אֶל רֹאשׁ֑/וֹ וַ/יֹּ֣אמֶר ל֗/וֹ כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מְשַׁחְתִּ֧י/ךָֽ לְ/מֶ֛לֶךְ אֶל עַ֥ם יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: te
  text: 'అప్పుడు అతడు లేచి ఇంట్లోకి వెళ్లాడు. అతడు అతని తలపై నూనె పోసి, అతనితో ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ‘యాహ్వే ప్రజలైన ఇశ్రాయేలుపై నిన్ను రాజుగా అభిషేకించాను[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ప్రజలైన ఇశ్రాయేలుపై నిన్ను రాజుగా అభిషేకిస్తున్నాను.” ఈ అభిషేక సూత్రంలో హీబ్రూ పరిపూర్ణ రూపం పలకడం ద్వారా నియామకాన్ని అమలు చేసే ప్రకటనగా అర్థమవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: అతడు లేచి
  rationale: కథన క్రమంలోని קום క్రియను ఆధునిక, సహజమైన తెలుగులో ‘లేచి’ అని అందించింది.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: ఇంట్లోకి వెళ్లాడు
  rationale: దిశను సూచించే ה కలిగిన בַּיִת రూపం ఇంటి లోపలికి కదలికను సూచిస్తుంది; కథన దృక్కోణానికి ‘వెళ్లాడు’ సహజంగా సరిపోతుంది.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: యెహూ తలమీద ఆ నూనె పోసి
  rationale: יצק అంటే ‘పోయు.’ సందర్భంలో సర్వనామాల సూచ్యం స్పష్టంగా ఉండేందుకు ‘అతని తల’ బదులు ‘యెహూ తల’ అని చెప్పింది; నిర్దిష్ట నూనెను సూచించే ఆర్టికల్‌ను ‘ఆ నూనె’గా ప్రతిబింబించింది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, ప్రత్యక్ష దైవ ప్రకటన భావంతో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా పేరుగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలిపింది.
- source_word: מְשַׁחְתִּיךָ
  choice: నిన్ను … అభిషేకించాను
  rationale: మొదటి పురుష ఏకవచన perfect రూపాన్ని, అప్పుడే పూర్తయిన నూనె పోయే చర్యతో అనుసంధానిస్తూ పూర్తయిన కార్యంగా అందించింది.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: అభిషేకం వల్ల కలిగే నియామక స్థితిని తెలుగు విభక్తి ‘-గా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: యాహ్వే ప్రజలమీద, అంటే ఇశ్రాయేలుమీద
  rationale: రాజాధికార పరిధిని ‘మీద’తో తెలిపి, రెండవ పదబంధం మొదటిదాన్ని వివరిస్తున్న సమాంతర/అన్వయ సంబంధాన్ని ‘అంటే’తో సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చింది.
- issue: מְשַׁחְתִּיךָ అభిషేక ప్రకటన కాలబలం
  choice: అభిషేకించాను
  alternative: అభిషేకిస్తున్నాను
  rationale: హీబ్రూ perfect అప్పుడే జరిగిన నూనె పోయే చర్యను పూర్తయినదిగా సూచించగలదు; అదే సమయంలో ఇది నియామకాన్ని అమలు చేసే కార్యనిర్వాహక ప్రకటనగా కూడా అర్థమవుతుంది. ప్రధాన పాఠంలో పూర్తయిన భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన భాగంలో సరళమైన వాక్యనిర్మాణం, దైవ సందేశంలో గౌరవప్రదమైన ప్రత్యక్ష శైలి వాడబడ్డాయి. అస్పష్ట సర్వనామాన్ని నివారించేందుకు సందర్భానుసారంగా ‘యెహూ’ పేరును స్పష్టీకరించింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని సంబంధిత అభిషేక క్రియ వద్ద ఉంచబడింది.
