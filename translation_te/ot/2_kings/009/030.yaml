translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. హీబ్రూ మూలంలోని వరుస చర్యలు, సాంస్కృతికంగా నిర్దిష్టమైన కంటి అలంకరణ, తల/జుట్టుకు సంబంధించిన ఉద్దేశపూర్వక విస్తృతత నిలుపబడ్డాయి.
