id: 2KI.9.30
reference: 2 Kings 9:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּב֥וֹא יֵה֖וּא יִזְרְעֶ֑אלָ/ה וְ/אִיזֶ֣בֶל שָׁמְעָ֗ה וַ/תָּ֨שֶׂם בַּ/פּ֤וּךְ עֵינֶ֨י/הָ֙ וַ/תֵּ֣יטֶב אֶת רֹאשָׁ֔/הּ וַ/תַּשְׁקֵ֖ף בְּעַ֥ד הַ/חַלּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: te
  text: యెహూ యెజ్రెయేలుకు వచ్చినప్పుడు, యెజెబెలు ఆ సంగతి విన్నది. ఆమె తన కళ్లకు కాటుక పెట్టుకొని[a], తన తలను అలంకరించుకొని[b], కిటికీలోనుండి బయటకు చూసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాటుక’ అనేది కళ్లకు పూసే ముదురు రంగు సౌందర్య పదార్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన జుట్టును సరిచేసుకుంది’; హీబ్రూలో అక్షరార్థంగా ‘తన తలను మంచిగా/అందంగా చేసుకుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: בוא అనే గమన క్రియ యెహూ యెజ్రెయేలుకు చేరడాన్ని తెలియజేస్తుంది; తెలుగు కథనంలో ‘వచ్చినప్పుడు’ సహజంగా ఉండి, ‘ప్రవేశించాడు’ అనే అదనపు నిర్దిష్టతను చేర్చదు.
- source_word: יִזְרְעֶאלָה
  choice: యెజ్రెయేలుకు
  rationale: స్థలనామానికి జోడించిన దిశార్థక ה ఆ స్థలం వైపు గమనాన్ని సూచిస్తుంది; తెలుగులో దత్తివిభక్తి ‘-కు’ దీనిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁמְעָה
  choice: ఆ సంగతి విన్నది
  rationale: మూలంలో కర్మ సందర్భం ద్వారా గ్రహించబడుతుంది—యెహూ రావడం; ‘ఆ సంగతి’ అనేది కొత్త సమాచారాన్ని చేర్చకుండా తెలుగులో ఆ అంతర్నిహిత కర్మను స్పష్టం చేస్తుంది.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: తన కళ్లకు కాటుక పెట్టుకొని
  rationale: פּוּךְ కళ్లకు పూసే ముదురు రంగు సౌందర్య పదార్థాన్ని సూచిస్తుంది. ‘కాటుక’ ఆధునిక తెలుగులో ఆ ఆచారాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: తన తలను అలంకరించుకొని
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘తన తలను మంచిగా/అందంగా చేసుకుంది.’ ‘తలను అలంకరించుకుంది’ అనేది జుట్టుకే పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וַתַּשְׁקֵף
  choice: బయటకు చూసింది
  rationale: ఈ క్రియ ఎత్తైన తెరువు నుండి బయటకు లేదా కిందికి చూడడాన్ని సూచిస్తుంది; ‘బయటకు చూసింది’ సందర్భానికి సరళంగా సరిపోతుంది.
- source_word: בְּעַד הַחַלּוֹן
  choice: కిటికీలోనుండి
  rationale: ఈ నిర్మాణంలో בְּעַד కిటికీ గుండా లేదా దాని వెనుకనుండి చూడడమనే స్థల సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘కిటికీలోనుండి’ సహజమైన వ్యక్తీకరణ.
