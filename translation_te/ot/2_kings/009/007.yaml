id: 2KI.9.7
reference: 2 Kings 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: te
  text: నీ యజమానియైన అహాబు వంశాన్ని నీవు సంహరించాలి. అప్పుడు నా సేవకులైన ప్రవక్తల రక్తానికీ, యెహోవా సేవకులందరి రక్తానికీ ఈజెబెలు చేతినుండి[a] నేను ప్రతీకారం తీర్చుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘ఈజెబెలు చేతినుండి.’ ఇది ‘ఈజెబెలు చేతిలో’ లేదా ‘ఈజెబెలు బాధ్యత వహించాల్సిన’ అనే భావాన్నిచ్చే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: నీవు సంహరించాలి
  rationale: נכה ఇక్కడ రాజవంశంపై తీర్పుగా నిర్ణయాత్మకంగా నాశనం చేయడాన్ని సూచిస్తుంది; కేవలం ‘కొట్టు’ అనే భావం సరిపోదు.
- source_word: בֵּית אַחְאָב
  choice: అహాబు వంశం
  rationale: రాజకీయ-కుటుంబ సందర్భంలో בַּיִת అనేది ఇంటిని మాత్రమే కాక పాలక వంశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశం’ సహజంగా అర్థమవుతుంది.
- source_word: אֲדֹנֶיךָ
  choice: నీ యజమాని
  rationale: ఇది దేవుణ్ణి కాదు, యెహూ యొక్క మానవ అధిపతియైన అహాబును సూచిస్తుంది.
- source_word: וְנִקַּמְתִּי
  choice: నేను ప్రతీకారం తీర్చుకుంటాను
  rationale: נקם అన్యాయంగా చిందించబడిన రక్తానికి దేవుడు చేసే న్యాయపూర్వక ప్రతికారాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דְּמֵי
  choice: రక్తానికి
  rationale: హీబ్రూ బహువచన రూపం రక్తపాతం లేదా రక్తదోషాన్ని సూచించే నుడికారం; తెలుగులో ‘రక్తానికి ప్రతీకారం’ సహజమైన సమానార్థకం.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: నా సేవకులైన ప్రవక్తలు
  rationale: ప్రవక్తలే దేవుని సేవకులని తెలిపే సమానాధికరణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: యెహోవా సేవకులందరు
  rationale: మూలంలోని సంపూర్ణతను, స్వామ్య సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מִיַּד אִיזָבֶל
  choice: ఈజెబెలు చేతినుండి
  rationale: హీబ్రూ ‘చేతినుండి’ అనే నుడికారాన్ని నిలుపుతూ, రక్తపాతానికి ఈజెబెలు కారకురాలు లేదా బాధ్యురాలు అనే భావాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దైవిక ప్రతీకార భాష
  choice: నేను ప్రతీకారం తీర్చుకుంటాను
  alternative: నేను పగ తీర్చుకుంటాను
  rationale: వాక్యం ప్రతికారాన్ని దేవుని న్యాయతీర్పుగా నేరుగా పేర్కొంటుంది. ‘ప్రతీకారం’ ఆ గంభీరతను ఉంచుతుంది; ‘పగ’ వ్యక్తిగత వైరం అనే అదనపు ఛాయను కలిగించవచ్చు.
- issue: అహాబు ‘ఇల్లు’ యొక్క పరిధి
  choice: అహాబు వంశం
  alternative: అహాబు ఇంటివారు
  rationale: రాజవంశ సంబంధ సందర్భంలో తీర్పు అహాబు పాలక వంశంపై ఉందని ‘వంశం’ తెలియజేస్తుంది; వ్యక్తుల ఖచ్చిత పరిధిని పాఠ్యానికి మించి నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన-తీర్పు శైలి. ‘వంశం’ రాజకుటుంబ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘యెహోవా’ దైవ నామంగా నిలుపబడింది. మూలంలోని ప్రతీకార భాషను మృదువుచేయకుండా, ‘చేతినుండి’ అనే నుడికారానికి పాదటిప్పణి ఇచ్చాం.
