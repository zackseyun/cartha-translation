source:
  edition: WLC
  text: וּ/בָ֖אתָ שָׁ֑מָּ/ה וּ/רְאֵֽה שָׁ֠ם יֵה֨וּא בֶן יְהוֹשָׁפָ֜ט בֶּן נִמְשִׁ֗י וּ/בָ֨אתָ֙ וַ/הֲקֵֽמֹת/וֹ֙ מִ/תּ֣וֹך אֶחָ֔י/ו וְ/הֵבֵיאתָ֥ אֹת֖/וֹ חֶ֥דֶר בְּ/חָֽדֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: te
  text: నీవు అక్కడికి చేరుకున్నప్పుడు, నిమ్షీ కుమారుడైన యెహోషాపాతు కుమారుడు యెహూను అక్కడ వెదుకు. లోపలికి వెళ్లి, అతని సహోదరుల మధ్యనుండి అతన్ని లేపి, లోపలి గదిలోకి[a] తీసుకెళ్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘గదిలోని గదిలోకి’; అంటే ఏకాంతమైన లోపలి గదిలోకి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: నీవు అక్కడికి చేరుకున్నప్పుడు
  rationale: בוא సందర్భానుసారం రావడం, వెళ్లడం, చేరడం అనే అర్థాలను ఇస్తుంది. తరువాతి ఆజ్ఞకు ముందుగా గమ్యస్థానానికి చేరడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּרְאֵה שָׁם
  choice: అక్కడ వెదుకు
  rationale: ראה ప్రాథమికంగా ‘చూడు’ అని అర్థమైనా, వెంటనే వ్యక్తి పేరు రావడం వల్ల ఇక్కడ అతన్ని గుర్తించి కనుగొనమనే భావం ఉంది; שם యొక్క ‘అక్కడ’ను కూడా నిలుపుతుంది.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: నింషీ కుమారుడైన యెహోషాపాతు కుమారుడు యెహూ
  rationale: హీబ్రూ వంశక్రమాన్ని సహజమైన తెలుగు బంధుత్వ నిర్మాణంలో, యెహూ యెహోషాపాతు కుమారుడనీ యెహోషాపాతు నింషీ కుమారుడనీ స్పష్టంగా ఉంచింది.
- source_word: וּבָאתָ
  choice: లోపలికి వెళ్లి
  rationale: రెండవ בוא, యెహూ ఉన్న సమూహంలోకి ప్రవేశించి తదుపరి చర్య చేయడాన్ని సూచిస్తుంది; సందర్భంలో ‘లోపలికి వెళ్లి’ సహజంగా ఉంది.
- source_word: וַהֲקֵמֹתוֹ
  choice: అతన్ని లేపి
  rationale: קום యొక్క హిఫీల్ రూపం ఒకరిని లేవనెత్తడం లేదా నిలబడేలా చేయడం. కూర్చున్న సమూహం మధ్యనుండి యెహూను లేపమనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: מִתּוֹךְ אֶחָיו
  choice: అతని సహోదరుల మధ్యనుండి
  rationale: אחים అక్షరార్థంగా ‘సహోదరులు’; ఈ సైనిక సందర్భంలో సహచరులను కూడా సూచించవచ్చు. మూలంలోని బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి అస్పష్టతను పరిష్కరించకుండా ఉంచింది.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: తీసుకెళ్లు
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురా/తీసుకెళ్లు’ అనే భావం ఇస్తుంది. ఆజ్ఞ పొందుతున్న వ్యక్తి యెహూను ప్రస్తుత సమూహం నుంచి లోపలి గదికి నడిపించాల్సి ఉండటంతో తెలుగులో ‘తీసుకెళ్లు’ దిశాపరంగా సహజం.
- source_word: חֶדֶר בְּחָדֶר
  choice: లోపలి గదిలోకి
  rationale: అక్షరార్థంగా ‘గదిలోని గది’; ఏకాంతమైన అంతర్గది భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. అక్షరార్థ రూపం పాదటిప్పణిలో భద్రపరచబడింది.
