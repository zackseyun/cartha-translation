translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. వ్యక్తి పేర్లు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు దగ్గరగా ఉంచబడ్డాయి. మూలంలోని ‘సహోదరులు’ అనే సంభావ్యంగా విస్తృతార్థమున్న పదం మార్చకుండా నిలుపబడింది.
