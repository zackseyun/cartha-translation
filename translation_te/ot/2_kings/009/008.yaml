  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָבַ֖ד כָּל בֵּ֣ית אַחְאָ֑ב וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: te
  text: అహాబు ఇంటివారంతా నశిస్తారు. ఇశ్రాయేలులో అహాబుకు చెందిన ప్రతి మగవాడిని[a]—నిర్బంధంలో ఉన్నవాడైనా, స్వేచ్ఛగా ఉన్నవాడైనా[b]—నేను నిర్మూలిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “గోడ మీద మూత్రం పోసే ప్రతి వాడు”; ఇది ప్రతి మగవాణ్ణి సూచించే కఠినమైన నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ పదజంట అర్థం నిశ్చితం కాదు. దీనిని “బానిస, స్వతంత్రుడు,” “నిర్బంధితుడు, విడిచిపెట్టబడినవాడు,” లేదా అందరినీ సూచించే జంటగా అర్థం చేసుకోవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: నశిస్తారు
  rationale: ప్రవచన సందర్భంలో సంయోజక వావుతో వచ్చిన ఖాల్ సంపూర్ణ క్రియ భవిష్యత్తు తీర్పును సూచిస్తుంది. ‘నశిస్తారు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, క్రియకు మూలంలో లేని కర్తృత్వ వివరాన్ని అదనంగా చేర్చదు.
- source_word: כָּל בֵּית אַחְאָב
  choice: అహాబు ఇంటివారంతా
  rationale: ‘ఇల్లు’ అనే హీబ్రూ రాజవంశ/కుటుంబ ప్రయోగాన్ని తెలుగులో సహజంగా గ్రహించగల ‘ఇంటివారు’తో నిలిపి ఉంచింది; ఇది కేవలం భవనాన్ని సూచించదు.
- source_word: וְהִכְרַתִּי
  choice: నేను నిర్మూలిస్తాను
  rationale: హిఫీల్ రూపంలోని כרת ఇక్కడ తీర్పులో పూర్తిగా తొలగించడాన్ని సూచిస్తుంది. పదశః ‘నరికివేస్తాను’ కంటే ‘నిర్మూలిస్తాను’ ఆధునిక తెలుగులో ఉద్దేశాన్ని స్పష్టంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: לְאַחְאָב
  choice: అహాబుకు చెందిన
  rationale: లామెద్ ఇక్కడ సంబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది; అహాబు వంశానికి/ఇంటికి చెందినవారనే భావాన్ని ఈ రూపం స్పష్టంగా ఇస్తుంది.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ప్రతి మగవాణ్ణీ
  rationale: పదశః అసభ్యంగా వినిపించే హీబ్రూ నుడికారం పురుషులను సూచిస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా ఇచ్చి, పదశః రూపాన్ని [a] పాదసూచికలో భద్రపరచింది.
- source_word: וְעָצוּר וְעָזוּב
  choice: నిర్బంధంలో ఉన్నవాడైనా, స్వేచ్ఛగా ఉన్నవాడైనా
  rationale: ఈ జంట అందరినీ కలుపుకొనే తీర్పు సూత్రంలో వస్తుంది. ‘బానిస, స్వతంత్రుడు’ అని ఖచ్చితమైన చట్టపరమైన వర్గాలుగా నిర్ణయించకుండా, పదాల ప్రాథమిక వ్యత్యాసాన్ని తెలుగులో నిలిపింది; అనిశ్చితిని [b] పాదసూచిక తెలియజేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: బేత్ ఉపసర్గాన్ని స్థానార్థకంగా తీసుకొని, తీర్పు జరిగే పరిధిని సూచించింది.
theological_decisions:
- issue: అహాబు ఇంటిపై ప్రకటించిన రాజవంశ తీర్పు
  choice: ‘అహాబు ఇంటివారు’ మరియు ‘నిర్మూలిస్తాను’ అనే తీర్పు భాషను నిలిపి, పురుషులను సూచించే కఠిన నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థానువాదం చేయడం
  alternative: ‘అహాబు కుటుంబమంతటినీ తుడిచివేస్తాను’ అని మొత్తం వాక్యాన్ని స్వేచ్ఛగా సంక్షిప్తీకరించడం
  rationale: మూలంలోని రెండు వాక్యభాగాల నిర్మాణం, ఇంటి/వంశ తీర్పు, దేవుని ప్రత్యక్ష ప్రకటన అన్నీ నిలుస్తాయి; అదే సమయంలో అస్పష్టమైన నుడికారం సాధారణ పాఠకునికి అర్థమవుతుంది.
- issue: וְעָצוּר וְעָזוּב జంట యొక్క అనిశ్చిత అర్థం
  choice: ‘నిర్బంధంలో ఉన్నవాడైనా, స్వేచ్ఛగా ఉన్నవాడైనా’ అని అనువదించి, పాదసూచికలో ఇతర సాధ్యార్థాలను పేర్కొనడం
  alternative: ‘బానిసనైనా, స్వతంత్రుణ్ణైనా’ అని నిర్దిష్ట సామాజిక-చట్టపరమైన వర్గాలుగా అనువదించడం
  rationale: ఈ సూత్రప్రాయ జంటకు ఖచ్చితమైన సూచన వివాదాస్పదం. ఎంపిక చేసిన రూపం అందరినీ కలుపుకొనే వ్యత్యాసాన్ని చూపుతూ, మూలంలో లేని ఖచ్చితత్వాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన-తీర్పు శైలిని ఉపయోగించింది. అరుదైన బైబిలు పదబంధాలను యాంత్రికంగా అనుకరించకుండా, ‘ఇంటివారు,’ ‘నశిస్తారు,’ ‘నిర్మూలిస్తాను’ వంటి సాధారణ పాఠకునికి స్పష్టమైన పదాలను ఎంచుకుంది. మూలంలోని కఠిన నుడికారం మరియు వివాదాస్పద జంటను పాదసూచికల ద్వారా పారదర్శకంగా ఉంచింది.
