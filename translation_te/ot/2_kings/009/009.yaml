source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: te
  text: నేను అహాబు ఇంటిని నెబాతు కుమారుడైన యరొబాము ఇంటిలా, మరియు అహీయా కుమారుడైన బయెషా ఇంటిలా చేస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహాబు వంశాన్ని ... యరొబాము వంశంలా ... బయెషా వంశంలా.” ఇక్కడ “ఇల్లు” అనేది రాజవంశాన్ని లేదా రాజకుటుంబాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  choice: నేను ... చేస్తాను
  rationale: נתן అనే క్రియకు ప్రాథమికంగా ‘ఇవ్వు/ఉంచు’ అనే అర్థాలున్నా, ప్రత్యక్ష కర్మతో కూడిన ఈ తీర్పు సూత్రంలో తరువాత వచ్చే పోలికల దృష్ట్యా ‘...లా చేస్తాను’ అనేది సహజమైన తెలుగు; అది కారణార్థక భావాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; విడిగా అనువదించలేదు]'
  rationale: హీబ్రూ אֶת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: בֵּית אַחְאָב
  choice: అహాబు ఇంటిని
  rationale: రాజవంశ సందర్భంలో בַּיִת అనే ‘ఇల్లు/ఇంటి’ రూపకాన్ని నిలుపుతూ, తెలుగులో సహజమైన ‘అహాబు ఇంటిని’ అని ఇచ్చాం; ఇక్కడ భావం వంశం లేదా రాజకుటుంబ పరంపర.
- source_word: כְּ/בֵית
  choice: ఇంటిలా
  rationale: ఉపసర్గ כ పోలికను సూచిస్తుంది; ‘ఇంటిలా’ దాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: తండ్రి-కొడుకు సంబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలిపి, వ్యక్తినామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּ/כְ/בֵית
  choice: '... ఇంటిలా'
  rationale: సంయోజక అవ్యయం మరియు పోలిక సూచిక కలిపి రెండవ సమాంతర పోలికను అందిస్తాయి; తెలుగులో కామాతో సమన్వయం సహజంగా వ్యక్తమవుతుంది.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: అహీయా కుమారుడైన బయెషా
  rationale: చారిత్రక సూచనను నిలుపుతూ పేర్లను లిప్యంతరీకరించి, పితృసంబంధాన్ని స్పష్టమైన తెలుగులో అందించాం.
theological_decisions:
- issue: రాజవంశ తీర్పు సూత్రం అనువాదం
  choice: అహాబు ఇల్లు ... యరొబాము ఇల్లు ... బయెషా ఇల్లు
  alternative: అహాబు వంశం ... యరొబాము వంశం ... బయెషా వంశం
  rationale: ఈ వాక్యం గతంలో నాశనమైన రాజవంశాలతో పోల్చి అహాబు రాజకుటుంబంపై తీర్పును ప్రకటిస్తుంది. ‘ఇల్లు/ఇంటి’ అనే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం అంతర్పాఠ్య అనుసంధానాన్ని కాపాడుతుంది; ‘వంశం’ అనే వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ ‘ఇల్లు’ అనే రాజవంశ రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, దాని భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
