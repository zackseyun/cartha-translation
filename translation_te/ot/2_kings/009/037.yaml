- from: యెజ్రెయేలు భూభాగంలో యెజెబెలు శవం పొలం మీద పెంటలా అవుతుంది[a]. అందువల్ల, “ఇది యెజెబెలు” అని ఎవరూ చెప్పలేరు.
  to: యెజ్రెయేలు భూభాగంలో యెజెబెలు శవం పొలం మీద పెంటలా అవుతుంది[a]. దాంతో, “ఇది యెజెబెలు” అని ఎవరూ చెప్పరు.
