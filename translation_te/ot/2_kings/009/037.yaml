translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన శైలి. మూలంలోని అవమానకరమైన ‘పెంట’ ఉపమానాన్ని మృదువుచేయకుండా ఉంచింది; חֵלֶק లోని భావ విస్తృతిని పాదసూచికలో సంరక్షించింది.
