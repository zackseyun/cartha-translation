id: 2KI.9.37
reference: 2 Kings 9:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: te
  text: యెజ్రెయేలు భూభాగంలో యెజెబెలు శవం పొలం మీద పెంటలా అవుతుంది[a]. దాంతో, “ఇది యెజెబెలు” అని ఎవరూ చెప్పరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెజ్రెయేలు పొలభాగంలో.” హీబ్రూ חֵלֶק అనే పదం ఒక నిర్దిష్ట భూఖండాన్ని లేదా పొలంలోని భాగాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: అవుతుంది
  rationale: ప్రవచన సందర్భంలో ముందున్న వాక్యాన్ని కొనసాగించే భవిష్యదర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִבְלַת אִיזֶבֶל
  choice: యెజెబెలు శవం
  rationale: నִבְלָה మృతదేహాన్ని సూచిస్తుంది; ‘శవం’ సంక్షిప్తంగా, సహజంగా ఉండి మూలంలోని కఠినతను నిలుపుతుంది.
- source_word: כְּדֹמֶן
  choice: పెంటలా
  rationale: דֹּמֶן పేడ లేదా పెంటను సూచిస్తుంది; పొలంలో చెల్లాచెదురుగా పడి ఉండే మలవ్యర్థం అనే ఘోరమైన ఉపమానాన్ని ‘పెంట’ సహజంగా అందిస్తుంది.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: పొలం మీద
  rationale: అక్షరార్థంగా ‘పొలం ముఖం మీద’; తెలుగులో ‘పొలం మీద’ అదే స్థల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: యెజ్రెయేలు భూభాగంలో
  rationale: חֵלֶק ఒక భాగం, భూఖండం లేదా నిర్దిష్ట పొలాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో విస్తృతమైన భావాన్ని ఉంచి, సంకుచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: అందువల్ల ... ఎవరూ చెప్పలేరు
  rationale: ఇక్కడి సంబంధవాచకం ఫలిత భావాన్ని తెలియజేస్తుంది. గుర్తుపట్టలేనంతగా శవం అవమానకర స్థితికి చేరుతుందనే అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זֹאת אִיזָבֶל
  choice: ఇది యెజెబెలు
  rationale: మూలంలోని సరళమైన గుర్తింపు వాక్యాన్ని నేరుగా నిలుపుతుంది.
