source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ הַ/נַּ֛עַר הַ/נַּ֥עַר הַ/נָּבִ֖יא רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/004.yaml
  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: te
  text: అప్పుడు ఆ యువకుడు, ఆ యువ ప్రవక్త[a], రామోత్-గిలాదుకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో ‘ఆ యువకుడు’ అనే మాట నొక్కిచెప్పేలా పునరుక్తమైంది: ‘ఆ యువకుడు, ఆ యువ ప్రవక్త.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు ... వెళ్లాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి చర్యకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נַעַר సాధారణంగా యువకుణ్ణి సూచిస్తుంది; ఈ సందర్భంలో ఎలీషా పంపిన వ్యక్తిని సూచించడానికి ‘యువకుడు’ సహజమైన, తటస్థమైన పదం.
- source_word: הַנַּעַר הַנָּבִיא
  choice: ఆ యువ ప్రవక్త
  rationale: రెండవ הַנַּעַר కు הַנָּבִיא విశేషణాత్మకంగా లేదా వివరణాత్మకంగా అనుసంధానమై ఉంది. మూలంలోని పునరుక్తిని నిలిపి, అతణ్ణి ‘యువ ప్రవక్త’గా చూపిస్తుంది; ‘ప్రవక్త సేవకుడు’ అని మార్చడం హెబ్రీ నిర్మాణంలో స్పష్టంగా లేని సంబంధాన్ని చేర్చుతుంది.
- source_word: רָמֹת גִּלְעָד
  choice: రామోత్-గిలాదు
  rationale: ఇది సంయుక్త స్థలనామం; మూల రూపాన్ని స్పష్టంగా ప్రతిబింబించేందుకు లిప్యంతరీకరించి మధ్యలో హైఫన్ ఉంచబడింది.
theological_decisions:
- issue: ఆ యువకుడు స్వయంగా ప్రవక్తా, లేక ప్రవక్త సేవకుడా?
  choice: ఆ యువ ప్రవక్త
  alternative: ప్రవక్త సేవకుడు
  rationale: వ్యాసంతో కూడిన הַנָּבִיא, వ్యాసంతో కూడిన הַנַּעַר‌కు వివరణాత్మక సమానాధికార పదంగా సహజంగా చదవబడుతుంది. ‘ప్రవక్త సేవకుడు’ అనే అనువాదం మూలంలో ప్రత్యక్షంగా వ్యక్తం కాని స్వామ్య సంబంధాన్ని నిర్దిష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని అసాధారణ పునరుక్తిని ప్రధాన వాక్యంలోనే నిలిపి, దానిని పాదటిప్పణిలో వివరించాం.
