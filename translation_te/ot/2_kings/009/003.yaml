source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: te
  text: 'నువ్వు నూనె ఉన్న చిన్న పాత్రను తీసుకుని, అతని తలపై ఆ నూనె పోసి, ‘యాహ్వే ఇలా అంటున్నాడు: నేను నిన్ను ఇశ్రాయేలుమీద రాజుగా అభిషేకించాను[a]’ అని చెప్పు. తరువాత తలుపు తెరిచి పారిపో; వేచి ఉండవద్దు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలుకు రాజుగా”; ఈ రాజనియామక ప్రకటనలో భావం “ఇశ్రాయేలుమీద రాజుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: నూనె ఉన్న చిన్న పాత్ర
  rationale: פַךְ అనేది ద్రవాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది. ప్రాచీన పాత్ర ఆకారాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా, ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: అతని తల మీద ఆ నూనె పోసి
  rationale: יצק మరియు עַל కలయిక తలపై నూనె పోయడాన్ని నేరుగా తెలియజేస్తుంది; సందర్భ స్పష్టత కోసం కర్మను ‘ఆ నూనె’గా వ్యక్తం చేశాం.
- source_word: כֹּה אָמַר יְהוָה
  choice: యాహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే ప్రామాణిక దైవసందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతూ, యెహోవా నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: מְשַׁחְתִּיךָ
  choice: నేను నిన్ను ... అభిషేకించాను
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపాన్ని, ఈ నియామక ప్రకటనలో పూర్తయిన కార్యంగా ప్రతిబింబిస్తుంది.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజుగా
  rationale: లְ నియామక పదవిని సూచిస్తుంది; అసాధారణమైన אֶל ఇక్కడ ఇశ్రాయేలుపై రాజాధికార సంబంధాన్ని సూచిస్తుందని సందర్భం తెలియజేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְנַסְתָּה וְלֹא תְחַכֶּה
  choice: పారిపో; ఆగవద్దు
  rationale: נוס లోని ప్రమాదం నుంచి త్వరగా వెళ్లిపోవాలనే భావాన్ని ‘పారిపో’ నిలుపుతుంది; חכה ను విస్తరించకుండా నేరుగా ‘ఆగవద్దు’గా అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన చతురక్షర నామం నేరుగా ఉంది. దానిని బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: אֶל יִשְׂרָאֵל లోని రాజాధికార సంబంధం
  choice: ఇశ్రాయేలుమీద రాజుగా
  alternative: ఇశ్రాయేలుకు రాజుగా
  rationale: אֶל సాధారణంగా ‘వైపు/కు’ అని అర్థమిచ్చినా, ఇక్కడ రాజుగా నియమించే సూత్రంలో ఇశ్రాయేలుపై పరిపాలనను సూచిస్తుంది. అయినప్పటికీ మూలంలోని అసాధారణ నిర్మాణాన్ని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన ఆజ్ఞల తక్షణత్వాన్ని నిలుపుతూ సహజమైన వాక్యక్రమం వాడబడింది. ‘అభిషేకించాను’ అనే గంభీరమైన బైబిలు పదం సందర్భానికి తగినదిగా ఉంచబడింది; మిగతా పదజాలం సాధారణ పాఠకులకు స్పష్టంగా ఉంది.
