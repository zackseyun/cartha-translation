  to: యెహూ తన విల్లును పూర్తిగా లాగి, యెహోరామును అతని రెండు చేతుల మధ్య[a] బాణంతో కొట్టాడు. ఆ బాణం అతని గుండెను దాటి బయటికి వచ్చింది; అతడు తన రథంలోనే కూలిపోయాడు.
