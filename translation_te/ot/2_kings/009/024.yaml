translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని శరీరస్థాన అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో వివరణాత్మక ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
