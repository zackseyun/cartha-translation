  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵה֞וּא מִלֵּ֧א יָד֣/וֹ בַ/קֶּ֗שֶׁת וַ/יַּ֤ךְ אֶת יְהוֹרָם֙ בֵּ֣ין זְרֹעָ֔י/ו וַ/יֵּצֵ֥א הַ/חֵ֖צִי מִ/לִּבּ֑/וֹ וַ/יִּכְרַ֖ע בְּ/רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: te
  text: యెహూ తన విల్లును పూర్తిగా లాగి, యెహోరామును అతని రెండు చేతుల మధ్య[a] బాణంతో కొట్టాడు. ఆ బాణం అతని గుండెను దాటి బయటికి వచ్చింది; అతడు తన రథంలోనే కూలిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని భుజాల మధ్య’ / ‘అతని భుజపు రెక్కల మధ్య.’ హీబ్రూలో అక్షరార్థంగా ‘అతని రెండు చేతుల మధ్య’ అని ఉంది; ఇది పై వీపు లేదా భుజాల ప్రాంతాన్ని సూచించే నుడికారం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: తన విల్లును పూర్తిగా లాగి
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘విల్లుతో తన చేతిని నింపాడు’ అని ఉన్నా, బాణం వేయడానికి విల్లును పూర్తిగా లాగడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, దృశ్యాన్ని స్పష్టంగా తెలియజేసే రూపం ఎంచుకోబడింది.
- source_word: וַיַּךְ
  choice: కొట్టాడు
  rationale: נכה అనే క్రియకు ‘కొట్టు/దెబ్బతీయు’ అనే విస్తృత అర్థం ఉంది. ఇక్కడ బాణం తగిలిన సందర్భమైనా, మూలంలోని క్రియను మించిపోయి ‘కాల్చాడు’ అని నిర్దిష్టపరచకుండా ‘కొట్టాడు’ అని ఉంచబడింది.
- source_word: בֵּין זְרֹעָיו
  choice: అతని రెండు చేతుల మధ్య
  rationale: זְרוֹעַ సాధారణంగా ‘చేయి/బాహువు’ అని అర్థం. యుద్ధ సందర్భంలో ఇది భుజాల మధ్యనున్న పై వీపు భాగాన్ని సూచించే నుడికారం కావచ్చు; మూలంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, శరీర నిర్మాణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: ఆ బాణం అతని గుండెను చీల్చుకొని బయటికి వచ్చింది
  rationale: మరణకర గాయం సందర్భంలో לֵב శరీరంలోని గుండెను సూచిస్తుంది. బాణం గుండె ప్రాంతం గుండా వెళ్లి బయటికి వచ్చిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּכְרַע
  choice: కూలిపోయాడు
  rationale: כרע అక్షరార్థంగా వంగడం లేదా మోకరించడం అని అర్థమైనా, ప్రాణాంతకమైన బాణపు దెబ్బ తర్వాత శరీరం కుప్పకూలడాన్ని ఇక్కడ సూచిస్తుంది.
- source_word: בְּרִכְבּוֹ
  choice: తన రథంలోనే
  rationale: ప్రత్యయము యెహోరాము రథమని సూచిస్తుంది. ‘లోనే’ అతడు రథంలో కూలిపోయాడనే కథన దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
