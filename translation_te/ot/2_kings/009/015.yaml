  to: రాజైన యెహోరాము అరాము రాజైన హజాయేలుకు వ్యతిరేకంగా యుద్ధం చేస్తున్నప్పుడు అరామీయులు తనకు కలిగించిన గాయాలనుంచి కోలుకోవడానికి యెజ్రెయేలుకు తిరిగి వచ్చాడు. యేహూ, “ఇది మీకు సమ్మతమైతే, యెజ్రెయేలులో ఈ సంగతి తెలియజేయడానికి పట్టణం నుంచి ఎవరూ తప్పించుకొని బయటికి వెళ్లనివ్వకండి” అన్నాడు.
