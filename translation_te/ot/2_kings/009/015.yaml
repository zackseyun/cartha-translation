source:
  edition: WLC
  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: te
  text: రాజైన యెహోరాము అరాము రాజైన హజాయేలుకు వ్యతిరేకంగా యుద్ధం చేస్తున్నప్పుడు అరామీయులు తనకు కలిగించిన గాయాలనుంచి కోలుకోవడానికి యెజ్రెయేలుకు తిరిగి వచ్చాడు. యేహూ, “ఇది మీకు సమ్మతమైతే, యెజ్రెయేలులో ఈ సంగతి తెలియజేయడానికి పట్టణం నుంచి ఎవరూ తప్పించుకొని బయటికి వెళ్లనివ్వకండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చాడు
  rationale: שוב యొక్క సహజమైన అర్థాన్ని తెలుగులో సూటిగా వ్యక్తపరుస్తుంది; సందర్భమే ముందరి సంఘటనతో కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: לְהִתְרַפֵּא
  choice: కోలుకోవడానికి
  rationale: హిత్పయేల్ రూపం గాయాలనుంచి స్వస్థత పొందడాన్ని సూచిస్తుంది; స్వయంగా నయం చేసుకున్నాడనే భావం రాకుండా సహజంగా ఉంది.
- source_word: מִן הַמַּכִּים
  choice: గాయాలనుంచి
  rationale: పదానికి ‘దెబ్బలు’ అనే మూలార్థం ఉన్నా, యుద్ధంలో తగిలి చికిత్స అవసరమైన గాయాలే సందర్భార్థం.
- source_word: יַכֻּהוּ אֲרַמִּים
  choice: అరామీయులు తనకు కలిగించిన
  rationale: נכה యొక్క కొట్టడం/గాయపరచడం భావాన్ని ‘గాయాలు’తో సహజంగా అనుసంధానిస్తుంది; אֲרַמִּיםను చారిత్రకంగా ‘అరామీయులు’గా ఉంచుతుంది.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: హజాయేలుతో యుద్ధం చేస్తున్నప్పుడు
  rationale: בְּతో కూడిన క్రియానామరూపం కాలపరిస్థితిని సూచిస్తుంది; ‘తో యుద్ధం’ విరోధ సంబంధాన్ని సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: ఇది మీకు సమ్మతమైతే
  rationale: అక్షరార్థమైన ‘మీ ప్రాణం/మనస్సు ఉంటే’కు బదులుగా సమూహపు ఇష్టం లేదా అంగీకారాన్ని తెలిపే సహజమైన తెలుగు నుడికారం.
- source_word: פָלִיט
  choice: ఎవరినీ తప్పించుకొని పోనివ్వకండి
  rationale: ఇక్కడ స్థిరమైన ‘పారిపోయినవాడు’ అనే వర్గనామం కంటే, నగరంనుంచి ఎవ్వరూ తప్పించుకోకూడదనే నిషేధ భావమే ప్రధానమైనది.
- source_word: לָלֶכֶת לְהַגִּיד
  choice: వెళ్లి తెలియజేయడానికి
  rationale: రెండు క్రియానామాలు వార్తను తీసుకువెళ్లి చెప్పే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తాయి.
- source_word: בְּיִזְרְעֶאל
  choice: యెజ్రెయేలుకు
  rationale: ఇక్కడ వార్త చేరవలసిన గమ్యస్థాన భావం ఉంది; తెలుగులో దత్తివిభక్తి సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. హెబ్రీ నుడికారాలను పదక్షరంగా కాక వాటి సందర్భార్థంతో అందించగా, చారిత్రక పేర్లు అరాము, అరామీయులు, హజాయేలు, యెజ్రెయేలు, యేహూ రూపాల్లో నిలుపబడ్డాయి.
