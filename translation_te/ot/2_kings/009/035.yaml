reference: 2 Kings 9:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכ֖וּ לְ/קָבְרָ֑/הּ וְ/לֹא מָ֣צְאוּ בָ֗/הּ כִּ֧י אִם הַ/גֻּלְגֹּ֛לֶת וְ/הָ/רַגְלַ֖יִם וְ/כַפּ֥וֹת הַ/יָּדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: te
  text: కాబట్టి వారు ఆమెను పాతిపెట్టడానికి వెళ్లారు; అయితే ఆమె శరీర అవశేషాల్లో పుర్రె, పాదాలు, అరచేతులు తప్ప మరేమీ వారికి దొరకలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆమెలో ... దొరకలేదు’ అని ఉంది. సందర్భంలో ఇది ఆమె శరీరంలో మిగిలిన అవశేషాలను సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: కాబట్టి వారు ... వెళ్లారు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి ఆజ్ఞకు అనుసరణను సందర్భానుసారంగా ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది.
- source_word: לְקָבְרָהּ
  choice: ఆమెను పాతిపెట్టడానికి
  rationale: קבר క్రియాధాతువు యొక్క infinitive construct రూపం, 3వ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయంతో, యెజెబెలును సూచిస్తుంది.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: అయితే ... ఆమెలో మరేమీ వారికి దొరకలేదు
  rationale: వారు పాతిపెట్టడానికి వెళ్లిన ఉద్దేశానికి విరుద్ధమైన ఫలితాన్ని ‘అయితే’ తెలియజేస్తుంది. בָהּ అనే ‘ఆమెలో’ రూపాన్ని ప్రధాన వచనంలో నిలిపి, సందర్భంలోని శరీర అవశేషాల భావాన్ని పాదసూచికలో వివరించాం.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ఈ జంట అవ్యయాలు మినహాయింపు భావాన్ని ఇస్తాయి; ఆధునిక తెలుగులో ‘తప్ప’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: הַגֻּלְגֹּלֶת
  choice: పుర్రె
  rationale: ఈ సందర్భంలో పదం మొత్తం తలను కాక కపాలాన్ని సూచిస్తుంది; ‘పుర్రె’ దృశ్యంలోని కాఠిన్యాన్ని నిలుపుతుంది.
- source_word: וְהָרַגְלַיִם
  choice: పాదాలు
  rationale: ద్వివచన రూపమైన רַגְלַיִם ఇక్కడ శరీర అవశేషాల్లోని పాదాలను సూచిస్తుంది; ‘పాదాలు’ అనేది ‘కాళ్లు’ కంటే శరీర భాగాన్ని మరింత నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: అరచేతులు
  rationale: כַּף చేతి లోపలి భాగాన్ని, అంటే అరచేతిని సూచిస్తుంది; ‘అరచేతులు’ హీబ్రూ పదబంధంలోని నిర్దిష్టతను సహజమైన తెలుగులో కాపాడుతుంది.
