  naturalness: The wording is generally modern and clear, but “ఆమెలో మరేమీ వారికి దొరకలేదు” is awkward and potentially confusing in Telugu. “ఆమె శరీర అవశేషాల్లో” naturally conveys the contextual idiom without losing the sense.
  terminology: “పుర్రె,” “పాదాలు,” and “అరచేతులు” are accurate, suitably direct modern-standard Telugu renderings of the Hebrew terms. “పాతిపెట్టడానికి” is appropriate in context.
