translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. శరీర భాగాలకు స్పష్టమైన సాధారణ పదాలు ఎంచుకోబడ్డాయి; మూలంలోని בָהּ యొక్క రూపాన్ని ప్రధాన వచనంలో ఉంచి దాని సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
