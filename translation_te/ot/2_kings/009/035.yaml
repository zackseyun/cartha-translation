  to: కాబట్టి వారు ఆమెను పాతిపెట్టడానికి వెళ్లారు; అయితే ఆమె శరీర అవశేషాల్లో పుర్రె, పాదాలు, అరచేతులు తప్ప మరేమీ వారికి దొరకలేదు.[a]
