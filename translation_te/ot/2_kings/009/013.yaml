id: 2KI.9.13
reference: 2 Kings 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְמַהֲר֗וּ וַ/יִּקְחוּ֙ אִ֣ישׁ בִּגְד֔/וֹ וַ/יָּשִׂ֥ימוּ תַחְתָּ֖י/ו אֶל גֶּ֣רֶם הַֽ/מַּעֲל֑וֹת וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּאמְר֖וּ מָלַ֥ךְ יֵהֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: te
  text: అప్పుడు వారు త్వరపడి, ప్రతి ఒక్కరూ తమ వస్త్రాన్ని తీసుకొని అతని కింద మెట్ల బోడి ఉపరితలంపై[a] పరిచారు. వారు కొమ్ము బూరను ఊదారు,[b] “యెహూ రాజయ్యాడు!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మెట్ల పైభాగంలో,” లేదా “మెట్ల మలుపులోని చదునైన చోట.” ఇక్కడి హీబ్రూ పదబంధం అరుదైనది; దాని ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో షోఫార్—సంకేతం ఇవ్వడానికి ఉపయోగించే కొమ్ము వాద్యం; సంప్రదాయంగా “బూర” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: వారు త్వరపడి
  rationale: מהר అనే క్రియలోని వెంటనే, వేగంగా చర్య తీసుకున్న భావాన్ని కథన క్రమంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ בִּגְדוֹ
  choice: ప్రతి ఒక్కరూ తమ వస్త్రాన్ని తీసి
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో ‘ప్రతి ఒక్కరూ’; בֶּגֶד సాధారణంగా వస్త్రం లేదా పైవస్త్రం. ‘వస్త్రం’ మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: అతని కింద పరిచారు
  rationale: תַחְתָּיו సహజంగా యెహూను సూచిస్తుంది. వస్త్రాల సందర్భంలో ‘పరిచారు’ సహజ తెలుగు; వాటిని ఎలా అమర్చారో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: మెట్లలోని బోడిగా ఉన్న చోట
  rationale: అరుదైన גֶּרֶם పదం మెట్ల బోడి ఉపరితలం, పైభాగం లేదా మెట్ల మలుపులోని చదునైన చోటును సూచించవచ్చు. ప్రధాన పాఠం ఒక సాధ్యమైన అర్థాన్ని ఇస్తూ, పాదసూచికలో అనిశ్చితిని నిలుపుతుంది.
- source_word: וַיִּתְקְעוּ בַּשֹּׁפָר
  choice: కొమ్ముబూర ఊది
  rationale: שׁוֹפָר సంకేతాల కోసం ఊదే కొమ్ము వాద్యం. ‘కొమ్ముబూర’ సాధారణ పాఠకునికి దాని స్వరూపాన్ని తెలియజేస్తుంది; కేవలం ఆధునిక లోహపు బూరను సూచించే అవకాశాన్ని తగ్గిస్తుంది.
- source_word: מָלַךְ יֵהוּא
  choice: యెహూ రాజయ్యాడు
  rationale: పూర్తిక్రియ యెహూ రాజ్యాధికారంలోకి వచ్చిన సంఘటనను పూర్తయినదిగా ప్రకటిస్తుంది. ‘రాజయ్యాడు’ ఆ ప్రవేశ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: מָלַךְ అనే క్రియను స్థితిగా లేదా రాజ్యప్రవేశ సంఘటనగా అనువదించడం
  choice: యెహూ రాజయ్యాడు
  alternative: యెహూ రాజు! / యెహూ ఏలుతున్నాడు!
  rationale: సందర్భం యెహూ రాజ్యప్రవేశాన్ని ప్రకటిస్తోంది; అందువల్ల పూర్తిక్రియలోని సంఘటనాత్మక బలాన్ని నిలుపుతూ, ఎవరు అతన్ని రాజుగా చేశారనే విషయాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. అరుదైన మెట్ల పదబంధంలోని నిజమైన అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ఉన్నాయి.
