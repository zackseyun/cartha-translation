  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని షాలోమ్ పద పునరుక్తిని ‘క్షేమం’ ద్వారా నిలిపాం. రాజసందేశ సూత్రాన్ని అతిగా ప్రాచీనంగా కాకుండా అధికారికంగా ఉంచాం.
