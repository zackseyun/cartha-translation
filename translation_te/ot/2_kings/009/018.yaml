  text: וַ/יֵּלֶךְ֩ רֹכֵ֨ב הַ/סּ֜וּס לִ/קְרָאת֗/וֹ וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ הֲ/שָׁל֔וֹם וַ/יֹּ֧אמֶר יֵה֛וּא מַה לְּ/ךָ֥ וּ/לְ/שָׁל֖וֹם סֹ֣ב אֶֽל אַחֲרָ֑/י וַ/יַּגֵּ֤ד הַ/צֹּפֶה֙ לֵ/אמֹ֔ר בָּֽא הַ/מַּלְאָ֥ךְ עַד הֵ֖ם וְ/לֹֽא שָֽׁב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: te
  text: 'అప్పుడు గుర్రపు రౌతు అతనిని ఎదుర్కోవడానికి వెళ్లి, “రాజు ఇలా అంటున్నాడు: ‘క్షేమమేనా?’[a]” అని అడిగాడు. అయితే యెహూ, “క్షేమంతో నీకేమి పని? తిరిగి నా వెనుక చేరుకో[b]” అన్నాడు. అప్పుడు కావలివాడు, “దూత వారి దగ్గరికి చేరుకున్నాడు, కానీ తిరిగి రాలేదు” అని తెలిపాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అంతా శాంతిగా ఉందా?’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం షాలోమ్; దీనికి శాంతి, క్షేమం అనే భావాలున్నాయి. ఈ సంభాషణలో అదే పదం మళ్లీ వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా వెనుకకు తిరుగు.” అంటే, “నా వెనుక వచ్చి చేరు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: గుర్రపు రౌతు
  rationale: అక్షరార్థంగా ‘గుర్రాన్ని స్వారీ చేసేవాడు.’ సైనిక సందేశవాహకుని సందర్భంలో ‘గుర్రపు రౌతు’ సంక్షిప్తంగా, సహజంగా పాత్రను తెలియజేస్తుంది.
- source_word: לִקְרָאתוֹ
  choice: అతనిని ఎదుర్కోవడానికి
  rationale: ఎదుటికి వెళ్లి కలుసుకోవాలనే గమనార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: రాజు ఇలా అంటున్నాడు
  rationale: రాజు పంపిన అధికారిక సందేశ సూత్రాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הֲשָׁלוֹם
  choice: క్షేమమేనా?
  rationale: שָׁלוֹם ఇక్కడ శాంతి, సురక్షిత స్థితి, క్షేమం అనే భావాలను కలిగి ఉంది. ‘క్షేమం’ సంభాషణలో సహజంగా ఉండి, తరువాతి జవాబులోనూ మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: క్షేమంతో నీకేమి పని?
  rationale: దూత అడిగిన ప్రశ్నను యెహూ తిరస్కరించే హీబ్రూ నుడికారాన్ని, ‘క్షేమం’ అనే కీలక పద పునరుక్తితో సహా నిలుపుతుంది.
- source_word: סֹב אֶל אַחֲרָי
  choice: తిరిగి నా వెనుక చేరుకో
  rationale: అక్షరార్థమైన ‘నా వెనుకకు తిరుగు’ అనే ఆజ్ఞను, యెహూ బృందం వెనుక చేరాలనే సందర్భార్థంతో స్పష్టంగా వ్యక్తం చేస్తుంది; అక్షరార్థ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: הַצֹּפֶה
  choice: కావలివాడు
  rationale: ఎత్తైన స్థలం నుంచి గమనిస్తూ నివేదించే వ్యక్తికి సాధారణ పాఠకులకు అర్థమయ్యే సహజ తెలుగు పదం.
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: ఈ చారిత్రక సందర్భంలో ఇది మానవ సందేశవాహకుణ్ణి సూచిస్తుంది; ‘దూత’ తెలుగులో సంక్షిప్తమైన సాధారణ సమానార్థకం.
- source_word: בָּא ... עַד הֵם
  choice: వారి దగ్గరికి చేరుకున్నాడు
  rationale: దూత వారి స్థానం వరకు వచ్చాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא שָׁב
  choice: కానీ తిరిగి రాలేదు
  rationale: కావలివాడు గమనించిన విరుద్ధ ఫలితాన్ని స్పష్టమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
