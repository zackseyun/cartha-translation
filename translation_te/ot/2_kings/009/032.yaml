  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: te
  text: అతడు కిటికీవైపు ముఖం ఎత్తి, “నాతో ఎవరు ఉన్నారు? ఎవరు?” అని అడిగాడు. అప్పుడు ఇద్దరో ముగ్గురో నపుంసకులు[a] అతనివైపు కిందకు చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజభవన అధికారులు”; హీబ్రూ పదం ఈ రెండు అర్థాల్లోనూ వాడవచ్చు. అయితే రాజభవన సందర్భంలో “నపుంసకులు” అనే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: ముఖం ఎత్తి
  rationale: హీబ్రూ పదబంధంలోని ‘ముఖాన్ని ఎత్తడం’ అనే దృశ్యరూపాన్ని నిలుపుతూ, పైవైపు చూడడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַחַלּוֹן
  choice: కిటికీ
  rationale: రాజభవనంలోని పైభాగపు నిర్మాణ రంధ్రాన్ని సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: מִי אִתִּי מִי
  choice: నా పక్షాన ఎవరు ఉన్నారు? ఎవరు?
  rationale: אִתִּי అక్షరార్థంగా ‘నాతో’ అయినప్పటికీ, ఇక్కడ యేహూ తనకు మద్దతిచ్చేవారిని పిలుస్తున్న సందర్భార్థాన్ని ‘నా పక్షాన’ సహజంగా వ్యక్తపరుస్తుంది; రెండో מִי పునరుక్తిని నిలిపింది.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: అతని వైపు కిందికి చూశారు
  rationale: שׁקף ఎత్తైన చోటు నుంచి బయటికి లేదా కిందికి చూడడాన్ని సూచిస్తుంది; కిటికీ వద్ద ఉన్నవారు యేహూవైపు కిందికి చూస్తున్న స్థల సంబంధాన్ని ఈ అనువాదం స్పష్టం చేస్తుంది.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: ఇద్దరో ముగ్గురో
  rationale: చిన్న, నిర్దిష్టం కాని సంఖ్యను సూచించే హీబ్రూ సంఖ్యాజోడికి సహజమైన తెలుగు సమానం.
- source_word: סָרִיסִים
  choice: నపుంసకులు
  rationale: రాజభవన సందర్భంలో ఈ పదానికి అత్యంత సంభావ్యమైన అర్థం ‘నపుంసకులు’; అయితే అది రాజోద్యోగులను కూడా సూచించగలదనే పదార్థ సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
