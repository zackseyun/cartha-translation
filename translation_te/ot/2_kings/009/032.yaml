translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ పునరుక్తి, స్థల సంబంధం, సָרִיסִים పదంలోని నిజమైన అర్థసందిగ్ధత నిలుపబడ్డాయి.
