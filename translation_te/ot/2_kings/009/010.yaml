translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. తీర్పు వాక్యంలోని సంక్షిప్తతను, తరువాతి చర్యలోని వేగాన్ని నిలుపుతూ మూలంలోని భూభాగ పరిమాణ అస్పష్టతను పాదటిప్పణిలో భద్రపరిచింది.
