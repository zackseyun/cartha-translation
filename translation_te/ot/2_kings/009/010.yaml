  to: యెజ్రెయేలు భూమిలోని భాగంలో[a] యెజెబెలును కుక్కలు తింటాయి, ఆమెను పాతిపెట్టేవారెవరూ ఉండరు.” తరువాత అతడు తలుపు తెరిచి పారిపోయాడు.
