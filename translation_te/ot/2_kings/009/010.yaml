id: 2KI.9.10
reference: 2 Kings 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: te
  text: యెజ్రెయేలు భూమిలోని భాగంలో[a] యెజెబెలును కుక్కలు తింటాయి, ఆమెను పాతిపెట్టేవారెవరూ ఉండరు.” తరువాత అతడు తలుపు తెరిచి పారిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెజ్రెయేలు పొలంలో.’ హెబ్రీ పదం חֵלֶק భూమిలోని ఒక భాగాన్ని, వాటాను, లేదా పొలభాగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: తింటాయి
  rationale: ప్రవచనాత్మక తీర్పు సందర్భంలోని సాధారణ భవిష్యదర్థాన్ని నేరుగా వ్యక్తపరుస్తుంది; ‘మింగివేస్తాయి’ అనడం మూలంలోని తీవ్రతను మించి వ్యాఖ్యానించే అవకాశం ఉంది.
- source_word: הַכְּלָבִים
  choice: కుక్కలు
  rationale: తెలుగులో జాతివాచక బహువచనానికి ప్రత్యేక నిర్దేశక పదం అవసరం లేదు; సందర్భం హెబ్రీ నిర్దిష్టతను సహజంగా తెలియజేస్తుంది.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: యెజ్రెయేలు భూభాగంలో
  rationale: חֵלֶק ఇక్కడ భూమిలోని భాగం, విస్తీర్ణం లేదా క్షేత్రభాగాన్ని సూచిస్తుంది. ‘భూభాగం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అది తప్పనిసరిగా చిన్న పొలమని నిర్ధారించదు.
- source_word: וְאֵין קֹבֵר
  choice: ఆమెను పాతిపెట్టేవారెవరూ ఉండరు
  rationale: అక్షరార్థంగా ‘పాతిపెట్టేవాడు లేడు’; సందర్భం ఆధారంగా కర్మను ‘ఆమెను’ అని స్పష్టంచేసి, ప్రవచనంలోని భవిష్యదర్థాన్ని నిలుపుతుంది.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: తరువాత అతడు తలుపు తెరిచి
  rationale: వయ్యిక్టోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘తరువాత’ ఆ వరుసను సహజ తెలుగులో చూపుతుంది.
- source_word: וַיָּנֹס
  choice: పారిపోయాడు
  rationale: נוּס యొక్క ‘పారిపోవు’ అనే అర్థాన్ని సంక్షిప్తంగా, అత్యవసరతతో వ్యక్తపరుస్తుంది.
- source_word: אִיזֶבֶל
  choice: యెజెబెలు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించింది.
