  text: וְ/יֵה֗וּא יָצָא֙ אֶל עַבְדֵ֣י אֲדֹנָ֔י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ הֲ/שָׁל֔וֹם מַדּ֛וּעַ בָּֽא הַ/מְשֻׁגָּ֥ע הַ/זֶּ֖ה אֵלֶ֑י/ךָ וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֛ם יְדַעְתֶּ֥ם אֶת הָ/אִ֖ישׁ וְ/אֶת שִׂיחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: te
  text: తర్వాత యేహూ బయటికి వచ్చి తన యజమాని సేవకుల దగ్గరికి వెళ్లాడు. వారిలో ఒకడు అతనితో, “అంతా క్షేమమేనా?[a] ఈ పిచ్చివాడు[b] నీ దగ్గరికి ఎందుకు వచ్చాడు?” అని అడిగాడు. అతడు వారితో, “ఆ మనిషి గురించి, అతని మాటల గురించి మీకు తెలుసు[c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “శాంతి ఉందా?” అంటే, “అంతా సవ్యంగానే ఉందా?”
    reason: lexical_alternative
  - marker: b
    text: “ఈ పిచ్చిపట్టినవాడు” లేదా “ఈ వెర్రివాడు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అవమానకరమైన ముద్ర.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆ మనిషిని, అతని మాటలను మీరు తెలుసు.” హీబ్రూ పదం ఒకరి మాటలను, సంభాషణను లేదా మాట్లాడే తీరును విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: తన యజమాని సేవకులు
  rationale: עֶבֶד ఇక్కడ యేహూ పైఅధికారి కింద ఉన్న సేవకులు లేదా అధికారులు అనే భావంలో ఉంది; బానిసత్వాన్ని అనవసరంగా సూచించకుండా ‘సేవకులు’ సహజంగా ఉంది. אֲדֹנָיוను మూలంలోని అస్పష్టతను కాపాడుతూ ‘తన యజమాని’గా అనువదించాం.
- source_word: הֲשָׁלוֹם
  choice: అంతా క్షేమమేనా?
  rationale: అక్షరార్థంగా ‘శాంతేనా?’ అనే ప్రశ్న అయినా, సందర్భంలో పరిస్థితి సవ్యంగా లేదా క్షేమంగా ఉందా అని అడిగే హీబ్రూ నానుడి. ఆధునిక తెలుగులో ‘అంతా క్షేమమేనా?’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מַדּוּעַ בָּא
  choice: ఎందుకు వచ్చాడు?
  rationale: కథన సంభాషణలో పూర్తయిన రాకను గురించి కారణం అడుగుతోంది; తెలుగు సాధారణ భూతకాల రూపం సరిపోతుంది.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: ఈ పిచ్చివాడు
  rationale: ఈ పదబంధం అవమానకరంగా ‘పిచ్చిపట్టినవాడు’ అని ముద్ర వేస్తుంది. ‘ఈ పిచ్చివాడు’ దాని తిరస్కార ధోరణిని తగ్గించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיֹּאמֶר לוֹ
  choice: వారిలో ఒకడు అతనితో ... అడిగాడు
  rationale: బహువచన సమూహాన్ని అనుసరించిన ఏకవచన క్రియను పంపిణీ భావంలో గ్రహించి, సమూహంలో ఒకడు మాట్లాడినట్లు స్పష్టం చేశాం.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: ఆ మనిషి ఎలాంటివాడో ... మీకు తెలుసు
  rationale: కేవలం వ్యక్తితో పరిచయం ఉందనే అర్థం కంటే, అతని స్వభావం లేదా రకం వారికి తెలుసని యేహూ తప్పించుకునే ధోరణితో సూచిస్తున్నాడు. తెలుగు వాక్యం ఆ అంతర్భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׂיחוֹ
  choice: అతని మాటలు ఎలాంటివో
  rationale: שִׂיחַ మాట, సంభాషణ, ప్రసంగరీతి వంటి విస్తృత అర్థాలను కలిగి ఉంది. ‘మాటలు’ నిర్దిష్టంగా ‘సందేశం’ లేదా ‘వాగుడు’ అని తేల్చకుండా అస్పష్టతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సేవకుల ప్రశ్నలోని వ్యంగ్యమైన అవమాన ధోరణిని ‘పిచ్చివాడు’ ద్వారా నిలిపాం; యేహూ ఇచ్చిన అస్పష్టమైన, తప్పించుకునే జవాబును మరీ వివరణాత్మకంగా చేయకుండా ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
