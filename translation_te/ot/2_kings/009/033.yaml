  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: te
  text: అతడు, “ఆమెను కిందికి తోసివేయండి!” అన్నాడు. అప్పుడు వారు ఆమెను కిందికి తోసివేశారు. ఆమె రక్తం కొంత గోడపైనా గుర్రాలపైనా చిమ్మింది[a]. అతడు ఆమెను తొక్కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆమె రక్తం గోడపైనా గుర్రాలపైనా చిమ్మింది.” హీబ్రూలో అక్షరార్థంగా, “ఆమె రక్తం నుండి గోడమీదకూ గుర్రాలమీదకూ చిమ్మింది” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: ఆమెను కిందికి తోసివేయండి!
  rationale: ఈ సందర్భంలో שמט ఆ స్త్రీ కిటికీ నుంచి కింద పడేలా చేయమనే బలమైన ఆజ్ఞ. ‘కిందికి తోసివేయండి’ ఆధునిక తెలుగులో సహజంగా ఉండి చర్యలోని హింసను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וישמטוה
  choice: వారు ఆమెను కిందికి తోసివేశారు
  rationale: ఆజ్ఞలో వాడిన అదే హీబ్రూ ధాతువు ఇక్కడ అమలైన చర్యను తెలియజేస్తుంది. తెలుగులోనూ అదే క్రియను పునరావృతం చేయడం మూలపాఠంలోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ויז מדמה
  choice: ఆమె రక్తంలో కొంత ... చిందింది
  rationale: ויז చిమ్మడం లేదా చిందడాన్ని సూచిస్తుంది; מן తో కూడిన ‘ఆమె రక్తం’ అనే నిర్మాణం ఇక్కడ భాగార్థకంగా ఉంది. అందువల్ల ‘రక్తంలో కొంత’ అని అనువదించడం సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: הקיר
  choice: గోడ
  rationale: קיר కు సాధారణ అర్థం ‘గోడ’; అదనపు వివరణ అవసరం లేదు.
- source_word: הסוסים
  choice: గుర్రాలు
  rationale: హీబ్రూ బహువచనానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: וירמסנה
  choice: అతడు ఆమెను తొక్కాడు
  rationale: רמס అంటే తొక్కడం. ఏకవచన క్రియకు యెహూయే కర్తగా ఉండటాన్ని ఈ అనువాదం నిలుపుతుంది; గుర్రాలు ప్రస్తావించబడినప్పటికీ, తొక్కిన విధానాన్ని మూలపాఠం స్పష్టంగా చెప్పనందున దాన్ని అనువాదంలో చేర్చలేదు.
