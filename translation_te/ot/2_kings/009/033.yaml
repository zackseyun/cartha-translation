translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కథన శైలిని వాడాం. ఆజ్ఞలోనూ దాని అమలులోనూ ఒకే క్రియను ఉంచి హీబ్రూ పునరుక్తిని నిలిపాం. చివరి వాక్యంలో తొక్కిన సాధనాన్ని నిర్దిష్టం చేయకుండా మూలపాఠంలోని సంక్షిప్తతను, సంభావ్య అస్పష్టతను కాపాడాం.
