  to: 'అప్పుడు యేహూ తన అధికారి బిద్కరుతో[a], “అతనిని ఎత్తుకొని యెజ్రెయేలీయుడైన నాబోతు పొలంలోని భాగంలో పడవేయి. జ్ఞాపకం చేసుకో: నువ్వూ నేనూ అతని తండ్రియైన అహాబు వెనుక జంటగా స్వారీ చేస్తూ వెళ్లినప్పుడు[b], యాహ్వే అతనిమీద ఈ ప్రవచన వాక్యాన్ని ప్రకటించాడు[c]” అన్నాడు.'
  rationale: దైవనామాన్ని ప్రాజెక్టు నిర్ణయానికి అనుగుణంగా “యాహ్వే”గా సరిచేశాం. నాబోతు పొలంలోని నిర్దిష్ట భాగం అనే חלקת שדה భావాన్ని “పొలంలోని భాగంలో”గా ఉంచాం. అహాబు యోరాము తండ్రి అని స్పష్టమయ్యేలా “అతని తండ్రియైన అహాబు” అని మార్చాం. מַשָּׂא యొక్క గంభీర ప్రవచనార్థాన్ని, అతనికి వ్యతిరేకమైన లక్ష్యాన్ని “అతనిమీద ఈ ప్రవచన వాక్యాన్ని ప్రకటించాడు”లో కాపాడాం; పాదసూచికలోని అర్థపరమైన అనిశ్చితిని నిలిపాం.
