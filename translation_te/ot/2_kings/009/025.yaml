id: 2KI.9.25
reference: 2 Kings 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: te
  text: 'అప్పుడు యేహూ తన అధికారి బిద్కరుతో[a], “అతనిని ఎత్తుకొని యెజ్రెయేలీయుడైన నాబోతు పొలంలోని భాగంలో పడవేయి. జ్ఞాపకం చేసుకో: నువ్వూ నేనూ అతని తండ్రియైన అహాబు వెనుక జంటగా స్వారీ చేస్తూ వెళ్లినప్పుడు[b], యాహ్వే అతనిమీద ఈ ప్రవచన వాక్యాన్ని ప్రకటించాడు[c]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన మూడవ మనిషితో.” ఇది బిద్కరు హోదా లేదా స్థానానికి సంబంధించిన సాంకేతిక పదం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “జంటలుగా స్వారీ చేస్తూ.” యేహూ, బిద్కరు అహాబు వెనుక కలిసి స్వారీ చేశారనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “దైవోక్తిని” లేదా “భారాన్ని.” ఈ హీబ్రూ పదం గంభీరమైన ప్రవచన ప్రకటనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: బిద్కరు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు లిప్యంతరీకరణ పద్ధతిలో ఇచ్చాం.
- source_word: שלשה
  choice: తన అధికారి
  rationale: ఇది బిద్కరు హోదా లేదా స్థానాన్ని సూచించే సాంకేతిక పదంగా కనిపిస్తుంది; ఖచ్చితమైన సైనిక హోదాను నిర్ణయించకుండా సందర్భానుకూలమైన సాధారణ పదాన్ని వాడాం.
- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: అతణ్ణి ఎత్తి ... పడవేయి
  rationale: శవాన్ని ఎత్తి అక్కడ పారవేయాలనే రెండు ఆజ్ఞల ప్రత్యక్ష బలాన్ని సహజ తెలుగులో నిలిపాం.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: పొలంలోని భూభాగంలో
  rationale: חֶלְקָה సూచించే ప్రత్యేక భూభాగాన్ని, שָׂדֶה సూచించే పొలాన్ని రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: యెజ్రెయేలీయుడైన నాబోతు
  rationale: వ్యక్తి పేరు, ప్రాంతీయ గుర్తింపు రెండింటినీ తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: רֹכְבִים צְמָדִים
  choice: జంటగా స్వారీ చేస్తూ
  rationale: అక్షరార్థంగా ‘జంటలుగా/జతగా స్వారీచేస్తూ’; యేహూ, బిద్కరు కలిసి అహాబు వెనుక ప్రయాణించిన భావాన్ని నిలుపుతూ, ‘పక్కపక్కనే’ అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: అతని తండ్రి అహాబు వెనుక
  rationale: ‘అతని’ అనేది చంపబడిన యోరాము తండ్రి అహాబును సూచిస్తుందని తెలుగులో స్పష్టం చేశాం.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామం יהוהను తెలుగు పాఠకులకు సుపరిచితమైన ప్రత్యక్ష నామరూపంలో ఇచ్చాం.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: అతనికి విరోధంగా ఈ ప్రవచన ప్రకటనను చేశాడు
  rationale: מַשָּׂא యొక్క భారమైన, అపశకునాత్మక ప్రవచన వాక్య భావాన్ని ‘ప్రవచన ప్రకటన’గా తెలియజేసి, עָלָיוలోని ప్రతికూల లక్ష్యాన్ని ‘విరోధంగా’తో నిలిపాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్ష నామంగా ఉంచాం; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: מַשָּׂא యొక్క ప్రవచన స్వభావం
  choice: ప్రవచన ప్రకటన
  alternative: భారం / దైవోక్తి
  rationale: ఈ పదంలోని గంభీరమైన తీర్పు ప్రకటన భావాన్ని కాపాడుతూ, ‘భారం’ అనే అస్పష్ట అక్షరార్థం వల్ల కలిగే అపార్థాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరమైన, ప్రత్యక్ష శైలి. సైనిక హోదా, ‘జంటగా స్వారీ,’ מַשָּׂא అనే ప్రవచన పదం విషయంలో మూలంలోని అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
