source:
  edition: WLC
  text: וַ/יָּשֻׁבוּ֮ וַ/יַּגִּ֣ידוּ ל/וֹ֒ וַ/יֹּ֨אמֶר֙ דְּבַר יְהוָ֣ה ה֔וּא אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֛/וֹ אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹ֑ר בְּ/חֵ֣לֶק יִזְרְעֶ֔אל יֹאכְל֥וּ הַ/כְּלָבִ֖ים אֶת בְּשַׂ֥ר אִיזָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: te
  text: 'వారు తిరిగి వచ్చి అతనికి ఆ సంగతి తెలియజేశారు. అప్పుడు అతడు ఇలా అన్నాడు: “ఇది యాహ్వే వాక్యం. ఆయన తన సేవకుడైన తిష్బీయుడైన ఏలీయా ద్వారా ఇలా చెప్పాడు: ‘యెజ్రెయేలు ప్రాంతంలో[a] కుక్కలు యెజెబెలు మాంసాన్ని తింటాయి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెజ్రెయేలు భూమి భాగంలో.” ఇక్కడి హెబ్రీ పదం ఒక భూభాగాన్ని లేదా నిర్దిష్టమైన భూమి ముక్కను సూచించగలదు.
    reason: חֵלֶק అనే పదంలోని భౌగోళిక విస్తృతి లేదా నిర్దిష్ట భూమి భాగం అనే అర్థసంభావ్యతను నిలుపుటకు.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: వారు తిరిగి వచ్చి అతనికి ఆ సంగతి తెలియజేశారు
  rationale: హెబ్రీ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా అందిస్తుంది; נגד హిఫిల్ రూపంలోని ‘తెలియజేయు/నివేదించు’ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: דְּבַר יְהוָה הוּא
  choice: ఇది యాహ్వే వాక్యం
  rationale: క్రియలేని హెబ్రీ వాక్యంలోని గుర్తింపు, ఉద్ఘాటనలను సంక్షిప్తంగా నిలుపుతూ, దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: בְּיַד עַבְדּוֹ
  choice: తన సేవకుడైన ... ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హెబ్రీ ప్రయోగం ఇక్కడ ప్రవక్త ద్వారా సందేశం అందించడాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ సహజంగా అదే సాధనార్థాన్ని తెలియజేస్తుంది.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: తిష్బీయుడైన ఏలీయా
  rationale: వ్యక్తి పేరును, అతని ప్రాంతీయ గుర్తింపును తెలుగు బైబిలు శైలికి అనుగుణంగా స్పష్టంగా అందిస్తుంది.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: యెజ్రెయేలు ప్రాంతంలో[a]
  rationale: חֵלֶק అనే పదం భాగం, భూభాగం లేదా భూమి ముక్కను సూచించగలదు. ప్రధాన పాఠంలో విస్తృత భౌగోళిక భావానికి సహజమైన ‘ప్రాంతం’ వాడి, సంకుచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: కుక్కలు ... తింటాయి
  rationale: సాధారణ క్రియార్థాన్ని, ప్రవచనంలోని నిష్కపటమైన భీకరతను అదనపు తీవ్రపదం లేకుండా నిలుపుతుంది.
- source_word: בְּשַׂר אִיזָבֶל
  choice: యెజెబెలు మాంసాన్ని
  rationale: בָּשָׂר అనే పదంలోని నిర్దిష్టమైన ‘మాంసం’ భావాన్ని ‘శరీరం’గా సౌమ్యీకరించకుండా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన చతురక్షరి ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా సాధారణమైన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. హెబ్రీ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా భావక్రమం నిలుపబడింది; ప్రవచనంలోని కఠినమైన ‘మాంసం’ అనే పదం సౌమ్యీకరించబడలేదు. పాదటిప్పణి సూచిక సంబంధిత పదబంధం వెంటనే ఉంచబడింది.
