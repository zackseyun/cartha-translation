source:
  edition: WLC
  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: te
  text: యూదా రాజైన అహజ్యా అది చూసి, బేత్-హగ్గాను[a] దారిన పారిపోయాడు. యెహూ అతన్ని వెంబడించి, “అతన్ని కూడా రథంలో[b], యిబ్లెయాము దగ్గరనున్న గూరు ఎక్కుదారి వద్ద కొట్టు!” అన్నాడు. అతడు మెగిద్దోకు పారిపోయి అక్కడ చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బేత్-హగ్గాను’ అనే పేరుకు ‘తోట ఇల్లు’ అనే అర్థం ఉండవచ్చు; ఇక్కడ అది స్థలనామం కావడంతో లిప్యంతరీకరించబడింది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘రథం వైపుకు.’ ఇక్కడి హీబ్రూ విభక్త్యర్థక పదం స్థలాన్ని గానీ దిశను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: అది చూసి
  rationale: హీబ్రూ క్రియకు కర్మ ప్రత్యక్షంగా లేకపోయినా, ముందటి సంఘటనను సూచించే భావాన్ని సహజమైన తెలుగులో ‘అది’ అని తెలిపింది.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: బేత్-హగ్గాను మార్గంగా
  rationale: בֵּית הַגָּן ఇక్కడ స్థలనామంగా పనిచేస్తున్నందున అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం; דֶּרֶךְ యొక్క మార్గార్థాన్ని నిలిపాం.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: అతన్ని వెంబడించి
  rationale: רדף + אַחַר కలయికలోని వెంటపడే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: גַּם אֹתוֹ
  choice: అతన్ని కూడా
  rationale: 'גַּם యొక్క చేర్పు భావాన్ని స్పష్టంగా నిలుపుతుంది: యెహోరాముతో పాటు అహజ్యాను కూడా కొట్టాలి.'
- source_word: הַכֻּהוּ
  choice: కొట్టు
  rationale: נכה యొక్క విస్తృతమైన ‘కొట్టు/దెబ్బకొట్టు’ భావాన్నే ఉంచి, ‘చంపు’ అని ఫలితాన్ని ముందుగానే నిర్దిష్టం చేయలేదు; హీబ్రూలోని ఏకవచన ఆజ్ఞను నిలిపాం.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: రథంలోనే
  rationale: אֶל సాధారణంగా దిశను సూచించినా, ఇక్కడ అహజ్యా రథంలో ఉన్నప్పుడే దాడి చేయాలనే స్థలార్థం సందర్భానికి సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּמַעֲלֵה גוּר
  choice: గూరు ఎక్కుదారి వద్ద
  rationale: מַעֲלֶה సూచించే ఎత్తుకు వెళ్లే దారి లేదా కనుమ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలిపింది.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: యిబ్లెయాము దగ్గర ఉన్న
  rationale: గూరు ఎక్కుదారిని యిబ్లెయాముతో భౌగోళికంగా సంబంధపరుస్తున్న పదబంధాన్ని అతిగా ఖచ్చితీకరించకుండా తెలిపింది.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: మెగిద్దోకు పారిపోయి
  rationale: స్థలనామం గమ్యాన్ని సూచిస్తున్న సహజ భావంతో נוס యొక్క ‘పారిపోవు’ అర్థాన్ని నిలిపింది.
- source_word: וַיָּמָת שָׁם
  choice: అక్కడ చనిపోయాడు
  rationale: సంఘటనల క్రమాన్ని సూటిగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఆజ్ఞ తరువాత దెబ్బ తగిలిన విషయాన్ని వ్యక్తీకరించడం
  choice: ‘అప్పుడు ... అతన్ని కొట్టారు’ అని సందర్భంలో అంతర్లీనంగా ఉన్న కార్యసిద్ధిని స్పష్టం చేయడం
  alternative: ఆజ్ఞను నేరుగా ‘గూరు ఎక్కుదారి వద్ద అతన్ని కొట్టు’ అని కొనసాగించి, ప్రత్యేక కార్యసిద్ధి వాక్యాన్ని ఇవ్వకపోవడం
  rationale: మసొరెటిక్ పాఠంలో ప్రత్యేక బహువచన క్రియ లేకపోయినా, అహజ్యా గాయపడి మెగిద్దోకు పారిపోయి చనిపోవడానికి దారితీసిన కార్యం కథనంలో అంతర్లీనంగా ఉంది. ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా తెలుగులో సంఘటనల అనుసంధానాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. వ్యక్తి, స్థలనామాలను తెలుగు బైబిల్ పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదటిప్పణుల వద్దనే ఉంచబడ్డాయి.
