  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: te
  text: యెహూ నగర ద్వారం గుండా లోపలికి వచ్చినప్పుడు, ఆమె, “తన యజమానిని చంపిన జిమ్రీ[a], క్షేమమేనా?[b]” అని అడిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెజెబెలు యెహూను ‘జిమ్రీ’ అని ఎగతాళిగా పిలిచింది. జిమ్రీ తన యజమానిని చంపి సింహాసనాన్ని స్వాధీనం చేసుకున్నాడు; 1 రాజులు 16:9–20 చూడండి.
    reason: cross_reference
  - marker: b
    text: లేదా, “శాంతిగా వచ్చావా?” లేదా “అంతా బాగుందా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: నగర ద్వారం దగ్గరికి వచ్చినప్పుడు
  rationale: בוא అంటే రావడం లేదా ప్రవేశించడం; בַשָּׁעַר నగర ద్వార ప్రాంతాన్ని సూచించగలదు. తెలుగు సహజత్వం కోసం ‘నగర ద్వారం దగ్గరికి వచ్చినప్పుడు’ అని అనువదించాం.
- source_word: וַתֹּאמֶר
  choice: ఆమె ... అని అడిగింది
  rationale: స్త్రీలింగ ఏకవచన క్రియ సందర్భంలోని యెజెబెలును సూచిస్తుంది; ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అడిగింది’ సహజంగా ఉంది.
- source_word: הֲשָׁלוֹם
  choice: క్షేమమేనా?
  rationale: שָׁלוֹם ఇక్కడ శాంతి, క్షేమం లేదా పరిస్థితి బాగుండడాన్ని ప్రశ్నించే సంక్షిప్త ప్రయోగం. ‘క్షేమమేనా?’ దాని ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని నిలుపుతుంది.
- source_word: זִמְרִי
  choice: జిమ్రీ
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం; సందర్భంలో ఇది యెహూకు పెట్టిన నిజమైన పేరు కాక, పూర్వపు జిమ్రీతో పోల్చే అవహేళన.
- source_word: הֹרֵג אֲדֹנָיו
  choice: తన యజమానిని చంపిన
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘తన యజమాని హంతకుడు/చంపేవాడు.’ తెలుగులో నేరారోపణ స్పష్టంగా, సహజంగా వినిపించేందుకు సంబంధవాచక రూపాన్ని వాడాం.
theological_decisions:
- issue: ‘జిమ్రీ, తన యజమానిని చంపినవాడా’ అనే సంబోధన భావం
  choice: యెహూను పూర్వపు రాజహంతకుడు జిమ్రీతో పోల్చి ఎగతాళి చేసిన సంబోధనగా పాఠ్యంలో ఉంచి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
  alternative: ‘జిమ్రీ’ని వివరణ లేకుండా యెహూ పేరులా చదవడం.
  rationale: 1 రాజులు 16:9–20 నేపథ్యం ప్రకారం ఇది యజమానిని చంపి సింహాసనం స్వాధీనం చేసుకున్న జిమ్రీతో యెహూను పోల్చే వ్యంగ్య సంబోధన; ప్రధాన పాఠ్యంలో భావాన్ని అతిగా విప్పకుండా సూచనను నిలిపాం.
- issue: הֲשָׁלוֹם యొక్క భావపరిధి
  choice: ‘క్షేమమేనా?’
  alternative: ‘శాంతిగా వచ్చావా?’ లేదా ‘అంతా బాగుందా?’
  rationale: మూలంలోని సంక్షిప్తతతో పాటు ‘శాంతి’ మరియు ‘క్షేమం’ రెండింటికీ అవకాశం ఉంది. ‘క్షేమమేనా?’ తెలుగులో సహజంగా ఉండి ఆ వ్యంగ్య ప్రశ్నలోని ఉద్రిక్తతను పూర్తిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. మూలంలోని సంక్షిప్త వ్యంగ్య ప్రశ్నను, జిమ్రీ సూచనలోని నిందాత్మక బలాన్ని నిలుపుతూ అతివ్యాఖ్యానాన్ని పాదటిప్పణికి పరిమితం చేశాం.
