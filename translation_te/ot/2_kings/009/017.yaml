reference: 2 Kings 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: te
  text: యెజ్రెయేలులోని గోపురం మీద కావలివాడు నిలబడి ఉన్నాడు. యెహూ వస్తుండగా అతని గుంపును చూసి, “నాకు ఒక గుంపు కనిపిస్తోంది” అన్నాడు. అప్పుడు యెహోరాము, “ఒక గుర్రపు రౌతును తీసుకొని, వారిని కలుసుకోవడానికి పంపు. అతడు, ‘శాంతియేనా?[a]’ అని అడగాలి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత వాడుక భాషలో, “అంతా క్షేమమేనా?”
    reason: הֲשָׁלוֹם అనే సంక్షిప్త ప్రశ్న శాంతియుత ఉద్దేశాన్నీ, పరిస్థితి క్షేమంగా ఉందా అన్న విచారణనూ సూచించగలదు.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: కావలివాడు
  rationale: గోపురం మీద ఉండి దూరాన్ని గమనించే వ్యక్తిని సూచించే సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: עֹמֵד
  choice: నిలబడి ఉన్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న నేపథ్య స్థితిని నిలుపుతుంది.
- source_word: הַמִּגְדָּל
  choice: గోపురం
  rationale: మూలపదం సాధారణంగా ‘గోపురం’ అని అర్థం; సందర్భం వల్ల ‘కావలి గోపురం’ అని స్పష్టీకరించాల్సిన అవసరం లేదు.
- source_word: בְּיִזְרְעֶאל
  choice: యెజ్రెయేలులోని
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణతో ఇచ్చి, గోపురంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: שִׁפְעַת
  choice: గుంపు
  rationale: దూరం నుంచి కనిపించిన అనేకమంది సమూహాన్ని సూచిస్తుంది; ‘సైన్యం’ లేదా ‘దండు’ అని అనువదించడం మూలంలో లేని నిర్దిష్ట సైనిక భావాన్ని చేర్చవచ్చు.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בְּבֹאוֹ
  choice: యెహూ వస్తుండగా
  rationale: యెహూ సమీపిస్తున్న సమయంలో కావలివాడు గుంపును చూశాడనే కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: నాకు ఒక గుంపు కనిపిస్తోంది
  rationale: ముందు వచ్చిన ‘గుంపు’ అనే పదాన్ని పునరావృతం చేస్తూ, కావలివాడి ప్రత్యక్ష నివేదికను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: קַח רַכָּב
  choice: ఒక గుర్రపు రౌతును తీసుకొని
  rationale: ఏకవచనంలోని స్వారీ చేసే దూతను సూచిస్తుంది; ‘గుర్రపు రౌతు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: వారిని కలుసుకోవడానికి పంపు
  rationale: మసొరెటిక్ పాఠంలోని బహువచన ప్రత్యయాన్ని ‘వారిని’గా నిలుపుతూ, לִקְרָאתָם యొక్క సందర్భోచిత భావాన్ని అనవసరమైన శత్రుత్వ సూచన లేకుండా అందిస్తుంది.
- source_word: וְיֹאמַר
  choice: అతడు … అని అడగాలి
  rationale: ఆజ్ఞను అనుసరించే జస్సివ్ భావాన్ని సహజమైన పరోక్ష ఆజ్ఞగా వ్యక్తం చేస్తుంది; ప్రశ్నను పలకడం ఇక్కడ అడగడమే కావడంతో ‘అడగాలి’ సహజంగా ఉంది.
- source_word: הֲשָׁלוֹם
  choice: శాంతేనా?
  rationale: హీబ్రూలోని సంక్షిప్తమైన ‘శాంతి?’ అనే ప్రశ్నను, దాని శాంతియుత ఉద్దేశం/క్షేమం అనే ద్వంద్వ భావాన్ని పూర్తిగా పరిష్కరించకుండా, పాఠంలోని పునరావృత మూలపదంతో నిలుపుతుంది.
