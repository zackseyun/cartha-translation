  source_fidelity: 'మూల హీబ్రూ భావాన్ని ముసాయిదా విశ్వసనీయంగా అందిస్తుంది: కావలివాడు యెజ్రెయేలులోని గోపురంపై ఉండటం, యెహూ రాకతో కనిపించిన గుంపు, వారివద్దకు ఒక గుర్రపు రౌతును పంపమన్న యెహోరాము ఆజ్ఞ, అలాగే לִקְרָאתָם లోని బహువచనమైన ‘వారిని’ అన్నీ నిలిచాయి. הֲשָׁלוֹם లోని సంక్షిప్త, ఉద్దేశపూర్వకంగా విస్తృతమైన ‘peace/well-being’ భావాన్ని ప్రధాన పాఠం మరియు గమనిక కలిపి కాపాడుతున్నాయి.'
