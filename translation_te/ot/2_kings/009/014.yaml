  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: te
  text: అప్పుడు యెహోషాపాతు కుమారుడూ నిమ్షీ కుమారుడూ అయిన యేహూ, యోరాముకు వ్యతిరేకంగా కుట్ర పన్నాడు. యోరాము, అతనితోపాటు ఇశ్రాయేలంతా[b], అరాము[c] రాజైన హజాయేలు కారణంగా రామోతు-గిలాదులో కాపలా కాస్తూ ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రామోతు-గిలాదును కాపాడుతూ ఉన్నారు.’ హెబ్రీ క్రియ సైనిక సందర్భంలో కాపలా కాయడం, పర్యవేక్షించడం లేదా రక్షించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే ఇశ్రాయేలు రాజ్యపు బలగాలు కావచ్చు; మూలపాఠంలో అక్షరార్థంగా ‘ఇశ్రాయేలంతా’ అని ఉంది.
    reason: cultural_note
  - marker: c
    text: సంప్రదాయ అనువాదాల్లో ‘సిరియా’; హెబ్రీలో ‘అరాము.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: కుట్ర పన్నాడు
  rationale: హిత్పయేల్ రూపం ఇక్కడ రాజుకు వ్యతిరేకంగా తిరుగుబాటు కుట్ర చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుట్ర పన్నాడు’ సహజంగా ఉండి రాజకీయ విరోధ భావాన్ని నిలుపుతుంది.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: నిమ్షీ మనవడూ యెహోషాపాతు కుమారుడూ అయిన
  rationale: రెండు తరాల పితృవంశ సంబంధాన్ని తెలుగులో సహజమైన క్రమంలో స్పష్టంగా తెలియజేస్తుంది; యేహూ యెహోషాపాతు కుమారుడు, నిమ్షీ మనవడు అనే భావం నిలుస్తుంది.
- source_word: אֶל יוֹרָם
  choice: యోరాముకు వ్యతిరేకంగా
  rationale: קשר అనే కుట్రకు సంబంధించిన క్రియతో వచ్చిన אֶל ఇక్కడ కుట్ర లక్ష్యాన్ని సూచిస్తుంది. ‘వ్యతిరేకంగా’ ఆ శత్రుత్వ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: הָיָה שֹׁמֵר
  choice: కాపలా కాస్తున్నారు
  rationale: కతల్ రూపంతో కూడిన కృదంతం నేపథ్యంగా కొనసాగుతున్న గత చర్యను సూచిస్తుంది. యోరాముతో పాటు ఇశ్రాయేలంతా అనే సమన్వయ కర్తకు అనుగుణంగా తెలుగులో బహువచనం వాడబడింది; ‘కాపలా కాయడం’ సైనిక కాపుదల లేదా రక్షణ అనే భావపరిధిని నిలుపుతుంది.
- source_word: בְּרָמֹת גִּלְעָד
  choice: రామోతు-గిలాదులో
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ప్రతిలిపి చేసి, בְ అనే స్థానార్థాన్ని ‘లో’ ద్వారా తెలిపింది.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: యోరాము, అతనితోపాటు ఇశ్రాయేలంతా
  rationale: మూలంలోని ‘అతడూ ఇశ్రాయేలంతా’ అనే విస్తృత జాతీయ పదప్రయోగాన్ని నిలుపుతూ, తెలుగులో సహజమైన సమన్వయ నిర్మాణాన్ని ఉపయోగిస్తుంది. సందర్భంలో ఇది ఇశ్రాయేలు సైన్యాన్ని లేదా రాజ్య బలగాలను సూచించవచ్చు; ప్రధాన పాఠ్యంలో దాన్ని సంకుచితం చేయలేదు.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: హజాయేలు వల్ల ఏర్పడిన పరిస్థితి కాపలా చర్యకు కారణమని సూచిస్తుంది. ‘ఎదురుగా’ లేదా ‘భయంతో’ అని అనువదిస్తే మూలంలోని సాధ్యమైన భావాలలో ఒక్కదానికే పరిమితం కావచ్చు.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజైన
  rationale: చారిత్రకంగా తరువాతి కాలపు ‘సిరియా’ అనే పేరుకు బదులుగా హెబ్రీ భౌగోళిక-జాతి పేరైన אֲרָם ను ‘అరాము’గా నిలుపుతుంది.
