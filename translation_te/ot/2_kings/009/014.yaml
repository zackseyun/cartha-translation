translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. పేర్లు తెలుగు బైబిలు పఠనానికి అనుకూలంగా ప్రతిలిపి చేయబడ్డాయి. మూలంలోని సైనిక సందర్భం నిలుపబడింది; ‘ఇశ్రాయేలంతా’ అనే విస్తృత పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో ‘సైన్యం’గా సంకుచితం చేయకుండా పాదసూచికలో వివరించబడింది.
