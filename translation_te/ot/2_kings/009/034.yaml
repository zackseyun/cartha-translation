  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘దయచేసి’ ఆజ్ఞలోని נָא భావాన్ని చూపుతుంది; ‘ఒక రాజు కుమార్తె’ రాజవంశ స్థితిని తెలియజేస్తూనే మూలంలో లేని నిర్దిష్టతను చేర్చదు.
