base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: te
  text: తర్వాత అతడు లోపలికి వెళ్లి తిని తాగాడు. ఆపై అతడు, “దయచేసి ఈ శాపగ్రస్త స్త్రీ[a] సంగతి చూసి, ఆమెను పాతిపెట్టండి; ఎందుకంటే ఆమె ఒక రాజు కుమార్తె” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ శాపగ్రస్తురాలి సంగతి చూసి, ఆమెను పాతిపెట్టండి.”
    reason: ‘స్త్రీ’ అనే నామవాచకాన్ని స్పష్టత కోసం చేర్చకుండా, స్త్రీలింగ విశేషణ రూపాన్నే వ్యక్తిగా అనువదించే అవకాశం ఉంది.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: తర్వాత అతడు లోపలికి వెళ్లి
  rationale: ఈ కథన సందర్భంలో యెహూ భవనంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ‘లోపలికి వెళ్లి’ అనేది దిశాభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: తిని తాగాడు
  rationale: హీబ్రూలో ఈ రెండు క్రియలకు కర్మ పేర్కొనబడలేదు; అందువల్ల అదనంగా ‘ద్రాక్షారసం’ వంటి పదాన్ని చేర్చలేదు.
- source_word: פִּקְדוּ נָא
  choice: దయచేసి … సంగతి చూసి
  rationale: ఇక్కడ פקד ఒకరి విషయాన్ని పట్టించుకొని తగిన చర్య తీసుకోవాలని ఆదేశించే భావంలో ఉంది. נָא యొక్క మర్యాదపూర్వక అభ్యర్థనా ఛాయను ‘దయచేసి’ నిలుపుతుంది.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: ఈ శాపగ్రస్త స్త్రీ
  rationale: స్త్రీలింగ రూపం యెజెబెలును సూచిస్తుంది. ఆధునిక తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘స్త్రీ’ని చేర్చగా, ‘శాపగ్రస్త’ మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: וְקִבְרֻהָ
  choice: ఆమెను పాతిపెట్టండి
  rationale: స్త్రీలింగ ఏకవచన కర్మప్రత్యయంతో ఉన్న ప్రత్యక్ష ఆజ్ఞను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: ఎందుకంటే ఆమె ఒక రాజు కుమార్తె
  rationale: ఈ వాక్యం ఆమెను పాతిపెట్టడానికి కారణాన్ని తెలుపుతుంది. హీబ్రూలో నిర్దిష్ట రాజును పేర్కొననందున ‘ఒక రాజు కుమార్తె’ అని అనువదించబడింది.
