source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: te
  text: ఆ సమయంలో బబులోను రాజైన బలదాను కుమారుడు బెరోదకు-బలదాను[a], హిజ్కియా అనారోగ్యానికి గురయ్యాడని విని, అతనికి ఉత్తరాలు, ఒక కానుక పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘బెరోదకు-బలదాను’ అని ఉంది; యెషయా 39:1లో, అలాగే కొన్ని ప్రాచీన పాఠ సంప్రదాయాల్లో, ఈ పేరు ‘మెరోదకు-బలదాను’ అనే రూపంలో కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కథనంలోని కాలసంబంధ సూచనను సహజమైన ఆధునిక తెలుగులో యథాతథంగా తెలియజేస్తుంది.
- source_word: שָׁלַח
  choice: పంపించాడు
  rationale: రాజు తన దౌత్య ప్రతినిధుల ద్వారా పంపించిన భావానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: బెరోదకు-బలదాను
  rationale: WLCలోని హీబ్రూ వ్యంజన పాఠాన్ని ప్రాథమికంగా అనుసరించిన లిప్యంతరీకరణ; యెషయా 39:1లోని భిన్న రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֶּן בַּלְאֲדָן
  choice: బలదాను కుమారుడు
  rationale: పితృనామ సంబంధాన్ని తెలుగులో సహజమైన క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: రాజపదవినీ రాజ్యాన్నీ నేరుగా తెలియజేసే అనువాదం.
- source_word: סְפָרִים
  choice: ఉత్తరాలు
  rationale: ఈ దౌత్య సందర్భంలో సాధారణ రచనలు లేదా గ్రంథాలు కాక, పంపిన లిఖిత సందేశాలు అనే భావం సముచితం.
- source_word: וּמִנְחָה
  choice: ఒక కానుక
  rationale: מִנְחָהకు కానుక, అర్పణ, కప్పం వంటి అర్థాలు ఉండగలవు; విదేశీ రాజుకు పంపిన ఈ సందర్భంలో ‘కానుక’ తక్కువ వ్యాఖ్యానభారం గల సహజ ఎంపిక.
- source_word: כִּי שָׁמַע
  choice: విని
  rationale: మొదటి כִּי తెలిపే కారణ సంబంధాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: హిజ్కియా అనారోగ్యానికి గురయ్యాడని
  rationale: రెండవ כִּי వినబడిన విషయాన్ని పరిచయం చేస్తుంది; חָלָהను ‘అనారోగ్యానికి గురయ్యాడు’ అని అనువదించడం అనారోగ్యం సంభవించిన భావాన్ని నిలుపుతుంది, అయితే కోలుకున్నాడని ఈ వాక్యంలోనే అదనంగా చెప్పదు.
