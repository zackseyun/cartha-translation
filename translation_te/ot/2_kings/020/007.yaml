id: 2KI.20.7
reference: 2 Kings 20:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: te
  text: యెషయా, “అంజూరపు పండ్ల ముద్దను[a] తీసుకోండి” అన్నాడు. వారు దాన్ని తీసుకొని కురుపు[b] మీద ఉంచారు; అప్పుడు అతడు కోలుకున్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అంజూరపు పండ్ల అట్టు”; అంటే ఒత్తి చేసిన అంజూరపు పండ్ల ముద్ద.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వాపుతో కూడిన పుండు” లేదా “వ్రణం.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “అతడు జీవించాడు”; ఈ సందర్భంలో అతడు కోలుకున్నాడని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: יְשַׁעְיָהוּ
  choice: యెషయా
  rationale: ప్రవక్త పేరుకు తెలుగులో ప్రామాణికంగా వాడే లిప్యంతరీకరణ.
- source_word: קְחוּ
  choice: తీసుకోండి
  rationale: לקח ధాతువు బహువచన ఆజ్ఞారూపం. ‘తీసుకోండి’ మూలంలోని ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘తీసుకురండి’ అనేది మూలంలో స్పష్టంగా లేని దిశాభావాన్ని చేర్చవచ్చు.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: అంజూరపు పండ్ల ముద్ద
  rationale: דְּבֶלֶת నొక్కి లేదా ఒత్తి చేసిన పండ్ల ముద్దను సూచిస్తుంది; תְּאֵנִים అది అంజూరపు పండ్లదని నిర్దేశిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיִּקְחוּ
  choice: వారు దాన్ని తీసుకొని
  rationale: క్రియ బహువచనంలో ఉంది; ముందు చెప్పిన అంజూరపు పండ్ల ముద్దను సూచించే కర్మను తెలుగులో సహజంగా ‘దాన్ని’ అని వ్యక్తం చేశాం.
- source_word: וַיָּשִׂימוּ
  choice: ఉంచారు
  rationale: שׂים సాధారణంగా ఉంచడం లేదా పెట్టడం అని అర్థం. గాయం మీద ఔషధ పదార్థాన్ని పెట్టే సందర్భంలో ‘ఉంచారు’ సహజంగా ఉంటుంది.
- source_word: עַל
  choice: మీద
  rationale: స్థాన సంబంధాన్ని తెలిపే సాధారణ తెలుగు సమానార్థకం.
- source_word: הַשְּׁחִין
  choice: కురుపు
  rationale: שְׁחִין వాపుతో కూడిన చర్మపు పుండు లేదా boil‌ను సూచిస్తుంది. ‘కురుపు’ సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు పదం.
- source_word: וַיֶּחִי
  choice: అప్పుడు అతడు కోలుకున్నాడు
  rationale: חיה అక్షరార్థంగా ‘జీవించాడు’ అయినా, ఈ స్వస్థత సందర్భంలో ఆరోగ్యం తిరిగి పొందడాన్ని సూచిస్తుంది. ‘కోలుకున్నాడు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ కథన ఫలితసంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: וַיֶּחִי తెలిపే స్వస్థత ఫలితం
  choice: అతడు కోలుకున్నాడు
  alternative: అతడు జీవించాడు / అతడు తిరిగి బలపడ్డాడు
  rationale: חיה అనే క్రియకు ‘జీవించాడు’ అనే అక్షరార్థం ఉన్నప్పటికీ, హిజ్కియా వ్యాధి మరియు కురుపుపై అంజూరపు ముద్ద ఉంచిన ఈ సందర్భంలో అది శారీరక స్వస్థతను సూచిస్తుంది. ‘కోలుకున్నాడు’ పునరుత్థానం వంటి అదనపు భావాన్ని చేర్చకుండా సందర్భంలోని భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. బహువచన ఆజ్ఞకు ‘తీసుకోండి’ వాడి మూలంలోని సంఖ్యను నిలిపాం. ప్రతి పాదసూచిక గుర్తును సంబంధిత పదబంధం వెంట ఉంచాం.
