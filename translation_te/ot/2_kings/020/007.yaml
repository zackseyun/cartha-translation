  terminology: “యెషయా” is a standard Telugu biblical form. “అంజూరపు పండ్ల ముద్ద” communicates a compressed fig mass, with the lexical nuance responsibly supplied in note a. “కురుపు” is an acceptable concise rendering of שְׁחִין; its alternatives are accurately noted. Footnote markers are correctly attached and each note corresponds to its marked expression.
