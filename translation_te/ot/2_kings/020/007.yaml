  source_fidelity: 'Hebrew sequence and referents are accurately represented: Isaiah gives a plural command to take a pressed mass of figs; unnamed plural agents take it and place it on the boil; the man recovers. The contextual rendering of וַיֶּחִי as “అతడు కోలుకున్నాడు” is sound, while the footnote preserves the literal wording.'
