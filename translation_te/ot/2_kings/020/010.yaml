  text: וַ/יֹּ֨אמֶר֙ יְחִזְקִיָּ֔הוּ נָקֵ֣ל לַ/צֵּ֔ל לִ/נְט֖וֹת עֶ֣שֶׂר מַעֲל֑וֹת לֹ֣א כִ֔י יָשׁ֥וּב הַ/צֵּ֛ל אֲחֹרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: te
  text: 'హిజ్కియా ఇలా అన్నాడు: “నీడ పది మెట్లు[a] ముందుకు కదలడం సులభమే. అలా కాదు; నీడ పది మెట్లు వెనక్కి వెళ్లాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పది అంచెలు.” హీబ్రూ పదానికి “మెట్లు” లేదా “ఎక్కింపులు” అని అర్థం; ఇది ఆహాజు నీడ-సాధనంలోని మెట్లు లేదా గుర్తులను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: సులభమే
  rationale: ఈ విశేషణం తేలికైనది లేదా సులభమైనది అనే భావాన్ని ఇస్తుంది. సందర్భంలో హిజ్కియా సహజంగా జరిగే కదలికను సులభమైన సూచనగా అంచనా వేస్తున్నాడు.
- source_word: הַצֵּל / לַצֵּל
  choice: నీడ
  rationale: צֵל అనే పదానికి సాధారణమైన, సహజమైన తెలుగు సమానం. నిర్దిష్టత సందర్భం నుంచే స్పష్టమవుతుంది.
- source_word: לִנְטוֹת
  choice: ముందుకు సాగడం
  rationale: נטה విస్తరించడం, వాలడం లేదా తిరగడం అనే పరిధి కలిగిన పదం. నీడ సహజ దిశలో కదలడాన్ని, తరువాతి ‘వెనక్కి వెళ్లాలి’ అనే వ్యతిరేకతను స్పష్టంగా చూపేందుకు ఈ రూపం ఎంచుకున్నాం.
- source_word: מַעֲלוֹת
  choice: మెట్లు
  rationale: ఈ నామవాచకం మెట్లు లేదా ఎక్కే దశలను సూచిస్తుంది. ‘డిగ్రీలు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: לֹא כִּי
  choice: వద్దు;
  rationale: ముందు చెప్పిన అవకాశాన్ని తిరస్కరించి, దానికి బదులుగా కోరిన ప్రత్యామ్నాయాన్ని పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָשׁוּב
  choice: వెళ్లాలి
  rationale: שׁוב అంటే తిరగడం లేదా తిరిగి వెళ్లడం. తరువాతి אֲחֹרַנִּיתతో కలిపి ‘వెనక్కి వెళ్లాలి’ అని కోరిక లేదా ఆదేశ భావంలో సహజంగా అనువదించాం.
- source_word: אֲחֹרַנִּית
  choice: వెనక్కి
  rationale: వెనుక దిశగా కదలడాన్ని స్పష్టంగా తెలియజేసే ఆధునిక తెలుగు రూపం.
