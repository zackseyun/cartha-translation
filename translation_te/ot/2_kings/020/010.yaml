translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త వ్యతిరేక నిర్మాణం మరియు నీడ ముందుకు/వెనక్కి కదిలే దృశ్యాన్ని నిలిపాం.
