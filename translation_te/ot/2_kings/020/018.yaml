revisions:
- from: నీ నుంచి పుట్టి, నీకు జన్మించబోయే కుమారుల్లో కొందరిని తీసుకుపోతారు. వారు బబులోను రాజు రాజభవనంలో నపుంసకులవుతారు.[a]
  to: నీ నుండి పుట్టబోయే, నీవు తండ్రివయ్యే కుమారుల్లో కొందరిని తీసుకుపోతారు. వారు బబులోను రాజు యొక్క రాజభవనంలో నపుంసకులవుతారు.[a]
  rationale: 'The revision retains the two Hebrew descent/begetting expressions while making the second explicitly paternal: ''నీ నుండి పుట్టబోయే, నీవు తండ్రివయ్యే.'' It also makes the king–palace relationship explicit. No doctrinal interpretation has been added, and the ambiguity of סָרִיסִים remains preserved in the footnote.'
  reviewer_model: gpt-5.6-terra
