id: 2KI.20.18
reference: 2 Kings 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: te
  text: నీ నుండి పుట్టబోయే, నీవు తండ్రివయ్యే కుమారుల్లో కొందరిని తీసుకుపోతారు. వారు బబులోను రాజు యొక్క రాజభవనంలో నపుంసకులవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజాస్థాన అధికారులు” లేదా “రాజభవన అధికారులు.” హీబ్రూ పదం అక్షరార్థంగా నపుంసకులను సూచించవచ్చు; కొన్ని సందర్భాల్లో రాజోద్యోగులను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: నీ కుమారుల్లో కొందరిని
  rationale: ‘నీ కుమారుల నుండి’ అనే అక్షరార్థ నిర్మాణంలో מן భాగవాచకంగా ఉంది; అందువల్ల సహజమైన తెలుగులో ‘నీ కుమారుల్లో కొందరిని’ అని అనువదించబడింది. בנים అనే నిర్దిష్ట పదాన్ని గౌరవిస్తూ ‘సంతానం’కు బదులు ‘కుమారులు’ నిలుపబడింది.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ אֲשֶׁר תּוֹלִיד
  choice: నీ నుంచి పుట్టి, నీకు జన్మించబోయే
  rationale: మొదటి పదబంధం హిజ్కియా నుంచి శారీరక వంశపారంపర్యంగా రావడాన్ని, రెండవది అతని పితృత్వాన్ని సూచిస్తుంది. తెలుగులో అసహజమైన ‘నీవు పుట్టించబోయే’ అనే రూపాన్ని నివారిస్తూ రెండు భావాలనూ సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: יִקַּח
  choice: తీసుకుపోతారు
  rationale: హీబ్రూ క్రియ రూపరీత్యా ఏకవచన కర్తరి ప్రయోగమైనా, సందర్భంలో కర్త అనిర్దిష్టం. తెలుగులో అనిర్దిష్ట బహువచన క్రియ సహజంగా ఉండి, మూలంలో లేని నిర్దిష్ట కర్తను చేర్చకుండా అపహరణ భావాన్ని తెలియజేస్తుంది.
- source_word: וְהָיוּ
  choice: అవుతారు
  rationale: היה ఇక్కడ కొత్త స్థితిలోకి ప్రవేశించడాన్ని సూచించగలదు; బబులోను రాజసేవలో వారి మారిన స్థితిని ‘అవుతారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סָרִיסִים
  choice: నపుంసకులు
  rationale: ఈ పదపు ప్రాథమిక అర్థం ‘నపుంసకులు.’ బందీలైన రాజకుమారులు విదేశీ రాజభవనంలో ప్రవేశించే సందర్భంలో అక్షరార్థం సాధ్యమైనది. ‘రాజాస్థాన అధికారులు’ అనే విస్తృత అర్థం పాదసూచికలో భద్రపరచబడింది.
- source_word: בְּהֵיכַל
  choice: రాజభవనంలో
  rationale: היכל దేవాలయాన్నిగానీ రాజభవన సముదాయాన్నిగానీ సూచించవచ్చు; ‘బబులోను రాజు’ అనే సంబంధం ఇక్కడ రాజభవనాన్నే స్పష్టంగా సూచిస్తుంది.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: హీబ్రూ సమాస నిర్మాణానికి స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: రాజాస్థాన సందర్భంలో סָרִיסִים అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నపుంసకులు’
  alternative: ‘రాజాస్థాన అధికారులు’ లేదా ‘రాజభవన అధికారులు’
  rationale: ఈ హీబ్రూ పదం అక్షరార్థంగా నపుంసకులను, కొన్ని సందర్భాల్లో విస్తృతార్థంగా ఉన్నత రాజోద్యోగులను సూచించగలదు. ఈ తీర్పు ప్రవచనపు తీవ్రతకు అక్షరార్థం సరిపోతుంది; అయితే పదంలోని నిజమైన సందిగ్ధతను తొలగించకుండా ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. వంశపారంపర్యాన్ని తెలిపే రెండు హీబ్రూ సంబంధ వాక్యాలను పూర్తిగా తొలగించకుండా పఠనయోగ్యంగా కలిపాం. ‘నపుంసకులు’ అనే స్పష్టమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రాజోద్యోగుల అర్థాన్ని పాదసూచికలో సంరక్షించాం.
