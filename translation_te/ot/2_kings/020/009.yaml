revisions:
- from: 'అప్పుడు యెషయా ఇలా అన్నాడు: “యెహోవా తాను చెప్పినదాన్ని నెరవేరుస్తాడనడానికి ఆయన నీకిచ్చే సూచన ఇదే: నీడ పది మెట్లు ముందుకు వెళ్లాలా, లేక పది మెట్లు వెనక్కి తిరగాలా?”[a]'
  to: 'అప్పుడు యెషయా ఇలా అన్నాడు: “యాహ్వే తాను చెప్పినదాన్ని నెరవేరుస్తాడనడానికి, యాహ్వే నుండి నీకు కలిగే సూచన ఇదే: నీడ పది మెట్లు[a] ముందుకు వెళ్లాలా, లేక పది మెట్లు వెనక్కి తిరగాలా?”'
  rationale: సవరింపు దైవనామాన్ని ప్రాజెక్టు నిర్ణయానికి అనుగుణంగా “యాహ్వే”గా చేసింది; మూలంలో రెండుసార్లు వచ్చే నామాన్ని రెండుసార్లూ నిలిపింది; “సూచన” యాహ్వే నుండి హిజ్కియాకు సంబంధించినదని వాక్యక్రమంలో స్పష్టంచేసింది; అలాగే మַעֲלוֹతకు సంబంధించిన పాదసూచికను నేరుగా “మెట్లు” వద్ద ఉంచింది. నీడ కదలికలోని రెండు ఎంపికలు, ప్రశ్నార్థక స్వరం, మరియు పరికరం స్వరూపంపై ఉన్న అనిశ్చితి మార్చబడలేదు.
