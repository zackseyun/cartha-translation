source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְשַׁעְיָ֗הוּ זֶה לְּ/ךָ֤ הָ/אוֹת֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ֚י יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֖ר אֲשֶׁ֣ר דִּבֵּ֑ר הָלַ֤ךְ הַ/צֵּל֙ עֶ֣שֶׂר מַֽעֲל֔וֹת אִם יָשׁ֖וּב עֶ֥שֶׂר מַעֲלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: te
  text: 'అప్పుడు యెషయా ఇలా అన్నాడు: “యాహ్వే తాను చెప్పినదాన్ని నెరవేరుస్తాడనడానికి, యాహ్వే నుండి నీకు కలిగే సూచన ఇదే: నీడ పది మెట్లు[a] ముందుకు వెళ్లాలా, లేక పది మెట్లు వెనక్కి తిరగాలా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెట్లు” అని అనువదించిన హెబ్రీ పదానికి “ఎక్కే మెట్లు/దశలు” లేదా సందర్భానుసారం “డిగ్రీలు” అనే అర్థాలు కూడా ఉండవచ్చు. నీడ కదలిక సందర్భంలో ఇది ఆహాజుతో సంబంధమున్న ఏర్పాటులోని మెట్లను సూచిస్తుందని సంప్రదాయంగా భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: సూచన
  rationale: אוֹת ఇక్కడ యెహోవా తన మాటను నెరవేరుస్తాడని నిర్ధారించే అద్భుత సూచనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘సూచన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מֵאֵת יְהוָה
  choice: ఆయన నీకిచ్చే
  rationale: מֵאֵת మూలం లేదా దాతను సూచిస్తుంది. ముందున్న ‘యెహోవా’ను తెలుగులో సహజంగా అనుసంధానిస్తూ, సూచన ఆయనవద్దనుండి వస్తుందని ఈ రూపం తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దేవుని ప్రత్యేక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: …నడానికి
  rationale: ఇక్కడ כִּי సూచన నిర్ధారించే విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘…నెరవేరుస్తాడనడానికి’ అనే నిర్మాణం ఆ భావసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲשֶׂה יְהוָה אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: యెహోవా తాను చెప్పినదాన్ని నెరవేరుస్తాడు
  rationale: దేవుడు పలికిన విషయాన్ని కార్యరూపంలో నెరవేర్చడం ఇక్కడ భావం. ‘చెప్పినదాన్ని నెరవేర్చు’ అనేది మూలార్థాన్ని కాపాడే సహజ తెలుగు ప్రయోగం.
- source_word: הָלַךְ הַצֵּל
  choice: నీడ … ముందుకు వెళ్లాలా
  rationale: పూర్తిక్రియా రూపం ప్రశ్నలో ప్రతిపాదిత సూచనలోని మొదటి ప్రత్యామ్నాయంగా పనిచేస్తోంది. ‘ముందుకు వెళ్లాలా’ అనేది తరువాతి ‘వెనక్కి తిరగాలా’తో ఉన్న దిశా వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מַעֲלוֹת
  choice: మెట్లు
  rationale: מַעֲלוֹת యొక్క ప్రాథమిక అర్థం ఎక్కే మెట్లు లేదా మెట్ల దశలు. సందర్భంలోని పరికరం గురించి అతిగా నిర్ణయించకుండా మూలానికి సమీపంగా ‘మెట్లు’ అని అనువదించాం.
- source_word: אִם
  choice: లేక
  rationale: రెండు ప్రత్యామ్నాయాలను కలిపే విభాజక ప్రశ్నలో אִםను సహజ తెలుగులో ‘లేక’గా ఇచ్చాం.
- source_word: יָשׁוּב
  choice: వెనక్కి తిరగాలా
  rationale: שׁוּב తిరిగి రావడం లేదా వెనక్కి మళ్లడాన్ని సూచిస్తుంది. నీడ దిశను మార్చే చిత్రాన్ని ‘వెనక్కి తిరగడం’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని నామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచాం. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: సూచన యొక్క స్వరూపం
  choice: నీడ కదలికకు సంబంధించిన రెండు ప్రత్యామ్నాయాలను ప్రశ్నగానే ఉంచడం
  alternative: ఒక ప్రత్యామ్నాయాన్ని యెషయా నిర్ణయించినట్లు వ్యాఖ్యానించడం
  rationale: హెబ్రీ పాఠం నీడ ముందుకు వెళ్లడమా లేదా వెనక్కి తిరగడమా అనే ఎంపికను ప్రతిపాదిస్తుంది. ఏ ఎంపిక విశేషంగా అద్భుతమో ఈ వాక్యమే నిర్ణయించదు; అందువల్ల ఆ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ప్రశ్నలోని రెండు ప్రత్యామ్నాయాలను, నీడ దిశ మార్పును, మరియు מַעֲלוֹת పదంలోని సందర్భసంబంధ అనిశ్చితిని కాపాడాం.
