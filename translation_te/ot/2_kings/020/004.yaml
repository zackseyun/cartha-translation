  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: te
  text: 'ఇలా జరిగింది: యెషయా మధ్య ప్రాంగణం[a] నుంచి బయటికి వెళ్లకముందే, యాహ్వే వాక్యం అతనికి ఇలా వచ్చింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః: ‘మధ్య నగరం.’ ఇక్కడ ఈ పదబంధాన్ని సాంప్రదాయంగా రాజభవన ప్రాంతం లేదా ప్రాంగణం అని అర్థం చేసుకున్నారు; అందువల్ల ‘మధ్య ప్రాంగణం’ అని అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: కథనంలో కొత్త పరిణామాన్ని పరిచయం చేసే హీబ్రూ వాక్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְשַׁעְיָהוּ
  choice: యెషయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לֹא יָצָא
  choice: బయటికి వెళ్లకముందే
  rationale: తదుపరి సంఘటన యెషయా అక్కడి నుంచి పూర్తిగా బయటికి వెళ్లకముందే జరిగిందనే కాలసంబంధ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הָעִיר הַתִּיכֹנָה
  choice: మధ్య ప్రాంగణం
  rationale: పదశః ‘మధ్య నగరం’ అయినప్పటికీ, రాజభవన సందర్భంలో ఇది ప్రాకారం లేదా ప్రాంగణ ప్రాంతాన్ని సూచిస్తుందని సాధారణంగా అర్థం చేసుకుంటారు. ‘మధ్య ప్రాంగణం’ సందర్భానికి తగిన సహజ అనువాదం; పదశః రూపాన్ని పాదసూచికలో ఉంచి మూలంలోని అనిశ్చితిని కాపాడాం.
- source_word: וּדְבַר יְהוָה
  choice: యెహోవా వాక్యం
  rationale: ప్రవక్తకు దేవుని సందేశం అందడాన్ని సూచించే స్థిరమైన ప్రవచన సూత్రానికి సరళమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణ ప్రకారం ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: הָיָה אֵלָיו
  choice: అతనికి వచ్చింది
  rationale: పదశః ‘అతనికి కలిగింది’ అనే నిర్మాణాన్ని, దైవవాక్యం ప్రవక్తకు అందిందనే భావంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష పలుకును పరిచయం చేస్తుంది; వాక్యాంతంలోని ద్విబిందువు ఈ సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం. ‘యాహ్వే’ అనేది సాధ్యమైన మరొక లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. ‘ఇలా జరిగింది’ మూలంలోని కథన మార్పును నిలుపుతుంది; ‘బయటికి వెళ్లకముందే’ సంఘటనల కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
