source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַֽׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר הֲ/ל֛וֹא אִם שָׁל֥וֹם וֶ/אֱמֶ֖ת יִהְיֶ֥ה בְ/יָמָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: te
  text: 'అప్పుడు హిజ్కియా యెషయాతో, “నీవు పలికిన యెహోవా వాక్యం మంచిది” అన్నాడు. అతడు ఇలా అన్నాడు: “నా రోజుల్లో శాంతి, స్థిరత్వం[a] ఉంటాయి కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాంతి, సత్యం.’ ఇక్కడి హీబ్రూ పదం אֱמֶתకు ‘సత్యం,’ ‘విశ్వసనీయత,’ లేదా ఈ సందర్భంలో ‘నమ్మదగిన స్థిరత్వం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: మంచిది
  rationale: ప్రకటించబడిన యెహోవా వాక్యాన్ని ‘మంచిది’ అని నేరుగా అంచనా వేస్తుంది; హిజ్కియా ఉద్దేశాన్ని అనవసరంగా అనుకూలంగా చూపదు.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్యం
  rationale: ప్రవచన సందర్భంలోని דָּבָר‌కు ‘వాక్యం’ సహజమైన ప్రమాణ పదం; దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించాం.
- source_word: דִּבַּרְתָּ
  choice: నీవు పలికిన
  rationale: యెషయాను నేరుగా ఉద్దేశించిన సంపూర్ణ క్రియను సహజమైన తెలుగు విశేషణ క్రియారూపంలో వ్యక్తపరుస్తుంది.
- source_word: הֲלוֹא אִם
  choice: ఉంటాయి కదా?
  rationale: హీబ్రూ ప్రయోగం సంక్షిప్తంగానూ వాక్యనిర్మాణపరంగా అపూర్ణంగానూ ఉంది. ‘కదా?’ దాని అలంకారప్రశ్న బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: సామాజిక ప్రశాంతత, క్షేమం రెండింటినీ సూచించగల విస్తృతమైన సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: אֱמֶת
  choice: స్థిరత్వం
  rationale: ఈ రాజ్య-జాతీయ సందర్భంలో నమ్మదగిన, నిలకడైన పరిస్థితి అనే భావాన్ని తెలియజేస్తుంది; ‘సత్యం’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְיָמָי
  choice: నా రోజుల్లో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి దగ్గరగా ఉండి, హిజ్కియా తన కాలంపైనే దృష్టి పెట్టిన ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: హిజ్కియా చివరి మాట వాక్యనిర్మాణపరంగా సంక్షిప్తంగా ఉంది; అది అతడు బహిరంగంగా పలికిన మాటగానో, అతని అంతరంగ ఆలోచనను వివరించే కథనంగానో అనువదించవచ్చు.
  choice: 'హీబ్రూలో రెండోసారి ఉన్న וַיֹּאמֶר (‘అతడు అన్నాడు’)ను అనుసరించి, రెండో భాగాన్ని కూడా ప్రత్యక్ష వాక్యంగా ఇచ్చాం: ‘నా రోజుల్లో శాంతి, స్థిరత్వం ఉంటాయి కదా?’'
  alternative: ‘ఎందుకంటే, “నా రోజుల్లో శాంతి, స్థిరత్వం ఉంటాయి కదా?” అని అతడు అనుకున్నాడు.’
  rationale: ప్రత్యక్ష వాక్య రూపం మూలంలోని స్పష్టమైన ‘అన్నాడు’ అనే క్రియను కాపాడుతుంది. అలంకారప్రశ్న హిజ్కియా స్పందనలోని స్వప్రయోజన భావాన్నీ, దాని నైతిక అసౌకర్యాన్నీ వివరణతో తేల్చివేయకుండా పాఠకుడి ముందుంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘నా రోజుల్లో’ అనే మూలానికి దగ్గరైన పదబంధం హిజ్కియా స్వకాలకేంద్రిత దృష్టిని నిలుపుతుంది; ‘మళ్లీ అతడు’ రెండో וַיֹּאמֶר‌ను తెలుగులో స్పష్టంగా చూపుతుంది.
