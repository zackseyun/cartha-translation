  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: te
  text: హిజ్కియా వారి మాట విని[a], తన విలువైన వస్తువుల భాండాగారమంతటినీ[b]—వెండిని, బంగారాన్ని, సుగంధ ద్రవ్యాలను, శ్రేష్ఠమైన నూనెను, తన ఆయుధాగారాన్ని[c], తన గిడ్డంగుల్లో ఉన్న సమస్తాన్నీ—వారికి చూపించాడు. హిజ్కియా తన ఇంట్లోగానీ, తన అధీన ప్రాంతమంతటిలోగానీ[d] వారికి చూపించనిది ఏదీ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి చెవియొగ్గాడు,” లేదా “వారిని అనుకూలంగా స్వీకరించాడు.” హీబ్రూ ప్రయోగం వారికి శ్రద్ధగా స్పందించడం లేదా అనుకూలంగా స్వీకరించడం అనే భావాన్నీ ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తన విలువైన వస్తువుల నిల్వగది.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “తన సామగ్రి భవనం”; మరింత అక్షరార్థంగా, “తన ఉపకరణాల ఇల్లు.”
    reason: lexical_alternative
  - marker: d
    text: లేదా “తన అధికార పరిధి అంతటిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: వారి మాటను అనుకూలంగా విని
  rationale: שׁמע על అనే ప్రయోగం కేవలం శబ్దం వినడమే కాక, వారికి అనుకూలంగా చెవియొగ్గడం లేదా వారిని ఆదరంగా స్వీకరించడం అనే భావాన్ని ఇవ్వగలదు. సందర్భానికి తగిన ఆ విస్తృత భావాన్ని ఈ అనువాదం తెలియజేస్తుంది.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: వారికి చూపించాడు
  rationale: ראה హిఫీల్ రూపానికి సహజమైన అర్థం ‘చూపించడం’; వచనంలోని రెండు సందర్భాల్లోనూ ఒకే భావాన్ని నిలుపుతుంది.
- source_word: בֵּית נְכֹתֹה
  choice: తన విలువైన వస్తువుల భాండాగారం
  rationale: ఈ పదబంధం విలువైన వస్తువులు భద్రపరిచే స్థలాన్ని సూచిస్తుంది. ‘భాండాగారం’ సహజమైన ఆధునిక తెలుగు పదం; ప్రత్యయం సూచించే స్వామ్యాన్ని ‘తన’ తెలియజేస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: ఇక్కడ ఆధునిక అర్థంలోని డబ్బు కంటే నిల్వచేసిన విలువైన లోహమే ఉద్దేశం.
- source_word: הַזָּהָב
  choice: బంగారం
  rationale: రాజభాండాగారంలో నిల్వచేసిన బంగారాన్ని నేరుగా సూచిస్తుంది.
- source_word: הַבְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: విలువైన పరిమళభరిత పదార్థాలను సూచించే విస్తృతమైన, సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: שֶׁמֶן הַטּוֹב
  choice: శ్రేష్ఠమైన నూనె
  rationale: అక్షరార్థంగా ‘మంచి నూనె’; దాని నాణ్యత లేదా విలువను అతిగా నిర్దిష్టం చేయకుండా ‘శ్రేష్ఠమైన’ తెలియజేస్తుంది.
- source_word: בֵּית כֵּלָיו
  choice: తన ఆయుధాగారం
  rationale: రాజసంబంధమైన ఈ జాబితాలో כֵּלִים ఆయుధాలు లేదా సైనిక సామగ్రిని సూచించవచ్చు. ‘ఆయుధాగారం’ సంక్షిప్తంగా, సహజంగా ఉంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: తన గిడ్డంగుల్లో ఉన్న సమస్తం
  rationale: אֹצָר భాండాగారం లేదా గిడ్డంగి అని అర్థమవుతుంది. ముందు వచ్చిన భాండాగారంతో అనవసర పునరుక్తి లేకుండా నిల్వచేసిన సమస్తాన్ని ఇది సూచిస్తుంది.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: వారికి చూపించనిది ఏదీ లేదు
  rationale: హీబ్రూ ద్వినిషేధ నిర్మాణంలోని సమగ్ర ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּבֵיתוֹ
  choice: తన ఇంట్లో
  rationale: మూలంలోని ‘ఇల్లు’ అనే పదాన్ని నిలుపుతుంది; రాజసందర్భంలో ‘రాజభవనం’ కూడా సాధ్యమే అయినా అది మరింత నిర్దిష్టమైన అర్థం.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: తన అధీన ప్రాంతమంతటిలో
  rationale: מֶמְשָׁלָה పాలన, ఆధిపత్యం లేదా అధీన ప్రాంతాన్ని సూచిస్తుంది. కేవలం రాజకీయ రాజ్యానికే పరిమితం చేయకుండా అతని పాలన కింద ఉన్న పరిధిని తెలియజేస్తుంది.
