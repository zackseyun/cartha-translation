reference: 2 Kings 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: te
  text: ప్రవక్త యెషయా యాహ్వేకు మొరపెట్టాడు; అప్పుడు ఆయన ఆహాజు మెట్లపై దిగిన నీడను పది మెట్లు వెనక్కి మళ్లించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: మొరపెట్టాడు
  rationale: אֶל־יְהוָהతో కూడిన קרא దేవునికి సహాయం కోసం బిగ్గరగా పిలవడాన్ని సూచిస్తుంది. ‘మొరపెట్టాడు’ ప్రార్థన సందర్భాన్ని సహజంగా తెలియజేస్తూనే క్రియలోని తీవ్రతను నిలుపుతుంది.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: ప్రవక్తయైన యెషయా
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, הַנָּבִיא అనే బిరుదును సహజమైన తెలుగు వాక్యనిర్మాణంలో అనువదించింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరించింది.
- source_word: וַיָּשֶׁב
  choice: వెనక్కి మళ్లించాడు
  rationale: שוב హిఫీల్ రూపంలోని కారణార్థాన్ని, అర్థాత్ నీడను తిరిగి వెళ్లేలా చేసిన భావాన్ని, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַצֵּל
  choice: నీడను
  rationale: కారణార్థక క్రియకు ప్రత్యక్ష కర్మ; సూచక కార్యంలో కదిలింది నీడే.
- source_word: בְּמַעֲלוֹת אָחָז
  choice: ఆహాజు మెట్లపై
  rationale: מַעֲלוֹת యొక్క ప్రాథమిక అర్థమైన ‘మెట్లు/ఎక్కే దారులు’ను నిలుపుతూ, అది తప్పనిసరిగా సూర్యఘడియేనని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת
  choice: పది మెట్లు వెనక్కి
  rationale: వెనుదిరిగిన దిశను, దాని పరిమాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘మెట్లు’ అనే రూపం హీబ్రూ పదానికి సన్నిహితంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు లిపిలో దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను చూపుతుంది.
- issue: మాట్లాడకుండా ఉన్న וַיָּשֶׁב క్రియ కర్త
  choice: ఆయన
  alternative: యాహ్వే
  rationale: హీబ్రూ క్రియలో కర్త పేరు మళ్లీ స్పష్టంగా లేదు; సమీప సందర్భం యాహ్వేను సూచించినప్పటికీ, ‘ఆయన’ అని ఉంచడం మూలంలోని సూచనాత్మక నిర్మాణాన్ని కాపాడుతుంది.
- issue: ఆహాజు מַעֲלוֹת స్వరూపం
  choice: ఆహాజు మెట్లు
  alternative: ఆహాజు మెట్లదారి; ఆహాజు సూర్యఘడియ
  rationale: హీబ్రూ పాఠ్యం ‘మెట్లు/ఎక్కే దారులు’ అని మాత్రమే చెబుతుంది. చారిత్రక పరికరం స్వరూపాన్ని ఖచ్చితంగా నిర్ణయించకుండా పాఠ్యంలోని అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గంభీరమైన గ్రంథశైలిలో ఉంది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, నీడ దిగినదీ తిరిగి మళ్లించబడినదీ స్పష్టంగా తెలిపింది.
