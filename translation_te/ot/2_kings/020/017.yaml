id: 2KI.20.17
reference: 2 Kings 20:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: te
  text: ఇదిగో, రోజులు రాబోతున్నాయి; అప్పుడు నీ ఇంటిలో ఉన్నదంతా, ఈ రోజు వరకు నీ పూర్వికులు కూడబెట్టినదంతా బబులోనుకు తీసుకుపోబడుతుంది. ఏదీ మిగలదు అని యెహోవా సెలవిచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: రాబోయే తీర్పుపై శ్రద్ధను కేంద్రీకరించే హీబ్రూ సూచనాత్మక అవ్యయ బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּבֵיתֶךָ
  choice: నీ రాజభవనంలో
  rationale: రాజైన హిజ్కియాకు సంబోధన జరుగుతున్న సందర్భంలో בַּיִת అతని గృహాన్ని, ముఖ్యంగా రాజభవనాన్ని సూచిస్తుంది; తెలుగులో సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: אָצְרוּ
  choice: కూడబెట్టిన
  rationale: నిధులుగా పోగుచేయడం లేదా నిల్వచేయడం అనే క్రియార్థాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּבֶלָה
  choice: బబులోనుకు
  rationale: దిశను సూచించే హీబ్రూ ప్రత్యయాన్ని ‘-కు’తో వ్యక్తపరుస్తూ సంప్రదాయ తెలుగు స్థలనామాన్ని వాడింది.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: ఏదీ మిగలదు
  rationale: పదశః ‘ఒక వస్తువూ మిగలదు’; సంపూర్ణ నష్టాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אָמַר יְהוָה
  choice: ఇది యెహోవా వాక్కు
  rationale: ప్రవచనాత్మక దైవ ప్రకటన సూత్రాన్ని గంభీరమైన, సహజమైన తెలుగు రూపంలో తెలియజేస్తూ దైవనామాన్ని ప్రతిలిపి చేసింది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన రూపంతో నిలిపింది; ప్రత్యేక మతపర వ్యాఖ్యానాన్ని జోడించదు.
- issue: ‘నీ ఇల్లు’ అనే పదబంధపు పరిధి
  choice: నీ రాజభవనం
  alternative: నీ ఇల్లు
  rationale: రాజుకు ఉద్దేశించిన ఈ ప్రవచనంలో రాజభవనం మరియు దానిలోని సంపద ప్రధానంగా ఉద్దేశించబడ్డాయి. అయితే వంశం నశిస్తుందని ఈ వచనంలో లేనిదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, ప్రవచనంలోని గంభీరతను మరియు సంపూర్ణ తీర్పు బలాన్ని నిలిపిన శైలి. అవసరం లేని పాదటిప్పణులు లేవు.
