  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: te
  text: 'అప్పుడు యెషయా హిజ్కియాతో ఇలా అన్నాడు: “యహ్వే[a] వాక్యాన్ని విను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: YHWH (యహ్వే); సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-వరుస రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు … అన్నాడు’ దాని క్రమబద్ధమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְשַׁעְיָהוּ
  choice: యెషయా
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אֶל חִזְקִיָּהוּ
  choice: హిజ్కియాతో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שְׁמַע
  choice: విను
  rationale: ఏకవచన ఆజ్ఞార్థక రూపాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: דְּבַר
  choice: మాట
  rationale: ప్రవచన సందర్భంలోని దేవుని పలుకును సూచించే స్థిరమైన బైబిలు ప్రయోగాన్ని నిలుపుతుంది; ‘సందేశం’ కూడా భావానువాదంగా సాధ్యమే.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘ప్రభువు’ సంప్రదాయ ప్రత్యామ్నాయం, ‘యెహోవా’ తరువాత ఏర్పడిన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రవచన శైలి. ఏకవచన ఆజ్ఞ ‘విను’ను, కథన క్రమాన్ని తెలిపే ‘అప్పుడు’ను నిలిపాం.
