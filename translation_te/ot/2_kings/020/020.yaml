source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: హిజ్కియా చేసిన మిగిలిన కార్యాలు, అతని పరాక్రమమంతా, అతడు చెరువును[a], నీటి కాలువను[b] నిర్మించి నీటిని నగరంలోకి రప్పించిన విధానం[c]—ఇవన్నీ యూదా రాజుల వృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీటి నిల్వ.” హీబ్రూ పదం నిర్మించిన నీటి తొట్టెను లేదా జలాశయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీటి మార్గం.” హీబ్రూ పదం నీరు ప్రవహించే సహజ లేదా నిర్మిత కాలువను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇది యెరూషలేములో హిజ్కియా చేపట్టిన ప్రసిద్ధ జలవనరుల నిర్మాణ పనులను సూచించే అవకాశం ఉంది; 2 దినవృత్తాంతాలు 32:30 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల గ్రంథంలోని చరిత్ర రచనా ముగింపు సూత్రానికి సహజమైన తెలుగు; דְּבָרִים యొక్క సందర్భార్థమైన కార్యాలు/చర్యలను తెలియజేస్తుంది.
- source_word: גְּבוּרָתוֹ
  choice: అతని పరాక్రమమంతా
  rationale: బలం, శౌర్యం, ఘనకార్యాలు అనే అర్థవిస్తృతిని ఉంచుతూ హీబ్రూ అమూర్త నామరూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: నిర్మించి ... రప్పించిన విధానం
  rationale: తదుపరి ఇంజినీరింగ్ కార్యాలను హిజ్కియా పరాక్రమానికి నిర్దిష్ట ఉదాహరణగా సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: הַבְּרֵכָה
  choice: చెరువు
  rationale: నిర్మిత నీటి నిల్వ లేదా కొలనును సూచించే సాధారణ, సులభమైన తెలుగు పదం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: הַתְּעָלָה
  choice: నీటి కాలువ
  rationale: నీటిని తరలించే నిర్మిత మార్గాన్ని స్పష్టంగా సూచిస్తుంది; సందర్భానికి అవసరమైన 'నీటి' అనే వివరణ సహజ తెలుగును ఇస్తుంది.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: నీటిని నగరంలోకి రప్పించిన
  rationale: దిశను సూచించే הָעִירָה ను 'నగరంలోకి'గా, causative/resultative భావాన్ని సహజంగా 'రప్పించిన'గా వ్యక్తపరుస్తుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: హీబ్రూలోని అలంకార ప్రశ్నను ప్రకటనగా మార్చకుండా, తెలుగులో సహజమైన ప్రశ్నాంత రూపంతో నిలుపుతుంది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల వృత్తాంతాల గ్రంథం
  rationale: ఇది యూదా రాజులకు సంబంధించిన రాజరిక లిఖిత ఆధార గ్రంథమని తెలియజేసే సహజమైన శీర్షిక; కానానిక 'దినవృత్తాంతములు' గ్రంథంతో అనవసర గందరగోళాన్ని తగ్గిస్తుంది.
