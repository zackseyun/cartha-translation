source:
  edition: WLC
  text: וַ/יָּבֹא֙ יְשַֽׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֖אוּ מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: te
  text: 'అప్పుడు యెషయా ప్రవక్త హిజ్కియా రాజు వద్దకు వచ్చి అతనితో ఇలా అన్నాడు: “ఈ మనుషులు ఏమన్నారు? వారు ఎక్కడి నుండి నీ దగ్గరికి వచ్చారు?” హిజ్కియా ఇలా చెప్పాడు: “వారు సుదూర దేశం నుండి, బబులోను నుండి వచ్చారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: యెషయా ప్రవక్త
  rationale: వ్యక్తి పేరుకు ప్రాచుర్యంలో ఉన్న తెలుగు రూపాన్ని, అతని నిర్దిష్ట పాత్రను తెలిపే బిరుదుతో కలిపి ఇచ్చాం.
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: హిజ్కియా రాజు దగ్గరికి
  rationale: హీబ్రూ దిశార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ‘రాజు’ను పేరుతో గౌరవప్రదంగా కలిపాం.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: ఈ మనుషులు ఏమన్నారు?
  rationale: హీబ్రూ పుంలింగ బహువచనాన్ని ‘మనుషులు’గా, కథన సందర్భంలోని సంపూర్ణ క్రియను తెలుగు భూతకాలంగా అనువదించాం.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: వారు ఎక్కడి నుండి నీ దగ్గరికి వచ్చారు?
  rationale: ఇంపర్ఫెక్ట్ రూపంలోని కాల అస్పష్టతను గమనించినప్పటికీ, ఇప్పటికే జరిగిన రాకను విచారించే కథన సందర్భానికి భూతకాలం సహజం; אֵלֶיךָను స్పష్టంగా ‘నీ దగ్గరికి’గా నిలిపాం.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: దూరదేశం నుండి
  rationale: భౌగోళిక దూరాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאוּ מִבָּבֶל
  choice: బబులోను నుండి వచ్చారు
  rationale: మొదట సాధారణ మూలాన్ని చెప్పి, తరువాత నిర్దిష్ట స్థలమైన బబులోనును పేర్కొనే హీబ్రూ క్రమాన్ని కాపాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ప్రశ్నల క్రమం, ‘నీ దగ్గరికి’ అనే స్పష్టమైన దిశార్థం, దూరదేశం నుండి బబులోనుకు జరిగే నిర్దిష్టీకరణ నిలుపబడ్డాయి.
