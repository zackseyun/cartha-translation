- from: 'అప్పుడు యెషయా ప్రవక్త హిజ్కియా రాజు దగ్గరికి వచ్చి, అతనితో[a] ఇలా అన్నాడు: “ఈ మనుషులు ఏమన్నారు? వారు ఎక్కడి నుండి నీ దగ్గరికి వచ్చారు?” హిజ్కియా, “వారు దూరదేశం నుండి[b], బబులోను నుండి వచ్చారు” అని చెప్పాడు.'
