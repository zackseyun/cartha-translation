  text: וַ/יִּשְׁכַּ֥ב חִזְקִיָּ֖הוּ עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: te
  text: హిజ్కియా తన పితరులతో కూడ నిద్రించాడు[a]. అతని స్థానంలో అతని కుమారుడు మనష్షే రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తన పితరులతో కూడ పడుకున్నాడు.’ ఇది మరణాన్ని సూచించే ప్రామాణిక హీబ్రూ రాజవంశ సూత్రప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: שׁכב అనే క్రియకు ప్రాథమికంగా ‘పడుకొను/నిద్రించు’ అనే భావం ఉంది; ‘తన పితరులతో కూడ’ అనే పదబంధంతో ఇది రాజుల మరణాన్ని తెలిపే సంప్రదాయ సూత్రప్రయోగం. ‘నిద్రించాడు’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: ఇది మరణాన్ని సూచించే హీబ్రూ రాజవంశ సూత్రప్రయోగం. ‘పితరులు’ మూలంలోని אָבוֹת పదాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘కూడ’ సహవాచక సంబంధాన్ని సహజమైన తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ సందర్భంలో מלך పరిపాలన కాలాన్ని కాక సింహాసనారోహణాన్ని సూచిస్తుంది; అందువల్ల ‘పరిపాలించాడు’ కంటే ‘రాజయ్యాడు’ సరిగ్గా సరిపోతుంది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మూలంలోని పుత్ర సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవారసత్వ సందర్భంలో תחתיו అంటే ‘అతని స్థానంలో’; ఇది అధికార వారసత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
