revisions:
- from: '“యెహోవా, దయచేసి జ్ఞాపకం చేసుకో: నేను నీ సన్నిధిలో నమ్మకంగా[a], పూర్ణ హృదయంతో[b] నడుచుకున్నాను; నీ దృష్టికి మంచిదైనదే చేశాను.” అని చెప్పి, హిజ్కియా ఎంతో ఏడ్చాడు.'
  to: '“యాహ్వే, దయచేసి జ్ఞాపకం చేసుకో: నేను నీ ఎదుట నమ్మకంగా[a], పూర్ణ హృదయంతో[b] నడుచుకున్నాను; నీ దృష్టికి మంచిదైనది చేశాను.” హిజ్కియా ఎంతో ఏడ్చాడు.'
  rationale: The revision aligns the divine name with the project’s Yahweh policy, removes an unwarranted exclusive nuance from “మంచిదైనదే,” and streamlines the post-quotation narration. It otherwise preserves the draft’s sound treatment of the Hebrew idioms and its restrained rendering of the intensified weeping.
