source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: te
  text: '“యాహ్వే, దయచేసి జ్ఞాపకం చేసుకో: నేను నీ ఎదుట నమ్మకంగా[a], పూర్ణ హృదయంతో[b] నడుచుకున్నాను; నీ దృష్టికి మంచిదైనది చేశాను.” హిజ్కియా ఎంతో ఏడ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సత్యంగా.” హీబ్రూ పదం సత్యత్వాన్ని లేదా నమ్మకత్వాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “విభజింపబడని హృదయంతో.” ఇక్కడ భావం సంపూర్ణమైన, అఖండ నిబద్ధతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: దయచేసి
  rationale: ప్రార్థనలోని గాఢమైన విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రెండు హీబ్రూ అభ్యర్థనా సూచకాల భావాన్ని ఒకే మర్యాదపూర్వక పదబంధంలో మోస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామాన్ని తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: זְכָר
  choice: జ్ఞాపకం చేసుకో
  rationale: ఆజ్ఞార్థక విన్నపాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: నేను నీ సన్నిధిలో ... నడుచుకున్నాను
  rationale: దేవుని సమక్షంలో సాగించిన జీవన ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యేలా నిలుపుతుంది.
- source_word: בֶּאֱמֶת
  choice: నమ్మకంగా
  rationale: ఈ సందర్భంలో నిజత్వంతో కూడిన విశ్వసనీయ ప్రవర్తనను సూచిస్తుంది; ‘సత్యంగా’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: పూర్ణ హృదయంతో
  rationale: శాలేమ్ సూచించే సంపూర్ణత, అఖండ నిబద్ధతను వ్యక్తపరుస్తుంది; పాపరహిత పరిపూర్ణతను తప్పనిసరిగా సూచించదు.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: నీ దృష్టికి మంచిదైనదే చేశాను
  rationale: మంచితనానికి దేవుని తీర్పే ప్రమాణమనే మూలభాషా వ్యక్తీకరణను సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: ఎంతో ఏడ్చాడు
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకం కలిసిన తీవ్రతా నిర్మాణాన్ని సహజ తెలుగులో పరిమాణాత్మకంగా వ్యక్తపరుస్తుంది; మూలంలో స్పష్టంగా లేని ‘వేదనతో/బిగ్గరగా’ అనే భావాన్ని చేర్చదు.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు పరిచితమైన రూపాన్ని ఉపయోగించింది.
- issue: שָׁלֵם ద్వారా హిజ్కియా తన హృదయాన్ని వర్ణించడం
  choice: పూర్ణ హృదయంతో
  alternative: విభజింపబడని హృదయంతో / సంపూర్ణ హృదయంతో
  rationale: ఈ పదం అఖండ నిబద్ధతను సూచించే అవకాశాన్ని నిలుపుతుంది; హిజ్కియా పాపరహితుడని వాక్యం ప్రకటిస్తున్నట్లు అతిగా తీర్మానించదు.
- issue: בֶּאֱמֶת యొక్క నైతిక భావం
  choice: నమ్మకంగా
  alternative: సత్యంగా
  rationale: ఇక్కడ హిజ్కియా దేవుని ఎదుట ఎలా నడుచుకున్నాడో వర్ణించబడుతున్నందున విశ్వసనీయత/యథార్థత ప్రధానంగా కనిపిస్తుంది; పదంలోని ‘సత్యం’ భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభావంతో కూడిన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ ‘నడుచుట’ రూపకం నిలుపబడింది. ప్రత్యక్ష వాక్యానికి తరువాత ‘అని చెప్పి’ చేర్చి తెలుగు వాక్యప్రవాహాన్ని సహజం చేసింది.
