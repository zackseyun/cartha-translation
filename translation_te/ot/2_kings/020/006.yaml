source:
  edition: WLC
  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: te
  text: నీ జీవితకాలానికి పదిహేను సంవత్సరాలు చేర్చుతాను. అష్షూరు రాజు చేతిలోనుండి నిన్నూ ఈ పట్టణాన్నీ విడిపిస్తాను[a]. నా నిమిత్తం, నా సేవకుడైన దావీదు నిమిత్తం ఈ పట్టణాన్ని కాపాడుతాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అష్షూరు రాజు అధికారంలోనుండి’; అక్షరార్థంగా, ‘అష్షూరు రాజు చేతిలోనుండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ పట్టణాన్ని రక్షిస్తాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ
  choice: నీ జీవితకాలానికి మరో ... చేర్చుతాను
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ దినాలకు చేర్చుతాను.’ ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా ‘జీవితకాలానికి’ అని ఇచ్చి, יסף హిఫీల్‌లోని ‘చేర్చు’ భావాన్ని నిలిపాం.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: పదిహేను సంవత్సరాలు
  rationale: సంఖ్యా పదబంధానికి నేరమైన తెలుగు అనువాదం.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు చేతిలోనుండి
  rationale: כף అనే ‘చేతి’ రూపకాన్ని నిలిపి, అధికారం లేదా పట్టు అనే భావాన్ని సందర్భంలో గ్రహించగల సహజమైన తెలుగు వాడుకను ఎంచుకున్నాం.
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: నిన్నూ ఈ పట్టణాన్నీ విడిపిస్తాను
  rationale: נצל హిఫీల్‌లోని రక్షించి బయటకు తీయడం అనే భావానికి ‘విడిపిస్తాను’ సరిపోతుంది; వ్యక్తినీ పట్టణాన్నీ ఒకే క్రియకు కర్మలుగా స్పష్టంగా ఉంచుతుంది.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: ఈ పట్టణాన్ని కాపాడుతాను
  rationale: גנן అంటే కప్పి రక్షించడం లేదా కాపాడడం. ముట్టడి సందర్భంలో ‘కాపాడుతాను’ సహజంగా ఉండి రక్షణ భావాన్ని నిలుపుతుంది.
- source_word: לְמַעֲנִי
  choice: నా నిమిత్తం
  rationale: దేవుని స్వీయ కారణాన్ని విస్తరించకుండా, ఉద్దేశం లేదా కారణాన్ని తెలిపే మూలపదబంధాన్ని గౌరవప్రదంగా ప్రతిబింబిస్తుంది.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: నా సేవకుడైన దావీదు నిమిత్తం
  rationale: దావీదును దేవుని సేవకుడిగా పేర్కొనే మూలవాక్యాన్ని, దాని నిబంధనాత్మక సూచనలను వ్యాఖ్యానించి విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: యెరూషలేమును కాపాడడానికి దేవుడు తెలిపిన కారణం
  choice: నా నిమిత్తం, నా సేవకుడైన దావీదు నిమిత్తం
  alternative: నా కోసమూ నా సేవకుడైన దావీదు కోసమూ
  rationale: మూలపాఠం దేవుని చర్యకు ఆయననే మరియు ఆయన సేవకుడైన దావీదునే కారణాలుగా సమాంతరంగా పేర్కొంటుంది. దాని నిబంధనాత్మక లేదా సిద్ధాంతపరమైన పరిధిని అదనంగా నిర్వచించకుండా ఆ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘పట్టణం,’ ‘నిమిత్తం,’ ‘సేవకుడు’ వంటి పదాలు బైబిలు సందర్భపు గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. మూలంలోని వరుస ప్రథమపురుష వాగ్దానాలను స్పష్టమైన తెలుగు వాక్యాలుగా విభజించాం.
