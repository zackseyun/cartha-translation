id: 2KI.20.1
reference: 2 Kings 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: te
  text: 'ఆ రోజుల్లో హిజ్కియా చనిపోయేంతగా జబ్బుపడ్డాడు. అప్పుడు ఆమోజు కుమారుడైన యెషయా ప్రవక్త అతని దగ్గరికి వచ్చి అతనితో ఇలా అన్నాడు: “యహ్వే ఇలా అంటున్నాడు: ‘నీ ఇంటి వ్యవహారాలను చక్కబెట్టుకో. ఎందుకంటే నీవు చనిపోబోతున్నావు[a]; నీవు బ్రతకవు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీవు చనిపోతున్నావు” లేదా “నీవు మృతుడివి.” ఈ హీబ్రూ ప్రయోగం సమీపించిన, నిశ్చయమైన మరణాన్ని ప్రకటిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: కథన కాలపరిస్థితిని తెలిపే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: హిజ్కియా చనిపోయేంతగా జబ్బుపడ్డాడు
  rationale: חָלָה లోని అనారోగ్యానికి లోనైన భావాన్నీ, לָמוּת సూచించే ప్రాణాంతక తీవ్రతనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ఆమోజు కుమారుడైన యెషయా ప్రవక్త
  rationale: వ్యక్తిపేరు, తండ్రి గుర్తింపు, ప్రవక్త అనే బిరుదు అన్నిటినీ ఉంచుతూ తెలుగులో సహజమైన క్రమాన్ని అనుసరిస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో అందిస్తూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది.
- source_word: צַו לְבֵיתֶךָ
  choice: నీ ఇంటి వ్యవహారాలను చక్కబెట్టుకో
  rationale: మరణానికి ముందు కుటుంబం లేదా ఇంటి విషయాల్లో అవసరమైన ఏర్పాట్లు, ఆదేశాలు చేయాలనే హీబ్రూ నుడికార భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: כִּי מֵת אַתָּה
  choice: ఎందుకంటే నీవు చనిపోబోతున్నావు
  rationale: పూర్తయిన మరణాన్ని కాక, నిశ్చయమైన సమీప మరణాన్ని ప్రకటించే predicative participle బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תִחְיֶה
  choice: నీవు బ్రతకవు
  rationale: ‘కోలుకోవు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, కొనసాగిన జీవితం ఉండదనే మూలపాఠాన్ని నేరుగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు లిపిలో దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: מֵת אַתָּה యొక్క కాలభావం
  choice: నీవు చనిపోబోతున్నావు
  alternative: నీవు చనిపోతున్నావు / నీవు మృతుడివి / నీవు తప్పక చనిపోతావు
  rationale: వాక్యం ప్రకటించే మరణ నిశ్చయాన్ని నిలుపుతూ, హిజ్కియా అప్పటికే మరణించాడనే అసంభవ అర్థాన్ని నివారిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికలో చూపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. పాతకాలపు క్రియారూపాలను నివారించి, ప్రవక్త సందేశంలోని గంభీరతను నిలిపింది.
