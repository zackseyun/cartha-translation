source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֥ה רָא֖וּ בְּ/בֵיתֶ֑/ךָ וַ/יֹּ֣אמֶר חִזְקִיָּ֗הוּ אֵ֣ת כָּל אֲשֶׁ֤ר בְּ/בֵיתִ/י֙ רָא֔וּ לֹא הָיָ֥ה דָבָ֛ר אֲשֶׁ֥ר לֹֽא הִרְאִיתִ֖/ם בְּ/אֹצְרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: te
  text: అతడు, “వారు నీ ఇంట్లో[a] ఏమి చూశారు?” అని అడిగాడు. హిజ్కియా, “వారు నా ఇంట్లో ఉన్నదంతా చూశారు. నా ఖజానాల్లో[b] నేను వారికి చూపించనిది ఏదీ లేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ రాజభవనంలో.” హీబ్రూలో “నీ ఇంట్లో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా గిడ్డంగుల్లో.” హీబ్రూ పదం విలువైన వస్తువులు లేదా సరఫరాలు దాచే ప్రదేశాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: ఏమి చూశారు
  rationale: ప్రశ్నార్థక సర్వనామాన్నీ, ראה అనే సాధారణ ‘చూడు’ క్రియనూ సహజమైన తెలుగు ప్రశ్నగా అందిస్తుంది.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: నీ ఇంట్లో / నా ఇంట్లో
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థమైన ‘ఇల్లు’ను నిలుపుతుంది; రాజసందర్భంలో ‘రాజభవనం’ అనే భావం సాధ్యమని పాదటిప్పణిలో సూచించబడింది.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: నా ఇంట్లో ఉన్నదంతా
  rationale: כָּל אֲשֶׁר యొక్క సమగ్ర భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הִרְאִיתִם
  choice: నేను వారికి చూపించనిది ఏదీ లేదు
  rationale: హీబ్రూ అస్తిత్వ నిరాకరణను సహజమైన తెలుగులో అందిస్తూ, హిఫిల్ రూపంలోని ‘చూపించు’ భావాన్నీ బహువచన కర్మసూచక ప్రత్యయాన్నీ నిలుపుతుంది.
- source_word: בְּאֹצְרֹתָי
  choice: నా ఖజానాల్లో
  rationale: אֹצָר రాజసంపద ఉంచే ఖజానాను లేదా సరఫరాలు ఉంచే గిడ్డంగిని సూచించగలదు; రాజసందర్భంలో ‘ఖజానాలు’ ప్రధాన పాఠానికి సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని పునరుక్తి, సమగ్రత, రాజసందర్భంలో ‘ఇల్లు/రాజభవనం’ మరియు ‘ఖజానాలు/గిడ్డంగులు’ అనే అర్థవిస్తృతి నిలుపబడ్డాయి.
