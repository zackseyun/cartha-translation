  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: te
  text: 'అప్పుడు అతడు తన ముఖాన్ని గోడవైపు తిప్పి, యాహ్వేకు[a] ఇలా ప్రార్థించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని ప్రత్యేక నామం יהוה (YHWH) ఉంది; దాని ప్రాచీన ఉచ్చారణ ఖచ్చితంగా తెలియకపోయినా, సాధారణంగా దాన్ని ‘యాహ్వే’గా పలుకుతారు.
    reason: దైవనామం యొక్క మూలరూపం మరియు ఉచ్చారణకు సంబంధించిన సమాచారాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: అప్పుడు … తిప్పి
  rationale: סבב అనే ధాతువు హిఫిల్ వయ్యిక్తోల్ రూపంలో వరుసగా జరిగిన గత చర్యను సూచిస్తుంది. ‘అప్పుడు’ కథన క్రమాన్ని, ‘తిప్పి’ చర్యను సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: פָּנָיו
  choice: తన ముఖాన్ని
  rationale: పదశః ‘అతని ముఖాన్ని.’ వాక్యంలోని కర్తనే సూచిస్తున్నందున ఆధునిక తెలుగులో ‘తన ముఖాన్ని’ సహజంగా ఉండి, మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: אֶל הַקִּיר
  choice: గోడవైపు
  rationale: אֶל దిశను, קִיר ‘గోడ’ను సూచిస్తాయి. ‘గోడవైపు’ అనే రూపం దిశాభావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థిస్తూ
  rationale: פלל ధాతువు హిత్పయేల్ రూపం ఇక్కడ ‘ప్రార్థించు’ అని అర్థం. తరువాతి לֵאמֹרతో కలిపి ‘ప్రార్థిస్తూ ఇలా అన్నాడు’ అనడం తెలుగు వాక్యప్రవాహానికి సహజం.
- source_word: אֶל יְהוָה
  choice: యాహ్వేకు
  rationale: אֶל ఇక్కడ ప్రార్థన ఎవరికి చేయబడిందో సూచిస్తుంది; יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: אמר యొక్క ఇన్ఫినిటివ్ కన్స్ట్రక్ట్ తరువాత వచ్చే ప్రార్థనా మాటలను పరిచయం చేస్తుంది. తెలుగు కథనంలో ‘ఇలా అన్నాడు:’ తదుపరి వచనానికి స్పష్టమైన పరిచయం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో నాలుగు హల్లులతో ఉన్న ప్రత్యేక దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా, స్వరరూపంపై ఉన్న పరిమితిని పాదటిప్పణిలో తెలియజేస్తూ ‘యాహ్వే’గా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ముఖాన్ని గోడవైపు తిప్పి’ అనే స్పష్టమైన దృశ్యాన్ని నిలిపి, తదుపరి వచనంలోని ప్రార్థనకు ద్విబిందువుతో మార్గం కల్పించాం.
