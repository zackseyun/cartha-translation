source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: te
  text: '“నీవు వెనక్కి వెళ్లి, నా ప్రజల నాయకుడైన హిజ్కియాతో ఇలా చెప్పు: ‘నీ పూర్వికుడైన దావీదు దేవుడైన యెహోవా ఇలా అంటున్నాడు: నీ ప్రార్థన విన్నాను; నీ కన్నీళ్లు చూశాను. ఇదిగో, నేను నిన్ను స్వస్థపరుస్తున్నాను.[a] మూడవ రోజున నీవు యెహోవా మందిరానికి పైకి వెళ్తావు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నిన్ను స్వస్థపరుస్తాను.” హిబ్రూలో మరింత అక్షరార్థంగా, “ఇదిగో, నేను నిన్ను స్వస్థపరుస్తున్నాను” అని ఉంది; ఇక్కడి కృదంత రూపం త్వరలో జరగబోయే చర్యను కూడా సూచించగలదు.
    reason: హిబ్రూ కృదంతంలో వర్తమాన మరియు సమీప భవిష్యత్ భావాల మధ్య ఉన్న నిజమైన అస్పష్టతను నిలుపుట.
lexical_decisions:
- source_word: שׁוּב
  choice: వెనక్కి వెళ్లి
  rationale: యెషయా తాను వెళ్తున్న దిశను మార్చుకొని హిజ్కియా దగ్గరకు తిరిగి వెళ్లాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נְגִיד עַמִּי
  choice: నా ప్రజల నాయకుడు
  rationale: నָגִיד్ అనే పదంలోని నాయకత్వం లేదా పాలన భావాన్ని స్పష్టంగా తెలియజేస్తూ, ‘రాజకుమారుడు’ అనే తప్పుదారి పట్టించే వంశపారంపర్య భావాన్ని నివారిస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది; దైవనామాన్ని యెహోవా అని ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: నీ పితరుడైన దావీదు దేవుడు
  rationale: ఆבִיךָ పదంలోని పూర్వికుడు/పితరుడు భావాన్ని సందర్భానుగుణంగా తెలియజేస్తూ హిబ్రూ సంబంధాన్ని కాపాడుతుంది.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  choice: నీ ప్రార్థన విన్నాను
  rationale: పూర్తయిన క్రియను, దానికి ప్రస్తుతం ఉన్న ప్రాముఖ్యతను తెలుగు సహజ భూతకాల రూపంలో తెలియజేస్తుంది.
- source_word: רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: నీ కన్నీళ్లు చూశాను
  rationale: ముందటి వాక్యంతో సమాంతరతను కాపాడుతూ దైవిక స్పందనలోని వ్యక్తిగతతను నిలుపుతుంది.
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: ఇదిగో, నేను నిన్ను స్వస్థపరుస్తున్నాను
  rationale: הִנְנִי యొక్క ఉద్ఘాటనను, רֹפֶא అనే కృదంత రూపంలోని జరుగుతున్న లేదా సమీప భవిష్యత్ చర్య భావాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హిబ్రూ కాలసూచనను అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
- source_word: תַּעֲלֶה בֵּית יְהוָה
  choice: యెహోవా మందిరానికి వెళ్తావు
  rationale: ఆలయానికి ‘పైకి వెళ్లడం’ అనే మూలభావం తెలుగులో అక్షరార్థంగా అసహజంగా ఉండవచ్చు; గమ్యాన్ని సహజంగా తెలియజేస్తూ בֵּית יְהוָהను సందర్భానుగుణంగా ‘యెహోవా మందిరం’గా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా నిలుపుతుంది.
- issue: רֹפֶא కృదంత రూపంలోని కాలభావం
  choice: నేను నిన్ను స్వస్థపరుస్తున్నాను
  alternative: నేను నిన్ను స్వస్థపరుస్తాను
  rationale: హిబ్రూ కృదంతం సూచించే తక్షణ లేదా ప్రారంభమవుతున్న చర్య భావాన్ని ప్రధాన పాఠంలో కాపాడి, సందర్భానికి సరిపోయే భవిష్యత్ భావాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: בֵּית יְהוָה యొక్క అర్థం
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: అక్షరార్థమైన ‘ఇల్లు’ కంటే ఇక్కడ ఉద్దేశించిన ఆరాధనా స్థలాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రవక్తీయ వాక్యశైలి ఉపయోగించబడింది. ‘ఇలా అంటున్నాడు’ సూత్రం ఘనతను ఉంచుతూనే అతిగా ప్రాచీనమైన భాషను నివారిస్తుంది. ‘పితరుడు’ వంశపూర్విక సంబంధాన్ని స్పష్టంచేస్తుంది; ‘మందిరం’ సందర్భంలోని ఆలయాన్ని సహజంగా సూచిస్తుంది.
