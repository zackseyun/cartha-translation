  to: '“నీవు వెనక్కి వెళ్లి, నా ప్రజల నాయకుడైన హిజ్కియాతో ఇలా చెప్పు: ‘నీ పూర్వికుడైన దావీదు దేవుడైన యెహోవా ఇలా అంటున్నాడు: నీ ప్రార్థన విన్నాను; నీ కన్నీళ్లు చూశాను. ఇదిగో, నేను నిన్ను స్వస్థపరుస్తున్నాను.[a] మూడవ రోజున నీవు యెహోవా మందిరానికి పైకి వెళ్తావు.’”'
