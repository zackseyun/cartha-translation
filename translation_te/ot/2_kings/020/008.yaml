reference: 2 Kings 20:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ מָ֣ה א֔וֹת כִּֽי יִרְפָּ֥א יְהוָ֖ה לִ֑/י וְ/עָלִ֛יתִי בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: te
  text: హిజ్కియా యెషయాతో, “యాహ్వే నన్ను స్వస్థపరుస్తాడనీ, మూడవ రోజున నేను యాహ్వే మందిరానికి[a] ఎక్కి వెళ్తాననీ తెలిపే సూచన ఏమిటి?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వే ఆలయానికి.” అక్షరార్థంగా, “యాహ్వే ఇంటికి.”
    reason: ‘మందిరం’ సందర్భార్థాన్ని ఇస్తుంది; మూలంలోని בֵּית (‘ఇల్లు’) అనే అక్షరార్థాన్ని మరియు సహజమైన ప్రత్యామ్నాయ పదాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: సాధారణంగా ‘అని చెప్పాడు’ అని అనువదించవచ్చు; అయితే ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో ఆధునిక తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉంటుంది. వావ్-వరుస కథన ప్రవాహాన్ని తెలుగు వాక్యక్రమమే తెలియజేస్తుంది.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: יְשַׁעְיָהוּ
  choice: యెషయా
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: מָה אוֹת
  choice: సూచన ఏమిటి?
  rationale: אוֹת ఇక్కడ దేవుని వాగ్దానాన్ని నిర్ధారించే గుర్తు లేదా సూచన. ‘సూచన’ ఆ భావాన్ని అనవసరంగా ‘రుజువు’కు పరిమితం చేయదు.
- source_word: כִּי
  choice: …అనీ …అనీ తెలిపే
  rationale: ఇక్కడ כִּי కోరుతున్న సూచన యొక్క విషయాన్ని పరిచయం చేస్తుంది. సమన్వయమైన రెండు విషయాలను తెలుగులో ‘అనీ …అనీ’ సహజంగా కలుపుతుంది.
- source_word: יִרְפָּא יְהוָה לִי
  choice: యాహ్వే నన్ను స్వస్థపరుస్తాడనీ
  rationale: అసంపూర్ణ క్రియ ఇక్కడ భవిష్యత్తులో జరిగే స్వస్థతను సూచిస్తుంది; לִי భావాన్ని తెలుగు సకర్మక నిర్మాణంలో ‘నన్ను’గా సహజంగా వ్యక్తపరచింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, మూలంలోని వ్యక్తిగత నామాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: וְעָלִיתִי
  choice: ఎక్కి వెళ్తాననీ
  rationale: עלה యొక్క ‘పైకి వెళ్లడం’ అనే భావాన్ని నిలుపుతూ, మందిరానికి వెళ్లడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపింది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హీబ్రూ కాలవ్యక్తీకరణకు దగ్గరగా ఉండే సహజమైన తెలుగు రూపం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరానికి
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు’; సందర్భంలో దేవాలయాన్ని సూచించేందున ‘మందిరం’ స్పష్టమైన, సహజమైన ఎంపిక.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, హీబ్రూ నామానికి సమీపమైన ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: బేత్ యాహ్వే యొక్క సందర్భార్థం
  choice: యాహ్వే మందిరం
  alternative: యాహ్వే ఇల్లు
  rationale: ‘ఇల్లు’ అక్షరార్థాన్ని చూపినా, ఇక్కడ అది ఆరాధనా మందిరాన్ని సూచిస్తుంది. ‘మందిరం’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; అక్షరార్థం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రశ్నార్థక ప్రత్యక్ష వాక్యానికి సహజంగా ‘అని అడిగాడు’ వాడబడింది. మూలంలోని ‘పైకి వెళ్లడం’ భావం ‘ఎక్కి వెళ్తాను’లో నిలుపబడింది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘యాహ్వే మందిరానికి’ పదబంధం వద్ద ఉంచబడింది.
