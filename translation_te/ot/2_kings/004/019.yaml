source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֶל אָבִ֖י/ו רֹאשִׁ֣/י רֹאשִׁ֑/י וַ/יֹּ֨אמֶר֙ אֶל הַ/נַּ֔עַר שָׂאֵ֖/הוּ אֶל אִמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: te
  text: అతడు తన తండ్రితో, “నా తల! నా తల!” అన్నాడు. అప్పుడు అతని తండ్రి ఆ యువకునితో[a], “అతనిని అతని తల్లి దగ్గరికి మోసుకెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ సేవకునితో.” హీబ్రూ పదం נַעַר సందర్భానుసారంగా బాలుణ్ణి, యువకుణ్ణి, పరిచారకుణ్ణి లేదా సేవకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: అతడు తన తండ్రితో ... అన్నాడు
  rationale: אמר అనే సాధారణ ‘చెప్పు/అను’ క్రియను అతిశయింపకుండా సహజ తెలుగు కథనశైలిలో అనువదిస్తుంది; బాధ తీవ్రతను పునరుక్తి తెలియజేస్తుంది.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: నా తల! నా తల!
  rationale: మూలంలోని సంక్షిప్త పునరుక్తిని అలాగే ఉంచి, ‘నొప్పిగా ఉంది’ వంటి వివరణను చేర్చకుండా బాలుని తీవ్రమైన బాధను వ్యక్తం చేస్తుంది.
- source_word: אֶל הַנַּעַר
  choice: ఆ యువకునితో
  rationale: נַעַר సందర్భానుసారంగా బాలుడు, యువకుడు, పరిచారకుడు అనే అర్థాలు ఇవ్వగలదు. బాలుణ్ణి మోయగల తోడున్న పురుషుణ్ణి సూచించే సమతుల్య పదంగా ‘యువకుడు’ ఎంచుకోబడింది; సేవకుడనే భావాన్ని ప్రధాన పాఠంలో నిర్బంధించదు.
- source_word: שָׂאֵהוּ
  choice: వీణ్ణి ఎత్తుకొని ... తీసుకెళ్లు
  rationale: נשׂא ఇక్కడ బాలుణ్ణి శారీరకంగా ఎత్తుకొని మోసుకెళ్లమనే ఆజ్ఞ. ఆధునిక తెలుగులో గమ్యస్థానంతో కలిపి ఈ రూపం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֶל אִמּוֹ
  choice: అతని తల్లి దగ్గరికి
  rationale: సాధారణ బంధుత్వ పదాన్ని గౌరవప్రదమైన, సహజమైన తెలుగు కథన రూపంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని సంక్షిప్తతను, పునరుక్తి వల్ల కలిగే ఆవేదనను నిలిపి ఉంచింది. రెండవ వాక్యంలో కర్తను ‘అతని తండ్రి’ అని స్పష్టీకరించడం తెలుగు పాఠకుడికి సహజమైన సూచనను అందిస్తుంది; ఇది సందర్భంలో స్పష్టంగా ఉన్న కర్తను మాత్రమే వ్యక్తం చేస్తుంది.
