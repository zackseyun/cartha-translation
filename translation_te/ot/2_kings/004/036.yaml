  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אֶל גֵּיחֲזִ֗י וַ/יֹּ֨אמֶר֙ קְרָא֙ אֶל הַ/שֻּׁנַמִּ֣ית הַ/זֹּ֔את וַ/יִּקְרָאֶ֖/הָ וַ/תָּב֣וֹא אֵלָ֑י/ו וַ/יֹּ֖אמֶר שְׂאִ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: te
  text: అప్పుడు ఎలీషా గేహజీని పిలిచి, “ఈ షూనేమీయురాలిని పిలువు” అన్నాడు. గేహజీ ఆమెను పిలిచాడు, ఆమె ఎలీషా దగ్గరికి వచ్చింది. అప్పుడు ఎలీషా, “నీ కుమారుణ్ణి ఎత్తుకో” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: అప్పుడు అతడు గేహజీని పిలిచి
  rationale: కרא క్రియ కథన క్రమంలోని తదుపరి చర్యను తెలియజేస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘అప్పుడు’ వాడి, אֶל నిర్మాణాన్ని సహజంగా కర్మరూపంలో అనువదించాం.
- source_word: קְרָא
  choice: పిలువు
  rationale: కרא యొక్క ఆజ్ఞార్థక రూపానికి సందర్భంలో నేరుగా, సహజంగా సరిపోయే పదం.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: ఈ షూనేమీయురాలిని
  rationale: స్త్రీలింగ ప్రాంతవాచక పదాన్ని తెలుగులో స్త్రీని సూచించే ‘షూనేమీయురాలు’గా ఇచ్చి, הַזֹּאת లోని ‘ఈ’ భావాన్ని నిలిపాం.
- source_word: וַיִּקְרָאֶהָ
  choice: అతడు ఆమెను పిలిచాడు
  rationale: హీబ్రూలో గేహజీ విధేయతను ప్రత్యేక చర్యగా మళ్లీ చెప్పినందున పునరుక్తిని కుదించకుండా నిలిపాం.
- source_word: וַתָּבֹא אֵלָיו
  choice: ఆమె అతని దగ్గరికి వచ్చింది
  rationale: వ్యక్తివైపు వచ్చిన కదలికను తెలిపే בוא + אֶל నిర్మాణానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שְׂאִי
  choice: ఎత్తుకో
  rationale: נשׂא స్త్రీలింగ ఏకవచన ఆజ్ఞార్థకం. పునర్జీవించిన కుమారుణ్ణి తల్లి తీసుకోవాలనే సందర్భంలో ‘ఎత్తుకో’ సహజంగా సరిపోతుంది.
- source_word: בְנֵךְ
  choice: నీ కుమారుణ్ణి
  rationale: בן పదం సాధారణంగా బిడ్డను మాత్రమే కాక ఇక్కడ ప్రత్యేకంగా కుమారుణ్ణి సూచిస్తుంది; రెండవ పురుష స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని ‘నీ’గా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. ‘షూనేమీయురాలు’ మూలంలోని స్త్రీలింగ ప్రాంతవాచక ప్రత్యేకతను సంక్షిప్తంగా నిలుపుతుంది.
