  verdict: revise
  source_fidelity: 'The draft preserves the narrative sequence, the repeated calling action, the feminine singular imperative, and the specific sense “your son.” However, repeated Telugu pronouns make the referents less clear than the Hebrew discourse context: Gehazi is the one who calls the woman, while she comes to Elisha, who gives the final command.'
  naturalness: The Telugu is generally fluent and appropriately restrained. Explicitly naming Gehazi and Elisha at the two points where the actor/addressee changes makes the narrative natural and prevents avoidable ambiguity.
  terminology: గేహజీ, షూనేమీయురాలు, and కుమారుడు are suitable modern-standard Telugu renderings. “ఎత్తుకో” naturally conveys the imperative שְׂאִי in this immediate context.
  issues:
  - severity: medium
    issue: Ambiguous referents in “అతడు ఆమెను పిలిచాడు; ఆమె అతని దగ్గరికి వచ్చింది. అప్పుడు అతడు ... అన్నాడు.”
    rationale: After Gehazi is introduced, Telugu “అతడు/అతని” most readily refers to Gehazi. In the Hebrew narrative context, Gehazi calls her, she comes to Elisha, and Elisha speaks. The translation should identify these participants explicitly.
