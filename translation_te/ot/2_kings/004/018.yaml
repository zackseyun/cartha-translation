translation_notes:
  register: సరళమైన, ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని ‘తన తండ్రి దగ్గరికి, పంట కోసేవారి దగ్గరికి’ అనే పునరుక్త నిర్మాణం నిలుపబడింది; దీనివల్ల తండ్రి కోత పనివారి మధ్య ఉన్నాడనే సహజ సూచన ఉంటుంది, కానీ మూలం స్పష్టంగా చెప్పనిదాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
