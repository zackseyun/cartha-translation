  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: te
  text: బాలుడు[a] పెరిగాడు. ఒక రోజు[b] అతడు తన తండ్రి దగ్గరకు, కోత కోస్తున్నవారి దగ్గరకు బయలుదేరి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పిల్లవాడు.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ నుడికారం: అక్షరార్థంగా, ‘మరియు ఆ రోజు వచ్చింది’ లేదా ‘మరియు ఆ రోజు జరిగింది’; భావం: ‘ఒక రోజు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: పెరిగాడు
  rationale: גדל ఇక్కడ బాలుని ఎదుగుదలను సూచిస్తుంది. ‘పెరిగాడు’ అనేది సహజంగా ఉండటమే కాక, ‘పెరిగి పెద్దవాడయ్యాడు’ అని మూలంలో ఉన్నదానికంటే ఎక్కువగా వ్యాఖ్యానించదు.
- source_word: הַיָּלֶד
  choice: బాలుడు
  rationale: יֶלֶד అనే పదానికి ‘బాలుడు’ లేదా ‘పిల్లవాడు’ అనే అర్థాలు రావచ్చు. ఈ కథన సందర్భంలో పురుష లింగాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘బాలుడు’ ఎంచుకోబడింది.
- source_word: וַיְהִי הַיּוֹם
  choice: ఒక రోజు
  rationale: ఇది కథనంలో ఒక నిర్దిష్ట సందర్భాన్ని పరిచయం చేసే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో ‘ఒక రోజు’ దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיֵּצֵא
  choice: వెళ్లాడు
  rationale: יצאలో బయటికి వెళ్లే దిశాభావం ఉంది. తెలుగు సందర్భంలో ‘దగ్గరికి వెళ్లాడు’ సహజంగా ఉంది; ఇంటి లేదా నివాస స్థలం నుంచి బయటికి వెళ్లాడనే భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: אֶל אָבִיו
  choice: తన తండ్రి దగ్గరికి
  rationale: אֶל గమ్యాన్ని సూచిస్తుంది. ‘తన తండ్రి దగ్గరికి’ అనేది సంబంధాన్ని, అతని వైపు వెళ్లడాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: אֶל הַקֹּצְרִים
  choice: పంట కోసేవారి దగ్గరికి
  rationale: קֹצְרִים ధాన్యపు పంటను కోసే వారిని సూచిస్తుంది. ‘పంట కోసేవారు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది. మూలంలోని రెండవ אֶל‌ను ప్రతిబింబించడానికి ‘దగ్గరికి’ పునరుక్తి నిలుపబడింది.
