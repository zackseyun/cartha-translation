  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: te
  text: ఆ స్త్రీ గర్భవతియై, ఎలీషా ఆమెతో చెప్పినట్టే, నిర్ణయించిన సమయానికి[a]—మరుసటి సంవత్సరం దాదాపు ఇదే సమయానికి—ఒక కుమారుణ్ణి కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ నిర్ణయించిన సమయానికి, జీవం యొక్క సమయానికి”; ఇది సుమారుగా మరుసటి సంవత్సరం ఇదే కాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: హీబ్రూ הרה ఇక్కడ స్త్రీ గర్భం ధరించడాన్ని సూచిస్తుంది; కథన ప్రవాహంలో ‘గర్భవతియై’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: ఇప్పటికే పరిచయమైన షూనేమీయురాలిని తిరిగి సూచిస్తున్నందున నిర్దిష్టతను తెలుగులో ‘ఆ స్త్రీ’గా వ్యక్తం చేశాం.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కనింది
  rationale: ילד + בן ప్రసవాన్ని తెలిపే సాధారణ హీబ్రూ ప్రయోగం; ఆధునిక తెలుగులో ఇది సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: నిర్ణయించిన సమయానికి
  rationale: מוֹעֵד నిర్ణయించబడిన లేదా నిర్దేశించబడిన కాలాన్ని సూచిస్తుంది; ముందుగా చెప్పబడిన వాగ్దాన సమయాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּעֵת חַיָּה
  choice: మరుసటి సంవత్సరం దాదాపు ఇదే సమయానికి
  rationale: ఈ హీబ్రూ నుడికారం తరువాతి సంవత్సరంలో ఇదే కాలాన్ని సూచిస్తుంది. ‘దాదాపు’ అనేది כָּ యొక్క సన్నిహిత కాలార్థాన్ని నిలుపుతుంది; అస్పష్టమైన అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ אֱלִישָׁע
  choice: ఎలీషా ఆమెతో చెప్పినట్టే
  rationale: ఈ సంబంధవాచక వాక్యం ఎలీషా ముందుగా పలికిన మాట నెరవేరిందని చూపుతుంది; ‘చెప్పినట్టే’ ఆ సరిపోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
