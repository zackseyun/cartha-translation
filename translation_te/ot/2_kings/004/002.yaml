  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֱלִישָׁע֙ מָ֣ה אֶֽעֱשֶׂה לָּ֔/ךְ הַגִּ֣ידִי לִ֔/י מַה יֶּשׁ ל/כי בַּ/בָּ֑יִת וַ/תֹּ֗אמֶר אֵ֣ין לְ/שִׁפְחָתְ/ךָ֥ כֹל֙ בַּ/בַּ֔יִת כִּ֖י אִם אָס֥וּךְ שָֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: te
  text: ఎలీషా ఆమెతో, “నీ కోసం నేను ఏమి చేయాలి? చెప్పు, నీ ఇంట్లో ఏముంది?” అన్నాడు. ఆమె, “మీ సేవకురాలికి ఇంట్లో ఒక నూనె పాత్ర తప్ప ఏమీ లేదు” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: నీ కోసం నేను ఏమి చేయాలి?
  rationale: ఆమె తరఫున తాను ఏ చర్య తీసుకోవాలో ఎలీషా అడుగుతున్న భావాన్ని, అసంపూర్ణ క్రియలోని ఆలోచనాత్మక ఛాయను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַגִּידִי לִי
  choice: చెప్పు
  rationale: స్త్రీని ఉద్దేశించిన ఆజ్ఞార్థక రూపాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘దయచేసి’ని చేర్చదు.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: నీ ఇంట్లో ఏముంది?
  rationale: יֵשׁ + ל అనే స్వామ్య ప్రయోగాన్ని సహజమైన తెలుగు ప్రశ్నగా అందిస్తూ, ఇంటి అనే స్పష్టమైన సందర్భాన్ని నిలుపుతుంది.
- source_word: לְשִׁפְחָתְךָ
  choice: మీ సేవకురాలి
  rationale: స్త్రీ తనను తాను ఎలీషా ఎదుట వినయంగా ‘మీ సేవకురాలు’ అని పేర్కొన్న భావాన్ని, లింగ సూచనతో సహా నిలుపుతుంది. ఎలీషాను ఉద్దేశించిన తెలుగులో గౌరవ బహువచనం సహజం.
- source_word: אֵין ... כֹל
  choice: మరేమీ లేదు
  rationale: సంపూర్ణ లేమిని తెలిపే బలమైన నిరాకరణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వెంట వచ్చే ఏకైక మినహాయింపుతో సాఫీగా కలుస్తుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ముందు చెప్పిన లేమికి ఉన్న ఏకైక మినహాయింపును స్పష్టంగా సూచిస్తుంది.
- source_word: אָסוּךְ שָׁמֶן
  choice: ఒక నూనె పాత్ర
  rationale: నూనె కోసం వాడే చిన్న పాత్రను సూచిస్తుంది; దాని ఆకారం లేదా ఆచారపరమైన ఉపయోగాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
