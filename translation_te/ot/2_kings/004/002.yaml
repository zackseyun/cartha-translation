translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. స్త్రీని ఉద్దేశించినప్పుడు ‘నీ’ అనే ఏకవచనం, ఆమె ప్రవక్తను ఉద్దేశించిన వినయపూర్వక స్వీయప్రస్తావనలో ‘మీ’ అనే గౌరవ రూపం వాడబడ్డాయి.
