  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: te
  text: అతడు బాలుణ్ణి మోసుకొని అతని తల్లి దగ్గరికి తీసుకొచ్చాడు. బాలుడు మధ్యాహ్నం వరకు ఆమె ఒడిలో[a] కూర్చున్నాడు; ఆ తర్వాత చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదబద్ధంగా ‘ఆమె మోకాళ్లపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: బాలుణ్ణి మోసుకొని
  rationale: נשׂא ఇక్కడ ఎత్తడం మాత్రమే కాకుండా బాలుణ్ణి మోసుకెళ్లడాన్ని సూచిస్తుంది. తెలుగులో కర్త స్పష్టత కోసం సందర్భానుసారంగా ‘బాలుణ్ణి’ అని పేర్కొనబడింది.
- source_word: וַיְבִיאֵהוּ
  choice: తీసుకొచ్చాడు
  rationale: ביא హిఫిల్ రూపం ‘తీసుకురావడం’ అనే దిశార్థాన్ని ఇస్తుంది; తల్లి దగ్గరికి తీసుకురావడాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶל אִמּוֹ
  choice: అతని తల్లి దగ్గరికి
  rationale: సంబంధాన్ని స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: కూర్చున్నాడు
  rationale: ישׁב యొక్క సాధారణ భౌతిక అర్థమైన ‘కూర్చోవడం’ను ఈ సందర్భంలో నిలుపుతుంది.
- source_word: עַל בִּרְכֶּיהָ
  choice: ఆమె ఒడిలో
  rationale: హీబ్రూ పదబద్ధంగా ‘ఆమె మోకాళ్లపై’ అంటుంది; బాలుడు తల్లి ఒడిలో ఉండే దృశ్యానికి ‘ఆమె ఒడిలో’ సహజమైన తెలుగు సమానార్థకం. పదబద్ధ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: עַד הַצָּהֳרַיִם
  choice: మధ్యాహ్నం వరకు
  rationale: צהריים సూచించే మధ్యాహ్నం/నడివేళ కాలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּמֹת
  choice: ఆ తర్వాత చనిపోయాడు
  rationale: వావ్-కన్సెక్యూటివ్ తెలిపే కథన క్రమాన్ని ‘ఆ తర్వాత’ స్పష్టం చేస్తుంది; మరణాన్ని నేరుగా, గంభీరంగా వ్యక్తపరుస్తుంది.
