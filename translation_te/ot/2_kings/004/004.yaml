source:
  edition: WLC
  text: וּ/בָ֗את וְ/סָגַ֤רְתְּ הַ/דֶּ֨לֶת֙ בַּעֲדֵ֣/ךְ וּ/בְעַד בָּנַ֔יִ/ךְ וְ/יָצַ֕קְתְּ עַ֥ל כָּל הַ/כֵּלִ֖ים הָ/אֵ֑לֶּה וְ/הַ/מָּלֵ֖א תַּסִּֽיעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: te
  text: తర్వాత నువ్వు లోపలికి వెళ్లి, నువ్వూ నీ కుమారులూ లోపల ఉండగా తలుపు మూసివేయి. ఈ పాత్రలన్నిటిలో[a] నూనె పోస్తూ, నిండినదాన్ని పక్కన పెట్టు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ సామగ్రి అంతటిలో’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం విస్తృతమైనది; ఇక్కడ సందర్భం నూనె పట్టే పాత్రలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో అక్షరార్థంగా ‘నిండినదాన్ని పక్కకు జరుపు’ అని ఏకవచనంలో ఉంది; అది నిండే ప్రతి పాత్రను సాధారణంగా సూచించవచ్చు.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: తర్వాత నువ్వు లోపలికి వెళ్లి
  rationale: בוא ఇక్కడ ఇంటిలోకి ప్రవేశించడాన్ని సూచిస్తుంది. క్రమాన్ని తెలిపే ו־ను సహజమైన తెలుగులో ‘తర్వాత’గా వ్యక్తం చేశాం.
- source_word: וְסָגַרְתְּ הַדֶּלֶת בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: నువ్వూ నీ కుమారులూ లోపల ఉండగా తలుపు మూసివేయి
  rationale: తలుపుతో వాడిన בְּעַד వారు లోపల ఉండేలా, ఇతరులను బయట ఉంచుతూ తలుపు మూయడాన్ని సూచిస్తుంది. హెబ్రీలోని ‘నీ వెనుక, నీ కుమారుల వెనుక’ అనే స్థలసంబంధ భావాన్ని తెలుగులో సహజంగా తెలిపాం.
- source_word: וְיָצַקְתְּ עַל
  choice: నూనె పోస్తూ
  rationale: יצק అంటే ‘పోయు.’ పాత్రల సందర్భంలో עַל సహజంగా వాటిలో పోయడాన్ని సూచిస్తుంది. కర్మ అయిన నూనెను ముందరి వచన సందర్భం స్పష్టంగా నిర్దేశిస్తున్నందున తెలుగులో పేర్కొన్నాం.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ఈ పాత్రలన్నిటిలో
  rationale: כְּלִים అనేది పాత్రలు లేదా ఇతర సామగ్రిని సూచించగల విస్తృత పదం. ఇక్కడ నూనె నింపే ఖాళీ పాత్రలే సందర్భానికి సరిపోతాయి.
- source_word: וְהַמָּלֵא תַּסִּיעִי
  choice: నిండినదాన్ని పక్కన పెట్టు
  rationale: הַמָּלֵא వ్యాకరణపరంగా ఏకవచన విశేషణం నామవాచకంగా వాడబడింది—‘నిండినది.’ అది ప్రతి నిండిన పాత్రకు వర్తించే సాధారణ ఆదేశంగా అర్థమవుతుంది. נסע హిఫిల్ రూపం ఇక్కడ దానిని అక్కడి నుంచి జరిపి పక్కన ఉంచడాన్ని సూచిస్తుంది.
