translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ఆజ్ఞారూప శైలి. స్త్రీ ఏకవచన సంబోధన తెలుగులో సందర్భానుగుణంగా ‘నువ్వు’ రూపంతో నిలిపాం. రెండవ వాక్యంలో ‘పోస్తూ’ వాడటం నింపడం, నిండిన పాత్రను పక్కన పెట్టడం అనే పునరావృత కార్యశ్రేణిని సహజంగా తెలియజేస్తుంది.
