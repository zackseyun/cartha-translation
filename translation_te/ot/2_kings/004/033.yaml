  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: te
  text: అతడు లోపలికి వెళ్లి, వారిద్దరి వెనుకగా తలుపు మూసి[a], యాహ్వేకు ప్రార్థించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిద్దరిపై తలుపు మూసి”; అంటే అతడు, ఆ బాలుడు మాత్రమే గదిలో ఉండేలా తలుపు మూసాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అతడు లోపలికి వెళ్లి
  rationale: בוא అనే క్రియ యొక్క వరుస కథనరూపం గదిలోకి ప్రవేశించడాన్ని సూచిస్తుంది. సందర్భంలో ‘లోపలికి వెళ్లి’ సహజంగా ఉంది.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: తలుపు మూసి
  rationale: סגר అంటే మూయడం; definite noun דלת ను ‘తలుపు’గా సహజంగా అనువదించాం.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: వారిద్దరి వెనుక
  rationale: తలుపు మూయడం అనే సందర్భంలో בְּעַד వారిద్దరినీ లోపల ఉంచి తలుపు మూసిన భావాన్ని ఇస్తుంది. హీబ్రూ వ్యక్తీకరణలోని స్వల్ప అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, ఉద్దేశించిన స్థలార్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థించాడు
  rationale: פלל యొక్క హిత్పయేల్ రూపం ఇక్కడ ప్రార్థించడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవాకు
  rationale: אֶל క్రియకు అనుగుణంగా ‘కు’గా వచ్చింది; יהוה అనే వ్యక్తిగత దైవనామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక టెట్రాగ్రామటన్ నేరుగా ఉంది. అందువల్ల ‘ప్రభువు’గా మార్చకుండా వ్యక్తిగత నామాన్ని నిలిపాం; ఆధునిక తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. వరుస హీబ్రూ క్రియలను తెలుగు సంయుక్త క్రియ నిర్మాణంతో అందించి, చివరి చర్యను సమాపక క్రియగా ఉంచాం.
