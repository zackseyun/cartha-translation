  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: te
  text: ఆమె కొండమీద ఉన్న దేవుని మనిషి దగ్గరికి వచ్చి, అతని పాదాలను గట్టిగా పట్టుకుంది. గేహజీ ఆమెను తోసివేయడానికి దగ్గరికి వచ్చాడు. అయితే దేవుని మనిషి, “ఆమెను వదిలేయి. ఆమె అంతరంగం తీవ్రమైన వేదనలో ఉంది[a]. యాహ్వే ఈ సంగతి నాకు తెలియకుండా దాచాడు; నాకు చెప్పలేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యాన్ని అక్షరార్థంగా అనువదిస్తే, “ఆమె ప్రాణం ఆమెకు చేదుగా ఉంది.” ఇది తీవ్రమైన అంతరంగ వేదనను తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తకు వాడే హీబ్రూ బిరుదును వ్యాఖ్యానాత్మకంగా ‘ప్రవక్త’ అని మార్చకుండా, సహజమైన తెలుగులో నేరుగా నిలిపింది.
- source_word: אֶל הָהָר
  choice: కొండమీద ఉన్న ... దగ్గరికి
  rationale: ఆమె కొండపై ఎలీషా ఉన్న చోటికి చేరిన కదలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘పర్వతం’ కంటే ఈ సందర్భంలో ‘కొండ’ సాధారణ పాఠకులకు సులభం.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: అతని పాదాలను గట్టిగా పట్టుకుంది
  rationale: חזק తో కూడిన నిర్మాణం దృఢంగా పట్టుకోవడాన్ని సూచిస్తుంది. ‘గట్టిగా పట్టుకుంది’ ఆ చర్యలోని ఆతురతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּגַּשׁ גֵּיחֲזִי לְהָדְפָהּ
  choice: గేహజీ ఆమెను తోసివేయడానికి దగ్గరికి వచ్చాడు
  rationale: సమీపించడం మరియు బలవంతంగా దూరం చేయాలనే ఉద్దేశం రెండింటినీ మూల వాక్య క్రమానికి దగ్గరగా ఉంచుతుంది.
- source_word: הַרְפֵּה לָהּ
  choice: ఆమెను వదిలేయి
  rationale: ఆమెను అడ్డుకోవడం మానమని చెప్పే ఆజ్ఞను ప్రస్తుత తెలుగు వాడుకలో సహజంగా అందిస్తుంది.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: ఆమె అంతరంగం తీవ్రమైన వేదనలో ఉంది
  rationale: నֶפֶשׁ ఇక్కడ వ్యక్తి అంతర్గత స్థితిని, ‘చేదు’ అనే నుడికారం గాఢమైన దుఃఖాన్ని సూచిస్తాయి. అక్షరార్థంలోని అసహజతను ప్రధాన పాఠ్యంలో రుద్దకుండా భావచిత్రాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: הֶעְלִים מִמֶּנִּי וְלֹא הִגִּיד לִי
  choice: ఈ సంగతి నాకు తెలియకుండా దాచాడు; నాకు చెప్పలేదు
  rationale: దేవుడు ఆ విషయాన్ని ఎలీషాకు బయలుపరచలేదనే రెండు సమాంతర వాక్యభాగాలను స్పష్టంగా నిలిపింది. ‘ఈ సంగతి’ అనేది హీబ్రూలో వ్యక్తంగా లేని, సందర్భం ద్వారా గ్రహించబడే కర్మను తెలుగులో సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని సాధారణ బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: נֶפֶשׁ మరియు ‘చేదు’ అనే వేదనా నుడికారం
  choice: ఆమె అంతరంగం తీవ్రమైన వేదనలో ఉంది
  alternative: ఆమె ప్రాణం ఆమెకు చేదుగా ఉంది
  rationale: హీబ్రూ మానవశాస్త్ర పదానికి ఉన్న విస్తృతిని ఒక నిర్దిష్ట ఆత్మ-శరీర సిద్ధాంతంగా కుదించకుండా, ఈ సందర్భంలోని అంతర్గత వ్యథను సహజ తెలుగులో తెలిపింది; అక్షర రూపం పాదటిప్పణిలో ఇచ్చింది.
- issue: ప్రవక్తకు దేవుని ప్రకటన పరిమితంగా ఉండటం
  choice: యాహ్వే ఈ సంగతి నాకు తెలియకుండా దాచాడు; నాకు చెప్పలేదు
  alternative: యాహ్వే నాకు దీనిని బయలుపరచలేదు
  rationale: ఎలీషాకు ఈ విషయం తెలియకపోవడాన్ని మూలంలోని రెండు వాక్యభాగాలతోనే ఉంచి, ప్రవక్త సర్వజ్ఞుడని సూచించే ఎలాంటి వ్యాఖ్యానాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సరళమైన శైలి. సంభాషణ సహజంగా ఉండేలా ‘వదిలేయి’ వాడబడింది. మూలంలోని భావోద్వేగ తీవ్రతను కాపాడుతూ అసహజమైన అక్షరానువాదాన్ని పాదటిప్పణిలో ఇచ్చింది.
