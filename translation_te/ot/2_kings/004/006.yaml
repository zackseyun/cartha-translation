source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/מְלֹ֣את הַ/כֵּלִ֗ים וַ/תֹּ֤אמֶר אֶל בְּנָ/הּ֙ הַגִּ֨ישָׁ/ה אֵלַ֥/י עוֹד֙ כֶּ֔לִי וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אֵ֥ין ע֖וֹד כֶּ֑לִי וַֽ/יַּעֲמֹ֖ד הַ/שָּֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: te
  text: పాత్రలు నిండినప్పుడు[a], ఆమె తన కుమారునితో, “ఇంకొక పాత్రను నా దగ్గరికి తీసుకురా” అంది. అతడు ఆమెతో, “ఇక మరొక పాత్ర లేదు” అన్నాడు. అప్పుడు నూనె ఆగిపోయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాత్రలు నింపబడడం పూర్తయినప్పుడు.”
    reason: మూలంలోని infinitive construct నిర్మాణానికి మరింత రూపసమీపమైన ప్రత్యామ్నాయాన్ని చూపడం.
  - marker: b
    text: అక్షరార్థంగా, “నూనె నిలిచింది”; అంటే, అది ప్రవహించడం ఆగిపోయింది.
    reason: עמד అనే క్రియ యొక్క అక్షరార్థాన్నీ, ఈ సందర్భంలోని భావాన్నీ రెండింటినీ కాపాడడం.
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: నిండినప్పుడు
  rationale: כְּతో కూడిన infinitive construct కాలసంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘నిండినప్పుడు’ సహజంగా ఉండి, పాత్రలను అంతర్లీన కర్తగా స్పష్టంగా చూపుతుంది.
- source_word: הַכֵּלִים / כֶּלִי
  choice: పాత్రలు / పాత్ర
  rationale: כְּלִי అనేది వస్తువు లేదా ద్రవాన్ని ఉంచే సాధనానికి విస్తృత పదం. సందర్భంలో నూనె పోయడానికి తెచ్చిన వివిధ రకాల పాత్రలను సూచించవచ్చు; కాబట్టి ‘కుండ’ కంటే ‘పాత్ర’ మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: הַגִּישָׁה
  choice: నా దగ్గరికి తీసుకురా
  rationale: נגשׁ యొక్క హిఫిల్ ఆజ్ఞారూపం ‘దగ్గరికి తీసుకురా/సమర్పించు’ అనే భావం ఇస్తుంది. ఇక్కడ కుమారుడు మరో పాత్రను ఆమె వద్దకు తేవడం సందర్భోచితం.
- source_word: עוֹד
  choice: ఇంకొక / ఇక మరొక
  rationale: ఏకవచన כֶּלִיతో עוֹד అదనంగా అదే రకమైన మరొక వస్తువును సూచిస్తుంది. అభ్యర్థనలో ‘ఇంకొక’, నిరాకరణలో ‘ఇక మరొక’ సహజమైన తెలుగు ప్రయోగాలు.
- source_word: אֵין עוֹד כֶּלִי
  choice: ఇక మరొక పాత్ర లేదు
  rationale: אֵין ఉనికి లేకపోవడాన్ని తెలియజేస్తుంది. అందుబాటులో అదనపు పాత్ర ఏదీ లేదనే భావాన్ని ఈ అనువాదం సహజంగా, అదనపు వివరణ లేకుండా అందిస్తుంది.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: నూనె ఆగిపోయింది
  rationale: עמד అక్షరార్థంగా ‘నిలిచింది’; ఈ కథన సందర్భంలో నూనె ప్రవహించడం ఆగిందని సూచిస్తుంది. ప్రధాన పాఠంలో సహజ భావాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలుపుతున్నాం.
