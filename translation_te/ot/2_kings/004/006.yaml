translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పాత్ర’ అనే విస్తృత పదం ద్వారా మూలంలోని כְּלִי యొక్క అనిర్దిష్టత నిలుపబడింది; ‘నూనె ఆగిపోయింది’ ద్వారా సందర్భార్థం స్పష్టంగా ఉండగా అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
