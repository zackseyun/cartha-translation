source:
  edition: WLC
  text: וְ/אִ֨ישׁ בָּ֜א מִ/בַּ֣עַל שָׁלִ֗שָׁה וַ/יָּבֵא֩ לְ/אִ֨ישׁ הָ/אֱלֹהִ֜ים לֶ֤חֶם בִּכּוּרִים֙ עֶשְׂרִֽים לֶ֣חֶם שְׂעֹרִ֔ים וְ/כַרְמֶ֖ל בְּ/צִקְלֹנ֑/וֹ וַ/יֹּ֕אמֶר תֵּ֥ן לָ/עָ֖ם וְ/יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: te
  text: బయల్-షాలీషా నుండి ఒక మనిషి వచ్చి, దేవుని మనిషి వద్దకు ప్రథమఫలాల రొట్టెలను—ఇరవై యవ రొట్టెలను—అలాగే తన సంచిలో[b] ఉన్న తాజా ధాన్యాన్ని[a] తీసుకొచ్చాడు. అప్పుడు అతడు, “ప్రజలు తినేలా వారికి ఇవ్వు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వేయించిన ధాన్యం.’ హీబ్రూ పదం కేవలం తాజా ధాన్యాన్ని కాక, తినడానికి సిద్ధం చేసిన ధాన్యాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సంచి’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం. అది సంచి, చుట్టు లేదా ధాన్యపు పొట్టును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక వ్యక్తి
  rationale: ఈ పదం ఇక్కడ ఒక పురుష వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఒక వ్యక్తి’ సహజంగా ఉండి మూలంలోని అనిర్దిష్టతను నిలుపుతుంది.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: బయల్-షాలీషా నుండి
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది ప్రవక్తకు వాడే బిరుదైనా, మూలంలోని పదబంధాన్నే నిలుపుతూ దాని సాహిత్య ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: לֶחֶם בִּכּוּרִים
  choice: ప్రథమఫలాల రొట్టె
  rationale: ప్రథమఫలాలతో సంబంధమున్న రొట్టె అనే నిర్మాణాన్ని, ఆచార సంబంధమైన భావాన్ని అతిగా వివరించకుండా, నేరుగా నిలుపుతుంది.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: ఇరవై యవ రొట్టెలు
  rationale: లెక్కింపులో לֶחֶם రొట్టెలను సూచిస్తుంది; ‘యవ రొట్టెలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: כַרְמֶל
  choice: తాజా ధాన్యం
  rationale: ఇక్కడ ఈ పదం కర్మెలు పర్వతాన్ని కాక, తాజా లేదా తినడానికి సిద్ధం చేసిన ధాన్యాన్ని సూచిస్తుంది. తయారీ విధానాన్ని అతిగా నిర్దిష్టం చేయని విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּצִקְלֹנוֹ
  choice: తన సంచిలో
  rationale: ఈ అరుదైన పదం అర్థం అనిశ్చితం. సందర్భంలో ధాన్యాన్ని మోసే సంచి లేదా చుట్టు అనే భావం సంభావ్యమైనది; ఇతర అవకాశాలను పాదసూచికలో నిలిపాం.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: ప్రజలు తినేలా వారికి ఇవ్వు
  rationale: ఆజ్ఞ తరువాతి క్రియ ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలియజేస్తుంది. ఈ తెలుగు రూపం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
