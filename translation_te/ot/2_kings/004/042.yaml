translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘దేవుని మనిషి’ అనే బిరుదును అలాగే నిలిపాం. ప్రథమఫలాల రొట్టెకు ఇరవై యవ రొట్టెలు వివరణగా ఉన్న సంబంధాన్ని ‘అంటే’తో స్పష్టం చేశాం; అరుదైన రెండు ధాన్య/సంచి పదాల అనిశ్చితిని పాదసూచికల్లో భద్రపరిచాం.
