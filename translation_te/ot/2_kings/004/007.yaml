translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దేవుని మనిషి’ అనే మూల బిరుదును వ్యాఖ్యానాత్మకంగా ‘ప్రవక్త’గా మార్చలేదు; సంభాషణలో సహజమైన ఏకవచన సంబోధనను ఉపయోగించాం.
