  edition: WLC
  text: וַ/תָּבֹ֗א וַ/תַּגֵּד֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יֹּ֗אמֶר לְכִי֙ מִכְרִ֣י אֶת הַ/שֶּׁ֔מֶן וְ/שַׁלְּמִ֖י אֶת נשי/כי וְ/אַ֣תְּ בני/כי תִֽחְיִ֖י בַּ/נּוֹתָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: te
  text: అప్పుడు ఆమె వచ్చి దేవుని మనిషికి విషయం చెప్పింది. అతడు ఆమెతో, “వెళ్లి ఆ నూనెను అమ్మి, నీకు అప్పిచ్చినవారికి చెల్లించు.[a] మిగిలిన దానితో నువ్వూ నీ కుమారులూ జీవించవచ్చు.[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ అప్పులు తీర్చు.’ హీబ్రూ పదంలోని వ్యంజనరూపాన్ని బాకీలను సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మిగిలిన దానివల్ల నువ్వూ నీ కుమారులూ జీవిస్తారు.’
    reason: literal_rendering
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: అప్పుడు ఆమె వచ్చి … విషయం చెప్పింది
  rationale: వరుసగా సాగే హీబ్రూ కథన క్రియలను సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది; ‘విషయం’ అనేది సందర్భంలో జరిగినదాన్ని ఆమె తెలియజేసిందనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషికి
  rationale: ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, హీబ్రూ బిరుదు ‘దేవుని మనిషి’ని పారదర్శకంగా నిలుపుతుంది.
- source_word: לְכִי מִכְרִי אֶת הַשֶּׁמֶן
  choice: వెళ్లి ఆ నూనెను అమ్మి
  rationale: స్త్రీని ఉద్దేశించిన రెండు ఆజ్ఞలను తెలుగులో సహజమైన సంయుక్త ఆజ్ఞగా అందిస్తుంది; మూలంలో లేని ‘ఒలీవ నూనె’ అనే నిర్దిష్టతను చేర్చదు.
- source_word: וְשַׁלְּמִי אֶת נשי/כי
  choice: నీ అప్పులు తీర్చు
  rationale: ఆర్థిక సందర్భంలో שלם క్రియకు ‘తీర్చు’ సహజమైన తెలుగు సమానం. సంబంధిత రూపాన్ని బాకీ ఉన్న మొత్తాన్ని సూచించేదిగా తీసుకొని ‘అప్పులు’ అని అనువదించాం; వ్యక్తిని, అంటే అప్పిచ్చినవాణ్ణి, సూచించే అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: וְאַתְּ בני/כי
  choice: నువ్వూ నీ కుమారులూ
  rationale: మూలంలోని ‘కుమారులు’ అనే లింగనిర్దిష్ట పదాన్ని సాధారణ ‘పిల్లలు’గా మార్చకుండా కాపాడుతుంది.
- source_word: תִחְיִי בַּנּוֹתָר
  choice: మిగిలిన దానితో … జీవించవచ్చు
  rationale: మిగిలిన అమ్మకపు సొమ్ము వారి జీవనాధారమవుతుందనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
