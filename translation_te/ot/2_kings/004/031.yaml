translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. కథనానికి తగిన గౌరవప్రదమైన శైలి నిలుపబడింది; మూలంలోని ‘శబ్దం/స్వరం’ మరియు ‘వినికిడి/శ్రద్ధ’ మధ్య ఉన్న భావ ఉద్వేగం పాదసూచికలో భద్రపరచబడింది.
