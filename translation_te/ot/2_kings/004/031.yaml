source:
  edition: WLC
  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: te
  text: గేహజీ వారికంటే ముందుగా వెళ్లి, ఆ దండాన్ని బాలుడి ముఖం మీద ఉంచాడు. అయితే శబ్దమూ లేదు, స్పందనా లేదు.[a] కాబట్టి అతడు ఎలీషాను కలుసుకోవడానికి తిరిగి వెళ్లి, “బాలుడు మేలుకోలేదు” అని అతనికి తెలిపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “స్వరమూ లేదు, వినికిడి/శ్రద్ధా లేదు.”
    reason: קָשֶׁב అనే అరుదైన పదం వినడం, శ్రద్ధ లేదా ప్రతిస్పందనను సూచించగలదు; ప్రధాన పాఠంలోని సహజమైన ‘స్పందన’తో పాటు మూలంలోని భావ పరిధిని నిలుపుతుంది.
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: వారికంటే ముందుగా వెళ్లి
  rationale: గేహజీ ఎలీషా, బాలుడి తల్లి కంటే ముందుగా వెళ్లాడనే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּשְׁעֶנֶת
  choice: దండం
  rationale: ఈ కథనంలో ప్రవక్త చేతిలో ఉండే staff‌ను సూచించడానికి గౌరవప్రదమైన, సాధారణ తెలుగు పదం.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: బాలుడి ముఖం మీద
  rationale: పదబంధంలోని ముఖం అనే స్పష్టమైన శరీర సూచనను యథాతథంగా నిలుపుతుంది; נַעַרకు సందర్భానుగుణంగా ‘బాలుడు’ సరిపోతుంది.
- source_word: וְאֵין קוֹל
  choice: శబ్దమూ లేదు
  rationale: קוֹל యొక్క ప్రాథమిక అర్థమైన శబ్దం/స్వరాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘ప్రాణసూచన లేదు’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: וְאֵין קָשֶׁב
  choice: స్పందనా లేదు
  rationale: קָשֶׁבలోని వినడం, శ్రద్ధ చూపడం లేదా ప్రతిస్పందించడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మరింత అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: ఎలీషాను కలుసుకోవడానికి తిరిగి వెళ్లి
  rationale: గేహజీ వెనక్కి వెళ్లి ఎలీషాను ఎదురుగా కలుసుకున్న కదలికను స్పష్టంగా, సహజంగా తెలియజేస్తుంది; తెలుగు పాఠకుడికి సర్వనామ సందిగ్ధత రాకుండా సందర్భంలో సూచితమైన ఎలీషా పేరును ఉపయోగిస్తుంది.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: అని అతనికి తెలిపాడు
  rationale: హీబ్రూ నివేదిక సూత్రాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא הֵקִיץ הַנַּעַר
  choice: బాలుడు మేలుకోలేదు
  rationale: మేల్కొనడం అనే క్రియార్థాన్ని నేరుగా నిలుపుతూ, ప్రయత్నం ఫలించలేదనే నివేదికను సహజంగా తెలియజేస్తుంది.
