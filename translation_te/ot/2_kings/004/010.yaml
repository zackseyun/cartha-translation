translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గృహసంభాషణ శైలి వాడబడింది. ‘మేడగది’ సాధారణ పాఠకునికి పై అంతస్తు గదిని సులభంగా తెలియజేస్తుంది; గోడకు సంబంధించిన మూలభాషా సందిగ్ధతను ప్రధాన పాఠ్యంలోనూ పాదసూచికలోనూ నిలిపాం.
