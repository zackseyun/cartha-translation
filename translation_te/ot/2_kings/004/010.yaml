id: 2KI.4.10
reference: 2 Kings 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נַֽעֲשֶׂה נָּ֤א עֲלִיַּת קִיר֙ קְטַנָּ֔ה וְ/נָשִׂ֨ים ל֥/וֹ שָׁ֛ם מִטָּ֥ה וְ/שֻׁלְחָ֖ן וְ/כִסֵּ֣א וּ/מְנוֹרָ֑ה וְ/הָיָ֛ה בְּ/בֹא֥/וֹ אֵלֵ֖י/נוּ יָס֥וּר שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: te
  text: “దయచేసి, గోడపై ఒక చిన్న మేడగది[a] కట్టిద్దాం. అందులో ఆయన కోసం ఒక మంచం, బల్ల, కుర్చీ, దీపస్తంభం పెడదాం. ఆయన మన దగ్గరకు వచ్చినప్పుడల్లా అక్కడికి మళ్లి బస చేయవచ్చు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గోడతో కూడిన ఒక చిన్న మేడగది,” లేదా కేవలం “ఒక చిన్న మేడగది.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉన్నందున గదికీ గోడకీ ఉన్న సంబంధం పూర్తిగా స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అక్కడికి దారి మళ్లవచ్చు.” ఇక్కడ హీబ్రూ క్రియ ప్రయాణంలో బస చేయడానికి దారి మళ్లించి ఆగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: దయచేసి ... కట్టిద్దాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపాన్నీ, נָא లోని మర్యాదపూర్వక ప్రతిపాదననూ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: గోడమీద ఒక చిన్న మేడగది
  rationale: עֲלִיָּה అనే పైగది భావాన్ని ‘మేడగది’తో, קִיר అనే స్పష్టమైన ‘గోడ’ పదాన్ని ‘గోడమీద’తో నిలుపుతుంది; హీబ్రూ పదబంధంలోని సంక్షిప్తత వల్ల నిర్మాణ సంబంధం కొంత అనిశ్చితంగా ఉంది.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: అందులో ఆయన కోసం ... పెడదాం
  rationale: కొనసాగుతున్న ప్రతిపాదనను ‘పెడదాం’గా వ్యక్తం చేసి, שָׁם మరియు לוֹ భావాలను ‘అందులో’, ‘ఆయన కోసం’గా నిలుపుతుంది.
- source_word: מִטָּה
  choice: మంచం
  rationale: బస సందర్భంలో నిద్రించడానికి ఉపయోగించే సాధారణ గృహోపకరణాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: שֻׁלְחָן
  choice: బల్ల
  rationale: గృహోపకరణ సందర్భంలో సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: כִסֵּא
  choice: కుర్చీ
  rationale: విస్తృతమైన ‘ఆసనం’ కంటే ఈ గది సామగ్రి సందర్భానికి ‘కుర్చీ’ సహజంగా సరిపోతుంది.
- source_word: מְנוֹרָה
  choice: దీపస్తంభం
  rationale: కేవలం దీపం అని కాక, దీపాన్ని ఉంచే ఆధారాన్ని సూచించే మూలపద ప్రత్యేకతను కాపాడుతుంది.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: ఆయన మన దగ్గరకు వచ్చినప్పుడల్లా
  rationale: భవిష్యత్తులో పునరావృతమయ్యే సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יָסוּר שָׁמָּה
  choice: అక్కడికి వెళ్లి బస చేయవచ్చు
  rationale: సוּר యొక్క ప్రాథమిక ‘పక్కకు తిరుగు’ భావం ఈ ప్రయాణ సందర్భంలో బస కోసం ఆగడాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
