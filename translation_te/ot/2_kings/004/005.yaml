  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: te
  text: అప్పుడు ఆమె అతని దగ్గరనుంచి వెళ్లి, తన వెనుకా తన కుమారుల వెనుకా తలుపు మూసింది. వారు ఆమెకు పాత్రలను తెస్తూ ఉన్నారు[a]; ఆమె నూనె పోస్తూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “వారు ఆమెకు తెస్తున్నారు” అని మాత్రమే ఉంది; ఏమి తెస్తున్నారో చెప్పబడలేదు. ముందు వచనాల్లోని ఖాళీ పాత్రలను సందర్భాన్ని బట్టి ఇక్కడ చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: అప్పుడు ఆమె అతని దగ్గరనుంచి వెళ్లి
  rationale: క్రమంగా ముందుకు సాగే కథనాన్ని, ఎలీషా దగ్గరనుంచి ఆమె వెళ్లిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: తన వెనుకా తన కుమారుల వెనుకా తలుపు మూసింది
  rationale: తలుపు మూయడంతో వాడిన בְּעַד పదం వారిని లోపల ఉంచుతూ వారి వెనుక తలుపు మూసిన భావాన్ని ఇస్తుంది; హెబ్రీలోని పునరుక్త నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: వారు ఆమె దగ్గరకు పాత్రలను తెస్తూ ఉండగా
  rationale: కృదంత రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది. ప్రత్యక్ష కర్మ హెబ్రీ వాక్యంలో లేకపోయినా, ముందు వచనాల్లోని ఖాళీ పాత్రలను సందర్భానుసారంగా స్పష్టత కోసం చేర్చాం.
- source_word: וְהִיא מיצקת
  choice: ఆమె నూనె పోస్తూ ఉంది
  rationale: కృదంతం కుమారులు పాత్రలను తెచ్చే సమయంలో సమాంతరంగా కొనసాగిన పోయే చర్యను సూచిస్తుంది. పోసింది నూనె అని సమీప సందర్భం స్పష్టం చేస్తుంది.
