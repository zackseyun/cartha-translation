translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. కొనసాగుతున్న రెండు సమాంతర చర్యలను “తెస్తూ ఉండగా,” “పోస్తూ ఉంది” అనే రూపాలతో చూపించాం.
