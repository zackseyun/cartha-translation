  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: te
  text: అప్పుడు అతడు, “ఆమెను పిలువు,” అన్నాడు. అతడు ఆమెను పిలిచాడు; ఆమె ద్వారం వద్ద నిలబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవేశద్వారం వద్ద.” హీబ్రూ పదం ద్వారాన్ని లేదా ప్రవేశ ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా వరుస భావాన్ని తెలియజేస్తుంది.
- source_word: קְרָא לָהּ
  choice: ఆమెను పిలువు
  rationale: పురుష ఏకవచన సంబోధనలోని ఆజ్ఞను సరళంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּקְרָא לָהּ
  choice: అతడు ఆమెను పిలిచాడు
  rationale: ఆజ్ఞకు ప్రతిస్పందనగా జరిగిన చర్యను మూలంలోని కథన క్రమానికి నిబద్ధంగా తెలియజేస్తుంది.
- source_word: וַתַּעֲמֹד
  choice: ఆమె … నిలబడింది
  rationale: עמד యొక్క ‘నిలబడు/స్థానం తీసుకో’ అనే అర్థాన్ని కాపాడుతుంది; మూలంలో లేని ‘వచ్చి’ అనే భావాన్ని చేర్చదు.
- source_word: בַּפָּתַח
  choice: ద్వారం దగ్గర
  rationale: פתח ద్వారాన్ని లేదా ప్రవేశ ప్రాంతాన్ని సూచించగలదు; ‘ద్వారం దగ్గర’ సహజమైన ఆధునిక తెలుగు కాగా స్థానం విషయంలో మూలంలోని కొంత విస్తృతతను నిలుపుతుంది.
