translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. కథన వరుస స్పష్టంగా ఉంది; మూలంలో లేని కదలికను జోడించలేదు.
