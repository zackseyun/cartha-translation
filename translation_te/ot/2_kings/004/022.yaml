id: 2KI.4.22
reference: 2 Kings 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקְרָא֮ אֶל אִישָׁ/הּ֒ וַ/תֹּ֗אמֶר שִׁלְחָ֨/ה נָ֥א לִ/י֙ אֶחָ֣ד מִן הַ/נְּעָרִ֔ים וְ/אַחַ֖ת הָ/אֲתֹנ֑וֹת וְ/אָר֛וּצָה עַד אִ֥ישׁ הָ/אֱלֹהִ֖ים וְ/אָשֽׁוּבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: te
  text: అప్పుడు ఆమె తన భర్తను పిలిచి, “దయచేసి నాకు యువకులలో ఒకరిని, ఆడ గాడిదల్లో ఒకదానిని పంపించు. నేను దేవుని మనిషి వద్దకు పరుగెత్తి వెళ్లి తిరిగి వస్తాను[a]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దేవుని మనిషి వద్దకు త్వరగా వెళ్లి తిరిగి వస్తాను.” హీబ్రూ క్రియకు అక్షరార్థంగా “పరుగెత్తు” అనే అర్థం ఉంది; అది ఆమె ఆతురతను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: అప్పుడు ఆమె తన భర్తను పిలిచి
  rationale: కథనాన్ని ముందుకు నడిపే వయ్యిక్టోల్ రూపాన్ని ‘అప్పుడు’ సహజంగా వ్యక్తపరుస్తుంది; గృహ సందర్భంలో אִישָׁהּ అంటే ‘ఆమె భర్త’.
- source_word: שִׁלְחָה נָא לִי
  choice: దయచేసి ... నా కోసం పంపించు
  rationale: ఆజ్ఞార్థక రూపంతో ఉన్న נָא మర్యాదపూర్వక అభ్యర్థనను సూచిస్తుంది.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: పనివాళ్లలో ఒకరిని
  rationale: נַעַר యువకుడు లేదా పరిచారకుడు అనే అర్థాలు కలిగి ఉంది; ఇక్కడ ప్రయాణానికి తోడుగా పంపే గృహ పరిచారకుడనే సందర్భార్థాన్ని ‘పనివాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: ఆడ గాడిదల్లో ఒకదానిని
  rationale: אָתוֹן ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది; మూలంలోని లింగభేదాన్ని అనువాదంలో నిలిపింది.
- source_word: וְאָרוּצָה
  choice: నేను ... త్వరగా వెళ్లి
  rationale: רוּץ అక్షరార్థంగా ‘పరుగెత్తు’; ఇక్కడ గాడిదపై ప్రయాణించే సందర్భంలో వేగం, అత్యవసరత ప్రధాన భావాలు కాబట్టి సహజ తెలుగులో ‘త్వరగా వెళ్లి’ అని ఇచ్చింది.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి దగ్గరికి
  rationale: చలన సందర్భంలో עַד గమ్యాన్ని సూచిస్తుంది; אִישׁ הָאֱלֹהִים అనే ప్రవక్త బిరుదును వ్యాఖ్యానించకుండా యథాతథంగా నిలిపింది.
- source_word: וְאָשׁוּבָה
  choice: తిరిగి వస్తాను
  rationale: మాట్లాడుతున్న స్త్రీ ఉద్దేశించిన తదుపరి చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే ప్రవక్త బిరుదు
  choice: దేవుని మనిషి
  alternative: దేవుని ప్రవక్త
  rationale: మూలపాఠంలోని ప్రత్యేక బిరుదును నిలిపి, దానిని వ్యాఖ్యానాత్మకంగా ‘ప్రవక్త’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పనివాడు’ సందర్భార్థాన్ని స్పష్టం చేస్తుండగా, ‘ఆడ గాడిద’ మూలంలోని నిర్దిష్ట లింగాన్ని నిలుపుతుంది. మూలంలోని ‘పరుగెత్తు’ భావాన్ని ప్రధాన వాక్యంలో సందర్భోచితంగా ‘త్వరగా వెళ్లి’ అని, పాదటిప్పణిలో అక్షరార్థంగా ఇచ్చింది.
