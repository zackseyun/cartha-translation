  - severity: medium
    issue: The main text renders ‘I may run’ merely as ‘త్వరగా వెళ్లి.’
    rationale: רוּץ explicitly means ‘run.’ Although urgency is conveyed, an optimal-equivalence main text should retain the explicit action where Telugu permits it; the contextual idiom may be noted as an alternative.
