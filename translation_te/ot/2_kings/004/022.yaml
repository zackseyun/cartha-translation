  to: అప్పుడు ఆమె తన భర్తను పిలిచి, “దయచేసి నాకు యువకులలో ఒకరిని, ఆడ గాడిదల్లో ఒకదానిని పంపించు. నేను దేవుని మనిషి వద్దకు పరుగెత్తి వెళ్లి తిరిగి వస్తాను[a]” అంది.
