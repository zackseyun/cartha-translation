source:
  edition: WLC
  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: te
  text: తర్వాత అతడు తిరిగి వచ్చి, ఇంటిలో ఒకసారి ఇటువైపు, మరొకసారి అటువైపు[a] నడిచాడు. ఆపై అతడు పైకి వెళ్లి, బాలుని మీద తనను తాను చాపుకున్నాడు[b]. అప్పుడు బాలుడు ఏడుసార్లు తుమ్మి, కళ్లు తెరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అటూ ఇటూ.’ హీబ్రూలో అక్షరార్థంగా ‘ఒకసారి ఇటువైపు, మరొకసారి అటువైపు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బాలుని మీదకు వంగాడు.’ హీబ్రూ క్రియ ఒకరి మీదకు వంగడం లేదా ఒంగడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తర్వాత అతడు తిరిగి వచ్చి
  rationale: שׁוּב అనే క్రియ ఇక్కడ కథన క్రమంలో ‘తిరిగి రావడం’ను సూచిస్తుంది; ‘తర్వాత’ వరుసగా జరిగిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: ఇంటిలో ... నడిచాడు
  rationale: הלך తో కూడిన స్థాన సూచక పదబంధం ఇంటి లోపల కదలడాన్ని సూచిస్తుంది. ‘పచార్లు చేశాడు’ అనేది సాధ్యమైనా, అది కొంత వ్యాఖ్యానాత్మకం.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: ఒకసారి ఇటువైపు, మరొకసారి అటువైపు
  rationale: హీబ్రూ వ్యక్తీకరణలోని ‘ఒకసారి ఇక్కడికి, ఒకసారి అక్కడికి’ అనే దిశాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיַּעַל
  choice: పైకి వెళ్లి
  rationale: עלה పైకి వెళ్లడాన్ని సూచిస్తుంది; సందర్భంలో బాలుడు ఉన్న మేడగదికి లేదా మంచం దగ్గరికి వెళ్లడం భావం కావచ్చు, కానీ అనువాదం ఆ వివరాన్ని అదనంగా చేర్చదు.
- source_word: וַיִּגְהַר עָלָיו
  choice: బాలుని మీద తనను తాను చాపుకున్నాడు
  rationale: גהר ఒకరి మీదకు వంగడం లేదా ఒంగడాన్ని సూచిస్తుంది. మునుపటి శారీరక చర్య సందర్భంలో ఈ రూపం భంగిమను స్పష్టంగా తెలియజేస్తుంది; ‘మీదకు వంగాడు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיְזוֹרֵר
  choice: తుమ్మి
  rationale: అరుదైన ఈ క్రియకు సంప్రదాయ, నిఘంటు అర్థం ‘తుమ్మడం’; వెంటనే వచ్చే సంఖ్య పునరావృత చర్యను నిర్ధారిస్తుంది.
- source_word: הַנַּעַר
  choice: బాలుడు
  rationale: נַעַר కు సందర్భానుసారం బాలుడు, యువకుడు, సేవకుడు వంటి అర్థాలు ఉండవచ్చు. ఇక్కడ షూనేమీయురాలి కుమారుడిని సూచిస్తున్నందున ‘బాలుడు’ సరిపోతుంది.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: עַד అక్షరార్థంగా ‘వరకు’ అనిపించగలిగినా, సంఖ్యతో కూడిన ఈ ప్రయోగం పూర్తయిన మొత్తం—ఏడుసార్లు—అని సూచిస్తుంది.
- source_word: וַיִּפְקַח ... אֶת עֵינָיו
  choice: కళ్లు తెరిచాడు
  rationale: פקח עיניים అనేది ‘కళ్లు తెరవడం’ అనే సాధారణ హీబ్రూ నుడికారం; తెలుగులో సరళమైన రూపమే సహజంగా ఉంటుంది.
theological_decisions:
- issue: బాలుని మీద ఎలీషా చేసిన చర్య స్వభావం
  choice: అతని శారీరక భంగిమను మాత్రమే వర్ణించి, అది అద్భుతాన్ని కలిగించిన మాంత్రిక లేదా సంస్కారపరమైన ప్రక్రియ అని సూచించలేదు.
  alternative: ‘బాలుని మీదకు వంగాడు’ అని మరింత అక్షరార్థంగా అనువదించడం.
  rationale: హీబ్రూ పాఠ్యం ఎలీషా చేసిన శారీరక చర్యను చెబుతుంది గాని, అద్భుతం ఏ విధానంతో జరిగిందో వివరించదు. కాబట్టి పాఠ్యంలో లేని సిద్ధాంతపరమైన కారణాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను సహజమైన తెలుగు వాక్యాలుగా విభజించాం; అరుదైన క్రియ మరియు ఎలీషా భంగిమలోని భావవ్యాప్తిని పాదసూచికలతో నిలిపాం.
