source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: te
  text: 'ప్రవక్తల శిష్యుల భార్యలలో ఒక స్త్రీ ఎలీషాకు మొరపెట్టి ఇలా అంది: “నీ సేవకుడైన నా భర్త చనిపోయాడు. నీ సేవకుడు యెహోవాకు భయపడేవాడని నీకు తెలుసు. అప్పిచ్చినవాడు నా ఇద్దరు పిల్లలను[a] తన కోసం దాసులుగా తీసుకుపోవడానికి వచ్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఇద్దరు కుమారులను.” హీబ్రూలో “పిల్లలు” అనే పదం ఉంది; సందర్భాన్ని బట్టి అది మరింత నిర్దిష్టంగా “కుమారులు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: ఒక స్త్రీ
  rationale: కొత్త కథాఘట్టంలో నిర్దిష్టంగా పేరు చెప్పని స్త్రీని పరిచయం చేస్తుంది; వావ్‌కు ప్రత్యేక కాలార్థక పదాన్ని చేర్చలేదు.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: ప్రవక్తల శిష్యుల భార్యలలో
  rationale: ‘ప్రవక్తల కుమారులు’ అనే హీబ్రూ సామాజిక పదబంధం ఇక్కడ ప్రవక్తల సమూహంలో శిక్షణ పొందిన శిష్యులను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో అర్థాన్ని అందిస్తుంది.
- source_word: צָעֲקָה
  choice: మొరపెట్టి
  rationale: ఆమె ఆపద, ఆర్తి, సహాయం కోసం చేసిన విజ్ఞప్తి అనే భావాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדְּךָ אִישִׁי
  choice: నీ సేవకుడైన నా భర్త
  rationale: ఎలీషాతో అతని సంబంధాన్నీ, ఆ స్త్రీతో అతని వైవాహిక సంబంధాన్నీ రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: పూర్తయిన మరణ సంఘటనను, దాని ప్రస్తుత పర్యవసానాలతో సహా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: యెహోవాకు భయపడి జీవించాడని
  rationale: הָיָה అనే కొనసాగిన జీవన లక్షణాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, దేవునిపట్ల భక్తిపూర్వక భయమనే బైబిలు భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הַנֹּשֶׁה
  choice: అప్పిచ్చినవాడు
  rationale: అప్పు తిరిగి పొందవలసిన వ్యక్తిని సాధారణ పాఠకులకు తక్షణమే అర్థమయ్యే సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: בָּא לָקַחַת
  choice: దాసులుగా చేసుకోవడానికి వచ్చాడు
  rationale: అతడు వచ్చిన ఉద్దేశాన్నీ, ప్రస్తుతం ఎదురైన ముప్పునీ సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנֵי יְלָדַי
  choice: నా ఇద్దరు పిల్లలను
  rationale: హీబ్రూ పదం లింగాన్ని స్పష్టంగా నిర్దేశించదు; అందువల్ల ‘కుమారులు’ అని సంకుచితం చేయకుండా మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: לוֹ לַעֲבָדִים
  choice: తనకు దాసులుగా
  rationale: పిల్లలను అప్పిచ్చినవాడు తన సేవకోసం స్వాధీనం చేసుకోబోతున్నాడనే ప్రయోజనార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా సూచిస్తుంది.
- issue: ‘యెహోవాకు భయపడడం’ అనే నుడికారం
  choice: యెహోవాకు భయపడి జీవించాడు
  alternative: యెహోవాను గౌరవించాడు
  rationale: భక్తి, విధేయత, భయం కలిసిన మూలంలోని ధార్మిక ఉద్వేగాన్ని కేవలం ‘గౌరవం’గా తగ్గించకుండా నిలుపుతుంది.
- issue: అప్పు కారణంగా పిల్లలను సేవలోకి తీసుకోవడం
  choice: దాసులుగా చేసుకోవడం
  alternative: పనివారిగా తీసుకోవడం
  rationale: עֲבָדִים అనే పదంలోని బలవంతపు ఆధీన సేవ భావాన్ని మృదువుగా మార్చకుండా ఉంచుతుంది; ఆ సేవకు సంబంధించిన చట్టపరమైన వ్యవధి లేదా స్వరూపాన్ని వాక్యం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథనశైలి. ఎలీషాను ఉద్దేశించిన ఏకవచన సంభాషణకు ‘నీ’ రూపం వాడబడింది. ‘ప్రవక్తల శిష్యులు’ అనే రూపం హీబ్రూ నుడికారమైన ‘ప్రవక్తల కుమారులు’ యొక్క సామాజిక అర్థాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
