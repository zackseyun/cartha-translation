revisions:
- from: 'ప్రవక్తల శిష్యుల భార్యలలో ఒక స్త్రీ ఎలీషాకు మొరపెట్టి ఇలా అంది: “నీ సేవకుడైన నా భర్త చనిపోయాడు. నీ సేవకుడు యెహోవాకు భయపడి జీవించాడని నీకు తెలుసు. ఇప్పుడు అప్పిచ్చినవాడు నా ఇద్దరు పిల్లలను[a] తనకు దాసులుగా చేసుకోవడానికి వచ్చాడు.”'
  to: 'ప్రవక్తల శిష్యుల భార్యలలో ఒక స్త్రీ ఎలీషాకు మొరపెట్టి ఇలా అంది: “నీ సేవకుడైన నా భర్త చనిపోయాడు. నీ సేవకుడు యెహోవాకు భయపడేవాడని నీకు తెలుసు. అప్పిచ్చినవాడు నా ఇద్దరు పిల్లలను[a] తన కోసం దాసులుగా తీసుకుపోవడానికి వచ్చాడు.”'
  rationale: The revision removes an unsupported temporal addition and avoids making the husband’s Yahweh-fearing disposition more expansive than the source. It also renders the creditor’s purpose more directly while preserving the source’s broad term “children” and retaining the lexical-alternative footnote.
