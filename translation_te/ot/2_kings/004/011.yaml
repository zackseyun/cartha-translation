source:
  edition: WLC
  text: וַ/יְהִ֥י הַ/יּ֖וֹם וַ/יָּ֣בֹא שָׁ֑מָּ/ה וַ/יָּ֥סַר אֶל הָ/עֲלִיָּ֖ה וַ/יִּשְׁכַּב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: te
  text: ఒక రోజు అతడు అక్కడికి వచ్చి, పై అంతస్తులోని గది వైపుకు తిరిగి వెళ్లి, అక్కడ పడుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అక్కడ నిద్రపోయాడు.’ హీబ్రూ క్రియ పడుకోవడాన్ని లేదా నిద్రపోవడాన్ని సూచించవచ్చు; ఈ సందర్భం మరింత నిర్దిష్టమైన అర్థాన్ని తప్పనిసరి చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ఒక రోజు
  rationale: ఈ హీబ్రూ జాతీయం కథనంలోని ఒక సందర్భాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఒక రోజు’ సహజంగా ఉండి కాలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיָּבֹא שָׁמָּה
  choice: అతడు అక్కడికి వచ్చి
  rationale: בוא సాధారణంగా రావడం లేదా ప్రవేశించడం అనే అర్థాన్నిస్తుంది; שָׁמָּה సూచించే ‘అక్కడికి’ అనే దిశార్థాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: וַיָּסַר
  choice: వెళ్లి
  rationale: సందర్భంలో סור ప్రధాన మార్గం నుంచి పక్కకు తిరిగి సిద్ధం చేసిన గదిలోకి వెళ్లడాన్ని సూచిస్తుంది. తెలుగులో ‘మేడగదిలోకి వెళ్లి’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది; ‘పక్కకు తిరిగి’ అనే పదక్షర రూపం ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: אֶל הָעֲלִיָּה
  choice: మేడగదిలోకి
  rationale: עֲלִיָּה పై అంతస్తులోని గది లేదా మేడమీది గదిని సూచిస్తుంది. ‘మేడగది’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి నిర్మాణ సంబంధమైన భావాన్ని కాపాడుతుంది.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: అక్కడ పడుకున్నాడు
  rationale: שׁכב పడుకోవడం, పరుండడం, లేదా సందర్భానుసారం నిద్రించడం అనే అర్థాలను ఇవ్వగలదు. ‘పడుకున్నాడు’ నిద్రపోయాడని తప్పనిసరిగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
