translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస క్రియలను తెలుగు సంయుక్త క్రియారూపాలతో సాఫీగా అనుసంధానించాం; ‘అక్కడ’ అనే పునరుక్తిని మూలానికి అనుగుణంగా నిలిపాం.
