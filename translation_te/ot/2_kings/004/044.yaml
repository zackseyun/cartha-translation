id: 2KI.4.44
reference: 2 Kings 4:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן לִ/פְנֵי/הֶ֛ם וַ/יֹּאכְל֥וּ וַ/יּוֹתִ֖רוּ כִּ/דְבַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: te
  text: అతడు దానిని వారి ముందుంచాడు. వారు తిని, కొంత మిగిల్చారు[a]—యాహ్వే చెప్పిన మాట ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొంత మిగిలింది.”
    reason: హీబ్రూ క్రియ కర్తృవాచ్యంగా ‘వారు మిగిల్చారు’ అనే భావాన్ని ఇస్తున్నా, సందర్భంలోని ఫలితాన్ని తెలుగులో ‘కొంత మిగిలింది’ అని కూడా సహజంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ముందుంచాడు
  rationale: נתן అనే క్రియకు ‘ఇచ్చాడు/ఉంచాడు’ అనే అర్థాలున్నాయి. לִפְנֵיהֶםతో కలిసి భోజనం వడ్డించే సందర్భంలో ‘వారి ముందుంచాడు’ సహజంగా, మూలానికి దగ్గరగా ఉంటుంది. ‘దానిని’ అనేది ముందరి వచనంలోని ఆహారాన్ని సూచిస్తూ సందర్భం నుంచి పూరించబడింది.
- source_word: לִפְנֵיהֶם
  choice: వారి ముందు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘వారి ముందు’ అని అర్థం; భోజనం వడ్డించే సందర్భానికీ ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיֹּאכְלוּ
  choice: వారు తిని
  rationale: אכל క్రియను సరళంగా అనువదిస్తూ, వరుసగా జరిగిన చర్యలను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: וַיּוֹתִרוּ
  choice: కొంత మిగిల్చారు
  rationale: יתר హిఫీల్ రూపం ‘మిగిలేలా చేయడం/మిగిల్చడం’ అనే భావాన్ని ఇస్తుంది. కర్తను అలాగే ఉంచుతూ, భోజనం తర్వాత ఆహారం మిగిలినదనే భావాన్ని తెలియజేస్తుంది; సహజమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: כִּדְבַר
  choice: చెప్పిన మాట ప్రకారం
  rationale: ‘మాట ప్రకారం’ అనే మూల నిర్మాణాన్ని నిలుపుతూ, తెలుగులో ఎవరి మాటో స్పష్టంగా మరియు సహజంగా తెలిపేందుకు ‘చెప్పిన’ చేర్చబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణమైన లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: మిగిలిన ఆహారాన్ని ఎవరి చర్యగా వ్యక్తపరచాలి
  choice: వారు కొంత మిగిల్చారు
  alternative: కొంత మిగిలింది
  rationale: హీబ్రూ క్రియ హిఫీల్ రూపంలో, ‘వారు’ అనే కర్తతో ఉంది; అందువల్ల ప్రధాన పాఠంలో కర్తృవాచ్య భావాన్ని నిలిపాం. ఫలితాన్ని ప్రధానంగా చూపే సహజ తెలుగు రూపాన్ని పాదసూచికలో ఇచ్చాం; అద్భుతం ఎలా సంభవించిందనే అంశంపై అదనపు వ్యాఖ్యానం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, దైవవాక్యంతో వాటి సరిపోలిక, మరియు దైవనామం ప్రత్యేకత నిలుపబడ్డాయి.
