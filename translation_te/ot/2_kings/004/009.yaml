id: 2KI.4.9
reference: 2 Kings 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: te
  text: ఆమె తన భర్తతో, “చూడండి, మన దగ్గరగా క్రమం తప్పకుండా[a] వెళ్తూ ఉండే ఈయన పవిత్రుడైన దేవుని మనిషి అని నాకు తెలుసు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎల్లప్పుడూ.”
    reason: תָּמִיד అనే పదం సందర్భంలో క్రమమైన పునరావృతాన్ని సూచిస్తుంది; దాన్ని మరింత అక్షరార్థంగా ‘ఎల్లప్పుడూ’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אִישָׁהּ
  choice: ఆమె తన భర్తతో … అంది
  rationale: వాక్యారంభంలోని wayyiqtol కథనాన్ని ముందుకు నడిపిస్తుంది; గృహసందర్భంలో אִישָׁהּ అంటే సహజంగా ‘ఆమె భర్త’.
- source_word: הִנֵּה־נָא
  choice: చూడండి
  rationale: శ్రోత దృష్టిని ఆకర్షిస్తూ మాటను మృదువుగా చెప్పే ఈ సంయుక్త ప్రయోగాన్ని ఆధునిక, గౌరవప్రద తెలుగు సంభాషణలో సహజంగా తెలిపింది.
- source_word: יָדַעְתִּי כִּי
  choice: … అని నాకు తెలుసు
  rationale: పునరావృత పరిశీలన వల్ల ఏర్పడిన స్థిరమైన ప్రస్తుత అవగాహనను తెలుగు పూరక వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తను లేదా దేవునిచేత నియమించబడిన వ్యక్తిని సూచించే గుర్తింపు పొందిన హెబ్రీ బిరుదును వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: קָדוֹשׁ
  choice: పవిత్రుడైన
  rationale: వ్యక్తి దేవునికోసం ప్రత్యేకపరచబడినవాడనే భావాన్ని, పురుష వ్యక్తికి సరిపోయే సహజ తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: עֹבֵר עָלֵינוּ
  choice: మన దగ్గరగా … వెళ్తూ ఉండే
  rationale: ప్రయాణ సందర్భంలో వారి నివాసం దగ్గరగా దాటివెళ్లడాన్ని సూచిస్తుంది; ‘మన మీదుగా’ అనే అసహజమైన లేదా తప్పుదారి పట్టించే అక్షరార్థాన్ని నివారిస్తుంది.
- source_word: תָּמִיד
  choice: క్రమం తప్పకుండా
  rationale: ఆగకుండా నిరంతరం జరిగే చర్యకన్నా, అలవాటుగా పునరావృతమయ్యే ప్రయాణాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: אִישׁ אֱלֹהִים అనే బిరుదు అనువాదం
  choice: దేవుని మనిషి
  alternative: దైవభక్తుడు / దేవునికి చెందిన వ్యక్తి
  rationale: ఈ పదబంధం పూర్వ ప్రవక్తల గ్రంథాల్లో ప్రవక్తకు లేదా దేవునిచేత నియమించబడిన వ్యక్తికి వాడే సాహిత్య-దైవశాస్త్ర బిరుదు. ‘దైవభక్తుడు’ అని చెప్పడం భక్తిగుణంపై మాత్రమే దృష్టి పెట్టి బిరుదు బలాన్ని తగ్గిస్తుంది; విస్తరించిన వివరణ మూలంలో లేని భావాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణా శైలి వాడబడింది. భర్తను ఉద్దేశించిన మాటలో ‘చూడండి’ అనే గౌరవ బహువచనం సహజంగా ఉంది. వాక్యక్రమం తెలుగుకు అనుగుణంగా మార్చినా, పవిత్రత, ‘దేవుని మనిషి’ అనే బిరుదు, అలవాటుగా ఆ మార్గంలో వెళ్లడం అనే మూలాంశాలు నిలుపబడ్డాయి.
