  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: te
  text: 'ఇప్పుడు దయచేసి ఆమెను కలవడానికి పరుగెత్తి వెళ్లి, ఆమెతో ఇలా చెప్పు: ‘నీవు క్షేమంగా[a] ఉన్నావా? నీ భర్త క్షేమంగా ఉన్నాడా? బిడ్డ[b] క్షేమంగా ఉన్నాడా?’ అందుకు ఆమె, ‘క్షేమమే’ అంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో హెబ్రీ ‘షాలోమ్’ అనే మాట నాలుగుసార్లు వస్తుంది. దానికి శాంతి, సంపూర్ణత, క్షేమం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది ఒకరి యోగక్షేమాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బాలుడు.’ హెబ్రీ యెలెద్ అనే మాటకు ‘బిడ్డ’ లేదా ‘బాలుడు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: తక్షణ సందర్భాన్ని సూచించే కాలవాచక క్రియావిశేషణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רוּץ נָא
  choice: దయచేసి ... పరుగెత్తి వెళ్లి
  rationale: ఆజ్ఞార్థక బలాన్ని నిలుపుతూ נָא లోని వినయపూర్వక విజ్ఞప్తి లేదా తొందర భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: לִקְרָאתָהּ
  choice: ఆమెను ఎదుర్కొనడానికి
  rationale: ఎవరినైనా కలుసుకోవడానికి వారి వైపు వెళ్లడం అనే לִקְרַאת్ ప్రయోగ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וֶאֱמָר לָהּ
  choice: ఆమెతో ఇలా అను
  rationale: אָמַר అనే సాధారణ ‘చెప్పు/అను’ క్రియకు దగ్గరగా ఉండి, తరువాతి ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: הֲשָׁלוֹם לָךְ
  choice: నీవు క్షేమంగా ఉన్నావా?
  rationale: שָׁלוֹם ఇక్కడ ఆరోగ్యం మాత్రమే కాక మొత్తం క్షేమాన్ని అడుగుతుంది; ఆధునిక తెలుగులో ‘క్షేమంగా’ సహజమైన సమానార్థకం.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: నీ భర్త క్షేమంగా ఉన్నాడా?
  rationale: స్త్రీతో సంబంధాన్ని బట్టి אִישׁ ఇక్కడ ‘భర్త’; హెబ్రీ పునరుక్త ప్రశ్నా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: బిడ్డ క్షేమంగా ఉన్నాడా?
  rationale: יֶלֶד కు ‘బిడ్డ’ లేదా ‘బాలుడు’ అనే భావాలు సాధ్యం. సందర్భంలో తెలిసిన కుమారుణ్ణి సూచిస్తున్నందున ‘బిడ్డ’ సహజం; పుంలింగ క్రియ సందర్భ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: అందుకు ఆమె, ‘క్షేమమే’ అంది
  rationale: ఒక్క మాటగా ఉన్న హెబ్రీ జవాబు సంక్షిప్తతను నిలుపుతూ, ఇక్కడి ‘అంతా బాగుంది/క్షేమమే’ భావాన్ని స్పష్టంగా ఇస్తుంది.
