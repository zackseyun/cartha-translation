id: 2KI.4.40
reference: 2 Kings 4:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽצְק֥וּ לַ/אֲנָשִׁ֖ים לֶ/אֱכ֑וֹל וַ֠/יְהִי כְּ/אָכְלָ֨/ם מֵ/הַ/נָּזִ֜יד וְ/הֵ֣מָּה צָעָ֗קוּ וַ/יֹּֽאמְרוּ֙ מָ֤וֶת בַּ/סִּיר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/לֹ֥א יָכְל֖וּ לֶ/אֱכֹֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: te
  text: అప్పుడు వారు ఆ మనుషులకు తినడానికి వడ్డించారు. అయితే వారు ఆ కూరను[a] తింటుండగా కేకలు వేసి, “దేవుని మనిషీ, కుండలో మరణం ఉంది!” అని అన్నారు. వారు తినలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థం, “కుండలో మరణం ఉంది.” ఈ మాట ఆ కూర ప్రాణాంతకమైనదని లేదా విషపూరితమైనదని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: వడ్డించారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘పోశారు’ అని సూచించినా, వండిన కూరను తినడానికి పంచుతున్న ఈ సందర్భంలో ‘వడ్డించారు’ సహజమైన ఆధునిక తెలుగు; ద్రవరూప ఆహారాన్ని అందించడం అనే భావాన్ని నిలుపుతుంది.
- source_word: לַאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: אֲנָשִׁים ఇక్కడ కూడివున్న పురుషులను సూచిస్తుంది; లింగసూచనను సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: לֶאֱכֹל
  choice: తినడానికి
  rationale: ప్రయోజనార్థక క్రియారూపాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: వారు ఆ కూరలోనిది తింటుండగా
  rationale: సమకాలీనంగా జరుగుతున్న చర్యను తెలియజేస్తూ, נָזִיד అనే ఉడికించిన వంటకానికి సాధారణ ఆధునిక తెలుగు పదమైన ‘కూర’ను ఉపయోగిస్తుంది.
- source_word: צָעָקוּ
  choice: కేకలు వేసి
  rationale: భయంతో కూడిన బిగ్గర ఆకస్మిక అరుపును స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מָוֶת בַּסִּיר
  choice: కుండలో మృత్యువు ఉంది
  rationale: ‘కుండలో మృత్యువు’ అనే హీబ్రూ భాషలోని గాఢమైన రూపకాన్ని ‘విషం’ అని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషీ
  rationale: ఎలీషాకు వాడిన బిరుదును ప్రత్యక్ష సంబోధనకు తగిన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: వారు తినలేకపోయారు
  rationale: మూలంలో కర్మ స్పష్టంగా లేకపోవడాన్ని గౌరవిస్తూ అదనంగా ‘దాన్ని’ చేర్చకుండా సహజ తెలుగులో అనువదిస్తుంది.
theological_decisions:
- issue: ‘కుండలో మృత్యువు’ అనే మాట యొక్క అర్థం
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా నిలుపడం
  alternative: ‘కుండలో విషం ఉంది’ అని అర్థాన్ని నేరుగా చెప్పడం
  rationale: ఈ మాట ప్రాణాంతకమైన లేదా విషపూరితమైన ఆహారాన్ని సూచించే అవకాశం ఉన్నా, మూలంలోని సజీవమైన భాషను మరియు దాని ఉద్దేశపూర్వక తీవ్రతను అనువాదంలో ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘దేవుని మనిషీ’ మరియు ‘కుండలో మృత్యువు’ వంటి మూలపాఠ్యపు గౌరవభరితమైన, సజీవమైన వ్యక్తీకరణలు నిలుపబడ్డాయి.
