  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: te
  text: ఎలీషా ఇంట్లోకి వచ్చినప్పుడు, ఇదిగో, ఆ బాలుడు చనిపోయి తన మంచం మీద పడుకోబెట్టబడి ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చేసరికి
  rationale: వావ్-క్రమక్రియ కథనాన్ని ముందుకు నడిపిస్తుంది. దిశార్థక రూపంతో కలిపి, ఎలీషా ఇంట్లోకి వచ్చినప్పుడు కనిపించిన దృశ్యాన్ని సహజమైన తెలుగు కాలసంబంధ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: הַבָּיְתָה
  choice: ఇంట్లోకి
  rationale: בַּיִת పదానికి జతైన దిశార్థక ה, ఇంటివైపు మాత్రమే కాక సందర్భంలో ఇంటి లోపలికి ప్రవేశాన్ని సూచిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఎలీషా చూసిన దృశ్యంపై ఆకస్మికంగా దృష్టి నిలిపే హీబ్రూ ప్రదర్శనాత్మక అవ్యయ బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: సందర్భంలో ఇది షూనేమీయురాలి కుమారుణ్ణి సూచిస్తుంది. నిర్దిష్టతను తెలుగులో సహజంగా చూపేందుకు ‘ఆ’ వాడబడింది; ‘బాలుడు’ ఆధునిక ప్రామాణిక తెలుగులో తగిన పదం.
- source_word: מֵת
  choice: చనిపోయి
  rationale: మూలంలో బాలుడు మృతస్థితిలో ఉన్నాడని తెలిపే స్థిత్యర్థం ఉంది. తరువాతి నిష్క్రియ స్థితితో సహజంగా అనుసంధానించేందుకు తెలుగులో క్రియావిశేషణ రూపం వాడబడింది; ఇది కేవలం మరణ సంఘటనను కాక కనిపించిన స్థితిని తెలియజేస్తుంది.
- source_word: מֻשְׁכָּב
  choice: పడుకోబెట్టబడి ఉన్నాడు
  rationale: ఈ హోఫల్ భాగధాతురూపం ఎవరో బాలుణ్ణి మంచంపై పడుకోబెట్టిన ఫలితస్థితిని సూచిస్తుంది. ‘పడుకొని ఉన్నాడు’ అనే స్వయంకర్తృక భావాన్ని నివారిస్తూ నిష్క్రియ-ఫలితార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל מִטָּתוֹ
  choice: అతని మంచం మీద
  rationale: సర్వనామ ప్రత్యయంతో కూడిన సరళ స్థానార్థక పదబంధం; ఆధునిక తెలుగులో సహజంగా అనువదించబడింది.
