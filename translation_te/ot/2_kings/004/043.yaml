source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: te
  text: 'అతని సేవకుడు, “దీన్ని వందమంది పురుషుల ముందు ఎలా పెట్టగలను?” అని అడిగాడు[a]. అందుకు అతడు, “ప్రజలకు ఇవ్వు; వారు తినేలా చేయి[b]. ఎందుకంటే యాహ్వే ఇలా చెబుతున్నాడు: ‘వారు తింటారు, కొంత మిగులుతుంది’” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీన్ని వందమంది పురుషులకు ఎలా ఇవ్వగలను?” హీబ్రూలో అక్షరార్థంగా, “వందమంది పురుషుల ముందు దీన్ని ఏమి ఇవ్వాలి/పెట్టాలి?” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “తిని మిగులుస్తారు”; అంటే వారు తిన్న తరువాత ఆహారం కొంత మిగిలి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: అతని సేవకుడు
  rationale: ఈ పదం వ్యక్తిగతంగా లేదా అధికారికంగా సేవచేసే వ్యక్తిని సూచిస్తుంది. సందర్భంలో ఎలీషాకు లోబడి సేవచేసే వ్యక్తికి ‘సేవకుడు’ సహజమైన తెలుగు పదం.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: దీన్ని వందమంది పురుషుల ముందు ఎలా పెట్టగలను?
  rationale: హీబ్రూ వాక్యంలోని ‘ముందు పెట్టడం’ అనే స్పష్టమైన భోజన దృశ్యాన్ని నిలుపుతూ, מָה ద్వారా వ్యక్తమయ్యే సేవకుని సందేహాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: పురుషులు
  rationale: ఇది సంఖ్య తరువాత సమూహార్థంలో వాడిన వ్యాకరణపరంగా పుంలింగ పదం; అందువల్ల మూలంలోని సూచనను ‘పురుషులు’గా నిలిపాం.
- source_word: תֵּן לָעָם
  choice: ప్రజలకు ఇవ్వు
  rationale: עָם సమూహాన్ని సమష్టిగా సూచిస్తుంది. మూలంలో אִישׁ నుండి עָםకు జరిగిన పదమార్పును ‘ప్రజలు’ ప్రతిబింబిస్తుంది.
- source_word: וְיֹאכֵלוּ
  choice: వారు తిననివ్వు
  rationale: ఆజ్ఞ తరువాత వచ్చిన ఈ క్రియకు అనుమతి లేదా ఫలితాన్ని సూచించే భావం ఉంది; ‘తిననివ్వు’ దాని ఆజ్ఞాత్మక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: ఎందుకంటే యెహోవా ఇలా చెబుతున్నాడు
  rationale: ఇది ప్రవక్తల సందేశ సూత్రం. ‘ఇలా చెబుతున్నాడు’ దాని వర్తమాన ప్రకటన బలాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אָכֹל וְהוֹתֵר
  choice: వారు తిని, కొంత మిగులుస్తారు
  rationale: ఈ నిర్మాణం తినడం మరియు మిగిల్చడం అనే ఫలితం నిశ్చయంగా జరుగుతుందని చెబుతుంది. తెలుగు వాక్యానికి అవసరమైన కర్తను స్పష్టపరుస్తూ రెండు చర్యలనూ నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: אָכֹל וְהוֹתֵר లోని ప్రవచన నిశ్చయత
  choice: వారు తిని, కొంత మిగులుస్తారు
  alternative: వారు తిని, మిగిలినది ఉంటుంది
  rationale: మూలంలోని మిగిల్చే క్రియను నిలుపుతూ, ఆహారం అందరికీ సరిపోయి మిగులుతుందనే వాగ్దానాన్ని తెలియజేస్తుంది; అద్భుతం ఎలా జరుగుతుందో అదనంగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ముందు పెట్టడం’ అనే మూల దృశ్యాన్ని, ‘పురుషులు’ నుండి ‘ప్రజలు’కు జరిగే పదమార్పును, ప్రవచనంలోని నిశ్చయతను కాపాడాం.
