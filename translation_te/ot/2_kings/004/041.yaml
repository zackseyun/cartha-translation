id: 2KI.4.41
reference: 2 Kings 4:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ וּ/קְחוּ קֶ֔מַח וַ/יַּשְׁלֵ֖ךְ אֶל הַ/סִּ֑יר וַ/יֹּ֗אמֶר צַ֤ק לָ/עָם֙ וְ/יֹאכֵ֔לוּ וְ/לֹ֥א הָיָ֛ה דָּבָ֥ר רָ֖ע בַּ/סִּֽיר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/041.yaml
  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: te
  text: అప్పుడు అతడు, “కొంత పిండి తీసుకురండి” అన్నాడు. అతడు దాన్ని కుండలో వేసి, “ప్రజలు తినేలా వారికి వడ్డించండి[a]” అన్నాడు. అప్పుడు కుండలో హానికరమైనదేదీ లేకపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రజల కోసం పోయండి.” ఇక్కడ హీబ్రూ క్రియ కుండలోని ఆహారాన్ని పోసి వడ్డించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కుండలో చెడ్డదేదీ లేదు.” అంటే ఆ కూర ఇక హానికరంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: וּקְחוּ
  choice: తీసుకురండి
  rationale: לקח ధాతువు బహువచన ఆజ్ఞారూపం. ఈ సందర్భంలో పిండిని తెప్పించడమే ఉద్దేశం కాబట్టి ‘తీసుకురండి’ సహజంగా ఉంది.
- source_word: קֶמַח
  choice: కొంత పిండి
  rationale: קֶמַח అంటే పిండి లేదా మెత్తగా నూరిన ధాన్యం. పరిమాణం నిర్దిష్టంగా లేకపోవడంతో ‘కొంత పిండి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: అతడు దాన్ని కుండలో వేసి
  rationale: שׁלך యొక్క మౌలిక భావం ‘విసురు/వేయు.’ ఇక్కడ పిండిని వంటకుండలో వేయడాన్ని ‘కుండలో వేసి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַסִּיר
  choice: కుండ
  rationale: సందర్భంలో ఇది వంట చేయడానికి ఉపయోగించిన పాత్ర. ఆధునిక తెలుగులో ‘కుండ’ సరళమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: צַק לָעָם
  choice: వారికి వడ్డించండి
  rationale: יצק క్రియ మౌలికంగా ‘పోయు’ అనే భావం కలిగివున్నా, ఇక్కడ కుండలోని ఆహారాన్ని ప్రజలకు పంచి పెట్టడం ఉద్దేశం. అందువల్ల ‘వడ్డించండి’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְיֹאכֵלוּ
  choice: ప్రజలు తినేలా
  rationale: ఆజ్ఞ తరువాత వచ్చే ఈ క్రియ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘తినేలా’ ఆ సంబంధాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: అప్పుడు కుండలో హానికరమైనదేదీ లేకపోయింది
  rationale: דָבָר רָע అక్షరార్థంగా ‘చెడ్డ విషయం/వస్తువు.’ విషపూరిత కూర సందర్భంలో ఇది నైతిక చెడును కాక హాని కలిగించే దానిని సూచిస్తుంది; అందువల్ల ‘హానికరమైనదేదీ’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘వడ్డించండి’ సందర్భార్థాన్ని ఇస్తూ, హీబ్రూ క్రియలోని ‘పోయు’ భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
