base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: te
  text: అప్పుడు అతడు, “మరి ఆమె కోసం ఏమి చేయాలి[a]?” అని అన్నాడు. గేహజీ, “నిజానికి, ఆమెకు కుమారుడు లేడు[b], ఆమె భర్త వృద్ధుడు” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె కోసం ఏమి చేయవలసి ఉంది?”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ఆమెకు కుమారుడు లేడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అని అడిగాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో తెలుగులో ‘అడిగాడు’ సహజంగా ఉంది; ‘అప్పుడు’ క్రమాన్ని చూపిస్తుంది.
- source_word: וּמֶה
  choice: మరి … ఏమి
  rationale: ప్రశ్నార్థక పదంతో కూడిన సంధానాన్ని ‘మరి’ సహజ సంభాషణాత్మక ప్రవాహంతో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת לָהּ
  choice: ఆమె కోసం ఏమి చేయాలి
  rationale: ల־తో కూడిన క్రియానామం ఆమె పక్షాన చేయవలసిన కార్యాన్ని సూచిస్తుంది. తెలుగు కర్తృవాచక నిర్మాణం సహజంగా ఉండి, కర్తను నిర్దిష్టం చేయకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: גֵּיחֲזִי
  choice: గేహజీ
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: אֲבָל
  choice: నిజానికి
  rationale: ఇక్కడ ఈ అవ్యయం బలమైన వ్యతిరేకతకన్నా పరిస్థితిలోని కీలక వాస్తవాన్ని పరిచయం చేస్తుంది.
- source_word: בֵּן אֵין לָהּ
  choice: ఆమెకు కుమారుడు లేడు
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజమైన దత్తివాచక స్వామ్య నిర్మాణంతో అనువదించాం; בֵּן‌ను సాధారణ ‘సంతానం’గా కాక నిర్దిష్టంగా ‘కుమారుడు’గా ఉంచాం.
- source_word: וְאִישָׁהּ
  choice: ఆమె భర్త
  rationale: ఈ సందర్భంలో אִישׁ ప్రత్యయంతో ఆమె భర్తను సూచిస్తుంది.
- source_word: זָקֵן
  choice: వృద్ధుడు
  rationale: అతని ముదిమి స్థితిని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణ ప్రవాహానికి ‘మరి’, కీలక వాస్తవాన్ని పరిచయం చేయడానికి ‘నిజానికి’ ఎంచుకున్నాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
