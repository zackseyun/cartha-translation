  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: te
  text: అలా ఆమె వెళ్లి కర్మేలు పర్వతం వద్ద ఉన్న దేవుని మనిషి దగ్గరకు వచ్చింది. దేవుని మనిషి ఆమెను దూరం నుండి[a] చూసి, తన సేవకుడైన గేహజీతో, “అదిగో, ఆ షూనేమీయురాలు!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దూరంగా నుండి.” ఆమె ఇంకా కొంత దూరంలో ఉండగానే అతడు ఆమెను చూశాడని హీబ్రూ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: అలా ఆమె వెళ్లి ... వద్దకు వచ్చింది
  rationale: వరుస కథన క్రియలను సహజమైన ఆధునిక తెలుగు ప్రవాహంలో ఉంచుతూ, వెళ్లడం మరియు చేరుకోవడం అనే రెండు చర్యలనూ నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ బిరుదును నేరుగా అనువదిస్తుంది; సందర్భాన్ని బట్టి ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: కర్మెలు కొండ దగ్గర ఉన్న
  rationale: దేవుని మనిషి కర్మెలు కొండ వద్ద ఉన్నాడనే స్థాన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִנֶּגֶד
  choice: దూరం నుంచే
  rationale: ఆమె ఇంకా కొంత దూరంలో ఉండగానే అతడు చూశాడనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది; ‘ఎదురుగా’ అనే సాధ్యమైన స్థలార్థాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: נַעֲרוֹ
  choice: తన సేవకుడైన
  rationale: పదశః ‘అతని యువకుడు’ అయినా, ఇక్కడ గేహజీ పాత్ర వ్యక్తిగత సేవకుడు లేదా పరిచారకుడు కావడం వల్ల ఈ రూపం సహజంగా, సందర్భోచితంగా ఉంటుంది.
- source_word: הִנֵּה
  choice: అదిగో
  rationale: దూరంలో కనిపిస్తున్న వ్యక్తివైపు వెంటనే దృష్టి మళ్లించే సూచనార్థక శక్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: ఆ షూనేమీయురాలు
  rationale: షూనేముకు చెందిన స్త్రీ అనే భౌగోళిక గుర్తింపుతో పాటు, కొంత దూరంలో ఉన్న నిర్దిష్ట వ్యక్తిని చూపించే నిర్దేశక భావాన్ని కాపాడుతుంది.
