  terminology: ‘బాలుడు,’ ‘నోరు,’ ‘కళ్లు,’ ‘అరచేతులు,’ ‘దేహం’ సందర్భానికి తగినవి. ‘దేహం వెచ్చబడింది’ అనేది בָּשָׂר యొక్క శారీరక భావాన్ని సహజ తెలుగులో తగినంతగా తెలియజేస్తుంది. పాదసూచిక అరుదైన గהר క్రియకు ఉన్న న్యాయమైన ప్రత్యామ్నాయాన్ని కాపాడుతోంది.
