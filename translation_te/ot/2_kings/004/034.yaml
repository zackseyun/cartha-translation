id: 2KI.4.34
reference: 2 Kings 4:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֜עַל וַ/יִּשְׁכַּ֣ב עַל הַ/יֶּ֗לֶד וַ/יָּשֶׂם֩ פִּ֨י/ו עַל פִּ֜י/ו וְ/עֵינָ֤י/ו עַל עֵינָי/ו֙ וְ/כַפָּ֣י/ו עַל כפ/ו וַ/יִּגְהַ֖ר עָלָ֑י/ו וַ/יָּ֖חָם בְּשַׂ֥ר הַ/יָּֽלֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: te
  text: అప్పుడు అతడు పైకి వెళ్లి బాలుని మీద పడుకొని, తన నోటిని అతని నోటిమీద, తన కళ్లను అతని కళ్లమీద, తన అరచేతులను అతని అరచేతులమీద ఉంచాడు; అతనిమీద తన శరీరాన్ని చాచుకున్నాడు[a], బాలుని దేహం వెచ్చబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిమీద వంగాడు.” ఇక్కడున్న హెబ్రీ క్రియ అరుదైనది; అది బాలునిమీద వంగడాన్ని లేదా తన శరీరాన్ని చాచుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: అప్పుడు అతడు పైకి వెళ్లి
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లడం’ అనే అర్థం ఉంది. అతడు మేడగదికి వెళ్లాడని సందర్భం సూచించినా, ఆ గది ఈ వచనంలో స్పష్టంగా లేదు; అందువల్ల క్రియ యొక్క సరళ భావాన్ని నిలిపాం.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: బాలుని మీద పడుకొని
  rationale: שׁכב అనేది ‘పడుకోవడం’ అని, עַל అనేది ఇక్కడ శరీరస్పర్శతో ‘మీద’ అని సూచిస్తాయి. చర్యను మృదువుగా మార్చకుండా సహజమైన తెలుగులో చెప్పాం.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: తన నోటిని అతని నోటిమీద ... ఉంచాడు
  rationale: שׂים అంటే ‘పెట్టు/ఉంచు.’ ఇద్దరి శరీర భాగాలు వరుసగా సరిపోల్చబడుతున్నందున ‘తన,’ ‘అతని’ అనే సూచనలను స్పష్టంగా ఉంచాం.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: తన కళ్లను అతని కళ్లమీద
  rationale: ఇది ముందున్న ‘ఉంచాడు’ అనే క్రియపై ఆధారపడిన కొనసాగింపు. మూలంలోని సమాంతర నిర్మాణాన్ని తెలుగులో నిలిపాం.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: తన అరచేతులను అతని అరచేతులమీద
  rationale: כַּף సాధారణంగా చేయి మొత్తాన్ని కాక అరచేతిని సూచిస్తుంది. అందువల్ల మరింత నిర్దిష్టమైన ‘అరచేతులు’ ఎంచుకున్నాం.
- source_word: וַיִּגְהַר עָלָיו
  choice: అతనిమీద తన శరీరాన్ని చాచుకున్నప్పుడు
  rationale: גהר అరుదైన క్రియ; వంగడం లేదా ఒకరిమీద శరీరాన్ని చాచుకోవడం అనే భంగిమను సూచిస్తుంది. ముందున్న శరీర భాగాల అమరికకు అనుగుణంగా ప్రధాన పాఠంలో ‘తన శరీరాన్ని చాచుకున్నప్పుడు’ అని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: బాలుని దేహం వెచ్చబడింది
  rationale: חם ఇక్కడ ‘వెచ్చబడడం’ అని సూచిస్తుంది. בָּשָׂר అక్షరార్థంగా ‘మాంసం’ అయినా, ఈ సందర్భంలో బాలుని శరీరాన్ని సూచిస్తోంది; సహజమైన ఆధునిక తెలుగులో ‘దేహం’ శారీరక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: బాలుడు
  rationale: יֶלֶד అంటే ‘బిడ్డ’ లేదా ‘బాలుడు.’ కథనంలో ఇతడు కుమారుడని స్పష్టంగా ఉన్నందున ‘బాలుడు’ సహజమైన, నిర్దిష్టమైన ఎంపిక.
theological_decisions:
- issue: చనిపోయిన బాలునిపై ఎలీషా చేసిన చర్య స్వభావం
  choice: శారీరక చర్యలను స్పష్టంగా వర్ణించి, వాటి విధానానికి అదనపు వివరణ ఇవ్వకపోవడం
  alternative: దీనిని కృత్రిమ శ్వాసగా పేర్కొనడం లేదా శరీరస్పర్శను మృదువుగా చెప్పడం
  rationale: హెబ్రీ పాఠం ప్రవక్త చేసిన శారీరక చర్యలను వరుసగా వివరిస్తుంది; అయితే బాలుడు ఎలా పునరుద్ధరించబడ్డాడనే ప్రక్రియను వైద్యపరంగా గానీ ఆచారపరంగా గానీ వివరించదు. కాబట్టి అనాచారిక లేదా సిద్ధాంతపరమైన అర్థాన్ని చేర్చకుండా పాఠంలోని స్పష్టతనూ ఉద్వేగాన్నీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘అరచేతులు’ వంటి శరీర సంబంధ పదాల్లో మూలపాఠపు నిర్దిష్టతను, ‘దేహం వెచ్చబడింది’లో సహజత్వాన్ని సమతుల్యం చేశాం.
