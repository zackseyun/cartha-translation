  source_fidelity: మొత్తంగా మూల హీబ్రూ వాక్యక్రమాన్నీ శరీరస్పర్శకు సంబంధించిన స్పష్టమైన భాషనూ నమ్మకంగా అందిస్తుంది. అయితే וַיִּגְהַר (‘అతనిమీద వంగి/తనను చాచుకొని’) స్వతంత్ర వరుస చర్య; దానిని ‘చాచుకున్నప్పుడు’ అని కాలసూచక ఉపవాక్యంగా మార్చడం మూలంలోని ‘మరియు ... అయ్యింది’ అనే క్రమాన్ని కొద్దిగా మార్చుతుంది.
