  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: te
  text: అప్పుడు ఆమె పైకి వెళ్లి, అతణ్ణి దేవుని మనిషి మంచం మీద పడుకోబెట్టి, అతడు లోపల ఉండగా తలుపు మూసి[a], బయటికి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదబంధాన్ని ‘అతని వెనుక తలుపు మూసి’ లేదా ‘అతణ్ణి లోపల ఉంచి తలుపు మూసి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: అప్పుడు ఆమె పైకి వెళ్లి
  rationale: עלה అనే క్రియలోని పైకి వెళ్లడం అనే స్థలగత భావాన్ని నిలుపుతూ, వరుస కథనంలోని waw-consecutive ను సహజమైన తెలుగు కథన శైలిలో ‘అప్పుడు’తో వ్యక్తం చేసింది.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: అతణ్ణి ... పడుకోబెట్టి
  rationale: హిఫీల్ భావంలో ‘అతడు పడుకునేలా చేసింది/పరుండబెట్టింది’ అనే అర్థం ఉంది; సందర్భంలో బాలుణ్ణి మంచంపై ఉంచిన చర్యను సహజంగా తెలిపే రూపం.
- source_word: עַל מִטַּת
  choice: మంచం మీద
  rationale: עַל అంటే ‘మీద’; מִטָּה సాధారణంగా మంచం లేదా పడకను సూచిస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది హీబ్రూ బిరుదుకు ప్రత్యక్ష అనువాదం; ‘దేవుని ప్రవక్త’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా మూలంలోని పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: అతడు లోపల ఉండగా తలుపు మూసి
  rationale: בְּעַד‌తో కూడిన סגר ఇక్కడ అతణ్ణి గదిలో ఉంచి తలుపు మూయడాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి ‘అతని వెనుక తలుపు మూసి’ అనడం బాలుడు నడిచి లోపలికి వెళ్లినట్టు అపార్థం కలిగించవచ్చు; అందువల్ల మూలభావాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: וַתֵּצֵא
  choice: బయటికి వెళ్లింది
  rationale: יצא యొక్క ప్రత్యక్ష స్థలగత అర్థమైన ‘బయటికి వెళ్లడం’ను నిలుపుతుంది.
