translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలి, అయితే ‘తన వస్త్రం నిండా’ వంటి మూలపాఠ్య చిత్రణను నిలుపుకుంది. వృక్షాన్ని ఖచ్చితంగా గుర్తించకుండా మూలంలోని అనిశ్చితి సంరక్షించబడింది.
