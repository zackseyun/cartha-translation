id: 2KI.4.39
reference: 2 Kings 4:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א אֶחָ֣ד אֶל הַ/שָּׂדֶה֮ לְ/לַקֵּ֣ט אֹרֹת֒ וַ/יִּמְצָא֙ גֶּ֣פֶן שָׂדֶ֔ה וַ/יְלַקֵּ֥ט מִמֶּ֛/נּוּ פַּקֻּעֹ֥ת שָׂדֶ֖ה מְלֹ֣א בִגְד֑/וֹ וַ/יָּבֹ֗א וַ/יְפַלַּ֛ח אֶל סִ֥יר הַ/נָּזִ֖יד כִּֽי לֹ֥א יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: te
  text: అప్పుడు వారిలో ఒకడు ఆకుకూరలు[a] ఏరడానికి పొలంలోకి వెళ్లాడు. అక్కడ అతనికి ఒక అడవి తీగ కనిపించింది. దానినుంచి అడవి కాయలను[b] తన వస్త్రం నిండా ఏరుకొని వచ్చి, వాటిని ముక్కలుగా కోసి కూరకుండలో వేశాడు. అవేమిటో వారికి తెలియదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తినదగిన పచ్చని మొక్కలు.’ హీబ్రూ పదం పొలంలో ఏరుకునే ఆహారయోగ్యమైన మొక్కలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పొలపు తీగ’ మరియు ‘పొలపు కాయలు’; అంటే, అడవిలో పెరిగే తీగకు కాసిన కాయలు. ఇవి బహుశా కొలోసింత్ కాయలు కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ఈ చివరి మాటను ‘ఎందుకంటే అవేమిటో వారికి తెలియదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: వారిలో ఒకడు
  rationale: సందర్భంలో ఇది సమూహంలోని ఒక వ్యక్తిని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు సందర్భసూచకమైన ‘వారిలో’ చేర్చబడింది.
- source_word: לְלַקֵּט אֹרֹת
  choice: ఆకుకూరలు ఏరడానికి
  rationale: אֹרֹת పొలంలో సేకరించే తినదగిన పచ్చని మొక్కలు లేదా ఆకుకూరలను విస్తృతంగా సూచిస్తుంది; ‘ఆకుకూరలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: גֶּפֶן שָׂדֶה
  choice: ఒక అడవి తీగ
  rationale: అక్షరార్థంగా ‘పొలపు తీగ’; సాగుచేయని చోట పెరిగే తీగ అనే భావాన్ని ‘అడవి తీగ’ సహజంగా తెలియజేస్తుంది.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: అడవి కాయలు
  rationale: ఇవి బహుశా కొలోసింత్ వంటి అడవి తీగకాయలు; ప్రధాన పాఠ్యంలో అతినిర్దిష్టమైన వృక్షశాస్త్రీయ గుర్తింపును నివారిస్తూ మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: מְלֹא בִגְדוֹ
  choice: తన వస్త్రం నిండా
  rationale: బయటి వస్త్రాన్ని సంచిలా ఉపయోగించి నింపిన పరిమాణాన్ని తెలిపే హీబ్రూ చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: וַיְפַלַּח
  choice: ముక్కలుగా కోసి
  rationale: కాయలను చీల్చడం లేదా ముక్కలుగా కోయడం అనే క్రియార్థాన్ని వంట సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: סִיר הַנָּזִיד
  choice: కూరకుండలో
  rationale: נָזִיד ఉడికిస్తున్న చిక్కని ఆహారం లేదా కూరను సూచిస్తుంది; ‘కూరకుండ’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: כִּי לֹא יָדָעוּ
  choice: అవేమిటో వారికి తెలియదు
  rationale: తెలియని విషయాన్ని తెలుగులో అవసరమైన విధంగా స్పష్టం చేస్తూ, כִּי యొక్క వివరణాత్మక లేదా కారణార్థక సంబంధాన్ని పాదటిప్పణిలో ఉంచుతుంది.
