  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: te
  text: అతడు, “ఈ రోజు నువ్వు ఆయన దగ్గరికి ఎందుకు వెళ్తున్నావు? ఈ రోజు అమావాస్యా కాదు, విశ్రాంతి దినమూ కాదు” అని అడిగాడు. అందుకు ఆమె, “క్షేమమే”[a] అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అంతా బాగానే ఉంది.” హెబ్రీలో “శాంతి/క్షేమం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే ప్రశ్నార్థక పదానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: אתי הלכתי
  choice: నువ్వు ... వెళ్తున్నావు
  rationale: స్త్రీ ఏకవచన సంబోధనతో, వెంటనే జరుగుతున్న ప్రయాణాన్ని సూచించే భావాన్ని సహజ తెలుగులో వర్తమాన ప్రగతిరూపంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלָיו
  choice: ఆయన దగ్గరికి
  rationale: సందర్భంలో సర్వనామం ఎలీషాను సూచిస్తుంది; మూలంలోని సర్వనామ స్వభావాన్ని నిలుపుతూ తెలుగులో గౌరవప్రయోగం వాడబడింది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచక పదానికి స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: అమావాస్యా కాదు, విశ్రాంతి దినమూ కాదు
  rationale: రెండు ఆచార సంబంధ సందర్భాలనూ నిరాకరించే హెబ్రీ నిర్మాణాన్ని సహజ తెలుగు జత నిర్మాణంతో అందిస్తుంది.
- source_word: חֹדֶשׁ
  choice: అమావాస్య
  rationale: ఈ ఆరాధనా-పంచాంగ సందర్భంలో పదం నెలను కాక కొత్త చంద్రుని ఆచరణ దినాన్ని సూచిస్తుంది; తెలుగులో స్థిరమైన పదం 'అమావాస్య'.
- source_word: שַׁבָּת
  choice: విశ్రాంతి దినం
  rationale: ఇశ్రాయేలీయుల పవిత్ర విశ్రాంతి దినాన్ని సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: שָׁלוֹם
  choice: క్షేమమే
  rationale: పదానికి మూలంగా శాంతి, క్షేమం అనే భావాలున్నా, ఇక్కడ సంక్షిప్త ప్రత్యుత్తరంగా 'అంతా బాగానే ఉంది' అనే భరోసా భావం సహజంగా వస్తుంది.
