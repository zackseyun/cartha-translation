  source_fidelity: 'మొదటి వాక్యం హెబ్రీయ మూలాన్ని సరిగ్గా ప్రతిబింబిస్తుంది: ఎలీషా తన సేవకుడైన గేహజీకి ఆజ్ఞ ఇచ్చాడు. అయితే రెండవ వాక్యంలోని ‘అతడు’ తెలుగు సందర్భంలో ఎలీషానా గేహజీనా అనే సందిగ్ధతను కలిగిస్తుంది; మూలంలో ఆ పిలుపును చేసినవాడు గేహజీయే. చివరి ‘అతని ఎదుట’ కూడా సమీపంలోని గేహజీని సూచిస్తున్నట్లు చదవబడవచ్చు, కానీ హెబ్రీయ సర్వనామం ఎలీషాను సూచిస్తుంది.'
