translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. వ్యక్తినామం ‘గేహజీ,’ ప్రాంతసంబంధ స్త్రీలింగ రూపం ‘షూనేమీయురాలు’గా ఇచ్చాం. మూలంలో ఉన్న సంక్షిప్తతను కాపాడుతూ అవసరం లేని వివరణను చేర్చలేదు.
