  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: te
  text: అప్పుడు అతడు తన సేవకుడైన గేహజీతో, “ఈ షూనేమీయురాలిని పిలువు” అన్నాడు. గేహజీ ఆమెను పిలిచాడు; ఆమె ఎలీషా ఎదుట నిలబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: גֵּחֲזִי נַעֲרוֹ
  choice: తన సేవకుడైన గేహజీతో
  rationale: נַעַר పదానికి ‘యువకుడు,’ ‘పరిచారకుడు,’ ‘సేవకుడు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఎలీషాకు గేహజీ చేస్తున్న సేవను సూచిస్తున్నందున ‘సేవకుడు’ సందర్భోచితం.
- source_word: קְרָא
  choice: పిలువు
  rationale: ఇక్కడ קרא ఒకరిని తన సమక్షానికి పిలిపించడాన్ని సూచిస్తుంది. ‘పిలువు’ సాధారణమైన, సహజమైన తెలుగు; ‘రప్పించు’ కంటే మూలంలోని క్రియను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: ఈ షూనేమీయురాలిని
  rationale: ఈ పదబంధం ఆమెను షూనేము ప్రాంతానికి చెందిన స్త్రీగా గుర్తిస్తుంది. తెలుగులో ‘షూనేమీయురాలు’ స్త్రీలింగాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; הַזֹּאתను ‘ఈ’గా అనువదించాం.
- source_word: וַיִּקְרָא לָהּ
  choice: అతడు ఆమెను పిలిచాడు
  rationale: ఆజ్ఞలో వాడిన קרא క్రియనే కార్యనిర్వహణలోనూ పునరావృతం చేసి మూలంలోని పదబంధ సంబంధాన్ని నిలిపాం.
- source_word: וַתַּעֲמֹד לְפָנָיו
  choice: ఆమె అతని ఎదుట నిలబడింది
  rationale: עמדను అదనపు కదలికను చేర్చకుండా ‘నిలబడింది’గా, לְפָנָיוను స్థలార్థకంగా ‘అతని ఎదుట’గా అనువదించాం.
