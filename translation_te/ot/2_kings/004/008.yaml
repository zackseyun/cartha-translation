  text: וַ/יְהִ֨י הַ/יּ֜וֹם וַ/יַּעֲבֹ֧ר אֱלִישָׁ֣ע אֶל שׁוּנֵ֗ם וְ/שָׁם֙ אִשָּׁ֣ה גְדוֹלָ֔ה וַ/תַּחֲזֶק בּ֖/וֹ לֶ/אֱכָל לָ֑חֶם וַֽ/יְהִי֙ מִ/דֵּ֣י עָבְר֔/וֹ יָסֻ֥ר שָׁ֖מָּ/ה לֶ/אֱכָל לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: te
  text: ఒక రోజు ఎలీషా షూనేము గుండా వెళ్లాడు. అక్కడ ప్రముఖురాలైన ఒక స్త్రీ[a] ఉండేది; ఆమె అతనిని భోజనం చేయమని పట్టుబట్టి కోరింది. తరువాత అతను అక్కడి గుండా వెళ్లినప్పుడల్లా, భోజనం చేయడానికి అక్కడికి మళ్లేవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “గొప్ప స్త్రీ”; ఈ మాట ఆమెకు సమాజంలో ఉన్న ప్రాధాన్యాన్ని లేదా ఆర్థిక స్థోమతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “అక్కడికి పక్కకు తిరిగి, రొట్టె తినేవాడు.” ఇక్కడ “రొట్టె తినడం” భోజనం చేయడాన్ని సూచిస్తుంది; “అక్కడికి” అనే మాట ఒక నిర్దిష్ట స్థలాన్ని పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ఒక రోజు
  rationale: హీబ్రూ కథనారంభాన్ని సహజమైన ఆధునిక తెలుగులో కాలసూచకంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: ఎలీషా షూనేము మీదుగా వెళ్తున్నప్పుడు
  rationale: ప్రయాణ సందర్భంలో עבר అనే క్రియకు ఉన్న ‘ఆ ప్రదేశం గుండా/మీదుగా వెళ్లడం’ అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: אִשָּׁה גְדוֹלָה
  choice: పేరుప్రతిష్ఠలున్న ఒక స్త్రీ
  rationale: పదబద్ధంగా ‘గొప్ప స్త్రీ’; సందర్భంలో ఇది శరీరాకారమో నైతిక గొప్పతనమో కాక, సామాజిక ప్రాధాన్యం లేదా ఆర్థిక స్థోమతను సూచించే అవకాశం ఎక్కువ. సంపదకే పరిమితం చేయకుండా సామాజిక స్థానాన్ని వ్యక్తపరుస్తుంది.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: అతన్ని భోజనం చేయమని పట్టుబట్టింది
  rationale: అక్షరార్థంలో బలంగా పట్టుకోవడం/ఒత్తిడి చేయడం అనే నుడికారానికి, ఆతిథ్యాన్ని గట్టిగా కోరిన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: לֶאֱכָל לָחֶם
  choice: భోజనం చేయడానికి
  rationale: లֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఈ సందర్భంలో ఆహారం తీసుకోవడం లేదా భోజనం చేయడం అనే విస్తృత నుడికారార్థం ఉంది.
- source_word: מִדֵּי עָבְרוֹ
  choice: అతను ఆ మార్గంలో వెళ్లినప్పుడల్లా
  rationale: పునరావృత సందర్భాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: יָסֻר שָׁמָּה
  choice: ఆమె ఇంటికి వెళ్లేవాడు
  rationale: ‘అక్కడికి పక్కకు తిరిగేవాడు’ అనే దిశాత్మక భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘ఇంటి’ భావం సందర్భం నుంచి స్పష్టమైనా మూలంలో ప్రత్యక్షంగా లేదు కాబట్టి పాదసూచికలో తెలియజేయబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ఎలీషా, షూనేము అనే పేర్లు సాధారణ తెలుగు బైబిల్ లిప్యంతరీకరణకు అనుగుణంగా ఇవ్వబడ్డాయి. మూలంలోని సామాజిక స్థితి సంబంధమైన అనిశ్చితిని పాదసూచికలో నిలిపి ఉంచాం.
