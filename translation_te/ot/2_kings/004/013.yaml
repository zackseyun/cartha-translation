source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ אֱמָר נָ֣א אֵלֶי/הָ֮ הִנֵּ֣ה חָרַ֣דְתְּ אֵלֵי/נוּ֮ אֶת כָּל הַ/חֲרָדָ֣ה הַ/זֹּאת֒ מֶ֚ה לַ/עֲשׂ֣וֹת לָ֔/ךְ הֲ/יֵ֤שׁ לְ/דַבֶּר לָ/ךְ֙ אֶל הַ/מֶּ֔לֶךְ א֖וֹ אֶל שַׂ֣ר הַ/צָּבָ֑א וַ/תֹּ֕אמֶר בְּ/ת֥וֹךְ עַמִּ֖/י אָנֹכִ֥י יֹשָֽׁבֶת־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: te
  text: 'అప్పుడు అతడు గేహజీతో, “దయచేసి ఆమెతో ఇలా చెప్పు: ‘ఇదిగో, నువ్వు మా కోసం ఇంత శ్రద్ధ వహించావు.[a] నీ కోసం ఏమి చేయవచ్చు? నీ తరఫున రాజుతో గానీ సైన్యాధిపతితో గానీ ఏమైనా మాట్లాడాలా?’[b]” అన్నాడు. అందుకు ఆమె, “నేను నా ప్రజల మధ్య నివసిస్తున్నాను” అంది.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంలో, “నువ్వు మా కోసం ఈ ఆందోళన అంతటితో ఆందోళన పడ్డావు.” ఇక్కడ ఈ నుడికారం ఆమె వారిపట్ల చూపిన ఎంతో శ్రద్ధను, పడిన ప్రయాసను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ పక్షంగా రాజుతో గానీ సైన్యాధిపతితో గానీ చెప్పవలసినదేమైనా ఉందా?”
    reason: lexical_alternative
  - marker: c
    text: “నేను నా ప్రజల మధ్య నివసిస్తున్నాను” అనే సమాధానం, ఆమె తన సమాజంలో స్థిరంగా, భద్రంగా ఉందనీ, రాజు లేదా సైన్యాధిపతి ప్రత్యేక అనుగ్రహం తనకు అవసరం లేదనీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: నువ్వు మా కోసం ఇంత శ్రద్ధ తీసుకున్నావు
  rationale: ఈ ధాతువు, దాని సమానార్థక నామవాచకం అక్షరార్థంగా వణుకు, ఆందోళన లేదా అప్రమత్త శ్రద్ధను సూచిస్తాయి. ఇక్కడ ఆతిథ్య సందర్భంలో ఆమె ఎంతో శ్రద్ధతో పడిన ప్రయాసను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి మాటపై దృష్టి నిలిపే సూచక పదం; ఆధునిక గౌరవప్రద తెలుగులో సహజంగా ఉంది.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: నీ కోసం ఏమి చేయాలి?
  rationale: ఆమె మేలు కోసం ఏ చర్య తీసుకోవచ్చో అడిగే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూలంలోని కార్యనిర్వాహకుడు స్పష్టంగా చెప్పబడకపోయినా తెలుగు ప్రశ్న దానిని నిర్దిష్ట వ్యక్తికి పరిమితం చేయదు.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: నీ తరఫున ... ఏమైనా మాట్లాడాలా?
  rationale: ఇక్కడ לָךְ ఆమె పక్షంగా లేదా ఆమె ప్రయోజనం కోసం అధికారులతో మాట్లాడటాన్ని సూచిస్తుంది. ‘నీ తరఫున’ మధ్యవర్తిత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שַׂר הַצָּבָא
  choice: సైన్యాధిపతి
  rationale: సైన్యంపై అధికారమున్న ముఖ్య అధికారిని సూచించే సంక్షిప్తమైన, ప్రామాణిక తెలుగు పదం.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: నేను నా ప్రజల మధ్య నివసిస్తున్నాను
  rationale: మూలంలోని సరళ ప్రకటనను నిలుపుతుంది. తన సమాజంలో స్థిరంగా, భద్రంగా ఉన్నాననే అంతర్భావాన్ని వ్యాఖ్యానంగా పాఠ్యంలో కలపకుండా ఉంచుతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞను మృదువుగా చేసే వినయసూచక అవ్యయానికి ఆధునిక తెలుగు సమానం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అప్పుడు అతడు గేహజీతో ... అన్నాడు
  rationale: సందర్భంలో ‘అతనితో’ అన్న సర్వనామం గేహజీని సూచిస్తుంది; తెలుగులో వక్త-శ్రోత సంబంధాన్ని వెంటనే స్పష్టపరచడానికి పేరును ఉపయోగించడం సహజం.
