  to: 'అప్పుడు అతడు గేహజీతో, “దయచేసి ఆమెతో ఇలా చెప్పు: ‘ఇదిగో, నువ్వు మా కోసం ఇంత శ్రద్ధ వహించావు.[a] నీ కోసం ఏమి చేయవచ్చు? నీ తరఫున రాజుతో గానీ సైన్యాధిపతితో గానీ ఏమైనా మాట్లాడాలా?’[b]” అన్నాడు. అందుకు ఆమె, “నేను నా ప్రజల మధ్య నివసిస్తున్నాను” అంది.[c]'
