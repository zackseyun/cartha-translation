translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. సంభాషణలో ఏకవచన ‘నువ్వు/నీ’ వాడకం సందర్భానుకూలంగా ఉంచబడింది. మూలంలోని ప్రత్యక్ష సమాధానానికి ఉన్న పరోక్ష సామాజిక భావాన్ని ప్రధాన పాఠ్యంలో విప్పకుండా పాదటిప్పణిలో ఇచ్చాం.
