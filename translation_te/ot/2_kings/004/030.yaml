  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: te
  text: అప్పుడు బాలుని తల్లి, “యాహ్వే జీవిస్తున్నట్టే, మీరు జీవిస్తున్నట్టే, నేను మిమ్మల్ని విడిచిపెట్టను” అని చెప్పింది.[a] కాబట్టి అతడు లేచి ఆమె వెంట వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది హీబ్రూ ప్రమాణ సూత్రం. అక్షరార్థంగా, “యాహ్వే జీవిస్తున్నట్టే, నీ ప్రాణం జీవిస్తున్నట్టే”; అంటే, “యాహ్వే జీవిస్తున్నట్టే, మీరు జీవిస్తున్నట్టే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: బాలుని తల్లి
  rationale: హీబ్రూ నిర్మాణబంధమైన ‘బాలుని తల్లి’ అనే నిర్దిష్ట సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: యాహ్వే జీవిస్తున్నంత నిశ్చయంగా, నీ ప్రాణం జీవిస్తున్నంత నిశ్చయంగా
  rationale: ఇది యాహ్వే జీవాన్ని, సంబోధితుని ప్రాణాన్ని సాక్షిగా ఉంచే హీబ్రూ ప్రమాణ సూత్రం. ‘నిశ్చయంగా’ దాని ప్రమాణబలాన్ని తెలుగులో స్పష్టం చేస్తుంది; ‘నీ ప్రాణం’ నֶפֶשׁ పదరూపాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: నేను నిన్ను విడిచిపెట్టను
  rationale: ప్రమాణ సూత్రం తరువాత אִם ప్రతికూల నిశ్చయార్థాన్ని ఇస్తుంది; దాన్ని షరతుగా కాక సహజమైన తెలుగు నిరాకరణగా వ్యక్తం చేయడం భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיָּקָם
  choice: అతడు లేచి
  rationale: క్రమానుసార కథనంలోని קום క్రియకు సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: ఆమె వెంట వెళ్లాడు
  rationale: ‘ఆమె వెనుక/తరువాత వెళ్లాడు’ అనే మూల చిత్రాన్ని సహజమైన తెలుగులో ‘ఆమె వెంట వెళ్లాడు’గా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రమాణ సూత్రంలో יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ ఆ పేరును బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: חֵי נַפְשְׁךָ లో נֶפֶשׁ భావవ్యక్తీకరణ
  choice: నీ ప్రాణం జీవిస్తున్నంత నిశ్చయంగా
  alternative: నీవు జీవిస్తున్నంత నిశ్చయంగా
  rationale: సహజత్వాన్ని కొంత కాపాడుతూనే మూలంలోని ‘నీ ప్రాణం’ అనే ఉద్దేశపూర్వక పదబంధాన్ని నిలుపుతుంది; దాని అసాధారణ ప్రమాణ రూపాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘నీ ప్రాణం జీవిస్తున్నంత’ అనే మూలానికి సమీపమైన ప్రమాణ రూపం ప్రధాన పాఠంలో ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
