source:
  edition: WLC
  text: וַ/תָּבֹא֙ וַ/תִּפֹּ֣ל עַל רַגְלָ֔י/ו וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תִּשָּׂ֥א אֶת בְּנָ֖/הּ וַ/תֵּצֵֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/037.yaml
  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: te
  text: అప్పుడు ఆమె వచ్చి, అతని పాదాల దగ్గర పడి, నేలవరకు వంగి నమస్కరించింది[a]. తరువాత తన కుమారుణ్ణి ఎత్తుకొని బయటికి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేలమీద సాష్టాంగపడింది.’ హీబ్రూ క్రియ కొన్ని సందర్భాల్లో ‘ఆరాధించింది’ అని కూడా అనువదించబడుతుంది; ఇక్కడ అది ఎలీషా ఎదుట చూపిన గాఢ గౌరవాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: అప్పుడు ఆమె వచ్చి
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: అతని పాదాల దగ్గర పడి
  rationale: ఇక్కడి హీబ్రూ ప్రయోగం ఎలీషా ఎదుట వినయంతో సాగిలపడడాన్ని సూచిస్తుంది; ‘పాదాల దగ్గర’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: నేలవరకు వంగి నమస్కరించింది
  rationale: שׁחה శరీరాన్ని నేలవైపు వంచి నమస్కరించడం లేదా సాష్టాంగపడడం అనే భావాలను కలిగి ఉంది. ఈ సందర్భంలో దైవారాధన అని తేల్చకుండా, గాఢ గౌరవాన్ని వ్యక్తపరిచే శారీరక చర్యను ఈ అనువాదం నిలుపుతుంది.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: తన కుమారుణ్ణి ఎత్తుకొని
  rationale: נשא అంటే ఎత్తడం, మోసుకోవడం, తీసుకోవడం. తిరిగి బ్రతికిన బాలుణ్ణి ఆమె ఎత్తుకున్న స్పష్టమైన చర్యను ఇది సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתֵּצֵא
  choice: బయటికి వెళ్లింది
  rationale: יצא యొక్క ప్రాథమిక భావమైన ‘బయటికి వెళ్లడం’ను సరళంగా, కథనానికి తగిన విధంగా నిలుపుతుంది.
theological_decisions:
- issue: ఎలీషా ఎదుట וַתִּשְׁתַּחוּ అనే క్రియ యొక్క అర్థం
  choice: గాఢ గౌరవంతో నేలవరకు వంగి నమస్కరించిన చర్యగా అనువదించబడింది.
  alternative: ‘సాష్టాంగపడింది’ లేదా కొన్ని సందర్భాల్లో ‘ఆరాధించింది’ అని అనువదించవచ్చు.
  rationale: ఈ హీబ్రూ క్రియ సందర్భానుసారంగా ఆరాధనను గానీ, గౌరవపూర్వక నమస్కారాన్ని గానీ సూచించవచ్చు. ఇక్కడ చర్య ఎలీషా ఎదుట, కుమారుడు తిరిగి పొందిన సందర్భంలో జరుగుతుంది. కాబట్టి ‘నమస్కరించింది’ అనేది దైవారాధన అనే భావాన్ని అనవసరంగా చేర్చకుండా, మూలంలోని గౌరవభావాన్నీ శారీరక చర్యనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కుమారుణ్ణి’ సాధారణ పాఠకులకు సహజంగా ఉండగా, మూలంలోని కుటుంబ సంబంధాన్ని ఖచ్చితంగా నిలుపుతుంది.
