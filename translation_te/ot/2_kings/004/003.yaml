source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכִ֨י שַׁאֲלִי לָ֤/ךְ כֵּלִים֙ מִן הַ/ח֔וּץ מֵ/אֵ֖ת כָּל שכנ/כי כֵּלִ֥ים רֵקִ֖ים אַל תַּמְעִֽיטִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: te
  text: అప్పుడు అతడు, “నీవు బయటికి వెళ్లి, నీ పొరుగువారందరి దగ్గర నీ కోసం ఖాళీ పాత్రలను అప్పుగా అడిగి తెచ్చుకో[a]. కొన్నే తెచ్చుకోవద్దు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాత్రలు అడిగి తెచ్చుకో.” హీబ్రూ క్రియకు సాధారణంగా ‘అడుగు’ అనే అర్థం కూడా ఉంది; అయితే ఇక్కడ పొరుగువారి నుంచి తాత్కాలిక ఉపయోగం కోసం పాత్రలు తీసుకోవడం ఉద్దేశంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తక్కువ చేయవద్దు” లేదా “కొద్దిగా చేయవద్దు.” సందర్భంలో చాలా కొద్ది పాత్రలను మాత్రమే తెచ్చుకోవద్దని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: నీవు బయటికి వెళ్లి
  rationale: స్త్రీ ఏకవచన ఆజ్ఞారూపం; ఆ స్త్రీని కార్యానికి పంపుతున్నందున ఆధునిక తెలుగులో సహజంగా ‘వెళ్లి’ అని అనువదించాం. తరువాతి מִן הַחוּץ భావాన్ని కలిపి ‘బయటికి వెళ్లి’ అని ఇచ్చాం.
- source_word: שַׁאֲלִי
  choice: అప్పుగా అడిగి తెచ్చుకో
  rationale: ఈ క్రియకు సాధారణంగా ‘అడుగు/కోరు’ అనే అర్థం ఉన్నా, ఇక్కడ పొరుగువారి పాత్రలను తాత్కాలికంగా ఉపయోగించేందుకు తీసుకోవడం సందర్భం. ‘అప్పుగా అడిగి తెచ్చుకో’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כֵּלִים
  choice: పాత్రలను
  rationale: כְּלִי అనేది సామాన్లు, పరికరాలు, పాత్రలు వంటి విస్తృతార్థ పదం. ఇక్కడ నూనె పోయడానికి ఉపయోగించే వస్తువులు కాబట్టి, ఏ నిర్దిష్ట రకాన్నీ అనవసరంగా సూచించకుండా ‘పాత్రలు’ అని ఇచ్చాం.
- source_word: לָךְ
  choice: నీ కోసం
  rationale: స్త్రీకి ప్రయోజనం కలిగేలా ఆమె స్వయంగా వాటిని సమకూర్చుకోవాలనే ప్రయోజనార్థక భావాన్ని నిలిపింది.
- source_word: מִן הַחוּץ
  choice: బయటికి వెళ్లి
  rationale: అక్షరార్థంగా ‘బయటినుంచి’; సందర్భంలో తన ఇంటి వెలుపలికి వెళ్లి ఇతరుల వద్ద పాత్రలు అడగాలని సూచిస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం ‘వెళ్లి’తో కలిపాం.
- source_word: מֵאֵת כָּל שכנכי
  choice: నీ పొరుగువారందరి దగ్గర
  rationale: ఆమె చుట్టుపక్కల నివసించే పొరుగువారందరినీ సమష్టిగా సూచించే ప్రత్యక్షమైన, సహజమైన తెలుగు రూపం.
- source_word: כֵּלִים רֵקִים
  choice: ఖాళీ పాత్రలను
  rationale: పాత్రల్లో ఏమీ ఉండకూడదని విశేషణం స్పష్టంగా చెబుతుంది. తెలుగులో నామవాచకాన్ని ఒక్కసారి ఉంచడం సహజమైనప్పటికీ పూర్తి భావం నిలిచింది.
- source_word: אַל תַּמְעִיטִי
  choice: కొన్నే తెచ్చుకోవద్దు
  rationale: מעט హిఫీల్ రూపం సంఖ్యను తక్కువ చేయవద్దనే భావాన్ని ఇస్తుంది. సందర్భంలో చాలా కొద్ది పాత్రలతో పరిమితం కావద్దన్న ఆజ్ఞను ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
