translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆడగాడిద’ మూలంలోని లింగసూచనను నిలుపుతుంది; ‘దాన్ని తోలుతూ ముందుకు సాగు’ ఆజ్ఞలోని అత్యవసరతను తెలియజేస్తుంది.
