source:
  edition: WLC
  text: וַֽ/תַּחֲבֹשׁ֙ הָֽ/אָת֔וֹן וַ/תֹּ֥אמֶר אֶֽל נַעֲרָ֖/הּ נְהַ֣ג וָ/לֵ֑ךְ אַל תַּעֲצָר לִ֣/י לִ/רְכֹּ֔ב כִּ֖י אִם אָמַ֥רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: te
  text: అప్పుడు ఆమె ఆడ గాడిదకు జీను కట్టి, తన సేవకునితో, “దాన్ని తోలుతూ ముందుకు సాగు; నేను నీకు చెప్పితే తప్ప, నా కోసం వేగం తగ్గించకు[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా, “నేను స్వారీ చేయడానికి నా కోసం ఆపవద్దు/అదుపు చేయవద్దు” అని ఉంది. సందర్భంలో భావం: ఆమె స్వారీ చేస్తున్నప్పుడు ఆమె కారణంగా వేగం తగ్గించవద్దు లేదా ఆపవద్దు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: ఆడగాడిదకు జీను కట్టి
  rationale: חבש ఇక్కడ స్వారీకి జంతువును సిద్ధం చేయడం, అంటే జీను కట్టడం. אָתוֹן ప్రత్యేకంగా ఆడగాడిదను సూచిస్తుంది; తెలుగులో దీనిని సహజంగా స్పష్టంగా చెప్పవచ్చు.
- source_word: נַעֲרָהּ
  choice: తన సేవకునితో
  rationale: נַעַר యువకుడు లేదా పరిచారకుడు అనే అర్థాలు కలిగి ఉన్నా, ఈ సందర్భంలో అతని సేవా పాత్ర ప్రధానమైనది; అందువల్ల ‘సేవకుడు’ సహజమైన ఎంపిక.
- source_word: נְהַג וָלֵךְ
  choice: దాన్ని తోలుతూ ముందుకు సాగు
  rationale: נהג జంతువును తోలడం లేదా నడిపించడం; וָלֵךְతో కలసి ఆలస్యం లేకుండా ముందుకు సాగాలనే ఆజ్ఞను వ్యక్తం చేస్తుంది.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: నా కోసం ప్రయాణాన్ని ఆపకు
  rationale: עצר అంటే నిలిపివేయడం, అడ్డుకోవడం లేదా అదుపు చేయడం. לִי לִרְכֹּבతో కూడిన వాక్యానికి ఆమె స్వారీ చేస్తుండగా తన కారణంగా ఆపవద్దనే భావం ఉంది. ప్రధాన పాఠ్యంలో సహజత్వాన్ని కాపాడుతూ, నిర్మాణంలోని అస్పష్టతను పాదటిప్పణిలో చూపించాం.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: నేను నీతో చెబితే తప్ప
  rationale: నిషేధం తరువాత כִּי אִם మినహాయింపును సూచిస్తుంది; తెలుగులో ‘చెబితే తప్ప’ సహజంగా అదే భావాన్ని ఇస్తుంది.
