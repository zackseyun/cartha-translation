source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה אתי חֹבֶ֣קֶת בֵּ֑ן וַ/תֹּ֗אמֶר אַל אֲדֹנִ/י֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אַל תְּכַזֵּ֖ב בְּ/שִׁפְחָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: te
  text: అప్పుడు అతడు, “వచ్చే సంవత్సరం ఇదే నిర్ణీత సమయానికి[a] నువ్వు ఒక కుమారుణ్ణి చేతుల్లో ఎత్తుకొని ఉంటావు” అన్నాడు. అందుకు ఆమె, “వద్దు, అయ్యా, దేవుని మనిషీ! నీ సేవకురాలిని మోసగించవద్దు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం, “జీవమయమైన ఈ సమయం వలె”; సందర్భానుసారం, వచ్చే సంవత్సరం ఇదే సమయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: ఇదే నిర్ణీత సమయానికి
  rationale: מוֹעֵד స్థిరపరచబడిన లేదా నిర్ణయించబడిన కాలాన్ని సూచిస్తుంది. ‘నిర్ణీత సమయం’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּעֵת חַיָּה
  choice: వచ్చే సంవత్సరం
  rationale: ఈ సందర్భంలో ఈ హీబ్రూ నుడికారం తదుపరి సంవత్సరంలోని ఇదే కాలాన్ని సూచిస్తుంది. సహజమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אתי
  choice: నువ్వు
  rationale: స్వతంత్ర సర్వనామం నొక్కిచెప్పే భావాన్ని కలిగి ఉంది. తెలుగు వాక్యంలో ‘నువ్వు’ను స్పష్టంగా ఉంచడం ద్వారా ఆ బలం కొంత నిలుస్తుంది.
- source_word: חֹבֶקֶת
  choice: కౌగిలించుకుంటూ ఉంటావు
  rationale: ఈ కృదంతం చేతుల్లో హత్తుకోవడం లేదా కౌగిలించుకోవడం అనే సజీవ భావాన్ని ఇస్తుంది; కుమారుణ్ణి కలిగి ఉండబోతుందనే వాగ్దానాన్ని చిత్రాత్మకంగా నిలుపుతుంది.
- source_word: בֵּן
  choice: ఒక కుమారుణ్ణి
  rationale: హీబ్రూ పదం సాధారణంగా ‘బిడ్డ’ అని కాక, ప్రత్యేకంగా ‘కుమారుడు’ అని చెబుతుంది.
- source_word: אַל
  choice: వద్దు
  rationale: మొదటి אַל ఇక్కడ నిషేధాజ్ఞ కంటే భావోద్వేగంతో కూడిన నిరాకరణ లేదా వేడుకోలుగా పనిచేస్తుంది. ‘వద్దు’ ఆధునిక తెలుగులో ఆ స్పందనను సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమానీ
  rationale: ఇది ఎలీషాకు గౌరవపూర్వక మానవ సంబోధన; దేవత్వాన్ని సూచించకుండా గౌరవాన్ని నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషీ
  rationale: ప్రవక్తకు వాడే హీబ్రూ బిరుదును నేరుగా, సంప్రదాయబద్ధంగా తెలియజేస్తుంది.
- source_word: תְּכַזֵּב
  choice: అబద్ధపు ఆశ కలిగించవద్దు
  rationale: క్రియకు అబద్ధమాడడం, మోసగించడం, మాటను అసత్యంగా చేయడం అనే పరిధి ఉంది. సందర్భంలో ఆమె నెరవేరని ఆశను రేపవద్దని వేడుకుంటోంది; ఈ రూపం ఆ భావోద్వేగ బలాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּשִׁפְחָתֶךָ
  choice: నీ సేవకురాలికి
  rationale: మూలపదం స్త్రీలింగాన్ని స్పష్టంగా సూచిస్తుంది. ‘సేవకురాలు’ ఆమె వినయపూర్వక స్వీయసూచనను, లింగాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: אֲדֹנִי అనే గౌరవపూర్వక మానవ బిరుదు
  choice: నా యజమానీ
  alternative: ప్రభూ / అయ్యా
  rationale: ఇది దేవునికి కాదు, ఎలీషాకు చేసిన సంబోధన. ‘నా యజమానీ’ సామాజిక గౌరవాన్ని నిలుపుతూ దైవబిరుదుగా అపార్థం అయ్యే అవకాశాన్ని తగ్గిస్తుంది.
- issue: תְּכַזֵּב లోని అబద్ధం/మోసం మరియు నిరాశపరచడం మధ్య భావ ఉద్రిక్తత
  choice: అబద్ధపు ఆశ కలిగించవద్దు
  alternative: నీ సేవకురాలిని మోసగించవద్దు
  rationale: మూల క్రియలో అబద్ధం లేదా మోసం ప్రధానమైనప్పటికీ, ఈ సందర్భంలో స్త్రీ భయం నెరవేరని ఆశపై కేంద్రీకృతమై ఉంది. ఎంపిక చేసిన రూపం రెండింటినీ కలిపి చూపుతుంది; ప్రవక్త ఉద్దేశపూర్వకంగా మోసం చేస్తున్నాడని అనవసరంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రవక్త మాటలోని ధృఢత్వం, స్త్రీ సమాధానంలోని ఆశ్చర్యం మరియు భయం నిలుపబడ్డాయి. స్త్రీలింగమైన ‘సేవకురాలు’ స్పష్టంగా అనువదించబడింది.
