source:
  edition: WLC
  text: וֶ/אֱלִישָׁ֞ע שָׁ֤ב הַ/גִּלְגָּ֨לָ/ה֙ וְ/הָ/רָעָ֣ב בָּ/אָ֔רֶץ וּ/בְנֵי֙ הַ/נְּבִיאִ֔ים יֹשְׁבִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמֶר לְ/נַעֲר֗/וֹ שְׁפֹת֙ הַ/סִּ֣יר הַ/גְּדוֹלָ֔ה וּ/בַשֵּׁ֥ל נָזִ֖יד לִ/בְנֵ֥י הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: te
  text: ఎలీషా గిల్గాలుకు తిరిగి వచ్చాడు. అప్పుడు దేశంలో కరవు ఉంది. ప్రవక్తల కుమారులు[a] అతని ఎదుట కూర్చుని ఉన్నారు. అతడు తన సేవకునితో, “పెద్ద కుండను పొయ్యి మీద పెట్టి, ప్రవక్తల కుమారుల కోసం కూర వండు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రవక్తల శిష్యులు”; ఈ మాట ప్రవక్తల సమాజానికి లేదా వారి బృందానికి చెందినవారిని సూచిస్తుంది.
    reason: మూలంలోని నుడికారానికి సాధ్యమైన సంస్థాగత అర్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: שָׁב
  choice: తిరిగి వచ్చాడు
  rationale: שׁוב్ క్రియ ఇంతకుముందు ఉన్న చోటుకు తిరిగి రావడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, సంక్షిప్తమైన వ్యక్తీకరణ.
- source_word: הַגִּלְגָּלָה
  choice: గిల్గాలుకు
  rationale: స్థలపేరుకు జతైన దిశాసూచక ה గిల్గాలు వైపు ప్రయాణాన్ని తెలియజేస్తుంది; తెలుగులో ‘-కు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: అప్పుడు దేశంలో కరవు ఉంది
  rationale: క్రియలేని ఈ ఉపవాక్యం కథా నేపథ్యాన్ని ఇస్తుంది. ‘అప్పుడు’ సందర్భ సంబంధాన్ని సహజంగా చూపుతుంది; ‘కరవు ఉంది’ మూలంలోని స్థితిని నిలుపుతుంది.
- source_word: בְנֵי הַנְּבִיאִים
  choice: ప్రవక్తల కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ నుడికారాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపి, అది ప్రవక్తల శిష్యసమాజాన్ని సూచించవచ్చని పాదసూచికలో వివరిస్తుంది.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: అతని ఎదుట కూర్చుని ఉన్నారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న దృశ్యాన్ని సూచిస్తుంది; ‘ఎదుట’ వారి గురు-శిష్య సమక్ష సంబంధాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: לְנַעֲרוֹ
  choice: తన సేవకునితో
  rationale: נַעַר యువకుడు, పరిచారకుడు లేదా సేవకుడు కావచ్చు. ఇక్కడ అప్పగించిన పని సందర్భంలో ‘సేవకుడు’ సరిపోతుంది.
- source_word: שְׁפֹת
  choice: పొయ్యి మీద పెట్టి
  rationale: ఈ సందర్భంలో కుండను వంట కోసం నిప్పుమీద అమర్చడం భావం. తెలుగులో ‘పొయ్యి మీద పెట్టి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַסִּיר הַגְּדוֹלָה
  choice: పెద్ద కుండను
  rationale: סִיר వంట కుండను సూచిస్తుంది; ‘పెద్ద కుండ’ సాధారణ ఆధునిక తెలుగు.
- source_word: וּבַשֵּׁל
  choice: వండు
  rationale: ఈ క్రియ ఉడికించడం లేదా వండడం అనే అర్థాన్ని ఇస్తుంది. ‘కూర వండు’ తెలుగులో సహజమైన వంటప్రయోగం.
- source_word: נָזִיד
  choice: కూర
  rationale: נָזִיד ఉడికించిన ద్రవసహిత ఆహారం లేదా stewను సూచిస్తుంది. ‘కూర’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే సమీప తెలుగు పదం; ‘పులుసు’ కంటే వంటకం స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: בְנֵי הַנְּבִיאִים అనే నుడికారపు అనువాదం
  choice: ప్రవక్తల కుమారులు
  alternative: ప్రవక్తల శిష్యులు; ప్రవక్తల సమాజానికి చెందినవారు
  rationale: మూలంలోని కుటుంబసంబంధ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. వీరు తప్పనిసరిగా ప్రవక్తల జీవసంబంధ కుమారులని నిర్ధారించకుండా, శిష్యులు లేదా ప్రవక్తల సమాజ సభ్యులు అనే సంస్థాగత భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో స్పష్టం చేసింది. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తు ‘గిల్గాలు’ తరువాత ఉన్నప్పటికీ, పాదసూచిక విషయం בְנֵי הַנְּבִיאִים గురించినదైనందున తెలుగులో గుర్తును ‘ప్రవక్తల కుమారులు’ తరువాత ఉంచింది.
