source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לְ/גֵיחֲזִ֜י חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ/קַ֨ח מִשְׁעַנְתִּ֣/י בְ/יָדְ/ךָ֮ וָ/לֵךְ֒ כִּֽי תִמְצָ֥א אִישׁ֙ לֹ֣א תְבָרְכֶ֔/נּוּ וְ/כִֽי יְבָרֶכְ/ךָ֥ אִ֖ישׁ לֹ֣א תַעֲנֶ/נּ֑וּ וְ/שַׂמְתָּ֥ מִשְׁעַנְתִּ֖/י עַל פְּנֵ֥י הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: te
  text: 'అప్పుడు అతడు గేహజీతో ఇలా అన్నాడు: “నీ వస్త్రాన్ని నడుముకు బిగించుకొని[a], నా చేతికర్రను నీ చేతిలో పట్టుకొని వెళ్లు. దారిలో ఎవరైనా ఎదురైతే అతనికి అభివాదం చేయవద్దు; ఎవరైనా నీకు అభివాదం చేస్తే అతనికి జవాబు ఇవ్వవద్దు.[b] నా చేతికర్రను ఆ బాలుని ముఖం మీద ఉంచు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థం, “నీ నడుమును కట్టుకో.” త్వరగా చర్యకు సిద్ధపడడాన్ని సూచించే నుడికారం ఇది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతన్ని ఆశీర్వదించవద్దు; ఎవరైనా నిన్ను ఆశీర్వదిస్తే.” ఇక్కడ ఈ క్రియ దారిలో పరస్పరం అభివాదం చేసుకోవడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: నీ వస్త్రాన్ని నడుముకు బిగించుకొని
  rationale: అక్షరార్థంగా ‘నీ నడుమును కట్టుకో’ అనే ఈ నుడికారం, పొడవైన వస్త్రాన్ని ప్రయాణానికి లేదా త్వరిత చర్యకు వీలుగా నడుముకు బిగించుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి చర్య స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: מִשְׁעַנְתִּי
  choice: నా చేతికర్రను
  rationale: ఈ నామవాచకం ఆధారంగా ఉపయోగించే కర్రను సూచిస్తుంది. కథన సందర్భంలో ‘చేతికర్ర’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וָלֵךְ
  choice: వెళ్లు
  rationale: సాధారణ గమన ఆజ్ఞ. ముందు ఆజ్ఞలతో కలిపి తెలుగు వాక్యంలో సహజమైన క్రమాన్ని నిలుపుతుంది.
- source_word: כִּי תִמְצָא אִישׁ
  choice: దారిలో ఎవరైనా ఎదురైతే
  rationale: אִישׁ రూపపరంగా ‘మనిషి/పురుషుడు’ అయినప్పటికీ, ఇక్కడ దారిలో ఎదురయ్యే ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది. సందర్భాన్ని స్పష్టం చేయడానికి ‘దారిలో’ చేర్చబడింది.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: అతనికి అభివాదం చేయవద్దు / ఎవరైనా నీకు అభివాదం చేస్తే
  rationale: ברך ప్రాథమికంగా ‘ఆశీర్వదించు’ అని అర్థమివ్వగలదు; అయితే దారిలో కలిసే సందర్భంలో పరస్పర పలకరింపును సూచించడం సహజం. ‘అభివాదం’ ఆ సామాజిక భావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: לֹא תַעֲנֶנּוּ
  choice: అతనికి జవాబు ఇవ్వవద్దు
  rationale: ענה ఇక్కడ పలకరింపుకు జవాబివ్వడం లేదా స్పందించడం అనే అర్థంలో ఉంది. ఆజ్ఞలోని క్లుప్తత, అత్యవసరత నిలుపబడింది.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  choice: నా చేతికర్రను ఆ బాలుని ముఖం మీద ఉంచు
  rationale: שׂים అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే ప్రత్యక్ష అర్థం ఉంది; עַל־פְּנֵי లోని ‘ముఖం మీద’ భావం సాధారణీకరించకుండా నిలుపబడింది.
- source_word: הַנָּעַר
  choice: ఆ బాలుడు
  rationale: נַעַר బాలుడు, యువకుడు లేదా సేవకుడు అని అర్థమివ్వగలదు. ఈ సందర్భంలో షూనేమీయురాలి కుమారుణ్ణి సూచిస్తున్నందున ‘బాలుడు’ సముచితం; నిర్దిష్ట సూచనను తెలుగులో ‘ఆ’ తెలియజేస్తుంది.
theological_decisions:
- issue: గేహజీ దారిలో పలకరింపులను మానుకోవాలనే ఆజ్ఞలో ברך అర్థం
  choice: అభివాదం చేయు
  alternative: ఆశీర్వదించు
  rationale: ప్రయాణంలో ఒక వ్యక్తిని కలుసుకోవడం, అతడు తిరిగి పలకరించడం అనే సమాంతర నిర్మాణం సామాజిక అభివాదాన్ని సూచిస్తుంది. అయినప్పటికీ మూలక్రియలోని ‘ఆశీర్వదించు’ అర్థసాధ్యతను పాదసూచికలో భద్రపరచాం; ఆజ్ఞకు అదనపు సిద్ధాంతార్థం మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ఆజ్ఞల క్లుప్తతను, అత్యవసర గమనాన్ని నిలుపుతూ, పాత నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థవంతంగా విప్పి చెప్పి అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం. ‘ఎవరైనా’ ద్వారా אִישׁ యొక్క సాధారణ వ్యక్తి భావం సహజంగానే స్పష్టమవుతున్నందున ప్రత్యేక పాదసూచిక అవసరం లేదు.
