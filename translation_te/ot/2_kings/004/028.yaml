translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణను వాడాం. ఎలీషాకు గౌరవసూచకంగా ‘మిమ్మల్ని’ అని ఇచ్చి, ‘నా ప్రభూ’ అనే సంబోధనను నిలిపాం. అలంకారప్రశ్నల తీవ్రతను, స్త్రీ వేదనలోని అపనమ్మకం మరియు నెరవేరని ఆశ మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
