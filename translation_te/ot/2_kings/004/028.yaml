  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: te
  text: 'ఆమె ఇలా అంది: “నా ప్రభువా, నేను మీ దగ్గర కుమారుడిని అడిగానా? ‘నన్ను మభ్యపెట్టవద్దు[a]’ అని నేను చెప్పలేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను మోసగించవద్దు”; సందర్భార్థంగా, “నాకు లేనిపోని ఆశ కలిగించవద్దు.” హీబ్రూ క్రియ ఒకరిని తప్పుదారి పట్టించడం లేదా చివరకు వ్యర్థమయ్యే ఆశ కలిగించడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ఆమె ఇలా అంది
  rationale: కథనంలోని వావ్-కన్సెక్యూటివ్‌ను తెలుగులో విడిగా ‘మరియు’ అని చూపకుండా, మాటను సహజంగా పరిచయం చేసే ‘ఇలా అంది’గా ఇచ్చాం.
- source_word: הֲשָׁאַלְתִּי בֵן
  choice: నాకు కుమారుడు కావాలని నేను మిమ్మల్ని అడిగానా?
  rationale: ప్రశ్నార్థక రూపంలోని ఈ వాక్యం ఆమె ముందుగా కుమారుణ్ణి కోరలేదని గుర్తుచేసే అలంకారప్రశ్న. בֵן యొక్క నిర్దిష్ట అర్థమైన ‘కుమారుడు’ను నిలిపాం.
- source_word: מֵאֵת אֲדֹנִי
  choice: నా ప్రభూ … మిమ్మల్ని
  rationale: అక్షరార్థంగా ‘నా ప్రభువు దగ్గరనుంచి’ అనే భావం ఉన్నా, ఎలీషాను గౌరవంగా నేరుగా సంబోధిస్తున్న సందర్భాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేశాం. ఇది దేవునికి వాడిన బిరుదు కాదు.
- source_word: הֲלֹא אָמַרְתִּי
  choice: అని నేను చెప్పలేదా?
  rationale: ముందు తాను పలికిన అభ్యంతరాన్ని గుర్తుచేసే రెండవ అలంకారప్రశ్నను మూలంలోని ప్రతికూల ప్రశ్నారూపంలోనే ఉంచాం.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: నన్ను మభ్యపెట్టవద్దు
  rationale: שלה యొక్క హిఫీల్ రూపం ఇక్కడ తప్పుదారి పట్టించడం లేదా నెరవేరని ఆశ కలిగించడం అనే భావాన్ని ఇస్తుంది. ‘మభ్యపెట్టవద్దు’ ఈ రెండు ఛాయలనూ అతిగా వివరించకుండా నిలుపుతుంది.
