  text: וַ/תֹּ֕אמֶר הֲ/שָׁאַ֥לְתִּי בֵ֖ן מֵ/אֵ֣ת אֲדֹנִ֑/י הֲ/לֹ֣א אָמַ֔רְתִּי לֹ֥א תַשְׁלֶ֖ה אֹתִֽ/י׃
