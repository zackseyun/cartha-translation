  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: te
  text: గోడలు కట్టే పనివారికి[a], రాళ్లు చెక్కేవారికి, యాహ్వే మందిరంలోని దెబ్బతిన్న భాగాలను బాగుచేయడానికి[c] కలపను, రాతిగనిలో తవ్విన రాళ్లను[b] కొనడానికి, అలాగే మందిరాన్ని బాగుచేయడానికి అయ్యే ఖర్చులన్నిటికీ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తాపీ పనివారికి’ లేదా ‘నిర్మాణ పనివారికి.’ ఈ హీబ్రూ పదం గోడలు కట్టే లేదా గోడల పనిలో నిమగ్నమైన పనివారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చెక్కిన రాళ్లను’ లేదా ‘కోసి సిద్ధం చేసిన రాళ్లను.’
    reason: lexical_alternative
  - marker: c
    text: పదశః ‘యాహ్వే ఇంటి పగులు/దెబ్బను బలపరచడానికి.’ ఇక్కడ ‘ఇల్లు’ అంటే మందిరం.
    reason: lexical_alternative
  - marker: d
    text: పదశః ‘మందిరం మీద బయటికి వెళ్లేదంతటికీ’; అంటే దాని మరమ్మతుల కోసం అయ్యే అన్ని ఖర్చులకు.
    reason: idiom_clarification
lexical_decisions:
- source_word: גֹּדְרִים
  choice: గోడలు కట్టి మరమ్మతు చేసేవారు
  rationale: גדר అనే క్రియ గోడ కట్టడం లేదా గోడలోని పగుళ్లను పూడ్చడం అనే భావాన్ని ఇస్తుంది. ఆలయ మరమ్మతుల సందర్భంలో ఈ విస్తృతమైన తెలుగు పదబంధం కేవలం ‘తాపీ పనివారు’ అన్నదానికంటే మూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: రాళ్లు చెక్కేవారు
  rationale: రాళ్లను కోసి, చెక్కి నిర్మాణానికి సిద్ధం చేసే పనివారిని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לִקְנוֹת עֵצִים
  choice: కలపను కొనడానికి
  rationale: నిర్మాణ సందర్భంలో עֵצִים సాధారణ కట్టెలను కాక నిర్మాణానికి పనికివచ్చే కలపను సూచిస్తుంది.
- source_word: אַבְנֵי מַחְצֵב
  choice: గనిలో తవ్వి తీసిన రాళ్లు
  rationale: מַחְצֵב రాతిగని లేదా అక్కడి నుంచి తవ్వి తీసిన రాయిని సూచిస్తుంది; ఈ రూపం మూలార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: దెబ్బతిన్న భాగాలను బాగుచేయడానికి
  rationale: పదశః ‘పగులు/దెబ్బను బలపరచడం’ అయినా, ఇక్కడ నిర్మాణంలో ఏర్పడిన దెబ్బతిన్న భాగాలను మరమ్మతు చేయడమే సందర్భార్థం. సహజ తెలుగులో భావాన్ని ఖచ్చితంగా తెలియజేసింది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: పదశః ‘యాహ్వే ఇల్లు’; సందర్భంలో ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టమైనది, ‘యాహ్వే’ దైవనామాన్ని పేరుగానే నిలుపుతుంది.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: మందిరాన్ని బాగుచేయడానికి అయ్యే ఖర్చులన్నిటికీ
  rationale: ‘మందిరం మీద బయటికి వెళ్లేదంతా’ అనే హీబ్రూ వ్యయం-సంబంధమైన నుడికారాన్ని సహజ తెలుగులో అర్థవంతంగా వ్యక్తపరుస్తుంది.
- source_word: לְחָזְקָה
  choice: దాన్ని బాగుచేయడానికి
  rationale: חזק ప్రాథమికంగా బలపరచడాన్ని సూచించినా, ఈ నిర్మాణ సందర్భంలో మరమ్మతు చేసి దృఢపరచడం అనే ప్రయోజనం ఉంది; ‘బాగుచేయడానికి’ సహజమైన సందర్భానువాదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించింది; ఏ ప్రత్యేక సంఘ సంప్రదాయాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. వాక్యం ముందున్న సందర్భంతో అనుసంధానమై ఉన్నప్పటికీ, తెలుగులో సంపూర్ణంగా చదవబడేందుకు ‘ఆ డబ్బు ఉపయోగించబడింది’ అని పూర్వసందర్భంలోని భావాన్ని స్పష్టంగా పునరుద్ధరించాం. మూలంలోని ‘బలపరచడం’–‘మరమ్మతు చేయడం’ భావసంబంధాన్ని ప్రధాన పాఠ్యం మరియు పాదటిప్పణిలో నిలిపాం.
