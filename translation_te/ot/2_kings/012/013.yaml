revisions:
- from: గోడలు కట్టి మరమ్మతు చేసేవారికి[a], రాళ్లు చెక్కేవారికి, యాహ్వే మందిరంలో దెబ్బతిన్న భాగాలను బాగుచేయడానికి[c] కలపను, గనిలో తవ్వి తీసిన రాళ్లను[b] కొనడానికి, అలాగే మందిరాన్ని బాగుచేయడానికి అయ్యే ఖర్చులన్నిటికీ[d] ఆ డబ్బు ఉపయోగించబడింది.
  to: గోడలు కట్టే పనివారికి[a], రాళ్లు చెక్కేవారికి, యాహ్వే మందిరంలోని దెబ్బతిన్న భాగాలను బాగుచేయడానికి[c] కలపను, రాతిగనిలో తవ్విన రాళ్లను[b] కొనడానికి, అలాగే మందిరాన్ని బాగుచేయడానికి అయ్యే ఖర్చులన్నిటికీ[d].
  rationale: మూలంలో లేని “ఆ డబ్బు ఉపయోగించబడింది” అనే వాక్యభాగాన్ని తొలగించాం. అలాగే గֹּדְרִיםకు సాధ్యమైన విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా, మరమ్మతు-సంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం. మిగిలిన పదక్రమం కొనుగోలు చేయబడిన సామగ్రి మందిర మరమ్మతు కోసం అన్న హీబ్రూ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
