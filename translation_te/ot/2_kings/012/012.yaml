id: 2KI.12.12
reference: 2 Kings 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: te
  text: వారు తూచిన వెండిని[a] యాహ్వే మందిరం పనికి నియమించబడిన పనివారి చేతికి[b] అప్పగించారు. వారు దానిని యాహ్వే మందిరం కోసం పని చేస్తున్న వడ్రంగులకు, నిర్మాణకారులకు చెల్లించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొలిచిన వెండి”; లేదా, “లెక్కించిన సొమ్ము.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “చేతిలోకి.” అంటే, వారి బాధ్యతకు అప్పగించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: తూచి సిద్ధం చేసిన వెండి
  rationale: מְתֻכָּן పరిమాణాన్ని నిర్ధారించి సిద్ధం చేసినదనే భావాన్ని ఇస్తుంది; ఆలయ మరమ్మతుల నిధుల సందర్భంలో తూచిన వెండి అనే నిర్దిష్ట భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל יַד
  choice: చేతికి అప్పగించారు
  rationale: అక్షరార్థంగా ‘చేతిమీద/చేతికి’ అనే హీబ్రూ నుడికారం బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది; తెలుగు సహజత్వంతో పాటు మూలంలోని ‘చేతి’ రూపకాన్ని నిలుపుతుంది.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: పనివారు
  rationale: పని నిర్వహిస్తున్న వ్యక్తులను సూచించే సరళమైన, ఆధునిక తెలుగు పదం.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: యెహోవా మందిరపు పనిమీద నియమించబడిన
  rationale: నియమించబడిన లేదా పర్యవేక్షణ బాధ్యత పొందినవారనే నిష్క్రియ భాగధాతు భావాన్ని, సందర్భంలోని బాధ్యతను అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: וַיּוֹצִיאֻהוּ
  choice: దానిని ... చెల్లించారు
  rationale: అక్షరార్థం ‘దానిని బయటకు తీసుకొచ్చారు’; ఆర్థిక సందర్భంలో నిధులను పంపిణీ చేయడం లేదా చెల్లించడం అనే ప్రయోగార్థాన్ని ‘చెల్లించారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: వడ్రంగులకు
  rationale: చెక్కతో పనిచేసే నిపుణులను తెలుగులో సహజంగా, నిర్దిష్టంగా సూచిస్తుంది.
- source_word: וְלַבֹּנִים
  choice: నిర్మాణకారులకు
  rationale: בֹּנִים సాధారణంగా కట్టేవారు లేదా నిర్మాణకారులు; మూలంలో లేని ‘తాపీ పనివారు’ వంటి సంకుచిత అర్థాన్ని చేర్చదు.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: యెహోవా మందిరంపై పనిచేస్తున్న
  rationale: మందిరానికి సంబంధించిన నిర్మాణ లేదా మరమ్మతు పని చేస్తున్నారనే భావాన్ని సహజంగా ఇస్తుంది; ‘మరమ్మతు’ అని మూలాన్ని మించి నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యం పొందిన లిప్యంతరీకరణను వాడాం; ఉచ్చారణ పునర్నిర్మాణాన్ని ప్రతిబింబించే ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పరిపాలనా బాధ్యతను ‘పనిమీద నియమించబడిన’ అని, ఆర్థిక పంపిణీని ‘చెల్లించారు’ అని సందర్భానుసారంగా తెలిపాం; హీబ్రూ నుడికారానికి గుర్తుగా ‘చేతికి’ నిలిపాం.
