translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, పేర్ల తరువాత వచ్చే ‘అతని సేవకులు’ అనే వివరణ ఎవరిని సూచిస్తుందో డాష్‌లతో స్పష్టం చేశాం; మూలంలోని పదార్థ సంబంధ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
