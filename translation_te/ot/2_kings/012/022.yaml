source:
  edition: WLC
  text: וְ/יוֹזָבָ֣ד בֶּן שִׁ֠מְעָת וִ/יהוֹזָבָ֨ד בֶּן שֹׁמֵ֤ר עֲבָדָי/ו֙ הִכֻּ֣/הוּ וַ/יָּמֹ֔ת וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: te
  text: అతని సేవకులైన షిమ్యాతు కుమారుడు యోజాబాదు, షోమేరు కుమారుడు యెహోజాబాదు అతన్ని కొట్టారు; అతడు చనిపోయాడు. వారు అతన్ని దావీదు నగరంలో అతని పితరులతోపాటు పాతిపెట్టారు. అతని స్థానంలో అతని కుమారుడు అమజ్యా రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: షిమాతు కుమారుడు యోజాబాదు
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చి, వ్యక్తిపేర్లను లిప్యంతరీకరించాం.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: షోమేరు కుమారుడు యెహోజాబాదు
  rationale: వ్యక్తిపేర్లను అనువదించకుండా తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עֶבֶד అనే పదం సేవకులు, పరిచారకులు లేదా రాజోద్యోగులను సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన సాధారణ అర్థమైన ‘సేవకులు’ను ఉంచి, సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הִכֻּהוּ וַיָּמֹת
  choice: అతన్ని కొట్టారు; అతడు చనిపోయాడు
  rationale: נכה యొక్క ‘కొట్టు’ భావాన్ని, ఆ తరువాతి ‘అతడు చనిపోయాడు’ అనే ప్రత్యేక కథన దశను కలిపివేయకుండా నిలిపాం.
- source_word: עִם אֲבֹתָיו
  choice: అతని పితరులతోపాటు
  rationale: రాజవంశపు పూర్వీకులతో సమాధి చేయబడటాన్ని సూచించే హీబ్రూ నుడికారంలోని వంశపారంపర్య ప్రతిధ్వనిని ‘పితరులు’ నిలుపుతుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: చారిత్రక గ్రంథాల్లో స్థిరంగా కనిపించే స్థలనామాన్ని స్పష్టమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: అతని స్థానంలో అతని కుమారుడు అమజ్యా రాజయ్యాడు
  rationale: రాజ్య వారసత్వ సందర్భంలో מלך కు ఉన్న ఆరంభార్థాన్ని సహజమైన తెలుగులో ‘రాజయ్యాడు’గా వ్యక్తం చేశాం.
