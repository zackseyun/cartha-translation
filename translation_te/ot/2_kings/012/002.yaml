  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: te
  text: యెహూ పరిపాలనలో ఏడవ సంవత్సరంలో యెహోయాషు రాజయ్యాడు; అతడు యెరూషలేములో నలభై సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు సిబ్యా; ఆమె బెయేర్షెబాకు చెందినది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: యెహూ పాలనలో ఏడవ సంవత్సరంలో
  rationale: ఇది రాజుల పాలన ఆధారంగా కాలాన్ని సూచించే ప్రామాణిక హీబ్రూ సూత్రం. ‘పాలనలో’ అనే పదం తెలుగులో కాలసూచనను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: యెహోయాషు రాజయ్యాడు
  rationale: ఇక్కడ מָלַךְ రాజ్యారంభాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ అనే అనువాదం అతడు ఆ సంవత్సరంలో సింహాసనం అధిష్ఠించిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: అతడు ... నలభై సంవత్సరాలు పరిపాలించాడు
  rationale: ఇక్కడ అదే క్రియ పాలన కొనసాగిన వ్యవధిని సూచిస్తుంది; అందువల్ల ‘పరిపాలించాడు’ సరైన, సహజమైన తెలుగు రూపం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక בְּ ఉపసర్గను తెలుగు ‘లో’తో నేరుగా వ్యక్తం చేసింది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ సమాచారాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించింది.
- source_word: צִבְיָה
  choice: జిబ్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: מִבְּאֵר שָׁבַע
  choice: బెయేరు-షెబాకు చెందినది
  rationale: מִן ఇక్కడ ఆ స్త్రీ స్వస్థలాన్ని సూచిస్తుంది. ‘చెందినది’ అనే రూపం తెలుగులో వ్యక్తి మూలస్థలాన్ని సహజంగా తెలియజేస్తుంది.
