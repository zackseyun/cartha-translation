  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: te
  text: అయితే, యాహ్వే మందిరానికి తీసుకొచ్చిన డబ్బుతో ఆ మందిరం కోసం వెండి గిన్నెలను[a], దీపపు వత్తులను కత్తిరించే పనిముట్లను[b], ప్రోక్షణ పాత్రలను[c], బూరలను, బంగారంతో చేసిన ఏ పాత్రనైనా వెండితో చేసిన ఏ పాత్రనైనా తయారు చేయబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెండి పాత్రలను.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం బహుశా దీపాలను సంరక్షించేటప్పుడు వత్తులను కత్తిరించడానికి లేదా సరిచేయడానికి ఉపయోగించే పనిముట్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గిన్నెలను.’ ‘ప్రోక్షణ పాత్రలు’ అనే అనువాదం వాటి సంభావ్య ఆరాధనా వినియోగాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి వచనంతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֵעָשֶׂה
  choice: తయారు చేయలేదు
  rationale: హీబ్రూ నిఫాల్ క్రియలోని కర్మణి భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్తగల నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: ఇక్కడ దేవాలయాన్ని సూచించే ‘ఇల్లు’ అనే అధికారిక ప్రయోగాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ‘మందిరం’ అని అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: סִפּוֹת כֶּסֶף
  choice: వెండి గిన్నెలు
  rationale: סִפּוֹת అనే పదం గిన్నెలు లేదా పాత్రలను సూచిస్తుంది; తరువాతి מִזְרָקוֹת నుండి భేదం నిలిచేలా ‘గిన్నెలు’ ఎంచుకున్నాం.
- source_word: מְזַמְּרוֹת
  choice: దీపపు వత్తులు కత్తిరించే పనిముట్లు
  rationale: మందిర సందర్భంలో దీపాల వత్తులను సరిచేయడానికి ఉపయోగించే పరికరాలనే సూచించే సంభావ్యతను స్పష్టంగా, సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: מִזְרָקוֹת
  choice: ప్రోక్షణ పాత్రలు
  rationale: బలి ఆరాధనలో ద్రవాన్ని, ముఖ్యంగా రక్తాన్ని, చల్లడానికి ఉపయోగించిన పాత్రల సంభావ్య ఆచార విధిని ప్రతిబింబిస్తుంది.
- source_word: חֲצֹצְרוֹת
  choice: బూరలు
  rationale: ఆరాధనలో ఉపయోగించే లోహపు ఊదువాయిద్యాలకు సహజమైన తెలుగు పదం.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: మరే బంగారు పాత్రనైనా వెండి పాత్రనైనా
  rationale: כְּלִי యొక్క విస్తృత అర్థాన్ని ‘పాత్ర’తో అందిస్తూ, హీబ్రూలోని పంపిణీ భావాన్ని ‘ఏదైనా’ నిర్మాణంతో నిలుపుతుంది.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: తీసుకొచ్చిన డబ్బుతో
  rationale: ఈ పరిపాలనా సందర్భంలో כֶּסֶף లోహంగా వెండికన్నా సమర్పించబడిన నిధిని సూచిస్తుంది; తెలుగు సాధనార్థక నిర్మాణం మూలంలోని ‘నుండి’ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం ఆ ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా ఉన్నప్పటికీ మందిర ఆరాధన సందర్భానికి తగిన గౌరవప్రదమైన శైలి. జాబితా నిర్మాణం మూలపాఠానికి దగ్గరగా ఉంచి, అస్పష్టమైన ఆరాధనా పరికరాలకు పాదసూచికల్లో ప్రత్యామ్నాయాలను ఇచ్చాం.
