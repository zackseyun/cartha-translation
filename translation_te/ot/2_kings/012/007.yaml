  text: וַ/יְהִ֗י בִּ/שְׁנַ֨ת עֶשְׂרִ֧ים וְ/שָׁלֹ֛שׁ שָׁנָ֖ה לַ/מֶּ֣לֶךְ יְהוֹאָ֑שׁ לֹֽא חִזְּק֥וּ הַ/כֹּהֲנִ֖ים אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/007.yaml
  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: te
  text: యెహోయాషు రాజు పరిపాలనలో ఇరవై మూడవ సంవత్సరం నాటికి, యాజకులు మందిరానికి కలిగిన నష్టాన్ని మరమ్మతు చేయలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మందిరంలోని పగుళ్లను.’ ఇక్కడ ‘మందిరం’కు మూలభాషలో ‘గృహం’ అనే పదం ఉంది.
    reason: בדק యొక్క ‘పగులు/బీట’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని, הבית యొక్క రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చేసరికి
  rationale: ఈ కథన సూత్రాన్ని తరువాతి కాలసూచక పదబంధంతో కలిపి సహజమైన తెలుగులో కొత్త దశను సూచిస్తుంది; మూలంలో లేని ప్రత్యేకమైన ‘ఇప్పుడు’ అనే భావాన్ని చేర్చదు.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: యెహోయాషు రాజు పరిపాలనలో ఇరవై మూడవ సంవత్సరం
  rationale: రాజ్యపాలన సంవత్సరాన్ని సూచించే హీబ్రూ సూత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא חִזְּקוּ
  choice: మరమ్మతు చేయలేదు
  rationale: חזק అనే క్రియకు ప్రాథమికంగా ‘బలపరచు’ అనే అర్థమున్నా, בדק הבית తో కలిసి ఇక్కడ నిర్మాణ నష్టాన్ని సరిచేయడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: హీబ్రూ పదానికి ప్రామాణికమైన, సాధారణ తెలుగు సమానం.
- source_word: בֶּדֶק הַבָּיִת
  choice: మందిరంలో పాడైన భాగాలు
  rationale: בדק అనేది పగులు, బీట లేదా మరమ్మతు అవసరమైన పాడైన స్థితిని సూచిస్తుంది. הבית అక్షరార్థంగా ‘గృహం’ అయినా, సందర్భంలో అది యెహోవా మందిరం; ‘మందిరం’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వచ్చేసరికి’ అనే రూపం ఇరవై మూడవ సంవత్సరం నాటికీ మరమ్మతులు పూర్తికాలేదనే కాలసంబంధ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
