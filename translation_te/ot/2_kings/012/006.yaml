- from: యాజకులు తమకు వచ్చే ధనాన్ని[a] ఒక్కొక్కరు తమకు పరిచయమున్నవారి దగ్గర తీసుకోవాలి. మందిరంలో[b] ఎక్కడెక్కడ పాడైందో, దానంతటినీ వారే బాగుచేయించాలి.
  to: యాజకులు ఒక్కొక్కరు తమ పరిచయస్థుని దగ్గర నుండి[a] తమ కోసం తీసుకోవాలి. మందిరంలో[b] ఎక్కడ పాడైన భాగం కనిపించినా, దానిని వారే బాగుచేయాలి.
