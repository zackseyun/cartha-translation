id: 2KI.12.6
reference: 2 Kings 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: te
  text: యాజకులు ఒక్కొక్కరు తమ పరిచయస్థుని దగ్గర నుండి[a] తమ కోసం తీసుకోవాలి. మందిరంలో[b] ఎక్కడ పాడైన భాగం కనిపించినా, దానిని వారే బాగుచేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ దాత దగ్గర నుండి.” హీబ్రూ పదానికి సాధారణంగా “పరిచయస్థుడు” అనే అర్థం ఉంది; విరాళాల సేకరణ సందర్భంలో అది దాతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఇల్లు”; ఇక్కడ అది యెహోవా మందిరాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם הַכֹּהֲנִים
  choice: యాజకులు తమకు వచ్చే ధనాన్ని తీసుకోవాలి
  rationale: హీబ్రూ క్రియ సందర్భంలో ఆదేశార్థకంగా ఉంది. לָהֶם స్వీకరణను సూచిస్తుంది; మునుపటి వచనాల్లో ధనసేకరణ సందర్భం ఉన్నందున తెలుగులో ‘తమకు వచ్చే ధనాన్ని’ అని సహజంగా వ్యక్తపరచబడింది.
- source_word: אִישׁ מֵאֵת מַכָּרוֹ
  choice: ఒక్కొక్కరు తమకు పరిచయమున్నవారి దగ్గర
  rationale: אִישׁ బహువచన కర్తను పంపిణీ భావంతో ‘ఒక్కొక్కరు’గా సూచిస్తుంది. מַכָּרוֹ యొక్క ప్రాథమిక భావమైన పరిచయస్థుడిని ప్రధాన పాఠ్యంలో నిలిపి, సేకరణ సందర్భంలోని దాత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְהֵם יְחַזְּקוּ
  choice: వారే బాగుచేయించాలి
  rationale: וְהֵם యాజకుల బాధ్యతను నొక్కిచెబుతుంది; అందుకే ‘వారే’. חזק పీయేల్ నిర్మాణ మరమ్మతుల సందర్భంలో బాగుచేయడం లేదా మరమ్మతు చేయించడం అనే భావం ఇస్తుంది. యాజకులు ధనాన్ని నిర్వహించి పనిని చేయించే పరిపాలనా సందర్భానికి ‘బాగుచేయించాలి’ సహజంగా సరిపోతుంది.
- source_word: בֶּדֶק הַבַּיִת
  choice: మందిరంలో పాడైనది
  rationale: בֶּדֶק భవనంలోని పగులు, లోపం లేదా పాడైన స్థితిని సూచిస్తుంది. הַבַּיִת ఇక్కడ యెహోవా మందిరాన్ని సూచిస్తున్నందున పాఠకుడికి స్పష్టంగా ‘మందిరం’ అని అనువదించబడింది.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: ఎక్కడెక్కడ పాడైందో, దానంతటినీ
  rationale: మందిరంలో కనిపించే ప్రతి నష్టాన్నీ మరమ్మతు చేయాలనే సమగ్ర పరిధిని ఈ సహజ తెలుగు నిర్మాణం తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఒక్కొక్కరు’, ‘వారే’ అనే రూపాలు పంపిణీ భావాన్ని, బాధ్యతపై ఉన్న నొక్కును నిలుపుతాయి. ప్రధాన పాఠ్యంలో ‘పరిచయమున్నవారు’ అనే హీబ్రూ పదపు విస్తృత భావం ఉంచబడింది; సేకరణ సందర్భాన్ని ‘ధనం’ ద్వారా స్పష్టం చేసి, అది సందర్భపూరిత పూరణ అని పాదసూచికలో వెల్లడించబడింది.
