source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/רְאוֹתָ֔/ם כִּֽי רַ֥ב הַ/כֶּ֖סֶף בָּֽ/אָר֑וֹן וַ/יַּ֨עַל סֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וְ/הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וַ/יָּצֻ֨רוּ֙ וַ/יִּמְנ֔וּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֥א בֵית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: te
  text: పెట్టెలో వెండి చాలా ఉందని వారు చూసినప్పుడల్లా, రాజు కార్యదర్శి, ప్రధాన యాజకుడు పైకి వచ్చి, యెహోవా మందిరంలో దొరికిన వెండిని కట్టలుగా కట్టి లెక్కపెట్టేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִרְאוֹתָם
  choice: వారు చూసినప్పుడల్లా
  rationale: ఈ నిర్మాణం పునరావృతంగా జరిగే సందర్భాన్ని సూచిస్తుంది; తరువాతి క్రియల సందర్భానుకూల భావంతో ‘అప్పుడల్లా’ అని సహజంగా అనువదించాం.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: రాజు కార్యదర్శి
  rationale: సֹפֵר ఇక్కడ రాజసభలో లిఖిత, లెక్కల బాధ్యతగల అధికారిని సూచిస్తుంది; ఆధునిక పాఠకునికి ‘కార్యదర్శి’ స్పష్టంగా ఉంటుంది.
- source_word: וַיָּצֻרוּ
  choice: మూటలు కట్టి
  rationale: క్రియకు డబ్బును కట్టలుగా లేదా సంచుల్లో భద్రపరచే భావం ఉంది. ‘మూటలు కట్టి’ మూలంలోని కట్టివేయడం అనే భావాన్ని కాపాడుతుంది.
- source_word: וַיִּמְנוּ
  choice: లెక్కపెట్టేవారు
  rationale: మూలక్రియ యొక్క సాధారణ అర్థం ‘లెక్కించడం’; పునరావృత సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి అలవాటుసూచక రూపం వాడాం.
- source_word: בֵית יְהוָה
  choice: యెహోవా మందిరం
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా ప్రతిబింబిస్తూ, בֵית అనే పదాన్ని ఈ సందర్భంలో సహజమైన ‘మందిరం’గా అనువదించాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం ఉంది; దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంతో చూపడం మూలానికి మరింత పారదర్శకం.
- issue: הַכֹּהֵן הַגָּדוֹל అనే బిరుదు
  choice: ప్రధాన యాజకుడు
  alternative: మహాయాజకుడు
  rationale: రెండూ సాధ్యమే; ‘ప్రధాన యాజకుడు’ హెబ్రీ పదబంధంలోని ‘గొప్ప/ప్రధాన యాజకుడు’ భావాన్ని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. పునరావృత చర్యను ‘చూసినప్పుడల్లా’ మరియు ‘లెక్కపెట్టేవారు’ ద్వారా వ్యక్తం చేశాం; పరిపాలనా, ఆరాధనా పదజాలాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచాం.
