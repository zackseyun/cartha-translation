id: 2KI.12.21
reference: 2 Kings 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקֻ֥מוּ עֲבָדָ֖י/ו וַ/יִּקְשְׁרֽוּ קָ֑שֶׁר וַ/יַּכּוּ֙ אֶת יוֹאָ֔שׁ בֵּ֥ית מִלֹּ֖א הַ/יּוֹרֵ֥ד סִלָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: te
  text: అతని సేవకులు లేచి కుట్ర పన్నారు; సిల్లాకు దిగే బేత్-మిల్లో వద్ద వారు యోవాషును కొట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సిల్లాకు దిగే మార్గంలో ఉన్న బేత్-మిల్లో వద్ద.” హెబ్రీ పదబంధం బేత్-మిల్లోను సిల్లా వైపు దిగే ప్రదేశంగా వర్ణించవచ్చు; లేదా సిల్లాకు దిగే మార్గాన్ని సూచించవచ్చు.
    reason: స్థలాన్ని వర్ణించే హెబ్రీ పదబంధం యొక్క సంబంధాన్ని స్పష్టంగా నిర్ణయించడం కష్టం; ప్రత్యామ్నాయ సహజ అవగాహనను నిలుపుతుంది.
lexical_decisions:
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజుకు లోబడిన వారిని సూచించే సాధారణ పదం; ‘అధికారులు’ అని అనువదించడం మూలంలో ఉన్నదానికంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: కుట్ర పన్నారు
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకం కలిసిన హెబ్రీ ప్రయోగం కుట్ర చేయడాన్ని సూచిస్తుంది. దాని పదపునరుక్తిని తెలుగులో యథాతథంగా ఉంచడం అసహజం కాబట్టి సహజమైన నుడికారాన్ని వాడాం.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה అనే క్రియకు ‘కొట్టు’ అనే విస్తృత అర్థం ఉన్నా, ఈ సందర్భంలో దాడి ప్రాణాంతకమైనదని కథనం స్పష్టం చేస్తుంది; ‘హతమార్చారు’ తెలుగులో సందర్భానుగుణమైన సంక్షిప్త రూపం.
- source_word: בֵּית מִלֹּא
  choice: బేత్-మిల్లో
  rationale: ఇది స్థలపేరుగా గ్రహించి అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: הַיּוֹרֵד סִלָּא
  choice: సిల్లాకు దిగిపోయే దారిలో ఉన్న
  rationale: ఈ హెబ్రీ పదబంధం సిల్లా వైపు దిగే ప్రదేశాన్ని లేదా మార్గాన్ని వర్ణిస్తుంది; తెలుగు వాక్యంలో స్థలసంబంధం సహజంగా ఉండేలా అనువదించాం.
- source_word: סִלָּא
  choice: సిల్లా
  rationale: స్థలపేరును తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. హెబ్రీ పదపునరుక్తిని అసహజంగా అనుకరించకుండా దాని భావబలాన్ని ‘కుట్ర పన్నారు’ ద్వారా తెలిపాం; స్థలవివరణలోని స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
