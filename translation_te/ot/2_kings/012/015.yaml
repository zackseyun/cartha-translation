translation:
  language: te
  text: ఎందుకంటే వారు దాన్ని పని చేసేవారికి ఇచ్చేవారు; దానితో వారు యాహ్వే మందిరాన్ని[a] బాగుచేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘యాహ్వే ఇల్లు’; అంటే యాహ్వే మందిరం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యంలో లెక్క అడగకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: పని చేసేవారికి
  rationale: ‘పని చేసేవారు’ అనే హీబ్రూ భాగార్థక రూపాన్ని సహజమైన, లింగనిరపేక్ష తెలుగు పదబంధంతో అందిస్తుంది.
- source_word: יִתְּנֻהוּ
  choice: వారు దాన్ని ... ఇచ్చేవారు
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ గతంలో అలవాటుగా లేదా పదేపదే జరిగిన చర్యను సూచిస్తుంది; ‘ఇచ్చేవారు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְחִזְּקוּ
  choice: మరమ్మతులు చేసేవారు
  rationale: ప్రాథమికంగా ‘బలపరచడం, దృఢపరచడం’ అని అర్థమైనా, భవన సందర్భంలో నిర్మాణాన్ని బాగుచేయడం అనే భావం ఉంది.
- source_word: בּוֹ
  choice: దానితో
  rationale: సందర్భంలో ఇది ముందుగా ప్రస్తావించిన డబ్బును సూచిస్తుంది; మూలంలోని సర్వనామ సంక్షిప్తతను నిలుపుతుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ఇక్కడ ‘ఇల్లు’ అనేది ఆరాధనా మందిరాన్ని సూచించే హీబ్రూ ప్రయోగం; ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది.
- issue: וְחִזְּקוּ క్రియకు కర్త ఎవరు?
  choice: ‘వారు’ అనే అస్పష్ట సూచనను నిలుపడం
  alternative: పని చేసేవారే మరమ్మతులు చేశారని స్పష్టీకరించడం
  rationale: హీబ్రూ బహువచన క్రియ కర్తను పేరుతో మళ్లీ చెప్పదు; అది డబ్బు ఇచ్చినవారినో పని చేసేవారినో వ్యాకరణపరంగా సూచించగల ఉద్రిక్తతను తెలుగు వాక్యంలో అనవసరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. గతంలో పునరావృతమైన చర్యలను ‘ఇచ్చేవారు,’ ‘మరమ్మతులు చేసేవారు’ రూపాలతో వ్యక్తం చేసింది.
