source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: te
  text: యూదా రాజైన యెహోయాషు, తన పితరులు[b]—యూదా రాజులైన యెహోషాపాతు, యెహోరాము, అహజ్యా—ప్రతిష్ఠించిన పవిత్ర వస్తువులన్నిటినీ, తన పవిత్ర వస్తువులనూ, యాహ్వే మందిర ఖజానాల్లోను రాజభవన ఖజానాల్లోను ఉన్న బంగారమంతటినీ తీసుకొని, అరాము రాజైన హజాయేలుకు పంపించాడు. అప్పుడు హజాయేలు యెరూషలేము మీద నుంచి వెనుదిరిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు యెరూషలేమును విడిచి వెళ్లిపోయాడు.” హీబ్రూలో అక్షరార్థంగా “అతడు యెరూషలేము మీద నుంచి పైకి వెళ్లాడు” అని ఉంది; హజాయేలు నగరంపై తన ముందడుగును విరమించాడని ఈ ప్రయోగం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “పితరులు” అంటే ఇక్కడ అతని రాజవంశ పూర్వీకులు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపుతుంది; బలవంతంగా స్వాధీనం చేసుకున్నాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: పవిత్ర వస్తువులు / తాను ప్రతిష్ఠించిన పవిత్ర వస్తువులు
  rationale: ఆరాధనార్థం ప్రత్యేకపరచబడిన వస్తువుల భావాన్ని నిలుపుతుంది. రెండో పదంలోని స్వామ్య ప్రత్యయాన్ని సందర్భానుసారంగా యెహోయాషు తానే ప్రతిష్ఠించినవిగా స్పష్టం చేసింది.
- source_word: הִקְדִּישׁוּ
  choice: ప్రతిష్ఠించిన
  rationale: పవిత్ర ఉపయోగం కోసం అంకితం చేయడాన్ని సూచించే హిఫిల్ రూపానికి సహజమైన తెలుగు సమానం.
- source_word: אֲבֹתָיו
  choice: తన పితరులు
  rationale: హీబ్రూ కుటుంబపదాన్ని నిలుపుతూ, ఇది రాజవంశ పూర్వీకులను సూచిస్తుందని పాదటీపులో వివరిస్తుంది.
- source_word: הַנִּמְצָא
  choice: ఉన్న
  rationale: ఖజానాల్లో లభ్యంగా లేదా నిల్వగా ఉన్న బంగారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కనుగొనబడిన’ అనే అసహజ అర్థఛాయను నివారిస్తుంది.
- source_word: בְּאֹצְרוֹת
  choice: ఖజానాల్లో
  rationale: మందిరం మరియు రాజభవనంలోని ధననిల్వ గదులు లేదా నిల్వలను సందర్భోచితంగా సూచిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: בית అనే రూపకాన్ని తెలుగులో దాని సందర్భార్థమైన మందిరంగా సహజంగా అందిస్తూ, దేవుని వ్యక్తిగత నామాన్ని యాహ్వే అని ప్రతిలిపి చేసింది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: ‘రాజు ఇల్లు’ అనే హీబ్రూ ప్రయోగానికి సందర్భంలో ఉద్దేశించిన రాజప్రాసాదాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: హజాయేలుకు పంపించాడు
  rationale: ముందు పేర్కొన్న వస్తువులు, బంగారం అన్నిటినీ పంపించిన చర్యను సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: యెరూషలేము మీద నుంచి వెనుదిరిగాడు
  rationale: హజాయేలు నగరంపై తన ముందడుగును లేదా దాడిని విరమించి వెళ్లిపోయాడనే హీబ్రూ దిశాత్మక ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ వివరాన్ని పాదటీపు ఇస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ప్రతిలిపి చేస్తుంది.
- issue: చివరి క్రియకు కర్త ఎవరు
  choice: హజాయేలు అని స్పష్టం చేయడం
  alternative: ‘అతడు’ అని మాత్రమే ఉంచడం
  rationale: సమీప పూర్వపదం మరియు కథాసందర్భం ప్రకారం వెనుదిరిగినవాడు హజాయేలు. తెలుగులో సందిగ్ధత రాకుండా పేరును పునరుక్తి చేసింది; పాఠ్యంలో లేని కారణార్థ సంబంధాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. పొడవైన హీబ్రూ జాబితిని పఠనసౌలభ్యం కోసం విరామచిహ్నాలతో అమర్చాం. ‘పవిత్ర వస్తువులు’ మరియు ‘ప్రతిష్ఠించిన’ ద్వారా קדש పదకుటుంబంలోని పవిత్రత, అంకితభావం రెండింటినీ నిలిపాం.
