  terminology: ‘యోవాషు’ హీబ్రూ పేరుకు తగిన తెలుగు లిప్యంతరీకరణ. ‘దినవృత్తాంతాల గ్రంథం’ మూలంలోని సֵפֶר דִּבְרֵי הַיָּמִים అనే రాజరిక నమోదుల/వృత్తాంతాల శీర్షికను తగిన విధంగా వ్యక్తం చేస్తుంది. [a] గుర్తు సంబంధిత గ్రంథ-పదబంధానికే జతచేయబడింది; ప్రత్యామ్నాయమైన ‘వార్షిక నమోదులు’ను పాదటిప్పణి సముచితంగా సూచిస్తుంది.
