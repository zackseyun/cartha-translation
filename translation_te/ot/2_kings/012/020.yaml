  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: యోవాషు చేసిన మిగిలిన కార్యాలు, అతడు చేసినదంతా—యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుల వార్షిక నమోదుల గ్రంథంలో.’ హీబ్రూ పదబంధం అధికారిక రాజరిక నమోదును లేదా చరిత్రవృత్తాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: యోవాషు చేసిన మిగిలిన కార్యాలు
  rationale: దִּבְרֵי అనే పదానికి అక్షరార్థంగా ‘మాటలు/విషయాలు’ అని అర్థం రావచ్చు; అయితే రాజుల పాలన సారాంశాల్లో అది రాజు చేసిన కార్యాల నమోదును సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘చేసిన’ను చేర్చడం సహజంగా ఉంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: כָל యొక్క సమగ్ర భావాన్ని, సంబంధ వాక్య నిర్మాణాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: రాసి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకార ప్రశ్నను తెలుగులో సహజమైన ‘కదా?’ నిర్మాణంతో వ్యక్తం చేస్తుంది; బహువచన భావమూ నిలుస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినప్పటికీ, లిఖిత ఆధారాన్ని ప్రస్తావించే సందర్భంలో తెలుగు నుడికారానికి ‘గ్రంథంలో’ సహజ సమానార్థకం.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: ఈ రాజరిక ఆధారగ్రంథ శీర్షికలో דִּבְרֵי הַיָּמִים చారిత్రక దినవృత్తాంతాలను లేదా వార్షిక నమోదులను సూచిస్తుంది. సంప్రదాయపరంగా గుర్తుపట్టదగిన, అర్థవంతమైన తెలుగు రూపం ఎంచుకోబడింది.
- source_word: יוֹאָשׁ
  choice: యోవాషు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా ఉండే, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
