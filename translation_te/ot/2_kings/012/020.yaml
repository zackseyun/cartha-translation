  source_fidelity: 'హీబ్రూ రాజ-సారాంశ సూత్రంలోని అన్ని ప్రధాన అంశాలు నిలిచాయి: యోవాషు మిగిలిన కార్యాలు, అతడు చేసినదంతా, సానుకూల జవాబును ఆశించే అలంకార ప్రశ్న, అలాగే యూదా రాజుల దినవృత్తాంతాల గ్రంథం. బహువచనమైన הֵם כְּתוּבִים‌కు ‘రాసి ఉన్నాయి కదా?’ సరైన అనుసరణగా ఉంది.'
