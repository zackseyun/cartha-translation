  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: te
  text: అయితే ఎత్తైన పూజాస్థలాలు[a] తొలగించబడలేదు; ప్రజలు ఇంకా ఆ ఎత్తైన పూజాస్థలాల్లో బలులు అర్పిస్తూ, ధూపం వేస్తూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎత్తైన స్థలాలు’; హెబ్రీ పదం స్థానికంగా, సాధారణంగా ఎత్తైన ప్రదేశాల్లో ఉన్న ఆరాధనా స్థలాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందున్న సానుకూల అంచనాకు మినహాయింపు లేదా పరిమితిని సూచించే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఎత్తైన పూజాస్థలాలు
  rationale: ఈ పదం స్థానికంగా, సాధారణంగా ఎత్తైన ప్రదేశాల్లో ఉన్న ఆరాధనా కేంద్రాలను సూచిస్తుంది. కేవలం ‘ఎత్తైన స్థలాలు’ అన్నదానికంటే పూజా సందర్భాన్ని స్పష్టంగా ఉంచుతూ, స్థల సంబంధమైన భావాన్ని కూడా కాపాడుతుంది.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: ఇక్కడ ఎత్తైన పూజాస్థలాలే కర్తగా ఉన్నాయి; అవి కొనసాగి ఉన్నాయనే హెబ్రీ నుడికారపు ఆచరణాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ఆ ఆచారం కొనసాగుతూనే ఉందనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: దేశ ప్రజలను సమూహంగా సూచించే నామవాచకానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: מְזַבְּחִים
  choice: బలులు అర్పిస్తూ
  rationale: హెబ్రీ వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా అలవాటైన చర్యను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּמְקַטְּרִים
  choice: ధూపం వేస్తూ
  rationale: ఆరాధనా సందర్భంలో קטר సాధారణంగా ధూపం లేదా అర్పణను పొగగా కాల్చడాన్ని సూచిస్తుంది; బలులు అర్పించడంతో జతగా ఉన్న ఇక్కడ ‘ధూపం వేస్తూ’ సహజమైన సందర్భోచిత ఎంపిక.
- source_word: בַּבָּמוֹת
  choice: ఆ ఎత్తైన పూజాస్థలాల్లో
  rationale: హెబ్రీ మూలంలోని పూజాస్థలాల పునరుక్తిని కాపాడుతూ, చర్య జరిగిన ప్రదేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఎత్తైన పూజాస్థలాల్లో జరిగిన ఆరాధనపై అంచనా
  choice: ప్రధాన వాక్యంలో చారిత్రకంగా వివరణాత్మకమైన ‘ఎత్తైన పూజాస్థలాలు’ అనే పదాన్ని ఉంచి, అదనపు తీర్పును చేర్చలేదు.
  alternative: ‘అనధికార పూజాస్థలాలు’ అని స్పష్టీకరించడం లేదా ‘పూజామందిరాలు’ అని సాధారణీకరించడం.
  rationale: ఈ వాక్యం వాటి తొలగింపులేమిని, అక్కడ కొనసాగిన ఆరాధనను నివేదిస్తుంది; వాటి గురించి అంతర్లీన విమర్శ ఉన్నప్పటికీ, మూలంలో లేని అదనపు మతశాస్త్రీయ వ్యాఖ్యను అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. కొనసాగుతున్న అలవాటైన చర్యను ‘అర్పిస్తూ, ధూపం వేస్తూ ఉండేవారు’ అనే నిర్మాణంతో వ్యక్తం చేశాం.
