id: 2KI.12.3
reference: 2 Kings 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: te
  text: యెహోయాదా యాజకుడు అతనికి ఉపదేశించినంతకాలం[a] యెహోయాషు యాహ్వే దృష్టిలో సరైనది చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరానుసారంగా: “యెహోయాదా యాజకుడు అతనికి ఉపదేశించిన అతని రోజులన్నిటిలో.”'
    reason: హీబ్రూలో సంబంధవాచక వాక్యం “అతని రోజులన్నీ” అనే పదబంధాన్ని నేరుగా నిర్దేశిస్తుంది; ప్రధాన పాఠ్యం దాని సహజమైన కాలార్థాన్ని వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: సరైనదే చేశాడు
  rationale: עשה తో విశేషణం నామవాచకార్థంలో వచ్చి నైతిక ప్రవర్తనను సూచిస్తుంది. ‘సరైనదే చేశాడు’ అనేది రాజుల గ్రంథంలోని మూల్యాంకన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హీబ్రూ భాషలోని ‘యాహ్వే కళ్లలో’ అనే మూల్యాంకన నుడికారాన్ని తెలుగులో సహజంగా ‘యాహ్వే దృష్టిలో’ అని అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: כָּל יָמָיו
  choice: తన జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘అతని రోజులన్నీ’; తెలుగులో సంపూర్ణ జీవనకాలాన్ని సహజంగా సూచించే రూపం ఇది. తరువాతి సంబంధవాచక వాక్యం దీనిని ఎలా నిర్దేశిస్తుందో పాదసూచికలో ఉంచబడింది.
- source_word: אֲשֶׁר הוֹרָהוּ
  choice: ఉపదేశించినందువల్ల
  rationale: אֲשֶׁר యొక్క సంబంధార్థం సందర్భంలో కారణ సంబంధంగా అర్థం చేసుకునే అవకాశాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేస్తుంది; కాలపరిమితి సూచించే మరింత అక్షరానుసారమైన నిర్మాణాన్ని పాదసూచికలో నిలిపింది.
- source_word: הוֹרָהוּ
  choice: అతనికి ఉపదేశించిన
  rationale: ירה ధాతువు హిఫీల్ రూపం బోధించడం, ఉపదేశించడం లేదా దిశానిర్దేశం చేయడం అనే భావాన్ని ఇస్తుంది. ‘ఉపదేశించిన’ అనే పదం యెహోయాదా మార్గదర్శక పాత్రకు సరిపోతుంది.
- source_word: יְהוֹאָשׁ
  choice: యెహోయాషు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ధ్వన్యంతరీకరణ.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: యెహోయాదా యాజకుడు
  rationale: వ్యక్తినామాన్ని ధ్వన్యంతరీకరించి, הַכֹּהֵן అనే పదవిని సహజమైన తెలుగు అన్వయంతో ‘యాజకుడు’గా అనువదించింది.
theological_decisions:
- issue: యెహోయాషు నీతిగా ప్రవర్తించిన కాలవ్యాప్తి
  choice: ప్రధాన పాఠ్యం యెహోయాదా ఉపదేశాన్ని యెహోయాషు సత్ప్రవర్తనకు కారణంగా చూపుతుంది; అక్షరానుసారంగా కాలాన్ని పరిమితం చేసే అవకాశాన్ని పాదసూచికలో ఉంచుతుంది.
  alternative: ‘యెహోయాదా యాజకుడు అతనికి ఉపదేశించిన రోజులన్నిటిలో’ అని అనువదించి, యెహోయాషు సత్ప్రవర్తనను యెహోయాదా మార్గదర్శకత్వం ఉన్న కాలానికే పరిమితం చేయవచ్చు.
  rationale: אֲשֶׁר అనే సంబంధవాచక పదం ఇక్కడ కారణ లేదా కాల సంబంధాన్ని అనుమతిస్తుంది. ఏకైక భావాన్ని బలవంతంగా నిర్ణయించకుండా ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి మూలంలోని నిజమైన సందిగ్ధతను కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన శైలిని పాటించింది. దైవనామాన్ని ‘యాహ్వే’గా, యాజక పదవిని ‘యాజకుడు’గా నిలిపింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
