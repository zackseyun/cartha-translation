translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ ‘తన ముఖాన్ని ఉంచాడు’ అనే నుడికారాన్ని పూర్తిగా తొలగించకుండా సహజీకరించి, దాని సంకల్ప భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం. అరాము అనే హెబ్రీ భౌగోళిక నామాన్ని ‘సిరియా’గా మార్చలేదు.
