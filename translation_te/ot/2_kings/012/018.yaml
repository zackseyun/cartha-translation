  naturalness: ‘అరాము రాజు హజాయేలు’ మరియు ‘యెరూషలేముపైకి వెళ్లాలని సంకల్పించాడు’ ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజమైన, స్పష్టమైన కథనప్రయోగాలు. ‘మీదికి’ కన్నా ‘పైకి’ మూలంలోని עלה (‘పైకి వెళ్లడం’)ను కూడా చక్కగా నిలుపుతుంది.
  terminology: ‘అరాము,’ ‘హజాయేలు,’ ‘గాతు,’ ‘యెరూషలేము’ అనే నామరూపాలు సముచితమైనవి. ఆంగ్ల POBలో ఉన్న అరాము/సిరియా వివరణాత్మక గమనికను కూడా చేర్చడం ద్వారా పదనిర్ణయ audit trail నిలుస్తుంది.
