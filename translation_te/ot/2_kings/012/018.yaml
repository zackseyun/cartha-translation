    rationale: ‘తన ముఖాన్ని అటువైపు తిప్పుకున్నాడు’ సాధారణ తెలుగులో కేవలం శారీరక కదలికగా వినిపిస్తుంది. וַיָּשֶׂם ... פָּנָיו ఇక్కడ యెరూషలేముపైకి వెళ్లడానికి దృఢంగా ఉద్దేశించడాన్ని సూచిస్తుంది.
