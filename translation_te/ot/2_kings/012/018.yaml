source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֗ה חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יִּלָּ֥חֶם עַל גַּ֖ת וַֽ/יִּלְכְּדָ֑/הּ וַ/יָּ֤שֶׂם חֲזָאֵל֙ פָּנָ֔י/ו לַ/עֲל֖וֹת עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: te
  text: అప్పుడు అరాము రాజు హజాయేలు పైకి వెళ్లి గాతు మీద యుద్ధం చేసి దానిని స్వాధీనం చేసుకున్నాడు.[b] తరువాత హజాయేలు యెరూషలేముపైకి వెళ్లాలని సంకల్పించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, ‘యెరూషలేముపైకి వెళ్లడానికి తన ముఖాన్ని ఉంచాడు’; అంటే, దృఢంగా నిర్ణయించుకున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాము’ హెబ్రీ పేరు; సంప్రదాయ అనువాదాల్లో దీనిని తరచుగా ‘సిరియా’గా అనువదిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తర్వాత జరిగిన సంఘటనను పరిచయం చేసే కాలసూచక పదంగా సహజమైన తెలుగు ప్రయోగం.
- source_word: יַעֲלֶה
  choice: పైకి వెళ్లి
  rationale: עלה అనే ఎక్కడం/పైకి వెళ్లడం భావాన్ని, సైనికంగా ముందుకు సాగడాన్ని అతిగా విపులీకరించకుండా నిలుపుతుంది.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: అరాము రాజైన హజాయేలు
  rationale: వ్యక్తి, ప్రాంత నామాలను హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించి, తెలుగు వాక్యనిర్మాణానికి సహజంగా అమర్చింది.
- source_word: וַיִּלָּחֶם עַל
  choice: మీద యుద్ధం చేసి
  rationale: לחם עם על ఇక్కడ ఒక పట్టణానికి వ్యతిరేకంగా యుద్ధం చేయడాన్ని సూచిస్తుంది.
- source_word: גַּת
  choice: గాతు
  rationale: స్థలనామానికి తెలుగు బైబిలు సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: וַיִּלְכְּדָהּ
  choice: దాన్ని స్వాధీనం చేసుకున్నాడు
  rationale: పట్టణాన్ని యుద్ధంలో పట్టుకోవడం లేదా జయించి ఆధీనంలోకి తెచ్చుకోవడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: తన ముఖాన్ని అటువైపు తిప్పుకున్నాడు
  rationale: హెబ్రీ శరీరాంగ ఆధారిత నుడికారాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ఒక దిశగా ఉద్దేశపూర్వకంగా సాగాలని నిశ్చయించుకున్న భావాన్ని తెలుపుతుంది.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: యెరూషలేము మీదికి వెళ్లాలని
  rationale: యెరూషలేమువైపు పైకి సాగడం మరియు దానికి వ్యతిరేకంగా రావడం అనే రెండు భావఛాయలను, నేరుగా ‘దాడి చేయడం’గా పరిమితం చేయకుండా నిలుపుతుంది.
