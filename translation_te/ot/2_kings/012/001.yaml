- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְּ + מלך క్రియానామ రూపం ఇక్కడ కాలార్థకంగా ‘అతడు రాజైనప్పుడు’ అని సూచిస్తుంది; ఇది తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
