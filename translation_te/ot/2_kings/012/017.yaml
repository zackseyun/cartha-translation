source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: te
  text: అపరాధ పరిహార బలి సొమ్మును[a], పాప పరిహార బలుల సొమ్మును యాహ్వే మందిరంలోకి[b] తీసుకురాకూడదు; ఆ సొమ్ము యాజకులకు చెందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అపరాధ పరిహార బలి వెండిని.’ హీబ్రూ పదానికి అక్షరార్థం ‘వెండి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థం, ‘యాహ్వే గృహంలోకి’; అంటే దేవాలయంలోకి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: సొమ్ము
  rationale: ఈ ఆలయ ఆర్థిక సందర్భంలో ఈ పదం అక్షరార్థమైన ‘వెండి’ కంటే బలులకు సంబంధించిన చెల్లింపు లేదా ధనాన్ని సూచిస్తుంది. ‘సొమ్ము’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אָשָׁם
  choice: అపరాధ పరిహార బలి
  rationale: బలుల సందర్భంలో ఇది అపరాధం వల్ల ఏర్పడిన బాధ్యత లేదా నష్టానికి పరిహారంతో ముడిపడిన బలిని సూచిస్తుంది. ‘అపరాధ పరిహార బలి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַטָּאוֹת
  choice: పాప పరిహార బలులు
  rationale: ఇక్కడ బహువచన రూపం పాపాలను కాక, బలుల వర్గాన్ని సూచిస్తుంది. ‘పాప పరిహార బలులు’ సాధారణ పాఠకునికి సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: לֹא יוּבָא
  choice: తీసుకురాకూడదు
  rationale: నిషేధంతో ఉన్న ఈ కర్మణి రూపం ఈ ధనాన్ని ఎలా నిర్వహించాలనే నియమాన్ని తెలియజేస్తుంది. తెలుగులో ‘తీసుకురాకూడదు’ సహజంగా ఆ నిర్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: హీబ్రూలో అక్షరార్థం ‘యాహ్వే గృహం.’ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ప్రధాన పాఠంలో సహజమైన ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: ఆ సొమ్ము యాజకులకే చెందుతుంది
  rationale: ఈ వాక్యభాగం ఆ ధనం యాజకులకు కేటాయించబడిందని తెలియజేస్తుంది. ‘కే’ ఆ ప్రత్యేక కేటాయింపును సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో దేవుని ప్రత్యేక నామమైన చతురక్షర నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: חַטָּאוֹת అనే బలి పదం యొక్క భావం
  choice: పాప పరిహార బలులు
  alternative: శుద్ధీకరణ బలులు
  rationale: యాజక ధర్మశాస్త్ర సందర్భాల్లో ‘శుద్ధీకరణ బలులు’ అనే భావం సాధ్యమే. అయితే ఇక్కడ గుర్తింపుపొందిన బలి వర్గాలకు సంబంధించిన సొమ్ము గురించి చెప్పబడుతున్నందున, సాధారణ పాఠకులకు సుపరిచితమైన ‘పాప పరిహార బలులు’ను ఎంచుకున్నాం; ప్రత్యామ్నాయ భావాన్ని సిద్ధాంతపరంగా బలవంతంగా రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ఆలయ ఆర్థిక సందర్భానికి ‘సొమ్ము’ సహజంగా ఉండగా, ‘వెండి’ అనే మూలపద అక్షరార్థాన్ని పాదసూచికలో కాపాడాం. రెండు పాదసూచిక సూచికలూ ప్రధాన పాఠంలో ఉన్నాయి.
