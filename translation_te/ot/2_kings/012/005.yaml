  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: te
  text: 'యెహోయాషు యాజకులతో ఇలా అన్నాడు: “యహ్వే మందిరంలోకి తీసుకురాబడే పవిత్రమైన వాటికి సంబంధించిన డబ్బంతా—లెక్కించబడే ప్రతి పురుషుడు చెల్లించే డబ్బు[a], వ్యక్తుల విలువ నిర్ణయానికి సంబంధించిన డబ్బు[b], అలాగే యహ్వే మందిరంలోకి తీసుకురావాలని ఒక మనిషి హృదయంలో ఉద్దేశించే డబ్బంతా[c]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “దాటివెళ్లే ప్రతి పురుషుని డబ్బు.” ఇది లెక్కించబడినవారు చెల్లించాల్సిన జనగణన సుంకాన్ని సూచించే అవకాశం ఉంది (నిర్గమకాండము 30:13–16 చూడండి).'
    reason: lexical_alternative
  - marker: b
    text: లేదా “వ్యక్తుల విలువ నిర్ణయానికి చెల్లించే డబ్బు.” ఇది మొక్కుబడి చేసిన వ్యక్తులకు నిర్ణయించిన విలువల ప్రకారం చేసే చెల్లింపులను సూచించే అవకాశం ఉంది (లేవీయకాండము 27:2–8 చూడండి).
    reason: cross_reference
  - marker: c
    text: హీబ్రూ నుడికారం పదశః, “ఒక పురుషుని హృదయంపైకి ఎక్కేది”; అంటే ఒకరు స్వచ్ఛందంగా ఇవ్వాలని హృదయంలో ఉద్దేశించేది.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: ప్రతిష్ఠిత అర్పణల డబ్బంతా
  rationale: ఈ నిర్మాణం పవిత్రపరచబడిన లేదా దేవునికి ప్రతిష్ఠించిన వాటికి సంబంధించిన ధనాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా ‘అర్పణలు’ అని వ్యక్తం చేస్తూనే, తరువాత పేర్కొనే వివిధ ఆదాయ రకాలన్నిటికీ చోటు ఉంచుతుంది.
- source_word: יוּבָא בֵית יְהוָה
  choice: యహ్వే మందిరంలోకి తీసుకువచ్చే
  rationale: హోఫల్ రూపంలోని కర్మణి భావాన్ని ‘తీసుకువచ్చే’ ద్వారా నిలుపుతూ, ‘యహ్వే గృహం’ అనే ఆలయార్థాన్ని సహజ తెలుగులో ‘యహ్వే మందిరం’గా ఇచ్చింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: లెక్కించబడే ప్రతి పురుషుడు చెల్లించే డబ్బు
  rationale: పదశః ‘దాటివెళ్లే ప్రతి పురుషుని డబ్బు’ అని ఉన్నా, నిర్గమకాండము 30:13–16లో లెక్కించబడినవారు చెల్లించే సుంకాన్ని ఇది సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో సందర్భార్థాన్ని ఇచ్చి, పదశః రూపాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: వ్యక్తుల విలువ నిర్ణయానికి సంబంధించిన డబ్బు
  rationale: వ్యక్తులకు నిర్ణయించిన ఆచారపరమైన విలువల ఆధారంగా చెల్లించే ధనాన్ని సూచించే సంక్షిప్త హీబ్రూ పదబంధాన్ని, ‘మొక్కుబడి’ అని ప్రధాన పాఠంలో అదనంగా నిర్దిష్టపరచకుండా అనువదించింది.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: ఎవరి హృదయంలో స్వచ్ఛందంగా పుడుతుందో ఆ డబ్బంతా
  rationale: పదశః ‘ఒక పురుషుని హృదయంపైకి వచ్చేది’ అనే హీబ్రూ నుడికారంలో అంతరంగ ఉద్దేశం లేదా స్వచ్ఛంద నిర్ణయం ఉంది. హృదయ రూపకాన్ని ఉంచి తెలుగులో అర్థమయ్యేలా వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: כֶּסֶף עוֹבֵר אִישׁ యొక్క ఆచారపరమైన సూచన
  choice: లెక్కించబడే ప్రతి పురుషుడు చెల్లించే డబ్బు
  alternative: దాటివెళ్లే ప్రతి పురుషుని డబ్బు
  rationale: ఇది జనగణన సుంకాన్నే సూచిస్తుందని సందర్భం బలంగా సూచించినా, పదబంధం స్వతహాగా సంక్షిప్తమైనది. అందువల్ల ప్రధాన పాఠంలో సందర్భార్థాన్ని, పాదటిప్పణిలో పదశః ప్రత్యామ్నాయాన్ని ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. జాబితా నిర్మాణం మరియు వాక్యం తరువాతి వచనంలో కొనసాగుతున్నదనే భావం చివరి దీర్ఘ విరామచిహ్నంతో నిలుపబడ్డాయి. ‘పురుషుడు’ అనే పదం ఈ సుంక సందర్భంలోని אִישׁ యొక్క లింగసూచనను కాపాడుతుంది.
