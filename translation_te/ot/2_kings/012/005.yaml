revisions:
- from: 'యెహోయాషు యాజకులతో ఇలా అన్నాడు: “యహ్వే మందిరంలోకి తీసుకువచ్చే ప్రతిష్ఠిత అర్పణల డబ్బంతా—లెక్కించబడే ప్రతి పురుషుడు చెల్లించే డబ్బు[a], వ్యక్తుల విలువ నిర్ణయానికి సంబంధించిన డబ్బు[b], అలాగే యహ్వే మందిరంలోకి తీసుకురావాలని ఎవరి హృదయంలో స్వచ్ఛందంగా పుడుతుందో ఆ డబ్బంతా[c]—”'
  to: 'యెహోయాషు యాజకులతో ఇలా అన్నాడు: “యహ్వే మందిరంలోకి తీసుకురాబడే పవిత్రమైన వాటికి సంబంధించిన డబ్బంతా—లెక్కించబడే ప్రతి పురుషుడు చెల్లించే డబ్బు[a], వ్యక్తుల విలువ నిర్ణయానికి సంబంధించిన డబ్బు[b], అలాగే యహ్వే మందిరంలోకి తీసుకురావాలని ఒక మనిషి హృదయంలో ఉద్దేశించే డబ్బంతా[c]—”'
  rationale: కర్మణి క్రియారూపాన్ని స్పష్టపరచి, పవిత్రమైన వాటికి సంబంధించిన ధనం అనే విస్తృత భావాన్ని నిలిపి, హృదయ నుడికారాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అనువదించాం. జనగణన సుంకం మరియు విలువ నిర్ణయాల గురించిన సంభావ్య వివరణలు ప్రధాన పాఠంలో అతిగా నిర్దిష్టం కాకుండా పాదటిప్పణులలో అలాగే ఉంచబడ్డాయి.
