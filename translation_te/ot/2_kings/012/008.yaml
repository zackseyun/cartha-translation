id: 2KI.12.8
reference: 2 Kings 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: te
  text: 'అప్పుడు యెహోయాషు రాజు యాజకుడైన యెహోయాదాను, యాజకులను పిలిచి వారితో ఇలా అన్నాడు: “మీరు మందిరంలోని[a] పాడైన భాగాలను[b] ఎందుకు బాగుచేయడం లేదు? ఇప్పుడు మీ పరిచయస్థుల నుండి[c] డబ్బు తీసుకోకండి; దాన్ని మందిర మరమ్మతుల కోసం ఇవ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇల్లు’; ఇక్కడ అది యెహోవా మందిరాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘పాడైన భాగాలు’ అనే హీబ్రూ పదబంధాన్ని ‘పగుళ్లు,’ ‘దెబ్బతిన్న భాగాలు,’ లేదా ‘చేయవలసిన మరమ్మతులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హీబ్రూ పదం అర్థం నిర్ధారించడం కష్టం. దాన్ని ‘మీ పరిచయస్థులు’ అని అక్షరార్థానికి దగ్గరగా అనువదించవచ్చు; సందర్భంలో ‘దాతలు’ లేదా ‘చందా ఇచ్చేవారు’ అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించి
  rationale: ఈ కథన సందర్భంలో קרא అంటే తన దగ్గరకు పిలిపించడం లేదా రప్పించడం; ‘పిలిపించి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: యెహోయాషు రాజు
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా వ్యక్తి పేరు తర్వాత రాజ బిరుదు ఉంచబడింది.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: యాజకుడైన యెహోయాదాను, మిగతా యాజకులను
  rationale: హీబ్రూ మొదట యెహోయాదాను ప్రత్యేకంగా పేర్కొని, తర్వాత యాజకులను కలుపుతుంది. తెలుగులో సమూహ సంబంధం స్పష్టంగా ఉండేందుకు ‘మిగతా’ చేర్చబడింది; భావంలో కొత్త పాత్రను చేర్చదు.
- source_word: אֵינְכֶם מְחַזְּקִים
  choice: ఎందుకు మరమ్మతులు చేయడం లేదు?
  rationale: חזק యొక్క మౌలిక భావం ‘బలపరచడం’; בדק הביתతో కలిసినప్పుడు భవనానికి మరమ్మతులు చేయడాన్ని సూచిస్తుంది.
- source_word: בֶּדֶק הַבָּיִת
  choice: మందిరంలో పాడైన భాగాలు
  rationale: בדק అనేది పగులు, చెడిపోయిన స్థలం లేదా మరమ్మతు అవసరమైన భాగాన్ని సూచించగలదు. ‘పాడైన భాగాలు’ మరమ్మతు అవసరాన్ని సహజంగా తెలియజేస్తూ పదంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְעַתָּה
  choice: ఇకమీదట
  rationale: ఇది గద్దింపు నుంచి అమలులోకి వచ్చే కొత్త ఆదేశానికి మార్పును సూచిస్తుంది; సందర్భంలో ‘ఇకమీదట’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: డబ్బు తీసుకోకండి
  rationale: כֶּסֶף అక్షరార్థంగా వెండి అయినా, ఇక్కడ ఆలయ నిధులను సూచిస్తున్నందున ‘డబ్బు’ స్పష్టమైన ఎంపిక.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: మీకు పరిచయమున్నవారి దగ్గర
  rationale: מַכָּרֵיכֶם అర్థం కష్టమైనది. దాని సాధారణ సంబంధార్థమైన ‘మీకు పరిచయమున్నవారు’ను ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుగుణమైన ‘దాతలు/చందాదారులు’ అనే అవకాశాన్ని పాదసూచికలో తెలిపాం.
- source_word: כִּי
  choice: ;
  rationale: ఇక్కడ כִּי ముందటి నిషేధానికి విరుద్ధమైన సరిదిద్దే ఆదేశాన్ని ప్రవేశపెడుతుంది. తెలుగులో అర్ధవిరామం ద్వారా ఆ వ్యతిరేక-సంబంధం సహజంగా వ్యక్తమవుతుంది; ‘కాని’ అని స్పష్టీకరించడం తప్పనిసరి కాదు.
- source_word: לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: దాన్ని మందిర మరమ్మతుల కోసం ఇవ్వండి
  rationale: లామెద్ ఉద్దేశం లేదా గమ్యాన్ని సూచిస్తుంది; క్రియలోని ఏకవచన ప్రత్యయం ముందున్న డబ్బును సూచిస్తున్నందున ‘దాన్ని’ వాడబడింది.
theological_decisions:
- issue: הַבָּיִת అనే ‘ఇల్లు’ పదం యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో ‘మందిరం’
  alternative: ‘ఇల్లు’ అని ఉంచి పాదసూచికలో ఆలయమని వివరించడం
  rationale: ఈ అధ్యాయ సందర్భంలో ‘ఆ ఇల్లు’ యెహోవా ఆలయాన్ని స్పష్టంగా సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి తప్పుదారి పట్టకుండా ‘మందిరం’ వాడి, హీబ్రూ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. రాజు పలికిన ప్రశ్నలోని మందలింపును, తర్వాతి ఆదేశంలోని నేరుగా చెప్పే ధోరణిని నిలిపాం. క్లిష్టమైన מַכָּרֵיכֶם పదాన్ని సందర్భార్థంతో పూర్తిగా నిర్ధారించకుండా ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా దాని అనిశ్చితిని కాపాడాం.
