  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: te
  text: అప్పుడు యాజకులు తాము ప్రజల నుండి డబ్బు తీసుకోకూడదని, మందిరానికి కలిగిన నష్టాన్ని బాగుచేయకూడదని అంగీకరించారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “మందిరానికి కలిగిన నష్టాన్ని బలపరచకూడదని”; ఇది దెబ్బతిన్న మందిరాన్ని బాగుచేయడాన్ని సూచించే నుడికారం.'
    reason: lexical_alternative
  - marker: b
    text: మూలంలో “ఇల్లు” అని ఉంది; ఇక్కడ అది యెహోవా ఇంటిని, అంటే మందిరాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: అంగీకరించారు
  rationale: אבה అనే క్రియ ఇక్కడ సమ్మతి లేదా ఒప్పుకోవడాన్ని సూచిస్తుంది; తరువాతి రెండు నిషేధార్థక క్రియారూపాలతో ‘అంగీకరించారు’ సహజంగా సరిపోతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: మందిర నిర్వహణ సందర్భంలో כֹּהֲנִיםకు ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: לְבִלְתִּי קְחַת
  choice: తీసుకోకూడదని
  rationale: לְבִלְתִּיతో కూడిన క్రియారూపం చేయకూడదనే అంగీకారాన్ని వ్యక్తం చేస్తుంది.
- source_word: כֶּסֶף
  choice: డబ్బు
  rationale: పదశః ‘వెండి’ అయినా, ఈ ఆర్థిక-నిర్వహణ సందర్భంలో చెలామణి ధనం అనే భావం ప్రధానమైనది.
- source_word: מֵאֵת הָעָם
  choice: ప్రజల దగ్గర నుంచి
  rationale: మూలంలోని ‘ప్రజల నుండి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: బాగుచేయకూడదని
  rationale: חזק పదశః ‘బలపరచడం’; అయితే בֶּדֶק הַבַּיִתతో కలిసినప్పుడు దెబ్బతిన్న భాగాలను మరమ్మతు చేయడం అనే నుడికారార్థం వస్తుంది.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: మందిరానికి కలిగిన నష్టాన్ని
  rationale: בֶּדֶק చీలిక, దెబ్బ లేదా మరమ్మతు అవసరమైన నష్టాన్ని సూచిస్తుంది. הַבַּיִת ఈ సందర్భంలో యెహోవా మందిరాన్ని సూచిస్తుంది.
