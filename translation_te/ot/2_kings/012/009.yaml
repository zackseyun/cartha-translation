translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘డబ్బు’ పరిపాలనా సందర్భంలోని כֶּסֶף భావాన్ని అందిస్తుంది. ‘మందిరం’ సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తుంది; మూలంలోని ‘ఇల్లు’ రూపాన్ని పాదటిప్పణిలో నిలుపుతుంది.
