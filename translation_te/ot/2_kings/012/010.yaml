source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: te
  text: అప్పుడు యాజకుడైన యెహోయాదా ఒక పెట్టెను తీసుకొని, దాని మూతలో[b] ఒక రంధ్రం చేశాడు. యాహ్వే మందిరంలోకి ఒక మనిషి ప్రవేశించేటప్పుడు అతని కుడివైపున, బలిపీఠం పక్కన దానిని ఉంచాడు.[a] గడపను కాపాడే యాజకులు యాహ్వే మందిరంలోకి తీసుకురాబడిన వెండి[c] అంతటినీ ఆ పెట్టెలో ఉంచేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే మందిరంలోకి ప్రవేశించే వ్యక్తి కుడివైపున.” హీబ్రూలో అక్షరార్థంగా “ఒక మనిషి ప్రవేశించేటప్పుడు” అని ఉంది; ఇది ప్రవేశించే వ్యక్తి దృష్టికోణం నుండి కుడివైపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “దాని తలుపులో” అని ఉంది. ఈ సందర్భంలో అది పెట్టె మూతను లేదా తెరిచి మూయగల కప్పును సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “డబ్బు.” ‘వెండి’ అనే హీబ్రూ పదం ధనాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: పెట్టె
  rationale: ఈ సందర్భంలో ఆలయ నిధిని సేకరించే సాధారణ పెట్టె ఉద్దేశించబడింది; ‘మందసం’ వంటి పదాలకన్నా ‘పెట్టె’ ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיִּקֹּב חֹר
  choice: ఒక రంధ్రం చేశాడు
  rationale: נקב + חור అనేది రంధ్రం చేయడాన్ని సూచిస్తుంది. పనిముట్టు లేదా విధానాన్ని మూలం స్పష్టంగా చెప్పనందున సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: בְּדַלְתּוֹ
  choice: దాని మూతలో
  rationale: דלת సాధారణంగా ‘తలుపు’ అని అర్థమైనా, పెట్టె విషయంలో తెరిచి మూయగల పై కప్పు లేదా మూతను సూచించడం సందర్భోచితం.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్కన
  rationale: אצל సమీప స్థానాన్ని సూచిస్తుంది; ‘పక్కన’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: בימין
  choice: కుడివైపున
  rationale: లోపలికి ప్రవేశించే వ్యక్తి దృష్టికోణం నుండి పెట్టె ఉన్న స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: యాహ్వే మందిరంలోకి ఒక మనిషి ప్రవేశించేటప్పుడు
  rationale: אישׁ అనే ఏకవచన పదాన్ని నిలుపుతూ, ఇది లోపలికి ప్రవేశించే వ్యక్తి దృష్టికోణాన్ని తెలిపే సాధారణ నిర్దేశమని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֹׁמְרֵי הַסַּף
  choice: గడపను కాపాడే
  rationale: ‘గడప కాపలాదారులు’ అనే మూల భావాన్ని నిలుపుతూ యాజకుల ఆలయ ప్రవేశద్వార సంరక్షణ బాధ్యతను తెలియజేస్తుంది.
- source_word: כָּל הַכֶּסֶף
  choice: వెండి అంతటినీ
  rationale: כֶּסֶף అంటే అక్షరార్థంగా ‘వెండి’; అది ‘డబ్బు’ అనే విస్తృతార్థంలో కూడా వాడవచ్చు. ఇక్కడ విరాళాల భౌతిక రూపాన్ని ముందుగా నిలిపాం.
- source_word: הַמּוּבָא
  choice: తీసుకురాబడిన
  rationale: בוא యొక్క హోఫాల్ రూపంలోని నిష్క్రియ భావాన్ని సహజమైన తెలుగు సంబంధ వాక్యంతో నిలిపాం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు’ అయినప్పటికీ, ఆలయ సందర్భంలో ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలిపాం.
- issue: אִישׁ అనే పుంలింగ ఏకవచన నిర్దేశం
  choice: ఒక మనిషి ప్రవేశించేటప్పుడు
  alternative: ఎవరైనా ప్రవేశించేటప్పుడు
  rationale: ఈ పదబంధం సాధారణంగా ప్రవేశించే వ్యక్తిని సూచించినా, మూలంలోని ఏకవచన రూపాన్ని పూర్తిగా తొలగించకుండా ఉంచాం; ‘మనిషి’ ఇక్కడ ప్రతినిధి ఏకవచనంగా పనిచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘మందిరం,’ ‘బలిపీఠం,’ ‘యాజకుడు’ వంటి విస్తృతంగా అర్థమయ్యే ఆధ్యాత్మిక పదాలను ఉంచి, పాతబడిన లేదా అతిగా సంస్కృతీకృతమైన పదజాలాన్ని నివారించాం. పెట్టె స్థానం ప్రవేశించే వ్యక్తి దృష్టికోణం నుంచేనని తెలుగులో స్పష్టంచేశాం; అయితే మూలంలోని ప్రతినిధి ఏకవచనాన్ని పాదటిప్పణితో సహా నిలిపాం.
