revisions:
- from: అప్పుడు యాజకుడైన యెహోయాదా ఒక పెట్టెను తీసుకొని, దాని మూతలో[b] ఒక రంధ్రం చేశాడు. యాహ్వే మందిరంలోకి ఒక మనిషి ప్రవేశించేటప్పుడు అతనికి కుడివైపున ఉండేలా, బలిపీఠం పక్కన దానిని ఉంచాడు.[a] గడపను కాపాడే యాజకులు యాహ్వే మందిరంలోకి తీసుకురాబడిన వెండి[c] అంతటినీ ఆ పెట్టెలో వేసేవారు.
  to: అప్పుడు యాజకుడైన యెహోయాదా ఒక పెట్టెను తీసుకొని, దాని మూతలో[b] ఒక రంధ్రం చేశాడు. యాహ్వే మందిరంలోకి ఒక మనిషి ప్రవేశించేటప్పుడు అతని కుడివైపున, బలిపీఠం పక్కన దానిని ఉంచాడు.[a] గడపను కాపాడే యాజకులు యాహ్వే మందిరంలోకి తీసుకురాబడిన వెండి[c] అంతటినీ ఆ పెట్టెలో ఉంచేవారు.
  rationale: The revision makes the placement clause more direct and idiomatic while retaining the entrant-oriented right side expressed in Hebrew. It also corrects footnote a to singular language consistent with the Hebrew representative singular. Replacing ‘వేసేవారు’ with ‘ఉంచేవారు’ remains natural for contributions while more neutrally reflecting the Hebrew ‘put there.’
