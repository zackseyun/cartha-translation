translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హెబ్రీయ ‘చేతికి’ అనే చిత్రాన్ని ఉంచుతూ ‘అప్పగించారు’తో దాని భావాన్ని స్పష్టం చేశాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
