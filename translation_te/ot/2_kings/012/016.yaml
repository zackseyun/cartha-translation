id: 2KI.12.16
reference: 2 Kings 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֧א יְחַשְּׁב֣וּ אֶת הָ/אֲנָשִׁ֗ים אֲשֶׁ֨ר יִתְּנ֤וּ אֶת הַ/כֶּ֨סֶף֙ עַל יָדָ֔/ם לָ/תֵ֖ת לְ/עֹשֵׂ֣י הַ/מְּלָאכָ֑ה כִּ֥י בֶ/אֱמֻנָ֖ה הֵ֥ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: te
  text: అయితే పనివారికి ఇవ్వడానికి ఎవరి చేతికి ఆ డబ్బు అప్పగించారో, ఆ మనుష్యుల దగ్గర లెక్క అడగలేదు[a][b]; ఎందుకంటే వారు నమ్మకంగా వ్యవహరించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మనుష్యుల నుండి లెక్క తీసుకోలేదు.”
    reason: lexical_alternative
  - marker: b
    text: “ఎవరి చేతికి” అనేది ఏదైనా ఒకరి బాధ్యతకు అప్పగించడాన్ని సూచించే హెబ్రీయ భాషాప్రయోగం.
    reason: cultural_note
  - marker: c
    text: “నమ్మకంగా” అనే మాటను “నిజాయితీగా” లేదా “యథార్థతతో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: లెక్క అడగలేదు
  rationale: పియేల్ రూపం ఇక్కడ ఖాతాలను లెక్కించడం లేదా లెక్క అప్పగింపజేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘లెక్క అడగలేదు’ సహజంగా ఉండి, సందర్భంలోని ఆర్థిక జవాబుదారీతనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుష్యులు
  rationale: బహువచన నామవాచకం ఇక్కడ డబ్బు బాధ్యత పొందిన నిర్దిష్ట వ్యక్తులను సూచిస్తుంది; ‘మనుష్యులు’ మూలంలోని వ్యక్తి సూచనను నిలుపుతుంది.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: ఎవరి చేతికి ... అప్పగించారో
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అనే హెబ్రీయ భాషాప్రయోగం బాధ్యతగా అప్పగించడాన్ని సూచిస్తుంది. ‘చేతికి ... అప్పగించారు’ మూల చిత్రాన్నీ కార్యార్థాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: הַכֶּסֶף
  choice: డబ్బు
  rationale: כֶּסֶף అంటే వెండి లేదా ధనం కావచ్చు; ఆలయ మరమ్మతుల నిధుల సందర్భంలో ‘డబ్బు’ ఆధునిక పాఠకునికి ఉద్దేశిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: పనివారికి
  rationale: ఈ కృదంత పదబంధం పని చేస్తున్న వారిని సూచిస్తుంది. ‘పనివారు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉండి ఆ భావాన్ని అందిస్తుంది.
- source_word: בֶאֱמֻנָה
  choice: నమ్మకంగా
  rationale: ఈ సందర్భంలో אֱמוּנָה ధన నిర్వహణలో విశ్వసనీయత, నిజాయితీ, నిబద్ధతను సూచిస్తుంది. ‘నమ్మకంగా’ ప్రధాన భావాన్ని నిలుపుతూ ప్రత్యామ్నాయ నైతిక ఛాయలకు పాదసూచికలో చోటిస్తుంది.
- source_word: הֵם עֹשִׂים
  choice: వారు ... వ్యవహరించారు
  rationale: అక్షరార్థంగా ‘వారు చేస్తున్నారు’ అయినా, ఇక్కడ వారి కార్యనిర్వహణ తీరును సంగ్రహిస్తుంది. ‘వ్యవహరించారు’ తెలుగులో సందర్భానుగుణంగా సహజం.
