  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ שַׁלֻּ֣ם בֶּן יָבֵ֔שׁ וַ/יַּכֵּ֥/הוּ קָֽבָלְ עָ֖ם וַ/יְמִיתֵ֑/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: te
  text: అప్పుడు యాబేషు కుమారుడైన షల్లూము అతనికి విరోధంగా కుట్ర చేసి, ప్రజల ఎదుట[a] అతనిని కొట్టి, అతన్ని చంపి, అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బహిరంగంగా”; లేదా “సభ ఎదుట.” కָבָל־עָם అనే హీబ్రూ పదబంధం అర్థనిర్ణయం కష్టమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: అతనికి విరోధంగా కుట్ర చేసి
  rationale: రాజకీయ సందర్భంలో קשר రాజుకు వ్యతిరేకంగా కుట్ర చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఉండి శత్రుత్వపూరిత రాజకీయ భావాన్ని నిలుపుతుంది.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: యాబేషు కుమారుడైన షల్లూము
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించి, בן అనే వంశసంబంధాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేసింది.
- source_word: וַיַּכֵּהוּ
  choice: అతనిపై దెబ్బకొట్టి
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం. తరువాతి క్రియ మరణాన్ని స్పష్టంగా చెబుతుంది కాబట్టి, ఈ క్రియనే ‘చంపాడు’గా మార్చకుండా చర్యల క్రమాన్ని నిలిపింది.
- source_word: קָבָל־עָם
  choice: ప్రజల ఎదుట
  rationale: అర్థనిర్ణయం కష్టమైన ఈ పదబంధం ప్రజల సమక్షంలో జరిగిన బహిరంగ చర్యను సూచించే అవకాశం ఎక్కువ. మూలానికి దగ్గరగా ఉండే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చింది.
- source_word: וַיְמִיתֵהוּ
  choice: అతన్ని చంపి
  rationale: מות హిఫీల్ రూపం ‘మరణింపజేయడం/చంపడం’ అనే కారణార్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘చంపి’ స్పష్టంగా, సహజంగా ఉంటుంది; ముందరి దెబ్బకొట్టే క్రియతో కలపదు.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: מלך మరియు תחתיו కలయిక సింహాసన వారసత్వాన్ని సూచిస్తుంది. ‘అతని స్థానంలో రాజయ్యాడు’ సహజమైన తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
