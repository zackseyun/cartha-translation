  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని చర్యల క్రమం—కుట్ర చేయడం, దెబ్బకొట్టడం, చంపడం, రాజవడం—విడివిడిగా నిలుపబడింది.
