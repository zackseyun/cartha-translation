  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: అజర్యా చేసిన మిగిలిన కార్యాలు, మరియు అతడు చేసినదంతా యూదా రాజుల వృత్తాంతాల గ్రంథంలో[b] రాయబడి ఉన్నాయి[a] కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాయబడి ఉన్నాయి’ అనే మాటకు బదులుగా ‘నమోదు చేయబడి ఉన్నాయి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యూదా రాజుల వృత్తాంతాల గ్రంథం’ అనేది రాజుల గ్రంథమంతటా ప్రస్తావించబడే రాజసంబంధమైన అధికారిక నమోదులు లేదా వార్షిక వృత్తాంతాల మూలగ్రంథాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי עֲזַרְיָהוּ
  choice: అజర్యా చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనాసారాంశాల్లో వచ్చే సూత్రబద్ధమైన ప్రయోగం ఇది. דִּבְרֵי ఇక్కడ మాటలను కాక రాజు కార్యాలు/చర్యలను సూచిస్తుంది; తెలుగు సహజత్వం కోసం పేరుతో ‘చేసిన’ను జోడించి భావాన్ని స్పష్టం చేశాం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: విస్తృత అర్థమున్న హీబ్రూ సంబంధవాక్యాన్ని సహజమైన, సమగ్ర భావమిచ్చే తెలుగులో అనువదించాం.
- source_word: הֲלֹא
  choice: ఉన్నాయి కదా?
  rationale: మూలంలోని ప్రతిప్రశ్నను ప్రకటనగా మార్చకుండా, తెలుగులో సహజమైన ధృవీకరణాత్మక ప్రతిప్రశ్నగా నిలిపాం.
- source_word: הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: כְּתוּבִים యొక్క ప్రత్యక్ష అర్థమైన ‘వ్రాయబడినవి’ను సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ ఉన్నప్పటికీ, లిఖిత ఆధారాన్ని సూచించే తెలుగు ప్రయోగంలో ‘గ్రంథంలో’ సహజం.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల వృత్తాంతాల గ్రంథం
  rationale: ఇది రాజుల పాలనకు సంబంధించిన దినవృత్తాంతాలు లేదా అధికారిక వార్షిక నమోదుల గ్రంథశీర్షిక; ‘వృత్తాంతాలు’ ఆ చారిత్రక-అభిలేఖ అర్థాన్ని స్పష్టంగా అందిస్తుంది.
