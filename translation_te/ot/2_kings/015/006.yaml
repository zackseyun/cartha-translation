translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని సూత్రబద్ధ రాజపాలనాసారాంశ ధోరణినీ, ప్రతిప్రశ్న రూపాన్నీ నిలిపాం; మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు.
