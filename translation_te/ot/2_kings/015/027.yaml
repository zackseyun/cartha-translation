source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: te
  text: యూదా రాజైన అజర్యా పరిపాలనలో యాభై రెండవ సంవత్సరంలో, రెమల్యా కుమారుడు పెకహు షోమ్రోనులో ఇశ్రాయేలుకు రాజయ్యాడు; అతడు ఇరవై సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: పరిపాలనలో యాభై రెండవ సంవత్సరంలో
  rationale: ఇది రాజుల పరిపాలన సంవత్సరాన్ని సూచించే ప్రామాణిక హీబ్రూ కాలనిర్ణయ సూత్రం. తెలుగులో సహజంగా అర్థమయ్యేలా ‘పరిపాలనలో ... సంవత్సరంలో’ అని అనువదించబడింది.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన అజర్యా
  rationale: అజర్యా యూదా రాజు అనే బిరుదును స్పష్టంగా ఉంచుతూ, కాలనిర్ణయ వాక్యంతో సహజంగా అనుసంధానించబడింది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజవంశ వృత్తాంతంలో క్రియ సింహాసనారోహణను సూచిస్తుంది. తరువాత వచ్చే పరిపాలనా కాలవ్యవధి నుంచి దీనిని వేరుచేయడానికి ‘రాజయ్యాడు’ అనేది సరైన ఎంపిక.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: రెమల్యా కుమారుడు పెకహు
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని నేరుగా నిలుపుతూ, తెలుగులో సహజమైన పదక్రమాన్ని వాడింది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: מָלַךְ తో కూడిన עַל ప్రజలపై లేదా రాజ్యంపై పరిపాలనను సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలుకు రాజయ్యాడు’ సహజమైన రాజవృత్తాంత ప్రయోగం.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: ఇది పరిపాలనా కేంద్రాన్ని సూచించే స్థలవాచక పదబంధం. మూల హీబ్రూ పేరుకు దగ్గరగా ‘షోమ్రోను’ రూపం తీసుకోబడింది.
- source_word: עֶשְׂרִים שָׁנָה
  choice: ఇరవై సంవత్సరాలు
  rationale: పెకహు పరిపాలించిన కాలవ్యవధిని నేరుగా అనువదిస్తుంది.
