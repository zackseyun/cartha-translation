  terminology: అజర్యా, పెకహు, రెమల్యా, షోమ్రోను అనే పేర్లు హీబ్రూ రూపాలకు మరియు తెలుగు బైబిలు వినియోగానికి అనుకూలంగా ఉన్నాయి. ‘పరిపాలన’ మరియు ‘రాజయ్యాడు’ అనే పదజాలం మూలంలోని రాజ్యారంభం/పరిపాలనా-కాలం భేదాన్ని కాపాడుతుంది.
