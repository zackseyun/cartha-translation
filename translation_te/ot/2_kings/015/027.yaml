  source_fidelity: 'హీబ్రూ రాజవంశ-కాలనిర్ణయ సూత్రంలోని అన్ని ప్రధానాంశాలు సరిగ్గా ప్రతిఫలించాయి: అజర్యా పరిపాలన యాభై రెండవ సంవత్సరం, రెమల్యా కుమారుడైన పెకహు సింహాసనారోహణ, ఇశ్రాయేలుపై అతని రాజ్యం, షోమ్రోను స్థానం, ఇరవై సంవత్సరాల పరిపాలన. ‘రాజయ్యాడు’ సింహాసనారోహణను, ‘పరిపాలించాడు’ కాలవ్యవధిని తగినట్లుగా వేరుచేస్తున్నాయి.'
