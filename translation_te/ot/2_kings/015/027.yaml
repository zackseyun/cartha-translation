translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజవంశ వృత్తాంతానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. సింహాసనారోహణకు ‘రాజయ్యాడు’, పరిపాలనా వ్యవధికి ‘పరిపాలించాడు’ వాడి మూలంలోని భావభేదాన్ని నిలిపింది.
