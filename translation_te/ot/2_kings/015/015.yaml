  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י שַׁלּ֔וּם וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הִנָּ֣/ם כְּתֻבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: te
  text: షల్లూము చేసిన మిగిలిన కార్యాలు, అతడు పన్నిన కుట్ర[a]—ఇదిగో[b], అవి ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతడు కుట్రపన్నిన కుట్ర’ అన్నట్లుగా ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలిసి వచ్చి భావానికి బలం చేకూరుస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇదిగో, అవి రాయబడి ఉన్నాయి’ అనేది రాజరిక దస్తావేజులవైపు పాఠకుని చూపించే సూత్రప్రాయమైన ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: ఇది రాజుల గ్రంథమంతటా ప్రస్తావించబడే అధికారిక రాజరిక దినవృత్తాంతాలు లేదా ఆధారపత్రాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: షల్లూము చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనసంబంధిత సారాంశ సూత్రంలో דִּבְרֵי అనేది మాటలను మాత్రమే కాక, రాజు చేసిన కార్యాలు లేదా వ్యవహారాలను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేయడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: అతడు పన్నిన కుట్ర
  rationale: קשר నామవాచకం రాజకీయ కుట్రను సూచిస్తుంది. హీబ్రూలోని సమానమూల నామ–క్రియా పునరుక్తిని తెలుగులో యథాతథంగా ఉంచితే కృత్రిమంగా ఉంటుంది; ‘పన్నిన కుట్ర’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: ఈ పదంలో సూచనాత్మక అవధానార్థంతో పాటు బహువచన సర్వనామ బలం ఉంది. ‘ఇదిగో, అవి’ ఆ సూత్రప్రాయ సూచనను కాపాడుతుంది.
- source_word: כְּתֻבִים
  choice: రాయబడి ఉన్నాయి
  rationale: మూలంలోని నిష్క్రియార్థక కృదంతాన్ని సహజమైన తెలుగు సంపూర్ణ స్థితి రూపంలో అందిస్తుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో
  rationale: ఇది రాజరిక ఆధారగ్రంథానికి వాడే సూత్రప్రాయ శీర్షిక. עַל ను పుస్తకంలో నమోదు చేయబడిన విషయానికి అనుగుణంగా ‘గ్రంథంలో’ అని సహజంగా అనువదించాం; לְ సంబంధార్థాన్ని ‘రాజుల’ ద్వారా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘దినవృత్తాంతాలు’ అధికారిక రాజరిక చరిత్రల భావాన్ని ఇస్తుంది. మూలంలోని అవధాన సూచకమైన הִנָּם ను వదలకుండా ‘ఇదిగో’గా నిలిపాం; హీబ్రూ సమానమూల పునరుక్తిని ప్రధాన వాక్యంలో సహజీకరించి పాదటిప్పణిలో వివరించాం.
