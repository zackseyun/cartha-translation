  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: te
  text: యోతాము తన పితరులతో నిద్రించాడు; అతడు తన పితరులతో కూడ తన పూర్వికుడైన దావీదు నగరంలో సమాధి చేయబడ్డాడు.[a][b] అతని కుమారుడైన ఆహాజు అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో’ను ‘తన పూర్వికులతో’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ఇది రాజు మరణాన్ని తెలిపే సంప్రదాయ సూత్రప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘తన పూర్వికుడైన దావీదు’లో దావీదు యోతాముకు తక్షణ తండ్రి కాదు; దావీదు వంశానికి చెందిన పూర్వికుడు అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: שׁכב అనే క్రియ ‘తన పితరులతో’ అనే పదబంధంతో కలిసి రాజుల మరణాన్ని సూచించే సంప్రదాయ సూత్రప్రయోగం. తెలుగు బైబిలు శైలిలో ‘నిద్రించాడు’ మూలంలోని రూపకాన్ని నిలుపుతూ, తరువాతి సమాధి వాక్యం మరణార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: ఇది రాజుల మరణవార్తల్లో కనిపించే స్థిరమైన పూర్విక సంబంధ పదబంధం. ‘పూర్వికులతో’ కంటే ‘పితరులతో’ హీబ్రూ రూపానికి దగ్గరగా ఉండి, గౌరవప్రదమైన తెలుగు శైలికి సరిపోతుంది.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: హీబ్రూ క్రియలోని కర్మణి రూపాన్ని నిలుపుతూ సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: తన పితరుడైన దావీదు నగరంలో
  rationale: ఆబీవ్ అనే బంధుత్వ పదాన్ని వంశపూర్విక అర్థంలో ‘పితరుడు’గా ఇచ్చి, దావీదు యోతాము తక్షణ తండ్రి కాదనే భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; ‘దావీదు నగరం’ అనే స్థలనామ రూపాన్ని నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ సందర్భంలో מלך కొత్త రాజు అధికారంలోకి రావడాన్ని సూచిస్తుంది. ‘పాలించాడు’ కూడా సాధ్యమే, కాని ‘అతని స్థానంలో రాజయ్యాడు’ succession భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: పాలనా వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు చేపట్టడం అనే హీబ్రూ భావాన్ని సూటిగా అందిస్తుంది.
theological_decisions:
- issue: ‘దావీదు అతని తండ్రి’లో తండ్రి అనే పదం అర్థం
  choice: తక్షణ జనకుడు కాక వంశపూర్వికుడు
  alternative: తక్షణ తండ్రి
  rationale: యోతాము తక్షణ తండ్రి ఉజ్జియా/అజర్యా; అందువల్ల ఇక్కడ אָבִיו దావీదు వంశంలోని పూర్విక సంబంధాన్ని సూచిస్తుంది. అనువాదం ఆ వంశసంబంధ భావాన్ని ‘పితరుడు’ ద్వారా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక కథన శైలి. ‘పితరులు’, ‘సమాధి చేయబడ్డాడు’ వంటి పదాలు మూలంలోని రాజవంశ మరణసూత్రాన్ని నిలుపుతాయి; ‘రాజయ్యాడు’ సాధారణ పాఠకుడికి సహజంగా ఉంటుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
