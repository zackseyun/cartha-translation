revisions:
- from: యోతాము తన పితరులతో నిద్రించి, తన పితరులతోపాటు తన పితరుడైన దావీదు నగరంలో సమాధి చేయబడ్డాడు.[a][b] అతని కుమారుడు ఆహాజు అతని స్థానంలో రాజయ్యాడు.
  to: యోతాము తన పితరులతో నిద్రించాడు; అతడు తన పితరులతో కూడ తన పూర్వికుడైన దావీదు నగరంలో సమాధి చేయబడ్డాడు.[a][b] అతని కుమారుడైన ఆహాజు అతని స్థానంలో రాజయ్యాడు.
  rationale: The revision preserves each element of the Hebrew royal formula while correcting the Telugu syntax. It retains the two occurrences of ‘with his fathers,’ keeps the passive burial expression, and makes the dynastic relationship to David explicit in the main text without adding interpretation beyond the necessary ancestral sense. Footnote markers remain present and correspond to their notes.
