  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో సరైనది చేశాడు; తన తండ్రి అమజ్యా చేసినదంతా అనుసరించి చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనంలోని తదుపరి చర్యను తెలియజేస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ఆరంభంలోని ‘మరియు’ అవసరం లేదు.
- source_word: הַיָּשָׁר
  choice: సరైనదే
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న విశేషణం ఇక్కడ నామవాచకార్థంలో ‘సరైనది/న్యాయమైనది’ అని పనిచేస్తుంది; రాజుల ప్రవర్తనను అంచనా వేసే సూత్రవాక్యంలో ‘సరైనదే’ సహజంగా ఉంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: ఇది యెహోవా అంచనా లేదా దృక్కోణాన్ని సూచించే హీబ్రూ నుడికారం. ‘దృష్టిలో’ మూలంలోని కంటి రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: చేసినదంతా అనుసరించి
  rationale: ఈ పదబంధం తండ్రి చేసిన కార్యాలన్నిటితో కుమారుని ప్రవర్తన సరిపోలినదని సూచిస్తుంది. తెలుగు వాక్యక్రమంలో ఈ భావం స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని సాధారణ తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: సమీప వంశావళి సందర్భంలో ఇది పూర్వికుణ్ణి కాక అతని ప్రత్యక్ష తండ్రినే సూచిస్తుంది. కర్తను తిరిగి సూచించేందుకు తెలుగులో ‘తన’ సహజం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపాం; ఆధునిక సాధారణ తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: రాజు చేసినది ‘సరైనది’ అనే మూల్యాంకనం
  choice: యెహోవా దృష్టిలో సరైనదే
  alternative: యెహోవా ఎదుట యథార్థమైనది
  rationale: మూలంలోని ప్రమాణం మానవ లేదా సంపూర్ణ నైతిక అంచనా కాదు; యెహోవా దృక్కోణంలో చేసిన మూల్యాంకనం. అందువల్ల ఆ సంబంధాన్ని స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది. హీబ్రూ రాజవృత్తాంత సూత్రవాక్యంలోని మూల్యాంకన భావాన్ని నిలుపుతూ తెలుగు వాక్యక్రమాన్ని సహజంగా మార్చాం.
