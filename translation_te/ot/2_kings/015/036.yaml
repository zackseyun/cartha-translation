source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: యోతాము చేసిన మిగిలిన కార్యాలు యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[b] రాయబడి[a] ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాయబడి’ అనే దానికి బదులు ‘నమోదు చేయబడి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి అక్షరార్థం ‘రాయబడి’; ఇక్కడ కార్యాలు అధికారిక రాజవృత్తాంతంలో నమోదు చేయబడ్డాయనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దినవృత్తాంతాల గ్రంథం’ అనేది రాజులకు సంబంధించిన అధికారిక వృత్తాంత మూలాన్ని సూచిస్తుంది; అది బైబిలులోని దినవృత్తాంతాల గ్రంథమేనని తప్పనిసరిగా భావించకూడదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם אֲשֶׁר עָשָׂה
  choice: యోతాము చేసిన మిగిలిన కార్యాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; ఈ రాజవృత్తాంత ముగింపు సూత్రంలో דִּבְרֵי ... אֲשֶׁר עָשָׂה అనేది రాజు చేసిన కార్యాలను సూచిస్తుంది. సహజమైన తెలుగు కోసం సంబంధవాచక నిర్మాణాన్ని ‘యోతాము చేసిన’గా ముందుకు తెచ్చాం.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: הֲלֹא సానుకూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్న. ‘ఉన్నాయి కదా?’ దాని ప్రశ్నారూపాన్నీ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది; כְּתוּבִים యొక్క అక్షరార్థమైన ‘రాయబడిన’ భావాన్ని కూడా ఉంచుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినా, ఒక పత్రసంకలనంలో నమోదు చేయబడిందనే భావానికి తెలుగులో ‘గ్రంథంలో’ సహజం.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: דִּבְרֵי הַיָּמִים ఇక్కడ రాజులకు సంబంధించిన వార్షిక/చారిత్రక అధికారిక నమోదులను సూచిస్తుంది. ‘దినవృత్తాంతాలు’ మూలపదబంధాన్ని ప్రతిబింబిస్తూ ఈ పత్రస్వభావాన్ని తెలియజేస్తుంది.
- source_word: יוֹתָם
  choice: యోతాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘దినవృత్తాంతాల గ్రంథం’ ఏ గ్రంథాన్ని సూచిస్తుంది?
  choice: రాజకీయ అధికారిక వృత్తాంత మూలంగా అనిశ్చితిని నిలుపడం
  alternative: బైబిలులోని ‘దినవృత్తాంతములు’ గ్రంథంతో నేరుగా సమీకరించడం
  rationale: వాక్యం ఒక రాజవంశ చరిత్రాధారాన్ని ఉటంకిస్తుంది; అది ప్రస్తుతం బైబిలులో ఉన్న దినవృత్తాంతాల గ్రంథమేనని మూలపాఠం నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ అలంకార ప్రశ్నను ‘ఉన్నాయి కదా?’తో నిలిపి, అనవసరమైన ప్రారంభ సంధానపదాన్ని చేర్చలేదు.
