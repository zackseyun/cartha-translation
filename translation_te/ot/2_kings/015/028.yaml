source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డదాన్ని చేశాడు. నెబాతు కుమారుడైన యరొబాము పాపాలనుండి అతడు తొలగిపోలేదు; యరొబాము ఇశ్రాయేలును పాపం చేయించినవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: అతడు చెడ్డదాన్ని చేశాడు
  rationale: రాజుల పాలనను అంచనా వేసే స్థిరమైన హీబ్రూ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కథన వావ్‌ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దేవుని అంచనాను సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం; ‘కళ్లలో’ అనే కఠిన పదానువాదం కంటే ‘దృష్టిలో’ స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: לֹא סָר מִן חַטֹּאות
  choice: పాపాలనుంచి అతడు తొలగిపోలేదు
  rationale: סור מן యొక్క ‘విడిచిపెట్టు/దూరమవు’ భావాన్ని, గత పాపాచరణను కొనసాగించాడనే అర్థంతో సహజంగా తెలుపుతుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడు యరొబాము
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేసేలా చేసిన
  rationale: חטא యొక్క హిఫీల్ కారణార్థక రూపాన్ని నిలుపుతూ, యరొబాము బాధ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఒడంబడిక నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచింది. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితంగా లేనందున, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: యరొబాము ఇశ్రాయేలును పాపంలోకి నడిపించిన విధానం
  choice: పాపం చేసేలా చేసిన
  alternative: పాపం చేయించాడు
  rationale: హీబ్రూ కారణార్థక క్రియను నేరుగా నిలుపుతుంది; బలవంతం చేశాడా లేక ప్రభావితం చేశాడా అనే విధానాన్ని మూలం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, స్పష్టమైన కథన శైలి. రాజుల గ్రంథంలోని స్థిరమైన పాలనా-మూల్యాంకన సూత్రాన్ని సహజంగా ఉంచుతూ, దైవనామాన్ని లిప్యంతరీకరించింది.
