  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: te
  text: అయితే ఉన్నత స్థలాలు తొలగించబడలేదు. ప్రజలు ఇంకా ఆ ఉన్నత స్థలాల్లో బలులు అర్పిస్తూ, అర్పణలను కాల్చి పొగగా పైకి లేపుతూ[a] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధూపం వేస్తూ.” హీబ్రూ క్రియ ప్రత్యేకంగా ధూపం వేయడాన్ని గానీ, మరింత విస్తృతంగా ఒక అర్పణను కాల్చి పొగగా పైకి లేపడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: మునుపటి అనుకూల మూల్యాంకనానికి మినహాయింపును సూచించే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: స్థానిక ఆరాధనా స్థలాలను సూచించే చారిత్రక-మతపరమైన పదబంధాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: ఉన్నత స్థలాలు అలాగే మిగిలిపోయాయనే హీబ్రూ ప్రయోగార్థాన్ని తెలుగులో సహజమైన కర్మణి రూపంలో అందిస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ప్రజల ఆరాధనా చర్యలు కొనసాగుతూనే ఉన్నాయని సూచిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఆరాధనా క్రియల్లో పాల్గొంటున్న జనసమూహాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: מְזַבְּחִים
  choice: బలులు అర్పిస్తూ
  rationale: זבח అనే క్రియలోని బలి అర్పణ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּמְקַטְּרִים
  choice: అర్పణలను కాల్చి పొగగా పైకి లేపుతూ
  rationale: క్రియను కేవలం ధూపం వేయడానికే పరిమితం చేయకుండా, అర్పణను కాల్చి పొగగా పైకి లేపే విస్తృత ఆరాధనా భావాన్ని నిలుపుతుంది; సాధ్యమైన ప్రత్యేక అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: בַּבָּמוֹת
  choice: ఆ ఉన్నత స్థలాల్లో
  rationale: ఆరాధనా చర్యలు జరిగిన స్థలాన్ని తెలుగులో సహజమైన స్థానవాచక రూపంలో సూచిస్తుంది.
theological_decisions:
- issue: ఉన్నత స్థలాల్లో జరిగిన ఆరాధన స్వభావం
  choice: అనుమతి లేని స్థానిక ఆరాధన కొనసాగిందని మాత్రమే వచనం చెప్పేలా అనువదించడం; అది తప్పనిసరిగా విగ్రహారాధనే అని పేర్కొనకపోవడం
  alternative: అక్కడి ప్రతి ఆరాధనా చర్యను స్పష్టమైన విగ్రహారాధనగా అనువదించడం లేదా అది యెహోవాకే చేసిన ఆరాధన అని నిర్ధారించడం
  rationale: ఈ వచనం బలులు, పొగగా పైకి లేపిన అర్పణలను పేర్కొంటుంది గాని అవి ఏ దేవతకు అర్పించబడ్డాయో చెప్పదు. అందువల్ల మూలపాఠంలోని నియంత్రిత అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ఉన్నత స్థలాలు’ అనే చారిత్రక-ఆరాధనా పదబంధాన్ని నిలిపి, అరుదైన హీబ్రూ ఆరాధనా క్రియను ప్రధాన పాఠ్యంలో వివరణాత్మకంగా, పాదసూచికలో సంక్షిప్త ప్రత్యామ్నాయంతో అందించాం.
