source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: te
  text: అప్పుడు అతని అధికారి[a] అయిన రెమల్యా కుమారుడు పెకహు అతనికి వ్యతిరేకంగా కుట్ర చేసి, షోమ్రోనులోని రాజప్రాసాద దుర్గంలో[b] అర్గోబుతోను అర్యేతోను[c] కలిసి అతనిని కొట్టి పడగొట్టాడు. పెకహుతో పాటు గిలాదీయుల్లోనుంచి యాభై మంది ఉన్నారు. పెకహు అతన్ని చంపి, అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సైన్యాధిపతి.’ హీబ్రూ పదం ఉన్నతస్థాయి సైనిక అధికారిని సూచిస్తుంది; అయితే ఖచ్చితమైన హోదా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాజప్రాసాదంలో’ లేదా ‘రాజనివాసపు కోటలో.’ హీబ్రూ పదబంధం ప్రాసాదం లేదా దుర్గీకృత రాజనివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘అర్యే’ అనే హీబ్రూ పదానికి సాధారణంగా ‘సింహం’ అని అర్థం; ఇక్కడ అర్గోబుతో పాటు పేర్కొన్న వ్యక్తిపేరుగా తీసుకున్నాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: అతనికి వ్యతిరేకంగా కుట్ర చేసి
  rationale: రాజకీయ సందర్భంలో קשר రాజద్రోహపూర్వక కుట్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వ్యతిరేకంగా కుట్ర చేయడం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שָׁלִישׁוֹ
  choice: అతని అధికారి
  rationale: ఇది ఉన్నతస్థాయి సైనిక అధికారిని సూచించవచ్చు; ఖచ్చితమైన హోదా అనిశ్చితంగా ఉన్నందున సాధారణమైన ‘అధికారి’ని ఎంచుకున్నాం.
- source_word: וַיַּכֵּהוּ
  choice: అతనిపై దాడి చేశాడు
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం; తరువాత וַיְמִיתֵהוּ ద్వారా మరణం ప్రత్యేకంగా చెప్పబడినందున ఇక్కడే ‘చంపాడు’ అని అనువదించలేదు.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: రాజభవనపు కోటలో
  rationale: אַרְמוֹן రాజప్రాసాదం లేదా పటిష్ఠమైన రాజనివాసాన్ని సూచించగలదు. ‘రాజభవనపు కోట’ అనే రూపం రెండు భావాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: అర్గోబు, అర్యేలతో కలిసి
  rationale: సమాంతర నిర్మాణం, ప్రత్యక్ష కర్మ సూచికల కారణంగా రెండింటినీ వ్యక్తిపేర్లుగా పరిగణించాం; אַרְיֵה యొక్క సాధారణ అర్థమైన ‘సింహం’ను ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: పెకహుతో పాటు గిలాదీయుల్లోనుంచి యాభై మంది ఉన్నారు
  rationale: מִן లోని విభాగార్థాన్ని ‘లోనుంచి’ నిలుపుతుంది; దీర్ఘ వాక్యంలో సర్వనామ సందిగ్ధతను తగ్గించేందుకు పెకహు పేరును మళ్లీ వాడాం.
- source_word: וַיְמִיתֵהוּ
  choice: అతడు అతన్ని చంపి
  rationale: హిఫీల్ రూపం మరణింపజేయడం అనే కారణార్థాన్ని ఇస్తుంది; సహజ తెలుగులో ‘చంపి’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: ఇది రాజుల గ్రంథంలోని సాధారణ వారసత్వ సూత్రం; తెలుగులో ‘స్థానంలో రాజయ్యాడు’ సహజమైన వ్యక్తీకరణ.
