    rationale: a గుర్తు పెకహు పేరుకు జతచేయబడింది, కానీ గమనిక శాలీష్/‘అధికారి’ని వివరిస్తుంది; b మరియు c గుర్తులు వాక్యాంతంలో ఉన్నాయి. పాఠకునికి ఏ పదానికి గమనిక వర్తిస్తుందో స్పష్టంగా ఉండేందుకు వాటిని సంబంధిత పదబంధాల వెంట ఉంచాలి.
