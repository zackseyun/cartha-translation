translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. వ్యక్తిపేర్లను తెలుగు బైబిలు ధ్వని సంప్రదాయానికి దగ్గరగా లిప్యంతరీకరించాం.
