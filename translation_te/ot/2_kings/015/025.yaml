  verdict: revise
  source_fidelity: ‘అతనిపై దాడి చేశాడు’ నכה యొక్క ‘కొట్టడం/కొట్టి పడగొట్టడం’ అనే నిర్దిష్ట క్రియను కొంత సాధారణీకరిస్తుంది. ‘అతనిని కొట్టి పడగొట్టాడు’ మూలంలోని దాడి-క్రియను, తరువాతి ‘చంపి’తో ఉన్న క్రమభేదాన్ని మెరుగుగా నిలుపుతుంది. అర్గోబు, అర్యేలను పెకహుతో ఉన్నవారిగా చూపే ‘కలిసి’ అనే పఠనాన్ని నిలుపుతూ, వాక్యాన్ని స్పష్టంగా చేశాం.
  naturalness: ‘రాజభవనపు కోట’ కొద్దిగా అసహజమైన, పునరుక్తి కలిగిన సమాసం. ‘రాజప్రాసాద దుర్గం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, אַרְמוֹן యొక్క ప్రాసాద/దుర్గ భావవ్యాప్తిని తగినంతగా ప్రతిబింబిస్తుంది. సర్వనామాలకన్నా చివరి చర్యల్లో ‘పెకహు’ను పునరుక్తి చేయడం స్పష్టతను పెంచుతుంది.
  terminology: పెకహు, రెమల్యా, షోమ్రోను, గిలాదీయులు, అర్గోబు, అర్యే అనే పేర్లను నిలిపాం. שָׁלִישׁకు అనిశ్చితమైన హోదాను అధికంగా నిర్దేశించకుండా ‘అధికారి’గా ఉంచాం. మూడు గమనికల గుర్తులను సంబంధిత పదబంధాల వద్దకు మార్చాం.
