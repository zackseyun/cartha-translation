source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב עֲזַרְיָה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ יוֹתָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: te
  text: అజర్యా తన పితరులతో నిద్రించాడు[a]. అతన్ని అతని పితరులతో కలిసి దావీదు నగరంలో పాతిపెట్టారు. అతని కుమారుడు యోతాము అతని స్థానంలో రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన పూర్వీకులతో.’ ‘తన పితరులతో నిద్రించాడు’ అనేది మరణాన్ని సూచించే హీబ్రూ సంప్రదాయ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: మరణాన్ని సూచించే హీబ్రూ సౌమ్యోక్తిని ‘నిద్రించాడు’ అని ఉంచడం ద్వారా రాజవృత్తాంతపు సంప్రదాయ సూత్రాన్ని కాపాడుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: ‘పితరులు’ అనే పదం మూలంలోని తరాల సంబంధాన్ని, రాజుల మరణవృత్తాంతంలో వచ్చే స్థిరమైన ప్రయోగాన్ని నిలుపుతుంది; ఆధునిక పాఠకునికి వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: మూలంలోని కర్తను పేర్కొనని బహువచన క్రియను తెలుగులో సహజమైన అనిర్దిష్ట బహువచన రూపంతో నిలుపుతుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: స్థలనామాన్ని స్పష్టంగా, సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ సందర్భంలో క్రియకు రాజ్యాధికారం చేపట్టడం అనే ఆరంభ భావం ఉంది; ‘రాజయ్యాడు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: కాలక్రమాన్ని మాత్రమే కాక, రాజపదవిలో వారసత్వాన్ని కూడా నేరుగా వ్యక్తపరుస్తుంది.
