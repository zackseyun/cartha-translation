revisions:
- from: అజర్యా తన పితరులతో కూడ నిద్రించాడు[a]. అతన్ని దావీదు నగరంలో అతని పితరులతో కూడ పాతిపెట్టారు. అతని కుమారుడు యోతాము అతని స్థానంలో రాజయ్యాడు.
  to: అజర్యా తన పితరులతో నిద్రించాడు[a]. అతన్ని అతని పితరులతో కలిసి దావీదు నగరంలో పాతిపెట్టారు. అతని కుమారుడు యోతాము అతని స్థానంలో రాజుగా పరిపాలించాడు.
