translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని చర్యల క్రమం, సమరయ అనే స్థలనామ పునరుక్తి నిలిపాం; సందర్భాన్ని ‘తిరుగుబాటు’ లేదా ‘దండయాత్ర’గా వ్యాఖ్యానించి పాఠ్యంలో చేర్చలేదు.
