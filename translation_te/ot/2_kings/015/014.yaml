id: 2KI.15.14
reference: 2 Kings 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: te
  text: అప్పుడు గాదీ కుమారుడైన మెనహేము తిర్సా నుండి పైకి వెళ్లి సమరయకు వచ్చాడు. అతడు సమరయలో యాబేషు కుమారుడైన షల్లూమును కొట్టి చంపి, అతని స్థానంలో రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: బయలుదేరి
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లాడు’ అనే భావం ఉన్నా, ఇక్కడ ప్రయాణాన్ని తెలిపే సహజ తెలుగు వాక్యనిర్మాణంలో ‘బయలుదేరి’ అని ఇచ్చాం. సైనిక దండయాత్ర అని పాఠ్యంలో స్పష్టంగా లేని భావాన్ని చేర్చలేదు.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: గాదీ కుమారుడైన మెనహేము
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగులో ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: מִתִּרְצָה
  choice: తిర్సా నుండి
  rationale: מן ఉపసర్గ సూచించే బయలుదేరిన స్థలాన్ని ‘నుండి’తో నేరుగా అనువదించాం.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: సమరయకు వచ్చాడు
  rationale: בוא క్రియతో కూడిన స్థలనామాన్ని సహజమైన ఆధునిక తెలుగులో ‘కు వచ్చాడు’గా ఇచ్చాం.
- source_word: וַיַּךְ אֶת ... וַיְמִיתֵהוּ
  choice: కొట్టి చంపి
  rationale: నכה (‘కొట్టాడు’) మరియు מות హిఫిల్ (‘అతణ్ణి చంపాడు/మరణింపజేశాడు’) అనే వరుస క్రియలను సంక్షిప్తంగా అయినా రెండింటి భావం నిలిచేలా ‘కొట్టి చంపి’గా అనువదించాం.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: యాబేషు కుమారుడైన షల్లూమును
  rationale: వ్యక్తినామాలను తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా ఇచ్చి, కర్మవిభక్తిని సహజంగా జోడించాం.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: ב ఉపసర్గ తెలిపే సంఘటన స్థలాన్ని ‘లో’తో వ్యక్తం చేసి, హీబ్రూలోని స్థలనామ పునరుక్తిని నిలిపాం.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: מלך ఇక్కడ హత్య అనంతర రాజ్యాధికార స్వీకరణను సూచిస్తుంది. ‘అతని స్థానంలో రాజయ్యాడు’ అనేది సహజమైన తెలుగు; תַּחְתָּיו తెలిపే ప్రత్యామ్నాయ వారసత్వ భావాన్ని స్పష్టంగా ఉంచుతుంది.
