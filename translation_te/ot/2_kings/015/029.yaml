revisions:
- from: ఇశ్రాయేలు రాజైన పెకహు కాలంలో, అష్షూరు రాజైన తిగ్లత్‌-పిలేసెరు వచ్చి ఈయోను, ఆబేలు-బేత్‌-మయకా, యానోహు, కెదెషు, హాసోరు, గిలాదు, గలిలయ—అంటే నఫ్తాలి దేశమంతటినీ—పట్టుకొని, అక్కడి ప్రజలను అష్షూరుకు చెరగా తీసుకుపోయాడు.[a]
