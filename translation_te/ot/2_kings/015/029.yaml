  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. స్థలనామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ‘అష్షూరు’ రూపం אַשּׁוּר లోని ద్విత్వ శ్ ధ్వనిని సూచిస్తుంది.
