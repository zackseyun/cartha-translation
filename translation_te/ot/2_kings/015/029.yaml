reference: 2 Kings 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన పెకహు కాలంలో, అష్షూరు రాజైన తిగ్లత్‌-పిలేసెరు వచ్చి ఈయోను, ఆబేలు-బేత్‌-మయకా, యానోహు, కెదెషు, హాసోరు, గిలాదు, గలిలయ, నఫ్తాలి దేశమంతటినీ స్వాధీనం చేసుకొని, అక్కడి ప్రజలను అష్షూరుకు చెరగా తీసుకుపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని అష్షూరుకు ప్రవాసానికి తరలించాడు”; “వారిని అష్షూరుకు బలవంతంగా తరలించాడు.”
    reason: గלה క్రియ యొక్క హిఫిల్ రూపం చెరగా తీసుకుపోవడం, ప్రవాసానికి తరలించడం లేదా బలవంతంగా తరలించడం అనే అర్థాలను కలిగి ఉంది.
lexical_decisions:
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: ఈ చారిత్రక కాలసూచక పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా, మూలార్థానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: בָּא
  choice: వచ్చి
  rationale: మూలంలోని సాధారణ క్రియార్థాన్ని నిలుపుతుంది; సైనిక దాడి భావం తరువాతి ‘పట్టుకొని’ అనే క్రియ ద్వారా స్పష్టమవుతుంది.
- source_word: וַיִּקַּח
  choice: పట్టుకొని
  rationale: పట్టణాలు, ప్రాంతాలను యుద్ధంలో స్వాధీనం చేసుకున్న సందర్భానికి తగిన సహజమైన తెలుగు ప్రయోగం.
- source_word: עִיּוֹן
  choice: ఈయోను
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: ఆబేలు-బేత్‌-మయకా
  rationale: సంయుక్త స్థలనామాన్ని ఒకే పేరుగా గుర్తించేందుకు విరామచిహ్నాలతో లిప్యంతరీకరించబడింది.
- source_word: יָנוֹחַ
  choice: యానోహు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: קֶדֶשׁ
  choice: కెదెషు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: חָצוֹר
  choice: హాసోరు
  rationale: హీబ్రూ స్థలనామంలోని ఘర్ష ధ్వనిని తెలుగులో సాధ్యమైనంత దగ్గరగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: הַגִּלְעָד
  choice: గిలాదు
  rationale: భౌగోళిక నామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించింది.
- source_word: הַגָּלִילָה
  choice: గలిలయ
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ప్రాంతనామ రూపం.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: అంటే నఫ్తాలి దేశమంతటినీ
  rationale: ముందున్న ప్రాంతాల జాబితాను వివరిస్తూ సమగ్రంగా చెప్పే సమానాధికార పదబంధమని ‘అంటే’ స్పష్టం చేస్తుంది; ‘దేశమంతటినీ’ సంపూర్ణతను నిలుపుతుంది.
- source_word: וַיַּגְלֵם
  choice: అక్కడి ప్రజలను అష్షూరుకు చెరగా తీసుకుపోయాడు
  rationale: హిఫిల్ క్రియలోని బలవంతపు నిర్బంధ తరలింపు భావాన్ని స్పష్టంగా అందిస్తుంది. హీబ్రూ పురుష బహువచన ప్రత్యయం సందర్భానుసారం జయించిన ప్రాంతాల ప్రజలను సూచిస్తుంది.
