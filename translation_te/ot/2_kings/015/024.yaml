  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడు యరొబాము పాపాలనుండి అతడు తొలగిపోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: రాజు ప్రవర్తనను అంచనా వేసే హీబ్రూ సూత్రప్రయోగంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: దైవిక అంచనాను సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా అందిస్తూ, יְהוָה అనే వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: לֹא סָר מֵחַטֹּאות
  choice: పాపాలనుండి ... తొలగిపోలేదు
  rationale: సוּר క్రియలోని ఒక ప్రవర్తనా మార్గాన్ని విడిచి మళ్లిపోవడం అనే భావాన్ని, חַטֹּאות అనే బహువచనాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడు యరొబాము
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, వ్యక్తినామాలను ప్రాచుర్యంలో ఉన్న బైబిలు తెలుగు రూపాల్లో ఇస్తుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: חטא ధాతువు హిఫీల్ రూపంలోని కారణార్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే రాజవృత్తాంతపు గంభీర స్వరాన్ని నిలుపుతూ రూపొందించబడింది.
