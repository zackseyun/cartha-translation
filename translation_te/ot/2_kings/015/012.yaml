id: 2KI.15.12
reference: 2 Kings 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: te
  text: 'యహ్వే యెహూతో చెప్పిన మాట ఇదే: “నీ కుమారులు నాలుగో తరం వరకు ఇశ్రాయేలు సింహాసనం మీద కూర్చుంటారు.” అది అలాగే జరిగింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: యహ్వే ... చెప్పిన మాట ఇదే
  rationale: హీబ్రూ సర్వనామం ముందున్న సంఘటనను దేవుని మాటతో అనుసంధానిస్తుంది. తెలుగులో సహజమైన వాక్యక్రమంలో ఉంచుతూ ‘మాట’ అనే మూల రూపకాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: యెహూతో చెప్పిన ...
  rationale: దేవుడు యెహూతో పలికిన ప్రత్యక్ష ప్రకటనగా సంబంధ వాక్యాన్ని సహజ తెలుగులో అందించింది; ఉద్ధరణ చిహ్నాలు לֵאמֹר యొక్క కార్యాన్ని స్పష్టంగా చూపుతాయి.
- source_word: בְּנֵי רְבִיעִים
  choice: నీ కుమారులు నాలుగో తరం వరకు
  rationale: యెహూ వంశంలోని నాలుగు తరాలను సూచించే హీబ్రూ నుడికారాన్ని స్పష్టంగా అందిస్తూ ‘కుమారులు’ అనే కుటుంబ భాషను నిలిపింది.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద కూర్చుంటారు
  rationale: రాజ్యాధికారాన్ని సూచించే ‘సింహాసనం మీద కూర్చోవడం’ అనే మూల రూపకాన్ని ‘పాలిస్తారు’ అని విప్పకుండా నిలిపింది.
- source_word: וַיְהִי כֵן
  choice: అది అలాగే జరిగింది
  rationale: దైవప్రకటన యథాతథంగా నెరవేరిందనే కథన ముగింపును సహజమైన ఆధునిక తెలుగులో తెలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: నాలుగో తరం గురించిన వాగ్దానం
  choice: నీ కుమారులు నాలుగో తరం వరకు
  alternative: నీ సంతతి నాలుగు తరాల వరకు
  rationale: వంశపరమైన భావాన్ని స్పష్టం చేస్తూనే בְּנֵי లోని ‘కుమారులు’ అనే నిర్దిష్ట పదాన్ని నిలిపింది; వాగ్దానానికి అదనపు ధార్మిక వివరణను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని సింహాసన రూపకం, వంశ భాష, నెరవేర్పు సూత్రం నిలిపివేయబడ్డాయి.
