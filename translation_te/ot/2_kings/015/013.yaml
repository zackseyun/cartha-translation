source:
  edition: WLC
  text: שַׁלּ֤וּם בֶּן יָבֵישׁ֙ מָלַ֔ךְ בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לְ/עֻזִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ יֶֽרַח יָמִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: te
  text: యూదా రాజైన ఉజ్జియా పాలనలో ముప్పై తొమ్మిదవ సంవత్సరంలో యాబేషు కుమారుడైన షల్లూము రాజయ్యాడు. అతడు సమరయలో ఒక నెల రోజులపాటు పాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ సందర్భంలో క్రియ సింహాసనాన్ని అధిష్ఠించడాన్ని సూచిస్తుంది; ‘రాజయ్యాడు’ అనేది సాధారణ ఆధునిక తెలుగులో దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఉజ్జియా పాలనలో ముప్పై తొమ్మిదవ సంవత్సరంలో
  rationale: ఇది రాజుల పాలనా సంవత్సరాలను సమకాలీకరించే సూత్రబద్ధమైన వాక్యరూపం; తెలుగులో ‘పాలనలో ... సంవత్సరంలో’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיִּמְלֹךְ
  choice: పాలించాడు
  rationale: మొదటి క్రియ రాజ్యారోహణాన్ని తెలిపిన తరువాత, ఈ క్రియ అతని పాలన కాలవ్యవధిని తెలియజేస్తుంది.
- source_word: יֶרַח יָמִים
  choice: ఒక నెల రోజులపాటు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఒక నెల రోజులు’; ‘ఒక నెల రోజులపాటు’ మూల భావాన్ని కాపాడుతూ సహజమైన తెలుగు ప్రయోగంగా ఉంది.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: స్థానార్థక ב ఇక్కడ ‘లో’ అని సూటిగా అనువదించబడింది; సమరయ అతడు పాలించిన రాజధాని.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వృత్తాంతానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు పాలనా క్రియల భేదాన్ని ‘రాజయ్యాడు’ మరియు ‘పాలించాడు’గా నిలిపింది.
