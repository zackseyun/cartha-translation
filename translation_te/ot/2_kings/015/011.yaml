  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: te
  text: జెకర్యా చేసిన మిగిలిన కార్యాలు—ఇదిగో, అవి ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు రాజుల చరిత్ర గ్రంథంలో.’
    reason: దִּבְרֵי הַיָּמִים అనే పదబంధాన్ని ‘దినవృత్తాంతాలు’ లేదా సందర్భానుసారంగా ‘చరిత్ర’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనకు సంబంధించిన సారాంశ సూత్రంలో דִּבְרֵי అనేది మాటలను మాత్రమే కాకుండా కార్యాలు, సంగతులు అనే విస్తృత భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో వ్యక్తిని అనుసంధానించేందుకు ‘చేసిన’ చేర్చబడింది; וְ యొక్క అనుసంధాన భావం సందర్భంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ సూచక అవ్యయాన్ని వదలకుండా, గంభీరమైనప్పటికీ అర్థమయ్యే తెలుగు రూపంలో నిలిపింది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: ‘వ్రాయబడినవి’ అనే నిష్క్రియార్థాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సూత్రంలో తెలుగు నుడికారానికి ‘గ్రంథంలో’ సహజం.
- source_word: דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాలు
  rationale: రాజుల పాలనలో జరిగిన సంఘటనలను కాలక్రమంగా నమోదు చేసిన అధికారిక వృత్తాంతాల భావాన్ని ప్రతిబింబిస్తుంది; ‘చరిత్ర’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల
  rationale: ఆ గ్రంథానికి రాజులతో ఉన్న సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ విభక్తి నిర్మాణంతో తెలిపింది.
