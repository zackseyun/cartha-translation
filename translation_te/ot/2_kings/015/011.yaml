translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజవృత్తాంత సారాంశానికి తగిన గంభీరతను నిలిపే శైలి. హీబ్రూలోని దృష్టి ఆకర్షకమైన ‘ఇదిగో’ను ఉద్దేశపూర్వకంగా నిలిపింది. పాదటిప్పణి గుర్తును అది వివరిస్తున్న గ్రంథనామం వద్ద ఉంచింది.
