  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: te
  text: ఆ రోజుల్లో యాహ్వే యూదాకు వ్యతిరేకంగా అరాము రాజైన రెజీనును[a], రెమల్యాహు కుమారుడైన పెకహును పంపడం ప్రారంభించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘అరాము’; సంప్రదాయంగా ‘సిరియా’ అని కూడా అనువదిస్తారు.'
    reason: lexical_alternative
  - marker: b
    text: ‘యూదాకు వ్యతిరేకంగా పంపడం’ అని అనువదించిన హీబ్రూ ప్రయోగాన్ని అక్షరార్థంగా ‘యూదాలోనికి పంపడం’ అని కూడా అనువదించవచ్చు; సందర్భం శత్రుత్వ భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: ఒకే క్షణాన్ని కాక చారిత్రక కాలాన్ని సూచించే సాధారణ హీబ్రూ కాలప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הֵחֵל
  choice: ప్రారంభించాడు
  rationale: హిఫిల్ రూపం ఒక చర్య మొదలైనదని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: యూదాకు విరోధంగా ... పంపడం
  rationale: שלח యొక్క ప్రాథమిక అర్థం ‘పంపు’; ఈ సైనిక-రాజకీయ సందర్భంలో בִּיהוּדָה శత్రుత్వ లక్ష్యాన్ని సూచిస్తుందని వాక్యప్రవాహంలో స్పష్టం చేస్తుంది, అయితే స్థానార్థక సాధ్యతను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: అరాము రాజైన రెజీను
  rationale: אֲרָםను హీబ్రూ భౌగోళిక నామానికి దగ్గరగా ‘అరాము’గా ఉంచి, రాజు-పేరు సంబంధాన్ని సహజ తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: రెమల్యా కుమారుడైన పెకహును
  rationale: אֵת గుర్తించిన రెండవ ప్రత్యక్ష కర్మను తెలుగులో కర్మవిభక్తితో చూపి, בן అనే వంశపరిచయాన్ని ‘కుమారుడు’గా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన రూపంతో నిలుపుతుంది.
- issue: యూదాపై శత్రువులను పంపడంలో యెహోవా క్రియాశీల పాత్ర
  choice: యెహోవా ... పంపడం ప్రారంభించాడు
  alternative: వారు యూదాపైకి రావడానికి యెహోవా అనుమతించాడు
  rationale: హీబ్రూ హిఫిల్ క్రియ దేవుని క్రియాశీల కర్తగా చూపుతుంది. ‘అనుమతించాడు’ అని మార్చడం మూలంలోని దైవకార్య భావాన్ని మృదువుపరచి, పాఠ్యంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలిలో గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. వ్యక్తినామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
