source:
  edition: WLC
  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: te
  text: అయితే ఉన్నత స్థలాలు తొలగించబడలేదు; ప్రజలు ఇంకా ఆ ఉన్నత స్థలాల్లో బలులు అర్పిస్తూ, ధూపం వేస్తూనే ఉన్నారు.[a] అతడు యెహోవా మందిరపు ఎగువ ద్వారాన్ని నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఉన్నత స్థలాల్లో అర్పణలను పొగగా పైకి లేపుతూ ఉన్నారు.” ఇక్కడి హీబ్రూ క్రియ ప్రత్యేకంగా ధూపం వేయడాన్ని లేదా మరింత విస్తృతంగా అర్పణను కాల్చి దాని పొగ పైకి లేచేలా చేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: రాజును గూర్చిన అనుకూల అంచనాకు మినహాయింపును సూచించే సహజమైన తెలుగు విరోధార్థక అనుసంధానం.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: ఉన్నత స్థలాలు / ఉన్నత స్థలాల్లో
  rationale: రాజుల గ్రంథంలో స్థానిక ఆరాధనా ప్రదేశాలను సూచించే సంప్రదాయ బైబిలు పదబంధం; కేవలం భౌగోళిక ఎత్తును మాత్రమే సూచించదు.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: ఆ ఆరాధనా స్థలాలు అలాగే నిలిచిపోయాయనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ప్రజల ఆచారం కొనసాగుతూనే ఉందని సూచిస్తుంది.
- source_word: מְזַבְּחִים
  choice: బలులు అర్పిస్తూ
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా అలవాటైన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמְקַטְּרִים
  choice: ధూపం వేస్తూనే
  rationale: కטר క్రియకు సందర్భంలో సాధారణమైన ఆరాధనా అర్థాన్ని ఇస్తుంది; అయితే దహనార్పణ పొగను పైకి లేపడం అనే విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: בָּנָה
  choice: కట్టించాడు
  rationale: రాజు నిర్మాణ కార్యాన్ని నిర్వహింపజేశాడనే సహజ తెలుగు రాజవృత్తాంత శైలి; మూలంలోని ‘నిర్మించాడు’ అనే భావాన్ని కాపాడుతుంది.
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: యెహోవా మందిరపు పై ద్వారం
  rationale: ‘యెహోవా గృహం’ అనే హీబ్రూ భావాన్ని సాధారణ పాఠకునికి స్పష్టమైన ‘మందిరం’తో, הָעֶלְיוֹןను స్థానసూచక ‘పై’తో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన రూపంలో ప్రత్యక్షంగా ఇస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుగా మార్చకుండా పేరుగా నిలుపుతుంది.
- issue: וּמְקַטְּרִים యొక్క ఆరాధనా పరిధి
  choice: ధూపం వేస్తూనే
  alternative: అర్పణలను పొగగా పైకి లేపుతూ
  rationale: సందర్భంలో సహజమైన నిర్దిష్ట అర్థాన్ని ప్రధాన పాఠ్యంలో ఉపయోగించి, క్రియకు ఉండగల విస్తృత బల్యార్పణ అర్థాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం. ‘ఉన్నత స్థలాలు’ అనే బైబిలు సాంకేతిక పదాన్ని నిలిపి, ‘మందిరం’ ద్వారా సందర్భాన్ని స్పష్టం చేశాం.
