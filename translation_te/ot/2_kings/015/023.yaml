  text: בִּ/שְׁנַת֙ חֲמִשִּׁ֣ים שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פְּקַֽחְיָ֨ה בֶן מְנַחֵ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: te
  text: యూదా రాజైన అజర్యా పరిపాలనలో యాభయ్యవ సంవత్సరంలో, మెనహేము కుమారుడు పెకహ్యా షోమ్రోనులో ఇశ్రాయేలుకు రాజయ్యాడు; అతడు రెండు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה
  choice: పరిపాలనలో యాభయ్యవ సంవత్సరంలో
  rationale: హీబ్రూ రాజవంశ కాలనిర్ణయ సూత్రం ‘అజర్యాకు సంబంధించిన యాభయ్యవ సంవత్సరంలో’ అని సూచిస్తుంది. తెలుగులో రాజు పేరుతో ‘పరిపాలనలో’ చేర్చడం ఆ సంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన అజర్యా
  rationale: ל ఉపసర్గ ఇక్కడ అజర్యా పాలనను కాలగణనకు ఆధారంగా చూపుతుంది; מֶלֶךְ יְהוּדָה అతని పదవినీ రాజ్యాన్నీ గుర్తిస్తుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: రాజుల పరిపాలనా నివేదికల్లో ఈ క్రియ సింహాసనారోహణను సూచించగలదు. వాక్యాంతంలో పాలనాకాలం విడిగా ఉన్నందున ‘రాజయ్యాడు’ పునరుక్తిని నివారిస్తూ భావాన్ని అందిస్తుంది.
- source_word: פְּקַחְיָה
  choice: పెకహ్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶן מְנַחֵם
  choice: మెనహేము కుమారుడు
  rationale: వంశపరమైన గుర్తింపును నేరుగా, సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: מָלַךְ తో కూడిన עַל పాలనకు లోబడిన ప్రజలను లేదా రాజ్యాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలుకు రాజయ్యాడు’ ఆధునిక తెలుగులో సహజమైన రాజ్యాధికార ప్రయోగం.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: స్థానార్థక ב రాజపాలన కేంద్రాన్ని సూచిస్తుంది. స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שְׁנָתָיִם
  choice: రెండు సంవత్సరాలు
  rationale: ద్వివచన రూపం ఖచ్చితంగా రెండు సంవత్సరాల పాలనాకాలాన్ని సూచిస్తుంది; తెలుగులో సంపూర్ణ వాక్యానికి ‘పరిపాలించాడు’ను సరఫరా చేశాం.
