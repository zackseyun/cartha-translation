translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక వచనశైలి. హీబ్రూ రాజవంశ కాలనిర్ణయ నిర్మాణాన్ని సహజ తెలుగు వాక్యనిర్మాణంతో సమతుల్యం చేశాం; అనవసరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
