translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి ఉపయోగించబడింది. మూలంలోని రాజ్యపాలన కాలసమన్వయం, సింహాసనారోహణ, పాలన వ్యవధి స్పష్టంగా వేరు చేయబడ్డాయి.
