source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: te
  text: యూదా రాజైన అజర్యా పాలనలో ముప్పై తొమ్మిదో సంవత్సరంలో, గాదీ కుమారుడు మెనహేము ఇశ్రాయేలుకు రాజయ్యాడు. అతడు షోమ్రోనులో పది సంవత్సరాలు పాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: పాలనలో ముప్పై తొమ్మిదో సంవత్సరంలో
  rationale: ఇది రాజ్యపాలన సంవత్సరాన్ని సూచించే కాలసమన్వయ సూత్రం. ఆధునిక తెలుగులో ‘పాలనలో ... సంవత్సరంలో’ అని చెప్పడం అర్థాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన అజర్యా
  rationale: లְ ఉపసర్గ ఇక్కడ అజర్యా పాలన సంవత్సరానికి సూచనగా ఉంది; రాజబిరుదును సహజ తెలుగు క్రమంలో అందించాం.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: తర్వాత పాలన వ్యవధి ప్రత్యేకంగా రావడం వల్ల, ఇక్కడ క్రియ సింహాసనారోహణను సూచిస్తుంది. ‘రాజయ్యాడు’ ఈ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: గాదీ కుమారుడు మెనహేము
  rationale: వ్యక్తినామాలను తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, בֶּן‌ను సహజమైన ‘కుమారుడు’గా అనువదించాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: מָלַךְ‌తో వచ్చిన עַל ప్రజలపై రాజ్యాధికారాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలుకు రాజయ్యాడు’ ఆధునిక తెలుగులో సహజమైన రాజ్యారోహణ ప్రయోగం.
- source_word: עֶשֶׂר שָׁנִים
  choice: పది సంవత్సరాలు
  rationale: మెనహేము పాలన కొనసాగిన కాలవ్యవధిని నేరుగా సూచిస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: బְ ఇక్కడ స్థలాన్ని సూచిస్తుంది; షోమ్రోను అతని పాలనా కేంద్రం. పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
