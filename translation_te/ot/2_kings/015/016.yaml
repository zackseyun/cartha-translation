translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని వాడాం. హింసను మూలపాఠం చెప్పినంత ప్రత్యక్షంగా ఉంచి, అనవసరమైన గ్రాఫిక్ విస్తరణను నివారించాం. ‘దానిలో ఉన్న సమస్తాన్ని’ అనే రూపంతో మూలంలోని వ్యక్తులు/వస్తువులు అనే వ్యాప్తి అస్పష్టతను నిలిపాం.
