    issue: Unsupported departure from Tirzah
    rationale: “తిర్సా నుండి బయలుదేరి” specifies that Menahem set out from Tirzah. The source says only מִתִּרְצָה (“from Tirzah”) in a syntactically compressed phrase and does not explicitly state departure.
  - severity: low
    issue: Added bodily detail in the final clause
    rationale: “కడుపులనూ” is an interpretive anatomical specification. Hebrew says he split open the pregnant women; Telugu can express this directly without supplying an additional noun.
