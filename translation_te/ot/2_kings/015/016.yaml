  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: te
  text: అప్పుడు మెనహేము తిర్సా నుండి తిప్సహును, దానిలో ఉన్న సమస్తాన్నీ, దాని సరిహద్దు ప్రాంతాన్నీ దాడి చేశాడు. ఆ పట్టణం అతనికి తెరవలేదు[a] కాబట్టి అతడు దానిలోని గర్భిణులందరినీ చీల్చివేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెరవలేదు’ అంటే మెనహేమును పట్టణంలోకి అనుమతించలేదు, అంటే అతనికి లొంగిపోలేదు.
    reason: cultural_note
  - marker: b
    text: ‘చీల్చివేశాడు’ అనే హీబ్రూ క్రియ బలవంతంగా చీల్చి తెరవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సహజంగా పరిచయం చేసే కాలసూచక అవ్యయం.
- source_word: יַכֶּה / וַיַּךְ
  choice: దాడిచేశాడు
  rationale: נכה ఇక్కడ సైనిక దాడిని సూచిస్తుంది; తెలుగు కథనంలో ‘దాడిచేశాడు’ సహజంగా ఉండి హింసాత్మక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּפְסַח
  choice: తిప్సహు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనువాదం చేశాం.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న సమస్తాన్ని
  rationale: హీబ్రూ పదబంధం వ్యక్తులకే పరిమితం కాకుండా విస్తృతార్థాన్ని అనుమతిస్తుంది; ఆ అస్పష్టతను నిలిపి ఉంచాం.
- source_word: גְּבוּלֶיהָ
  choice: దాని పరిసర ప్రాంతాన్ని
  rationale: గెవూల్ ఇక్కడ కేవలం సరిహద్దు రేఖలను కాక పట్టణానికి చెందిన భూభాగాన్ని సూచిస్తుంది.
- source_word: מִתִּרְצָה
  choice: తిర్సా నుండి బయలుదేరి
  rationale: מן యొక్క ‘నుండి’ భావాన్ని నిలిపి, దాడి ప్రారంభస్థలంగా తిర్సాను సహజ తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని సంబంధం కొంత సంక్షిప్తంగా ఉన్నందున అతివ్యాఖ్యానం చేయలేదు.
- source_word: כִּי לֹא פָתַח
  choice: ఆ పట్టణం అతనికి తలుపులు తెరవలేదు
  rationale: ఏకవచన క్రియకు పట్టణమే సమష్టి కర్త; సందర్భంలో తలుపులు తెరవకపోవడం అంటే ప్రవేశాన్ని లేదా లొంగుబాటును నిరాకరించడం.
- source_word: הֶהָרוֹתֶיהָ
  choice: అందులోని గర్భిణులందరి
  rationale: ‘గర్భిణులు’ అనే ప్రత్యక్ష, ఆధునిక పదం మూలంలోని భయానకతను సౌమ్యీకరించకుండా తెలియజేస్తుంది.
- source_word: בִּקֵּעַ
  choice: కడుపులనూ చీల్చాడు
  rationale: Piel రూపం బలవంతంగా చీల్చడాన్ని సూచిస్తుంది; గర్భిణుల సందర్భంలో తెలుగులో అవసరమైన శరీర సంబంధాన్ని స్పష్టంగా వ్యక్తం చేశాం.
