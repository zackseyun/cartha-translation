  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: te
  text: మెనహేము తన పితరులతో కూడ నిద్రించాడు[a]. అతని కుమారుడైన పెకహ్యా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన పితరులతో కూడ పడుకున్నాడు.’ ఈ హీబ్రూ నానుడి ఒక రాజు మరణాన్నీ, అతని తరువాత మరొకరు రాజు కావడాన్నీ తెలియజేసే ప్రామాణిక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ‘తన పితరులతో కూడ’ అనే పదబంధంతో కలిసినప్పుడు ఇది రాజు మరణాన్ని సూచించే ప్రామాణిక హీబ్రూ ప్రయోగం. తెలుగు బైబిలు శైలిలో సహజమైన ‘నిద్రించాడు’ మూలంలోని రూపకాన్ని నిలుపుతుంది; అర్థాన్ని కేవలం ‘చనిపోయాడు’గా విప్పి చెప్పదు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: మూలంలోని ‘తన తండ్రులతో’ అనే రాజవంశ సంబంధిత మరణప్రయోగాన్ని ‘పితరులు’ సహజంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ క్రియ రాజ్యపాలన కొనసాగిందనే సాధారణ భావం కంటే సింహాసనారోహణను సూచించే వారసత్వ ప్రకటనలో ఉంది; అందువల్ల ‘రాజయ్యాడు’ సహజమైన తెలుగు.
- source_word: פְּקַחְיָה
  choice: పెకహ్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడైన
  rationale: వారసత్వ సంబంధాన్ని మూలం ప్రకారం స్పష్టంగా ఉంచుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు చేపట్టడం అనే మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
