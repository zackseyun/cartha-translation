  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. రాజుల గ్రంథంలోని పాలనకాల సూత్రాన్ని సంక్షిప్తంగా నిలుపుతూ, వ్యక్తి మూలస్థలానికి సంబంధించిన హీబ్రూ ఉపసర్గలోని భావసాధ్యతను పాదటిప్పణిలో భద్రపరిచాం.
