source:
  edition: WLC
  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: te
  text: అతడు రాజైనప్పుడు అతనికి పదహారు సంవత్సరాలు. అతడు యెరూషలేములో యాభై రెండు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెరూషలేముకు చెందిన యెకొల్యా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేము నుండి వచ్చిన యెకొల్యా.”
    reason: מִן ఉపసర్గ మూలస్థలం లేదా అక్కడి నుండి రావడం అనే భావాలలో అర్థమవగలదు; మూలంలోని ఈ స్వల్ప భావభేదాన్ని నిలుపుటకు.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: పదహారేళ్ల వయసుగలవాడు
  rationale: ‘పదహారు సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా వ్యక్తపరుస్తుంది.
- source_word: הָיָה בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: ఈ నిర్మాణం సింహాసనాన్ని అధిష్ఠించిన సమయంలో అతని వయస్సును సూచిస్తుంది; ఈ అనువాదం ఆ కాలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: యాభై రెండు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా పదబంధానికి ప్రామాణికమైన తెలుగు రూపం.
- source_word: מָלַךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: రాజుల పాలనకాల సూత్రంలో ఈ క్రియ రాజుగా పరిపాలించడాన్ని సూచిస్తుంది.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: בְ అనే స్థలార్థక ఉపసర్గ పాలన జరిగిన ప్రదేశాన్ని సూచిస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: మూలంలోని సాధారణ పరిచయ సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: יְכָלְיָהוּ
  choice: యెకొల్యా
  rationale: హీబ్రూ వ్యక్తినామానికి మూల ఉచ్చారణను సమీపించే, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: מִירוּשָׁלָם
  choice: యెరూషలేముకు చెందిన
  rationale: מן ఇక్కడ వ్యక్తి స్వస్థలం లేదా మూలస్థానాన్ని సూచిస్తుంది; ‘చెందిన’ అనేది కదలికను అనవసరంగా సూచించకుండా సహజంగా ఆ భావాన్ని అందిస్తుంది.
