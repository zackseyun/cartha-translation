translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రాజుల గ్రంథంలోని పాలనా-సంగ్రహ సూత్రానికి తగిన సంక్షిప్తతను, హీబ్రూ הִנָּם యొక్క గుర్తించదగిన వాక్చాతుర్య బలాన్ని నిలిపింది. వ్యక్తినామం ‘పెకహ్యా’గా లిప్యంతరీకరించబడింది.
