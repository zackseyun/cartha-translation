  text: וְ/יֶ֛תֶר דִּבְרֵ֥י פְקַחְיָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: te
  text: పెకహ్యా చేసిన మిగిలిన కార్యాలు, అతడు చేసినదంతా—ఇదిగో, అవి ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “పెకహ్యా చేసిన మిగిలిన కార్యాలు, అతడు చేసినదంతా—నిజంగా, అవి ఇశ్రాయేలు రాజుల వార్షిక వృత్తాంతాల గ్రంథంలో నమోదై ఉన్నాయి.”'
    reason: ‘ఇదిగో’ అనే సమర్పణాత్మక పదాన్ని తెలుగులో ‘నిజంగా/నిశ్చయంగా’ అనే బలంతో గ్రహించవచ్చు; סֵפֶר דִּבְרֵי הַיָּמִים అనే పదబంధాన్ని ‘వార్షిక వృత్తాంతాలు’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פְקַחְיָה
  choice: పెకహ్యా చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన సంగ్రహ సూత్రంలో דִּבְרֵי అనేది మాటలను కాక రాజు చేసిన కార్యాలు లేదా పాలనా వ్యవహారాలను సూచిస్తుంది. ప్రారంభ וְ తెలుగులో సందర్భసంబంధంగా సహజంగా అంతర్లీనమవుతుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עשה యొక్క విస్తృత అర్థాన్ని ప్రత్యేకంగా పరిమితం చేయకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: తరువాతి సమాచారంపై దృష్టి నిలిపే హీబ్రూ సమర్పణాత్మక బలాన్ని ‘ఇదిగో’ నిలుపుతుంది; బహువచన ప్రత్యయం ‘అవి’గా వ్యక్తమవుతుంది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: హీబ్రూ నిష్క్రియాత్మక కృదంత భావాన్ని సహజమైన తెలుగు సంపూర్ణ నిష్క్రియ నిర్మాణంతో అందిస్తుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: వృత్తాంతాల గ్రంథంలో
  rationale: పదశః ‘దినాల విషయాలు’ అనే భావం ఇక్కడ రాజవంశ సంబంధిత లిఖిత వార్షిక వృత్తాంతాలను సూచిస్తుంది. עַל సూత్రప్రయోగంలో తెలుగు విధానానికి అనుగుణంగా ‘గ్రంథంలో’ అవుతుంది.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల
  rationale: లామెద్ ఇక్కడ ఆ లిఖిత వృత్తాంతం ఎవరికీ సంబంధించినదో తెలుపుతుంది; తెలుగు షష్ఠీ విభక్తి సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
