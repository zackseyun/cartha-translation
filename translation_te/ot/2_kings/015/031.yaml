translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి వాడబడింది. మూలంలోని పునరుక్తి (‘మిగిలిన కార్యాలు… చేసినవన్నీ’) మరియు הִנָּם యొక్క ఉద్ఘాటన ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘దినవృత్తాంతాల గ్రంథంలో’ అన్న పదబంధానికే జోడించబడింది.
