source:
  edition: WLC
  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: te
  text: పెకహు యొక్క మిగిలిన కార్యాలు, అతడు చేసినవన్నీ—ఇదిగో, అవి ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు రాజుల వార్షిక వృత్తాంతాల గ్రంథంలో.’
    reason: דִּבְרֵי הַיָּמִים రాజుల పాలనకు సంబంధించిన దినవృత్తాంతాలు లేదా వార్షిక నమోదులను సూచిస్తుంది.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: పెకహు మిగిలిన కార్యాలు
  rationale: יֶתֶרను ‘మిగిలిన’ అని, రాజుల పాలన సారాంశాల్లో דִּבְרֵי అనే పదానికి ఉన్న కార్యాలు/వ్యవహారాలు అనే భావాన్ని సహజంగా ‘కార్యాలు’ అని అందించింది. ఆరంభ וְను తెలుగులో విడిగా ‘మరియు’ అని పెట్టకపోయినా సూత్రప్రాయమైన సంధిక్రమం నిలుస్తుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినవన్నీ
  rationale: כָל యొక్క సమగ్ర భావాన్ని ‘అన్నీ’తోను, עָשָׂה యొక్క సరళ క్రియాభావాన్ని ‘చేసిన’తోను నిలిపింది.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: హీబ్రూ సూచనాత్మక-ప్రదర్శక పదంలోని సూత్రప్రాయమైన ఉద్ఘాటనను తొలగించకుండా, ఆధునిక పాఠకుడికి అర్థమయ్యే బైబిలీయ గౌరవశైలిలో అందించింది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: ‘నమోదు చేయబడ్డాయి’ అనే వ్యాఖ్యానాత్మక పదం కంటే, మూలంలోని ‘written’ అనే స్పష్టమైన లిఖిత భావాన్ని నిలిపింది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథంలో
  rationale: עַל సాహిత్య ఆధారాన్ని సూచించే సందర్భంలో తెలుగులో సహజమైన ‘గ్రంథంలో’గా వచ్చింది; דִּבְרֵי הַיָּמִיםకు రాజరిక వార్షిక నమోదుల భావాన్ని ఇచ్చే ‘దినవృత్తాంతాలు’ను ఎంచుకుంది.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల
  rationale: לְను ఈ గ్రంథశీర్షికలో సంబంధార్థకంగా తీసుకొని, ఇశ్రాయేలు రాజులకు సంబంధించిన దినవృత్తాంతాలు అనే భావాన్ని సహజ తెలుగు షష్ఠీ నిర్మాణంతో తెలిపింది.
