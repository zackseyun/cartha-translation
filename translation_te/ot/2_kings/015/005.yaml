id: 2KI.15.5
reference: 2 Kings 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: te
  text: యెహోవా రాజును దెబ్బతీశాడు; అతడు తన మరణదినం వరకు కుష్ఠరోగిగా[a] ఉండి, ప్రత్యేకంగా ఉంచిన ఇంట్లో[b] నివసించాడు. రాజు కుమారుడైన యోతాము రాజగృహ బాధ్యతను వహిస్తూ, దేశ ప్రజలకు న్యాయం తీర్చేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, విస్తృతార్థంలో, “తీవ్రమైన చర్మవ్యాధిగలవాడిగా.” హీబ్రూ పదం ఆధునిక కుష్ఠు (హాన్సెన్ వ్యాధి)నే తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వేరుచేసిన ఇంట్లో,” “ఏకాంత గృహంలో.” హీబ్రూ పదబంధం బహుశా ఇతరుల నుంచి వేరుగా ఉంచిన నివాసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: וַיְנַגַּע
  choice: దెబ్బతీశాడు
  rationale: ఇక్కడ נגע కేవలం తాకడాన్ని కాక దేవుడు కలిగించిన బాధాకరమైన దెబ్బను సూచిస్తుంది; దైవ క్రియాశీలతను స్పష్టంగా నిలుపుతుంది.
- source_word: מְצֹרָע
  choice: కుష్ఠరోగిగా
  rationale: సాంప్రదాయికంగా గుర్తించదగిన సంక్షిప్త పదం; అయితే ఇది ఆధునిక హాన్సెన్ వ్యాధినే తప్పనిసరిగా సూచించదనే విస్తృత అర్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: עַד יוֹם מֹתוֹ
  choice: తన మరణదినం వరకు
  rationale: హీబ్రూ నుడికారంలోని గంభీరతను, కాల పరిమితిని నిలుపుతుంది.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: ప్రత్యేకంగా ఉంచిన ఇంట్లో
  rationale: కష్టమైన ఈ పదబంధం సందర్భంలో వేరుచేసిన నివాసాన్ని సూచిస్తుంది; ‘స్వేచ్ఛా గృహం’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: עַל הַבַּיִת
  choice: రాజగృహ బాధ్యత వహిస్తూ
  rationale: రాజ కుటుంబం లేదా రాజభవన పరిపాలనా పర్యవేక్షణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֹׁפֵט
  choice: న్యాయం తీర్చేవాడు
  rationale: నిరంతర న్యాయపాలనా బాధ్యతను సూచించే హీబ్రూ కృదంత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: ‘ఆ దేశపు ప్రజలు’ అనే హీబ్రూ భావాన్ని ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: מְצֹרָע సూచించే రాజు వ్యాధి స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘కుష్ఠరోగిగా’ అని ఉంచి, దాని వైద్య నిర్ధారణ అనిశ్చితిని పాదటిప్పణిలో తెలియజేయడం
  alternative: తీవ్రమైన చర్మవ్యాధిగలవాడిగా
  rationale: హీబ్రూ పదాన్ని నిర్దిష్ట ఆధునిక వ్యాధితో సమానీకరించకుండా, సాంప్రదాయిక పదప్రయోగాన్నీ మూలంలోని అనిశ్చితినీ రెండింటినీ కాపాడుతుంది.
- issue: בְּבֵית הַחָפְשִׁית అనే అస్పష్ట పదబంధం
  choice: ప్రత్యేకంగా ఉంచిన ఇంట్లో
  alternative: వేరుచేసిన ఇంట్లో / ఏకాంత గృహంలో
  rationale: పదబంధంలోని వేరుపరచబడిన నివాస భావాన్ని తెలియజేస్తూ, మూలపద వ్యుత్పత్తి ఆధారంగా ‘స్వేచ్ఛా గృహం’ అని తప్పుగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస క్రియలను చదవదగిన తెలుగు వాక్య నిర్మాణంలో ఉంచి, దైవ క్రియాశీలతను, వ్యాధి కొనసాగిన కాలాన్ని, యోతాము నిర్వహించిన రాజగృహ మరియు న్యాయపాలనా బాధ్యతలను నిలిపింది.
