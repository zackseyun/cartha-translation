  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక రాజ్యవృత్తాంతానికి తగిన గౌరవప్రదమైన మరియు సులభగ్రాహ్యమైన శైలి. మూలంలోని కాలనిర్ణయం, వంశసంబంధం, రాజ్యారంభ భావం నిలుపబడ్డాయి.
