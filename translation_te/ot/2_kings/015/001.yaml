  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה לְ/יָרָבְעָ֖ם מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ עֲזַרְיָ֥ה בֶן אֲמַצְיָ֖ה מֶ֥לֶךְ יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన యెరోబాము పరిపాలనలో ఇరవై ఏడవ సంవత్సరంలో, యూదా రాజైన అమజ్యా కుమారుడు అజర్యా రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: పరిపాలనలో ఇరవై ఏడవ సంవత్సరంలో
  rationale: ఇది రాజు పరిపాలనా సంవత్సరాన్ని సూచించే హీబ్రూ కాలనిర్ణయ సూత్రం. తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ‘పరిపాలనలో ... సంవత్సరంలో’ అని అనువదించాం.
- source_word: לְיָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన యెరోబాము
  rationale: לְ ఇక్కడ ఎవరి పరిపాలనా సంవత్సరం లెక్కించబడుతోందో సూచిస్తుంది; రాజబిరుదును పేరుతో సహజమైన తెలుగు సంబంధంలో ఉంచాం.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: రాజ్యారంభ ప్రకటనలో ఈ క్రియ పరిపాలన ప్రారంభాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶן אֲמַצְיָה
  choice: అమజ్యా కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: అజర్యాను గుర్తించే రాజబిరుదు; తెలుగులో పేరుకు ముందు విశేషణీయ నిర్మాణంగా సహజంగా అమర్చాం.
