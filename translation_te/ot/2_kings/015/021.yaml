id: 2KI.15.21
reference: 2 Kings 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: మెనహేము చేసిన మిగిలిన కార్యాలూ, అతడు చేసినదంతా, ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు రాజుల వార్షిక వృత్తాంతాల గ్రంథం.’
    reason: ‘దినవృత్తాంతాలు’ అని అనువదించిన דִּבְרֵי הַיָּמִים అనే పదబంధం రాజుల అధికారిక చారిత్రక నమోదులను, అంటే వార్షిక వృత్తాంతాలను కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  choice: మెనహేము చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనను సంగ్రహించే ఈ సూత్రప్రాయ వాక్యంలో דִּבְרֵי అనేది మాటలను మాత్రమే కాక, రాజు చేసిన కార్యాలను సూచిస్తుంది. וְיֶתֶר భావాన్ని సహజమైన తెలుగులో ‘మిగిలిన’ అని ఇచ్చాం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: హీబ్రూ మూలంలోని సమగ్ర భావాన్ని, ముందున్న పదబంధంతో ఉన్న సూత్రప్రాయ పునరుక్తిని నిలుపుతుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; כְּתוּבִים యొక్క ‘రాయబడిన’ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సందర్భంలో తెలుగులో ‘గ్రంథంలో’ సహజం.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: ఇది రాజులకు సంబంధించిన అధికారిక చారిత్రక నమోదును సూచిస్తుంది. ‘దినవృత్తాంతాలు’ మూలపదబంధానికి సమీపంగా ఉండి, గ్రంథశీర్షికగా కూడా గౌరవప్రదంగా వినిపిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవంశ చరిత్ర సంగ్రహానికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని సూత్రప్రాయ పునరుక్తి మరియు అలంకారప్రశ్న నిలుపబడ్డాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న గ్రంథశీర్షిక తరువాత ఉంచబడింది.
