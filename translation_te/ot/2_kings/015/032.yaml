language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/פֶ֥קַח בֶּן רְמַלְיָ֖הוּ מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ יוֹתָ֥ם בֶּן עֻזִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన రెమల్యా కుమారుడు పెకహు పాలనలో రెండవ సంవత్సరంలో, ఉజ్జియా[b] కుమారుడైన యోతాము యూదాపై రాజయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాలించడం ప్రారంభించాడు.” హీబ్రూ క్రియ రాజుగా కావడాన్ని లేదా పరిపాలన ప్రారంభాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఉజ్జియాను ఇతర చోట్ల అజర్యా అని కూడా పిలుస్తారు.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: పెకహు పాలనలో రెండవ సంవత్సరంలో
  rationale: ఇది రాజు పాలనాసంవత్సరాన్ని సూచించే హీబ్రూ కాలనిర్ణయ సూత్రం. శְׁתַּיִם రూపపరంగా ‘రెండు’ అయినా, ఈ ప్రయోగంలో ‘రెండవ’ అనే క్రమసంఖ్యార్థం ఇస్తుంది.
- source_word: בֶּן רְמַלְיָהוּ
  choice: రెమల్యా కుమారుడు
  rationale: చారిత్రక గుర్తింపును నిలుపుతూ హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: పెకహు రాజ్యాన్ని తెలిపే బిరుదును తెలుగులో సంబంధవాచక రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజ్యారోహణ ప్రకటనలో క్రియకు ‘రాజు అయ్యాడు/పాలించడం ప్రారంభించాడు’ అనే ప్రవేశార్థం ఉంది; ‘రాజయ్యాడు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: יוֹתָם
  choice: యోతాము
  rationale: హీబ్రూ వ్యక్తినామానికి స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן עֻזִיָּהוּ
  choice: ఉజ్జియా కుమారుడు
  rationale: ఈ వచనంలోని עֻזִיָּהוּ అనే పేరును యథాతథంగా ఉజ్జియా అని ఉంచి, పితృనామ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: యోతాము తండ్రి ఉజ్జియాను యూదా రాజుగా గుర్తించే మూలపాఠంలోని బిరుదును విడిచిపెట్టకుండా సహజమైన తెలుగు వాక్యనిర్మాణంలో ఉంచుతుంది.
