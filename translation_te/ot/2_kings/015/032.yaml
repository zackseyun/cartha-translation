- from: ఇశ్రాయేలు రాజైన రెమల్యా కుమారుడు పెకహు పాలనలో రెండవ సంవత్సరంలో, యూదా రాజైన ఉజ్జియా[b] కుమారుడు యోతాము రాజయ్యాడు.[a]
  to: ఇశ్రాయేలు రాజైన రెమల్యా కుమారుడు పెకహు పాలనలో రెండవ సంవత్సరంలో, ఉజ్జియా[b] కుమారుడైన యోతాము యూదాపై రాజయ్యాడు.[a]
  rationale: The wording is revised solely to make “king of Judah” modify Jotham, as required by the Hebrew accession notice. Rendering this as “యూదాపై రాజయ్యాడు” preserves the meaning in idiomatic Telugu while retaining the source's explicit identification of Jotham's kingdom.
