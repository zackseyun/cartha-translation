translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక శైలిని వాడాం. హీబ్రూ వాక్యంలోని రాజ్యపాలన కాలనిర్ణయ సూత్రాన్ని సహజీకరించాం; రెండు రాజబిరుదులనూ, పితృనామాలనూ నిలిపాం. ప్రతి పాదసూచిక గుర్తును దానికి సంబంధించిన పదం లేదా క్రియ వద్ద ఉంచాం.
