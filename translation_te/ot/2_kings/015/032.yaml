  naturalness: The revised sentence retains a clear, modern standard Telugu historical register. “యూదాపై రాజయ్యాడు” is natural and avoids an awkward repetition of “రాజు ... రాజయ్యాడు.”
  terminology: The names పెకహు, రెమల్యా, యోతాము, and ఉజ్జియా are consistently transliterated. “రాజయ్యాడు” suitably conveys accession, with the lexical alternative retained in the footnote. The cross-reference footnote on ఉజ్జియా remains correctly anchored.
  issues:
