source:
  edition: WLC
  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: te
  text: అప్పుడు మెనహేము అష్షూరు రాజుకు ఇవ్వడానికి ఇశ్రాయేలీయులపై పన్ను వేసి, ప్రముఖులందరి[a] నుండి ఒక్కొక్కరి వద్ద యాభై షెకెల్ల వెండి చొప్పున వసూలు చేశాడు. అష్షూరు రాజు తిరిగి వెళ్లిపోయాడు; అతడు అక్కడ ఆ దేశంలో ఉండలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరాక్రమవంతులందరి” లేదా “ధనవంతులందరి.” హెబ్రీ పదబంధం సైనిక బలం, సామాజిక హోదా, లేదా సంపదగల పురుషులను సూచించవచ్చు; పన్ను వసూలు సందర్భం ఆర్థిక స్థోమతగలవారనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא ... אֶת הַכֶּסֶף עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని ... దగ్గర నుంచి ... ఆ డబ్బును బలవంతంగా వసూలు చేశాడు
  rationale: הוציא అనే causative రూపం, כסף మరియు עַל‌తో కలిసి ఇక్కడ బలవంతపు పన్ను వసూలును సూచిస్తుంది. తెలుగు వాక్యంలో పన్ను ఎవరి వద్ద నుంచి వసూలైందో సహజంగా తెలియజేస్తూ దాని బలవంతపు స్వభావాన్ని నిలిపింది.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: బలవంతులైన ధనవంతులందరి[a] దగ్గర నుంచి
  rationale: గִּבּוֹרֵי הַחַיִל సైనిక పరాక్రమం, సామాజిక ప్రాధాన్యం లేదా ఆర్థిక స్థోమతగల పురుషులను సూచించగలదు. ప్రతి వ్యక్తిపై భారీ మొత్తం విధించిన ఈ పన్ను సందర్భంలో ధనవంతులనే భావం ప్రధానమైనదిగా కనిపిస్తుంది; ‘బలవంతులైన’ అనే పదం హెబ్రీ పదబంధపు విస్తృతిని కొంత నిలుపుతుంది.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: ఒక్కొక్కరి వద్ద యాభై తులాల వెండి చొప్పున
  rationale: שקל పురాతన బరువు ప్రమాణం. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘తులం’ను ఉపయోగించి, לְאִישׁ אֶחָד‌ను ‘ఒక్కొక్కరి వద్ద ... చొప్పున’గా సహజంగా వ్యక్తం చేసింది.
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు వెనుదిరిగి
  rationale: שׁוב ఇక్కడ చెల్లింపు అందుకున్న తరువాత రాజు తిరిగి వెళ్లడాన్ని సూచిస్తుంది; ‘వెనుదిరిగి’ కథన ప్రవాహానికి సహజంగా సరిపోతుంది.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: ఆ దేశంలో ఉండిపోలేదు
  rationale: עמד యొక్క అక్షరార్థం ‘నిలిచాడు’; ఈ సందర్భంలో అది ఒక ప్రదేశంలో కొనసాగి ఉండడం అనే భావంలో ఉంది. ‘ఉండిపోలేదు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బలవంతంగా వసూలు చేశాడు’ పన్ను విధింపులోని నిర్బంధ భావాన్ని స్పష్టం చేస్తుంది. ‘బలవంతులైన ధనవంతులు’ అనే ప్రధాన పాఠంతో సందర్భోచిత ఆర్థిక భావాన్ని ఇచ్చి, పదబంధంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో భద్రపరిచాం.
