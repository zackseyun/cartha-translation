revisions:
- from: ఏలా కుమారుడైన హోషేయ, రెమల్యా కుమారుడైన పెకహుకు వ్యతిరేకంగా కుట్ర పన్ని[a], అతని మీద దాడిచేసి అతన్ని చంపి, అతని స్థానంలో రాజయ్యాడు. ఇది ఉజ్జియా కుమారుడైన యోతాము పాలనలో ఇరవయ్యో సంవత్సరంలో జరిగింది.[b]
  to: ఏలా కుమారుడైన హోషేయ రెమల్యా కుమారుడైన పెకహుకు వ్యతిరేకంగా కుట్ర పన్ని[a], అతనిని కొట్టి, చంపి, ఉజ్జియా కుమారుడైన యోతాము ఇరవయ్యవ సంవత్సరంలో అతని స్థానంలో రాజయ్యాడు.[b]
