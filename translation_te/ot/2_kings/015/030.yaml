source:
  edition: WLC
  text: וַ/יִּקְשָׁר קֶ֜שֶׁר הוֹשֵׁ֣עַ בֶּן אֵלָ֗ה עַל פֶּ֨קַח֙ בֶּן רְמַלְיָ֔הוּ וַ/יַּכֵּ֨/הוּ֙ וַ/יְמִיתֵ֔/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּ֑י/ו בִּ/שְׁנַ֣ת עֶשְׂרִ֔ים לְ/יוֹתָ֖ם בֶּן עֻזִיָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: te
  text: ఏలా కుమారుడైన హోషేయ రెమల్యా కుమారుడైన పెకహుకు వ్యతిరేకంగా కుట్ర పన్ని[a], అతనిని కొట్టి, చంపి, ఉజ్జియా కుమారుడైన యోతాము ఇరవయ్యవ సంవత్సరంలో అతని స్థానంలో రాజయ్యాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కుట్రను కుట్రపన్నాడు.” ఇది కుట్ర చేయడాన్ని బలంగా వ్యక్తపరిచే ఒకే మూలానికి చెందిన క్రియ-నామ పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం, “ఉజ్జియా కుమారుడైన యోతాము ఇరవయ్యవ సంవత్సరంలో” అని చెబుతుంది. రాజుల పాలనాకాల వివరాల్లో ఇది కాలక్రమ సమస్యను కలిగిస్తుంది. కొందరు దీన్ని ఆహాజు పాలనతో సమన్వయపరచడానికి ప్రయత్నిస్తారు; అయితే ఈ అనువాదం హీబ్రూ పాఠంలోని మాటలనే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: కుట్ర పన్ని
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన క్రియ-నామ పదబంధం బలాన్ని సూచిస్తుంది. తెలుగులో అదే పదాన్ని రెండుసార్లు వాడటం అసహజంగా ఉంటుంది; ‘కుట్ర పన్ని’ సహజంగా ఉండి భావబలాన్ని అందిస్తుంది. మూలంలోని నిర్మాణాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: ఏలా కుమారుడైన హోషేయ
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: రెమల్యా కుమారుడైన పెకహుకు వ్యతిరేకంగా
  rationale: కుట్ర సందర్భంలో עַל శత్రుత్వ చర్యకు గురైన వ్యక్తిని సూచిస్తుంది; ‘వ్యతిరేకంగా’ దాని సహజ తెలుగు సమానం.
- source_word: וַיַּכֵּהוּ
  choice: అతని మీద దాడిచేసి
  rationale: נכה ఇక్కడ హింసాత్మకంగా కొట్టడం లేదా దెబ్బతీయడం సూచిస్తుంది. తరువాతి క్రియ మరణాన్ని ప్రత్యేకంగా చెబుతుంది కాబట్టి, దీనినే ‘చంపి’ అని అనువదించకుండా చర్యల క్రమాన్ని కాపాడింది.
- source_word: וַיְמִיתֵהוּ
  choice: అతన్ని చంపి
  rationale: מות యొక్క హిఫీల్ రూపం మరణానికి కారణమవడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చంపి’ సహజమైన, స్పష్టమైన సమానం.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: מלך మరియు תַּחְתָּיו కలిపి రాజ్య వారసత్వాన్ని సూచిస్తాయి. ‘అతని స్థానంలో రాజయ్యాడు’ తెలుగు వాక్యరీతిలో సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: ఉజ్జియా కుమారుడైన యోతాము పాలనలో ఇరవయ్యో సంవత్సరంలో
  rationale: రాజ్యపాలన సంవత్సరాన్ని తెలిపే సూత్రాన్ని యథాతథంగా నిలిపింది; చారిత్రక కాలక్రమ సమస్యను ప్రధాన పాఠ్యంలో సవరించలేదు.
theological_decisions:
- issue: రాజ్యపాలన సంవత్సరాల కాలక్రమ ఉద్రిక్తత
  choice: మసోరా పాఠంలోని ‘యోతాము ... ఇరవయ్యో సంవత్సరంలో’ అనే తేదీని యథార్థంగా అనువదించడం
  alternative: ఆహాజు పాలనతో అంతర్లీనంగా సమన్వయపరచడం లేదా సంఖ్యను సవరించడం
  rationale: ఇతర రాజ్యపాలన వివరాలతో ఏర్పడే కాలక్రమ సమస్యను అనువాదం మౌనంగా పరిష్కరించకూడదు. మూలపాఠాన్ని ప్రధాన వచనంలో ఉంచి, సమస్యను పాదసూచికలో తెలియజేయడం పాఠ్య నిజాయితీని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. మూలంలోని క్రియల క్రమం, వ్యక్తుల పితృనామాలు, పరిష్కరించని కాలక్రమ ఉద్రిక్తత నిలుపబడ్డాయి.
