  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖א בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: te
  text: అతడు రాజైనప్పుడు ఇరవై ఐదు సంవత్సరాలవాడు. యెరూషలేములో పదహారు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెరూషా[a]; ఆమె సాదోకు కుమార్తె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును ‘యెరూషాహ్’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ఇరవై ఐదు సంవత్సరాలవాడు
  rationale: ఇది వయసును తెలిపే ప్రామాణిక హీబ్రూ నుడికారం. ‘ఇరవై ఐదు సంవత్సరాల కుమారుడు’ అనే అక్షరానువాదం ఆధునిక తెలుగులో అసహజంగా ఉంటుంది.
- source_word: הָיָה בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచించే హీబ్రూ రాజవంశ సూత్రానికి ఇది సహజమైన తెలుగు సమానార్థకం.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: పదహారు సంవత్సరాలు పరిపాలించాడు
  rationale: పాలనాకాలాన్ని స్పష్టంగా, సహజ తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలనామానికి ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణను, హీబ్రూ విభక్తి భావాన్ని నిలుపుతుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ సూత్రప్రయోగాన్ని అర్థనష్టం లేకుండా సహజ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יְרוּשָׁא
  choice: యెరూషా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: בַּת צָדוֹק
  choice: సాదోకు కుమార్తె
  rationale: కుటుంబ సంబంధాన్ని నేరుగా నిలుపుతూ, పేరును తెలుగులో సహజంగా విభక్తీకరించింది.
