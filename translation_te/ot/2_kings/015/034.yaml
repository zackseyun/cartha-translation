id: 2KI.15.34
reference: 2 Kings 15:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: te
  text: తన తండ్రి ఉజ్జియా[a] చేసినదంతటి ప్రకారమే అతడు యాహ్వే దృష్టిలో సరైనది చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇదే రాజును ఇతర చోట్ల ‘అజర్యా’ అని కూడా పిలుస్తారు.
    reason: ఈ వచనంలోని ఉజ్జియా అనే పేరుకు ఇతర గ్రంథభాగాల్లో కనిపించే ప్రత్యామ్నాయ రాజనామాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. విడిగా ఉన్న వచనంలో సహజమైన ఆధునిక తెలుగు కోసం ప్రారంభంలోని ‘మరియు’ను వ్యక్తపరచకుండా సాధారణ భూతకాలంగా అనువదించాం.
- source_word: הַיָּשָׁר
  choice: సరైనది
  rationale: ‘సరైనది చేయడం’ అనే హీబ్రూ నైతిక మూల్యాంకన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దేవుని మూల్యాంకనాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా, దాని దృశ్యరూప భావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేసినదంతా అనుసరించి
  rationale: మునుపటి వ్యక్తి ప్రవర్తనకు సంపూర్ణ అనురూపతను సూచించే తులనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֻזִיָּהוּ
  choice: ఉజ్జియా
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం ఉజ్జియా అనే పేరునే కలిగి ఉంది; ఇతర చోట్ల కనిపించే ప్రత్యామ్నాయ నామంతో సమన్వయపరచలేదు.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: ఇక్కడ ప్రత్యక్ష వంశ సంబంధమే ఉద్దేశించబడింది; ‘తన తండ్రి’ తెలుగులో స్పష్టమైన సహజ రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన నామరూపంతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరమైన గ్రంథశైలిని నిలిపాం. మూలంలోని దైవ మూల్యాంకన నుడికారాన్ని ‘యెహోవా దృష్టిలో’గా కాపాడాం.
