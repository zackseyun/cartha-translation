    issue: The divine name is rendered “యెహోవా.”
    rationale: The source has the Tetragrammaton, and the supplied English POB audit trail explicitly adopts “Yahweh.” “యాహ్వే” preserves that designated rendering rather than using the distinct conventional form ‘Jehovah.’
  - severity: low
