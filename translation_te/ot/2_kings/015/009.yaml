revisions:
- from: అతడు తన పితరులు చేసినట్టే యాహ్వే దృష్టికి చెడ్డదైనది చేశాడు. నెబాతు కుమారుడైన యరొబాము చేసిన పాపాలను అతడు విడిచిపెట్టలేదు; వాటి ద్వారా యరొబాము ఇశ్రాయేలును పాపం చేయించాడు.[a]
  to: అతడు తన పితరులు చేసినట్లే యాహ్వే దృష్టిలో చెడ్డది చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యరొబాము పాపాలనుండి అతడు తొలగిపోలేదు.[a]
  rationale: The revision adopts the relative clause's most direct grammatical connection to Jeroboam while preserving the viable sins-related construal in the footnote. It also improves Telugu idiom by using “యాహ్వే దృష్టిలో.” No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
