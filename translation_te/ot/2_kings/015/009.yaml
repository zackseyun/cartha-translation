source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: te
  text: అతడు తన పితరులు చేసినట్లే యాహ్వే దృష్టిలో చెడ్డది చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యరొబాము పాపాలనుండి అతడు తొలగిపోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నెబాతు కుమారుడైన యరొబాము చేసిన పాపాలనుండి అతడు తొలగిపోలేదు; వాటి ద్వారా యరొబాము ఇశ్రాయేలును పాపం చేయించాడు.” హీబ్రూ సంబంధ వాక్యాన్ని యరొబామును సూచించేదిగానో, అతనితో ముడిపడిన పాపాలను సూచించేదిగానో అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ గతకాల క్రియను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టికి చెడ్డదైనది
  rationale: ‘కళ్లలో’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ‘దృష్టికి’ అని ఇచ్చి, దేవుని నైతిక తీర్పును నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: తన పితరులు చేసినట్టే
  rationale: పోలికను స్పష్టంగా ఉంచుతూ, రాజవంశ సంబంధమైన పురుష బహువచన బంధుత్వ పదాన్ని ‘పితరులు’గా నిలుపుతుంది.
- source_word: לֹא סָר
  choice: విడిచిపెట్టలేదు
  rationale: ఒక పాపపు మార్గం నుంచి తొలగకపోవడం లేదా దాన్ని మానకపోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵחַטֹּאות
  choice: పాపాలను
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ యరొబాముతో ముడిపడిన పాపకార్యాల సముదాయాన్ని సూచిస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: వ్యక్తినామాలను తెలుగు బైబిలు శైలికి తగినట్లుగా లిప్యంతరీకరించి, తండ్రి-కుమారుని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: వాటి ద్వారా యరొబాము ఇశ్రాయేలును పాపం చేయించాడు
  rationale: సంబంధ వాక్యాన్ని ముందున్న ‘పాపాలు’తో సాధనార్థకంగా అనుసంధానిస్తుంది; అదే సమయంలో యరొబాము ఇశ్రాయేలును పాపంలో నడిపించిన భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో అందిస్తుంది.
- issue: אֲשֶׁר అనే సంబంధ పదం దేనిని సూచిస్తుంది?
  choice: '‘పాపాలు’ను సూచించేలా: ‘వాటి ద్వారా యరొబాము...’'
  alternative: 'యరొబామును సూచించేలా: ‘ఇశ్రాయేలును పాపం చేయించిన యరొబాము...’'
  rationale: హీబ్రూ సంబంధ వాక్యం వ్యాకరణపరంగా యరొబాముతోనూ అతని పాపాలతోనూ అనుసంధానించబడవచ్చు. ప్రధాన పాఠం పాపాలను సాధనంగా చూపే పఠనాన్ని ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- issue: אֲבֹתָיו లోని లింగసూచక బంధుత్వ పదం
  choice: తన పితరులు
  alternative: తన పూర్వీకులు
  rationale: రాజవంశ సందర్భంలో మూలంలోని పురుష బహువచన భావాన్ని విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యాహ్వే దృష్టికి చెడ్డదైనది’ అనే రూపం హీబ్రూ మూలంలోని స్థిర తీర్పు సూత్రాన్ని నిలుపుతుంది. సంబంధ వాక్యంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
