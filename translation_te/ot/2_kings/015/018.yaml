source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు. నెబాతు కుమారుడైన యరొబాము పాపాలను—వాటి ద్వారా అతడు ఇశ్రాయేలును పాపం చేయించాడు—అతడు తన జీవితకాలమంతా విడిచిపెట్టలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యరొబాము పాపాలను.” హీబ్రూలోని సంబంధ వాక్యాన్ని ‘పాపాలు’తో కాకుండా ‘యరొబాము’తో అనుసంధానించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: עשה + הרע అనే రాజుల గ్రంథాల్లోని స్థిరమైన నైతిక మూల్యాంకనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దైవిక మూల్యాంకనాన్ని సూచించే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది; יְהוָהను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించింది.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: పాపాలను ... విడిచిపెట్టలేదు
  rationale: సూర् క్రియలోని దూరమవడం/మానివేయడం భావాన్ని, పాపపు విధానాన్ని వదలకపోవడంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: హీబ్రూ పేర్లను ప్రామాణిక తెలుగు రూపాల్లో ఇచ్చి, తండ్రి-కొడుకు సంబంధాన్ని సహజంగా తెలిపింది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: వాటితో అతడు ఇశ్రాయేలును పాపం చేయించాడు
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థాన్ని కాపాడుతూ, సంబంధ వాక్యాన్ని సమీపంలోని ‘పాపాలు’తో అనుసంధానిస్తుంది.
- source_word: כָּל יָמָיו
  choice: తన జీవితకాలమంతా
  rationale: ‘అతని దినాలన్నీ’ అనే హీబ్రూ నుడికారాన్ని సాధారణ ఆధునిక తెలుగులో సంపూర్ణ కాలవ్యాప్తిగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל అనే సంబంధ వాక్యానికి పూర్వపదం
  choice: ‘పాపాలు’ను పూర్వపదంగా తీసుకొని ‘వాటితో అతడు...’
  alternative: యరొబామును పూర్వపదంగా తీసుకొని ‘ఇశ్రాయేలును పాపం చేయించిన యరొబాము’
  rationale: హీబ్రూ వ్యాకరణం రెండు అనుసంధానాలనూ అనుమతిస్తుంది. ప్రధాన పాఠం పాపాలను సమీప పూర్వపదంగా తీసుకుంటుంది; మరో సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచి అస్పష్టతను సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, రాజుల గ్రంథంలోని గంభీరమైన నైతిక మూల్యాంకన శైలిని నిలుపుకునేలా గౌరవప్రదంగానూ రూపొందించబడింది.
