translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. రాజకీయ సందర్భాన్ని స్పష్టంచేయడానికి ‘దండెత్తి’ మరియు ‘అండగా’ అనే నుడికారబద్ధమైన పదాలను ఎంచుకున్నప్పటికీ, ‘దేశం’ అనే మూలంలోని అనిర్దిష్టతను, ‘తన చేతిలో’ అనే రూపకాన్ని నిలుపుకున్నాం.
