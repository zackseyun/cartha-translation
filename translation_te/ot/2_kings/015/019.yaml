  text: בָּ֣א פ֤וּל מֶֽלֶךְ אַשּׁוּר֙ עַל הָ/אָ֔רֶץ וַ/יִּתֵּ֤ן מְנַחֵם֙ לְ/פ֔וּל אֶ֖לֶף כִּכַּר כָּ֑סֶף לִ/הְי֤וֹת יָדָי/ו֙ אִתּ֔/וֹ לְ/הַחֲזִ֥יק הַ/מַּמְלָכָ֖ה בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: te
  text: అష్షూరు రాజైన పూలు దేశం మీదికి దండెత్తి వచ్చాడు.[a] మెనహేము తన రాజ్యాన్ని తన చేతిలో స్థిరపరచుకోవడానికి పూలు మెనహేముకు అండగా ఉండేలా అతనికి వెయ్యి తలాంతుల వెండి ఇచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేశం’ అంటే బహుశా ఇశ్రాయేలు దేశం.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “పూలు చెయ్యి మెనహేముతో ఉండేలా, రాజ్యాన్ని అతని చేతిలో స్థిరపరచడానికి” అని ఉంది. ఇక్కడ ఒకరి ‘చెయ్యి’ మరొకరితో ఉండడం అంటే అండగా లేదా మద్దతుగా ఉండడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא פוּל מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజైన పూలు ... వచ్చాడు
  rationale: హీబ్రూ కథనంలోని ‘వచ్చాడు’ అనే భావాన్ని నిలుపుతూ, బిరుదుతో కూడిన వ్యక్తి పేరును ఆధునిక తెలుగులో సహజంగా అమర్చింది.
- source_word: עַל הָאָרֶץ
  choice: దేశం మీదికి దండెత్తి
  rationale: సైనిక కదలిక సందర్భంలో עַל విరోధపూర్వకంగా రావడాన్ని సూచిస్తుంది. కేవలం ‘మీదికి వచ్చాడు’ కంటే ‘దండెత్తి’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘దేశం’ అనే అనిర్దిష్టతను మాత్రం నిలుపుతుంది.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే సాధారణ క్రియకు నేరమైన సమానార్థకం; ఇది కప్పం లేదా రాజకీయ చెల్లింపు అని వచనమే సూచించనిస్తుంది.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: వెయ్యి తలాంతుల వెండి
  rationale: ככר అనే ప్రాచీన బరువు ప్రమాణానికి తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘తలాంతు’ను ఉపయోగించింది.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: పూలు తనకు అండగా ఉండేలా
  rationale: ‘అతని చెయ్యి ఇతనితో ఉండడం’ అనే హీబ్రూ నుడికారానికి రాజకీయ మద్దతు అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: తన రాజ్యాన్ని తన చేతిలో స్థిరపరచుకోవడానికి
  rationale: חזק హిఫీల్ రూపంలోని బలపరచడం/స్థిరపరచడం భావాన్నీ, ‘తన చేతిలో’ అనే అధీనతను సూచించే మూలభాషా రూపకాన్నీ నిలుపుతుంది.
