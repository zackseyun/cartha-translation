source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ זְכַרְיָ֨הוּ בֶן יָרָבְעָ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שִׁשָּׁ֥ה חֳדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: te
  text: యూదా రాజైన అజర్యా పరిపాలనలో ముప్పై ఎనిమిదవ సంవత్సరంలో, యెరోబాము కుమారుడు జెకర్యా షోమ్రోనులో ఇశ్రాయేలుపై రాజై ఆరు నెలలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: పరిపాలనలో ముప్పై ఎనిమిదవ సంవత్సరంలో
  rationale: రాజుల కాలనిర్ణయ సూత్రంలో హెబ్రీయ cardinal రూపం ordinal అర్థాన్ని ఇస్తుంది; తెలుగులో సహజంగా ‘ముప్పై ఎనిమిదవ సంవత్సరంలో’ అని చెప్పాలి.
- source_word: לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన అజర్యా పరిపాలనలో
  rationale: లామెద్ రాజు పరిపాలనా సంవత్సరాన్ని సూచిస్తుంది. ‘పరిపాలనలో’ అనే రూపం కాలనిర్ణయ సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: రాజై ... పరిపాలించాడు
  rationale: ఇక్కడ క్రియ రాజ్యాధికార స్వీకరణను సూచిస్తూ, తరువాతి కాలవ్యవధితో కలిసి అతని పాలనను తెలియజేస్తుంది. తెలుగు వాక్యంలో ‘రాజై ఆరు నెలలు పరిపాలించాడు’ అనేది రెండు భావాలనూ సహజంగా కలుపుతుంది.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: యెరోబాము కుమారుడు జెకర్యా
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని నేరుగా నిలిపింది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: עַל అనే ఉపసర్గ ఇక్కడ ప్రజలపై రాజ్యాధికారాన్ని సూచిస్తుంది; ‘ఇశ్రాయేలుపై’ మూల నిర్మాణానికీ సహజ తెలుగు ప్రయోగానికీ సరిపోతుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: ఇది అతని పాలనా కేంద్రాన్ని సూచించే స్థలవాచక పదబంధం; హెబ్రీయ పేరుకు దగ్గరగా ‘షోమ్రోను’ అని లిప్యంతరీకరించబడింది.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: ఆరు నెలలు
  rationale: ఇది కాలవ్యవధిని సూచించే accusative; తెలుగు క్రియతో ‘ఆరు నెలలు పరిపాలించాడు’ అని సహజంగా వ్యక్తమవుతుంది.
