translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన చారిత్రక కథన శైలిని ఉపయోగించాం. మూలంలోని రాజ్యకాల నిర్ధారణ, పాలనా స్థలం, ఆరు నెలల స్వల్ప పరిపాలన అన్నీ స్పష్టంగా నిలిపాం.
