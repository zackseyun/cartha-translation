source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: te
  text: ఎలీషా ఇశ్రాయేలు రాజుతో, “నాకూ నీకూ ఏమి సంబంధం?[a] నీ తండ్రి ప్రవక్తల దగ్గరకు, నీ తల్లి ప్రవక్తల దగ్గరకు వెళ్లు” అన్నాడు. అప్పుడు ఇశ్రాయేలు రాజు అతనితో, “కాదు; ఎందుకంటే యెహోవా ఈ ముగ్గురు రాజులను మోయాబు చేతికి అప్పగించడానికి పిలిచాడు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ జాతీయం అక్షరార్థంగా, “నాకేమి, నీకేమి?” అని ఉంటుంది; ఇది దూరం పెట్టడం లేదా తిరస్కరించడం వ్యక్తం చేసే మాట.
    reason: lexical_alternative
  - marker: b
    text: “దయచేసి అలా అనవద్దు; ఎందుకంటే యెహోవా ఈ ముగ్గురు రాజులను మోయాబు చేతికి అప్పగించడానికి పిలిచాడు” అని కూడా అనువదించవచ్చు. హెబ్రీ వ్యక్తీకరణ క్లిష్టంగా ఉండి, నేరమైన అభ్యంతరం కంటే విన్నపంగా కూడా అర్థమవుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: నాకూ నీకూ ఏమి సంబంధం?
  rationale: హెబ్రీ జాతీయం అక్షరార్థంగా ‘నాకేమి, నీకేమి?’ అనే రూపంలో ఉండి, దూరం పెట్టడం లేదా తిరస్కరించడం వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘నాకూ నీకూ ఏమి సంబంధం?’ సహజంగా అదే తీవ్రతను నిలుపుతుంది.
- source_word: לֵךְ
  choice: వెళ్లు
  rationale: సాధారణ ఏకవచన ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజమైన తెలుగులో ఇచ్చింది.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: నీ తండ్రి ప్రవక్తలు ... నీ తల్లి ప్రవక్తలు
  rationale: రాజవంశంతో అనుబంధమున్న ప్రవక్తలను ఉద్దేశించిన పదునైన సూచనను మూలానికి దగ్గరగా నిలుపుతుంది.
- source_word: אַל כִּי
  choice: వద్దు; ఎందుకంటే
  rationale: ఈ క్లిష్టమైన, సంక్షిప్త హెబ్రీ వ్యక్తీకరణ సందర్భంలో రాజు చేసిన అభ్యంతరంగా అర్థమవుతుంది. ‘వద్దు’ దాని నిరాకరణ/విన్నప స్వరాన్ని పూర్తిగా నిర్ణయించకుండా కొంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయ పఠనం పాదటిప్పణిలో ఇచ్చింది.
- source_word: קָרָא
  choice: పిలిచాడు
  rationale: యెహోవా ముగ్గురు రాజులను కూడగట్టాడు లేదా ఈ పరిస్థితిలోకి రప్పించాడు అనే విస్తృత భావాన్ని మూలంలోని సాధారణ క్రియకు దగ్గరగా ఉంచుతుంది.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ఈ ముగ్గురు రాజులను
  rationale: సంఖ్య, సూచనార్థకం, రాజులనే నిర్దిష్ట పదం అన్నింటినీ సహజ తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: לָתֵת אוֹתָם
  choice: వారిని ... అప్పగించడానికి
  rationale: ‘ఇవ్వడం’ అనే అక్షరార్థం ఇక్కడ శత్రువు అధికారానికి అప్పగించడం అనే భావంలో ఉంది; తెలుగులో ‘అప్పగించడం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּיַד מוֹאָב
  choice: మోయాబు చేతికి
  rationale: అధీనంలోకి ఇవ్వడాన్ని సూచించే హెబ్రీ ‘చేతిలో/చేతికి’ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంతో సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామరూపంలో ఉంచడం మూలభేదాన్ని కాపాడుతుంది; తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: రాజు పలికిన אַל כִּי యొక్క భావబలం
  choice: అభ్యంతరం/నిరాకరణగా ‘వద్దు; ఎందుకంటే’
  alternative: విన్నపంగా ‘దయచేసి అలా అనవద్దు; ఎందుకంటే’; విలాపంగా ‘అయ్యో! ఎందుకంటే’
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. సందర్భం ఎలీషా తిరస్కరణకు రాజు స్పందిస్తున్నాడని సూచించినా, అది కఠిన అభ్యంతరమా విన్నపమా అన్నది పూర్తిగా స్పష్టం కాదు; ప్రధాన పాఠం సంక్షిప్తతను, పాదటిప్పణి ప్రత్యామ్నాయాన్ని కాపాడుతున్నాయి.
- issue: ముగ్గురు రాజులను పిలిచిన ఉద్దేశం లేదా ఫలితం
  choice: ‘మోయాబు చేతికి అప్పగించడానికి పిలిచాడు’ అని ఉద్దేశ్య/ఫలిత సంబంధాన్ని తెరిచి ఉంచడం
  alternative: ‘పిలిచి, మోయాబు చేతికి అప్పగించాడు’
  rationale: לָתֵת అనే క్రియారూపం ఉద్దేశం లేదా సంభవించబోయే ఫలితాన్ని సూచించగలదు. మూలంలోని ఉద్రిక్తతను తీర్మానించకుండా తెలుగు ‘-డానికి’ నిర్మాణం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. సంభాషణలో సహజ ఏకవచన రూపాలు వాడబడ్డాయి. మూలంలోని జాతీయం, దైవనామం, క్లిష్టమైన రాజు ప్రతిస్పందన, ‘చేతికి అప్పగించడం’ అనే రూపకం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
