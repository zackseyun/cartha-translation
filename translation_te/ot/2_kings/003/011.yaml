source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: te
  text: 'యెహోషాపాతు ఇలా అన్నాడు: “అతని ద్వారా యాహ్వేను విచారించేందుకు ఇక్కడ యాహ్వే ప్రవక్త ఎవరూ లేరా?” అప్పుడు ఇశ్రాయేలు రాజు సేవకులలో ఒకడు సమాధానమిస్తూ ఇలా అన్నాడు: “ఏలీయా చేతులపై నీళ్లు పోసేవాడైన షాఫాతు కుమారుడు ఎలీషా ఇక్కడ ఉన్నాడు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ఇది బహుశా చేతులు కడుక్కోవడానికి నీళ్లు పోయడం వంటి వ్యక్తిగత సేవను సూచిస్తుంది; ఎలీషా ఏలీయాకు పరిచర్య చేసేవాడనే హెబ్రీ దృశ్యరూపం ఇక్కడ అలాగే ఉంచబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: ఎవరైనా ఇక్కడ లేరా?
  rationale: ప్రశ్నార్థక అవ్యయం, నిషేధం కలిగిన హెబ్రీ ప్రయోగంలోని భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: נָבִיא לַיהוָה
  choice: యాహ్వే ప్రవక్త
  rationale: లామెద్ సూచించే సంబంధం లేదా చెందిన భావాన్ని తెలుగులో సహజమైన నామసమాసంతో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאֹתוֹ
  choice: అతని ద్వారా మనం యాహ్వేను విచారిద్దాం
  rationale: דרשׁలోని దేవుని నుండి జవాబు కోరే భావాన్నీ, מֵאֹתוֹలోని ప్రవక్త మధ్యవర్తిత్వాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు సేవకుల్లో ఒకడు
  rationale: రాజసభ సందర్భంలో עֶבֶדను బానిస అని అతిగా నిర్దిష్టం చేయకుండా ‘సేవకుడు’గా అందిస్తుంది.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: అతడు ఏలీయా చేతుల మీద నీళ్లు పోసేవాడు
  rationale: వ్యక్తిగత పరిచర్యను సూచించే హెబ్రీ దృశ్యరూపాన్ని వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయకుండా నిలిపి, సందర్భసిద్ధమైన అలవాటు క్రియను తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో చతురక్షర దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా మూలనామాన్ని లిప్యంతరీకరించింది.
- issue: ప్రవక్త ద్వారా యాహ్వేను విచారించడం
  choice: అతని ద్వారా మనం యాహ్వేను విచారిద్దాం
  alternative: అతని వద్ద యాహ్వేను వెదకుదాం
  rationale: ప్రవక్తే జవాబుకు మూలమని కాక, అతని ద్వారా యాహ్వేను సంప్రదిస్తున్నారనే మూలంలోని మధ్యవర్తిత్వ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తినామాలకు తెలుగు బైబిల్ పాఠకులకు పరిచితమైన రూపాలు, దైవనామానికి మూలానికి దగ్గరైన ‘యాహ్వే’ రూపం వాడబడ్డాయి. హెబ్రీ వాక్యంలోని ‘నీళ్లు పోయడం’ అనే సాంస్కృతిక దృశ్యాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
