base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: te
  text: వారు ఉదయాన్నే లేచారు. సూర్యుడు నీళ్ల మీద ప్రకాశించాడు. అప్పుడు మోయాబు ప్రజలు తమకు ఎదురుగా ఉన్న నీళ్లు రక్తంలా ఎర్రగా ఉండడం చూశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోయాబు తమకు అవతల ఉన్న నీళ్లు రక్తంలా ఎర్రగా ఉండడం చూసింది.” హీబ్రూ పాఠంలో “మోయాబు” అనే దేశనామం మోయాబు ప్రజలను సమష్టిగా సూచిస్తుంది; స్థానసూచక పదబంధాన్ని “తమకు ఎదురుగా” లేదా “తమకు అవతల” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: వారు ఉదయాన్నే లేచారు
  rationale: שׁכם యొక్క హిఫీల్ రూపం తెల్లవారగానే లేదా ఉదయాన్నే లేవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా కాలసూచనను నిలుపుకుంది.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: సూర్యుడు నీళ్ల మీద ప్రకాశించాడు
  rationale: זרח ఇక్కడ సూర్యకాంతి నీళ్ల మీద పడిన దృశ్యాన్ని సూచిస్తుంది; కేవలం సూర్యోదయ సమయాన్ని కాక దాని దృశ్య ప్రభావాన్ని వ్యక్తం చేయడానికి ‘ప్రకాశించాడు’ ఎంచుకున్నాం.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: మోయాబు ప్రజలు ... చూశారు
  rationale: మూలంలోని ‘మోయాబు’ దేశనామం దాని ప్రజలను సమష్టిగా సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘మోయాబు ప్రజలు’ అని వ్యక్తీకరించాం.
- source_word: מִנֶּגֶד
  choice: తమకు ఎదురుగా ఉన్న
  rationale: ఈ పదం ఎదురుగా లేదా అవతల ఉన్న స్థాన సంబంధాన్ని సూచిస్తుంది. సందర్భంలో మోయాబు ప్రజల దృష్టిస్థానం నుంచి నీళ్ల స్థానాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת הַמַּיִם אֲדֻמִּים
  choice: నీళ్లు ... ఎర్రగా ఉండడం
  rationale: బహువచన విశేషణం నీళ్లు ఎర్రగా కనిపించాయని తెలుపుతుంది. ‘ఉండడం చూశారు’ అనే నిర్మాణం తెలుగు వాక్యంలో దృశ్య గ్రహణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּדָּם
  choice: రక్తంలా
  rationale: כ పోలికను సూచిస్తుంది. ‘రక్తంలా’ మూలంలోని స్పష్టమైన ఉపమానాన్ని సంక్షిప్తంగా నిలుపుతుంది.
