  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: te
  text: అహాబు చనిపోయినప్పుడు[a], మోయాబు రాజు ఇశ్రాయేలు రాజుపై తిరుగుబాటు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అహాబు మరణించిన సమయంలో.” ఈ హీబ్రూ కాలసూచక ప్రయోగాన్ని ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: చనిపోయినప్పుడు
  rationale: హీబ్రూ కథన సంధి וַיְהִי మరియు כְּతో కూడిన מות ధాతువు యొక్క క్రియానామ రూపం కలిసి తదుపరి సంఘటనకు కాలసంబంధ నేపథ్యాన్ని ఇస్తాయి. తెలుగులో ‘చనిపోయినప్పుడు’ సహజంగా ఉండి, మూలంలోని ‘ఎప్పుడు/మరణ సమయంలో’ అనే విస్తృత కాలార్థాన్ని నిలుపుతుంది.
- source_word: אַחְאָב
  choice: అహాబు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּפְשַׁע
  choice: తిరుగుబాటు చేశాడు
  rationale: ఈ రాజకీయ సందర్భంలో פשע అధిపతి అధికారాన్ని తిరస్కరించి తిరుగుబాటు చేయడాన్ని సూచిస్తుంది; ‘తిరుగుబాటు చేశాడు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధ పదబంధంగా ఇచ్చాం.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుపై
  rationale: פשעతో వచ్చిన בְּ ఇక్కడ తిరుగుబాటు ఎవరికి వ్యతిరేకంగా జరిగిందో సూచిస్తుంది. తెలుగులో ‘రాజుపై’ ఆ రాజకీయ వ్యతిరేకతను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వాక్యారంభంలోని హీబ్రూ కథన సూత్రాన్ని తెలుగులో కృత్రిమంగా వినిపించే ‘అప్పుడు జరిగింది’గా విడిగా అనువదించకుండా కాలవాక్యంలో సహజంగా సమీకరించాం; దాని భావాన్ని పాదటిప్పణిలో సూచించాం.
