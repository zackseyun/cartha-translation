source:
  edition: WLC
  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: te
  text: మోయాబు రాజు యుద్ధం తనకు మించినదైందని చూసినప్పుడు, కత్తి దూసిన ఏడువందల మందిని తనతో తీసుకొని ఎదోము రాజువైపు[a] చొచ్చుకుపోవడానికి ప్రయత్నించాడు. కాని వారు చొచ్చుకుపోలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎదోము రాజుకు వ్యతిరేకంగా.’ ఈ సైనిక సందర్భంలో హీబ్రూ విభక్తి ‘వైపు’ అనే దిశార్థాన్నిగానీ, ‘వ్యతిరేకంగా’ అనే విరోధార్థాన్నిగానీ ఇవ్వవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: యుద్ధం తనకు మించినదైంది
  rationale: యుద్ధం మోయాబు రాజు శక్తికి మించి అతణ్ణి అధిగమిస్తున్నదనే హీబ్రూ ప్రయోగ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֹתוֹ
  choice: తనతో
  rationale: ఇక్కడ రాజు ఆ దళాన్ని తన వెంట తీసుకెళ్లాడనే సహచర్య భావం సందర్భానికి సరిపోతుంది.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: ఏడువందల మంది
  rationale: సైనిక సందర్భంలో లెక్కించబడిన పురుషులను నేరుగా సూచిస్తుంది; ‘సైనికులు’ అని విస్తరించడం అవసరం లేదు.
- source_word: שֹׁלֵף חֶרֶב
  choice: కత్తి దూసే
  rationale: అక్షరార్థ చిత్రణను నిలుపుతూ యుద్ధానికి సిద్ధమైన పోరాట యోధులను సహజంగా సూచిస్తుంది.
- source_word: לְהַבְקִיעַ
  choice: చొచ్చుకుపోవడానికి
  rationale: శత్రు వరుసలను ఛేదించి వెళ్లే సైనిక చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: ఎదోము రాజువైపు
  rationale: אֶל యొక్క దిశార్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సైనిక సందర్భంలో సాధ్యమైన విరోధార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וְלֹא יָכֹלוּ
  choice: కాని వారు చొచ్చుకుపోలేకపోయారు
  rationale: బహువచన క్రియను రాజు మరియు అతని మనుషుల సమూహానికి అన్వయించి, వారు ప్రయత్నించిన కార్యాన్నే తెలుగులో స్పష్టంగా పునరుద్ఘాటిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని సైనిక చిత్రణను వీలైనంత వరకు నిలిపి, אֶל లోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
