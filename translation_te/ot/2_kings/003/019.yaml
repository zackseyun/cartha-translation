translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వరుస క్రియారూపాలను సందర్భానికి తగిన భవిష్యత్ వాక్యాలుగా ఉంచాం; అవి ప్రవచనాత్మక నిశ్చయాన్నీ కార్యనిర్దేశ స్వరాన్నీ మోయగలవు. ‘ప్రతి/అన్నీ’ అనే పునరావృత సమగ్రతను తెలుగులో సహజంగా నిలిపాం.
