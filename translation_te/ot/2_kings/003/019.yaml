id: 2KI.3.19
reference: 2 Kings 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: te
  text: మీరు కోటబద్ధమైన ప్రతి పట్టణం మీదా, శ్రేష్ఠమైన ప్రతి పట్టణం మీదా[a] దాడి చేస్తారు. ప్రతి మంచి చెట్టునూ నేలకూలుస్తారు; నీటి ఊటలన్నిటినీ మూసివేస్తారు; ప్రతి మంచి భూభాగాన్నీ రాళ్లతో పాడుచేస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎంపికైన ప్రతి పట్టణం,’ లేదా ‘అత్యుత్తమమైన ప్రతి పట్టణం.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘రాళ్లతో బాధ కలిగిస్తారు.’ ఇక్కడ సాగుభూమిపై రాళ్లు వేసి దాన్ని పాడుచేయడం ఉద్దేశం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: మీరు ... దాడి చేస్తారు
  rationale: נכה అనే క్రియ సైనిక సందర్భంలో కొట్టడం లేదా దాడి చేయడం అనే భావాన్ని ఇస్తుంది. పట్టణాలు కర్మలుగా ఉన్నందున ‘దాడి చేస్తారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘జయిస్తారు’ అని ఫలితాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: עִיר מִבְצָר
  choice: ప్రాకారాలు గల ప్రతి పట్టణం
  rationale: מִבְצָר పట్టణపు రక్షణాత్మక కోటబందోబస్తును సూచిస్తుంది. ‘ప్రాకారాలు గల పట్టణం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: עִיר מִבְחוֹר
  choice: శ్రేష్ఠమైన ప్రతి పట్టణం
  rationale: מִבְחוֹר ఎంపికైనది, శ్రేష్ఠమైనది లేదా అత్యుత్తమమైనది అనే భావం కలిగిన అరుదైన పదం. ప్రధాన పాఠంలో సహజమైన ‘శ్రేష్ఠమైన’ను ఉంచి, ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
- source_word: תַּפִּילוּ
  choice: నేలకూలుస్తారు
  rationale: נפל యొక్క హిఫీల్ రూపం ‘పడేలా చేయడం’ను సూచిస్తుంది. చెట్ల సందర్భంలో ‘నేలకూలుస్తారు’ మూలంలోని causative భావాన్ని కాపాడుతుంది; వాటిని ఏ విధంగా కూలుస్తారో అదనంగా చెప్పదు.
- source_word: כָּל עֵץ טוֹב
  choice: ప్రతి మంచి చెట్టు
  rationale: טוֹב సాధారణంగా ‘మంచి’ అని అర్థం. సందర్భంలో విలువైన లేదా ఫలవంతమైన చెట్లు ఉద్దేశించబడి ఉండవచ్చు గాని, మూలంలోని విస్తృతతను కాపాడేందుకు ‘మంచి’ అని అనువదించాం.
- source_word: מַעְיְנֵי מַיִם
  choice: నీటి ఊటలన్నీ
  rationale: ఈ పదబంధం సహజ నీటి ఊటలను సూచిస్తుంది. ‘నీటి ఊటలు’ ఆధునిక తెలుగులో స్పష్టమైన, నేరమైన అనువాదం.
- source_word: תִּסְתֹּמוּ
  choice: మూసివేస్తారు
  rationale: ఈ క్రియ ఊటలు లేదా బావులను మూయడం, అడ్డుకోవడం అనే భావాన్ని ఇస్తుంది. ‘మూసివేస్తారు’ లక్ష్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: మంచి భూమి ముక్కనల్లా
  rationale: חֶלְקָה అనేది భూమిలో ఒక భాగం లేదా సాగుభూమి ముక్క. కేవలం ‘పొలం’ అని పరిమితం చేయకుండా మూలార్థాన్ని సహజంగా వ్యక్తపరచేందుకు ‘భూమి ముక్క’ను ఎంచుకున్నాం.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: రాళ్లతో పాడుచేస్తారు
  rationale: כאב యొక్క హిఫీల్ రూపం అక్షరార్థంగా ‘బాధ కలిగించడం’ అయినా, ఇక్కడ రాళ్లు వేసి సాగుభూమిని పనికిరాకుండా చేయడాన్ని సూచిస్తుంది. ‘పాడుచేస్తారు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; అసాధారణ పదప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
