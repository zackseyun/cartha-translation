  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: te
  text: అహాబు కుమారుడైన యెహోరాము సమరయలో ఇశ్రాయేలుపై రాజయ్యాడు. అది యూదా రాజైన యెహోషాపాతు పరిపాలనలోని పద్దెనిమిదవ సంవత్సరం.[a] అతడు పన్నెండు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మరియు అహాబు కుమారుడైన యెహోరాము…” హెబ్రీ పాఠం ‘మరియు’ అనే సంధానంతో మొదలవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: యెహోరాము
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. ముందున్న וְ కథనాన్ని కొనసాగించే సంధానం; సహజమైన తెలుగు కథనశైలిలో దాన్ని ప్రధాన వాక్యంలో ప్రత్యేక పదంగా చూపకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: בֶּן אַחְאָב
  choice: అహాబు కుమారుడైన
  rationale: తండ్రి–కుమార సంబంధాన్ని సహజమైన, స్పష్టమైన తెలుగు విశేషణబంధంగా అనువదించాం.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ క్రియ రాజ్యపాలన ప్రారంభాన్ని, అంటే సింహాసనారోహణను సూచిస్తుంది; తరువాత వచ్చే పాలనాకాలాన్ని తెలిపే క్రియతో తేడా నిలిచేలా ‘రాజయ్యాడు’ అని ఇచ్చాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: రాజు ఒక ప్రజలపై అధికారం చేపట్టడాన్ని తెలుగులో సహజంగా తెలిపే రాజ్యపాలనా ప్రయోగం.
- source_word: בְּ/שֹׁמְרוֹן
  choice: సమరయలో
  rationale: స్థలార్థక בְ ను ‘లో’గా అనువదించాం; ఇక్కడ సమరయ రాజధాని నగరాన్ని సూచిస్తుంది.
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: పద్దెనిమిదవ సంవత్సరంలో
  rationale: రాజుల పాలనా సంవత్సరాల సమకాలిక గణనను తెలిపే సూత్రానికి సహజమైన తెలుగు రూపం.
- source_word: לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు పరిపాలనలో
  rationale: ఇక్కడ לְ యెహోషాపాతు పాలనకు చెందిన సంవత్సరాన్ని సూచిస్తుంది; తెలుగులో అర్థం వెంటనే స్పష్టమయ్యేలా ‘పరిపాలనలో’ అని వ్యక్తపరిచాం.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: అతడు పన్నెండు సంవత్సరాలు పరిపాలించాడు
  rationale: ఈ రెండవ מלך రూపం రాజ్యపాలన వ్యవధిని సూచిస్తుంది; మొదటి క్రియలోని సింహాసనారోహణ భావంతో తేడాను కాపాడాం.
