translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. రాజ్యారంభాన్ని ‘రాజయ్యాడు’తో, పాలన వ్యవధిని ‘పరిపాలించాడు’తో వేరు చేశాం.
