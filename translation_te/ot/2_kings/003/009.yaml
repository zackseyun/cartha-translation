id: 2KI.3.9
reference: 2 Kings 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלֶךְ֩ מֶ֨לֶךְ יִשְׂרָאֵ֤ל וּ/מֶֽלֶך יְהוּדָה֙ וּ/מֶ֣לֶךְ אֱד֔וֹם וַ/יָּסֹ֕בּוּ דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא הָיָ֨ה מַ֧יִם לַֽ/מַּחֲנֶ֛ה וְ/לַ/בְּהֵמָ֖ה אֲשֶׁ֥ר בְּ/רַגְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలు రాజు యూదా రాజుతోను ఎదోము రాజుతోను బయలుదేరాడు; వారు ఏడు రోజుల ప్రయాణం గల దారిలో చుట్టూ తిరిగి వెళ్లారు. అయితే శిబిరానికి గానీ, వారిని అనుసరించిన పశువులకు[a] గానీ నీళ్లు లేకపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి పాదాల వద్ద ఉన్న పశువులు”; అంటే వారితో పాటు వస్తున్న పశువులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: బయలుదేరి
  rationale: הלך యొక్క సాధారణ కథనార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలోని సైనిక భావాన్ని క్రియలో అదనంగా చేర్చదు.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: ఇశ్రాయేలు రాజు, యూదా రాజు, ఎదోము రాజు
  rationale: మూడు రాజులను విడివిడిగా పేర్కొన్న హీబ్రూ సమన్వయాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים
  choice: ఏడు రోజుల ప్రయాణమయ్యే చుట్టుదారిలో వెళ్లారు
  rationale: סבב లోని చుట్టూ లేదా మళ్లింపు దారిలో వెళ్లే భావాన్నీ, דרך שבעת ימים లోని ఏడు రోజుల ప్రయాణ పరిమాణాన్నీ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְלֹא הָיָה מַיִם
  choice: నీళ్లు లేకపోయాయి
  rationale: అస్తిత్వాన్ని నిరాకరించే హీబ్రూ వాక్యానికి నేరమైన, ఆధునిక తెలుగు రూపం.
- source_word: לַמַּחֲנֶה
  choice: శిబిరానికి
  rationale: מַחֲנֶה కు సందర్భోచితమైన సాధారణ అర్థం; హీబ్రూలో స్పష్టంగా లేని అదనపు సైనిక విశేషణాన్ని చేర్చదు.
- source_word: וְלַבְּהֵמָה
  choice: పశువులకు
  rationale: వారితో ప్రయాణిస్తున్న పెంపుడు లేదా భారవాహక జంతువులను సమష్టిగా సూచిస్తుంది.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: వారిని అనుసరించిన
  rationale: అక్షరార్థంగా ‘వారి పాదాల దగ్గర ఉన్న’ అనే హీబ్రూ నుడికారానికి సందర్భానుసారమైన సహజ తెలుగు అర్థం; అక్షర రూపం పాదసూచికలో ఉంచబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చుట్టుదారి’ ద్వారా మార్గం నేరుగా కాకుండా తిరిగివెళ్లిన భావం, ‘ఏడు రోజుల ప్రయాణమయ్యే’ ద్వారా ప్రయాణ పరిమాణం నిలుపబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత వాక్యభాగం తరువాత ఉంచబడింది.
