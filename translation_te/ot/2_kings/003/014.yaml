id: 2KI.3.14
reference: 2 Kings 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֗ע חַי יְהוָ֤ה צְבָאוֹת֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו כִּ֗י לוּלֵ֛י פְּנֵ֛י יְהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֲנִ֣י נֹשֵׂ֑א אִם אַבִּ֥יט אֵלֶ֖י/ךָ וְ/אִם אֶרְאֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: te
  text: 'ఎలీషా ఇలా అన్నాడు: “నేను ఎవరి సన్నిధిలో నిలబడ్డానో, సైన్యాల యహ్వే జీవముతోడు! యూదా రాజైన యెహోషాపాతును గౌరవించకపోయి ఉంటే, నేను నీ వైపు చూసేవాడిని కాదు, నిన్ను చూసేవాడిని కూడా కాదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: ఆ సైన్యాల యహ్వే జీవం తోడు
  rationale: ఇది హీబ్రూ ప్రమాణ సూత్రం. ‘జీవం తోడు’ అనే తెలుగు ప్రయోగం ప్రమాణ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘సైన్యాల’ అన్నది צְבָאוֹת యొక్క విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: నేను ఎవరి సన్నిధిలో నిలబడుతున్నానో
  rationale: దేవుని ఎదుట నిలబడే దృశ్యాన్ని, దానిలో అంతర్లీనంగా ఉన్న ప్రవక్త సేవ భావాన్ని రెండింటినీ నిలుపుతుంది. హీబ్రూలోని సంపూర్ణ క్రియకు ఈ సందర్భంలో కొనసాగుతున్న స్థితి భావం ఉంది.
- source_word: פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: యెహోషాపాతును గౌరవించకపోయి ఉంటే
  rationale: ‘ముఖాన్ని ఎత్తడం/స్వీకరించడం’ అనే హీబ్రూ నుడికారానికి ఇక్కడ చూపే గౌరవం లేదా ఆదరణ భావం ఉంది. పదక్షర రూపం తెలుగులో అసహజంగా ఉండటంతో నుడికార భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, ముఖం అనే రూపకాన్ని పాదసూచికలో ఉంచింది.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: నేను నీ వైపు చూసేవాణ్ణి కాదు, నిన్ను గమనించేవాణ్ణి కూడా కాదు
  rationale: ప్రమాణ నిర్మాణంలో అంతర్లీనంగా ఉన్న నిషేధాన్ని తెలుగులో స్పష్టం చేస్తూ, ‘చూడడం’ మరియు ‘గమనించడం’ అనే రెండు సమాంతర క్రియలనూ నిలిపింది.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు
  rationale: వ్యక్తి పేరు, రాజ్యనామం ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ధ్వన్యంతరీకరించబడ్డాయి.
theological_decisions:
- issue: యెహోవా నామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తినామం ప్రత్యక్షంగా ఉంది. కాబట్టి దాన్ని బిరుదుగా మార్చకుండా, ఆధునికంగా పునర్నిర్మించిన ఉచ్చారణకు దగ్గరగా ధ్వన్యంతరీకరించింది.
- issue: దేవుని ఎదుట ప్రవక్త స్థానం
  choice: ఎవరి సన్నిధిలో నిలబడుతున్నానో
  alternative: ఎవరిని నేను సేవిస్తున్నానో
  rationale: ఈ మాట ప్రవక్త సేవను సూచించగలిగినా, ప్రధాన పాఠ్యం నిలబడే మూల రూపకాన్ని కాపాడి, సేవ అనే వివరణతో భావాన్ని సంకుచితం చేయలేదు.
- issue: యెహోషాపాతు పట్ల చూపిన గౌరవం
  choice: యెహోషాపాతును గౌరవించకపోయి ఉంటే
  alternative: యెహోషాపాతు ముఖాన్ని ఎత్తకపోయి ఉంటే
  rationale: రాజు పట్ల ప్రవక్త చూపిన ఆదరణను సహజ తెలుగులో తెలిపింది; ఈ గౌరవానికి కారణం లేదా దాని ధార్మిక మూల్యాంకనాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ప్రమాణ సూత్రానికి ‘జీవం తోడు’ అనే సహజ తెలుగు రూపం ఎంచుకోబడింది. చివరి రెండు క్రియల సమాంతరతను నిలుపుతూ అనవసరమైన ప్రాచీన పదజాలాన్ని నివారించింది.
