  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, యుద్ధకథనానికి తగిన గంభీరతతో అనువదించబడింది. ‘ఇశ్రాయేలు’ మరియు ‘మోయాబు’ అనే సమష్టి నామాలను తెలుగులో చర్యచేసే ప్రజలుగా సహజంగా చూపేందుకు అవసరమైన చోట ‘ఇశ్రాయేలీయులు,’ ‘మోయాబీయులు’ అని వాడాం. మూలంలోని בָּהּ ప్రత్యయ అస్పష్టతను ప్రధాన పాఠ్యంలో ‘దానిలోకి’ అని ఉంచి, పాదసూచికలో సాధ్యమైన అర్థాలను ఇచ్చాం.
