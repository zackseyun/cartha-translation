  text: וַ/יָּבֹאוּ֮ אֶל מַחֲנֵ֣ה יִשְׂרָאֵל֒ וַ/יָּקֻ֤מוּ יִשְׂרָאֵל֙ וַ/יַּכּ֣וּ אֶת מוֹאָ֔ב וַ/יָּנֻ֖סוּ מִ/פְּנֵי/הֶ֑ם ו/יבו בָ֔/הּ וְ/הַכּ֖וֹת אֶת מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: te
  text: వారు ఇశ్రాయేలు శిబిరానికి వచ్చినప్పుడు, ఇశ్రాయేలీయులు లేచి మోయాబీయులను కొట్టారు; మోయాబీయులు వారి ఎదుటనుండి పారిపోయారు. అప్పుడు ఇశ్రాయేలీయులు దానిలోకి[a] వెళ్లి మోయాబీయులను కొడుతూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశంలోకి ప్రవేశించారు’ లేదా ‘మోయాబులోకి ముందుకు సాగారు.’ హీబ్రూలో అక్షరార్థంగా ‘దానిలోకి వెళ్లారు’ అని ఉంది. అక్కడి స్త్రీలింగ ప్రత్యయం ప్రజలను నేరుగా కాక దేశాన్ని లేదా భూభాగాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: శిబిరం
  rationale: యుద్ధ సందర్భంలో ఈ నామవాచకం సైనిక శిబిరాన్ని సూచిస్తుంది; ‘శిబిరం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ యుద్ధానికి నిర్ణయాత్మకంగా సిద్ధపడి చర్యలోకి దిగడాన్ని సూచిస్తుంది; ‘లేచి’ కథన క్రమాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: וַיַּכּוּ אֶת־מוֹאָב
  choice: మోయాబీయులపై దాడి చేశారు
  rationale: נכה యొక్క కొట్టడం/దెబ్బతీయడం అనే యుద్ధార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఓడించారు’ అని ఫలితాన్ని ముందుగానే చేర్చదు.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: వారి ఎదుట నిలవలేక పారిపోయారు
  rationale: ‘వారి సన్నిధి నుండి/వారి ఎదుట నుండి పారిపోవడం’ అనే హీబ్రూ యుద్ధ నుడికారాన్ని తెలుగులో సహజంగా, పరాజయంతో వెనుదిరిగిన భావంతో అందిస్తుంది.
- source_word: וַיָּבֹאוּ בָהּ
  choice: దానిలోకి వెళ్లి
  rationale: בָּהּ లోని స్త్రీలింగ ఏకవచన ప్రత్యయం దేనిని సూచిస్తుందో మూలంలో స్పష్టంగా లేదు; ‘దానిలోకి’ ఆ సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: וְהַכּוֹת אֶת־מוֹאָב
  choice: మోయాబీయులను కొడుతూనే ఉన్నారు
  rationale: సంయోజక అవ్యయంతో వచ్చిన infinitive construct కొనసాగుతున్న లేదా తోడుగా సాగిన యుద్ధచర్యను సూచిస్తుంది; ‘కొడుతూనే ఉన్నారు’ ఆ durative భావాన్ని అందిస్తుంది.
- source_word: מוֹאָב
  choice: మోయాబీయులు / మోయాబీయులను
  rationale: హీబ్రూలో స్థల-ప్రజల పేరు సమష్టిగా వాడబడింది. తెలుగులో వ్యక్తుల చర్యను స్పష్టంగా, సహజంగా తెలియజేయడానికి సమష్టి ప్రజానామ రూపం వాడబడింది.
