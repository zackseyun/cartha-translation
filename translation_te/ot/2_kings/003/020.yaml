  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ כַּ/עֲל֣וֹת הַ/מִּנְחָ֔ה וְ/הִנֵּה מַ֥יִם בָּאִ֖ים מִ/דֶּ֣רֶךְ אֱד֑וֹם וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֶת הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: te
  text: ఉదయాన, ధాన్యార్పణను అర్పించే సమయంలో[a], ఇదిగో, ఎదోము దిశనుండి[b] నీళ్లు వస్తున్నాయి; ఆ ప్రాంతమంతా ఆ నీళ్లతో నిండిపోయింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ధాన్యార్పణ పైకెక్కే సమయంలో.’ బలిపీఠం మీద దానిని సమర్పించడాన్ని సూచించే యాజ్ఞిక వాడుక ఇది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎదోము మార్గం నుంచి’ లేదా ‘ఎదోము మీదుగా.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో, ‘భూమి/దేశం ఆ నీళ్లతో నిండిపోయింది’; సందర్భాన్ని బట్టి ‘నేల ఆ నీళ్లతో నిండిపోయింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం
  rationale: కథనంలోని తదుపరి సంఘటనను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తూ, కాలసూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: ధాన్యార్పణను అర్పించే వేళకు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే రూపకాన్ని యాజ్ఞిక సందర్భంలో అర్పణ సమర్పణగా వ్యక్తం చేస్తుంది; מִנְחָהను సందర్భానుసారంగా ధాన్యార్పణగా నిర్దిష్టం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన దృశ్యంపై పాఠకుని దృష్టిని ఆకర్షించే హీబ్రూ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: מַיִם בָּאִים
  choice: నీళ్లు వస్తున్నాయి
  rationale: బָּאִים అనే కృదంతంలోని కొనసాగుతున్న, కంటికి కనిపిస్తున్న కదలికను వర్తమాన దృశ్యరూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: ఎదోము వైపు నుంచి
  rationale: דֶּרֶךְ యొక్క మార్గం/దిశ భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, నీళ్లు వచ్చిన భౌగోళిక దిశను కాపాడుతుంది.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: ఆ ప్రాంతం ఆ నీళ్లతో నిండిపోయింది
  rationale: הָאָרֶץను సమస్త భూమిగా కాక సందర్భంలోని ప్రదేశంగా గ్రహిస్తుంది; ‘ఆ నీళ్లు’ అనడం ముందే ప్రస్తావించిన నిర్దిష్ట నీటిని సూచించే హీబ్రూ నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
