source:
  edition: WLC
  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: te
  text: వారు పట్టణాలను పడగొట్టారు. మంచి ప్రతి భూభాగం మీద ప్రతి ఒక్కరూ ఒక్కో రాయి విసిరి, దాన్ని రాళ్లతో నింపారు.[a] ప్రతి నీటి ఊటను పూడ్చివేశారు; మంచి చెట్లన్నిటినీ నరికివేశారు.[b] కీర్-హరెశెత్‌లో[c] దాని రాళ్లు మాత్రమే మిగిలే వరకు ఇలా చేశారు. అప్పుడు వడిసెలవారు దాన్ని చుట్టుముట్టి దాడి చేశారు.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచి ప్రతి పొలం.” హీబ్రూ పదం భూమిలోని భాగాన్ని లేదా పొలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మంచి ప్రతి చెట్టు”; ఇది ప్రత్యేకంగా విలువైన లేదా ఫలప్రదమైన చెట్లను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: కీర్-హరెశెత్ ఒక స్థలనామం; ఈ సందర్భంలో అది మోయాబులోని ప్రధాన కోటపట్టణం అయి ఉండవచ్చు.
    reason: cultural_note
  - marker: d
    text: లేదా, “దాన్ని కొట్టారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “కొట్టు” అని అర్థం; ఇక్కడ అది పట్టణంపై సైనిక దాడిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: వారు పట్టణాలను పడగొట్టారు
  rationale: עִיר నగరం లేదా పట్టణాన్ని సూచించగలదు; ఈ సందర్భంలో సహజమైన తెలుగు కోసం ‘పట్టణాలు’ ఎంచుకున్నాం. הרס నిర్మాణాలను కూల్చడం అనే స్పష్టమైన భావాన్ని ఇస్తుంది.
- source_word: חֶלְקָה טוֹבָה
  choice: సారవంతమైన ప్రతి భూభాగం
  rationale: חֶלְקָה అనేది భూమిలోని భాగం లేదా పొలాన్ని సూచిస్తుంది. వ్యవసాయ నాశన సందర్భంలో טוֹבָה భావాన్ని ‘సారవంతమైన’ అని సహజంగా వ్యక్తపరుస్తుంది; ‘మంచి పొలం’ ప్రత్యామ్నాయం.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: ప్రతి ఒక్కరూ ఒక్కో రాయి విసిరి, దాన్ని రాళ్లతో నింపారు
  rationale: హీబ్రూ పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరూ ఒక్కో రాయి’ నిలుపుతుంది. וּמִלְאוּהָను ప్రత్యక్ష సమన్వయ క్రియగా అనువదించాం; తెలుగులో ఉద్దేశం స్పష్టమయ్యేందుకు ‘రాళ్లతో’ చేర్చాం.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: ప్రతి నీటి ఊటను పూడ్చివేశారు
  rationale: מַעְיַן సహజ నీటి ఊట; סתם దానిని మూసివేయడం లేదా అడ్డుకోవడం. ఈ సందర్భంలో ‘పూడ్చివేశారు’ సహజంగా ఉంటుంది.
- source_word: וְכָל עֵץ טוֹב יַפִּילוּ
  choice: మంచి చెట్లన్నిటినీ నరికివేశారు
  rationale: עֵץ טוֹב అక్షరార్థంగా ‘మంచి చెట్టు’; అది విలువైన లేదా ఫలప్రదమైన చెట్లను సూచించవచ్చు. Hiphil יַפִּילוּ ‘పడగొట్టారు’ అనే భావం చెట్ల విషయంలో ‘నరికివేశారు’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ
  choice: చివరికి ... దాని రాళ్లు మాత్రమే మిగిలాయి
  rationale: ఏకవచన క్రియలోని సామూహిక లేదా నిర్వ్యక్తిక భావాన్ని సహజమైన తెలుగు ఫలిత వాక్యంగా ఇచ్చాం; స్త్రీలింగ ప్రత్యయం పట్టణాన్నే సూచిస్తుంది.
- source_word: בַּקִּיר חֲרָשֶׂת
  choice: కీర్-హరెశెత్‌లో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం; בְּ ఉపసర్గకు ‘లో’ సరిపోతుంది.
- source_word: הַקַּלָּעִים
  choice: వడిసెలవారు
  rationale: ఈ నామవాచకం యుద్ధంలో వడిసెలతో రాళ్లు విసిరే సైనికులను సూచిస్తుంది.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: దాన్ని చుట్టుముట్టి దాడి చేశారు
  rationale: סבב చుట్టుముట్టడాన్ని సూచిస్తుంది. נכה అక్షరార్థంగా కొట్టడం; ఇక్కడ పట్టణంపై సైనిక చర్య కావడంతో ‘దాడి చేశారు’ సహజమైన సందర్భార్థం.
