translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. యుద్ధం మరియు వ్యవసాయ నాశనానికి సంబంధించిన స్పష్టమైన చిత్రణను నిలుపుతూ, హీబ్రూలోని అస్పష్టతలను పాదసూచికల్లో పేర్కొన్నాం. ప్రధాన వాక్యంలో పాదసూచిక గుర్తులను సంబంధిత పదబంధాల వెంట ఉంచాం.
