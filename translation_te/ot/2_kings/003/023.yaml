language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ דָּ֣ם זֶ֔ה הָחֳרֵ֤ב נֶֽחֶרְבוּ֙ הַ/מְּלָכִ֔ים וַ/יַּכּ֖וּ אִ֣ישׁ אֶת רֵעֵ֑/הוּ וְ/עַתָּ֥ה לַ/שָּׁלָ֖ל מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: te
  text: అప్పుడు వారు[a], “ఇది రక్తం! ఆ రాజులు తప్పకుండా ఒకరితో ఒకరు పోరాడి, ఒకరినొకరు కొట్టి ఉండాలి. ఇప్పుడు, మోయాబూ[b], దోపిడిసొమ్ము కోసం ముందుకు!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రాజులు పూర్తిగా నాశనమయ్యారు,” లేదా, “ఆ రాజులు ఒకరినొకరు పూర్తిగా నాశనం చేసుకున్నారు.” హెబ్రీలో ‘నాశనమవడం/పాడవడం’ అనే క్రియను బలంగా చెప్పే రూపం ఉంది; సందర్భంలో రాజులు పరస్పరం యుద్ధం చేసుకున్నారని మోయాబీయులు ఊహిస్తున్నారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మోయాబీయులారా, దోపిడిసొమ్ము కోసం ముందుకు వెళ్లండి!”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: ఇది రక్తం!
  rationale: క్రియలేని హెబ్రీ ఆశ్చర్యోక్తిలోని זֶה సూచనార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: ఒకరితో ఒకరు పోరాడి ... ఉండాలి
  rationale: חרב ధాతువు infinitive absoluteతో బలపరచబడింది. సందర్భంలో మోయాబీయులు మిత్రరాజులు పరస్పరం తలపడ్డారని ఊహిస్తున్నారు; ‘ఉండాలి’ వారి నిర్ధారణాత్మక ఊహను తెలుగులో సహజంగా తెలియజేస్తుంది. పదశః అర్థాన్ని పాదటిప్పణి కాపాడుతుంది.
- source_word: הַמְּלָכִים
  choice: ఆ రాజులు
  rationale: ఇంతకుముందు ప్రస్తావించిన సంకీర్ణ రాజులను సూచించే నిర్దిష్ట బహువచనం; తెలుగులో సందర్భానుసారంగా ‘ఆ’ సహజం.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: ఒకరినొకరు హతమార్చుకొని
  rationale: איש את־רעהו పరస్పర చర్యను సూచిస్తుంది; యుద్ధ సందర్భంలో נכה యొక్క ప్రాణాంతక భావాన్ని ‘హతమార్చుకొని’ స్పష్టంగా అందిస్తుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: గమనించిన దృశ్యం నుంచి ఉత్సాహభరితమైన పిలుపుకు మార్పును సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לַשָּׁלָל
  choice: దోపిడిసొమ్ము మీదికి
  rationale: ל యొక్క దిశార్థాన్ని, యుద్ధానంతర కొల్లగొట్టే సొమ్మువైపు దూసుకెళ్లమనే పిలుపును సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מוֹאָב
  choice: మోయాబూ
  rationale: జాతిపేరును సంబోధనగా వాడిన హెబ్రీ రూపాన్ని తెలుగు సంబోధన విభక్తితో నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణి ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘మోయాబూ’ యుద్ధకేకలోని ప్రత్యక్ష సంబోధనను, ఆశ్చర్యార్థక చిహ్నాలు దాని ఉత్సాహాన్ని నిలుపుతున్నాయి. ప్రధాన పాఠం సందర్భార్థాన్ని సహజంగా అందిస్తుండగా, חרב యొక్క నిజమైన పదార్థ అనిశ్చితిని [a]లో కాపాడింది.
