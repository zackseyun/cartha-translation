source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: te
  text: అయితే, ఇశ్రాయేలును పాపం చేయించిన[a] నెబాతు కుమారుడైన యెరోబాము పాపాలకు అతడు అంటిపెట్టుకున్నాడు; వాటి నుంచి వైదొలగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘ఇశ్రాయేలును పాపంలోకి నడిపించిన.’ హెబ్రీలోని కారణార్థక క్రియ యెరోబాము చర్యల వల్ల ఇశ్రాయేలు పాపం చేసిందని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: మునుపటి అనుకూల అంచనాకు పరిమితిని లేదా మినహాయింపును సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అయితే’ సహజంగా ఈ వ్యతిరేక మలుపును తెలియజేస్తుంది.
- source_word: בְּחַטֹּאות
  choice: పాపాలను
  rationale: דבק అనే క్రియతో వచ్చిన בְּను తెలుగులో సహజంగా కర్మరూపంతో వ్యక్తం చేసి, ఆ పాపాలకు గట్టిగా కట్టుబడి ఉండడాన్ని సూచిస్తుంది.
- source_word: חַטֹּאות
  choice: పాపాలను
  rationale: మూలంలోని నైతిక-మతపరమైన తీర్పును నిలుపుతుంది; ‘ఆచారాలు’ వంటి పదంతో దాని తీవ్రతను తగ్గించదు.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యెరోబాము
  rationale: వ్యక్తి పేరు, తండ్రి పేరుతో కూడిన హెబ్రీ గుర్తింపు సూత్రాన్ని సహజమైన తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: 'חטא హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది: యెరోబాము చర్యలు ఇశ్రాయేలును పాపంలోకి నడిపించాయి.'
- source_word: דָּבֵק
  choice: అంటిపెట్టుకున్నాడు
  rationale: గట్టిగా హత్తుకొని విడువకుండా కొనసాగడాన్ని సూచించే דבק భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא סָר מִמֶּנָּה
  choice: వాటి నుంచి వైదొలగలేదు
  rationale: ఒక ప్రవర్తనా మార్గాన్ని విడిచిపెట్టకపోవడాన్ని తెలిపే హెబ్రీ నుడికారాన్ని నిలుపుతుంది; ఏకవచన స్త్రీలింగ ప్రత్యయానికి భావార్థంగా ‘పాపాలు’నే పూర్వపదంగా తీసుకొని తెలుగులో బహువచనం వాడింది.
theological_decisions:
- issue: రాజు మతభ్రష్టతపై మూలపాఠంలోని తీర్పు
  choice: ‘పాపాలు,’ ‘పాపం చేయించిన’ అనే స్పష్టమైన నైతిక భాషను నిలుపడం
  alternative: ‘ఆచారాలు,’ ‘తప్పుదారి పట్టించాడు’ వంటి మృదువైన పదాలు వాడడం
  rationale: ఈ వాక్యం యెరోబాము నెలకొల్పిన విధానంపై ద్వితీయోపదేశకాండ సంబంధిత చరిత్రలో కనిపించే స్పష్టమైన దైవశాస్త్ర తీర్పును ఇస్తుంది; దాన్ని రాజకీయ లేదా ఆచార సంబంధిత భేదంగా మాత్రమే చూపకూడదు.
- issue: אֲשֶׁר הֶחֱטִיא అనే సంబంధ వాక్యంలోని అనుసంధానం
  choice: యెరోబామును క్రియాకర్తగా ఉంచి, అతడు ఇశ్రాయేలును పాపం చేయించాడని అనువదించడం
  alternative: ఆ పాపాలే ఇశ్రాయేలును పాపం చేయించాయని సాధనార్థకంగా అనువదించడం
  rationale: హెబ్రీ సంబంధ సర్వనామం రూపపరంగా రెండు అనుసంధానాలకు అవకాశం ఇచ్చినా, ఈ గ్రంథంలో పునరావృతమయ్యే సూత్రప్రయోగం యెరోబామునే కారణకర్తగా గుర్తిస్తుంది. తెలుగు రూపం అతని బాధ్యతను స్పష్టంగా ఉంచుతూ, పాపాలతో సంబంధాన్ని కొనసాగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజుల గ్రంథంలోని గంభీరమైన మూల్యాంకన శైలిని నిలుపుతూ అనువదించబడింది. ‘అంటిపెట్టుకున్నాడు’ సహజమైనదిగా ఉండి, నిరంతరమైన గట్టి అనుబంధాన్ని తెలియజేస్తుంది.
