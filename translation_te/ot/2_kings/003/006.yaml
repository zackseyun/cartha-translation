  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: te
  text: ఆ రోజు రాజైన యెహోరాము సమరయ నుండి బయలుదేరి ఇశ్రాయేలీయులందరినీ సమీకరించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులందరినీ లెక్కించాడు’ లేదా ‘ఇశ్రాయేలీయులందరినీ పరిశీలించాడు.’ హీబ్రూ క్రియ లెక్కించడం లేదా సైనిక సమీకరణను పరిశీలించడం అనే అర్థాలను సూచించగలదు; ఇక్కడి సందర్భంలో సైనిక సమీకరణ అర్థం అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: יצא అనే క్రియ ఇక్కడ ఒక స్థలం నుండి యుద్ధయాత్ర కోసం బయలుదేరడాన్ని సూచిస్తుంది. తరువాతి సైనిక చర్యను అనవసరంగా ముందే అధికంగా నిర్దిష్టం చేయకుండా ‘బయలుదేరి’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: యెహోరాము రాజు
  rationale: హీబ్రూ పదబంధంలోని బిరుదు, వ్యక్తినామం రెండింటినీ సహజమైన తెలుగు పదక్రమంలో ఉంచింది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: అక్షరార్థమైన ‘ఆ దినమున’కు ఆధునిక, సహజ తెలుగు రూపం; కథనంలోని నిర్దిష్ట సమయసూచనను నిలుపుతుంది.
- source_word: מִשֹּׁמְרוֹן
  choice: సమరయ నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది; ‘నుండి’ బయలుదేరిన ప్రదేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּפְקֹד
  choice: సైన్యంగా సమీకరించాడు
  rationale: פקדకు లెక్కించడం, పరిశీలించడం, సైనికులను సమీకరించడం వంటి భావాలు ఉన్నాయి. తరువాతి యుద్ధయాత్ర సందర్భంలో సైనిక సమీకరణ భావమే ప్రధానమైనది; అయితే మూలంలోని విస్తృతార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటినీ
  rationale: ఇది ఉత్తర రాజ్య ప్రజలను లేదా దాని సైనిక బలగాలను సమష్టిగా సూచిస్తుంది. ‘ఇశ్రాయేలంతటినీ’ హీబ్రూ సమష్టి వ్యక్తీకరణను సంక్షిప్తంగా నిలుపుతుంది.
