  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: te
  text: యెహోషాపాతు, “యాహ్వే వాక్కు అతని వద్ద ఉంది[a]” అన్నాడు. కాబట్టి ఇశ్రాయేలు రాజు, యెహోషాపాతు, ఎదోము రాజు అతని దగ్గరికి దిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నుండి అతనికి ఒక వాక్కు ఉంది.”
    reason: יֵשׁ אֹתוֹ דְּבַר יְהוָה అనే నిర్మాణం ‘వాక్కు అతని వద్ద ఉంది’ లేదా ‘అతనికి ఒక వాక్కు ఉంది’ అనే భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמר అనే సాధారణ కథన క్రియకు, ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేసే ఆధునిక తెలుగు రూపం.
- source_word: יֵשׁ אֹתוֹ
  choice: అతనితో ఉంది
  rationale: יֵשׁ + אֹתוֹ నిర్మాణం ఉనికిని లేదా స్వాధీనాన్ని సూచించగలదు. ‘అతనితో ఉంది’ అనేది ప్రవక్తకు యెహోవా వాక్కు అందుబాటులో ఉందనే భావాన్ని కాపాడుతూ, ‘అతనికి ఒక వాక్కు ఉంది’ అనే ప్రత్యామ్నాయ అర్థాన్నీ పాదసూచికలో నిలుపుతుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: ప్రవచన సందర్భంలోని స్థిరమైన బైబిలు ప్రయోగాన్ని, ‘సందేశం’ అని విపులీకరించకుండా కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: וַיֵּרְדוּ
  choice: దిగివెళ్లారు
  rationale: ירדలోని కిందికి కదలికను స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు కథన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: אֵלָיו
  choice: అతని దగ్గరికి
  rationale: ‘అతని వైపు/అతని వద్దకు’ అనే గమ్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ అధికార బిరుదును సూటిగా నిలుపుతుంది.
- source_word: וִיהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణ.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: ఎదోము రాజు
  rationale: హీబ్రూ సమన్వయ జాబితా నిర్మాణాన్ని సహజ తెలుగులో కొనసాగిస్తుంది.
theological_decisions:
- issue: ఎలీషాతో సంబంధించి דְּבַר יְהוָה అనే ప్రవచన సూత్రప్రయోగం
  choice: యెహోవా వాక్కు అతనితో ఉంది
  alternative: యెహోవా నుండి అతనికి ఒక వాక్కు ఉంది
  rationale: మూలంలోని ఉనికి/స్వాధీన నిర్మాణాన్ని ఒకే నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయకుండా, ఎలీషా ద్వారా నిజమైన దైవప్రకటన లభిస్తుందనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘వాక్కు’ అనే బైబిలు పదాన్ని ప్రవచన సూత్రప్రయోగం కోసం నిలిపి, కదలికను సూచించే ‘దిగివెళ్లారు’తో మూలంలోని దిశాభావాన్ని కాపాడింది.
