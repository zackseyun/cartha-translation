id: 2KI.3.8
reference: 2 Kings 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֵי זֶ֥ה הַ/דֶּ֖רֶךְ נַעֲלֶ֑ה וַ/יֹּ֕אמֶר דֶּ֖רֶךְ מִדְבַּ֥ר אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: te
  text: అతడు, “మనం ఏ దారిన వెళ్దాం?” అన్నాడు. అతడు, “ఎదోము అరణ్య మార్గం గుండా” అన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎదోము అరణ్యం గుండా వెళ్లే దారిలో.”
    reason: దֶּרֶךְ מִדְבַּר אֱדוֹם అనే పదబంధాన్ని ‘ఎదోము అరణ్య మార్గం’గా లేదా ‘ఎదోము అరణ్యం గుండా వెళ్లే దారి’గా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అడిగాడు / అతడు ... జవాబిచ్చాడు
  rationale: రెండు చోట్లా మూలంలో సాధారణంగా ‘అతడు అన్నాడు’ ఉన్నప్పటికీ, ప్రశ్న మరియు దానికి వచ్చిన జవాబు అనే సంభాషణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేయడానికి ‘అడిగాడు’, ‘జవాబిచ్చాడు’ వాడాం; ‘అప్పుడు’ కథన క్రమాన్ని సూచిస్తుంది.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: ఏ దారిన
  rationale: ఈ ప్రశ్నార్థక పదబంధం సందర్భంలో ‘ఏ దారి?’ అనే భావాన్ని ఇస్తుంది. ప్రయాణించే మార్గాన్ని తెలుగులో సహజంగా ‘ఏ దారిన’ అని అడుగుతారు.
- source_word: נַעֲלֶה
  choice: మనం ... వెళ్లాలి
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లడం’ అయినా, ఇక్కడ ప్రయాణం లేదా సైనిక దండయాత్ర సందర్భంలో ‘వెళ్లడం’ సహజం. హీబ్రూ అపూర్ణ క్రియలోని యోచనాత్మక భావాన్ని ‘వెళ్లాలి’ నిలుపుతుంది; సందర్భం స్పష్టపరచని సైనిక భావాన్ని అదనంగా చేర్చలేదు.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: ఎదోము అరణ్యమార్గంలో
  rationale: క్రియలేని హీబ్రూ జవాబు సూచించే మార్గాన్ని సహజ తెలుగులో సమాసరూపంగా ఇచ్చాం. מִדְבָּר కు ‘అరణ్యం’ అనేది జనావాసం తక్కువైన బంజరు ప్రాంత భావాన్ని ఇస్తుంది; ‘ఎడారి’ అనే మరింత నిర్దిష్ట భౌగోళిక భావాన్ని బలవంతంగా చేర్చదు.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
