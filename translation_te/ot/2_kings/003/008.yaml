translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రశ్నలోని ‘మనం’ సమావేషక బహువచనాన్ని స్పష్టంగా చూపుతుంది. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికతో సరిపోలుతుంది.
