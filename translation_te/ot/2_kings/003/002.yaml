- from: అతడు యెహోవా[a] దృష్టిలో చెడ్డదే చేశాడు; అయితే తన తండ్రి, తల్లి చేసినంతగా కాదు. తన తండ్రి చేయించిన బయలు స్తంభాన్ని[b] అతడు తొలగించాడు.
  to: అతడు యాహ్వే[a] దృష్టిలో చెడు చేశాడు; అయితే తన తండ్రిలా, తల్లిలా కాదు. తన తండ్రి చేసిన బయాలు స్తంభాన్ని[b] అతడు తొలగించాడు.
