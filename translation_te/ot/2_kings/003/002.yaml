id: 2KI.3.2
reference: 2 Kings 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֤ה הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֥א כְ/אָבִ֖י/ו וּ/כְ/אִמּ֑/וֹ וַ/יָּ֨סַר֙ אֶת מַצְּבַ֣ת הַ/בַּ֔עַל אֲשֶׁ֥ר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: te
  text: అతడు యాహ్వే[a] దృష్టిలో చెడు చేశాడు; అయితే తన తండ్రిలా, తల్లిలా కాదు. తన తండ్రి చేసిన బయాలు స్తంభాన్ని[b] అతడు తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో దేవుని వ్యక్తిగత నామం יהוה (YHWH) ఉంది; దీనిని ‘యాహ్వే’గా అనువదించాం.
    reason: దైవనామ రూపాంతరం గురించి పాఠకునికి తెలియజేయడం.
  - marker: b
    text: లేదా, ‘బయాలు ఆరాధనా స్తంభం,’ ‘బయాలు నిలువురాయి.’ హీబ్రూ పదం బయాలు ఆరాధనతో సంబంధమున్న నిలువబెట్టిన రాయి లేదా స్తంభాన్ని సూచిస్తుంది.
    reason: మూలంలోని מַצֵּבָה పదానికి ఉన్న శిలా-స్తంభ మరియు ఆరాధనా భావాలను తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: చెడ్డదే చేశాడు
  rationale: עשה + הרע అనే హీబ్రూ నుడికారం చెడు చేయడం లేదా దేవుని అంచనాలో చెడ్డదైనది చేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, మూలంలోని నైతిక తీర్పును నిలుపుతూ ఇలా అనువదించాం.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: అక్షరార్థంగా ‘యెహోవా కళ్లలో’; ఇది యెహోవా అంచనా ప్రకారం అనే హీబ్రూ నుడికారం. ‘దృష్టిలో’ రూపకం యొక్క భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం ఉంది. తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని వాడాం; దీనిపై పాఠక సహాయక పాదటిప్పణి ఇచ్చాం.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: అయితే తన తండ్రి, తల్లి చేసినంతగా కాదు
  rationale: רַק ఇక్కడ ముందటి తీర్పుకు పరిమితి లేదా మినహాయింపు జోడిస్తుంది. మూలంలోని సంక్షిప్త పోలికను తెలుగులో స్పష్టంగా చెప్పేందుకు ‘చేసినంతగా’ చేర్చాం; అతడు చెడు చేయలేదని కాక, తల్లిదండ్రుల స్థాయిలో చేయలేదనే భావం నిలిచింది.
- source_word: וַיָּסַר
  choice: అతడు తొలగించాడు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థం తొలగించడం లేదా తీసివేయడం. హీబ్రూలో ఉన్న కథన ‘మరియు’ను తెలుగు వాక్యప్రవాహంలో ప్రత్యేక వాక్యంగా సహజంగా వ్యక్తం చేశాం; వివరణాత్మక ‘ఎందుకంటే’ను మూలంలో స్పష్టంగా లేనందున చేర్చలేదు.
- source_word: מַצְּבַת הַבַּעַל
  choice: బయలు స్తంభం
  rationale: מַצֵּבָה అనేది నిలువబెట్టిన రాయి లేదా ఆరాధనకు సంబంధించిన స్తంభం. ‘బయలు స్తంభం’ సంక్షిప్తంగా మూలానికి దగ్గరగా ఉంటుంది; దాని ఆరాధనా స్వభావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: తన తండ్రి చేయించిన
  rationale: עָשָׂה యొక్క సాధారణ అర్థం ‘చేశాడు’; రాజు స్వయంగా చెక్కాడనే అనవసర భావం రాకుండా, అతని ఆదేశం లేదా ఆధ్వర్యంలో ఏర్పాటు చేయబడిందనే సహజ తెలుగు భావంతో ‘చేయించిన’ అని ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా రాయాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని నేరుగా వాడుతుంది. అందువల్ల ‘ప్రభువు’గా ప్రతిస్థాపించకుండా తెలుగులో సుపరిచితమైన నామరూపాన్ని ఉంచాం; ‘యాహ్వే’ అనే పునర్నిర్మిత ఉచ్చారణను పాదటిప్పణిలో సూచించాం.
- issue: రాజు చెడు తన తల్లిదండ్రుల చెడుతో పోల్చబడిన విధానం
  choice: తన తండ్రి, తల్లి చేసినంతగా కాదు
  alternative: తన తండ్రి, తల్లిలా కాదు
  rationale: మూలంలోని רַק ఒక అర్హత లేదా పరిమితిని సూచిస్తుంది. ఈ వాక్యం రాజును నిర్దోషిగా ప్రకటించదు; అతని చెడు తల్లిదండ్రుల నమూనా లేదా తీవ్రతతో సమానం కాదనే ఉద్వేగాన్ని నిలుపుతుంది.
- issue: స్తంభం తొలగింపు ముందటి అర్హతకు కారణమా లేక తదుపరి కథన చర్యమా
  choice: ప్రత్యేక తదుపరి వాక్యంగా అనువదించడం
  alternative: ‘ఎందుకంటే అతడు… తొలగించాడు’ అని కారణ సంబంధాన్ని స్పష్టం చేయడం
  rationale: హీబ్రూ వావ్ సాధారణ కథన అనుసంధానాన్ని ఇస్తుంది; కారణ సంబంధం సందర్భం ద్వారా ఊహించవచ్చు గాని వ్యాకరణంలో తప్పనిసరిగా స్పష్టం కాదు. అందువల్ల ఆ సంబంధాన్ని అనువాదంలో నిర్ణయాత్మకంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘దృష్టిలో,’ ‘తొలగించాడు’ వంటి సుపరిచిత పదాలను వాడాం. మూలంలోని తీర్పు-అర్హత మధ్య ఉన్న ఉద్వేగాన్ని కాపాడి, కారణ సంబంధాన్ని అనవసరంగా బలపరచలేదు.
