id: 2KI.3.10
reference: 2 Kings 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు, “అయ్యో! యాహ్వే ఈ ముగ్గురు రాజులను మోయాబు చేతికి[b] అప్పగించడానికి పిలిచాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాహ్వానించాడు”; హీబ్రూ క్రియకు అక్షరార్థంగా “పిలిచాడు” అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: “మోయాబు చేతికి అప్పగించడం” అంటే మోయాబు అధికారానికి లోబడేలా చేయడం అనే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది; ఈ వచనంలో రాజు పేరు చెప్పబడనందున బిరుదునే ఉంచాం.
- source_word: אֲהָהּ
  choice: అయ్యో!
  rationale: దుఃఖం, భయం, నిరాశలను వ్యక్తపరిచే ఈ ఆశ్చర్యోద్గారానికి ‘అయ్యో!’ సహజమైన, గంభీరమైన తెలుగు సమానం.
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ అది రాజు పలికిన ఆందోళనకు కారణం లేదా నిశ్చయాన్ని పరిచయం చేస్తుంది. ‘అయ్యో!’ తరువాత ప్రత్యేక సంధాయకాన్ని చేర్చకుండా తదుపరి వాక్యమే ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קָרָא
  choice: పిలిచాడు
  rationale: మూల క్రియ యొక్క సాధారణ అర్థమైన ‘పిలుచు’ను నిలుపుతుంది; ‘సమకూర్చాడు’ వంటి సందర్భ విస్తరణను పాఠ్యంలోకి దిగుమతి చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ఈ ముగ్గురు రాజులను
  rationale: సంఖ్య, నామవాచకం, సూచనార్థక పదం కలిసి ఇప్పటికే ప్రస్తావనలో ఉన్న నిర్దిష్ట ముగ్గురు రాజులను సూచిస్తున్నాయి.
- source_word: לָתֵת אוֹתָם בְּיַד מוֹאָב
  choice: మోయాబు చేతికి అప్పగించడానికి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అనే హీబ్రూ అధికార-అధీనత నుడికారాన్ని సహజమైన తెలుగులో ‘చేతికి అప్పగించడం’గా తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: קָרָא అనే క్రియ దైవిక సమాహ్వానాన్నా లేక పరిస్థితులను కలిపి తేవడాన్నా సూచిస్తుంది
  choice: పిలిచాడు
  alternative: రప్పించాడు; ఒకచోట చేర్చాడు
  rationale: మూల క్రియలోని ‘పిలిచాడు’ అనే భావాన్ని నిలిపి, రాజు పరిస్థితిని ఎలా అర్థం చేసుకున్నాడో దానికంటే ఎక్కువ దైవిక ఉద్దేశాన్ని అనువాదంలో చేర్చలేదు.
- issue: రాజు చెప్పిన మాట దైవ ఉద్దేశంపై నమ్మదగిన ప్రకటనగా తీసుకోవాలా
  choice: రాజు భయంతో చేసిన వ్యాఖ్యగానే అనువదించాం
  alternative: కథకుని నిర్ధారణగా విస్తరించడం
  rationale: వాక్యాన్ని పలికేది ఇశ్రాయేలు రాజు. అనువాదం అతని నిరాశాపూరిత అంచనాను అలాగే ఉంచుతుంది; అది కథకుని లేదా దేవుని స్వీయప్రకటన అని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథనశైలిని వాడాం. ‘అయ్యో!’ భావోద్వేగ తీవ్రతను సహజంగా నిలుపుతుంది. ‘మోయాబు చేతికి అప్పగించడం’ మూల నుడికారంలోని ‘చేయి’ రూపకాన్ని కాపాడుతూ తెలుగులో సులభంగా అర్థమవుతుంది.
