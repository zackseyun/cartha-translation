  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘ఈ వాగులో గుంటలు గుంటలుగా చేయండి[a][b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వాగు” అని అనువదించిన హీబ్రూ పదం కాలానుగుణంగా నీరు పారే జలమార్గం, ఎండిన వాగుపడక, లేదా లోయను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో “గుంటలు” అనే పదం రెండుసార్లు వచ్చింది—అక్షరార్థంగా, “ఈ వాగును గుంటలు, గుంటలుగా చేయండి”; భావం: దానిలో అనేక గుంటలు, లేదా అంతటా గుంటలు చేయండి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది; కాలసూక్ష్మతను అతిగా నిర్ధారించదు.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవసందేశ సూత్రాన్ని గౌరవప్రదంగా, సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: עָשֹׂה
  choice: చేయండి
  rationale: עשה అనే విస్తృతార్థక ఆజ్ఞారూపానికి నేరమైన సమానార్థకం; ‘తవ్వండి’ అని సందర్భార్థాన్ని పాఠ్యంలోనే అతిగా నిర్దిష్టం చేయదు.
- source_word: הַנַּחַל הַזֶּה
  choice: ఈ వాగు నేలంతటా
  rationale: נחל ఇక్కడ కాలానుగుణంగా నీరు పారే వాగు లేదా దాని పాతను సూచిస్తుంది. ‘నేలంతటా’ అనేది పునరుక్త బహువచనంలోని విస్తరణ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גֵּבִים גֵּבִים
  choice: గుంటలు గుంటలుగా
  rationale: మూలంలోని పదపునరుక్తిని నిలుపుతూ అనేక గుంటలు లేదా అంతటా గుంటలు చేయాలనే విస్తరణాత్మక బలాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది. తెలుగు పాఠకులకు ‘యెహోవా’ విస్తృతంగా పరిచితమైన రూపం; ఉచ్చారణ పునర్నిర్మాణాన్ని ‘యాహ్వే’ రూపంలో కూడా సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన సూత్రానికి గౌరవప్రదమైన శైలి, ఆజ్ఞకు సహజ బహువచన గౌరవ/సమూహ రూపం. మూలంలోని ‘గుంటలు గుంటలు’ పునరుక్తిని నిలిపి, నחל యొక్క భౌగోళిక భావాన్ని పాదటిప్పణిలో విప్పిచెప్పింది.
