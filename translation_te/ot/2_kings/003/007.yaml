translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. సంభాషణ సాధారణ పాఠకులకు సహజంగా ఉండేలా ఉంచబడింది; రాజకీయ తిరుగుబాటు మరియు సైనిక ప్రయాణానికి సంబంధించిన మూలభాషా సూక్ష్మతలు పాదసూచికల్లో నిలుపబడ్డాయి. ఆంగ్ల సంప్రదింపుల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, [a]ను ‘తిరుగుబాటు చేశాడు’ తరువాత, [b]ను ‘నేను వెళ్తాను’ తరువాత ఉంచాం.
