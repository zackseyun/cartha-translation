  to: 'అప్పుడు అతడు వెళ్లి యూదా రాజైన యెహోషాపాతుకు ఇలా కబురు పంపాడు: “మోయాబు రాజు నాపై తిరుగుబాటు చేశాడు.[a] మోయాబుకు వ్యతిరేకంగా యుద్ధం చేయడానికి నాతో వెళ్తావా?” అందుకు అతడు, “నేను వెళ్తాను.[b] నీవెలాగో నేనూ అలాగే; నా ప్రజలు నీ ప్రజలవలె, నా గుర్రాలు నీ గుర్రాలవలె” అని జవాబిచ్చాడు.'
  rationale: 'The revision disambiguates the military action as directed against Moab and restores the Hebrew''s comparative possessive parallelism in the solidarity pledge. Footnote placement and content remain appropriate: [a] follows the rebellion verb, and [b] follows the idiomatic rendering of “I will go up.”'
