  text: וַ/יֵּ֡לֶךְ וַ/יִּשְׁלַח֩ אֶל יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֜ה לֵ/אמֹ֗ר מֶ֤לֶךְ מוֹאָב֙ פָּשַׁ֣ע בִּ֔/י הֲ/תֵלֵ֥ךְ אִתִּ֛/י אֶל מוֹאָ֖ב לַ/מִּלְחָמָ֑ה וַ/יֹּ֣אמֶר אֶעֱלֶ֔ה כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: te
  text: 'అప్పుడు అతడు వెళ్లి యూదా రాజైన యెహోషాపాతుకు ఇలా కబురు పంపాడు: “మోయాబు రాజు నాపై తిరుగుబాటు చేశాడు.[a] మోయాబుకు వ్యతిరేకంగా యుద్ధం చేయడానికి నాతో వెళ్తావా?” అందుకు అతడు, “నేను వెళ్తాను.[b] నీవెలాగో నేనూ అలాగే; నా ప్రజలు నీ ప్రజలవలె, నా గుర్రాలు నీ గుర్రాలవలె” అని జవాబిచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అధీనతను విడిచిపోయాడు.” ఇక్కడి హీబ్రూ క్రియ రాజకీయ తిరుగుబాటును లేదా విధేయతను తెంచుకోవడాన్ని సూచించగలదు; ఈ సందర్భంలో మోయాబు ఇశ్రాయేలు పాలనకు వ్యతిరేకంగా తిరుగుబాటు చేయడమే ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “నేను పైకి వెళ్తాను.” ఈ క్రియ తరచుగా యుద్ధానికి బయలుదేరడాన్ని లేదా ఎత్తైన ప్రాంతం వైపు వెళ్లడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు అతడు వెళ్లి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు క్రమాన్ని చూపుతుండగా, ‘వెళ్లి’ మూలంలోని ప్రత్యేక క్రియను నిలుపుతుంది.
- source_word: וַיִּשְׁלַח אֶל
  choice: కబురు పంపాడు
  rationale: తరువాత ప్రత్యక్ష సందేశం ఉన్నందున, ఇది ఒక వస్తువును పంపడం కంటే సందేశం పంపడాన్ని సూచిస్తుంది.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు
  rationale: వ్యక్తి పేరు ప్రామాణిక తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించబడింది; రాజపదవి సహజమైన తెలుగు నిర్మాణంలో ఇవ్వబడింది.
- source_word: פָּשַׁע בִּי
  choice: నాపై తిరుగుబాటు చేశాడు
  rationale: ఈ రాజకీయ సందర్భంలో פשע అధీనతను విడిచి రాజాధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడాన్ని సూచిస్తుంది.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: నాతో వస్తావా?
  rationale: మాట్లాడుతున్నవానితో కలిసి సైనిక యాత్రలో చేరమనే ఆహ్వానాన్ని సహజమైన తెలుగులో ‘వస్తావా’ వ్యక్తం చేస్తుంది; మూలంలోని הלך సాధారణంగా ‘వెళ్లు’ అని అర్థమవుతుంది.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: మోయాబుతో యుద్ధం చేయడానికి
  rationale: మోయాబుపై దిశగా జరిగే సైనిక చర్య అనే భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶעֱלֶה
  choice: నేను వెళ్తాను
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లు’ అయినా, ఇక్కడ సైనిక యాత్రలో చేరడాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో సహజమైన రూపం ఉంచి అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: నీవెలాగో నేనూ అలాగే
  rationale: మూలంలోని సంక్షిప్తమైన సమానత్వం మరియు సంఘీభావ ప్రకటనను అదనపు వ్యాఖ్యానం లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: నీ ప్రజలే నా ప్రజలు, నీ గుర్రాలే నా గుర్రాలు
  rationale: మూలంలోని సమాంతర, సంక్షిప్త ప్రతిజ్ఞను తెలుగు వాక్యక్రమంలో సహజంగా, బలంగా నిలుపుతుంది.
