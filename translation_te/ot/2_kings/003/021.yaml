source:
  edition: WLC
  text: וְ/כָל מוֹאָב֙ שָֽׁמְע֔וּ כִּֽי עָל֥וּ הַ/מְּלָכִ֖ים לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִּצָּעֲק֗וּ מִ/כֹּ֨ל חֹגֵ֤ר חֲגֹרָה֙ וָ/מַ֔עְלָ/ה וַ/יַּעַמְד֖וּ עַֽל הַ/גְּבֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: te
  text: మోయాబీయులందరూ రాజులు తమతో యుద్ధం చేయడానికి వచ్చారని విన్నారు. అప్పుడు నడికట్టు కట్టుకొనే వయస్సు వచ్చినవారి నుండి పై వయసువారివరకు అందరినీ[a] సమీకరించారు[b]. వారు సరిహద్దు వద్ద నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “నడికట్టు కట్టుకొనేవాని నుండి పైవారివరకు.” ఇది యుద్ధానికి తగిన వయస్సు వచ్చినవారు మొదలుకొని అంతకంటే పెద్దవారిని సూచించే నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “వారిని పిలిపించారు.” ఇక్కడి హీబ్రూ క్రియ కేవలం కేక వేయడాన్ని కాక, ప్రజలను సమీకరించడాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: మోయాబీయులందరూ
  rationale: మోయాబు అనే సమష్టివాచక దేశనామం ఇక్కడ ఆ ప్రజలందరినీ సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ప్రజలను స్పష్టంగా వ్యక్తం చేసింది.
- source_word: שָׁמְעוּ
  choice: విన్నారు
  rationale: శמע క్రియ యొక్క సాధారణ అర్థమైన ‘విన్నారు’ను నేరుగా నిలిపింది.
- source_word: כִּי עָלוּ הַמְּלָכִים לְהִלָּחֶם בָּם
  choice: తమతో యుద్ధం చేయడానికి రాజులు వచ్చారని
  rationale: עלה యొక్క దిశాసూచక భావాన్ని ‘వచ్చారు’గా, להלחם בםను ‘తమతో యుద్ధం చేయడానికి’గా సహజంగా అందించింది.
- source_word: וַיִּצָּעֲקוּ
  choice: సమీకరించారు
  rationale: సందర్భంలో ఇది కేవలం కేక వేయడాన్ని కాక, దండయాత్రకు ప్రతిస్పందనగా ప్రజలను సమీకరించడాన్ని సూచిస్తుంది; కర్తను నిర్దిష్టంగా చెప్పని తెలుగు రూపం హీబ్రూ భావానికి సరిపోతుంది.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: నడికట్టు కట్టుకోగల వయసున్నవారు మొదలుకొని అంతకంటే పెద్దవారందరినీ
  rationale: ‘నడికట్టు కట్టేవాడు మొదలుకొని పైవారివరకు’ అనే హీబ్రూ నుడికారంలోని స్పష్టమైన దృశ్యాన్ని, సైనిక వయస్సు నుంచి పైబడినవారనే భావంతో కలిపి నిలిపింది.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: వారు సరిహద్దు దగ్గర నిలబడ్డారు
  rationale: עמד על הגבולను అతిగా సైనికీకరించకుండా నేరుగా, సహజంగా అనువదించింది.
