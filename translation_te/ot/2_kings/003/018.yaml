source:
  edition: WLC
  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: te
  text: ఇది యాహ్వే[a] దృష్టిలో చిన్న విషయమే; ఆయన మోయాబును కూడా మీ చేతికి అప్పగిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది యాహ్వే దృష్టిలో సులభమైనదే.”
    reason: నָקַל అనే పదానికి ‘చిన్నది/అల్పమైనది’తో పాటు ‘సులభమైనది’ అనే భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: וְנָקַל זֹאת
  choice: ఇది ... చిన్న విషయమే
  rationale: נָקַל ఇక్కడ తేలికైనది, అల్పమైనది, సులభమైనది అనే మూలభావాన్ని వ్యక్తపరుస్తుంది. సందర్భంలో ముందుగా చెప్పిన నీటి అనుగ్రహం యెహోవాకు చిన్న విషయమని తెలిపే సహజమైన తెలుగు ప్రయోగం ఇది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అనే హీబ్రూ మూలరూపకం మూల్యాంకనాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దృష్టిలో’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: ఇది దైవనామమైన చతురక్షర నామం. తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించబడింది; బిరుదుతో భర్తీ చేయలేదు.
- source_word: וְנָתַן
  choice: ఆయన ... కూడా ... అప్పగిస్తాడు
  rationale: ప్రవచన సందర్భంలో ఈ రూపానికి భవిష్యదర్థం ఉంది. ‘కూడా’ ముందుగా చెప్పిన నీటి అనుగ్రహానికి అదనంగా మోయాబుపై విజయాన్ని సూచిస్తుంది.
- source_word: אֶת מוֹאָב
  choice: మోయాబును
  rationale: మూలంలో దేశం లేదా ప్రజాసమూహాన్ని సమష్టిగా సూచించే ‘మోయాబు’ ప్రత్యక్ష కర్మగా ఉంది; దానిని అలాగే ఉంచాం.
- source_word: בְּיֶדְכֶם
  choice: మీ చేతికి
  rationale: ‘చేతిలోకి ఇవ్వడం’ అంటే అధికారానికి లేదా వశానికి అప్పగించడం అనే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యే సమీప రూపంలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాక వ్యక్తిగత దైవనామం ఉంది. తెలుగు బైబిలు వాడుకలో స్థిరంగా గుర్తించబడే ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ అనేది సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: נָקַל యొక్క మూల్యాంకన భావం
  choice: చిన్న విషయమే
  alternative: సులభమైనదే
  rationale: ఈ పదం ‘అల్పమైనది’ మరియు ‘సులభమైనది’ అనే రెండింటికీ చోటిస్తుంది. ప్రధాన పాఠంలో సందర్భానుగుణమైన ‘చిన్న విషయమే’ను ఉంచి, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దృష్టిలో’ మరియు ‘మీ చేతికి అప్పగిస్తాడు’ అనే ప్రయోగాలు మూల హీబ్రూ నుడికారాలను అర్థవంతంగా నిలుపుతాయి.
