  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: te
  text: అప్పుడు అతడు తనకు బదులుగా రాజ్యమేలవలసిన, మొదట పుట్టిన తన కుమారుణ్ణి తీసుకొని ప్రాకారం మీద దహనబలిగా అర్పించాడు. అప్పుడు ఇశ్రాయేలుకు వ్యతిరేకంగా తీవ్రమైన ఆగ్రహం కలిగింది[a]. దాంతో వారు అతనిని విడిచి వెనుదిరిగి తమ దేశానికి తిరిగి వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలుకు వ్యతిరేకంగా తీవ్రమైన ఉగ్రకోపం.’ ఈ ఆగ్రహం ఎవరిదో హీబ్రూ పాఠం చెప్పదు. ఇది దేవుని ఆగ్రహమా, మోయాబీయుల ఉగ్రకోపమా, లేక ఈ బలి వల్ల ఇశ్రాయేలీయులకు కలిగిన కలవరమా అనే విషయంలో వ్యాఖ్యానాలు భిన్నంగా ఉన్నాయి.
    reason: మూలపాఠంలోని ముఖ్యమైన అస్పష్టతను పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: మొదట పుట్టిన తన కుమారుణ్ణి
  rationale: בְּכוֹר కేవలం వయస్సులో పెద్దవాడని కాక, మొదట పుట్టినవాడని సూచిస్తుంది. ఈ రూపం కుటుంబ సంబంధాన్ని, వారసత్వ ప్రాముఖ్యతను స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: తనకు బదులుగా రాజ్యమేలవలసిన
  rationale: ఈ కుమారుడు నియమిత రాజవారసుడని వాక్యభాగం తెలియజేస్తుంది. ‘తనకు బదులుగా’ అనేది תַּחְתָּיו లోని స్థానాన్ని చేపట్టే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: దహనబలిగా అర్పించాడు
  rationale: ఇది బలికి సంబంధించిన స్పష్టమైన పదప్రయోగం. జరిగిన కార్యంలోని భయానకతను మృదువుపరచకుండా, עֹלָה యొక్క సంపూర్ణ దహనబలి భావాన్ని తెలియజేస్తుంది.
- source_word: עַל הַחֹמָה
  choice: ప్రాకారం మీద
  rationale: సందర్భంలో הַחֹמָה పట్టణ ప్రాకారాన్ని సూచిస్తుంది. మూలంలో లేని ‘పట్టణ’ అనే పదాన్ని చేర్చకుండా ‘ప్రాకారం’ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: קֶצֶף גָּדוֹל
  choice: తీవ్రమైన ఆగ్రహం
  rationale: קֶצֶף ఆగ్రహం లేదా ఉగ్రకోపాన్ని సూచిస్తుంది. ‘తీవ్రమైన’ అనే మాట గָּדוֹל యొక్క బలాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఆ ఆగ్రహం ఎవరిదో మాత్రం నిర్దేశించదు.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు వ్యతిరేకంగా
  rationale: కֶצֶף తో వచ్చిన עַל, ఆగ్రహం ఇశ్రాయేలును లక్ష్యంగా చేసుకున్నదని సూచిస్తుంది. ‘వ్యతిరేకంగా’ ఈ దిశను స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: వారు అతని దగ్గర నుంచి వెనుదిరిగి
  rationale: נסע శిబిరాన్ని ఎత్తి బయలుదేరడం అనే భావాన్ని కలిగి ఉంది. ఈ యుద్ధ సందర్భంలో మోయాబు రాజుపై దాడిని విడిచి వెనక్కి వెళ్లడాన్ని ఈ అనువాదం సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: తమ దేశానికి తిరిగి వెళ్లిపోయారు
  rationale: కూటమి సైన్యాలు తమ స్వదేశానికి తిరిగినట్లు సందర్భం సూచిస్తుంది. తెలుగులో సహజత కోసం సందర్భంలో అంతర్లీనంగా ఉన్న స్వాధీన భావాన్ని ‘తమ’తో వ్యక్తం చేసింది.
theological_decisions:
- issue: ‘ఇశ్రాయేలుకు వ్యతిరేకంగా తీవ్రమైన ఆగ్రహం’ ఎవరిది?
  choice: ఆగ్రహానికి మూలం ఎవరో పేర్కొనకుండా మూలపాఠంలోని అస్పష్టతను నిలుపడం
  alternative: దేవుని ఆగ్రహం; మోయాబీయుల ఉగ్రకోపం; బలి కారణంగా ఇశ్రాయేలీయుల్లో కలిగిన కలవరం లేదా ధైర్యహీనత
  rationale: హీబ్రూ పాఠం ఆ ఆగ్రహం ఎవరిదో స్పష్టంగా చెప్పదు. ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చడం మూలంలోని ఉద్దేశపూర్వకమైన లేదా వాస్తవమైన సందిగ్ధతను తొలగిస్తుంది. అందువల్ల ప్రధాన పాఠం దానిని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించింది. ‘ప్రాకారం,’ ‘దహనబలి,’ ‘రాజ్యమేలడం’ వంటి పదాలు సందర్భానికి తగిన బైబిలు గౌరవభావాన్ని నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత ‘ఆగ్రహం’ వాక్యభాగం వెంట ఉంచబడింది.
