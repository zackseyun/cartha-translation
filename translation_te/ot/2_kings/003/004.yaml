  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలంలో లేని కాలసూచక లేదా సంభాషణాత్మక ఉపోద్ఘాతం చేర్చలేదు. కప్పం క్రమంగా చెల్లించే భావాన్ని ‘చెల్లిస్తూ ఉండేవాడు’ ద్వారా తెలిపాం.
