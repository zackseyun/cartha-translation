  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵישַׁ֥ע מֶֽלֶךְ מוֹאָ֖ב הָיָ֣ה נֹקֵ֑ד וְ/הֵשִׁ֤יב לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ מֵאָה אֶ֣לֶף כָּרִ֔ים וּ/מֵ֥אָה אֶ֖לֶף אֵילִ֥ים צָֽמֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: te
  text: మోయాబు రాజైన మేషా గొర్రెల పెంపకందారుడు. అతడు ఇశ్రాయేలు రాజుకు కప్పంగా లక్ష గొర్రెపిల్లలను, లక్ష పొట్టేళ్ల ఉన్నిని[a] చెల్లిస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “లక్ష పొట్టేళ్లు, ఉన్ని” అని ఉంది. ఇది సంక్షిప్తమైన పదబంధం; “ఉన్నితో కూడిన లక్ష పొట్టేళ్లు” అని గానీ, సందర్భంలో మరింత సంభావ్యంగా “లక్ష పొట్టేళ్ల ఉన్ని” అని గానీ అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: గొర్రెల పెంపకందారుడు
  rationale: గొర్రెలను పెంచే వృత్తిలో ఉన్న వ్యక్తిని సూచించే ఈ పదానికి ఆధునిక తెలుగు పాఠకులకు సహజంగా, స్పష్టంగా అర్థమయ్యే రూపం.
- source_word: וְהֵשִׁיב
  choice: కప్పంగా … చెల్లిస్తూ ఉండేవాడు
  rationale: ఇక్కడ హిఫీల్ రూపం రాజుకు క్రమంగా కప్పం చెల్లించడాన్ని సూచిస్తుంది; ‘చెల్లిస్తూ ఉండేవాడు’ ఆ అలవాటైన లేదా పునరావృత చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: లక్ష గొర్రెపిల్లలను
  rationale: כָּרִים చిన్న గొర్రెలను లేదా యువ మగ గొర్రెలను సూచించగలదు; కప్పపు జాబితాలో ‘గొర్రెపిల్లలు’ సహజమైన, విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: מֵאָה אֶלֶף אֵילִים צָמֶר
  choice: లక్ష పొట్టేళ్ల ఉన్నిని
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా ‘లక్ష పొట్టేళ్లు, ఉన్ని’ అని ఉంది. సందర్భంలో జంతువులతో పాటు పొట్టేళ్ల నుండి లభించిన ఉన్ని కప్పంగా ఇచ్చిన భావం ఎక్కువ సంభావ్యమైనది; అసలు నిర్మాణంలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: మోయాబు రాజు / ఇశ్రాయేలు రాజు
  rationale: సంబంధార్థక హీబ్రూ నిర్మాణాలకు సహజమైన తెలుగు రూపాలు; స్థలనామాలు ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇవ్వబడ్డాయి.
