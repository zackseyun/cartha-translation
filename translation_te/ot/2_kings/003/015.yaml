  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: te
  text: అయితే ఇప్పుడు, నా కోసం ఒక వాద్యకారుణ్ణి తీసుకురండి.[a] ఆ వాద్యకారుడు వాయిస్తుండగా, యాహ్వే హస్తం[b] అతని మీదికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, వాద్యం వాయించే వ్యక్తి. హెబ్రీ పదం ఏ వాద్యాన్ని వాయిస్తాడో పేర్కొనదు.
    reason: lexical_alternative
  - marker: b
    text: ‘యాహ్వే హస్తం’ అనేది దైవిక శక్తిని లేదా ప్రవచన ప్రభావాన్ని సూచించగల హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: మునుపటి మాటల నుంచి తక్షణమైన మలుపును సూచిస్తుంది. ‘అయితే ఇప్పుడు’ సందర్భంలోని వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קְחוּ לִי
  choice: నా కోసం ... తీసుకురండి
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన దత్తివాచక సర్వనామం, మాట్లాడుతున్న వ్యక్తి కోసం ఎవరినైనా రప్పించమనే భావాన్ని ఇక్కడ ఇస్తుంది.
- source_word: מְנַגֵּן
  choice: వాద్యకారుడు
  rationale: נגן ధాతువు నుంచి వచ్చిన ఈ కృదంతం వాద్యం వాయించే వ్యక్తిని సూచిస్తుంది; ఏ వాద్యమో మూలపాఠం పేర్కొనదు.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: ఆ వాద్యకారుడు వాయిస్తుండగా
  rationale: తర్వాతి సంఘటన జరిగిన కాలసందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది; హెబ్రీ కథన సూత్రాన్ని అనవసరంగా పదేపదే అనుకరించదు.
- source_word: יַד יְהוָה
  choice: యాహ్వే హస్తం
  rationale: దైవిక శక్తి లేదా ప్రవచన ప్రభావాన్ని సూచించగల హెబ్రీ నుడికారంలోని దృశ్యరూపాన్ని నిలుపుతుంది; దాని భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: וַתְּהִי עָלָיו
  choice: అతని మీదికి వచ్చింది
  rationale: దైవిక ప్రభావం ఆ సమయంలో కలిగిన సంఘటనాత్మక భావాన్ని తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: יַד יְהוָה అనే నుడికారాన్ని ఎలా చూపాలి
  choice: యాహ్వే హస్తం అతని మీదికి వచ్చింది
  alternative: యాహ్వే శక్తి అతని మీదికి వచ్చింది
  rationale: ఇది ప్రవచన ప్రేరణను లేదా దైవిక శక్తిని సూచించవచ్చు. అయినా మూలంలోని ‘హస్తం’ అనే రూపకాన్ని నిలుపడం ద్వారా భావాన్ని ఒక్క వివరణకే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వాద్యకారుడు’ ద్వారా మూలంలోని వాద్య-సంబంధిత అర్థాన్ని, ‘యాహ్వే హస్తం’ ద్వారా హెబ్రీ రూపకాన్ని నిలిపాం.
