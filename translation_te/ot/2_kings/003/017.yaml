id: 2KI.3.17
reference: 2 Kings 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: te
  text: 'ఎందుకంటే యాహ్వే ఇలా అంటున్నాడు: “మీరు గాలిని చూడరు, వానను కూడా చూడరు. అయినా ఆ వాగు[a] నీళ్లతో నిండిపోతుంది. అప్పుడు మీరు, మీ పశుసంపద, మీ జంతువులు నీళ్లు తాగుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ లోయ” లేదా “ఆ ఎండిన వాగు.” హెబ్రీ పదం נחל సాధారణంగా వర్షకాలంలో మాత్రమే నీరు పారే వాగును లేదా దాని ప్రవాహపాత్రను సూచించవచ్చు.
    reason: נחל అనే భౌగోళిక పదానికి ఉన్న అర్థ పరిధిని తెలియజేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: כִּי כֹה אָמַר
  choice: ఎందుకంటే ... ఇలా అంటున్నాడు
  rationale: כִּי యొక్క వివరణాత్మక సంబంధాన్నీ, ప్రవచన ప్రకటన సూత్రాన్నీ సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: לֹא תִרְאוּ רוּחַ
  choice: మీరు గాలిని చూడరు
  rationale: వర్షంతో ఉన్న వాతావరణ సందర్భంలో רוּחַ అంటే ‘గాలి’; హెబ్రీ వాక్యంలోని ‘చూడరు’ అనే స్పష్టమైన రూపాన్ని నిలిపాం.
- source_word: גֶשֶׁם
  choice: వాన
  rationale: వాతావరణ సందర్భంలో సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: הַנַּחַל הַהוּא
  choice: ఆ వాగు
  rationale: נחל ఇక్కడ సాధారణంగా కాలానుగుణంగా నీరు పారే వాగు లేదా ఎండిన ప్రవాహపాత్రను సూచిస్తుంది; ‘వాగు’ తెలుగు పాఠకులకు సహజంగా, సంక్షిప్తంగా ఉంటుంది. అర్థ పరిధిని పాదసూచికలో ఇచ్చాం.
- source_word: יִמָּלֵא מָיִם
  choice: నీళ్లతో నిండిపోతుంది
  rationale: నిఫల్ రూపంలోని ఫలితార్థాన్ని సహజమైన తెలుగు క్రియతో వ్యక్తం చేశాం.
- source_word: וּשְׁתִיתֶם
  choice: నీళ్లు తాగుతారు
  rationale: వాగు నిండిన తరువాత జరిగే వాగ్దాన ఫలితాన్ని భవిష్యదర్థంలో స్పష్టంగా తెలిపాం.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: మీ పశువులు, మీ జంతువులు
  rationale: సొంత మందలు/పశుసంపదను సూచించే మొదటి పదానికీ, మరింత సాధారణమైన జంతువులను సూచించే రెండవ పదానికీ మధ్య ఉన్న హెబ్రీ భేదాన్ని పూర్తిగా కలిపివేయకుండా నిలిపాం.
theological_decisions:
- issue: YHWH అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ప్రాచుర్యంలో ఉన్న పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: నీరు వచ్చే విధానాన్ని స్పష్టీకరించాలా
  choice: కారణాన్ని జోడించకుండా ‘అయినా ఆ వాగు నీళ్లతో నిండిపోతుంది’
  alternative: దేవుడు ఆ వాగును నీళ్లతో నింపుతాడు
  rationale: వాక్యం దైవ ప్రకటనలో ఉన్నప్పటికీ, హెబ్రీ వ్యాకరణం వాగు నిండిపోతుందని మాత్రమే చెబుతుంది; నీరు ఎలా వస్తుందో అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వచనం. ప్రత్యక్ష దైవ ప్రకటనకు ఉద్ధరణ చిహ్నాలు వాడాం. మూలంలోని రెండు జంతు వర్గాల పదాలను పూర్తిగా ఒకటిగా చేయకుండా ఉంచాం; ‘వాగు’కు సంబంధించిన నిజమైన భౌగోళిక అస్పష్టతను పాదసూచికలో నిలిపాం.
