source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר כֹּֽה יַעֲשֶׂה לִּ֥/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף אִֽם יַעֲמֹ֞ד רֹ֣אשׁ אֱלִישָׁ֧ע בֶּן שָׁפָ֛ט עָלָ֖י/ו הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “దేవుడు నాకు ఇలాగే చేయుగాక, అంతకంటే ఎక్కువగా చేయుగాక—ఈ రోజు షాఫాతు కుమారుడైన ఎలీషా తల అతని శరీరంపైనే ఉండి ఉంటే[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “షాఫాతు కుమారుడైన ఎలీషా తల ఈ రోజు అతని మీద నిలిచి ఉంటే.” ఇక్కడ “అతని మీద” అనేది ఎలీషాను సూచిస్తూ, అతని తల ఇంకా అతని శరీరంపైనే ఉందనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: దేవుడు నాకు ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువే చేయుగాక
  rationale: ఇది స్వయంపై శాపాన్ని ఆహ్వానించే స్థిరమైన హెబ్రీ ప్రమాణ సూత్రం. తెలుగు రూపం దాని ప్రమాణ బలాన్నీ, ఉద్దేశపూర్వకంగా చెప్పకుండా విడిచిన శిక్ష భావాన్నీ నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనమైనా, ఇక్కడ ప్రమాణ సూత్రంలో ఏకవచన దేవునినే సూచిస్తుంది.
- source_word: אִם
  choice: ఉంటే
  rationale: ప్రమాణ సందర్భంలో ఇది అంతర్లీనంగా ‘ఉండనివ్వను’ అనే ప్రతికూల నిశ్చయాన్ని వ్యక్తం చేస్తుంది; అయినా మూలంలోని షరతు నిర్మాణాన్ని తెలుగులో నిలిపాం.
- source_word: יַעֲמֹד
  choice: నిలిచి ఉంటే
  rationale: మూల క్రియకు అక్షరార్థంగా ‘నిలుచు’ అని అర్థం; ఈ సందర్భంలో తల శరీరంపై అలాగే ఉండడాన్ని సూచిస్తుంది. ‘నిలిచి ఉంటే’ అక్షరార్థ దృశ్యాన్నీ సందర్భార్థాన్నీ కలిపి ఉంచుతుంది.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: షాఫాతు కుమారుడైన ఎలీషా తల
  rationale: హెబ్రీ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో అందిస్తూ, బెదిరింపులోని తీవ్రతను నిలుపుతుంది.
- source_word: עָלָיו
  choice: అతని మీదే
  rationale: సర్వనామం సహజంగా ఎలీషాను తిరిగి సూచిస్తుంది. ‘మీదే’ మూలంలోని సంక్షిప్తమైన, స్పష్టంగా విప్పని దృశ్యాన్ని నిలుపుతుంది; ‘శరీరంపై’ అనే వివరణను పాదటిప్పణికి పరిమితం చేశాం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: బెదిరింపు తక్షణమే అమలవుతుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రమాణ సూత్రం యొక్క సూచన మరియు బలం
  choice: మాట్లాడేవాడు ఆ రోజే ఎలీషాను శిరచ్ఛేదం చేయకపోతే దేవుడు తనను శిక్షించాలని కోరుకునే స్వీయ-శాప ప్రమాణం
  alternative: పూర్తి ప్రమాణ బలం లేని కోపావేశపు మాట
  rationale: ఈ హెబ్రీ సూత్రం పాత నిబంధనలో కనిపించే స్థిరమైన ప్రమాణ రూపం. కాబట్టి దాన్ని కేవలం కోపావేశంగా సడలించకుండా దాని స్వీయ-శాప బలాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని ఉపయోగించాం. ప్రమాణ సూత్రానికి ‘చేయుగాక’ అనే గౌరవప్రదమైన శాస్త్రోచిత రూపాన్ని ఉంచినా, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా నిర్మించాం. మూలంలోని ‘తల అతని మీద నిలిచి ఉండడం’ అనే సంక్షిప్త, తీవ్ర దృశ్యాన్ని ప్రధాన వచనంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
