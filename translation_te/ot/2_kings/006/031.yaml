- from: 'అప్పుడు అతడు ఇలా అన్నాడు: “ఈ రోజు షాఫాతు కుమారుడైన ఎలీషా తల అతని మీదే నిలిచి ఉంటే[a], దేవుడు నాకు ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువే చేయుగాక!”'
  to: 'అతడు ఇలా అన్నాడు: “దేవుడు నాకు ఇలాగే చేయుగాక, అంతకంటే ఎక్కువగా చేయుగాక—ఈ రోజు షాఫాతు కుమారుడైన ఎలీషా తల అతని శరీరంపైనే ఉండి ఉంటే[a]!”'
