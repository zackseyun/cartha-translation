  to: 'అప్పుడు రాజు ఆమెతో, “నీకు ఏమైంది?” అన్నాడు. ఆమె ఇలా చెప్పింది: “ఈ స్త్రీ నాతో ఇలా అంది, ‘నీ కుమారుణ్ణి ఇవ్వు; ఈ రోజు మనం అతన్ని తిందాం, రేపు నా కుమారుణ్ణి తిందాం.’”'
  rationale: 'సురక్షితమైన చిన్న సవరణలు మాత్రమే చేశాను: రాజు పలికిన మాటను మూలక్రియకు సమీపంగా ‘అన్నాడు’గా మార్చి, సందర్భోచితమైనా కొంత నిర్దిష్టంగా ఉన్న ‘నీ సమస్య ఏమిటి?’ స్థానంలో మూలప్రశ్న విస్తృతతను కాపాడే ‘నీకు ఏమైంది?’ను వాడాను. వాక్యంలోని అసహ్యకరమైన చారిత్రక విషయాన్ని మూలంలాగానే నేరుగా ఉంచాను; అర్థాన్ని మార్చలేదు.'
