  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ముట్టడి వల్ల ఏర్పడిన భయానక పరిస్థితిని మూలపాఠంలో ఉన్నట్లుగానే నేరుగా చెప్పి, దాని తీవ్రతను మృదువుపరచలేదు.
