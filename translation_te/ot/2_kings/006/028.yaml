  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: te
  text: 'అప్పుడు రాజు ఆమెతో, “నీకు ఏమైంది?” అన్నాడు. ఆమె ఇలా చెప్పింది: “ఈ స్త్రీ నాతో ఇలా అంది, ‘నీ కుమారుణ్ణి ఇవ్వు; ఈ రోజు మనం అతన్ని తిందాం, రేపు నా కుమారుణ్ణి తిందాం.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָּךְ
  choice: నీ సమస్య ఏమిటి?
  rationale: అక్షరార్థంగా ‘నీకు ఏమిటి?’ అనే హీబ్రూ ప్రశ్నను, ఫిర్యాదు ఏమిటో అడిగే సందర్భానుసారమైన సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: నీ కుమారుణ్ణి ఇవ్వు
  rationale: ఆజ్ఞార్థక క్రియను, దాని ప్రత్యక్ష కర్మను మూలానికి సమీపంగా ఉంచుతుంది.
- source_word: וְנֹאכְלֶנּוּ
  choice: మనం అతణ్ణి తిందాం
  rationale: మొదటి పురుష బహువచన భావాన్ని, పురుష ఏకవచన కర్మప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
