  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: te
  text: ప్రవక్తల కుమారులు[a] ఎలీషాతో, “దయచేసి చూడండి, మేము మీ సమక్షంలో[b] నివసిస్తున్న స్థలం మాకు సరిపోనంత ఇరుకుగా ఉంది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ప్రవక్తల కుమారులు.’ ఈ హీబ్రూ నుడికారం ప్రవక్తలతో సంబంధమున్న సమూహాన్ని సూచించవచ్చు; ‘ప్రవక్తల శిష్యులు’ లేదా ‘ప్రవక్తల సమూహం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీ పర్యవేక్షణలో.’ ‘మీ సమక్షంలో’ అనే మాట వారు ఎలీషా ఎదుట భౌతికంగా నివసించడమే కాక, ఆయన ఆధ్వర్యంలో ఉన్నారని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: ప్రవక్తల శిష్యులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ప్రవక్తల కుమారులు’ అయినప్పటికీ, సందర్భంలో ఇది ప్రవక్తల సహవాసంలో శిక్షణ పొందుతున్న లేదా వారి పర్యవేక్షణలో ఉన్న సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుమారులు’ జీవసంబంధమైన అర్థాన్ని కలిగించే అవకాశం ఉన్నందున భావాన్ని సహజంగా తెలియజేసే ‘శిష్యులు’ ఎంచుకోబడింది; అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: הִנֵּה נָא
  choice: దయచేసి చూడండి
  rationale: הִנֵּה శ్రద్ధను ఆకర్షిస్తుంది; נָא అభ్యర్థనను మృదువుగా చేస్తుంది. ‘దయచేసి చూడండి’ ఈ రెండు భావాలనూ సహజమైన గౌరవప్రద తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמָּקוֹם
  choice: స్థలం
  rationale: మూలపదం నివాసం లేదా సమావేశ భవనం అని ప్రత్యేకంగా నిర్దేశించదు. ‘స్థలం’ దాని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: మీ సమక్షంలో నివసిస్తున్న
  rationale: יָשַׁב ఇక్కడ స్థిరంగా ఉండడం లేదా నివసించడం అనే భావంలో ఉంది. לְפָנֶיךָ ను ‘మీ సమక్షంలో’గా అనువదించడం ఎలీషా సన్నిధి లేదా పర్యవేక్షణ అనే సాధ్యమైన రెండు భావాలనూ నిలుపుతుంది. ‘అక్కడ’ అనే భావం తెలుగు సంబంధవాక్య నిర్మాణంలో సహజంగా అంతర్భవిస్తుంది.
- source_word: צַר מִמֶּנּוּ
  choice: మాకు సరిపోనంత ఇరుకుగా ఉంది
  rationale: צַר అంటే ‘ఇరుకైనది’. స్థలం చాలడం లేదనే సందర్భోచిత భావాన్ని ‘సరిపోనంత ఇరుకుగా’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని కొనసాగిస్తుంది. తెలుగులో ముందుగా అదనపు కాలసూచక పదం చేర్చకుండా, వాక్యాంతంలోని ‘అన్నారు’ సహజ కథన ప్రవాహాన్ని ఇస్తుంది.
theological_decisions:
- issue: ‘ప్రవక్తల కుమారులు’ అనే హీబ్రూ నుడికారంలోని సంబంధ స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రవక్తల శిష్యులు’
  alternative: ‘ప్రవక్తల కుమారులు’ లేదా ‘ప్రవక్తల సమూహం’
  rationale: ఇది జీవసంబంధమైన కుమారత్వాన్ని తప్పనిసరిగా సూచించదు; అలాగే కచ్చితమైన సంస్థాగత నిర్మాణాన్నీ మూలం నిర్దేశించదు. ‘శిష్యులు’ సందర్భంలోని బోధన/పర్యవేక్షణ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యతలను పాదసూచిక గుర్తిస్తుంది.
- issue: לְפָנֶיךָ ద్వారా సూచించబడే సంబంధం
  choice: ‘మీ సమక్షంలో’ అనే తెరచిన అనువాదం
  alternative: ‘మీ పర్యవేక్షణలో’
  rationale: ఈ పదబంధం భౌతిక సన్నిధినీ, ఎలీషా ఆధ్వర్యంలో ఉండడాన్నీ సూచించవచ్చు. ప్రధాన పాఠ్యంలో ఒక భావానికే పరిమితం చేయకుండా అస్పష్టతను నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. ఎలీషాను ఉద్దేశించిన క్రియలో గౌరవ బహువచనం వాడబడింది. ప్రధాన పాఠ్యం సహజంగా ఉండేలా హీబ్రూ నుడికారాన్ని భావానువాదం చేసి, దాని అక్షరరూపాన్ని పాదసూచికలో ఇచ్చాం.
