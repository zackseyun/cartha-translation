translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస క్రియలను తెలుగు ప్రవాహానికి అనుగుణంగా అనుసంధానించాం. ‘అరాము’ అనే మూల భౌగోళిక నామాన్ని నిలిపాం; ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
