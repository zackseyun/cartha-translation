  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: te
  text: ఆ తర్వాత అరాము రాజైన బెన్-హదదు తన సైన్యమంతటినీ[a] సమకూర్చి, సమరయకు వెళ్లి దానిని ముట్టడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన దండంతటినీ”; హీబ్రూ పదానికి “శిబిరం, దండు, సైన్యం” అనే అర్థాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: హీబ్రూ కథన సూత్రం తరువాత జరిగిన సంఘటనను పరిచయం చేస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం సంక్షిప్తంగా ‘ఆ తర్వాత’ అని అనువదించాం.
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చుకొని
  rationale: సమకూర్చడం లేదా కూడగట్టడం అనే మూలార్థాన్ని, తదుపరి చర్యలతో సహజంగా అనుసంధానిస్తుంది.
- source_word: בֶּן הֲדַד
  choice: బెన్హదదు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజైన
  rationale: మూలంలోని భౌగోళిక నామం ‘అరాము’నే నిలిపి, సంప్రదాయ వ్యాఖ్యాత్మక రూపమైన ‘సిరియా’ను వాడలేదు.
- source_word: כָּל מַחֲנֵהוּ
  choice: తన సైన్యమంతటినీ
  rationale: מַחֲנֶה అంటే శిబిరం, దండు లేదా సైన్యం కావచ్చు. ఈ యుద్ధ సందర్భంలో ‘సైన్యం’ సహజంగా, స్పష్టంగా ఉంది; మూలపద విస్తృతిని పాదటిప్పణిలో నిలిపాం.
- source_word: וַיַּעַל
  choice: బయలుదేరి వచ్చి
  rationale: ఒక స్థలంపైకి సైనికంగా కదలడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘పైకి వెళ్లాడు’ అనే యాంత్రిక రూపాన్ని నివారిస్తుంది.
- source_word: וַיָּצַר עַל
  choice: ముట్టడించాడు
  rationale: ఒక పట్టణాన్ని చుట్టుముట్టి దిగ్బంధించడం అనే సైనిక అర్థాన్ని సంక్షిప్తంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: שֹׁמְרוֹן
  choice: సమరయ
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాన్ని ఉపయోగించాం.
