revisions:
- from: షోమ్రోనులో తీవ్రమైన కరవు వచ్చింది. ఇదిగో, వారు దాన్ని ముట్టడిస్తూ ఉండగా, ఒక గాడిద తల ధర ఎనభై వెండి నాణాలకు, పావు కబు పావురాల రెట్ట[a] ధర ఐదు వెండి నాణాలకు చేరింది.
  to: షోమ్రోనులో తీవ్రమైన కరవు వచ్చింది; ఇదిగో, వారు దాన్ని ముట్టడించడం ఎంతగా కొనసాగిందంటే, ఒక గాడిద తల ఎనభై వెండి నాణాలకు, పావు కబు పావురాల రెట్ట[a] ఐదు వెండి నాణాలకు అమ్ముడయ్యేది.
  rationale: సవరించిన వాక్యం ముట్టడి మరియు విపరీత ధరల మధ్య మూలపాఠంలోని ఫలిత/తీవ్రత సంబంధాన్ని ‘ఎంతగా కొనసాగిందంటే’ ద్వారా నిలుపుతుంది. ధరల గురించి మూలంలోని నామవాక్య స్వభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘అమ్ముడయ్యేది’ వాడబడింది. పాదసూచికలో తప్పుదారి పట్టించే పక్షిపేరు ప్రత్యామ్నాయాన్ని తొలగించి, మూలపదబంధంపై ఉన్న వాస్తవ వ్యాఖ్యాన అనిశ్చితినే భద్రపరిచాం.
