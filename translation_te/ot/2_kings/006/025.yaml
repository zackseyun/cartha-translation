    rationale: హీబ్రూ నిర్మాణం ముట్టడి ఎంత తీవ్రంగా/ఎంతవరకు కొనసాగిందంటే ఆ ధరలు ఏర్పడ్డాయనే భావాన్ని ఇస్తుంది; కేవలం సమకాలికతను సూచించడం బలహీనమైన అనువాదం.
