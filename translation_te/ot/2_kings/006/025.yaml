id: 2KI.6.25
reference: 2 Kings 6:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֨י רָעָ֤ב גָּדוֹל֙ בְּ/שֹׁ֣מְר֔וֹן וְ/הִנֵּ֖ה צָרִ֣ים עָלֶ֑י/הָ עַ֣ד הֱי֤וֹת רֹאשׁ חֲמוֹר֙ בִּ/שְׁמֹנִ֣ים כֶּ֔סֶף וְ/רֹ֛בַע הַ/קַּ֥ב חרי יונים בַּ/חֲמִשָּׁה כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: te
  text: షోమ్రోనులో తీవ్రమైన కరవు వచ్చింది; ఇదిగో, వారు దాన్ని ముట్టడించడం ఎంతగా కొనసాగిందంటే, ఒక గాడిద తల ఎనభై వెండి నాణాలకు, పావు కబు పావురాల రెట్ట[a] ఐదు వెండి నాణాలకు అమ్ముడయ్యేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొంతమంది దీనిని అక్షరార్థంగా పావురాల రెట్టగా అర్థం చేసుకుంటారు; మరికొందరు కరవు సమయంలో అమ్మిన చవకైన ఆహార పదార్థం లేదా మొక్క ఉత్పత్తి పేరుగా భావిస్తారు.
    reason: חרי יונים అనే పదబంధం అర్థంపై ఉన్న నిజమైన పదార్థసంబంధ అనిశ్చితిని నిలుపుటకు.
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: తీవ్రమైన కరవు వచ్చింది
  rationale: గָּדוֹל యొక్క తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, కథనాన్ని ప్రారంభించే וַיְהִי భావాన్ని ‘వచ్చింది’తో వ్యక్తం చేస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: నగరంలో ఏర్పడిన పరిస్థితిని సూచించే స్థలార్థక ప్రయోగం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన, భయంకరమైన పరిస్థితివైపు పాఠకుని దృష్టిని మళ్లించే హీబ్రూ సంభాషణ సూచకాన్ని నిలుపుతుంది.
- source_word: צָרִים עָלֶיהָ
  choice: వారు దాన్ని ముట్టడిస్తూ ఉండగా
  rationale: కర్తను హీబ్రూలాగే నిర్దిష్టంగా పేర్కొనకుండా ఉంచి, పార్టిసిపిల్ సూచించే కొనసాగుతున్న ముట్టడిని వ్యక్తం చేస్తుంది.
- source_word: עַד הֱיוֹת
  choice: ధర ... చేరింది
  rationale: ముట్టడి ఫలితంగా ధరలు అసాధారణ స్థాయికి చేరిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רֹאשׁ חֲמוֹר
  choice: ఒక గాడిద తల
  rationale: కరవు తీవ్రతను చూపించే మూలపాఠంలోని దిగ్భ్రాంతికరమైన చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: ఎనభై వెండి నాణాలకు
  rationale: హీబ్రూలో పేర్కొన్న వెండి మొత్తాన్ని పాఠకులకు అర్థమయ్యే ద్రవ్యవ్యవహార భాషలో ఇస్తుంది; ‘షెకెల్లు’ అని మూలంలో లేని ప్రమాణాన్ని నిర్దిష్టంగా చేర్చదు.
- source_word: רֹבַע הַקַּב
  choice: పావు కబు
  rationale: రֹבַעను సహజమైన ‘పావు’గా అనువదించి, అనిశ్చితమైన ఆధునిక పరిమాణంతో భర్తీ చేయకుండా ప్రాచీన కొలమానమైన ‘కబు’ను నిలుపుతుంది.
- source_word: חרי יונים
  choice: పావురాల రెట్ట
  rationale: పదబంధపు సూటి అర్థాన్ని అనుసరిస్తుంది; ఇది చవకైన ఆహార పదార్థం లేదా మొక్క ఉత్పత్తి పేరు కావచ్చనే భిన్న అవగాహనను పాదసూచికలో ఉంచుతుంది.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: ఐదు వెండి నాణాలకు
  rationale: మొదటి ధర వాక్యభాగంతో సమాంతరతను కాపాడుతూ వెండి మొత్తాన్ని స్పష్టంగా తెలియజేస్తుంది.
