source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכ֤וּ וּ/רְאוּ֙ אֵיכֹ֣ה ה֔וּא וְ/אֶשְׁלַ֖ח וְ/אֶקָּחֵ֑/הוּ וַ/יֻּגַּד ל֥/וֹ לֵ/אמֹ֖ר הִנֵּ֥ה בְ/דֹתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: te
  text: 'అప్పుడు అతడు, “వెళ్లి అతడు ఎక్కడ ఉన్నాడో చూడండి; నేను పంపి అతణ్ణి పట్టుకొనేందుకు[a]” అన్నాడు. అతనికి ఇలా సమాచారం అందింది: “ఇదిగో, అతడు దోతానులో[b] ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నేను పంపి అతణ్ణి పట్టుకుంటాను.” ఇక్కడి హీబ్రూ క్రియల వరుస ఉద్దేశాన్ని—అతణ్ణి పట్టుకోవడానికి పంపడాన్ని—సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: దోతాను సమరయకు ఉత్తరాన ఉన్న ఒక పట్టణం; యోసేపు కథలో కూడా ఈ ప్రాంతం ప్రస్తావించబడింది (ఆది 37:17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol వరుసను ఆధునిక తెలుగు కథనశైలిలో సహజంగా తెలియజేస్తుంది.
- source_word: לְכוּ וּרְאוּ
  choice: వెళ్లి … చూడండి
  rationale: రెండు బహువచన ఆజ్ఞారూపాల ప్రత్యక్ష భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֵיכֹה הוּא
  choice: అతడు ఎక్కడ ఉన్నాడో
  rationale: వ్యక్తి ఉన్న స్థలాన్ని తెలుసుకోమనే ప్రశ్నార్థక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: అప్పుడు నేను మనుషులను పంపి అతణ్ణి పట్టుకుంటాను
  rationale: ‘పంపడం’ అనే క్రియలో కర్మ హీబ్రూలో స్పష్టంగా లేకపోయినా, తెలుగులో భావం సహజంగా ఉండేందుకు ‘మనుషులను’ సరఫరా చేయబడింది; శత్రుత్వ సందర్భంలో לקחకు ‘పట్టుకొను’ తగిన భావం.
- source_word: וַיֻּגַּד לוֹ
  choice: అతనికి సమాచారం అందింది
  rationale: హోఫల్ నిష్క్రియ రూపంలోని ‘అతనికి తెలియజేయబడింది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిష్క్రియ స్వరంతో అందిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయానికి గౌరవప్రదమైన, ప్రస్తుత తెలుగు సమానార్థకం.
- source_word: בְדֹתָן
  choice: దోతానులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, בְ యొక్క స్థానార్థక భావాన్ని ‘లో’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క దృష్టి ఆకర్షణ భావం నిలుపబడింది; హీబ్రూ క్రియల వరుసలోని సాధ్యమైన ఉద్దేశార్థం పాదసూచికలో సంరక్షించబడింది.
