source:
  edition: WLC
  text: וַ/יִּכְרֶ֨ה לָ/הֶ֜ם כֵּרָ֣ה גְדוֹלָ֗ה וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אֲדֹֽנֵי/הֶ֑ם וְ/לֹֽא יָ֤סְפוּ עוֹד֙ גְּדוּדֵ֣י אֲרָ֔ם לָ/ב֖וֹא בְּ/אֶ֥רֶץ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: te
  text: అప్పుడు అతడు వారి కోసం గొప్ప విందు సిద్ధం చేశాడు[a]. వారు తిని తాగారు. ఆ తరువాత అతడు వారిని పంపివేశాడు; వారు తమ యజమాని[b] దగ్గరికి వెళ్లారు. అప్పటి నుంచి అరాము దోపిడీ దళాలు ఇశ్రాయేలు దేశంలోకి మళ్లీ రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్ప భోజనం ఏర్పాటు చేశాడు.” హీబ్రూలో ఒకే మూలానికి చెందిన క్రియా-నామ పదబంధం సమృద్ధమైన భోజనం సిద్ధం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ ప్రభువు దగ్గరికి.” హీబ్రూ రూపం అక్షరార్థంగా “తమ యజమానుల” అని కూడా అర్థమివ్వగలదు; ఇక్కడ అది బహుశా అరాము రాజును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: గొప్ప విందు సిద్ధం చేశాడు
  rationale: క్రియా-నామ పదబంధం సమృద్ధమైన భోజనం లేదా విందు ఏర్పాటు చేయడాన్ని సూచిస్తుంది; తెలుగు సహజత్వంతో పాటు גְדוֹלָה ఇచ్చే ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారి కోసం
  rationale: సందర్భంలో పట్టుబడిన అరామీయులను సూచించే సర్వనామాన్ని సరళంగా అనువదిస్తుంది.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: వారు తిని తాగారు
  rationale: జతగా ఉన్న రెండు క్రియలను సహజమైన తెలుగు క్రమంలో నేరుగా అందిస్తుంది.
- source_word: וַיְשַׁלְּחֵם
  choice: వారిని పంపివేశాడు
  rationale: వారిని విడుదల చేసి వెళ్లనిచ్చిన కథా సందర్భానికి సరిపోతూ שׁלח భావాన్ని నిలుపుతుంది.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: తమ యజమాని దగ్గరికి
  rationale: రూపపరంగా బహువచన ఛాయ ఉన్నా, గౌరవ లేదా హోదా రూపంగా అరాము రాజును ఏకవచనంలో సూచించే అవకాశమే సందర్భంలో బలంగా ఉంది.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: అప్పటి నుంచి ... మళ్లీ రాలేదు
  rationale: יסף + עוד ఇక్కడ ఆ చర్య ఇక పునరావృతం కాలేదనే భావాన్ని ఇస్తుంది; 'అప్పటి నుంచి' కథన ఫలితాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: גְּדוּדֵי אֲרָם
  choice: అరాము దోపిడీ దళాలు
  rationale: גְּדוּדֵי సాధారణ సైన్యంకన్నా దాడులు లేదా దోపిడీలు చేసే బృందాలను సూచిస్తుంది; אֲרָםను మూలభాషకు సమీపంగా 'అరాము'గా ఉంచుతుంది.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశంలోకి ... రాలేదు
  rationale: בוא + ב లోని భూభాగంలోకి ప్రవేశించే గమన భావాన్ని 'దేశంలోకి' నిలుపుతుంది.
theological_decisions:
- issue: אֲדֹנֵיהֶם యొక్క సంఖ్య మరియు సూచన
  choice: తమ యజమాని
  alternative: తమ యజమానుల దగ్గరికి / తమ ప్రభువు దగ్గరికి
  rationale: సందర్భం అరాము రాజును సూచిస్తున్నట్లు కనిపిస్తుంది. అయితే హీబ్రూ రూపంలోని సంఖ్యా అస్పష్టతను పాదటిప్పణిలో తెలియజేస్తూ, ప్రధాన పాఠ్యంలో సహజమైన ఏకవచనాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. 'అరాము,' 'ఇశ్రాయేలు' అనే మూలనామ రూపాలు నిలుపబడ్డాయి; విందు పదబంధంలోని హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందించాం.
