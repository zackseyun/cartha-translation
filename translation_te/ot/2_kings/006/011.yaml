base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: te
  text: ఈ విషయం వల్ల అరాము రాజు హృదయం ఎంతో కలవరపడింది. అతడు తన సేవకులను పిలిచి, “మనవారిలో ఇశ్రాయేలు రాజు పక్షాన ఉన్నవాడెవరో[a] మీరు నాకు చెప్పరా?” అని వారిని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనవారిలో ఇశ్రాయేలు రాజుకు చెందినవాడెవరో.” హీబ్రూ పదబంధం చాలా సంక్షిప్తంగా ఉండి, ఇశ్రాయేలు రాజు పట్ల విధేయతను లేదా అతనితో రహస్య సహకారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: ఎంతో కలవరపడింది
  rationale: ఈ క్రియ తీవ్రమైన అంతరంగ కలవరాన్ని లేదా ఉద్రేకాన్ని సూచిస్తుంది. సందర్భంలో కోపం ఉండవచ్చుగాని, దానికే అర్థాన్ని పరిమితం చేయకుండా రాజు తీవ్రంగా కలత చెందిన భావాన్ని ఈ పదబంధం సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֵב
  choice: హృదయం
  rationale: హీబ్రూ వాడుకలో ఇది ఆలోచనలూ భావోద్వేగాలూ కలిగిన అంతరంగ వ్యక్తిత్వాన్ని సూచిస్తుంది. ‘హృదయం’ మూలభాష రూపకాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ఈ విషయం వల్ల
  rationale: ఇక్కడ דָּבָר ఒక పరిస్థితిని లేదా వ్యవహారాన్ని సూచిస్తుంది. కారణభావాన్ని సహజంగా తెలియజేయడానికి ‘ఈ విషయం వల్ల’ అని అనువదించబడింది.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: రాజసభ సందర్భంలో ఈ పదం రాజుకు సేవచేసే వారిని లేదా అధికారులను సూచించవచ్చు. ‘సేవకులు’ మూలపదానికి దగ్గరగా ఉండి, అవసరానికి మించిన హోదాను నిర్దేశించదు.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: మీరు నాకు చెప్పరా?
  rationale: ప్రతికూల ప్రశ్నరూపం రాజు చేస్తున్న గట్టి డిమాండును వ్యక్తం చేస్తుంది. ‘చెప్పరా?’ ప్రశ్నరూపాన్నీ ఆ ఒత్తిడినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: మనవారిలో ... ఉన్నవాడెవరో
  rationale: అరామీయుల శిబిరంలోని అంతర్గత వ్యక్తిని రాజు అనుమానిస్తున్నాడు. ‘మనవారిలో’ అనేది సమూహానికి చెందినవారిలో ఒకరనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు పక్షాన ఉన్నవాడు
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి, ఇశ్రాయేలు రాజుపట్ల విధేయత లేదా అతనితో రహస్య సహకారాన్ని సూచిస్తుంది. ‘పక్షాన ఉన్నవాడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తూనే ఉద్దేశపూర్వక గూఢచర్యమని మరీ స్పష్టీకరించదు.
