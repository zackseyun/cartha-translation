  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: te
  text: 'వారు అతనికి ఎదురుగా దిగివచ్చినప్పుడు, ఎలీషా యాహ్వేకు ప్రార్థించి ఇలా అన్నాడు: “దయచేసి ఈ జనాన్ని అంధత్వంతో కొట్టు[a].” అప్పుడు యాహ్వే ఎలీషా మాట ప్రకారం వారిని అంధత్వంతో కొట్టాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కళ్లకు మసక లేదా దృష్టిభ్రాంతి కలిగేలా.” హీబ్రూ పదం దేవుడు కలిగించిన, సరిగా చూడలేకపోయే దృష్టి వైకల్యాన్ని సూచించవచ్చు; అది తప్పనిసరిగా సంపూర్ణమైన లేదా శాశ్వతమైన అంధత్వం అని అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: వారు అతనిమీదికి దిగివచ్చినప్పుడు
  rationale: ירד యొక్క ‘దిగివచ్చు’ అనే స్థలార్థాన్ని నిలిపి, శత్రుసైన్యం ఎలీషా వైపు కదిలిన సందర్భాన్ని ‘అతనిమీదికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: ఎలీషా యెహోవాకు ప్రార్థిస్తూ
  rationale: התפלל కు సాధారణమైన ‘ప్రార్థించు’ అనే అర్థాన్ని, יהוה కు వ్యక్తిగత దైవనామమైన ‘యెహోవా’ను ఉపయోగిస్తుంది.
- source_word: הַךְ נָא
  choice: దయచేసి … కొట్టు
  rationale: נכה లోని బలమైన ‘కొట్టు’ భావాన్ని నిలుపుతూ, נא లోని వినయపూర్వక విన్నపాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: הַגּוֹי הַזֶּה
  choice: ఈ జనాన్ని
  rationale: גוי ఇక్కడ అరామీయుల సైనిక సమూహాన్ని సూచిస్తుంది; ‘ఈ జనం’ ఆధునిక తెలుగులో సహజంగా ఉండి, మొత్తం దేశభూభాగాన్ని సూచిస్తున్నట్టుగా అనిపించకుండా సమూహార్థాన్ని ఇస్తుంది.
- source_word: בַּסַּנְוֵרִים
  choice: చూపు మసకబారేలా
  rationale: סנורים అనేది దేవుడు కలిగించే, సరిగా చూడలేక లేదా గ్రహించలేకపోయే దృష్టి వైకల్యాన్ని సూచించవచ్చు. ‘గుడ్డితనం’ అని సంపూర్ణ అంధత్వంగా నిర్ణయించకుండా మూలంలోని భావ విస్తృతిని నిలుపుతుంది.
- source_word: וַיַּכֵּם
  choice: ఆయన వారిని … కొట్టాడు
  rationale: సందర్భం ప్రకారం కర్త యెహోవా. తెలుగులో అయోమయం రాకుండా గౌరవార్థక ఏకవచన సర్వనామంతో స్పష్టం చేయబడింది.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: ఎలీషా మాట ప్రకారం
  rationale: דבר యొక్క ‘మాట/ఉక్తి’ భావాన్ని, ప్రవక్త విన్నపానికి అనుగుణంగా జరిగిన కార్యంతో ఉన్న సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది; అసలు ఉచ్చారణపై ఉన్న అనిశ్చితిని ఏ పఠనమూ పూర్తిగా తొలగించదు.
- issue: סנורים యొక్క స్వభావం
  choice: చూపు మసకబారేలా
  alternative: గుడ్డితనంతో
  rationale: ఈ అరుదైన పదం సంపూర్ణ లేదా శాశ్వత అంధత్వాన్నే తప్పనిసరిగా సూచించదు. దైవికంగా కలిగిన దృష్టి/గ్రహణ వైకల్యమనే ఉద్రిక్తతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా కాలసంబంధాన్ని ‘అప్పుడు’ భావంతో వ్యక్తం చేసి, మూలంలోని ప్రార్థన-ప్రత్యుత్తర సంబంధాన్ని నిలిపింది.
