source:
  edition: WLC
  text: וַֽ/יְהִי֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל עֹבֵ֖ר עַל הַ/חֹמָ֑ה וְ/אִשָּׁ֗ה צָעֲקָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר הוֹשִׁ֖יעָ/ה אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: te
  text: ఇశ్రాయేలు రాజు ప్రాకారంపై వెళ్తుండగా, ఒక స్త్రీ అతనికి మొరపెట్టి, “నా ప్రభువైన రాజా, రక్షించండి![a]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రభువైన రాజా, నాకు సహాయం చేయండి!” హీబ్రూ క్రియకు అక్షరార్థం “రక్షించండి”; ఇక్కడ అది అత్యవసర సహాయం కోసం చేసిన మొరగా కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: వెళ్తుండగా
  rationale: וַיְהִי తో కూడిన వర్తమాన కృదంతం గత కథనంలో కొనసాగుతున్న నేపథ్య చర్యను సూచిస్తుంది; తెలుగులో ‘వెళ్తుండగా’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: రాజును గుర్తించే సాధారణ సమాస నిర్మాణం; సందర్భంలో నిర్దిష్ట రాజునే సూచిస్తుంది.
- source_word: עַל הַחֹמָה
  choice: ప్రాకారం మీదుగా
  rationale: עַל యొక్క ‘మీద’ భావాన్ని, రాజు నగర ప్రాకారంపై కదులుతున్న సందర్భాన్ని కలిపి సహజంగా వ్యక్తం చేస్తుంది; కేవలం ‘వెంట’ అని చెప్పి అర్థాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: וְאִשָּׁה
  choice: ఒక స్త్రీ
  rationale: కథనంలో తొలిసారి పరిచయమవుతున్న నిర్దిష్టం కాని స్త్రీని సూచిస్తుంది.
- source_word: צָעֲקָה אֵלָיו
  choice: అతనికి మొరపెట్టి
  rationale: צעק యొక్క బిగ్గరగా, ఆపదలో చేసే విజ్ఞాపన భావాన్ని ‘మొరపెట్టి’ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: అంది
  rationale: నేరుగా పలికిన మాటను పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని తెలుగు కథన శైలికి తగిన విధంగా వాక్యాంత క్రియగా మార్చింది.
- source_word: הוֹשִׁיעָה
  choice: నన్ను రక్షించండి
  rationale: ישע ధాతువు యొక్క ప్రత్యక్ష ‘రక్షించు’ భావాన్ని నిలుపుతుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, విజ్ఞాపనలో వక్తనే ఉద్దేశించినట్లు తెలుగులో సహజంగా తెలిపింది; ‘సహాయం చేయండి’ అనే కార్యాత్మక భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజుకు చేసే గౌరవపూర్వక సంబోధనను, אֲדֹנִי లోని ప్రథమ పురుష స్వామ్యార్థాన్ని నిలుపుతూ సహజమైన తెలుగు సంబోధనగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. రాజును ఉద్దేశించిన మాటలో గౌరవ బహువచనం ఉంచబడింది; ‘ప్రాకారం’ ముట్టడి సందర్భంలోని నగర గోడను స్పష్టంగా సూచిస్తుంది.
