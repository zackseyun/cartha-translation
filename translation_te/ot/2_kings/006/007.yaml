  yaml_path: translation/ot/2_kings/006/007.yaml
  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
translation:
  language: te
  text: అప్పుడు అతడు, “దాన్ని నీ కోసం పైకి ఎత్తుకో[a]” అన్నాడు. అతడు తన చెయ్యి చాపి దాన్ని తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని నీ కోసం తీసుకో.” హెబ్రీ ఆజ్ఞారూప క్రియను మరింత సాధారణంగా ‘తీసుకో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: హెబ్రీ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో చూపిస్తుంది; ‘అప్పుడు’ సంఘటనల వరుసను తెలియజేస్తుంది.
- source_word: הָרֶם
  choice: దాన్ని … తీసుకో
  rationale: רוּם/הֵרִים క్రియకు ప్రాథమికంగా ‘పైకి ఎత్తు’ అనే భావం ఉన్నా, నీటిమీదికి వచ్చిన వస్తువును స్వాధీనం చేసుకునే ఈ సందర్భంలో ‘తీసుకో’ సహజమైన తెలుగు ప్రయోగం. సందర్భం ద్వారా తెలిసే కర్మను ‘దాన్ని’ అని స్పష్టంగా పేర్కొన్నాం.
- source_word: לָךְ
  choice: నువ్వే
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న לְ ఇక్కడ ఆ వ్యక్తి స్వయంగా చేయవలసిన చర్యను నొక్కిచెబుతుంది. ‘నువ్వే’ ఆధునిక తెలుగులో ఆ వ్యక్తిగత ప్రమేయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: తన చెయ్యి చాపి
  rationale: ఏదైనా అందుకోవడానికి చెయ్యి చాపడాన్ని సూచించే హెబ్రీ నుడికారానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: וַיִּקָּחֵהוּ
  choice: దాన్ని తీసుకున్నాడు
  rationale: לקח క్రియ యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రెండవ చర్య చేసిన వ్యక్తి మొదటి వాక్యంలోని వక్త కాదని సందర్భానుసారంగా స్పష్టంగా ఉండేందుకు ‘ఆ మనిషి’ అని పేర్కొనబడింది.
