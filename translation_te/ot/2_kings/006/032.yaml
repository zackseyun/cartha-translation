base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: te
  text: 'ఎలీషా తన ఇంట్లో కూర్చుని ఉన్నాడు; పెద్దలు అతనితోపాటు కూర్చుని ఉన్నారు. రాజు తనకు ముందుగా ఒక మనిషిని పంపాడు. అయితే ఆ దూత[b] ఎలీషా దగ్గరకు రాకముందే, ఎలీషా పెద్దలతో ఇలా అన్నాడు: “చూశారా! ఈ హంతకుడి కొడుకు నా తల నరికివేయడానికి[a] మనిషిని పంపాడు. చూడండి, ఆ దూత వచ్చినప్పుడు తలుపు మూసి, అతడు లోపలికి రాకుండా తలుపు దగ్గరే అతన్ని గట్టిగా అడ్డుకోండి. అతని యజమాని అడుగుల చప్పుడు అతని వెనకే వినిపించడం లేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా తలను తొలగించడానికి.” ఇది తల నరికి చంపడాన్ని సూచించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “దూత” అంటే రాజు పంపిన మానవ సందేశవాహకుడు; దేవదూత కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: కూర్చుని ఉన్నాడు / కూర్చుని ఉన్నారు
  rationale: హీబ్రూ కృదంతాలు కొనసాగుతున్న దృశ్యాన్ని సూచిస్తున్నందున, తెలుగులో ప్రగతిశీల స్థితిని సహజంగా వ్యక్తం చేశాం.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: రాజు తనకంటే ముందుగా ఒక మనిషిని పంపాడు
  rationale: ముందటి సందర్భం ప్రకారం గుప్త కర్త రాజు. מִלְּפָנָיו ఇక్కడ రాజు రాకకు ముందుగా మనిషిని పంపడాన్ని సూచిస్తుంది.
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: ఈ రాజసభా సందర్భంలో ఇది దేవదూతను కాదు, రాజు పంపిన మానవ సందేశవాహకుణ్ణి సూచిస్తుంది.
- source_word: הֲרְאִיתֶם
  choice: చూశారా!
  rationale: ఇది పెద్దల దృష్టిని అత్యవసరంగా ఆకర్షించే అలంకారిక ప్రశ్న/పిలుపు; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: ఈ హంతకుడి కొడుకు
  rationale: రాజును అవమానకరంగా సంబోధించే మూలంలోని బంధుత్వ రూపకాన్ని, దాని తీవ్రతను అలాగే ఉంచుతుంది.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: నా తల నరికివేయడానికి
  rationale: అక్షరార్థం ‘నా తలను తొలగించడానికి’; సందర్భంలో శిరచ్ఛేదం చేసి చంపడమే భావం. సహజమైన తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలిపాం, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: סִגְרוּ הַדֶּלֶת וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: తలుపు మూసి, అతడు లోపలికి రాకుండా తలుపు దగ్గరే అతన్ని గట్టిగా అడ్డుకోండి
  rationale: לחץ ఇక్కడ తలుపు వద్ద నొక్కిపట్టి లేదా నిరోధించి లోపలికి రానివ్వకపోవడాన్ని సూచిస్తుంది; తెలుగులో చర్య యొక్క ఉద్దేశాన్ని సహజంగా తెలిపాం.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: అతని యజమాని అడుగుల చప్పుడు అతని వెనకే వినిపించడం లేదా?
  rationale: దూత యజమానియైన రాజు అతని వెంటనే వస్తున్నాడనే మూలంలోని అలంకారిక ప్రశ్నను నిలిపాం.
theological_decisions:
- issue: וַיִּשְׁלַח అనే క్రియకు స్పష్టంగా చెప్పని కర్త
  choice: రాజు
  alternative: అతడు
  rationale: ముందటి వచన సందర్భం ఇశ్రాయేలు రాజునే కర్తగా గుర్తిస్తుంది; తెలుగులో అస్పష్టత రాకుండా పేరును స్పష్టం చేశాం.
- issue: הַמַּלְאָךְ యొక్క స్వరూపం
  choice: రాజు పంపిన మానవ దూత
  alternative: దేవదూత
  rationale: మనిషిని పంపడం, అతని యజమాని వెంట రావడం వంటి కథన వివరాలు ఇది రాజదూత అని స్పష్టంగా సూచిస్తున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. అత్యవసరతను చూపే ఆజ్ఞారూపాలను సహజంగా ఉంచి, మూలంలోని అవమానకరమైన ‘హంతకుడి కొడుకు’ అనే పదబంధాన్ని మృదువుపరచలేదు.
