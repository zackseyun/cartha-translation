  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: te
  text: 'ఎలీషా వారితో ఇలా అన్నాడు: “ఇది దారి కాదు; ఇది పట్టణం కాదు. నా వెంట రండి[a]. మీరు వెదుకుతున్న మనిషి దగ్గరకు నేను మిమ్మల్ని నడిపిస్తాను.” అతడు వారిని సమరయకు నడిపించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నా వెనుక వెళ్లండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: ఆ దారి
  rationale: דֶּרֶךְ అంటే దారి, మార్గం. నిర్దిష్ట సూచనను నిలుపుతూ సందర్భానికి సహజంగా ఉండేందుకు ‘ఆ దారి’ అని అనువదించాం.
- source_word: הָעִיר
  choice: ఆ పట్టణం
  rationale: עִיר అంటే పట్టణం లేదా నగరం. ఇక్కడ నిర్దిష్ట సూచనతో ‘ఆ పట్టణం’ సహజంగా ఉంది.
- source_word: לְכוּ אַחֲרַי
  choice: నా వెంట రండి
  rationale: అక్షరార్థంగా ‘నా వెనుక వెళ్లండి.’ కదలికతో కూడిన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో ‘నా వెంట రండి’ తెలియజేస్తుంది.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: నేను మిమ్మల్ని తీసుకెళ్తాను
  rationale: הלך ధాతువు హిఫీల్ రూపం ఇక్కడ నడిపించడం లేదా తీసుకెళ్లడం అనే కారక భావాన్ని ఇస్తుంది. గమ్యవ్యక్తి దగ్గరికి చేర్చే సందర్భంలో ‘తీసుకెళ్తాను’ సహజం.
- source_word: הָאִישׁ
  choice: మనిషి
  rationale: אִישׁ సాధారణంగా ‘మనిషి/పురుషుడు.’ ఎలీషా తననే పరోక్షంగా సూచిస్తున్న కథన వ్యంగ్యాన్ని ‘మనిషి’ నిలుపుతుంది.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: మీరు వెదుకుతున్న
  rationale: בקשׁ అంటే వెదకడం. కొనసాగుతున్న అన్వేషణను ఆధునిక తెలుగులో ‘వెదుకుతున్న’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: అతడు వారిని తీసుకెళ్లాడు
  rationale: ముందటి కారక క్రియతో భావసామ్యాన్ని ఉంచుతూ, గమ్యస్థానానికి నడిపించిన చర్యను ‘తీసుకెళ్లాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֹׁמְרוֹנָה
  choice: సమరయకు
  rationale: దిశాసూచక ה సమరయ వైపు కదలికను సూచిస్తుంది; తెలుగులో దాన్ని ‘సమరయకు’ అని సహజంగా వ్యక్తపరుస్తాం.
theological_decisions:
- issue: అరామీయులతో ఎలీషా చెప్పిన మోసపూరితంగా కనిపించే మాట
  choice: ‘ఇది ఆ దారి కాదు; ఇది ఆ పట్టణమూ కాదు’ అని నేరుగా అనువదించడం
  alternative: అది పాక్షిక సత్యమని లేదా ఉద్దేశపూర్వక మోసమని వివరణను అనువాదంలోనే చేర్చడం
  rationale: హీబ్రూ వాక్యం నైతిక వ్యాఖ్య లేకుండా సూటిగా ఉంది. అందువల్ల కథనంలోని నైతిక, వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని నిర్దిష్టత, పరోక్ష స్వీయసూచన, నైతిక ఉద్వేగం నిలుపబడ్డాయి.
