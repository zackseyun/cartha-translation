  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘అరాము,’ ‘ఇశ్రాయేలు’ అనే బైబిలు స్థలనామ రూపాలను నిలిపి, ‘ఫలానా చోట’ ద్వారా మూలంలోని నానుడి స్వభావాన్ని కాపాడాం.
