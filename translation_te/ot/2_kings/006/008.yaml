source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֔ם הָיָ֥ה נִלְחָ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יִּוָּעַץ֙ אֶל עֲבָדָ֣י/ו לֵ/אמֹ֗ר אֶל מְק֛וֹם פְּלֹנִ֥י אַלְמֹנִ֖י תַּחֲנֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: te
  text: అరాము రాజు ఇశ్రాయేలుకు వ్యతిరేకంగా యుద్ధం చేస్తున్నాడు. అతడు తన సేవకులతో సంప్రదించి, “ఫలానా చోట నా శిబిరం ఉంటుంది”[a] అని ఇలా అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఫలానా చోట నా శిబిరం ఉంది.” హెబ్రీలో పేరు చెప్పని స్థలాన్ని సూచించే ఒక నానుడి వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: సందర్భాన్ని కొనసాగించే ו ను తెలుగులో ప్రత్యేక పదంతో చూపకుండానే సహజమైన కథన ప్రవాహంలో అందించవచ్చు. אֲרָם అనే స్థలనామాన్ని సంప్రదాయబద్ధంగా ‘అరాము’ అని లిప్యంతరీకరించాం.
- source_word: הָיָה נִלְחָם
  choice: యుద్ధం చేస్తూ ఉన్నాడు
  rationale: היה తో కూడిన నిఫాల్ కృదంత నిర్మాణం గతంలో కొనసాగుతున్న లేదా పునరావృతమవుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో
  rationale: נלחם తో ב ప్రత్యర్థిని సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలుతో యుద్ధం’ అనేది సహజంగా విరోధార్థాన్నే తెలియజేస్తుంది.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: అతడు తన సేవకులతో ఆలోచించి
  rationale: క్రియకు సంప్రదించడం, సలహా చేసుకోవడం అనే భావం ఉంది. రాజసభ సందర్భమైనా עֲבָדָיו విస్తృతంగా ‘సేవకులు’ అని అర్థమవుతుంది; ‘అధికారులు’ అని సంకుచితం చేయలేదు.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: ఉద్ధరణను ప్రవేశపెట్టే హెబ్రీ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంగా అందించాం.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: ఫలానా చోట
  rationale: ఈ జంట పదబంధం పేరు చెప్పని లేదా నిర్దిష్టంగా పేర్కొనని స్థలాన్ని సూచించే నానుడి. ‘ఫలానా చోట’ తెలుగులో అదే అనిర్దిష్ట భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּחֲנֹתִי
  choice: నా శిబిరం ఉంటుంది
  rationale: ఈ నామవాచకం శిబిరం లేదా మకాం అనే భావాన్ని ఇస్తుంది. యుద్ధ ప్రణాళిక సందర్భంలో భవిష్యదర్థం సహజంగా గ్రహించబడుతుంది; అయితే హెబ్రీలోని సంక్షిప్త నామవాచక వాక్యపు కాల అస్పష్టతను పాదసూచికలో చూపించాం.
