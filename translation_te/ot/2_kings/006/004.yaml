  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: te
  text: కాబట్టి అతడు వారితో కలిసి వెళ్లాడు. వారు యొర్దాను దగ్గరికి వచ్చి చెట్లను నరికారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కలపను కోశారు.” హీబ్రూ పదం విస్తృతంగా చెట్లను లేదా కలపను సూచించవచ్చు; ఇక్కడ చెట్లను నరికే సందర్భం కాబట్టి “చెట్లు” మరింత నిర్దిష్టమైన అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: కాబట్టి అతడు ... వెళ్లాడు
  rationale: הלֶךְ యొక్క wayyiqtol రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి సందర్భంలో చేసిన అభ్యర్థనకు స్పందనను చూపేందుకు ‘కాబట్టి’ సహజంగా ఉంది.
- source_word: אִתָּם
  choice: వారితో కలిసి
  rationale: 3వ పురుష బహువచన ప్రత్యయంతో ఉన్న సహచర్య సూచక పదాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వారు ... వచ్చి
  rationale: בוא ఇక్కడ నిర్దిష్ట స్థలానికి చేరడాన్ని సూచిస్తుంది; తెలుగు కథన ప్రవాహంలో ‘వచ్చి’ సహజంగా తదుపరి చర్యతో అనుసంధానమవుతుంది.
- source_word: הַיַּרְדֵּנָה
  choice: యొర్దాను దగ్గరికి
  rationale: దిశను సూచించే ־ָה ప్రత్యయం యొర్దాను వైపు కదలికను తెలుపుతుంది. నది పేరుతో ‘దగ్గరికి’ అనడం గమ్యస్థానాన్ని సహజంగా వ్యక్తపరుస్తుంది; మూలంలో లేని ‘నది’ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וַיִּגְזְרוּ
  choice: నరికారు
  rationale: గృహనిర్మాణానికి కలపను సిద్ధం చేసే సందర్భంలో גזר చెట్లను కోసి పడగొట్టడాన్ని సూచిస్తుంది; ‘నరికారు’ దీనికి సహజమైన తెలుగు పదం.
- source_word: הָעֵצִים
  choice: చెట్లను
  rationale: עֵץ అనే నామవాచకం చెట్లు లేదా కలపను సూచించగలదు. ఇక్కడ నరికే చర్య కారణంగా నిలిచివున్న చెట్లు ప్రధాన భావం; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
