source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: te
  text: 'అతడు ఇంకా వారితో మాట్లాడుతూ ఉండగానే, ఇదిగో, ఆ సందేశకుడు అతని వైపుకు దిగివస్తుండగా, అప్పుడు అతడు అన్నాడు: “ఇదిగో, ఈ కీడు యెహోవా నుంచే వచ్చింది. ఇక నేను యెహోవా కోసం ఎందుకు వేచిచూడాలి?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇక యెహోవా నుండి నేను ఏమి ఆశించాలి?” హీబ్రూ క్రియకు ‘వేచిచూడు,’ ‘ఆశించు’ అనే రెండు అర్థాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: అతడు ఇంకా వారితో మాట్లాడుతూ ఉండగానే
  rationale: ప్రత్యయంతో కూడిన עוֹדֶנּוּ మరియు వర్తమాన కృదంతం מְדַבֵּר కలిసి కొనసాగుతున్న క్రియను సూచిస్తాయి; ఈ తెలుగు నిర్మాణం ఆ కాలసంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַמַּלְאָךְ
  choice: ఆ సందేశకుడు
  rationale: సమీప సందర్భంలో ఇతడు రాజు పంపిన మానవ దూత; ‘దేవదూత’ అని అనిపించకుండా ‘సందేశకుడు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֹרֵד אֵלָיו
  choice: అతని దగ్గరికి దిగివచ్చాడు
  rationale: ירד లోని కిందికి కదలిక భావాన్ని నిలుపుతూ తెలుగు కథన శైలిలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: కథనంలోనూ ప్రత్యక్ష వాక్యంలోనూ ఉన్న దృష్టిని ఆకర్షించే, ఉద్ఘాటించే శక్తిని నిలుపుతుంది.
- source_word: זֹאת הָרָעָה
  choice: ఈ కీడు
  rationale: רָעָה ప్రస్తుత విపత్తును సూచించినప్పటికీ ‘కీడు’ దాని విస్తృత భావాన్నీ, వక్తలోని నిందారోపణ స్వరాన్నీ పూర్తిగా విప్పి చెప్పకుండా నిలుపుతుంది.
- source_word: מֵאֵת יְהוָה
  choice: యెహోవా నుంచే
  rationale: మూలంలోని దైవనామాన్ని ప్రత్యక్షంగా ఉంచి, ఈ కీడుకు యెహోవాయే మూలమని వక్త చేసే గట్టి ఆరోపణను ‘నుంచే’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: ఇక నేను యెహోవా కోసం ఎందుకు వేచిచూడాలి?
  rationale: יחל అనే క్రియలో వేచిచూడడం, ఆశపెట్టుకోవడం అనే రెండూ భావాలు ఉన్నాయి. సందర్భంలోని విసుగు మరియు ఇక కొనసాగించననే ప్రశ్నార్థక ధోరణిని ప్రధాన పాఠం సహజంగా అందిస్తుంది; ఆశ భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే తెలుగులో ప్రతిబింబిస్తుంది.
- issue: יחל క్రియలోని వేచిచూడడం/ఆశించడం అనే భావసందిగ్ధత
  choice: యెహోవా కోసం వేచిచూడాలి
  alternative: యెహోవా నుండి ఇంకా ఏమి ఆశించాలి?
  rationale: సందర్భంలో రక్షణ కోసం ఇక ఎదురుచూడననే వక్త విసుగు ప్రధానంగా వినిపిస్తుంది. అయితే ఆశ అనే అర్థాన్ని తొలగించకుండా పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చింది.
- issue: הָרָעָה యొక్క నైతిక కీడు/విపత్తు భావపరిధి
  choice: కీడు
  alternative: విపత్తు
  rationale: సందర్భం విపత్తును సూచించినా, ‘కీడు’ మూలపదపు విస్తృతతను మరియు యెహోవా నుంచే వచ్చిందనే వక్త ఆరోపణలోని ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడింది. ‘సందేశకుడు’ మానవ దూతను స్పష్టంచేస్తుంది; ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. సర్వనామాల విషయంలో మూలంలోని వరుసను అనుసరించి ‘అతడు’ వాడబడింది.
