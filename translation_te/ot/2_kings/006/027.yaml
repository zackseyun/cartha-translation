source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַל יוֹשִׁעֵ֣/ךְ יְהוָ֔ה מֵ/אַ֖יִן אֽוֹשִׁיעֵ֑/ךְ הֲ/מִן הַ/גֹּ֖רֶן א֥וֹ מִן הַ/יָּֽקֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: te
  text: అతడు, “యాహ్వే నీకు సహాయం చేయకపోతే[a], నేను నీకు ఎక్కడి నుంచి సహాయం చేయగలను? కళ్లం నుంచా, ద్రాక్ష తొట్టి నుంచా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది అక్షరార్థంగా నిరాకరణ రూపంలో ఉంది; సందర్భంలో “యాహ్వే నిన్ను రక్షించకపోతే, నేను నిన్ను ఎక్కడి నుంచి రక్షించగలను?” అని కూడా అనువదించవచ్చు. రెండు చోట్ల ఉన్న హీబ్రూ క్రియకు సహాయం చేయడం, రక్షించడం లేదా విడిపించడం అనే అర్థాలు రావచ్చు.
    reason: మూలంలోని షరతు నిర్మాణం మరియు ישׁע క్రియ యొక్క అర్థవిస్తృతిని నిలిపేందుకు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని మాటల క్రియను తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంతో అందించింది.
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: యాహ్వే నీకు సహాయం చేయకపోతే
  rationale: אַל తరువాతి క్రియతో కలిసిన ఈ క్లిష్ట ప్రయోగాన్ని సందర్భానుసారమైన షరతుగా అందించింది; ముట్టడి, కరవు నేపథ్యంలో ‘సహాయం’ సహజంగా ఉంటుంది.
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: నీకు సహాయం చేయకపోతే / నీకు … సహాయం చేయగలను
  rationale: ישׁע అనే క్రియకు సహాయం చేయడం, రక్షించడం, విడిపించడం అనే భావాలు ఉన్నాయి. రెండు అర్ధపాదాల్లో ఒకే తెలుగు క్రియను వాడి హీబ్రూ సమాంతరతను నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: מֵאַיִן
  choice: ఎక్కడి నుంచి
  rationale: సహాయం లభించే మూలాన్ని ప్రశ్నించే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: הַגֹּרֶן
  choice: కళ్లం
  rationale: ధాన్యాన్ని నూర్చి వేరు చేసే స్థలాన్ని సూచించే సంక్షిప్తమైన, సాధారణ తెలుగు పదం.
- source_word: הַיָּקֶב
  choice: ద్రాక్ష తొట్టి
  rationale: ద్రాక్షను తొక్కే తొట్టి లేదా దాని రసం చేరే తొట్టిని సూచించే יֶקֶבకు సందర్భోచితమైన స్పష్టమైన అనువాదం.
theological_decisions:
- issue: ישׁע క్రియలోని సహాయం/రక్షణ భావభేదం
  choice: సహాయం చేయు
  alternative: రక్షించు లేదా విడిపించు
  rationale: ఇక్కడ రాజు ఆహార కొరతలో ఉన్న స్త్రీకి తాను ఇవ్వలేని ప్రాయోగిక ఉపశమనాన్ని గురించి మాట్లాడుతున్నాడు. అయినా మూలపదంలోని విస్తృత రక్షణ భావాన్ని పాదసూచికలో ఉంచింది.
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: אַל ప్రయోగం యొక్క వాక్యబలం
  choice: ‘చేయకపోతే’ అనే షరతు
  alternative: ‘చేయవద్దు/చేయడు’ అనే ప్రత్యక్ష నిరాకరణ
  rationale: తరువాత వచ్చే ‘నేను నీకు ఎక్కడి నుంచి సహాయం చేయగలను?’ అనే ప్రశ్నతో కలిసి ఇది నిరాశను వ్యక్తం చేసే షరతుగల వాక్యంగా సహజంగా అర్థమవుతుంది; హీబ్రూలో షరతు సూచక పదం ప్రత్యక్షంగా లేకపోవడాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడింది. ‘కళ్లం’ మరియు ‘ద్రాక్ష తొట్టి’ అనే స్పష్టమైన వ్యవసాయ పదాలతో రాజు అడిగిన వ్యంగ్యార్థక ప్రశ్నను సహజంగా నిలిపింది.
