  terminology: '''యొర్దాను నది,'' ''దూలం,'' and ''నివసించడానికి'' are suitable modern-standard Telugu choices. ''కట్టుకుందాం'' is contextually justified by the collection of beams and does not create a doctrinal or interpretive issue.'
  issues:
