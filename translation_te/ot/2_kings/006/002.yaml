reference: 2 Kings 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נֵֽלְכָה נָּ֣א עַד הַ/יַּרְדֵּ֗ן וְ/נִקְחָ֤ה מִ/שָּׁם֙ אִ֚ישׁ קוֹרָ֣ה אֶחָ֔ת וְ/נַעֲשֶׂה לָּ֥/נוּ שָׁ֛ם מָק֖וֹם לָ/שֶׁ֣בֶת שָׁ֑ם וַ/יֹּ֖אמֶר לֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: te
  text: “దయచేసి మమ్మల్ని యొర్దాను నది వరకు వెళ్లనివ్వండి. అక్కడి నుంచి ఒక్కొక్కరం ఒక్కో దూలం తీసుకొని, అక్కడ మన కోసం నివసించడానికి ఒక స్థలం కట్టుకుందాం” అని వారు అన్నారు. అందుకు అతడు, “వెళ్లండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: దయచేసి మమ్మల్ని ... వెళ్లనివ్వండి
  rationale: మొదటి పురుష బహువచన cohortative రూపంతో కూడిన נָא మర్యాదపూర్వకమైన అభ్యర్థనను తెలియజేస్తుంది. సందర్భంలో వారు ఎలీషా అనుమతి కోరుతున్నారు కాబట్టి ఈ తెలుగు నిర్మాణం సహజంగా ఉంటుంది.
- source_word: עַד הַיַּרְדֵּן
  choice: యొర్దాను నది వరకు
  rationale: עַד గమ్యస్థానాన్ని ‘వరకు/దాకా’ అని సూచిస్తుంది. తెలుగు పాఠకులకు ఇది నది అని స్పష్టంచేయడానికి ‘నది’ చేర్చబడింది.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: అక్కడి నుంచి ఒక్కొక్కరం ఒక్కో దూలం తీసుకొని
  rationale: אִישׁ ... אֶחָת పంపిణీ భావాన్ని కలిగిస్తుంది—ప్రతి వ్యక్తి ఒక్క నిర్మాణ కలపను తీసుకోవాలి. ‘ఒక్కొక్కరం ఒక్కో’ ఆ భావాన్ని సహజ తెలుగులో స్పష్టంగా చూపుతుంది; קוֹרָהకు నిర్మాణ సందర్భంలో ‘దూలం’ సరిపోతుంది.
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: మన కోసం ఒక స్థలం కట్టుకుందాం
  rationale: עשה ప్రాథమికంగా ‘చేయు/నిర్మించు’ అనే విస్తృతార్థం కలిగినప్పటికీ, దూలాలు తెచ్చే ఈ నిర్మాణ సందర్భంలో ‘కట్టుకుందాం’ సహజమైన సమానార్థక అనువాదం. לָנוּ యొక్క ప్రయోజనార్థం ‘మన కోసం’లో నిలిచింది.
- source_word: לָשֶׁבֶת שָׁם
  choice: అక్కడ నివసించడానికి
  rationale: ישב ఇక్కడ కూర్చోవడం కంటే స్థిరంగా ఉండడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది. ‘నివసించడానికి’ ఆధునికమైన, గౌరవప్రదమైన తెలుగు.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: అందుకు అతడు, “వెళ్లండి” అన్నాడు
  rationale: చిన్నదైన అనుమతి జవాబును మూలంలోని సంక్షిప్తతతోనే ఉంచుతుంది. ముందున్న వచనం వల్ల ‘అతడు’ ఎలీషాను సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హెబ్రీ వాక్యంలో మాట్లాడేవారు స్పష్టంగా నామీకరించబడకపోయినా, తెలుగు సంభాషణ స్పష్టత కోసం సందర్భానుసారంగా ‘అని వారు అన్నారు’ చేర్చబడింది. మూలంలోని ‘అక్కడ ... అక్కడ’ పునరుక్తిని తెలుగులో ఒకే ‘అక్కడ’తో సహజీకరించాం; భావ నష్టం లేదు.
