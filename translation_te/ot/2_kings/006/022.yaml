revisions:
- from: అందుకు అతడు[a], “వారిని చంపవద్దు. నీ కత్తితోను నీ విల్లుతోను నీవు చెరపట్టినవారినే చంపుతావా? వారి ముందు రొట్టెను, నీళ్లను ఉంచు[b]. వారు తిని, తాగి, తమ యజమాని దగ్గరికి వెళ్లనివ్వు” అన్నాడు.
  to: 'అందుకు అతడు ఇలా అన్నాడు[a]: “వారిని చంపవద్దు. నీ కత్తితోను నీ విల్లుతోను నీవు చెరపట్టినవారినే చంపుతావా? వారు తిని, తాగి, తమ యజమానుల దగ్గరికి వెళ్లేలా వారి ముందు రొట్టెను, నీళ్లను ఉంచు[b].”'
