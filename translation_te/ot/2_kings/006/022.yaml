id: 2KI.6.22
reference: 2 Kings 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לֹ֣א תַכֶּ֔ה הַ/אֲשֶׁ֥ר שָׁבִ֛יתָ בְּ/חַרְבְּ/ךָ֥ וּֽ/בְ/קַשְׁתְּ/ךָ֖ אַתָּ֣ה מַכֶּ֑ה שִׂים֩ לֶ֨חֶם וָ/מַ֜יִם לִ/פְנֵי/הֶ֗ם וְ/יֹֽאכְלוּ֙ וְ/יִשְׁתּ֔וּ וְ/יֵלְכ֖וּ אֶל אֲדֹנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: te
  text: 'అందుకు అతడు ఇలా అన్నాడు[a]: “వారిని చంపవద్దు. నీ కత్తితోను నీ విల్లుతోను నీవు చెరపట్టినవారినే చంపుతావా? వారు తిని, తాగి, తమ యజమానుల దగ్గరికి వెళ్లేలా వారి ముందు రొట్టెను, నీళ్లను ఉంచు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కత్తితోను నీ విల్లుతోను నీవు చెరపట్టినవారినే చంపుతావు.” హీబ్రూ వాక్యరూపాన్ని ప్రకటనగా కూడా చదవవచ్చు; అయితే సందర్భంలో ఇది వారిని చంపవద్దనే ఆజ్ఞను బలపరిచే అలంకారిక ప్రశ్నగా సహజంగా అర్థమవుతుంది.
    reason: alternative_reading
  - marker: b
    text: “రొట్టె, నీళ్లు” అనేవి ప్రాథమిక ఆహారపానీయాలకు సమష్టిగా వాడి ఉండవచ్చు; అయితే హీబ్రూ పాఠం ఈ రెండింటినీ స్పష్టంగా పేర్కొంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: చంపవద్దు / చంపుతావా
  rationale: נכה అనే క్రియకు కొట్టడం నుంచి చంపడం వరకు అర్థపరిధి ఉంది. ఇక్కడ రాజు వారిని హతమార్చాలా అని అడిగిన సందర్భం వల్ల ప్రాణహాని భావాన్ని స్పష్టంగా తెలిపే ‘చంపు’ సహజంగా సరిపోతుంది.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: నీవు చెరపట్టినవారు
  rationale: שבה సైనిక సందర్భంలో చెరపట్టడాన్ని సూచిస్తుంది; సాధారణంగా పట్టుకోవడం కంటే ‘చెరపట్టు’ మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: నీ కత్తితోను నీ విల్లుతోను
  rationale: మూలంలోని రెండు ఆయుధాలనూ స్పష్టంగా ఉంచడం వాక్యంలోని వాదనను కాపాడుతుంది.
- source_word: שִׂים
  choice: ఉంచు
  rationale: ఆహారాన్ని వారి ముందు పెట్టాలనే ప్రత్యక్ష ఆజ్ఞకు ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: לֶחֶם וָמַיִם
  choice: రొట్టెను, నీళ్లను
  rationale: לֶחֶם విస్తృతంగా ఆహారాన్ని సూచించగలిగినా, మూలం రొట్టె మరియు నీళ్లను ప్రత్యక్షంగా పేర్కొంటుంది; అందువల్ల వాటినే ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: לִפְנֵיהֶם
  choice: వారి ముందు
  rationale: ఆహారం వడ్డించడాన్ని సూచించే మూలభాషా ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: వారు తిని, తాగి ... వెళ్లనివ్వు
  rationale: ఆజ్ఞ తరువాత వచ్చే ఉద్దేశ్యపూర్వక క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: తమ యజమాని దగ్గరికి
  rationale: אֲדֹנֵיהֶם రూపంలో నామవాచకం బహువచనాకారంలో ఉన్నప్పటికీ, సందర్భంలో అరాము సైన్యంపై అధికారమున్న వారి ప్రభువును సూచించవచ్చు. ‘యజమాని’ అధికార సంబంధాన్ని సహజంగా తెలియజేస్తూ వ్యక్తి సంఖ్యపై ఉన్న స్వల్ప సందిగ్ధతను పాదటీకలో వివరిస్తుంది.
theological_decisions:
- issue: ఎలీషా ప్రశ్న యొక్క అలంకారిక బలం
  choice: రాజు వారిని చంపకూడదనే ఆజ్ఞను బలపరిచే అలంకారిక ప్రశ్నగా అనువదించడం
  alternative: ‘నీ కత్తితోను విల్లుతోను చెరపట్టినవారిని నీవు చంపుతావు’ అనే వాక్యంగా చదవడం
  rationale: ప్రతిషేధం వెంట వచ్చే హీబ్రూ నిర్మాణం ప్రశ్నార్థకంగా సహజంగా అర్థమవుతుంది. వారు రాజు స్వయంగా యుద్ధంలో పట్టుకున్న బందీలు కారనే కథా సందర్భాన్నీ ఇది నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. సంభాషణలో ప్రత్యక్ష ఆజ్ఞల సంక్షిప్తతను నిలిపి, ‘చెరపట్టు’ వంటి సందర్భోచిత సైనిక పదాన్ని ఉపయోగించాం. ప్రధాన పాఠ్యంలోని ప్రతి పాదటీక సూచికకు అనుగుణమైన పాదటీక ఇచ్చాం.
