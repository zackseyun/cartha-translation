source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: te
  text: 'అప్పుడు ఎలీషా ప్రార్థించి ఇలా అన్నాడు: “యాహ్వే[a], దయచేసి ఇతడు చూడునట్లు ఇతని కళ్ళు తెరువు.” అప్పుడు యాహ్వే ఆ యువకుని[b] కళ్ళు తెరిచాడు; అతడు చూశాడు. ఇదిగో, ఎలీషా చుట్టూ కొండ గుర్రాలతోను అగ్ని రథాలతోను నిండివుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వే” అనేది יהוה (YHWH) అనే దైవనామానికి లిప్యంతరీకరణ. సంప్రదాయ అనువాదాల్లో దీనిని “ప్రభువు” అని కూడా అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: “యువకుడు” అని అనువదించిన హీబ్రూ పదం נַעַר; సందర్భాన్ని బట్టి దీనికి “పరిచారకుడు” లేదా “సేవకుడు” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థిస్తూ
  rationale: హిత్పయేల్ రూపం దేవునికి చేసే ప్రార్థనను సూచిస్తుంది; కథన ప్రవాహంలో తరువాతి మాటతో సహజంగా అనుసంధానిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: פְּקַח נָא
  choice: దయచేసి ... తెరచి
  rationale: פְּקַח అంటే కళ్ళు తెరవడం; נָא ఇక్కడ కాలార్థకమైన ‘ఇప్పుడు’ కంటే వినయపూర్వక విన్నపాన్ని తెలియజేస్తుంది.
- source_word: וְיִרְאֶה
  choice: ఇతడు చూసేలా చేయి
  rationale: ఆజ్ఞ తరువాత వచ్చే క్రియలోని ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: ఆ యువకుని
  rationale: נַעַרకు యువకుడు లేదా పరిచారకుడు అనే అర్థాలు ఉండవచ్చు; ప్రధాన పాఠంలో విస్తృతమైన మూలార్థాన్ని ఉంచి, సందర్భానుసార ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా దర్శనమైన దృశ్యంపై శ్రద్ధను ఆకర్షించే హీబ్రూ కథన సూచకపు సజీవతను నిలుపుతుంది.
- source_word: הָהָר
  choice: కొండంతా
  rationale: దోతాను చుట్టూ ఉన్న ఎత్తైన భూభాగాన్ని సహజ తెలుగులో ‘కొండ’గా తెలిపింది; సంపూర్ణ వ్యాప్తిని ‘అంతా’ తెలియజేస్తుంది.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: అగ్ని గుర్రాలతో, అగ్ని రథాలతో
  rationale: హీబ్రూ నిర్మాణంలో ‘అగ్ని’ నేరుగా రథానికి సంబంధించినప్పటికీ, అది గుర్రాలకూ వర్తిస్తుందా అనే నిజమైన వ్యాకరణ అస్పష్టత ఉంది; తెలుగు పాఠంలో సమన్వితమైన పరలోక సైన్య దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తూ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేసింది.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: ఎలీషా చుట్టూ
  rationale: ఎలీషాను అన్ని వైపులా చుట్టుముట్టిన రక్షణాత్మక ఉనికిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. తెలుగులో గుర్తించదగిన ‘యెహోవా’ రూపం నామాన్ని బిరుదుగా మార్చకుండా కాపాడుతుంది; ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఇస్తుంది.
- issue: దర్శన స్వభావం
  choice: దేవుడు చూపును అనుగ్రహించగా యువకుడు అగ్ని గుర్రాలు, రథాలు చూశాడని మాత్రమే పేర్కొనడం
  alternative: అవి అక్షరార్థమైన దేవదూతల సైన్యమని లేదా కేవలం ప్రతీకాత్మక దర్శనమని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం యువకుని కళ్ళు తెరవబడటం, అతడు ఆ దృశ్యాన్ని చూడటం చెబుతుంది; దాని తాత్త్విక లేదా అస్తిత్వ స్వభావాన్ని నిర్వచించదు. అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ప్రార్థనలో సహజమైన ఏకవచన సంబోధనను, దర్శన దృశ్యంలో ‘ఇదిగో’ అనే సజీవ సూచకాన్ని ఉపయోగించింది. ‘అగ్ని గుర్రాలు, అగ్ని రథాలు’ అనే పఠనం సహజ తెలుగును లక్ష్యంగా చేసుకుంది; మూలంలోని ‘అగ్ని’ పదం వ్యాకరణపరంగా కనీసం రథాలను విశేషిస్తుందనే అంశాన్ని వ్యాఖ్యాన నిర్ణయంలో స్పష్టంగా నమోదు చేసింది.
