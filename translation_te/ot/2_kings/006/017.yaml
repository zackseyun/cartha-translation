revisions:
- from: అప్పుడు ఎలీషా ప్రార్థిస్తూ, “యెహోవా[a], దయచేసి ఇతని కళ్ళు తెరచి, ఇతడు చూసేలా చేయి” అన్నాడు. యెహోవా ఆ యువకుని[b] కళ్ళు తెరిచాడు; అతడు చూశాడు. ఇదిగో, ఎలీషా చుట్టూ కొండంతా అగ్ని గుర్రాలతో, అగ్ని రథాలతో నిండివుంది.
  to: 'అప్పుడు ఎలీషా ప్రార్థించి ఇలా అన్నాడు: “యాహ్వే[a], దయచేసి ఇతడు చూడునట్లు ఇతని కళ్ళు తెరువు.” అప్పుడు యాహ్వే ఆ యువకుని[b] కళ్ళు తెరిచాడు; అతడు చూశాడు. ఇదిగో, ఎలీషా చుట్టూ కొండ గుర్రాలతోను అగ్ని రథాలతోను నిండివుంది.'
