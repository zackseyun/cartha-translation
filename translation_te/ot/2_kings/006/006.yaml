source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אִישׁ הָ/אֱלֹהִ֖ים אָ֣נָה נָפָ֑ל וַ/יַּרְאֵ֨/הוּ֙ אֶת הַ/מָּק֔וֹם וַ/יִּקְצָב עֵץ֙ וַ/יַּשְׁלֶךְ שָׁ֔מָּ/ה וַ/יָּ֖צֶף הַ/בַּרְזֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: te
  text: అప్పుడు దేవుని మనిషి, “అది ఎక్కడ పడింది?” అని అడిగాడు. అతడు ఆ స్థలాన్ని అతనికి చూపించాడు. అప్పుడు దేవుని మనిషి ఒక చెక్క ముక్కను కోసి, దాన్ని అక్కడ విసిరాడు. ఇనుము[a] తేలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భానుసారం, ఇది ముందు వచనంలో పేర్కొన్న ఇనుప గొడ్డలి తలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తను సూచించే హీబ్రూ బిరుదును వ్యాఖ్యానాత్మకంగా ‘దేవుని ప్రవక్త’ అని మార్చకుండా నేరుగా, సంప్రదాయబద్ధంగా అనువదిస్తుంది.
- source_word: אָנָה נָפָל
  choice: అది ఎక్కడ పడింది?
  rationale: పూర్తయిన సంఘటనలో వస్తువు పడిన స్థలాన్ని అడిగే సహజమైన ఆధునిక తెలుగు ప్రశ్న.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: అతడు ఆ చోటును అతనికి చూపించాడు
  rationale: ראה అనే ధాతువు హిఫీల్ రూపంలోని ‘చూపించు’ అనే causative భావాన్ని, వరుస కథన నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּקְצָב עֵץ
  choice: ఒక కర్రను నరికి
  rationale: קצב యొక్క కోయడం/నరకడం అనే భావాన్నీ, עץ ఇక్కడ విసరగల చెక్క ముక్క లేదా కర్రను సూచించడాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: దాన్ని అక్కడ విసిరాడు
  rationale: క్రియలోని విసరడం మరియు שָׁמָּה లోని స్థల సూచన రెండింటినీ నేరుగా నిలుపుతుంది.
- source_word: וַיָּצֶף
  choice: నీటిపై తేలింది
  rationale: క్రియ యొక్క అకర్మక ‘తేలడం’ భావాన్ని నిలుపుతుంది; తెలుగు వాక్యంలో సందర్భాన్ని సహజంగా స్పష్టం చేయడానికి ‘నీటిపై’ చేర్చబడింది, అద్భుతాన్ని సహజీకరించలేదు.
- source_word: הַבַּרְזֶל
  choice: ఇనుము
  rationale: మూలంలోని అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ముందటి వచనంలోని ఇనుప గొడ్డలి తలను సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: కథనంలోని అద్భుత కార్యం
  choice: ఇనుము నీటిపై తేలిందని సూటిగా పేర్కొనడం
  alternative: ఇనుము పైకి వచ్చిందని లేదా దాన్ని పైకి తెప్పించాడని వ్యాఖ్యానాత్మకంగా చెప్పడం
  rationale: హీబ్రూ పాఠ్యం ఇనుమునే కర్తగా ఉంచి తేలిందని చెబుతుంది. అనువాదం అద్భుతాన్ని సహజీకరించకుండా, అదనంగా వివరించకుండా అలాగే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వరుస హీబ్రూ క్రియలను వేర్వేరు వాక్యాలుగా స్పష్టంగా అందించింది. సర్వనామాల వల్ల కలిగే అయోమయాన్ని తగ్గించడానికి మూడవ వాక్యంలో ‘దేవుని మనిషి’ని పునరుక్తి చేసింది.
