id: 2KI.6.20
reference: 2 Kings 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: te
  text: వారు షోమ్రోనులోకి వచ్చినప్పుడు, ఎలీషా, “యహ్వే, వీరు[a] చూడునట్లు వీరి కళ్లను తెరువు” అన్నాడు. అప్పుడు యహ్వే వారి కళ్లను తెరిచాడు; వారు చూశారు. ఇదిగో, వారు షోమ్రోను మధ్యలో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘వీరు’ అని మాత్రమే ఉంది; ఇది అరామీయ సైనికులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: వారు ... వచ్చినప్పుడు
  rationale: హీబ్రూ కథనంలోని కాలసంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యరూపంలో తెలియజేస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అనే అదనపు పదబంధం అవసరం లేదు.
- source_word: שֹׁמְרוֹן
  choice: షోమ్రోను
  rationale: ఈ సందర్భంలో ప్రాంతాన్ని కాక నగరాన్ని సూచించే స్థలనామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: פְּקַח ... אֶת עֵינֵי
  choice: కళ్లను తెరువు
  rationale: దేవుడు కలిగించిన అంధత్వం లేదా గ్రహణలోపం తొలగిపోవడాన్ని సూచించే హీబ్రూ నుడికారాన్ని యథాతథంగా, సహజంగా నిలుపుతుంది.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: హీబ్రూలో నామవాచకం లేకుండా ఉన్న సూచనాసర్వనామాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది; సందర్భంలో ఇది అరామీయ సైనికులను సూచిస్తుంది.
- source_word: וְיִרְאוּ
  choice: చూసేలా
  rationale: ఆజ్ఞార్థక క్రియ తరువాతి ఈ క్రియ ప్రార్థనలో ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: అప్పుడు యహ్వే వారి కళ్లను తెరిచాడు
  rationale: ఎలీషా ప్రార్థనకు వెంటనే కలిగిన నెరవేర్పును కథన క్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּרְאוּ
  choice: వారు చూశారు
  rationale: ‘గ్రహించారు’ అని వ్యాఖ్యానించకుండా, మూలంలోని చూడటానికి సంబంధించిన క్రియను నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా తెలిసిన పరిస్థితిపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచిక బలాన్ని కాపాడుతుంది.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: షోమ్రోను నడిమధ్యలో
  rationale: వారు నగరం లోపల, దాని మధ్యలో చిక్కుకున్నారనే నాటకీయ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని ఇవ్వడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కళ్లను తెరువు’ అనే మూల నుడికారం, ‘ఇదిగో’ అనే ఆకస్మిక గ్రహణ సూచిక నిలుపబడ్డాయి.
