  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: te
  text: 'ఇశ్రాయేలు రాజు వారిని చూసినప్పుడు ఎలీషాతో ఇలా అన్నాడు: “నా తండ్రీ,[b] నేను వారిని చంపివేయనా? చంపివేయనా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో క్రియ పునరుక్తమై ప్రశ్నకు బలాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నా తండ్రీ” అనేది ఎలీషాను గౌరవంగా సంబోధించే పద్ధతి; ఇది శారీరక తండ్రిని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: וַיֹּאמֶר కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ ప్రశ్న వస్తున్నందున సహజమైన తెలుగులో ‘అని అడిగాడు’ అని అనువదించాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: ఇది సూటిగా ఉన్న construct chain; సందర్భంలో నిర్దిష్టమైన రాజును సూచిస్తుంది.
- source_word: אֶל אֱלִישָׁע
  choice: ఎలీషాతో
  rationale: אֶל ఇక్కడ ఎలీషాను ఉద్దేశించి మాట్లాడడాన్ని సూచిస్తుంది; మూలంలో లేని ‘ప్రవక్త’ అనే బిరుదును చేర్చలేదు.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: వారిని చూసినప్పుడు
  rationale: כְּ + infinitive construct కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తుంది; సందర్భం ప్రకారం చూసినవాడు రాజే.
- source_word: הַאַכֶּה אַכֶּה
  choice: నేను వారిని చంపివేయనా? చంపివేయనా?
  rationale: infinitive absolute మరియు finite verb కలయిక ప్రశ్నకు బలాన్ని ఇస్తుంది. పునరుక్తిని తెలుగులోనూ నిలిపాం; యుద్ధసందర్భంలో נכה ప్రాణాంతకంగా దాడిచేయడాన్ని సూచిస్తున్నందున ‘చంపివేయనా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אָבִי
  choice: నా తండ్రీ
  rationale: పదశః ‘నా తండ్రి’; ఇది ఎలీషాకు ఇచ్చిన గౌరవసూచక సంబోధన. కుటుంబ సంబంధంగా మార్చకుండా మూలంలోని రూపకాన్ని నిలిపాం.
theological_decisions:
- issue: ఎలీషాను గౌరవపూర్వకంగా సంబోధించడం
  choice: ‘నా తండ్రీ’ అని పదశః అనువదించడం
  alternative: ‘నా గురువా’ లేదా ‘అయ్యా’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం కుటుంబసంబంధ పదాన్నే ఉపయోగిస్తుంది. అది ఇక్కడ గౌరవసూచకమైనప్పటికీ, ఆ రూపకాన్ని నిలపడం మూలానికి నిబద్ధంగా ఉండి భావాన్ని అతిగా సమతలపరచకుండా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని వాడాం. ‘చంపివేయనా?’ అనే పునరుక్తి మూలంలోని తీవ్రతను నిలుపుతుంది; ‘నా తండ్రీ’ గౌరవభరితమైన, గంభీరమైన సంబోధనగా ఉంచబడింది.
