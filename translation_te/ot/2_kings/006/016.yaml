id: 2KI.6.16
reference: 2 Kings 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “భయపడకు, ఎందుకంటే మనతో ఉన్నవారు వారితో ఉన్నవారికంటే ఎక్కువమంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఎందుకంటే మనతో ఉన్నవారు వారితో ఉన్నవారికంటే అనేకులు.”'
    reason: רַבִּים ప్రాథమికంగా “అనేకులు/చాలామంది” అనే భావాన్ని కలిగివున్నప్పటికీ, מֵאֲשֶׁר తో కూడిన ఈ నిర్మాణంలో పోలికను సహజంగా చూపడానికి ప్రధాన పాఠ్యంలో “ఎక్కువమంది” అని అనువదించబడింది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది. ఆధునిక తెలుగు కథనశైలిలో “అప్పుడు” ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; “అన్నాడు” మాటలాడిన చర్యను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: אַל తో వచ్చిన క్రియ నిషేధాజ్ఞను వ్యక్తం చేస్తుంది. “భయపడకు” సహజమైన, నేరుగా సంబోధించే ఏకవచన రూపం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי భయపడకూడదనే ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: רַבִּים
  choice: ఎక్కువమంది
  rationale: מֵאֲשֶׁר తో కూడిన నిర్మాణంలో רַבִּים తులనాత్మక భావాన్ని ఇస్తుంది. “ఎక్కువమంది” ఆ పోలికను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אִתָּנוּ
  choice: మనతో ఉన్నవారు
  rationale: సంబంధవాచక పదం, విభక్తి పదబంధం కలసి వ్యక్తుల సమూహాన్ని సూచిస్తున్నాయి; “మనతో ఉన్నవారు” హెబ్రీ నిర్మాణాన్నీ భావాన్నీ కాపాడుతుంది.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: వారితో ఉన్నవారికంటే
  rationale: హెబ్రీలో రెండవ భాగం సంక్షిప్తంగా ఉన్నా, మొదటి భాగానికి సమాంతరంగా “వారితో ఉన్నవారు” అనే భావం సందర్భంలో అంతర్లీనంగా ఉంది. తెలుగులో పోలిక సంపూర్ణంగా, సహజంగా ఉండేందుకు దాన్ని వ్యక్తం చేశాం.
theological_decisions:
- issue: “మనతో ఉన్నవారు” అనే ఎక్కువమంది ఎవరు?
  choice: వారు ఎవరో వచనంలో పేర్కొనకుండా హెబ్రీలో ఉన్నట్లే పరోక్షంగా ఉంచాం.
  alternative: తరువాతి సందర్భం ఆధారంగా వారిని పరలోక సైన్యంగా లేదా దేవదూతలుగా స్పష్టంగా పేర్కొనడం.
  rationale: ఈ వచనం స్వయంగా ఆ సమూహానికి పేరు పెట్టదు; తరువాతి కథనం వారి స్వరూపాన్ని తెలియజేస్తుంది. అందువల్ల వివరణాత్మక భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ఏకవచన సంబోధనను “భయపడకు”గా ఉంచాం; కనిపించని సహాయక బలగం స్వరూపాన్ని అనువాదంలో వివరించలేదు.
