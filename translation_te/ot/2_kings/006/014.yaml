  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని గుర్రాలు, రథాలు అనే స్పష్టమైన సైనిక చిత్రణను నిలిపి, וְחַיִל כָּבֵד అనే నుడికారాన్ని ‘భారీ సైన్యం’గా సహజంగా అనువదించాం.
