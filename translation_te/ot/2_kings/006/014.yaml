id: 2KI.6.14
reference: 2 Kings 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַח שָׁ֛מָּ/ה סוּסִ֥ים וְ/רֶ֖כֶב וְ/חַ֣יִל כָּבֵ֑ד וַ/יָּבֹ֣אוּ לַ֔יְלָה וַ/יַּקִּ֖פוּ עַל הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: te
  text: అప్పుడు అతడు అక్కడికి గుర్రాలను, రథాలను, భారీ సైన్యాన్ని[a] పంపాడు. వారు రాత్రివేళ వచ్చి పట్టణాన్ని చుట్టుముట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గణనీయమైన సైనిక బలగాన్ని.” హెబ్రీలో అక్షరార్థంగా “బరువైన బలగం”; ఇది పెద్దదైన లేదా బలమైన సైనిక దళాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שׁלח క్రియకు సందర్భానుసారమైన సరళమైన అర్థం; అరాము రాజు చేపట్టిన తదుపరి చర్యను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: గమ్యాన్ని సూచించే దిశార్థక అవ్యయం; ఆ గమ్యం ముందరి వచనం ద్వారా స్పష్టమవుతుంది.
- source_word: סוּסִים
  choice: గుర్రాలను
  rationale: మూలపదం నేరుగా ‘గుర్రాలు’ అని సూచిస్తుంది; సైనిక సందర్భం ఉన్నప్పటికీ ‘గుర్రపు దళం’ అని విస్తరించకుండా మూలంలోని స్పష్టమైన రూపాన్ని నిలిపింది.
- source_word: וְרֶכֶב
  choice: రథాలను
  rationale: רֶכֶב అనేది రథాలను లేదా రథదళాన్ని సూచించగలదు; ఇక్కడ స్పష్టమైన సైనిక దృశ్యాన్ని నిలిపేందుకు ‘రథాలు’ సహజంగా ఉంది.
- source_word: וְחַיִל כָּבֵד
  choice: భారీ సైన్యాన్ని
  rationale: חַיִל సైనిక సందర్భంలో సైన్యం లేదా బలగం; כָּבֵד అక్షరార్థంగా ‘బరువైనది,’ కానీ ఇక్కడ గణనీయమైన లేదా పెద్ద సైనిక బలగం అనే నుడికారార్థం. ‘భారీ సైన్యం’ తెలుగు భాషలో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: వారు రాత్రివేళ వచ్చి
  rationale: రాత్రి సమయంలో వారి రాకను నేరుగా తెలియజేస్తుంది; హెబ్రీ బహువచన క్రియను ‘వారు’తో నిలిపింది.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: పట్టణాన్ని చుట్టుముట్టారు
  rationale: సైనికంగా ఒక పట్టణం చుట్టూ మోహరించడాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
