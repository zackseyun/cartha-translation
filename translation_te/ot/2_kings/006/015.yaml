id: 2KI.6.15
reference: 2 Kings 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: te
  text: దేవుని మనిషి పరిచారకుడు తెల్లవారగానే లేచి బయటికి వెళ్లినప్పుడు, ఇదిగో, గుర్రాలూ రథాలూ గల సైన్యం పట్టణాన్ని చుట్టుముట్టి ఉంది. అప్పుడు దేవుని మనిషి సేవకుడు[a] దేవుని మనిషితో, “అయ్యో, నా యజమానీ! మనం ఏం చేద్దాం?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని యువకుడు’ లేదా ‘అతని పరిచారకుడు.’ హెబ్రీ పదం యువకుణ్ణి, సేవకుణ్ణి లేదా పరిచారకుణ్ణి సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: తెల్లవారగానే లేచి
  rationale: హిఫిల్ రూపం ఉదయాన్నే లేవడం లేదా ఏదైనా పని కోసం త్వరగా లేవడం అనే కాలసూచక భావాన్ని ఇస్తుంది; ఈ తెలుగు ప్రయోగం దాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מְשָׁרֵת
  choice: పరిచారకుడు
  rationale: వ్యక్తిగతంగా లేదా అధికారికంగా సేవచేసే వ్యక్తిని సూచిస్తుంది. తరువాతి נַעַר పదంతో తేడాను నిలుపుతూ సేవాసంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ గ్రంథంలో ప్రవక్తకు ఉపయోగించే స్థిరమైన బిరుదును యథాతథంగా నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన దృశ్యాన్నీ, కథనంలోని ఆశ్చర్యాన్నీ సజీవంగా నిలుపుతుంది.
- source_word: חַיִל
  choice: సైన్యం
  rationale: ఈ సందర్భంలో ఇది సాయుధ సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: סוֹבֵב
  choice: చుట్టుముట్టి ఉంది
  rationale: భృత్యుడు బయటికి వచ్చినప్పుడు కొనసాగుతున్న ముట్టడి స్థితిని వర్తమాన దృశ్యంలా వ్యక్తం చేస్తుంది.
- source_word: וְסוּס וָרָכֶב
  choice: గుర్రాలు, రథాలు ఉన్న
  rationale: ఏకవచన సమూహార్థ పదాలను తెలుగు సహజ ప్రయోగంలో బహువచనంగా ఇచ్చి, సైన్యపు వనరులను స్పష్టం చేస్తుంది.
- source_word: נַעֲרוֹ
  choice: అతని యువ సేవకుడు
  rationale: נַעַר పదంలోని వయస్సుకు సంబంధించిన ‘యువకుడు’ భావాన్నీ, సందర్భంలోని సేవాసంబంధాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: אֲהָהּ
  choice: అయ్యో
  rationale: భయం, దిగులు, నిస్సహాయతలను వ్యక్తం చేసే హీబ్రూ ఆశ్చర్యోక్తికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: אֲדֹנִי
  choice: నా యజమానీ
  rationale: ఇక్కడ ఇది దేవునికి ఇచ్చే బిరుదు కాదు; సేవకుడు తన అధికారి పట్ల గౌరవంతో ఉపయోగించిన సంబోధన.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: మనం ఏం చేద్దాం?
  rationale: భయంతో పలికిన ‘ఎలా చేయగలం/ఏం చేయాలి?’ అనే ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘దేవుని మనిషి’ అనే స్థిర ప్రవక్తా బిరుదును నిలిపాం; ‘ఇదిగో’ ద్వారా మూలంలోని ఆకస్మిక దృశ్యభావాన్ని కాపాడాం.
