  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: te
  text: 'అప్పుడు దేవుని మనిషి ఇశ్రాయేలు రాజుకు ఇలా సందేశం పంపాడు: “ఈ స్థలం గుండా వెళ్లకుండా జాగ్రత్తపడు; ఎందుకంటే అరామీయులు అక్కడ దిగుతున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పంపాడు’; సందర్భంలో పంపబడింది సందేశమని స్పష్టమైనందున సహజ తెలుగు ప్రయోగంగా ‘కబురు పంపి’ అని అనువదించాం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ‘ప్రవక్త’ అని వ్యాఖ్యానించకుండా, మూలంలోని ప్రామాణిక బిరుదును యథాతథంగా నిలిపాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: రాజబిరుదు, జననామం రెండింటికీ నేరమైన తెలుగు రూపం.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: గుండా వెళ్లకుండా జాగ్రత్తపడు
  rationale: నిఫాల్ ఆజ్ఞారూపం మరియు מִן‌తో కూడిన క్రియ ఇక్కడ ఆ మార్గాన్ని నివారించమనే హెచ్చరికను ఇస్తాయి; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం
  rationale: సూచక పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: כִּי שָׁם
  choice: ఎందుకంటే ... అక్కడికి
  rationale: כִּי హెచ్చరికకు కారణాన్ని తెలుపుతుంది; שָׁם అరామీయుల కదలిక లక్ష్యస్థానాన్ని సూచిస్తుంది.
- source_word: אֲרָם
  choice: అరామీయులు
  rationale: సైనిక సందర్భంలో ‘అరాము’ దేశం కంటే ఆ ప్రజలను లేదా సైన్యాన్ని సూచిస్తోంది; ‘సిరియన్లు’ అనే తరువాతి పేరును వాడకుండా మూలనామాన్ని నిలిపాం.
- source_word: נְחִתִּים
  choice: దిగివస్తున్నారు
  rationale: נחת ధాతువు దిగడం అనే అర్థమిస్తుంది; కృదంత రూపం కొనసాగుతున్న లేదా సమీపిస్తున్న సైనిక కదలికను సూచిస్తుంది. ‘దిగివస్తున్నారు’ దాని దిశాత్మకతను సహజ తెలుగులో నిలుపుతుంది.
