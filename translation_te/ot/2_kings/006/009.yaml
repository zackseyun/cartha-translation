translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘దేవుని మనిషి’ అనే బిరుదును వ్యాఖ్యానించకుండా నిలిపాం. అరామీయుల కదలికను సూచించే נְחִתִּיםను ‘దిగివస్తున్నారు’గా ఇచ్చి దాని ప్రాథమిక దిశాత్మక భావాన్ని కాపాడాం.
