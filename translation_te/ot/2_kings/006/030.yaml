  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דִּבְרֵ֤י הָֽ/אִשָּׁה֙ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֔י/ו וְ/ה֖וּא עֹבֵ֣ר עַל הַ/חֹמָ֑ה וַ/יַּ֣רְא הָ/עָ֔ם וְ/הִנֵּ֥ה הַ/שַּׂ֛ק עַל בְּשָׂר֖/וֹ מִ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: te
  text: ఆ స్త్రీ మాటలు విన్నప్పుడు రాజు ప్రాకారంపై వెళ్తుండగా తన బట్టలు చింపుకున్నాడు. ప్రజలు చూశారు; ఇదిగో, అతని ఒంటిమీద, బట్టల లోపల[a] గోనెవస్త్రం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “లోపలినుంచి”; ఇక్కడ గోనెవస్త్రం అతని పైబట్టల కింద ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: כ తో కూడిన క్రియావాచక రూపం కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది; ‘విన్నప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: ఆ స్త్రీ మాటలు
  rationale: ఇక్కడ דְּבָרִים ఆ స్త్రీ చెప్పిన మాటలను సూచిస్తుంది; ‘మాటలు’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: తన బట్టలు చింపుకున్నాడు
  rationale: దుఃఖం లేదా తీవ్ర దిగ్భ్రాంతిని వ్యక్తం చేసే చర్యను ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: ప్రాకారం మీదుగా వెళ్తూనే
  rationale: రాజు పట్టణ ప్రాకారం మీద కదులుతున్న సమయంలోనే బట్టలు చింపుకున్నాడనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: וַיַּרְא הָעָם
  choice: ప్రజలు చూడగా
  rationale: ప్రజలు గమనించిన వెంటనే బయటపడిన దృశ్యాన్ని తదుపరి הִנֵּהతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన లేదా అకస్మాత్తుగా గమనింపబడిన విషయంపై దృష్టి నిలిపే హెబ్రీ సంభాషణాత్మక బలాన్ని కాపాడుతుంది.
- source_word: הַשַּׂק
  choice: గోనెపట్ట
  rationale: శోక సూచకంగా ధరించే ముతక వస్త్రాన్ని తెలుగులో సాధారణంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: עַל־בְּשָׂרוֹ
  choice: ఒంటిమీద
  rationale: అక్షరార్థమైన ‘మాంసంపై’ కంటే సందర్భానుకూలంగా, సహజంగా శరీరంపై నేరుగా ఉన్నదనే భావాన్ని ఇస్తుంది.
- source_word: מִבָּיִת
  choice: బట్టల లోపల
  rationale: అక్షరార్థంగా ‘లోపలినుంచి’; రాజు పైబట్టల కింద గోనెపట్ట ధరించి ఉన్నదనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది, అక్షరార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
