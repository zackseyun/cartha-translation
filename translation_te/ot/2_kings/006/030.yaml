  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క దృష్టి ఆకర్షించే బలం నిలుపబడింది; ‘ప్రాకారం’ పట్టణ గోడను సందర్భానుకూలంగా సూచిస్తుంది.
