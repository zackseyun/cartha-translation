- from: ఆ స్త్రీ మాటలు విన్నప్పుడు రాజు ప్రాకారం మీదుగా వెళ్తూనే తన బట్టలు చింపుకున్నాడు. ప్రజలు చూడగా, ఇదిగో, అతని బట్టల లోపల[a], ఒంటిమీద గోనెపట్ట ఉంది.
