  text: וַ/יִּשְׁלַ֞ח מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֶֽל הַ/מָּק֞וֹם אֲשֶׁ֨ר אָֽמַר ל֧/וֹ אִישׁ הָ/אֱלֹהִ֛ים ו/הזהיר/ה וְ/נִשְׁמַ֣ר שָׁ֑ם לֹ֥א אַחַ֖ת וְ/לֹ֥א שְׁתָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: te
  text: దేవుని మనిషి అతనికి చెప్పి హెచ్చరించిన ఆ స్థలానికి ఇశ్రాయేలు రాజు [మనుష్యులను] పంపించాడు.[a] రాజు అక్కడ జాగ్రత్త వహించాడు[b]—ఒకసారి రెండుసార్లు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆ స్థలానికి పంపించాడు’ అని మాత్రమే ఉంది; ఎవరిని లేదా ఏమి పంపించాడో స్పష్టంగా చెప్పలేదు. సందర్భాన్ని బట్టి ‘[మనుష్యులను]’ అని పూరించబడింది; ‘ఆ స్థలానికి కబురు పంపించాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అక్కడ తనను తాను కాపాడుకున్నాడు’; లేదా, ‘ఆ స్థలంలో ముందు జాగ్రత్తలు తీసుకున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: తనవారిని పంపించాడు
  rationale: హీబ్రూలో క్రియ కేవలం ‘పంపించాడు’ అని ఉండి, పంపబడినవారు లేదా పంపబడినది సందర్భంలో అంతర్భావంగా ఉంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘తనవారిని’ అని పూరించాం; ఇది రాజు ఆ స్థలానికి ప్రతినిధులను పంపించాడనే సందర్భార్థాన్ని తెలియజేస్తుంది, అయితే పూరించిన పదాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: הַמָּקוֹם
  choice: ఆ స్థలం
  rationale: నిర్దిష్టమైన, ముందుగా సూచించబడిన ప్రదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ బిరుదును ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా సంకుచితం చేయకుండా యథాశక్తి నేరుగా నిలుపుతుంది.
- source_word: וְהִזְהִירֹה
  choice: తనను హెచ్చరించాడో
  rationale: హిఫిల్ రూపం హెచ్చరించడం లేదా అప్రమత్తం చేయడం అనే భావాన్ని ఇస్తుంది; కర్మప్రత్యయం రాజును సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
- source_word: וְנִשְׁמַר
  choice: జాగ్రత్త వహించాడు
  rationale: ఈ నిఫల్ రూపం తనను తాను కాపాడుకోవడం, అప్రమత్తంగా ఉండడం లేదా ముందు జాగ్రత్తలు తీసుకోవడం అనే భావాలను అనుమతిస్తుంది. ‘జాగ్రత్త వహించాడు’ ఈ పరిధిని సహజమైన తెలుగులో విస్తృతంగా నిలుపుతుంది.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: ఒకటిరెండు సార్లు కాదు
  rationale: ఈ హీబ్రూ నుడికారం చర్య పదేపదే జరిగిందని సూచిస్తుంది. తెలుగు నుడికార రూపం మూలంలోని సంక్షిప్తతను, పునరావృత భావాన్ని నిలుపుతుంది.
