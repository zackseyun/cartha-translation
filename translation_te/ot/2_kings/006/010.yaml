  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, ‘దేవుని మనిషి’ వంటి మూలభాషా బిరుదును గౌరవప్రదంగా నిలిపాం. హీబ్రూలో అంతర్భావంగా ఉన్న కర్మను ప్రధాన పాఠ్యంలో సహజత కోసం పూరించి, పాదసూచికలో దాని అనిశ్చితిని వెల్లడించాం.
