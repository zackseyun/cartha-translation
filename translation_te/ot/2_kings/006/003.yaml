  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: te
  text: అప్పుడు వారిలో ఒకడు, “దయచేసి నీ సేవకులతో కలిసి వెళ్లడానికి సమ్మతించు[a]” అన్నాడు. అందుకు అతడు, “నేను వెళ్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయచేసి నీ సేవకులతో కలిసి వెళ్లడానికి ఒప్పుకో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֶחָד
  choice: వారిలో ఒకడు
  rationale: అక్షరార్థంగా ‘ఆ ఒక్కడు’; సందర్భంలో ప్రవక్త శిష్యులలో ఒకడు ఎలీషాతో మాట్లాడుతున్నందున ‘వారిలో ఒకడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הוֹאֶל נָא
  choice: దయచేసి … సమ్మతించు
  rationale: הוֹאֶל లోని ఇష్టపూర్వక సమ్మతి భావాన్నీ, נָא లోని మర్యాదపూర్వక అభ్యర్థననూ ఈ రూపం నిలుపుతుంది.
- source_word: וְלֵךְ
  choice: రావడానికి
  rationale: హీబ్రూలో ‘వెళ్లు’ ఉన్నప్పటికీ, మాట్లాడుతున్న వారి దృష్టికోణం నుంచి తెలుగులో తోడుగా ఆహ్వానించేటప్పుడు ‘మాతో/సేవకులతో కలిసి రా’ అనడం సహజం. తరువాతి సమాధానంలోనూ అదే దృష్టికోణం ప్రకారం ‘వస్తాను’ వాడబడింది.
- source_word: אֶת עֲבָדֶיךָ
  choice: నీ సేవకులతో కలిసి
  rationale: చలన క్రియతో אֶת సహవాసాన్ని సూచిస్తుంది. עֲבָדֶיךָ ఇక్కడ ఎలీషా శిష్యులు తమను వినయంగా పేర్కొనే మాట; అందువల్ల ‘సేవకులు’ సరైనది.
- source_word: אֲנִי אֵלֵךְ
  choice: నేను వస్తాను
  rationale: వ్యక్తమైన אֲנִי స్వల్ప ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది. సంభాషణలో ఆహ్వానించిన వారితో కలిసి వెళ్లేందుకు అంగీకరిస్తున్నందున సహజ తెలుగులో ‘వస్తాను’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో మర్యాదపూర్వకమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘నీ సేవకులు’ అనే మూలపాఠంలోని వినయపూర్వక స్వీయసూచనను అలాగే నిలిపి, గమ్యభాష దృష్టికోణానికి అనుగుణంగా ‘రా/వస్తాను’ రూపాలు ఎంచుకోబడ్డాయి.
