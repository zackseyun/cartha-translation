source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַחַ֣ד מֵֽ/עֲבָדָ֔י/ו ל֖וֹא אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ כִּֽי אֱלִישָׁ֤ע הַ/נָּבִיא֙ אֲשֶׁ֣ר בְּ/יִשְׂרָאֵ֔ל יַגִּיד֙ לְ/מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר בַּ/חֲדַ֥ר מִשְׁכָּבֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: te
  text: 'కానీ అతని సేవకుల్లో ఒకడు ఇలా అన్నాడు: “నా ప్రభువైన రాజా, అలా కాదు; ఇశ్రాయేలులో ఉన్న ప్రవక్త ఎలీషా, మీరు మీ పడకగదిలో మాట్లాడే మాటలను ఇశ్రాయేలు రాజుకు తెలియజేస్తున్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוא ... כִּי
  choice: అలా కాదు
  rationale: రాజు అనుమానించిన ద్రోహాన్ని సేవకుడు తిరస్కరించి, దానికి బదులుగా నిజమైన కారణాన్ని చెబుతున్న హీబ్రూ వ్యతిరేక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: గౌరవసూచక ప్రత్యక్ష సంబోధనను, అలాగే ‘నా ప్రభువు’ మరియు ‘రాజు’ అనే రెండు అంశాలను నిలుపుతుంది.
- source_word: יַגִּיד
  choice: తెలియజేస్తున్నాడు
  rationale: ఎలీషా రాజుకు విషయాలను వెల్లడిస్తున్నాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలోని పునరావృత చర్యను వర్తమాన రూపంలో చూపుతుంది.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: మీ పడకగదిలో
  rationale: ‘నీ పడక గదిలో’ అనే వ్యక్తిగత, రహస్య స్థలాన్ని సూచించే మూలార్థాన్ని ఆధునిక గౌరవవాచక తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: ఎలీషా సమాచారానికి మూలం
  choice: వచనంలో ఉన్నట్లే ఎలీషా మాటలను తెలియజేస్తున్నాడని మాత్రమే పేర్కొనడం
  alternative: దేవుడు ఎలీషాకు ఆ మాటలను ప్రత్యక్షంగా వెల్లడిస్తున్నాడని స్పష్టంగా చేర్చడం
  rationale: ఈ వచనం ఎలీషా ఎలా తెలుసుకున్నాడో ప్రత్యక్షంగా చెప్పదు; అందువల్ల సందర్భం సూచించగల వివరణను అనువాదంలో చేర్చకుండా మూలంలోని మౌనాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజును ఉద్దేశించిన సంభాషణలో గౌరవ బహువచనం వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే రాజసభ సంభాషణకు తగిన గౌరవభావంతో రూపొందించబడింది.
