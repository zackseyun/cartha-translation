  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: te
  text: వారిలో ఒకడు ఒక దూలాన్ని నరుకుతుండగా, ఇనుము[a] నీళ్లలో పడిపోయింది. అప్పుడు అతడు కేకవేసి, “అయ్యో, నా యజమానీ! అది అరువు తెచ్చుకున్నదే!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘ఇనుము.’ సందర్భంలో ఇది పనిముట్టులోని ఇనుప భాగాన్ని, అంటే గొడ్డలి తలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: నరుకుతుండగా
  rationale: నפל హిఫీల్ రూపం అక్షరార్థంగా ‘పడేలా చేయడం’ అయినా, ఇక్కడ కలపను నరికి పడగొట్టే పనిని సూచిస్తుంది. సందర్భానుగుణంగా సహజమైన తెలుగు క్రియను వాడాం.
- source_word: הַקּוֹרָה
  choice: ఒక దూలాన్ని
  rationale: קוֹרָה అనేది నిర్మాణానికి ఉపయోగించే దూలం లేదా మాను. భవనం కోసం కలపను సిద్ధం చేస్తున్న సందర్భంలో ‘దూలం’ తగినది; హెబ్రీ నిర్దిష్ట ఉపపదాన్ని తెలుగులో సహజంగా అనిర్దిష్టంగా వ్యక్తం చేశాం.
- source_word: הַבַּרְזֶל
  choice: ఇనుము[a]
  rationale: మూలంలో అక్షరార్థంగా ‘ఇనుము’ ఉంది. సందర్భంలో అది గొడ్డలి ఇనుప తలను సూచించినా, మూలంలోని సంక్షిప్త రూపక ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: וַיִּצְעַק
  choice: కేకవేసి
  rationale: పోయిన అరువు పనిముట్టు గురించి కలిగిన ఆకస్మిక ఆందోళనను ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: אֲהָהּ
  choice: అయ్యో
  rationale: విచారం, దిగ్భ్రాంతి తెలిపే హెబ్రీ ఆశ్చర్యార్థక పదానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానం.
- source_word: אֲדֹנִי
  choice: నా యజమానీ
  rationale: ఎలీషాను తనకు పైవాడిగా గౌరవంగా సంబోధిస్తున్న శిష్యుని మాటను ప్రతిబింబిస్తుంది; దైవ సంబోధనగా తప్పుగా అర్థమయ్యే అవకాశాన్ని తగ్గిస్తుంది.
- source_word: שָׁאוּל
  choice: అరువు తెచ్చుకున్నదే
  rationale: ఈ సందర్భంలో שאל రూపం ఆ వస్తువు ఇతరుని దగ్గర నుంచి అరువుగా తీసుకున్నదని సూచిస్తుంది. చివరి ‘దే’ దాని నష్టం పట్ల వక్తకు ఉన్న ప్రత్యేక ఆందోళనను సహజంగా వ్యక్తం చేస్తుంది.
