  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథన గంభీరతను నిలిపే భాష వాడబడింది. ‘ఇనుము’ అనే మూలంలోని పరోక్ష ప్రయోగాన్ని పాదసూచికతో సంరక్షించాం.
