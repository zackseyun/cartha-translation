  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: te
  text: మేము నా కుమారుణ్ణి ఉడికించి, అతణ్ణి తిన్నాము.[a] మరుసటి రోజు నేను ఆమెతో, ‘నీ కుమారుణ్ణి ఇవ్వు; మనం అతణ్ణి తిందాం’[b] అని అన్నాను. కానీ ఆమె తన కుమారుణ్ణి దాచిపెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా కుమారుణ్ణి వండి అతణ్ణి తిన్నాము.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మనం అతణ్ణి తింటాము’; హీబ్రూ రూపాన్ని సాధారణ భవిష్యత్తుగా కూడా అర్థం చేసుకోవచ్చు. అయితే ‘నీ కుమారుణ్ణి ఇవ్వు’ అనే ఆజ్ఞ తరువాత సందర్భం ఉద్దేశం లేదా ప్రతిపాదన భావానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: ఉడికించి
  rationale: בשׁל ఇక్కడ ఆహారాన్ని ఉడికించడాన్ని, సందర్భానుసారంగా ప్రత్యేకంగా మరిగించి వండడాన్ని సూచిస్తుంది. ‘ఉడికించి’ అనేది సహజమైన ఆధునిక తెలుగు పదం; ‘వండుకొని’ కంటే మూలంలోని స్పష్టతను ఎక్కువగా నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుణ్ణి
  rationale: בן అనేది సాధారణంగా ‘పిల్లవాడు’ కాక నిర్దిష్టంగా ‘కుమారుడు’; మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయం ‘నా’ను స్పష్టం చేస్తుంది.
- source_word: וַנֹּאכְלֵהוּ
  choice: అతణ్ణి తిన్నాము
  rationale: אכל యొక్క సాధారణ అర్థం ‘తిను’. క్రియలోని బహువచన కర్తను, పురుష ఏకవచన కర్మ ప్రత్యయాన్ని తెలుగులో స్పష్టంగా ఉంచాం.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: నేను ఆమెతో ... అని అన్నాను
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: בַּיּוֹם הָאַחֵר
  choice: మరుసటి రోజు
  rationale: ఈ సందర్భంలో ఇది ముందటి సంఘటన జరిగిన దినానికి తరువాతి రోజును సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: תְּנִי
  choice: ఇవ్వు
  rationale: נתן ఆజ్ఞార్థక రూపానికి నేరమైన సమానార్థకం; ‘అప్పగించు’ అనడం కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: בְּנֵךְ
  choice: నీ కుమారుణ్ణి
  rationale: בן తో కూడిన ద్వితీయ పురుష స్త్రీలింగ ఏకవచన స్వామ్య ప్రత్యయాన్ని ఖచ్చితంగా ప్రతిబింబిస్తుంది.
- source_word: וְנֹאכְלֶנּוּ
  choice: మనం అతణ్ణి తిందాం
  rationale: ఆజ్ఞ తరువాత వచ్చే సంయుక్త అసంపూర్ణ క్రియ ఉద్దేశం లేదా ప్రతిపాదిత తదుపరి చర్యను సూచించగలదు. తెలుగు ‘తిందాం’ ఆ భావాన్ని సహజంగా ఇస్తుంది; సాధారణ భవిష్యత్తు భావం కూడా పాదసూచికలో నిలుపబడింది.
- source_word: וַתַּחְבִּא
  choice: కానీ ... దాచిపెట్టింది
  rationale: వావ్ కథనాన్ని కొనసాగించినా, సందర్భంలో ఆ స్త్రీ కోరినదానికి విరుద్ధంగా ప్రవర్తించింది. ‘కానీ’ ఆ అంతర్లీన వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
- source_word: בְּנָהּ
  choice: తన కుమారుణ్ణి
  rationale: בן తో కూడిన తృతీయ పురుష స్త్రీలింగ ఏకవచన స్వామ్యాన్ని తెలుగులో కర్తను తిరిగి సూచించే సహజమైన ‘తన’ ద్వారా వ్యక్తం చేస్తుంది.
