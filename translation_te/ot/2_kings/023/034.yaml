id: 2KI.23.34
reference: 2 Kings 23:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: te
  text: ఫరో నెకో యోషీయా కుమారుడైన ఎల్యాకీమును అతని తండ్రియైన యోషీయా స్థానంలో రాజుగా నియమించి, అతని పేరును యెహోయాకీముగా మార్చాడు. అయితే అతడు యెహోయాహాజును తీసుకున్నాడు; యెహోయాహాజు ఐగుప్తుకు వచ్చి[a] అక్కడ చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఐగుప్తుకు వెళ్లి.’ హీబ్రూలో అక్షరార్థంగా ‘ఐగుప్తుకు వచ్చి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: రాజుగా నియమించి
  rationale: מלך హిఫిల్ రూపం ఇక్కడ ఫరో ఎల్యాకీమును రాజుగా స్థాపించిన కారణార్థక భావాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘రాజుగా నియమించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תַּחַת
  choice: స్థానంలో
  rationale: రాజ్య వారసత్వ సందర్భంలో ఇది ఒకరి స్థానాన్ని మరొకరు తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: אָבִיו
  choice: అతని తండ్రి
  rationale: సర్వనామ ప్రత్యయం ఎల్యాకీమును సూచిస్తుంది; యోషీయా అతని తండ్రి అని మూలపాఠంలోని స్పష్టతను నిలుపుతుంది.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: అతని పేరును ... మార్చాడు
  rationale: హీబ్రూ నుడికారం పేరును మార్చడాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం సహజమైనది.
- source_word: יְהוֹיָקִים
  choice: యెహోయాకీము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: అయితే అతడు యెహోయాహాజును పట్టుకొని వెళ్లాడు
  rationale: לקח సాధారణంగా ‘తీసుకొను’; ఈ సందర్భంలో చెరగా తీసుకెళ్లడం సూచ్యమవుతుంది. ‘పట్టుకొని వెళ్లాడు’ సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తూనే ‘బంధించాడు’ వంటి మరింత నిర్దిష్ట అర్థాన్ని మోపదు.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: యెహోయాహాజు ఐగుప్తుకు వచ్చి
  rationale: వ్యాకరణపరంగా కర్త యెహోయాహాజే; అపార్థం రాకుండా పేరును మళ్లీ పేర్కొన్నాం. בוא యొక్క మూల దిశాభావమైన ‘వచ్చాడు’ను ప్రధాన పాఠంలో నిలిపాం.
- source_word: וַיָּמָת שָׁם
  choice: అక్కడ చనిపోయాడు
  rationale: మూలంలోని సంక్షిప్త కథన ముగింపును సరళంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ వాక్యంలోని కర్త అస్పష్టత తెలుగులో తలెత్తకుండా యెహోయాహాజు పేరును చివరి ఉపవాక్యంలో పునరుక్తి చేశాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
