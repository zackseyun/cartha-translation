  naturalness: ‘ఆరాధనా వ్యభిచారులు,’ ‘వస్త్రపు ఆవరణలు’ అనే ప్రధాన పాఠంలోని పదప్రయోగాలు అర్థవంతమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. అయితే పాదటిప్పణి bలోని ‘వస్త్రపు కప్పులు’ సాధారణ తెలుగులో వస్త్రపు కప్పణాలకన్నా త్రాగే కప్పుల భావాన్ని కలిగించవచ్చు; దానిని సవరించడం అవసరం.
