source:
  edition: WLC
  text: וַ/יִּתֹּץ֙ אֶת בָּתֵּ֣י הַ/קְּדֵשִׁ֔ים אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁ֣ר הַ/נָּשִׁ֗ים אֹרְג֥וֹת שָׁ֛ם בָּתִּ֖ים לָ/אֲשֵׁרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: te
  text: అతడు యాహ్వే మందిరంలో ఉన్న ఆరాధనా వ్యభిచారుల[a] గృహాలను పడగొట్టాడు. అక్కడ స్త్రీలు అషేరా[c] కోసం వస్త్రపు ఆవరణలు[b] నేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదం పురుష బహువచనంలో ఉంది; నిషిద్ధ ఆరాధనా-సంబంధ లైంగిక ఆచారాల్లో పాల్గొన్న పురుషులను సూచిస్తుంది. అందువల్ల ‘పురుష ఆరాధనా వ్యభిచారులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వస్త్రపు వేలాడే తెరలు’ అని కూడా అనువదించవచ్చు; పదశః ‘గృహాలు.’ అషేరా ఆరాధనకు సంబంధించిన వస్త్రపు కప్పణాలు లేదా గుడారంలాంటి ఆవరణలు ఉద్దేశించబడి ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘అషేరా’ అనే పదం అషేరా దేవతను గానీ, ఆమెకు సంబంధించిన ఆరాధనా వస్తువును—సాధారణంగా ‘అషేరా స్తంభం’ అని పిలిచేదాన్ని—గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: పడగొట్టాడు
  rationale: נתץ నిర్మాణాలను కూల్చడం లేదా ధ్వంసం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది; ‘పడగొట్టాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: ఆరాధనా వ్యభిచారుల గృహాలు
  rationale: בָּתֵּי అనే ‘గృహాలు’ భావాన్ని నిలుపుతూ, הַקְּדֵשִׁים ఇక్కడ నిషిద్ధ ఆరాధనా-సంబంధ లైంగిక ఆచారాల్లో పాల్గొన్నవారిని సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యాహ్వే మందిరంలో
  rationale: ‘మందిరం’ ఈ సందర్భంలో దేవాలయాన్ని సహజంగా తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: అక్కడ స్త్రీలు … నేసేవారు
  rationale: స్త్రీల బహువచనాన్ని, שם అనే స్థల సూచనను నిలుపుతుంది; participle తెలియజేసే కొనసాగుతున్న లేదా అలవాటైన పనికి ‘నేసేవారు’ సరిపోతుంది.
- source_word: בָּתִּים
  choice: వస్త్రపు ఆవరణలు
  rationale: పదశః ‘గృహాలు’ అయినా, నేయడం అనే సందర్భంలో అషేరాతో సంబంధమున్న వస్త్రపు కప్పులు, వేలాడే తెరలు లేదా గుడారంలాంటి ఆవరణలు ఉద్దేశించబడి ఉండవచ్చు. ప్రధాన పాఠంలో అపార్థం కలిగించే పదశః రూపానికి బదులు సందర్భోచితమైన విస్తృత పదాన్ని ఎంచుకుంది.
- source_word: לָאֲשֵׁרָה
  choice: అషేరా కోసం
  rationale: אֲשֵׁרָה దేవతను గానీ ఆమెకు సంబంధించిన ఆరాధనా వస్తువును గానీ సూచించవచ్చు; ‘అషేరా’ ఈ సందిగ్ధతను నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా ఆధునికంగా లిప్యంతరీకరిస్తుంది.
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా దేవత / అషేరా స్తంభం
  rationale: హెబ్రీ పదం దేవతను లేదా ఆమెకు సంబంధించిన ఆరాధనా వస్తువును సూచించగలదు. ప్రధాన పాఠం ఈ నిజమైన సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘ఆరాధనా వ్యభిచారులు’ సాధారణ పాఠకునికి అర్థమయ్యేలా సందర్భాన్ని తెలియజేస్తుంది; ‘అషేరా’ మరియు వస్త్రాల స్వరూపంలోని మూలపాఠ సందిగ్ధతలు పాదటిప్పణుల్లో సంరక్షించబడ్డాయి.
