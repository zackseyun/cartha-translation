  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: te
  text: యెహోయాకీము వెండిని, బంగారాన్ని ఫరోకు ఇచ్చాడు. అయితే, ఫరో ఆజ్ఞ ప్రకారం[b] వెండిని ఇవ్వడానికి అతడు దేశంపై పన్ను విధించాడు.[a] ఫరో నెకోకు[d] ఇవ్వడానికి దేశ ప్రజల నుండి ప్రతి వ్యక్తిపై విధించిన మదింపు ప్రకారం[c] వెండిని, బంగారాన్ని బలవంతంగా వసూలు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశాన్ని మదింపు చేశాడు,’ అంటే చెల్లించవలసిన మొత్తాన్ని దేశంపై విధించాడు. హీబ్రూ క్రియకు ఆర్థిక మదింపు లేదా పన్ను విధించే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఫరో నోటి ప్రకారం’; అంటే ఫరో ఆజ్ఞ ప్రకారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ప్రతి వ్యక్తికి నిర్ణయించిన మదింపు ప్రకారం’; మరింత వ్యాఖ్యాత్మకంగా, ‘ఒక్కొక్కరి ఆర్థిక స్థోమత ప్రకారం.’
    reason: lexical_alternative
  - marker: d
    text: ‘నెకో’ అనే పేరు కొన్ని అనువాదాల్లో ‘నెఖో’ అని కూడా వ్రాయబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: దేశంపై పన్ను విధించాడు
  rationale: హిఫిల్ రూపంలో ‘దేశం’ కర్మగా ఉండి, చెల్లింపు సందర్భంలో రావడం వల్ల దేశంపై ఆర్థిక మదింపు లేదా పన్ను విధించడాన్ని సూచిస్తుంది. ‘పన్ను విధించాడు’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ రాజకీయ-ప్రాదేశిక భావం ప్రధానమైనందున ‘దేశం’ సహజమైన తెలుగు సమానార్థకం. అదే వాక్యంలోని עַם הָאָרֶץ ను ‘దేశ ప్రజలు’గా అనుసంధానిస్తుంది.
- source_word: עַל־פִּי פַרְעֹה
  choice: ఫరో ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘ఫరో నోటి ప్రకారం’ అయిన ఈ హీబ్రూ నుడికారం అధికారిక ఆజ్ఞను సూచిస్తుంది. ‘ఆజ్ఞ ప్రకారం’ తెలుగులో భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: ఒక్కొక్కరి అంచనా ప్రకారం
  rationale: వ్యక్తివారీగా నిర్ణయించిన మదింపు లేదా రేటును సూచిస్తుంది. ‘ఆర్థిక స్థోమత ప్రకారం’ అనడం సాధ్యమే అయినా, అది మూలపాఠం కంటే ఎక్కువ వ్యాఖ్యాత్మకం.
- source_word: נָגַשׂ
  choice: బలవంతంగా వసూలు చేశాడు
  rationale: ఈ క్రియకు చెల్లింపును ఒత్తిడి చేసి రాబట్టే భావఛాయ ఉంది. సాధారణ ‘వసూలు చేశాడు’ కంటే ‘బలవంతంగా’ చేర్చడం ఆ బలవంతపు భావాన్ని నిలుపుతుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: సామాజిక-రాజకీయ వర్గాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, ఇక్కడ వర్గాన్ని అతిగా నిర్ధారించకుండా హీబ్రూ పదబంధాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: פַרְעֹה נְכֹה
  choice: ఫరో నెకో
  rationale: హీబ్రూ పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ. పరిచితమైన ప్రత్యామ్నాయ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: వెండిని, బంగారాన్ని
  rationale: మూలపాఠం విలువైన లోహాలను నేరుగా పేర్కొంటుంది. ‘డబ్బు’ అని మార్చకుండా ‘వెండి’ని ఉంచడం మూలంలోని స్పష్టమైన పదజాలం, సమాంతరతను కాపాడుతుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థం ‘ఇచ్చాడు.’ సందర్భంలో ఇది కప్పం చెల్లింపైనా, మూలానికి నేరుగా ఉండే రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘బలవంతంగా వసూలు చేశాడు’ అనే రూపం נָגַשׂ లోని ఒత్తిడి భావాన్ని తెలియజేస్తుంది. మూలంలోని ‘వెండి—బంగారం’ సమాంతరత, ‘దేశం—దేశ ప్రజలు’ పదసంబంధం నిలుపబడ్డాయి.
