  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: te
  text: అతడు స్తంభాలను ముక్కలుగా పగులగొట్టి, అషేరా పూజా చిహ్నాలను[a] నరికివేసి, అవి ఉన్న స్థలాలను మానవుల ఎముకలతో నింపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరా స్తంభాలను.’ אֲשֵׁרִים అనే హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించగలదు; ఆ పదం మాత్రమే వాటి ఖచ్చితమైన రూపాన్ని తెలియజేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: ముక్కలుగా పగులగొట్టి
  rationale: ఈ క్రియ బలంగా పగులగొట్టి ముక్కలు చేయడాన్ని సూచిస్తుంది; తెలుగు పాఠకులకు చర్య తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּצֵּבוֹת
  choice: స్తంభాలను
  rationale: మַצֵּבָה ఇక్కడ ఆరాధనకు సంబంధించిన నిలువురాళ్లు లేదా స్తంభాలను సూచిస్తుంది. ‘స్తంభాలు’ సంక్షిప్తంగా, సహజంగా ఉంది; ‘పవిత్ర’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: וַיִּכְרֹת
  choice: నరికివేసి
  rationale: చెక్కతో లేదా చెట్టుతో సంబంధమున్న ఆరాధనా చిహ్నాల విషయంలో כרת క్రియకు ‘నరికివేయు’ సహజమైన సమానార్థకం.
- source_word: הָאֲשֵׁרִים
  choice: అషేరా పూజా చిహ్నాలను
  rationale: ఈ బహువచన పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది; అవి స్తంభాలా, చెట్లా, మరొక రూపమా అన్నది పదం మాత్రమే నిర్ణయించదు. ‘పూజా చిహ్నాలు’ ఈ అనిశ్చితిని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా చేస్తుంది.
- source_word: וַיְמַלֵּא
  choice: నింపాడు
  rationale: మూల క్రియ యొక్క ప్రాథమిక అర్థమైన ‘నింపడం’ను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: מְקוֹמָם
  choice: అవి ఉన్న స్థలాలను
  rationale: బహువచన ప్రత్యయం ముందున్న ధ్వంసమైన ఆరాధనా వస్తువులను సూచిస్తుంది. తెలుగులో ‘వాటి స్థలాలు’ కంటే ‘అవి ఉన్న స్థలాలు’ సంబంధాన్ని మరింత సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַצְמוֹת אָדָם
  choice: మానవుల ఎముకలతో
  rationale: אָדָם ఇక్కడ పురుషుడిని ప్రత్యేకంగా కాక మానవులను సాధారణంగా సూచిస్తుంది; అందువల్ల లింగనిరపేక్షమైన ఈ పదబంధం సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: אָדָם పదం యొక్క సందర్భోచిత అర్థం
  choice: మానవుల ఎముకలు
  alternative: మనిషి ఎముకలు
  rationale: ఇక్కడ אָדָם ఒక వయోజన పురుషుణ్ణి ప్రత్యేకంగా సూచించదు; మానవ ఎముకలను సాధారణంగా సూచిస్తుంది. కాబట్టి సందర్భంలోని సామాన్యార్థాన్ని నిలుపుకోవడానికి ‘మానవుల’ అని అనువదించబడింది.
- issue: אֲשֵׁרִים రూపాన్ని నిర్దిష్టంగా గుర్తించడం
  choice: అషేరా పూజా చిహ్నాలు
  alternative: అషేరా స్తంభాలు
  rationale: హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించినా వాటి ఖచ్చితమైన భౌతిక రూపాన్ని ఒక్కదానినే నిర్బంధంగా తెలియజేయదు. అందువల్ల ప్రధాన పాఠంలో విస్తృత పదాన్ని, పాదసూచికలో సాధ్యమైన నిర్దిష్ట రూపాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. వరుస క్రియలను ‘పగులగొట్టి—నరికివేసి—నింపాడు’గా అమర్చి హీబ్రూ కథన ప్రవాహాన్ని నిలిపాం. పాదసూచిక గుర్తును సంబంధిత ‘అషేరా పూజా చిహ్నాలు’ పదబంధానికే జతచేశాం.
