source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: te
  text: అప్పుడు యోషీయా తిరిగి, కొండ మీద ఉన్న సమాధులను[a] చూశాడు. అతడు మనుషులను పంపించి, ఆ సమాధుల నుండి ఎముకలను తీసుకురప్పించి, వాటిని బలిపీఠం మీద కాల్చి, దాన్ని అపవిత్రం చేశాడు. ఈ సంగతులను ప్రకటించిన దేవుని మనిషి ప్రకటించిన యాహ్వే వాక్యం ప్రకారం అతడు ఇలా చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమాధి స్థలాలను.’ హీబ్రూ పదం నిర్మించిన సమాధులనే కాక, సాధారణంగా పాతిపెట్టే స్థలాలను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రకటించిన’కు ‘పిలిచిన’ లేదా ‘బిగ్గరగా ప్రకటించిన’ అనే అర్థం కూడా ఉండవచ్చు. హీబ్రూ పాఠంలో ఈ క్రియ రెండుసార్లు వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: వెనక్కి తిరిగి
  rationale: פנה శారీరకంగా తిరగడాన్ని సూచిస్తుంది; తరువాత సమాధులను చూడటం అనే కథన క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַקְּבָרִים
  choice: సమాధులు
  rationale: קבר సమాధి, సమాధి స్థలం అనే రెండింటినీ సూచించగలదు; ఆధునిక ప్రామాణిక తెలుగులో ‘సమాధులు’ సహజమైన విస్తృత పదం.
- source_word: בָּהָר
  choice: కొండ మీద
  rationale: הר సందర్భానుసారం పర్వతం లేదా కొండను సూచించగలదు; ఇక్కడ భూభాగ సూచనగా ‘కొండ’ సహజంగా ఉంది.
- source_word: הָעֲצָמוֹת
  choice: ఎముకలు
  rationale: మూలంలోని నిర్దిష్టమైన శారీరక పదాన్ని అలాగే నిలుపుతుంది; బలిపీఠం అపవిత్రం చేయబడిన విధానానికి ఇది ముఖ్యమైనది.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: వాటిని బలిపీఠం మీద కాల్చి
  rationale: ఎముకలే ప్రత్యక్ష కర్మగా ఉండటాన్ని, అవి బలిపీఠం మీద కాల్చబడటాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְטַמְּאֵהוּ
  choice: దాన్ని అపవిత్రం చేశాడు
  rationale: ప్రత్యయం సమీప పూర్వపదమైన బలిపీఠాన్ని సూచిస్తుంది; טמא యొక్క ఆచారసంబంధ అపవిత్రత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన దైవనామ రూపం; మూలంలోని వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయదు.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: మూలంలోని ప్రవక్తసంబంధ బిరుదును వ్యాఖ్యానాత్మకంగా ‘ప్రవక్త’గా మార్చకుండా నేరుగా అనువదిస్తుంది.
- source_word: קָרָא
  choice: ప్రకటించిన
  rationale: ఇక్కడ బహిరంగంగా, అధికారపూర్వకంగా పలికిన ప్రవచన ప్రకటన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు
  rationale: דברים ఇక్కడ కేవలం పదాలను మాత్రమే కాక ముందుగా చెప్పబడిన ఘటనలను కూడా సూచించగలదు; ‘సంగతులు’ ఆ విస్తృతతను నిలుపుతుంది.
theological_decisions:
- issue: యోషీయా చర్యకు పూర్వ ప్రవచనంతో ఉన్న నెరవేర్పు సంబంధం
  choice: ‘యెహోవా వాక్యం ప్రకారమే ఇది జరిగింది’ అని స్పష్టంగా చూపించడం
  alternative: ‘యెహోవా వాక్యం ప్రకారం’ అని క్రియావిశేషణ భాగంగా మాత్రమే ఉంచడం
  rationale: כדבר יהוה అనే నెరవేర్పు సూత్రం యోషీయా చేసిన పని ముందుగా ప్రకటించబడిన దైవవాక్యానికి అనుగుణంగా జరిగినదని తెలియజేస్తుంది; అదనపు సిద్ధాంత వివరణ లేకుండా ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: చివరి రెండు אשר ఉపవాక్యాల సంబంధం
  choice: దేవుని మనిషి యెహోవా వాక్యాన్ని ప్రకటించాడనీ, ఈ సంగతులను కూడా ప్రకటించాడనీ పునరుక్త నిర్మాణాన్ని నిలుపడం
  alternative: పునరుక్తిని తొలగించి ‘ఈ సంగతుల గురించి ప్రకటించిన దేవుని మనిషి ద్వారా పలికిన యెహోవా వాక్యం’ అని సాఫీ చేయడం
  rationale: హీబ్రూ పాఠంలో קרא రెండుసార్లు ఉండటం వల్ల ఏర్పడే గట్టి పునరుక్తిని పూర్తిగా తొలగిస్తే మూల నిర్మాణంలోని ఉద్దేశపూర్వక దృష్టి కోల్పోవచ్చు.
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: వ్యక్తినామ స్వభావాన్ని నిలుపుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు సులభంగా గుర్తుపడే సంప్రదాయ రూపాన్ని ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘తెప్పించి’ అనేది రాజు మనుషులను పంపి ఎముకలను తీసుకురావించిన కారణార్థక పరిస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. మూలంలోని చివరి పునరుక్తి కొంత అసహజంగా అనిపించినా, పాఠ్య ఉద్వేగం మరియు నిర్మాణాన్ని కాపాడేందుకు నిలుపబడింది.
