revisions:
- from: అప్పుడు యోషీయా వెనక్కి తిరిగి, కొండ మీద ఉన్న సమాధులను[a] చూశాడు. అతడు మనుషులను పంపి, ఆ సమాధులలోని ఎముకలను తెప్పించి, వాటిని బలిపీఠం మీద కాల్చి, దాన్ని అపవిత్రం చేశాడు. ఈ సంగతులను ప్రకటించిన దేవుని మనిషి ప్రకటించిన యెహోవా వాక్యం ప్రకారమే ఇది జరిగింది.[b]
  to: అప్పుడు యోషీయా తిరిగి, కొండ మీద ఉన్న సమాధులను[a] చూశాడు. అతడు మనుషులను పంపించి, ఆ సమాధుల నుండి ఎముకలను తీసుకురప్పించి, వాటిని బలిపీఠం మీద కాల్చి, దాన్ని అపవిత్రం చేశాడు. ఈ సంగతులను ప్రకటించిన దేవుని మనిషి ప్రకటించిన యాహ్వే వాక్యం ప్రకారం అతడు ఇలా చేశాడు.[b]
  rationale: The revision removes the unsupported directional nuance ‘back,’ aligns the rendering of the Tetragrammaton with the POB audit trail, and attaches the fulfillment formula directly to Josiah’s actions. It retains the repeated proclamation language and both lexical footnote anchors.
