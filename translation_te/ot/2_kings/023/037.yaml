id: 2KI.23.37
reference: 2 Kings 23:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: te
  text: అతడు తన పితరులు చేసినవాటన్నిటినీ అనుసరించి యాహ్వే దృష్టిలో చెడు చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో వాక్యక్రమం, సందర్భం కథన కొనసాగింపును సహజంగా తెలియజేస్తాయి; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: הָרַע
  choice: చెడైనది
  rationale: עשה הרע అనే మూలభాషా ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘చెడైనది చేశాడు’ అని వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: ‘కళ్లలో’ అనే యథాతథ రూపం కంటే, ఎవరి నిర్ణయ ప్రమాణం ప్రకారం అనే భావాన్ని ‘దృష్టిలో’ సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేసినదంతా అనుసరించి
  rationale: మునుపటి వారి ప్రవర్తనకు అనుగుణంగా అతడు ప్రవర్తించాడనే పోలిక, అనుసరణ భావాలను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָשׂוּ
  choice: చేసిన
  rationale: తెలుగు సంబంధార్థక క్రియారూపం పితరుల చర్య ముందే జరిగిందని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: אֲבֹתָיו
  choice: తన పితరులు
  rationale: హీబ్రూ పదంలోని ‘తండ్రులు’ అనే మూలరూపానికి సమీపంగా ఉండి, రాజవంశ సందర్భంలో పూర్వికులు అనే విస్తృత భావాన్నీ మోయగల గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: అతని ‘పితరులు’ ఎవరనే పరిధి
  choice: పితరులు అని ప్రధాన పాఠంలో ఉంచి, పూర్వికులు అనే భావాన్ని పాదసూచికలో తెలియజేయడం
  alternative: పూర్వికులు
  rationale: రాజుల మూల్యాంకన సూత్రంలో ఈ పదం తక్షణ తండ్రులను మాత్రమే కాక పూర్వికులను లేదా పూర్వ రాజులను సూచించవచ్చు. ప్రధాన పాఠం మూలరూపాన్ని నిలుపుతూ, పాదసూచిక భావపరిధిని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, అనుసరణ భావాన్ని ముందుగా ఉంచి తెలుగు వాక్యాన్ని సహజంగా నిర్మించాం.
