- from: అతని సేవకులు చనిపోయిన అతన్ని మెగిద్దో నుండి రథంలో తీసుకొచ్చి[a] యెరూషలేముకు చేర్చారు; అతని సమాధిలో అతన్ని పాతిపెట్టారు. ఆ తర్వాత దేశ ప్రజలు యోషీయా కుమారుడైన యెహోయాహాజును తీసుకొని, అతనికి అభిషేకం చేసి, అతని తండ్రి స్థానంలో రాజుగా నియమించారు.[b]
