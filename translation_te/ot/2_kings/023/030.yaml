source:
  edition: WLC
  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: te
  text: అతని సేవకులు చనిపోయిన అతన్ని మెగిద్దో నుండి తరలించి[a] యెరూషలేముకు తీసుకువచ్చారు; అతన్ని అతని సమాధిలో పాతిపెట్టారు. ఆ తర్వాత దేశ ప్రజలు[b] యోషీయా కుమారుడైన యెహోయాహాజును తీసుకొని, అతనికి అభిషేకం చేసి, అతని తండ్రి స్థానంలో రాజుగా నియమించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతన్ని ఎక్కించారు” లేదా “ప్రయాణింపజేశారు”; ఇక్కడ యోషీయా మృతదేహాన్ని తరలించడాన్ని సూచిస్తుంది. మూలపాఠం వాహనం ఏమిటో స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: “దేశ ప్రజలు” అనేది రాజకీయంగా సమిష్టిగా చర్య తీసుకున్న స్థానిక ప్రజలను సూచించగల హీబ్రూ వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: రథంలో తీసుకొచ్చి
  rationale: హిఫీల్ రూపం అక్షరార్థంగా ‘ఎక్కించి ప్రయాణింపజేయడం’ అని సూచిస్తుంది. మృతదేహాన్ని మెగిద్దో నుండి తరలించిన సందర్భంలో, వాహనం/రథంలో తీసుకురావడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; నిర్దిష్ట వాహనం మూలపాఠంలో స్పష్టంగా లేకపోవడం వల్ల ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసభ సేవకులు లేదా అధికారులు అనే విస్తృత అర్థం ఉండవచ్చు. మూలపదానికి సమీపంగా ఉండేందుకు ‘సేవకులు’ ఎంచుకున్నాం.
- source_word: מֵת
  choice: చనిపోయిన అతన్ని
  rationale: తరలిస్తున్నప్పుడు యోషీయా మృతుడై ఉన్నాడనే మూలపాఠంలోని స్పష్టమైన స్థితిని నిలుపుతుంది.
- source_word: מִמְּגִדּוֹ
  choice: మెగిద్దో నుండి
  rationale: ప్రయాణ ప్రారంభస్థలాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: యెరూషలేముకు చేర్చారు
  rationale: గమ్యస్థానానికి తీసుకురావడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּקְבֻרָתוֹ
  choice: అతని సమాధిలో
  rationale: రాజుకు చెందిన సమాధి లేదా పాతిపెట్టే స్థలాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: ఇది రాజకీయంగా చర్య తీసుకున్న స్థానిక ప్రజాసమూహాన్ని సూచించే స్థిర హీబ్రూ వ్యక్తీకరణ. ‘సామాన్య ప్రజలు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: లָקַח అనే క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, రాజ్యస్థాపన కోసం యెహోయాహాజును ముందుకు తీసుకురావడాన్ని సూచిస్తుంది.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు శైలికి తగిన విధంగా లిప్యంతరీకరించింది.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: యోషీయా కుమారుడైన
  rationale: వంశ సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: అతనికి అభిషేకం చేసి
  rationale: రాజ్యారోహణ సందర్భంలోని ఆచారపూర్వక అభిషేకాన్ని సూచించే משׁח క్రియను సాధారణ నియామకంగా తగ్గించకుండా నిలుపుతుంది.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: అతని తండ్రి స్థానంలో రాజుగా నియమించారు
  rationale: హిఫీల్ క్రియలోని ‘రాజుగా చేయడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాజాభిషేక భాష
  choice: అతనికి అభిషేకం చేసి
  alternative: అతన్ని నియమించి
  rationale: మూల హీబ్రూ రాజ్యారోహణలో నూనెతో అభిషేకించే నిర్దిష్ట ఆచారాన్ని తెలిపే משׁח క్రియను వాడుతుంది. అందువల్ల దానిని సాధారణ నియామకంగా మార్చలేదు.
- issue: దేశ ప్రజల రాజకీయ పాత్ర
  choice: దేశ ప్రజలు
  alternative: సామాన్య ప్రజలు
  rationale: עַם הָאָרֶץ అనే పదబంధం కేవలం దిగువ సామాజిక వర్గాన్ని మాత్రమే సూచించక, రాజకీయంగా సమిష్టిగా వ్యవహరించిన స్థానిక ప్రజలను సూచించవచ్చు; ఆ ఉద్దేశపూర్వక విస్తృతతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే రాజవృత్తాంతానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని వరుస చర్యలు, రాజాభిషేక పదజాలం, ‘దేశ ప్రజలు’ అనే రాజకీయంగా తెరవబడిన వ్యక్తీకరణ నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
