source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: te
  text: అక్కడ ఉన్న ఉన్నత స్థలాల యాజకులందరినీ బలిపీఠాల మీద వధించాడు[a]. వాటిమీద మనుషుల ఎముకలను కాల్చాడు. తరువాత అతడు యెరూషలేముకు తిరిగి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలిగా వధించాడు.” హీబ్రూ క్రియకు బలి సంబంధిత భావం ఉండవచ్చు; ఈ సందర్భంలో అది అక్రమ ఆరాధనను నిర్మూలించే క్రమంలో జరిగిన హింసాత్మక వధను ప్రధానంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: వధించాడు
  rationale: זבח అనే క్రియకు ‘బలిగా అర్పించు/బలిగా వధించు’ అనే ఆరాధనాపరమైన భావంతో పాటు ‘వధించు’ అనే భావమూ ఉంది. ఇక్కడ అక్రమ ఆరాధనా స్థలాల యాజకులను హింసాత్మకంగా చంపడం ప్రధానంగా కనిపిస్తున్నందున ‘వధించాడు’ సహజమైనది; సాధ్యమైన బలి సంబంధిత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: ఉన్నత స్థలాల యాజకులు
  rationale: రాజుల గ్రంథాల్లో בָּמוֹת స్థానిక ఆరాధనా స్థలాలకు వాడే స్థిరమైన పదం. ‘ఉన్నత స్థలాలు’ మూలపదపు చారిత్రక-మతపరమైన ప్రత్యేకతను నిలుపుతుంది.
- source_word: אֲשֶׁר שָׁם
  choice: అక్కడ ఉన్న
  rationale: ఆ స్థలాల్లో ఉన్న యాజకులను గుర్తించే స్థానార్థక సంబంధ వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: బలిపీఠాల మీద
  rationale: עַל యొక్క సాధారణ స్థానార్థాన్ని నేరుగా నిలుపుతుంది; తరువాత ఎముకలను ‘వాటిమీద’ కాల్చాడనే వాక్యంతో అనుసంధానం స్పష్టంగా ఉంటుంది.
- source_word: עַצְמוֹת אָדָם
  choice: మనుషుల ఎముకలు
  rationale: אָדָם ఇక్కడ పురుషుడిని మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. ‘మనుషుల ఎముకలు’ ఆధునిక తెలుగులో సహజంగా, కచ్చితంగా ఉంటుంది.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: తరువాత అతడు యెరూషలేముకు తిరిగి వచ్చాడు
  rationale: కథన క్రమాన్ని ‘తరువాత’ సహజంగా తెలియజేస్తుంది; గమ్యస్థానాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యాజకుల హత్యను వివరించే וַיִּזְבַּח క్రియలో ఉండగల బలి సంబంధిత భావం
  choice: ప్రధాన పాఠంలో ‘వధించాడు’
  alternative: ‘బలిగా వధించాడు’ లేదా ‘బలిగా అర్పించాడు’
  rationale: ‘బలిగా అర్పించాడు’ అనడం ఇది యెహోవాకు అంగీకారమైన బలి అని మూలపాఠం చెప్పనిదాన్ని సూచించవచ్చు. ‘వధించాడు’ హింసాత్మక చర్యను స్పష్టంగా తెలియజేస్తుంది; అయితే క్రియలోని ఆరాధనాపరమైన సాధ్యార్థాన్ని తొలగించకుండా పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడాం. ‘ఉన్నత స్థలాలు,’ ‘యాజకులు,’ ‘బలిపీఠాలు’ వంటి చారిత్రక-మతపరమైన పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
