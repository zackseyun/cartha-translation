  terminology: ‘రాజు,’ ‘పెద్దలు,’ ‘యూదా,’ ‘యెరూషలేము’ అనే పదాలు సందర్భానుకూలంగా, స్థిరంగా ఉన్నాయి. పాదసూచిక మూలంలో లేని కర్మను ప్రధాన పాఠంలో చేర్చకుండా, సందర్భసాధ్యమైన ‘రమ్మని’ అనే వివరణను ప్రత్యామ్నాయంగా మాత్రమే ఇస్తుంది.
