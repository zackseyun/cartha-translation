translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘పెద్దలు’ అనే పదం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, అధికారిక నాయకుల భావాన్నీ నిలుపుతుంది. మూలంలోని సంక్షిప్తతను ప్రధాన పాఠంలో ఉంచి, సందర్భానుసారమైన స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
