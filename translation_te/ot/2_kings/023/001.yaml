source:
  edition: WLC
  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יַּאַסְפ֣וּ אֵלָ֔י/ו כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: te
  text: అప్పుడు రాజు కబురు పంపించాడు[a]; యూదా, యెరూషలేముల పెద్దలందరూ అతని దగ్గరికి సమావేశమయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: “అప్పుడు రాజు యూదా, యెరూషలేముల పెద్దలందరినీ రమ్మని కబురు పంపించాడు; వారు అతని దగ్గరికి సమావేశమయ్యారు.”'
    reason: שׁלח అనే క్రియకు కర్మ మూలపాఠంలో స్పష్టంగా లేకపోయినా, సందర్భం రాజు పెద్దలను పిలిపించాడనే భావానికి వీలు ఇస్తుంది.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపించాడు
  rationale: שׁלח అనే క్రియకు ఇక్కడ కర్మ స్పష్టంగా చెప్పబడలేదు; సందర్భంలో ఇది దూతలను పంపడం లేదా పిలుపు పంపడం అనే భావాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ఆ భావాన్ని ‘కబురు పంపించాడు’ అని వ్యక్తం చేసి, ఎవరిని పంపాడో అనవసరంగా చేర్చలేదు.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకాన్ని దాని బిరుదుతోనే అనువదించాం. సందర్భంలో అతడు యోషీయా అయినప్పటికీ, మూలపాఠంలో ఉన్న ‘రాజు’ అనే పదాన్నే నిలిపాం.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: అతని దగ్గరికి సమావేశమయ్యారు
  rationale: మూలంలోని సమకూడడం మరియు రాజు వద్దకు కదలివెళ్లడం అనే రెండు భావాలనూ సహజమైన తెలుగులో అందిస్తుంది. హెబ్రీ రూపం సందర్భంలో అనిర్దిష్ట కార్యనిర్వాహకులతో ‘వారిని సమకూర్చారు’ అనే భావానికీ వీలు ఇస్తుంది; తెలుగులో పెద్దలనే వ్యాకరణ కర్తలుగా చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָּל זִקְנֵי
  choice: పెద్దలందరూ
  rationale: כָּל యొక్క సమగ్రతను ‘అందరూ’తో తెలిపాం. זִקְנֵי ఇక్కడ కేవలం వృద్ధులను కాక, గుర్తింపు పొందిన సామాజిక లేదా పాలనా పెద్దలను సూచిస్తుంది.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: యూదా, యెరూషలేముల
  rationale: దేశం/ప్రాంతం మరియు రాజధాని నగరం రెండింటికి చెందిన పెద్దలను సూచించేలా ప్రామాణిక తెలుగు రూపాలను ఉపయోగించాం.
