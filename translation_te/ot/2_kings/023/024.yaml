revisions:
- from: అంతేకాక, యూదా దేశంలోనూ యెరూషలేములోనూ కనిపించిన మృతాత్మలను సంప్రదించేవారిని, ఆత్మలతో మాట్లాడేవారిని, గృహదేవతా విగ్రహాలను, ఇతర విగ్రహాలను, అసహ్యమైన వాటన్నిటినీ యోషీయా తొలగించాడు. యహ్వే మందిరంలో యాజకుడైన హిల్కీయా కనుగొన్న గ్రంథంలో[a] రాసి ఉన్న ధర్మశాస్త్ర వాక్యాలను అమలు చేయడానికి అతడు ఇలా చేశాడు.
  to: అంతేకాక, యూదా దేశంలోను యెరూషలేములోను కనిపించిన మృతాత్మలను సంప్రదించేవారిని, ఆత్మలతో మాట్లాడేవారిని, గృహదేవతా విగ్రహాలను, విగ్రహాలను, అసహ్యమైన వాటన్నిటినీ యోషీయా తొలగించాడు; యహ్వే మందిరంలో యాజకుడైన హిల్కీయా కనుగొన్న గ్రంథంలో[a] రాసి ఉన్న ధర్మశాస్త్ర వాక్యాలను అమలు చేయడానికి అతడు అలా చేశాడు.
  rationale: The revision removes the unsupported ‘ఇతర,’ retains the source's deliberately broad terms for the disputed practitioner categories, and links Josiah's removal directly to its stated purpose. The footnote preserves the scroll alternative with more idiomatic Telugu.
