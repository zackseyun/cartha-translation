source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: te
  text: అంతేకాక, యూదా దేశంలోను యెరూషలేములోను కనిపించిన మృతాత్మలను సంప్రదించేవారిని, ఆత్మలతో మాట్లాడేవారిని, గృహదేవతా విగ్రహాలను, విగ్రహాలను, అసహ్యమైన వాటన్నిటినీ యోషీయా తొలగించాడు; యహ్వే మందిరంలో యాజకుడైన హిల్కీయా కనుగొన్న గ్రంథంలో[a] రాసి ఉన్న ధర్మశాస్త్ర వాక్యాలను అమలు చేయడానికి అతడు అలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గ్రంథచుట్టపై వ్రాయబడినవి.” హెబ్రీ పదం చుట్ట రూపంలోని లిఖిత పత్రాన్ని కూడా సూచించగలదు.
    reason: סֵפֶר అనే పదం ‘గ్రంథం’తో పాటు చుట్ట రూపంలోని లిఖిత పత్రాన్నీ సూచించగలదనే రూపభేదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందటి సంస్కరణ చర్యలకు దీనిని అదనంగా కలిపే హెబ్రీ సంధాన పదం యొక్క భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֹבוֹת
  choice: మృతాత్మలను సంప్రదించేవారు
  rationale: ఈ సందర్భంలో మృతులతో సంబంధం పెట్టుకుని వారిని సంప్రదించే క్షుద్రాచారులను సూచిస్తుంది; కేవలం ఆత్మలనే సూచిస్తున్నట్లు కాకుండా సందర్భానుసారంగా వ్యక్తులను సూచించేలా అనువదించబడింది.
- source_word: הַיִּדְּעֹנִים
  choice: ఆత్మలతో మాట్లాడేవారు
  rationale: אֹבוֹתతో జతగా వచ్చే మరొక రకమైన క్షుద్రాచారులను ఆధునిక పాఠకులకు అర్థమయ్యేలా చూపుతుంది; రెండు పదాల మధ్య ఖచ్చితమైన భేదం స్పష్టంగా లేనందున అతిగా నిర్దిష్టం చేయలేదు.
- source_word: הַתְּרָפִים
  choice: గృహదేవతా విగ్రహాలు
  rationale: ఇంటింటా ఆరాధన లేదా దైవసూచన కోసం ఉంచుకునే తెరాఫీమ్ అనే పూజావస్తువుల స్వభావాన్ని తెలియజేస్తుంది.
- source_word: הַגִּלֻּלִים
  choice: ఇతర విగ్రహాలు
  rationale: విగ్రహాలను అవహేళనగా సూచించే హెబ్రీ పదం. తెలుగులో అసహజమైన మలసంబంధ రూపకాన్ని దిగుమతి చేయకుండా స్పష్టమైన సాధారణ పదాన్ని వాడి, తెరాఫీమ్‌తో జాబితాలోని భేదాన్ని చూపేందుకు ‘ఇతర’ చేర్చబడింది.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: అసహ్యమైన వాటన్నిటినీ
  rationale: ఆచారపరంగానూ మతపరంగానూ హేయమైన వస్తువులు లేదా ఆచారాలు అన్న విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: נִרְאוּ
  choice: కనిపించిన
  rationale: నిఫాల్ క్రియారూపంలోని ‘కనిపించాయి/కనిపించేవి’ అనే భావాన్ని సన్నిహితంగా నిలుపుతుంది.
- source_word: בִּעֵר
  choice: తొలగించాడు
  rationale: కాల్చివేయడం లేదా పూర్తిగా నిర్మూలించడం అనే భావాలు సాధ్యమైనప్పటికీ, జాబితాలో వ్యక్తులూ వస్తువులూ రెండూ ఉన్నందున తొలగించడమనే విస్తృత పదం సరిపోతుంది.
- source_word: לְמַעַן הָקִים
  choice: అమలు చేయడానికి
  rationale: ధర్మశాస్త్ర వాక్యాలను నిలబెట్టడం, ఆచరణలో పెట్టడం అనే ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: ధర్మశాస్త్ర వాక్యాలు
  rationale: కనుగొనబడిన గ్రంథంలోని నిబంధనాత్మక ఉపదేశం మరియు ఆజ్ఞలను సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: గ్రంథంలో రాసి ఉన్న
  rationale: ఆధునిక తెలుగులో సహజంగా ఉండే రూపం; סֵפֶר గ్రంథపు చుట్టను కూడా సూచించగలదనే భౌతిక రూపభేదాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: అక్షరార్థంగా ‘యహ్వే గృహం’; సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: לְמַעַן הָקִים లో ధర్మశాస్త్ర వాక్యాలను ‘స్థాపించడం’ అనే భావం
  choice: అమలు చేయడానికి
  alternative: నిలబెట్టడానికి
  rationale: ఇక్కడ ప్రవచన నెరవేర్పు కంటే ధర్మశాస్త్ర ఆజ్ఞలను కార్యరూపంలో పెట్టడమే సందర్భార్థం; అందువల్ల ‘అమలు చేయడం’ ఎటువంటి అదనపు సిద్ధాంతార్థాన్ని మోపకుండా ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. క్షుద్రాచారులకు సంబంధించిన రెండు హెబ్రీ పదాల ఖచ్చిత భేదం అనిశ్చితమైనందున సులభంగా అర్థమయ్యే, పరస్పరం సమీపమైన పదబంధాలు ఎంచుకోబడ్డాయి. పొడవైన హెబ్రీ వాక్యాన్ని తెలుగు పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, కారణ–ఉద్దేశ సంబంధం యథాతథంగా నిలుపబడింది.
