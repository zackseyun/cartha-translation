source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: te
  text: యూదా రాజులు యూదా పట్టణాల్లో, యెరూషలేము చుట్టుపక్కల ఉన్న ఉన్నత స్థలాల్లో ధూపం వేయడానికి నియమించిన అన్యారాధన యాజకులను[a] అతడు తొలగించాడు. అలాగే బయలుకు, సూర్యునికి, చంద్రునికి, నక్షత్రరాశులకు[b], ఆకాశ సైన్యమంతటికీ[c] ధూపం వేసేవారిని కూడా తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అక్రమ ఆరాధనా యాజకులను.’ హీబ్రూ పదం చట్టబద్ధ యాజకులను కాక, అన్య లేదా విగ్రహారాధనతో సంబంధమున్న యాజకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాశిచక్ర చిహ్నాలకు.’ హీబ్రూ పదం నక్షత్రరాశులను లేదా ఖగోళ సమూహాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదబంధం ‘ఆకాశ సైన్యమంతటికీ.’ ఈ సందర్భంలో అది ఆరాధించబడిన ఆకాశ జ్యోతుల సమూహాన్ని సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: తొలగించాడు
  rationale: שׁבת హిఫీల్ రూపం ‘ఆపివేయడం/నిలిపివేయడం’ అనే భావాన్ని ఇస్తుంది. వ్యక్తులను పదవి లేదా ఆరాధనా సేవ నుంచి తొలగించిన సందర్భంలో ‘తొలగించాడు’ సహజంగా ఉండి, వారు చంపబడ్డారని అనవసరంగా నిర్ధారించదు.
- source_word: הַכְּמָרִים
  choice: అన్యారాధన యాజకులు
  rationale: ఈ అరుదైన పదం యెహోవా నియమించిన చట్టబద్ధ యాజకులకన్నా అక్రమమైన లేదా విగ్రహారాధనతో సంబంధమున్న ఆరాధనా సేవకులను సూచిస్తుంది. ‘అన్యారాధన యాజకులు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: యూదా రాజులు ... నియమించిన
  rationale: ఈ నిర్మాణంలో נתן అంటే ఒక బాధ్యతకు నియమించడం లేదా స్థాపించడం. భూతపూర్వ చర్యను తెలుగు సంబంధవాచక నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: וַיְקַטֵּר / הַמְקַטְּרִים
  choice: ధూపం వేయడానికి / ధూపం వేసేవారు
  rationale: קטר ధూపాన్ని లేదా పొగగా పైకెగసే అర్పణను సూచించగలదు. ఈ సందర్భంలో ‘ధూపం వేయడం’ స్పష్టమైన, సాధారణ తెలుగు ప్రయోగం.
- source_word: בַּבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: במה స్థానిక ఆరాధనా స్థలానికి ప్రామాణిక బైబిలు పదం. ‘ఉన్నత స్థలాలు’ భౌగోళిక ఎత్తు మాత్రమే కాక ఆరాధనా కేంద్రాలనే సందర్భంలో సూచిస్తుంది.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: యూదా పట్టణాల్లో, యెరూషలేము చుట్టుపక్కల
  rationale: מְסִבֵּי యెరూషలేమును చుట్టుముట్టిన పరిసర ప్రాంతాలను సూచిస్తుంది; ఈ తెలుగు రూపం సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: לַבַּעַל
  choice: బయలుకు
  rationale: దేవత పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: సూర్యునికి, చంద్రునికి
  rationale: హీబ్రూలో పునరుక్తమైన לְ ప్రతి ఆరాధనా లక్ష్యాన్ని విడిగా చూపుతుంది; తెలుగులో విభక్తి పునరుక్తి దాన్ని నిలుపుతుంది.
- source_word: וְלַמַּזָּלוֹת
  choice: నక్షత్రరాశులకు
  rationale: מַזָּלוֹת సాధారణ నక్షత్రాలకన్నా నక్షత్ర సమూహాలు లేదా రాశిచక్ర సమూహాలను సూచించే అవకాశం ఎక్కువ. ‘నక్షత్రరాశులు’ తగినంత ఖచ్చితమైనదైనా అతినిర్దిష్టం కాదు.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: ఆకాశ సైన్యమంతటికీ
  rationale: צְבָא הַשָּׁמַיִם అనే స్థిరపదబంధం ఆకాశంలోని సమస్త జ్యోతులను ఒక సమూహంగా సూచిస్తుంది. మూలపాఠంలోని ‘సైన్యం’ రూపకాన్ని ప్రధాన వచనంలో నిలిపి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
theological_decisions:
- issue: הַכְּמָרִים పదాన్ని తటస్థంగా ‘యాజకులు’ అనాలా, అక్రమ/అన్యారాధన సంబంధాన్ని స్పష్టం చేయాలా
  choice: అన్యారాధన యాజకులు
  alternative: యాజకులు; విగ్రహారాధక యాజకులు
  rationale: రాజుల గ్రంథంలోని యోషీయా సంస్కరణ సందర్భం, ఈ పదం ఇతర హీబ్రూ ప్రయోగాలు చట్టబద్ధమైన యెహోవా యాజకులను కాక అక్రమ ఆరాధనా సేవకులను సూచిస్తున్నాయి. ‘అన్యారాధన’ మూలపదపు ప్రతికూల ఆరాధనా సంబంధాన్ని తెలియజేస్తుంది; ‘విగ్రహారాధక’ కంటే కొద్దిగా విస్తృతంగా ఉండి బయలు మరియు ఖగోళ ఆరాధన రెండింటినీ కలుపుతుంది.
- issue: צְבָא הַשָּׁמָיִם ను దేవదూతలుగా అర్థం చేయాలా, ఖగోళ వస్తువుల సమూహంగా అర్థం చేయాలా
  choice: మూల రూపకాన్ని ‘ఆకాశ సైన్యం’గా నిలిపి, ఈ సందర్భంలో ఖగోళ జ్యోతులని పాదటిప్పణిలో వివరించడం
  alternative: ఆకాశ జ్యోతులన్నిటికీ
  rationale: బయలు, సూర్యుడు, చంద్రుడు, నక్షత్రరాశుల జాబితా ఇక్కడ ఖగోళ ఆరాధనను సూచిస్తుంది. అయినా స్థిరపదబంధంలోని ‘సైన్యం’ రూపకాన్ని పూర్తిగా తొలగించకుండా ఉంచడం మూలానికి నిబద్ధంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి, ‘కూడా తొలగించాడు’ ద్వారా ఒకే ప్రధాన క్రియ కింద ఉన్న రెండు కర్మలను స్పష్టంగా అనుసంధానించాం. ‘ధూపం వేయడం,’ ‘ఉన్నత స్థలాలు,’ ‘ఆకాశ సైన్యం’ వంటి బైబిలు పదజాలాన్ని సహజతతో సమతుల్యం చేశాం.
