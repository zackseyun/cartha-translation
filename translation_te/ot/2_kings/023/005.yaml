    rationale: మూలపదం ఈ యాజకులు చట్టబద్ధ యాజకులు కాదని సందర్భానుసారంగా సూచిస్తుంది; అయితే చట్టబద్ధ యాజకులను ఎవరు నియమించారనే అదనపు వాక్యాన్ని ఈ లెక్సికల్ గమనికలో చేర్చాల్సిన అవసరం లేదు. దాన్ని తొలగించడం ద్వారా గమనిక మరింత మూలనిబద్ధంగా, తటస్థంగా ఉంటుంది.
