  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: te
  text: అతడు బెన్-హిన్నోము లోయలో ఉన్న తోఫెతును అపవిత్రం చేశాడు; ఎవరూ తన కుమారుణ్ణిగానీ కుమార్తెను గానీ అగ్నిలోగుండా మోలెకుకు దాటించకుండా ఉండేలా చేశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుమారుణ్ణి లేదా కుమార్తెను అగ్నిలోగుండా దాటించడం’ అనేది మోలెకుతో సంబంధమున్న ఆచారంలో పిల్లలను అర్పించడాన్ని సూచించే హీబ్రూ నుడికారం; ఇది బహుశా పిల్లలను బలిగా అర్పించడాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘మోలెకుకు’ అనే పఠనం అత్యంత సంభావ్యం. హీబ్రూ వ్యంజనాలను కొందరు ‘రాజుకు’ అని కూడా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: అపవిత్రం చేశాడు
  rationale: పియేల్ రూపం ‘అపవిత్రం చేయడం’ అనే భావాన్ని ఇస్తుంది. యోషీయా ఆ ఆరాధనా స్థలాన్ని మతకర్మలకు పనికిరాకుండా చేసిన సందర్భానికి ఈ పదం సహజంగా సరిపోతుంది.
- source_word: הַתֹּפֶת
  choice: తోఫెతు
  rationale: ఇది స్థల నామం కాబట్టి తెలుగులో ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: בְּגֵי בני הִנֹּם
  choice: బెన్-హిన్నోము లోయలో
  rationale: స్థిరపడిన స్థలనామ స్వరూపాన్ని నిలుపుతూ, גֵי అనే ‘లోయ’ అర్థాన్ని స్పష్టంగా తెలిపింది. పాఠంలోని בני రూపాన్ని పదక్షరంగా ‘హిన్నోము కుమారుల’ అని అనువదించడం కంటే స్థలనామంగా ఇవ్వడం ఆధునిక తెలుగులో సహజం.
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: దాటించకూడదని
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా నిరోధాన్ని సూచిస్తుంది. హిఫీల్ క్రియలోని ‘దాటేలా చేయడం’ అనే కారణార్థక భావాన్ని నిలిపింది.
- source_word: אִישׁ
  choice: ఎవరూ
  rationale: వ్యాకరణపరంగా పురుష ఏకవచనమైనప్పటికీ ఇక్కడ సాధారణార్థం ఉంది. ‘ఎవరూ’ ఆ సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: తన కుమారుణ్ణిగానీ కుమార్తెను గానీ
  rationale: నిషేధ వాక్యంలో హీబ్రూ సంధి యొక్క పంపిణీ భావాన్ని తెలుగు ‘గానీ…గానీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּאֵשׁ
  choice: అగ్నిలోగుండా
  rationale: ‘దాటించు’ అనే క్రియతో కలిసి ఆచార సంబంధమైన హీబ్రూ నుడికారాన్ని నిలుపుతుంది.
- source_word: לַמֹּלֶךְ
  choice: మోలెకుకు
  rationale: ఈ బలి ఆచార సందర్భంలో దీనిని దేవత పేరైన ‘మోలెకు’గా అర్థం చేసుకోవడం అత్యంత సంభావ్యమైన పఠనం.
theological_decisions:
- issue: పిల్లలను అగ్నిలోగుండా దాటించే ఆచార నుడికారాన్ని ఎలా అనువదించాలి
  choice: ‘తన కుమారుణ్ణిగానీ కుమార్తెను గానీ మోలెకుకు అగ్నిలోగుండా దాటించు’ అనే మూల నుడికారాన్ని ప్రధాన పాఠంలో నిలిపివేయడం
  alternative: ‘తన కుమారుణ్ణిగానీ కుమార్తెను గానీ మోలెకుకు అగ్నిబలిగా అర్పించు’
  rationale: ఈ మాటలు పిల్లల అర్పణకు సంబంధించిన ఆచారాన్ని, బహుశా శిశుబలిని, సూచిస్తున్నాయి; అయితే మూలపాఠం దానిని నేరుగా ‘బలి’ అని చెప్పకుండా నుడికారంగా వ్యక్తం చేస్తుంది. అందువల్ల ప్రధాన పాఠంలో ఆ ఉద్రిక్తతను నిలిపి, పాదసూచికలో వివరణ ఇచ్చింది.
- issue: אִישׁ అనే సాధారణార్థక పురుష ఏకవచనం
  choice: ఎవరూ
  alternative: ఏ పురుషుడూ
  rationale: ఈ సందర్భంలో పదం పురుషులను మాత్రమే పరిమితం చేయకుండా సాధారణ ప్రతినిధి భావంతో వాడబడింది. తెలుగు ‘ఎవరూ’ ఆ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- issue: לַמֹּלֶךְ యొక్క పఠనం
  choice: మోలెకుకు
  alternative: రాజుకు
  rationale: సంబంధిత ఆరాధనా సందర్భం మరియు సంప్రదాయ పఠనం దేవత పేరైన ‘మోలెకు’ను బలపరుస్తాయి; అయినా హీబ్రూ వ్యంజనాలను ‘రాజుకు’ అని అర్థం చేసుకునే అవకాశం పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, రెండవ వాక్యంలో ‘అతడు అలా చేశాడు’ అని ఉద్దేశ సంబంధాన్ని స్పష్టంచేసింది; మూలంలోని ఆచార నుడికారాన్ని మాత్రం వ్యాఖ్యానాత్మకంగా మార్చలేదు.
