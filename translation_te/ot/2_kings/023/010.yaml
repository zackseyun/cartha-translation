  source_fidelity: 'మూల హీబ్రూ వాక్యం తోఫెతును అపవిత్రపరచిన ఉద్దేశాన్ని తెలియజేస్తుంది: ఎవరూ తమ కుమారుడిని లేదా కుమార్తెను అగ్నిలోగుండా మోలెకుకు దాటించకుండా ఉండాలి. ముసాయిదా ఈ ప్రధాన భావాన్ని సరిగా అందిస్తుంది. అయితే ‘అతడు అలా చేశాడు’ అనే రెండవ-వాక్య నిర్మాణం మూలంలోని ఉద్దేశ ఉపవాక్యాన్ని కొద్దిగా పరోక్షంగా చేస్తుంది; అలాగే ప్రధాన వాక్యంలో ‘మోలెకుకు’ను ‘అగ్నిలోగుండా’ కంటే ముందుకు పెట్టడం హీబ్రూ పదక్రమంలోని ఆచార నుడికారాన్ని తక్కువగా ప్రతిబింబిస్తుంది.'
