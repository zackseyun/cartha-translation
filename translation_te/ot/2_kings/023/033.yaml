source:
  edition: WLC
  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: te
  text: ఫరో నెకో అతన్ని హమాతు దేశంలోని రిబ్లాలో నిర్బంధించాడు[a], అతడు యెరూషలేములో రాజుగా పరిపాలిస్తున్నప్పుడు[b]. ఫరో ఆ దేశంపై వంద తలాంతుల వెండిని, ఒక తలాంతు బంగారాన్ని కప్పంగా[c] విధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంధించాడు” లేదా “అదుపులో ఉంచాడు.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ పదబంధాన్ని “అతను యెరూషలేములో రాజుగా పరిపాలించకుండా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “దండంగా” లేదా “జరిమానాగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: అతన్ని ... నిర్బంధించాడు
  rationale: אסר అంటే బంధించడం లేదా నిర్బంధించడం. రాజును అధికారానికి దూరంగా ఉంచిన ఈ సందర్భంలో ‘నిర్బంధించాడు’ అనేది చర్య యొక్క ప్రాయోగిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రత్యక్షమైన ‘బంధించాడు’ అనే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: פַרְעֹה נְכֹה
  choice: ఫరో నెకో
  rationale: పాలకుని బిరుదైన ‘ఫరో’ను నిలిపి, వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో ‘నెకో’గా లిప్యంతరీకరించాం.
- source_word: בְרִבְלָה בְּאֶרֶץ חֲמָת
  choice: హమాతు దేశంలోని రిబ్లాలో
  rationale: రెండు భౌగోళిక సూచనల సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపిస్తూ, రిబ్లా హమాతు ప్రాంతంలో ఉందనే మూల భావాన్ని నిలిపాం.
- source_word: במלך בִּירוּשָׁלָם
  choice: అతడు యెరూషలేములో రాజుగా పరిపాలించకుండా చేశాడు
  rationale: నిర్బంధం వల్ల అతడు యెరూషలేములో పాలించలేకపోయాడనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలిపాం. హెబ్రీ పదబంధాన్ని ‘పరిపాలించడం నుంచి’ అని కూడా నిర్మించవచ్చనే రూపభేదాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיִּתֶּן עֹנֶשׁ עַל הָאָרֶץ
  choice: ఆ దేశం మీద ... కప్పంగా విధించాడు
  rationale: עֹנֶשׁ శిక్షగా విధించిన చెల్లింపు, జరిమానా లేదా దండాన్ని సూచించగలదు. వెండి, బంగారం నిర్దిష్ట పరిమాణాల్లో దేశంపై మోపబడిన రాజకీయ సందర్భంలో ‘కప్పం’ సహజంగా సరిపోతుంది; ఇతర పదార్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: מֵאָה כִכַּר כֶּסֶף וְכִכַּר זָהָב
  choice: వంద తలాంతుల వెండిని, ఒక తలాంతు బంగారాన్ని
  rationale: כִּכָּר అనే ప్రాచీన బరువు ప్రమాణాన్ని ఆధునిక బరువులోకి ఊహాత్మకంగా మార్చకుండా, సంప్రదాయ తెలుగు రూపమైన ‘తలాంతు’తో నిలిపాం; ఏకవచన, బహువచన భేదాన్ని కాపాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ప్రాచీన ప్రదేశనామాలు, బిరుదు, బరువు ప్రమాణాన్ని లిప్యంతరీకరించాం. మూలంలోని రాజకీయ నిర్బంధం మరియు ఆర్థిక విధింపు భావాలను మతపరమైన అదనపు వ్యాఖ్యానం లేకుండా నిలిపాం.
