  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: te
  text: అతడు, “అతన్ని అలాగే వదిలేయండి; ఎవ్వరూ అతని ఎముకలను కదిలించవద్దు” అన్నాడు. కాబట్టి వారు అతని ఎముకలను, సమరయ నుండి వచ్చిన ప్రవక్త ఎముకలతో పాటు, కాపాడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు అతని ఎముకలను, సమరయ నుండి వచ్చిన ప్రవక్త ఎముకలతో పాటు, హాని కలగకుండా వదిలేశారు.”
    reason: וַיְמַלְּטוּ అనే క్రియకు ‘కాపాడారు/విడిపించారు’ అనే భావంతో పాటు, సందర్భానుసారంగా ‘హాని కలగకుండా వదిలేశారు’ అనే ఫలితార్థక అనువాదం కూడా సాధ్యమైనందున ఈ ప్రత్యామ్నాయం ఇవ్వబడింది.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: అతణ్ణి అలాగే ఉండనివ్వండి
  rationale: ఈ ఆజ్ఞ మృతుని అవశేషాల విషయంలో ఇక ఏమీ చేయవద్దనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ אַל יָנַע
  choice: ఎవ్వరూ ... కదిలించవద్దు
  rationale: אִישׁ ఇక్కడ సాధారణ నిషేధార్థంలో ‘ఎవ్వరూ’ అని అర్థం; נוע ఈ సందర్భంలో ఎముకలను వాటి స్థానం నుండి కదిలించడాన్ని సూచిస్తుంది.
- source_word: עַצְמֹתָיו
  choice: అతని ఎముకలు
  rationale: మూలంలోని నిర్దిష్టమైన ‘ఎముకలు’ అనే పదాన్ని, దాని పునరుక్తితో సహా, నిలుపుతుంది.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: అతని ఎముకలను ... చెక్కుచెదరకుండా విడిచిపెట్టారు
  rationale: పియేల్ రూపం ఇక్కడ ఎముకలను హాని లేదా తొలగింపు నుండి తప్పించి భద్రంగా ఉంచడాన్ని సూచిస్తుంది; ముందున్న నిషేధంతో సంబంధాన్ని ఈ అనువాదం స్పష్టం చేస్తుంది.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: ప్రవక్త ఎముకలతో పాటు
  rationale: రెండు వ్యక్తుల ఎముకలూ అలాగే భద్రంగా విడిచిపెట్టబడ్డాయని అదనపు కర్మను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: సమరయ నుండి వచ్చిన
  rationale: కథన సమయానికి ముందే జరిగిన ప్రవక్త రాకను సంబంధవాచక నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది; שֹׁמְרוֹןకు ప్రామాణిక తెలుగు రూపం ‘సమరయ’.
