source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: te
  text: అప్పుడు రాజు ప్రధాన యాజకుడైన హిల్కీయాకు, రెండవ శ్రేణి యాజకులకు, గడప కాపలాదారులకు, బయలు కోసం, అషేరా కోసం[a], ఆకాశ సైన్యంలోని సమస్తం కోసం తయారుచేసిన సామగ్రినంతటినీ యెహోవా ఆలయంలోనుండి బయటికి తీసుకురమ్మని ఆజ్ఞాపించాడు. అతడు వాటిని యెరూషలేము వెలుపల కిద్రోను పొలాల్లో కాల్చివేసి, వాటి ధూళిని బేతేలుకు తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరా స్తంభం కోసం’; హీబ్రూ పదం అషేరా అనే దేవతను గానీ, ఆమెతో సంబంధమున్న ఆరాధనా వస్తువును గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: రాజు అధికారపూర్వకంగా ఇచ్చిన ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడు
  rationale: పదశః ‘గొప్ప యాజకుడు’ కంటే సంబంధిత యాజక పదవిని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: రెండవ శ్రేణి యాజకులు
  rationale: מִשְׁנֶה సూచించే ద్వితీయ స్థాయిని నిలుపుతూ, వారి సంస్థాగత పాత్రను అతిగా నిర్దిష్టం చేయదు.
- source_word: שֹׁמְרֵי הַסַּף
  choice: గడప కాపలాదారులు
  rationale: ఆలయ గడపకు సంబంధించిన అధికారిక కాపలా పాత్రను మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: כָּל הַכֵּלִים
  choice: సామగ్రినంతటినీ
  rationale: כְּלִים అనే విస్తృత పదం పాత్రలు మాత్రమే కాక ఆరాధనా వస్తువులు, పరికరాలను కూడా సూచించగలదు; ‘సామగ్రి’ ఆ విస్తృతిని సహజంగా అందిస్తుంది.
- source_word: לָאֲשֵׁרָה
  choice: అషేరా కోసం
  rationale: దేవతను గానీ ఆమెతో సంబంధమున్న ఆరాధనా చిహ్నాన్ని గానీ సూచించే హీబ్రూ పదంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడుతుంది.
- source_word: כֹל צְבָא הַשָּׁמָיִם
  choice: ఆకాశ సైన్యమంతటి కోసం
  rationale: నక్షత్రాదుల సమూహాన్ని ఆరాధనా సందర్భంలో సూచించే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: עֲפָרָם
  choice: వాటి ధూళి
  rationale: עָפָר కు ‘బూడిద’ కంటే ‘ధూళి’ మరింత సూటి సమానం; కాల్చిన తరువాత మిగిలిన పదార్థాన్ని సూచించినా మూల పదాన్ని మార్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం లేదా అషేరాతో సంబంధమున్న ఆరాధనా వస్తువు
  rationale: ఈ పదం దేవతను లేదా ఆమె ఆరాధనా చిహ్నాన్ని సూచించవచ్చు. బయలు, ఆకాశ సైన్యం సరసన ‘కోసం’ అని ఉండటం వల్ల ప్రధాన పాఠ్యంలో పేరును ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఉపయోగించాం.
- issue: కాల్చిన క్రియకు కర్త
  choice: అతడు
  alternative: వారు
  rationale: మసొరేటిక్ పాఠ్యంలో וַיִּשְׂרְפֵם ఏకవచన క్రియగా ఉంది; అందువల్ల కర్తను రాజుగానే వ్యాకరణపరంగా సూచించాం, కార్యం అతని ఆజ్ఞపై ఇతరులచేత జరిగి ఉండవచ్చనే అవకాశాన్ని వివరించి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. ఆలయ పరిపాలన పదాలను మూలానికి దగ్గరగా ఉంచి, అస్పష్టమైన ఆరాధనా పదానికి పాదసూచిక ఇచ్చాం.
