  to: అప్పుడు రాజు ప్రధాన యాజకుడైన హిల్కీయాకు, రెండవ శ్రేణి యాజకులకు, గడప కాపలాదారులకు, బయలు కోసం, అషేరా కోసం[a], ఆకాశ సైన్యంలోని సమస్తం కోసం తయారుచేసిన సామగ్రినంతటినీ యెహోవా ఆలయంలోనుండి బయటికి తీసుకురమ్మని ఆజ్ఞాపించాడు. అతడు వాటిని యెరూషలేము వెలుపల కిద్రోను పొలాల్లో కాల్చివేసి, వాటి ధూళిని బేతేలుకు తీసుకెళ్లాడు.
