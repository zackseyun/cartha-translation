source:
  edition: WLC
  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: te
  text: అతని రోజుల్లో ఐగుప్తు రాజైన ఫరో నెకో[a] అష్షూరు రాజు మీదికి యూఫ్రటీసు నది వరకు దండెత్తి వెళ్లాడు. యోషీయా రాజు అతన్ని ఎదుర్కొనడానికి వెళ్లాడు[c][b]. అతడు అతన్ని చూసినప్పుడు, అతడు అతన్ని మెగిద్దోలో చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: నెకో; సంప్రదాయ రూపం: నెఖో.'
    reason: lexical_alternative
  - marker: b
    text: 'మరింత స్పష్టంగా భావానువాదం చేస్తే: “యోషీయా అతన్ని ఎదుర్కొనడానికి వెళ్లినప్పుడు ఫరో నెకో అతన్ని మెగిద్దోలో చంపాడు.” హీబ్రూ పాఠంలో మూడవ పురుష సర్వనామాలు అస్పష్టంగా ఉన్నాయి.'
    reason: alternative_reading
  - marker: c
    text: యోషీయా మరణానికి సంబంధించిన సమాంతర వృత్తాంతం కోసం 2 దినవృత్తాంతాలు 35:20–24 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: అతని రోజుల్లో
  rationale: యోషీయా పరిపాలించిన కాలాన్ని సూచించే హీబ్రూ కాలవాచక ప్రయోగాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: עָלָה ... עַל מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజుకు ఎదిరిగా ... దండెత్తి వెళ్లాడు
  rationale: సైనిక సందర్భంలోని עלה మరియు עַל భావాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది; చారిత్రక పరిస్థితి ఆధారంగా ‘సహాయం చేయడానికి’ అని మార్చదు.
- source_word: פַרְעֹה נְכֹה
  choice: ఫరో నెకో
  rationale: హీబ్రూ పేరుకు సమీపమైన ఆధునిక లిప్యంతరీకరణ; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: עַל נְהַר פְּרָת
  choice: యూఫ్రటీసు నది వరకు
  rationale: ఇక్కడ గమ్యస్థానాన్ని సూచించే ప్రయోగంగా తీసుకొని తెలుగులో సహజంగా అనువదించింది.
- source_word: לִקְרָאתוֹ
  choice: అతన్ని ఎదుర్కొనడానికి
  rationale: సైనిక సందర్భంలో ‘ఎదుర్కొనడానికి’ సహజం; అయితే ఎదురుగా వెళ్లడాన్ని మాత్రమే చెబుతుంది, ఉద్దేశాన్ని మరింత విపులీకరించదు.
- source_word: וַיְמִיתֵהוּ
  choice: అతన్ని చంపాడు
  rationale: מות హిఫిల్ రూపంలోని ‘చనిపోయేలా చేశాడు’ అనే భావాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בִּמְגִדּוֹ
  choice: మెగిద్దోలో
  rationale: సంఘటన జరిగిన స్థలాన్ని సూచించే సహజ తెలుగు స్థానవాచక రూపం.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: అతడు యోషీయాను చూసినప్పుడు
  rationale: ప్రధాన వాక్యంలోని వరుస మూడవ పురుష సర్వనామాలు తెలుగులో పూర్తిగా ఉంచితే అయోమయం అసహజంగా మారుతుంది. సమీప కర్త అయిన ఫరో నెకోను ‘అతడు’గా ఉంచి, కర్మను యోషీయాగా స్పష్టం చేసింది; మూలంలోని సర్వనామ అస్పష్టతను పాదటిప్పణిలో వెల్లడించింది.
theological_decisions:
- issue: చివరి ఉపవాక్యాల్లోని మూడవ పురుష సర్వనామాల సూచన
  choice: ప్రధాన పాఠంలో ఫరో నెకో యోషీయాను చంపిన సాధారణ సందర్భార్థాన్ని స్పష్టం చేయడం
  alternative: ‘అతడు అతన్ని మెగిద్దోలో, అతన్ని చూసినప్పుడు చంపాడు’ అని హీబ్రూ సర్వనామాలను యథాతథంగా అస్పష్టంగా ఉంచడం
  rationale: హీబ్రూ వ్యాకరణంలో సర్వనామాలు ఒకే రూపంలో ఉండటం వల్ల సూచనలు సంకుచితంగా, అస్పష్టంగా ఉన్నాయి. సాధారణ సందర్భార్థాన్ని ప్రధాన పాఠంలో సహజమైన తెలుగులో ఇచ్చినా, వేరేలా స్పష్టీకరించగల అవకాశాన్ని పాదటిప్పణి బహిర్గతం చేస్తుంది; 2 దినవృత్తాంతాలు 35:20–24ను కూడా సూచిస్తుంది.
- issue: అష్షూరు రాజుతో ఫరో నెకో సంబంధం
  choice: ‘ఎదిరిగా’ అని హీబ్రూ עַל యొక్క సాధారణ సైనిక భావాన్ని నిలుపడం
  alternative: చారిత్రక పునర్నిర్మాణం ప్రకారం ‘అష్షూరు రాజుకు సహాయం చేయడానికి’ అని అనువదించడం
  rationale: మూల పాఠం నేరుగా చెప్పిన భావానికి ప్రాధాన్యం ఇచ్చి, బయటి చారిత్రక సమాచారంతో దానిని నిశ్శబ్దంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘దండెత్తి వెళ్లాడు’, ‘ఎదుర్కొనడానికి’ వంటి పదాలు సైనిక సందర్భాన్ని తెలియజేస్తాయి. పాదటిప్పణి సూచికలన్నీ ప్రధాన పాఠంలో ఉన్నాయి.
