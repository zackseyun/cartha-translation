  source_fidelity: 'హీబ్రూ మూలపాఠంలోని ప్రధాన అంశాలన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి: రాజు ప్రజలందరికీ ఆజ్ఞ ఇవ్వడం, యాహ్వేను ‘మీ దేవుడు’గా పేర్కొనడం, పస్కాను ఆచరించమనే ఆదేశం, మరియు ఈ నిబంధన గ్రంథంలో వ్రాయబడిన దానికి అనుగుణత. ‘రాసి ఉన్న ప్రకారం’ అనేది כַּכָּתוּב עַל‌కు సహజమైన, సందర్భానుకూలమైన అనువాదం.'
