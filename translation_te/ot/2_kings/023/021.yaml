source:
  edition: WLC
  text: וַ/יְצַ֤ו הַ/מֶּ֨לֶךְ֙ אֶת כָּל הָ/עָ֣ם לֵ/אמֹ֔ר עֲשׂ֣וּ פֶ֔סַח לַֽ/יהוָ֖ה אֱלֹֽהֵי/כֶ֑ם כַּ/כָּת֕וּב עַ֛ל סֵ֥פֶר הַ/בְּרִ֖ית הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: te
  text: 'అప్పుడు రాజు ప్రజలందరికీ ఇలా ఆజ్ఞాపించాడు: “ఈ నిబంధన గ్రంథంలో రాసి ఉన్న ప్రకారం, మీ దేవుడైన యాహ్వేకు పస్కా పండుగను ఆచరించండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పస్కా పండుగను జరుపుకోండి/పాటించండి.” హీబ్రూ నుడికారానికి అక్షరార్థం “పస్కాను చేయండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ అధికారపూర్వకంగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; కథన సందర్భంలో ‘ఆజ్ఞాపించాడు’ సహజమైన, సూటియైన అనువాదం.
- source_word: כָּל הָעָם
  choice: ప్రజలందరికీ
  rationale: עם ఇక్కడ ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; ఆజ్ఞను ఎవరికి ఇచ్చాడో తెలుగులో సహజంగా తెలియజేయడానికి సంప్రదాన విభక్తి వాడబడింది.
- source_word: עֲשׂוּ פֶסַח
  choice: పస్కా పండుగను ఆచరించండి
  rationale: అక్షరార్థంగా ‘పస్కాను చేయండి’ అయిన ఈ హీబ్రూ నుడికారం పండుగను విధిగా పాటించడాన్ని సూచిస్తుంది; ‘ఆచరించండి’ ఆ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వేకు
  rationale: ל సమర్పణ లేదా ఉద్దేశాన్ని సూచిస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా, אֱלֹהֵיכֶםను ‘మీ దేవుడు’గా స్పష్టంగా నిలిపింది.
- source_word: כַּכָּתוּב
  choice: రాసి ఉన్న ప్రకారం
  rationale: లిఖిత ఆదేశానికి అనుగుణంగా చేయాలని తెలిపే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: ఈ నిబంధన గ్రంథంలో
  rationale: כתבతో కూడిన עַל పత్రంలో రాయబడిన విషయాన్ని సూచిస్తుంది; ‘ఈ’ అనే నిర్దేశకాన్ని, ‘నిబంధన గ్రంథం’ అనే పత్ర స్వరూపాన్ని కాపాడింది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- issue: עֲשׂוּ פֶסַח యొక్క ఆచార సంబంధ భావం
  choice: పస్కా పండుగను ఆచరించండి
  alternative: పస్కాను చేయండి / పస్కా పండుగను జరుపుకోండి
  rationale: ‘ఆచరించండి’ అనే పదం కేవలం ఉత్సవ ఆనందానికే పరిమితం కాకుండా, గ్రంథంలో రాసిన విధంగా విధేయతతో పాటించాలనే భావాన్ని నిలుపుతుంది; అక్షరార్థ నుడికారాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు కథన ప్రవాహానికి తగిన క్రమం ఎంచుకోబడింది; అయితే ఆజ్ఞ, దైవనామం, ఒడంబడిక గ్రంథం, పస్కా ఆచరణ అనే ప్రధాన మూలాంశాలన్నీ నిలుపబడ్డాయి.
