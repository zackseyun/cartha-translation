  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో, తన పితరులు చేసినవాటన్నిటి ప్రకారం చెడ్డది చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో అక్షరార్థంగా ‘అతని తండ్రులు’; అంటే అతని పూర్వీకులు లేదా అతనికి ముందున్న రాజులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో వాక్యారంభంలోని ‘మరియు’ అవసరం లేకుండానే సహజంగా కథన కొనసాగింపు వ్యక్తమవుతుంది.
- source_word: הָרַע
  choice: చెడ్డదాన్ని
  rationale: עשה הרע అనే స్థిర ప్రయోగం ‘చెడైనదాన్ని చేయడం’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘చెడ్డదాన్ని చేశాడు’ సహజంగా, మూలానికి సమీపంగా ఉంటుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: హెబ్రీయ evaluative idiom‌ను సహజమైన తెలుగు రూపంలో నిలుపుతుంది; యెహోవా నిర్ణయ ప్రమాణంలో అది చెడ్డదని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేసినదంతా అనుసరించి
  rationale: כְּ అనే పోలిక/అనుసరణ భావంతో పాటు כֹּל యొక్క సమగ్ర బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָשׂוּ
  choice: చేసిన
  rationale: పితరుల చర్య ముందే జరిగినదని తెలుగు సంబంధక్రియా రూపం సహజంగా తెలియజేస్తుంది.
- source_word: אֲבֹתָיו
  choice: తన పితరులు
  rationale: మూలంలోని ‘అతని తండ్రులు’ అనే బహువచనాన్ని సాంప్రదాయికమైన కానీ అర్థమయ్యే ‘పితరులు’తో నిలుపుతుంది; సందర్భంలో ఇది పూర్వీకులు లేదా ముందున్న రాజులను సూచించవచ్చు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో ప్రాచుర్యం పొందిన ‘యెహోవా’ రూపంలో ఉంచాం; ‘యాహ్వే’ మరొక సమీప లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘దృష్టిలో’ అనే రూపం మూలంలోని దృశ్యరూపకాన్ని తెలుగులో వాడుకైన విధంగా నిలుపుతుంది; ‘పితరులు’కు అవసరమైన సందర్భార్థం పాదటిప్పణిలో ఇచ్చాం.
