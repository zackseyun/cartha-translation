id: 2KI.23.27
reference: 2 Kings 23:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: te
  text: 'యెహోవా ఇలా అన్నాడు: “నేను ఇశ్రాయేలును నా సన్నిధి నుండి తొలగించినట్లే, యూదాను కూడా నా సన్నిధి నుండి తొలగిస్తాను. నేను ఎన్నుకున్న ఈ పట్టణాన్ని—యెరూషలేమును—తిరస్కరిస్తాను[b]. అలాగే, ‘నా పేరు అక్కడ ఉంటుంది’ అని నేను చెప్పిన ఆ గృహాన్ని[a] కూడా తిరస్కరిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయాన్ని.” హీబ్రూలో “గృహాన్ని”; ఇది యెరూషలేములోని దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను ఎన్నుకున్న ఈ పట్టణాన్ని—యెరూషలేమును—తిరస్కరించాను.” హీబ్రూ క్రియను పూర్తయిన చర్యగా చదవవచ్చు; ఇక్కడ చుట్టూ ఉన్న తీర్పు ప్రకటనకు అనుగుణంగా భవిష్యదర్థంలో అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచింది.
- source_word: אָסִיר / הֲסִרֹתִי (סור, Hiphil)
  choice: తొలగిస్తాను / తొలగించినట్లే
  rationale: కారణార్థక రూపంలోని ‘దూరం చేయడం, తొలగించడం’ అనే భావాన్ని నిలుపుతూ, యూదా–ఇశ్రాయేలు మధ్య సమాంతరతను స్పష్టంగా చూపుతుంది.
- source_word: מֵעַל פָּנַי
  choice: నా సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘నా ముఖం ఎదుటి నుండి’; తెలుగులో సహజంగా ఉండే ‘నా సన్నిధి నుండి’ అనే రూపం దేవునితో సంబంధపరమైన దూరీకరణ భావాన్ని కాపాడుతుంది.
- source_word: גַּם
  choice: కూడా
  rationale: ఇశ్రాయేలుకు జరిగిన తీర్పు యూదాకూ వర్తిస్తుందని సూచిస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: తొలగించినట్లే
  rationale: యూదాపై రాబోయే తీర్పును ఇశ్రాయేలుపై ఇప్పటికే జరిగిన తీర్పుతో నేరుగా పోలుస్తుంది.
- source_word: וּמָאַסְתִּי
  choice: తిరస్కరిస్తాను
  rationale: మూలంలోని qatal రూపం పూర్తయిన చర్యగా చదవదగినదైనా, ఈ తీర్పు ప్రకటనలో ముందున్న భవిష్యత్ క్రియను కొనసాగించే భావంతో అనువదించబడింది; ‘తిరస్కరించు’ అనేది מאס యొక్క ఒడంబడిక సంబంధ నిరాకరణ భావాన్ని అతిశయోక్తి లేకుండా ఇస్తుంది.
- source_word: הָעִיר הַזֹּאת ... אֶת יְרוּשָׁלִַם
  choice: ఈ పట్టణాన్ని—యెరూషలేమును—
  rationale: యెరూషలేము ‘ఈ పట్టణం’ ఏదో స్పష్టంచేసే సమానాధికార పదంగా ఉన్న మూల నిర్మాణాన్ని డాష్‌లతో నిలిపింది.
- source_word: הַבַּיִת
  choice: ఆ గృహాన్ని
  rationale: అక్షరార్థమైన ‘గృహం’ను నిలుపుతూ, సందర్భంలో అది యెరూషలేము దేవాలయాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: నా పేరు అక్కడ ఉంటుంది
  rationale: దేవుని పేరు ఎన్నుకున్న పవిత్రస్థలంలో ఉండే బైబిలీయ భావాన్ని నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు ప్రకటనలో וּמָאַסְתִּי యొక్క కాలార్థం
  choice: భవిష్యదర్థంగా ‘తిరస్కరిస్తాను’
  alternative: ‘తిరస్కరించాను’
  rationale: హీబ్రూ రూపాన్ని పూర్తయిన చర్యగా చదవవచ్చును; అయితే ‘యూదాను కూడా తొలగిస్తాను’ అనే రాబోయే తీర్పు ప్రకటనతో అనుసంధానించి భవిష్యదర్థం ఇవ్వడం వాక్యప్రవాహానికి సరిపోతుంది. ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఉంచి మూలంలోని ఉద్వేగాన్ని కాపాడింది.
- issue: הַבַּיִת పదానికి అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘గృహం’
  alternative: ‘దేవాలయం’ లేదా ‘మందిరం’
  rationale: మూలంలోని ‘గృహం’ అనే రూపకాన్ని, దాని ఆలయ సంబంధ ప్రతిధ్వనిని నిలుపుతుంది; అది యెరూషలేము దేవాలయమని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని పొడవైన సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు అనుసంధాన వాక్యాలుగా విభజించినా, పట్టణం మరియు గృహం రెండూ ఒకే ‘తిరస్కరించడం’ క్రియకు కర్మలనే భావం నిలుపబడింది. ‘నా సన్నిధి నుండి’ సాధారణ పాఠకుడికి సహజంగా ఉండి, హీబ్రూ సంబంధపరమైన నుడికారాన్ని కాపాడుతుంది.
