  source_fidelity: 'పాఠ్యం హీబ్రూ వాక్యార్థాన్ని విశ్వసనీయంగా ప్రతిబింబిస్తుంది: యూదాను ఇశ్రాయేలువలె దేవుని సన్నిధి నుండి తొలగించడం, ఎన్నుకోబడిన యెరూషలేము పట్టణాన్ని మరియు ‘నా పేరు అక్కడ ఉంటుంది’ అని చెప్పబడిన గృహాన్ని తిరస్కరించడం అన్న సమాంతర తీర్పు భావం నిలిచింది. וּמָאַסְתִּיకి భవిష్యదర్థమైన ‘తిరస్కరిస్తాను’ సందర్భానుకూలం; ప్రత్యామ్నాయ పూర్తికాల పఠనం పాదసూచికలో సరిగ్గా భద్రపరచబడింది.'
