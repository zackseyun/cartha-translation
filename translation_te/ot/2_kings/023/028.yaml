source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: యోషీయా చేసిన మిగిలిన కార్యాలు, అతడు చేసినదంతా ‘యూదా రాజుల దినవృత్తాంతాల గ్రంథం’లో[b] రాయబడి[a] ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాయబడి’కి బదులు ‘నమోదుచేయబడి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి అక్షరార్థం ‘రాయబడి’; అయితే ఈ చారిత్రక దస్తావేజుల సందర్భంలో ‘నమోదుచేయబడి’ అనే భావం కూడా ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దినవృత్తాంతాల గ్రంథం’ అనేది రాజుల గ్రంథంలో ప్రస్తావించబడే ఒక రాజరిక చరిత్రాధారాన్ని సూచిస్తుంది; అది ప్రస్తుతం బైబిలులో ఉన్న 1–2 దినవృత్తాంతాల గ్రంథాల తుది రూపమేనని తప్పనిసరిగా భావించాల్సిన అవసరం లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: యోషీయా చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల చరిత్రను ముగించే ఈ సూత్రప్రాయ వాక్యంలో יֶתֶר మిగిలినదాన్ని, דִּבְרֵי రాజు కార్యాలను లేదా వ్యవహారాలను సూచిస్తాయి. ఈ ఎంపిక ఆధునిక తెలుగులో సహజంగా ఉండి భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עשה అనే విస్తృత క్రియకు ‘చేసినది’ సరళమైన, మూలానికి దగ్గరైన అనువాదం.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: הֲלֹא సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను ప్రవేశపెడుతుంది. ‘ఉన్నాయి కదా?’ ఆ ప్రశ్నార్థక ధోరణిని సహజమైన తెలుగులో నిలుపుతుంది; כְּתוּבִים కు ‘రాయబడి’ నేరమైన అనువాదం.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సందర్భంలో తెలుగులో ‘గ్రంథంలో’ సహజమైన ప్రయోగం.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: ‘యూదా రాజుల దినవృత్తాంతాల గ్రంథం’
  rationale: ఇది రాజవంశ సంబంధమైన వార్షిక చరిత్రల ఆధారగ్రంథానికి సూత్రప్రాయ శీర్షిక. ‘దినవృత్తాంతాలు’ కాలక్రమానుసారమైన నమోదుల భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దినవృత్తాంతాల గ్రంథం’ యొక్క గుర్తింపు
  choice: రాజుల గ్రంథంలో ఉదహరించబడిన రాజరిక ఆధారగ్రంథంగా పేర్కొనడం
  alternative: ప్రస్తుత బైబిలులోని 1–2 దినవృత్తాంతాల గ్రంథాలతో నేరుగా సమానీకరించడం
  rationale: హీబ్రూ శీర్షిక ఒక రాజరిక చరిత్రాధారాన్ని సూచిస్తుంది; అది ప్రస్తుత ప్రామాణిక 1–2 దినవృత్తాంతాల గ్రంథాలే అని వాక్యం నిర్ధారించదు. అందువల్ల ఆ గుర్తింపును పాదసూచికలో తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన చారిత్రక శైలిని వాడాం. హీబ్రూలో స్పష్టమైన కాలసూచక ‘ఇప్పుడు’ లేకపోవడంతో దానిని చేర్చలేదు. మూలంలోని అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా ‘ఉన్నాయి కదా?’గా నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచాం.
