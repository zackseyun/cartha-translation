source:
  edition: WLC
  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: te
  text: ఎందుకంటే, ఇశ్రాయేలుకు న్యాయం తీర్చిన న్యాయాధిపతుల రోజులనుంచి, ఇశ్రాయేలు రాజుల రోజులన్నిటిలోగానీ యూదా రాజుల రోజులన్నిటిలోగానీ ఇలాంటి పస్కా ఆచరించబడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో యోషీయా ఆజ్ఞకు వివరణను పరిచయం చేసే కారణార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נַעֲשָׂה
  choice: ఆచరించబడలేదు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చేయబడింది’ అనే భావం ఉన్నా, పస్కా సందర్భంలో ‘ఆచరించబడింది’ అనేది సహజంగా ఉండి ఆరాధనా ఆచరణ భావాన్ని నిలుపుతుంది.
- source_word: כַּפֶּסַח הַזֶּה
  choice: ఇలాంటి పస్కా
  rationale: తులనార్థక כְּ మరియు ‘ఈ పస్కా’ కలిపి ‘ఈ పస్కా వంటిది’ అనే భావం ఇస్తాయి; ఇది పస్కా అసలే జరగలేదని కాక, దీనితో పోల్చదగిన పస్కా జరగలేదని సూచిస్తుంది.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: న్యాయాధిపతుల రోజులనుంచి
  rationale: కాలపరమైన ప్రారంభ బిందువును సూచించే מִן భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు న్యాయం తీర్చిన
  rationale: ‘న్యాయాధిపతులు’ అనే నామపదంతో మూలంలోని క్రియాత్మక పదబంధ సంబంధాన్ని నిలుపుతూ, שׁפט యొక్క న్యాయనిర్వహణ భావాన్ని తెలియజేస్తుంది.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: ఇశ్రాయేలు రాజుల రోజులన్నిటిలోగానీ యూదా రాజుల రోజులన్నిటిలోగానీ
  rationale: కొనసాగుతున్న నిరాకరణను ‘గానీ…గానీ’ నిర్మాణంతో స్పష్టం చేసి, ఇశ్రాయేలు రాజులు మరియు యూదా రాజులు అనే రెండు వర్గాలను మూలంలాగే వేరుగా ఉంచుతుంది.
theological_decisions:
- issue: చారిత్రక పోలిక యొక్క పరిధి
  choice: న్యాయాధిపతుల కాలం నుంచి ఇశ్రాయేలు, యూదా రాజుల కాలమంతటిలో యోషీయా పస్కాతో పోల్చదగిన పస్కా ఆచరించబడలేదని వాక్యం చెబుతుంది.
  alternative: ఆ కాలమంతటిలో పస్కా అసలే ఆచరించబడలేదని అర్థం చేసుకోవడం.
  rationale: כַּפֶּסַח הַזֶּה అనే తులనాత్మక పదబంధం సంపూర్ణంగా పస్కా ఆచరణ లేకపోవడాన్ని కాక, ‘ఇలాంటి పస్కా’ లేకపోవడాన్ని సూచిస్తుంది. చారిత్రక వాదన అతిశయోక్తా కాదా అనే ప్రశ్నను అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, ‘ఆచరించబడలేదు’ ద్వారా పండుగ నిర్వహణ భావాన్ని సహజంగా వ్యక్తం చేశాం.
