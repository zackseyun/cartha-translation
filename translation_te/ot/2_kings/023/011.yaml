source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: te
  text: యూదా రాజులు సూర్యునికి అంకితం చేసిన గుర్రాలను అతడు యెహోవా మందిర ప్రవేశద్వారం నుండి, పరిసరాల్లో[b] ఉన్న రాజసభ అధికారి[a] నెతన్‌-మెలెక్ గది వరకు తొలగించాడు; సూర్యుని రథాలను అతడు నిప్పుతో కాల్చివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నపుంసకుడు.” హెబ్రీ పదం నపుంసకుడిని గానీ రాజసభ లేదా రాజ్య అధికారిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడున్న హెబ్రీ పదం అరుదైనది. అది ఆలయ సముదాయంలోని వెలుపలి లేదా అంచు ప్రాంతాన్ని సూచించి ఉండవచ్చు; “వెలుపలి ప్రాంగణాల్లో” లేదా “మండపాల్లో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: తొలగించాడు
  rationale: שׁבת హిఫిల్ రూపం ఇక్కడ ‘నిలిపివేయడం/వాడుకలో లేకుండా చేయడం’ అనే భావాన్ని ఇస్తుంది; యోషీయా సంస్కరణల సందర్భంలో ‘తొలగించాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: యూదా రాజులు సూర్యునికి అంకితం చేసిన
  rationale: נתן అక్షరార్థంగా ‘ఇచ్చారు’; అయితే ఇక్కడ సూర్యారాధనకు గుర్రాలను సమర్పించిన ఆరాధనా సందర్భం ఉన్నందున ‘అంకితం చేసిన’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: యెహోవా మందిర ప్రవేశద్వారం దగ్గర, ... గది పక్కన
  rationale: సంక్షిప్తమైన హెబ్రీ స్థలవివరణను గుర్రాలను ఒక చోటు నుంచి మరొక చోటుకు తరలించాడనే అపార్థం రాకుండా, అవి ఉన్న స్థానాన్ని సూచించే సహజ తెలుగు వాక్యంగా ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: נְתַן מֶלֶךְ
  choice: నెతన్‌-మెలెక్
  rationale: మసొరా స్వరచిహ్నాలకు అనుగుణంగా వ్యక్తి పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: הַסָּרִיס
  choice: రాజోద్యోగి
  rationale: סָרִיס అనే పదం నపుంసకుడిని లేదా రాజసభ/రాజ్య అధికారిని సూచించగలదు. సందర్భంలో శారీరక స్థితిని నిర్ధారించకుండా పదవిని తెలిపే ‘రాజోద్యోగి’ని ప్రధాన పాఠంలో ఎంచుకున్నాం.
- source_word: בַּפַּרְוָרִים
  choice: ఆలయ ప్రాంగణపు వెలుపలి భాగంలో
  rationale: ఇది అరుదైన స్థలవాచక పదం; ఆలయ సముదాయంలోని వెలుపలి లేదా అంచు ప్రాంతాన్ని సూచించే అవకాశాన్ని స్పష్టమైన తెలుగులో తెలిపాం, కాని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: సూర్యుని రథాలు
  rationale: ఆరాధనా ప్రతీకను వ్యాఖ్యానించి సన్నగిల్లకుండా మూలంలోని ‘సూర్యుని రథాలు’ అనే రూపాన్ని నిలిపాం.
- source_word: שָׂרַף בָּאֵשׁ
  choice: నిప్పుతో కాల్చివేశాడు
  rationale: ‘అగ్నితో కాల్చాడు’ అనే హెబ్రీ బలవచనాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
theological_decisions:
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో పరిచితమైన రూపంలో ఇచ్చాం.
- issue: సూర్యునికి గుర్రాలను ఇవ్వడం
  choice: సూర్యునికి అంకితం చేసిన
  alternative: సూర్యునికి ఇచ్చిన
  rationale: ఈ సందర్భం విగ్రహారాధనకు సంబంధించిన సమర్పణను సూచిస్తుంది. ‘అంకితం చేసిన’ అన్నది ఆ ఆరాధనా సంబంధాన్ని తెలియజేస్తుంది; సూర్యుడే ప్రత్యక్షంగా వాటిని స్వీకరించాడనే అనవసర భావాన్ని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన హెబ్రీ వాక్యాన్ని అర్థస్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం. పాదటిప్పణి సూచికలను అవి సంబంధించిన ‘రాజోద్యోగి’ మరియు అరుదైన స్థలపదం వెంట ఉంచాం.
