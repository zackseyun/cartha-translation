source:
  edition: WLC
  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: te
  text: యోషీయా కూడా సమరయ పట్టణాల్లో ఉన్న ఉన్నత స్థలాల భవనాలన్నిటినీ తొలగించాడు. కోపం పుట్టించడానికి ఇశ్రాయేలు రాజులు వాటిని నిర్మించారు.[a] బేతేలులో తాను చేసిన కార్యాలన్నిటి ప్రకారమే వాటికీ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, విస్తృత సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, “యెహోవాకు కోపం పుట్టించడానికి.”
    reason: మూల వాక్యంలో కోపానికి గురైన వ్యక్తి చెప్పబడలేదు; అయితే సందర్భం యెహోవాను సూచిస్తుంది.
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ముందటి వచనంలోని చర్యకు దీనిని జోడించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: ఉన్నత స్థలాల మందిరాలు
  rationale: ‘ఉన్నత స్థలాల గృహాలు’ అనే మూలంలోని స్పష్టమైన నిర్మాణాలను సూచిస్తూ, తెలుగులో ఆరాధనా కట్టడాల భావాన్ని సహజంగా తెలియజేయడానికి ‘మందిరాలు’ వాడబడింది.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: సమరయ పట్టణాల్లో
  rationale: ఇక్కడ సమరయ అనే పేరు పూర్వ ఉత్తర రాజ్యానికి సంబంధించిన ప్రాంతాన్ని సూచిస్తుంది; నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לְהַכְעִיס
  choice: కోపం పుట్టించడానికి
  rationale: హెబ్రీ క్రియలోని ఉద్దేశం/ఫలిత భావాన్ని నిలుపుతుంది; ఎవరికీ కోపం పుట్టించారో మూల వాక్యంలో స్పష్టంగా చెప్పనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: הֵסִיר
  choice: తొలగించాడు
  rationale: సంస్కరణ సందర్భంలో హిఫీల్ రూపానికి స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וַיַּעַשׂ לָהֶם
  choice: వాటికీ చేశాడు
  rationale: తరువాతి పోలిక వాక్యంతో ఉన్న ‘చేశాడు’ అనే మూల క్రియా సంబంధాన్ని కాపాడుతుంది; చర్యను మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: כְּכָל הַמַּעֲשִׂים
  choice: కార్యాలన్నిటి ప్రకారమే
  rationale: כְּ యొక్క పోలిక భావాన్నీ, מַעֲשִׂים అనే బహువచన నామవాచకాన్నీ కాపాడుతుంది.
- source_word: בְּבֵית אֵל
  choice: బేతేలులో
  rationale: ఒక ప్రదేశంలో జరిగిన చర్యను తెలుగులో సహజంగా సూచిస్తుంది; ముందటి సందర్భంలోని యోషీయా చర్యలను తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: לְהַכְעִיס లో కోపానికి గురైన వ్యక్తి సూచితంగా ఉండడం
  choice: ప్రధాన పాఠ్యంలో ‘కోపం పుట్టించడానికి’ అని మాత్రమే ఉంచడం
  alternative: ‘యెహోవాకు కోపం పుట్టించడానికి’
  rationale: విస్తృత సందర్భంలో యెహోవాయే సూచితుడని స్పష్టమైనా, ఈ హెబ్రీ ఉపవాక్యంలో ఆ కర్మ ప్రత్యక్షంగా లేదు. అందువల్ల మూలంలోని సూచితత్వాన్ని ప్రధాన పాఠ్యం కాపాడి, సందర్భపరమైన స్పష్టీకరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఉన్నత స్థలాలు’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, వాటి కట్టడాలకు ‘మందిరాలు’ అనే సహజ పదాన్ని వాడింది. మూలంలోని ఉద్దేశపూర్వక అస్పష్టత పాదసూచికతో సంరక్షించబడింది.
