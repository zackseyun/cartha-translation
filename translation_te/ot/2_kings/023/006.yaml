source:
  edition: WLC
  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: te
  text: అతడు అషేరాను[a] యహ్వే మందిరం నుంచి బయటకు తీసి, యెరూషలేము వెలుపల ఉన్న కిద్రోను లోయకు తీసుకెళ్లాడు. కిద్రోను లోయలో దాన్ని కాల్చి, దుమ్ముగా నూరి, ఆ దుమ్మును సామాన్య ప్రజల సమాధులపై చల్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరా స్తంభం,’ ‘అషేరా విగ్రహం.’ హీబ్రూ పదం కనానీయుల దేవత అషేరాను లేదా ఆమె ఆరాధనకు సంబంధించిన వస్తువును సూచించగలదు; ఇక్కడ అది మందిరం నుంచి తీసివేసి నాశనం చేసిన వస్తువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: అషేరా
  rationale: ఈ పదం కనానీయుల దేవత అషేరాను గానీ, ఆమె ఆరాధనకు సంబంధించిన వస్తువును గానీ సూచించవచ్చు. ఇక్కడ బయటకు తీసి నాశనం చేసిన వస్తువే ఉద్దేశమని సందర్భం చూపుతున్నా, దాని ఖచ్చిత రూపాన్ని నిర్ణయించకుండా పేరును లిప్యంతరీకరించాం.
- source_word: מִבֵּית יְהוָה
  choice: యహ్వే మందిరం నుంచి
  rationale: ‘ఇల్లు’ అనే మూలరూపం ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ‘మందిరం’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: נַחַל קִדְרוֹן
  choice: కిద్రోను లోయ
  rationale: נחל కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా దాని లోయను సూచించగలదు; ఈ భౌగోళిక సందర్భంలో ‘కిద్రోను లోయ’ సహజంగా ఉంది.
- source_word: וַיָּדֶק לְעָפָר
  choice: దుమ్ముగా నూరి
  rationale: కాల్చిన వస్తువును అతి సూక్ష్మంగా చేసి దుమ్ముగా మార్చడాన్ని ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: עֲפָרָהּ
  choice: ఆ దుమ్మును
  rationale: עפר ప్రత్యేకంగా ‘బూడిద’ అని కాక ‘దుమ్ము’ అని అర్థమిస్తుంది; కాల్చడం, నూరడం రెండింటి తరువాత ఏర్పడిన పదార్థాన్ని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: సామాన్య ప్రజల సమాధులపై
  rationale: ఈ పదబంధం ఉన్నతవర్గానికి భిన్నంగా సాధారణ ప్రజలను సూచించే అవకాశం ఉంది. ఏకవచన ‘సమాధి’ సమాధి స్థలాన్ని సమష్టిగా సూచించవచ్చు కాబట్టి తెలుగులో సహజమైన బహువచనం వాడాం.
theological_decisions:
- issue: אֲשֵׁרָה అనే ఆరాధనా పదం సూచించేది
  choice: అషేరా
  alternative: అషేరా స్తంభం; అషేరా విగ్రహం
  rationale: వచనం నాశనం చేయబడిన ఆరాధనా వస్తువును సూచిస్తున్నప్పటికీ, అది స్తంభమా విగ్రహమా అనే రూపాన్ని హీబ్రూ ఖచ్చితంగా నిర్ధారించదు. లిప్యంతరీకరణ ఆ సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ క్రియల వరుసను నిలుపుతూ, తెలుగులో భారంగా అనిపించే పునరుక్తిని పరిమితంగా ఉంచాం.
