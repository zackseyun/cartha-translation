  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: te
  text: అయితే ఉన్నత స్థలాల యాజకులు[a] యెరూషలేములోని యహ్వే[b] బలిపీఠం మీదికి ఎక్కలేదు; కానీ వారు తమ సహోదరుల మధ్య[c] పులియని రొట్టెలు తిన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉన్నత స్థలపు యాజకులు.”
    reason: lexical_alternative
  - marker: b
    text: దైవనామం హీబ్రూలో YHWH; సంప్రదాయంగా దీనిని “ప్రభువు” అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూ మూలంలో “తమ సహోదరుల మధ్య”; సందర్భంలో ఇది వారి తోటి యాజకులను లేదా యాజక వంశానికి చెందిన బంధువులను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి సంస్కరణ చర్యలకు ఒక పరిమితి లేదా మినహాయింపును సూచించే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַעֲלוּ
  choice: ఎక్కి వెళ్లలేదు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే భావాన్ని, యెరూషలేముకు మరియు బలిపీఠానికి వెళ్లే ఆరాధనా సందర్భంలోని నుడికారాన్ని కాపాడుతుంది.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: ఉన్నత స్థలాల యాజకులు
  rationale: స్థానిక ఆరాధనా స్థలాలను సూచించే construct phrase‌ను స్పష్టంగా, సాంప్రదాయ బైబిలు పదజాలానికి దగ్గరగా అనువదిస్తుంది.
- source_word: מִזְבַּח יְהוָה
  choice: యహ్వే బలిపీఠం
  rationale: మూలంలోని సంబంధాన్ని సహజమైన తెలుగు సమాస రూపంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన YHWH‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: כִּי אִם
  choice: కానీ
  rationale: వారు యెరూషలేము బలిపీఠం వద్ద సేవ చేయకపోయినా యాజక సమాజంలో పులియని రొట్టెలు తిన్నారనే వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָכְלוּ מַצּוֹת
  choice: పులియని రొట్టెలు తిన్నారు
  rationale: מַצּוֹתకు స్పష్టమైన, సాధారణంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: తమ సహోదరుల మధ్య
  rationale: ‘తమ సహోదరుల నడుమ’ అనే మూలార్థాన్ని నిలుపుతూ, వారు తోటి యాజకులని పాఠ్యంలో స్పష్టంగా చేర్చి అర్థాన్ని కుదించకుండా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది; ‘యెహోవా’ సంప్రదాయ రూపం.
- issue: אֲחֵיהֶם అనే పురుషలింగ బంధుత్వ పదం
  choice: తమ సహోదరులు
  alternative: తమ బంధువులు; తమ తోటి యాజకులు
  rationale: మూలంలోని పురుషలింగ బహువచన బంధుత్వ పదాన్ని నిలుపుతుంది. సందర్భంలో వీరు తోటి యాజకులు లేదా యాజక వంశీయులు కావచ్చుగాని, హీబ్రూ పాఠ్యం ‘యాజకులు’ అని ఇక్కడ మళ్లీ స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఉన్నత స్థలాలు,’ ‘బలిపీఠం,’ ‘పులియని రొట్టెలు’ వంటి స్థిరమైన బైబిలు పదజాలం నిలుపబడింది; మూలంలోని అస్పష్టతను పాదసూచికలో వివరించి ప్రధాన పాఠ్యంలో అతిగా వ్యాఖ్యానించలేదు.
