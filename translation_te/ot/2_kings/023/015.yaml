id: 2KI.23.15
reference: 2 Kings 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: te
  text: బేతేలులో ఉన్న బలిపీఠాన్ని కూడా—ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యెరోబాము నిర్మించిన ఆ ఉన్నత స్థలాన్ని—అంటే, ఆ బలిపీఠాన్నీ ఆ ఉన్నత స్థలాన్నీ అతడు కూల్చివేశాడు. అతడు ఆ ఉన్నత స్థలాన్ని కాల్చి, దాన్ని ధూళిగా నలిపివేశాడు; అషేరాను[a] కాల్చివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరా స్తంభాన్ని’; హీబ్రూ పదం అషేరా దేవతనుగానీ, ఆమె ఆరాధనకు సంబంధించిన ఆరాధనా వస్తువునుగానీ సూచించవచ్చు.
    reason: అషేరా అనే పదంలోని దేవత/ఆరాధనా వస్తువు అనే భావ సందిగ్ధతను నిలుపుటకు.
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: మִזְבֵּחַకు సహజమైన, ప్రామాణిక తెలుగు పదం; మూలంలోని బలి అర్పించే పీఠం అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּבֵית אֵל
  choice: బేతేలులో
  rationale: స్థలాన్ని సూచించే בְּను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַבָּמָה
  choice: ఉన్నత స్థలం
  rationale: బָּמָה అనే ఆరాధనా స్థలానికి సంబంధించిన సాంకేతిక భావాన్ని ‘ఆలయం’ లేదా ‘పుణ్యస్థలం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: עָשָׂה
  choice: నిర్మించిన
  rationale: ఈ సందర్భంలో ఆ ఆరాధనా స్థలాన్ని ఏర్పరచడాన్ని సహజంగా తెలుపుతుంది; మూల క్రియలోని సాధారణ ‘చేశాడు’ భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేయడానికి కారకుడైన
  rationale: హిఫీల్ క్రియలోని కారణార్థక బలాన్ని నిలుపుతూ, యెరోబామును విశేషించే వాక్యభాగంగా సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: הַמִּזְבֵּחַ הַהוּא
  choice: ఆ బలిపీఠాన్ని
  rationale: సూచక సర్వనామంతో మూలంలోని పునరుక్తి, నిర్దిష్టతను నిలుపుతుంది; ‘కూడా’ ముందే వాక్యంలో ఉన్నందున కృత్రిమమైన అదనపు ఉద్ఘాటనను నివారిస్తుంది.
- source_word: נָתָץ
  choice: కూల్చివేశాడు
  rationale: నిర్మాణాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే క్రియార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: ఆ ఉన్నత స్థలాన్ని కాల్చి
  rationale: బָּמָהకు వచనమంతటా ఒకే పదాన్ని వాడుతూ, దాని భౌతిక ఆరాధనా ఏర్పాట్లు కాల్చబడిన భావాన్ని నిలుపుతుంది.
- source_word: הֵדַק לְעָפָר
  choice: దాన్ని ధూళిగా నలిపివేశాడు
  rationale: పూర్తిగా పొడిచేయడం మరియు దాని ఫలితంగా ధూళిగా మారడం అనే రెండు అంశాలను వ్యక్తం చేస్తుంది; ‘బూడిద’ అని అనువదించి עָפָר భావాన్ని మార్చదు.
- source_word: אֲשֵׁרָה
  choice: అషేరా
  rationale: ఇది దేవతను గానీ, ఆమె ఆరాధనకు సంబంధించిన వస్తువును గానీ సూచించగలదు. ప్రధాన పాఠ్యంలో హీబ్రూ పేరును లిప్యంతరీకరించడం ద్వారా ఆ సందిగ్ధతను నిలుపుతుంది.
theological_decisions:
- issue: אֲשֵׁרָה సూచించే వ్యక్తి లేదా వస్తువు
  choice: అషేరా
  alternative: అషేరా స్తంభం; అషేరా ఆరాధనా వస్తువు
  rationale: కాల్చివేసే సందర్భం ఒక చెక్క ఆరాధనా వస్తువును బలంగా సూచించినా, హీబ్రూ పదం దేవత పేరు లేదా ఆమెకు సంబంధించిన ఆరాధనా వస్తువు రెండింటినీ సూచించగలదు. అందువల్ల ప్రధాన పాఠ్యం ఒక అర్థానికే పరిమితం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, పొడవైన సంబంధ వాక్యాన్ని విరామచిహ్నాలతో స్పష్టంచేశారు. ‘ఉన్నత స్థలం’ అనే సాంకేతిక ఆరాధనా పదాన్ని వచనమంతటా ఏకరీతిగా ఉంచారు.
