translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన చారిత్రక వచనశైలి. రాజ్యారంభం, పరిపాలన వ్యవధి, తల్లి వంశపరిచయం అనే మూలపాఠ నిర్మాణం కాపాడబడింది.
