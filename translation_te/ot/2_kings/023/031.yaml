  text: בֶּן עֶשְׂרִ֨ים וְ/שָׁלֹ֤שׁ שָׁנָה֙ יְהוֹאָחָ֣ז בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חֲמוּטַ֥ל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: te
  text: యెహోయాహాజు రాజైనప్పుడు అతనికి ఇరవై మూడు సంవత్సరాలు. అతడు యెరూషలేములో మూడు నెలలు పరిపాలించాడు. అతని తల్లి పేరు హమూటలు; ఆమె లిబ్నాకు చెందిన యిర్మీయా కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: అతనికి ఇరవై మూడు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అర్థస్పష్టంగా అందిస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: ఇక్కడ క్రియ రాజుగా ఉన్న కాలవ్యవధిని సూచిస్తుంది; తెలుగు రాజవృత్తాంత శైలిలో ‘పరిపాలించాడు’ సహజంగా ఉంటుంది.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: మూడు నెలలు
  rationale: కాలవ్యవధిని మూలపాఠం ప్రకారమే నేరుగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పరిపాలన జరిగిన స్థలాన్ని సూచించే స్థానార్థక పదబంధం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: రాజుల గ్రంథంలోని సాధారణ పరిచయ సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: חֲמוּטַל
  choice: హమూతలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో అందిస్తుంది; దీర్ఘ ū ధ్వనిని ‘మూ’తో సూచిస్తుంది.
- source_word: בַּת יִרְמְיָהוּ
  choice: యిర్మీయా కుమార్తె
  rationale: בַּת సూచించే తండ్రి–కుమార్తె సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; పేరును మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: מִלִּבְנָה
  choice: లిబ్నాకు చెందిన
  rationale: מן ఇక్కడ వ్యక్తి యొక్క స్థలమూలం లేదా అనుబంధాన్ని సూచిస్తుంది; ‘చెందిన’ అనేది తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
