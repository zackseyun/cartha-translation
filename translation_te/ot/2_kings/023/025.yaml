  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: te
  text: అతనికి ముందు అతనివంటి రాజు ఎవరూ లేరు. అతడు మోషే ధర్మశాస్త్రమంతటికీ అనుగుణంగా తన హృదయమంతటితో, తన ప్రాణమంతటితో, తన బలమంతటితో యాహ్వే వైపుకు తిరిగాడు[a][b]. అతని తరువాత అతనివంటి రాజు ఎవరూ ఉద్భవించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరిగి వచ్చాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియలో దేవుని వైపు మరలడం, నిబంధన విశ్వాసంతో తిరిగి రావడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘హృదయమంతటితో, ప్రాణమంతటితో, బలమంతటితో’ అనే మాటలు ద్వితీయోపదేశకాండము 6:5ను ప్రతిధ్వనిస్తున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: అతనికి ముందు అతనివంటి రాజు ఎవరూ లేరు
  rationale: ముందుకు తెచ్చిన పోలికకు ఉన్న నొక్కిచెప్పే భావాన్ని కాపాడుతూ, తెలుగులో సహజమైన కాలసంబంధ వాక్యక్రమాన్ని ఉపయోగించింది.
- source_word: שָׁב אֶל יְהוָה
  choice: యాహ్వే వైపు తిరిగాడు
  rationale: שׁוּב అనే క్రియలో దేవుని వైపు మరలడం, నిబంధన విశ్వాసంలో తిరిగి రావడం అనే భావాలు రెండూ ఉన్నాయి. ‘వైపు తిరిగాడు’ ఆ విస్తృతిని అనవసరంగా కుదించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: తన హృదయమంతటితో, తన ప్రాణమంతటితో, తన బలమంతటితో
  rationale: ద్వితీయోపదేశకాండము 6:5ను ప్రతిధ్వనించే మూడు భాగాల సూత్రాన్ని నిలుపుతుంది. מְאֹד ఇక్కడ సంపూర్ణ సామర్థ్యం లేదా శక్తిని సూచిస్తుంది; ‘బలమంతటితో’ సాధారణ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రమంతటి ప్రకారం
  rationale: תּוֹרָהకు ‘బోధ’ అనే విస్తృత అర్థం ఉన్నా, ఇక్కడ మోషే ద్వారా ఇచ్చిన సమగ్ర నియమబోధను సూచిస్తుంది; సంప్రదాయపరంగా స్పష్టమైన ‘ధర్మశాస్త్రం’ను ఎంచుకుంది.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: అతని తరువాత కూడా అతనివంటివాడు ఎవరూ రాలేదు
  rationale: క్రియ యొక్క అక్షరార్థం ‘లేవలేదు’ అయినప్పటికీ, ఈ సందర్భంలో తరువాత అలాంటి రాజు కనిపించలేదు అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యోషీయా యాహ్వే వైపు తిరిగాడనే వర్ణనలో పశ్చాత్తాపం మరియు నిబంధన విశ్వాసం మధ్య సంబంధం
  choice: ‘యాహ్వే వైపు తిరిగాడు’ అని అనువదించడం
  alternative: ‘యాహ్వే దగ్గరకు తిరిగి వచ్చాడు’ లేదా ‘యాహ్వే ఎదుట పశ్చాత్తాపపడ్డాడు’
  rationale: మూలక్రియలో ఉన్న తిరగడం/తిరిగి రావడం అనే ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని నిలుపుతూ, ‘పశ్చాత్తాపం’ అనే ఒక్క భావానికే పరిమితం చేయదు.
- issue: ద్వితీయోపదేశకాండము 6:5 ప్రతిధ్వని
  choice: ‘హృదయమంతటితో, ప్రాణమంతటితో, బలమంతటితో’ అనే త్రయాన్ని నిలుపడం
  alternative: సంపూర్ణ సమర్పణతో
  rationale: సంక్షిప్త భావానువాదం అంతర్గ్రంథ సంబంధాన్ని మరుగుపరుస్తుంది; త్రయం యోషీయా నిబంధన నిబద్ధతను పాఠకుడు గుర్తించడానికి సహాయపడుతుంది.
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ హీబ్రూ నామానికి దగ్గరైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఎవరూ లేరు/రాలేదు’ అనే సమాంతర నిర్మాణం యోషీయా ప్రత్యేకతను స్పష్టంగా ఉంచుతుంది; వాక్యంలోని నిబంధనాత్మక మరియు అంతర్గ్రంథ భావాలు సరళీకరించబడలేదు.
