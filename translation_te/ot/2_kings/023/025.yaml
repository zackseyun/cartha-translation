- from: అతనికి ముందు అతనివంటి రాజు ఎవరూ లేరు. అతడు మోషే ధర్మశాస్త్రమంతటి ప్రకారం తన హృదయమంతటితో, తన ప్రాణమంతటితో, తన బలమంతటితో యాహ్వే వైపు తిరిగాడు[a][b]. అతని తరువాత కూడా అతనివంటివాడు ఎవరూ రాలేదు.
  to: అతనికి ముందు అతనివంటి రాజు ఎవరూ లేరు. అతడు మోషే ధర్మశాస్త్రమంతటికీ అనుగుణంగా తన హృదయమంతటితో, తన ప్రాణమంతటితో, తన బలమంతటితో యాహ్వే వైపుకు తిరిగాడు[a][b]. అతని తరువాత అతనివంటి రాజు ఎవరూ ఉద్భవించలేదు.
  rationale: The revision preserves the draft’s sound rendering and its Deuteronomic resonance, while explicitly retaining the source’s royal comparison in the final clause, using a closer contextual equivalent for ‘arose,’ and smoothing the expression for conformity to the whole Mosaic law. No doctrinal interpretation has been added.
