source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: te
  text: అప్పుడు అతడు, “నేను చూస్తున్న ఈ స్మారక చిహ్నం ఏమిటి?” అని అడిగాడు.[a] ఆ పట్టణస్థులు అతనితో, “అది యూదా నుండి వచ్చిన దేవుని మనిషి సమాధి. నీవు బేతేలు బలిపీఠానికి వ్యతిరేకంగా చేసిన ఈ కార్యాలను అతడు ప్రకటించాడు” అన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్మారక చిహ్నం’కు ‘గుర్తు,’ ‘స్మారక రాయి,’ లేదా ‘సమాధి సూచిక’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కేకవేశాడు’ లేదా ‘బిగ్గరగా పిలిచాడు.’ ఈ క్రియ దేవుని మనిషి బలిపీఠాన్ని గూర్చి చేసిన ప్రవచన ప్రకటనను సూచిస్తుంది (1 రాజులు 13:1–2 చూడండి).
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: సమాధి గుర్తు
  rationale: ఈ నామవాచకం గుర్తుగా నిలిపిన సూచికను సూచిస్తుంది; సందర్భంలో అది కనిపించే సమాధి చిహ్నం. ‘సమాధి గుర్తు’ వస్తువును స్మారక నిర్మాణమని అతిగా నిర్దిష్టం చేయకుండా సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַלָּז
  choice: ఆ
  rationale: కంటికి కనిపిస్తున్న వస్తువును చూపించే హీబ్రూ నిర్దేశక పదానికి ఆధునిక తెలుగులో ‘ఆ’ సహజంగా ఉంది.
- source_word: אֲנִי רֹאֶה
  choice: నాకు కనిపిస్తున్న
  rationale: హీబ్రూ కృదంత నిర్మాణంలోని కొనసాగుతున్న దృశ్య భావాన్ని సహజమైన తెలుగు ప్రశ్నలో వ్యక్తం చేస్తుంది.
- source_word: הַקֶּבֶר
  choice: సమాధి
  rationale: గుర్తు పెట్టబడిన పూడ్చిపెట్టే స్థలాన్ని సూచించే సందర్భానికి ‘సమాధి’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది హీబ్రూలోని స్థిరమైన బిరుదును పారదర్శకంగా అనువదిస్తుంది; ‘ప్రవక్త’ అని కార్యాన్ని బట్టి మరింత సంకుచితం చేయదు.
- source_word: מִיהוּדָה
  choice: యూదా నుండి
  rationale: భౌగోళిక మూలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקְרָא
  choice: ప్రకటించాడు
  rationale: 1 రాజులు 13లోని బహిరంగ ప్రవచన ప్రకటనను సూచిస్తుంది; ‘కేకవేశాడు’ అనే శబ్దతీవ్రతను తప్పనిసరి చేయకుండా ప్రవచన స్వభావాన్ని తెలియజేస్తుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ కార్యాలను గురించి
  rationale: ఇక్కడ ‘ఈ విషయాలు’ యోషీయా చేసిన కార్యాలతో అనుసంధానమై ఉన్నాయి. తెలుగులో ‘ఈ కార్యాలను గురించి’ ప్రవచన ప్రకటనకు మరియు దాని నెరవేర్పుకు మధ్య సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: నీవు చేసిన
  rationale: హీబ్రూ పరిపూర్ణ క్రియను సహజమైన తెలుగు భూత కృదంతంగా అనువదిస్తుంది.
- source_word: עַל הַמִּזְבַּח
  choice: బలిపీఠానికి వ్యతిరేకంగా
  rationale: సందర్భం ఖండన మరియు ధ్వంసానికి సంబంధించినది కాబట్టి עַל యొక్క విరోధార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న స్థలనామ రూపం.
theological_decisions:
- issue: ఇక్కడ జ్ఞాపకం చేయబడిన ప్రవచన వాక్య స్వభావం
  choice: וַיִּקְרָא ను ‘ప్రకటించాడు’గా అనువదించి దేవుని మనిషి చేసిన ప్రవచన ప్రకటనను నిలుపుకోవడం
  alternative: ‘కేకవేశాడు’ లేదా ‘బిగ్గరగా పిలిచాడు’
  rationale: ఈ వచనం బేతేలు బలిపీఠానికి వ్యతిరేకంగా ముందుగా పలికిన ప్రవచనాన్ని సూచిస్తుంది. ‘ప్రకటించాడు’ అదనపు వివరాలు చేర్చకుండా ఆ బహిరంగ ప్రవచన స్వభావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ప్రత్యక్ష ప్రశ్న, ‘దేవుని మనిషి’ అనే బిరుదు, బలిపీఠానికి వ్యతిరేకమైన ప్రవచన భావం నిలుపుకోబడ్డాయి.
