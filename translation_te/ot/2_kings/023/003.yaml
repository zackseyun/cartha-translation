source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: te
  text: 'అప్పుడు రాజు స్తంభం దగ్గర నిలబడి, యహ్వే సన్నిధిలో ఆ నిబంధనను చేశాడు: యహ్వేను అనుసరించడానికి, తన పూర్ణ హృదయంతో, పూర్ణ ప్రాణంతో ఆయన ఆజ్ఞలను, సాక్ష్యాలను, శాసనాలను పాటించడానికి, ఈ గ్రంథంలో[a] వ్రాయబడిన ఈ నిబంధన మాటలను నెరవేర్చడానికి. ప్రజలందరూ ఆ నిబంధనలో నిలిచారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ చుట్టగ్రంథంలో.” హీబ్రూ పదం గ్రంథాన్ని, పత్రాన్ని లేదా చుట్టగ్రంథాన్ని సూచించగలదు.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “ప్రజలందరూ నిబంధనలో నిలిచారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: స్తంభం దగ్గర నిలబడి
  rationale: עַל స్థానసూచకంగా ‘దగ్గర/వద్ద’ అనే భావాన్ని ఇవ్వగలదు. రాజు స్తంభం మీద నిలిచాడనే అనవసర భావం రాకుండా, ఆచార సందర్భానికి సహజమైన అర్థాన్ని ఎంచుకున్నాం.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: ఆ నిబంధనను చేశాడు
  rationale: כרת ברית అనేది ‘నిబంధన చేయడం’ అనే స్థిరమైన హీబ్రూ నుడికారం. ‘కోశాడు’ అనే అక్షరార్థం ఆధునిక తెలుగులో అస్పష్టంగా ఉంటుంది; నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో నిలిపాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో.’ గంభీరమైన నిబంధన సందర్భంలో ‘సన్నిధిలో’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ శాస్త్రీయ లిప్యంతరీకరణకు దగ్గరగా ఇచ్చాం.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: యహ్వేను అనుసరించడానికి
  rationale: అక్షరార్థం ‘యహ్వే వెనుక నడవడం.’ ఆధునిక తెలుగులో ‘అనుసరించడం’ ఆ నిబంధనపరమైన విధేయతను సహజంగా తెలియజేస్తుంది.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: ఆయన ఆజ్ఞలను, శాసనాలను, కట్టడలను
  rationale: 'మూడు వేర్వేరు న్యాయపరమైన పదవర్గాల వరుసను సాధ్యమైనంత వరకు నిలిపాం: מִצְוֹת ఆజ్ఞలు; עֵדוֹת సాక్ష్యాత్మక నిబంధన శాసనలు; חֻקּוֹת స్థిరంగా విధించిన కట్టడలు.'
- source_word: בְּכָל־לֵב וּבְכָל־נֶפֶשׁ
  choice: తన పూర్ణ హృదయంతో, పూర్ణ ప్రాణంతో
  rationale: నిబంధన సంబంధమైన సంపూర్ణ అంకితభావ సూత్రాన్ని నిలిపి, לֵב మరియు נֶפֶשׁ మధ్య భేదాన్ని ‘హృదయం,’ ‘ప్రాణం’గా ఉంచాం.
- source_word: לְהָקִים אֶת דִּבְרֵי הַבְּרִית
  choice: నిబంధన మాటలను నెరవేర్చడానికి
  rationale: הקים ఇక్కడ వ్రాయబడిన నిబంధన మాటలను అమల్లో పెట్టడం/నెరవేర్చడం అనే భావం ఇస్తుంది. ‘మాటలు’ అని అనువదించడం ద్వారా דִּבְרֵי యొక్క పాఠ్య ప్రాధాన్యాన్ని నిలిపాం.
- source_word: הַסֵּפֶר
  choice: గ్రంథం
  rationale: סֵפֶר గ్రంథం, పత్రం లేదా చుట్టగ్రంథాన్ని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన ‘గ్రంథం’ను వాడి, భౌతిక రూపంలోని సందిగ్ధతను పాదసూచికలో తెలిపాం.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: ప్రజలందరూ ఆ నిబంధనకు కట్టుబడి నిలిచారు
  rationale: ‘నిబంధనలో నిలిచారు’ అనే హీబ్రూ రూపకాన్ని పూర్తిగా తొలగించకుండా, దాని నిబద్ధత భావాన్ని ఆధునిక తెలుగులో స్పష్టం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత నిబంధన నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: రాజు చేసిన నిబంధనలోని క్రియాపదాల సంబంధం
  choice: రాజు నిబద్ధతగా తెలిపే ఉద్దేశ్య క్రియలుగా అనువదించడం
  alternative: ప్రత్యక్ష ప్రథమపురుష ప్రమాణ వాక్యంగా అనువదించడం
  rationale: హీబ్రూలో ప్రత్యక్ష ఉద్ధరణగానీ ‘నేను’ అనే ప్రథమపురుష రూపంగానీ లేదు; వరుసగా infinitive రూపాలు ఉన్నాయి. కాబట్టి అర్థాన్ని స్పష్టం చేస్తూనే ప్రత్యక్ష ప్రమాణాన్ని కల్పించలేదు.
- issue: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית యొక్క నిబంధనపరమైన భావం
  choice: ఆ నిబంధనకు కట్టుబడి నిలిచారు
  alternative: ఆ నిబంధనలో నిలిచారు
  rationale: ఇది సమాజమంతా నిబంధనను అంగీకరించి దానికి కట్టుబడినట్లు సూచించే నుడికారం. ‘నిలిచారు’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలోనూ ఉంచి, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. న్యాయ-నిబంధన పదాల వరుసను నిలిపి, హీబ్రూ నుడికారాలు అపార్థం కలిగించే చోట మాత్రమే సహజీకరించాం. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక సూచికలు వాటి విషయాలతో సరిపోలలేదు; మూలపాఠ్య ఆధారంగా [a]ను ‘గ్రంథం’ వద్ద, [b]ను చివరి నిబంధన నుడికారం వద్ద ఉంచాం.
