source:
  edition: WLC
  text: כִּ֗י אִם בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹֽאשִׁיָּ֑הוּ נַעֲשָׂ֞ה הַ/פֶּ֧סַח הַ/זֶּ֛ה לַ/יהוָ֖ה בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: te
  text: అయితే యోషీయా రాజు పరిపాలనలోని పద్దెనిమిదవ సంవత్సరంలోనే ఈ పస్కా యెరూషలేములో యాహ్వే కొరకు ఆచరించబడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “చేయబడింది”; అంటే “ఆచరించబడింది” లేదా “జరుపబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: అయితే ... లోనే
  rationale: ముందటి వచనంలోని నిరాకరణకు విరుద్ధంగా, ఈ ఒక్క సందర్భాన్ని ప్రత్యేకంగా చూపే adversative-exceptive భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: యోషీయా రాజు పరిపాలనలో పద్దెనిమిదవ సంవత్సరంలో
  rationale: ఇది రాజ్యపాలన సంవత్సరాన్ని సూచించే హీబ్రూ కాలప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: נַעֲשָׂה
  choice: ఆచరించబడింది
  rationale: మూల క్రియ అక్షరార్థంగా ‘చేయబడింది’; పస్కా సందర్భంలో ‘ఆచరించబడింది’ అనేది సహజమైన భావానువాదం, అలాగే క్రియ యొక్క కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: הַפֶּסַח הַזֶּה
  choice: ఈ పస్కా
  rationale: నిర్దేశక పదబంధానికి నేర అనువాదం; ‘పస్కా’ స్థిరపడిన తెలుగు బైబిలు పదం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: לְ ఉపసర్గ ఇక్కడ ఆచరణ ఎవరిని ఉద్దేశించి లేదా ఎవరి ఘనతార్థం జరిగిందో సూచిస్తుంది; దైవనామాన్ని పేరుగానే నిలుపుతుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గతో కూడిన పేరుకు ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే ఉంచాలి. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉపయోగించగా, ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కర్మణి నిర్మాణం, పరిమితి సూచించే ‘లోనే,’ మరియు పస్కా యెహోవాను ఉద్దేశించి జరిగిందనే భావం నిలుపబడ్డాయి.
