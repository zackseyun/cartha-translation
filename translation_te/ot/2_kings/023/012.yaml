source:
  edition: WLC
  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: te
  text: ఆహాజు మేడగది పైకప్పుమీద ఉన్న, యూదా రాజులు నిర్మించిన బలిపీఠాలను, యాహ్వే మందిరపు రెండు ప్రాంగణాల్లో మనష్షే నిర్మించిన బలిపీఠాలను రాజు పడగొట్టి, అక్కడే వాటిని పగులగొట్టి, వాటి ధూళిని కిద్రోను లోయలో పారవేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: బలిపీఠాలను
  rationale: מִזְבֵּחַ అనే పదానికి సాధారణమైన అర్థం ‘బలిపీఠం’; రెండు సందర్భాల్లోనూ బహువచనాన్ని నిలిపాం.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: ఆహాజు మేడగది పైకప్పుమీద
  rationale: עֲלִיָּה పై అంతస్తులోని గది లేదా మేడగదిని సూచిస్తుంది; నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: యాహ్వే మందిరంలోని రెండు ప్రాంగణాల్లో
  rationale: חָצֵר అంటే ప్రాంగణం; בֵּית יְהוָה అనే హీబ్రూ పదబంధాన్ని తెలుగులో సహజంగా ‘యాహ్వే మందిరం’ అని ఇచ్చాం.
- source_word: נָתַץ
  choice: పడగొట్టి
  rationale: ఈ క్రియ నిర్మాణాలను కూల్చడం లేదా పడగొట్టడం అనే భావాన్ని ఇస్తుంది; బలిపీఠాల సందర్భానికి ‘పడగొట్టి’ సహజంగా సరిపోతుంది.
- source_word: וַיָּרָץ מִשָּׁם
  choice: అక్కడే వాటిని పగులగొట్టి
  rationale: ధూళిని పారవేసే తదుపరి చర్యకు అనుగుణంగా, సందర్భంలో సాధారణంగా స్వీకరించే ‘పగులగొట్టాడు/నలగగొట్టాడు’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; హీబ్రూ రూపానికి సాధ్యమైన మరో అవగాహనను పాదసూచికలో నిలిపాం.
- source_word: עֲפָרָם
  choice: వాటి ధూళిని
  rationale: עָפָר అంటే ధూళి లేదా పొడి మట్టి; బలిపీఠాలను పగులగొట్టిన తర్వాత మిగిలిన పొడిని ఈ పదం చిత్రిస్తుంది.
- source_word: נַחַל קִדְרוֹן
  choice: కిద్రోను లోయలో
  rationale: נַחַל వాగు, వాగులోయ లేదా లోయను సూచించగలదు; భౌగోళిక సందర్భంలో ‘కిద్రోను లోయ’ స్పష్టమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: וַיָּרָץ అనే క్రియార్థంలోని సందిగ్ధత
  choice: అక్కడే వాటిని పగులగొట్టి
  alternative: అక్కడి నుంచి పరుగెత్తి
  rationale: బలిపీఠాల ధూళిని కిద్రోనులో పారవేయడం అనే సందర్భం ‘పగులగొట్టడం’ అర్థానికి బలమిస్తుంది. అయితే మసొరేటిక్ రూపాన్ని רוץ మూలం నుంచి ‘పరుగెత్తాడు’ అని గ్రహించే అవకాశం ఉన్నందున దానిని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. హీబ్రూ వాక్యంలోని ముందుంచిన రెండు కర్మలను తెలుగులో ఒక సమన్విత జాబితాగా ఉంచి, చివర ప్రధాన క్రియలను ఇచ్చాం.
