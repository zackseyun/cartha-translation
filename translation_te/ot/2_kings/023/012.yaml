revisions:
- from: ఆహాజు మేడగది[a] పైకప్పుమీద యూదా రాజులు నిర్మించిన బలిపీఠాలను, యాహ్వే మందిరంలోని రెండు ప్రాంగణాల్లో మనష్షే నిర్మించిన బలిపీఠాలను రాజు పడగొట్టి, అక్కడే వాటిని పగులగొట్టి[b], వాటి ధూళిని కిద్రోను లోయలో[c] పారవేశాడు.
  to: ఆహాజు మేడగది పైకప్పుమీద ఉన్న, యూదా రాజులు నిర్మించిన బలిపీఠాలను, యాహ్వే మందిరపు రెండు ప్రాంగణాల్లో మనష్షే నిర్మించిన బలిపీఠాలను రాజు పడగొట్టి, అక్కడే వాటిని పగులగొట్టి, వాటి ధూళిని కిద్రోను లోయలో పారవేశాడు.
  rationale: వయ్యారెత్సు క్రియకు సంబంధించిన తప్పుదారి పట్టించే సందిగ్ధత పాదసూచికను తొలగించాం. మొదటి కర్మపదబంధంలో ‘ఉన్న’ను చేర్చి, పైకప్పుమీద ఉన్నవి మరియు యూదా రాజులు నిర్మించినవి బలిపీఠాలేనని స్పష్టం చేశాం. మిగిలిన పదజాలం, దైవనామం, మరియు నహల్‌కు ఉన్న భౌగోళిక ప్రత్యామ్నాయాన్ని నిలిపాం.
