    rationale: వַיָּרָץ‌కు ఇక్కడున్న స్వరచిహ్నాలు మరియు వెంటనున్న ‘వారి ధూళిని’ అనే సందర్భం רצץ (‘పగులగొట్టు/నలగగొట్టు’) అర్థానికే మద్దతు ఇస్తాయి. ‘పరుగెత్తి’ అనేది అదే స్వరచిహ్నాలతో ఉన్న పాఠ్యానికి ప్రత్యామ్నాయ అనువాదం కాదు; అందువల్ల ఈ పాదసూచికను తొలగించాలి.
  - severity: low
