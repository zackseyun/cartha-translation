revisions:
- from: అయినా, యెహోవా తన మండుతున్న మహా కోపం నుండి[a] వెనుదిరగలేదు; మనష్షే ఆయనకు కోపం పుట్టించిన కార్యాలన్నిటినిబట్టి ఆయన కోపం యూదాపై[b] రగులుకుంది.
  to: అయినా, యెహోవా మనష్షే ఆయనకు కోపం పుట్టించిన అన్ని రెచ్చగొట్టింపుల కారణంగా యూదాపై రగులుకున్న తన మహా మండే కోపం నుండి[a] వెనుదిరగలేదు[b].
  rationale: 'The revision restores the Hebrew linkage: the anger that burned in/against Judah is the great burning anger from which Yahweh did not turn. It also makes the final causal phrase, referring to all Manasseh''s provocations, clearly modify Yahweh''s not turning. Footnote anchors have been moved so that the first remains on the anger idiom and the second directly marks the rendering of the Judah preposition.'
