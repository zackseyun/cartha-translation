  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: te
  text: అయినా, యెహోవా మనష్షే ఆయనకు కోపం పుట్టించిన అన్ని రెచ్చగొట్టింపుల కారణంగా యూదాపై రగులుకున్న తన మహా మండే కోపం నుండి[a] వెనుదిరగలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన మహా కోపతీవ్రత నుండి.’ హీబ్రూ నుడికారం అక్షరార్థంగా ముక్కు మండడాన్ని ప్రస్తావిస్తూ తీవ్రమైన కోపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యూదాలో రగులుకున్న.’ హీబ్రూ ఉపసర్గ అక్షరార్థంగా ‘లో’ అని ఉన్నా, ఇక్కడ కోపం ఎవరిపై ఉందో తెలుగులో ‘పై’ సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయినా
  rationale: యోషీయా చేసిన సంస్కరణలకు విరుద్ధంగా కొనసాగే పరిస్థితిని సూచించే బలమైన వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁב
  choice: వెనుదిరగలేదు
  rationale: ‘తిరుగు/తిరిగి వెళ్లు’ అనే మూల రూపకాన్ని నిలుపుతూ, కోపం నుండి మళ్లకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHకు తెలుగులో స్థిరపడిన ప్రత్యక్ష రూపాన్ని ఉపయోగిస్తుంది.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: తన మండుతున్న మహా కోపం నుండి
  rationale: తీవ్రమైన కోపాన్ని సూచించే హీబ్రూ ‘మండే కోపం’ నుడికారంలోని చిత్రణను సహజమైన తెలుగులో నిలుపుతుంది; הַגָּדוֹל భావాన్ని ‘మహా’ వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: ఆయన కోపం ... రగులుకుంది
  rationale: హీబ్రూలో పునరావృతమయ్యే కోపం-మండడం చిత్రణను తొలగించకుండా, తెలుగులో గౌరవప్రదంగా అందిస్తుంది.
- source_word: בִּיהוּדָה
  choice: యూదాపై
  rationale: ఉపసర్గ అక్షరార్థంగా ‘యూదాలో’ అని ఉండగలిగినా, కోపం లక్ష్యాన్ని తెలుగులో సహజంగా ‘యూదాపై’ అని తెలియజేస్తుంది.
- source_word: עַל כָּל הַכְּעָסִים
  choice: కార్యాలన్నిటినిబట్టి
  rationale: ఇక్కడ నామవాచకం కోపం పుట్టించే చర్యలను సూచిస్తుంది; తదుపరి క్రియతో కలిపి ఈ భావం స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: הִכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టించిన
  rationale: హిఫీల్ క్రియలోని కారణార్థక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణ.
theological_decisions:
- issue: దేవుని కోపాన్ని మానవ శరీరానుభూతి భాషలో వర్ణించడం
  choice: ‘మండుతున్న మహా కోపం’, ‘కోపం ... రగులుకుంది’ అనే మూల చిత్రణను నిలుపడం
  alternative: ‘తీవ్రమైన అసంతృప్తి’ వంటి అమూర్తమైన పదాలతో మృదువుగా అనువదించడం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా తీవ్రమైన, మండే కోపపు నుడికారాన్ని రెండుసార్లు వాడుతుంది. దానిని సిద్ధాంతపరంగా వివరించకుండా యథాతథ భావంతో నిలుపడం సముచితం.
- issue: దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని ప్రత్యేక దైవనామం יְהוָהను సాధారణ బిరుదుగా మార్చకుండా తెలుగులో ప్రత్యక్షంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. సెమీకోలన్ మూలంలోని ఒకే వాక్య సంబంధాన్ని నిలుపుతూ దీర్ఘమైన సంబంధవాచక నిర్మాణాన్ని సులభంగా చదివేలా చేస్తుంది; కోపం-రగులుకోవడం అనే హీబ్రూ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
