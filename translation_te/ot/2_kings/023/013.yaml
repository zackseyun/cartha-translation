source:
  edition: WLC
  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: te
  text: యెరూషలేముకు ఎదురుగా[a], నాశన పర్వతానికి[c] కుడివైపున[b] ఉన్న ఉన్నత పూజాస్థలాలను కూడా రాజు అపవిత్రం చేశాడు. ఇశ్రాయేలు రాజైన సొలొమోను వాటిని సీదోనీయుల హేయదైవమైన అష్తోరెతు కోసం, మోయాబు హేయదైవమైన కెమోషు కోసం, అమ్మోనీయుల హేయదైవమైన మిల్కోము[d] కోసం కట్టించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెరూషలేముకు తూర్పున.’ హీబ్రూ పదబంధానికి ‘ఎదురుగా’ అనే అర్థం ఉంది; ఈ భౌగోళిక సందర్భంలో అది తూర్పు దిశను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘కుడివైపున.’ తూర్పు వైపు ముఖం పెట్టి దిశలను చెప్పే పద్ధతిలో ఇది ‘దక్షిణాన’ అని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: ‘నాశన పర్వతం’; ఇది తరువాత ‘ఒలీవ పర్వతం’గా గుర్తించబడిన కొండ కావచ్చు.'
    reason: cross_reference
  - marker: d
    text: హీబ్రూ పాఠంలో ‘మిల్కోము’ అని ఉంది; కొందరు ఈ దేవతను ‘మోలెకు’తో అనుబంధిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: ఈ పదం ఎత్తైన ప్రదేశాలను మాత్రమే కాక, అక్కడి ఆరాధనా కేంద్రాలను సూచిస్తుంది. ‘ఉన్నత పూజాస్థలాలు’ ఆ ఆచారపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: యెరూషలేముకు ఎదురుగా
  rationale: హీబ్రూ జాతీయాన్ని అతిగా నిర్దిష్టమైన భౌగోళిక దిశగా మార్చకుండా, ‘ఎదురుగా/ముందుగా’ అనే స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: నాశన పర్వతానికి కుడివైపున
  rationale: מִימִין యొక్క ప్రత్యక్ష అర్థమైన ‘కుడివైపు’ను ప్రధాన పాఠ్యంలో ఉంచి, దిశాపరంగా ‘దక్షిణాన’ కావచ్చనే అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: הַר הַמַּשְׁחִית
  choice: నాశన పర్వతం
  rationale: హీబ్రూలోని ఉద్దేశపూర్వక నిందార్థక స్థలనామాన్ని అనువదించాం; దానిని ‘ఒలీవ పర్వతం’గా నేరుగా మార్చలేదు.
- source_word: שִׁקֻּץ / תּוֹעֲבָה
  choice: హేయదైవం
  rationale: విదేశీ దేవతల గురించి మూలపాఠ్యంలో ఉన్న తీవ్రమైన ఆరాధనాపరమైన తిరస్కారాన్ని సహజమైన, అర్థమయ్యే తెలుగులో వ్యక్తపరుస్తుంది; తటస్థమైన ‘దేవుడు’ అనే పదంతో ఆ తీవ్రతను తగ్గించదు.
- source_word: עַשְׁתֹּרֶת / כְּמוֹשׁ / מִלְכֹּם
  choice: అష్తోరెతు / కెమోషు / మిల్కోము
  rationale: మూలంలోని దైవనామాలను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; ముఖ్యంగా మిల్కోమును ప్రధాన పాఠ్యంలో మోలెకుతో కలపలేదు.
- source_word: טִמֵּא
  choice: అపవిత్రం చేశాడు
  rationale: ఈ ఆరాధనా స్థలాలు ఇక పూజకు పనికిరాకుండా రాజు వాటిని అపవిత్రపరచిన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విదేశీ దేవతలకు వాడిన నిందార్థక పదాలు
  choice: ‘హేయదైవం’ అని అనువదించడం
  alternative: ‘హేయమైన వస్తువు’ లేదా తటస్థంగా ‘దేవుడు’
  rationale: שִׁקּוּץ మరియు תּוֹעֵבָה పదాల్లోని ఉద్దేశపూర్వకమైన ఆరాధనాపరమైన ఖండనను నిలుపుతూ, తెలుగులో దేవతనే సూచిస్తున్నది స్పష్టంగా ఉండేలా చేశాం.
- issue: הַר הַמַּשְׁחִית అనే స్థలనామం
  choice: ‘నాశన పర్వతం’ అని అనువదించడం
  alternative: ‘భ్రష్టత పర్వతం’ లేదా ‘ఒలీవ పర్వతం’
  rationale: మూలపాఠ్యంలోని నిందార్థక పదప్రయోగాన్ని నిలిపి, సంభావ్య చారిత్రక గుర్తింపును ప్రధాన పాఠ్యంపై రుద్దకుండా పాదసూచికకు పరిమితం చేశాం.
- issue: మిల్కోము మరియు మోలెకు మధ్య సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘మిల్కోము’
  alternative: ‘మోలెకు’
  rationale: హీబ్రూ వ్యంజన పాఠం మిల్కోమును సూచిస్తుంది. చారిత్రక లేదా అనువాద సంప్రదాయంలోని అనుబంధాన్ని పాదసూచికలో మాత్రమే తెలిపి, రెండు పేర్లను నిశ్చయంగా ఒకటిగా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన హీబ్రూ సంబంధవాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి అర్థస్పష్టతను పెంచాం; ‘కూడా’ ద్వారా సందర్భంలోని וְאֶת అనుసంధానాన్ని నిలిపాం. దైవనామాలకు సాధారణ తెలుగు విభక్తి రూపాలను వాడాం.
