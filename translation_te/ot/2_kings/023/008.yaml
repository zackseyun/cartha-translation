  revised_text: అతడు యూదా పట్టణాలన్నిటి నుండి యాజకులందరినీ రప్పించి, గెబా నుండి బెయేర్షెబా వరకు ఆ యాజకులు ధూపం కాల్చిన ఉన్నత పూజాస్థలాలను అపవిత్రం చేశాడు.[a] నగర అధికారి యెహోషువ ద్వారపు ప్రవేశం దగ్గరున్న ద్వారాల ఉన్నత పూజాస్థలాలను కూడా కూల్చివేశాడు. అవి నగర ద్వారం వద్ద ఒక వ్యక్తికి ఎడమవైపున ఉండేవి.[b]
