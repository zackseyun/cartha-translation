source:
  edition: WLC
  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: te
  text: అతడు యూదా పట్టణాలన్నిటి నుండి యాజకులందరినీ రప్పించి, గెబా నుండి బెయేర్షెబా వరకు ఆ యాజకులు ధూపం కాల్చిన ఉన్నత పూజాస్థలాలను అపవిత్రం చేశాడు.[a] నగర అధికారి యెహోషువ ద్వారపు ప్రవేశం దగ్గరున్న ద్వారాల ఉన్నత పూజాస్థలాలను కూడా కూల్చివేశాడు. అవి నగర ద్వారం వద్ద ఒక వ్యక్తికి ఎడమవైపున ఉండేవి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధూపం కాల్చిన’ అని అనువదించిన హీబ్రూ పదం, మరింత విస్తృతంగా ‘పొగ వచ్చే అర్పణలు సమర్పించిన’ అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం అక్షరార్థంగా ‘నగర ద్వారం వద్ద ఒక వ్యక్తికి ఎడమవైపున’ అని ఉంది; దాని నిర్మాణం క్లిష్టమైనది. బహుశా ద్వారం గుండా ప్రవేశించేవారికి ఎడమవైపును సూచిస్తుంది.
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיָּבֵא
  choice: రప్పించి
  rationale: בוא హిఫీల్ రూపం ‘రప్పించడం/తీసుకురావడం’ అనే అర్థాన్ని ఇస్తుంది. సందర్భంలో యూదా పట్టణాల నుండి యాజకులను తన వద్దకు రప్పించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵעָרֵי יְהוּדָה
  choice: యూదా పట్టణాలన్నిటి నుండి
  rationale: עָרִים పట్టణాలు లేదా నగరాలు కావచ్చు. సాధారణ ఆధునిక తెలుగులో ‘పట్టణాలు’ విస్తృతంగా సరిపోతుంది; כָּל భావాన్ని ‘అన్నిటి’ ద్వారా స్పష్టంగా ఉంచాం.
- source_word: וַיְטַמֵּא
  choice: అపవిత్రం చేశాడు
  rationale: పీయేల్ טמא ఆరాధనాపరంగా అపవిత్రం చేయడం లేదా వినియోగానికి అనర్హం చేయడాన్ని సూచిస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: בָּמוֹת స్థానిక ఆరాధనా స్థలాలకు వాడే పదం. ‘ఉన్నత స్థలాలు’ అనే రూపాన్ని నిలుపుతూ, ఆధునిక పాఠకునికి భావం స్పష్టమయ్యేలా ‘పూజా’ చేర్చాం.
- source_word: קִטְּרוּ שָׁמָּה
  choice: ధూపం కాల్చిన
  rationale: קטר పీయేల్ ధూపం లేదా పొగ వచ్చే అర్పణను కాల్చడాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘ధూపం కాల్చిన’ను ఎంచుకుని విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: గెబ నుండి బెయేర్షెబా వరకు
  rationale: ఉత్తరం నుండి దక్షిణం వరకు యూదా ప్రాంత విస్తారాన్ని సూచించే భౌగోళిక జంటను పేర్లతో యథాతథంగా నిలిపాం.
- source_word: וְנָתַץ
  choice: కూడా కూల్చివేశాడు
  rationale: נתץ నిర్మాణాలను పడగొట్టడం లేదా ధ్వంసం చేయడాన్ని సూచిస్తుంది; ‘కూల్చివేశాడు’ సహజమైన, బలమైన తెలుగు రూపం.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: ద్వారాల ఉన్నత పూజాస్థలాలు
  rationale: హీబ్రూ సమాసాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా నిలిపాం. ఇది ‘ద్వారాల దగ్గరున్న పూజాస్థలాలు’ అనే సంబంధాన్ని సూచించవచ్చు.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ שַׂר הָעִיר
  choice: నగర అధికారి యెహోషువ ద్వారపు ప్రవేశం దగ్గరున్న
  rationale: పదబంధంలోని ద్వారం, ప్రవేశం రెండింటినీ నిలిపి, שַׂר‌ను రాజపదవిగా కాక పౌర పరిపాలనా పాత్రగా ‘నగర అధికారి’ అని ఇచ్చాం.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: అవి నగర ద్వారం గుండా ప్రవేశించే వ్యక్తికి ఎడమవైపున ఉండేవి
  rationale: మూలంలోని ‘నగర ద్వారం వద్ద ఒక వ్యక్తికి ఎడమవైపు’ అనే సంక్షిప్తమైన, క్లిష్టమైన మాటను సందర్భానుసారంగా సహజీకరించాం; ఇది ప్రవేశించే దిశను సూచిస్తుందనే భావాన్ని పాదసూచికలో సంభావ్యతగా గుర్తించాం.
theological_decisions:
- issue: యోషీయా చర్యలో ‘అపవిత్రం చేయడం’ యొక్క స్వభావం
  choice: ఆరాధనాపరమైన ‘అపవిత్రం చేశాడు’ అనే పదాన్ని నిలిపాం
  alternative: ‘నాశనం చేశాడు’ లేదా ‘వాడుకోలేనివిగా చేశాడు’
  rationale: טמא యొక్క ఆచారపరమైన భావాన్ని సాధారణ విధ్వంసంగా మార్చితే మూలంలోని ప్రత్యేకత పోతుంది; ఏ ప్రత్యేక మతశాఖ వివరణనూ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఉన్నత పూజాస్థలాలు’ వంటి బైబిలు-ఆరాధనా పదాలకు పాఠకునికి అర్థమయ్యే సూచనను జోడించాం; క్లిష్టమైన చివరి భౌగోళిక వాక్యాన్ని అతిగా నిశ్చయించకుండా ప్రధాన పాఠ్యం మరియు పాదసూచిక మధ్య సమతుల్యం పాటించాం.
