  revision_rationale: చివరి క్లిష్ట భౌగోళిక/స్థానసూచక పదబంధంలో ప్రస్తుత ప్రధాన పాఠ్యం చేర్చిన ‘ద్వారం గుండా ప్రవేశించే’ అనే వ్యాఖ్యానాన్ని తొలగించాం, ఎందుకంటే అది హీబ్రూలో స్పష్టంగా లేదు. అదే సాధ్యమైన అర్థాన్ని పాదసూచికలో సంభావ్యతగా నిలిపాం. ‘గెబ’ను ‘గెబా’గా సవరించాం. మిగిలిన పాఠ్యం మూలార్థాన్ని, రిజిస్టర్‌ను, మరియు పదజాలాన్ని సముచితంగా కాపాడుతుంది.
