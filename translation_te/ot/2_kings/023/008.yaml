revisions:
- from: అతడు యూదా పట్టణాలన్నిటి నుండి యాజకులందరినీ రప్పించి, గెబ నుండి బెయేర్షెబా వరకు ఆ యాజకులు ధూపం కాల్చిన ఉన్నత పూజాస్థలాలను అపవిత్రం చేశాడు.[a] నగర అధికారి యెహోషువ ద్వారపు ప్రవేశం దగ్గరున్న ద్వారాల ఉన్నత పూజాస్థలాలను కూడా కూల్చివేశాడు. అవి నగర ద్వారం గుండా ప్రవేశించే వ్యక్తికి ఎడమవైపున ఉండేవి.[b]
  to: అతడు యూదా పట్టణాలన్నిటి నుండి యాజకులందరినీ రప్పించి, గెబా నుండి బెయేర్షెబా వరకు ఆ యాజకులు ధూపం కాల్చిన ఉన్నత పూజాస్థలాలను అపవిత్రం చేశాడు.[a] నగర అధికారి యెహోషువ ద్వారపు ప్రవేశం దగ్గరున్న ద్వారాల ఉన్నత పూజాస్థలాలను కూడా కూల్చివేశాడు. అవి నగర ద్వారం వద్ద ఒక వ్యక్తికి ఎడమవైపున ఉండేవి.[b]
  rationale: చివరి క్లిష్ట భౌగోళిక/స్థానసూచక పదబంధంలో ప్రస్తుత ప్రధాన పాఠ్యం చేర్చిన ‘ద్వారం గుండా ప్రవేశించే’ అనే వ్యాఖ్యానాన్ని తొలగించాం, ఎందుకంటే అది హీబ్రూలో స్పష్టంగా లేదు. అదే సాధ్యమైన అర్థాన్ని పాదసూచికలో సంభావ్యతగా నిలిపాం. ‘గెబ’ను ‘గెబా’గా సవరించాం. మిగిలిన పాఠ్యం మూలార్థాన్ని, రిజిస్టర్‌ను, మరియు పదజాలాన్ని సముచితంగా కాపాడుతుంది.
