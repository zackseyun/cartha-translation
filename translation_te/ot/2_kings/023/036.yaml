  rationale: రాజుగా పాలన సాగించడాన్ని తెలియజేసే క్రియార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పాలన జరిగిన కేంద్రాన్ని సూచించే స్థానార్థక ప్రయోగం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: వంశావళి సూత్రంలోని సమాచార నిర్మాణాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: זבידה
  choice: జెబీదా
