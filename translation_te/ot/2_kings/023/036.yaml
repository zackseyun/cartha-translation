  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: te
  text: యెహోయాకీము రాజైనప్పుడు అతనికి ఇరవై ఐదు సంవత్సరాలు.[a] అతడు యెరూషలేములో పదకొండు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు జెబీదా; ఆమె రూమా ఊరికి చెందిన పెదాయా కుమార్తె.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానుసారంగా, “యెహోయాకీము రాజైనప్పుడు ఇరవై ఐదు సంవత్సరాల కుమారుడు.”
    reason: lexical_alternative
  - marker: b
    text: “జెబీదా” అనే పేరును కొన్ని లిప్యంతరీకరణ సంప్రదాయాల్లో “జెబూదా” అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: అతనికి ఇరవై ఐదు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అర్థస్పష్టంగా అందిస్తుంది.
- source_word: בְּמָלְכוֹ
