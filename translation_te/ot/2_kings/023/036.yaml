- source_word: בַת פְּדָיָה
  choice: పెదాయా కుమార్తె
  rationale: తండ్రి-కుమార్తె సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מִן רוּמָה
  choice: రూమా ఊరికి చెందిన
  rationale: מִן ఇక్కడ మూలస్థలం లేదా స్వస్థలాన్ని సూచిస్తుంది; తెలుగులో ‘ఊరికి చెందిన’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
