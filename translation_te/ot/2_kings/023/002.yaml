source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: te
  text: అప్పుడు రాజు యాహ్వే మందిరానికి[a] ఎక్కి వెళ్లాడు; అతనితో పాటు యూదా పురుషులందరూ[b], యెరూషలేము నివాసులందరూ, యాజకులు, ప్రవక్తలు, అల్పుల నుండి ఘనుల వరకు ప్రజలందరూ వెళ్లారు. యాహ్వే మందిరంలో దొరికిన నిబంధన గ్రంథంలోని మాటలన్నిటినీ రాజు వారి వినికిడిలో చదివాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే ఇంటికి.’ లేదా, ‘యాహ్వే మందిరానికి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో, ‘యూదా పురుషులందరూ.’ ఈ మాట మొత్తం ప్రజలకు ప్రాతినిధ్యంగా కూడా ఉపయోగించబడి ఉండవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కి వెళ్లాడు
  rationale: עלהలోని పైకి వెళ్లే దిశాభావాన్ని నిలుపుతూ, తెలుగు వాక్యంలో సహజంగా ఉండేలా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: మూలంలోని ‘యాహ్వే ఇల్లు’ అనే రూపకాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేయడానికి ‘మందిరం’ వాడాం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: כָל אִישׁ יְהוּדָה
  choice: యూదా పురుషులందరూ
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా ఇక్కడ సమూహార్థకంగా ఉంది; దాని పురుషవాచక రూపాన్ని తెలుగులో నిలిపాం.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: యెరూషలేము నివాసులందరూ
  rationale: ఆ పట్టణంలో నివసించేవారిని సూచించే participial expressionకు సహజమైన తెలుగు సమానార్థకం.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: చిన్నవారి నుంచి గొప్పవారి వరకు
  rationale: వయస్సును మాత్రమే కాక సమాజంలోని పూర్తి పరిధిని సూచించే హీబ్రూ జాతీయాన్ని రూపసామ్యంతో నిలిపాం.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: వారికి వినిపించేలా చదివాడు
  rationale: గ్రంథంలోని విషయాన్ని బహిరంగంగా చదివి వినిపించాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סֵפֶר הַבְּרִית
  choice: నిబంధన గ్రంథం
  rationale: ‘ఒడంబడిక/నిబంధనకు సంబంధించిన గ్రంథం’ అనే స్థిరమైన భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది; ‘యెహోవా’ కంటే ‘యాహ్వే’ సాధారణంగా అంగీకరించిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉంది.
- issue: כָל אִישׁ יְהוּדָהలోని పురుషవాచక సమూహపదం
  choice: యూదా పురుషులందరూ
  alternative: యూదా ప్రజలందరూ
  rationale: మూలంలోని אִישׁ పురుషవాచకతను అనవసరంగా తటస్థీకరించకుండా నిలిపాం; అది విస్తృత ప్రజాసమూహానికి ప్రాతినిధ్యంగా ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో తెలిపాం.
- issue: לְמִקָּטֹן וְעַד גָּדוֹל అనే జాతీయం
  choice: చిన్నవారి నుంచి గొప్పవారి వరకు
  alternative: అల్పుల నుంచి ఘనుల వరకు / పిన్నల నుంచి పెద్దల వరకు
  rationale: దీనిని కేవలం వయస్సుకు పరిమితం చేయకుండా, సామాజిక స్థాయి సహా పూర్తి పరిధిని సూచించే మూలంలోని ఉద్దేశపూర్వక విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి వాడాం. ‘యాహ్వే,’ ‘నిబంధన గ్రంథం,’ ‘యాజకులు,’ ‘ప్రవక్తలు’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచుతూ, ‘వారికి వినిపించేలా చదివాడు’ వంటి సహజ తెలుగు నిర్మాణాలను ఎంచుకున్నాం.
