  text: וַ/יֵּצְא֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בֵּֽית אֵל֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: te
  text: అప్పుడు బేతేలులో ఉన్న ప్రవక్తల శిష్యులు ఎలీషా దగ్గరికి వచ్చి, “ఈ రోజు యాహ్వే నీ యజమానిని నీ తలమీద నుండి తీసుకుపోతున్నాడని[a] నీకు తెలుసా?” అని అడిగారు. అతడు, “నాకూ తెలుసు; మౌనంగా ఉండండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీపై అధికారిగా ఉండకుండా.’ హీబ్రూలో అక్షరార్థంగా ‘నీ తలమీద నుండి’ అని ఉంది; ఇది ఒకరిపై అధికారంలో ఉన్న వ్యక్తి తొలగించబడడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: ప్రవక్తల శిష్యులు
  rationale: ‘ప్రవక్తల కుమారులు’ అనే అక్షరార్థ రూపం ఆధునిక తెలుగులో వారి నిజమైన పిల్లలు అనే అపార్థం కలిగించవచ్చు. ఇక్కడి హీబ్రూ సంబంధసూచక నుడికారం ప్రవక్తల సమూహంలో శిక్షణ పొందుతున్న వారిని సూచిస్తుంది కాబట్టి ‘శిష్యులు’ సహజంగా భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: బేతేలులో ఉన్న
  rationale: ఈ ప్రవక్తల సమూహాన్ని వారి స్థలంతో గుర్తిస్తున్న హీబ్రూ ఉపవాక్యాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: הֲיָדַעְתָּ
  choice: నీకు తెలుసా?
  rationale: హీబ్రూ ప్రశ్నను సందర్భానుకూలమైన వర్తమాన తెలుగు ప్రశ్నగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించి వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: לֹקֵחַ
  choice: తీసుకుపోనున్నాడు
  rationale: వర్తమాన కృదంతం ఇక్కడ అదే రోజు జరగబోయే సమీప చర్యను సూచిస్తుంది; తెలుగు రూపం ఆ ఆసన్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנֶיךָ
  choice: నీ యజమానిని
  rationale: ఇక్కడ పదం దేవుణ్ణి కాక ఎలీషాపై గురువుగా, అధికారిగా ఉన్న ఏలీయాను సూచిస్తుంది.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: నీ తలమీద నుండి
  rationale: అధికారస్థానంలో ఉన్న వ్యక్తిని తొలగించడం అనే హీబ్రూ రూపకాన్ని వివరణతో భర్తీ చేయకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: నాకూ తెలుసు
  rationale: גַּם אֲנִי లోని ‘నాకూ/నేనూ’ అనే భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: הֶחֱשׁוּ
  choice: మౌనంగా ఉండండి
  rationale: సమూహాన్ని ఉద్దేశించిన బహువచన ఆజ్ఞ యొక్క గంభీరతను, బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: మֵעַל רֹאשֶׁךָ లోని అధికార రూపకం
  choice: నీ తలమీద నుండి
  alternative: నీపై అధికారిగా ఉండకుండా
  rationale: హీబ్రూలోని స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, దాని అధికార సంబంధ భావాన్ని పాదసూచికలో వివరిస్తుంది; తద్వారా రూపకాన్ని మౌనంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలోని బహువచన ఆజ్ఞను స్పష్టంగా ఉంచి, హీబ్రూ అధికార రూపకాన్ని పాదసూచిక సహాయంతో ప్రధాన పాఠ్యంలో నిలుపుకున్నాం.
