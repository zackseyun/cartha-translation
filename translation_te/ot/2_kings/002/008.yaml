id: 2KI.2.8
reference: 2 Kings 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: te
  text: అప్పుడు ఏలీయా తన పైవస్త్రాన్ని[a] తీసుకొని, దాన్ని చుట్టి నీళ్లను కొట్టాడు. నీళ్లు ఇటూ అటూ[b] విడిపోయాయి; వారిద్దరూ పొడి నేలమీదుగా దాటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన ఉత్తరీయాన్ని.’ హీబ్రూ పదం ఏలీయా ధరించిన బయటి వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఇటూ అటూ విడిపోయాయి’; అంటే, రెండు ఎదురెదురు వైపులకు విడిపోయాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: తన పైవస్త్రాన్ని
  rationale: אַדֶּרֶת ఇక్కడ ఏలీయా ధరించిన ప్రత్యేకమైన బయటి వస్త్రాన్ని సూచిస్తుంది. ‘పైవస్త్రం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, దాన్ని తీసుకొని చుట్టి ఉపయోగించిన సందర్భానికి సరిపోతుంది.
- source_word: וַיִּגְלֹם
  choice: దాన్ని చుట్టి
  rationale: ఈ క్రియ వస్త్రాన్ని కలిపి చుట్టడాన్ని సూచిస్తుంది. ‘చుట్టి’ భౌతిక చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: నీటిని కొట్టాడు
  rationale: נכה యొక్క సాధారణ అర్థమైన ‘కొట్టు’ను నేరుగా నిలుపుతూ, చర్య యొక్క బలాన్ని అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּחָצוּ
  choice: నీళ్లు ... విడిపోయాయి
  rationale: హీబ్రూ క్రియ బహువచనంలో ఉంది; దాని భావిత కర్త నీళ్లు. తెలుగు బహువచన రూపం మూలంలోని వ్యాకరణ రూపాన్నీ, ఫలితస్థితినీ సహజంగా కాపాడుతుంది.
- source_word: הֵנָּה וָהֵנָּה
  choice: ఇటూ అటూ
  rationale: నీళ్లు రెండు ఎదురెదురు వైపులకు తొలగిపోవడాన్ని మూలంలోని సంక్షిప్త ద్విదిశా ప్రయోగానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: వారిద్దరూ ... దాటారు
  rationale: שְׁנֵיהֶם లోని ఇద్దరిపైన స్పష్టమైన దృష్టిని ‘వారిద్దరూ’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בֶּחָרָבָה
  choice: ఆరిన నేలమీదుగా
  rationale: నీరు తొలగిన చోట బయటపడిన పొడి నేలను సూచిస్తుంది. ‘ఆరిన నేల’ అద్భుతమైన దాటివెళ్లే సందర్భంలో అర్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיִּקַּח
  choice: అప్పుడు ... తీసుకొని
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: నీళ్లు అద్భుతంగా విడిపోవడం
  choice: ఏలీయా నీటిని కొట్టిన తరువాత నీళ్లు విడిపోయి, వారిద్దరూ ఆరిన నేలమీదుగా దాటినట్లు కథనాన్ని సూటిగా అనువదించడం.
  alternative: ‘నీళ్లు పక్కకు తొలగాయి’ వంటి మరింత వివరణాత్మక రూపం ఉపయోగించడం.
  rationale: హీబ్రూ పాఠం అద్భుత సంఘటనను నేరుగా వివరిస్తుంది. దాన్ని సహజ ప్రక్రియగా మార్చకుండా, అదనపు ధార్మిక వివరణను చేర్చకుండా అదే కథన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, నీళ్లకు సంబంధించిన బహువచన రూపం, ‘వారిద్దరూ’ అనే ద్వంద్వ ఉద్ఘాటన నిలుపబడ్డాయి.
