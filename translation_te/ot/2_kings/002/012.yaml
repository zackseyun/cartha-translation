id: 2KI.2.12
reference: 2 Kings 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וֶ/אֱלִישָׁ֣ע רֹאֶ֗ה וְ/ה֤וּא מְצַעֵק֙ אָבִ֣/י אָבִ֗/י רֶ֤כֶב יִשְׂרָאֵל֙ וּ/פָ֣רָשָׁ֔י/ו וְ/לֹ֥א רָאָ֖/הוּ ע֑וֹד וַֽ/יַּחֲזֵק֙ בִּ/בְגָדָ֔י/ו וַ/יִּקְרָעֵ֖/ם לִ/שְׁנַ֥יִם קְרָעִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: te
  text: 'ఎలీషా చూస్తూ ఇలా కేకలు వేస్తున్నాడు: “నా తండ్రీ, నా తండ్రీ! ఇశ్రాయేలు రథం, దాని రౌతులు!” తర్వాత ఎలీషా ఏలీయాను ఇక చూడలేదు. అప్పుడు అతడు తన బట్టలను పట్టుకుని వాటిని రెండు ముక్కలుగా చింపేశాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאֶה
  choice: చూస్తూనే
  rationale: హీబ్రూ వర్తమాన కృదంతం కొనసాగుతున్న దృశ్యక్రియను సూచిస్తుంది; తెలుగు కథనంలో ‘చూస్తూనే’ ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: מְצַעֵק
  choice: కేకలు వేస్తున్నాడు
  rationale: ఈ కృదంతం కూడా కొనసాగుతున్న, భావోద్వేగభరితమైన అరుపును సూచిస్తుంది. ‘కేకలు వేస్తున్నాడు’ తీవ్రతను నిలుపుతూ సహజమైన ఆధునిక తెలుగు వాడుకగా ఉంటుంది.
- source_word: אָבִי אָבִי
  choice: నా తండ్రీ, నా తండ్రీ!
  rationale: ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని, పునరుక్తి వల్ల కలిగే భావోద్వేగ తీవ్రతను నిలుపుతుంది; ఇది జీవసంబంధ పితృత్వాన్ని తప్పనిసరిగా సూచించదు.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: ఇశ్రాయేలు రథం, దాని రౌతులు
  rationale: ‘రథం’ అనే ఏకవచనాన్ని, ‘రౌతులు’ అనే బహువచనాన్ని, పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలుపుతుంది. వ్యాఖ్యానాన్ని ప్రధాన వచనంలో చేర్చకుండా ఆశ్చర్యోద్గార రూపంలో ఉంచుతుంది.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: అతనికి ఏలీయా ఇక కనిపించలేదు
  rationale: ‘ఇక’ కొనసాగింపు ముగిసిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. హీబ్రూలోని సర్వనామ సూచనను తెలుగు పాఠకునికి స్పష్టంగా ఉండేందుకు ‘ఏలీయా’గా వ్యక్తీకరించింది.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: తన బట్టలను పట్టుకొని
  rationale: కర్త తనకే చెందిన వస్త్రాలను పట్టుకున్నాడనే సందర్భార్థాన్ని తెలుగు ప్రత్యావర్తక ‘తన’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: వాటిని రెండుగా చింపేశాడు
  rationale: వస్త్రాలను దుఃఖసూచకంగా రెండు భాగాలుగా చింపిన ఫలితాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
theological_decisions:
- issue: ‘నా తండ్రీ... ఇశ్రాయేలు రథం, దాని రౌతులు’ అనే ఎలీషా కేక యొక్క అర్థం
  choice: ప్రధాన వచనంలో రూపకాన్ని వ్యాఖ్యానించకుండా నేరుగా ఆశ్చర్యోద్గారంగా అనువదించడం
  alternative: ఏలీయానే ఇశ్రాయేలు నిజమైన బలమూ రక్షణయూ అని ఎలీషా సంబోధిస్తున్నాడు; లేదా తాను చూస్తున్న పరలోక రథాన్నీ రౌతులనూ ఎలీషా సూచిస్తున్నాడు
  rationale: హీబ్రూ వాక్యం ఏలీయా ప్రాముఖ్యతను తెలిపే సమానాధికరణ కేకగానూ, దర్శనంలోని పరలోక దృశ్యానికి సూచనగానూ అర్థమయ్యే అవకాశం ఇస్తుంది. అందువల్ల ప్రధాన వచనం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి ఉపయోగించబడింది. కొనసాగుతున్న కృదంత క్రియలు తెలుగు సహజత్వానికి అనుగుణంగా ‘చూస్తూనే’, ‘కేకలు వేస్తున్నాడు’గా ఇవ్వబడ్డాయి; అసలు వచనంలోని వ్యాఖ్యాన అనిశ్చితి పాదటిప్పణిలో నిలుపబడింది.
