id: 2KI.2.4
reference: 2 Kings 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: te
  text: ఏలీయా అతనితో, “ఎలీషా, దయచేసి ఇక్కడే ఉండు; ఎందుకంటే యహ్వే నన్ను యెరికోకు పంపాడు” అన్నాడు. అయితే ఎలీషా, “యహ్వే జీవం తోడు, నీ ప్రాణం తోడు, నేను నిన్ను విడిచిపెట్టను” అన్నాడు. అప్పుడు వారు యెరికోకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: దయచేసి ఇక్కడే ఉండు
  rationale: ישׁב అనే క్రియకు ‘కూర్చో,’ ‘ఉండు,’ ‘నిలిచిపో’ అనే అర్థాలు ఉండవచ్చు. ఏలీయాతో ప్రయాణాన్ని కొనసాగించకుండా అక్కడే ఉండమనే సందర్భార్థాన్ని ‘ఇక్కడే ఉండు’ సహజంగా తెలియజేస్తుంది; נָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’ వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణ ‘యహ్వే’గా ఉంచాం.
- source_word: שְׁלָחַנִי
  choice: నన్ను ... పంపాడు
  rationale: పూర్తయిన పంపడాన్ని సూచించే హీబ్రూ perfect రూపాన్ని తెలుగులో సహజమైన భూతకాలంతో అందించాం; ఆ పంపకం వల్ల ప్రస్తుతం ప్రయాణం జరుగుతోందనే సందర్భం స్పష్టంగానే ఉంది.
- source_word: יְרִיחוֹ
  choice: యెరికో
  rationale: స్థలనామానికి తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: חַי יְהוָה
  choice: యహ్వే జీవిస్తున్నంత నిశ్చయంగా
  rationale: ఇది గంభీరమైన ప్రమాణ సూత్రం. పదక్షరంగా అసహజమైన ‘యహ్వే జీవం తోడు’కు బదులు, యహ్వే జీవిస్తున్నాడనే నిశ్చయతపై చేసిన ప్రమాణ బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేసింది.
- source_word: וְחֵי נַפְשְׁךָ
  choice: నీవు జీవిస్తున్నంత నిశ్చయంగా
  rationale: נפשׁ ఇక్కడ విడిగా ఉన్న అమూర్తమైన ‘ఆత్మ’ను కాక వ్యక్తి ప్రాణాన్ని లేదా సజీవ వ్యక్తినే సూచిస్తుంది. ముందున్న ప్రమాణ వాక్యంతో సమాంతరతను నిలుపుతూ వ్యక్తి జీవాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: నేను నిన్ను విడిచిపెట్టను
  rationale: ప్రమాణ నిర్మాణంలో אִם పదక్షరంగా ‘ఒకవేళ’ అయినా, అపూర్ణ ప్రమాణ శాపవాక్యంగా ఇది బలమైన నిరాకరణను సూచిస్తుంది. అందువల్ల తెలుగులో అంతర్లీనమైన నిరాకరణను స్పష్టంగా తెలిపాం.
- source_word: וַיָּבֹאוּ
  choice: కాబట్టి వారిద్దరూ ... వచ్చారు
  rationale: wayyiqtol కథనాన్ని ముందుకు నడిపిస్తుంది. ఇద్దరూ కలిసి చేరుకున్నారని తెలుగు పాఠకునికి సహజంగా స్పష్టంచేయడానికి ‘వారిద్దరూ’ వాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని ఒక బిరుదుతో మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: חַי יְהוָה וְחֵי נַפְשְׁךָ అనే ప్రమాణ సూత్రం
  choice: యహ్వే జీవిస్తున్నంత నిశ్చయంగా, నీవు జీవిస్తున్నంత నిశ్చయంగా
  alternative: యహ్వే జీవం తోడు, నీ ప్రాణం తోడు
  rationale: ప్రమాణపు గంభీరతను, రెండు భాగాల సమాంతరతను నిలిపి, נפשׁను నిర్దిష్ట ఆత్మతత్వ సిద్ధాంతంగా అర్థం చేసుకోకుండా సజీవ వ్యక్తిని సూచించే సందర్భార్థంతో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అన్నాడు’ పునరుక్తి సంభాషణకర్తలను స్పష్టంగా ఉంచుతుంది. ప్రమాణ సూత్రం పదక్షర రూపం కంటే అర్థసమానంగా ఇవ్వబడినా, దాని గంభీరత మరియు సమాంతర నిర్మాణం కాపాడబడ్డాయి.
