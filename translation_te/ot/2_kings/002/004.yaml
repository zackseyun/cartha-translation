revisions:
- from: ఏలీయా అతనితో, “ఎలీషా, దయచేసి ఇక్కడే ఉండు; ఎందుకంటే యహ్వే నన్ను యెరికోకు పంపాడు” అన్నాడు. అయితే ఎలీషా, “యహ్వే జీవిస్తున్నంత నిశ్చయంగా, నీవు జీవిస్తున్నంత నిశ్చయంగా చెబుతున్నాను—నేను నిన్ను విడిచిపెట్టను” అన్నాడు. కాబట్టి వారిద్దరూ యెరికోకు వచ్చారు.
  to: ఏలీయా అతనితో, “ఎలీషా, దయచేసి ఇక్కడే ఉండు; ఎందుకంటే యహ్వే నన్ను యెరికోకు పంపాడు” అన్నాడు. అయితే ఎలీషా, “యహ్వే జీవం తోడు, నీ ప్రాణం తోడు, నేను నిన్ను విడిచిపెట్టను” అన్నాడు. అప్పుడు వారు యెరికోకు వచ్చారు.
