  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: te
  text: యాహ్వే ఏలీయాను సుడిగాలిలో[a] ఆకాశానికి[b] ఎత్తుకుపోబోతున్నప్పుడు, ఏలీయా ఎలీషాతో కలిసి గిల్గాలు నుండి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పెనుగాలిలో,’ ‘తుఫానులో’; హీబ్రూ పదం ఈ భావాలనూ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాలకు’; ఈ సందర్భంలో సహజ తెలుగులో ‘ఆకాశానికి’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …ప్పుడు
  rationale: కొత్త కథాఘట్టాన్ని ప్రారంభించే హీబ్రూ కథన రూపం. తెలుగులో విడిగా ‘అది జరిగింది’ అని పెట్టడం కంటే, తరువాతి కాలవాచక ఉపవాక్యంతో కలిపి ‘…ప్పుడు’ అని చెప్పడం సహజంగా ఉంటుంది.
- source_word: בְּהַעֲלוֹת
  choice: ఎత్తుకుపోబోతున్నప్పుడు
  rationale: ב తో కూడిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది. తరువాత జరగబోయే ఆరోహణను ఈ వాక్యం ముందుగా పరిచయం చేస్తున్నందున, సందర్భంలోని సమీప భవిష్యత్ భావాన్ని మరియు עלה లోని పైకి తీసుకువెళ్లే భావాన్ని ఈ రూపం అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు తగిన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶת אֵלִיָּהוּ
  choice: ఏలీయాను
  rationale: నేర కర్మ సూచికతో ఉన్న వ్యక్తినామాన్ని తెలుగు విభక్తితో సహజంగా అనువదించాం.
- source_word: בַּסְעָרָה
  choice: సుడిగాలిలో
  rationale: סְעָרָה తుఫాను, పెనుగాలి లేదా సుడిగాలిని సూచించగలదు. ఈ సందర్భంలో ‘సుడిగాలి’ సముచితం; ב ను సంఘటన జరిగిన మాధ్యమం/పరిస్థితిగా ‘లో’తో ఇచ్చాం.
- source_word: הַשָּׁמָיִם
  choice: ఆకాశానికి
  rationale: హీబ్రూలో రూపపరంగా బహువచనమైనా, ఇక్కడ పైలోక లేదా ఆకాశ దిశను తెలుగులో సహజంగా ఏకవచన ‘ఆకాశం’తో వ్యక్తం చేశాం.
- source_word: וַיֵּלֶךְ
  choice: బయలుదేరి వెళ్లారు
  rationale: הלך ప్రయాణ గమనాన్ని కథనంలో కొనసాగిస్తుంది. గిల్గాలు నుండి ప్రయాణం మొదలైన భావాన్ని సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וֶאֱלִישָׁע
  choice: ఎలీషా
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: מִן הַגִּלְגָּל
  choice: గిల్గాలు నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది; కాబట్టి ‘నుండి’ నేరమైన, సహజమైన అనువాదం.
theological_decisions:
- issue: יהוה దైవనామాన్ని ఎలా ఇవ్వాలి
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- issue: הַשָּׁמַיִם ను ‘ఆకాశం’గా లేదా ‘ఆకాశాలు’గా అనువదించడం
  choice: ఆకాశానికి
  alternative: ఆకాశాలకు; పరలోకానికి
  rationale: హీబ్రూ పదం రూపపరంగా బహువచనం; అయితే ఈ ఆరోహణ సందర్భంలో తెలుగు ఏకవచన ‘ఆకాశం’ సహజం. ‘పరలోకం’ అని ఇవ్వడం ద్వారా మూలంలో లేని నిర్దిష్ట లోకశాస్త్ర భావాన్ని ముందుగానే నిర్ణయించలేదు.
- issue: בַּסְעָרָה లోని ב సంబంధాన్ని ఎలా వ్యక్తం చేయాలి
  choice: సుడిగాలిలో
  alternative: సుడిగాలి ద్వారా
  rationale: ఈ ఉపసర్గ సంఘటన జరిగిన పరిధిని గానీ సాధనాన్ని గానీ సూచించవచ్చు. ‘లో’ మూలంలోని అస్పష్టతను కొంతవరకు నిలుపుతూ సహజ తెలుగుగా ఉంటుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగును, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యారంభాన్ని కృత్రిమంగా ‘అది జరిగింది’ అని విడదీయకుండా కాలవాచక నిర్మాణంలో కలిపాం. ఏలీయా/ఎలీషా పేర్ల మధ్య తేడా స్పష్టంగా ఉండే లిప్యంతరీకరణను పాటించాం.
