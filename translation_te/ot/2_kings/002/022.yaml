  text: וַ/יֵּרָפ֣וּ הַ/מַּ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ/דְבַ֥ר אֱלִישָׁ֖ע אֲשֶׁ֥ר דִּבֵּֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: te
  text: ఎలీషా పలికిన మాట ప్రకారం ఆ నీళ్లు నేటివరకు స్వస్థపరచబడి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బాగుపరచబడ్డాయి’ లేదా ‘తాగడానికి అనుకూలమైనవిగా మారాయి’ అని కూడా అనువదించవచ్చు. హెబ్రీయ క్రియ సాధారణంగా ‘స్వస్థపరచు’ అనే అర్థంలో వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: స్వస్థపరచబడిన స్థితిలో ఉన్నాయి
  rationale: רפא అనే సాధారణ ‘స్వస్థపరచు/బాగుచేయు’ క్రియలోని చికిత్స రూపకాన్ని నిలుపుతూ, గతంలో జరిగిన కార్యం ఫలితం కథకుని కాలం వరకు కొనసాగిందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמַּיִם
  choice: ఆ నీళ్లు
  rationale: ముందటి సందర్భంలో పేర్కొన్న నీటి మూలాన్ని సూచించే నిర్దిష్ట పదబంధం. తెలుగులో ‘నీళ్లు’ సహజమైన బహువచన రూపం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకు
  rationale: ఆ పరిస్థితి కథకుని సమయం వరకు కొనసాగిందనే హెబ్రీయ సంప్రదాయ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּדְבַר
  choice: మాట ప్రకారం
  rationale: ముందటి వచనంలో ఎలీషా పలికిన ప్రవచన ప్రకటనకు, దాని నెరవేర్పుకు మధ్యనున్న స్పష్టమైన సంబంధాన్ని నిలుపుతుంది.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֲשֶׁר דִּבֵּר
  choice: పలికిన
  rationale: ఇది నిర్దిష్టంగా ఎలీషా పలికిన మాటనే సూచిస్తుంది; ‘పలికిన’ గౌరవప్రదమైన, సహజమైన కథన శైలి.
theological_decisions:
- issue: నీటి విషయంలో వాడిన స్వస్థత భాష స్వభావం
  choice: ‘స్వస్థపరచబడిన’ అనే చికిత్స రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ‘బాగుచేయబడ్డాయి’ లేదా ‘మంచినీళ్లుగా మారాయి’
  rationale: మూలంలోని רפא సాధారణంగా ‘స్వస్థపరచు’ అనే క్రియ. రూపకాన్ని నిలుపడం ప్రవక్త పలికిన మాట ద్వారా పునరుద్ధరణ జరిగినట్లు పాఠ్యం చిత్రించే విధానాన్ని కాపాడుతుంది; అదే సమయంలో అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన కథన శైలిలో. ‘స్వస్థపరచబడిన స్థితిలో ఉన్నాయి’ అనే నిర్మాణం హెబ్రీయ గతక్రియను మరియు ‘నేటి వరకు’ కొనసాగిన ఫలితస్థితిని కలిపి వ్యక్తం చేస్తుంది.
