source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: te
  text: అప్పుడు ఆ పట్టణపు మనుషులు ఎలీషాతో, “దయచేసి చూడండి, ఈ పట్టణం ఉన్న స్థలం మంచిది, నా ప్రభువా, మీరు చూస్తున్నట్లే; అయితే నీళ్లు చెడ్డవి, నేల సంతాననష్టాన్ని కలిగిస్తోంది[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేల గర్భస్రావాలు కలిగిస్తోంది” లేదా “నేల నిష్ఫలంగా ఉంది.” ఇక్కడి హీబ్రూ పదం సంతానాన్ని కోల్పోయేలా చేయడాన్ని సూచిస్తుంది; సందర్భంలో అది వ్యవసాయ నిష్ఫలతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אַנְשֵׁי הָעִיר
  choice: ఆ పట్టణపు మనుషులు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ బహువచనాన్ని తటస్థీకరించకుండా, తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: הִנֵּה యొక్క దృష్టి ఆకర్షించే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; సందర్భంలోని మర్యాదపూర్వక అభ్యర్థన స్వరం మొత్తం సంభాషణలో అంతర్లీనంగా ఉంది.
- source_word: מוֹשַׁב הָעִיר
  choice: ఈ పట్టణం ఉన్న స్థలం
  rationale: పట్టణపు నివాసస్థలాన్ని మాత్రమే కాక దాని స్థానం లేదా పరిసర స్థితిని సూచించే భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: טוֹב
  choice: మంచిది
  rationale: స్థలంపై చేసిన అనుకూల అంచనాను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: మా ప్రభువు చూస్తున్నట్టే
  rationale: ఎలీషాకు ఉద్దేశించిన గౌరవ సంబోధనను, అలాగే ‘చూస్తున్నాడు’ అనే మూల భావాన్ని నిలుపుతుంది. సమూహం మాట్లాడుతున్నందున తెలుగులో ‘మా ప్రభువు’ సహజం.
- source_word: וְהַמַּיִם רָעִים
  choice: అయితే నీళ్లు చెడ్డవి
  rationale: మంచి స్థలంతో చెడ్డ నీటిని వ్యతిరేకించే సంబంధాన్ని ‘అయితే’ స్పష్టం చేస్తుంది; מַיִם రూపానికి అనుగుణంగా ‘నీళ్లు’ సహజ తెలుగు.
- source_word: וְהָאָרֶץ מְשַׁכָּלֶת
  choice: నేల గర్భస్రావాలు కలిగిస్తోంది
  rationale: שׁכל పియేల్ రూపంలోని సంతాననష్టాన్ని కలిగించే సూటి భావాన్ని నిలుపుతుంది; వ్యవసాయ నిష్ఫలతకు విస్తరించే సందర్భార్థాన్ని పాదసూచికలో సూచిస్తుంది.
theological_decisions:
- issue: ఎలీషాకు సంబోధనగా אֲדֹנִי అనువాదం
  choice: మా ప్రభువు
  alternative: మా యజమాని
  rationale: ఇది దేవుని బిరుదు కాదు, ఎలీషాకు ఇచ్చిన సామాజిక గౌరవ సంబోధన. ‘ప్రభువు’ ఆ గౌరవాన్ని నిలుపుతుంది; సందర్భం దీనిని దైవత్వ సూచనగా కాక మానవ సంబోధనగా స్పష్టం చేస్తుంది.
- issue: מְשַׁכָּלֶת యొక్క పరిధి
  choice: గర్భస్రావాలు కలిగిస్తోంది
  alternative: నిష్ఫలంగా ఉంది
  rationale: మూలపదంలోని సంతాననష్టాన్ని కలిగించే బలమైన, స్పష్టమైన భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మానవ లేదా పశు గర్భనష్టం మరియు వ్యవసాయ నిష్ఫలత మధ్య ఉన్న సందర్భసంబంధ అస్పష్టతను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’, ‘మా ప్రభువు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉన్నాయి. ప్రధాన పాఠ్యం మూలంలోని జీవశాస్త్రీయ బలాన్ని నిలుపుతుంది; పాదసూచిక విస్తృత వ్యవసాయార్థాన్ని సంరక్షిస్తుంది.
