id: 2KI.2.7
reference: 2 Kings 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: te
  text: ప్రవక్తల కుమారులలో యాభై మంది వెళ్లి, దూరంగా వారికి ఎదురుగా నిలబడ్డారు.[a][b] వారిద్దరూ యొర్దాను నది ఒడ్డున నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ప్రవక్తల కుమారులు’; ఇది ప్రవక్తల పరిచర్యతో సంబంధమున్న గుర్తింపు పొందిన సమూహాన్ని సూచించే పదబంధం.
    reason: cultural_note
  - marker: b
    text: ‘దూరం నుంచి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: యాభై మంది
  rationale: సంఖ్యతో కూడిన אִישׁ ఇక్కడ యాభై మంది పురుషులను సూచిస్తుంది; తెలుగులో సందర్భానుసారంగా ‘యాభై మంది’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: ప్రవక్తల కుమారుల్లో
  rationale: ‘ప్రవక్తల కుమారులు’ అనే హీబ్రూ సమూహపదాన్ని వ్యాఖ్యానాత్మకంగా ‘శిష్యులు’ లేదా ‘ప్రవక్తల బృందం’గా మార్చకుండా నిలిపింది.
- source_word: הָלְכוּ
  choice: వెళ్లి
  rationale: కథన సందర్భంలో הלך యొక్క సాధారణ అర్థం ‘వెళ్లడం’; తదుపరి క్రియతో సహజ తెలుగు క్రమంలో అనుసంధానించబడింది.
- source_word: וַיַּעַמְדוּ
  choice: నిలబడ్డారు
  rationale: עמד యొక్క సాధారణ స్థితి అర్థాన్ని అదనపు ఉద్ఘాటన లేకుండా తెలిపింది.
- source_word: מִנֶּגֶד
  choice: వారికి ఎదురుగా
  rationale: ఈ పదం ఎదుట లేదా ఎదురుగా ఉన్న స్థాన సంబంధాన్ని సూచిస్తుంది; ‘వారికి’ అనేది సందర్భంలోని ఏలీయా, ఎలీషాలను సూచిస్తుంది.
- source_word: מֵרָחוֹק
  choice: దూరంలో
  rationale: స్థలపరమైన ఎడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּשְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: ఏలీయా, ఎలీషా అనే ఇద్దరినీ సూచించే స్పష్టమైన ద్వివచన భావాన్ని నిలిపింది.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: యొర్దాను నది ఒడ్డున నిలబడ్డారు
  rationale: నది సందర్భంలో עַל అంటే ‘దగ్గర/వద్ద’ అనే భావం; తెలుగులో ‘నది ఒడ్డున’ దృశ్యాన్ని సహజంగా, నిర్దిష్టంగా తెలియజేస్తుంది.
