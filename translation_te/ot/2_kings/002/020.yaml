  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: te
  text: అతడు, “నాకు ఒక కొత్త చిన్న పాత్రను తీసుకురండి; దానిలో ఉప్పు వేయండి” అన్నాడు.[a] వారు దానిని అతని దగ్గరికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం సాధారణంగా ఒక చిన్న పాత్రను సూచిస్తుంది; దీనిని “గిన్నె,” “కూజా” లేదా “సీసా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు … అని చెప్పాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol రూపాన్ని సహజమైన తెలుగు కథనశైలిలో అందిస్తుంది; సందర్భంలో కర్త ఎలీషా అని స్పష్టంగా ఉంది.
- source_word: קְחוּ לִי
  choice: నా దగ్గరికి … తీసుకొచ్చి
  rationale: లָקַח్ ప్రాథమికంగా ‘తీసుకోండి’ అయినా, לִיతో కూడిన ఈ ఆజ్ఞ సందర్భంలో కోరిన వస్తువును వక్త దగ్గరికి తీసుకురావడమే ఉద్దేశం.
- source_word: צְלֹחִית
  choice: చిన్న పాత్ర
  rationale: ఈ నామవాచకం ఒక చిన్న పాత్ర లేదా కంటైనరును సూచిస్తుంది; దాని నిర్దిష్ట ఆకారాన్ని హీబ్రూ నిర్ణయించదు కాబట్టి ‘గిన్నె’, ‘కూజా’ వంటి మరింత నిర్దిష్ట పదాలకంటే ‘చిన్న పాత్ర’ మూలంలోని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: חֲדָשָׁה
  choice: కొత్త
  rationale: పాత్రను విశేషించే సాధారణ విశేషణాన్ని నేరుగా అనువదిస్తుంది.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: దానిలో ఉప్పు వేయండి
  rationale: שׂים అంటే ‘పెట్టు/వేయు’; שָׁם అక్షరార్థంగా ‘అక్కడ’ అయినా, ఇక్కడ ముందుగా చెప్పిన పాత్రలో అని సహజంగా సూచిస్తుంది.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: వారు దానిని అతని దగ్గరికి తీసుకొచ్చారు
  rationale: కోరిన పాత్రను ఎలీషా దగ్గరికి చేర్చిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూలో స్పష్టంగా లేని కర్మను సందర్భానుసారంగా ‘దానిని’ అని వ్యక్తం చేసింది.
