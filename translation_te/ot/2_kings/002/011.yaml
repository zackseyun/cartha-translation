  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י הֵ֣מָּה הֹלְכִ֤ים הָלוֹךְ֙ וְ/דַבֵּ֔ר וְ/הִנֵּ֤ה רֶֽכֶב אֵשׁ֙ וְ/ס֣וּסֵי אֵ֔שׁ וַ/יַּפְרִ֖דוּ בֵּ֣ין שְׁנֵי/הֶ֑ם וַ/יַּ֨עַל֙ אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: te
  text: వారు వెళ్తూ మాట్లాడుకుంటుండగా, ఇదిగో, అగ్ని రథమూ అగ్ని గుర్రాలూ వారిద్దరినీ వేరుచేశాయి.[a] అప్పుడు ఏలీయా సుడిగాలి ద్వారా[b] ఆకాశానికి ఎక్కిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అగ్ని రథమూ అగ్ని గుర్రాలూ ఏలీయాను, ఎలీషాను వేరుచేశాయని పాఠం చెబుతోంది. ఏలీయా ఆ రథంలో ఎక్కి వెళ్లాడని మాత్రం స్పష్టంగా చెప్పడం లేదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “సుడిగాలిలో” లేక “సుడిగాలితో.” ఇక్కడి హీబ్రూ ఉపసర్గ సాధనం, సహచర్యం లేదా స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: వారు అలా నడుస్తూ మాట్లాడుకుంటుండగా
  rationale: హీబ్రూ వాక్యంలోని కొనసాగుతున్న నడకను, దానితోపాటు జరుగుతున్న సంభాషణను సహజమైన ఆధునిక తెలుగు కాలనిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా ఎదురైన దృశ్యంపై పాఠకుని దృష్టిని మళ్లించే హీబ్రూ పదం యొక్క నాటకీయ బలాన్ని నిలుపుతుంది.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: అగ్ని రథమూ అగ్ని గుర్రాలూ
  rationale: ‘అగ్నితో కూడిన’ లేదా ‘మండుతున్న’ అని వివరణాత్మకంగా నిర్ణయించకుండా, హీబ్రూ సమాసాల స్పష్టమైన రూపకాన్ని మరియు సమాంతరతను కాపాడుతుంది.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: వచ్చి వారిద్దరినీ వేరుచేశాయి
  rationale: బహువచన క్రియను రథం, గుర్రాలు కలిపిన కర్తతో అనుసంధానిస్తూ, שְׁנֵיהֶםలోని ‘వారిద్దరూ’ అనే స్పష్టతను నిలుపుతుంది. ‘వచ్చి’ అనేది మధ్యకు రావడం ద్వారా వేరుచేసిన దృశ్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: అప్పుడు ఏలీయా … ఎక్కిపోయాడు
  rationale: עלה యొక్క పైకి వెళ్లే కదలికను స్పష్టంగా వ్యక్తం చేస్తుంది; ‘అప్పుడు’ కథనంలోని తదుపరి పరిణామాన్ని సహజంగా సూచిస్తుంది.
- source_word: בַּסְעָרָה
  choice: సుడిగాలి ద్వారా
  rationale: בְּ ఉపసర్గను ప్రధాన పాఠంలో సాధనార్థకంగా గ్రహిస్తుంది; అయితే దానికి స్థానార్థం లేదా సహచర్యార్థం కూడా ఉండగలదనే అంశాన్ని పాదసూచికలో ఉంచింది.
- source_word: הַשָּׁמָיִם
  choice: ఆకాశానికి
  rationale: హీబ్రూ పదానికి ఉన్న ‘ఆకాశం/ఆకాశలోకం’ పరిధిని అనవసరంగా సంకుచితం చేయకుండా, గమనదిశను తెలుగులో సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: అగ్ని రథమే ఏలీయాను మోసుకెళ్లిందా, లేక సుడిగాలితో అతడు పైకి వెళ్లాడా?
  choice: రథం, గుర్రాలు ఇద్దరినీ వేరుచేశాయని; ఏలీయా సుడిగాలి ద్వారా ఆకాశానికి ఎక్కిపోయాడని మాత్రమే ప్రధాన పాఠం చెబుతుంది.
  alternative: ఏలీయా అగ్ని రథంలో ఎక్కి ఆకాశానికి వెళ్లాడు.
  rationale: హీబ్రూ పాఠం అగ్ని రథం, గుర్రాల ప్రత్యక్షతను ఏలీయా ఎక్కిపోవడం నుండి వ్యాకరణపరంగా వేరు చేస్తుంది; అతని ఎక్కిపోవడాన్ని స్పష్టంగా సుడిగాలితో అనుసంధానిస్తుంది. అందువల్ల అతడు రథంలో ప్రయాణించాడని పాఠంలో లేని వివరాన్ని చేర్చలేదు.
- issue: בַּסְעָרָהలోని בְּ ఉపసర్గ యొక్క భావం
  choice: సుడిగాలి ద్వారా
  alternative: సుడిగాలిలో / సుడిగాలితో
  rationale: సాధనం, సహచర్యం, స్థానం అనే భావాలలో ఏది ఉద్దేశించబడిందో పూర్తిగా నిర్ధారించకుండా, ఒక సహజమైన ప్రధాన పఠనాన్ని ఎంచుకుని మిగతా అవకాశాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదంతో మూలంలోని నాటకీయ దృష్టి-ఆహ్వానాన్ని నిలిపాం. అగ్ని రథం గురించిన ప్రసిద్ధ ఊహను ప్రధాన పాఠంలో చేర్చకుండా, మూలపాఠంలోని వ్యాకరణ సంబంధాలనూ అనిశ్చితినీ కాపాడాం.
