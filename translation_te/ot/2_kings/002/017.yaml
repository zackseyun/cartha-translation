  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని పదేపదే ఒత్తిడి, సిగ్గు/ఇబ్బంది అనే భావసందిగ్ధత, మూడు రోజుల విఫల అన్వేషణ అన్నీ నిలుపబడ్డాయి.
