source:
  edition: WLC
  text: וַ/יִּפְצְרוּ ב֥/וֹ עַד בֹּ֖שׁ וַ/יֹּ֣אמֶר שְׁלָ֑חוּ וַֽ/יִּשְׁלְחוּ֙ חֲמִשִּׁ֣ים אִ֔ישׁ וַ/יְבַקְשׁ֥וּ שְׁלֹשָֽׁה יָמִ֖ים וְ/לֹ֥א מְצָאֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: te
  text: అయితే అతడు సిగ్గుపడేంతవరకు[a] వారు అతన్ని పట్టుబట్టి అడిగారు. అప్పుడు అతడు, “వారిని పంపండి” అన్నాడు. కాబట్టి వారు యాభైమందిని పంపారు. వారు మూడు రోజులు వెదికినా అతన్ని కనుగొనలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతడు ఇబ్బందిపడేంతవరకు.” హీబ్రూలో అక్షరార్థంగా “అతడు సిగ్గుపడేంతవరకు” అని ఉంది; వారు పదేపదే పట్టుబట్టడం వల్ల కలిగిన సామాజిక ఒత్తిడిని ఇది వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: వారు అతన్ని పట్టుబట్టి అడిగారు
  rationale: פצר పదం పదేపదే ఒత్తిడి చేస్తూ పట్టుబట్టడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పట్టుబట్టి అడిగారు’ అనేది ఆ నిరంతర విజ్ఞాపనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד בֹּשׁ
  choice: అతడు సిగ్గుపడేంతవరకు
  rationale: בוש యొక్క ప్రాథమిక భావం సిగ్గు లేదా ఇబ్బంది. వారి పదేపదే ఒత్తిడి వల్ల ఎలీషా సామాజికంగా సిగ్గుపడే స్థితికి చేరిన భావాన్ని ఇది నిలుపుతుంది.
- source_word: שְׁלָחוּ
  choice: వారిని పంపండి
  rationale: ఇది రెండవ పురుష బహువచన ఆజ్ఞ. సందర్భంలో వెదకడానికి మనుషులను పంపడానికి అనుమతి ఇస్తున్నందున, తెలుగులో అంతర్లీన కర్మను స్పష్టంగా తెలిపాం.
- source_word: חֲמִשִּׁים אִישׁ
  choice: యాభైమందిని
  rationale: హీబ్రూ పాఠం ఈ వచనంలో కేవలం ‘యాభై మంది’ అని చెబుతుంది; సందర్భంలోని అదనపు గుర్తింపును పాఠ్యంలో చేర్చలేదు.
- source_word: וַיְבַקְשׁוּ שְׁלֹשָׁה יָמִים
  choice: వారు మూడు రోజులు వెదికినా
  rationale: בקש ఇక్కడ వెదకడం అనే భావంలో ఉంది. తరువాతి విఫల ఫలితంతో తెలుగులో సహజంగా అనుసంధానించేందుకు ‘వెదికినా’ అని ఇచ్చాం.
- source_word: וְלֹא מְצָאֻהוּ
  choice: అతన్ని కనుగొనలేదు
  rationale: מצא అంటే కనుగొనడం. పురుష ఏకవచన కర్మప్రత్యయం సూచించే వ్యక్తిని ‘అతన్ని’ అని స్పష్టంగా ఉంచాం.
