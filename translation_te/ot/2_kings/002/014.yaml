    text: హీబ్రూలో “ఆయనే” అనే పదబంధం చాలా సంక్షిప్తంగా ఉంది. దీనిని ప్రశ్నతో కలిపి, “ఏలీయా దేవుడైన యహ్వే—ఆయనే ఎక్కడ ఉన్నాడు?” అని చదవవచ్చు. లేక తరువాతి క్రియతో కలిపి, “అతడు కూడా నీటిని కొట్టాడు” అని చదవవచ్చు.
