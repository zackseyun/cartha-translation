source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: te
  text: అప్పుడు అతడు ఏలీయా మీదనుండి పడిపోయిన పైవస్త్రాన్ని తీసుకొని నీటిని కొట్టి, “ఏలీయా దేవుడైన యహ్వే ఎక్కడ ఉన్నాడు? ఆయనే[a]!” అని చెప్పి, నీటిని కొట్టాడు. అప్పుడు నీరు ఇటూ అటూ విడిపోయింది, ఎలీషా దాటి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “ఆయనే” అనే పదబంధం చాలా సంక్షిప్తంగా ఉంది. దీనిని ప్రశ్నతో కలిపి, “ఏలీయా దేవుడైన యహ్వే—ఆయనే ఎక్కడ ఉన్నాడు?” అని చదవవచ్చు. లేక తరువాతి క్రియతో కలిపి, “అతడు కూడా నీటిని కొట్టాడు” అని చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: పైవస్త్రం
  rationale: ఏలీయాకు ప్రత్యేక గుర్తింపుగా ఉన్న బయటి వస్త్రాన్ని సూచిస్తుంది. ‘పైవస్త్రం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతూ మూలంలోని స్పష్టమైన వస్తు చిత్రాన్ని నిలుపుతుంది.
- source_word: נָפְלָה מֵעָלָיו
  choice: అతని మీదనుండి పడిపోయిన
  rationale: సంబంధ వాక్యంలోని క్రియ, ఏలీయా ఆరోహణ సమయంలో అతని మీదనుండి పడిన వస్త్రాన్ని వెనుకకు సూచిస్తుంది.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: నీటిని కొట్టాడు
  rationale: నכה క్రియలోని ప్రత్యక్ష చర్యను సరళంగా నిలుపుతుంది. హీబ్రూలో రూపం బహువచనమైనా, తెలుగులో ‘నీరు/నీటిని’ సహజమైన సమూహవాచక ప్రయోగం.
- source_word: אַיֵּה
  choice: ఎక్కడ ఉన్నాడు?
  rationale: దేవుని స్థానం లేదా ప్రత్యక్ష సన్నిధిని ప్రశ్నించే నేరమైన ప్రశ్నార్థక భావాన్ని నిలుపుతుంది; దైవ చర్య కోసం చేసిన విజ్ఞప్తిగా వ్యాఖ్యానించి విస్తరించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: ఏలీయా దేవుడైన
  rationale: హీబ్రూ సంయుక్త సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אַף הוּא
  choice: అతడు కూడా[a]
  rationale: హీబ్రూ పదబంధంలోని సంక్షిప్తమైన ఉద్ఘాటనను ప్రధాన పాఠ్యంలో ఉంచుతుంది; దాని అన్వయం వివాదాస్పదమైనందున పాదటిప్పణి ద్వారా అస్పష్టతను తెలియజేస్తుంది.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: నీరు ఇటూ అటూ విడిపోయింది
  rationale: నీరు రెండు వైపులకు చీలిపోవడాన్ని సూచించే దిశాత్మక జంటను సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲבֹר
  choice: దాటి వెళ్లాడు
  rationale: నదిని దాటే సందర్భంలో עבר క్రియకు స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో వ్యక్తిగత ఒడంబడిక నామమే ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా పేరుగా నిలుపడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: אַף הוּא అనే సంక్షిప్త పదబంధం అన్వయం
  choice: ‘అతడు కూడా’ అని ప్రధాన పాఠ్యంలో నిలిపి, అస్పష్టతను పాదటిప్పణిలో వివరించడం
  alternative: దానిని వదిలేయడం లేదా ‘ఆయన కూడా ఇక్కడ లేడా?’ అని విస్తరించడం
  rationale: ఈ హీబ్రూ పదబంధం వ్యాకరణపరంగా సంక్షిప్తమూ, వ్యాఖ్యానపరంగా వివాదాస్పదమూ. దాన్ని ఎలీషాకు అన్వయించే సమీప పఠనాన్ని పాఠ్యంలో ఉంచినా, అదే దేవుడు ఇంకా కార్యశీలుడని ఉద్ఘాటించే పఠనాన్ని పాదటిప్పణిలో భద్రపరచడం ద్వారా వేదాంత ఉద్వేగాన్ని బలవంతంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కానీ గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తుల పేర్లను అవసరమైన చోట స్పష్టంగా ఉంచి, మూలంలోని రెండు నీటిని కొట్టే చర్యలను అలాగే నిలిపాం. వివాదాస్పదమైన אַף הוּא పదబంధాన్ని తొలగించకుండా పాఠ్యం మరియు పాదటిప్పణి ద్వారా దాని అస్పష్టతను సంరక్షించాం.
