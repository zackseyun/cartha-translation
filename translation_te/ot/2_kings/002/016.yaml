id: 2KI.2.16
reference: 2 Kings 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: te
  text: అప్పుడు వారు అతనితో, “ఇదిగో, నీ సేవకులలో సమర్థులైన యాభై మంది ఉన్నారు. దయచేసి వారిని వెళ్లి నీ యజమానిని వెదకనివ్వు. బహుశా యెహోవా ఆత్మ[a] ఆయనను ఎత్తుకుపోయి ఏదో ఒక కొండమీదో, ఏదో ఒక లోయలోనో పడవేసి ఉండవచ్చు” అన్నారు. అయితే అతడు, “వారిని పంపవద్దు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా గాలి ఆయనను ఎత్తుకుపోయి ఏదో ఒక కొండమీదో, ఏదో ఒక లోయలోనో పడవేసి ఉండవచ్చు.” ఇక్కడ “ఆత్మ”గా అనువదించిన హీబ్రూ పదానికి “గాలి” అనే అర్థం కూడా ఉంది.
    reason: רוּחַ అనే హీబ్రూ పదంలోని నిజమైన ‘ఆత్మ/గాలి’ అర్థ సందిగ్ధతను నిలుపుతూ, మూలవాక్యంలోని ‘పడవేయడం’ అనే క్రియను కూడా పూర్తిగా ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: ప్రతిపాదనకు ముందు శ్రద్ధ కోరే మర్యాదపూర్వక సూచనగా ఆధునిక తెలుగులో సహజంగా ఉంది; తరువాతి నָאను ‘దయచేసి’ అని విడిగా వ్యక్తం చేశాం.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: నీ సేవకులలో ... ఉన్నారు
  rationale: సేవకుల సమూహంలో అందుబాటులో ఉన్న మనుషులను సూచించే అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: సమర్థులైన యాభై మంది
  rationale: בְּנֵי חַיִל ఇక్కడ యుద్ధవీరత్వం మాత్రమే కాక, వెదకడానికి తగిన సామర్థ్యం, దృఢత్వం గల వారిని సూచిస్తుంది.
- source_word: יֵלְכוּ נָא
  choice: దయచేసి వారిని వెళ్లి ... వెదకనివ్వు
  rationale: జస్సివ్ రూపంలోని మర్యాదపూర్వక అభ్యర్థనను, ఎలీషా అనుమతిని కోరుతున్న భావంతో తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: నీ యజమానిని వెదకనివ్వు
  rationale: בקשׁకు ఈ సందర్భంలో ‘వెదకు’ సరైన అర్థం; אֲדֹנֶיךָ ఎలీషాకు గురువు, అధిపతి అయిన ఏలీయాను సూచిస్తుంది.
- source_word: פֶּן
  choice: బహుశా
  rationale: ఇక్కడ నివారించవలసిన ఫలితాన్ని కాక, ఏలీయా కనబడకపోవడానికి వారు ఊహిస్తున్న అనిశ్చిత కారణాన్ని పరిచయం చేస్తుంది.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ ఆయనను ఎత్తుకుపోయి
  rationale: అసాధారణమైన దైవిక క్రియను సందర్భం సూచిస్తున్నందున ‘ఆత్మ’ను ప్రధాన పాఠంలో ఉంచాం; ‘గాలి’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: పడవేసి
  rationale: ఎత్తుకుపోయిన తరువాత మరొక చోట ఉంచడం కాదు, విసరడం లేదా పడవేయడం అనే బలమైన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּאַחַד הֶהָרִים אֹו בְּאַחַת הַגֵּאָיוֹת
  choice: ఏదో ఒక కొండమీదో, ఏదో ఒక లోయలోనో
  rationale: కొండకు ‘మీద’, లోయకు ‘లో’ అనే భిన్న స్థాన సంబంధాలను సహజంగా నిలుపుతూ, ప్రతి సమూహంలో అనిర్దిష్టమైన ఒక స్థలాన్ని సూచిస్తుంది.
theological_decisions:
- issue: רוּחַ יְהוָה యొక్క అర్థం
  choice: యెహోవా ఆత్మ
  alternative: యెహోవా గాలి
  rationale: ఏలీయా అసాధారణంగా తొలగింపబడిన కథా సందర్భంలో దైవిక కార్యశక్తి ప్రధానంగా కనిపిస్తుంది. అయినప్పటికీ רוּחַకు ‘గాలి’ అనే అర్థం కూడా ఉండగలదు కాబట్టి ఆ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: దైవ నామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ఏలీయాను సూచించేటప్పుడు ‘ఆయనను’ అనే గౌరవ రూపాన్ని, ఎలీషా మరియు మాట్లాడువారికి కథనానుగుణ సాధారణ ఏకవచన రూపాలను వాడాం. మూలంలోని అనిశ్చితిని ‘బహుశా’ మరియు ‘ఉండవచ్చు’ ద్వారా నిలిపాం.
