id: 2KI.2.10
reference: 2 Kings 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הִקְשִׁ֣יתָ לִ/שְׁא֑וֹל אִם תִּרְאֶ֨ה אֹתִ֜/י לֻקָּ֤ח מֵֽ/אִתָּ/ךְ֙ יְהִֽי לְ/ךָ֣ כֵ֔ן וְ/אִם אַ֖יִן לֹ֥א יִהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నీవు కష్టమైన విషయం అడిగావు. నేను నీ నుండి తీసుకుపోబడుతుండగా నీవు నన్ను చూస్తే[a], నీకు అలాగే జరుగుతుంది; లేకపోతే అలా జరగదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీ నుండి తీసుకుపోబడినప్పుడు నీవు నన్ను చూస్తే.”
    reason: లֻקָּח అనే నిష్క్రియాత్మక రూపాన్ని జరుగుతున్న కార్యంగా లేదా ఆ కార్యం జరిగే సమయాన్ని సూచించే విధంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: నీవు కష్టమైనది అడిగావు
  rationale: హిఫిల్ క్రియతో కూడిన ఈ హీబ్రూ ప్రయోగం, ఎలీషా చేసిన అభ్యర్థన నెరవేర్చడం కష్టమైనదని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: నేను నీ దగ్గర నుంచి తీసుకుపోబడుతుండగా నీవు నన్ను చూస్తే
  rationale: לֻקָּח అనేది לקח ధాతువు యొక్క నిష్క్రియాత్మక రూపం. ‘తీసుకుపోబడుతుండగా’ అనే రూపం నిష్క్రియ భావాన్నీ, జరుగుతున్న కార్యాన్ని చూడడమే షరతు అనే భావాన్నీ నిలుపుతుంది; కార్యాన్ని చేసేవారు ఎవరో అదనంగా చెప్పదు.
- source_word: יְהִי לְךָ כֵן
  choice: నీకు అలాగే జరుగుతుంది
  rationale: అభ్యర్థించిన ఫలితం ఎలీషాకు కలుగుతుందని తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאִם אַיִן לֹא יִהְיֶה
  choice: లేకపోతే అలా జరగదు
  rationale: אַיִן ఇక్కడ ‘నీవు చూడకపోతే’ అనే భావంతో సంక్షిప్తంగా వాడబడింది. తెలుగు వాక్యంలో ‘లేకపోతే’ ఆ వ్యతిరేక షరతును సహజంగా తెలియజేస్తుంది; ‘అలా జరగదు’ ముందున్న ఫలితాన్నే సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ మూలంలోని షరతు–ఫలితం నిర్మాణం, నిష్క్రియ భావం, కార్యసాధకుడు పేర్కొనబడకపోవడం నిలుపబడ్డాయి.
