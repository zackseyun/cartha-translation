id: 2KI.2.21
reference: 2 Kings 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אֶל מוֹצָ֣א הַ/מַּ֔יִם וַ/יַּשְׁלֶךְ שָׁ֖ם מֶ֑לַח וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה רִפִּ֨אתִי֙ לַ/מַּ֣יִם הָ/אֵ֔לֶּה לֹֽא יִהְיֶ֥ה מִ/שָּׁ֛ם ע֖וֹד מָ֥וֶת וּ/מְשַׁכָּֽלֶת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: te
  text: 'అప్పుడు అతడు నీరు వెలువడే చోటికి[a] వెళ్లి, అక్కడ ఉప్పు చల్లి ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘నేను ఈ నీటిని స్వస్థపరచాను. ఇక దీనివల్ల మరణమూ గర్భస్రావమూ[b] కలగవు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీటి ఊట దగ్గరికి.”
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ పదం సంతాననష్టం, గర్భస్రావం కలిగించడం, లేదా ఫలించకపోవడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: నీరు వెలువడే చోటు
  rationale: מוֹצָא అనేది నీరు బయటికి వచ్చే ప్రదేశాన్ని సూచిస్తుంది. ఈ పదబంధం ‘మూలం,’ ‘ఊట,’ లేదా ‘ప్రవాహం మొదలయ్యే చోటు’ అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: מֶלַח
  choice: ఉప్పు
  rationale: మూలపదానికి నేరమైన, సందర్భానికి సహజమైన సమానార్థకం.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవసందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: నేను ఈ నీటిని స్వస్థపరిచాను
  rationale: רפא యొక్క ప్రాథమికమైన ‘స్వస్థపరచు’ రూపకాన్ని నిలుపుతుంది. నీటిని తాగదగినదిగా లేదా హానిరహితంగా చేశానని వివరణాత్మకంగా విస్తరించకుండా మూలంలోని సజీవ భాషను కాపాడుతుంది.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: ఇక దానివల్ల ... కలగవు
  rationale: హానికర ఫలితాలు ఇక ఆ నీటి మూలం నుంచి రావని తెలిపే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָוֶת
  choice: మరణం
  rationale: మూలంలోని సాధారణ పదాన్ని అలాగే ఉంచుతుంది; చెడు నీటి వల్ల కలిగే ఏ ప్రత్యేక మరణకారణానికీ అర్థాన్ని కుదించదు.
- source_word: מְשַׁכָּלֶת
  choice: గర్భస్రావం
  rationale: שׁכל మూలం సంతాననష్టాన్ని లేదా ఫలించకపోవడాన్ని సూచించగలదు. ఈ సందర్భంలో ‘గర్భస్రావం’ స్పష్టమైన సాధ్యార్థం; విస్తృత అర్థపరిధిని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో అందించాం.
- issue: నీటిని ‘స్వస్థపరచడం’ అనే దైవకార్య భాష
  choice: రూపకాన్ని యథాతథంగా నిలపడం
  alternative: నీటిని శుద్ధి చేశాను / తాగదగినదిగా చేశాను
  rationale: మూలంలోని רפא సాధారణంగా ‘స్వస్థపరచు’ అని అర్థం. ఫలితాన్ని వివరిస్తూ రూపకాన్ని తొలగించకుండా, దైవప్రకటనలోని ఉద్దేశపూర్వక భాషను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ప్రవక్త సందేశ సూత్రం స్పష్టంగా ఉంచబడింది; మూలంలోని రూపక భాషను సరళీకరించి తొలగించలేదు. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
