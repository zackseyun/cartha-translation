  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אַֽחֲרָי/ו֙ וַ/יִּרְאֵ֔/ם וַֽ/יְקַלְלֵ֖/ם בְּ/שֵׁ֣ם יְהוָ֑ה וַ/תֵּצֶ֨אנָה שְׁתַּ֤יִם דֻּבִּים֙ מִן הַ/יַּ֔עַר וַ/תְּבַקַּ֣עְנָה מֵ/הֶ֔ם אַרְבָּעִ֥ים וּ/שְׁנֵ֖י יְלָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: te
  text: అతడు వెనక్కి తిరిగి వారిని చూశాడు; యెహోవా నామంలో వారిని శపించాడు. అప్పుడు అడవిలోనుంచి రెండు ఆడ ఎలుగుబంట్లు వచ్చి, వారిలో నలభై ఇద్దరు బాలురను చీల్చివేశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: వారిని శపించాడు
  rationale: The verb קלל here denotes pronouncing a curse; the direct rendering preserves the force and does not soften it into a rebuke.
- source_word: בְּשֵׁם יְהוָה
  choice: యెహోవా నామంలో
  rationale: Renders the divine name יהוה explicitly and preserves the instrumental/authoritative force of בְּשֵׁם.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: రెండు ఆడ ఎలుగుబంట్లు
  rationale: The feminine numeral and noun form indicate two female bears.
- source_word: וַתְּבַקַּעְנָה
  choice: చీల్చివేశాయి
  rationale: בקע means to split or tear open. This source-grounded wording retains its violence rather than reducing it to a general attack, while not adding an explicit statement that all died.
- source_word: יְלָדִים
  choice: బాలురు
  rationale: In this context the masculine plural refers to boys or young males; బాలురు is natural modern Telugu without importing a more precise age than the text supplies.
theological_decisions:
- issue: The relation between Elisha's curse and the bears' attack
  choice: Present the curse in the LORD's name followed by the bears' emergence, exactly in narrative sequence.
  alternative: Explicitly state that God commanded or sent the bears as punishment.
  rationale: The Hebrew narrates sequence and association but does not explicitly state the mechanism or add a theological explanation.
- issue: Whether the forty-two boys died
  choice: Use చీల్చివేశాయి without explicitly saying they were killed.
  alternative: Translate as killed forty-two boys.
  rationale: The violent verb implies severe tearing but the verse does not directly state death; the translation should not resolve that question beyond the source.
translation_notes:
  register: Modern standard Telugu with a dignified narrative register. Clause order closely follows the Hebrew while using natural Telugu syntax. No explanatory additions or denominational terminology are introduced.
