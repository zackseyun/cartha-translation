id: 2KI.2.2
reference: 2 Kings 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: te
  text: ఏలీయా ఎలీషాతో, “దయచేసి ఇక్కడే ఉండు; ఎందుకంటే యాహ్వే నన్ను బేతేలు వరకు[a] పంపించాడు” అన్నాడు. అయితే ఎలీషా, “యాహ్వే సజీవుడని, నీవు సజీవుడవని ప్రమాణంగా చెబుతున్నాను[b], నేను నిన్ను విడిచిపెట్టను” అన్నాడు. కాబట్టి వారిద్దరూ బేతేలుకు దిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘బేతేలు వరకు’; సందర్భార్థంగా ‘బేతేలుకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీ ప్రమాణ సూత్రం: అక్షరార్థంగా ‘యాహ్వే జీవిస్తున్నట్టుగా, నీ జీవం ఉన్నట్టుగా; నేను నిన్ను విడిచిపెడితే…’ అని ఉంటుంది. చివరి భాగం అసంపూర్ణ ప్రతికూల ప్రమాణం; దాని ఉద్దేశం ‘నేను నిన్ను విడిచిపెట్టను.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: దయచేసి ఇక్కడే ఉండు
  rationale: ישׁב ఇక్కడ కూర్చోవడం కంటే ముందుకు వెళ్లకుండా ఉండిపోవడాన్ని సూచిస్తుంది; נָא లోని మర్యాదను ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’కు ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: నన్ను బేతేలు వరకు పంపించాడు
  rationale: עַד లోని ‘వరకు/అంతదూరం’ అనే గమ్యపరిమితి భావాన్ని నిలిపి ఉంచుతుంది; సందర్భంలో సాధారణంగా ‘బేతేలుకు’ అని కూడా అర్థం చేసుకోవచ్చు.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: యాహ్వే జీవం తోడు, నీ జీవం తోడు
  rationale: ఇది హెబ్రీ ప్రమాణ సూత్రం. נֶפֶשׁ‌ను ఇక్కడ సాంకేతికంగా ‘ఆత్మ’ అని అనకుండా, వ్యక్తి జీవాన్ని సూచించే సహజ తెలుగు ప్రమాణ రూపాన్ని వాడాం.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: నేను నిన్ను విడిచిపెట్టను
  rationale: ప్రమాణం తరువాత వచ్చే אִם అసంపూర్ణ ప్రతికూల ప్రమాణాన్ని ప్రవేశపెడుతుంది—పదశః ‘నేను నిన్ను విడిచిపెడితే…’; తెలుగులో దాని ఉద్దేశిత నిషేధార్థాన్ని స్పష్టంగా తెలిపాం.
- source_word: וַיֵּרְדוּ
  choice: వారిద్దరూ దిగివెళ్లారు
  rationale: ירד లోని కిందికి వెళ్లే దిశాభావాన్ని ‘దిగివెళ్లారు’ నిలుపుతుంది; ద్వివచన భావం తెలుగులో ‘వారిద్దరూ’ ద్వారా స్పష్టమవుతుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: స్థలనామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘Yahweh’ ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
- issue: אִם אֶעֶזְבֶךָּ లోని అసంపూర్ణ ప్రమాణం
  choice: నేను నిన్ను విడిచిపెట్టను
  alternative: నేను నిన్ను విడిచిపెడితే…
  rationale: మూలంలోని ప్రమాణ నిర్మాణం ఉద్దేశపూర్వకంగా వాక్యాంత శాపాన్ని విడిచిపెడుతుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా తెలిపి, ఆ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘జీవం తోడు’ అనే ప్రమాణ రూపం మూలంలోని గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
