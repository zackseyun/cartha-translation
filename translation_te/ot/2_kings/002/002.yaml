    rationale: ‘యాహ్వే జీవం తోడు, నీ జీవం తోడు’ అర్థమయ్యే అవకాశం ఉన్నా ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రమాణవాక్యంగా లేదు. ‘యాహ్వే సజీవుడని, నీవు సజీవుడవని ప్రమాణంగా చెబుతున్నాను’ మూలంలోని ‘యాహ్వే జీవిస్తున్నట్టుగా, నీ జీవం ఉన్నట్టుగా’ అనే ద్వంద్వ ప్రమాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
