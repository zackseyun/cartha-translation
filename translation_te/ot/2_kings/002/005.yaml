source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: te
  text: 'అప్పుడు యెరికోలో ఉన్న ప్రవక్తల కుమారులు ఎలీషా దగ్గరికి వచ్చి అతనితో ఇలా అన్నారు: “ఈ రోజు యాహ్వే నీ యజమానిని నీ తలపై నుండి[a] తీసుకుపోతున్నాడని నీకు తెలుసా?” అతడు, “నాకూ తెలుసు; మౌనంగా ఉండండి” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీపై నుండి.” హీబ్రూలో అక్షరార్థంగా “నీ తలపై నుండి” అని ఉంది; ఇది ఒకరిపై అధికారంలో ఉన్న వ్యక్తి తొలగింపును సూచించే నుడికారం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: దగ్గరికి వచ్చి
  rationale: నגשׁ సూచించే సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְנֵי הַנְּבִיאִים
  choice: ప్రవక్తల కుమారులు
  rationale: ఇది ప్రవక్తల శిష్యబృందాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, మూలంలోని హీబ్రూ నుడికారాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: యెరికోలో ఉన్న
  rationale: ఈ ప్రవక్తల బృందం యెరికోలో ఉన్నదని సంబంధవాక్యం స్పష్టంగా గుర్తిస్తుంది.
- source_word: הֲיָדַעְתָּ
  choice: నీకు తెలుసా
  rationale: ఇక్కడ హీబ్రూ perfect గతంలో తెలుసుకున్న చర్యకన్నా ప్రస్తుత అవగాహనను ప్రశ్నిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: לֹקֵחַ
  choice: తీసుకుపోతున్నాడని
  rationale: హీబ్రూ participleలోని సమీపిస్తున్న లేదా సజీవంగా వర్ణించిన చర్యను నిలుపుతుంది; సందర్భానికి తగినట్లు ‘తీసుకుపోవడం’ అని పలికింది.
- source_word: אֲדֹנֶיךָ
  choice: నీ యజమానిని
  rationale: ఇక్కడ మానవ సంబంధంలో ఎలీయా ఎలీషాపై ఉన్న గురువు/అధికారి స్థానాన్ని సూచిస్తుంది; దైవార్థ ఛాయ గల బిరుదును నివారిస్తుంది.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: నీ తలపై నుండి
  rationale: అధికారస్థానంలో ఉన్న వ్యక్తి తొలగింపును సూచించగల అసాధారణ హీబ్రూ చిత్రాన్ని ప్రధాన వచనంలో యథాశక్తి నిలుపుతుంది.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: నాకూ తెలుసు
  rationale: గַּם అనే సముచ్చయ భావాన్నీ, אֲנִי అనే ఉద్ఘాటిత సర్వనామ భావాన్నీ సహజమైన సంక్షిప్త తెలుగులో ఇస్తుంది.
- source_word: הֶחֱשׁוּ
  choice: మౌనంగా ఉండండి
  rationale: బహువచన ఆజ్ఞలోని సంక్షిప్తతనూ దృఢతనూ గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలవచనం దైవనామాన్ని నేరుగా వాడుతుంది. దానిని ఒక బిరుదుతో భర్తీ చేయకుండా, YHWHకు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: מֵעַל רֹאשֶׁךָ అనే నుడికారాన్ని ప్రధాన వచనంలో వ్యాఖ్యానించాలా
  choice: ‘నీ తలపై నుండి’ అనే స్పష్ట చిత్రాన్ని నిలుపడం
  alternative: నీపై అధికారిగా ఉండడం నుండి; నీపై నుండి
  rationale: ఈ మాట ఎలీయా ఎలీషాపై కలిగిన అధికారస్థానం తొలగిపోవడాన్ని సూచించవచ్చు. అయితే మూలం ఆ భావాన్ని చిత్రరూపంలోనే ఉంచుతుంది కాబట్టి ప్రధాన వచనం దానిని పరిష్కరించకుండా, వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రవక్తల కుమారులు’ మరియు ‘నీ తలపై నుండి’ వంటి మూలభాషా నుడికారాలను ఉద్దేశపూర్వకంగా నిలిపి, అవసరమైన వివరణను పాదసూచికకు పరిమితం చేసింది.
