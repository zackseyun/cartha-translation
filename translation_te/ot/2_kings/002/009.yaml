  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: te
  text: 'వారు దాటి వెళ్లిన తరువాత, ఏలీయా ఎలీషాతో ఇలా అన్నాడు: “నీ కోసం నేను ఏమి చేయాలో అడుగు; నేను నీ వద్దనుండి తీసుకోబడకముందే అడుగు.” ఎలీషా ఇలా అన్నాడు: “దయచేసి, నీ ఆత్మలో రెండింతల వాటా[a] నాకు కలగాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఆత్మలో రెండు వాటాలు నాకు కలగాలి.” ఈ హెబ్రీ నుడికారం “రెండింతల వాటా” అని అర్థం; ఇది జ్యేష్ఠ కుమారునికి లభించే వారసత్వ వాటాను సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నీ ఆత్మ” అనేది ఏలీయా ప్రవక్తగా చేసిన సేవతో సంబంధమున్న ఆత్మను సూచిస్తుంది. కొందరు దీన్ని ఏలీయా ప్రవక్తృత్వ శక్తికి రెండింతలు కావాలనే అభ్యర్థనగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: వారు దాటి వెళ్లిన తరువాత
  rationale: עבר క్రియకు ఉన్న 3వ పురుష బహువచన ప్రత్యయం ఏలీయా, ఎలీషా ఇద్దరినీ సూచిస్తుంది. తరువాతి సంభాషణకు ముందు దాటడం పూర్తయిందనే క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁאַל
  choice: అడుగు
  rationale: ఇది నేరమైన ఆజ్ఞార్థక రూపం; సందర్భంలో కోరుకోమని ఇచ్చిన ఆహ్వానాన్ని సరళంగా వ్యక్తపరుస్తుంది.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: నీ కోసం ఏమి చేయాలో
  rationale: ఏలీయా ఎలీషాకు ఒక కోరిక కోరే అవకాశం ఇస్తున్న భావాన్ని, అతిశయ నిర్ధారణ లేకుండా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: నీ దగ్గర నుండి నేను తీసుకోబడకముందు
  rationale: לקח నిఫల్ రూపంలోని కర్మణి భావాన్ని ‘నేను తీసుకోబడ’ అని నిలుపుతూ, מֵעִמָּךְలోని వ్యక్తిగత వేరుపాటు భావాన్ని ‘నీ దగ్గర నుండి’ అని వ్యక్తపరుస్తుంది.
- source_word: וִיהִי נָא
  choice: దయచేసి … నాకు కలగాలి
  rationale: జస్సివ్ అభ్యర్థనను נָא మర్యాదగా మృదుపరుస్తుంది. ‘దయచేసి’ ఆ వినయాన్ని, ‘కలగాలి’ అభ్యర్థన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తాయి.
- source_word: פִּי שְׁנַיִם
  choice: రెండింతల భాగం
  rationale: ఈ హెబ్రీ నుడికారం రెండు వాటాలు లేదా ద్విగుణ భాగాన్ని సూచిస్తుంది; వారసత్వంలో జ్యేష్ఠుని భాగాన్ని ప్రతిధ్వనింపజేసే అవకాశాన్ని ‘రెండింతల భాగం’ కాపాడుతుంది.
- source_word: בְּרוּחֲךָ
  choice: నీ ఆత్మలో
  rationale: స్వామ్య ప్రత్యయాన్ని నిలుపుతూ, ఏలీయాతో సంబంధమున్న ప్రవక్తృత్వ ఆత్మ లేదా అనుగ్రహాన్ని సూచిస్తుంది. ‘పరిశుద్ధాత్మ’ అని స్పష్టీకరించకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: אֵלָי
  choice: నాకు కలగాలి
  rationale: అక్షరార్థంగా ‘నాకు/నా వైపు’ అనే భావం. తెలుగులో ఆత్మకు సంబంధించిన భాగం తనకు రావాలనే అభ్యర్థనను ‘నాకు కలగాలి’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: פִּי שְׁנַיִם בְּרוּחֲךָ అనే ఎలీషా అభ్యర్థన అర్థం
  choice: ఏలీయా ఆత్మలో రెండింతల భాగాన్ని ఎలీషా కోరుతున్నట్లు అనువదించడం
  alternative: ఏలీయాకు ఉన్న ప్రవక్తృత్వ శక్తికి సరిగ్గా రెండింతల శక్తిని ఎలీషా కోరుతున్నట్లు స్పష్టీకరించడం
  rationale: פִּי שְׁנַיִם సహజంగా రెండు వాటాలు లేదా రెండింతల భాగాన్ని సూచిస్తుంది; ఇది జ్యేష్ఠుని వారసత్వ భాగాన్ని ప్రతిధ్వనింపజేయవచ్చు. ‘రెండింతల భాగం’ ఈ సూచనను, అలాగే తులనాత్మక శక్తి గురించిన అనిశ్చితిని నిలుపుతుంది.
- issue: ‘నీ ఆత్మ’ అనే మాటకు సూచితం
  choice: ఏలీయాను లక్షణీకరించే లేదా అతని ప్రవక్తృత్వ సేవతో సంబంధమున్న ఆత్మ/అనుగ్రహం
  alternative: ఈ పదబంధం నేరుగా త్రిత్వ సిద్ధాంతంలోని వ్యక్తిగా పరిశుద్ధాత్మనే సాంకేతికంగా పేర్కొంటుంది
  rationale: స్వామ్య ప్రత్యయం ఏలీయాకు చెందినది లేదా అతనిని లక్షణీకరించేది అనే భావాన్ని ఇస్తుంది. అనువాదం ‘నీ ఆత్మ’ అనే రూపాన్నే ఉంచి, మూలం నిర్దిష్టంగా చెప్పని సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘తీసుకోబడ’ అనే కర్మణి రూపం మూలంలోని భావాన్ని నిలుపుతుంది; ‘కలగాలి’ సాధారణ పాఠకునికి అర్థమయ్యే వినయపూర్వక అభ్యర్థనగా ఉంది. అడుగుట గుర్తులు సంబంధిత పదబంధాల దగ్గర ఉంచబడ్డాయి.
