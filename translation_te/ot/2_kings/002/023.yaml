source:
  edition: WLC
  text: וַ/יַּ֥עַל מִ/שָּׁ֖ם בֵּֽית אֵ֑ל וְ/ה֣וּא עֹלֶ֣ה בַ/דֶּ֗רֶךְ וּ/נְעָרִ֤ים קְטַנִּים֙ יָצְא֣וּ מִן הָ/עִ֔יר וַ/יִּתְקַלְּסוּ ב/וֹ֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ עֲלֵ֥ה קֵרֵ֖חַ עֲלֵ֥ה קֵרֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: te
  text: అప్పుడు అతడు అక్కడి నుండి బేతేలుకు ఎక్కి వెళ్లాడు. అతడు దారిలో ఎక్కి వెళ్తుండగా, పట్టణం నుండి చిన్న కుర్రాళ్లు[a] బయటికి వచ్చి అతణ్ణి ఎగతాళి చేస్తూ, “ఎక్కిపో, బట్టతలవాడా! ఎక్కిపో,[b] బట్టతలవాడా!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యువ కుర్రాళ్లు,” “యువకులు.” ఈ హీబ్రూ పదబంధం చిన్న వయసు గల పురుషులను విస్తృతంగా సూచించవచ్చు; తప్పనిసరిగా చాలా చిన్న పిల్లలనే సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: రెండుసార్లు వచ్చిన “ఎక్కిపో” కేవలం ఎగతాళి మాట కావచ్చు; అయితే అది ఏలీయా పైకి తీసుకోబడిన సంఘటనను సూచిస్తూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: అప్పుడు అతడు ... ఎక్కి వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం/ఎక్కడం’ భావాన్ని నిలుపుతూ, కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు ‘అప్పుడు’తో వ్యక్తం చేసింది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సాధారణంగా గుర్తించగల లిప్యంతరీకరణతో ఇచ్చింది; దాని అర్థాన్ని అనువదించలేదు.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: అతడు దారిలో ఎక్కి వెళ్తుండగా
  rationale: సర్వనామం-వర్తమాన కృదంత నిర్మాణంలోని కొనసాగుతున్న చర్యను చూపుతుంది; తరువాతి ఎగతాళిలోని עלה పదపునరుక్తిని కూడా కాపాడుతుంది.
- source_word: נְעָרִים קְטַנִּים
  choice: చిన్న కుర్రాళ్లు
  rationale: נערים పురుషలింగంలోని బాలురు లేదా యువకులను విస్తృతంగా సూచించగలదు; קטנים వారి చిన్న వయసు లేదా కనిష్ఠ స్థితిని సూచిస్తుంది. ‘చిన్న కుర్రాళ్లు’ సహజమైన తెలుగులో ఈ రెండు అంశాలను నిలుపుతుంది; విస్తృత అర్థసాధ్యతను పాదసూచికలో ఇచ్చింది.
- source_word: יָצְאוּ מִן הָעִיר
  choice: పట్టణం నుండి ... బయటికి వచ్చి
  rationale: יצא క్రియలోని బయటికి రావడం అనే దిశాభావాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేసింది.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: అతణ్ణి ఎగతాళి చేస్తూ
  rationale: Hitpael రూపంలోని అపహాస్య, అవమానకర భావాన్ని ‘ఎగతాళి’ స్పష్టంగా మరియు గౌరవప్రదమైన ఆధునిక భాషలో అందిస్తుంది.
- source_word: עֲלֵה
  choice: ఎక్కిపో
  rationale: ఆజ్ఞారూపంలోని ‘పైకి వెళ్లు/ఎక్కు’ అనే మూలభావాన్ని, అలాగే ముందున్న עלה క్రియతో పదసంబంధాన్ని నిలుపుతుంది; ‘ఇక్కడి నుండి పో’ వంటి వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి చేర్చలేదు.
- source_word: קֵרֵחַ
  choice: బట్టతలవాడా
  rationale: ‘బట్టతల గలవాడు’ అనే అర్థంతో పాటు సంబోధనలోని అవమానకర ఎగతాళి ధోరణిని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఎగతాళిలో రెండుసార్లు వచ్చిన עֲלֵה (‘ఎక్కిపో’) మాటకు ఏలీయా పైకి తీసుకోబడిన సంఘటనతో సూచనాత్మక సంబంధం ఉండవచ్చా?
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థానికి దగ్గరగా ‘ఎక్కిపో’ అని ఉంచి, సాధ్యమైన సూచనను పాదసూచికలో తెలిపింది.
  alternative: ‘ఇక్కడి నుండి పో’ అని సాధారణ ఎగతాళిగా అనువదించడం, లేదా ‘ఏలీయాలా పైకి వెళ్లిపో’ అని సూచనను స్పష్టంగా చేర్చడం.
  rationale: హీబ్రూ పదం నేరుగా ‘ఎక్కు/పైకి వెళ్లు’ అని చెబుతుంది. ఎగతాళి యొక్క ఖచ్చిత ఉద్దేశం అనిశ్చితమైనందున, ప్రధాన పాఠ్యం ఆ అనిశ్చితిని పరిష్కరించకుండా కాపాడుతుంది.
- issue: נְעָרִים קְטַנִּים అనే పదబంధం సూచించే వయస్సు మరియు దానివల్ల పాఠకుడు ఊహించే బాధ్యత స్థాయి
  choice: ప్రధాన పాఠ్యంలో ‘చిన్న కుర్రాళ్లు’ అని ఇచ్చి, ‘యువకులు’ అనే విస్తృత సాధ్యతను పాదసూచికలో ఉంచింది.
  alternative: ‘చిన్న పిల్లలు,’ ‘బాలురు,’ లేదా ‘యువకులు.’
  rationale: ఈ హీబ్రూ పదబంధం చిన్న వయసు గల పురుషులను సూచించినా, అది తప్పనిసరిగా చాలా చిన్న పిల్లలనే సూచించదు. అందువల్ల వారి వయస్సు లేదా నైతిక బాధ్యతను అనువాదం అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. ‘ఎక్కి వెళ్లాడు/ఎక్కి వెళ్తుండగా/ఎక్కిపో’ అనే పునరుక్తి మూలంలోని עלה పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది. ప్రత్యక్ష సంభాషణలోని అవమానకర స్వరం నిలిచినా, అనవసరంగా మరింత కఠినమైన లేదా మాండలిక పదజాలాన్ని చేర్చలేదు.
