  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: te
  text: అతడు ఏలీయా మీదనుంచి పడిన పైవస్త్రాన్ని[a] ఎత్తుకున్నాడు. అతడు తిరిగి వచ్చి యొర్దాను ఒడ్డున నిలబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
