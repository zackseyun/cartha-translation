    text: లేదా, ‘మాంటిలు.’ హీబ్రూ పదం విలక్షణమైన బయటి వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: ఎత్తుకున్నాడు
  rationale: רוּם అనే క్రియకు ‘పైకి ఎత్తడం’ అనే ప్రాథమిక భావం ఉంది; నేలపై పడిన వస్త్రాన్ని తీసుకునే ఈ సందర్భంలో ‘ఎత్తుకున్నాడు’ సహజంగానూ నిర్దిష్టంగానూ ఉంది.
- source_word: אַדֶּרֶת
  choice: పైవస్త్రం
  rationale: ఈ పదం ప్రత్యేకమైన బయటి వస్త్రాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘పైవస్త్రం’ స్పష్టంగా ఉంటుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: ఏలీయా మీదనుంచి పడిన
  rationale: מֵעָלָיו యొక్క అక్షరార్థం ‘అతని మీదనుంచి.’ తెలుగులో సర్వనామ సూచనలో కలగగల అస్పష్టతను తగ్గించడానికి ఏలీయా పేరును పునరుక్తి చేశాం; క్రియ జరిగిన క్రమం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చి
  rationale: שׁוּב ఇక్కడ తిరిగి వెళ్లడం లేదా రావడాన్ని సూచిస్తుంది. కథన ప్రవాహంలో ‘తిరిగి వచ్చి’ సహజమైన తెలుగు రూపం.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: క్రియ యొక్క ప్రత్యక్ష భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: యొర్దాను ఒడ్డున
  rationale: שָׂפָה నది సందర్భంలో ‘ఒడ్డు’ను సూచిస్తుంది. హీబ్రూలో ఉన్నట్లే నది పేరును ‘యొర్దాను’గా ఇచ్చాం.
