  naturalness: ‘దూరం నుండి అతణ్ణి చూసి’ సహజమైన కథన తెలుగు. ‘అని చెప్పారు’ అనేది ‘అని చెప్పుకున్నారు’ కంటే మూలంలోని సాధారణ బహువచన పలుకును మరింత నేరుగా ప్రతిబింబిస్తుంది. మిగతా శైలి ఆధునిక ప్రామాణిక తెలుగుకు తగినదే.
