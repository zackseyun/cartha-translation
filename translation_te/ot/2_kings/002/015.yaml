  to: యెరికోలో ఉన్న ప్రవక్తల శిష్యులు దూరం నుండి అతణ్ణి చూసి[a], “ఏలీయా ఆత్మ ఎలీషాపై నిలిచింది[b]” అని చెప్పారు. తరువాత వారు అతణ్ణి కలుసుకోవడానికి వచ్చి, అతని ఎదుట నేలవరకు వంగి నమస్కరించారు[c].
  rationale: సవరణ ప్రధానంగా సహజమైన తెలుగు ప్రయోగం కోసం మాత్రమే. మִנֶּגֶד యొక్క పూర్తిగా నిర్దిష్టం కాని స్థలభావాన్ని ప్రధాన వాక్యంలో అతిగా నిర్దేశించకుండా ‘దూరం నుండి’గా అనువదించి, ‘ఎదురుగా లేదా అవతల’ అనే సాధ్యభావాన్ని పాదటిప్పణిలో నిలిపాం. పలుకుబడి క్రియను ‘చెప్పుకున్నారు’ నుండి మూలానికి దగ్గరైన ‘చెప్పారు’గా మార్చాం. అర్థం, పేర్లు, ఆత్మకు సంబంధించిన అస్పష్టత, నమస్కార భంగిమ యొక్క సందర్భోచిత స్వభావం మార్చబడలేదు.
