source:
  edition: WLC
  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: te
  text: యెరికోలో ఉన్న ప్రవక్తల శిష్యులు దూరం నుండి అతణ్ణి చూసి[a], “ఏలీయా ఆత్మ ఎలీషాపై నిలిచింది[b]” అని చెప్పారు. తరువాత వారు అతణ్ణి కలుసుకోవడానికి వచ్చి, అతని ఎదుట నేలవరకు వంగి నమస్కరించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూరం నుండి’ అని అనువదించిన హీబ్రూ మాట, ఎదురుగా లేదా అవతల కనిపించే స్థానాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఏలీయా ఆత్మ’ అనేది సందర్భంలో ఏలీయాకు ఉన్న ప్రవచనాత్మక ఆత్మ లేదా శక్తి ఇప్పుడు ఎలీషాపై ఉందని వారు గుర్తించడాన్ని సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా ‘అతని ఎదుట సాష్టాంగపడ్డారు.’ ఈ చర్య గౌరవం, విధేయతను వ్యక్తం చేస్తుంది; తప్పనిసరిగా దైవారాధనను కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: అతణ్ణి చూసి
  rationale: ראה క్రియకు ఉన్న 3వ పురుష ఏకవచన కర్మప్రత్యయాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: בְנֵי הַנְּבִיאִים
  choice: ప్రవక్తల శిష్యులు
  rationale: హీబ్రూ నుడికారంలోని సామాజిక అర్థాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది; ఇక్కడ ‘కుమారులు’ అనేది శారీరక సంతానాన్ని తప్పుగా సూచించవచ్చు.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: యెరికోలో ఉన్న
  rationale: ఆ ప్రవక్తల శిష్యుల బృందం ఉన్న స్థలాన్ని సహజంగా గుర్తిస్తుంది.
- source_word: מִנֶּגֶד
  choice: ఎదురుగా దూరం నుండి
  rationale: ఈ పదంలోని ఎదురుగా లేదా అవతల కనిపించే స్థానం, కొంత దూరం అనే రెండు స్థలసూచక ఛాయలనూ నిలుపుతుంది.
- source_word: נָחָה
  choice: నిలిచింది
  rationale: నוח perfect రూపం ఒకసారి వచ్చి స్థిరంగా నిలిచిన ఫలితస్థితిని సూచిస్తుంది; తెలుగు భూతకాల రూపం ఆ గుర్తింపును సహజంగా తెలియజేస్తుంది.
- source_word: רוּחַ אֵלִיָּהוּ
  choice: ఏలీయా ఆత్మ
  rationale: నిర్మాణబంధాన్ని నేరుగా అనువదించి, ‘ఆత్మ’ అనే పదంలోని నిజమైన అర్థవిస్తృతిని ప్రధాన వాక్యంలో నిలుపుతుంది.
- source_word: עַל אֱלִישָׁע
  choice: ఎలీషాపై
  rationale: ఆత్మ ఒక వ్యక్తిపై నిలవడం అనే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לִקְרָאתוֹ
  choice: అతణ్ణి కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి కలుసుకోవడం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: అతని ఎదుట నేలవరకు వంగి నమస్కరించారు
  rationale: శరీరాన్ని నేలవైపు వంచే గౌరవసూచక చర్యను స్పష్టంగా చూపుతుంది; దైవారాధన అని ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ‘ఏలీయా ఆత్మ’ అనే మాట అర్థం
  choice: ప్రధాన వాక్యంలో ‘ఏలీయా ఆత్మ’ అనే మూలపాఠపు విస్తృత పదప్రయోగాన్ని నిలిపి, సందర్భంలో అది ఏలీయాకు ఉన్న ప్రవచనాత్మక శక్తి లేదా సేవా సామర్థ్యం ఎలీషాపై ఉందని గుర్తించడాన్ని సూచిస్తుందని పాదటిప్పణిలో తెలిపింది.
  alternative: ఏలీయా వ్యక్తిగత ఆత్మ ఎలీషాలోకి మారిందని స్పష్టీకరించడం.
  rationale: 2 రాజులు 2:9,15 సందర్భం ప్రవచన సేవలో వారసత్వం, సామర్థ్యాన్ని సూచిస్తుంది; అయితే అనువాదం మూలంలోని ‘ఆత్మ’ పదాన్ని సంకుచితం చేయకుండా నిలపాలి.
- issue: ఎలీషాకు చేసిన నమస్కారం స్వభావం
  choice: గౌరవం, విధేయతను తెలిపే నేలవరకు వంగే చర్యగా అనువదించింది.
  alternative: ఎలీషాను దైవంగా ఆరాధించారని అనువదించడం.
  rationale: שחה అనే క్రియ సందర్భానుసారం మనుషుల ముందూ దేవుని ముందూ వంగడాన్ని సూచించగలదు. ఇక్కడ ప్రవక్తల శిష్యులు ఎలీషా అధికారాన్ని అంగీకరించడం సందర్భానికి సరిపోతుంది; దైవారాధన భావాన్ని బలవంతంగా చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే శైలి. ‘ప్రవక్తల కుమారులు’ అనే అపార్థసాధ్యమైన అక్షరానువాదం బదులు ‘ప్రవక్తల శిష్యులు’ వాడబడింది. వ్యక్తినామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘ఏలీయా’, ‘ఎలీషా’, ‘యెరికో’గా ఇచ్చబడ్డాయి; ప్రధాన వాక్యంలో మూలపాఠపు ఆధ్యాత్మిక, భంగిమాసంబంధిత అస్పష్టతలను అతిగా పరిష్కరించలేదు.
