  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: te
  text: అప్పుడు ఏలీయా అతనితో, “దయచేసి ఇక్కడే ఉండు; ఎందుకంటే యాహ్వే నన్ను యొర్దానుకు[a] పంపించాడు” అన్నాడు. అయితే అతడు, “యాహ్వే జీవముతోడు, నీ జీవముతోడు[b], నేను నిన్ను విడిచిపెట్టను” అన్నాడు. కాబట్టి వారిద్దరూ ముందుకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను నదికి.”
    reason: lexical_alternative
  - marker: b
    text: ఇది హెబ్రీ ప్రమాణ సూత్రం. పదశః, “యాహ్వే జీవిస్తున్నట్టూ, నీ జీవం జీవిస్తున్నట్టూ, నేను నిన్ను విడిచిపెడితే …”; దీని భావం, “నేను నిన్ను ఎంతమాత్రమూ విడిచిపెట్టను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: దయచేసి ఇక్కడే ఉండు
  rationale: ישׁב సందర్భానుసారంగా కూర్చో, ఉండు, నిలిచిపో అనే భావాలు కలిగిస్తుంది; ఇక్కడ ఏలీయా ఎలీషాను వెనుక ఉండమని కోరుతున్నందున ‘ఉండు’ సహజం. נָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన నామరూపంగా ఇచ్చాం.
- source_word: שְׁלָחַנִי
  choice: నన్ను పంపించాడు
  rationale: పూర్తయిన పంపకాన్ని తెలుగులో సహజమైన భూతకాల క్రియతో వ్యక్తం చేశాం; దాని ప్రస్తుత ప్రయోజనం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: הַיַּרְדֵּנָה
  choice: యొర్దాను దగ్గరికి
  rationale: దిశను సూచించే ה־ ను ‘దగ్గరికి’గా వ్యక్తం చేశాం. స్థలనామం నదిని సూచిస్తున్నందున ‘యొర్దాను నది దగ్గరికి’ కూడా సాధ్యం.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: యెహోవా జీవం తోడు, నీ జీవం తోడు
  rationale: హెబ్రీ ప్రమాణ సూత్రంలోని జీవాన్ని సాక్షిగా పెట్టే గంభీరతను తెలుగులో సహజమైన ప్రమాణ ప్రయోగంతో నిలిపాం; נֶפֶשׁ ను వేరైన తాత్త్విక ‘ఆత్మ’గా అనవసరంగా అర్థం చేయలేదు.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: నేను నిన్ను విడిచిపెట్టను
  rationale: ఇది అసంపూర్ణ శాపవాక్యంతో కూడిన ప్రమాణ నిర్మాణం; పదశః ‘నేను నిన్ను విడిచిపెడితే…’ అయినా, ఉద్దేశించిన బలమైన నిరాకరణను సహజ తెలుగులో నేరుగా తెలిపాం.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: కాబట్టి వారిద్దరూ ముందుకు వెళ్లారు
  rationale: שְׁנֵיהֶם లోని ఇద్దరూ కలిసి వెళ్లారనే ఉద్ఘాటనను ‘వారిద్దరూ’ నిలుపుతుంది; ప్రయాణం కొనసాగిందనే సందర్భార్థాన్ని ‘ముందుకు వెళ్లారు’ తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: ప్రమాణ వాక్యంలోని אִם అర్థం
  choice: నేను నిన్ను విడిచిపెట్టను
  alternative: నేను నిన్ను విడిచిపెడితే…
  rationale: హెబ్రీ ప్రమాణాల్లో אִם తరువాత శాపఫలితం చెప్పకుండా వదిలే నిర్మాణం బలమైన నిరాకరణను సూచిస్తుంది. ప్రధాన పాఠంలో అర్థాన్ని స్పష్టంగా ఇచ్చి, మూల నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడాం. సంభాషణలో వినయాన్ని ‘దయచేసి’తో, ప్రమాణ గంభీరతను ‘జీవం తోడు’ అనే తెలుగు ప్రయోగంతో వ్యక్తం చేశాం. ఏలీయా, యొర్దాను వంటి సుపరిచిత బైబిలు నామరూపాలను ఉపయోగించాం.
