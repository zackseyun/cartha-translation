translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు ప్రయాణ దశలనూ, ‘అక్కడి నుండి’ అనే పునరుక్తినీ నిలిపి ఉంచాం.
