  text: And he went from there to Mount Carmel, and from there he returned to Samaria.
translation:
  language: te
  text: అతడు అక్కడి నుండి కర్మెలు పర్వతానికి వెళ్లాడు; అక్కడి నుండి సమరయకు తిరిగి వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: వయిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపించే సాధారణ భూతకాల చర్యను సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘వెళ్లాడు’ సహజంగా ఉంటుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: ఇంతకుముందు ప్రస్తావించిన స్థలం నుండి బయలుదేరడాన్ని ఈ అవ్యయం సూచిస్తుంది; ‘అక్కడి నుండి’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: אֶל
  choice: -కి
  rationale: గమ్యస్థానం వైపు కదలికను సూచించే విభక్తిగా తెలుగులో ‘పర్వతానికి’ సహజంగా వ్యక్తమవుతుంది.
- source_word: הַר הַכַּרְמֶל
  choice: కర్మెలు పర్వతం
  rationale: ఇది పేరుగల భౌగోళిక స్థలం; తెలుగులో స్థిరపడిన బైబిలు నామరూపాన్ని ఉంచి, הַר అర్థాన్ని ‘పర్వతం’గా తెలిపాం.
- source_word: וּמִשָּׁם
  choice: అక్కడి నుండి
  rationale: రెండవ ప్రయాణ దశను హెబ్రీ పునరుక్తికి అనుగుణంగా కొనసాగిస్తుంది; తెలుగు విరామచిహ్నం ద్వారా అనుసంధానం స్పష్టమవుతుంది.
- source_word: שָׁב
  choice: తిరిగి వచ్చాడు
  rationale: ప్రయాణ సందర్భంలో שׁוּב మునుపటి స్థలానికి తిరిగివెళ్లడాన్ని సూచిస్తుంది; సమరయ గమ్యంగా ఉండటంతో ‘తిరిగి వచ్చాడు’ సహజ తెలుగు ప్రయోగం.
- source_word: שֹׁמְרוֹן
  choice: సమరయ
  rationale: ఈ నగరం లేదా ప్రాంతానికి తెలుగులో సంప్రదాయంగా గుర్తించదగిన స్థలనామ రూపం ‘సమరయ’.
