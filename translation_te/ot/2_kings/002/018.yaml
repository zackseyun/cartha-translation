translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. ‘ఉండి ఉన్నాడు’ కొద్దిగా రూపబద్ధమైనదైనా, יֹשֵׁב లోని కొనసాగుతున్న స్థితిని మరియు ‘కూర్చున్నాడు/ఉన్నాడు’ అనే నిజమైన అర్థ విస్తృతిని అనవసరంగా సంకుచితం చేయకుండా ఉంచుతుంది.
