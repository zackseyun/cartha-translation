id: 2KI.2.18
reference: 2 Kings 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: te
  text: వారు అతని వద్దకు తిరిగి వచ్చినప్పుడు[a], అతడు యెరికోలో ఉన్నాడు. అతడు వారితో, “నేను మీతో, ‘వెళ్లవద్దు’ అని చెప్పలేదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారు అతని వద్దకు తిరిగి వచ్చారు; అతడు యెరికోలో ఉన్నాడు.”'
    reason: హీబ్రూలోని వరుస కథన క్రియారూపం «వచ్చినప్పుడు» అనే కాలవాచక అనువాదానికి బదులుగా, రెండు సమన్వయ కథన వాక్యాలుగా కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: వారు అతని దగ్గరికి తిరిగి వచ్చినప్పుడు
  rationale: שׁוב యొక్క సాధారణ అర్థాన్ని ‘తిరిగి వచ్చారు’గా నిలుపుతూ, తరువాతి సమకాలిక ఉపవాక్యంతో ఉన్న సంబంధాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంగా వ్యక్తం చేస్తుంది. ‘అతని’ అనేది సందర్భంలోని ఎలీషాను సూచిస్తుంది.
- source_word: וְהוּא יֹשֵׁב
  choice: అతడు ... ఉండి ఉన్నాడు
  rationale: ישׁב అంటే కూర్చోవడం, ఉండడం, నివసించడం అనే భావాలు రావచ్చు. వారు వెదకడానికి వెళ్లిన సమయంలో అతడు యెరికోలోనే కొనసాగి ఉన్నాడనే సందర్భార్థాన్ని ఇది సహజంగా తెలియజేస్తూ, క్రియలోని స్థితి భావాన్ని నిలుపుతుంది.
- source_word: בִּירִיחוֹ
  choice: యెరికోలోనే
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇస్తూ, ‘అక్కడే ఉండడం’ అనే సందర్భబలాన్ని ‘నే’ ద్వారా సహజంగా సూచిస్తుంది.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అప్పుడు అతడు వారితో ... అన్నాడు
  rationale: אמר అనే సాధారణ మాటలాడే క్రియను సహజమైన తెలుగు సంభాషణా నిర్మాణంలో అందిస్తుంది; వావ్ వరుస కథన పురోగతిని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: నేను మీతో చెప్పలేదా?
  rationale: הֲלוֹא సమ్మతిని ఆశించే అలంకారప్రశ్నను సూచిస్తుంది. ఈ తెలుగు రూపం ఎలీషా మందలింపు ధ్వనిని, ముందే చెప్పాననే భావాన్ని నిలుపుతుంది.
- source_word: אַל תֵּלֵכוּ
  choice: వెళ్లవద్దని
  rationale: אַל తో కూడిన అసంపూర్ణ క్రియ నిషేధాన్ని వ్యక్తం చేస్తుంది. పరోక్ష ఉల్లేఖనంలో ‘వెళ్లవద్దని’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
