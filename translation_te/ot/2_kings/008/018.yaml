  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు రాజుల మార్గంలో నడిచాడు, అహాబు వంశం చేసినట్లుగా చేశాడు; ఎందుకంటే అహాబు కుమార్తె అతనికి భార్యగా ఉండేది. అతడు యాహ్వే దృష్టిలో చెడు చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలో నడిచాడు
  rationale: జీవన ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులు
  rationale: ఉత్తర రాజ్యపు పాలకులను సూచించే సరళమైన సంబంధ నిర్మాణం.
- source_word: בֵּית אַחְאָב
  choice: అహాబు వంశస్థులు
  rationale: రాజవంశ సందర్భంలో בַּיִת కుటుంబం లేదా రాజవంశాన్ని సూచిస్తుంది; తెలుగులో ఉద్దేశం స్పష్టంగా ఉండేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రవర్తనకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: בַּת אַחְאָב
  choice: అహాబు కుమార్తె
  rationale: హీబ్రూ సమాస నిర్మాణానికి సహజమైన తెలుగు అనువాదం.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: అతని భార్య
  rationale: అక్షరార్థంగా ‘అతనికి భార్యగా ఉండింది’; సందర్భంలోని ప్రస్తుత వివాహ బంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: నిర్దిష్ట articleతో ఉన్న רַעను ప్రతిబింబిస్తూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దైవిక మూల్యాంకనాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో మార్చకుండా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపాన్ని ఉపయోగిస్తుంది.
- issue: అహాబు కుమార్తె ప్రభావం మరియు రాజు దోషబాధ్యత మధ్య సంబంధం
  choice: ‘ఎందుకంటే’ అనే మూల కారణసంబంధాన్ని మాత్రమే నిలుపడం
  alternative: ఆమె అతనిని చెడుకు ప్రేరేపించిందని స్పష్టీకరించడం
  rationale: వివాహ సంబంధాన్ని కారణంగా వచనం పేర్కొంటుంది గాని, ప్రభావం ఎలా పనిచేసిందో వివరించదు; అందువల్ల అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ‘మార్గంలో నడవడం’ అనే రూపకం నిలుపబడింది. దీర్ఘ వాక్యాన్ని మూడు చిన్న వాక్యాలుగా విభజించి పఠనసౌలభ్యం పెంచబడింది.
