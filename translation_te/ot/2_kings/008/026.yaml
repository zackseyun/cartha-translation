source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֤ם אִמּ/וֹ֙ עֲתַלְיָ֔הוּ בַּת עָמְרִ֖י מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: te
  text: అహజ్యా రాజైనప్పుడు అతనికి ఇరవై రెండు సంవత్సరాలు. అతడు యెరూషలేములో ఒక సంవత్సరం పరిపాలించాడు. అతని తల్లి పేరు అతల్యా; ఆమె ఇశ్రాయేలు రాజైన ఒమ్రీ కుమార్తె[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒమ్రీ వంశస్థురాలు.’ హీబ్రూలో ‘కుమార్తె’ అనే పదం కొన్నిసార్లు నేరుగా పుట్టిన కుమార్తెను కాకుండా తరువాతి తరానికి చెందిన స్త్రీని లేదా ఒక రాజవంశ సభ్యురాలిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: అతనికి ఇరవై రెండు సంవత్సరాలు
  rationale: ‘ఇరవై రెండు సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ఖచ్చితమైన వయస్సుతో వ్యక్తం చేస్తుంది.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: రాజ్యాధికార స్వీకరణను తెలిపే హీబ్రూ సూత్రప్రయోగానికి సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: ఒక సంవత్సరం పరిపాలించాడు
  rationale: పాలనా వ్యవధిని మూలపాఠం ప్రకారం నేరుగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలవాచక ఉపసర్గతో కూడిన పేరుకు ప్రామాణిక తెలుగు రూపం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ పరిచయ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲתַלְיָהוּ
  choice: అతల్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בַּת עָמְרִי
  choice: ఒమ్రీ కుమార్తె
  rationale: בַּת అనే పదం యొక్క ప్రత్యక్ష బంధుత్వ అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత వంశార్థాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: ఒమ్రీ రాజపదవిని తెలుగులో సహజంగా విశేషణ రూపంలో గుర్తిస్తుంది.
theological_decisions:
- issue: ‘ఒమ్రీ కుమార్తె’ అనే వంశావళి వ్యక్తీకరణ
  choice: ప్రధాన పాఠ్యంలో ప్రత్యక్ష బంధుత్వ పదమైన ‘కుమార్తె’ను ఉంచడం
  alternative: ఒమ్రీ వంశానికి చెందిన స్త్రీ / ఒమ్రీ వంశస్థురాలు
  rationale: హీబ్రూ בַּת యొక్క సాధారణ అర్థం ‘కుమార్తె’; అయితే అది కొన్నిసార్లు తరువాతి తరానికి చెందిన స్త్రీని లేదా రాజవంశ సభ్యురాలిని కూడా సూచించగలదు. అందువల్ల విస్తృత అర్థాన్ని పాదటిప్పణిలో భద్రపరచడం మూలంలోని సాధ్యమైన అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన చారిత్రక వచనశైలి. మూలంలోని రాజ్యారోహణ, పాలనా వ్యవధి, వంశసంబంధ పదాలను క్రమబద్ధంగా నిలిపింది. పాదటిప్పణి గుర్తు అది వివరిస్తున్న ‘ఒమ్రీ కుమార్తె’ అన్న పదబంధం వెంట ఉంచబడింది.
