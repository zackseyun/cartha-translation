id: 2KI.8.1
reference: 2 Kings 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: te
  text: 'ఎలీషా, తాను బ్రతికించిన కుమారుని తల్లియైన ఆ స్త్రీతో ఇలా మాట్లాడాడు: “నీవు లేచి, నీ ఇంటివారితో కలిసి వెళ్లి, ఎక్కడ నివసించవచ్చో అక్కడ నివసించు[a]. ఎందుకంటే యెహోవా కరవును రమ్మని పిలిచాడు; అది దేశం మీదికి కూడా వచ్చి, ఏడు సంవత్సరాలు కొనసాగుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నివసించు’ అని అనువదించిన హీబ్రూ క్రియ తరచుగా స్వదేశం కాని చోట తాత్కాలిక నివాసిగా లేదా పరదేశిగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: చెప్పి ఉన్నాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియను సందర్భంలోని ముందుగా జరిగిన మాటగా చూపిస్తూ, సహజమైన తెలుగు పూర్వకాల భావాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: తాను బతికించిన కుమారుని తల్లి
  rationale: హిఫీల్ రూపంలోని జీవింపజేయడం/తిరిగి బతికించడం అనే కార్యార్థాన్ని సహజంగా తెలియజేస్తూ స్త్రీని ఆమె కుమారునితో గుర్తిస్తుంది.
- source_word: קוּמִי וּלְכִי
  choice: నువ్వు లేచి ... వెళ్లి
  rationale: స్త్రీ ఏకవచన ఆజ్ఞారూపాల ప్రత్యక్షతను, అత్యవసర భావాన్ని నిలుపుతుంది.
- source_word: וּבֵיתֵךְ
  choice: నీ ఇంటివారితో కలిసి
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక కుటుంబం/గృహస్థులను సూచిస్తుంది; తెలుగు వాడుకలో ‘ఇంటివారు’ సహజం.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: ఎక్కడ ఉండగలిగితే అక్కడ కొంతకాలం నివసించు
  rationale: גור యొక్క తాత్కాలిక పరదేశ నివాస భావాన్ని ‘కొంతకాలం’ ద్వారా స్పష్టపరుస్తూ, మూలంలోని క్రియ పునరుక్తిని భారంగా కాకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: כִּי קָרָא יְהוָה לָרָעָב
  choice: ఎందుకంటే యెహోవా కరవును రప్పించడానికి ఆజ్ఞ ఇచ్చాడు
  rationale: קרא ל యొక్క పిలవడం/రప్పించడం అనే అధికారపూర్వక భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְגַם בָּא אֶל הָאָרֶץ שֶׁבַע שָׁנִים
  choice: అది ఈ దేశం మీదికి వచ్చి ఏడు సంవత్సరాలు ఉంటుంది
  rationale: కరవు దేశంపై రావడం మరియు ఏడు సంవత్సరాల వ్యవధి అనే భావాలను సహజమైన తెలుగు వాక్య నిర్మాణంలో కలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది; ఉచ్చారణ పునర్నిర్మాణమైన ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: కరవుపై దేవుని కార్యసాధకత్వం
  choice: కరవును రప్పించడానికి ఆజ్ఞ ఇచ్చాడు
  alternative: కరవును పిలిచాడు
  rationale: మూలంలోని రూపకాన్ని తెలుగులో అర్థమయ్యేలా చేస్తూ, కరవు యెహోవా అధికారానికి లోబడినదనే వాక్యంలోని ఉద్వేగాన్ని తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. స్త్రీతో ప్రత్యక్ష సంభాషణలో మూలంలోని ఏకవచనాన్ని నిలుపుతూ ‘నువ్వు’ వాడబడింది. ‘ఎలీషా’, ‘యెహోవా’ అనే పరిచిత తెలుగు నామరూపాలు ఉపయోగించబడ్డాయి.
