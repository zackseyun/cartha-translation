source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: te
  text: కాబట్టి హజాయేలు అతన్ని కలుసుకోవడానికి వెళ్లాడు. అతడు తన చేతిలో కానుకను—దమస్కులోని శ్రేష్ఠమైన వస్తువులన్నిటినీ, నలభై ఒంటెల మోతను—తీసుకొని వచ్చి ఎలీషా ఎదుట నిలబడ్డాడు. అప్పుడు అతడు, “మీ కుమారుడు, అరాము రాజైన బెన్హదదు, ‘ఈ రోగం నుండి నేను కోలుకుంటానా?’[b] అని చెప్పి నన్ను మీ దగ్గరకు పంపించాడు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ కుమారుడు” అనేది గౌరవనీయుడైన ఉన్నత వ్యక్తి ఎదుట వినయాన్ని తెలిపే మర్యాదపూర్వక సంబోధన; ఇది తప్పనిసరిగా సొంత కుమారుడని అర్థం కాదు.
    reason: cultural_note
  - marker: b
    text: 'మరింత పదశః: “ఈ రోగం నుండి నేను బతుకుతానా?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: అతన్ని కలుసుకోవడానికి
  rationale: לִקְרַאת అనే దిశాసూచక ప్రయోగం ఎవరి వద్దకైనా వెళ్లి కలుసుకోవడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ఇది సహజమైన తెలుగు.
- source_word: מִנְחָה
  choice: కానుకగా
  rationale: ఇది ఆరాధనా అర్పణ కంటే ప్రవక్తకు తీసుకువెళ్లిన గౌరవపూర్వక బహుమతిని సూచిస్తుంది.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: దమస్కులోని శ్రేష్ఠమైన వస్తువులన్నిటినీ
  rationale: טוּב ఇక్కడ దమస్కు అందించే మంచి లేదా ఎంపికైన వస్తువులను సూచిస్తుంది; పదబద్ధమైన ‘మంచిదంతా’ కంటే ఈ రూపం అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: నలభై ఒంటెలకు సరిపడేంత మోత
  rationale: ఈ పదబంధం నలభై ఒంటెలు మోయగల పరిమాణాన్ని సూచిస్తుంది. ‘మోత’ భారం లేదా సరుకు పరిమాణ భావాన్ని నిలుపుతుంది.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: ఎలీషా ఎదుట నిలబడి
  rationale: హీబ్రూ సభాసంబంధమైన సాధారణ వాక్యరూపాన్ని నిలుపుతూ, తెలుగులో సర్వనామ సందిగ్ధతను నివారించడానికి ముందటి సందర్భంలోని ఎలీషా పేరును స్పష్టం చేసింది.
- source_word: בִּנְךָ
  choice: మీ కుమారుడు
  rationale: మూలంలోని ‘నీ కుమారుడు’ అనే రూపకాన్ని తొలగించకుండా, తెలుగులో గౌరవసూచకమైన ‘మీ’ రూపాన్ని వాడింది.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: ఈ రోగం నుండి నేను కోలుకుంటానా?
  rationale: పదశః ‘ఈ రోగం నుండి నేను బతుకుతానా?’ అయినా, వ్యాధి సందర్భంలో ఇది కోలుకోవడాన్ని అడిగే సహజ ప్రయోగం; పదశః ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి భౌగోళిక పేరు ‘సిరియా’ను పెట్టకుండా ప్రాచీన ప్రజా-రాజ్య నామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: బెన్హదదు తనను ‘మీ కుమారుడు’ అని పిలుచుకోవడం
  choice: మూలంలోని కుటుంబసంబంధ రూపకాన్ని ‘మీ కుమారుడు’గా నిలుపడం
  alternative: ‘మీ సేవకుడు’ అని భావానువాదం చేయడం
  rationale: ఈ మాట గౌరవం, వినయం సూచించవచ్చు గాని, మూలంలోని ‘కుమారుడు’ అనే రూపాన్ని ‘సేవకుడు’గా మార్చడం అవసరానికి మించి వ్యాఖ్యానాత్మకమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. ప్రవక్తను ఉద్దేశించినప్పుడు ‘మీ’ అనే గౌరవ బహువచనాన్ని వాడింది. నలభై ఒంటెల మోత అనే పరిమాణాన్ని పాఠకులకు స్పష్టంగా ఉండేలా ‘నలభై ఒంటెలకు సరిపడేంత మోత’గా తెలిపింది.
