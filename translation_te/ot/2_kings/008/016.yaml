source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన అహాబు కుమారుడు యోరాము పరిపాలనలో ఐదవ సంవత్సరంలో[a], యూదా రాజైన యెహోషాపాతు రాజుగా ఉండగా, యెహోషాపాతు కుమారుడైన యెహోరాము యూదాకు రాజుగా పరిపాలించడం ప్రారంభించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మరియు యూదా రాజు యెహోషాపాతు.” హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉంది; ఇది ఒక సహపాలన కాలాన్ని సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూలో ఈ రెండు పేర్ల రూపాలు వేరుగా ఉన్నాయి: ఇశ్రాయేలు రాజు పేరు “యోరాము,” యెహోషాపాతు కుమారుడైన యూదా రాజు పేరు “యెహోరాము”; అయితే ఈ పేర్లు ఒకదానికొకటి సన్నిహిత రూపాలు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ לְ/יוֹרָם
  choice: యోరాము పరిపాలనలోని ఐదవ సంవత్సరంలో
  rationale: రాజుల పరిపాలనా సంవత్సరాన్ని సూచించే హీబ్రూ కాలనిర్దేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన అహాబు కుమారుడు
  rationale: వంశసంబంధాన్ని, రాజబిరుదును స్పష్టంగా నిలుపుతుంది.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు ఇంకా రాజుగా ఉండగా
  rationale: క్రియలేని, సంక్షిప్తమైన హీబ్రూ వాక్యభాగాన్ని కాలసంబంధ పరిస్థితిగా సహజంగా తెలుపుతుంది; సహపాలనను ప్రధాన పాఠ్యంలో నిర్ధారించదు.
- source_word: מָלַךְ
  choice: పరిపాలించడం ప్రారంభించాడు
  rationale: రాజ్యారంభ ప్రకటనలో ఈ క్రియ సింహాసనారోహణతో మొదలైన పాలనను సూచిస్తుంది; కేవలం మొత్తం పాలనను సూచించినట్లు అపార్థం రాకుండా చేస్తుంది.
- source_word: יְהוֹרָם בֶּן יְהוֹשָׁפָט
  choice: యెహోషాపాతు కుమారుడైన యెహోరాము
  rationale: యూదా రాజు పేరులోని యְהוֹרָם రూపాన్ని ‘యెహోరాము’గా ఉంచి, ముందు వచ్చిన ఇశ్రాయేలు రాజు יוֹרָם (‘యోరాము’)తో ఉన్న రూపభేదాన్ని కాపాడుతుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: చివరి సమానాధికార రాజబిరుదును హీబ్రూ ప్రకారమే నిలుపుతుంది.
theological_decisions:
- issue: యెహోషాపాతు పాలనకూ యెహోరాము పాలనారంభానికీ సంబంధించిన సంక్షిప్త కాలక్రమ వాక్యభాగం
  choice: ‘యెహోషాపాతు ఇంకా రాజుగా ఉండగా’ అని కాలసంబంధంగా అనువదించడం
  alternative: ‘మరియు యూదా రాజు యెహోషాపాతు’ అని మరింత అక్షరార్థంగా అనువదించడం, లేదా సహపాలన అని ప్రధాన పాఠ్యంలో స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూ పాఠ్యం సహపాలనను ప్రత్యక్షంగా చెప్పదు. అందువల్ల పాఠ్యంలోని కాలక్రమ ఉద్రిక్తతను తొలగించకుండా, సాధ్యమైన భావాన్ని పఠనయోగ్యంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. రాజుల గుర్తింపులు స్పష్టంగా ఉండేలా పునరుక్తిని నిలిపి, హీబ్రూ కాలక్రమ అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
