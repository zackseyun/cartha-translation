source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: te
  text: 'అయినా, యెహోవా తన సేవకుడైన దావీదు నిమిత్తం యూదాను నాశనం చేయడానికి ఇష్టపడలేదు—దావీదుకు, అతని కుమారుల కొరకు, ఎల్లకాలమూ ఒక దీపాన్ని[b] ఇస్తానని ఆయన అతనితో చెప్పిన[a] ప్రకారమే.


    [a] లేదా “వాగ్దానం చేసిన.”


    [b] “దీపం” అనేది దావీదు రాజవంశం కొనసాగుతుందనే భావాన్ని సూచించే రాజరిక రూపకం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వాగ్దానం చేసిన.”
    reason: lexical_alternative
  - marker: b
    text: “దీపం” అనేది దావీదు రాజవంశం కొనసాగుతుందనే భావాన్ని సూచించే రాజరిక రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא
  choice: అయినా ... లేదు
  rationale: ముందున్న తీర్పు సందర్భానికి విరుద్ధమైన మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָבָה
  choice: ఇష్టపడలేదు
  rationale: ఈ క్రియ కేవలం చేయకపోవడాన్ని కాక సంకల్పం లేదా సమ్మతిని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగానే నిలిపింది.
- source_word: לְהַשְׁחִית
  choice: నాశనం చేయడానికి
  rationale: యూదాపై విధించగల వినాశకర తీర్పును స్పష్టంగా, తగిన బలంతో తెలుపుతుంది.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: తన సేవకుడైన దావీదు నిమిత్తం
  rationale: దావీదుపట్ల దేవునికున్న నిబంధనా గౌరవాన్ని, అతని సేవకుని హోదాను రెండింటినీ కాపాడుతుంది.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: ఆయన అతనితో చెప్పిన మాట ప్రకారమే
  rationale: మూలంలోని ‘చెప్పాడు’ అనే సాధారణ క్రియను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో అది వాగ్దానంగా పనిచేస్తుందనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: נִיר
  choice: దీపం
  rationale: దావీదు వంశ పరంపరను సూచించే స్పష్టమైన రాజరిక రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: לְבָנָיו
  choice: అతని కుమారుల కోసం
  rationale: లְ అనే సంబంధాన్ని నేరుగా ప్రతిబింబిస్తూ, ‘ద్వారా’ అని వంశపారంపర్య భావాన్ని ప్రధాన పాఠ్యంలో మరీ స్పష్టీకరించదు.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లకాలం
  rationale: నిరంతర కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తూ, మూలంలోని కాలవ్యాప్తి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: נִיר అనే దావీదు వంశ సంబంధిత రూపకం
  choice: దీపం
  alternative: వెలుగు; రాజవంశం
  rationale: ‘రాజవంశం’ అని రూపకాన్ని విప్పి చెప్పకుండా, అంతర్పాఠ్య మరియు నిబంధనా ప్రతిధ్వనిని నిలిపింది; అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచి, తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని వాడింది.
- issue: אָמַר యొక్క వాగ్దాన సందర్భం
  choice: చెప్పిన
  alternative: వాగ్దానం చేసిన
  rationale: మూలంలోని సాధారణ ‘చెప్పు’ క్రియను నిలుపుతూ, దాని నిబంధనా కార్యాన్ని పాదటిప్పణిలో సూచించడం ద్వారా రెండూ కనబడేలా చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన హెబ్రీ వాక్యంలోని వాగ్దాన సంబంధాన్ని డాష్‌తో స్పష్టపరిచాం. పాదటిప్పణి గుర్తులను సంబంధిత పదాల దగ్గరే ఉంచాం.
