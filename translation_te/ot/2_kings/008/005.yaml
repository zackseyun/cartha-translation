source:
  edition: WLC
  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: te
  text: అతడు చనిపోయినవాణ్ణి ఎలా తిరిగి బ్రతికించాడో రాజుకు చెబుతూ ఉండగా, ఇదిగో,[a] అతడు ఎవరి కుమారుణ్ణి తిరిగి బ్రతికించాడో ఆ స్త్రీ తన ఇంటి గురించీ తన పొలం గురించీ రాజుకు మొరపెట్టుకుంటూ ఉంది. అప్పుడు గేహజీ, “నా ప్రభువైన రాజా, ఈమెనే ఆ స్త్రీ; ఎలీషా తిరిగి బ్రతికించిన ఆమె కుమారుడు ఇతడే” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇదిగో” అనే మాట, ఆ స్త్రీ సరిగ్గా అదే సమయంలో రాజుకు మొరపెట్టుకుంటూ ఉండడంలోని ఆకస్మికమైన, ఆశ్చర్యకరమైన సందర్భాన్ని ప్రత్యేకంగా చూపిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: అతడు ... రాజుకు చెబుతూ ఉండగా
  rationale: మְסַפֵּר అనే వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను, וַיְהִי పరిచయం చేసే సమకాలిక కథన నేపథ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: చనిపోయినవాణ్ణి ఎలా తిరిగి బ్రతికించాడో
  rationale: హిఫీల్ రూపమైన הֶחֱיָה లోని ‘బతికేలా చేయడం/జీవానికి తిరిగి తేవడం’ అనే కారణార్థాన్ని ‘తిరిగి బ్రతికించాడు’ స్పష్టంగా నిలుపుతుంది. ఏకవచన సందర్భానికి అనుగుణంగా ‘చనిపోయినవాణ్ణి’ వాడబడింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆ స్త్రీ సరిగ్గా అదే సమయంలో రావడంలోని ఆకస్మికమైన, గమనార్హమైన యాదృచ్ఛికతను సూచించే హిన్నేహ్ కథన ప్రభావాన్ని నిలుపుతుంది.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: అతడు ఎవరి కుమారుణ్ణి తిరిగి బ్రతికించాడో ఆ స్త్రీ
  rationale: హీబ్రూ సంబంధ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా మార్చుతూ కుమారుడు మరియు స్త్రీ మధ్య సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: రాజుకు మొరపెట్టుకుంటూ వచ్చింది
  rationale: צעק లోని సహాయం లేదా న్యాయం కోసం చేసే అత్యవసర విజ్ఞప్తి భావాన్ని ‘మొరపెట్టుకోవడం’ సహజంగా అందిస్తుంది; కథనంలో ఆమె రాజు వద్దకు వచ్చిన చలనాన్ని తెలుగు వాక్య నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: తన ఇంటి గురించీ తన పొలం గురించీ
  rationale: עַל ఇక్కడ విజ్ఞప్తికి సంబంధించిన విషయాన్ని సూచిస్తుంది; שָׂדֶה యొక్క నిర్దిష్ట వ్యవసాయ ఆస్తి భావాన్ని ‘పొలం’ నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజసభలోని గౌరవపూర్వక సంబోధనను ఆధునిక, గంభీరమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: ఈమెనే ఆ స్త్రీ; ... ఆమె కుమారుడు ఇతడే
  rationale: ప్రత్యక్షంగా ఎదుట ఉన్నవారిని గుర్తించి చూపే నిర్దేశక సర్వనామాల బలాన్ని ‘ఈమెనే/ఇతడే’ నిలుపుతాయి.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: ఎలీషా తిరిగి బ్రతికించిన
  rationale: అదే הֶחֱיָה క్రియకు వచనం అంతటా ఒకే తెలుగు సమానార్థకాన్ని ఉంచి కారణార్థాన్ని కాపాడుతుంది.
