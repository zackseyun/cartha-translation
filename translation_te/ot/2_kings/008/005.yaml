translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజసభ సంభాషణకు తగిన గౌరవభరితమైన శైలి. ‘తిరిగి బ్రతికించాడు’ అనే పదబంధం మూలంలోని కారణార్థాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
