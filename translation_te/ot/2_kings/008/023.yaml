  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక శైలి. మూలంలోని అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా నిలిపాం; వాక్యారంభంలోని וְకు సందర్భంలో ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని జోడించలేదు.
