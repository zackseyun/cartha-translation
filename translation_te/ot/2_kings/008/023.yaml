  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: యోరాము[b] యొక్క మిగిలిన కార్యాలు, అతడు చేసినదంతా, యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుల వార్షిక వృత్తాంతాల గ్రంథంలో.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో యోరాము; సంప్రదాయంగా ‘యెహోరాము.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: చేసిన మిగిలిన కార్యాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; రాజుల పాలనను సంగ్రహించే ఈ సూత్రప్రాయ వాక్యంలో דִּבְרֵי అనేది మాటలను కాక, రాజు కార్యాలు లేదా పాలనకు సంబంధించిన విషయాలను సూచిస్తుంది.
- source_word: יוֹרָם
  choice: యోరాము
  rationale: హీబ్రూ రూపం יוֹרָםను నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ. సంప్రదాయ రూపమైన ‘యెహోరాము’ను పాదసూచికలో తెలిపాం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: మూలంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: రాసి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను తెలుగు వాడుకలో సహజంగా వినిపించే ‘కదా?’ నిర్మాణంతో నిలిపింది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథం
  rationale: రాజుల అధికారిక కాలక్రమ రికార్డులను సూచించే పదబంధం; ‘దినవృత్తాంతాలు’ మూలంలోని ‘దినాల విషయాలు’ అనే భావాన్ని, చారిత్రక రికార్డు స్వభావాన్ని రెండింటినీ తెలియజేస్తుంది.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల
  rationale: ఇక్కడ לְ అనేది ఆ దినవృత్తాంతాలు యూదా రాజులకు సంబంధించినవని తెలిపే సంబంధార్థక ప్రయోగం.
