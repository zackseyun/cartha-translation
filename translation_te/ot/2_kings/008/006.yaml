  text: וַ/יִּשְׁאַ֥ל הַ/מֶּ֛לֶךְ לָ/אִשָּׁ֖ה וַ/תְּסַפֶּר ל֑/וֹ וַ/יִּתֶּן לָ֣/הּ הַ/מֶּלֶךְ֩ סָרִ֨יס אֶחָ֜ד לֵ/אמֹ֗ר הָשֵׁ֤יב אֶת כָּל אֲשֶׁר לָ/הּ֙ וְ/אֵת֙ כָּל תְּבוּאֹ֣ת הַ/שָּׂדֶ֔ה מִ/יּ֛וֹם עָזְבָ֥ה אֶת הָ/אָ֖רֶץ וְ/עַד עָֽתָּה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: te
  text: రాజు ఆ స్త్రీని అడిగాడు; ఆమె అతనికి వివరించింది. అప్పుడు రాజు ఆమెకు ఒక రాజోద్యోగిని[a] నియమించి, “ఆమెకు చెందినదంతా, ఆమె దేశాన్ని విడిచివెళ్లిన రోజు మొదలుకొని ఇప్పటివరకు ఆ పొలం ఇచ్చిన దిగుబడి అంతా ఆమెకు తిరిగి అప్పగించు” అని ఆదేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక నపుంసకుణ్ణి.’ ఈ రాజసభ సంబంధమైన పదం శారీరకంగా నపుంసకుడైన వ్యక్తిని గానీ, సాధారణంగా ఒక రాజోద్యోగిని గానీ సూచించవచ్చు.
    reason: సָרִיס పదంలోని నిజమైన పదార్థ అస్పష్టతను నిలుపుటకు.
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: రాజు ఆ స్త్రీని అడిగాడు
  rationale: లְ తో వచ్చిన క్రియాపూరకాన్ని సహజమైన తెలుగు కర్మరూపంలో ఇచ్చాం. సందర్భంలో ముందే ప్రస్తావించిన షూనేమీయురాలు కాబట్టి నిర్దిష్టతను చూపేందుకు ‘ఆ స్త్రీ’ వాడాం.
- source_word: וַתְּסַפֶּר לוֹ
  choice: ఆమె అతనికి వివరించింది
  rationale: పీయేల్ రూపంలోని ספר ఇక్కడ జరిగిన విషయాన్ని చెప్పడం లేదా వివరించడం అనే భావం ఇస్తుంది; తెలుగు కథనంలో ‘వివరించింది’ సహజంగా ఉంది.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: రాజు ఆమెకు ఒక రాజోద్యోగిని నియమించి
  rationale: ఇక్కడ נתן అనేది ఆ స్త్రీ పక్షాన పునరుద్ధరణను అమలు చేయడానికి ఒక వ్యక్తిని నియమించడం. סָרִיס పదం రాజసభాధికారిని లేదా నపుంసకుణ్ణి సూచించగలదు; ప్రధాన పాఠ్యంలో సందర్భానుకూలమైన విస్తృత అర్థాన్ని ఎంచుకున్నాం.
- source_word: לֵאמֹר
  choice: అని ఆదేశించాడు
  rationale: ఈ సందర్భంలో ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే రూపం రాజాజ్ఞను సూచిస్తోంది. యాంత్రికమైన ‘అంటూ’ కంటే తెలుగు వాక్యప్రవాహంలో ‘అని ఆదేశించాడు’ స్పష్టంగా ఉంది.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: ఆమెకు చెందినదంతా ... ఆమెకు తిరిగి అప్పగించు
  rationale: హిఫీల్ ఆజ్ఞారూపం వస్తువులను తిరిగి ఇచ్చేలా చేయడాన్ని సూచిస్తుంది. ‘తిరిగి అప్పగించు’ ఆస్తి పునరుద్ధరణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: ఆ పొలం ఇచ్చిన దిగుబడి అంతా
  rationale: תְּבוּאָה వ్యవసాయ ఉత్పత్తి లేదా దిగుబడిని సూచిస్తుంది. తెలుగు సహజత్వం కోసం పొలం ఉత్పత్తి చేసిన దిగుబడి అనే సంబంధాన్ని స్పష్టం చేశాం; దాన్ని కేవలం నగదు ఆదాయంగా సంకుచితం చేయలేదు.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: ఆమె ఈ దేశాన్ని విడిచివెళ్లిన రోజు మొదలుకొని ఇప్పటివరకు
  rationale: אֶרֶץ సందర్భంలో ఆమె విడిచిన స్వదేశ భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ దేశం’ సహజమైనది. కాలవ్యాప్తిని ‘రోజు మొదలుకొని ఇప్పటివరకు’ స్పష్టంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథనశైలిని వాడాం. రాజాజ్ఞ యొక్క అధికారిక స్వరాన్ని నిలుపుతూ, హెబ్రీ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా సహజ తెలుగు క్రమాన్ని అనుసరించాం.
