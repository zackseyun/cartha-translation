source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר יוֹרָם֙ צָעִ֔ירָ/ה וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַֽ/יְהִי ה֞וּא קָ֣ם לַ֗יְלָה וַ/יַּכֶּ֨ה אֶת אֱד֜וֹם הַ/סֹּבֵ֤יב אֵלָי/ו֙ וְ/אֵת֙ שָׂרֵ֣י הָ/רֶ֔כֶב וַ/יָּ֥נָס הָ/עָ֖ם לְ/אֹהָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: te
  text: కాబట్టి యెహోరాము తనతో ఉన్న రథాలన్నిటితో జాయీరుకు[a] వెళ్లాడు. అతడు రాత్రివేళ లేచి, తనను చుట్టుముట్టి ఉన్న ఎదోమీయులనూ రథాధిపతులనూ కొట్టాడు. అయితే ప్రజలు తమ తమ గుడారాలకు పారిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా ‘సెయీరుకు.’ ఇక్కడి హీబ్రూ స్థలనామం צָעִירָה అర్థం నిర్ధారించడం కష్టం. కొందరు దీన్ని జాయీరు అనే ప్రత్యేక స్థలనామంగా కాకుండా సెయీరు/ఎదోముతో సంబంధమున్న రూపంగా భావిస్తారు.
    reason: alternative_reading
  - marker: b
    text: ‘తమ తమ గుడారాలకు పారిపోయారు’ అనేది వారు చెదరిపోయి తమ ఇళ్లకు తిరిగిపోయారని తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: దాటివెళ్లాడు
  rationale: עבר అనే క్రియలోని దాటడం లేదా అవతలికి వెళ్లడం అనే భావాన్ని సైనిక కదలిక సందర్భంలో సహజంగా నిలుపుతుంది.
- source_word: צָעִירָה
  choice: జాయీరుకు
  rationale: మసొరెటిక పాఠంలోని స్వరచిహ్నాలను అనుసరించి దీనిని స్థలనామంగా లిప్యంతరీకరించాం; సెయీరు అనే సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָל הָרֶכֶב
  choice: తన రథాలన్నిటితో
  rationale: רכב ఇక్కడ సమష్టిగా రథదళాన్ని సూచించగలిగినా, మూలంలోని రూపాన్ని దగ్గరగా అనుసరిస్తూ తెలుగులో సహజమైన బహువచనాన్ని వాడాం.
- source_word: קָם לַיְלָה
  choice: రాత్రివేళ లేచి
  rationale: రాత్రి సమయంలో చర్యకు ఉపక్రమించాడనే హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּכֶּה
  choice: హతమార్చాడు
  rationale: נכה కు కొట్టడం లేదా దెబ్బతీయడం అనే విస్తృత అర్థం ఉంది; యుద్ధసందర్భంలో లక్ష్యాలుగా ప్రజలూ అధిపతులూ ఉన్నందున ‘హతమార్చాడు’ సహజంగా సరిపోతుంది, అయితే సంపూర్ణ విజయం సాధించాడని అదనంగా చెప్పదు.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: తనను చుట్టుముట్టిన ఎదోమీయులను
  rationale: ‘ఎదోము’ అనే సమష్టి పేరును సందర్భానుగుణంగా ప్రజలను సూచించే ‘ఎదోమీయులు’గా ఇచ్చి, చుట్టుముట్టిన సైనిక దృశ్యాన్ని నిలిపాం.
- source_word: שָׂרֵי הָרֶכֶב
  choice: రథాధిపతులను
  rationale: שׂרים అనే పదంలోని అధికార లేదా సైనిక నాయకత్వ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: ప్రజలు తమ తమ గుడారాలకు పారిపోయారు
  rationale: העם అనే విస్తృత పదాన్ని ‘ప్రజలు’గా ఉంచి, హీబ్రూ నుడికారంలోని గుడారాల దృశ్యాన్ని యథాతథంగా నిలిపాం; దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. స్థలనామంలోని పాఠభేద అనిశ్చితిని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదటిప్పణిలో నిలిపాం; ‘గుడారాలకు’ అనే మూలభాషా చిత్రాన్ని కూడా కాపాడాం.
