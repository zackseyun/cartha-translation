revisions:
- from: కాబట్టి యోరాము తన రథాలన్నిటితో కలిసి జాయీరుకు[a] దాటివెళ్లాడు. అతడు రాత్రివేళ లేచి, తనను చుట్టుముట్టిన ఎదోమీయులనూ రథాధిపతులనూ హతమార్చాడు. అయితే ప్రజలు తమ తమ గుడారాలకు పారిపోయారు.[b]
  to: కాబట్టి యెహోరాము తనతో ఉన్న రథాలన్నిటితో జాయీరుకు[a] వెళ్లాడు. అతడు రాత్రివేళ లేచి, తనను చుట్టుముట్టి ఉన్న ఎదోమీయులనూ రథాధిపతులనూ కొట్టాడు. అయితే ప్రజలు తమ తమ గుడారాలకు పారిపోయారు.[b]
  rationale: The revision removes the unwarranted implication of killing by rendering וַיַּכֶּה as ‘కొట్టాడు.’ It also uses the standard Telugu biblical name ‘యెహోరాము’ and makes the chariot accompaniment phrasing more idiomatic, while retaining the difficult place-name reading and both footnote anchors.
  reviewer_model: gpt-5.6-terra
