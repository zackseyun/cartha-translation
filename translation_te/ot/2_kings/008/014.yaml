source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ מֵ/אֵ֣ת אֱלִישָׁ֗ע וַ/יָּבֹא֙ אֶל אֲדֹנָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָֽה אָמַ֥ר לְ/ךָ֖ אֱלִישָׁ֑ע וַ/יֹּ֕אמֶר אָ֥מַר לִ֖/י חָיֹ֥ה תִחְיֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: te
  text: అప్పుడు అతడు ఎలీషా దగ్గరనుంచి వెళ్లి తన యజమాని దగ్గరకు వచ్చాడు. అతని యజమాని అతనితో, “ఎలీషా నీతో ఏమన్నాడు?” అన్నాడు. అతడు, “ఎలీషా నాకు, ‘మీరు తప్పకుండా కోలుకుంటారు’ అని చెప్పాడు” అని జవాబిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “మీరు తప్పకుండా బతుకుతారు.” హీబ్రూలో బలంగా నొక్కిచెప్పడానికి క్రియను పునరుక్తి చేశారు: “జీవిస్తూ, నీవు జీవిస్తావు” అన్నట్లుగా. ఈ సందర్భంలో అది వ్యాధి నుంచి కోలుకోవడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: అతడు ఎలీషా దగ్గరనుంచి వెళ్లి
  rationale: הלך కథనాన్ని ముందుకు నడిపే సాధారణ గమనక్రియ; מֵאֵת విడిపోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరనుంచి వెళ్లి’ సహజంగా రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: తన యజమాని దగ్గరకు వచ్చాడు
  rationale: בוא + אֶל ను సహజంగా ‘దగ్గరకు వచ్చాడు’ అని అనువదించాం. אֲדֹנָיו ఇక్కడ హజాయేలు అధిపతియైన బెన్హదదును సూచిస్తుంది.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: ఎలీషా నీతో ఏమన్నాడు?
  rationale: హీబ్రూ ప్రశ్నను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు సంభాషణగా నిలిపాం.
- source_word: אָמַר לִי
  choice: అతడు నాతో చెప్పాడు
  rationale: ‘నాతో చెప్పాడు’ అనేది మూలంలోని לִי భావాన్ని స్పష్టంగా ఉంచుతూ నివేదిత సంభాషణలో సహజంగా ఉంటుంది.
- source_word: חָיֹה תִחְיֶה
  choice: మీరు తప్పకుండా కోలుకుంటారు
  rationale: అనంత ధాతురూపం మరియు అసంపూర్ణ క్రియారూపం కలయిక నిశ్చయార్థక బలాన్ని ఇస్తుంది; ‘తప్పకుండా’ దాన్ని వ్యక్తం చేస్తుంది. వ్యాధి సందర్భంలో ‘బతుకుతారు’ కంటే ‘కోలుకుంటారు’ ఉద్దేశించిన భావాన్ని సహజంగా తెలియజేస్తుంది. యజమానితో ప్రత్యక్ష సంభాషణ కావడంతో గౌరవార్థక ‘మీరు’ వాడాం.
theological_decisions:
- issue: אֲדֹנָיו అనే పదాన్ని దైవ బిరుదుగా అర్థం చేసుకునే అవకాశం
  choice: తన యజమాని
  alternative: తన ప్రభువు
  rationale: ఈ సందర్భంలో అది దేవుని బిరుదు కాదు; హజాయేలు యొక్క మానవ అధిపతిని సూచిస్తుంది. ‘యజమాని’ రాజసభలోని ఆధీన సంబంధాన్ని తెలియజేస్తూ అనవసరమైన దైవార్థాన్ని నివారిస్తుంది.
- issue: חָיֹה תִחְיֶה లోని ‘జీవించడం’ అనే రూపకం
  choice: మీరు తప్పకుండా కోలుకుంటారు
  alternative: మీరు తప్పకుండా బతుకుతారు
  rationale: రాజు వ్యాధి గురించి అడిగిన సందర్భం కావడంతో ‘కోలుకుంటారు’ సందర్భార్థాన్ని అందిస్తుంది; అయితే మూలంలోని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం, తద్వారా తరువాతి కథనంలోని ఉద్రిక్తతను చెరపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, గౌరవప్రదమైన రాజసభ సంభాషణను ఉపయోగించాం. ‘అతని యజమాని’ని రెండో వాక్యంలో స్పష్టంగా పునరుక్తి చేయడం ద్వారా తెలుగు పాఠకుడికి వక్త మార్పు తేలికగా అర్థమయ్యేలా చేశాం.
