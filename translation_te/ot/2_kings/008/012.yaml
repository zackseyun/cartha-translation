source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: te
  text: 'హజాయేలు, “నా ప్రభువా, మీరు ఎందుకు ఏడుస్తున్నారు?” అని అడిగాడు. ఆయన ఇలా అన్నాడు: “ఎందుకంటే నువ్వు ఇశ్రాయేలు కుమారులకు[a] చేయబోయే కీడు నాకు తెలుసు. నువ్వు వారి కోటలకు నిప్పంటిస్తావు[b], వారి యువకులను కత్తితో చంపుతావు, వారి పసిపిల్లలను నేలకేసి బాదుతావు, వారి గర్భిణీ స్త్రీల పొట్టలను చీల్చుతావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు ప్రజలకు,” “ఇశ్రాయేలీయులకు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారి దుర్గాలను కాల్చివేస్తావు.” అక్షరార్థంగా, “వారి కోటలను అగ్నిలోకి పంపుతావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: ఎలీషాను గౌరవంగా సంబోధించే మానవీయ బిరుదు; దేవునికి వాడే నామంగా అర్థం కాకుండా సందర్భానుగుణ గౌరవాన్ని నిలుపుతుంది.
- source_word: בֹכֶה
  choice: ఏడుస్తున్నారు
  rationale: కొనసాగుతున్న ఏడుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי יָדַעְתִּי
  choice: ఎందుకంటే ... నాకు తెలుసు
  rationale: హజాయేలు అడిగిన ప్రశ్నకు ఎలీషా చెప్పిన కారణాన్ని సహజంగా తెలియజేస్తూ, హీబ్రూ క్రియలోని వర్తమాన ప్రాసంగికతను నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: నువ్వు ... చేయబోయే కీడు
  rationale: రాబోయే చర్యను, దాని నైతిక తీవ్రతను కలిపి స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ రూపాన్ని సన్నిహితంగా నిలుపుతుంది; ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచించగలదని పాదసూచిక వివరిస్తుంది.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: వారి కోటలకు నిప్పంటిస్తావు
  rationale: ‘అగ్నిలోకి పంపడం’ అనే హీబ్రూ ప్రయోగాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וּבַחֻרֵיהֶם
  choice: వారి యువకులను
  rationale: యౌవన ప్రాయంలో ఉన్న పురుషులను నేరుగా సూచిస్తుంది; యుద్ధ సందర్భం వారి పోరాట సామర్థ్యాన్ని సూచిస్తుంది.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: కత్తితో చంపుతావు
  rationale: ఆయుధాన్ని, హింసాత్మక చర్యను రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: עֹלְלֵיהֶם תְּרַטֵּשׁ
  choice: వారి పసిపిల్లలను నేలకేసి బాదుతావు
  rationale: చిన్న పిల్లల అసహాయతను, యుద్ధహింస యొక్క క్రూరత్వాన్ని మృదూకరించకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְהָרֹתֵיהֶם תְּבַקֵּעַ
  choice: వారి గర్భిణుల పొట్టలు చీలుస్తావు
  rationale: మూలంలోని ఉద్దేశపూర్వకంగా ఘోరమైన చిత్రణను సభ్యోక్తితో తగ్గించకుండా అందిస్తుంది.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל అనే సమష్టి వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలు ప్రజలకు / ఇశ్రాయేలీయులకు
  rationale: మూలంలోని పుంలింగ సమష్టి జాతీయ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, దాని సహజ సమష్టి అర్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: ప్రవచన వాక్యంలో ఘోర హింసను వ్యక్తం చేయడం
  choice: దారుణ చర్యలను స్పష్టంగా అనువదించడం
  alternative: ‘హాని చేస్తావు’ వంటి మృదువైన పదాలతో చెప్పడం
  rationale: హీబ్రూ పాఠ్యం హింసను ఉద్దేశపూర్వకంగా స్పష్టంగా చిత్రిస్తుంది; దాని నైతిక భారం తగ్గకుండా అనువదించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, గంభీరమైన శైలి వాడబడింది. హజాయేలు ఎలీషాను గౌరవంగా సంబోధిస్తున్నందున ‘మీరు’ వాడగా, ఎలీషా ప్రవచనాత్మకంగా హజాయేలును ఉద్దేశించి ‘నువ్వు’ అన్న ఏకవచనాన్ని వాడాడు. మూలంలోని హింసాత్మక వివరాలను మృదూకరించలేదు.
