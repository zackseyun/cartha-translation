review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew sequence and force: Hazael’s respectful address, Elisha’s stated knowledge of the evil Hazael will do to Israel, the burning of fortified places, killing young men with the sword, dashing little children, and the assault on pregnant women. The phrase “ఇశ్రాయేలు కుమారులకు” appropriately preserves the formal Hebrew idiom, with a helpful alternative in the footnote.'
  naturalness: 'The Telugu is clear, modern, and suitably grave. A small syntactic revision is needed in the final clause: “వారి గర్భిణుల పొట్టలు చీలుస్తావు” can sound as though the pregnant women’s stomachs themselves are the agent/object without explicitly identifying the women. “వారి గర్భిణీ స్త్రీల పొట్టలను చీల్చుతావు” is clearer and idiomatic while retaining the graphic sense.'
  terminology: “నా ప్రభువా” is an appropriate respectful human address; “కీడు,” “కోటలు,” “యువకులు,” and “పసిపిల్లలు” fit the source and register. “కత్తితో” correctly renders the instrumental phrase. The revised final expression preserves the source’s reference to pregnant women, rather than making an imprecise anatomical expression the primary referent.
  issues:
  - severity: low
    issue: The final clause does not explicitly identify the pregnant women as the direct victims.
    rationale: The Hebrew says literally that Hazael will rip open “their pregnant women.” Revising to “వారి గర్భిణీ స్త్రీల పొట్టలను చీల్చుతావు” makes the Telugu syntax explicit and preserves the violent action without altering meaning.
