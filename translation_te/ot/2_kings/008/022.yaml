translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. హీబ్రూ రాజకీయ నుడికారాన్ని పదక్షరంగా కాక, దాని భావాన్ని నిలుపుతూ సహజంగా అనువదించాం.
