source:
  edition: WLC
  text: וַ/יִּפְשַׁ֣ע אֱד֗וֹם מִ/תַּ֨חַת֙ יַד יְהוּדָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה אָ֛ז תִּפְשַׁ֥ע לִבְנָ֖ה בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: te
  text: ఎదోము యూదా ఆధిపత్యం నుండి తిరుగుబాటు చేసి విడిపోయింది; అది ఈ దినం వరకు స్వతంత్రంగానే ఉంది[a]. అప్పుడు లిబ్నా కూడా అదే సమయంలో తిరుగుబాటు చేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరుగుబాటు చేసింది’ అనే హీబ్రూ క్రియ రాజకీయ పాలనకు ఎదురుతిరగడం లేదా దాని నుండి విడిపోవడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  choice: తిరుగుబాటు చేసింది
  rationale: రాజకీయ సందర్భంలో פשע స్థాపిత పాలనకు ఎదురుతిరగడం లేదా దాని నుండి విడిపోవడం అనే భావాన్ని ఇస్తుంది. ‘తిరుగుబాటు చేసింది’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, రెండు సందర్భాల్లోనూ మూలపదపు ఏకరూపతను నిలుపుతుంది.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: యూదా ఆధిపత్యానికి వ్యతిరేకంగా … విడిపోయి
  rationale: ‘యూదా చేతికింద నుండి’ అనే హీబ్రూ రూపకాన్ని యథాతథంగా ఉంచితే ఆధునిక తెలుగులో అసహజంగా ఉంటుంది. ఈ సందర్భంలో అది యూదా పాలన లేదా అధీనాన్ని సూచిస్తుంది; ‘ఆధిపత్యానికి వ్యతిరేకంగా … విడిపోయి’ రాజకీయ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు అలాగే ఉంది
  rationale: ఈ స్థితి వృత్తాంతకర్త కాలం వరకు కొనసాగిందని తెలిపే హీబ్రూ కాలసూచక సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను అదే చారిత్రక సందర్భంతో అనుసంధానించే సాధారణ కథన పదం.
- source_word: לִבְנָה
  choice: లిబ్నా
  rationale: స్థలనామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בָּעֵת הַהִיא
  choice: అదే సమయంలో
  rationale: లిబ్నా తిరుగుబాటు కూడా పేర్కొన్న చారిత్రక కాలంలోనే జరిగిందని సహజంగా స్పష్టం చేస్తుంది.
