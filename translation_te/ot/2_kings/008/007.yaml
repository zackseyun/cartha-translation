id: 2KI.8.7
reference: 2 Kings 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: te
  text: తర్వాత ఎలీషా దమస్కుకు వచ్చాడు. అరాము రాజైన బెన్‌హదదు అనారోగ్యంతో ఉన్నాడు. “దేవుని మనిషి ఇక్కడికి వచ్చాడు” అని అతనికి తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: తర్వాత ... వచ్చాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘తర్వాత’ ఆధునిక తెలుగులో సహజమైన కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: דַּמֶּשֶׂק
  choice: దమస్కు
  rationale: స్థలనామానికి తెలుగులో సుపరిచితమైన రూపం.
- source_word: וּבֶן־הֲדַד
  choice: అప్పుడు ... బెన్హదదు
  rationale: ఇక్కడ వావ్ నేపథ్య పరిస్థితిని పరిచయం చేస్తుంది; ‘అప్పుడు’ సంబంధాన్ని సహజంగా ఉంచుతుంది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: హీబ్రూ వచనం ‘అరాము’ అని ఉంది; ‘సిరియా’ అనే తరువాతి భౌగోళిక సమానార్థాన్ని ప్రధాన పాఠ్యంలోకి తేవలేదు.
- source_word: חֹלֶה
  choice: అనారోగ్యంతో ఉన్నాడు
  rationale: బెన్హదదు స్థితిని తెలిపే విధేయ కృదంతాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֻּגַּד לוֹ
  choice: అతనికి తెలియజేశారు
  rationale: హోఫల్ క్రియలోని పరోక్ష/కర్మణి భావాన్ని తెలుగులో కర్తను పేర్కొనకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: “...” అని
  rationale: హీబ్రూ ఉల్లేఖన సూత్రాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంతో ప్రతిబింబిస్తుంది.
- source_word: בָּא
  choice: వచ్చాడు
  rationale: పూర్తయిన రాకను, దాని ప్రస్తుత ఫలితంగా అతడు అక్కడ ఉన్నాడనే భావాన్ని సందర్భం అందిస్తుంది; తెలుగులో సాధారణ భూతకాల రూపం సహజంగా రెండింటినీ మోయగలదు.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తను సూచించే హీబ్రూ బిరుదును వివరణాత్మకంగా ‘దేవుని ప్రవక్త’గా మార్చకుండా మూల రూపానికి దగ్గరగా ఉంచుతుంది.
- source_word: עַד הֵנָּה
  choice: ఇక్కడికి
  rationale: మాట్లాడేవారి స్థలానికి చేరడాన్ని సూచించే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానం.
