translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యాన్ని మరియు ‘దేవుని మనిషి’ అనే మూల బిరుదును నిలుపుతూ అనువదించబడింది. ‘అరాము’ అనే మూల భౌగోళిక పేరే ఉపయోగించబడింది; ఈ వచనంలో పాదసూచిక అవసరం లేదు.
