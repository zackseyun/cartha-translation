  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: te
  text: అతడు అహాబు ఇంటివారి మార్గంలో నడిచాడు. అహాబు ఇంటివారిలాగే యెహోవా దృష్టిలో చెడైనది చేశాడు. ఎందుకంటే అతడు అహాబు ఇంటివారికి అల్లుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహాబు ఇంటివారితో వివాహ సంబంధం కలిగినవాడు.” హీబ్రూ పదం ‘అల్లుడు’ అనే నిర్దిష్ట అర్థంతో పాటు, విస్తృతంగా వివాహం ద్వారా ఏర్పడిన బంధాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలో నడిచాడు
  rationale: హీబ్రూ వాక్యంలో జీవన ప్రవర్తనను సూచించే ‘మార్గంలో నడవడం’ అనే రూపకం ఉంది. తెలుగు అనువాదం దానిని సహజంగానే నిలుపుతుంది.
- source_word: בֵּית אַחְאָב
  choice: అహాబు ఇంటివారు / అహాబు ఇల్లు
  rationale: בַּיִת ఇక్కడ కుటుంబం, రాజవంశం, దాని సభ్యులు అనే భావాలను కలిగి ఉంది. ‘ఇంటివారు’ పోలికలో సహజంగా ఉండగా, ‘ఇంటికి’ వివాహ సంబంధాన్ని తెలుపుతుంది; ‘వంశం’ అని మాత్రమే అనడం వల్ల గృహం-కుటుంబం అనే విస్తృత భావం కుదించబడదు.
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడైనది చేశాడు
  rationale: రాజుల గ్రంథంలో తరచుగా వచ్చే నైతిక మూల్యాంకన సూత్రాన్ని సరళమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: అక్షరార్థమైన ‘కళ్లలో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; దేవుని మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כְּבֵית אַחְאָב
  choice: అహాబు ఇంటివారిలాగే
  rationale: כְּ సూచించే పోలికను స్పష్టంగా తెలియజేస్తూ, ఆ ఇంటివారి ప్రవర్తనతో అతని ప్రవర్తనను పోలుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి నైతిక మూల్యాంకనానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: అహాబు ఇంటికి వివాహ బంధువు
  rationale: חָתָן ప్రత్యేకంగా ‘అల్లుడు’ అని సూచించగలిగినా, వివాహం వల్ల ఏర్పడిన బంధాన్ని విస్తృతంగా కూడా సూచించవచ్చు. సందర్భంలోని వంశ సంబంధ సంక్లిష్టతను బట్టి ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచి, ప్రత్యేక అర్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో నిలిపాం.
- issue: అహాబు ఇంటితో వివాహ సంబంధ స్వరూపం
  choice: వివాహ బంధువు
  alternative: అల్లుడు
  rationale: חָתָן పదం ‘అల్లుడు’ అనే నిర్దిష్ట అర్థంతో పాటు వివాహ బంధాన్ని విస్తృతంగా సూచించగలదు. మూలంలోని సాధ్యమైన విస్తృతిని ప్రధాన పాఠంలో కాపాడి, నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘మార్గంలో నడిచాడు’ అనే బైబిలీయ ప్రవర్తనా రూపకం నిలుపబడింది; పొడవైన ఒకే వాక్యానికి బదులు మూడు చిన్న వాక్యాలుగా విభజించి పఠనసౌలభ్యం పెంచబడింది.
