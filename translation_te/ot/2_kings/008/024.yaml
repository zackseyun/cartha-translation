source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹרָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: te
  text: యోరాము తన పితరులతో నిద్రించాడు[a]. దావీదు నగరంలో తన పితరులతో పాటు సమాధి చేయబడ్డాడు. అతని కుమారుడైన అహజ్యా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తన పితరులతో పడుకున్నాడు.’ ఇది రాజు మరణాన్ని తెలిపే సంప్రదాయ హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ఇది రాజుల మరణవార్తల్లో వాడే సంప్రదాయ హీబ్రూ మరణసూత్రం. తెలుగులో ‘తన పితరులతో కూడ నిద్రించాడు’ అనే రూపం ఆ రూపకాన్ని సహజంగా నిలుపుతుంది; కేవలం ‘చనిపోయాడు’ అనడం మూలంలోని రూపకాన్ని తొలగిస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: రాజవంశ సంబంధమైన స్థిర సూత్రాన్ని దగ్గరగా ప్రతిబింబిస్తుంది. ‘పూర్వీకులతో’ అనేది భావాన్ని స్పష్టం చేసినా, మూలంలోని ‘పితరులు’ అనే వంశపారంపర్య పదాన్ని సాధారణీకరిస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: నిఫాల్ క్రియ యొక్క కర్మణి భావాన్ని స్పష్టంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: గుర్తింపు పొందిన స్థలనామమైన ‘దావీదు నగరం’ను పారదర్శకంగా నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడి రాజ్యవారసత్వ సూత్రంలో క్రియ యోరాము స్థానంలో అహజ్యా రాజుగా అధికారంలోకి రావడాన్ని తెలియజేస్తుంది. ‘పరిపాలించాడు’ కూడా సాధ్యమే, కాని ‘అతని స్థానంలో’తో కలిపి ‘రాజయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్యవారసత్వ సందర్భంలో ‘అతనికి బదులుగా/అతని స్థానంలో’ అనే అర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: יוֹרָם
  choice: యోరాము
  rationale: మసొరేటిక్ పాఠంలోని యోరామ్ రూపాన్ని తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించింది; విస్తృత రూపమైన ‘యెహోరాము’ను ఇక్కడ దిగుమతి చేయలేదు.
- source_word: אֲחַזְיָהוּ
  choice: అహజ్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: ‘తన పితరులతో కూడ నిద్రించాడు’ అనే మరణసూత్రం యొక్క భావం
  choice: హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, అది రాజమరణానికి సంబంధించిన సంప్రదాయ సూత్రమని పాదటిప్పణిలో వివరించడం
  alternative: నేరుగా ‘చనిపోయాడు’ అని అనువదించడం
  rationale: మూలపాఠంలోని రూపకాన్ని మరియు దాని సాధ్యమైన భావతీవ్రతను నిలుపుతూ, దానిలో నిర్దిష్టమైన పరలోక సిద్ధాంతాన్ని చదివించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. హీబ్రూ రాజవంశ మరణసూత్రాన్ని సాధ్యమైనంత సహజంగా నిలిపి, పేర్లను మూలరూపాలకు దగ్గరగా ఉంచాం.
