- source_word: בֶן יְהוֹרָם
  choice: యెహోరాము కుమారుడు
  rationale: హీబ్రూ పాఠంలోని יְהוֹרָם రూపాన్ని నిలుపుతూ, ముందున్న יוֹרָם అనే సంబంధిత నామరూపం నుండి భేదాన్ని స్పష్టంగా ఉంచాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: రాజబిరుదును నేరుగా, సహజమైన తెలుగు విశేషణ నిర్మాణంలో అనువదించాం.
