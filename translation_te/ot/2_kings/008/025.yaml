  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: te
  text: అహాబు కుమారుడైన ఇశ్రాయేలు రాజు యోరాము[a] పరిపాలనలో పన్నెండవ సంవత్సరంలో, యెహోరాము కుమారుడైన యూదా రాజు అహజ్యా రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇశ్రాయేలు రాజు పేరు “యోరాము,” యూదా రాజు పేరు “యెహోరాము.” ఇవి సంబంధిత రెండు నామరూపాలు; కొన్ని అనువాదాల్లో రెండింటినీ “యోరాము” అని పేర్కొంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: పరిపాలనలో పన్నెండవ సంవత్సరంలో
  rationale: హీబ్రూ రాజ్యకాల గణన సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, దాని భావాన్ని స్పష్టంగా తెలియజేసేలా అనువదించాం.
- source_word: לְיוֹרָם
  choice: యోరాము పరిపాలనలో
  rationale: ఈ రాజ్యకాల సూత్రంలో לְ అనే ఉపసర్గ ఎవరి పరిపాలనా సంవత్సరం లెక్కించబడుతోందో సూచిస్తుంది.
- source_word: בֶּן אַחְאָב
  choice: అహాబు కుమారుడు
