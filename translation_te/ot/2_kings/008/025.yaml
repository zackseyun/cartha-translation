- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: రాజ్యారోహణ వృత్తాంతాల్లో ఈ క్రియ సాధారణంగా పరిపాలన ఆరంభాన్ని సూచిస్తుంది; కేవలం కొనసాగుతున్న పాలనగా అర్థం కాకుండా “రాజయ్యాడు” అని ఇచ్చాం.
- source_word: אֲחַזְיָהוּ
