id: 2KI.8.10
reference: 2 Kings 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: te
  text: 'ఎలీషా అతనితో ఇలా అన్నాడు: “నువ్వు వెళ్లి అతనికి, ‘మీరు తప్పకుండా కోలుకుంటారు’ అని చెప్పు.[a] అయితే అతడు తప్పకుండా చనిపోతాడని యాహ్వే నాకు చూపించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “మీరు తప్పకుండా బ్రతకరు” అని ఉంది. ఇక్కడి హీబ్రూ పాఠం క్లిష్టమైనది; తరువాత వచ్చే ప్రకటనకు భిన్నంగా, “మీరు తప్పకుండా కోలుకుంటారు” అనే భావమే ఉద్దేశించబడిందని చాలామంది అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: ఎలీషా అతనితో ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యంలోని స్పష్టమైన కర్త ‘ఎలీషా’ను సహజమైన తెలుగు పదక్రమంలో ఉంచి, אֵלָיוను ‘అతనితో’గా అనువదించాం.
- source_word: לֵךְ אֱמָר
  choice: నువ్వు వెళ్లి అతనితో ... అని చెప్పు
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞలను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే సంయుక్త నిర్మాణాన్ని ఉపయోగించాం.
- source_word: לא חָיֹה תִחְיֶה
  choice: మీరు తప్పకుండా కోలుకుంటారు
  rationale: వ్యాధి సందర్భంలో חיהను ‘కోలుకోవడం’గా సందర్భానుగుణంగా వ్యక్తం చేశాం; infinitive absolute + imperfect ఇచ్చే నిశ్చయార్థాన్ని ‘తప్పకుండా’ నిలుపుతుంది. అయితే మసొరేటిక్ పాఠంలోని לא ప్రకారం వచ్చే కఠినమైన ప్రతికూల అర్థాన్ని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
- source_word: וְהִרְאַנִי יְהוָה
  choice: అయితే ... యెహోవా నాకు చూపించాడు
  rationale: ముందు చెప్పవలసిన సందేశానికి, ప్రవక్తకు వెల్లడైన వాస్తవానికి మధ్య ఉన్న వ్యత్యాసాన్ని וְ ఇక్కడ ‘అయితే’గా వ్యక్తం చేస్తుంది. దైవనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: כִּי מוֹת יָמוּת
  choice: అతడు తప్పకుండా చనిపోతాడని
  rationale: מות యొక్క infinitive absolute + imperfect నిర్మాణంలో ఉన్న బలమైన నిశ్చయాన్ని ‘తప్పకుండా’తో నిలిపి, indirect speech‌కు సహజమైన తెలుగు నిర్మాణాన్ని వాడాం.
theological_decisions:
- issue: לא חיה תחיה అనే క్లిష్టమైన పాఠం
  choice: ప్రధాన పాఠంలో ‘మీరు తప్పకుండా కోలుకుంటారు’ అని అనువదించి, మసొరేటిక్ పాఠంలోని ప్రతికూల అర్థాన్ని పాదటిప్పణిలో ఉంచడం
  alternative: ‘మీరు తప్పకుండా బ్రతకరు’ లేదా ‘మీరు తప్పకుండా కోలుకోరు’
  rationale: మసొరేటిక్ అక్షర-స్వర పాఠం לאను ప్రతికూల అవ్యయంగా చదివితే ‘మీరు తప్పకుండా బ్రతకరు’ అనే అర్థం వస్తుంది. అయితే వెంటనే వచ్చే ‘అయితే అతడు తప్పకుండా చనిపోతాడు’ అనే ప్రకటనతోనూ, వ్యాధి నుంచి కోలుకునే అవకాశాన్ని సూచించే కథా సందర్భంతోనూ అది క్లిష్టమైన సంబంధం కలిగిస్తుంది. అందువల్ల సందర్భంలో ఉద్దేశించినదిగా విస్తృతంగా గ్రహించే సానుకూల అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, నిజమైన పాఠభేద/వ్యాఖ్యాన సమస్యను పాదటిప్పణిలో దాచకుండా తెలిపాం.
- issue: వ్యాధి నుంచి కోలుకోవడం మరియు చివరికి మరణించడం మధ్య ఉద్రిక్తత
  choice: ‘కోలుకుంటారు’ మరియు ‘చనిపోతాడు’ రెండింటినీ స్పష్టంగా నిలుపడం
  alternative: మొదటి ప్రకటనను సాధారణంగా ‘బ్రతుకుతారు’ అని అనువదించడం
  rationale: కథనంలోని భావం వ్యాధి స్వయంగా ప్రాణాంతకం కాకపోవచ్చని, అయినప్పటికీ అతడు వేరే కారణంతో మరణిస్తాడని సూచించగలదు. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హజాయేలు రాజుతో చెప్పవలసిన ప్రత్యక్ష మాటలో గౌరవ ఏకవచనమైన ‘మీరు’ను, ఎలీషా హజాయేలుతో మాట్లాడే చోట సందర్భానుకూలమైన ‘నువ్వు’ను వాడాం. పాఠంలోని వ్యాఖ్యాన క్లిష్టతను పాదటిప్పణి ద్వారా పారదర్శకంగా నిలిపాం.
