translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని ఉపయోగించాం. ప్రాచీన జాతిపేరును ‘సిరియనులు’గా మార్చకుండా ‘అరామీయులు’గా, దేశనామాన్ని ‘అరాము’గా ఉంచాం. వ్యక్తిపేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా యోరాము, హజాయేలు, అహజ్యా, యెహోరాము, అహాబు రూపాల్లో ఇచ్చాం.
