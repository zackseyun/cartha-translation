  text: וַ/יָּשָׁב֩ יוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֨ר יַכֻּ֤/הוּ אֲרַמִּים֙ בָּֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/אֲחַזְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּֽי חֹלֶ֥ה הֽוּא־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: te
  text: అప్పుడు యోరాము రాజు, అరాము రాజైన హజాయేలుతో రామాలో యుద్ధం చేస్తున్నప్పుడు అరామీయులు తనకు కలిగించిన గాయాలనుండి కోలుకోవడానికి యెజ్రెయేలుకు తిరిగి వచ్చాడు.[a] యూదా రాజైన యెహోరాము కుమారుడు అహజ్యా, అహాబు కుమారుడు యోరాము అనారోగ్యంగా ఉన్నందున అతణ్ణి చూడడానికి[b] యెజ్రెయేలుకు దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వస్థత పొందడానికి.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, అతణ్ణి పరామర్శించడానికి. హీబ్రూ మూలంలో అక్షరార్థంగా “యోరామును చూడడానికి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చాడు
  rationale: שׁוב కథన సందర్భంలో యుద్ధస్థలం నుంచి యెజ్రెయేలుకు తిరిగి రావడాన్ని సూచిస్తుంది.
- source_word: לְהִתְרַפֵּא
  choice: కోలుకోవడానికి
  rationale: רפא హిత్పయేల్ రూపం గాయాలనుండి స్వస్థత పొందడం అనే భావాన్ని ఇక్కడ సహజంగా వ్యక్తం చేస్తుంది; స్వయంగా నయం చేసుకున్నాడనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: מִן הַמַּכִּים
  choice: గాయాలనుండి
  rationale: మూలపదం అక్షరార్థంగా దెబ్బలను సూచించినా, సైనిక-వైద్య సందర్భంలో వాటివల్ల కలిగిన గాయాలే ఉద్దేశం.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: అరామీయులు తనకు కలిగించిన
  rationale: అరామీయులు అతణ్ణి కొట్టడం వల్ల ఏర్పడిన గాయాలు అనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בָּרָמָה
  choice: రామోతులో
  rationale: ఈ యుద్ధస్థలం సందర్భానుసారం రామోతు-గిలాదు; తెలుగు బైబిలు భౌగోళిక నామపద్ధతిలో ‘రామోతు’ సహజం. మూలంలోని సంక్షిప్త స్థలనామాన్ని విస్తరించకుండా ఉంచాం.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: హజాయేలుతో ... యుద్ధం చేస్తున్నప్పుడు
  rationale: కాలసంబంధ పరిస్థితిని తెలిపే ב + infinitive construct ను సహజంగా వ్యక్తం చేస్తుంది; తెలుగులో ‘తో యుద్ధం చేయడం’ ప్రత్యర్థిత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: అహజ్యా ... దిగివెళ్లాడు
  rationale: ירד లోని దిశాసూచక భావాన్ని నిలుపుతూ, యూదా ప్రాంతం నుంచి యెజ్రెయేలుకు వెళ్లడాన్ని తెలుపుతుంది.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: యోరామును చూడడానికి
  rationale: మూలంలోని ‘చూడడానికి’ అనే అక్షరార్థాన్ని నిలుపుతుంది; సందర్భంలో ఇది అనారోగ్యంతో ఉన్నవాణ్ణి పరామర్శించడాన్ని సూచిస్తుంది.
- source_word: כִּי חֹלֶה הוּא
  choice: అనారోగ్యంగా ఉన్నందున
  rationale: חֹלֶה అతని ప్రస్తుత అనారోగ్య స్థితిని సూచిస్తుంది; కారణం గాయాలైనా ‘గాయపడి ఉన్నాడు’ అని పరిమితం చేయదు.
