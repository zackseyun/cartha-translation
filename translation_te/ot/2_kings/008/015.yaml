  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יִּקַּ֤ח הַ/מַּכְבֵּר֙ וַ/יִּטְבֹּ֣ל בַּ/מַּ֔יִם וַ/יִּפְרֹ֥שׂ עַל פָּנָ֖י/ו וַ/יָּמֹ֑ת וַ/יִּמְלֹ֥ךְ חֲזָהאֵ֖ל תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: te
  text: మరుసటి రోజు అతడు ఆ కప్పే బట్టను[a] తీసుకొని, నీటిలో ముంచి, అతని ముఖం మీద పరచాడు. అతడు చనిపోయాడు.[b] అప్పుడు హజాయేలు అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పడకపై కప్పే వస్త్రం,” “దుప్పటి,” లేక “నేసిన లేదా వలలాంటి వస్త్రం.” హీబ్రూ పదం అరుదైనది కాబట్టి ఇది ఖచ్చితంగా ఏ రకమైన బట్టో తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ చర్యలను ఎవరు చేశారో హీబ్రూ పాఠ్యం పేరుపెట్టి చెప్పదు. సందర్భాన్ని బట్టి చాలామంది ఆ వ్యక్తి హజాయేలు అని భావిస్తారు; అయితే చివరి ఉపవాక్యంలో హజాయేలు పేరు వచ్చే వరకు పాఠ్యంలో కేవలం “అతడు” అనే భావమే ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: మునుపటి సంఘటనల తరువాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הַמַּכְבֵּר
  choice: కప్పే వస్త్రం
  rationale: ఈ అరుదైన హీబ్రూ పదం ఏ రకమైన వస్త్రాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు. అందువల్ల దాని ఉపయోగాన్ని తెలిపే విస్తృత పదబంధాన్ని ఎంచుకొని, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: నీళ్లలో ముంచి
  rationale: ముంచడం లేదా ద్రవంలో ముంచి తీయడం అనే మూల క్రియార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: అతని ముఖం మీద పరచాడు
  rationale: వస్త్రాన్ని విప్పి ముఖంపై ఉంచిన భౌతిక చర్యను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: హీబ్రూ వావ్-క్రమకథనం సాధారణంగా తరువాతి సంఘటనను తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని ఉద్దేశం లేదా కారణార్థాన్ని చేర్చకుండా అనువదించాం.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: అప్పుడు హజాయేలు అతని స్థానంలో రాజయ్యాడు
  rationale: రాజ్యాధికారాన్ని చేపట్టి ముందున్న వ్యక్తి స్థానాన్ని పొందాడనే వారసత్వ సూత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘తీసుకున్నాడు,’ ‘ముంచాడు,’ ‘పరచాడు’ అనే క్రియల కర్త ఎవరు?
  choice: ప్రధాన పాఠ్యంలో పేరు చేర్చకుండా ‘అతడు’ అనే సర్వనామాన్ని ఉంచడం
  alternative: కర్తను హజాయేలు అని స్పష్టంగా పేర్కొనడం; లేదా పేరు తెలియని పరిచారకుడిగా భావించడం
  rationale: హీబ్రూ క్రియారూపాల్లో కర్త అంతర్లీనంగా ఉన్నా ఈ వాక్యంలో అతని పేరు చెప్పబడలేదు; చివరి ఉపవాక్యంలోనే హజాయేలు పేరు వస్తుంది. సందర్భాన్ని బట్టి చాలామంది కర్త హజాయేలే అని గ్రహించినా, మూలపాఠంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. అరుదైన వస్త్రపదానికి అతిగా నిర్దిష్టమైన ఆధునిక సమానార్థకం ఇవ్వలేదు. కర్తకు సంబంధించిన మూలపాఠ అస్పష్టతను సర్వనామాల ద్వారా కాపాడాం; ‘చనిపోయాడు’ ముందు మూలంలో స్పష్టంగా లేని కారణార్థాన్ని చేర్చలేదు.
