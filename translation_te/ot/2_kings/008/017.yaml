  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన రాజవంశ చరిత్ర శైలి. మూలంలోని రెండు సమాంతర సమాచార భాగాలను రెండు వాక్యాలుగా ఇచ్చి పఠన సౌలభ్యాన్ని పెంచాం.
