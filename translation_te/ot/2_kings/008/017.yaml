translation:
  language: te
  text: అతడు రాజైనప్పుడు అతనికి ముప్పై రెండు సంవత్సరాలు. అతడు యెరూషలేములో ఎనిమిది సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: ముప్పై రెండు సంవత్సరాల వయసుగలవాడు
  rationale: వయస్సును తెలిపే బֶּן + సంఖ్య + שָׁנָה అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הָיָה בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: ఈ పదబంధం అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וּשְׁמֹנֶה שנה
  choice: ఎనిమిది సంవత్సరాలు
  rationale: పరిపాలనా కాలవ్యవధిని మూలంలోని సంఖ్య ప్రకారం నేరుగా తెలుపుతుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలన సాగించడాన్ని సూచించే క్రియార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పరిపాలన జరిగిన స్థలాన్ని సూచించే హీబ్రూ స్థానార్థక ఉపసర్గను తెలుగులో స్థాన విభక్తితో వ్యక్తపరుస్తుంది.
