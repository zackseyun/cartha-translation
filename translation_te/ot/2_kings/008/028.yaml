base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: te
  text: అతడు అహాబు కుమారుడైన యోరాముతో కలిసి రామోతు-గిలాదులో అరాము[b] రాజైన హజాయేలుకు వ్యతిరేకంగా యుద్ధానికి వెళ్లాడు. అరామీయులు యోరామును గాయపరిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యోరామును కొట్టారు.’ హెబ్రీ క్రియకు సాధారణంగా ‘కొట్టు’ లేదా ‘దెబ్బతీయు’ అనే అర్థం కూడా ఉంది. అయితే యుద్ధ సందర్భం, సమాంతర వృత్తాంతం యోరాముకు గాయమైనట్లు సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: సంప్రదాయంగా ‘సిరియా’ అనీ, ‘సిరియనులు’ అనీ అనువదిస్తారు; హెబ్రీలో ‘అరాము,’ ‘అరామీయులు’ అని ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అతడు ... వెళ్లాడు
  rationale: הלך క్రియ యొక్క సాధారణ కథనార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కర్త అయిన అహజ్యా ముందరి సందర్భం ద్వారా తెలుస్తాడు కాబట్టి మూలంలోని సర్వనామ స్వభావాన్ని నిలుపుతూ ‘అతడు’ అని ఇచ్చాం.
- source_word: אֶת יוֹרָם
  choice: యోరాముతో కలిసి
  rationale: הלך తరువాత אֵת సహవాసాన్ని సూచిస్తుంది. అందువల్ల యోరామును కర్మగా కాక, అతనితో కలిసి వెళ్లినట్లు అనువదించాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: సైనిక సందర్భంలో ‘యుద్ధానికి వెళ్లాడు’ అనేది మూలార్థాన్ని కాపాడే సహజమైన తెలుగు ప్రయోగం.
- source_word: עִם חֲזָהאֵל
  choice: హజాయేలుకు వ్యతిరేకంగా
  rationale: עִם సాధారణంగా ‘తో’ అని అర్థమైనా, ఇక్కడ యుద్ధ సందర్భంలో ప్రత్యర్థిని సూచిస్తుంది; తెలుగులో అపార్థం రాకుండా ‘వ్యతిరేకంగా’ అని స్పష్టం చేశాం.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజైన
  rationale: హెబ్రీ ethnogeographic పేరును సంప్రదాయ ‘సిరియా’గా మార్చకుండా ‘అరాము’గా లిప్యంతరీకరించాం.
- source_word: בְּרָמֹת גִּלְעָד
  choice: రామోతు-గిలాదులో
  rationale: యుద్ధం జరిగిన స్థలాన్ని సూచించే בְּ ను తెలుగులో సహజమైన స్థానవిభక్తితో ఇచ్చాం.
- source_word: וַיַּכּוּ
  choice: గాయపరిచారు
  rationale: נכה కు ‘కొట్టారు/దెబ్బతీశారు’ అనే విస్తృత అర్థం ఉన్నా, యుద్ధ సందర్భం మరియు సమాంతర వృత్తాంతం యోరాము చనిపోకుండా గాయపడినట్లు సూచిస్తున్నందున ‘గాయపరిచారు’ అని ఇచ్చాం; విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲרַמִּים
  choice: అరామీయులు
  rationale: హెబ్రీ జాతిబహువచనాన్ని ‘అరాము’ పేరుతో సుసంగతంగా, ఆధునిక తెలుగులో సహజంగా ఇచ్చాం.
- source_word: יוֹרָם
  choice: యోరాము
  rationale: ఈ వచనంలోని హెబ్రీ రూపం יוֹרָם ను అనుసరించి ‘యోరాము’ అని లిప్యంతరీకరించాం.
