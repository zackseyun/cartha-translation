translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. వ్యక్తి, ప్రదేశ నామాలను హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. మూలంలోని సంక్షిప్త సైనిక వాక్యనిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
