id: 2KI.8.8
reference: 2 Kings 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל חֲזָהאֵ֗ל קַ֤ח בְּ/יָֽדְ/ךָ֙ מִנְחָ֔ה וְ/לֵ֕ךְ לִ/קְרַ֖את אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/דָרַשְׁתָּ֨ אֶת יְהוָ֤ה מֵֽ/אוֹת/וֹ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: te
  text: రాజు హజాయేలుతో, “నీ చేతిలో ఒక కానుక తీసుకొని, దేవుని మనిషిని కలవడానికి వెళ్లు. ‘ఈ జబ్బు నుంచి నేను కోలుకుంటానా?[a]’ అని అతని ద్వారా యాహ్వేను అడుగు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఈ జబ్బు నుంచి బతుకుతానా?” హెబ్రీ క్రియకు అక్షరార్థం “బతుకు”; ఇక్కడ అది జబ్బు నుంచి ప్రాణాలతో బయటపడడం లేదా కోలుకోవడం అనే భావంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: కానుక
  rationale: ఇక్కడ ఇది ఆరాధన సంబంధమైన అర్పణ కాదు; ప్రవక్తను సంప్రదించేటప్పుడు వెంట తీసుకెళ్లే బహుమతి. ‘కానుక’ ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לִקְרַאת
  choice: కలవడానికి
  rationale: ‘వెళ్లు’ అనే క్రియ తరువాత ఉద్దేశాన్ని తెలిపే రూపం. ఆధునిక తెలుగులో ‘కలవడానికి వెళ్లు’ సహజంగా ఉంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది ప్రవక్తకు వాడే స్థిరమైన హెబ్రీ బిరుదు. కేవలం ‘ప్రవక్త’ అని భావానువాదం చేయకుండా మూలంలోని బిరుదును నిలుపుతుంది.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: అతని ద్వారా యాహ్వేను అడుగు
  rationale: דרשׁ ఇక్కడ దేవుని సమాధానం కోరడాన్ని సూచిస్తుంది; מֵאֹתוֹ ఆ సమాధానం దేవుని మనిషి ద్వారా కోరబడుతుందని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: הַאֶחְיֶה
  choice: నేను కోలుకుంటానా
  rationale: క్రియ అక్షరార్థంగా ‘నేను బతుకుతానా’ అయినప్పటికీ, జబ్బు సందర్భంలో దాని సహజ భావం కోలుకోవడం లేదా ప్రాణాలతో బయటపడడం. అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מֵחֳלִי זֶה
  choice: ఈ జబ్బు నుంచి
  rationale: రాజుకు ప్రస్తుతం ఉన్న వ్యాధిని సూచించే సరళమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּיָדְךָ
  choice: నీ చేతిలో
  rationale: మూలంలోని శరీరావయవ ప్రయోగాన్ని తెలుగులో సహజంగానే నిలుపవచ్చు; కానుకను స్వయంగా తీసుకెళ్లడాన్ని ఇది తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణను తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, ‘దేవుని మనిషి’ అనే ముఖ్యమైన మూలబిరుదును మరియు ప్రవక్త ద్వారా దేవుని సమాధానం కోరే భావాన్ని నిలిపాం.
