  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּ֨קָם֙ הָֽ/אִשָּׁ֔ה וַ/תַּ֕עַשׂ כִּ/דְבַ֖ר אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וּ/בֵיתָ֔/הּ וַ/תָּ֥גָר בְּ/אֶֽרֶץ פְּלִשְׁתִּ֖ים שֶׁ֥בַע שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీ లేచి, దైవజనుడు చెప్పిన మాట ప్రకారం చేసింది. ఆమె తన ఇంటివారితో కలిసి వెళ్లి, ఫిలిష్తీయుల దేశంలో ఏడు సంవత్సరాలు పరదేశిగా నివసించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయుల దేశంలో ఏడు సంవత్సరాలు తాత్కాలిక నివాసిగా ఉండింది.”
    reason: גור అనే క్రియలో పరదేశ నివాసం మరియు తాత్కాలికంగా ఉండడం అనే రెండూ భావఛాయలు ఉన్నాయి; ప్రత్యామ్నాయ అనువాదం రెండవ భావఛాయను స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: וַתָּקָם
  choice: లేచి
  rationale: קום క్రియ యొక్క కథన క్రమాన్ని, దైవజనుని మాటకు ఆమె వెంటనే స్పందించిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: చెప్పిన మాట ప్రకారం చేసింది
  rationale: ఒకరు పలికిన ఆదేశానికి అనుగుణంగా ప్రవర్తించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుడు
  rationale: దేవునిచేత నియమించబడిన ప్రవక్తసదృశ వ్యక్తికి వాడే స్థిరమైన బైబిలు బిరుదును సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: ఆమె తన ఇంటివారితో కలిసి వెళ్లి
  rationale: בַּיִת ఇక్కడ భవనాన్ని కాక ఆమె కుటుంబం లేదా గృహసభ్యులను సూచిస్తుంది; హీబ్రూలోని ‘ఆమె—ఆమె ఇంటివారు’ అనే ఉద్ఘాటనను తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וַתָּגָר
  choice: పరదేశిగా నివసించింది
  rationale: גור కేవలం ఉండడాన్ని కాక, స్వదేశం కాని చోట స్థిర హక్కులు లేని పరదేశ నివాసాన్ని సూచిస్తుంది; ఈ సామాజిక భావాన్ని కాపాడుతుంది.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశంలో
  rationale: హీబ్రూ జాతి-భౌగోళిక నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు
  rationale: నివాస కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
