  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: te
  text: అతడు తన చూపును స్థిరంగా నిలిపి, సిగ్గుపడేంతవరకు అలాగే ఉంచాడు[a]. దేవుని మనిషి ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హజాయేలు సిగ్గుపడేంతవరకు.” హీబ్రూలో సిగ్గుపడిన వ్యక్తి ఎవరో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: తన చూపును స్థిరంగా ఉంచి
  rationale: అక్షరార్థంగా ‘తన ముఖాన్ని నిలిపాడు’ అనే భావం ఉన్నా, సందర్భంలో ఇది ముఖాన్ని ఎదుటివానిపై నిలిపి చూడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చూపును స్థిరంగా ఉంచి’ సహజంగా ఉండి మూలంలోని స్థిరత్వ భావాన్ని కాపాడుతుంది.
- source_word: וַיָּשֶׂם
  choice: తదేకంగా చూశాడు
  rationale: ‘పెట్టాడు/నిలిపాడు’ అనే సాధారణ అర్థమున్న ఈ క్రియ, ముందున్న ‘ముఖాన్ని స్థిరంగా ఉంచడం’తో కలిసి చూపును అలాగే నిలిపి చూడడాన్ని సూచిస్తుంది. ‘తదేకంగా చూశాడు’ ఆ సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד־בֹּשׁ
  choice: సిగ్గుపడేంతవరకు
  rationale: బושׁ సిగ్గు లేదా ఇబ్బందికి గురికావడాన్ని సూచిస్తుంది. తెలుగులో కర్తను పేర్కొనకుండా క్రియారూపాన్ని వాడటం వల్ల, ఎవరు సిగ్గుపడ్డారనే హీబ్రూ అస్పష్టత నిలిచి ఉంటుంది.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: בכה అంటే ఏడవడం. గంభీరమైన కథన శైలికి ‘ఏడ్చాడు’ సహజమైన, సూటి తెలుగు పదం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్త ఎలీషాకు వాడిన మూలభాషా బిరుదును ‘ప్రవక్త’ అని వివరణాత్మకంగా మార్చకుండా యథాశక్తిగా నిలుపుతుంది.
theological_decisions:
- issue: עַד־בֹּשׁ లో సిగ్గుపడిన వ్యక్తి ఎవరు అనే అస్పష్టత
  choice: ‘సిగ్గుపడేంతవరకు’ అని కర్తను పేర్కొనకుండా అనువదించడం
  alternative: ‘హజాయేలు సిగ్గుపడేంతవరకు’ లేదా ‘ఎలీషా సిగ్గుపడేంతవరకు’
  rationale: హీబ్రూ వాక్యం సిగ్గుపడిన వ్యక్తిని సందేహాతీతంగా నిర్దిష్టం చేయదు. తెలుగులో కర్తలేని క్రియారూపం ఈ కథన ఉద్రిక్తతను సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తదేకంగా’ గంభీరతను నిలుపుతూ దీర్ఘంగా, స్థిరంగా చూడడాన్ని తెలియజేస్తుంది.
