base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: te
  text: హజాయేలు, “అయితే నీ సేవకుడైన ఈ కుక్క ఇంత గొప్ప కార్యం చేసేంతటివాడా?” అన్నాడు. ఎలీషా, “నీవు అరాము మీద రాజు అవుతావని[a] యాహ్వే నాకు చూపించాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరాము రాజు అవుతావని”; హెబ్రీలో అక్షరార్థంగా, “అరాము మీద రాజు అవుతావని.”
    reason: హెబ్రీ మֶלֶךְ עַל אֲרָם యొక్క సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని ఇస్తూ, עַל (‘మీద/పై’) అనే నిర్మాణాన్ని అక్షరార్థంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: כִּי מָה
  choice: అయితే … ఎంతటివాడని
  rationale: సందర్భంలోని హజాయేలు ఆశ్చర్యంతో వ్యక్తం చేసిన అభ్యంతరాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో తెలియజేస్తుంది.
- source_word: עַבְדְּךָ הַכֶּלֶב
  choice: నీ సేవకుడైన ఈ కుక్క
  rationale: ‘సేవకుడు’ అనే వినయపూర్వక స్వీయసంబోధనతో పాటు ‘కుక్క’ అనే అవమానకరమైన లేదా తనను తాను తగ్గించుకునే రూపకాన్ని నిలుపుతుంది.
- source_word: כִּי יַעֲשֶׂה
  choice: చేస్తాడు
  rationale: హెబ్రీలోని మూడవ పురుష స్వీయప్రస్తావనను నిలుపుతూ, అటువంటి కార్యం చేయగల తన స్థితి లేదా సామర్థ్యంపై హజాయేలు వ్యక్తం చేసిన అవిశ్వాసాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: ఇంత గొప్ప కార్యం
  rationale: ఇక్కడ ‘గొప్ప’ అనేది నైతికంగా మంచిదని కాక, పరిమాణం లేదా తీవ్రతలో అసాధారణమైనదని సూచించేలా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: הִרְאַנִי
  choice: నాకు చూపించాడు
  rationale: దైవిక బయలుపాటును సూచించే హిఫీల్ రూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, దాని సర్వసాధారణ పండితుల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: అరాముమీద రాజవుతావని
  rationale: עַל అనే విభక్తి సూచించే ‘మీద/పై’ భావాన్ని నిలుపుతుంది; ‘అరాము’ అనే హెబ్రీ భౌగోళిక నామాన్నే ఉపయోగిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది; ‘యాహ్వే’ రూపం హెబ్రీ నామానికి దగ్గరైన సర్వసాధారణ పండితుల ఉచ్చారణ.
- issue: హజాయేలు మాటల్లోని ‘గొప్ప కార్యం’ యొక్క నైతిక భావం
  choice: గొప్ప కార్యం
  alternative: భయంకరమైన కార్యం
  rationale: ముందు వచనంలోని క్రూరకార్యాల సందర్భం ప్రతికూల భావాన్ని సూచించినా, ఈ వచనంలోని גָּדוֹל స్వయంగా ‘గొప్ప/మహత్తరమైన’ అని మాత్రమే చెబుతుంది. అందువల్ల మూలంలోని ఉద్రిక్తతను వివరించి పరిష్కరించకుండా అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. హజాయేలు తనను మూడవ పురుషంలో ‘ఈ కుక్క’గా పేర్కొనే మూలభాషా తీవ్రతను నిలిపాం; అది నిజమైన వినయమా, అవిశ్వాసమా, లేక సామర్థ్యంపై ప్రశ్నా అనే అనిశ్చితిని పరిష్కరించలేదు.
