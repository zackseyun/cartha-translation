  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: te
  text: అతని కాలంలో ఎదోమీయులు యూదా ఆధిపత్యం నుండి తిరుగుబాటు చేసి, తమపై ఒక రాజును నియమించుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యూదా చేతికింద నుండి తిరుగుబాటు చేశారు.” ఇక్కడ “చేతికింద” అనేది అధికారం లేదా నియంత్రణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: అతని కాలంలో
  rationale: రాజు పరిపాలించిన కాలాన్ని సూచించే హీబ్రూ కాలవాచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פָּשַׁע
  choice: తిరుగుబాటు చేసి
  rationale: ఈ రాజకీయ సందర్భంలో ఇది నైతిక అతిక్రమాన్ని కాక, యూదా ఆధిపత్యం నుండి ఎదోము తిరుగుబాటు చేయడాన్ని సూచిస్తుంది.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: స్థలానికి, ప్రజలకు వాడే ప్రామాణిక తెలుగు రూపం.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: యూదా అధికారం కిందనుండి
  rationale: అక్షరార్థంగా ‘యూదా చేతి కిందనుండి’ అనే హీబ్రూ నుడికారం రాజకీయ అధికారం లేదా నియంత్రణను సూచిస్తుంది; తెలుగులో అర్థవంతంగా ఉండేందుకు ‘అధికారం’ అని వ్యక్తం చేయబడింది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: రాజ్యానికి సంబంధించిన ప్రామాణిక తెలుగు నామరూపం.
- source_word: וַיַּמְלִכוּ
  choice: నియమించుకుంది
  rationale: מלך క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ఒకరిని రాజుగా చేయడం లేదా పరిపాలింపజేయడం అనే భావాన్ని ఇస్తుంది. ఏకవచన సమూహనామమైన ‘ఎదోము’కు అనుగుణంగా తెలుగు క్రియ ఏకవచనంలో ఉంది.
- source_word: עֲלֵיהֶם
  choice: తమ మీద
  rationale: సర్వనామం ఎదోమీయులనే తిరిగి సూచిస్తూ, వారు తమకు పాలకుని ఏర్పాటు చేసుకున్నారని స్పష్టం చేస్తుంది.
- source_word: מֶלֶךְ
  choice: ఒక రాజును
  rationale: నిర్దిష్టత లేని ఏకవచన నామాన్ని సహజంగా తెలియజేస్తూ, పేరు చెప్పని స్వతంత్ర రాజును వారు ఏర్పాటు చేసుకున్నారని సూచిస్తుంది.
