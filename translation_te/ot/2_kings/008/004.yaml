source:
  edition: WLC
  text: וְ/הַ/מֶּ֗לֶךְ מְדַבֵּר֙ אֶל גֵּ֣חֲזִ֔י נַ֥עַר אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹ֑ר סַפְּרָ/ה נָּ֣א לִ֔/י אֵ֥ת כָּל הַ/גְּדֹל֖וֹת אֲשֶׁר עָשָׂ֥ה אֱלִישָֽׁע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: te
  text: రాజు దేవుని మనిషి సేవకుడైన గేహజీతో[a] మాట్లాడుతూ, “ఎలీషా చేసిన గొప్ప కార్యాలన్నిటినీ దయచేసి నాకు చెప్పు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని మనిషి పరిచారకుడైన గేహజీతో’ లేదా ‘దేవుని మనిషి యువకుడైన గేహజీతో’ అని కూడా అనువదించవచ్చు; హీబ్రూ נַעַר అనే పదం సందర్భానుసారం సేవకుడు, పరిచారకుడు లేదా యువకుడు అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: మాట్లాడుతూ
  rationale: హీబ్రూ కృదంతం కథనంలోని నేపథ్యంగా కొనసాగుతున్న చర్యను సూచిస్తుంది; తెలుగు సంయుక్త వాక్యంలో ‘మాట్లాడుతూ ... అన్నాడు’ ఆ దృశ్యాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: גֵּחֲזִי
  choice: గేహజీ
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: נַעַר
  choice: సేవకుడు
  rationale: ఈ సందర్భంలో ఈ పదం వయస్సుకన్నా దేవుని మనిషితో గేహజీకి ఉన్న సేవాపరమైన సంబంధాన్ని సూచిస్తుంది; అయినా ‘పరిచారకుడు’ లేదా ‘యువకుడు’ అనే భావాలకు అవకాశం ఉండటాన్ని పాదసూచికలో ఉంచాం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తను సూచించే స్థిరమైన హీబ్రూ బిరుదును ‘దేవుని ప్రవక్త’ అని వివరణాత్మకంగా మార్చకుండా మూలరూపానికి దగ్గరగా నిలిపాం.
- source_word: סַפְּרָה נָּא לִי
  choice: దయచేసి నాకు వివరంగా చెప్పు
  rationale: ספר యొక్క ‘వివరించడం/వృత్తాంతం చెప్పడం’ అనే భావాన్నీ, נָא తెలిపే వినయపూర్వక అభ్యర్థననూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל הַגְּדֹלוֹת
  choice: గొప్ప కార్యాలన్నిటినీ
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణం గొప్పగా చేసిన సంగతులు లేదా కార్యాలను సూచిస్తుంది; సందర్భంలో ‘కార్యాలు’ సహజంగా ఉంది, వాటి స్వభావాన్ని ‘అద్భుతాలు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: ఎలీషా చేసిన కార్యాలను సంబంధవాచక నిర్మాణంలో సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: וְהַמֶּלֶךְ
  choice: రాజు
  rationale: ఆరంభ వావ్ కథన అనుసంధానాన్ని అందిస్తుంది; తెలుగులో సందర్భం లేకుండానే అదనపు ‘ఇప్పుడు’ను చేర్చకుండా సహజంగా ‘రాజు’తో ప్రారంభించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిని నిలుపుతూ అనువదించాం. ‘దేవుని మనిషి’ అనే మూల బిరుదును అలాగే ఉంచి, సంభాషణలో ‘దయచేసి’ ద్వారా נָא యొక్క మర్యాదను వ్యక్తం చేశాం.
