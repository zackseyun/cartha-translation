base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: te
  text: ఏడు సంవత్సరాలు ముగిసినప్పుడు, ఆ స్త్రీ ఫిలిష్తీయుల దేశం నుండి తిరిగి వచ్చింది. తన ఇల్లు, తన పొలం విషయమై రాజుకు మొరపెట్టుకోవడానికి[a] ఆమె బయలుదేరింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుకు విన్నవించుకోవడానికి” లేదా “రాజును వేడుకోవడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: ఏడు సంవత్సరాలు ముగిసినప్పుడు
  rationale: కాలవ్యవధి ముగింపును సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַתָּשָׁב
  choice: తిరిగి వచ్చింది
  rationale: మునుపు నివసించిన ఫిలిష్తీయుల దేశం నుండి ఆమె తిరిగి రావడాన్ని కథన సందర్భానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశం
  rationale: హీబ్రూలోని ‘ఫిలిష్తీయుల దేశం’ అనే నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: וַתֵּצֵא
  choice: ఆమె బయలుదేరింది
  rationale: యָצָא అనే క్రియలోని కదలిక భావాన్ని నిలుపుతూ తెలుగులో సహజమైన కథన శైలిని ఇస్తుంది.
- source_word: לִצְעֹק אֶל הַמֶּלֶךְ
  choice: రాజుకు మొరపెట్టుకోవడానికి
  rationale: צָעַק యొక్క ‘మొరపెట్టు/కేకవేయు’ భావాన్నీ, ఇక్కడ ఆస్తి తిరిగి పొందేందుకు రాజును ఆశ్రయించే విజ్ఞాపన సందర్భాన్నీ కలిపి వ్యక్తపరుస్తుంది.
- source_word: בֵּיתָהּ
  choice: తన ఇల్లు
  rationale: ‘పొలం’తో జతగా ఆస్తి సందర్భంలో ఉన్నందున בַּיִת యొక్క నిర్దిష్టమైన ‘ఇల్లు’ అనే అర్థం సరిపోతుంది.
- source_word: שָׂדָהּ
  choice: తన పొలం
  rationale: שָׂדֶה సూచించే వ్యవసాయ భూమి అనే నిర్దిష్ట భావాన్ని ‘పొలం’ సహజంగా అందిస్తుంది.
