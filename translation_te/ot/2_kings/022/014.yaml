    issue: హర్హసుతో వంశసంబంధాన్ని ‘మనుమడు’గా అనువదించడం
    rationale: హీబ్రూ పాఠంలో షల్లూమును ‘తిక్వా కుమారుడు, హర్హసు కుమారుడు’ అని వరుసగా పేర్కొంటుంది. ‘మనుమడు’ అనేది వంశావళి క్రమాన్ని వివరిస్తూ జోడించిన అర్థం; మూలంలోని పునరుక్తిని మార్చుతుంది.
