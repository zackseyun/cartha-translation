id: 2KI.22.14
reference: 2 Kings 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: te
  text: అప్పుడు యాజకుడైన హిల్కీయా, అహీకాము, అక్బోరు, షాఫాను, అసాయా, ప్రవక్త అయిన హుల్దా వద్దకు వెళ్లారు. ఆమె తిక్వా కుమారుడూ హర్హసు కుమారుడూ అయిన, వస్త్రాల సంరక్షకుడైన షల్లూము భార్య[a]. ఆమె యెరూషలేములోని రెండవ పట్టణ విభాగంలో[b] నివసించేది. వారు ఆమెతో మాట్లాడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వస్త్రాలను కాపాడేవాడు.”
    reason: lexical_alternative
  - marker: b
    text: “రెండవ ప్రాంతంలో” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం బహుశా యెరూషలేములోని ఒక ప్రత్యేక విభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు ... వెళ్లారు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజమైన కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: మూలంలో ‘ప్రధాన యాజకుడు’ అని కాక కేవలం ‘యాజకుడు’ అని ఉంది; అందువల్ల సందర్భం నుంచి ఉన్నత బిరుదును చేర్చలేదు.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: ప్రవక్త అయిన హుల్దా
  rationale: హీబ్రూ పదం స్త్రీలింగంలో ఉంది. తెలుగులో స్త్రీ అని పేరూ వాక్యనిర్మాణమూ స్పష్టం చేస్తున్నందున, సాధారణంగా అర్థమయ్యే ‘ప్రవక్త’ అనే పదాన్ని వాడాం.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: ఆమె షల్లూము భార్య
  rationale: వైవాహిక సంబంధాన్ని సూటిగా, సహజమైన తెలుగు వాక్యంగా తెలిపింది.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: షల్లూము తిక్వా కుమారుడు, హర్హసు మనుమడు
  rationale: హీబ్రూ వంశావళి గొలుసును తెలుగులో స్పష్టంగా తెలిపింది; రెండవ ‘కుమారుడు’ వంశస్థుడనే విస్తృత అర్థంలో ఉన్నందున ‘మనుమడు’ సహజంగా సరిపోతుంది.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: వస్త్రాల సంరక్షకుడు
  rationale: అక్షరార్థాన్ని నిలుపుతూ ఇది ఒక అధికారిక బాధ్యత అని సహజంగా తెలియజేస్తుంది; ‘రాజవస్త్రాలు’ అని మూలంలో లేని వివరాన్ని చేర్చలేదు.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: ఆమె ... నివసించేది
  rationale: ఇక్కడ יָשַׁב నివాసాన్ని సూచిస్తుంది; ‘నివసించేది’ ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: בַּמִּשְׁנֶה
  choice: రెండవ పట్టణ విభాగంలో
  rationale: ఇది యెరూషలేములోని ఒక ప్రత్యేక ప్రాంతాన్ని సూచించే అవకాశం ఉంది. అర్థాన్ని అతిగా నిర్ధారించకుండా చదువరికి స్పష్టంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: వారు ఆమెతో మాట్లాడారు
  rationale: ఆమెను నేరుగా ఉద్దేశించి మాట్లాడారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సంభాషణ విషయాన్ని మూలం చెప్పనందున చేర్చలేదు.
theological_decisions:
- issue: హిల్కీయా బిరుదును ‘ప్రధాన యాజకుడు’గా విస్తరించాలా?
  choice: యాజకుడు
  alternative: ప్రధాన యాజకుడు
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం కేవలం ‘యాజకుడు’ అని చెబుతుంది. ఇతర సందర్భాల ఆధారంగా బిరుదును పెంచకుండా మూలంలోని పరిమితిని నిలిపాం.
- issue: హుల్దా ప్రవక్త హోదాలో స్త్రీలింగాన్ని ఎలా తెలియజేయాలి?
  choice: ప్రవక్త అయిన హుల్దా
  alternative: ప్రవక్త్రి హుల్దా
  rationale: హీబ్రూ స్త్రీలింగ సూచనను హుల్దా అనే పేరు, ‘ఆమె’ అనే సర్వనామం స్పష్టంగా నిలుపుతున్నాయి. ఆధునిక సాధారణ పాఠకులకు సహజంగా ఉండేందుకు అరుదైన ‘ప్రవక్త్రి’ కంటే ‘ప్రవక్త అయిన హుల్దా’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. వ్యక్తుల పేర్లను తెలుగు బైబిలు సంప్రదాయానికి దగ్గరగా లిప్యంతరీకరించాం. మూలంలో లేని ‘ప్రధాన’, ‘రాజ’ వంటి వివరాలను చేర్చలేదు; స్థలనామానికి సంబంధించిన అనిశ్చితిని పాదసూచికలో నిలిపాం.
