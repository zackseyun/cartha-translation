revisions:
- from: అప్పుడు యాజకుడైన హిల్కీయా, అహీకాము, అక్బోరు, షాఫాను, అసాయా ప్రవక్త అయిన హుల్దా దగ్గరికి వెళ్లారు. ఆమె షల్లూము భార్య; షల్లూము తిక్వా కుమారుడు, హర్హసు మనుమడు, వస్త్రాల సంరక్షకుడు[a]. ఆమె యెరూషలేములోని రెండవ పట్టణ విభాగంలో[b] నివసించేది. వారు ఆమెతో మాట్లాడారు.
  to: అప్పుడు యాజకుడైన హిల్కీయా, అహీకాము, అక్బోరు, షాఫాను, అసాయా, ప్రవక్త అయిన హుల్దా వద్దకు వెళ్లారు. ఆమె తిక్వా కుమారుడూ హర్హసు కుమారుడూ అయిన, వస్త్రాల సంరక్షకుడైన షల్లూము భార్య[a]. ఆమె యెరూషలేములోని రెండవ పట్టణ విభాగంలో[b] నివసించేది. వారు ఆమెతో మాట్లాడారు.
  rationale: హర్హసుతో ఉన్న సంబంధాన్ని మూల హీబ్రూ పాఠానికి అనుగుణంగా ‘కుమారుడు’గా సవరించాం; ఏ నిర్దిష్ట తరాన్ని ఊహించలేదు. హుల్దా ప్రవక్త అని స్పష్టంగా కనిపించేలా పదక్రమాన్ని సవరించాం. స్థలం, పదవి, మరియు సంభాషణకు సంబంధించిన అర్థం అలాగే నిలిపాం; పాదసూచిక గుర్తులను వాటి సంబంధిత పదాల వద్ద ఉంచాం.
