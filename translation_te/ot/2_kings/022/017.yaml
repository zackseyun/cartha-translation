id: 2KI.22.17
reference: 2 Kings 22:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: te
  text: వారు నన్ను విడిచిపెట్టి, ఇతర దేవుళ్లకు ధూపార్పణలు చేసి, తమ చేతుల పనులన్నిటి ద్వారా నాకు కోపం పుట్టించడానికి అలా చేసినందున, ఈ స్థలంపై నా ఉగ్రత రగిలింది; అది ఆరిపోదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: అందువల్ల
  rationale: ఈ పదబంధం తీర్పుకు కారణాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ముందుగా కారణాన్ని తెలిపి, తరువాత ‘అందువల్ల’తో ఫలితాన్ని కలపడం సహజంగా ఉంది.
- source_word: עֲזָבוּנִי
  choice: వారు నన్ను విడిచిపెట్టి
  rationale: עזב అంటే విడిచిపెట్టు లేదా పరిత్యజించు. ‘విడిచిపెట్టి’ అనేది సంబంధపరమైన తీవ్రతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיְקַטְּרוּ
  choice: ధూపార్పణలు చేశారు
  rationale: పియేల్ రూపంలోని קטר సాధారణంగా దేవతారాధనలో ధూపం లేదా దహనార్పణ చేయడాన్ని సూచిస్తుంది. సందర్భంలో ‘ధూపార్పణలు చేశారు’ స్పష్టమైన, సహజమైన ఎంపిక; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లకు
  rationale: యెహోవా కాక ఇతర దేవతలను నేరుగా సూచించే పదబంధం.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: నాకు కోపం పుట్టించడానికే
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని, הכעיס కోపానికి పురికొల్పడాన్ని సూచిస్తాయి. ‘-డానికే’ ఆ ఉద్దేశపూర్వక తీవ్రతను నిలుపుతుంది.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: తమ చేతులతో చేసిన వాటన్నిటి ద్వారా
  rationale: ‘వారి చేతుల పని’ అనే హెబ్రీయ నుడికారపు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వారి విగ్రహారాధన సంబంధమైన కృత్యాలు లేదా వస్తువుల పరిధిని అనవసరంగా కుదించదు.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: నా ఉగ్రత రగులుకుంది
  rationale: יצת అగ్ని రగలడాన్ని సూచిస్తుంది; חמה తీవ్రమైన కోపం లేదా ఉగ్రత. ఈ అనువాదం అగ్ని రూపకాన్ని, న్యాయతీర్పు తీవ్రతను రెండింటినీ కాపాడుతుంది.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలంపై
  rationale: మూలంలోని ‘ఈ స్థలంలో’ అనే నిర్మాణం ఇక్కడ తీర్పు లక్ష్యాన్ని సూచిస్తుంది; తెలుగులో ఉగ్రతకు లక్ష్యాన్ని ‘పై’తో చెప్పడం సహజం.
- source_word: וְלֹא תִכְבֶּה
  choice: అది ఆరిపోదు
  rationale: כבה అగ్ని ఆరిపోవడాన్ని సూచిస్తుంది. ‘ఆరిపోదు’ ముందున్న ‘రగులుకుంది’తో రూపక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కోపాన్ని మానవ భావోద్వేగ భాషలో వ్యక్తపరచడం
  choice: ‘నాకు కోపం పుట్టించడానికి’, ‘నా ఉగ్రత’ అనే భాషను నిలుపడం
  alternative: దీనిని వ్యక్తిత్వరహితమైన శిక్ష లేదా తీర్పు భాషగా మృదువుగా మార్చడం
  rationale: హెబ్రీయ మూలం దేవుని తీర్పును సంబంధపరమైన, భావోద్వేగపూరిత భాషలో స్పష్టంగా చెబుతుంది; దానిని అనువాదంలో తొలగించకూడదు.
- issue: దైవిక తీర్పుకు సంబంధించిన అగ్ని రూపకం
  choice: ‘రగులుకుంది; అది ఆరిపోదు’ అని రూపకాన్ని నిలుపడం
  alternative: శిక్ష తప్పదనే సాధారణ వ్యాఖ్యగా వివరించడం
  rationale: మూలపాఠం ఉగ్రతను ఆరని అగ్నిగా చిత్రిస్తుంది. ఆ రూపకాన్ని నిలుపడం వచన తీవ్రతను కాపాడుతుంది; తరువాతి సిద్ధాంత భావాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఉగ్రత’, ‘రగులుకుంది’, ‘ఆరిపోదు’ అనే పదాలు మూలంలోని న్యాయతీర్పు స్వరాన్నీ అగ్ని రూపకాన్నీ నిలుపుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
