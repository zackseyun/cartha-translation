revisions:
- from: వారు నన్ను విడిచిపెట్టి, ఇతర దేవుళ్లకు ధూపార్పణలు చేశారు[a]. తమ చేతులతో చేసిన వాటన్నిటి ద్వారా నాకు కోపం పుట్టించడానికే అలా చేశారు. అందువల్ల ఈ స్థలంపై నా ఉగ్రత రగులుకుంది; అది ఆరిపోదు.
  to: వారు నన్ను విడిచిపెట్టి, ఇతర దేవుళ్లకు ధూపార్పణలు చేసి, తమ చేతుల పనులన్నిటి ద్వారా నాకు కోపం పుట్టించడానికి అలా చేసినందున, ఈ స్థలంపై నా ఉగ్రత రగిలింది; అది ఆరిపోదు.
  rationale: The revision restores the verse-initial causal relation with ‘...చేసినందున,’ retains the purpose force of לְמַעַן with ‘...పుట్టించడానికి,’ and removes the separate added explanatory sentence. It preserves the judicial fire metaphor and adjusts the note so that it signals the broader lexical possibility without equating it with a technical burnt-offering term.
