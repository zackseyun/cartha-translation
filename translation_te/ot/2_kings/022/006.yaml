  variant: modern standard Telugu
source:
  edition: WLC
  text: לֶ/חָ֣רָשִׁ֔ים וְ/לַ/בֹּנִ֖ים וְ/לַ/גֹּֽדְרִ֑ים וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/006.yaml
  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: te
  text: నైపుణ్యంగల పనివారికి, నిర్మాణకారులకు, గోడలు కట్టేవారికి[a], అలాగే ఆ ఇంటిని[b] బలపరచడానికి కలపను, గనిలో తవ్విన రాళ్లను[c] కొనడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపదం మరింత అక్షరార్థంగా గోడలు లేదా ప్రాకారాలు కట్టేవారిని, బాగుచేసేవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థం: ‘ఇంటిని’; సందర్భంలో ఇది యెహోవా మందిరం.'
    reason: cross_reference
  - marker: c
    text: లేదా ‘చెక్కిన రాళ్లను’ / ‘కోసిన రాళ్లను’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: నైపుణ్యంగల పనివారికి
  rationale: חָרָשִׁים అనే పదం కేవలం వడ్రంగులను కాకుండా వివిధ నైపుణ్య వృత్తులవారిని సూచించగలదు; నిర్మాణ సందర్భంలో ఈ విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְלַבֹּנִים
  choice: నిర్మాణకారులకు
  rationale: בנה నుంచి వచ్చిన ఈ రూపం నిర్మించే పనిలో ఉన్నవారిని నేరుగా సూచిస్తుంది.
- source_word: וְלַגֹּדְרִים
  choice: గోడలు కట్టేవారికి
  rationale: גדר యొక్క ప్రాథమిక భావం గోడ లేదా కంచె కట్టడం, బాగుచేయడం. సాధారణ వృత్తిపేరుతో దానిని కుదించకుండా మూలంలోని స్పష్టమైన క్రియాభావాన్ని నిలిపింది.
- source_word: וְלִקְנוֹת
  choice: కొనడానికి
  rationale: ל తో కూడిన క్రియానామం నిధుల వినియోగ ఉద్దేశాన్ని కొనసాగిస్తుంది; తెలుగులో ‘కొనడానికి’ సహజంగా ఉంది.
- source_word: עֵצִים
  choice: కలపను
  rationale: నిర్మాణ సామగ్రి సందర్భంలో ‘కలప’ అనేది సాధారణ ‘చెక్క’ లేదా జీవించి ఉన్న ‘చెట్లు’ కంటే కచ్చితమైనది.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: గనిలో తవ్విన రాళ్లను
  rationale: מַחְצֵב గని లేదా రాతి గని నుంచి తీసిన రాళ్లను సూచిస్తుంది. ‘గనిలో తవ్విన’ అనే రూపం ఆధునిక పాఠకులకు పారదర్శకంగా ఉంటుంది; చెక్కిన/కోసిన రాళ్లు అనే సాధ్యమైన భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: לְחַזֵּק
  choice: బలపరచడానికి
  rationale: חזק యొక్క మూలార్థమైన ‘బలంగా చేయడం’ను నిలుపుతుంది; సందర్భంలో మరమ్మతు ఉద్దేశం ఉన్నప్పటికీ దాన్ని ప్రధాన పాఠంలోనే పరిమితం చేయదు.
- source_word: אֶת־הַבָּיִת
  choice: మందిరాన్ని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ సందర్భానుసారం యెహోవా మందిరాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సూచ్యార్థం వెంటనే స్పష్టమయ్యేలా ‘మందిరం’ వాడబడింది; అక్షరార్థం పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: הַבָּיִת యొక్క సందర్భానుసార గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘మందిరం’
  alternative: ‘ఇల్లు’ లేదా ‘ఆలయం’
  rationale: ఇది సందర్భంలో యెహోవా మందిరమే; ‘ఇల్లు’ తెలుగులో అస్పష్టంగా ఉండవచ్చు. అయినా హీబ్రూ పదం అక్షరార్థాన్ని పాదటిప్పణిలో తెలియజేసి మూల రూపాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణ పదజాలం వాడబడింది. హీబ్రూ వాక్యం ముందటి వచనంలోని నిధుల వినియోగానికి కొనసాగింపు కావడంతో, తెలుగులోనూ పూర్తికాని జాబితా-వాక్య స్వరూపం నిలుపబడింది.
