id: 2KI.22.15
reference: 2 Kings 22:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: te
  text: 'ఆమె వారితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: మిమ్మల్ని నా వద్దకు పంపిన ఆ మనిషికి ఇలా చెప్పండి:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: ఆమె వారితో ఇలా చెప్పింది
  rationale: హుల్దా సమాధానాన్ని ప్రారంభించే హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; స్త్రీలింగ క్రియను స్పష్టంగా నిలుపుతుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్తల సందేశ సూత్రాన్ని సహజమైన తెలుగులో వర్తమాన ప్రకటనగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో అందించి, యాహ్వేను ఇశ్రాయేలు దేవుడిగా గుర్తిస్తుంది.
- source_word: אִמְרוּ לָאִישׁ
  choice: ఆ మనిషితో ఇలా చెప్పండి
  rationale: బహువచన ఆజ్ఞను నిలుపుతూ, אִישׁ అనే ఏకవచన పురుషవాచక నామాన్ని ‘మనిషి’గా అనువదిస్తుంది.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: మిమ్మల్ని నా దగ్గరికి పంపిన
  rationale: ప్రతినిధి బృందాన్ని హుల్దా వద్దకు పంపిన వ్యక్తిని సూచించే సంబంధ ఉపవాక్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించాం.
- issue: אִישׁ యొక్క లింగ సూచన
  choice: ఆ మనిషి
  alternative: ఆ వ్యక్తి
  rationale: ఇక్కడ పదం పురుష ఏకవచనంలో ఉండి, సందర్భంలో రాజైన యోషీయాను సూచిస్తుంది; అయినప్పటికీ మూలంలో లేని ‘రాజు’ అనే పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచన ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. మూలవాక్యం తరువాతి సందేశాన్ని పరిచయం చేస్తూ ముగుస్తున్నందున చివరలో ద్విబిందువు ఉంచి తెరచిన ఉద్ధరణను కొనసాగించాం.
