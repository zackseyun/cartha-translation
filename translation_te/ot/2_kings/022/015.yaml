- from: 'ఆమె వారితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ‘మిమ్మల్ని నా దగ్గరికి పంపిన ఆ మనిషితో ఇలా చెప్పండి:'
  to: 'ఆమె వారితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: మిమ్మల్ని నా వద్దకు పంపిన ఆ మనిషికి ఇలా చెప్పండి:”'
  rationale: The revision removes the unsupported inner quotation, retains the deliberately open outer quotation and final colon because the divine message continues in the following verse, and uses a clearer standard Telugu dative construction for the person addressed.
