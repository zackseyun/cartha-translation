  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో సరైనది చేశాడు. తన తండ్రియైన దావీదు[a] మార్గమంతటిలో నడిచాడు; కుడివైపుకుగాని ఎడమవైపుకుగాని తొలగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “తండ్రి” అనే హీబ్రూ పదం తక్షణ జనకుడిని కాకుండా పూర్వీకుడిని లేదా రాజవంశ పితరుడిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: సరైనది చేశాడు
  rationale: నిర్దిష్ట విశేషణం నామవాచకార్థంలో వాడబడింది. ఈ తెలుగు ప్రయోగం నైతికంగా సరైనదాన్ని చేయడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హీబ్రూ మూలంలోని మూల్యాంకన నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతూ, దేవుని వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా ప్రతిలిపి చేస్తుంది.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: మార్గమంతటిలో నడిచాడు
  rationale: ప్రవర్తనను మార్గంలో నడవడంగా చూపే హీబ్రూ రూపకాన్ని, సంపూర్ణ అనుసరణను సూచించే ‘అంతటిలో’తో నిలుపుతుంది.
- source_word: דָּוִד אָבִיו
  choice: తన తండ్రి దావీదు
  rationale: אָב అనే మూలపదాన్ని నేరుగా ‘తండ్రి’గా ఉంచి రాజవంశ పితరుడు అనే విస్తృత హీబ్రూ అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: కుడికిగాని ఎడమకుగాని తొలగలేదు
  rationale: సరైన మార్గం నుంచి ఏ దిశకూ మళ్లకపోవడం అనే స్థిర రూపకాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో ప్రతిలిపి చేయబడింది.
- issue: దావీదును యోషీయా ‘తండ్రి’గా పేర్కొనడం
  choice: తండ్రి అనే మూలపదాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: పూర్వీకుడు; వంశపితరుడు
  rationale: హీబ్రూ రాజవంశ ప్రయోగాన్ని మార్చకుండా ఉంచి, ఇది తక్షణ జనకుడిని కాక పూర్వీకుడిని సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘మార్గంలో నడవడం,’ ‘కుడికిగాని ఎడమకుగాని తొలగకపోవడం’ అనే హీబ్రూ ప్రవర్తనా రూపకాలు నిలుపబడ్డాయి.
