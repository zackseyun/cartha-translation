revisions:
- from: అప్పుడు లేఖకుడైన షాఫాను రాజుతో, “యాజకుడైన హిల్కీయా నాకు ఒక గ్రంథాన్ని[a] ఇచ్చాడు” అని చెప్పాడు. తరువాత షాఫాను దానిని రాజు సమక్షంలో చదివాడు.
  to: 'అప్పుడు లేఖకుడైన షాఫాను రాజుకు ఇలా తెలియజేశాడు: “యాజకుడైన హిల్కీయా నాకు ఒక గ్రంథాన్ని[a] ఇచ్చాడు.” షాఫాను దానిని రాజు సమక్షంలో చదివాడు.'
