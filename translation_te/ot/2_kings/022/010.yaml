source:
  edition: WLC
  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סֹּפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖ה הַ/כֹּהֵ֑ן וַ/יִּקְרָאֵ֥/הוּ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: te
  text: 'అప్పుడు లేఖకుడైన షాఫాను రాజుకు ఇలా తెలియజేశాడు: “యాజకుడైన హిల్కీయా నాకు ఒక గ్రంథాన్ని[a] ఇచ్చాడు.” షాఫాను దానిని రాజు సమక్షంలో చదివాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక లిఖిత పత్రాన్ని” లేదా “ఒక చుట్టను.” హెబ్రీ పదం సాధారణంగా వ్రాతపూర్వక పత్రాన్ని సూచించగలదు; దాని భౌతిక రూపాన్ని అది స్వయంగా నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: చెప్పాడు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయడం, చెప్పడం’ అనే అర్థం ఇస్తుంది. కథన సందర్భంలో ‘చెప్పాడు’ సహజంగా ఉండి, అనవసరమైన అధికారిక భావాన్ని జోడించదు.
- source_word: הַסֹּפֵר
  choice: లేఖకుడైన
  rationale: סֹפֵר అనేది వ్రాతపనిలో నిపుణుడైన లేఖకుని లేదా రాజసభ కార్యదర్శిని సూచించగలదు. ‘లేఖకుడు’ మూలపదానికి దగ్గరగా ఉండి, చారిత్రక పదవిని కాపాడుతుంది.
- source_word: סֵפֶר
  choice: ఒక గ్రంథాన్ని
  rationale: סֵפֶר సాధారణంగా వ్రాతపూర్వక పత్రం లేదా గ్రంథాన్ని సూచిస్తుంది; దాని భౌతిక రూపం చుట్ట అని పదమే నిర్దేశించదు. నిర్దిష్ట ఉపపదం లేని హెబ్రీ రూపాన్ని ‘ఒక’ ద్వారా ప్రతిబింబించాం.
- source_word: נָתַן לִי
  choice: నాకు … ఇచ్చాడు
  rationale: పూర్తయిన క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో వ్యక్తం చేశాం; సందర్భమే దాని ప్రస్తుత ప్రాసంగికతను స్పష్టం చేస్తుంది.
- source_word: וַיִּקְרָאֵהוּ
  choice: దానిని … చదివాడు
  rationale: వ్రాతపూర్వక వస్తువు కర్మగా ఉన్నప్పుడు קרא ఇక్కడ చదవడాన్ని, సందర్భానుసారం బిగ్గరగా చదవడాన్ని సూచిస్తుంది. ‘చదివాడు’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షంలో
  rationale: ఈ హెబ్రీ ప్రయోగం రాజు ఎదుట లేదా అతని సన్నిధిలో చేయడాన్ని సూచిస్తుంది. ‘రాజు సమక్షంలో’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: חִלְקִיָּה
  choice: హిల్కీయా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: שָׁפָן
  choice: షాఫాను
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
