translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘లేఖకుడు,’ ‘గ్రంథం,’ ‘సమక్షంలో’ వంటి పదాలు చారిత్రక సందర్భాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
