source:
  edition: WLC
  text: ו/יתנ/ה עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים ב/בית יְהוָ֑ה וְ/יִתְּנ֣וּ אֹת֗/וֹ לְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁר֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/חַזֵּ֖ק בֶּ֥דֶק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: te
  text: ఆ డబ్బును యాహ్వే మందిరంలో నియమించబడిన పనివారి చేతుల్లోకి అప్పగించాలి[a]. వారు దాన్ని యాహ్వే మందిరంలో ఉన్న పనివారికి ఇచ్చి, మందిరంలోని నష్టాన్ని మరమ్మతు చేయాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పనివారి చేతికి ఇవ్వాలి.’ హీబ్రూ క్రియకు అక్షరార్థం ‘ఇవ్వడం’; ఇక్కడి ప్రయోగం ఒకరి ఆధీనానికి అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మందిరంలోని నష్టాన్ని మరమ్మతు చేయడం’ అనే మాటకు అక్షరార్థం ‘మందిరంలోని పాడైన చోటును బలపరచడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתנה ... עַל יַד
  choice: చేతికి అప్పగించాలి
  rationale: נתן అంటే ప్రాథమికంగా ‘ఇవ్వడం’; עַל יַד అనే ప్రయోగంతో కలిసినప్పుడు ఒకరి ఆధీనానికి లేదా సంరక్షణకు అప్పగించడం అనే భావం వస్తుంది. ఆజ్ఞాత్మక సందర్భాన్ని తెలుగులో ‘అప్పగించాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: పనివారు
  rationale: అక్షరార్థంగా ‘పని చేసేవారు.’ మందిర మరమ్మతులలో పాల్గొనే వారిని సూచించడానికి ‘పనివారు’ సహజమైన, విస్తృతమైన పదం.
- source_word: הַמֻּפְקָדִים
  choice: నియమించబడిన
  rationale: פקד యొక్క నిష్క్రియ భావాన్ని నిలుపుతూ, వీరు బాధ్యతకు నియమించబడినవారని తెలియజేస్తుంది; వారి ఖచ్చితమైన హోదాను అనవసరంగా నిర్దేశించదు.
- source_word: בבית יהוה
  choice: యాహ్వే మందిరంలో
  rationale: בית అనే పదానికి అక్షరార్థం ‘ఇల్లు’ అయినా, ఈ సందర్భంలో అది యాహ్వే ఆలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ויתנו אתו
  choice: వారు దాన్ని ... ఇచ్చి
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలుపుతుంది; డబ్బు బాధ్యుల నుంచి అసలు పని చేసేవారికి చేరే క్రమాన్ని తెలియజేస్తుంది.
- source_word: לחזק בדק הבית
  choice: మందిరానికి కలిగిన నష్టాన్ని బాగుచేయించాలి
  rationale: חזק అక్షరార్థంగా ‘బలపరచడం’; భవన సంరక్షణ సందర్భంలో దెబ్బతిన్న భాగాలను మరమ్మతు చేయడం అనే భావం. బాధ్యులు డబ్బు ఇచ్చి పనివారితో మరమ్మతు చేయించే సందర్భాన్ని ‘బాగుచేయించాలి’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ మూలపాఠంలో ఒడంబడిక నామమైన יהוה నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. పరిపాలనా బాధ్యతను ‘నియమించబడిన’ అని, నిర్మాణ మరమ్మతును ‘బాగుచేయించాలి’ అని సహజంగా వ్యక్తం చేశాం; దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం.
