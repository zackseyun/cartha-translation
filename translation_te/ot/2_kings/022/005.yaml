revisions:
- from: ఆ డబ్బును యాహ్వే మందిరంలో నియమించబడిన పనివారి చేతికి అప్పగించాలి[a]. వారు దాన్ని యాహ్వే మందిరంలో ఉన్న పనివారికి ఇచ్చి, మందిరానికి కలిగిన నష్టాన్ని బాగుచేయించాలి[b].
  to: ఆ డబ్బును యాహ్వే మందిరంలో నియమించబడిన పనివారి చేతుల్లోకి అప్పగించాలి[a]. వారు దాన్ని యాహ్వే మందిరంలో ఉన్న పనివారికి ఇచ్చి, మందిరంలోని నష్టాన్ని మరమ్మతు చేయాలి[b].
  rationale: The revision removes an unwarranted causative sense from the final clause and uses more idiomatic plural custody language. It retains the Hebrew’s distinction between the appointed custodians and the workers in the temple, preserves the divine name, and keeps the repair idiom broad in the footnote.
