source:
  edition: WLC
  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: te
  text: “కాబట్టి ఇదిగో, నేను నిన్ను నీ పితరుల దగ్గరకు చేర్చుతాను. నీవు శాంతితో[a] నీ సమాధి స్థలాలకు చేర్చబడతావు. నేను ఈ స్థలంపైకి తెస్తున్న విపత్తంతటినీ నీ కళ్లే చూడవు.” వారు రాజు దగ్గరకు తిరిగి వెళ్లి ఈ మాట తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రశాంతంగా.’ హీబ్రూ మూలంలో ‘శాంతితో’ అని ఉంది. ఇది యోషీయా మరణం జరిగిన ఖచ్చితమైన విధానాన్ని చెప్పడం కంటే, రాబోయే తీర్పును అతడు చూడకముందే మరణిస్తాడని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి వచనంలో యోషీయా చూపిన వినయానికి దేవుడు ఇచ్చే ప్రతిస్పందనను నిర్ధారణాత్మకంగా అనుసంధానిస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: దైవ ప్రకటనలోని గంభీరమైన దృష్ట్యాకర్షణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: చేర్చుకుంటాను / చేర్చబడతావు
  rationale: రెండు రూపాల్లోనూ ఉన్న אסף ధాతువు పునరుక్తిని వీలైనంతవరకు నిలుపుతూ, మరణించి పితరులతో కలవడం అనే హీబ్రూ నుడికారాన్ని తెలియజేస్తుంది.
- source_word: עַל אֲבֹתֶיךָ
  choice: నీ పితరుల దగ్గరకు
  rationale: మరణించిన పూర్వీకులతో చేరడాన్ని సూచించే కుటుంబ సంబంధ నుడికారాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קִבְרֹתֶיךָ
  choice: నీ సమాధి స్థలాల్లోకి
  rationale: హీబ్రూలోని బహువచనాన్ని నిలుపుతూ, తెలుగులో ‘నీ సమాధులు’ అనే అసహజ భావాన్ని కొంత నివారిస్తుంది.
- source_word: בְּשָׁלוֹם
  choice: శాంతితో
  rationale: שָׁלוֹם అనే నామవాచక భావాన్ని నిలుపుతుంది; మరణం జరిగిన ఖచ్చితమైన విధానాన్ని ముందుగానే నిర్ణయించదు.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: నీ కళ్లతో చూడవు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘నీ కళ్లు’ అనే సజీవ వ్యక్తీకరణను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הָרָעָה
  choice: విపత్తు
  rationale: ఇక్కడ నైతిక చెడుకంటే దేవుని తీర్పుగా రాబోయే అపాయాన్ని సూచిస్తుంది.
- source_word: מֵבִיא עַל
  choice: మీదికి రప్పిస్తున్న
  rationale: రాబోయే తీర్పు సమీపిస్తున్న భావాన్ని వర్తమాన క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం
  rationale: యెరూషలేము లేదా దాని పరిసరాలను సందర్భానుసారంగా సూచించగల విస్తృత పదబంధం.
- source_word: וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר
  choice: వారు తిరిగి వెళ్లి రాజుకు ఈ మాట తెలియజేశారు
  rationale: సందేశంతో తిరిగి వచ్చి నివేదించడాన్ని సూచించే హీబ్రూ నివేదిక సూత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యోషీయా తరువాత యుద్ధంలో మరణించిన నేపథ్యంలో בְּשָׁלוֹם (‘శాంతితో’) అనే మాట అర్థం
  choice: ‘శాంతితో’ అని మూలానికి దగ్గరగా అనువదించి ఉద్రిక్తతను అలాగే ఉంచడం
  alternative: మరణ విధానాన్ని స్పష్టంగా సూచించేలా ‘ప్రశాంతంగా మరణిస్తావు’ అని అనువదించడం
  rationale: హీబ్రూ పాఠం ‘శాంతితో’ అని మాత్రమే చెబుతుంది. తరువాతి వాక్యం యోషీయా రాబోయే విపత్తును చూడడని వివరిస్తుంది; అందువల్ల ఇది తప్పనిసరిగా ప్రశాంత మరణ విధానాన్ని సూచించదు. చారిత్రక-వేదాంత ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవక్తీయ ప్రకటన శైలిని పాటించాం. ‘పితరులు,’ ‘ఇదిగో’ వంటి పదాలు కొద్దిగా ఉన్నత శైలిలో ఉన్నప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. హీబ్రూ బహువచనమైన ‘సమాధులు’ను ‘సమాధి స్థలాలు’గా సహజీకరించాం; ‘శాంతితో’ అనే పదంలోని ఉద్దేశపూర్వక అస్పష్టతను పాదసూచికతో నిలిపాం.
