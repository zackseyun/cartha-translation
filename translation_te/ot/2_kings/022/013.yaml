  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: te
  text: “వెళ్లి[a], నా తరఫున, ప్రజల తరఫున, యూదా అంతటి తరఫున, దొరికిన ఈ గ్రంథంలోని మాటల విషయమై యాహ్వేను సంప్రదించండి. ఎందుకంటే మన పితరులు[b] ఈ గ్రంథంలోని మాటలకు చెవియొగ్గి, మనకు వర్తించేలా రాసి ఉన్నదంతా చేయలేదు కాబట్టి, మనపై రగులుకున్న యాహ్వే ఉగ్రత గొప్పది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వేను వెదకండి” లేదా “యాహ్వేను అడిగి తెలుసుకోండి” అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ దేవుణ్ణి వెదకడాన్ని లేదా మార్గదర్శనం కోసం ఆయనను సంప్రదించడాన్ని సూచించవచ్చు; ఇక్కడ సందర్భం అధికారిక విచారణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మన పూర్వీకులు.” హీబ్రూలో “మన పితరులు” అని ఉంది; ఇది జాతి పూర్వపు తండ్రులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: యెహోవాను విచారించండి
  rationale: ఇక్కడ דרשׁ అనేది దేవుని సాధారణంగా వెదకడం కంటే, దొరికిన గ్రంథం విషయమై ఆయన సమాధానం లేదా మార్గదర్శనం కోరడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: నా తరఫున, ప్రజల తరఫున, యూదా అంతటి తరఫున
  rationale: בְּעַד లోని ప్రాతినిధ్య భావాన్ని ‘తరఫున’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూడు భాగాల పునరుక్తిని నిలుపుతుంది.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: దొరికిన ఈ గ్రంథంలోని మాటలను గురించి
  rationale: దర్యాప్తు విషయాన్ని సూచించే עַל భావాన్ని, అలాగే דִּבְרֵי యొక్క పాఠ్యకేంద్రీకరణను నిలుపుతుంది.
- source_word: חֲמַת יְהוָה
  choice: యెహోవా ఉగ్రత
  rationale: חֵמָה లోని తీవ్రమైన, తీర్పుతో కూడిన కోపభావాన్ని ‘ఉగ్రత’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִצְּתָה בָנוּ
  choice: మన మీద రగులుకున్న
  rationale: יצת లోని మండించడం లేదా రగులడం అనే రూపకాన్ని నిలుపుతూ, בָנוּ యొక్క సందర్భానుగుణ ప్రతికూల దిశను ‘మన మీద’గా తెలిపింది.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: మన పితరులు ... విని ... చేయలేదు
  rationale: שׁמע యొక్క ‘వినడం’ భావాన్ని ఉంచి, తరువాతి לַעֲשׂוֹת తో కలిపి విధేయతలోని వైఫల్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: రాసి ఉన్నదంతా అనుసరించి చేయలేదు
  rationale: כְּ యొక్క ‘అనుసరించి’ భావాన్ని, כָּל యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: עָלֵינוּ
  choice: మన గురించి
  rationale: ఈ వాక్యాలు సమాజానికి వర్తిస్తాయనే భావాన్ని ఉంచి, వాటిని కేవలం ‘మనకు అనుకూలంగా’ లేదా ‘మనకు విరోధంగా’ అని ముందుగానే పరిమితం చేయదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా నిలిపి, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: אֲבֹתֵינוּ లోని పూర్వీకుల సూచన
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; ఇక్కడ ఇశ్రాయేలు జాతి పూర్వపు తండ్రుల తరాలను సూచిస్తుంది.
- issue: עָלֵינוּ యొక్క వర్తింపు
  choice: మన గురించి
  alternative: మనకు వ్యతిరేకంగా
  rationale: సందర్భం తీర్పును సూచించినా, ఉపసర్గ స్వయంగా ఆశీర్వాదమా తీర్పా అని పూర్తిగా నిర్దిష్టం చేయదు; అందుచేత మూలంలోని విస్తృత భావాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ కారణ-ఫలిత క్రమాన్ని తెలుగులో సహజంగా తెలియజేయడానికి కారణ వాక్యాన్ని ముందుంచి, ‘అందువల్ల’తో ప్రధాన తీర్పు వాక్యానికి అనుసంధానించబడింది.
