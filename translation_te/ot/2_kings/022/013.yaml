  verdict: revise
  source_fidelity: The draft preserves the principal referents and the sense of inquiry, but “మాటలను విని ... చేయలేదు” can imply that the ancestors did hear the book and merely failed to act. Hebrew negates their heeding/listening with the purpose of doing all that is written. The draft also reverses the source’s wrath-then-cause progression. Rendering the divine name as “యాహ్వే” aligns with the stated POB audit trail’s direct-name policy.
  naturalness: “యెహోవాను విచారించండి” is understandable but less idiomatic in modern standard Telugu for seeking an oracle or guidance. “యాహ్వేను సంప్రదించండి” is natural and retains the formal inquiry sense. “చెవియొగ్గలేదు” clearly conveys the required responsive sense of hearing.
  terminology: Use “యాహ్వే” for יהוה, consistently with the supplied English POB decision. “పితరులు” appropriately retains the masculine forefather reference. “మనకు వర్తించేలా రాసి ఉన్నదంతా” expresses the deliberately broad force of עלינו without prematurely restricting it to judgment.
