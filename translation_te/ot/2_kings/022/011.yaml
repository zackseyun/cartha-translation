source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֶת דִּבְרֵ֖י סֵ֣פֶר הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: te
  text: రాజు ధర్మశాస్త్ర గ్రంథంలోని[a] మాటలు విన్నప్పుడు, తన బట్టలు చింపుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధర్మశాస్త్రపు చుట్ట.’ హీబ్రూ סֵפֶר అనే పదం లిఖిత చుట్టను లేదా గ్రంథరూప పత్రాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సంధానంతో కూడిన కాలసూచక నిర్మాణాన్ని తెలుగులో సహజంగా తెలిపే రూపం; సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్టంగా ప్రస్తావించబడిన రాజును సందర్భానుసారంగా సహజ తెలుగులో సూచిస్తుంది.
- source_word: דִּבְרֵי
  choice: మాటలు
  rationale: చదివి వినిపించబడిన పత్రంలోని వాక్యాలు లేదా విషయాన్ని సూచిస్తూ, హీబ్రూ పదానికి ఉన్న ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: סֵפֶר הַתּוֹרָה
  choice: ధర్మశాస్త్ర గ్రంథం
  rationale: תּוֹרָהకు ఈ నిబంధనాత్మక సందర్భంలో స్థిరమైన తెలుగు సమానార్థం ‘ధర్మశాస్త్రం’; סֵפֶר ఒక గ్రంథం లేదా లిఖితపు చుట్టను సూచించగలదు. ప్రధాన పాఠంలో ‘గ్రంథం’ సహజంగా ఉండగా ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: తన బట్టలు చింపుకున్నాడు
  rationale: దుఃఖం, భయం లేదా కలవరానికి సూచనగా వస్త్రాలను చింపుకునే చర్యను ఆధునిక, స్పష్టమైన తెలుగులో వ్యక్తపరుస్తుంది; మూలంలోని బహువచన భావాన్ని ‘బట్టలు’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అదే సమయంలో గంభీరమైన కథన శైలిని నిలుపుతూ అనువదించబడింది. ‘ధర్మశాస్త్రం’ సందర్భంలోని నిబంధనాత్మక బోధనను సూచిస్తుంది; ‘గ్రంథం/చుట్ట’ అనే నిజమైన పదార్థ వైవిధ్యం పాదసూచికలో భద్రపరచబడింది.
