  variant: modern standard Telugu
source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: te
  text: “నీ హృదయం సున్నితంగా ఉండి, నేను ఈ స్థలానికీ దాని నివాసులకూ వ్యతిరేకంగా పలికిన మాటలను—ఈ స్థలమూ దాని నివాసులూ పాడుబాటుగాను శాపంగాను మారతారని—నీవు విన్నప్పుడు యెహోవా ఎదుట నిన్ను నీవు తగ్గించుకొని, నీ బట్టలు చింపుకొని నా ఎదుట ఏడ్చావు కాబట్టి, నేను కూడా విన్నాను,” అని యెహోవా ప్రకటిస్తున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: అందువల్ల
  rationale: వాక్యంలోని యోషీయా స్పందనకు దేవుని ప్రతిస్పందనను కారణ-ఫల సంబంధంగా సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: רַךְ לְבָבְךָ
  choice: నీ హృదయం మెత్తబడింది
  rationale: అంతరంగ స్పందనశీలతను తెలిపే హీబ్రూ రూపకాన్ని అలాగే నిలుపుతూ, బలహీనత అనే భావాన్ని రానివ్వదు.
- source_word: וַתִּכָּנַע
  choice: నిన్ను నీవు తగ్గించుకున్నావు
  rationale: దేవుని ఎదుట స్వచ్ఛందంగా వినయపడిన ప్రతిబింబక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִפְּנֵי יְהוָה
  choice: యెహోవా ఎదుట
  rationale: దైవనామాన్ని ప్రత్యక్షంగా ఉంచి, దేవుని సన్నిధి ఎదుట అనే హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר דִּבַּרְתִּי עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: ఈ స్థలం గురించీ దాని నివాసుల గురించీ ... నేను చెప్పిన మాటలు
  rationale: עַל కు సందర్భానుసారంగా తీర్పు భావం ఉన్నా, దాని ప్రాథమిక సంబంధార్థమైన ‘గురించి’ని నిలిపి, తరువాతి తీర్పు వాక్యమే ప్రతికూలతను తెలియజేయనిస్తుంది.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: భయంకరమైన పాడుగానూ శాపవచనంగానూ మారతారని
  rationale: שַׁמָּה లోని పాడుదలతో పాటు భయాశ్చర్య భావాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ప్రతిబింబిస్తుంది; קְלָלָה ను ప్రజలు పలికే శాపానికి ప్రమాణంగా మారే భావంతో ‘శాపవచనం’గా అందిస్తుంది.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: నీ బట్టలు చింపుకొని
  rationale: దుఃఖం, పశ్చాత్తాపానికి సంబంధించిన ఆచరణను సాధారణ ఆధునిక తెలుగులో తెలుపుతుంది.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: నా ఎదుట ఏడ్చావు
  rationale: వ్యక్తిగత దైవసంబోధనను, శోకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: నేను కూడా నీ మొర విన్నాను
  rationale: ఆనోఖీతో కూడిన ఉద్ఘాటనను ‘నేను కూడా’గా నిలుపుతుంది; హీబ్రూలో కర్మ స్పష్టంగా లేకున్నా, సందర్భంలో వినబడింది యోషీయా మొర/ఏడ్పు అని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נְאֻם יְהוָה
  choice: అని యెహోవా ప్రకటిస్తున్నాడు
  rationale: గంభీరమైన ప్రవచన ప్రకటన సూత్రాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యక్షంగా ఉంచుతుంది.
- issue: దేవుడు ‘విన్నాడు’ అనే వాక్యంలో సూచిత కర్మ
  choice: నీ మొర విన్నాను
  alternative: నేను కూడా విన్నాను
  rationale: మూలంలో కర్మ వ్యక్తంగా లేకపోయినా సందర్భం యోషీయా ఏడ్పు మరియు వినయపూర్వక స్పందనను సూచిస్తుంది. ‘మొర’ సహజ తెలుగుకు తోడ్పడుతుంది; అయితే అది సందర్భం నుంచి స్పష్టీకరించబడిన పదం.
- issue: שַׁמָּה యొక్క తీర్పు భావం
  choice: భయంకరమైన పాడు
  alternative: విస్మయానికి గురిచేసేది / భీతికర దృశ్యం
  rationale: పదంలో పాడుదల, భయం, దిగ్భ్రాంతి అనే పరస్పర సంబంధిత భావాలు ఉండగలవు. ప్రధాన పాఠ్యం రెండింటినీ సంక్షిప్తంగా ప్రతిబింబిస్తూ, పాదసూచిక ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రవచన శైలిని ఉపయోగించాం. దీర్ఘమైన హీబ్రూ కారణ వాక్య నిర్మాణాన్ని తెలుగులో చదవడానికి అనువుగా రెండు వాక్యాలుగా విభజించాం; అయినా కారణ-ఫల సంబంధాన్ని ‘అందువల్ల’తో నిలిపాం. ప్రధాన పాఠ్యంలోని ప్రతి పాదసూచిక గుర్తు సరియైన స్థానంలో ఉంది.
