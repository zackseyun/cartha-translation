source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: te
  text: 'అప్పుడు రాజు యాజకుడైన హిల్కీయాకు[a], షాఫాను కుమారుడైన అహీకాముకు, మీకాయా కుమారుడైన అక్బోరుకు, లేఖకుడైన షాఫానుకు[b], రాజు సేవకుడైన అసాయాకు[c] ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో “యాజకుడైన హిల్కీయా” అని ఉంది; “ప్రధాన యాజకుడు” అని స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కార్యదర్శియైన షాఫాను.” హీబ్రూ పదం రాజలేఖకుడిని లేదా పరిపాలనా కార్యదర్శిని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “రాజు అధికారియైన అసాయా.” హీబ్రూలో అక్షరార్థంగా “సేవకుడు” అని ఉంది; రాజసభ సందర్భంలో అది రాజు సేవలోని అధికారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియలో రాజాజ్ఞకు తగిన అధికార భావం ఉంది; వావ్-కన్సెక్యూటివ్ గత కథన చర్యను సూచిస్తుంది.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: యాజకుడైన హిల్కీయా
  rationale: మూలంలో ‘యాజకుడు’ అని మాత్రమే ఉంది; ‘ప్రధాన యాజకుడు’ అని స్పష్టంగా లేదు.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: షాఫాను కుమారుడైన అహీకాము
  rationale: בן అనే బంధసూచక పదాన్ని సహజమైన ఆధునిక తెలుగులో ‘కుమారుడు’గా అనువదించాం.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: మీకాయా కుమారుడైన అక్బోరు
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: שָׁפָן הַסֹּפֵר
  choice: లేఖకుడైన షాఫాను
  rationale: ספר రాజసభ సందర్భంలో లేఖకుడిని లేదా పరిపాలనా కార్యదర్శిని సూచించగలదు; ప్రధాన పాఠంలో ప్రత్యక్ష అర్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: రాజు సేవకుడైన అసాయా
  rationale: עבד యొక్క ప్రత్యక్ష అర్థం ‘సేవకుడు’; రాజసభ సందర్భంలో అది అధికారిని కూడా సూచించవచ్చు.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే ఆజ్ఞలోని మాటలను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో ‘ఇలా ఆజ్ఞాపించాడు:’గా అందించాం.
theological_decisions:
- issue: హిల్కీయా యాజక హోదా
  choice: యాజకుడు
  alternative: ప్రధాన యాజకుడు
  rationale: ఈ వచనంలోని హీబ్రూ הַכֹּהֵן అంటే ‘యాజకుడు’; సందర్భం అతని ఉన్నత హోదాను సూచించినా, మూలంలో లేని ‘ప్రధాన’ అనే పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలిని పాటించాం. వ్యక్తుల జాబితాకు సహజంగా దత్తివిభక్తి వాడి, తరువాతి వచనంలోని మాటలకు అనుసంధానంగా చివర ద్విబిందువు ఉంచాం.
