source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: te
  text: 'యోషీయా రాజు పరిపాలనలో పద్దెనిమిదవ సంవత్సరంలో, రాజు మెషుల్లాము కుమారుడైన అజల్యా కుమారుడు, లేఖకుడైన షాఫానును యాహ్వే మందిరానికి[a] పంపి ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే ఇంటికి.’
    reason: మూలంలోని בֵּית (‘ఇల్లు’) అనే పదానికి అక్షరార్థ ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי
  choice: సంవత్సరంలో
  rationale: ఈ కథన ఆరంభ సూత్రంలోని కొనసాగింపు భావాన్ని తెలుగులో సహజమైన కాలవాచక వాక్య నిర్మాణంతో వ్యక్తం చేశాం; ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని చేర్చడం అవసరం లేదు.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: యోషీయా రాజు పరిపాలనలో పద్దెనిమిదవ సంవత్సరంలో
  rationale: ఇది రాజ్యపాలన సంవత్సరాన్ని సూచించే ప్రామాణిక కాలనిర్ణయ సూత్రం; ‘పరిపాలనలో’ అనడం తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: రాజు ... పంపి
  rationale: హీబ్రూలో యోషీయా పేరు వచ్చిన తరువాత ‘రాజు’ అని మళ్లీ ఉన్న నిర్మాణాన్ని నిలిపాం; తరువాతి వచనంలో కొనసాగే మాటకు అనుగుణంగా ‘పంపి ఇలా చెప్పాడు’ అని సహజంగా కలిపాం.
- source_word: שָׁפָן
  choice: షాఫాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: మెషుల్లాము కుమారుడైన అజల్యా కుమారుడు
  rationale: షాఫాను అజల్యా కుమారుడు, అజల్యా మెషుల్లాము కుమారుడు అనే వంశక్రమాన్ని స్పష్టంగా నిలిపాం.
- source_word: הַסֹּפֵר
  choice: లేఖకుడు
  rationale: ఈ పదం లేఖకుడు లేదా పరిపాలనా కార్యదర్శిని సూచించవచ్చు; సందర్భం నిర్దిష్ట పదవిని తప్పనిసరిగా నిర్ణయించనందున విస్తృతమైన ‘లేఖకుడు’ను ఎంచుకున్నాం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’; ఆరాధనా స్థలాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేయడానికి ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యం పొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: తరువాతి వచనంలో ఆజ్ఞలోని మాటలు వస్తాయి కాబట్టి, తెలుగు వాక్యప్రవాహానికి తగిన ప్రత్యక్ష వాక్య పరిచయాన్ని వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దైవనామమే ఉంది. అందువల్ల దానిని వ్యక్తినామంగా నిలిపి, తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: בֵּית יְהוָה యొక్క సూచన
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: ఇక్కడ ‘ఇల్లు’ దేవాలయాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో అర్థస్పష్టత కోసం ‘మందిరం’ను వాడి, మూలంలోని రూపకాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. వంశక్రమం అపార్థం కాకుండా నిర్మాణాన్ని స్పష్టంగా ఉంచాం. ఈ వచనంలోని మాట తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర ద్విబిందువు వాడాం.
