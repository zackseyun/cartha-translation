revisions:
- from: 'అప్పుడు రాజలేఖకుడైన షాఫాను రాజు దగ్గరికి వచ్చి, రాజుకు సమాచారం అందిస్తూ ఇలా అన్నాడు: “నీ సేవకులు మందిరంలో[b] దొరికిన వెండిని బయటికి పోశారు[a]. దాన్ని యెహోవా మందిరంలో నియమించబడిన పనివారి చేతికి అప్పగించారు[c].”'
  to: 'అప్పుడు రాజలేఖకుడైన షాఫాను రాజు వద్దకు వచ్చి, రాజుకు నివేదించి ఇలా అన్నాడు: “నీ సేవకులు మందిరంలో[b] దొరికిన వెండిని పోసి ఖాళీ చేశారు[a]. దానిని యాహ్వే మందిరానికి బాధ్యతగా నియమించబడిన పనివారి చేతికి అప్పగించారు[c].”'
  rationale: సవరణ మూలంలోని వరుస చర్యలను—షాఫాను రావడం, రాజుకు నివేదించడం, ఆపై అతని మాటలను—స్పష్టంగా నిలుపుతుంది. వెండిని పోయడం/ఖాళీ చేయడం అనే హీబ్రూ దృశ్యరూపాన్ని పాదసూచికతో సహా కాపాడింది. పనివారు యాహ్వే మందిరానికి బాధ్యతగా నియమించబడినవారని తెలిపి, దైవనామాన్ని నిర్దేశిత ‘Yahweh’ రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
