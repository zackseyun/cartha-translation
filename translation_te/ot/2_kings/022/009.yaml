id: 2KI.22.9
reference: 2 Kings 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: te
  text: 'అప్పుడు రాజలేఖకుడైన షాఫాను రాజు వద్దకు వచ్చి, రాజుకు నివేదించి ఇలా అన్నాడు: “నీ సేవకులు మందిరంలో[b] దొరికిన వెండిని పోసి ఖాళీ చేశారు[a]. దానిని యాహ్వే మందిరానికి బాధ్యతగా నియమించబడిన పనివారి చేతికి అప్పగించారు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెండిని ఖాళీ చేశారు’; హీబ్రూ క్రియకు అక్షరార్థంగా ‘పోశారు’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే దేవాలయం; అక్షరార్థంగా ‘ఇల్లు.’
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, ‘దానిని పనివారి చేతికి పెట్టారు’; అంటే వారి బాధ్యతకు అప్పగించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: రాజలేఖకుడు
  rationale: సֹפֵר అనే పదానికి లేఖకుడు లేదా రాజసభ కార్యదర్శి అనే భావాలు ఉండవచ్చు. సందర్భంలోని రాజసభ బాధ్యతను తెలియజేస్తూనే మూలపదంలోని ‘లేఖకుడు’ భావాన్ని నిలుపుతుంది.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: రాజుకు సమాచారం అందిస్తూ
  rationale: ‘మాటను తిరిగి తీసుకురావడం’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం; షాఫాను రాజుకు నివేదిక ఇచ్చాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: הִתִּיכוּ
  choice: బయటికి పోశారు
  rationale: ఇక్కడ లోహాన్ని కరిగించడం కాదు; సేకరించిన వెండిని ఒక పాత్ర లేదా పెట్టె నుంచి పోసి తీయడం భావం. తెలుగు పాఠ్యంలో మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: כֶּסֶף ‘వెండి’ అని అక్షరార్థంగా, సందర్భానుసారం ‘డబ్బు’ అని కూడా అర్థమవుతుంది. మూలంలోని లోహ సూచనను నిలుపుతూ ‘వెండి’ ఎంచుకున్నాం.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: మందిరంలో దొరికిన
  rationale: ఈ సందర్భంలో ‘ఇల్లు’ అనేది యెహోవా మందిరాన్ని సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి సూచన స్పష్టంగా ఉండేందుకు ‘మందిరం’ వాడబడింది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: దాన్ని ... చేతికి అప్పగించారు
  rationale: అక్షరార్థంగా ‘చేతిమీద/చేతికి పెట్టారు’; బాధ్యతగా అందజేయడం అనే నుడికార భావాన్ని, ‘చేతికి’ అనే హీబ్రూ రూపకాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: పనివారు
  rationale: మందిర మరమ్మతు పనిని నిర్వహించే వారిని సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: הַמֻּפְקָדִים
  choice: నియమించబడిన
  rationale: פקד ధాతువు యొక్క కర్మణి భావాన్ని నిలుపుతూ, వారికి అధికారిక బాధ్యత అప్పగించబడిందని తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘యెహోవా ఇల్లు’ అనే అక్షరార్థానికి సందర్భోచితమైన, ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగించాం.
- issue: בַּבַּיִת అనే ‘ఇల్లు’ సూచన
  choice: మందిరం
  alternative: ఇల్లు
  rationale: సందర్భంలో ఇది యెహోవా మందిరమే. ప్రధాన పాఠ్యంలో స్పష్టత కోసం ‘మందిరం’ అని ఇచ్చి, మూలంలోని అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘రాజలేఖకుడు’ రాజసభ సందర్భాన్ని స్పష్టం చేస్తుంది. హీబ్రూ నుడికారాలను పూర్తిగా సమతలీకరించకుండా, ప్రధాన పాఠ్యంలో సహజమైన రూపం మరియు పాదసూచికల్లో అక్షరార్థ రూపం ఇచ్చాం.
