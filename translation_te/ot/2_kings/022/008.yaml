  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకుడైన హిల్కీయా లేఖకుడైన షాఫానుతో, “ధర్మశాస్త్ర గ్రంథం[a] యాహ్వే మందిరంలో[b] నాకు దొరికింది” అన్నాడు. హిల్కీయా ఆ గ్రంథాన్ని షాఫానుకు ఇచ్చాడు; అతడు దాన్ని చదివాడు.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రపు చుట్ట.” హీబ్రూ סֵפֶר గ్రంథాన్ని లేదా చుట్టగా ఉన్న పత్రాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: “యాహ్వే ఇంటిలో”; అంటే, దేవాలయంలో.'
    reason: cultural_note
  - marker: c
    text: లేదా, కొంత తక్కువ సంభావ్యతతో, “దానిలో నుంచి చదివాడు.”
    reason: lexical_alternative
  - marker: d
    text: సందర్భంలో “అతడు” సాధారణంగా షాఫానును సూచిస్తుంది; అయితే హీబ్రూ వాక్యం కర్తపేరును ఇక్కడ మళ్లీ చెప్పదు.
    reason: ambiguity_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడు
  rationale: ఇది ప్రధాన యాజక పదవిని సూచించే స్థిరమైన బిరుదు; ‘గొప్ప యాజకుడు’ అనే అక్షరార్థం సందర్భానికి తగదు.
- source_word: הַסֹּפֵר
  choice: లేఖకుడు
  rationale: సֹפֵר రాజసభ లేదా పరిపాలనా పత్రలేఖకుడిని సూచించగలదు. ‘లేఖకుడు’ మూలపదానికి దగ్గరగా ఉండి, ‘కార్యదర్శి’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: סֵפֶר הַתּוֹרָה
  choice: ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶר గ్రంథం లేదా చుట్టను, תּוֹרָה ఈ నిబంధనాత్మక సందర్భంలో ధర్మశాస్త్రాన్ని సూచిస్తుంది. ఎంపిక పరిచితంగా, స్పష్టంగా ఉంది; పత్రరూపంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מָצָאתִי
  choice: నాకు దొరికింది
  rationale: హీబ్రూ సంపూర్ణ క్రియ తాజాగా జరిగిన, ప్రస్తుతం ప్రాముఖ్యమున్న కనుగొనడాన్ని తెలియజేస్తుంది. తెలుగులో ఈ సహజ ప్రయోగం ‘నేను కనుగొన్నాను’ అనే భావాన్నే ఇస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: అక్షరార్థం ‘యెహోవా ఇంటిలో’; సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ సాధారణ పాఠకునికి వెంటనే స్పష్టమవుతుంది, అక్షరరూపాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: ఆ గ్రంథాన్ని ... ఇచ్చాడు
  rationale: נתן యొక్క సరళమైన అర్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘ఆ’ ముందు ప్రస్తావించిన గ్రంథాన్నే సూచిస్తుంది.
- source_word: וַיִּקְרָאֵהוּ
  choice: అతడు దాన్ని చదివాడు
  rationale: ప్రత్యయంతో కూడిన קרא సాధారణంగా ‘దాన్ని చదివాడు’ అని అర్థం. ‘అతడు’ అని ఉంచడం వల్ల హీబ్రూలో స్పష్టంగా పేరుపెట్టని కర్తను అనవసరంగా ఖరారు చేయలేదు; సందర్భంలో అది సాధారణంగా షాఫానునే సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: וַיִּקְרָאֵהוּలో చదివిన వ్యక్తి ఎవరు?
  choice: పేరును మళ్లీ చేర్చకుండా ‘అతడు’
  alternative: ‘షాఫాను దాన్ని చదివాడు’
  rationale: సందర్భంలో షాఫాను అత్యంత సంభావ్య కర్త అయినా, హీబ్రూ క్రియలో కర్తపేరు మళ్లీ లేదు. తెలుగు సర్వనామం మూలంలోని స్వల్ప వ్యాకరణ అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే కథనశైలి. ‘ప్రధాన యాజకుడు’, ‘లేఖకుడు’, ‘ధర్మశాస్త్ర గ్రంథం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగించాం. మూలంలోని పత్రరూపం, ‘ఇల్లు/మందిరం’, చదవడంలోని స్వల్ప అర్థభేదం, కర్తకు సంబంధించిన పరిమిత అనిశ్చితి పాదసూచికల్లో భద్రపరచబడ్డాయి.
