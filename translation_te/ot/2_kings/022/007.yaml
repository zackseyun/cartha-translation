source:
  edition: WLC
  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: te
  text: అయితే, వారి చేతుల్లోకి అప్పగించిన వెండి[a] గురించి వారి నుంచి లెక్క అడగకూడదు[b]; ఎందుకంటే వారు నమ్మకంగా వ్యవహరిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘డబ్బు.’ ఆర్థిక సందర్భాల్లో హెబ్రీలో ‘వెండి’ అనే పదం సాధారణంగా డబ్బును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీని మరింత అక్షరార్థంగా అనువదిస్తే, ‘వారితో లెక్క వేయకూడదు.’ అంటే, నిధులను నిర్వహిస్తున్న ఈ వ్యక్తుల నుంచి లెక్క సమర్పించాలని కోరలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి ఆదేశానికి ఒక మినహాయింపు లేదా పరిమితిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన వ్యతిరేక సంధానంగా ఉంది.
- source_word: יֵחָשֵׁב אִתָּם
  choice: వారినుంచి లెక్క అడగకూడదు
  rationale: ఆర్థిక సందర్భంలో వారిచేత నిర్వహించబడిన నిధుల గురించి లెక్క సమర్పించాలని కోరడం లేదనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. హెబ్రీ నిర్మాణానికి మరింత దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: మూలపదపు అక్షరార్థాన్నీ చారిత్రక వర్ణాన్నీ నిలుపుతుంది; ఈ ఆర్థిక సందర్భంలో అది డబ్బును సూచించగలదని పాదసూచిక వివరిస్తుంది.
- source_word: הַנִּתָּן עַל יָדָם
  choice: వారి చేతికి అప్పగించిన
  rationale: వారి నిర్వహణకు నిధులు ఇవ్వబడ్డాయనే భావాన్ని, హెబ్రీలోని ‘చేతికి ఇవ్వడం’ అనే చిత్రాన్ని నిలుపుతూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: లెక్క అడగకపోవడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בֶאֱמוּנָה
  choice: నమ్మకంగా
  rationale: ఇక్కడ సిద్ధాంతపరమైన విశ్వాసం కాక, ప్రవర్తనలోని విశ్వసనీయత మరియు నిజాయితీ భావం ప్రధానమైనది.
- source_word: הֵם עֹשִׂים
  choice: వారు ... పనిచేస్తున్నారు
  rationale: సందర్భంలో వారు నిధులకు సంబంధించిన పనిని నిర్వహిస్తున్నారని సూచిస్తుంది; తెలుగులో ‘చేస్తున్నారు’ కంటే ‘పనిచేస్తున్నారు’ సహజంగా ఉంది.
