id: 2KI.22.16
reference: 2 Kings 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: te
  text: 'యహ్వే ఇలా అంటున్నాడు: “ఇదిగో, నేను ఈ స్థలంపైనా దాని నివాసులపైనా విపత్తును[a] రప్పిస్తున్నాను—అదే, యూదా రాజు చదివిన గ్రంథంలోని మాటలన్నిటినీ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విపత్తు’కు ‘ఆపద’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ పదం רָעָה నైతిక దుష్టత్వాన్ని కాకుండా తీర్పుగా వచ్చే విపత్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: యహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవిక సందేశ సూత్రాన్ని సహజమైన, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; יְהוָה అనే దైవనామాన్ని ‘యహ్వే’గా నేరుగా లిప్యంతరీకరించింది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: దైవిక ప్రకటనలోని గంభీరతను, తక్షణత్వాన్ని తెలియజేసే సహజ తెలుగు సూచన పదం.
- source_word: מֵבִיא
  choice: రప్పిస్తున్నాను
  rationale: హీబ్రూ కృదంతంలోని సమీపిస్తున్న లేదా ఇప్పటికే నిర్ణయాత్మకంగా సాగుతున్న చర్య భావాన్ని సాధారణ భవిష్యత్ కాలంగా మార్చకుండా నిలుపుతుంది.
- source_word: רָעָה
  choice: విపత్తు
  rationale: ఈ తీర్పు సందర్భంలో ఈ పదం నైతిక దుష్టత్వాన్ని కాకుండా సంభవించే వినాశకరమైన ఆపదను సూచిస్తుంది.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: ఈ స్థలం మీదికీ దీని నివాసుల మీదికీ
  rationale: తీర్పు ఎవరిమీదికి వస్తుందో స్పష్టంగా చూపుతూ హీబ్రూ సమాంతర నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: గ్రంథంలోని మాటలన్నిటినీ
  rationale: ‘గ్రంథంలో వ్రాసినదంతా’ అని వివరణాత్మకంగా మార్చకుండా, ఒడంబడిక తీర్పు మాటలతో ఉన్న సన్నిహిత పదబంధాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు చదివిన
  rationale: చదవడం బిగ్గరగా జరిగిందని మూలంలో స్పష్టంగా లేనందున ‘చదివి వినిపించిన’ అని జోడించకుండా సంబంధ వాక్యాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: רָעָה అనే దైవిక తీర్పు పదం
  choice: విపత్తు
  alternative: కీడు
  rationale: సందర్భం యహ్వే ప్రకటించిన ఒడంబడిక తీర్పు. ‘విపత్తు’ శిక్షాత్మక ఆపద భావాన్ని తెలియజేస్తుంది; దేవుడు నైతిక కీడు చేస్తున్నాడనే అనవసర భావాన్ని కలిగించదు.
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో అందిస్తుంది.
- issue: ‘విపత్తు’ మరియు ‘గ్రంథంలోని మాటలన్నీ’ మధ్య వాక్య సంబంధం
  choice: డాష్ ద్వారా వివరణాత్మక సమీపస్థాపన
  alternative: ‘ఆ మాటలన్నిటిని నెరవేర్చుతాను’ అని స్పష్టీకరించడం
  rationale: హీబ్రూలో ‘గ్రంథంలోని మాటలన్నిటినీ’ అనే పదబంధం వ్యాకరణపరంగా ముందున్న ప్రకటనకు సన్నిహితంగా జతచేయబడింది; ‘నెరవేర్చడం’ అనే క్రియను మూలంలో లేకుండానే చేర్చి సంబంధాన్ని పూర్తిగా పరిష్కరించకుండా, అసలు వాక్యంలోని గాఢతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన శైలి పాటించబడింది. ‘యహ్వే’, ‘ఇదిగో’ అనే రూపాలు ఉన్నతమైన ధోరణిని నిలుపుతాయి; మిగతా వాక్యం సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా ఉంచబడింది. మూలంలోని చివరి పదబంధ సంబంధాన్ని అతిగా వివరణ చేయకుండా డాష్‌తో నిలుపుకున్నాం.
