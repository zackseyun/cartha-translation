  to: 'యహ్వే ఇలా అంటున్నాడు: “ఇదిగో, నేను ఈ స్థలంపైనా దాని నివాసులపైనా విపత్తును[a] రప్పిస్తున్నాను—అదే, యూదా రాజు చదివిన గ్రంథంలోని మాటలన్నిటినీ.”'
