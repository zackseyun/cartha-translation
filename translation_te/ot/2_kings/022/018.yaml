reference: 2 Kings 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: te
  text: 'అయితే యెహోవాను సంప్రదించడానికి మిమ్మల్ని పంపిన యూదా రాజుతో ఇలా చెప్పండి: “ఇశ్రాయేలు దేవుడైన యెహోవా ఇలా అంటున్నాడు: నీవు విన్న మాటల విషయానికి వస్తే—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు విన్న మాటల విషయమైతే—” హీబ్రూ వాక్యభాగం ఇక్కడ అపూర్ణంగా ఉండి, తరువాతి వచనంలో పూర్తవుతుంది.
    reason: మూలంలోని వేలాడే అంశవాక్య నిర్మాణాన్ని మరియు సహజమైన మరో తెలుగు రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְאֶל
  choice: అయితే ... రాజుతో
  rationale: ముందటి సందేశం నుంచి యూదా రాజుకు ఉద్దేశించిన మాటలవైపు జరిగే భావమార్పును ‘అయితే’ సహజంగా తెలియజేస్తుంది; אֶל యొక్క దిశార్థం తెలుగులో ‘రాజుతో ... చెప్పండి’ అనే నిర్మాణంలో నిలుస్తుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: హీబ్రూ సమాసబంధానికి సహజమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: మిమ్మల్ని పంపిన
  rationale: కర్తను విశేషించే హీబ్రూ కృదంతాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో అనువదించింది.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: యెహోవా దగ్గర విచారించడానికి
  rationale: ఈ సందర్భంలో דרשׁ దేవుని నుంచి సమాధానం లేదా మార్గదర్శనం కోరడాన్ని సూచిస్తుంది. ‘యెహోవాను విచారించడం’ అనే అసహజమైన లేదా ప్రశ్నించడమనే అపార్థం రాకుండా ‘దగ్గర విచారించడానికి’ వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచింది.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: అతనితో ఇలా చెప్పండి
  rationale: సందేశాన్ని పరిచయం చేసే సూత్రప్రాయ వాక్యాన్ని ఆధునిక తెలుగులో సహజంగా, ఆదేశ భావంతో అందిస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా ప్రకటించబడే సందేశ సూత్రాన్ని సహజమైన వర్తమాన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: మూలంలోని సమాసాన్ని స్పష్టంగా, నేరుగా అనువదిస్తుంది.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: నీవు విన్న మాటల విషయమైతే—
  rationale: ఇది అంశాన్ని ముందుంచి, పూర్తి వాక్యాన్ని తదుపరి వచనంలో కొనసాగించే హీబ్రూ నిర్మాణం. దీర్ఘరేఖ ఆ అపూర్ణతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో అందించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: నీవు విన్న మాటల విషయమైతే అనే అపూర్ణ నిర్మాణం
  choice: వాక్యాన్ని దీర్ఘరేఖతో తదుపరి వచనానికి తెరిచి ఉంచడం
  alternative: తదుపరి వచన భావాన్ని ఇక్కడే చేర్చి వాక్యాన్ని పూర్తి చేయడం
  rationale: హీబ్రూ వాక్యనిర్మాణం ఈ వచనంలో అంశాన్ని మాత్రమే ప్రవేశపెట్టి, దాని పూర్తి భావాన్ని తరువాతి వచనంలో ఇస్తుంది; దాన్ని ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘ఇలా చెప్పండి / ఇలా అంటున్నాడు’ అనే పునరుక్తి మూలంలోని రెండు సందేశ సూత్రాలను ఉద్దేశపూర్వకంగా నిలుపుతుంది. ఏకవచన ‘నీవు’ రాజును నేరుగా సంబోధిస్తుంది; ‘మిమ్మల్ని’ దూతల సమూహాన్ని సూచిస్తుంది.
