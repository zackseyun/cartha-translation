  to: 'అయితే యెహోవాను సంప్రదించడానికి మిమ్మల్ని పంపిన యూదా రాజుతో ఇలా చెప్పండి: “ఇశ్రాయేలు దేవుడైన యెహోవా ఇలా అంటున్నాడు: నీవు విన్న మాటల విషయానికి వస్తే—[a]”'
