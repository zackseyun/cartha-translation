translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజ్యకాల సారాంశానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా సమాచార క్రమాన్ని కాపాడింది. వివరణ అవసరమైన పాఠభేదం లేదా వేదాంతపరమైన సందిగ్ధత ఈ వచనంలో లేదు.
