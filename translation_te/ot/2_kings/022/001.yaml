source:
  edition: WLC
  text: בֶּן שְׁמֹנֶ֤ה שָׁנָה֙ יֹאשִׁיָּ֣הוּ בְ/מָלְכ֔/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְדִידָ֥ה בַת עֲדָ֖יָה מִ/בָּצְקַֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: te
  text: యోషీయా రాజైనప్పుడు అతనికి ఎనిమిది సంవత్సరాలు. అతడు యెరూషలేములో ముప్పై ఒక్క సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెదీదా; ఆమె బొస్కతుకు చెందిన అదాయా కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: అతనికి ఎనిమిది సంవత్సరాలు
  rationale: ‘ఎనిమిది సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ఖచ్చితమైన వయస్సుతో వ్యక్తం చేస్తుంది.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఈ రూపం రాజ్యారంభ సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా అధికారాన్ని నిర్వహించడాన్ని సూచించే క్రియ; తెలుగు రాజ్యకాల సారాంశంలో ‘పరిపాలించాడు’ సహజంగా ఉంటుంది.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: ముప్పై ఒక్క సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యను అర్థనష్టం లేకుండా ప్రామాణిక తెలుగు సంఖ్యా రూపంలో అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పరిపాలన జరిగిన స్థలాన్ని తెలిపే ప్రత్యక్ష స్థానవాచక అనువాదం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ వంశావళి సూత్రాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: יְדִידָה
  choice: యెదీదా
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: בַת עֲדָיָה
  choice: అదాయా కుమార్తె
  rationale: తండ్రి-కుమార్తె బంధాన్ని నేరుగా తెలియజేస్తూ పేరును లిప్యంతరీకరిస్తుంది.
- source_word: מִבָּצְקַת
  choice: బొస్కతుకు చెందిన
  rationale: מִן ఉపసర్గ సూచించే మూలస్థల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
