source:
  edition: WLC
  text: עֲלֵ֗ה אֶל חִלְקִיָּ֨הוּ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְ/יַתֵּ֣ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה אֲשֶׁ֥ר אָסְפ֛וּ שֹׁמְרֵ֥י הַ/סַּ֖ף מֵ/אֵ֥ת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: te
  text: “ప్రధాన యాజకుడైన హిల్కీయా దగ్గరకు వెళ్లి, యెహోవా మందిరంలోకి తీసుకురాబడిన వెండిని అతడు లెక్కించి మొత్తం నిర్ధారించేలా చూడు. ఆ వెండిని గడప కాపలాదారులు[a] ప్రజల నుండి సేకరించారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్వారపాలకులు”; అక్షరార్థంగా, “గడప కాపలాదారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: పైకి వెళ్లు
  rationale: Qal ఆజ్ఞారూపంలోని దిశాసూచక భావాన్ని నిలుపుతూ, సహజమైన తెలుగు ఆజ్ఞగా అనువదించబడింది.
- source_word: חִלְקִיָּהוּ
  choice: హిల్కీయా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో సులభంగా పలికే ప్రామాణిక లిప్యంతరీకరణ.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడు
  rationale: ఈ స్థిరమైన యాజక పదవిని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְיַתֵּם
  choice: అతడు లెక్క కట్టాలి
  rationale: תמם యొక్క Hiphil రూపం ఇక్కడ మందిర నిధిని లెక్కించి మొత్తాన్ని నిర్ధారించే పరిపాలనా భావాన్ని సూచిస్తుంది; అస్పష్టమైన ‘పూర్తి చేయాలి’ కంటే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: ఇది ద్రవ్యంగా ఉపయోగించిన వెండిని సూచించినప్పటికీ, మూలంలోని లోహపదాన్ని నిలుపుతుంది.
- source_word: הַמּוּבָא
  choice: తీసుకువచ్చిన
  rationale: Hophal కర్మణి భావాన్ని తెలుగులో సహజమైన భూతకాల విశేషణ రూపంతో తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘యెహోవా గృహం’ అనే అక్షరార్థాన్ని సందర్భానుసారంగా సహజమైన ‘మందిరం’తో వ్యక్తపరుస్తూ దైవనామాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: אָסְפוּ
  choice: వసూలు చేసిన
  rationale: ఆర్థిక సందర్భంలో ప్రజల నుండి నిధిని సమీకరించడాన్ని ‘వసూలు చేసిన’ సహజంగా తెలియజేస్తుంది.
- source_word: שֹׁמְרֵי הַסַּף
  choice: గడప కాపలాదారులు
  rationale: ‘గడపను కాపాడేవారు’ అనే మూలపదబంధాన్ని దగ్గరగా నిలుపుతుంది; వారి కార్యపదవిని సూచించే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: מֵאֵת הָעָם
  choice: ప్రజల దగ్గర
  rationale: నిధి ఎవరి నుండి సేకరించబడిందో ఆధునిక సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వాక్యంలో వ్యక్తిగత దైవనామమే ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: וְיַתֵּם యొక్క పరిపాలనా భావం
  choice: అతడు లెక్క కట్టాలి
  alternative: అతడు పూర్తి చేయాలి
  rationale: మందిరపు వెండి సందర్భంలో ఈ క్రియ లెక్కను పూర్తిచేసి మొత్తాన్ని నిర్ధారించడాన్ని సూచిస్తుంది; అనువాదం అంతకుమించిన సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘పైకి’ అనే దిశాభావం, ‘వెండి’ అనే పదం, గడప కాపలాదారుల అక్షరార్థ పదబంధం నిలుపబడ్డాయి; వివరణాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చబడింది.
