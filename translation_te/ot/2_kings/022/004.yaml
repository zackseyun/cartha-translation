- from: “ప్రధాన యాజకుడైన హిల్కీయా దగ్గరికి పైకి వెళ్లు. యెహోవా మందిరంలోకి తీసుకువచ్చిన వెండిని, అంటే గడప కాపలాదారులు[a] ప్రజల దగ్గర వసూలు చేసిన వెండిని, అతడు లెక్క కట్టాలి.”
