source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/ם וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: te
  text: హిజ్కియా సందేశకుల చేతిలోనుండి ఆ లేఖలను తీసుకొని వాటిని చదివాడు.[a] తరువాత అతడు యాహ్వే మందిరానికి ఎక్కి వెళ్లాడు. హిజ్కియా ఆ లేఖను యాహ్వే సన్నిధిలో విప్పి పరచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లేఖలు’ అని అనువదించిన హిబ్రూ పదానికి ‘పత్రాలు,’ ‘రాతలు,’ లేదా ‘గ్రంథచుట్టలు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హిబ్రూ పాఠం ఏకవచన సర్వనామాన్ని ఉపయోగిస్తుంది—‘దానిని పరచాడు.’ ముందు పేర్కొన్న లేఖలు లేదా పత్రాలను ఒకే సందేశంగా సమష్టిగా సూచించి ఉండవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: ఆ లేఖలను
  rationale: ఈ పదానికి ‘రాతలు, పత్రాలు, గ్రంథచుట్టలు’ అనే విస్తృత అర్థాలు ఉండగలిగినా, ఈ కథన సందర్భంలో సందేశకులు తెచ్చిన రాజలేఖను లేదా లేఖలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘లేఖలు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: సందేశకుల చేతిలోనుండి
  rationale: ‘చేతిలోనుండి’ అనే హిబ్రూ రూపకాన్ని నిలుపుతూ, ఇక్కడ מַלְאָכִים పరలోక దూతలను కాక మానవ సందేశవాహకులను సూచిస్తుందని ‘సందేశకులు’ స్పష్టం చేస్తుంది.
- source_word: וַיִּקְרָאֵם
  choice: వాటిని చదివాడు
  rationale: క్రియకు జతచేసిన సర్వనామం బహువచనం; ముందు వచ్చిన ‘లేఖలు’తో దాని అన్వయం నిలుపబడింది.
- source_word: וַיַּעַל
  choice: ఎక్కి వెళ్లాడు
  rationale: עלה లోని ‘పైకి వెళ్లడం’ అనే భావాన్ని, దేవాలయానికి వెళ్లే సందర్భంలో సహజమైన తెలుగుతో నిలుపుతుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు’; ఇక్కడ యెరూషలేము దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ ఆధునిక పాఠకునికి సహజంగా, కచ్చితంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: ఆ లేఖను ... విప్పి పరచాడు
  rationale: ఇక్కడి సర్వనామం ఏకవచనం. ముందున్న బహువచన రాతపత్రాలను సమష్టిగా ఒక సందేశం లేదా లేఖగా చూడవచ్చు; మూలంలోని సంఖ్యామార్పును తొలగించకుండా నిలిపింది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: ‘యాహ్వే ఎదుట’ అనే హిబ్రూ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: బహువచన లేఖల తరువాత ఏకవచన వస్తువు
  choice: మొదట ‘లేఖలను’, తరువాత ‘ఆ లేఖను’
  alternative: రెండు చోట్లా ‘లేఖలను’
  rationale: మూలంలో చదివిన వస్తువుకు బహువచన సర్వనామం, పరచిన వస్తువుకు ఏకవచన సర్వనామం ఉన్నాయి. ఒకే సందేశాన్ని కలిగిన పత్రసముదాయంగా దీనిని అర్థం చేసుకునే అవకాశాన్ని తెరిచి ఉంచుతూ ఆ ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘సందేశకులు’ మానవ దూతలను స్పష్టం చేస్తుంది; ‘ఎక్కి వెళ్లాడు’ మూలంలోని దిశాభావాన్ని నిలుపుతుంది. చిన్న, స్పష్టమైన వాక్యాలు సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉన్నాయి.
