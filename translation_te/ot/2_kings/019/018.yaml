source:
  edition: WLC
  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: te
  text: వారి దేవుళ్లను అగ్నిలో వేశారు[a], ఎందుకంటే అవి దేవుళ్లు కావు; అవి మనుషుల చేతులతో చేసిన చెక్క మరియు రాయి; అందువల్ల వారు వాటిని నాశనం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దేవుళ్లను అగ్నిలో పెట్టారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “ఇచ్చారు/పెట్టారు” అని అర్థం; ఇక్కడ అగ్నిలో వేయడం అనే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: వేశారు
  rationale: נתן యొక్క ప్రాథమిక అర్థం ‘ఇవ్వు/పెట్టు’; ‘అగ్నిలో’ అనే సందర్భంలో తెలుగు సహజ ప్రయోగం ‘అగ్నిలో వేశారు.’ ఇది నాశనార్థక సందర్భాన్ని తెలియజేస్తూనే మూల క్రియకు దగ్గరగా ఉంటుంది.
- source_word: אֱלֹהֵיהֶם
  choice: వారి దేవుళ్లను
  rationale: వస్తువులు నిజమైన దేవుళ్లు కాదని తరువాతి ఉపవాక్యం నిరాకరిస్తుంది. కాబట్టి ‘విగ్రహాలు’ అని ముందుగానే వ్యాఖ్యానించకుండా, వచనంలోని వాదనాత్మక ప్రభావాన్ని కాపాడేందుకు ‘దేవుళ్లు’ అని అనువదించబడింది.
- source_word: בָּאֵשׁ
  choice: అగ్నిలో
  rationale: తెలుగులో ‘అగ్నిలో వేశారు’ అనేది గమనాన్ని సహజంగానే సూచిస్తుంది; ప్రత్యేకంగా ‘అగ్ని లోపలికి’ అనడం అవసరం లేదు.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: ఎందుకంటే అవి నిజంగా దేవుళ్లు కావు
  rationale: వాటి దైవత్వాన్ని నిరాకరించే భావాన్ని స్పష్టంగా చూపుతుంది. ‘నిజంగా’ అనేది హీబ్రూ నామవాక్యంలోని గుణాత్మక నిరాకరణను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם
  choice: అవి … చేసినవి
  rationale: ‘కాదు, కానీ/అవి మాత్రం’ అనే బలమైన వ్యత్యాసాన్ని తెలుగులో పునరుక్త కర్తతో సహజంగా వ్యక్తం చేసింది.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: మనుషుల చేతులతో చేసినవి
  rationale: మానవ నిర్మిత వస్తువులనే భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది; אָדָם ఇక్కడ సాధారణ మానవజాతిని సూచిస్తుంది.
- source_word: עֵץ וָאֶבֶן
  choice: కేవలం కట్టె, రాయి
  rationale: వాటి పదార్థ స్వరూపాన్ని తెలుపుతుంది. ‘కేవలం’ అనేది అవి దేవుళ్లు కావు, ఈ పదార్థాలే అనే వ్యత్యాసాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וַיְאַבְּדוּם
  choice: అందుకే వారు వాటిని నాశనం చేయగలిగారు
  rationale: రూపాన్ని 3వ పురుష బహువచన కర్త, బహువచన కర్మతో సకర్మకంగా గ్రహించింది. సందర్భంలో నాశనం చేయడం సాధ్యమైనదనే తార్కిక ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; అయితే ‘చేయగలిగారు’ అనేది సందర్భస్పష్టీకరణ.
theological_decisions:
- issue: אֱלֹהֵיהֶם లోని అబద్ధ దేవతల సూచన
  choice: వారి దేవుళ్లు
  alternative: వారి విగ్రహాలు
  rationale: మొదట వాటిని జనాలు పిలిచిన ప్రకారం ‘దేవుళ్లు’ అని పేర్కొని, వెంటనే అవి నిజమైన దేవుళ్లు కావని వచనమే నిరాకరిస్తుంది. ‘విగ్రహాలు’ అని అనువదిస్తే ఈ వాదనాత్మక ఉద్రిక్తత తగ్గుతుంది.
- issue: אָדָם యొక్క సాధారణ మానవ సూచన
  choice: మనుషుల
  alternative: మనిషి చేతుల
  rationale: ఇక్కడ ఒక పురుష వ్యక్తి కాదు, మానవుల చేత తయారైనదనే సాధారణ భావం ఉంది. ‘మనుషుల చేతులతో’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- issue: దేవుళ్లు కాదనే నిరాకరణ స్వభావం
  choice: నిజంగా దేవుళ్లు కావు
  alternative: దేవుళ్లు కావు
  rationale: నామమాత్రంగా దేవుళ్లని పిలిచినా వాస్తవ దైవత్వం లేదనే వ్యత్యాసాన్ని ‘నిజంగా’ వెల్లడిస్తుంది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అగ్ని,’ ‘నాశనం’ వంటి పదాలు బైబిలు పఠనానికి తగిన గంభీరతను నిలుపుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉంచబడింది.
