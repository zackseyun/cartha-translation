  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: te
  text: ఆ రాత్రి యెహోవా దూత బయలుదేరి అష్షూరు శిబిరంలో లక్ష ఎనభై ఐదు వేల మందిని హతమార్చాడు. తెల్లవారుజామున వారు లేచినప్పుడు[a], ఇదిగో, వారందరూ మృతదేహాలై పడి ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా, “తెల్లవారుజామున వారు లేచారు.” ‘వారు’ ఎవరన్నది అక్కడ నిర్దిష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “శవాలు, మృతులు”—హతుల స్థితిని నొక్కిచెప్పే ప్రయోగం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జరిగింది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా కాలసూచనతో వ్యక్తం చేస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: ఈ సందర్భంలో מַלְאַךְ అతీంద్రియ దూతను సూచిస్తుంది; దైవనామం יְהוָהను ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: ‘వెలుపలికి వెళ్లడం’ అనే మూలభావాన్ని సహజమైన తెలుగు కథనశైలిలో ఇస్తుంది.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: נכהకు ‘కొట్టడం’ అనే ప్రాథమిక భావం ఉన్నా, ఇక్కడ వెంట వచ్చే శవాల ప్రస్తావన దాని ప్రాణాంతక ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: అష్షూరు శిబిరంలో
  rationale: మూలంలోని ‘అష్షూరు శిబిరంలో’ అనే నిర్మాణాన్ని సహజంగా నిలుపుతుంది; అష్షూరు ఇక్కడ దాని సైన్యాన్ని సూచిస్తుంది.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: లక్షా ఎనభై ఐదు వేల మందిని
  rationale: సంఖ్యను సాధారణ ఆధునిక తెలుగు రూపంలో ఇస్తూ, మానవులను లెక్కిస్తున్న సందర్భానికి ‘మందిని’ చేర్చాం.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: తెల్లవారుజామున వారు లేచి చూసినప్పుడు
  rationale: మూడవ పురుష బహువచన కర్తను ‘వారు’గా అనిర్దిష్టంగానే ఉంచింది. ‘చూసినప్పుడు’ అనేది తరువాతి וְהִנֵּהతో కూడిన ఆకస్మిక దృశ్యాన్ని సహజ తెలుగులో అనుసంధానిస్తుంది; మూలంలోని అనిర్దిష్టతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన దృశ్యంపై దృష్టి ఆకర్షించే హీబ్రూ సంభాషణ సూచిక బలాన్ని నిలుపుతుంది.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: వారంతా చనిపోయిన శవాలుగా పడి ఉన్నారు
  rationale: ‘శవాలు, చనిపోయినవి’ అనే హీబ్రూ ఉద్ఘాటనను తెలుగులో అర్థవంతంగా నిలుపుతూ, దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా ఉంచాం.
- issue: מַלְאַךְ స్వరూపం
  choice: దూత
  alternative: దేవదూత
  rationale: ‘దూత’ అనే పదం మూలంలోని ‘సందేశవాహకుడు/దూత’ పరిధిని నిలుపుతుంది; సందర్భం అతీంద్రియ కార్యాన్ని తెలియజేస్తున్నా, పదంలో లేనిదాన్ని అదనంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కథనశైలి. ‘ఇదిగో’ ద్వారా మూలంలోని ఆకస్మిక దృశ్యబలాన్ని నిలిపాం; అనిర్దిష్ట కర్తను పాదటిప్పణిలో స్పష్టం చేశాం.
