translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మొదటి భాగంలోని ఏకవచన ‘నీకు’ను, వ్యవసాయ ఆదేశాల్లో మూలంలోని బహువచన రూపాలను ‘తినండి/కోయండి’గా నిలిపాం. హీబ్రూ సంధికారకాలను అనవసర విరోధార్థం లేకుండా క్రమబద్ధంగా ప్రతిబింబించాం.
