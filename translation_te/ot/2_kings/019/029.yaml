id: 2KI.19.29
reference: 2 Kings 19:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית סָחִ֑ישׁ וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים וְ/אִכְל֥וּ פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: te
  text: 'ఇది నీకు సూచనగా ఉంటుంది: ఈ సంవత్సరం తనంతట తానుగా మొలిచిన పంటను, రెండో సంవత్సరం దానినుంచి మళ్లీ మొలిచిన పంటను తినండి; మరి మూడో సంవత్సరం విత్తి కోయండి, ద్రాక్షతోటలు నాటి వాటి పండ్లు తినండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: సూచన
  rationale: אוֹת ఇక్కడ ప్రవచన వాగ్దానాన్ని ధృవపరిచే సూచనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘సూచన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אָכוֹל
  choice: తినండి
  rationale: ఇక్కడ infinitive absolute ఆజ్ఞాత్మక లేదా భావిష్యదర్థక బలంతో ఉంది. సందర్భంలోని సమూహాన్ని ఉద్దేశించిన భావాన్ని తెలుగులో గౌరవ/బహువచన రూపమైన ‘తినండి’ సహజంగా తెలియజేస్తుంది.
- source_word: סָפִיחַ
  choice: తనంతట తానుగా మొలిచిన పంట
  rationale: విత్తకుండానే స్వయంగా మొలిచే పంటను సూచించే పదం; సాంకేతిక పదం కంటే ఈ వివరణ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: סָחִישׁ
  choice: దానినుంచి మళ్లీ మొలిచిన పంట
  rationale: ఈ అరుదైన పదం రెండో సంవత్సరంలో ముందటి స్వయంమొలక పంటనుంచి వచ్చే తదుపరి మొలకను సూచించే అవకాశముంది. ఈ అనువాదం క్రమాన్ని తెలియజేస్తూనే అనిశ్చితిని పాదసూచికలో ఉంచుతుంది.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: విత్తి కోయండి
  rationale: వ్యవసాయ చర్యల సహజ క్రమాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנִטְעוּ כְרָמִים
  choice: ద్రాక్షతోటలు నాటి
  rationale: כְרָמִים అనే బహువచనానికి ‘ద్రాక్షతోటలు’ సూటి, సహజమైన సమానం.
- source_word: וְאִכְלוּ פִרְיָם
  choice: వాటి పండ్లు తినండి
  rationale: బహువచన ప్రత్యయం ద్రాక్షతోటలను సూచిస్తుంది; ‘వాటి పండ్లు’ మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
