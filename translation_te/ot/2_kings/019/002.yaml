translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని ఉపయోగించాం. వ్యక్తుల పేర్లను తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాల్లో ఉంచాం. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సంబంధాలు స్పష్టంగా కనిపించేలా విభక్తులను జోడించాం. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించాయి; తెలుగు ముసాయిదాలో [a]ను గోనెపట్టల పదబంధం వద్ద, [b]ను ఎల్యాకీము పదవి వద్ద సరిగా ఉంచాం.
