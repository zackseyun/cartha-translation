source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: te
  text: అప్పుడు అతడు, రాజగృహ నిర్వహణాధికారిగా ఉన్న ఎల్యాకీమును[b], లేఖకుడైన షెబ్నాను, గోనెపట్టలు ధరించుకున్న[a] యాజకుల పెద్దలను ఆమోజు కుమారుడైన యెషయా ప్రవక్త దగ్గరికి పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గోనెపట్టలతో తమను తాము కప్పుకుంటూ.’ హీబ్రూ కృదంతం కప్పుకునే చర్యను గానీ, కప్పుకొని ఉన్న స్థితిని గానీ నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘రాజగృహ నిర్వహణాధికారి’ అంటే రాజభవనం లేదా రాజకుటుంబ వ్యవహారాల బాధ్యత వహించే ఉన్నత రాజోద్యోగి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు అతడు ... పంపించాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది; కర్తను మూలంలోని విధంగానే సర్వనామంగా ఉంచాం.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: రాజగృహ నిర్వహణాధికారిగా ఉన్న
  rationale: ఈ హీబ్రూ పదబంధం రాజభవనం లేదా రాజకుటుంబ వ్యవహారాలపై అధికారమున్న ఉన్నతాధికారిని సూచిస్తుంది. అక్షరార్థమైన ‘ఇంటి మీద ఉన్న’ అనేది తెలుగులో అస్పష్టంగా ఉండటంతో, పదవిని స్పష్టంగా తెలిపే సహజ రూపాన్ని ఎంచుకున్నాం.
- source_word: הַסֹּפֵר
  choice: లేఖకుడైన
  rationale: סֹפֵר అనే పదం లేఖకుణ్ణి లేదా రాజ కార్యదర్శిని సూచించగలదు. ‘లేఖకుడు’ మూలంలోని విస్తృతిని నిలుపుతూ, పదవిని ‘కార్యదర్శి’గా మరీ నిర్దిష్టం చేయదు.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: యాజకుల పెద్దలను
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతుంది; ‘ప్రధాన యాజకులు’ అని అనువదిస్తే ‘పెద్దలు’ మరియు ‘యాజకులు’ అనే రెండు భావాలు ఒకే పదవిగా కలిసిపోతాయి.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: గోనెపట్టలు ధరించుకున్న
  rationale: ఈ కృదంతం వారు గోనెపట్టలు కప్పుకున్న చర్యను గానీ, అలా ధరించి ఉన్న స్థితిని గానీ సూచించగలదు. ఎంపిక చేసిన తెలుగు రూపం సహజంగా ఉండి, దుఃఖం మరియు అవమానాన్ని సూచించే దృశ్యాన్ని నిలుపుతుంది.
- source_word: אֶל יְשַׁעְיָהוּ הַנָּבִיא
  choice: యెషయా ప్రవక్త దగ్గరికి
  rationale: దిశను తెలిపే אֶל కు ‘దగ్గరికి’ సహజమైన తెలుగు సమానం; ప్రవక్త అనే బిరుదును పేరుతో నేరుగా కలిపాం.
- source_word: בֶּן אָמוֹץ
  choice: ఆమోజు కుమారుడైన
  rationale: వంశ సంబంధ గుర్తింపును సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
