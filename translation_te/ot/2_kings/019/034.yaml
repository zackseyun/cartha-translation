id: 2KI.19.34
reference: 2 Kings 19:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: te
  text: ఈ పట్టణాన్ని విడిపించడానికి నేను దానిని కాపాడుతాను[a]—నా నిమిత్తం, నా సేవకుడైన దావీదు నిమిత్తం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిని రక్షించడానికి.’ హీబ్రూ క్రియ ప్రమాదం నుంచి ‘రక్షించడం’ లేదా ‘విడిపించడం’ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: నేను దానికి కాపుగా ఉంటాను
  rationale: גנן అనే క్రియ కప్పి కాపాడడం, రక్షణ కల్పించడం అనే భావాన్ని ఇస్తుంది. ముట్టడిలో ఉన్న పట్టణ సందర్భంలో ‘కాపుగా ఉంటాను’ సహజంగా, గౌరవప్రదంగా సైనిక రక్షణ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: ఈ పట్టణాన్ని … దానికి
  rationale: גנןతో వచ్చిన אֶל రక్షణ చర్య దేనివైపు ఉద్దేశించబడిందో సూచిస్తుంది. తెలుగులో ‘ఈ పట్టణాన్ని… దానికి కాపుగా’ అని చెప్పడం సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְהוֹשִׁיעָהּ
  choice: విడిపించడానికి
  rationale: ישע క్రియ ప్రమాదం లేదా శత్రువు నుంచి రక్షించడం, విడిపించడం అనే అర్థాలను కలిగి ఉంది. ముందు ఉన్న ‘కాపుగా ఉంటాను’తో అనవసర పునరుక్తిని తగ్గిస్తూ, ఈ సందర్భంలోని విమోచన భావాన్ని ‘విడిపించడానికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמַעֲנִי
  choice: నా నిమిత్తం
  rationale: దేవుని స్వంత ఉద్దేశం లేదా నామం ఆధారమైన ప్రేరణను విస్తరించి వ్యాఖ్యానించకుండా నేరుగా నిలుపుతుంది.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: నా సేవకుడైన దావీదు నిమిత్తం
  rationale: రెండవ కారణాన్ని, అలాగే ‘నా సేవకుడు’ అనే దావీదు బిరుదును స్పష్టమైన ఆధునిక తెలుగులో యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: యెరూషలేమును విడిపించడానికి దేవుడు తెలిపిన కారణాలు
  choice: దేవుడు తన నిమిత్తం, తన సేవకుడైన దావీదు నిమిత్తం పట్టణాన్ని రక్షిస్తానని చెప్పిన రెండు కారణాలనూ సమానంగా నిలిపాం.
  alternative: దావీదు ప్రస్తావనను గతంలో ఇచ్చిన వాగ్దానాలకు మాత్రమే పరిమితం చేస్తూ వివరణాత్మకంగా అనువదించడం.
  rationale: హీబ్రూ పాఠంలో לְמַעַן రెండుసార్లు వచ్చి రెండు కారణాలను స్పష్టంగా తెలుపుతుంది. అనువాదం వాటిని ఏ ప్రత్యేక సిద్ధాంత వివరణతోనూ విస్తరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవవాక్యానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని ఉద్దేశ్య సంబంధాన్ని ‘-డానికి’, రెండు కారణాలను ‘నిమిత్తం’తో కాపాడాం.
