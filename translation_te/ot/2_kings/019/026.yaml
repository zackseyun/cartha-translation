source:
  edition: WLC
  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וַ/יֵּבֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵפָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: te
  text: కాబట్టి వాటి నివాసులు శక్తిహీనులై[a], కృంగిపోయి అవమానపడ్డారు.[b] వారు పొలంలోని గడ్డిలా, పచ్చని మొలకలా, ఇంటి కప్పులమీది గడ్డిలా, ఎదిగి నిలిచేలోపే మాడిపోయిన పైరులా ఉన్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘చేయి పొట్టివారు’; ఇది శక్తి లేదా సామర్థ్యం లేకపోవడాన్ని తెలిపే జాతీయం.
    reason: lexical_alternative
  - marker: b
    text: ‘కృంగిపోయి’ అనే చోట ‘భయంతో చితికిపోయి’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూ చివరి చిత్రం చాలా సంక్షిప్తంగా ఉంది. దాన్ని ‘నిలిచిన పంటగా ఎదగకముందే మాడుతెగులు తగిలిన పైరులా’ లేదా ‘మొలకెత్తి ఎదగకముందే మాడిపోయిన దానిలా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: వాటి నివాసులు
  rationale: సందర్భంలో ఈ ప్రత్యయం జయించబడిన పట్టణాలను సూచిస్తుంది. ‘వాటి నివాసులు’ అనేది సహజంగా ఉండి మూలంలోని బహువచన సూచనను నిలుపుతుంది.
- source_word: קִצְרֵי יָד
  choice: శక్తిహీనులై
  rationale: అక్షరార్థంగా ‘చేయి పొట్టివారు’ అనే ఈ జాతీయం సామర్థ్యం లేదా బలం లేకపోవడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు భావం స్పష్టంగా ఉండేలా జాతీయార్థాన్ని ఇచ్చాం.
- source_word: חַתּוּ
  choice: కృంగిపోయి
  rationale: ఈ క్రియ విరిగిపోవడం, భయపడడం లేదా ధైర్యం కోల్పోవడం అనే భావపరిధిని కలిగి ఉంది. ‘కృంగిపోయి’ అంతర్గతంగా చితికిన స్థితిని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיֵּבֹשׁוּ
  choice: అవమానపడ్డారు
  rationale: ఈ రూపం సిగ్గు లేదా పరాభవానికి గురైన ఫలితస్థితిని సూచిస్తుంది. ‘అవమానపడ్డారు’ ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: עֵשֶׂב שָׂדֶה
  choice: పొలంలోని గడ్డి
  rationale: సూటిగా ఉన్న నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అలాగే నిలిపాం.
- source_word: וִירַק דֶּשֶׁא
  choice: పచ్చని మొలక
  rationale: తాజాగా, లేతగా పెరుగుతున్న పచ్చని వృక్షజాలాన్ని సాధారణ పాఠకుడికి స్పష్టమైన రూపంలో తెలియజేస్తుంది.
- source_word: חֲצִיר גַּגּוֹת
  choice: ఇంటి కప్పులమీది గడ్డి
  rationale: లోతులేని మట్టిలో పెరిగి త్వరగా వాడిపోయే పైకప్పు గడ్డి అనే మూలచిత్రాన్ని నిలిపింది.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: ఎదిగి నిలిచేలోపే ఎండిపోయిన పైరు
  rationale: హీబ్రూ పదబంధం సంక్షిప్తమైనదీ వ్యవసాయ సంబంధమైనదీ. ‘ఎదిగి నిలిచేలోపే’ అనేది לִפְנֵי קָמָה లోని కాలసంబంధ భావాన్ని, ‘ఎండిపోయిన పైరు’ שְׁדֵפָה లోని మాడిపోవడం లేదా తెగులు పట్టడం అనే చిత్రాన్ని స్పష్టం చేస్తుంది; అస్పష్టతను పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక వాక్యనిర్మాణం వాడబడింది. వ్యవసాయ చిత్రాలను సాధారణ పాఠకుడికి అర్థమయ్యే పదాలతో నిలిపి, చివరి హీబ్రూ పదబంధంలోని నిజమైన అస్పష్టతను పాదసూచికలో సంరక్షించాం.
