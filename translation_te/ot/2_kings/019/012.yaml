source:
  edition: WLC
  text: הַ/הִצִּ֨ילוּ אֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר שִׁחֲת֣וּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַאשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: te
  text: నా పూర్వీకులు నాశనం చేసిన గోజాను, హారానును, రెసెపును, తెలస్సారులో ఉన్న ఏదెను ప్రజలను ఆ జనాల దేవుళ్లు రక్షించారా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: రక్షించారా
  rationale: నצל హిఫిల్ పర్ఫెక్ట్ బహువచన రూపం ఇక్కడ గతంలో జరిగిన రక్షణను గురించి అడిగే అలంకారప్రశ్న. ‘రక్షించారా’ సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: పేర్కొన్న జనాలు లేదా వారి నివాసులను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: జనాల దేవుళ్లు
  rationale: నిర్మాణ సమాసాన్ని నేరుగా, ఆధునిక తెలుగులో సహజంగా అనువదిస్తుంది.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: నా పూర్వీకులు నాశనం చేసిన
  rationale: שׁחת పియేల్ సైనిక సందర్భంలో ‘నాశనం చేయడం’ అనే భావాన్ని ఇస్తుంది. אֲבוֹתַי రాజవంశపు మునుపటివారిని సూచించవచ్చు కాబట్టి సహజమైన ‘పూర్వీకులు’ ఎంచుకోబడింది.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: గోజాను, హారాను, రెసెపు
  rationale: హీబ్రూ స్థలనామాలను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, కర్మ విభక్తిని చేర్చింది.
- source_word: וּבְנֵי עֶדֶן
  choice: ఏదెను ప్రజలను
  rationale: בְּנֵי అక్షరార్థంగా ‘కుమారులు’ అయినా, ఇక్కడ ఏదెనుతో సంబంధమున్న ప్రజలు లేదా నివాసులను సూచిస్తుంది; ప్రధాన పాఠంలో స్పష్టమైన ఆధునిక రూపం వాడి అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: తెలస్సారులో ఉన్న
  rationale: בְּ + స్థలనామం స్థానాన్ని సూచిస్తుంది; సంబంధ వాక్యాన్ని తెలుగులో సహజ క్రమంలో ఉంచింది.
