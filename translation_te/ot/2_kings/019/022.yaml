  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: te
  text: “నీవు ఎవరిని అవహేళన చేసి దూషించావు?[b] ఎవరికి విరోధంగా నీ స్వరం ఎత్తి, గర్వంతో కన్నులు పైకెత్తావు?[a] ఇశ్రాయేలు పరిశుద్ధునికి విరోధంగా!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ కన్నులను ఉన్నతంగా ఎత్తావు.” ఇది గర్వాన్ని లేదా అహంకారపూర్వక స్వీయోన్నతిని సూచించే నుడికారం.
    reason: cultural_note
  - marker: b
    text: “అవహేళన చేసి దూషించావు” అనే హెబ్రీ పదాలు తృణీకారంతో పలికే అవమానకర మాటలను సూచించే సమీపార్థక పదాలు; రెండవ పదం, ప్రత్యేకించి దేవుని సందర్భంలో, దైవదూషణ భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: అవహేళన చేశావు
  rationale: దేవుని పట్ల పలికిన తృణీకారపూర్వకమైన అవమానకర మాటలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גִדַּפְתָּ
  choice: దూషించావు
  rationale: దేవునికి వ్యతిరేకంగా పలికే అవమానకర, అపవిత్రమైన మాటల తీవ్రతను తెలుపుతుంది; ‘దైవదూషణ చేశావు’ కంటే వాక్యప్రవాహంలో సహజంగా ఉండి, సందర్భం ద్వారా దైవదూషణ భావాన్ని నిలుపుతుంది.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: నీ స్వరం ఎత్తి
  rationale: హెబ్రీయుల నుడికారంలోని బిగ్గరగా, సవాలుగా మాట్లాడే భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: గర్వంతో కన్నులు పైకెత్తావు
  rationale: అక్షరార్థ చిత్రమైన కన్నులు పైకెత్తడాన్ని నిలుపుతూ, מָרוֹם సూచించే అహంకార నుడికారాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పరిశుద్ధుడు
  rationale: ఇది స్థిరమైన దైవ బిరుదు; భావానువాదం చేయకుండా నేరుగా, గౌరవప్రదంగా అందించబడింది.
- source_word: עַל
  choice: విరోధంగా
  rationale: రెండు సందర్భాల్లోనూ శత్రుత్వపూర్వక దిశను సూచించే עַל భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవునికి వ్యతిరేకమైన మాటల ఆధ్యాత్మిక తీవ్రత
  choice: గִדַּפְתָּను ‘దూషించావు’గా అనువదించి, చివరలో ‘ఇశ్రాయేలు పరిశుద్ధునికే విరోధంగా’ అని ఉత్కర్షను నిలిపాం.
  alternative: ‘దైవదూషణ చేశావు’ లేదా ‘నిందించావు’
  rationale: ‘దూషించావు’ మూలపదంలోని అవమానకరమైన మాటల భావాన్ని సహజ తెలుగులో ఇస్తుంది; ఆ దూషణ దేవునికే సంబంధించినదని దైవబిరుదుతో కూడిన చివరి పాదం స్పష్టం చేస్తుంది. దీనివల్ల తీవ్రత తగ్గదు, అలాగే పదంలో లేనిదాన్ని ముందుగానే అతివ్యాఖ్యానం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా సంబోధించే ప్రశ్నల ఉత్కర్షను, చివరి దైవబిరుదులోని తీర్పు బలాన్ని నిలిపే గౌరవప్రదమైన శైలి. ‘నీవు/నీ’ రూపాలు సందర్భానుకూలమైన ఏకవచన ప్రత్యక్ష సంబోధనను కాపాడుతాయి.
