translation:
  language: te
  text: అప్పుడు హిజ్కియా రాజు సేవకులు యెషయా దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: అప్పుడు ... వచ్చారు
  rationale: వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది; ‘వచ్చారు’ בוא యొక్క సాధారణ అర్థం.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: עבד బహువచన నిర్మిత రూపం సేవకులు లేదా రాజసభ పరిచారకులు/అధికారులను సూచించగలదు. ‘సేవకులు’ మూలపదానికి దగ్గరగా ఉండి, రాజసభ సందర్భంలోనూ సహజంగా ఉంది.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: హిజ్కియా రాజు
  rationale: తెలుగు సహజ పదక్రమంలో బిరుదు వ్యక్తిపేరు తరువాత వస్తుంది; ఇది హిజ్కియా రాజస్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: వ్యక్తివైపు గమనాన్ని సూచించే אֶל కు ‘దగ్గరికి’ సహజ తెలుగు సమానార్థకం; కేవలం దిశను కాక, ఆ వ్యక్తిని చేరడాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: יְשַׁעְיָהוּ
  choice: యెషయా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన, గౌరవప్రదమైన కథనశైలి. రాజసభ పదానికి మరింత వ్యాఖ్యానాత్మకమైన ‘అధికారులు’ బదులు మూలానికి సమీపమైన ‘సేవకులు’ వాడబడింది.
