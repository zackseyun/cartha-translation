  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: te
  text: ఇదిగో, అష్షూరు రాజులు అన్ని దేశాలను నాశనానికి అంకితం చేస్తూ ఏమి చేశారో నీవు విన్నావు[a]. మరి నీవు రక్షింపబడతావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని పూర్తిగా నాశనం చేస్తూ.” హీబ్రూలో, “వాటిని నిషేధానికి గురిచేస్తూ,” అంటే నాశనానికి అంకితం చేస్తూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను బలంగా ఆకర్షించే హీబ్రూ ప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁמַעְתָּ
  choice: నీవు విన్నావు
  rationale: రెండవ పురుష ఏకవచన సంపూర్ణ క్రియను, ప్రస్తుతం సంబంధమున్న గత సమాచారం అనే భావంతో సహజంగా అందిస్తుంది.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: ఏమి చేశారో
  rationale: హీబ్రూ కర్మసూచకం మరియు సంబంధవాక్యాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా మారుస్తుంది.
- source_word: מַלְכֵי אַשּׁוּר
  choice: అష్షూరు రాజులు
  rationale: నిర్మిత సంబంధాన్ని స్పష్టంగా, సాంప్రదాయిక భౌగోళిక నామంతో అందిస్తుంది.
- source_word: לְכָל הָאֲרָצוֹת
  choice: దేశాలన్నిటినీ
  rationale: ఇక్కడ אָרֶץ భూమి మొత్తాన్ని కాక రాజకీయ-భౌగోళిక ప్రాంతాలను సూచిస్తుంది; బహువచన భావాన్ని నిలుపుతుంది.
- source_word: לְהַחֲרִימָם
  choice: నాశనానికి అంకితం చేస్తూ
  rationale: חרם అనే పదంలోని సాధారణ నాశనాన్ని మించిన, నాశనార్థం ప్రత్యేకంగా అప్పగించే భావాన్ని అర్థమయ్యే తెలుగులో కాపాడుతుంది.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: మరి నీవు తప్పించుకోగలవా?
  rationale: స్వతంత్ర సర్వనామం కలిగించే వ్యంగ్యపూర్వక వ్యత్యాసాన్ని ‘మరి నీవు’తో, నిఫాల్ రూపంలోని రక్షింపబడటం/తప్పించుకోవడం భావాన్ని సహజమైన అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సైనిక తీర్పు సందర్భంలో חרם పదప్రయోగం
  choice: నాశనానికి అంకితం చేస్తూ
  alternative: వారిని పూర్తిగా నాశనం చేస్తూ; వారిని నిషేధానికి లోబరుస్తూ
  rationale: హీబ్రూ పదంలోని ప్రత్యేకంగా నాశనానికి అప్పగించే న్యాయ-ఆరాధనా ఛాయను నిలుపుతూ, అస్పష్టమైన సాంకేతిక పదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజదౌత్య బెదిరింపు మరియు వ్యంగ్య ప్రశ్న యొక్క గంభీరత నిలిచేలా రూపొందించబడింది.
