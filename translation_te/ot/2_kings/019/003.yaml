  to: 'వారు అతనితో ఇలా అన్నారు: “హిజ్కియా ఇలా అంటున్నాడు: ‘ఈ రోజు కష్ట, గద్దింపు, అవమానాల[a] దినం. పిల్లలు పుట్టే ఘడియకు వచ్చారు[b][c], కాని ప్రసవించడానికి బలం లేదు.’”'
  rationale: The revision preserves the Hebrew syntax and deliberate ambiguity while improving modern Telugu idiom. The three nouns are rendered as coordinated attributes of ‘day,’ and the final clause now directly denotes giving birth. Footnotes retain both the explanatory function and the disputed lexical range of מַשְׁבֵּר without overresolving it.
