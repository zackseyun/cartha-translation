id: 2KI.19.3
reference: 2 Kings 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “హిజ్కియా ఇలా అంటున్నాడు: ‘ఈ రోజు కష్ట, గద్దింపు, అవమానాల[a] దినం. పిల్లలు పుట్టే ఘడియకు వచ్చారు[b][c], కాని ప్రసవించడానికి బలం లేదు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తిరస్కారం,” “అపహాస్యం.”
    reason: lexical_alternative
  - marker: b
    text: ఇది ప్రసవం కానున్న నిర్ణాయక క్షణానికి చేరుకున్నా, బలం చాలక ప్రసవం జరగని స్థితిని చిత్రించే రూపకం.
    reason: cultural_note
  - marker: c
    text: లేదా “పిల్లలు ప్రసవస్థానం వరకు వచ్చారు.” ఇక్కడి హెబ్రీ పదం מַשְׁבֵּר కష్టమైనది; అది ప్రసవం జరిగే స్థలాన్ని లేదా ప్రసవ క్షణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: రాజు పంపిన సందేశాన్ని పరిచయం చేసే సాంప్రదాయిక సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יוֹם צָרָה
  choice: కష్టానికి దినం
  rationale: ఒత్తిడి, ఆపదల మధ్య కలిగే తీవ్రమైన కష్టాన్ని సూచిస్తూ, హెబ్రీ పదాన్ని అతిగా విపులీకరించదు.
- source_word: וְתוֹכֵחָה
  choice: గద్దింపుకు
  rationale: తప్పును ఎత్తిచూపే గద్దింపు లేదా మందలింపు అనే అర్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וּנְאָצָה
  choice: అవమానానికి
  rationale: ఈ సందర్భంలోని తిరస్కారం, అపహాస్యం వల్ల కలిగిన ప్రజా అవమానాన్ని తెలియజేస్తుంది; ‘దూషణ’ అనే మరింత సంకుచిత అర్థానికి పరిమితం చేయదు.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: పిల్లలు పుట్టే ఘడియకు వచ్చారు
  rationale: ప్రసవం నిర్ణాయక క్షణానికి చేరినా పూర్తికాలేని సంక్షోభ రూపకాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; కష్టమైన מַשְׁבֵּר పదాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: కాని కనడానికి బలం లేదు
  rationale: ప్రసవం సమీపించినా దాన్ని పూర్తిచేయడానికి శక్తి లేదనే రూపకపు శిఖరాన్ని సహజంగా నిలుపుతుంది.
- source_word: בָנִים
  choice: పిల్లలు
  rationale: రూపకంలో లింగం కంటే సంతానం ప్రధానమైనందున, ‘కుమారులు’ కంటే ‘పిల్లలు’ సందర్భోచితం.
theological_decisions:
- issue: గద్దింపు ఎవరి నుండి వస్తుందో
  choice: ‘గద్దింపు’ అని మాత్రమే ఉంచబడింది
  alternative: ‘దేవుని గద్దింపు’ అని స్పష్టీకరించడం
  rationale: మూలపాఠం గద్దించేవారిని నిర్దిష్టంగా పేర్కొనదు; అందువల్ల ఆ భావసందిగ్ధతను అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసందేశానికి తగిన గంభీరతను నిలిపాం. ప్రసవరూపకాన్ని స్పష్టత కోసం పూర్తిగా విప్పి చెప్పకుండా, ప్రధాన పాఠంలో సంక్షిప్తంగా ఉంచి దాని సాంస్కృతిక, పదార్థ సంబంధిత వివరాలను పాదటిప్పణుల్లో ఇచ్చాం.
