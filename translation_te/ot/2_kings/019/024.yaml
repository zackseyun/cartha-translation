  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: te
  text: '“నేనే తవ్వాను, పరదేశపు నీళ్లు తాగాను;

    నా పాదాల అరికాళ్లతో ఐగుప్తులోని జలమార్గాలన్నిటినీ[a] ఎండగొడతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఐగుప్తులోని నైలు నది పాయలన్నిటినీ” లేదా “నైలు కాలువలన్నిటినీ.” హీబ్రూ పదం ప్రత్యేకంగా నైలు నదికి సంబంధించిన జలమార్గాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְתִּי
  choice: తవ్వి
  rationale: ఈ సందర్భంలో క్రియ నీటి వనరులను, బహుశా బావులను, తవ్వడాన్ని సూచిస్తుంది. మూలంలో లేని ‘బావులు’ అనే కర్మను చేర్చకుండా సంక్షిప్తమైన ప్రగల్భాన్ని నిలుపుతుంది.
- source_word: מַיִם זָרִים
  choice: పరదేశపు నీళ్లు
  rationale: זָרִים అంటే ‘పరాయి/విదేశీ.’ జయించిన ఇతర దేశాల్లో లభించిన నీళ్లు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַחְרִב
  choice: ఎండగొడతాను
  rationale: חרב హిఫీల్ రూపం ‘ఎండిపోయేలా చేయడం’ అని అర్థం; కర్మ జలమార్గాలు కావడంతో ఇది సందర్భానికి నేరమైన అర్థం.
- source_word: בְּכַף פְּעָמַי
  choice: నా అరికాళ్లతో
  rationale: పాదాలకు సంబంధించిన כַּף పాదం అడుగుభాగాన్ని, అంటే అరికాలిని, సూచిస్తుంది. జలమార్గాలను తొక్కి ఎండగొట్టగలననే అతిశయోక్తి చిత్రాన్ని కాపాడుతుంది.
- source_word: יְאֹרֵי
  choice: జలమార్గాలు
  rationale: יְאֹרֵי నదీపాయలు, కాలువలు, ముఖ్యంగా నైలు నదికి సంబంధించిన జలమార్గాలను సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన పదాన్ని ఉంచి, నిర్దిష్ట నైలు భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: מָצוֹר
  choice: ఐగుప్తు
  rationale: יְאֹרֵיతో కలిసిన ఈ సందర్భంలో מָצוֹרను ఐగుప్తుకు కవితాత్మక నామంగా గ్రహించడం సముచితం; భౌగోళిక సూచనను పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: אֲנִי
  choice: నేనే
  rationale: వ్యక్తమైన సర్వనామంలోని ఉద్ఘాటనను, రాజు తన శక్తిని గర్వంగా ప్రకటిస్తున్న ధోరణిని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: మొదటి పురుష వాక్యానికి వక్త, వాక్చాతుర్య బలం
  choice: వివరణాత్మక వ్యాఖ్యను ప్రధాన పాఠంలో చేర్చకుండా, గర్వంతో కూడిన రాజప్రగల్భంగా అనువదించడం
  alternative: ‘అష్షూరు రాజు’ అని వక్తను పాఠంలోనే స్పష్టంగా చేర్చడం లేదా దీనిని కేవలం సైనిక అతిశయోక్తిగా వివరించడం
  rationale: సందర్భంలో ఇది అష్షూరు రాజు పలికిన ప్రగల్భం. మూలంలోని మొదటి పురుష ఉద్ఘాటనను, అతిశయోక్తి చిత్రాన్ని యథాతథంగా ఉంచి, దాని మీద ప్రత్యేకమైన ధార్మిక వ్యాఖ్యానాన్ని రుద్దకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండేలా రూపొందించబడింది. ‘నేనే’ అనే ఉద్ఘాటన, ‘అరికాళ్లతో’ అనే స్పష్టమైన దృశ్యరూపం రాజు ప్రగల్భ స్వరాన్ని నిలుపుతాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘జలమార్గాలు’ పదబంధం వద్ద ఉంచబడింది.
