  variant: modern standard Telugu
source:
  edition: WLC
  text: אַיּ֤/וֹ מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: te
  text: హమాతు రాజు, అర్పాదు రాజు, సెఫర్వయీము పట్టణపు రాజు, హేనా, ఇవ్వా[a] ఎక్కడ ఉన్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “హేనా, ఇవ్వా” అనే పేర్లు ముందున్న “సెఫర్వయీము పట్టణపు రాజు”తో ఎలా అనుసంధానమవుతాయో స్పష్టంగా లేదు; వాటిని ప్రత్యేక స్థలాలుగా కూడా అర్థం చేసుకోవచ్చు.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַיּוֹ
  choice: ఎక్కడ ఉన్నారు?
  rationale: ఇది ప్రస్తుతం వారి జాడ లేదా గతి ఏమైందని ఎగతాళిగా అడిగే ప్రశ్న. హెబ్రీలో రూపం ఏకవచనమైనా, తెలుగు వాక్యంలో పలువురు రాజుల జాబితాకు అనుగుణంగా బహువచనం సహజంగా ఉంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: సాధారణ అర్థాన్ని తీసుకుని, మూలంలోని మూడుసార్ల పునరుక్తిని నిలిపాం.
- source_word: חֲמָת
  choice: హమాతు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַרְפָּד
  choice: అర్పాదు
  rationale: స్థలనామాన్ని తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: לָעִיר סְפַרְוָיִם
  choice: సెఫర్వయీము పట్టణపు
  rationale: לָעִיר అనే నిర్మాణంలోని ‘పట్టణం’ అనే పదాన్ని విడిచిపెట్టకుండా, రాజుతో దాని సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: הֵנַע
  choice: హేనా
  rationale: స్థలనామాన్ని హెబ్రీ వ్యంజన నిర్మాణానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְעִוָּה
  choice: ఇవ్వా
  rationale: మరొక స్థలనామంగా లిప్యంతరీకరించి, ముందున్న జాబితాతో కలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే ప్రశ్నారూపం వాడాం. మూలంలోని రాజుల వరుసను నిలిపి, తెలుగు వ్యాకరణానికి తగిన బహువచన క్రియను ఉపయోగించాం.
