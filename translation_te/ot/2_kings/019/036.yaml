  text: So Sennacherib king of Assyria departed and went and returned, and he lived in Nineveh.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజైన సన్హెరీబు బయలుదేరి వెళ్లి తిరిగి వచ్చి, నీనెవెలో నివసించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: అక్కడి నుంచి బయలుదేరి వెళ్లి, ... తిరిగి వచ్చి
  rationale: మూడు వరుస క్రియల కదలికను నిలుపుతూ, తెలుగులో సహజంగా వినిపించేలా ‘అక్కడి నుంచి’ను సందర్భానుసారంగా చేర్చాం; ‘తిరిగి వచ్చి’ గమ్యస్థానమైన నీనెవెతో సహజంగా అనుసంధానమవుతుంది.
- source_word: וַיֵּשֶׁב
  choice: అక్కడ నివసించాడు
  rationale: ఈ సందర్భంలో యషב్ అంటే కేవలం కూర్చోవడం కాదు, ఒక చోట ఉండడం/నివసించడం. ‘నివసించాడు’ మూలార్థాన్ని గౌరవంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנִינְוֵה
  choice: నీనెవెకు ... అక్కడ
  rationale: హీబ్రూలో ‘నీనెవెలో’ అని ఉన్న స్థానార్థాన్ని తెలుగులో తిరిగివచ్చే గమ్యస్థానంగా ముందుకు తీసుకువచ్చి, తరువాత ‘అక్కడ నివసించాడు’ అని సహజ వాక్యక్రమంలో వ్యక్తపరిచాం.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజైన సన్హెరీబు
  rationale: వ్యక్తి పేరు మరియు రాజపదవిని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన విశేషణ నిర్మాణంతో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ వరుస క్రియల భావాన్ని కాపాడుతూ అనవసరమైన పునరుక్తిని తగ్గించాం.
