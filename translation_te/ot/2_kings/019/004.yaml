source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: te
  text: ఒకవేళ నీ దేవుడైన యాహ్వే, తన యజమానియైన అష్షూరు రాజు సజీవుడైన దేవుణ్ణి దూషించడానికి[b] పంపిన రబ్షాకే[a] మాటలన్నిటినీ వింటాడేమో; నీ దేవుడైన యాహ్వే విన్న మాటలను బట్టి గద్దిస్తాడేమో. కాబట్టి ఇంకా మిగిలి ఉన్న శేషం తరఫున ప్రార్థించు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రబ్షాకే” అనేది బహుశా అష్షూరు రాజసభలోని ఒక అధికార బిరుదు; కొందరు దీనిని “ప్రధాన పానదాయకుడు” అని అర్థం చేసుకుంటారు.
    reason: cultural_note
  - marker: b
    text: “దూషించడానికి” అనే మాటకు “నిందించడానికి,” “ధిక్కరించడానికి,” లేదా “ఎగతాళి చేయడానికి” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ నుడికారం అక్షరార్థంగా “ప్రార్థనను ఎత్తు”; భావం “ప్రార్థన అర్పించు” లేదా “ప్రార్థించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: ఒకవేళ
  rationale: ఇది నిశ్చయాన్ని కాక ఆశతో కూడిన సాధ్యతను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఇది వివాదాస్పదమైన అష్షూరు అధికార బిరుదు; ప్రధాన పాఠ్యంలో నిర్దిష్ట పదవిని ఊహించకుండా ధ్వన్యంతరీకరించబడింది.
- source_word: לְחָרֵף
  choice: దూషించడానికి
  rationale: సజీవుడైన దేవునిపై పలికిన అవమానకరమైన, ధిక్కారపూర్వకమైన మాటల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: ఆ మాటలను బట్టి గద్దించవచ్చు
  rationale: హీబ్రూ పాఠ్యంలో గద్దింపుకు స్పష్టమైన కర్మ లేదు; కాబట్టి ‘అతణ్ణి’ లేదా ‘ఆ మాటలను’ కర్మగా చేర్చకుండా అస్పష్టతను నిలిపింది.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: ప్రార్థించు
  rationale: అక్షరార్థంగా ‘ప్రార్థనను ఎత్తు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ఆజ్ఞగా అందించింది; అక్షరార్థ రూపాన్ని పాదసూచికలో తెలిపింది.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: ఇంకా మిగిలి ఉన్న శేషం
  rationale: ప్రాణాలతో మిగిలినవారనే సందర్భార్థాన్నీ, ‘శేషం’ అనే కీలక బైబిలు పదాన్నీ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది; బిరుదుతో భర్తీ చేయకుండా దానిని ధ్వన్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: וְהוֹכִיחַ లో గద్దింపుకు సంబంధించిన కర్మ
  choice: స్పష్టమైన కర్మను చేర్చకుండా ‘ఆ మాటలను బట్టి గద్దించవచ్చు’
  alternative: ‘అతణ్ణి గద్దించవచ్చు’; ‘ఆ మాటలను ఖండించవచ్చు’
  rationale: హీబ్రూలో కర్మ స్పష్టంగా లేదు. వ్యక్తిని గద్దించడమా, మాటలను ఖండించడమా అనే సాధ్యమైన భావాలను ప్రధాన పాఠ్యం ముందుగానే నిర్ణయించదు.
- issue: הַשְּׁאֵרִית యొక్క అనువాదం
  choice: శేషం
  alternative: మిగిలినవారు; ప్రాణాలతో బయటపడినవారు
  rationale: ఈ సందర్భంలో ఇంకా మిగిలి ఉన్న ప్రజలను సూచిస్తూనే, మూలంలోని కీలక పదానికి ఉన్న విస్తృత బైబిలు ప్రతిధ్వనిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నీ దేవుడైన యాహ్వే’ అనే పునరుక్తిని మూలపాఠ్యానికి అనుగుణంగా నిలిపాం. అస్పష్టమైన హీబ్రూ కర్మను తెలుగులో అదనంగా చేర్చలేదు.
