source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: te
  text: “ఇదిగో, నేను అతనిలో ఒక ఆత్మను[a] ఉంచుతున్నాను. అతడు ఒక వార్తను[b] విని తన దేశానికి తిరిగి వెళ్తాడు. అతను తన దేశంలోనే ఖడ్గం చేత పడిపోయేలా నేను చేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక మనోవైఖరిని” లేదా “ఒక ప్రేరణను”; హీబ్రూ పదానికి “గాలి,” “శ్వాస” అనే అర్థాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒక సమాచారం” లేదా “ఒక పుకారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: దేవుని ప్రకటనవైపు దృష్టిని ఆకర్షించే హీబ్రూ పదబంధపు బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: נֹתֵן
  choice: ఉంచుతున్నాను
  rationale: הִנְנִי తరువాత ఉన్న కృదంతం సమీపంలో జరగబోయే చర్యను సజీవంగా తెలియజేస్తుంది; వర్తమాన రూపం ఆ తక్షణత్వాన్ని కాపాడుతుంది.
- source_word: רוּחַ
  choice: ఒక ఆత్మను
  rationale: ఇక్కడ ఈ పదం రాజును ప్రభావితం చేసే అంతర్గత ప్రేరణను లేదా దేవుడు పంపిన ఆత్మను సూచించవచ్చు. ‘ఆత్మ’ మూలపదపు విస్తృతార్థాన్నీ, కార్యవిధానంలోని అస్పష్టతనూ నిలుపుతుంది.
- source_word: וְשָׁמַע
  choice: అతడు ... విని
  rationale: దేవుని చర్య తరువాత జరిగే ఫలితాల క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שְׁמוּעָה
  choice: ఒక వార్తను
  rationale: ఈ నామవాచకం వార్త, సమాచారం లేదా పుకారు అనే అర్థాలు ఇవ్వగలదు. ‘వార్త’ నిజానిజాలను ముందుగానే నిర్ణయించకుండా విస్తృతమైన అర్థాన్ని ఇస్తుంది.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: తన దేశానికి తిరిగి వెళ్తాడు
  rationale: ‘తిరిగి వెళ్లడం’ అనే దిశార్థాన్నీ, సర్వనామ ప్రత్యయంతో వ్యక్తమైన అతని స్వదేశ భావాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְהִפַּלְתִּיו
  choice: అతడు ... పడిపోయేలా చేస్తాను
  rationale: נפל యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది; ‘చంపుతాను’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: בַּחֶרֶב
  choice: ఖడ్గం చేత
  rationale: హింసాత్మక మరణానికి సాధనాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని గౌరవప్రదమైన బైబిలు తెలుగులో అందిస్తుంది.
- source_word: בְּאַרְצוֹ
  choice: అతని దేశంలోనే
  rationale: అతని పతనం అతని స్వదేశంలోనే జరుగుతుందనే వ్యంగ్యభరితమైన ఉద్ఘాటనను ‘నే’ ద్వారా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పు ప్రకటనలో רוּחַ అర్థం
  choice: ఒక ఆత్మను
  alternative: ఒక మనోవైఖరిని / ఒక ప్రేరణను / ఒక గాలిని
  rationale: సందర్భంలో యెహోవా అష్షూరు రాజు స్పందనను నిర్దేశించి, అతడు వార్త విని వెనుదిరిగేలా చేస్తున్నాడు. ‘ఆత్మ’ అని అనువదించడం దేవుని సార్వభౌమ చర్యను తెలియజేస్తూనే, అది ఏ విధంగా పనిచేస్తుందో అతిగా నిర్వచించకుండా హీబ్రూ పదంలోని ఉద్దేశపూర్వక విస్తృతార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణంతో పాటు దైవవాక్యానికి తగిన గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ఖడ్గం చేత’ అనే రూపం మూలంలోని సాధనార్థాన్ని నిలుపుతుంది. సంప్రదింపుల ఆంగ్ల పాఠంలో పాదసూచిక గుర్తులు వాటి పదాలకు సరిపోని స్థానాల్లో కనిపించినందున, తెలుగు ప్రధాన పాఠంలో [a]ను ‘ఆత్మను’ తరువాత, [b]ను ‘వార్తను’ తరువాత ఉంచి వాటి విషయాలకు సరిచేయబడింది.
