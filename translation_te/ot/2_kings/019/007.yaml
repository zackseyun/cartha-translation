  to: “ఇదిగో, నేను అతనిలో ఒక ఆత్మను[a] ఉంచుతున్నాను. అతడు ఒక వార్తను[b] విని తన దేశానికి తిరిగి వెళ్తాడు. అతను తన దేశంలోనే ఖడ్గం చేత పడిపోయేలా నేను చేస్తాను.”
