  to: అయితే నీ కూర్చోవడం[a], నీ బయలుదేరడం, నీ లోపలికి రావడం, నాపై నీవు రగిలిపోవడం[b] నాకు తెలుసు.
  rationale: The revision retains every source element and the Hebrew idiom while placing all its objects under one final ‘నాకు తెలుసు,’ as in the Hebrew. It also makes the alternative renderings in the footnote grammatically and semantically natural in Telugu.
