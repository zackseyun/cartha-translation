  edition: WLC
  text: וְ/שִׁבְתְּ/ךָ֛ וְ/צֵאתְ/ךָ֥ וּ/בֹאֲ/ךָ֖ יָדָ֑עְתִּי וְ/אֵ֖ת הִֽתְרַגֶּזְ/ךָ֥ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: te
  text: అయితే నీ కూర్చోవడం[a], నీ బయలుదేరడం, నీ లోపలికి రావడం, నాపై నీవు రగిలిపోవడం[b] నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ కూర్చోవడం, నీ బయలుదేరడం, నీ లోపలికి రావడం’ అనేది ఒక వ్యక్తి కదలికలు, కార్యకలాపాలు, ప్రవర్తన మొత్తం సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘నాపై నీ ఆందోళన’ లేదా ‘నాపై నీ ఉగ్రత.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: నీవు కూర్చోవడం
  rationale: ישׁב అనే మూలపదంలోని స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతుంది. ‘బయలుదేరడం, లోపలికి రావడం’తో కలసి ఇది వ్యక్తి కదలికలు, నివాసం, ప్రవర్తన మొత్తాన్ని సూచించే హీబ్రూ నుడికారంలో భాగం.
- source_word: וְצֵאתְךָ
  choice: నీవు బయలుదేరడం
  rationale: יצא అనే మూలపదానికి సహజమైన ఆధునిక తెలుగు రూపం; తరువాతి ‘లోపలికి రావడం’తో జతగా ఉన్న భావాన్ని నిలుపుతుంది.
- source_word: וּבֹאֲךָ
  choice: నీవు లోపలికి రావడం
  rationale: בוא అనే మూలపదాన్ని, ‘బయలుదేరడం’తో సమతూకంగా ఉన్న హీబ్రూ జంట నుడికారాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יָדָעְתִּי
  choice: నాకు తెలుసు
  rationale: Qal perfect 1cs ఇక్కడ దేవుని స్థిరమైన, సంపూర్ణ జ్ఞానాన్ని సూచిస్తుంది; తెలుగులో వర్తమాన స్థితిని తెలిపే ‘నాకు తెలుసు’ సహజంగా ఉంది.
- source_word: הִתְרַגֶּזְךָ
  choice: నీవు రగిలిపోవడం
  rationale: Hitpael రూపంలోని ఆందోళన, ఉగ్రత, రౌద్రావేశం అనే భావాలను సందర్భానుకూలంగా తెలియజేస్తుంది; ‘దురహంకారం’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: אֵלַי
  choice: నాపై
  rationale: אל సాధారణంగా ‘వైపు’ అని అర్థమైనా, శత్రుత్వంతో కూడిన రగులుదల సందర్భంలో తెలుగులో ‘నాపై’ ప్రత్యర్థ భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: וְאֵת
  choice: కూడా
  rationale: సంయోజక అవ్యయం మరియు కర్మసూచకం ‘నాకు తెలుసు’ అనే క్రియకు చివరి కర్మను జోడిస్తున్నాయి; తెలుగులో ‘కూడా’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
