translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘కూర్చోవడం—బయలుదేరడం—లోపలికి రావడం’ అనే స్పష్టమైన నుడికారాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా నిలిపి, הִתְרַגֶּזְךָ పదంలోని ఆందోళన/ఉగ్రత అర్థవిస్తృతిని పాదసూచికలో భద్రపరిచాం.
