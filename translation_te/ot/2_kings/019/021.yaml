    issue: Divine-name form differs from the provided Yahweh policy and English audit trail
    rationale: “యెహోవా” represents the traditional Jehovah vocalization, whereas the stated translation decision is Yahweh. “యహ్వే” is the corresponding Telugu transliteration.
