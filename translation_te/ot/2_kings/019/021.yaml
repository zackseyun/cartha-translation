id: 2KI.19.21
reference: 2 Kings 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: te
  text: 'యహ్వే అతని గురించి పలికిన మాట ఇదే:


    “కన్యకయైన సీయోను కుమార్తె నిన్ను తృణీకరిస్తోంది;

    నిన్ను ఎగతాళి చేస్తోంది.


    నీ వెనుక యెరూషలేము కుమార్తె

    తల ఊపుతోంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తల ఊపడం” ఇక్కడ తృణీకారం లేదా ఎగతాళిని వ్యక్తం చేసే సంజ్ఞ.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: మాట
  rationale: ప్రవచన పరిచయ సూత్రంలో దైవిక ఉక్తిని సూచించే సహజమైన, పారదర్శకమైన తెలుగు పదం.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: యెహోవా అతని గురించి పలికిన
  rationale: עַל ఇక్కడ ప్రవచనపు విషయాన్ని, అంటే ‘అతని గురించి’, సూచిస్తుంది; సందర్భంలోని ప్రతికూలతను ‘అతనికి విరోధంగా’ అని వ్యాకరణంలోకి అదనంగా చేర్చలేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపింది.
- source_word: בָּזָה
  choice: తృణీకరిస్తోంది
  rationale: అవహేళనతో అలక్ష్యం చేయడం అనే బలమైన భావాన్ని ఆధునిక గౌరవప్రద తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָעֲגָה
  choice: ఎగతాళి చేస్తోంది
  rationale: హేళన చేయడం లేదా పరిహసించడం అనే అర్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: కన్యకయైన సీయోను కుమార్తె
  rationale: నగరాన్ని స్త్రీగా వ్యక్తీకరించే కవితాత్మక బిరుదులోని ‘కన్యక’ మరియు ‘కుమార్తె’ అనే రెండు అంశాలనూ నిలుపుతుంది.
- source_word: אַחֲרֶיךָ
  choice: నీవు వెళ్లిపోతుండగా నీ వెనుక
  rationale: శత్రువు వెనుదిరిగి వెళ్లే దృశ్యాన్ని సందర్భం స్పష్టం చేస్తుంది; ‘నీ వెనుక’ అనే స్థలార్థాన్ని యథాతథంగా ఉంచింది.
- source_word: רֹאשׁ הֵנִיעָה
  choice: తల ఊపుతోంది
  rationale: హీబ్రూ శరీరభాషను నేరుగా నిలిపి, దాని సాంస్కృతిక భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: בַּת יְרוּשָׁלִָם
  choice: యెరూషలేము కుమార్తె
  rationale: నగర వ్యక్తీకరణను, సీయోను కుమార్తెతో ఉన్న కవితాత్మక సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో అందించింది.
- issue: కన్యకయైన సీయోను కుమార్తె అనే వ్యక్తీకరణ
  choice: ‘కన్యక’ అనే మూల చిత్రాన్ని నిలిపివేయడం
  alternative: సీయోను యువతి
  rationale: בְּתוּלַת అనే పదంలో ఉన్న కన్యత్వ/అస్పృశ్యత చిత్రాన్ని సున్నితపరచకుండా, నగర వ్యక్తీకరణలోని కవితాత్మక ఉద్రిక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన-కవితా శైలిని ఉపయోగించింది. సీయోను, యెరూషలేములను కుమార్తెలుగా వ్యక్తీకరించే హీబ్రూ సమాంతరతను నిలిపి, క్రియలను ప్రత్యక్ష హేళనకు తగిన వర్తమాన రూపంలో అందించింది.
