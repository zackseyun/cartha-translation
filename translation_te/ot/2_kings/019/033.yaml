  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: te
  text: అతడు ఏ దారిన వచ్చాడో[a], ఆ దారినే తిరిగి వెళ్తాడు; ఈ పట్టణానికి రాడు—యాహ్వే ఇలా ప్రకటిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సంక్షిప్తంగా, “అతడు వచ్చిన దారినే తిరిగి వెళ్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: అతడు ఏ దారిన వచ్చాడో, ఆ దారినే
  rationale: దֶּרֶךְ అంటే ‘దారి/మార్గం.’ בָּהּ ఆ దారినే తిరిగి ప్రయాణించడాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో సంబంధవాచక–సహసంబంధ రూపం హెబ్రీ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יָשׁוּב
  choice: తిరిగి వెళ్తాడు
  rationale: ఇక్కడ שׁוּב వచ్చిన మార్గాన వెనక్కి వెళ్లడాన్ని సూచిస్తుంది; ‘తిరిగి వెళ్తాడు’ సందర్భానికి సహజమైన ఆధునిక తెలుగు.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: ఈ పట్టణానికి రాడు
  rationale: אֶל గమ్యాన్ని సూచిస్తుంది. మూలంలో ‘పట్టణంలోకి ప్రవేశించడు’ అనే మరింత బలమైన పదం లేనందున ‘పట్టణానికి రాడు’ అని అనువదించాం.
- source_word: נְאֻם יְהוָה
  choice: ఇది యాహ్వే ప్రకటన
  rationale: נְאֻם ప్రవచనపరమైన అధికార ప్రకటన సూత్రం. יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన టెట్రాగ్రామటన్ నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ఆధునికంగా ఆమోదితమైన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా ఇచ్చాం.
- issue: రాజు పట్టణంలోకి ప్రవేశించడా, పట్టణం వద్దకు రావడా
  choice: ఈ పట్టణానికి రాడు
  alternative: ఈ పట్టణంలోకి రాడు
  rationale: హెబ్రీ אֶל ... לֹא יָבֹא అక్షరార్థంగా పట్టణం వైపు/పట్టణానికి రాకపోవడాన్ని చెబుతుంది. సందర్భం ప్రవేశాన్ని సూచించగలిగినా, మూలంలోని విస్తృత భావాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన ప్రవచన శైలిని ఉపయోగించాం. ‘ఏ దారిన… ఆ దారినే’ నిర్మాణం మూలంలోని పునరుక్తిని, అదే మార్గంలో తిరుగు ప్రయాణం అనే బలాన్ని నిలుపుతుంది.
