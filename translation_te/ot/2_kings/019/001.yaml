source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: te
  text: రాజైన హిజ్కియా అది విన్నప్పుడు, తన బట్టలు చించుకొని, గోనెపట్టను కప్పుకొని, యాహ్వే మందిరంలోకి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అని యాంత్రికంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: హిజ్కియా రాజు
  rationale: పేరు తరువాత బిరుదు ఉంచడం తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: తన బట్టలు చింపుకొని
  rationale: శోక సూచక చర్యను సాధారణ పాఠకులకు స్పష్టమైన ప్రస్తుత తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: గోనెపట్ట కప్పుకొని
  rationale: హిత్పయేల్ రూపంలోని స్వప్రయోజక భావాన్ని ‘కప్పుకొని’ తెలియజేస్తుంది; שַׂק అనేది శోకంలో ధరించే ముతక వస్త్రాన్ని సూచిస్తుంది.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: యెహోవా మందిరంలోకి వెళ్లాడు
  rationale: בוא తో కూడిన గమ్యార్థాన్ని ‘లోకి వెళ్లాడు’ నిలుపుతుంది. ‘యెహోవా ఇల్లు’ కంటే ‘యెహోవా మందిరం’ ఆధునిక తెలుగులో ఆలయాన్ని సహజంగా, నిర్ద్వంద్వంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు. తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నప్పటికీ, మూల ఉచ్చారణపై ఉన్న చర్చను సిద్ధాంతపరంగా పరిష్కరించినట్లు భావించరాదు.
- issue: בֵּית יְהוָה అనే ఆలయ ప్రయోగం
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: ఇక్కడ ‘ఇల్లు’ యెరూషలేము ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ఏ ప్రత్యేక సంఘపరమైన అర్థాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. వరుసగా జరిగిన శోకచర్యలను ‘చింపుకొని, కప్పుకొని’ అనే సమాంతర క్రియారూపాలతో సంక్షిప్తంగా నిలిపింది. పాదసూచికలు అవసరం లేదు.
