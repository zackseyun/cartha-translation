  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: te
  text: యూదా ఇంటికి చెందిన, తప్పించుకొని మిగిలిన శేషం మళ్లీ కిందికి వేర్లు వేస్తుంది, పైకి ఫలాన్ని ఇస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా ఇంటికి చెందిన మిగిలి ఉన్న శేషం.”
    reason: פְּלֵיטַת మరియు הַנִּשְׁאָרָה కలయికను ‘తప్పించుకొని మిగిలిన’ అని, లేదా సంక్షిప్తంగా ‘మిగిలి ఉన్న శేషం’ అని వ్యక్తీకరించవచ్చు.
lexical_decisions:
- source_word: וְיָסְפָה
  choice: మళ్లీ
  rationale: יסף ఇక్కడ తదనంతర క్రియ మళ్లీ లేదా కొనసాగింపుగా జరగడాన్ని సూచిస్తుంది. పునరుద్ధరణ సందర్భంలో ‘మళ్లీ’ సహజంగా సరిపోతుంది.
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: తప్పించుకొని మిగిలిన శేషం
  rationale: פְּלֵיטָהలోని విపత్తు నుండి తప్పించుకొని బతికిన భావాన్నీ, הַנִּשְׁאָרָהలోని మిగిలి ఉన్న భావాన్నీ కలిపి నిలుపుతుంది; ‘శేషం’ సమూహాన్ని ఏకవచనంగా చూపుతుంది.
- source_word: בֵּית יְהוּדָה
  choice: యూదా ఇంటివారిలో
  rationale: ‘యూదా ఇల్లు’ అనే హీబ్రూ వంశ-సమూహ సూచనను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: కిందికి వేర్లు పాతుకొని
  rationale: మూలపాఠంలోని వేరు మరియు దిగువ దిశ చిత్రాన్ని సహజమైన తెలుగు వ్యవసాయ రూపకంగా నిలుపుతుంది.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: పైకి ఫలిస్తుంది
  rationale: ‘ఫలం చేయడం’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ‘ఫలించడం’గా అందిస్తూ, కిందికి/పైకి అనే కవితాత్మక వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పునరుద్ధరణ ప్రవచనంలోని శేషం భావం
  choice: తప్పించుకొని మిగిలిన శేషం
  alternative: మిగిలి ఉన్నవారు / తప్పించుకున్నవారు
  rationale: తీర్పు తరువాత దేవుని ప్రజల్లో ఒక సమూహం నిలిచి మళ్లీ వృద్ధి చెందుతుందనే రూపకాన్ని కాపాడుతుంది; తరువాతి సిద్ధాంతార్థాలను వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కిందికి వేర్లు—పైకి ఫలం’ అనే సమతుల్య రూపక నిర్మాణం నిలుపబడింది.
