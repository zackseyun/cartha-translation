reference: 2 Kings 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: te
  text: 'యెషయా వారితో ఇలా అన్నాడు: “మీ యజమానికి ఇలా చెప్పండి: ‘యాహ్వే ఇలా అంటున్నాడు: అష్షూరు రాజు సేవకులు[a] నన్ను దూషిస్తూ పలికిన, నువ్వు విన్న మాటలను బట్టి భయపడకు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అష్షూరు రాజు యువకులు.” హీబ్రూ పదం యువకులను సూచించగలదు; అయితే ఇక్కడ అది రాజ పరిచారకులను లేదా అధికారులను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన శైలిలోని సాధారణ భూతకాల వాక్యాన్ని సహజమైన ఆధునిక తెలుగు కథన రూపంలో వ్యక్తపరుస్తుంది.
- source_word: אֲדֹנֵיכֶם
  choice: మీ యజమాని
  rationale: ఇది సందేశవాహకుల అధిపతియైన హిజ్కియాను సూచిస్తుంది; దేవునికి వాడే బిరుదుతో గందరగోళం కలగకుండా సామాజిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: אַל־תִּירָא
  choice: భయపడకు
  rationale: నిషేధార్థక ఆజ్ఞలోని దైవిక ధైర్యవచనాన్ని సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: మాటలను బట్టి
  rationale: ఈ సందర్భంలో భయానికి కారణమైన పలుకులను సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שָׁמַעְתָּ
  choice: నువ్వు విన్న
  rationale: ఇప్పుడే ప్రాసంగికంగా ఉన్న పూర్తయిన వినికిడి చర్యను తెలుగు సంబంధ క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: גִּדְּפוּ
  choice: దూషించారు
  rationale: దేవునికి వ్యతిరేకంగా పలికిన అవమానకరమైన, అపవిత్రమైన మాటల తీవ్రతను తెలియజేస్తూనే, మూలపదంలోని ‘తిట్టడం/దూషించడం’ భావపరిధిని అనవసరంగా కుదించదు.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు సేవకులు
  rationale: נַעַר పదం యువకులను సూచించగలిగినా, ఇక్కడ రాజు తరఫున వచ్చిన పరిచారకులు లేదా అధికారులను సూచించే రాజసభా ప్రయోగంగా ‘సేవకులు’ సందర్భానికి సరిపోతుంది.
- source_word: אֹתִי
  choice: నన్ను
  rationale: అవమానం నేరుగా యాహ్వేకే చేయబడిందనే వ్యక్తిగత లక్ష్యాన్ని మూలంలాగే స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలుపుతుంది.
- issue: גִּדְּפוּ పదంలోని తీవ్రత
  choice: నన్ను దూషించారు
  alternative: నన్ను దేవదూషణ చేశారు
  rationale: దేవుడే ప్రత్యక్ష కర్మగా ఉండటం వల్ల అపవిత్ర దూషణ భావం సందర్భంలో స్పష్టమవుతుంది. ‘దూషించారు’ మూలంలోని అవమానించడం, నిందించడం అనే భావపరిధిని కాపాడి, తెలుగులో అసహజమైన నిర్మాణాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. సందేశవాహకులను ఉద్దేశించిన బహువచన ‘చెప్పండి’తోను, హిజ్కియాను ఉద్దేశించిన ఏకవచన ‘నువ్వు/భయపడకు’తోను మూలంలోని వచన భేదం నిలుపబడింది. మూలంలోని ప్రత్యక్ష వాక్యాల పొరలను తెలుగు విరామచిహ్నాలతో స్పష్టంగా చూపించాం.
