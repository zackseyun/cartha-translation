  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని సంఘటనల క్రమాన్ని నిలిపి, తెలుగు పాఠకులకు సహజంగా ఉండే ఉపవాక్య నిర్మాణాన్ని వాడాం; మూలంలో లేని బంధుత్వ సమాచారాన్ని హంతకుల పేర్లకు జోడించలేదు.
