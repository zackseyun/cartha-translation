source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: te
  text: అప్పుడు అతడు తన దేవుడైన నిస్రోక్[a] ఆలయంలో ఆరాధిస్తూ ఉండగా, అద్రమ్మెలెకూ శరెజెరూ అతన్ని కత్తితో హతమార్చారు. వారు అరారాతు దేశానికి తప్పించుకుపోయారు. అతని కుమారుడు ఏసర్-హద్దోన్ అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘నిస్రోక్’; సంప్రదాయ అనువాదాల్లో ‘నిస్రోకు’ అని కూడా ఉంది.'
    reason: దైవనామానికి నేర లిప్యంతరీకరణను ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ రూపాన్ని ప్రత్యామ్నాయంగా తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי הוּא מִשְׁתַּחֲוֶה
  choice: అతడు … పూజిస్తూ ఉండగా
  rationale: הוּא తో కూడిన participle కొనసాగుతున్న చర్యను సూచిస్తుంది; ఆరాధనా సందర్భంలో שׁחה అంటే కేవలం వంగడం కాక పూజించడం. וַיְהִי యొక్క కథన ప్రవాహాన్ని సహజమైన తెలుగు ఉపవాక్య నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: తన దేవుడైన నిస్రోక్ ఆలయంలో
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా దేవునికి సంబంధించిన ఆరాధనా స్థల సందర్భంలో తెలుగు ‘ఆలయం’ సహజంగా, స్పష్టంగా ఉంటుంది. אֱלֹהָיו లోని ఏకవచన స్వామ్య భావాన్ని ‘తన దేవుడైన’గా నిలిపాం.
- source_word: וְאַדְרַמֶּלֶךְ וְשַׂרְאֶצֶר
  choice: అద్రమ్మెలెకూ శరెజెరూ
  rationale: హీబ్రూ పేర్లను తెలుగులో ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; వాక్యకర్తలైన రెండు పేర్లను తెలుగు సముచ్చయ రూపంతో కలిపాం.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: అతన్ని కత్తితో హతమార్చి
  rationale: נכה యొక్క ‘కొట్టు/దెబ్బతీయు’ భావం ఈ సందర్భంలో మరణానికి దారితీసినదని స్పష్టంగా ఉంది. ‘హతమార్చి’ ఫలితాన్ని సహజంగా తెలియజేస్తూ, בַחֶרֶב లోని సాధనార్థాన్ని ‘కత్తితో’గా ఉంచుతుంది.
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  choice: అరారాతు దేశానికి తప్పించుకుపోయారు
  rationale: נמלט నిఫాల్ రూపం విజయవంతంగా తప్పించుకోవడాన్ని సూచిస్తుంది; గమ్యాన్ని తెలుగు దత్తివిభక్తితో సహజంగా తెలిపాం.
- source_word: וַיִּמְלֹךְ אֵסַר חַדֹּן בְּנוֹ תַּחְתָּיו
  choice: అతని కుమారుడు ఏసర్-హద్దోన్ అతని స్థానంలో రాజయ్యాడు
  rationale: מלך ఇక్కడ రాజ్య వారసత్వాన్ని సూచిస్తున్నందున ‘రాజయ్యాడు’ సహజమైనది; תַּחְתָּיו ను నేరుగా ‘అతని స్థానంలో’గా అనువదించాం.
