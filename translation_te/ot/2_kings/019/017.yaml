  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: te
  text: నిజంగా[a], యాహ్వే, అష్షూరు రాజులు జనాంగాలను, వారి దేశాలను[b] పాడుచేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిజమే’ లేదా ‘నిశ్చయంగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘వారి దేశం’ అని ఏకవచనంలో ఉంది; ఇక్కడ అది ప్రతి జనాంగానికి చెందిన దేశాన్ని సమష్టిగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: నిజంగా
  rationale: ముందు చెప్పబడిన మాట వాస్తవమేనని బలంగా అంగీకరించే ప్రారంభ పదంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: הֶחֱרִיבוּ
  choice: పాడుచేశారు
  rationale: యుద్ధం వల్ల దేశాలను శిథిలం చేసి నిర్జనంగా మార్చిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַלְכֵי אַשּׁוּר
  choice: అష్షూరు రాజులు
  rationale: హీబ్రూ సమాస సంబంధాన్ని స్పష్టంగా, తెలుగు బైబిలు భౌగోళిక నామరూపానికి అనుగుణంగా అందిస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాంగాలను
  rationale: ఇక్కడ అష్షూరు జయించిన రాజకీయ-జాతి సమూహాలను సూచిస్తుంది; తరువాతి ‘దేశాలు’ అనే పదంతో అనవసర పునరుక్తిని కూడా నివారిస్తుంది.
- source_word: אַרְצָם
  choice: వారి దేశాలను
  rationale: మూలంలో ‘వారి దేశం’ అని ఏకవచనం ఉన్నప్పటికీ, అనేక జనాంగాలలో ప్రతి జనాంగానికి చెందిన దేశాన్ని సూచించే విభాజక/సామూహిక భావాన్ని తెలుగులో బహువచనంతో సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా స్వరాన్ని నిలిపి, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను ఉపయోగించాం. సంబోధనలోని విరామాలను కామాలతో స్పష్టంచేశాం.
