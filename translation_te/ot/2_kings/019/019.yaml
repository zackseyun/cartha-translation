  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: te
  text: 'ఇప్పుడు, మా దేవుడైన యాహ్వే, దయచేసి అతని చేతిలోనుండి[a] మమ్మల్ని రక్షించు. తద్వారా భూమిలోని[b] రాజ్యాలన్నీ యాహ్వే, నీవొక్కడివే దేవుడవని తెలుసుకుంటాయి.


    [a] హీబ్రూ భాషలో అక్షరార్థంగా “అతని చేతిలోనుండి”; అంటే అతని అధికారం లేదా ఆధీనంనుండి.

    [b] “దేశంలోని రాజ్యాలన్నీ” అని కూడా అనువదించవచ్చు. అయితే ఇక్కడ అనేక దేశాల గురించిన సందర్భం ఉన్నందున “భూమిలోని” అనేది తగినది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో అక్షరార్థంగా “అతని చేతిలోనుండి”; అంటే అతని అధికారం లేదా ఆధీనంనుండి.
    reason: cultural_note
  - marker: b
    text: “దేశంలోని రాజ్యాలన్నీ” అని కూడా అనువదించవచ్చు. అయితే ఇక్కడ అనేక దేశాల గురించిన సందర్భం ఉన్నందున “భూమిలోని” అనేది తగినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో తుది విజ్ఞాపనను ప్రవేశపెట్టే కాలసూచక పదం. తెలుగు వాక్యప్రవాహంలో సంధానార్థం సహజంగానే వ్యక్తమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవుడైన
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న ‘మా దేవుడు’ అనే సంబోధనను సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: దయచేసి ... మమ్మల్ని రక్షించు
  rationale: హిఫిల్ ఆజ్ఞార్థక రూపం రక్షణకై విజ్ఞాపనను, נָא ప్రార్థనలోని వినయపూర్వక వేడుకోలును తెలియజేస్తాయి.
- source_word: מִיָּדוֹ
  choice: అతని చేతిలోనుండి
  rationale: అతని శక్తి లేదా ఆధీనంనుండి విడిపించడాన్ని సూచించే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: וְיֵדְעוּ
  choice: తద్వారా ... తెలుసుకుంటాయి
  rationale: ఆజ్ఞార్థక విజ్ఞాపన తరువాత వచ్చే ఈ క్రియ సందర్భంలో ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; ‘తద్వారా’ ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: భూమిలోని రాజ్యాలన్నీ
  rationale: అష్షూరు సహా అనేక దేశాల అంతర్జాతీయ సందర్భంలో הָאָרֶץకు విశాలమైన ‘భూమి’ అర్థం తగినది.
- source_word: כִּי
  choice: అని
  rationale: రాజ్యాలు తెలుసుకోవలసిన విషయాన్ని పరిచయం చేసే పూరకార్థక సంధిగా సహజమైన తెలుగు రూపం.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: యాహ్వే, నీవొక్కడివే దేవుడవని
  rationale: యాహ్వేనే దేవుడని చెప్పే మూలంలోని విధేయ నిర్మాణాన్ని, לְבַדֶּךָ యొక్క ప్రత్యేకతా బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయలేదు; ‘యెహోవా’కన్నా హీబ్రూ నామానికి దగ్గరగా ఉన్న ‘యాహ్వే’ను ఎంచుకుంది.
- issue: לְבַדֶּךָ యొక్క ప్రత్యేకతా భావం
  choice: నీవొక్కడివే దేవుడు
  alternative: నీవు దేవుడవు, నీవు మాత్రమే
  rationale: ఇతర జనాల దేవతలకు భిన్నంగా యాహ్వే మాత్రమే దేవుడనే ఒప్పుకోలును మూలపాఠ్యం నొక్కిచెబుతుంది. తెలుగు రూపం ఆ ప్రత్యేకతను అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: וְיֵדְעוּలో ఉద్దేశం లేదా ఫలితం
  choice: తద్వారా ... తెలుసుకుంటాయి
  alternative: అప్పుడు ... తెలుసుకుంటాయి
  rationale: ఈ సందర్భంలో ప్రార్థనకు ఉద్దేశార్థం మరియు ఫలితార్థం రెండూ సమీపంగా ఉన్నాయి. ‘తద్వారా’ ఉద్దేశాన్ని ముందుకు తెస్తూనే ఫలిత భావాన్ని తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించింది. ‘చేతిలోనుండి’ అనే మూలరూపకాన్ని నిలిపి పాదటిప్పణిలో వివరించింది. దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది; వాక్యాంతంలో ‘నీవొక్కడివే’ ద్వారా ప్రత్యేకతా బలాన్ని స్పష్టంగా ఉంచింది.
