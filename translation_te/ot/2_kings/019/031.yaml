source:
  edition: WLC
  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: te
  text: ఎందుకంటే యెరూషలేము నుండి శేషం బయలుదేరుతుంది; సీయోను పర్వతం నుండి తప్పించుకొని మిగిలినవారు బయలుదేరుతారు. యాహ్వే యొక్క ఆసక్తి[a] దీనిని నెరవేరుస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే యొక్క ఈర్ష్య.’ హీబ్రూ నామవాచకానికి ‘ఆసక్తి’ లేదా ‘ఈర్ష్య’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది యెరూషలేము విడుదలను సాధించాలనే యాహ్వే ప్రగాఢ నిబద్ధతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాగ్దానానికి ఆధారాన్ని, భరోసాను పరిచయం చేసే కారణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִירוּשָׁלִַם
  choice: యెరూషలేములోనుండి
  rationale: מִן సూచించే మూలస్థాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תֵּצֵא
  choice: బయలుదేరుతుంది
  rationale: יצא లోని బయటికి వెళ్లే చలన భావాన్ని నిలుపుతూ, ఏకవచన స్త్రీలింగ కర్త అయిన ‘శేషం’తో సహజంగా సరిపోతుంది.
- source_word: שְׁאֵרִית
  choice: శేషం
  rationale: విపత్తు లేదా తీర్పు తర్వాత మిగిలినవారనే ప్రవచనాత్మక భావాన్ని సంక్షిప్తంగా, సంప్రదాయబద్ధంగా నిలుపుతుంది.
- source_word: וּפְלֵיטָה
  choice: తప్పించుకున్నవారు
  rationale: ప్రమాదం నుంచి తప్పించుకొని జీవించి మిగిలినవారిని సూచించే సమూహార్థక నామవాచక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵהַר צִיּוֹן
  choice: సీయోను కొండలోనుండి
  rationale: యెరూషలేముతో సమాంతరంగా మూలస్థానాన్ని సూచిస్తూ, צִיּוֹן అనే స్థలనామాన్ని నిలుపుతుంది.
- source_word: קִנְאַת
  choice: ఉత్సాహం
  rationale: ఈ సందర్భంలో యాహ్వే తన ప్రజలను విడిపించాలనే ప్రగాఢమైన, కార్యసాధక నిబద్ధతను సూచిస్తుంది; ‘ఈర్ష్య’ అనే ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో నిలిపాము.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: దీనిని నెరవేరుస్తుంది
  rationale: చెప్పిన ఫలితాన్ని కార్యరూపంలోకి తేవడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: קִנְאַת יְהוָה యొక్క భావ ఛాయ
  choice: యాహ్వే ఉత్సాహం
  alternative: యాహ్వే ఈర్ష్య
  rationale: విడుదలను సాధించాలనే యాహ్వే ప్రగాఢ నిబద్ధత ఈ సందర్భంలో ప్రధానమైనప్పటికీ, హీబ్రూ పదానికి ‘ఈర్ష్య’ అనే నిజమైన భావసాధ్యత కూడా ఉన్నందున దానిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రవచన శైలిని ఉపయోగించాం. హీబ్రూ సమాంతర నిర్మాణాన్ని స్పష్టంగా వినిపించేందుకు రెండవ పాదంలో సూచిత క్రియను ‘బయలుదేరుతారు’ అని పునరుక్తి చేశాం; ‘శేషం’ అనే బైబిలీయ పదాన్ని నిలుపుతూ, దానికి సమాంతరమైన פְלֵיטָהను సాధారణ పాఠకులకు స్పష్టంగా ‘తప్పించుకున్నవారు’ అని అనువదించాం.
