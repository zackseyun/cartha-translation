revisions:
- from: నీవు వినలేదా? ఎప్పుడో పూర్వమే[a] నేను దానిని చేశాను; ప్రాచీన కాలంలోనే దానికి రూపమిచ్చాను[b]. ఇప్పుడు అది జరిగేలా చేశాను—నీవు ప్రాకారాలుగల పట్టణాలను పాడుచేసి శిథిలాల దిబ్బలుగా మార్చేలా[c].
  to: నీవు వినలేదా? ఎంతో కాలం క్రితమే నేను దానిని చేశాను; పూర్వకాలం నుంచే దానికి రూపమిచ్చాను[b]. ఇప్పుడు అది జరిగేలా చేశాను—నీవు ప్రాకారాలుగల పట్టణాలను శిథిలాల దిబ్బలుగా మార్చేలా[c].
  rationale: 'లక్ష్యభాషలోని కాలసూచనను మూలంలోని ‘పూర్వకాలం నుంచే’ అనే భావానికి దగ్గరగా సవరించాం. చివరి ఉపవాక్యంలో విధ్వంసాన్ని రెండుసార్లు చెప్పకుండా, పట్టణాలు శిథిలాల దిబ్బలుగా మారడం అనే మూలచిత్రాన్ని నేరుగా ఉంచాం. పాదసూచిక aలో సూచికను ఉంచేందుకు ‘ఎంతో కాలం క్రితమే’ వద్ద [a]ను జోడించాలి; క్రింద పూర్తి పాఠంలో అది ప్రతిఫలించలేదు అనే నిర్మాణపరమైన అసంగతి నివారించేందుకు సవరించిన పాఠం ఇలా చదవాలి: ‘నీవు వినలేదా? ఎంతో కాలం క్రితమే[a] నేను దానిని చేశాను; పూర్వకాలం నుంచే దానికి రూపమిచ్చాను[b]. ఇప్పుడు అది జరిగేలా చేశాను—నీవు ప్రాకారాలుగల పట్టణాలను శిథిలాల దిబ్బలుగా మార్చేలా[c].’'
