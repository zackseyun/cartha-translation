id: 2KI.19.25
reference: 2 Kings 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: te
  text: నీవు వినలేదా? ఎంతో కాలం క్రితమే నేను దానిని చేశాను; పూర్వకాలం నుంచే దానికి రూపమిచ్చాను[b]. ఇప్పుడు అది జరిగేలా చేశాను—నీవు ప్రాకారాలుగల పట్టణాలను శిథిలాల దిబ్బలుగా మార్చేలా[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా ‘దానిని మలిచాను.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘దిబ్బలు, శిథిలాలు’; హీబ్రూ పదబంధం కష్టమైనది. ‘నిలిచిన దిబ్బలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: నీవు వినలేదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְמֵרָחוֹק
  choice: ఎప్పుడో పూర్వమే
  rationale: పదబద్ధంగా ‘దూరం నుండి’ అనే స్థలార్థం సాధ్యమైనా, వెంట వచ్చే ‘ప్రాచీన కాలంలో’ అనే సమాంతర పదబంధం ఇక్కడ సుదూర గతకాలాన్ని సూచిస్తుంది.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: నేను దానిని చేశాను
  rationale: స్త్రీలింగ ఏకవచన సర్వనామానికి సంబంధించిన పూర్వపదం వచనంలో స్పష్టంగా లేకపోవడం వల్ల ‘దానిని’ అని అనిశ్చితిని నిలిపి, עשה యొక్క విస్తృతార్థాన్ని కాపాడింది.
- source_word: לִימֵי קֶדֶם
  choice: ప్రాచీన కాలంలోనే
  rationale: దేవుని సంకల్పం ఎంతో పూర్వానిదని తెలిపే కాలార్థాన్ని స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: וִיצַרְתִּיהָ
  choice: దానికి రూపమిచ్చాను
  rationale: יצר లోని రూపొందించడం లేదా మలచడం అనే భావాన్ని నిలుపుతుంది; ‘ప్రణాళిక వేశాను’ అని మాత్రమే చెప్పి అర్థాన్ని సంకుచితం చేయదు.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: ఇప్పుడు అది జరిగేలా చేశాను
  rationale: పూర్వమే రూపొందించినది ఇప్పుడు కార్యరూపం దాల్చిందనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַהְשׁוֹת
  choice: పాడుచేసి
  rationale: హిఫీల్ రూపంలోని నాశనం కలిగించే భావాన్ని సైనిక విధ్వంస సందర్భానికి తగిన రీతిలో వ్యక్తం చేస్తుంది.
- source_word: עָרִים בְּצֻרוֹת
  choice: ప్రాకారాలుగల పట్టణాలు
  rationale: రక్షణకై బలపరచబడిన పట్టణాలు అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: גַּלִּים נִצִּים
  choice: శిథిలాల దిబ్బలు
  rationale: కష్టమైన హీబ్రూ పదబంధంలోని విధ్వంసానంతర దిబ్బలు లేదా శిథిలరాశుల దృశ్యాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: అష్షూరు విజయాలపై దేవుని సార్వభౌమాధికారం
  choice: అష్షూరు రాజు చేసిన విధ్వంసం దేవుడు పూర్వమే రూపొందించి ఇప్పుడు జరిగేలా చేసిన కార్యపరిధిలో ఉందని వచనం చెబుతున్న విధంగా అనువదించబడింది.
  alternative: దీనిని కేవలం దేవుని ముందస్తు జ్ఞానంగా బలహీనపరచడం, లేదా వచనం చెప్పనంత తాత్త్విక నిర్ణయాత్మకతను చేర్చడం.
  rationale: ‘చేశాను,’ ‘రూపమిచ్చాను,’ ‘జరిగేలా చేశాను’ అనే వరుస దేవుని పూర్వ సంకల్పం మరియు ప్రస్తుత కార్యసాధనను నిలుపుతుంది; అయితే అష్షూరు హింసకు దేవుని నైతిక ఆమోదముందని అనువాదం అదనంగా చెప్పదు.
- issue: וּתְהִי యొక్క ఉద్దేశ్య/ఫలిత సంబంధం
  choice: ‘నీవు ... మార్చేలా’ అని ఉద్దేశ్యం లేదా ఫలితం రెండింటికీ తెరచి ఉండే నిర్మాణం వాడబడింది.
  alternative: ‘నీవు తప్పక మార్చాలని’ అని కఠిన ఆజ్ఞార్థంగా లేదా ‘అది అలా అయింది’ అని కర్తను అస్పష్టంగా అనువదించడం.
  rationale: సందర్భంలో సంబోధించబడుతున్న అష్షూరు రాజుతో విధ్వంసక చర్యను అనుసంధానిస్తూ, హీబ్రూ నిర్మాణంలోని ఉద్దేశ్య-ఫలిత ఉద్రిక్తతను పూర్తిగా ఒక వైపుకు తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ప్రాకారాలుగల పట్టణాలు,’ ‘శిథిలాల దిబ్బలు’ వంటి పదాలు మూలంలోని యుద్ధ-విధ్వంస దృశ్యాన్ని నిలుపుతాయి. సర్వనామ పూర్వపదంలోని అస్పష్టతను ‘దానిని/అది’ ద్వారా ఉద్దేశపూర్వకంగా కాపాడాం.
