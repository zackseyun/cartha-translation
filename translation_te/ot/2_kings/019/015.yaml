  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: te
  text: 'హిజ్కియా యాహ్వే సన్నిధిలో ప్రార్థించి ఇలా అన్నాడు: “యాహ్వే, ఇశ్రాయేలు దేవా, కెరూబులపై సింహాసనాసీనుడా[a], భూమిమీదనున్న అన్ని రాజ్యాలకూ నీవొక్కడివే దేవుడవు. ఆకాశాన్ని, భూమిని నీవే చేశావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కెరూబుల మధ్య/పై కూర్చున్నవాడా.” హెబ్రీలో అక్షరార్థంగా “కెరూబుల కూర్చున్న/నివసిస్తున్నవాడు” అని ఉంది; ఇది యాహ్వే రాజుగా సింహాసనాసీనుడై ఉండడాన్ని సూచించే ఆరాధనా చిత్రణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థిస్తూ
  rationale: ప్రాథమిక అర్థం ‘ప్రార్థించు.’ తరువాత వచ్చే ‘అన్నాడు’తో సహజమైన ఆధునిక తెలుగు వాక్యంగా అనుసంధానించడానికి ‘ప్రార్థిస్తూ’ అని అనువదించాం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో.’ ప్రార్థన దేవుని సమక్షంలో చేయబడిందనే భావాన్ని ‘సన్నిధిలో’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడవైన
  rationale: ఇది సంబోధనలోని నిర్మాణ పదబంధం ‘ఇశ్రాయేలు దేవుడు’; తెలుగులో తదుపరి దైవనామంతో సహజంగా కలిసేలా ‘దేవుడవైన’ అని ఇచ్చాం.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: కెరూబులపై సింహాసనాసీనుడవైనవాడా
  rationale: יֹשֵׁב యొక్క ప్రాథమిక భావం కూర్చోవడం/నివసించడం అయినప్పటికీ, మందసంపై కెరూబులతో కూడిన రాజసంబంధ ఆరాధనా చిత్రణలో ఇది సింహాసనాసీనతను సూచిస్తుంది. ‘పై’ అనే పదం స్థలసంబంధ అస్పష్టతను కొంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: భూమిలోని రాజ్యాలన్నిటికీ నీవొక్కడివే దేవుడవు
  rationale: לְבַדְּךָ తెలిపే ప్రత్యేకతను ‘నీవొక్కడివే’ స్పష్టంగా నిలుపుతుంది. לְכֹל లో లేని ‘పై పరిపాలించేవాడు’ అనే భావాన్ని నేరుగా చేర్చకుండా, అన్ని రాజ్యాలతో దేవునికి ఉన్న విశ్వవ్యాప్త సంబంధాన్ని ‘రాజ్యాలన్నిటికీ’ ద్వారా చూపించాం.
- source_word: עָשִׂיתָ
  choice: చేశావు
  rationale: עָשָׂה యొక్క ప్రత్యక్ష అర్థం ‘చేయు/తయారుచేయు.’ మూలంలో ברא లేకపోవడంతో ‘సృష్టించావు’ కంటే ‘చేశావు’ను ఎంచుకున్నాం.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ఆకాశాన్ని, భూమిని
  rationale: ఇది సమస్త సృష్టిని సూచించే స్థిరమైన జంట పదబంధం. שָׁמַיִם రూపపరంగా బహువచనమైనా, ఆధునిక సహజ తెలుగులో ‘ఆకాశం’ ఏకవచనమే సాధారణం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: దేవుని ఏకైకత్వం మరియు సమస్త రాజ్యాలతో ఆయన సంబంధం
  choice: భూమిలోని రాజ్యాలన్నిటికీ నీవొక్కడివే దేవుడవు
  alternative: భూమిలోని రాజ్యాలన్నిటిపై నీవొక్కడివే దేవుడవు
  rationale: ‘నీవొక్కడివే’ దేవుని ఏకైకత్వాన్ని స్పష్టంగా తెలుపుతుంది. అయితే לְ ఉపసర్గను నేరుగా ‘పై’ అని విస్తరించి సార్వభౌమాధికార భావాన్ని మాత్రమే నిర్ణయించకుండా, మూలంలోని విస్తృత సంబంధాన్ని ‘అన్నిటికీ’గా నిలిపాం.
- issue: కెరూబులతో సంబంధం గల సింహాసన చిత్రణ
  choice: కెరూబులపై సింహాసనాసీనుడవైనవాడా
  alternative: కెరూబుల మధ్య నివసించేవాడా
  rationale: సందర్భం రాజసంబంధమైన సింహాసన చిత్రణను సమర్థిస్తుంది; అయినా హెబ్రీ పదబంధం ‘పై/మధ్య’ అనే స్థానాన్ని స్పష్టంగా నిర్ధారించదు. అందువల్ల ప్రధాన పాఠంలో సాధారణ రాజసంబంధ భావాన్ని, పాదసూచికలో అక్షరార్థం మరియు ప్రత్యామ్నాయ స్థానార్థాన్ని ఇచ్చాం.
