  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. పాత గ్రాంథిక క్రియారూపాలను నివారించి, ‘సన్నిధిలో,’ ‘సింహాసనాసీనుడు’ వంటి సాధారణ పాఠకులకు అర్థమయ్యే గంభీర పదాలను మాత్రమే ఉంచాం.
