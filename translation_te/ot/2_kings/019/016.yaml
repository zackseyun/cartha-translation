  source_fidelity: హీబ్రూ ఆజ్ఞార్థక సమాంతరతను—చెవిని ఒగ్గి వినడం, కళ్లను తెరిచి చూడడం, మళ్లీ వినడం—నమ్మకంగా ప్రతిబింబిస్తుంది. ״సన్హెరీబు పంపించిన మాటలు״ అనేది אֲשֶׁר שְׁלָחוֹ యొక్క సందర్భానుగుణమైన, ఆడిట్ ట్రెయిల్‌కు అనుగుణమైన రూపం; హీబ్రూ ప్రత్యయానికి సంబంధించి ఉన్న స్వల్ప వాక్యనిర్మాణ అస్పష్టతను అనవసరంగా సిద్ధాంతపరంగా పరిష్కరించలేదు. לְחָרֵף కు ״దూషించడానికి״ సరైన ప్రధానార్థం, ప్రత్యామ్నాయ ఛాయ పాదసూచికలో ఉంది.
