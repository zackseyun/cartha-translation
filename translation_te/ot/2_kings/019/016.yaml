id: 2KI.19.16
reference: 2 Kings 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: te
  text: యాహ్వే, చెవియొగ్గి విను; యాహ్వే, నీ కళ్లను తెరిచి చూడు. సజీవుడైన దేవుణ్ణి దూషించడానికి[a] సన్హెరీబు పంపించిన మాటలను విను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సజీవుడైన దేవుణ్ణి ధిక్కరించడానికి.” హీబ్రూ క్రియకు దూషించడం, ఎగతాళి చేయడం, లేదా ధిక్కరించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: చెవియొగ్గి
  rationale: ‘చెవిని వంచు’ అనే హీబ్రూ ప్రార్థనా నుడికారాన్ని తెలుగులో సహజంగా, గంభీరంగా తెలియజేస్తుంది; శ్రద్ధగా వినమనే భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וּשֲׁמָע
  choice: విను
  rationale: ఆజ్ఞార్థక రూపాన్ని నేరుగా అందిస్తూ, వచనంలో రెండుసార్లు వచ్చే ‘విను’ అనే సమాంతరతను నిలిపింది.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: నీ కళ్లను తెరిచి చూడు
  rationale: హీబ్రూ ఆజ్ఞల క్రమాన్ని, బహువచనమైన ‘కళ్లను’ సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: సన్హెరీబు ... మాటలను
  rationale: דִּבְרֵי అనే బహువచనానికి నేరమైన ‘మాటలు’ను వాడి, అష్షూరు రాజు పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని తీసుకున్నాం.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: పంపించిన
  rationale: సన్హెరీబు పంపిన సందేశం/మాటలు అనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. హీబ్రూలోని పురుష ఏకవచన కర్మప్రత్యయం వాక్యనిర్మాణపరంగా కఠినమైనదైనా, పంపబడిన ప్రతినిధి ద్వారా ఈ మాటలు వచ్చిన సందర్భాన్ని ఈ రూపం నిరాకరించదు.
- source_word: לְחָרֵף
  choice: దూషించడానికి
  rationale: అవమానించడం, నిందించడం, ఎగతాళి చేయడం అనే חרף పదపు ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ధిక్కరించడం’ అనే ఎదురొడ్డి సవాలు చేసే ఛాయను పాదసూచికలో ఉంచాం.
- source_word: אֱלֹהִים חָי
  choice: సజీవుడైన దేవుణ్ణి
  rationale: జీవముగల దేవునికి, జీవంలేని విగ్రహాలకు మధ్యనున్న సందర్భోచిత వ్యత్యాసాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ‘ప్రభువు’
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, మూల ఉచ్చారణకు సమీపమైన రూపంలో ఉంచాం.
- issue: לְחָרֵף పదం దేవునికి సంబంధించి సూచించే భావం
  choice: దూషించడానికి
  alternative: ధిక్కరించడానికి
  rationale: మూలపదం అవమానకరంగా నిందించడం లేదా ఎగతాళి చేయడాన్ని ప్రధానంగా సూచిస్తుంది; అదే సమయంలో దేవుణ్ణి సవాలు చేయడం అనే భావఛాయ కూడా సాధ్యమైనందున దానిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గంభీరతను ఉంచాం. ‘చెవియొగ్గి’ కొద్దిగా ఉన్నత శైలికి చెందిన నుడికారం అయినా సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. ఆజ్ఞల సమాంతరతను, ‘విను’ అనే పునరుక్తిని నిలిపాం.
