source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: te
  text: 'అప్పుడు ఆమోజు కుమారుడైన యెషయా హిజ్కియాకు ఇలా సందేశం పంపాడు: “ఇశ్రాయేలు దేవుడైన యెహోవా ఇలా అంటున్నాడు: అష్షూరు రాజైన సన్హెరీబు గురించి నీవు నాకు చేసిన ప్రార్థనను నేను విన్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపాడు
  rationale: ఇక్కడ క్రియకు సందేశాన్ని ఒకరి వద్దకు పంపించడం అనే భావం ఉంది; తెలుగులో సహజంగా, సందర్భానికి స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: దైవవాక్య ప్రకటన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָ אֵלַי
  choice: నీవు నాకు చేసిన ప్రార్థనను
  rationale: אֲשֶׁר ఇక్కడ ప్రార్థన విషయాన్ని సూచించే సంబంధవాచకంగా గ్రహించబడింది; హీబ్రూ వాక్యంలోని అసంపూర్ణంగా అనిపించే నిర్మాణాన్ని తెలుగులో సహజంగా ఉంచింది.
- source_word: אֶל סַנְחֵרִיב
  choice: సన్హెరీబు గురించి
  rationale: אֶל అనే ఉపసర్గ ఇక్కడ ప్రార్థనకు సంబంధించిన విషయం లేదా సందర్భాన్ని సూచిస్తుంది.
- source_word: שָׁמָעְתִּי
  choice: నేను విన్నాను
  rationale: మూలంలోని సంక్షిప్త దైవ ప్రత్యుత్తరాన్ని అలాగే నిలిపి, వినడం ద్వారా ప్రార్థనను ఆలకించాడనే అంతర్భావాన్ని అదనంగా వివరించలేదు.
theological_decisions:
- issue: అష్షూరు రాజు గురించి చేసిన ప్రార్థనకు దేవుని స్పందన
  choice: “నీవు నాకు చేసిన ప్రార్థనను నేను విన్నాను”
  alternative: “నీవు నాకు ప్రార్థించినందున నేను విన్నాను”
  rationale: మూలంలోని אֲשֶׁר ను తప్పనిసరిగా కారణార్థకంగా మార్చకుండా, ప్రార్థననే ‘విన్నాను’ అనే క్రియకు కర్మగా చూపడం ద్వారా హీబ్రూ నిర్మాణానికి దగ్గరగా ఉండి సహజమైన తెలుగు అందించబడింది.
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యమున్న రూపంలో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. వ్యక్తుల పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉంచబడ్డాయి.
