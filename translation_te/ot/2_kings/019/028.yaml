  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: te
  text: “నీవు నాపై రగిలిపోవడం, నీ నిర్లక్ష్యమైన స్వీయనిశ్చయం నా చెవుల్లోకి ఎగసి వచ్చాయి[a] కాబట్టి, నీ ముక్కులో నా కొంకెం, నీ పెదవుల్లో నా కళ్లెం వేసి, నీవు వచ్చిన మార్గంలోనే నిన్ను వెనక్కి మళ్లిస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ అహంకారం” లేదా “నీ స్వీయభరోసా.” హీబ్రూ పదం నిశ్చింతగా, భద్రంగా ఉన్న స్థితిని సూచిస్తుంది; ఇక్కడ అది ధిక్కారపూరితమైన స్వీయనిశ్చయం అనే భావంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: కాబట్టి
  rationale: రాబోయే తీర్పుకు కారణాన్ని తెలియజేసే హేతుబోధక పదం; తెలుగు వాక్యాంత నిర్మాణంలో ‘కాబట్టి’ సహజంగా సరిపోతుంది.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: నీవు నాపై రగిలిపోవడం
  rationale: దేవునికి వ్యతిరేకంగా వ్యక్తమయ్యే తీవ్రమైన ఆగ్రహం, ధిక్కారాన్ని సూచించే క్రియాశీలమైన తెలుగు వ్యక్తీకరణ.
- source_word: שַׁאֲנַנְךָ
  choice: నీ అతినిశ్చింత
  rationale: మూలపదంలోని నిశ్చింత, భద్రతాభావం అనే ప్రాథమిక భావాన్ని ఉంచుతూనే, ఈ శత్రుత్వ సందర్భంలోని నిర్లక్ష్యమైన స్వీయనిశ్చయాన్ని ‘అతి-’ సూచిస్తుంది; అహంకారం అనే బలమైన భావార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עָלָה בְאָזְנָי
  choice: నా చెవుల్లోకి ఎగసి వచ్చాయి
  rationale: కేవలం ‘నేను విన్నాను’ అని సారాంశీకరించకుండా, దేవుని చెవుల్లోకి పైకి రావడం అనే హీబ్రూ దృశ్యరూపాన్ని తెలుగులో నిలుపుతుంది.
- source_word: חַחִי
  choice: నా కొక్కెం
  rationale: జంతువును లేదా బందీని అదుపు చేయడానికి ముక్కులో వేసే hook అనే స్పష్టమైన దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: בְּאַפֶּךָ
  choice: నీ ముక్కులో
  rationale: ఇక్కడ אַף శరీర భాగమైన ముక్కునే సూచిస్తుంది; అదుపు చేసే సాధనపు రూపకానికి ఇది అవసరం.
- source_word: מִתְגִּי
  choice: నా కళ్లెపు కడ్డీ
  rationale: జంతువు నోటిలో పెట్టి అదుపు చేసే bit‌ను ‘కళ్లెం’ అనే విస్తృత పదం కంటే నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: בִּשְׂפָתֶיךָ
  choice: నీ పెదవుల్లో
  rationale: సహజీకరించి ‘నోటిలో’ అని మార్చకుండా, హీబ్రూలోని నిర్దిష్ట శరీరపదమైన ‘పెదవులు’ను నిలుపుతుంది.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: నిన్ను వెనక్కి మళ్లిస్తాను
  rationale: హిఫీల్ క్రియలోని కారణార్థాన్ని, శత్రువు తిరోగమనంపై దేవుని క్రియాశీల అధికారాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: నీవు వచ్చిన మార్గంలోనే
  rationale: దండెత్తి వచ్చిన అదే దారిలో తిరిగి పంపబడతాడనే తీర్పు సమరూపతను సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: దేవుడు వినడం, అష్షూరు రాజును అదుపు చేయడం గురించి మానవరూపక భాష
  choice: ‘నా చెవుల్లోకి,’ ‘నా కొక్కెం,’ ‘నా కళ్లెపు కడ్డీ’ అనే మూర్త దృశ్యాలను నిలుపడం
  alternative: ‘నేను విన్నాను,’ ‘నిన్ను అదుపు చేస్తాను’ వంటి భావసార పదాలతో రూపకాన్ని చదును చేయడం
  rationale: ఈ మూర్త దృశ్యాలు దేవుని అవగాహనను, అహంకార రాజుపై ఆయన సార్వభౌమ అదుపును బలంగా చూపుతాయి; దేవుని స్వభావం గురించి అదనపు సిద్ధాంత ఊహలను చేర్చకుండా మూలంలోని ప్రవచన వ్యంగ్యబలాన్ని నిలుపుతాయి.
- issue: שַׁאֲנַנְךָ పదంలోని భావ ఛాయ
  choice: ప్రధాన పాఠ్యంలో ‘నీ అతినిశ్చింత’
  alternative: ‘నీ అహంకారం’ లేదా ‘నీ స్వీయనిశ్చయం’
  rationale: హీబ్రూ పదం ప్రాథమికంగా నిశ్చింత లేదా భద్రతాభావాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది దోషపూరితమైన, ధిక్కారభరితమైన స్వీయభరోసా. ప్రధాన పాఠ్యం మూల భావాన్ని కాపాడగా, ప్రత్యామ్నాయ భావ ఛాయలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రవచన శైలి వాడబడింది. ‘ఎగసి వచ్చాయి,’ ‘ముక్కులో కొక్కెం,’ ‘పెదవుల్లో కళ్లెపు కడ్డీ’ వంటి మూల దృశ్యాలను సాధ్యమైనంత స్పష్టంగా నిలిపి, వాక్య నిర్మాణాన్ని తెలుగు పాఠకులకు సులభంగా గ్రహించదగినదిగా ఉంచాం.
