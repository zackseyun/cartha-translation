revisions:
- from: 'కాబట్టి అష్షూరు రాజును గురించి యాహ్వే ఇలా చెబుతున్నాడు: “అతడు ఈ పట్టణంలోకి రాడు; అక్కడ బాణం వేయడు; డాలుతో దాని ముందుకు రాడు[a]; దానికి ఎదురుగా ముట్టడి దిబ్బను కట్టడు[b].”'
  to: 'కాబట్టి అష్షూరు రాజును గురించి యాహ్వే ఇలా చెబుతున్నాడు: “అతడు ఈ పట్టణంలోకి రాడు; అక్కడ బాణం ప్రయోగించడు; డాలుతో దాని ఎదుటకు రాడు[a]; దానికి ఎదురుగా ముట్టడి దిబ్బను ఎత్తిపోసడు[b].”'
