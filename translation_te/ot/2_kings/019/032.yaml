id: 2KI.19.32
reference: 2 Kings 19:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: te
  text: 'కాబట్టి అష్షూరు రాజును గురించి యాహ్వే ఇలా చెబుతున్నాడు: “అతడు ఈ పట్టణంలోకి రాడు; అక్కడ బాణం ప్రయోగించడు; డాలుతో దాని ఎదుటకు రాడు[a]; దానికి ఎదురుగా ముట్టడి దిబ్బను ఎత్తిపోసడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “డాలు రక్షణగా దాని వైపు ముందుకు రాడు.” ముట్టడి యుద్ధంలో డాలు చాటున పట్టణాన్ని సమీపించడాన్ని హీబ్రూ పదబంధం సూచిస్తుండవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “దానికి ఎదురుగా ముట్టడి మట్టిదిబ్బను ఎత్తిపోసడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి దైవవాక్యానికి ఈ ప్రకటనను పర్యవసానంగా అనుసంధానించే హేత్వర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: ప్రవక్తల సందేశ సూత్రాన్ని సహజమైన వర్తమానకాల తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరిస్తుంది.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజును గురించి
  rationale: ఇక్కడ אֶל రాజుకు నేరుగా సంబోధన చేయడం కంటే అతని విషయంగా పలికిన ప్రకటనను పరిచయం చేస్తోంది.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: అతడు ఈ పట్టణంలోకి రాడు
  rationale: నిరాకరణతో కూడిన భవిష్యద్వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, పట్టణంలో ప్రవేశించడమనే భావాన్ని నిలుపుతుంది.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: అక్కడ బాణం వేయడు
  rationale: ירה హిఫీల్ రూపంలోని బాణాన్ని ప్రయోగించే సైనిక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: డాలుతో దాని ముందుకు రాడు
  rationale: קדמ యొక్క ‘ఎదురుగా రావడం/ముందుకు చేరడం’ అనే చిత్రాన్ని నిలుపుతూ, ముట్టడిలో డాలు ఎలా ఉపయోగించబడిందో ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: దానికి ఎదురుగా ముట్టడి దిబ్బను కట్టడు
  rationale: ‘పోయడం’ అనే క్రియ యొక్క అక్షరార్థం కన్నా, పట్టణానికి ఎదురుగా మట్టితో ముట్టడి నిర్మాణాన్ని పోసి కట్టే సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: סֹלְלָה
  choice: ముట్టడి దిబ్బ
  rationale: పట్టణంపై దాడి చేయడానికి ఎత్తుగా పోసిన మట్టి నిర్మాణాన్ని సూచించే, ఆధునిక పాఠకులకు అర్థమయ్యే పదబంధం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ కంటే మూలనామానికి సమీపమైన ధ్వన్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: అష్షూరు రాజు పట్టణంపై చేయలేని చర్యల ప్రవచన స్వరూపం
  choice: 'సాధారణ భవిష్యత్ నిరాకరణలు: ‘రాడు… వేయడు… కట్టడు’'
  alternative: విధి లేదా అనుమతి భావంతో ‘రాకూడదు… వేయకూడదు’
  rationale: హీబ్రూ రూపాలు ఇక్కడ ఆజ్ఞ కంటే జరగబోయే విషయంపై దైవిక ప్రకటనను సూచిస్తున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే ప్రవచన శైలి వాడబడింది. వరుస నిరాకరణలను అర్ధవిరామాలతో ఉంచి హీబ్రూ వాక్యంలోని లయను నిలిపాం; సైనిక సాంకేతికతపై మూలంలో ఉన్న స్వల్ప అనిశ్చితిని పాదటిప్పణుల్లో ఉంచాం.
