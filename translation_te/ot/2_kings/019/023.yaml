  to: 'నీ దూతల ద్వారా నీవు ప్రభువును ఎగతాళి చేసి ఇలా అన్నావు: ‘నా అనేక రథాలతో నేనే పర్వతాల శిఖరాలకు, లెబానోను సుదూర ప్రాంతాల వరకు ఎక్కాను. దాని ఎత్తైన దేవదారు చెట్లను, దాని శ్రేష్ఠమైన సరళ చెట్లను[a] నరికివేస్తాను. దాని అత్యంత దూరపు బసస్థలంలోకి, దాని సస్యశ్యామల అరణ్యంలోకి ప్రవేశిస్తాను.’'
