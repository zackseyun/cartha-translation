  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: te
  text: 'నీ దూతల ద్వారా నీవు ప్రభువును ఎగతాళి చేసి ఇలా అన్నావు: ‘నా అనేక రథాలతో నేనే పర్వతాల శిఖరాలకు, లెబానోను సుదూర ప్రాంతాల వరకు ఎక్కాను. దాని ఎత్తైన దేవదారు చెట్లను, దాని శ్రేష్ఠమైన సరళ చెట్లను[a] నరికివేస్తాను. దాని అత్యంత దూరపు బసస్థలంలోకి, దాని సస్యశ్యామల అరణ్యంలోకి ప్రవేశిస్తాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని శ్రేష్ఠమైన సైప్రస్ చెట్లను’; ఈ హెబ్రీయు పదం సూచించే ఖచ్చితమైన చెట్టు జాతి నిర్ధారితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: నీ దూతల ద్వారా
  rationale: హెబ్రీయులోని ‘చేతి ద్వారా’ అనే ప్రయోగం ఇక్కడ సాధనాన్ని లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దూతల ద్వారా’ సహజంగా ఉండి, రాజకీయ సందేశవాహకులనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: חֵרַפְתָּ
  choice: ఎగతాళి చేసి
  rationale: ఈ క్రియలో నిందించడం, అపహాస్యం చేయడం, ధిక్కారంగా మాట్లాడడం అనే భావాలు ఉన్నాయి. సందర్భంలోని అవమానకరమైన సవాలును ‘ఎగతాళి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువును
  rationale: మూలపాఠంలో ఇక్కడ יהוה కాక אֲדֹנָי ఉంది. అందువల్ల దైవనామానికి వాడే రూపంతో కలపకుండా బిరుదుగా ‘ప్రభువు’ అని అనువదించబడింది.
- source_word: בְּרֹב רִכְבִּי
  choice: నా అనేక రథాలతో
  rationale: రథాల విస్తార సంఖ్యను, దాని మీద రాజు పెట్టుకున్న సైనిక గర్వాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲנִי עָלִיתִי
  choice: నేనే ... ఎక్కాను
  rationale: ప్రత్యేకంగా ఉన్న אֲנִי ఇచ్చే ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; సైనిక అధిరోహణ సందర్భానికి ‘ఎక్కాను’ సహజంగా సరిపోతుంది.
- source_word: מְרוֹם הָרִים
  choice: పర్వత శిఖరాలకు
  rationale: పర్వతాల ఎత్తైన ప్రదేశాలను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: లెబానోను మారుమూల ప్రాంతాలకు
  rationale: יַרְכְּתֵי అంటే చివరి అంచులు, లోతట్టు లేదా సుదూర ప్రాంతాలు కావచ్చు. ‘మారుమూల ప్రాంతాలు’ ఆ విస్తృత భావాన్ని సహజంగా ఉంచుతుంది.
- source_word: קוֹמַת אֲרָזָיו
  choice: దాని ఎత్తైన దేవదారు చెట్లను
  rationale: קוֹמָה సూచించే ఎత్తు లేదా నిటారైన ఆకారాన్ని చెట్ల వర్ణనగా సహజంగా అందిస్తుంది.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: దాని శ్రేష్ఠమైన సరళ చెట్లను
  rationale: מִבְחוֹר అంటే ఎంపికైనవి లేదా అత్యుత్తమమైనవి. בְּרוֹשׁ ఒక శంఖాకార వృక్షాన్ని సూచించినా ఖచ్చితమైన జాతి అనిశ్చితం; ప్రధాన పాఠంలో సంప్రదాయబద్ధమైన ‘సరళ’ను ఉంచి అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: מְלוֹן קִצֹּה
  choice: దాని అత్యంత దూరపు బసస్థలంలోకి
  rationale: מָלוֹן యొక్క బస లేదా నిలయ భావాన్నీ, קִצֹּה యొక్క చివరి అంచు భావాన్నీ నిలుపుతుంది; రూపకాన్ని వివరణతో భర్తీ చేయలేదు.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: దాని వనోద్యానంలోకి
  rationale: יַעַר అంటే అడవి; כַּרְמֶל ఇక్కడ పచ్చగా, సారవంతంగా పెరిగిన తోటప్రాంతపు భావాన్ని జోడిస్తుంది. ‘వనోద్యానం’ అడవి-తోట చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: אֲדֹנָי అనే బిరుదును יהוה అనే దైవనామం నుండి వేరుగా చూపడం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: ఈ వచనంలోని వ్యంజన పాఠం אֲדֹנָי. కాబట్టి మూలంలో లేని יהוה అనే దైవనామాన్ని దిగుమతి చేయకుండా బిరుదుగానే అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. రాజు పలికిన అతిశయోక్తి, ‘నేనే’ అనే గర్వోక్తి, లెబానోను లోతుల వరకు చొచ్చుకుపోయే సైనిక దృశ్యం నిలుపబడ్డాయి.
