id: 2KI.19.10
reference: 2 Kings 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: te
  text: 'మీరు యూదా రాజైన హిజ్కియాతో ఇలా చెప్పాలి: ‘నీవు నమ్ముకున్న నీ దేవుడు, “యెరూషలేము అష్షూరు రాజు చేతికి అప్పగించబడదు” అని చెప్పి నిన్ను మోసగించనివ్వకు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: మీరు ... ఇలా చెప్పాలి
  rationale: సందేశ సూత్రంలోని ‘ఇలా’ అనే సూచన భావాన్ని, బహువచన ఆదేశ స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన హిజ్కియా
  rationale: వ్యక్తి పేరుతో కూడిన రాజబిరుదును తెలుగులో సహజమైన సమాస నిర్మాణంతో అందిస్తుంది.
- source_word: אַל יַשִּׁאֲךָ
  choice: నిన్ను మోసగించనివ్వకు
  rationale: నిషేధార్థక אַלను, נשׁא యొక్క ‘మోసగించు/తప్పుదారి పట్టించు’ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: హిజ్కియా ఆరాధించే దేవుని సూచిస్తున్నందున గౌరవార్థక ప్రధాన రూపం వాడబడింది; హెబ్రీ లిపిలో పెద్ద/చిన్న అక్షరభేదం లేకపోవడం వల్ల ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: నీవు నమ్ముకున్న
  rationale: בטח ב యొక్క ఆధారపడడం/విశ్వసించడం అనే భావాన్ని సంక్షిప్తమైన, సహజ తెలుగు సంబంధ వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: అని చెప్పి
  rationale: మోసం జరుగుతుందని వక్త ఆరోపిస్తున్న మాటల విషయాన్ని పరిచయం చేస్తుంది; హెబ్రీ నిర్మాణానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంటుంది.
- source_word: לֹא תִנָּתֵן
  choice: అప్పగించబడదు
  rationale: נתן నిఫ్అల్ నిష్క్రియార్థాన్ని నిలుపుతూ, నగరం శత్రు అధీనానికి ఇవ్వబడే సందర్భానికి సరిపోతుంది.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనే హెబ్రీ అధికార రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
theological_decisions:
- issue: అష్షూరు రాజు మాటల్లో אֱלֹהֶיךָ అనువాదం
  choice: నీ దేవుడు
  alternative: నీ దేవత
  rationale: సూచితుడు ఇశ్రాయేలు దేవుడే కాబట్టి ప్రధాన పాఠంలో ‘దేవుడు’ ఉంచబడింది. అయితే శత్రువైన వక్త హేళనతో మాట్లాడుతున్నందున, హెబ్రీ లిపిలో capitalization భేదం లేనందున ‘దేవత’ అనే శైలీ ప్రత్యామ్నాయం పాదటిప్పణిలో సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజసందేశ స్వరం నిలుపబడింది. ‘చేతికి అప్పగించబడదు’ అనే రూపం మూలంలోని అధికార రూపకాన్ని కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
