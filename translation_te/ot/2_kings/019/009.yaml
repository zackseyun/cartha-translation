source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: te
  text: 'కూషు రాజైన తిర్హాకా[a] గురించి అతడు ఇలా విన్నాడు: “ఇదిగో, అతడు నీతో యుద్ధం చేయడానికి బయలుదేరాడు.” అప్పుడు అతడు వెనుదిరిగి హిజ్కియాకు దూతలను పంపించి ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కూషు’ అనేది ఐగుప్తుకు దక్షిణంగా ఉన్న ప్రాచీన ప్రాంతం; కొన్ని అనువాదాల్లో దీనిని ‘ఇథియోపియా’ అని పేర్కొంటారు.
    reason: హీబ్రూ ప్రాంతనామం ‘కూషు’ను నిలుపుతూ, సంప్రదాయ అనువాద ప్రత్యామ్నాయాన్ని మరియు అది ఆధునిక దేశనామంతో పూర్తిగా సమానమేమీ కాదని సూచించడానికి.
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: వార్త అతనికి వినబడింది
  rationale: שׁמע + אֶל ఇక్కడ వినబడిన విషయాన్ని పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణం కోసం నివేదికను ముందుంచి ‘వార్త అతనికి వినబడింది’ అని అనువదించాం.
- source_word: תִּרְהָקָה
  choice: తిర్హాకా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా ఆధునిక తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: מֶלֶךְ כּוּשׁ
  choice: కూషు రాజు
  rationale: మూలంలోని ప్రాచీన ప్రాంతనామమైన כּוּשׁను నిలిపి, ఆధునిక ఇథియోపియాతో నేరుగా సమానీకరించలేదు.
- source_word: הִנֵּה
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఈ సందర్భంలో הִנֵּה నివేదికపై దృష్టి నిలుపుతుంది; తెలుగు పరోక్ష వాక్యంలో ఆ భావం ‘వార్త’ అనే నిర్మాణం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: తనతో యుద్ధం చేయడానికి బయలుదేరాడు
  rationale: יָצָא యొక్క కదలిక భావాన్నీ, యుద్ధ సందర్భంలో אִתָּךְకు ఉన్న విరోధార్థాన్నీ సహజ తెలుగులో నిలిపాం. ‘తనతో’ అనేది నివేదికను విన్న రాజును సూచిస్తుంది.
- source_word: וַיָּשָׁב
  choice: మళ్లీ
  rationale: ఇక్కడ שׁוב అనేది తప్పనిసరిగా భౌతికంగా వెనుదిరగడాన్ని కాక, చర్యను తిరిగి చేయడాన్ని కూడా సూచించగలదు. తరువాతి וַיִּשְׁלַחతో కలిపి ‘మళ్లీ ... పంపించాడు’ అని తీసుకోవడం హీబ్రూ వాక్యనిర్మాణానికి మరియు సమాంతరమైన యెషయా 37:9 పఠనానికి అనుగుణం.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: దూతలను పంపిస్తూ
  rationale: సైనిక-రాజకీయ సందర్భంలో מַלְאָכִים మానవ సందేశవాహకులను సూచిస్తుంది. చివరి לֵאמֹר తరువాతి ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేస్తుంది కాబట్టి ‘పంపిస్తూ ఇలా చెప్పాడు’ అని ఇచ్చాం.
- source_word: אֶל חִזְקִיָּהוּ
  choice: హిజ్కియా దగ్గరికి
  rationale: దిశను తెలిపే אֶלను సహజ ఆధునిక తెలుగులో వ్యక్తం చేసి, పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
