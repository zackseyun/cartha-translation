  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని వాడాం. వచనం తరువాతి సందేశంతో కొనసాగుతున్నందున చివరలో ద్విబిందువు ఉంచాం.
