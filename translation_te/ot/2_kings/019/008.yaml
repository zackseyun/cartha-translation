translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అష్షూరు బిరుదు ‘రబ్షాకే’గా నిలుపబడింది; స్థలనామాలు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని సర్వనామ సంభావ్య గందరగోళాన్ని తగ్గించేందుకు చివరి ఉపవాక్యంలో ‘రాజు’ అని స్పష్టం చేయబడింది.
