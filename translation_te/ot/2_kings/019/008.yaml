reference: 2 Kings 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ רַב שָׁקֵ֔ה וַ/יִּמְצָא֙ אֶת מֶ֣לֶךְ אַשּׁ֔וּר נִלְחָ֖ם עַל לִבְנָ֑ה כִּ֣י שָׁמַ֔ע כִּ֥י נָסַ֖ע מִ/לָּכִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: te
  text: అప్పుడు రబ్షాకే తిరిగి వెళ్లి, అష్షూరు రాజు లిబ్నాపై యుద్ధం చేస్తూ ఉండగా అతనిని కనుగొన్నాడు; అష్షూరు రాజు లాకీషు నుండి బయలుదేరాడని రబ్షాకే విన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అష్షూరు రాజు లాకీషు నుండి శిబిరం ఎత్తి వెళ్లాడని.” హీబ్రూ క్రియ సైనిక సందర్భంలో బయలుదేరడం, ఒక స్థలం విడిచి వెళ్లడం, లేదా శిబిరం ఎత్తడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లి
  rationale: שׁוּב మునుపటి స్థలం లేదా వ్యక్తి వద్దకు తిరిగి వెళ్లడాన్ని సూచిస్తుంది; కథన ప్రవాహంలో ‘తిరిగి వెళ్లి’ సహజంగా ఉంది.
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఇది అష్షూరు రాజసభకు చెందిన బిరుదు; సందర్భంలో పేరులాంటి గుర్తింపుగా వాడబడినందున అనువాదార్థాన్ని రుద్దకుండా లిప్యంతరీకరించబడింది.
- source_word: וַיִּמְצָא אֶת
  choice: అతన్ని కనుగొన్నాడు
  rationale: מָצָא యొక్క ప్రాథమిక అర్థమైన ‘కనుగొను’ను నిలుపుతుంది; సర్వనామం అష్షూరు రాజును సూచిస్తుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సంబంధ నిర్మాణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: נִלְחָם עַל
  choice: లిబ్నాపై యుద్ధం చేస్తూ ఉండగా
  rationale: పార్టిసిపిల్ కొనసాగుతున్న సైనిక చర్యను, עַל నగరంపై దాడి దిశను సూచిస్తున్నాయి.
- source_word: לִבְנָה
  choice: లిబ్నా
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: כִּי שָׁמַע
  choice: ఎందుకంటే ... విన్నాడు
  rationale: ఈ ఉపవాక్యం రబ్షాకే రాజును లిబ్నా వద్ద ఎందుకు కనుగొన్నాడో కారణాన్ని తెలియజేస్తుంది.
- source_word: כִּי נָסַע
  choice: రాజు ... బయలుదేరాడని
  rationale: נָסַע శిబిరం ఎత్తి బయలుదేరడం, ఒక స్థలం విడిచి కదలడం అనే సైనిక భావాన్ని కలిగి ఉంది. స్పష్టత కోసం తక్షణ సందర్భంలోని అష్షూరు రాజునే కర్తగా పేర్కొనబడింది.
- source_word: מִלָּכִישׁ
  choice: లాకీషు నుండి
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, מִן ఉపసర్గను ‘నుండి’గా నేరుగా అనువదిస్తుంది.
