  to: అప్పుడు రబ్షాకే తిరిగి వెళ్లి, అష్షూరు రాజు లిబ్నాపై యుద్ధం చేస్తూ ఉండగా అతనిని కనుగొన్నాడు; అష్షూరు రాజు లాకీషు నుండి బయలుదేరాడని రబ్షాకే విన్నాడు.[a]
  rationale: The revision resolves the Telugu pronoun ambiguity by explicitly identifying Rabshakeh as the hearer and the Assyrian king as the one who left Lachish. This reflects the verse’s narrative context without changing its meaning. The footnote is retained and its wording is aligned with the explicit antecedent in the revised text.
