  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: te
  text: పట్టణం నుండి అతడు యుద్ధ సైనికులకు అధిపతిగా నియమించబడిన ఒక అధికారిని[a], పట్టణంలో కనుగొనబడిన రాజు ముఖాన్ని చూసేవారిలో ఐదుగురిని[b], దేశ ప్రజలను సైనిక సేవకు సమీకరించేవాడైన సైన్యాధిపతి యొక్క లేఖకుణ్ణి[c], పట్టణంలో కనుగొనబడిన దేశ ప్రజలలో అరవై మందిని తీసుకువెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నపుంసకుడు’; ఈ హెబ్రీ పదం నిజంగా నపుంసకుడైన వ్యక్తిని లేదా రాజసేవలోని అధికారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘రాజు ముఖాన్ని చూసేవారు’ అనేది రాజును నేరుగా దర్శించే అవకాశం ఉన్నవారిని, బహుశా రాజసభ సేవకులను లేదా ఆస్థాన ప్రముఖులను సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘దేశ ప్రజలను సైనిక సేవకు నమోదు చేసేవాడు’ లేదా ‘సైన్యంలో చేర్చేవాడు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: అధికారి
  rationale: ఈ హెబ్రీ పదం నపుంసకుణ్ణి లేదా రాజసేవలోని అధికారిని సూచించగలదు. శారీరక స్థితిని నిర్ధారించకుండా సందర్భానికి సరిపోయే విస్తృత పదంగా ‘అధికారి’ ఎంచుకోబడింది.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధవీరులపై అధికారిగా నియమించబడిన
  rationale: פָקִיד లోని నియామకం మరియు పర్యవేక్షణ భావాలను, అలాగే సైనిక సందర్భాన్ని నిలుపుతుంది.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: రాజు ముఖాన్ని చూసేవారు
  rationale: రాజును నేరుగా దర్శించే అవకాశం గల ఆస్థాన సేవకులు లేదా ప్రముఖులను సూచించే హెబ్రీ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: సైన్యాధిపతి అయిన లేఖకుడు
  rationale: హెబ్రీలో రెండు బిరుదుల మధ్య సంబంధం సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉంది. రెండింటినీ స్పష్టంగా ఉంచుతూ సమానాధికార సంబంధంగా అనువదించాం.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: దేశ ప్రజలను సైనిక సేవకు సమీకరించే
  rationale: צבא యొక్క హిఫీల్ రూపం ఇక్కడ సైనిక సేవ కోసం ప్రజలను నమోదు చేయడం, పిలిపించడం లేదా సమీకరించడం అనే భావాన్ని ఇస్తుంది; బలవంతపు నియామకాన్ని అనవసరంగా నిర్ధారించకుండా ‘సమీకరించే’ అని ఇచ్చాం.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: ఈ పదబంధం సాధారణ ప్రజలను లేదా దేశంలోని పౌర సమూహాన్ని సూచించవచ్చు. సామాజిక పరిధిని అతిగా కుదించకుండా మూలానికి దగ్గరగా అనువదించాం.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: కనిపించిన
  rationale: מצא యొక్క నిఫాల్ రూపంలోని ‘కనుగొనబడిన/కనిపించిన’ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לָקַח
  choice: పట్టుకున్నాడు
  rationale: సాధారణ అర్థం ‘తీసుకున్నాడు’ అయినా, నగర పతనం తరువాత వ్యక్తులను అదుపులోకి తీసుకున్న ఈ సందర్భంలో ‘పట్టుకున్నాడు’ సహజంగా సందర్భార్థాన్ని తెలియజేస్తుంది.
