translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. హెబ్రీ నుడికారాన్ని పాఠ్యంలో నిలిపి పాదటిప్పణిలో వివరణ ఇచ్చాం. మూలంలోని వరుస జాబితా నిర్మాణాన్ని తెలుగు సహజత్వానికి అనుగుణంగా ఒకే వాక్యంలో కొనసాగించాం.
