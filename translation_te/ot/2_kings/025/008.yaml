  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని పాటించింది. తేదీ సూత్రాన్ని స్పష్టంగా ఉంచి, రాజసభ పదవిలోని నిజమైన పదార్థ విస్తృతిని పాదటిప్పణిలో సంరక్షించింది.
