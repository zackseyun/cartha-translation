id: 2KI.25.8
reference: 2 Kings 25:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: te
  text: ఐదో నెలలో, ఆ నెల ఏడో రోజున—అది బబులోను రాజైన నెబుకద్నెజరు పరిపాలనలో పంతొమ్మిదో సంవత్సరం—బబులోను రాజు సేవకుడూ రాజ అంగరక్షక దళాధిపతీ[a] అయిన నెబూజరదాను యెరూషలేముకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘వధించేవారి అధిపతి’; ఈ బిరుదు రాజ అంగరక్షకుల లేదా శిక్ష అమలుచేసేవారి అధిపతిని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: ఐదో నెలలో
  rationale: హీబ్రూ కథన సంధిని తెలుగులో సహజమైన వాక్యప్రవాహం ద్వారా వ్యక్తం చేసి, నెల సంఖ్యను యథాతథంగా ఉంచింది.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: ఆ నెల ఏడో రోజున
  rationale: హీబ్రూ తేదీ సూత్రంలో అంతర్లీనంగా ఉన్న ‘రోజు’ను తెలుగులో స్పష్టంగా పేర్కొనడం సహజమూ అర్థనిష్ఠమూ.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: అది బబులోను రాజైన నెబుకద్నెజరు పరిపాలనలో పంతొమ్మిదో సంవత్సరం
  rationale: రాజ్యపాలన సంవత్సరాన్ని సూచించే לַמֶּלֶךְ భావాన్ని తెలుగులో సహజంగా ‘పరిపాలనలో’ అని తెలిపి, హీబ్రూ వివరణాత్మక ఉపవాక్యాన్ని నిలిపింది.
- source_word: רַב טַבָּחִים
  choice: రాజ అంగరక్షక దళాధిపతి
  rationale: పదబంధానికి అక్షరార్థంగా ‘వధించేవారి అధిపతి’ అనే భావం ఉన్నా, రాజసభ సందర్భంలో ఇది అంగరక్షకులు లేదా శిక్ష అమలుచేసేవారి అధికారి అనే పదవి. ప్రధాన పాఠ్యంలో సందర్భోచిత పదవిని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు సేవకుడు
  rationale: עֶבֶד ఇక్కడ రాజుకు లోబడిన సేవకుడు లేదా అధికారి అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘సేవకుడు’ ఆ సంబంధాన్ని పదవిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: בָּא ... יְרוּשָׁלִָם
  choice: యెరూషలేముకు వచ్చాడు
  rationale: సాధారణ గమన క్రియ בואను నేరుగా, సహజమైన తెలుగులో అనువదించింది.
- source_word: נְבוּזַרְאֲדָן
  choice: నెబూజరదాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
