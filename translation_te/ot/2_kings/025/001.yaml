base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: te
  text: 'అతని పరిపాలన తొమ్మిదో సంవత్సరంలో, పదో నెల పదో రోజున ఇలా జరిగింది: బబులోను రాజైన నెబుకద్నెజరు[a] తన సైన్యమంతటితో యెరూషలేము మీదికి వచ్చాడు. వారు దానికి ఎదురుగా మకాం వేసి, దాని చుట్టూ ముట్టడి ప్రాకారాన్ని[b] కట్టారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరు కొన్ని లిప్యంతరీకరణ సంప్రదాయాల్లో ‘నెబుకద్రెజరు’ అని కూడా రాయబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ముట్టడి నిర్మాణాలు’ లేదా ‘ముట్టడి గట్టు’ అని కూడా అనువదించవచ్చు. హీబ్రూ דָּיֵק అనే పదం ముట్టడి సమయంలో నగరానికి వ్యతిరేకంగా నిర్మించే సైనిక కట్టడాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: చారిత్రక కథనంలో కొత్త ఘట్టాన్ని పరిచయం చేసే హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: అతని పరిపాలన తొమ్మిదో సంవత్సరంలో
  rationale: రాజు పరిపాలించిన కాలాన్ని లెక్కించే ప్రామాణిక రాజ్య సంవత్సర సూత్రాన్ని స్పష్టంగా నిలుపుతుంది; ‘అతని’ అనే సూచనలో మూలపాఠంలోని సందర్భాధారితత్వాన్ని అలాగే ఉంచుతుంది.
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: పదో నెల పదో రోజున
