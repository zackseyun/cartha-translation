translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక కథన శైలి వాడబడింది. దీర్ఘమైన హీబ్రూ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, సంఘటనల క్రమం మరియు సంబంధాలు నిలుపబడ్డాయి. మూలపాఠంలోని ‘అతని’ అనే సందర్భాధారిత సూచనను వివరణాత్మకంగా మార్చలేదు. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి పదాలకు సరిపోని స్థానాల్లో కనిపించినందున, తెలుగు ప్రధాన పాఠంలో పేరు-ప్రత్యామ్నాయం [a]ను రాజు పేరు వద్ద, דָּיֵק‌కు సంబంధించిన [b]ను ‘ముట్టడి ప్రాకారం’ వద్ద ఉంచాం.
