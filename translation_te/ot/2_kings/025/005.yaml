source:
  edition: WLC
  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחַ֣ר הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥גוּ אֹת֖/וֹ בְּ/עַרְב֣וֹת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: te
  text: కల్దీయుల[a] సైన్యం రాజును వెంబడించి, యెరికో మైదానాల్లో[b] అతన్ని అందుకుంది. అతని సైన్యమంతా అతని నుండి చెదరిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బబులోనీయుల.’ హీబ్రూ మూలపాఠంలో ‘కల్దీయులు’ అని ఉంది; ఈ సందర్భంలో అది బబులోను సైన్యాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యెరికో స్టెప్పీ ప్రాంతంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: కల్దీయుల సైన్యం
  rationale: חֵיל ఇక్కడ సైనిక దళాన్ని సూచిస్తుంది; כַּשְׂדִּים అనే మూలపాఠంలోని జాతి-రాజకీయ పేరును ‘కల్దీయులు’గా నేరుగా నిలిపాము.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: రాజును వెంబడించి
  rationale: רדף + אַחַר అనే సైనిక సందర్భంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘వెంబడించి’ సమగ్రంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: అతన్ని చేరుకుంది
  rationale: נשׂג ఇక్కడ వెంబడించి పట్టుకునేంతగా చేరుకోవడాన్ని సూచిస్తుంది. ‘చేరుకుంది’ మూలంలోని భావాన్ని అతిగా విస్తరించకుండా తెలుపుతుంది.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: యెరికో మైదానాల్లో
  rationale: עֲרָבוֹת అనేది మైదాన లేదా మైదాన-గడ్డి భూమి ప్రాంతాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు ‘మైదానాలు’ సహజంగా అర్థమవుతుంది.
- source_word: וְכָל חֵילוֹ
  choice: అతని సైన్యమంతా
  rationale: כָל + సమూహవాచకమైన חֵיל భావాన్ని తెలుగులో సహజంగా ‘సైన్యమంతా’ అని వ్యక్తం చేశాము.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: అతని దగ్గర నుంచి చెదరిపోయింది
  rationale: נפץ యొక్క చెదరిపోవడం అనే భావాన్నీ, מֵעָלָיוలోని రాజు నుంచి విడిపోవడం అనే భావాన్నీ సహజంగా నిలుపుతుంది.
