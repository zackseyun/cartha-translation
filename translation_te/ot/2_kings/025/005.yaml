translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. మూలంలోని ‘కల్దీయులు’ అనే పేరును నిలిపి, పదక్రమాన్ని తెలుగు సహజ వాక్యనిర్మాణానికి అనుగుణంగా మార్చాము.
