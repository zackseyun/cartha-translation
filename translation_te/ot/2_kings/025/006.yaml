revisions:
- from: అప్పుడు వారు రాజును పట్టుకొని, రిబ్లాలో ఉన్న బబులోను రాజు దగ్గరికి అతన్ని తీసుకెళ్లారు. అక్కడ వారు అతనికి తీర్పు ప్రకటించారు.[a]
  to: అప్పుడు వారు రాజును పట్టుకుని, అతన్ని రిబ్లాకు బబులోను రాజు దగ్గరికి తీసుకెళ్లారు. అక్కడ వారు అతనికి తీర్పు ప్రకటించారు.[a]
