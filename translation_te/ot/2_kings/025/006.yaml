translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. హీబ్రూ న్యాయపరమైన నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థస్పష్టంగా అనువదించి, దాని అక్షరరూపాన్ని పాదసూచికలో నిలిపాం.
