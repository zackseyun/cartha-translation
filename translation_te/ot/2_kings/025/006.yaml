  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּתְפְּשׂוּ֙ אֶת הַ/מֶּ֔לֶךְ וַ/יַּעֲל֥וּ אֹת֛/וֹ אֶל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָ֑תָ/ה וַ/יְדַבְּר֥וּ אִתּ֖/וֹ מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: te
  text: అప్పుడు వారు రాజును పట్టుకుని, అతన్ని రిబ్లాకు బబులోను రాజు దగ్గరికి తీసుకెళ్లారు. అక్కడ వారు అతనికి తీర్పు ప్రకటించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు అతనితో తీర్పు పలికారు”; ఇది అతనిపై న్యాయతీర్పు ప్రకటించారని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: పట్టుకొని
  rationale: పారిపోతున్న రాజును అదుపులోకి తీసుకున్న భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజును
  rationale: ముందటి సందర్భంలో ప్రస్తావించబడిన సిద్కియాను సూచించే నిర్దిష్ట నామవాచకం; మూలంలో పేరు మళ్లీ లేకపోవడంతో ‘రాజు’ అనే రూపమే నిలుపబడింది.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: అతన్ని తీసుకెళ్లారు
  rationale: עלה యొక్క మూల దిశార్థం ‘పైకి తీసుకెళ్లడం’ అయినా, ఇక్కడ ఆధునిక తెలుగులో ‘పైకి’ చేర్చడం అసహజంగా లేదా భౌగోళికంగా తప్పుదారి పట్టించేలా ఉంటుంది; గమ్యస్థానానికి తీసుకెళ్లిన భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אֶל מֶלֶךְ בָּבֶל רִבְלָתָה
  choice: రిబ్లాలో ఉన్న బబులోను రాజు దగ్గరికి
  rationale: אֶל యొక్క గమ్యార్థాన్ని ‘దగ్గరికి’తో, רִבְלָתָה యొక్క స్థల/గమ్య సూచనను సహజమైన తెలుగు నిర్మాణంలో ‘రిబ్లాలో ఉన్న’తో వ్యక్తం చేస్తుంది.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: వారు అతనికి తీర్పు ప్రకటించారు
  rationale: అక్షరార్థంగా ‘అతనితో తీర్పు మాటలు పలికారు’ అనే హీబ్రూ న్యాయపరమైన నుడికారాన్ని, కేవలం సంభాషణగా కాక న్యాయతీర్పు ప్రకటించడంగా స్పష్టంగా తెలియజేస్తుంది.
