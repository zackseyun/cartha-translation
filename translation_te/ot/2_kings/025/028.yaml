  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: te
  text: అతడు యెహోయాకీనుతో దయగా మాట్లాడి, బాబెలులో అతనితో ఉన్న రాజుల సింహాసనాలకంటే అతని సింహాసనాన్ని ఉన్నతంగా ఉంచాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనితో మంచి మాటలు మాట్లాడాడు.” ఇది అతనితో అనుకూలంగా లేదా దయగా మాట్లాడాడని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “సింహాసనం” అనే పదాన్ని ఇక్కడ భౌతికంగా “ఆసనం” అని కూడా అర్థం చేసుకోవచ్చు. భావం ఏమిటంటే, బాబెలులో ఉన్న ఇతర రాజులకంటే యెహోయాకీనుకు ఉన్నత హోదా ఇవ్వబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: అతడు యెహోయాకీనుతో దయగా మాట్లాడి
  rationale: ‘మంచి మాటలు మాట్లాడాడు’ అనే హీబ్రూ నుడికారం అనుకూలంగా లేదా దయతో మాట్లాడడాన్ని సూచిస్తుంది. సందర్భంలోని కర్త, కర్మ స్పష్టత కోసం యెహోయాకీను పేరు చేర్చబడింది.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: అతని సింహాసనాన్ని ... ఉన్నతంగా ఉంచాడు
  rationale: ఇక్కడ נתן భౌతిక వస్తువును బహూకరించడం కంటే ఆసనం లేదా రాజస్థానాన్ని నియమించి ఉన్నత స్థానం ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: כִּסְאוֹ
  choice: అతని సింహాసనం
  rationale: כִּסֵּא భౌతిక ఆసనాన్ని కూడా సూచించగలిగినా, ఈ సందర్భంలో రాజగౌరవం మరియు హోదా భావాలను ‘సింహాసనం’ నిలుపుతుంది.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: రాజుల సింహాసనాలకంటే ... ఉన్నతంగా
  rationale: מֵעַל ఇక్కడ స్థానం లేదా హోదాలో ఆధిక్యాన్ని తెలియజేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో పోలికను స్పష్టంగా చెప్పేందుకు బహువచన రూపం వాడబడింది.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: బాబెలులో తనతో ఉన్న రాజులు
  rationale: హీబ్రూ సంబంధవాచక వాక్యాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
