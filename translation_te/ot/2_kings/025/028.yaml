  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘సింహాసనం’ ద్వారా భౌతిక ఆసనం మరియు రాజహోదా అనే రెండు భావాలూ నిలుపబడ్డాయి.
