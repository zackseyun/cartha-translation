source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: te
  text: అతడు యాహ్వే మందిరాన్ని[a], రాజభవనాన్ని, యెరూషలేములోని ఇళ్లన్నిటినీ, గొప్ప ఇళ్లన్నిటినీ[b] అగ్నితో కాల్చివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘యాహ్వే ఇల్లు.’'
    reason: lexical_alternative
  - marker: b
    text: ‘గొప్ప ఇళ్లు’ అనే హీబ్రూ పదబంధం పెద్ద ఇళ్లను లేదా ప్రాముఖ్యమైన ఇళ్లను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: కాల్చివేశాడు
  rationale: שׂרף అనే క్రియ యొక్క Qal wayyiqtol రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది. తెలుగులో ‘కాల్చివేశాడు’ ఉద్దేశపూర్వకంగా పూర్తిగా దహనం చేసిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరాన్ని
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు.’ ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ ఆధునిక పాఠకునికి సహజంగా, స్పష్టంగా ఉంటుంది; మూలంలోని అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనాన్ని
  rationale: అక్షరార్థం ‘రాజు ఇల్లు’; సందర్భంలో రాజు నివాసమైన రాజప్రాసాదాన్ని సూచిస్తుంది. ‘రాజభవనం’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: כָּל בָּתֵּי יְרוּשָׁלַםִ
  choice: యెరూషలేములోని ఇళ్లన్నిటినీ
  rationale: స్థలసంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ‘యెరూషలేములోని ఇళ్లన్నీ’ అని అనువదించాం.
- source_word: כָּל בֵּית גָּדוֹל
  choice: గొప్ప ఇళ్లన్నిటినీ
  rationale: గָּדוֹל పరిమాణాన్నీ ప్రాముఖ్యతనూ సూచించగలదు. ‘గొప్ప’ అనే పదం ఈ ద్వంద్వసాధ్యతను కొంతవరకు నిలుపుతుంది; సాధ్యమైన అర్థాలను పాదసూచిక వివరిస్తుంది.
- source_word: שָׂרַף בָּאֵשׁ
  choice: అగ్నితో కాల్చివేశాడు
  rationale: చివర పునరుక్తమైన క్రియతో కూడిన ‘అగ్నితో’ అనే పదబంధం దహనాన్ని బలపరుస్తుంది. తెలుగు వాక్యంలో ప్రధాన క్రియను చివర ఉంచడం సహజం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది. అందువల్ల దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: בֵּית יְהוָהను ‘ఇల్లు’గా లేదా ‘మందిరం’గా అనువదించడం
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: అక్షరార్థాన్ని పాదసూచికలో భద్రపరుస్తూనే, చారిత్రక సందర్భంలోని దేవాలయ సూచనను ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం; ఇందులో ప్రత్యేక మతశాఖకు చెందిన భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని ఉపయోగించాం. స్థలనామానికి ‘యెరూషలేము,’ దైవనామానికి ‘యెహోవా’ అనే సుపరిచిత బైబిలు రూపాలను వాడాం. మూలంలోని ‘ఇల్లు’ అనే పదపునరావృతిని పూర్తిగా అనుకరించకుండా, సందర్భానుసారంగా ‘మందిరం,’ ‘రాజభవనం,’ ‘ఇళ్లు’ అని ఇచ్చాం; అయితే גָּדוֹלలోని పరిమాణం/ప్రాముఖ్యత సందిగ్ధతను పాదసూచికలో నిలిపాం.
