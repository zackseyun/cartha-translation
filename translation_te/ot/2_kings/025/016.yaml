revisions:
- from: సొలొమోను యహ్వే మందిరం కోసం చేసిన రెండు స్తంభాలు, ఒక సముద్రం, పీఠాలు—ఈ వస్తువులన్నిటిలోని కంచుకు తూకమే లేదు.[a]
  to: సొలొమోను యహ్వే మందిరం కోసం చేసిన రెండు స్తంభాలు, ఆ ఒక్క “సముద్రం,” పీఠాలు—ఈ వస్తువులన్నిటి కంచును తూచలేదు.[a]
  rationale: The revision removes a Telugu ambiguity that could deny the physical weight of the bronze, while retaining the source’s contextual idiom and the alternative ‘weight’ sense in the footnote. It also marks “సముద్రం” as the established technical name of the temple object.
