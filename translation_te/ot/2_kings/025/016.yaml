id: 2KI.25.16
reference: 2 Kings 25:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: te
  text: సొలొమోను యహ్వే మందిరం కోసం చేసిన రెండు స్తంభాలు, ఆ ఒక్క “సముద్రం,” పీఠాలు—ఈ వస్తువులన్నిటి కంచును తూచలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వస్తువులన్నిటి కంచుకు బరువు లేదు”; అంటే, కంచు ఎంతో విస్తారంగా ఉండడం వల్ల దాన్ని తూచలేదు.
    reason: మִשְׁקָל అనే పదానికి ‘తూకం/తూచడం’ లేదా ‘బరువు’ అనే అర్థాలు ఉండవచ్చు. ప్రధాన పాఠం సందర్భానుసారంగా కంచును తూచలేదనే భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని గమనికలో నిలుపుతుంది.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: రెండు స్తంభాలు
  rationale: עַמּוּדִים ఆలయ నిర్మాణానికి చెందిన స్తంభాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘స్తంభాలు’ సహజమైన, స్థిరపడిన పదం.
- source_word: הַיָּם הָאֶחָד
  choice: ఒక సముద్రం
  rationale: יָם ఇక్కడ ఆలయంలోని పెద్ద కంచు తొట్టికి వాడిన ప్రత్యేక నామం. దాని సాంకేతిక నామాన్ని వివరణగా మార్చకుండా ‘సముద్రం’గా నిలుపుతున్నాం.
- source_word: וְהַמְּכֹנוֹת
  choice: పీఠాలు
  rationale: מְכֹנוֹת కడుగుకొనే తొట్టెలను మోసే ఆధార నిర్మాణాలను సూచిస్తుంది; ‘పీఠాలు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: సొలొమోను చేసిన
  rationale: హీబ్రూ సంబంధ వాక్యాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, עָשָׂה అనే సాధారణ ‘చేశాడు’ భావాన్ని కాపాడింది.
- source_word: לְבֵית יְהוָה
  choice: యహ్వే మందిరం కోసం
  rationale: בֵּית యొక్క అక్షరార్థం ‘ఇల్లు’ అయినా, ఇక్కడ ఆలయాన్ని సూచిస్తున్నందున ‘మందిరం’ సహజంగా ఉంది; יְהוָה అనే దైవనామాన్ని ‘యహ్వే’గా ప్రత్యక్షంగా ఉంచింది.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: తూకమే లేదు
  rationale: מִשְׁקָל ‘తూకం/బరువు’ అనే భావాల్లో ఉండవచ్చు. ‘తూకమే లేదు’ మూలంలోని సంక్షిప్త అతిశయోక్తిని, దాని అస్పష్టతను నిలుపుతుంది.
- source_word: לִנְחֹשֶׁת
  choice: కంచుకు
  rationale: נְחֹשֶׁת ఆలయ సామగ్రిలో ఉపయోగించిన కంచు లోహాన్ని సూచిస్తుంది.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ఈ వస్తువులన్నిటిలోని
  rationale: כֵּלִים ఇక్కడ పాత్రలకే పరిమితం కాకుండా స్తంభాలు, సముద్రం, పీఠాలు అన్నిటినీ కలుపుతుంది; అందువల్ల ‘వస్తువులు’ విస్తృత భావాన్ని సరిగ్గా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక నామమైన చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. జాబితా స్పష్టత కోసం దీర్ఘ విరామచిహ్నం వాడబడింది; ఆలయ సామగ్రికి సంబంధించిన ప్రత్యేక నామమైన ‘సముద్రం’ వివరణగా మార్చకుండా నిలుపబడింది.
