translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘కల్దీయులు,’ ‘సేవకులు,’ ‘సేవించండి’ వంటి పదాలతో మూలంలోని పదప్రయోగం నిలుపుతూ, సందర్భానుసార ప్రత్యామ్నాయాలను పాదసూచికల్లో పేర్కొనబడింది.
