  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֤ם גְּדַלְיָ֨הוּ֙ וּ/לְ/אַנְשֵׁי/הֶ֔ם וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַל תִּֽירְא֖וּ מֵ/עַבְדֵ֣י הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִטַ֥ב לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: te
  text: గెదల్యా వారికీ వారి మనుష్యులకూ[a] ప్రమాణం చేసి, “కల్దీయుల[b] సేవకులకు[c] భయపడకండి. ఈ దేశంలో నివసించండి, బబులోను రాజును సేవించండి; అప్పుడు మీకు మేలు జరుగుతుంది” అని వారితో చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి మనుష్యులు’ అంటే వారి అనుచరులు లేదా సైనికులు కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కల్దీయులు’ అనేది హీబ్రూ పదం; ఈ సందర్భంలో ‘బబులోనీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘సేవకులు’ అనే హీబ్రూ పదం ఇక్కడ కల్దీయుల అధికారులు లేదా ప్రతినిధులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేసి
  rationale: నిఫ్అల్ రూపంలోని שׁבע అంటే ‘ప్రమాణం చేయడం/ఒట్టు పెట్టడం.’ ‘ప్రమాణం చేసి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, గెదల్యా ఇచ్చిన గంభీరమైన హామీని వ్యక్తం చేస్తుంది.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: వారి మనుష్యులకు
  rationale: אַנְשֵׁי అనే పదానికి అక్షరార్థంగా ‘మనుష్యులు’ అని అర్థం. సందర్భంలో నాయకులతో ఉన్న అనుచరులు లేదా సైనికులు కావచ్చు; ప్రధాన పాఠంలో సాధారణ పదాన్ని ఉంచడం వల్ల మూలంలోని విస్తృతార్థం నిలుస్తుంది.
- source_word: אַל תִּירְאוּ
  choice: భయపడకండి
  rationale: నిషేధార్థక ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: కల్దీయుల సేవకులకు
  rationale: ירא క్రియతో వచ్చిన מִן భయానికి కారణమైన వ్యక్తులను సూచిస్తుంది; తెలుగులో ‘వారికి భయపడకండి’ సహజ నిర్మాణం. עֲבָדִים యొక్క ప్రాథమిక అర్థమైన ‘సేవకులు’ నిలుపబడింది; ఇక్కడ అది అధికారులను లేదా ప్రతినిధులను కూడా సూచించవచ్చు.
- source_word: הַכַּשְׂדִּים
  choice: కల్దీయులు
  rationale: హీబ్రూ జాతినామాన్ని నేరుగా ప్రతిబింబిస్తుంది. ఈ సందర్భంలో ఇది బబులోనీయ సామ్రాజ్య శక్తిని సూచిస్తుంది; ఆ సందర్భార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: שְׁבוּ בָאָרֶץ
  choice: ఈ దేశంలో నివసిస్తూ
  rationale: ישׁב అంటే ‘నివసించు,’ ‘ఉండు,’ లేదా ‘స్థిరపడు.’ దేశంలోనే కొనసాగి నివసించమనే సందర్భార్థాన్ని ‘నివసిస్తూ’ సహజంగా తెలియజేస్తుంది. తెలుగులో నిర్దిష్ట సందర్భాన్ని స్పష్టం చేయడానికి ‘ఈ’ చేర్చబడింది.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: బబులోను రాజును సేవించండి
  rationale: עבד ఒక వ్యక్తిని కర్మగా తీసుకున్నప్పుడు ‘సేవించు’ అని అర్థం; ఇక్కడ రాజకీయ విధేయత అంతర్భావంగా ఉన్నా, ‘లోబడండి’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలపద భావం నిలుపబడింది.
- source_word: וְיִטַב לָכֶם
  choice: అప్పుడు మీకు మేలు జరుగుతుంది
  rationale: ‘మీ విషయంలో మంచి జరుగుతుంది’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘అప్పుడు’ ముందున్న ఆజ్ఞలకు అనుసంధానమైన ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
