translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నిర్మాణ వర్ణన. “మూర” సంప్రదాయ బైబిలు కొలతపదంగా ఉంచబడింది; “స్తంభశీర్షం” సాంకేతికమైనప్పటికీ సందర్భంలో సులభంగా గ్రహించదగినది. మూలంలోని చివరి క్లాజు అసంపూర్ణతను పాదటిప్పణిలో వెల్లడించి, ప్రధాన వాక్యాన్ని చదవడానికి సహజంగా తీర్చిదిద్దాం.
