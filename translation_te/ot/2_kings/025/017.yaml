id: 2KI.25.17
reference: 2 Kings 25:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: te
  text: ఒక స్తంభం ఎత్తు పద్దెనిమిది మూరలు; దానిపై కంచుతో చేసిన స్తంభశీర్షం ఉండేది. ఆ స్తంభశీర్షం ఎత్తు మూడు మూరలు. స్తంభశీర్షం చుట్టూ వలలాంటి అల్లిక[a], దానిమ్మపండ్ల ఆకారాల అలంకారాలు ఉండేవి; అవన్నీ కంచుతో చేసినవే. రెండో స్తంభానికి కూడా అల్లికతో కూడిన ఇలాంటివే ఉండేవి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వలలాంటి అల్లిక” అనే హెబ్రీ పదం (שְׂבָכָה) స్తంభశీర్షంపై ఉన్న వల లేదా జాలిలాంటి అలంకార నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో చివరి మాటలు సంక్షిప్తంగా ఉన్నాయి; అక్షరార్థంగా, “రెండో స్తంభానికి అల్లికపై ఇలాంటివే” అని ఉన్నాయి. రెండో స్తంభానికీ అల్లికతో సహా సరిపోలే అలంకరణ ఉందనేది భావం.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: ఎత్తు
  rationale: నిర్మాణ వర్ణనలో కట్టడం లేదా వస్తువు యొక్క నిలువు కొలతను సహజంగా, కచ్చితంగా తెలియజేస్తుంది.
- source_word: עַמּוּד
  choice: స్తంభం
  rationale: దేవాలయ నిర్మాణ సందర్భానికి సరిపోయే సాధారణ, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: כֹתֶרֶת
  choice: స్తంభశీర్షం
  rationale: రాజకిరీటం అనే అపార్థం రాకుండా, స్తంభం పైభాగంలోని అలంకార నిర్మాణాన్ని సూచించే వాస్తుశిల్ప పదం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన దేవాలయ సామగ్రి సందర్భంలో రాగి మిశ్రమమైన bronze‌ను సూచించడానికి తెలుగులో ప్రాచుర్యం పొందిన పదం.
- source_word: שְׂבָכָה
  choice: వలలాంటి అల్లిక పని
  rationale: వల లేదా జాలిలా కనిపించే అలంకార నిర్మాణాన్ని సాధారణ పాఠకునికి స్పష్టంగా చూపిస్తుంది; పదంలోని net-like భావాన్ని నిలుపుతుంది.
- source_word: רִמֹּנִים
  choice: దానిమ్మ ఆకృతులు
  rationale: ఇక్కడ నిజమైన పండ్లు కాక, స్తంభశీర్షంపై ఉన్న దానిమ్మ రూప అలంకారాలు ఉద్దేశించబడ్డాయని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అలంకారాలు స్తంభశీర్షాన్ని ఆవరించి ఉన్న స్థల సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: అవన్నీ కంచుతో చేసినవే
  rationale: ముందు చెప్పిన అలంకార అంశాలన్నిటి పదార్థాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְכָאֵלֶּה
  choice: కూడా ... ఇలాంటివే ఉండేవి
  rationale: మొదటి స్తంభంపై వర్ణించిన వాటితో రెండో స్తంభంలోని అలంకరణ సరిపోలిందనే సూచనను, హెబ్రీలోని సంక్షిప్తతను అతిగా విస్తరించకుండా తెలుగులో అందిస్తుంది.
- source_word: עַל הַשְּׂבָכָה
  choice: అల్లికపై
  rationale: హెబ్రీ పూర్వప్రత్యయం యొక్క ఉపరితల సంబంధాన్ని నిలుపుతూ, చివరి క్లాజులోని అసంపూర్ణ వాక్య నిర్మాణాన్ని యథాశక్తి ప్రతిబింబిస్తుంది.
