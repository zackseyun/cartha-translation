  to: ఒక స్తంభం ఎత్తు పద్దెనిమిది మూరలు; దానిపై కంచుతో చేసిన స్తంభశీర్షం ఉండేది. ఆ స్తంభశీర్షం ఎత్తు మూడు మూరలు. స్తంభశీర్షం చుట్టూ వలలాంటి అల్లిక[a], దానిమ్మపండ్ల ఆకారాల అలంకారాలు ఉండేవి; అవన్నీ కంచుతో చేసినవే. రెండో స్తంభానికి కూడా అల్లికతో కూడిన ఇలాంటివే ఉండేవి.[b]
  rationale: చివరి హెబ్రీ క్లాజులోని వ్యాకరణాత్మక సంక్షిప్తతను పాదటిప్పణిలో వెల్లడిస్తూ, ప్రధాన పాఠంలో అసహజమైన “అల్లికపై ఇలాంటివే” స్థానంలో “అల్లికతో కూడిన ఇలాంటివే” అని సవరించాం. దీనివల్ల రెండో స్తంభం మొదటి స్తంభానికి సరిపోలిందనే భావం నిలుస్తుంది; హెబ్రీలో వివాదాస్పదంగా ఉన్న ఖచ్చితమైన నిర్మాణ సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేయదు. దానిమ్మలు అలంకార రూపాలని తెలుగులో స్పష్టంగా సూచించాం.
