source:
  edition: WLC
  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: te
  text: వారు సిద్కియా కుమారులను అతని కళ్ల ఎదుటే వధించారు. తరువాత అతడు సిద్కియా కళ్లకు చూపు లేకుండా చేసి[a], అతనిని కంచు సంకెళ్లతో బంధించి బబులోనుకు తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సిద్కియాను గుడ్డివానిగా చేసి.’ హీబ్రూ క్రియకు ‘గుడ్డివానిగా చేయడం’ అని అర్థం. ఇక్కడ కళ్ల ప్రస్తావన ఉన్నందున, వాటిని నాశనం చేసి చూపు పోగొట్టడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: వధించారు
  rationale: ఈ క్రియలో హింసాత్మకంగా చంపడం అనే బలమైన భావం ఉంది. సాధారణమైన ‘చంపారు’ కంటే ‘వధించారు’ ఆ క్రూరత్వాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְעֵינָיו
  choice: అతని కళ్ల ఎదుటే
  rationale: సిద్కియా నేరుగా చూస్తుండగానే ఇది జరిగిందనే హీబ్రూ నుడికారంలోని తీవ్రతను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עִוֵּר
  choice: కళ్లను పొడిచి
  rationale: క్రియ ప్రాథమికంగా ‘గుడ్డివానిగా చేయడం’ అని అర్థం. ఈ హింసాత్మక సందర్భంలో కళ్లను నాశనం చేసి చూపు పోగొట్టిన భౌతిక చర్యను ‘కళ్లను పొడిచి’ సహజంగా సూచిస్తుంది.
- source_word: וַיַּאַסְרֵהוּ
  choice: అతనిని ... బంధించి
  rationale: తరువాత వచ్చే లోహపు సంకెళ్ల ప్రస్తావన దృష్ట్యా, ‘బంధించి’ అనేది క్రియకు నేరమైన, సందర్భోచితమైన అనువాదం.
- source_word: בַנְחֻשְׁתַּיִם
  choice: కంచు సంకెళ్లతో
  rationale: ద్వివచన/బహువచన రూపం లోహంతో చేసిన నిర్బంధ సాధనాలను సూచిస్తుంది. ‘కంచు సంకెళ్లు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి మూలంలోని లోహ ప్రస్తావనను నిలుపుతుంది.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: బబులోనుకు తీసుకెళ్లాడు
  rationale: గమ్యస్థానానికి అతనిని కొనిపోవడాన్ని తెలుగులో సహజమైన కథన శైలిలో తెలియజేస్తుంది.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: సిద్కియా కుమారులను
  rationale: హీబ్రూ సంబంధ నిర్మాణానికి సహజమైన తెలుగు సమానార్థక రూపం.
theological_decisions:
- issue: కర్త సంఖ్యలో మార్పు
  choice: మొదటి చర్యకు ‘వారు’, తరువాతి చర్యలకు ‘అతడు’ అని అనువదించడం
  alternative: అన్ని చర్యలకు ‘వారు’ అని ఒకే బహువచన కర్తను ఉపయోగించడం
  rationale: హీబ్రూలో ‘వధించారు’ బహువచనంలో ఉండగా, కళ్లను గుడ్డివిగా చేయడం, బంధించడం, తీసుకెళ్లడం అనే క్రియలు ఏకవచనంలో ఉన్నాయి. ఈ మార్పును అనువాదంలో నిలిపి, ఏకవచన కర్త ఎవరనే విషయాన్ని పాఠ్యానికి మించి నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘వధించారు’ హింస తీవ్రతను, ‘కళ్ల ఎదుటే’ ప్రత్యక్ష సాక్ష్యంలోని విషాదాన్ని నిలుపుతాయి. హీబ్రూలోని బహువచన కర్త నుంచి ఏకవచన కర్తకు మార్పును స్పష్టంగా కాపాడాం.
