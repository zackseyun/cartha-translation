source:
  edition: WLC
  text: וְ/אֶת חוֹמֹ֥ת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/010.yaml
  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: te
  text: కాపలాదళాధిపతితో ఉన్న కల్దీయుల సైన్యమంతా యెరూషలేము చుట్టూ ఉన్న ప్రాకారాలను కూల్చివేసింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదవిపేరు ‘రబ్-టబ్బాహీమ్’ను ‘తలారుల అధిపతి’ లేదా ‘అంగరక్షక దళాధిపతి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: ప్రాకారాలు
  rationale: నగరాన్ని చుట్టుముట్టిన రక్షణ గోడలను సూచించే బహువచన రూపం. సైనిక సందర్భంలో ‘ప్రాకారాలు’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: סָבִיב
  choice: చుట్టూ ఉన్న
  rationale: నగరాన్ని అన్ని వైపులా చుట్టిన ప్రాకారాల విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נָתְצוּ
  choice: కూల్చివేసింది
  rationale: నిర్మాణాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే క్రియార్థాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל חֵיל
  choice: సైన్యమంతా
  rationale: כָּל యొక్క సమగ్రతను, חֵיל యొక్క సమూహార్థాన్ని సహజమైన తెలుగు ఏకవచన సమూహ నిర్మాణంతో అందిస్తుంది.
- source_word: כַּשְׂדִּים
  choice: కల్దీయుల
  rationale: మూలంలోని జాతినామాన్ని నేరుగా నిలుపుతుంది; సందర్భానుసారమైన ‘బబులోనీయులు’ అనే సాధారణీకరణను చేయదు.
- source_word: אֲשֶׁר
  choice: తో ఉన్న
  rationale: మునుపటి వచనంలో పేర్కొన్న అధికారితో సైన్యానికి ఉన్న సంబంధాన్ని తెలుగులో సహజంగా పూరిస్తుంది; అధికార నిర్మాణాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: רַב טַבָּחִים
  choice: కాపలాదళాధిపతి
  rationale: రాజసైనిక సందర్భంలో ఉన్నతస్థాయి కాపలా అధికారి అనే పదవిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పదశః ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
