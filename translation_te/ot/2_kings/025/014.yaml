id: 2KI.25.14
reference: 2 Kings 25:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/סִּירֹ֨ת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַֽ/מְזַמְּר֣וֹת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר יְשָֽׁרְתוּ בָ֖/ם לָקָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: te
  text: కుండలను, బూడిద పారలను, దీపాల వత్తులు కత్తిరించే పరికరాలను[a], గిన్నెలను, సేవ చేయడానికి ఉపయోగించే కంచు సామగ్రినంతటినీ వారు తీసుకుపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కత్తులు,” “కొమ్మలు కత్తిరించే కత్తులు.” హీబ్రూ పదం కోసే పరికరాన్ని సూచించవచ్చు; అయితే ఆలయ సామగ్రి సందర్భంలో దీనిని సాధారణంగా దీపాల వత్తులు కత్తిరించే పరికరంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: కుండలను
  rationale: סִירוֹת సాధారణంగా కుండలు లేదా పాత్రలను సూచిస్తుంది; ఆలయ సామగ్రి జాబితాలో ‘కుండలు’ సహజమైన, అతిగా నిర్దిష్టం కాని పదం.
- source_word: הַיָּעִים
  choice: బూడిద పారలను
  rationale: יָעִים బూడిదను తొలగించడానికి లేదా నిప్పులను కదిలించడానికి వాడే పరికరాలు; ‘బూడిద పారలు’ వాటి ఆలయసేవా ప్రయోజనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְזַמְּרוֹת
  choice: దీపపు వత్తులు కత్తిరించే కత్తెరలను
  rationale: ఈ పదం కోసే పరికరాలను సూచించగలిగినా, ఆలయ పాత్రల సందర్భంలో దీపాల వత్తులను సవరించే పరికరాలుగా అర్థం చేసుకోవడం సముచితం; మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: הַכַּפּוֹת
  choice: గిన్నెలను
  rationale: כַּפּוֹת చిన్న పాత్రలు, గిన్నెలు లేదా చెంచా వంటి పాత్రలను సూచించవచ్చు; ఆకారాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘గిన్నెలు’ సులభంగా అర్థమవుతుంది.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: కంచు సామగ్రినంతటినీ
  rationale: כְּלִים అనేది పాత్రలు, పరికరాలు సహా విస్తృతార్థ పదం కాబట్టి ‘సామగ్రి’ సరిపోతుంది; ఈ సందర్భంలో נְחֹשֶׁת‌ను ‘కంచు’గా అనువదించడం యుక్తం.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: ఆలయ సేవలో ఉపయోగించే
  rationale: שרת ఇక్కడ ఆరాధనా లేదా యాజక సేవను సూచిస్తుంది. తెలుగు వాక్యంలో నిర్దిష్టం కాని ‘వారు’ అనే కర్తను రెండుసార్లు పెట్టకుండా, పరికరాల వినియోగాన్ని సహజంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: לָקָחוּ
  choice: వారు తీసుకుపోయారు
  rationale: మూల క్రియ ప్రాథమికంగా ‘తీసుకున్నారు’ అని అర్థమైనా, దోపిడీ చేసి అక్కడి నుండి తొలగించిన సందర్భాన్ని ‘తీసుకుపోయారు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఆలయసేవా సందర్భాన్ని సహజంగా వ్యక్తం చేస్తూ, הַמְזַמְּרוֹת పదంలోని నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికలో పరిరక్షించాం.
