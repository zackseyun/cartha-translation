translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; అయితే అధిపతులు, పేర్ల జాబితా, వారితో ఉన్న మనుషుల మధ్య మూలపాఠ సంబంధాన్ని అలాగే నిలిపాం.
