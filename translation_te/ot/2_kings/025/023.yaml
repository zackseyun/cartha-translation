source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: te
  text: 'సైన్యాధిపతులందరూ, వారూ వారి మనుషులూ, బబులోను రాజు గెదల్యాను నియమించాడని[a] విన్నారు. అప్పుడు వారు మిస్పాలో ఉన్న గెదల్యా దగ్గరికి వచ్చారు: నెతన్యా కుమారుడు ఇష్మాయేలు, కారేహ కుమారుడు యోహానాను, నెటోఫాతీయుడైన తన్హుమెతు కుమారుడు శెరాయా, మయకాతీయుని కుమారుడు యాజన్యా—వీరూ వారి మనుషులూ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గెదల్యాను బాధ్యతలో ఉంచాడని.” హీబ్రూ క్రియ ఒకరిని పర్యవేక్షణ లేదా పరిపాలనా బాధ్యతకు నియమించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: సైన్య దళాల అధిపతులు
  rationale: שָׂרִים నాయకులను లేదా అధికారులను సూచిస్తుంది; ఈ సందర్భంలో חַיִל సైనిక దళాలను సూచిస్తుంది. నిర్దిష్ట సైనిక హోదాను ఊహించకుండా భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: వారూ వారి మనుషులూ
  rationale: ఈ సర్వనామ-నామవాచక నిర్మాణం అధిపతులను వారితో ఉన్న మనుషుల నుంచి వేరుచేస్తూ నొక్కి చెబుతుంది. సైనిక సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הִפְקִיד
  choice: అధికారిగా నియమించాడు
  rationale: ఈ క్రియకు నియమించడం, పర్యవేక్షణ బాధ్యతలో ఉంచడం అనే విస్తృత అర్థం ఉంది. గవర్నరు అనే నిర్దిష్ట పదవిని మూలపాఠం నేరుగా చెప్పకపోవడంతో దాన్ని చేర్చలేదు.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: మిస్పాలో ఉన్న గెదల్యా దగ్గరికి
  rationale: మిస్పా అనేది గెదల్యా ఉన్న స్థలాన్ని సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַנְּטֹפָתִי
  choice: నెటోఫాతీయుడు
  rationale: నెటోఫాకు సంబంధించిన భౌగోళిక లేదా వంశీయ విశేషణాన్ని అనువాదంలో నిలుపుతుంది.
- source_word: הַמַּעֲכָתִי
  choice: మయకాతీయుడు
  rationale: మయకాకు సంబంధించిన మూలపాఠంలోని భౌగోళిక లేదా వంశీయ గుర్తింపును నిలుపుతుంది.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: 'వారు ... వచ్చారు. వారెవరంటే: ఇష్మాయేలు ... యోహానాను ... శెరాయా ... యాజన్యా'
  rationale: పేర్లు ముందున్న సైన్యాధిపతులను వివరించే సమానాధికార జాబితా. తెలుగు పఠన సౌలభ్యం కోసం జాబితాను రెండో వాక్యంలో పరిచయం చేస్తూ మూల సంబంధాన్ని నిలిపింది.
- source_word: וְאַנְשֵׁיהֶם
  choice: వీరూ వీరి మనుషులూ
  rationale: పేరుపేరున చెప్పిన అధిపతులతో వారి మనుషులు కూడా వచ్చారని జాబితా చివర మూలపాఠం మళ్లీ నొక్కి చెబుతుంది; ఆ పునరుక్తిని అనువాదంలో నిలిపింది.
