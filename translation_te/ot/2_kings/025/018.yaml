id: 2KI.25.18
reference: 2 Kings 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: te
  text: అంగరక్షక దళాధిపతి ప్రధాన యాజకుడైన శెరాయాను[a], రెండవ స్థానంలోని యాజకుడైన జెఫన్యాను, గడపను కాపాడే ముగ్గురిని[b] పట్టుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రధాన యాజకుడు’ అనే మాటను ‘మహాయాజకుడు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో పదశః ‘అధిపతి/ప్రధానుడైన యాజకుడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ద్వారపాలకులు’ లేదా ‘ఆలయ ప్రవేశద్వారాన్ని కాపాడేవారు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో పదశః ‘గడపను కాపాడేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: అంగరక్షక దళాధిపతి
  rationale: పదశః భావంలో ‘వధించేవారి అధిపతి’ అనే అంశాలు ఉన్నా, బబులోను రాజసభా-సైనిక సందర్భంలో ఇది రాజ అంగరక్షక దళానికి నాయకుడైన అధికారిని సూచించే బిరుదు.
- source_word: וַיִּקַּח
  choice: పట్టుకున్నాడు
  rationale: לקח సాధారణంగా ‘తీసుకొను’ అని అర్థమైనా, ఇక్కడ ఓడిపోయిన యూదా అధికారులను అదుపులోకి తీసుకున్న సందర్భం కావడంతో ‘పట్టుకున్నాడు’ సహజంగా ఆ బలవంతపు భావాన్ని తెలియజేస్తుంది.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: ప్రధాన యాజకుడు
  rationale: ఇది పదశః ‘అధిపతి/ప్రధానుడైన యాజకుడు’; ప్రముఖ యాజక అధికారిని సూచిస్తుంది. ‘ప్రధాన యాజకుడు’ హెబ్రీ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తుంది.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: రెండవ స్థానంలోని యాజకుడు
  rationale: מִשְׁנֶה రెండవ హోదా లేదా ఉపాధికార స్థితిని సూచిస్తుంది. ఈ అనువాదం ‘ఉప ప్రధాన యాజకుడు’ అనే మరింత వ్యాఖ్యానాత్మక పదవిని చేర్చకుండా హోదా క్రమాన్ని నిలుపుతుంది.
- source_word: שֹׁמְרֵי הַסַּף
  choice: గడపను కాపాడేవారు
  rationale: పదశః ‘గడప కాపలాదారులు.’ వీరు ఆలయ ప్రవేశద్వార కాపలాదారులై ఉండవచ్చు; ప్రధాన పాఠం హెబ్రీలోని స్పష్టమైన గడప రూపకాన్ని నిలుపుతుంది.
- source_word: שְׁלֹשֶׁת
  choice: ముగ్గురు
  rationale: వ్యక్తులను లెక్కిస్తున్నందున ఆధునిక తెలుగులో సహజమైన మానవవాచక సంఖ్యారూపం.
- source_word: שְׂרָיָה
  choice: శెరాయా
  rationale: హెబ్రీ వ్యక్తినామానికి అనుగుణమైన తెలుగు లిప్యంతరీకరణ.
- source_word: צְפַנְיָהוּ
  choice: జెఫన్యా
  rationale: హెబ్రీ వ్యక్తినామానికి అనుగుణమైన, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: כֹּהֵן הָרֹאשׁ అనే యాజక హోదా
  choice: ప్రధాన యాజకుడు
  alternative: మహాయాజకుడు
  rationale: ‘మహాయాజకుడు’ సందర్భానుకూలమైన సాధ్య అనువాదమే అయినా, మూలంలోని ‘యాజకుడు, అధిపతి/ప్రధానుడు’ అనే నిర్మాణాన్ని ‘ప్రధాన యాజకుడు’ మరింత ప్రత్యక్షంగా నిలుపుతుంది; తరువాతి కాలపు సాంకేతిక పదప్రయోగాన్ని అనవసరంగా ముందుకు తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. చారిత్రక అధికార బిరుదులను అతిగా పదశః చేయకుండా, యాజక హోదాలు మరియు ఆలయ గడపకు సంబంధించిన మూలభాషా స్పష్టతను నిలుపుకున్నాం.
