translation:
  language: te
  text: ఆ పట్టణం సిద్కియా రాజు పరిపాలన పదకొండవ సంవత్సరం వరకు ముట్టడిలోనే ఉండిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
