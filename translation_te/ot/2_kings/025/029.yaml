  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: te
  text: అతడు తన చెరసాల దుస్తులు మార్చుకున్నాడు. తన జీవితకాలమంతా ఎల్లప్పుడూ రాజు ఎదుట[a] భోజనం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “అతని ఎదుట”; ఈ మాట రాజు బల్ల దగ్గర భోజనం చేయడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: మార్చుకున్నాడు
  rationale: పీయేల్ రూపంలోని שׁנה ఇక్కడ ‘మార్చడం’ అనే అర్థం ఇస్తుంది. దుస్తుల సందర్భంలో ‘మార్చుకున్నాడు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: తన చెరసాల దుస్తులు
  rationale: బిగ్దే అంటే ‘దుస్తులు,’ కిల్ఓ అంటే అతని నిర్బంధం లేదా చెర. ‘చెరసాల దుస్తులు’ మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָכַל לֶחֶם
  choice: భోజనం చేశాడు
  rationale: అక్షరార్థంగా ‘రొట్టె తిన్నాడు.’ అయితే హీబ్రూ ప్రయోగంలో ఇది సాధారణంగా భోజనం చేయడాన్ని సూచిస్తుంది; తెలుగులో ‘భోజనం చేశాడు’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: ఈ పదం కొనసాగుతున్న లేదా క్రమమైన కార్యాన్ని సూచిస్తుంది. రాజసభలో అతనికి నిరంతరం లభించిన భోజన ఏర్పాటును ‘ఎల్లప్పుడూ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְפָנָיו
  choice: అతని సమక్షంలో
  rationale: అక్షరార్థం ‘అతని ఎదుట.’ సందర్భంలో ఇది రాజు సమక్షంలో, బహుశా రాజు బల్ల దగ్గర, భోజనం చేయడాన్ని సూచిస్తుంది. ప్రధాన పాఠం మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כָּל יְמֵי חַיָּיו
  choice: తన జీవితకాలమంతా
  rationale: ‘అతని జీవితంలోని రోజులన్నీ’ అనే హీబ్రూ నుడికారానికి ఇది సహజమైన, అర్థనిష్ఠమైన తెలుగు రూపం.
