translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండు క్రియలను రెండు వాక్యాలుగా ఇచ్చి తెలుగు పఠనసౌలభ్యం పెంచబడింది. לְפָנָיו అనే పదబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా, దాని రాజభోజన సూచనను పాదటిప్పణిలో ఉంచాం.
