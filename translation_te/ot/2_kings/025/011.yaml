  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ జాబితా క్రమాన్ని నిలుపుతూ, అధికారిక బిరుదుకు కార్యార్థ అనువాదం ఉపయోగించబడింది.
