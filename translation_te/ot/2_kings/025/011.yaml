source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: te
  text: కాపలా దళాధిపతి నెబూజరదాను[b] నగరంలో మిగిలి ఉన్న ప్రజల శేషాన్ని, బబులోను రాజు పక్షానికి వెళ్లినవారిని[a], మిగిలిన జనసమూహాన్ని[c] చెరగా తీసుకువెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బబులోను రాజు మీదికి పడిపోయినవారు.” ఇక్కడ ఈ మాట బబులోను రాజు పక్షానికి వెళ్లినవారిని సూచిస్తుంది; “లొంగిపోయినవారు” లేదా “పక్షం మారినవారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఈ పదవి పేరు అక్షరార్థంగా “వధకుల అధిపతి”; ఇది బహుశా రాజ కాపలా దళాధిపతిని సూచించే అధికారిక బిరుదు.
    reason: cultural_note
  - marker: c
    text: “మిగిలిన జనసమూహం” అనే మాటను “మిగిలిన గుంపు” లేదా “మిగిలిన జనాభా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: నగరంలో మిగిలివున్న ప్రజల్లో మిగతావారిని
  rationale: ముట్టడి తరువాత నగరంలో ఇంకా మిగిలిన ప్రజలలోని శేషాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: బబులోను రాజు పక్షానికి చేరిన వారిని
  rationale: సైనిక-రాజకీయ సందర్భంలో נפל על అనే ప్రయోగం అక్షరార్థంగా పడిపోవడాన్ని కాక, ప్రత్యర్థి రాజు పక్షానికి వెళ్లడాన్ని సూచిస్తుంది. ‘పక్షానికి చేరినవారు’ అనేది వారు పారిపోయినవారా, లొంగిపోయినవారా అనే అంశాన్ని అతిగా నిర్ధారించదు.
- source_word: יֶתֶר הֶהָמוֹן
  choice: మిగిలిన జనసమూహాన్ని
  rationale: הָמוֹן అనే విస్తృత సమూహార్థాన్ని ‘జనసమూహం’ సహజంగా తెలియజేస్తుంది; ప్రత్యేక సామాజిక వర్గాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: הֶגְלָה
  choice: చెరగా తరలించాడు
  rationale: గלה హిఫిల్ రూపంలోని బలవంతపు దేశాంతరవాస భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רַב טַבָּחִים
  choice: కాపలా దళాధిపతి
  rationale: అక్షరార్థం తప్పుదారి పట్టించే అవకాశం ఉన్నందున, బబులోను రాజసభలోని అధికారిక సైనిక పదవిని దాని కార్యార్థంతో అందిస్తుంది.
- source_word: נְבוּזַרְאֲדָן
  choice: నెబూజరదాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సులభంగా చదవదగిన లిప్యంతరీకరణ.
