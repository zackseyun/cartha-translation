  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: te
  text: అయితే దేశంలోని అత్యంత పేదవారిలో కొందరిని ద్రాక్షతోటల్లో పనిచేసేవారిగాను, పొలాల్లో పనిచేసేవారిగాను[a] రాజ అంగరక్షక దళాధిపతి[b] అక్కడే ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పొలాలు దున్నేవారిగాను’ లేదా ‘వ్యవసాయం చేసేవారిగాను.’ ఇక్కడి హీబ్రూ పదం నేలపై వ్యవసాయ పని చేసేవారిని విస్తృతంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః ‘వధకుల అధిపతి.’ ఈ సందర్భంలో ఇది బబులోను రాజు యొక్క అంగరక్షక దళాధిపతి బిరుదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: అయితే దేశంలోని అత్యంత పేదవారిలో కొందరిని
  rationale: మִן పూర్వప్రత్యయం సమూహంలోనుంచి కొందరనే భాగార్థాన్ని ఇస్తుంది; דַּלַּת సందర్భంలో అత్యంత పేద ప్రజలను సూచిస్తుంది. ముందటి వచనంలోని బహిష్కరణకు వ్యత్యాసంగా וּ ను ‘అయితే’ అని సహజంగా అనువదించాం.
- source_word: הִשְׁאִיר
  choice: అక్కడే ఉంచాడు
  rationale: హిఫీల్ రూపం ‘మిగిల్చాడు/ఉండనిచ్చాడు’ అనే భావాన్ని ఇస్తుంది. బబులోనీయులు వారిని దేశంలోనే వదిలి ఉంచిన సందర్భాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רַב טַבָּחִים
  choice: రాజ అంగరక్షక దళాధిపతి
  rationale: పదశః ఇది ‘వధకుల అధిపతి’కి సమీపమైనా, బబులోను రాజసభ సైనిక సందర్భంలో రాజ అంగరక్షక దళానికి అధిపతిగా ఉన్న అధికారిని సూచిస్తుంది.
- source_word: לְכֹרְמִים
  choice: ద్రాక్షతోటల్లో పనిచేసేవారిగా
  rationale: כֹּרְמִים ద్రాక్షతోటలను సాగుచేసే లేదా వాటిలో పనిచేసే వారిని సూచిస్తుంది. ఆధునిక పాఠకులకు ఈ విస్తృత పదబంధం సహజంగా అర్థమవుతుంది.
- source_word: וּלְיֹגְבִים
  choice: పొలాల్లో పనిచేసేవారిగా
  rationale: అరుదైన יֹגְבִים పదం నేలను దున్నే లేదా సాధారణ వ్యవసాయ శ్రమ చేసే వారిని సూచించే అవకాశముంది. ఒక నిర్దిష్ట పనికే అర్థాన్ని కుదించకుండా విస్తృత వ్యవసాయ భావాన్ని నిలిపాం.
