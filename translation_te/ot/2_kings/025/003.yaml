translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని పదక్రమానికి సాధ్యమైనంత దగ్గరగా ఉంటూనే సహజ తెలుగు వాక్యనిర్మాణం పాటించబడింది; పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
