  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: te
  text: నెల తొమ్మిదో రోజున నగరంలో కరవు తీవ్రమైంది; దేశ ప్రజలకు[b] రొట్టె[a] లేకపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహారం.” “రొట్టె”కు వాడిన హీబ్రూ పదం జీవనాధారమైన ఆహారాన్ని విస్తృతంగా కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “దేశ ప్రజలు” అనే మాట కొన్ని సందర్భాల్లో మరింత నిర్దిష్టంగా సామాన్య ప్రజలను లేదా స్థానిక జనాభాను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: ఆ నెల తొమ్మిదో రోజున
  rationale: హీబ్రూ వాక్యంలో ‘నెలలో తొమ్మిదవ తేదీన’ అనే కాలసూచన ఉంది. సహజమైన ఆధునిక తెలుగులో ‘రోజు’ను స్పష్టంగా చేర్చడం భావాన్ని మార్చదు.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: కరవు తీవ్రమైంది
  rationale: חזק అనే క్రియకు ప్రాథమికంగా ‘బలపడు’ అనే భావం ఉన్నా, కరవు సందర్భంలో అది మరింత తీవ్రం కావడాన్ని సూచిస్తుంది.
- source_word: בָּעִיר
  choice: నగరంలో
  rationale: సరళమైన స్థానసూచక అనువాదం; ముట్టడి సందర్భంలోని నగరాన్ని సూచిస్తుంది.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: రొట్టె లేకపోయింది
  rationale: לֶחֶם యొక్క ప్రత్యక్ష అర్థమైన ‘రొట్టె’ను ప్రధాన పాఠ్యంలో నిలిపి, అది విస్తృతంగా ఆహారాన్ని కూడా సూచించగలదని పాదసూచికలో తెలిపాం.
- source_word: לְעַם הָאָרֶץ
  choice: దేశ ప్రజలకు
  rationale: మూలంలోని ‘దేశపు ప్రజలు’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘సామాన్య ప్రజలు’ అనే సంకుచిత సామాజిక అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ధారించదు.
