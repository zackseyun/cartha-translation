source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: te
  text: యాహ్వే మందిరంలో ఉన్న కంచు స్తంభాలను, ఆధారాలను[b], అలాగే యాహ్వే మందిరంలో ఉన్న కంచు సముద్రాన్ని కల్దీయులు[a] ముక్కలుగా చేసి, వాటి కంచును బబులోనుకు తీసుకెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కల్దీయులు’ అంటే ఇక్కడ బబులోను సైనిక బలగాలు.
    reason: cultural_note
  - marker: b
    text: ‘ఆధారాలు’కు బదులుగా ‘పీఠాలు’ అని కూడా అనువదించవచ్చు; ఇవి ఆలయపు కడుగు తొట్టెలను మోసే నిర్మాణాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: కంచు స్తంభాలు
  rationale: עַמּוּדִים అంటే స్తంభాలు; ఆలయ లోహ వస్తువుల సందర్భంలో נְחֹשֶׁתను ఆధునికంగా, సహజంగా ‘కంచు’ అని అనువదించాం.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: యాహ్వే మందిరంలో ఉన్న
  rationale: హీబ్రూలో క్రియలేని సంబంధ వాక్యభాగం ఉంది; సందర్భం వస్తువుల స్థానాన్ని సూచిస్తున్నందున తెలుగులో సహజంగా ‘మందిరంలో ఉన్న’ అని వ్యక్తం చేశాం.
- source_word: הַמְּכֹנוֹת
  choice: పీఠాలు
  rationale: ఇది ఆలయపు కడుగుడు తొట్టెలను మోసే ఆధార నిర్మాణాలను సూచిస్తుంది; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘పీఠాలు’ అని ఇచ్చాం, ‘ఆధారాలు’ కూడా సాధ్యమే.
- source_word: יָם הַנְּחֹשֶׁת
  choice: కంచు సముద్రం
  rationale: יָם అక్షరార్థంగా ‘సముద్రం’; ఇది ఆలయంలోని పెద్ద నీటి తొట్టెకు ప్రత్యేక నామం కాబట్టి మూలంలోని రూపకాన్ని నిలిపాం.
- source_word: שִׁבְּרוּ
  choice: ముక్కలుగా చేసి
  rationale: రవాణా కోసం పెద్ద కంచు వస్తువులను పగులగొట్టడాన్ని సూచించే క్రియాబలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַשְׂדִּים
  choice: కల్దీయులు
  rationale: మూలంలోని నిర్దిష్ట జాతి/రాజకీయ పేరును నిలిపాం; సందర్భంలో వీరు బబులోను సైనిక బలగాలు.
- source_word: וַיִּשְׂאוּ
  choice: తీసుకెళ్లారు
  rationale: నשא ఇక్కడ దోపుడుసొత్తుగా మోసుకెళ్లడాన్ని సూచిస్తుంది; గమ్యస్థానంతో కలిపి ఇది సహజమైన తెలుగు.
- source_word: נְחֻשְׁתָּם
  choice: వాటి కంచు
  rationale: మూడవ పురుష బహువచన ప్రత్యయం పగులగొట్టబడిన వస్తువులను సమష్టిగా సూచిస్తుంది.
- source_word: בָּבֶלָה
  choice: బబులోనుకు
  rationale: దిశను సూచించే హీబ్రూ అంత్యప్రత్యయాన్ని తెలుగులో గమ్యార్థక ‘-కు’తో వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడాం. హీబ్రూ వాక్యంలోని ముందుకు తెచ్చిన కర్మలను తెలుగులో సహజ క్రమంలో ఉంచి, ‘కంచు సముద్రం’ అనే ఆలయ ప్రత్యేక నామాన్ని నిలిపాం.
