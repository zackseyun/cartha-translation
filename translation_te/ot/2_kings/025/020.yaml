id: 2KI.25.20
reference: 2 Kings 25:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: te
  text: అప్పుడు అంగరక్షక దళాధిపతియైన[a] నెబూజరదాను వారిని తీసుకొని, రిబ్లాలో ఉన్న బబులోను రాజు వద్దకు తీసుకెళ్లాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం పదశః ‘వధించేవారి అధిపతి’; ఇది బహుశా రాజ సైనిక లేదా భద్రతా అధికార పదవి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘రిబ్లాలో ఉన్న బబులోను రాజు సమక్షానికి తీసుకెళ్లాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: పట్టుకొని
  rationale: לקח అనే క్రియకు మూలంగా ‘తీసుకొను’ అనే అర్థం ఉన్నా, ఇప్పటికే నిర్బంధంలో ఉన్న వారిని అధికారి తన అదుపులోకి తీసుకున్న సందర్భాన్ని తెలుగులో సహజంగా ‘పట్టుకొని’ తెలియజేస్తుంది; ‘బంధించాడు’ లేదా ‘స్వాధీనం చేసుకున్నాడు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని భావం చేరవచ్చు.
- source_word: נְבוּזַרְאֲדָן
  choice: నెబూజరదాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: רַב טַבָּחִים
  choice: అంగరక్షక దళాధిపతి
  rationale: పదశః ‘వధించేవారి అధిపతి’; అయితే నూతన బబులోను రాజసభ సందర్భంలో ఇది రాజ సైనిక/భద్రతా అధికార పదవిని సూచిస్తుంది. ‘అంగరక్షక దళాధిపతి’ ఆధునిక తెలుగులో ఆ పదవిని సహజంగా తెలియజేస్తుంది; పదశః అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיֹּלֶךְ
  choice: తీసుకెళ్లాడు
  rationale: הלך యొక్క ఈ కారక రూపం, కర్మ మరియు గమ్యస్థానంతో కలిసి, వారిని వెళ్లేలా చేయడం లేదా నడిపించడం అనే భావం ఇస్తుంది. తెలుగు దృష్టికోణంలో ‘తీసుకెళ్లాడు’ సహజమైన సమానార్థకం.
- source_word: עַל
  choice: దగ్గరికి
  rationale: చలన క్రియతో వ్యక్తిని సూచించే ఈ ఉపసర్గ, ఆ వ్యక్తి సన్నిధికి తీసుకెళ్లడాన్ని తెలియజేస్తుంది. ‘దగ్గరికి’ సహజమైన తెలుగు; ‘సమక్షానికి’ అనే మరింత నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: హీబ్రూ సంయుక్త నామపదబంధానికి నేరమైన, తెలుగులో స్థిరమైన రూపం.
- source_word: רִבְלָתָה
  choice: రిబ్లాలో ఉన్న
  rationale: దిశ/స్థల సూచక అంత్యప్రత్యయం ఉన్న ప్రదేశనామం ఇక్కడ రాజు ఉన్న స్థలాన్ని సూచిస్తుంది. పూర్తి వాక్యంలో ‘రిబ్లాలో ఉన్న’ అనడం స్థల సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అంగరక్షక దళాధిపతి’ అధికార పదవిని సాధారణ పాఠకుడికి అర్థమయ్యేలా అందిస్తుంది. మూలంలోని చలన భావాన్ని ‘తీసుకెళ్లాడు’గా, రాజు ఉన్న ప్రదేశాన్ని ‘రిబ్లాలో ఉన్న’గా స్పష్టీకరించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన వచనంలో ఉంది.
