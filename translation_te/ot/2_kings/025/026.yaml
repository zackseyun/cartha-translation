source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: te
  text: అప్పుడు అల్పుల నుంచి గొప్పవారి వరకు ప్రజలందరూ, సైన్యాధిపతులు[a] లేచి ఐగుప్తుకు వెళ్లారు, ఎందుకంటే వారు కల్దీయులకు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సైనిక దళాల అధికారులు’ లేదా ‘దళాల నాయకులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום క్రియ ఇక్కడ తదుపరి నిర్ణయాత్మక చర్యను ప్రారంభించే కథన క్రమాన్ని సూచిస్తుంది. ‘లేచి’ అనేది శారీరకంగా నిలబడటానికి మాత్రమే పరిమితం చేయకుండా సహజంగా ఆ క్రమాన్ని నిలుపుతుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూ సమూహార్థక పదబంధంలోని సమగ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: అల్పుల నుంచి గొప్పవారి వరకు
  rationale: ఇది కేవలం వయస్సును కాక, హోదా లేదా ప్రాముఖ్యతలోని మొత్తం పరిధిని సూచించే నానుడి. ఈ భావాన్ని ‘అల్పుల నుంచి గొప్పవారి వరకు’ విస్తృతంగా నిలుపుతుంది.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: సైన్యాధిపతులు
  rationale: שָׂרֵי నాయకులను లేదా అధికారులను, חֲיָלִים ఇక్కడ సైనిక దళాలను సూచిస్తాయి. ‘సైన్యాధిపతులు’ సంక్షిప్తంగా, స్పష్టంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: ఐగుప్తుకు వెళ్లారు
  rationale: בוא అక్షరార్థంగా ‘వచ్చారు’ కావచ్చు; అయితే కథకుని దృక్కోణంలో గమ్యస్థానమైన ఐగుప్తుకు ప్రయాణించడాన్ని తెలుగులో ‘వెళ్లారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు ఐగుప్తుకు వెళ్లడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: יָרְאוּ
  choice: భయపడ్డారు
  rationale: ఇక్కడ ירא భయాన్ని సూచిస్తుంది; ‘భయపడ్డారు’ సాధారణ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: కల్దీయులకు
  rationale: ירא తో కూడిన מִפְּנֵי ఎవరిని చూసి లేదా ఎవరి కారణంగా భయపడ్డారో సూచిస్తుంది. తెలుగులో ‘కల్దీయులకు భయపడ్డారు’ సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
