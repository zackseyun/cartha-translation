translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. సామాజిక హోదా లేదా ప్రాముఖ్యతను సూచించే హీబ్రూ నానుడిని వయస్సుకు పరిమితం చేయకుండా అనువదించాం. పాదసూచిక గుర్తును అది వివరించే ‘సైన్యాధిపతులు’ అనే పదం వద్ద ఉంచాం.
