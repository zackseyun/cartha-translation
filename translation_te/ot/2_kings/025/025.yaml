  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: te
  text: 'ఏడవ నెలలో ఇలా జరిగింది: రాజవంశ సంతతికి చెందిన[a] ఎలీషామా కుమారుడైన నెతన్యా కుమారుడు ఇష్మాయేలు తనతో పదిమందిని తీసుకొని వచ్చాడు. వారు గెదల్యాను కొట్టారు, అతడు చనిపోయాడు; మిస్పాలో అతనితో ఉన్న యూదా ప్రజలనూ కల్దీయులనూ[b] కొట్టారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజవంశపు విత్తనం నుండి”; అంటే రాజవంశ సంతతికి చెందినవాడు.
    reason: lexical_alternative
  - marker: b
    text: ఈ సందర్భంలో “కల్దీయులు” అనే పదాన్ని “బబులోనీయులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఏడవ నెలలో
  rationale: హీబ్రూ కథనారంభ సూత్రమైన וַיְהִיని తెలుగులో విడిగా ‘జరిగింది’ అని అనువదించడం అసహజంగా ఉంటుంది; కాలసూచనతో నేరుగా కథనాన్ని ప్రారంభించడం దాని కథన విధిని సహజంగా అందిస్తుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: కాలాన్ని సూచించే మూలభాషా పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: రాజవంశ సంతతికి చెందినవాడైన
  rationale: అక్షరార్థంలోని ‘విత్తనం’ అనే వంశసూచక రూపకాన్ని అసహజంగా దిగుమతి చేయకుండా, రాజకుటుంబ వంశావళికి చెందినవాడనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: పదిమంది మనుషులతో
  rationale: తోడుగా వచ్చిన పదిమందిని తెలుగు వాక్యనిర్మాణంలో సహజంగా కదలిక క్రియతో కలుపుతుంది.
- source_word: וַיַּכּוּ ... וַיָּמֹת
  choice: వారు గెదల్యాను కొట్టారు, అతడు చనిపోయాడు
  rationale: נכה అనే హింసాత్మక చర్యను, దాని తరువాత వచ్చే ఏకవచన మరణవాక్యాన్ని వేర్వేరుగా నిలిపి హీబ్రూ క్రమాన్ని కాపాడుతుంది.
- source_word: הַיְּהוּדִים
  choice: యూదావారు
  rationale: ఈ రాజ్యపతన, చెరసందర్భంలో యూదా ప్రాంతం/ప్రజలకు చెందినవారు అనే చారిత్రక-భౌగోళిక భావాన్ని తెలియజేస్తుంది.
- source_word: הַכַּשְׂדִּים
  choice: కల్దీయులు
  rationale: మూలంలోని జాతినామాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది బబులోనీయులను సూచించవచ్చు.
- source_word: בַּמִּצְפָּה
  choice: మిస్పాలో
  rationale: పేరుగల స్థలంలో జరిగిన సంఘటనను తెలుగులో సహజమైన స్థానవిభక్తితో వ్యక్తపరుస్తుంది.
