translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. వంశావళి సంబంధాలు తెలుగు పాఠకునికి వెంటనే అర్థమయ్యే క్రమంలో అమర్చబడ్డాయి. గెదల్యా విషయంలో ‘కొట్టారు, అతడు చనిపోయాడు’ అని మూలంలోని రెండు వరుస క్రియలు నిలుపబడ్డాయి; తరువాతి సమూహాలపై వర్తించే ఎలిప్సిస్‌ను సహజ తెలుగులో ‘హతమార్చారు’ అని స్పష్టం చేయబడింది.
