id: 2KI.25.21
reference: 2 Kings 25:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣ךְ אֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִיתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: te
  text: బబులోను రాజు హమాతు దేశంలోని రిబ్లాలో వారిని కొట్టి, చంపివేశాడు[a]. అలా యూదా తన దేశం నుండి చెరలోకి తీసుకుపోబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిని హతమార్చాడు.’ హెబ్రీలో ‘వారిని కొట్టాడు,’ ‘వారిని చంపివేశాడు’ అనే రెండు క్రియలు వరుసగా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యూదా తన దేశం నుండి చెరలోకి వెళ్లింది.’ సందర్భంలో హెబ్రీ క్రియను కర్తృప్రయోగంగానూ కర్మణిప్రయోగంగానూ అనువదించవచ్చు; కర్మణిప్రయోగం బలవంతంగా తరలించబడడాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ אֹתָם
  choice: వారిని కొట్టి
  rationale: నכה అనే క్రియకు ‘కొట్టు’ అనే ప్రాథమిక భావం ఉంది. వెంటనే వచ్చే ‘చంపించాడు’ అనే రెండో క్రియతో కలిపివేయకుండా, హెబ్రీలోని రెండు వరుస చర్యలను ఈ అనువాదం నిలుపుతుంది.
- source_word: וַיְמִיתֵם
  choice: చంపించాడు
  rationale: హిఫీల్ రూపం ‘చనిపోయేలా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. రాజే వారిని చంపేలా చేశాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘చంపించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: హెబ్రీ సమాస నిర్మాణానికి నేరుగా సరిపడే, తెలుగులో సహజమైన రూపం.
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: హమాతు దేశంలోని రిబ్లాలో
  rationale: రిబ్లా హమాతు ప్రాంతంలో ఉన్న స్థలమని స్పష్టంగా, సహజమైన తెలుగు భౌగోళిక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: וַיִּגֶל
  choice: చెరలోకి తీసుకుపోబడింది
  rationale: గלה ఇక్కడ బలవంతపు దేశబహిష్కరణను సూచిస్తుంది. కర్తృప్రయోగం, కర్మణిప్రయోగం రెండూ సందర్భంలో సాధ్యమైనప్పటికీ, ఈ రూపం బలవంతంగా తరలించబడిన భావాన్ని ముందుకు తెస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: హెబ్రీలో ఉన్న సంక్షిప్త నామరూపాన్ని అలాగే ఉంచి, అది దేశాన్నా ప్రజలనన్నా సూచించే సందర్భోచిత విస్తృతిని కాపాడుతుంది.
- source_word: מֵעַל אַדְמָתוֹ
  choice: తన దేశం నుండి
  rationale: אדמה పదానికి నేల, భూమి, దేశం అనే భావాలు ఉండవచ్చు. చెర సందర్భంలో ‘దేశం’ సహజంగా సరిపోతుంది; ‘తన’ అనే రూపం యూదాతో ఉన్న సంబంధాన్ని తెలుగులో సూటిగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హెబ్రీలోని రెండు హింసాత్మక క్రియలు వేర్వేరుగా నిలుపబడ్డాయి; ‘యూదా’ అనే పేరులోని దేశం/ప్రజలు అనే సూచనాత్మక విస్తృతి సంకుచితం చేయబడలేదు.
