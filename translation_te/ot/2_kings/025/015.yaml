  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: te
  text: అగ్నిపాత్రలను[a], గిన్నెలను[b]—ఏవి బంగారమైనవో వాటిని బంగారమైనవిగా, ఏవి వెండివో వాటిని వెండివిగా[c]—అంగరక్షక దళాధిపతి[d] తీసుకుపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధూపపాత్రలను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బేసిన్లను.’
    reason: lexical_alternative
  - marker: c
    text: 'హెబ్రీలో పదార్థాల పేర్లు పునరుక్తమవుతాయి: ‘బంగారమైనది—బంగారం; వెండిదైనది—వెండి.’ ఇది వాటిని తయారైన పదార్థం ప్రకారం వర్గీకరించడాన్ని నొక్కిచెబుతుంది.'
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘వధకుల అధిపతి’; ‘రాజ అంగరక్షక దళాధిపతి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: అగ్నిపాత్రలను
  rationale: ఆలయ సేవలో నిప్పుకణాలు లేదా ధూపం మోయడానికి ఉపయోగించే పాత్రలను సూచిస్తుంది. ‘అగ్నిపాత్రలు’ మూలపద పరిధిని అతిగా సంకుచితం చేయకుండా సహజంగా తెలియజేస్తుంది; ‘ధూపపాత్రలు’ సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: הַמִּזְרָקוֹת
  choice: గిన్నెలను
  rationale: బలి సంబంధ ద్రవాలను పట్టుకోవడానికి లేదా చల్లడానికి ఉపయోగించే పాత్రలు. ఆధునిక తెలుగులో ‘గిన్నెలు’ సహజంగా ఉంది; ‘పళ్లెములు/పాత్రలు’ కంటే ఆకృతిని తక్కువగా నిర్దేశిస్తుంది.
- source_word: אֲשֶׁר זָהָב זָהָב
  choice: బంగారంతో చేసినవాటిని బంగారంగా
  rationale: మూలంలోని ‘బంగారం—బంగారం’ అనే పునరుక్తి వస్తువులను వాటి పదార్థం ప్రకారం వర్గీకరిస్తుంది. తెలుగులో అర్థవంతంగా ఉండేలా ఆ వర్గీకరణను, పునరుక్త భావాన్ని నిలిపింది.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: వెండితో చేసినవాటిని వెండిగా
  rationale: వెండి వస్తువులను పదార్థం ప్రకారం వర్గీకరించే హెబ్రీ పునరుక్తిని సహజమైన తెలుగులో నిలిపింది.
- source_word: לָקַח
  choice: తీసుకుపోయాడు
  rationale: మూల క్రియ ప్రాథమికంగా ‘తీసుకున్నాడు’ అని అర్థం. దోపిడీ సందర్భంలో వస్తువులను అక్కడి నుంచి తరలించిన భావాన్ని ‘తీసుకుపోయాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רַב טַבָּחִים
  choice: అంగరక్షక దళాధిపతి
  rationale: ఇది బబులోను రాజసేవలోని అధికారిక బిరుదు. పదశః ‘వధకుల అధిపతి’ అనే అర్థసంభావన ఉన్నప్పటికీ, సందర్భంలో రాజ అంగరక్షక దళపు అధికారి అనే కార్యార్థం అనుకూలం.
