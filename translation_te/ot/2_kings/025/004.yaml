  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה הַ/לַּ֨יְלָה֙ דֶּ֜רֶךְ שַׁ֣עַר בֵּ֣ין הַ/חֹמֹתַ֗יִם אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּ֖לֶךְ דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: te
  text: అప్పుడు నగరానికి గండి పడింది. యోధులందరూ రాత్రివేళ రాజు తోట పక్కన ఉన్న రెండు ప్రాకారాల మధ్యనున్న ద్వారం గుండా పారిపోయారు[d]. కల్దీయులు[a] నగరాన్ని నలువైపులా చుట్టుముట్టి ఉన్నారు; రాజు[b] అరాబా[c] మార్గంగా వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కల్దీయులు’ అనే పదానికి బదులుగా ‘బబులోనీయులు’ అని కూడా చెప్పవచ్చు. హీబ్రూ మూలంలో నిర్దిష్టంగా ‘కల్దీయులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతడు.’ హీబ్రూలో కర్త స్పష్టంగా చెప్పబడలేదు; సందర్భం రాజును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అరాబా అనేది యొర్దాను లోయ నుండి దక్షిణంగా విస్తరించిన భౌగోళిక పల్లపు ప్రాంతం; సంప్రదాయంగా దీనిని ‘మైదానం’ అని కూడా అనువదించారు.
    reason: cultural_note
  - marker: d
    text: ‘పారిపోయారు’ అనే క్రియ హీబ్రూ వాక్యంలో స్పష్టంగా లేదు; వాక్యనిర్మాణం, సందర్భం ప్రకారం ఇక్కడ చేర్చబడింది.
    reason: textual_clarity
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: నగరానికి గండి పడింది
  rationale: బקע నిఫాల్ రూపం ముట్టడి సందర్భంలో నగర రక్షణ ఛేదించబడడాన్ని సూచిస్తుంది. తెలుగు సైనిక సందర్భంలో ‘గండి పడింది’ సహజంగా ఉండి, హీబ్రూ వాక్యంలో ‘ప్రాకారం’ స్పష్టంగా లేకపోవడాన్ని కూడా గౌరవిస్తుంది.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: యోధులందరూ
  rationale: అక్షరార్థంగా ‘యుద్ధపు మనుషులు.’ ‘యోధులు’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా సైనిక భావాన్ని తెలియజేస్తుంది.
- source_word: הַלַּיְלָה
  choice: రాత్రివేళ
  rationale: ఇక్కడ క్రియావిశేషణంగా వాడబడింది; ‘రాత్రివేళ’ సహజమైన కథన తెలుగు.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: రెండు ప్రాకారాల మధ్య ద్వారం గుండా
  rationale: ద్వివచన రూపం రెండు ప్రాకారాలను స్పష్టంగా సూచిస్తుంది. ‘ద్వారం గుండా’ మార్గ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: రాజు తోట పక్కన ఉన్న
  rationale: ఈ స్థలవివరణలో עַל సమీపాన్ని సూచిస్తుంది; ‘పక్కన’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: וְכַשְׂדִּים
  choice: కల్దీయులు
  rationale: మూల హీబ్రూ నిర్దిష్టంగా కల్దీయులనే పేర్కొంటుంది; చారిత్రకంగా బబులోనీయ సైన్యాన్ని సూచించినా మూలపదాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: עַל הָעִיר סָבִיב
  choice: నగరాన్ని నలువైపులా చుట్టుముట్టి
  rationale: סָבִיב తెలిపే సంపూర్ణ ముట్టడి భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: రాజు … వెళ్లాడు
  rationale: హీబ్రూలో కర్త అంతర్లీనంగా ఉంది. సందర్భం రాజునే సూచిస్తున్నందున పాఠకునికి స్పష్టత కోసం ‘రాజు’ అని పేర్కొన్నాం; ఈ నిర్ణయాన్ని పాదటిప్పణిలో తెలియజేశాం.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: అరాబా వైపు వెళ్లే మార్గంలో
  rationale: అరాబాను సాధారణ ‘మైదానం’గా మార్చకుండా భౌగోళిక నామంగా ఉంచాం. ఈ సందర్భంలో דרך గమ్యదిశతో కూడిన మార్గాన్ని సూచిస్తుంది.
