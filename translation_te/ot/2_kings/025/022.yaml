  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/עָ֗ם הַ/נִּשְׁאָר֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה אֲשֶׁ֣ר הִשְׁאִ֔יר נְבֽוּכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יַּפְקֵ֣ד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: te
  text: యూదా దేశంలో మిగిలి ఉన్న ప్రజల మీద బబులోను రాజైన నెబుకద్నెజరు, తాను అక్కడ విడిచిపెట్టిన వారిపై, షాఫాను కుమారుడైన అహీకాము కుమారుడు గెదల్యాను నియమించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַנִּשְׁאָר
  choice: మిగిలిన ప్రజలను
  rationale: నిఫాల్ కృదంతం యూదాలో ఇంకా మిగిలి ఉన్న ప్రజలను వర్ణిస్తుంది; ‘శేషం’ వంటి వేదాంతపరమైన భావభారాన్ని అనవసరంగా చేర్చదు.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: యూదా దేశంలో
  rationale: భౌగోళిక ప్రాంతాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: అక్కడ విడిచిపెట్టినవారిని
  rationale: שׁאר హిఫిల్ రూపంలోని కారణార్థాన్ని, నెబుకద్నెజరు వారిని దేశంలోనే ఉంచిన భావాన్ని కాపాడుతుంది.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు నెబుకద్నెజరు
  rationale: రాజబిరుదును సహజమైన తెలుగు పదక్రమంలో నిలుపుతూ వ్యక్తినామాన్ని ప్రమాణ తెలుగు లిప్యంతరీకరణలో ఇస్తుంది.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: అతడు ... అధికారంలో ఉంచాడు
  rationale: పరిపాలనా సందర్భంలో פקד עַל అనేది ఒకరిని ప్రజలపై పర్యవేక్షణ లేదా అధికార బాధ్యతలో నియమించడాన్ని సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: షాఫాను కుమారుడైన అహీకాము కుమారుడు గెదల్యా
  rationale: హీబ్రూ వంశావళి శ్రేణిని పూర్తిగా కాపాడుతూ తెలుగులో సంబంధాలు స్పష్టంగా ఉండే పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: וְ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యారంభం
  rationale: ఇది కథనంలోని అంశమార్పును సూచిస్తుంది; తెలుగులో ‘ఇక’ను చేర్చకుండానే కొత్త వాక్య నిర్మాణం ఆ మార్పును సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. వ్యక్తినామాలకు సంప్రదాయ తెలుగు బైబిలు రూపాలకు దగ్గరైన లిప్యంతరీకరణ వాడబడింది.
