revisions:
- from: యూదా దేశంలో మిగిలిన[a] ప్రజలను—అంటే బబులోను రాజు నెబుకద్నెజరు అక్కడ విడిచిపెట్టినవారిని—అతడు షాఫాను కుమారుడైన అహీకాము కుమారుడు గెదల్యా అధికారంలో ఉంచాడు.
  to: యూదా దేశంలో మిగిలి ఉన్న ప్రజల మీద బబులోను రాజైన నెబుకద్నెజరు, తాను అక్కడ విడిచిపెట్టిన వారిపై, షాఫాను కుమారుడైన అహీకాము కుమారుడు గెదల్యాను నియమించాడు.
  rationale: 'The revision makes Nebuchadnezzar’s appointment of Gedaliah explicit and uses a smoother Telugu sentence structure. It preserves the two related Hebrew descriptions: the people were remaining in Judah, and Nebuchadnezzar had left them there. The footnote retains the lexical alternative without adding theological implications.'
  reviewer_model: gpt-5.6-terra
