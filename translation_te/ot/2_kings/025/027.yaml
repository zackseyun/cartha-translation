source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: te
  text: యూదా రాజైన యెహోయాకీను బందీగా తీసుకుపోబడిన ముప్పై ఏడవ సంవత్సరంలో, పన్నెండో నెల ఇరవై ఏడవ రోజున, బబులోను రాజైన ఎవీల్‌-మెరోదకు[b] తాను రాజైన సంవత్సరంలో[c] చెరసాల నుండి యూదా రాజైన యెహోయాకీను తలను ఎత్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తలను ఎత్తడం” అనేది హీబ్రూ నుడికారం. ఇక్కడ అది యెహోయాకీనుకు అనుగ్రహం చూపి అతని స్థితిని ఉన్నతపరచడాన్ని సూచిస్తుంది; దానికి మొదటి చర్యగా అతణ్ణి చెరసాల నుండి విడుదల చేశాడు.
    reason: lexical_alternative
  - marker: b
    text: ఎవీల్‌-మెరోదకు చారిత్రక ఆధారాల్లో అమెల్‌-మార్దుక్ అనే పేరుతో కూడా ప్రసిద్ధుడు.
    reason: cultural_note
  - marker: c
    text: “తాను రాజైన సంవత్సరంలో” అనే మాటకు “తన పరిపాలనలోని మొదటి సంవత్సరంలో” అనే అర్థం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: …సంవత్సరంలో … రోజున
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని తెలుగులో సహజమైన కాలవాచక వాక్య నిర్మాణంలో వ్యక్తం చేశాం; ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని చేర్చడం అవసరం లేదు.
- source_word: לְגָלוּת
  choice: చెరలోకి వెళ్లిన
  rationale: גָּלוּת బలవంతపు దేశబహిష్కరణ/చెరను సూచిస్తుంది. యెహోయాకీను విషయంలో తెలుగులో సహజంగా అర్థమయ్యే కాలసూచక రూపం ఇది.
- source_word: יְהוֹיָכִין
  choice: యెహోయాకీను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా, తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన లిప్యంతరీకరణ.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: పన్నెండో నెల
  rationale: హీబ్రూ తేదీ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: ఇరవై ఏడో రోజున
  rationale: నెల ఇప్పటికే ప్రస్తావించబడినందున, తేదీని స్పష్టమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: אֱוִיל מְרֹדַךְ
  choice: ఎవీల్‌-మెరోదకు
  rationale: మసొరా హీబ్రూ రూపాన్ని ఆధారంగా తీసుకున్న లిప్యంతరీకరణ; చారిత్రక అక్కాడీయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: తాను రాజైన సంవత్సరంలో
  rationale: పదబంధం ఆ రాజ్యారంభ సంవత్సరాన్ని సూచించవచ్చు; అయితే మూలంలో ‘మొదటి’ అనే సంఖ్య స్పష్టంగా లేనందున ప్రధాన పాఠంలో దాన్ని చేర్చలేదు.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: తలను ఎత్తి
  rationale: మూలంలోని రూపకాన్ని నిలిపి, సందర్భంలో అది అనుగ్రహించి స్థితిని ఉన్నతపరచడాన్ని—మొదట చెరసాల నుంచి విడుదల చేయడాన్ని—సూచిస్తుందని పాదటిప్పణిలో వివరించాం.
- source_word: מִבֵּית כֶּלֶא
  choice: చెరసాల నుండి బయటికి తీసుకొచ్చాడు
  rationale: ‘నిర్బంధ గృహం నుండి’ అనే అక్షరార్థాన్ని సహజమైన తెలుగులో తెలిపి, సందర్భానుసారంగా విడుదల చర్యను స్పష్టపరుస్తుంది.
