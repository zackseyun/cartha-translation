  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. తేదీ సూత్రాన్ని సహజ తెలుగు క్రమంలో ఉంచి, హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి పాదటిప్పణిలో వివరించాం.
