  rationale: The revision removes two interpretive additions (“కొందరు,” “వారిని”), avoids unwarranted emphatic force, improves Telugu idiom, and retains the Hebrew’s repetition, implicit city reference, and difficult comparison. Footnote anchors remain attached to the implicit-city pronoun and the repeated comparison respectively.
