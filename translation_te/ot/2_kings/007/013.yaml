  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని అసాధారణమైన ద్వంద్వ పోలికను సవరించకుండా నిలిపాం. ‘ఇదిగో’ అనే పదాన్ని రెండుసార్లు ఉంచి הִנָּם పునరుక్తిని కాపాడాం.
