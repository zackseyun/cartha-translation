base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: te
  text: 'అప్పుడు అతని సేవకుల్లో ఒకడు జవాబిస్తూ ఇలా అన్నాడు: “దయచేసి, ఇంకా మిగిలి ఉన్న, దానిలో మిగిలిపోయిన గుర్రాల్లో ఐదింటిని తీసుకోనివ్వండి.[a] ఇదిగో, అవి దానిలో మిగిలి ఉన్న ఇశ్రాయేలు జనసమూహమంతటి వలెనే ఉన్నాయి; ఇదిగో, అవి నశించిపోయిన ఇశ్రాయేలు జనసమూహమంతటి వలెనే ఉన్నాయి.[b] కాబట్టి మనము పంపి చూద్దాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దానిలో” అనే స్త్రీలింగ ఏకవచన సర్వనామం బహుశా సమార్య పట్టణాన్ని సూచిస్తుంది; అయితే ఈ వచనంలో “పట్టణం” అనే నామవాచకం మళ్లీ చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యంలో క్లిష్టమైన, పునరుక్తితో కూడిన పోలిక ఉంది: “దానిలో మిగిలి ఉన్న ఇశ్రాయేలు జనసమూహమంతటి వలెనే ... నశించిపోయిన ఇశ్రాయేలు జనసమూహమంతటి వలెనే.” దాన్ని సులభతరం చేసి మార్చకుండా అనువాదం ఆ పునరుక్తిని నిలిపింది.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: అప్పుడు అతని సేవకుల్లో ఒకడు ఇలా జవాబిచ్చాడు
  rationale: ענה అనే కథన ప్రయోగానికి ‘జవాబిచ్చాడు’ సహజమైన సమానం. రాజసభ సందర్భంలో עבד అనే విస్తృత పదాన్ని హోదాను అతిగా నిర్దిష్టం చేయకుండా ‘సేవకుడు’గా అనువదించాం.
- source_word: וְיִקְחוּ נָא
  choice: దయచేసి ... కొందరు తీసుకువెళ్లనివ్వండి
  rationale: జస్సివ్ రూపంతో కూడిన נָא మర్యాదపూర్వక ప్రతిపాదనను సూచిస్తుంది. తెలుగులో సహజమైన అభ్యర్థనగా వ్యక్తం చేశాం; క్రియలోని బహువచన కర్తను ‘కొందరు’తో స్పష్టం చేశాం.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: గుర్రాల్లో ఐదింటిని
  rationale: భాగార్థక מן ను ఆధునిక తెలుగులో సహజంగా ‘లో ఐదింటిని’ అని వ్యక్తం చేశాం.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: ఇంకా మిగిలి, దానిలోనే ఉండిపోయిన
  rationale: שאר మూలపద పునరుక్తిని ‘మిగిలి / ఉండిపోయిన’తో సాధ్యమైనంతవరకు నిలిపాం. స్త్రీలింగ ఏకవచన ప్రత్యయం సమార్య పట్టణాన్ని సూచించే అవకాశం ఉన్నా, మూలంలో నామవాచకం తిరిగి లేదు కాబట్టి ‘దానిలో’ అని ఉంచాం.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: దృష్టిని ఆకర్షించే הִנֵּה భావాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు ‘ఇదిగో’తో నిలిపాం.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: ఇశ్రాయేలు జనసమూహమంతటిలాగే
  rationale: הָמוֹן యొక్క సమష్టి, విస్తృత జనసమూహ భావాన్ని ‘జనసమూహం’ తెలియజేస్తుంది; כְּכָל లోని పోలికను అలాగే నిలిపాం.
- source_word: אֲשֶׁר תָּמּוּ
  choice: నశించిపోయిన
  rationale: ఈ కరవు సందర్భంలో תם ‘అంతమైపోవడం/నశించడం’ అనే భావం ఇస్తుంది. ‘నశించిపోయిన’ మరణార్థాన్ని సహజంగా తెలిపినా, దాని కారణాన్ని అదనంగా నిర్ధారించదు.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: కాబట్టి మనం వారిని పంపించి చూద్దాం
  rationale: మొదటి పురుష బహువచన కోహార్టేటివ్‌లు సంయుక్త ప్రతిపాదనను తెలియజేస్తాయి. పంపబడేది అన్వేషకులేనని సందర్భం సూచించడంతో తెలుగులో అవసరమైన కర్మను ‘వారిని’గా వ్యక్తం చేశాం.
