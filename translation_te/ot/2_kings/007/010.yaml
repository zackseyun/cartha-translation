translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. మూలంలోని సమూహార్థక ఏకవచనాలను తెలుగులో సహజమైన బహువచనాలతో వ్యక్తీకరించాం. అందించిన ఆంగ్ల పాదటిప్పణుల గుర్తులు విషయాలతో సరిపోలకపోవడంతో, మూలపాఠ్య ఆధారంగా అవసరమైన קוֹל యొక్క అర్థవిస్తృతిని మాత్రమే [a]గా నమోదు చేశాం.
