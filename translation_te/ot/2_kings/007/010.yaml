  text: וַ/יָּבֹ֗אוּ וַֽ/יִּקְרְאוּ֮ אֶל שֹׁעֵ֣ר הָ/עִיר֒ וַ/יַּגִּ֤ידוּ לָ/הֶם֙ לֵ/אמֹ֔ר בָּ֚אנוּ אֶל מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֛ם אִ֖ישׁ וְ/ק֣וֹל אָדָ֑ם כִּ֣י אִם הַ/סּ֤וּס אָסוּר֙ וְ/הַ/חֲמ֣וֹר אָס֔וּר וְ/אֹהָלִ֖ים כַּ/אֲשֶׁר הֵֽמָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: te
  text: 'అప్పుడు వారు వచ్చి పట్టణ ద్వారపాలకులను పిలిచి వారికి ఇలా తెలియజేశారు: “మేము అరాము శిబిరానికి వెళ్లాము. ఇదిగో, అక్కడ ఎవరూ లేరు; మానవ స్వరమూ[a] వినిపించలేదు. కట్టివేసి ఉన్న గుర్రాలు, కట్టివేసి ఉన్న గాడిదలు, యథాతథంగా ఉన్న గుడారాలు తప్ప మరేమీ లేవు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ శబ్దం.” హీబ్రూ పదం ప్రత్యేకంగా స్వరాన్ని గానీ, మరింత విస్తృతంగా మనిషి చేసే ఏ శబ్దాన్నైనా గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: పట్టణ ద్వారపాలకులను
  rationale: రూపరీత్యా ఏకవచనమైనా, తరువాతి బహువచన సర్వనామం సందర్భంలో ద్వారపాలక సిబ్బందిని సమూహంగా సూచిస్తుంది.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: అని వారికి తెలియజేశారు
  rationale: హిఫిల్ రూపంలోని נגד ఇక్కడ సమాచారం చెప్పడం లేదా నివేదించడం అనే అర్థం ఇస్తుంది; తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ఇది సహజంగా ఉంటుంది.
- source_word: מַחֲנֵה אֲרָם
  choice: అరాము శిబిరానికి
  rationale: అరాము అనే హీబ్రూ స్థలనామాన్ని నేరుగా నిలుపుతుంది; తరువాతి కాలపు ‘సిరియా’ అనే భౌగోళిక పేరును దిగుమతి చేయదు.
- source_word: וְהִנֵּה
  choice: ప్రత్యక్షంగా ప్రత్యేక పదంతో అనువదించకుండా వాక్యంలోని ఆకస్మిక ఆవిష్కరణ ద్వారా వ్యక్తీకరించబడింది
  rationale: తెలుగులో ‘ఇదిగో’ ఇక్కడ కృత్రిమంగా వినిపించవచ్చు; శిబిరానికి వెళ్లి అక్కడి అనూహ్య స్థితిని చెప్పే వాక్యక్రమమే హిన్నేహ్ యొక్క సజీవ ప్రదర్శన భావాన్ని అందిస్తుంది.
- source_word: אֵין שָׁם אִישׁ
  choice: అక్కడ ఎవరూ లేరు
  rationale: אִישׁ ఇక్కడ పురుషుణ్ణి మాత్రమే కాక ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది.
- source_word: וְקוֹל אָדָם
  choice: మనిషి స్వరం కూడా వినిపించలేదు
  rationale: קוֹל కు ‘స్వరం’ లేదా విస్తృతంగా ‘శబ్దం’ అనే అర్థాలు సాధ్యం. ప్రధాన పాఠ్యంలో సహజమైన ‘మనిషి స్వరం’ను ఉంచి, విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: כִּי אִם
  choice: మాత్రమే
  rationale: ముందు చెప్పిన సంపూర్ణ గైర్హాజరుకు మినహాయింపుగా మిగిలిన జంతువులు, గుడారాలను పరిచయం చేస్తుంది.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: కట్టివేసి ఉన్న గుర్రాలు, కట్టివేసి ఉన్న గాడిదలు
  rationale: ఏకవచన నామాలు సమూహార్థకంగా ఉన్నాయి; జంతువుల సందర్భంలో אָסוּר కు ‘కట్టివేసి ఉన్న’ అనేది స్పష్టమైన ఆధునిక తెలుగు.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: గుడారాలు ఉన్నవి ఉన్నట్టే ఉన్నాయి
  rationale: గుడారాలు విడిచిపెట్టబడినప్పటి స్థితిలోనే ఉన్నాయనే భావాన్ని, అదనపు వివరణ లేకుండా సహజ తెలుగులో నిలుపుతుంది.
