source:
  edition: WLC
  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: te
  text: 'అప్పుడు రాజు ఎవరి చేతిమీద ఆనుకుని ఉండేవాడో ఆ అధికారి దేవుని మనిషికి ఇలా జవాబిచ్చాడు: “చూడు, యాహ్వే ఆకాశాల్లో కిటికీలు చేసినా, ఇలాంటిది జరుగుతుందా?” అప్పుడు దేవుని మనిషి అతనితో ఇలా అన్నాడు: “చూడు, నువ్వు నీ కళ్లతోనే దాన్ని చూస్తావు; కానీ దానిలో నుంచి తినవు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ఆ అధికారి
  rationale: ఇది ఉన్నత స్థాయి సైనిక లేదా రాజసభ అధికారిని సూచిస్తుంది; సందర్భం నిర్దిష్ట హోదాను స్పష్టంగా చెప్పనందున ‘అధికారి’ సహజంగా, అతిశయ నిర్దిష్టత లేకుండా ఉంటుంది.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: ఎవరి చేతిమీద ఆనుకునేవాడో
  rationale: יָד యొక్క ప్రాథమిక అర్థమైన ‘చేయి’ని నిలుపుతూ, రాజుకు సన్నిహిత సహాయకుడనే సజీవ దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తకు వాడే ప్రామాణిక హీబ్రూ బిరుదును వివరణాత్మకంగా ‘ప్రవక్త’గా మార్చకుండా నిలుపుతుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: శ్రద్ధను ఆకర్షించే, ఇక్కడ సందేహభరితమైన మాటకు బలం ఇచ్చే సంభాషణ సూచికను ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న నామరూపంతో సూచిస్తుంది.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: ఆకాశంలో కిటికీలు చేసినా
  rationale: అసాధారణమైన పరలోక సరఫరాను సూచించే హీబ్రూ రూపకాన్ని ‘వరద ద్వారాలు తెరిచినా’ అని విపులీకరించకుండా సాధ్యమైనంత ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: ఇలాంటిది జరుగుతుందా?
  rationale: ప్రశ్నలోని అపనమ్మకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנְּכָה רֹאֶה בְּעֵינֶיךָ
  choice: చూడు, నువ్వు నీ కళ్లతోనే దాన్ని చూస్తావు
  rationale: హీబ్రూ వర్తమాన కృదంతం యొక్క సమీప భవిష్యత్ భావాన్ని సహజమైన తెలుగు భవిష్యత్ రూపంతో, ‘నీ కళ్లతోనే’ అనే ఉద్ఘాటనతో అందిస్తుంది.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: కానీ దానిలో నుంచి తినవు
  rationale: מִשָּׁם యొక్క ‘అక్కడి నుంచి/దానిలో నుంచి’ భావాన్ని నిలుపుతూ, సందర్భంలోని ఆహార సరఫరాను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించలేదు.
- issue: అధికారి మాటలోని అవిశ్వాసం
  choice: ప్రశ్న రూపంలోని అపనమ్మకాన్ని అలాగే ఉంచడం
  alternative: దాన్ని స్పష్టంగా ‘అతడు ఎగతాళి చేశాడు’ అని వివరించడం
  rationale: మూలం అతని స్వరాన్ని వ్యాఖ్యానించకుండా అలంకారిక ప్రశ్న ద్వారా తెలియజేస్తుంది; అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ‘ఆకాశపు కిటికీలు’ అనే అసాధారణ రూపకాన్ని నిలిపి, సంభాషణలోని ఉద్రిక్తతను అతిగా వివరణ చేయకుండా ఉంచాం.
