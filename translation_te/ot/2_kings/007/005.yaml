- from: కాబట్టి వారు సంధ్యవేళ లేచి అరాము శిబిరానికి వెళ్లారు. వారు అరాము శిబిరం అంచు వరకు వచ్చినప్పుడు, ఇదిగో, అక్కడ ఒక్క మనిషి కూడా లేడు.[a]
