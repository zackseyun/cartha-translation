id: 2KI.7.5
reference: 2 Kings 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: te
  text: అప్పుడు వారు అరాము శిబిరానికి వెళ్లడానికి సంధ్యవేళ లేచారు. వారు అరాము శిబిరం అంచుకు వచ్చినప్పుడు, ఇదిగో, అక్కడ ఒక్క మనిషి కూడా లేడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “అక్కడ ఎవరూ లేరు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: కాబట్టి వారు ... లేచి
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలోని నిర్ణయానికి ఫలితంగా చర్య మొదలవుతున్నందున ‘కాబట్టి’ సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: בַנֶּ֔שֶׁף
  choice: సంధ్యవేళ
  rationale: ఈ సందర్భంలో נֶשֶׁף సాయంకాలపు మసకవేళను సూచిస్తుంది; ‘సంధ్యవేళ’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: לָב֖וֹא אֶל
  choice: '...కు వెళ్లారు'
  rationale: קום తరువాతి క్రియారూపం ఉద్దేశాన్ని సూచిస్తుంది. కథకుని దృష్టికోణంలో లక్ష్యస్థానమైన శిబిరం వైపు కదలికను తెలుగులో ‘వెళ్లారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַחֲנֵ֣ה אֲרָם
  choice: అరాము శిబిరం
  rationale: సంబంధ నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ప్రదేశ/జాతి నామమైన ‘అరాము’ను నిలుపుతుంది.
- source_word: עַד קְצֵה֙
  choice: అంచు వరకు
  rationale: శిబిరపు బయటి హద్దును చేరడాన్ని నేరుగా, స్పష్టంగా సూచిస్తుంది.
- source_word: וְהִנֵּ֥ה
  choice: ఇదిగో
  rationale: అనూహ్యంగా కనబడిన పరిస్థితిపై శ్రద్ధను ఆకర్షించే హిన్నే యొక్క కథన బలాన్ని నిలుపుతుంది.
- source_word: אֵֽין שָׁ֖ם אִֽישׁ
  choice: అక్కడ ఒక్క మనిషి కూడా లేడు
  rationale: אִישׁ అనే ఏకవచన, పుంలింగ రూపాన్ని ‘మనిషి’తో నిలుపుతూ, ‘ఒక్క...కూడా లేడు’ అనే సహజ తెలుగు నిర్మాణం అక్కడ ఎవరూ లేరనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఎవరూ లేరనే సందర్భంలో పుంలింగ ఏకవచనమైన אִישׁ
  choice: అక్కడ ఒక్క మనిషి కూడా లేడు
  alternative: అక్కడ ఎవరూ లేరు
  rationale: ప్రధాన పాఠం మూలంలోని ఏకవచన నామరూపాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; అయితే ఈ సందర్భంలో అది సాధారణంగా ఒక్క వ్యక్తి కూడా లేడనే అర్థాన్ని ఇస్తుంది. మరింత నుడికారమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా ఆశ్చర్యకరమైన కనుగొనికకు మూలపాఠం ఇచ్చిన ప్రాధాన్యం నిలుపబడింది; పాదటిప్పణి ప్రధాన పాఠంలోని మూలరూప నిష్ఠకు తోడు నుడికారమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
