  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలిని వాడింది. మూలంలోని సంక్షిప్తమైన రథాల పదబంధానికి ప్రధాన పాఠ్యంలో సహజ రూపం ఇచ్చి, దాని నిజమైన భావసంభావ్యతను పాదటిప్పణిలో భద్రపరిచింది.
