source:
  edition: WLC
  text: וַ/יִּקְח֕וּ שְׁנֵ֖י רֶ֣כֶב סוּסִ֑ים וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ אַחֲרֵ֧י מַחֲנֵֽה אֲרָ֛ם לֵ/אמֹ֖ר לְכ֥וּ וּ/רְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: te
  text: అప్పుడు వారు గుర్రాలు కట్టిన రెండు రథాలను[a] తీసుకున్నారు. రాజు, “వెళ్లి చూడండి” అని చెప్పి, వారిని అరాము శిబిరం వెంట పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “గుర్రాల రెండు రథాలు.” ఇది గుర్రాలు కట్టిన రెండు రథాలను లేదా రెండు రథబృందాలను సూచించే సంక్షిప్త ప్రయోగం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: అప్పుడు వారు తీసుకున్నారు
  rationale: కథనాన్ని ముందుకు నడిపించే వయ్యిక్టోల్ రూపాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’తో వ్యక్తం చేసింది.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: గుర్రాలు కట్టిన రెండు రథాలు
  rationale: హీబ్రూ పదబంధం సంక్షిప్తమైనది, కొంత అధ్యాహారార్థం కలది. సందర్భంలో గుర్రాలు పూన్చిన రెండు రథాలు లేదా రెండు రథబృందాలు ఉద్దేశించబడ్డట్టు కనిపిస్తుంది; తెలుగు పాఠ్యంలో స్పష్టతను ఇస్తూనే పాదటిప్పణిలో మూలంలోని సంక్షిప్తతను సూచించింది.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: రాజు వారిని పంపిస్తూ
  rationale: ‘వారిని’ అనే కర్మను ముందున్న సందర్భం నుంచి స్పష్టత కోసం చేర్చింది. తరువాతి ప్రత్యక్ష ఆజ్ఞతో చర్యకు ఉన్న సంబంధాన్ని ‘పంపిస్తూ’ సహజంగా కలుపుతుంది.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: అరాము శిబిరం వెనుకగా
  rationale: אַחֲרֵי యొక్క దిశార్థమైన ‘వెనుక/తరువాత’ భావాన్ని ఉంచి, ‘వెంబడించడానికి’ అనే బలమైన ఉద్దేశార్థాన్ని అనవసరంగా చేర్చకుండా అనిశ్చితిని కాపాడింది.
- source_word: אֲרָם
  choice: అరాము
  rationale: ప్రాచీన రాజ్యపు పేరును ఆధునిక ‘సిరియా’గా మార్చకుండా మూలనామానికి సమీపమైన తెలుగు రూపంలో ఉంచింది.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యాంత రూపంలో వ్యక్తం చేసింది.
- source_word: לְכוּ וּרְאוּ
  choice: వెళ్లి చూడండి
  rationale: రెండు సంక్షిప్త ఆజ్ఞారూపాల సరళతను, సైనిక ఆదేశంలోని క్లుప్తతను నిలిపింది.
