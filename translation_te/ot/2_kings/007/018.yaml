- from: 'దేవుని మనిషి రాజుతో చెప్పినట్టే జరిగింది: “రేపు ఇదే సమయానికి సమరయ ద్వారం దగ్గర రెండు సేయాల యవలు ఒక షెకెలుకు, ఒక సేయా మెత్తని పిండి ఒక షెకెలుకు దొరుకుతాయి.”[a][b]'
