id: 2KI.7.18
reference: 2 Kings 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: te
  text: 'దేవుని మనిషి రాజుతో చెప్పినట్టే జరిగింది: “రేపు ఇదే సమయానికి సమరయ ద్వారం దగ్గర[b] రెండు సేయాల[a] యవలు ఒక షెకెలుకు, ఒక సేయా సన్నని పిండి ఒక షెకెలుకు దొరుకుతాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సేయా అనేది ప్రాచీన ఘనపదార్థాల కొలత. హీబ్రూ మూలం కొలతలను నేరుగా పేర్కొంటుంది: రెండు సేయాల యవలు, ఒక సేయా సన్నని పిండి.'
    reason: cultural_note
  - marker: b
    text: లేదా, “సమరయ ద్వారంలో.” పట్టణ ద్వారం వ్యాపారం, న్యాయవిచారణ జరిగే బహిరంగ ప్రదేశంగా ఉండేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: చెప్పినట్టే జరిగింది
  rationale: כְּతో కూడిన infinitive construct ఇక్కడ ముందుగా చెప్పిన మాటకు అనుగుణంగా సంఘటన నెరవేరడాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: మూలంలోని స్థిరమైన బిరుదును ‘ప్రవక్త’గా వ్యాఖ్యానించకుండా నేరుగా అనువదిస్తుంది.
- source_word: סָאתַיִם שְׂעֹרִים
  choice: రెండు సేయాల యవలు
  rationale: సేయా అనే ప్రాచీన కొలతను, dual రూపంలోని ‘రెండు’ అనే సంఖ్యా నిర్దిష్టతను నిలుపుతుంది; שְׂעֹרִיםకు సహజమైన తెలుగు ‘యవలు’.
- source_word: בְּשֶׁקֶל
  choice: ఒక షెకెలుకు
  rationale: ధరను సూచించే בְּను తెలుగు మార్కెట్ ధర ప్రయోగంతో అందిస్తుంది.
- source_word: וּסְאָה סֹלֶת
  choice: ఒక సేయా మెత్తని పిండి
  rationale: ముందటి ద్వివచనానికి వ్యతిరేకంగా ఏకవచన పరిమాణాన్ని స్పష్టపరుస్తూ, סֹלֶתలోని సన్నగా శుద్ధి చేసిన పిండి భావాన్ని ‘మెత్తని పిండి’గా నిలుపుతుంది.
- source_word: כָּעֵת מָחָר
  choice: రేపు ఇదే సమయానికి
  rationale: రేపటి సుమారు ఇదే సమయాన్ని తెలిపే హీబ్రూ కాలప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: సమరయ ద్వారం దగ్గర
  rationale: בְּకు అక్షరార్థంగా ‘ద్వారంలో’ అనవచ్చుగానీ, పట్టణ ద్వారం వద్ద జరిగిన వ్యాపార సందర్భాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה
  choice: దొరుకుతాయి
  rationale: హీబ్రూలో ముందే చెప్పిన ధరలు ‘ఉంటాయి/అమలులో ఉంటాయి’ అనే సంక్షిప్త భావాన్ని తెలుగు వాణిజ్య సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ప్రాచీన కొలతలు, నాణెం పేర్లను మూలరూపానికి దగ్గరగా ఉంచి పాదసూచికలో వివరణ ఇచ్చాం. పాదసూచిక సూచికలు ప్రధాన వాక్యాంతంలో వరుసగా ఉంచబడ్డాయి.
