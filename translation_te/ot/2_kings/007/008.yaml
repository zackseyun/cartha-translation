  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలో వరుసగా వచ్చే క్రియలను తెలుగు సహజ ప్రవాహానికి అనుగుణంగా అనుసంధానించాం; భావాన్ని సంక్షిప్తం చేయలేదు.
