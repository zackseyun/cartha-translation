source:
  edition: WLC
  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: te
  text: ఆ చర్మవ్యాధిగ్రస్తులు[a] శిబిరం అంచుకు వచ్చి, ఒక గుడారంలోకి ప్రవేశించారు. అక్కడ తిని తాగి, వెండి, బంగారం, బట్టలు తీసుకెళ్లి దాచిపెట్టారు. తర్వాత వారు తిరిగివచ్చి, మరో గుడారంలోకి ప్రవేశించి, అక్కడి వస్తువులను తీసుకెళ్లి దాచిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం సంప్రదాయంగా ‘కుష్ఠరోగులు’ అని అనువదించబడింది. అయితే అది ఆధునిక వైద్యశాస్త్రంలో కుష్ఠు లేదా హాన్సెన్స్ వ్యాధి అని పిలిచే వ్యాధికే పరిమితం కాకుండా, అనేక రకాల చర్మవ్యాధులను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: చర్మవ్యాధిగ్రస్తులు
  rationale: צָרַעַת అనే ప్రాచీన పదం ఆధునిక హాన్సెన్స్ వ్యాధికంటే విస్తృతమైన చర్మవ్యాధులను సూచించవచ్చు. అందువల్ల ‘కుష్ఠరోగులు’ అని వైద్యపరంగా పరిమితం చేయకుండా, సహజమైన ఆధునిక తెలుగు పదాన్ని ఎంచుకున్నాం; సంప్రదాయ అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: శిబిరం అంచు
  rationale: קָצֶה స్థలపు చివర లేదా అంచును సూచిస్తుంది; సందర్భంలో ‘శిబిరం అంచు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֹהֶל אֶחָד
  choice: ఒక గుడారం
  rationale: హీబ్రూలోని సంఖ్యాత్మకమైన అనిర్దిష్ట భావాన్ని, కథనంలోని వరుస చర్యను నిలుపుతుంది.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: తిని తాగి
  rationale: సరళమైన వరుస కథన చర్యను సహజ తెలుగు క్రియాక్రమంతో తెలిపింది; మూలంలో లేని ప్రారంభార్థాన్ని చేర్చలేదు.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: అక్కడి నుంచి తీసుకెళ్లి
  rationale: נשא ఇక్కడ వస్తువులను ఎత్తుకొని తీసుకుపోవడాన్ని సూచిస్తుంది. ‘తీసుకెళ్లి’ సందర్భానికి తగిన సహజ తెలుగు.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: వెండి, బంగారం, బట్టలు
  rationale: మూడు వస్తువులను సూటిగా, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיַּטְמִנוּ
  choice: దాచిపెట్టారు
  rationale: క్రియకు దాచడం లేదా మరుగుపరచడం అనే భావం ఉంది. ‘పాతిపెట్టారు’ అనడం మూలం కంటే నిర్దిష్టం అవుతుంది.
- source_word: וַיָּשֻׁבוּ
  choice: తర్వాత వారు తిరిగివచ్చి
  rationale: కథన క్రమాన్ని సహజ తెలుగులో కొనసాగిస్తూ, వారు మళ్లీ శిబిరానికి వచ్చిన భావాన్ని నిలుపుతుంది.
- source_word: אֹהֶל אַחֵר
  choice: మరో గుడారం
  rationale: אַחֵר యొక్క ‘ఇంకొకటి/మరొకటి’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: అక్కడి వస్తువులను తీసుకెళ్లి
  rationale: రెండో సందర్భంలో హీబ్రూ కర్మను పేర్కొనలేదు. తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు సాధారణమైన ‘వస్తువులను’ చేర్చాం; ఏ వస్తువులో నిర్దిష్టంగా చెప్పలేదు.
