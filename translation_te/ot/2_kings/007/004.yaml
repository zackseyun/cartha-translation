translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన సంభాషణ శైలి వాడబడింది. ప్రాణాపాయ స్థితిలో ఉన్నవారి సంక్షిప్త తర్కం, వరుస షరతులు, ‘బతకనిస్తే బతుకుతాం; చంపితే చనిపోతాం’ అనే హీబ్రూ సమాంతర నిర్మాణం నిలుపబడ్డాయి.
