id: 2KI.7.4
reference: 2 Kings 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: te
  text: “‘మనం పట్టణంలోకి వెళ్దాం’ అని చెబితే, పట్టణంలో క్షామం ఉంది; అక్కడే చనిపోతాం. ఇక్కడే ఉండిపోతే, చనిపోతాం. కాబట్టి ఇప్పుడు రండి, అరాము[a] శిబిరానికి లొంగిపోదాం[b]. వారు మనలను ప్రాణాలతో ఉంచితే, మనం బతుకుతాం; వారు మనలను చంపితే, చనిపోతాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అరాము’ అనేది హీబ్రూ పేరు; కొన్ని అనువాదాల్లో దీనిని ‘సిరియా’ లేదా ‘అరామీయులు’ అని అనువదిస్తారు.
    reason: cultural_note
  - marker: b
    text: హీబ్రూ నుడికారాన్ని అక్షరార్థంగా ‘అరాము శిబిరం వైపు పడిపోదాం’ అని అనువదించవచ్చు; ఈ సైనిక సందర్భంలో అది శత్రువుల పక్షానికి వెళ్లి లొంగిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹא
  choice: మనం పట్టణంలోకి వెళ్దాం
  rationale: షరతుతో కూడిన ప్రతిపాదిత మాటలో ఈ మొదటి పురుష బహువచన క్రియ ఉమ్మడి నిర్ణయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెళ్దాం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: సందర్భంలో ఇది సమరయను సూచించినా, హీబ్రూ పాఠం సాధారణ నామవాచకాన్నే వాడుతుంది; అందువల్ల పేరును చేర్చకుండా ‘పట్టణం’గా ఉంచబడింది.
- source_word: הָרָעָב
  choice: కరవు
  rationale: ఇక్కడ వ్యక్తిగత ఆకలి కాక, ముట్టడి వల్ల ఏర్పడిన విస్తృత ఆహార కొరత ఉద్దేశించబడింది.
- source_word: יָשַׁבְנוּ פֹה
  choice: ఇక్కడే ఉంటే
  rationale: יָשַׁבְנוּ అనే పదానికి ‘కూర్చోవడం, నివసించడం, ఉండిపోవడం’ అనే అర్థాలు ఉన్నాయి. ఈ సందర్భంలో ‘ఇక్కడే ఉంటే’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וְעַתָּה לְכוּ
  choice: కాబట్టి ఇప్పుడు పదండి
  rationale: వారు పరిశీలించిన మార్గాల నుంచి కార్యనిర్ణయానికి మారుతున్న భావాన్ని ‘కాబట్టి ఇప్పుడు’ చూపిస్తుంది; לְכוּలోని సమూహ ఆహ్వానాన్ని ‘పదండి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנִפְּלָה אֶל
  choice: లొంగిపోదాం
  rationale: సైనిక సందర్భంలో נפל אל అనే హీబ్రూ నుడికారం ప్రత్యర్థి పక్షానికి వెళ్లిపోవడం లేదా లొంగిపోవడం అనే భావాన్ని కలిగిస్తుంది. తెలుగులో అక్షరార్థమైన ‘పడిపోదాం’ అపార్థానికి దారితీయవచ్చు కాబట్టి ఉద్దేశిత భావం ప్రధాన పాఠంలో ఇవ్వబడింది; రూపకం పాదసూచికలో తెలియజేయబడింది.
- source_word: מַחֲנֵה אֲרָם
  choice: అరాము సైన్యపు శిబిరం
  rationale: అరాము అనే హీబ్రూ స్థలనామాన్ని నిలిపి, מַחֲנֶהకు ఈ యుద్ధ సందర్భంలో స్పష్టమైన ‘సైన్యపు శిబిరం’ ఉపయోగించబడింది.
- source_word: יְחַיֻּנוּ / נִחְיֶה
  choice: వారు మనల్ని బతకనిస్తే బతుకుతాం
  rationale: మొదటి క్రియ ‘బతకనివ్వడం/ప్రాణాలతో ఉంచడం’ అని, రెండవది ‘బతకడం’ అని సూచిస్తుంది. హీబ్రూలోని ఉద్దేశపూర్వక పునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: יְמִיתֻנוּ
  choice: చంపితే
  rationale: מות ధాతువు హిఫీల్ రూపం ‘చనిపోయేలా చేయడం, చంపడం’ అనే కారణార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చంపితే’ దానిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: చనిపోతాం
  rationale: షరతుల ఫలితంగా ఎదురయ్యే నిశ్చిత పరిణామాన్ని తెలుగులో భవిష్యత్ భావంతో ‘చనిపోతాం’ స్పష్టంగా వ్యక్తం చేస్తుంది.
