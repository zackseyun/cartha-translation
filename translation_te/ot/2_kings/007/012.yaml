translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని రాజు ఊహించిన శత్రు పథకాన్ని నిర్ధారిత వాస్తవంగా మార్చకుండా ప్రత్యక్ష సంభాషణలోనే ఉంచాం.
