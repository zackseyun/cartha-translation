source:
  edition: WLC
  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: te
  text: 'అప్పుడు రాజు రాత్రివేళ లేచి తన సేవకులతో ఇలా అన్నాడు: “అరాము[a] మనకు ఏమి చేసిందో నేను మీకు చెప్పనివ్వండి. మనం ఆకలితో ఉన్నామని వారికి తెలుసు. అందుకే వారు శిబిరం నుంచి బయలుదేరి, ‘పట్టణవాసులు బయటికి రాగానే వారిని ప్రాణాలతో పట్టుకొని పట్టణంలోకి వెళ్దాం’ అని అనుకొని బయలులో దాక్కున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అరామీయులు.” హీబ్రూ పాఠంలో ‘అరాము’ అనే దేశనామం అరాము ప్రజలను లేదా సైన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: రాజు రాత్రివేళ లేచి
  rationale: קום ఇక్కడ రాత్రి విశ్రాంతి నుంచి లేవడాన్ని సూచిస్తుంది; ‘రాత్రివేళ లేచి’ అనేది సహజమైన ఆధునిక తెలుగు కథన రూపం.
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: రాజసభ సందర్భంలో עבד రాజు సేవకులు లేదా పరిచారకులను సూచించవచ్చు; ‘సేవకులు’ విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: నేను మీకు చెబుతాను, వినండి
  rationale: కోహోర్టేటివ్ రూపంతో పాటు נָא లోని విజ్ఞప్తి లేదా శ్రద్ధ కోరే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: అరాము వారు మనకు ఏమి చేశారో
  rationale: אֲרָם అనే దేశనామమే దాని ప్రజలు లేదా సైన్యాన్ని సూచిస్తోంది. ‘అరాము వారు’ ఆ పేరును నిలుపుతూ బహువచన క్రియకు సహజంగా సరిపోతుంది.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: మనం ఆకలితో ఉన్నామని వారికి తెలుసు
  rationale: రాజు ఊహిస్తున్న శత్రువుల ప్రస్తుత జ్ఞానాన్ని ప్రత్యక్ష వాక్యంలో సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: వారు శిబిరం నుంచి బయలుదేరి
  rationale: సైనిక శిబిరాన్ని విడిచి వెళ్లిన ఇటీవలి చర్యను సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: పొలాల్లో దాక్కున్నారు
  rationale: ప్రతిబింబార్థక దాక్కోవడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ఏకవచన సమూహార్థక שדה ను సందర్భానుసారంగా ‘పొలాల్లో’ అని ఇచ్చాం.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: వారు పట్టణం నుంచి బయటికి రాగానే
  rationale: పొంచి ఉండే పథకంలో ఎదురుచూస్తున్న పరిస్థితిని ‘రాగానే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: వారిని సజీవంగా పట్టుకొని
  rationale: תפשׂ లోని పట్టుకోవడం/బంధించడం భావాన్నీ חַיִּים లోని ‘ప్రాణాలతోనే’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: పట్టణంలోకి ప్రవేశిద్దాం
  rationale: శత్రువులు ఊహించిన పథకంలోని సంకల్పాన్ని తెలుగులో సహజమైన ప్రథమ పురుష బహువచన రూపంలో అందిస్తుంది.
