id: 2KI.7.17
reference: 2 Kings 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: te
  text: రాజు తాను ఎవరి చేతిమీద ఆనుకునేవాడో[a] ఆ అధికారిని[b] ద్వారం పర్యవేక్షణకు నియమించి ఉంచాడు. అయితే ప్రజలు అతన్ని ద్వారం వద్ద తొక్కారు, అతడు చనిపోయాడు; రాజు దైవజనుని దగ్గరకు దిగివచ్చినప్పుడు దైవజనుడు చెప్పినట్టే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఎవరి చేతిమీద ఆనుకునేవాడో.’ ఇది రాజుకు సన్నిహితంగా సేవచేసే సహాయకుడిని సూచించే హీబ్రూ ప్రయోగం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘సైనిక అధికారి,’ ‘రాజ సహాయకుడు.’ హీబ్రూ పదం రాజుకు సన్నిహితంగా ఉండే ఉన్నతస్థాయి అధికారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: ద్వారం పర్యవేక్షణకు నియమించాడు
  rationale: హిఫిల్ రూపంలోని פקד బాధ్యత అప్పగించడాన్ని సూచిస్తుంది; עַל הַשַּׁעַר కేవలం స్థలాన్ని కాక ద్వారం మీద పర్యవేక్షణ బాధ్యతను తెలియజేస్తుంది.
- source_word: הַשָּׁלִישׁ
  choice: అధికారి
  rationale: ఇది రాజుకు సన్నిహితంగా ఉండే ఉన్నతస్థాయి సైనిక లేదా రాజోద్యోగిని సూచించవచ్చు. నిర్దిష్ట హోదాను అనవసరంగా నిర్ణయించకుండా ‘అధికారి’ అనే విస్తృత పదాన్ని ఎంచుకున్నాం.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: తాను ఎవరి చేతిమీద ఆనుకునేవాడో
  rationale: రాజు ఆధారపడే సన్నిహిత పరిచారకుడనే భావం ఉన్నప్పటికీ, మూలంలోని ‘చేతి’ ప్రతిమను ప్రధాన పాఠ్యంలో నిలిపి, దాని సాంస్కృతిక భావాన్ని పాదసూచికలో వివరించాం.
- source_word: וַיִּרְמְסֻהוּ הָעָם
  choice: ప్రజలు అతన్ని తొక్కివేయడంతో
  rationale: רמס అంటే కాళ్లకింద తొక్కడం. సందర్భంలోని జనసందోహాన్ని అతిగా వివరిస్తూ ‘గుంపు’ అని మార్చకుండా הָעָם ను ‘ప్రజలు’గా ఉంచాం.
- source_word: בַּשַּׁעַר
  choice: ద్వారం దగ్గర
  rationale: ప్రాచీన పట్టణ ద్వార ప్రాంతంలో జరిగిన సంఘటనను ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ఈ రూపాన్ని వాడాం; ఇది కేవలం తలుపు పలకలోపల అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: దైవజనుడు చెప్పినట్టే ఇది జరిగింది
  rationale: ముందుగా పలికిన ప్రవచనం నెరవేరిందనే మూలపాఠ్య ఉద్దేశాన్ని సహజమైన తెలుగు వాక్యంతో స్పష్టంగా నిలిపాం.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: రాజు తన దగ్గరికి దిగివచ్చినప్పుడు
  rationale: בְּతో కూడిన క్రియానామ రూపం కాలాన్ని సూచిస్తుంది. אֵלָיו లోని సర్వనామం దైవజనునినే సూచించేలా తెలుగు వాక్య నిర్మాణం చేశాం; ‘దిగివచ్చాడు’ అనే దిశా భావాన్ని నిలిపాం.
theological_decisions:
- issue: ప్రవచన నెరవేర్పు సూత్రం
  choice: అధికారి మరణం దైవజనుడు ముందుగా చెప్పినట్టే జరిగిందని స్పష్టంగా అనుసంధానించడం
  alternative: మరణాన్ని మాత్రమే నివేదించి, ముందటి ప్రవచనంతో ఉన్న సంబంధాన్ని సడలించడం
  rationale: כַּאֲשֶׁר דִּבֶּר మరియు పునరుక్తమైన דִּבֶּר రూపాలు ఈ సంఘటనను ముందటి దైవజనుని మాట నెరవేర్పుగా ఉద్దేశపూర్వకంగా చూపుతున్నాయి. మూలం చెప్పేదానికంటే అదనపు సిద్ధాంత నిర్ధారణ చేయకుండా ఆ కథన-దైవశాస్త్రీయ బలాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘దైవజనుడు’ అనే సంప్రదాయబద్ధమైన కానీ సాధారణ పాఠకుడికి అర్థమయ్యే బిరుదును నిలిపాం. హీబ్రూలో లేని ఆరంభ కాలసూచక పదాన్ని చేర్చలేదు. పాదసూచిక గుర్తులను పాఠ్యంలో అవి వివరించే పదబంధాల వెంట వరుసగా ఉంచాం.
