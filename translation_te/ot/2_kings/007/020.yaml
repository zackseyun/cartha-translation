source:
  edition: WLC
  text: וַ/יְהִי ל֖/וֹ כֵּ֑ן וַ/יִּרְמְס֨וּ אֹת֥/וֹ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: te
  text: 'అతనికి అలాగే జరిగింది[a]: ద్వారం వద్ద[b] ప్రజలు అతన్ని తొక్కివేశారు; అతడు చనిపోయాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని విషయంలో అలా జరిగింది.’ అంటే, ముందుగా చెప్పినట్టే సంఘటనలు జరిగాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ద్వారంలో’ లేదా ‘ద్వార ప్రదేశంలో.’ హీబ్రూ పదం పట్టణ ద్వారం దగ్గరి ప్రదేశాన్ని లేదా ద్వార సముదాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: అతనికి అలాగే జరిగింది
  rationale: హయా క్రియ, ל + సర్వనామం, כֵן కలిసిన ఈ ప్రయోగం ముందుగా చెప్పిన ప్రకారమే అతనికి జరిగిందని సూచిస్తుంది. ఈ తెలుగు రూపం నెరవేర్పు భావాన్ని సహజంగా నిలుపుతుంది; తీర్పు గురించిన వివరణను అదనంగా చేర్చదు.
- source_word: וַיִּרְמְסוּ
  choice: తొక్కివేశారు
  rationale: רמס అంటే కాళ్ల కింద తొక్కడం. సందర్భంలోని తీవ్రతను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది; ‘కాళ్ల కింద నలిపివేశారు’ అనడం మూలపదం కంటే కొంత వివరణాత్మకంగా ఉంటుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עם అనే సాధారణ నామవాచకానికి ‘ప్రజలు’ సూటి సమానం. సందర్భంలో అది ద్వారం గుండా దూసుకుపోతున్న జనాన్ని సూచించినా, ‘జనసమూహం’ అని మార్చకుండా మూలంలోని సాధారణ పదాన్ని నిలిపాం.
- source_word: בַּשַּׁעַר
  choice: ద్వారం వద్ద
  rationale: שַׁעַר పట్టణ ద్వారాన్ని మాత్రమే కాక దాని ప్రవేశ ప్రదేశం లేదా ద్వార సముదాయాన్ని కూడా సూచించగలదు. తెలుగులో ‘ద్వారం వద్ద’ సహజంగా ఉండి ఈ స్థానార్థ విస్తృతిని నిలుపుతుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: వావ్-కన్సెక్యూటివ్ క్రియను సరళ కథన రూపంలో అనువదించాం. తొక్కివేయబడటమే మరణానికి కారణమని సందర్భం స్పష్టం చేస్తుంది కాబట్టి ‘దాంతో’ వంటి ఫలిత సూచక పదాన్ని అదనంగా చేర్చలేదు.
theological_decisions:
- issue: ప్రవచనం నెరవేరడం మరియు తీర్పు
  choice: అధికారికి ముందుగా చెప్పిన ప్రకారమే జరిగిందని కథన రూపంలో చూపించడం
  alternative: ‘ఈ విధంగా అతనిమీద తీర్పు వచ్చింది’ అని దైవిక తీర్పును ప్రధాన వాక్యంలో స్పష్టంగా చెప్పడం
  rationale: సమీప సందర్భం ఇది ఎలీషా చెప్పిన మాట నెరవేర్పనీ, యెహోవా తీర్పనీ తెలియజేస్తుంది. అయితే ఈ వచనం సంఘటనను కథనంగా మాత్రమే చెబుతుంది. అందువల్ల వివరణాత్మకమైన వేదాంత భాషను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అతనికి అలాగే జరిగింది’ అనే రూపం మూలంలోని సంక్షిప్తతను, ముందుగా పలికిన మాట నెరవేరిన భావాన్ని నిలుపుతుంది. ద్వారం సూచించే హీబ్రూ పదంలోని స్థానార్థ విస్తృతిని పాదటిప్పణిలో వివరించాం.
