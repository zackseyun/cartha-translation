base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: te
  text: వారు లేచి సంధ్యవేళలో[a] పారిపోయారు; తమ గుడారాలను, గుర్రాలను, గాడిదలను—శిబిరాన్ని ఉన్నది ఉన్నట్టుగానే[b]—విడిచిపెట్టి, తమ ప్రాణాల కోసం[c] పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మసక వెలుతురు వేళలో.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “శిబిరం ఎలా ఉందో అలాగే.” అంటే, దానిని అప్పటి స్థితిలోనే వదిలేశారు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “తమ ప్రాణం వైపుకు పారిపోయారు”; ఇది ప్రాణాలను కాపాడుకోవడానికి పారిపోవడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקוּמוּ
  choice: వారు లేచి
  rationale: קום ఇక్కడ అత్యవసర చర్య ఆరంభాన్ని సూచిస్తుంది; ‘లేచి’ అనేది సహజమైన తెలుగు కథన రూపం.
- source_word: בַנֶּשֶׁף
  choice: సంధ్యవేళలో
  rationale: נֶשֶׁף పగలు-రాత్రి మధ్యనున్న మసక వెలుతురు సమయాన్ని సూచిస్తుంది. ‘సంధ్యవేళలో’ మూలార్థాన్ని సహజంగా అందిస్తుంది; సమయపదంలోని స్వల్ప అస్పష్టతను పాదటిప్పణి నిలుపుతుంది.
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టి … వదిలేసి
  rationale: עזב అంటే విడిచిపెట్టడం లేదా వదిలేయడం. తొందరపాటు పారిపోవడంలో శిబిరాన్ని పరిత్యజించిన భావాన్ని ఈ పదప్రయోగం స్పష్టంగా ఇస్తుంది.
- source_word: אָהֳלֵיהֶם
  choice: తమ గుడారాలను
  rationale: సైనిక శిబిర సందర్భంలో אֹהֶל యొక్క సాధారణ, ప్రత్యక్ష సమానార్థకం.
- source_word: סוּסֵיהֶם
  choice: గుర్రాలను
  rationale: సూసీహెమ్‌కు నేరమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: חֲמֹרֵיהֶם
  choice: గాడిదలను
  rationale: חֲמוֹרִים అంటే భారాలు మోయడానికి ఉపయోగించే గాడిదలు; ఆధునిక తెలుగులో ఇదే సాధారణ పదం.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: శిబిరాన్ని ఉన్నది ఉన్నట్టుగానే
  rationale: శిబిరాన్ని ఏమీ సర్దకుండా అప్పటి స్థితిలోనే విడిచారని మూలంలోని అసాధారణమైన కానీ బలమైన పదబంధాన్ని సమీపంగా నిలుపుతుంది.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: తమ ప్రాణాల కోసం పారిపోయారు
  rationale: అక్షరార్థంగా ‘తమ ప్రాణం వైపుకు పారిపోయారు’ అనే హెబ్రీ నుడికారం ప్రాణరక్షణ కోసం పారిపోవడాన్ని సూచిస్తుంది. తెలుగు నుడికారంలో ‘ప్రాణాల కోసం పారిపోయారు’ సహజంగా అదే అత్యవసరతను తెలియజేస్తుంది.
- source_word: וַיָּנֻסוּ ... וַיָּנֻסוּ
  choice: పారిపోయారు … పారిపోయారు
  rationale: మూలంలో נוּס క్రియ రెండుసార్లు రావడం తొందరను, ఉత్కంఠను పెంచుతుంది; అనువాదంలో ఆ పునరుక్తిని నిలిపాం.
