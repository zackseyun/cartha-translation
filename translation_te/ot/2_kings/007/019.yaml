source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/שָּׁלִ֜ישׁ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ וְ/הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/ךָ֤ רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: te
  text: 'అప్పుడు ఆ అధికారి దేవుని మనిషికి ఇలా జవాబిచ్చాడు: “యాహ్వే ఆకాశంలో కిటికీలు[a] చేసినా, ఇలాంటిది జరుగుతుందా?” దేవుని మనిషి, “ఇదిగో, నువ్వు నీ కళ్లతోనే దాన్ని చూస్తావు; కానీ దానిలో నుంచి తినవు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆకాశంలో తూములు.” హీబ్రూలో అక్షరార్థంగా “కిటికీలు” అని ఉంది; ఆకాశంలో తెరువులు లేదా తూముల వంటి ద్వారాల రూపకం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ఆ అధికారి
  rationale: ఈ పదం ఉన్నత స్థాయి సైనిక లేదా రాజసభ అధికారిని సూచిస్తుంది. నిర్దిష్ట హోదాను మించి చెప్పకుండా సందర్భానికి సరిపోయే సహజమైన పదంగా ‘అధికారి’ ఎంచుకోబడింది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తకు వాడే స్థిరమైన బిరుదును మూలానికి సమీపంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, హీబ్రూ నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: ఆకాశంలో కిటికీలు చేసినా
  rationale: హీబ్రూలోని ‘కిటికీలు/తూములు’ అనే రూపకాన్ని నిలుపుతూ, షరతుతో కూడిన సందేహప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: ఇలాంటిది జరుగుతుందా?
  rationale: ప్రవచనం నెరవేరగలదా అనే అధికారి సందేహాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: ఇదిగో, నువ్వు నీ కళ్లతోనే దాన్ని చూస్తావు
  rationale: హెచ్చరికను పరిచయం చేసే సూచనార్థక పదాన్ని, సందర్భంలో భవిష్యదర్థం కలిగిన కృదంతాన్ని, కళ్లతో ప్రత్యక్షంగా చూడడంపై ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: కానీ దానిలో నుంచి తినవు
  rationale: మూలంలోని ‘అక్కడి నుంచి/దానిలో నుంచి’ అనే సూచనను అతిగా వివరిచి నిర్దిష్ట ఆహారపదార్థంగా మార్చకుండా, ముందుగా వాగ్దానం చేసిన సమృద్ధిని సూచించేలా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనంలో దైవనామమే ప్రత్యక్షంగా ఉంది. అందువల్ల దానిని సాధారణ బిరుదుగా మార్చకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఇచ్చింది.
- issue: ఆకాశపు కిటికీల రూపకం
  choice: రూపకాన్ని ‘ఆకాశంలో కిటికీలు’గా నిలుపడం
  alternative: ఆకాశపు తూములు తెరవడం; ఆకాశం నుంచి విస్తారంగా కురిపించడం
  rationale: ఈ మాట అసాధ్యంగా కనిపించే దైవిక సమకూర్పును వ్యంగ్యంగా ప్రశ్నిస్తుంది. మూలంలోని చిత్రాన్ని వివరణాత్మక భావానువాదంతో భర్తీ చేయకుండా దాని ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. సంభాషణ గంభీరతను నిలుపుతూ పాతకాలపు లేదా అతిగా గ్రాంథికమైన పదజాలాన్ని నివారించాం. మూలంలోని సందేహప్రశ్న, ప్రవచనాత్మక ప్రతిస్పందన, ‘కిటికీలు’ అనే ఉద్దేశపూర్వక రూపకం అలాగే ఉంచబడ్డాయి.
