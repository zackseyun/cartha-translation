translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘యొర్దాను’, ‘అరాము’ అనే మూల భౌగోళిక/జాతీయ నామాలు నిలుపబడ్డాయి. ఈ వచనంలో ప్రచురణకు అవసరమైన పాఠాంతర లేదా తాత్త్విక పాదటిప్పణి లేదు.
