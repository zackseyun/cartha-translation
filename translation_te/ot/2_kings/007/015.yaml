id: 2KI.7.15
reference: 2 Kings 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: te
  text: వారు వారి వెంబడి యొర్దాను వరకు వెళ్లారు. ఇదిగో, దారంతా అరాము వారు తమ తొందరలో పారవేసిన బట్టలతోను సామగ్రితోను నిండిపోయి ఉంది. అప్పుడు ఆ దూతలు తిరిగి వచ్చి రాజుకు తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: వారు వారి వెనుక వెళ్లారు
  rationale: కథన క్రమాన్ని, వెంబడిస్తూ అనుసరించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘తరుముకుంటూ’ అనడం మూలంలో ఉన్నదానికంటే బలమైన భావాన్ని చేర్చవచ్చు.
- source_word: עַד הַיַּרְדֵּן
  choice: యొర్దాను వరకు
  rationale: עַד సూచించే చేరుకున్న హద్దును స్పష్టంగా నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ దృష్టి-ఆకర్షణ సూచకంలోని సజీవతను తెలుగు బైబిలు కథనానికి తగిన రీతిలో నిలుపుతుంది.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: దారంతా నిండిపోయి ఉంది
  rationale: అక్షరార్థమైన ‘మొత్తం దారి నిండివుంది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְגָדִים
  choice: బట్టలు
  rationale: సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే సహజ పదం; ఇక్కడ విడిచిపెట్టిన వస్త్రాలను సూచిస్తుంది.
- source_word: וְכֵלִים
  choice: సామగ్రి
  rationale: כֵלִים అనే విస్తృత పదం వస్తువులు, పరికరాలు, సైనిక సరంజామా మొదలైనవాటిని సూచించగలదు; ‘సామగ్రి’ ఆ విస్తృతిని అనవసరంగా కుదించదు.
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: అరాము వారు ... పారవేసిన
  rationale: אֲרָם అనే మూల నామాన్ని నిలుపుతూ, బహువచన క్రియకు తగిన సమూహార్థాన్ని ‘వారు’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְחָפְזָם
  choice: తమ తొందరలో
  rationale: ఒత్తిడిలో వేగంగా వెళ్లిన భావాన్ని నిలుపుతుంది; ‘భయాందోళనలో’ అని అనడం మూలాన్ని అతిగా వ్యాఖ్యానిస్తుంది.
- source_word: הַמַּלְאָכִים
  choice: దూతలు
  rationale: పంపబడిన వ్యక్తులు లేదా సందేశవాహకులు అనే మూల పదార్థాన్ని నిలుపుతుంది; సందర్భంలో వారు పరిశీలనకు పంపబడినవారైనా ‘గూఢచారులు’ అనడం మరింత వ్యాఖ్యానాత్మకం.
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: రాజుకు తెలియజేశారు
  rationale: తాము కనుగొన్న విషయాన్ని రాజుకు నివేదించిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
