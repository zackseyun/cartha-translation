    issue: The question uses “కూర్చుని ఉండాలి?”
    rationale: 'This introduces ‘should/ought to remain,’ which is not expressed in the Hebrew participial question. Use a present-progressive question: “కూర్చుని ఉన్నాం?”'
  - severity: low
    issue: Location wording is slightly awkward
    rationale: “ద్వారం ప్రవేశం వద్ద” is a more natural formal Telugu expression for ‘at the entrance of the gate’ than “ద్వార ప్రవేశం దగ్గర.”
