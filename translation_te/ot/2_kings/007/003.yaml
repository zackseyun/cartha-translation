translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని అలంకారిక ప్రశ్నను, కొనసాగుతున్న నిష్క్రియ భావాన్ని నిలుపుతూ వైద్యపరమైన అపార్థాన్ని నివారించేందుకు ప్రధాన పాఠ్యంలో ‘చర్మవ్యాధిగల’ అని వాడబడింది.
