- from: ద్వార ప్రవేశం దగ్గర చర్మవ్యాధిగల నలుగురు పురుషులు ఉన్నారు.[a] వారు ఒకరితో ఒకరు, “మనం చనిపోయేంతవరకు ఇక్కడే ఎందుకు కూర్చుని ఉండాలి?” అని చెప్పుకున్నారు.
  to: 'ద్వారం ప్రవేశం వద్ద చర్మవ్యాధి ఉన్న నలుగురు పురుషులు ఉన్నారు[a]. వారు ఒకరితో ఒకరు ఇలా అన్నారు: “మనం చనిపోయే వరకు ఇక్కడ ఎందుకు కూర్చుని ఉన్నాం?”'
