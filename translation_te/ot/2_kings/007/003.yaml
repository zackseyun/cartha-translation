source:
  edition: WLC
  text: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ מְצֹרָעִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מָ֗ה אֲנַ֛חְנוּ יֹשְׁבִ֥ים פֹּ֖ה עַד מָֽתְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: te
  text: 'ద్వారం ప్రవేశం వద్ద చర్మవ్యాధి ఉన్న నలుగురు పురుషులు ఉన్నారు[a]. వారు ఒకరితో ఒకరు ఇలా అన్నారు: “మనం చనిపోయే వరకు ఇక్కడ ఎందుకు కూర్చుని ఉన్నాం?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా, “కుష్ఠరోగులు” అని అనువదిస్తారు. హీబ్రూ పదం צָרַעַת‌కు సంబంధించిన చర్మస్థితిని సూచిస్తుంది; అది ఆధునిక కుష్ఠు వ్యాధి (హాన్సెన్ వ్యాధి)తో తప్పనిసరిగా సమానం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: నలుగురు పురుషులు ఉన్నారు
  rationale: హీబ్రూ వావ్ కొత్త దృశ్యాన్ని కలుపుతుంది; తెలుగులో సహజ కథన ప్రవాహం కోసం ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చలేదు. אֲנָשִׁים ఇక్కడ నిర్దిష్టమైన వయోజన పురుషులను సూచిస్తుంది.
- source_word: מְצֹרָעִים
  choice: చర్మవ్యాధిగల
  rationale: ఈ పదం צָרַעַת‌కు సంబంధించిన స్థితిని సూచిస్తుంది; అది ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం కాదు. అందువల్ల వైద్యపరంగా అతినిర్దిష్టం కాని స్పష్టమైన పదబంధం ఎంచుకోబడింది.
- source_word: פֶּתַח הַ/שָּׁעַר
  choice: ద్వార ప్రవేశం దగ్గర
  rationale: నిర్మాణ పదబంధంలోని ‘ద్వారం యొక్క ప్రవేశం/తెరువు’ అనే స్థానార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַ/יֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: వారు ఒకరితో ఒకరు … అని చెప్పుకున్నారు
  rationale: పంపిణీ ఏకవచన హీబ్రూ నుడికారం గుంపులోని పరస్పర సంభాషణను సూచిస్తుంది; తెలుగు పరస్పర రూపం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: మనం … ఇక్కడే ఎందుకు కూర్చుని ఉండాలి?
  rationale: మָה ఇక్కడ అలంకారిక ప్రశ్నలో ‘ఎందుకు’ అనే అర్థం ఇస్తుంది. వర్తమాన క్రియావిశేషణం కొనసాగుతున్న కూర్చోవడం/నిష్క్రియను వ్యక్తం చేస్తుంది.
- source_word: עַד מָתְנוּ
  choice: చనిపోయేంతవరకు
  rationale: అక్కడే ఉండటానికి మరణమే అంతిమ హద్దు అవుతుందనే భావాన్ని నేరుగా నిలుపుతుంది.
