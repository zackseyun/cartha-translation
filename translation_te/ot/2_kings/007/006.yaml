id: 2KI.7.6
reference: 2 Kings 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: te
  text: నిజానికి, ప్రభువు అరాము శిబిరానికి రథాల శబ్దం, గుర్రాల శబ్దం, ఒక గొప్ప సైన్యం శబ్దం వినిపించాడు. అప్పుడు వారు ఒకరితో ఒకరు, “చూడండి! ఇశ్రాయేలు రాజు హిత్తీయుల రాజులను, ఐగుప్తు రాజులను మనకు వ్యతిరేకంగా మన మీదికి రావడానికి కిరాయికి తీసుకున్నాడు” అని చెప్పుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: ప్రభువు
  rationale: ఇక్కడ אֲדֹנָי ఇశ్రాయేలు దేవునికి వాడిన దైవ బిరుదు. దానిని సహజమైన, గౌరవప్రదమైన తెలుగు రూపం ‘ప్రభువు’గా అనువదించాం; మూలంలో లేని యెహోవా నామాన్ని చేర్చలేదు.
- source_word: הִשְׁמִיעַ
  choice: వినిపించేలా చేశాడు
  rationale: 'שׁמע హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతుంది: అరాము వారు కేవలం విన్నారని కాక, ప్రభువే వారికి వినిపించేలా చేశాడని వాక్యం చెబుతోంది.'
- source_word: מַחֲנֵה אֲרָם
  choice: అరాము శిబిరంలోని వారికి
  rationale: ‘అరాము’ అనే మూల నామాన్ని నిలిపి, శిబిరం దానిలోని మనుషులకు ప్రతినిధిగా వాడబడిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం. అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: קוֹל רֶכֶב ... קוֹל סוּס ... קוֹל חַיִל גָּדוֹל
  choice: రథాల శబ్దం, గుర్రాల శబ్దం, ఒక గొప్ప సైన్యం శబ్దం
  rationale: మూలంలోని קוֹל (‘శబ్దం’) అనే పదం మూడుసార్లు పునరుక్తమవుతుంది. సైనిక దృశ్యాన్నీ, ఆ గంభీర పునరుక్తినీ తెలుగులో నిలిపాం.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: వారు ఒకరితో ఒకరు ... అని చెప్పుకున్నారు
  rationale: అక్షరార్థంగా ‘ఒక్కొక్కరు తన సహోదరునితో’ అనే హెబ్రీ పరస్పర ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִנֵּה
  choice: చూడండి!
  rationale: ఆశ్చర్యంతో ఎదుటివారి దృష్టిని ఆకర్షించే హిన్నే పదబలాన్ని ప్రస్తుత తెలుగు సంభాషణలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂכַר עָלֵינוּ
  choice: మనకు వ్యతిరేకంగా కిరాయికి పెట్టుకున్నాడు
  rationale: שׂכר లోని కిరాయికి తీసుకోవడం అనే భావాన్నీ, עַל లోని విరోధార్థాన్నీ నిలిపాం; మూలంలో స్పష్టంగా లేని ‘కిరాయి సైనికులు’ వంటి పదాన్ని చేర్చలేదు.
- source_word: מַלְכֵי הַחִתִּים וְאֶת מַלְכֵי מִצְרַיִם
  choice: హిత్తీయుల రాజులను, ఐగుప్తు రాజులను
  rationale: మూలంలోని రెండు బహువచన రూపాలనూ యథాతథంగా నిలిపాం; చారిత్రకంగా అసాధారణంగా అనిపించవచ్చనే కారణంతో ‘ఐగుప్తు రాజు’ అని ఏకవచనంగా మార్చలేదు.
- source_word: לָבוֹא עָלֵינוּ
  choice: మన మీదికి రావడానికి
  rationale: విరోధపూర్వకంగా వచ్చుట అనే మూల భావాన్ని నిలిపి, ‘మనపై దాడి చేయడానికి’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా అనువదించాం.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ కథన సందర్భంలో ఈ బిరుదు ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది. ‘ప్రభువు’ ఆ దైవ బిరుదుకు గౌరవప్రదమైన సహజ తెలుగు సమానం; అయితే ఇది יהוה అనే నామం కాదనే మూలభేదాన్ని గౌరవిస్తూ ‘యెహోవా’ అని అనువదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని కారణార్థం, ‘శబ్దం’ అనే మూడుసార్ల పునరుక్తి, రాజుల బహువచనం, విరోధపూర్వకంగా ‘రావడం’ అనే కొంత విస్తృత భావం అన్నీ నిలిపాం.
