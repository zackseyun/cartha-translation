source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: te
  text: 'అప్పుడు వారు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు: “మనం చేస్తున్నది సరికాదు. ఈ రోజు శుభవార్తల రోజు; మనమేమో మౌనంగా ఉన్నాం. తెల్లవారే వరకు వేచి ఉంటే, మనపై దోషం పడుతుంది[a]. కాబట్టి ఇప్పుడు రండి, మనం వెళ్లి రాజు ఇంటివారికి[b] ఈ సంగతి తెలియజేద్దాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిక్ష మనలను పట్టుకుంటుంది,” లేదా “మనం దోషులమవుతాం.” హెబ్రీలో అక్షరార్థంగా, “అపరాధం/దోషం మనలను కనుగొంటుంది.”
    reason: lexical_alternative
  - marker: b
    text: “రాజు ఇంటివారికి” అనే మాటను “రాజు ఇంటికి” లేదా “రాజప్రాసాదానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: మనం చేస్తున్నది సరికాదు
  rationale: ‘మనం ఇలా చేయడం సరికాదు’ అనే హెబ్రీ నైతిక మూల్యాంకనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יוֹם בְּשֹׂרָה
  choice: శుభవార్త దినం
  rationale: בְּשֹׂרָה ఇక్కడ ముట్టడి తొలగిపోయిందనే సంతోషకరమైన విమోచన వార్తను సూచిస్తుంది.
- source_word: מַחְשִׁים
  choice: మౌనంగా ఉన్నాం
  rationale: హిఫిల్ రూపం ఉద్దేశపూర్వకంగా వార్తను చెప్పకుండా మౌనం వహిస్తున్న నిరంతర స్థితిని సూచిస్తుంది.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: తెల్లవారే వరకు వేచి ఉంటే
  rationale: సందర్భంలో ఈ వాక్యభాగం షరతు భావాన్ని ఇస్తుంది; ‘తెల్లవారే వరకు’ ఉదయపు వెలుగు అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּמְצָאנוּ עָוֹן
  choice: దోషం మనలను పట్టుకుంటుంది
  rationale: అక్షరార్థంగా ‘దోషం/అపరాధం మనలను కనుగొంటుంది.’ ‘పట్టుకుంటుంది’ అనే రూపకం మూలంలోని ఉద్రిక్తతను నిలుపుతూ, అపరాధబాధ్యత లేదా దాని శిక్ష రెండింటికీ చోటిస్తుంది.
- source_word: לְכוּ וְנָבֹאָה
  choice: రండి, మనం వెళ్లి
  rationale: రెండు క్రియలూ కలసి తక్షణ చర్యకు ఇచ్చిన ప్రోత్సాహాన్ని సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: וְנַגִּידָה
  choice: ఈ సంగతి తెలియజేద్దాం
  rationale: నగద్ హిఫిల్ ఇక్కడ అధికారికంగా వార్త చెప్పడం లేదా నివేదించడం అనే భావంలో ఉంది; సందర్భం స్పష్టత కోసం ‘ఈ సంగతి’ చేర్చబడింది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజు ఇంటివారికి
  rationale: అక్షరార్థమైన ‘రాజు ఇల్లు’ రాజకుటుంబం లేదా రాజప్రాసాద వ్యవస్థను సూచించవచ్చు. వార్తను స్వీకరించే వ్యక్తులను ఉద్దేశించిన సహజ తెలుగు రూపంగా ఇది సరిపోతుంది.
theological_decisions:
- issue: עָוֹן అనే పదం దోషాన్నా, శిక్షనూ సూచిస్తుందా
  choice: దోషం మనలను పట్టుకుంటుంది
  alternative: శిక్ష మనలను పట్టుకుంటుంది; మనం దోషులమవుతాం
  rationale: మూలపదంలోని నైతిక దోషం మరియు దాని పరిణామం మధ్య ఉన్న ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠంలో పూర్తిగా ఒక వైపుకు తీర్మానించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని రూపకం మరియు עָוֹן పదంలోని దోషం–శిక్ష అస్పష్టతను పాదసూచికతో సంరక్షించాం; ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
