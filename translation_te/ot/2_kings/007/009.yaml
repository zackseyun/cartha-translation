  to: 'అప్పుడు వారు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు: “మనం చేస్తున్నది సరికాదు. ఈ రోజు శుభవార్తల రోజు; మనమేమో మౌనంగా ఉన్నాం. తెల్లవారే వరకు వేచి ఉంటే, మనపై దోషం పడుతుంది[a]. కాబట్టి ఇప్పుడు రండి, మనం వెళ్లి రాజు ఇంటివారికి[b] ఈ సంగతి తెలియజేద్దాం.”'
  rationale: The revision makes two limited idiomatic improvements without altering the source sense. It replaces a stiff calque for ‘a day of good news’ and replaces an unnatural personification of guilt with a natural Telugu expression that preserves the Hebrew term’s unresolved guilt/punishment range. Footnote anchors remain immediately attached to their relevant phrases.
