- from: అప్పుడు ద్వారపాలకులు కేకవేసి, ఆ సంగతి రాజభవనం లోపలికి తెలియజేశారు.[a]
  to: అప్పుడు ద్వారపాలకులు బిగ్గరగా పిలిచి, ఆ సంగతి రాజగృహంలోకి తెలియజేశారు.[a]
  rationale: The revision replaces the emotionally stronger “కేకవేసి” with a more contextually precise expression for calling out, and replaces “రాజభవనం” with “రాజగృహం” to avoid unnecessarily restricting the Hebrew “king’s house” to a building alone. The footnote preserves the viable household-oriented construal while identifying the literal spatial wording.
