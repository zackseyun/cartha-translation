translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘ద్వారపాలకులు,’ ‘రాజభవనం’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలు. మూలంలోని స్థలార్థం మరియు రాజగృహస్థులనే సూచించే సంభావ్యత రెండింటినీ ప్రధాన పాఠ్యం–పాదసూచిక ద్వారా నిలుపుకున్నాం.
