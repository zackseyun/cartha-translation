  yaml_path: translation/ot/2_kings/007/011.yaml
  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: te
  text: అప్పుడు ద్వారపాలకులు బిగ్గరగా పిలిచి, ఆ సంగతి రాజగృహంలోకి తెలియజేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ సంగతి లోపల ఉన్న రాజు ఇంటివారికి తెలియజేశారు.” హీబ్రూ పదబంధం అక్షరార్థంగా “రాజు ఇంటి లోపలికి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: కేకవేసి
  rationale: קרא ఇక్కడ వార్తను లోపలివారికి వినిపించేలా బిగ్గరగా పిలవడాన్ని సూచిస్తుంది. ఏకవచన క్రియ తరువాత సమూహార్థక బహువచన కర్త రావడం హీబ్రూ వాక్యనిర్మాణ లక్షణం; తెలుగులో సహజంగా బహువచన కర్తకు అనుగుణంగా అనువదించబడింది.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: పట్టణ ద్వారం వద్ద విధిలో ఉన్నవారిని సూచించే שֹׁעֲרִים కు ఇది నేరమైన, ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: וַיַּגִּידוּ
  choice: తెలియజేశారు
  rationale: נגד యొక్క ‘తెలియజేయడం/నివేదించడం’ అనే భావాన్ని సందర్భానుగుణంగా సహజంగా వ్యక్తం చేస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, ముందటి సమాచారాన్ని సూచించేందుకు ‘ఆ సంగతి’ చేర్చబడింది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థంగా ‘రాజు ఇల్లు’; ఈ సందర్భంలో రాజు నివసించే లేదా రాజకార్యాలు జరిగే భవనాన్ని తెలుగులో సహజంగా ‘రాజభవనం’ అంటారు. ‘రాజకుటుంబం’ అని అనువదిస్తే వ్యక్తుల సమూహాన్ని అనవసరంగా నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: פְּנִימָה
  choice: లోపలికి
  rationale: ఈ దిశాసూచక అవ్యయం బయటినుంచి అంతర్భాగానికి సమాచారం చేరిన భావాన్ని ఇస్తుంది; ‘లోపలికి’ ఆ చలనార్థాన్ని నిలుపుతుంది.
