id: 2KI.7.1
reference: 2 Kings 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: te
  text: 'అప్పుడు ఎలీషా ఇలా అన్నాడు: “యాహ్వే వాక్యాన్ని వినండి. యాహ్వే ఇలా అంటున్నాడు: రేపు దాదాపు ఇదే సమయానికి, సమరయ పట్టణ ద్వారం వద్ద ఒక షెకెలుకు ఒక సేయా[a] సన్నని పిండి, ఒక షెకెలుకు రెండు సేయాల యవలు అమ్ముడవుతాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సేయా అనేది పొడి పదార్థాలను కొలిచే ప్రాచీన నిర్దిష్ట కొలమానం.
    reason: హీబ్రూ పాఠంలోని నిర్దిష్ట కొలమానాన్ని నిలుపుతూ, ఆధునిక పాఠకులకు దాని స్వభావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమబద్ధతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: ఇది బహువచన ఆజ్ఞార్థకం; ప్రవచన ప్రకటనలోని గంభీర పిలుపును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్యం
  rationale: ప్రామాణిక ప్రవచన సూత్రాన్ని, ‘వాక్యం’ అనే దాని ఒడంబడిక-ప్రవచన భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త దూతగా ప్రకటించే సూత్రాన్ని ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּעֵת מָחָר
  choice: రేపు దాదాపు ఇదే సమయానికి
  rationale: כָּ ఉపసర్గలోని సుమారు అనే భావాన్ని, మరుసటి రోజున ఇదే సమయమనే అర్థాన్ని తెలియజేస్తుంది.
- source_word: סְאָה
  choice: సేయా
  rationale: ఇది నిర్దిష్టమైన పొడి కొలత; సాధారణ ‘కొలత’గా మార్చకుండా సాంస్కృతిక-ఆర్థిక వివరాన్ని నిలుపుతుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: సాధారణ పిండి కాకుండా సన్నగా, మెత్తగా చేసిన ఉత్తమ రకం పిండిని సూచిస్తుంది.
- source_word: בְּשֶׁקֶל
  choice: ఒక షెకెలుకు
  rationale: ఈ మార్కెట్ ధర సందర్భంలో בְּ ధరను సూచిస్తుంది; తెలుగులో సహజమైన ధర నిర్మాణం.
- source_word: וְסָאתַיִם
  choice: రెండు సేయాల
  rationale: ద్వివచన రూపాన్ని స్పష్టంగా రెండు అని అనువదించి, అదే కొలమాన పదాన్ని స్థిరంగా ఉంచుతుంది.
- source_word: שְׂעֹרִים
  choice: యవలు
  rationale: ధాన్యానికి ప్రామాణికమైన తెలుగు పదం; మార్కెట్ సందర్భానికి సరిపోతుంది.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: సమరయ ద్వారం దగ్గర
  rationale: పట్టణ ద్వారం వాణిజ్య, పౌర కార్యకలాపాల స్థలం; ‘దగ్గర’ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంతో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణంతో పాటు ప్రవచన ప్రకటనకు తగిన గంభీరతను నిలిపాం. ధరల వాక్యాన్ని తెలుగులో సహజంగా చేయడానికి ‘అమ్ముడవుతాయి’ అని సందర్భార్థాన్ని స్పష్టం చేశాం; నిర్దిష్ట ప్రాచీన కొలమానాన్ని ప్రధాన పాఠంలో అలాగే ఉంచి పాదటిప్పణిలో వివరించాం.
