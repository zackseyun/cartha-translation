  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: te
  text: అప్పుడు ప్రజలు బయలుదేరి అరాము శిబిరాన్ని[a] దోచుకున్నారు. ఒక సేయా[b] సన్నని పిండి ఒక షెకెలుకు, రెండు సేయాల యవలు ఒక షెకెలుకు ధర పలికాయి—యాహ్వే మాట ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అరామీయుల శిబిరం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: సేయా అనేది ప్రాచీన పొడి కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: అప్పుడు ప్రజలు బయలుదేరి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు క్రమాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹזּוּ
  choice: దోచుకున్నారు
  rationale: యుద్ధంలో శత్రు శిబిరంలోని సొత్తును కొల్లగొట్టే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַחֲנֵה אֲרָם
  choice: అరాము శిబిరాన్ని
  rationale: హీబ్రూ నిర్మాణంలోని ‘అరాము శిబిరం’ అనే భావాన్ని నిలుపుతూ, ‘సిరియా’ అనే తరువాతి భౌగోళిక పేరును దిగుమతి చేయకుండా మూలనామాన్ని ఉంచుతుంది.
- source_word: וַיְהִי
  choice: ధర ... అయింది
  rationale: ఈ సందర్భంలో ధాన్యపు మార్కెట్ ధర ఏర్పడిందనే భావం ఉంది; తెలుగులో ధర ప్రకటనగా సహజంగా వ్యక్తం చేయబడింది.
- source_word: סְאָה / סָאתַיִם
  choice: ఒక సేయా / రెండు సేయాలు
  rationale: నిర్దిష్టమైన ప్రాచీన పొడి కొలమానాన్ని సాధారణ ‘కొలత’గా మార్చకుండా లిప్యంతరీకరించింది; ద్వివచనాన్ని ‘రెండు’గా స్పష్టంగా ఉంచింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: సాధారణ పిండి కాకుండా నాజూకుగా తయారుచేసిన ఉత్తమ పిండిని సూచించే మూలపద భావాన్ని తెలియజేస్తుంది.
- source_word: בְּשֶׁקֶל
  choice: ఒక షెకెలు
  rationale: ప్రాచీన బరువు/ధన ప్రమాణమైన షెకెలును నిలుపుతూ ధరను సహజమైన తెలుగులో తెలిపింది.
- source_word: שְׂעֹרִים
  choice: యవలు
  rationale: ధాన్యవస్తువైన బార్లీకి ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదాన్ని ఉపయోగించింది.
- source_word: כִּדְבַר יְהוָה
  choice: యాహ్వే మాట ప్రకారం
  rationale: ముందుగా పలికిన దైవవాక్యం నెరవేరిందనే సంబంధాన్ని, అలాగే మూలంలోని దైవనామాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా సూచిస్తుంది.
- issue: כִּדְבַר అనే నెరవేర్పు సూత్రం
  choice: మాట ప్రకారం
  alternative: చెప్పినట్టే
  rationale: ప్రవచన నెరవేర్పును సూచించే భావాన్ని నిలుపుతూ, మూలంలోని ‘మాట’ అనే నామవాచకాన్ని కూడా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ప్రాచీన పేర్లు, కొలమానాలు లిప్యంతరీకరించబడ్డాయి; అవగాహన కోసం పాదసూచికలు జోడించబడ్డాయి. మూలంలో ధరను సూచించే సంక్షిప్త నిర్మాణాన్ని తెలుగులో స్పష్టమైన సమాంతర వాక్యంగా మలిచాం.
