source:
  edition: WLC
  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: te
  text: అతడు ఉన్నత స్థలాల్లో[a], కొండల మీద, పచ్చగా ఉన్న ప్రతి చెట్టు కింద బలులు అర్పించి ధూపం వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఉన్నత స్థలాలు” అంటే స్థానిక ఆరాధనా కేంద్రాలు; అవి తప్పనిసరిగా కొండ శిఖరాల మీదే ఉండేవని కాదు.
    reason: సాంస్కృతిక-పదార్థ వివరణ; తరువాత వచ్చే ‘కొండలు’తో తేడాను స్పష్టం చేయడం.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: బలులు అర్పించి
  rationale: זבח బలి అర్పించే ఆరాధనా క్రియను సూచిస్తుంది. హెబ్రీలో ప్రత్యక్ష కర్మ లేకపోయినా, సహజమైన ఆధునిక తెలుగులో క్రియ భావాన్ని స్పష్టంగా తెలియజేయడానికి బహువచన సాధారణ నామవాచకం వాడబడింది.
- source_word: וַיְקַטֵּר
  choice: ధూపం వేశాడు
  rationale: ఆరాధనా సందర్భంలో קטר పియేల్ రూపం సాధారణంగా ధూపం కాల్చడాన్ని సూచిస్తుంది. ‘ధూపం వేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ క్రియను కచ్చితంగా తెలియజేస్తుంది.
- source_word: בַּבָּמוֹת
  choice: ఉన్నత స్థలాల్లో
  rationale: במות అనేది స్థానిక ఆరాధనా కేంద్రాలను సూచించే స్థిరమైన బైబిలు పదం. ‘ఉన్నత స్థలాలు’ వాటిని తరువాత వచ్చే సహజ భౌగోళిక ‘కొండలు’ నుండి వేరుగా ఉంచుతుంది.
- source_word: וְעַל הַגְּבָעוֹת
  choice: కొండల మీద
  rationale: גבעות అంటే కొండలు. భౌగోళిక ప్రదేశాన్ని సరళంగా, ఉన్నత స్థలాలనే ఆరాధనా కేంద్రాలకు భిన్నంగా అనువదిస్తుంది.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: పచ్చగా ఉన్న ప్రతి చెట్టు కింద
  rationale: רענן పచ్చగా, తాజాగా, దట్టంగా పెరిగినదనే భావాలను కలిగి ఉంది. ప్రధాన పాఠంలో ‘పచ్చగా ఉన్న’ అనే విస్తృతమైన అర్థాన్ని ఉంచి, ఇతర సాధ్యమైన సూక్ష్మ భావాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: అక్రమ ఆరాధనను వర్ణించే సూత్రబద్ధమైన పదబంధం
  choice: బలులు, ధూపం, ఉన్నత స్థలాలు, కొండలు, చెట్లు అనే స్పష్టమైన క్రియలు మరియు ప్రదేశాలనే నిలిపి ఉంచడం
  alternative: ‘అతడు అన్యదేవతల ఆరాధన చేశాడు’ వంటి వ్యాఖ్యానాత్మక అనువాదం
  rationale: ఈ వచనం ఆ ఆరాధనను నేరుగా ‘అన్యదేవతల ఆరాధన’ అని పిలవదు. కాబట్టి ప్రతికూల మతపరమైన మూల్యాంకనాన్ని అనువాదంలో అదనంగా చేర్చకుండా, సందర్భమే దాన్ని తెలియజేయనిచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయినా గంభీరమైన బైబిలు శైలిలో రూపొందించబడింది. హెబ్రీ క్రియల వరుసను తెలుగులో సహజంగా కలిపి, ‘బలులు అర్పించి ధూపం వేశాడు’గా ఇచ్చాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
