source:
  edition: WLC
  text: וַ/יְקַצֵּץ֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶת הַ/מִּסְגְּר֣וֹת הַ/מְּכֹנ֗וֹת וַ/יָּ֤סַר מֵֽ/עֲלֵי/הֶם֙ ו/את הַ/כִּיֹּ֔ר וְ/אֶת הַ/יָּ֣ם הוֹרִ֔ד מֵ/עַ֛ל הַ/בָּקָ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁ֣ר תַּחְתֶּ֑י/הָ וַ/יִּתֵּ֣ן אֹת֔/וֹ עַ֖ל מַרְצֶ֥פֶת אֲבָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: te
  text: అప్పుడు ఆహాజు రాజు ఆధార పీఠాల చట్రాలను కోసివేసి, వాటిమీదనున్న తొట్టెను తీసివేశాడు. కంచు ఎద్దుల[a] మీద ఉన్న సముద్రం[b] అనే పెద్ద తొట్టెను దించి, రాళ్ల పరుపుమీద ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కంచు పశువులు.’ హీబ్రూ పదం సాధారణంగా పశువులను సూచించగలదు; ఈ ఆలయ సందర్భంలో ‘ఎద్దులు’ అనే అనువాదం సాంప్రదాయికంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సముద్రం’ అనేది సొలొమోను ఆలయం కోసం చేయించిన పెద్ద తొట్టె పేరు (1 రాజులు 7:23–26 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: కోసివేసి
  rationale: קצץ అంటే కోసివేయడం లేదా కోసి తొలగించడం; పీఠాల భాగాలను విడదీసిన సందర్భానికి ఈ ప్రయోగం సహజంగా సరిపోతుంది.
- source_word: הַמִּסְגְּרוֹת
  choice: చట్రాలను
  rationale: מִסְגְּרוֹת అనేది చుట్టూ అమర్చిన చట్రాలు లేదా అంచు నిర్మాణాలను సూచిస్తుంది; ‘చట్రాలు’ తటస్థమైన, స్పష్టమైన పదం.
- source_word: הַמְּכֹנוֹת
  choice: పీఠాల
  rationale: ఆలయ సామగ్రి సందర్భంలో מְכֹנוֹת తొట్టెలను మోసే కదిలే ఆధార నిర్మాణాలు; ఆధునిక తెలుగులో ‘పీఠాలు’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  choice: వాటి మీదనుండి తొట్టెలను తీసివేశాడు
  rationale: כִּיּוֹר ఆలయ సేవలో వాడే కడుగు తొట్టె; బహువచన పీఠాలకు సంబంధించిన సమూహ వస్తువుగా సందర్భానుసారంగా తెలుగులో ‘తొట్టెలను’ అని ఇవ్వడం సహజం.
- source_word: הַיָּם
  choice: సముద్రం అనే పెద్ద తొట్టెను
  rationale: ‘సముద్రం’ సొలొమోను ఆలయంలోని పెద్ద తొట్టెకు పెట్టిన పేరు. పేరును నిలుపుతూ సాధారణ పాఠకునికి వస్తువు ఏమిటో ప్రధాన వాక్యంలో స్పష్టం చేశాం.
- source_word: הוֹרִד
  choice: దించి
  rationale: హిఫీల్ రూపం ఆధారం మీదనుండి కిందికి దింపడాన్ని సూచిస్తుంది.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: కంచు ఎద్దుల
  rationale: בָּקָר విస్తృతంగా పశువులను సూచించగలిగినా, ఆలయ నిర్మాణ సందర్భంలో ఆధారంగా ఉన్న ఎద్దు రూపాలు భావించబడతాయి; נְחֹשֶׁתకు ‘కంచు’ సాంప్రదాయికంగా, సహజంగా ఉంది.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: ఉంచాడు
  rationale: ఇక్కడ נתן ఒక వస్తువును నిర్దిష్ట స్థలంలో పెట్టడాన్ని సూచిస్తుంది; ‘ఉంచాడు’ సహజమైన తెలుగు.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: రాళ్లు పరచిన నేల మీద
  rationale: מַרְצֶפֶת అర్థం రాళ్లతో పరచిన ఉపరితలం; ‘రాళ్లు పరచిన నేల’ ఎత్తైన వేదిక అనే అనవసర భావాన్ని కలిగించకుండా అర్థాన్ని తెలియజేస్తుంది.
