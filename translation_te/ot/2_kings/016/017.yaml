translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘చట్రాలు,’ ‘పీఠాలు,’ ‘తొట్టె,’ ‘రాళ్లు పరచిన నేల’ వంటి స్పష్టమైన నిర్మాణ పదాలను ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను సహజ తెలుగు వాక్య ప్రవాహం కోసం రెండు వాక్యాలుగా విభజించాం.
