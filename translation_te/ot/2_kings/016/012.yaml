  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: te
  text: రాజు దమస్కు నుండి వచ్చాడు; రాజు ఆ బలిపీఠాన్ని చూశాడు. రాజు బలిపీఠం దగ్గరికి వచ్చి దానిమీదికి ఎక్కాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలిపీఠం దగ్గరికి వచ్చి దానిమీద బలి అర్పించాడు.” “దానిమీదికి ఎక్కాడు” అనే మాటను కొందరు బలి అర్పించడం ప్రారంభించాడనే సంక్షిప్త వ్యక్తీకరణగా అర్థం చేసుకుంటారు. అయితే హీబ్రూ పదాలు మరింత సూటిగా బలిపీఠం మీదికి ఎక్కడాన్ని వర్ణిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: בוא అనే క్రియ ఇక్కడ రాజు దమస్కు నుండి తిరిగి రావడాన్ని సూచిస్తుంది. అనుసరించే క్రియలతో సహజమైన తెలుగు కథన సంబంధాన్ని చూపడానికి ‘వచ్చినప్పుడు’ అని అనువదించాం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో ఈ పదం మూడుసార్లు పునరావృతమైంది. ఆహాజు స్వయంగా చేసిన చర్యలను నొక్కిచెప్పే మూలపాఠ శైలిని నిలుపుకోవడానికి తెలుగులోనూ మూడుసార్లు ఉంచాం.
- source_word: מִדַּמֶּשֶׂק
  choice: దమస్కు నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; דַּמֶּשֶׂק అనే స్థలనామాన్ని ప్రామాణిక తెలుగు రూపమైన ‘దమస్కు’గా ఇచ్చాం.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה ఇక్కడ సాధారణ దృశ్యగ్రహణాన్ని సూచిస్తుంది; ‘చూశాడు’ దాని సూటి, సహజమైన తెలుగు రూపం.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: ఆ బలిపీఠాన్ని
  rationale: מִזְבֵּחַకు ‘బలిపీఠం’ ప్రామాణికమైన, అర్థస్పష్టమైన తెలుగు పదం. సందర్భంలో ముందే పేర్కొన్న నిర్దిష్ట బలిపీఠం కావడంతో ‘ఆ’ చేర్చాం.
- source_word: וַיִּקְרַב עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గరికి వచ్చి
  rationale: קרב అంటే దగ్గరికి రావడం లేదా సమీపించడం. దాని కదలిక భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: וַיַּעַל עָלָיו
  choice: దాని మీదికి ఎక్కాడు
  rationale: עלה తో పాటు עַל మరియు సర్వనామ ప్రత్యయం రావడం బలిపీఠం మీదికి ఎక్కిన భౌతిక కదలికను అత్యంత సూటిగా సూచిస్తుంది. అర్పణ చర్యను ఇక్కడే స్పష్టంగా చేర్చకుండా మూలంలోని ఉద్విగ్నతను నిలిపాం.
theological_decisions:
- issue: וַיַּעַל עָלָיו అనేది బలిపీఠం మీదికి భౌతికంగా ఎక్కడాన్నా, లేక దానిమీద బలి అర్పించడాన్నా సూచిస్తుందా?
  choice: 'భౌతిక కదలిక: ‘దాని మీదికి ఎక్కాడు’'
  alternative: ‘దానిమీద అర్పించాడు’ లేదా ‘దాని దగ్గరికి ఎక్కి వెళ్లాడు’
  rationale: עלה + עַל + సర్వనామ ప్రత్యయం అనే హీబ్రూ నిర్మాణం అత్యంత సహజంగా పైకి లేదా మీదికి కదలడాన్ని సూచిస్తుంది. బలి అర్పణ భావం సందర్భంలో సాధ్యమైనప్పటికీ, అది ఈ ఉపవాక్యంలో స్పష్టంగా చెప్పబడలేదు; తరువాతి వచనం ఆ చర్యను వివరిస్తుంది. అందువల్ల ప్రధాన పాఠంలో సూటి అర్థాన్ని, పాదసూచికలో ప్రత్యామ్నాయ అర్థాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ మూలంలోని ‘రాజు’ అనే మూడుసార్ల పునరావృతాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. చివరి క్రియలోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
