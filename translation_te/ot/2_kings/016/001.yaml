  text: בִּ/שְׁנַת֙ שְׁבַֽע עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/פֶ֖קַח בֶּן רְמַלְיָ֑הוּ מָלַ֛ךְ אָחָ֥ז בֶּן יוֹתָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: te
  text: రెమల్యా కుమారుడైన పెకహు పరిపాలనలో పదిహేడవ సంవత్సరంలో, యోతాము కుమారుడైన ఆహాజు యూదాకు రాజుగా పరిపాలించడం ప్రారంభించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: పరిపాలనలో పదిహేడవ సంవత్సరంలో
  rationale: రాజుల పాలనకాల సమన్వయాన్ని తెలిపే హీబ్రూ తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సంఖ్యను కాలవ్యవధిగా కాక క్రమసంఖ్యగా అనువదిస్తుంది.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: రెమల్యా కుమారుడైన పెకహు
  rationale: לְ ఇక్కడ ఎవరి పాలనలోని సంవత్సరం లెక్కించబడుతోందో సూచిస్తుంది; బంధుత్వ నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించడం ప్రారంభించాడు
  rationale: రాజ్యారంభ సూత్రంలో మָלַךְ సింహాసనాధికార ఆరంభాన్ని సూచిస్తుంది; కేవలం ‘పరిపాలించాడు’ అనడం వల్ల కలిగే కాలవ్యవధి భావాన్ని నివారిస్తుంది.
- source_word: אָחָז בֶּן יוֹתָם
  choice: యోతాము కుమారుడైన ఆహాజు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదాకు రాజుగా
  rationale: ఆహాజు ఏ రాజ్యంపై రాజయ్యాడో తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలోని అన్వయ పదబంధ భావాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక రాజ్యకాల వాక్యానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
