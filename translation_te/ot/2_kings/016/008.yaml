id: 2KI.16.8
reference: 2 Kings 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: te
  text: ఆహాజు యహ్వే మందిరంలోనూ రాజభవన ఖజానాల్లోనూ దొరికిన వెండిని, బంగారాన్ని తీసుకొని, వాటిని అష్షూరు రాజుకు లంచంగా[a] పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కప్పం’ లేదా ‘కానుక’; హీబ్రూ పదం సాధారణంగా ‘లంచం’ అనే భావాన్ని కలిగి ఉంటుంది.
    reason: שֹׁחַד పదానికి సందర్భంలో సాధ్యమైన ప్రత్యామ్నాయాలను తెలియజేస్తూనే, దాని సాధారణ ప్రతికూల భావాన్ని ప్రధాన పాఠ్యంలో నిలుపడం.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియను సహజమైన తెలుగు భూతకాల అనుసంధాన రూపంలో ఇచ్చాం.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: వెండిని, బంగారాన్ని
  rationale: మూలంలోని రెండు విలువైన లోహాలను విడివిడిగా, నిర్దిష్ట వస్తువులుగా నిలుపుతుంది.
- source_word: הַנִּמְצָא
  choice: దొరికిన
  rationale: מצא యొక్క నిష్క్రియార్థాన్ని నేరుగా తెలియజేస్తూ, ఆ ప్రదేశాల్లో అందుబాటులో ఉన్న ధనాన్ని సూచిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: ‘యహ్వే గృహం’ అనే అక్షరార్థం కంటే సందర్భానుసారంగా ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయలేదు.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: రాజభవన ఖజానాల్లోనూ
  rationale: ‘రాజు గృహంలోని ఖజానాలు’ అనే భావాన్ని సహజమైన తెలుగు రాజసంబంధ పదబంధంగా అందిస్తుంది; బహువచనాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: కథనంలోని తదుపరి చర్యను సహజమైన తెలుగు భూతకాలంలో వ్యక్తం చేస్తుంది.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజుకు
  rationale: హీబ్రూ భౌగోళిక-రాజకీయ పేరును, రాజును సూచించే నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שֹׁחַד
  choice: లంచంగా
  rationale: ఈ పదానికి సాధారణంగా ఉన్న అనుచిత ప్రయోజనం కోసం ఇచ్చే చెల్లింపు అనే ప్రతికూల భావాన్ని కాపాడుతుంది; తటస్థమైన ‘కానుక’గా మృదువుపరచదు.
theological_decisions:
- issue: యְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన టెట్రాగ్రామటన్ నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ‘Yahweh’ ఉచ్చారణకు దగ్గరగా తెలుగులో ‘యహ్వే’గా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘యహ్వే గృహం’ అనే కఠిన అక్షరానువాదానికి బదులు సాధారణ పాఠకుడికి స్పష్టమైన ‘యహ్వే మందిరం’, అలాగే ‘రాజు గృహపు ఖజానాలు’కు సహజమైన ‘రాజభవన ఖజానాలు’ వాడాం. వెండి, బంగారం కలిపి పంపిన చెల్లింపును సూచించేందుకు ‘వాటిని’ చేర్చాం.
