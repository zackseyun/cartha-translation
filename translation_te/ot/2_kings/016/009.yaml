  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ పునరుక్తి నిలుపబడింది; పట్టణం ద్వారా ప్రజలను సూచించే లక్షణార్థ ప్రయోగం ప్రధాన వచనంలో స్పష్టం చేసి, పాదసూచికలో మూలరూపం తెలిపాం.
