  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజు అతని మాట విన్నాడు[a]. అష్షూరు రాజు దమస్కుకు వ్యతిరేకంగా దండెత్తి, దాన్ని స్వాధీనం చేసుకొని, దాని ప్రజలను కీరుకు బందీలుగా తరలించి[b], రెజీనును చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని మాటను ఆలకించాడు.’ హీబ్రూ క్రియ వినడమే కాక, దానికి అనుగుణంగా స్పందించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘దాన్ని కీరుకు చెరగా తరలించాడు’; ఇక్కడ పట్టణం దాని ప్రజలకు ప్రతినిధిగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: అతని మాట విన్నాడు
  rationale: שׁמע אֶל ఇక్కడ కేవలం వినడమే కాక, ఆ విజ్ఞప్తికి అనుకూలంగా స్పందించడాన్ని సూచిస్తుంది. ‘అతని మాట విన్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, స్పందనను తరువాతి చర్యలు వివరించేలా ఉంచుతుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: ఇది సరళమైన సమాస నిర్మాణం. హీబ్రూ వచనంలోని పునరుక్తిని, కథన ఉద్ఘాటనను నిలుపుటకు రెండుసార్లూ పూర్తి పదబంధాన్ని వాడాం.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: దమస్కుకు వ్యతిరేకంగా దండెత్తి
  rationale: సైనిక కథనంలో עלה ... אֶל ఒక పట్టణంపై దాడికి కదలడాన్ని సూచిస్తుంది. తరువాత వచ్చే పట్టుకోవడం, చెరగా తరలించడం, చంపించడం అనే చర్యల సందర్భంలో ‘వ్యతిరేకంగా దండెత్తి’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: దాన్ని పట్టుకొని
  rationale: תפשׂ ఇక్కడ పట్టణాన్ని స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది. ‘దాన్ని పట్టుకొని’ మూలంలోని సర్వనామ సంబంధాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: దాని ప్రజలను కీరు పట్టణానికి చెరగా తరలించి
  rationale: హీబ్రూలో కర్మ ప్రత్యయం వ్యాకరణపరంగా దమస్కును సూచించినా, బహిష్కరించబడేది దాని జనాభా. తెలుగులో సహజత కోసం అంతర్లీనమైన ప్రజలను స్పష్టం చేసి, బలవంతపు చెర భావాన్ని ‘చెరగా తరలించి’ ద్వారా తెలిపాం. קִירָה లోని దిశార్థక ప్రత్యయం ‘కీరు పట్టణానికి’గా ప్రతిఫలించింది.
- source_word: קִירָה
  choice: కీరు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וְאֶת רְצִין הֵמִית
  choice: రెజీనును చంపించాడు
  rationale: המית అంటే ‘చనిపోయేలా చేయడం’; సందర్భంలో రాజు ఆజ్ఞ లేదా అధికారంతో మరణశిక్ష అమలు చేయించిన భావానికి ‘చంపించాడు’ సహజమైన తెలుగు రూపం.
