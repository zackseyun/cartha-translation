source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא הֵ֠שִׁיב רְצִ֨ין מֶֽלֶךְ אֲרָ֤ם אֶת אֵילַת֙ לַֽ/אֲרָ֔ם וַ/יְנַשֵּׁ֥ל אֶת הַ/יְהוּדִ֖ים מֵֽ/אֵיל֑וֹת ו/ארמים בָּ֣אוּ אֵילַ֔ת וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: te
  text: ఆ సమయంలో అరాము రాజు రెజీను ఏలతును తిరిగి అరాము అధీనంలోకి తెచ్చాడు. అతడు ఏలతు[b] నుండి యూదా ప్రజలను వెళ్లగొట్టాడు. అరామీయులు[a] ఏలతుకు వచ్చి, ఈ దినం వరకు అక్కడ నివసిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో “అరామీయులు” అని ఉంది. కొన్ని ప్రాచీన సాక్ష్యాలు, అలాగే 2 దినవృత్తాంతాలు 28:17లోని సమాంతర సందర్భం ఆధారంగా కొందరు “ఎదోమీయులు” అనే పఠనాన్ని సమర్థిస్తారు.
    reason: textual_variant
  - marker: b
    text: ఈ వచనంలో ఈ స్థలపేరు హీబ్రూలో మరో రూపంలో “ఏలోతు” అని కూడా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: తిరిగి ... అధీనంలోకి తెచ్చాడు
  rationale: హిఫిల్ రూపం ఏలతును మళ్లీ ఒకరి నియంత్రణలోకి తీసుకురావడాన్ని సూచిస్తుంది; రాజకీయ-సైనిక సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵילַת / אֵילוֹת
  choice: ఏలతు
  rationale: ఒకే స్థలపేరుకు వచనంలో కనిపించే రెండు హీబ్రూ రూపాలను ప్రధాన పాఠ్యంలో సాధారణ తెలుగు లిప్యంతరీకరణతో ఏకరీతిగా ఇచ్చి, రూపభేదాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לַאֲרָם
  choice: అరాము అధీనంలోకి
  rationale: ఇక్కడ సంబంధం కేవలం దిశను కాకుండా ఏలతుపై అధికారం లేదా స్వాధీనం మారడాన్ని సూచిస్తుంది. మూలంలోని అరాము అనే పేరునే ఉంచాం.
- source_word: וַיְנַשֵּׁל
  choice: వెళ్లగొట్టాడు
  rationale: స్థలంపై స్వాధీనాన్ని కోల్పోయేలా అక్కడి ప్రజలను తొలగించడమనే క్రియ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַיְהוּדִים
  choice: యూదా ప్రజలు
  rationale: రాజుల కాలపు సందర్భంలో ఇది యూదా రాజ్యానికి చెందిన ప్రజలను సూచిస్తుంది; తరువాతి కాలపు మత-జాతి భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ו/ארמים
  choice: అరామీయులు
  rationale: మసొరా వ్యంజన పాఠం అరామీయులు అని చదువుతుంది. చారిత్రక సందర్భానికి సరిపోతుందని భావించే ఎదోమీయులు అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకు అక్కడ నివసిస్తున్నారు
  rationale: కథనంలోని సంఘటననుంచి రచయిత కాలం వరకు కొనసాగిన నివాసాన్ని ప్రస్తుతకాల తెలుగు సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని జాతిపేరు సంబంధిత పాఠభేదం
  choice: అరామీయులు ఏలతుకు వచ్చారు
  alternative: ఎదోమీయులు ఏలతుకు వచ్చారు
  rationale: WLC/మసొరా పాఠం అరామీయులు అని ఉంది కాబట్టి ప్రధాన పాఠ్యం దానినే అనుసరిస్తుంది. అయితే ప్రాచీన సాక్ష్యాలు, సందర్భం, 2 దినవృత్తాంతాలు 28:17 కారణంగా ఎదోమీయులు అనే పఠనం గమనించదగినది; దానిని మౌనంగా స్వీకరించకుండా పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. చారిత్రక రాజ్యపరమైన అర్థాన్ని కాపాడేందుకు “యూదా ప్రజలు,” అధికార మార్పును స్పష్టం చేయడానికి “అధీనంలోకి” వాడాం. మూలపాఠంలోని జాతిపేరు సమస్యను ప్రధాన పాఠ్యంలో పరిష్కరించినట్లు చూపకుండా పాదటిప్పణిలో నిలిపాం.
