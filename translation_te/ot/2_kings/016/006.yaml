- from: ఆ సమయంలో అరాము రాజైన రెజీను ఏలతును తిరిగి అరాము అధీనంలోకి తెచ్చాడు[a]. అతడు ఏలతు[b] నుండి యూదా ప్రజలను వెళ్లగొట్టాడు. అరామీయులు ఏలతుకు వచ్చి, నేటి వరకు అక్కడ నివసిస్తున్నారు.
  to: ఆ సమయంలో అరాము రాజు రెజీను ఏలతును తిరిగి అరాము అధీనంలోకి తెచ్చాడు. అతడు ఏలతు[b] నుండి యూదా ప్రజలను వెళ్లగొట్టాడు. అరామీయులు[a] ఏలతుకు వచ్చి, ఈ దినం వరకు అక్కడ నివసిస్తూ ఉన్నారు.
