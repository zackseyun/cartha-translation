id: 2KI.16.2
reference: 2 Kings 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: te
  text: ఆహాజు రాజైనప్పుడు ఇరవై సంవత్సరాల వయస్సు కలిగి ఉన్నాడు. అతడు యెరూషలేములో పదహారు సంవత్సరాలు రాజ్యమేలాడు. తన తండ్రియైన దావీదు చేసినట్లుగా[a] అతడు తన దేవుడైన యాహ్వే దృష్టిలో సరైనది చేయలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “తండ్రి” అంటే ఆహాజుకు జన్మనిచ్చిన తండ్రి అని కాదు; రాజవంశ పూర్వికుడైన దావీదు అని అర్థం.
    reason: cultural_note
  - marker: b
    text: లేదా, “తన దేవుడైన యాహ్వే దృష్టిలో యథార్థమైనది చేయలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: అతనికి ఇరవై సంవత్సరాలు
  rationale: ఇది వయస్సును తెలిపే ప్రామాణిక హీబ్రూ నుడికారం. ఆధునిక తెలుగులో సహజంగా వయస్సును వ్యక్తపరుస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఆహాజు రాజ్యాధికారం చేపట్టిన సమయాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలన సాగించాడనే క్రియాత్మక భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పాలన జరిగిన కేంద్రాన్ని సూచించే స్థానార్థక ప్రయోగం.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: సరైనది చేయలేదు
  rationale: రాజుల గ్రంథంలోని నైతిక మూల్యాంకన సూత్రాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: హీబ్రూ ‘కళ్లలో’ అనే నుడికారానికి తెలుగులో సహజమైన సమానార్థక రూపం; ఎవరి ప్రమాణంలో అనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: ఆహాజుతో సంబంధాన్ని సూచించే ఏకవచన ప్రత్యయ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כְּדָוִד אָבִיו
  choice: తన తండ్రి దావీదు చేసినట్లుగా
  rationale: హీబ్రూ ‘తండ్రి’ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ముందున్న ‘చేయడం’ అనే క్రియను పోలికలో సహజంగా పూరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: ‘తన తండ్రి దావీదు’ అనే మాట యొక్క అర్థం
  choice: మూలంలోని ‘తండ్రి’ భాషను నిలుపడం; గమనికలో వంశపూర్వికుడనే భావాన్ని వివరించడం
  alternative: తన పూర్వికుడైన దావీదు
  rationale: రాజవంశ సందర్భంలో אָבִיו సమీప జనకుడిని కాక వంశపూర్వికుడిని సూచిస్తుంది. అయినా మూలరూపంలోని కుటుంబ-వంశ భాషను తొలగించకుండా ప్రధాన పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవంశ నివేదికకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. ‘దృష్టిలో’ అనే సహజ తెలుగు నుడికారంతో హీబ్రూ మూలంలోని మూల్యాంకన దృక్కోణం నిలుపబడింది.
