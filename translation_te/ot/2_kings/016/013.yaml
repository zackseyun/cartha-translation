source:
  edition: WLC
  text: וַ/יַּקְטֵ֤ר אֶת עֹֽלָת/וֹ֙ וְ/אֶת מִנְחָת֔/וֹ וַ/יַּסֵּ֖ךְ אֶת נִסְכּ֑/וֹ וַ/יִּזְרֹ֛ק אֶת דַּֽם הַ/שְּׁלָמִ֥ים אֲשֶׁר ל֖/וֹ עַל הַ/מִּזְבֵּֽחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: te
  text: అతడు తన దహనబలినీ, తన ధాన్యార్పణనూ దహించి, తన పానార్పణను పోశాడు. తనకు చెందిన సమాధాన బలుల[a] రక్తాన్ని బలిపీఠంపై చల్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు.’ హీబ్రూ పదం (שְׁלָמִים) ఒక ప్రత్యేక బలి వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: బలిపీఠం మీద దహించి
  rationale: హిఫిల్ రూపంలోని קטר బలిని బలిపీఠం మీద పొగగా పైకి లేచేలా కాల్చడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘దహించి’ అని, ఆచార సందర్భాన్ని స్పష్టం చేసేందుకు ‘బలిపీఠం మీద’ అని ఇచ్చాం.
- source_word: עֹלָתוֹ
  choice: తన దహనబలిని
  rationale: עֹלָהకు స్థిరమైన బలి సంబంధ అర్థం ‘దహనబలి’; అంతా దహించే బలి అనే భావాన్ని ఈ ప్రామాణిక పదం సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִנְחָתוֹ
  choice: ధాన్యార్పణను
  rationale: బలి ఆచార సందర్భంలో מִנְחָה సాధారణ కానుకకంటే ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: וַיַּסֵּךְ
  choice: కుమ్మరించాడు
  rationale: נסך ఇక్కడ పానార్పణను పోసే ఆచార చర్యను సూచిస్తుంది; ‘కుమ్మరించాడు’ ఆధునిక తెలుగులో సహజంగా ఆ చర్యను వ్యక్తం చేస్తుంది.
- source_word: נִסְכּוֹ
  choice: తన పానార్పణను
  rationale: נֶסֶךְ బలితో కూడిన ద్రవార్పణ; ‘పానార్పణ’ సంక్షిప్తమైన, అర్థవంతమైన బలి సంబంధ పదం.
- source_word: וַיִּזְרֹק
  choice: చిలకరించాడు
  rationale: זרק బలి రక్తాన్ని బలిపీఠంపై లేదా దాని వైపు విసిరి చల్లే చర్యను సూచిస్తుంది. తెలుగులో ‘చిలకరించాడు’ ఆచార చర్యను సహజంగా తెలియజేస్తుంది; సున్నితంగా చల్లడమేనని తప్పనిసరిగా నిర్ధారించదు.
- source_word: דַּם הַשְּׁלָמִים
  choice: సమాధాన బలుల రక్తాన్ని
  rationale: שְׁלָמִים ఒక ప్రత్యేక బలి వర్గం. ‘సమాధాన బలులు’ సంప్రదాయంగా గుర్తించదగిన అనువాదం; ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר לוֹ
  choice: తనకు చెందిన
  rationale: ఈ పదబంధం ఆ సమాధాన బలులు అతనివని సహజంగా సూచిస్తుంది; ‘తనకు చెందిన’ స్వామ్య భావాన్ని అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: זרקతో కూడిన עַל రక్తాన్ని బలిపీఠంపై లేదా దానికి తగిలేలా చల్లడాన్ని సూచించగలదు. తెలుగు వాక్యంలో ‘మీద’ సహజంగా ఉండి మూలంలోని పరిధిని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: שְׁלָמִים అనే బలి వర్గం యొక్క భావవ్యాప్తి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: మూలపదం శాంతి, సంపూర్ణత, క్షేమం లేదా సహవాసంతో అనుసంధానించబడే ప్రత్యేక బలి వర్గాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో గుర్తించదగిన ‘సమాధాన బలులు’ ఉంచి, భావాన్ని ఒక్క సిద్ధాంతపరమైన వివరణకే పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బలి ఆచారానికి తగిన గంభీరతతో అనువదించాం. క్రియల వరుసను సహజ తెలుగు వాక్యాలుగా విభజించాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
