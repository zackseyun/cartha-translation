id: 2KI.16.16
reference: 2 Kings 16:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אוּרִיָּ֣ה הַ/כֹּהֵ֑ן כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֥לֶךְ אָחָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: te
  text: యాజకుడైన ఊరియా, రాజు ఆహాజు ఆజ్ఞాపించినదంతా చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు ‘చేయు/నిర్మించు’ అనే విస్తృత అర్థాలున్నాయి. ఇక్కడ ఆజ్ఞకు అనుగుణంగా ప్రవర్తించడాన్ని సూచిస్తున్నందున ‘చేశాడు’ సహజంగా, సందర్భానుకూలంగా ఉంది.
- source_word: אוּרִיָּה
  choice: ఊరియా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఊరియా పదవిని సూచించే నిర్దిష్ట నామవాచకం. తెలుగులో వ్యక్తినామంతో సహజంగా అనుసంధానించడానికి ‘యాజకుడైన’ అని ఇచ్చాం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా అలాగే
  rationale: రాజు ఆజ్ఞాపించిన ప్రతిదానికీ సంపూర్ణంగా అనుగుణంగా చేశాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה అంటే అధికారంతో ఆజ్ఞాపించడం. హీబ్రూలోని క్రియాబలాన్ని ‘ఆజ్ఞాపించిన’ స్పష్టంగా నిలుపుతుంది; ఊరియా చర్యకు ముందు ఆజ్ఞ ఇవ్వబడిందనే కాలక్రమం తెలుగు సంబంధక్రియలో సహజంగా వ్యక్తమవుతుంది.
- source_word: הַמֶּלֶךְ אָחָז
  choice: రాజైన ఆహాజు
  rationale: హీబ్రూలోని బిరుదు-పేరు సంబంధాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతూ, పేరును మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ఊరియా విధేయతపై కథనపు నైతిక మూల్యాంకనం
  choice: ఈ వాక్యాన్ని అదనపు నైతిక వ్యాఖ్య లేకుండా వర్ణనాత్మకంగా అనువదించడం.
  alternative: ఊరియా చర్యను సమర్థించినట్లు లేదా ఖండించినట్లు సూచించే పదాలను చేర్చడం.
  rationale: హీబ్రూ పాఠం ఊరియా ఆహాజు ఆజ్ఞకు పూర్తిగా అనుగుణంగా చేశాడని మాత్రమే నివేదిస్తుంది. విస్తృత సందర్భం ప్రతికూల మూల్యాంకనానికి దారితీయవచ్చుగాని, ఈ వచనం దానిని ప్రత్యక్షంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను, నైతిక వ్యాఖ్యాన రాహిత్యాన్ని నిలిపాం.
