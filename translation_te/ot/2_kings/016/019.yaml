source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָחָ֖ז אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: ఆహాజు చేసిన మిగిలిన కార్యాలు యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[a] వ్రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదా రాజుల వార్షిక వృత్తాంతాల గ్రంథంలో.”
    reason: דִּבְרֵי הַיָּמִים అనేది కాలక్రమంగా లేదా వార్షికంగా నమోదు చేసిన చారిత్రక వృత్తాంతాలను సూచించగలదు; ఇది ఆంగ్ల “Annals” ప్రత్యామ్నాయానికి సహజమైన తెలుగు సమానార్థకం.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: మిగిలిన కార్యాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; రాజుల పాలనను సంగ్రహించే ఈ సూత్రబద్ధ వాక్యంలో דִּבְרֵי అనేది మాటలకన్నా రాజు చేసిన కార్యాలు లేదా పాలనా విషయాలను సూచిస్తుంది.
- source_word: אָחָז
  choice: ఆహాజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: సహజమైన తెలుగు వాక్యనిర్మాణంలో సంబంధవాచక ఉపవాక్యాన్ని విశేషణ రూపంలో ఉంచి, ‘అతడు చేసిన’ అనే మూలార్థాన్ని నిలిపాం.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను తెలుగులో సహజంగా, ప్రశ్న స్వరూపాన్ని కాపాడుతూ అనువదించాం.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినా, ఒక లిఖిత ఆధారాన్ని సూచించేటప్పుడు తెలుగులో ‘గ్రంథంలో’ సహజం.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: דִּבְרֵי הַיָּמִים అనే చారిత్రక దస్తావేజు పేరును ‘దినవృత్తాంతాలు’గా ఇచ్చి, לְמַלְכֵי יְהוּדָהను ఆ గ్రంథం యూదా రాజులకు సంబంధించినదని తెలిపే విధంగా అనువదించాం.
