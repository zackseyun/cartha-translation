translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా ‘కదా?’తో నిలిపాం; మూలంలోని ప్రారంభ וְను తెలుగులో అనవసరమైన ‘మరియు’గా మలచకుండా సందర్భసహజంగా వదిలాం.
