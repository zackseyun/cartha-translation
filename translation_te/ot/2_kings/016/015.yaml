  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: te
  text: 'అప్పుడు రాజైన ఆహాజు యాజకుడైన ఊరియాకు ఇలా ఆజ్ఞాపించాడు: “పెద్ద బలిపీఠం మీద ఉదయపు దహనబలిని, సాయంకాలపు ధాన్యార్పణను, రాజు దహనబలిని, అతని ధాన్యార్పణను, దేశ ప్రజలందరి దహనబలిని, వారి ధాన్యార్పణలను, పానార్పణలను అర్పించు. దహనబలుల రక్తమంతటినీ, బలుల రక్తమంతటినీ దానిమీద వేయి. అయితే కంచు బలిపీఠం మాత్రం నా విచారణ కోసం ఉండాలి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను పరిశీలించడానికి,” “నేను ఆలోచించి నిర్ణయించడానికి,” లేదా బహుశా “నేను దాని ద్వారా మార్గదర్శనం కోరడానికి.” ఇక్కడి హెబ్రీ పదబంధం కష్టమైనది; ఆహాజు కంచు బలిపీఠానికి ఏ ఖచ్చితమైన కార్యాన్ని ఉద్దేశించాడో అనిశ్చితం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ
  choice: ఆజ్ఞాపించాడు
  rationale: రాజు ఇచ్చిన అధికారపూర్వక ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: యాజకుడైన ఊరియా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని పదవిని సహజమైన తెలుగు సంబంధ నిర్మాణంలో ఉంచుతుంది.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: పెద్ద బలిపీఠం మీద
  rationale: కొత్త బలిపీఠాన్ని కంచు బలిపీఠం నుండి వేరు చేసే విశేషణాన్ని, స్థలసూచక పూర్వప్రత్యయాన్ని నిలుపుతుంది.
- source_word: הַקְטֵר
  choice: అర్పించు
  rationale: హిఫిల్ రూపం బలిని బలిపీఠంపై పొగగా పైకెళ్లేలా చేసే ఆచారక్రియను సూచిస్తుంది; తెలుగులో ‘అర్పించు’ బలిసందర్భానికి సహజంగా ఉంటుంది.
- source_word: עֹלַת הַבֹּקֶר
  choice: ఉదయపు దహనబలి
  rationale: עֹלָה అనే పూర్తిగా దహనం చేసే బలి రకాన్ని సంక్షిప్తంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: מִנְחַת הָעֶרֶב
  choice: సాయంకాలపు ధాన్యార్పణ
  rationale: బలిసందర్భంలోని מִנְחָהను సాధారణ ‘అర్పణ’గా కాక ధాన్యార్పణగా స్పష్టం చేస్తుంది.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరి దహనబలి
  rationale: עַם הָאָרֶץను ప్రత్యేక సామాజిక వర్గంగా నిర్దిష్టం చేయకుండా, సందర్భానుసారంగా దేశ ప్రజల సమూహంగా ఉంచుతుంది.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: వారి ధాన్యార్పణలను, పానార్పణలను
  rationale: బహువచన ప్రత్యయాల పంపిణీ భావాన్ని తెలుగులో బహువచనంతో ప్రతిబింబిస్తుంది.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: దహనబలుల రక్తమంతటినీ, ఇతర బలుల రక్తమంతటినీ
  rationale: עֹלָה మరియు זֶבַח మధ్య తేడాను నిలుపుతూ, రెండవ పదం ఇక్కడ దహనబలికి భిన్నమైన బలులను సూచిస్తుందని సహజంగా తెలియజేస్తుంది.
- source_word: עָלָיו תִּזְרֹק
  choice: దాని మీద చిలకరించు
  rationale: బలి రక్తాన్ని బలిపీఠంపై వేయడం లేదా చల్లడం అనే ఆచారక్రియను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘దాని’ కొత్త పెద్ద బలిపీఠాన్ని సూచిస్తుంది.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: נְחֹשֶׁתకు సందర్భోచితమైన సాంప్రదాయ తెలుగు లోహపదాన్ని ఉపయోగిస్తుంది.
- source_word: לְבַקֵּר
  choice: విచారణ చేయడానికి
  rationale: మూలంలోని కష్టమైన, బహుఅర్థక క్రియకు పరిశీలన లేదా మార్గదర్శనం కోరడం రెండింటికీ కొంత చోటు ఉంచే తెలుగు పదబంధం.
theological_decisions:
- issue: కంచు బలిపీఠానికి సంబంధించిన לְבַקֵּר యొక్క అర్థం
  choice: నేను విచారణ చేయడానికి
  alternative: నేను పరిశీలించడానికి; నేను మార్గదర్శనం కోరడానికి
  rationale: ఈ హెబ్రీ పదబంధం ఖచ్చితంగా ఏ కార్యాన్ని సూచిస్తుందో అనిశ్చితం. ‘విచారణ చేయడానికి’ అనేది ఆహాజు దానిని తన ప్రత్యేక వినియోగానికి ఉంచాడనే భావాన్ని తెలుపుతుంది; అయితే నిర్దిష్టమైన శకునవిచారణ పద్ధతిని మూలంలో లేనంతగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలిసంబంధ సాంకేతిక పదాలకు స్థిరమైన రూపాలు వాడబడ్డాయి. చివరి క్లాజులోని మూలభాషా అనిశ్చితిని ప్రధాన పాఠ్యంలో పూర్తిగా పరిష్కరించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయ అర్థాలతో నిలుపబడింది.
