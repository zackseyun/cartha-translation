  text: וַ/יִּ֛בֶן אוּרִיָּ֥ה הַ/כֹּהֵ֖ן אֶת הַ/מִּזְבֵּ֑חַ כְּ/כֹ֣ל אֲשֶׁר שָׁלַח֩ הַ/מֶּ֨לֶךְ אָחָ֜ז מִ/דַּמֶּ֗שֶׂק כֵּ֤ן עָשָׂה֙ אוּרִיָּ֣ה הַ/כֹּהֵ֔ן עַד בּ֥וֹא הַ/מֶּֽלֶךְ אָחָ֖ז מִ/דַּמָּֽשֶׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: te
  text: యాజకుడైన ఊరియా ఆ బలిపీఠాన్ని రాజు ఆహాజు దమస్కు నుండి పంపినదంతటికీ అనుగుణంగా నిర్మించాడు. రాజు ఆహాజు దమస్కు నుండి వచ్చే వరకు యాజకుడైన ఊరియా అలాగే చేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఆహాజు పంపినదంతటికీ సరిగ్గా అనుగుణంగా చేశాడు.
    reason: ‘అలాగే చేశాడు’ అనే హెబ్రీ వ్యక్తీకరణ ఊరియా రాజు పంపిన వివరాలను ఖచ్చితంగా అనుసరించాడని నొక్కి చెబుతుంది.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: నిర్మించాడు
  rationale: בנה అనే సాధారణ నిర్మాణ క్రియను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: యాజకుడైన ఊరియా
  rationale: పేరుతో కూడిన హోదాను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, మూలంలో రెండుసార్లు వచ్చిన పదబంధాన్ని రెండుసార్లూ నిలుపుతుంది.
- source_word: הַמִּזְבֵּחַ
  choice: ఆ బలిపీఠాన్ని
  rationale: מזבחకు సాధారణ తెలుగు సమానార్థకం ‘బలిపీఠం’; నిర్దిష్టతను ‘ఆ’ ద్వారా సూచించింది.
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  choice: పంపినదంతా ఎలా ఉందో
  rationale: పంపబడిన నమూనా లేదా సూచనలను మూలం స్పష్టంగా పేరుపెట్టదు; అందువల్ల ఆ కర్మను నిర్దిష్టం చేయకుండా, సంపూర్ణ అనుగుణత భావాన్ని సహజ తెలుగులో నిలిపింది.
- source_word: כֵּן עָשָׂה
  choice: అలాగే చేశాడు
  rationale: రాజు పంపిన దానికి ఊరియా అనుగుణంగా వ్యవహరించాడనే హెబ్రీ నొక్కింపును సరళంగా నిలుపుతుంది.
- source_word: עַד בּוֹא
  choice: వచ్చే వరకు
  rationale: עַד + infinitive construct సూచించే కాలపరిమితి ముగింపు భావాన్ని నేరుగా నిలుపుతుంది; ‘వచ్చేలోగా’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో ఎంచుకోలేదు.
- source_word: מִדַּמֶּשֶׂק
  choice: దమస్కు నుండి
  rationale: מִן సూచించే మూలస్థాన భావాన్ని రెండు సందర్భాల్లోనూ నేరుగా వ్యక్తపరుస్తుంది.
