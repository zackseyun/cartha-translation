translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలో పంపబడినది నమూనానా, వివరాలా, సూచనలా అన్నది స్పష్టంగా లేనందున ప్రధాన పాఠ్యంలో ‘పంపినదంతా’ అని ఉంచి ఆ అస్పష్టతను కాపాడింది.
