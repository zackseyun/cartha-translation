  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు రాజుల మార్గంలో నడిచాడు; అంతేకాక, యహ్వే ఇశ్రాయేలు కుమారుల ఎదుటనుండి వెళ్లగొట్టిన జనాంగాల హేయమైన ఆచారాల ప్రకారం, తన కుమారుణ్ణి అగ్ని గుండా దాటేలా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుమారుణ్ణి అగ్నిలో అర్పించాడు.” హీబ్రూ మూలంలో అక్షరార్థంగా “తన కుమారుణ్ణి అగ్ని గుండా దాటేలా చేశాడు” అని ఉంది; ఇది ఖండించబడిన ఒక అన్యమత ఆచారానికి సంబంధించిన నుడికారం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలో నడిచాడు
  rationale: ప్రవర్తన లేదా జీవన విధానాన్ని సూచించే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులు
  rationale: ఉత్తర రాజ్యపు పాలకులను సూచించే సరళమైన సంబంధ నిర్మాణం.
- source_word: וְגַם
  choice: అంతేకాక
  rationale: సాధారణ సముచ్చయాన్ని మించి, తరువాతి దుష్కార్యాన్ని తీవ్రత పెరిగిన అంశంగా చూపుతుంది.
- source_word: אֶת־בְּנוֹ
  choice: తన కుమారుణ్ణి
  rationale: ఏకవచన ప్రత్యక్ష కర్మను ఖచ్చితంగా నిలుపుతుంది.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: అగ్నిలో దాటించాడు
  rationale: ఈ నిందిత అన్యమత ఆచారానికి సంబంధించిన హీబ్రూ నుడికారాన్ని నిలుపుతూ, ఆ క్రియలోని ప్రతి ఆచార వివరాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్ధారించదు.
- source_word: כְּתֹעֲבוֹת
  choice: హేయాచారాలను అనుసరించి
  rationale: ఆ జనాల అసహ్యకరమైన మతాచారాలకు అనుగుణంగా అతడు ప్రవర్తించాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఈ సందర్భంలో దేశంలోని ఇశ్రాయేలేతర ప్రజలను తటస్థంగా సూచిస్తుంది.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: వెళ్లగొట్టిన
  rationale: ఆ ప్రజలను దేశం నుండి తొలగించడం లేదా స్వాధీన హక్కు కోల్పోయేలా చేయడం అనే సందర్భార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ఎదుటనుండి
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే నిబంధనాత్మక జాతినామాన్ని, వారి ఎదుటనుండి జనాలు వెళ్లగొట్టబడ్డారనే సంబంధంతో నిలుపుతుంది.
theological_decisions:
- issue: הֶעֱבִיר בָּאֵשׁ అనే మాటను స్పష్టమైన బాలబలిగా అనువదించాలా, లేక హీబ్రూ నుడికారాన్ని నిలుపాలా
  choice: ప్రధాన పాఠ్యంలో ‘తన కుమారుణ్ణి అగ్నిలో దాటించాడు’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘తన కుమారుణ్ణి అగ్నిలో అర్పించాడు’ లేదా ‘అగ్నిలో కాల్చాడు’
  rationale: వాక్యం ఒక నిందిత అన్యమత ఆచారాన్ని స్పష్టంగా సూచించినా, ఆ ఆచారంలోని అన్ని వివరాలను ఈ హీబ్రూ పదబంధం ఒక్కటే నిర్దిష్టంగా తెలియజేయదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది; మరింత స్పష్టమైన అర్థసంభావ్యతను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలి ఉపయోగించబడింది. హీబ్రూ ప్రవర్తనా రూపకం మరియు అగ్ని ఆచారానికి సంబంధించిన ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
