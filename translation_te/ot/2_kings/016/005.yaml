source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: te
  text: అప్పుడు అరాము రాజు రెసీను, రెమల్యా కుమారుడు, ఇశ్రాయేలు రాజైన పెకహు యుద్ధం కోసం యెరూషలేముకు వచ్చారు. వారు ఆహాజును ముట్టడించారు; కానీ అతనిపై పోరాడలేకపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిపై పోరాడలేకపోయారు”; ఇక్కడ “దాని” యెరూషలేమును సూచించవచ్చు. “పోరాడడం” తరువాత హీబ్రూ పాఠం కర్మను మళ్లీ చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన తెలుగు కాలసూచకం.
- source_word: יַעֲלֶה
  choice: మీదికి వచ్చారు
  rationale: యెరూషలేము వైపు జరిగిన సైనిక గమనాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పైకి వెళ్లడం’ అనే మూలభావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: అరాము రాజు రెసీను
  rationale: אֲרָםను ‘సిరియా’గా కాక మూలంలోని జాతి-భౌగోళిక నామానికి దగ్గరగా ‘అరాము’గా ఉంచింది.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: రెమల్యా కుమారుడైన ఇశ్రాయేలు రాజు పెకహు
  rationale: తండ్రి పేరు, రాజబిరుదు రెండింటినీ స్పష్టమైన ఆధునిక తెలుగు అన్వయంలో నిలుపుతుంది.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి యెరూషలేము మీదికి
  rationale: గమ్యస్థానాన్నీ సైనిక ఉద్దేశాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: వారు ఆహాజును ముట్టడించారు
  rationale: צור అనే సైనిక పదానికి ‘ముట్టడించు’ ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానార్థకం; עַל‌తో వచ్చిన ఆహాజును ప్రత్యక్ష కర్మగా సహజంగా పలికించింది.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: కానీ అతనిపై పోరాడలేకపోయారు
  rationale: వారి అసమర్థతను తెలిపే మూలవాక్యాన్ని అనుసరిస్తూ, ముందున్న ఆహాజును సాధ్యమైన సూచ్యార్థంగా తీసుకుంది; హీబ్రూలో పోరాటానికి సంబంధించిన కర్మ మళ్లీ చెప్పబడనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: לְהִלָּחֵם తరువాత స్పష్టమైన కర్మ లేకపోవడం
  choice: ప్రధాన పాఠంలో ‘అతనిపై పోరాడలేకపోయారు’
  alternative: ‘దానిపై పోరాడలేకపోయారు,’ అంటే యెరూషలేముపై
  rationale: సమీపంలో వ్యక్తిగా ఆహాజు ప్రస్తావించబడినందున అతనిని సూచ్యార్థంగా తీసుకోవచ్చు; అయినా ముట్టడి సందర్భంలో పట్టణాన్ని సూచించే అవకాశం కూడా ఉంది. మూలంలోని అనిశ్చితిని పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. పేర్లకు విస్తృత తెలుగు బైబిలు వాడుకకు అనుగుణమైన రూపాలు ఎంచుకున్నాం; మూలంలోని సంక్షిప్త సైనిక భాషను అనవసర వివరణ లేకుండా నిలిపాం.
