source:
  edition: WLC
  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: te
  text: యాహ్వే ఎదుట ఉన్న కంచు బలిపీఠాన్ని[a] అతడు మందిరం ముందునుండి, బలిపీఠానికీ యాహ్వే మందిరానికీ మధ్యనుండి తరలించి, బలిపీఠానికి ఉత్తరాన ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాగి బలిపీఠాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: נְחֹשֶׁת రాగి లేదా కంచును సూచించవచ్చు. ఆలయ సామగ్రి సందర్భంలో సంప్రదాయబద్ధంగా, సహజంగా ఉండే ‘కంచు’ను ప్రధాన పాఠంలో ఉంచి, ‘రాగి’ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో ఉన్న
  rationale: לִפְנֵי అనే పదబంధంలో ఉన్న స్థలార్థమైన ‘ఎదుట/ముందు’ భావాన్ని, ఆరాధనా సందర్భంలోని సమక్షత భావాన్ని సహజమైన తెలుగులో ‘సన్నిధిలో’ తెలియజేస్తుంది.
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: అతడు మందిరం ముందునుండి ... తీసి
  rationale: క్రియకు అక్షరార్థంగా ‘దగ్గరకు తెచ్చాడు’ అనే భావం ఉన్నా, ఇక్కడ బలిపీఠాన్ని ఒక స్థలం నుంచి మరొక స్థలానికి మార్చడమే సందర్భార్థం. ‘తీసి’ అనేది గమ్యస్థానాన్ని తరువాతి వాక్యభాగం తెలిపే తెలుగులో సహజంగా ఉంది.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: ఆ బలిపీఠానికీ యెహోవా మందిరానికీ మధ్యనుండి
  rationale: మూలంలోని పునరుక్త מִבֵּין సూచించే ఖచ్చితమైన స్థానాన్ని ‘మధ్యనుండి’ నిలుపుతుంది. ‘ఆ బలిపీఠం’ సందర్భంలో అహాజు కొత్తగా చేయించిన బలిపీఠాన్ని సూచిస్తుందని స్పష్టతనిస్తుంది.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: ఉంచాడు
  rationale: భౌతికంగా ఒక వస్తువును నిర్దిష్ట స్థానంలో పెట్టడాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: కొత్త బలిపీఠానికి ఉత్తరం వైపున
  rationale: יֶרֶךְ అంటే ‘పక్క/ప్రక్కభాగం’; צָפוֹנָה ఉత్తర దిశను సూచిస్తుంది. ‘ఉత్తరం వైపున’ స్థల సంబంధాన్ని సహజంగా తెలుపుతుంది. ఇక్కడి ‘బలిపీఠం’ ముందటి సందర్భంలోని కొత్త బలిపీఠమని ‘కొత్త’ ద్వారా స్పష్టం చేసి, దాన్ని పాదసూచికలో గుర్తించాం.
- source_word: הַבַּיִת / בֵּית יְהוָה
  choice: మందిరం / యెహోవా మందిరం
  rationale: అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుందనే విషయం స్పష్టం. ఆధునిక తెలుగు పాఠకునికి ‘మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని నిబంధన దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; హీబ్రూ ఉచ్చారణ పునర్నిర్మాణానికి దగ్గరైన ‘యాహ్వే’ ప్రత్యామ్నాయం.
- issue: రెండవ ‘బలిపీఠం’ దేనిని సూచిస్తుంది?
  choice: కొత్త బలిపీఠం
  alternative: బలిపీఠం
  rationale: ఈ వచన సందర్భంలో రాజు అహాజు కొత్తగా చేయించిన బలిపీఠమే స్థల నిర్దేశానికి ఆధారం. అయినా ‘కొత్త’ అనే విశేషణం హీబ్రూ వచనంలో ప్రత్యక్షంగా లేదని పాదసూచికలో తెలిపి మూలంలోని సంక్షిప్తతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని స్థల సంబంధాలను నిలుపుతూ, ‘అంటే’ ద్వారా మధ్యస్థానాన్ని స్పష్టం చేశాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు సరిపోలే పాదసూచిక ఇవ్వబడింది.
