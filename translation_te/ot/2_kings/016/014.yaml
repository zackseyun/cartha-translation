revisions:
- from: యెహోవా సన్నిధిలో ఉన్న కంచు బలిపీఠాన్ని[a] అతడు మందిరం ముందునుండి—అంటే, ఆ బలిపీఠానికీ యెహోవా మందిరానికీ మధ్యనుండి—తీసి, కొత్త బలిపీఠానికి ఉత్తరం వైపున ఉంచాడు.[b]
  to: యాహ్వే ఎదుట ఉన్న కంచు బలిపీఠాన్ని[a] అతడు మందిరం ముందునుండి, బలిపీఠానికీ యాహ్వే మందిరానికీ మధ్యనుండి తరలించి, బలిపీఠానికి ఉత్తరాన ఉంచాడు.
  rationale: The revision removes unsupported “కొత్త” and the interpretive connective “అంటే,” preserving the Hebrew’s ambiguity concerning the referent of the second ‘altar’ while allowing the surrounding context to inform readers. It uses “ఎదుట” for the explicitly spatial phrase לפני יהוה, retains the paired removal-location expressions, and renders the divine name consistently as “యాహ్వే.”
