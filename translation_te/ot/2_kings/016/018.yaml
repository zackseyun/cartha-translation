  to: మందిరంలో వారు నిర్మించిన విశ్రాంతిదినపు కప్పబడిన మార్గాన్ని[a], రాజు బయటి ప్రవేశద్వారాన్ని[b] అతడు యెహోవా మందిరం నుండి పక్కకు మార్చాడు[c]—అష్షూరు రాజు కారణంగా[d].
