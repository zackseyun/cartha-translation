  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: te
  text: మందిరంలో వారు నిర్మించిన విశ్రాంతిదినపు కప్పబడిన మార్గాన్ని[a], రాజు బయటి ప్రవేశద్వారాన్ని[b] అతడు యెహోవా మందిరం నుండి పక్కకు మార్చాడు[c]—అష్షూరు రాజు కారణంగా[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విశ్రాంతిదినపు కప్పబడిన నిర్మాణం,’ ‘విశ్రాంతిదినపు పందిరి,’ లేదా ‘విశ్రాంతిదినపు మంటపం.’ ఈ హీబ్రూ పదం సూచించే నిర్మాణం ఖచ్చితంగా ఏమిటో తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాజు బయటి ప్రవేశద్వారం’ లేదా ‘రాజుకోసం ఉన్న బయటి ప్రవేశమార్గం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మార్చాడు,’ ‘పక్కకు మళ్లించాడు,’ ‘స్థానం మార్చాడు,’ లేదా ‘తొలగించాడు.’ హీబ్రూ క్రియ ఏదైనా పూర్తిగా తొలగించడమే కాకుండా దాన్ని పక్కకు తిప్పడం లేదా దాని స్థానాన్ని మార్చడం అని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘అష్షూరు రాజు నిమిత్తం’; బహుశా ‘అష్షూరు రాజుకు భయపడి.’
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: విశ్రాంతిదినపు కప్పబడిన మార్గం
  rationale: מיסך అరుదైన నిర్మాణ సంబంధ పదం. అది కప్పబడిన నిర్మాణం లేదా మార్గాన్ని సూచించే అవకాశం ఉంది; ఖచ్చితమైన నిర్మాణ రూపం తెలియనందున ప్రధాన పాఠంలో సహజమైన సాధారణ పదబంధాన్ని వాడి, ఇతర అవకాశాలను పాదటీపులో ఉంచాం.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: మందిరంలో వారు నిర్మించిన
  rationale: בָּנוּ లోని నిర్దిష్టంగా చెప్పని బహువచన కర్తను ‘వారు’గా నిలిపి, సందర్భంలో הַבַּיִת యెహోవా మందిరాన్ని సూచిస్తున్నందున తెలుగులో ‘మందిరం’ అని స్పష్టం చేశాం.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: రాజు ఉపయోగించే బయటి ప్రవేశద్వారం
  rationale: מְבוֹא అంటే ప్రవేశం లేదా ప్రవేశద్వారం. సంబంధార్థక హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరచడానికి ‘రాజు ఉపయోగించే’ అని ఇచ్చాం; అది రాజుకు సంబంధించిన బయటి ప్రవేశమనే భావాన్ని మాత్రమే తెలియజేస్తుంది.
- source_word: הֵסֵב
  choice: మళ్లించాడు
  rationale: סבב హిఫీల్ రూపం తిప్పడం, దారి మళ్లించడం, స్థానాన్ని మార్చడం లేదా తొలగించడం అనే పరిధిని కలిగి ఉంది. ‘మళ్లించాడు’ మూలంలోని విస్తృత భావాన్ని నిలిపి, పూర్తిగా తొలగించాడని నిర్బంధంగా చెప్పదు.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: సందర్భంలో ‘యెహోవా ఇల్లు’ అంటే దేవాలయం. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ‘మందిరం’ అని అనువదించి, దైవనామాన్ని ‘యెహోవా’గా నిలిపాం.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు కారణంగా
  rationale: מִפְּנֵי ఇక్కడ కారణం లేదా ఒత్తిడిని సూచించవచ్చు. ‘కారణంగా’ అనేది భయమే ఉద్దేశమని నిర్ణయించకుండా విస్తృతమైన మూలభావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
theological_decisions:
- issue: అష్షూరు రాజు పట్ల ఆహాజు ఉద్దేశం లేదా ప్రేరణ
  choice: అష్షూరు రాజు కారణంగా
  alternative: అష్షూరు రాజుకు భయపడి
  rationale: מִפְּנֵי కారణం, ఒత్తిడి, లేదా భయం అనే ఛాయలను కలిగి ఉండవచ్చు. పాఠం స్పష్టంగా చెప్పనిదాన్ని ప్రధాన అనువాదంలో నిర్ధారించకుండా, భయాన్ని ఒక సాధ్యమైన భావంగా పాదటీపులో ఉంచాం.
- issue: మందిర నిర్మాణాల్లో చేసిన మార్పు స్వరూపం
  choice: మళ్లించాడు
  alternative: మార్చాడు; స్థానం మార్చాడు; తొలగించాడు
  rationale: הֵסֵב పూర్తిగా తొలగించడాన్నే తప్పనిసరిగా సూచించదు. అందువల్ల నిర్మాణ మార్పు ఎలా జరిగిందో అతిగా నిర్దిష్టీకరించకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. అరుదైన నిర్మాణ పదానికి అతిగా సాంకేతికమైన రూపం ఇవ్వలేదు; హీబ్రూ వాక్యంలోని రెండు కర్మలను, నిర్దిష్టం కాని ‘వారు’ అనే కర్తను, చర్య మరియు ఉద్దేశంలోని అనిశ్చితిని నిలిపాం.
