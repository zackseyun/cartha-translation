revisions:
- from: అప్పుడు రాజైన ఆహాజు అష్షూరు రాజైన తిగ్లత్పిలేసెరును కలుసుకోవడానికి దమస్కుకు వెళ్లాడు. అక్కడ దమస్కులో ఉన్న బలిపీఠాన్ని చూశాడు. రాజైన ఆహాజు ఆ బలిపీఠపు నమూనాను, దాని నిర్మాణరీతిని—దాని పనితనమంతటికీ అనుగుణంగా—యాజకుడైన ఊరియాకు పంపించాడు.
  to: అప్పుడు రాజైన ఆహాజు అష్షూరు రాజైన తిగ్లత్పిలేసెరును కలుసుకోవడానికి దమస్కుకు వెళ్లాడు. అతడు దమస్కులో ఉన్న బలిపీఠాన్ని చూశాడు. రాజైన ఆహాజు ఆ బలిపీఠపు నమూనాను, దాని పనితనం అంతటికీ అనుగుణమైన దాని రూపకల్పనను యాజకుడైన ఊరియాకు పంపించాడు.
