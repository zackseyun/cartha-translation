source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ הַ/מֶּ֣לֶךְ אָחָ֡ז לִ֠/קְרַאת תִּגְלַ֨ת פִּלְאֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ דּוּמֶּ֔שֶׂק וַ/יַּ֥רְא אֶת הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/דַמָּ֑שֶׂק וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶל אוּרִיָּ֣ה הַ/כֹּהֵ֗ן אֶת דְּמ֧וּת הַ/מִּזְבֵּ֛חַ וְ/אֶת תַּבְנִית֖/וֹ לְ/כָֽל מַעֲשֵֽׂ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: te
  text: అప్పుడు రాజైన ఆహాజు అష్షూరు రాజైన తిగ్లత్పిలేసెరును కలుసుకోవడానికి దమస్కుకు వెళ్లాడు. అతడు దమస్కులో ఉన్న బలిపీఠాన్ని చూశాడు. రాజైన ఆహాజు ఆ బలిపీఠపు నమూనాను, దాని పనితనం అంతటికీ అనుగుణమైన దాని రూపకల్పనను యాజకుడైన ఊరియాకు పంపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లడం లేదా భేటీ కావడం అనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דְּמוּת הַמִּזְבֵּחַ
  choice: బలిపీఠపు నమూనా
  rationale: ఇక్కడ דמות అనేది కేవలం పోలికకన్నా, నిర్మాణానికి ఉపయోగపడే ప్రతిరూపం లేదా నమూనాను సూచిస్తుంది.
- source_word: תַּבְנִיתוֹ
  choice: దాని నిర్మాణరీతి
  rationale: ఆకృతి, రూపకల్పన, నిర్మాణ పద్ధతి అనే భావవ్యాప్తిని సందర్భానికి తగినట్లుగా తెలియజేస్తుంది.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: దాని పనితనమంతటికీ అనుగుణంగా
  rationale: బలిపీఠం ఎలా రూపొందించబడి చేయబడిందో దాని ప్రతి వివరాన్నీ అనుసరించడం అనే భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు స్పష్టంగా ఉండేందుకు సహజ తెలుగు వాక్య విభజన చేయబడింది; మూలార్థంలోని అనిశ్చితిని సిద్ధాంతపరంగా విస్తరించలేదు.
