  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: te
  text: ఆహాజు తన పితరులతో నిద్రించాడు[a]. అతడు తన పితరులతోపాటు దావీదు నగరంలో సమాధి చేయబడ్డాడు. అతని కుమారుడు హిజ్కియా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో నిద్రించాడు’ అనేది రాజుల మరణవార్తల్లో వాడే హీబ్రూ సంప్రదాయ పదబంధం. ఆహాజు చనిపోయి తన పూర్వీకులతో చేరాడని దీని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో వాడే హీబ్రూ సంప్రదాయ పదబంధాన్ని నిలుపుతుంది; ఇక్కడ ఇది మరణాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: హీబ్రూ రాజవంశ సంబంధమైన సూత్రప్రాయ వాక్యాన్ని ప్రతిబింబిస్తుంది; ‘పూర్వీకులతో’ కూడా సాధ్యమే గాని ‘పితరులతో’ మూలానికి మరింత సన్నిహితం.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: నిఫాల్ క్రియారూపంలోని కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: స్థలనామాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ ప్రకటనలో క్రియ ప్రధానంగా సింహాసనాధికారాన్ని స్వీకరించడాన్ని సూచిస్తుంది; ‘పాలించాడు’ కంటే ‘రాజయ్యాడు’ ఆరంభ భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు వ్యక్తినామ రూపం.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మూలంలోని కుమార సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వ సందర్భంలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించడాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘తన పితరులతో నిద్రించాడు’ అనే మరణ సూత్రం
  choice: హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరించడం
  alternative: ‘చనిపోయాడు’ అని నేరుగా అనువదించడం
  rationale: ఈ రాజవంశ మరణ ప్రకటనలోని పునరావృత సూత్ర స్వభావాన్ని కాపాడుతూ, దానిపై అదనపు పరలోక సిద్ధాంతాన్ని మోపకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ రాజవంశ సూత్రాన్ని నిలుపడానికి ‘పితరులతో నిద్రించాడు’ అని ఉంచి, అపార్థం రాకుండా పాదసూచిక జోడించబడింది.
