id: 2KI.16.7
reference: 2 Kings 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: te
  text: కాబట్టి ఆహాజు అష్షూరు రాజైన తిగ్లత్పిలెసెరుకు దూతలను పంపి, “నేను నీ సేవకుణ్ణి, నీ కుమారుణ్ణి[a]. పైకి రా, నాకు విరోధంగా లేచిన అరాము[b] రాజు చేతిలోనుండి[c], ఇశ్రాయేలు రాజు చేతిలోనుండి నన్ను రక్షించు” అని చెప్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ సేవకుణ్ణి, నీ కుమారుణ్ణి” అనేది ఆహాజు అష్షూరు రాజుకు తన విధేయతను ప్రకటించే దౌత్య భాష; భావార్థంగా “నీ సామంతుణ్ణి, నీ కుమారుణ్ణి” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అరాము”ను సంప్రదాయంగా “సిరియా” అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: c
    text: “చేతిలోనుండి” అనేది “అధికారం నుండి” లేదా “పట్టు నుండి” అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שלח క్రియకు సహజమైన కథన తెలుగు రూపం; వాక్యంలోని తదుపరి మాటలతో అనుసంధానించేందుకు అసమాపక రూపం వాడబడింది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: రాజకీయ సందర్భంలో వీరు మానవ సందేశవాహకులు; ‘దూతలు’ సహజమైన, విస్తృతార్థక తెలుగు పదం.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: తిగ్లత్పిలేసెరు
  rationale: హీబ్రూ రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: రాజు అధికార ప్రాంతాన్ని తెలిపే హీబ్రూ సమాసాన్ని నేరుగా, స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: నీ సేవకుణ్ణి, నీ కుమారుణ్ణి
  rationale: రాజకీయ విధేయతను తెలిపే సేవకత్వం, కుమారత్వం అనే మూలరూపకాలు రెండింటినీ నిలుపుతుంది.
- source_word: עֲלֵה
  choice: పైకి రా
  rationale: עלה అనే క్రియ యొక్క దిశాత్మక రూపకాన్ని నిలుపుతూ, ఆహాజు దృష్టికోణం నుంచి చేసిన ఆహ్వానంగా సహజంగా ఉంటుంది.
- source_word: וְהוֹשִׁיעֵנִי
  choice: నన్ను రక్షించడానికి
  rationale: ישע హిఫిల్‌కు ‘రక్షించు’ సరైన విస్తృత తెలుగు సమానం; ఇక్కడ సందర్భం సైనిక-రాజకీయ విమోచనను సూచిస్తుంది.
- source_word: מִכַּף
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా పట్టును సూచించే హీబ్రూ ‘చేతి’ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: సాంప్రదాయ ‘సిరియా’ కంటే మూల భౌగోళిక-జాతి పేరును నేరుగా నిలుపుతుంది.
- source_word: הַקּוֹמִים עָלָי
  choice: నాపైకి లేచిన
  rationale: కొనసాగుతున్న శత్రుత్వాన్ని తెలిపే కృదంత భావాన్ని సహజమైన తెలుగులో ఉంచి, ‘లేచుట’ అనే మూల చిత్రణను కాపాడుతుంది.
theological_decisions:
- issue: ఆహాజు వినతిలోని దౌత్యపరమైన స్వీయ-అణకువ భాష
  choice: ‘నీ సేవకుణ్ణి, నీ కుమారుణ్ణి’ అని అక్షరార్థ రూపకాలను నిలిపాం.
  alternative: ‘నీ సామంతుణ్ణి’ అని రాజకీయ సంబంధాన్ని వివరణాత్మకంగా అనువదించడం.
  rationale: ఇది రాజకీయ విధేయతను సూచించినా, మూలపాఠం సేవకత్వం మరియు కుమారత్వం అనే రెండు సంబంధ రూపకాలను ఉపయోగిస్తుంది; వాటిని నిలపడం వాక్చాతుర్యాన్ని, భావ ఉద్రిక్తతను కాపాడుతుంది.
- issue: ‘రక్షించు’ అనే పదం యొక్క సైనిక-రాజకీయ భావం
  choice: ‘నన్ను రక్షించడానికి’ అని విస్తృత బైబిలు పదజాలాన్ని నిలిపాం.
  alternative: ‘నన్ను విడిపించడానికి’ లేదా ‘నన్ను కాపాడడానికి’.
  rationale: ఈ సందర్భంలో రక్షణ సైనిక-రాజకీయమైనదే; అయినా మూలక్రియకు ఉన్న విస్తృత భావపరిధిని అనవసరంగా కుదించకుండా ‘రక్షించు’ వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. రాజుల పేర్లకు తెలుగు బైబిలు వాడుకకు అనుగుణమైన రూపాలు తీసుకొని, మూలంలోని దౌత్య భాష, ‘చేతి’ నుడికారం, ‘పైకి రా’ అనే దిశాత్మక చిత్రణను నిలిపాం. ‘అరాము’ను ప్రధాన పాఠ్యంలో ఉంచాం; ‘సిరియా’ అనే వివరణ ఈ వచనాన్ని అర్థం చేసుకోవడానికి అవసరం కానందున ప్రత్యేక పాదటిప్పణి చేర్చలేదు.
