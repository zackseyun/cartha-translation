revisions:
- from: కాబట్టి ఆహాజు అష్షూరు రాజైన తిగ్లత్పిలేసెరుకు[a] దూతలను పంపి, “నేను నీ సేవకుణ్ణి, నీ కుమారుణ్ణి. నాపైకి లేచిన అరాము రాజు చేతిలోనుండి, ఇశ్రాయేలు రాజు చేతిలోనుండి[b] నన్ను రక్షించడానికి పైకి రా” అని చెప్పించాడు.
  to: కాబట్టి ఆహాజు అష్షూరు రాజైన తిగ్లత్పిలెసెరుకు దూతలను పంపి, “నేను నీ సేవకుణ్ణి, నీ కుమారుణ్ణి[a]. పైకి రా, నాకు విరోధంగా లేచిన అరాము[b] రాజు చేతిలోనుండి[c], ఇశ్రాయేలు రాజు చేతిలోనుండి నన్ను రక్షించు” అని చెప్పించాడు.
  rationale: సవరణ మూలంలోని రెండు సమన్వయ ఆజ్ఞలను నిలుపుతుంది, ఇద్దరు శత్రు రాజులపై వర్తించే బహువచన కృదంతాన్ని తెలుగులో స్పష్టం చేస్తుంది, మరియు ఆంగ్ల పరిశీలన-ఆధారంలో నమోదైన అరాము/సిరియా ప్రత్యామ్నాయానికి సరైన పాదటిప్పణి గుర్తును జోడిస్తుంది. రాజకీయ సందర్భంలోని ‘రక్షించు’ భావాన్ని మతపరంగా అతిగా నిర్దిష్టం చేయలేదు.
