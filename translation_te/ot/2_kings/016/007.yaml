    rationale: עלה మరియు הוֹשִׁיעֵנִי మూలంలో సమన్వయ ఆజ్ఞలు. ‘పైకి రా, ... రక్షించు’ వాటి నిర్మాణాన్ని, విన్నప బలాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
