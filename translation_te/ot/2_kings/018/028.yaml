  to: 'అప్పుడు రబ్షాకే నిలబడి, యూదా భాషలో[a] బిగ్గరగా పిలిచి ఇలా చెప్పాడు: “గొప్ప రాజు, అష్షూరు రాజు మాట వినండి.”'
