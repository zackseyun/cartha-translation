reference: 2 Kings 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ רַב שָׁקֵ֔ה וַ/יִּקְרָ֥א בְ/קוֹל גָּד֖וֹל יְהוּדִ֑ית וַ/יְדַבֵּ֣ר וַ/יֹּ֔אמֶר שִׁמְע֛וּ דְּבַר הַ/מֶּ֥לֶךְ הַ/גָּד֖וֹל מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: te
  text: 'అప్పుడు రబ్షాకే నిలబడి, యూదా భాషలో[a] బిగ్గరగా పిలిచి ఇలా చెప్పాడు: “గొప్ప రాజు, అష్షూరు రాజు మాట వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హెబ్రీ భాషలో.” మూలపదం మరింత నిర్దిష్టంగా యూదా దేశపు భాషను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: నిలబడి
  rationale: కథన క్రమంలోని עמד క్రియకు సహజమైన, సూటి తెలుగు రూపం.
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఇది అష్షూరు రాజసభకు సంబంధించిన చారిత్రక బిరుదు/పేరు రూపం; పదవిని ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: బిగ్గరగా పిలిచి
  rationale: ప్రజల ఎదుట స్వరం ఎత్తి పిలిచాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוּדִית
  choice: యూదా భాషలో
  rationale: ఈ పదం సాధారణంగా హెబ్రీ భాష మొత్తాన్ని కాక, ప్రత్యేకంగా యూదా ప్రాంతపు భాషను సూచిస్తుంది.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హెబ్రీలోని జంట వాక్యారంభ క్రియల భావాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: బహువచన ఆజ్ఞను గౌరవభరితమైన ప్రజా ప్రకటన శైలిలో అందిస్తుంది.
- source_word: דְּבַר
  choice: మాట
  rationale: రాజు అధికారికంగా ప్రకటించే సందేశాన్ని సూటిగా సూచిస్తూ తెలుగు బైబిలు శైలికి సహజంగా ఉంటుంది.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: మహారాజైన
  rationale: అష్షూరు రాజబిరుదులోని ‘గొప్ప రాజు’ అనే భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హెబ్రీ నిర్మాణానికి నమ్మకంగా ఉండే స్పష్టమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రజా ప్రకటన శైలి. మూలంలోని భావాన్ని కాపాడుతూ, తెలుగులో కృత్రిమంగా వినిపించే జంట వాక్యారంభ క్రియలను సహజీకరించాం.
