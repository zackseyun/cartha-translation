source:
  edition: WLC
  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: te
  text: ఇదిగో, విరిగిన రెల్లుకర్ర అనే ఆ ఆధారమైన ఐగుప్తును నీవు నమ్ముకున్నావు.[a] దానిమీద ఎవరైనా ఆనుకుంటే,[b] అది అతని అరచేతిలోకి దూరి అరచేతిని గుచ్చుతుంది. తనను నమ్ముకునే వారందరికీ ఐగుప్తు రాజైన ఫరో అలాగే ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విరిగిన’ అనే మాటకు ‘నలిగిన’ లేదా ‘దెబ్బతిన్న’ అని కూడా అనువదించవచ్చు. హీబ్రూ విశేషణం ఈ భావాలన్నిటినీ సూచించగలదు; ఆనుకున్నవారి చేతిని గాయపరిచే ఆధారం అనే రూపకానికి ‘విరిగిన’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాచ్యార్థం: ‘ఒక పురుషుడు దానిమీద ఆనుకుంటే.’ ఇక్కడ ఏకవచన పుంలింగం సాధారణంగా ఎవరినైనా సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: నీవు ... ఐగుప్తును నమ్ముకున్నావు
  rationale: בטח అనేది ఆధారం పెట్టుకోవడం లేదా నమ్ముకోవడాన్ని సూచిస్తుంది. పరిపూర్ణ క్రియారూపం సందర్భంలో ప్రస్తుతం కొనసాగుతున్న ఆధారపడటాన్ని నిందాపూర్వకంగా సూచిస్తుంది; సహజమైన తెలుగులో ‘నమ్ముకున్నావు’ ఆ భావాన్ని అందిస్తుంది.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: విరిగిపోయిన రెల్లు కర్ర
  rationale: מִשְׁעֶנֶת అనేది ఆనుకొని ఆధారం పొందే కర్ర; קָנֶה ‘రెల్లు’; רָצוּץ నలిగిన, దెబ్బతిన్న లేదా విరిగిన దానిని సూచిస్తుంది. గాయపరిచే ఆధారమనే రూపకానికి ‘విరిగిపోయిన’ స్పష్టంగా సరిపోతుంది.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: దానిమీద ఎవరైనా ఆనుకుంటే
  rationale: నిఫాల్ రూపంలోని סמך ఆధారం కోసం ఆనుకోవడాన్ని సూచిస్తుంది. సంబంధవాచక వాక్యంలోని షరతు భావాన్ని తెలుగులో ‘ఆనుకుంటే’ సహజంగా వ్యక్తం చేస్తుంది; אִישׁ ఇక్కడ సాధారణార్థక ఏకవచనం.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: అది అతని అరచేతిలోకి దూరి దాన్ని చీల్చివేస్తుంది
  rationale: כַּף ఇక్కడ అరచేతిని సూచిస్తుంది; בוא సందర్భంలో లోపలికి దూరడాన్ని, נקב గుచ్చి చీల్చడాన్ని సూచిస్తాయి. ఈ అనువాదం రూపకంలోని శారీరక తీవ్రతను నిలుపుతుంది.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם לְכָל הַבֹּטְחִים עָלָיו
  choice: తనను నమ్ముకునే వారందరికీ ఐగుప్తు రాజైన ఫరో అలాగే ఉంటాడు
  rationale: כֵּן ముందున్న రూపకాన్ని ఫరోకు నేరుగా వర్తింపజేస్తుంది. לְ సంబంధం లేదా ప్రభావాన్ని సూచిస్తుంది; ‘వారందరికీ ... అలాగే ఉంటాడు’ ఆ నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఇదిగో’ హీబ్రూ הִנֵּה యొక్క దృష్టి ఆకర్షించే బలాన్ని నిలుపుతుంది. రూపకాన్ని వివరణగా మార్చకుండా, రెల్లు కర్ర అరచేతిని చీల్చే స్పష్టమైన చిత్రాన్ని అలాగే ఉంచాం.
