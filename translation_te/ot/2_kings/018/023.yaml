translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక వచనం. రబ్షాకే పలుకులోని ఎగతాళి, సవాలు నిలిచేలా ‘పందెం కాయి’ మరియు ‘సమకూర్చగలిగితే’ ఎంచుకున్నాం. ‘అష్షూరు’ మూల హీబ్రూ పేరుకు దగ్గరగా ఉండే సాంప్రదాయ బైబిలు రూపం; ‘స్వారీలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి గుర్రాలపై ఎక్కేవారిని సూచిస్తుంది.
