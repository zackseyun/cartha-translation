source:
  edition: WLC
  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: te
  text: ఇప్పుడు అయితే, దయచేసి నా యజమాని, అష్షూరు రాజుతో పందెం వేయి[a]. నీవు వాటిపై ఎక్కేందుకు స్వారీదారులను సమకూర్చగలిగితే, నేను నీకు రెండు వేల గుర్రాలు ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా యజమానితో ఒప్పందం చేసుకో,” లేదా “నా యజమాని సవాలును స్వీకరించు.” ఈ హీబ్రూ క్రియ ఒప్పందంలోకి రావడం లేదా తనను తాను పూచీకత్తుగా పెట్టుకోవడం అనే భావాలను ఇవ్వగలదు; అయితే ఇక్కడ ఇది ఎగతాళితో కూడిన పందెం లేదా సవాలును సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: పందెం కాయి
  rationale: ఈ అపహాస్య సవాలు సందర్భంలో హిత్పయేల్ క్రియ ఒప్పందం చేసుకోవడం కంటే పందెం లేదా సవాలు విసరడం అనే భావాన్ని ఇస్తుంది. נָא లోని వినయసూచక ఛాయను తెలుగులో ప్రత్యేకంగా ‘దయచేసి’ అని పెట్టడం వ్యంగ్య ధోరణిని అసహజం చేయవచ్చు; ఆ ధోరణి ఆజ్ఞారూపంలోనే వ్యక్తమవుతుంది.
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: నా యజమానియైన అష్షూరు రాజుతో
  rationale: ఇక్కడ אֶת అనేది ‘తో’ అనే సంబంధాన్ని సూచిస్తుంది; אֲדֹנִי దైవ బిరుదు కాదు, రబ్షాకే అధిపతిని సూచిస్తుంది. సమాసబంధాన్ని సహజ తెలుగులో ఒకే పదబంధంగా ఇచ్చాం.
- source_word: וְאֶתְּנָה לְךָ
  choice: నేను నీకు ... ఇస్తాను
  rationale: సందర్భంలో ఇది మొదటి పురుషుని ప్రతిపాదన లేదా హామీ. తెలుగు వాక్యక్రమానికి అనుగుణంగా కర్మను క్రియకు ముందు ఉంచాం.
- source_word: אַלְפַּיִם סוּסִים
  choice: రెండు వేల గుర్రాలు
  rationale: సంఖ్యా పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: אִם תּוּכַל לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: నీవు వాటిమీద ఎక్కించడానికి స్వారీలను సమకూర్చగలిగితే
  rationale: అక్షరార్థంగా ‘నీ కోసం వాటిమీద స్వారీలను ఉంచగలిగితే.’ యూదా వద్ద తగిన గుర్రపు స్వారీదారులు లేరనే ఎగతాళిని స్పష్టంగా, సహజంగా వ్యక్తం చేయడానికి ‘సమకూర్చగలిగితే’ వాడాం.
