source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: te
  text: ఎందుకంటే వారు తమ దేవుడైన యహ్వే మాట వినలేదు[a]; ఆయన నిబంధనను—యహ్వే సేవకుడైన మోషే ఆజ్ఞాపించినదంతటినీ—అతిక్రమించారు[b]. వారు వినలేదు, ఆచరించలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే మాట వినడం’ అంటే ఆయన చెప్పింది ఆలకించడమే కాక ఆయనకు విధేయత చూపడం కూడా.
    reason: lexical_alternative
  - marker: b
    text: ‘అతిక్రమించారు’కు బదులుగా ‘ఉల్లంఘించారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘వినలేదు’ అనే మాటను మళ్లీ చెప్పడం వారి నిరంతర నిరాకరణను నొక్కి చెబుతుంది; వారు ఆలకించలేదు, ఆచరించనూ లేదు.
    reason: literary_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలో చెప్పిన పరిణామానికి కారణాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: మాట వినలేదు
  rationale: హెబ్రీ ఇడియమ్‌లో వినడమూ విధేయత చూపడమూ రెండూ సూచితమవుతాయి. ‘మాట వినడం’ అనే తెలుగు ప్రయోగం ఆ రెండు భావాలనూ సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో మార్చకుండా, వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: וַיַּעַבְרוּ אֶת־בְּרִיתוֹ
  choice: ఆయన నిబంధనను అతిక్రమించారు
  rationale: నిబంధన సందర్భంలో עבר ఉల్లంఘించడం లేదా మీరడం అనే నైతిక-ఒడంబడిక భావాన్ని ఇస్తుంది; ‘అతిక్రమించారు’ ఆ బలాన్ని నిలుపుతుంది.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినదంతటినీ
  rationale: ఆజ్ఞల సంపూర్ణ పరిధిని తెలుగులో సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: యహ్వే సేవకుడైన మోషే
  rationale: עֶבֶד ఇక్కడ గౌరవప్రదమైన అధికారిక బిరుదు; ‘సేవకుడు’ ఆ భావానికి సరిపోతుంది.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: వారు వినలేదు, ఆచరించలేదు
  rationale: హెబ్రీలోని సమాంతర నిరాకరణనూ, ముందటి ‘వినలేదు’ అనే పదపునరుక్తినీ నిలుపుతూ, చేయవలసినదాన్ని అమలు చేయలేదనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచుతుంది; ‘యహ్వే’ మూల ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- issue: שׁמע అనే క్రియలోని విధేయత భావాన్ని ఎంత స్పష్టంగా చేయాలి
  choice: మాట వినలేదు
  alternative: విధేయులుగా ఉండలేదు
  rationale: హెబ్రీ వ్యక్తీకరణలో వినడమూ లోబడడమూ కలిసివున్నాయి. తెలుగు ‘మాట వినడం’ కూడా ఈ ద్వంద్వార్థాన్ని సహజంగా మోస్తుంది; కాబట్టి భావాన్ని ఒక్క ‘విధేయత’కే పరిమితం చేయదు.
- issue: בְּרִיתוֹ మరియు כָּל אֲשֶׁר צִוָּה మధ్య సంబంధం
  choice: డాష్‌లతో సమానాధికార వివరణగా ఉంచడం
  alternative: ‘అంటే’ అని వివరణాత్మకంగా కలపడం
  rationale: హెబ్రీలో రెండవ కర్మ మొదటి దానిని వివరిస్తున్నట్టు ఉన్నప్పటికీ సంబంధాన్ని సంధిపదంతో పూర్తిగా నిర్ధారించదు. డాష్‌లు ఆ సన్నిహిత సంబంధాన్ని చూపుతూ మూలంలోని స్వల్ప నిర్మాణాత్మక సందిగ్ధతను నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మాట వినడం’ వంటి సహజ తెలుగు ఇడియమ్ ద్వారా హెబ్రీలోని వినడం-విధేయత భావద్వయాన్ని నిలిపాం. మూలంలోని పునరుక్తి, సమాంతర నిర్మాణం సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
