id: 2KI.18.20
reference: 2 Kings 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: te
  text: “అది కేవలం పెదవుల మాటే” అని నీవు అంటున్నావు—కాని యుద్ధానికి ఆలోచన, బలం కావాలి. ఇప్పుడు నీవు ఎవరిని నమ్ముకొని నాపై తిరుగుబాటు చేశావు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: పెదవుల మాట
  rationale: హీబ్రూ పదబంధంలోని శరీరాంగ రూపకాన్ని నిలుపుతూ, కార్యరహితమైన కేవల మాట అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עֵצָה
  choice: ఆలోచన
  rationale: యుద్ధానికి అవసరమైన వివేకపూర్వక ప్రణాళిక లేదా వ్యూహాత్మక సలహా అనే విస్తృత అర్థాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גְבוּרָה
  choice: బలం
  rationale: ఇక్కడ యుద్ధ సామర్థ్యం లేదా శౌర్యబలం ఉద్దేశం; ‘బలం’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בָטַחְתָּ
  choice: నమ్ముకొని
  rationale: ఎవరిపై ఆధారపడి ఈ చర్య చేశావనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מָרַדְתָּ
  choice: తిరుగుబాటు చేశావు
  rationale: రాజకీయ అధిపత్యానికి వ్యతిరేకంగా ఎదిరించడాన్ని సూచించే హీబ్రూ క్రియకు నేరమైన సమానార్థకం.
theological_decisions:
- issue: ప్రారంభ వాక్యంలోని వక్త ఉద్దేశం మరియు వాక్యనిర్మాణ అస్పష్టత
  choice: “అది కేవలం పెదవుల మాటే” అని నీవు అంటున్నావు—కాని యుద్ధానికి ఆలోచన, బలం కావాలి.
  alternative: “కేవలం పెదవుల మాటే ఆలోచన, యుద్ధబలం” అని నీవు అంటున్నావు.
  rationale: మసొరేటిక్ పాఠంలోని పదాలు సంక్షిప్తంగా ఉండి సంబంధం కొంత అస్పష్టంగా ఉంది. సంప్రదాయ విభజనను అనుసరించి విరుద్ధతను చూపినా, అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజదౌత్య సవాలుకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి స్పష్టంగా రూపొందించబడింది. మూలంలోని రెండవ పురుష ఏకవచన సంభోదనను నిలిపింది.
