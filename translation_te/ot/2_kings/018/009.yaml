  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక కథనానికి తగిన గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. మూలంలోని రాజ్యపాలనా కాల సమన్వయాన్ని డాష్‌ల మధ్య ఉంచి నిలిపింది.
