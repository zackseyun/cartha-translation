source:
  edition: WLC
  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: te
  text: హిజ్కియా రాజు పాలనలో నాలుగో సంవత్సరంలో—అది ఏలా కుమారుడైన ఇశ్రాయేలు రాజు హోషేయ పాలనలో ఏడో సంవత్సరం—అష్షూరు రాజు షల్మనెసెరు సమరయ మీదికి దండెత్తి వచ్చి, దాన్ని ముట్టడించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: …సంవత్సరంలో
  rationale: ఇది చారిత్రక సంఘటనను పరిచయం చేసే సాధారణ హీబ్రూ కథన సూత్రం. తెలుగులో ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చకుండా కాలనిర్దేశ వాక్యంతో ప్రారంభించడం సహజంగా ఉంటుంది.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: హిజ్కియా రాజు పాలనలో నాలుగో సంవత్సరంలో
  rationale: రాజ్యపాలనా సంవత్సరాన్ని సూచించే సూత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: అది ఏలా కుమారుడైన ఇశ్రాయేలు రాజు హోషేయ పాలనలో ఏడో సంవత్సరం
  rationale: రెండు రాజుల పాలనా సంవత్సరాల సమకాలికతను మూలంలోని పునఃసూచక సర్వనామంతో సహా స్పష్టంగా నిలుపుతుంది.
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: సమరయ మీదికి దండెత్తి వచ్చి
  rationale: సైనిక సందర్భంలో עלה శత్రుత్వపూర్వకంగా ఒక స్థలంపైకి కదలడాన్ని సూచిస్తుంది; ‘దండెత్తి వచ్చి’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు షల్మనెసెరు
  rationale: హీబ్రూ పేర్లకు దగ్గరగా, తెలుగులో వాడుకలో ఉన్న రూపాలను అనుసరిస్తుంది.
- source_word: וַיָּצַר עָלֶיהָ
  choice: దాన్ని ముట్టడించాడు
  rationale: צור అనే క్రియ ఇక్కడ పట్టణాన్ని చుట్టుముట్టి ముట్టడి చేయడాన్ని సూచిస్తుంది; ఈ అనువాదం సంక్షిప్తంగా, స్పష్టంగా ఉంది.
