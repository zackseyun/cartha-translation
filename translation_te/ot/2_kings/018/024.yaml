id: 2KI.18.24
reference: 2 Kings 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: te
  text: అయితే, నా యజమాని అత్యల్ప హోదా గల సేవకుల్లోని ఒక్క అధికారిని[a] నీవు ఎలా తిప్పికొట్టగలవు, రథాల కోసం, గుర్రపు రౌతుల కోసం ఐగుప్తుపై ఆధారపడుతున్నప్పుడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రాంత పాలకుడు,’ ‘సైనికాధికారి.’ హీబ్రూ పదం ప్రాంత పాలకుడినీ సైనిక అధికారినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: ఎదిరించగలవు
  rationale: ‘ముఖాన్ని వెనక్కి తిప్పడం’ అనే హీబ్రూ జాతీయాన్ని సందర్భానుసారంగా ‘ఎదిరించడం/తిప్పికొట్టడం’ అని సహజమైన తెలుగులో అందిస్తుంది; సైనిక సవాలు స్పష్టంగా ఉంటుంది.
- source_word: פַחַת
  choice: అధికారి
  rationale: ఈ పదం ప్రాంత పాలకుడినో సైనిక అధికారినో సూచించవచ్చు. సందర్భం సైనికమైనదైనా, హీబ్రూ పదంలోని విస్తృతతను నిలుపుకోవడానికి ‘అధికారి’ ఎంచుకున్నాం.
- source_word: אַחַד
  choice: ఒక్క
  rationale: కేవలం ఒక అధికారినే ఎదిరించలేవనే అవహేళనాత్మక వాక్పటిమను బలపరుస్తుంది.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: నా యజమాని సేవకుల్లో అతి చిన్నవారిలోని
  rationale: ఇక్కడ ‘చిన్న’ అనేది శరీర పరిమాణాన్ని కాక తక్కువ హోదాను సూచిస్తుంది; మూలంలోని సంబంధ నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: నీవు ఐగుప్తును నమ్ముకున్నావు కదా
  rationale: בטח על అంటే ఆధారపడడం లేదా నమ్ముకోవడం. ప్రశ్నలోని ఎద్దేవా స్వరాన్ని తెలుగు ‘కదా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: రథాల కోసం, గుర్రపు రౌతుల కోసం
  rationale: ఐగుప్తు నుంచి ఆశిస్తున్న సైనిక వనరులను సూచిస్తుంది; ‘గుర్రపు రౌతులు’ mounted troops అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి. అష్షూరు ప్రతినిధి పలికిన సైనిక ఎద్దేవా, అలంకార ప్రశ్న రెండూ నిలుపబడ్డాయి; అరుదైన అక్షరార్థ జాతీయానికి బదులు సహజమైన ‘ఎదిరించగలవు’ వాడబడింది.
