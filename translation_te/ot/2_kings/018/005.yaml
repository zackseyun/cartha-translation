id: 2KI.18.5
reference: 2 Kings 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు దేవుడైన యాహ్వే[a]పై నమ్మకం ఉంచాడు. అతని తరువాత యూదా రాజులందరిలో అతనివంటివాడు ఎవరూ లేరు; అతనికి ముందు ఉన్నవారిలోనూ ఎవరూ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ఇక్కడ దేవుని వ్యక్తిగత నామమైన יהוה (YHWH) ఉంది; దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
    reason: దైవనామం యొక్క మూలరూపం మరియు అనువాద విధానాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: בַּיהוָה
  choice: యాహ్వేపై
  rationale: ב అనే విభక్తి విశ్వాసం లేదా ఆధారం ఉంచిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘యాహ్వేపై నమ్మకం ఉంచాడు’ సహజంగా ఉండి మూలంలోని భావాన్ని స్పష్టంగా నిలుపుతుంది; יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: ఈ సమాస పదబంధం యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది. తెలుగులో విశేషణాత్మకంగా కలపడం సహజంగా ఉంటుంది.
- source_word: בָּטָח
  choice: నమ్మకం ఉంచాడు
  rationale: בטח యొక్క ఖాల్ సంపూర్ణ రూపం ‘నమ్మడం, ఆధారపడడం’ అనే భావాన్ని ఇస్తుంది. ‘నమ్మకం ఉంచాడు’ విశ్వాసపూర్వక ఆధారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאַחֲרָיו
  choice: అతని తరువాత
  rationale: ఇది హిజ్కియా తరువాతి కాలాన్ని సూచించే కాలవాచక పదబంధం.
- source_word: לֹא הָיָה כָמֹהוּ
  choice: అతనివంటివాడు ఎవరూ లేరు
  rationale: మూలంలోని పోలిక ద్వారా వ్యక్తమయ్యే అసమానతను సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: యూదా రాజులందరిలో
  rationale: సమూహం మధ్య పోలికను సూచించే ב ను తెలుగులో ‘అందరిలో’ అని సహజంగా అనువదించాం.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: అతనికి ముందు ఉన్నవారిలోనూ
  rationale: ఈ సంబంధవాచక భాగం ముందున్న యూదా రాజులను కూడా పోలికలో చేర్చుతుంది. ‘లోనూ’ ముందు వాక్యభాగంలోని నిరాకరణను కొనసాగిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణను తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించడం నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: హిజ్కియాకు సమానుడు లేడనే ప్రకటన పరిధి
  choice: అతని తరువాతి, అతనికి ముందున్న యూదా రాజుల మధ్య పోలిక
  alternative: అన్ని కాలాల లేదా అన్ని రాజ్యాల రాజుల మధ్య సంపూర్ణ పోలిక
  rationale: మూలపాఠం పోలికను స్పష్టంగా ‘యూదా రాజులందరిలో’ అని పరిమితం చేస్తుంది. అందువల్ల దాని పరిధిని ఇతర రాజ్యాలకు లేదా రాజులు కానివారికి విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘నమ్మకం ఉంచాడు’ అనే ప్రయోగం సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని విశ్వాసం/ఆధారపడడం భావాన్ని నిలుపుతుంది. పోలికలోని రెండు కాలదిశలను సెమికోలన్‌తో అనుసంధానించి వాక్య బలాన్ని కాపాడాం.
