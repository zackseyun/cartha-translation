id: 2KI.18.32
reference: 2 Kings 18:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: te
  text: నేను వచ్చి మిమ్మల్ని మీ దేశంలాంటి దేశానికి తీసుకుపోయేంతవరకు—ధాన్యం, కొత్త ద్రాక్షారసం[a] ఉన్న దేశానికి, రొట్టె, ద్రాక్షతోటలు ఉన్న దేశానికి, ఒలీవ నూనె, తేనె ఉన్న దేశానికి[b]—మీరు బ్రతకండి, చనిపోకండి. హిజ్కియా మాట వినకండి. ఎందుకంటే, ‘యహ్వే మనల్ని విడిపిస్తాడు’ అని చెప్పి అతడు మిమ్మల్ని తప్పుదారి పట్టిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం తాజా లేదా కొత్త ద్రాక్షామద్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలోని పదబంధం సంక్షిప్తంగా ఉంది; దీనిని “ఒలీవ నూనె” అని అర్థం చేసుకోవడం సాధారణం.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: עַד בֹּאִי וְלָקַחְתִּי אֶתְכֶם
  choice: నేను వచ్చి... మిమ్మల్ని తీసుకుపోయేంతవరకు
  rationale: עַד introduces the future point up to which the preceding appeal applies. לקח is rendered naturally as taking the hearers to another land; the forced-relocation setting remains evident from context without adding an explicit verb such as ‘deport.’
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: మీ దేశంలాంటి దేశానికి
  rationale: 'The comparative כְ is retained: the destination is presented as resembling, not being identical with, their own land.'
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: ధాన్యం, కొత్త ద్రాక్షారసం ఉన్న దేశానికి
  rationale: דָּגָן denotes grain broadly. תִּירוֹשׁ commonly refers to fresh or new wine, represented transparently as కొత్త ద్రాక్షారసం.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: రొట్టె, ద్రాక్షతోటలు ఉన్న దేశానికి
  rationale: לֶחֶם is kept as ‘bread’ rather than generalized to food, and כְּרָמִים is specifically vineyards.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: నూనె ఇచ్చే ఒలీవ చెట్లూ తేనె ఉన్న దేశానికి
  rationale: The compressed Hebrew expression links olive produce with oil. This rendering preserves both the olive-tree image and the intended oil yield without inserting an additional independent item into the list.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: మీరు బ్రతకండి, చనిపోకండి
  rationale: The Hebrew exhortational force and sharp rhetorical contrast are preserved rather than converted entirely into a result clause.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: హిజ్కియా మాట వినకండి
  rationale: שׁמע אל means heed or listen to; the idiomatic Telugu expression conveys heeding what Hezekiah says.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: ఎందుకంటే... అతడు మిమ్మల్ని తప్పుదారి పట్టిస్తున్నాడు
  rationale: The Hiphil verb can mean entice, incite, or mislead. ‘తప్పుదారి పట్టిస్తున్నాడు’ fits the accusation while avoiding the stronger claim of deliberate deceit.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: The personal divine name is transliterated into natural Telugu rather than replaced with a title or with ‘Jehovah.’
- source_word: יַצִּילֵנוּ
  choice: మనల్ని విడిపిస్తాడు
  rationale: The Hiphil of נצל denotes rescue or deliverance from danger; విడిపిస్తాడు suits the military threat in context.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: The Hebrew directly uses the Tetragrammaton. Transliteration preserves the personal name and avoids substituting either a title or the distinct traditional form ‘Jehovah.’
- issue: Force of וִחְיוּ וְלֹא תָמֻתוּ
  choice: మీరు బ్రతకండి, చనిపోకండి
  alternative: మీరు బ్రతికి చనిపోకుండా ఉండేందుకు
  rationale: The chosen wording retains the exhortational form and the coercive life-versus-death rhetoric of the Assyrian speaker, without turning his promise into an unqualified narrator-endorsed result.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, అయితే రాజదూత పలికిన ఒత్తిడితో కూడిన ప్రచార స్వరాన్ని నిలుపుతూ అనువదించబడింది. వ్యవసాయ సమృద్ధిని తెలిపే పునరుక్త జాబితా, జీవితం–మరణం మధ్య గట్టి వ్యత్యాసం, హిజ్కియాపై చేసిన ఆరోపణ యథాశక్తి నిలుపబడ్డాయి.
