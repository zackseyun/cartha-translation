  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֵּצֵ֧א אֲלֵ/הֶ֛ם אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָה֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: te
  text: వారు రాజును పిలిచారు. అప్పుడు రాజగృహ బాధ్యతలో ఉన్న[a] హిల్కీయా కుమారుడు ఎల్యాకీము వారి దగ్గరకు బయటికి వచ్చాడు[b]. అతనితో పాటు లేఖికుడైన[c] షెబ్నా, ఆసాపు కుమారుడైన రాజ్య దస్తావేజుల అధికారి యోవాహు కూడా వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రాజగృహంపై ఉన్నవాడు’; ఇది రాజగృహం లేదా రాజభవన పరిపాలనకు సంబంధించిన అధికార బిరుదు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘వారి దగ్గరకు బయటికి వెళ్లాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘కార్యదర్శి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: వారు రాజును పిలిచారు
  rationale: קרא אל అనే నిర్మాణం రాజును ఉద్దేశించి పిలవడం లేదా ఆయన రావాలని పిలవడం అనే భావాన్ని కలిగిస్తుంది. తెలుగు వాక్యప్రయోగంలో ‘రాజును పిలిచారు’ సహజంగా ఉండి, అధికారికంగా ‘రప్పించారు’ అని మూలానికి మించిన భావాన్ని చేర్చదు.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: వారి దగ్గరకు బయటికి వచ్చాడు
  rationale: יצא అంటే బయటికి వెళ్లడం లేదా రావడం. ప్రతినిధులను కలవడానికి నగరం లేదా రాజగృహం లోపలి నుంచి బయటికి వచ్చిన సందర్భాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది; ఏకవచన హీబ్రూ క్రియను ఎల్యాకీముతో అనుసంధానిస్తుంది.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: హిల్కీయా కుమారుడు ఎల్యాకీము
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కుమార సంబంధాన్ని స్పష్టంగా ఉంచింది.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: రాజగృహ బాధ్యతలో ఉన్న
  rationale: ఇది రాజుని గృహం లేదా రాజభవన పరిపాలనపై అధికారం కలిగిన పదవిని సూచించే పరిపాలనా బిరుదు. ‘బాధ్యతలో ఉన్న’ అనేది ‘పై ఉన్న’ అనే హీబ్రూ రూపకాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: הַסֹּפֵר
  choice: లేఖికుడు
  rationale: סֹפֵר రాజసభలో వ్రాతపని మరియు కార్యదర్శి విధులు నిర్వహించే అధికారిని సూచిస్తుంది. ‘లేఖికుడు’ మూలపదానికి దగ్గరగా ఉండి, ‘కార్యదర్శి’ అనే సాధ్యమైన భావాన్ని పూర్తిగా నిరాకరించదు.
- source_word: הַמַּזְכִּיר
  choice: రాజ్య దస్తావేజుల అధికారి
  rationale: ఈ పదం రాజ్య వ్యవహారాల జ్ఞాపికలు, నివేదికలు లేదా అధికారిక రికార్డులను నిర్వహించే అధికారిని సూచిస్తుంది. తెలుగులో కేవలం ‘జ్ఞాపకకర్త’ అనడం అసహజం కాబట్టి విధిని స్పష్టంగా తెలియజేసే పదబంధం వాడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలో ‘బయటికి వచ్చాడు’ అనే ఏకవచన క్రియ ఎల్యాకీమును ప్రధాన కర్తగా చూపుతుంది; మిగిలిన ఇద్దరిని ‘అతనితో పాటు’ అని సహజంగా అనుసంధానించాం. మూలంలోని పరిపాలనా బిరుదుల మధ్య తేడాను ‘లేఖికుడు’ మరియు ‘రాజ్య దస్తావేజుల అధికారి’గా నిలిపాం.
