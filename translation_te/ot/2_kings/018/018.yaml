  terminology: ‘రాజగృహ బాధ్యతలో ఉన్న’ పరిపాలనా బిరుదు యొక్క విస్తృతతను కాపాడుతుంది. ‘లేఖికుడు’ సֹפֵרకు తగినది; ప్రత్యామ్నాయమైన ‘కార్యదర్శి’ని గమనికలో సరిగా అందించారు. ‘రాజ్య దస్తావేజుల అధికారి’ הַמַּזְכִּיר అనే రాజసభ రికార్డు-అధికారి పాత్రను ఆధునిక తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది; ఇది నిర్దిష్టమైన, అనవసరమైన పదవీ సిద్ధాంతాన్ని విధించదు.
