  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣ה אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סֹּפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣דוּ ל֔/וֹ דִּבְרֵ֖י רַב שָׁקֵֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: te
  text: అప్పుడు రాజభవన వ్యవహారాల అధికారి అయిన హిల్కీయా కుమారుడు ఎల్యాకీము, లేఖికుడైన షెబ్నా, రాజ దస్తావేజుల అధికారి అయిన ఆసాపు కుమారుడు యోవాహు వస్త్రాలు చింపుకొని హిజ్కియా వద్దకు వచ్చారు. వారు రబ్షాకే[a] చెప్పిన మాటలను అతనికి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రబ్షాకే’ అనేది అష్షూరు రాజ్యంలోని ఒక అధికార బిరుదు. దాని ఖచ్చిత విధి స్పష్టంగా తెలియదు; ఇది ప్రధాన పానదాయకుడు లేదా రాజప్రతినిధి వంటి ఉన్నత అధికారిని సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చారు
  rationale: కథనాన్ని ముందుకు నడిపే వావ్‌ను ‘అప్పుడు’గా సహజంగా వ్యక్తం చేశాం. హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నా, తరువాత వచ్చే సంయుక్త కర్తను బట్టి తెలుగులో బహువచనం సహజం.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: రాజభవన వ్యవహారాల అధికారి
  rationale: ఇది రాజగృహం లేదా రాజభవన పరిపాలనపై పర్యవేక్షణ వహించే అధికార పదవి. సాధారణ ఇంటి నిర్వహణగా అపార్థం కాకుండా రాజసభ సందర్భాన్ని స్పష్టం చేశాం.
- source_word: הַסֹּפֵר
  choice: లేఖికుడు
  rationale: రాజసభలో లిఖితపరమైన విధులు నిర్వహించే అధికారిని సూచించే పారదర్శకమైన, గౌరవప్రదమైన పదం.
- source_word: הַמַּזְכִּיר
  choice: రాజవృత్తాంతాల అధికారి
  rationale: రాజసభలో సంఘటనలు, నిర్ణయాలు మొదలైనవాటిని నమోదు చేసి భద్రపరిచే అధికార పదవి అనే భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: קְרוּעֵי בְגָדִים
  choice: వస్త్రాలు చింపుకొని
  rationale: దుఃఖం, దిగ్భ్రాంతి లేదా అవమానానికి సూచనగా వస్త్రాలు చింపుకునే స్పష్టమైన హీబ్రూ ఆచారాన్ని నిలుపుతుంది.
- source_word: וַיַּגִּדוּ לוֹ
  choice: వారు ... అతనికి తెలియజేశారు
  rationale: అధికారికంగా విన్న మాటలను రాజుకు నివేదించిన సందర్భానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: דִּבְרֵי
  choice: చెప్పిన మాటలను
  rationale: మూలంలోని ‘మాటలు’ అనే స్పష్టతను నిలుపుతూ తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని అందిస్తుంది.
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఖచ్చితమైన విధులు పూర్తిగా నిర్ధారించలేని అష్షూరు అధికార బిరుదును ఒక నిర్దిష్ట పదవిగా అనువదించి భావాన్ని కుదించకుండా లిప్యంతరీకరించాం; వివరణను పాదసూచికలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. అధికార పదవులను సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించాం; అర్థం అనిశ్చితంగా ఉన్న ‘రబ్షాకే’ను లిప్యంతరీకరించి పాదసూచికలో వివరించాం. పాదసూచిక గుర్తును సంబంధిత ‘రబ్షాకే’ పదం వద్ద ఉంచాం.
