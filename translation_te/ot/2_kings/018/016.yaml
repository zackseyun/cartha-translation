source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: te
  text: ఆ సమయంలో హిజ్కియా యెహోవా ఆలయ ద్వారాలను, యూదా రాజైన హిజ్కియా పైపూత పూయించిన ద్వారస్తంభాలను[a] కోసి తొలగించి, వాటిని అష్షూరు రాజుకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ద్వారచట్రాలను” లేదా “స్తంభాలను.” ఇక్కడి హీబ్రూ పదం అరుదైనది; ఆలయ ద్వారాలకు సంబంధించిన నిర్మాణ ఆధారాలను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కథన క్రమంలో సంఘటనను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కాలసూచక ప్రయోగం.
- source_word: קִצַּץ
  choice: కోయించి
  rationale: మూల క్రియలోని కోసి తొలగించే నిర్దిష్ట చర్యను నిలుపుతుంది; రాజు స్వయంగా కాక తన ఆజ్ఞతో చేయించిన భావం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: דַּלְתוֹת
  choice: ద్వారాలను
  rationale: ఆలయపు తలుపులు లేదా ద్వార పలకలను సూచించే సాధారణ పదానికి స్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: הֵיכַל יְהוָה
  choice: యెహోవా ఆలయ
  rationale: ఈ సందర్భంలో הֵיכָל యెరూషలేము ఆలయాన్ని సూచిస్తుంది; దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: הָאֹמְנוֹת
  choice: ద్వారస్తంభాలను
  rationale: అరుదైన ఈ నిర్మాణ పదం ద్వారాలకు సంబంధించిన నిలువు ఆధారాలను సూచించే అవకాశం ఉంది; అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: צִפָּה
  choice: పైపూత పూయించిన
  rationale: లోహంతో కప్పడం లేదా తాపడం అనే భావాన్ని పదార్థాన్ని అనవసరంగా చేర్చకుండా తెలియజేస్తుంది; హిజ్కియా ముందే చేయించిన చర్యను సూచిస్తుంది.
- source_word: וַיִּתְּנֵם
  choice: వాటిని ... ఇచ్చాడు
  rationale: సరళమైన కథన క్రియను సహజ తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజుకు
  rationale: దేశనామం-రాజు సంబంధాన్ని తెలుగులో సహజమైన సమాస రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతూ, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. అరుదైన వాస్తు పదంలోని నిజమైన అనిశ్చితిని ప్రధాన పాఠంలో ఒక సాధ్యమైన అర్థంతో, పాదసూచికలో ప్రత్యామ్నాయాలతో నిలిపాం.
