  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన ఏలా కుమారుడు హోషేయ పరిపాలనలో మూడవ సంవత్సరంలో, ఆహాజు కుమారుడు హిజ్కియా యూదాకు రాజయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అధికారికంగా: ‘రాజుగా పరిపాలించడం ప్రారంభించాడు.’ ఇక్కడి హీబ్రూ రాజవృత్తాంత సూత్రంలోని క్రియ హిజ్కియా సింహాసనాన్ని అధిష్ఠించడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది కొత్త కథన భాగానికి మార్పును సూచించే హీబ్రూ కథన నిర్మాణం. ఆధునిక తెలుగులో వాక్యాన్ని నేరుగా కాలసూచనతో ప్రారంభించడం సహజం; మూలంలో లేని ‘ఇప్పుడు’ అనే స్పష్టమైన కాలార్థాన్ని చేర్చలేదు.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: మూడవ సంవత్సరంలో
  rationale: రాజుల పరిపాలన సంవత్సరాన్ని సూచించే ప్రామాణిక తేదీ సూత్రానికి సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: ఏలా కుమారుడు హోషేయ పరిపాలనలో
  rationale: లְ ఉపసర్గ ఇక్కడ ఏ రాజు పరిపాలన సంవత్సరాన్ని లెక్కిస్తున్నారో సూచిస్తుంది. తెలుగులో ‘పరిపాలనలో’ అని స్పష్టీకరించడం సహజంగా ఉంటుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: హోషేయ పదవిని, రాజ్యాన్ని గుర్తించే సమాస సంబంధాన్ని సహజమైన తెలుగు విశేషణ రూపంలో తెలిపింది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజ్యారోహణ సూత్రంలో క్రియ కేవలం పరిపాలించడాన్ని కాక సింహాసనాన్ని అధిష్ఠించిన ఆరంభాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חִזְקִיָּה
  choice: హిజ్కియా
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణ.
- source_word: בֶן אָחָז
  choice: ఆహాజు కుమారుడు
  rationale: తండ్రి ద్వారా వ్యక్తిని గుర్తించే మూలంలోని నిర్మాణాన్ని నేరుగా నిలిపింది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదాకు రాజయ్యాడు
  rationale: హీబ్రూలో ‘యూదా రాజు’ అనేది హిజ్కియాకు అన్వయించే పదబంధం; తెలుగులో రాజ్యారోహణ క్రియతో కలిపి ‘యూదాకు రాజయ్యాడు’ అనడం సహజంగా ఉండి అదే అర్థాన్ని ఇస్తుంది.
