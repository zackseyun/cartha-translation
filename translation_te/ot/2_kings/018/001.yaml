  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని తేదీ సూత్రం, వంశ గుర్తింపు, రాజ్యారోహణ భావం నిలిపి, అనవసరమైన కథన సంధిపదాన్ని చేర్చలేదు.
