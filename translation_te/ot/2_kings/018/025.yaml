id: 2KI.18.25
reference: 2 Kings 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: te
  text: ఇప్పుడు, యాహ్వే లేకుండానే నేను ఈ స్థలంపైకి వచ్చి దాన్ని నాశనం చేయడానికి వచ్చానా?[a] యాహ్వే నాతో, ‘ఈ దేశంపైకి వెళ్లి దాన్ని నాశనం చేయి’ అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నుండి స్వతంత్రంగా”; “యాహ్వే లేకుండా.”
    reason: מִבַּלְעֲדֵי అనే పదం ‘లేకుండా,’ ‘వేరుగా,’ లేదా ‘స్వతంత్రంగా’ అనే సమీప భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: లేకుండానే ... వచ్చానా?
  rationale: ప్రశ్నార్థక הֲ మరియు מִבַּלְעֲדֵי కలిసి వక్త స్వతంత్రంగా రాలేదని సూచించే అలంకారప్రశ్నను ఏర్పరుస్తాయి. ‘లేకుండానే’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి ‘ఆయనకు వేరుగా/ఆయన అనుమతి లేకుండా’ అనే భావపరిధిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా అందించాం; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- source_word: עָלִיתִי
  choice: మీదికి వచ్చాను
  rationale: עלה యొక్క ‘పైకి పోవడం/రావడం’ అనే ప్రాథమిక భావాన్ని, సైనికంగా ఒక స్థలంపైకి కదలడాన్ని తెలిపే సహజ తెలుగు ప్రయోగంతో అందించాం.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం
  rationale: మָקוֹם యొక్క విస్తృత అర్థాన్ని నిలిపి, సందర్భాన్ని బట్టి ‘యెరూషలేము’ లేదా ‘ఈ పట్టణం’ అని వివరణాత్మకంగా సంకుచితం చేయలేదు.
- source_word: לְהַשְׁחִיתוֹ
  choice: దాన్ని నాశనం చేయడానికి
  rationale: שׁחת హిఫీల్ రూపంలోని విధ్వంసక క్రియను నేరుగా, సహజంగా తెలిపే పదబంధం.
- source_word: אָמַר אֵלַי
  choice: నాతో ... అని చెప్పాడు
  rationale: సాధారణ వాక్యప్రయోగాన్ని సహజ తెలుగు ప్రత్యక్ష వచన నిర్మాణంలో అందిస్తుంది.
- source_word: עֲלֵה
  choice: మీదికి వెళ్లు
  rationale: עלה ఆజ్ఞార్థక రూపాన్ని సైనిక కదలిక సందర్భానికి సరిపోయేలా, మూలంలోని దిశాభావాన్ని నిలుపుతూ అనువదించాం.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ఈ దేశం
  rationale: אֶרֶץ ఇక్కడ దండయాత్రకు గురయ్యే భూభాగం/దేశాన్ని సూచిస్తుంది. ముందున్న ‘స్థలం’తో మూలంలో ఉన్న పదభేదాన్ని నిలిపాం.
- source_word: וְהַשְׁחִיתָהּ
  choice: దాన్ని నాశనం చేయి
  rationale: స్త్రీలింగ ప్రత్యయం אֶרֶץ‌ను సూచిస్తుంది. ముందున్న שׁחת రూపంతో పదసంబంధాన్ని నిలుపుతూ అదే క్రియను పునరావృతం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో నిలిపాం.
- issue: ‘ఈ స్థలం’, ‘ఈ దేశం’ అనే పదాల నిర్దిష్ట సూచన
  choice: మూలంలోని రెండు వేర్వేరు సాధారణ నామాలను అలాగే నిలుపడం
  alternative: యెరూషలేము; ఈ పట్టణం; యూదా
  rationale: מָקוֹם మరియు אֶרֶץ వేర్వేరు పదాలు. వాటిని యెరూషలేము లేదా యూదా అని మార్చడం మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- issue: అష్షూరు వక్త చెప్పిన దైవిక అధికార ప్రకటన స్వరూపం
  choice: అతని వాదనగా నేరుగా ఉంచడం
  alternative: ఆ వాదన నిజమని లేదా అబద్ధమని అనువాదంలో సూచించడం
  rationale: వాక్యం వక్త చేసిన ప్రకటనను మాత్రమే నమోదు చేస్తుంది; దాని సత్యాసత్యాలపై అనువాదం తీర్పు చెప్పకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ప్రత్యక్ష వచనం. అలంకారప్రశ్నను ప్రశ్నగానే ఉంచాం; ‘స్థలం/దేశం’ పదభేదాన్ని కాపాడాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత ప్రశ్న తర్వాత ఉంచబడింది.
