revisions:
- from: ఇప్పుడు, యెహోవా లేకుండానే నేను ఈ స్థలాన్ని నాశనం చేయడానికి దాని మీదికి వచ్చానా?[a] యెహోవా నాతో, ‘ఈ దేశం మీదికి వెళ్లి దాన్ని నాశనం చేయి’ అని చెప్పాడు.”
  to: ఇప్పుడు, యాహ్వే లేకుండానే నేను ఈ స్థలంపైకి వచ్చి దాన్ని నాశనం చేయడానికి వచ్చానా?[a] యాహ్వే నాతో, ‘ఈ దేశంపైకి వెళ్లి దాన్ని నాశనం చేయి’ అని చెప్పాడు.
  rationale: మూలంలోని ప్రశ్నార్థక הֲమִבַּלְעֲדֵיని అలంకారప్రశ్నగా ఉంచాం. עָלִיתִי ... לְהַשְׁחִיתוֹకు ‘ఈ స్థలంపైకి వచ్చి దాన్ని నాశనం చేయడానికి’ అని, తరువాతి ఆజ్ఞ עֲלֵה ... וְהַשְׁחִיתָהּకు ‘ఈ దేశంపైకి వెళ్లి దాన్ని నాశనం చేయి’ అని ఇచ్చాం. తద్వారా మָקוֹם/אֶרֶץ భేదం, రెండు చోట్లా శׁחת విధ్వంసక క్రియ, మరియు వక్త కేవలం చేస్తున్న దైవిక అధికార-వాదన అన్న స్వరూపం నిలిచాయి.
