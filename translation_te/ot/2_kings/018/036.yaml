source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: te
  text: 'అయితే ప్రజలు మౌనంగా ఉన్నారు; అతనికి ఒక్క మాట కూడా జవాబివ్వలేదు. ఎందుకంటే రాజు ఆజ్ఞ ఇలా ఉంది: “అతనికి జవాబివ్వకండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: మౌనంగా ఉండి
  rationale: חרשׁ హిఫీల్ రూపం ఇక్కడ మాట్లాడకుండా మౌనాన్ని కొనసాగించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మౌనంగా ఉండి’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עַם యొక్క సాధారణ అర్థం ‘ప్రజలు’; సందర్భంలో వింటున్న యూదా ప్రజలను అనవసరంగా మరింత నిర్దిష్టం చేయకుండా సూచిస్తుంది.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: అతనికి ఒక్క మాట కూడా జవాబివ్వలేదు
  rationale: మూలంలోని ‘అతనికి ఒక మాట జవాబివ్వలేదు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో సంపూర్ణ నిరాకరణగా వ్యక్తపరుస్తూ, ‘మాట’ అనే చిత్రాన్ని కూడా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇది ప్రజలు మౌనంగా ఉండడానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంధాయకం.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞాపించాడు
  rationale: పదశః ‘రాజు ఆజ్ఞ’ అయినా, తరువాతి ప్రత్యక్ష ఉద్ధరణతో ఆధునిక తెలుగులో క్రియారూపం సహజంగా ఉంటుంది; రాజాధికారంతో ఇచ్చిన ఆదేశ భావం నిలుస్తుంది.
- source_word: הִיא לֵאמֹר
  choice: అని
  rationale: పదశః ‘అది చెప్పుచుండెను’ అనే నిర్మాణం ఉద్ధరణను పరిచయం చేస్తుంది; తెలుగులో ‘అని’తో ఆజ్ఞాపించాడు అనడం సహజ సమానార్థకం.
- source_word: לֹא תַעֲנֻהוּ
  choice: అతనికి జవాబివ్వకండి
  rationale: రెండవ పురుష బహువచన నిషేధాన్ని స్పష్టంగా చూపుతుంది; ముందున్న ענה కు సమానంగా ‘జవాబివ్వు’నే పునరావృతం చేస్తుంది.
