revisions:
- from: అయితే ప్రజలు మౌనంగా ఉండి, అతనికి ఒక్క మాట కూడా జవాబివ్వలేదు; ఎందుకంటే, “అతనికి జవాబివ్వకండి” అని రాజు ఆజ్ఞాపించాడు.
  to: 'అయితే ప్రజలు మౌనంగా ఉన్నారు; అతనికి ఒక్క మాట కూడా జవాబివ్వలేదు. ఎందుకంటే రాజు ఆజ్ఞ ఇలా ఉంది: “అతనికి జవాబివ్వకండి.”'
  rationale: The revision preserves the Hebrew’s coordinated statements and its explicit causal explanation that the quoted words constituted the king’s command. It retains the idiomatic force of “did not answer him a word” as “ఒక్క మాట కూడా జవాబివ్వలేదు.” No footnote is necessary because the idiom is naturally clear in Telugu.
