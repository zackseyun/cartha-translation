translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని ‘ఒక్క మాట’ నుడికారాన్ని పాఠ్యంలోనే సహజంగా స్పష్టం చేసినందున పాదసూచిక అవసరం లేదు.
