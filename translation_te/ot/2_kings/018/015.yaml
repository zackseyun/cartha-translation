  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: te
  text: హిజ్కియా యాహ్వే మందిరంలో[b]ను రాజు ఇంటి ఖజానాల్లో[c] ఉన్న వెండినంతటినీ[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధనం’; హీబ్రూలో ‘వెండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యాహ్వే ఇల్లు’; సందర్భానుసారంగా ‘యాహ్వే మందిరం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘రాజభవనపు ఖజానాలు’; అక్షరార్థం ‘రాజు ఇంటి ఖజానాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు ‘ఇవ్వడం, అప్పగించడం’ అనే విస్తృత అర్థం ఉంది. కప్పం సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ఇచ్చాడు’ సహజంగా మూలార్థాన్ని నిలుపుతుంది.
- source_word: חִזְקִיָּה
  choice: హిజ్కియా
  rationale: హీబ్రూ వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: כָּל
  choice: అంతటినీ
  rationale: సమగ్రతను తెలిపే హీబ్రూ పరిమాణపదాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: כֶּסֶף అనేది వెండి లోహాన్నీ, విస్తృతార్థంలో ధనాన్నీ సూచించవచ్చు. మూలంలోని స్పష్టమైన పదాన్ని కాపాడేందుకు ‘వెండి’ ఎంచుకోబడింది.
- source_word: הַנִּמְצָא
  choice: దొరికిన
  rationale: מצא నిఫాల్ కృదంతంలోని ‘కనబడిన/అందుబాటులో ఉన్న’ భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֵית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తున్నందున తెలుగులో సహజమైన ‘మందిరం’ వాడబడింది, అక్షరార్థం పాదసూచికలో ఉంచబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: וּבְאֹצְרוֹת
  choice: ఖజానాల్లోనూ
  rationale: אֹצָרకు ‘ఖజానా’ లేదా ‘నిల్వగది’ అనే అర్థాలు ఉండవచ్చు. వెండి, రాజసంపదల సందర్భంలో ‘ఖజానాలు’ సరిపోతుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థం ‘రాజు ఇల్లు’; ఇక్కడ రాజప్రాసాద సముదాయాన్ని సూచించే సహజ తెలుగు పదం ‘రాజభవనం’. అక్షరార్థాన్ని పాదసూచికలో చూపించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాలి. ఆధునిక తెలుగులో విస్తృతంగా తెలిసిన రూపం ‘యెహోవా’; ‘యాహ్వే’ మరొక సాధ్యమైన పండిత లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సహజ క్రమాన్ని వాడింది; ‘వెండి’ వంటి మూలంలోని స్పష్టమైన పదాన్ని మాత్రం నిలిపింది.
