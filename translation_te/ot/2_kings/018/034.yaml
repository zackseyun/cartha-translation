  to: హమాతు, అర్పాదుల దేవుళ్లు ఎక్కడ ఉన్నారు? సెఫర్వయీము, హేనా, ఇవ్వాల దేవుళ్లు ఎక్కడ ఉన్నారు? వారు సమరయను నా చేతినుండి విడిపించారా?
