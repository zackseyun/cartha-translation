id: 2KI.18.34
reference: 2 Kings 18:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: te
  text: హమాతు, అర్పాదుల దేవుళ్లు ఎక్కడ ఉన్నారు? సెఫర్వయీము, హేనా, ఇవ్వాల దేవుళ్లు ఎక్కడ ఉన్నారు? వారు సమరయను నా చేతినుండి విడిపించారా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיֵּה
  choice: ఎక్కడ ఉన్నారు?
  rationale: స్థానాన్ని ప్రశ్నించే పదం. ‘దేవుళ్లు’ అనే బహువచన కర్తకు అనుగుణంగా, ఎగతాళితో కూడిన అలంకారిక ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי
  choice: దేవుళ్లు
  rationale: ఇది నిర్మాణ బహువచనం; సందర్భంలో పేర్కొన్న పట్టణాలు లేదా జనాల దేవతలను సూచిస్తుంది.
- source_word: חֲמָת וְאַרְפָּד
  choice: హమాతు, అర్పాదు
  rationale: హీబ్రూ స్థలనామాలను తెలుగులో సులభంగా పలికే సంప్రదాయ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: సెపర్వయిము, హేన, ఇవ్వా
  rationale: స్థలనామాలను హీబ్రూ వ్యంజన రూపాలకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; ఇవి మూడు వేర్వేరు పేర్లుగా వాక్య నిర్మాణంలో నిలిపాం.
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించకుండా ప్రశ్నారూపంలో వ్యక్తీకరణ
  rationale: ఇక్కడ ఈ కణం ముందటి ఎగతాళిని కొనసాగించే అలంకారిక ప్రశ్నతో సంబంధం కలిగి ఉంది. తెలుగులో ‘వారు ... విడిపించారా?’ అనే ప్రశ్నారూపమే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הִצִּילוּ
  choice: విడిపించారా
  rationale: నצל హిఫీల్ రూపం ప్రమాదం లేదా అధికారం నుంచి రక్షించడం, విడిపించడం అనే అర్థం ఇస్తుంది; ఇక్కడ సైనిక ఆధిపత్య సందర్భానికి ‘విడిపించారా’ సరిపోతుంది.
- source_word: שֹׁמְרוֹן
  choice: సమరయ
  rationale: ఆ పట్టణం/రాజ్యానికి తెలుగులో విస్తృతంగా తెలిసిన బైబిలు స్థలనామ రూపాన్ని వాడాం.
- source_word: מִיָּדִי
  choice: నా చేతిలోనుండి
  rationale: అధికారం లేదా నియంత్రణను సూచించే హీబ్రూ మూర్తిమంత నుడికారాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: అన్యజన దేవతలను గురించి వక్త చేసిన సవాలు
  choice: జయించబడిన ప్రాంతాల దేవుళ్లు సమరయను అష్షూరు రాజు అధికారం నుంచి విడిపించలేదనే అతిశయోక్తి ప్రశ్నగా అనువదించడం
  alternative: ఇది ప్రత్యేకంగా పేర్కొన్న దేవతల గురించి చారిత్రక వాదన కాకుండా, జాతీయ దేవతలన్నిటినీ ఉద్దేశించిన సాధారణ ఎగతాళిగా గ్రహించడం
  rationale: హీబ్రూ పాఠం అనేక ప్రాంతాల దేవుళ్లను పేరుపెట్టి, వారు సమరయను ‘నా చేతిలోనుండి’ విడిపించారా అని అడుగుతుంది. అన్యదేవతల ఉనికి లేదా శక్తి గురించి పాఠం చెప్పనిదాన్ని జోడించకుండా దాని ఉద్రిక్తమైన వాక్చాతుర్యాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలిపే శైలి. వరుస అలంకారిక ప్రశ్నలను, ‘నా చేతిలోనుండి’ అనే హీబ్రూ నుడికారాన్ని పరిరక్షించాం. తెలుగు పాఠానికి అవసరం లేని ఆంగ్ల లిప్యంతరణ భేదపు పాదటిప్పణిని చేర్చలేదు.
