  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: te
  text: 'అప్పుడు రబ్షాకే వారితో ఇలా అన్నాడు: “దయచేసి హిజ్కియాతో ఇలా చెప్పండి: ‘మహారాజైన అష్షూరు రాజు ఇలా అంటున్నాడు: నీవు నమ్ముకున్న ఈ నమ్మకం ఏమిటి?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఇది అష్షూరు రాజసభలోని ఒక అధికార బిరుదు; వ్యక్తిపేరుగా నిర్ధారించకుండా పరిచితమైన లిప్యంతరీకరణను నిలిపాం.
- source_word: אִמְרוּ נָא
  choice: దయచేసి ... ఇలా చెప్పండి
  rationale: נא సూచించే మర్యాదపూర్వక విజ్ఞప్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: మహారాజు
  rationale: ‘గొప్ప రాజు’ అనే అష్షూరు సామ్రాజ్య బిరుదు భావాన్ని తెలుగులో సహజంగా, గంభీరంగా అందిస్తుంది.
- source_word: הַבִּטָּחוֹן
  choice: ధైర్యం
  rationale: ఈ సందర్భంలో భద్రతాభావం, నమ్మకం, దానివల్ల కలిగిన ధీమా అనే విస్తృతిని సూచిస్తుంది; తరువాతి בָּטַח క్రియతో ఉన్న పదప్రయోగ సంబంధాన్ని ‘నమ్ముకున్న’ ద్వారా కొంత నిలిపాం.
- source_word: בָּטָחְתָּ
  choice: నీవు నమ్ముకున్న
  rationale: హీబ్రూ పరిపూర్ణ క్రియను సహజమైన తెలుగు సంబంధక్రియ రూపంలో ఇచ్చి, ఆధారపడటం/విశ్వసించడం అనే భావాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజదౌత్య ప్రసంగానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. అంతర్గత ఉద్ధరణను స్పష్టంగా చూపించాం.
