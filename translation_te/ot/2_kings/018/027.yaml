translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. అసభ్యంగా వినిపించే ముట్టడి అవమానాన్ని మూలానికి అనుగుణంగా స్పష్టంగా ఉంచి, అనవసరంగా మరింత మోటుగా చేయలేదు.
