revisions:
- from: 'అప్పుడు రబ్షాకే వారితో ఇలా అన్నాడు: “ఈ మాటలు చెప్పడానికి నా ప్రభువు నన్ను నీ ప్రభువు దగ్గరికీ, నీ దగ్గరికీ మాత్రమే పంపాడా? గోడమీద కూర్చున్న మనుషుల దగ్గరికి కూడా పంపలేదా? మీతోపాటు వారు తమ మలాన్ని తిని, తమ మూత్రాన్ని తాగవలసి వస్తుంది[a].”'
  to: 'అప్పుడు రబ్షాకే వారితో ఇలా అన్నాడు: “ఈ మాటలు చెప్పడానికి నా ప్రభువు నన్ను నీ ప్రభువునొద్దకూ, నీ వద్దకూ మాత్రమే పంపాడా? మీతో కలిసి తమ మలాన్ని తిని, తమ మూత్రాన్ని తాగవలసి వచ్చే గోడపై కూర్చున్న మనుషుల దగ్గరికీ పంపలేదా[a]?”'
  rationale: రెండవ అలంకార ప్రశ్నలో గోడపై కూర్చున్న మనుషులను వారి భయంకర ముట్టడి పరిస్థితితో నేరుగా అనుసంధానించాము. పాదటిప్పణిని కేతీవ్/కెరే భేదానికి అనుగుణంగా నిర్దిష్టంగా సవరించాము. అర్థం, వ్యంగ్య స్వరం, మరియు మూలంలోని కఠినమైన చిత్రణ మారలేదు.
