source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: te
  text: 'అప్పుడు రబ్షాకే వారితో ఇలా అన్నాడు: “ఈ మాటలు చెప్పడానికి నా ప్రభువు నన్ను నీ ప్రభువునొద్దకూ, నీ వద్దకూ మాత్రమే పంపాడా? మీతో కలిసి తమ మలాన్ని తిని, తమ మూత్రాన్ని తాగవలసి వచ్చే గోడపై కూర్చున్న మనుషుల దగ్గరికీ పంపలేదా[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ కేతీవ్‌లో ముట్టడి దుస్థితిని వర్ణించే కఠినమైన మాటలు ఉన్నాయి: “తమ మలాన్ని తిని, తమ మూత్రాన్ని తాగడం.” మసొరెటికు కెరే పఠనంలో రెండవ మాటకు సౌమ్యోక్తిగా “తమ పాదాల నీటిని తాగడం” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఇది అష్షూరు రాజసభలోని ఉన్నతాధికారి బిరుదు. ఖచ్చితమైన పదవిని ఊహించి నిర్ధారించకుండా, కథనంలో వ్యక్తిని సూచించే బిరుదుగా లిప్యంతరీకరించాం.
- source_word: הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי
  choice: నా ప్రభువు నన్ను నీ ప్రభువు దగ్గరికీ, నీ దగ్గరికీ మాత్రమే పంపాడా?
  rationale: మూలంలోని అలంకార ప్రశ్నను సహజమైన తెలుగులో నిలిపాం. తరువాతి ‘కూడా’ అనే వ్యత్యాసంతో స్పష్టమయ్యే పరిమిత భావాన్ని తెలుగులో ‘మాత్రమే’ ద్వారా వ్యక్తం చేశాం.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: నీ ప్రభువు / నా ప్రభువు
  rationale: ఇక్కడ రెండూ రాజకీయ అధిపతులను సూచిస్తాయి; దేవునికి ప్రత్యేకమైన సంబోధనగా కాకుండా, గౌరవభరితమైన సాధారణ పదాన్ని వాడాం.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు చెప్పడానికి
  rationale: హీబ్రూ భావాన్ని నేరుగా, ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: గోడమీద కూర్చున్న మనుషుల దగ్గరికి కూడా పంపలేదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను నిలిపి, అధికారులతోపాటు గోడమీద ఉన్నవారినీ ఉద్దేశించాడనే వ్యత్యాసాన్ని ‘కూడా’తో తెలియజేశాం.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: తిని ... తాగవలసి వస్తుంది
  rationale: ముట్టడి వల్ల కలగబోయే భయంకర పరిణామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఉద్దేశాన్ని సూచించకుండా అనివార్య పరిస్థితిని తెలియజేస్తుంది.
- source_word: חרי/הם
  choice: తమ మలాన్ని
  rationale: కెతీవ్‌లోని మోటైన ముట్టడి చిత్రణను మృదుపరచకుండా, సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అనువదించాం.
- source_word: שיני/הם
  choice: తమ మూత్రాన్ని
  rationale: మూలంలో పఠన/లేఖన సంప్రదాయానికి సంబంధించిన సౌమ్యోక్తి భేదం ఉన్నప్పటికీ, సందర్భంలోని ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
- source_word: עִמָּכֶם
  choice: మీతోపాటు
  rationale: గోడమీద ఉన్నవారూ సంబోధించబడిన వారితో కలిసి అదే ముట్టడి బాధను అనుభవిస్తారనే సహవర్తిత్వ భావాన్ని నిలిపాం.
