id: 2KI.18.3
reference: 2 Kings 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: te
  text: అతడు యెహోవా దృష్టిలో సరైనది చేశాడు; తన తండ్రియైన దావీదు[a] చేసినదంతటికీ అనుగుణంగా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘తండ్రి’ అనే పదం ఇక్కడ హిజ్కియా తక్షణ తండ్రిని కాదు, దావీదు వంశంలోని పూర్వికుణ్ణి సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: కథనాన్ని కొనసాగించే వావ్‌తో కూడిన క్రియ. ఆధునిక తెలుగులో వాక్యారంభంలో ‘మరియు’ అవసరం లేకుండా సహజంగా అనువదించబడింది.
- source_word: הַיָּשָׁר
  choice: సరైనది
  rationale: నిర్దిష్ట ఉపపదంతో విశేషణం నామవాచకార్థంలో ఉండి, నైతికంగా సరైన కార్యాన్ని సూచిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: యెహోవా అంచనా ప్రకారం అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో ఇచ్చింది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: చేసినదంతటిని అనుసరించి
  rationale: మొత్తం ప్రవర్తనా నమూనాతో సరిపోలికను తెలిపే כְּ + כֹּל + אֲשֶׁר నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: דָּוִד אָבִיו
  choice: తన పూర్వికుడైన దావీదు
  rationale: ఇక్కడ אָבִיו తక్షణ తండ్రిని కాక దావీదు వంశంలోని పూర్వికుణ్ణి సూచిస్తుంది; తెలుగు పాఠకుడు తప్పుగా అర్థం చేసుకోకుండా సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో నిలుపబడింది.
- issue: ‘దావీదు తన తండ్రి’లో אָבִיו భావం
  choice: తన పూర్వికుడైన దావీదు
  alternative: తన తండ్రియైన దావీదు
  rationale: హిజ్కియాకు దావీదు తక్షణ తండ్రి కాదు. హీబ్రూలో ‘తండ్రి’ పూర్వికుణ్ణి కూడా సూచించగలదు; అందువల్ల వంశపరమైన సంబంధాన్ని స్పష్టంగా, సిద్ధాంతపరమైన అదనపు భావం లేకుండా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ మూలంలోని దైవిక మూల్యాంకన నుడికారాన్ని ‘యెహోవా దృష్టికి’గా నిలిపి, ‘తండ్రి’ అనే వంశపరమైన ప్రయోగాన్ని అపార్థం కాకుండా ప్రధాన పాఠ్యంలో స్పష్టం చేసింది.
