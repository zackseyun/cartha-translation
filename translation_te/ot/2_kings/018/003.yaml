  rationale: 'The revision preserves the Hebrew word order and dynastic expression more closely: Hezekiah did what was right in Yahweh’s sight, in conformity with all that David his father had done. The footnote, anchored at “దావీదు,” supplies the necessary clarification without replacing the source expression in the main text.'
