  revised_text: అతడు ఉన్నత స్థలాలను[a] తొలగించి, పూజా స్తంభాలను పగులగొట్టి, అషేరాను[b] నరికివేశాడు. మోషే చేసిన కంచు సర్పాన్ని ముక్కలుగా చితకగొట్టాడు; ఎందుకంటే ఆ దినాల వరకు ఇశ్రాయేలీయులు దానికి ధూపం అర్పిస్తూ ఉండేవారు. దానికి “నెహుష్తాను”[c] అనే పేరు పెట్టబడింది.[d]
