source:
  edition: WLC
  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: te
  text: అతడు ఉన్నత స్థలాలను[a] తొలగించి, పూజా స్తంభాలను పగులగొట్టి, అషేరాను[b] నరికివేశాడు. మోషే చేసిన కంచు సర్పాన్ని ముక్కలుగా చితకగొట్టాడు; ఎందుకంటే ఆ దినాల వరకు ఇశ్రాయేలీయులు దానికి ధూపం అర్పిస్తూ ఉండేవారు. దానికి “నెహుష్తాను”[c] అనే పేరు పెట్టబడింది.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఉన్నత స్థలాలు” అంటే స్థానికంగా బలులు అర్పించి ఆరాధించే ప్రదేశాలు; అవి తప్పనిసరిగా కొండలమీదే ఉండేవి కావు.
    reason: cultural_note
  - marker: b
    text: లేదా “అషేరా స్తంభాన్ని,” లేదా “పవిత్ర స్తంభాన్ని.”
    reason: lexical_alternative
  - marker: c
    text: “నెహుష్తాను” అనే పేరు “కంచు” అనే హీబ్రూ పదంతో పదప్రయోగం కావచ్చు; “కేవలం కంచు ముక్క” అనే తక్కువచేసే భావమూ ఉండవచ్చు.
    reason: cultural_note
  - marker: d
    text: లేదా “అతడు దానికి ‘నెహుష్తాను’ అని పేరు పెట్టాడు.” ఇక్కడ కర్త హిజ్కియా అని హీబ్రూ రూపాన్ని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵסִיר
  choice: తొలగించి
  rationale: సంస్కరణ సందర్భంలో ఏదో ఒకదాన్ని అక్కడి నుంచి తీసివేయడం అనే సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలను
  rationale: స్థానిక ఆరాధనా కేంద్రాలను సూచించే స్థిరమైన బైబిలు పదబంధం; అవి తప్పనిసరిగా ప్రతి సందర్భంలో కొండమీదే ఉండేవని అనవసరంగా నిర్ధారించదు.
- source_word: שִׁבַּר ... הַמַּצֵּבֹת
  choice: పూజా స్తంభాలను పగులగొట్టి
  rationale: מַצֵּבָה ఇక్కడ ఆరాధనకు సంబంధించిన నిలువురాయి లేదా స్తంభం. 'పూజా' అనే విశేషణం సందర్భార్థాన్ని స్పష్టం చేస్తుంది; క్రియ బలవంతంగా ధ్వంసం చేయడాన్ని తెలియజేస్తుంది.
- source_word: כָרַת ... הָאֲשֵׁרָה
  choice: అషేరాను నరికివేశాడు
  rationale: క్రియ భౌతిక పూజావస్తువును నరకడాన్ని సూచిస్తుంది. అయితే אֲשֵׁרָה అనే పదాన్ని కేవలం 'దేవత'గా లేదా కేవలం 'స్తంభం'గా పరిమితం చేయకుండా లిప్యంతరీకరించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִתַּת
  choice: ముక్కలుగా చితకగొట్టాడు
  rationale: సాధారణంగా పగులగొట్టడం కంటే సంపూర్ణంగా ధ్వంసం చేయడాన్ని ఈ బలమైన క్రియ సూచిస్తుంది.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: కంచు సర్పాన్ని
  rationale: లోహంతో చేసిన సర్పాన్ని సూచించే సహజమైన తెలుగు రూపం; సంఖ్యాకాండములోని నేపథ్యంతోనూ సరిపోతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ జాతీయ-వంశ సమూహ సూచనను ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా వ్యక్తం చేస్తుంది.
- source_word: מְקַטְּרִים לוֹ
  choice: దానికి ధూపం వేస్తూ ఉండేవారు
  rationale: పూజలో ధూపం లేదా సుగంధద్రవ్యాన్ని కాల్చి పొగ అర్పించే నిరంతర ఆచారాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: దాన్ని “నెహుష్తాను” అని పిలిచేవారు
  rationale: తెలుగులో సహజమైన అనిర్దిష్ట కర్తగల రూపం. హీబ్రూ ఏకవచన క్రియకు హిజ్కియా కర్త కావచ్చనే అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం; పవిత్ర పూజా స్తంభం
  rationale: వాక్యంలో నరికివేయబడే భౌతిక వస్తువు ప్రధానంగా కనిపించినా, ఈ పదం దేవతతో సంబంధమున్న పూజావస్తువును సూచిస్తుంది. ప్రధాన పాఠ్యంలో లిప్యంతరీకరణ ప్రాచీన మతసంబంధ సూచనను కుదించకుండా ఉంచుతుంది.
- issue: וַיִּקְרָא లోని కర్త
  choice: అనిర్దిష్టంగా ‘పిలిచేవారు’
  alternative: ‘అతడు దాన్ని నెహుష్తాను అని పిలిచాడు,’ అంటే హిజ్కియా పేరు పెట్టాడు
  rationale: హీబ్రూలో క్రియ ఏకవచనమైనందున హిజ్కియా కర్తగా అర్థం చేసుకోవచ్చు; అయినా సందర్భంలో పేరు సాధారణంగా వాడబడిందనే పఠనమూ ఉంది. ప్రధాన పాఠ్యం ఒకే కర్తను ఖచ్చితంగా నిర్ణయించదు, పాదసూచిక ప్రత్యామ్నాయాన్ని ఇస్తుంది.
- issue: నెహుష్తాను అనే పేరులో పదప్రయోగం
  choice: పేరును లిప్యంతరీకరించి వివరణను పాదసూచికలో ఇవ్వడం
  alternative: ‘కేవలం కంచు ముక్క’ అని నేరుగా అనువదించడం
  rationale: ఇది పేరు రూపంలో ఉంది; נְחֹשֶׁת (‘కంచు’) మరియు נָחָשׁ (‘సర్పం’) ధ్వనులతో సంబంధమున్న పదప్రయోగం కావచ్చు. అర్థాన్ని ప్రధాన పాఠ్యంలో ఖచ్చితంగా నిర్ణయించడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ఉన్నత స్థలాలు,’ ‘అషేరా,’ ‘నెహుష్తాను’ వంటి ప్రాచీన సాంస్కృతిక పదాలను ప్రధాన పాఠ్యంలో నిలిపి, అవసరమైన వివరణలను పాదసూచికల్లో ఇచ్చాం. ధ్వంసక్రియల వరుసను సంక్షిప్తంగా, బలంగా ఉంచాం.
