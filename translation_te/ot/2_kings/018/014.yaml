id: 2KI.18.14
reference: 2 Kings 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: te
  text: అప్పుడు యూదా రాజైన హిజ్కియా లాకీషులో ఉన్న[a] అష్షూరు రాజుకు కబురు పంపించి, “నేను తప్పు చేశాను. నన్ను విడిచి వెనుదిరుగు. నువ్వు నాపై ఏది మోపినా[b] నేను భరిస్తాను” అని చెప్పాడు. అప్పుడు అష్షూరు రాజు యూదా రాజైన హిజ్కియాపై మూడు వందల తలాంతుల వెండిని, ముప్పై తలాంతుల బంగారాన్ని విధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లాకీషుకు.’ హీబ్రూ రూపం లాకీషు వైపు వెళ్లడాన్ని సూచించగలదు; అయితే ఇక్కడ అది అష్షూరు రాజు ఉన్న ప్రదేశాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నువ్వు నాపై ఏది మోపినా, నేను దాన్ని మోస్తాను/చెల్లిస్తాను.’ హీబ్రూ వాక్యం తన మీద మోపబడిన భారాన్ని లేదా కప్పాన్ని భరించడం గురించి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపించి
  rationale: ఇక్కడ שלח అనేది రాజుకు సందేశం లేదా దూతలను పంపడాన్ని సూచిస్తుంది. తరువాత ప్రత్యక్ష వాక్యం ఉన్నందున ‘కబురు పంపించి’ అనే సహజమైన తెలుగు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לָכִישָׁה
  choice: లాకీషులో ఉన్న
  rationale: దిశను సూచించే రూపం ‘లాకీషుకు’ అని అర్థమవగలిగినా, కథా సందర్భంలో అష్షూరు రాజు లాకీషులో ఉన్నాడని తెలిపే నిర్మాణం తెలుగులో సహజంగా ఉంటుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: חָטָאתִי
  choice: నేను తప్పు చేశాను
  rationale: חטא సాధారణంగా ‘పాపం చేయడం’ అని అర్థమిచ్చినా, ఇక్కడ రాజుల మధ్య రాజకీయ లొంగుబాటు మాటలో ‘తప్పు చేశాను’ అనేది సందర్భోచితంగా ఉండి, తన దోషాన్ని అంగీకరించే బలాన్ని నిలుపుతుంది.
- source_word: שׁוּב מֵעָלַי
  choice: నా మీదికి రావడం మానుకొని వెనక్కి వెళ్లిపో
  rationale: ఈ పదబంధం శత్రుత్వపు ఒత్తిడిని ఉపసంహరించుకొని వెనుదిరగాలని కోరుతుంది. తెలుగు పాఠకునికి సైనిక సందర్భం స్పష్టంగా ఉండేందుకు ఈ విస్తృత సహజ ప్రయోగం ఎంచుకోబడింది.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: నువ్వు నా మీద ఎంత భారం మోపినా
  rationale: נתן על ఇక్కడ పన్ను, పరిహారం లేదా ఇతర బాధ్యతను మోపడాన్ని సూచిస్తుంది. ‘భారం’ అనే పదం మూలంలోని విశాలతను కాపాడుతుంది.
- source_word: אֶשָּׂא
  choice: నేను భరిస్తాను
  rationale: נשא యొక్క ప్రాథమిక భావం మోయడం లేదా భరించడం. ఇక్కడ చెల్లింపును సూచించినప్పటికీ, ‘భరిస్తాను’ మూల రూపకాన్ని, విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וַיָּשֶׂם ... עַל
  choice: మీద ... విధించాడు
  rationale: שׂים על ఇక్కడ ఆర్థిక బాధ్యతను లేదా కప్పాన్ని మోపడాన్ని సూచిస్తుంది. ‘విధించాడు’ ఆధునిక తెలుగులో సహజమైన పరిపాలనా పదం.
- source_word: כִּכַּר
  choice: తలాంతులు
  rationale: ככר ప్రాచీన బరువు ప్రమాణం. తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘తలాంతు’ పదాన్ని నిలుపుతూ, ఖచ్చిత ఆధునిక బరువుగా అనవసర మార్పిడి చేయలేదు.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఇక్కడ బరువుతో కొలిచిన లోహాన్ని సూచిస్తుంది; అందువల్ల ‘డబ్బు’ కంటే ‘వెండి’ ఖచ్చితం.
- source_word: זָהָב
  choice: బంగారం
  rationale: బరువుతో కొలిచిన బంగారాన్ని నేరుగా సూచిస్తుంది.
theological_decisions:
- issue: హిజ్కియా ఒప్పుకోలులోని నైతిక బలం
  choice: ‘నేను తప్పు చేశాను’ అని అనువదించడం
  alternative: ‘నేను పాపం చేశాను’
  rationale: חטא పదానికి నైతిక బలం ఉన్నప్పటికీ, ఇక్కడ హిజ్కియా అష్షూరు రాజుతో రాజకీయంగా తన దోషాన్ని ఒప్పుకుంటున్నాడు. ‘తప్పు చేశాను’ ఆ సందర్భంలో సహజంగా ఉండి, ఒప్పుకోలును బలహీనపరచదు; ‘పాపం చేశాను’ అని అనువదిస్తే దేవునికి చేసిన మతపరమైన పాప ఒప్పుకోలుగా పాఠకుడు అధికంగా అర్థం చేసుకునే అవకాశం ఉంది.
- issue: విధించిన బాధ్యతను ఎంతవరకు నిర్దిష్టీకరించాలి
  choice: ‘ఎంత భారం మోపినా నేను భరిస్తాను’ అనే విస్తృత భాషను ఉంచడం
  alternative: ‘ఎంత కప్పం విధించినా నేను చెల్లిస్తాను’
  rationale: మూలపాఠం మోపడం, భరించడం అనే రూపకాన్ని వాడుతుంది. తరువాతి వాక్యం అది ధనరూప విధింపు అని స్పష్టం చేస్తుంది; కాబట్టి ప్రధాన పాఠంలోనే ‘కప్పం’ లేదా ‘జరిమానా’ అని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజసంబంధ ప్రత్యక్ష సంభాషణలో మూలంలోని ఏకవచన సంబోధనను ప్రతిబింబించేందుకు ‘నువ్వు’ వాడబడింది. ‘తలాంతు’ అనే సాంప్రదాయ బరువు ప్రమాణాన్ని నిలుపుకున్నాం; వాక్య నిర్మాణం మాత్రం సాధారణ ఆధునిక పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది.
