revisions:
- from: అప్పుడు యూదా రాజైన హిజ్కియా లాకీషులో ఉన్న[a] అష్షూరు రాజుకు కబురు పంపించి, “నేను తప్పు చేశాను. నా మీదికి రావడం మానుకొని వెనక్కి వెళ్లిపో. నువ్వు నా మీద ఎంత భారం మోపినా[b] నేను భరిస్తాను” అని చెప్పాడు. అప్పుడు అష్షూరు రాజు యూదా రాజైన హిజ్కియా మీద మూడు వందల తలాంతుల వెండిని, ముప్పై తలాంతుల బంగారాన్ని విధించాడు.
  to: అప్పుడు యూదా రాజైన హిజ్కియా లాకీషులో ఉన్న[a] అష్షూరు రాజుకు కబురు పంపించి, “నేను తప్పు చేశాను. నన్ను విడిచి వెనుదిరుగు. నువ్వు నాపై ఏది మోపినా[b] నేను భరిస్తాను” అని చెప్పాడు. అప్పుడు అష్షూరు రాజు యూదా రాజైన హిజ్కియాపై మూడు వందల తలాంతుల వెండిని, ముప్పై తలాంతుల బంగారాన్ని విధించాడు.
