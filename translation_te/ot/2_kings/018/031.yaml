  to: 'హిజ్కియా మాట వినకండి. ఎందుకంటే అష్షూరు రాజు ఇలా అంటున్నాడు: “నాతో సంధి చేసుకోండి[a], నా దగ్గరకు బయటకు రండి. ప్రతి ఒక్కరూ తమ ద్రాక్షతీగ నుండి, తమ అంజూరపు చెట్టు నుండి తిని, తమ నీటి తొట్టిలోని నీటిని తాగండి.”'
  rationale: సంధి అనే సందర్భానుగుణ అనువాదాన్ని, దాని అక్షరార్థాన్ని తెలిపే పాదసూచికను నిలిపాం. క్రియలను మూలంలోని ఆజ్ఞార్థక బలంతో ఇచ్చాం; ద్రాక్షతీగ, అంజూరపు చెట్టు అనే మూల పదాలకు ‘పండ్లు’ను జోడించకుండా, తెలుగులో సహజమైన ‘... నుండి తిని’ నిర్మాణాన్ని వాడాం. ముట్టడి సందర్భంలో అంతర్లీనంగా ఉన్న లొంగుబాటును ప్రధాన పాఠ్యంలో అదనంగా వివరించలేదు.
