  variant: modern standard Telugu
source:
  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: te
  text: 'హిజ్కియా మాట వినకండి. ఎందుకంటే అష్షూరు రాజు ఇలా అంటున్నాడు: “నాతో సంధి చేసుకోండి[a], నా దగ్గరకు బయటకు రండి. ప్రతి ఒక్కరూ తమ ద్రాక్షతీగ నుండి, తమ అంజూరపు చెట్టు నుండి తిని, తమ నీటి తొట్టిలోని నీటిని తాగండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నాతో ఒక ఆశీర్వాదం చేయండి.” ఇది సంధి చేసుకోవడం లేదా ఒప్పందానికి రావడం అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: మాట వినకండి
  rationale: שׁמע אֶל అంటే ఒకరి మాట వినడం లేదా దాన్ని ఆలకించడం. ఇక్కడ ‘మాట వినకండి’ అనేది సహజమైన తెలుగులో తక్షణ భావాన్ని ఇస్తుంది; ‘లోబడకండి’ అని అర్థాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: כִּי כֹה אָמַר
  choice: ఎందుకంటే ... ఇలా అంటున్నాడు
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హీబ్రూ సూత్రవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టంగా, సహజంగా అందించే రూపం.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: నాతో సంధి చేసుకొని
  rationale: అక్షరార్థంగా ‘నాతో ఒక ఆశీర్వాదం చేయండి’ అనే అసాధారణ రాజకీయ నుడికారం ఇక్కడ అనుకూల ఒప్పందం లేదా సంధి చేసుకోవడాన్ని సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּצְאוּ אֵלַי
  choice: నా దగ్గరికి బయటకు రండి
  rationale: ముట్టడి సందర్భంలో లొంగిపోవడం అంతర్లీనంగా ఉన్నా, יצא అనే క్రియలోని ‘బయటకు రావడం’ అనే ప్రత్యక్ష చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: మీలో ప్రతి ఒక్కరూ తమ తమ ద్రాక్షతీగ పండ్లను, తమ తమ అంజూరపు చెట్టు పండ్లను
  rationale: אִישׁ ఇక్కడ విభాజక అర్థంలో ఉంది. తెలుగులో ‘ప్రతి ఒక్కరూ తమ తమ’ అనే రూపం వ్యక్తిగత స్వాధీనతను, పునరుక్తి బలాన్ని సహజంగా చూపుతుంది; ‘పండ్లు’ అనేది తినడంలో అంతర్లీనమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מֵי בוֹרוֹ
  choice: తమ తమ నీటి తొట్టిలోని నీళ్లు
  rationale: בּוֹר ఇక్కడ ఊటగల బావికంటే నీటిని నిల్వచేసే తొట్టిని సూచిస్తుంది; అందుకే ‘నీటి తొట్టి’ ఎంచుకున్నాం.
theological_decisions:
- issue: అనేకసార్లు వచ్చిన విభాజక నామవాచకం אִישׁ
  choice: మీలో ప్రతి ఒక్కరూ ... తమ తమ
  alternative: ప్రతి మనిషి తన
  rationale: హీబ్రూలో పురుష ఏకవచన రూపం విభాజకంగా, సమూహంలోని ఒక్కొక్కరిని సూచిస్తుంది. తెలుగులో ‘ప్రతి ఒక్కరూ ... తమ తమ’ అనే గౌరవ బహువచన నిర్మాణం లింగాన్ని అనవసరంగా పరిమితం చేయకుండా ఆ విభాజక, ప్రతినిధి భావాన్ని కాపాడుతుంది.
- issue: రాజకీయ నుడికారం עֲשׂוּ אִתִּי בְרָכָה
  choice: నాతో సంధి చేసుకొని
  alternative: నాతో ఒక ఆశీర్వాదం చేయండి
  rationale: సందర్భంలో ఇది అష్షూరు రాజుతో అనుకూల నిబంధనలకు రావాలనే పిలుపు. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా ఇచ్చి, హీబ్రూ అసాధారణ పదప్రయోగాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ప్రసంగ శైలిని వాడాం. ముట్టడి సందర్భంలోని ప్రచార స్వరాన్ని నిలిపి, ‘లొంగిపోండి’ అనే వివరణాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు. పాదసూచిక గుర్తును అది వివరించే ‘సంధి చేసుకొని’ అన్న పదబంధం వెంట ఉంచాం.
