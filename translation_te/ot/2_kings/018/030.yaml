source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: te
  text: హిజ్కియా, “యాహ్వే మనల్ని తప్పకుండా రక్షిస్తాడు[a]; ఈ పట్టణం అష్షూరు రాజు చేతికి అప్పగించబడదు” అని చెబుతూ, మిమ్మల్ని యాహ్వేపై నమ్మకం ఉంచేలా చేయనివ్వకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో అక్షరార్థంగా, “రక్షిస్తూ ఆయన మనల్ని రక్షిస్తాడు”; ఇది “ఆయన మనల్ని తప్పకుండా రక్షిస్తాడు” అనే ఉద్ఘాటనను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: నమ్మకం పెట్టుకునేలా మిమ్మల్ని చేయనివ్వకండి
  rationale: בטח అనే క్రియ హిఫీల్ రూపంలో కర్మతో వచ్చి, ఇతరులు నమ్మేలా చేయడం అనే కారణార్థాన్ని ఇస్తుంది. తెలుగు వాక్యం ఆ కారణార్థాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: אֶל יְהוָה
  choice: యాహ్వేపై
  rationale: אֶל అనే ఉపసర్గ בטחతో కలిసి ఇక్కడ ‘ఎవరిపై నమ్మకం పెట్టుకోవడం’ అనే సహజ తెలుగు భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: לֵאמֹר
  choice: అని చెబుతూ
  rationale: హిజ్కియా చెప్పిన మాటలను పరిచయం చేసే ఉల్లేఖన రూపాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: మనల్ని తప్పకుండా రక్షిస్తాడు
  rationale: క్రియార్థక నామరూపం, సమాపక క్రియ కలయిక ఇచ్చే ఉద్ఘాటనను ‘తప్పకుండా’ అనే పదంతో తెలియజేసింది.
- source_word: וְלֹא תִנָּתֵן
  choice: అప్పగించబడదు
  rationale: נתן కర్మణి రూపం ఇక్కడ పట్టణం శత్రువు అధీనానికి ఇవ్వబడటాన్ని సూచిస్తుంది.
- source_word: הָעִיר הַזֹּאת
  choice: ఈ పట్టణం
  rationale: నామవాచకం, సూచన సర్వనామం కలయికకు సహజమైన తెలుగు రూపం.
- source_word: בְּיַד
  choice: చేతికి
  rationale: అధీనంలోకి వెళ్లడాన్ని సూచించే హెబ్రీయుల ‘చేతిలో/చేతికి’ నుడికారాన్ని తెలుగులో కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: ప్రాచీన సామ్రాజ్యమైన אַשּׁוּר పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలియజేస్తుంది.
- issue: రక్షణ వాగ్దానంలోని ఉద్ఘాటన
  choice: తప్పకుండా రక్షిస్తాడు
  alternative: రక్షిస్తూ రక్షిస్తాడు
  rationale: హెబ్రీయులోని infinitive absolute + finite verb నిర్మాణాన్ని అసహజమైన పదానువాదంగా కాకుండా, దాని నిశ్చయార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; ఇది ఇక్కడ రబ్షాకే ఉటంకిస్తున్న హిజ్కియా మాట, కథకుడి స్వతంత్ర ప్రకటన కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హిబ్రీ కారణార్థాన్ని నిలుపుటకు చివరి భాగంలో ‘చేయనివ్వకండి’ వాడబడింది. ఉద్ఘాటనకు సంబంధించిన పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
