source:
  edition: WLC
  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: te
  text: దేశాల దేవుళ్లందరిలో ఎవరు తమ దేశాన్ని నా చేతిలోనుండి రక్షించారు? యాహ్వే యెరూషలేమును నా చేతిలోనుండి రక్షిస్తాడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దేశాల దేవుళ్లందరిలో తమ దేశాన్ని నా చేతిలోనుండి రక్షించినవారు ఎవరు? అలాంటప్పుడు యాహ్వే యెరూషలేమును నా చేతిలోనుండి రక్షిస్తాడా?”'
    reason: כִּיతో మొదలయ్యే చివరి భాగాన్ని ముందటి ప్రశ్ననుంచి ఉత్పన్నమయ్యే ఫలితార్థక/సవాలార్థక ప్రశ్నగా స్పష్టపరచే ప్రత్యామ్నాయ నిర్మాణం.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: దేశాల దేవుళ్లందరిలో ఎవరు
  rationale: בְּכָל అనే భాగస్వామ్య భావాన్ని ‘అందరిలో’ సహజంగా తెలియజేస్తుంది; אֲרָצוֹת ఇక్కడ భిన్న దేశాలను సూచిస్తుంది.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: తమ దేశాన్ని ... విడిపించారు
  rationale: נצל యొక్క రక్షణ/విమోచన భావాన్ని సైనిక సందర్భంలో ‘విడిపించారు’గా ఇచ్చాం. బహువచన ప్రత్యయాన్ని పంపిణీయ భావంతో ‘తమ దేశాన్ని’గా నిలిపాం.
- source_word: מִיָּדִי
  choice: నా చేతిలోనుండి
  rationale: అధికారం, ఆధీనత అనే హీబ్రూ రూపకాన్ని తెలుగులో పారదర్శకంగా నిలుపుతుంది.
- source_word: כִּי יַצִּיל
  choice: విడిపిస్తాడా?
  rationale: రబ్షాకే యొక్క ఎగతాళితో కూడిన సవాలును తెలుగులో సహజమైన ప్రత్యక్ష ప్రశ్నగా వ్యక్తం చేస్తుంది; imperfect యొక్క భవిష్యత్/సంభావ్య ఛాయను సందర్భమే తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: తెలుగులో స్థిరపడిన ప్రదేశనామ రూపాన్ని వాడాం.
theological_decisions:
- issue: יְהוָה దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నిలిపాం; తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: చివరి ప్రశ్నలోని כִּי మరియు imperfect యొక్క బలం
  choice: యెహోవా ... విడిపిస్తాడా?
  alternative: యెహోవా ... విడిపించగలడా? / విడిపిస్తాడని అనుకోవాలా?
  rationale: సామర్థ్యాన్ని స్పష్టంగా చేర్చకుండా, మూలంలోని భవిష్యత్ చర్యపై సవాలును మరియు దాని వాక్చాతుర్య ఉద్రేకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. రబ్షాకే యొక్క హేళనాత్మక సవాలు రెండు అనుసంధాన ప్రశ్నలుగా సహజంగా వ్యక్తమైంది; మూలంలోని ‘చేతి’ రూపకం నిలుపబడింది.
