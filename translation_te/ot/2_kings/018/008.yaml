  text: הֽוּא הִכָּ֧ה אֶת פְּלִשְׁתִּ֛ים עַד עַזָּ֖ה וְ/אֶת גְּבוּלֶ֑י/הָ מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: te
  text: అతడు ఫిలిష్తీయులను గాజా వరకూ, దాని ప్రాంతంతో సహా[a], కావలివారి గోపురం మొదలుకొని ప్రాకార పట్టణం వరకూ[b] ఓడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని సరిహద్దులతో సహా.” హీబ్రూ పదం సరిహద్దు రేఖలను గానీ, ఒక పట్టణానికి చెందిన ప్రాంతాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “కావలివారి గోపురం మొదలుకొని ప్రాకార పట్టణం వరకూ” అనే హీబ్రూ ప్రయోగం, చిన్న కావలి స్థావరం నుంచి రక్షణగల పెద్ద పట్టణం వరకు అన్నింటినీ సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא
  choice: అతడు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న కర్తృ సర్వనామాన్ని కథనంలోని ఉద్ఘాటన కోసం నిలిపాం.
- source_word: הִכָּה
  choice: ఓడించాడు
  rationale: נכה అంటే ప్రాథమికంగా ‘కొట్టు’; సైనిక సందర్భంలో అది ‘దాడిచేసి ఓడించు’ అనే అర్థాన్ని ఇస్తుంది. తెలుగులో సహజమైన సైనిక ప్రయోగంగా ‘ఓడించాడు’ ఎంచుకున్నాం; సంహరించాడని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను
  rationale: ఈ జాతిపేరుకు తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: עַד עַזָּה
  choice: గాజా వరకూ
  rationale: עַד సూచించే భౌగోళిక విస్తృతిని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: దాని ప్రాంతంతో సహా
  rationale: גְּבוּל అనే పదం సరిహద్దును గానీ, నగరానికి చెందిన ప్రాంతాన్ని గానీ సూచించగలదు. సందర్భంలో ప్రాంతం ప్రధాన భావంగా కనిపించినా, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: కావలివారి గోపురం మొదలుకొని
  rationale: మూలంలోని ఏకవచన ‘గోపురం’ను, కాపలా కాసేవారిని సూచించే נוֹצְרִים భావాన్ని నిలిపాం.
- source_word: עַד עִיר מִבְצָר
  choice: ప్రాకార పట్టణం వరకూ
  rationale: రక్షణ కట్టడాలున్న పట్టణాన్ని ఆధునిక, సంక్షిప్త తెలుగులో సూచిస్తుంది; ముందున్న గోపురంతో కలిసి మొత్తం నివాస పరిధిని తెలియజేస్తుంది.
