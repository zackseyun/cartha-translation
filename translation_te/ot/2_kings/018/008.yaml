translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ప్రాకార పట్టణం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, రక్షణగల నగరం అనే మూలభావాన్ని సంక్షిప్తంగా అందిస్తుంది.
