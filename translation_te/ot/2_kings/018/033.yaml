source:
  edition: WLC
  text: הַ/הַצֵּ֥ל הִצִּ֛ילוּ אֱלֹהֵ֥י הַ/גּוֹיִ֖ם אִ֣ישׁ אֶת אַרְצ֑/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: te
  text: జనాంగాల దేవుళ్లలో ఒక్కొక్క దేవుడైనా తన దేశాన్ని అష్షూరు రాజు చేతిలోనుండి నిజంగా విడిపించాడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో క్రియను బలంగా నొక్కిచెప్పే నిర్మాణం ఉంది; అక్షరార్థానికి దగ్గరగా, ‘విడిపించడమే విడిపించారా?’ అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: నిజంగా విడిపించాడా?
  rationale: నצל క్రియ యొక్క infinitive absolute మరియు finite verb కలయిక క్రియను బలంగా నొక్కి చెబుతుంది. ప్రశ్నార్థక సందర్భంలో సవాలుతో కూడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘నిజంగా ... విడిపించాడా?’ అని వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: జనాల దేవుళ్లు
  rationale: బహువచన construct రూపాన్ని నేరుగా నిలుపుతూ, వివిధ జనాలకు చెందిన దేవుళ్లను సూచిస్తుంది. ‘జనాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని peoples/nations భావాన్ని అందిస్తుంది.
- source_word: אִישׁ
  choice: ఒక్కొక్క దేవుడైనా
  rationale: ఇక్కడ אִישׁ పురుష వ్యక్తిని సూచించకుండా పంపిణీ భావంలో ఉంది. ‘ఒక్కొక్క దేవుడైనా’ ప్రతి దేవుణ్ణి విడివిడిగా పరిగణించే భావాన్నీ, అలంకారిక ప్రశ్నలోని సవాలునూ స్పష్టంగా అందిస్తుంది.
- source_word: אֶת אַרְצוֹ
  choice: తన దేశాన్ని
  rationale: పంపిణీ ఏకవచన ప్రత్యయం ప్రతి దేవునికి సంబంధించిన దేశాన్ని సూచిస్తుంది. తెలుగులో ‘తన దేశాన్ని’ ఈ సంబంధాన్ని సహజంగా, వ్యక్తీకరణను నిలుపుతూ తెలియజేస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా పట్టులోనుండి రక్షించడాన్ని సూచించే హీబ్రూ శరీరావయవ రూపకాన్ని నిలుపుతుంది; తెలుగు బైబిలు శైలిలోనూ ఇది పారదర్శకంగా ఉంటుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ construct వ్యక్తీకరణకు నేరమైన, సహజమైన తెలుగు రూపం.
