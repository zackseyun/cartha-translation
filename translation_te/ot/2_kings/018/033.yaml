  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ప్రశ్నారూపం వాడబడింది. అష్షూరు ప్రతినిధి పలికిన ఎగతాళితో కూడిన అలంకారిక సవాలును ‘ఒక్కొక్క దేవుడైనా’ మరియు ‘నిజంగా’ ద్వారా నిలిపాం; మూలంలోని ‘చేతి’ రూపకాన్ని కూడా ఉంచాం.
