source:
  edition: WLC
  text: וַ/יֶּ֧גֶל מֶֽלֶךְ אַשּׁ֛וּר אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יַּנְחֵ֞/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: te
  text: అష్షూరు రాజు ఇశ్రాయేలును అష్షూరుకు చెరగా తరలించి, వారిని హలహులో, గోజాను నది అయిన హాబోరు వద్ద[a], మాదీయుల పట్టణాల్లో నివసింపజేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హాబోరు వద్ద, గోజానులో.” హాబోరు, గోజాను అనే స్థలనామాల మధ్య సంబంధాన్ని హీబ్రూ వాక్యనిర్మాణం ఒకటి కంటే ఎక్కువ విధాలుగా అన్వయించడానికి వీలిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “ఇశ్రాయేలు” అనేది ఉత్తర రాజ్యాన్ని, చెరగా తరలించబడిన దాని ప్రజలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: చెరగా తరలించి
  rationale: హిఫీల్ రూపం బలవంతంగా స్వదేశం నుండి చెరలోకి తరలించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, రాజకీయ సందర్భం స్పష్టంగా ఉంటుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ఇక్కడ ఉత్తర రాజ్యాన్ని, దాని ప్రజలను సమష్టిగా సూచించే రాజకీయ-జాతీయ నామాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: אַשּׁוּרָה
  choice: అష్షూరుకు
  rationale: దిశను సూచించే ప్రత్యయ భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּנְחֵם
  choice: వారిని ... నివసింపజేశాడు
  rationale: బహిష్కృతులను నిర్ణీత ప్రాంతాల్లో స్థిరపరచిన కారణార్థక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּחְלַח
  choice: హలహులో
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యంతరీకరణలో అందిస్తుంది.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: గోజాను నది అయిన హాబోరు ఒడ్డున
  rationale: హాబోరును గోజానుతో సంబంధమున్న నదిగా గుర్తించే అన్వయాన్ని నిలుపుతూ, నది సమీప నివాసాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְעָרֵי מָדָי
  choice: మాదీయుల పట్టణాల్లో
  rationale: మాదీయుల ప్రాంతంలోని పట్టణాలు అనే హీబ్రూ సమాస భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు అనే పదం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు’ అనే సమష్టి నామాన్ని నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు’ అని ప్రజలను మాత్రమే స్పష్టీకరించడం
  rationale: మూలంలో ఉన్న రాజకీయ రాజ్యం–ప్రజలు అనే సమష్టి సూచనను అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది; వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘చెరగా తరలించి’ బలవంతపు దేశబహిష్కరణను స్పష్టం చేస్తుంది; భౌగోళిక అన్వయంలోని నిజమైన సందిగ్ధతను [a] పాదటిప్పణి కాపాడుతుంది.
