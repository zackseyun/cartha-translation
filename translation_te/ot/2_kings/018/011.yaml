  to: అష్షూరు రాజు ఇశ్రాయేలును అష్షూరుకు చెరగా తరలించి, వారిని హలహులో, గోజాను నది అయిన హాబోరు వద్ద[a], మాదీయుల పట్టణాల్లో నివసింపజేశాడు.[b]
