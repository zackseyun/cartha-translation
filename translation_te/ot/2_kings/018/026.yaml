source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: te
  text: 'అప్పుడు హిల్కీయా కుమారుడైన ఎల్యాకీము, షెబ్నా, యోవాహు రబ్షాకేతో ఇలా అన్నారు: “దయచేసి మీ సేవకులమైన మాతో అరామీ భాషలో మాట్లాడండి; అది మాకు అర్థమవుతుంది. ప్రాకారంపై ఉన్న ప్రజలు వింటుండగా మాతో యూదా భాషలో[a] మాట్లాడవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హీబ్రూ భాషలో.’ ఇక్కడి హీబ్రూ పదం יְהוּדִית (యెహూదీత్); అక్షరార్థంగా ఇది యూదా ప్రాంతపు భాషను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: రబ్షాకే
  rationale: ఇది అష్షూరు రాజసభలోని ఒక పదవీబిరుదు. ఆ పదవి యొక్క కచ్చితమైన విధి స్పష్టంగా లేనందున ఊహాత్మక అర్థాన్ని చేర్చకుండా బిరుదును లిప్యంతరీకరించాం.
- source_word: דַּבֶּר נָא
  choice: దయచేసి … మాట్లాడండి
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన נָא మర్యాదపూర్వక అభ్యర్థనను సూచిస్తుంది; ఆధునిక తెలుగులో దాని భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులమైన మాతో
  rationale: ఈ దౌత్య సందర్భంలో עבד అనేది బానిసత్వాన్ని ప్రధానంగా సూచించకుండా, తమను తాము తగ్గించుకొని మాట్లాడే రాజసభా ప్రయోగం. ‘మాతో’ అనేది ఉద్దేశిత వ్యక్తులను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אֲרָמִית
  choice: అరామీ భాషలో
  rationale: ఇక్కడ ఈ రూపం మాట్లాడవలసిన భాషను సూచిస్తుంది; ‘అరామీ భాషలో’ అనేది స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: అది మాకు అర్థమవుతుంది
  rationale: שׁמע అనే క్రియకు ‘విను’ లేదా ‘అర్థం చేసుకో’ అనే అర్థాలు ఉండవచ్చు. భాషా పరిజ్ఞానం గురించిన ఈ సందర్భంలో ‘అర్థమవుతుంది’ ఉద్దేశిత భావాన్ని అందిస్తుంది.
- source_word: יְהוּדִית
  choice: యూదా భాషలో
  rationale: ఈ పదం సాంకేతిక భాషాశాస్త్ర పదంగా ‘హీబ్రూ’ అని తప్పనిసరిగా కాకుండా, యూదా ప్రాంతపు భాషను సూచిస్తుంది. ‘యూదా భాష’ మూలంలోని ప్రాంతీయ సూచనను నిలుపుతుంది.
- source_word: בְּאָזְנֵי
  choice: వినిపించేలా
  rationale: అక్షరార్థంగా ‘చెవుల్లో’ అనే ఈ నుడికారం ప్రజలు వినగలిగే విధంగా మాట్లాడడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘వినిపించేలా’ శ్రవణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: ప్రాకారం మీద ఉన్న ప్రజలు
  rationale: మూలంలో ‘ప్రజలు’ అనే సాధారణ పదమే ఉంది; వారిని సైనికులుగా పరిమితం చేయకుండా సంబంధ వాక్య భావాన్ని నిలిపాం.
- source_word: וַיֹּאמֶר ... אֶל
  choice: అప్పుడు … తో ఇలా అన్నారు
  rationale: వావ్-కాన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. పలువురు వ్యక్తులు మాట్లాడుతున్నందున తెలుగులో బహువచన క్రియను వాడాం.
