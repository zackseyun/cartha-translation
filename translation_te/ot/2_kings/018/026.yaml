translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దౌత్య సంభాషణ శైలిని వాడాం. అధికారి ఒక్కరే అయినప్పటికీ, మర్యాదను వ్యక్తపరచడానికి తెలుగు గౌరవ బహువచనాన్ని ఉపయోగించాం. మూలంలోని ‘యూదా భాష’ అనే ప్రాంతీయ భాషా సూచనను ప్రధాన పాఠంలో నిలిపి, ‘హీబ్రూ’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
