  to: 'అప్పుడు హిల్కీయా కుమారుడైన ఎల్యాకీము, షెబ్నా, యోవాహు రబ్షాకేతో ఇలా అన్నారు: “దయచేసి మీ సేవకులమైన మాతో అరామీ భాషలో మాట్లాడండి; అది మాకు అర్థమవుతుంది. ప్రాకారంపై ఉన్న ప్రజలు వింటుండగా మాతో యూదా భాషలో[a] మాట్లాడవద్దు.”'
