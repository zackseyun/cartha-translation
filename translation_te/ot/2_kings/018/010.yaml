revisions:
- from: మూడు సంవత్సరాల ముగింపులో[a] వారు దాన్ని పట్టుకున్నారు. హిజ్కియా పాలనలో ఆరవ సంవత్సరంలో—అంటే ఇశ్రాయేలు రాజైన హోషేయ పాలనలో తొమ్మిదవ సంవత్సరంలో—షోమ్రోను పట్టుబడింది.
  to: మూడు సంవత్సరాలు ముగిసినప్పుడు[a] వారు దాన్ని పట్టుకున్నారు. హిజ్కియా పాలన ఆరవ సంవత్సరంలో, అదే ఇశ్రాయేలు రాజైన హోషేయ పాలన తొమ్మిదవ సంవత్సరంలో, షోమ్రోను పట్టుబడింది.
