source:
  edition: WLC
  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: te
  text: మూడు సంవత్సరాలు ముగిసినప్పుడు[a] వారు దాన్ని పట్టుకున్నారు. హిజ్కియా పాలన ఆరవ సంవత్సరంలో, అదే ఇశ్రాయేలు రాజైన హోషేయ పాలన తొమ్మిదవ సంవత్సరంలో, షోమ్రోను పట్టుబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూడు సంవత్సరాల తరువాత వారు దాన్ని పట్టుకున్నారు.” హెబ్రీ నుడికారం మరింత అక్షరార్థంగా “మూడు సంవత్సరాల ముగింపులో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: వారు దాన్ని పట్టుకున్నారు
  rationale: לכד అనే క్రియ యొక్క కర్తృవాచక బహువచన రూపాన్ని నిలుపుతూ, స్త్రీలింగ ఏకవచన ప్రత్యయం మునుపటి సందర్భంలోని షోమ్రోనును సూచిస్తుందని ‘దాన్ని’ ద్వారా తెలియజేస్తుంది.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాల ముగింపులో
  rationale: מקצה + కాలవ్యవధి అనే హెబ్రీ నుడికారంలోని ‘ఆ కాలవ్యవధి ముగింపులో’ అనే భావాన్ని సన్నిహితంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: హిజ్కియా పాలనలో ఆరవ సంవత్సరంలో
  rationale: రాజ్యపాలనా సంవత్సరాన్ని సూచించే సూత్రాన్ని తెలుగులో స్పష్టంగా తెలిపేందుకు ‘పాలనలో’ చేర్చబడింది.
- source_word: הִיא
  choice: అంటే
  rationale: రెండు రాజ్యపాలనా కాలగణనలను సమానకాలికంగా అనుసంధానించే సర్వనామపు వివరణాత్మక విధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన హోషేయ పాలనలో తొమ్మిదవ సంవత్సరంలో
  rationale: రెండవ రాజ్యపాలనా కాలసూచనను, అలాగే హోషేయకు ఇచ్చిన ‘ఇశ్రాయేలు రాజు’ అనే బిరుదును స్పష్టంగా నిలుపుతుంది.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: షోమ్రోను పట్టుబడింది
  rationale: నిఫాల్ స్త్రీలింగ ఏకవచన రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, మొదటి వాక్యభాగంలోని לכד క్రియతో పదబంధ సంబంధాన్ని ‘పట్టు’ అనే అదే మూలపదం ద్వారా కాపాడుతుంది.
- source_word: שֹׁמְרוֹן
  choice: షోమ్రోను
  rationale: నగరనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాన్ని ఉపయోగిస్తుంది.
