  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. కర్తృవాచక మొదటి ప్రకటనను, కర్మణి ముగింపు ప్రకటనను హెబ్రీ వాక్యనిర్మాణానికి అనుగుణంగా వేరు వేరుగా నిలిపింది.
