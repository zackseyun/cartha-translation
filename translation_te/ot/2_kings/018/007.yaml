id: 2KI.18.7
reference: 2 Kings 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: te
  text: యెహోవా అతనికి తోడుగా ఉన్నాడు. అతడు చేపట్టిన ప్రతి కార్యంలో[a] సఫలమయ్యాడు. అతడు అష్షూరు రాజుపై తిరుగుబాటు చేసి, అతనికి సేవ చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఎక్కడికి వెళ్లినా”; లేదా, “అతడు చేసిన ప్రతిదానిలో జ్ఞానయుక్తంగా ప్రవర్తించాడు.” హీబ్రూ పదప్రయోగంలో జ్ఞానయుక్తమైన ప్రవర్తన, విజయం అనే రెండు భావాలూ ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన య్హ్వ్హ్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన రూపంలో నిలుపుతుంది.
- source_word: וְהָיָה ... עִמּוֹ
  choice: అతనికి తోడుగా ఉన్నాడు
  rationale: దేవుని నిరంతర సన్నిధి, అనుగ్రహం అనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: అతడు చేపట్టిన ప్రతి కార్యంలో
  rationale: అక్షరార్థంగా ‘అతడు బయలుదేరిన ప్రతిదానిలో’; రాజు చేపట్టిన కార్యాలు లేదా దండయాత్రలను సూచించే సందర్భోచిత నుడికారంగా అనువదించబడింది.
- source_word: יַשְׂכִּיל
  choice: సఫలమయ్యాడు
  rationale: హిఫీల్ రూపం జ్ఞానయుక్తంగా ప్రవర్తించడం, దాని ఫలంగా విజయం పొందడం అనే రెండు భావాలను కలిగి ఉంది; రాజవృత్తాంత సందర్భంలో ఫలితభావం ప్రధానంగా ఉంది.
- source_word: וַיִּמְרֹד
  choice: తిరుగుబాటు చేసి
  rationale: సామ్రాజ్యాధికారానికి వ్యతిరేకంగా రాజకీయంగా ఎదిరించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజుపై
  rationale: తిరుగుబాటు ఎవరికి వ్యతిరేకమో నేరుగా, సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: וְלֹא עֲבָדוֹ
  choice: అతనికి సేవ చేయలేదు
  rationale: వ్యక్తిని కర్మగా తీసుకున్న עבד యొక్క మూల ‘సేవచేయు’ భావాన్ని నిలుపుతూ, సందర్భంలో సామంత విధేయత లేదా కప్పం చెల్లింపును కూడా సూచించనిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. రాజకీయ సందర్భంలోని ‘సేవ’ అనే పదానికి సామంత విధేయత భావం సందర్భం ద్వారా నిలిచేలా మూలపాఠానికి సమీపంగా ఉంచబడింది.
