translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక కథనానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని సైనిక చర్యల క్రమాన్ని నిలిపి ఉంచుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా పదక్రమం అమర్చబడింది.
