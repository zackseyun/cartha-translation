source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗ה עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: te
  text: హిజ్కియా రాజు పరిపాలన పద్నాలుగవ సంవత్సరంలో, అష్షూరు రాజైన సన్హెరీబు యూదాలోని అన్ని కోట పట్టణాలపైకి దండెత్తి వచ్చి వాటిని స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: పద్నాలుగవ సంవత్సరంలో
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని సహజమైన తెలుగు రూపంలో అందించింది. ఆరంభంలోని וּ కథన అనుసంధానాన్ని సూచిస్తుంది; సందర్భంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: לַמֶּלֶךְ חִזְקִיָּה
  choice: హిజ్కియా రాజు పరిపాలనలో
  rationale: ఇది రాజ్యపాలనా సంవత్సరాన్ని సూచించే సూత్రబద్ధమైన ప్రయోగం; ‘హిజ్కియా రాజుకు’ అనే అక్షరార్థ రూపం కంటే ఈ తెలుగు రూపం భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָלָה ... עַל
  choice: మీదికి దండెత్తి వచ్చి
  rationale: עלה ప్రాథమికంగా ‘పైకి వెళ్లడం/రావడం’; עַל తో కూడిన సైనిక సందర్భంలో శత్రువుపై ముందుకు సాగడాన్ని సూచిస్తుంది. ‘దండెత్తి వచ్చి’ తెలుగు చారిత్రక కథనంలో సహజంగా ఆ సైనిక భావాన్ని ఇస్తుంది.
- source_word: סַנְחֵרִיב
  choice: సన్హెరీబు
  rationale: అష్షూరు రాజు పేరుకు మూలభాషను సమీపించే, తెలుగులో చదవదగిన లిప్యంతరీకరణ.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజైన
  rationale: సన్హెరీబు యొక్క రాజపదవిని, రాజ్యాన్ని తెలుగులో సహజమైన విశేషణ సంబంధంతో తెలిపింది.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: యూదాలోని ప్రాకారాలుగల పట్టణాలన్నిటి మీదికి
  rationale: הַבְּצֻרוֹת రక్షణార్థం బలపరచబడిన పట్టణాలను సూచిస్తుంది. ‘ప్రాకారాలుగల పట్టణాలు’ సాధారణ పాఠకుడికి స్పష్టమైన సైనిక అర్థాన్ని ఇస్తుంది.
- source_word: וַיִּתְפְּשֵׂם
  choice: వాటిని స్వాధీనం చేసుకున్నాడు
  rationale: תפשׂ ఇక్కడ యుద్ధంలో పట్టణాలను పట్టుకొని ఆధీనంలోకి తెచ్చుకోవడాన్ని సూచిస్తుంది; బహువచన ప్రత్యయం ‘వాటిని’ ముందున్న పట్టణాలను సూచిస్తుంది.
