- from: హిజ్కియా రాజు పరిపాలనలో పద్నాలుగవ సంవత్సరంలో, అష్షూరు రాజైన సన్హెరీబు యూదాలోని ప్రాకారాలుగల పట్టణాలన్నిటి మీదికి దండెత్తి వచ్చి వాటిని స్వాధీనం చేసుకున్నాడు.
