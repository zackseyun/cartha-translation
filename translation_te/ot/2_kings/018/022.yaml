reference: 2 Kings 18:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: te
  text: అయితే మీరు నాతో, ‘మేము మా దేవుడైన యెహోవాపై నమ్మకం ఉంచాము’ అని అంటే, హిజ్కియా ఆయన ఉన్నత స్థలాలనూ ఆయన బలిపీఠాలనూ తొలగించి, యూదాతోను యెరూషలేముతోను, ‘యెరూషలేములో ఈ బలిపీఠం ఎదుట మీరు సాగిలపడాలి’ అని చెప్పినవాడు ఆయనే కాదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטָחְנוּ
  choice: నమ్ముకున్నాం
  rationale: దేవునిపై ఆధారపడటం, భరోసా ఉంచటం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָּמוֹתָיו
  choice: ఆయన ఉన్నత స్థలాలు
  rationale: במה అనే ఆరాధనా స్థలానికి సంబంధించిన సాంకేతిక పదాన్ని నిలుపుతుంది; వక్త అవి యెహోవాకు చెందినవని భావిస్తున్న అపార్థాన్ని ‘ఆయన’ ద్వారా యథాతథంగా ఉంచుతుంది.
- source_word: מִזְבְּחֹתָיו
  choice: ఆయన బలిపీఠాలు
  rationale: మూలంలోని స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతూ, రబ్షాకే వాదనలోని దృష్టికోణాన్ని మార్చదు.
- source_word: תִּשְׁתַּחֲווּ
  choice: ఆరాధించాలి
  rationale: ఇక్కడ శారీరకంగా వంగి నమస్కరించడంకన్నా దేవారాధన సందర్భమే ప్రధానమైనందున సహజమైన సందర్భార్థాన్ని ఇస్తుంది.
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: ఈ బలిపీఠం ఎదుటే
  rationale: ‘ముందు/సన్నిధిలో’ అనే భావాన్ని సహజంగా ఇస్తూ, కేంద్రీకృత ఆరాధనపై ఉన్న ఉద్ఘాటనను ‘ఏ’తో తెలియజేస్తుంది.
theological_decisions:
- issue: యెహోవా నామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న יהוה అనే వ్యక్తినామాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది; సాధారణ బిరుదుతో కలిగే అస్పష్టతను నివారిస్తుంది.
- issue: ఉన్నత స్థలాలు, బలిపీఠాలు నిజంగా యెహోవావేనా అన్న వక్త దృక్కోణం
  choice: ‘ఆయన ఉన్నత స్థలాలు... ఆయన బలిపీఠాలు’ అని మూలంలోని వాదనను యథాతథంగా ఉంచడం
  alternative: అవి అక్రమ ఆరాధనా స్థలాలని వివరణాత్మకంగా మార్చడం
  rationale: ఇది రబ్షాకే చేసిన వ్యంగ్య వాదన; కథనకర్త దానిని సమర్థిస్తున్నట్లు గానీ సరిదిద్దుతున్నట్లు గానీ అనువాదం చేయకూడదు.
- issue: చివరి క్రియ యొక్క భావం
  choice: ‘ఆరాధించాలి’
  alternative: ‘సాగిలపడాలి’
  rationale: ఆరాధనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది; అయినా మూలంలోని నమస్కార/సాగిలపడే శారీరక భావం సందర్భంలో అంతర్లీనంగానే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. రబ్షాకే వ్యంగ్య ప్రశ్న స్వరం మరియు హిజ్కియా సంస్కరణను అతడు తప్పుగా అర్థం చేసుకున్న ఉద్రిక్తత నిలుపబడ్డాయి.
