- from: అయితే మీరు నాతో, ‘మేము మా దేవుడైన యెహోవాను నమ్ముకున్నాం’ అని అంటారేమో. అయితే హిజ్కియా తొలగించింది ఆయన ఉన్నత స్థలాలనూ ఆయన బలిపీఠాలనూ కాదా? అతడు యూదావారితో, యెరూషలేమువారితో, ‘యెరూషలేములోని ఈ బలిపీఠం ఎదుటే మీరు ఆరాధించాలి’ అని చెప్పలేదా?
  to: అయితే మీరు నాతో, ‘మేము మా దేవుడైన యెహోవాపై నమ్మకం ఉంచాము’ అని అంటే, హిజ్కియా ఆయన ఉన్నత స్థలాలనూ ఆయన బలిపీఠాలనూ తొలగించి, యూదాతోను యెరూషలేముతోను, ‘యెరూషలేములో ఈ బలిపీఠం ఎదుట మీరు సాగిలపడాలి’ అని చెప్పినవాడు ఆయనే కాదా?
  rationale: హీబ్రూ షరతు-ప్రశ్న నిర్మాణాన్ని పునరుద్ధరించాం; హిజ్కియాకు సంబంధించిన ‘తొలగించి ... చెప్పినవాడు’ అనే రెండు క్రియలను ఒకే సంబంధిత వర్ణనలో ఉంచాం. రబ్షాకే దృక్కోణాన్ని సూచించే స్వామ్యరూపాలను మార్చలేదు. చివరి క్రియను మూలానికి దగ్గరగా ‘సాగిలపడాలి’గా సవరించాం.
