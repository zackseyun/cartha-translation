id: 2KI.18.29
reference: 2 Kings 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: te
  text: 'రాజు ఇలా అంటున్నాడు: “హిజ్కియా మిమ్మల్ని మోసగించనివ్వకండి[a]. ఎందుకంటే అతడు మిమ్మల్ని అతని చేతిలో నుండి[b] విడిపించలేడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మిమ్మల్ని తప్పుదారి పట్టించనివ్వకండి.” హీబ్రూ క్రియకు తప్పుదారి పట్టించడం లేదా మోసగించడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “అతని చేతిలో నుండి”; ఇది ఒకరి అధికారం నుండి అని సూచించే నుడికారం. యెషయా 36:14లోని సమాంతర పాఠం “నా చేతిలో నుండి” అని చదువుతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: రాజు ఇలా అంటున్నాడు
  rationale: అధికారిక రాజప్రకటన సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: אַל יַשִּׁיא לָכֶם חִזְקִיָּהוּ
  choice: హిజ్కియా మిమ్మల్ని మోసం చేయనివ్వకండి
  rationale: హిఫీల్ రూపంలోని ‘తప్పుదారి పట్టించడం/మోసం చేయడం’ అనే భావాన్ని నిలుపుతూ, నిషేధార్థక వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי לֹא יוּכַל לְהַצִּיל אֶתְכֶם
  choice: ఎందుకంటే అతడు మిమ్మల్ని ... విడిపించలేడు
  rationale: כִּי ఇచ్చే కారణార్థాన్ని స్పష్టంగా చూపి, יכל మరియు הציל లోని అసమర్థత, ప్రమాదం లేదా అధికారంనుండి విడిపించడం అనే భావాలను కాపాడుతుంది.
- source_word: מִיָּדוֹ
  choice: అతని చేతిలోనుండి
  rationale: WLC పాఠంలోని మూడవ పురుష ఏకవచన ప్రత్యయాన్ని యథాతథంగా అనుసరించి, అధికారం కింద ఉండడాన్ని సూచించే హీబ్రూ నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: מִיָּדוֹ లోని ‘అతని’ ఎవరిని సూచిస్తుంది?
  choice: ‘అతని చేతిలోనుండి’ అని WLC పాఠాన్ని అనుసరించి అనువదించడం
  alternative: యెషయా 36:14 సమాంతర పాఠం ప్రకారం ‘నా చేతిలోనుండి’; లేదా నుడికారాన్ని విప్పి ‘అతని అధికారం నుండి’
  rationale: ఇచ్చిన హీబ్రూ మూలపాఠంలో మూడవ పురుష ఏకవచనం ఉంది. దాన్ని యెషయా సమాంతర వాక్యంతో సమన్వయపరచకుండా పాఠంలోని నిజమైన భేదాన్ని పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. రాజప్రకటన ధోరణిని కాపాడుతూ అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. సంబోధన బహువచనాన్ని ‘మిమ్మల్ని’ ద్వారా స్పష్టంగా ఉంచాం.
