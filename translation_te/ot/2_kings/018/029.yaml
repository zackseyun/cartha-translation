    issue: Less idiomatic verb phrase for deceive
    rationale: “మిమ్మల్ని మోసం చేయనివ్వకండి” is understandable, but “మిమ్మల్ని మోసగించనివ్వకండి” is more idiomatic and direct in modern standard Telugu while preserving the causative sense of נשׁא.
