source:
  edition: WLC
  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: te
  text: అతడు యాహ్వేను దృఢంగా అంటిపెట్టుకున్నాడు[a]; ఆయనను అనుసరించడం మానలేదు; యాహ్వే మోషేకు ఆజ్ఞాపించిన ఆజ్ఞలను పాటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ‘అతుక్కొని ఉన్నాడు’ లేదా ‘గట్టిగా పట్టుకున్నాడు’ అని కూడా అర్థం చెప్పవచ్చు; ఇక్కడ అది బలమైన నిబంధన విశ్వాసనిష్ఠను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: దృఢంగా హత్తుకొని ఉన్నాడు
  rationale: דבק అనే క్రియ బలమైన అనుబంధాన్ని సూచిస్తుంది; ఈ నిబంధన సందర్భంలో అది కేవలం భౌతికంగా అతుక్కోవడం కాక, యాహ్వేపట్ల స్థిరమైన విశ్వాసనిష్ఠను వ్యక్తం చేస్తుంది.
- source_word: בַּיהוָה
  choice: యాహ్వేను
  rationale: בְ ఉపసర్గ ఇక్కడ అనుబంధం ఎవరిపట్ల ఉందో సూచిస్తుంది. יְהוָה అనే దేవుని నిబంధన నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: ఆయనను అనుసరించడం నుండి తొలగిపోలేదు
  rationale: סור מן־אחרי అనే నిర్మాణం ఒకరిని అనుసరించే మార్గం నుంచి తప్పుకోవడం లేదా విశ్వాసనిష్ఠను విడిచిపెట్టడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యం ఆ అనుసరణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּשְׁמֹר
  choice: పాటించాడు
  rationale: ఆజ్ఞలతో వాడినప్పుడు שׁמר అంటే వాటిని కాపాడటం అనే అక్షరార్థం కంటే ఆచరించడం లేదా పాటించడం అని అర్థం.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: מִצְוֹתָיו అనేది యాహ్వేకు చెందిన ఆజ్ఞలను సూచిస్తుంది; ‘ఆజ్ఞలు’ సహజమైన ఆధునిక తెలుగు న్యాయ-నిబంధన పదప్రయోగం.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించిన
  rationale: ఈ సంబంధవాక్యం హిజ్కియా పాటించిన ఆజ్ఞలు మోషేకు యాహ్వే ఇచ్చినవేనని గుర్తిస్తుంది. తెలుగు నిర్మాణం కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నిబంధన దైవనామమైన చతురక్షర నామం నేరుగా ఉంది. దాని వ్యక్తిగత నామ స్వభావాన్ని నిలుపుకోవడానికి ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: דבק క్రియలోని నిబంధన విశ్వాసనిష్ఠ భావం
  choice: దృఢంగా హత్తుకొని ఉన్నాడు
  alternative: అంటిపెట్టుకొని ఉన్నాడు; కలిసివున్నాడు
  rationale: ఈ రూపకం హిజ్కియా యాహ్వేతో కొనసాగించిన బలమైన అనుబంధాన్ని, విశ్వాసనిష్ఠను సూచిస్తుంది. అనువాదం ఆ రూపకాన్ని నిలుపుతూ దాని తీవ్రతను ‘దృఢంగా’తో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘దృఢంగా హత్తుకొని ఉన్నాడు’ అనే రూపకం మూలంలోని బలమైన అనుబంధాన్ని నిలుపుతుంది; ‘అనుసరించడం నుండి తొలగిపోలేదు’ అనే పదబంధం హీబ్రూ వాక్యనిర్మాణంలోని అనుసరణ, విశ్వాసనిష్ఠ భావాలను కాపాడుతుంది.
