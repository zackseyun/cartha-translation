  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా గ్రహించగల కథనశైలిని వాడాం. విదేశీ అధికార బిరుదుల విషయంలో అనిశ్చితిని లిప్యంతరీకరణతో నిలిపి, హీబ్రూ పునరుక్తిని పూర్తిగా తొలగించలేదు.
