  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజు లాకీషు నుండి తర్తాను[a], రబ్‌-సారీసు, రబ్‌-షాకేలను గొప్ప సైన్యంతో యెరూషలేములోని హిజ్కియా రాజు దగ్గరికి పంపాడు. వారు యెరూషలేముకు ఎక్కివచ్చారు; వారు ఎక్కి వచ్చి, చాకలి వాని పొలపు రాజమార్గంలో ఉన్న ఎగువ కోనేరు కాలువ దగ్గర నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తర్తాను,’ ‘రబ్‌-సారీసు,’ ‘రబ్‌-షాకే’ అనేవి వ్యక్తుల పేర్లు కాకుండా అష్షూరీయ అధికార బిరుదులై ఉండవచ్చు. వాటికి వరుసగా ‘ప్రధాన సేనాధిపతి,’ ‘ముఖ్య ఆస్థానాధికారి లేదా ప్రధాన నపుంసకుడు,’ ‘ముఖ్య పానదాయకుడు లేదా మరొక ఉన్నతాధికారి’ అనే అర్థాలు సూచించబడ్డాయి.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: తర్తాను / రబ్‌-సారీసు / రబ్‌-షాకే
  rationale: ఇవి వ్యక్తుల పేర్లకంటే అష్షూరీయ అధికార బిరుదులై ఉండే అవకాశం ఎక్కువ. ఆయా పదవుల ఖచ్చిత విధులు అనిశ్చితంగా ఉన్నందున ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: בְּחֵיל כָּבֵד
  choice: గొప్ప సైన్యంతో
  rationale: ఇక్కడ חַיִל సైనిక బలగాన్ని, כָּבֵד దాని విస్తారతను సూచిస్తాయి. ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ ... וַיַּעֲלוּ וַיָּבֹאוּ
  choice: వారు ... ఎక్కివచ్చారు; వారు ఎక్కివచ్చి
  rationale: యెరూషలేముకు ఎక్కివెళ్లే భావాన్నీ, హీబ్రూ కథనంలోని ఉద్దేశపూర్వక పునరుక్తినీ నిలిపింది.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: ఎగువ కోనేరు నీటి కాలువ
  rationale: תְעָלָה నీరు ప్రవహించే కాలువను, בְּרֵכָה నీటి కోనేరు లేదా జలాశయాన్ని సూచిస్తాయి; స్థలవివరాన్ని స్పష్టంగా ఉంచే సహజ తెలుగు.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: చాకలివాని పొలానికి వెళ్లే రాజమార్గం
  rationale: מְסִלָּה నిర్మిత ప్రధాన మార్గాన్ని సూచిస్తుంది; כּוֹבֵס బట్టలు ఉతికే లేదా శుభ్రపరచే వృత్తివానిని సూచిస్తుంది. తెలుగు పాఠకులకు అర్థమయ్యే స్థలసంబంధ నిర్మాణంగా అనువదించాం.
