  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִ֖י בַּת זְכַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: te
  text: అతడు రాజుగా పరిపాలించడం ప్రారంభించినప్పుడు అతనికి ఇరవై ఐదు సంవత్సరాలు. అతడు యెరూషలేములో ఇరవై తొమ్మిది సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు అబీ; ఆమె జెకర్యా కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ఇరవై ఐదు సంవత్సరాలవాడు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: הָיָה בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: ఈ నిర్మాణం సింహాసనాన్ని అధిష్ఠించిన సమయాన్ని సూచిస్తుంది; తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలన సాగించడాన్ని స్పష్టంగా తెలియజేసే సహజ తెలుగు క్రియ.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పాలన సాగిన స్థలాన్ని సూచించే సాధారణ స్థానవాచక రూపం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ పరిచయ సూత్రాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: אֲבִי
  choice: అబీ
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בַּת זְכַרְיָה
  choice: ఆమె జెకర్యా కుమార్తె
  rationale: వంశసంబంధాన్ని స్పష్టంగా తెలియజేస్తూ, తెలుగులో సంభవించగల పేరు-సంబంధ అస్పష్టతను నివారిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణనాశైలి. మూలంలోని మూడు సమాచార అంశాలు—రాజ్యారంభ వయస్సు, పాలనాకాలం మరియు స్థలం, తల్లి పేరు మరియు వంశసంబంధం—అన్నీ నిలుపబడ్డాయి.
