source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: te
  text: ఆయన మీ కోసం రాసిన కట్టడలను, న్యాయవిధులను, ధర్మశాస్త్రాన్ని, ఆజ్ఞను మీరు ఎల్లప్పుడూ జాగ్రత్తగా పాటించాలి[a]; ఇతర దేవుళ్లకు భయపడకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జాగ్రత్తగా పాటించాలి’ అనే మాటలో హీబ్రూ మూలంలోని ‘కాపాడడం/గమనించడం’ మరియు ‘చేయడం’ అనే రెండు భావాలూ ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘భయపడడం’ అంటే కేవలం బెదరిపోవడం మాత్రమే కాదు; ఇతర దేవుళ్ల పట్ల భక్తిపూర్వక విధేయత లేదా ఆరాధనా భయం చూపడమనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: కట్టడలు
  rationale: నిర్దేశించబడిన శాసనాలు అనే అధికారిక న్యాయ భావాన్ని నిలుపుతూ, తరువాతి ఒడంబడిక సంబంధ న్యాయపదం నుండి దీనిని వేరుగా ఉంచుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయ నిర్ణయాలు లేదా చట్టపరమైన విధులను సూచించే ప్రత్యేక పదంగా అనువదించి, మొత్తం పదసమూహాన్ని సాధారణంగా ‘నియమాలు’ అని కుదించలేదు.
- source_word: הַתּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: ఈ ఒడంబడిక-న్యాయ సందర్భంలో తోరా అనే బోధన లేదా శాసన వ్యవస్థ యొక్క గుర్తించదగిన భావాన్ని సహజమైన తెలుగు బైబిలు పదంతో వ్యక్తం చేస్తుంది.
- source_word: הַמִּצְוָה
  choice: ఆజ్ఞ
  rationale: హీబ్రూలోని ఏకవచనాన్ని నిలుపుతూ, అధికారపూర్వక ఆదేశ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: ఆయన మీ కోసం రాసిన
  rationale: క్రియలో అంతర్లీనంగా ఉన్న మూడవ పురుష ఏకవచన కర్తను ‘ఆయన’గా నిలిపింది; సందర్భం దానిని యెహోవాకు అన్వయిస్తుంది గాని వచనంలో లేని పేరును చేర్చలేదు.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించాలి
  rationale: ‘కాపాడడం/గమనించడం’ మరియు ‘చేయడం’ కలిసిన హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో ఆచరణాత్మక విధేయతగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లప్పుడూ
  rationale: ‘అన్ని దినాలు’ అనే హీబ్రూ కాలవ్యాప్తి నుడికారాన్ని తెలుగులో సహజంగా, అదనపు స్వామ్యసూచకాన్ని చేర్చకుండా తెలియజేస్తుంది.
- source_word: תִירְאוּ
  choice: భయపడకూడదు
  rationale: మూలంలోని ‘భయపడు’ అనే పదాన్ని నిలుపుతుంది; ఇక్కడ అది ఇతర దేవతల పట్ల భక్తిపూర్వక భయం లేదా ఆరాధనా విధేయతను కూడా సూచిస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: యెహోవా తప్ప ఇతర దేవతలను సూచించే సాధారణ హీబ్రూ పదబంధానికి నేరమైన తెలుగు రూపం.
theological_decisions:
- issue: ఒడంబడిక సంబంధ న్యాయపదాల సమూహాన్ని ప్రత్యేకంగా నిలపడం
  choice: కట్టడలు, న్యాయవిధులు, ధర్మశాస్త్రం, ఆజ్ఞ అనే నాలుగు వేర్వేరు పదాలను ఉంచడం
  alternative: ‘నియమాలు, ఆజ్ఞలు’ వంటి సంక్షిప్త సమాహారంగా అనువదించడం
  rationale: మూలం ఉద్దేశపూర్వకంగా నాలుగు దగ్గరి భావాలున్న న్యాయపదాలను వరుసగా ఉపయోగిస్తుంది; వాటిని నిలపడం వాక్యపు వాగ్మయ బరువును, ఒడంబడిక బాధ్యతల విస్తృతిని కాపాడుతుంది.
- issue: ‘రాసిన’ క్రియ కర్తను వ్యక్తం చేయడం
  choice: ‘ఆయన’ అని ఉంచడం
  alternative: ‘యెహోవా’ అని స్పష్టంగా చేర్చడం
  rationale: సందర్భంలో కర్త యెహోవా అయినప్పటికీ, ఈ వచనంలోని హీబ్రూ క్రియలో పేరు ప్రత్యక్షంగా లేదు. కాబట్టి మూలానికి మించి స్పష్టీకరించకుండా సర్వనామాన్ని ఉంచింది.
- issue: ‘భయపడడం’ యొక్క ఆరాధనా భావం
  choice: ముఖ్య పాఠంలో ‘భయపడకూడదు’ అని ఉంచి, విస్తృత భావాన్ని పాదటిప్పణిలో వివరించడం
  alternative: ‘పూజించకూడదు’ లేదా ‘భక్తి చూపకూడదు’ అని ప్రధాన పాఠంలో అనువదించడం
  rationale: ‘భయం’ అనే మూల రూపకాన్ని నిలుపుతూ, సందర్భంలోని భక్తిపూర్వక విధేయత లేదా ఆరాధనా భావాన్ని కోల్పోకుండా పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఒడంబడిక శైలి పాటించబడింది. హీబ్రూ పదసమూహంలోని నాలుగు భిన్న పదాలు నిలుపబడ్డాయి; అయితే ‘కాపాడి చేయాలి’ వంటి అసహజ పదక్షర రూపం బదులు ‘జాగ్రత్తగా పాటించాలి’ అనే సహజ రూపం ఎంచుకోబడింది.
