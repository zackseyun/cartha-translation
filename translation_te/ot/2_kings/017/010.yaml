id: 2KI.17.10
reference: 2 Kings 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: te
  text: వారు తమ కోసం ప్రతి ఎత్తైన కొండమీద, ప్రతి పచ్చని చెట్టు కింద పూజా స్తంభాలనూ అషేరా స్తంభాలనూ[a] నిలబెట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరీము’; హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది. వాటి ఖచ్చితమైన రూపం నిర్ధారించడం కష్టం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: నిలబెట్టుకున్నారు
  rationale: హిఫిల్ రూపం ఇక్కడ ఆరాధనా వస్తువులను నెలకొల్పడం లేదా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది. ‘నిలబెట్టుకున్నారు’ అనేది సహజమైన ఆధునిక తెలుగు; లָהֶםలోని తమకోసం అనే భావాన్నీ సందర్భానికి తగిన విధంగా అందిస్తుంది.
- source_word: לָהֶם
  choice: తమ కోసం
  rationale: ఈ దత్తివాచక సర్వనామం వారు ఆ వస్తువులను తమ ఉపయోగం లేదా ప్రయోజనం కోసం నెలకొల్పారని సూచిస్తుంది; తెలుగులో ‘తమ కోసం’ ప్రతిబింబార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַצֵּבוֹת
  choice: పూజా స్తంభాలు
  rationale: ఈ పదం ఆరాధనా సందర్భంలో నిలబెట్టిన రాతి స్తంభాలను సూచిస్తుంది. కేవలం ‘స్తంభాలు’ అనడం వల్ల సాధారణ నిర్మాణ స్తంభాలుగా అపార్థం కావచ్చు కాబట్టి, సందర్భార్థాన్ని స్పష్టం చేయడానికి ‘పూజా స్తంభాలు’ ఎంచుకున్నాం.
- source_word: וַאֲשֵׁרִים
  choice: అషేరా స్తంభాలు
  rationale: బహువచన రూపం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది; అవి తప్పనిసరిగా దేవత స్వరూపాలే అని నిర్ధారించదు. ‘అషేరా స్తంభాలు’ ఆ సంబంధాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే రూపం; వస్తువు ఖచ్చిత స్వరూపంపై ఉన్న అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: ప్రతి ఎత్తైన కొండమీద
  rationale: భౌతిక దృశ్యాన్ని, ఆరాధనా స్థలాలను సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: ప్రతి పచ్చని చెట్టు కింద
  rationale: רַעֲנָן తాజా, పచ్చని లేదా దట్టమైన ఆకులతో ఉన్న చెట్టును సూచిస్తుంది. ‘పచ్చని చెట్టు’ మూలంలోని సుపరిచిత దృశ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: אֲשֵׁרִים పదం సూచించే వస్తువుల స్వరూపం
  choice: అషేరా స్తంభాలు
  alternative: అషేరీము; అషేరా ప్రతిమలు
  rationale: మూలంలోని బహువచనం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది; వాటిని సాధారణ విగ్రహాలుగా మార్చడం లేదా తప్పనిసరిగా దేవత ప్రతిమలుగా నిర్ణయించడం మూలంలోని అనిశ్చితిని తొలగిస్తుంది. ప్రధాన పాఠంలో చదవదగిన రూపాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పూజా స్తంభాలు’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘అషేరా స్తంభాలు’ అనే రూపం పేరుతో ఉన్న సంబంధాన్ని నిలుపుతుంది. మూలంలోని స్థలవర్ణన క్రమం మరియు సమాంతర నిర్మాణం సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
