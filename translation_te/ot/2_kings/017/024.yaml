id: 2KI.17.24
reference: 2 Kings 17:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజు బబులోను, కూతా, అవ్వా[a], హమాతు, సెఫర్వయిము నుండి ప్రజలను తీసుకువచ్చి, ఇశ్రాయేలు ప్రజల స్థానంలో[b] షోమ్రోను పట్టణాలలో వారిని నివసించేలా చేశాడు. వారు షోమ్రోనును స్వాధీనం చేసుకొని దాని పట్టణాలలో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అవ్వా’ అనే స్థలనామాన్ని ‘అవా’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారుల స్థానంలో’; అంటే, ‘ఇశ్రాయేలీయుల స్థానంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ప్రజలను తీసుకొచ్చి
  rationale: హిఫిల్ రూపానికి ‘తీసుకొచ్చాడు/రప్పించాడు’ అనే కారణార్థం ఉంది. హీబ్రూలో వ్యక్తులు స్పష్టంగా పేర్కొనబడకపోయినా, తరువాతి బహువచన క్రియలు మరియు పునరావాస సందర్భం వల్ల ‘ప్రజలను’ అని స్పష్టత కోసం చేర్చబడింది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: బబులోను, కూతా, అవ్వా, హమాతు, సెఫర్వయీము ప్రాంతాల నుంచి
  rationale: ఇవి స్థలనామాలు కనుక లిప్యంతరీకరించబడ్డాయి. తెలుగులో మూలస్థాన భావం సహజంగా ఉండేందుకు ‘ప్రాంతాల నుంచి’ వాడబడింది.
- source_word: וַיֹּשֶׁב
  choice: వారిని నివసింపజేశాడు
  rationale: యషబ్ హిఫిల్ రూపంలోని కారణార్థాన్ని—రాజు వారిని అక్కడ నివసించేలా చేశాడనే భావాన్ని—స్పష్టంగా నిలుపుతుంది.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: షోమ్రోను పట్టణాల్లో
  rationale: ‘పట్టణాలు’ అనే బహువచనాన్ని నిలుపుతుంది; ఇక్కడ షోమ్రోను కేవలం రాజధానికే కాక విస్తృత ప్రాంతానికి సూచనగా ఉంది.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల స్థానంలో
  rationale: తహత్‌కు ఇక్కడ ‘స్థానంలో’ అనే భావం. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరార్థం కన్నా, మొత్తం జాతిని సూచించే హీబ్రూ వాడుకను తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, లింగపరంగా సరిగ్గా తెలియజేస్తుంది.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: వారు షోమ్రోనును స్వాధీనం చేసుకొని
  rationale: యరష్ ఈ పునరావాస సందర్భంలో వారసత్వంగా పొందడం కంటే ఆధీనంలోకి తీసుకొని స్థిరపడటాన్ని సూచిస్తుంది.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: దాని పట్టణాల్లో నివసించారు
  rationale: కాల రూపంలోని సాధారణ ‘నివసించారు’ భావాన్ని, అలాగే స్త్రీలింగ ఏకవచన ప్రత్యయం షోమ్రోనును సూచించడాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బְּנֵי יִשְׂרָאֵל అనే లింగసూచక జాతి వ్యక్తీకరణ
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ పురుషులను మాత్రమే కాక మొత్తం ఇశ్రాయేలు జనసమూహాన్ని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ మూలార్థాన్ని మరింత ఖచ్చితంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన, సులభమైన శైలి. స్థలనామాలు మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి. ప్రధాన వాక్యంలో కారణార్థక క్రియలు మరియు షోమ్రోను పట్టణాల బహువచనం నిలుపబడ్డాయి.
