  source_fidelity: మూల హీబ్రూ వాక్యంలోని కారణార్థక క్రియలు, షోమ్రోను పట్టణాల బహువచనం, ‘ఇశ్రాయేలు ప్రజల స్థానంలో’ అనే ప్రత్యామ్నాయ భావం, అలాగే స్వాధీనపరచుకోవడం అనే భావం ముసాయిదాలో సరిగ్గా ప్రతిఫలించాయి. అయితే సెఫర్వయిము స్థలనామానికి మరింత నేరమైన, స్థిరమైన లిప్యంతరీకరణ అవసరం ఉంది.
