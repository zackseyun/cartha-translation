  terminology: అష్షూరు, బబులోను, కూతా, అవ్వా, హమాతు, షోమ్రోను అనే రూపాలు అనుకూలంగా ఉన్నాయి. סְפַרְוַיִם‌కు ‘సెఫర్వయిము’ రూపం హీబ్రూ స్థలనామానికి మరింత సమీపంగా ఉంది. ‘ఇశ్రాయేలు ప్రజలు’ ఇక్కడ జాతిసూచకమైన בְּנֵי יִשְׂרָאֵל భావాన్ని సహజంగా తెలియజేస్తుంది.
