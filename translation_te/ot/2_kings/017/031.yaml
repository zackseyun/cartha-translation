  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: te
  text: అవ్వీయులు[a] నిభ్హజును, తర్తాకును తయారుచేశారు; సెఫర్వయిమువారు తమ కుమారులను అగ్నిలో కాల్చి, సెఫర్వయిము దేవతలైన అద్రమ్మెలెకు, అనమ్మెలెకు అర్పించేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవ్వీములు.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు తమ కుమారులను ఈ దేవతలకు బలిగా అగ్నిలో కాల్చి అర్పించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: అవ్వీయులు
  rationale: ఇది ఒక జనసమూహాన్ని సూచించే బహువచన జాతినామం; అనువదించకుండా తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: עָשׂוּ
  choice: చేశారు
  rationale: మూలంలో సాధారణంగా ‘చేశారు/తయారుచేశారు’ అనే క్రియ మాత్రమే ఉంది. ‘విగ్రహాలు’ లేదా ‘ప్రతిమలు’ అని స్పష్టీకరించకుండా మూలంలోని సంక్షిప్తతను నిలిపింది.
- source_word: נִבְחַז וְאֶת־תַּרְתָּק
  choice: నిభ్హజును, తర్తాకును
  rationale: ఇవి దేవతల పేర్లు కాబట్టి లిప్యంతరీకరించబడ్డాయి.
- source_word: הַסְפַרְוִים
  choice: సెఫర్వయిమువారు
  rationale: సెఫర్వయిము ప్రాంత ప్రజలను సూచించే జాతినామాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֹׂרְפִים
  choice: కాలుస్తూ … అర్పించేవారు
  rationale: హీబ్రూ వర్తమాన కృదంతం ఇక్కడ అలవాటుగా కొనసాగిన ఆచారాన్ని సూచిస్తుంది; తెలుగు అలవాటు భూతకాల రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת־בְּנֵיהֶם בָּאֵשׁ
  choice: తమ కుమారులను అగ్నిలో
  rationale: בנים అనే లింగనిర్దిష్ట పదాన్ని ‘కుమారులు’గా నిలిపి, అగ్నితో దహనం చేసే బలిసందర్భాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: అద్రమ్మెలెకుకు, అనమ్మెలెకుకు
  rationale: לְ సమర్పణను స్వీకరించే దేవతల వైపు ఉద్దేశాన్ని సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి దాన్ని సహజంగా అందిస్తుంది.
- source_word: אלה ספרים
  choice: సెఫర్వయిము దేవతలైన
  rationale: అద్రమ్మెలెకు, అనమ్మెలెకు సెఫర్వయిముతో సంబంధమున్న దేవతలని గుర్తించే నిర్మాణంగా అనువదించబడింది.
theological_decisions:
- issue: నిభ్హజు, తర్తాకు విగ్రహాలు లేదా ప్రతిమలు అని ప్రధాన పాఠంలో స్పష్టంగా చేర్చాలా?
  choice: ‘నిభ్హజును, తర్తాకును చేశారు’ అని మూలంలోని సాధారణ క్రియను నిలిపివేయడం
  alternative: ‘నిభ్హజు, తర్తాకు విగ్రహాలను తయారుచేశారు’
  rationale: ఆరాధనకు సంబంధించిన వస్తువుల తయారీ సందర్భంలో సూచితమైనప్పటికీ, హీబ్రూ పాఠం ‘విగ్రహాలు’ లేదా ‘ప్రతిమలు’ అనే నామవాచకాన్ని స్పష్టంగా ఉపయోగించదు.
- issue: בְּנֵיהֶם ను లింగసామాన్యంగా ‘పిల్లలు’ అని అనువదించాలా?
  choice: ‘కుమారులు’
  alternative: ‘పిల్లలు’
  rationale: మూలంలోని పదం ఇక్కడ పుంలింగ బహువచనంగా ఉంది; సందర్భం దాన్ని తప్పనిసరిగా లింగసామాన్యంగా తీసుకోవాలని నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గంభీరతతో రూపొందించబడింది. దేవతల పేర్లు, జనసమూహాల పేర్లు లిప్యంతరీకరించబడ్డాయి; మూలంలో లేని ‘విగ్రహాలు’ అనే వివరణ ప్రధాన పాఠంలో చేర్చలేదు.
