  naturalness: “తన ఎదుటనుండి,” “తన సేవకులైన ప్రవక్తలందరి ద్వారా,” మరియు “నేటివరకు” ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. వచనారంభంలోని ఉపవాక్యం ఉద్దేశపూర్వకంగా ముందరి వచనానికి కొనసాగింపు; అందువల్ల దానికి కృత్రిమంగా “ఇది కొనసాగింది” జోడించకపోవడం మూల నిర్మాణానికీ తెలుగు పాఠ్యప్రవాహానికీ అనుకూలం.
