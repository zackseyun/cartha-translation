id: 2KI.17.23
reference: 2 Kings 17:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: te
  text: యెహోవా ఇశ్రాయేలును తన ఎదుటనుండి[a] తొలగించే వరకు, ఆయన తన సేవకులైన ప్రవక్తలందరి ద్వారా[b] చెప్పినట్టుగానే. అలా ఇశ్రాయేలు తన దేశం నుండి అష్షూరుకు చెరలోకి వెళ్లింది, నేటివరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సన్నిధి నుండి.” హీబ్రూలో అక్షరార్థం “తన ముఖం ఎదుటనుండి”; ఇది యెహోవా ఎదుటనుండి తొలగించడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం “తన సేవకులైన ప్రవక్తలందరి చేత”; అంటే, వారి ద్వారా.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: తొలగించాడు
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘బహిష్కరించాడు’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מֵעַל פָּנָיו
  choice: తన ఎదుటనుండి
  rationale: ‘తన ముఖం ఎదుటనుండి’ అనే హీబ్రూ నుడికారంలోని వ్యక్తిగత, న్యాయతీర్పు సంబంధమైన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్టుగానే
  rationale: పోలికతోపాటు ముందుగా పలికిన ప్రవచనం నెరవేరిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: అక్షరార్థంగా ‘చేత’ అయిన ఈ హీబ్రూ నుడికారం ఇక్కడ సాధనం లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: తన సేవకులైన ప్రవక్తలందరు
  rationale: ప్రవక్తలను యెహోవా సేవకులుగా గుర్తించే అన్వయ సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיִּגֶל
  choice: చెరగా వెళ్లింది
  rationale: గלה క్రియ ఇక్కడ దేశబహిష్కరణ లేదా చెరను సూచిస్తుంది; సమష్టి ఏకవచనమైన ఇశ్రాయేలుకు అనుగుణంగా ఏకవచనం వాడబడింది, అలాగే మూలంలో స్పష్టంగా చెప్పని మానవ కర్తను చేర్చలేదు.
- source_word: אַדְמָתוֹ
  choice: తన దేశం
  rationale: అక్షరార్థంలోని ‘తన నేల’ అనే ప్రాదేశిక భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אַשּׁוּרָה
  choice: అష్షూరుకు
  rationale: దిశను తెలిపే హీబ్రూ ప్రత్యయాన్ని ‘కు’తో వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: హీబ్రూ కాలసూచక సూత్రానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: מֵעַל פָּנָיו అనే నుడికారంలో దైవసన్నిధి మరియు తీర్పు భావం
  choice: తన ఎదుటనుండి
  alternative: తన సన్నిధి నుండి
  rationale: ఈ ఎంపిక దేవుని ఎదుటనుండి ఇశ్రాయేలు తొలగించబడిన వ్యక్తిగత, న్యాయతీర్పు సంబంధమైన భావాన్ని నిలుపుతుంది; ‘సన్నిధి’ అనే ప్రత్యామ్నాయం సాధ్యమే అయినా అదనపు ఆధ్యాత్మిక అర్థాన్ని ముందుకు తేవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ఆరంభంలోని עַד אֲשֶׁר ముందరి వాక్యంతో ఉన్న అనుసంధానాన్ని సూచించేందుకు ‘తొలగించేవరకు’ను, ఒంటరి వచనంగా స్పష్టత కోసం ‘ఇది కొనసాగింది’ను వాడాం. రెండు పాదాల క్రమం మరియు ప్రవచన నెరవేర్పు భావం నిలుపబడ్డాయి.
