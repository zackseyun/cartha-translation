id: 2KI.17.2
reference: 2 Kings 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు; అయితే అతనికి ముందున్న ఇశ్రాయేలు రాజులవలె కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాత్రమే—అతనికి ముందున్న ఇశ్రాయేలు రాజులవలె కాదు.” హీబ్రూ కణాన్ని మరింత అక్షరార్థంగా “మాత్రమే” అని అనువదించవచ్చు; అది ఈ ప్రతికూల తీర్పుకు ఒక పరిమితిని జతచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వయిక్తోల్ రూపం కథనంలోని తదుపరి కార్యాన్ని తెలియజేస్తుంది. తెలుగు సహజ కథనశైలిలో ఆరంభ సంధికారకాన్ని విడిచిపెట్టడం సముచితం.
- source_word: הָרַע
  choice: చెడ్డది
  rationale: నిర్దేశకంతో ఉన్న విశేషణం నామవాచకార్థంలో ‘చెడ్డది/చెడైనది’ అని పనిచేస్తుంది; ‘చెడ్డది’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: మూలంలోని ‘కళ్లలో’ అనే మూలచిత్రం ఒకరి అంచనా లేదా తీర్పును సూచిస్తుంది. ‘దృష్టిలో’ ఆ భావాన్ని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: רַק
  choice: అయితే
  rationale: ఇక్కడ ఈ కణం ముందున్న ప్రతికూల తీర్పుకు ఒక పరిమితిని లేదా మినహాయింపును జతచేస్తుంది. ‘అయితే’ ఆ వ్యతిరేక-పరిమితి భావాన్ని సహజంగా తెలియజేస్తుంది; మరింత అక్షరార్థమైన ‘మాత్రమే’ సాధ్యమని పాదటిప్పణి సూచిస్తుంది.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులవలె కాదు
  rationale: నిషేధంతో కూడిన తులనాత్మక כ నిర్మాణాన్ని స్పష్టంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: తనకు ముందున్న
  rationale: అక్షరార్థంగా ‘అతని ముందు ఉన్నవారు’; సందర్భంలో అతనికంటే ముందు పరిపాలించిన రాజులను సూచిస్తుంది. ‘తనకు ముందున్న’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. రాజులపై వాడే మూలపాఠపు మూల్యాంకన సూత్రాన్ని సహజంగా ఉంచి, רַק లోని పరిమితి/వ్యతిరేక భావ అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
