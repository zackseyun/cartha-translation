  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: te
  text: యూదా రాజైన ఆహాజు పన్నెండవ సంవత్సరంలో, ఏలా కుమారుడైన హోషేయ షోమ్రోనులో ఇశ్రాయేలుపై రాజుగా పరిపాలించడం ప్రారంభించాడు; అతడు తొమ్మిది సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించడం మొదలుపెట్టి
  rationale: కాలసూచనతో కూడిన రాజవంశ చరిత్ర శైలిలో, ఇక్కడ క్రియ హోషేయ పాలనారంభాన్ని తెలియజేస్తుంది; 'రాజయ్యాడు' కంటే మూలంలోని పరిపాలన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: హోషేయ పరిపాలించిన రాజధాని స్థలాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: עַל యొక్క పాలనాధికార సంబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజవంశ చరిత్రకు తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు מָלַךְ ప్రయోగాల భావాన్ని నిలుపుతూ తెలుగు పునరుక్తిని సహజంగా ఉంచింది.
