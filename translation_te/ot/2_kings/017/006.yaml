  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక కథనానికి తగిన గంభీరమైన కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; సంఘటనల క్రమం మారలేదు. స్థలనామాలకు మూలభాషకు సమీపమైన రూపాలు వాడబడ్డాయి.
