  rationale: The revision corrects the Habor–Gozan relationship, preserves Israel as the source’s collective designation, and renders Media geographically rather than ethnically. It retains the forced-deportation and resettlement senses, the historical register, and both footnote anchors without imposing an interpretation beyond the Hebrew.
