- from: హోషేయా పాలనలో తొమ్మిదవ సంవత్సరంలో, అష్షూరు రాజు షోమ్రోనును స్వాధీనం చేసుకొని, ఇశ్రాయేలు ప్రజలను అష్షూరుకు చెరగా తరలించాడు[a]. వారిని హలహులో, గోజాను నది అయిన హాబోరు తీరంలో[b], మాదీయుల పట్టణాల్లో నివసింపజేశాడు.
