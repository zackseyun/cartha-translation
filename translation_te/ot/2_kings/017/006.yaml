  text: בִּ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/הוֹשֵׁ֗עַ לָכַ֤ד מֶֽלֶךְ אַשּׁוּר֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֶּ֥גֶל אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יֹּ֨שֶׁב אֹתָ֜/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: te
  text: హోషేయా పాలనలో తొమ్మిదవ సంవత్సరంలో అష్షూరు రాజు షోమ్రోనును స్వాధీనం చేసుకొని, ఇశ్రాయేలును అష్షూరుకు చెరగా తరలించాడు[a]. వారిని హలహులో, గోజానుకు చెందిన నది హాబోరు ఒడ్డున[b], మాదీయ దేశపు పట్టణాల్లో నివసింపజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలును అష్షూరుకు ప్రవాసానికి పంపించాడు’ లేదా ‘ఇశ్రాయేలును అష్షూరుకు బహిష్కరించాడు.’ హీబ్రూ క్రియ బలవంతంగా స్వదేశం నుంచి తొలగించి ప్రవాసానికి పంపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గోజానుకు చెందిన నది హాబోరు దగ్గర.’ హీబ్రూ పదబంధం హాబోరును గోజానుకు సంబంధించిన నదిగా పేర్కొంటుంది; నది వెంబడి వారిని నివసింపజేశారని కూడా అర్థమవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: హోషేయా పాలనలో తొమ్మిదవ సంవత్సరంలో
  rationale: లְహוֹשֵׁעַ ఇక్కడ హోషేయా రాజ్యపాలనకు సంబంధించిన సంవత్సరాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘పాలనలో’ అని వ్యక్తం చేశాం.
- source_word: לָכַד
  choice: స్వాధీనం చేసుకొని
  rationale: ఒక పట్టణాన్ని సైనికంగా పట్టుకోవడం లేదా జయించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సంబంధపదబంధాన్ని తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
- source_word: שֹׁמְרוֹן
  choice: షోమ్రోను
  rationale: పట్టణనామానికి మూలభాషకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וַיֶּגֶל אֶת־יִשְׂרָאֵל אַשּׁוּרָה
  choice: ఇశ్రాయేలు ప్రజలను అష్షూరుకు చెరగా తరలించాడు
  rationale: גלה హిఫీల్ రూపం బలవంతంగా దేశం నుంచి తొలగించి ప్రవాసానికి పంపడాన్ని సూచిస్తుంది. ‘చెరగా తరలించాడు’ సామాన్య పాఠకునికి స్పష్టంగా ఉండి బలవంతపు తరలింపు భావాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలు ప్రజలు’ సమష్టి జాతీయ సూచనను స్పష్టం చేస్తుంది.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: వారిని ... నివసింపజేశాడు
  rationale: ישׁב హిఫీల్ రూపంలోని ‘వారిని నివసించేలా చేశాడు’ అనే కారణార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: בַּחְלַח
  choice: హలహులో
  rationale: స్థలనామాన్ని మూలానికి సమీపంగా లిప్యంతరీకరించి, ב ఉపసర్గను ‘లో’గా అనువదించాం.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: గోజాను నది అయిన హాబోరు తీరంలో
  rationale: హాబోరును గోజానుకు సంబంధించిన నదిగా వివరించే సమానాధికార పదబంధాన్ని నిలుపుతూ, నది వెంబడి నివాసమనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעָרֵי מָדָי
  choice: మాదీయుల పట్టణాల్లో
  rationale: మాదీ ప్రాంతం లేదా ప్రజలకు చెందిన పట్టణాలనే హీబ్రూ సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
