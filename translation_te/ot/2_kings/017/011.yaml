id: 2KI.17.11
reference: 2 Kings 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: te
  text: వారు అక్కడ ఉన్నత పూజాస్థలాలన్నిటిలో, తమ ఎదుటనుండి యాహ్వే వెళ్లగొట్టిన జనాలవలె ధూపం వేశారు[a]; యాహ్వేకు కోపం పుట్టించడానికి చెడు కార్యాలు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ ఎదుటనుండి యాహ్వే చెరగా తరలించిన జనాలవలె.” హీబ్రూ క్రియకు చెరగా తరలించడం లేదా ఒక చోటు నుంచి తొలగించడం అనే భావాలు ఉండవచ్చు; ఇక్కడ దేశం నుంచి ఆ జనాలు తొలగించబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: ధూపం వేశారు
  rationale: పియేల్ రూపంలోని קטר బలిద్రవ్యపు పొగను పైకి లేపడాన్ని, తరచుగా ప్రత్యేకంగా ధూపం వేయడాన్ని సూచిస్తుంది. అక్రమ ఆరాధన సందర్భంలో ‘ధూపం వేశారు’ సహజమైన, నిర్దిష్టమైన అనువాదం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ముందటి సందర్భంలో పేర్కొన్న ఆరాధనా స్థలాలను సూచించే సరళమైన స్థలవాచక ప్రయోగం.
- source_word: בְּכָל בָּמוֹת
  choice: ఉన్నత పూజాస్థలాలన్నిటిలో
  rationale: במות అనేది ఆరాధనకు ఉపయోగించిన ఎత్తైన స్థలాలను సూచించే సాంకేతిక పదం. ఆధునిక తెలుగు పాఠకునికి ఆ ఆరాధనా భావం స్పష్టమయ్యేలా ‘పూజాస్థలాలు’ చేర్చబడింది.
- source_word: כַּגּוֹיִם
  choice: జనాలవలెనే
  rationale: ఇక్కడ גוים అనేది ఇశ్రాయేలీయుల ఎదుటనుండి తొలగించబడిన దేశజనాలను సూచిస్తుంది; తరువాతి కాలపు ‘అన్యజనులు’ అనే మతపరమైన విభాగాన్ని అనవసరంగా దిగుమతి చేయకుండా ‘జనాలు’ అని అనువదించబడింది.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: తమ ఎదుటనుండి యాహ్వే వెళ్లగొట్టిన
  rationale: הגלה బహిష్కరించడం, తీసివేయడం లేదా చెరగా తరలించడం అనే భావాలను కలిగి ఉంటుంది. ఈ భూస్వాధీన సందర్భంలో ‘వెళ్లగొట్టిన’ అనేది జనాలు దేశం నుంచి తొలగించబడిన భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో నిలుపబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా తెలుగు లిపిలో ఇచ్చారు.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: చెడు కార్యాలు చేశారు
  rationale: వాక్యంలోని విస్తృత నైతిక ఖండనను సంకుచితం చేయకుండా, సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לְהַכְעִיס
  choice: కోపం పుట్టించడానికి
  rationale: כעס హిఫీల్ రూపం కోపం కలిగించడం లేదా కోపానికి ప్రేరేపించడం అని అర్థం. తెలుగు వాక్యంలో కర్తకు కోపం కలిగించే ఉద్దేశం లేదా ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, తెలుగు లిపిలో ‘యాహ్వే’గా నిలుపడం మూలపాఠానికి సమీపంగా ఉంటుంది.
- issue: భూస్వాధీన సందర్భంలో הֶגְלָה భావం
  choice: వెళ్లగొట్టిన
  alternative: చెరగా తరలించిన; తొలగించిన
  rationale: ఈ సందర్భం ఇశ్రాయేలీయుల ఎదుటనుండి దేశజనాలు తొలగించబడటాన్ని గుర్తుచేస్తుంది. ‘వెళ్లగొట్టిన’ ప్రధాన సందర్భార్థాన్ని అందిస్తుండగా, క్రియలోని చెరగా తరలించే సంభావ్య భావాన్ని పాదసూచిక కాపాడుతుంది.
- issue: לְהַכְעִיס లో ఉద్దేశం లేదా ఫలితం
  choice: కోపం పుట్టించడానికి
  alternative: కోపం పుట్టించేలా
  rationale: లమెడ్‌తో కూడిన క్రియారూపం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠం హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తుంది; ఇది వారి అంతర్గత ఉద్దేశంపై అవసరానికి మించిన సిద్ధాంత నిర్ణయం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక-ఆరాధనా సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఉన్నత పూజాస్థలాలు’ అనే పదబంధం במות యొక్క ఆరాధనా సాంకేతిక భావాన్ని స్పష్టం చేస్తుంది. పాదసూచిక గుర్తు సంబంధిత הֶגְלָה పదబంధం తరువాత ఉంచబడింది.
