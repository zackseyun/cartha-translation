id: 2KI.17.22
reference: 2 Kings 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు యరొబాము చేసిన పాపాలన్నిటిలో నడిచారు; వాటిని విడిచిపెట్టలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘దానినుండి’; ఈ ఏకవచనం ఇప్పుడే ప్రస్తావించిన పాపపు మార్గాన్ని లేదా విధానాన్ని సమష్టిగా సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: నడిచారు
  rationale: הלך + ב అనే హీబ్రూ ప్రయోగం ఒక ప్రవర్తనా మార్గాన్ని అనుసరించడాన్ని సూచిస్తుంది. ‘నడిచారు’ మూలంలోని రూపకాన్ని సహజమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ జాతీయ సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּכָל חַטֹּאות
  choice: పాపాలన్నిటిలో
  rationale: בְּכָל ను ‘అన్నిటిలో’గా ఇవ్వడం ద్వారా వారు ఆ పాపపు ప్రవర్తన అంతటినీ అనుసరించారనే భావం, అలాగే హీబ్రూ నిర్మాణం నిలుస్తాయి.
- source_word: יָרָבְעָם אֲשֶׁר עָשָׂה
  choice: యరొబాము చేసిన
  rationale: עשה సాధారణంగా ‘చేయు’ అని అర్థం. తెలుగులో ‘పాపాలు చేసిన’ అనేది సహజమైన ప్రయోగం; అదనపు భావాన్ని చేర్చదు.
- source_word: לֹא סָרוּ
  choice: విడిచిపెట్టలేదు
  rationale: סור అంటే తొలగిపోవడం లేదా పక్కకు మళ్లడం. ఈ సందర్భంలో పాపపు ఆచరణను మానకపోవడాన్ని ‘విడిచిపెట్టలేదు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמֶּנָּה
  choice: వాటిని
  rationale: హీబ్రూలో ప్రత్యయం స్త్రీలింగ ఏకవచనంలో ఉన్నా, ముందున్న పాపపు మార్గాన్ని సమష్టిగా సూచించవచ్చు. ప్రధాన వాక్యంలో తెలుగుకు సహజంగా ముందున్న బహువచన ‘పాపాలు’ను ‘వాటిని’తో సూచించి, మూలరూపాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: బహువచన ‘పాపాలు’ తరువాత వచ్చిన ఏకవచన ప్రత్యయం מִמֶּנָּה యొక్క సూచన
  choice: ప్రధాన వాక్యంలో ‘వాటిని’ అని, యరొబాము పాపాలను సమష్టిగా సూచించడం
  alternative: ‘దానినుండి’ అని, ఇప్పుడే ప్రస్తావించిన పాపపు మార్గం లేదా విధానాన్ని సమష్టి ఏకవచనంగా సూచించడం
  rationale: మూలంలోని ఏకవచన రూపం సమష్టి పాపపు మార్గాన్ని సూచించే అవకాశం ఉంది. అయితే తెలుగులో వెంటనే ముందున్న ‘పాపాలన్నిటి’తో ‘వాటిని’ సహజంగా అనుసంధానమవుతుంది. అసలు వ్యాకరణ రూపం మరియు దాని సంభావ్య భావాన్ని పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘నడిచారు’ అనే నైతిక-ప్రవర్తనా రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, అస్పష్టమైన ఏకవచన సూచనను పాదసూచికలో సంరక్షించాం.
