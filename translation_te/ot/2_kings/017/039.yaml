  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: te
  text: కాని మీ దేవుడైన యాహ్వేకే భయపడండి; ఆయన మిమ్మల్ని మీ శత్రువులందరి చేతిలోనుండి[a] విడిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మీ శత్రువులందరి చేతిలోనుండి’; అంటే వారి అధికారం లేదా అదుపు నుంచి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని …కే
  rationale: మునుపటి వచనంలో ఇతర దేవుళ్లకు భయపడకూడదనే ఆజ్ఞకు వ్యతిరేకంగా, యాహ్వేకు మాత్రమే భయపడాలనే భావాన్ని ఈ నిర్మాణం తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: ఇక్కడ పదరూపం యాహ్వేను సూచిస్తున్నందున ఏకవచన అర్థమే స్పష్టం.
- source_word: תִּירָאוּ
  choice: భయపడండి
  rationale: ఇది దేవునిపట్ల భక్తిపూర్వక భయాన్ని సూచిస్తూ, సందర్భంలో ఆజ్ఞార్థక బలాన్ని కలిగిన క్రియారూపం.
- source_word: וְהוּא
  choice: ఆయనే
  rationale: హీబ్రూలో వ్యక్తమైన సర్వనామంలోని స్వల్ప ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יַצִּיל
  choice: విడిపిస్తాడు
  rationale: నצל క్రియ యొక్క హిఫీల్ రూపం ప్రమాదం లేదా శత్రువుల ఆధిపత్యం నుంచి రక్షించి విడిపించడాన్ని సూచిస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: శత్రువుల అధికారం లేదా అదుపు నుంచి విడిపించడాన్ని తెలిపే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: כָּל אֹיְבֵיכֶם
  choice: మీ శత్రువులందరి
  rationale: పరిమాణ సూచక పదం మరియు బహువచన నామవాచకాన్ని సహజంగా, సంపూర్ణంగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామమే ఉంది; దానిని బిరుదుగా మార్చకుండా, Yahweh అనే పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞారూపాన్ని వాడాం. ‘ఆయనే’ ద్వారా హీబ్రూ సర్వనామంలోని ఉద్ఘాటనను అతిశయింపకుండా తెలిపాం; ‘చేతిలోనుండి’ అనే మూల రూపకాన్ని పాదసూచిక వివరణతో నిలిపాం.
