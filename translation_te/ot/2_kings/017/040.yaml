  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: te
  text: అయితే వారు వినలేదు; కాని వారు తమ పూర్వపు ఆచారం ప్రకారమే చేస్తూ వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ పూర్వపు నియమం/పద్ధతి ప్రకారమే చేస్తూ వచ్చారు.” హీబ్రూ מִשְׁפָּט అనే పదం నియమం, విధానం లేదా ఆచార పద్ధతిని సూచించవచ్చు; ఇక్కడ అది వారు అంతకుముందు అనుసరించిన ఆరాధనా విధానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: అయితే ... లేదు
  rationale: ముందున్న ఆజ్ఞ లేదా హెచ్చరికకు వారు స్పందించకపోవడాన్ని సూచించే స్వల్ప వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁמֵעוּ
  choice: వినలేదు
  rationale: ఈ క్రియకు వినడం, ఆలకించడం, విధేయత చూపడం అనే భావపరిధి ఉంది. ‘వినలేదు’ అనేది వారి నిరాకరణను తెలియజేస్తూనే ‘విధేయత చూపలేదు’ అని అతిగా స్పష్టీకరించకుండా మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
- source_word: כִּי אִם
  choice: దానికి బదులుగా
  rationale: ‘అది కాదు, ఇది’ అనే వ్యతిరేక నిర్మాణాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּמִשְׁפָּטָם
  choice: తమ ... ఆచారం ప్రకారం
  rationale: מִשְׁפָּט అనే పదానికి తీర్పు, నియమం, విధానం, ఆచారం వంటి అర్థాలు ఉండవచ్చు. ఇక్కడ వారి స్థిరపడిన పూర్వపు ఆరాధనా ప్రవర్తన ఉద్దేశించబడినందున ‘ఆచారం’ సందర్భోచితం.
- source_word: הָרִאשׁוֹן
  choice: పూర్వపు
  rationale: వారి మొదటి లేదా అంతకుముందటి ఆచరణ విధానాన్ని సూచిస్తుంది; ‘పూర్వపు’ సహజంగా ఆ కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: הֵם עֹשִׂים
  choice: వారు ... చేస్తూ వచ్చారు
  rationale: హీబ్రూ కృదంత నిర్మాణంలోని కొనసాగుతున్న, అలవాటైన చర్య భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
