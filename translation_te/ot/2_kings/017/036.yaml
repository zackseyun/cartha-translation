reference: 2 Kings 17:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: te
  text: కాని, గొప్ప శక్తితోను విస్తరించిన బాహువుతోను మిమ్మల్ని ఐగుప్తు దేశం నుండి పైకి తీసుకొచ్చిన యెహోవాను[a] మాత్రమే మీరు భయపడవలెను[b]; ఆయనకు సాగిలపడవలెను, ఆయనకే బలులు అర్పించవలెను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వాక్యారంభాన్ని ‘అలా కాకుండా, యెహోవాను మాత్రమే మీరు భయపడవలెను’ అని కూడా అనువదించవచ్చు. హీబ్రూ ప్రయోగం ఇతర దేవుళ్లకు విరుద్ధంగా యెహోవాను ఉద్ఘాటిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘భయపడవలెను’ అంటే కేవలం భీతిచెందడం కాదు; భక్తిపూర్వక విస్మయం మరియు నిబంధనా విధేయత అనే భావాలూ ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని
  rationale: మునుపటి నిషేధాలకు విరుద్ధంగా, ఇతర దేవుళ్లను కాదు యెహోవానే ఆరాధించాలనే సానుకూల ప్రత్యామ్నాయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచింది.
- source_word: הֶעֱלָה
  choice: పైకి తీసుకొచ్చిన
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే దృశ్యభావాన్ని నిలుపుతూ, నిర్గమ సందర్భంలో సహజంగా ఉంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: ‘దేశం’ అనే పూర్తి నిబంధనా సూత్రప్రయోగాన్ని నిలుపుతుంది.
- source_word: בְּכֹחַ גָּדוֹל
  choice: గొప్ప శక్తితో
  rationale: ב ఉపసర్గలోని సాధనార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: చాచిన బాహువుతో
  rationale: దేవుని ప్రత్యక్ష రక్షణశక్తిని సూచించే నిర్గమ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: אֹתוֹ תִירָאוּ
  choice: ఆయనకే మీరు భయపడాలి
  rationale: ముందుంచిన కర్మవాచకంలోని ఉద్ఘాటనను ‘ఆయనకే’ ద్వారా నిలుపుతూ, ירא లోని భయం–భక్తి భావవిస్తృతిని సంకుచితం చేయదు.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: ఆయనకే సాష్టాంగపడాలి
  rationale: కేవలం ‘ఆరాధించాలి’ అని వ్యాఖ్యానించకుండా, వంగి ప్రణమిల్లే శారీరక ఆరాధనా చిత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: ఆయనకే బలులు అర్పించాలి
  rationale: బలిగా వధించి అర్పించే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ‘ఆయనకే’ అనే ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నిబంధనా నామాన్ని వాడుతోంది; దాన్ని బిరుదుతో మార్చకుండా తెలుగులో స్థిరపడిన నామరూపంతో అందించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: ירא అనే క్రియ యొక్క నిబంధనా ఆరాధనార్థం
  choice: భయపడాలి
  alternative: భక్తితో గౌరవించాలి
  rationale: ఈ సందర్భంలో భక్తిపూర్వక విస్మయం, విధేయత కలిసివున్నా, మూలంలోని ‘భయం’ అనే పదబలాన్ని ప్రధాన పాఠంలో నిలుపి, దాని విస్తృత భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా శైలి. ‘సాష్టాంగపడాలి’ శారీరక ప్రణామ దృశ్యాన్ని నిలుపుతుంది; ‘ఆయనకే’ అనే పునరుక్తి హీబ్రూ ఉద్ఘాటనను ప్రతిబింబిస్తుంది.
