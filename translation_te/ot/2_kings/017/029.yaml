source:
  edition: WLC
  text: וַ/יִּהְי֣וּ עֹשִׂ֔ים גּ֥וֹי גּ֖וֹי אֱלֹהָ֑י/ו וַ/יַּנִּ֣יחוּ בְּ/בֵ֣ית הַ/בָּמ֗וֹת אֲשֶׁ֤ר עָשׂוּ֙ הַ/שֹּׁ֣מְרֹנִ֔ים גּ֥וֹי גּוֹי֙ בְּ/עָ֣רֵי/הֶ֔ם אֲשֶׁ֛ר הֵ֥ם יֹשְׁבִ֖ים שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: te
  text: అయితే ప్రతి జాతివారు తమ తమ దేవుళ్లను తయారుచేస్తూనే ఉన్నారు. షోమ్రోను ప్రజలు కట్టిన ఉన్నత స్థలాల పూజామందిరాల్లో వాటిని ఉంచారు, ప్రతి జాతివారు తాము నివసిస్తున్న పట్టణాల్లో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: చేసుకుంటూనే ఉన్నారు
  rationale: היה + వర్తమాన కృదంతం గతకాలంలో కొనసాగిన లేదా అలవాటైన చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גּוֹי גּוֹי
  choice: ప్రతి జాతివారు
  rationale: పదపునరుక్తి పంపిణీ భావాన్ని, అంటే ఒక్కో జాతి విడివిడిగా చేసిన కార్యాన్ని సూచిస్తుంది.
- source_word: אֱלֹהָיו
  choice: తమ తమ దేవుళ్లను
  rationale: ఒక్కో జాతికి వేరువేరు దేవతలు ఉన్నారనే పంపిణీ సంబంధాన్ని ‘తమ తమ’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּנִּיחוּ
  choice: ఉంచారు
  rationale: ఈ సందర్భంలో విగ్రహాలను ఒక ఆరాధనా స్థలంలో పెట్టడం లేదా స్థాపించడం అనే సాధారణ భావాన్ని ఇస్తుంది.
- source_word: בְּבֵית הַבָּמוֹת
  choice: ఉన్నత స్థలాల పూజామందిరాల్లో
  rationale: పదశః ‘ఉన్నత స్థలాల ఇల్లు’ అనే నిర్మాణం ఆ ఉన్నత స్థలాలకు సంబంధించిన ఆరాధనా కట్టడాన్ని సూచిస్తుంది; ‘పూజామందిరాలు’ ఆధునిక తెలుగులో అర్థవంతమైన సందర్భానుగుణ రూపం.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: షోమ్రోను ప్రజలు కట్టిన
  rationale: ఇక్కడి పదం షోమ్రోను ప్రాంత నివాసులను సూచించగలదు. తరువాతి కాలపు మతవర్గ భావాన్ని అనవసరంగా ముందుకు తేకుండా ఈ రూపం చారిత్రక సందర్భాన్ని కాపాడుతుంది.
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: తాము నివసిస్తున్న పట్టణాల్లో
  rationale: జాతులు స్థిరపడిన పట్టణాలనే సూచించే సంబంధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: שֹׁמְרֹנִים పదానికి చారిత్రక లేదా తరువాతి మతవర్గ సూచన
  choice: షోమ్రోను ప్రజలు
  alternative: షోమ్రోనీయులు
  rationale: వచన సందర్భం షోమ్రోను ప్రాంతపు ప్రజలను సూచిస్తుంది; ‘షోమ్రోనీయులు’ అనే ప్రత్యక్ష రూపం సాధ్యమే అయినా, అది తరువాతి కాలపు ప్రత్యేక మతసమూహాన్ని పాఠకునికి గుర్తుచేయవచ్చు. ప్రధాన పాఠం ఆ అనాకాలిక భావాన్ని నివారిస్తుండగా, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘ఉన్నత స్థలాలు’ అనే బైబిలు-సాంస్కృతిక పదబంధాన్ని నిలుపుతూ, దానికి సంబంధించిన కట్టడాన్ని ‘పూజామందిరాలు’గా సహజీకరించాం. రెండుసార్లు వచ్చిన పంపిణీ భావాన్ని ‘ప్రతి జాతివారు’ అనే పునరుక్తితో కాపాడాం.
