  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. స్థలనామానికి మూల హీబ్రూ ఉచ్చారణకు సమీపమైన ‘షోమ్రోను’, సామ్రాజ్యనామానికి సంప్రదాయబద్ధమైన ‘అష్షూరు’ ఉపయోగించబడ్డాయి.
