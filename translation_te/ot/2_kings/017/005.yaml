  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజు దేశమంతటా దండెత్తి వచ్చి, షోమ్రోను మీదికి వచ్చి[a], దానిని మూడు సంవత్సరాలు ముట్టడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షోమ్రోనుకు ఎక్కి వెళ్లి.” హీబ్రూ క్రియకు సాధారణంగా పైకి వెళ్లడం అనే అర్థం ఉండవచ్చు; అయితే తరువాత చెప్పిన ముట్టడి కారణంగా ఇక్కడ సైనికంగా నగరానికి వ్యతిరేకంగా ముందుకు రావడం అనే భావం సముచితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: దండెత్తి వచ్చాడు
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లడం/రావడం’ అనే అర్థం ఉన్నా, ఈ సైనిక సందర్భంలో అది దండయాత్రగా ముందుకు రావడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా తెలిపేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చింది; సందర్భంలో నిర్దిష్టమైన రాజును సూచిస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: దేశమంతటా
  rationale: בְּ ఇక్కడ భూభాగమంతటా కదలికను సూచిస్తుంది. ‘దేశమంతటా’ పరిధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: షోమ్రోనుపైకి వచ్చి
  rationale: పట్టణం తరువాత వచ్చే עלה సైనిక కథనంలో దానికి వ్యతిరేకంగా ముందుకు రావడాన్ని సూచించగలదు. ‘పైకి’ అనే రూపం మూలభాషలోని ఎక్కివచ్చే భావాన్ని నిలిపి, తరువాతి ‘ముట్టడించాడు’ వల్ల శత్రుభావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיָּצַר עָלֶיהָ
  choice: దాన్ని ముట్టడించాడు
  rationale: צור ఈ రూపంలో ఒక పట్టణాన్ని చుట్టుముట్టి ముట్టడించడాన్ని సూచిస్తుంది; ఇది స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు వాడుక.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు
  rationale: ముట్టడి కొనసాగిన కాలవ్యవధిని తెలుగు సహజరీతిలో తెలియజేస్తుంది.
