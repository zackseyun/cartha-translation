  to: వారు ఆయన నియమాలను, వారి పితరులతో ఆయన చేసిన తన నిబంధనను, వాటితో ఆయన వారిని హెచ్చరించిన తన సాక్ష్యవాక్యాలను[c] తిరస్కరించారు. వారు వ్యర్థమైనదాని[a] వెంట నడిచి తామూ వ్యర్థులయ్యారు[b]. తమ చుట్టూ ఉన్న జాతుల వెంట కూడా నడిచారు; వారిలా చేయకూడదని యాహ్వే వారికి ఆజ్ఞాపించాడు.
