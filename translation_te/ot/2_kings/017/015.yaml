source:
  edition: WLC
  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: te
  text: వారు ఆయన నియమాలను, వారి పితరులతో ఆయన చేసిన తన నిబంధనను, వాటితో ఆయన వారిని హెచ్చరించిన తన సాక్ష్యవాక్యాలను[c] తిరస్కరించారు. వారు వ్యర్థమైనదాని[a] వెంట నడిచి తామూ వ్యర్థులయ్యారు[b]. తమ చుట్టూ ఉన్న జాతుల వెంట కూడా నడిచారు; వారిలా చేయకూడదని యాహ్వే వారికి ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యర్థమైనది’ అని అనువదించిన హీబ్రూ పదానికి ‘శూన్యమైనది,’ ‘విలువలేనిది’ అనే అర్థాలు కూడా ఉన్నాయి; ఈ సందర్భంలో అది విగ్రహాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో సంబంధిత పదాలతో పదప్రయోగం ఉంది: వారు ‘వ్యర్థమైనదాని’ వెంట నడిచి ‘వ్యర్థులయ్యారు’—అంటే తాము వెంబడించినదానిలా విలువలేనివారయ్యారు.'
    reason: wordplay
  - marker: c
    text: 'ఇంకొక విధంగా: ‘ఆయన వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చిన తన సాక్ష్యాలను’ లేదా ‘వాటితో ఆయన వారిని హెచ్చరించిన తన హెచ్చరికలను.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: వారు తిరస్కరించారు
  rationale: מָאַס అంటే తృణీకరించడం లేదా నిరాకరించడం. ‘తిరస్కరించారు’ అనేది నిబంధనపట్ల వారి ఉద్దేశపూర్వక నిరాకరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חֻקָּיו
  choice: ఆయన నియమాలను
  rationale: חֻקִּים దేవుడు నిర్దేశించిన శాసనాలు లేదా కట్టడలను సూచిస్తుంది. ‘నియమాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: ఆయన ... చేసిన నిబంధనను
  rationale: ‘నిబంధనను కోశాడు’ అనే హీబ్రూ నుడికారాన్ని అక్షరార్థంగా కాకుండా సహజమైన తెలుగులో ‘నిబంధనను చేశాడు’ అని అందించాం.
- source_word: אֲבוֹתָם
  choice: వారి పితరులతో
  rationale: మూలంలోని పురుష బహువచనమైన ‘తండ్రులు/పితరులు’ అనే నిబంధనాత్మక పదప్రయోగాన్ని ‘పితరులు’ నిలుపుతుంది.
- source_word: עֵדְוֺתָיו אֲשֶׁר הֵעִיד בָּם
  choice: వాటితో ఆయన వారిని హెచ్చరించిన తన సాక్ష్యవాక్యాలను
  rationale: עֵדוֹת అనే ‘సాక్ష్యాలు’ భావాన్నీ, הֵעִיד అనే ‘సాక్ష్యమిచ్చాడు/హెచ్చరించాడు’ భావాన్నీ కలిపి నిలుపుతూ, తెలుగులో వాక్యసంబంధాన్ని స్పష్టంగా చేశాం.
- source_word: הַהֶבֶל ... וַיֶּהְבָּלוּ
  choice: వ్యర్థమైనదాని ... వ్యర్థులయ్యారు
  rationale: నిష్ఫలమైన లేదా విలువలేని దానిని వెంబడించి వారూ అలాంటివారయ్యారనే భావంతో పాటు, నామవాచకం-క్రియ మధ్యనున్న హీబ్రూ పదప్రయోగాన్ని తెలుగులో సాధ్యమైనంతగా నిలిపాం.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: తమ చుట్టూ ఉన్న జనాలు
  rationale: ఇక్కడ גּוֹיִם ఇశ్రాయేలు చుట్టుపక్కల ప్రజాసమూహాలను సూచిస్తుంది; ‘జనాలు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: వారిలా చేయకూడదని
  rationale: మూలంలోని సంక్షిప్తమైన ‘వారిలా చేయకూడదు’ అనే పోలికను అదనపు వివరణ చేర్చకుండా నిలిపాం.
theological_decisions:
- issue: యెహ్వహ్ అనే దైవనామం (יְהוָה)
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో నిబంధన దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: הֶבֶל ఇక్కడ విగ్రహాలను సూచిస్తుందా?
  choice: వ్యర్థమైనది
  alternative: విగ్రహాలు
  rationale: సందర్భంలో విగ్రహాలు ఉద్దేశించబడి ఉండవచ్చు; అయినా మూలపదం ‘శూన్యత/వ్యర్థత/నిష్ఫలత’ అనే విస్తృత భావాన్నీ, తరువాతి క్రియతో పదప్రయోగాన్నీ కలిగి ఉంది. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, స్పష్టమైన వాక్యనిర్మాణం వాడాం. ‘పితరులు,’ ‘నిబంధన,’ ‘సాక్ష్యవాక్యాలు’ వంటి బైబిలు-నిబంధన సంబంధిత పదాలను నిలుపుతూ, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం. మూలంలోని הֶבֶל పదప్రయోగం మరియు సాక్ష్యం/హెచ్చరిక మధ్య అర్థసందిగ్ధతను పాదసూచికల్లో భద్రపరిచాం.
