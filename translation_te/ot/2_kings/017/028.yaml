source:
  edition: WLC
  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: te
  text: అప్పుడు షోమ్రోను నుండి వారు చెరగా తీసుకెళ్లిన యాజకులలో ఒకడు వచ్చి బేతేలులో నివసించాడు. యాహ్వేకు[a] ఎలా భయపడాలో అతడు వారికి బోధించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’—దేవుని ప్రత్యేక నామం; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు మూలరూపం మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: యాజకులలో ఒకడు
  rationale: యాజకుల సమూహంలో ఒక వ్యక్తిని సూచించే హీబ్రూ ప్రయోగానికి ఇది నేరమైన, సహజమైన అనువాదం.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: షోమ్రోను నుండి వారు చెరగా తీసుకెళ్లిన
  rationale: הגלה అనే హిఫీల్ రూపం చెరలోకి తరలించడాన్ని సూచిస్తుంది. క్రియలోని బహువచన కర్త ఎవరో మూలపాఠం చెప్పనందున ‘వారు’ అని అనిర్దిష్టంగానే ఉంచబడింది.
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: బేతేలులో నివసించాడు
  rationale: ישב ఇక్కడ ఒక చోట నివాసం ఏర్పరచుకోవడాన్ని సూచిస్తుంది; ‘నివసించాడు’ ఆధునిక ప్రమాణ తెలుగులో సహజంగా, అతిశయార్థం లేకుండా ఉంది.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: అతడు వారికి బోధించసాగాడు
  rationale: היה + వర్తమాన కృదంత నిర్మాణం కొనసాగుతున్న లేదా పాత్రసంబంధమైన కార్యాన్ని సూచించగలదు. ‘బోధించసాగాడు’ ఆ భావాన్ని సహజమైన తెలుగు కథనంలో వ్యక్తపరుస్తుంది.
- source_word: אֵיךְ יִירְאוּ
  choice: ఎలా భయపడాలో
  rationale: ఇది యాహ్వే పట్ల భయభక్తిని ఎలా ఆచరించాలో ఇచ్చిన బోధను సూచిస్తుంది; ‘ఎలా ... పడాలో’ బోధనాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֶת יְהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చతుర్థీ విభక్తి వాడబడింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది; పాదసూచిక సంప్రదాయ అనువాదాన్ని కూడా తెలియజేస్తుంది.
- issue: ‘యాహ్వేకు భయపడడం’ అనే భావం
  choice: భయపడడం
  alternative: భయభక్తులు కలిగి ఉండడం
  rationale: ירא పదంలో భయం, విస్మయం, భక్తిపూర్వక గౌరవం వంటి భావపరిధి ఉంది. దాన్ని విస్తరించి ఒకే భావానికి పరిమితం చేయకుండా మూలానికి దగ్గరగా ‘భయపడడం’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చెరగా తీసుకెళ్లిన’ అనే ప్రయోగం బలవంతపు దేశనిర్బంధాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘భయపడడం’ అనే పదాన్ని మూలంలోని భయం–భక్తి అర్థవిస్తృతిని ముందుగానే సన్నగిల్లనివ్వకుండా నిలుపుకున్నాం.
