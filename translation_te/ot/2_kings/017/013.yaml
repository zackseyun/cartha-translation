  revised_text: 'అయినా యెహోవా ఇశ్రాయేలును, యూదాను తన ప్రవక్తలందరి ద్వారా, ప్రతి దర్శనికుని ద్వారా గంభీరంగా హెచ్చరించాడు[a]. ఆయన ఇలా అన్నాడు: “మీ చెడు మార్గాలనుంచి తిరగండి. నేను మీ పితరులకు[b] ఆజ్ఞాపించిన, నా సేవకులైన ప్రవక్తల ద్వారా[c] మీకు పంపిన[d] సమస్త ధర్మశాస్త్రం ప్రకారం నా ఆజ్ఞలను, నా కట్టడాలను పాటించండి.”'
  revised_footnotes:
