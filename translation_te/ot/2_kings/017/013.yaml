revisions:
- from: 'అయినా యెహోవా తన ప్రతి ప్రవక్త ద్వారా, ప్రతి దీర్ఘదర్శి ద్వారా ఇశ్రాయేలును యూదాను గంభీరంగా హెచ్చరిస్తూ[a] ఇలా అన్నాడు: “మీ చెడు మార్గాలనుంచి తిరగండి. నేను మీ పితరులకు[b] ఆజ్ఞాపించి, నా సేవకులైన ప్రవక్తల ద్వారా[c] మీకు పంపిన ధర్మశాస్త్రమంతటి ప్రకారం నా ఆజ్ఞలను, నా కట్టడలను పాటించండి.”[d]'
