    rationale: ఈ పదబంధం ఆధునిక తెలుగులో అసహజం. ‘నేను మీ పితరులకు ఆజ్ఞాపించిన, ... మీకు పంపిన సమస్త ధర్మశాస్త్రం ప్రకారం’ అని చేస్తే హీబ్రూ సంబంధ వాక్యాల అనుసంధానం స్పష్టమవుతుంది; పంపబడినదాని నిర్దిష్ట పూర్వపదంపై ఉన్న స్వల్ప అస్పష్టతను [d] గమనిక నిలుపుతుంది.
