    rationale: హీబ్రూ ప్రధాన క్రియ వַיָּעַד (‘హెచ్చరించాడు/సాక్ష్యమిచ్చాడు’); తరువాత לֵאמֹר ప్రత్యక్ష ఉల్లేఖనాన్ని ప్రవేశపెడుతుంది. తెలుగులో సంపూర్ణ క్రియ వాడటం మరింత నేరుగా ఉంటుంది.
