  revision_rationale: సంపూర్ణ హెచ్చరిక క్రియను పునరుద్ధరించి, ప్రవక్తలు మరియు దర్శనికుల ద్వారా జరిగిన మధ్యవర్తిత్వాన్ని సహజ తెలుగు క్రమంలో ఇచ్చాం. ధర్మశాస్త్రాన్ని విశేషించే రెండు సంబంధ వాక్యాలను దాని ముందే ఉంచాం. [d]ను ‘పంపిన’ వద్ద ఉంచి, ఆ సంబంధ వాక్యపు పూర్వపదంపై ఉన్న వ్యాఖ్యానాత్మక విస్తృతిని అనవసరంగా నిర్ణయించకుండా కాపాడాం.
