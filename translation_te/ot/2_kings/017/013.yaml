  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: te
  text: 'అయినా యెహోవా ఇశ్రాయేలును, యూదాను తన ప్రవక్తలందరి ద్వారా, ప్రతి దర్శనికుని ద్వారా గంభీరంగా హెచ్చరించాడు[a]. ఆయన ఇలా అన్నాడు: “మీ చెడు మార్గాలనుంచి తిరగండి. నేను మీ పితరులకు[b] ఆజ్ఞాపించిన, నా సేవకులైన ప్రవక్తల ద్వారా[c] మీకు పంపిన[d] సమస్త ధర్మశాస్త్రం ప్రకారం నా ఆజ్ఞలను, నా కట్టడాలను పాటించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలుకు, యూదాకు వ్యతిరేకంగా సాక్ష్యమిచ్చాడు.” హీబ్రూ క్రియ గంభీరమైన హెచ్చరిక లేదా సాక్ష్యం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “మీ పితరులు” అనే మాటను “మీ పూర్వీకులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నా సేవకులైన ప్రవక్తల చేతి ద్వారా.”
    reason: lexical_alternative
  - marker: d
    text: “మీకు పంపిన” అనేది ప్రధానంగా ధర్మశాస్త్రం లేదా నిబంధన బోధను సూచిస్తున్నట్లు కనిపిస్తుంది; అయితే ప్రవక్తల ద్వారా వచ్చిన సందేశాన్ని మరింత విస్తృతంగా కూడా సూచించవచ్చు.
    reason: theological_ambiguity
lexical_decisions:
- source_word: וַיָּעַד
  choice: గంభీరంగా హెచ్చరిస్తూ
  rationale: హిఫిల్ రూపంలోని ఈ క్రియ గంభీరంగా హెచ్చరించడం లేదా సాక్ష్యమివ్వడం అనే భావాలను కలిగి ఉంది. వెంటనే వచ్చే పశ్చాత్తాప పిలుపు, విస్తృత సందర్భంలోని తీర్పు దృష్ట్యా ‘గంభీరంగా హెచ్చరిస్తూ’ సహజంగా ప్రధాన భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: ఇశ్రాయేలును యూదాను
  rationale: ב ఉపసర్గ ఇక్కడ హెచ్చరిక ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; తెలుగు ప్రత్యక్ష కర్మరూపం భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּיַד כָּל־נְבִיאוֹ כָּל־חֹזֶה
  choice: తన ప్రతి ప్రవక్త ద్వారా, ప్రతి దీర్ఘదర్శి ద్వారా
  rationale: ביד అనే సాధనార్థక నుడికారాన్ని ‘ద్వారా’గా అనువదించింది. పునరుక్త כָּל యొక్క పంపిణీ భావాన్ని ‘ప్రతి ... ప్రతి ...’గా నిలిపి, ప్రవక్త మరియు దీర్ఘదర్శి అనే వేర్వేరు పదాలను కలపలేదు.
- source_word: חֹזֶה
  choice: దీర్ఘదర్శి
  rationale: దర్శనాలను చూసే ప్రవచనాత్మక వ్యక్తిని సూచించే ప్రత్యేక చారిత్రక పదంగా ‘దీర్ఘదర్శి’ సరిపోతుంది.
- source_word: שֻׁבוּ
  choice: తిరగండి
  rationale: שׁוב యొక్క ప్రాథమిక భావం తిరగడం/తిరిగి రావడం. ‘చెడు మార్గాలనుంచి’ అనే పదబంధంతో ‘తిరగండి’ నేరుగా, సహజంగా సరిపోతుంది; ‘పశ్చాత్తాపపడండి’ కంటే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: మీ చెడు మార్గాలనుంచి
  rationale: דרך యొక్క నైతిక రూపకాన్ని ‘మార్గాలు’గా, רע యొక్క అర్థాన్ని ‘చెడు’గా సూటిగా నిలిపింది.
- source_word: וְשִׁמְרוּ
  choice: పాటించండి
  rationale: నిబంధనాత్మక, ధర్మశాస్త్ర సందర్భంలో שמר అంటే ఆజ్ఞలను జాగ్రత్తగా ఆచరించడం; ఆధునిక తెలుగులో ‘పాటించండి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: מִצְוֺתַי חֻקּוֹתַי
  choice: నా ఆజ్ఞలను, నా కట్టడలను
  rationale: మూలంలోని రెండు వేర్వేరు న్యాయపదాలను కలపకుండా ‘ఆజ్ఞలు’, ‘కట్టడలు’గా నిలిపింది.
- source_word: כְּכָל הַתּוֹרָה
  choice: ధర్మశాస్త్రమంతటి ప్రకారం
  rationale: ఆజ్ఞలు, కట్టడలు ఉన్న నిబంధన సందర్భంలో תורהకు ‘ధర్మశాస్త్రం’ అనుకూలం; כָּל యొక్క సమగ్ర భావాన్ని ‘అంతటి’ తెలియజేస్తుంది.
- source_word: אֲשֶׁר צִוִּיתִי אֶת־אֲבֹתֵיכֶם
  choice: నేను మీ పితరులకు ఆజ్ఞాపించి
  rationale: אבות యొక్క పురుషలింగ, నిబంధన-చారిత్రక సూచనను ‘పితరులు’గా నిలిపింది; అది విస్తృతంగా పూర్వీకులను కూడా సూచించగలదని గమనికలో తెలిపింది.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: నా సేవకులైన ప్రవక్తల ద్వారా మీకు పంపిన
  rationale: రెండవ సంబంధ వాక్యాన్ని ధర్మశాస్త్రం/నిబంధన బోధతో అనుసంధానిస్తూ, בידను ‘ద్వారా’గా మరియు עבדי הנביאיםను ‘నా సేవకులైన ప్రవక్తలు’గా సహజంగా అందించింది.
theological_decisions:
- issue: ‘మీకు పంపిన’ అనే సంబంధ వాక్యానికి పూర్వపదం
  choice: ఇది ప్రధానంగా ధర్మశాస్త్రం లేదా నిబంధన బోధను సూచించేలా వాక్య నిర్మాణం చేయబడింది.
  alternative: ఇది ప్రవక్తల సందేశాలన్నిటినీ విస్తృతంగా సూచించవచ్చు; లేదా ‘తిరగండి, పాటించండి’ అనే ఆదేశాన్ని మళ్లీ సూచించవచ్చు.
  rationale: హీబ్రూ వాక్యనిర్మాణంలో రెండు సంబంధ వాక్యాలు ‘ధర్మశాస్త్రం’తో సహజంగా అనుసంధానమవుతాయి. అయినా ప్రవక్తల ద్వారా పంపబడినది నిబంధన బోధనా, విస్తృత ప్రవచన సందేశమా అనే భావ విస్తృతిని పూర్తిగా మూసివేయకుండా [d] గమనికలో ప్రత్యామ్నాయాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘యెహోవా’, ‘ధర్మశాస్త్రం’, ‘ప్రవక్త’, ‘దీర్ఘదర్శి’, ‘కట్టడాలు’ వంటి చారిత్రక-నిబంధన పదజాలాన్ని నిలిపి, వాక్యాన్ని సహజమైన తెలుగు క్రమంలో అమర్చింది.
