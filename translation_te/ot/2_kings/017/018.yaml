  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: te
  text: యెహోవా ఇశ్రాయేలుపై ఎంతో కోపగొని, వారిని తన ముఖం ఎదుటనుండి తొలగించాడు[a]. యూదా గోత్రం మాత్రమే మిగిలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సన్నిధి నుండి.’ హెబ్రీయులో అక్షరార్థంగా, ‘తన ముఖం ఎదుట నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: ఎంతో కోపగించి
  rationale: హిత్పయేల్ క్రియలోని తీవ్ర కోపాన్ని מְאֹד మరింత బలపరుస్తుంది. ‘ఎంతో కోపగించి’ అనేది సహజమైన ఆధునిక తెలుగు రూపం; మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించడం ద్వారా దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలుపుతున్నాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: కోపాన్ని తెలిపే క్రియతో ב ఆ కోపం ఎవరిపై ఉందో సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలుపై’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיְסִרֵם
  choice: వారిని ... తొలగించాడు
  rationale: סור యొక్క కారణార్థక రూపం ‘తొలగించడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో చెరను సూచించినా, ఆ వివరణను క్రియలోనే అదనంగా చేర్చకుండా మూలార్థాన్ని ఉంచుతుంది.
- source_word: מֵעַל פָּנָיו
  choice: తన ముఖం ఎదుట నుండి
  rationale: హెబ్రీయులోని స్పష్టమైన ‘అతని ముఖం ఎదుట నుండి’ అనే మానవరూపక భాషను సాధ్యమైనంత సహజమైన తెలుగులో నిలుపుతుంది; ‘తన సన్నిధి నుండి’ అనే భావానువాదాన్ని పాదసూచికలో ఇస్తున్నాం.
- source_word: לֹא נִשְׁאַר רַק
  choice: '... తప్ప మరేదీ మిగలలేదు'
  rationale: నిషేధ వాక్యం తరువాత רַק మినహాయింపును సూచిస్తుంది. ఈ తెలుగు నిర్మాణం సమూహార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: యూదా గోత్రం ఒక్కటే
  rationale: ‘గోత్రం’ అనే పదం שֵׁבֶט‌కు సాధారణ సమానం; ‘ఒక్కటే’ לְבַדּוֹ లోని ఏకైకంగా మిగిలినదనే ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: מֵעַל פָּנָיו లో దేవుని సన్నిధిని తెలిపే మానవరూపక వ్యక్తీకరణ
  choice: తన ముఖం ఎదుట నుండి
  alternative: తన సన్నిధి నుండి
  rationale: మూలంలోని దృశ్యమయమైన మానవరూపక భాషను ప్రధాన పాఠ్యంలో నిలుపడం దాని నిబంధనాత్మక, సంబంధాత్మక తీవ్రతను కాపాడుతుంది; సహజమైన భావానువాదాన్ని పాదసూచికలో అందిస్తున్నాం.
- issue: ఈ సందర్భంలో ‘ఇశ్రాయేలు’ అనే పదం సూచించేది
  choice: తీర్పుకు గురైన ఉత్తర రాజ్యపు ప్రజలు
  alternative: విస్తృత అర్థంలో మొత్తం నిబంధన ప్రజలు
  rationale: 2 రాజులు 17 అధ్యాయం తక్షణ సందర్భం ఉత్తర రాజ్య పతనం, చెర. అయితే అనువాదంలో వివరణను చొప్పించకుండా ‘ఇశ్రాయేలు’ అనే మూలపదాన్నే ఉంచడం ద్వారా అవసరానికి మించిన వ్యాఖ్యానాన్ని నివారిస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ముఖం ఎదుట’ అనే మూలభాషా రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; పాఠకునికి మరింత సహజమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
