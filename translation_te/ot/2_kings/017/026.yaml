source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: te
  text: 'అప్పుడు వారు అష్షూరు రాజుతో ఇలా చెప్పారు: “నీవు చెరగా తరలించి సమరయ పట్టణాల్లో స్థిరపరచిన జాతులవారికి ఆ దేశపు దేవుని[a] ఆరాధనా నియమం[b] తెలియదు. అందుచేత ఆయన వారి మధ్యకు సింహాలను పంపాడు; ఇదిగో, అవి వారిని చంపుతున్నాయి. ఎందుకంటే వారికి ఆ దేశపు దేవుని ఆరాధనా నియమం తెలియదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాటలు ఇశ్రాయేలు దేవుణ్ణి సూచించవచ్చు; అయితే మాట్లాడేవారు ఆయనను ఆ దేశానికి సంబంధించిన దేవునిగా భావించిన దృక్కోణాన్ని ఈ పదబంధం నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: ‘ఆరాధనా నియమం’ అనే మాటను ‘ఆరాధనా విధానం,’ ‘ఆచారం,’ లేదా ‘నిర్దేశిత పద్ధతి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: జాతులవారు
  rationale: అష్షూరు రాజు బలవంతంగా తరలించి స్థిరపరచిన అనేక జాతి సమూహాలను సూచిస్తుంది; ‘అన్యజనులు’ అనే తరువాతి మతపరమైన భావాన్ని రానివ్వదు.
- source_word: הִגְלִיתָ
  choice: నీవు చెరగా తరలించి
  rationale: గלה హిఫీల్ రూపంలోని బలవంతపు దేశబహిష్కరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתּוֹשֶׁב
  choice: స్థిరపరచిన
  rationale: కొత్త ప్రాంతంలో నివసించేలా చేసిన causative భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: సమరయ పట్టణాల్లో
  rationale: ఇక్కడ సమరయను ఒకే నగరంగా కాక దాని ప్రాంతంలోని పట్టణాల సమాహారంగా చూపే బహువచనాన్ని కాపాడుతుంది.
- source_word: מִשְׁפַּט
  choice: ఆరాధనా నియమం
  rationale: ఈ సందర్భంలో న్యాయతీర్పు కంటే ఆ ప్రాంతపు దేవుణ్ణి ఆరాధించడానికి నిర్దేశించబడిన విధి లేదా ఆచారాన్ని సూచిస్తుంది. ‘నియమం’ మూలంలోని అధికారిక భావాన్ని, ‘ఆరాధనా’ సందర్భార్థాన్ని స్పష్టం చేస్తాయి.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: ఆ దేశపు దేవుని
  rationale: వలసగా వచ్చినవారి ప్రాంతాధారిత దేవతా అవగాహనను ప్రతిబింబిస్తూనే, సూచించబడినవాడు ఇశ్రాయేలు దేవుడే కావచ్చనే అంశాన్ని తెలుగులో బలవంతంగా తీర్మానించదు.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: అందుచేత ఆయన వారి మధ్యకు సింహాలను పంపాడు
  rationale: వక్తల కారణ-ఫలిత వివరణను ‘అందుచేత’ సహజంగా తెలియజేస్తుంది; בם భావాన్ని ‘వారి మధ్యకు’ ప్రతిబింబిస్తుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో, అవి
  rationale: הִנֵּה యొక్క సజీవమైన దృష్టి ఆకర్షణను గౌరవప్రదమైన, ఇప్పటికీ అర్థమయ్యే తెలుగులో నిలుపుతుంది; బహువచన సూచన సింహాలవైపు తిరుగుతుంది.
- source_word: מְמִיתִים אוֹתָם
  choice: వారిని చంపుతున్నాయి
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్యను వర్తమాన ప్రగతిశీల రూపంలో కాపాడుతుంది.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: ఎందుకంటే వారికి ... తెలియదు
  rationale: ఈ సందర్భంలోని కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తూ చివరి వాక్యంలోని పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ అనే పదబంధం ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుందా, లేక వక్తల దృష్టిలో ప్రాంతీయ దేవుణ్ణి సూచిస్తుందా?
  choice: ‘ఆ దేశపు దేవుడు’ అనే దృక్కోణాత్మక పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘ఆ దేశపు దేవుడైన యెహోవా’ అని స్పష్టీకరించడం
  rationale: మాట్లాడేవారు దేవుణ్ణి ఒక దేశానికి సంబంధించిన దేవునిగా అర్థం చేసుకుంటున్నారు; అయితే కథన సందర్భంలో సూచన ఇశ్రాయేలు దేవునికే. తెలుగు లిపిలో పెద్ద/చిన్న అక్షర భేదం లేనందున, మూలంలోని ఉద్వేగాన్ని వ్యాఖ్యానాత్మక పేరును చేర్చకుండా కాపాడి పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘చెరగా తరలించి,’ ‘స్థిరపరచిన,’ ‘ఆరాధనా నియమం’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, మూలంలోని బలవంతపు పునరావాసం మరియు మతాచార భావాలను కాపాడేలా ఎంపికయ్యాయి. మూలంలోని పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
