source:
  edition: WLC
  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: te
  text: వారు విగ్రహాలను[a] సేవించారు. వాటి గురించి యాహ్వే వారికి, “మీరు ఈ పని చేయకూడదు” అని ముందే చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విగ్రహాలు” అని అనువదించిన హీబ్రూ పదం גִּלֻּלִים అవమానార్థకమైనది; అది వాటిని ‘అసహ్యకరమైన విగ్రహాలు’ లేదా ‘పేడ-విగ్రహాలు’ అన్నట్లుగా తృణీకరిస్తుంది.
    reason: మూలపదంలోని బలమైన అవమానార్థక ఛాయను తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘సేవించు’ను నిలుపుతూ, ఈ సందర్భంలోని మతపరమైన ఆరాధన భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: הַגִּלֻּלִים
  choice: విగ్రహాలను
  rationale: సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన పదం. మూలపదంలోని తీవ్రమైన అవమానార్థక ఛాయను ప్రధాన వాక్యంలో అసహజంగా విస్తరించకుండా పాదసూచికలో తెలిపాం.
- source_word: אֲשֶׁר
  choice: వాటి విషయంలో
  rationale: సంబంధవాచక పదం విగ్రహాలను లేదా వాటికి సంబంధించిన ఆచరణను సూచించగల నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: אָמַר יְהוָה לָהֶם
  choice: యాహ్వే వారితో ... ముందే చెప్పాడు
  rationale: కథనంలోని వారి చర్యకు ముందు దేవుడు ఇచ్చిన ఆజ్ఞను ‘ముందే’ స్పష్టం చేస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు ... చేయకూడదు
  rationale: ప్రత్యక్ష నిషేధాజ్ఞ యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ఈ పని
  rationale: דָּבָר ఇక్కడ సూచించే నిషిద్ధ కార్యం లేదా ఆచరణను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా లిప్యంతరీకరించాం.
- issue: విగ్రహాలకు ‘సేవ చేయడం’ అనే మతపరమైన భావం
  choice: సేవించారు
  alternative: పూజించారు
  rationale: ‘సేవించారు’ మూలక్రియ యొక్క విస్తృత ఒడంబడిక సంబంధ పదప్రయోగాన్ని నిలుపుతుంది; సందర్భం దాని ఆరాధనా భావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘వాటి విషయంలో’ అనే నిర్మాణం మూలంలోని సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
