    rationale: హీబ్రూలోని సందర్భానుగుణ ఆజ్ఞ/అనుమతి భావాన్ని ‘నివసించనివ్వండి; ... బోధించనివ్వండి’ మరింత నేరుగా ప్రతిబింబిస్తుంది.
  revised_text: 'అప్పుడు అష్షూరు రాజు ఇలా ఆజ్ఞాపించాడు: “మీరు అక్కడి నుండి చెరగా తీసుకువచ్చిన యాజకులలో ఒకరిని[b] అక్కడికి పంపండి.[a] అతడు వెళ్లి అక్కడ నివసించనివ్వండి,[c] ఆ దేశపు దేవుని ఆచారాన్ని[d][e] వారికి బోధించనివ్వండి.”'
