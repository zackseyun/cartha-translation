  to: 'అప్పుడు అష్షూరు రాజు ఇలా ఆజ్ఞాపించాడు: “మీరు అక్కడి నుండి చెరగా తీసుకువచ్చిన యాజకులలో ఒకరిని[b] అక్కడికి పంపండి.[a] అతడు వెళ్లి అక్కడ నివసించనివ్వండి,[c] ఆ దేశపు దేవుని ఆచారాన్ని[d][e] వారికి బోధించనివ్వండి.”'
  rationale: అర్థంలో మార్పు చేయకుండా b పాదసూచికను అది సూచించే చెర/దేశాంతరవాసపు పదబంధం వెంట ఉంచాం. తెలుగులో అక్షర-పెద్దదనం ద్వారా ‘god/God’ భేదం సాధ్యం కానందున e పాదసూచికను అర్థవంతమైన ప్రత్యామ్నాయ గుర్తింపుగా సవరించాం. రాజాజ్ఞలోని తరువాతి ఆదేశాల భావాన్ని సహజంగా వ్యక్తం చేయడానికి క్రియలను ‘నివసించనివ్వండి ... బోధించనివ్వండి’గా మార్చాం.
