source:
  edition: WLC
  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: te
  text: 'అప్పుడు అష్షూరు రాజు ఇలా ఆజ్ఞాపించాడు: “మీరు అక్కడి నుండి చెరగా తీసుకువచ్చిన యాజకులలో ఒకరిని[b] అక్కడికి పంపండి.[a] అతడు వెళ్లి అక్కడ నివసించనివ్వండి,[c] ఆ దేశపు దేవుని ఆచారాన్ని[d][e] వారికి బోధించనివ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడికి తీసుకెళ్లండి” లేదా “అక్కడికి తీసుకురండి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు అక్కడి నుండి దేశాంతరవాసులుగా తరలించిన.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ఇక్కడ “వారు వెళ్లి,” “వారు నివసించి” అని బహువచన క్రియలు ఉన్నాయి. అయితే “యాజకులలో ఒకరు” అనే ముందరి మాట, తరువాత వచ్చే “అతడు వారికి బోధించనివ్వండి” అనే ఏకవచన భావం వల్ల ప్రధాన పాఠం ఏకవచనంగా అనువదించబడింది.
    reason: textual_variant
  - marker: d
    text: లేదా, “ఆ దేశపు దేవుని నియమాన్ని” లేదా “విధిని.”
    reason: lexical_alternative
  - marker: e
    text: ఈ పదబంధాన్ని ఇశ్రాయేలు దేవుణ్ణి సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం అష్షూరు రాజు దృష్టిలోని ప్రాంతీయ దేవత భావాన్ని ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ రాజాజ్ఞ యొక్క అధికారపూర్వక బలాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఆజ్ఞాపించాడు’ సహజంగా, గంభీరంగా ఉంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: హీబ్రూ సంధాన నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; విడిగా ‘అంటూ’ చేర్చడం అవసరం లేదు.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: అక్కడికి పంపండి
  rationale: הלК యొక్క హిఫిల్ రూపం ‘వెళ్లేలా చేయండి’ అనే భావాన్ని కలిగి ఉంది. రాజు తన అధికారులకు ఇచ్చిన ఆదేశ సందర్భంలో ‘పంపండి’ సహజంగా ఉంది; ‘తీసుకెళ్లండి/తీసుకురండి’ కూడా సాధ్యమైనందున పాదసూచికలో ఉంచాం.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: యాజకులలో ఒకరిని
  rationale: భాగసూచక నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: మీరు అక్కడి నుండి చెరగా తీసుకువచ్చిన
  rationale: גלה హిఫిల్ బలవంతపు దేశాంతరవాసం లేదా చెరగా తరలింపును సూచిస్తుంది. తెలుగు బైబిలు సందర్భంలో ‘చెరగా తీసుకువచ్చిన’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: అతడు వెళ్లి అక్కడ నివసించి
  rationale: మసొరెటిక్ పాఠంలో క్రియలు బహువచనంలో ఉన్నా, ముందున్న ‘ఒకరు’ మరియు తరువాతి ఏకవచన క్రియ సందర్భార్థాన్ని ఏకవచనంగా సూచిస్తున్నాయి. ప్రధాన పాఠంలో ఆ భావాన్ని అనుసరించి, రూపభేదాన్ని పాదసూచికలో నమోదు చేశాం.
- source_word: וְיֹרֵם
  choice: వారికి బోధించాలి
  rationale: ירה హిఫిల్ ఇక్కడ మతపరమైన విధి లేదా ఆచరణను నేర్పడాన్ని సూచిస్తుంది; -ם ప్రత్యయం బోధింపబడే ప్రజలను సూచిస్తుంది.
- source_word: מִשְׁפַּט
  choice: ఆచారాన్ని
  rationale: ఈ సందర్భంలో מִשְׁפַּט కేవలం శాసనాన్ని కాక, స్థానిక దేవతకు సంబంధించిన నిర్దేశిత ఆరాధనా విధానాన్ని సూచిస్తుంది. ‘ఆచారం’ ఆ ప్రాయోగిక మతపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: ఆ దేశపు దేవుని
  rationale: అష్షూరు రాజు ఒక ప్రాంతీయ దేవత అనే దృష్టితో మాట్లాడుతున్న సందర్భాన్ని ‘దేవుడు’ ప్రతిబింబిస్తుంది. అదే సమయంలో ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడనే పఠనం సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ అనే పదబంధంలో దేవుని గుర్తింపు
  choice: ఆ దేశపు దేవుని
  alternative: ఆ దేశపు దేవుడైన యెహోవా యొక్క / ఆ దేశపు దేవుని (ఇశ్రాయేలు దేవునిగా స్పష్టీకరించి చదవడం)
  rationale: మాట్లాడుతున్న అష్షూరు రాజు దృష్టిలో దేవతలు ప్రాంతాలకు అనుబంధమైనవారు. ప్రధాన అనువాదం ఆ దృక్కోణాన్ని కాపాడుతుంది; కథకుని స్థాయి నుండి గుర్తింపును ముందుగానే నిర్ణయించదు.
- issue: וְיֵלְכוּ / וְיֵשְׁבוּ లోని బహువచనం మరియు ‘ఒక యాజకుడు’ అనే ఏకవచనం మధ్య అసమతుల్యత
  choice: 'సందర్భార్థానుసారం ఏకవచనం: ‘అతడు వెళ్లి అక్కడ నివసించి’'
  alternative: 'రూపాన్ని యథాతథంగా ఉంచి: ‘వారు వెళ్లి అక్కడ నివసించి’'
  rationale: ముందున్న ‘యాజకులలో ఒకరు’ మరియు తరువాతి וְיֹרֵם అనే ఏకవచన క్రియ ఉద్దేశిత భావం ఏకవచనమని బలంగా సూచిస్తాయి. అయినప్పటికీ హీబ్రూ రూపంలోని ఉద్రిక్తతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘యాజకుడు,’ ‘చెరగా,’ ‘ఆచారం’ వంటి విస్తృతంగా తెలిసిన బైబిలు పదజాలాన్ని ఉపయోగించాం. ప్రత్యక్ష వాక్యంలో ఆజ్ఞార్థాన్ని తెలుగులో సహజంగా ‘పంపండి ... బోధించాలి’ అని రూపొందించాం.
