  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֶת פְּסִֽילֵי/הֶ֖ם הָי֣וּ עֹֽבְדִ֑ים גַּם בְּנֵי/הֶ֣ם וּ/בְנֵ֣י בְנֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עָשׂ֤וּ אֲבֹתָ/ם֙ הֵ֣ם עֹשִׂ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: te
  text: కాబట్టి ఈ జనాలు యెహోవాకు భయపడేవారు, తమ చెక్కిన ప్రతిమలను[a] సేవించేవారు. వారి పిల్లలు, వారి పిల్లల పిల్లలు కూడా తమ పూర్వికులు చేసినట్లే నేటివరకు చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమ విగ్రహాలను.” హీబ్రూ పదం ప్రత్యేకంగా చెక్కి చేసిన ప్రతిమలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: కాబట్టి ... వచ్చారు
  rationale: వావ్-కన్సిక్యూటివ్ ఇక్కడ ఈ విభాగానికి ఫలితాత్మక సారాంశాన్ని ముందుకు తెస్తుంది; ‘కాబట్టి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలు
  rationale: సమరయలో స్థిరపరచబడిన విదేశీ జాతి సమూహాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ జనాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: యెహోవాకు భయపడుతూ
  rationale: దైవనామంతో వచ్చే ירא అనే మతపరమైన భయభక్తి పదబంధాన్ని కేవలం ‘గౌరవిస్తూ’ అని కుదించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: తమ చెక్కిన ప్రతిమలను
  rationale: פְּסִילִים ప్రత్యేకంగా చెక్కి చేసిన ఆరాధనా ప్రతిమలను సూచిస్తుంది; ‘విగ్రహాలు’ అనే భావానువాదం కంటే మూలపద రూపాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הָיוּ עֹבְדִים
  choice: సేవిస్తూ వచ్చారు
  rationale: పెరిఫ్రాస్టిక్ నిర్మాణంలోని నిరంతర, అలవాటైన ఆచరణ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘ఆరాధిస్తూ’ కంటే עבד యొక్క సేవ భావాన్ని నిలుపుతుంది.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: వారి పిల్లలు, వారి పిల్లల పిల్లలు కూడా
  rationale: తరతరాల కొనసాగింపును సూచించే హీబ్రూ పునరుక్త నిర్మాణాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: తమ పూర్వికులు చేసినట్టే
  rationale: אבותם ఇక్కడ గత తరాల పితరులను సూచిస్తుంది; ‘పూర్వికులు’ సమగ్రంగా, సహజంగా ఉంది.
- source_word: הֵם עֹשִׂים
  choice: చేస్తూ ఉన్నారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ఆచరణ భావాన్ని నిలుపుతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: హీబ్రూ కాలసూచక సూత్రానికి నేరమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: యెహోవాకు భయపడటమూ చెక్కిన ప్రతిమలను సేవించటమూ ఒకేసారి చెప్పబడటం
  choice: రెండు ఆచరణలనూ ఎలాంటి వివరణాత్మక తీర్పు లేకుండా సమాంతరంగా ఉంచడం
  alternative: వారు యెహోవాను నిజంగా ఆరాధించలేదని లేదా కేవలం నటించారని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం వారి భయం నిజమైనదా, బాహ్యమైనదా, మిశ్రమ ఆరాధనలో భాగమా అనే విషయాన్ని తేల్చదు. అనువాదం ఆ వేదాంత ఉద్రిక్తతను అలాగే కాపాడుతుంది.
- issue: וְ సంధికి విరోధార్థం ఇవ్వాలా
  choice: తెలుగులో రెండు అసంపూర్ణ క్రియలను కలిపి సహజమైన సమాంతర నిర్మాణం వాడడం
  alternative: ‘అయినా’ లేదా ‘కాని’ అని స్పష్టమైన విరోధార్థక సంధి చేర్చడం
  rationale: సందర్భంలో విరోధ భావం ఉన్నప్పటికీ, హీబ్రూలో సాధారణ וְ ఉంది. తెలుగు వాక్య నిర్మాణమే ఉద్రిక్తతను తెలియజేయగలదు కాబట్టి అదనపు వ్యాఖ్యానాత్మక సంధిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన బైబిలు శైలిని కాపాడుతూ రూపొందించబడింది. తరతరాల హీబ్రూ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపింది.
