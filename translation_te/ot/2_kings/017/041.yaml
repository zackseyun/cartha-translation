revisions:
- from: కాబట్టి ఈ జనాలు యెహోవాకు భయపడుతూ, తమ చెక్కిన ప్రతిమలను[a] సేవిస్తూ వచ్చారు. వారి పిల్లలు, వారి పిల్లల పిల్లలు కూడా తమ పూర్వికులు చేసినట్టే ఈ రోజు వరకు చేస్తూ ఉన్నారు.
  to: కాబట్టి ఈ జనాలు యెహోవాకు భయపడేవారు, తమ చెక్కిన ప్రతిమలను[a] సేవించేవారు. వారి పిల్లలు, వారి పిల్లల పిల్లలు కూడా తమ పూర్వికులు చేసినట్లే నేటివరకు చేస్తున్నారు.
  rationale: The revision retains the source’s juxtaposition of fearing Yahweh and serving carved images without judging the nature of that fear. It improves the representation of the Hebrew’s habitual and continuing verbal aspect and clarifies the subject of the final clause. The footnote remains correctly anchored to “చెక్కిన ప్రతిమలను” and preserves the lexical alternative.
