    text: లేదా “తమ విగ్రహాలను.” హీబ్రూ పదం ప్రత్యేకంగా చెక్కి చేసిన ప్రతిమలను సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s juxtaposition of fearing Yahweh and serving carved images without judging the nature of that fear. It improves the representation of the Hebrew’s habitual and continuing verbal aspect and clarifies the subject of the final clause. The footnote remains correctly anchored to “చెక్కిన ప్రతిమలను” and preserves the lexical alternative.
