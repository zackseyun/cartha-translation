id: 2KI.17.7
reference: 2 Kings 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: te
  text: ఇది జరిగింది, ఎందుకంటే ఇశ్రాయేలీయులు తమ దేవుడైన యాహ్వేకు విరోధంగా పాపం చేశారు; ఆయనే వారిని ఈజిప్టు దేశం నుండి, ఈజిప్టు రాజైన ఫరో చేతి కిందనుండి[a] బయటకు తీసుకొచ్చాడు; వారు ఇతర దేవుళ్లకు భయభక్తులు చూపారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫరో అధికారంలోనుండి.” హీబ్రూలో అక్షరార్థంగా “ఫరో చేతి కిందనుండి” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇతర దేవుళ్లను ఆరాధించారు.” హీబ్రూలోని పదానికి ప్రాథమికంగా భయపడటం లేదా భయభక్తి చూపడం అనే అర్థం ఉంది; ఇక్కడ ఆరాధనాత్మక విధేయత కూడా భావంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ఇదంతా జరిగింది, ఎందుకంటే
  rationale: కథనంలో ముందుగా చెప్పిన పరిణామానికి కారణాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణం. కారణార్థాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజంగా అనువదించబడింది.
- source_word: חָטְאוּ ... לַיהוָה
  choice: యాహ్వేకు విరోధంగా పాపం చేశారు
  rationale: חטא క్రియతో ל ఉపసర్గ ఇక్కడ ‘ఎవరికి విరోధంగా పాపం చేయడం’ అనే భావాన్ని ఇస్తుంది. పాపం అనే నైతిక-ఒడంబడిక భావాన్ని నిలుపుకుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు/సంతానం’; జాతీయ సమూహాన్ని సూచించే ఈ పదబంధానికి ఆధునిక తెలుగులో సహజమైన రూపం ‘ఇశ్రాయేలీయులు’.
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: తమ దేవుడైన యాహ్వే
  rationale: దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించి, ‘వారి దేవుడు’ అనే ఒడంబడిక సంబంధాన్ని తెలుగులో సహజంగా తెలిపేందుకు ఆత్మవాచకమైన ‘తమ’ వాడబడింది.
- source_word: הַמַּעֲלֶה אֹתָם
  choice: ఆయనే వారిని ... బయటకు తీసుకొచ్చాడు
  rationale: కర్తను ప్రత్యేకంగా వర్ణించే participle యాహ్వే చేసిన విమోచన కార్యాన్ని సూచిస్తుంది. ‘ఆయనే’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; సందర్భంలో దేశం నుంచి తీసుకురావడం కావడంతో ‘బయటకు తీసుకొచ్చాడు’ సహజం.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఈజిప్టు దేశం నుండి
  rationale: ఆధునిక తెలుగు పాఠకులకు సులభంగా గుర్తుపడే ప్రస్తుత స్థలనామాన్ని ఉపయోగించింది.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: ఫరో చేతి కిందనుండి
  rationale: ‘చేతి కింద’ అనే హీబ్రూ అధికార-ఆధిపత్య రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుకుంది; దాని భావార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: వారు ఇతర దేవుళ్లకు భయపడ్డారు
  rationale: ירא యొక్క ప్రాథమిక ‘భయపడు/భయభక్తి చూపు’ భావాన్ని నిలుపుకుంది. సందర్భంలో ఆరాధనాత్మక భక్తి ఇమిడి ఉన్నా, ప్రధాన పాఠ్యంలో దానిని ‘ఆరాధించారు’గా సంకుచితం చేయలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: ఇతర దేవుళ్లను ‘భయపడడం’ అనే పదబంధం
  choice: ఇతర దేవుళ్లకు భయపడ్డారు
  alternative: ఇతర దేవుళ్లను ఆరాధించారు / ఇతర దేవుళ్ల పట్ల భయభక్తులు చూపారు
  rationale: మూలంలోని ירא క్రియకు ఉన్న నిజమైన విస్తృతిని, ఆరాధనతో కూడిన భయభక్తి మరియు భయం మధ్యనున్న భావ ఉద్రిక్తతను నిలుపుకుంది; సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించినప్పటికీ, కారణ సంబంధం మరియు క్రియల క్రమం నిలుపుకున్నాయి. ‘అయినా’ అనే అనుసంధానం విమోచన కార్యానికి విరుద్ధంగా జరిగిన విగ్రహభక్తిని సహజంగా వ్యక్తం చేస్తుంది.
