revisions:
- from: ఇదంతా జరిగింది, ఎందుకంటే ఇశ్రాయేలీయులు తమ దేవుడైన యాహ్వేకు విరోధంగా పాపం చేశారు. ఆయనే వారిని ఈజిప్టు దేశం నుండి, ఈజిప్టు రాజైన ఫరో చేతి కిందనుండి[a] బయటకు తీసుకొచ్చాడు. అయినా వారు ఇతర దేవుళ్లకు భయపడ్డారు[b].
  to: ఇది జరిగింది, ఎందుకంటే ఇశ్రాయేలీయులు తమ దేవుడైన యాహ్వేకు విరోధంగా పాపం చేశారు; ఆయనే వారిని ఈజిప్టు దేశం నుండి, ఈజిప్టు రాజైన ఫరో చేతి కిందనుండి[a] బయటకు తీసుకొచ్చాడు; వారు ఇతర దేవుళ్లకు భయభక్తులు చూపారు[b].
  rationale: హీబ్రూలో లేని ‘అయినా’ను తొలగించాను. ירא యొక్క విస్తృతమైన ‘భయపడు/భయభక్తి చూపు’ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘భయభక్తులు చూపారు’ను వాడాను; పాదసూచికలో ‘ఆరాధించారు’ అనే సందర్భానుకూల ప్రత్యామ్నాయాన్ని ఉంచాను. మిగిలిన పదజాలం మరియు ఫరో ‘చేయి కింద’ రూపకం మూలానికి నమ్మకంగా ఉన్నాయి.
