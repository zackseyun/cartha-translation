id: 2KI.17.17
reference: 2 Kings 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: te
  text: వారు తమ కుమారులను, కుమార్తెలను అగ్నిగుండా దాటించారు[a]; జోస్యాలు చెప్పారు, శకునాలను అర్థం చేసుకున్నారు. యాహ్వే దృష్టిలో చెడైనది చేయడానికి తమను తాము అమ్ముకొని, ఆయనకు కోపం రేపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, “తమ కుమారులను, కుమార్తెలను అగ్నిలో బలిగా అర్పించారు.” హీబ్రూ నుడికారం అక్షరార్థంగా “అగ్నిగుండా దాటించారు” అని ఉంది.
    reason: పిల్లల బలిని సూచించే అవకాశమున్న హీబ్రూ నుడికారపు అక్షరార్థాన్నీ, సందర్భానుసారమైన స్పష్టార్థాన్నీ తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: అగ్నిగుండా దాటించారు
  rationale: హీబ్రూ ప్రయోగంలోని ‘అగ్నిగుండా దాటించడం’ అనే రూపాన్ని నిలుపుతూ, అది సూచించే బలి లేదా అగ్ని ఆచారాన్ని ప్రధాన పాఠ్యంలో అవసరానికి మించి నిర్దిష్టం చేయలేదు.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: తమ కుమారులను, కుమార్తెలను
  rationale: మూలంలో కుమారులు, కుమార్తెలు ఇద్దరినీ స్పష్టంగా పేర్కొన్నందున సాధారణీకరించకుండా అలాగే ఉంచాం.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: శకునాలు చెప్పే విద్యను అభ్యసించారు
  rationale: సజాతీయ క్రియా-నామ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, నిషిద్ధ భవిష్యజ్ఞాన ఆచార భావాన్ని నిలిపాం.
- source_word: וַיְנַחֵשׁוּ
  choice: సూచనలను బట్టి శకునాలు చెప్పారు
  rationale: గమనించిన సూచనలు లేదా సంకేతాలను అర్థం చేసుకొని శకునం చెప్పడాన్ని సూచిస్తుంది; ముందున్న విస్తృత భవిష్యజ్ఞాన పదం నుండి తగిన భేదం ఉంచుతుంది.
- source_word: וַיִּתְמַכְּרוּ
  choice: తమను తాము అమ్ముకొని
  rationale: చెడుకు స్వచ్ఛందంగా దాసులైనట్లు చూపే మూలంలోని బలమైన రూపకాన్ని మృదువుచేయకుండా నిలిపాం.
- source_word: לַעֲשׂוֹת הָרַע
  choice: చెడైనది చేయడానికి
  rationale: హీబ్రూ వాక్యభావాన్ని సహజమైన తెలుగులో తెలిపే సాధారణ ప్రయోగం.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: దేవుని నైతిక మదింపు అనే హీబ్రూ నుడికారాన్ని సహజంగా నిలిపే తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణతో వ్యక్తం చేశాం.
- source_word: לְהַכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టించారు
  rationale: హిఫిల్ క్రియలోని కారణార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పిల్లలను అగ్నిగుండా దాటించే ఆచారం స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘అగ్నిగుండా దాటించారు’ అనే హీబ్రూ నుడికారాన్ని నిలిపాం.
  alternative: ‘తమ కుమారులను, కుమార్తెలను అగ్నిలో బలిగా అర్పించారు’
  rationale: సందర్భం పిల్లల బలిని బలంగా సూచించినా, హీబ్రూ పదబంధం ఆచార రూపాన్ని అంత స్పష్టంగా నిర్వచించదు. అందువల్ల ప్రధాన పాఠ్యంలో అస్పష్టతను కాపాడి, సాధ్యమైన స్పష్టార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని వరుస క్రియలు, నైతిక తీవ్రత, ‘తమను తాము అమ్ముకొని’ అనే రూపకం నిలుపబడ్డాయి.
