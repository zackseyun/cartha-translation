id: 2KI.17.19
reference: 2 Kings 17:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: te
  text: యూదావారు కూడా[a] తమ దేవుడైన యాహ్వే ఆజ్ఞలను పాటించలేదు; ఇశ్రాయేలు ఏర్పరచిన కట్టడల ప్రకారం నడుచుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదావారు సైతం’ అని కూడా అనువదించవచ్చు. ఇశ్రాయేలు మాత్రమే కాదు, యూదావారు కూడా దోషులని వాక్యారంభ పదం నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు కట్టడలను అనుసరించి నడుచుకున్నారు’ లేదా ‘ఇశ్రాయేలు ఆచరించిన ఆచారాలను అనుసరించారు’ అని కూడా అనువదించవచ్చు. మూలక్రియకు ఇక్కడ ‘ఏర్పరచడం’ లేదా ‘ఆచరించడం’ అనే భావాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: వాక్యారంభంలోని గַּם, ఇశ్రాయేలుతోపాటు యూదా కూడా అదే అపరాధంలో పాలుపంచుకున్నదని నొక్కిచెబుతుంది. సహజమైన ఆధునిక తెలుగులో ‘కూడా’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שָׁמַר
  choice: పాటించలేదు
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే వాటిని కాపాడడం అనే అక్షరార్థం కంటే వాటికి విధేయంగా ఉండడం, వాటిని ఆచరించడం. ‘పాటించలేదు’ తెలుగులో సహజమైన న్యాయనిబంధనాత్మక ప్రయోగం.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: מִצְוֺת అనే బహువచన పదంలోని అధికారిక నిబంధనాత్మక భావాన్ని ‘ఆజ్ఞలు’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, మూలంలోని వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: మూలంలోని మూడవ పురుష బహువచన ప్రత్యయాన్ని, యూదా ప్రజలను సమూహంగా సూచించే సహజమైన తెలుగు రూపమైన ‘తమ’తో వ్యక్తం చేసింది.
- source_word: וַיֵּלְכוּ
  choice: నడుచుకున్నారు
  rationale: הלך + בְ జీవన ప్రవర్తనను లేదా ఒక నియమాన్ని అనుసరించడాన్ని సూచిస్తుంది. ‘నడుచుకున్నారు’ మూలంలోని రూపకాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: בְּחֻקּוֹת
  choice: కట్టడల ప్రకారం
  rationale: חֻקּוֹתకు నియమాలు, విధులు, ఆచారాలు అనే భావాలు ఉన్నాయి. ‘కట్టడలు’ దాని అధికారిక-మతపరమైన ఛాయను నిలుపుతుంది; ‘ప్రకారం’ בְ యొక్క ప్రమాణానుసరణ భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ఇశ్రాయేలు చేసిన
  rationale: עָשׂוּను దాని సాధారణ అర్థమైన ‘చేశారు’కు దగ్గరగా ఉంచి, సమీప పూర్వపదమైన ఇశ్రాయేలును సమూహ బహువచన కర్తగా గ్రహించింది. ఈ పదబంధం ‘ఏర్పరచిన’ లేదా ‘ఆచరించిన’ అనే భావానికీ వీలు ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: עָשׂוּ క్రియకు కర్త మరియు భావం
  choice: ఇశ్రాయేలు చేసిన
  alternative: వారు చేసిన; ఇశ్రాయేలు ఆచరించిన; ఇశ్రాయేలు ఏర్పరచిన
  rationale: క్రియ బహువచనంలో ఉంది; ‘ఇశ్రాయేలు’ సమూహవాచకంగా దాని కర్త కావచ్చు. అయితే עשה ఇక్కడ కట్టడలను ఏర్పరచడం లేదా ఆచరించడం అనే భావాలను కూడా అనుమతిస్తుంది కాబట్టి ఆ అనిశ్చితిని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘ఆజ్ఞలు,’ ‘కట్టడలు’ నిబంధనాత్మక గంభీరతను నిలుపుతాయి; ‘నడుచుకున్నారు’ మూలంలోని ప్రవర్తనా రూపకాన్ని కాపాడుతుంది. యూదా, ఇశ్రాయేలు రాజ్యాలను వాటి ప్రజలకు సమూహవాచకాలుగా తీసుకొని బహువచన క్రియారూపాలు వాడబడ్డాయి.
