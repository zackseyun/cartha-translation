source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּ/חֻקּ֣וֹת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/מַלְכֵ֥י יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: te
  text: వారు యాహ్వే ఇశ్రాయేలీయుల ఎదుటనుండి వెళ్లగొట్టిన[a] జనాంగాల విధులను[b] అనుసరించారు[c]; ఇశ్రాయేలు రాజులు చేసినవాటినీ అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయుల ఎదుటనుండి స్వాధీనభూములను కోల్పోయేలా చేసిన.’
    reason: הוֹרִישׁ అనే క్రియలో వెళ్లగొట్టడం, స్వాధీనం కోల్పోయేలా చేయడం అనే భావాలు రెండూ ఉన్నాయి.
  - marker: b
    text: లేదా, ‘ఆచారాలను.’
    reason: חֻקּוֹת స్థిరమైన విధులను లేదా సంప్రదాయ ఆచారాలను సూచించగలదు.
  - marker: c
    text: మూలభాషలో, ‘నడిచారు’; ఇక్కడ అది వారి ప్రవర్తనను లేదా జీవన విధానాన్ని సూచిస్తుంది.
    reason: హీబ్రూ నడక రూపకం నైతిక లేదా ఆచరణాత్మక ప్రవర్తనను సూచిస్తుంది.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: అనుసరించి జీవించారు
  rationale: הלך అనే ‘నడుచు’ రూపకం ఇక్కడ జీవన ప్రవర్తనను సూచిస్తుంది. తెలుగులో భావం సహజంగా స్పష్టమయ్యేలా ‘అనుసరించి జీవించారు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּחֻקּוֹת
  choice: కట్టడలను
  rationale: חֻקּוֹת అనేది నిర్ణయించబడిన నియమాలు లేదా స్థిరమైన ఆచారాలను సూచించగలదు. ‘కట్టడలు’ దాని అధికారిక భావాన్ని నిలుపుతుంది; ‘ఆచారాలు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: הַגּוֹיִם
  choice: జనాల
  rationale: ఈ చారిత్రక సందర్భంలో גּוֹיִם కనాను దేశంలోని ఇశ్రాయేలేతర జనాలను సూచిస్తుంది. ‘జనాలు’ తటస్థమైన, సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: యాహ్వే ... ఎదుట నుండి వెళ్లగొట్టిన
  rationale: הוֹרִישׁ హిఫీల్ రూపం ‘స్వాధీనం నుండి తొలగించు’ లేదా ‘వెళ్లగొట్టు’ అనే భావాలను కలిగి ఉంది. ‘వెళ్లగొట్టిన’ సహజంగా ఉండి ప్రధాన సందర్భార్థాన్ని అందిస్తుంది; భూస్వాధీన భావాన్ని పాదసూచికలో సూచించాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ అది మొత్తం ఇశ్రాయేలు ప్రజలకు జాతివాచక నామం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజమూ సమగ్రార్థకమూ.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: ఇశ్రాయేలు రాజులు చేసినవాటిని కూడా
  rationale: హీబ్రూ చివరి పదబంధం సంక్షిప్తంగానూ కొంత అస్పష్టంగానూ ఉంది; ‘రాజులు చేసినవి’ ఏమిటో ప్రత్యేకంగా పేర్కొనదు. ‘చేసినవాటిని’ అని ఉంచడం ద్వారా ఆ అస్పష్టతను కాపాడి, ‘ప్రవేశపెట్టిన ఆచారాలు’ అని అతిగా వివరించలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామమైన יהוה నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: చివరి పదబంధంలోని సంక్షిప్తత
  choice: ఇశ్రాయేలు రాజులు చేసినవాటిని
  alternative: ఇశ్రాయేలు రాజులు ప్రవేశపెట్టిన ఆచారాలను
  rationale: మూలంలో ‘ఆచారాలు’ లేదా ‘ప్రవేశపెట్టారు’ అని స్పష్టంగా లేదు. వ్యాఖ్యానాత్మక విస్తరణకు బదులు మూలంలోని అనిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘కట్టడలు’ అనే కొద్దిగా అధికారిక పదం మూలంలోని חֻקּוֹת భావాన్ని నిలుపుతుంది. చివరి ఉపవాక్యంలోని మూల అస్పష్టతను ఉద్దేశపూర్వకంగా కాపాడాం.
