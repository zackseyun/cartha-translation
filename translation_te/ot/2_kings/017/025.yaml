id: 2KI.17.25
reference: 2 Kings 17:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: te
  text: వారు అక్కడ నివసించడం మొదలుపెట్టినప్పుడు, యాహ్వేకు భయపడలేదు[a]. అందువల్ల యాహ్వే వారి మధ్యకు సింహాలను పంపాడు; అవి వారిలో కొందరిని చంపుతూ వచ్చాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేను భయభక్తులతో గౌరవించలేదు.” ఇక్కడ “భయపడడం” అంటే కేవలం బెదిరిపోవడం కాక, దేవునిపట్ల భయభక్తి, గౌరవం, విధేయత కలిగి ఉండడం కూడా.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: వారు అక్కడ నివసించడం మొదలుపెట్టినప్పుడు
  rationale: హీబ్రూ నిర్మాణం వారు అక్కడ నివసించిన తొలిదశను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా కాలసూచక ఉపవాక్యంగా అనువదించబడింది.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: యాహ్వేకు భయపడలేదు
  rationale: יָרֵא అనే పదం కేవలం భీతినే కాక దేవునిపట్ల భయభక్తి, గౌరవం, విధేయతతో కూడిన వైఖరిని కూడా సూచించగలదు. మూలంలోని విస్తృత భావాన్ని తెరిచి ఉంచేందుకు ‘భయపడలేదు’ అని ఉంచి వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: వారి మధ్యకు సింహాలను పంపాడు
  rationale: בָּהֶם ఇక్కడ సింహాలు వారి మధ్యకు పంపబడిన భావాన్ని ఇస్తుంది; ‘వారికి విరోధంగా’ కంటే ‘వారి మధ్యకు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: అవి వారిలో కొందరిని చంపుతూ వచ్చాయి
  rationale: היה + కృదంత నిర్మాణం కొనసాగిన లేదా పునరావృతమైన చర్యను సూచిస్తుంది. ‘చంపుతూ వచ్చాయి’ ఆ భావాన్ని నిలుపుతుంది; בָּהֶםను భాగార్థకంగా తీసుకొని మొత్తం ప్రజలూ చనిపోయారనే భావం రాకుండా ‘వారిలో కొందరిని’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: యాహ్వేకు ‘భయపడడం’ అనే పదబంధం
  choice: భయపడలేదు
  alternative: భయభక్తులు చూపలేదు / ఆరాధించలేదు
  rationale: ‘భయభక్తులు చూపలేదు’ భావాన్ని కొంత వివరిస్తుంది; ‘ఆరాధించలేదు’ మరీ సంకుచితమైనది. ‘భయపడలేదు’ మూలపదంలోని భయం, గౌరవం, విధేయతల మధ్య ఉన్న భావవిస్తృతిని పాదసూచిక సహాయంతో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. కొనసాగిన చర్యను తెలియజేయడానికి ‘చంపుతూ వచ్చాయి’ అని, మూలంలోని దైవనామాన్ని నిలుపడానికి ‘యాహ్వే’ అని వాడాం.
