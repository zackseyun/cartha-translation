source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: te
  text: అయితే వారు వినలేదు; తమ దేవుడైన యాహ్వేను నమ్మని తమ పూర్వీకుల మెడవలె తమ మెడను కఠినపరచుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ దేవుడైన యాహ్వేపై నమ్మకం ఉంచలేదు.” ఇక్కడి హెబ్రీ క్రియ ఒడంబడిక సంబంధంలో నమ్మడం లేదా నమ్మకం ఉంచడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: అయితే వారు వినలేదు
  rationale: שׁמע యొక్క ప్రాథమిక అర్థమైన ‘వినడం’ను నిలుపుతూ, ముందున్న సందర్భానికి విరుద్ధతను וְ ఇక్కడ ‘అయితే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది. విధేయత అనే భావ ఛాయ సందర్భంలో ఉన్నప్పటికీ దానిని ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: తమ మెడను బిగించుకున్నారు
  rationale: ‘మెడను కఠినం చేసుకోవడం’ అనే హెబ్రీయ రూపకాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంతో నిలుపుతుంది; దానిని కేవలం ‘మొండివారయ్యారు’ అని భావానువాదం చేయలేదు.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: తమ పూర్వీకుల మెడలాగే
  rationale: పోలిక నేరుగా పూర్వీకులతో కాక వారి ‘మెడ’తో చేయబడిందనే మూలభాషా రూపకాన్ని కాపాడుతుంది. אבות ఇక్కడ వంశపూర్వీకులను సూచించేందున ‘పూర్వీకులు’ సహజంగా ఉంది.
- source_word: אֲשֶׁר לֹא הֶאֱמִינוּ
  choice: వారి పూర్వీకులు … నమ్మలేదు
  rationale: సంబంధ వాక్యాన్ని తెలుగులో స్పష్టత కోసం స్వతంత్ర వాక్యంగా మార్చినా, అది పూర్వీకులనే విశేషిస్తుందనే సంబంధం నిలిచింది. הֶאֱמִינוּలోని నమ్మడం/విశ్వసించడం భావాన్ని ‘నమ్మలేదు’ సహజంగా అందిస్తుంది.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: తమ దేవుడైన యాహ్వేను
  rationale: בతో కూడిన אמןను తెలుగులో సహజమైన సకర్మక ‘నమ్మడం’తో వ్యక్తం చేసింది. దేవుని ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించి, ‘తమ దేవుడు’ అనే సంబంధాన్ని స్పష్టంగా నిలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- issue: הֶאֱמִינוּను ‘నమ్మడం’గా లేదా ‘ఆధారపడడం’గా అనువదించడం
  choice: నమ్మలేదు
  alternative: ఆయనపై నమ్మకం ఉంచలేదు; విశ్వసించలేదు
  rationale: אמן హిఫీల్ + ב నిర్మాణం నమ్మకం ఉంచడం, విశ్వసించడం అనే రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సంక్షిప్తమైన ‘నమ్మలేదు’ను ఉంచి, ఒడంబడిక సంబంధమైన ‘నమ్మకం ఉంచడం’ అనే భావసాధ్యతను పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి. హెబ్రీయ ‘మెడ బిగించడం’ రూపకాన్ని నిలిపి, క్లిష్టమైన సంబంధ వాక్యాన్ని రెండు వాక్యాలుగా విభజించడం ద్వారా పఠన సౌలభ్యం కల్పించబడింది.
