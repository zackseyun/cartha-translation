revisions:
- from: అయితే వారు వినలేదు; తమ పూర్వీకుల మెడలాగే తమ మెడను బిగించుకున్నారు. వారి పూర్వీకులు తమ దేవుడైన యాహ్వేను నమ్మలేదు.[a]
  to: అయితే వారు వినలేదు; తమ దేవుడైన యాహ్వేను నమ్మని తమ పూర్వీకుల మెడవలె తమ మెడను కఠినపరచుకున్నారు.[a]
  rationale: The revision retains every lexical and theological element of the draft while more closely reflecting the Hebrew relative-clause structure and the collective-singular neck metaphor. No disputed interpretive or doctrinal reading has been introduced.
