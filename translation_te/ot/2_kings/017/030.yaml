source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: te
  text: బబులోను ప్రజలు సుక్కోత్-బెనోత్‌ను[a], కూతు ప్రజలు నెర్గల్‌ను, హమాతు ప్రజలు అషీమాను తయారుచేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సుక్కోత్-బెనోత్ అనేది బహుశా ఒక విదేశీ దేవత లేదా ఆరాధనా వస్తువు పేరు. దాని అర్థం అనిశ్చితంగా ఉన్నందున అనువదించకుండా లిప్యంతరీకరించబడింది. హీబ్రూ పాఠ్యంలో ‘బబులోను పురుషులు … కూతు పురుషులు … హమాతు పురుషులు’ అని అక్షరార్థంగా ఉంది.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ప్రజలు
  rationale: אִישׁ యొక్క నిర్మాణ బహువచనం అక్షరార్థంగా ‘పురుషులు’ అయినా, ఇక్కడ ఆయా పట్టణాలకు చెందిన నివాసులను సమూహంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రజలు’ సహజంగా ఉండి సమూహార్థాన్ని తెలియజేస్తుంది; అక్షర రూపాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: עָשׂוּ
  choice: తయారుచేశారు
  rationale: సాధారణ క్రియ עשה అంటే ‘చేయడం/తయారుచేయడం’. ఆరాధనా ప్రతిమలు లేదా దేవతా రూపాల సందర్భంలో ‘తయారుచేశారు’ మూలపాఠానికి దగ్గరగా ఉండి, ‘ప్రతిష్ఠించారు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: סֻכּוֹת בְּנוֹת
  choice: సుక్కోత్-బెనోత్
  rationale: ఇది విదేశీ దేవత లేదా ఆరాధనా వస్తువు పేరు కావచ్చు. వ్యుత్పత్తి, అర్థం అనిశ్చితమైనందున ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: כּוּת
  choice: కూతు
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: נֵרְגַל
  choice: నెర్గల్
  rationale: మెసొపొటేమియా దేవత పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: חֲמָת
  choice: హమాతు
  rationale: స్థలనామాన్ని తెలుగులో సహజంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲשִׁימָא
  choice: అషీమా
  rationale: విదేశీ దేవత పేరును ఊహాత్మక అర్థం చేర్చకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: עָשׂוּ క్రియకు కర్మలుగా వచ్చిన పేర్ల ముందు ‘విగ్రహం’ లేదా ‘దేవుడు’ చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో పేర్లను మాత్రమే ఉంచడం
  alternative: ‘సుక్కోత్-బెనోత్ విగ్రహాన్ని’ లేదా ‘సుక్కోత్-బెనోత్ అనే దేవతను’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠ్యం ‘చేశారు’ అని చెప్పి నేరుగా ఆయా పేర్లను కర్మలుగా ఇస్తుంది. సందర్భం అవి విదేశీ దేవతలు లేదా ఆరాధనా వస్తువులని సూచించినా, ‘విగ్రహం/దేవుడు’ చేర్చడం మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో ప్రవేశపెడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ప్రాంతాల నివాసులను సూచించేందుకు ‘ప్రజలు’ వాడాం. పేర్లను హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం; మూలంలోని సంక్షిప్తతను కాపాడేందుకు ‘దేవత’ లేదా ‘విగ్రహం’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
