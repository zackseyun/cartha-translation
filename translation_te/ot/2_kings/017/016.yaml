source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: te
  text: వారు తమ దేవుడైన యాహ్వే ఆజ్ఞలన్నిటినీ విడిచిపెట్టి, తమ కోసం పోతపోసిన రెండు దూడ విగ్రహాలను చేసుకున్నారు. ఒక అషేరాను[a] తయారుచేసి, ఆకాశ సైన్యమంతటికీ సాగిలపడి, బయలును సేవించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరా స్తంభాన్ని.’ హీబ్రూ పదమైన ‘అషేరా’ కనానీయ దేవతను లేదా ఆమెకు సంబంధించిన ఆరాధనా వస్తువును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టి
  rationale: ఇక్కడ עזב అనేది కేవలం వదలి వెళ్లడం కాక, దేవుని నిబంధన ఆజ్ఞలను ఉద్దేశపూర్వకంగా విసర్జించడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ తీవ్రతను నిలుపుతుంది.
- source_word: כָּל מִצְוֺת
  choice: ఆజ్ఞలన్నిటినీ
  rationale: ‘అన్ని’ అనే సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతూ, నిబంధన సందర్భంలోని מִצְוֺתకు సహజమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: వారితో దేవునికున్న నిబంధన సంబంధాన్ని సూచించే స్వామ్య ప్రత్యయాన్ని ‘తమ’ ద్వారా నిలిపాం.
- source_word: וַיַּעֲשׂוּ לָהֶם מַסֵּכָה שנים עֲגָלִים
  choice: తమ కోసం పోతపోసిన రెండు దూడ విగ్రహాలను చేసుకున్నారు
  rationale: לָהֶםను ‘తమ కోసం’గా, מַסֵּכָה యొక్క లోహాన్ని పోతపోసి చేసిన వస్తువు అనే భావాన్ని ‘పోతపోసిన’గా వ్యక్తపరిచాం. హీబ్రూలోని ఏకవచన రూపం తరువాత ‘రెండు దూడలు’ రావడం వల్ల ఉన్న వ్యాకరణ ఉద్రిక్తతను తెలుగులో అసహజంగా చేయకుండా, రెండు దూడ విగ్రహాలనే సూచించేలా అనువదించాం.
- source_word: אֲשֵׁירָה
  choice: అషేరా
  rationale: ఈ పదం కనానీయ దేవతను గానీ ఆమె ఆరాధనా చిహ్నాన్ని గానీ సూచించవచ్చు. ‘తయారుచేశారు’ అనే సందర్భం ఆరాధనా వస్తువును సూచించే అవకాశం ఉన్నా, అనిశ్చితిని తొలగించకుండా పేరునే లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: సాగిలపడి
  rationale: ఈ క్రియలోని శరీరాన్ని వంచి నమస్కరించే స్పష్టమైన చర్యను నిలుపుతుంది; సాధారణ ‘ఆరాధించారు’ అనే విస్తృత పదంలో కలిపివేయదు.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతటికీ
  rationale: నక్షత్రాదులతో కూడిన సమస్త ఆకాశ సమూహాన్ని ‘సైన్యం’ అనే మూల రూపకంతో సహా నిలుపుతుంది.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: విగ్రహారాధన సందర్భంలోని ఆరాధనా సేవ భావాన్ని నిలుపుతూ, ముందు వచ్చిన ‘సాగిలపడి’ అనే క్రియతో వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: הַבָּעַל
  choice: బయలు
  rationale: హీబ్రూ నిర్దేశక ఉపపదాన్ని తెలుగులో అసహజంగా పునరుత్పత్తి చేయకుండా, దేవత పేరుకు సాధారణ తెలుగు బైబిలు రూపాన్ని వాడాం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో మార్చకుండా, మూలనామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- issue: אֲשֵׁירָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం / అషేరా దేవత
  rationale: ఈ పదం దేవతను లేదా ఆమె ఆరాధనా వస్తువును సూచించగలదు. తయారుచేయడం అనే క్రియ ఆరాధనా వస్తువును బలంగా సూచించినా, మూలంలోని అనిశ్చితిని ప్రధాన పాఠంలో పరిష్కరించలేదు.
- issue: מַסֵּכָה మరియు ‘రెండు దూడలు’ మధ్య సంఖ్యా ఉద్రిక్తత
  choice: పోతపోసిన రెండు దూడ విగ్రహాలు
  alternative: ఒక పోతవిగ్రహం—రెండు దూడలు
  rationale: మూలంలో מַסֵּכָה ఏకవచనంగా కనిపించినా దానికి వివరణగా రెండు దూడలు వస్తాయి. తెలుగులో అర్థరహితమైన సంఖ్యా అసమ్మతిని యథాతథంగా మోపకుండా, ఉద్దేశించిన రెండు పోతవిగ్రహాలను స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. వరుస హీబ్రూ క్రియలను తెలుగులో చదవడానికి అనువుగా రెండు వాక్యాలుగా అమర్చినా, చర్యల క్రమాన్ని నిలిపాం. ‘సాగిలపడి’ మరియు ‘సేవించారు’ ద్వారా మూలంలోని రెండు వేర్వేరు ఆరాధనా క్రియలను వేరు చేశాం.
