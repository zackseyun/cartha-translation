  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: te
  text: ఈనాటివరకు వారు మునుపటి ఆచారాల ప్రకారం నడుచుకుంటున్నారు.[a] వారు యాహ్వేకు భయపడరు.[b] తమ శాసనాల ప్రకారమూ, తమ న్యాయవిధుల ప్రకారమూ, యాహ్వే ఇశ్రాయేలు అని పేరు పెట్టిన యాకోబు కుమారులకు[c][d] ఆజ్ఞాపించిన ధర్మశాస్త్రం, ఆజ్ఞ ప్రకారమూ వారు నడుచుకోరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మునుపటి నియమాల ప్రకారం’ లేదా ‘మునుపటి పద్ధతుల ప్రకారం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యాహ్వేకు భయపడడం’ అంటే ఆయనపట్ల భీతిని మాత్రమే కాదు, భక్తిపూర్వక గౌరవాన్ని మరియు నిబంధనపరమైన విధేయతను కూడా కలిగి ఉండడం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘యాకోబు కుమారులు’; ఇది యాకోబు సంతతి ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: అంటే, యాకోబుకు ఇశ్రాయేలు అని పేరు పెట్టాడు; ఆదికాండం 32:28; 35:10 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: మునుపటి ఆచారాల ప్రకారం
  rationale: మִשְׁפָּטִים అనే పదానికి న్యాయవిధులు, నియమాలు, ఆచారాలు, స్థిరపడిన పద్ధతులు అనే అర్థాలు ఉన్నాయి. ఇక్కడ ముందుగా వర్ణించిన మతాచారాల కొనసాగింపే సందర్భం కాబట్టి ‘ఆచారాలు’ సహజంగా సరిపోతుంది; ఇతర సాధ్య అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: యాహ్వేకు భయపడడం
  rationale: ఈ హీబ్రూ నుడికారం భయంతోపాటు భక్తిపూర్వక గౌరవాన్ని, నిబంధనపరమైన విధేయతను కూడా సూచిస్తుంది. స్థిరమైన బైబిలు భావభారాన్ని నిలుపుతూ ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో వివరించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణ Yahwehకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: వారి కట్టడల ప్రకారం, వారి న్యాయవిధుల ప్రకారం
  rationale: חֻקּוֹת స్థిరంగా నిర్దేశించిన కట్టడలను, מִשְׁפָּטִים నియమిత న్యాయవిధులను సూచిస్తాయి. మూడవ పురుష బహువచన ప్రత్యయాన్ని ‘వారి’గా యథాతథంగా ఉంచడం వల్ల దాని సూచనను అనవసరంగా మరింత నిర్దిష్టం చేయలేదు.
- source_word: כַתּוֹרָה וְכַמִּצְוָה
  choice: ధర్మశాస్త్రం ప్రకారం, ఆ ఆజ్ఞ ప్రకారం
  rationale: תּוֹרָהకు ఈ నిబంధన సందర్భంలో ‘ధర్మశాస్త్రం’ సహజమైన పదం. מִצְוָה ఏకవచనం కావడంతో ‘ఆ ఆజ్ఞ’ అని ఏకవచనాన్ని నిలిపాం.
- source_word: בְּנֵי יַעֲקֹב
  choice: యాకోబు కుమారులు
  rationale: హీబ్రూ రూపాన్ని సన్నిహితంగా నిలుపుతూ ‘కుమారులు’ అని అనువదించాం; ఇది యాకోబు సంతతిని సమష్టిగా సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: తాను ఇశ్రాయేలు అని పేరు పెట్టిన యాకోబు
  rationale: ఈ సంబంధవాక్యం యాకోబుకు ఇశ్రాయేలు అనే పేరు పెట్టడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టంగా చూపిస్తూ మూలంలోని భావాన్ని నిలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా Yahweh ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- issue: ‘వారి కట్టడలు, వారి న్యాయవిధులు’ అనే పదబంధంలోని సర్వనామ సూచన
  choice: ‘వారి’ అనే మూలంలోని మూడవ పురుష బహువచన రూపాన్ని అలాగే నిలపడం
  alternative: ఇవి ప్రజల స్వంత మతపద్ధతులని స్పష్టీకరించడం; లేదా యాహ్వే నియమాలని స్పష్టీకరించడం
  rationale: సందర్భం ప్రజల పూర్వపు మిశ్రమ ఆచారాలనే ప్రధానంగా సూచించినప్పటికీ, హీబ్రూ సర్వనామ రూపం స్వయంగా ఆ వివరణను పూర్తిగా విప్పి చెప్పదు. ‘వారి’ అని ఉంచడం మూలంలోని సూచనను, కొంత మిగిలే ఉద్రిక్తతను కాపాడుతుంది.
- issue: ‘యాహ్వేకు భయపడడం’ భావం
  choice: ప్రధాన పాఠంలో ‘భయపడడం’; పాదసూచికలో భక్తిపూర్వక గౌరవం మరియు నిబంధన విధేయత
  alternative: భక్తితో గౌరవించడం
  rationale: ‘భయపడడం’ మూల నుడికారపు తీవ్రతను నిలుపుతుంది; పాదసూచిక దానిని కేవలం భీతిగా తప్పుగా పరిమితం చేయకుండా సహాయపడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కట్టడలు’, ‘న్యాయవిధులు’, ‘ధర్మశాస్త్రం’, ‘ఆజ్ఞ’ అనే పదాలతో మూలంలోని న్యాయ-నిబంధన పదసమూహ భేదాన్ని సాధ్యమైనంతవరకు నిలిపాం. పొడవైన చివరి భాగంలో యాకోబుకు పేరు పెట్టిన సంబంధవాక్యం తప్పుగా ‘కుమారులు’ను విశేషించకుండా డాష్‌లతో అమర్చాం.
