revisions:
- from: ఈ రోజు వరకూ వారు మునుపటి ఆచారాల ప్రకారమే నడుచుకుంటున్నారు.[a] వారు యాహ్వేకు భయపడడం లేదు.[b] అంతేకాక, వారి కట్టడల ప్రకారం, వారి న్యాయవిధుల ప్రకారం, లేదా యాహ్వే—తాను ఇశ్రాయేలు అని పేరు పెట్టిన యాకోబు[d] కుమారులకు[c]—ఆజ్ఞాపించిన ధర్మశాస్త్రం ప్రకారం, ఆ ఆజ్ఞ ప్రకారం వారు నడుచుకోవడం లేదు.
  to: ఈనాటివరకు వారు మునుపటి ఆచారాల ప్రకారం నడుచుకుంటున్నారు.[a] వారు యాహ్వేకు భయపడరు.[b] తమ శాసనాల ప్రకారమూ, తమ న్యాయవిధుల ప్రకారమూ, యాహ్వే ఇశ్రాయేలు అని పేరు పెట్టిన యాకోబు కుమారులకు[c][d] ఆజ్ఞాపించిన ధర్మశాస్త్రం, ఆజ్ఞ ప్రకారమూ వారు నడుచుకోరు.
  rationale: The revision restores the source’s cumulative conjunctions, improves the modern Telugu legal terminology and sentence flow, and retains the Hebrew singular “ఆజ్ఞ,” the corporate-but-masculine “యాకోబు కుమారులు,” and the source’s identification of Jacob as Israel. Footnote anchors are retained and placed directly after “యాకోబు కుమారులకు,” to which both notes pertain.
  reviewer_model: gpt-5.6-terra
