  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజవృత్తాంతానికి తగిన గౌరవప్రద శైలి. ‘అష్షూరు,’ ‘హోషేయ,’ ‘సో’ రూపాలు మూలభాషా పేర్లను అనుసరిస్తాయి. మూలంలోని చర్యల క్రమం మరియు రాజకీయ కుట్ర భావం నిలుపబడ్డాయి.
