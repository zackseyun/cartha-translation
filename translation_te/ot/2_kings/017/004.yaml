source:
  edition: WLC
  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజు హోషేయలో కుట్రను కనుగొన్నాడు[a]. ఎందుకంటే హోషేయ ఈజిప్టు రాజైన సో[b] వద్దకు దూతలను పంపించాడు; అంతేకాక, ఏటేటా చెల్లించినట్లుగా అష్షూరు రాజుకు కప్పం చెల్లించలేదు[c]. అందుచేత అష్షూరు రాజు అతన్ని అదుపులోకి తీసుకొని[d], చెరసాలలో బంధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హోషేయలో రాజద్రోహాన్ని కనుగొన్నాడు.” హీబ్రూలో అక్షరార్థంగా “హోషేయలో కుట్రను కనుగొన్నాడు”; అంటే అతనిలోని ద్రోహపూరిత పన్నాగాన్ని గుర్తించాడు.
    reason: lexical_alternative
  - marker: b
    text: “సో” అనేది హీబ్రూ పేరుకు లిప్యంతరీకరణ. ఈ ఈజిప్టు రాజు చారిత్రకంగా ఎవరో ఖచ్చితంగా తెలియదు.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, “కప్పాన్ని పైకి పంపించలేదు” లేదా “తీసుకురాలేదు.”
    reason: lexical_alternative
  - marker: d
    text: 'హీబ్రూ రెండు చర్యలను వేరుగా చెబుతుంది: అష్షూరు రాజు మొదట హోషేయను అదుపులోకి తీసుకున్నాడు; తరువాత అతన్ని చెరసాలలో బంధించాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... קֶשֶׁר בְּהוֹשֵׁעַ
  choice: హోషేయలో కుట్రను కనుగొన్నాడు
  rationale: హీబ్రూ పదబంధంలోని ‘కనుగొను’ మరియు ‘అతనిలో కుట్ర’ అనే రాజకీయ ద్రోహాన్ని గుర్తించే భావాన్ని సాధ్యమైనంత సమీపంగా నిలుపుతుంది; తెలుగు పాఠకునికి ఇది సందర్భంలో సహజంగా అర్థమవుతుంది.
- source_word: שָׁלַח מַלְאָכִים
  choice: దూతలను పంపించాడు
  rationale: מַלְאָכִים అనే పదానికి ‘దూతలు’ విస్తృతమైన ప్రత్యక్ష సమానం; ఇక్కడి రాజదౌత్య సందర్భం వాక్యం నుంచే స్పష్టమవుతుంది.
- source_word: סוֹא
  choice: సో
  rationale: చారిత్రక గుర్తింపు అనిశ్చితంగా ఉన్నందున హీబ్రూ పేరును లిప్యంతరీకరించి, వివాదాస్పదమైన గుర్తింపును మూలపాఠ్యంలోకి చేర్చలేదు.
- source_word: מִנְחָה
  choice: కప్పం
  rationale: సామంత రాజు అష్షూరుకు చెల్లించే రాజకీయ సందర్భంలో ‘కప్పం’ సరైన ఆధునిక తెలుగు పదం.
- source_word: לֹא הֶעֱלָה מִנְחָה
  choice: కప్పం చెల్లించలేదు
  rationale: הֶעֱלָה అక్షరార్థంగా ‘పైకి తీసుకువచ్చాడు/పంపించాడు’ అయినప్పటికీ, కప్పం సందర్భంలో ‘చెల్లించలేదు’ సహజమైన తెలుగు; పాదటిప్పణిలో అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: ఏటేటా చేసినట్లు
  rationale: వార్షికంగా పునరావృతమయ్యే చెల్లింపును సహజ తెలుగులో తెలియజేస్తుంది; సందర్భం కోరే క్రియను కనిష్ఠంగా పూరిస్తుంది.
- source_word: וַיַּעַצְרֵהוּ
  choice: అతన్ని అదుపులోకి తీసుకొని
  rationale: ఈ క్రియలోని నిరోధించడం లేదా నిర్బంధించడం అనే భావాన్ని తెలిపి, తరువాతి ‘బంధించాడు’ అనే ప్రత్యేక చర్యతో తేడాను నిలుపుతుంది.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: చెరసాలలో బంధించాడు
  rationale: ‘బంధించు’ అనే మూల క్రియార్థాన్నీ, ‘నిర్బంధ గృహం’ అనే స్థలాన్నీ సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
