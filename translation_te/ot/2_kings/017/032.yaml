source:
  edition: WLC
  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: te
  text: వారు యెహోవాకు భయపడ్డారు; తమలో నుండే[a] ఉన్నత స్థలాల[b] యాజకులను తమ కోసం నియమించుకున్నారు. ఆ యాజకులు ఉన్నత స్థలాలకు చెందిన ఆరాధనా గృహాల్లో వారి కోసం సేవ చేస్తూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమలోని అన్ని వర్గాలవారిలో నుండి.’ హీబ్రూ నుడికారం ‘వారి అంచుల నుండి’ అనే భావాన్ని కలిగి ఉంది; దాని ఖచ్చితమైన సూచన వివాదాస్పదం.
    reason: lexical_alternative
  - marker: b
    text: అంటే, కేంద్ర పరిశుద్ధస్థలానికి బదులుగా స్థానిక ఆరాధనా కేంద్రాలుగా ఉపయోగించిన ప్రదేశాలు.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: యెహోవాకు భయపడ్డారు
  rationale: ‘భయపడడం’ అనే మూల భావాన్ని నిలుపుతూ, సందర్భంలోని ఆరాధనాత్మక గౌరవాన్ని మరియు విగ్రహారాధనతో ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מִקְצוֹתָם
  choice: తమలోని అన్ని వర్గాలవారిలో నుండి
  rationale: అక్షరార్థంగా ‘వారి అంచుల నుండి’ అనే వివాదాస్పద నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ‘అత్యల్పులలో నుండి’ అనే నిర్ధారించలేని భావాన్ని రుద్దదు.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: ఉన్నత స్థలాల యాజకులు
  rationale: స్థానిక ఆరాధనా కేంద్రాలకు సంబంధించిన సాంకేతిక పదబంధాన్నీ, యాజక పదవినీ నిలుపుతుంది.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: తమ కోసం నియమించుకున్నారు
  rationale: వ్యక్తులను పదవిలో ఉంచే సందర్భంలో עשה యొక్క ‘నియమించు’ భావాన్ని, לָהֶם లోని స్వప్రయోజన భావంతో సహజంగా తెలుపుతుంది.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: వారి కోసం సేవ చేస్తూ ఉండేవారు
  rationale: కొనసాగుతున్న విధి నిర్వహణను తెలియజేస్తూ, మూల క్రియ స్పష్టంగా చెప్పని ఆచార వివరాలను జోడించదు.
- source_word: בְּבֵית הַבָּמוֹת
  choice: ఉన్నత స్థలాల మందిరాల్లో
  rationale: సామూహిక భావంలో వాడిన ఏకవచన ‘ఇల్లు’ను తెలుగులో సహజమైన బహువచనంగా అందించి, ఆ ఉన్నత స్థలాలకు సంబంధించిన ఆరాధనా కట్టడాలను సూచిస్తుంది.
theological_decisions:
- issue: యెహోవాకు భయపడటానికీ అక్రమ స్థానిక ఆరాధనకూ మధ్య ఉన్న ఉద్రిక్తత
  choice: ‘యెహోవాకు భయపడ్డారు’ అని నేరుగా ఉంచి, తరువాతి చర్యను సాధారణ సముచ్చయంతో కొనసాగించడం
  alternative: ‘యెహోవాను ఆరాధించారు’ లేదా ‘యెహోవాకు భయపడుతున్నట్లు నటించారు’ అని వ్యాఖ్యానాత్మకంగా చెప్పడం
  rationale: హీబ్రూ వాక్యం వారి భయాన్ని నిరాకరించదు; అదే సమయంలో ఉన్నత స్థలాల యాజకులను నియమించడాన్ని పక్కనే ఉంచుతుంది. అనువాదం ఈ ఉద్రిక్తతను సహజంగానే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. నియమించబడిన యాజకులే చివరి వాక్యంలోని సేవకులు అని స్పష్టంగా ఉండేందుకు ‘ఆ యాజకులు’ అని పునరుక్తి చేయబడింది.
