source:
  edition: WLC
  text: עָלָ֣י/ו עָלָ֔ה שַׁלְמַנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַֽ/יְהִי ל֤/וֹ הוֹשֵׁ֨עַ֙ עֶ֔בֶד וַ/יָּ֥שֶׁב ל֖/וֹ מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: te
  text: అష్షూరు రాజైన షల్మనేసెరు అతనిపైకి దండెత్తి వచ్చాడు. హోషేయ అతనికి సేవకుడయ్యాడు[a], కప్పం చెల్లించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి సామంత రాజయ్యాడు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘అతనికి సేవకుడయ్యాడు’ అని ఉంది; ఇది రాజకీయ అధీనతను సూచించే భాష.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: అతనిమీదికి దండెత్తి వచ్చాడు
  rationale: సైనిక సందర్భంలో ఈ హీబ్రూ ప్రయోగం ఒకరికి విరోధంగా సైన్యంతో ముందుకు రావడాన్ని సూచిస్తుంది. ‘దాడి చేశాడు’ అని ఫలితాన్ని అతిగా నిర్ధారించకుండా, సైనిక కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שַׁלְמַנְאֶסֶר
  choice: షల్మనెసెరు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజైన
  rationale: షల్మనెసెరును అతని రాజపదవి, రాజ్యంతో గుర్తించే సమాస పదబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందించాం.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: అతనికి సేవకుడై
  rationale: ఇది హోషేయ స్థితిలో వచ్చిన మార్పును, అంటే రాజకీయ అధీనతను సూచిస్తుంది. ‘బానిస’ వ్యక్తిగత దాస్యాన్ని సూచించే ప్రమాదం ఉండగా, ‘సేవకుడు’ మూలంలోని రాజకీయ అధీనత భాషను నిలుపుతుంది; ‘సామంతుడు’ మరింత సాంకేతిక పదం.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: కప్పం చెల్లించాడు
  rationale: రాజకీయ సందర్భంలో ఈ పదబంధం అధీన రాజు పైరాజుకు కప్పం చెల్లించడాన్ని సూచిస్తుంది; ఈ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִנְחָה
  choice: కప్పం
  rationale: מִנְחָה ఇతర సందర్భాల్లో కానుక లేదా అర్పణ అని అర్థమివ్వగలిగినా, ఇక్కడ రాజుల మధ్య అధీన సంబంధం కారణంగా ‘కప్పం’ సరైన సందర్భార్థం.
theological_decisions:
- issue: עֶבֶד అనే పదంలోని రాజకీయ అధీనత
  choice: ప్రధాన పాఠంలో ‘సేవకుడు’ అని ఉంచి, పాదసూచికలో ‘సామంత రాజు’ అనే సందర్భార్థాన్ని వివరించడం
  alternative: ‘సామంత రాజు అయ్యాడు’ అని నేరుగా అనువదించడం
  rationale: మూలంలోని ‘సేవకుడు’ అనే రూపక భాషను నిలుపుతూ, అది వ్యక్తిగత బానిసత్వం కాక రాజకీయ వశత్వమని పాఠకుడికి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడాం. ‘దండెత్తి వచ్చాడు,’ ‘సేవకుడై,’ ‘కప్పం’ వంటి పదాలు చారిత్రక-రాజకీయ సందర్భాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తాయి.
