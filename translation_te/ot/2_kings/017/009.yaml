  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: te
  text: ఇశ్రాయేలీయులు తమ దేవుడైన యెహోవాకు విరోధంగా సరైనవి కాని పనులను రహస్యంగా చేశారు.[a] వారు తమ పట్టణాలన్నిటిలో ఉన్నత స్థలాలను కట్టుకున్నారు—కాపలాదారుల గోపురం మొదలుకొని ప్రాకారమున్న పట్టణం వరకు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ దేవుడైన యెహోవా గురించి సరైనవి కాని విషయాలను దాచిపెట్టారు.” ఇక్కడి హెబ్రీ క్రియ అరుదైనది; దాచడం లేదా రహస్యంగా చేయడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఉన్నత స్థలాలు” స్థానిక ఆరాధనా స్థలాలు; అవి తరచుగా అనుమతించబడని ఆరాధనతో సంబంధం కలిగి ఉండేవి.
    reason: cultural_note
  - marker: c
    text: “కాపలాదారుల గోపురం మొదలుకొని ప్రాకారమున్న పట్టణం వరకు” అంటే చిన్న కాపలా స్థావరం నుంచి బలమైన పట్టణం దాకా, దేశమంతటా అని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: రహస్యంగా చేశారు
  rationale: అరుదైన חפא క్రియ దాచిపెట్టడం లేదా గుట్టుగా వ్యవహరించడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ ‘పనులను రహస్యంగా చేశారు’ అనేది క్రియాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, దాచిపెట్టారు అనే ప్రత్యామ్నాయ భావానికి పాదసూచికలో చోటిస్తుంది.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: సరైనవి కాని పనులను
  rationale: అక్షరార్థమైన ‘అలా కాని విషయాలు’ తెలుగులో అస్పష్టంగా ఉంటుంది. సందర్భంలోని నైతిక మూల్యాంకనాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘సరైనవి కాని పనులు’ తెలియజేస్తుంది.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: తమ దేవుడైన యెహోవాకు విరోధంగా
  rationale: మతద్రోహ క్రియల సందర్భంలో עַל కు విరోధార్థం సహజం. అయినా ‘గురించి’ అనే తటస్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని సాధ్యమైన సందిగ్ధతను కాపాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: ఉన్నత స్థలాలను కట్టుకున్నారు
  rationale: במות అనేది స్థానిక ఆరాధనా స్థలాలకు సంబంధించిన సాంస్కృతిక పదం. ‘కట్టుకున్నారు’ అనే రూపం לָהֶם లోని తమకొరకు అనే భావాన్ని సహజంగా కలుపుతుంది; పదానికి వివరణ పాదసూచికలో ఉంది.
- source_word: בְּכָל עָרֵיהֶם
  choice: తమ పట్టణాలన్నిటిలో
  rationale: మూలంలోని సమగ్రతను సహజమైన ఆధునిక తెలుగులో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: కాపలాదారుల గోపురం మొదలుకొని
  rationale: נוֹצְרִים లోని కాపలా కాచేవారు అనే భావాన్ని నిలుపుతూ, చిన్న కాపలా స్థావరాన్ని సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: עַד עִיר מִבְצָר
  choice: ప్రాకారమున్న పట్టణం వరకు
  rationale: עִיר מִבְצָר అంటే రక్షణ ఏర్పాట్లు గల బలమైన పట్టణం. ‘ప్రాకారమున్న పట్టణం’ సాధారణ పాఠకుడికి స్పష్టంగా ఉండి, ఈ మేరిజంలో పెద్ద రక్షిత నివాసాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు రహస్య చర్యల నైతిక స్వభావం
  choice: ఒడంబడిక దేవునికి విరోధంగా రహస్యంగా చేసిన తప్పుడు క్రియలు
  alternative: యెహోవా గురించి సరికాని విషయాలను దాచిపెట్టడం లేదా చెప్పడం
  rationale: అరుదైన క్రియ, దాని కర్మగా ఉన్న ‘విషయాలు/పనులు,’ వెంటనే చెప్పబడిన ఉన్నత స్థలాల నిర్మాణం—ఇవి కలిసి గుట్టుగా జరిగిన అనధికార ఆరాధనా చర్యలను సూచిస్తాయి. అనువాదం రహస్యత్వాన్నీ విరోధాన్నీ నిలుపుతుంది; అయితే హెబ్రీ పదబంధంలోని ప్రత్యామ్నాయ అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: ‘ఉన్నత స్థలాలు’ యొక్క ఆరాధనా భావం
  choice: సాంస్కృతిక పదాన్ని ప్రధాన వచనంలో నిలిపి పాదసూచికలో వివరించడం
  alternative: నేరుగా ‘అనధికార ఆరాధనా స్థలాలు’ అని అనువదించడం
  rationale: במות ప్రతిసారి కేవలం భౌగోళిక ఎత్తును మాత్రమే కాక స్థానిక పూజాస్థలాన్ని సూచిస్తుంది. ‘అనధికార’ అని ప్రధాన వచనంలో చేర్చడం మూలంలో లేని వివరణను ముందుకు తెస్తుంది కాబట్టి దాన్ని వివరణకే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన వచనశైలి. అరుదైన హెబ్రీ క్రియలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో సహజమైన ఎంపికతో, పాదసూచికలో ప్రత్యామ్నాయంతో నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
