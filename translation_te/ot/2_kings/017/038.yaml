  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: te
  text: నేను మీతో చేసిన ఒడంబడికను[a] మీరు మరచిపోకూడదు[b]; ఇతర దేవుళ్లకు భయపడకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారంలో అక్షరార్థంగా, ‘నేను మీతో కోసిన ఒడంబడిక.’ ‘ఒడంబడిక కోయడం’ అనేది ఒడంబడికను చేయడాన్ని సూచించే హీబ్రూ నుడికారం; తెలుగులో ‘చేసిన ఒడంబడిక’ అని సహజంగా అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరచిపోవద్దు; ఇతర దేవుళ్లకు భయపడవద్దు.’ హీబ్రూ క్రియారూపాలను నిషేధాత్మక ఆజ్ఞలుగా కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: నిబంధన
  rationale: దేవుడు స్థాపించిన, బంధించే సంబంధాన్ని సూచించే ఒడంబడిక సందర్భంలో בְּרִיתకు ‘నిబంధన’ సహజమైనదీ వేదపరమైన గంభీరతను నిలుపుకునేదీ.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: నేను మీతో చేసిన
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మీతో కోసిన’ అనే నిబంధన-స్థాపన నుడికారం ఉంది. తెలుగులో ‘మీతో చేసిన’ అని చెప్పడం అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא תִשְׁכָּחוּ
  choice: మీరు మరచిపోకూడదు
  rationale: לֹאతో కూడిన ఈ క్రియారూపం ఇక్కడ నిషేధాత్మక ఆదేశాన్ని వ్యక్తం చేస్తుంది. ‘మరచిపోకూడదు’ ఆధునిక తెలుగులో ఆ నిర్దేశక స్వరాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְלֹא תִירְאוּ
  choice: భయపడకూడదు
  rationale: יָרֵא భయం, భక్తిపూర్వక గౌరవం లేదా ఆరాధనా విధేయతను సూచించగలదు. మూలంలోని విస్తృత భావసాధ్యతను అతిగా వ్యాఖ్యానించకుండా ‘భయపడకూడదు’ నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లకు
  rationale: ఇశ్రాయేలు దేవుడు కాక ఇతర దేవతలను సూచించే సాధారణ నిబంధన సూత్రానికి ఇది నేరమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: నిబంధన సంబంధమైన నిషేధాల స్వరం
  choice: ‘మీరు మరచిపోకూడదు; ... భయపడకూడదు’ అనే నిర్దేశక రూపం
  alternative: ‘మరచిపోవద్దు; ... భయపడవద్దు’ అనే ప్రత్యక్ష ఆజ్ఞారూపం
  rationale: హీబ్రూ రూపం నిషేధం లేదా బలమైన నిర్దేశంగా అర్థమవుతుంది. తెలుగు ‘కూడదు’ రూపం నిబంధనాత్మక స్వరాన్ని నిలుపుతూ సహజంగా ఉంది; ప్రత్యక్ష ఆజ్ఞారూపం కూడా సాధ్యమేనని పాదటిప్పణిలో సూచించబడింది.
- issue: ఇతర దేవుళ్లను ‘భయపడడం’ యొక్క భావం
  choice: ‘భయపడకూడదు’
  alternative: ‘పూజించకూడదు’ లేదా ‘భక్తితో గౌరవించకూడదు’
  rationale: సందర్భంలో ఇది ఇతర దేవుళ్లపట్ల ఆరాధనా విధేయతను సూచించవచ్చు; అయినా మూలపదంలోని ‘భయపడు’ భావాన్ని తొలగించి ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా నేరుగా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నిబంధన’ వేదపరమైన గంభీరతను నిలుపుతుంది; ‘దేవుళ్లకు భయపడడం’ అనే మూలభాషా వ్యక్తీకరణలోని ఉద్దేశపూర్వక భావవిస్తృతిని సంరక్షించింది.
