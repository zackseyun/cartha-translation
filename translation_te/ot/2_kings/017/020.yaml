- from: కాబట్టి యాహ్వే ఇశ్రాయేలు సంతానమంతటినీ[a] తిరస్కరించాడు. వారిని బాధలకు గురిచేసి, దోచుకునేవారి చేతికి అప్పగించాడు[b]—చివరకు వారిని తన సన్నిధి నుండి[c] వెళ్లగొట్టాడు.
  to: యాహ్వే ఇశ్రాయేలు సంతానమంతటినీ[a] తిరస్కరించాడు; వారిని బాధలకు గురిచేసి, దోచుకునేవారి చేతికి అప్పగించాడు[b], తన సన్నిధి నుండి[c] వారిని వెళ్లగొట్టేవరకు.
  rationale: స్వతంత్ర కారణార్థాన్ని చేర్చిన ‘కాబట్టి’ని తొలగించాం. అలాగే ‘చివరకు ... వెళ్లగొట్టాడు’ స్థానంలో ‘... వెళ్లగొట్టేవరకు’ను పెట్టి עַד אֲשֶׁר యొక్క కాలపరిమితిని స్పష్టంగా నిలిపాం. ఇతర పదప్రయోగాలు మూలార్థానికీ, ఆధునిక ప్రామాణిక తెలుగు వాడుకకీ తగినవే కాబట్టి కొనసాగించబడ్డాయి.
