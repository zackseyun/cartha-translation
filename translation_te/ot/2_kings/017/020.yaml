id: 2KI.17.20
reference: 2 Kings 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: te
  text: యాహ్వే ఇశ్రాయేలు సంతానమంతటినీ[a] తిరస్కరించాడు; వారిని బాధలకు గురిచేసి, దోచుకునేవారి చేతికి అప్పగించాడు[b], తన సన్నిధి నుండి[c] వారిని వెళ్లగొట్టేవరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు వారసులందరినీ’; హీబ్రూలో అక్షరార్థంగా, ‘ఇశ్రాయేలు విత్తనమంతటినీ.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దోచుకునేవారి చేతిలో ఇచ్చాడు’; అంటే, వారి వశానికి అప్పగించాడు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘తన ముఖం ఎదుటి నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: తిరస్కరించాడు
  rationale: మָאַס ఇక్కడ నిబంధనాత్మక, న్యాయతీర్పు సందర్భంలో నిర్ణయాత్మకంగా నిరాకరించడాన్ని సూచిస్తుంది. ‘తిరస్కరించాడు’ అనే పదం భావోద్వేగ ద్వేషాన్ని అనవసరంగా చేర్చకుండా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సంతానమంతటినీ
  rationale: זֶרַעకు ‘విత్తనం,’ ‘సంతానం,’ ‘వారసులు’ అనే భావాలు ఉన్నాయి. సమూహార్థక ఏకవచనాన్ని, సమగ్రతను సహజ తెలుగులో ‘సంతానమంతటినీ’ తెలియజేస్తుంది.
- source_word: וַיְעַנֵּם
  choice: వారిని బాధలకు గురిచేసి
  rationale: పీయేల్ రూపంలోని ענה బాధించడం, అణచడం, దీనస్థితికి తేవడం అనే పరిధి కలిగి ఉంది. ఇక్కడ తీర్పు వల్ల కలిగిన కష్టాన్ని అతిగా నిర్దిష్టం చేయకుండా ఈ పదబంధం తెలియజేస్తుంది.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: చేతికి అప్పగించాడు
  rationale: ‘ఒకరి చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారానికి మరొకరి అధికారానికి లేదా వశానికి అప్పగించడం అనే భావం ఉంది. తెలుగు నుడికారంలో ‘చేతికి అప్పగించాడు’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: שֹׁסִים
  choice: దోచుకునేవారు
  rationale: שסס మూలం నుండి వచ్చిన ఈ కృదంతం దోపిడీ చేసి కొల్లగొట్టేవారిని సూచిస్తుంది. ‘దోచుకునేవారు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: עַד אֲשֶׁר
  choice: చివరకు
  rationale: ఈ సందర్భంలో ముందున్న చర్యల పరాకాష్ఠ లేదా అంతిమ ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘చివరకు’ ఆ ముగింపు బిందువును సహజంగా తెలియజేస్తుంది.
- source_word: הִשְׁלִיכָם
  choice: వెళ్లగొట్టాడు
  rationale: השליך అక్షరార్థంగా విసరడం లేదా పారవేయడం. దేవుని సన్నిధి నుండి తొలగించే ఈ సందర్భంలో ‘వెళ్లగొట్టాడు’ బహిష్కరణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִפָּנָיו
  choice: తన సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘తన ముఖం ఎదుటి నుండి’ అనే ఈ నుడికారం ఒకరి సన్నిధి నుండి తొలగింపును సూచిస్తుంది. ‘తన సన్నిధి నుండి’ సంబంధాత్మక, న్యాయతీర్పు భావాలను నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: ‘ఇశ్రాయేలు సంతానమంతా’ అనే మాట పరిధి
  choice: పరిధిని అనువాదంలో కుదించకుండా సమగ్ర పదబంధాన్ని నిలుపడం
  alternative: ఉత్తర రాజ్యానికి మాత్రమే పరిమితం చేయడం; యాకోబు వంశస్థులలో ప్రతి ఒక్కరికీ నిరపేక్షంగా వర్తింపజేయడం
  rationale: చారిత్రక సందర్భం ఇశ్రాయేలు రాజ్యాన్ని సూచించినప్పటికీ, హీబ్రూ పాఠం ‘ఇశ్రాయేలు సంతానమంతా’ అని చెబుతుంది. అనువాదం ఆ సమగ్రతను నిలిపి, పరిధిని వ్యాఖ్యానంతో ముందుగానే నిర్ణయించదు.
- issue: దేవుడు వారిని బాధలకు గురిచేశాడనే కారణకర్తృత్వం
  choice: వ్యాకరణంలో ఉన్న దైవిక కర్తృత్వాన్ని నేరుగా నిలుపడం
  alternative: దేవుడు బాధలను కేవలం అనుమతించాడని సున్నితీకరించడం
  rationale: వాక్యంలో యాహ్వేనే וַיְעַנֵּם క్రియకు కర్త. అందువల్ల తీర్పులోని theological tensionను తగ్గించకుండా మూలపాఠపు ప్రత్యక్ష వాక్యాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; డాష్ అంతిమ బహిష్కరణను ముందున్న తీర్పు చర్యల పరాకాష్ఠగా చూపుతుంది. ‘చేతికి అప్పగించాడు,’ ‘సన్నిధి నుండి’ వంటి మూల నుడికారాలను తెలుగులో సహజంగా ఉండే మేరకు నిలిపాం.
