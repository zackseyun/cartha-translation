id: 2KI.17.35
reference: 2 Kings 17:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: te
  text: 'యాహ్వే వారితో ఒక నిబంధన చేసి, వారికి ఇలా ఆజ్ఞాపించాడు: “మీరు ఇతర దేవుళ్లకు భయపడకూడదు; వారి ఎదుట సాగిలపడకూడదు, వారిని సేవించకూడదు, వారికి బలులు అర్పించకూడదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ఒక నిబంధన చేసి
  rationale: ‘నిబంధనను కోయడం’ అనే హీబ్రూ నుడికారాన్ని పదశః కాకుండా, దాని స్థిరమైన భావమైన ‘నిబంధన చేయడం’గా సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంలో అందిస్తుంది.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: వారికి ఇలా ఆజ్ఞాపించాడు
  rationale: ఆజ్ఞ యొక్క ప్రత్యక్షతను నిలుపుతూ, ప్రత్యక్ష వాక్యాన్ని సహజ తెలుగులో పరిచయం చేస్తుంది.
- source_word: לֹא תִירְאוּ
  choice: భయపడకూడదు
  rationale: ‘భయపడడం’ అనే ప్రత్యేక భావాన్ని ఆరాధనగా విస్తరించకుండా నిలుపుతుంది; నిబంధనా ఆజ్ఞ యొక్క నిషేధ బలాన్ని ‘కూడదు’ తెలియజేస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: אֲחֵרִים యొక్క సాధారణ అర్థమైన ‘ఇతర’ను యథాతథంగా ఉంచుతుంది; ‘విదేశీ’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: תִשְׁתַּחֲווּ
  choice: సాష్టాంగపడకూడదు
  rationale: శరీరాన్ని వంచి నేలపై పడే ఆరాధనా చర్యను స్పష్టంగా తెలుపుతూ, తరువాతి ‘సేవించడం’ అనే క్రియతో భేదాన్ని కాపాడుతుంది.
- source_word: תַעַבְדוּם
  choice: వారిని సేవించకూడదు
  rationale: עבד యొక్క ప్రాథమిక ‘సేవించు’ భావాన్ని నిలుపుతూ, చుట్టుపక్కల ఉన్న ఇతర ఆరాధనా క్రియలను ఒకే పదంలో కలపదు.
- source_word: תִזְבְּחוּ לָהֶם
  choice: వారికి బలులు అర్పించకూడదు
  rationale: זבח సూచించే బలి అర్పణను సహజమైన, స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం.
- issue: నిబంధనా సందర్భంలోని నిషేధాల బలం
  choice: భయపడకూడదు ... సాష్టాంగపడకూడదు ... సేవించకూడదు ... బలులు అర్పించకూడదు
  alternative: భయపడవద్దు ... సాష్టాంగపడవద్దు ...
  rationale: ‘కూడదు’ రూపం హీబ్రూ לֹא + అసంపూర్ణ క్రియ యొక్క స్థిరమైన నిబంధనా/న్యాయ ఆజ్ఞ స్వరాన్ని సహజ తెలుగులో కాపాడుతుంది.
- issue: ‘భయపడడం’ మరియు ఆరాధన మధ్య సంబంధం
  choice: భయపడకూడదు
  alternative: ఆరాధించకూడదు
  rationale: తరువాత సాష్టాంగపడడం, సేవించడం, బలి అర్పించడం వేర్వేరుగా పేర్కొనబడినందున, మొదటి క్రియను ‘ఆరాధించు’గా సాధారణీకరించకుండా మూలంలోని భావ భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నిబంధనా స్వరం ఉంచబడింది. వాక్యం సాధారణ పాఠకులకు సులభంగా ఉండేలా నిర్మించబడింది; ‘సాష్టాంగపడడం’ ద్వారా మూలంలోని నిర్దిష్ట శారీరక ఆరాధనా చర్యను కాపాడింది.
