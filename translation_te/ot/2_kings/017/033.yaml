id: 2KI.17.33
reference: 2 Kings 17:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת יְהוָ֖ה הָי֣וּ יְרֵאִ֑ים וְ/אֶת אֱלֹֽהֵי/הֶם֙ הָי֣וּ עֹֽבְדִ֔ים כְּ/מִשְׁפַּט֙ הַ/גּוֹיִ֔ם אֲשֶׁר הִגְל֥וּ אֹתָ֖/ם מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: te
  text: వారు యాహ్వేకు భయపడుతూ తమ దేవుళ్లను సేవిస్తూ ఉండేవారు[a]; తాము ఏయే జనాల నుండి చెరగా తీసుకురాబడ్డారో, ఆ జనాల ఆచారం ప్రకారమే వారు నడుచుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు యాహ్వేకు భయపడ్డారు, కానీ తమ దేవుళ్లను సేవించారు.” హీబ్రూలో రెండు వాక్యభాగాలను కలిపేది సాధారణంగా “మరియు” అని అర్థమిచ్చే సముచ్చయం; సందర్భం దానికి వ్యతిరేక భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הָיוּ יְרֵאִים
  choice: భయపడుతూ ... ఉండేవారు
  rationale: היה + కృదంత నిర్మాణం అలవాటుగా లేదా కొనసాగుతూ జరిగిన క్రియను సూచిస్తుంది; తెలుగు సంయుక్త నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుళ్లు
  rationale: ప్రత్యయం వారి స్వంత దేవతలను సూచిస్తుంది; ‘తమ’ అనేది సంబంధాన్ని స్పష్టంగా, అదనపు భావం లేకుండా తెలియజేస్తుంది.
- source_word: הָיוּ עֹבְדִים
  choice: సేవిస్తూ ఉండేవారు
  rationale: దేవతల సందర్భంలో עבד ఆరాధనాపూర్వక సేవను సూచిస్తుంది; ‘సేవించు’ మూలపదానికి దగ్గరగా ఉండి సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: כְּמִשְׁפַּט
  choice: ఆచారం ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּט న్యాయతీర్పు కంటే స్థిరపడిన ఆచారం లేదా పద్ధతిని సూచిస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: చారిత్రక సందర్భంలో ఇది వివిధ ప్రజాసమూహాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘జనాలు’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: తాము ఏయే జనాల మధ్యనుండి చెరగా తీసుకురాబడ్డారో
  rationale: హీబ్రూ వాక్యంలో చర్య చేసినవారు పేర్కొనబడలేదు; తెలుగు కర్మణి నిర్మాణం ఆ అనిర్దిష్టతను నిలుపుతుంది. מִשָּׁם లోని ‘అక్కడి నుండి’ భావాన్ని సంబంధ వాక్యంగా సహజీకరించాం.
theological_decisions:
- issue: యెహోవాకు భయపడటం మరియు ఇతర దేవుళ్లను సేవించడం మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో ‘కానీ’ చేర్చకుండా సముచ్చయ/సమకాలీన నిర్మాణంతో ఇవ్వడం
  alternative: ‘వారు యెహోవాకు భయపడ్డారు, కానీ తమ దేవుళ్లను సేవించారు’
  rationale: హీబ్రూలో וְ అనే సాధారణ సముచ్చయం మాత్రమే ఉంది. సందర్భంలో స్పష్టమైన మతసంకర విరోధం ఉన్నప్పటికీ, మూలంలోని వ్యాకరణ అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, వ్యతిరేక భావసంభావ్యతను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కొనసాగుతున్న అలవాటును చూపేందుకు ‘భయపడుతూ ... సేవిస్తూ ఉండేవారు’ అనే సమాంతర నిర్మాణం వాడబడింది; మూలంలోని సముచ్చయ అస్పష్టత ఉద్దేశపూర్వకంగా నిలుపబడింది.
