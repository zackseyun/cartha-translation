source:
  edition: WLC
  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: te
  text: ఎందుకంటే ఆయన ఇశ్రాయేలును దావీదు వంశం నుండి చీల్చి వేశాడు; వారు నెబాతు కుమారుడైన యెరోబామును రాజుగా చేశారు. యెరోబాము ఇశ్రాయేలును యాహ్వేను అనుసరించకుండా దూరం చేశాడు[a], వారు గొప్ప పాపం చేయునట్లు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పక్కదారి పట్టించాడు.” హీబ్రూ క్రియకు బలంగా దూరం చేయడం లేదా తప్పుదారి పట్టించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע יִשְׂרָאֵל מֵעַל בֵּית דָּוִד
  choice: ఇశ్రాయేలు దావీదు వంశం నుండి తనను తాను చీల్చుకొని విడిపోయింది
  rationale: קָרַע అనే క్రియలోని ‘చీల్చడం’ అనే సజీవ రూపకాన్ని నిలుపుతూ, రాజకీయంగా దావీదు రాజవంశాధికారం నుండి విడిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. హీబ్రూలో ఇశ్రాయేలు కర్తగా ఉండవచ్చు; మునుపటి వాక్యంలోని యాహ్వేను అవ్యక్త కర్తగా తీసుకొని ఇశ్రాయేలును కర్మగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֵּית דָּוִד
  choice: దావీదు వంశం
  rationale: ఇక్కడ ‘ఇల్లు’ అనేది భవనాన్ని కాక దావీదు రాజవంశాన్ని సూచిస్తుంది; ‘వంశం’ సాధారణ తెలుగు పాఠకునికి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּמְלִיכוּ
  choice: రాజుగా చేశారు
  rationale: מלך హిఫీల్ రూపంలోని ‘రాజ్యపాలన చేయేలా నియమించడం’ అనే కారణార్థక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּדַּח
  choice: దూరం చేసి
  rationale: נדח క్రియలో బలవంతంగా దూరం చేయడం లేదా పక్కదారి పట్టించడం అనే రెండూ సాధ్యమైన భావాలు ఉన్నాయి. ప్రధాన పాఠం దిశా-వియోగ భావాన్ని నిలుపుతుంది; మరో భావాన్ని పాదసూచిక ఇస్తుంది.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: యాహ్వేను అనుసరించకుండా
  rationale: ‘యాహ్వే వెనుక నుండి’ అనే హీబ్రూ నుడికారానికి ‘యాహ్వేను అనుసరించడం మానడం’ అనే ఒడంబడిక సంబంధిత భావం ఉంది; తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְהֶחֱטֵיאָם חֲטָאָה גְדוֹלָה
  choice: వారితో ఒక గొప్ప పాపం చేయించాడు
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థకతను ‘చేయించాడు’ స్పష్టంగా నిలుపుతుంది; חֲטָאָה גְדוֹלָהను అతిశయ వ్యాఖ్యానం లేకుండా ‘ఒక గొప్ప పాపం’గా అనువదించాం.
theological_decisions:
- issue: ఈ విభజనకు కర్త ఎవరు?
  choice: ఇశ్రాయేలు తనను తాను చీల్చుకొని విడిపోయింది
  alternative: ఆయన ఇశ్రాయేలును దావీదు వంశం నుండి చీల్చి వేశాడు
  rationale: క్రియ ఏకవచనంగా ఉండటం వల్ల ‘ఇశ్రాయేలు’ కర్తగా వ్యాకరణపరంగా చదవవచ్చు; అయితే ముందు వచనంలోని యాహ్వేను అవ్యక్త కర్తగా, ‘ఇశ్రాయేలు’ను గుర్తులేని కర్మగా తీసుకునే పఠనం కూడా సాధ్యమే. ప్రధాన పాఠం మొదటి పఠనాన్ని అనుసరిస్తూ రెండవదాన్ని పాదసూచికలో సంరక్షిస్తుంది.
- issue: యెరోబాము పాత్రలో బలవంతం లేదా మోసదారి భావం
  choice: ఇశ్రాయేలును యాహ్వేను అనుసరించకుండా దూరం చేశాడు
  alternative: ఇశ్రాయేలును యాహ్వేను అనుసరించకుండా పక్కదారి పట్టించాడు
  rationale: נדח రెండు భావ ఛాయలనూ అనుమతిస్తుంది. ప్రధాన పాఠం దూరం చేసే బలమైన దిశా భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయం తప్పుదారి నడిపించే భావాన్ని చూపుతుంది.
- issue: יהוה దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ‘దావీదు ఇల్లు’ అనే అక్షరార్థానికి బదులు రాజవంశ భావాన్ని తెలిపే ‘దావీదు వంశం’ను ఎంచుకున్నాం. మూలంలోని దీర్ఘ సమన్వయ వాక్యాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించాం; కారణసంబంధాన్ని ‘ఎందుకంటే’తో నిలిపాం.
