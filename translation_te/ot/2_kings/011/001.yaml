translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. ఆరంభంలోని waw కోసం మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు. ‘నాశనం చేసింది’ అనే విస్తృత పదంతో హీబ్రూ క్రియ యొక్క బలాన్ని నిలిపి, హత్య విధానాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
