base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: te
  text: అహజ్యా తల్లి అతల్యా, తన కుమారుడు చనిపోయాడని చూసి, లేచి రాజవంశ సంతానమంతటినీ[a] నాశనం చేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రాజ్యపు విత్తనమంతటినీ”; అంటే రాజవంశానికి చెందిన సంతానాన్ని లేదా వారసులను.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ
  choice: అహజ్యా తల్లి అతల్యా
  rationale: హీబ్రూ సంబంధసూచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో ఇచ్చి, వ్యక్తినామాలను ప్రామాణిక బైబిలు తెలుగు రూపాల్లో లిప్యంతరీకరించాం.
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: తన కుమారుడు చనిపోయాడని చూసి
  rationale: ראה + כי ఇక్కడ ఒక వాస్తవాన్ని గ్రహించడాన్ని సూచిస్తుంది; מת యొక్క మరణస్థితి/సంభవాన్ని తెలుగులో సహజంగా ‘చనిపోయాడని’ అని వ్యక్తపరచాం.
- source_word: וַתָּקָם
  choice: లేచి
  rationale: קום కథనంలో నిర్ణయాత్మక చర్యకు దిగడాన్ని సూచిస్తుంది. ‘లేచి’ మూలంలోని రూపకాన్ని నిలుపుతూ తదుపరి క్రియతో సహజంగా కలుస్తుంది.
- source_word: וַתְּאַבֵּד
  choice: నాశనం చేసింది
  rationale: పియేల్ రూపంలోని אבד ‘నాశనం చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. సందర్భంలో చంపివేయడం భావమైనా, మూలపదం చెప్పినదానికంటే విధానాన్ని అధికంగా నిర్దిష్టం చేయలేదు.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: రాజవంశ సంతానమంతటినీ
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; ఈ రాజవంశ సందర్భంలో వారసులు/సంతానం అని అర్థం. הַמַּמְלָכָה యొక్క వంశపారంపర్య రాజరిక భావాన్ని ‘రాజవంశ’ స్పష్టంగా అందిస్తుంది.
