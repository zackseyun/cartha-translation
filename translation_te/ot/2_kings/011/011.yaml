translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని సైనిక సిద్ధస్థితి, స్థలవర్ణన, రాజును చుట్టుముట్టిన రక్షణ భావం నిలుపబడ్డాయి.
