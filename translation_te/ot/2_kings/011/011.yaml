  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַמְד֨וּ הָ/רָצִ֜ים אִ֣ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: te
  text: కాపలాదారులు[a] ఒక్కొక్కరూ తమ ఆయుధాలను చేతబట్టుకొని, మందిరపు కుడి వైపు నుంచి ఎడమ వైపు వరకు[b], బలిపీఠం దగ్గర, మందిరం[c] దగ్గర రాజు చుట్టూ నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరుగెత్తేవారు’; అంటే రాజ అంగరక్షకులు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘మందిరపు కుడి వైపు నుంచి ఎడమ వైపు వరకు.’ మందిరపు దిశల ప్రకారం దీన్ని ‘దక్షిణ వైపు నుంచి ఉత్తర వైపు వరకు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో ‘ఇల్లు’; ఇక్కడ అది మందిర భవనాన్ని లేదా మందిర ప్రాంగణాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: కాపలాదారులు
  rationale: ఈ పదం అక్షరార్థంగా ‘పరుగెత్తేవారు’ అని వచ్చినా, రాజసంబంధమైన ఈ సైనిక సందర్భంలో ఆయుధాలు ధరించిన రాజ అంగరక్షకులను సూచిస్తుంది. ‘కాపలాదారులు’ ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ఒక్కొక్కరూ తమ ఆయుధాలను చేతబట్టుకొని
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో ‘ఒక్కొక్కరు’ అని అర్థం. כְּלִי సాధనం లేదా ఆయుధం అని అర్థమివ్వగలదు; సాయుధ కాపలా సందర్భంలో ‘ఆయుధాలు’ సరైనది. ‘చేతబట్టుకొని’ అనే ప్రయోగం వారి సిద్ధస్థితిని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: కుడి వైపు నుంచి ఎడమ వైపు వరకు
  rationale: כֶּתֶף అక్షరార్థంగా ‘భుజం’; భవన స్థలవర్ణనలో ‘వైపు/పక్క’ అనే భావం ఇస్తుంది. అందువల్ల తెలుగులో సహజమైన స్థలవర్ణనను ఎంచుకున్నాం.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: హీబ్రూ పదానికి సాధారణ అర్థం ‘ఇల్లు’; ఈ సందర్భంలో అది యెహోవా మందిరాన్ని లేదా దాని ప్రాంగణాన్ని సూచిస్తుంది. తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది; మూలపదంలోని సాధారణ రూపాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: కుడి ... ఎడమ
  rationale: ఈ విశేషణాల ప్రత్యక్ష అర్థాలు ‘కుడి’ మరియు ‘ఎడమ’. మందిర దిశావర్ణనలో ఇవి దక్షిణం, ఉత్తరం అని కూడా గ్రహించవచ్చు; ప్రధాన పాఠంలో ప్రత్యక్ష అర్థాన్ని ఉంచి, దిశాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: బలిపీఠం దగ్గర, మందిరం దగ్గర
  rationale: ל ఉపసర్గ ఈ సంక్షిప్త స్థలవర్ణనలో స్థానం లేదా దిశను సూచించగలదు. ‘దగ్గర’ అనేది ఖచ్చితమైన స్పర్శను లేదా కేవలం దిశను బలవంతంగా నిర్ణయించకుండా వారి స్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: రాజు చుట్టూ
  rationale: ఈ పదబంధం రాజును అన్ని వైపులా రక్షణగా చుట్టుముట్టిన స్థితిని సూచిస్తుంది. ‘రాజు చుట్టూ’ సంక్షిప్తంగా మూలభావాన్ని నిలుపుతుంది.
