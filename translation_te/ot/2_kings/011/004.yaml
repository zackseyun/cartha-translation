source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: te
  text: ఏడవ సంవత్సరంలో యెహోయాదా కారీయులకూ పరుగువారికీ చెందిన నూరుమంది సైనికుల అధిపతులను పంపించి, వారిని యాహ్వే మందిరంలో తన వద్దకు తీసుకువచ్చాడు. ఆయన వారితో ఒడంబడిక చేసి, యాహ్వే మందిరంలో వారిచేత ప్రమాణం చేయించి, వారికి రాజకుమారుణ్ణి చూపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: ఏడవ సంవత్సరంలో
  rationale: కథన కాలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఏ సంఘటన మొదలైన ఏడవ సంవత్సరమో మూలపాఠం ఈ వచనంలో చెప్పనందున ఆ అస్పష్టతను అలాగే ఉంచింది.
- source_word: שָׁלַח וַיִּקַּח
  choice: పిలిపించి
  rationale: పంపించి వారిని తన వద్దకు రప్పించిన చర్యను సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; వెంట వచ్చే ‘తన దగ్గరకు తీసుకొచ్చాడు’ అనే భావంతో అనుసంధానమవుతుంది.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: నూరుమందికి అధిపతులైన వారు
  rationale: నూరుమందితో కూడిన విభాగాలకు నాయకులైన అధికారులను సూచించే హీబ్రూ పదబంధాన్ని రోమా సైనిక పదవిని దిగుమతి చేయకుండా పారదర్శకంగా అనువదిస్తుంది.
- source_word: לַכָּרִי
  choice: కారీయులు
  rationale: ఖచ్చితమైన గుర్తింపు అనిశ్చితంగా ఉన్న ఈ సమూహనామాన్ని పేరుగానే నిలుపుతుంది; ‘కెరేతీయులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וְלָרָצִים
  choice: పరుగువారు
  rationale: అక్షరార్థమైన హోదాను నిలుపుతుంది. వీరు రాజ అంగరక్షకులు లేదా వార్తాహరులు అయి ఉండవచ్చనే కార్యాత్మక అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וַיָּבֵא אֹתָם אֵלָיו בֵּית יְהוָה
  choice: యాహ్వే మందిరంలో తన దగ్గరకు తీసుకొచ్చాడు
  rationale: వారిని యెహోయాదా సమక్షానికి, యాహ్వే ఆలయానికి తీసుకొచ్చిన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: వారితో ఒడంబడిక చేసి
  rationale: ‘ఒడంబడిక కోయడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో స్థిరపడిన ‘ఒడంబడిక చేయడం’గా అనువదించి, దాని గంభీరమైన రాజకీయ-ధార్మిక బరువును కాపాడుతుంది.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: వారిచేత ప్రమాణం చేయించి
  rationale: యెహోయాదా వారిని ప్రమాణం చేయేలా చేశాడనే causative భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: వారికి రాజ కుమారుణ్ణి చూపించాడు
  rationale: దాచివుంచబడిన రాజ కుమారుణ్ణి వారి ఎదుట చూపించిన చర్యను నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా నిలుపుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు, అయితే రాజదర్బారు మరియు ఆలయ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. అస్పష్టమైన దళనామాలను వివరణాత్మక పదాలతో మార్చకుండా ప్రధాన పాఠంలో నిలిపి, అవసరమైన సమాచారాన్ని పాదసూచికల్లో ఇచ్చాం. ఆంగ్ల సంప్రదింపుపాఠంలో పాదసూచిక సూచికలు భావాలకు సరిపోని స్థానాల్లో ఉన్నందున, [a]ను ‘కారీయులు’ వద్ద మరియు [b]ను ‘పరుగువారు’ వద్ద ఉంచాం.
