  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: te
  text: అతడు ఆమెతో కలిసి యెహోవా మందిరంలో ఆరు సంవత్సరాలు దాక్కొని ఉన్నాడు. ఆ సమయంలో అతల్యా దేశాన్ని పరిపాలిస్తూ ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: ‘యెహోవా గృహం’ అనే రూపం సాధ్యమైనా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘యెహోవా మందిరం’ను ఎంచుకున్నాం.
- source_word: מִתְחַבֵּא
  choice: దాక్కొని ఉన్నాడు
  rationale: హిత్పయేల్ భాగధాతువు కొనసాగుతున్న రహస్యవాసాన్ని సూచిస్తుంది; అందువల్ల స్థితిని మాత్రమే తెలిపే ‘దాచబడ్డాడు’కు బదులు క్రియాశీలమైన ‘దాక్కొని ఉన్నాడు’ అని అనువదించాం.
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: దేశాన్ని పరిపాలిస్తూ ఉంది
  rationale: అతల్యా పాలన కొనసాగుతున్నదనే స్త్రీలింగ క్రియారూప భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో కలపకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో నిలిపాం.
- issue: מִתְחַבֵּא లోని కర్తృత్వం
  choice: అతడు దాక్కొని ఉన్నాడు
  alternative: అతడు దాచబడి ఉన్నాడు
  rationale: మూలంలోని హిత్పయేల్ రూపం ప్రతిఫల/మధ్యస్థ భావంతో యోవాషు దాగి ఉండడాన్ని సూచిస్తుంది; అతన్ని ఎవరు దాచారో ఈ వాక్యంలో స్పష్టంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్య నిర్మాణం వాడబడింది. మూలంలోని రెండు సమకాలీన స్థితులను స్పష్టత కోసం రెండు వాక్యాలుగా వ్యక్తం చేశాం.
