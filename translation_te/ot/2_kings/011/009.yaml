  text: וַֽ/יַּעֲשׂ֞וּ שָׂרֵ֣י ה/מאיות כְּ/כֹ֣ל אֲשֶׁר צִוָּה֮ יְהוֹיָדָ֣ע הַ/כֹּהֵן֒ וַ/יִּקְחוּ֙ אִ֣ישׁ אֶת אֲנָשָׁ֔י/ו בָּאֵ֣י הַ/שַּׁבָּ֔ת עִ֖ם יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וַ/יָּבֹ֖אוּ אֶל יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: te
  text: అప్పుడు వందమందికి అధిపతులు యెహోయాదా యాజకుడు ఆజ్ఞాపించినదంతా చేశారు. వారిలో ప్రతి ఒక్కరూ తన మనుష్యులను—విశ్రాంతిదినాన విధిలోకి వచ్చేవారిని, విశ్రాంతిదినాన విధి ముగించుకొని వెళ్లేవారితో పాటు[a]—తీసుకొని యెహోయాదా యాజకుని దగ్గరకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “విశ్రాంతిదినాన లోపలికి వచ్చేవారిని, విశ్రాంతిదినాన బయటికి వెళ్లేవారితో పాటు.” సందర్భాన్ని బట్టి ఇవి విధిలోకి వచ్చే, విధి ముగించుకొని వెళ్లే పాళీలను సూచిస్తున్నట్లు కనిపిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: వందమందికి అధిపతులైన అధికారులు
  rationale: సైనిక విభాగాలపై అధికారాన్ని స్పష్టంగా తెలియజేస్తూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: ఆజ్ఞకు సంపూర్ణంగా లోబడిన భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: యెహోయాదా ఇచ్చిన అధికారపూర్వక ఆదేశం యొక్క బలాన్ని నిలుపుతుంది.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: ప్రతి అధికారి తన మనుష్యులను
  rationale: אִישׁ యొక్క విభజనార్థక భావాన్ని స్పష్టం చేసి, ప్రతి అధికారి తన ఆధీనంలోని వారిని తీసుకున్నాడని తెలియజేస్తుంది.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: విశ్రాంతిదినాన విధిలోకి వచ్చేవారిని
  rationale: దేవాలయ రక్షక దళాల సందర్భంలో పాళీకి వచ్చేవారనే కార్యార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: విధి ముగించుకొని వెళ్లేవారితో
  rationale: ముందటి పదబంధానికి జతగా పాళీ ముగించి వెళ్లే బృందాన్ని సూచిస్తుంది; మూలంలోని రావడం–వెళ్లడం వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: עִם
  choice: తో పాటు
  rationale: వచ్చే, వెళ్లే రెండు బృందాలూ కలిపి తీసుకురాబడ్డాయని స్పష్టం చేస్తుంది.
- source_word: וַיָּבֹאוּ אֶל
  choice: దగ్గరకు వచ్చాడు
  rationale: సమూహంలోని ప్రతి అధికారి అనే ఏకవచన నిర్మాణానికి అనుగుణంగా సహజ తెలుగు వాక్యాంతాన్ని ఇస్తుంది; మూలంలోని బహువచన చర్య భావం సందర్భంలో నిలిచి ఉంటుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: హీబ్రూ బిరుదుకు సాధారణమైన, స్థిరమైన తెలుగు సమానార్థకం.
