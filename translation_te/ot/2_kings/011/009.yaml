  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘విశ్రాంతిదినం’ అనే సుపరిచిత బైబిలు పదాన్ని ఉంచి, పాళీల భావాన్ని ప్రధాన పాఠంలో సహజంగా తెలిపి, హీబ్రూ అక్షరార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
