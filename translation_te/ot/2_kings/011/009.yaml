revisions:
- from: అప్పుడు వందమందికి అధిపతులైన అధికారులు యెహోయాదా యాజకుడు ఆజ్ఞాపించినదంతా చేశారు. ప్రతి అధికారి తన మనుష్యులను—విశ్రాంతిదినాన విధిలోకి వచ్చేవారిని, విధి ముగించుకొని వెళ్లేవారితో పాటు[a]—తీసుకొని యెహోయాదా యాజకుని దగ్గరకు వచ్చాడు.
  to: అప్పుడు వందమందికి అధిపతులు యెహోయాదా యాజకుడు ఆజ్ఞాపించినదంతా చేశారు. వారిలో ప్రతి ఒక్కరూ తన మనుష్యులను—విశ్రాంతిదినాన విధిలోకి వచ్చేవారిని, విశ్రాంతిదినాన విధి ముగించుకొని వెళ్లేవారితో పాటు[a]—తీసుకొని యెహోయాదా యాజకుని దగ్గరకు వచ్చారు.
  rationale: The revision corrects the plural action at the end of the verse, removes redundant wording for the commanders, and explicitly applies the Sabbath qualifier to both incoming and outgoing groups. It preserves the Hebrew’s distributive “each,” the contextual shift-language in the main text, and the literal lexical alternative in the footnote.
  reviewer_model: gpt-5.6-terra
