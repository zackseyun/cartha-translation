  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: te
  text: అతల్యా కాపలాదారుల[a] మరియు ప్రజల కోలాహలం విని, యాహ్వే మందిరంలో[b] ఉన్న ప్రజల దగ్గరకు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాపలాదారులు’—అక్షరార్థంగా ‘పరుగెత్తేవారు’; బహుశా రాజ అంగరక్షక దళం.
    reason: lexical_alternative
  - marker: b
    text: ‘మందిరం’ అనే మాట దేవాలయ ఆవరణను కూడా సూచించవచ్చు.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: విని
  rationale: కథన సందర్భంలో שׁמע సాధారణంగా శబ్దాన్ని వినడాన్ని సూచిస్తుంది; ‘విని’ సహజమైన తెలుగు రూపం.
- source_word: עֲתַלְיָה
  choice: అతల్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా, తెలుగులో సులభంగా పలికే లిప్యంతరీకరణ.
- source_word: קוֹל
  choice: కోలాహలం
  rationale: קוֹל అంటే స్వరం, శబ్దం లేదా ధ్వని కావచ్చు. కాపలాదారులు, ప్రజలు కూడిన ఈ బహిరంగ సందర్భంలో వినిపించిన సమిష్టి శబ్దాన్ని ‘కోలాహలం’ సహజంగా తెలియజేస్తుంది.
- source_word: הָרָצִין
  choice: కాపలాదారులు
  rationale: ఈ పదానికి అక్షరార్థంగా ‘పరుగెత్తేవారు’ అనే భావం ఉన్నా, రాజసంబంధ సందర్భాల్లో అంగరక్షక దళాన్ని సూచిస్తుంది; ‘కాపలాదారులు’ దాని కార్యపరమైన అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עָם కు సాధారణమైన, ప్రత్యక్ష తెలుగు సమానం ‘ప్రజలు’; ఇక్కడ కూడివున్న జనాన్ని సూచిస్తుంది.
- source_word: וַתָּבֹא אֶל
  choice: దగ్గరికి వచ్చింది
  rationale: בוא + אֶל లక్ష్యంవైపు రావడం లేదా వెళ్లడాన్ని సూచిస్తుంది; కథనంలో ‘దగ్గరికి వచ్చింది’ సహజంగా ఉంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: బֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ దేవాలయాన్ని సూచిస్తుంది. יְהוָה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించడం ఆధునిక తెలుగు పాఠకులకు సుపరిచితంగా, పేరుగా స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’గా మార్చకుండా పేరుగా నిలుపుతూ, తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: בֵּית יְהוָה యొక్క స్థలార్థం
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: అక్షరార్థమైన ‘ఇల్లు’ భావాన్ని సందర్భం దేవాలయంగా నిర్దిష్టం చేస్తుంది. ‘మందిరం’ సాధారణ పాఠకునికి స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది; దేవాలయ ఆవరణమంతటినీ సూచించే అవకాశాన్ని పాదసూచనలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కోలాహలం’ సమూహం చేసిన శబ్దాన్ని తెలియజేస్తుంది. మూలంలోని ‘కాపలాదారుల, ప్రజల శబ్దం’ అనే సమన్వయాన్ని తెలుగు విభక్తి నిర్మాణంలో సంక్షిప్తంగా నిలిపాం; పాదసూచిక గుర్తులను సంబంధిత పదబంధాల తరువాత ఉంచాం.
