source:
  edition: WLC
  text: וַ/יְצַו֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י ה/מיאות פְּקֻדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הוֹצִ֤יאוּ אֹתָ/הּ֙ אֶל מִ/בֵּ֣ית לַ/שְּׂדֵרֹ֔ת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ הָמֵ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן אַל תּוּמַ֖ת בֵּ֥ית יְהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: te
  text: 'అప్పుడు యాజకుడైన యెహోయాదా సైన్యానికి నియమించబడిన వందమంది సైనికుల అధిపతులకు ఆజ్ఞాపించి, వారితో ఇలా అన్నాడు: “ఆమెను సైనిక వరుసల మధ్యనున్న చోటికి బయటికి తీసుకెళ్లండి[a]. ఆమెను అనుసరించి వచ్చే ఎవరినైనా కత్తితో చంపండి.” యాజకుడు, “యాహ్వే మందిరంలో ఆమెను చంపకూడదు” అని చెప్పి ఉన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం క్లిష్టమైనది. దీనిని “వరుసల బయటికి” లేదా “వరుసల మధ్యనున్న ప్రదేశానికి” అని కూడా అనువదించవచ్చు. బహుశా క్రమంగా నిలిచిన సైనిక వరుసలకు సంబంధించి ఆమెను బయటికి తీసుకెళ్లడాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: వందమందికి అధిపతులు
  rationale: యూదా సైనిక వ్యవస్థలోని హోదాను రూపపరంగా నిలుపుతుంది; రోమా నేపథ్యాన్ని సూచించే పదాన్ని ఉపయోగించదు.
- source_word: פְּקֻדֵי הַחַיִל
  choice: సైన్యంపై నియమించబడిన
  rationale: פקד యొక్క కర్మణి భావాన్ని, సైన్యానికి సంబంధించి వారికి అప్పగించబడిన అధికార బాధ్యతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: ఆమెను ... బయటికి తీసుకెళ్లండి
  rationale: హిఫీల్ ఆజ్ఞార్థక రూపంలోని బయటికి తీసుకురావడం/తీసుకెళ్లడం అనే causative భావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: కాపలాదళాల వరుసల మధ్యగా
  rationale: హీబ్రూ పదబంధం క్లిష్టమైనది. ఆలయ ప్రాంగణం నుంచి క్రమబద్ధంగా నిలిచిన కాపలాదళాల వరుసల గుండా ఆమెను బయటికి తీసుకెళ్లడమే సందర్భానికి సరిపోతుంది; అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: ఆమెను అనుసరించి వచ్చేవారెవరినైనా
  rationale: 'నిర్దేశక ఉపపదంతో ఉన్న ఏకవచన కృదంతానికి సాధారణీకృత భావం ఉంది: ఆమె వెంట వచ్చే ఎవరైనా.'
- source_word: הָמֵת בֶּחָרֶב
  choice: కత్తితో చంపండి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్ యొక్క బలమైన ఆజ్ఞార్థక ప్రయోగాన్ని తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אַל תּוּמַת
  choice: ఆమెను చంపకూడదు
  rationale: కర్మణి నిషేధార్థక భావాన్ని స్పష్టమైన తెలుగు వాక్యనిర్మాణంలో ఇస్తుంది; కర్తను సందర్భం నుంచి చేర్చింది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘ఇల్లు’ అనే మూలార్థం ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: ఆలయంలో చంపరాదనే నిషేధం
  choice: యెహోవా మందిరంలో ఆమెను చంపకూడదు
  alternative: యెహోవా మందిరంలో ఆమె చనిపోకూడదు
  rationale: కర్మణి రూపాన్ని సహజమైన తెలుగులో తెలిపింది; ఆలయ పవిత్రతకు గల కారణాన్ని వచనం చెప్పనందున దానిని వివరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. సైనిక హోదాను చారిత్రకంగా తటస్థంగా ఉంచి, క్లిష్టమైన స్థలసూచక పదబంధంలోని అనిశ్చితిని పాదటిప్పణిలో సంరక్షించింది.
