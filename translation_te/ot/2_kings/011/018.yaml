source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: te
  text: అప్పుడు దేశ ప్రజలందరూ బయలు మందిరంలోకి వెళ్లి దాన్ని కూల్చివేశారు.[a] అతని బలిపీఠాలను, ప్రతిమలను పూర్తిగా పగులగొట్టి,[b] బయలు యాజకుడైన మత్తానును ఆ బలిపీఠాల ఎదుట చంపారు. ఆ తర్వాత యాజకుడు యాహ్వే మందిరంపై పర్యవేక్షకులను నియమించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బయలు ఇల్లు’; అంటే బయలు దేవుని ఆరాధనా మందిరం.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రతిమలు’ అనే పదాన్ని ‘విగ్రహాలు’ లేదా ‘విగ్రహరూపాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘పర్యవేక్షకులు’ అనే హీబ్రూ పదం ‘బాధ్యతలు,’ ‘నియామకాలు’ లేదా ‘కాపలాదారులు’ అనే భావాలను కూడా సూచించవచ్చు. ‘యాహ్వే’ అనేది יהוה అనే దైవనామం; దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: textual_and_lexical_clarification
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరూ
  rationale: రాజులు గ్రంథంలోని రాజకీయ-సామాజిక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘సామాన్య ప్రజలు’ అని అర్థాన్ని అనవసరంగా కుదించదు.
- source_word: בֵּית הַבַּעַל
  choice: బయలు మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఆరాధనా స్థల సందర్భంలో ‘మందిరం’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּתְּצֻהוּ
  choice: దాన్ని కూల్చివేశారు
  rationale: నిర్మాణాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే క్రియార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִזְבְּחֹתָיו
  choice: అతని బలిపీఠాలను
  rationale: ఏకవచన పుంలింగ ప్రత్యయాన్ని బయలుకు అన్వయించి, హీబ్రూ రూపాన్ని నిలుపుతుంది.
- source_word: צְלָמָיו
  choice: ప్రతిమలను
  rationale: విగ్రహాలు/రూపాలు అనే విస్తృత భావాన్ని కలిగిన పదానికి తటస్థమైన అనువాదం; ‘విగ్రహాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో సూచించాం.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: పూర్తిగా పగులగొట్టి
  rationale: క్రియతో కూడిన తీవ్రతాసూచక అవ్యయాన్ని సహజమైన తెలుగులో సంపూర్ణ ధ్వంసంగా వ్యక్తం చేస్తుంది.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: బయలు యాజకుడైన మత్తానును
  rationale: వ్యక్తి పేరు, అతని యాజక పదవిని నేరుగా, స్పష్టంగా గుర్తిస్తుంది.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: ఆ బలిపీఠాల ఎదుట
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: פְּקֻדּוֹת
  choice: పర్యవేక్షకులను
  rationale: ఈ పదం బాధ్యతలు, నియామకాలు లేదా పర్యవేక్షణకు నియమితులైన వారిని సూచించగలదు; వ్యక్తులను ఉద్దేశించిన సందర్భార్థాన్ని ‘పర్యవేక్షకులు’ సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ఆరాధనా భవనాన్ని తెలుగులో సహజంగా సూచిస్తూ, יהוה అనే దైవనామాన్ని సంప్రదాయ తెలుగు రూపమైన ‘యెహోవా’గా ప్రత్యక్షంగా ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదైన ‘ప్రభువు’గా మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’. మూల ఉచ్చారణకు సమీపమైన ‘యాహ్వే’ను పాదసూచికలో తెలిపాం.
- issue: פְּקֻדּוֹת యొక్క వ్యక్తి/విధి సందిగ్ధత
  choice: పర్యవేక్షకులను
  alternative: బాధ్యతలను; కాపలాదారులను
  rationale: పదం పర్యవేక్షణ బాధ్యతలను లేదా వాటికి నియమితులైన వారిని సూచించగలదు. సందర్భంలో యాజకుడు మందిర నిర్వహణ ఏర్పాట్లు చేస్తున్నందున వ్యక్తివాచక అనువాదాన్ని ప్రధాన పాఠంలో ఎంచుకుని, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘బయలు,’ ‘బలిపీఠం,’ ‘యాజకుడు,’ ‘యెహోవా’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అసహజమైన హీబ్రూ వాక్యక్రమాన్ని అనుకరించలేదు. పాదసూచిక సూచికలు ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
