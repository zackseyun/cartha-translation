  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: te
  text: అప్పుడు యాజకుడు యాహ్వే మందిరంలో[b] ఉన్న రాజైన దావీదుకు చెందిన ఈటెలను[a], డాళ్లను శతాధిపతులకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఈటెను’ అని ఏకవచనంలో ఉంది; ఇక్కడ అది సమూహార్థకంగా వాడబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘యాహ్వే ఇంటిలో’; దీనిని ‘యాహ్వే మందిరంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: అప్పుడు ... ఇచ్చాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్ట ఏకవచన నామవాచకానికి సహజమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: వందమంది దళాల అధిపతులకు
  rationale: ఈ పదబంధం నూరుమంది చొప్పున ఉన్న సైనిక విభాగాలకు నాయకత్వం వహించే అధికారులను సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: הַחֲנִית
  choice: బల్లెములను
  rationale: హీబ్రూలో రూపం ఏకవచనమైనా, అనేకమంది అధిపతులకు ఆయుధాలు పంచే సందర్భంలో ఇది సమూహార్థకంగా ఉండవచ్చు; అందువల్ల తెలుగులో బహువచనం సందర్భానికి సరిపోతుంది.
- source_word: הַשְּׁלָטִים
  choice: డాళ్లను
  rationale: రాజసంబంధమైన ఆయుధ సామగ్రి సందర్భంలో ఈ పదానికి ‘డాళ్లు’ అనేది బలమైన, ప్రామాణిక అర్థం.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: రాజైన దావీదుకు చెందిన
  rationale: హీబ్రూ సంబంధవాక్యం స్వామ్యాన్ని సూచిస్తుంది; తెలుగు రూపం ఆ సంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యాహ్వే మందిరంలో
  rationale: అక్షరార్థంగా ‘యాహ్వే ఇంటిలో’; ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరంలో’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తినామ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నాలుగు హీబ్రూ అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించడం మూలంలోని వ్యక్తినామాన్ని కాపాడుతుంది.
- issue: הַחֲנִית పదం ఏకవచనమా, సమూహార్థకమా
  choice: బల్లెములను
  alternative: బల్లెమును
  rationale: రూపపరంగా ఏకవచనమే అయినా, అనేకమంది దళాధిపతులకు డాళ్లతో పాటు ఆయుధాలు ఇవ్వబడుతున్న సందర్భం సమూహార్థాన్ని బలపరుస్తుంది. అయినప్పటికీ అసలు ఏకవచన రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సైనిక పదబంధాన్ని స్పష్టత కోసం ‘వందమంది దళాల అధిపతులు’గా అందించాం; మూలంలోని ఏకవచన-సమూహార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
