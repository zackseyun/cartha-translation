source:
  edition: WLC
  text: וְ/הַ/שְּׁלִשִׁית֙ בְּ/שַׁ֣עַר ס֔וּר וְ/הַ/שְּׁלִשִׁ֥ית בַּ/שַּׁ֖עַר אַחַ֣ר הָ/רָצִ֑ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת הַ/בַּ֖יִת מַסָּֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: te
  text: మూడో వంతు సూర్ ద్వారం దగ్గర, మరో మూడో వంతు పరుగువారి[a] వెనుకనున్న ద్వారం దగ్గర ఉండాలి. మీరు ఆ భవనానికి చొరబాటును అడ్డుకోవడానికి కాపలా కాయాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పరుగువారు’; ఇది రాజ అంగరక్షకులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం అర్థం అనిశ్చితం; ‘అవరోధంగా,’ ‘రక్షణార్థం,’ లేదా ‘ప్రవేశాన్ని అడ్డుకోవడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: మూడవ వంతు / మరో మూడవ వంతు
  rationale: స్త్రీలింగ ఏకవచన క్రమసంఖ్య సందర్భంలో కాపలాదారుల మూడు విభాగాల్లో ఒక్కో మూడవ భాగాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు రెండో సందర్భంలో ‘మరో’ చేర్చబడింది.
- source_word: בְּשַׁעַר סוּר
  choice: సూర్ ద్వారం దగ్గర
  rationale: שַׁעַר అంటే ‘ద్వారం’; סוּר‌ను ఇక్కడ స్థలనామంగా తీసుకొని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: పరుగువారి వెనుకనున్న ద్వారం దగ్గర
  rationale: אַחַר‌కు సహజమైన అర్థం ‘వెనుక’. ఈ పదబంధం సూచించే నిర్మాణ సంబంధాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా హీబ్రూ పదక్రమ భావాన్ని నిలిపాం.
- source_word: הָרָצִים
  choice: పరుగువారు
  rationale: רוץ ధాతువునుంచి వచ్చిన ఈ నామవాచకానికి అక్షరార్థం ‘పరుగువారు’. రాజసంబంధ సందర్భాల్లో ఇది అంగరక్షక దళాన్ని సూచించవచ్చు; ఆ కార్యార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: మీరు ... కాపలా కాయాలి
  rationale: ఒకే మూలానికి చెందిన క్రియ, నామవాచకాల కలయిక కాపలా బాధ్యతను బలపరుస్తుంది. తెలుగులోని ‘కాపలా కాయాలి’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַבַּיִת
  choice: ఆ భవనం
  rationale: בַּיִת ప్రాథమికంగా ‘ఇల్లు/భవనం’. సందర్భాన్ని బట్టి రాజభవనం లేదా దేవాలయ సముదాయం కావచ్చనే సందిగ్ధతను ఏదో ఒకదానిగా నిర్ణయించకుండా ‘భవనం’ అని ఉంచాం.
- source_word: מַסָּח
  choice: ఎవరూ లోపలికి చొరబడకుండా
  rationale: ఈ అరుదైన పదం అర్థం అనిశ్చితం. సందర్భంలో అది ప్రవేశాన్ని అడ్డుకునే రక్షణ లేదా అవరోధాన్ని సూచించే అవకాశముంది; తెలుగులో సహజంగా ఉండే ఉద్దేశ్య వాక్యంగా అనువదించాం, అనిశ్చితిని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. అరుదైన מַסָּח పదం యొక్క అనిశ్చితిని ప్రధాన వాక్యంలో అతిగా కఠినంగా చేయకుండా పాదసూచికలో నిలిపాం. ‘భవనం’ అనే పదంతో రాజభవనం/దేవాలయం అనే సందర్భసంబంధ సందిగ్ధతను పరిష్కరించకుండా ఉంచాం.
