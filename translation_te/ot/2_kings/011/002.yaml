id: 2KI.11.2
reference: 2 Kings 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: te
  text: అయితే రాజైన యోరాము కుమార్తె, అహజ్యా సోదరి అయిన యెహోషెబ, అహజ్యా కుమారుడైన యోవాషును చంపబడుతున్న రాజకుమారుల మధ్యనుండి దొంగచాటుగా తీసుకొని, అతనినీ అతని దాదినీ[b] పడకల గదిలో[a] ఉంచింది. వారు[c] అతల్యాకు కనిపించకుండా అతనిని దాచారు. అందువల్ల అతడు చంపబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘పడకల గదిలో’; ‘పడకగదిలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, అతనికి పాలిచ్చే స్త్రీ.
    reason: lexical_clarification
  - marker: c
    text: 'హెబ్రీ క్రియ బహువచనంలో ఉంది: ‘వారు అతనిని దాచారు.’'
    reason: source_form
lexical_decisions:
- source_word: וַתִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియకు సహజమైన తెలుగు సమానం; చర్యకు అనవసరమైన అదనపు భావాన్ని చేర్చదు.
- source_word: יְהוֹשֶׁבַע
  choice: యెహోషెబ
  rationale: రాజుల గ్రంథంలోని హెబ్రీ రూపాన్ని ఆధారంగా చేసుకున్న వ్యక్తినామ లిప్యంతరీకరణ.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: రాజైన యోరాము కుమార్తె
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: అహజ్యా సోదరి
  rationale: אחות పదానికి ఇక్కడి సాధారణ, ప్రత్యక్ష అర్థమైన ‘సోదరి’నే నిలుపుతుంది; వంశావళి సమన్వయం కోసం అర్థాన్ని సడలించదు.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: అతనిని ... దొంగచాటుగా తీసుకుపోయి
  rationale: גנב యొక్క ‘దొంగిలించు’ అనే మూలభావంతో పాటు ఈ సందర్భంలోని రహస్య రక్షణ చర్యను సహజ తెలుగులో వ్యక్తపరుస్తుంది; నేరపూరిత అపహరణ భావాన్ని అనవసరంగా రుద్దదు.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: రాజకుమారుల మధ్యనుండి
  rationale: అక్షరార్థంగా ‘రాజు కుమారులు’; తెలుగులో ‘రాజకుమారులు’ సంక్షిప్తంగా, సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הַמּוּמָתִים
  choice: చంపబడుతున్న
  rationale: מות హోఫల్ వర్తమాన కృదంతంలోని కొనసాగుతున్న హత్య చర్యను నిలుపుతుంది.
- source_word: מֵינִקְתּוֹ
  choice: అతని దాది
  rationale: శిశువుకు పాలిచ్చి పోషించే స్త్రీని సూచిస్తుంది; ప్రధాన పాఠ్యంలో సులభమైన పదాన్ని వాడి, నిర్దిష్ట భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: పడకల గదిలో
  rationale: హెబ్రీలోని ‘పడకల గది’ అనే స్పష్టమైన బహువచన రూపాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: వారు ... అతనిని దాచారు
  rationale: మసొరా పాఠంలోని మూడవ పురుష బహువచన క్రియను ఏకవచనంగా సవరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: అతల్యాకు కనిపించకుండా
  rationale: ‘ఆమె సన్నిధి నుండి/ఆమెకు దూరంగా’ అనే భావాన్ని ఈ దాచిపెట్టే సందర్భంలో సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְלֹא הוּמָת
  choice: అందువల్ల అతడు చంపబడలేదు
  rationale: దాచిన చర్య ఫలితాన్ని సహజంగా తెలియజేస్తూ מות యొక్క కర్మణి రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అహజ్యాతో యెహోషెబకు ఉన్న కుటుంబ సంబంధాన్ని వంశావళి వివరాలతో సమన్వయపరచడం
  choice: ‘అహజ్యా సోదరి’ అని అనువదించడం
  alternative: సమన్వయాన్ని సులభం చేయడానికి ‘అహజ్యా బంధువు’ అని విస్తృతంగా అనువదించడం
  rationale: హెబ్రీ పాఠం సాధారణంగా ‘సోదరి’ అనే అర్థమిచ్చే పదాన్నే ఉపయోగిస్తుంది. పాఠం కోరని వంశావళి సమన్వయాన్ని అనువాదంలో చేర్చకూడదు.
- issue: యోవాషును దాచిన క్రియకు కర్త
  choice: హెబ్రీ బహువచనాన్ని అనుసరించి ‘వారు దాచారు’ అని ఉంచడం
  alternative: సందర్భాన్ని సరళీకరించి ‘ఆమె దాచింది’ అని ఏకవచనంలో అనువదించడం
  rationale: మసొరా పాఠంలోని క్రియ బహువచనంలో ఉంది. అది యెహోషెబతో పాటు దాదిని లేదా సహాయకులను సూచించే అవకాశం ఉండటంతో ఆ అస్పష్టతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. వ్యక్తినామాలు సాధారణ తెలుగు బైబిలు ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ‘దొంగచాటుగా తీసుకుపోయి’ అనే ప్రయోగం రహస్య చర్యను సహజంగా తెలియజేస్తూ మూల క్రియ బలాన్ని నిలుపుతుంది.
