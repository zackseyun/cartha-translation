  to: అయితే రాజైన యోరాము కుమార్తె, అహజ్యా సోదరి అయిన యెహోషెబ, అహజ్యా కుమారుడైన యోవాషును చంపబడుతున్న రాజకుమారుల మధ్యనుండి దొంగచాటుగా తీసుకొని, అతనినీ అతని దాదినీ[b] పడకల గదిలో[a] ఉంచింది. వారు[c] అతల్యాకు కనిపించకుండా అతనిని దాచారు. అందువల్ల అతడు చంపబడలేదు.
  rationale: దాది కూడా చంపబడుతున్న రాజకుమారుల గుంపులో ఉన్నట్లు కలిగే అనవసరమైన అర్థాన్ని తొలగించడానికి పదక్రమాన్ని మార్చాను. మూలంలోని రహస్యంగా తీసుకెళ్లడం, పడకల గది, దాచడం అనే క్రమాన్ని, అలాగే చివరి బహువచన క్రియలోని అస్పష్ట కర్తను యథావిధిగా నిలిపాను.
