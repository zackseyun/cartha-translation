id: 2KI.11.17
reference: 2 Kings 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: te
  text: అప్పుడు యెహోయాదా యెహోవాకూ రాజుకూ ప్రజలకూ మధ్య నిబంధన చేశాడు[a]—వారు యెహోవాకు ప్రజలుగా ఉండాలని[b]. మరియు రాజుకూ ప్రజలకూ మధ్య కూడా నిబంధన చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధనను కోశాడు”; ఇది “నిబంధన చేశాడు” అనే అర్థమిచ్చే ప్రామాణిక నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యెహోవా ప్రజలుగా ఉండాలని.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת ... אֶת הַבְּרִית
  choice: నిబంధన చేశాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధనను కోశాడు’ అనే ప్రామాణిక నుడికారం ఉంది; ఆధునిక తెలుగులో దాని సహజ భావం ‘నిబంధన చేశాడు.’
- source_word: הַבְּרִית
  choice: నిబంధన
  rationale: బְּרִית్ సూచించే అధికారికమైన, గంభీరమైన ఒడంబడిక భావాన్ని ‘నిబంధన’ స్పష్టంగా నిలుపుతుంది.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: యెహోవాకు, రాజుకు, ప్రజలకు మధ్య
  rationale: మూడుసార్లు వచ్చిన בֵּין నిబంధనలోని మూడు పక్షాలను సూచిస్తుంది; తెలుగు విభక్తి నిర్మాణానికి అనుగుణంగా పునరుక్తిని తగ్గించినా త్రిపాక్షిక సంబంధాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చింది.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: వారు యెహోవాకు ప్రజలుగా ఉండాలని
  rationale: ఈ క్రియార్థక ఉపవాక్యం నిబంధన ఉద్దేశాన్ని లేదా ఫలితాన్ని తెలియజేస్తుంది; మూలంలోని సంబంధాత్మక రూపాన్ని స్వామ్యరూపంగా పూర్తిగా మార్చకుండా నిలుపుతుంది.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: అలాగే రాజుకు, ప్రజలకు మధ్య కూడా
  rationale: మొదటి నిబంధన సంబంధంతో పాటు రాజు-ప్రజల మధ్య ఉన్న రెండో సంబంధాన్ని ‘అలాగే’ మరియు ‘కూడా’ సహజంగా స్పష్టం చేస్తాయి.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ עָם నిబంధన సమాజాన్ని సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ సాధారణ పాఠకులకు సహజమైన, పారదర్శకమైన పదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: לִהְיוֹת לְעָם לַיהוָה లోని చెందినతనపు భావం
  choice: యెహోవాకు ప్రజలుగా ఉండాలని
  alternative: యెహోవా ప్రజలుగా ఉండాలని
  rationale: స్వామ్య భావం సందర్భంలో ఉన్నప్పటికీ, మూలంలోని לְ సంబంధ నిర్మాణాన్ని నిలిపి దాని భావసూక్ష్మతను అతిగా నిర్ణయించకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన బైబిలు శైలిని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్య నిర్మాణం. మూలంలోని రెండు నిబంధన సంబంధాలను విడివిడిగా స్పష్టం చేసింది.
