    reason: lexical_alternative
  - marker: b
    text: లేదా, “యెహోవా ప్రజలుగా ఉండాలని.”
    reason: alternative_reading
  revision_rationale: The revision makes the triadic covenant-party construction and the second king–people covenant more idiomatic in Telugu while preserving the Hebrew structure, its collective/ambiguous pronoun, the divine name, and both footnote anchors.
