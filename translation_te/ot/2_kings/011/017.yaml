revisions:
- from: అప్పుడు యెహోయాదా యెహోవాకు, రాజుకు, ప్రజలకు మధ్య నిబంధన చేశాడు[a]—వారు యెహోవాకు ప్రజలుగా ఉండాలని[b]. అలాగే రాజుకు, ప్రజలకు మధ్య కూడా నిబంధన చేశాడు.
  to: అప్పుడు యెహోయాదా యెహోవాకూ రాజుకూ ప్రజలకూ మధ్య నిబంధన చేశాడు[a]—వారు యెహోవాకు ప్రజలుగా ఉండాలని[b]. మరియు రాజుకూ ప్రజలకూ మధ్య కూడా నిబంధన చేశాడు.
  rationale: The revision makes the triadic covenant-party construction and the second king–people covenant more idiomatic in Telugu while preserving the Hebrew structure, its collective/ambiguous pronoun, the divine name, and both footnote anchors.
