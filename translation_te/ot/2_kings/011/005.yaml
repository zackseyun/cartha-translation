  text: וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ/ן הַ/שְּׁלִשִׁ֤ית מִ/כֶּם֙ בָּאֵ֣י הַ/שַּׁבָּ֔ת וְ/שֹׁ֣מְרֵ֔י מִשְׁמֶ֖רֶת בֵּ֥ית הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: te
  text: 'అతడు వారికి ఇలా ఆజ్ఞాపించాడు: “మీరు చేయవలసింది ఇదే: విశ్రాంతి దినాన విధికి వచ్చే మీలో మూడవ వంతు మంది రాజభవనానికి[a] కాపలా కాయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “రాజు ఇంటికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: అతడు వారికి ఇలా ఆజ్ఞాపించాడు
  rationale: ఆజ్ఞ యొక్క అధికార భావాన్ని నిలుపుతూ, హీబ్రూ మాటల పరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: మీరు చేయవలసింది ఇదే
  rationale: నిర్దేశక బలాన్ని స్పష్టంగా ఉంచుతూ, హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: మీలో మూడవ వంతు మంది
  rationale: సమూహంలోని ఒక మూడవ భాగాన్ని తెలుగులో స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: విశ్రాంతి దినాన విధికి వచ్చే
  rationale: విశ్రాంతి దినాన వచ్చేవారనే మూలార్థాన్ని నిలుపుతూ, సందర్భంలోని కాపలా విధుల మార్పిడిని ‘విధికి’ అనే పదంతో స్పష్టం చేస్తుంది.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: కాపలా కాయాలి
  rationale: కావలి విధిని నిర్వహించాలనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనానికి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘రాజు ఇల్లు’; ఈ సందర్భంలో రాజప్రాసాద సముదాయాన్ని సూచించేందున ప్రధాన పాఠ్యంలో సహజమైన ‘రాజభవనం’ వాడబడింది, అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
