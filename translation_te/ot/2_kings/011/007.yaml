source:
  edition: WLC
  text: וּ/שְׁתֵּ֤י הַ/יָּדוֹת֙ בָּ/כֶ֔ם כֹּ֖ל יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וְ/שָֽׁמְר֛וּ אֶת מִשְׁמֶ֥רֶת בֵּית יְהוָ֖ה אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: te
  text: మీలోని రెండు విభాగాలు[a]—అంటే, విశ్రాంతి దినాన విధి ముగించుకొని వెళ్లే వారందరూ[b]—రాజు కోసం యాహ్వే మందిరానికి కాపలా కాయాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, ‘మీలోని రెండు చేతులు’; ఇక్కడ ‘రెండు విభాగాలు’ లేదా ‘రెండు దళాలు’ అని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విశ్రాంతి దినాన బయటికి వెళ్లే వారందరూ.’ సందర్భంలో ఇది విశ్రాంతి దినపు పాళీ మార్పులో విధి ముగించుకొని వెళ్లేవారిని సూచించే అవకాశం ఉంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘రాజు వైపుగా యాహ్వే మందిరానికి కాపలా కాయాలి.’ హీబ్రూ పూర్వప్రత్యయం కష్టమైనది; సందర్భం ప్రకారం రాజును రక్షించేందుకు మందిరాన్ని కాపాడడం భావం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת בָּכֶם
  choice: మీలోని రెండు దళాలు
  rationale: అక్షరార్థంగా ‘మీలోని రెండు చేతులు’; ఈ సైనిక, వ్యవస్థాపక సందర్భంలో יָד ఒక విభాగం లేదా దళాన్ని సూచిస్తుంది. ‘రెండు దళాలు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: విశ్రాంతిదినాన విధి ముగించుకొని వెళ్లే వారందరూ
  rationale: అక్షరార్థం ‘విశ్రాంతిదినాన బయటికి వెళ్లేవారందరూ.’ చుట్టుపక్కల వచనాల్లో కాపలా పాళీ మార్పు సందర్భం ఉన్నందున, ఇది విధి నుంచి దిగిపోతున్నవారిని సూచిస్తుంది.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: కాపలా కాయాలి
  rationale: శמר అనే క్రియతో దానికి సమాన మూలంగల מִשְׁמֶרֶת నామవాచకం కలిసి కాపలా బాధ్యతను నిర్వహించడాన్ని సూచిస్తాయి. తెలుగులో ‘కాపలా కాయాలి’ ఆ ఆజ్ఞార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘యెహోవా ఇల్లు’ అనేది అక్షరార్థం; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజు కోసం
  rationale: אֶל అనే విభక్తి ఇక్కడ కఠినమైనది; సందర్భంలో మందిరానికి కాపలా కాయడం రాజును రక్షించే ఉద్దేశంతో జరుగుతోంది. ‘రాజు కోసం’ ప్రయోజనార్థాన్ని సహజంగా తెలియజేస్తుంది, అయితే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంలో ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: אֶל הַמֶּלֶךְ యొక్క సంబంధం
  choice: రాజు కోసం
  alternative: రాజు వైపుగా
  rationale: హీబ్రూ పూర్వప్రత్యయం బహుళార్థకమైనది. కథా సందర్భం రాజు రక్షణను సూచించినా, వాక్య నిర్మాణంలోని అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. సైనిక పాళీ సందర్భాన్ని స్పష్టం చేయడానికి ‘విధి ముగించుకొని వెళ్లే’ అని వాడి, మూలంలోని ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
