  source_fidelity: 'హీబ్రూ ఆజ్ఞల పరంపరను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది: రాజును చుట్టుముట్టడం, ప్రతి వ్యక్తి ఆయుధాలు చేతిలో ఉంచుకోవడం, వరుసల్లోకి ప్రవేశించేవానిని చంపడం, రాజు వెళ్లి వచ్చేటప్పుడు అతనితో ఉండడం. יוּמָת యొక్క నిష్క్రియ/ఆజ్ఞార్థ బలాన్ని ‘చంపబడాలి’ సరిగ్గా అందిస్తుంది.'
