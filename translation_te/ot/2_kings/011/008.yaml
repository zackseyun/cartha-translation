translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆజ్ఞాశైలిని ఉపయోగించాం. సైనిక సందర్భాన్ని తెలియజేయడానికి ‘ఆయుధాలు,’ ‘కాపలాదారుల వరుసలు’ అనే సాధారణ పదాలను ఎంచుకున్నాం; మూలంలోని కఠిన మరణ ఆజ్ఞను మృదువుచేయకుండా అనువదించాం.
