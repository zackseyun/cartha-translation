  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: te
  text: మీరు రాజును అన్నివైపులా చుట్టుముట్టి ఉండాలి; ప్రతి మనిషి తన ఆయుధాలను చేతిలో పట్టుకొని ఉండాలి. కాపలాదారుల వరుసల మధ్యకు వచ్చే ఎవరైనా చంపబడాలి.[a] రాజు బయటికి వెళ్లేటప్పుడూ లోపలికి వచ్చేటప్పుడూ మీరు అతనితో ఉండాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వరుసలు’ అని అనువదించిన హీబ్రూ పదానికి ‘శ్రేణులు’ లేదా ‘పంక్తులు’ అని కూడా అర్థం కావచ్చు; ఇక్కడ అది కాపలాదారులు ఏర్పరచిన రక్షణ వరుసలను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతడు బయటికి వెళ్లడంలోనూ లోపలికి రావడంలోనూ.’ ఇది రాజు కదలికలన్నిటిలో అతనితో ఉండి కాపాడడాన్ని సూచించే ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: మీరు రాజును అన్నివైపులా చుట్టుముట్టి ఉండాలి
  rationale: హిఫిల్ క్రియారూపం రాజు చుట్టూ రక్షణ వలయంగా నిలవాలనే ఆజ్ఞను తెలియజేస్తుంది. ‘అన్నివైపులా చుట్టుముట్టి’ అనే ప్రయోగం సָבִיב భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ప్రతి మనిషి తన ఆయుధాలను చేతిలో పట్టుకొని ఉండాలి
  rationale: אִישׁ ఇక్కడ విభజనార్థక ఏకవచనంగా ప్రతి కాపలాదారుని సూచిస్తుంది. כְּלִי సందర్భానుసారం యుద్ధాయుధాలను సూచిస్తున్నందున ‘ఆయుధాలు’ అని అనువదించాం.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: కాపలాదారుల వరుసల మధ్యకు వచ్చే ఎవరైనా
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం సాధారణంగా ‘వచ్చే ఎవరైనా’ అనే భావమిస్తుంది. שְּׂדֵרוֹת అమర్చిన వరుసలు లేదా శ్రేణులను సూచిస్తుంది; సందర్భం స్పష్టత కోసం ‘కాపలాదారుల వరుసలు’ అని ఇచ్చాం, భిన్న సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יוּמָת
  choice: చంపబడాలి
  rationale: హోఫల్ రూపంలోని నిష్క్రియార్థ ఆజ్ఞను సంక్షిప్తంగా, నేరుగా ప్రతిబింబిస్తుంది; మూలంలో లేని న్యాయపరమైన ‘మరణశిక్ష’ భావాన్ని జోడించదు.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: మీరు అతనితో ఉండాలి
  rationale: ఆజ్ఞల పరంపరలో ఇది రాజుతో కూడి ఉండి అతనికి రక్షణ కల్పించాలనే కొనసాగింపు ఆజ్ఞ.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: రాజు బయటికి వెళ్లేటప్పుడూ లోపలికి వచ్చేటప్పుడూ
  rationale: హీబ్రూ జంటప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, రాజు కదలికలన్నిటిలో అతనితో ఉండాలనే సందర్భార్థాన్ని నిలుపుతుంది.
