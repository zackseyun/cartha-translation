  source_fidelity: The draft correctly preserves the singular subject for וַיִּקַּח (understood as Jehoiada), the subsequent plural subject, the descent from Yahweh’s house, and the singular enthronement of the king. It also retains the uncertain identification of הַכָּרִי in a footnote and preserves the plural in 'the throne of the kings.'
