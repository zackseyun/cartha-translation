id: 2KI.11.19
reference: 2 Kings 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: te
  text: అప్పుడు అతడు వందమందికి అధిపతులైన వారిని, కారీయులను[a], పరుగెత్తువారిని[b], దేశ ప్రజలందరినీ వెంట తీసుకున్నాడు. వారు రాజును యహ్వే మందిరం నుండి కిందికి తీసుకొచ్చి, పరుగెత్తువారి ద్వారం గుండా రాజభవనానికి వచ్చారు. రాజు రాజుల సింహాసనం మీద కూర్చున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కారీయులు” అనే హీబ్రూ పదం అర్థం అనిశ్చితం. దీనిని “కెరేతీయులు” లేదా “అంగరక్షకులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: పదశః “పరుగెత్తువారు.” రాజసంబంధ సందర్భంలో ఈ పదం రాజ అంగరక్షకులను లేదా వార్తాహరులను సూచించవచ్చు; “పరుగెత్తువారి ద్వారం”లోనూ ఇదే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: వెంట తీసుకున్నాడు
  rationale: ఏకవచన క్రియకు సందర్భంలో యెహోయాదా కర్త. జాబితాలోని వారిని సమకూర్చుకొని తనతో తీసుకెళ్లాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: వందమందికి అధిపతులు
  rationale: సైనిక వ్యవస్థను సూచించే హీబ్రూ నిర్మాణాన్ని నిలుపుతూ, రోమా సైన్యానికి ప్రత్యేకమైన పదజాలాన్ని చేర్చదు.
- source_word: הַכָּרִי
  choice: కారీయులు
  rationale: ఈ పదం యొక్క జాతి లేదా విధి సంబంధమైన ఖచ్చితార్థం అనిశ్చితం. హీబ్రూ రూపానికి సమీపమైన పేరును ప్రధాన పాఠ్యంలో ఉంచి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: הָרָצִים
  choice: పరుగువారు
  rationale: పదశః అర్థాన్ని నిలుపుతుంది. రాజసంబంధ సందర్భంలో వీరు అంగరక్షకులు లేదా వార్తాహరులు కావచ్చు; ఆ కార్యార్థం పాదటిప్పణిలో ఉంది.
- source_word: כָּל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరూ
  rationale: యూదా దేశ ప్రజలను సూచించే విస్తృత పదబంధంగా ఉంచి, దాన్ని కేవలం సామాన్య ప్రజలకు లేదా ప్రతి పౌరునికి పరిమితం చేయలేదు.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: వారు రాజును ... కిందికి తీసుకొచ్చి
  rationale: ఇక్కడ బహువచన క్రియ సమకూడిన బృందాన్ని కర్తగా చూపుతుంది; మందిర ప్రాంగణం నుండి రాజభవనం వైపున్న దిగువ ప్రయాణ దిశను కూడా నిలుపుతుంది.
- source_word: מִבֵּית יְהוָה
  choice: యహ్వే మందిరం నుండి
  rationale: ‘ఇల్లు’ అనే మూలచిత్రానికి తెలుగులో ఈ సందర్భానికి సహజమైన ‘మందిరం’ వాడాం; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: పరుగువారి ద్వారం గుండా
  rationale: మార్గాన్ని, ద్వారం పేరును స్పష్టంగా చూపుతూ హీబ్రూ పదచిత్రాన్ని నిలుపుతుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజు భవనం
  rationale: ఇది రాజనివాసమని సహజంగా తెలియజేస్తూనే ‘రాజు ఇల్లు’ అనే హీబ్రూ నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: וַיֵּשֶׁב עַל כִּסֵּא הַמְּלָכִים
  choice: రాజు రాజుల సింహాసనం మీద కూర్చున్నాడు
  rationale: కర్త రాజేనని తెలుగులో స్పష్టం చేసి, వంశపారంపర్య రాజాధికారాన్ని సూచించే ‘రాజుల సింహాసనం’ అనే అసాధారణ బహువచనాన్ని మార్చకుండా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ఒడంబడిక నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: כִּסֵּא הַמְּלָכִים లోని బహువచనం
  choice: రాజుల సింహాసనం
  alternative: రాజసింహాసనం
  rationale: హీబ్రూలోని బహువచనం యూదా రాజుల వంశపారంపర్య సింహాసనాన్ని సూచించవచ్చు. ‘రాజసింహాసనం’గా సరళీకరించకుండా మూలంలోని వారసత్వ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడాం. అనిశ్చితమైన అధికారిక బృందాల పేర్లను ప్రధాన పాఠ్యంలో అతిగా వివరణాత్మకంగా మార్చకుండా, అవసరమైన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఉంచాం.
