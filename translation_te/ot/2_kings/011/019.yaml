  terminology: యహ్వే appropriately represents יהוה. కారీయులు appropriately transliterates the uncertain term הַכָּרִי, with noncommittal alternatives supplied. 'రాజుల సింహాసనం' faithfully retains the Hebrew plural without imposing a doctrinal interpretation.
