  - severity: low
    issue: '''పరుగువారు'' is less transparent in contemporary Telugu.'
    rationale: '''పరుగెత్తువారు'' more naturally denotes ''runners'' while the footnote continues to preserve the probable royal-guard/courier sense.'
  - severity: low
