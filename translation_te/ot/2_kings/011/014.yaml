  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עֹמֵ֨ד עַֽל הָ/עַמּ֜וּד כַּ/מִּשְׁפָּ֗ט וְ/הַ/שָּׂרִ֤ים וְ/הַ/חֲצֹֽצְרוֹת֙ אֶל הַ/מֶּ֔לֶךְ וְ/כָל עַ֤ם הָ/אָ֨רֶץ֙ שָׂמֵ֔חַ וְ/תֹקֵ֖עַ בַּ/חֲצֹֽצְר֑וֹת וַ/תִּקְרַ֤ע עֲתַלְיָה֙ אֶת בְּגָדֶ֔י/הָ וַ/תִּקְרָ֖א קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: te
  text: ఆమె చూసి, ఇదిగో, ఆచారం ప్రకారం రాజు స్తంభం పక్కన[a] నిలబడి ఉన్నాడు. రాజు దగ్గర అధికారులు, బూరలు ఉన్నాయి. దేశ ప్రజలందరూ సంతోషిస్తూ బూరలు ఊదుతున్నారు. అప్పుడు అతల్యా తన బట్టలు చించుకొని, “కుట్ర! కుట్ర!”[b] అని కేక వేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్తంభం మీద” లేదా “స్తంభం దగ్గర.” ఇక్కడ హీబ్రూ ఉపసర్గను ఒకటి కంటే ఎక్కువ స్థానార్థాల్లో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “రాజద్రోహం! రాజద్రోహం!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: ఆమె చూసేసరికి, ఇదిగో
  rationale: చూసిన దృశ్యం అకస్మాత్తుగా ఆమె కంటపడిన నాటకీయ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, הִנֵּה యొక్క సూచనాత్మక బలాన్ని ‘ఇదిగో’ ద్వారా నిలుపుతుంది.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: రాజు ... నిలబడి ఉన్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతం దృశ్యంలో కొనసాగుతున్న భంగిమను సూచిస్తుంది; ‘నిలబడి ఉన్నాడు’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הָעַמּוּד
  choice: స్తంభం పక్కన
  rationale: עַל సాధారణంగా ‘మీద’ అని అర్థమిచ్చినా, ఇక్కడ రాజసంబంధ ఆచార స్థలంతో ఉన్న సమీప సంబంధాన్ని సూచించడం సందర్భోచితం; ఇతర స్థానార్థ సంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: כַּמִּשְׁפָּט
  choice: ఆచారం ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּט న్యాయతీర్పును కాక, స్థిరపడిన రాజసంబంధ పద్ధతిని లేదా ఆచారాన్ని సూచిస్తుంది.
- source_word: וְהַשָּׂרִים
  choice: అధికారులు
  rationale: שָׂרִים నాయకులు, అధిపతులు లేదా అధికారులను సూచించే విస్తృత పదం; నిర్దిష్ట హోదాను అనవసరంగా నిర్ణయించకుండా ‘అధికారులు’ సందర్భానికి సరిపోతుంది.
- source_word: וְהַחֲצֹצְרוֹת
  choice: బూరలు
  rationale: హీబ్రూ పాఠం వాయిద్యాలనే పేర్కొంటుంది; వాయిద్యకారులు అని మార్చకుండా ఆ రూపకల్పనను నిలిపాం.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజు దగ్గర
  rationale: ఈ సందర్భంలో אֶל రాజు సమీపంలో ఉన్న స్థితిని సూచిస్తుంది; ‘రాజు దగ్గర’ ఆధునిక తెలుగులో సహజమైన స్థానార్థ ప్రయోగం.
- source_word: כָל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరూ
  rationale: హీబ్రూ స్థిర పదబంధంలోని ప్రజాసమూహ భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: సంతోషిస్తూ బూరలు ఊదుతున్నారు
  rationale: ప్రజల బహిరంగ ఆనందాన్నీ, ఉత్సవ సందర్భంలో బూరలు ఊదడాన్నీ కొనసాగుతున్న చర్యలుగా తెలియజేస్తుంది.
- source_word: וַתִּקְרַע עֲתַלְיָה אֶת־בְּגָדֶיהָ
  choice: అతల్యా తన బట్టలు చించుకొని
  rationale: ఆందోళన లేదా దిగ్భ్రాంతిని తెలిపే చర్యను స్పష్టంగా ఉంచుతూ, ఆధునిక పాఠకులకు సహజమైన ‘బట్టలు’ అనే పదాన్ని వాడాం.
- source_word: קֶשֶׁר קָשֶׁר
  choice: కుట్ర! కుట్ర!
  rationale: קֶשֶׁר యొక్క రాజకీయ కుట్ర లేదా తిరుగుబాటు భావాన్ని ‘కుట్ర’ నేరుగా వ్యక్తం చేస్తుంది; ద్విరుక్తి ఆమె అత్యవసర కేకను నిలుపుతుంది.
