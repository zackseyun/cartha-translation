  terminology: ‘అధికారులు,’ ‘బూరలు,’ ‘దేశ ప్రజలందరూ,’ ‘కుట్ర’ సరైన, సహజమైన పదాలు. ‘రాజద్రోహం’ పాదసూచికలో సాధ్యమైన సందర్భానుసార ప్రత్యామ్నాయంగా ఉంచవచ్చు; దానిని ప్రధాన పాఠంలోకి మార్చనవసరం లేదు.
