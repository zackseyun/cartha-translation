translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఇదిగో’ ద్వారా మూలంలోని నాటకీయ దృష్టి మార్పును, చిన్న వాక్యాల ద్వారా దృశ్య వేగాన్ని నిలిపాం. హీబ్రూ పాఠం వాయిద్యాలనే పేర్కొనడం వల్ల ‘బూరలు’ అని అనువదించాం; ‘బూరవాయిద్యకారులు’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
