  to: ఆమె చూసి, ఇదిగో, ఆచారం ప్రకారం రాజు స్తంభం పక్కన[a] నిలబడి ఉన్నాడు. రాజు దగ్గర అధికారులు, బూరలు ఉన్నాయి. దేశ ప్రజలందరూ సంతోషిస్తూ బూరలు ఊదుతున్నారు. అప్పుడు అతల్యా తన బట్టలు చించుకొని, “కుట్ర! కుట్ర!”[b] అని కేక వేసింది.
  rationale: పాదసూచిక aలో స్థానార్థ ప్రత్యామ్నాయాన్ని సరిచేసి, హీబ్రూ עַל యొక్క ‘మీద’ అనే సాధారణ అవకాశాన్ని మరియు సందర్భానుసార సమీపార్థాన్ని రెండింటినీ తెలియజేశాం. ‘ఆమె చూసి, ఇదిగో’ అని స్వల్పంగా మార్చడం ద్వారా וַתֵּרֶא וְהִנֵּה యొక్క రెండు భాగాల నాటకీయ క్రమాన్ని మరింత ప్రత్యక్షంగా నిలిపాం. మిగిలిన పాఠం మూలానికీ ఆధునిక తెలుగు వాడుకకీ తగినదే.
