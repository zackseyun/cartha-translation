  source_fidelity: ప్రధాన అనువాదం హీబ్రూ వాక్యనిర్మాణం, దృశ్యంలోని కొనసాగుతున్న స్థితి, రాజసంబంధ ఆచారం, ప్రజల ఆనందం, మరియు అతల్యా కేకను విశ్వసనీయంగా ప్రతిబింబిస్తుంది. עַל הָעַמּוּד కు ‘స్తంభం పక్కన’ అనేది సందర్భానుగుణమైన ఎంపిక; అయితే ఆ స్థానార్థంలోని ఇతర ప్రధాన అవకాశాన్ని పాదసూచికలో సరిగా ఇవ్వాలి.
