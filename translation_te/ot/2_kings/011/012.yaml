  text: וַ/יּוֹצִ֣א אֶת בֶּן הַ/מֶּ֗לֶךְ וַ/יִּתֵּ֤ן עָלָי/ו֙ אֶת הַ/נֵּ֨זֶר֙ וְ/אֶת הָ֣/עֵד֔וּת וַ/יַּמְלִ֥כוּ אֹת֖/וֹ וַ/יִּמְשָׁחֻ֑/הוּ וַ/יַּכּוּ כָ֔ף וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: te
  text: అప్పుడు అతడు రాజు కుమారుణ్ణి బయటికి తీసుకొచ్చి, అతనిమీద కిరీటాన్ని ఉంచి, అతనికి సాక్ష్యాన్ని[a] ఇచ్చాడు. వారు అతనిని రాజుగా నియమించి అభిషేకించారు. వారు చేతులు చరచి, “రాజు చిరకాలం జీవించాలి!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిబంధన పత్రం” లేదా “శాసనం.” హీబ్రూలో “సాక్ష్యం” అని ఉంది; బహుశా ఇది రాజపాలనతో సంబంధమైన లిఖిత సాక్ష్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: బయటికి తీసుకొచ్చి
  rationale: హిఫిల్ రూపంలోని ‘బయటికి వచ్చేలా చేయడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: రాజకుమారుణ్ణి
  rationale: అక్షరార్థంగా ‘రాజు కుమారుడు’; సందర్భంలో సహజమైన, స్పష్టమైన తెలుగు పదం ‘రాజకుమారుడు’.
- source_word: הַנֵּזֶר
  choice: కిరీటాన్ని
  rationale: రాజ్యాధికారానికి గుర్తయిన శిరోభూషణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעֵדוּת
  choice: సాక్ష్యపత్రాన్ని
  rationale: ‘సాక్ష్యం’ అనే మూలభావాన్ని నిలుపుతూ, పట్టాభిషేక సందర్భంలో ఇది లిఖిత పత్రం కావచ్చనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దాని ఖచ్చిత స్వరూపాన్ని పాదసూచికలో అనిశ్చితంగానే ఉంచుతుంది.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: అతణ్ణి రాజుగా నియమించి
  rationale: ‘అతణ్ణి రాజుగా చేశారు’ అనే కారణార్థాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది; కిరీటం ఉంచిన చర్యతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: అభిషేకించారు
  rationale: రాజును ప్రతిష్ఠించే ఆచారంలో משׁחకు ప్రామాణికమైన తెలుగు సమానార్థకం.
- source_word: וַיַּכּוּ כָף
  choice: చప్పట్లు కొట్టి
  rationale: అక్షరార్థంగా అరచేతులను కొట్టడాన్ని సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: יְחִי הַמֶּלֶךְ
  choice: రాజు చిరకాలం జీవించాలి!
  rationale: రాజు జీవించాలని కోరే జస్సివ్ ప్రజాఘోషను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పట్టాభిషేక సందర్భంలో הָעֵדוּת యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘సాక్ష్యపత్రం’
  alternative: ‘సాక్ష్యం’, ‘నిబంధన పత్రం’ లేదా ‘శాసనం’
  rationale: ఈ పదం రాజుకు ఇచ్చిన లిఖిత సాక్ష్యాన్ని లేదా నిబంధన సంబంధమైన నియమావళిని సూచించవచ్చు; అయితే హీబ్రూ దాని ఖచ్చిత స్వరూపాన్ని నిర్దేశించదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని ‘సాక్ష్యం’ భావాన్ని నిలుపుతూ పత్ర స్వభావాన్ని సూచిస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజ పట్టాభిషేక దృశ్యానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం.
