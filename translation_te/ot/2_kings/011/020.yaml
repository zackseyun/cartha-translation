source:
  edition: WLC
  text: וַ/יִּשְׂמַ֥ח כָּל עַם הָ/אָ֖רֶץ וְ/הָ/עִ֣יר שָׁקָ֑טָה וְ/אֶת עֲתַלְיָ֛הוּ הֵמִ֥יתוּ בַ/חֶ֖רֶב בֵּ֥ית מלך־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: te
  text: దేశ ప్రజలందరూ సంతోషించారు; నగరం ప్రశాంతంగా ఉంది. అతల్యా విషయానికొస్తే, వారు ఆమెను రాజగృహం వద్ద[a] కత్తితో చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజగృహంలో’; ‘రాజభవనం వద్ద/లో’ అని కూడా అనువదించవచ్చు. చివరి హెబ్రీ పదబంధం సంక్షిప్తంగా ఉండటంతో స్థలసంబంధ భావంలో స్వల్ప అనిశ్చితి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: సంతోషించారు
  rationale: שׂמח లోని ఆనందం, సంతోషం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సమూహవాచక కర్తకు అనుగుణంగా బహువచన క్రియను వాడాం.
- source_word: כָּל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరూ
  rationale: ఇది సాధారణ ప్రజానీకాన్ని సూచించే హెబ్రీ పదబంధం. ‘దేశ ప్రజలందరూ’ మూలంలోని ‘దేశం’ భావాన్నీ, సమస్త ప్రజానీకం అనే భావాన్నీ నిలుపుతుంది.
- source_word: וְהָעִיר שָׁקָטָה
  choice: నగరం ప్రశాంతంగా ఉంది
  rationale: שׁקט ఇక్కడ కల్లోలం ఆగి నిశ్చలత నెలకొన్నదని సూచిస్తుంది. ‘ప్రశాంతంగా ఉంది’ తెలుగులో సహజంగా ఉండి, నిశ్శబ్దం మాత్రమే అనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: అతల్యా విషయానికొస్తే
  rationale: పేరు ముందు ఉన్న ప్రత్యక్ష కర్మ సూచికతో కూడిన ముందుంచిన నిర్మాణం అతల్యాపై స్వల్ప విషయప్రాధాన్యాన్ని పెడుతుంది; ఈ తెలుగు నిర్మాణం దానిని స్పష్టంగా నిలుపుతుంది.
- source_word: הֵמִיתוּ
  choice: వారు ఆమెను ... చంపారు
  rationale: מות యొక్క హిఫీల్ రూపం ‘చనిపోయేలా చేయడం/చంపడం’ అని అర్థం. ‘చంపారు’ ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంది; అధికారిక న్యాయశిక్ష అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: בַחֶרֶב
  choice: కత్తితో
  rationale: ఉపకరణార్థక בְּ ను ‘తో’ అని, חֶרֶב ను సాధారణ తెలుగు బైబిలు సందర్భానికి తగిన ‘కత్తి’ అని అనువదించాం.
- source_word: בֵּית מלך
  choice: రాజగృహం వద్ద
  rationale: అక్షరార్థంగా ‘రాజు గృహం’. చివరి పదబంధంలో స్థలసంబంధ విభక్తి స్పష్టంగా లేకపోవడంతో ‘వద్ద’ అనేది స్థలాన్ని సహజంగా సూచిస్తూ, ‘లోపల’ అని అతిగా నిర్ధారించదు.
