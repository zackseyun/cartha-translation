translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. ‘అతల్యా విషయానికొస్తే’ అనే నిర్మాణం మూలంలోని ముందుంచిన కర్మకు ఉన్న స్వల్ప ప్రాధాన్యాన్ని నిలుపుతుంది. విరామచిహ్నాలు హెబ్రీ వాక్యంలోని రెండు పరిణామాలను స్పష్టంగా వేరు చేస్తాయి.
