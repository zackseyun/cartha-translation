source:
  edition: WLC
  text: וַ/יָּשִׂ֤מוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא דֶּֽרֶךְ מְב֥וֹא הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/תּוּמַ֖ת שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: te
  text: అప్పుడు వారు ఆమెను పట్టుకున్నారు[a]. ఆమె రాజభవనంలోని గుర్రాల ప్రవేశమార్గం గుండా వెళ్లింది[b]; అక్కడ ఆమెను చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారు ఆమెపై చేతులు ఉంచారు.” దీనిని “వారు ఆమెను పట్టుకున్నారు” అని అర్థం చేసుకోవచ్చు. కొందరు ఈ హీబ్రూ మాటను “వారు ఆమెకు దారి ఇచ్చారు” అని కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజు ఇంటికి గుర్రాల ప్రవేశమార్గం.” ఇది గుర్రాలు రాజభవన ప్రాంతంలోకి ప్రవేశించే మార్గాన్ని లేదా ద్వారాన్ని సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: వారు ఆమెను పట్టుకున్నారు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఆమెపై చేతులు ఉంచారు’ అని ఉన్నా, ఈ సందర్భంలో అదుపులోకి తీసుకోవడం లేదా పట్టుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתָּבֹא
  choice: ఆమె ... వెళ్లింది
  rationale: בוא సందర్భానుసారం ‘రావడం’ లేదా ‘వెళ్లడం’ అని అర్థమవుతుంది. ఆలయ ప్రాంగణం నుంచి రాజభవనం వైపు కథన గమనాన్ని తెలుగులో ‘వెళ్లింది’ సహజంగా వ్యక్తం చేస్తుంది; క్రియారూపంలో లేని కర్మణి భావాన్ని చేర్చలేదు.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: గుర్రాల ప్రవేశమార్గం గుండా
  rationale: דֶּרֶךְ మార్గాన్ని, מְבוֹא ప్రవేశస్థలాన్ని సూచిస్తాయి. ‘ప్రవేశమార్గం గుండా’ అనేది మార్గం మరియు ప్రవేశం రెండింటి భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది; ‘ద్వారం’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థం ‘రాజు ఇల్లు’; ఈ సందర్భంలో రాజప్రాసాద సముదాయాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి ‘రాజభవనం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַתּוּמַת
  choice: ఆమెను చంపారు
  rationale: מות యొక్క హోఫాల్ రూపం ఆమె మరణింపజేయబడిందని సూచిస్తుంది. ‘ఆమెను చంపారు’ కర్మణి/కారణ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా ఇస్తుంది; కేవలం ‘చనిపోయింది’ అనే భావాన్ని నివారిస్తుంది.
- source_word: שָׁם
  choice: అక్కడే
  rationale: స్థలాన్ని సూచించే ‘అక్కడ’కు ‘ఏ’ చేర్చడం ద్వారా, ఆ ప్రవేశమార్గ ప్రాంతంలోనే మరణశిక్ష అమలైందనే కథన బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
