translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలను నిలిపి, అసహజమైన అక్షరానువాదాన్ని నివారించాం. ‘పట్టుకున్నారు’ వద్ద ఉన్న ప్రత్యామ్నాయ వ్యాఖ్యానాన్ని, అలాగే గుర్రాల ప్రవేశస్థల స్వరూపంలోని అనిశ్చితిని పాదటిప్పణుల్లో భద్రపరిచాం.
