  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְהוֹיָקִ֖ים וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: యెహోయాకీము యొక్క మిగిలిన కార్యాలు, అతడు చేసినదంతా, యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[a] వ్రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుల వార్షిక వృత్తాంతాల గ్రంథంలో.’ ఈ హెబ్రీ శీర్షిక రాజుల గ్రంథంలో పదేపదే ఉల్లేఖించబడే రాజరిక నమోదు మూలాన్ని సూచిస్తుంది; ఇది బైబిలులోని దినవృత్తాంతముల గ్రంథాన్నే తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: యెహోయాకీము చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన సంగ్రహాల్లో דִּבְרֵי అనేది కేవలం ‘మాటలు’ కాకుండా రాజుకు సంబంధించిన కార్యాలు లేదా విషయాలను సూచిస్తుంది. ‘మిగిలిన కార్యాలు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: హెబ్రీ వాక్యభాగంలోని విస్తృత అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాసి ఉన్నాయి కదా?
  rationale: హెబ్రీలోని అలంకారప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతూ, అవి లిఖితంగా నమోదయ్యాయనే భావాన్ని అందిస్తుంది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: ఇది యూదా రాజులకు సంబంధించిన రాజరిక నమోదు పత్రం లేదా వృత్తాంత గ్రంథానికి శీర్షిక. ‘దినవృత్తాంతాలు’ మూలంలోని דִּבְרֵי הַיָּמִים భావాన్ని, ‘గ్రంథం’ סֵפֶר భావాన్ని స్పష్టంగా తెలియజేస్తాయి.
theological_decisions:
- issue: ఉల్లేఖించబడిన గ్రంథం ఏది?
  choice: ప్రధాన పాఠంలో ‘యూదా రాజుల దినవృత్తాంతాల గ్రంథం’ అని అనువదించి, అది రాజరిక నమోదు మూలమని పాదటిప్పణిలో వివరించడం
  alternative: ఇది నేటి బైబిలులోని దినవృత్తాంతముల గ్రంథమేనని నేరుగా గుర్తించడం
  rationale: హెబ్రీ శీర్షిక రాజుల గ్రంథంలో పదేపదే ఉల్లేఖించబడే రాజరిక నమోదు మూలాన్ని సూచిస్తుంది; అది బైబిలు ప్రామాణిక దినవృత్తాంతముల గ్రంథమేనని మూలపాఠం నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హెబ్రీలో లేని కాలసూచక ఆరంభపదాన్ని చేర్చలేదు. అలంకారప్రశ్నను సహజమైన ‘కదా?’ రూపంలో నిలిపింది.
