  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. రాజ్యపాలన సూత్రానికి సహజమైన తెలుగు నుడికారాన్ని ఉపయోగించాం; చివరి మూలస్థాన సూచనలో హీబ్రూ అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
