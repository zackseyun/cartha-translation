  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: te
  text: యెహోయాకీను రాజైనప్పుడు అతనికి పద్దెనిమిది సంవత్సరాల వయసు ఉంది. అతడు యెరూషలేములో మూడు నెలలు పరిపాలించాడు. అతని తల్లి పేరు నెహుష్తా; ఆమె యెరూషలేముకు చెందిన ఎల్నాతాను కుమార్తె.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “యెరూషలేము నుండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: అతనికి పద్దెనిమిదేళ్లు
  rationale: హీబ్రూ వయస్సును తెలిపే సాధారణ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఈ నిర్మాణం అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; తెలుగులో ‘రాజైనప్పుడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: ‘రాజుగా ఏలాడు/పాలించాడు’ అనే క్రియార్థాన్ని సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: మూడు నెలలు
  rationale: అతని పరిపాలన కాలవ్యవధిని నేరుగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: నగరాన్ని సూచించే స్థానార్థక పూర్వప్రత్యయానికి సహజమైన తెలుగు సమానం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ వంశావళి సూత్రాన్ని సమాచార క్రమం చెడకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: נְחֻשְׁתָּא
  choice: నెహుష్తా
  rationale: హీబ్రూ వ్యక్తిపేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בַת אֶלְנָתָן
  choice: ఎల్నాతాను కుమార్తె
  rationale: హీబ్రూ సమాస నిర్మాణంలోని తండ్రి–కుమార్తె సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִירוּשָׁלָם
  choice: యెరూషలేముకు చెందిన
  rationale: מִן మూలం లేదా అనుబంధాన్ని సూచిస్తుంది. తెలుగు వంశపరిచయ సందర్భంలో ‘చెందిన’ సహజంగా ఉండి, ‘నుండి’ అనే మూలార్థాన్ని పాదసూచికలో నిలుపుతుంది.
