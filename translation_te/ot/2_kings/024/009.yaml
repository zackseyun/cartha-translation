id: 2KI.24.9
reference: 2 Kings 24:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: te
  text: అతడు తన తండ్రి చేసినదంతా అనుసరించి, యాహ్వే దృష్టిలో చెడైనది చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు తీసుకెళ్లే సాధారణ భూతకాల చర్యను సూచిస్తుంది. తెలుగులో సహజమైన వాక్యక్రమం కోసం కర్తను మొదట ఉంచాం.
- source_word: הָרַע
  choice: చెడైనది
  rationale: నిర్దేశక వ్యాసంతో ఉన్న విశేషణం నామవాచకార్థంలో ఉపయోగించబడింది. రాజుల గ్రంథంలోని స్థిరమైన మూల్యాంకన సూత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అనే హీబ్రూ నుడికారం ఒకరి అంచనా లేదా తీర్పును సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దృష్టిలో’ సహజమైన సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపున్న ప్రత్యక్ష లిప్యంతరీకరణగా అందించాం.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేసినదంతా అనుసరించి
  rationale: כְּ + כֹל తండ్రి చేసిన కార్యాల సమగ్రతతో పోలికను సూచిస్తుంది. ‘చేసినదంతా’ సంపూర్ణ భావాన్ని, ‘అనుసరించి’ పోలిక/అనురూపతను సహజ తెలుగులో వ్యక్తం చేస్తాయి.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: ఖతల్ రూపం కుమారుని చర్యకు ముందే జరిగిన తండ్రి కార్యాలను సూచిస్తుంది; తెలుగు సంబంధ క్రియారూపం ఈ పూర్వత్వాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని తెలుగులో కర్తకే తిరిగి సూచించే సహజమైన ‘తన’తో అనువదించాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజుల గ్రంథానికి తగిన గంభీరమైన, సంక్షిప్త కథన శైలి. హీబ్రూ నుడికారాన్ని పదశః ‘కళ్లలో’ అని కాకుండా సహజమైన ‘దృష్టిలో’గా ఇచ్చాం; వాక్యక్రమాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా మార్చినా మూలంలోని సమగ్ర పోలికను నిలిపాం.
