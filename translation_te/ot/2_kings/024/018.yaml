  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: te
  text: సిద్కియా రాజైనప్పుడు అతనికి ఇరవై ఒక్క సంవత్సరాలు. అతడు యెరూషలేములో పదకొండు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు లిబ్నాకు చెందిన యిర్మీయా కుమార్తె హమూతలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును ‘హమితలు’ అని కూడా చదువుతారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: అతనికి ఇరవై ఒక్క సంవత్సరాలు
  rationale: ‘ఇరవై ఒక్క సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ב ఉపసర్గతో కూడిన క్రియానామ రూపం సింహాసనారోహణ సమయాన్ని సూచిస్తుంది; ఈ అర్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించడాన్ని సూచించే క్రియకు సాధారణ పాఠకులకు స్పష్టమైన తెలుగు రూపం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ב ఉపసర్గను నేరుగా తెలియజేస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: రాజుల వృత్తాంతాల్లోని సూత్రబద్ధమైన వాక్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: חמיטל
  choice: హమూతలు
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది; వ్యంజన పాఠం వల్ల మరో స్వరపఠనం సాధ్యమని పాదసూచికలో తెలిపింది.
- source_word: בַּת יִרְמְיָהוּ
  choice: యిర్మీయా కుమార్తె
  rationale: తండ్రి-కుమార్తె వంశసంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מִלִּבְנָה
  choice: లిబ్నాకు చెందిన
  rationale: మూలం లేదా స్వస్థలాన్ని సూచించే מ ఉపసర్గ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
