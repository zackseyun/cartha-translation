source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: te
  text: యెహోవా అతనికి విరోధంగా కల్దీయుల దాడి దళాలను,[a] అరాము దాడి దళాలను,[b] మోయాబు దాడి దళాలను, అమ్మోనీయుల దాడి దళాలను పంపించాడు. యూదాను నాశనం చేయడానికి[c] ఆయన వారిని యూదాలోకి పంపించాడు; యెహోవా తన సేవకులైన ప్రవక్తల ద్వారా పలికిన మాట ప్రకారం ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాడి దళాలు’కు లేదా, ‘దళాలు.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘అరాము’; సాంప్రదాయికంగా ‘సిరియా.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతణ్ణి నాశనం చేయడానికి,’ అంటే యూదాను కాక యెహోయాకీమును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: పంపించాడు
  rationale: కథన సందర్భంలో שלח అనే క్రియకు సహజమైన తెలుగు రూపం; యెహోవాయే ఈ దళాలను పంపించినవాడని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా మూలంలోని ప్రత్యేక నామాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: בּוֹ
  choice: అతనికి విరోధంగా
  rationale: ఇక్కడ సూచించబడిన వ్యక్తి యెహోయాకీము; శత్రుత్వంతో అతని మీదికి దళాలను పంపించడమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: גְּדוּדֵי
  choice: దోపిడీ దళాలు / దళాలు
  rationale: גדוד అనేది పూర్తి స్థాయి సైన్యాలకన్నా దాడులు చేసే సైనిక గుంపులను సూచించవచ్చు. మొదటి ప్రస్తావనలో ‘దోపిడీ దళాలు’ అని అర్థాన్ని స్పష్టం చేసి, పునరుక్తిలో సహజత్వం కోసం ‘దళాలు’ వాడబడింది.
- source_word: כַשְׂדִּים
  choice: కల్దీయులు
  rationale: ‘బబులోనీయులు’ అని చారిత్రకంగా విస్తరించకుండా హెబ్రీ జాతినామాన్నే దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: సాంప్రదాయిక ‘సిరియా’కు బదులుగా మూలంలోని ప్రాంత/జాతి నామాన్ని నిలుపుతుంది.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: మూల నామానికి స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థమైన ‘అమ్మోను కుమారులు’కు బదులుగా ఆ ప్రజావర్గాన్ని సూచించే సహజ తెలుగు జాతినామం.
- source_word: וַיְשַׁלְּחֵם
  choice: ఆయన వారిని ... పంపించాడు
  rationale: మూలంలో క్రియ పునరావృతమైనందున దాన్ని తొలగించకుండా, చర్య పురోగతిని మరియు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: בִּיהוּדָה
  choice: దాని మీదికి
  rationale: యూదాపై జరిగిన శత్రు దాడిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ముందున్న ‘యూదాను’తో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: לְהַאֲבִידוֹ
  choice: యూదాను నాశనం చేయడానికి
  rationale: తక్షణ సందర్భంలోని యూదాను లక్ష్యంగా స్వీకరిస్తుంది. పుంలింగ ఏకవచన ప్రత్యయం యెహోయాకీమును కూడా సూచించగల నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపింది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా పలికిన మాట ప్రకారమే
  rationale: ప్రవచన నెరవేర్పు సూత్రాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: తన సేవకులైన ప్రవక్తల ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హెబ్రీ నుడికారాన్ని దాని సాధనార్థ భావంతో సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: לְהַאֲבִידוֹ లోని పుంలింగ ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: 'ప్రధాన పాఠంలో యూదా: ‘యూదాను నాశనం చేయడానికి.’'
  alternative: 'యెహోయాకీము: ‘అతణ్ణి నాశనం చేయడానికి.’'
  rationale: లక్ష్యంగా యూదా వెంటనే ప్రస్తావించబడటం, చుట్టుపక్కల సందర్భం యూదాపై తీర్పును ప్రధానంగా చూపడం వల్ల ప్రధాన పాఠంలో యూదాను ఎంచుకున్నాం. అయితే ప్రత్యయం వ్యాకరణపరంగా యెహోయాకీమును కూడా సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని రెండు ‘పంపించాడు’ క్రియలను నిలిపి, జాతినామాలను మూలానికి దగ్గరగా లిప్యంతరీకరించాం. లింగసూచక ప్రత్యయంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికలో భద్రపరిచాం.
