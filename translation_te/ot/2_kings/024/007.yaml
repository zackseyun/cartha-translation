source:
  edition: WLC
  text: וְ/לֹֽא הֹסִ֥יף עוֹד֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ/צֵ֖את מֵֽ/אַרְצ֑/וֹ כִּֽי לָקַ֞ח מֶ֣לֶךְ בָּבֶ֗ל מִ/נַּ֤חַל מִצְרַ֨יִם֙ עַד נְהַר פְּרָ֔ת כֹּ֛ל אֲשֶׁ֥ר הָיְתָ֖ה לְ/מֶ֥לֶךְ מִצְרָֽיִם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: te
  text: ఐగుప్తు రాజు ఇక తన దేశం నుండి బయటకు వెళ్లలేదు. ఎందుకంటే బబులోను రాజు ఐగుప్తు వాగు[a] నుండి యూఫ్రటీసు నది వరకు ఐగుప్తు రాజుకు చెందినదంతా స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఐగుప్తు వాడీ.” హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా వాగుపాత్రను సూచించవచ్చు; ఇక్కడ “నది” అనడం తక్కువ సంభావ్యమైనది, అంతేకాక అది నైలు నదితో గందరగోళం కలిగించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: ఇక ... బయటకు రాలేదు
  rationale: הוסיף + infinitive, לא మరియు עודతో కలిసి, ఒక చర్య ఇక కొనసాగలేదని లేదా మళ్లీ జరగలేదని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఇక ... రాలేదు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָצֵאת מֵאַרְצוֹ
  choice: తన దేశం నుండి బయటకు రాలేదు
  rationale: יצא యొక్క ప్రాథమిక భావమైన ‘బయటకు రావడం’ను నిలుపుతూ, రాజసైనిక సందర్భంలో ఉన్న దండయాత్ర సూచనను పాఠకుడు సందర్భం ద్వారా గ్రహించేలా ఉంచింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఈ పదం ఐగుప్తు రాజు ఇక బయటకు రాకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לָקַח
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לקח అంటే ప్రాథమికంగా ‘తీసుకోవడం’. రాజ్యాల భూభాగాధికార సందర్భంలో ‘స్వాధీనం చేసుకున్నాడు’ సహజంగా ఉండి, బలవంతపు ఆక్రమణను అనవసరంగా అతిశయింపజేయదు.
- source_word: מִנַּחַל מִצְרַיִם
  choice: ఐగుప్తు వాగు
  rationale: נחל సాధారణంగా పెద్ద నది కంటే వాగు, కాలానుగుణ జలప్రవాహం లేదా వాడీని సూచిస్తుంది. ‘వాగు’ సాధారణ తెలుగు పాఠకులకు సహజంగా ఉండి నైలు నదితో గందరగోళాన్ని నివారిస్తుంది.
- source_word: עַד נְהַר פְּרָת
  choice: యూఫ్రటీసు నది వరకు
  rationale: נהר అనేది ‘నది’, פרת అనేది యూఫ్రటీసు. తెలుగు పదక్రమంలో ఈ రూపం సహజం.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజుకు చెందినదంతా
  rationale: హీబ్రూ వాక్యంలోని విస్తృత స్వామ్య/అధికార భావాన్ని నిలుపుతుంది. భౌగోళిక సందర్భం ప్రధానంగా భూభాగాధికారాన్ని సూచించినా, అనువాదం దానిని కేవలం ‘దేశం’గా కుదించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని రెండు వాక్యభాగాల కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, సైనిక దండయాత్ర భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
