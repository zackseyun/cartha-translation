source:
  edition: WLC
  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: te
  text: అప్పుడు యూదా రాజైన యెహోయాకీను బయటికి వచ్చి బబులోను రాజు ఎదుటకు వెళ్లాడు; అతడూ అతని తల్లీ, అతని సేవకులు, అతని అధికారులు, అతని నపుంసకులు[a] కూడా వెళ్లారు. బబులోను రాజు తన పరిపాలన ఎనిమిదవ సంవత్సరంలో యెహోయాకీనును తన ఆధీనంలోకి తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం అక్షరార్థంగా ‘నపుంసకులు’ అని అర్థం కావచ్చు; విస్తృతంగా ‘రాజసభ అధికారులు’ అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికివచ్చాడు
  rationale: יצא అనే క్రియకు ప్రాథమికంగా ‘బయటికి రావడం/వెళ్లడం’ అనే అర్థం ఉంది. ముట్టడి సందర్భంలో ఇది లొంగిపోవడాన్ని సూచించవచ్చు; అయితే ‘లొంగిపోయాడు’ అని స్పష్టీకరించకుండా మూలంలోని వర్ణనను నిలిపింది.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు దగ్గరికి
  rationale: יצא తో కలిసిన עַל ఇక్కడ బబులోను రాజువైపు వెళ్లడాన్ని సూచిస్తుంది. ‘దగ్గరికి’ ఆధునిక తెలుగులో సహజంగా గమ్యాన్ని తెలియజేస్తుంది.
- source_word: הוּא וְאִמּוֹ
  choice: అతనితోపాటు అతని తల్లి
  rationale: హీబ్రూ సర్వనామం ప్రధాన కర్తను మళ్లీ పేర్కొని, అతనితో వచ్చినవారి జాబితాను ప్రారంభిస్తుంది. తెలుగులో ‘అతనితోపాటు’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עבד సేవకులను లేదా రాజసేవలో ఉన్నవారిని సూచించగల విస్తృత పదం. ‘సేవకులు’ దాని సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: שָׂרָיו
  choice: అతని అధికారులు
  rationale: שׂרים ఉన్నతస్థాయి నాయకులు లేదా అధికారులను సూచిస్తుంది. రాజసభ సందర్భంలో ‘అధికారులు’ సహజమైన, విస్తృతమైన పదం.
- source_word: סָרִיסָיו
  choice: అతని నపుంసకులు[a]
  rationale: סָרִיסִים అక్షరార్థంగా నపుంసకులను సూచించగలదు; రాజసభ అధికారులనే విస్తృత అర్థం కూడా ఉండవచ్చు. ప్రధాన పాఠ్యంలో ప్రత్యేక పదాన్ని నిలిపి, విస్తృత అర్థాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: וַיִּקַּח אֹתוֹ
  choice: యెహోయాకీనును పట్టుకున్నాడు
  rationale: לקח సాధారణంగా ‘తీసుకొను’ అని అర్థం. ఈ సందర్భంలో రాజును తన ఆధీనంలోకి తీసుకోవడం భావం ఉన్నందున ‘పట్టుకున్నాడు’ సహజంగా సందర్భార్థాన్ని అందిస్తుంది; ‘బంధించాడు’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: తన పాలనలో ఎనిమిదో సంవత్సరంలో
  rationale: సమీప కర్త అయిన బబులోను రాజునే ఏకవచన ప్రత్యయం సూచిస్తుంది. తెలుగులో ‘తన పాలనలో’ ఆ సూచనను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి కాలసూచనలో ‘అతని పాలన’ ఎవరిని సూచిస్తుంది?
  choice: బబులోను రాజు పాలన
  alternative: యెహోయాకీను పాలన
  rationale: వాక్యనిర్మాణంలో సమీప పురుష ఏకవచన కర్త బబులోను రాజు. రాజుల గ్రంథంలోని చారిత్రక కాలక్రమం కూడా ఇక్కడ బబులోను రాజు పరిపాలనా సంవత్సరాన్నే సూచిస్తుంది.
- issue: יָצָא క్రియలో సందర్భానుసారంగా ఉన్న లొంగుబాటు భావం
  choice: ‘బయటికివచ్చాడు’ అని మూల క్రియను అనుసరించడం
  alternative: ‘లొంగిపోయాడు’ అని సందర్భార్థాన్ని స్పష్టీకరించడం
  rationale: ముట్టడి సందర్భం లొంగుబాటును సూచించినా, హీబ్రూ క్రియ దానిని నేరుగా చెప్పదు. అందువల్ల ఆ భావాన్ని పాఠ్యంలో బలవంతంగా స్థిరపరచకుండా వర్ణనాత్మక పదాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడింది. వ్యక్తుల జాబితాను తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా విభజించింది. ‘బయటికివచ్చాడు’ అనే రూపం ముట్టడి స్థలం నుంచి రాజు వద్దకు రావడాన్ని తెలియజేస్తూనే, ‘లొంగిపోయాడు’ అనే వ్యాఖ్యాత్మక నిర్ధారణను నివారిస్తుంది.
