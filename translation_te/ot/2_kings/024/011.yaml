  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: te
  text: బబులోను రాజు నెబుకద్నెజరు నగరంపైకి వచ్చాడు; అతని సేవకులు దానిని ముట్టడి చేస్తుండగా.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సేవకులు దానిమీద ముట్టడి వేస్తుండగా.”
    reason: lexical_alternative
  - marker: b
    text: “అతని సేవకులు” అనే మాట బబులోను రాజు సేవలో ఉన్న అధికారులను, ప్రతినిధులను లేదా సైనిక బలగాలను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే సాధారణ కథన క్రియకు సహజమైన అనువాదం. తరువాతి עַל మరియు ముట్టడి సందర్భం వల్ల శత్రుత్వంతో నగరానికి రావడం స్పష్టమవుతుంది.
- source_word: נְבוּכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: ఈ బబులోను రాజు పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: రాజు పదవిని, అతని రాజ్యాన్ని తెలిపే హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: עַל הָעִיר
  choice: నగరానికి వ్యతిరేకంగా
  rationale: ముట్టడి సందర్భంలో עַל తటస్థమైన ‘నగరానికి’ కంటే శత్రుత్వపూర్వకంగా దాని మీదికి రావడాన్ని సూచిస్తుంది.
- source_word: וַעֲבָדָיו
  choice: అతని సేవకులు
  rationale: עבדים యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; రాజసందర్భంలో ఇది అధికారులను, ప్రతినిధులను లేదా సైనిక బలగాలను కూడా సూచించగలదని పాదసూచిక వివరిస్తుంది.
- source_word: צָרִים
  choice: ముట్టడిస్తూ ఉన్నారు
  rationale: צור ధాతువు కృదంత రూపం కొనసాగుతున్న ముట్టడి చర్యను సూచిస్తుంది; నెబుకద్నెజరు వచ్చినప్పుడు ఆ చర్య జరుగుతూనే ఉందని తెలుపుతుంది.
- source_word: עָלֶיהָ
  choice: దాన్ని
  rationale: స్త్రీలింగమైన ‘నగరం’నే సర్వనామం సూచిస్తుంది. ‘ముట్టడించు’ తరువాత తెలుగులో ప్రత్యక్ష కర్మ సహజంగా ఉంటుంది.
