  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
