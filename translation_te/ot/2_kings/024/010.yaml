  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: te
  text: ఆ సమయంలో బబులోను రాజైన నెబుకద్నెజరు సేవకులు యెరూషలేము మీదికి దండెత్తి వచ్చారు[a]; నగరం ముట్టడిలో పడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘యెరూషలేముకు పైకి వచ్చారు.’ హీబ్రూ ప్రయోగం భౌగోళికంగా పైకి వెళ్లడాన్నీ సైనికంగా ముందుకు రావడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నగరం ముట్టడికి గురైంది.’ హీబ్రూ అక్షరార్థంగా ‘నగరం ముట్టడిలోకి వచ్చింది’ అని ఉంది; ఇది ముట్టడి ఆరంభాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: చారిత్రక సందర్భాన్ని సూచించే కాలవాచక పదబంధం; ఆధునిక తెలుగులో సహజంగా ఉండి హీబ్రూ నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: עָלָה
  choice: మీదికి దండెత్తి వచ్చారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘పైకి వెళ్లారు/వచ్చారు’ అని ఉన్నా, యెరూషలేము వైపు సైనిక కదలికను సందర్భం సూచిస్తుంది. ఈ అనువాదం భౌగోళికంగా పైకి వెళ్లే భావాన్నీ శత్రుదాడి సందర్భాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: హీబ్రూ పదానికి నేరమైన అర్థం ‘సేవకులు.’ సందర్భంలో వీరు రాజు ఆధీనంలోని సైనిక ప్రతినిధులు కావచ్చు; అయినా మూలంలో లేని ‘సైన్యం’ లేదా ‘అధికారులు’ అనే నిర్దిష్టతను చేర్చలేదు.
- source_word: נְבֻכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాన్ని ఉపయోగించాం.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజైన
  rationale: రాజ బిరుదును తెలుగులో సహజమైన సంబంధ నిర్మాణంతో నేరుగా అనువదించాం.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన స్థలనామ రూపం.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: నగరం ముట్టడిలో పడింది
  rationale: హీబ్రూ అక్షరార్థంగా ‘నగరం ముట్టడిలోకి వచ్చింది’ అని ఉండి ముట్టడి మొదలైన భావాన్ని సూచించవచ్చు. ‘ముట్టడిలో పడింది’ ఆ ఆరంభ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מָצוֹר
  choice: ముట్టడి
  rationale: నగరాన్ని చుట్టుముట్టే సైనిక చర్యకు ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
