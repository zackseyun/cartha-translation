translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన శైలి. ‘సేవకులు’ అనే మూలపదాన్ని నిలిపి, సందర్భం ఆధారంగా వారిని ‘సైన్యం’గా నిర్దిష్టీకరించలేదు. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
