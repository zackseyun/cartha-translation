source:
  edition: WLC
  text: וְ/גַ֤ם דַּֽם הַ/נָּקִי֙ אֲשֶׁ֣ר שָׁפָ֔ךְ וַ/יְמַלֵּ֥א אֶת יְרוּשָׁלִַ֖ם דָּ֣ם נָקִ֑י וְ/לֹֽא אָבָ֥ה יְהוָ֖ה לִ/סְלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: te
  text: అంతేకాక, అతడు చిందించిన నిర్దోషుల రక్తం కారణంగా కూడా, అతడు యెరూషలేమును నిర్దోషుల రక్తంతో నింపాడు; యెహోవా క్షమించడానికి ఇష్టపడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా క్షమించడానికి ఒప్పుకోలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందటి వాక్యంలో పేర్కొన్న తీర్పు కారణాలకు మరో కారణాన్ని జోడించే సంధాన, సముచ్చయ భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דַּם הַנָּקִי
  choice: నిర్దోషుల రక్తాన్ని
  rationale: అన్యాయంగా చంపబడిన నిరపరాధుల రక్తం వల్ల కలిగిన రక్తాపరాధాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: అతడు చిందించిన
  rationale: రక్తంతో కలిసి שׁפך వాడినప్పుడు ‘రక్తం చిందించడం’ అనే ప్రామాణిక నుడికార భావం వస్తుంది; సంబంధ వాక్య నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: అతడు యెరూషలేమును నిర్దోషుల రక్తంతో నింపాడు
  rationale: హీబ్రూ వాక్య నిర్మాణానికి సన్నిహితంగా ఉండి, తెలుగులో అవసరమైన ‘తో’ విభక్తిని ఉపయోగించి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא אָבָה
  choice: ఇష్టపడలేదు
  rationale: אָבָהలోని ఇష్టం లేదా సమ్మతి అనే భావాన్ని ‘క్షమించలేదు’ అని మాత్రమే కుదించకుండా ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే సంప్రదాయ లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: לִסְלֹחַ
  choice: క్షమించడానికి
  rationale: దేవుడు అపరాధాన్ని మన్నించడం అనే సందర్భంలో సులభంగా అర్థమయ్యే సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: మనష్షే చేసిన రక్తాపరాధం నేపథ్యంలో దేవుడు క్షమించడానికి నిరాకరించడం
  choice: నిర్దోషుల రక్తంతో యెరూషలేము నిండినందువల్ల యెహోవా క్షమించడానికి ఇష్టపడలేదని వచనం చెప్పే తీవ్రతను యథాతథంగా ఉంచడం.
  alternative: ‘యెహోవా క్షమించలేదు’ అని సంక్షిప్తంగా అనువదించడం, లేదా ఈ మాటను అతిశయోక్తిగా వివరించడం.
  rationale: హీబ్రూ אָבָה ఇష్టం లేదా సమ్మతిని ప్రత్యక్షంగా సూచిస్తుంది. కాబట్టి తీర్పు మరియు క్షమాపణ మధ్య ఉన్న వేదాంత ఉద్రిక్తతను మృదువుచేయకుండా, వచనం చెప్పిన పరిమితిలోనే అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కారణ సంబంధం, రక్తం చిందించడం అనే నుడికారం, మరియు దేవుని క్షమించకూడదనే సంకల్పంలోని తీవ్రతను నిలుపుతూ సహజమైన తెలుగు వాక్య నిర్మాణం ఉపయోగించబడింది.
