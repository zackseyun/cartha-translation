revisions:
- from: అంతేకాక, అతడు చిందించిన నిర్దోషుల రక్తాన్ని బట్టి[a]—అతడు యెరూషలేమును నిర్దోషుల రక్తంతో నింపాడు—యెహోవా క్షమించడానికి ఇష్టపడలేదు.[b]
  to: అంతేకాక, అతడు చిందించిన నిర్దోషుల రక్తం కారణంగా కూడా, అతడు యెరూషలేమును నిర్దోషుల రక్తంతో నింపాడు; యెహోవా క్షమించడానికి ఇష్టపడలేదు.[a]
  rationale: The revision retains the source's additive opening, both explicit references to innocent blood, and Yahweh's refusal in terms of unwillingness. It replaces the parenthetical dash structure with coordinated Telugu clauses. The sole footnote is placed at the phrase it qualifies and offers a genuine lexical alternative for אָבָה without losing its volitional force. The prior footnote a did not add a meaningful alternative, so it is omitted.
