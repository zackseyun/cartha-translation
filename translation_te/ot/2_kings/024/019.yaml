id: 2KI.24.19
reference: 2 Kings 24:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: te
  text: యాహ్వే దృష్టిలో అతడు చెడు చేశాడు; యెహోయాకీము చేసినదంతటి ప్రకారమే చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనంలోని తదుపరి చర్యను సూచిస్తుంది. తెలుగులో ప్రారంభ ‘మరియు’ అవసరం లేకుండా సహజంగా క్రియను అందించాం.
- source_word: הָרַע
  choice: చెడ్డదాన్ని
  rationale: עשה הרע అనే హీబ్రూ నుడికారం ‘చెడ్డది చేయడం’ అనే నైతిక అర్థాన్ని ఇస్తుంది; ‘చెడ్డదాన్ని చేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయినా, ఈ నుడికారం ఒకరి మూల్యాంకనం లేదా అభిప్రాయాన్ని సూచిస్తుంది. ‘దృష్టిలో’ రూపకాన్ని, అర్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: చేసినదంతా అతడూ చేశాడు
  rationale: כְּכֹל אֲשֶׁר పూర్తి పోలికను సూచిస్తుంది. తెలుగులో ‘చేసినదంతా అతడూ చేశాడు’ అనడం ఆ సమగ్రతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוֹיָקִים
  choice: యెహోయాకీము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచాం; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథన శైలి. మూలంలోని నైతిక మూల్యాంకనాన్ని, యెహోయాకీముతో ఉన్న సంపూర్ణ ప్రవర్తనా పోలికను నిలిపింది.
