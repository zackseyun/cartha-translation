source:
  edition: WLC
  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: te
  text: యెహోవా కోపం కారణంగా యెరూషలేములోనూ యూదాలోనూ ఇలా జరిగింది; చివరకు ఆయన వారిని తన సన్నిధి నుండి తొలగించివేశాడు.[a] సిద్కియా బబులోను రాజుపై తిరుగుబాటు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా కోపం యెరూషలేము, యూదాల మీద ఉండి, ఆయన వారిని తన ఎదుటనుండి తొలగించివేసే వరకు అలాగే ఉంది.” మొదటి వాక్యభాగంలోని హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉంది; దీనిని మరింత రూపానుసారంగా ఇలా కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: కారణంగా
  rationale: ఇక్కడ כִּי ముందున్న సందర్భానికి వివరణాత్మకమైన కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘కారణంగా’ సహజంగా ఆ కారణ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עַל אַף יְהוָה
  choice: యెహోవా కోపం కారణంగా
  rationale: עַל אַף అనే పదబంధం దైవిక కోపాన్ని సూచిస్తుంది; יְהוָה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הָיְתָה
  choice: పరిస్థితి ఇలా కొనసాగి
  rationale: స్పష్టమైన కర్తలేని స్త్రీలింగ ఏకవచన క్రియ ఇక్కడ సంక్షిప్త హీబ్రూ నిర్మాణంలో పరిస్థితిని సూచిస్తుంది. ఈ అనువాదం దాని కొనసాగింపును తెలుపుతుంది; ప్రత్యామ్నాయమైన మరింత రూపానుసార అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: యెరూషలేములోనూ యూదాలోనూ
  rationale: ב ఉపసర్గను ప్రాథమికంగా స్థానార్థకంగా తీసుకుని, రెండు ప్రాంతాల్లో నెలకొన్న పరిస్థితిగా అనువదించాం.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: చివరకు ఆయన వారిని ... వెళ్లగొట్టాడు
  rationale: עַד తో కూడిన infinitive construct పరిస్థితి చేరిన అంతిమ ఫలితాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టాడు’ హీబ్రూ క్రియ బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל פָּנָיו
  choice: తన సన్నిధి నుండి
  rationale: ముఖం ఎదుటనుండి తొలగించడం అనే హీబ్రూ నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో ‘సన్నిధి నుండి’గా ఇచ్చాం.
- source_word: וַיִּמְרֹד
  choice: ఎదురుతిరిగాడు
  rationale: מרד పాలకునిపై తిరుగుబాటు చేయడాన్ని సూచిస్తుంది; ‘ఎదురుతిరిగాడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: బబులోను రాజుకు
  rationale: מרד తో వచ్చిన ב ఇక్కడ విరోధార్థకం. తెలుగులో ‘రాజుకు ఎదురుతిరిగాడు’ సహజ నిర్మాణం.
- source_word: צִדְקִיָּהוּ
  choice: సిద్కియా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని కారణం, కొనసాగింపు, ఫలితం మధ్య సంబంధం
  choice: యెహోవా కోపం కారణంగా పరిస్థితి కొనసాగి, చివరకు బహిష్కరణకు దారితీసిందని అనువదించడం
  alternative: యెహోవా కోపం యెరూషలేము, యూదాలకు విరోధంగా ఉండి, ఆయన వారిని తన ఎదుటనుండి వెళ్లగొట్టే వరకు కొనసాగిందని అనువదించడం
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి రెండు విధాలుగా గ్రహించవచ్చు. ప్రధాన పాఠం సహజ తెలుగు ప్రవాహాన్ని ఇస్తుంది; పాదటిప్పణి మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని కాపాడుతుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘యెరూషలేములోనూ యూదాలోనూ’ అనే జత నిర్మాణం మూలంలోని స్థానార్థాన్ని నిలుపుతుంది. సంక్షిప్త హీబ్రూ వాక్యంలోని అస్పష్టతను ప్రధాన పాఠంలో పూర్తిగా తొలగించకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో స్పష్టంగా నమోదు చేశాం.
