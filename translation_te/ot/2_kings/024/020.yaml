- from: యెహోవా కోపం కారణంగా యెరూషలేములోనూ యూదాలోనూ పరిస్థితి ఇలా కొనసాగి, చివరకు ఆయన వారిని తన సన్నిధి నుండి వెళ్లగొట్టాడు.[a] సిద్కియా బబులోను రాజుకు ఎదురుతిరిగాడు.
