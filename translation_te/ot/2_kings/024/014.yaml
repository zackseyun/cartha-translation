translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని అనుసరించాం. జాబితా స్పష్టత కోసం వాక్యాన్ని మూడు భాగాలుగా విభజించాం; హీబ్రూ పాఠ్యంలోని సమగ్రతను తెలియజేసే ‘అందరినీ’ పునరుక్తిని నిలిపాం. ‘యెరూషలేమంతటినీ’ అనే మూలభాషా రూపకం అలాగే ఉంచబడింది; అది భౌతిక నగరాన్ని కాక అక్కడి జనసమూహాన్ని సూచిస్తుందని సందర్భం తెలియజేస్తుంది.
