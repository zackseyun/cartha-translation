id: 2KI.24.14
reference: 2 Kings 24:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: te
  text: అతడు యెరూషలేములోని వారందరినీ, అధికారులందరినీ, పరాక్రమవంతులైన యోధులందరినీ—మొత్తం పదివేల మందిని—నైపుణ్యంగల పనివారందరినీ, లోహపు పనివారందరినీ[a] ప్రవాసానికి తీసుకుపోయాడు. దేశ ప్రజల్లో అత్యంత పేదవారు తప్ప ఎవరూ మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కమ్మరులను”; ఈ హీబ్రూ పదం ఖచ్చితంగా ఏ ప్రత్యేక వృత్తిని సూచిస్తుందో అనిశ్చితం.
    reason: హీబ్రూ הַמַּסְגֵּר అనే పదానికి ‘కమ్మరి’ అనే సంప్రదాయ అర్థం ఉన్నప్పటికీ, అది లోహంతో పనిచేసే నైపుణ్యంగల పనివారిని మరింత విస్తృతంగా సూచించవచ్చు.
lexical_decisions:
- source_word: וְהִגְלָה
  choice: బందీలుగా తరలించాడు
  rationale: గלה యొక్క హిఫీల్ రూపం బలవంతంగా ప్రవాసానికి పంపడాన్ని సూచిస్తుంది. ఈ ఎంపిక బంధితత్వాన్నీ, ఒక ప్రాంతం నుంచి తరలించడాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל יְרוּשָׁלִַם
  choice: యెరూషలేమంతటినీ
  rationale: ఇది నగరంలోని ప్రజలను, ముఖ్యంగా తరువాత పేర్కొన్న వర్గాలను సూచించే అలంకారిక ప్రయోగం. హీబ్రూ వ్యక్తీకరణను అతిగా విశదీకరించకుండా నిలుపుతుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: ఈ పదం రాజకుమారులు, పాలకులు లేదా ఉన్నతాధికారులను సూచించగలదు. ఇక్కడ పాలనా వర్గాన్ని విస్తృతంగా సూచించడానికి ‘అధికారులు’ సరిపోతుంది.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: సైనిక సామర్థ్యమూ శౌర్యమూ గల పురుషులను సూచించే హీబ్రూ నుడికారంలోని రెండు భావాలనూ ఈ పదబంధం వ్యక్తం చేస్తుంది.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: మొత్తం పదివేల మందిని
  rationale: గּוֹלֶה ఇక్కడ ప్రవాసానికి తరలించబడిన జనసమూహాన్ని సమష్టిగా సూచిస్తుంది. ముందున్న జాబితాకు సంఖ్యను అన్వయిస్తూ సహజమైన తెలుగు వాక్య నిర్మాణాన్ని ఇస్తుంది.
- source_word: הֶחָרָשׁ
  choice: నైపుణ్యంగల పనివారు
  rationale: חָרָשׁ వివిధ రకాల చేతివృత్తుల్లో నైపుణ్యం గల పనివారిని లేదా శిల్పులను సూచించగలదు; ఒకే ప్రత్యేక వృత్తికి పరిమితం చేయకుండా అనువదించబడింది.
- source_word: הַמַּסְגֵּר
  choice: లోహపు పనివారు[a]
  rationale: ఈ అరుదైన పదం సాధారణంగా కమ్మరులు లేదా ఇతర లోహ నిపుణులను సూచిస్తుందని భావిస్తారు; ఖచ్చితమైన ప్రత్యేక వృత్తి అనిశ్చితమైనందున విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לֹא נִשְׁאַר
  choice: మరెవరూ మిగలలేదు
  rationale: వెనుక ఎవరూ మిగలకపోవడాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: దేశ ప్రజల్లో అత్యంత పేదవారు తప్ప
  rationale: דַּלַּת బలహీనమైన లేదా పేద వర్గాన్ని సూచిస్తుంది. సందర్భంలో సామాజిక-ఆర్థిక దౌర్భాగ్యాన్ని ‘అత్యంత పేదవారు’ స్పష్టంగా తెలియజేస్తుంది.
