revisions:
- from: బబులోను రాజు అతని స్థానంలో అతని తండ్రి సోదరుడైన మత్తన్యాను రాజుగా నియమించాడు[a]. అతని పేరును సిద్కియాగా మార్చాడు.
  to: బబులోను రాజు యెహోయాకీను స్థానంలో, అతని తండ్రి సోదరుడైన మత్తన్యాను రాజుగా నియమించాడు[a]; అతని పేరును సిద్కియాగా మార్చాడు.
  rationale: యెహోయాకీను పేరును చేర్చి, ‘అతని’ అనే సర్వనామం ఎవరిని సూచిస్తుందో స్పష్టం చేశాను. ఇది వెంటనే ముందు ఉన్న సందర్భంలో పేర్కొన్న వ్యక్తినే గుర్తిస్తుంది మరియు బబులోను రాజుతో తప్పుగా బంధుత్వాన్ని కలపకుండా చేస్తుంది. ఇతర పదప్రయోగాలు మూలపాఠం యొక్క కారక రాజ్యాభిషేకం, వారసత్వ స్థానం, పేరు మార్పు అర్థాలను నిలుపుతున్నాయి.
