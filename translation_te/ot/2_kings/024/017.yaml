  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. బంధుత్వాన్ని ‘మామ’ అని అస్పష్టంగా చెప్పకుండా ‘తండ్రి సోదరుడు’ అని నిర్దిష్టంగా తెలిపింది.
