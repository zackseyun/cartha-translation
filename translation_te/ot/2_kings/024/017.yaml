source:
  edition: WLC
  text: וַ/יַּמְלֵ֧ךְ מֶֽלֶךְ בָּבֶ֛ל אֶת מַתַּנְיָ֥ה דֹד֖/וֹ תַּחְתָּ֑י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ צִדְקִיָּֽהוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: te
  text: బబులోను రాజు యెహోయాకీను స్థానంలో, అతని తండ్రి సోదరుడైన మత్తన్యాను రాజుగా నియమించాడు[a]; అతని పేరును సిద్కియాగా మార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మత్తన్యాను రాజుగా చేశాడు.’ హీబ్రూ క్రియ కారక భావంలో ఉంది; బబులోను రాజు అతన్ని పరిపాలకునిగా ప్రతిష్ఠించాడని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: రాజుగా నియమించాడు
  rationale: מלך అనే క్రియ హిఫీల్ రూపంలో ఉండి, బబులోను రాజు మత్తన్యాను పరిపాలకునిగా ప్రతిష్ఠించాడనే కారక భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘రాజుగా నియమించాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: హీబ్రూ సమాసపదబంధంలోని సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ భావంతో తెలిపింది.
- source_word: מַתַּנְיָה
  choice: మత్తన్యా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: דֹדוֹ
  choice: అతని తండ్రి సోదరుడు
  rationale: דּוֹד పదం సందర్భానుసారం మామ లేదా ఇతర సమీప బంధువును సూచించగలదు. ఇక్కడ చారిత్రక వంశసంబంధం ప్రకారం మత్తన్యా యెహోయాకీను తండ్రి సోదరుడు; ‘మామ’ అనే తెలుగు పదంలో ఉండే ఇతర అర్థాల అస్పష్టతను ఈ రూపం నివారిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ఈ రాజ్యాభిషేక సందర్భంలో תחת ఒకరి స్థానంలో మరొకరు రావడం లేదా ప్రతినియామకాన్ని సూచిస్తుంది.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: అతని పేరును ... మార్చాడు
  rationale: పేరుతో కలిసి వచ్చిన סבב క్రియ ఇక్కడ పేరు మార్చడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కొత్త పేరు క్రియకు ముందు ఉంచబడింది.
- source_word: צִדְקִיָּהוּ
  choice: సిద్కియా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా, తెలుగు బైబిలు పాఠకులకు సులభంగా పలకగల లిప్యంతరీకరణ.
