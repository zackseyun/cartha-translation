translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి పాటించబడింది. రాజకీయం సందర్భాన్ని సహజంగా తెలియజేస్తూనే ‘సేవకుడు’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని రాజకీయ భావాన్ని పాదసూచికలో వివరించాం. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, [a]ను ‘సేవకుడయ్యాడు’ దగ్గర, [b]ను విధేయత మార్పు దగ్గర ఉంచాం.
