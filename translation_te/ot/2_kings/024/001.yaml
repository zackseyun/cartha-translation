id: 2KI.24.1
reference: 2 Kings 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: te
  text: అతని కాలంలో బబులోను రాజైన నెబుకద్నెజరు వచ్చాడు. యెహోయాకీము మూడు సంవత్సరాలు అతనికి సేవకుడయ్యాడు[a]. తర్వాత అతడు తిరిగి, అతనిపై తిరుగుబాటు చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూడు సంవత్సరాలు అతనికి లోబడిన రాజుగా ఉన్నాడు.” హెబ్రీలో అక్షరార్థంగా “అతనికి సేవకుడయ్యాడు” అని ఉంది; ఇది అధిపతి రాజుకు రాజకీయంగా లోబడడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తిరిగి, అతనిపై తిరుగుబాటు చేశాడు.” ‘తిరిగి’ అనే క్రియ, తిరుగుబాటు చేయడానికి ముందు యెహోయాకీము తన విధేయతను మార్చుకున్నాడని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: అతని కాలంలో
  rationale: ముందు ప్రస్తావించబడిన రాజు పరిపాలించిన కాలాన్ని సూచించే హెబ్రీ కాలవాచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָלָה
  choice: దండెత్తి వచ్చాడు
  rationale: మూల క్రియకు ‘పైకి వచ్చాడు/వెళ్లాడు’ అనే ప్రాథమిక అర్థం ఉన్నా, ఇక్కడ రాజు సైనికంగా ముందుకు రావడాన్ని సూచిస్తుంది. ‘దండెత్తి వచ్చాడు’ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נְבֻכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన, మూల పేరును గుర్తించగల ప్రామాణిక రూపం.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజైన
  rationale: హెబ్రీ సమాసబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ నెబుకద్నెజరును పరిచయం చేస్తుంది.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: అతనికి సేవకుడయ్యాడు
  rationale: యెహోయాకీము లోబడిన స్థితిలోకి ప్రవేశించాడనే కథన గమనాన్ని ‘అయ్యాడు’ తెలియజేస్తుంది; ‘అతనికి’ అనే రూపం హెబ్రీ నిర్మాణాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: పదానికి సేవకుడు లేదా దాసుడు అనే అర్థాలు ఉండవచ్చు; ఈ రాజకీయం సందర్భంలో పైచేయి గల రాజుకు లోబడిన రాజును సూచిస్తుంది. ‘సేవకుడు’ మూలపదాన్ని పారదర్శకంగా ఉంచుతుంది; రాజకీయ భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּשָׁב
  choice: తన విధేయతను మార్చుకొని
  rationale: మూల క్రియ అక్షరార్థంగా ‘తిరిగాడు/తిరిగి వచ్చాడు.’ తిరుగుబాటుకు ముందు యెహోయాకీము తన పూర్వ విధేయతను తిప్పుకున్నాడనే సందర్భార్థాన్ని ఈ రూపం స్పష్టంగా తెలుపుతుంది; అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וַיִּמְרָד בּוֹ
  choice: అతనిపై తిరుగుబాటు చేశాడు
  rationale: పై అధికారి మీద తిరుగుబాటు చేయడాన్ని సూచించే హెబ్రీ క్రియాబంధానికి స్పష్టమైన సహజ తెలుగు రూపం.
