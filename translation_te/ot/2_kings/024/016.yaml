source:
  edition: WLC
  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: te
  text: బబులోను రాజు పరాక్రమవంతులైన పురుషులందరినీ—ఏడు వేల మందిని—శిల్పులను, లోహకారులను—వెయ్యి మందిని—అంటే యుద్ధం చేయగల బలవంతులైన వారందరినీ, బందీలుగా బబులోనుకు తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: పరాక్రమవంతులైన పురుషులు
  rationale: ఈ పదబంధం బలమైన, సమర్థులైన, సైనిక సేవకు ఉపయోగపడగల పురుషులను సూచిస్తుంది. ‘పరాక్రమవంతులైన పురుషులు’ అనే రూపం హెబ్రీయ భావాన్ని, పురుష సూచనను నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ఏడు వేల మంది
  rationale: వ్యక్తుల సంఖ్యను తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: הֶחָרָשׁ
  choice: శిల్పులు
  rationale: ఈ పదం కలప, రాయి లేదా లోహంతో పనిచేసే నైపుణ్యంగల పనివారిని విస్తృతంగా సూచించగలదు; ఒకే వృత్తికి పరిమితం చేయకుండా ‘శిల్పులు’ అని అనువదించబడింది.
- source_word: הַמַּסְגֵּר
  choice: లోహకారులు
  rationale: పదం బహుశా లోహంతో పనిచేసే కమ్మరులను లేదా ఇతర లోహ పనివారిని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో విస్తృత అర్థం స్పష్టంగా ఉండేందుకు ‘లోహకారులు’ ఎంచుకోబడింది.
- source_word: אֶלֶף
  choice: వెయ్యి మంది
  rationale: శిల్పులు, లోహకారులు కలిసిన వర్గపు సంఖ్యగా సందర్భానికి తగిన వ్యక్తివాచక రూపం.
- source_word: הַכֹּל
  choice: వారందరూ
  rationale: ముందు పేర్కొన్న సమూహాలను సమగ్రంగా తిరిగి సూచిస్తుంది.
- source_word: גִּבּוֹרִים
  choice: బలవంతులు
  rationale: శారీరక లేదా సైనిక సామర్థ్యంగల బలమైన పురుషులను సూచించే మూలపద భావాన్ని నిలుపుతుంది.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: యుద్ధం చేయగలవారు
  rationale: అక్షరార్థంగా ‘యుద్ధం చేసేవారు’; ఈ సందర్భంలో యుద్ధ సేవకు సామర్థ్యమున్నవారు అనే ప్రయోగార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְבִיאֵם
  choice: వారిని తీసుకెళ్లాడు
  rationale: ‘వారిని తీసుకువచ్చాడు/తీసుకెళ్లాడు’ అనే మూలక్రియను, బబులోనుకు తరలించిన సందర్భంలో తెలుగు దృష్టికోణానికి సహజంగా అందిస్తుంది.
- source_word: גּוֹלָה
  choice: చెరగా
  rationale: బలవంతపు దేశాంతరవాస స్థితిని సంక్షిప్తంగా, సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: בָּבֶלָה
  choice: బబులోనుకు
  rationale: దిశను సూచించే హెబ్రీయ ప్రత్యయాన్ని తెలుగులో గమ్యార్థక విభక్తితో వ్యక్తం చేస్తుంది.
