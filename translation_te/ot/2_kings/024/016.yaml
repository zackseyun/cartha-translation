translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని జాబితా నిర్మాణాన్ని డాష్‌లతో నిలిపి, చివరి వివరణాత్మక భాగాన్ని తెలుగు సహజత్వం కోసం ప్రత్యేక వాక్యంగా ఉంచాం. మూలంలోని వృత్తిపదాల అనిశ్చితిని పాదసూచనలో నిలిపాం.
