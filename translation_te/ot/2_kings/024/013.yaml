id: 2KI.24.13
reference: 2 Kings 24:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: te
  text: అతడు అక్కడి నుండి యెహోవా మందిరంలోని సంపదలన్నిటినీ, రాజభవనంలోని సంపదలనూ తీసుకుపోయాడు[a]. ఇశ్రాయేలు రాజైన సొలొమోను యెహోవా ఆలయంలో చేసిన బంగారు పాత్రలన్నిటినీ అతడు ముక్కలుగా నరికివేశాడు[b]. యెహోవా చెప్పినట్లే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అక్కడి నుండి బయటకు తీసుకువచ్చాడు’ లేదా ‘అక్కడి నుండి తీసివేశాడు.’
    reason: lexical_alternative
  - marker: b
    text: వచనపు మొదటి భాగంలో అక్షరార్థంగా ‘యెహోవా గృహం’ అనే హీబ్రూ పదబంధం ఉంది; ఇక్కడ ‘యెహోవా ఆలయం’ అని అనువదించినది ఆలయ కట్టడం లేదా పవిత్రస్థలాన్ని మరింత ప్రత్యేకంగా సూచించగల వేరొక హీబ్రూ పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: అక్కడి నుండి ... తీసుకుపోయాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థక భావం అక్కడి నుంచి వస్తువులను బయటకు తీసివేయడాన్ని సూచిస్తుంది; దోపిడీ సందర్భంలో ‘తీసుకుపోయాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: אוֹצְרוֹת
  choice: ధననిధులు
  rationale: ఇక్కడ నిల్వగదులకన్నా వాటిలోని విలువైన సంపదే తీసుకుపోయిన వస్తువుగా ఉంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘యెహోవా గృహం’ అనే మూలరూప భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, తరువాతి הֵיכַל కోసం వేరే పదాన్ని ఉంచుతుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థంగా ‘రాజు ఇల్లు’; సందర్భంలో రాజప్రాసాదాన్ని సూచిస్తున్నందున ‘రాజభవనం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיְקַצֵּץ
  choice: ముక్కలుగా నరికివేశాడు
  rationale: పియేల్ రూపం కోసి ముక్కలు చేయడాన్ని బలంగా సూచిస్తుంది; లోహపు పాత్రలను ధ్వంసం చేసిన భౌతిక చర్యను ఈ పదబంధం నిలుపుతుంది.
- source_word: כְּלֵי הַזָּהָב
  choice: బంగారు పాత్రలు
  rationale: ఆలయ సందర్భంలో כְּלִי సూచించే ఉపకరణాలు లేదా వస్తువులకు ‘పాత్రలు’ సహజమైన, తగిన ఎంపిక.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: సొలొమోను ముందుగా చేసిన కార్యాన్ని మూలంలోని సాధారణ క్రియకు దగ్గరగా అనువదిస్తుంది; అతడే స్వయంగా చేశాడా, చేయించాడా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: בְּהֵיכַל יְהוָה
  choice: యెహోవా ఆలయంలో
  rationale: הֵיכַל ఆలయ కట్టడం లేదా పవిత్రస్థలాన్ని సూచిస్తుంది; ముందున్న בֵּית కు వాడిన ‘మందిరం’ నుండి పదభేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా చెప్పినట్లే ఇది జరిగింది
  rationale: ముందుగా పలికిన యెహోవా మాట నెరవేరిందనే భావాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో అందిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: సొలొమోను పాత్రలను ‘చేసిన’ విధానం
  choice: చేసిన
  alternative: చేయించిన
  rationale: עָשָׂה స్వయంగా తయారు చేయడం లేదా రాజాధికారంతో తయారు చేయించడం రెండింటికీ సందర్భానుసారంగా వర్తించవచ్చు; మూలంలోని అస్పష్టతను ‘చేసిన’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘మందిరం/ఆలయం’ అనే భేదంతో בֵּית మరియు הֵיכַל మధ్యనున్న మూలపద భేదం కనిపించేలా ఉంచబడింది; ‘రాజభవనం’ సందర్భానుకూల సహజ తెలుగు.
