source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב יְהוֹיָקִ֖ים עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: te
  text: యెహోయాకీము తన పితరులతో నిద్రించాడు[a]. అతని కుమారుడైన యెహోయాకీను అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానువాదంగా, ‘చనిపోయాడు.’ హీబ్రూలో అక్షరార్థంగా ‘తన పితరులతో నిద్రించాడు’ అని ఉంది; ఇది రాజు మరణాన్ని సూచించే సాధారణ సూత్రప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ‘తన పితరులతో కూడ’ అనే పదబంధంతో కలిసి ఇది రాజు మరణాన్ని సూచించే స్థిరమైన హీబ్రూ ప్రయోగం. ‘చనిపోయాడు’ అని భావాన్ని మాత్రమే చెప్పకుండా, మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: మూలంలోని ‘తన తండ్రులతో’ అనే స్థిరమైన రాజవంశీయ మరణసూత్రాన్ని సన్నిహితంగా ప్రతిబింబిస్తుంది. ఇక్కడ ‘పితరులు’ అంటే పూర్వీకులు.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఇది కేవలం పరిపాలన కొనసాగిందని కాక, సింహాసనాన్ని అధిష్ఠించిన సందర్భాన్ని సూచిస్తుంది; అందువల్ల ‘పాలించాడు’ కంటే ‘రాజయ్యాడు’ సముచితం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడైన
  rationale: కుమారుని సంబంధాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వ సందర్భంలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: యెహోయాకీము / యెహోయాకీను
  rationale: హీబ్రూ వ్యక్తినామాలకు దగ్గరగా ఉండే, తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణ రూపాలు.
theological_decisions:
- issue: రాజు మరణాన్ని సూచించే హీబ్రూ సూత్రప్రయోగాన్ని, సమాధి వివరాలను అధికంగా చేర్చకుండా అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘తన పితరులతో కూడ నిద్రించాడు’ అనే ప్రయోగాన్ని నిలుపడం.
  alternative: ‘చనిపోయాడు’ అని భావానువాదం చేయడం, లేదా ‘చనిపోయి తన పితరులతో సమాధి చేయబడ్డాడు’ అని విస్తరించడం.
  rationale: హీబ్రూ పాఠ్యం సంప్రదాయ మరణసూత్రాన్ని ఉపయోగిస్తుంది గాని, ఈ వాక్యంలో సమాధి చేయబడినట్లు స్పష్టంగా చెప్పదు. మూలరూపకాన్ని నిలుపడం ఆ అస్పష్టతను కాపాడి, లేని సమాధి వివరాన్ని చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రాజవంశీయ మరణసూత్రాన్ని ఉంచుతూ, పాదసూచికలో దాని భావాన్ని సాధారణ పాఠకునికి స్పష్టం చేసింది.
