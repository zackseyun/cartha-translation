- from: నిశ్చయంగా, ఇది యెహోవా ఆజ్ఞ ప్రకారమే యూదా మీదికి వచ్చింది. మనష్షే చేసిన పాపాలన్నిటినిబట్టి వారిని తన ముఖం ఎదుటనుండి[a] తొలగించడానికే ఇలా జరిగింది.
  to: 'నిశ్చయంగా, యెహోవా ఆజ్ఞ ప్రకారమే ఇది యూదాకు వచ్చింది: మనష్షే పాపాలవల్ల, అతడు చేసినదంతటి ప్రకారం, వారిని తన ముఖం ఎదుటనుండి తొలగించడానికి.'
