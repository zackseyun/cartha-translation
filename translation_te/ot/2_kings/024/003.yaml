  revision_rationale: మనష్షే పాపాల కారణాన్ని మరియు “అతడు చేసినదంతటి ప్రకారం” అనే ప్రత్యేకమైన చివరి పదబంధాన్ని విడిగా ఉంచాం. సందర్భానుసారంగా అవ్యక్త కర్మ అయిన యూదా ప్రజలను “వారిని” అని స్పష్టం చేశాం; దైవసన్నిధి నుండి తొలగింపును సూచించే మూల దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో కాపాడాం.
