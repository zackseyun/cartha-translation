source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: te
  text: 'నిశ్చయంగా, యెహోవా ఆజ్ఞ ప్రకారమే ఇది యూదాకు వచ్చింది: మనష్షే పాపాలవల్ల, అతడు చేసినదంతటి ప్రకారం, వారిని తన ముఖం ఎదుటనుండి తొలగించడానికి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఈ పదం పరిమితిని కాక, ముందున్న తీర్పు యెహోవా ఆజ్ఞవల్లనే వచ్చిందనే విషయాన్ని నొక్కి చెబుతుంది.
- source_word: עַל פִּי
  choice: ఆజ్ఞ ప్రకారమే
  rationale: అక్షరార్థంగా ‘నోటి ప్రకారం’ అనే ఈ హీబ్రూ నుడికారం ఒకరి ఆజ్ఞ లేదా మాటకు అనుగుణంగా జరిగిన చర్యను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הָיְתָה בִּיהוּדָה
  choice: ఇది ... యూదా మీదికి వచ్చింది
  rationale: హీబ్రూలో సంఘటన స్పష్టంగా పేర్కొనబడకపోయినా, సందర్భంలో ముందుగా వివరించిన తీర్పును ‘ఇది’ సూచిస్తుంది; తెలుగు సహజత్వం కోసం ‘యూదా మీదికి వచ్చింది’ అని ఇచ్చాం.
- source_word: לְהָסִיר
  choice: తొలగించడానికి
  rationale: సూర్ ధాతువు హిఫిల్ రూపం ఇక్కడ ఒకరిని దూరం చేయడం లేదా తొలగించడం అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: מֵעַל פָּנָיו
  choice: తన ముఖం ఎదుటనుండి
  rationale: దేవుని ముఖం ఎదుటనుండి బహిష్కరించబడే హీబ్రూ దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; సహజమైన భావానువాదాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: మనష్షే చేసిన పాపాలన్నిటినిబట్టి
  rationale: బెత్ ఉపసర్గ ఇక్కడ కారణాన్ని సూచిస్తుంది. ‘పాపాలు’ సమష్టిగా మనష్షే చేసిన అపరాధాలను తెలియజేస్తుంది; తరువాతి ‘అతడు చేసినదంతా’ అనే భావంతో తెలుగు వాక్యంలో సహజంగా అనుసంధానించాం.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: చేసిన ... అన్నిటినిబట్టి
  rationale: అతడు చేసిన కార్యాల సమగ్రతకు అనుగుణంగా తీర్పు వచ్చిందనే భావాన్ని తెలుగులో సహజమైన సమగ్ర నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: తీర్పును సూచించే అవ్యక్త కర్త మరియు తొలగించబడేవారిని సూచించే అవ్యక్త కర్మ
  choice: ముందటి సందర్భంలోని తీర్పును ‘ఇది’ అని, తొలగించబడే యూదా ప్రజలను ‘వారిని’ అని స్పష్టీకరించాం.
  alternative: హీబ్రూ వాక్యంలోని అవ్యక్తతను మరింత అక్షరానుసారంగా ఉంచి, ‘యూదాలో జరిగింది—తన ముఖం ఎదుటనుండి తొలగించడానికి’ అని కర్మను చెప్పకుండా అనువదించవచ్చు.
  rationale: మూలపాఠ్యం కర్మను ప్రత్యక్షంగా పేర్కొనదు. అయితే సందర్భం యూదా/యెరూషలేము ప్రజల తొలగింపును సూచిస్తుంది; తెలుగు వాక్యం సంపూర్ణంగా, స్పష్టంగా ఉండేందుకు ‘వారిని’ చేర్చడం సందర్భోచితం, కొత్త సిద్ధాంతార్థాన్ని జోడించదు.
- issue: దైవసన్నిధిని సూచించే మానవరూపక భాష
  choice: ‘తన ముఖం ఎదుటనుండి’ అనే స్పష్టమైన దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘తన సన్నిధి నుండి’ అని భావానువాదం చేయవచ్చు.
  rationale: మూలంలోని ‘ముఖం’ అనే మానవరూపకాన్ని తొలగించకుండా ఉంచడం యెహోవా సమక్షం నుండి బహిష్కరణ పొందే తీర్పు తీవ్రతను కాపాడుతుంది; సులభమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ‘ఆజ్ఞ ప్రకారమే’ మరియు ‘నిశ్చయంగా’ అనే పదాలు మూలంలోని కారణత్వం, ఉద్ఘాటనను నిలుపుతాయి. ‘తన ముఖం ఎదుటనుండి’ కొంత అక్షరానుసారమైనప్పటికీ అర్థవంతంగా ఉండి హీబ్రూ దృశ్యరూపాన్ని కాపాడుతుంది.
