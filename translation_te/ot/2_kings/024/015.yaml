translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని ఉపయోగించాం. మూలంలోని రెండు సమాంతర క్రియాభావాలను అర్ధవిరామంతో నిలిపి, ‘చెరగా తీసుకెళ్లాడు’ అనే పునరుక్తి ద్వారా చెర ఇతివృత్తాన్ని స్పష్టంగా ఉంచాం. సందిగ్ధమైన రాజసభ పదవిని, దేశ ప్రముఖుల స్థితిని పాదసూచికల్లో ప్రత్యామ్నాయాలతో సంరక్షించాం.
