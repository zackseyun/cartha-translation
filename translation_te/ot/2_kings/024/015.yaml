  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּ֥גֶל אֶת יְהוֹיָכִ֖ין בָּבֶ֑לָ/ה וְ/אֶת אֵ֣ם הַ֠/מֶּלֶךְ וְ/אֶת נְשֵׁ֨י הַ/מֶּ֜לֶךְ וְ/אֶת סָרִיסָ֗י/ו וְ/אֵת֙ אולי הָ/אָ֔רֶץ הוֹלִ֛יךְ גּוֹלָ֥ה מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: te
  text: అతడు యెహోయాకీనును బబులోనుకు చెరగా తీసుకెళ్లాడు; రాజు తల్లిని[c], రాజు భార్యలను, అతని రాజసభ అధికారులను[a], దేశంలోని ప్రముఖులను[b] యెరూషలేము నుండి బబులోనుకు చెరగా తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని నపుంసకులను.’ హీబ్రూ పదం ప్రత్యేకంగా నపుంసకులను లేదా మరింత సాధారణంగా రాజసభ అధికారులను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేశంలోని శక్తిమంతులను’ లేదా ‘దేశంలోని ఉన్నతులను.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘రాజు తల్లి.’ సందర్భానుసారంగా ‘రాజమాత’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: చెరగా తీసుకెళ్లాడు
  rationale: గלה అనే క్రియ ఇక్కడ ఒకరిని స్వదేశం నుండి తొలగించి చెరకు పంపే causative భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం కదలికను, చెర స్థితిని రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּבֶלָה
  choice: బబులోనుకు
  rationale: దిశను సూచించే ה కారణంగా బబులోను వైపు జరిగిన కదలికను సహజమైన తెలుగులో ‘బబులోనుకు’ అని అనువదించాం.
- source_word: אֵם הַמֶּלֶךְ
  choice: రాజు తల్లి
  rationale: మూలంలోని కుటుంబ సంబంధాన్ని నేరుగా నిలుపుతుంది; దీనిని తప్పనిసరిగా అధికారిక బిరుదైన ‘రాజమాత’గా నిర్ణయించదు.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: రాజు భార్యలు
  rationale: మూలంలోని బహువచనాన్ని, ‘రాజు’ అనే పద పునరుక్తిని నిలుపుతుంది.
- source_word: סָרִיסָיו
  choice: అతని రాజసభ అధికారులు
  rationale: סָרִיס అనే పదం నపుంసకులను ప్రత్యేకంగా సూచించగలదు; రాజసభ సందర్భంలో అధికారులను సాధారణంగా కూడా సూచించగలదు. ప్రధాన పాఠంలో విధిని తెలిపే విస్తృత అర్థాన్ని ఎంచుకుని, ప్రత్యేక అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֵילֵי הָאָרֶץ
  choice: దేశంలోని ప్రముఖులు
  rationale: ఈ పదబంధం దేశంలోని శక్తిమంతులు, ప్రభావశీలులు లేదా ఉన్నతస్థాయి వ్యక్తులను సూచిస్తుంది. ‘ప్రముఖులు’ సామాజిక ప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: చెరగా తీసుకెళ్లాడు
  rationale: వ్యక్తులను చెరపట్టినవారిగా వెళ్లేలా చేయడం అనే సంయుక్త భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: యెరూషలేము నుండి బబులోనుకు
  rationale: చెర ప్రయాణపు ఆరంభస్థలాన్ని, గమ్యస్థానాన్ని స్పష్టంగా నిలుపుతుంది.
