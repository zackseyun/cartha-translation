id: 2KI.1.14
reference: 2 Kings 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: te
  text: ఇదిగో, ఆకాశం నుండి అగ్ని దిగి వచ్చి, మొదటి ఇద్దరు యాభైమంది దళాధిపతులను, వారివారి యాభైమంది దళాలను దహించివేసింది. అయితే ఇప్పుడు నా ప్రాణం నీ దృష్టిలో విలువైనదిగా ఉండనివ్వు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: స్పష్టంగా జరిగిన విషయంపై గట్టిగా దృష్టి నిలిపే హీబ్రూ సూచనార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి అగ్ని దిగి వచ్చి
  rationale: అగ్ని పై నుండి కిందికి రావడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ మూలంలోని క్రియ, కర్త, ఆరంభస్థానాన్ని కాపాడుతుంది.
- source_word: וַתֹּאכַל
  choice: దహించివేసింది
  rationale: అగ్ని కర్తగా ఉన్నప్పుడు అక్షరార్థమైన ‘తినివేసింది’ కంటే సంపూర్ణ నాశన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: ముందుగా వచ్చిన ఇద్దరు యాభైమంది సైనికుల అధిపతులను
  rationale: శׂר అనే సైనిక అధికారపదాన్ని ‘అధిపతి’గా, యాభైమంది దళంపై అధికారాన్ని స్పష్టంగా తెలియజేసేలా అనువదించింది; הָרִאשֹׁנִים కథలో ఇంతకు ముందు వచ్చిన ఇద్దరిని సూచిస్తుంది.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: వారి వారి యాభైమందిని
  rationale: అక్షరార్థంగా ‘వారి యాభైలు’ అనే సైనిక దళాల భావాన్ని, ప్రతి అధిపతికి చెందిన యాభైమందిని సూచించే సహజ తెలుగులో ఇస్తుంది.
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: మునుపటి దళాలకు జరిగిన తీర్పు నుండి వక్త తన ప్రాణం కోసం చేసే విజ్ఞప్తికి మారే వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: నా ప్రాణం నీ దృష్టిలో విలువైనదిగా ఉండనివ్వు
  rationale: יקר లోని విలువైనదిగా ఎంచడం అనే భావాన్ని, נֶפֶשׁ ఇక్కడ సూచించే జీవప్రాణాన్ని, ‘నీ దృష్టిలో’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రాణరక్షణ విజ్ఞప్తిలో נֶפֶשׁ అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ సందర్భంలో వక్త ముందటి దళాలవలె చంపబడకుండా తన జీవితం కాపాడమని వేడుకుంటున్నాడు. ‘ప్రాణం’ ఆ నిర్దిష్ట సందర్భార్థాన్ని తెలియజేస్తుంది; మూలం అవసరం చేయని శరీర–ఆత్మ ద్వైతార్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే కథనశైలి. సైనిక నిర్మాణాన్ని వివరించేందుకు ‘యాభైమంది సైనికుల అధిపతులు’ అని విప్పి చెప్పబడింది.
