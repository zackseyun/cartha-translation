revisions:
- from: ఇదిగో, ఆకాశం నుండి అగ్ని దిగి వచ్చి, ముందుగా వచ్చిన ఇద్దరు యాభైమంది సైనికుల అధిపతులను, వారి వారి యాభైమందిని దహించివేసింది. అయితే ఇప్పుడు నా ప్రాణం నీ దృష్టిలో విలువైనదిగా ఉండనివ్వు.
  to: ఇదిగో, ఆకాశం నుండి అగ్ని దిగి వచ్చి, మొదటి ఇద్దరు యాభైమంది దళాధిపతులను, వారివారి యాభైమంది దళాలను దహించివేసింది. అయితే ఇప్పుడు నా ప్రాణం నీ దృష్టిలో విలువైనదిగా ఉండనివ్వు.
  rationale: The revision removes the added arrival-focused nuance in ‘ముందుగా వచ్చిన’ and renders the two ‘fifties’ as their respective fifty-person military units. It preserves the emphatic opening, destructive force of the fire, contrastive plea, and concrete sense of נפשׁ as ‘life.’
