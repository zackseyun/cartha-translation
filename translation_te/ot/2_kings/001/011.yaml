id: 2KI.1.11
reference: 2 Kings 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֜שָׁב וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֥ים אַחֵ֖ר וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֨עַן֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָ/אֱלֹהִ֔ים כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ מְהֵרָ֥ה רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: te
  text: 'అతడు మళ్లీ ఏలీయా దగ్గరికి మరొక యాభైమందికి అధిపతిని అతని యాభైమందితో పంపాడు. ఆ అధిపతి ఏలీయాతో ఇలా అన్నాడు: “దేవుని మనిషీ, రాజు ఇలా చెబుతున్నాడు: ‘త్వరగా దిగిరా[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “త్వరగా దిగు.” హీబ్రూ క్రియకు కేవలం “దిగు” అనే అర్థం ఉంది; కింద ఉన్న రాజు ప్రతినిధి పైనున్న ఏలీయాతో మాట్లాడుతున్నందున “దిగిరా” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: మళ్లీ ... పంపాడు
  rationale: ఈ కథన సందర్భంలో וַיָּשָׁב తరువాతి క్రియతో కలిసి చర్య పునరావృతమైందని సూచిస్తుంది; శారీరకంగా తిరిగి రావడాన్ని కాదు.
- source_word: שַׂר חֲמִשִּׁים
  choice: యాభైమంది అధిపతి
  rationale: యాభైమంది సైనికుల విభాగానికి నాయకుడైన అధికారిని సూచించే బిరుదు; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַחֲמִשָּׁיו
  choice: అతని యాభైమందిని
  rationale: అధిపతి ఆధీనంలోని యాభైమందిని సూచిస్తుంది. పంపడం అనే క్రియకు అనుగుణంగా తెలుగులో కర్మరూపం సహజం.
- source_word: וַיַּעַן וַיְדַבֵּר אֵלָיו
  choice: ఆ అధిపతి ఏలీయాతో ... అన్నాడు
  rationale: హీబ్రూ కథన జంటపదాన్ని పదేపదే అనువదిస్తే తెలుగులో కృత్రిమంగా ఉంటుంది; మాట్లాడిన వ్యక్తిని స్పష్టంచేస్తూ సహజ కథన రూపం వాడబడింది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషీ
  rationale: ఏలీయాకు ఉపయోగించిన గుర్తింపు బిరుదును సంబోధన రూపంలో నేరుగా నిలుపుతుంది.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: అని రాజు ఆజ్ఞాపిస్తున్నాడు
  rationale: ఇది రాజదూత పలికే అధికారిక సందేశ సూత్రం. సందర్భంలోని రాజాజ్ఞ స్వరాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְהֵרָה
  choice: త్వరగా
  rationale: ఆజ్ఞలోని అత్యవసరతను సరళంగా తెలియజేస్తుంది.
- source_word: רֵדָה
  choice: దిగిరా
  rationale: మూల క్రియ ‘దిగు’ అని మాత్రమే సూచించినా, కింద ఉన్న ప్రతినిధి పైనున్న ఏలీయాతో మాట్లాడుతున్నందున తెలుగులో వక్తవైపు కదలికను సూచించే ‘దిగిరా’ సహజం; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలి ఉపయోగించబడింది. సైనిక బిరుదు అర్థం స్పష్టంగా ఉండేలా ‘యాభైమంది అధిపతి’ అని, రాజు మాటలోని అధికార స్వరాన్ని సహజంగా నిలిపేలా ‘ఆజ్ఞాపిస్తున్నాడు’ అని అనువదించబడింది.
