revisions:
- from: అతడు మళ్లీ ఏలీయా దగ్గరికి మరొక యాభైమంది అధిపతిని, అతని యాభైమందిని పంపాడు. ఆ అధిపతి ఏలీయాతో, “దేవుని మనిషీ, ‘త్వరగా దిగిరా[a]’ అని రాజు ఆజ్ఞాపిస్తున్నాడు” అన్నాడు.
  to: 'అతడు మళ్లీ ఏలీయా దగ్గరికి మరొక యాభైమందికి అధిపతిని అతని యాభైమందితో పంపాడు. ఆ అధిపతి ఏలీయాతో ఇలా అన్నాడు: “దేవుని మనిషీ, రాజు ఇలా చెబుతున్నాడు: ‘త్వరగా దిగిరా[a].’”'
  rationale: The revision restores the formal “Thus says the king” messenger formula, clarifies that the captain was sent with the fifty men under him, and retains the draft’s defensible directional rendering of the command together with its lexical footnote.
  reviewer_model: gpt-5.6-terra
