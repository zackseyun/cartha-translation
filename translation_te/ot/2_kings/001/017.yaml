id: 2KI.1.17
reference: 2 Kings 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: te
  text: అతడు ఏలీయా పలికిన యాహ్వే మాట ప్రకారం చనిపోయాడు. అతని స్థానంలో యెహోరాము రాజయ్యాడు[a]; ఇది యూదా రాజైన యెహోషాపాతు కుమారుడు యెహోరాము పాలన రెండవ సంవత్సరంలో జరిగింది, ఎందుకంటే అతనికి కుమారుడు లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని స్థానంలో యెహోరాము పాలించాడు.’ హీబ్రూ క్రియ సాధారణ కథన రూపంలో ఉంది; ‘రాజయ్యాడు’ సింహాసనారోహణను నొక్కిచెబుతుండగా, ‘పాలించాడు’ మరింత అక్షరార్థ ప్రత్యామ్నాయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: కాబట్టి అతడు ... చనిపోయాడు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం; ముందరి ప్రవచన ఫలితాన్ని సందర్భానుసారంగా ‘కాబట్టి’ సూచిస్తుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యాహ్వే మాట ప్రకారం
  rationale: כִּדְבַר అనేది పలికిన మాటకు అనుగుణంగా సంఘటన జరిగిందని సూచిస్తుంది; యెహోవా నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: ఏలీయా పలికిన
  rationale: సాపేక్ష వాక్యం ముందున్న ‘మాట’ను విశేషిస్తుంది. ఏలీయా దానిని పలికాడనే మూల వాక్య నిర్మాణాన్ని అలాగే ఉంచాం; ‘ఏలీయా ద్వారా’ అని విస్తరించలేదు.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: అతని స్థానంలో యెహోరాము రాజయ్యాడు
  rationale: ఈ సందర్భంలో מלך సింహాసనారోహణను సూచిస్తుంది; תַּחְתָּיו ను ‘అతని స్థానంలో’గా స్పష్టంగా అందించాం.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: యెహోరాము పాలనలో రెండో సంవత్సరం
  rationale: ఇది రాజ్యపాలనా సంవత్సరాన్ని సూచించే కాలనిర్ణయ సూత్రం; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘పాలనలో’ చేర్చాం.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు కుమారుడు
  rationale: దక్షిణ రాజ్యానికి చెందిన మరో యెహోరామును గుర్తించే అన్వయాన్ని స్పష్టంగా ఉంచాం.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: అతనికి కుమారుడు లేకపోవడంతో
  rationale: כִּי ఇక్కడ వారసత్వానికి కారణాన్ని తెలియజేస్తుంది. చివర ఉంచితే ‘అతడు’ ఏ యెహోరామును సూచిస్తాడో తెలుగులో అయోమయం కలగవచ్చు కాబట్టి, అహజ్యా మరణం తరువాత వెంటనే ఉంచాం; వ్యక్తి పేరును మూలంలో లేనందున చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నేరుగా ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: ఏలీయా పలికిన మాట మరియు యాహ్వే మాట మధ్య సంబంధం
  choice: ఏలీయా పలికిన యాహ్వే మాట
  alternative: యాహ్వే ఏలీయా ద్వారా పలికిన మాట
  rationale: హీబ్రూ వ్యాకరణంలో ఏలీయానే ‘పలికిన’ క్రియకు కర్త. దేవుడు ఏలీయా ద్వారా పలికాడనే భావం సందర్భానికి సరిపోవచ్చుగానీ, దానిని వాక్య నిర్మాణంలోకి అదనంగా దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడాం. ఇద్దరు యెహోరాముల మధ్య తేడా స్పష్టంగా ఉండేందుకు కాలనిర్ణయ సమాచారాన్ని ప్రత్యేక వాక్యంగా ఇచ్చాం. మూలంలోని కారణ సంబంధాన్ని కాపాడుతూ తెలుగు సర్వనామ అయోమయాన్ని తగ్గించాం.
