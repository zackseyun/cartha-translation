language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו אִ֚ישׁ בַּ֣עַל שֵׂעָ֔ר וְ/אֵז֥וֹר ע֖וֹר אָז֣וּר בְּ/מָתְנָ֑י/ו וַ/יֹּאמַ֕ר אֵלִיָּ֥ה הַ/תִּשְׁבִּ֖י הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: te
  text: వారు అతనితో, “అతడు రోమాలు గల మనిషి[a]; నడుమున తోలు పట్టా కట్టుకొని ఉన్నాడు” అన్నారు. అప్పుడు అతడు, “అతడే తిష్బీయుడైన ఏలీయా” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెంట్రుకల వస్త్రం ధరించిన మనిషి.” హీబ్రూ పదబంధం అక్షరార్థంగా “రోమాల యజమాని/రోమాలు కలవాడు” అని ఉంది; అది రోమాలు గల మనిషినిగానీ, వెంట్రుకల వస్త్రం ధరించినవానినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בַּעַל שֵׂעָר
  choice: రోమాలతో నిండిన మనిషి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘వెంట్రుకలకు అధిపతి/వెంట్రుకలు గల మనిషి’ అని ఉంటుంది. ప్రధాన పాఠ్యంలో శరీర లక్షణాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపి, వెంట్రుకల వస్త్రం ధరించినవాడనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְאֵזוֹר עוֹר אָזוּר בְּמָתְנָיו
  choice: నడుముకు తోలు పట్టా కట్టుకొని ఉన్నాడు
  rationale: אֵזוֹר అనేది నడుము పట్టా; עוֹר దాని పదార్థం తోలు అని తెలుపుతుంది; אָזוּר దానిని నడుముకు కట్టుకొని ఉండడాన్ని సూచిస్తుంది. ఈ అనువాదం వివరాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: తిష్బీయుడైన ఏలీయా
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, הַתִּשְׁבִּי అనే ప్రాంతీయ గుర్తింపును ‘తిష్బీయుడు’గా నిలిపాం.
- source_word: הוּא
  choice: అతడు ... ఏలీయానే
  rationale: వర్ణన ఆధారంగా వ్యక్తిని నిర్ధారిస్తున్న బలాన్ని తెలుగు నిశ్చయార్థక ప్రత్యయం ‘-ఏ’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని בַּעַל שֵׂעָר పదబంధపు నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా పరిరక్షించాం.
