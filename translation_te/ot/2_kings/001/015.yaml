    reason: lexical_alternative
  revision_rationale: The text is retained except for the more register-neutral “రాజు వద్దకు.” The footnote is revised to distinguish the Hebrew’s literal “from before his presence” formulation from its idiomatic sense, while avoiding unnatural Telugu phrasing as the explanation itself.
