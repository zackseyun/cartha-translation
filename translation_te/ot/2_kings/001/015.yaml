- from: అప్పుడు యాహ్వే దూత ఏలీయాతో, “అతనితో కలిసి దిగిపో; అతనికి భయపడకు[a]” అని చెప్పాడు. అప్పుడు ఏలీయా లేచి, అతనితో కలిసి రాజు దగ్గరికి దిగిపోయాడు.
