id: 2KI.1.15
reference: 2 Kings 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: te
  text: అప్పుడు యాహ్వే దూత ఏలీయాతో, “అతనితో కలిసి దిగిపో; అతనికి భయపడకు[a]” అని చెప్పాడు. అప్పుడు ఏలీయా లేచి, అతనితో కలిసి రాజు వద్దకు దిగిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని సమక్షం నుండి భయపడకు”; అంటే, అతని సమక్షం కారణంగా భయపడకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఈ దైవిక ఆజ్ఞ సందర్భంలో ‘యాహ్వే దూత’ సహజంగా ఉండి, మూలంలోని పదబంధపు సంక్షిప్తతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: רֵד אֹתוֹ
  choice: అతనితో కలిసి దిగిపో
  rationale: ירדతో వచ్చిన אֹתוֹ ఇక్కడ గమ్యాన్ని కాకుండా తోడుగా వెళ్లడాన్ని సూచిస్తుంది. ‘అతనితో కలిసి దిగిపో’ ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַל־תִּירָא מִפָּנָיו
  choice: అతనికి భయపడకు
  rationale: మూలంలోని ‘అతని ముఖం/సన్నిధి నుండి భయపడకు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం ఇది; మూలంలోని రూపకాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: ఆజ్ఞకు ప్రతిస్పందనగా ఏలీయా లేవడాన్ని తెలిపే సాధారణ కథన క్రియగా అనువదించాం.
- source_word: וַיֵּרֶד אֹתוֹ אֶל־הַמֶּלֶךְ
  choice: అతనితో కలిసి రాజు దగ్గరికి దిగిపోయాడు
  rationale: తోడుగా దిగడం, దిగువకు కదలడం, రాజు వద్దకు చేరడం అనే మూడు అంశాలనూ సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: מַלְאַךְను దూతగా లేదా దేవదూతగా అనువదించడం
  choice: దూత
  alternative: దేవదూత
  rationale: ‘దూత’ అనే పదం మూలంలోని ‘సందేశవాహకుడు/దూత’ పరిధిని నిలుపుతుంది; సందర్భం అతడు యాహ్వేకు చెందిన దైవిక దూత అని తగినంత స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ఆజ్ఞలోని నేరుదనాన్ని, కదలికను, తోడుగా వెళ్లే భావాన్ని నిలిపాం.
