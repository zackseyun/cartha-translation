    rationale: Although the following words are a question and “asked” is natural Telugu, the Hebrew וַיֹּאמֶר is simply “and he said.” “ఇలా అన్నాడు” preserves the source wording while remaining idiomatic.
  revised_text: 'ఆ దూతలు అతని దగ్గరికి తిరిగి వచ్చారు. అతడు వారితో ఇలా అన్నాడు: “మీరెందుకు తిరిగి వచ్చారు?”[a]'
