  edition: WLC
  text: וַ/יָּשׁ֥וּבוּ הַ/מַּלְאָכִ֖ים אֵלָ֑י/ו וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מַה זֶּ֥ה שַׁבְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: te
  text: 'ఆ దూతలు అతని దగ్గరికి తిరిగి వచ్చారు. అతడు వారితో ఇలా అన్నాడు: “మీరెందుకు తిరిగి వచ్చారు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇదేమిటి—మీరు తిరిగి వచ్చారు?” ఇది “మీరెందుకు తిరిగి వచ్చారు?” అనే భావాన్నిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: తిరిగి వచ్చారు
  rationale: שוב ఇక్కడ పంపిన రాజు దగ్గరికి వెనక్కి రావడాన్ని సూచిస్తుంది; ‘తిరిగి వచ్చారు’ ఆధునిక తెలుగులో సహజంగా ఉండి దిశాభావాన్ని నిలుపుతుంది.
- source_word: הַמַּלְאָכִים
  choice: ఆ దూతలు
  rationale: ఈ సందర్భంలో מלאכים పరలోక దూతలు కాదు, రాజు పంపిన మానవ సందేశవాహకులు; ‘దూతలు’ సందర్భానుకూలమైన సంక్షిప్త పదం.
- source_word: אֵלָיו
  choice: అతని దగ్గరికి
  rationale: ఈ విభక్తి రాజువైపు కదలికను సూచిస్తుంది; తెలుగులో ‘అతని దగ్గరికి’ సహజంగా ఆ దిశను తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: అతడు వారితో ... అని అడిగాడు
  rationale: మూలంలో ‘చెప్పాడు’ అనే సాధారణ క్రియ ఉన్నా, తరువాతిది ప్రత్యక్ష ప్రశ్న కాబట్టి సహజమైన తెలుగులో ‘అడిగాడు’ అని కార్యాన్ని స్పష్టంగా వ్యక్తం చేయడం ఉత్తమ సమానార్థక అనువాదం.
- source_word: מַה זֶּה
  choice: ఎందుకు
  rationale: అక్షరార్థంగా ‘ఇదేమిటి?’ అయిన ఈ హీబ్రూ ప్రయోగం ఇక్కడ వారి తిరుగు కారణాన్ని ప్రశ్నిస్తుంది; ‘ఎందుకు’ దాని సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: שַׁבְתֶּם
  choice: తిరిగి వచ్చారు
  rationale: שוב యొక్క ద్వితీయ పురుష బహువచన రూపం; తెలుగులో గౌరవ/బహువచన సంబోధనకు ‘వచ్చారు’ సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘దూతలు’ అనే పదం సందర్భం వల్ల మానవ సందేశవాహకులనే సూచిస్తుంది. పాదసూచిక గుర్తును ప్రశ్న అనంతరం ఉంచి మూలంలోని నుడికారాన్ని నమోదు చేశాం.
