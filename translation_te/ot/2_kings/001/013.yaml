source:
  edition: WLC
  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: te
  text: 'రాజు మళ్లీ యాభైమందికి అధిపతియైన మూడవ అధికారిని, అతని యాభైమందితో కూడ పంపించాడు. అతడు పైకి వెళ్లి ఏలీయా దగ్గరికి వచ్చాడు. యాభైమందికి అధిపతియైన ఆ మూడవ అధికారి ఏలీయా ఎదుట మోకాళ్లపై వంగి, అతన్ని వేడుకుంటూ ఇలా అన్నాడు: “దేవుని మనిషీ, దయచేసి నా ప్రాణమూ, నీ సేవకులైన ఈ యాభైమంది ప్రాణాలూ నీ దృష్టికి విలువైనవిగా ఉండనివ్వు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ప్రాణమూ ... ప్రాణాలూ” అనే చోట “నా జీవితమూ ... జీవితాలూ” అని కూడా అనువదించవచ్చు. హెబ్రీలోని నెఫెష్ అనే పదం సందర్భాన్ని బట్టి ప్రాణం, జీవితం, వ్యక్తి, లేదా ఆత్మ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: మళ్లీ
  rationale: ఈ కథన సందర్భంలో రాజు అదే చర్యను మరొకసారి చేయడాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘తిరిగి’ కంటే ‘మళ్లీ’ సహజంగా పునరావృత భావాన్ని అందిస్తుంది.
- source_word: שַׂר חֲמִשִּׁים
  choice: యాభైమందికి అధిపతియైన అధికారి
  rationale: సైనిక విభాగంలోని యాభైమందిపై అధికారాన్ని తెలిపే హోదా. ఆధునిక పాఠకుడికి స్పష్టంగా ఉండేందుకు ‘అధికారి’ని ఉపయోగించి, యాభైమందితో సంబంధాన్ని నిలిపాం.
- source_word: שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: మూడవ అధికారిని, అతని యాభైమందితో కూడ
  rationale: ఇది వరుసలో మూడవ అధికారి అని, అతనితో అతని యాభైమంది ఉన్నారని హెబ్రీ నిర్మాణం తెలుపుతుంది.
- source_word: וַיַּעַל וַיָּבֹא
  choice: పైకి వెళ్లి ... దగ్గరికి వచ్చాడు
  rationale: రెండు హెబ్రీ క్రియల కదలికను నిలుపుతూ, తెలుగులో సహజంగా గమ్యాన్ని సందర్భానుసారం ఏలీయాతో అనుసంధానిస్తుంది.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: మోకాళ్లపై వంగి
  rationale: శరీర భంగిమను, వినయపూర్వక సమర్పణను వ్యక్తం చేస్తుంది; ‘పడిపోయి’ అని అనవసర తీవ్రతను చేర్చదు.
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: అతన్ని వేడుకుంటూ
  rationale: హిత్పయేల్ రూపంలోని ఆర్తమైన విన్నప భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషీ
  rationale: ప్రవక్తకు వాడే మూలపాఠంలోని బిరుదును, సంబోధన రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: దయచేసి ... నీ దృష్టికి విలువైనవిగా ఉండనివ్వు
  rationale: יקר అనే ‘విలువైనది/అమూల్యమైనది కావడం’ రూపకాన్ని ‘కాపాడు’ అని సారాంశీకరించకుండా నిలుపుతుంది.
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: నా ప్రాణమూ ... ప్రాణాలూ
  rationale: తక్షణ ప్రాణాపాయ సందర్భంలో נֶפֶשׁ వ్యక్తుల జీవప్రాణాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రాణం/ప్రాణాలు’ సహజంగా సందర్భార్థాన్ని అందిస్తాయి.
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: నీ సేవకులైన ఈ యాభైమంది
  rationale: వారు సంబోధించబడుతున్న ఏలీయా ఎదుట తమను సేవకులుగా వినయంగా పేర్కొంటున్న భావాన్ని, యాభైమంది అనే సంఖ్యను నిలుపుతుంది.
theological_decisions:
- issue: ప్రాణాపాయ కథనంలో נֶפֶשׁ అనువాదం
  choice: ప్రాణం/ప్రాణాలు
  alternative: ఆత్మ/ఆత్మలు
  rationale: ఇక్కడ అధికారి తనకూ తన మనుషులకూ మరణం కలగకుండా చూడమని వేడుకుంటున్నాడు. ‘ఆత్మ’ అని అనువదిస్తే మూలపాఠం ఉద్దేశించని తరువాతి మానవశాస్త్ర సంబంధ భావనను చొప్పించే అవకాశం ఉంది; అయితే పదంలోని విస్తృత అర్థపరిధిని పాదటిప్పణిలో సూచించాం.
- issue: తִּיקַר ... בְּעֵינֶיךָ లోని విన్నపం
  choice: నీ దృష్టికి విలువైనవిగా ఉండనివ్వు
  alternative: మమ్మల్ని కాపాడు
  rationale: కాపాడమనే ఆచరణాత్మక ఉద్దేశం స్పష్టమైనా, మూలంలోని ‘విలువైనవి’ అనే రూపకాన్ని తొలగించకుండా ఉంచడం ద్వారా వాక్యంలోని ఉద్వేగాన్నీ విజ్ఞాపన స్వరాన్నీ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని పునరావృత హోదాను కొంతవరకు నిలుపుతూ, అతిగా బరువైన పదక్రమాన్ని నివారించాం. ‘దేవుని మనిషి’ అనే మూలబిరుదును సంప్రదాయపరంగా పరిచితమైన ‘దైవజనుడు’గా మార్చకుండా సూటిగా ఉంచాం.
