source:
  edition: WLC
  text: וַ/יַּעֲנֶ֣ה אֵלִיָּ֗הוּ וַ/יְדַבֵּר֮ אֶל שַׂ֣ר הַ/חֲמִשִּׁים֒ וְ/אִם אִ֤ישׁ אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: te
  text: ఏలీయా యాభైమందికి అధిపతికి జవాబిచ్చి, “అయితే నేను దేవుని మనిషినైతే, ఆకాశం నుండి అగ్ని దిగివచ్చి నిన్నూ నీ యాభైమందినీ దహించుగాక” అని అన్నాడు. అప్పుడు ఆకాశం నుండి అగ్ని దిగివచ్చి అతనినీ అతని యాభైమందినీ దహించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: యాభైమంది అధిపతి
  rationale: యాభైమంది సైనికులకు నాయకత్వం వహించే అధికారిని సూచించే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אִישׁ אֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తకు ఉపయోగించిన మూలభాషలోని స్థిరమైన బిరుదును వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నేరుగా నిలుపుతుంది.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి అగ్ని దిగివచ్చి
  rationale: అగ్ని పై నుండి దిగివచ్చే మూలపాఠ దృశ్యాన్ని స్పష్టంగా, సహజంగా కాపాడుతుంది.
- source_word: וְתֹאכַל
  choice: దహించుగాక
  rationale: అగ్ని ‘తినివేయడం’ అనే హీబ్రూ రూపకానికి సందర్భానుకూలమైన తెలుగు సమానార్థకాన్ని ఉపయోగిస్తూ, క్రియలోని ఆజ్ఞార్థక/ఆకాంక్షార్థక భావాన్ని నిలుపుతుంది.
- source_word: חֲמִשֶּׁיךָ
  choice: నీ యాభైమంది
  rationale: అధిపతి ఆధీనంలోని యాభైమంది సైనికులనే సూచిస్తుంది; మూలపాఠంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: וְאִם లోని అనుసంధాన భావం
  choice: అయితే నేను దేవుని మనిషినైతే
  alternative: నేను దేవుని మనిషినైతే
  rationale: ముందటి మాటకు ప్రతిస్పందనగా ఉన్న ‘మరి/అయితే’ భావాన్ని నిలుపుతూ, ఏలీయా తన స్థితిని సందేహిస్తున్నాడనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- issue: పరలోక అగ్ని గురించిన వాక్య స్వరూపం
  choice: దిగివచ్చి ... దహించుగాక
  alternative: దిగివస్తుంది ... దహిస్తుంది
  rationale: హీబ్రూ క్రియల సందర్భానుగుణ జస్సివ్ భావాన్ని నిలుపుతుంది; దీనిని కేవలం ముందస్తు ప్రకటనగానో వ్యక్తిగత శాపంగానో నిర్ణయించి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘అతణ్ణీ’ వంటి సహజ రూపాన్ని ఉపయోగించి, మూలపాఠంలోని పునరుక్తి మరియు గంభీరతను నిలుపుకున్నాం.
