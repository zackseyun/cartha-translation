- from: ఏలీయా ఆ యాభైమంది అధిపతికి జవాబిస్తూ, “అయితే నేను దేవుని మనిషినైతే, ఆకాశం నుండి అగ్ని దిగివచ్చి నిన్నూ నీ యాభైమందినీ దహించుగాక” అన్నాడు. అప్పుడు ఆకాశం నుండి అగ్ని దిగివచ్చి అతణ్ణీ అతని యాభైమందినీ దహించింది.
