  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మోయాబు’ రాజ్యాన్ని సూచిస్తున్నందున తెలుగులో స్త్రీలింగ ఏకవచన క్రియను ఉపయోగించాం.
