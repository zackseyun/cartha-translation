lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: తిరుగుబాటు చేసింది
  rationale: రాజకీయ సందర్భంలో פשע అనే క్రియ అధిపత్యంలో ఉన్న రాజ్యానికి ఎదురుతిరగడం లేదా దాని అధికారాన్ని నిరాకరించడం అనే భావాన్ని ఇస్తుంది. సాధారణ నైతిక అతిక్రమణకన్నా ఇక్కడి భూరాజకీయ భావాన్ని ఈ అనువాదం స్పష్టంగా తెలియజేస్తుంది.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: దేశం లేదా రాజ్యాన్ని సూచించే పేరుకు తెలుగులో సాధారణంగా ఉపయోగించే లిప్యంతరీకరణ.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు వ్యతిరేకంగా
  rationale: פשע క్రియతో వచ్చిన ב ఉపసర్గ ఇక్కడ ‘ఎవరికి వ్యతిరేకంగా తిరుగుబాటు చేయడం’ అనే సంబంధాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘ఇశ్రాయేలులో’ ఈ భావాన్ని తప్పుగా చూపుతుంది.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: తిరుగుబాటు జరిగిన కాలాన్ని సూచించే సహజమైన తెలుగు కాలసంబంధ పదం.
- source_word: מוֹת
  choice: మరణించిన
  rationale: అహాబు మరణం తరువాత అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో క్రియారూపంగా వ్యక్తం చేస్తుంది.
- source_word: אַחְאָב
  choice: అహాబు
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణంగా ఉపయోగించే లిప్యంతరీకరణ.
