source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: అహజ్యా చేసిన మిగిలిన కార్యాలు దేనిని గురించి అయితే—అవి ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[a] వ్రాయబడి ఉన్నాయి కదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’ అనేది రాజుల గ్రంథంలో ప్రస్తావించబడే రాజరిక వార్షిక చరిత్రా-నమోదుల ఆధారం; ఇది బైబిలులోని దినవృత్తాంతముల గ్రంథమే అని తప్పనిసరిగా అర్థం కాదు.
    reason: cultural_note
  - marker: b
    text: ‘వ్రాయబడి’ అనే దానికి ‘నమోదు చేయబడి’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘వ్రాయబడి’ అని ఉంది; ఇది రాజరిక చారిత్రక నమోదులను సూచించే సాధారణ సూత్రప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: ఇతర కార్యాలు
  rationale: రాజుల పాలన ముగింపు సూత్రంలో ఈ పదబంధం రాజు చేసిన మిగిలిన పనులు లేదా కార్యాలను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఇతర కార్యాలు’ స్పష్టంగా ఉంటుంది; ఆరంభ וְ ను విడిగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: אֲחַזְיָהוּ
  choice: అహజ్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: సాపేక్ష ఉపవాక్యాన్ని తెలుగులో సహజంగా సంక్షిప్తం చేస్తూ, ఆ కార్యాలు అహజ్యా చేసినవేనన్న మూలార్థాన్ని నిలుపుతుంది.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: రాసి ఉన్నాయి కదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను తెలుగులో సహజమైన ‘కదా?’ నిర్మాణంతో నిలిపాం. כְתוּבִים యొక్క ప్రత్యక్ష అర్థమైన ‘రాసి’ని ఉంచాం.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సూత్రంలో తెలుగులో ‘గ్రంథంలో’ సహజం. סֵפֶר సందర్భానుసారంగా గ్రంథం లేదా చుట్ట కావచ్చు.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల రాజవృత్తాంత గ్రంథం
  rationale: ఇది రాజుల పాలనకు సంబంధించిన వార్షిక లేదా చారిత్రక నమోదుల గ్రంథశీర్షిక. ‘రాజవృత్తాంతం’ దాని రాజసంబంధిత చారిత్రక స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలు రాజుల రాజవృత్తాంత గ్రంథం’ యొక్క గుర్తింపు
  choice: రాజుల గ్రంథంలో ఉదహరించబడిన రాజరిక చారిత్రక ఆధారంగా సూచించడం
  alternative: బైబిలులోని దినవృత్తాంతముల గ్రంథమే అని గుర్తించడం
  rationale: హీబ్రూ శీర్షిక ఒక రాజరిక వార్షిక చరిత్ర లేదా నమోదుల మూలాన్ని సూచిస్తుంది; అది కానోనికల్ దినవృత్తాంతముల గ్రంథమేనని వచనం నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ముగింపు సూత్రంలోని అలంకారప్రశ్నను సహజమైన ‘కదా?’ రూపంలో నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
