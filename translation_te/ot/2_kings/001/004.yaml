id: 2KI.1.4
reference: 2 Kings 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: te
  text: 'కాబట్టి యెహోవా ఇలా అంటున్నాడు: ‘నీవు ఎక్కిన మంచం మీద నుంచి దిగవు; నీవు తప్పకుండా చనిపోతావు.’ అప్పుడు ఏలీయా వెళ్లాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָכֵן
  choice: కాబట్టి
  rationale: ముందటి గద్దింపు నుంచి వచ్చే తీర్పు పర్యవసానాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవసందేశ సూత్రాన్ని సహజంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הַמִּטָּה
  choice: మంచం
  rationale: మִטָּה యొక్క సాధారణ అర్థాన్ని ఇస్తుంది; ‘రోగశయ్య’ అని సందర్భాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: నీవు ఎక్కిన
  rationale: తెలుగులో అవసరం లేని పునరుక్తిని నివారిస్తూ עלה అనే ‘ఎక్కు’ భావాన్ని నిలుపుతుంది.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: మంచం మీద నుంచి దిగవు
  rationale: ఎక్కడం–దిగడం అనే హీబ్రూ వ్యతిరేక దిశల చిత్రణను స్పష్టంగా కాపాడుతుంది.
- source_word: כִּי מוֹת תָּמוּת
  choice: నీవు తప్పకుండా చనిపోతావు
  rationale: క్రియానామం మరియు సమాపక క్రియ కలయిక తెలిపే నిశ్చయతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: అప్పుడు ఏలీయా వెళ్లిపోయాడు
  rationale: కథనం ముందుకు సాగడాన్ని ‘అప్పుడు’ సూచిస్తుంది; సందర్భంలో అక్కడి నుంచి బయలుదేరిన భావాన్ని ‘వెళ్లిపోయాడు’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రవచన తీర్పుకు తగిన గంభీరతతో రూపొందించబడింది. ‘ఎక్కిన/దిగవు’ అనే మూలంలోని పదవ్యతిరేకత ఉద్దేశపూర్వకంగా నిలుపబడింది.
