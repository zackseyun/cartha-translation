source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “ఒక మనిషి మమ్మల్ని కలవడానికి పైకి వచ్చి మాతో ఇలా అన్నాడు: ‘వెళ్లండి, మిమ్మల్ని పంపిన రాజు దగ్గరకు తిరిగి వెళ్లండి; అతనితో ఇలా చెప్పండి: యాహ్వే ఇలా అంటున్నాడు: ఇశ్రాయేలులో దేవుడు లేనందుకా నీవు ఎక్రోను దేవుడైన బయల్జెబూబును సంప్రదించడానికి దూతలను పంపిస్తున్నావు? కాబట్టి నీవు ఎక్కిన మంచం మీదనుంచి దిగవు[a], ఎందుకంటే నీవు తప్పకుండా చనిపోతావు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీవు అక్కడ ఎక్కిన మంచం మీదనుంచి దిగవు” అని కూడా అనువదించవచ్చు.
    reason: אֲשֶׁר עָלִיתָ שָּׁםలోని స్థానసూచక పదమైన “అక్కడ”ను తెలుగులో సహజత కోసం ప్రధాన పాఠ్యంలో విడిగా పునరావృతం చేయలేదు.
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: దూతలకు ఆ వ్యక్తి ఇంకా ఏలీయాగా గుర్తింపబడలేదు; అందువల్ల కథన దృక్కోణాన్నీ పుంలింగ ఏకవచనాన్నీ నిలుపుతుంది.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: మమ్మల్ని ఎదుర్కోవడానికి పైకి వచ్చి
  rationale: עָלָהలోని పైకి కదలికను నిలుపుతూ, לִקְרָאתֵנוּను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְכוּ שׁוּבוּ
  choice: వెళ్లండి, ... తిరిగి వెళ్లి
  rationale: హీబ్రూలోని రెండు ఆజ్ఞారూపాలనూ కలిపివేయకుండా నిలుపుతుంది.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: అతనితో ఇలా చెప్పండి
  rationale: ప్రత్యక్ష సందేశం వెంటనే వస్తున్నందున తెలుగులో సహజంగా ఉండేలా అనువదించబడింది; ‘అతనితో మాట్లాడండి’ కంటే సందర్భార్థం స్పష్టంగా ఉంటుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజ తెలుగులో నిలుపుతూ, יהוה అనే వ్యక్తిగత దైవనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో దేవుడు లేనందుకా
  rationale: హీబ్రూ వాక్యంలోని అవిశ్వాసభరితమైన మందలింపు, అలంకారప్రశ్న స్వరాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: సంప్రదించడానికి మనుషులను పంపుతున్నావు
  rationale: דרש ఇక్కడ దేవత వద్ద దైవవాక్కు లేదా సమాధానం కోరడాన్ని సూచిస్తుంది; తెలుగులో కర్మ లేకుండా ‘పంపుతున్నావు’ అసంపూర్ణంగా వినిపించేందున అంతర్భావిత దూతలను ‘మనుషులను’ అని స్పష్టం చేసింది.
- source_word: בַּעַל זְבוּב
  choice: బయల్‌జెబూబు
  rationale: దేవత పేరును అనువదించకుండా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ఎక్రోను దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: నీవు ఎక్కిన మంచం
  rationale: అనారోగ్య సందర్భంలో מִטָּהకు ‘మంచం’ సరిపోతుంది; హీబ్రూ సంబంధవాక్యంలోని పునరుక్త స్థానసూచకాన్ని తెలుగులో అసహజంగా పునరావృతం చేయకుండా עָלָה భావాన్ని ‘ఎక్కిన’గా నిలుపుతుంది.
- source_word: מוֹת תָּמוּת
  choice: తప్పకుండా చనిపోతావు
  rationale: హీబ్రూ infinitive absolute మరియు finite verb కలయికలోని నిశ్చయాత్మక బలాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది; వ్యక్తిగత దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: ‘ఇశ్రాయేలులో దేవుడు లేడా?’ అనే ప్రశ్న స్వభావం
  choice: ఇశ్రాయేలులో దేవుడు లేనందుకా
  alternative: ఇశ్రాయేలులో దేవుడు లేకపోవడం వల్లనా
  rationale: ఇది నిజంగా సమాచారం అడిగే ప్రశ్న కాదు; అన్యదేవతను సంప్రదించడంపై వ్యంగ్యంతో కూడిన ప్రవక్తీయ మందలింపు. అయినా వాక్యాన్ని ప్రకటనగా మార్చకుండా ప్రశ్నగానే ఉంచింది.
- issue: బయల్‌జెబూబు గుర్తింపు
  choice: ఎక్రోను దేవుడైన బయల్‌జెబూబు
  alternative: ఎక్రోనీయుల దేవుడైన బయల్‌జెబూబు
  rationale: మూలంలోని స్థలనామ సంబంధాన్ని నేరుగా నిలుపుతుంది; పేరు అర్థంపై ఎలాంటి సిద్ధాంతాత్మక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ప్రవక్తీయ స్వరం, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ఉద్ధరణ స్థరాలను స్పష్టంగా ఉంచి, మూలంలోని పునరుక్తిని అవసరమైనచోట నిలిపి, తెలుగులో అసహజమైన సెమిటిక్ నిర్మాణాన్ని మాత్రమే సవరించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
