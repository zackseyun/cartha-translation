  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: te
  text: 'అతడు అతనితో ఇలా చెప్పాడు: “యహ్వే ఇలా అంటున్నాడు: ‘ఇశ్రాయేలులో దేవుడు లేనందువల్లనే ఆయన వాక్యాన్ని విచారించడానికి నీవు ఎక్రోనుకు దేవుడైన బయల్‌-జెబూబు[b] దగ్గరకు దూతలను పంపావా? కాబట్టి, నీవు ఎక్కిన ఆ మంచం[c] మీద నుంచి నీవు దిగవు; నీవు తప్పకుండా చనిపోతావు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూ పాఠంలో ఈ పేరు “బయల్‌-జెబూబు.” తరువాతి సంప్రదాయంలో దీనికి సంబంధించిన “బయల్‌-జెబూలు” అనే రూపం కూడా కనిపిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, “నీవు అక్కడ ఎక్కిన మంచం.” ఇక్కడ “అక్కడ” అనేది సంబంధవాక్యంలో పునరుక్త సూచనగా పనిచేస్తుంది.
    reason: source_form
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: అతడు అతనితో ఇలా మాట్లాడాడు
  rationale: דבר యొక్క సాధారణ అర్థమైన ‘మాట్లాడు’ను నిలుపుతూ, వెంట వచ్చే ప్రవచన సూత్రంలోని ‘అంటున్నాడు’తో ఉన్న క్రియాభేదాన్ని కాపాడుతుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యహ్వే’గా ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: నీవు ... దూతలను పంపావు
  rationale: ఇక్కడ מַלְאָכִים మానవ సందేశవాహకులను సూచిస్తుంది; ‘దూతలు’ సందర్భంలో సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: బయల్‌-జెబూబు దగ్గర విచారణ చేయడానికి
  rationale: דרש ఇక్కడ ఒక దేవత నుంచి దైవసందేశం లేదా సమాచారం తెలుసుకోవడాన్ని సూచిస్తుంది. ‘దగ్గర విచారణ చేయడం’ తెలుగులో ఆ సంప్రదింపుల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ఎక్రోను దేవుడు
  rationale: హీబ్రూ నిర్మాణాన్ని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో దేవుడు లేడా?
  rationale: రాజును గద్దించే అలంకారప్రశ్నను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది. אֱלֹהִים ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి సూచిస్తున్నందున ఏకవచన భావం సరైనది.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: తన వాక్యాన్ని అడిగి తెలుసుకోవడానికి
  rationale: దేవుని ‘వాక్యం’ అనే మూలపదాన్ని తొలగించకుండా ఉంచి, దాని ద్వారా దైవసందేశాన్ని కోరే భావాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: నీవు ఎక్కిన ఆ మంచం
  rationale: עלה లోని ‘ఎక్కు’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది; שׁם ను తెలుగులో విడిగా ‘అక్కడ’ అనడం అసహజ పునరుక్తి కావడంతో ‘ఆ’ ద్వారా సందర్భసూచనగా అందించింది.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: దాని మీద నుంచి దిగవు
  rationale: עלה/ירד అనే ‘ఎక్కు/దిగు’ పదజంటను కాపాడి, తీర్పు యొక్క నిశ్చితత్వాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: כִּי מוֹת תָּמוּת
  choice: నీవు తప్పకుండా చనిపోతావు
  rationale: హీబ్రూలోని infinitive absolute + finite verb బలప్రయోగాన్ని సహజమైన తెలుగు ‘తప్పకుండా’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే అందించింది.
- issue: בִּדְבָרוֹ లోని ‘ఆయన వాక్యం’
  choice: తన వాక్యాన్ని అడిగి తెలుసుకోవడానికి
  alternative: ఆయనను సంప్రదించడానికి
  rationale: ‘దేవుణ్ణి సంప్రదించడం’ అని మాత్రమే అనువదిస్తే דָבָר (‘వాక్యం/సందేశం’) తొలగిపోతుంది. మూలంలోని భావసాంద్రతను నిలుపుతూ దైవసందేశం కోరడాన్ని సూచించింది.
- issue: తీర్పు ప్రకటన యొక్క నిశ్చితత్వం
  choice: దిగవు; ... తప్పకుండా చనిపోతావు
  alternative: దిగకపోవచ్చు; చనిపోవచ్చు
  rationale: హీబ్రూ వాక్యం సంభావ్యతను కాక నిశ్చితమైన ప్రవచన తీర్పును ప్రకటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన ధోరణి పాటించబడింది. అరుదైన మతపరమైన సాంకేతిక పదాలకు బదులుగా సాధారణ పాఠకునికి అర్థమయ్యే ‘విచారణ చేయడం’, ‘అడిగి తెలుసుకోవడం’ వాడబడ్డాయి. మూలంలోని మంచాన్ని ముందుకు తెచ్చే నిర్మాణాన్ని ‘నీవు ఎక్కిన ఆ మంచం మీద నుంచి’ ద్వారా సాధ్యమైనంతవరకు నిలిపి, తెలుగులో అసహజతను నివారించాం.
