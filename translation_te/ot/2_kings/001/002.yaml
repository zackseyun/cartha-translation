source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: te
  text: 'అహజ్యా సమరయలోని తన మేడగదిలోని జాలి గుండా పడి అనారోగ్యానికి గురయ్యాడు. అప్పుడు అతడు సందేశకులను పంపి వారితో ఇలా అన్నాడు: “మీరు వెళ్లి, ఎక్రోను దేవుడైన బయల్-జెబూబు[a]ను సంప్రదించి, ఈ అనారోగ్యం నుంచి నేను బతికి బయటపడతానో లేదో తెలుసుకోండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బయల్-జెబూబు’ అనేది ఈ పేరుకు హెబ్రీ రూపం; తరువాతి గ్రీకు సంప్రదాయంలోను, కొన్ని అనువాద సంప్రదాయాల్లోను ‘బెయెల్జెబూబు’ అనే రూపం కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: జాలి గుండా
  rationale: జాలితో చేసిన తెరువు గుండా పడిన దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది; మూలంలో లేని ‘కిటికీ’ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: עֲלִיָּתוֹ
  choice: తన మేడగది
  rationale: పై అంతస్తులోని గది అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּחַל
  choice: అనారోగ్యానికి గురయ్యాడు
  rationale: חלה యొక్క ప్రాథమిక భావం ‘అనారోగ్యపడటం’; పడిపోవడం వల్ల గాయమైందని సందర్భం సూచించినా, మూలపాఠ్యం చెప్పిన అనారోగ్య భావాన్ని ఇది నిలుపుతుంది.
- source_word: מַלְאָכִים
  choice: సందేశకులు
  rationale: ఈ సందర్భంలో రాజు పంపిన మానవ ప్రతినిధులు ఉద్దేశించబడ్డారు; ‘దూతలు’ వల్ల కలగగల దేవదూతల అర్థభ్రాంతిని నివారిస్తుంది.
- source_word: דִרְשׁוּ
  choice: సంప్రదించి … తెలుసుకోండి
  rationale: దేవతను అడిగి దైవవాక్కు లేదా జవాబు పొందడానికి విచారించే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בַּעַל זְבוּב
  choice: బయల్-జెబూబు
  rationale: హెబ్రీ మూలపాఠ్యంలోని దేవత పేరును అనువదించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: ఎక్రోను దేవుడు
  rationale: ఎక్రోనుతో ఆ దేవతకున్న సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: ఈ అనారోగ్యం నుంచి నేను బతికి బయటపడతానో లేదో
  rationale: ‘నేను బ్రతుకుతానా’ అనే మూలంలోని జీవన-మరణ అనిశ్చితిని కేవలం ‘కోలుకుంటానా’గా కుదించకుండా, సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיִּפֹּל
  choice: పడి
  rationale: సరళ కథన క్రియను నేరుగా అనువదిస్తుంది.
- source_word: שֹׁמְרוֹן
  choice: సమరయ
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రామాణిక స్థలనామ రూపం.
theological_decisions:
- issue: అన్యదేవత పేరును ఎలా ఇవ్వాలి
  choice: బయల్-జెబూబు
  alternative: బెయెల్జెబూబు
  rationale: ప్రధాన పాఠ్యం హెబ్రీ రూపమైన בַּעַל זְבוּב‌ను అనుసరిస్తుంది. తరువాతి కాలంలో పరిచయమైన రూపాన్ని మూలరూపంపై ప్రతిష్ఠించకుండా పాదసూచికలో భద్రపరుస్తుంది.
- issue: రాజు అడిగిన ప్రశ్నలోని జీవన-మరణ భావం
  choice: బతికి బయటపడతానో లేదో
  alternative: కోలుకుంటానో లేదో
  rationale: אֶחְיֶה అక్షరార్థంగా ‘నేను బ్రతుకుతానా’ అని అడుగుతుంది. అందువల్ల ఆరోగ్యప్రాప్తి భావంతో పాటు మరణసంభావనను కూడా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రతి హెబ్రీ וַ־కు విడిగా ‘మరియు’ అనకుండా తెలుగు కథన ప్రవాహానికి అనుగుణంగా వాక్యాలు కూర్చబడ్డాయి.
