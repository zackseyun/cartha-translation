  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ప్రశ్నను సహజ తెలుగు వాక్యక్రమంలో ఉంచి, מִשְׁפַּט పదంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో భద్రపరిచాం.
