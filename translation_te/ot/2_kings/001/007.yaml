  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם מֶ֚ה מִשְׁפַּ֣ט הָ/אִ֔ישׁ אֲשֶׁ֥ר עָלָ֖ה לִ/קְרַאתְ/כֶ֑ם וַ/יְדַבֵּ֣ר אֲלֵי/כֶ֔ם אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: te
  text: 'అప్పుడు అతడు వారిని ఇలా అడిగాడు: “మిమ్మల్ని కలవడానికి పైకి వచ్చి, మీకు ఈ మాటలు చెప్పిన ఆ మనిషి రూపం ఎలాంటిది?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మనిషి ఎలాంటి వాడు?” అక్షరార్థంగా, “ఆ మనిషి మిష్పాట్ ఏమిటి?” ఇక్కడి హీబ్రూ పదం అతని తీరు, వర్ణన, లేదా రూపాన్ని సూచించవచ్చు; ఈ సందర్భంలో అతన్ని గుర్తించడానికి ఉపయోగపడే లక్షణాలనే అడుగుతున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  choice: ఆ మనిషి రూపం ఎలాంటిది?
  rationale: మִשְׁפַּט సాధారణంగా ‘తీర్పు,’ ‘విధానం,’ లేదా ‘రీతి’ అని అర్థమివ్వగలిగినా, ఇక్కడ తదుపరి వచనంలోని దుస్తులు మరియు శరీర లక్షణాల వర్ణనను బట్టి గుర్తుపట్టే బాహ్య రూపాన్ని అడుగుతోంది. ‘రూపం ఎలాంటిది?’ సహజమైన తెలుగులో ఈ భావాన్ని అందిస్తూ మూలంలోని విస్తృతార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: దూతలు ఎదుర్కొన్న నిర్దిష్ట వ్యక్తిని సూచించే హీబ్రూ నిర్దిష్టతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלָה
  choice: వచ్చి
  rationale: మూల క్రియలో ‘పైకి వచ్చాడు’ అనే దిశాసూచక ఛాయ ఉన్నా, ఈ సందర్భంలో తెలుగులో ‘వచ్చి’ అనడం సహజం; ‘ఎదుర్కోవడానికి’తో కలిసి అతడు వారి వైపు వచ్చిన భావాన్ని ఇస్తుంది.
- source_word: לִקְרַאתְכֶם
  choice: మిమ్మల్ని ఎదుర్కోవడానికి
  rationale: לקראת అనే ఎదురుపడటం లేదా కలుసుకోవడం అనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיְדַבֵּר אֲלֵיכֶם
  choice: మీతో చెప్పిన
  rationale: తెలుగులో ‘ఈ మాటలు మీతో చెప్పిన’ అనేది సహజమైన నిర్మాణం; వారికి ఉద్దేశించి పలికాడనే భావాన్ని కాపాడుతుంది.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: మూలంలోని ప్రత్యక్ష పదబంధాన్ని దగ్గరగా, సహజంగా అనువదిస్తుంది; ‘సందేశం’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
