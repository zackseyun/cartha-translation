base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: te
  text: 'ఏలీయా జవాబిచ్చి వారితో ఇలా అన్నాడు: “నేను దైవజనుణ్ణి అయితే[a], ఆకాశం నుంచి అగ్ని దిగివచ్చి నిన్నూ, నీ యాభై మందినీ[b] దహించుగాక.” అప్పుడు దేవుని అగ్ని[c] ఆకాశం నుంచి దిగివచ్చి అతణ్ణీ, అతని యాభై మందినీ దహించింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నేనే ఆ దైవజనుణ్ణి అయితే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “నీ యాభై”; అంటే ఆ సేనాధిపతి ఆధీనంలోని యాభై మంది సైనికులు.
    reason: cultural_note
  - marker: c
    text: “దేవుని నుండి వచ్చిన అగ్ని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: ఏలీయా వారికి జవాబిస్తూ ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి వారితో మాట్లాడాడు’ అనే ద్వంద్వ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా అందిస్తూ, ఇది ప్రత్యుత్తరమని స్పష్టంగా ఉంచుతుంది.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: నేను దైవజనుణ్ణి అయితే
  rationale: ‘దైవజనుడు’ అనేది ప్రవక్తకు వాడిన హీబ్రూ బిరుదును సహజంగా, సంక్షిప్తంగా తెలిపే తెలుగు పదం; షరతు భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: ఆకాశం నుంచి అగ్ని దిగివచ్చి … దహించుగాక
  rationale: క్రియలోని జస్సివ్ లేదా శాపోక్తి భావాన్ని కేవలం భవిష్యద్వాణిగా కాక, ఏలీయా పలికిన ఆహ్వానంగా ‘దహించుగాక’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: וְתֹאכַל
  choice: దహించుగాక
  rationale: అగ్ని సందర్భంలో אכל అంటే ‘తిను’ అనే అక్షరార్థం కంటే ‘దహించు/కాల్చివేయు’ అనే భావమే సహజం; విధ్వంస తీవ్రతను నిలుపుతుంది.
- source_word: אֹתְךָ וְאֶת חֲמִשֶּׁיךָ
  choice: నిన్నూ, నీ యాభై మందినీ
  rationale: రెండవ పురుష ఏకవచనం సేనాధిపతిని ఉద్దేశిస్తుంది; ‘నీ యాభై’ అనే సంక్షిప్త హీబ్రూ ప్రయోగాన్ని తెలుగులో అర్థమయ్యేలా ‘మంది’తో అందించింది.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: అప్పుడు దేవుని అగ్ని ఆకాశం నుంచి దిగివచ్చి
  rationale: אֵשׁ אֱלֹהִים లో అగ్నికి దేవునితో ఉన్న స్పష్టమైన సంబంధాన్ని ‘దేవుని అగ్ని’గా నిలుపుతూ, దాని మూలాన్ని లేదా స్వభావాన్ని అవసరానికి మించి నిర్ధారించదు.
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: అతణ్ణీ, అతని యాభై మందినీ దహించింది
  rationale: సేనాధిపతి మరియు అతని దళం మధ్య భేదాన్ని స్పష్టంగా ఉంచి, ముందటి అగ్ని క్రియతో పదసామ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే ప్రవక్త బిరుదు
  choice: దైవజనుడు
  alternative: ఆ దైవజనుడు
  rationale: ఇది దేవునికి చెందిన వ్యక్తి లేదా ప్రవక్త అనే హీబ్రూ బిరుదును మతశాఖాపరమైన అదనపు భావం లేకుండా తెలియజేస్తుంది. సందర్భంలో నిర్దిష్టతను బలపరిచే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- issue: אֵשׁ אֱלֹהִים లోని సంబంధం
  choice: దేవుని అగ్ని
  alternative: దేవుని దగ్గర నుంచి వచ్చిన అగ్ని
  rationale: హీబ్రూ పదబంధం దేవునితో అగ్నికి ఉన్న సంబంధాన్ని స్పష్టంగా చెబుతుంది; ప్రధాన పాఠం ఆ సంబంధాన్ని నేరుగా నిలుపుతుంది, మూలాన్ని స్పష్టీకరించే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని వాడుతూ, ప్రవక్త మాటలోని గంభీరత కోసం ‘దహించుగాక’ను ఎంచుకున్నాం. ‘దైవజనుడు’ అనే స్థిరమైన బైబిలు బిరుదును ఉంచినా, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉండేలా చేశాం.
