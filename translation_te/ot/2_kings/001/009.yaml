id: 2KI.1.9
reference: 2 Kings 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֣עַל אֵלָ֗י/ו וְ/הִנֵּה֙ יֹשֵׁב֙ עַל רֹ֣אשׁ הָ/הָ֔ר וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים הַ/מֶּ֥לֶךְ דִּבֶּ֖ר רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: te
  text: అప్పుడు అతడు ఏలీయా దగ్గరికి యాభైమందికి అధిపతిని, అతని యాభైమందితో పాటు పంపించాడు. ఆ అధిపతి ఏలీయా దగ్గరికి ఎక్కివెళ్లాడు. ఇదిగో, ఏలీయా కొండ శిఖరం మీద కూర్చొని ఉన్నాడు.[a] ఆ అధిపతి అతనితో, “దేవుని మనిషీ, ‘దిగిరా’ అని రాజు చెబుతున్నాడు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పర్వత శిఖరం మీద.” హీబ్రూ הַר అనే పదం సందర్భానుసారం కొండను లేదా పర్వతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, “రాజు ఇలా పలికాడు: ‘దిగిరా.’” హీబ్రూలోని సందేశవాహక సూత్రంలో “పలికాడు” అనే రూపం ఉంది; ఇక్కడ సహజమైన తెలుగులో “చెబుతున్నాడు” అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు అతడు ... పంపించాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: שַׂר חֲמִשִּׁים
  choice: యాభైమందికి అధిపతి
  rationale: యాభైమంది సైనికుల దళానికి నాయకుడైన అధికారిని సూచిస్తుంది; ‘అధిపతి’ హోదా భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַחֲמִשָּׁיו
  choice: అతని యాభైమందితో పాటు
  rationale: ప్రత్యయం ఆ అధిపతి కింద ఉన్న యాభైమంది దళాన్ని సూచిస్తుంది; సందర్భం వల్ల ‘సైనికులు’ అని ప్రత్యేకంగా చేర్చకుండానే అర్థం స్పష్టంగా ఉంటుంది.
- source_word: וַיַּעַל אֵלָיו
  choice: అతని దగ్గరికి ఎక్కివెళ్లాడు
  rationale: ఏలీయా ఉన్న ఎత్తైన ప్రదేశం వైపు పైకి వెళ్లడాన్ని עלה సూచిస్తుంది; ‘ఎక్కివెళ్లాడు’ నిలువు దిశను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దృశ్యాన్ని సజీవంగా పాఠకుని ముందుకు తెచ్చే హీబ్రూ సూచనార్థక అవ్యయానికి సమీపమైన సహజ తెలుగు రూపం.
- source_word: יֹשֵׁב
  choice: కూర్చొని ఉన్నాడు
  rationale: ఆ సమయంలో కొనసాగుతున్న ఏలీయా భంగిమను హీబ్రూ కృదంతం తెలియజేస్తుంది.
- source_word: עַל רֹאשׁ הָהָר
  choice: కొండ శిఖరం మీద
  rationale: רֹאשׁ అంటే పైభాగం లేదా శిఖరం; הַר సందర్భానుసారం కొండ లేదా పర్వతం కావచ్చు. ప్రధాన పాఠ్యంలో ‘కొండ’ సహజంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: అతనితో ... అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తూ, అతనితో మాట్లాడిన భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషీ
  rationale: ప్రవక్తకు వాడే గుర్తింపు బిరుదును పదార్థానికి దగ్గరగా ఉంచుతుంది; సంబోధన కావడంతో ‘మనిషీ’ రూపం వాడబడింది.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: అని రాజు చెబుతున్నాడు
  rationale: అక్షరార్థంగా ‘రాజు పలికాడు/మాట్లాడాడు’; అయితే దూత రాజు సందేశాన్ని అందించే సూత్రంలో తెలుగు వర్తమాన రూపం సహజంగా ఉంటుంది. ‘ఆజ్ఞాపిస్తున్నాడు’ అని అనువదిస్తే మూల క్రియకు మించిన భావం చేరుతుంది.
- source_word: רֵדָה
  choice: దిగిరా
  rationale: మాట్లాడుతున్న అధిపతి క్రింద ఉండి ఏలీయాను తనవైపు దిగమని పిలుస్తున్నందున ఈ ఆజ్ఞారూపం దిశాభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
