translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి పాటించబడింది. సైనిక హోదాకు ‘యాభైమందికి అధిపతి’ అని, ప్రవక్త బిరుదుకు ‘దేవుని మనిషి’ అని మూలానికి దగ్గరగా వాడాం. పునరుక్త సర్వనామాల వల్ల కలిగే అయోమయాన్ని నివారించేందుకు అవసరమైన చోట ‘ఏలీయా’, ‘ఆ అధిపతి’ అని స్పష్టీకరించాం; ఇవి సందర్భంలో అంతర్లీనంగా ఉన్న సూచనలే.
