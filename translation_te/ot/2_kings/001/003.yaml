source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: te
  text: 'అయితే యెహోవా దూత తిష్బీయుడైన ఏలీయాతో ఇలా చెప్పాడు: “లేచి, సమరయ రాజు దూతలను కలుసుకోవడానికి పైకి వెళ్లి, వారితో ఇలా చెప్పు: ‘ఇశ్రాయేలులో దేవుడు లేనందువల్లనే మీరు ఎక్రోను దేవుడైన బయల్‌జెబూబును సంప్రదించడానికి వెళ్తున్నారా?’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులో దేవుడు లేకపోవడం వల్లనా మీరు ఎక్రోను దేవుడైన బయల్‌జెబూబును సంప్రదించడానికి వెళ్తున్నారు?”
    reason: హీబ్రూ הֲמִבְּלִי אֵין అనే అలంకారిక ప్రశ్నకు సాధ్యమైన ప్రత్యామ్నాయ తెలుగు వ్యక్తీకరణను అందిస్తుంది.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: అయితే యెహోవా దూత
  rationale: וּ ఇక్కడ ముందటి వచనంలోని రాజు చర్యకు వ్యతిరేకంగా కథన మలుపును సూచిస్తుంది. מַלְאַךְ యెహోవాతో కూడి ఉన్నందున దైవిక దూతను సూచిస్తుంది; ‘యెహోవా దూత’ సహజంగా ఉండి, అతని ఖచ్చితమైన తాత్త్విక గుర్తింపును నిర్ణయించదు.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: తిష్బీయుడైన ఏలీయా
  rationale: పేరును తెలుగు సంప్రదాయ రూపంలో ఇచ్చి, הַתִּשְׁבִּי అనే ప్రాంతీయ గుర్తింపును ‘తిష్బీయుడు’గా నిలిపాం.
- source_word: קוּם עֲלֵה
  choice: లేచి ... పైకి వెళ్లు
  rationale: రెండు ఆజ్ఞల భేదాన్ని నిలిపి, עלה లోని పైకి వెళ్లే దిశాభావాన్ని విడిచిపెట్టలేదు.
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: ఉద్దేశాన్ని సూచించే నిర్మాణాన్ని సహజమైన తెలుగులో ఇచ్చాం; ‘ఎదుర్కోవడానికి’ అనడం మూలంలో లేని ఘర్షణ స్వరాన్ని చేర్చవచ్చు.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: సమరయ రాజు పంపిన దూతలు
  rationale: ఇక్కడ מַלְאָךְ మానవ సందేశవాహకులను సూచిస్తుంది. ‘పంపిన’ అనేది వారి పాత్రను తెలుగులో స్పష్టం చేస్తుంది; ‘సమరయ రాజు’ అనే మూలరూపాన్ని నిలిపాం.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో దేవుడు లేనందువల్లనే
  rationale: మందలింపుతో కూడిన అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలిపాం. ‘దేవుడు లేకపోవడం వల్లనా’ అనే కొద్దిగా భిన్నమైన నిర్మాణం కూడా సాధ్యం.
- source_word: לִדְרֹשׁ
  choice: విచారించడానికి
  rationale: దేవత వద్ద జవాబు లేదా దైవవాక్కు కోరే సందర్భార్థాన్ని ‘విచారించడానికి’ తెలియజేస్తుంది; సాధారణంగా ‘వెదకడానికి’ అనడం ఈ భావాన్ని బలహీనపరుస్తుంది.
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  choice: ఎక్రోను దేవుడైన బయల్‌జెబూబు
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరించి, ఎక్రోనుతో అతని ఆరాధనా సంబంధాన్ని స్పష్టంగా ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: యెహోవా సందేశవాహకుడు
  rationale: ఈ కథన సందర్భంలో దైవిక దూత అనే సహజ భావాన్ని ఇచ్చాం; అయితే అతని స్వరూపం గురించి వచనం చెప్పనిదాన్ని అనువాదం ద్వారా జోడించలేదు.
- issue: అలంకారిక ప్రశ్న యొక్క భావం
  choice: ఇశ్రాయేలులో దేవుడు లేనందువల్లనే ... వెళ్తున్నారా?
  alternative: ఇశ్రాయేలులో దేవుడు లేకపోవడం వల్లనా ... వెళ్తున్నారు?
  rationale: ఇది ఇశ్రాయేలు దేవుని ఉనికిపై నిజమైన సందేహం కాదు; రాజు చర్యను గద్దించే ప్రశ్న. అయినప్పటికీ ప్రశ్నారూపాన్ని అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రత్యక్ష సంభాషణను సహజంగా ఉంచుతూ, స్థలనామాలు మరియు వ్యక్తినామాలకు తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన రూపాలను ఎంచుకున్నాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణికి అనుసంధానించబడింది.
