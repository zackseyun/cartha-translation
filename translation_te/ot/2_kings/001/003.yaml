  to: 'అయితే యెహోవా దూత తిష్బీయుడైన ఏలీయాతో ఇలా చెప్పాడు: “లేచి, సమరయ రాజు దూతలను కలుసుకోవడానికి పైకి వెళ్లి, వారితో ఇలా చెప్పు: ‘ఇశ్రాయేలులో దేవుడు లేనందువల్లనే మీరు ఎక్రోను దేవుడైన బయల్‌జెబూబును సంప్రదించడానికి వెళ్తున్నారా?’”[a]'
  rationale: The revision removes the unstated addition “పంపిన” and uses “సంప్రదించడానికి” to convey inquiry of a deity in this oracle-seeking context. It otherwise preserves the Hebrew’s wording, rhetorical force, and directional nuance, while retaining the existing footnote anchor and its lexical alternative.
