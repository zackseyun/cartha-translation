translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి. రాజుల బిరుదులు, స్థలపేరు స్పష్టంగా ఉంచబడ్డాయి; హీబ్రూ నుడికారాల భావం పాఠ్యంలో సహజంగా ఇచ్చి, అక్షరార్థం పాదటిప్పణిలో భద్రపరచబడింది.
