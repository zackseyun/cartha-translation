  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ וַ/יַּ֨עַל יְהוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יִּתְרָא֣וּ פָנִ֔ים ה֖וּא וַ/אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה בְּ/בֵ֥ית שֶׁ֖מֶשׁ אֲשֶׁ֥ר לִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: te
  text: కానీ అమజ్యా మాట వినలేదు[a]. అప్పుడు ఇశ్రాయేలు రాజైన యెహోయాషు పైకి వెళ్లాడు; అతడూ యూదా రాజైన అమజ్యాయూ యూదాకు చెందిన బేత్షెమెషులో ముఖాముఖిగా కలుసుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆలకించలేదు,’ ‘వినలేదు.’ హీబ్రూ క్రియ కేవలం వినడమే కాకుండా, విని దానికి అనుగుణంగా స్పందించడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ముఖాలు చూశారు’; ఇది ప్రత్యక్షంగా ఎదురుపడటాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: వినిపించుకోలేదు
  rationale: ఇక్కడ ఈ క్రియ కేవలం శబ్దాన్ని వినడం కాకుండా, హెచ్చరికను ఆలకించి దానికి అనుగుణంగా స్పందించడాన్ని సూచిస్తుంది. ‘వినిపించుకోలేదు’ అనేది అమజ్యా ఉద్దేశపూర్వక నిరాకరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַל
  choice: పైకి వచ్చాడు
  rationale: עלה అనే క్రియ యొక్క ప్రాథమిక దిశార్థాన్ని నిలుపుతుంది. సందర్భం సైనిక కదలికను సూచించినా, మూలంలో లేని ‘దండెత్తి’ వంటి వివరణను పాఠ్యంలో చేర్చదు.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: ముఖాముఖిగా తలపడ్డారు
  rationale: అక్షరార్థంగా ‘ముఖాలు చూసుకున్నారు’ అనే ఈ నుడికారం ఇక్కడ ఇద్దరు రాజుల ప్రత్యక్ష పోరాట ఎదుర్కొనడాన్ని సూచిస్తుంది. ‘తలపడ్డారు’ యుద్ధ సందర్భానికి సహజంగా సరిపోతూ నుడికార బలాన్ని కాపాడుతుంది.
- source_word: בֵּית שֶׁמֶשׁ
  choice: బేత్‌షెమెషు
  rationale: స్థలపేరును అర్థానువాదం చేయకుండా, తెలుగులో సులభంగా పలికే సంప్రదాయ లిప్యంతరీకరణగా ఉంచింది.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన
  rationale: ఈ పదబంధం కేవలం భౌగోళిక స్థితికన్నా యూదా ప్రాంతానికి చెందిన పట్టణమని సూచిస్తుంది.
- source_word: וְלֹא
  choice: కానీ
  rationale: మునుపటి హెచ్చరికకూ అమజ్యా ప్రతిస్పందనకూ మధ్య ఉన్న వ్యతిరేక సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
