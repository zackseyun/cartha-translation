source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు రాజైన యెహోయాషు యూదా రాజైన అమజ్యాకు ఇలా వర్తమానం పంపాడు: “లెబానోనులో ఉన్న ముళ్లపొద[a], లెబానోనులో ఉన్న దేవదారు చెట్టుకు, ‘నీ కుమార్తెను నా కుమారునికి భార్యగా ఇవ్వు’ అని కబురు పంపింది. మరియు లెబానోనులో ఉన్న ఒక అడవి జంతువు[b] అటుగా వెళ్లి ఆ ముళ్లపొదను తొక్కివేసింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ముళ్ల మొక్క,” “ముళ్లచెట్టు.” ఇక్కడి హెబ్రీ పదం ఏ ముళ్ల మొక్క జాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “పొలంలోని జంతువు”; అంటే, ఒక అడవి జంతువు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... వర్తమానం పంపాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది; గ్రహీతకు సందేశం పంపిన భావాన్ని ‘వర్తమానం పంపాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ సంజ్ఞను తెలుగులో సహజంగా ‘ఇలా’ అని అందించింది.
- source_word: הַחוֹחַ
  choice: ముళ్లపొద
  rationale: חוֹחַ ఒక ముళ్లుగల మొక్కను సూచిస్తుంది. దేవదారు చెట్టుతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ, నిర్దిష్ట జాతిని అనవసరంగా నిర్ణయించకుండా ‘ముళ్లపొద’ సహజంగా ఉంటుంది.
- source_word: הָאֶרֶז
  choice: దేవదారు చెట్టు
  rationale: אֶרֶזకు సూటి, సాధారణ తెలుగు సమానం; సామెతలోని చిన్నదనం-గొప్పదనం వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בַּלְּבָנוֹן
  choice: లెబానోనులో
  rationale: స్థలార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలిపింది.
- source_word: תְּנָה
  choice: ఇవ్వు
  rationale: వివాహ సంబంధ అభ్యర్థనలో נתן ఆజ్ఞారూపానికి సరళమైన, సహజమైన అనువాదం.
- source_word: בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: నీ కుమార్తెను నా కుమారునికి భార్యగా
  rationale: కుటుంబ, వివాహ సంబంధ పదజాలాన్ని స్పష్టంగా మరియు మూలానికి సమీపంగా నిలుపుతుంది.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ఒక అడవి జంతువు
  rationale: పదశః ‘పొలంలోని/బయటి ప్రదేశంలోని జంతువు’; సందర్భంలో పెంపుడు కాని జంతువు భావాన్ని ఆధునిక తెలుగులో ‘అడవి జంతువు’ సహజంగా అందిస్తుంది.
- source_word: וַתַּעֲבֹר
  choice: అటుగా వెళ్లి
  rationale: జంతువు ఆ ప్రదేశం గుండా లేదా పక్కగా వెళ్లిన భావాన్ని, సంఘటనలోని యాదృచ్ఛికతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּרְמֹס
  choice: తొక్కివేసింది
  rationale: רמסలోని కాళ్లతో తొక్కి అణిచివేసే స్పష్టమైన దృశ్యాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
