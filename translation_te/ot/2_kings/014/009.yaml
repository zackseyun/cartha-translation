  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలిని ఉపయోగించింది. మూలంలోని ‘లెబానోనులో’ అనే మూడు పునరుక్తులను, ముళ్లపొద-దేవదారు వ్యత్యాసాన్ని, చివరి వాక్యంలోని సాధారణ సంధాన క్రమాన్ని నిలిపింది.
