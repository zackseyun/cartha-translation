reference: 2 Kings 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ בֶּן יוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన యెహోయాహాజు కుమారుడు యోవాషు పరిపాలన రెండవ సంవత్సరంలో, యూదా రాజైన యోవాషు కుమారుడు అమజ్యా రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: రెండో సంవత్సరంలో
  rationale: రాజుల పరిపాలనా కాలాన్ని సూచించే ఈ హెబ్రీ కాలనిర్ణయ సూత్రంలో అక్షరార్థంగా ‘రెండు’ ఉన్నా, భావం ‘రెండో సంవత్సరం’; ఆధునిక తెలుగులో ఇదే సహజమైన రూపం.
- source_word: לְ/יוֹאָשׁ
  choice: యోవాషు పరిపాలనలో
  rationale: రాజ్య సంవత్సరాలు ఏ రాజు పరిపాలన ఆధారంగా లెక్కించబడుతున్నాయో לְ సూచిస్తుంది. ‘యోవాషుకు’ అనే అక్షరానువాదం కన్నా ‘యోవాషు పరిపాలనలో’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בֶּן יוֹאָחָז
  choice: యెహోయాహాజు కుమారుడు
  rationale: వంశపరమైన గుర్తింపును నేరుగా అనువదించి, వ్యక్తి పేరును తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: రాజు మరియు అతని రాజ్యాన్ని తెలిపే నిర్మాణాన్ని తెలుగు వాక్యక్రమంలో సహజమైన విశేషణ రూపంగా అందించాం.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ సందర్భంలో క్రియ సింహాసనారోహణను, అంటే రాజుగా పరిపాలన ప్రారంభించడాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ ఆ సంఘటనను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: בֶן יוֹאָשׁ
  choice: యోవాషు కుమారుడు
  rationale: అమజ్యా తండ్రిని సూచించే వంశపరమైన గుర్తింపును నేరుగా అనువదించాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: మూలంలో యోవాషుకు సంబంధించిన రాజబిరుదు మరియు రాజ్యాన్ని నిలుపుతూ, అమజ్యా తండ్రిని ఇశ్రాయేలు రాజైన అదే పేరుగల వ్యక్తి నుండి స్పష్టంగా వేరు చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే చారిత్రక వచనశైలిని ఉపయోగించాం. ఒకే వాక్యంలో ఉన్న ఇద్దరు యోవాషులను వారి రాజ్యాలు మరియు తండ్రి-కుమార సంబంధాల ద్వారా స్పష్టంగా వేరు చేశాం. పాదటిప్పణులు అవసరం లేదు.
