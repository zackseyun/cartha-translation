- from: నీవు ఎదోమును నిజంగానే ఓడించావు; దాంతో నీ హృదయం గర్వంతో ఉప్పొంగింది[a]. ఆ ఘనతతోనే తృప్తిపడి[b], నీ ఇంట్లోనే ఉండు. నీవూ నీతోపాటు యూదా కూడా పతనం అయ్యేలా, విపత్తును ఎందుకు రెచ్చగొడతావు?
  to: నీవు ఎదోమును నిజంగానే దెబ్బతీశావు; దాంతో నీ హృదయం గర్వంతో ఉప్పొంగింది[a]. ఘనత పొందు, నీ ఇంట్లోనే ఉండు. నీవు, నీతోపాటు యూదా కూడా పడిపోవడానికి, ఆపదను ఎందుకు రెచ్చగొడతావు?
  rationale: పాదసూచిక b ముసాయిదాలోని ఆజ్ఞను వివరిస్తున్నప్పటికీ దానికి పాఠ్యంలో సూచిక లేదు; అందువల్ల దాని anchor‌ను తొలగించాం, ఎందుకంటే a మాత్రమే హృదయ-రూపకానికి అవసరమైన అక్షరార్థ ప్రత్యామ్నాయాన్ని సూచిస్తుంది. మూలంలోని ఉద్ఘాటన, గర్వరూపకం, హితవు, ఆపదను రెచ్చగొట్టడం, అలాగే రాజుతోపాటు యూదా పడిపోవడం అన్నీ సవరించిన పాఠ్యంలో నిలిచాయి.
