id: 2KI.14.10
reference: 2 Kings 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: te
  text: నీవు ఎదోమును నిజంగానే దెబ్బతీశావు; దాంతో నీ హృదయం గర్వంతో ఉప్పొంగింది[a]. ఘనత పొందు, నీ ఇంట్లోనే ఉండు. నీవు, నీతోపాటు యూదా కూడా పడిపోవడానికి, ఆపదను ఎందుకు రెచ్చగొడతావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ హృదయం నిన్ను పైకెత్తింది.’ అంటే, నీవు గర్వించావు.
    reason: హీబ్రూ రూపకాన్ని మరియు దాని సందర్భార్థాన్ని రెండింటినీ పాఠకునికి అందించడం.
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ אֶת־אֱדוֹם
  choice: నీవు ఎదోమును నిజంగానే ఓడించావు
  rationale: క్రియావిశేషణీయ ధాతురూపం మరియు సమాపక క్రియ కలయికలోని ఉద్ఘాటనను ‘నిజంగానే’ తెలియజేస్తుంది. నכה అనే క్రియకు అక్షరార్థంగా ‘కొట్టు’ అనే భావం ఉన్నా, ఇక్కడ సైనిక సందర్భంలో ‘ఓడించు’ సహజంగా ఫలితాన్ని తెలియజేస్తుంది.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: దాంతో నీ హృదయం గర్వంతో ఉప్పొంగింది
  rationale: హీబ్రూ రూపకంలో హృదయం వ్యక్తిని పైకెత్తుతుంది; సందర్భంలో ఇది విజయంవల్ల కలిగిన గర్వాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘గర్వంతో ఉప్పొంగింది’ అని ఇచ్చి, అక్షరార్థ రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִכָּבֵד
  choice: ఆ ఘనతతోనే తృప్తిపడి
  rationale: כבד నిఫాల్ ఆజ్ఞారూపం ఇక్కడ పొందిన ఘనతను అనుభవించడం లేదా దానితో సరిపెట్టుకోవడం అనే సందర్భార్థాన్ని ఇస్తుంది. తరువాతి ‘నీ ఇంట్లోనే ఉండు’ అనే హెచ్చరికతో ఈ ఎంపిక సహజంగా కలుస్తుంది; ‘ఘనపరచబడుము’ అనే అక్షరానువాదం తెలుగులో అసహజం.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: నీ ఇంట్లోనే ఉండు
  rationale: ఇది మరొక యుద్ధానికి వెళ్లకుండా తన స్థానంలోనే ఉండమనే ప్రయోగం. ఆధునిక తెలుగులో ‘నీ ఇంట్లోనే ఉండు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: విపత్తును ఎందుకు రెచ్చగొడతావు?
  rationale: גרה హిత్పయేల్ రూపం కలహాన్ని రేపడం లేదా తనను తాను పోరాటంలోకి దింపుకోవడం అనే భావాన్ని కలిగిస్తుంది. רעה ఇక్కడ నైతిక చెడు కంటే సంభవించబోయే ఆపదను సూచిస్తుంది; అందుకే ‘విపత్తు’ అని అనువదించాం.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: నీవూ నీతోపాటు యూదా కూడా పతనం అయ్యేలా
  rationale: రాజు చేసే సవాలు అతనితోపాటు యూదా దేశాన్నీ కూల్చివేస్తుందనే ఫలితాన్ని హీబ్రూ నొక్కి చెబుతుంది. తెలుగు వాక్యక్రమంలో ఫలిత సంబంధాన్ని ‘అయ్యేలా’ స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజు మరొక రాజుకు ఇచ్చే గట్టి హెచ్చరికకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధన. హీబ్రూ ఉద్ఘాటన, హృదయ రూపకం, విజయఘనతలోని అర్థసందిగ్ధత, అలాగే రాజుతోపాటు యూదా పతనం చెందే పరిణామం అన్నీ నిలుపుకున్నాం.
