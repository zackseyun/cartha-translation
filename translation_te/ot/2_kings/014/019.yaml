  text: וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַֽחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִתֻ֖/הוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: te
  text: వారు యెరూషలేములో అతనిపై కుట్ర పన్నారు; అతడు లాకీషుకు పారిపోయాడు; వారు అతని వెంబడి లాకీషుకు పంపి, అక్కడ అతణ్ణి చంపారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారు అతని వెనుక లాకీషుకు పంపారు.’ పంపబడినవారు ఎవరనేది హీబ్రూ పాఠంలో చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: అతనికి వ్యతిరేకంగా కుట్ర పన్నారు
  rationale: క్రియ, దానితో ఒకే మూలం గల నామవాచకం కలిసి రాజకీయ కుట్రను సూచించే హీబ్రూ నుడికారంగా ఉన్నాయి. తెలుగులో సహజంగా, స్పష్టంగా ‘కుట్ర పన్నారు’ అని అనువదించబడింది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలాన్ని సూచించే ב ఉపసర్గకు నేరమైన తెలుగు రూపం.
- source_word: וַיָּנָס
  choice: పారిపోయాడు
  rationale: נוּס క్రియకు ఈ కథన సందర్భంలో ‘పారిపోవడం’ అనే అర్థం నేరంగా సరిపోతుంది.
- source_word: לָכִישָׁה
  choice: లాకీషుకు
  rationale: దిశను సూచించే ה ప్రత్యయం ఆ పట్టణం వైపు జరిగిన గమనాన్ని తెలియజేస్తుంది; తెలుగులో ‘లాకీషుకు’ సహజమైన రూపం.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: అతని వెంట ... మనుషులను పంపి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతని వెనుక/వెంట పంపారు’ అని ఉండి, పంపబడినవారు ఎవరనేది చెప్పబడలేదు. లక్ష్యభాషలో వాక్యం స్పష్టంగా ఉండేందుకు సందర్భం సూచించే ‘మనుషులను’ చేర్చబడింది; మూలంలోని సంక్షిప్త రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיְמִתֻהוּ
  choice: అతణ్ణి హతమార్చారు
  rationale: מות ధాతువు causative రూపం ఉద్దేశపూర్వకంగా మరణింపజేయడాన్ని, అంటే చంపడాన్ని సూచిస్తుంది. ‘హతమార్చారు’ ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సహజమైన కథన పదప్రయోగం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఇది ముందుగా పేర్కొన్న లాకీషును సూచించే సాధారణ స్థల క్రియావిశేషణం.
