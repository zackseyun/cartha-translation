translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు చిన్న వాక్యాలుగా విభజించబడ్డాయి; పంపబడినవారి గురించి మూలంలో ఉన్న సంక్షిప్తతను పాదసూచికలో నిలుపుకున్నాం.
