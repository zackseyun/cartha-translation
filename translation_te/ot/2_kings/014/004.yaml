source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: te
  text: అయితే, ఉన్నత స్థలాలు[a] తొలగించబడలేదు; ప్రజలు ఇంకా ఆ ఉన్నత స్థలాల్లో బలులు అర్పిస్తూ ధూపం వేస్తూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్థానిక పూజాస్థలాలు.’ హీబ్రూ పదం స్థానిక ఆరాధనా స్థలాలను సూచిస్తుంది; అవి తరచుగా ఎత్తైన నేలపై ఉండేవి.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి రాజు గురించిన మూల్యాంకనానికి మినహాయింపు లేదా పరిమితిని సూచించే వ్యతిరేకార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: స్థానిక ఆరాధనా కేంద్రాలను సూచించే బామోత్ పదానికి చారిత్రకంగా స్థిరమైన రూపాన్ని ఉంచుతూ, వాటిని వ్యాఖ్యానాత్మకంగా ‘అనధికార ఆరాధనా స్థలాలు’ అని విస్తరించదు.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: ఉన్నత స్థలాలు రద్దు చేయబడలేదనే సందర్భార్థాన్ని సహజమైన కర్మణి రూపంలో వ్యక్తం చేస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ఆచారం కొనసాగుతూనే ఉందనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సమష్టిగా జనసమూహాన్ని సూచించే సాధారణ, సహజమైన తెలుగు పదం.
- source_word: מְזַבְּחִים
  choice: బలులు అర్పిస్తూ
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా అలవాటైన క్రియాభావాన్ని నిలుపుతుంది.
- source_word: וּמְקַטְּרִים
  choice: ధూపం వేస్తూనే
  rationale: ఆరాధనా సందర్భంలో కטר సాధారణంగా ధూపం కాల్చడాన్ని సూచిస్తుంది; జతగా వచ్చిన కృదంతాల నిరంతర భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בַּבָּמוֹת
  choice: ఆ ఉన్నత స్థలాల్లో
  rationale: ב యొక్క స్థానార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఆ’ పునరుక్త స్థలాలను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఉన్నత స్థలాల్లో జరిగిన ఆరాధనపై మూల్యాంకనం
  choice: ప్రధాన పాఠ్యంలో చారిత్రక వర్ణనాత్మక పదమైన ‘ఉన్నత స్థలాలు’నే ఉంచడం
  alternative: స్థానిక పూజాస్థలాలు; అనధికార ఆరాధనా స్థలాలు
  rationale: వచనం ఆ స్థలాలు మిగిలి ఉండటాన్ని, ప్రజలు అక్కడ ఆరాధనా క్రియలను కొనసాగించటాన్ని చెబుతుంది. విస్తృత సందర్భంలో ప్రతికూల మూల్యాంకనం సూచితమైనా, ప్రధాన పాఠ్యంలో దానిని వ్యాఖ్యానంగా చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక-ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ కృదంతాల కొనసాగుతున్న ఆచార భావాన్ని ‘అర్పిస్తూ… వేస్తూనే ఉన్నారు’ ద్వారా నిలిపాం.
