source:
  edition: WLC
  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: te
  text: ఎందుకంటే ఇశ్రాయేలు బాధ అత్యంత తీవ్రమైందని[a] యెహోవా చూశాడు; బంధింపబడినవాడుగానీ విడిచిపెట్టబడినవాడుగానీ ఎవరూ లేరు[b], ఇశ్రాయేలుకు సహాయం చేసేవాడూ లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చాలా చేదుగా ఉంది,” లేదా “అత్యంత దుర్భరంగా ఉంది.” ఇక్కడి హెబ్రీ పదబంధం కఠినమైనది; అయితే అది ఇశ్రాయేలు బాధ తీవ్రతను నొక్కిచెబుతోంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “బంధింపబడినవాడూ లేడు, విడిచిపెట్టబడినవాడూ లేడు.” ఇది ఎవరూ లేరని లేదా ఎవరూ మిగలలేదని సూచించే నుడికారం కావచ్చు. మరికొందరు దీనిని “బానిసగానీ స్వతంత్రుడుగానీ” లేదా “నిర్బంధితుడుగానీ విడుదలైనవాడుగానీ” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన రూపంలో నిలుపుతుంది.
- source_word: עֳנִי
  choice: బాధ
  rationale: జాతీయ సందర్భంలోని దుఃఖం, అణచివేత, దురవస్థ అన్న విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֹרֶה מְאֹד
  choice: అత్యంత తీవ్రమైంది
  rationale: కఠినమైన హెబ్రీ పదబంధం ఇశ్రాయేలు బాధ తీవ్రతను పెంచి చెబుతుందని స్పష్టం చేస్తూ, అనిశ్చితిని పాదసూచికలో ఉంచుతుంది.
- source_word: אֶפֶס
  choice: ఎవడూ మిగలలేదు
  rationale: తర్వాతి జంట పదాలతో కలిసి సంపూర్ణ లేమిని సూచించే బలమైన నిరాకరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָצוּר
  choice: బంధింపబడినవాడు
  rationale: మూలంలోని ‘నిర్బంధించబడిన/ఆపబడిన’ భావాన్ని నిలుపుతుంది; జంటపదం యొక్క ఖచ్చితమైన నుడికారం అనిశ్చితమైనందున వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: עָזוּב
  choice: విడిచిపెట్టబడినవాడు
  rationale: పదానికి సాధారణమైన ‘వదిలివేయబడిన’ భావాన్ని నిలుపుతూ עָצוּר తో ఉన్న మూల జంటను కాపాడుతుంది.
- source_word: עֹזֵר
  choice: సహాయం చేసేవాడు
  rationale: క్రియాత్మక కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: עָצוּר וְעָזוּב అనే కఠినమైన జంటపదం
  choice: బంధింపబడినవాడుగానీ విడిచిపెట్టబడినవాడుగానీ ఎవడూ మిగలలేదు
  alternative: బానిసగానీ స్వతంత్రుడుగానీ ఎవడూ లేడు; నిర్బంధితుడుగానీ విడుదలైనవాడుగానీ ఎవడూ లేడు
  rationale: పదాల రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, సందర్భంలో ఎవరూ మిగలని సంపూర్ణ దురవస్థను సూచించే నుడికార శక్తిని ప్రధాన వాక్యంలో స్పష్టం చేస్తుంది. సామాజిక వర్గాల గురించి ఖచ్చితమైన సిద్ధాంతార్థాన్ని రుద్దదు.
- issue: מֹרֶה מְאֹד యొక్క అర్థం
  choice: అత్యంత తీవ్రమైంది
  alternative: చాలా చేదుగా ఉంది; అత్యంత దుర్భరంగా ఉంది
  rationale: మూలరూపం పాఠ్యపరంగా, పదార్థపరంగా కఠినమైనది. సందర్భానికి సరిపోయే బాధ తీవ్రతను తెలుపుతూ, ‘తిరుగుబాటు’ అనే అసంభావ్య భావాన్ని ప్రధాన పాఠ్యంలో రుద్దకుండా ప్రత్యామ్నాయ నుడికారాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వచనశైలి. మూలంలోని వరుస వాక్యప్రవాహాన్ని నిలుపుతూ, కఠినమైన రెండు హెబ్రీ పదబంధాల అనిశ్చితిని పాదసూచికల్లో స్పష్టంగా పరిరక్షించాం.
