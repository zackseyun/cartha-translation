  source_fidelity: 'హీబ్రూ వచనంలోని ప్రధాన సంబంధాలు సరిగ్గా ప్రతిఫలించాయి: ఇశ్రాయేలు రాజైన యెహోయాషు అమజ్యాను బేత్షెమెషులో బందీగా పట్టుకున్నాడు; తరువాత యెరూషలేము ప్రాకారంలో ఎఫ్రాయిము ద్వారం నుండి మూల ద్వారం వరకు నాలుగు వందల మూరల విస్తీర్ణాన్ని పడగొట్టాడు. בֶּן ... בֶּן ... వంశావళి పునరుక్తి కూడా నిలుపబడింది. వ్యంజన పాఠంలోని బహువచన ‘వారు వచ్చారు’కు బదులుగా సందర్భానుసారమైన ఏకవచన భావాన్ని అనువదించిన విషయం పాదసూచికలో పారదర్శకంగా సూచించబడింది.'
