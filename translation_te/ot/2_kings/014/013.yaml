translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ఒకే పేరుగల ఇద్దరు వ్యక్తుల వల్ల కలిగే అస్పష్టతను తగ్గించడానికి రెండవ వాక్యానంతరం ‘ఇశ్రాయేలు రాజు’ అని మళ్లీ పేర్కొనబడింది; హీబ్రూ వంశావళి నిర్మాణం మాత్రం నిలిపివేయబడింది.
