source:
  edition: WLC
  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన యెహోయాషు బేత్షెమెషులో యూదా రాజైన అమజ్యాను బందీగా పట్టుకున్నాడు. అమజ్యా యెహోయాషు కుమారుడు, అహజ్యా కుమారుడు. తరువాత ఇశ్రాయేలు రాజు యెరూషలేముకు వచ్చి[a], ఎఫ్రాయిము ద్వారం మొదలుకొని మూల ద్వారం వరకు యెరూషలేము ప్రాకారాన్ని నాలుగు వందల మూరల మేర పడగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వ్యంజన పాఠంలో ‘వారు యెరూషలేముకు వచ్చారు’ అని ఉంది. అయితే సందర్భం, ఆ తరువాత వచ్చే ఏకవచన క్రియ ‘పడగొట్టాడు’—ఇవి ఇశ్రాయేలు రాజైన యెహోయాషును సూచిస్తూ ‘అతడు వచ్చాడు’ అనే భావానికి మద్దతిస్తున్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: బందీగా పట్టుకున్నాడు
  rationale: యుద్ధానంతరం ఒక రాజును పట్టుకోవడాన్ని సూచించే సందర్భంలో, కేవలం ‘పట్టుకున్నాడు’ కంటే ‘బందీగా పట్టుకున్నాడు’ సైనిక భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: బేత్షెమెషులో
  rationale: בְ అనే స్థానార్థక ఉపసర్గను తెలుగు స్థలనామంతో సహజంగా ‘-లో’ రూపంలో అందించింది.
- source_word: ו/יבאו
  choice: తరువాత ఇశ్రాయేలు రాజు ... వచ్చి
  rationale: హీబ్రూ వ్యంజన పాఠం బహువచనంగా ఉన్నప్పటికీ, వెంట వచ్చే ఏకవచన క్రియ మరియు కథన కేంద్రము యెహోయాషునే సూచిస్తున్నాయి. ఇద్దరి పేర్లు యెహోయాషు కావడం వల్ల తెలుగులో ‘అతడు’కు బదులు ‘ఇశ్రాయేలు రాజు’ అని స్పష్టం చేసింది; పాఠభేదాన్ని పాదసూచికలో నిలిపింది.
- source_word: וַיִּפְרֹץ
  choice: పడగొట్టాడు
  rationale: ప్రాకారంలో గండి చేయడం లేదా దాని భాగాన్ని కూల్చడం అనే భావాన్ని ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: యెరూషలేము ప్రాకారాన్ని
  rationale: హీబ్రూలోని ఉపసర్గను యథాతథంగా అనుకరించకుండా, తెలుగు క్రియా నిర్మాణానికి అనుగుణంగా ప్రాకారాన్ని ప్రత్యక్ష కర్మగా ఇచ్చింది.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: ఎఫ్రాయిము ద్వారం మొదలుకొని మూల ద్వారం వరకు
  rationale: ప్రాకారం కూల్చబడిన విస్తృతిని తెలిపే ‘నుండి ... వరకు’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַפִּנָּה
  choice: మూల
  rationale: ద్వారం యొక్క ప్రత్యేక నామంలో ‘corner’ భావానికి సాధారణంగా అర్థమయ్యే గౌరవప్రదమైన తెలుగు పదం.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: నాలుగు వందల మూరల మేర
  rationale: ప్రాచీన కొలమానాన్ని మార్చకుండా ‘మూర’గా నిలిపి, అది కూల్చిన భాగపు పొడవని ‘మేర’ ద్వారా స్పష్టం చేసింది.
- source_word: בֶּן ... בֶּן ...
  choice: యెహోయాషు కుమారుడు, అహజ్యా కుమారుడు
  rationale: ‘కుమారుడు’ అనే హీబ్రూ వంశావళి పదాన్ని రెండుసార్లూ నిలిపి, ‘మనుమడు’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
