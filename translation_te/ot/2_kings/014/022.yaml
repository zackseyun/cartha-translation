  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: te
  text: రాజు తన పూర్వీకులతో నిద్రించిన తరువాత, అతడే ఏలతును పునర్నిర్మించి, దానిని యూదాకు తిరిగి చేర్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: తిరిగి కట్టి
  rationale: సాధారణ అర్థం ‘కట్టాడు’; అయితే ఏలతు అప్పటికే ఉన్న పట్టణం కావడం వల్ల సందర్భానుసారంగా పునర్నిర్మాణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵילַת
  choice: ఏలతు
  rationale: హీబ్రూ స్థలనామానికి సమీపమైన, తెలుగులో సులభంగా పలకగల రూపం.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: దానిని యూదాకు తిరిగి చేర్చాడు
  rationale: హిఫీల్ క్రియలోని ‘తిరిగి తీసుకురావడం/అప్పగించడం’ భావాన్ని కాపాడుతూ, ప్రాంతీయ-రాజకీయ సందర్భంలో సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకుంది.
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: తన పూర్వీకులతో నిద్రించిన
  rationale: మరణాన్ని సూచించే హీబ్రూ సౌమ్యోక్తిని యథాశక్తి నిలుపుతుంది; ‘తండ్రులు’ అనే అక్షరార్థం కంటే వంశపూర్వీకులను సూచించే ‘పూర్వీకులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ‘రాజు తన పూర్వీకులతో నిద్రించాడు’ అనే మరణ సౌమ్యోక్తి
  choice: సౌమ్యోక్తిని పాఠ్యంలో నిలుపడం
  alternative: ‘రాజు చనిపోయిన తరువాత’
  rationale: మూలంలోని వంశసంబంధిత, గౌరవప్రదమైన మరణవ్యక్తీకరణను నేరుగా ‘చనిపోయాడు’గా మార్చకుండా కాపాడుతుంది; దీనికి అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
- issue: ప్రారంభంలోని הוּא ఇచ్చే ఉద్ఘాటన
  choice: ‘అతడే’
  alternative: ‘అతడు’
  rationale: హీబ్రూ స్వతంత్ర సర్వనామం ఇచ్చే స్వల్ప ఉద్ఘాటనను తెలుగులో నిలుపుతుంది; వ్యక్తి గుర్తింపును సందర్భానికే వదిలి, పేరు చేర్చి అస్పష్టతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వచనం. మూలంలోని మరణ సౌమ్యోక్తి మరియు సర్వనామ సూచనను నిలిపి, ఏ వ్యక్తి పేరునూ వివరణాత్మకంగా చేర్చలేదు.
