source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: యెహోయాషు చేసిన మిగిలిన కార్యాలు, అతని పరాక్రమం, యూదా రాజైన అమజ్యాతో అతడు ఎలా యుద్ధం చేశాడో[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[b] రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదా రాజైన అమజ్యాను ఎదిరించి అతడు ఎలా యుద్ధం చేశాడో.’ హీబ్రూ పూర్వప్రత్యయం అక్షరార్థంగా ‘తో’ అని ఉన్నా, ఈ సైనిక సందర్భంలో అది శత్రువుకు వ్యతిరేకంగా పోరాడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలు రాజుల వార్షిక చరిత్రల గ్రంథంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ אֲשֶׁר עָשָׂה
  choice: యెహోయాషు చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల గ్రంథంలోని సాంప్రదాయ రాజ్యపాలనా-సారాంశ సూత్రంలో דְּבָרִים అంటే కేవలం మాటలు కాదు, రాజు చేసిన కార్యాలు లేదా అతనికి సంబంధించిన విషయాలు. సంబంధవాచక వాక్యాన్ని సహజమైన తెలుగులో ఈ పదబంధంలో కలిపాం; మూలంలో లేని ‘అన్నీ’ అనే భావాన్ని విడిగా చేర్చలేదు.
- source_word: וּגְבוּרָתוֹ
  choice: అతని పరాక్రమం
  rationale: גְּבוּרָה బలం, శౌర్యం, వీరోచిత కార్యాలు అనే విస్తృత భావాలను కలిగి ఉంది. ఇక్కడ రాజు యొక్క, ముఖ్యంగా సైనికమైన, సామర్థ్యాన్ని సూచించేందుకు ‘పరాక్రమం’ సహజమైన గౌరవప్రద పదం.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: అతడు ఎలా ... తో యుద్ధం చేశాడో
  rationale: עִם అక్షరార్థంగా ‘తో’; యుద్ధ సందర్భంలో ప్రత్యర్థిత్వాన్ని సూచిస్తుంది. తెలుగు ‘తో యుద్ధం చేశాడు’ మూల నిర్మాణాన్ని కాపాడుతూ సందర్భంలో శత్రుత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన అమజ్యా
  rationale: రాజబిరుదుతో కూడిన పేరును ఆధునిక తెలుగులో సహజమైన విశేషణ నిర్మాణంగా ఇచ్చాం.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాసి ఉన్నాయి కదా?
  rationale: హీబ్రూ అలంకారప్రశ్నను తెలుగు సంభాషణాత్మకమైనప్పటికీ గౌరవప్రదమైన ‘కదా?’ నిర్మాణంతో నిలిపాం.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో
  rationale: ఇది రాజుల పాలనకు సంబంధించిన వార్షిక చారిత్రక నమోదును సూచించే గ్రంథనామం. ‘దినవృత్తాంతాలు’ మూలంలోని ‘దినాల విషయాలు’ అనే రూపకాన్ని, రాజవంశ చరిత్రల భావాన్ని రెండింటినీ అందిస్తుంది.
