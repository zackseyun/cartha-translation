translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, రాజవృత్తాంతానికి తగిన గౌరవప్రద శైలి. మూలంలోని అలంకారప్రశ్నను నిలిపి, యుద్ధసంబంధ పూర్వప్రత్యయంలోని స్వల్ప పదార్థ భేదాన్ని పాదసూచికలో తెలిపాం.
