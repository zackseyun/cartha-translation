translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన రాజవంశ వృత్తాంత శైలిని ఉపయోగించాం. మూలంలోని మూడు వివరాలు—రాజ్యారోహణ వయస్సు, పాలనాకాలం మరియు స్థలం, తల్లి పేరు మరియు ఆమె మూలస్థానం—స్పష్టంగా నిలుపబడ్డాయి. పాదసూచిక గుర్తును అది వివరిస్తున్న వ్యక్తినామం దగ్గర ఉంచాం.
