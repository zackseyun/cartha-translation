source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יהועדין מִן יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: te
  text: అతడు రాజైనప్పుడు ఇరవై ఐదు సంవత్సరాలవాడు. యెరూషలేములో ఇరవై తొమ్మిది సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెహోయద్దీను[a]; ఆమె యెరూషలేముకు చెందినది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అనేక సంప్రదాయ అనువాదాల్లో ఈ పేరు ‘యెహోయద్దాను’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ఇరవై ఐదు సంవత్సరాలవాడు
  rationale: ఇది వయస్సును తెలిపే సాధారణ హీబ్రూ నుడికారం. పదశః అనువాదం తెలుగులో అసహజంగా ఉంటుంది; ఈ రూపం భావాన్ని సహజంగా, కచ్చితంగా తెలియజేస్తుంది.
- source_word: הָיָה בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: రాజ్యారోహణ సమయాన్ని తెలిపే హీబ్రూ రాజవంశ సూత్రానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: ఇరవై తొమ్మిది సంవత్సరాలు పరిపాలించాడు
  rationale: מלך అనే క్రియ ఇక్కడ రాజుగా పాలించిన కాలాన్ని సూచిస్తుంది; ‘పరిపాలించాడు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: స్థానార్థక ఉపసర్గను నేరుగా వ్యక్తం చేస్తుంది; ప్రాచుర్యంలో ఉన్న తెలుగు స్థలనామ రూపాన్ని ఉపయోగించింది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ గుర్తింపు సూత్రంలోని సమాచారాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יהועדין
  choice: యెహోయద్దీను
  rationale: WLCలోని మసొరెటిక్ స్వరరూపాన్ని అనుసరించిన లిప్యంతరీకరణ. సంప్రదాయ ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: מִן יְרוּשָׁלָם
  choice: ఆమె యెరూషలేముకు చెందినది
  rationale: מן మూలం లేదా అనుబంధాన్ని సూచిస్తుంది. ఈ మాతృపరిచయ సూత్రంలో ‘యెరూషలేముకు చెందినది’ అనేది ‘యెరూషలేము నుండి వచ్చినది’ కంటే సహజంగా ఉండి, మూలంలోని సంబంధాన్ని కాపాడుతుంది.
