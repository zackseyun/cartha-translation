translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. ‘ఎదుట’ ద్వారా హెబ్రీ לִפְנֵי నిర్మాణం నిలుపబడింది; ‘గుడారం’ అనే మూల ప్రతిమను ప్రధాన పాఠ్యంలో ఉంచి, నానుడి భావాన్ని పాదటిప్పణిలో వివరించాం.
