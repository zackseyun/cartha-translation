  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: te
  text: ఇశ్రాయేలు చేతిలో యూదా ఓడిపోయింది; ప్రతి మనిషి తన గుడారానికి పారిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి ఒక్కరూ తమ తమ ఇళ్లకు పారిపోయారు.” హెబ్రీలో అక్షరార్థంగా, “ప్రతి మనిషి తన గుడారానికి” అని ఉంది; ఇది ఎవరి నివాసానికి వారు చెదరిపోవడాన్ని తెలిపే సాధారణ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: ఓడిపోయింది
  rationale: נָגַף నిఫాల్ రూపం ఇక్కడ యుద్ధంలో పరాజయం పొందడాన్ని సూచిస్తుంది; ‘ఓడిపోయింది’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: దక్షిణ రాజ్యానికి తెలుగులో ప్రామాణికంగా వాడే పేరు.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: యుద్ధ సందర్భంలో ప్రత్యర్థి సమక్షంలో లేదా అతని చేతిలో ఓడిపోవడం అనే భావాన్ని హెబ్రీ నిర్మాణానికి దగ్గరగా నిలుపుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఉత్తర రాజ్యానికి తెలుగులో ప్రామాణికంగా వాడే పేరు.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయాడు
  rationale: נוּס అంటే పారిపోవడం; పంపిణీ ఏకవచనమైన אִישׁ‌తో అన్వయించేందుకు తెలుగులో ఏకవచన క్రియను వాడాం.
- source_word: אִישׁ
  choice: ప్రతి మనిషి
  rationale: పంపిణీ భావంగల ఏకవచనాన్ని, అలాగే మూలంలోని పురుష సూచనను నిలుపుతుంది.
- source_word: לְאָהֳלוֹ
  choice: తన గుడారానికి
  rationale: అక్షరార్థంగా ‘అతని గుడారానికి’; తెలుగులో కర్తను తిరిగి సూచించే సహజ రూపంగా ‘తన’ వాడి, హెబ్రీ ప్రతిమను నిలిపాం.
