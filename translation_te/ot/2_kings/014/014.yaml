source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת כָּל הַ/זָּהָב וְ֠/הַ/כֶּסֶף וְ/אֵ֨ת כָּל הַ/כֵּלִ֜ים הַ/נִּמְצְאִ֣ים בֵּית יְהוָ֗ה וּ/בְ/אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹנָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: te
  text: అతడు బంగారమంతటినీ వెండినంతటినీ, యెహోవా మందిరంలోనూ రాజభవనపు ఖజానాల్లోనూ దొరికిన వస్తువులన్నిటినీ, పూచీగా ఉంచబడినవారినీ[a] తీసుకొని సమరయకు తిరిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పూచీల కుమారులు’ లేదా ‘పూచీదారుల కుమారులు’; బహుశా భద్రత కోసం పట్టి ఉంచిన వ్యక్తులను, అంటే బందీలను, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: అతడు ... తీసుకొని
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు సంయుక్త క్రియ నిర్మాణంలో వ్యక్తం చేస్తుంది; కర్తను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: బంగారమంతటినీ వెండినంతటినీ
  rationale: כָּל సూచించే సంపూర్ణతను రెండు విలువైన లోహాలకూ స్పష్టంగా నిలుపుతుంది.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: దొరికిన వస్తువులన్నిటినీ
  rationale: כֵּלִים విస్తృతార్థక పదం; ఆలయ, రాజభవన సామగ్రి రెండింటికీ సరిపోయే సహజమైన ఆధునిక తెలుగు పదంగా ‘వస్తువులు’ ఎంచుకున్నాం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థంగా ‘యెహోవా ఇల్లు’; ఈ సందర్భంలో ఆలయాన్ని సూచిస్తున్నందున తెలుగులో స్పష్టమైన ‘మందిరం’ వాడబడింది, దైవనామం యెహోవాగా నిలుపబడింది.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: రాజభవనపు ఖజానాల్లో
  rationale: ‘రాజు ఇంటి ఖజానాలు’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: పూచీకత్తుగా ఉంచబడినవారిని
  rationale: కఠినమైన హీబ్రూ ప్రయోగం అక్షరార్థంగా ‘పూచీల కుమారులు’ లేదా ‘పూచీదారుల కుమారులు’; సందర్భంలో భద్రతగా నిర్బంధించిన వ్యక్తులను సూచించే భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: సమరయకు తిరిగివెళ్లాడు
  rationale: שׁוב యొక్క తిరుగు భావాన్నీ, స్థలదిశను సూచించే రూపాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క రూపం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని అనువాదంలో ప్రత్యక్షంగా నిలుపుతూ, సాధారణ బిరుదుతో భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మందిరం,’ ‘రాజభవనం,’ ‘ఖజానాలు’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకున్నాం; క్లిష్టమైన బందీల పదబంధంలోని మూలభాషా అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
