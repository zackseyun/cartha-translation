source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: te
  text: అతడు యెహోవా దృష్టిలో సరైనది చేశాడు. అయితే తన పూర్వికుడైన దావీదు వలె కాదు[a]; తన తండ్రియైన యోవాషు చేసినదంతా అతడు చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “పూర్వికుడు” అంటే అమజ్యా తక్షణ తండ్రి కాదు; అతని వంశపూర్వికుడైన దావీదును సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: “అయితే” అనే చోట హీబ్రూ పదాన్ని మరింత అక్షరార్థంగా “కేవలం—తన పూర్వికుడైన దావీదు వలె కాదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: సరైనది చేశాడు
  rationale: రాజుల ప్రవర్తనను అంచనా వేసే సాధారణ సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: దైవిక అంచనాను సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది; దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: רַק
  choice: అయితే
  rationale: ముందున్న సానుకూల అంచనాకు పరిమితిని చేర్చే వ్యతిరేక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘కేవలం’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: తన పితరుడైన దావీదులా కాదు
  rationale: దావీదుతో పోలికలోని లోపాన్ని నిలుపుతుంది. ఇక్కడ אָבִיו తక్షణ తండ్రిని కాక వంశపూర్వికుణ్ణి సూచిస్తున్నందున ‘పితరుడు’ ఎంచుకోబడింది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה יוֹאָשׁ אָבִיו עָשָׂה
  choice: తన తండ్రి యోవాషు చేసినదంతా చేసినట్లే అతడు చేశాడు
  rationale: כְּכֹל యొక్క సమగ్ర పోలికను నిలుపుతూ, యోవాషు మునుపు చేసిన క్రియలతో అమజ్యా ప్రవర్తనను సహజమైన తెలుగులో పోలుస్తుంది.
- source_word: יוֹאָשׁ
  choice: యోవాషు
  rationale: హీబ్రూ יוֹאָשׁ రూపానికి దగ్గరైన, తెలుగులో సులభంగా చదవదగిన లిప్యంతరీకరణ.
theological_decisions:
- issue: రాజుపై సానుకూల అంచనా మరియు దానికి విధించిన పరిమితి
  choice: అమజ్యా యెహోవా దృష్టికి సరైనది చేశాడని నిజమైన ప్రశంసను తెలిపి, వెంటనే అతడు దావీదు ప్రమాణానికి చేరలేదని, యోవాషు చేసినట్లే చేశాడని పరిమితం చేయడం
  alternative: ప్రారంభ ప్రశంసను తగ్గించి మొత్తం వాక్యాన్ని ప్రతికూలంగా చదవడం, లేదా దావీదుతో వ్యత్యాసాన్ని తగ్గించి మరింత బలమైన ప్రశంసగా చదవడం
  rationale: హీబ్రూ వాక్యనిర్మాణం మొదట సానుకూల అంచనాను ఇచ్చి, רַק ద్వారా దానిని పరిమితం చేస్తుంది. అనువాదం ఈ రెండు అంశాల మధ్య ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. దావీదుకు వంశసంబంధ అర్థంలో ‘పితరుడు’, యోవాషుకు తక్షణ సంబంధంలో ‘తండ్రి’ వాడి హీబ్రూ אָבִיו యొక్క సందర్భానుసార భావభేదాన్ని స్పష్టం చేసింది.
