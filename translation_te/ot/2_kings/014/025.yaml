  to: అతడు లెబో-హమాతు[a] నుండి అరాబా సముద్రం[b] వరకు ఇశ్రాయేలు సరిహద్దును పునరుద్ధరించాడు. ఇశ్రాయేలు దేవుడైన యహ్వే తన సేవకుడైన, గాత్-హేఫెరుకు చెందిన అమిత్తయి కుమారుడైన యోనా ప్రవక్త ద్వారా పలికిన మాట ప్రకారం అతడు ఇలా చేశాడు.
