id: 2KI.14.25
reference: 2 Kings 14:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: te
  text: అతడు లెబో-హమాతు[a] నుండి అరాబా సముద్రం[b] వరకు ఇశ్రాయేలు సరిహద్దును పునరుద్ధరించాడు. ఇశ్రాయేలు దేవుడైన యహ్వే తన సేవకుడైన, గాత్-హేఫెరుకు చెందిన అమిత్తయి కుమారుడైన యోనా ప్రవక్త ద్వారా పలికిన మాట ప్రకారం అతడు ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “హమాతు ప్రవేశద్వారం నుండి.”
    reason: lexical_alternative
  - marker: b
    text: ఇది బహుశా మృత సముద్రాన్ని సూచిస్తుంది.
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: మళ్లీ నెలకొల్పాడు
  rationale: హిఫిల్ రూపం ఇక్కడ ఇశ్రాయేలు పూర్వపు భౌగోళిక సరిహద్దును పునరుద్ధరించడాన్ని సూచిస్తుంది; తెలుగు సహజత్వంతో రాజకీయ-భౌగోళిక భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: దేశపు భౌగోళిక హద్దును స్పష్టంగా తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: מִלְּבוֹא חֲמָת
  choice: లెబో-హమాతు
  rationale: ఈ పదబంధం స్థలనామంగా వాడబడే అవకాశాన్ని ప్రధాన పాఠంలో కాపాడుతుంది; అక్షరార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: יָם הָעֲרָבָה
  choice: అరాబా సముద్రం
  rationale: మృత సముద్రం అనే సంభావ్య గుర్తింపును ప్రధాన పాఠంలో ఖరారు చేయకుండా హెబ్రీ భౌగోళిక వ్యక్తీకరణను నిలుపుతుంది.
- source_word: כִּדְבַר
  choice: మాట ప్రకారమే
  rationale: ముందుగా పలికిన దైవవాక్యానికి అనుగుణంగా సంఘటన జరిగిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరిస్తుంది.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: ఇక్కడ ప్రవక్త దైవవాక్యాన్ని అందించిన సాధనం లేదా ప్రతినిధి అనే హెబ్రీ నుడికార భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుడు
  rationale: ప్రవక్తకు దేవునితో ఉన్న విధేయత, నియామక సంబంధాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: הַנָּבִיא
  choice: ప్రవక్త
  rationale: యోనా పాత్రను తెలిపే ప్రత్యక్ష సమానార్థక పదం.
- source_word: מִגַּת הַחֵפֶר
  choice: గాత్-హేఫెరుకు చెందిన
  rationale: מן సూచించే మూలస్థల భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా కాపాడుతుంది.
- issue: יָם הָעֲרָבָה యొక్క భౌగోళిక గుర్తింపు
  choice: అరాబా సముద్రం
  alternative: మృత సముద్రం
  rationale: మూల హెబ్రీ వ్యక్తీకరణను ప్రధాన పాఠంలో ఉంచి, సాధారణంగా అంగీకరించే గుర్తింపును పాదసూచికలో మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్య నిర్మాణాన్ని యథాతథంగా అనుకరించకుండా, భావ సంబంధాలను స్పష్టంగా ఉంచేందుకు చివరి భాగాన్ని సహజ తెలుగు క్రమంలో అమర్చాం. మూలంలోని స్థలనామాలు, దైవనామం, భౌగోళిక అనిశ్చితి కాపాడబడ్డాయి.
