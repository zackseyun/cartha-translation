  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֲזַרְיָ֔ה וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣כוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: te
  text: అప్పుడు యూదా ప్రజలందరూ పదహారేళ్ల అజర్యాను తీసుకొని, అతని తండ్రి అమజ్యా స్థానంలో అతన్ని రాజుగా చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అజర్యాను ఇతర చోట్ల ఉజ్జియా అని కూడా పిలుస్తారు; ఇక్కడి హెబ్రీ పాఠంలో ‘అజర్యా’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమిక అర్థం ‘తీసుకొను’. రాజ్యాభిషేక సందర్భంలో ప్రజలు అజర్యాను ముందుకు తీసుకువచ్చి రాజుగా చేసిన చర్యను ఇది సహజంగా తెలియజేస్తుంది; ‘ఎన్నుకొని’ అనడం మూలంలో లేని ఎన్నిక భావాన్ని జోడించవచ్చు.
- source_word: כָּל עַם יְהוּדָה
  choice: యూదా ప్రజలందరూ
  rationale: మూలంలోని ‘యూదా ప్రజలందరూ’ అనే సమష్టి రాజకీయ కర్తృత్వాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: ఈ వచనంలోని హెబ్రీ పాఠంలో ఉన్న పేరురూపాన్నే అనుసరించాం; ఇతర చోట్ల కనిపించే ఉజ్జియా అనే పేరును పాదసూచికలో తెలిపాం.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: పదహారేళ్ల అజర్యాను
  rationale: అతని వయస్సును సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో సంక్షిప్తంగా తెలిపి, మూలంలోని వివరణాత్మక సమాచారాన్ని కాపాడుతుంది.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: అతన్ని రాజుగా చేశారు
  rationale: מלך హిఫీల్ రూపం ‘అతడు రాజ్యమేలేలా చేయడం’, అంటే ‘రాజుగా చేయడం’ అని అర్థం. ‘పట్టాభిషేకం చేశారు’ అనడం మూలంలో స్పష్టంగా లేని వేడుకను జోడించవచ్చు.
- source_word: תַּחַת אָבִיו
  choice: అతని తండ్రి ... స్థానంలో
  rationale: రాజవంశ వారసత్వ సందర్భంలో תחת పూర్వ రాజు స్థానాన్ని స్వీకరించడాన్ని సూచిస్తుంది; కేవలం కాలక్రమాన్ని సూచించే ‘తర్వాత’ కంటే ‘స్థానంలో’ మరింత ఖచ్చితం.
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: హెబ్రీ వ్యక్తిపేరుకు అనుగుణమైన, తెలుగులో చదవడానికి సహజమైన లిప్యంతరీకరణ.
