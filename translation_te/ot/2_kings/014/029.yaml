  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: te
  text: యెరోబాము తన పూర్వీకులతో, ఇశ్రాయేలు రాజులతో నిద్రించాడు[a][b]; అతని కుమారుడు జెకర్యా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పూర్వీకులతో పడుకున్నాడు”; ఇది రాజు మరణాన్ని తెలిపే సాంప్రదాయ హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలు రాజుల మధ్య.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ‘తన పూర్వీకులతో కూడ నిద్రించాడు’ అనేది రాజు మరణాన్ని తెలిపే స్థిరమైన హీబ్రూ ప్రయోగం. ‘చనిపోయాడు’ అనే వివరణాత్మక అనువాదానికి బదులు మూలంలోని సాహిత్య రూపాన్ని నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పూర్వీకులతో కూడ
  rationale: ఆధునిక తెలుగులో ‘పితరులు’ కంటే ‘పూర్వీకులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, వంశపూర్వులనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులతో కూడ
  rationale: మూలంలో పునరావృతమైన עִם (‘తో/కూడ’) నిర్మాణాన్ని నిలుపుతూ, మరణం లేదా సమాధి విషయంలో అతణ్ణి ఇశ్రాయేలు రాజులతో అనుసంధానిస్తుంది. ‘రాజుల మధ్య’ అనే అర్థసంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: రాజుగా పరిపాలించాడనే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపం.
- source_word: בְנוֹ
  choice: అతని కుమారుడైన
  rationale: పుత్ర సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వ సందర్భంలో, ముందున్న రాజు స్థానాన్ని కుమారుడు చేపట్టాడనే భావాన్ని నేరుగా తెలియజేస్తుంది.
