  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: te
  text: వారు అతణ్ణి గుర్రాలపై తీసుకువెళ్లారు[a]. అతడు యెరూషలేములోని దావీదు నగరంలో తన పితరులతో పాటు పాతిపెట్టబడ్డాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘గుర్రాల మీద.’ మృతదేహాన్ని గుర్రాల సహాయంతో లేదా గుర్రాలపై ఏర్పాటు చేసిన వాహనంలో తరలించారని ఈ హెబ్రీ పదబంధం సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన పితరులతో పాటు’ అనేది రాజవంశ సమాధిని సూచించే సాంప్రదాయ వాక్యప్రయోగం; అతడు తన రాజవంశ పూర్వీకుల సమాధి స్థలంలో పాతిపెట్టబడ్డాడని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: వారు అతణ్ణి తీసుకువెళ్లారు
  rationale: נשׂא ఇక్కడ ‘మోయడం/తీసుకువెళ్లడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో మృతదేహాన్ని తరలించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘తీసుకువెళ్లారు’ ఎంచుకున్నాం.
- source_word: עַל הַסּוּסִים
  choice: గుర్రాలపై
  rationale: עַל అనే పూర్వప్రత్యయం యొక్క ‘మీద/పై’ భావాన్ని నిలుపుతూ, రవాణా జరిగిన ఖచ్చిత విధానాన్ని నిర్ణయించకుండా హెబ్రీ పదబంధంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: וַיִּקָּבֵר
  choice: పాతిపెట్టబడ్డాడు
  rationale: నిఫల్ రూపంలోని కర్మణి ప్రయోగాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בִּירוּשָׁלִַם ... בְּעִיר דָּוִד
  choice: యెరూషలేములోని దావీదు నగరంలో
  rationale: దావీదు నగరం యెరూషలేములో ఉన్న నిర్దిష్ట సమాధి స్థలమని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో పాటు
  rationale: సాంప్రదాయ రాజవంశ సమాధి సూత్రంలోని కుటుంబ-వంశ భావాన్ని నిలుపుతుంది; ‘పూర్వీకులు’ అని పూర్తిగా వ్యాఖ్యానాత్మకంగా మార్చదు.
