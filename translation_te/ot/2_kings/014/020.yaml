translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘గుర్రాలపై’ అనే మూలభాషా రూపాన్ని ప్రధాన వాక్యంలో ఉంచి, రవాణా విధానంలోని అస్పష్టతను పాదటిప్పణిలో వివరించాం. ‘పితరులు’ అనే బైబిలు-సాంస్కృతిక పదాన్ని నిలుపుతూ దాని అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
