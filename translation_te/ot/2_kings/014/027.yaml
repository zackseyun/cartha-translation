revisions:
- from: అయితే ఇశ్రాయేలు పేరును ఆకాశం కింద నుండి తుడిచివేస్తానని[a] యెహోవా చెప్పలేదు. అందువల్ల యోవాషు కుమారుడైన యెరోబాము చేతి ద్వారా[b] ఆయన వారిని రక్షించాడు.
