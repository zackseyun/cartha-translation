reference: 2 Kings 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא דִבֶּ֣ר יְהוָ֔ה לִ/מְחוֹת֙ אֶת שֵׁ֣ם יִשְׂרָאֵ֔ל מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וַ/יּ֣וֹשִׁיעֵ֔/ם בְּ/יַ֖ד יָרָבְעָ֥ם בֶּן יוֹאָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు పేరును ఆకాశం కిందనుండి తుడిచివేస్తానని[a] యెహోవా చెప్పలేదు; యోవాషు కుమారుడైన యెరోబాము చేత[b] ఆయన వారిని రక్షించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తుడిచివేయడం’కు ‘పూర్తిగా తొలగించడం’ లేదా ‘చెరిపివేయడం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘చేత’ అనేది ‘ద్వారా’ లేదా ‘సాధనంగా ఉపయోగించి’ అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన సంప్రదాయ రూపంలో ఉంచింది.
- source_word: דִבֶּר
  choice: చెప్పలేదు
  rationale: דבר యొక్క సాధారణ అర్థమైన ‘చెప్పు/మాట్లాడు’ను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి రక్షణ కార్యానికి ముందు ఉన్న దైవ ప్రకటనను సందర్భం స్పష్టం చేస్తుంది.
- source_word: לִמְחוֹת
  choice: తుడిచివేస్తానని
  rationale: מחה ఇక్కడ పూర్తిగా తొలగించడం లేదా నిర్మూలించడం అనే భావాన్ని ఇస్తుంది. ‘పేరు’తో కలిసి ‘తుడిచివేయడం’ అనే రూపకం తెలుగులోనూ స్పష్టంగా ఉంటుంది.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పేరును
  rationale: హీబ్రూ పదబంధాన్ని దగ్గరగా నిలుపుతూ, ఇశ్రాయేలు ఉనికి మరియు గుర్తింపును పూర్తిగా తొలగించడమనే విస్తృత భావాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ఆకాశం కింద నుండి
  rationale: మానవ లోకం నుండి పూర్తిగా తొలగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని వ్యాఖ్యానించి ‘భూమి మీద నుండి’ అని మార్చకుండా నిలుపుతుంది.
- source_word: וַיּוֹשִׁיעֵם
  choice: ఆయన వారిని రక్షించాడు
  rationale: Hifil రూపంలోని ישעకు తగిన ‘రక్షించాడు’ అనే అర్థాన్ని నిలుపుతుంది; రక్షణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בְּיַד
  choice: చేతి ద్వారా
  rationale: హీబ్రూ ‘చేతి ద్వారా’ అనే కర్తృత్వ నుడికారాన్ని నిలుపుతూ, యెరోబాము యెహోవా ఉపయోగించిన మానవ సాధనమని తెలియజేస్తుంది.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: యోవాషు కుమారుడైన యెరోబాము
  rationale: వ్యక్తి పేర్లకు ప్రామాణిక తెలుగు బైబిలు రూపాలను ఉపయోగించి, తండ్రి ద్వారా గుర్తింపును సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు సంరక్షణలో దేవుని సంకల్పం మరియు కార్యం
  choice: యెహోవా ఇశ్రాయేలును తుడిచివేయాలని ప్రకటించలేదు; అందువల్ల యెరోబామును సాధనంగా ఉపయోగించి వారిని రక్షించాడు.
  alternative: రెండు వాక్యభాగాలను కారణ సంబంధాన్ని స్పష్టం చేయకుండా కేవలం ‘మరియు’తో కలపవచ్చు.
  rationale: హీబ్రూ వాక్యం ఇశ్రాయేలును తుడిచివేయాలనే ప్రకటన లేకపోవడాన్ని, తరువాత యెరోబాము ద్వారా జరిగిన రక్షణతో అనుసంధానిస్తుంది. ‘అందువల్ల’ సందర్భంలోని ఫలిత సంబంధాన్ని సహజమైన తెలుగులో తెలుపుతుంది; అదే సమయంలో లోపాలున్న రాజు ద్వారా దేవుడు రక్షించాడనే పాఠ్యంలోని ఉద్రిక్తతను తీర్పు చెప్పకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ఇశ్రాయేలు పేరు’, ‘ఆకాశం కింద’, ‘చేతి ద్వారా’ వంటి మూలభాషా రూపకాలను అర్థగ్రాహ్యంగా నిలిపి, అవసరమైన చోట పాదటిప్పణులతో వివరించింది.
