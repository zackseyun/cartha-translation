  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: te
  text: యెహోయాషు తన పితరులతో నిద్రించాడు[a]. అతడు ఇశ్రాయేలు రాజులతో పాటు సమరయలో సమాధి చేయబడ్డాడు. అతని స్థానంలో అతని కుమారుడు యరొబాము రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన పితరులతో నిద్రించాడు” అనేది అతడు చనిపోయాడని తెలిపే సంప్రదాయ హీబ్రూ ప్రయోగం.
    reason: ‘నిద్రించాడు’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ దాని సందర్భార్థాన్ని ఆధునిక పాఠకునికి స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో వచ్చే హీబ్రూ సంప్రదాయ ప్రయోగాన్ని నిలుపుతుంది; ఇక్కడ ఇది మరణాన్ని సూచిస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: రాజుల గ్రంథంలో పునరావృతమయ్యే మరణసూత్రానికి దగ్గరగా ఉండి, పూర్వీకులతో చేరడాన్ని సూచిస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: హీబ్రూ నిఫల్ క్రియలోని కర్మణి భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: ב అనే ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది; సమరయ పట్టణమే సమాధి స్థలం.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులతో పాటు
  rationale: עִם లోని సహవాస భావాన్ని సమాధి సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: రాజవంశ వారసత్వ ప్రకటనల్లో מלך క్రియకు సరిపోయే సాధారణ తెలుగు రూపం.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: కేవలం కాలక్రమాన్ని కాకుండా, రాజుగా అతని స్థానాన్ని కుమారుడు స్వీకరించిన భావాన్ని నిలుపుతుంది.
