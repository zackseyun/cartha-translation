translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజవంశ చరిత్రా శైలిని ఉపయోగించాం. మూలంలోని సంప్రదాయ మరణసూత్రాన్ని పాదసూచిక వివరణతో నిలిపాం.
