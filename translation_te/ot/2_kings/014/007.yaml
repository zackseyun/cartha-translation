  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యుద్ధవివరణను స్పష్టంగా ఉంచుతూ, స్థలనామంలోని నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
