source:
  edition: WLC
  text: הוּא הִכָּ֨ה אֶת אֱד֤וֹם בְּ/גֵיא המלח עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/תָפַ֥שׂ אֶת הַ/סֶּ֖לַע בַּ/מִּלְחָמָ֑ה וַ/יִּקְרָ֤א אֶת שְׁמָ/הּ֙ יָקְתְאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: te
  text: అతడు ఉప్పు లోయలో ఎదోమీయుల పదివేల మందిని హతమార్చి, యుద్ధంలో సెలను[a] స్వాధీనం చేసుకుని, దానికి యొక్తెయేలు అని పేరు పెట్టాడు; ఆ పేరు నేటి వరకు అలాగే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సెల” అనే పదానికి సాధారణ అర్థం “బండ” లేదా “కొండచరియ” కూడా కావచ్చు; అయితే ఇక్కడ అది స్థలనామమైన సెలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: హతమార్చి
  rationale: యుద్ధ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టివేయడాన్ని సూచిస్తుంది; సంఖ్యతో కూడిన ఈ వాక్యంలో ‘హతమార్చి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֱדוֹם
  choice: ఎదోమీయులలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఎదోము’ ఉన్నా, పదివేల మంది అనే సంఖ్య ప్రజలను సూచిస్తుంది; ‘ఎదోమీయులలో’ మూలంలోని సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: בְּגֵיא הַמֶּלַח
  choice: ఉప్పులోయలో
  rationale: భౌగోళిక నామంలోని ‘ఉప్పు’ మరియు ‘లోయ’ అనే రెండు అంశాలను సంక్షిప్తంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: పదివేల మందిని
  rationale: సంఖ్యకు ప్రామాణిక తెలుగు రూపం; వ్యక్తులు ఉద్దేశించబడ్డారని ‘మందిని’ స్పష్టం చేస్తుంది.
- source_word: וְתָפַשׂ
  choice: స్వాధీనం చేసుకుని
  rationale: యుద్ధంలో ఒక స్థలాన్ని పట్టుకుని ఆధీనంలోకి తెచ్చుకోవడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַסֶּלַע
  choice: సెలను
  rationale: సందర్భంలో ఇది స్థలనామంగా ఉండే అవకాశం ఎక్కువ; దాని సాధారణ పదార్థమైన ‘బండ/శిల’ను పాదటిప్పణిలో నిలుపుతున్నాం.
- source_word: בַּמִּלְחָמָה
  choice: యుద్ధంలో
  rationale: ఆ స్థలం యుద్ధం ద్వారా స్వాధీనమైన పరిస్థితిని నేరుగా తెలుపుతుంది.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: దానికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יָקְתְאֵל
  choice: యొక్తెయేలు
  rationale: హీబ్రూ స్థలనామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకూ దాని పేరు అదే
  rationale: ఆ పేరు రచయిత కాలం వరకూ కొనసాగిందనే హీబ్రూ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
