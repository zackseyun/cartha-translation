revisions:
- from: అయితే, చంపినవారి కుమారులను అతడు చంపించలేదు[a]. “కుమారుల కారణంగా తండ్రులను చంపకూడదు; తండ్రుల కారణంగా కుమారులను చంపకూడదు. బదులుగా, ప్రతి వ్యక్తి తన సొంత పాపం కారణంగానే చనిపోవాలి” అని యెహోవా ఆజ్ఞాపించిన ప్రకారం, మోషే ధర్మశాస్త్ర గ్రంథంలో రాసి ఉంది[b].
  to: 'అయితే, యెహోవా ఇలా ఆజ్ఞాపించిన మోషే ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన దాని ప్రకారం అతడు హంతకుల కుమారులకు మరణశిక్ష విధించలేదు[a]: “కుమారుల కారణంగా తండ్రులకు మరణశిక్ష విధించకూడదు, తండ్రుల కారణంగా కుమారులకు మరణశిక్ష విధించకూడదు; కానీ ప్రతి మనిషి తన పాపం వల్లనే చనిపోవాలి.”[b]'
  rationale: 'The revision restores the Hebrew sequence and scope: Amaziah did not execute the sons, in conformity with the written Mosaic law that Yahweh commanded. It uses explicit legal Telugu for the first two prohibitions while retaining ‘చనిపోవాలి’ for the final Qal verb. The lexical footnote is limited to a genuine rendering alternative and does not import narrative identification.'
  reviewer_model: gpt-5.6-terra
