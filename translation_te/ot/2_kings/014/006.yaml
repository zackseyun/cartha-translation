  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: te
  text: 'అయితే, యెహోవా ఇలా ఆజ్ఞాపించిన మోషే ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన దాని ప్రకారం అతడు హంతకుల కుమారులకు మరణశిక్ష విధించలేదు[a]: “కుమారుల కారణంగా తండ్రులకు మరణశిక్ష విధించకూడదు, తండ్రుల కారణంగా కుమారులకు మరణశిక్ష విధించకూడదు; కానీ ప్రతి మనిషి తన పాపం వల్లనే చనిపోవాలి.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొట్టినవారి కుమారులకు.” హీబ్రూలో అక్షరార్థంగా, “కొట్టినవారి కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: ఈ ఉల్లేఖనం ద్వితీయోపదేశకాండము 24:16ను ప్రతిబింబిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: చంపినవారి కుమారులు
  rationale: בְּנֵי అనే పుంలింగ బహువచనాన్ని ‘కుమారులు’గా నిలుపుతూ, נכה కర్తరి బహువచన రూపం ఈ న్యాయసందర్భంలో రాజును చంపినవారిని సూచిస్తుందని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא הֵמִית
  choice: చంపించలేదు
  rationale: מות హిఫీల్ రూపంలోని ‘చావుకు గురిచేయడం/మరణశిక్ష విధించడం’ అనే కారణార్థాన్ని తెలుగులో సహజమైన ‘చంపించలేదు’ వ్యక్తపరుస్తుంది.
- source_word: כַּכָּתוּב
  choice: రాసి ఉంది
  rationale: లిఖిత ధర్మశాస్త్రపు అధికారాన్ని సూచించే సూత్రప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్ర గ్రంథంలో
  rationale: סֵפֶר మరియు תּוֹרָה రెండింటినీ నిలుపుతూ గుర్తించదగిన, గౌరవప్రదమైన తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
- source_word: לֹא יוּמְתוּ
  choice: చంపకూడదు
  rationale: న్యాయసంబంధ నిషేధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ఇది కేవలం సహజ మరణం గురించి కాదని స్పష్టం చేస్తుంది.
- source_word: אָבוֹת ... בָּנִים
  choice: తండ్రులు ... కుమారులు
  rationale: హీబ్రూలోని నిర్దిష్ట పుంలింగ పదాలను సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: עַל
  choice: కారణంగా
  rationale: మరొకరి నేరాన్ని ఆధారంగా చేసుకొని శిక్ష విధించడాన్ని సూచించే న్యాయార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כִּי אִם
  choice: బదులుగా
  rationale: ముందటి నిషేధాలకు విరుద్ధంగా వ్యక్తిగత బాధ్యత సూత్రాన్ని ప్రవేశపెట్టే వ్యతిరేకార్థాన్ని అందిస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి వ్యక్తి
  rationale: వితరణార్థక ఏకవచనాన్ని సహజ తెలుగులో తెలియజేస్తుంది; న్యాయసూత్రం ఒక్కొక్కరికి వర్తిస్తుందనే భావాన్ని కాపాడుతుంది.
- source_word: בְּחֶטְאוֹ
  choice: తన సొంత పాపం కారణంగానే
  rationale: స్వామ్య ప్రత్యయాన్ని ‘తన సొంత’గా, శిక్షకు ఆధారాన్ని ‘కారణంగా’గా స్పష్టం చేస్తూ ఇతరుల పాపంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: יָמוּת
  choice: చనిపోవాలి
  rationale: ముందటి కారణార్థక/శిక్షాత్మక క్రియలతో భేదంగా ఉన్న Qal ‘చనిపోవు’ రూపాన్ని నిలుపుతుంది; న్యాయసందర్భాన్ని మించిపోయి అర్థాన్ని సంకుచితం చేయదు.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో వ్యక్తిగత బాధ్యత మరియు కుటుంబ బాధ్యత
  choice: తండ్రి నేరానికి కుమారుడిని గానీ, కుమారుడి నేరానికి తండ్రిని గానీ మరణశిక్షకు గురిచేయకూడదనే న్యాయసూత్రంగా అనువదించబడింది.
  alternative: పాపానికి సంబంధించిన అన్ని సామూహిక లేదా తరతరాల పరిణామాలను ఇది పూర్తిగా నిరాకరిస్తుందనే విస్తృత పఠనం.
  rationale: వాక్యంలోని మరణశిక్షాపరమైన భాష వ్యక్తిగత న్యాయదోషాన్ని లక్ష్యంగా చేసుకుంటుంది. పాపానికి సామూహిక పరిణామాలు ఉండవచ్చా అనే విస్తృత వేదాంత ప్రశ్నను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. మూలంలోని ‘తండ్రులు/కుమారులు’ అనే పుంలింగ పదాలను నిలిపాం; చివరి יָמוּתను కారణార్థకంగా మార్చకుండా ‘చనిపోవాలి’గా ఉంచాం. ఉల్లేఖనాన్ని తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ముందుంచి, అది మోషే ధర్మశాస్త్ర గ్రంథంలో రాసి ఉందనే పరిచయాన్ని తరువాత ఇచ్చాం.
