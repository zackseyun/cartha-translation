id: 2KI.14.23
reference: 2 Kings 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַת֙ חֲמֵשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יָרָבְעָ֨ם בֶּן יוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן אַרְבָּעִ֥ים וְ/אַחַ֖ת שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: te
  text: యూదా రాజైన యోవాషు కుమారుడు అమజ్యా పాలనలో పదిహేనో సంవత్సరంలో, ఇశ్రాయేలు రాజైన యోవాషు కుమారుడు యెరోబాము షోమ్రోనులో రాజయ్యాడు; అతడు నలభై ఒక్క సంవత్సరాలు పాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: పాలనలో పదిహేనో సంవత్సరంలో
  rationale: రాజుల పాలనకాలాన్ని సూచించే హెబ్రీ కాలనిర్ణయ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఇది పదిహేను సంవత్సరాల వ్యవధి కాదు, అమజ్యా పాలనలోని పదిహేనో సంవత్సరం.
- source_word: לַאֲמַצְיָהוּ
  choice: అమజ్యా పాలనలో
  rationale: రాజ్యపాలన సంవత్సరాన్ని సూచించే ל సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֶן יוֹאָשׁ
  choice: యెహోయాషు కుమారుడు
  rationale: తండ్రి-కొడుకు సంబంధాన్ని నేరుగా అనువదించింది; పేరును తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ఇచ్చింది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: అమజ్యా పదవినీ రాజ్యాన్నీ సహజమైన తెలుగు విశేషణ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: రాజై
  rationale: ఇక్కడ క్రియ రాజ్యాధికారంలోకి రావడాన్ని సూచిస్తుంది; తరువాత వచ్చే పాలన వ్యవధితో భేదాన్ని నిలుపుతుంది.
- source_word: יָרָבְעָם
  choice: యెరోబాము
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణ.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: యెరోబాము పదవినీ రాజ్యాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: స్థానార్థక ב ను ‘లో’తో వ్యక్తం చేసి, హెబ్రీ నగరనామాన్ని మూలానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: నలభై ఒక్క సంవత్సరాలు
  rationale: పాలన వ్యవధిని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
