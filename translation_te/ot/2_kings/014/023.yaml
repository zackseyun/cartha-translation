- from: యూదా రాజైన యెహోయాషు కుమారుడు అమజ్యా పాలనలో పదిహేనో సంవత్సరంలో, ఇశ్రాయేలు రాజైన యెహోయాషు కుమారుడు యెరోబాము షోమ్రోనులో రాజై, నలభై ఒక్క సంవత్సరాలు పాలించాడు.
