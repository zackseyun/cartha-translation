    issue: The personal name יוֹאָשׁ is rendered “యెహోయాషు.”
    rationale: The source text has Joash (יוֹאָשׁ), not a longer Jehoash form. Rendering it “యోవాషు” preserves the source form and keeps both occurrences of the name consistent.
