translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవంశ చరిత్రకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని అధికారారోహణ (‘రాజై’) మరియు పాలన వ్యవధి (‘పాలించాడు’) మధ్య తేడా నిలుపబడింది.
