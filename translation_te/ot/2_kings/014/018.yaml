source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: అమజ్యా చేసిన మిగతా కార్యాలు యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుల వార్షిక వృత్తాంతాల గ్రంథంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: అమజ్యా చేసిన మిగతా కార్యాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; రాజు గురించిన ఈ చారిత్రక సూత్రవాక్యంలో דִּבְרֵי అనేది కేవలం మాటలను కాక అతని కార్యాలు, పరిపాలనా సంగతులను సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘చేసిన’ చేర్చబడింది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: నిశ్చయార్థక సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను ‘కదా?’ సహజంగా నిలుపుతుంది; passive participle భావాన్ని ‘రాయబడి ఉన్నాయి’ ప్రతిబింబిస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సందర్భంలో తెలుగులో ‘గ్రంథంలో’ సహజమైన ప్రయోగం.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: דִּבְרֵי הַיָּמִים రాజుల పాలనకు సంబంధించిన కాలక్రమ వృత్తాంతాలు లేదా అధికారిక నమోదులను సూచిస్తుంది. ‘దినవృత్తాంతాలు’ మూలపద రూపాన్ని, చారిత్రక గ్రంథ స్వభావాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక శైలి. హీబ్రూ అలంకారప్రశ్నను వాక్యంగా మార్చకుండా నిలుపుకున్నాం. మూలంలోని וְ ను ప్రత్యేకంగా ‘మరియు/ఇప్పుడు’ అని అనువదించలేదు; ఈ సారాంశ సూత్రవాక్యంలో తెలుగు ప్రవాహానికి అది అవసరం లేదు.
