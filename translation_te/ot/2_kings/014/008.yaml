id: 2KI.14.8
reference: 2 Kings 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: te
  text: అప్పుడు అమజ్యా, యేహూ కుమారుడైన యెహోయాహాజు కుమారుడు, ఇశ్రాయేలు రాజు యెహోయాషు[a] దగ్గరికి దూతలను పంపించి, “రా, మనం ముఖాముఖిగా తలపడదాం[b]” అని చెప్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెహోయాషు అనే పేరు కొన్ని అనువాదాల్లో “యోవాషు” అని కూడా ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “మనం ఒకరి ముఖం ఒకరు చూసుకుందాం.” ఈ హీబ్రూ నుడికారం నేరుగా ఎదురుపడటాన్ని సూచిస్తుంది; ఇక్కడ అది యుద్ధానికి సవాలు చేసే భావంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కథనంలో తరువాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: שָׁלַח ... מַלְאָכִים
  choice: దూతలను పంపించి
  rationale: ఇక్కడ מַלְאָכִים దేవదూతలను కాక, సందేశం తీసుకెళ్లే మానవ దూతలను సూచిస్తుంది.
- source_word: יְהוֹאָשׁ
  choice: యెహోయాషు
  rationale: హీబ్రూ పేరులోని పూర్తి రూపాన్ని ప్రతిబింబిస్తుంది; సంక్షిప్త రూపమైన ‘యోవాషు’ను పాదసూచికలో ఇచ్చాం.
- source_word: בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: యేహూ కుమారుడైన యెహోయాహాజు కుమారుడు
  rationale: మూలంలోని వంశక్రమాన్ని నిలుపుతూ తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: రాజబిరుదును నేరుగా, సంక్షిప్తంగా అనువదిస్తుంది.
- source_word: לֵאמֹר
  choice: అని చెప్పించాడు
  rationale: దూతల ద్వారా సందేశం పంపిన సందర్భంలో హీబ్రూ ఉల్లేఖన సూత్రాన్ని సహజమైన తెలుగు కథనంగా వ్యక్తం చేస్తుంది.
- source_word: לְכָה
  choice: రా
  rationale: ఎదుటివాణ్ణి ప్రత్యక్షంగా ఎదుర్కొనమని సవాలు చేసే ఏకవచన ఆజ్ఞారూపం.
- source_word: נִתְרָאֶה פָנִים
  choice: మనం ముఖాముఖిగా తలపడదాం
  rationale: అక్షరార్థంగా ‘ముఖాలు చూసుకుందాం’ అనే హీబ్రూ ప్రయోగం ఈ రాజసవాలు సందర్భంలో ప్రత్యక్ష ఘర్షణను సూచిస్తుంది. ‘తలపడదాం’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ‘ముఖాముఖిగా’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
