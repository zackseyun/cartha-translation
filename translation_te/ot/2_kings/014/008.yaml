translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక కథనానికి తగిన గంభీరతతో అనువదించబడింది. పేర్ల వంశక్రమం మూలానికి అనుగుణంగా నిలుపబడింది; చివరి హీబ్రూ నుడికారంలోని రూపకమూ, సందర్భంలోని సైనిక సవాలూ రెండూ కనిపించేలా ప్రధాన పాఠ్యం మరియు పాదసూచికను సమన్వయపరిచాం.
