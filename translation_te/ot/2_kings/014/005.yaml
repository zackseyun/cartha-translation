id: 2KI.14.5
reference: 2 Kings 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר חָזְקָ֥ה הַ/מַּמְלָכָ֖ה בְּ/יָד֑/וֹ וַ/יַּךְ֙ אֶת עֲבָדָ֔י/ו הַ/מַּכִּ֖ים אֶת הַ/מֶּ֥לֶךְ אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: te
  text: రాజ్యం అతని చేతిలో స్థిరపడగానే[a], తన తండ్రియైన రాజును హతమార్చిన తన సేవకులను అతడు హతమార్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రాజ్యం అతని చేతిలో బలపడినప్పుడు.’ ఈ హీబ్రూ నుడికారం అతని రాజాధికారం సుస్థిరమై, పూర్తిగా అతని నియంత్రణలోకి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'అమజ్యా చేసిన చర్యకూ, అతని తండ్రిని చంపిన సేవకుల చర్యకూ హీబ్రూలో ఒకే క్రియ వాడబడింది: తన తండ్రిని ‘హతమార్చిన’ వారిని అతడు ‘హతమార్చాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: స్థిరపడగానే
  rationale: వచనంలోని కథన కొనసాగింపును తెలుగులో విడిగా ‘అప్పుడు జరిగింది’ అని చెప్పడం అసహజంగా ఉంటుంది. כַּאֲשֶׁר ఇక్కడ సూచించే కాలసంబంధాన్ని ‘గానే’ సహజంగా, తక్షణ క్రమభావంతో తెలియజేస్తుంది.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: రాజ్యం అతని చేతిలో స్థిరపడింది
  rationale: హీబ్రూ పదబంధం రాజాధికారం అతని నియంత్రణలో దృఢంగా ఏర్పడడాన్ని సూచిస్తుంది. ‘అతని చేతిలో’ అనే మూలభాషా రూపకాన్ని నిలిపి, חזק భావాన్ని ‘స్థిరపడింది’ అని సహజమైన తెలుగులో అందించాం.
- source_word: וַיַּךְ / הַמַּכִּים
  choice: హతమార్చాడు / హతమార్చిన
  rationale: రెండు రూపాలకూ మూలంలో נכה అనే ఒకే ధాతువు ఉంది. సందర్భంలో రెండూ మరణానికి దారితీసిన చర్యలే కాబట్టి, ‘హతమార్చు’ను పునరావృతం చేసి మూలంలోని పదసామ్యాన్ని నిలిపాం.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: עבד యొక్క ప్రత్యక్ష భావం ‘సేవకుడు.’ రాజసభ సందర్భంలో వీరు అధికారులై ఉండవచ్చుగానీ, మూలంలో లేని నిర్దిష్ట హోదాను చేర్చకుండా ‘సేవకులు’ అని అనువదించాం.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: తన తండ్రియైన రాజును
  rationale: ‘రాజు—అతని తండ్రి’ అనే హీబ్రూ సమానాధికార నిర్మాణాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
