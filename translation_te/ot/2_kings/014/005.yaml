translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అతని చేతిలో’ అనే హీబ్రూ రూపకం అర్థమయ్యే విధంగా నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం; మూలంలోని ఒకే క్రియ పునరావృతాన్ని మాత్రం ఉద్దేశపూర్వకంగా సంరక్షించాం.
