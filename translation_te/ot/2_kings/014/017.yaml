translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వృత్తాంత శైలి. రాజుల గుర్తింపును స్పష్టంగా ఉంచేందుకు ‘రాజైన’ నిర్మాణాన్ని వాడింది. మూలంలోని పేర్ల భిన్న రూపాలను తెలుగు లిప్యంతరీకరణలో నిలిపి, వాటి వివరణకు పాదసూచికను జోడించింది.
