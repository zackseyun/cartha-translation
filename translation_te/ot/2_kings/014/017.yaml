source:
  edition: WLC
  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: te
  text: యోవాషు కుమారుడైన యూదా రాజు అమజ్యా, యెహోయాహాజు కుమారుడైన ఇశ్రాయేలు రాజు యెహోయాషు చనిపోయిన తర్వాత పదిహేను సంవత్సరాలు జీవించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ వచనంలో హీబ్రూ భాషలోని పేర్ల రూపాలు వేరుగా ఉన్నాయి: యూదా రాజైన అమజ్యా తండ్రి పేరు ‘యోవాషు’; ఇశ్రాయేలు రాజు పేరు ‘యెహోయాషు’. ఇద్దరినీ గందరగోళపరచకుండా ఉండేందుకు అనువాదంలో ఈ భేదాన్ని ఉంచాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: మరొక రాజు మరణించిన తర్వాత నిర్దిష్ట కాలం వరకు అమజ్యా జీవించి ఉన్నాడని తెలిపే కాలక్రమ సూచన. ‘బతికివున్నాడు’ కూడా సాధ్యమే, కాని ‘జీవించాడు’ సహజంగా ఉండి మూలంలోని సాధారణ క్రియను ప్రతిబింబిస్తుంది.
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సరళమైన లిప్యంతరీకరణ.
- source_word: בֶן יוֹאָשׁ
  choice: యోవాషు కుమారుడు
  rationale: రాజవంశ పరిచయంలోని ప్రత్యక్ష పితృసంబంధాన్ని తెలియజేస్తుంది; יוֹאָשׁ రూపాన్ని యోవాషుగా లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: అమజ్యా పదవిని, రాజ్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: אַחֲרֵי מוֹת
  choice: చనిపోయిన తర్వాత
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మరణం తర్వాత’ అనే నామవాచక నిర్మాణం ఉన్నప్పటికీ, వ్యక్తి పేరుతో తెలుగులో ‘చనిపోయిన తర్వాత’ మరింత సహజంగా, అదే అర్థంతో ఉంటుంది.
- source_word: יְהוֹאָשׁ
  choice: యెహోయాషు
  rationale: ఇశ్రాయేలు రాజు పేరులోని విస్తృత హీబ్రూ రూపాన్ని ప్రతిబింబిస్తూ, యూదా రాజైన అమజ్యా తండ్రి యోవాషు నుండి స్పష్టంగా వేరు చేస్తుంది.
- source_word: בֶן יְהוֹאָחָז
  choice: యెహోయాహాజు కుమారుడు
  rationale: ప్రత్యక్ష పితృసంబంధాన్ని తెలియజేస్తూ హీబ్రూ వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: ఉత్తర రాజ్యంపై యెహోయాషు రాజపదవిని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: పదిహేను సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే హీబ్రూ సంఖ్యా పదబంధానికి సాధారణ తెలుగు అనువాదం.
