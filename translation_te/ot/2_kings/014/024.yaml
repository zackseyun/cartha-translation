id: 2KI.14.24
reference: 2 Kings 14:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడును చేశాడు. ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడైన యరొబాము పాపాలలో ఏ పాపాన్నీ అతడు విడిచిపెట్టలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యరొబాము పాపాలలో ఏ పాపాన్నీ అతడు విడిచిపెట్టలేదు; వాటి ద్వారా యరొబాము ఇశ్రాయేలును పాపం చేయించాడు.” హీబ్రూ సంబంధ వాక్యాన్ని యరొబామును నేరుగా సూచించేదిగా లేదా అతని పాపాచారాలతో సాధనార్థకంగా అనుసంధానించేదిగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: అతడు చెడ్డది చేశాడు
  rationale: ‘చెడ్డది చేయడం’ అనే సహజమైన తెలుగు వ్యక్తీకరణ ద్వారా עשה הרע లోని నైతిక మూల్యాంకనాన్ని నేరుగా నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హీబ్రూ నుడికారంలోని దేవుని మూల్యాంకన భావాన్ని సహజమైన తెలుగులో అందిస్తూ, יהוה అనే వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: పాపాలన్నిటి నుంచి అతడు తొలగిపోలేదు
  rationale: סור లోని ‘ఒక మార్గం లేదా ఆచరణ నుంచి తొలగిపోవడం’ అనే భావాన్ని, וכן לא...מכל లోని సమగ్ర నిరాకరణను నిలుపుతుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడు యరొబాము
  rationale: వ్యక్తినామాలను తెలుగు బైబిలు పఠనానికి అనువైన రూపంలో ఇచ్చి, construct సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేసేలా చేసిన
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రధాన పాఠంలో సంబంధ వాక్యాన్ని సమీపంలోని ఏకవచన వ్యక్తి యరొబాముతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל అనే సంబంధ వాక్యం దేనిని సూచిస్తుంది?
  choice: 'యరొబామును నేరుగా సూచించేలా: ‘ఇశ్రాయేలు పాపం చేసేలా చేసిన ... యరొబాము’'
  alternative: 'యరొబాము పాపాచారాలను సాధనార్థకంగా సూచించేలా: ‘వాటి ద్వారా అతడు ఇశ్రాయేలు పాపం చేసేలా చేశాడు’'
  rationale: హీబ్రూ సంబంధసర్వనామం లింగం/వచనం చూపకపోయినా, הֶחֱטִיא అనే పురుష ఏకవచన క్రియలో అంతర్లీన కర్త యరొబాము కావడం అత్యంత సహజం. అయినప్పటికీ, వాక్యప్రవాహంలో ‘పాపాలు’తో సాధనార్థక అనుసంధానం సాధ్యమైనందున దానిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దృష్టిలో,’ ‘తొలగిపోలేదు’ వంటి పదాలు మూలంలోని నుడికారాన్ని నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
