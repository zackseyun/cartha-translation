  source_fidelity: 'ప్రధాన పాఠ్యం హీబ్రూ రాజ-సారాంశ సూత్రాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: యెరోబాము చేసిన కార్యాలు, అతని పరాక్రమం, అతడు యుద్ధం చేసిన విధానం, దమస్కు మరియు హమాతును తిరిగి చేర్చడం, అలాగే దినవృత్తాంతాల గ్రంథానికి చేసే అలంకారప్రశ్న—అన్నీ నిలిచాయి. לִיהוּדָה בְּיִשְׂרָאֵל అనే వివాదాస్పద పదబంధాన్ని ‘ఇశ్రాయేలులో యూదాకు’గా ఉంచడం మూలంలోని అస్పష్టతను కాపాడుతుంది; దీనిని నిర్దిష్ట చారిత్రక పునర్నిర్మాణంగా మార్చలేదు.'
