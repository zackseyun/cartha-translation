source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: యెరోబాము చేసిన మిగిలిన కార్యాలు, అతడు చేసినదంతా, అతని పరాక్రమం, అతడు ఎలా యుద్ధం చేశాడో, ఇశ్రాయేలులో యూదాకు దమస్కును, హమాతును ఎలా తిరిగి చేర్చాడో[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “ఇశ్రాయేలులో యూదాకు.” ఈ పదబంధం క్లిష్టమైనది. ఇది ఒకప్పుడు యూదాకు చెందిన ప్రాంతాన్ని ఇశ్రాయేలు కోసం తిరిగి సంపాదించాడని సూచించవచ్చు; లేదా ఇది పూర్వకాలపు భౌగోళిక-రాజకీయ నామాన్ని నిలిపి ఉండవచ్చు. ప్రధాన పాఠ్యం ఈ అస్పష్టతను పరిష్కరించకుండా హీబ్రూ పదబంధాన్ని సాధ్యమైనంత సమీపంగా ఉంచుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల గ్రంథంలోని పాలనా-సారాంశ సూత్రంలో דִּבְרֵי అనేది మాటలకన్నా కార్యాలు లేదా సంగతులను సూచిస్తుంది; సహజమైన తెలుగులో ‘చేసిన మిగిలిన కార్యాలు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עשה యొక్క విస్తృత అర్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וּגְבוּרָתוֹ
  choice: అతని పరాక్రమం
  rationale: ఇక్కడ తరువాత వచ్చే యుద్ధ ప్రస్తావన దృష్ట్యా గెబూరా సైనిక శౌర్యం లేదా బలాన్ని సూచిస్తుంది; ‘పరాక్రమం’ గంభీరంగానూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది.
- source_word: אֲשֶׁר נִלְחָם
  choice: అతడు ఎలా యుద్ధం చేశాడో
  rationale: ముందున్న ‘పరాక్రమం’ను వివరించే సంబంధవాక్య భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: ఎలా తిరిగి చేర్చాడో
  rationale: הֵשִׁיב లోని తిరిగి తీసుకురావడం లేదా పునరుద్ధరించడం అనే భావాన్ని రాజకీయ-ప్రాదేశిక సందర్భంలో తెలియజేస్తుంది; ఎవరి ఆధీనంలోకి అన్న సమస్యను అనవసరంగా పరిష్కరించదు.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: దమస్కును, హమాతును
  rationale: స్థలనామాలకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో యూదాకు
  rationale: మూలంలోని కఠినమైన, సంక్షిప్తమైన భౌగోళిక-రాజకీయ పదబంధాన్ని వ్యాఖ్యానంతో సరిచేయకుండా సాధ్యమైనంత సమీపంగా నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: మూలంలోని అలంకారప్రశ్నను మరియు కర్మణి నిర్మాణాన్ని సహజ తెలుగు రూపంలో కాపాడుతుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో
  rationale: ఇది రాజుల గ్రంథంలో తరచుగా వచ్చే ఆధారగ్రంథపు శీర్షిక; ‘దినవృత్తాంతాలు’ చారిత్రక నమోదుల భావాన్ని అందిస్తూ పదబంధ రూపాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: לִיהוּדָה בְּיִשְׂרָאֵל అనే క్లిష్ట పదబంధపు చారిత్రక-భౌగోళిక అర్థం
  choice: ‘ఇశ్రాయేలులో యూదాకు’ అని మూలంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలపడం
  alternative: ‘ఒకప్పుడు యూదాకు చెందిన ప్రాంతాలను ఇశ్రాయేలుకు తిరిగి సంపాదించాడు’ లేదా ‘ఇశ్రాయేలుకు చెందిన యూదాకు’ అని అర్థాన్ని నిర్దిష్టం చేయడం
  rationale: హీబ్రూ పదబంధం వ్యాకరణపరంగా సంక్షిప్తమూ వ్యాఖ్యానపరంగా వివాదాస్పదమూ ఉంది. ఒక నిర్దిష్ట చారిత్రక పునర్నిర్మాణాన్ని పాఠ్యంలో చేర్చడం కంటే మూలంలోని ఉద్రిక్తతను నిలిపి, పాదటిప్పణిలో సాధ్యార్థాలను తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన చారిత్రక శైలిని పాటించాం. ‘ఉన్నాయి కదా?’ అనే రూపం హీబ్రూ అలంకారప్రశ్నను సాధారణ పాఠకునికి సహజంగా వినిపించేలా చేస్తుంది. మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని జోడించలేదు.
