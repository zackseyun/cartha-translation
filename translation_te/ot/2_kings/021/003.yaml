reference: 2 Kings 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר אִבַּ֖ד חִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּחֹ֜ת לַ/בַּ֗עַל וַ/יַּ֤עַשׂ אֲשֵׁרָה֙ כַּ/אֲשֶׁ֣ר עָשָׂ֗ה אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: te
  text: అతడు తన తండ్రి హిజ్కియా నాశనం చేసిన ఉన్నత స్థలాలను మళ్లీ కట్టాడు. ఇశ్రాయేలు రాజైన అహాబు చేసినట్లే, బయలుకు బలిపీఠాలను నిలబెట్టి, అషేరాను చేశాడు. అతడు ఆకాశ సైన్యమంతటికీ వంగి నమస్కరించి, వాటిని ఆరాధించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: ఆరాధన కోసం ఉపయోగించిన ఎత్తైన ప్రదేశాలు లేదా వేదికలను సూచించే హీబ్రూ పదానికి సాంప్రదాయబద్ధమైన, అర్థవంతమైన అనువాదం.
- source_word: לַבַּעַל
  choice: బయలుకు
  rationale: లְ ఉపసర్గ ఇక్కడ బలిపీఠాల అంకితాన్ని లేదా ఉద్దేశాన్ని సూచిస్తుంది; అందువల్ల ‘బయలుకు’ సహజంగా ఉంది.
- source_word: אֲשֵׁרָה
  choice: అషేరా ప్రతిమ
  rationale: ఈ సందర్భంలో చేయబడిన ఆరాధనా వస్తువును సూచిస్తుంది. కేవలం దేవత పేరుగా కాక, తయారు చేసిన ప్రతిమ/చిహ్నంగా పాఠకునికి స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతటికీ
  rationale: సూర్యచంద్ర నక్షత్రాలు మొదలైన ఆకాశ సమూహాన్ని సూచించగల మూలపాఠంలోని సమూహాత్మక రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: వాటిని సేవించాడు
  rationale: עבד పదంలోని ఆరాధనా సేవ భావాన్ని కాపాడుతూ, ముందున్న సమూహ నామవాచకాన్ని తెలుగులో సహజమైన బహువచన సర్వనామంతో సూచిస్తుంది.
theological_decisions:
- issue: ‘ఆకాశ సైన్యం’ యొక్క గుర్తింపు
  choice: ఆకాశ సైన్యమంతటికీ
  alternative: ఆకాశంలోని నక్షత్రాలన్నిటికీ
  rationale: మూలంలోని విస్తృతమైన, కొంత అస్పష్టమైన రూపాన్ని కాపాడి, దానిని కేవలం నక్షత్రాలకు పరిమితం చేయలేదు.
- issue: అషేరా యొక్క స్వరూపం
  choice: అషేరా ప్రతిమ
  alternative: అషేరా దేవత
  rationale: ‘చేయించాడు’ అనే క్రియతో కనిపించే ఆరాధనా వస్తువు భావాన్ని తెలియజేస్తుంది; అయితే నిర్దిష్ట మతవ్యాఖ్యానాన్ని అతిగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. వరుస హీబ్రూ వావ్-క్రియలను తెలుగులో సహజంగా మూడు వాక్యాలుగా విభజించాం; సంఘటనల క్రమం, పునరావృత చర్యలు, విగ్రహారాధన భావం నిలుపబడ్డాయి.
