  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: te
  text: 'యాహ్వే తన సేవకులైన ప్రవక్తల ద్వారా ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר పియేల్ రూపం ‘మాట్లాడు’ అనే భావాన్ని ఇస్తుంది. అయితే వెంట వచ్చే לֵאמֹר‌తో కలిపి తెలుగులో ‘ఇలా చెప్పాడు’ అనడం సహజంగా ఉండి, తదుపరి ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: అక్షరార్థంగా ‘చేతి ద్వారా’ అయిన ఈ హీబ్రూ జాతీయం ఇక్కడ సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ద్వారా’ అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులైన
  rationale: దేవుని నియామకంలో సేవచేసే ప్రవక్తలను సూచిస్తున్నందున ‘సేవకులు’ సందర్భోచితం; ‘-అయిన’ అనే రూపం తరువాతి ‘ప్రవక్తలు’ వారినే నిర్దిష్టంగా గుర్తిస్తుందని చూపుతుంది.
- source_word: הַנְּבִיאִים
  choice: ప్రవక్తల
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సహజమైన తెలుగు అనువాదం; వీరే ‘తన సేవకులు’ అని అన్వయాన్ని స్పష్టం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో ‘ఇలా చెప్పాడు’ అని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ రూపం.
- issue: בְּיַד అనే జాతీయాన్ని అక్షరార్థంగా ఉంచాలా
  choice: ద్వారా
  alternative: చేతి ద్వారా
  rationale: ఇక్కడ భావం ప్రవక్తల శారీరక చేతిని గురించి కాదు, వారి ద్వారా దేవుడు సందేశం అందించాడనే మధ్యవర్తిత్వం గురించి. అందువల్ల అపార్థం రాకుండా సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. తదుపరి వచనంలోని ప్రత్యక్ష దైవవాక్యానికి దారితీయడానికి చివరలో ద్విబిందువు వాడబడింది.
