  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: te
  text: ఆమోను సేవకులు అతనికి వ్యతిరేకంగా కుట్ర చేసి, రాజును అతని సొంత ఇంట్లోనే చంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: కుట్ర చేసి
  rationale: రాజకీయ సందర్భంలో קשר అనే క్రియ ‘కుట్ర చేయడం’ లేదా ‘కుట్ర పన్నడం’ అనే భావాన్ని ఇస్తుంది. ‘కుట్ర చేసి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: עַבְדֵי אָמוֹן
  choice: ఆమోను సేవకులు
  rationale: עֲבָדִים ఇక్కడ రాజసభకు చెందిన సేవకులు లేదా పరిచారకులను సూచిస్తుంది. ‘సేవకులు’ మూలంలోని సంబంధాన్ని కాపాడుతూ, ‘అధికారులు’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: עָלָיו
  choice: అతనికి వ్యతిరేకంగా
  rationale: కుట్రకు సంబంధించిన వాడుకలో עַל శత్రుత్వ చర్య ఎవరిని లక్ష్యంగా చేసిందో తెలియజేస్తుంది; సందర్భంలో ‘అతను’ ఆమోనును సూచిస్తుంది.
- source_word: וַיָּמִיתוּ
  choice: చంపారు
  rationale: מות యొక్క హిఫీల్ రూపం మరణింపజేయడం అనే కారణార్థాన్ని కలిగి ఉంది. ఆధునిక తెలుగులో ‘చంపారు’ ఆ భావాన్ని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֶת־הַמֶּלֶךְ
  choice: రాజును
  rationale: హీబ్రూ వ్యక్తిపేరును పునరుక్తి చేయకుండా బిరుదైన ‘రాజు’నే ఉపయోగిస్తుంది; తెలుగు అనువాదం అదే రూపాన్ని నిలుపుతుంది.
- source_word: בְּבֵיתוֹ
  choice: అతని సొంత ఇంట్లోనే
  rationale: ప్రత్యయంతో కూడిన בֵּיתוֹ అంటే ‘అతని ఇల్లు.’ ‘సొంత’ మరియు ‘నే’ సహజ తెలుగు ఉద్ఘాటనగా, హత్య రాజు నివాసంలోనే జరిగిందనే భావాన్ని స్పష్టంగా తెలియజేస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సరళంగా, గౌరవప్రదంగా ఉంచబడింది. మూలంలోని రాజకీయ కుట్ర భావం స్పష్టంగా నిలుపబడింది. ‘సేవకులు’ అనే పదం వారి ఖచ్చితమైన రాజసభ హోదాను అవసరానికి మించి నిర్ధారించదు.
