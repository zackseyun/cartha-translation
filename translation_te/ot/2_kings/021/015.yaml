source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: te
  text: ఎందుకంటే వారు నా దృష్టిలో చెడ్డది చేసి, నన్ను కోపపరుస్తూ ఉన్నారు—వారి పితరులు ఐగుప్తు నుండి బయలుదేరిన రోజు నుండి నేటివరకు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పూర్వీకులు.” హీబ్రూలో “వారి పితరులు” అని ఉంది; ఈ పురుషలింగ బంధుత్వ పదం ఇక్కడ గత తరాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో ప్రకటించిన తీర్పుకు కారణాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కారణసూచక పదం.
- source_word: עָשׂוּ אֶת־הָרַע בְּעֵינַי
  choice: నా దృష్టికి చెడ్డదాన్ని చేస్తూ
  rationale: ‘నా దృష్టిలో చెడ్డది చేయడం’ అనే హీబ్రూ మూల్యాంకన నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది; తదనంతర కాలవ్యాప్తితో కలిపి నిరంతర ప్రవర్తనగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: నాకు కోపం పుట్టిస్తూ వచ్చారు
  rationale: היה + కృదంత నిర్మాణంలోని కొనసాగుతున్న లేదా అలవాటైన చర్యను ‘చేస్తూ వచ్చారు’ రూపం స్పష్టంగా వ్యక్తం చేస్తుంది; హిఫిల్ రూపంలోని దేవునికి కోపం కలిగించే భావాన్ని నిలుపుతుంది.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: రోజు మొదలుకొని
  rationale: కొనసాగిన ప్రవర్తన యొక్క ప్రారంభ బిందువును తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: יָצְאוּ ... מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి బయలుదేరిన
  rationale: నిర్గమనాన్ని సూచించే יצא క్రియకు సూటిగా, సంప్రదాయ బైబిలు సందర్భంలో సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: אֲבוֹתָם
  choice: వారి పితరులు
  rationale: మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని నిలుపుతూ, ఇక్కడ పూర్వ తరాలను సూచించే గౌరవప్రదమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: హీబ్రూ కాలవ్యాప్తి పదబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్గమన తరంనుండి ఇశ్రాయేలు అపరాధం యొక్క సామూహిక-చారిత్రక కొనసాగింపు
  choice: నిర్గమన కాలం మొదలుకొని కొనసాగిన సామూహిక తిరుగుబాటుగా వాక్యంలోని చారిత్రక రూపకల్పనను నిలుపడం
  alternative: దీనిని ఇటీవలి రాజుల వ్యక్తిగత పాపాల గురించిన మాటగా మాత్రమే పరిమితం చేయడం
  rationale: వచనం ‘వారి పితరులు’ ఐగుప్తు నుండి బయలుదేరిన నాటినుండి ఈ రోజు వరకూ అని స్పష్టంగా కాలరేఖను గీస్తుంది; అనువాదం దానిని సిద్ధాంతాత్మకంగా వివరించకుండా యథాతథంగా ఉంచుతుంది.
- issue: אֲבוֹתָם అనే బంధుత్వ పదం పరిధి
  choice: వారి పితరులు
  alternative: వారి పూర్వీకులు
  rationale: మూలపదం వ్యాకరణపరంగా పురుషలింగ బంధుత్వ పదం; ప్రధాన పాఠ్యంలో దానిని నిలిపి, విస్తృత తరాల సూచనను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పితరులు’ మూలంలోని బంధుత్వ రూపాన్ని నిలుపుతుంది; ‘కోపం పుట్టిస్తూ వచ్చారు’ కొనసాగుతున్న ప్రేరేపణను సహజంగా వ్యక్తం చేస్తుంది.
