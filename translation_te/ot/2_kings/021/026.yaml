  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: te
  text: అతన్ని ఉజ్జా తోటలోని అతని సమాధిలో పాతిపెట్టారు; అతని స్థానంలో అతని కుమారుడు యోషీయా రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: పాతిపెట్టారు
  rationale: హీబ్రూ క్రియ రూపరీత్యా మూడవ పురుష ఏకవచనం (‘అతడు పాతిపెట్టాడు’). అయితే కర్తను ప్రత్యేకంగా పేర్కొనని ఈ సందర్భంలో, ఆధునిక తెలుగులో అనిర్దిష్ట బహువచనం సహజంగా ఉండి అంత్యక్రియలు చేసినవారిని సూచిస్తుంది.
- source_word: קְבֻרָתוֹ
  choice: అతని సమాధి
  rationale: ఈ నామవాచకం పాతిపెట్టే క్రియను కాకుండా పాతిపెట్టిన స్థలాన్ని సూచిస్తుంది; ‘సమాధి’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: גַן עֻזָּא
  choice: ఉజ్జా తోట
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన నామసంబంధంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజ్య వారసత్వ సూత్రంలో ఈ క్రియ పాలన కాలమంతటిని కాకుండా రాజుగా అధికారంలోకి రావడాన్ని ప్రధానంగా సూచిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: వారసత్వం లేదా స్థానభర్తీని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజుల గ్రంథ కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూలోని ఏకవచన క్రియను యథాతథంగా ఇస్తే తెలుగులో తెలియని ఒక పురుష కర్తను ఊహింపజేస్తుంది కాబట్టి, సందర్భానుగుణమైన అనిర్దిష్ట బహువచనం వాడబడింది.
