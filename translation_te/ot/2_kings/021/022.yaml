base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: te
  text: అతడు తన పితరుల[b] దేవుడైన యాహ్వేను విడిచాడు[a]; యాహ్వే మార్గంలో నడవలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘త్యజించాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘తన పితరులు’; విస్తృత అర్థంలో ‘తన పూర్వీకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: విడిచిపెట్టి
  rationale: עזב అంటే విడిచిపెట్టడం, త్యజించడం. ఇక్కడ ‘విడిచిపెట్టి’ అనే పదం దేవునిపట్ల అతని అవిశ్వాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: తన పితరుల దేవుడు
  rationale: హీబ్రూ నిర్మాణంలోని కుటుంబ, ఒడంబడిక భావాన్ని నిలుపుతూ ‘అతని పితరుల దేవుడు’ అనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא הָלַךְ
  choice: నడవలేదు
  rationale: הלךలోని జీవన ప్రవర్తనను సూచించే బైబిలు రూపకాన్ని ‘నడవలేదు’ అని నిలుపుకున్నాం.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: యాహ్వే మార్గంలో
  rationale: דרך ఇక్కడ జీవన విధానం లేదా ఒడంబడిక మార్గాన్ని సూచిస్తుంది; ‘మార్గంలో’ మూలంలోని రూపకాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: אֲבֹתָיוలోని పుంలింగ పూర్వీకుల భాష
  choice: తన పితరులు
  alternative: తన పూర్వీకులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘అతని తండ్రులు/పితరులు’ అని ఉన్నందున మూలంలోని పుంలింగ కుటుంబ వ్యక్తీకరణను నిలిపాం; విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘మార్గంలో నడవడం’ అనే మూలంలోని బైబిలు రూపకాన్ని నిలుపుకున్నాం.
