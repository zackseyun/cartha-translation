source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/כָל הַ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֣ךְ אָבִ֑י/ו וַֽ/יַּעֲבֹ֗ד אֶת הַ/גִּלֻּלִים֙ אֲשֶׁ֣ר עָבַ֣ד אָבִ֔י/ו וַ/יִּשְׁתַּ֖חוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: te
  text: అతడు తన తండ్రి నడిచిన మార్గమంతా అతడూ నడిచాడు. తన తండ్రి సేవించిన విగ్రహాలను[a] సేవించాడు, వాటికి సాగిలపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విగ్రహాలు’ అని అనువదించిన హీబ్రూ పదం ధిక్కారపూర్వకమైనది; దాన్ని ‘అసహ్యమైన విగ్రహాలు’ లేదా అక్షరార్థ ఛాయతో ‘పేడ-విగ్రహాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: అతడు తన తండ్రి నడిచిన మార్గమంతటిలో నడిచాడు
  rationale: הלך మరియు דרך కలసి జీవన ప్రవర్తనను సూచించే నడక-మార్గం రూపకాన్ని ఏర్పరుస్తాయి. తెలుగు వాక్యం ఆ రూపకాన్ని నిలుపుతూ, בְּכָל యొక్క సమగ్ర భావాన్ని ‘మార్గమంతటిలో’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲבֹד
  choice: సేవచేసి
  rationale: עבד ఇక్కడ ఆరాధన సంబంధమైన సేవను సూచిస్తుంది. తరువాతి השתחוה క్రియతో ఉన్న భేదాన్ని నిలుపుటకు ‘ఆరాధించాడు’ అని రెండింటినీ ఒకే భావంగా చేయకుండా ‘సేవచేశాడు’ అనే పదాన్ని ఎంచుకున్నాం.
- source_word: הַגִּלֻּלִים
  choice: విగ్రహాలకు
  rationale: గిల్లులీమ్ విగ్రహాలను ధిక్కారంగా సూచించే పదం. ప్రధాన వాక్యంలో సహజమైన, స్పష్టమైన ‘విగ్రహాలు’ వాడి, దాని అవమానార్థ ఛాయను పాదసూచికలో తెలిపాం.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: వాటికి సాగిలపడ్డాడు
  rationale: השתחוה గౌరవం లేదా ఆరాధనగా శరీరాన్ని వంచి నేలకు సాగిలపడే చర్యను సూచిస్తుంది. ‘సాగిలపడ్డాడు’ భౌతిక చర్యను నిలుపుతూ, ముందున్న ‘సేవచేశాడు’తో పదార్థ భేదాన్ని కాపాడుతుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: హీబ్రూలో రెండుసార్లు వచ్చిన తండ్రి ప్రస్తావనను తెలుగులోనూ రెండుసార్లు నిలిపి, అతడు తన తండ్రి ప్రవర్తనను కొనసాగించాడనే నొక్కిచెప్పడాన్ని కాపాడాం.
theological_decisions:
- issue: גִּלֻּלִים అనే ధిక్కారపూర్వక విగ్రహ పదం అనువాదం
  choice: విగ్రహాలు
  alternative: అసహ్యమైన విగ్రహాలు; పేడవంటి విగ్రహాలు
  rationale: మూలపదానికి స్పష్టమైన ధిక్కార ఛాయ ఉన్నప్పటికీ, ‘విగ్రహాలు’ సాధారణ పాఠకునికి సూచిత వస్తువును సహజంగా తెలియజేస్తుంది. మూలంలోని అవమానార్థాన్ని ప్రధాన వాక్యంపై అనవసర వివరణాత్మక భారముంచకుండా పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం వాడుతూ, మూలంలోని ‘మార్గంలో నడవడం,’ ‘సేవచేయడం,’ ‘సాగిలపడడం’ అనే వేర్వేరు భావచిత్రాలను నిలిపాం.
