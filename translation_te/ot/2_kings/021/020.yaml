reference: 2 Kings 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: te
  text: అతడు తన తండ్రియైన మనష్షే చేసినట్లే యాహ్వే దృష్టిలో చెడు చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “యాహ్వే కళ్లలో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: అతడు ... చెడ్డది చేశాడు
  rationale: עשה הרע అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘చెడ్డది చేశాడు’గా అందించింది; కథనాన్ని కొనసాగించే వావ్‌కు ప్రత్యేకంగా ‘మరియు’ చేర్చడం తెలుగులో అవసరం లేదు.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: అక్షరార్థంగా ‘యెహోవా కళ్లలో’ అయిన ఈ మూల్యాంకన నుడికారాన్ని, దాని రూపక భావాన్ని సహజంగా నిలుపుతూ ‘యెహోవా దృష్టిలో’గా అనువదించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: చేసినట్లే
  rationale: తండ్రి చేసిన పనులతో సూటిగా పోల్చే כַּאֲשֶׁר భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు పోలికగా అందించింది.
- source_word: מְנַשֶּׁה אָבִיו
  choice: తన తండ్రి మనష్షే
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని ‘తన’గా సహజంగా వ్యక్తపరుస్తూ, వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా పేరుగానే ఉంచింది; తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన బైబిలు శైలిని నిలుపుకుంది. పోలికను ముందుంచడం తెలుగు వాక్యప్రవాహాన్ని సహజం చేస్తుంది.
