  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: te
  text: “నేను వారి పితరులకు[b] ఇచ్చిన దేశం నుండి ఇశ్రాయేలు పాదం మరల సంచరించేలా చేయను[a]—వారు నేను వారికి ఆజ్ఞాపించిన సమస్తాన్నీ, నా సేవకుడైన మోషే వారికి ఆజ్ఞాపించిన ధర్మశాస్త్రమంతటినీ ఆచరించడానికి జాగ్రత్తపడితేనే.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు పాదం సంచరించేలా చేయను.’ ఈ హీబ్రూ ప్రయోగం ఇశ్రాయేలును దేశం నుండి కదిలించడం లేదా తొలగించడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి పూర్వీకులకు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ‘పితరులు’ అనేది ఇశ్రాయేలు పూర్వీకులను సూచించే స్థిరమైన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: ఇకపై ... చేయను
  rationale: לֹא אֹסִיף అనే హీబ్రూ ప్రయోగం ‘మళ్లీ చేయను/ఇకపై చేయను’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘ఇకపై’ ఎంచుకున్నాం.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాదం ... సంచరించేలా చేయను
  rationale: హీబ్రూలోని ఏకవచన ‘పాదం’ అనే సజీవ రూపకాన్ని నిలుపుతూ, అది దేశం నుండి స్థానభ్రంశం చెందడాన్ని సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం.
- source_word: הָאֲדָמָה
  choice: దేశం
  rationale: పితరులకు ఇచ్చిన వాగ్దాన భూభాగమే సందర్భం కాబట్టి ‘నేల’ కంటే ‘దేశం’ తగినది.
- source_word: לַאֲבוֹתָם
  choice: వారి పితరులకు
  rationale: ఇది ఇశ్రాయేలు పూర్వపితరులను సూచించే నిబంధనాత్మక వ్యక్తీకరణ. మూలంలోని రూపాన్ని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: רַק אִם
  choice: '... నడుచుకుంటేనే'
  rationale: ఈ పదబంధంలోని పరిమిత షరతును తెలుగు ‘తేనే’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: జాగ్రత్తగా నడుచుకుంటేనే
  rationale: శ్రద్ధగా కాపాడుకొని ఆచరించాలనే భావాన్ని తెలుగులో సహజమైన విధేయతా ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: నేను వారికి ఆజ్ఞాపించిన వాటన్నిటి ప్రకారం
  rationale: כְּ ఉపసర్గలోని ‘ప్రకారం’ అనే అనుగుణత భావాన్ని, כֹל లోని సంపూర్ణతను నిలుపుతుంది.
- source_word: וּלְכָל הַתּוֹרָה
  choice: ధర్మశాస్త్రమంతటి ప్రకారం
  rationale: మోషే ద్వారా ఇచ్చిన తోరాను ఈ సందర్భంలో ‘ధర్మశాస్త్రం’ సహజంగా సూచిస్తుంది; ‘ఉపదేశం’ అనే విస్తృత అర్థాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַבְדִּי מֹשֶׁה
  choice: నా సేవకుడైన మోషే
  rationale: గౌరవార్థకమైన మూల వ్యక్తీకరణను సహజమైన తెలుగు పదక్రమంలో నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దేశంలో ఇశ్రాయేలు స్థిరనివాసానికి విధేయత షరతుగా ఉండడం
  choice: ‘వారు ... జాగ్రత్తగా నడుచుకుంటేనే ఇది జరుగుతుంది’ అని నిజమైన షరతుగా అనువదించడం
  alternative: వాగ్దానం షరతులేనిదిగా వినిపించేలా షరతును మృదువుపరచడం
  rationale: רַק אִם స్పష్టమైన పరిమిత షరతును ప్రవేశపెడుతుంది. ఇతర వాగ్దాన సంప్రదాయాలతో ఉన్న వేదాంత ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకుండా మూలంలోని షరతును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ ఏకవచన ‘ఇశ్రాయేలు పాదం’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదసూచికతో అర్థాన్ని వివరించాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ‘ఇది జరుగుతుంది’ ముందున్న వాగ్దానాన్ని తిరిగి సూచిస్తుంది.
