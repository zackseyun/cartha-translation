  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אָמ֣וֹן בְּ/מָלְכ֔/וֹ וּ/שְׁתַּ֣יִם שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מְשֻׁלֶּ֥מֶת בַּת חָר֖וּץ מִן יָטְבָֽה־־־׃
base_translation:
