  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: te
  text: ఆమోను రాజైనప్పుడు అతనికి ఇరవై రెండు సంవత్సరాలు. అతడు యెరూషలేములో రెండు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు మెషుల్లెమెతు; ఆమె యొట్బాకు చెందిన హారూజు కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: అతనికి ఇరవై రెండు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూచించే ప్రామాణిక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ב ఉపసర్గతో కూడిన క్రియానామ రూపం రాజ్యారంభ సమయాన్ని సూచిస్తుంది; ఈ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలన సాగించడాన్ని సూచించే క్రియాభావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ప్రయోగాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: వంశావళి సమాచారాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: מְשֻׁלֶּמֶת
  choice: మెషుల్లెమెతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా అందిస్తుంది.
- source_word: בַּת חָרוּץ
  choice: హారూసు కుమార్తె
  rationale: తండ్రి సంబంధాన్ని తెలిపే హీబ్రూ వంశసూచక నిర్మాణాన్ని స్పష్టంగా అనువదిస్తుంది.
- source_word: מִן יָטְבָה
  choice: యొట్బాకు చెందిన
  rationale: מִן సూచించే మూలస్థాన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
