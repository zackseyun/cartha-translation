translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే రాజవంశ చారిత్రక వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా దాని సమాచార క్రమం మరియు భావాన్ని కాపాడింది.
