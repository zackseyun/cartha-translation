source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: te
  text: కానీ వారు వినలేదు. యాహ్వే ఇశ్రాయేలు కుమారుల ఎదుటనుండి నాశనం చేసిన జాతులకంటే మరింత చెడు చేయునట్లు మనష్షే వారిని తప్పుదారి పట్టించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జాతులు చేసినదానికంటే ఎక్కువ చెడు చేయునట్లు.’ హీబ్రూలో తులనార్థకమైన నిర్మాణం ‘జాతులకంటే’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: వినలేదు
  rationale: ఈ సందర్భంలో మాట వినడమే కాక దానికి విధేయంగా స్పందించడమనే భావం కూడా ఉంది. ‘వినలేదు’ రెండు భావాలకూ చోటిస్తూ, ‘లోబడలేదు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַיַּתְעֵם
  choice: వారిని తప్పుదారి పట్టించి
  rationale: תעה ధాతువు హిఫీల్ రూపం మనష్షే ప్రజలు నైతికంగా, ఆధ్యాత్మికంగా దారి తప్పేలా చేశాడనే కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת אֶת הָרָע מִן הַגּוֹיִם
  choice: జనాలకంటే ఎక్కువ చెడు చేయించాడు
  rationale: מִן ఇక్కడ తులనార్థకం. మనష్షే వారిని నడిపించిన ఫలితాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ‘చేయించాడు’ అని, తులనను స్పష్టంగా ఉంచడానికి ‘కంటే ఎక్కువ’ అని అనువదించాం.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఈ చారిత్రక సందర్భంలో ఇది ఇశ్రాయేలు ఎదుటనుండి తొలగించబడిన ఇతర ప్రజాసమూహాలను సూచిస్తుంది; తరువాతి మతపరమైన ప్రత్యేకార్థం గల పదాన్ని ఉపయోగించలేదు.
- source_word: הִשְׁמִיד
  choice: నాశనం చేసిన
  rationale: ఈ క్రియ నిర్మూలించడం లేదా నాశనం చేయడం అనే బలమైన భావాన్ని కలిగి ఉంది; తెలుగు సంబంధవాక్యంలో గతకాల సంబంధం సందర్భం ద్వారానే స్పష్టమవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిలిపి చేశాం.
- source_word: מִפְּנֵי
  choice: ఎదుటనుండి
  rationale: జయాపజయ సందర్భంలో ఈ పదబంధం ఇశ్రాయేలు సమక్షం నుండి లేదా వారి ముందునుండి ఆ జనాలు తొలగించబడినట్లు సూచిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో యథాశక్తి నిలిపి, అది మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ప్రతిలిపి చేశాం; తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమూహ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని నిలిపాం; సందర్భంలో ఇది ఒడంబడిక ప్రజలందరినీ సమూహంగా సూచించవచ్చనే విషయాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- issue: చెడుతో సంబంధించిన తులన నిర్మాణం
  choice: జనాలకంటే ఎక్కువ చెడు
  alternative: జనాలు చేసినదానికంటే చెడ్డగా ప్రవర్తించడం
  rationale: హీబ్రూ מִן తులనను సూచించినా, తులన యొక్క ఖచ్చిత విస్తృతి సంక్షిప్త నిర్మాణంలో ఉంది. ప్రధాన పాఠ్యం సహజమైన తులనను ఇస్తూ, ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం ఉపయోగించాం. మూలంలోని కారణార్థం, తులన, ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం నిలిపాం; దైవనామాన్ని బిరుదుగా మార్చలేదు.
