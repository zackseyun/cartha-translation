revisions:
- from: కానీ వారు వినలేదు. మనష్షే వారిని తప్పుదారి పట్టించి, ఇశ్రాయేలు కుమారుల ఎదుటనుండి యెహోవా నాశనం చేసిన జనాలకంటే ఎక్కువ చెడు చేయించాడు.[a]
  to: కానీ వారు వినలేదు. యాహ్వే ఇశ్రాయేలు కుమారుల ఎదుటనుండి నాశనం చేసిన జాతులకంటే మరింత చెడు చేయునట్లు మనష్షే వారిని తప్పుదారి పట్టించాడు.[a]
  rationale: సవరించిన పాఠ్యం మూలంలోని క్రమాన్ని, మనష్షే ప్రజలను దారి తప్పించిన కారణార్థాన్ని, మరియు జాతులతో ఉన్న తులనను నిలుపుతుంది. ‘యాహ్వే’ POB దైవనామ విధానానికి అనుగుణం. ‘ఇశ్రాయేలు కుమారులు’ ప్రధాన పాఠ్యంలోనే ఉంచబడింది; అవసరం లేని అదనపు ప్రత్యామ్నాయ పాదటిప్పణి తొలగించి, అసలు తులనకు సంబంధించిన ప్రత్యామ్నాయాన్నే పాదటిప్పణిలో ఇచ్చాం.
