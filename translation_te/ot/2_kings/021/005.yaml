source:
  edition: WLC
  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: te
  text: అతడు యాహ్వే మందిరంలోని రెండు ప్రాంగణాల్లో ఆకాశ సైన్యమంతటికీ[a] బలిపీఠాలు కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశంలోని సైన్యమంతటికీ.’ ‘ఆకాశ సైన్యం’ అనే హీబ్రూ నుడికారం ఆకాశానికి చెందిన సమూహాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది నక్షత్రారాధనలో పూజించబడిన ఆకాశ వస్తువులను లేదా శక్తులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: అతడు ... కట్టాడు
  rationale: בנה అనే క్రియ యొక్క Qal wayyiqtol రూపం గత కథనంలో వరుసగా జరిగిన చర్యను సూచిస్తుంది. తెలుగులో సహజమైన కథనశైలికి ‘అతడు ... కట్టాడు’ అని అనువదించాం.
- source_word: מִזְבְּחוֹת
  choice: బలిపీఠాలు
  rationale: ఆరాధన లేదా బలి అర్పణ కోసం నిర్మించిన పీఠాలను సూచించే సాధారణ బహువచన పదం.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: ఆకాశ సైన్యమంతటికీ
  rationale: ‘ఆకాశ సైన్యం’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, כָל యొక్క సమగ్ర భావాన్ని ‘అంతటికీ’ వ్యక్తం చేస్తుంది. సందర్భంలో ఇది నక్షత్రాది ఆకాశ వస్తువులను లేదా పూజించబడిన ఆకాశ శక్తులను సూచించవచ్చు; అనువాదం ఆ ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: రెండు ప్రాంగణాల్లో
  rationale: సంఖ్య రెండు అని స్పష్టంగా ఉంచి, దేవాలయ పరిసరాల్లోని courts అనే భావానికి ఆధునిక తెలుగులో సహజమైన ‘ప్రాంగణాలు’ వాడాం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యాహ్వే గృహం’; ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున సాధారణ పాఠకులకు స్పష్టమైన ‘మందిరం’ను ఎంచుకున్నాం. יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: ‘ఆకాశ సైన్యం’ యొక్క సూచన
  choice: విస్తృతమైన హీబ్రూ నుడికారాన్ని యథాతథంగా ఉంచడం
  alternative: నక్షత్రాలన్నిటికీ
  rationale: ఈ సందర్భంలో నక్షత్రారాధన ప్రధానంగా ఉద్దేశించబడి ఉండవచ్చు; అయినా צְבָא הַשָּׁמָיִם అనే పదబంధం ఆకాశ వస్తువులు లేదా శక్తులు అనే విస్తృత భావాన్ని కలిగి ఉండగలదు. కాబట్టి దాన్ని కేవలం నక్షత్రాలకు పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఆకాశ సైన్యం’ అనే మూల నుడికారాన్ని దాని భావపరమైన విస్తృతి, మతపరమైన ఉద్వేగం నిలిచేలా ఉంచాం; ‘మందిరం’, ‘ప్రాంగణాలు’, ‘బలిపీఠాలు’ సాధారణ పాఠకులకు స్పష్టమైన పదాలు.
