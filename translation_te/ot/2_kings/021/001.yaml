  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: te
  text: మనష్షే రాజ్యపాలన ప్రారంభించినప్పుడు అతనికి పన్నెండేళ్లు. అతడు యెరూషలేములో యాభై ఐదు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు హెఫ్సీబా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెఫ్సీబా అనే పేరుకు సుమారుగా, “ఆమెయందే నా ఆనందం” అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: పన్నెండేళ్ల వయసులో
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, అర్థం మారకుండా వ్యక్తపరుస్తుంది.
- source_word: בְמָלְכוֹ
  choice: రాజయ్యాడు
  rationale: ఇక్కడి కాలసూచక నిర్మాణం అతడు రాజ్యపాలన ప్రారంభించిన సమయాన్ని తెలియజేస్తుంది; ముందు ఉన్న వయస్సు పదబంధంతో కలిపి ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: యాభై ఐదు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా సమన్వయాన్ని ఆధునిక తెలుగు సంఖ్యా ప్రయోగంలో సహజంగా అందిస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజు పాలించిన కాలాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలవాచక ב భావాన్ని ‘లో’ విభక్తితో తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ పరిచయ సూత్రాన్ని ఆధునిక తెలుగు వాక్యనిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: חֶפְצִי בָהּ
  choice: హెఫ్సీబా
  rationale: పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, దాని భావాన్ని పాదసూచికలో ఇస్తుంది.
