  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: te
  text: అతడు తన కుమారుణ్ణి అగ్నిలో దాటించాడు[a]. అతడు సోదె చెప్పాడు, శకునాలు చూశాడు[b], మాధ్యమికులతోను ఆత్మజ్ఞానులతోను వ్యవహరించాడు[c]. యాహ్వే దృష్టిలో చెడును చేయడంలో అతడు మితిమీరి, ఆయనకు కోపం పుట్టించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, “తన కుమారుణ్ణి అగ్నిలో బలిగా అర్పించాడు” అని అర్థం కావచ్చు. హీబ్రూలో అక్షరార్థంగా “తన కుమారుణ్ణి అగ్నిలో దాటించాడు” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: “శకునాలు చూశాడు” అనే మాటకు “సూచనలను బట్టి భవిష్యత్తు చెప్పాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ వాక్యప్రయోగం కష్టమైనది. “మాధ్యమికులను, ఆత్మజ్ఞానులను సంప్రదించాడు” అని కూడా అనువదించవచ్చు; అయితే వారితో అతనికి ఉన్న ప్రమేయం అంతకంటే విస్తృతమైనదై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: తన కుమారుణ్ణి అగ్నిలోనుండి దాటించాడు
  rationale: హీబ్రూ వాక్యప్రయోగాన్ని ప్రధాన పాఠంలో నిలుపుతుంది. ఇది కుమారుణ్ణి అగ్నిలో బలి ఇచ్చే ఆచారాన్ని సూచించే అవకాశం బలంగా ఉన్నా, ఆ నిర్దిష్ట అర్థాన్ని పాఠంలోనే బలవంతంగా చేర్చకుండా పాదసూచికలో వివరిస్తుంది.
- source_word: וְעוֹנֵן
  choice: మాంత్రికంగా భవిష్యత్తు చెప్పాడు
  rationale: నిషిద్ధమైన గూఢ పద్ధతులతో భవిష్యత్తు తెలుసుకోవడం లేదా చెప్పడం అనే భావాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది; తరువాతి శకునదర్శనంతో దీనిని పూర్తిగా కలిపివేయదు.
- source_word: וְנִחֵשׁ
  choice: శకునాలు చూశాడు
  rationale: נחשׁ ఇక్కడ సూచనలు లేదా శకునాల ఆధారంగా భవిష్యత్తును నిర్ధారించే క్రియను సూచిస్తుంది. ‘శకునాలు చూశాడు’ సహజమైన తెలుగులో ఆ భావాన్ని అందిస్తుంది.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: ప్రేతాత్మలతో మాట్లాడేవారితో, ఆత్మల ద్వారా జ్ఞానం చెప్పేవారితో వ్యవహరించాడు
  rationale: עשה అనే విస్తృతమైన, కష్టమైన వాక్యప్రయోగాన్ని ‘వ్యవహరించాడు’గా ఉంచి, కేవలం సంప్రదించాడా, నియమించాడా, ఉపయోగించుకున్నాడా అనే విషయాన్ని నిర్దిష్టం చేయదు. రెండు రకాల ఆత్మసంబంధ అభ్యాసకుల మధ్య ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: చెడ్డది చేయడంలో మితిమీరాడు
  rationale: ‘చేయడాన్ని విస్తరించాడు/అధికం చేశాడు’ అనే హీబ్రూ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హీబ్రూ మూలంలోని దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తూ, ‘కళ్లలో’ అనే మూలరూపానికి సహజమైన తెలుగు సమానార్థకంగా ‘దృష్టిలో’ను వాడుతుంది.
- source_word: לְהַכְעִיס
  choice: ఆయనకు కోపం పుట్టించాడు
  rationale: కారణార్థక క్రియ యొక్క బలాన్ని సహజమైన తెలుగులో నిలుపుతూ, దాని లక్ష్యం యాహ్వే అని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: కుమారుణ్ణి అగ్నిలో దాటించడం అనే ఆచారం ఎంత స్పష్టంగా అనువదించాలి
  choice: ప్రధాన పాఠంలో ‘తన కుమారుణ్ణి అగ్నిలోనుండి దాటించాడు’ అనే హీబ్రూ వాక్యప్రయోగాన్ని నిలుపడం
  alternative: ‘తన కుమారుణ్ణి అగ్నిలో బలిగా అర్పించాడు’ లేదా ‘అగ్నిలో కాల్చాడు’
  rationale: సందర్భం బాలబలిని బలంగా సూచించినప్పటికీ, హీబ్రూ పదాలు నేరుగా ‘బలి ఇచ్చాడు’ లేదా ‘కాల్చాడు’ అని చెప్పవు. అందువల్ల మూలంలోని ఉద్వేగాన్నీ కొంత అస్పష్టతనూ ప్రధాన పాఠంలో నిలిపి, సంభావ్య స్పష్టార్థాన్ని పాదసూచికలో ఇస్తుంది.
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా అందిస్తుంది.
- issue: עשה אוב וידענים అనే కష్టమైన వాక్యప్రయోగం
  choice: వారితో ‘వ్యవహరించాడు’ అనే విస్తృతార్థాన్ని నిలుపడం
  alternative: వారిని ‘సంప్రదించాడు’ లేదా ‘నియమించాడు’
  rationale: హీబ్రూ వాక్యప్రయోగం అతని ప్రమేయాన్ని తెలియజేస్తుంది గాని, అది కేవలం సంప్రదింపా, నియామకమా, లేక మరొక విధమైన వినియోగమా అనేది ఖచ్చితంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. గూఢాచారాలకు సంబంధించిన వేర్వేరు హీబ్రూ పదాలను వీలైనంతవరకు వేరు చేసి చూపించింది. ‘చెడ్డది చేయడంలో మితిమీరాడు’ అనే రూపం మూలంలోని తీవ్రతను సహజంగా అందిస్తుంది; దైవనామం ‘యాహ్వే’గా ఉంచబడింది.
