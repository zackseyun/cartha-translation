revisions:
- from: అంతేకాక, మనష్షే నిర్దోషుల రక్తాన్ని ఎంతో విస్తారంగా చిందించి, యెరూషలేమును ఒక చివర నుంచి మరో చివర వరకు[a] నింపాడు. యూదా ప్రజలు యెహోవా దృష్టిలో చెడైనది చేసి పాపం చేసేలా అతడు చేసిన పాపానికి అదనంగా ఇదంతా చేశాడు.
  to: అంతేకాక, మనష్షే ఎంతో ఎక్కువ నిర్దోష రక్తాన్ని చిందించాడు; యెరూషలేము ఒక చివర నుంచి మరో చివర వరకు[a] నిండిపోయేంతగా చిందించాడు. యాహ్వే దృష్టిలో చెడైనది చేయడానికి అతడు యూదాను పాపం చేయించిన తన పాపానికి అదనంగా అతడు ఇలా చేశాడు.
  rationale: The revision removes the non-source expression “ఇదంతా చేశాడు,” retains the extent idiom with its footnote anchor, gives a more natural Telugu expression for the great quantity of bloodshed, preserves the causative sense that Manasseh made Judah sin, and aligns the rendering of יהוה with the supplied Yahweh policy. The final “అతడు ఇలా చేశాడు” refers only to the stated bloodshed and is used to complete the Telugu sentence while maintaining the Hebrew’s ‘besides’ relationship.
