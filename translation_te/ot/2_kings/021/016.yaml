  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: te
  text: అంతేకాక, మనష్షే ఎంతో ఎక్కువ నిర్దోష రక్తాన్ని చిందించాడు; యెరూషలేము ఒక చివర నుంచి మరో చివర వరకు[a] నిండిపోయేంతగా చిందించాడు. యాహ్వే దృష్టిలో చెడైనది చేయడానికి అతడు యూదాను పాపం చేయించిన తన పాపానికి అదనంగా అతడు ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘నోటి నుంచి నోటి వరకు’ అని ఉంది. ఇది నగరమంతటా, ఒక చివర నుంచి మరో చివర వరకు అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందు చెప్పిన అపరాధాలకు మరొక తీవ్రమైన అపరాధాన్ని జోడిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דָּם נָקִי
  choice: నిర్దోషుల రక్తం
  rationale: మరణశిక్షకు తగిన నేరం చేయని వారిని చంపడమనే న్యాయపరమైన, నైతికమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שָׁפַךְ
  choice: చిందించాడు
  rationale: రక్తంతో వాడినప్పుడు హత్య చేయడాన్ని సూచించే హీబ్రూ ప్రయోగానికి సమీపంగా ఉండే సహజ తెలుగు నుడికారం.
- source_word: הַרְבֵּה מְאֹד
  choice: ఎంతో విస్తారంగా
  rationale: రక్తపాతం అత్యధిక స్థాయిలో జరిగిందనే ద్విగుణిత తీవ్రతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: యెరూషలేమును ఒక చివర నుంచి మరో చివర వరకు నింపాడు
  rationale: అక్షరార్థంగా ‘నోటి నుంచి నోటి వరకు’ అనే హీబ్రూ నుడికారానికి ఉద్దేశించిన, నగరమంతటా అనే అర్థాన్ని స్పష్టంగా అందిస్తుంది; ‘నింపాడు’ అనే బలమైన రూపకాన్ని నిలుపుతుంది.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: అతడు చేసిన పాపానికి అదనంగా
  rationale: రక్తపాతం ముందుగా వివరించిన అతని పాపానికి తోడైన మరొక అపరాధమని తెలియజేస్తూ, హీబ్రూలోని ఏకవచన ‘పాపం’ను నిలుపుతుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: యూదా ప్రజలు ... పాపం చేసేలా అతడు చేసిన
  rationale: హిఫీల్ క్రియలోని కారణార్థాన్ని నిలుపుతుంది. ప్రాంతం పేరైన ‘యూదా’ ఇక్కడ ప్రజలను సూచిస్తున్నందున తెలుగులో ‘యూదా ప్రజలు’ అని స్పష్టం చేయబడింది.
- source_word: לַעֲשׂוֹת הָרַע
  choice: చెడైనది చేసి
  rationale: యూదా చేసిన పాపం యొక్క స్వరూపాన్ని తెలిపే హీబ్రూ క్రియార్థక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: హీబ్రూ మూలంలోని మూల్యాంకన నుడికారాన్ని తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం జరిగింది.
- issue: הֶחֱטִיא లో మనష్షే బాధ్యత యొక్క బలం
  choice: యూదా ప్రజలు పాపం చేసేలా అతడు చేశాడు
  alternative: యూదాను పాపంలోకి నడిపించాడు
  rationale: హీబ్రూ కారణార్థక క్రియ మనష్షే చురుకైన కారణకర్త అని చెబుతుంది; దాన్ని మృదువుగా చేయకుండా, ప్రజల వ్యక్తిగత కార్యసామర్థ్యాన్ని పూర్తిగా తొలగించకుండా తెలుగులో వ్యక్తం చేయబడింది.
- issue: ‘అతని పాపం’కు సంబంధవాక్యపు అనుసంధానం
  choice: యూదా ప్రజలు పాపం చేసేలా అతడు చేసిన పాపం
  alternative: యూదాను పాపం చేయించడంతో పాటు
  rationale: హీబ్రూ ఏకవచన ‘అతని పాపం’ను, దానిని వివరించే సంబంధవాక్యాన్ని నిలుపుతూ, అది అతని విస్తృత అపరాధపూరిత ప్రవర్తనను సంగ్రహించవచ్చనే అర్థాన్ని బలవంతంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినా, అదనపు అపరాధం, విస్తారమైన నిర్దోష రక్తపాతం, యూదాను పాపం చేయించిన కారణార్థం, యెహోవా దృష్టిలోని నైతిక తీర్పు అన్నీ నిలుపబడ్డాయి.
