  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: మనష్షే ఇతర కార్యాలు, అతడు చేసినదంతా, అతడు చేసిన పాపం—ఇవన్నీ యూదా రాజుల వృత్తాంతాల గ్రంథంలో[a] వ్రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుల చరిత్రల గ్రంథంలో.’ హీబ్రూ పదబంధం రాజుల పాలనకు సంబంధించిన అధికారిక లిఖితాధారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: మనష్షే చేసిన మిగతా కార్యాలన్నీ
  rationale: రాజుల పాలనా సంగ్రహాల్లో דִּבְרֵי అనేది కేవలం మాటలను కాక రాజు కార్యాలను, వ్యవహారాలను సూచిస్తుంది. వְ యొక్క అనుసంధాన భావం తెలుగులో సహజమైన వాక్యప్రవాహంలో అంతర్భవిస్తుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: మూలంలోని సమగ్రతను, సంబంధ వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: అతడు చేసిన పాపం
  rationale: హీబ్రూలోని సమానధాతు నిర్మాణం పాపాన్ని ప్రత్యేకంగా నొక్కిచెబుతుంది. తెలుగులో అసహజమైన ‘అతడు పాపం చేసిన అతని పాపం’ అనే పునరుక్తిని నివారిస్తూ నైతిక-మతపరమైన బలాన్ని నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే మూలంలోని ప్రతికూల అలంకారప్రశ్నను ‘కదా?’తో సహజంగా నిలుపుతుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల వృత్తాంతాల గ్రంథంలో
  rationale: ఇది యూదా రాజులకు సంబంధించిన రాజరిక లిఖితాధారాన్ని సూచించే శీర్షికసదృశ ప్రయోగం. ‘వృత్తాంతాలు’ కాలక్రమంగా నమోదైన ఘటనలు/కార్యాల భావాన్ని అందిస్తుంది; עַל‌ను ఈ సందర్భంలో సహజంగా ‘గ్రంథంలో’ అని అనువదించాం.
