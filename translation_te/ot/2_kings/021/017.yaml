  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా రూపొందించబడింది. ‘రాయబడి ఉన్నాయి కదా?’ అనే రూపం మూలంలోని అలంకారప్రశ్నను కాపాడుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
