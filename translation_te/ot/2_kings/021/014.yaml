  edition: WLC
  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: te
  text: నా స్వాస్థ్యంలో మిగిలిన వారిని నేను విడిచిపెట్టి[a], వారిని వారి శత్రువుల చేతికి అప్పగిస్తాను. వారు తమ శత్రువులందరికీ దోపుడు సొమ్ముగా, కొల్లసొమ్ముగా మారుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిత్యజించి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: నేను విడిచిపెట్టి
  rationale: נטשׁ విడిచిపెట్టడం లేదా పరిత్యజించడం అనే న్యాయతీర్పు భావాన్ని కలిగిస్తుంది; ఆధునిక తెలుగులో ‘విడిచిపెట్టు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁאֵרִית נַחֲלָתִי
  choice: నా స్వాస్థ్యంలో మిగిలినవారిని
  rationale: שְׁאֵרִית ‘మిగిలిన భాగం/శేషం’ను, נַחֲלָה దేవునికి చెందిన వారసత్వ భాగాన్ని సూచిస్తాయి. సందర్భంలో ప్రజలు ఉద్దేశించబడినందున ‘మిగిలినవారు’ అని వ్యక్తులను స్పష్టపరుస్తూ, ‘స్వాస్థ్యం’ నిబంధనాత్మక సొంతత్వ భావాన్ని నిలుపుతుంది.
- source_word: וּנְתַתִּים בְּיַד אֹיְבֵיהֶם
  choice: వారిని వారి శత్రువుల చేతికి అప్పగిస్తాను
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారానికి శత్రువుల అధికారానికి అప్పగించడం అనే అర్థం ఉంది; ‘చేతికి అప్పగించు’ మూల రూపకాన్నీ సహజ తెలుగు ప్రయోగాన్నీ కాపాడుతుంది.
- source_word: וְהָיוּ
  choice: మారుతారు
  rationale: అప్పగింపుకు కలిగే ఫలిత స్థితిని היה ఇక్కడ సూచిస్తుంది; అందువల్ల ‘ఉంటారు’ కంటే ‘మారుతారు’ అనుకూలం.
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: దోపుడు సొమ్ముగా, కొల్లసొమ్ముగా
  rationale: ఈ సమీపార్థక పదజంట శత్రువుల దోపిడీకి గురయ్యే స్థితిని బలంగా పునరుక్తి చేస్తుంది; తెలుగులో రెండు వేరు కాని సమీపార్థక పదాలతో ఆ అలంకార బలం నిలుపబడింది.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: తమ శత్రువులందరికీ
  rationale: לְ సంబంధం/లబ్ధిదారుని సూచిస్తుంది; ‘శత్రువులందరికీ’ విస్తృత పరిధిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నా స్వాస్థ్యం’లోని నిబంధనాత్మక సొంతత్వ భావం
  choice: ‘నా స్వాస్థ్యం’గా ఉంచి, అది దేవునికి చెందిన మిగిలిన ప్రజలను సూచించేలా వాక్యనిర్మాణం చేయడం
  alternative: ‘నా సొత్తు’ లేదా ‘నా వారసత్వం’
  rationale: נַחֲלָה కేవలం సాధారణ ఆస్తికన్నా కేటాయించబడిన స్వాస్థ్యం/వారసత్వ భాగం అనే భావాన్ని మోస్తుంది. ‘స్వాస్థ్యం’ ఆ భావాన్ని నిలుపుతుంది; అది భూమికేనా ప్రజలకేనా అని అవసరానికి మించి సిద్ధాంతపరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ‘చేతికి’ అనే అధికార రూపకాన్ని నిలుపుతూ, దోపిడిని సూచించే జంట పదాల వాక్చాతుర్యాన్ని సంరక్షించింది.
