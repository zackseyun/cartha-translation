  to: 'అతడు తాను చేసిన అషేరా యొక్క చెక్కిన ప్రతిమను మందిరంలో ఉంచాడు. ఆ మందిరం గురించి యెహోవా దావీదుతో, అతని కుమారుడైన సొలొమోనుతో ఇలా చెప్పాడు: “ఈ మందిరంలోను, ఇశ్రాయేలు గోత్రాలన్నిటిలోనుంచి నేను ఎంచుకున్న యెరూషలేములోను నా నామాన్ని శాశ్వతంగా ఉంచుతాను.”'
