source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: te
  text: 'అతడు తాను చేసిన అషేరా యొక్క చెక్కిన ప్రతిమను మందిరంలో ఉంచాడు. ఆ మందిరం గురించి యెహోవా దావీదుతో, అతని కుమారుడైన సొలొమోనుతో ఇలా చెప్పాడు: “ఈ మందిరంలోను, ఇశ్రాయేలు గోత్రాలన్నిటిలోనుంచి నేను ఎంచుకున్న యెరూషలేములోను నా నామాన్ని శాశ్వతంగా ఉంచుతాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂוּם ఇక్కడ ఒక వస్తువును నిర్దిష్ట స్థలంలో పెట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉంచాడు’ సహజంగా, తటస్థంగా ఉంది.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: అషేరా చెక్కిన ప్రతిమ
  rationale: פֶּסֶל యొక్క చెక్కి రూపొందించిన ప్రతిమ అనే స్పష్టమైన భావాన్ని నిలుపుతూ, הָאֲשֵׁרָהతో దాని సంబంధాన్ని తెలియజేస్తుంది; ‘అషేరా స్తంభం’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను చేయించిన
  rationale: రాజు స్వయంగా చెక్కాడనే అవసరం లేకుండా, అతని ఆధ్వర్యంలో తయారైనదనే సహజమైన రాజవృత్తాంత భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּבַּיִת / בַּבַּיִת הַזֶּה
  choice: మందిరంలో / ఈ మందిరంలో
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, సందర్భంలో యెహోవా ఆలయాన్నే సూచిస్తుంది; సాధారణ తెలుగు పాఠకునికి ‘మందిరం’ స్పష్టంగా ఉంటుంది, రెండు చోట్ల పునరావృతిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుంచి
  rationale: מן తో కూడిన ఎంపిక భావాన్ని—అన్నిటిలోనుంచి ఎంచుకోవడం—స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: నా నామాన్ని శాశ్వతంగా ఉంచుతాను
  rationale: దేవుడు తన నామాన్ని అక్కడ ఉంచుతాననే మందిర సంబంధిత వాక్యరూపాన్ని వివరణతో భర్తీ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: అషేరాకు సంబంధించిన ఆరాధనా వస్తువు స్వరూపం
  choice: అషేరా చెక్కిన ప్రతిమ
  alternative: అషేరా స్తంభం
  rationale: హీబ్రూ వాక్యంలో פֶּסֶל (‘చెక్కిన ప్రతిమ’) స్పష్టంగా ఉంది. కాబట్టి దానిని కేవలం ‘స్తంభం’గా పరిమితం చేయకుండా ప్రతిమ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- issue: యెహోవా తన నామాన్ని ఉంచడం
  choice: నా నామాన్ని శాశ్వతంగా ఉంచుతాను
  alternative: నేను శాశ్వతంగా నివసిస్తాను
  rationale: ‘నామాన్ని ఉంచడం’ అనే మూలపాఠ్యంలోని దైవశాస్త్రీయ భాషను దైవనివాసం అనే వివరణగా మార్చకుండా యథాతథ భావంతో నిలిపాం.
- issue: మందిరం మరియు యెరూషలేము మధ్య వాక్యసంబంధం
  choice: యెరూషలేములోని ఈ మందిరంలో
  alternative: ఈ మందిరంలోను యెరూషలేములోను
  rationale: హీబ్రూలో రెండు స్థానాలకు בְּ వాడబడినా, అవి దేవుని ఎంపిక చేసిన మందిరం-నగరం అనే అనుబంధ స్థానాలు. సహజ తెలుగులో వాటి ఏకీకృత సంబంధాన్ని చూపించాం; అక్షరానువాద ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘ప్రతిమ,’ ‘మందిరం,’ ‘నామం,’ ‘శాశ్వతంగా’ వంటి సాధారణంగా అర్థమయ్యే బైబిలు పదజాలం ఉపయోగించబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
