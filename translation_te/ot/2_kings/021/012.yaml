source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: te
  text: 'కాబట్టి ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా చెబుతున్నాడు: “ఇదిగో, నేను యెరూషలేము మీదికి, యూదా మీదికి విపత్తును[a] రప్పిస్తున్నాను. దాని గురించి వినే ప్రతి ఒక్కరి రెండు చెవులూ గింగురుమంటాయి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆపదను.” ఇక్కడి హిబ్రూ పదం నైతిక చెడును కాకుండా తీర్పుగా వచ్చే వినాశకరమైన ఆపదను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని రెండు చెవులూ గింగురుమంటాయి.” ఇది ఆ వార్త విన్నప్పుడు కలిగే తీవ్రమైన దిగ్భ్రాంతిని లేదా భయాన్ని తెలిపే హిబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి సందర్భంలో చెప్పిన పాపాలకు పర్యవసానంగా ఈ తీర్పు వస్తోందనే అన్వయార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణను ప్రతిబింబించేలా లిప్యంతరీకరించింది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנְנִי מֵבִיא
  choice: ఇదిగో, నేను ... రప్పిస్తున్నాను
  rationale: హిబ్రూ ప్రకటనలోని ఉద్ఘాటనను ‘ఇదిగో’ నిలుపుతుంది; వర్తమాన క్రియారూపం సమీపిస్తున్న దైవిక చర్యను సజీవంగా తెలియజేస్తుంది.
- source_word: רָעָה
  choice: విపత్తు
  rationale: ఈ తీర్పు సందర్భంలో ఇది నైతిక చెడును కాకుండా వినాశకరమైన ఆపదను సూచిస్తుంది.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: యెరూషలేము మీదికి, యూదా మీదికి
  rationale: తీర్పు ఈ రెండు ప్రాంతాలపైకి రావడాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל שֹׁמְעָיו
  choice: దాని గురించి విన్న ప్రతి ఒక్కరి
  rationale: సర్వనామ ప్రత్యయం రాబోయే విపత్తు గురించిన వార్తను సూచిస్తున్నదనే సహజ పఠనాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: రెండు చెవులూ గింగురుమంటాయి
  rationale: భయంకరమైన వార్త విని కలిగే దిగ్భ్రాంతిని సూచించే హిబ్రూ నుడికారాన్ని, దాని శరీరాత్మక చిత్రాన్ని నిలుపుతూ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పు సందర్భంలో רָעָה పదార్థం
  choice: విపత్తు
  alternative: చెడు
  rationale: ఇక్కడ యాహ్వే నైతిక చెడును చేయడం గురించి కాకుండా శిక్షారూపమైన వినాశాన్ని రప్పించడం గురించి వాక్యం చెబుతోంది; అందువల్ల సందర్భోచితమైన విపత్తు భావాన్ని ఎంచుకుంది.
- issue: אֲשֶׁר యొక్క సంబంధ/ఫలిత భావం
  choice: దాని గురించి విన్న ప్రతి ఒక్కరి...
  alternative: దాని ఫలితంగా ...
  rationale: హిబ్రూ నిర్మాణాన్ని కఠినంగా ఉద్దేశార్థంగా మార్చకుండా, రాబోయే విపత్తును వినేవారిపై కలిగే ప్రభావాన్ని సంబంధ వాక్యంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రవచన శైలిని ఉపయోగించింది. ‘యాహ్వే’ ద్వారా వ్యక్తిగత దైవనామాన్ని నిలిపింది; ‘ఇదిగో’ ప్రకటనలోని ఉద్ఘాటనను కాపాడుతుంది. ప్రధాన వాక్యంలో నుడికారపు శరీరాత్మక చిత్రాన్ని ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించింది.
