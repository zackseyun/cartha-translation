source:
  edition: WLC
  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: te
  text: అయితే దేశ ప్రజలు రాజైన అమోనుకు వ్యతిరేకంగా కుట్ర చేసిన వారందరినీ హతమార్చారు; దేశ ప్రజలు అమోను కుమారుడైన యోషీయాను అతని స్థానంలో రాజుగా చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: హతమార్చారు
  rationale: נכה ఇక్కడ కుట్రదారులపై జరిగిన ప్రాణాంతక ప్రతీకార చర్యను సూచిస్తుంది. ‘హతమార్చారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారు చంపబడ్డారనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: ఈ హెబ్రీ పదబంధం సాధారణ ప్రజానీకాన్ని లేదా సామాజిక-రాజకీయ వర్గాన్ని సూచించవచ్చు. ‘దేశ ప్రజలు’ దాని రూపాన్ని, ఉద్దేశపూర్వక పునరుక్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל הַקֹּשְׁרִים
  choice: కుట్ర చేసిన వారందరినీ
  rationale: קשר ధాతువు నుంచి వచ్చిన కృదంతం కుట్రలో పాల్గొన్న వ్యక్తులను సూచిస్తుంది. క్రియాత్మక రూపం కథన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: అమోను రాజుకు వ్యతిరేకంగా
  rationale: קשר తో కలిసిన עַל శత్రుత్వపూర్వకంగా ఒకరికి వ్యతిరేకంగా కుట్ర చేయడాన్ని సూచిస్తుంది.
- source_word: וַיַּמְלִיכוּ
  choice: రాజుగా చేశారు
  rationale: מלך ధాతువు హిఫిల్ రూపం ఒకరిని రాజుగా చేయడం లేదా పరిపాలింపజేయడం అనే భావాన్ని ఇస్తుంది. ‘రాజుగా చేశారు’ మూలార్థాన్ని కాపాడుతుంది; మూలంలో లేని పట్టాభిషేక ఆచారాన్ని చేర్చదు.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: అతని కుమారుడైన యోషీయాను
  rationale: సంబంధాన్ని స్పష్టంగా చూపుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వంలో అమోను స్థానాన్ని యోషీయా చేపట్టాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַ
  choice: అయితే
  rationale: మునుపటి వచనంలో అమోను సేవకులు అతన్ని చంపిన సంఘటనకు, ఇక్కడ దేశ ప్రజలు వారిపై చేసిన ప్రతీకార చర్యకు మధ్య ఉన్న వ్యత్యాసాన్ని సందర్భానుసారంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దేశ ప్రజలు’ అనే పదబంధాన్ని మూలంలోని పునరుక్తికి అనుగుణంగా రెండుసార్లు ఉంచాం. ఈ వచనంలో ప్రచురణకు అవసరమైన నిజమైన పాఠ్య లేదా భావసందిగ్ధత కనిపించనందున పాదటిప్పణి ఇవ్వలేదు.
