  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר בְּ/גַן בֵּית֖/וֹ בְּ/גַן עֻזָּ֑א וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: te
  text: మనష్షే తన పితరులతో నిద్రించాడు[a]. అతని ఇంటి తోటలో, ఉజ్జా తోటలో అతన్ని పాతిపెట్టారు. అతని స్థానంలో అతని కుమారుడు ఆమోను రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన పితరులతో పడుకున్నాడు”; ఇది మరణాన్ని సూచించే సంప్రదాయ హీబ్రూ రాజుల మరణవివరణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: שׁכב అనే క్రియకు ‘పడుకొను/నిద్రించు’ అనే ప్రాథమిక భావం ఉంది; రాజుల మరణవార్తల్లో ఇది మరణాన్ని సూచించే సంప్రదాయ ప్రయోగం. తెలుగులో ‘పితరులతో నిద్రించాడు’ ఆ రూపకాన్ని కాపాడుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: రాజుల గ్రంథంలోని స్థిరమైన మరణసూత్రాన్ని, దాని వంశపారంపర్య ఛాయను కాపాడే సహజమైన బైబిలీయ తెలుగు ప్రయోగం.
- source_word: וַיִּקָּבֵר
  choice: అతన్ని పాతిపెట్టారు
  rationale: హీబ్రూ నిఫాల్ క్రియలోని కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగు అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: בְּגַן בֵּיתוֹ
  choice: అతని ఇంటి తోటలో
  rationale: ‘అతని ఇల్లు’ అనే మూలపాఠాన్ని నిలుపుతుంది; రాజభవనం అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: בְּגַן עֻזָּא
  choice: అంటే ఉజ్జా తోటలో
  rationale: ముందటి స్థలవివరణకు సమానార్థక వివరణగా ఉన్న పునరుక్త ఉపసర్గ పదబంధాన్ని స్పష్టంగా తెలుపుతుంది; עֻזָּא పేరును ఉజ్జా అని లిప్యంతరీకరించింది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ సూత్రంలో క్రియ పాలన కొనసాగింపుకన్నా సింహాసనారోహణను సూచిస్తుంది; ‘రాజయ్యాడు’ దానిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: మునుపటి రాజు స్థానాన్ని వారసుడు స్వీకరించాడనే భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాజమరణ సూత్రంలోని రూపకం
  choice: ‘తన పితరులతో నిద్రించాడు’ అని రూపకాన్ని నిలుపడం
  alternative: ‘చనిపోయాడు’ అని స్పష్టీకరించడం
  rationale: మూలంలోని సంప్రదాయ రాజమరణ ప్రయోగం మరణాన్ని సందర్భం ద్వారా సూచిస్తుంది; దానిని కేవలం ‘చనిపోయాడు’గా మార్చితే సాహిత్య రూపం, పితరులతో అనుబంధం రెండూ తగ్గిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పితరులు’ అనే బైబిలీయ పదాన్ని రాజమరణ సూత్రం కోసం నిలిపి, మిగతా వాక్యాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం.
