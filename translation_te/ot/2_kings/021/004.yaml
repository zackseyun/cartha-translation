  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: te
  text: యాహ్వే మందిరంలో[a] అతడు బలిపీఠాలు కట్టాడు. దాని గురించి యాహ్వే, “యెరూషలేములో నా నామాన్ని ఉంచుతాను”[b] అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే ఇంటిలో.’ ‘మందిరం’ అనే అర్థం కూడా సాధ్యం.
    reason: lexical_alternative
  - marker: b
    text: ‘నా నామాన్ని ఉంచుతాను’ అనేది యాహ్వే తాను ఎంచుకున్న స్థలాన్ని తన నామంతోను సన్నిధితోను అనుసంధానించడాన్ని తెలిపే ఆలయ-నిబంధన భాష.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: అతడు కట్టించాడు
  rationale: Qal రూపం సందర్భంలో మనష్షే బలిపీఠాల నిర్మాణానికి కారకుడయ్యాడనే సహజ తెలుగు భావాన్ని ఇస్తుంది; ప్రారంభ ו కథన క్రమాన్ని సూచించినా తెలుగులో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు.
- source_word: מִזְבְּחֹת
  choice: బలిపీఠాలు
  rationale: מִזְבֵּחַ యొక్క బహువచనం; బలులు అర్పించే పీఠాలకు ప్రామాణికమైన తెలుగు పదం.
- source_word: בְּ/בֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: బֵית అక్షరార్థంగా ‘ఇల్లు’; ఈ సందర్భంలో యెరూషలేము దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: ఆ మందిరాన్ని గురించి యెహోవా ... అని చెప్పాడు
  rationale: אֲשֶׁר యొక్క సంబంధాన్ని మందిరంతో స్పష్టంగా కలుపుతుంది; హెబ్రీ వాక్యంలోని ముందుగా పలికిన దైవవాక్యాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בִּ/ירוּשָׁלַם
  choice: యెరూషలేములో
  rationale: בְ ఇక్కడ స్థలాన్ని సూచిస్తుంది; వాక్యారంభ స్థానాన్ని నిలుపుతూ హెబ్రీ ఉద్ఘాటనను ప్రతిబింబిస్తుంది.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: నా నామాన్ని ఉంచుతాను
  rationale: ఆలయ నిబంధనకు సంబంధించిన మూలభాషా నుడికారాన్ని వివరణాత్మకంగా విస్తరించకుండా నిలుపుతుంది; ‘అక్కడ’ అనే పదం ఈ వచనంలో ప్రత్యక్షంగా లేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతుంది. తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించడం ద్వారా దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: ‘నా నామాన్ని ఉంచుతాను’ అనే ఆలయ-నామ భాష
  choice: నుడికారాన్ని యథాతథంగా నిలుపడం
  alternative: నా సన్నిధిని స్థాపిస్తాను; నా నామం అక్కడ నివసించేలా చేస్తాను
  rationale: ఈ మాట దేవుడు ఎంచుకున్న స్థలంతో తన నామం, సన్నిధిని అనుసంధానించడాన్ని సూచించినా, మూలవాక్యంలోని సంక్షిప్తతను మరియు ధార్మిక భావగాఢతను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘బలిపీఠాలు,’ ‘నామం,’ ‘మందిరం’ వంటి బైబిలు సందర్భానికి తగిన పదాలు ఉపయోగించబడ్డాయి; మూలంలోని ఆలయ-నామ నుడికారం ఉద్దేశపూర్వకంగా నిలుపబడింది.
