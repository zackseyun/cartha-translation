reference: 2 Kings 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడైనది చేశాడు; యాహ్వే ఇశ్రాయేలు కుమారుల[b] ఎదుటనుండి వెళ్లగొట్టిన జనాల హేయమైన ఆచారాల[a] ప్రకారం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాల అసహ్యమైన ఆచారాలు.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; భావార్థంగా “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: అతడు ... చెడ్డది చేశాడు
  rationale: ‘చెడ్డది చేయడం’ అనే సహజమైన తెలుగు ప్రయోగం, ‘చెడును చేశాడు’ అనే కృత్రిమ పదానువాదం కంటే హెబ్రీ మూలంలోని స్థిరమైన నైతిక మూల్యాంకన సూత్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: దేవుని మూల్యాంకనాన్ని సూచించే హెబ్రీ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూనే ‘దృష్టి’ అనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כְּתוֹעֲבֹת
  choice: హేయాచారాలను అనుసరించాడు
  rationale: תּוֹעֵבָה ఇక్కడ కేవలం భావోద్వేగపూర్వక ‘అసహ్యం’ కాక, నైతికంగా మరియు ఆరాధనాపరంగా హేయమైన ఆచారాలను సూచిస్తుంది. כְ యొక్క అనురూపత భావాన్ని సహజమైన తెలుగులో ‘అనుసరించాడు’ తెలియజేస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాల
  rationale: ఈ చారిత్రక సందర్భంలో ఇశ్రాయేలీయేతర ప్రజలను సూచిస్తుంది; ‘అన్యజనులు’ కంటే ‘జనాలు’ తటస్థంగా, సందర్భోచితంగా ఉంటుంది.
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టిన
  rationale: హిఫీల్ రూపం వారిని స్వాధీనస్థానం నుండి తొలగించడం లేదా వెళ్లగొట్టడం అనే కారణార్థక భావాన్ని ఇక్కడ ఇస్తుంది.
- source_word: מִפְּנֵי
  choice: ఎదుటనుండి
  rationale: ‘వారి ఎదుట నుండి/సన్నిధి నుండి’ అనే హెబ్రీ స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని పుత్రసంబంధ పదబంధాన్ని యథాతథంగా నిలుపుతుంది; సహజమైన సామూహిక ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులు’ అని పాదటిప్పణిలో సూచించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: כְּתוֹעֲבֹת యొక్క నైతిక, ఆరాధనాపరమైన బలం
  choice: హేయాచారాలు
  alternative: అసహ్యమైన ఆచారాలు
  rationale: ఈ పదం ప్రజల పట్ల ద్వేషాన్ని కాక, వారి ఆచారాలపై ఒడంబడిక సంబంధ నైతిక తీర్పును సూచిస్తుంది. ‘హేయాచారాలు’ ఆ బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక, పుత్రసంబంధ రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని స్పష్టమైన పుత్రసంబంధ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, తెలుగు పాఠకులకు మరింత సహజమైన సామూహిక రూపాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హెబ్రీ వాక్యక్రమాన్ని పూర్తిగా పదానువదించకుండా, దాని నైతిక తీర్పు, జనాల హేయాచారాలకు అనురూపంగా ప్రవర్తించిన భావం, దైవనామం, ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపం అన్నింటినీ నిలిపాం.
