- from: “యూదా రాజైన మనష్షే ఈ హేయకార్యాలు చేశాడు. అతనికి ముందు ఉన్న అమోరీయులందరూ చేసినదానికంటే ఎక్కువ చెడు చేశాడు. తన విగ్రహాల[a] ద్వారా యూదా కూడా పాపం చేసేలా చేశాడు. అందుచేత—”
  to: “యూదా రాజైన మనష్షే ఈ హేయకార్యాలు చేసి, అతనికి ముందు ఉన్న అమోరీయులందరూ చేసినదానికంటే మరింత చెడు చేసి, తన విగ్రహాల[a]తో యూదాను కూడా పాపం చేయించినందున—”
  rationale: The revision restores the Hebrew cause-clause structure that leads into the next verse, retains all three accusations and the comparative, and gives a more natural Telugu rendering of the instrumental relation. The lexical footnote preserves the term’s pejorative force without requiring a disputed etymology in the main text.
