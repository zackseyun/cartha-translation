source:
  edition: WLC
  text: יַעַן֩ אֲשֶׁ֨ר עָשָׂ֜ה מְנַשֶּׁ֤ה מֶֽלֶךְ יְהוּדָה֙ הַ/תֹּעֵב֣וֹת הָ/אֵ֔לֶּה הֵרַ֕ע מִ/כֹּ֛ל אֲשֶׁר עָשׂ֥וּ הָ/אֱמֹרִ֖י אֲשֶׁ֣ר לְ/פָנָ֑י/ו וַ/יַּחֲטִ֥א גַֽם אֶת יְהוּדָ֖ה בְּ/גִלּוּלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: te
  text: “యూదా రాజైన మనష్షే ఈ హేయకార్యాలు చేసి, అతనికి ముందు ఉన్న అమోరీయులందరూ చేసినదానికంటే మరింత చెడు చేసి, తన విగ్రహాల[a]తో యూదాను కూడా పాపం చేయించినందున—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విగ్రహాలు’ అని అనువదించిన హీబ్రూ పదం విగ్రహాలను ధిక్కారంగా సూచిస్తుంది. దీనిని ‘మలిన విగ్రహాలు’ అని, మరింత చిత్రమైన అనువాదంలో ‘పేడ-విగ్రహాలు’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: అందుచేత—
  rationale: ఇది తదుపరి వచనంలో ప్రకటించబోయే తీర్పుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో వాక్యాన్ని సహజంగా ఉంచేందుకు కారణవివరణ తర్వాత ‘అందుచేత—’ అని పెట్టి, వాక్యం 12వ వచనంలో కొనసాగుతుందనే నిర్మాణాన్ని నిలిపాం.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన మనష్షే
  rationale: వ్యక్తి పేరు, రాజబిరుదు రెండింటినీ సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: ఈ హేయకార్యాలు
  rationale: తీవ్రమైన నైతిక, ఆరాధనాపరమైన అసహ్యతను సూచించే תּוֹעֵבָה భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: అందరూ చేసినదానికంటే ఎక్కువ చెడు చేశాడు
  rationale: హిఫిల్ క్రియలోని చెడుగా ప్రవర్తించడం/చెడు చేయడం అనే భావాన్నీ, מִן సూచించే పోలికనూ నేరుగా నిలిపింది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులందరూ
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నప్పటికీ జాతిని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజం.
- source_word: אֲשֶׁר לְפָנָיו
  choice: అతనికి ముందు ఉన్న
  rationale: మనష్షేకు ముందున్న ప్రజలను సూచించే మూలంలోని సంక్షిప్త కాలసంబంధ భావాన్ని అదనపు భౌగోళిక వివరణ లేకుండా నిలిపింది.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: యూదా కూడా పాపం చేసేలా చేశాడు
  rationale: חטא హిఫిల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా నిలుపుతూ, ‘పాపం చేయించాడు’ కంటే సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం. ‘యూదా’ అనే సమష్టి సూచనను మూలానికి దగ్గరగా ఉంచాం.
- source_word: בְּגִלּוּלָיו
  choice: తన విగ్రహాల ద్వారా
  rationale: בְּ ఉపసర్గలోని సాధనార్థాన్ని ‘ద్వారా’తో తెలిపాం. ప్రధాన పాఠ్యంలో స్పష్టమైన ‘విగ్రహాలు’ వాడి, మూలపదంలోని ధిక్కారభావాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: גִּלּוּלִים పదంలోని ధిక్కారభావం
  choice: విగ్రహాలు
  alternative: మలిన విగ్రహాలు / పేడవంటి విగ్రహాలు
  rationale: హీబ్రూ పదం విగ్రహాలను అవమానకరంగా పేర్కొంటుంది. ప్రధాన పాఠ్యంలో అతివివరణ చేయకుండా స్పష్టమైన పదాన్ని వాడి, దాని తీవ్రమైన ధిక్కార ఛాయను పాదసూచికలో భద్రపరిచాం.
- issue: יַעַן אֲשֶׁר కారణవాక్యం 12వ వచనంలో కొనసాగడం
  choice: వచనాంతంలో ‘అందుచేత—’
  alternative: వచనారంభంలో ‘ఎందుకంటే’ అని పెట్టి అసంపూర్ణ వాక్యంగా ముగించడం
  rationale: మూలంలోని కారణ-ఫలిత సంబంధాన్ని, తదుపరి వచనంతో ఉన్న వ్యాకరణ అనుసంధానాన్ని రెండింటినీ నిలుపుతూ తెలుగులో చదవడానికి సహజంగా రూపొందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవచనాత్మక అభియోగ స్వరం. పొడవైన హీబ్రూ కారణవాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం; చివరి ‘అందుచేత—’ 12వ వచనంతో కొనసాగింపును స్పష్టం చేస్తుంది.
