revisions:
- from: సమరయకు ఉపయోగించిన కొలనూలును, అహాబు వంశానికి ఉపయోగించిన ఒడంబాన్ని[a] యెరూషలేము మీద చాపుతాను. ఒకడు పళ్లెాన్ని తుడిచినట్లు[b] యెరూషలేమును తుడిచివేస్తాను; దాన్ని తుడిచి బోర్లిస్తాను.
  to: సమరయ కొలతదారాన్ని, అహాబు వంశపు నిటారుకొలత దారాన్ని యెరూషలేము మీద చాపుతాను. ఒకడు పళ్లెాన్ని తుడిచి, దాన్ని బోర్లించినట్లు యెరూషలేమును తుడిచివేస్తాను.
  rationale: The revision removes interpretive additions, replaces unclear or archaic instrument terms with natural modern Telugu, and retains the source’s concrete measuring and dish-wiping imagery. Footnote a is adjusted to avoid specifying lead and to explain the judgment image without treating that contextual implication as part of the translated text.
