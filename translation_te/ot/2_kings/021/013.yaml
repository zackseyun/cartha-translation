id: 2KI.21.13
reference: 2 Kings 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: te
  text: సమరయ కొలతదారాన్ని, అహాబు వంశపు నిటారుకొలత దారాన్ని యెరూషలేము మీద చాపుతాను. ఒకడు పళ్లెాన్ని తుడిచి, దాన్ని బోర్లించినట్లు యెరూషలేమును తుడిచివేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: మీద చాపుతాను
  rationale: נָטָה అనే క్రియలోని ‘చాపడం/విస్తరించడం’ అనే స్పష్టమైన భావాన్ని, కొలనూలు అనే కొలత సాధనంతో సహజంగా కలిపి నిలుపుతుంది.
- source_word: קָו
  choice: కొలనూలు
  rationale: నిర్మాణం లేదా పరిశీలనలో ఉపయోగించే measuring line భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁקֹלֶת
  choice: ఒడంబం
  rationale: బరువు కట్టిన నిలువు కొలత సాధనమైన plumb line‌ను సూచించే ప్రామాణిక తెలుగు పదం; కొలనూలుతో ఉన్న జత రూపకాన్ని కాపాడుతుంది.
- source_word: בֵּית אַחְאָב
  choice: అహాబు వంశం
  rationale: ఇక్కడ בֵּית అనేది భవనం కాక రాజవంశాన్ని సూచిస్తుంది; ‘వంశం’ సాధారణ పాఠకునికి వెంటనే అర్థమవుతుంది.
- source_word: וּמָחִיתִי
  choice: తుడిచివేస్తాను
  rationale: తరువాతి పళ్లెం ఉపమానంలోని ‘తుడవడం’ అనే పదచిత్రాన్ని నిలుపుతూ, తీర్పులో పూర్తిగా తొలగించే భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: ఒకడు పళ్లెాన్ని తుడిచినట్లు
  rationale: అనిర్దిష్ట మూడవ పురుష ప్రయోగాన్ని ‘ఒకడు’గా సహజంగా అందిస్తుంది; צַלַּחַתకు ‘పళ్లెం’ సుపరిచితమైన సరిపోలిక.
- source_word: מָחָה
  choice: దాన్ని తుడిచి
  rationale: మూలంలోని ‘తుడవడం’ క్రియ పునరుక్తిని కాపాడి చర్య సంపూర్ణతను బలపరుస్తుంది.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: బోర్లిస్తాను
  rationale: అక్షరార్థంగా ‘దాని ముఖం మీదికి తిప్పడం’; పళ్లెం విషయంలో ‘బోర్లించడం’ సహజమైన తెలుగు సమానార్థకం.
- source_word: שֹׁמְרוֹן
  choice: సమరయ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
theological_decisions:
- issue: సమరయ, అహాబు వంశం నుంచి తీసుకున్న కొలత రూపకం సూచించే తీర్పు స్వభావం
  choice: సమరయకు, అహాబు వంశానికి వర్తించిన అదే తీర్పు ప్రమాణం యెరూషలేముకూ వర్తించబడుతుంది.
  alternative: కొలత సాధనాలు ఇతర సందర్భాల్లో పునర్నిర్మాణం లేదా పునరుద్ధరణను సూచించవచ్చు.
  rationale: ఇక్కడి తక్షణ సందర్భం దోషనిర్ణయానికి సంబంధించినది; పళ్లెాన్ని తుడిచి బోర్లించే తదుపరి ఉపమానం వినాశకర తీర్పు భావాన్ని స్పష్టం చేస్తుంది. అయినా ఆ వివరణను ప్రధాన వాక్యంలో అదనంగా చేర్చకుండా రూపకాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని కొలత-తీర్పు రూపకాన్నీ, ‘తుడవడం’ అనే పునరుక్తినీ నిలిపాం. ‘తుడిచివేస్తాను’ తీర్పు తీవ్రతను వ్యక్తం చేస్తుండగా, వెంటనే వచ్చే ‘తుడిచి’ మూలంలోని దృశ్య పదచిత్రాన్ని కొనసాగిస్తుంది.
