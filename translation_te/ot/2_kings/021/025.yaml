id: 2KI.21.25
reference: 2 Kings 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: ఆమోను చేసిన మిగిలిన కార్యాలు[a] యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[b] రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కార్యాలు” అనే చోట “చేసిన పనులు” అని కూడా అనువదించవచ్చు. హెబ్రీ పదానికి అక్షరార్థంగా “మాటలు” లేదా “విషయాలు” అని అర్థం; అయితే రాజుల పాలనను సంక్షిప్తంగా తెలిపే ఈ సూత్రంలో అది రాజు చేసిన కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “గ్రంథం” అంటే పురాతన లిఖిత ఆధారం—బహుశా ఒక చుట్టపత్రం. ఈ పదబంధాన్ని “యూదా రాజుల వార్షిక వృత్తాంతాలు” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אָמוֹן
  choice: ఆమోను చేసిన మిగిలిన కార్యాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; דִּבְרֵי అక్షరార్థంగా ‘మాటలు/విషయాలు’ అయినా, ఈ రాజ్యపాలన సారాంశ సూత్రంలో రాజు చేసిన కార్యాలను సూచిస్తుంది. తరువాతి אֲשֶׁר עָשָׂה భావాన్ని తెలుగులో సహజంగా ఇదే పదబంధంలో కలిపాం.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: ఆమోను కార్యాల స్వరూపాన్ని తెలిపే సంబంధవాక్యాన్ని సహజ తెలుగు విశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హెబ్రీయ ప్రతికూల అలంకార ప్రశ్నను తెలుగులో ‘కదా?’తో సహజంగా, ప్రశ్నారూపాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినా, ఒక లిఖిత ఆధారంలోని విషయాన్ని సూచించేటప్పుడు తెలుగులో ‘గ్రంథంలో’ సహజం.
- source_word: דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాలు
  rationale: రాజుల పాలనకు సంబంధించిన కాలక్రమ లిఖితవృత్తాంతాలను సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల
  rationale: ఈ ఆధారగ్రంథపు శీర్షికలో לְ సంబంధం లేదా అనుబంధాన్ని సూచిస్తుంది; తెలుగులో షష్ఠీవిభక్తి సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హెబ్రీ అలంకార ప్రశ్నను ‘కదా?’తో నిలిపి, మూలంలోని చారిత్రక ఆధారగ్రంథ సూచనను స్పష్టంగా ఉంచాం.
