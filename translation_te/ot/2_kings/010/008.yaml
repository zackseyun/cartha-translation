translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని ఉపయోగించాం. మానవ వార్తాహరుడు అనే భావం స్పష్టంగా ఉండేందుకు ‘సందేశవాహకుడు’ ఎంచుకున్నాం; మూలపాఠంలోని హింసాత్మక స్పష్టతను మృదువుపరచలేదు.
