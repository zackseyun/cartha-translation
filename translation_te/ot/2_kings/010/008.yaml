  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/מַּלְאָךְ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר הֵבִ֖יאוּ רָאשֵׁ֣י בְנֵֽי הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר שִׂ֣ימוּ אֹתָ֞/ם שְׁנֵ֧י צִבֻּרִ֛ים פֶּ֥תַח הַ/שַּׁ֖עַר עַד הַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: te
  text: 'సందేశవాహకుడు వచ్చి అతనికి ఇలా నివేదించాడు: “రాజు కుమారుల తలలను తీసుకొచ్చారు.” అప్పుడు అతడు, “వాటిని రెండు కుప్పలుగా[a] ద్వారపు ప్రవేశం వద్ద ఉదయం వరకు ఉంచండి” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రెండు రాశులుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: సందేశవాహకుడు
  rationale: ఈ కథన సందర్భంలో ఇది వార్తను తీసుకొచ్చిన మానవ దూతను సూచిస్తుంది; ‘దూత’ అనే పదం దేవదూత అనే అపార్థానికి దారితీయవచ్చు.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: అతనికి ఇలా నివేదించాడు
  rationale: తెలియజేయడం మరియు తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, హెబ్రీ కథన క్రమాన్ని నిలుపుతుంది.
- source_word: הֵבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: ఎవరు తీసుకొచ్చారో వాక్యంలో పేర్కొనని హెబ్రీ బహువచన క్రియను అలాగే అనిర్దిష్టంగా ఉంచి, పూర్తయిన చర్యను సహజంగా తెలుపుతుంది.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: రాజు కుమారుల తలలను
  rationale: బహువచన నిర్మాణాన్ని స్పష్టంగా అనువదిస్తూ, సందర్భంలో చెప్పబడిన నరికిన తలలనే సూచిస్తుంది.
- source_word: שִׂימוּ אֹתָם
  choice: వాటిని … ఉంచండి
  rationale: జడవస్తువులైన తలలను సూచించడానికి ‘వాటిని’ సహజం; ఆజ్ఞార్థక క్రియను గౌరవ/బహువచన రూపంలో అందిస్తుంది.
- source_word: שְׁנֵי צִבֻּרִים
  choice: రెండు కుప్పలుగా
  rationale: צִבֻּרִים అనే పదం వస్తువులను పోగుచేసిన కుప్పలు లేదా రాశులను సూచిస్తుంది; ‘కుప్పలు’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: פֶּתַח הַשַּׁעַר
  choice: ద్వారపు ప్రవేశం వద్ద
  rationale: ద్వారం తెరుచుకునే ప్రవేశ ప్రాంతాన్ని సూచించే మూలపాఠంలోని స్థలవివరాన్ని నిలుపుతుంది; ‘పట్టణ’ అనే పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: עַד הַבֹּקֶר
  choice: ఉదయం వరకు
  rationale: తరువాతి ఉదయం వరకూ కొనసాగే కాలవ్యవధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
