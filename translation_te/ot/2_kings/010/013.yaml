  terminology: ‘యూదా రాజైన అహజ్యా,’ ‘సోదరులు,’ ‘రాజు కుమారులు,’ ‘రాజమాత’ పదాలు సందర్భానికి, రాజవంశ రిజిస్టర్‌కు తగినవి. గెబీరా యొక్క రాజాస్థానార్థాన్ని ‘రాజమాత’గా సరియైన విధంగా ఇచ్చి, దానికి వివరణాత్మక పాదసూచికను జతచేశారు. ‘సోదరులు’కు సాధ్యమైన విస్తృత బంధుత్వార్థాన్ని కూడా పాదసూచిక సముచితంగా కాపాడుతుంది.
