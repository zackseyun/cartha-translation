translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేలా ‘అని అడిగాడు’, ‘అని జవాబిచ్చారు’ వాడబడ్డాయి; మూలంలోని రాజవంశ పదజాలం మరియు సంభావ్య అర్థసందిగ్ధత పాదసూచికలతో నిలుపబడ్డాయి.
