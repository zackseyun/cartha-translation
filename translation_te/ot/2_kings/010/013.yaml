id: 2KI.10.13
reference: 2 Kings 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: te
  text: యెహూ యూదా రాజైన అహజ్యా సోదరులను[a] ఎదుర్కొని, “మీరు ఎవరు?” అని అడిగాడు. వారు, “మేము అహజ్యా సోదరులం. రాజు కుమారులూ రాజమాత[c] కుమారులూ క్షేమంగా ఉన్నారో తెలుసుకోవడానికి[b] దిగివచ్చాం” అని జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులు’ అని ఉన్న హీబ్రూ పదం రాజవంశ కథనాల్లో సొంత సోదరులనే కాక సమీప బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘రాజు కుమారులూ రాజమాత కుమారులూ క్షేమంగా ఉన్నారో చూడడానికి.’
    reason: lexical_alternative
  - marker: c
    text: ‘రాజమాత’ అనేది హీబ్రూ గెబీరా అనే పదానికి అనువాదం; అది రాజు తల్లికి గల రాజాస్థాన బిరుదు.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: ఎదుర్కొని
  rationale: ఈ సందర్భంలో యెహూ వారిని దారిలో కనుగొనడం లేదా తారసపడడం సూచిస్తుంది. ‘ఎదుర్కొని’ సహజమైన ఆధునిక తెలుగులో ఆ ఎదురుపడటాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: అహజ్యా సోదరులు
  rationale: హీబ్రూ పదాన్ని నేరుగా నిలుపుతుంది. రాజవంశ కథనంలో ఇది సొంత సోదరులతో పాటు సమీప బంధువులను కూడా సూచించగలదనే విస్తృతార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: రాజబిరుదును సరళంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: מִי אַתֶּם
  choice: మీరు ఎవరు?
  rationale: హీబ్రూ ప్రశ్నకు సంక్షిప్తమైన, సహజమైన ప్రత్యక్ష అనువాదం.
- source_word: וַנֵּרֶד
  choice: దిగివచ్చాం
  rationale: భౌగోళికంగా కిందికి ప్రయాణించిన భావాన్ని, మాట్లాడుతున్న వారి దృష్టికోణాన్ని నిలుపుతుంది.
- source_word: לִשְׁלוֹם
  choice: క్షేమంగా ఉన్నారో తెలుసుకోవడానికి
  rationale: ఇక్కడి ప్రయోగం కేవలం పలకరించడాన్ని కాక వారి క్షేమం గురించి తెలుసుకోవడాన్ని సూచిస్తుంది. ప్రత్యామ్నాయ భావవ్యక్తీకరణను పాదసూచికలో ఇచ్చాం.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులు
  rationale: హీబ్రూలోని నిర్దిష్టమైన ‘కుమారులు’ అనే అర్థాన్ని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: הַגְּבִירָה
  choice: రాజమాత
  rationale: యూదా రాజాస్థాన సందర్భంలో ఇది రాజు తల్లికి గల అధికారిక బిరుదు. ‘రాజమాత’ ఆ సంస్థాగత పాత్రను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: రాజమాత కుమారులు
  rationale: ‘రాజు కుమారులు’ అనే సమాంతర పదబంధంతో పాటు హీబ్రూ వేరు చేసి చెప్పిన రెండో వర్గాన్ని కూడా అలాగే నిలుపుతుంది.
