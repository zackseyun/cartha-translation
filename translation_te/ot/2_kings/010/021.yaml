source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יֵהוּא֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֨אוּ֙ כָּל עֹבְדֵ֣י הַ/בַּ֔עַל וְ/לֹֽא נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא בָ֑א וַ/יָּבֹ֨אוּ֙ בֵּ֣ית הַ/בַּ֔עַל וַ/יִּמָּלֵ֥א בֵית הַ/בַּ֖עַל פֶּ֥ה לָ/פֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: te
  text: యెహూ ఇశ్రాయేలు అంతటా కబురు పంపించాడు. బయలును ఆరాధించేవారందరూ వచ్చారు; రాని ఒక్కడు కూడా మిగలలేదు. వారు బయలు ఆలయంలోకి ప్రవేశించారు. బయలు ఆలయం ఒక చివర నుండి మరొక చివర వరకు[a] నిండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నోటి నుండి నోటి వరకు.” ఇది ఆలయం పూర్తిగా, ఒక చివర నుండి మరొక చివర వరకు నిండిందని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... בְּכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అంతటా కబురు పంపించాడు
  rationale: שׁלח అనే క్రియకు ‘పంపు’ అనేది ప్రాథమిక అర్థం. בְּכָל יִשְׂרָאֵל దాని విస్తృతిని సూచిస్తున్నందున, ఇక్కడ ప్రజలకు పిలుపు లేదా సమాచారం పంపించాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: כָּל עֹבְדֵי הַבַּעַל
  choice: బయలును ఆరాధించేవారందరూ
  rationale: עבד అనే పదానికి ‘సేవించు’ అనే అర్థం ఉన్నా, ఇక్కడ ఆరాధనా సందర్భం కావడంతో ‘ఆరాధించేవారు’ మతపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: రాని ఒక్కడు కూడా మిగలలేదు
  rationale: హీబ్రూ వాక్యంలోని సంపూర్ణ హాజరు భావాన్నీ, אִישׁ అనే పురుష ఏకవచన రూపాన్నీ సహజమైన తెలుగు ద్వినిషేధ నిర్మాణంతో నిలిపింది.
- source_word: בֵּית הַבַּעַל
  choice: బయలు ఆలయం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ, ఇక్కడ బయలు ఆరాధనకు సంబంధించిన దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘ఆలయం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיִּמָּלֵא
  choice: నిండిపోయింది
  rationale: מלא నిఫల్ రూపం ఆలయం పూర్తిగా నిండిన స్థితిని సూచిస్తుంది; ‘నిండిపోయింది’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: פֶּה לָפֶה
  choice: ఒక చివర నుండి మరొక చివర వరకు
  rationale: అక్షరార్థం ‘నోటి నుండి నోటి వరకు.’ సందర్భంలో స్థలమంతా పూర్తిగా నిండిందనే నుడికార భావాన్ని ఈ ఎంపిక స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చింది.
theological_decisions:
- issue: אִישׁ లోని పురుష ఏకవచన ప్రతినిధి భాష
  choice: రాని ఒక్కడు కూడా మిగలలేదు
  alternative: రాని వారెవరూ మిగలలేదు
  rationale: ‘ఒక్కడు’ మూలంలోని పురుష ఏకవచన రూపాన్ని నిలుపుతూ, ఈ సందర్భంలో సహజమైన తెలుగు సంపూర్ణతా వ్యక్తీకరణగా పనిచేస్తుంది. దీనివల్ల అదనపు సిద్ధాంతార్థం ఏదీ చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘బయలు ఆలయం’ అనే రూపం అక్షరార్థమైన ‘బయలు ఇల్లు’ కంటే సందర్భాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘ఒక చివర నుండి మరొక చివర వరకు’ అనే పదబంధం వద్ద ఉంచబడింది.
