id: 2KI.10.10
reference: 2 Kings 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: te
  text: 'కాబట్టి మీరు తెలుసుకోండి: అహాబు ఇంటికి వ్యతిరేకంగా యాహ్వే పలికిన మాటల్లో ఒక్క మాట కూడా నేలమీద పడిపోదు[a]. యాహ్వే తన సేవకుడైన ఏలీయా ద్వారా పలికినదాన్ని నెరవేర్చాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నేలమీద పడిపోదు” అనేది “విఫలం కాదు” లేదా “నెరవేరకుండా పోదు” అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన సేవకుడైన ఏలీయా చేతి ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: కాబట్టి మీరు తెలుసుకోండి
  rationale: బహువచన ఆజ్ఞార్థకమైన דְּעוּను స్పష్టంగా ఉంచి, אֵפוֹא యొక్క నిర్ధారణాత్మక/అనుమానాంతర సంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: ఒక్కటి కూడా నేలమీద పడిపోదు
  rationale: ‘నెరవేరకుండా పోదు’ అనే అర్థమున్న హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించింది.
- source_word: מִדְּבַר יְהוָה
  choice: యెహోవా పలికిన ఆయన మాటల్లో ఒక్కటి కూడా
  rationale: భాగార్థక מִןను ‘మాటల్లో ఒక్కటి కూడా’ అని తెలుగులో సహజంగా వ్యక్తం చేసి, ప్రవచనంలోని ఏ అంశమూ విఫలం కాదనే భావాన్ని కాపాడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చింది.
- source_word: עַל בֵּית אַחְאָב
  choice: అహాబు ఇంటికి విరోధంగా
  rationale: తీర్పు సందర్భంలో עַלకు ఉన్న ప్రతికూల భావాన్ని ‘విరోధంగా’ అని తెలిపి, בֵּית అనే వంశ/రాజకుటుంబ రూపకాన్ని ‘ఇంటి’గా నిలిపింది.
- source_word: וַיהוָה עָשָׂה אֵת אֲשֶׁר דִּבֶּר
  choice: యెహోవా ... పలికినదాన్ని నెరవేర్చాడు
  rationale: עָשָׂה యొక్క ప్రత్యక్ష అర్థం ‘చేశాడు’ అయినా, ప్రవచన వాక్యాన్ని చేయడం అనే సందర్భార్థాన్ని తెలుగులో సహజంగా ‘నెరవేర్చాడు’ అని తెలిపింది.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: తన సేవకుడైన ఏలీయా ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ ప్రయోగం ఇక్కడ మధ్యవర్తిత్వం/సాధనాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ సహజంగా అదే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన రూపంగా ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: ప్రవచన నెరవేర్పు రూపకం
  choice: నేలమీద పడిపోదు
  alternative: విఫలం కాదు / నెరవేరకుండా పోదు
  rationale: దేవుని తీర్పు వాక్యం తప్పక నెరవేరుతుందనే భావంతో పాటు మూలంలోని సజీవమైన రూపకాన్ని కూడా ప్రధాన పాఠ్యంలో కాపాడాం.
- issue: עַל యొక్క సంబంధ భావం
  choice: అహాబు ఇంటికి విరోధంగా
  alternative: అహాబు ఇంటి గురించి
  rationale: సందర్భం అహాబు వంశంపై ప్రకటించిన తీర్పు కాబట్టి ప్రతికూల భావం సముచితం; అయినా ‘గురించి’ అనే సాధారణ సంబంధార్థం వ్యాకరణపరంగా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ ప్రకటనకు తగిన శైలి. ‘అహాబు ఇల్లు’ అనే బైబిలీయ రూపకాన్ని నిలిపి, సాధారణ పాఠకుడికి వాక్య నిర్మాణం స్పష్టంగా ఉండేలా స్వల్పంగా సహజీకరించబడింది.
