revisions:
- from: 'యెహోవా యెహూతో ఇలా అన్నాడు: “నా దృష్టికి సరైనదాన్ని చేయడంలో నీవు మంచిగా ప్రవర్తించావు; నా హృదయంలో ఉన్నదంతా అహాబు వంశానికి చేశావు. కాబట్టి నీ కుమారులు నాలుగో తరం వరకు[a] ఇశ్రాయేలు సింహాసనం మీద కూర్చుంటారు.”'
  to: 'యెహోవా యెహూతో ఇలా అన్నాడు: “నీవు నా దృష్టిలో సరైనది చేయడంలో మంచిగా ప్రవర్తించావు, నా హృదయంలో ఉన్నదంతా అహాబు వంశానికి చేశావు కాబట్టి, నీ కుమారులు నాలుగో తరం వరకు[a] ఇశ్రాయేలు సింహాసనం మీద కూర్చుంటారు.”'
  rationale: The revision restores the Hebrew causal relation by placing “కాబట్టి” after the two grounds for the promise and before its result. It also smooths the Hebrew evaluative formula and removes an inaccurate literal gloss from the footnote, while preserving the source’s limited commendation, its “heart” metaphor, and the four-generation dynastic promise.
  reviewer_model: gpt-5.6-terra
