source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: te
  text: 'యెహోవా యెహూతో ఇలా అన్నాడు: “నీవు నా దృష్టిలో సరైనది చేయడంలో మంచిగా ప్రవర్తించావు, నా హృదయంలో ఉన్నదంతా అహాబు వంశానికి చేశావు కాబట్టి, నీ కుమారులు నాలుగో తరం వరకు[a] ఇశ్రాయేలు సింహాసనం మీద కూర్చుంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని పదబంధం నాలుగు తరాల వరకు సాగే రాజవంశీయ వారసత్వాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచి, సాధారణ బిరుదైన ‘ప్రభువు’తో భేదాన్ని కాపాడుతుంది.
- source_word: יַעַן אֲשֶׁר
  choice: కాబట్టి
  rationale: ముందున్న కారణాన్ని అనుసరించే దైవ వాగ్దాన ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది; కారణార్థం మొత్తం వాక్య నిర్మాణంలో నిలిచివుంటుంది.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת
  choice: చేయడంలో నీవు మంచిగా ప్రవర్తించావు
  rationale: హిఫీల్ క్రియలోని ప్రశంసార్థాన్ని నిలుపుతూ, తరువాతి క్రియార్థక నిర్మాణంతో సహజంగా కలుపుతుంది.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: నా దృష్టికి సరైనదాన్ని
  rationale: దైవ మూల్యాంకనాన్ని తెలిపే హీబ్రూ నుడికారాన్ని అర్థవంతమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: నా హృదయంలో ఉన్నదంతా
  rationale: ‘హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; ఇక్కడ అది సంకల్పం లేదా ఉద్దేశాన్ని సూచించగలిగినా దాన్ని వ్యాఖ్యానాత్మకంగా కుదించదు.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: అహాబు వంశానికి చేశావు
  rationale: ‘ఇల్లు’ అనే రాజవంశ నుడికారాన్ని సహజ తెలుగులో ‘వంశం’గా అందిస్తూ, యెహూ చేసిన తీర్పును అదనపు పదాలతో విస్తరించదు.
- source_word: בְּנֵי רְבִעִים
  choice: నీ కుమారులు నాలుగో తరం వరకు
  rationale: ‘నాలుగవ వారికైన కుమారులు’ అనే హీబ్రూ వంశపారంపర్య నుడికారానికి సహజమైన తెలుగు రూపం; ‘కుమారులు’ అనే మూలపదాన్ని కూడా నిలుపుతుంది.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద కూర్చుంటారు
  rationale: రాజ్యాధికారాన్ని సూచించే ‘సింహాసనం మీద కూర్చోవడం’ అనే రూపకాన్ని నిలుపుతుంది; לְךָ యొక్క వంశపరమైన ప్రయోజనం ‘నీ కుమారులు’లో సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: యెహూ కార్యాలపై దైవ ప్రశంస పరిధి
  choice: అహాబు వంశానికి చేసిన కార్యానికే సంబంధించిన నిర్దిష్ట దైవ ప్రశంసగా అనువదించడం
  alternative: యెహూ పాలన లేదా ప్రవర్తన మొత్తానికి సంపూర్ణ దైవ ఆమోదంగా విస్తరించడం
  rationale: హీబ్రూ వాక్యం ప్రశంసను అహాబు వంశంపై దేవుని హృదయంలో ఉన్న సంకల్పాన్ని నెరవేర్చిన విషయానికి కట్టిపెడుతుంది. అందువల్ల యెహూ జీవితమంతటికీ ఆమోదాన్ని విస్తరించకుండా పాఠంలోని theological tensionను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. దైవ నామాన్ని ‘యెహోవా’గా, రాజవంశ నుడికారాన్ని ‘అహాబు వంశం’గా అందించాం. మూలంలోని ‘నా హృదయం’ రూపకాన్ని ఉద్దేశం అని పూర్తిగా వివరిస్తూ పరిష్కరించకుండా అలాగే నిలిపాం.
