id: 2KI.10.29
reference: 2 Kings 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: te
  text: అయితే, నెబాతు కుమారుడైన యరొబాము ఇశ్రాయేలును పాపం చేయించిన పాపాలను యెహూ విడిచిపెట్టలేదు[a]—అవి బేతేలులో, దానులో ఉన్న బంగారు దూడలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారానికి అక్షరార్థం: “వాటి వెనుకనుంచి తొలగిపోలేదు”; అంటే వాటిని అనుసరించడం మానుకోలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి సందర్భంలో యెహూ చేసిన సానుకూల కార్యాలకు పరిమితిని లేదా మినహాయింపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఆ వ్యతిరేక-పరిమితి భావాన్ని అందిస్తుంది.
- source_word: חֲטָאֵי
  choice: పాపాలను
  rationale: యరొబాము నెలకొల్పిన నిర్దిష్ట ఆరాధనా విధానానికి సంబంధించిన అపరాధాలను నేరుగా, పారదర్శకంగా సూచిస్తుంది.
- source_word: הֶחֱטִיא
  choice: పాపం చేయించిన
  rationale: חטא అనే క్రియ యొక్క హిఫీల్ రూపంలో ఉన్న కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: విడిచిపెట్టలేదు[a]
  rationale: అక్షరార్థంగా ‘వాటి వెనుకనుంచి తొలగిపోలేదు’ అనే హీబ్రూ నుడికారానికి, వాటిని అనుసరించడం లేదా ఆ ఆచారాన్ని మానకపోవడం అనే సహజ తెలుగు భావాన్ని ఇస్తుంది.
- source_word: עֶגְלֵי הַזָּהָב
  choice: బంగారు దూడలు
  rationale: యరొబాము పాపాలు ఏమిటో స్పష్టీకరించే నిర్దిష్ట ఆరాధనా ప్రతిమలను యథార్థంగా సూచిస్తుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన స్థలనామ లిప్యంతరీకరణ.
- source_word: דָּן
  choice: దాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన స్థలనామ లిప్యంతరీకరణ.
theological_decisions:
- issue: ‘యరొబాము పాపాలు’ అనే మాటకు ‘బంగారు దూడలు’తో ఉన్న సంబంధం
  choice: ‘అవి ... బంగారు దూడలు’ అని వివరణాత్మక సమానాధికార నిర్మాణంగా అనువదించబడింది.
  alternative: వాక్య నిర్మాణంలో విరామం తర్వాత వచ్చిన పునర్వివరణగా కూడా గ్రహించవచ్చు.
  rationale: హీబ్రూ వాక్యం ‘పాపాలు’ అనే భావన నుంచి వాటి స్పష్టమైన ఆరాధనా రూపాలైన బంగారు దూడలకు మారుతుంది; దీర్ఘ విరామచిహ్నం ఈ వివరణాత్మక సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. హీబ్రూ కారణార్థక క్రియను, పాపాలు–బంగారు దూడలు అనే వివరణాత్మక సంబంధాన్ని నిలుపుకుంది.
