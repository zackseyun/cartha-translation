- from: అయితే, నెబాతు కుమారుడైన యరొబాము ఇశ్రాయేలీయులతో పాపం చేయించిన పాపాలను యెహూ విడిచిపెట్టలేదు[a]—అవి బేతేలులో, దానులో ఉన్న బంగారు దూడలు.
