- from: యొర్దాను నుండి తూర్పువైపున ఉన్న గిలాదు దేశమంతటినీ—గాదీయులు, రూబేనీయులు, మనష్షీయులు నివసించే ప్రాంతాన్ని—అర్నోను లోయ[a] పక్కనున్న అరోయేరు మొదలుకొని గిలాదును బాషానును ఆయన స్వాధీనం చేసుకున్నాడు.
  to: హజాయేలు ఇశ్రాయేలీయులను యొర్దాను తూర్పున ఉన్న గిలాదు దేశమంతటిలో, అంటే గాదీయుల, రూబేనీయుల, మనష్షీయుల ప్రాంతంలో—అర్నోను లోయ[a] పక్కనున్న అరోయేరు మొదలుకొని గిలాదు, బాషాను వరకు—ఓడించాడు.
