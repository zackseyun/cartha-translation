base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: te
  text: హజాయేలు ఇశ్రాయేలీయులను యొర్దాను తూర్పున ఉన్న గిలాదు దేశమంతటిలో, అంటే గాదీయుల, రూబేనీయుల, మనష్షీయుల ప్రాంతంలో—అర్నోను లోయ[a] పక్కనున్న అరోయేరు మొదలుకొని గిలాదు, బాషాను వరకు—ఓడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అర్నోను వాగు పక్కనున్న”; హెబ్రూ పదం లోయను, వాగును లేదా వాగుపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: యొర్దాను నుండి తూర్పువైపున ఉన్న
  rationale: మూలంలోని ‘యొర్దాను నుండి సూర్యోదయ దిక్కున’ అనే భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: గిలాదు దేశమంతటినీ
  rationale: אֵת మునుపటి వచనంలోని క్రియకు కర్మను సూచిస్తుంది; כָּל אֶרֶץ భావాన్ని ‘దేశమంతటినీ’ స్పష్టంగా అందిస్తుంది.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: గాదీయులు, రూబేనీయులు, మనష్షీయులు నివసించే ప్రాంతాన్ని
  rationale: ఈ ఏకవచన జాతివాచక రూపాలు సమూహాలనూ వారు నివసించిన ప్రాంతాన్నీ సూచిస్తున్నందున, తెలుగు పాఠకునికి సంబంధం స్పష్టమయ్యేలా సామూహిక రూపంతో అనువదించబడింది.
- source_word: מֵעֲרֹעֵר
  choice: అరోయేరు మొదలుకొని
  rationale: מִן దక్షిణ సరిహద్దు ప్రారంభ బిందువును సూచిస్తుంది; స్థలనామం లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: అర్నోను లోయ పక్కనున్న
  rationale: עַל ఇక్కడ స్థలసంబంధంగా ‘పక్కనున్న’ అని తీసుకోబడింది; נַחַל ఒక లోయ, వాగు లేదా వాగుపాత్రను సూచించగలదు.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: గిలాదును బాషానును
  rationale: పునరుక్త సంధాయకం భూభాగ పరిధిని జోడిస్తూ పేర్కొంటుంది; అదనపు ఉద్ఘాటనను చేర్చకుండా సాధారణ తెలుగు సముచ్చయంతో నిలుపబడింది.
