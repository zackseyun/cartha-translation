translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన భౌగోళిక వర్ణన వాడబడింది. ఈ వచనం మునుపటి వచనంలోని క్రియను కొనసాగించినప్పటికీ, స్వతంత్రంగా చదవడానికి ‘ఆయన స్వాధీనం చేసుకున్నాడు’ అని పూరించబడింది.
