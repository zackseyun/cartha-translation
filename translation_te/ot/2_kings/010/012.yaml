  to: అప్పుడు అతడు లేచి బయలుదేరి సమరయకు వెళ్లాడు. దారిలో అతడు గొర్రెల కాపరుల బేత్-ఏకెదు[a] వద్ద ఉన్నాడు.
  rationale: The revision replaces the added sense of proximity (‘near’) with an exact locative expression (‘at’), and makes Jehu’s onward movement to Samaria explicit. It preserves the debated place name as a transliteration and retains the explanatory footnote without asserting a disputed etymology in the main text.
