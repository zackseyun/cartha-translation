  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֔א וַ/יֵּ֖לֶךְ שֹׁמְר֑וֹן ה֛וּא בֵּֽית עֵ֥קֶד הָרֹעִ֖ים בַּ/דָּֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: te
  text: అప్పుడు అతడు లేచి బయలుదేరి సమరయకు వెళ్లాడు. దారిలో అతడు గొర్రెల కాపరుల బేత్-ఏకెదు[a] వద్ద ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బేత్-ఏకెదు” అనే పేరుకు “సమకూర్చే ఇల్లు” వంటి అర్థం ఉండవచ్చు. మరికొందరు దీన్ని కాపరులు గొర్రెలను కత్తిరించే లేదా కట్టే స్థలంతో సంబంధమున్న పేరుగా అర్థం చేసుకుంటారు. హీబ్రూ పాఠంలో దీనిని స్థలనామంగా తీసుకోవడం సముచితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן
  choice: అప్పుడు అతడు లేచి సమరయకు బయలుదేరాడు
  rationale: వరుసగా వచ్చిన మూడు కథన క్రియలు లేచి ప్రయాణం ప్రారంభించి సమరయ వైపు వెళ్లడాన్ని సూచిస్తాయి. తెలుగులో అనవసర పునరుక్తిని తప్పిస్తూ కథన గమనాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: הוּא ... בַּדָּרֶךְ
  choice: దారిలో అతడు ... దగ్గర ఉన్నాడు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన ఈ భాగం ప్రయాణమధ్యంలోని అతని స్థానాన్ని తెలియజేస్తుంది; తెలుగు వాక్యక్రమంలో ‘దారిలో’ ముందుంచడం సహజంగా ఉంటుంది.
- source_word: בֵּית עֵקֶד
  choice: బేత్‌-ఏకెదు
  rationale: ఇది స్థలనామంగా పనిచేస్తున్నందున అర్థాన్ని ఊహించి అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: הָרֹעִים
  choice: గొర్రెల కాపరుల
  rationale: רֹעִים సాధారణంగా కాపరులను సూచిస్తుంది. సందర్భంలో ప్రాచుర్యమైన భావాన్ని స్పష్టంగా తెలియజేయడానికి ‘గొర్రెల కాపరులు’ అని ఇచ్చింది.
- source_word: בַּדָּרֶךְ
  choice: దారిలో
  rationale: ఈ పదబంధం ప్రయాణ మార్గంలో ఉన్న స్థానాన్ని సూచిస్తుంది; ‘దారిలో’ ఆధునిక తెలుగులో సహజమైన సంక్షిప్త రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ క్రియల పునరుక్తిని తెలుగులో సంక్షిప్తం చేసినప్పటికీ ప్రయాణ క్రమం నిలుపబడింది; అనిశ్చిత స్థలనామం ప్రధాన పాఠ్యంలో లిప్యంతరీకరించబడింది.
