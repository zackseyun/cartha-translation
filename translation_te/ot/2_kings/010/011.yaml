source:
  edition: WLC
  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: te
  text: కాబట్టి యెహూ యెజ్రెయేలులో అహాబు వంశానికి చెందిన వారిలో మిగిలిన వారందరినీ, అతని ప్రముఖులందరినీ[a], అతని సన్నిహితులందరినీ[b], అతని యాజకులందరినీ, అతనికి ఒక్కడు కూడా బ్రతికి మిగలకుండా హతమార్చాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని ఉన్నతాధికారులు’ లేదా ‘అతని ప్రభువులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని పరిచయస్థులు’ లేదా ‘అతని ఆప్తులు.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అతనికి మిగిలినవాడు లేకుండా చేసే వరకు.’ ఇక్కడ ‘అతనికి’ అనేది అహాబును లేదా అహాబు వంశాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: ఈ కథన సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడాన్ని లేదా చంపడాన్ని సూచిస్తుంది. ‘హతమార్చాడు’ ఆధునిక, గౌరవప్రదమైన తెలుగులో ఆ ప్రాణాంతక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: అహాబు వంశానికి చెందిన వారిలో మిగిలిన వారందరినీ
  rationale: ‘బేత్ అహాబు’ రాజవంశాన్ని లేదా రాజకుటుంబాన్ని సూచిస్తుంది; ‘వంశం’ తెలుగులో సహజంగా ఉంది. ‘మిగిలిన వారు’ అనే రూపం שׁאר లోని శేషార్థాన్ని నిలుపుతుంది.
- source_word: בְּיִזְרְעֶאל
  choice: యెజ్రెయేలులో
  rationale: ఇది నగరాన్ని సూచించే స్థానవాచక ప్రయోగం; తెలుగులో ‘లో’ సహజమైనది.
- source_word: גְּדֹלָיו
  choice: అతని ప్రముఖులు
  rationale: ఇక్కడ גדולים అహాబుతో అనుబంధమున్న సామాజిక లేదా రాజకీయంగా ఉన్నతస్థాయి వ్యక్తులను సూచిస్తుంది. ‘ప్రముఖులు’ విస్తృతార్థాన్ని నిలుపుతుంది; ‘ప్రభువులు’ అనే ప్రత్యామ్నాయం కూడా సాధ్యం.
- source_word: מְיֻדָּעָיו
  choice: అతని సన్నిహితులు
  rationale: ידע మూలం నుంచి వచ్చిన ఈ రూపం అతనికి తెలిసినవారు, ముఖ్యంగా సన్నిహిత సంబంధం లేదా అనుబంధం గలవారిని సూచించవచ్చు. సందర్భంలో ‘సన్నిహితులు’ సహజంగా ఉంది, అయితే ‘పరిచయస్థులు’ కూడా సాధ్యమే.
- source_word: כֹהֲנָיו
  choice: అతని యాజకులు
  rationale: హీబ్రూ పదానికి నేరమైన అర్థం ‘అతని యాజకులు.’ వారు అహాబు రాజసభ లేదా మతవ్యవస్థతో అనుబంధమున్నవారై ఉండవచ్చు; మూలపాఠం చెప్పినదానికంటే పరిధిని కుదించలేదు.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: అతనికి ఒక్క ప్రాణాన్నైనా మిగల్చకుండా చేశాడు
  rationale: ఈ ప్రయోగం సంపూర్ణ నిర్మూలనను తెలియజేస్తుంది. שָׂרִיד అంటే మిగిలినవాడు లేదా ప్రాణాలతో బయటపడినవాడు. לוֹ లోని ఏకవచన సర్వనామాన్ని ‘అతనికి’గా నిలిపి, దాని సూచనలోని సంక్షిప్తతను పాదసూచికలో వివరించాం.
theological_decisions:
- issue: ముగింపు వాక్యంలోని לוֹ (‘అతనికి’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘అతనికి’ అని ఉంచి, అది అహాబును సూచించేలా మూలంలోని ఏకవచన రూపాన్ని నిలిపాం.
  alternative: ‘అహాబు వంశానికి’ లేదా ‘ఆ వంశంలో’ అని అర్థాన్ని విప్పి అనువదించడం.
  rationale: హీబ్రూలో సర్వనామ సూచన సంక్షిప్తంగా ఉంది; అది అహాబును లేదా సమష్టిగా అహాబు వంశాన్ని సూచించవచ్చు. ఒక అర్థానికే పరిమితం చేయకుండా అసలు పాఠంలోని స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. రాజవంశ భావానికి ‘వంశం,’ హింస యొక్క ప్రాణాంతక స్వభావానికి ‘హతమార్చాడు’ ఎంచుకున్నాం. మూలంలోని సర్వనామ సందిగ్ధతను ప్రధాన పాఠంలో అతిగా విప్పకుండా పాదసూచికలో వివరించాం.
