id: 2KI.10.31
reference: 2 Kings 10:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: te
  text: అయితే యెహూ ఇశ్రాయేలు దేవుడైన యెహోవా[a] ధర్మశాస్త్రం ప్రకారం తన పూర్ణహృదయంతో నడుచుకోవడంలో జాగ్రత్తగా ఉండలేదు. ఇశ్రాయేలును పాపం చేయించిన యరొబాము పాపాలనుండి[b] అతడు తొలగిపోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యెహోవా ధర్మశాస్త్రం ప్రకారం నడుచుకోవడంలో జాగ్రత్తగా ఉండలేదు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ శ్రద్ధతో ఆచరించడాన్ని నొక్కి చెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇవి యరొబాము నెలకొల్పిన విగ్రహారాధనా వ్యవస్థతో ముడిపడిన ఆరాధనా పాపాలు; ఈ పదబంధం రాజుల గ్రంథంలో పదేపదే కనిపించే సూత్రవాక్యం.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: నడుచుకోవడానికి శ్రద్ధ చూపలేదు
  rationale: ‘కాపాడడం’ అనే ప్రాథమిక భావంతో పాటు, క్రియారూపంతో వచ్చిన ఈ నిర్మాణం జాగ్రత్తగా ఆచరించడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని ‘శ్రద్ధ చూపలేదు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָלֶכֶת
  choice: నడుచుకోవడానికి
  rationale: జీవన ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: תּוֹרַת
  choice: ధర్మశాస్త్రం ప్రకారం
  rationale: ఇక్కడ తోరా దేవుని నిబంధనాత్మక ఆజ్ఞాబోధను సూచిస్తుంది. ‘ప్రకారం’ అనేది בְ ఉపసర్గతో వ్యక్తమైన జీవన ప్రమాణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּכָל לְבָבוֹ
  choice: పూర్ణహృదయంతో
  rationale: సంపూర్ణ అంతరంగ నిబద్ధతను సూచించే హీబ్రూ నుడికారాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: לֹא סָר מֵעַל
  choice: విడిచిపెట్టలేదు
  rationale: పాపాలనుంచి తొలగిపోవడం లేదా వెనుదిరగడం అనే భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַטֹּאות
  choice: పాపాలను
  rationale: హీబ్రూ బహువచనాన్ని నేరుగా నిలుపుతుంది; సందర్భంలోని మతపరమైన అపరాధాలను అనవసరంగా విపులీకరించదు.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: హిఫిల్ కారణార్థక రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది. సంబంధవాక్యంలోని కర్త యరొబామే అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: וְיֵהוּא
  choice: అయితే యెహూ
  rationale: బయలు ఆరాధనపై యెహూ చేసిన చర్యలకు, యెహోవా ధర్మశాస్త్రం పట్ల అతని అసంపూర్ణ విధేయతకు మధ్య ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
theological_decisions:
- issue: యెహూ నిబంధన విశ్వాస్యతపై మూల్యాంకనం
  choice: మునుపటి సంస్కరణలు చేసినప్పటికీ యెహూ యెహోవాకు పూర్ణహృదయంతో విధేయుడిగా ఉండడంలో విఫలమయ్యాడని వచనం తెలియజేస్తుంది.
  alternative: ఇది యెహూ వ్యక్తిగత భక్తిని కాకుండా అసంపూర్ణమైన రాజకీయ సంస్కరణను మాత్రమే విమర్శిస్తుందని చదవడం.
  rationale: ‘పూర్ణహృదయంతో’ మరియు ‘యరొబాము పాపాలను విడిచిపెట్టలేదు’ అనే పదబంధాలు నిబంధనాత్మక, నైతిక-మతపరమైన మూల్యాంకనాన్ని సూచిస్తాయి. అనువాదం ఈ ఉద్రిక్తతను నిలుపుతుంది; మూలపాఠం చెప్పినదానికంటే ఎక్కువగా తీర్మానించదు.
- issue: యరొబాము పాపాల స్వరూపం
  choice: ప్రధాన వచనంలో సాధారణమైన ‘పాపాలు’ అనే పదాన్నే నిలిపి, రాజుల గ్రంథంలోని ఆరాధనా వ్యవస్థకు సంబంధించిన నేపథ్యాన్ని పాదటిప్పణిలో తెలియజేయడం.
  alternative: ప్రధాన వచనంలోనే ‘విగ్రహారాధనా పాపాలు’ అని నిర్దిష్టీకరించడం.
  rationale: חַטֹּאות స్వయంగా ‘పాపాలు’ అని మాత్రమే చెబుతుంది. సందర్భం వాటి ఆరాధనా స్వరూపాన్ని తెలియజేసినా, దాన్ని ప్రధాన వచనంలో చేర్చడం మూలపాఠం కంటే అధిక స్పష్టీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నడుచుకోవడం’ అనే బైబిలీయ జీవనరూపకాన్ని నిలిపి, ‘శ్రద్ధ చూపలేదు’ ద్వారా שָׁמַר + క్రియారూపం యొక్క జాగ్రత్తగా ఆచరించే భావాన్ని సహజంగా వ్యక్తం చేశాం. దైవనామాన్ని ‘యెహోవా’గా ఇచ్చాం; రెండు పాదటిప్పణి సూచికలూ ప్రధాన వచనంలో ఉంచాం.
