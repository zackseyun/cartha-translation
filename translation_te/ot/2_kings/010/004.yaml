  to: కాని వారు ఎంతో ఎంతో భయపడి, “ఇదిగో, ఆ ఇద్దరు రాజులు అతని ఎదుట నిలువలేకపోయారు; ఇక మనం ఎలా నిలువగలం?” అని అన్నారు.
