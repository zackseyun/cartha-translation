  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: te
  text: కాని వారు ఎంతో ఎంతో భయపడి, “ఇదిగో, ఆ ఇద్దరు రాజులు అతని ఎదుట నిలువలేకపోయారు; ఇక మనం ఎలా నిలువగలం?” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: వారు భయపడి
  rationale: ירא అనే క్రియ ఇక్కడ కథన క్రమంలో వారి తీవ్రమైన భయప్రతిస్పందనను తెలియజేస్తుంది. తెలుగులో తరువాతి మాటల క్రియతో సహజంగా కలిసేలా ‘భయపడి’ అని అనువదించాం.
- source_word: מְאֹד מְאֹד
  choice: చాలా, చాలా
  rationale: హీబ్రూలోని ద్విరుక్తి భయ తీవ్రతను నొక్కి చెబుతుంది; దాన్ని కుదించకుండా తెలుగులోనూ పునరుక్తితో నిలిపాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై దృష్టి నిలిపే హీబ్రూ సూచక పదానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: ఆ ఇద్దరు రాజులు
  rationale: ఇది ముందే ప్రస్తావించబడిన ఇద్దరు రాజులను సూచిస్తుంది; తెలుగు నిర్దిష్టత కోసం ‘ఆ’ వాడాం.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: అతని ఎదుట నిలువలేకపోయారు
  rationale: సందర్భంలో עמד לפני అంటే అతన్ని ఎదిరించి నిలబడలేకపోవడం. ‘నిలువలేకపోయారు’ సామర్థ్యలేమిని సహజంగా వ్యక్తం చేస్తూ మూలంలోని ‘నిలువు’ రూపకాన్ని కాపాడుతుంది.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: ఇక మనం ఎలా నిలువగలం?
  rationale: ముందటి వాక్యం నుంచి వచ్చే నిర్ధారణను ‘ఇక’ సహజంగా చూపిస్తుంది. అదే עמד క్రియకు ‘నిలువు’నే మళ్లీ వాడి హీబ్రూ సమాంతరతను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథన శైలి. హీబ్రూ పునరుక్తినీ, రెండు ఉపవాక్యాల్లోని ‘నిలువు’ అనే ఒకే క్రియాత్మక రూపకాన్నీ ప్రధాన పాఠ్యంలోనే కాపాడినందున పాదటిప్పణి అవసరం లేదు.
