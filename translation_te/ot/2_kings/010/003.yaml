  source_fidelity: ‘తగినవాడూ’ chiefly conveys suitability, whereas הַיָּשָׁר denotes one who is upright/right. The main text should retain that ethical descriptor. The proposed revision also expresses the contextual selecting force of וּרְאִיתֶם without treating it as its literal primary sense.
