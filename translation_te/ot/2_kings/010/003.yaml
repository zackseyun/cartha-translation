id: 2KI.10.3
reference: 2 Kings 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: te
  text: అప్పుడు మీ యజమాని కుమారులలో మంచివాడైన, యథార్థవంతుడైనవానిని ఎంచుకొని[a], అతనిని అతని తండ్రి సింహాసనంపై కూర్చోబెట్టి, మీ యజమాని వంశం కోసం పోరాడండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ యజమాని కుమారులలో మంచివాడైన, యథార్థవంతుడైనవానిని చూడండి.” హీబ్రూ క్రియకు అక్షరార్థం “చూడండి”; ఇక్కడ పరిశీలించి ఎంపిక చేయడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “వంశం” అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థం “ఇల్లు.” ఇక్కడ అది రాజకుటుంబాన్ని లేదా రాజవంశాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: చూసి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చూడడం’ అనే భావం ఉంది; ఈ సందర్భంలో పరిశీలించి ఎంపిక చేయడాన్ని సూచిస్తుంది. ‘ఎవరో చూసి’ ఆ రెండు భావాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: మంచివాడూ తగినవాడూ
  rationale: טוֹב అభ్యర్థి మంచితనాన్ని, יָשָׁר అతని సూటితనం లేదా యోగ్యతను సూచించవచ్చు. రాజుగా ఎంపిక చేసే సందర్భంలో ‘తగినవాడు’ సహజంగా ఉన్నప్పటికీ, నైతిక భావాన్ని పూర్తిగా తొలగించదు.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: మీ యజమాని కుమారుల్లో
  rationale: מן ఎంపిక సమూహాన్ని సూచిస్తుంది. אֲדֹנֵיכֶם ఇక్కడ దేవుణ్ణి కాక మానవ రాజాధికారిని సూచిస్తున్నందున ‘యజమాని’ వాడబడింది.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: అతణ్ణి అతని తండ్రి సింహాసనం మీద కూర్చోబెట్టి
  rationale: ఇది తండ్రి తరువాత కుమారుణ్ణి రాజుగా ప్రతిష్ఠించడాన్ని సూచించే సహజ తెలుగు రాజపదప్రయోగం.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: మీ యజమాని వంశం కోసం పోరాడండి
  rationale: בֵּית ఇక్కడ భవనాన్ని కాక రాజకుటుంబం లేదా రాజవంశాన్ని సూచిస్తుంది. ‘వంశం’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדֹנֵיכֶם పదానికి అనువాదం
  choice: మీ యజమాని
  alternative: మీ ప్రభువు
  rationale: ఈ కథన సందర్భంలో పదం యెహోవాను కాక మానవ రాజాధికారిని సూచిస్తుంది; ‘ప్రభువు’ దైవ బిరుదుగా అపార్థం కావచ్చు.
- issue: בֵּית పదంలోని రాజవంశ భావం
  choice: వంశం
  alternative: ఇల్లు / రాజకుటుంబం
  rationale: ఇక్కడ పోరాటం ఒక భవనం కోసం కాదు, యజమాని రాజకుటుంబ పాలనను కాపాడటానికి. ‘వంశం’ ఆ రాజకీయ-కుటుంబ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథన శైలి. మూలంలోని ఆజ్ఞాత్మక సవాలును నిలిపి, ‘చూసి’ అనే పదంతో పరిశీలన-ఎంపిక మధ్య ఉన్న భావసందిగ్ధతను పాదటీకలో సంరక్షించాం.
