  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/בֹ֤א הַ/סֵּ֨פֶר֙ אֲלֵי/הֶ֔ם וַ/יִּקְחוּ֙ אֶת בְּנֵ֣י הַ/מֶּ֔לֶךְ וַֽ/יִּשְׁחֲט֖וּ שִׁבְעִ֣ים אִ֑ישׁ וַ/יָּשִׂ֤ימוּ אֶת רָֽאשֵׁי/הֶם֙ בַּ/דּוּדִ֔ים וַ/יִּשְׁלְח֥וּ אֵלָ֖י/ו יִזְרְעֶֽאלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: te
  text: ఆ ఉత్తరం వారికి చేరగానే, వారు రాజు కుమారులైన డెబ్బై మందిని పట్టుకొని వధించారు. వారి తలలను బుట్టల్లో[a] పెట్టి యెజ్రెయేలులో ఉన్న అతని దగ్గరకు పంపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కుండల్లో’ లేదా ‘జాడీల్లో’; హెబ్రీ పదం పాత్రలను సూచిస్తుంది; అది నేసిన బుట్టలకే పరిమితమని నిశ్చయంగా చెప్పలేం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: ఆ ఉత్తరం
  rationale: ఈ కథన సందర్భంలో ఇది యేహూ పంపిన లిఖిత సమాచారాన్ని సూచిస్తుంది; అందువల్ల ‘ఉత్తరం’ సహజమైన, నిర్దిష్టమైన అనువాదం.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులు
  rationale: రాజు యొక్క పురుష సంతానాన్ని, అలాగే రాజవంశ సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁחֲטוּ
  choice: వధించారు
  rationale: שׁחט సూచించే ఉద్దేశపూర్వకమైన, క్రూరమైన సంహార భావాన్ని ‘చంపారు’ కంటే స్పష్టంగా నిలుపుతుంది; ఆధునిక గౌరవప్రద తెలుగు శైలికీ సరిపోతుంది.
- source_word: שִׁבְעִים אִישׁ
  choice: ఆ డెబ్బై మందిని
  rationale: ముందే ప్రస్తావించబడిన రాజు కుమారుల సంఖ్యను స్పష్టంగా అనుసంధానిస్తూ, హెబ్రీలోని పురుషుల లెక్కను సహజ తెలుగులో అందిస్తుంది.
- source_word: רָאשֵׁיהֶם
  choice: వారి తలలను
  rationale: మూలంలోని ప్రత్యక్ష, భయానక అర్థాన్ని ఎలాంటి సభ్యోక్తి లేకుండా నిలుపుతుంది.
- source_word: בַּדּוּדִים
  choice: బుట్టల్లో
  rationale: తలలను రవాణా చేయడానికి ఉపయోగించిన పెద్ద పాత్రలను సందర్భానుకూలంగా సూచించే సాంప్రదాయిక అనువాదం; అయితే హెబ్రీ పదం నేసిన బుట్టలకే పరిమితం కాదు కాబట్టి ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: אֵלָיו
  choice: అతని దగ్గరికి
  rationale: హెబ్రీ సర్వనామాన్ని నిలుపుతూ, సందర్భంలో అది యేహూను సూచించనిస్తుంది.
- source_word: יִזְרְעֶאלָה
  choice: యెజ్రెయేలులోని
  rationale: దిశను సూచించే రూపం యెజ్రెయేలు వైపు పంపడాన్ని తెలియజేస్తుంది; తెలుగులో ‘యెజ్రెయేలులోని అతని దగ్గరికి’ అనడం గమ్యస్థానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
