translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని హింసాత్మక స్పష్టతను తగ్గించలేదు. హెబ్రీ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘రాజు కుమారులు’ మరియు ‘డెబ్బై మంది’ ఒకే సమూహమని తెలుగులో స్పష్టమయ్యేలా విరామచిహ్నాలతో అనుసంధానించాం.
