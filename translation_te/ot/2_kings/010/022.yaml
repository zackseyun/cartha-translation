  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: te
  text: 'అతడు వస్త్రశాల[a]కు బాధ్యుడైన వ్యక్తితో ఇలా అన్నాడు: “బయలు ఆరాధకులందరికోసం[b] వస్త్రాలు బయటికి తీసుకురా.” ఆ వ్యక్తి వారి కోసం ఆ వస్త్రాలను బయటికి తీసుకొచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వస్త్రాగారానికి బాధ్యుడైన వ్యక్తితో.” ఈ పదం వస్త్రాలను ఉంచే స్థలాన్ని లేదా వాటికి సంబంధించిన విభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “బయలు సేవకులందరికీ”; ఇక్కడ బయలును సేవిస్తూ ఆరాధించేవారు అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: వస్త్రశాల
  rationale: ఈ నామవాచకం వస్త్రాలను భద్రపరిచే స్థలాన్ని లేదా విభాగాన్ని సూచిస్తుంది. ‘వస్త్రశాల’ ఆధునిక తెలుగులో సహజంగా ఉండి, వెంటనే వస్త్రాలను బయటికి తీసుకురమ్మనే ఆజ్ఞకు సరిపోతుంది.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: వస్త్రశాలకు బాధ్యుడైన వానితో
  rationale: హీబ్రూ నిర్మాణం అక్షరార్థంగా ‘వస్త్రశాల మీద ఉన్నవాడు’ అని ఉండి, దానికి బాధ్యత వహించే అధికారిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా బాధ్యత భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: הוֹצֵא
  choice: బయటికి తీసుకురా
  rationale: יצא ధాతువు హిఫీల్ ఆజ్ఞారూపంలో ‘బయటికి వచ్చేలా చేయి’ అనే భావం ఇస్తుంది. నిల్వచేసిన వస్త్రాలను తెమ్మనే సందర్భంలో ‘బయటికి తీసుకురా’ సహజమైన తెలుగు.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: వస్త్రాలు / ఆ వస్త్రాలను
  rationale: ఈ ఏకవచన నామవాచకాలు సమష్టి అర్థంలో ధరించే వస్తువులను సూచిస్తున్నాయి. తెలుగులో సహజంగా ఉండేందుకు బహువచనమైన ‘వస్త్రాలు’ వాడి, రెండో ప్రస్తావనలో హీబ్రూ నిర్దిష్టతను ‘ఆ వస్త్రాలను’ ద్వారా నిలిపాం.
- source_word: עֹבְדֵי הַבָּעַל
  choice: బయలు ఆరాధకులు
  rationale: עבד సాధారణంగా ‘సేవచేయు’ అని అర్థమైనా, దేవతకు సంబంధించిన ఈ ఆరాధనా సందర్భంలో ఆ దేవతను సేవిస్తూ పూజించేవారిని సూచిస్తుంది. ‘ఆరాధకులు’ ఆధునిక పాఠకునికి మతపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: అతడు వారి కోసం ఆ వస్త్రాలను బయటికి తీసుకొచ్చాడు
  rationale: హీబ్రూ కథన క్రమాన్ని, ‘వారి కోసం’ అనే ప్రయోజన భావాన్ని, నిర్దిష్ట వస్త్రాల సూచనను సహజమైన తెలుగులో నిలిపాం.
theological_decisions:
- issue: עֹבְדֵי הַבָּעַל అనే పదబంధంలో సేవ మరియు ఆరాధన మధ్య భావసంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘బయలు ఆరాధకులు’
  alternative: ‘బయలు సేవకులు’
  rationale: ఇది బయలు దేవతకు సంబంధించిన ఆరాధనా సభ సందర్భం కాబట్టి ‘ఆరాధకులు’ ఉద్దేశిత మతపరమైన భావాన్ని స్పష్టం చేస్తుంది. అయితే ‘సేవకులు’ అనే అక్షరార్థాన్ని పాదసూచికలో ఇచ్చి మూలంలోని భావ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడాం. ‘వస్త్రాలు’ అనే పదం ‘దుస్తులు’ కంటే కొద్దిగా ఉన్నతమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది. కథనంలోని సంక్షిప్తతను, ఆజ్ఞారూపాన్ని నిలిపాం.
