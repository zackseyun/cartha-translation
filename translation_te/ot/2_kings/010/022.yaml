- from: వస్త్రశాలకు[a] బాధ్యుడైన వానితో అతడు, “బయలు ఆరాధకులందరికీ[b] వస్త్రాలు బయటికి తీసుకురా” అన్నాడు. అతడు వారి కోసం ఆ వస్త్రాలను బయటికి తీసుకొచ్చాడు.
  to: 'అతడు వస్త్రశాల[a]కు బాధ్యుడైన వ్యక్తితో ఇలా అన్నాడు: “బయలు ఆరాధకులందరికోసం[b] వస్త్రాలు బయటికి తీసుకురా.” ఆ వ్యక్తి వారి కోసం ఆ వస్త్రాలను బయటికి తీసుకొచ్చాడు.'
  rationale: సవరింపు అర్థాన్ని మార్చకుండా వాక్యనిర్మాణాన్ని ఆధునిక సహజ తెలుగుకు అనుగుణంగా చేసింది. మూలంలోని పరిపాలనా బాధ్యత భావం, సమష్టి ‘వస్త్రాలు,’ బయలు సంబంధిత ఆరాధనా సూచన, మరియు రెండవ క్రియకు వస్త్రశాల బాధ్యుడే కర్త అన్న విషయం నిలిపాయి. పాదసూచిక గుర్తులను సంబంధిత పదబంధాలకు సరిగ్గా ఉంచి, ప్రత్యామ్నాయాన్ని పూర్తి పదబంధంగా స్పష్టం చేశాం.
