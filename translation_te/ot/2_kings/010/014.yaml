  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: te
  text: అతడు, “వారిని సజీవంగా పట్టుకోండి” అన్నాడు. అప్పుడు వారు వారిని సజీవంగా పట్టుకొని, బేత్-ఏకెదు[a] గోతివద్ద[b] నలభై ఇద్దరు పురుషులను వధించారు. అతడు వారిలో ఒక్క పురుషుణ్ణి కూడా మిగల్చలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బేత్-ఏకెదు ఒక స్థలనామం. దాని వెనుక ‘కట్టే స్థలం’ లేదా ‘సమకూర్చే స్థలం’ వంటి భావం ఉండవచ్చు; అయితే ఇక్కడ అది పేరుగానే వాడబడింది.
    reason: cultural_note
  - marker: b
    text: లేదా “గోతిలోకి.” ఇక్కడి హీబ్రూ విభక్త్యర్థక పదం ఒకటి కంటే ఎక్కువ స్థలసంబంధ భావాలను అనుమతిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “అతడు వారిలో ఒక్క పురుషుణ్ణి కూడా మిగల్చలేదు”; ఎవరూ ప్రాణాలతో మిగలలేదని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: వారిని పట్టుకోండి
  rationale: תפשׂ అంటే పట్టుకోవడం లేదా బంధించడం. ఈ సందర్భంలో ఒక గుంపును అదుపులోకి తీసుకోవాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חַיִּים
  choice: సజీవంగా
  rationale: ఇక్కడ ఈ పదం క్రియావిశేషణ భావంలో ఉండి, వెంటనే చంపకుండా ప్రాణాలతో పట్టుకోవాలని సూచిస్తుంది.
- source_word: וַיִּשְׁחָטוּם
  choice: వధించారు
  rationale: שׁחט సాధారణంగా ‘చంపారు’ కంటే బలమైన, వధను సూచించే క్రియ. ‘వధించారు’ మూలంలోని తీవ్రతను గౌరవప్రదమైన వచనశైలిలో నిలుపుతుంది.
- source_word: אֶל־בּוֹר
  choice: గోతివద్ద
  rationale: אֶל సాధారణంగా ‘వైపు/కు’ అని ఉన్నా, ఈ సందర్భంలో వధ జరిగిన స్థలాన్ని సూచిస్తూ ‘గోతివద్ద’ సహజంగా ఉంటుంది. ‘గోతిలోకి’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: בֵּית עֵקֶד
  choice: బేత్-ఏకెదు
  rationale: ఇది ఇక్కడ స్థలనామంగా పనిచేస్తోంది; అందువల్ల సాధ్యమైన వ్యుత్పత్తి అర్థాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: నలభై ఇద్దరు పురుషులు
  rationale: אִישׁ తో కూడిన సంఖ్యాపదబంధం పురుషులను లెక్కిస్తుంది; ‘పురుషులు’ మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: అతడు వారిలో ఒక్కణ్ణి కూడా మిగల్చలేదు
  rationale: ఏకవచన క్రియకు యెహూ అంతర్భావిత కర్త. ఈ సహజమైన తెలుగు వాక్యం వారిలో ఎవరూ తప్పించుకోలేదనే సంపూర్ణతను నిలుపుతుంది.
