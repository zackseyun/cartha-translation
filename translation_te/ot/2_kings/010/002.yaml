revisions:
- from: “ఇప్పుడు ఈ ఉత్తరం[a] మీకు చేరినప్పుడు, మీ యజమాని కుమారులు[b] మీతో ఉన్నారు; రథాలు, గుర్రాలు, ప్రాకారమున్న నగరం[c], ఆయుధాలు కూడా మీ అధీనంలో ఉన్నాయి గనుక,”
  to: “ఇప్పుడు ఈ ఉత్తరం[a] మీకు చేరినప్పుడు, మీ యజమాని కుమారులు[b] మీతో ఉండగా, రథాలు, గుర్రాలు, ప్రాకారాలున్న నగరం[c], ఆయుధాలు మీ దగ్గర ఉండగా,”
