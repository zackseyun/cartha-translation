  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసంబంధమైన సందర్భానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ఈ వచనం తదుపరి వచనంలో పూర్తయ్యే షరతు వాక్యం కావడంతో చివర కామా ఉంచబడింది.
