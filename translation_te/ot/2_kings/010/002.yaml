source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: te
  text: “ఇప్పుడు ఈ ఉత్తరం[a] మీకు చేరినప్పుడు, మీ యజమాని కుమారులు[b] మీతో ఉండగా, రథాలు, గుర్రాలు, ప్రాకారాలున్న నగరం[c], ఆయుధాలు మీ దగ్గర ఉండగా,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పత్రం మీకు చేరినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మీ యజమాని కుమారులు”; అంటే, ఈ ఉత్తరం అందుకున్నవారు సేవించిన రాజు కుమారులు.
    reason: cultural_note
  - marker: c
    text: లేదా, “కోటనగరం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తదుపరి ఆదేశానికి ప్రవేశపెట్టే సంభాషణ సూచిక; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: ఈ ఉత్తరం మీకు చేరినప్పుడు
  rationale: రాజకీయ పత్రవ్యవహార సందర్భంలో סֵפֶר అంటే పుస్తకం కంటే ఉత్తరం; בוא యొక్క కాలార్థాన్ని ‘చేరినప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: మీ యజమాని కుమారులు
  rationale: אדון ఇక్కడ దైవ బిరుదు కాదు; గ్రహీతలు సేవించిన రాజును సూచిస్తుంది.
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: రథాలు, గుర్రాలు
  rationale: సైనిక వనరులను సూచించే సమూహార్థ నామాలను సూటిగా అనువదించింది.
- source_word: וְעִיר מִבְצָר
  choice: ప్రాకారమున్న నగరం
  rationale: రక్షణ ఏర్పాట్లు గల నగరం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וְהַנָּשֶׁק
  choice: ఆయుధాలు
  rationale: נשק ఇక్కడ యుద్ధ సామగ్రి లేదా ఆయుధాలను సమష్టిగా సూచిస్తుంది; ‘ఆయుధాలు’ స్పష్టమైన సాధారణ పదం.
- source_word: וְאִתְּכֶם
  choice: మీతో ఉన్నారు / మీ అధీనంలో ఉన్నాయి
  rationale: హీబ్రూలోని పునరావృత ‘మీతో’ భావాన్ని తెలుగు వాక్యనిర్మాణానికి తగినట్లుగా వ్యక్తుల విషయంలో ‘మీతో’, వనరుల విషయంలో ‘మీ అధీనంలో’ అని సహజీకరించింది.
