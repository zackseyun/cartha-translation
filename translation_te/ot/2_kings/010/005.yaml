revisions:
- from: 'అప్పుడు రాజభవనంపై అధికారిగా ఉన్నవాడు, నగరంపై అధికారిగా ఉన్నవాడు, పెద్దలు, సంరక్షకులు[a] యేహూకు ఇలా కబురు పంపారు: “మేము నీ సేవకులం. నువ్వు మాకు చెప్పేదంతా చేస్తాం. మేము ఎవరినీ రాజుగా చేయం. నీ దృష్టిలో ఏది మంచిదో అది చేయి.”'
  to: 'అప్పుడు రాజభవనానికి అధికారిగా ఉన్నవాడు, నగరానికి అధికారిగా ఉన్నవాడు, పెద్దలు, సంరక్షకులు[a] యేహూకు సందేశం పంపారు: “మేము మీ సేవకులము. మీరు మాకు చెప్పేదంతా చేస్తాము. మేము ఎవరినీ రాజుగా చేయము. మీ దృష్టికి మంచిదనిపించినది చేయండి.”'
  rationale: సందేశపు మర్యాదా-రాజకీయ రిజిస్టర్‌ను ఆధునిక ప్రామాణిక తెలుగులో నిలపడానికి యేహూకు గౌరవార్థక ఏకవచన సంబోధన వాడబడింది. ‘సందేశం పంపారు’ మరియు ‘రాజభవనానికి/నగరానికి అధికారి’ రూపాలు మూలార్థాన్ని మార్చకుండా వాక్యాన్ని మరింత సహజంగా చేశాయి. పాదసూచిక గుర్తు సరియైనట్లుగా הָאֹמְנִים (‘సంరక్షకులు’) వద్దనే ఉంచబడింది.
