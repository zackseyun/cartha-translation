id: 2KI.10.5
reference: 2 Kings 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֲשֶׁר עַל הַ/בַּ֣יִת וַ/אֲשֶׁ֪ר עַל הָ/עִ֟יר וְ/הַ/זְּקֵנִים֩ וְ/הָ/אֹמְנִ֨ים אֶל יֵה֤וּא לֵ/אמֹר֙ עֲבָדֶ֣י/ךָ אֲנַ֔חְנוּ וְ/כֹ֛ל אֲשֶׁר תֹּאמַ֥ר אֵלֵ֖י/נוּ נַעֲשֶׂ֑ה לֹֽא נַמְלִ֣יךְ אִ֔ישׁ הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵֽׂה־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: te
  text: 'అప్పుడు రాజభవనానికి అధికారిగా ఉన్నవాడు, నగరానికి అధికారిగా ఉన్నవాడు, పెద్దలు, సంరక్షకులు[a] యేహూకు సందేశం పంపారు: “మేము మీ సేవకులము. మీరు మాకు చెప్పేదంతా చేస్తాము. మేము ఎవరినీ రాజుగా చేయము. మీ దృష్టికి మంచిదనిపించినది చేయండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పోషక తండ్రులు” లేదా “పోషకులు.” ఈ హీబ్రూ పదం రాజకుమారుల సంరక్షణ బాధ్యత అప్పగించబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: రాజభవనంపై అధికారిగా ఉన్నవాడు
  rationale: రాజగృహ నిర్వహణ బాధ్యత వహించే అధికారిని సూచించే హీబ్రూ పదబంధం. సందర్భానికి తగినట్లు ‘రాజభవనం’ అని, నిర్దిష్ట హోదాను అతిగా నిర్ణయించకుండా ‘అధికారిగా ఉన్నవాడు’ అని అనువదించాం.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: నగరంపై అధికారిగా ఉన్నవాడు
  rationale: ఇది ఖచ్చితమైన అధికారిక బిరుదుకన్నా బాధ్యతను వర్ణించే పదబంధం; అందువల్ల మూలంలోని విస్తృత భావాన్ని నిలిపాం.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: సామాజిక, పరిపాలనా నాయకత్వ పాత్రను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: הָאֹמְנִים
  choice: సంరక్షకులు
  rationale: రాజకుమారుల సంరక్షణ అప్పగించబడినవారిని సూచిస్తుంది. ‘సంరక్షకులు’ అనే పదం పోషక తండ్రులు లేదా పరిరక్షకులు అనే సాధ్యమైన భావాలన్నిటినీ అతిగా పరిమితం చేయకుండా కలిగి ఉంటుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులం
  rationale: ఇక్కడ బానిసత్వ స్థితికన్నా రాజకీయ విధేయతను వినయంగా ప్రకటించే సంబోధన కాబట్టి ‘సేవకులు’ సరిపోతుంది.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: నువ్వు మాకు చెప్పేదంతా చేస్తాం
  rationale: విధేయతా ప్రతిజ్ఞను ఆధునిక, సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: మేము ఎవరినీ రాజుగా చేయం
  rationale: హిఫిల్ రూపంలోని ‘రాజుగా చేయడం/పాలనలో నిలపడం’ అనే కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టిలో ఏది మంచిదో
  rationale: ‘నీ కళ్లలో మంచిది’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థవంతంగా, దాని మూల రూపానికి సమీపంగా ఉంచుతుంది.
- source_word: עֲשֵׂה
  choice: అది చేయి
  rationale: మూలంలోని సంక్షిప్త ఏకవచన ఆజ్ఞను సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలితో అనువదించబడింది. సందేశంలోని ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు/నీ’ రూపాలు మూలంలోని యేహూకు చేసిన ఏకవచన సంబోధనను స్పష్టంగా నిలుపుతాయి. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తు ‘palace’ తరువాత కనిపించినా, దాని విషయం הָאֹמְנִים అనే ‘సంరక్షకులు’ పదానికే సంబంధించినందున గుర్తును ఆ పదం తరువాత ఉంచాం.
