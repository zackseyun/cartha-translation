source:
  edition: WLC
  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: te
  text: 'సమరయలో అహాబుకు డెబ్బై మంది కుమారులు ఉన్నారు. యెహూ ఉత్తరాలు రాసి, వాటిని సమరయకు—యెజ్రెయేలు అధికారులకు[a], పెద్దలకు, అహాబు కుమారుల సంరక్షకులకు[b]—పంపించాడు. వాటిలో ఇలా రాశాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం: “యెజ్రెయేలు అధికారులు.” ఉత్తరాలు సమరయకు పంపబడ్డాయని వచనం చెబుతున్నందున, సమరయలో నివసిస్తున్న యెజ్రెయేలుతో సంబంధమున్న అధికారులని కొందరు అర్థం చేసుకుంటారు. కొన్ని ప్రాచీన అనువాదాలు, వ్యాఖ్యానాలు “సమరయ అధికారులు” అనే పాఠాన్ని సమర్థిస్తాయి. ప్రధాన పాఠం మసొరెటిక్ హీబ్రూ పాఠాన్నే నిలుపుతుంది.'
    reason: textual_variant
  - marker: b
    text: లేదా “పెంపుడు తండ్రులకు,” “పోషకులకు.” హీబ్రూ పదం అహాబు కుమారులను పెంచే లేదా పర్యవేక్షించే బాధ్యత అప్పగించబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: అహాబుకు … ఉన్నారు
  rationale: హీబ్రూ దత్తివ విభక్తితో కూడిన ఈ నిర్మాణం స్వామ్యాన్ని తెలియజేస్తుంది. తెలుగులో ‘అహాబుకు … ఉన్నారు’ సహజంగా ఉండి, మూలంలోని విషయారంభాన్ని అదనపు కాలసూచక పదం లేకుండా అందిస్తుంది.
- source_word: שִׁבְעִים בָּנִים
  choice: డెబ్బై మంది కుమారులు
  rationale: בָּנִים ఇక్కడ రాజవంశ వారసత్వ సందర్భంలో మగ సంతానాన్ని సూచిస్తుంది; అందువల్ల సాధారణ ‘పిల్లలు’ కంటే ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; నగరంలో వారు ఉన్నారని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: ఉత్తరాలు రాసి
  rationale: סְפָרִים ఈ సందర్భంలో పంపించే లిఖిత సమాచారాలను సూచిస్తుంది; ‘ఉత్తరాలు’ కథనానికి సరిపోతుంది.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: వాటిని సమరయకు … పంపించాడు
  rationale: ముందటి వాక్యభాగంలోని ఉత్తరాలనే కర్మగా తెలుగులో ‘వాటిని’ అని స్పష్టపరచడం సహజం; שֹׁמְרוֹן గమ్యస్థానంగా నిలుస్తుంది.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: యెజ్రెయేలు అధికారులకు
  rationale: שָׂרֵי పాలనా నాయకులు లేదా అధికారులను సూచిస్తుంది. ఉత్తరాలు సమరయకు పంపబడినా మసొరెటిక్ పాఠంలో ‘యెజ్రెయేలు’ ఉన్న పాఠ్య క్లిష్టతను అనువాదం అలాగే ఉంచుతుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలకు
  rationale: ఇది కేవలం వృద్ధులను కాక, గుర్తింపు పొందిన పట్టణ లేదా సమాజ నాయకులను సూచిస్తుంది. ‘పెద్దలు’ ఆధునిక తెలుగులో ఈ పౌరపాత్రను సహజంగా తెలియజేస్తుంది.
- source_word: הָאֹמְנִים אַחְאָב
  choice: అహాబు కుమారుల సంరక్షకులకు
  rationale: אמן ధాతువు నుండి వచ్చిన ఈ రూపం రాజకుమారులను పెంచే లేదా పర్యవేక్షించే బాధ్యతగలవారిని సూచిస్తుంది. సందర్భంలో అంతర్లీనంగా ఉన్న ‘కుమారుల’ను తెలుగులో చేర్చడం అస్పష్టతను నివారిస్తుంది.
- source_word: לֵאמֹר
  choice: 'వాటిలో ఇలా రాశాడు:'
  rationale: తరువాత వచ్చే ఉత్తరంలోని మాటలను పరిచయం చేసే హీబ్రూ సూత్రపదాన్ని, తెలుగు లిఖిత సందేశ సందర్భానికి సహజంగా మార్చింది.
