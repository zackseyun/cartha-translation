translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలిని వాడాం. ‘సమరయకు—యెజ్రెయేలు అధికారులకు…—పంపించాడు’ అనే నిర్మాణం కొద్దిగా అసాధారణంగా ఉన్నా, మూల హీబ్రూలోని భౌగోళిక/పాఠ్య ఉద్రిక్తతను సమరసపరచకుండా నిలుపుతుంది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వద్ద ఉంచాం.
