source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יֵה֗וּא קַדְּשׁ֧וּ עֲצָרָ֛ה לַ/בַּ֖עַל וַ/יִּקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: te
  text: అప్పుడు యెహూ, “బయలు కొరకు ఒక ప్రత్యేక పవిత్ర సభను నియమించండి” అన్నాడు. వారు దానిని ప్రకటించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: קַדְּשׁוּ
  choice: పవిత్ర ... ఏర్పాటు చేయండి
  rationale: ఈ బహువచన ఆజ్ఞారూపం సభను ఆరాధనా ప్రయోజనం కోసం ప్రత్యేకంగా నియమించడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు దాని ఆచారసంబంధ భావాన్ని ‘పవిత్ర సభను ఏర్పాటు చేయండి’ అనే పదబంధంతో వ్యక్తం చేశాం.
- source_word: עֲצָרָה
  choice: సభ
  rationale: ఇది లాంఛనప్రాయమైన మతపరమైన సమాహారాన్ని సూచిస్తుంది; קַדְּשׁוּతో కలిపి ‘పవిత్ర సభ’ ఆ భావాన్ని స్పష్టంగా, సహజంగా ఇస్తుంది.
- source_word: לַבַּעַל
  choice: బయలు కోసం
  rationale: ל ఇక్కడ సంబంధం లేదా ఉద్దేశాన్ని సూచిస్తుంది—బయలు గౌరవార్థం లేదా ఆరాధన కోసం జరిగే సభ. ‘కోసం’ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: וַיִּקְרָאוּ
  choice: కాబట్టి వారు దానిని ప్రకటించారు
  rationale: קרא ఇక్కడ బహిరంగంగా అధికారిక ప్రకటన చేయడాన్ని సూచిస్తుంది. ‘దానిని’ అనే కర్మ సందర్భం నుంచి పూరించబడింది; ‘కాబట్టి’ ఆ ఆజ్ఞకు అనుసరణను సహజంగా చూపిస్తుంది.
