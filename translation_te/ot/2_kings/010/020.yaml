translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే మతపరమైన సందర్భానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. మూలంలోని ఆజ్ఞ, కథన క్రమం, సభ యొక్క ఆరాధనాసంబంధ స్వభావం నిలుపుకున్నాం.
