source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: యెహూ చేసిన మిగిలిన కార్యాలు, అతడు చేసినదంతా, అతని పరాక్రమమంతా[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పరాక్రమ కార్యాలన్నీ.”
    reason: lexical_alternative
  - marker: b
    text: ఇది రాజుల పాలనకు సంబంధించిన వృత్తాంతాలు నమోదు చేసిన ఒక లిఖితాధారాన్ని సూచిస్తుంది; ఇది బైబిలులోని దినవృత్తాంతముల గ్రంథమే కావాల్సిన అవసరం లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: యెహూ చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన ముగింపు సూత్రంలో דִּבְרֵי అనేది మాటలను కాక, రాజు చేసిన కార్యాలను లేదా అతని పాలనకు సంబంధించిన విషయాలను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలిపేలా అనువదించబడింది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: כָל యొక్క సమగ్ర భావాన్నీ, హెబ్రీయ relative clause నిర్మాణాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: అతని పరాక్రమమంతా
  rationale: גְּבוּרָה బలం, శౌర్యం లేదా ఆ బలంతో చేసిన ఘనకార్యాలను సూచించగలదు. ‘పరాక్రమం’ ఈ ఉద్దేశపూర్వక విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది; ‘పరాక్రమ కార్యాలన్నీ’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: הֲלוֹא సానుకూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను ప్రవేశపెడుతుంది. ‘ఉన్నాయి కదా?’ ఆధునిక తెలుగులో ఆ ప్రశ్నా బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథంలో
  rationale: עַל סֵפֶר అనే నుడికారాన్ని తెలుగులో సహజంగా ‘గ్రంథంలో’ అని ఇచ్చాం. דִּבְרֵי הַיָּמִים రాజులకు సంబంధించిన చారిత్రక వార్షిక వృత్తాంతాలను సూచిస్తుంది; ‘వృత్తాంతాలు’ ఆ రాజరిక లిఖితాధార భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ప్రస్తావించబడిన గ్రంథం యొక్క గుర్తింపు
  choice: ‘ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథం’ అనే రాజరిక లిఖితాధారంగా అనువదించడం
  alternative: బైబిలులోని ‘దినవృత్తాంతములు’ గ్రంథంగా గుర్తించడం
  rationale: రాజుల గ్రంథంలోని ఈ సూత్రబద్ధ ప్రస్తావన ఇశ్రాయేలు రాజుల పాలనకు సంబంధించిన రాజరిక వార్షిక వృత్తాంతాలను సూచిస్తుంది; అది ప్రస్తుతం కానన్‌లో ఉన్న దినవృత్తాంతముల గ్రంథమేనని మూలపాఠం చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక శైలిని ఉపయోగించాం. మూలంలోని అలంకార ప్రశ్నను నిలిపి, పాతకాలపు క్రియారూపాలను నివారించాం.
