source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: te
  text: ఆ రోజుల్లో యాహ్వే ఇశ్రాయేలు నుండి భాగాలను తొలగించడం మొదలుపెట్టాడు.[a] హజాయేలు ఇశ్రాయేలు భూభాగమంతటా[b] వారిని దెబ్బతీశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలును కుదించడం మొదలుపెట్టాడు.’ హీబ్రూ క్రియ ఇశ్రాయేలు క్రమంగా తగ్గిపోవడం అనే భావాన్ని సూచిస్తుంది; సందర్భంలో అది భూభాగాల నష్టాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలు సరిహద్దు పొడవునా.’ ఇక్కడి హీబ్రూ పదం ‘సరిహద్దు’ లేదా ‘భూభాగం’ అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: హీబ్రూ బహువచన కాలసూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: הֵחֵל לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలును కుదించడం మొదలుపెట్టాడు
  rationale: הֵחֵל చర్య ఆరంభాన్ని సూచిస్తుంది; לְקַצּוֹת సంపూర్ణ నాశనం కన్నా ఇశ్రాయేలు క్రమంగా తగ్గించబడడం లేదా దాని భాగాలు తొలగించబడడం అనే భావాన్ని ఇస్తుంది. ప్రధాన వాక్యంలో సహజత కోసం ‘కుదించడం’ వాడి, కోయడం అనే రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיַּכֵּם
  choice: వారిని దెబ్బతీశాడు
  rationale: נכה అనే సైనిక క్రియలోని ‘కొట్టడం/దెబ్బతీయడం’ బలాన్ని నిలుపుతూ, అది తప్పనిసరిగా అందరినీ చంపాడని అధికంగా నిర్దిష్టం చేయదు; బహువచన కర్మప్రత్యయం ‘వారిని’గా వ్యక్తమైంది.
- source_word: חֲזָאֵל
  choice: హజాయేలు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు భూభాగమంతటా
  rationale: גְּבוּל ‘సరిహద్దు’ లేదా ‘భూభాగం’ అని అర్థమవుతుంది. ఈ సైనిక-భౌగోళిక సందర్భంలో దేశాధీన ప్రాంతపు పూర్తి విస్తృతిని ‘భూభాగమంతటా’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామమే ఉంది. అందువల్ల దాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: ఇశ్రాయేలు తగ్గింపులో యాహ్వే పాత్ర
  choice: యాహ్వే ... కుదించడం మొదలుపెట్టాడు
  alternative: ఇశ్రాయేలు కుదించబడడానికి యాహ్వే అనుమతించాడు
  rationale: హీబ్రూ వాక్యం యాహ్వేను నేరుగా కర్తగా ఉంచుతుంది. ‘అనుమతించాడు’ అని మార్చడం మూలంలోని దైవిక కార్యసాధకత్వాన్ని సడలించి, పాఠంలో లేని వివరణను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, అయితే గంభీరతను నిలుపుతూ రచించబడింది. ‘కుదించడం’ ప్రాంతీయ నష్టంతో దేశం తగ్గిపోవడాన్ని సహజంగా తెలియజేస్తుంది; ‘దెబ్బతీశాడు’ సైనిక క్రియ బలాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
