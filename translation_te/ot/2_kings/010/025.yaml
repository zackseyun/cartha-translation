source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/כַלֹּת֣/וֹ לַ/עֲשׂ֣וֹת הָ/עֹלָ֗ה וַ/יֹּ֣אמֶר יֵ֠הוּא לָ/רָצִ֨ים וְ/לַ/שָּׁלִשִׁ֜ים בֹּ֤אוּ הַכּוּ/ם֙ אִ֣ישׁ אַל יֵצֵ֔א וַ/יַּכּ֖וּ/ם לְ/פִי חָ֑רֶב וַ/יַּשְׁלִ֗כוּ הָֽ/רָצִים֙ וְ/הַ/שָּׁ֣לִשִׁ֔ים וַ/יֵּלְכ֖וּ עַד עִ֥יר בֵּית הַ/בָּֽעַל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: te
  text: అతడు దహనబలి అర్పించడం ముగించినప్పుడు, యేహూ పరుగువారితోనూ సైన్యాధికారులతోనూ, “లోపలికి వెళ్లి వారిని హతమార్చండి; ఒక్క మనిషినీ బయటికి రానివ్వకండి” అన్నాడు. అప్పుడు వారు కత్తితో వారిని నరికివేశారు. పరుగువారు, సైన్యాధికారులు వారిని బయటకు విసిరివేసి, బయలు మందిరపు పట్టణం[a] వరకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థంగా “బయలు మందిరపు పట్టణం వరకు” అని అనువదించవచ్చు; సందర్భంలో ఇది మందిర సముదాయంలోని కోటలాంటి అంతర్గత భాగాన్ని లేదా అంతర పవిత్ర ప్రదేశాన్ని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ
  choice: అతడు ... ముగించినప్పుడు
  rationale: כְּతో కూడిన infinitive construct కాలసంబంధాన్ని సూచిస్తుంది. పురుష ఏకవచన కర్తను ‘అతడు’గా ఉంచి, సందర్భంలో అతడు ఎవరో పాఠ్యమే నిర్ణయించేలా చేశాం.
- source_word: לַעֲשׂוֹת הָעֹלָה
  choice: దహనబలి అర్పించడం
  rationale: עָשָׂה + עֹלָה బలియర్పణకు సంబంధించిన ప్రయోగం; ‘అర్పించడం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆచారార్థాన్ని నిలుపుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָהకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు బైబిలు పదం.
- source_word: לָרָצִים
  choice: పరుగువారు
  rationale: רָצִים యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; వీరు రాజసేవలో అంగరక్షకులు లేదా దూతలు అయి ఉండవచ్చు గాని, పాఠ్యం ఇక్కడ ఆ విధిని ఖచ్చితంగా చెప్పదు.
- source_word: לַשָּׁלִשִׁים
  choice: సైన్యాధికారులు
  rationale: שָׁלִישׁ సైనిక అధికారిని సూచిస్తుంది; నిర్దిష్టమైన చారిత్రక హోదాను ఊహించకుండా కార్యపాత్రను స్పష్టం చేస్తుంది.
- source_word: בֹּאוּ
  choice: లోపలికి వెళ్లి
  rationale: ఆలయ ప్రాంగణంలోకి ప్రవేశించాలనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַכּוּם
  choice: వారిని హతమార్చండి
  rationale: נכה ఇక్కడ కత్తితో జరిగే ప్రాణాంతక దాడిని సూచిస్తుంది; సందర్భానుగుణ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ אַל יֵצֵא
  choice: ఒక్క మనిషినీ బయటికి రానివ్వకండి
  rationale: אִישׁ యొక్క ఏకవచన పంపిణీ బలాన్ని ‘ఒక్క మనిషినీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְפִי חָרֶב
  choice: కత్తితో ... నరికివేశారు
  rationale: అక్షరార్థంగా ‘కత్తి నోటితో’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో హింసాత్మక చర్య స్పష్టంగా కనిపించేలా వ్యక్తం చేసింది.
- source_word: וַיַּשְׁלִכוּ
  choice: వారిని బయట పడవేసి
  rationale: శరీరాలను విసిరివేయడం లేదా బయట పడవేయడం అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ‘శవాలు’ అని మూలంలో లేని నామవాచకాన్ని చేర్చలేదు.
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: బయలు మందిరంలోని అంతర్భాగం[a] వరకు
  rationale: ఆలయ సందర్భంలో עִיר అంతర్గత రక్షిత లేదా పవిత్ర భాగాన్ని సూచించవచ్చు. అయితే పదానికి సాధారణంగా ‘పట్టణం’ అనే అర్థం ఉండటంతో మూలంలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
