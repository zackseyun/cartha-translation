source:
  edition: WLC
  text: וַ/יָּבֹא֙ שֹֽׁמְר֔וֹן וַ֠/יַּךְ אֶת כָּל הַ/נִּשְׁאָרִ֧ים לְ/אַחְאָ֛ב בְּ/שֹׁמְר֖וֹן עַד הִשְׁמִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר אֶל אֵלִיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: te
  text: అతడు షోమ్రోనుకు వచ్చి, షోమ్రోనులో ఆహాబుకు చెందిన మిగిలిన వారందరినీ నిర్మూలించేంతవరకు హతమార్చాడు[a], యాహ్వే ఏలీయాతో పలికిన మాట ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “అతణ్ణి” లేదా “దానిని నిర్మూలించేంతవరకు.” ఈ ఏకవచన ప్రత్యయం ఆహాబును వ్యక్తిగతంగా కాక, ఆహాబు ఇంటివారిని సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: అతడు షోమ్రోనుకు వచ్చి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన క్రమబద్ధ వాక్య నిర్మాణంతో రాకను తదుపరి చర్యకు అనుసంధానిస్తుంది.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: ఈ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడం లేదా చంపడాన్ని సూచిస్తుంది; ‘హతమార్చాడు’ హింస తీవ్రతను స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: ఆహాబుకు చెందినవారిలో మిగిలిన వారందరినీ
  rationale: לְ సంబంధం లేదా అనుబంధాన్ని సూచిస్తుంది. సందర్భంలో ఇది ఆహాబు ఇంటికి లేదా వర్గానికి చెందిన మిగిలిన వ్యక్తులను సూచిస్తుంది; ‘శేషం’ అనే ప్రత్యేక ధార్మిక భావాన్ని అనవసరంగా చేర్చకుండా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: మూలంలోని స్థల సూచనను, అలాగే ‘షోమ్రోను’ అనే పేరును పునరుక్తితో సహా నిలుపుతుంది.
- source_word: עַד הִשְׁמִידוֹ
  choice: అతడు వారిని పూర్తిగా నిర్మూలించేంతవరకు[a]
  rationale: שׁמד పూర్తిగా నాశనం చేయడం లేదా నిర్మూలించడం అనే అర్థం ఇస్తుంది. ప్రధాన పాఠ్యంలో సందర్భానుసారమైన బహువచన సూచనను సహజ తెలుగులో ఇచ్చి, హీబ్రూ ఏకవచన ప్రత్యయపు అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: כִּדְבַר יְהוָה
  choice: యాహ్వే ... పలికిన మాట ప్రకారం
  rationale: דבר ను ‘మాట’గా అనువదించడం ప్రవచన వాక్య నెరవేర్పు సూత్రాన్ని నిలుపుతుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: ఏలీయాతో పలికిన
  rationale: ముందుగా పలికిన ప్రవచన వాక్యాన్ని సూచించే సంబంధ వాక్యాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఒడంబడిక నామమైన టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ఆధునికంగా అంగీకరించబడిన ధ్వన్యనుకరణ ‘యాహ్వే’గా ఇచ్చాం.
- issue: עַד הִשְׁמִידוֹ లోని ఏకవచన ప్రత్యయం
  choice: ప్రధాన పాఠ్యంలో ‘వారిని’; పాదసూచికలో ఏకవచన రూపం
  alternative: ‘అతణ్ణి’ లేదా ‘దానిని’ అని అక్షరార్థంగా ఇవ్వడం
  rationale: వ్యాకరణ రూపం ఏకవచనమైనప్పటికీ, సందర్భంలోని ఆహాబు ఇంటివారిని సమష్టిగా సూచించే అవకాశం ఉంది. సహజ తెలుగు కోసం బహువచనం వాడి, మూలంలోని నిజమైన అస్పష్టతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. మూలంలోని ‘షోమ్రోను’ పునరుక్తిని విశ్వసనీయత కోసం నిలిపాం. అసహజమైన ఏకవచన సూచనను ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టకుండా, దాని వ్యాకరణ మరియు భావ అస్పష్టతను పాదసూచికలో సంరక్షించాం.
