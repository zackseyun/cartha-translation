    reason: lexical_alternative
  revision_rationale: The revision strengthens the rendering of קִנְאָה from generic ‘interest’ to ardent ‘zeal,’ retains the source’s possible jealousy nuance in a restrained footnote, and aligns the divine-name form with the supplied POB policy. The causative plural and the possessive reference to the chariot are retained.
