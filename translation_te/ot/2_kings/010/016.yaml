  to: అప్పుడు అతడు, “నాతో రా; యాహ్వే పట్ల నాకున్న అత్యుత్సాహాన్ని చూడు[a]” అన్నాడు. కాబట్టి వారు అతణ్ణి అతని రథంలో ఎక్కించారు.
