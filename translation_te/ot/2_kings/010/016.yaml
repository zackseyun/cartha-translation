id: 2KI.10.16
reference: 2 Kings 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְכָ֣/ה אִתִּ֔/י וּ/רְאֵ֖ה בְּ/קִנְאָתִ֣/י לַ/יהוָ֑ה וַ/יַּרְכִּ֥בוּ אֹת֖/וֹ בְּ/רִכְבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: te
  text: అప్పుడు అతడు, “నాతో రా; యాహ్వే పట్ల నాకున్న అత్యుత్సాహాన్ని చూడు[a]” అన్నాడు. కాబట్టి వారు అతణ్ణి అతని రథంలో ఎక్కించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అత్యుత్సాహం’ అని అనువదించిన హీబ్రూ పదానికి సందర్భాన్ని బట్టి ‘అసూయ’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: నాతో రా
  rationale: הלך ఆజ్ఞారూపం ఇక్కడ ఆహ్వానం లేదా పిలుపుగా వాడబడింది; אִתִּי తో కలిపి సహజమైన ఆధునిక తెలుగు రూపం ‘నాతో రా’.
- source_word: וּרְאֵה
  choice: చూడు
  rationale: ראה ఆజ్ఞారూపంలోని ప్రత్యక్షతను నిలుపుతుంది; ‘సాక్షిగా ఉండు’ అనడం అవసరానికి మించిన వ్యాఖ్యానం అవుతుంది.
- source_word: בְּקִנְאָתִי
  choice: నాకున్న ఆసక్తి
  rationale: קִנְאָה అనే పదం సందర్భానుసారం తీవ్రమైన ఆసక్తి, ఉత్సాహం, లేదా అసూయను సూచించగలదు. యెహోవా పట్ల తన నిబద్ధతను యెహూ ప్రకటిస్తున్న ఈ సందర్భంలో ‘ఆసక్తి’ సహజంగా సరిపోతుంది; పదంలోని ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి కాపాడుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా పట్ల
  rationale: ל ఉపసర్గ ఆసక్తి దేనివైపు లేదా ఎవరి పట్ల ఉందో సూచిస్తుంది. יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించడం తెలుగు పాఠకులకు సహజంగా, గుర్తించదగిన విధంగా ఉంటుంది.
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: వారు అతణ్ణి ... ఎక్కించారు
  rationale: רכב హిఫిల్ రూపం ‘ఎక్కించడం/ప్రయాణించేటట్లు చేయడం’ అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది. బహువచన క్రియను అనుసరించి ‘వారు’ను నిలిపాం.
- source_word: בְּרִכְבּוֹ
  choice: అతని రథంలో
  rationale: רֶכֶב ఇక్కడ రథాన్ని సూచిస్తుంది; בְּ మరియు స్వామ్య ప్రత్యయం కలిపి ‘అతని రథంలో’ అని సహజంగా అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
- issue: קִנְאָה యొక్క భావవ్యాప్తి
  choice: ఆసక్తి
  alternative: రోషంతో కూడిన ఉత్సాహం / అసూయ
  rationale: యెహూ తన చర్యలను యెహోవా పట్ల నిబద్ధతగా చూపిస్తున్నందున ప్రధాన పాఠంలో ‘ఆసక్తి’ అనువైనది. అయితే ఆ పదంలోని తీవ్రతను లేదా అసూయ భావసంభావ్యతను పూర్తిగా తొలగించకుండా పాదటిప్పణిలో తెలిపాం; అతని ప్రకటనను నిజమని గానీ అబద్ధమని గానీ అనువాదమే తీర్పు చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రత్యక్షమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. సంభాషణలో ‘రా’, ‘చూడు’ అనే ఏకవచన ఆజ్ఞారూపాలు మూలంలోని ప్రత్యక్ష వ్యక్తిగత పిలుపును సహజంగా నిలుపుతాయి. పాదటిప్పణి సూచిక [a] సంబంధిత సందిగ్ధ పదం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
