  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: te
  text: వారు బయలు దేవుని స్తంభాన్ని కూలగొట్టారు; బయలు దేవుని ఇంటిని[a] కూడా కూలగొట్టి, దానిని ఈనాటివరకు మరుగుదొడ్డిగా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయలు దేవుని మందిరం.” హెబ్రీలో అక్షరార్థంగా, “బయలు ఇల్లు.”
    reason: బֵּית హీబ్రూ పదం అక్షరార్థంగా ‘ఇల్లు’; ఆరాధనా సందర్భంలో అది ‘మందిరం’ లేదా ‘ఆలయం’ అని కూడా అర్థమవవచ్చు.
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: కూలగొట్టారు
  rationale: נתץ అనే క్రియ నిర్మాణాన్ని లేదా ఆరాధనా వస్తువును బలవంతంగా పడగొట్టి ధ్వంసం చేయడాన్ని సూచిస్తుంది. ‘కూలగొట్టారు’ అనే పదం స్తంభానికీ మందిరానికీ సహజంగా సరిపోతుంది.
- source_word: מַצְּבַת
  choice: స్తంభాన్ని
  rationale: מַצֵּבָה సాధారణంగా ఆరాధనకు సంబంధించిన నిలువురాయి లేదా స్తంభాన్ని సూచిస్తుంది. సందర్భంలో అది బయలుకు చెందినదని స్పష్టంగా ఉన్నందున ‘స్తంభం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: הַבָּעַל
  choice: బయలు
  rationale: ఇక్కడ בעל కనానీయ దేవత పేరు లేదా బిరుదు. దానిని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపమైన ‘బయలు’గా లిప్యంతరీకరించాం.
- source_word: בֵּית הַבַּעַל
  choice: బయలు మందిరాన్ని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఆరాధనా సందర్భంలో దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బయలు మందిరం’ ఉద్దేశాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיְשִׂמֻהוּ
  choice: దాన్ని … మార్చారు
  rationale: שׂוּם + ל నిర్మాణం ఒక దానిని మరొక ఉపయోగానికి మార్చడాన్ని సూచిస్తుంది. ‘మార్చారు’ తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: למחראות
  choice: మరుగుదొడ్డిగా
  rationale: ఈ నామవాచకం మలవిసర్జన స్థలాన్ని సూచిస్తుంది. ‘మరుగుదొడ్డి’ స్పష్టమైన ఆధునిక పదం; బయలు ఆరాధనా స్థలాన్ని ఉద్దేశపూర్వకంగా అపవిత్రం చేసిన భావాన్ని దాచదు.
- source_word: עַד הַיּוֹם
  choice: నేటివరకు అలాగే ఉంది
  rationale: ఈ హెబ్రీయ ఇడియమ్ వర్ణకుని కాలం వరకు ఆ పరిస్థితి కొనసాగిందని తెలుపుతుంది. తెలుగులో పూర్తి సహజత్వం కోసం కొనసాగిన స్థితిని స్పష్టంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: בֵּית הַבַּעַל అనే ఆరాధనా స్థల పదబంధం
  choice: బయలు మందిరం
  alternative: బయలు ఇల్లు
  rationale: ‘ఇల్లు’ మూలపదానికి అక్షరార్థమైనా, తెలుగులో అది సాధారణ నివాసమనే అపార్థం కలిగించవచ్చు. సందర్భానుసారమైన ‘మందిరం’ ఆరాధనా స్థలాన్ని స్పష్టం చేస్తుంది; మూలంలోని రూపకాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: למחראות అనే అవమానకర వినియోగ పదం
  choice: మరుగుదొడ్డి
  alternative: మలవిసర్జన స్థలం
  rationale: వచనం బయలు ఆరాధనా స్థలాన్ని పూర్తిగా అపవిత్రం చేయడాన్ని బహిరంగంగా చెబుతుంది. ‘మరుగుదొడ్డి’ ఆ భావాన్ని సభ్యమైన ఆధునిక భాషలో తగ్గించకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను నిలుపుతూ అనువదించాం. రెండు విధ్వంస క్రియలను వేర్వేరు వాక్యభాగాలుగా ఉంచి మూలంలోని పునరుక్తి బలాన్ని కాపాడాం; అసభ్యమైన లేదా పాతకాలపు పదజాలం లేకుండా అపవిత్రీకరణ భావాన్ని స్పష్టంగా తెలిపాం.
