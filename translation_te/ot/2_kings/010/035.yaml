  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: te
  text: యెహూ తన పితరులతో కలిసి నిద్రించాడు. అతనిని షోమ్రోనులో పాతిపెట్టారు. అతని కుమారుడు యెహోయాహాజు అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో వాడే హీబ్రూ సంప్రదాయోక్తిని తెలుగులో సహజమైన బైబిలీయ మరణోక్తిగా నిలుపుతుంది; ఇది మరణాన్ని సూచిస్తుంది గాని కేవలం ‘చనిపోయాడు’ అని వివరణాత్మకంగా మార్చదు.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతణ్ణి పాతిపెట్టారు
  rationale: మూలంలోని కర్తను పేర్కొనని బహువచన క్రియను తెలుగులోనూ కర్తను ఊహించి చేర్చకుండా సహజంగా ప్రతిబింబిస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: בְ అనే స్థానార్థక విభక్తిని ‘లో’తో అనువదించి, హీబ్రూ స్థలనామానికి దగ్గరైన ‘షోమ్రోను’ రూపాన్ని వాడింది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ క్రియ పరిపాలన కాలమంతటిని కాక రాజ్యాధికార స్వీకరణను సూచిస్తుంది; ‘రాజయ్యాడు’ ఆ వారసత్వ మార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: మునుపటి రాజు స్థానాన్ని కుమారుడు స్వీకరించిన అధికార వారసత్వ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా, తెలుగులో స్థిరపడిన బైబిలీయ రూపం.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: హీబ్రూ వ్యక్తినామంలోని ధ్వనులను సాధ్యమైనంతగా నిలుపుతూ, తెలుగులో చదవడానికి సహజమైన రూపం.
theological_decisions:
- issue: ‘తన పితరులతో కూడ నిద్రించాడు’ అనే మరణోక్తి
  choice: సంప్రదాయోక్తిని యథాతథ భావంతో నిలుపుట
  alternative: ‘చనిపోయాడు’
  rationale: మూలపాఠం మరణాన్ని సంప్రదాయ రాజవంశీయ సూత్రవాక్యంతో తెలియజేస్తుంది. దానిని కేవలం ‘చనిపోయాడు’గా మార్చితే పితరులతో అనుబంధమైన సాహిత్య, వంశపారంపర్య భావం పోతుంది; అదే సమయంలో ఈ మాటల నుంచి మరణానంతర స్థితిపై అదనపు సిద్ధాంతాన్ని నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. రాజుల మరణం, వారసత్వానికి సంబంధించిన హీబ్రూ సూత్రభాషను సహజమైన తెలుగు బైబిలీయ వాడుకతో సమతుల్యం చేసింది.
