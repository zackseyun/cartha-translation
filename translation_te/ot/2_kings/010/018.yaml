  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יֵהוּא֙ אֶת כָּל הָ/עָ֔ם וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַחְאָ֕ב עָבַ֥ד אֶת הַ/בַּ֖עַל מְעָ֑ט יֵה֖וּא יַעַבְדֶ֥/נּוּ הַרְבֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: te
  text: అప్పుడు యెహూ ప్రజలందరినీ సమకూర్చి వారితో ఇలా అన్నాడు:[a] “అహాబు బయలును కొద్దిగా సేవించాడు; యెహూ అతణ్ణి ఎంతో సేవిస్తాడు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భంలో యెహూ మాటలకు వ్యంగ్యార్థం ఉంది. బయలును ‘ఎంతో’ సేవిస్తానని అతడు చెబుతున్నప్పటికీ, బయలు ఆరాధకులను ఒకచోటికి రప్పించడానికి ఇది ఒక ఉపాయమని తరువాతి కథనం చూపిస్తుంది.
    reason: cross_reference
  - marker: b
    text: ‘సేవించాడు … సేవిస్తాడు’ అనే మాటలను ‘ఆరాధించాడు … ఆరాధిస్తాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ దేవతకు చేసే మతపరమైన సేవను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: קבץ అనే క్రియ ప్రజలను ఒకచోటికి చేర్చడాన్ని సూచిస్తుంది. తెలుగు కథనశైలిలో ‘సమకూర్చి’ సహజంగా ఉండి మూలంలోని చర్యను నిలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరినీ
  rationale: ‘ప్రజలందరినీ’ అనే రూపం మూలంలోని ‘ప్రజలందరిని’ అనే విస్తృత సూచనను సంకుచితం చేయకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: עָבַד אֶת הַבַּעַל
  choice: బయలును ... సేవించాడు
  rationale: దేవతకు సంబంధించి עבד ఆరాధనాత్మక సేవను సూచించగలదు. ‘సేవించాడు’ మూల క్రియకు దగ్గరగా ఉండి ఆ మతపరమైన భావాన్ని కూడా నిలుపుతుంది.
- source_word: מְעָט
  choice: కొద్దిగానే
  rationale: ఇది సేవ యొక్క పరిమాణాన్ని సూచిస్తుంది. ‘కొద్దిగానే’ తరువాతి ‘ఎంతో ఎక్కువగా’తో ఉన్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘గానే’ సందర్భంలోని వాక్చాతుర్యాన్ని బలపరుస్తుంది.
- source_word: יַעַבְדֶנּוּ
  choice: అతణ్ణి ... సేవిస్తాడు
  rationale: కర్మప్రత్యయం బయలును తిరిగి సూచిస్తుంది. మూలంలోని సర్వనామాన్ని తెలుగులో ‘అతణ్ణి’గా నిలిపి, అసంపూర్ణ క్రియ యొక్క భవిష్యదర్థాన్ని ‘సేవిస్తాడు’తో అందిస్తుంది.
- source_word: הַרְבֵּה
  choice: ఎంతో ఎక్కువగా
  rationale: ఇది క్రియావిశేషణంగా సేవ యొక్క అధిక పరిమాణాన్ని సూచిస్తుంది. ‘ఎంతో ఎక్కువగా’ ఆధునిక తెలుగులో సహజంగా ఉండి מְעָטతోని స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరిస్తుంది.
- source_word: הַבַּעַל
  choice: బయలు
  rationale: నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ ఇది దేవత పేరుగా వాడబడింది; తెలుగులో సహజమైన పేరురూపంగా ‘బయలు’ను ఉపయోగించాం.
theological_decisions:
- issue: బయలును సేవిస్తానని యెహూ చేసిన ప్రకటన
  choice: ప్రధాన పాఠ్యంలో అతని మాటను నేరుగా అనువదించి, అది ఉపాయమని ముందుగానే చెప్పలేదు.
  alternative: ‘సేవిస్తున్నట్లు నటిస్తాడు’ లేదా ‘సేవిస్తానని చెప్పాడు’ వంటి వివరణాత్మక పదాలను చేర్చడం.
  rationale: ఈ సందర్భంలో యెహూ మోసం చేస్తున్నాడని తరువాతి కథనం తెలియజేస్తుంది; అయితే ఈ వచనంలోని హీబ్రూ అతని మాటను ఎటువంటి వ్యాఖ్య లేకుండా నేరుగా నివేదిస్తుంది. అందువల్ల వ్యంగ్యార్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా పాదటిప్పణిలో తెలిపాం.
- issue: עבד యొక్క మతపరమైన భావం
  choice: ‘సేవించాడు/సేవిస్తాడు’ అని అనువదించడం.
  alternative: ‘ఆరాధించాడు/ఆరాధిస్తాడు’ అని అనువదించడం.
  rationale: దేవత విషయంలో ‘సేవించడం’ ఆరాధనాత్మక విధేయతను కలిగి ఉంటుంది. ఈ పదం మూలంలోని సేవ భావాన్ని, దాని మతపరమైన విస్తృతిని రెండింటినీ నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘కొద్దిగానే … ఎంతో ఎక్కువగా’ అనే సమాంతర వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం. ప్రధాన పాఠ్యంలో కథన వ్యంగ్యాన్ని వివరణగా చేర్చకుండా, మూలంలోని ప్రత్యక్ష ప్రకటనను నిలిపి పాదటిప్పణిలో సందర్భాన్ని తెలిపాం.
