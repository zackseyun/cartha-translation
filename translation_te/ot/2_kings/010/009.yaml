  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: te
  text: 'ఉదయాన అతడు బయటికి వచ్చి నిలబడి ప్రజలందరితో ఇలా అన్నాడు: “మీరు నిర్దోషులు[a]. ఇదిగో, నేనే అతని యజమానికి వ్యతిరేకంగా కుట్ర పన్ని అతణ్ణి చంపాను. అయితే వీరందరినీ ఎవరు చంపారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు నీతిమంతులు,” లేదా “మీరు న్యాయం వైపు ఉన్నారు.” ఇక్కడి హీబ్రూ పదం న్యాయంగా ఉండడాన్నీ, నిందలేకపోవడాన్నీ సూచించగలదు; ఈ బహిరంగ న్యాయపరమైన సందర్భంలో “నిర్దోషులు” అనే భావం సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం కాగానే
  rationale: హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో కాలసూచకంగా వ్యక్తపరుస్తుంది; అనవసరంగా పదశః ‘జరిగింది’ అని చేర్చదు.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: అతడు బయటికి వచ్చి నిలబడి
  rationale: వరుస క్రియలను, అలాగే ప్రజల ఎదుట నిలబడి మాట్లాడిన బహిరంగ భంగిమను నిలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరితో
  rationale: బహిరంగంగా సమకూడిన మొత్తం ప్రజాసమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: צַדִּקִים אַתֶּם
  choice: మీరు నిర్దోషులు
  rationale: ఈ బహిరంగ న్యాయపరమైన సందర్భంలో צדיקים నైతిక పరిపూర్ణతకన్నా నిందలేనివారు లేదా బాధ్యులు కానివారు అనే భావాన్ని ప్రధానంగా ఇస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వక్త తన ఒప్పుకోలుపై శ్రద్ధ నిలిపే హీబ్రూ ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: קָשַׁרְתִּי עַל
  choice: వ్యతిరేకంగా కుట్ర చేసి
  rationale: קשר על యొక్క రాజకీయ కుట్ర లేదా తిరుగుబాటు పన్నడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమానికి
  rationale: ఇక్కడ దేవుని బిరుదు కాదు, యెహూ యొక్క రాజాధిపతి ఉద్దేశించబడ్డాడు; ‘యజమాని’ ఆ రాజకీయ-అధీన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: וָאֶהְרְגֵהוּ
  choice: అతణ్ణి చంపాను
  rationale: הרג క్రియకు సరళమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: וּמִי הִכָּה אֶת כָּל אֵלֶּה
  choice: అయితే వీరందరినీ ఎవరు చంపారు?
  rationale: సందర్భంలో וּ ప్రతికూల వ్యత్యాసాన్ని చూపుతుంది. נכה ఇక్కడ ప్రాణాంతకంగా కొట్టివేయడాన్ని సూచిస్తుంది; సహజ తెలుగులో ‘చంపారు’ అని ఇచ్చాం. אֵלֶּה యొక్క మానవ సూచనను ‘వీరందరినీ’ నిలుపుతుంది.
theological_decisions:
- issue: צַדִּקִים אַתֶּם యొక్క న్యాయపరమైన లేదా నైతిక భావం
  choice: మీరు నిర్దోషులు
  alternative: మీరు నీతిమంతులు / మీరు న్యాయం వైపు ఉన్నారు
  rationale: యెహూ తన చర్యను ప్రజల చర్యతో వ్యంగ్యాత్మకంగా లేదా వాదనాత్మకంగా పోల్చుతున్న సందర్భంలో, వారి నైతిక నీతిని ప్రకటించడం కంటే ఈ హత్యలకు వారు బాధ్యులు కారనే బహిరంగ-న్యాయపరమైన భావం బలంగా ఉంది. అయినా మూలపదంలోని విస్తృత భావాన్ని పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అతణ్ణి’ మరియు ‘వీరందరినీ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండే రూపాలు; వాక్చాతుర్య ప్రశ్నను అలాగే నిలిపాం.
