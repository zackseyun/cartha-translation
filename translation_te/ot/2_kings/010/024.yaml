  text: וַ/יָּבֹ֕אוּ לַ/עֲשׂ֖וֹת זְבָחִ֣ים וְ/עֹל֑וֹת וְ/יֵה֞וּא שָׂם ל֤/וֹ בַ/חוּץ֙ שְׁמֹנִ֣ים אִ֔ישׁ וַ/יֹּ֗אמֶר הָ/אִ֤ישׁ אֲשֶׁר יִמָּלֵט֙ מִן הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר אֲנִי֙ מֵבִ֣יא עַל יְדֵי/כֶ֔ם נַפְשׁ֖/וֹ תַּ֥חַת נַפְשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: te
  text: వారు బలులనూ దహనబలులనూ అర్పించడానికి లోపలికి వెళ్లారు. యేహూ బయట ఎనభై మందిని నియమించి, “నేను మీ చేతికి అప్పగిస్తున్న ఈ మనుష్యులలో ఎవరినైనా తప్పించుకోనిచ్చినవాడు, తప్పించుకున్నవాని ప్రాణానికి బదులుగా తన ప్రాణాన్ని కోల్పోవాలి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని ప్రాణం అతని ప్రాణానికి బదులుగా.” సందర్భం ప్రకారం, ఎవరినైనా తప్పించుకోనిచ్చిన కాపలాదారుడు తప్పించుకున్న వ్యక్తి స్థానంలో తన ప్రాణాన్ని కోల్పోవాలి అనే అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: లోపలికి వెళ్లారు
  rationale: בוא అనే క్రియ సందర్భానుసారం రావడం, వెళ్లడం లేదా ప్రవేశించడం అని అర్థమిస్తుంది. ఇక్కడ ఆరాధన కోసం ఆలయంలోకి ప్రవేశించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: బలులనూ దహనబలులనూ అర్పించడానికి
  rationale: עשה సాధారణంగా ‘చేయడం’ అయినా, బలులకు సంబంధించిన సందర్భంలో ‘అర్పించడం’ అనే ఆచారార్థం కలిగి ఉంది. זְבָחִים సాధారణ బలులను, עֹלוֹת పూర్తిగా దహనం చేసే బలులను సూచిస్తుంది.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: బయట తన కోసం ఎనభై మందిని నియమించి
  rationale: שׂים అంటే ఉంచడం లేదా నియమించడం. కాపలా సందర్భంలో ‘నియమించి’ సహజం; לוֹ లోని యేహూ స్వయంగా చేసిన ఏర్పాటనే భావాన్ని ‘తన కోసం’ నిలుపుతుంది. మూలంలో ‘మనుషులు’ మాత్రమే ఉంది కాబట్టి ‘సైనికులు’ అని ప్రత్యేకీకరించలేదు.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: ఈ మనుషుల్లో ఎవడినైనా తప్పించుకోనిచ్చే వ్యక్తి
  rationale: מלט నిఫల్ రూపం ప్రాథమికంగా ‘తప్పించుకోవడం’ అని సూచించినా, కాపలాదారులకు ఇచ్చిన హెచ్చరికలో ఒకరు తప్పించుకోవడానికి బాధ్యుడైన వ్యక్తినే ఉద్దేశిస్తుంది. తెలుగు వాక్యంలో ఆ బాధ్యతను స్పష్టంగా, సందర్భానికి అనుగుణంగా తెలిపింది.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: నేను మీ చేతికి అప్పగిస్తున్న
  rationale: ‘చేతికి తీసుకురావడం’ అనే హీబ్రూ ప్రయోగం ఒకరి అధికారానికి లేదా బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది. ‘మీ చేతికి అప్పగిస్తున్న’ ఆ రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: తప్పించుకున్నవాడి ప్రాణానికి బదులుగా తన ప్రాణాన్ని ఇవ్వాలి
  rationale: נפש ఇక్కడ ‘ప్రాణం/జీవితం’ అనే అర్థంలో ఉంది. రెండు సర్వనామాల సూచనలను తెలుగులో స్పష్టం చేస్తూ, ఒక ప్రాణానికి బదులుగా మరొక ప్రాణం అనే శిక్షా సూత్రాన్ని నిలిపింది.
