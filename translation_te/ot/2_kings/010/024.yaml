  source_fidelity: 'మొత్తంగా మూలార్థాన్ని బాగా ప్రతిబింబిస్తుంది: వారు బలులు అర్పించడానికి లోపలికి వెళ్లడం, యేహూ బయట ఎనభై మందిని ఉంచడం, పారిపోవడంపై ప్రాణదండన హెచ్చరిక అన్నీ సరైనవే. అయితే ‘తన కోసం’ అనే అనువాదం לוֹ యొక్క సాధ్యమైన భావాన్ని అనవసరంగా ప్రత్యేకంగా చూపుతుంది; తెలుగులో అది యేహూ స్వప్రయోజనం కోసం వారిని నియమించాడనే అనవసరమైన నిగూఢార్థాన్ని కలిగించవచ్చు. చివరి శిక్షావాక్యంలోని రెండు సర్వనామాల అస్పష్టతను ప్రధాన వచనంలో సందర్భానుసారంగా స్పష్టం చేయవచ్చు; పాదటిప్పణిలో హీబ్రూ పునరుక్తి అస్పష్టతను యథాతథంగా తెలియజేయాలి.'
