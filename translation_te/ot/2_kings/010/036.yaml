translation:
  language: te
  text: యెహూ షోమ్రోనులో ఇశ్రాయేలుమీద ఇరవై ఎనిమిది సంవత్సరాలు రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר
  choice: '[యెహూ... పరిపాలించిన కాలం అనే నామవాచక నిర్మాణం కాకుండా] ... ఇరవై ఎనిమిది సంవత్సరాలు పరిపాలించాడు'
  rationale: ‘అతడు పరిపాలించిన రోజులు’ అనే హెబ్రీయ రాజసారాంశ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన కాలవ్యవధి వాక్యంగా వ్యక్తం చేస్తుంది; וְ ఇక్కడ సారాంశాన్ని కొనసాగించే సంధిగా ఉండి ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భం యెహూ రాజత్వాన్ని ఇప్పటికే నిర్ధారిస్తున్నందున ‘రాజుగా ఏలాడు’ కంటే సాధారణ పాఠకులకు సులభం.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: హెబ్రీ వ్యక్తినామానికి స్థిరపడిన తెలుగు లిప్యంతరీకరణ.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: מָלַךְ עַל అనే ‘వారిమీద రాజుగా పాలించు’ భావాన్ని తెలుగులో సహజమైన సకర్మక నిర్మాణంతో అందిస్తుంది.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: ఇరవై ఎనిమిది సంవత్సరాలు
  rationale: హెబ్రీ సంఖ్యను ఆధునిక తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: בְּ సూచించే స్థలాన్ని నిలుపుతూ హెబ్రీ שֹׁמְרוֹן పేరుకు మూలభాషకు దగ్గరైన తెలుగు రూపాన్ని ఉపయోగిస్తుంది; ఇది యెహూ పాలించిన రాజధాని స్థలాన్ని సూచిస్తుంది.
