- from: అతడు అక్కడి నుంచి ముందుకు వెళ్లి, తనను కలుసుకోవడానికి వస్తున్న రేకాబు కుమారుడు యెహోనాదాబును కనుగొన్నాడు. అతనికి వందనం చేసి[a], “నా హృదయం నీ హృదయంతో ఉన్నట్లే నీ హృదయం నాతో యథార్థంగా ఉందా?”[b] అని అడిగాడు. అందుకు యెహోనాదాబు, “ఉంది, నిజంగా ఉంది”[c] అన్నాడు. అప్పుడు యెహూ, “నీ చెయ్యి ఇవ్వు” అన్నాడు. అతడు తన చెయ్యి ఇచ్చినప్పుడు, యెహూ అతణ్ణి తన దగ్గరికి రథంలోకి ఎక్కించుకున్నాడు.
  to: అతడు అక్కడి నుంచి ముందుకు వెళ్లి, తనను కలుసుకోవడానికి వస్తున్న రేకాబు కుమారుడు యెహోనాదాబును కనుగొన్నాడు. అతణ్ణి పలకరించి[a], “నా హృదయం నీ హృదయంతో ఉన్నట్లే, నీ హృదయం యథార్థంగా ఉందా?”[b] అని అడిగాడు. అందుకు యెహోనాదాబు, “ఉంది, నిజంగా ఉంది”[c] అన్నాడు. అప్పుడు యెహూ, “నీ చెయ్యి ఇవ్వు” అన్నాడు. అతడు తన చెయ్యి ఇచ్చాడు; యెహూ అతణ్ణి తనతో పాటు రథంలోకి ఎక్కించుకున్నాడు.
  rationale: 'The revision makes only safe, source-oriented adjustments: it uses a neutral encounter greeting, aligns the heart question more closely with the Hebrew sequence without adding ‘with me’ to its predicate, improves the final Telugu clause, and makes the footnote wording correspond exactly to the revised text. No disputed meaning or theological interpretation has been imposed.'
