  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: te
  text: అతడు అక్కడి నుంచి ముందుకు వెళ్లి, తనను కలుసుకోవడానికి వస్తున్న రేకాబు కుమారుడు యెహోనాదాబును కనుగొన్నాడు. అతణ్ణి పలకరించి[a], “నా హృదయం నీ హృదయంతో ఉన్నట్లే, నీ హృదయం యథార్థంగా ఉందా?”[b] అని అడిగాడు. అందుకు యెహోనాదాబు, “ఉంది, నిజంగా ఉంది”[c] అన్నాడు. అప్పుడు యెహూ, “నీ చెయ్యి ఇవ్వు” అన్నాడు. అతడు తన చెయ్యి ఇచ్చాడు; యెహూ అతణ్ణి తనతో పాటు రథంలోకి ఎక్కించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి ఆశీర్వదించి.” హీబ్రూ క్రియకు ‘ఆశీర్వదించు’ అనే అర్థం ఉంది; అయితే ఈ కలయిక సందర్భంలో అది పలకరింపు లేదా అభివాదాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా హృదయం నీ హృదయంతో ఉన్నట్లే, నీ హృదయం యథార్థంగా ఉందా?” ఈ మాటలు పరస్పర నిబద్ధతను లేదా ఉద్దేశాల ఐక్యతను సూచిస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ఉంది, మరియు ఉంది”—ఇది బలమైన ధృవీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: అతడు అక్కడి నుంచి ముందుకు వెళ్లి
  rationale: הלךతో కూడిన מִשָּׁם మునుపటి స్థలం నుంచి కథన కదలిక కొనసాగడాన్ని సూచిస్తుంది; ‘ముందుకు వెళ్లి’ ఆ పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן רֵכָב
  choice: రేకాబు కుమారుడు యెహోనాదాబును కనుగొన్నాడు
  rationale: מצא యొక్క ప్రాథమిక భావమైన ‘కనుగొను’ను నిలుపుతూ, హీబ్రూ పేర్లను తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: לִקְרָאתוֹ
  choice: తనను కలుసుకోవడానికి వస్తున్న
  rationale: ఎదురుగా వచ్చి కలుసుకునే ఉద్దేశంతో సాగుతున్న కదలికను సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
- source_word: וַיְבָרְכֵהוּ
  choice: అతనికి వందనం చేసి
  rationale: ברך సాధారణంగా ‘ఆశీర్వదించు’ అని అర్థమైనా, ఎదురుపడిన సందర్భంలో పలకరింపు లేదా వందనం అనే ప్రయోగం సహజం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הֲיֵשׁ אֶת לְבָבְךָ יָשָׁר
  choice: నీ హృదయం నాతో యథార్థంగా ఉందా?
  rationale: లేబాబు అంతరంగ వైఖరి లేదా నిబద్ధతను, יָשָׁר నిజాయితీతో కూడిన సూటితనాన్ని సూచిస్తాయి. తెలుగులో సంబంధపరమైన నిబద్ధతను తెలియజేయడానికి ‘యథార్థంగా’ సహజంగా ఉంది.
- source_word: כַּאֲשֶׁר לְבָבִי עִם לְבָבֶךָ
  choice: నా హృదయం నీ హృదయంతో ఉన్నట్లే
  rationale: హీబ్రూలోని పునరుక్త ‘హృదయం’ రూపకాన్నీ, עִםలోని ‘తో’ అనే సంబంధాన్నీ వ్యాఖ్యానాత్మకంగా విప్పకుండా నిలుపుతుంది.
- source_word: יֵשׁ וָיֵשׁ
  choice: ఉంది, నిజంగా ఉంది
  rationale: రెండుసార్లు వచ్చే ధృవీకరణ బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పాదసూచికలో అక్షరార్థ పునరుక్తిని సూచించాం.
- source_word: תְּנָה אֶת יָדֶךָ
  choice: నీ చెయ్యి ఇవ్వు
  rationale: చెయ్యి చాపి అంగీకారం లేదా సహకారం చూపే హీబ్రూ నుడికారాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּתֵּן יָדוֹ
  choice: అతడు తన చెయ్యి ఇచ్చినప్పుడు
  rationale: యెహూ ఆజ్ఞకు యెహోనాదాబు ఇచ్చిన ప్రత్యక్ష ప్రతిస్పందనను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל הַמֶּרְכָּבָה
  choice: యెహూ అతణ్ణి తన దగ్గరికి రథంలోకి ఎక్కించుకున్నాడు
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి ఎక్కించు’ భావాన్నీ, אֵלָיוలోని ‘తన దగ్గరికి’ భావాన్నీ నిలుపుతూ కర్తను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘హృదయం యథార్థంగా ఉండడం’ యొక్క భావపరిధి
  choice: హృదయ రూపకాన్ని నిలుపుతూ పరస్పర నిబద్ధతను సూచించే వాక్య నిర్మాణం
  alternative: ‘మన ఉద్దేశాలు ఒక్కటేనా?’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: మూలంలోని నైతిక సూటితనం, సంబంధపరమైన విశ్వాస్యత, ఉద్దేశాల ఐక్యత అన్నీ సాధ్యమైనందున ఒకే వివరణకు పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘హృదయం’ అనే మూల రూపకాన్ని నిలిపి, అర్థాన్ని అతిగా సిద్ధాంతీకరించలేదు. పేర్లను ‘యెహూ, యెహోనాదాబు, రేకాబు’గా లిప్యంతరీకరించాం; ప్రతి పాదసూచిక గుర్తును సంబంధిత ప్రధాన వాక్యంలో ఉంచాం.
