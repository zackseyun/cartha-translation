source:
  edition: WLC
  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: te
  text: “ఇప్పుడు బయలు ప్రవక్తలందరినీ, అతని ఆరాధకులందరినీ, అతని యాజకులందరినీ నా దగ్గరికి పిలిపించండి. ఒక్క మనిషీ గైర్హాజరు కాకూడదు[a], ఎందుకంటే నేను బయలుకు గొప్ప బలి అర్పించబోతున్నాను. గైర్హాజరైనవాడు బ్రతకడు.” అయితే బయలు ఆరాధకులను నాశనం చేయడానికి యెహూ ఈ పని మోసంతో చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరూ గైర్హాజరు కాకూడదు.” హీబ్రూలో “ఒక్క మనిషీ గైర్హాజరు కాకూడదు” అని, ఏకవచన పురుష రూపాన్ని సాధారణార్థంలో ఉపయోగించారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కపట యుక్తితో”; “మోసం చేసి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי הַבַּעַל
  choice: బయలు ప్రవక్తలు
  rationale: హీబ్రూ సంయుక్త నామపదాన్ని సహజమైన తెలుగులో చూపుతూ, ఆరాధనా సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עֹבְדָיו
  choice: అతని ఆరాధకులు
  rationale: ఆరాధనా సందర్భంలో עבד అనేది బయలును సేవించే భక్తులను సూచిస్తుంది; ‘సేవకులు’ కంటే ‘ఆరాధకులు’ మతపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּהֲנָיו
  choice: అతని యాజకులు
  rationale: ఆరాధనా అధికారులకు ప్రామాణిక తెలుగు పదం; ఏకవచన పురుష ప్రత్యయం బయలును సూచిస్తుంది.
- source_word: קִרְאוּ אֵלַי
  choice: నా దగ్గరికి పిలిపించండి
  rationale: వ్యక్తులను యెహూ సమక్షానికి రప్పించాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: ఒక్క మనిషి కూడా తప్పిపోకూడదు
  rationale: אִישׁ అనే ఏకవచన పురుష రూపాన్ని నిలుపుతూ, హాజరు లెక్కలో ఎవరూ తప్పిపోకూడదనే פקד భావాన్ని అందిస్తుంది.
- source_word: זֶבַח גָּדוֹל
  choice: గొప్ప బలి
  rationale: బలి సంబంధమైన సాధారణ అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: ఎవరు రాకుండా ఉంటారో వారు బ్రతకరు
  rationale: ఇక్కడ פקד సూచించే గైర్హాజరును సహజమైన తెలుగులో తెలియజేస్తూ, ‘బ్రతకరు’ అనే కఠినమైన బెదిరింపును నిలుపుతుంది.
- source_word: בְעָקְבָּה
  choice: మోసపూరితంగా
  rationale: ఈ పదంలోని మోసం లేదా కపట యుక్తి భావాన్ని కథకుని మూల్యాంకనంగా స్పష్టంగా అందిస్తుంది.
- source_word: לְמַעַן הַאֲבִיד
  choice: నాశనం చేయాలనే ఉద్దేశంతో
  rationale: לְמַעַן తో వచ్చిన ఉద్దేశార్థక వాక్యాన్ని, אבד హిఫీల్‌లోని నాశనం చేయడం అనే బలమైన భావాన్ని నిలుపుతుంది.
- source_word: עֹבְדֵי הַבָּעַל
  choice: బయలు ఆరాధకులు
  rationale: వచనంలోని ముందటి ప్రయోగంతో ఏకరీతిని పాటిస్తూ ఆరాధనా సేవను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యెహూ చర్యపై కథకుని మూల్యాంకనం
  choice: యెహూ ... మోసపూరితంగా ఇలా చేశాడు
  alternative: యెహూ ... యుక్తిగా ఇలా చేశాడు
  rationale: మూలంలోని בְעָקְבָה యెహూ పిలుపు వెనుక మోసాన్ని తెలియజేస్తుంది. దానిని సమర్థించకుండా, కథనంలోని నైతిక ఉద్రిక్తతను నిలుపుతుంది.
- issue: אִישׁ అనే సాధారణార్థక పురుష ఏకవచనం
  choice: ఒక్క మనిషి కూడా తప్పిపోకూడదు
  alternative: ఎవరూ తప్పిపోకూడదు
  rationale: సహజమైన తెలుగుతోపాటు మూలంలోని ఏకవచన పురుష రూపాన్ని కూడా కనిపించేలా ఉంచుతుంది; ప్రత్యామ్నాయం భావాన్ని ఇస్తున్నప్పటికీ ఆ రూపాన్ని చదును చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథనానికి తగిన గంభీరతతో రూపొందించబడింది. బయలు అనే పేరుకు తెలుగులో సుపరిచితమైన రూపం వాడబడింది. ప్రత్యక్ష వాక్యంలోని ఆజ్ఞ, బెదిరింపు మరియు కథకుని మోసపు మూల్యాంకనం స్పష్టంగా నిలుపబడ్డాయి.
