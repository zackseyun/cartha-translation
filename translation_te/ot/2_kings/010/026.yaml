translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మందిరం’ ద్వారా ఆరాధనా స్థల భావం, ‘పూజా స్తంభాలు’ ద్వారా cultic function స్పష్టమవుతాయి. మూలంలోని ఏకవచన కర్మ ప్రత్యయం–బహువచన పూర్వపదం మధ్య ఉద్రిక్తతను పాదటీపులో నిలిపాం.
