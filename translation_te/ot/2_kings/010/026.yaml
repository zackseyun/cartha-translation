  yaml_path: translation/ot/2_kings/010/026.yaml
  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: te
  text: అప్పుడు వారు బయలు మందిరంలోని పూజా స్తంభాలను బయటికి తీసుకొచ్చి వాటిని కాల్చివేశారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పూజా స్తంభాలు’ అనే హీబ్రూ పదాన్ని ‘నిలువ రాళ్లు’ లేదా ‘ప్రతిష్ఠిత స్తంభాలు’ అని కూడా అనువదించవచ్చు. ఇవి ఆరాధనతో సంబంధమున్న రాతి స్తంభాలు.
    reason: lexical_alternative
  - marker: b
    text: ‘వాటిని కాల్చివేశారు’ అన్న చోట హీబ్రూ రూపం అక్షరార్థంగా ‘దానిని కాల్చివేశారు’ అని ఉంది; ముందున్న ‘స్తంభాలు’ బహువచనం కావడంతో ఇక్కడ సమూహార్థం ఉద్దేశించబడినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: అప్పుడు వారు ... బయటికి తీసుకొచ్చి
  rationale: יצא ధాతువు హిఫీల్ రూపంలో ‘బయటికి తీసుకురావడం’ అనే అర్థాన్నిస్తుంది. వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: מַצְּבוֹת
  choice: పూజా స్తంభాలను
  rationale: מַצֵּבָה అనేది నిలువబెట్టిన రాయి లేదా ఆరాధనతో సంబంధమున్న స్తంభాన్ని సూచిస్తుంది. బయలు ఆరాధన సందర్భంలో ‘పూజా స్తంభాలు’ సాధారణ పాఠకునికి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తూ, ‘విగ్రహాలు’ అనే అతివిస్తృత అర్థాన్ని నివారిస్తుంది.
- source_word: בֵּית הַבַּעַל
  choice: బయలు మందిరంలోని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; ఆరాధనా సందర్భంలో ‘మందిరం/దేవాలయం’ అని అర్థం. ఆధునిక తెలుగులో ‘బయలు మందిరం’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: וַיִּשְׂרְפוּהָ
  choice: వాటిని కాల్చివేశారు
  rationale: హీబ్రూలో కర్మ ప్రత్యయం ఏకవచన స్త్రీలింగంలో ఉన్నా, ముందున్న מַצְּבוֹת బహువచనం. తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు సమూహార్థాన్ని అనుసరించి ‘వాటిని’ అని అనువదించాం; రూపభేదాన్ని పాదటీపులో తెలిపాం.
