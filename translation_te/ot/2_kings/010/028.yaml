source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: te
  text: ఈ విధంగా యెహూ ఇశ్రాయేలు నుండి బయలును నిర్మూలించాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాశనం చేశాడు,’ ‘తుడిచిపెట్టాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ నాశనం చేయడం లేదా తొలగించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆ బయలు’ అని ఉంది. తెలుగులో దేవత పేరుతో నిర్దేశక పదాన్ని సాధారణంగా ఉపయోగించరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: నిర్మూలించాడు
  rationale: שׁמד ధాతువు హిఫీల్ రూపంలో నాశనం కలిగించడం లేదా తొలగించడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నిర్మూలించాడు’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భం చెప్పేదానికంటే మించి ప్రత్యేకంగా ఆరాధనను చేర్చి చెప్పదు.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సాధారణంగా ఉపయోగించే లిప్యంతరీకరణ.
- source_word: הַבַּעַל
  choice: బయలును
  rationale: ఇది దేవత పేరును కర్మవిభక్తితో నేరుగా అనువదిస్తుంది. ‘బయలు ఆరాధనను’ అని విస్తరించడం సందర్భానుగుణమైన భావమైనా, మూలపాఠంలోని పదానికి మించిన వివరణ అవుతుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలు నుండి
  rationale: מִן విభజన లేదా తొలగింపును సూచిస్తుంది. ‘నుండి’ అనే రూపం బయలును ఇశ్రాయేలు నుండి తొలగించిన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַ
  choice: ఈ విధంగా
  rationale: క్రియకు ముందున్న waw కథనాన్ని ముందుకు నడిపిస్తూ, ముందు జరిగిన చర్యల ఫలితాన్ని ఇక్కడ సంగ్రహిస్తుంది. ‘ఈ విధంగా’ ఆ సందర్భ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘బయలు’ అనే పదం దేనిని సూచిస్తుంది?
  choice: దేవత/దాని మతవ్యవస్థను సూచించే ‘బయలు’ అనే పేరును యథాతథంగా ఉంచడం.
  alternative: ‘బయలు ఆరాధన’ లేదా ‘బయలు పూజ’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ పాఠంలో కర్మపదం ‘ఆ బయలు’ మాత్రమే. సందర్భం బయలు ఆరాధన వ్యవస్థ నిర్మూలనను సూచించినప్పటికీ, అనువాదంలో వివరణాత్మక పదాలను చేర్చకుండా మూలంలోని సంక్షిప్తతను, భావ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నిర్మూలించాడు’ మూలక్రియ బలాన్ని నిలుపుతుంది; ‘బయలు ఆరాధన’ అనే వ్యాఖ్యాత్మక విస్తరణను నివారించింది. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
