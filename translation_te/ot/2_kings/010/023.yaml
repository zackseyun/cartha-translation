source:
  edition: WLC
  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: te
  text: అప్పుడు యెహూ, రేకాబు కుమారుడైన యెహోనాదాబు బయలు గృహంలోకి[a] ప్రవేశించారు. అతడు బయలు ఆరాధకులతో, “మీ మధ్య యెహోవా సేవకుల్లో ఎవరైనా ఉన్నారేమో జాగ్రత్తగా వెదికి చూడండి; ఇక్కడ బయలు ఆరాధకులు మాత్రమే ఉండాలి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బయలు ఆలయంలోకి.” హీబ్రూలో అక్షరార్థంగా “బయలు గృహంలోకి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ప్రవేశించారు
  rationale: గమ్యస్థానం ఒక భవనం కావడంతో, בוא అనే క్రియ ఇక్కడ లోపలికి వెళ్లడాన్ని సూచిస్తుంది. సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచనం వాడబడింది.
- source_word: בֵּית הַבָּעַל
  choice: బయలు గృహం
  rationale: హీబ్రూ పదబంధంలోని ‘బయలు గృహం’ అనే రూపాన్ని నిలుపుతూ, అది ఆరాధనా స్థలమని పాదటిప్పణిలో స్పష్టం చేయబడింది.
- source_word: עֹבְדֵי הַבַּעַל
  choice: బయలు ఆరాధకులు
  rationale: עבד పదానికి ‘సేవకులు’ అనే అర్థం ఉన్నా, ఈ ఆరాధనా సందర్భంలో బయలును పూజించేవారనే భావం సహజంగా, స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: జాగ్రత్తగా వెదికి చూడండి
  rationale: రెండు ఆజ్ఞలలోని వెదకడం, నిర్ధారించుకోవడం అనే సంయుక్త భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: మీ మధ్య ... ఎవరైనా ఉన్నారేమో
  rationale: פֶּן తెలిపే అప్రమత్తత లేదా అవాంఛిత అవకాశం అనే భావాన్ని ‘ఉన్నారేమో’ సహజంగా నిలుపుతుంది.
- source_word: מֵעַבְדֵי יְהוָה
  choice: యెహోవా సేవకుల్లో ఎవరైనా
  rationale: హీబ్రూలోని విభాగార్థక బహువచనాన్ని తెలుగులో స్పష్టంగా చూపి, עבד యొక్క సాధారణ ‘సేవకుడు’ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించబడే సాంప్రదాయ రూపంలో అందిస్తుంది; దీనిని సాధారణ బిరుదుగా మార్చదు.
- source_word: כִּי אִם ... לְבַדָּם
  choice: మాత్రమే ఉండాలి
  rationale: ముందటి జాగ్రత్త ఆజ్ఞతో కలిసిన సంపూర్ణ మినహాయింపు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యహ్వే
  rationale: ఈ వాక్యంలో యెహోవాకు విధేయులైనవారిని బయలు ఆరాధకుల నుండి వేరు చేస్తున్నారు. వ్యక్తిగత దైవనామ స్వభావాన్ని స్పష్టంగా ఉంచేందుకు తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపం ఎంచుకోబడింది.
- issue: עבד పదాన్ని రెండు సందర్భాల్లో ఒకేలా అనువదించాలా
  choice: బయలు విషయంలో ‘ఆరాధకులు’; యెహోవా విషయంలో ‘సేవకులు’
  alternative: రెండింటికీ ‘సేవకులు’
  rationale: ఒకే హీబ్రూ మూలపదం ఉన్నప్పటికీ, బయలు గృహంలో కూడినవారి మతాచరణను ‘ఆరాధకులు’ స్పష్టం చేస్తుంది; ‘యెహోవా సేవకులు’ మాత్రం స్థిరమైన విధేయతా సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన కథన శైలి. హీబ్రూలోని ఏకవచన ‘అతడు అన్నాడు’ నిలుపబడింది; అది సందర్భంలో యెహూను సూచించే అవకాశమున్నా, పేరును చేర్చి అస్పష్టతను తొలగించలేదు.
