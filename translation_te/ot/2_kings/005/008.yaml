id: 2KI.5.8
reference: 2 Kings 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: te
  text: 'దేవుని మనిషైన ఎలీషా, ఇశ్రాయేలు రాజు తన బట్టలు చింపుకున్నాడని[a] విన్నప్పుడు, రాజుకు ఇలా కబురు పంపాడు: “నీవు నీ బట్టలు ఎందుకు చింపుకున్నావు? దయచేసి అతన్ని నా దగ్గరికి రానివ్వు[b]. అప్పుడు ఇశ్రాయేలులో ఒక ప్రవక్త ఉన్నాడని అతడు తెలుసుకుంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బట్టలు చింపుకోవడం దుఃఖం, తీవ్రమైన కలవరం లేదా వేదనకు సూచనగా ఉన్న ఆచారం.
    reason: cultural_explanation
  - marker: b
    text: “అతన్ని” అనేది ఇశ్రాయేలు రాజును కాదు, నయమానును సూచిస్తుంది.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సూత్రాన్ని ఆధునిక తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అందించింది; మూలంలో లేని ‘ఇప్పుడు’ వంటి పదాన్ని చేర్చలేదు.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది కేవలం భక్తిని వర్ణించే మాట కాక, ప్రవక్తకు వాడే గుర్తింపు బిరుదు; మూలంలోని రూపాన్నీ భావాన్నీ నిలుపుతుంది.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: తన బట్టలు చింపుకున్నాడు
  rationale: కָרַע అంటే చింపడం. ‘బట్టలు’ ఆధునిక పాఠకులకు సహజంగా ఉండి, దుఃఖం లేదా కలవరానికి సూచనగా వస్త్రాలను చింపుకునే చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: రాజుకు ఇలా కబురు పంపాడు
  rationale: మూలంలోని ‘రాజు దగ్గరికి పంపి, ఇలా అన్నాడు’ అనే భావాన్ని, మూలంలో లేని ‘దూత’ను ప్రత్యేకంగా చేర్చకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: לָמָּה קָרַעְתָּ בְגָדֶיךָ
  choice: నీవు నీ బట్టలు ఎందుకు చింపుకున్నావు?
  rationale: ప్రత్యక్ష ప్రశ్నను, సంబోధితుడు రాజేననే విషయాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: יָבֹא נָא אֵלַי
  choice: దయచేసి అతన్ని నా దగ్గరికి రానివ్వు
  rationale: మూడవ పురుష ఏకవచన క్రియను ‘అతన్ని ... రానివ్వు’గా నిలిపి, נָא లోని విజ్ఞప్తి భావాన్ని ‘దయచేసి’తో వ్యక్తం చేసింది.
- source_word: וְיֵדַע
  choice: అప్పుడు ... అతడు తెలుసుకుంటాడు
  rationale: క్రియలోని ఆశించబడిన ఫలితాన్ని సహజ తెలుగులో తెలిపింది; దానిని ఉద్దేశార్థంగా అతిగా నిర్దేశించలేదు.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో ఒక ప్రవక్త ఉన్నాడని
  rationale: יֵשׁ తెలిపే అస్తిత్వ భావాన్ని నేరుగా నిలుపుతూ, ఇశ్రాయేలులో దేవుని ప్రవక్త నిజంగా ఉన్నాడనే వాక్య బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే ప్రవచన బిరుదు
  choice: దేవుని మనిషి
  alternative: దైవభక్తుడు; దేవునికి చెందిన మనిషి
  rationale: ఈ పదబంధం ఎలీషా భక్తిని మాత్రమే వర్ణించదు; దేవుని ప్రవక్తగా ఆయన పాత్రను సూచించే స్థిర బిరుదుగా పనిచేస్తుంది. అందువల్ల రూపాన్నీ ప్రవచన సంబంధమైన బలాన్నీ కాపాడే అనువాదాన్ని ఎంచుకున్నాం.
- issue: ‘అతడు’ ఎవరిని సూచిస్తున్నాడనే విషయం
  choice: నయమానును సూచించే మూడవ పురుష రూపాన్ని ప్రధాన వాక్యంలో నిలుపడం
  alternative: రాజునే రమ్మని చెప్పినట్లు అనువదించడం
  rationale: יָבֹא మరియు וְיֵדַע రెండూ మూడవ పురుష ఏకవచన రూపాలు. సందర్భంలో అవి నయమానును సూచిస్తాయి; రాజును సూచించేలా మార్చడం మూల వాక్య నిర్మాణాన్ని తప్పుగా పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కబురు పంపాడు’ సహజమైన ప్రయోగం; ‘దేవుని మనిషి’ అనే బిరుదు మూలంలోని ప్రవచన సంబంధమైన భావాన్ని కాపాడుతుంది. ఇంగ్లీషు సంప్రదింపు పాఠంలో [a] గుర్తు ఎలీషా పేరుకు ఆనించి ఉన్నప్పటికీ, ఆ పాదసూచిక విషయం బట్టలు చింపుకోవడం గురించినందున తెలుగులో సంబంధిత పదబంధం వద్ద ఉంచబడింది.
