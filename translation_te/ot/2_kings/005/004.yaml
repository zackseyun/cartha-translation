- from: 'అప్పుడు అతడు వెళ్లి తన యజమానికి ఇలా తెలియజేశాడు: “ఇశ్రాయేలు దేశం నుండి వచ్చిన ఆ బాలిక ఇలా ఇలా[a] చెప్పింది.”'
  to: 'అప్పుడు అతడు వెళ్లి తన ప్రభువుకు ఇలా చెప్పాడు: “ఇశ్రాయేలు దేశం నుండి వచ్చిన ఆ బాలిక ఇలా అని అలా అని[a] చెప్పింది.”'
