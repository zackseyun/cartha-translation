  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֕א וַ/יַּגֵּ֥ד לַ/אדֹנָ֖י/ו לֵ/אמֹ֑ר כָּ/זֹ֤את וְ/כָ/זֹאת֙ דִּבְּרָ֣ה הַֽ/נַּעֲרָ֔ה אֲשֶׁ֖ר מֵ/אֶ֥רֶץ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/004.yaml
  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: te
  text: 'అప్పుడు అతడు వెళ్లి తన ప్రభువుకు ఇలా చెప్పాడు: “ఇశ్రాయేలు దేశం నుండి వచ్చిన ఆ బాలిక ఇలా అని అలా అని[a] చెప్పింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇలా అని అలా అని” అనేది ఆమె చెప్పిన మాటలను యథాతథంగా తిరిగి చెప్పకుండా వాటి సారాన్ని సూచించే హీబ్రూ నుడికారం; “అటువంటి మాటలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అతడు వెళ్లి
  rationale: בוא అనే క్రియ సందర్భాన్ని బట్టి ‘వచ్చు,’ ‘వెళ్లు,’ లేదా ‘లోపలికి ప్రవేశించు’ అనే అర్థాలు ఇస్తుంది. తన యజమానికి నివేదించడానికి వెళ్లిన కథన క్రమాన్ని సహజంగా తెలుపుతుంది.
- source_word: וַיַּגֵּד לַאדֹנָיו
  choice: తన యజమానికి ఇలా తెలియజేశాడు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయు/నివేదించు’ అని అర్థం; אָדוֹן ఇక్కడ అధికారి లేదా యజమానిని సూచిస్తుంది. ‘యజమాని’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ఇలా ఇలా
  rationale: చెప్పిన మాటలను యథాతథంగా మళ్లీ పలకకుండా వాటి సారాన్ని సూచించే హీబ్రూ నుడికారం. ‘ఇలా ఇలా’ దాని పునరుక్తి రూపాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: הַנַּעֲרָה
  choice: ఆ బాలిక
  rationale: נַעֲרָה అంటే బాలిక లేదా యువతి. ఈ వాక్యంలో సేవకురాలి స్థితి పదంలోనే స్పష్టంగా లేకపోవడంతో దానిని అదనంగా చేర్చలేదు.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశం నుండి వచ్చిన
  rationale: సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగులో విశేషణ పదబంధంగా ఇచ్చి, אֶרֶץ లోని ‘దేశం’ భావాన్ని నిలుపుకుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని పురుష ఏకవచన కర్తను ‘అతడు’గా ఉంచి, సందర్భం ఆధారంగా అతని గుర్తింపును అనువాదంలో అదనంగా నిర్ధారించలేదు.
