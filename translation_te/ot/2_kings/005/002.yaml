id: 2KI.5.2
reference: 2 Kings 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲרָם֙ יָצְא֣וּ גְדוּדִ֔ים וַ/יִּשְׁבּ֛וּ מֵ/אֶ֥רֶץ יִשְׂרָאֵ֖ל נַעֲרָ֣ה קְטַנָּ֑ה וַ/תְּהִ֕י לִ/פְנֵ֖י אֵ֥שֶׁת נַעֲמָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: te
  text: అరామీయుల దోపిడీ దళాలు బయలుదేరి, ఇశ్రాయేలు దేశం నుండి ఒక చిన్న బాలికను[a] చెరగా పట్టుకున్నాయి. ఆమె నయమాను భార్యకు పరిచర్య చేసేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక పసిబాలిక.’ נַעֲרָה קְטַנָּה అనే హీబ్రూ పదబంధం ఆమె బాల్యాన్ని, చిన్నతనాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆమె నయమాను భార్య ఎదుట ఉండేది’; అంటే, ఆమె దగ్గర ఉండి పరిచర్య చేసేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: అరామీయుల దోపిడీ దళాలు
  rationale: ‘అరాము’ అనే దేశనామంతో ఉన్న బహువచన క్రియ మానవ సైనిక బృందాలను సూచిస్తుంది. גְדוּדִים అనేది దాడులు చేసే సైనిక దళాలు లేదా గుంపులు; సందర్భంలోని చెరపట్టడాన్ని బట్టి ‘దోపిడీ దళాలు’ సహజంగా భావాన్ని తెలియజేస్తుంది.
- source_word: יָצְאוּ
  choice: బయలుదేరి
  rationale: ఈ సంపూర్ణ క్రియ తరువాతి కథనక్రియకు నేపథ్యంగా ముందుగా జరిగిన చర్యను సూచిస్తుంది; తెలుగులో క్రియావిశేషణ రూపం కథన క్రమాన్ని సహజంగా కలుపుతుంది.
- source_word: וַיִּשְׁבּוּ
  choice: చెరపట్టుకొని వచ్చాయి
  rationale: ఈ క్రియ కేవలం పట్టుకోవడం కాకుండా బందీగా తీసుకుపోవడాన్ని సూచిస్తుంది. ‘చెరపట్టుకొని వచ్చాయి’ ఆ భావాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశం నుండి
  rationale: మూలంలోని ‘ఇశ్రాయేలు దేశం నుండి’ అనే భౌగోళిక వ్యక్తీకరణను స్పష్టంగా నిలుపుతుంది.
- source_word: נַעֲרָה קְטַנָּה
  choice: ఒక చిన్న బాలిక
  rationale: ఈ పదబంధం ఆమె బాల్యాన్ని, చిన్నతనాన్ని నొక్కిచెబుతుంది. సేవకురాలు అనే హోదాను మూలపదబంధంలోకి ముందుగానే చేర్చకుండా ‘చిన్న బాలిక’ అని అనువదించబడింది.
- source_word: וַתְּהִי לִפְנֵי
  choice: పరిచర్య చేసేది
  rationale: అక్షరార్థంగా ‘ఎదుట ఉండేది’ అనే ఈ నుడికారం ఒకరి సమక్షంలో ఉండి వారికి సేవ చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పరిచర్య చేసేది’ ఆ కార్యార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֵשֶׁת נַעֲמָן
  choice: నయమాను భార్యకు
  rationale: మూలంలోని సంబంధాన్ని సహజమైన తెలుగు విభక్తి నిర్మాణంతో వ్యక్తం చేస్తుంది.
