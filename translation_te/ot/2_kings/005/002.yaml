translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దోపిడీ దళాలు,’ ‘చెరపట్టుకొని,’ ‘పరిచర్య’ అనే పదాలు సైనిక, సామాజిక సందర్భాలను స్పష్టంగా ఉంచుతాయి. మూలంలోని נַעֲרָה קְטַנָּה మరియు לִפְנֵי పదబంధాల సూక్ష్మతలను పాదసూచికల్లో నిలుపుకున్నాం.
