  to: '“ఈ విషయంలో యహ్వే నీ సేవకుణ్ణి క్షమించుగాక: నా యజమాని రిమ్మోను మందిరంలో[b] సాగిలపడడానికి[a] అక్కడ ప్రవేశించినప్పుడు, అతడు నా చేతిమీద ఆనుకొని ఉంటాడు; అప్పుడు నేనూ రిమ్మోను మందిరంలో సాగిలపడతాను. నేను రిమ్మోను మందిరంలో సాగిలపడినప్పుడు, ఈ విషయంలో యహ్వే దయచేసి నీ సేవకుణ్ణి క్షమించుగాక.”'
  rationale: The revision removes the unsupported restrictive word “ఒక్క,” renders the support gesture with a Telugu locative construction matching the Hebrew, and makes the temporal-purpose clause more fluent. It otherwise preserves the source's repetition, request/jussive force, divine name, and unresolved distinction between bowing and worship.
