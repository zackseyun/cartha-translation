source:
  edition: WLC
  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: te
  text: '“ఈ విషయంలో యహ్వే నీ సేవకుణ్ణి క్షమించుగాక: నా యజమాని రిమ్మోను మందిరంలో[b] సాగిలపడడానికి[a] అక్కడ ప్రవేశించినప్పుడు, అతడు నా చేతిమీద ఆనుకొని ఉంటాడు; అప్పుడు నేనూ రిమ్మోను మందిరంలో సాగిలపడతాను. నేను రిమ్మోను మందిరంలో సాగిలపడినప్పుడు, ఈ విషయంలో యహ్వే దయచేసి నీ సేవకుణ్ణి క్షమించుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరాధించడానికి.” హీబ్రూ క్రియ శరీరంతో సాగిలపడడాన్నీ ఆరాధించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “రిమ్మోను మందిరం” అంటే సిరియనుల దేవుడైన రిమ్మోను దేవాలయం లేదా పూజాస్థలం.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: క్షమించుగాక
  rationale: ఈ క్రియ ఇక్కడ విన్నపాన్ని తెలిపే జస్సివ్ భావంలో ఉంది; ‘క్షమించుగాక’ దైవక్షమాపణ కోసం చేసే వినతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువాదంగా ఉంచుతుంది.
- source_word: לְעַבְדֶּךָ
  choice: నీ సేవకుణ్ణి
  rationale: నయమాను తనను వినయపూర్వకంగా సూచించే రాజాస్థాన సంబంధమైన ప్రయోగానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: בְּבוֹא אֲדֹנִי
  choice: నా యజమాని ... ప్రవేశించినప్పుడు
  rationale: ב తో కూడిన క్రియానామం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ‘యజమాని’ అనేది నయమాను సేవించే రాజును దేవునికి వాడే బిరుదుతో కలవరపరచదు.
- source_word: בֵית רִמּוֹן
  choice: రిమ్మోను మందిరం
  rationale: అక్షరార్థంగా ‘రిమ్మోను ఇల్లు’; సందర్భంలో అది దేవాలయం లేదా పూజాస్థలం కావడంతో ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: సాగిలపడడానికి
  rationale: ఈ క్రియ శరీరంతో వంగి నమస్కరించడాన్నీ ఆరాధించడాన్నీ సూచించగలదు. ‘సాగిలపడడం’ నయమాను అంతరంగ ఉద్దేశాన్ని ముందే నిర్ణయించకుండా బాహ్య చర్యను నిలుపుతుంది.
- source_word: נִשְׁעָן עַל יָדִי
  choice: అతడు నా చేతిని ఆనుకొని ఉంటాడు
  rationale: ‘చేయి మీద ఆనుకోవడం’ అనే మూలభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, నయమాను రాజుకు ఆసరాగా ఉండే దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: అప్పుడు నేనూ ... సాగిలపడతాను
  rationale: తన యజమానికి ఆసరా ఇస్తున్నప్పుడు నయమాను కూడా అదే శారీరక చర్యలో పాల్గొనే పరిస్థితిని ‘నేనూ’ స్పష్టం చేస్తుంది; బలవంతం అనే భావాన్ని అదనంగా చేర్చదు.
- source_word: בְּהִשְׁתַּחֲוָיָתִי
  choice: నేను ... సాగిలపడినప్పుడు
  rationale: ב తో కూడిన క్రియానామం ముందే చెప్పిన చర్యను మళ్లీ ప్రస్తావించి నొక్కిచెబుతుంది; మూలంలోని పునరుక్తిని అనువాదంలో నిలిపింది.
- source_word: נָא
  choice: దయచేసి
  rationale: విన్నపాన్ని మర్యాదగా బలపరిచే ఈ కణానికి ఆధునిక తెలుగులో సహజమైన సమానం.
theological_decisions:
- issue: అన్యదేవుని మందిర సందర్భంలో הִשְׁתַּחֲוָה ను ‘ఆరాధించడం’గా అనువదించాలా, లేక శారీరకంగా వంగడాన్ని సూచించే పదంతో అనువదించాలా
  choice: సాగిలపడడం
  alternative: ఆరాధించడం; సాష్టాంగపడడం
  rationale: హీబ్రూ క్రియ ఆరాధనను గానీ శరీరంతో వంగి నమస్కరించడాన్ని గానీ సూచించగలదు. ఇక్కడ ‘సాగిలపడడం’ నయమాను చేసిన బాహ్య చర్యను స్పష్టంగా ఉంచుతూ, అతని అంతరంగ విశ్వాసం గురించి పాఠ్యం చెప్పినదానికంటే ఎక్కువగా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని ‘రిమ్మోను మందిరం’ మరియు ‘సాగిలపడడం’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ‘వలసి వస్తుంది’ వంటి బలవంతాన్ని సూచించే మాటలను చేర్చకుండా, పాఠ్యంలో ఉన్న నైతిక-దైవశాస్త్ర ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
