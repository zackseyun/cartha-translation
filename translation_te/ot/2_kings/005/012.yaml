id: 2KI.5.12
reference: 2 Kings 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: te
  text: “దమస్కు నదులైన అబానా[a], పర్పరు ఇశ్రాయేలు జలాలన్నిటికంటే మేలైనవి కావా? నేను వాటిలో స్నానం చేసి శుద్ధుడిని[b] కాలేనా?” అని అతడు వెనుదిరిగి, కోపావేశంతో వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సంప్రదాయ పాఠరూపాల ప్రకారం “అమానా.”
    reason: alternative_reading
  - marker: b
    text: లేదా “శుభ్రపడలేనా?”, “శుద్ధి పొందలేనా?”; హీబ్రూ పదం శారీరకంగా శుభ్రం కావడాన్నీ, విస్తృతమైన శుద్ధత భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కావా? / కాలేనా?
  rationale: సమ్మతిని ఆశించే రెండు అలంకారిక ప్రశ్నలను సహజమైన ఆధునిక తెలుగు ప్రశ్నారూపాలతో వ్యక్తం చేస్తుంది.
- source_word: טוֹב ... מִכֹּל
  choice: అన్నిటికంటే మేలైనవి
  rationale: మִן‌తో కూడిన తులనాత్మక నిర్మాణాన్ని స్పష్టంగా చూపిస్తూ, నదులు అనే బహువచనానికి అనుగుణంగా ఉంది.
- source_word: אבנה וּפַרְפַּר
  choice: అబానా, పర్పరు
  rationale: మసొరేటిక్ హీబ్రూ భౌగోళిక నామాలను తెలుగులో సమీప ధ్వనులతో లిప్యంతరీకరించింది; అబానాకు ఉన్న ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: దమస్కు నదులు
  rationale: హీబ్రూ సంయుక్త నామవాచక నిర్మాణంలోని సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు జలాలన్నిటికంటే
  rationale: హీబ్రూలోని విస్తృతార్థక ‘జలాలు’ అనే భావాన్నీ, ‘అన్నిటి’ అనే సమగ్ర వ్యక్తీకరణనూ నిలుపుతుంది.
- source_word: אֶרְחַץ
  choice: స్నానం చేసి
  rationale: ఈ సందర్భంలో నదిలో శరీరాన్ని కడుక్కోవడం లేదా స్నానం చేయడం అనే భావాన్ని సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: וְטָהָרְתִּי
  choice: శుద్ధుడిని కాలేనా
  rationale: శారీరక స్వస్థతతోపాటు శుద్ధతకు సంబంధించిన విస్తృత సూచనను పూర్తిగా ఒకే భావానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: వెనుదిరిగి ... వెళ్లిపోయాడు
  rationale: వరుసగా ఉన్న తిరగడం, వెళ్లిపోవడం అనే రెండు క్రియలనూ సహజమైన తెలుగు కథనంలో నిలుపుతుంది.
- source_word: בְּחֵמָה
  choice: కోపావేశంతో
  rationale: సాధారణ ‘కోపం’ కంటే తీవ్రమైన ఆగ్రహాన్ని సూచించే חֵמָה బలాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శుద్ధతను సూచించే భాష స్వభావం
  choice: శుద్ధుడిని
  alternative: శుభ్రపడడం / శుద్ధి పొందడం
  rationale: నయమాను చర్మవ్యాధి సందర్భంలో శారీరకంగా శుభ్రం లేదా స్వస్థం కావడం ప్రధానంగా ఉన్నప్పటికీ, హీబ్రూ טהר శుద్ధతకు సంబంధించిన విస్తృత భావాన్ని కూడా మోయగలదు. ‘శుద్ధుడిని’ ఆ భావవ్యాప్తిని నిలుపుతూ, ప్రత్యేక ఆచార లేదా సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. అలంకారిక ప్రశ్నల తీవ్రతను, నయమాను ఆగ్రహాన్ని సహజంగా నిలుపుతూ, భౌగోళిక నామాలను మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించాం.
