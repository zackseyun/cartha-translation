source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל גְּבִרְתָּ֔/הּ אַחֲלֵ֣י אֲדֹנִ֔/י לִ/פְנֵ֥י הַ/נָּבִ֖יא אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן אָ֛ז יֶאֱסֹ֥ף אֹת֖/וֹ מִ/צָּרַעְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: te
  text: ఆమె తన యజమానురాలితో, “నా యజమాని సమారయలో ఉన్న ప్రవక్త సన్నిధిలో ఉంటే ఎంత బాగుండేది! అప్పుడు ఆయన ఇతని కుష్ఠరోగాన్ని[a] నయం చేసేవాడు” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “కుష్ఠరోగం” అని అనువదించిన హీబ్రూ పదం צָרַעַת (త్సారాత్). ఇది ఆధునిక హాన్సెన్ వ్యాధినే కాక, మరింత విస్తృతంగా తీవ్రమైన చర్మవ్యాధిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: తన యజమానురాలితో
  rationale: ఇంటి పరిధిలో తనకంటే ఉన్నత స్థానంలో ఉన్న స్త్రీని సూచిస్తుంది; ఆధునిక తెలుగులో ‘యజమానురాలు’ సామాజిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲלֵי
  choice: ఎంత బాగుండేది!
  rationale: కోరికను, ఆకాంక్షను వ్యక్తపరిచే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు ఆశార్థక వాక్యంగా అందిస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: బాలిక నయమానును గౌరవంగా సూచిస్తోంది; స్వామ్యరూపాన్ని, సామాజిక సంబంధాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో ఉంటే
  rationale: అక్షరార్థంగా ‘ముందు’ అయినా, ఇక్కడ ఒకరి సమక్షంలో ఉండడమనే హీబ్రూ నుడికార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַנָּבִיא
  choice: ప్రవక్త
  rationale: మూలంలో పేరు కాకుండా బిరుదే ఉంది; దానినే నిలుపుతుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: సమారయలో
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: יֶאֱסֹף
  choice: నయం చేసేవాడు
  rationale: אסף యొక్క ప్రాథమిక భావం ‘చేర్చుకొను/తీసివేయు’; వ్యాధి సందర్భంలో వ్యాధిని తొలగించి కోలుకునేలా చేయడం అనే నుడికారార్థం ఉంది. తెలుగులో అక్షరానువాదం అసహజంగా, అర్థభ్రంశకరంగా ఉండేందున సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
- source_word: מִצָּרַעְתּוֹ
  choice: ఇతని కుష్ఠరోగాన్ని
  rationale: צָרַעַתకు సంప్రదాయ, సులభంగా గుర్తించదగిన అనువాదం; ఇది ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం కాదనే విస్తృతార్థాన్ని పాదసూచిక వివరిస్తుంది.
