id: 2KI.5.20
reference: 2 Kings 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: te
  text: 'అయితే దైవజనుడైన ఎలీషాకు సేవకుడైన గేహజీ ఇలా అన్నాడు: “ఇదిగో, నయమాను అనే ఈ అరామీయుణ్ణి, అతడు తెచ్చిన దానిని అతని చేతిలోనుండి తీసుకోకుండా, నా యజమాని విడిచిపెట్టాడు. యాహ్వే జీవముతోడు, నేను అతని వెంట పరుగెత్తి అతని దగ్గర ఏదో ఒకటి తీసుకుంటాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: సేవకుడు
  rationale: ఇక్కడ వయస్సుకన్నా ఎలీషా కింద గేహజీ నిర్వహించిన సేవకుని పాత్రే ప్రధానంగా ఉంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుడు
  rationale: ప్రవక్తకు వాడే స్థిరమైన బిరుదును సహజమైన, గౌరవప్రదమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: గేహజీ మాటలోని ఆకస్మిక దృష్టి ఆకర్షణను, ఉద్ఘాటనను నిలుపుతుంది.
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: తీసుకోకుండా అతణ్ణి వదిలేశాడు
  rationale: ఎలీషా కానుకను స్వీకరించకుండా నయమానును చెల్లింపు నుంచి విడిచిపెట్టాడనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָאֲרַמִּי
  choice: అరామీయుడు
  rationale: హెబ్రీ జాతి-భౌగోళిక పదాన్ని కాలభ్రంశం లేకుండా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: מִיָּדוֹ
  choice: అతని చేతిలోనుంచి
  rationale: ఇచ్చే వ్యక్తి చేతినుంచి స్వీకరించడాన్ని తెలిపే మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: ఇది ప్రమాణ సూత్రమని తెలుగులో స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తూ దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: רַצְתִּי אַחֲרָיו
  choice: నేను అతని వెనుక పరుగెత్తి
  rationale: గేహజీ వెంటనే వెంబడించాలనే ఉద్దేశాన్ని సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: מְאוּמָה
  choice: ఏదో ఒకటి
  rationale: ఈ సందర్భంలో గేహజీ నయమాను నుంచి ఏదైనా కానుక పొందాలనుకున్న భావానికి సరిపోతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. గేహజీ మాటలోని నిందారోపణ ధోరణి నిలిచేలా ‘ఈ అరామీయుడైన నయమాను’ అనే నిర్మాణం ఉంచబడింది; అతడు తనలో తాను అన్నాడని మూలంలో స్పష్టంగా లేనందున ఆ భావాన్ని చేర్చలేదు.
