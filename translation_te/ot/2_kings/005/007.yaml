source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: te
  text: ఇశ్రాయేలు రాజు ఆ ఉత్తరం చదివినప్పుడు, తన బట్టలు చింపుకొని, “చంపడానికీ బతికించడానికీ నేను దేవుణ్ణా? ఒక మనిషిని అతని కుష్ఠు రోగం[a] నుండి స్వస్థపరచమని ఇతడు నన్ను కోరుతూ సందేశం పంపుతున్నాడు! కానీ, దయచేసి గమనించి చూడండి; ఇతడు నాపై ఏదైనా చర్య తీసుకోవడానికి సాకు వెదుకుతున్నాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం తీవ్రమైన చర్మవ్యాధులను విస్తృతంగా సూచించవచ్చు; అది ప్రత్యేకంగా నేటి హాన్సెన్ వ్యాధినే సూచించాల్సిన అవసరం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: ఆ ఉత్తరం
  rationale: మునుపటి సందర్భంలో అరాము రాజు పంపిన లిఖిత సందేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉత్తరం’ సహజంగా ఉంది.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: తన బట్టలు చింపుకొని
  rationale: తీవ్ర ఆందోళనను తెలియజేసే హీబ్రూ ఆచారప్రయోగంలోని చర్యను నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַאֱלֹהִים אָנִי
  choice: నేను దేవుణ్ణా?
  rationale: జీవమరణాలపై దేవునికే ఉన్న అధికారంతో రాజు తనను పోల్చుకునే అలంకార ప్రశ్నను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: చంపడానికీ బతికించడానికీ
  rationale: మూలంలోని సమాంతర క్రియాజోడును సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: שֹׁלֵחַ אֵלַי
  choice: నాకు కబురు పంపుతున్నాడే
  rationale: ఇప్పటికే ప్రస్తావించిన ఉత్తరం ద్వారా పంపిన సందేశాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది; చివరి ‘-ఏ’ రాజు ఆశ్చర్యం, ఆందోళనలను సూచిస్తుంది.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: ఒక మనిషిని అతని కుష్ఠు రోగం నుండి స్వస్థపరచమని
  rationale: వ్యాధి నుండి తొలగించడం లేదా కోలుకునేలా చేయడం అనే హీబ్రూ ప్రయోగార్థాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: צָּרַעַת
  choice: కుష్ఠు రోగం
  rationale: కథనంలో సుపరిచితమైన సంప్రదాయ పదాన్ని నిలుపుతూ, హీబ్రూ పదానికి ఉన్న విస్తృత అర్థపరిధిని పాదసూచికలో తెలియజేస్తుంది.
- source_word: אַךְ דְּעוּ נָא וּרְאוּ
  choice: దయచేసి గమనించి చూడండి
  rationale: రెండు ఆజ్ఞార్థక క్రియల పిలుపును సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: מִתְאַנֶּה הוּא לִי
  choice: ఇతడు నాతో తగాదా పెట్టుకోవడానికి సాకు వెదుకుతున్నాడు
  rationale: విరోధానికి సందర్భం, సాకు లేదా నెపం వెదకడం అనే అరుదైన హీబ్రూ క్రియలోని భావాన్ని సహజంగా వ్యక్తం చేస్తూ దాని ఉద్దేశపూర్వకతను నిలుపుతుంది.
theological_decisions:
- issue: הָאֱלֹהִים అనే పదాన్ని రాజు వేసిన అలంకార ప్రశ్నలో అనువదించడం
  choice: నేను దేవుణ్ణా?
  alternative: నేను ఒక దేవుణ్ణా?
  rationale: జీవాన్ని తీసివేయడం, తిరిగి ఇవ్వడం దేవుని అధికారమనే కథన సందర్భాన్ని ‘దేవుడు’ స్పష్టంగా ప్రతిబింబిస్తుంది; బహుదేవతా భావాన్ని అనవసరంగా చేర్చదు.
- issue: צָּרַעַת వ్యాధిపదానికి వైద్యపరమైన నిర్దిష్టత
  choice: కుష్ఠు రోగం
  alternative: తీవ్రమైన చర్మవ్యాధి
  rationale: సుపరిచిత కథనపదాన్ని ప్రధాన పాఠ్యంలో ఉంచినా, ఇది తప్పనిసరిగా ఆధునిక హాన్సెన్ వ్యాధినే సూచించదనే మూలభాషా అనిశ్చితిని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘బట్టలు చింపుకొని,’ ‘దేవుణ్ణా?’ వంటి రూపాలు సాధారణ పాఠకులకు సులభంగా అర్థమవుతాయి. మూలంలోని జీవమరణాల సమాంతరతను, రాజు భయాందోళనను, చివరి క్రియలోని ‘తగాదా/సాకు’ అర్థసందిగ్ధతను నిలిపాం.
