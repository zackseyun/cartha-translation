source:
  edition: WLC
  text: וַ/יִּקְצֹ֥ף נַעֲמָ֖ן וַ/יֵּלַ֑ךְ וַ/יֹּאמֶר֩ הִנֵּ֨ה אָמַ֜רְתִּי אֵלַ֣/י יֵצֵ֣א יָצ֗וֹא וְ/עָמַד֙ וְ/קָרָא֙ בְּ/שֵׁם יְהוָ֣ה אֱלֹהָ֔י/ו וְ/הֵנִ֥יף יָד֛/וֹ אֶל הַ/מָּק֖וֹם וְ/אָסַ֥ף הַ/מְּצֹרָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: te
  text: 'నయమాను కోపగించుకొని అక్కడి నుంచి వెళ్లిపోయాడు. అతడు ఇలా అన్నాడు: “ఇదిగో, ‘అతడు తప్పకుండా నా దగ్గరికి బయటికి వచ్చి నిలబడి, తన దేవుడైన యాహ్వే[a] పేరును ప్రార్థనలో పిలిచి, ఆ చోటువైపు తన చెయ్యి ఊపి, ఆ కుష్ఠసంబంధ చర్మవ్యాధితో బాధపడుతున్న వ్యక్తిని స్వస్థపరుస్తాడు[b]’ అని నాలో నేను అనుకున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వే” అనేది హీబ్రూ దైవనామమైన יהוה (YHWH) యొక్క లిప్యంతరీకరణ.
    reason: divine_name
  - marker: b
    text: లేదా, “కుష్ఠసంబంధ చర్మవ్యాధిని తొలగిస్తాడు.” ఇక్కడి హీబ్రూ క్రియకు అక్షరార్థంగా “కూడదీయడం, తీసివేయడం” అనే భావాలు ఉన్నాయి; చివరి పదం ఆ వ్యాధిని గానీ, దానితో బాధపడే వ్యక్తిని గానీ సూచించవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: కోపంతో
  rationale: קצף కోపాన్ని సూచిస్తుంది. సందర్భంలో నయమాను కోపగించి వెళ్లిపోవడం సహజమైన ఆధునిక తెలుగులో ఇలా వ్యక్తమవుతుంది; మూలంలో లేనంత తీవ్రతను చేర్చదు.
- source_word: וַיֵּלַךְ
  choice: అక్కడి నుంచి వెళ్లిపోయాడు
  rationale: הלך ఇక్కడ ఎలీషా ఇంటి దగ్గర నుంచి కోపంగా వెళ్లిపోవడాన్ని సూచిస్తుంది. ‘వెళ్లిపోయాడు’ ఆ నిష్క్రమణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: הנה మాటకు ఉద్ఘాటనను ఇస్తుంది. ‘ఇదిగో’ ఆ సంభాషణాత్మక బలాన్ని కాపాడుతుంది.
- source_word: אָמַרְתִּי אֵלַי
  choice: నాలో నేను అనుకున్నాను
  rationale: అక్షరార్థంగా ‘నాతో నేను చెప్పుకున్నాను.’ తెలుగులో ‘నాలో నేను అనుకున్నాను’ సహజంగా ఉండి అంతర్గత మాట భావాన్ని నిలుపుతుంది.
- source_word: יֵצֵא יָצוֹא
  choice: తప్పకుండా ... బయటికి వచ్చి
  rationale: క్రియకు ముందు ఉన్న infinitive absolute చర్యను బలపరుస్తుంది; ‘తప్పకుండా’ ఆ నిశ్చిత నిరీక్షణను తెలుగులో తెలియజేస్తుంది.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: తన దేవుడైన యాహ్వే పేరును పిలిచి
  rationale: קרא בשם అనే ప్రయోగం దేవుని పేరును ప్రార్థనగా పిలవడం లేదా ఆ పేరును ఆహ్వానించడం అనే భావం కలిగిస్తుంది. మూలంలోని బైబిలు నుడికారాన్ని ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: వ్యాధి ఉన్న చోటుపై తన చెయ్యి ఊపి
  rationale: הניף ఊపే కదలికను సూచిస్తుంది. המקום సందర్భంలో వ్యాధి ప్రభావితమైన ప్రదేశం; తెలుగులో ‘చోటుపై’ ఊహించిన చికిత్సా సంజ్ఞను సహజంగా తెలియజేస్తుంది.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: ఆ కుష్ఠసంబంధ చర్మవ్యాధిగల వ్యక్తిని స్వస్థపరుస్తాడు
  rationale: אסף మౌలికంగా కూడదీయడం లేదా తీసివేయడం అని అర్థమవుతుంది; వ్యాధి సందర్భంలో దాని తొలగింపుతో కలిగే స్వస్థతను సూచిస్తుంది. הַמְּצֹרָע రూపం వ్యాధిగ్రస్త వ్యక్తిని సూచించగలదు. ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానీకరించకుండా ‘కుష్ఠసంబంధ చర్మవ్యాధి’ అన్న వివరణను వాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: צרע మూలానికి సంబంధించిన వ్యాధి పదజాలం
  choice: కుష్ఠసంబంధ చర్మవ్యాధిగల వ్యక్తి
  alternative: కుష్ఠరోగి / చర్మవ్యాధిగ్రస్తుడు
  rationale: ‘కుష్ఠరోగి’ ఒక్కటే వాడితే ఆధునిక హాన్సెన్ వ్యాధి అనే నిర్దిష్ట నిర్ధారణను అనవసరంగా సూచించవచ్చు; ‘చర్మవ్యాధిగ్రస్తుడు’ మాత్రమే అయితే సంప్రదాయ బైబిలు వర్గీకరణ కనుమరుగవుతుంది. ఎంచుకున్న రూపం రెండింటినీ సమతుల్యం చేస్తుంది.
- issue: וְאָסַף הַמְּצֹרָעలో కర్తవ్యార్థ అస్పష్టత
  choice: వ్యాధిగల వ్యక్తిని స్వస్థపరుస్తాడు
  alternative: కుష్ఠసంబంధ చర్మవ్యాధిని తొలగిస్తాడు
  rationale: הַמְּצֹרָע వ్యాధిగ్రస్త వ్యక్తిగా అర్థమవగల రూపం; అయితే אסף యొక్క అక్షరార్థ చిత్రణ ‘తీసివేయడం’ వైపు చూపుతుంది. ప్రధాన పాఠంలో సహజమైన వ్యక్తి-కేంద్రిత భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. నయమాను ఊహించిన నాటకీయ చర్యల క్రమాన్ని మూలానికి దగ్గరగా ఉంచాం. వైద్యపరంగా నిర్దిష్టమైన ఆధునిక నిర్ధారణను రుద్దకుండా బైబిలు చర్మవ్యాధి వర్గాన్ని వివరణాత్మకంగా అందించాం.
