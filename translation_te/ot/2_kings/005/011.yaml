  revised_text: 'నయమాను కోపగించుకొని అక్కడి నుంచి వెళ్లిపోయాడు. అతడు ఇలా అన్నాడు: “ఇదిగో, ‘అతడు తప్పకుండా నా దగ్గరికి బయటికి వచ్చి నిలబడి, తన దేవుడైన యాహ్వే[a] పేరును ప్రార్థనలో పిలిచి, ఆ చోటువైపు తన చెయ్యి ఊపి, ఆ కుష్ఠసంబంధ చర్మవ్యాధితో బాధపడుతున్న వ్యక్తిని స్వస్థపరుస్తాడు[b]’ అని నాలో నేను అనుకున్నాను.”'
