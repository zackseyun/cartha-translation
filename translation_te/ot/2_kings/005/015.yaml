source:
  edition: WLC
  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: te
  text: 'అప్పుడు అతడు తనతో ఉన్న వారందరితో కలిసి దేవుని మనిషి దగ్గరకు తిరిగి వచ్చాడు. వచ్చి అతని ఎదుట నిలబడి, “ఇదిగో, ఇప్పుడు నాకు తెలిసింది: ఇశ్రాయేలులో తప్ప భూమంతటిలో ఎక్కడా దేవుడు లేడు. ఇక ఇప్పుడు దయచేసి మీ సేవకుడి నుండి కానుకను స్వీకరించండి[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కానుక’కు హీబ్రూలో పదశః ‘ఆశీర్వాదం’; ఇక్కడ అది బహుమతి లేదా కానుకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: దైవ ప్రతినిధి లేదా ప్రవక్తకు వాడే హీబ్రూ బిరుదును వ్యాఖ్యానాత్మకంగా ‘దేవుని ప్రవక్త’ అని మార్చకుండా, దాని సాహిత్య ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: מַחֲנֵהוּ
  choice: అతనితో ఉన్న వారందరూ
  rationale: పదశః ‘అతని శిబిరం’; ఈ సందర్భంలో నయమానుతో వచ్చిన పరివారాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ వ్యక్తుల సమూహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: అతని ఎదుట నిలబడి
  rationale: ఎవరి సమక్షంలోనైనా నిలబడడం లేదా హాజరవడం అనే హీబ్రూ భావాన్ని సూటిగా, సహజంగా నిలుపుతుంది.
- source_word: הִנֵּה נָא יָדַעְתִּי
  choice: ఇప్పుడు నాకు తెలిసింది
  rationale: హిన్నే-నా ఇచ్చే దృష్టి ఆకర్షణను, యాదాతీ సూచించే కొత్తగా పొందిన నిశ్చయాన్ని తెలుగులో సహజంగా కలిపి వ్యక్తపరుస్తుంది.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో తప్ప భూమంతటిలో ఎక్కడా దేవుడు లేడు
  rationale: దేవుని ఏకైకత్వం గురించిన బలమైన ఒప్పుకోలును తగ్గించకుండా, ‘ఇశ్రాయేలులో’ అనే స్థానసూచక నిర్మాణాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: קַח נָא בְרָכָה
  choice: దయచేసి ... ఈ కానుకను స్వీకరించండి
  rationale: కాఖ్-నా యొక్క మర్యాదపూర్వక అభ్యర్థనను, బరాఖా ఈ కానుక సందర్భంలో పొందే ‘బహుమతి’ భావాన్ని సహజ తెలుగులో అందిస్తుంది; పదశః అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: עַבְדֶּךָ
  choice: మీ సేవకుడైన నా
  rationale: ఇక్కడ బానిసత్వ స్థితికన్నా వినయపూర్వక స్వీయసంబోధనే ప్రధానమైనందున, తెలుగు మర్యాదా సంభాషణకు తగిన రూపాన్ని ఎంచుకుంది.
theological_decisions:
- issue: ఇశ్రాయేలులో తప్ప ఎక్కడా దేవుడు లేడనే నయమాను ఒప్పుకోలు
  choice: ‘ఇశ్రాయేలులో తప్ప భూమంతటిలో ఎక్కడా దేవుడు లేడు’ అని సూటిగా అనువదించడం
  alternative: ‘ఇశ్రాయేలు దేవుడు తప్ప వేరే దేవుడు లేడు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: హీబ్రూ వాక్యం బలమైన ఏకదైవ ఒప్పుకోలును చేస్తూనే ‘ఇశ్రాయేలులో’ అనే నిర్మాణాన్ని ఉంచుతుంది. అనువాదం దాని ఉద్రిక్తతను సిద్ధాంతపరంగా పరిష్కరించకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, కథనానికి తగిన శైలి. నయమాను ఎలీషాను ఉద్దేశించిన మాటల్లో ‘మీరు’ అనే గౌరవ బహువచనం వాడబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
