  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְדֹּ֥ף גֵּיחֲזִ֖י אַחֲרֵ֣י נַֽעֲמָ֑ן וַ/יִּרְאֶ֤ה נַֽעֲמָן֙ רָ֣ץ אַחֲרָ֔י/ו וַ/יִּפֹּ֞ל מֵ/עַ֧ל הַ/מֶּרְכָּבָ֛ה לִ/קְרָאת֖/וֹ וַ/יֹּ֥אמֶר הֲ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: te
  text: అప్పుడు గేహజీ నయమాను వెనుక పరుగెత్తాడు. నయమాను తన వెనుక గేహజీ పరుగెత్తుతూ రావడం చూసి, అతన్ని కలుసుకోవడానికి రథం మీదనుండి దిగి, “అంతా క్షేమమేనా?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: వెనుక పరుగెత్తాడు
  rationale: רדף ఉద్దేశపూర్వకంగా ఒకరి వెనుక వెళ్లడాన్ని సూచిస్తుంది. ఈ సందర్భంలో శత్రుత్వాన్ని అనవసరంగా సూచించే ‘తరిమాడు’ కంటే ‘వెనుక పరుగెత్తాడు’ సహజంగా, సందర్భానుకూలంగా ఉంది.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: తన వెనుక అతడు పరుగెత్తుకుంటూ రావడం ... చూసి
  rationale: నయమాను గేహజీని తన వెనుక పరుగెత్తుతూ ఉన్నవానిగా చూశాడనే దృశ్యాన్నీ, కొనసాగుతున్న చర్యనూ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: రథం దిగి
  rationale: נפל అక్షరార్థంగా ‘పడు’ అయినా, వాహనం మీద నుంచి దిగే సందర్భంలో త్వరగా దిగడాన్ని సూచించే ప్రయోగం. ప్రమాదవశాత్తు పడ్డాడనే భావం రాకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: לִקְרָאתוֹ
  choice: అతన్ని కలుసుకోవడానికి
  rationale: לקראת ఒకరి వైపు వెళ్లి కలుసుకోవడాన్ని సూచిస్తుంది; మూలంలోని ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הֲשָׁלוֹם
  choice: అంతా క్షేమమేనా?
  rationale: שָׁלוֹם ఇక్కడ ‘శాంతి’ అనే భావనను మాత్రమే కాక, పరిస్థితి లేదా క్షేమం గురించి అడిగే సాంప్రదాయిక ప్రశ్నగా పనిచేస్తుంది. ‘అంతా క్షేమమేనా?’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַ
  choice: కాబట్టి
  rationale: ఆరంభంలోని వావ్ కథనాన్ని ముందుకు నడిపి, గేహజీ నిర్ణయానికి అనుసరించిన చర్యను కలుపుతుంది; ‘కాబట్టి’ సందర్భ సంబంధాన్ని సహజంగా చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘రథం దిగి’ అనే సహజ ప్రయోగం హీబ్రూ నుడికారాన్ని అక్షరార్థ అపార్థం లేకుండా అందిస్తుంది; చివరి ప్రశ్నలో שָׁלוֹם యొక్క క్షేమ విచారణ భావం నిలుపబడింది.
