  to: అప్పుడు అరాము[b] రాజు, “వెళ్ళు[a]; నేను ఇశ్రాయేలు రాజుకు ఒక ఉత్తరం పంపుతాను” అన్నాడు. కాబట్టి అతడు వెళ్లి, పది తలాంతుల వెండిని, ఆరు వేల బంగారు ముక్కలను[c], మార్చుకునే పది వస్త్ర సముదాయాలను తన వెంట తీసుకెళ్లాడు.
  rationale: హీబ్రూ జత ఆజ్ఞల అసాధారణ రూపాన్ని పాదసూచికలో పారదర్శకంగా నిలిపి, ప్రధాన సందర్భార్థాన్ని సహజ తెలుగులో ఇచ్చాం. అలాగే ‘జతల వస్త్రాలు’ వల్ల వచ్చే ‘రెండు వస్త్రాల జతలు’ అనే అనవసర అర్థసూచనను తొలగించి, పూర్తి మార్పు దుస్తుల సముదాయాల భావాన్ని స్పష్టం చేశాం. ఇతర పదాలు మరియు పాదసూచికల అస్పష్టత-సంరక్షణను నిలిపాం.
