source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ אֲרָם֙ לֶךְ בֹּ֔א וְ/אֶשְׁלְחָ֥ה סֵ֖פֶר אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יֵּלֶךְ֩ וַ/יִּקַּ֨ח בְּ/יָד֜/וֹ עֶ֣שֶׂר כִּכְּרֵי כֶ֗סֶף וְ/שֵׁ֤שֶׁת אֲלָפִים֙ זָהָ֔ב וְ/עֶ֖שֶׂר חֲלִיפ֥וֹת בְּגָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: te
  text: అప్పుడు అరాము[b] రాజు, “వెళ్ళు[a]; నేను ఇశ్రాయేలు రాజుకు ఒక ఉత్తరం పంపుతాను” అన్నాడు. కాబట్టి అతడు వెళ్లి, పది తలాంతుల వెండిని, ఆరు వేల బంగారు ముక్కలను[c], మార్చుకునే పది వస్త్ర సముదాయాలను తన వెంట తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా రెండు ఆజ్ఞలు, ‘వెళ్ళు, రా’ అని ఉన్నాయి. ఈ ప్రయోగం వెంటనే వెళ్లడానికి అనుమతి లేదా ప్రోత్సాహాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాము’ అనేది హీబ్రూ పేరు; కొన్ని సంప్రదాయ అనువాదాల్లో దీనిని ‘సిరియా’ అని అనువదించారు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆరు వేల బంగారం’ అని ఉంది; లెక్కించిన నిర్దిష్ట ప్రమాణం లేదా వస్తువు చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: వెళ్లు, బయలుదేరు
  rationale: హీబ్రూలో వరుసగా ఉన్న రెండు ఆజ్ఞార్థక క్రియలను పూర్తిగా ఒకే ఆజ్ఞగా కుదించకుండా, ఆధునిక తెలుగులో సహజంగా వినిపించేలా తక్షణ అనుమతి లేదా ప్రోత్సాహాన్ని వ్యక్తం చేస్తుంది.
- source_word: סֵפֶר
  choice: ఒక ఉత్తరం
  rationale: ఇద్దరు రాజుల మధ్య పంపే లిఖిత సమాచారమనే ఈ సందర్భార్థాన్ని ‘ఉత్తరం’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיָדוֹ
  choice: తన వెంట తీసుకెళ్లాడు
  rationale: అక్షరార్థం ‘తన చేతిలో’ అయినా, ఇంత పెద్ద మొత్తంలోని సంపదను మోసుకెళ్లడాన్ని తెలుగులో ‘తన వెంట తీసుకెళ్లాడు’ సహజంగా తెలియజేస్తుంది; ఇది స్వాధీనంలో తీసుకెళ్లాడనే హీబ్రూ ప్రయోగార్థాన్ని కాపాడుతుంది.
- source_word: כִּכְּרֵי כֶסֶף
  choice: తలాంతుల వెండి
  rationale: כִּכָּר అనే ప్రాచీన పెద్ద బరువు ప్రమాణాన్ని ఊహాత్మక ఆధునిక మార్పిడి చేయకుండా ‘తలాంతు’గా ఉంచింది.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: ఆరు వేల బంగారు ముక్కలు
  rationale: హీబ్రూ పాఠంలో లెక్కించే నిర్దిష్ట ప్రమాణం లేదా వస్తువు పేర్కొనబడలేదు. ‘ముక్కలు’ అని ఇవ్వడం పఠన సౌలభ్యాన్ని కలిగిస్తూనే ‘షెకెల్లు’ లేదా ‘నాణాలు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: జతల వస్త్రాలు
  rationale: ఈ పదబంధం మార్చుకుని ధరించగల పూర్తి వస్త్ర సముదాయాలను సూచిస్తుంది; ‘జతల వస్త్రాలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: అసలు హీబ్రూ స్థలనామమైన אֲרָםను తరువాతి భౌగోళిక పేరైన ‘సిరియా’తో మార్చకుండా ‘అరాము’గా లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడింది. అసలు పాఠంలోని ప్రాచీన బరువు ప్రమాణాన్ని నిలిపి, అస్పష్టంగా ఉన్న బంగారం ప్రమాణాన్ని పాదసూచికలో వెల్లడించింది. హీబ్రూ జాతీయ-భౌగోళిక పేరైన ‘అరాము’ను యథాతథంగా ఉంచింది.
