  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: te
  text: “కాబట్టి నయమానుకు ఉన్న చర్మవ్యాధి నీకూ నీ సంతానానికీ ఎప్పటికీ అంటుకొని ఉంటుంది.” అప్పుడు అతడు మంచువలె తెల్లగా ఉన్న చర్మవ్యాధిగ్రస్తుడై[a] ఎలీషా సన్నిధి నుంచి బయటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సంప్రదాయ అనువాదం: “నయమానుకు ఉన్న కుష్ఠువ్యాధి నీకూ ... అంటుకొని ఉంటుంది ... అతడు మంచువలె తెల్లగా ఉన్న కుష్ఠురోగిగా వెళ్లాడు.” హెబ్రీలోని צָרַעַת, מְצֹרָע పదాలు ఆధునిక కుష్ఠువ్యాధిని మాత్రమే కాక, మరింత విస్తృతమైన తీవ్రమైన చర్మవ్యాధిని లేదా చర్మస్థితిని సూచించగలవు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: ఈ హెబ్రీ పదం ఆధునిక కుష్ఠువ్యాధిని మాత్రమే కాక, విస్తృతమైన తీవ్రమైన చర్మస్థితులను సూచించగలదు. కాబట్టి వైద్యపరంగా అతినిర్దిష్టం కాని సహజమైన పదాన్ని ఎంచుకున్నాం.
- source_word: נַעֲמָן
  choice: నయమాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: תִּדְבַּק
  choice: అంటుకొని ఉంటుంది
  rationale: דבק లోని బలంగా అతుక్కొని ఉండే భావాన్ని, శాపవాక్యంలోని నిరంతరత్వాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: ఇక్కడ זֶרַע భావి తరాలను సూచిస్తుంది; ‘సంతానం’ సహజమైనది, సమగ్రార్థకమైనది.
- source_word: לְעוֹלָם
  choice: ఎప్పటికీ
  rationale: తీర్పు కొనసాగుతుందనే వాక్యబలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లాడు
  rationale: కథనంలోని భౌతిక కదలికను నేరుగా నిలుపుతుంది.
- source_word: מִלְּפָנָיו
  choice: ఎలీషా సన్నిధి నుంచి
  rationale: అక్షరార్థంగా ‘అతని సన్నిధి నుంచి’. సందర్భంలో సర్వనామం ఎలీషాను సూచిస్తుందని స్పష్టత కోసం పేరు వాడాం.
- source_word: מְצֹרָע
  choice: చర్మవ్యాధిగ్రస్తుడై
  rationale: צָרַעַת తో ఉన్న పదసంబంధాన్ని నిలుపుతూ, ఆధునిక కుష్ఠువ్యాధి అనే అనవసర నిర్ధారణను నివారిస్తుంది.
- source_word: כַּשָּׁלֶג
  choice: మంచులా తెల్లబడిన
  rationale: హెబ్రీలోని ‘మంచువలె’ అనే పోలికలో సూచితమైన తెల్లదనాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: צָרַעַת / מְצֹרָע పదాల అర్థం
  choice: చర్మవ్యాధి / చర్మవ్యాధిగ్రస్తుడు
  alternative: కుష్ఠువ్యాధి / కుష్ఠురోగి
  rationale: వాక్యం దేవుడు విధించిన వ్యాధిని, అది సంతానానికి కొనసాగడాన్ని తెలియజేస్తుంది; అయితే దానిని ఆధునిక హాన్సెన్ వ్యాధిగానే నిర్ధారించదు. అందువల్ల మూలభాషలోని విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సంప్రదాయ అనువాదాన్ని పాదసూచికలో ఇచ్చాం.
- issue: מִלְּפָנָיו లోని సర్వనామం
  choice: ఎలీషా సన్నిధి నుంచి
  alternative: అతని సన్నిధి నుంచి
  rationale: సందర్భం ప్రకారం సర్వనామం ఎలీషాను సూచిస్తుంది. పేరును స్పష్టపరచడం అర్థాన్ని సిద్ధాంతపరంగా మార్చకుండా తెలుగు పఠనాన్ని సులభం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే తీర్పువాక్యపు గంభీరతను నిలుపుతూ అనువదించాం. ‘సన్నిధి’ అనే గౌరవప్రదమైన బైబిలు పదం సందర్భానికి తగినదిగా ఉంచాం.
