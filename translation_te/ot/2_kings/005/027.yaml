  source_fidelity: మూల హెబ్రీలోని צָרַעַת / מְצֹרָע పదజాలాన్ని ప్రధాన పాఠ్యంలో ‘చర్మవ్యాధి’ / ‘చర్మవ్యాధిగ్రస్తుడు’గా అనువదించడం సముచితం; ఇది ఆధునిక కుష్ఠువ్యాధి అని అనవసరంగా నిర్ధారించదు. ‘ఎలీషా సన్నిధి నుంచి’ అనేది מִלְּפָנָיו యొక్క సందర్భానుగుణమైన స్పష్టీకరణ. అయితే ‘నయమాను చర్మవ్యాధి’ అనే నిర్మాణం ఆధునిక తెలుగులో అసహజంగా ఉంది; అది నయమాను పేరుతో కూడిన వ్యాధిలా వినిపించవచ్చు. మూలంలోని ‘Naaman’s disease’ భావానికి ‘నయమానుకు ఉన్న చర్మవ్యాధి’ మరింత స్పష్టమైనది.
  naturalness: ‘మంచులా తెల్లబడిన చర్మవ్యాధిగ్రస్తుడై’ కంటే ‘మంచువలె తెల్లగా ఉన్న చర్మవ్యాధిగ్రస్తుడై’ అనేది పోలికను సహజంగా వ్యక్తం చేస్తుంది. ఇది అతడు బయటికి వెళ్లినప్పుడు అతని స్థితిని వర్ణించే హెబ్రీ నిర్మాణానికి కూడా దగ్గరగా ఉంటుంది.
  terminology: ‘చర్మవ్యాధి,’ ‘సంతానం,’ ‘ఎప్పటికీ,’ మరియు ‘సన్నిధి’ సందర్భానుకూలమైన, ఆధునిక ప్రామాణిక తెలుగు పదాలు. సంప్రదాయ పదమైన ‘కుష్ఠువ్యాధి’ని పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచడం ఉపయోగకరం; కానీ దానిని ఆధునిక వైద్యనిర్ధారణగా పాఠకుడు అర్థం చేసుకోకూడదని పాదసూచిక సరిగ్గా తెలియజేయాలి.
