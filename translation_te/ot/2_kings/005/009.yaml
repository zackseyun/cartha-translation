  text: וַ/יָּבֹ֥א נַעֲמָ֖ן ב/סוס/ו וּ/בְ/רִכְבּ֑/וֹ וַ/יַּעֲמֹ֥ד פֶּֽתַח הַ/בַּ֖יִת לֶ/אֱלִישָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/009.yaml
  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: te
  text: నయమాను తన గుర్రాలతో, రథాలతో[a] వచ్చి, ఎలీషా ఇంటి ప్రవేశద్వారం దగ్గర నిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “తన గుర్రంతో, తన రథంతో.” ఇక్కడ ఏకవచన రూపాలు సమూహార్థంలో వాడబడి ఉండవచ్చు; అందుకే “గుర్రాలతో, రథాలతో” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: కథన క్రమంలో בוא నయమాను ఎలీషా ఉన్న చోటికి రావడాన్ని సూచిస్తుంది; సరళమైన కథన గమనాన్ని ‘వచ్చి’ సహజంగా నిలుపుతుంది.
- source_word: נַעֲמָן
  choice: నయమాను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని అనుసరించాం.
- source_word: בְסוּסוֹ
  choice: తన గుర్రాలతో
  rationale: హీబ్రూలో రూపం ఏకవచనమైనప్పటికీ, రథసమూహంతో కూడిన సందర్భంలో ఇది సమూహార్థకంగా ఉండే అవకాశం ఉంది; సహజమైన తెలుగులో బహువచనం వాడాం.
- source_word: וּבְרִכְבּוֹ
  choice: రథాలతో
  rationale: רֶכֶב ఒక రథాన్ని గానీ రథసమూహాన్ని గానీ సూచించగలదు. గుర్రాలతో సమాంతరంగా ఉన్న ఈ రాజసైనిక సందర్భంలో సమూహార్థక బహువచనం సహజం.
- source_word: וַיַּעֲמֹד
  choice: నిలిచాడు
  rationale: עמד యొక్క సాధారణ అర్థమైన ‘నిలుచు’ను కాపాడుతూ, ఇంటి బయట నయమాను నిలబడిన దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: פֶּתַח הַבַּיִת
  choice: ఇంటి ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే తెరువు లేదా ప్రవేశస్థలం. ‘ప్రవేశద్వారం దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉండి భౌతిక స్థానాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: לֶאֱלִישָׁע
  choice: ఎలీషా ఇంటి
  rationale: ఈ నిర్మాణంలో ל సంబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో ‘ఎలీషా ఇంటి’ అని సహజంగా వ్యక్తీకరించాం.
