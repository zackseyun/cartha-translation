reference: 2 Kings 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: te
  text: అతడు, “అంతా క్షేమమే.[a] నా యజమాని నన్ను పంపి, ‘ఇదిగో, ఇప్పుడే ఎఫ్రాయిము కొండప్రాంతం నుండి ప్రవక్తల కుమారులలో నుండి ఇద్దరు యువకులు నా దగ్గరికి వచ్చారు.[b] దయచేసి వారికి ఒక తలాంతు వెండిని, మార్చుకొని ధరించడానికి రెండు జతల బట్టలను ఇవ్వండి’ అని చెప్పమన్నాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్షేమం.” ఇక్కడి హీబ్రూ పదం షాలోమ్, ఏ సమస్యా లేదని భరోసా ఇచ్చే నుడికారంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: “ప్రవక్తల కుమారులు” అనేది ప్రవక్తల సమాజం లేదా బృందంలోని సభ్యులను సూచించే ప్రామాణిక హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: అంతా క్షేమమే
  rationale: ఈ సందర్భంలో ఇది పలకరింపు కంటే ఏ సమస్యా లేదని భరోసా ఇచ్చే నుడికారంగా పనిచేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: గేహజీ తనకు యజమానియైన ఎలీషాను సూచిస్తున్న సేవకుడు–యజమాని సందర్భాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלָחַנִי לֵאמֹר
  choice: నన్ను పంపి … అని చెప్పమన్నాడు
  rationale: పంపిన చర్యను, అప్పగించిన సందేశాన్ని సహజమైన తెలుగు పరోక్ష ఉల్లేఖన నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה עַתָּה זֶה
  choice: ఇదిగో, ఇప్పుడే
  rationale: శ్రద్ధను ఆకర్షించే సూచనను, సంఘటన తక్షణత్వాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: נְעָרִים
  choice: యువకులు
  rationale: ఇక్కడ ప్రవక్తల సమూహానికి చెందినవారిని సూచిస్తున్నందున ‘సేవకులు’ లేదా ‘బాలురు’ కంటే తటస్థంగా, సందర్భోచితంగా ఉంది.
- source_word: מֵהַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతం నుండి
  rationale: ఒకే పర్వతాన్ని కాక ఎఫ్రాయిము ఉన్నత భూభాగాన్ని సూచించే భౌగోళిక ప్రయోగాన్ని తెలియజేస్తుంది.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: ప్రవక్తల కుమారులలోని
  rationale: హీబ్రూ సాంకేతిక నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సామూహిక అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: תְּנָה נָּא
  choice: దయచేసి … ఇవ్వండి
  rationale: ఆజ్ఞారూపంతో కూడిన నָא వ్యక్తం చేసే మర్యాదపూర్వక అభ్యర్థనను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כִּכַּר כֶּסֶף
  choice: ఒక తలాంతు వెండి
  rationale: కొలమానానికి సంబంధించిన మూలపాఠ్య పదాన్ని నిలిపి, అది పెద్ద బరువు ప్రమాణమని పాదసూచికలో తెలియజేస్తుంది.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: రెండు జతల బట్టలు
  rationale: మార్చుకొని ధరించడానికి ఉద్దేశించిన రెండు వస్త్ర సముదాయాలను సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
