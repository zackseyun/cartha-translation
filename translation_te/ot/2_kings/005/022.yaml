translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ప్రత్యక్ష సంభాషణ, మర్యాదపూర్వక అభ్యర్థన, సాంకేతిక నుడికారాలు నిలుపబడ్డాయి; అరుదైన సాంస్కృతిక పదాలకు సంక్షిప్త పాదసూచికలు ఇచ్చాం.
