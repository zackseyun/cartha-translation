translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సంఘటనల వరుసను స్పష్టంగా నిలిపింది; עֹפֶל పదంలోని నిజమైన భావవైవిధ్యాన్ని పాదటిప్పణిలో ఉంచింది.
