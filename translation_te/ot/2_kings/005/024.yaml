  text: וַ/יָּבֹא֙ אֶל הָ/עֹ֔פֶל וַ/יִּקַּ֥ח מִ/יָּדָ֖/ם וַ/יִּפְקֹ֣ד בַּ/בָּ֑יִת וַ/יְשַׁלַּ֥ח אֶת הָ/אֲנָשִׁ֖ים וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: te
  text: అతడు ఆ కొండకు[a] వచ్చినప్పుడు, వారి చేతినుండి వాటిని తీసుకొని ఇంట్లో ఉంచాడు. తరువాత అతడు ఆ మనుషులను పంపివేశాడు, వారు వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ మట్టిదిబ్బకు,’ ‘ఆ కోటగల కొండకు’; హీబ్రూలో ‘ఆ ఓఫెల్.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: ఆ ఎత్తైన ప్రదేశం
  rationale: עֹפֶל ఎత్తైన స్థలం, మట్టిదిబ్బ లేదా కోటగల కొండను సూచించగలదు. ఈ కథన సందర్భంలో స్థలాకృతి భావం సహజం; సందిగ్ధతను పూర్తిగా తొలగించకుండా సాధారణ పాఠకునికి అర్థమయ్యేలా ‘ఎత్తైన ప్రదేశం’ అని అనువదించబడింది.
- source_word: מִיָּדָם
  choice: వారి చేతుల్లోనుండి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వారి చేతినుండి’ అనే ప్రయోగం ఉంది; వస్తువులను వారి వద్దనుండి నేరుగా తీసుకున్న భావాన్ని సహజమైన తెలుగు బహువచన రూపంలో నిలిపింది.
- source_word: וַיִּפְקֹד
  choice: భద్రపరిచాడు
  rationale: פקד ఇక్కడ తీసుకున్న వస్తువులను ఇంట్లో ఉంచి కాపాడేలా పెట్టడాన్ని సూచిస్తుంది. ‘భద్రపరిచాడు’ అనేది అప్పగించాడు అనే అవసరంలేని భావాన్ని చేర్చకుండా సందర్భానుగుణ అర్థాన్ని అందిస్తుంది.
- source_word: בַּבָּיִת
  choice: ఇంట్లో
  rationale: בית ఇక్కడ వస్తువులు ఉంచబడిన భౌతిక ఇంటిని సహజంగా సూచిస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: ముందటి సందర్భంలో వారు నయమాను పరివారానికి చెందినవారైనా, హీబ్రూ నిర్దిష్టంగా ‘సేవకులు’ అనకుండా ‘మనుషులు’ అంటుంది; అందువల్ల మూలపదాన్ని నిలిపింది.
