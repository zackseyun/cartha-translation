base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/019.yaml
  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: te
  text: అతడు అతనితో, “క్షేమంగా వెళ్లు” అన్నాడు. అప్పుడు అతడు అతని దగ్గరనుండి కొంత దూరం[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం ప్రయాణించిన ఒక దూరాన్ని సూచిస్తుంది; అయితే అది ఎంత దూరమో ఖచ్చితంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: అతడు అతనితో … అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో కొనసాగిస్తూ, కర్తను మరియు పరోక్ష కర్మను మూలంలోని సర్వనామాలుగానే ఉంచుతుంది.
- source_word: לֵךְ לְשָׁלוֹם
  choice: క్షేమంగా వెళ్లు
  rationale: ఇది ఆశీర్వాదంతో వీడ్కోలు పలికే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం. שָׁלוֹם లోని క్షేమం, శాంతి అనే భావవ్యాప్తిని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: అప్పుడు అతడు అతని దగ్గరనుండి … వెళ్లాడు
  rationale: తదుపరి కథన చర్యను స్పష్టంగా చూపిస్తూ, ఎలీషా సన్నిధినుండి నయమాను బయలుదేరిన భావాన్ని మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: כִּבְרַת אָרֶץ
  choice: కొంత దూరం
  rationale: ఈ పదబంధం ప్రయాణించిన దూరాన్ని సూచిస్తుంది గాని ఖచ్చితమైన కొలతను ఇవ్వదు. ‘కొంత దూరం’ పరిమాణాన్ని అతిశయింపకుండా ఆ అనిర్దిష్టతను నిలుపుతుంది.
theological_decisions:
- issue: రిమ్మోను మందిరంలో తన ప్రవర్తన గురించి నయమాను చేసిన విన్నపానికి ఎలీషా ఇచ్చిన జవాబు
  choice: మూలంలోని వీడ్కోలు ఆశీర్వాదాన్ని ‘క్షేమంగా వెళ్లు’ అని మాత్రమే అనువదించడం
  alternative: నయమాను ప్రతిపాదించిన ప్రవర్తనకు ఎలీషా స్పష్టంగా ఆమోదం తెలిపాడని గానీ, నైతిక భావం లేని మర్యాదపూర్వక వీడ్కోలు మాత్రమే పలికాడని గానీ విస్తరించి చెప్పడం
  rationale: హీబ్రూ పాఠం సంక్షిప్తమైన ఆశీర్వాద/వీడ్కోలు సూత్రాన్ని మాత్రమే ఇస్తుంది. దానిలో స్పష్టమైన ఆమోదం లేదా ఖండనను చేర్చకుండా ఉండటం పాఠంలోని ధార్మిక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన కథన శైలిని వాడాం. ‘క్షేమంగా వెళ్లు’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వీడ్కోలు ఆశీర్వాదం. మూలంలోని సర్వనామ నిర్మాణాన్ని నిలిపి, సందర్భం నిర్ణయించే వ్యక్తి సూచనను అనవసరంగా పేర్లతో విస్తరించలేదు.
