source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: te
  text: అరాము[c] రాజు సైన్యాధిపతియైన నయమాను తన యజమాని దృష్టిలో గొప్పవాడు, ఎంతో గౌరవం పొందినవాడు. ఎందుకంటే అతని ద్వారా యాహ్వే అరాముకు విజయాన్ని[a] ఇచ్చాడు. అతడు పరాక్రమశాలి యోధుడు; అయితే చర్మవ్యాధిగలవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విజయం’ అని అనువదించిన హీబ్రూ పదానికి ‘విడుదల’ లేదా ‘రక్షణ’ అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ సైనిక విజయం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘కుష్ఠవ్యాధిగలవాడు’ అని సాంప్రదాయకంగా అనువదించబడే పదం ఉంది. అది ప్రాచీన సందర్భంలోని ఒక చర్మవ్యాధిని సూచిస్తుంది; ఆధునిక వైద్యశాస్త్రంలోని హాన్సెన్ వ్యాధితో కచ్చితంగా సమానం కాకపోవచ్చు.
    reason: cultural_note
  - marker: c
    text: సాంప్రదాయకంగా ‘సిరియా’; హీబ్రూలో ‘అరాము’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: నయమాను
  rationale: వావ్ కొత్త కథాభాగాన్ని అనుసంధానిస్తుంది; తెలుగులో అనవసరమైన కాలసూచక పదాన్ని చేర్చకుండా పేరుతో సహజంగా ప్రారంభించాం.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: అరాము రాజు సైన్యాధిపతి
  rationale: సైనిక పదవిని స్పష్టమైన ఆధునిక తెలుగులో తెలిపి, אֲרָםను సంప్రదాయ ‘సిరియా’కు బదులు మూలభాషకు దగ్గరగా ‘అరాము’గా ఉంచాం.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו וּנְשֻׂא פָנִים
  choice: తన యజమాని దృష్టిలో గొప్పవాడు, ఎంతో గౌరవం పొందినవాడు
  rationale: లִפְנֵי యొక్క రాజసభా సంబంధ భావాన్ని ‘దృష్టిలో’ అని, נְשֻׂא פָנִים అనే గౌరవసూచక నుడికారాన్ని సహజంగా ‘ఎంతో గౌరవం పొందినవాడు’ అని అందించాం.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: ఎందుకంటే అతని ద్వారా యెహోవా అరాముకు విజయాన్ని అనుగ్రహించాడు
  rationale: בּוֹను సాధనార్థకంగా ‘అతని ద్వారా’ అని అనువదించాం. సైనిక సందర్భంలో תְּשׁוּעָהకు ‘విజయం’ సహజమైన అర్థం; దాని విస్తృత అర్థాలను పాదటిప్పణిలో తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: גִּבּוֹר חַיִל
  choice: పరాక్రమశాలి అయిన యోధుడు
  rationale: ఈ పదబంధంలోని యుద్ధశౌర్యం, సామర్థ్యం రెండింటినీ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מְצֹרָע
  choice: తీవ్రమైన చర్మవ్యాధిగలవాడు
  rationale: ప్రాచీన צָרַעַת ఆధునిక హాన్సెన్ వ్యాధితో కచ్చితంగా సమానం కాకపోవచ్చు; అందువల్ల తప్పుదారి పట్టించే నిర్దిష్ట వైద్య నిర్ధారణకు బదులు విస్తృతమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవనామమైన יהוה నేరుగా ఉంది; కాబట్టి దాన్ని బిరుదుతో భర్తీ చేయలేదు.
- issue: అరాము విజయాన్ని యెహోవా అనుగ్రహించడం
  choice: అతని ద్వారా యెహోవా అరాముకు విజయాన్ని అనుగ్రహించాడు
  alternative: అతని ద్వారా అరాముకు విజయం లభించింది
  rationale: ఇశ్రాయేలేతర రాజ్యపు సైనిక విజయాన్నీ యెహోవాకే ఆపాదించే మూలపాఠ్యంలోని ఉద్రిక్తమైన దైవశాస్త్ర ప్రకటనను తగ్గించకుండా నిలిపాం.
- issue: నయమాను శౌర్యం మరియు వ్యాధి మధ్య వ్యత్యాసం
  choice: అతడు పరాక్రమశాలి అయిన యోధుడు; అయితే తీవ్రమైన చర్మవ్యాధిగలవాడు
  alternative: అతడు పరాక్రమశాలి అయిన యోధుడు, చర్మవ్యాధిగలవాడు
  rationale: హీబ్రూలో ప్రత్యేక వ్యతిరేక సంధాయకం లేకపోయినా, చివరి వర్ణన ముందున్న గౌరవం మరియు శౌర్యంతో స్పష్టమైన కథన వ్యత్యాసాన్ని సృష్టిస్తుంది; ‘అయితే’ తెలుగులో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. రాజసభా మరియు సైనిక పదాలను సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచి, మూలపాఠ్యంలోని దైవాధిపత్య భావాన్నీ నయమాను స్థితిలోని వ్యత్యాసాన్నీ నిలిపాం.
