source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חַי יְהוָ֛ה אֲשֶׁר עָמַ֥דְתִּי לְ/פָנָ֖י/ו אִם אֶקָּ֑ח וַ/יִּפְצַר בּ֥/וֹ לָ/קַ֖חַת וַ/יְמָאֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: te
  text: అయితే అతడు, “నేను ఎవరి సన్నిధిలో నిలిచి ఉన్నానో ఆ యాహ్వే జీవముతోడు,[a] నేను దానిని తీసుకోను” అన్నాడు.[b] దానిని తీసుకోమని నయమాను అతణ్ణి బలంగా కోరాడు, అయినా అతడు నిరాకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది ప్రమాణ సూత్రం. అక్షరార్థంగా, “యాహ్వే జీవముతోడు, ఎవరి సన్నిధిలో నేను నిలిచి ఉన్నానో, నేను తీసుకుంటే” అని ఉంటుంది; ఇక్కడ “తీసుకుంటే” అనే అపూర్ణ ప్రమాణ వాక్యం “నేను దానిని ఎంతమాత్రమూ తీసుకోను” అనే బలమైన నిరాకరణను తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను ఎవరి సమక్షంలో నిలిచి ఉన్నానో.” ఇక్కడ నిలిచి ఉండడం ఆయన సన్నిధిలో సేవచేయడాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: ఆ యాహ్వే జీవం తోడు
  rationale: హీబ్రూ ప్రమాణ సూత్రంలోని గంభీరతను నిలుపుతూ, ఆధునిక తెలుగులో ప్రమాణార్థం స్పష్టంగా వినిపించే రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: నేను ఎవరి సన్నిధిలో నిలుస్తున్నానో
  rationale: దేవుని సమక్షంలో నిలిచి సేవచేసే ప్రవక్త సంబంధమైన రూపకాన్ని ‘సేవిస్తున్నాను’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా నిలిపింది.
- source_word: אִם אֶקָּח
  choice: నేను దానిని తీసుకోను
  rationale: ప్రమాణ సందర్భంలో אִם బలమైన నిరాకరణను సూచిస్తుంది. సందర్భంలోని కానుకను సూచించేందుకు ‘దానిని’ చేర్చబడింది.
- source_word: וַיִּפְצַר בּוֹ
  choice: అతణ్ణి ఎంతో ఒత్తిడి చేశాడు
  rationale: פצר లోని పదేపదే లేదా బలంగా కోరే తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָקַחַת
  choice: దానిని తీసుకోమని
  rationale: ముందున్న לקח తో పదబంధ సంబంధాన్ని నిలుపుతూ, సందర్భం ద్వారా తెలిసే వస్తువును స్పష్టం చేస్తుంది.
- source_word: וַיְמָאֵן
  choice: అతడు నిరాకరించాడు
  rationale: מאן సూచించే స్పష్టమైన తిరస్కారాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: అ ప్రమాణ వాక్యంలోని אִם అర్థం
  choice: నేను దానిని తీసుకోను
  alternative: నేను దానిని తీసుకుంటే
  rationale: ఇది షరతును సాధారణంగా ప్రకటించే వాక్యం కాదు; అపూర్ణంగా పలికే హీబ్రూ ప్రమాణ సూత్రం. దాని ఉద్దేశం బలమైన నిరాకరణ అయినప్పటికీ, మూల నిర్మాణం గురించి పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. హీబ్రూ ప్రమాణ సూత్రం సహజంగా వినిపించేలా ఇచ్చి, దాని అక్షర నిర్మాణాన్ని పాదసూచికలో నిలిపాం. చివరి వాక్యంలో వరుస సర్వనామాల వల్ల కలిగే అయోమయాన్ని తగ్గించేందుకు సందర్భం స్పష్టంగా సూచించే ‘నయమాను’ పేరును చేర్చాం.
