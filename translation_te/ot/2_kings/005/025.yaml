base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: te
  text: అయితే అతడు లోపలికి వచ్చి తన యజమాని ఎదుట నిలబడ్డాడు. అప్పుడు ఎలీషా అతనితో, “గేహజీ, ఎక్కడి నుండి వచ్చావు?[a]” అని అడిగాడు. అతడు, “నీ సేవకుడు ఎక్కడికీ వెళ్లలేదు[b]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయ మూలంలో అక్షరార్థంగా: “ఎక్కడి నుండి, గేహజీ?”'
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీయ జాతీయం: “నీ సేవకుడు ఇటూ అటూ వెళ్లలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అయితే అతడు
  rationale: కథనాన్ని ముందుకు నడిపిస్తూ, గేహజీ రహస్యంగా చేసిన పనులకు ఇప్పుడు అతడు యజమాని ఎదుట నిలబడటానికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָא
  choice: లోపలికి వచ్చి
  rationale: మూల క్రియకు ప్రాథమిక అర్థం ‘వచ్చాడు’; సందర్భంలో గేహజీ ఎలీషా ఉన్న చోటికి ప్రవేశిస్తున్నందున ‘లోపలికి వచ్చి’ సహజంగా ఉంటుంది.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: తన యజమాని ఎదుట నిలబడ్డాడు
  rationale: సేవకుడు తన అధికారి సమక్షంలో హాజరై నిలబడటాన్ని సూచించే హెబ్రీయ భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֲדֹנָיו
  choice: తన యజమాని
  rationale: ఇక్కడ ఇది దేవునికి సంబంధించిన బిరుదు కాదు; గేహజీకి అధిపతిగా ఉన్న ఎలీషాను సూచించే సామాజిక సంబంధ పదం.
- source_word: מֵאָן
  choice: ఎక్కడి నుండి వచ్చావు?
  rationale: ప్రశ్న అక్షరార్థంగా ‘ఎక్కడి నుండి?’ అని ఉంది. తెలుగులో సంభాషణకు సహజత్వం కోసం సందర్భం సూచించే ‘వచ్చావు’ను చేర్చి, మూలంలోని దిశార్థాన్ని నిలిపింది.
- source_word: גֵּחֲזִי
  choice: గేహజీ
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చింది.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: నీ సేవకుడు ... వెళ్లలేదు
  rationale: గేహజీ తనను తాను వినయసూచకంగా ‘నీ సేవకుడు’ అని పేర్కొన్న మూల రూపాన్ని ‘నేను’గా సరళీకరించకుండా నిలిపింది.
- source_word: אָנֶה וָאָנָה
  choice: ఎక్కడికీ
  rationale: ‘ఇక్కడికీ అక్కడికీ’ అనే హెబ్రీయ జాతీయానికి సందర్భానుగుణమైన సహజ తెలుగు సమానార్థకం; సంపూర్ణ నిరాకరణ బలాన్ని నిలుపుతుంది.
