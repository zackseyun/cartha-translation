translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నీ సేవకుడు’ అనే వినయసూచక స్వీయసంబోధనను, అలాగే ప్రశ్నలోని ‘ఎక్కడి నుండి’ అనే మూల దిశార్థాన్ని నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
