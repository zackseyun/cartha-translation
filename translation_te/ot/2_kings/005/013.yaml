id: 2KI.5.13
reference: 2 Kings 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֣וּ עֲבָדָי/ו֮ וַ/יְדַבְּר֣וּ אֵלָי/ו֒ וַ/יֹּאמְר֗וּ אָבִי֙ דָּבָ֣ר גָּד֗וֹל הַ/נָּבִ֛יא דִּבֶּ֥ר אֵלֶ֖י/ךָ הֲ/ל֣וֹא תַעֲשֶׂ֑ה וְ/אַ֛ף כִּֽי אָמַ֥ר אֵלֶ֖י/ךָ רְחַ֥ץ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: te
  text: 'అప్పుడు అతని సేవకులు దగ్గరకు వచ్చి అతనితో ఇలా అన్నారు: “నా తండ్రీ, ప్రవక్త నీకు ఏదైనా గొప్ప కార్యం చేయమని చెప్పి ఉంటే, నీవు దాన్ని చేసేవాడివి కాదా? మరి, ‘కడుక్కో, శుద్ధుడవు[a]’ అని ఆయన నీతో చెప్పినప్పుడు, నీవు ఇంకెంత ఎక్కువగా చేయాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధిగా అవు.” హీబ్రూ పదం శుద్ధస్థితిలోకి రావడం లేదా శుద్ధిగా కావడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: దగ్గరకు వచ్చి
  rationale: సమీపించడాన్ని సూచించే נגשׁ భావాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: ఈ సందర్భంలో నయమాను అధీనంలో ఉన్న పరిచారకులను సూచిస్తుంది; వారి బానిస స్థితిని అనవసరంగా నిర్ధారించకుండా సంబంధాన్ని సహజంగా తెలుపుతుంది.
- source_word: אָבִי
  choice: నా తండ్రీ
  rationale: ఇది అక్షరార్థ బంధుత్వం కాదు; అధీనులు తమ పైవానిని గౌరవంగా, ఆప్యాయంగా సంబోధించే రూపకం. మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: דָּבָר גָּדוֹל
  choice: ఏదైనా గొప్ప పని
  rationale: కష్టమైన లేదా అసాధారణమైన కార్యాన్ని చేయమనే ఆజ్ఞ అనే సందర్భార్థాన్ని తెలుపుతూ, సాధారణమైన స్నాన ఆజ్ఞతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: నీవు దాన్ని చేసేవాడివి కాదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్న బలాన్ని తెలుగులో నిలుపుతుంది.
- source_word: וְאַף כִּי
  choice: అలాంటప్పుడు … మరెంతగా
  rationale: గొప్ప పని నుంచి సులభమైన పనికి చేసే బలమైన తార్కిక పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רְחַץ
  choice: స్నానం చేసి
  rationale: ఈ సందర్భంలో యొర్దానులో మునిగి కడుక్కోవాలనే ఆజ్ఞను ‘కడుక్కో’ కంటే సహజంగా సూచిస్తుంది.
- source_word: וּטְהָר
  choice: శుద్ధుడివి కా
  rationale: శారీరక వ్యాధి తొలగడం, శుద్ధత పొందడం అనే రెండు ప్రతిధ్వనులనూ నిలుపుతుంది; కేవలం ‘బాగుపడు’ అని పరిమితం చేయదు.
theological_decisions:
- issue: నయమాను స్వస్థతలో טהר పదం యొక్క భావపరిధి
  choice: శుద్ధుడివి కా
  alternative: శుద్ధపరచబడతావు
  rationale: హీబ్రూ రూపం శుద్ధస్థితిని పొందడం లేదా శుద్ధపరచబడడం అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠం శారీరక స్వస్థతతోపాటు శుద్ధత భావాన్ని నిలుపుతుంది; కర్తను అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు స్పష్టమైన కథనశైలి. ‘నా తండ్రీ’ అనే మూల రూపక సంబోధనను నిలిపి, అలంకారప్రశ్నను సహజ తెలుగు వాక్యనిర్మాణంలో అందించింది.
