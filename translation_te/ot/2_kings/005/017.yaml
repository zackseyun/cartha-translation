  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: te
  text: అప్పుడు నయమాను, “అలా కాకపోతే, దయచేసి నీ సేవకునికి ఒక జత కంచరగాడిదలు మోయగలిగినంత మట్టి[a][c] ఇవ్వనిమ్ము. ఎందుకంటే ఇకపై నీ సేవకుడు ఇతర దేవుళ్లకు దహనబలినైనా బలినైనా అర్పించడు; యహ్వేకే[b] అర్పిస్తాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మాటను అక్షరార్థంగా “ఒక జత కంచరగాడిదల భారం” లేదా “రెండు కంచరగాడిదల భారం” అని కూడా అనువదించవచ్చు. భావం: ఒక జత కంచరగాడిదలు మోయగలిగినంత మట్టి.'
    reason: lexical_alternative
  - marker: b
    text: “యహ్వే” అనేది హీబ్రూ దైవనామమైన YHWHకు లిప్యంతరీకరణ; కొన్ని అనువాదాలు దీనిని “ప్రభువు” అని సూచిస్తాయి.
    reason: alternative_reading
  - marker: c
    text: నయమాను ఇశ్రాయేలు మట్టిని కోరడం, పురాతన కాలంలో ఒక దేవుణ్ణి ఒక దేశంతో అనుసంధానించే భావాన్ని ప్రతిబింబించవచ్చు; లేదా ఇశ్రాయేలు మట్టిపైన యహ్వేను ఆరాధించాలనే కోరిక కావచ్చు. అయితే వచనం కారణాన్ని స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: అలా కాకపోతే
  rationale: మునుపటి వచనంలో ఎలీషా కానుకను తిరస్కరించిన దానికి నయమాను ఇస్తున్న వినయపూర్వక, సంక్షిప్త ప్రతిస్పందనగా ఈ హీబ్రూ ప్రయోగాన్ని సందర్భానుసారంగా అనువదించింది.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: దయచేసి నీ సేవకునికి … ఇప్పించు
  rationale: నָא లోని వినయాన్ని, ‘నీ సేవకుడు’ అనే స్వీయనమ్రతను నిలుపుతూ, హీబ్రూ కర్మణి అభ్యర్థన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים
  choice: ఒక జత కంచరగాడిదలు మోయగలిగినంత
  rationale: అక్షరార్థమైన ‘ఒక జత కంచరగాడిదల మోత’ కన్నా, ఉద్దేశించిన పరిమాణాన్ని స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: אֲדָמָה
  choice: మట్టి
  rationale: ఇశ్రాయేలు దేశం నుంచి తీసుకువెళ్లగల నేలను సూచించడానికి ‘మట్టి’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: עֹלָה וָזֶבַח
  choice: దహనబలిగానీ మరే బలిగానీ
  rationale: עֹלָה అనే ప్రత్యేక బలిని ‘దహనబలి’గా, זֶבַח అనే విస్తృత బలి పదాన్ని సందర్భంలో భేదం స్పష్టమయ్యేలా ‘మరే బలి’గా తెలిపింది.
- source_word: כִּי אִם לַיהוָה
  choice: యహ్వేకే
  rationale: כִּי אִם తెలిపే బలమైన మినహాయింపు మరియు ఏకైక ఆరాధన భావాన్ని ‘-కే’ ద్వారా సంక్షిప్తంగా నిలిపింది.
- source_word: יהוה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా నిలుపుతుంది; పాఠకులకు దాని స్వరూపాన్ని పాదసూచిక వివరిస్తుంది.
- issue: నయమాను ఇశ్రాయేలు మట్టిని కోరడానికి గల కారణం
  choice: ప్రధాన పాఠ్యంలో కారణాన్ని వివరించకుండా అభ్యర్థనను మాత్రమే అనువదించడం
  alternative: బలిపీఠపు పునాది కోసం లేదా ఇశ్రాయేలు నేలపైనే ఆరాధించాలనే నమ్మకంతో అని స్పష్టీకరించడం
  rationale: మూలవచనం మట్టిని కోరడాన్ని యహ్వేకు మాత్రమే బలి అర్పించాలనే సంకల్పంతో కలుపుతుంది గాని, అతని ఉద్దేశాన్ని ఖచ్చితంగా చెప్పదు; అందువల్ల సాధ్యమైన నేపథ్యాలను పాదసూచికకే పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. నయమాను వినయాన్ని ‘నీ సేవకుడు’ అనే పునరుక్తితో నిలిపింది. బలి సంబంధ పదజాలంలో ‘దహనబలి’ వంటి స్థిరమైన బైబిలు పదాన్ని ఉంచినా, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది.
