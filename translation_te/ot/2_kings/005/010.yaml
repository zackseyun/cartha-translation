source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: te
  text: 'అప్పుడు ఎలీషా అతని దగ్గరికి ఈ మాటతో ఒక సందేశకుణ్ణి పంపించాడు: “వెళ్లి యొర్దాను నదిలో ఏడుసార్లు స్నానం చేయి. అప్పుడు నీ శరీరం మునుపటి స్థితికి వస్తుంది[a], నీవు శుద్ధుడవుతావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ మాంసం నీకు తిరిగి వస్తుంది.’ ఈ హీబ్రూ నుడికారం శరీరం మునుపటి ఆరోగ్యస్థితికి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు శుద్ధి చేయబడతావు.’ ఈ క్రియ శుభ్రం లేదా పవిత్రం కావడాన్ని సూచించగలదు; ఇక్కడ శారీరక, ఆచార సంబంధ భావాలు రెండూ ప్రతిధ్వనిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: అతని దగ్గరికి ... పంపి
  rationale: ఎలీషా నయమాను వద్దకు ఒక వ్యక్తిని పంపిన దిశార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַלְאָךְ
  choice: సందేశకుణ్ణి
  rationale: ఈ మానవ కథన సందర్భంలో ఇది పరలోక దూతను కాక, సందేశం తీసుకెళ్లే మనిషిని సూచిస్తుంది. ‘సందేశకుడు’ ఆ అర్థాన్ని సందిగ్ధత లేకుండా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: అని చెప్పించాడు
  rationale: హీబ్రూ మాటల పరిచయ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, సందేశకుని ద్వారా ఎలీషా పలికించిన మాటలుగా చూపుతుంది.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: వెళ్లి ... స్నానం చేయి
  rationale: ఆజ్ఞార్థక బలాన్నీ, వెళ్లడం తరువాత కడుక్కోవడం అనే కార్యక్రమాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: సంఖ్యా వ్యక్తీకరణకు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: בַּיַּרְדֵּן
  choice: యొర్దాను నదిలో
  rationale: హీబ్రూలో స్థలనామం మాత్రమే ఉన్నా, తెలుగు పాఠకునికి ఇది నది అని సహజంగా స్పష్టం చేయడం అర్థాన్ని మార్చదు.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: నీ శరీరం మునుపటి స్థితికి వస్తుంది
  rationale: అక్షరార్థంగా ‘నీ మాంసం నీకు తిరిగి వస్తుంది’ అనే హీబ్రూ నుడికారాన్ని, పూర్వ ఆరోగ్యస్థితి పునరుద్ధరణ అనే భావంతో తెలుగులో సహజంగా అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּטְהָר
  choice: నీవు శుద్ధుడవుతావు
  rationale: క్రియలోని శుభ్రత, పవిత్రత అనే భౌతిక మరియు ఆచార సంబంధ ప్రతిధ్వనులను ఒక్కదానికే పరిమితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: בְּשָׂרְךָను అక్షరార్థంగా ‘మాంసం’ అని అనాలా, సందర్భానుసారంగా ‘శరీరం’ అని అనాలా
  choice: శరీరం
  alternative: మాంసం
  rationale: తెలుగులో ‘నీ మాంసం నీకు తిరిగి వస్తుంది’ అనడం అసహజంగా, వేరొక భావాన్ని సూచించేలా ఉండవచ్చు. ‘శరీరం మునుపటి స్థితికి వస్తుంది’ పునరుద్ధరణ భావాన్ని స్పష్టంగా ఇస్తుంది; మూలంలోని సజీవ నుడికారాన్ని పాదసూచిక సంరక్షిస్తుంది.
- issue: טהרను కేవలం శారీరక స్వస్థతగా అనువదించాలా, శుద్ధత భావాన్ని నిలుపాలా
  choice: నీవు శుద్ధుడవుతావు
  alternative: నీవు శుభ్రపడతావు / నీవు స్వస్థపడతావు
  rationale: ఈ సందర్భం శారీరక వ్యాధి తొలగింపును సూచించినా, హీబ్రూ క్రియలో ఆచార శుద్ధత ప్రతిధ్వని కూడా ఉంది. ‘శుద్ధుడవుతావు’ రెండింటినీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘సందేశకుడు’ మానవ మధ్యవర్తిని స్పష్టం చేస్తుంది; ‘శుద్ధుడవుతావు’ మూలంలోని భావవిస్తృతిని కాపాడుతుంది. మూలపాఠంలోని రెండు వాక్యఫలితాలను అర్ధవిరామంతో వేరు చేశాం.
