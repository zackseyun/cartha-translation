source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: te
  text: నయమాను, “దయచేసి రెండు తలాంతులు తీసుకో” అన్నాడు. అతడు గేహజీని గట్టిగా కోరాడు[a]; రెండు తలాంతుల వెండిని రెండు సంచుల్లో[b] కట్టి, వాటితో పాటు రెండు జతల బట్టలను తన సేవకుల్లో ఇద్దరికి ఇచ్చాడు. వారు వాటిని అతనికి ముందు[c] మోసుకెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి ఒత్తిడి చేశాడు”; “అతనితో పట్టుబట్టాడు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, వెండిని ఉంచిన రెండు సంచులు లేదా డబ్బు మూటలు.
    reason: cultural_note
  - marker: c
    text: లేదా, “అతని ముందు.” సందర్భంలో “అతను” గేహజీని సూచిస్తున్నట్లు ఉంది; నయమాను సేవకులు కానుకలను గేహజీకి ముందు మోసుకెళ్లారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: దయచేసి ... తీసుకో
  rationale: הוֹאֵל ఇక్కడ ఆజ్ఞను మర్యాదపూర్వకమైన అభ్యర్థనగా చేస్తుంది; ఆధునిక తెలుగులో ‘దయచేసి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది. קַח కు నేరుగా ‘తీసుకో’ అని అనువదించబడింది.
- source_word: כִּכָּרָיִם
  choice: రెండు తలాంతులు
  rationale: כִּכָּר ఒక ప్రాచీన బరువు ప్రమాణం. తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘తలాంతు’ అనే ప్రమాణపదాన్ని నిలిపాం.
- source_word: וַיִּפְרָץ בּוֹ
  choice: అతడు గేహజీని పట్టుబట్టి ఒప్పించి
  rationale: ఈ ప్రయోగం నయమాను గేహజీని కానుక స్వీకరించమని గట్టిగా ప్రోత్సహించిన భావాన్ని ఇస్తుంది. ‘పట్టుబట్టి ఒప్పించి’ అనేది ఒత్తిడి మరియు చివరకు అంగీకరింపజేయడం రెండింటినీ సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּצַר
  choice: కట్టి
  rationale: వెండిని సంచుల్లో పెట్టి భద్రంగా బిగించిన చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כִּכְּרַיִם כֶּסֶף
  choice: రెండు తలాంతుల వెండి
  rationale: వెండి పరిమాణాన్ని బరువు ప్రమాణంతో తెలిపే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: חֲרִטִים
  choice: సంచులు
  rationale: డబ్బు లేదా విలువైన వస్తువులను ఉంచే పాత్రలను సూచించే విస్తృతమైన, సహజమైన పదం.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: రెండు జతల బట్టలు
  rationale: ఈ పదబంధం మార్చుకొని ధరించడానికి సిద్ధంగా ఉన్న రెండు సంపూర్ణ దుస్తుల సమితులను సూచిస్తుంది; ‘రెండు జతల బట్టలు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: שְׁנֵי נְעָרָיו
  choice: తన సేవకుల్లో ఇద్దరు
  rationale: נַעַר యువకుడు, పరిచారకుడు లేదా సేవకుడు కావచ్చు. ఇక్కడ నయమాను ఆధీనంలో సామాను మోసే వారిని సూచిస్తున్నందున కార్యపరమైన అర్థంలో ‘సేవకులు’ ఎంచుకున్నాం.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: వారు వాటిని అతనికి ముందుగా మోసుకెళ్లారు
  rationale: ‘అతని ముందు/అతనికి ముందుగా’ అనే హీబ్రూ సంబంధాన్ని నిలుపుతూ, సందర్భంలో అవసరమైన కర్మను ‘వాటిని’గా స్పష్టం చేస్తుంది. సర్వనామ సూచనను ప్రధాన వాక్యంలో అతిగా నిర్ధారించకుండా ఉంచాం.
