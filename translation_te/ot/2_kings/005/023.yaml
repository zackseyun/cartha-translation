translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ప్రాచీన బరువు ప్రమాణమైన ‘తలాంతు’ను నిలిపి, దాని చుట్టూ ఉన్న వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా రూపొందించాం. לְפָנָיו లోని సర్వనామాన్ని ప్రధాన పాఠ్యంలో ‘అతనికి’గా ఉంచి, సందర్భానుసార సూచనను పాదటీపులో వివరించాం.
