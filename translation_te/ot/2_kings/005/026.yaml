source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: te
  text: అప్పుడు అతడు గేహజీతో[a], “ఆ మనిషి తన రథం నుండి తిరిగి నిన్ను కలవడానికి వచ్చినప్పుడు నా హృదయం వెళ్లలేదా? వెండిని తీసుకోవడానికి, వస్త్రాలను తీసుకోవడానికి, ఒలీవ తోటలను, ద్రాక్షతోటలను, గొర్రెలను, పశువులను, దాసులను, దాసీలను[b] సంపాదించుకోవడానికి ఇది సమయమా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘అతనితో’ అని మాత్రమే ఉంది; సందర్భంలో అతడు గేహజీ.
    reason: referent_clarification
  - marker: b
    text: లేదా, “సేవకులను, సేవకురాళ్లను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: నా హృదయం నీతో వెళ్లలేదా?
  rationale: హెబ్రీయుల సజీవ నుడికారాన్ని సాధ్యమైనంతగా నిలుపుతూ, సందర్భంలో ఏలీషా అంతరంగ అవగాహనను సూచిస్తుంది. ‘నీతో’ అనేది తెలుగులో భావాన్ని సహజంగా స్పష్టం చేస్తుంది; వివరణాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: ఆ మనిషి తన రథం మీదనుండి తిరిగి నిన్ను కలవడానికి వచ్చినప్పుడు
  rationale: הָפַךְ యొక్క ‘తిరుగు’ భావాన్ని నిలుపుతుంది. ‘ఆ మనిషి’ సందర్భంలోని నయమానును పేరు చేర్చకుండా సూచిస్తుంది.
- source_word: הָעֵת
  choice: ఇది సమయమా?
  rationale: హెబ్రీ పాఠంలో ప్రశ్నార్థక కణం లేకున్నా, సందర్భంలోని ప్రవచనాత్మక గద్దింపును తెలుగులో సహజమైన ప్రశ్నగా వ్యక్తపరుస్తుంది.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: వెండిని తీసుకోవడానికి
  rationale: כֶּסֶף యొక్క ప్రత్యక్ష అర్థమైన ‘వెండి’ని నిలుపుతుంది; సందర్భంలో అది ధనం లేదా చెల్లింపుగా గ్రహించవచ్చు.
- source_word: בְּגָדִים
  choice: వస్త్రాలు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం; విలువైన వస్తువుల జాబితికి సరిపోతుంది.
- source_word: זֵיתִים
  choice: ఒలీవ తోటలు
  rationale: ద్రాక్షతోటలు, మందలు, సేవకులతో కూడిన ఆస్తుల జాబితిలో పండ్లకన్నా ఉత్పాదక భూసంపదను సూచిస్తుంది.
- source_word: כְרָמִים
  choice: ద్రాక్షతోటలు
  rationale: వ్యవసాయ ఆస్తిని సహజంగా, స్పష్టంగా సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: צֹאן וּבָקָר
  choice: గొర్రెలు, పశువులు
  rationale: రెండు నిర్దిష్ట పశువర్గాలను సంక్షిప్తం చేయకుండా నిలుపుతుంది; בָקָרకు విస్తృతమైన ‘పశువులు’ సహజమైన తెలుగు ఎంపిక.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: దాసులు, దాసీలు
  rationale: హెబ్రీలోని పురుష–స్త్రీ భేదాన్ని నిలుపుతూ, ఆధారిత లేదా బంధిత సేవ అనే సామాజిక స్థితిని ‘సేవకులు’ కంటే మరింత స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לִבִּי הָלַךְ అనే అంతరంగిక సాన్నిధ్య నుడికారం
  choice: నా హృదయం నీతో వెళ్లలేదా?
  alternative: ఆ మనిషి తన రథం మీదనుండి తిరిగి నిన్ను కలిసినప్పుడు నేను ఆత్మలో అక్కడ లేనా?
  rationale: మూలంలోని ‘నా హృదయం వెళ్లింది’ అనే ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠంలో నిలుపుతూ, దాని వివరణాత్మక భావాన్ని పాదసూచికలో ఇస్తుంది; ఏలీషా జ్ఞానం ఎలా కలిగిందో సిద్ధాంతపరంగా నిర్దిష్టీకరించదు.
- issue: עֲבָדִים וּשְׁפָחוֹת యొక్క సామాజిక స్థితి
  choice: దాసులు, దాసీలు
  alternative: సేవకులు, సేవకురాళ్లు
  rationale: ఈ జాబితి సంపాదించుకునే ఆస్తులు, గృహాధీనుల గురించి కావడంతో బంధిత స్థితిని మసకబార్చకుండా, లింగభేదాన్ని కూడా నిలుపుతుంది. ప్రత్యామ్నాయం తక్కువ కఠినమైన సామాజిక అర్థాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. మూలంలోని ప్రశ్నారూప గద్దింపును, జాబితి లయను, ‘నా హృదయం వెళ్లింది’ అనే నుడికారపు ఉద్వేగాన్ని సాధ్యమైనంతగా నిలిపింది. అయితే జాబితిలోని క్రియను తెలుగులో సహజంగా చేయడానికి చివర ‘సంపాదించుకోవడానికి’ అని వాడబడింది.
