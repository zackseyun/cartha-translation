base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: te
  text: కాబట్టి అతడు దిగి వెళ్లి, దేవుని మనుష్యుడు చెప్పిన మాట ప్రకారం యొర్దాను నదిలో ఏడుసార్లు మునిగాడు.[a] అప్పుడు అతని శరీరం చిన్న బాలుడి శరీరంలా పునరుద్ధరించబడింది, అతడు శుద్ధుడయ్యాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను తాను ముంచుకున్నాడు.” హీబ్రూ క్రియ ముంచడం లేదా పూర్తిగా మునగడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు శుద్ధి చేయబడ్డాడు.” హీబ్రూ క్రియ శుద్ధస్థితికి రావడాన్ని లేదా శుద్ధి పొందిన ఫలితాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: కాబట్టి అతడు దిగి వెళ్లి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తూ, ముందు ఇచ్చిన ఆదేశానికి నయమాను స్పందించిన ఫలిత సంబంధాన్ని సూచిస్తుంది; ירד లోని కిందికి వెళ్లే భావాన్ని నిలుపుతుంది.
- source_word: וַיִּטְבֹּל
  choice: మునిగాడు
  rationale: טבל అంటే ద్రవంలో ముంచడం లేదా మునగడం. ఇక్కడ కర్త స్వయంగా నదిలో ఆ చర్య చేసినందున సహజమైన తెలుగు రూపం వాడబడింది; ఖచ్చితమైన విధానాన్ని అతిగా నిర్దేశించదు.
- source_word: בַּיַּרְדֵּן
  choice: యొర్దాను నదిలో
  rationale: తెలుగులో స్థలనామం మాత్రమే వాడితే స్పష్టత తగ్గవచ్చు కాబట్టి, మూలంలో సూచితమైన నదిని సహజంగా స్పష్టం చేసింది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: పునరావృత చర్యను తెలిపే సరళమైన సంఖ్యా వ్యక్తీకరణ.
- source_word: כִּדְבַר
  choice: చెప్పిన మాట ప్రకారం
  rationale: דבר లోని ‘మాట/ఆదేశం’ భావాన్ని ఉంచుతూ, అతడు పలికిన నిర్దేశానికి అనుగుణంగా చేసినట్టు సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ బైబిలులో ప్రవక్తకు వాడే ప్రామాణిక బిరుదును యథాశక్తి నేరుగా నిలుపుతుంది.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: అతని శరీరం ... తిరిగి మృదువైంది
  rationale: שׁוב లోని ‘తిరిగి రావడం’ భావాన్ని నిలుపుతూ, בשר ను సహజ తెలుగులో ‘శరీరం’గా ఇచ్చింది. పోలికలోని బాలుని శరీర స్వభావం తెలుగులో అర్థమయ్యేలా ‘మృదువైంది’ అని వ్యక్తం చేసింది.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: చిన్న బాలుడి శరీరంలా
  rationale: נער קטן లోని చిన్నవయసు బాలుడనే స్పష్టమైన, సజీవమైన పోలికను నిలుపుతుంది; בשר కు రెండుచోట్లా ఒకే పదం వాడింది.
- source_word: וַיִּטְהָר
  choice: అతడు శుద్ధుడయ్యాడు
  rationale: טהר యొక్క ‘శుద్ధస్థితికి రావడం’ అనే ఫలితార్థాన్ని ఇస్తుంది; కేవలం వైద్యపరమైన ‘స్వస్థపడ్డాడు’గా పరిమితం చేయకుండా శారీరక, శుద్ధత భావాల రెండింటికీ చోటిస్తుంది.
theological_decisions:
- issue: నయమాను పొందిన పునరుద్ధరణ స్వభావం
  choice: శరీర పునరుద్ధరణను, శుద్ధస్థితికి రావడాన్ని రెండింటినీ వ్యక్తం చేయడం
  alternative: దీనిని కేవలం ‘స్వస్థపడ్డాడు’ అని వైద్యార్థానికే పరిమితం చేయడం, లేదా ప్రధాన వాక్యంలో ఆచారశుద్ధిని మాత్రమే ముందుకు తేవడం
  rationale: వచనం శరీరం తిరిగి రావడాన్ని, అతడు శుద్ధుడవడాన్ని రెండింటినీ చెబుతుంది. ఏదో ఒక ప్రత్యేక మతసిద్ధాంతాన్ని చేర్చకుండా ఆ ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘దేవుని మనిషి’ అనే బైబిలీయ బిరుదు నిలుపబడింది. ‘శుద్ధుడయ్యాడు’ అనే పదం వైద్య స్వస్థతను మాత్రమే కాక శుద్ధతకు సంబంధించిన మూలార్థాన్నీ తెరిచి ఉంచుతుంది.
