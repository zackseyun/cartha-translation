revisions:
- from: కాబట్టి అతడు దిగి వెళ్లి, దేవుని మనిషి చెప్పిన మాట ప్రకారం యొర్దాను నదిలో ఏడుసార్లు మునిగాడు.[a] అప్పుడు అతని శరీరం చిన్న బాలుడి శరీరంలా తిరిగి మృదువైంది; అతడు శుద్ధుడయ్యాడు.[b]
  to: కాబట్టి అతడు దిగి వెళ్లి, దేవుని మనుష్యుడు చెప్పిన మాట ప్రకారం యొర్దాను నదిలో ఏడుసార్లు మునిగాడు.[a] అప్పుడు అతని శరీరం చిన్న బాలుడి శరీరంలా పునరుద్ధరించబడింది, అతడు శుద్ధుడయ్యాడు.[b]
  rationale: The revision removes the added notion that Naaman’s body became ‘soft’ and instead states the source’s restoration comparison directly. It also uses the established Telugu biblical title ‘దేవుని మనుష్యుడు.’ The sevenfold immersion, bodily restoration, and final cleansing/purity are all retained, and both lexical-alternative footnotes remain anchored to the relevant expressions.
