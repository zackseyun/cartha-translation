  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: te
  text: 'అతడు ఆ ఉత్తరాన్ని ఇశ్రాయేలు రాజు వద్దకు తీసుకొచ్చాడు. అందులో ఇలా రాసి ఉంది: “ఇప్పుడు ఈ ఉత్తరం నీకు అందినప్పుడు, ఇదిగో, నా సేవకుడైన నయమానును నీ వద్దకు పంపాను; అతని చర్మవ్యాధి నుండి అతన్ని విడిపించు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అసాధారణంగా, “అతన్ని అతని చర్మవ్యాధి నుండి కూడదీయి/తీసివేయి” అనే భావం ఉంది; అంటే ఆ బాధ నుండి అతన్ని స్వస్థపరచడం. సంప్రదాయంగా, “అతని కుష్ఠువ్యాధిని నయం చేయి” అని కూడా అనువదిస్తారు.
    reason: אָסַף מן అనే అసాధారణ హీబ్రూ ప్రయోగం యొక్క పదసంబంధ చిత్రణను తప్పుదారి పట్టించకుండా సూచించడం, అలాగే צָרַעַתకు సంప్రదాయ ప్రత్యామ్నాయాన్ని భద్రపరచడం.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: తీసుకొచ్చాడు
  rationale: హిఫీల్ రూపంలో ‘ఉత్తరం’ కర్మగా ఉంది; కాబట్టి కారణార్థాన్ని సహజమైన తెలుగులో ‘తీసుకొచ్చాడు’ అని వ్యక్తపరుస్తుంది.
- source_word: הַסֵּפֶר
  choice: ఉత్తరం
  rationale: ఇద్దరు రాజుల మధ్య పంపిన లిఖిత సందేశం అనే సందర్భార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: అందులో ఇలా రాసి ఉంది
  rationale: ఇక్కడ తరువాత వచ్చేది ఉత్తరంలోని మాటలు. తెలుగులో ‘అని చెబుతూ’ కంటే ఈ రూపం సందర్భానికి సహజంగా ఉంటుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: రాజకీయ ఉత్తరంలోని సంధాన సూచకాన్ని సహజంగా నిలుపుతుంది; హీబ్రూలోని ప్రారంభ וְను ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం తెలుగులో అనవసరం.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: ఈ ఉత్తరం నీకు అందినప్పుడు
  rationale: כְּతో కూడిన క్రియానామ రూపం కాలార్థాన్ని ఇస్తుంది; ‘అందినప్పుడు’ తెలుగులో ఉత్తరం చేరడాన్ని సహజంగా తెలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయపు గంభీరమైన బలాన్ని నిలుపుతుంది.
- source_word: שָׁלַחְתִּי
  choice: పంపాను
  rationale: ఉత్తరం అందే సమయానికి పూర్తయిన పంపకాన్ని తెలుగు భూతకాల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: נַעֲמָן
  choice: నయమాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణను అనుసరిస్తుంది.
- source_word: עַבְדִּי
  choice: నా సేవకుడైన
  rationale: రాజసభకు చెందిన అధీనుడు లేదా అధికారి అనే విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలపదాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַאֲסַפְתּוֹ
  choice: అతన్ని విడిపించు
  rationale: אָסַף సాధారణంగా ‘సమకూర్చు/చేర్చు’ అని అర్థమైనా, מן + వ్యాధి నిర్మాణంలో వ్యాధిని తొలగించి వ్యక్తిని దాని నుండి బయటకు తేవడం అనే అసాధారణ ప్రయోగం ఉంది. అక్షరార్థపు విచిత్రతను పాదసూచికలో ఉంచి, ప్రధాన వాక్యంలో సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: מִצָּרַעְתּוֹ
  choice: అతని చర్మవ్యాధి నుండి
  rationale: צָרַעַת ఆధునిక హాన్సెన్ వ్యాధితో మాత్రమే సమానం కాదు; ‘చర్మవ్యాధి’ దాని విస్తృత బైబిలు అర్థాన్ని వైద్యపరంగా అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: צָרַעַת పదానికి అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠువ్యాధి
  rationale: హీబ్రూ పదం ఆధునిక కుష్ఠువ్యాధికన్నా విస్తృతమైన చర్మ సంబంధిత స్థితులను సూచించగలదు. అందువల్ల ప్రధాన పాఠ్యంలో వైద్యపరమైన అనాకాలిక నిర్దిష్టతను నివారించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: אָסַף מן అనే అసాధారణ ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘విడిపించు’; అక్షరార్థాన్ని పాదసూచికలో చూపడం
  alternative: అతన్ని అతని చర్మవ్యాధి నుండి సమకూర్చు/చేర్చు
  rationale: మూలంలోని అసాధారణ రూపకాన్ని పూర్తిగా దాచకుండా పాదసూచికలో భద్రపరుస్తుంది; అదే సమయంలో ప్రధాన తెలుగు వాక్యం సాధారణ పాఠకుడికి అర్థవంతంగా ఉంటుంది. ‘స్వస్థపరచు’ అని చెప్పడం భావాన్ని మరీ త్వరగా నిర్దిష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. రాజ ఉత్తరంలోని అధికారిక స్వరాన్ని ‘ఇదిగో’ నిలుపుతుంది. ‘అందులో ఇలా రాసి ఉంది’ అనే రూపం ఉల్లేఖనానికి తెలుగులో స్పష్టమైన పరిచయాన్ని ఇస్తుంది.
