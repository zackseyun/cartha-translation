source:
  edition: WLC
  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: te
  text: 'యూదా గురించి అతడు ఇలా అన్నాడు:


    “యాహ్వే, యూదా స్వరాన్ని ఆలకించు;

    అతణ్ణి తన ప్రజల దగ్గరికి తీసుకురా.

    అతని చేతులు అతని కోసం పోరాడుగాక[a];

    అతని విరోధులకు ఎదురు నీవు అతనికి సహాయంగా ఉండు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని చేతులు అతనికి చాలుగాక.” ఈ హెబ్రీ వాక్యభాగం క్లిష్టమైనది; దీనిని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: యూదా గురించి అతడు ఇలా అన్నాడు
  rationale: ఇది తదుపరి గోత్ర ఆశీర్వాదాన్ని పరిచయం చేస్తుంది. לְ ను ఇక్కడ విషయసూచకంగా తీసుకొని సహజమైన తెలుగు వాక్యంగా అనువదించాం.
- source_word: שְׁמַע יְהוָה
  choice: యాహ్వే, ... ఆలకించు
  rationale: ఇది యాహ్వేను నేరుగా సంబోధించే ప్రార్థనాత్మక ఆజ్ఞ. ‘ఆలకించు’ అనేది కేవలం వినడం కాక, ప్రార్థనను శ్రద్ధగా విని స్పందించాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קוֹל יְהוּדָה
  choice: యూదా స్వరాన్ని
  rationale: קוֹל యొక్క ప్రాథమిక రూపకాన్ని నిలిపి, ‘మొర’ అని అర్థాన్ని మరీ నిర్దిష్టం చేయకుండా ఉంచాం.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: అతణ్ణి తన ప్రజల దగ్గరికి తీసుకురా
  rationale: హిఫీల్ క్రియ యొక్క ‘తీసుకురా’ అనే భావాన్ని నిలిపాం. ఇది యుద్ధం నుండి తిరిగి చేర్చడమా లేక ప్రజల మధ్యకు చేర్చడమా అన్నది నిర్ధారించదు.
- source_word: יָדָיו רָב לוֹ
  choice: అతని చేతులు అతని పక్షంగా పోరాడుగాక
  rationale: క్లిష్టమైన ఈ సంక్షిప్త హెబ్రీ వాక్యంలో רָב ను పోరాడడం/పెనుగులాడడం అనే భావంలో గ్రహించాం. ‘చేతులు’ అనే మూలభాషా రూపకాన్ని నిలిపి, తరువాతి విరోధుల ప్రస్తావనతో ఉన్న సమాంతరతను కాపాడాం.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: అతని విరోధులకు ఎదురు నీవు అతనికి సహాయంగా ఉండు
  rationale: מִן ను ఇక్కడ ప్రతికూల సంబంధంలో ‘ఎదురు’ అని తీసుకున్నాం. స్త్రీలింగ ఏకవచన క్రియకు భావింపబడిన కర్త యాహ్వేనే అని తెలుగు వాక్యంలో స్పష్టం చేశాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: హెబ్రీ మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- issue: క్లిష్టమైన יָדָיו רָב לוֹ వాక్యభాగం
  choice: అతని చేతులు అతని పక్షంగా పోరాడుగాక
  alternative: అతని చేతులు అతనికి చాలుగాక
  rationale: యుద్ధసందర్భానికీ తరువాతి సహాయవిన్నపానికీ ప్రధాన పఠనం సరిపోతుంది. అయితే హెబ్రీ నిర్మాణం అనేక విధాలుగా అర్థం చేసుకోదగినందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కవిత్వానికి తగిన గౌరవప్రదమైన కాని సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. మూలంలోని పంక్తుల సమాంతరతను సాధ్యమైనంత వరకు నిలిపాం.
