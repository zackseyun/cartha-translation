  text: לְ/בִנְיָמִ֣ן אָמַ֔ר יְדִ֣יד יְהֹוָ֔ה יִשְׁכֹּ֥ן לָ/בֶ֖טַח עָלָ֑י/ו חֹפֵ֤ף עָלָי/ו֙ כָּל הַ/יּ֔וֹם וּ/בֵ֥ין כְּתֵיפָ֖י/ו שָׁכֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: te
  text: 'బెన్యామీను గురించి అతడు ఇలా అన్నాడు:


    “యెహోవాకు ప్రియమైనవాడు


    ఆయన సమీపంలో సురక్షితంగా నివసిస్తాడు.[a]


    ఆయన దినమంతా అతణ్ణి కప్పి కాపాడుతాడు;


    భుజాల మధ్య నివసిస్తాడు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పక్కన సురక్షితంగా నివసిస్తాడు,” “ఆయన కింద సురక్షితంగా నివసిస్తాడు,” లేదా “ఆయన మీద సురక్షితంగా నివసిస్తాడు.” ఇక్కడి హెబ్రీ విభక్తి సమీపతను గానీ, రక్షణాత్మక పర్యవేక్షణను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “అతని భుజాల మధ్య నివసిస్తాడు.” “నివసిస్తాడు” అనే క్రియకు కర్తను హెబ్రీ స్పష్టంగా పేర్కొనదు; “అతని” ఎవరిని సూచిస్తుందో కూడా వివాదాస్పదం. దీనిని బెన్యామీను యెహోవా రక్షణలో సన్నిహితంగా నివసిస్తున్నాడని, లేదా యెహోవా బెన్యామీను భుజాల మధ్య నివసిస్తున్నాడని అర్థం చేసుకోవచ్చు. “భుజాలు” బెన్యామీను కొండప్రాంతాలను లేదా అతని భూభాగంలోని పరిశుద్ధస్థలాన్ని సూచిస్తాయని కూడా కొందరు భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: బెన్యామీను గురించి
  rationale: గోత్ర ఆశీర్వాదాన్ని పరిచయం చేసే సందర్భంలో ‘గురించి’ సహజమైన తెలుగు; హెబ్రీలోని ‘కు/కొరకు’ భావసాధ్యతను సందర్భానుగుణంగా శీర్షికాత్మకంగా అందిస్తుంది.
- source_word: יְדִיד יְהוָה
  choice: యెహోవాకు ప్రియమైనవాడు
  rationale: יְדִיד అనే పదంలోని ప్రేమింపబడిన, ప్రియమైన వ్యక్తి అనే ఆప్యాయ భావాన్ని నిలుపుతుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఇస్తుంది.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: సురక్షితంగా నివసిస్తాడు
  rationale: שׁכן లోని నివాస భావాన్నీ, לָבֶטַח లోని భద్రత భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: ఆయన సమీపంలో
  rationale: עַל ఇక్కడ సూచించగల సమీపత లేదా రక్షణాత్మక ఆధిపత్యంలో ఏ ఒక్కదాన్నీ అతిగా నిర్ధారించకుండా ప్రధాన పాఠంలో సహజంగా ఉంచి, ఇతర సాధ్యతలను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: חֹפֵף עָלָיו
  choice: అతణ్ణి కప్పి కాపాడుతాడు
  rationale: కప్పడం అనే మూల చిత్రాన్నీ, సందర్భంలోని రక్షణ భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: כָּל הַיּוֹם
  choice: దినమంతా
  rationale: ‘రోజంతా’ కంటే కొద్దిగా కవితాత్మక గౌరవాన్ని కలిగి ఉండి, ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: అతడు ఆయన భుజాల మధ్య నివసిస్తాడు
  rationale: ‘భుజాల మధ్య’ అనే ప్రత్యక్ష కవితా చిత్రాన్ని, పునరావృతమైన నివాస భావాన్ని నిలుపుతుంది; సర్వనామాల నిర్దేశంలోని అస్పష్టతను పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: వచనంలోని సర్వనామాలు ఎవరిని సూచిస్తున్నాయి?
  choice: ప్రధాన పాఠంలో ప్రియమైనవాడైన బెన్యామీను యెహోవా సమీపంలో నివసిస్తున్నాడనీ, యెహోవా అతణ్ణి కాపాడుతున్నాడనీ, చివరలో బెన్యామీను యెహోవా భుజాల మధ్య నివసిస్తున్నాడనీ చదవబడింది.
  alternative: యెహోవా బెన్యామీను మీద నివసించి, బెన్యామీను భుజాల మధ్య నివసిస్తున్నాడని కూడా హెబ్రీ కవితా సంక్షిప్తతను బట్టి అర్థం చేసుకోవచ్చు.
  rationale: హెబ్రీ సర్వనామ ప్రత్యయాలు మరియు కవితా నిర్మాణం ఒకటి కంటే ఎక్కువ అన్వయాలకు వీలు కల్పిస్తాయి. ప్రధాన పాఠం సహజమైన రక్షణ చిత్రాన్ని ఇస్తుంది; పాదటిప్పణి ప్రత్యామ్నాయ అన్వయాన్ని సంరక్షిస్తుంది.
- issue: ‘భుజాల మధ్య’ అనే చిత్రం
  choice: మానవరూపక కవితా చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: బెన్యామీను కొండప్రాంతాలు లేదా అతని భూభాగంలోని పరిశుద్ధస్థలాన్ని సూచించే భౌగోళిక రూపకంగా అర్థం చేసుకోవడం
  rationale: మూలపాఠంలోని ప్రత్యక్ష చిత్రం అనువాదంలో నిలవాలి; భౌగోళిక వ్యాఖ్యానం సాధ్యమైనదే కాని ప్రధాన పాఠంలో దానిని నిర్బంధించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘యెహోవా’ అనే వ్యక్తిగత దైవనామం నిలుపబడింది. హెబ్రీ పునరుక్తి, రక్షణ చిత్రం, సర్వనామ అస్పష్టత సాధ్యమైనంతవరకు సంరక్షించబడ్డాయి.
