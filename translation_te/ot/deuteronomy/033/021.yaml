revisions:
- from: అతడు తన కోసం శ్రేష్ఠమైన భూభాగాన్ని ఎంచుకున్నాడు[a]; ఎందుకంటే అక్కడ పాలకుని వంతు ప్రత్యేకంగా ఉంచబడింది. అతడు ప్రజల నాయకులతో కలిసి వచ్చాడు; యెహోవా నీతిని[b] నెరవేర్చాడు, ఇశ్రాయేలుతో కలిసి ఆయన న్యాయనిర్ణయాలను అమలు చేశాడు.
  to: అతడు తన కోసం శ్రేష్ఠమైన భూభాగాన్ని ఎంచుకున్నాడు[a], ఎందుకంటే అక్కడ పాలకునికి కేటాయించి ఉంచబడిన వంతు ఉంది[b]. అతడు ప్రజల నాయకులతో కలిసి వచ్చాడు; యెహోవా నీతినీ, ఇశ్రాయేలుతో కలిసి ఆయన న్యాయవిధులనూ అమలు చేశాడు[c].
  rationale: సవరణ హీబ్రూ వాక్యంలోని ఒకే క్రియతో కూడిన సమాంతర కర్మనిర్మాణాన్ని తెలుగులో నిలుపుతుంది. ‘కేటాయించి ఉంచబడిన వంతు’ సָפוּן యొక్క ‘భద్రపరచి/ప్రత్యేకించి ఉంచబడిన’ భావాన్ని స్పష్టంగా ఇస్తుంది. రֵאשִׁית మరియు מְחֹקֵקలకు సంబంధించిన వివాదాస్పద ప్రత్యామ్నాయాలను వేర్వేరు పాదసూచికలలో ఉంచి, ప్రధాన పాఠం సందిగ్ధతను అనవసరంగా పరిష్కరించకుండా కాపాడుతుంది.
