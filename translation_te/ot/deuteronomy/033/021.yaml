id: DEU.33.21
reference: Deuteronomy 33:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: te
  text: అతడు తన కోసం శ్రేష్ఠమైన భూభాగాన్ని ఎంచుకున్నాడు[a], ఎందుకంటే అక్కడ పాలకునికి కేటాయించి ఉంచబడిన వంతు ఉంది[b]. అతడు ప్రజల నాయకులతో కలిసి వచ్చాడు; యెహోవా నీతినీ, ఇశ్రాయేలుతో కలిసి ఆయన న్యాయవిధులనూ అమలు చేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శ్రేష్ఠమైన భూభాగం”కు బదులు “మొదటి భాగం” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “పాలకుడు”కు బదులు “ధర్మశాసనకర్త” అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి ఈ రెండు అర్థాలూ ఉండవచ్చు; కొందరు దీనిని మోషేకు సూచనగా భావిస్తారు.
    reason: alternative_reading
  - marker: c
    text: “యెహోవా న్యాయం” లేదా “యెహోవా నీతికార్యాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: ఎంచుకున్నాడు
  rationale: క్రియకు అక్షరార్థంగా ‘చూశాడు’ అనే భావం ఉన్నా, ‘తన కోసం చూచుకోవడం’ అనే సందర్భోచిత ప్రయోగం ఎంపిక చేసుకోవడాన్ని సూచిస్తుంది.
- source_word: רֵאשִׁית
  choice: శ్రేష్ఠమైన భూభాగం
  rationale: ఇక్కడ కాలపరమైన ‘ఆరంభం’ కంటే గాదుకు దక్కిన ప్రధానమైన లేదా మేలైన భూవంతు ఉద్దేశించబడినట్లు సందర్భం సూచిస్తుంది.
- source_word: חֶלְקַת
  choice: వంతు
  rationale: పంచిపెట్టబడిన భూభాగం లేదా స్వాస్థ్యంలోని వాటాను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְחֹקֵק
  choice: పాలకుడు
  rationale: ఈ పదానికి ‘పాలకుడు’ లేదా ‘ధర్మశాసనకర్త’ అనే అర్థాలు ఉండవచ్చు. నిర్దిష్టంగా మోషేను సూచిస్తున్నదని తేల్చకుండా అధికారస్థుడనే సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: סָפוּן
  choice: ప్రత్యేకంగా ఉంచబడింది
  rationale: దాచబడినది లేదా భద్రపరచబడినది అనే మూలభావాన్ని, ఎవరికో కేటాయించి ఉంచిన భూవంతు అనే సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֵּתֵא
  choice: వచ్చాడు
  rationale: బయలుదేరడం లేదా రావడం అనే చలనభావాల్లో, తరువాతి నాయకుల ప్రస్తావనతో ‘వచ్చాడు’ సహజంగా సరిపోతుంది.
- source_word: רָאשֵׁי עָם
  choice: ప్రజల నాయకులు
  rationale: అక్షరార్థమైన ‘ప్రజల తలలు’ అనే రూపకానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: צִדְקַת יְהוָה
  choice: యెహోవా నీతి
  rationale: నీతిని, న్యాయాన్ని లేదా నీతికార్యాలను సూచించగల సంక్షిప్త హీబ్రూ నిర్మాణాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: וּמִשְׁפָּטָיו
  choice: ఆయన న్యాయనిర్ణయాలు
  rationale: యెహోవా ఇచ్చిన న్యాయపరమైన తీర్పులు లేదా విధులను గంభీరంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో కలిసి
  rationale: ‘తో’ అనే ఉపసర్గార్థాన్ని నేరుగా నిలుపుతూ, మిగతా ఇశ్రాయేలుతో కలసి చేసిన కార్యమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: מְחֹקֵק అనే పదం ఎవరిని సూచిస్తుంది, దాని భావం ఏమిటి?
  choice: నిర్దిష్ట వ్యక్తిని గుర్తించకుండా ‘పాలకుడు’ అని అనువదించబడింది.
  alternative: ‘ధర్మశాసనకర్త’—ఇది మోషేను సూచించవచ్చని కొందరు భావిస్తారు; లేదా ‘అధిపతి’.
  rationale: హీబ్రూ వాక్యం సంక్షిప్తమై వివాదాస్పదంగా ఉంది. మోషే అని పాఠం స్పష్టంగా చెప్పనందున ఆ గుర్తింపును ప్రధాన అనువాదంలో చేర్చకుండా, సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం పాఠంలోని సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. హీబ్రూ కవిత్వంలోని సంక్షిప్తతను పూర్తిగా సులభీకరించకుండా, సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం ఇచ్చబడింది. దైవనామం יהוה ను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘యెహోవా’గా ఇచ్చాం.
