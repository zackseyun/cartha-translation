source:
  edition: WLC
  text: אֵ֥ין כָּ/אֵ֖ל יְשֻׁר֑וּן רֹכֵ֤ב שָׁמַ֨יִם֙ בְ/עֶזְרֶ֔/ךָ וּ/בְ/גַאֲוָת֖/וֹ שְׁחָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: te
  text: 'యెషూరూనూ[a], దేవునితో సమానమైనవాడు ఎవరూ లేరు;


    నీకు సహాయం చేయడానికి[b] ఆయన ఆకాశాలపై స్వారీ చేస్తాడు,


    తన మహిమతో ఆకాశమండలాలపై[c] స్వారీ చేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యెషూరూను’ అనేది ఇశ్రాయేలుకు వాడిన కావ్యాత్మక పేరు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘నీ సహాయార్థం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మేఘమండలాలపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: దేవునివంటివాడు ఎవరూ లేరు
  rationale: అస్తిత్వ నిరాకరణతో కూడిన సంపూర్ణ పోలికను సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది. אֵל‌ను ఇక్కడ ప్రత్యేక నామంగా కాక సాధారణ దైవపదంగా తీసుకున్నాం.
- source_word: יְשֻׁרוּן
  choice: యెషూరూనూ
  rationale: ఇది ఇశ్రాయేలుకు వాడిన కావ్యాత్మక నామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించాం; సంబోధనను ‘ఊ’తో స్పష్టం చేశాం.
- source_word: רֹכֵב
  choice: స్వారీ చేస్తాడు … సాగుతాడు
  rationale: దేవుడు ఆకాశమండలంపై ప్రయాణించే ఉన్నతమైన కావ్యచిత్రాన్ని ‘స్వారీ చేస్తాడు’ నిలుపుతుంది. రెండో సమాంతర భాగం తెలుగులో అసంపూర్ణంగా అనిపించకుండా ‘సాగుతాడు’ను పూరించాం.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచనాన్ని, కావ్యాత్మక విశాలతను నిలుపుతుంది.
- source_word: בְעֶזְרֶךָ
  choice: నీకు సహాయం చేయడానికి
  rationale: בְּ + עֵזֶר ఇక్కడ ప్రయోజనం లేదా లబ్ధిని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וּבְגַאֲוָתוֹ
  choice: తన మహిమతో
  rationale: దేవుని సందర్భంలో גַּאֲוָה అహంకారాన్ని కాక ఔన్నత్యాన్ని, మహిమాన్వితత్వాన్ని సూచిస్తుంది.
- source_word: שְׁחָקִים
  choice: మేఘమండలాలు
  rationale: ఇది పై ఆకాశం లేదా మేఘాల ప్రాంతాన్ని సూచించే కావ్యపదం. ‘మేఘమండలాలు’ שָׁמַיִם‌తో ఉన్న సమాంతరతను కాపాడుతూ పదభేదాన్ని కూడా చూపుతుంది.
theological_decisions:
- issue: אֵל అనే పదం ప్రత్యేక నామమా, సాధారణ దైవబిరుదా?
  choice: దేవుడు
  alternative: ఏల్; శక్తిమంతుడు
  rationale: ఈ వాక్యంలో ఇశ్రాయేలు దేవుని సాటిలేనితనాన్ని ప్రకటిస్తున్నారు. కాబట్టి ప్రత్యేక దేవతా నామాన్ని సూచించకుండా, సాధారణ దైవపదమైన ‘దేవుడు’ మూలభావాన్ని సహజంగా అందిస్తుంది.
- issue: ఆకాశాలపై స్వారీ చేసే కావ్యచిత్రం
  choice: చిత్రాన్ని యథాతథంగా నిలుపడం
  alternative: దేవుడు పరలోకంలో ఉన్నాడని వివరణాత్మకంగా మార్చడం
  rationale: మూలంలోని మానవరూప కావ్యచిత్రం దేవుని మహిమను, తన ప్రజలకు సహాయం చేయడానికి ఆయన రావడాన్ని తెలియజేస్తుంది; దాన్ని సిద్ధాంతపరమైన గద్యవివరణగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్యశైలిని వాడాం. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంటూనే ఆకాశాలపై స్వారీ చేసే మూలరూపకాన్ని, రెండు ఆకాశపదాల సమాంతరతను కాపాడాం.
