reference: Deuteronomy 33:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: te
  text: తన తండ్రి గురించీ తన తల్లి గురించీ, “నేను అతణ్ణి పరిగణలోకి తీసుకోలేదు”[a] అని చెప్పినవాడు, తన సహోదరులను గుర్తించలేదు, తన కుమారులను ఎరుగలేదు; ఎందుకంటే వారు నీ మాటను పాటించారు, నీ నిబంధనను కాపాడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేను అతణ్ణి చూడలేదు.” ఈ సందర్భంలో కుటుంబ బంధాన్ని పరిగణలోకి తీసుకోకపోవడం లేదా పట్టించుకోకపోవడం అనే భావం కావచ్చు.
    reason: ראה అనే క్రియ యొక్క అక్షరార్థాన్ని చూపుతూ, సందర్భానుసారమైన ప్రయోగార్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: הָאֹמֵר
  choice: చెప్పినవాడు
  rationale: ఈ విశేషణార్థక వర్తమాన కృదంతం ముందున్న లేవిని సూచిస్తుంది; తెలుగులో సంబంధార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: తన తండ్రి గురించీ తన తల్లి గురించీ
  rationale: אמרతో వచ్చిన ל వ్యక్తుల గురించి చెప్పడాన్ని లేదా వారిని ఉద్దేశించడాన్ని సూచించగలదు; తరువాతి కుటుంబ సంబంధ నిరాకరణల సందర్భంలో ‘గురించి’ సహజంగా సరిపోతుంది.
- source_word: לֹא רְאִיתִיו
  choice: నేను అతణ్ణి లక్ష్యపెట్టలేదు
  rationale: ראה మూలార్థం ‘చూడడం’; అయితే ఇక్కడ కుటుంబ బంధం కంటే నిబంధన విశ్వాస్యతకు ప్రాధాన్యం ఇచ్చే సందర్భంలో ‘పరిగణలోకి తీసుకోలేదు/లక్ష్యపెట్టలేదు’ అనే భావం ఉంది. పాదటిప్పణిలో అక్షరార్థాన్ని నిలుపుతున్నాం.
- source_word: הִכִּיר
  choice: గుర్తించలేదు
  rationale: హిఫీల్ రూపం గుర్తించడం లేదా బంధుత్వపరంగా అంగీకరించడం అనే భావాన్ని ఇస్తుంది; ‘గుర్తించలేదు’ మూలపదానికి దగ్గరగా ఉండి సందర్భంలోనూ సహజంగా ఉంది.
- source_word: אֶחָיו
  choice: తన సహోదరులను
  rationale: హీబ్రూ పదం నిర్దిష్టంగా పుంలింగ బహువచనమైన ‘సోదరులు’; ఆ లింగ నిర్దిష్టతను నిలిపింది.
- source_word: בָּנָיו
  choice: తన కుమారులను
  rationale: మూలంలో ‘కుమారులు’ అని నిర్దిష్టంగా ఉంది; ‘పిల్లలు’ అని సాధారణీకరించలేదు.
- source_word: יָדָע
  choice: ఎరుగలేదు
  rationale: ידע యొక్క ప్రాథమిక భావమైన ‘తెలుసుకోవడం’ను నిలుపుతూ, ఇక్కడి సంబంధపరమైన గుర్తింపును గంభీరమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి కుటుంబ హక్కుల నిరాకరణకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שָׁמְרוּ
  choice: పాటించారు
  rationale: שׁמר ఇక్కడ దేవుని మాటకు విధేయత చూపడం అనే భావంలో ఉంది; తెలుగులో ‘మాటను పాటించడం’ సహజమైన జోడింపు.
- source_word: אִמְרָתֶךָ
  choice: నీ మాటను
  rationale: אמרה అంటే మాట లేదా ఉక్తి; ‘ఆజ్ఞ’ అని అతిగా నిర్దిష్టం చేయకుండా మూల విస్తృతిని నిలుపుతుంది.
- source_word: בְּרִיתְךָ
  choice: నీ నిబంధనను
  rationale: దైవ-ప్రజ సంబంధ సందర్భంలో בריתకు ప్రామాణికమైన తెలుగు సమానార్థకం.
- source_word: יִנְצֹרוּ
  choice: కాపాడారు
  rationale: נצרలో కాపాడడం, భద్రంగా నిలుపడం అనే ఛాయ ఉంది; ముందున్న שׁמרతో ఉన్న పదభేదాన్ని తెలుగులోనూ నిలుపుతుంది.
theological_decisions:
- issue: వచనంలోని ఏకవచన, బహువచన రూపాల సూచన
  choice: లేవి/లేవీయులను సమిష్టిగా ఉద్దేశిస్తూ, మొదటి భాగంలోని ఏకవచన రూపాలను మరియు కారణ భాగంలోని బహువచన క్రియలను యథాతథంగా నిలిపాం.
  alternative: మొత్తం వచనాన్ని లేవి అనే ఒక్క పూర్వికునిగురించేనని భావించడం; లేదా ఒక వ్యక్తిగత లేవీయుని నుంచి గోత్రానికి మార్పుగా వివరించడం.
  rationale: హీబ్రూ పాఠం ‘చెప్పినవాడు… గుర్తించలేదు… ఎరుగలేదు’ అనే ఏకవచనం నుంచి ‘వారు పాటించారు… కాపాడారు’ అనే బహువచనానికి మారుతుంది. ఆ మార్పును సవరించకుండా ఉంచడం మూలంలోని సమిష్టి-ప్రతినిధి ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ఆశీర్వాద కవిత్వానికి తగిన గౌరవప్రదమైన శైలి. ‘సహోదరులు,’ ‘ఎరుగలేదు,’ ‘నిబంధన’ వంటి పదాలు మూలంలోని కుటుంబ, సంబంధ, నిబంధన భావాలను స్పష్టంగా నిలుపుతాయి.
