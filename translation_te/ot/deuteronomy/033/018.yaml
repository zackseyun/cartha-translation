  to: 'జెబూలూను గురించి అతడు ఇలా అన్నాడు[a]: “జెబూలూనూ, నీవు బయలుదేరడంలో సంతోషించు; ఇశ్శాఖారూ, నీ గుడారాల్లో సంతోషించు.”'
