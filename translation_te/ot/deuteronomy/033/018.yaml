id: DEU.33.18
reference: Deuteronomy 33:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/זְבוּלֻ֣ן אָמַ֔ר שְׂמַ֥ח זְבוּלֻ֖ן בְּ/צֵאתֶ֑/ךָ וְ/יִשָּׂשכָ֖ר בְּ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: te
  text: 'జెబూలూను గురించి అతడు ఇలా అన్నాడు[a]: “జెబూలూనూ, నీవు బయలుదేరడంలో సంతోషించు; ఇశ్శాఖారూ, నీ గుడారాల్లో సంతోషించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీవు బయలుదేరినప్పుడు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం జెబూలూను కార్యకలాపాల లేదా వర్ధిల్లుదల యొక్క సందర్భాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: జెబూలూనును గురించి
  rationale: లְ ఉపసర్గ ఇక్కడ తరువాతి గోత్ర ఆశీర్వాదాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘గురించి’ అనేది సహజంగా ఉండి మూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: ఆశీర్వాద వాక్యాన్ని పరిచయం చేసే సాధారణ క్రియ. ‘ఇలా’ ప్రత్యక్ష ఉక్తికి సహజమైన తెలుగు అనుసంధానాన్ని ఇస్తుంది.
- source_word: שְׂמַח
  choice: సంతోషించు
  rationale: ఏకవచన ఆజ్ఞార్థక రూపాన్ని నిలుపుతుంది; ఆశీర్వాదానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: గోత్రనామాన్ని తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בְּ/צֵאתֶךָ
  choice: నీవు బయలుదేరడంలో
  rationale: בְ + క్రియానామ రూపంలోని పరిస్థితి లేదా కార్యక్షేత్ర భావాన్ని నిలుపుతూ, ‘బయలుదేరుట’ అనే మూల చిత్రాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా కాపాడుతుంది.
- source_word: וְ/יִשָּׂשכָר
  choice: ఇశ్శాఖారూ
  rationale: రెండవ గోత్రాన్ని సమన్వయంతో నేరుగా సంబోధిస్తుంది; తెలుగు సంబోధన విభక్తి వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּ/אֹהָלֶיךָ
  choice: నీ గుడారాల్లో
  rationale: హీబ్రూ బహువచనాన్ని, గోత్ర సమూహ సందర్భాన్ని, అలాగే ‘బయలుదేరడంలో/గుడారాల్లో’ అనే సమాంతరతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆశీర్వాద కవిత్వానికి తగిన గంభీరతను ఉంచింది. గోత్రాలను నేరుగా సంబోధించే రూపం, ఏకవచన సర్వనామాలు, మూలంలోని ‘బయలుదేరడం—గుడారాలు’ సమాంతర చిత్రణ నిలుపబడ్డాయి.
