id: DEU.33.25
reference: Deuteronomy 33:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּרְזֶ֥ל וּ/נְחֹ֖שֶׁת מִנְעָלֶ֑י/ךָ וּ/כְ/יָמֶ֖י/ךָ דָּבְאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: te
  text: నీ అడ్డగడియలు ఇనుము, కంచువంటివి ఉంటాయి[a]; నీ దినాలకు తగినట్లే నీ బలం ఉంటుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ చెప్పులు ఇనుము, కంచుతో చేసినవిగా ఉంటాయి.” హీబ్రూ నామవాచకం పాదరక్షలను సూచించగలదు; అయితే లోహచిత్రణను, భద్రత సందర్భాన్ని బట్టి చాలామంది ఇక్కడ అడ్డగడియలు లేదా గడియబోల్టులు అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ దినాలకు తగినట్లే నీ విశ్రాంతి [లేదా, భద్రత] ఉంటుంది.” చివరి హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం. “బలం” అనేది ఆశీర్వాద సందర్భానికి సరిపోయే సంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: ఇనుము
  rationale: లోహానికి గల సాధారణ అర్థం; కంచుతో జతగా వచ్చింది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ హీబ్రూ పదం రాగి లేదా కంచును సూచించవచ్చు; ఇనుముతో జతగా ఉన్న లోహచిత్రణలో ‘కంచు’ సహజంగా సరిపోతుంది.
- source_word: מִנְעָלֶיךָ
  choice: నీ అడ్డగడియలు
  rationale: ఈ పదం పాదరక్షలను కూడా సూచించగలదు. అయితే ఇనుము, కంచు అనే లోహచిత్రణతోను, భద్రతను తెలిపే ఆశీర్వాద సందర్భంతోను ‘అడ్డగడియలు’ బాగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּכְיָמֶיךָ
  choice: నీ దినాలు ఉన్నంతకాలం
  rationale: כְ పోలిక లేదా అనుపాతాన్ని సూచిస్తుంది. తెలుగులో కాలవ్యాప్తిని సహజంగా తెలియజేస్తూనే, దినాలకు అనుగుణంగా తదుపరి వరం ఉంటుందనే భావాన్ని నిలుపుతుంది.
- source_word: דָּבְאֶךָ
  choice: నీ బలం
  rationale: ఇది అరుదైన, అర్థనిర్ణయం కష్టమైన పదం. ఆశీర్వాద సందర్భంలో సంప్రదాయంగా తీసుకున్న ‘బలం’ భావం సరిపోతుంది; ‘విశ్రాంతి/భద్రత’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: ఆశీర్వాదంలోని రూపకాల భావం
  choice: ఈ వాక్యం చిరస్థాయి భద్రతను, జీవితకాలమంతా నిలిచే బలాన్ని వాగ్దానం చేస్తుంది.
  alternative: ఇది కఠిన ప్రదేశానికి తగిన దృఢమైన పాదరక్షలను, కొనసాగుతున్న శక్తిని వర్ణించవచ్చు; చివరి పదం బలానికి బదులు విశ్రాంతి లేదా భద్రతను సూచించవచ్చు.
  rationale: ప్రధాన పాఠంలో సందర్భానికి సరిపోయే భావాన్ని ఇచ్చి, హీబ్రూ పదాల నిజమైన అనిశ్చితిని పాదసూచికల్లో భద్రపరిచాం; ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అడ్డగడియలు’ భద్రతా రూపకాన్ని స్పష్టంగా తెలియజేస్తుంది; అరుదైన హీబ్రూ పదాల సందిగ్ధతను పాదసూచికల్లో నిలిపాం.
