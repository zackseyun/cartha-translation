source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: te
  text: 'అతని తొలిచూలు ఎద్దుకు వైభవం ఉంది;

    దాని కొమ్ములు అడవి ఎద్దు కొమ్ములవంటివి[a].

    వాటితో అతడు ప్రజలను ఒకేసారి భూమి కొనల వరకు కుమ్ముతాడు.

    ఇవే ఎఫ్రాయిము పదివేలమంది[b];

    ఇవే మనష్షే వేలమంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అడవి దున్నపోతు కొమ్ములవంటివి.’ హీబ్రూ רְאֵם బలమైన అడవి గోజాతి జంతువును సూచించే అవకాశం ఉంది; పాత అనువాదాల్లో దీనిని ‘ఏకశృంగి’ అని కూడా అనువదించారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎఫ్రాయిము అసంఖ్యాక సమూహాలు.’ హీబ్రూ רִבְבֹות అక్షరార్థంగా ‘పదివేలలు’ అని, విస్తృతార్థంలో అతి పెద్ద సంఖ్యను సూచించగలదు; ఇది ‘మనష్షే వేలమంది’తో వ్యత్యాసంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: అతని తొలిచూలు ఎద్దు
  rationale: בְּכוֹר మొదట పుట్టినదాన్ని, שׁוֹר కొమ్ములుగల మగ గోవును సూచిస్తాయి. కవితాత్మకమైన పశు రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָדָר לוֹ
  choice: దానికి వైభవం ఉంది
  rationale: הָדָר లోని శోభ, ఘనత, మహిమ అనే నామవాచక భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: קַרְנֵי רְאֵם
  choice: అడవి ఎద్దు కొమ్ములు
  rationale: רְאֵם ఒక బలమైన అడవి గోజాతి జంతువును సూచించే అవకాశం ఎక్కువ. అందువల్ల జంతుశాస్త్రపరంగా తప్పుదారి పట్టించే సంప్రదాయ ‘ఏకశృంగి’కి బదులు స్పష్టమైన సాధారణ పదబంధం వాడబడింది.
- source_word: יְנַגַּח
  choice: కుమ్ముతాడు
  rationale: కొమ్ములుగల జంతువు కొమ్ములతో ఢీకొట్టడం లేదా పొడవడం అనే స్పష్టమైన రూపకాన్ని ‘కుమ్ము’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַמִּים יְנַגַּח יַחְדָּו
  choice: ప్రజలందరినీ ... కుమ్ముతాడు
  rationale: עַמִּים అనేక ప్రజాసమూహాలను సూచిస్తుంది; יַחְדָּו ఇచ్చే సమష్టి భావాన్ని తెలుగులో ‘అందరినీ’ ద్వారా సహజంగా తెలిపింది.
- source_word: אַפְסֵי אָרֶץ
  choice: భూమి అంచుల దాకా
  rationale: ప్రపంచంలోని సుదూర ప్రాంతాలను సూచించే హీబ్రూ కవితాత్మక నుడికారాన్ని నిలుపుతుంది.
- source_word: רִבְבֹות אֶפְרַיִם
  choice: ఎఫ్రాయిము పదివేల సమూహాలు
  rationale: רִבְבֹות యొక్క పదివేలల సంఖ్యాభావాన్ని, తరువాతి ‘వేల’తో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది. ‘సమూహాలు’ యోధుల సముదాయాల భావాన్ని తెలుగులో అసంపూర్ణంగా కాకుండా తెలియజేస్తుంది.
- source_word: אַלְפֵי מְנַשֶּׁה
  choice: మనష్షే వేల సమూహాలు
  rationale: సమాంతర నిర్మాణంలో אֶלֶף‌కు సంఖ్యాపరమైన ‘వేలు’ అర్థమే బలంగా సరిపోతుంది; ఎఫ్రాయిము పదివేలలతో వ్యత్యాసం అలాగే ఉంటుంది.
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: ఎఫ్రాయిము / మనష్షే
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన గోత్రనామ రూపాలు.
theological_decisions:
- issue: యోసేపు ఆశీర్వాదంలోని ఎద్దు రూపకం ఎవరిని ప్రత్యేకంగా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతని’ అనే హీబ్రూ సర్వనామాన్ని అలాగే ఉంచి, చివర ఎఫ్రాయిము మరియు మనష్షేలను గుర్తిస్తుంది.
  alternative: ‘తొలిచూలు ఎద్దు’ను నేరుగా ఎఫ్రాయిముగా పేర్కొనడం.
  rationale: ఆశీర్వాదం యోసేపును ఉద్దేశించినా, చివరి పాదం ఎఫ్రాయిము మరియు మనష్షేలను పేర్కొంటుంది. హీబ్రూ పాఠ్యం రూపకానికి సంబంధించిన నిర్దిష్ట వ్యక్తిని పూర్తిగా స్పష్టీకరించదు; అనువాదం ఆ ఉద్దేశపూర్వక ఉద్విగ్నతను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి ఉంచబడింది. ‘తొలిచూలు,’ ‘వైభవం,’ ‘భూమి అంచులు’ వంటి పదాలు ఆశీర్వాదపు ఉన్నత శైలిని నిలుపుతాయి; ‘కుమ్ముతాడు’ కొమ్ముల రూపకాన్ని సాధారణ పాఠకునికి సజీవంగా చేస్తుంది. మూలంలోని పునరుక్త ‘ఇవే ... ఇవే’ నిర్మాణం ఉద్దేశపూర్వకంగా నిలుపబడింది.
