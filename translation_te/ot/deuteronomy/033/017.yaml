revisions:
- from: 'అతని తొలిచూలు ఎద్దుకు వైభవం ఉంది;

    దాని కొమ్ములు అడవి ఎద్దు కొమ్ములవంటివి[a].

    వాటితో అతడు ప్రజలందరినీ భూమి అంచుల దాకా కుమ్ముతాడు.

    ఇవే ఎఫ్రాయిము పదివేల సమూహాలు[b];

