revisions:
- from: పూర్వకాలపు దేవుడే నివాసస్థలం[a]; కింద నిత్యమైన బాహువులు ఉన్నాయి. ఆయన నీ ఎదుటనుండి శత్రువును వెళ్లగొట్టి, ‘నాశనం చేయి!’ అని అన్నాడు.
  to: పూర్వకాలపు దేవుడు నివాసస్థలం[a]; క్రింద నిత్యమైన బాహువులు ఉన్నాయి. ఆయన నీ ఎదుటనుండి శత్రువును వెళ్లగొట్టి, ‘నాశనం చేయి!’ అని అన్నాడు.
