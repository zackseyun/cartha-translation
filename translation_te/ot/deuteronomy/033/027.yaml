id: DEU.33.27
reference: Deuteronomy 33:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: te
  text: పూర్వకాలపు దేవుడు నివాసస్థలం[a]; క్రింద నిత్యమైన బాహువులు ఉన్నాయి. ఆయన నీ ఎదుటనుండి శత్రువును వెళ్లగొట్టి, ‘నాశనం చేయి!’ అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిత్యుడైన దేవుడు నీకు ఆశ్రయం.” హెబ్రీ వాక్యాన్ని సంప్రదాయబద్ధంగా ఈ వ్యాఖ్యానాత్మక భావంలో కూడా అర్థం చేసుకోవచ్చు; అయితే మరింత ప్రత్యక్షమైన పదప్రయోగం “పూర్వకాలపు దేవుడు నివాసస్థలం.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: నివాసస్థలం
  rationale: ఈ నామవాచకం నివసించే చోటును లేదా ఆశ్రయమిచ్చే స్థలాన్ని సూచిస్తుంది. ‘నివాసస్థలం’ మూలంలోని రూపకాన్ని కాపాడుతుంది; దానిని నేరుగా ‘ఆశ్రయం’గా మాత్రమే వ్యాఖ్యానించదు.
- source_word: אֱלֹהֵי קֶדֶם
  choice: పూర్వకాలపు దేవుడు
  rationale: קֶדֶם ఇక్కడ ప్రాచీన కాలాన్ని లేదా పూర్వకాలాన్ని సూచిస్తుంది. ‘పూర్వకాలపు దేవుడు’ అనేది ‘నిత్యుడైన దేవుడు’ అనే వ్యాఖ్యానాత్మక అనువాదం కంటే హెబ్రీ పదబంధాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וּמִתַּחַת
  choice: కింద
  rationale: ఈ పదబంధంలోని స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ముందు చెప్పిన నివాసస్థల రూపకంతో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: זְרֹעֹת עוֹלָם
  choice: నిత్యమైన బాహువులు
  rationale: זְרֹעֹת అక్షరార్థంగా ‘బాహువులు’; ఇది బలం, ఆదరణను సూచించే రూపకం. עוֹלָם ఇక్కడ నిరంతరమైన, శాశ్వతమైన భావాన్ని ఇస్తుంది.
- source_word: וַיְגָרֶשׁ
  choice: వెళ్లగొట్టి
  rationale: גרש అంటే తరిమివేయడం లేదా బయటకు వెళ్లగొట్టడం. ఈ సందర్భంలో ఇది దేవుడు శత్రువును ఇశ్రాయేలు ఎదుటనుండి తొలగించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుండి
  rationale: అక్షరార్థంగా ‘నీ ముఖం/సన్నిధి నుండి.’ ఇక్కడ ఇశ్రాయేలు ముందుకు సాగుతున్నప్పుడు దాని ఎదుటనుండి అనే భావం ఉంది.
- source_word: אוֹיֵב
  choice: శత్రువును
  rationale: హెబ్రీలో ఏకవచనంగా ఉన్న రూపాన్ని నిలుపుతుంది; సందర్భానుసారంగా ఇది సమూహార్థాన్నీ కలిగి ఉండవచ్చు.
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: సాధారణ కథన కొనసాగింపు. ముందున్న వాక్యభాగాన్ని బట్టి కర్త దేవుడే అని సహజంగా అర్థమవుతుంది.
- source_word: הַשְׁמֵד
  choice: నాశనం చేయి!
  rationale: שמד యొక్క హిఫీల్ ఆజ్ఞారూపం సంపూర్ణంగా నాశనం చేయమనే బలమైన ఆజ్ఞను సూచిస్తుంది. ‘నాశనం చేయి’ మూలంలోని తీవ్రతను అదనపు నిర్దిష్టత లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: אֱלֹהֵי קֶדֶם లోని קֶדֶם ను ‘పూర్వకాలపు’ అని అనువదించాలా, ‘నిత్యుడైన’ అని అనువదించాలా
  choice: పూర్వకాలపు దేవుడు
  alternative: నిత్యుడైన దేవుడు
  rationale: קֶדֶם యొక్క ప్రత్యక్ష కాలార్థం ప్రాచీన లేదా పూర్వకాలాన్ని సూచిస్తుంది. ‘నిత్యుడైన దేవుడు’ అనేది సంప్రదాయబద్ధమైన, సాధ్యమైన వ్యాఖ్యానాత్మక అనువాదం; మూలంలోని ఉద్రిక్తతను నిలుపుటకు దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి ఉపయోగించబడింది. దైవబలాన్ని సూచించే ‘బాహువులు’ అనే మూలరూపకం అలాగే ఉంచబడింది. ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’తో నిలుపుకున్నాం.
