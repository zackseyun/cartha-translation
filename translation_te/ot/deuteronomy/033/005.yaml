id: DEU.33.5
reference: Deuteronomy 33:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֥י בִ/ישֻׁר֖וּן מֶ֑לֶךְ בְּ/הִתְאַסֵּף֙ רָ֣אשֵׁי עָ֔ם יַ֖חַד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: te
  text: ప్రజల నాయకులు, ఇశ్రాయేలు గోత్రాలు కలిసి సమకూడినప్పుడు[c], ఆయన యెషురూనులో[b] రాజుగా ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెషురూనులో యెహోవా రాజయ్యాడు’; మరికొందరు, ‘యెషురూనులో ఆయన [మోషే] రాజయ్యాడు’ అని అర్థం చేసుకుంటారు. హీబ్రూ పాఠం కర్తను స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
  - marker: b
    text: ‘యెషురూను’ అనేది ఇశ్రాయేలుకు వాడిన కవితాత్మక పేరు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘ప్రజల నాయకులు సమకూడినప్పుడు, ఇశ్రాయేలు గోత్రాలు కలిసి.’ హీబ్రూ వాక్య నిర్మాణం సంక్షిప్తంగా ఉంది; ‘కలిసి’ అనే పదం వాక్యంలోని వేర్వేరు భాగాలకు అనుసంధానమవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఆయన ... ఉన్నాడు
  rationale: היה అనే క్రియ ఇక్కడ ‘ఉన్నాడు’ లేదా ‘అయ్యాడు’ అనే భావాన్ని ఇవ్వగలదు. సందర్భంలో రాజుగా ఉన్న స్థితిని సహజమైన తెలుగులో తెలియజేయడానికి ‘ఉన్నాడు’ అని అనువదించాం; హీబ్రూలో కర్త స్పష్టంగా పేర్కొనబడనందున ‘ఆయన’ అనే సర్వనామాన్ని మాత్రమే ఉంచాం.
- source_word: בִישֻׁרוּן
  choice: యెషురూనులో
  rationale: ‘యెషురూను’ ఇశ్రాయేలుకు వాడిన కవితాత్మక పేరు. పేరును లిప్యంతరీకరించి, ב ఉపసర్గను ‘లో’గా అనువదించాం.
- source_word: מֶלֶךְ
  choice: రాజుగా
  rationale: מֶלֶךְకు సాధారణ అర్థం ‘రాజు.’ తెలుగులో ‘ఉన్నాడు’తో సహజంగా కలిసేలా ‘రాజుగా’ అని ఇచ్చాం.
- source_word: בְּהִתְאַסֵּף
  choice: సమావేశమైనప్పుడు
  rationale: ב ఉపసర్గతో కూడిన ఈ క్రియారూపం కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది. అందువల్ల ‘సమావేశమైనప్పుడు’ అని అనువదించాం.
- source_word: רָאשֵׁי עָם
  choice: ప్రజల నాయకులు
  rationale: అక్షరార్థం ‘ప్రజల తలలు’; ఇది నాయకులను సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘నాయకులు’ అని ఇచ్చాం.
- source_word: יַחַד
  choice: ఒక్కటిగా
  rationale: ఈ పదం కలసి ఉండటాన్ని, ఐక్యతను సూచిస్తుంది. ఇక్కడ గోత్రాల సమైక్య సమావేశాన్ని తెలిపేందుకు ‘ఒక్కటిగా’ సహజంగా సరిపోతుంది.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నీ
  rationale: ‘ఇశ్రాయేలు గోత్రాలు’ అనే మూలార్థాన్ని నిలిపి, మొత్తం గోత్ర సమూహం సమావేశమైందనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘అన్నీ’ చేర్చాం.
theological_decisions:
- issue: ‘ఆయన’ మరియు ‘రాజు’ ఎవరిని సూచిస్తున్నాయి?
  choice: ప్రధాన పాఠంలో కర్తను ‘ఆయన’ అని మాత్రమే ఉంచి, ఎవరని నిర్ధారించలేదు.
  alternative: ‘యెహోవా రాజుగా ఉన్నాడు’ లేదా ‘మోషే రాజుగా ఉన్నాడు.’
  rationale: హీబ్రూ వాక్యం కర్తను పేరుతో స్పష్టంగా చెప్పదు. అది యెహోవాను సూచిస్తుందని కొందరు, మోషేను సూచిస్తుందని మరికొందరు అర్థం చేసుకుంటారు. మూలంలోని నిజమైన సందిగ్ధతను నిలిపేందుకు ప్రధాన పాఠంలో దానిని పరిష్కరించలేదు.
- issue: ఇశ్రాయేలు సమైక్య సమావేశ స్వభావం
  choice: నాయకులు, గోత్రాలు ఒక్కటిగా సమావేశమయ్యారని మాత్రమే తెలిపాం.
  alternative: దీనిని అధికారిక పట్టాభిషేక సభగా లేదా నిబంధన సభగా నిర్దిష్టంగా పేర్కొనడం.
  rationale: వచనం సమైక్య సమావేశాన్ని చూపుతున్నా, దాని రాజకీయ లేదా ఆరాధనా స్వరూపాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల మూలపాఠం చెప్పినదానికంటే ఎక్కువ వివరాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘ప్రజల తలలు’ అనే అసహజ అక్షరానువాదానికి బదులు నుడికార భావమైన ‘ప్రజల నాయకులు’ అని ఇచ్చాం. గీతికాత్మక నామమైన ‘యెషురూను’ను అనువదించకుండా నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరించాం. మూలంలోని కర్తసంబంధ సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
