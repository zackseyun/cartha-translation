  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: te
  text: 'యాహ్వే, అతని బలాన్ని[a] ఆశీర్వదించు;

    అతని చేతుల పనిని అంగీకరించు.

    అతనికి విరోధంగా లేచేవారి నడుములను[b],

    అతన్ని ద్వేషించేవారి నడుములను నలగగొట్టు;

    వారు లేవకుండునట్లు చేయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సంపదను,’ ‘అతని వనరులను,’ లేదా ‘అతని సైన్యాన్ని.’ హీబ్రూ పదం బలం, ఆస్తి లేదా సైనిక శక్తిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నడుములు’ శక్తిని సూచించే హీబ్రూ కవితాత్మక చిత్రం.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: ఆశీర్వదించు
  rationale: యాహ్వేను ఉద్దేశించిన ఆజ్ఞార్థక రూపం. సందర్భార్థమైన ‘వర్ధిల్లజేయి’ కంటే మూలంలోని ప్రత్యక్ష భావాన్ని ఇది సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: חֵילוֹ
  choice: అతని బలాన్ని
  rationale: חַיִל అనే పదానికి బలం, సంపద, వనరులు, సైనిక శక్తి అనే భావాలు ఉండవచ్చు. ‘బలం’ ఈ విస్తృతిని అత్యల్పంగా సంకుచితం చేస్తుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: וּפֹעַל יָדָיו
  choice: అతని చేతుల పనిని
  rationale: చేసిన పని లేదా సేవను సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: תִּרְצֶה
  choice: అంగీకరించు
  rationale: లేవీయుని పని లేదా సేవకు దేవుని ఆమోదాన్ని కోరే భావం. బలి లేదా ఆరాధనా సందర్భాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: מְחַץ
  choice: నలగగొట్టు
  rationale: చితకగొట్టడం లేదా నలగగొట్టడం అనే బలమైన ఆజ్ఞార్థక క్రియ; కవితాత్మక తీవ్రతను నిలుపుతుంది.
- source_word: מָתְנַיִם
  choice: నడుములను
  rationale: శరీరంలోని నడుము/కటి భాగాన్ని సూచించే మూలచిత్రాన్ని నిలుపుతుంది. హీబ్రూ కవిత్వంలో ఇది శక్తికి ప్రతీక కావచ్చు.
- source_word: קָמָיו
  choice: అతనికి విరోధంగా లేచేవారి
  rationale: קום (‘లేచు’) అనే క్రియాచిత్రాన్ని ‘విరోధులు’ అనే అమూర్త పదంగా మార్చకుండా నిలుపుతుంది.
- source_word: וּמְשַׂנְאָיו
  choice: అతన్ని ద్వేషించేవారి
  rationale: వ్యక్తిగత ద్వేషాన్ని ప్రత్యక్షంగా వ్యక్తపరుస్తూ హీబ్రూ కృదంత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: מִן יְקוּמוּן
  choice: వారు మళ్లీ లేవకుండా చేయి
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా, కొంత అసంపూర్ణంగా ఉంది. ముందున్న ‘నలగగొట్టు’ అనే ఆజ్ఞ ఫలితంగా వారు ఇక లేవలేరనే భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలోని ‘అతని/అతన్ని’ అనే సర్వనామాల సూచితుడు
  choice: తక్షణ సందర్భంలో ఆశీర్వదించబడుతున్న లేవిని సూచించే ఏకవచన సర్వనామాలుగా ఉంచడం
  alternative: యాజక సేవకునికి లేదా లేవి ప్రతినిధిత్వ పరిచర్యకు సాధారణ సూచనగా విస్తరించడం
  rationale: ద్వితీయోపదేశకాండము 33:8–11లోని తక్షణ సాహిత్య సందర్భం లేవికి ఇచ్చిన ఆశీర్వాదం. హీబ్రూ ఏకవచన రూపాలను నిలుపుతూ విస్తృత వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, రెండో పాదంలో అర్థస్పష్టత కోసం ‘నడుములను’ పునరుక్తి చేశాం. దైవనామాన్ని ‘యాహ్వే’గా ఇచ్చాం; హింసాత్మక చిత్రాన్ని మృదువుచేయకుండా మూల తీవ్రతను నిలిపాం.
