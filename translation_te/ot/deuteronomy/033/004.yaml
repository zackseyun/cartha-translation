  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: te
  text: మోషే మనకు ధర్మశాస్త్రాన్ని ఆజ్ఞాపించాడు—యాకోబు సమాజానికి అది స్వాస్థ్యం.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే మనకు ధర్మశాస్త్రాన్ని—యాకోబు సమాజపు స్వాస్థ్యాన్ని—ఆజ్ఞాపించాడు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; “స్వాస్థ్యం” అనే పదాన్ని “ధర్మశాస్త్రం”తో సమానాధికరణంగా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “ధర్మశాస్త్రం” అనే పదాన్ని “ఉపదేశం” అని కూడా అనువదించవచ్చు; “స్వాస్థ్యం” అనే పదానికి “వారసత్వ సంపద” లేదా “సొత్తు” అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: ఈ నిబంధన సందర్భంలో మోషే ద్వారా ఇశ్రాయేలుకు అధికారపూర్వకంగా అందిన బోధనను, నియమాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ ఈ ప్రజా-నిబంధన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఉపదేశం’ కూడా సాధ్యమైన అర్థం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: ఈ క్రియలోని అధికారపూర్వక ఆజ్ఞ భావాన్ని కాపాడుతుంది; కేవలం ‘ఇచ్చాడు’ అని అనువదిస్తే మూలంలోని బలం తగ్గుతుంది.
- source_word: לָנוּ
  choice: మనకు
  rationale: ల ఉపసర్గ ఇక్కడ స్వీకర్తలను సూచిస్తుంది. ‘మనకు’ సహజమైన తెలుగులో ‘to/for us’ రెండింటికీ తగిన భావాన్ని ఇస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: מוֹרָשָׁה
  choice: స్వాస్థ్యం
  rationale: వారసత్వ హక్కుగా పొందిన, తరతరాలకు చెందిన ఆస్తి లేదా సొత్తు అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది. ‘వారసత్వ సంపద’ లేదా ‘సొత్తు’ కూడా సాధ్యమైనవి.
- source_word: קְהִלַּת
  choice: సమాజానికి
  rationale: సమకూడిన నిబంధన ప్రజల సమూహాన్ని సహజంగా సూచిస్తుంది. ‘సభకు’ మరింత అక్షరార్థమైన ప్రత్యామ్నాయం అయినా, ఆధునిక తెలుగులో సంస్థాగత భావం కలిగించవచ్చు.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: మూలపాఠంలో ఉన్న పేరునే నిలుపుతుంది; దానిని వ్యాఖ్యానాత్మకంగా ‘ఇశ్రాయేలు’గా మార్చదు.
theological_decisions:
- issue: రెండు నామపద భాగాల వాక్యనిర్మాణ సంబంధం
  choice: 'రెండవ భాగాన్ని మొదటి భాగంలోని ధర్మశాస్త్రాన్ని వర్ణించే అనుబంధ ప్రకటనగా చూపడం: అది యాకోబు సమాజానికి స్వాస్థ్యం.'
  alternative: ‘మోషే మనకు ధర్మశాస్త్రాన్ని, యాకోబు సమాజపు స్వాస్థ్యాన్ని, ఆజ్ఞాపించాడు.’
  rationale: హీబ్రూ కవితా వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; מוֹרָשָׁה అనే పదం תּוֹרָהకు సమానాధికరణంగా ఉండవచ్చు లేదా రెండవ నామవాక్యంగా వినిపించవచ్చు. ప్రధాన పాఠం సంబంధాన్ని స్పష్టంగా చదివేలా చేస్తుంది; పాదసూచి నిజమైన సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యంగా రూపొందించబడింది. ‘ధర్మశాస్త్రం’ మరియు ‘స్వాస్థ్యం’ వంటి బైబిలు సందర్భంలో సుపరిచితమైన పదాలను ఉపయోగించినప్పటికీ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడికి సులభంగా ఉంచాం. మూలంలోని సంక్షిప్తతను దీర్ఘ వివరణతో భర్తీ చేయకుండా, డాష్ ద్వారా రెండు భాగాల సంబంధాన్ని చూపించాం.
