source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: te
  text: 'ఇశ్రాయేలూ, నీవు ఎంత ధన్యుడవు!


    నీతో సమానుడు ఎవరు?


    యాహ్వే చేత రక్షించబడిన ప్రజవు నీవు.


    నీకు సహాయమిచ్చే కేడెము ఆయనే,

    నీ ఔన్నత్యపు ఖడ్గమూ ఆయనే.


    నీ శత్రువులు నీ ముందు అణిగిమణిగి లొంగుతారు[a];


    నీవు వారి ఉన్నత స్థలాలను తొక్కుతావు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ శత్రువులు నీకు కపటంగా లోబడతారు.’ హీబ్రూ క్రియ బలవంతంగా లేదా లొంగినట్టు నటిస్తూ విధేయత చూపడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి ఎత్తులను/కోటలను తొక్కుతావు.’ కొందరు ఇక్కడ ‘వారి వీపులను’ అని అర్థం చేసుకుంటారు; అయితే హీబ్రూ నామవాచకానికి ‘ఉన్నత స్థలాలు’ అనేది మరింత ప్రత్యక్షమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: నీవు ఎంత ధన్యుడవు
  rationale: ఈ ఆశ్చర్యార్థక ప్రయోగం ఇశ్రాయేలు అనుభవిస్తున్న ఆశీర్వాదకరమైన, అభిలషణీయమైన స్థితిని తెలియజేస్తుంది. ‘ధన్యుడవు’ గంభీరతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִי כָמוֹךָ
  choice: నీతో సమానుడు ఎవరు?
  rationale: ఇది ఇశ్రాయేలు సాటిలేనితనాన్ని తెలిపే అలంకార ప్రశ్న. పదబంధపు ప్రత్యక్ష భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: యాహ్వే చేత రక్షించబడిన ప్రజవు
  rationale: נוֹשַׁע అనే నిఫాల్ రూపంలోని నిష్క్రియార్థాన్ని ‘రక్షించబడిన’ స్పష్టంగా వ్యక్తం చేస్తుంది; בַּיהוָה ఇక్కడ రక్షణకు కర్త లేదా సాధనమైన యాహ్వేను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: מָגֵן עֶזְרֶךָ
  choice: నీ సహాయానికి డాలు
  rationale: సంక్షిప్తమైన హీబ్రూ సమాసాన్ని అతిగా విప్పకుండా, యాహ్వే ఇశ్రాయేలుకు రక్షణనిచ్చే సహాయకుడని సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: నీ ఔన్నత్యానికి ఖడ్గం ఆయనే
  rationale: ముందటి వాక్యానికి సమాంతరంగా యాహ్వేనే ఖడ్గమని ఉన్న లుప్త వాక్యనిర్మాణాన్ని తెలుగులో స్పష్టం చేస్తుంది. גַּאֲוָה యొక్క సానుకూలమైన ఘనత లేదా ఉన్నత స్థితి భావానికి ‘ఔన్నత్యం’ సరిపోతుంది.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: నీ శత్రువులు నీ ముందు అణిగిమణిగి లొంగుతారు
  rationale: כחשׁ ఇక్కడ భయంతో లేదా బలవంతంతో చూపే అణకువను, కొన్నిసార్లు కపటమైన విధేయతను సూచించగలదు. ప్రధాన పాఠం అణిగిన భంగిమను చూపగా, నటన లేదా కపటత్వపు సాధ్యతను పాదసూచిక నిలుపుతుంది.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: వారి ఉన్నత స్థలాలను తొక్కుకుంటూ నడుస్తావు
  rationale: בָּמוֹת యొక్క ప్రత్యక్ష భావం ‘ఉన్నత స్థలాలు/ఎత్తులు’; תִדְרֹךְ విజయవంతంగా వాటిమీద తొక్కి నడిచే చిత్రాన్ని ఇస్తుంది. కోటలు లేదా వీపులు అనే సాధ్యమైన సందర్భార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యనుకరణ చేయడం మూలంలోని నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: גַּאֲוָתֶךָ యొక్క సానుకూల లేదా ప్రతికూల భావం
  choice: నీ ఔన్నత్యానికి
  alternative: నీ గర్వానికి / నీ మహిమకు
  rationale: ఈ ఆశీర్వాద సందర్భంలో పదం పాపపూరితమైన గర్వం కన్నా ఇశ్రాయేలుకు కలిగిన ఉన్నత గౌరవాన్ని సూచిస్తుంది. ‘ఔన్నత్యం’ ఆ సానుకూల భావాన్ని కాపాడుతుంది.
- issue: శత్రువుల లోబడుటలోని כחשׁ భావం
  choice: అణిగిమణిగి లొంగుతారు; కపట లేదా బలవంతపు లోబడుటను పాదసూచికలో ఉంచడం
  alternative: మోసపూర్వకంగా లోబడతారు
  rationale: హీబ్రూ క్రియ అణకువతో లొంగడం, బలవంతపు విధేయత, నటన లేదా కపటత్వం వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ఒకే భావాన్ని ఖచ్చితమైనదిగా నిర్ణయించకుండా ప్రధాన పాఠం మరియు పాదసూచిక కలిసి ఆ ఉద్వేగాన్ని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలి వాడబడింది. ఇశ్రాయేలును ఏకవచన పురుషలింగ సంబోధనగా ఉంచి, మూలంలోని పంక్తుల సమాంతరతను సాధ్యమైనంతవరకు నిలిపాం. ‘డాలు,’ ‘ఖడ్గం,’ ‘ఔన్నత్యం’ వంటి పదాలు సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి ఆశీర్వాదపు ఉన్నత స్వరాన్ని కాపాడుతాయి.
