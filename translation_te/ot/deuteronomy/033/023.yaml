source:
  edition: WLC
  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: te
  text: 'నఫ్తాలి గురించి అతడు ఇలా అన్నాడు:


    “నఫ్తాలీ,

    అనుగ్రహంతో సంతృప్తి పొందినవాడా,

    యహ్వే ఆశీర్వాదంతో నిండినవాడా,

    సముద్రాన్నీ దక్షిణ ప్రాంతాన్నీ స్వాధీనం చేసుకో.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సముద్రాన్నీ దక్షిణ ప్రాంతాన్నీ” అనే మాటలను “పడమరనూ దక్షిణ ప్రాంతాన్నీ” అని కూడా అనువదించవచ్చు; హీబ్రూలో “సముద్రం” అనే పదం పడమర దిశను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: నఫ్తాలి గురించి
  rationale: ల ఉపసర్గ ఇక్కడ గోత్ర ఆశీర్వాదాన్ని పరిచయం చేస్తోంది; ఆధునిక తెలుగులో ‘గురించి’ సహజంగా విషయాన్ని సూచిస్తుంది.
- source_word: אָמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: సాధారణ వాక్య పరిచయ క్రియను స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలీ
  rationale: హీబ్రూ గోత్రనామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; సంబోధనలో దీర్ఘాంత రూపం సహజంగా వినిపిస్తుంది.
- source_word: שְׂבַע רָצוֹן
  choice: అనుగ్రహంతో తృప్తిపొంది
  rationale: שׂבע యొక్క ‘సంతృప్తిగా/నిండుగా ఉండడం’ భావాన్ని, רָצוֹן యొక్క అనుకూలత లేదా అనుగ్రహ భావాన్ని నిలుపుతుంది.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: యెహోవా ఆశీర్వాదంతో నిండినవాడా
  rationale: సమాంతర విశేషణ నిర్మాణాన్ని తెలుగులో సహజమైన సంబోధనగా అందిస్తూ, దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: יָם
  choice: సముద్రాన్ని
  rationale: పదం యొక్క ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; ‘పడమర’ అనే దిశార్థ సంభావ్యతను పాదటిప్పణిలో కాపాడింది.
- source_word: וְדָרוֹם
  choice: దక్షిణ ప్రాంతాన్ని
  rationale: דָרוֹם సూచించే దక్షిణ దిశ/ప్రాంత భావాన్ని భూభాగ స్వాధీన సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְרָשָׁה
  choice: స్వాధీనం చేసుకో
  rationale: ירשׁ యొక్క భూభాగాన్ని అధీనంలోకి తీసుకోవడం అనే క్రియాశీల భావాన్ని ఆజ్ఞాత్మక ఆశీర్వాద రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: יְרָשָׁה యొక్క వాక్యబలం
  choice: స్వాధీనం చేసుకో
  alternative: స్వాధీనం చేసుకొనుగాక
  rationale: ఈ రూపాన్ని ప్రత్యక్ష ఆజ్ఞగా చదవవచ్చు; ఆశీర్వాదాత్మక లేదా జస్సివ్ ఛాయ సందర్భంలో ఉన్నప్పటికీ, దానిని ప్రత్యేకంగా నిర్ణయించకుండా సంక్షిప్త ఆజ్ఞారూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వాద శైలిని, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతో కలిపాం. కవితా సమాంతరతను పంక్తి విభజనతో నిలిపాం; నిజమైన భౌగోళిక/దిశార్థ సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
