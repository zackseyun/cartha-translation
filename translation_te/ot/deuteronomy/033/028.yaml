revisions:
- from: 'కాబట్టి ఇశ్రాయేలు సురక్షితంగా, ఏకాంతంగా[b] నివసించాడు;

    యాకోబు ఊట[a] ధాన్యమూ కొత్త ద్రాక్షారసమూ గల దేశంలో ఉంది;

    అతని ఆకాశాలు సైతం మంచును కురిపిస్తాయి.'
  to: 'కాబట్టి ఇశ్రాయేలు సురక్షితంగా, విడిగా[b] నివసించాడు;

    యాకోబు ఊట—ధాన్యమూ కొత్త ద్రాక్షారసమూ గల దేశంలో;

    అతని ఆకాశాలు సైతం మంచు చినుకులను జల్లు చేస్తాయి.'
  rationale: ప్రధాన పాఠ్యంలో బָּדָדకు ‘విడిగా’ను ఎంచుకోవడం ద్వారా ప్రతికూల ఒంటరితనం సూచనను తగ్గించి, ఆశీర్వాద సందర్భంలోని సురక్షిత వేరుపాటును నిలిపాం. యַעַרְפוּ టַלను ‘మంచు చినుకులను జల్లు చేస్తాయి’గా మార్చడం ద్వారా మంచు సున్నితంగా చిందడమనే మూల రూపకాన్ని కాపాడాం. రెండవ పంక్తిలోని స్పష్టీకరణాత్మక ‘ఉంది’ని తొలగించి మూల కవితా సాంద్రతను నిలిపాం; עֵין యַעֲקֹב యొక్క సందిగ్ధతను పాదసూచికలో యథాతథంగా భద్రపరిచాం.
