id: DEU.33.28
reference: Deuteronomy 33:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: te
  text: 'కాబట్టి ఇశ్రాయేలు సురక్షితంగా, విడిగా[b] నివసించాడు;

    యాకోబు ఊట—ధాన్యమూ కొత్త ద్రాక్షారసమూ గల దేశంలో;

    అతని ఆకాశాలు సైతం మంచు చినుకులను జల్లు చేస్తాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా “తనంతట తానుగా” లేదా “ఏకాంతంగా.” ఇక్కడ భావం విడిచిపెట్టబడిన ఒంటరితనం కాక, భద్రంగా ప్రత్యేకంగా నివసించడం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: నివసించాడు
  rationale: שׁכן అంటే నివసించడం లేదా స్థిరంగా ఉండడం. ఆధునిక తెలుగులో సహజంగా ఉండి, హీబ్రూ వాక్యరూపంలోని గతకాల భావాన్ని నిలుపుతుంది.
- source_word: בֶּטַח
  choice: సురక్షితంగా
  rationale: ఇక్కడ ఈ పదం ఇశ్రాయేలు భద్రమైన స్థితిలో నివసించడాన్ని క్రియావిశేషణంగా వివరిస్తుంది.
- source_word: בָּדָד
  choice: ఏకాంతంగా
  rationale: విడిగా, ఇతరుల బెదిరింపుల్లేకుండా ఉండే భావాన్ని తెలియజేస్తుంది; ప్రతికూలమైన ఒంటరితనాన్ని తప్పనిసరిగా సూచించదు.
- source_word: עֵין יַעֲקֹב
  choice: యాకోబు ఊట
  rationale: עֵין అనే పదానికి ‘కన్ను’ లేదా ‘ఊట’ అనే అర్థాలు ఉన్నాయి. ధాన్యం, కొత్త ద్రాక్షారసం, మంచు అనే సారవంతత చిత్రణలో ‘ఊట’ సందర్భానికి చక్కగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל אֶרֶץ
  choice: దేశంలో ఉంది
  rationale: కావ్య నిర్మాణంలో אֶל సూచించే సంబంధం లేదా దిశను ఇక్కడ సహజమైన తెలుగు స్థానార్థంతో వ్యక్తం చేశాం. ‘ఉంది’ హీబ్రూ నామవాచక వాక్యంలో అంతర్లీనమైన అనుసంధానాన్ని స్పష్టం చేస్తుంది.
- source_word: דָּגָן
  choice: ధాన్యం
  rationale: సాధారణంగా తృణధాన్యపు పంటలను సూచించే విస్తృత పదం.
- source_word: תִירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: కొత్తగా లభించిన ద్రాక్షారసాన్ని సూచిస్తూ పంట సమృద్ధి చిత్రణను నిలుపుతుంది.
- source_word: אַף
  choice: సైతం
  rationale: భూమి సమృద్ధికి తోడు ఆకాశం ఇచ్చే ఆశీర్వాదాన్ని ఉద్ఘాటించే పదం.
- source_word: שָׁמָיו
  choice: అతని ఆకాశాలు
  rationale: హీబ్రూలోని మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని అలాగే నిలుపుతుంది; ఇది ఇశ్రాయేలు లేదా యాకోబుపై ఉన్న ఆకాశాలను సూచించవచ్చు.
- source_word: יַעַרְפוּ טָל
  choice: మంచును కురిపిస్తాయి
  rationale: ערף ఇక్కడ మంచు చుక్కలు పడడం లేదా చిందడాన్ని సూచిస్తుంది. తెలుగులో ఆకాశాలకు సంబంధించి ‘మంచును కురిపిస్తాయి’ సహజమైన కావ్యప్రయోగం; హీబ్రూ అసంపూర్ణ క్రియారూపంలోని వర్తమాన లేదా భవిష్యత్ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: עֵין יַעֲקֹב యొక్క అర్థం
  choice: ‘యాకోబు ఊట’ అని ప్రధాన పాఠ్యంలో అనువదించడం
  alternative: ‘యాకోబు కన్ను’
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కంటే పదార్థ, కావ్య సందర్భ నిర్ణయం. ధాన్యం, కొత్త ద్రాక్షారసం, మంచు అనే సమృద్ధి చిత్రణ ‘ఊట’ అనే అర్థానికి మద్దతిస్తుంది; అసలు పదంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: בָּדָד యొక్క భావం
  choice: ‘ఏకాంతంగా’—భద్రమైన వేరుపాటు
  alternative: ‘తనంతట తానుగా’ లేదా ‘విడిగా’
  rationale: ఆశీర్వాద సందర్భం విడిచిపెట్టబడిన ప్రతికూల ఒంటరితనం కంటే ప్రశాంతమైన, ప్రత్యేకమైన భద్రతను సూచిస్తుంది; అయినా పదానికి మించిన సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కావ్యశైలిని ఉపయోగించాం. హీబ్రూ పంక్తుల సమాంతర నిర్మాణాన్ని అర్ధవిరామాలతో నిలిపాం. ‘యాకోబు ఊట’ అనే సంక్షిప్త రూపం అసలు కావ్యసాంద్రతను కాపాడుతుంది; అవసరమైన స్పష్టీకరణను మాత్రమే ‘ఉంది’ ద్వారా చేర్చాం.
