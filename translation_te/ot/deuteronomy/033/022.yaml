translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గంభీర శైలి వాడబడింది. హీబ్రూ కవితా పంక్తి నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది; సింహ రూపకం వివరించకుండా అలాగే ఉంచబడింది.
