  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: te
  text: 'దాను గురించి అతడు ఇలా అన్నాడు:


    “దాను సింహపు పిల్ల;


    అది బాషాను నుండి ఎగిరి దూకుతుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది బాషాను నుండి హఠాత్తుగా దూకుతుంది.” హీబ్రూ క్రియ అకస్మాత్తుగా ఎగిరి దూకే కదలికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: దాను గురించి
  rationale: సంయోజక అవ్యయం, విభక్త్యర్థక ఉపసర్గ కలిసి తదుపరి గోత్ర ఆశీర్వాదాన్ని పరిచయం చేస్తున్నాయి. ఆధునిక తెలుగులో ‘దాను గురించి’ సహజంగా ఉండి, ‘దానును గూర్చి’ కంటే ప్రస్తుత వాడుకకు అనుకూలం.
- source_word: אָמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: אָמַר అనే సాధారణ ఉక్తి క్రియను నేరుగా అందిస్తుంది; ‘ఇలా’ ప్రత్యక్ష ఉక్తిని సహజంగా పరిచయం చేస్తుంది.
- source_word: דָּן
  choice: దాను
  rationale: గోత్ర/వ్యక్తి నామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపమైన ‘దాను’గా లిప్యంతరీకరించాం.
- source_word: גּוּר אַרְיֵה
  choice: సింహపు పిల్ల
  rationale: ఈ నిర్మాణం చిన్న వయస్సు గల సింహాన్ని సూచిస్తుంది. ‘సింహపు పిల్ల’ ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉండి మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: יְזַנֵּק
  choice: ఒక్కసారిగా దూకుతుంది
  rationale: ఈ క్రియ అకస్మాత్తుగా ఎగిరి దూకే కదలికను సూచిస్తుంది. ‘దూకుతుంది’ మూలార్థాన్ని అతిగా వ్యాఖ్యానించకుండా ఇస్తుంది; ‘ఒక్కసారిగా’ ఆ కదలికలోని ఆకస్మికత్వాన్ని తెలియజేస్తుంది.
- source_word: מִן הַבָּשָׁן
  choice: బాషాను నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది. ‘నుండి’ దానిని నేరుగా వ్యక్తం చేస్తుంది; బాషాను స్థలనామంగా లిప్యంతరీకరించబడింది.
