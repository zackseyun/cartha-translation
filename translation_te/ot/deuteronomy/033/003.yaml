id: DEU.33.3
reference: Deuteronomy 33:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֚ף חֹבֵ֣ב עַמִּ֔ים כָּל קְדֹשָׁ֖י/ו בְּ/יָדֶ֑/ךָ וְ/הֵם֙ תֻּכּ֣וּ לְ/רַגְלֶ֔/ךָ יִשָּׂ֖א מִ/דַּבְּרֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: te
  text: నిశ్చయంగా, ఆయన ప్రజలను ప్రేమిస్తాడు; ఆయన పరిశుద్ధులందరూ నీ చేతిలో ఉన్నారు. వారు నీ పాదాల దగ్గర కూర్చుంటారు[a]; ప్రతి ఒక్కరూ నీ మాటలను స్వీకరిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘కూర్చుంటారు’ అని అనువదించిన హీబ్రూ క్రియ అర్థం అనిశ్చితం. దీనిని ‘సమకూరుతారు,’ ‘వంగి కూర్చుంటారు,’ లేదా ‘కొట్టివేయబడ్డారు’ అని కూడా అర్థం చేసుకున్నారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ప్రతి ఒక్కరూ నీ మాటల నుండి తీసుకుంటారు’ / ‘నీ పలుకులను మోస్తారు.’ ఇక్కడి హీబ్రూ ప్రయోగం అరుదైనది, అర్థం క్లిష్టమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఇది అదనాన్ని సూచించే పదంగా కాక, వాక్యాన్ని బలపరిచే నిశ్చయార్థక అవ్యయంగా పనిచేస్తుంది.
- source_word: חֹבֵב
  choice: ప్రేమిస్తాడు
  rationale: కృదంత రూపం నిరంతర స్వభావాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండే క్రియారూపం ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַמִּים
  choice: ప్రజలను
  rationale: బహువచన సమూహార్థాన్ని నిలుపుతూ, దీనిని అన్యజనులకు మాత్రమే పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: כָּל קְדֹשָׁיו
  choice: ఆయన పరిశుద్ధులందరూ
  rationale: దేవదూతలు లేదా ఇశ్రాయేలు ప్రజలు అని ప్రత్యేకంగా నిర్ధారించకుండా, ప్రత్యేకపరచబడిన పరిశుద్ధులనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతిలో
  rationale: రక్షణ, అధికారం అనే అంతర్భావాలు ఉండగలిగినా, హీబ్రూ రూపకాన్ని యథాతథంగా ఉంచి కవితలోని పురుష మార్పును సంరక్షిస్తుంది.
- source_word: תֻּכּוּ
  choice: కూర్చుంటారు
  rationale: రూపం అత్యంత క్లిష్టమైనది; ‘నీ పాదాల దగ్గర’ అనే సందర్భంలో వినడానికి లేదా శిష్యులవలె ఉండడానికి కూర్చోవడం సముచితంగా కనిపిస్తుంది. అనిశ్చితిని పాదటిప్పణిలో వెల్లడించాం.
- source_word: לְרַגְלֶךָ
  choice: నీ పాదాల దగ్గర
  rationale: స్థానం, విధేయత, శ్రద్ధగా వినడం అనే చిత్రాలకు సరిపోయే సహజమైన తెలుగు ప్రయోగం.
- source_word: יִשָּׂא
  choice: స్వీకరిస్తారు
  rationale: మూలార్థం ‘ఎత్తడం/మోయడం’; మాటల సందర్భంలో వాటిని తీసుకోవడం లేదా స్వీకరించడం అనే భావం సహజంగా సరిపోతుంది.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: నీ మాటలను
  rationale: అరుదైన రూపం మాటలు లేదా ఉక్తులను సూచిస్తుంది; ముందున్న מִן భాగార్థకంగా ఉండవచ్చు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: కవితలో పురుషసర్వనామాల మార్పు
  choice: ‘ఆయన… ఆయన… నీ… నీ… నీ’ అనే హీబ్రూ మార్పును నిలుపడం
  alternative: అన్నిటినీ తృతీయ పురుషంలోగాని ద్వితీయ పురుషంలోగాని ఏకరీతిగా మార్చడం
  rationale: ఈ మార్పు మూల కవితలో ఉన్న నిజమైన ఉద్విగ్నత. దాన్ని సరిచేయడం మూలంలోని ప్రత్యేకతను, సంభావ్య అస్పష్టతను తొలగిస్తుంది.
- issue: ‘పరిశుద్ధులు’ ఎవరనే ప్రశ్న
  choice: ఎవరని నిర్దిష్టీకరించకుండా ‘పరిశుద్ధులు’ అని ఉంచడం
  alternative: దేవదూతలు, ఇశ్రాయేలు పరిశుద్ధ ప్రజలు, లేదా సంఘపు సాధువులు అని నిర్దిష్టీకరించడం
  rationale: సందర్భం ఒక్క గుర్తింపును తప్పనిసరి చేయదు; అందుచేత ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యాన్ని ఉపయోగించాం. మూలంలోని సర్వనామ మార్పును అలాగే ఉంచాం; క్లిష్టమైన రెండు హీబ్రూ రూపాల అనిశ్చితిని పాదటిప్పణుల్లో స్పష్టంగా తెలిపాం.
