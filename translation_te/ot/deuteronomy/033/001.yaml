id: DEU.33.1
reference: Deuteronomy 33:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: te
  text: 'దేవుని మనిషి మోషే తన మరణానికి ముందు ఇశ్రాయేలు కుమారులను[a] దీవించిన దీవెన ఇది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే సాధారణ పదబంధం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ఇది
  rationale: వావ్‌తో కూడిన సూచన సర్వనామం కొత్త విభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో అనవసరమైన కాలార్థక పదాన్ని చేర్చకుండా సహజంగా ‘ఇది’ అని అనువదించాం.
- source_word: הַבְּרָכָה
  choice: దీవెన
  rationale: ఇది అధికారికంగా పలికిన ఆశీర్వచనాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దీవెన’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: దీవించిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంతో వ్యక్తం చేసి, ‘దీవెన’ మరియు ‘దీవించాడు’ మధ్యనున్న మూలపాఠ్య పదబంధ సంబంధాన్ని నిలిపాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: దైవిక నియామకం పొందిన వ్యక్తి లేదా ప్రవక్తకు వాడే హీబ్రూ బిరుదును పారదర్శకంగా, పురుష ఏకవచన రూపంలో నిలిపాం.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: హీబ్రూలోని ‘ఇశ్రాయేలు కుమారులు’ అనే కుటుంబసంబంధ, పురుష బహువచన రూపాన్ని నిలిపాం; ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచికలో వివరించాం.
- source_word: לִפְנֵי מוֹתוֹ
  choice: తన మరణానికి ముందు
  rationale: మూలంలోని నామవాచక కాలసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; ‘తన’ అనే ప్రతిబింబ సర్వనామం మరణం మోషేదేనని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమష్టి పదబంధం
  choice: ఇశ్రాయేలు కుమారులను
  alternative: ఇశ్రాయేలీయులను / ఇశ్రాయేలు ప్రజలను / ఇశ్రాయేలు సంతతివారిని
  rationale: మూలపాఠం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అనే పురుష బహువచన కుటుంబపదాన్ని వాడుతుంది. దాని రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, హీబ్రూ వాడుకలో అది ఇశ్రాయేలు ప్రజలందరినీ సమష్టిగా సూచించగలదని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వాక్యాన్ని శీర్షికసదృశ పరిచయంగా, గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలిలో నిర్మించాం. తరువాత వచ్చే దీవెనలకు పరిచయం కావడంతో చివర ద్విబిందువు ఉంచాం.
