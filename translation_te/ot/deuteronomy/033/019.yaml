id: DEU.33.19
reference: Deuteronomy 33:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: te
  text: 'వారు ప్రజలను పర్వతానికి పిలుస్తారు[a];

    అక్కడ వారు నీతియుక్తమైన బలులు అర్పిస్తారు.

    ఎందుకంటే వారు సముద్రాల సమృద్ధినీ[b],

    ఇసుకలో దాగివున్న సంపదలనూ[c] పొందుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక పర్వతానికి పిలుస్తారు’ అని కూడా అనువదించవచ్చు. అది ఏ పర్వతమో హీబ్రూ వచనం చెప్పదు.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: ‘సముద్రాల సమృద్ధిని పీల్చుకుంటారు.’ ఇది సముద్రం నుండి పోషణ లేదా సంపదను పొందడాన్ని తెలిపే రూపకం.'
    reason: lexical_alternative
  - marker: c
    text: ‘ఇసుకలో దాగినవి’ లేదా ‘ఇసుకలో పాతిపెట్టిన సంపదలు’ అని కూడా అనువదించవచ్చు. ఇవి సముద్రతీరం లేదా ఇసుక ప్రాంతాలకు సంబంధించిన వనరులు కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: జనసమూహాలను
  rationale: బహువచనమైన ఈ పదం అనేక సామూహిక జనవర్గాలను సూచిస్తుంది. ‘జనసమూహాలు’ అనే రూపం కేవలం వ్యక్తులను కాక సమూహాలను సూచిస్తూ, ‘దేశాలు’ అని అతిగా రాజకీయ అర్థం ఇవ్వకుండా ఉంటుంది.
- source_word: הַר
  choice: పర్వతానికి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేకపోయినా సందర్భంలో తెలిసిన ఒక పర్వతాన్ని సూచించే అవకాశం ఉంది. అయితే అది ఏ పర్వతమో వచనం చెప్పనందున పేరును చేర్చలేదు.
- source_word: יִקְרָאוּ
  choice: పిలుస్తారు
  rationale: קרא పదంలోని పిలవడం, ఆహ్వానించడం లేదా సమకూరమని పిలుపునివ్వడం అనే విస్తృత భావాన్ని ‘పిలుస్తారు’ నిలుపుతుంది.
- source_word: יִזְבְּחוּ
  choice: బలులు అర్పిస్తారు
  rationale: זבח బలి అర్పణను ప్రత్యేకంగా సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ ఆరాధనా భావాన్ని ‘బలులు అర్పిస్తారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: זִבְחֵי צֶדֶק
  choice: నీతియుక్తమైన బలులు
  rationale: నిర్మాణాన్ని అసహజంగా ‘నీతి యొక్క బలులు’ అని కాకుండా, బలుల న్యాయమైన లేదా యోగ్యమైన స్వభావాన్ని తెలియజేసేలా అనువదించాం; అవి ఎలా నీతియుక్తమైనవో వచనం నిర్ణయించదు.
- source_word: שֶׁפַע יַמִּים
  choice: సముద్రాల సమృద్ధి
  rationale: שׁפע సమృద్ధి లేదా విస్తారమైన వనరులను సూచిస్తుంది. ఈ పదబంధం సముద్రపు ఆహారం, వాణిజ్యం లేదా సంపదలో ఒక్కదానికే పరిమితం కాకుండా విస్తృతంగా ఉంచబడింది.
- source_word: יִינָקוּ
  choice: లాభం పొందుతారు
  rationale: క్రియకు అక్షరార్థంగా ‘పీల్చుకుంటారు’ అనే రూపకం ఉంది. తెలుగులో భావం సహజంగా ఉండేలా ‘లాభం పొందుతారు’ అని ఇచ్చి, మూల రూపకాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וּשְׂפוּנֵי טְמוּנֵי חוֹל
  choice: ఇసుకలో దాగివున్న నిధుల నుండీ
  rationale: రెండు ‘దాచిన/పాతిపెట్టిన’ భావాల సమ్మేళనం ఇసుకకు సంబంధించిన గుప్త వనరులను కవితాత్మకంగా సూచిస్తుంది. అవి ఏ వనరులో ప్రత్యేకంగా చెప్పకుండా ‘నిధులు’ అని అనువదించాం.
theological_decisions:
- issue: ‘నీతియుక్తమైన బలులు’ అనే పదబంధం యొక్క స్వభావం
  choice: బలులు నీతియుక్తమైనవి లేదా సరిగా అర్పించబడినవి అనే విస్తృత భావాన్ని నిలిపాం.
  alternative: నీతితో అర్పించే బలులు; దేవునికి ఆమోదయోగ్యమైన బలులు; విజయాన్ని ప్రకటించే బలులు
  rationale: צֶדֶק అనే పదం నైతిక నీతి, న్యాయం లేదా యోగ్యతను సూచించగలదు. తరువాతి సిద్ధాంత వర్గాలను చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: ‘పర్వతం’ దేనిని సూచిస్తుంది?
  choice: ఏ ప్రత్యేక పర్వతానికీ పేరు పెట్టకుండా ‘పర్వతం’గానే ఉంచాం.
  alternative: సీయోను పర్వతం; పర్వత మందిరం; గోత్రపు పర్వత ప్రాంతం
  rationale: మూలవచనం పర్వతం యొక్క గుర్తింపును స్పష్టం చేయదు. నిర్దిష్ట పేరును చేర్చడం వచనాన్ని మించి వ్యాఖ్యానించడం అవుతుంది.
- issue: సముద్రం, ఇసుకల సంపద యొక్క నిర్దిష్ట గుర్తింపు
  choice: సాధారణ వనరులు లేదా సంపద అనే కవితాత్మక భావాన్ని నిలిపాం.
  alternative: చేపలు; సముద్ర వాణిజ్య లాభాలు; గాజు తయారీ ఇసుక; నత్తల ఊదా రంగు; భూగర్భ సంపద
  rationale: ఈ వనరులు ఏమిటో హీబ్రూ నిర్దిష్టంగా చెప్పదు. చారిత్రకంగా ప్రతిపాదించిన ఏ ఒక్క గుర్తింపునూ అనువాదంలోకి తీసుకురాలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతర నిర్మాణాన్ని నిలుపుతూ సామాన్య పాఠకులకు సహజంగా ఉండే గంభీర శైలిని ఉపయోగించాం. మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో భావానువాదం చేసి పాదటిప్పణిలో అక్షరార్థంగా తెలిపాం; పర్వతం మరియు గుప్త నిధుల గుర్తింపును ఉద్దేశపూర్వకంగా నిర్దిష్టం చేయలేదు.
