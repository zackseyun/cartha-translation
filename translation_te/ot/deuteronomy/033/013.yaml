source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: te
  text: 'యోసేపును గురించి అతడు ఇలా అన్నాడు:


    “యాహ్వే అతని భూమిని ఆశీర్వదించుగాక;

    ఆకాశం ఇచ్చే శ్రేష్ఠమైన వాటితో[a], మంచుతో,

    కింద పరుండే అగాధంతో[b] దాన్ని ఆశీర్వదించుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశం నుండి వచ్చే అమూల్యమైన వాటితో.”
    reason: מֶגֶד మరియు מן పదబంధాన్ని మరింత పదానుసారంగా అనువదించే ప్రత్యామ్నాయం.
  - marker: b
    text: “అగాధం” బహుశా భూమికింద ఉండి నేలకు నీరందిస్తాయని భావించిన లోతైన జలాలను సూచిస్తుంది.
    reason: ప్రాచీన భౌగోళిక-జలసంబంధ చిత్రాన్ని ఆధునిక పాఠకునికి వివరిస్తుంది.
lexical_decisions:
- source_word: וּלְיוֹסֵף אָמַר
  choice: యోసేపును గురించి అతడు ఇలా అన్నాడు
  rationale: ఆశీర్వాదాల వరుసలో לְ ఉపసర్గ విషయసూచకంగా ఉంది. ‘గురించి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రత్యక్ష వాక్యానికి పరిచయాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: యాహ్వే అతని భూమిని ఆశీర్వదించుగాక
  rationale: నిష్క్రియాత్మక కృదంతంతో ఉన్న ఆశీర్వాద సూత్రాన్ని తెలుగులో సహజమైన ఆశీర్వచన రూపంతో వ్యక్తం చేశాం. אַרְצוֹ అనేది యోసేపు గోత్రాలకు దక్కే భూభాగాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: ఆకాశం ఇచ్చే శ్రేష్ఠమైన వాటితో
  rationale: מֶגֶד విలువైన లేదా అత్యుత్తమమైన సంపద/ఫలసమృద్ధిని సూచిస్తుంది. వ్యవసాయ ఆశీర్వాద సందర్భంలో ‘ఆకాశం ఇచ్చే’ అన్నది మూలసంబంధాన్ని సహజంగా తెలియజేస్తుంది; పదం సూచించే అంశాలను అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: מִטָּל
  choice: మంచుతో
  rationale: ఇక్కడ טַל అనేది భూమికి తేమనిచ్చే రాత్రి మంచును సూచిస్తుంది. מן వరుసను ఆశీర్వాద సాధనాలుగా తెలుగులో ‘తో’ ద్వారా తెలిపాం.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: కింద పరుండే అగాధంతో
  rationale: תְּהוֹם ను ‘అగాధం’గా ఉంచి దాని జలసంబంధ భావాన్ని పాదటిప్పణిలో వివరించాం. רֹבֶצֶת లోని సజీవమైన ‘పరుండడం’ రూపకాన్ని మృదువుగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. కాబట్టి దాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ రూపంలో ఇచ్చాం.
- issue: תְּהוֹם యొక్క భావం
  choice: అగాధం
  alternative: భూమికిందనున్న జలాలు
  rationale: ‘భూమికిందనున్న జలాలు’ సందర్భానుసారమైన సంభావ్య వివరణ అయినా, మూలంలోని విస్తృతమైన కవితాత్మక పదాన్ని ప్రధాన పాఠంలో నిలిపి, వివరణను పాదటిప్పణికి పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వచన శైలిని ఉపయోగించాం. కవితాత్మక సమాంతరత కోసం పాద విభజనను ఉంచాం. పునరుక్తమైన ‘దాన్ని ఆశీర్వదించుగాక’ తెలుగు వాక్యనిర్మాణాన్ని పూర్తి చేస్తుంది; మూలంలోని ఆశీర్వాద క్రియ పరిధినే కొనసాగిస్తుంది.
