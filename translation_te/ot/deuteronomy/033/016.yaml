revisions:
- from: భూమిలోని శ్రేష్ఠమైన వాటితో, దాని సమృద్ధితో, పొదలో నివసించినవాని అనుగ్రహంతో—అవి యోసేపు తలమీదికి, తన సహోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాని నడినెత్తిమీదికి రావాలి.[a]
  to: భూమిలోని శ్రేష్ఠమైన వాటితో, దానిలో ఉన్న సమస్తంతో, ముళ్లపొదలో నివసించినవాని అనుగ్రహంతో—అవి యోసేపు తలమీదికి, తన సహోదరులలో ప్రత్యేకించబడినవాని నడినెత్తిమీదికి రావాలి.[a]
  rationale: The revision makes the bush image lexically precise and adjusts the final phrase to preserve the Hebrew’s possible sense of consecrated or distinguished status among Joseph’s brothers. It keeps the poetic blessing structure, the collective force of the incoming blessings, and the existing footnote anchor and function.
