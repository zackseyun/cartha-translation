  edition: WLC
  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: te
  text: భూమిలోని శ్రేష్ఠమైన వాటితో, దానిలో ఉన్న సమస్తంతో, ముళ్లపొదలో నివసించినవాని అనుగ్రహంతో—అవి యోసేపు తలమీదికి, తన సహోదరులలో ప్రత్యేకించబడినవాని నడినెత్తిమీదికి రావాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన సహోదరులలో ప్రత్యేకించబడినవాడు” అనే మాటను “తన సహోదరులలో నాయకుడు” లేదా “తన సహోదరులలో ప్రతిష్ఠించబడినవాడు” అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ పదం ప్రత్యేకించబడడం అనే భావాన్ని ప్రధానంగా సూచిస్తూ, యోసేపు విషయంలో ఆధిక్యతను కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: భూమిలోని శ్రేష్ఠమైన వాటితో
  rationale: מֶגֶד ఆశీర్వాద సందర్భంలో శ్రేష్ఠమైన లేదా అమూల్యమైన పంటలు/వస్తువులను సూచిస్తుంది. ముందు వచనాల ఆశీర్వాద శ్రేణిని కొనసాగించేందుకు ‘వాటితో’ సహజంగా ఉంది.
- source_word: וּמְלֹאָהּ
  choice: దాని సమృద్ధితో
  rationale: అక్షరార్థంగా ‘దాని నిండుదనం’; ఆధునిక తెలుగులో భూమిని నింపిన సమస్త సంపద అనే కవితాత్మక భావాన్ని ‘సమృద్ధి’ స్పష్టంగా అందిస్తుంది.
- source_word: וּרְצוֹן
  choice: అనుగ్రహంతో
  rationale: ఇక్కడ רָצוֹן దేవుని దయాపూర్వక ప్రసన్నతను సూచిస్తుంది; ‘అనుగ్రహం’ గౌరవప్రదంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שֹׁכְנִי סְנֶה
  choice: పొదలో నివసించినవాని
  rationale: ఈ భాగం నిర్గమకాండం 3లో మోషేకు పొదలో దేవుడు ప్రత్యక్షమైన సంఘటనను సూచిస్తుంది. వివరణాత్మక రూపం మూలంలోని దైవసూచనను విస్తరించకుండా నిలుపుతుంది.
- source_word: תָּבוֹאתָה
  choice: అవి ... రావాలి
  rationale: హీబ్రూలో క్రియ ఏకవచన స్త్రీలింగంలో ఉండి సమష్టి ఆశీర్వాదాన్ని సూచిస్తుంది. తెలుగులో ముందు పేర్కొన్న అనేక ఆశీర్వాద అంశాలతో సహజ అన్వయం కోసం బహువచనం వాడబడింది; ఆశీర్వాదాత్మక కోరికను ‘రావాలి’ నిలుపుతుంది.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: యోసేపు తలమీదికి
  rationale: ఆశీర్వాదం ఒకరి తలపైకి రావడం అనే మూలభాషా రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: וּלְקָדְקֹד
  choice: నడినెత్తిమీదికి
  rationale: קָדְקֹד తల పైభాగాన్ని సూచిస్తుంది. ‘నడినెత్తి’ తెలుగు కవితాత్మక సమాంతరతను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: נְזִיר אֶחָיו
  choice: తన సహోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాని
  rationale: נָזִיר యొక్క ప్రాథమిక భావం ప్రత్యేకపరచబడిన లేదా ప్రతిష్ఠించబడిన వ్యక్తి. యోసేపు సహోదరులలో అతని ఆధిక్యత భావం ఉండవచ్చుగాని, ‘ప్రభువు/నాయకుడు’ అని నిర్ణయించకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: ‘పొదలో నివసించినవాడు’ ఎవరు?
  choice: మండుతున్న పొదలో మోషేకు ప్రత్యక్షమైన దేవునికి సూచనగా వివరణాత్మక బిరుదును యథాతథంగా ఉంచడం
  alternative: సీనాయి/హోరేబుతో సంబంధమున్న మరింత సాధారణ దైవ ప్రత్యక్షతగా అర్థం చేసుకోవడం
  rationale: ఈ పదబంధం నిర్గమకాండం 3ను బలంగా జ్ఞాపకం చేస్తుంది. అయితే వచనం దేవునికి మరింత నిర్దిష్ట సిద్ధాంతపరమైన పేరు ఇవ్వదు; అందువల్ల సూచనను మాత్రమే నిలుపుతుంది.
- issue: נְזִיר אֶחָיו యొక్క భావం
  choice: సహోదరుల నుండి ప్రత్యేకంగా ఉంచబడినవాడు
  alternative: సహోదరులలో నాయకుడు లేదా ప్రతిష్ఠితుడు
  rationale: పదం ప్రత్యేకపరచడం/ప్రతిష్ఠించడం అనే భావాన్ని కలిగి ఉంది; యోసేపు విషయంలో ఆధిక్యతను కూడా సూచించవచ్చు. ప్రధాన పాఠం ఒకే వ్యాఖ్యానానికి పరిమితం కాకుండా మూలార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక ఆశీర్వాద స్వరాన్ని గౌరవప్రదంగా నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదం చివర ఉంచబడింది.
