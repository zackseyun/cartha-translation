id: DEU.33.2
reference: Deuteronomy 33:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు:


    “యాహ్వే సీనాయి నుండి వచ్చాడు;

    శేయీరు నుండి వారిమీద ఉదయించాడు.

    పారాను పర్వతం నుండి ప్రకాశించాడు;

    పరిశుద్ధత యొక్క పదివేల సమూహాల నుండి వచ్చాడు.[a]

    ఆయన కుడిచేతి నుండి వారి కోసం

    అగ్నిమయమైన ధర్మశాస్త్రం వచ్చింది.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధులైన అసంఖ్యాకుల నుండి.” హెబ్రీ పదబంధం భావవాచకమైన ‘పరిశుద్ధత’ను కాకుండా పరిశుద్ధ పరివారాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడి హెబ్రీ పదం క్లిష్టమైనది, దాని అర్థం అనిశ్చితం. సంప్రదాయంగా “అగ్నిమయమైన ధర్మశాస్త్రం” అని అనువదిస్తారు; “అగ్ని మెరుపులు” లేదా ఆయన కుడిచేతి నుండి వెలువడిన అగ్ని అనే అర్థమూ సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన లిప్యంతరీకరణగా ఉంచింది.
- source_word: מִסִּינַי בָּא
  choice: సీనాయి నుండి వచ్చాడు
  rationale: దైవ ప్రత్యక్షతలోని రాకను, מִן యొక్క దిశార్థాన్ని నేరుగా కాపాడుతుంది.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: శేయీరు నుండి వారిమీద ఉదయించాడు
  rationale: זרח లోని సూర్యోదయపు కాంతి రూపకాన్ని ‘ఉదయించాడు’ నిలుపుతుంది; לָמוֹ ను ఆ కాంతి వారిమీద ప్రసరించిన భావంలో తెలిపింది.
- source_word: הוֹפִיעַ
  choice: ప్రకాశించాడు
  rationale: దీప్తితో వెలుగుచూపడం లేదా ప్రకాశిస్తూ ప్రత్యక్షమవడం అనే హిఫీల్ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מֵהַר פָּארָן
  choice: పారాను పర్వతం నుండి
  rationale: స్థలనామాన్ని, הַר అనే ‘పర్వతం’ అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְאָתָה
  choice: వచ్చాడు
  rationale: సమీపించడం లేదా రావడం అనే ప్రాథమిక భావాన్ని కవితా సమాంతరతలో నిలుపుతుంది.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: పరిశుద్ధతగల పదివేల సమూహాల మధ్యనుండి
  rationale: רבבות లోని ‘పదివేల సమూహాలు’ అనే బహువచన భావాన్ని, קדש లోని పరిశుద్ధత భావాన్ని ఉంచుతూ, అది పరిశుద్ధ జీవులను సూచించవచ్చనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: מִימִינוֹ
  choice: ఆయన కుడిచేతి నుండి
  rationale: מִן యొక్క సహజమైన మూల లేదా ఉద్గమ భావాన్ని నిలుపుతుంది.
- source_word: אשדת
  choice: అగ్నిమయమైన ధర్మశాస్త్రం
  rationale: అస్పష్టమైన ఈ హెబ్రీ రూపానికి సీనాయి సందర్భానికి సరిపోయే సంప్రదాయ పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పదార్థ అనిశ్చితిని పాదటిప్పణిలో బహిర్గతం చేసింది.
- source_word: לָמוֹ
  choice: వారి కోసం
  rationale: మూడవ పురుష బహువచన సూచనను, వారికి అనుగ్రహించబడినదనే ప్రయోజన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కవితాత్మక దైవ ప్రత్యక్షతలో కర్త ఎవరు?
  choice: కర్తను పాత నిబంధన సందర్భానుసారం ‘యాహ్వే’ అని పేర్కొనడం
  alternative: తరువాతి క్రైస్తవ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: ఈ వాక్యం సీనాయి, శేయీరు, పారాను ప్రాంతాలతో సంబంధమున్న యాహ్వే ప్రత్యక్షతను వర్ణిస్తుంది; తరువాతి కాలపు దైవశాస్త్ర అన్వయాన్ని అనువాద పదాల్లోకి దిగుమతి చేయలేదు.
- issue: מֵרִבְבֹת קֹדֶשׁ యొక్క అర్థం
  choice: పరిశుద్ధత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘పరిశుద్ధులు’ అనే పఠనాన్ని పాదటిప్పణిలో ఇవ్వడం
  alternative: పరిశుద్ధులైన పదివేలమంది మధ్యనుండి
  rationale: קדש ఇక్కడ భావవాచకమైన ‘పరిశుద్ధత’ను గానీ, సందర్భానుసారం పరిశుద్ధ పరివారాన్ని గానీ సూచించవచ్చు; దేవదూతల పరివారం అని ప్రధాన పాఠ్యంలోనే ఖరారు చేయలేదు.
- issue: אשדת యొక్క అర్థం
  choice: అగ్నిమయమైన ధర్మశాస్త్రం
  alternative: అగ్ని మెరుపులు; ఆయన కుడిచేతి నుండి వెలువడిన అగ్ని
  rationale: హెబ్రీ రూపం అత్యంత క్లిష్టమైనది. సీనాయి సందర్భానికి సరిపోయే సంప్రదాయ పఠనాన్ని చదవదగిన ప్రధాన పాఠ్యంలో ఉంచి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా లయను ఉంచింది. స్థలనామాలకు ‘సీనాయి, శేయీరు, పారాను’ రూపాలను వాడింది. క్లిష్టమైన హెబ్రీ పదబంధాలను అతిగా వివరణాత్మకంగా మార్చకుండా, అవసరమైన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఉంచింది.
