source:
  edition: WLC
  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: te
  text: 'వారు యాకోబుకు నీ న్యాయవిధులను,

    ఇశ్రాయేలుకు నీ ధర్మశాస్త్రాన్ని[a] బోధిస్తారు;

    వారు నీ సన్నిధిలో ధూపం సమర్పిస్తారు[b],

    నీ బలిపీఠం మీద సంపూర్ణ దహనబలిని అర్పిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఉపదేశాన్ని.” תּוֹרָה అనే పదానికి ధర్మశాస్త్రం, ఉపదేశం అనే అర్థాలు రెండూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “నీ ముక్కు/నాసిక వద్ద.” ఇది దేవుని ఎదుట ధూపం సమర్పించడాన్ని తెలిపే మానవసదృశ ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: బోధిస్తారు
  rationale: ירה హిఫిల్ రూపం యాజక సంబంధమైన న్యాయబోధ సందర్భంలో ‘బోధించు/ఉపదేశించు’ అని అర్థం. ఆధునిక తెలుగులో ‘బోధిస్తారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: מִשְׁפָּטֶיךָ
  choice: నీ న్యాయవిధులను
  rationale: מִשְׁפָּט అనే పదంలోని న్యాయపరమైన తీర్పులు, నియమాలు అనే భావాన్ని ‘న్యాయవిధులు’ కాపాడుతుంది; కేవలం వ్యక్తిగత తీర్పులుగా అపార్థం కాకుండా చేస్తుంది.
- source_word: לְיַעֲקֹב
  choice: యాకోబుకు
  rationale: לְ ఇక్కడ పరోక్ష కర్మను సూచిస్తుంది. ‘యాకోబుకు’ అనేది ప్రత్యక్షమైన తెలుగు రూపం; తరువాతి ‘ఇశ్రాయేలుకు’తో కవితా సమాంతరతను నిలుపుతుంది.
- source_word: וְתוֹרָתְךָ
  choice: నీ ధర్మశాస్త్రాన్ని
  rationale: תּוֹרָהకు ‘బోధ/ఉపదేశం’ అనే విస్తృత అర్థం ఉన్నా, నిబంధన సంబంధమైన ఈ సందర్భంలో ‘ధర్మశాస్త్రం’ దాని నియమబద్ధమైన భావాన్ని స్పష్టంగా అందిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: לְను సహజంగా ‘ఇశ్రాయేలుకు’ అని అనువదించి, ‘యాకోబుకు’తో ఉన్న కవితా సమాంతరతను నిలిపాం.
- source_word: יָשִׂימוּ
  choice: వేస్తారు
  rationale: שׂים అంటే పెట్టు/ఉంచు. ధూపారాధన సందర్భంలో ‘ధూపం వేస్తారు’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: קְטוֹרָה
  choice: ధూపం
  rationale: ఈ నామవాచకం ధూపాన్ని సూచిస్తుంది. బలి సంబంధమైన సందర్భం వాక్యంలోనే స్పష్టంగా ఉన్నందున ‘ధూపం’ సరిపోతుంది.
- source_word: בְּאַפֶּךָ
  choice: నీ సన్నిధిలో
  rationale: పదశః ‘నీ ముక్కు/నాసిక వద్ద’ అనే మానవరూపక ప్రయోగం. ఇక్కడ కోపం కాదు; దేవుని ఎదుట ధూపం సమర్పించడమే సందర్భార్థం. ‘నీ సన్నిధిలో’ తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; పదశః రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְכָלִיל
  choice: పూర్తిగా దహనమయ్యే బలులను
  rationale: כָּלִיל బలిపీఠంపై సంపూర్ణంగా కాల్చబడే అర్పణను సూచిస్తుంది. సంఖ్యాపరంగా నిర్దిష్టత లేని సామూహిక/వర్గార్థాన్ని తెలుగులో బహువచనంతో సహజంగా వ్యక్తం చేశాం.
- source_word: עַל מִזְבְּחֶךָ
  choice: నీ బలిపీఠం మీద
  rationale: బలి సందర్భంలో עַל + מִזְבֵּחַకు ప్రత్యక్షమైన, సహజమైన తెలుగు అనువాదం.
theological_decisions:
- issue: నిబంధన సందర్భంలో תּוֹרָה అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం / బోధ
  rationale: ఈ వాక్యం దేవుని నిబంధన నియమాలను ఇశ్రాయేలుకు బోధించే లేవీయుల బాధ్యతను వివరిస్తుంది. ‘ధర్మశాస్త్రం’ న్యాయ-నిబంధన భావాన్ని నిలుపుతుంది; మూలపదపు విస్తృతమైన ‘ఉపదేశం’ అర్థాన్ని పాదసూచికలో కాపాడాం.
- issue: בְּאַפֶּךָలోని మానవరూపక భాష
  choice: నీ సన్నిధిలో
  alternative: నీ ముక్కు/నాసిక వద్ద
  rationale: పదశః అనువాదం ఆధునిక తెలుగులో అస్పష్టంగా లేదా విచిత్రంగా వినిపిస్తుంది. ధూపం దేవుని ఎదుట సమర్పించబడుతుందనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అసలు రూపకాన్ని పాదసూచికలో నిలిపాం.
- issue: כָּלִיל యొక్క సంఖ్య మరియు బలి స్వభావం
  choice: పూర్తిగా దహనమయ్యే బలులను
  alternative: పూర్తిగా దహనమయ్యే బలిని
  rationale: హీబ్రూ ఏకవచన రూపం ఒక బలి రకాన్ని లేదా సమూహార్థాన్ని సూచించగలదు. సాధారణ యాజక సేవను వర్ణించే ఈ సందర్భంలో తెలుగు బహువచనం సహజంగా ఉంది; నిర్దిష్టమైన ఒక్క బలిని అనవసరంగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ కవితా సమాంతరతను పాద విభజనతో నిలిపాం. ‘ధర్మశాస్త్రం’ వంటి పరిచిత బైబిలు పదాన్ని ఉంచినా, మూలంలోని విస్తృత భావాన్ని పాదసూచికలో తెలిపాం. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
