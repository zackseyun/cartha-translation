source:
  edition: WLC
  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: te
  text: 'గాదు గురించి అతడు ఇలా అన్నాడు:


    “గాదుకు విశాల స్థలం కలిగించేవాడు ధన్యుడు.[a]


    గాదు సింహంలా[b] నివసిస్తూ,


    బాహువును, నడినెత్తినీ కూడా చీల్చివేస్తాడు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాదుకు విశాల స్థలం కలిగించేవాడు ధన్యుడగుగాక.” ఇక్కడ కర్త దేవుడని భావించవచ్చు; అయితే హీబ్రూ పాఠం ఆయనను స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆడసింహంలా.” హీబ్రూ పదం ఆడసింహాన్నీ, సాధారణంగా బలమైన సింహాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “బాహువును, నడినెత్తినీ కూడా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד אָמַר
  choice: గాదు గురించి అతడు ఇలా అన్నాడు
  rationale: గోత్రాన్ని ఉద్దేశించి పలికే ఆశీర్వాద సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּרוּךְ
  choice: స్తుతింపబడాలి
  rationale: ఇది ఆశీర్వాదాత్మక ప్రకటన. తెలుగులో సహజంగా ఉండేలా వ్యక్తిపై పలికిన ప్రశంస/ఆశీర్వాద భావాన్ని నిలుపుతుంది.
- source_word: מַרְחִיב גָּד
  choice: గాదుకు విశాల స్థలం కలిగించేవాడు
  rationale: హిఫిల్ కృదంతం గాదుకు స్థలాన్ని విస్తరించడం లేదా చోటు కల్పించడం అనే భావాన్ని ఇస్తుంది; కర్తను దేవుడని మూలపాఠం స్పష్టంగా చెప్పనందున అనిర్దిష్టంగానే ఉంచబడింది.
- source_word: כְּלָבִיא
  choice: సింహంలా
  rationale: לָבִיא బలమైన వయోజన సింహాన్ని సూచించగలదు; లింగం సందర్భంలో నిర్బంధంగా నిర్ణయించబడదు. తెలుగు సాధారణ రూపం సహజంగా ఉండి బలమైన మృగం అనే ఉపమానాన్ని నిలుపుతుంది.
- source_word: שָׁכֵן
  choice: పొంచి ఉండి
  rationale: క్రియకు నివసించడం, స్థిరపడడం, పడుకొని ఉండడం అనే పరిధి ఉంది. సింహపు ఉపమానంలో ‘పొంచి ఉండి’ సహజంగా సరిపోతుంది; గోత్రపు స్థిరనివాస భావాన్నీ పూర్తిగా తొలగించదు.
- source_word: וְטָרַף
  choice: చీల్చివేస్తాడు
  rationale: טרף మృగం ఎరను హింసాత్మకంగా చీల్చే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: זְרוֹעַ
  choice: బాహువు
  rationale: కాద్కోద్‌తో జతగా ఉన్నందున బలం అనే రూపకాలంకార భావం కంటే శరీరభాగం అనే అక్షరార్థం సముచితం.
- source_word: אַף קָדְקֹד
  choice: చివరికి నడినెత్తిని కూడా
  rationale: אַף తీవ్రతను పెంచే సముచ్చయ అవ్యయం; קָדְקֹד తల పైభాగం లేదా నడినెత్తిని సూచిస్తుంది.
theological_decisions:
- issue: గాదుకు విశాల స్థలం కలిగించేవాని గుర్తింపు
  choice: కర్తను పేరుపెట్టి దేవుడని చెప్పకుండా ‘కలిగించేవాడు’ అని ఉంచడం
  alternative: ‘గాదుకు విశాల స్థలం కలిగించే దేవుడు స్తుతింపబడాలి’
  rationale: మూల హీబ్రూలో దేవుడు అంతర్లీన కర్తగా భావించవచ్చును, కాని ఆయన పేరు ప్రత్యక్షంగా లేదు. అందువల్ల ఆ ఉద్దేశ్యపూర్వక విపులత్వాన్ని అనువాదం కాపాడుతుంది.
- issue: לָבִיא యొక్క లింగ సూచన
  choice: సింహం
  alternative: ఆడసింహం
  rationale: ఈ పదం ఆడసింహాన్ని సూచించగలిగినా, శక్తివంతమైన సింహానికి సాధారణ పదంగానూ వాడబడుతుంది. ప్రధాన వాక్యంలో సహజమైన సాధారణ రూపం, పాదసూచికలో ప్రత్యామ్నాయం ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలి వాడబడింది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుకరించకుండా, ఆశీర్వాద వాక్యంలోని బలం మరియు హింసాత్మక సింహ ఉపమానం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
