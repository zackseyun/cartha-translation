id: DEU.33.6
reference: Deuteronomy 33:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְחִ֥י רְאוּבֵ֖ן וְ/אַל יָמֹ֑ת וִ/יהִ֥י מְתָ֖י/ו מִסְפָּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: te
  text: రూబేను జీవించుగాక, అతడు చనిపోకుండా ఉండుగాక; అతని జనులు కొద్దిమందిగా ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని జనులు లెక్కలో ఉండుగాక.” చివరి ఖండంలోని హీబ్రూ క్లిష్టంగా ఉంది. రూబేను ప్రాముఖ్యత కోల్పోకూడదని లేదా గోత్రాల లెక్క నుండి తొలగించబడకూడదని చేసే ప్రార్థనగా కూడా దీనిని అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: జీవించుగాక
  rationale: חיה ధాతువు Qal jussive రూపంలో ఆశీర్వాదపూర్వకమైన కోరికను వ్యక్తం చేస్తుంది. ‘జీవించుగాక’ ఆ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: వ్యక్తి/గోత్ర నామాన్ని తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: וְאַל יָמֹת
  choice: చనిపోకుండుగాక
  rationale: אַל తో కూడిన jussive ప్రతికూల కోరికను సూచిస్తుంది. מות యొక్క సాధారణ అర్థమైన ‘చనిపోవడం’ను నేరుగా నిలుపుతూ, ముందున్న ఆశీర్వాద వాక్యంతో సమాంతరంగా అనువదించాం.
- source_word: וִיהִי
  choice: ఉండుగాక
  rationale: రెండవ jussive మరో కోరికను పరిచయం చేస్తుంది; ‘ఉండుగాక’ ఆ సంకల్పార్థక సమాంతరతను కాపాడుతుంది.
- source_word: מְתָיו
  choice: అతని మనుషులు
  rationale: ఈ పదం క్లిష్టమైనది. ఈ గోత్రాశీర్వాద సందర్భంలో ‘అతని మనుషులు/ప్రజలు’ అనే భావం వాక్యనిర్మాణానికి సరిపోతుంది; ‘చనిపోయినవారు’ అనే సాధారణ ప్రత్యామ్నాయ భావం ఇక్కడ అసంభవంగా కనిపిస్తుంది.
- source_word: מִסְפָּר
  choice: కొద్దిమందిగా
  rationale: పదశః ‘సంఖ్య’; היה తో కూడిన ఈ సంక్షిప్త ప్రయోగం ‘సంఖ్యలో కొద్దిగా/లెక్కించదగినంతగా’ అనే భావాన్ని ఇవ్వవచ్చు. సహజ తెలుగులో ‘కొద్దిమందిగా’ ప్రధాన సంభావ్య అర్థాన్ని అందిస్తుంది; ఇతర పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: וִיהִי מְתָיו מִסְפָּר అనే చివరి ఖండం యొక్క అర్థం
  choice: రూబేను సంఖ్యలో చిన్నవాడైనా నిలిచి ఉండాలని సూచించే ‘అతని మనుషులు కొద్దిమందిగా ఉండుగాక’
  alternative: ‘అతని మనుషులు లెక్కలో ఉండుగాక,’ అంటే గోత్రాల లెక్క నుండి తొలగించబడకుండుగాక
  rationale: మసొరెటిక్ పాఠం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. מִסְפָּר ను היה తో చదివితే ‘కొద్దిమంది/లెక్కించదగినంత మంది’ అనేది సహజమైన భావం. మరింత అనుకూలంగా వినిపించే కొన్ని పఠనాలు భిన్న నిర్మాణం లేదా పాఠసవరణపై ఆధారపడతాయి. అందువల్ల ప్రధాన పాఠంలో సాధ్యమైన ప్రత్యక్ష అర్థాన్ని ఇచ్చి, నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆశీర్వాద శైలిని ఉపయోగించాం. మూలంలోని రెండు jussive కోరికలను ‘-గాక’ రూపాలతో నిలిపాం. చివరి ఖండంలోని అస్పష్టతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా ప్రత్యామ్నాయ పఠనాన్ని [a] పాదటిప్పణిలో ఇచ్చాం.
