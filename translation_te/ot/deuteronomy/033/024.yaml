base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: te
  text: 'ఆశేరు విషయమై అతడు ఇలా అన్నాడు:


    “కుమారులకంటే ఆశేరు మరింత ధన్యుడు[a];


    తన సహోదరులకు ప్రీతిపాత్రుడగుగాక[b];


    తన పాదాన్ని నూనెలో ముంచుగాక[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారులలోకెల్లా ఆశేరు అత్యంత ధన్యుడు.” హెబ్రీ తులనను తులనాత్మకంగానూ అత్యుత్తమ భావంగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు” అనేది బహుశా ఇశ్రాయేలులోని ఇతర గోత్రాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: “తన పాదాన్ని నూనెలో ముంచుట” అనే చిత్రం బహుశా సమృద్ధిని లేదా సుభిక్షతను సూచిస్తుంది; అయితే హెబ్రీలోని చిత్రాన్ని అనువాదంలో యథాతథంగా ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: ఆశేరు గురించి అతడు ఇలా అన్నాడు
  rationale: లְ ఉపసర్గ ఇక్కడ తదుపరి గోత్రానికి ఉద్దేశించిన దీవెనను పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘గురించి’ సహజంగా ఉండి, మూలంలోని ప్రసంగ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: కుమారులందరిలో ఆశేరు అత్యధికంగా దీవించబడినవాడగుగాక
  rationale: מִן నిర్మాణానికి తులనాత్మక లేదా అత్యుత్తమ భావం ఉండవచ్చు. ప్రధాన పాఠ్యంలో సందర్భోచితమైన అత్యుత్తమ భావాన్ని ఇచ్చి, నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం. ‘కుమారులు’ అనే పుంలింగ రూపం మూలానికి అనుగుణం.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: తన సహోదరులకు ప్రీతిపాత్రుడగుగాక
  rationale: రְצוּי అనేది ఆమోదం లేదా అనుగ్రహపూర్వక ఆదరణ పొందడాన్ని సూచిస్తుంది. ‘ప్రీతిపాత్రుడు’ సంబంధాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆశీర్వాద సందర్భంలోని ఆకాంక్షను ‘గాక’ నిలుపుతుంది.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: తన పాదాన్ని నూనెలో ముంచుగాక
  rationale: కవితాత్మక సమాంతరతలోని క్రియారూపాన్ని ముందున్న ఆశీర్వాద ఆకాంక్షతో సమన్వయపరచాం. ఏకవచన ‘పాదం’ను, నిర్దిష్టీకరించని ‘నూనె’ను, స్పష్టమైన దృశ్యరూపాన్ని యథాతథంగా నిలిపాం.
theological_decisions:
- issue: ‘తన పాదాన్ని నూనెలో ముంచుట’ అనే ఆశీర్వాద చిత్రానికి అర్థం
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని అక్షరార్థ చిత్రంగానే నిలుపడం
  alternative: సమృద్ధమైన ఆలివ్ పంట, ఐశ్వర్యం, సౌఖ్యం లేదా ప్రాంతీయ సుభిక్షత అని నేరుగా వ్యాఖ్యానించడం
  rationale: ఈ చిత్రం సమృద్ధి లేదా సుభిక్షతను సూచించే అవకాశం ఉన్నా, హెబ్రీ పాఠ్యం దాని నిర్దిష్ట భావాన్ని చెప్పదు. అందువల్ల కవితాత్మక, ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆశీర్వాద శైలిని ఉపయోగించాం. కవితాత్మక వరుసలను విడిగా ఉంచి, ప్రతి ఆకాంక్షకు ‘గాక’ రూపాన్ని వాడాం. ‘సహోదరులు’ మరియు ‘పాదం’ అనే రూపాలు మూలంలోని వ్యాకరణ సంఖ్య, కుటుంబ/గోత్ర రూపకాన్ని నిలుపుతాయి.
