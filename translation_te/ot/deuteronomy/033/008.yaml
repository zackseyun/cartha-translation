source:
  edition: WLC
  text: וּ/לְ/לֵוִ֣י אָמַ֔ר תֻּמֶּ֥י/ךָ וְ/אוּרֶ֖י/ךָ לְ/אִ֣ישׁ חֲסִידֶ֑/ךָ אֲשֶׁ֤ר נִסִּית/וֹ֙ בְּ/מַסָּ֔ה תְּרִיבֵ֖/הוּ עַל מֵ֥י מְרִיבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: te
  text: 'లేవి గురించి అతడు ఇలా అన్నాడు:

    “నీ తుమ్మీము, నీ ఊరీము

    నీ విశ్వాసపాత్రునికి చెందుతాయి[a].

    నీవు మస్సాలో అతణ్ణి పరీక్షించావు[b];

    మెరీబా జలాల దగ్గర అతనితో వాదించావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ భక్తునికి’ లేదా ‘నీ నిబద్ధుడైన వ్యక్తికి.’ ఈ హెబ్రీ పదబంధం నిబంధన సంబంధమైన నిబద్ధతగల వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మస్సా’ అనే పేరుకు ‘పరీక్షించడం’ అనే భావం ఉంది; ‘మెరీబా’ అనే పేరు ‘వాదించడం/వివాదం’ అనే భావంతో సంబంధం కలిగి ఉంది (నిర్గమకాండము 17:1–7; సంఖ్యాకాండము 20:1–13 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: లేవి గురించి
  rationale: ఆశీర్వాదాల వరుసలో ל ఉపసర్గ ఇక్కడ లేవి గోత్రాన్ని ప్రసంగ విషయంగా పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘లేవి గురించి’ సహజంగా ఉంటుంది.
- source_word: אָמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: సరళమైన ప్రసంగ పరిచయం; ‘ఇలా’ ప్రత్యక్ష వాక్యానికి తెలుగులో సహజమైన అనుసంధానం.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: నీ తుమ్మీము, నీ ఊరీము
  rationale: ఇవి యాజక సంబంధమైన సాంకేతిక పదాలు; వాటి ఖచ్చిత స్వరూపం అనిశ్చితమైనందున అర్థానువాదం చేయకుండా పేర్లుగా లిప్యంతరీకరించాం. ఏకవచన ద్వితీయ పురుష ప్రత్యయాన్ని ‘నీ’గా నిలిపాం.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: నీ విశ్వాసపాత్రునికి చెందుతాయి
  rationale: క్రియలేని హెబ్రీ వాక్యాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘చెందుతాయి’ చేర్చాం. חָסִיד్ నిబంధన సంబంధమైన నిబద్ధత/విశ్వాసపాత్రతను సూచించగలదు; ‘విశ్వాసపాత్రుడు’ సహజంగా ఉండి నిర్దిష్ట వ్యక్తిని గుర్తించదు.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: నీవు అతణ్ణి పరీక్షించావు
  rationale: נסה పియేల్ రూపానికి ‘పరీక్షించు’ ప్రధానమైన, సందర్భోచితమైన అర్థం.
- source_word: בְּמַסָּה
  choice: మస్సాలో
  rationale: హెబ్రీలో ఇది ‘పరీక్ష’ అనే భావంతో సంబంధమున్న స్థలనామం; ప్రధాన పాఠ్యంలో స్థలనామంగానే ఉంచాం.
- source_word: תְּרִיבֵהוּ
  choice: అతనితో వాదించావు
  rationale: ריב వివాదపడడం లేదా పోరాడడం అనే భావాన్ని ఇస్తుంది; ‘వాదించావు’ ప్రత్యక్ష దైవ-మానవ ఘర్షణను అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: עַל מֵי מְרִיבָה
  choice: మెరీబా జలాల దగ్గర
  rationale: עַל ఇక్కడ సంఘటన జరిగిన ప్రదేశాన్ని సూచిస్తుంది. ‘జలాల దగ్గర’ స్థలార్థాన్ని సహజ తెలుగులో నిలుపుతుంది; మెరీబాను పేరుగా ఉంచాం.
theological_decisions:
- issue: ‘నీ విశ్వాసపాత్రుడు’ ఎవరిని సూచిస్తున్నాడు?
  choice: లేవితో సంబంధమున్న విశ్వాసపాత్ర ప్రతినిధిని సూచించే ఏకవచన పదబంధంగానే ఉంచడం
  alternative: ప్రత్యేకంగా అహరోను, పూర్వికుడైన లేవి, లేదా సమష్టిగా లేవి గోత్రం అని గుర్తించడం
  rationale: హెబ్రీ ఏకవచనం పలు సూచ్యార్థాలను అనుమతిస్తుంది. అహరోను, లేవి లేదా గోత్రం అని నిర్ధారించడం పాఠ్యంలోని నిజమైన సందిగ్ధతను తొలగిస్తుంది; అందువల్ల అనువాదం ఎవరినీ ప్రత్యేకంగా గుర్తించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా పంక్తులుగా రూపొందించాం. ఊరీము, తుమ్మీము వంటి సాంకేతిక యాజక పదాలను లిప్యంతరీకరించాం. సూచ్యవ్యక్తి విషయంలోని హెబ్రీ సందిగ్ధతను అలాగే నిలిపాం; అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
