  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/כָל הָ֨/אֹת֜וֹת וְ/הַ/מּוֹפְתִ֗ים אֲשֶׁ֤ר שְׁלָח/וֹ֙ יְהוָ֔ה לַ/עֲשׂ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: te
  text: యాహ్వే అతన్ని ఐగుప్తు దేశంలో ఫరోకు, అతని సేవకులందరికీ, అతని దేశమంతటికీ[a] చేయడానికి పంపిన సమస్త సూచకాల, అద్భుతాల విషయంలోనూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని దేశమంతటికీ వ్యతిరేకంగా”; లేదా, “అతని దేశమంతటా.” ఇక్కడి హీబ్రూ ఉపసర్గను భిన్న సంబంధార్థాల్లో గ్రహించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: సూచక క్రియలన్నిటి విషయంలోనూ, అద్భుత కార్యాలన్నిటి విషయంలోనూ
  rationale: לְכָל మునుపటి వచనంతో వాక్యనిర్మాణ సంబంధాన్ని కొనసాగిస్తూ మోషే సాటిలేనివాడిగా నిలిచిన రంగాన్ని సూచిస్తుంది. אוֹת–מוֹפֵת జంటను సహజమైన ఆధునిక తెలుగులో, వాటి సంకేతాత్మకత మరియు ఆశ్చర్యకర స్వభావం రెండూ నిలిచేలా అనువదించాం.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: యెహోవా అతన్ని ... చేయడానికి పంపిన
  rationale: שׁלח లోని పురుష ఏకవచన కర్మప్రత్యయం మోషేను సూచిస్తుంది; לַעֲשׂוֹת ఆ పంపబడటంలోని ఉద్దేశాన్ని తెలియజేస్తుంది. మూలంలోని ఉపవాక్య నిర్మాణాన్ని నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యం పొందిన ప్రత్యక్ష లిప్యంతరీకరణతో అందించాం.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: אֶרֶץ అనే పదాన్ని విడిచిపెట్టకుండా మూలపాఠంలోని పూర్తి రూపాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: ఫరోకు, అతని సేవకులందరికీ
  rationale: לְ అనే ఉపసర్గ యొక్క దిశాత్మక/సంబంధార్థాన్ని 'కు/కీ'తో దగ్గరగా నిలిపాం. עֲבָדָיו ను విస్తృతార్థం గల 'సేవకులు'గా అనువదించాం; అది రాజోద్యోగులను కూడా సందర్భానుసారంగా కలుపుకోగలదు.
- source_word: וּלְכָל אַרְצוֹ
  choice: అతని దేశమంతటికీ
  rationale: హీబ్రూ לְ యొక్క సంబంధార్థాన్ని ప్రధాన పాఠంలో దగ్గరగా నిలిపాం. సందర్భంలో అది దేశానికి వ్యతిరేకంగా లేదా దేశమంతటా జరిగిన ప్రభావాన్ని సూచించవచ్చు కాబట్టి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని 'ప్రభువు' వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన 'యెహోవా' రూపాన్ని ఎంచుకున్నాం; 'యాహ్వే' మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: ఫరోకు మరియు దేశానికి సూచక క్రియల సంబంధం
  choice: ఫరోకు ... అతని దేశమంతటికీ
  alternative: ఫరోకు వ్యతిరేకంగా ... అతని దేశమంతటా
  rationale: לְ ఉపసర్గ ఇక్కడ దిశ, సంబంధం, ప్రతికూల ప్రభావం, లేదా వ్యాప్తి అనే భావాలలో అర్థమవవచ్చు. ప్రధాన పాఠం మూలరూపానికి దగ్గరగా ఉండగా, పాదటిప్పణి నిజమైన భావసందిగ్ధతను వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ఇది 34:10 నుంచి కొనసాగే వాక్యభాగం కాబట్టి చివర కామాను ఉంచాం; 'విషయంలోనూ' అనే రూపం ముందటి వచనంతో దాని ఆధార సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
