revisions:
- from: యెహోవా అతన్ని ఐగుప్తు దేశంలో ఫరోకు, అతని సేవకులందరికీ, అతని దేశమంతటికీ[a] చేయడానికి పంపిన సూచక క్రియలన్నిటి విషయంలోనూ, అద్భుత కార్యాలన్నిటి విషయంలోనూ,
  to: యాహ్వే అతన్ని ఐగుప్తు దేశంలో ఫరోకు, అతని సేవకులందరికీ, అతని దేశమంతటికీ[a] చేయడానికి పంపిన సమస్త సూచకాల, అద్భుతాల విషయంలోనూ,
  rationale: The revision aligns the divine-name rendering with the POB audit trail, streamlines the signs-and-wonders pair into idiomatic modern Telugu, retains the source syntax and the verse's trailing dependent punctuation, and preserves the documented ambiguity of the final prepositional phrase in the anchored footnote.
