review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Moses’ age at death, the undimmed eye/eyesight idiom, and the statement that his bodily vigor had not diminished. The main wording for the final idiom appropriately expresses the sense rather than forcing the Hebrew metaphor.
  naturalness: The opening is understandable, but a finite verb makes the Telugu sentence more complete and natural in modern standard prose. Using the respectful third-person form is also appropriate for this biblical narrative register.
  terminology: ‘కన్ను మసకబారలేదు’ retains the Hebrew singular idiom well. ‘జీవశక్తి తగ్గిపోలేదు’ is clear, though ‘దేహసత్తువ తగ్గిపోలేదు’ more specifically signals the bodily vigor denoted by לֵחֹה and avoids a possible broader sense of life-force.
  issues:
  - severity: low
    issue: The opening age statement lacks an explicit copula.
    rationale: ‘మోషే చనిపోయినప్పుడు అతనికి నూట ఇరవై ఏళ్లు’ is intelligible, but ‘...నూట ఇరవై ఏళ్లు ఉండేవి’ is syntactically complete and smoother in formal modern Telugu.
  - severity: low
    issue: ‘జీవశక్తి’ can be understood more broadly than physical vigor.
    rationale: The Hebrew idiom concerns continuing bodily freshness/strength. ‘దేహసత్తువ’ keeps that physical scope clear while remaining natural.
  revised_text: మోషే చనిపోయినప్పుడు ఆయనకు నూట ఇరవై ఏళ్లు ఉండేవి. ఆయన కన్ను మసకబారలేదు[a]; ఆయన దేహసత్తువ తగ్గిపోలేదు[b].
