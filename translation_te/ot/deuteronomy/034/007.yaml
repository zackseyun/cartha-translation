revisions:
- from: మోషే చనిపోయినప్పుడు అతనికి నూట ఇరవై ఏళ్లు. అతని కన్ను మసకబారలేదు[a]; అతని జీవశక్తి తగ్గిపోలేదు[b].
  to: మోషే చనిపోయినప్పుడు ఆయనకు నూట ఇరవై ఏళ్లు ఉండేవి. ఆయన కన్ను మసకబారలేదు[a]; ఆయన దేహసత్తువ తగ్గిపోలేదు[b].
  rationale: The revision supplies a natural Telugu copula in the age clause, uses consistent respectful reference to Moses, and specifies bodily vigor in the final clause. It preserves the Hebrew singular ‘eye,’ the temporal sense of ‘at/when he died,’ and the non-literal sense of the Hebrew vigor idiom. Footnote anchors remain attached to the corresponding lexical expressions.
