source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: te
  text: మోషే చనిపోయినప్పుడు ఆయనకు నూట ఇరవై ఏళ్లు ఉండేవి. ఆయన కన్ను మసకబారలేదు[a]; ఆయన దేహసత్తువ తగ్గిపోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన చూపు మందగించలేదు.’ హెబ్రీలో అక్షరార్థంగా, ‘ఆయన కన్ను మసకబారలేదు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన జీవశక్తి తగ్గిపోలేదు,’ లేదా ‘ఆయన సహజ బలం క్షీణించలేదు.’ హెబ్రీ నుడికారం శరీర తాజాదనం లేదా పటుత్వం నిలిచి ఉండడాన్ని సూచిస్తుంది; క్రియను అక్షరార్థంగా తీసుకుంటే, ‘పారిపోలేదు’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: మోషే
  rationale: వావ్ కథన కొనసాగింపును సూచిస్తుంది; ఈ ఒక్క వచనంలో తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం కృత్రిమంగా ఉంటుంది. సందర్భమే కొనసాగింపును తెలియజేస్తుంది.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: అతనికి నూట ఇరవై ఏళ్లు
  rationale: ‘నూట ఇరవై సంవత్సరాల కుమారుడు’ అనే హెబ్రీ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּמֹתוֹ
  choice: చనిపోయినప్పుడు
  rationale: మరణాన్ని సూచించే నామవాచకంతో ఉన్న ఉపసర్గ ఇక్కడ కాలార్థకమైనది; ఈ రూపం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: అతని కన్ను మసకబారలేదు
  rationale: כָהָה చూపు మందగించడం లేదా మసకబారడాన్ని సూచిస్తుంది. మూలంలోని ఏకవచన ‘కన్ను’ను నిలుపుతూ, తెలుగులో చూపును సూచించే సహజ నుడికారాన్ని వాడింది.
- source_word: וְלֹא נָס לֵחֹה
  choice: అతని జీవశక్తి తగ్గిపోలేదు
  rationale: అరుదైన לֵחַ శరీర తాజాదనం, సత్తువ లేదా జీవశక్తిని సూచిస్తుంది; נוּס‌తో కలిసిన రూపకం శారీరక పటుత్వం తగ్గకపోవడాన్ని తెలియజేస్తుంది. ప్రధాన పాఠ్యంలో అర్థస్పష్టత కోసం సహజమైన తెలుగు రూపాన్ని ఎంచుకుంది.
