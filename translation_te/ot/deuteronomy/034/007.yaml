translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘కన్ను’ అనే ఏకవచన నుడికారం ప్రధాన పాఠ్యంలో నిలుపబడింది; అరుదైన శారీరక తాజాదనం/సత్తువ భావాన్ని ‘జీవశక్తి’గా స్పష్టంగా అందించి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
