id: DEU.34.9
reference: Deuteronomy 34:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: te
  text: నూను కుమారుడైన యెహోషువ జ్ఞానపు ఆత్మతో నిండి ఉన్నాడు[a], ఎందుకంటే మోషే అతనిమీద తన చేతులు ఉంచాడు. ఇశ్రాయేలు కుమారులు[b] అతని మాట విని, యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జ్ఞానపు ఆత్మచేత నింపబడ్డాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం సాధారణంగా జ్ఞానస్వభావాన్ని గానీ, ప్రత్యేకంగా దేవుడు అనుగ్రహించిన సామర్థ్యాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: '‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’ అని కూడా అనువదించవచ్చు. అక్షరార్థం: ‘ఇశ్రాయేలు కుమారులు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: జ్ఞానపు ఆత్మతో నిండివున్నాడు
  rationale: హీబ్రూ విశేషణ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, అది వ్యక్తిగత జ్ఞానస్వభావమా లేక దేవుని అనుగ్రహించిన ఆత్మీయ శక్తినా అనే సందిగ్ధతను నిలుపుతుంది.
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: ఈ సందర్భంలో ఈ పదం జ్ఞానాన్ని ప్రసాదించే లేదా ప్రేరేపించే ఆత్మను సూచిస్తుంది. తెలుగు లిపిలో పెద్ద/చిన్న అక్షరాల భేదం లేనందున, ఇది పరిశుద్ధాత్మకు స్పష్టమైన ప్రత్యక్ష సూచన అని మూలపాఠం కంటే ఎక్కువగా నిర్ధారించకుండా పాదటిప్పణిలో సందిగ్ధతను వివరించాం.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: తన చేతులను అతని మీద ఉంచాడు
  rationale: చేతులుంచే అధికారిక చర్యను స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగం; హీబ్రూలోని బహువచనమైన ‘చేతులు’ను కూడా నిలుపుతుంది.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: అతని మాట విని
  rationale: ఇక్కడ ‘వినడం’ విధేయతను కూడా సూచిస్తుంది; తరువాతి ‘చేశారు’ అనే క్రియ ఆ విధేయతను స్పష్టపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని పురుష బహువచన కుటుంబ-ఒడంబడిక భాషను నిలుపుతుంది; ఈ పదబంధం సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే చేశారు
  rationale: ప్రజల చర్యలు యాహ్వే మోషేకు ఇచ్చిన ఆజ్ఞకు అనుగుణంగా ఉన్నాయని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామంలోని నాలుగు హీబ్రూ వ్యంజనాలకు సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: ‘జ్ఞానపు ఆత్మ’ పరిశుద్ధాత్మకు ప్రత్యక్ష సూచనా?
  choice: ‘జ్ఞానపు ఆత్మ’ అని అనువదించి గుర్తింపును నిర్దిష్టంగా తేల్చకుండా ఉంచడం
  alternative: ‘జ్ఞానమిచ్చే పరిశుద్ధాత్మ’ లేదా ‘జ్ఞానపు దేవుని ఆత్మ’
  rationale: యెహోషువకు దేవుని నుండి సామర్థ్యం లభించిన భావం సందర్భంలో ఉన్నప్పటికీ, רוּחַ అనే పదం మాత్రమే దీనిని పరిశుద్ధాత్మకు స్పష్టమైన సాంకేతిక నామంగా తప్పనిసరిగా నిర్ధారించదు.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక కుటుంబ భాష
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని పురుష బహువచన కుటుంబపదాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచించే సాధారణ హీబ్రూ ప్రయోగమని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. ‘యెహోషువ,’ ‘మోషే,’ ‘యాహ్వే’ అనే రూపాలను స్థిరంగా వాడాం. మూలంలోని కారణసంబంధాన్ని ‘ఎందుకంటే’తో, వినడం నుంచి విధేయతకు సాగే భావాన్ని ‘అతని మాట విని ... చేశారు’తో నిలిపాం.
