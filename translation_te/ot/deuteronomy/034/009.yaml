- from: నూను కుమారుడైన యెహోషువ జ్ఞానపు ఆత్మతో నిండివున్నాడు[a]. ఎందుకంటే మోషే తన చేతులను అతని మీద ఉంచాడు. ఇశ్రాయేలు కుమారులు[b] అతని మాట విని, యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే చేశారు.
  to: నూను కుమారుడైన యెహోషువ జ్ఞానపు ఆత్మతో నిండి ఉన్నాడు[a], ఎందుకంటే మోషే అతనిమీద తన చేతులు ఉంచాడు. ఇశ్రాయేలు కుమారులు[b] అతని మాట విని, యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే చేశారు.
