id: DEU.34.5
reference: Deuteronomy 34:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: te
  text: అప్పుడు యాహ్వే సేవకుడైన మోషే అక్కడ మోయాబు దేశంలో యాహ్వే మాట ప్రకారం చనిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే నోటి ప్రకారం’; ఈ నుడికారాన్ని ‘యాహ్వే ఆజ్ఞ ప్రకారం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: అప్పుడు … చనిపోయాడు
  rationale: Wayyiqtol రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘చనిపోయాడు’ מות యొక్క మూల అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ముందు వర్ణించిన ప్రదేశాన్ని తిరిగి సూచించే స్థలావ్యయం; దాని సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: ఈ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: עֶבֶד יְהוָה
  choice: యాహ్వే సేవకుడైన
  rationale: עֶבֶדకు దాసుడు/సేవకుడు అనే అర్థాలు ఉండగలిగినా, ఇక్కడ ఇది మోషేకు గౌరవప్రదమైన ఒడంబడిక సంబంధిత బిరుదు. ‘సేవకుడు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యనుకరణను తెలుగులో అందిస్తుంది.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: మోయాబు దేశంలో
  rationale: మూలంలోని ‘మోయాబు దేశంలో’ అనే భౌగోళిక నిర్మాణాన్ని, ‘దేశం’ అనే పదంతో సహా, నిలుపుతుంది.
- source_word: עַל פִּי יְהוָה
  choice: యాహ్వే మాట ప్రకారం
  rationale: అక్షరార్థంగా ‘యాహ్వే నోటి ప్రకారం’ అయిన ఈ హీబ్రూ నుడికారం ఆయన మాట లేదా ఆజ్ఞకు అనుగుణంగా అనే భావాన్ని ఇస్తుంది. ప్రధాన పాఠం సహజంగా ఉండగా, అక్షరార్థ రూపం మరియు ‘ఆజ్ఞ ప్రకారం’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడ్డాయి.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా తెలుగులో ధ్వన్యనుకరిస్తుంది.
- issue: మోషే బిరుదులో עֶבֶד యొక్క భావఛాయ
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ సందర్భంలో పదం బానిస స్థితిని ప్రధానంగా చూపడం కంటే, యాహ్వేతో మోషేకు ఉన్న నియామకపూర్వక సంబంధాన్ని మరియు గౌరవాన్ని తెలిపే బిరుదుగా పనిచేస్తుంది.
- issue: עַל פִּי יְהוָה యొక్క భావం
  choice: యాహ్వే మాట ప్రకారం
  alternative: యాహ్వే ఆజ్ఞ ప్రకారం
  rationale: ‘మాట ప్రకారం’ మూలంలోని ‘నోరు’ అనే రూపకానికి దగ్గరగా ఉంటూనే నుడికారపు అర్థాన్ని సహజంగా అందిస్తుంది. ఇది కేవలం ఆజ్ఞను మాత్రమే సూచిస్తుందా అనే అంశాన్ని బలవంతంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘అక్కడ’ మరియు ‘మోయాబు దేశంలో’ అనే రెండు స్థల సూచనలనూ నిలుపుతూ సహజమైన తెలుగు వాక్యక్రమం ఎంచుకోబడింది.
