id: DEU.34.6
reference: Deuteronomy 34:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: te
  text: అతడు అతణ్ణి మోయాబు దేశంలోని లోయలో, బేత్-పెయోరుకు ఎదురుగా పాతిపెట్టాడు[a]; నేటి వరకూ అతని సమాధి స్థలం ఎవరికీ తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాతిపెట్టాడు’ అనే క్రియకు కర్త ఈ వచనంలో పేరుతో చెప్పబడలేదు; ముందున్న సందర్భం యెహోవాను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: ఆయన అతణ్ణి పాతిపెట్టాడు
  rationale: క్రియ ఖాల్ 3వ పురుష ఏకవచన పుంలింగంలో, కర్తను పేరుతో చెప్పకుండా క్రియాశీల రూపంలో ఉంది. తెలుగు వాక్యానికి సహజంగా ఉండేలా ‘ఆయన’ వాడినా, అది ఎవరన్నది ప్రధాన పాఠంలో స్పష్టంగా నిర్ధారించలేదు.
- source_word: בַגַּיְ
  choice: లోయలో
  rationale: గַּיְ లోయ లేదా కనుమను సూచించగలదు; ఈ సందర్భంలో ‘లోయ’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: మోయాబు దేశంలోని
  rationale: హీబ్రూలోని ‘మోయాబు దేశంలో’ అనే భౌగోళిక వ్యక్తీకరణను సహజమైన తెలుగు సంబంధ నిర్మాణంలో నిలిపింది.
- source_word: מוּל
  choice: ఎదురుగా
  rationale: ఒక ప్రదేశానికి అభిముఖంగా లేదా దానికి ఎదురుగా ఉన్న స్థానాన్ని సూచించే మూలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית פְּעוֹר
  choice: బేత్-పెయోరు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: וְלֹא יָדַע אִישׁ
  choice: ఎవరికీ తెలియదు
  rationale: אִישׁ ఇక్కడ సాధారణ మానవ సూచనతో వాడబడింది. ‘ఏ మనిషికీ తెలియదు’ కంటే ఆధునిక తెలుగులో ‘ఎవరికీ తెలియదు’ సహజంగా ఉండి, అదే సమగ్ర భావాన్ని ఇస్తుంది.
- source_word: קְבֻרָתוֹ
  choice: అతని సమాధి స్థలం
  rationale: ఇక్కడ ఉద్దేశం పాతిపెట్టిన కార్యం కంటే మోషేను పాతిపెట్టిన ప్రదేశం; ‘సమాధి స్థలం’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకూ
  rationale: కథకుని కాలం వరకూ కొనసాగుతున్న తెలియకపోవడాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: ‘పాతిపెట్టాడు’ అనే క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో ‘ఆయన’ అని ఉంచి, పేరును చేర్చకుండా అస్పష్టతను నిలిపివేయడం.
  alternative: మునుపటి వచనం ఆధారంగా ‘యెహోవా అతణ్ణి పాతిపెట్టాడు’ అని స్పష్టంగా చెప్పడం; లేదా ‘అతడు పాతిపెట్టబడ్డాడు’ అని కర్మణి రూపంలో అనువదించడం.
  rationale: మునుపటి సందర్భం కర్త యెహోవా అని బలంగా సూచించినా, ఈ వచనంలోని హీబ్రూ క్రియ కర్త పేరును స్వయంగా చెప్పదు. అందువల్ల ప్రధాన పాఠం కర్తను పేరుతో నిర్ధారించకుండా, వివరణను పాదసూచికలో ఇచ్చింది.
- issue: సాధారణ పుంలింగ పదమైన אִישׁ అనువాదం
  choice: ‘ఎవరికీ తెలియదు’ అనే సహజమైన సమగ్ర తెలుగు రూపం.
  alternative: ‘ఏ మనిషికీ తెలియదు’ అని రూపపరంగా మరింత దగ్గరగా అనువదించడం.
  rationale: ఈ సందర్భంలో אִישׁ ఒక ప్రత్యేక పురుషుణ్ణి కాకుండా ఎవరినైనా సూచిస్తుంది. ‘ఎవరికీ’ ఆధునిక ప్రామాణిక తెలుగులో మూలంలోని సాధారణ భావాన్ని కచ్చితంగా, సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ క్రియాశీల నిర్మాణాన్ని, కర్తకు సంబంధించిన నిజమైన అస్పష్టతను నిలిపి, అసహజమైన పదక్షర అనువాదాన్ని నివారించింది.
