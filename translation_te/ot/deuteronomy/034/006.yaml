  naturalness: The Telugu is clear and modern. Moving the footnote marker directly to the burial verb makes its scope unambiguous, and a semicolon cleanly joins the two Hebrew clauses.
  terminology: ‘మోయాబు,’ ‘బేత్-పెయోరు,’ ‘లోయ,’ and ‘సమాధి స్థలం’ are appropriate modern-standard Telugu renderings. ‘ఎవరికీ తెలియదు’ naturally conveys the generic force of אִישׁ without introducing a gender-specific restriction.
  issues:
  - severity: low
    issue: The main text uses the honorific pronoun ‘ఆయన’ for the unnamed subject.
    rationale: Although the preceding context strongly suggests the LORD, the Hebrew verse itself does not name its subject. ‘ఆయన’ conventionally carries honorific specificity in Telugu, whereas ‘అతడు’ preserves the grammatical ambiguity more closely.
  - severity: low
