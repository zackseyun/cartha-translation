  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: te
  text: మోషే ఇశ్రాయేలీయులందరి కళ్ల ఎదుట ప్రదర్శించిన ప్రబలమైన శక్తికీ[a][b], గొప్ప భయోత్పాదక కార్యాలన్నిటికీ[c][d] అతనితో సమానమైన ప్రవక్త మరొకడు లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘బలమైన చెయ్యి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మహా శక్తి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గొప్ప భీతి’; హీబ్రూ పదం భయం, భీతి లేదా విస్మయం కలిగించేదాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలీయులందరి కళ్ల ఎదుట’; అంటే, జాతి అంతా చూస్తుండగా బహిరంగంగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: అన్నిటిలోనూ
  rationale: ఈ వాక్యం మునుపటి వచనంలోని ‘సమానమైన ప్రవక్త మరొకడు లేడు’ అనే వాక్యాన్ని కొనసాగిస్తుంది. לְ ఉపసర్గను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘లోనూ’తో తెలిపి, כֹל యొక్క సమగ్ర భావాన్ని ‘అన్ని’తో నిలిపాం.
- source_word: הַיָּד הַחֲזָקָה
  choice: బలమైన హస్తకార్యాలు
  rationale: అక్షరార్థమైన ‘బలమైన చెయ్యి’ అనే రూపకంలో శక్తి లేదా పరాక్రమ కార్యాలు సూచించబడతాయి. ‘హస్తకార్యాలు’ ఆ రూపకాన్ని కొంత నిలుపుతూ, మోషే చేసిన కార్యాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: భయభక్తులు పుట్టించిన గొప్ప కార్యాలు
  rationale: מוֹרָא భయం, భీతి, విస్మయం కలిగించే ప్రదర్శన అనే అర్థాలను కలిగి ఉంది. తెలుగు ‘భయభక్తులు పుట్టించిన’ అనే మాట భయానకతకే పరిమితం కాకుండా విస్మయభరితమైన భయాన్ని కూడా నిలుపుతుంది; ‘కార్యాలు’ సందర్భంలో అంతర్లీనంగా ఉన్న భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: మోషే ... చేసిన
  rationale: עָשָׂה యొక్క సాధారణ అర్థమైన ‘చేశాడు’ను నేరుగా నిలిపాం. రెండు నామబంధాలను ‘కార్యాలు’గా ఇచ్చినందున తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לְעֵינֵי
  choice: కళ్ల ఎదుట
  rationale: ‘కళ్ల ఎదుట’ అనే concrete Hebrew imageryను నిలుపుతూ, కార్యాలు బహిరంగంగా, ప్రత్యక్షంగా జరిగాయని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి
  rationale: సమస్త ఇశ్రాయేలు సమాజాన్ని సూచించే సమూహార్థాన్ని సహజ తెలుగు సంబంధవిభక్తితో అందిస్తుంది.
theological_decisions:
- issue: మోషే కార్యాల స్వభావం
  choice: మోషే బహిరంగంగా చేసిన శక్తిమంతమైన, భయభక్తులు పుట్టించే కార్యాలుగా అనువదించడం
  alternative: ‘బలమైన చెయ్యి’ మరియు ‘గొప్ప భీతి’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: హీబ్రూ వచనం మోషే చేసిన అసాధారణ కార్యాల గొప్పతనాన్ని సంక్షిప్తంగా చెబుతుంది. అనువాదం వాటికి తరువాతి సిద్ధాంత వివరణలను జోడించకుండా, మూలంలోని రూపకం, భయం, విస్మయం మధ్యనున్న ఉద్వేగాన్ని కాపాడుతుంది.
- issue: మునుపటి వచనంతో వాక్య సంబంధం
  choice: 34:10లోని ‘సమానమైన ప్రవక్త మరొకడు లేడు’ అనే ప్రధాన వాక్యాన్ని ఇక్కడ పునరుద్ధరించి పూర్తి వాక్యంగా అందించడం
  alternative: ‘మరియు ... అన్నిటికిగాను’ అనే అసంపూర్ణ కొనసాగింపుగా మాత్రమే ఉంచడం
  rationale: హీబ్రూలో 34:12 మునుపటి వాక్యానికి సమన్వయ కొనసాగింపు. విడిగా చదివే వచనంగా తెలుగులో అర్థవంతంగా ఉండేందుకు ప్రధాన వాక్యాన్ని సందర్భం నుంచి పునరుద్ధరించాం; కొత్త సిద్ధాంతార్థం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. విడిగా ఇచ్చిన వచనం వ్యాకరణపూర్ణంగా ఉండేందుకు 34:10లోని ప్రధాన వాక్యాన్ని పునరుద్ధరించాం. ‘హస్తకార్యాలు’ మూల రూపకాన్ని కొంత కాపాడుతుంది; పాదసూచికలు అక్షరార్థం మరియు ఇతర సాధ్యార్థాలను నమోదు చేస్తాయి.
