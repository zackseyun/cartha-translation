  text: וְ/אֵת֙ כָּל נַפְתָּלִ֔י וְ/אֶת אֶ֥רֶץ אֶפְרַ֖יִם וּ/מְנַשֶּׁ֑ה וְ/אֵת֙ כָּל אֶ֣רֶץ יְהוּדָ֔ה עַ֖ד הַ/יָּ֥ם הָ/אַחֲרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: te
  text: నఫ్తాలి ప్రాంతమంతటినీ, ఎఫ్రాయిము, మనష్షేల దేశాన్నీ, పడమటి సముద్రం[a] వరకు విస్తరించిన యూదా దేశమంతటినీ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘చివరి సముద్రం’ లేదా ‘వెనుకటి సముద్రం.’ ఇది పడమట ఉన్న సముద్రాన్ని, అంటే మధ్యధరా సముద్రాన్ని సూచించే హెబ్రీ వాడుక.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: నఫ్తాలి ప్రాంతమంతటినీ
  rationale: గోత్రనామంతో వచ్చిన כָּל ఇక్కడ ఆ గోత్రానికి చెందిన భూభాగమంతటినీ సూచిస్తుంది. తెలుగులో కేవలం ‘నఫ్తాలి అంతటినీ’ అనడం ప్రజలను సూచించినట్టుగా వినిపించవచ్చు కాబట్టి, భౌగోళిక సందర్భాన్ని సహజంగా స్పష్టం చేయడానికి ‘ప్రాంతమంతటినీ’ ఎంచుకున్నాం.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: ఎఫ్రాయిము, మనష్షేల దేశాన్నీ
  rationale: אֶרֶץ యొక్క భూమి/దేశం అనే భావాన్ని ‘దేశం’తో నిలిపి, సమన్వయంగా ఉన్న రెండు గోత్రనామాలను తెలుగు సంబంధబహువచన రూపంతో సహజంగా కలిపాం.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: యూదా దేశమంతటినీ
  rationale: మూలంలోని אֶרֶץ ను ‘దేశం’గా స్పష్టంగా ప్రతిబింబిస్తూ, כָּל తెలిపే సంపూర్ణ విస్తృతిని ‘అంతటినీ’తో అందించాం.
- source_word: עַד
  choice: వరకు ఉన్న
  rationale: దృశ్యమయ్యే భూభాగపు విస్తృతి ఎక్కడివరకు సాగుతుందో తెలిపే עַד భావాన్ని తెలుగులో సహజమైన సరిహద్దు వ్యక్తీకరణగా అందిస్తుంది.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: పడమటి సముద్రం
  rationale: అక్షరార్థంగా ‘వెనుకటి/చివరి సముద్రం’ అనే హెబ్రీ దిశాసూచక నుడికారం పడమట ఉన్న సముద్రాన్ని సూచిస్తుంది. ‘పడమటి సముద్రం’ అర్థాన్ని స్పష్టంగా తెలియజేస్తూ, ప్రధాన పాఠ్యంలో ‘మధ్యధరా సముద్రం’ అనే వివరణాత్మక గుర్తింపును చేర్చదు.
