  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: te
  text: నెగెబును[a], యెరికో లోయలోని మైదానాన్ని—ఖర్జూర చెట్ల నగరమైన యెరికోను—సోయరు వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దక్షిణ ప్రాంతాన్ని.’ హీబ్రూ పదం ఒక ప్రాంతపు పేరుగానూ, దక్షిణ దిశలోని ప్రాంతాన్ని సూచించే పదంగానూ వాడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: నెగెబు
  rationale: ఇక్కడ ఇది మోషేకు చూపించబడిన ప్రాంతాల జాబితాలో ఒక భౌగోళిక స్థలనామంగా పనిచేస్తుంది; అందువల్ల సాధారణ దిశార్థమైన ‘దక్షిణం’ కంటే లిప్యంతరీకరణ అనుకూలం.
- source_word: הַכִּכָּר
  choice: మైదానం
  rationale: ఈ పదం భౌగోళిక వాడుకలో యొర్దాను లోయలోని విశాల మైదాన ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మైదానం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: యెరికో లోయ
  rationale: בִּקְעָה విశాలమైన లోయ లేదా మైదానాన్ని సూచించగలదు. ముందున్న הַכִּכָּרను ‘మైదానం’గా అనువదించినందున ఇక్కడ ‘లోయ’ అని ఇవ్వడం భూస్వరూప భావాన్ని నిలుపుతూ పదపునరుక్తిని నివారిస్తుంది.
- source_word: עִיר הַתְּמָרִים
  choice: ఖర్జూర చెట్ల నగరమైన
  rationale: ఇది యెరికోకు సంబంధించిన వివరణాత్మక బిరుదు. ‘ఖర్జూర చెట్ల నగరం’ మూలంలోని చిత్రణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַד צֹעַר
  choice: సోయరు వరకు
  rationale: עַד విస్తృతి లేదా హద్దును సూచిస్తుంది; ‘వరకు’ ఆ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וְאֶת ... וְאֶת
  choice: ను ... ని
  rationale: తెలుగులో కర్మ విభక్తి మరియు జాబితా నిర్మాణం ద్వారా వరుసగా చూపించబడిన ప్రాంతాల అనుసంధానం సహజంగా వ్యక్తమవుతుంది; ప్రతి చోట ‘మరియు’ పునరావృతం చేయడం అవసరం లేదు.
