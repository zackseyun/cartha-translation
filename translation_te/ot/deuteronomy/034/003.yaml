translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వచనం ముందటి వాక్యంపై ఆధారపడిన జాబితా భాగమైనప్పటికీ, తెలుగు ప్రచురణలో స్వతంత్ర వచనంగా చదవడానికి ‘ఆయనకు చూపించాడు’ అనే పూర్వసందర్భ క్రియను చేర్చాం. ‘మైదానం, ... యెరికో లోయ’ అనే సమానాధికార నిర్మాణాన్ని కామాలతో నిలిపాం.
