source:
  edition: WLC
  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: te
  text: యెహోవా ముఖాముఖిగా ఎరిగిన మోషే వంటి ప్రవక్త ఇశ్రాయేలులో మళ్లీ[a] లేవలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంకా’; ఇక్కడి హీబ్రూ పదం మోషే తరువాత అతనివంటి ప్రవక్త ఇశ్రాయేలులో లేవలేదనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: లేవలేదు
  rationale: హీబ్రూ సంధానపదం ముందున్న ముగింపు వర్ణనను కొనసాగిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా ప్రతికూల క్రియతో వాక్యాన్ని నిర్మించడం సహజంగా ఉంది.
- source_word: קָם
  choice: లేవలేదు
  rationale: ప్రవక్త ప్రత్యక్షమవడం లేదా ఉద్భవించడాన్ని సూచించే קום క్రియకు ‘లేవడం’ అనే రూపం హీబ్రూ రూపకాన్ని నిలుపుతూ తెలుగులో సహజమైన బైబిలు ప్రయోగంగా ఉంటుంది.
- source_word: נָבִיא
  choice: ప్రవక్త
  rationale: נָבִיאకు ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, స్పష్టమైన సమానార్థకం.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: మోషే తరువాత అతనివంటి మరో ప్రవక్త లేవలేదనే కాలసంబంధ భావాన్ని ‘మళ్లీ’ సహజంగా తెలియజేస్తుంది; ‘ఇంకా’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: పోల్చదగిన ప్రవక్త లేవని చెప్పబడుతున్న పరిధిని ב సూచిస్తుంది; ‘ఇశ్రాయేలులో’ దాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: כְּמֹשֶׁה
  choice: మోషే వంటి
  rationale: כְּ సూచించే సరళమైన పోలికను సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר יְדָעוֹ יְהוָה
  choice: యెహోవా ... ఎరిగిన
  rationale: సంబంధవాక్యాన్ని తెలుగులో మోషేను విశేషించే రూపంగా అమర్చాం. ידע ఇక్కడ వ్యక్తిగతమైన, ప్రత్యక్ష సంబంధజ్ఞానాన్ని సూచిస్తుంది; ‘ఎరిగిన’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: פָּנִים אֶל פָּנִים
  choice: ముఖాముఖిగా
  rationale: ప్రత్యక్షమైన వ్యక్తిగత సన్నిహితత్వాన్ని తెలిపే హీబ్రూ దృశ్యరూపాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
theological_decisions:
- issue: యెహోవాకు మోషేతో ఉన్న సంబంధాన్ని తెలిపే మానవరూపక భాష
  choice: ‘ముఖాముఖిగా’ అనే నుడికారాన్ని యథాతథ భావంతో నిలుపడం
  alternative: ‘ప్రత్యక్షంగా’ లేదా ‘వ్యక్తిగతంగా’ అని భావాన్ని విప్పి చెప్పడం
  rationale: హీబ్రూ పాఠం స్పష్టమైన దృశ్యరూపంతో మోషేకు లభించిన అసాధారణ ప్రత్యక్ష సంబంధాన్ని తెలియజేస్తుంది. దానిని నైరూప్య పదంగా మార్చకుండా ఉంచడం మూలపాఠంలోని చిత్రణను, దైవస్వరూపం గురించిన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని వాడుతూ, ‘ఎరిగిన’, ‘ముఖాముఖిగా’ వంటి గౌరవప్రదమైన మరియు సాధారణ పాఠకులకు అర్థమయ్యే బైబిలు పదప్రయోగాలను నిలిపాం.
