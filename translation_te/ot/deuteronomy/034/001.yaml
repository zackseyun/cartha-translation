reference: Deuteronomy 34:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: te
  text: అప్పుడు మోషే మోయాబు మైదానాల నుండి నెబో పర్వతానికి, యెరికోకు ఎదురుగా ఉన్న పిస్గా శిఖరానికి ఎక్కి వెళ్లాడు. యాహ్వే అతనికి దేశమంతటినీ, అంటే దాను వరకు ఉన్న గిలాదును, చూపించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే అతడు దేశమంతటినీ చూసేలా చేశాడు.”
    reason: ראה క్రియ యొక్క హిఫిల్ రూపాన్ని ‘చూపించాడు’ అని లేదా మరింత స్పష్టమైన కారణార్థక నిర్మాణంతో ‘చూసేలా చేశాడు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కి వెళ్లాడు
  rationale: עלה పైకి వెళ్లడాన్ని సూచిస్తుంది. ‘ఎక్కి వెళ్లాడు’ దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల నుంచి
  rationale: עַרְבוֹת ఇక్కడ మోయాబు ప్రాంతంలోని సమతల మైదానాలను సూచిస్తుంది; ‘మైదానాలు’ సాధారణ పాఠకులకు స్పష్టమైన భౌగోళిక పదం.
- source_word: הַר נְבוֹ
  choice: నెబో కొండకు
  rationale: హీబ్రూ הַר + స్థలనామాన్ని తెలుగులో సహజంగా ‘నెబో కొండ’ అని అనువదించాం.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: పిస్గా శిఖరానికి
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’; కొండ సందర్భంలో దాని సహజ భావం ‘శిఖరం’.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: యెరికోకు ఎదురుగా ఉన్న
  rationale: భౌగోళిక వర్ణనలో עַל־פְּנֵי ‘ఎదురుగా/అభిముఖంగా’ అనే భావాన్ని ఇస్తుంది; ‘ఎదురుగా ఉన్న’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: యాహ్వే అతనికి … చూపించాడు
  rationale: ראה హిఫిల్ రూపం కారణార్థకంగా ‘చూడేలా చేశాడు’ లేదా సహజంగా ‘చూపించాడు’ అని అర్థమిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: כָּל הָאָרֶץ
  choice: దేశమంతటినీ
  rationale: הָאָרֶץ ఇక్కడ భూమి మొత్తాన్ని కాక, మోషేకు చూపబడిన దేశాన్ని సూచిస్తుంది; ‘దేశమంతటినీ’ ఆ సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: దాను వరకు ఉన్న గిలాదును
  rationale: ఈ పదబంధం మోషే చూసిన ప్రాంతాల జాబితాను ప్రారంభిస్తుంది. עַד తెలిపే సరిహద్దు భావాన్ని ‘వరకు’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: וַיַּרְאֵהוּ లోని కారణార్థక భావం
  choice: అతనికి చూపించాడు
  alternative: అతడు చూసేలా చేశాడు
  rationale: రెండూ హిఫిల్ కారణార్థక రూపానికి సాధ్యమైన అనువాదాలే. ప్రధాన పాఠంలో సహజమైన ‘చూపించాడు’ వాడి, మరింత రూపసన్నిహితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని అనుసరించాం. భౌగోళిక పేర్లను సాధారణ తెలుగు బైబిలు వినియోగానికి దగ్గరగా లిప్యంతరీకరించాం. పిస్గా శిఖరం నెబో కొండకు వివరణాత్మక సమానాధికరణగా ఉందని డాష్‌లతో స్పష్టం చేశాం; జాబితా ప్రారంభాన్ని ద్విబిందువుతో చూపించాం.
