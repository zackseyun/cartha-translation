source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: te
  text: 'యాహ్వే అతనితో ఇలా అన్నాడు: “నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు, ‘నీ సంతానానికి[a] దీన్ని ఇస్తాను’ అని ప్రమాణం చేసిన దేశం ఇదే. నీ కళ్లతోనే దాన్ని చూసేలా చేశాను; అయితే నీవు అక్కడికి దాటి వెళ్లవు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ విత్తనానికి.” హీబ్రూలో ఏకవచన రూపంలో ఉన్న సమూహవాచక పదం వాడబడింది.
    reason: זֶרַע పదానికి ఉన్న అక్షరార్థ ప్రత్యామ్నాయాన్ని, దాని వ్యాకరణ సంఖ్యను తెలియజేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఆధునిక ఉచ్చారణను తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: זֹאת הָאָרֶץ
  choice: దేశం ఇదే
  rationale: ఇక్కడ הָאָרֶץ పితరులకు వాగ్దానం చేసిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో విధేయాన్ని చివర ఉంచడం సహజంగా ఉంది.
- source_word: נִשְׁבַּעְתִּי
  choice: ప్రమాణం చేసిన
  rationale: ఈ క్రియలోని గంభీరమైన ప్రమాణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: ప్రతి పేరుతో హీబ్రూలో పునరుక్తమైన సంబంధ సూచకాన్ని తెలుగు విభక్తి ప్రత్యయంతో నిలుపుతుంది.
- source_word: לְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע ఏకవచన రూపంలో ఉన్న సమూహవాచకం. ‘సంతానం’ దాని సమూహార్థాన్ని, ఏకవచన రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֶתְּנֶנָּה
  choice: దీన్ని ఇస్తాను
  rationale: స్త్రీలింగ ప్రత్యయం ముందున్న ‘దేశం’ను సూచిస్తుంది; సమీపంగా సూచించిన దేశానికి తెలుగులో ‘దీన్ని’ సహజంగా ఉంది.
- source_word: הֶרְאִיתִיךָ
  choice: దాన్ని చూసేలా చేశాను
  rationale: ראה హిఫీల్ రూపంలోని కారణార్థాన్ని ‘చూపించాను’ కంటే ప్రత్యక్షంగా వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֶיךָ
  choice: నీ కళ్లతోనే
  rationale: మోషే స్వయంగా ప్రత్యక్షంగా చూశాడనే హీబ్రూ ఉద్ఘాటనను ‘-నే’ ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: అయితే నీవు అక్కడికి దాటి వెళ్లవు
  rationale: עָבַר లోని సరిహద్దు దాటే స్థలచిత్రాన్ని నిలుపుతూ, ముందు మాటతో ఉన్న వ్యత్యాసాన్ని ‘అయితే’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా అందిస్తుంది; ‘యాహ్వే’ హీబ్రూ నామానికి సమీపమైన ఆధునిక లిప్యంతరీకరణ.
- issue: పితరులకు చేసిన వాగ్దానంలో זֶרַע పదం
  choice: సంతానం
  alternative: విత్తనం; సంతతివారు
  rationale: మూలంలోని ఏకవచన సమూహవాచక స్వభావాన్ని నిలుపుతూ, అది ఒక వ్యక్తిని మాత్రమే లేదా స్పష్టమైన బహువచనాన్ని మాత్రమే సూచిస్తుందని ప్రధాన పాఠంలో ముందే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన వాక్య నిర్మాణం వాడబడింది. దైవనామం ప్రత్యక్షంగా ఉంచబడింది; ప్రమాణం, ప్రత్యక్ష దర్శనం, దేశంలోకి దాటి వెళ్లలేకపోవడం అనే మూలపాఠంలోని భావ ఉద్రిక్తతను వివరణాత్మకంగా సడలించలేదు.
