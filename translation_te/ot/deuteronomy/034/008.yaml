source:
  edition: WLC
  text: וַ/יִּבְכּוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת מֹשֶׁ֛ה בְּ/עַֽרְבֹ֥ת מוֹאָ֖ב שְׁלֹשִׁ֣ים י֑וֹם וַֽ/יִּתְּמ֔וּ יְמֵ֥י בְכִ֖י אֵ֥בֶל מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు మోయాబు మైదానాల్లో మోషే కోసం ముప్పై రోజులు ఏడ్చారు; మోషేను గూర్చి శోకించి ఏడ్చిన రోజులు ముగిశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: ఏడ్చారు
  rationale: בכה అనే క్రియ ప్రత్యక్షంగా ఏడవడాన్ని సూచిస్తుంది; తరువాత వచ్చే విస్తృతమైన దుఃఖభావనతో దీనిని వేరుగా ఉంచుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’; అయితే సందర్భంలో సమాజమంతటినీ సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన, లింగపరంగా అనవసరంగా పరిమితం చేయని రూపం.
- source_word: אֶת מֹשֶׁה
  choice: మోషే కోసం
  rationale: בכהతో వచ్చిన ప్రత్యక్ష కర్మ సూచిక, ఎవరి మరణాన్ని బట్టి ఏడ్చారో తెలుపుతుంది; తెలుగులో ‘కోసం ఏడ్చారు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עַרְבוֹת సమతలమైన మైదాన లేదా మైదాన-ప్రాంతాన్ని సూచిస్తుంది; భౌగోళిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁלֹשִׁים יוֹם
  choice: ముప్పై రోజులు
  rationale: సంఖ్యా పదబంధానికి నేరమైన తెలుగు అనువాదం.
- source_word: וַיִּתְּמוּ
  choice: ముగిశాయి
  rationale: תם ఇక్కడ ఒక నిర్ణీత కాలం పూర్తై అంతమవడాన్ని సూచిస్తుంది; తెలుగులో ‘ముగిశాయి’ సహజంగా ఫలితస్థితిని తెలియజేస్తుంది.
- source_word: יְמֵי בְכִי
  choice: ఏడ్చే రోజులు
  rationale: ఏడుపుతో గుర్తించబడిన కాలాన్ని సూచించే నిర్మాణం; సందర్భానుసారంగా క్రియాత్మక తెలుగులో అందించబడింది.
- source_word: אֵבֶל מֹשֶׁה
  choice: మోషే కోసం ... దుఃఖించే
  rationale: ఈ సంబంధ నిర్మాణం మోషేను గూర్చిన శోకాన్ని సూచిస్తుంది; తెలుగులో ‘మోషే కోసం దుఃఖించే’ అని చెప్పడం అర్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
