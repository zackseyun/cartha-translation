  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ వాక్యంలోని ఏడుపు మరియు దుఃఖం అనే రెండు భావాంశాలు నిలుపబడ్డాయి; అసహజమైన అక్షరానువాదాన్ని నివారించేందుకు రెండవ భాగం సహజ తెలుగు క్రియాపదబంధంగా ఇవ్వబడింది.
