id: DEU.18.16
reference: Deuteronomy 18:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: te
  text: 'హోరేబులో సమాజం కూడిన రోజున నీ దేవుడైన యెహోవా దగ్గర నీవు అడిగినట్టే: ‘నా దేవుడైన యెహోవా స్వరాన్ని ఇకపై నేను వినకూడదు; ఈ గొప్ప అగ్నిని ఇకపై చూడకూడదు; లేకపోతే నేను చనిపోతాను’ అని అన్నావు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: నీవు ... అడిగినట్టే
  rationale: כְּכֹל אֲשֶׁר అనే పోలికను సహజమైన తెలుగులో నిలిపి, מֵעִם సూచించే అభ్యర్థనను ‘అడిగిన’గా వ్యక్తపరిచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని వ్యక్తిగత నామ స్వభావాన్ని నిలుపుతూ, తెలుగులో విస్తృతంగా తెలిసిన రూపాన్ని వాడాం.
- source_word: בְּיוֹם הַקָּהָל
  choice: సమాజం కూడిన రోజున
  rationale: הַקָּהָל ఇక్కడ ప్రజలు సభగా కూడిన సంఘటనను సూచిస్తుంది; కేవలం సంస్థార్థకమైన ‘సమాజం’ కంటే చర్యను కూడా స్పష్టం చేశాం.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: ఇక విననివ్వకు
  rationale: ‘మళ్లీ/ఇక కొనసాగించి వినకూడదు’ అనే భావాన్ని సందర్భానుగుణమైన తెలుగు అభ్యర్థన రూపంలో తెలిపాం.
- source_word: וְלֹא אָמוּת
  choice: నేను చనిపోకుండా ఉండేలా
  rationale: హీబ్రూ సమన్వయ వాక్యం సందర్భంలో భయపడిన ఫలితాన్ని సూచిస్తుంది; సహజ తెలుగులో ఉద్దేశ్య/నివారణ భావంతో అనువదించాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక వ్యక్తిగత దైవనామం ఉంది; దానిని తెలుగులో లిప్యంతరీకరించడం మూల భేదాన్ని కాపాడుతుంది.
- issue: וְלֹא אָמוּת యొక్క సంబంధం
  choice: నేను చనిపోకుండా ఉండేలా
  alternative: లేకపోతే నేను చనిపోతాను
  rationale: రెండు భావాలూ సందర్భానికి సరిపోతాయి. హీబ్రూ అక్షరార్థంగా ‘మరియు నేను చనిపోను’ అని ఉన్నా, ముందున్న నిషేధ అభ్యర్థనలకు దాని ఉద్దేశ్య సంబంధాన్ని సహజ తెలుగులో చూపించాం; అదనపు సిద్ధాంతార్థం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ఈ వచనం ముందరి వాక్యంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున, స్వతంత్ర పఠనానికి ‘ఇది జరుగుతుంది’ అని స్వల్పంగా పూరించాం.
