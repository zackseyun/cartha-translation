  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి నీవు ప్రవేశించినప్పుడు, ఆ జనాంగాల హేయక్రియలను అనుసరించి చేయడం నేర్చుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ జనాంగాల హేయక్రియల వలె చేయడం.” హీబ్రూ ఉపసర్గకు పోలిక లేదా వాటికి అనుగుణంగా ప్రవర్తించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ప్రవేశించినప్పుడు
  rationale: ఇక్కడ כִּי కారణాన్ని కాక, తరువాతి నిషేధం వర్తించే కాలసందర్భాన్ని పరిచయం చేస్తోంది.
- source_word: בָּא אֶל־הָאָרֶץ
  choice: దేశంలోకి నీవు ప్రవేశించినప్పుడు
  rationale: వర్తమాన కృదంతం సందర్భంలో సమీప భవిష్యత్తు భావాన్ని ఇస్తుంది; తెలుగులో ‘ప్రవేశించినప్పుడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఉంచి, సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: కృదంతంలోని కొనసాగుతున్న లేదా సమీపంగా నెరవేరబోయే కార్యభావాన్ని నిలుపుతుంది.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: చేయడం నేర్చుకోకూడదు
  rationale: హీబ్రూ నిషేధాత్మక క్రియారూపాన్నీ, ‘నేర్చుకోవడం—చేయడం’ అనే సంబంధాన్నీ స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כְּתוֹעֲבֹת
  choice: హేయమైన ఆచారాలను
  rationale: תּוֹעֵבָה యొక్క బలమైన నైతిక-మతపరమైన అసహ్యతను ‘హేయమైన’ తెలియజేస్తుంది; సందర్భంలో ‘ఆచారాలు’ చేయదగిన క్రియలను సూచిస్తుంది. כְ లోని అనురూపత/అనుసరణ భావం వాక్య నిర్మాణంలో అంతర్భూతంగా ఉంది.
- source_word: הַגּוֹיִם הָהֵם
  choice: ఆ జనాల
  rationale: దూరసూచక הָהֵם ను ‘ఆ’గా, ఇక్కడి ప్రజాసమూహాలను సూచించే גּוֹיִם ను సహజమైన ‘జనాలు’గా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలానికి నిబద్ధంగా ఉంటుంది.
- issue: תּוֹעֵבָה పదబలం
  choice: హేయమైన ఆచారాలు
  alternative: హేయకార్యాలు / అసహ్యమైనవి
  rationale: ఈ పదంలోని బలమైన ఒడంబడికాత్మక, నైతిక-మతపరమైన ఖండనను నిలుపుతూ, తరువాతి వచనాల్లో వివరించబడే ఆచరణల సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆజ్ఞాశైలిని ఉపయోగించాం. ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీవు/నీకు’తో నిలిపాం. మూలంలోని כְ ఉపసర్గకు ‘వలె’ లేదా ‘ప్రకారం’ అనే రెండు ఛాయలు సాధ్యమైనా, తెలుగులో ‘ఆ ఆచారాలను చేయడం’ అనేది వాటిని అనుకరించి ఆచరించడాన్ని సహజంగా తెలియజేస్తుంది; అందువల్ల ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
