revisions:
- from: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి నీవు ప్రవేశించినప్పుడు, ఆ జనాల హేయమైన ఆచారాలను చేయడం నేర్చుకోకూడదు.
  to: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి నీవు ప్రవేశించినప్పుడు, ఆ జనాంగాల హేయక్రియలను అనుసరించి చేయడం నేర్చుకోకూడదు.[a]
