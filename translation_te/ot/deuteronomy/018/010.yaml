id: DEU.18.10
reference: Deuteronomy 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: te
  text: తన కుమారుడినైనా కుమార్తెనైనా అగ్ని గుండా దాటించేవాడు[a], దైవజ్ఞానం చెప్పేవాడు, భవిష్యత్తు చెప్పేవాడు[b], శకునాలను బట్టి జోస్యం చెప్పేవాడు[c], లేదా మంత్రవిద్య చేసేవాడు[d] మీ మధ్య ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన కుమారుడినైనా కుమార్తెనైనా అగ్నిలో కాల్చేవాడు,” లేదా “తన కుమారుడినైనా కుమార్తెనైనా అగ్నిలో బలిగా అర్పించేవాడు.” హీబ్రూలో అక్షరార్థంగా “తన కుమారుడినైనా కుమార్తెనైనా అగ్ని గుండా దాటించేవాడు” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఈ హీబ్రూ పదానికి అర్థం నిర్ధారించడం కష్టం. “జోస్యం చెప్పేవాడు,” “శుభాశుభ కాలాలను గమనించేవాడు,” లేదా “శకునాలు గమనించేవాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “శకునాల ద్వారా దైవజ్ఞానం చెప్పేవాడు.”
    reason: lexical_alternative
  - marker: d
    text: లేదా “చేతబడి చేసేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: మీ మధ్య ఉండకూడదు
  rationale: నిషేధార్థక నిఫాల్ రూపాన్ని తెలుగు న్యాయనిబంధన సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది; సమాజంలో అలాంటి వ్యక్తికి స్థానం ఉండరాదనే భావాన్ని నిలుపుతుంది.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: తన కుమారుడినైనా కుమార్తెనైనా అగ్నిలో గుండా దాటించేవాడు
  rationale: హిఫిల్ రూపంలోని ‘దాటింపజేయు’ అనే మూల భావాన్ని నిలుపుతూ, ఆ కర్మ బలి ఇవ్వడమా కాల్చడమా అన్నదాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: קֹסֵם קְסָמִים
  choice: శకునం చెప్పేవాడు
  rationale: క్రియాశీల కృదంతం మరియు దానికి సమానమూల కర్మ కలయిక సూచించే దైవజ్ఞాన ఆచరణను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מְעוֹנֵן
  choice: ముహూర్తాలు చూసేవాడు
  rationale: అర్థం వివాదాస్పదమైన ఈ పదానికి కాలాలు లేదా శుభాశుభ సమయాలను గమనించే ఆచారం అనే సంప్రదాయ వ్యుత్పత్తి భావాన్ని అందిస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: מְנַחֵשׁ
  choice: సూచనలను బట్టి జోస్యం చెప్పేవాడు
  rationale: కనిపించే సంకేతాలు లేదా శకునాల ఆధారంగా ఫలితాన్ని ఊహించే ఆచరణను, ముందున్న విస్తృత దైవజ్ఞాన పదం నుండి సాధ్యమైనంతవరకు వేరు చేస్తుంది.
- source_word: מְכַשֵּׁף
  choice: మంత్రవిద్య చేసేవాడు
  rationale: మాంత్రిక విద్యలను ఆచరించడాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఆధునిక సాంస్కృతికంగా సంకుచితమైన భావాలను అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: పిల్లలను అగ్నిలో దాటించే నిషేధం స్వరూపం
  choice: ‘అగ్నిలో గుండా దాటించేవాడు’ అనే హీబ్రూ భావరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: అగ్నిలో కాల్చేవాడు; అగ్నిలో బలిగా అర్పించేవాడు
  rationale: ఈ మాట పిల్లలు మరియు అగ్నితో కూడిన నిషిద్ధ కర్మను స్పష్టంగా ఖండిస్తుంది; అయితే ఈ వాక్యంలోని హీబ్రూ పదబంధం ఆ కర్మ యొక్క ఖచ్చిత రూపాన్ని పూర్తిగా వివరించదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా క్రియాత్మక జాబితా రూపం ఉపయోగించబడింది. ‘ముహూర్తాలు చూసేవాడు’ అనే పదబంధం సుపరిచితమైనదైనా మూలపదం అనిశ్చితమైనందున పాదటిప్పణి జోడించబడింది. మూలంలోని ప్రతి నిషిద్ధ ఆచరణను వీలైనంత వేరుగా ఉంచుతూ, పిల్లలు-అగ్ని కర్మ విషయంలోని నిజమైన అస్పష్టతను పరిష్కరించకుండా నిలిపింది.
