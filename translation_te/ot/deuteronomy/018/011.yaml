  source_fidelity: హీబ్రూ జాబితాలోని నాలుగు ప్రత్యేక అంశాలను నిలుపుకోవాలి. ముసాయిదాలో שֹׁאֵל אוֹב ను ‘చనిపోయినవారి ఆత్మను సంప్రదించేవాడు’గా చేసినందున, ఆ పదానికి సాధ్యమైన ‘మాధ్యమం’ అనే అర్థం ప్రధాన పాఠంలో కోల్పోయింది. అలాగే יִדְּעֹנִיకి ‘కర్ణపిశాచి విద్యగలవాడు’ అనేది ప్రాంతీయ జానపద-మత భావాలను నిర్దిష్టంగా జోడిస్తుంది; హీబ్రూ పదంలోని విస్తృతతను కాపాడదు.
  naturalness: ‘మంత్రబంధనం చేసేవాడు,’ ‘మాధ్యమాన్ని ... సంప్రదించేవాడు,’ ‘ఆత్మవాదిని,’ ‘మృతులను సంప్రదించేవాడు’ అనే రూపాలు ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, ధర్మశాస్త్ర జాబితా రీతికి తగినట్టుగా ఉన్నాయి. చివరి ‘ఉండకూడదు’ మునుపటి వచనం నుంచి కొనసాగుతున్న నిషేధాన్ని సహజంగా పూర్తి చేస్తుంది.
  terminology: אוֹבకు ‘మాధ్యమం’ను, יִדְּעֹנִיకి జానపదంగా పరిమితమైన ‘కర్ణపిశాచి విద్యగలవాడు’ బదులు విస్తృతమైన ‘ఆత్మవాది’ని వాడడం అనుకూలం. דֹרֵשׁ אֶל־הַמֵּתִיםకు ‘మృతులను సంప్రదించేవాడు’ అనేది విచారణ/సంప్రదింపు భావాన్ని స్పష్టంగా ఇస్తుంది; దీనిని మాధ్యమాన్ని సంప్రదించడమనే ముందటి అంశం నుంచి వేరుగా ఉంచుతుంది.
