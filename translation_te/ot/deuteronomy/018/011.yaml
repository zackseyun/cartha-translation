source:
  edition: WLC
  text: וְ/חֹבֵ֖ר חָ֑בֶר וְ/שֹׁאֵ֥ל אוֹב֙ וְ/יִדְּעֹנִ֔י וְ/דֹרֵ֖שׁ אֶל הַ/מֵּתִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: te
  text: లేదా మంత్రబంధనం చేసేవాడైనా[a], మాధ్యమాన్ని[b] గానీ ఆత్మవాదిని[c] గానీ సంప్రదించేవాడైనా, మృతులను సంప్రదించేవాడైనా ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘కట్టును కట్టేవాడు.’ ఇది మాంత్రిక మంత్రోచ్చారణ లేదా మంత్రబంధనాన్ని సూచిస్తుంది. ‘మంత్రాలు వేసేవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మృతాత్మను సంప్రదించేవాడు.’ హీబ్రూ పదం మృతాత్మను లేదా అలాంటి ఆత్మతో సంబంధమున్న మాధ్యమాన్ని సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: c
    text: లేదా, ‘ఆత్మలతో సంబంధమున్న సాధకుడు.’ సాంప్రదాయ అనువాదాల్లో ‘మాంత్రికుడు’ లేదా ‘జ్ఞాని’ అని కూడా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: మంత్రం కట్టేవాడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘కట్టును కట్టేవాడు’ అనే భావాన్ని కలిగి, మాంత్రిక మంత్రోచ్చారణ ద్వారా బంధించడాన్ని సూచిస్తుంది. ‘మంత్రం కట్టేవాడు’ మూలంలోని రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: שֹׁאֵל אוֹב
  choice: చనిపోయినవారి ఆత్మను సంప్రదించేవాడు
  rationale: אוֹב చనిపోయినవారి ఆత్మను గానీ, అలాంటి ఆత్మను సంప్రదించే మాధ్యమాన్ని గానీ సూచించగలదు. మూలంలోని అస్పష్టతను పాదసూచికలో ఉంచుతూ, ప్రధాన పాఠంలో నిషేధిత సంప్రదింపును స్పష్టంగా వ్యక్తం చేసింది.
- source_word: יִדְּעֹנִי
  choice: కర్ణపిశాచి విద్యగలవాడు
  rationale: ఈ పదం אוֹב తో తరచుగా జతగా వచ్చే, అతీంద్రియ జ్ఞానంతో సంబంధమున్న సాధకుణ్ణి సూచిస్తుంది. తెలుగులో ప్రాచుర్యమున్న ఈ పదబంధం ఆచారిని సూచిస్తుంది; ఆధునిక ఫాంటసీ భావాలను రేకెత్తించే పదాలను నివారిస్తుంది.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: చనిపోయినవారిని విచారించేవాడు
  rationale: דֹרֵשׁ ఇక్కడ సమాచారం కోసం వెదకడం లేదా విచారించడం అనే భావం ఇస్తుంది. ‘విచారించేవాడు’ మృతులతో సంప్రదింపును అతిగా వివరణాత్మకం చేయకుండా దగ్గరగా తెలియజేస్తుంది.
- source_word: וְ
  choice: లేదా … అయినా
  rationale: మునుపటి వచనం నుంచి కొనసాగుతున్న నిషేధిత ఆచారాల జాబితాలో తెలుగు న్యాయశైలికి అనుగుణంగా ప్రత్యామ్నాయ అంశాలను ‘లేదా … అయినా’తో అనుసంధానించింది.
theological_decisions:
- issue: తరువాతి జానపద లేదా ఫాంటసీ భావాలను చేర్చకుండా గూఢాచార పదజాలాన్ని అనువదించడం
  choice: మూలంలోని వేర్వేరు సాధకులను వేర్వేరు పదబంధాలతో చూపించి, మృతాత్మ సంప్రదింపు మరియు మృతులను విచారించడం మధ్య తేడాను నిలుపుకోవడం
  alternative: అన్నిటినీ సాధారణంగా ‘మాంత్రికుడు’ లేదా ‘మృతులతో మాట్లాడేవాడు’ అని అనువదించడం
  rationale: ఈ వచనం అనేక నిషేధిత ఆచారాలను విడివిడిగా పేర్కొంటుంది. వాటిని ఒకే వర్గంగా కలపడం మూలంలోని జాబితా నిర్మాణాన్నీ భావ ఛాయలనూ కోల్పోయేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర జాబితాకు తగిన గంభీరతతో రూపొందించబడింది. వాక్యం ముందు వచనం నుంచి కొనసాగుతున్నందున ‘ఉండకూడదు’ను భావపూరకంగా చేర్చింది.
