source:
  edition: WLC
  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేతో నీవు నిందారహితుడిగా ఉండాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ దేవుడైన యాహ్వేతో సంపూర్ణుడిగా ఉండాలి’ లేదా ‘సమగ్రమైనవాడిగా ఉండాలి.’
    reason: תָּמִים అనే పదానికి ‘సంపూర్ణమైన,’ ‘సమగ్రమైన,’ ‘లోపంలేని’ అనే అర్థ ఛాయలు ఉన్నాయి.
lexical_decisions:
- source_word: תָּמִים
  choice: నిందారహితంగా
  rationale: ఈ పదం సంపూర్ణత, సమగ్రత, లోపరాహిత్యం అనే భావాలను కలిగి ఉంది. చుట్టుపక్కల వచనాల్లో నిషేధించిన శకునాలు, మంత్రతంత్రాలకు విరుద్ధంగా దేవునిపట్ల యథార్థమైన నిబద్ధతను ఇక్కడ సూచిస్తుంది. ‘నిందారహితంగా’ అనే పదం నైతిక, నిబంధనాత్మక భావాన్ని తెలియజేస్తుంది; అయితే పాపరహిత పరిపూర్ణతను తప్పనిసరిగా సూచించదు.
- source_word: תִּהְיֶה
  choice: నీవు ... ఉండాలి
  rationale: హయా ధాతువు Qal imperfect రెండవ పురుష ఏకవచన రూపం ఇక్కడ ఆజ్ఞాపూర్వక ఉద్బోధగా పనిచేస్తుంది. ఆధునిక తెలుగులో ‘ఉండాలి’ దాని నిర్దేశాత్మక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִם
  choice: తో
  rationale: ఈ ఉపసర్గకు నేరమైన అర్థం ‘తో’. ఇది యాహ్వేతో ఇశ్రాయేలీయుని సంబంధాన్ని సూచిస్తుంది. ‘సమక్షంలో’ అని అనువదిస్తే మూలంలో ఉన్న సంబంధాత్మక అస్పష్టత కొంత పరిష్కరించబడుతుంది కాబట్టి ‘తో’ను నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మితమైన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష పుంలింగ ఏకవచన ప్రత్యయంతో, యాహ్వేను సూచిస్తున్న ఈ సందర్భంలో ఇది ఏకవచనంగా ‘నీ దేవుడు’ అని అర్థమవుతుంది. తెలుగులో యాహ్వేతో సహజంగా అనుసంధానించేందుకు ‘నీ దేవుడైన’ అని ఇచ్చాం.
theological_decisions:
- issue: నిబంధనాత్మక ఉద్బోధలో תָּמִים అర్థం
  choice: దేవునితో సంబంధంలో నిందారహితమైన సమగ్రత, నిబద్ధత
  alternative: నీ దేవుడైన యాహ్వేతో సంపూర్ణంగా లేదా పూర్ణహృదయంతో ఉండాలి
  rationale: ద్వితీయోపదేశకాండము 18:9–14 సందర్భంలో ఈ మాట అన్యజాతుల క్షుద్ర, శకున సంబంధ ఆచారాలకు విరుద్ధంగా అవిభక్త నిబంధన విశ్వాసాన్ని కోరుతుంది. ‘నిందారహితంగా’ నైతిక బలాన్ని నిలుపుతుంది; దానిని సంపూర్ణ పాపరాహిత్య సిద్ధాంతంగా స్పష్టీకరించదు. ‘సంపూర్ణంగా’ అనే మూలార్థ ఛాయను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞాపూర్వక శైలిని ఉపయోగించాం. రెండవ పురుష ఏకవచనాన్ని ‘నీ/నీవు’తో నిలిపాం. ‘యాహ్వే’ అనే వ్యక్తిగత దైవనామాన్ని ఉపయోగించాం; మూలంలోని עִם సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా ‘తో’గా అనువదించాం.
