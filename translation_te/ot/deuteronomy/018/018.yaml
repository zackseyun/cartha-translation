source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: te
  text: వారి సోదరుల మధ్యనుండి నీ వంటివాడైన ఒక ప్రవక్తను వారి కోసం నేను లేపుతాను. నా మాటలను అతని నోట ఉంచుతాను; నేను అతనికి ఆజ్ఞాపించేదంతా అతడు వారికి చెబుతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి బంధువుల మధ్యనుండి’ లేదా ‘వారి తోటి ఇశ్రాయేలీయుల మధ్యనుండి’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా, ‘వారి సోదరుల మధ్యనుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: ఒక ప్రవక్తను
  rationale: దేవుని తరఫున మాట్లాడే వ్యక్తిని సూచించే సాధారణ హీబ్రూ పదానికి సహజమైన తెలుగు రూపం; ఈ ప్రవచన సందర్భంలో అనిర్దిష్ట భావాన్ని ‘ఒక’ స్పష్టం చేస్తుంది.
- source_word: אָקִים
  choice: నేను లేపుతాను
  rationale: קום ధాతువు హిఫీల్ రూపం ఇక్కడ దేవుడు ప్రవక్తను ఉనికిలోకి తెచ్చి నియమించడాన్ని సూచిస్తుంది; ‘లేపుతాను’ మూలరూపకాన్ని కాపాడుతుంది.
- source_word: לָהֶם
  choice: వారి కోసం
  rationale: ప్రజలకు అనుగ్రహంగా ప్రవక్తను సమకూర్చే వాగ్దాన సందర్భంలో ל ఉపసర్గ ప్రయోజనార్థక భావాన్ని ఇస్తుంది.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: వారి సోదరుల మధ్యనుండి
  rationale: מִקֶּרֶב యొక్క ‘మధ్యనుండి’ భావాన్నీ, אֲחֵיהֶם యొక్క అక్షరార్థమైన పురుషలింగ బంధుత్వ పదాన్నీ నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు సహోదర సమాజాన్ని సూచించగలదు.
- source_word: כָּמוֹךָ
  choice: నీ వంటివాడైన
  rationale: మోషేతో ఉన్న ప్రత్యక్ష పోలికను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: నా మాటలను అతని నోట ఉంచుతాను
  rationale: దేవుడు ప్రవక్తకు పలకవలసిన మాటలను ఇస్తాడనే సజీవమైన నియామక రూపకాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: అతడు వారికి చెబుతాడు
  rationale: ప్రవక్త ప్రజలకు దేవుని ఆజ్ఞను తెలియజేయడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; אֶל యొక్క దిశార్థం ‘వారికి’లో నిలుస్తుంది.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: నేను అతనికి ఆజ్ఞాపించేదంతా
  rationale: כָּל אֲשֶׁר యొక్క సమగ్రతను ‘అంతా’ కాపాడుతుంది; భవిష్యత్ వాగ్దాన పరిధిలోని హీబ్రూ అసంపూర్ణ క్రియను తెలుగు సంబంధక్రియ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వాగ్దానం చేయబడిన ప్రవక్తకు మెస్సీయ సంబంధమైన నిర్దిష్ట గుర్తింపు
  choice: మోషే వంటివాడైన ఒక ప్రవక్త అనే హీబ్రూ వాక్యాన్నే ప్రధాన పాఠంలో ఉంచడం
  alternative: ప్రవక్తల పరంపరగా గాని, మెస్సీయలో నెరవేరే అంత్యకాల ప్రవక్తగా గాని స్పష్టంగా గుర్తించడం
  rationale: ఈ వచనం ఆ వ్యక్తిని మరింత నిర్దిష్టంగా గుర్తించదు. అందువల్ల సామూహిక లేదా మెస్సీయ సంబంధమైన వ్యాఖ్యానాల్లో ఏదీ అనువాదంలోకి చేర్చకుండా మూలంలోని ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
- issue: אֲחֵיהֶם యొక్క పరిధి
  choice: వారి సోదరులు
  alternative: వారి బంధువులు; వారి తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని ప్రధాన పాఠంలో కాపాడుతూ, దాని ఒడంబడిక-సమాజ సంబంధమైన విస్తృత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘లేపుతాను,’ ‘అతని నోట ఉంచుతాను’ అనే మూలరూపకాలు నిలుపబడ్డాయి; పాఠకులకు అర్థమయ్యేలా వాక్యాన్ని రెండు భాగాలుగా విభజించాం.
