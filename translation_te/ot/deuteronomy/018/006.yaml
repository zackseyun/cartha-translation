id: DEU.18.6
reference: Deuteronomy 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: te
  text: ఒకవేళ ఒక లేవీయుడు ఇశ్రాయేలు అంతటిలో తాను నివసిస్తున్న నీ పట్టణాల్లో ఏదో ఒకదాని నుండి వచ్చి[a], యాహ్వే ఎన్నుకునే స్థలానికి తన మనసులోని పూర్తి కోరికతో వస్తే,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ ద్వారాల్లో ఒకదాని నుండి.” ఇక్కడ “ద్వారాలు” అనేది పట్టణాలు లేదా జనావాసాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “తన ప్రాణం నిండా కోరుకొని”; “తన ప్రాణపు తపన అంతటితో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ఒకవేళ
  rationale: ముందున్న ధర్మశాసన నియమంతో అనుసంధానమైన షరతును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הַלֵּוִי
  choice: ఒక లేవీయుడు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఇక్కడ అది ఒక వర్గానికి చెందిన ప్రతినిధిని సాధారణంగా సూచిస్తుంది; తెలుగు నియమవాక్యంలో ‘ఒక లేవీయుడు’ సహజంగా ఉంటుంది.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో ఒకదాని నుండి
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో ఒకదాని నుండి’; ఇక్కడ ‘ద్వారాలు’ పట్టణాలను సూచించే లక్షణార్థ ప్రయోగం. భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా, అక్షరార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అంతటిలోని
  rationale: ఇశ్రాయేలు ప్రాంతమంతటిలో ఏ ప్రదేశం నుండైనా అనే విస్తృత భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: తాను నివసిస్తున్న
  rationale: גור ఇక్కడ స్థిర భూస్వాస్థ్యం లేని నివాసాన్ని సూచించగలదు; అయితే ‘పరదేశిగా’ అని అనువదించడం ఈ సందర్భంలో అతిగా నిర్దిష్టం అవుతుంది.
- source_word: יָבֹא ... וּבָא
  choice: వచ్చి ... వస్తే
  rationale: మూలంలోని క్రియ పునరుక్తిని నిలుపుతూ, అతడు నివాసస్థలం నుండి రావడం మరియు ఎన్నుకోబడే స్థలానికి చేరడం అనే క్రమాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: తన ప్రాణమంతటి కోరికతో
  rationale: נפשׁ పదాన్ని ‘ప్రాణం’గా నిలుపుతూ, సంపూర్ణమైన వ్యక్తిగత కోరిక లేదా తపనను వ్యక్తం చేస్తుంది; సాధ్యమైన భావవ్యత్యాసాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: אֶל הַמָּקוֹם
  choice: స్థలానికి
  rationale: మూలంలో కేవలం ‘స్థలం’ అని ఉంది. అది ఆరాధనకు కేంద్రస్థలమని సందర్భం సూచించినా, ప్రధాన పాఠ్యంలో ‘ఆలయం’ లేదా ‘పరిశుద్ధస్థలం’ అని విస్తరించలేదు.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: యాహ్వే ఎన్నుకునే
  rationale: అసంపూర్ణ క్రియారూపం భవిష్యత్తులో దేవుడు ఎన్నుకునే స్థలాన్ని సూచిస్తుంది; తెలుగులో ‘ఎన్నుకునే’ ఆ సూత్రవాక్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనువాదంగా అందిస్తుంది.
- issue: ‘స్థలం’ యొక్క ఆరాధనా సంబంధిత గుర్తింపు
  choice: స్థలం
  alternative: ఆరాధనా స్థలం; పరిశుద్ధస్థలం
  rationale: సందర్భంలో కేంద్ర ఆరాధనా స్థలం ఉద్దేశించబడినా, హీబ్రూ పదం దానిని ఇక్కడ నేరుగా వివరించదు; అందువల్ల మూలంలోని సూచితత్వాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ధర్మశాసనంలోని షరతు వాక్య నిర్మాణాన్ని మరియు తరువాతి వచనానికి కొనసాగుతున్న అసంపూర్ణ వాక్యాన్ని చివరి విరామచిహ్నంతో నిలిపింది.
