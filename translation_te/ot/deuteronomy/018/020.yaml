id: DEU.18.20
reference: Deuteronomy 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: te
  text: అయితే, నేను అతనికి చెప్పమని ఆజ్ఞాపించని మాటను నా పేరుతో చెప్పడానికి దుస్సాహసపడే ప్రవక్తైనా[a], ఇతర దేవుళ్ల పేరుతో మాట్లాడే ప్రవక్తైనా—ఆ ప్రవక్త మరణించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహంకారంగా హద్దుమీరి మాట్లాడే.’ హీబ్రూ క్రియ ఉద్దేశపూర్వకమైన దుస్సాహసాన్ని లేదా అహంకారంతో హద్దు మీరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరణశిక్షకు పాత్రుడు’ లేదా ‘చంపబడాలి.’ హీబ్రూ న్యాయపరమైన మరణ తీర్పును సంక్షిప్తంగా చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి వచనాల్లో చెప్పిన నిజమైన ప్రవక్తకు భిన్నంగా, ఇక్కడ విరుద్ధ పరిస్థితిని బలంగా పరిచయం చేస్తుంది.
- source_word: יָזִיד לְדַבֵּר
  choice: చెప్పడానికి దుస్సాహసంతో తెగించే
  rationale: זיד హిఫీల్ రూపం ఉద్దేశపూర్వకమైన దుస్సాహసాన్ని, తన హద్దును అహంకారంగా మీరడాన్ని సూచిస్తుంది. తెలుగు పదబంధం ఆ నైతిక, న్యాయపరమైన తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְדַבֵּר דָּבָר
  choice: మాటను ... చెప్పడానికి
  rationale: హీబ్రూ క్రియా-నామ నిర్మాణంలోని ‘మాట’ భావాన్ని నిలుపుతూ తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: בִּשְׁמִי
  choice: నా పేరట
  rationale: దేవుని అధికారాన్ని తనకు ఉన్నదని చెప్పుకోవడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: నేను చెప్పమని అతనికి ఆజ్ఞాపించని మాటను
  rationale: దేవుడు ఆ ప్రవక్తకు ఆ మాట చెప్పమని ఆజ్ఞ ఇవ్వలేదనే స్పష్టమైన భావాన్ని, పురుష ఏకవచన కర్మసూచనతో సహా నిలుపుతుంది.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: '... మాట్లాడే ప్రవక్తగానీ'
  rationale: ఇది శిక్షకు కారణమయ్యే రెండో ప్రత్యామ్నాయ అపరాధమని ‘గానీ ... గానీ’ నిర్మాణం తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్ల పేరట
  rationale: ఇతర దేవతల అధికారాన్ని ఆశ్రయించి మాట్లాడడమనే మూలభాష భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּמֵת
  choice: మరణించాలి
  rationale: హీబ్రూ న్యాయవాక్యంలోని సంక్షిప్తమైన మరణదండన ప్రకటనను నిలుపుతుంది; అమలు విధానాన్ని మూలంలో లేనంత స్పష్టంగా చేర్చదు.
- source_word: הַנָּבִיא הַהוּא
  choice: ఆ ప్రవక్త
  rationale: నామవాచకం, నిర్దేశక సర్వనామం కలిగిన హీబ్రూ నొక్కిచెప్పే నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని పేరుకు ప్రథమ పురుష సూచన
  choice: ‘నా పేరట’ అని ప్రత్యక్ష దైవవాక్యంలోని ప్రథమ పురుషాన్ని నిలిపాము.
  alternative: ‘యెహోవా పేరట’ అని విస్తరించడం
  rationale: హీబ్రూలో దేవుడే ప్రత్యక్షంగా మాట్లాడుతున్నాడు. కాబట్టి మూలంలో లేని దైవనామాన్ని చేర్చకుండా ప్రథమ పురుషాన్ని ఉంచడం సముచితం.
- issue: మరణదండన సూత్రవాక్యం
  choice: ‘మరణించాలి’
  alternative: ‘మరణశిక్ష విధించాలి’ లేదా ‘చంపబడాలి’
  rationale: וּמֵת న్యాయపరమైన మరణ ప్రకటనను సంక్షిప్తంగా ఇస్తుంది; దాన్ని ఎవరు లేదా ఎలా అమలు చేస్తారో స్పష్టంగా చెప్పదు. ఎంపిక చేసిన రూపం ఆ ఉద్రిక్తతను, సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర వాక్యానికి తగిన గంభీరతతో అనువదించబడింది. ‘నా పేరట,’ ‘ఇతర దేవుళ్ల పేరట’ అనే సమాంతర పదప్రయోగం మూలంలోని నిర్మాణాన్ని నిలుపుతుంది; ‘దుస్సాహసంతో తెగించే’ అనేది ఉద్దేశపూర్వకమైన అధికార అతిక్రమణను సహజంగా తెలియజేస్తుంది.
