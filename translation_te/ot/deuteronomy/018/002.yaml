  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: te
  text: అతనికి తన సోదరుల మధ్య స్వాస్థ్యం ఉండదు[a]. యెహోవాయే అతని స్వాస్థ్యం, ఆయన అతనితో చెప్పినట్లుగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన బంధువుల మధ్య.’ హెబ్రీలో అక్షరార్థంగా ‘తన సోదరుల మధ్య’; సందర్భంలో ఇది తోటి ఇశ్రాయేలీయులను, ప్రత్యేకంగా ఇతర గోత్రాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన అతనితో మాట్లాడినట్లుగా.’ హెబ్రీ క్రియ సాధారణంగా ‘మాట్లాడు/చెప్పు’ అని అర్థమిస్తుంది. సందర్భార్థంగా ‘వాగ్దానం చేసినట్లుగా’ అనవచ్చు, కానీ అది మరింత వ్యాఖ్యానాత్మకమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: స్వాస్థ్యం
  rationale: ద్వితీయోపదేశకాండంలోని భూభాగ కేటాయింపు సందర్భంలో ఇది వారసత్వంగా లభించే వాటాను సూచిస్తుంది. రెండు చోట్లా ఒకే పదాన్ని వాడడం ద్వారా హెబ్రీ పునరుక్తి, అలాగే భూసంబంధమైన భావం మరియు నిబంధనాత్మక రూపకాలంకార భావం రెండూ నిలుస్తాయి.
- source_word: בְּקֶרֶב
  choice: మధ్య
  rationale: בְּקֶרֶב אֶחָיו అనే పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం ‘తన సోదరుల మధ్య’; ఇది సంబంధపరమైన సందర్భాన్ని కాపాడుతుంది.
- source_word: אֶחָיו
  choice: తన సోదరులు
  rationale: హెబ్రీలో అక్షరార్థంగా ‘అతని సోదరులు.’ సందర్భంలో ఇది తోటి ఇశ్రాయేలీయులను, ప్రత్యేకంగా ఇతర గోత్రాలను సూచించినా, మూలంలోని బంధుత్వ పదాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో అందించాం.
- source_word: הוּא
  choice: యెహోవాయే
  rationale: స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగు ప్రత్యయం ‘-యే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: ఆయన అతనితో చెప్పినట్లుగా
  rationale: דִּבֶּר సాధారణంగా ‘మాట్లాడు/చెప్పు’ అనే అర్థమిస్తుంది. ‘వాగ్దానం చేసినట్లుగా’ అనడం సందర్భానుసారంగా సాధ్యమైనా, క్రియలో లేని భావాన్ని స్పష్టంగా చేర్చుతుంది; అందువల్ల తక్కువ వ్యాఖ్యానాత్మకమైన రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: ‘అతనికి/అతని’ అనే ఏకవచన సర్వనామాల సూచన
  choice: లేవీయుని లేదా లేవీయ యాజకుని గోత్రానికి ప్రాతినిధ్యం వహించే సామూహిక ఏకవచనంగా మూలరూపాన్ని నిలిపాం.
  alternative: ఇది గోత్రపితరుడైన లేవిని మాత్రమే సూచించడం; లేదా ప్రతి యాజకునికి విడివిడిగా వర్తించే పంపిణీ ఏకవచనంగా స్పష్టీకరించడం.
  rationale: తక్షణ సందర్భం లేవీయ యాజకులు మరియు లేవి గోత్రానికి సంబంధించినది. హెబ్రీ సామూహిక ప్రాతినిధ్యార్థంలో ఏకవచనాన్ని వాడగలదు; తెలుగు ఏకవచనం ఆ అస్పష్టతను అనవసరంగా కుదించదు.
- issue: ‘యెహోవాయే అతని స్వాస్థ్యం’ అనే మాట స్వభావం
  choice: దాని నిబంధనాత్మక-రూపకాలంకార ప్రకటనను వివరణతో విస్తరించకుండా యథాతథంగా నిలిపాం.
  alternative: ‘భూమికి బదులుగా యెహోవాయే లేవీయుల కేటాయించిన భాగం’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: హెబ్రీ వాక్యం దేవుడే స్వాస్థ్యమని సంక్షిప్తంగా, బలంగా చెబుతుంది. దాని దైవశాస్త్రీయ గాఢతను మరియు ఉద్వేగాన్ని పరిభాషతో పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘స్వాస్థ్యం’ అనే కీలక పదాన్ని రెండు భాగాల్లో ఒకేలా ఉంచి మూలంలోని పునరుక్తిని కాపాడాం; ‘యెహోవాయే’ ద్వారా హెబ్రీ ఉద్ఘాటనను సహజంగా వ్యక్తం చేశాం.
