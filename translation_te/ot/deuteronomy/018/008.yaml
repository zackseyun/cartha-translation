source:
  edition: WLC
  text: חֵ֥לֶק כְּ/חֵ֖לֶק יֹאכֵ֑לוּ לְ/בַ֥ד מִמְכָּרָ֖י/ו עַל הָ/אָבֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: te
  text: వారు సమాన వాటాలను తినాలి; తమ పూర్వీకుల ఆస్తి అమ్మకం ద్వారా వారికి వచ్చేదానికి అదనంగా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుటుంబ ఆస్తులను అమ్మడం ద్వారా వారికి లభించేదానికి అదనంగా.” చివరి హీబ్రూ పదబంధం అర్థం క్లిష్టమైనది; అది పూర్వీకుల కుటుంబం లేదా వారసత్వంతో సంబంధమున్న ఆదాయాన్ని మరింత సాధారణంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: సమానమైన వంతులు
  rationale: అక్షరార్థంగా ‘వంతుకు తగిన వంతు’; ఈ పదబంధం సమాన వాటాలను సూచిస్తుంది. ‘సమానమైన వంతులు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: יֹאכֵלוּ
  choice: తినాలి
  rationale: మూలంలోని స్పష్టమైన ‘తిను’ అనే క్రియను నిలుపుతూ, యాజక సేవకు సంబంధించిన ఆహార వంతులను అనుభవించడమనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְבַד
  choice: ఇది అదనం
  rationale: ఇది సమానమైన వంతుకు వేరుగా లభించే దానిని సూచిస్తుంది. తెలుగులో వాక్య సంబంధాన్ని స్పష్టంగా ఉంచడానికి ‘ఇది అదనం’ అని ఇచ్చాం.
- source_word: מִמְכָּרָיו עַל הָאָבוֹת
  choice: తమ పూర్వీకుల ఆస్తి అమ్మకం వల్ల అతనికి వచ్చేది
  rationale: హీబ్రూ చివరి పదబంధం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. పూర్వీకుల కుటుంబ ఆస్తి లేదా వారసత్వ హక్కులతో ముడిపడిన అమ్మకపు ఆదాయం అనే సంభావ్య భావాన్ని ఈ అనువాదం తెలియజేస్తుంది; అనిశ్చితిని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: מִמְכָּרָיו עַל הָאָבוֹת అనే చివరి పదబంధం యొక్క అర్థం
  choice: పూర్వీకుల ఆస్తి అమ్మకం వల్ల అతనికి వచ్చే వ్యక్తిగత ఆదాయం, సమానమైన యాజక వంతుకు అదనంగా ఉంటుంది
  alternative: కుటుంబ ఆస్తులను అమ్మడం వల్ల అతనికి లభించేది; లేదా పూర్వీకుల కుటుంబంతో సంబంధమున్న ఆదాయం
  rationale: సందర్భం కేంద్ర పరిశుద్ధస్థలంలో సేవచేసే లేవీయునికి సమాన వంతు లభించడాన్ని గురించి చెబుతుంది. అయితే చివరి హీబ్రూ పదబంధం వ్యాకరణపరంగా క్లిష్టమైనది. అందువల్ల ప్రధాన పాఠంలో సంభావ్య అర్థాన్ని ఇచ్చి, ఇతర సాధ్యార్థాలను పాదసూచికలో తెలియజేశాం; ఏ ప్రత్యేక సిద్ధాంతాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘వంతులు తినాలి’ అనే కొంత హెబ్రీయ ధోరణిగల స్పష్టమైన రూపాన్ని మూలంలోని concrete idiom నిలుపుటకు ఉద్దేశపూర్వకంగా వాడాం. ఏకవచన ‘అతనికి’ మూలంలోని ప్రత్యయాన్ని అనుసరిస్తుంది; ‘తమ పూర్వీకుల’ సమూహ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
