revisions:
- from: లేవీయ యాజకులకు—అంటే లేవి గోత్రమంతటికీ—ఇశ్రాయేలీయులతో కలిసి వంతుగానీ స్వాస్థ్యంగానీ ఉండదు. వారు యెహోవాకు అగ్నిలో అర్పించిన అర్పణలను, అంటే ఆయన స్వాస్థ్యాన్ని,[a] భుజిస్తారు.
  to: లేవీయ యాజకులకు—అంటే లేవి గోత్రమంతటికీ—ఇశ్రాయేలీయులతో పాటు వంతుగానీ స్వాస్థ్యంగానీ ఉండదు. యాహ్వేకు అగ్నియాగ అర్పణలను, అంటే ఆయన స్వాస్థ్యాన్ని,[a] వారు భుజిస్తారు.
  rationale: దైవనామాన్ని ప్రాజెక్టు విధానానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. అగ్ని-అర్పణల సాంకేతిక భావాన్ని ‘అగ్నియాగ అర్పణలు’తో సహజంగా ఇచ్చాం. ప్రధాన పాఠం ఇంగ్లీషు POB audit trailలోని వివరణాత్మక పఠనాన్ని అనుసరిస్తూనే, సంయోజక పఠనాన్ని మరియు సర్వనామ సూచనలోని అస్పష్టతను పాదటిప్పణిలో భద్రపరుస్తుంది.
