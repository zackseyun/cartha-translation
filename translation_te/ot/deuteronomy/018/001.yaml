id: DEU.18.1
reference: Deuteronomy 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: te
  text: లేవీయ యాజకులకు—అంటే లేవి గోత్రమంతటికీ—ఇశ్రాయేలీయులతో పాటు వంతుగానీ స్వాస్థ్యంగానీ ఉండదు. యాహ్వేకు అగ్నియాగ అర్పణలను, అంటే ఆయన స్వాస్థ్యాన్ని,[a] వారు భుజిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు అగ్నియాగ అర్పణలను మరియు ఆయన స్వాస్థ్యాన్ని.” “ఆయన స్వాస్థ్యం” యాహ్వేకు చెందినదని అర్థం కావచ్చు; లేదా సామూహిక ఏకవచనంగా లేవి గోత్రానికి చెందిన స్వాస్థ్యాన్ని సూచించవచ్చు. ద్వితీయోపదేశకాండము 18:2తో పోల్చండి; అక్కడ యాహ్వేయే వారి స్వాస్థ్యమని చెప్పబడింది.
    reason: వְ యొక్క సంయోజక పఠనాన్ని, అలాగే వְנַחֲלָתוֹలోని ఏకవచన ప్రత్యయానికి సాధ్యమైన సూచనలను కాపాడడానికి.
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయ యాజకులకు
  rationale: హీబ్రూ పదబంధం యాజకులను లేవీయులుగా గుర్తించే సమానాధికార ప్రయోగం. ‘లేవీయ యాజకులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: అంటే లేవి గోత్రమంతటికీ
  rationale: כָּל మొత్తం గోత్రాన్ని చేర్చే పరిధిని నొక్కిచెబుతుంది; వివరణాత్మక సమానాధికార సంబంధాన్ని ‘అంటే’ స్పష్టం చేస్తుంది.
- source_word: חֵלֶק וְנַחֲלָה
  choice: వంతుగానీ స్వాస్థ్యంగానీ
  rationale: ఈ జంట కేటాయించబడిన భూభాగం లేదా ఆస్తిపై హక్కును సూచిస్తుంది. తెలుగులో జత నిషేధాన్ని సహజంగా వ్యక్తం చేయడానికి ‘గానీ…గానీ’ వాడబడింది.
- source_word: עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో కలిసి
  rationale: ఇతర ఇశ్రాయేలు గోత్రాలతో ఉమ్మడిగా పొందే స్వాస్థ్యాన్ని ఇది సూచిస్తుంది; ప్రజలను ఉద్దేశించిన భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אִשֵּׁי יְהוָה
  choice: యెహోవాకు అగ్నిలో అర్పించిన అర్పణలను
  rationale: אִשִּׁים అగ్నితో సంబంధమున్న బల్యర్పణలను సూచిస్తుంది. మూలంలోని బలి సంబంధిత చిత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
- source_word: וְנַחֲלָתוֹ
  choice: అంటే ఆయన స్వాస్థ్యాన్ని
  rationale: 3వ పురుష ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుందో కొంత అస్పష్టత ఉంది. సమీపంలోని యెహోవాను సూచించే అవకాశాన్ని ప్రధాన పాఠం సహజంగా ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయ సామూహిక సూచనను పాదటిప్పణి కాపాడుతుంది.
- source_word: יֹאכֵלוּן
  choice: భుజిస్తారు
  rationale: చట్టపరమైన సందర్భంలో ఇది వారికి కల్పించిన నిరంతర ఏర్పాటును తెలియజేస్తుంది. ‘భుజిస్తారు’ గౌరవప్రదమైన, సహజమైన తెలుగు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని పేరుగానే నిలుపుతుంది; సాధారణ బిరుదుతో భర్తీ చేయదు.
- issue: וְנַחֲלָתוֹ లోని ఏకవచన ప్రత్యయ సూచన
  choice: ‘ఆయన’ను సమీప పూర్వపదమైన యెహోవాకు అన్వయించడం
  alternative: సామూహిక ఏకవచనంగా లేవి/లేవీయుని సూచించడం
  rationale: వ్యాకరణపరంగా రెండు అన్వయాలకూ అవకాశం ఉంది. సమీప సూచ్యమైన యెహోవాను ప్రధాన పాఠంలో తీసుకున్నా, ద్వితీయోపదేశకాండము 18:2 వెలుగులో లేవీయుని సూచించే పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: אִשֵּׁי יְהוָה మరియు וְנַחֲלָתוֹ మధ్య సంబంధం
  choice: వివరణాత్మకంగా ‘అంటే’
  alternative: సంయోజకంగా ‘మరియు’
  rationale: రెండవ పదబంధం మొదటిదాన్ని వివరిస్తుందనే సందర్భానుకూల పఠనాన్ని అనుసరిస్తుంది; అయినా హీబ్రూ וְ అక్షరార్థంగా ‘మరియు’ కావచ్చనే అంశాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలి వాడబడింది. ‘వంతు’, ‘స్వాస్థ్యం’, ‘గోత్రం’, ‘అర్పణ’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలాన్ని ఉంచి, మూలంలోని సమానాధికార నిర్మాణాన్ని దీర్ఘ గీతలతో స్పష్టం చేశాం.
