  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: te
  text: ఎందుకంటే నీ దేవుడైన యాహ్వే నీ గోత్రాలన్నిటిలోనుండి అతణ్ణి ఎన్నుకున్నాడు—అతడూ అతని కుమారులూ అన్ని రోజులు యాహ్వే నామంలో నిలబడి సేవ చేయునట్లు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎల్లకాలం.” హీబ్రూ పదబంధం అక్షరార్థంగా “అన్ని రోజులు” అని ఉంటుంది; ఇక్కడ అది నిరంతరంగా కొనసాగుతున్న యాజక సేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నియమానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בּוֹ בָּחַר
  choice: అతణ్ణి ఎన్నుకున్నాడు
  rationale: בחר క్రియతో వచ్చిన ב ఎంపిక చేయబడిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘అతణ్ణి ఎన్నుకున్నాడు’ సహజంగా, కచ్చితంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన యహ్వేను బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: నీ గోత్రాలన్నిటిలోనుండి
  rationale: ఇశ్రాయేలు గోత్రాల మధ్యనుండి జరిగిన ఎంపికను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: לַעֲמֹד
  choice: నిలబడి
  rationale: యాజక సేవతో ముడిపడిన నిలబడే భంగిమను కేవలం కార్యపరమైన భావంగా మార్చకుండా నిలుపుతుంది.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: సందర్భంలో ఇది దేవుని సన్నిధిలో చేసే యాజక సేవను సూచిస్తుంది; ‘సేవ చేయడం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: בְּשֵׁם יְהוָה
  choice: యాహ్వే నామంలో
  rationale: యాహ్వే అధికారాన్ని, ఆయనకు ప్రాతినిధ్యం వహించే సేవను సూచించే మూలభాషా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הוּא וּבָנָיו
  choice: అతడూ అతని కుమారులూ
  rationale: మూలంలోని పురుషలింగ బహువచనాన్ని, యాజక వారసత్వ సందర్భాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: כָּל הַיָּמִים
  choice: అన్ని రోజులూ
  rationale: హీబ్రూ పదబంధానికి దగ్గరగా ఉంటూనే నిరంతరంగా కొనసాగుతున్న సేవ అనే కాలార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఇస్తుంది.
- issue: యాజక వారసత్వంలోని లింగసూచక భాష
  choice: అతడూ అతని కుమారులూ
  alternative: అతడూ అతని సంతానమూ
  rationale: హీబ్రూ בָּנָיו ప్రత్యేకంగా ‘అతని కుమారులు’ అని చెబుతుంది; లేవీయ యాజక వారసత్వ సందర్భంలో దానిని లింగతటస్థంగా మార్చలేదు.
- issue: כָּל הַיָּמִים యొక్క కాలవ్యాప్తి
  choice: అన్ని రోజులూ
  alternative: ఎల్లకాలం
  rationale: మూలంలోని స్పష్టమైన ‘దినాలు’ రూపకాన్ని నిలుపుతూ, నిరంతర యాజక సేవ అనే భావాన్ని పాఠకుడు గ్రహించడానికి పాదసూచికను అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నిలబడి సేవ చేయడానికి’ అనే రూపం యాజక పరిచర్యలోని భంగిమను, కార్యాన్ని రెండింటినీ నిలుపుతుంది; వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టంచేయడానికి దీర్ఘ విరామచిహ్నం వాడాం.
