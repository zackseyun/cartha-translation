revisions:
- from: ఇలాంటి పనులు చేసే ప్రతి ఒక్కరూ యహ్వే దృష్టిలో అసహ్యులు. ఈ అసహ్యకార్యాల కారణంగానే నీ దేవుడైన యహ్వే వారిని నీ ఎదుటనుంచి వెళ్లగొడుతున్నాడు[a].
  to: ఎందుకంటే, ఈ పనులు చేసే ప్రతి ఒక్కరూ యహ్వేకు అసహ్యమైనవారు; ఈ అసహ్యకార్యాల కారణంగా నీ దేవుడైన యహ్వే వారిని నీ ముందునుండి వెళ్లగొడుతున్నాడు[a].
  rationale: కారణార్థక כִּיని ‘ఎందుకంటే’గా స్పష్టం చేశాం. వ్యక్తుల గురించిన תּוֹעֲבַת יְהוָהను సహజమైన కానీ బలమైన ‘యహ్వేకు అసహ్యమైనవారు’గా మార్చాం. ‘కారణంగానే’లో మూలంలో లేని ఉద్ఘాటనను తొలగించాం. పాదసూచిక ప్రత్యామ్నాయం హిఫిల్ ירש యొక్క ‘dispossess’ ఛాయను స్పష్టంగా తెలిపేలా సవరించబడింది.
