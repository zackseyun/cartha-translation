id: DEU.18.12
reference: Deuteronomy 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: te
  text: ఎందుకంటే, ఈ పనులు చేసే ప్రతి ఒక్కరూ యహ్వేకు అసహ్యమైనవారు; ఈ అసహ్యకార్యాల కారణంగా నీ దేవుడైన యహ్వే వారిని నీ ముందునుండి వెళ్లగొడుతున్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి భూమిని వారి స్వాధీనం నుండి తీసివేస్తున్నాడు’; హీబ్రూ క్రియ వారిని వెళ్లగొట్టడాన్ని మాత్రమే కాక, వారు ఆ దేశంపై తమ స్వాధీనాన్ని కోల్పోయేలా చేయడాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే అనే భావాన్ని సందర్భానుసారంగా ప్రత్యేక సంధానపదం లేకుండా కారణవివరణగా వ్యక్తీకరించడం
  rationale: ఈ వాక్యం ముందున్న నిషేధాలకు కారణాన్ని వివరిస్తుంది. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ఆ కారణసంబంధాన్ని వాక్యక్రమం ద్వారా స్పష్టంచేశాం.
- source_word: תוֹעֲבַת יְהוָה
  choice: యహ్వే దృష్టిలో అసహ్యులు
  rationale: ఈ నిర్మాణం యహ్వేకు అత్యంత హేయమైనవారనే బలమైన నైతిక భావాన్ని తెలియజేస్తుంది; ‘దృష్టిలో’ అనేది ఆయన అంచనాలో అనే సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన యహ్వేను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ఇలాంటి పనులు చేసే ప్రతి ఒక్కరూ
  rationale: పాల్గొనే ప్రతి వ్యక్తినీ మినహాయింపులేకుండా సూచించే హీబ్రూ సార్వత్రిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: וּבִגְלַל
  choice: కారణంగానే
  rationale: తరువాత చెప్పబడే తీర్పుకు ఈ ఆచారాలే కారణమని స్పష్టంచేసే కారణార్థాన్ని, ‘గానే’ ద్వారా ఉన్న ఉద్ఘాటనతో వ్యక్తం చేశాం.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: ఈ అసహ్యకార్యాలు
  rationale: ముందటి వచనాల్లో నిషేధించిన ఆచారాలను సూచిస్తూ, תועבה యొక్క తీవ్రమైన హేయత భావాన్ని నిలిపాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఇశ్రాయేలును ఏకవచనంలో నేరుగా సంబోధించే రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలిపాం.
- source_word: מוֹרִישׁ אֹתָם
  choice: వారిని వెళ్లగొడుతున్నాడు
  rationale: హిఫిల్ రూపం జనాలను దేశం నుంచి తొలగించడం లేదా వారి స్వాధీనాన్ని పోగొట్టడం అనే భావం కలిగి ఉంది. ప్రధాన పాఠ్యంలో సందర్భానికి సహజమైన ‘వెళ్లగొడుతున్నాడు’ వాడి, స్వాధీనం కోల్పోయే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుంచి
  rationale: అక్షరార్థంలోని ‘నీ ముఖసన్నిధి నుంచి’ అనే భావాన్ని, ఇశ్రాయేలు ముందునుంచి ఆ జనాలు తొలగించబడుతున్నారనే విజయసందర్భానికి సరిపోయే తెలుగులో అందించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- issue: תוֹעֲבַת יְהוָה వ్యక్తిని సూచిస్తుందా, కార్యాన్ని సూచిస్తుందా
  choice: ఆ పనులు చేసే వ్యక్తులే యహ్వే దృష్టిలో అసహ్యులు
  alternative: వారు చేసే పనులే యహ్వేకు అసహ్యమైనవి
  rationale: హీబ్రూ వాక్య నిర్మాణంలో ‘ఇవి చేసే ప్రతి ఒక్కరూ’ నేరుగా ‘యహ్వేకు అసహ్యం’ అని చెప్పబడుతున్నారు. ఆ కఠినమైన వ్యక్తిగత తీర్పును కార్యాలకే పరిమితం చేయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘అసహ్యులు/అసహ్యకార్యాలు’ ద్వారా మూలంలోని తీవ్రమైన నైతిక పదాన్ని నిలిపి, ‘వెళ్లగొడుతున్నాడు’ అనే సులభమైన ప్రధాన పఠనంతో పాటు భూస్వాధీనం కోల్పోయే భావాన్ని పాదసూచికలో సంరక్షించాం.
