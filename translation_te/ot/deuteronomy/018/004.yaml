    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew's repeated רֵאשִׁית ('first/initial portion') for both the produce and the fleece/shearing, retains the singular 'అతనికి,' and avoids restricting צֹאן to sheep. Both footnotes now state genuine lexical alternatives without adding a first-time-shearing implication.
