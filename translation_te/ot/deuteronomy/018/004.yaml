revisions:
- from: నీ ధాన్యంలో, నీ కొత్త ద్రాక్షారసంలో, నీ నూనెలో మొదటి భాగాన్ని[a], అలాగే నీ మంద గొర్రెల నుంచి మొదట కత్తిరించిన ఉన్నిని[b] అతనికి ఇవ్వాలి.
  to: నీ ధాన్యంలో, నీ కొత్త ద్రాక్షారసంలో, నీ నూనెలో మొదటి భాగాన్ని[a], అలాగే నీ మందలోని ఉన్నిలో మొదటి భాగాన్ని[b] అతనికి ఇవ్వాలి.
  rationale: The revision preserves the Hebrew's repeated רֵאשִׁית ('first/initial portion') for both the produce and the fleece/shearing, retains the singular 'అతనికి,' and avoids restricting צֹאן to sheep. Both footnotes now state genuine lexical alternatives without adding a first-time-shearing implication.
  reviewer_model: gpt-5.6-terra
