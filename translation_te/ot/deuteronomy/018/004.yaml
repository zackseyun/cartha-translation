source:
  edition: WLC
  text: רֵאשִׁ֨ית דְּגָֽנְ/ךָ֜ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ וְ/רֵאשִׁ֛ית גֵּ֥ז צֹאנְ/ךָ֖ תִּתֶּן לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: te
  text: నీ ధాన్యంలో, నీ కొత్త ద్రాక్షారసంలో, నీ నూనెలో మొదటి భాగాన్ని[a], అలాగే నీ మందలోని ఉన్నిలో మొదటి భాగాన్ని[b] అతనికి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ ధాన్యం, నీ కొత్త ద్రాక్షారసం, నీ నూనెలలోని మొదటి వాటాను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ మంద ఉన్ని కోతలో మొదటి భాగాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: మొదటి భాగం
  rationale: ఈ ఆరాధన సంబంధమైన కానుక సందర్భంలో ఈ పదం పంట లేదా ఉత్పత్తిలో మొదటిదైన భాగాన్ని సూచిస్తుంది. తెలుగులో ‘మొదటి భాగం’ మూలంలోని విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: דָּגָן
  choice: ధాన్యం
  rationale: ఈ పదం సాధారణంగా ధాన్యపు పంటలను సమష్టిగా సూచిస్తుంది; ‘ధాన్యం’ ఆధునిక తెలుగులో సహజమైన విస్తృత సమానార్థకం.
- source_word: תִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: ఈ పదం సాధారణ ద్రాక్షారసం కంటే తాజాగా ఉత్పత్తి చేసిన ద్రాక్షారసాన్ని తరచుగా సూచిస్తుంది. ‘కొత్త ద్రాక్షారసం’ ఆ భేదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִצְהָר
  choice: నూనె
  rationale: ఇశ్రాయేలు సందర్భంలో సాధారణంగా ఒలీవ నూనె ఉద్దేశించబడినా, హీబ్రూ పదాన్ని మించిన నిర్దిష్టతను చేర్చకుండా ‘నూనె’ అని అనువదించడం సముచితం.
- source_word: גֵּז
  choice: కత్తిరించిన ఉన్ని
  rationale: ఈ పదం కత్తిరించే క్రియను లేదా కత్తిరించిన ఉన్నిని సూచించవచ్చు. ఇక్కడ ఇవ్వబడే కానుక అనే సందర్భంలో ‘కత్తిరించిన ఉన్ని’ సహజమైన స్పష్టతనిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: צֹאן
  choice: మంద గొర్రెలు
  rationale: צֹאן చిన్న పశువుల మందను, ముఖ్యంగా గొర్రెలు మరియు మేకలను సూచించగలదు. ఉన్ని కత్తిరింపు సందర్భం గొర్రెలను ముందుకు తెస్తుంది; ‘మంద గొర్రెలు’ సామూహిక భావాన్ని తెలియజేస్తుంది.
- source_word: תִּתֶּן לוֹ
  choice: అతనికి ఇవ్వాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం న్యాయపరమైన ఆదేశంగా పనిచేస్తుంది. ‘ఇవ్వాలి’ ఆధునిక తెలుగులో ఆ నిర్దేశక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לוֹ (‘అతనికి’) అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ఏకవచన రూపాన్ని నిలుపుతూ ‘అతనికి’ అని అనువదించాం
  alternative: సందర్భాన్ని బట్టి ‘యాజకునికి’ అని స్పష్టీకరించడం లేదా యాజక వర్గాన్ని సమష్టిగా అర్థం చేసుకోవడం
  rationale: హీబ్రూలో సర్వనామం ఏకవచనంలో ఉంది; తక్షణ సందర్భంలో అది యాజక స్వీకర్తను సూచిస్తుంది. అయితే వచనంలో లేని నామవాచకాన్ని చేర్చకుండా ‘అతనికి’ అనడం వ్యాకరణ రూపాన్నీ సందర్భంలోని స్వల్ప అనిశ్చితినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయనిర్దేశ శైలిని ఉపయోగించాం. మూలంలోని జాబితా నిర్మాణాన్ని సాధ్యమైనంత వరకు నిలుపుతూ, తెలుగులో సహజత్వం కోసం విభక్తులను పునరావృతం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
