source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: te
  text: నా పేరున అతడు పలికే నా మాటలను వినని మనిషి నుండి నేనే లెక్క అడుగుతాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో మాటకు మాటగా, “నేనే అతని నుండి దానిని కోరుతాను.” అంటే, ప్రవక్త పలికిన దేవుని మాటలను విననివాణ్ణి దేవుడు జవాబుదారునిగా చేస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ప్రత్యేక సంధిపదం లేకుండా ఫలిత వాక్యంగా అనువదించడం
  rationale: ఇది ముందటి వాగ్దానానికి సంబంధించిన పరిణామాన్ని పరిచయం చేస్తుంది. తెలుగులో నేరుగా వాక్యాన్ని ప్రారంభించడం సహజంగా ఉండి, భావసంబంధాన్ని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: הָאִישׁ
  choice: మనిషిని
  rationale: హీబ్రూ ఏకవచన పుంలింగ రూపాన్ని, దాని ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: לֹא יִשְׁמַע אֶל
  choice: వినని
  rationale: ఇది కేవలం శబ్దం వినడమే కాక శ్రద్ధగా విని స్పందించాలనే భావాన్నీ కలిగి ఉంది; ‘వినని’ ఆ రెండు సాధ్యతలనూ తెరిచి ఉంచుతుంది.
- source_word: דְּבָרַי
  choice: నా మాటలను
  rationale: మూలంలోని బహువచనాన్నీ, దేవుని ప్రత్యక్ష వాక్కునూ యథాతథంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: అతడు పలికే
  rationale: సందర్భంలోని ప్రవక్తను సూచిస్తూ, తెలుగులో సహజమైన సాధారణ వర్తమాన సంబంధ వాక్యాన్ని ఇస్తుంది.
- source_word: בִּשְׁמִי
  choice: నా పేరున
  rationale: దైవిక అధికారంతో ప్రతినిధిగా పలకడం అనే హీబ్రూ నుడికారపు భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: లెక్క అడుగుతాను
  rationale: ఈ సందర్భంలో ఉన్న జవాబుదారీతనం, న్యాయతీర్పు భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; శిక్ష యొక్క నిర్దిష్ట రూపాన్ని మాత్రం చేర్చదు.
theological_decisions:
- issue: ప్రవక్త ద్వారా పలికిన దేవుని మాటలను తిరస్కరించినవారికి దేవుని ప్రతిస్పందన స్వరూపం
  choice: నేనే లెక్క అడుగుతాను
  alternative: నేనే అతని నుండి దానిని కోరుతాను
  rationale: హీబ్రూ దేవుడు ఆ వ్యక్తిని జవాబుదారునిగా చేస్తాడని చెబుతుంది గాని శిక్ష ఏ రూపంలో ఉంటుందో నిర్దిష్టంగా చెప్పదు. ఎంపిక చేసిన అనువాదం ఆ గంభీర హెచ్చరికను నిలుపుతూ అదనపు సిద్ధాంత వివరాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘నా పేరున,’ ‘నేనే’ అనే రూపాలు దైవిక అధికారాన్నీ ఉద్ఘాటననూ నిలుపుతాయి; ‘లెక్క అడుగుతాను’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి న్యాయపరమైన భావాన్ని తెలియజేస్తుంది.
