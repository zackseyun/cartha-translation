source:
  edition: WLC
  text: נָבִ֨יא מִ/קִּרְבְּ/ךָ֤ מֵ/אַחֶ֨י/ךָ֙ כָּמֹ֔/נִי יָקִ֥ים לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֵלָ֖י/ו תִּשְׁמָעֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా నీ మధ్య నుండి, నీ సహోదరులలో నుండి, నా వంటి ఒక ప్రవక్తను నీ కోసం లేపుతాడు; అతని మాట మీరు వినాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ప్రజల మధ్య నుండి, నీ తోటి ఇశ్రాయేలీయులలో నుండి.” ఇక్కడ “సహోదరులు” అనే హీబ్రూ పుంలింగ బంధుత్వ పదం సాధారణంగా ఇశ్రాయేలు సమాజ సభ్యులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: నూతన నిబంధనలో ఈ వాక్యం మెస్సీయకు అన్వయించబడింది; అయితే ఇక్కడి హీబ్రూ పాఠ్యం నేరుగా “నా వంటి ఒక ప్రవక్త” అని మాత్రమే చెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: ఒక ప్రవక్తను
  rationale: హీబ్రూలో అనిర్దిష్ట ఏకవచనం ఉంది. దేవుని తరఫున మాట్లాడే వ్యక్తిని సూచించే ‘ప్రవక్త’ అనే సహజమైన పదం మూలంలోని ఏకవచనాన్ని, నిర్దిష్టత లేకపోవడాన్ని కాపాడుతుంది.
- source_word: מִקִּרְבְּךָ
  choice: నీ మధ్య నుండి
  rationale: అక్షరార్థంగా ‘నీ మధ్య నుండి.’ ప్రవక్త ఇశ్రాయేలు సమాజం లోపలి నుండే ఉద్భవిస్తాడనే భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: מֵאַחֶיךָ
  choice: నీ సహోదరులలో నుండి
  rationale: హీబ్రూ పదం పుంలింగ బహువచన బంధుత్వ పదం; ద్వితీయోపదేశకాండ సందర్భంలో ఇది తోటి ఇశ్రాయేలీయులను సూచిస్తుంది. మూల రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత సామూహిక భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: כָּמֹנִי
  choice: నా వంటి
  rationale: మోషేతో నేరుగా చేస్తున్న పోలికను సహజమైన, సంక్షిప్తమైన తెలుగులో కాపాడుతుంది.
- source_word: יָקִים לְךָ
  choice: నీ కోసం లేపుతాడు
  rationale: קום హిఫిల్ రూపం ఇక్కడ ఒకరిని ఉద్భవింపజేయడం లేదా నియమించడం అనే భావం ఇస్తుంది. ‘లేపుతాడు’ క్రియాచిత్రాన్ని, ‘నీ కోసం’ לְךָ యొక్క ప్రయోజనార్థాన్ని నిలుపుతాయి.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామం יהוה ను ‘యెహోవా’గా ప్రత్యక్షంగా అందించి, ఒడంబడిక సంబంధాన్ని తెలిపే మొత్తం పదబంధాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: אֵלָיו
  choice: అతని మాట
  rationale: అక్షరార్థంగా ‘అతని వైపు/అతనికి.’ తెలుగులో ‘అతని మాట వినాలి’ అనడం సహజంగా ఉండి, ప్రవక్త చెప్పేది ఆలకించి పాటించాలనే సందర్భార్థాన్ని అతిగా విస్తరించకుండా వ్యక్తం చేస్తుంది.
- source_word: תִּשְׁמָעוּן
  choice: మీరు వినాలి
  rationale: שׁמע కు వినడం, ఆలకించడం, విధేయత చూపడం అనే భావపరిధి ఉంది. ఇక్కడ ‘వినాలి’ ఆజ్ఞాత్మక బలాన్ని కాపాడుతూ ‘విధేయులవ్వాలి’ అని అర్థాన్ని పూర్తిగా ముందే నిర్ణయించదు. ఏకవచన సందర్భం నుంచి సమూహ బహువచనానికి జరిగిన హీబ్రూ మార్పును ‘నీ/మీరు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: ‘నా వంటి ఒక ప్రవక్త’కు సంభావ్య మెస్సీయ సంబంధిత నిర్దిష్టత
  choice: ప్రధాన పాఠ్యంలో మూలంలోని అనిర్దిష్ట ఏకవచనమైన ‘నా వంటి ఒక ప్రవక్త’ను నిలుపడం
  alternative: ‘ఆ ప్రవక్త’ లేదా ‘మెస్సీయ ప్రవక్త’ అని స్పష్టంగా నిర్దిష్టీకరించడం; లేక దీనిని కేవలం ప్రవక్తల వ్యవస్థకు సంబంధించిన సమూహార్థంగా చేయడం
  rationale: హీబ్రూ వాక్యం స్వయంగా మెస్సీయ అనే బిరుదును చేర్చదు; అదే సమయంలో ఏకవచనాన్ని కూడా చెరపదు. అందువల్ల తక్షణ పాఠ్యార్థాన్ని ప్రధాన వచనంలో నిలిపి, తరువాతి నూతన నిబంధన అన్వయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: אָח (‘సహోదరులు’) అనే పుంలింగ బంధుత్వ పదానికి ప్రతినిధి సామూహిక భావం
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’ అని ఉంచి పాదసూచికలో తోటి ఇశ్రాయేలీయులనే సందర్భార్థాన్ని వివరించడం
  alternative: ‘తోటి ఇశ్రాయేలీయులు,’ ‘స్వజనులు,’ లేదా ‘సహోదర సహోదరీలు’ అని ప్రధాన పాఠ్యంలో విపులీకరించడం
  rationale: ‘సహోదరులు’ మూలంలోని పుంలింగ బహువచన బంధుత్వ రూపాన్ని కాపాడుతుంది; పాదసూచిక దాని ప్రతినిధి సామూహిక ప్రయోగాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘నీ’ నుంచి ‘మీరు’కు మార్పు హీబ్రూ మూలంలోని ఏకవచన సంభోదన నుంచి బహువచన ఆజ్ఞకు జరిగిన మార్పును ఉద్దేశపూర్వకంగా ప్రతిబింబిస్తుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
