  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: te
  text: అప్పుడు యాహ్వే నాతో, “వారు చెప్పింది మంచిదే” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “వారు చెప్పినదాన్ని వారు బాగా చేశారు.”'
    reason: మూలంలోని הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ నిర్మాణాన్ని మరింత అక్షరార్థంగా చూపించడానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వయిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు ... అన్నాడు’ సహజంగా కథన క్రమాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֵלָי
  choice: నాతో
  rationale: אֶל + ప్రథమ పురుష ఏకవచన ప్రత్యయం ‘నాతో/నాకు’ అని అర్థం; ‘అన్నాడు’తో ‘నాతో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: వారు చెప్పింది మంచిదే
  rationale: అక్షరార్థంగా ‘వారు చెప్పినదానిలో వారు బాగా చేశారు’ అనే భావం. ఇక్కడ הֵיטִיבוּ వారు పలికిన మాటను అనుకూలంగా అంచనా వేస్తుంది; ‘వారు చెప్పింది మంచిదే’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: דִּבֵּרוּ
  choice: చెప్పింది
  rationale: דבר యొక్క పియేల్ సంపూర్ణ రూపం పూర్తయిన మాటల చర్యను సూచిస్తుంది; సందర్భంలో ‘చెప్పింది’ సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి. మూలంలోని ప్రశంసాత్మక భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుకుంది.
