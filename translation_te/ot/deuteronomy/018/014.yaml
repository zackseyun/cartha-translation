source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: te
  text: ఎందుకంటే నీవు స్వాధీనం చేసుకుంటున్న ఈ జనాంగాలు[a] శకునాలు చూసేవారినీ[b], సోదె చెప్పేవారినీ ఆలకిస్తారు. కానీ నీ విషయానికి వస్తే, నీ దేవుడైన యాహ్వే నీకు అలా ఇవ్వలేదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిని తొలగించి వారి దేశాన్ని స్వాధీనం చేసుకుంటున్న’ లేదా ‘వారిపై స్వాధీనం పొందుతున్న’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియలో స్వాధీనం చేసుకోవడం, ముందున్న నివాసులను తొలగించడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘శకునాలు చూసేవారు’ అనే మాట శకునాలను లేదా సూచనలను గమనించి వాటి ఆధారంగా చెప్పేవారిని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, ‘కాని నీవు—అలా కాదు—నీ దేవుడైన యాహ్వే నీకు ఇచ్చాడు’ అని ఉంది. క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు; సందర్భం ప్రకారం అలాంటి ఆచారాలనే సూచిస్తున్నట్లు అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధాలకు ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్నందున సహజమైన తెలుగు అనుసంధాన పదాన్ని వాడాం.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలు
  rationale: ఇక్కడ గోయిమ్ అనేది ఇశ్రాయేలీయులు కాని దేశప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘జనాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: నువ్వు స్వాధీనం చేసుకుంటున్న
  rationale: యారష్ అనే క్రియలో స్వాధీనం చేసుకోవడం, దానివల్ల ముందున్న నివాసులను తొలగించడం—రెండు భావాలూ ఉండగలవు. ప్రధాన పాఠ్యంలో మొదటి భావాన్ని ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: מְעֹנְנִים
  choice: శకునాలు చూసేవారు
  rationale: ఈ పదం శకునాలు లేదా సూచనలను గమనించి ఫలితం చెప్పే ఆచారకర్తలను సూచిస్తుంది; ఒక నిర్దిష్ట పద్ధతిని అనవసరంగా ఖరారు చేయకుండా అర్థాన్ని అందిస్తుంది.
- source_word: קֹסְמִים
  choice: సోదె చెప్పేవారు
  rationale: కెసెమ్ అనే దైవజ్ఞాన ప్రక్రియను ఆచరించేవారిని సాధారణ పాఠకులకు అర్థమయ్యే ప్రస్తుత తెలుగు పదబంధంతో తెలిపాం.
- source_word: יִשְׁמָעוּ
  choice: మాటలను వింటారు
  rationale: షామా యొక్క ‘వినడం’ అనే మూలార్థాన్ని నిలుపుతూ, ఇక్కడ వారి సూచనలను ఆలకించడం అనే సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאַתָּה לֹא כֵן נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: అయితే నీకు మాత్రం, నీ దేవుడైన యెహోవా ఇలా చేయడానికి అనుమతి ఇవ్వలేదు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘కాని నువ్వు—అలా కాదు—నీ దేవుడైన యెహోవా నీకు ఇచ్చాడు’ అనే సంక్షిప్త నిర్మాణంలో ఉంది. తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు సందర్భంలో సూచితమైన కార్యాన్ని ‘ఇలా చేయడానికి’ అని పూరించాం; ‘ఇవ్వలేదు’ భావాన్ని ‘అనుమతి ఇవ్వలేదు’లో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ప్రత్యక్ష లిప్యంతరీకరణతో అందించాం.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక ఒడంబడిక దైవనామం నేరుగా ఉంది; అందువల్ల దానిని పేరుగానే ఉంచాం.
- issue: ‘ఇచ్చాడు’ అనే క్రియకు స్పష్టంగా చెప్పని కర్మ
  choice: ఇలా చేయడానికి అనుమతి ఇవ్వలేదు
  alternative: నీకు అలా ఇవ్వలేదు
  rationale: మూలం కర్మను స్పష్టంగా చెప్పదు. తెలుగు వాక్యాన్ని సహజంగా చేయడానికి సందర్భం సూచించే ఆచారాలను మాత్రమే పూరించాం; ఈ పూరణను పాదసూచికలో వెల్లడించి మూలంలోని సంక్షిప్తతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించాం. సందర్భంలోని మోషే-ఇశ్రాయేలు ఏకవచన సంబోధనను నిలుపుతూ ‘నువ్వు/నీకు’ వాడాం. గూఢాచారాలకు సంబంధించిన రెండు హీబ్రూ పదాల భేదాన్ని ‘శకునాలు చూసేవారు’ మరియు ‘సోదె చెప్పేవారు’గా నిలిపాం.
