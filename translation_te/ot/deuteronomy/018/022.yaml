language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: te
  text: ప్రవక్త యహ్వే[a] పేరుతో చెప్పే మాట[b] జరగక, నెరవేరకపోతే, అది యహ్వే చెప్పని మాట. ప్రవక్త దానిని దుస్సాహసంగా[c] చెప్పాడు; నీవు అతనికి భయపడవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే’ అనేది హీబ్రూ దైవనామమైన יהוה (YHWH) యొక్క లిప్యంతరీకరణ.
    reason: divine_name
  - marker: b
    text: ‘మాట’కు మూలమైన హీబ్రూ דָּבָר పదం పలికిన సందేశాన్నీ, అది సూచించే విషయం లేదా సంఘటననూ సూచించగలదు.
    reason: lexical_ambiguity
  - marker: c
    text: ‘దుస్సాహసంగా’ అంటే యహ్వే అధికారం ఇవ్వకపోయినా అహంకారపూర్వకంగా, ఉద్దేశపూర్వకంగా తెగించి చెప్పడం.
    reason: lexical_cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יְדַבֵּר הַנָּבִיא
  choice: ప్రవక్త ... చెప్పిన
  rationale: ధర్మశాస్త్ర సంబంధమైన సాధారణ పరిస్థితిని సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది; హీబ్రూలోని నిర్దిష్ట విభక్తి ఇక్కడ ప్రతినిధి వ్యక్తిని సూచిస్తుంది కాబట్టి తెలుగులో అదనంగా ‘ఆ’ చేర్చలేదు.
- source_word: בְּשֵׁם יְהוָה
  choice: యెహోవా పేరుతో
  rationale: దైవిక అధికారాన్ని తనకు ఉన్నదని ప్రకటిస్తూ మాట్లాడే భావాన్ని సహజంగా నిలుపుతుంది; יְהוָה అనే వ్యక్తినామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: ప్రవక్త పలికిన సందేశాన్ని తెలుగులో సహజంగా సూచిస్తుంది. అదే హీబ్రూ పదం ముందుగా పలికిన విషయం, తరువాత అది సూచించిన సంఘటన అనే రెండింటినీ కలుపగలదనే అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
- source_word: וְלֹא יִהְיֶה הַדָּבָר וְלֹא יָבוֹא
  choice: ఆ మాట జరగక, నెరవేరకపోతే
  rationale: రెండు హీబ్రూ క్రియల సమాంతర బలాన్ని నిలుపుతూ, ప్రవచించినది వాస్తవం కాకపోవడం మరియు నెరవేరకపోవడం అనే భావాలను ప్రస్తుత తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: הוּא הַדָּבָר אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: అది యెహోవా చెప్పని మాట
  rationale: הוּא ఇచ్చే గుర్తింపు-ఉద్ఘాటనను ‘అది’తో నిలిపి, ముందున్న ‘మాట’తో పదసంబంధాన్ని కొనసాగిస్తుంది.
- source_word: בְּזָדוֹן דִּבְּרוֹ הַנָּבִיא
  choice: ప్రవక్త దానిని దుస్సాహసంతో చెప్పాడు
  rationale: అధికారం లేకున్నా ఉద్దేశపూర్వకంగా తెగించి పలికే అహంకారపూరిత ధోరణిని ‘దుస్సాహసంతో’ సంక్షిప్తంగా తెలియజేస్తుంది; దానిని కేవలం పొరపాటుగా మృదుపరచదు.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: నీవు అతనికి భయపడవద్దు
  rationale: ఏకవచన ఆజ్ఞను, ఆ ప్రవక్తవల్ల భయపడకూడదనే నేరుగా ఉన్న నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం ద్వారా దాని నామస్వరూపాన్ని నిలుపుతుంది.
- issue: ప్రవచనాన్ని పరీక్షించే నియమం యొక్క పరిధి
  choice: ఈ వాక్యంలో చెప్పిన నెరవేర్పు-పరీక్షకే అనువాదాన్ని పరిమితం చేయడం
  alternative: ప్రవచన పరిచర్య అంతటికీ సంబంధించిన విస్తృత సిద్ధాంతాన్ని వాక్యంలో చేర్చడం
  rationale: వాక్యం స్పష్టంగా చెప్పేది—యెహోవా పేరుతో పలికినది జరగకపోతే అది ఆయన పలికినది కాదని—అంతవరకే అనువాదం ఉంటుంది; ఇతర సందర్భాలు లేదా సిద్ధాంతపరమైన మినహాయింపులు చేర్చబడలేదు.
- issue: בְּזָדוֹן యొక్క నైతిక తీవ్రత
  choice: దుస్సాహసంతో
  alternative: పొరపాటుగా
  rationale: మూలపదం అనధికారంగా, అహంకారపూర్వకంగా తెగించి చేయడాన్ని సూచిస్తుంది; అందువల్ల దీనిని అనుద్దేశిత తప్పుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతను నిలిపింది. ‘మాట’ అనే పదాన్ని పునరావృతం చేయడం ద్వారా హీబ్రూ דָּבָר యొక్క అంతర్గత అనుసంధానాన్ని కాపాడింది.
