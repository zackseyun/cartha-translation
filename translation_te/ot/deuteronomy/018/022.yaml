revisions:
- from: ప్రవక్త యెహోవా[a] పేరుతో చెప్పిన మాట[b] జరగక, నెరవేరకపోతే, అది యెహోవా చెప్పని మాట. ప్రవక్త దానిని దుస్సాహసంతో[c] చెప్పాడు; నీవు అతనికి భయపడవద్దు.
  to: ప్రవక్త యహ్వే[a] పేరుతో చెప్పే మాట[b] జరగక, నెరవేరకపోతే, అది యహ్వే చెప్పని మాట. ప్రవక్త దానిని దుస్సాహసంగా[c] చెప్పాడు; నీవు అతనికి భయపడవద్దు.
  rationale: The revision aligns the divine-name rendering with the project’s ‘Yahweh’ decision and corrects the associated transliteration note. It also makes the conditional, representative force of the opening clause more explicit and uses a slightly more idiomatic Telugu adverb, without adding interpretation or changing the verse’s meaning.
