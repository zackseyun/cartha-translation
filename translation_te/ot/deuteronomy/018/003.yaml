  - severity: low
    issue: '"రెండు దవడలు" makes a secondary interpretation primary for הַלְּחָיַיִם.'
    rationale: The basic sense is cheeks (dual). Jawbones is a viable alternative and should be retained in the note rather than selected as the unqualified main rendering.
