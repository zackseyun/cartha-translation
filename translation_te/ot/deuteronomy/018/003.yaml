  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: te
  text: 'యాజకులకు ప్రజల నుండి రావలసిన నియమిత భాగం ఇదే: ఎద్దునైనా గొర్రెనైనా బలిగా అర్పించేవాడు యాజకునికి ముందరి భుజభాగం[a], రెండు చెంపలు[b], కడుపు[c] ఇవ్వాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః ‘బాహువు’; ఇక్కడ జంతువు ముందరి కాలు లేదా భుజభాగం ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: ‘రెండు దవడలు’ లేదా ‘రెండు దవడ ఎముకలు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం ద్వివచనంలో ఉంది.
    reason: lexical_alternative
  - marker: c
    text: సంప్రదాయ అనువాదాల్లో ‘మావు’ అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: హక్కైన భాగం
  rationale: ఈ ఆరాధనసంబంధమైన న్యాయ సందర్భంలో ఇది సాధారణ ‘తీర్పు’ను కాక, యాజకులకు నియమానుసారం రావలసిన వాటాను సూచిస్తుంది.
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: ప్రజల నుండి—బలిగా అర్పించే వ్యక్తి
  rationale: ప్రజలలో బలి అర్పించేవారే ఈ భాగాన్ని ఇవ్వాల్సినవారని వాక్య నిర్మాణం సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు హెబ్రీ మూలంలోని ఒకే ధాతువు పునరుక్తిని యథాతథంగా నకలు చేయలేదు.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: ఎద్దునైనా గొర్రెనైనా
  rationale: రెండు ప్రత్యామ్నాయ బలిజంతువులను సూచించే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు జంట నిర్మాణంతో తెలిపింది.
- source_word: וְנָתַן
  choice: ఇవ్వాలి
  rationale: హెబ్రీ ఏకవచనం ప్రతి బలి అర్పించే వ్యక్తికి వర్తించే నియమార్థక రూపం; తెలుగు ‘ఇవ్వాలి’ ఆ న్యాయబద్ధ బాధ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַזְּרֹעַ
  choice: ముందు కాలు
  rationale: పదశః ‘బాహువు’; జంతువు శరీరభాగం సందర్భంలో ముందు కాలు లేదా భుజభాగాన్ని సూచిస్తుంది. ‘ముందు కాలు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: הַלְּחָיַיִם
  choice: రెండు దవడలు
  rationale: హెబ్రీ పదం ద్వివచన రూపంలో ఉంది; ‘రెండు’ అని స్పష్టంగా చూపించి, చెంపలు/దవడ ఎముకలు అనే అర్థసంభావ్యతలో జంతువు భాగానికి తగిన ‘దవడలు’ ఎంచుకుంది.
- source_word: הַקֵּבָה
  choice: కడుపు
  rationale: జంతువు కడుపు భాగాన్ని సూచించే పదం. సంప్రదాయ లేదా అతిసాంకేతిక పదం కంటే ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే రూపం.
