  naturalness: The legal-register Telugu is clear and modern. The revised wording keeps the sentence compact while making the anatomical terms more idiomatic and appropriately qualified.
  terminology: '"నియమిత భాగం" accurately reflects מִשְׁפָּט as a prescribed due. "ముందరి భుజభాగం" preserves the contextual sense of זְרֹעַ without reducing it simply to the whole front leg. "రెండు చెంపలు" follows the primary sense of לְחָיַיִם and retains the dual explicitly; the jawbone reading is retained in a footnote.'
  issues:
  - severity: medium
    issue: '"ముందు కాలు" is overly specific for הַזְּרֹעַ.'
