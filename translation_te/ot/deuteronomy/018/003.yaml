  to: 'యాజకులకు ప్రజల నుండి రావలసిన నియమిత భాగం ఇదే: ఎద్దునైనా గొర్రెనైనా బలిగా అర్పించేవాడు యాజకునికి ముందరి భుజభాగం[a], రెండు చెంపలు[b], కడుపు[c] ఇవ్వాలి.'
