  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయనియమ స్వరాన్ని నిలుపుకుంటూ సాధారణ పాఠకునికి స్పష్టంగా రూపొందించబడింది. మూలంలోని అర్థసందిగ్ధ శరీరభాగాలకు పాదసూచికలు ఇచ్చి ప్రత్యామ్నాయాలను నిలిపింది.
