source:
  edition: WLC
  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: te
  text: నీవు నీ హృదయంలో, “యాహ్వే పలకని మాటను మనం ఎలా తెలుసుకోగలం?” అని అనుకుంటే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మాట’ అనే హీబ్రూ పదానికి ‘విషయం’ లేదా ‘సందేశం’ అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ ప్రవచన సందర్భంలో ‘మాట’ సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תֹאמַר בִּלְבָבֶךָ
  choice: నీవు నీ హృదయంలో ... అని అనుకుంటే
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నీ హృదయంలో చెబితే’ అని ఉన్నప్పటికీ, అంతరంగ ఆలోచనను సూచిస్తుంది. ‘నీ హృదయంలో ... అని అనుకుంటే’ మూలంలోని హృదయ రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֵיכָה נֵדַע
  choice: మనం ఎలా తెలుసుకోగలం?
  rationale: אֵיכָה విధానాన్ని ప్రశ్నిస్తుంది; ידע సాధారణంగా ‘తెలుసుకోవడం’ అని అర్థం. ‘ఎలా తెలుసుకోగలం?’ ఇక్కడి విచారణాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: ప్రవచన సందర్భంలో דָּבָר పలికిన వాక్కు లేదా సందేశాన్ని సూచిస్తుంది. తెలుగు ‘మాట’ ఈ సందర్భానికి సంక్షిప్తంగా, సహజంగా సరిపోతుంది; ‘విషయం’ లేదా ‘సందేశం’ కూడా సాధ్యమైన అర్థాలు.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: పలకని
  rationale: సాపేక్ష ఉపవాక్యం ‘మాట’ను విశేషిస్తుంది. తెలుగు కృదంత రూపం మూల భావాన్ని స్పష్టంగా, సహజంగా ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తించబడే దైవనామ రూపం; ఇది బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను సూచించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: ప్రశ్నలోని భావం—యెహోవా పలికిన మాటనా, పలకని మాటనా
  choice: యెహోవా పలకని మాట ఏదో మనం ఎలా తెలుసుకోగలం?
  alternative: యెహోవా పలకని మాటను మనం ఎలా గుర్తించగలం?
  rationale: మూలంలోని నిషేధాన్ని యథాతథంగా ఉంచి, తదుపరి వచనం ఇచ్చే పరీక్షను ముందుగానే వివరణగా చేర్చలేదు. ‘తెలుసుకోగలం’ ידע యొక్క సాధారణ అర్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఏకవచన ‘నీవు’ ద్వారా ఇశ్రాయేలుతో ఉన్న ప్రత్యక్ష సంబోధనను, ‘మనం’ ద్వారా మూలంలోని ప్రథమ పురుష బహువచన ప్రశ్నను నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
