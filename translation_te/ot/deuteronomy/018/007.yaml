id: DEU.18.7
reference: Deuteronomy 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: te
  text: అప్పుడు అతడు తన దేవుడైన యాహ్వే[c] నామంలో పరిచర్య చేయవచ్చు[a]—అక్కడ యాహ్వే సన్నిధిలో నిలిచే తన సహోదరులైన[b] లేవీయులందరిలాగే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిచర్య చేయాలి” లేదా “పరిచర్య చేస్తాడు.” హెబ్రీ అసంపూర్ణ క్రియారూపం ఈ న్యాయసందర్భంలో అనుమతి భావాన్నిగానీ, మరింత ప్రత్యక్షమైన విధి లేదా భవిష్యదర్థాన్నిగానీ తెలియజేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో “తన సహోదరులు”; అంటే, తన తోటి లేవీయులు.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో YHWH అనే దైవనామం; దీనిని సంప్రదాయంగా “యెహోవా” లేదా “ప్రభువు” అని కూడా అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: అప్పుడు అతడు … పరిచర్య చేయవచ్చు
  rationale: שׁרת అనే క్రియ యొక్క పియేల్ రూపం ఇక్కడ ఆరాధనాసంబంధమైన లేవీయ పరిచర్యను సూచిస్తుంది. ముందటి వచనంలోని న్యాయపరమైన అనుమతిని కొనసాగిస్తున్నందున ‘చేయవచ్చు’ అని అనువదించాం; హెబ్రీ అసంపూర్ణ క్రియారూపంలోని విధ్యర్థక/భవిష్యదర్థక అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: בְּשֵׁם
  choice: నామంలో
  rationale: ఒకరి నామాధికారంతో లేదా ఆ నామాన్ని ధరించి కార్యం చేయడాన్ని సూచించే హెబ్రీ నుడికారానికి ఇది సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: తన సహోదరులైన లేవీయులందరిలాగే
  rationale: כְּ యొక్క పోలిక భావాన్ని ‘లాగే’తో, כָּל భావాన్ని ‘అందరు’తో, אֶחָיו అనే పురుష బహువచన బంధుత్వ పదాన్ని ‘సహోదరులు’తో నిలిపాం; ‘లేవీయులు’ అనే అనువర్తి పదం దాని సూచ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: הָעֹמְדִים שָׁם לִפְנֵי יְהוָה
  choice: అక్కడ యాహ్వే సన్నిధిలో నిలిచే
  rationale: עמד యొక్క మూలార్థమైన ‘నిలుచు’ను కాపాడుతూ, לִפְנֵי అనే దేవుని సమక్షాన్ని సూచించే ప్రయోగాన్ని సహజంగా ‘సన్నిధిలో’ అని ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ధ్వన్యంతరీకరించాం; సంప్రదాయ రూపాన్ని పాదసూచికలో తెలిపాం.
- issue: וְשֵׁרֵת క్రియ యొక్క విధ్యర్థక లేదా భవిష్యదర్థక బలం
  choice: పరిచర్య చేయవచ్చు
  alternative: పరిచర్య చేయాలి / పరిచర్య చేస్తాడు
  rationale: మునుపటి వచనంలో లేవీయుడు కేంద్ర పరిశుద్ధస్థలానికి వచ్చి సేవ చేయడానికి పొందే హక్కును ఈ వాక్యం కొనసాగిస్తుంది. కాబట్టి అనుమతి భావం సందర్భానికి సరిపోతుంది; అయితే హెబ్రీ అసంపూర్ణ క్రియారూపం మరింత ప్రత్యక్షమైన భావాన్నీ అనుమతిస్తుందని పాదసూచికలో పేర్కొన్నాం.
- issue: אֶחָיו అనే లింగసూచక బంధుత్వ పదం
  choice: తన సహోదరులు
  alternative: తన తోటి లేవీయులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ రూపాన్ని నిలిపాం. వెంటనే వచ్చే ‘లేవీయులు’ అనే పదం ఎవరిని సూచిస్తుందో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పరిచర్య’ ఆరాధనాసంబంధమైన లేవీయ సేవను సూచిస్తుంది; ‘సన్నిధిలో నిలిచే’ అనే రూపం మూలంలోని దృశ్యరూపాన్నీ ఆరాధనా సందర్భాన్నీ నిలుపుతుంది.
