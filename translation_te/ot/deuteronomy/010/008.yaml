source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: te
  text: ఆ సమయంలో యాహ్వే లేవి గోత్రాన్ని యాహ్వే నిబంధన మందసాన్ని మోయడానికి, యాహ్వే సన్నిధిలో నిలబడి ఆయనకు పరిచర్య చేయడానికి, ఆయన నామంలో దీవెన పలకడానికి ప్రత్యేకంగా నియమించాడు—నేటి వరకూ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “నేటి వరకూ” అనే పదబంధం ముందున్న నియామకానికైనా, చివర పేర్కొన్న విధికైనా, లేదా పేర్కొన్న సేవా విధులన్నిటికైనా సంబంధించి ఉండవచ్చు.
    reason: ముగింపు కాలసూచక పదబంధం యొక్క వ్యాకరణ సంబంధంలో ఉన్న మూల అస్పష్టతను నిలుపుతుంది.
lexical_decisions:
- source_word: הִבְדִּיל
  choice: ప్రత్యేకించాడు
  rationale: ఒక నిర్దిష్టమైన పవిత్ర సేవ కోసం వేరుగా నియమించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: లేవి గోత్రం
  rationale: మూలంలోని గోత్రనామాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: לָשֵׂאת
  choice: మోయడానికి
  rationale: మందసాన్ని ఒక ప్రదేశం నుండి మరొక ప్రదేశానికి తీసుకువెళ్లే లేవీయుల బాధ్యతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ సంబంధ పదబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ ‘నిబంధన’ అనే ముఖ్య భావాన్ని నిలుపుతుంది.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో నిలబడడానికి
  rationale: యాజక సంబంధ సేవా సందర్భంలోని హీబ్రూ నుడికారాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: לְשָׁרְתוֹ
  choice: ఆయనకు పరిచర్య చేయడానికి
  rationale: సాధారణ సేవకన్నా ఇక్కడి పవిత్ర సేవా భావాన్ని తెలియజేస్తూ, కర్మప్రత్యయాన్ని ‘ఆయనకు’ అని నిలుపుతుంది.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: ఆయన నామంలో దీవించడానికి
  rationale: దైవ అధికారంతో దీవెన పలకడాన్ని మూలానికి దగ్గరగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకూ
  rationale: వక్త దృష్టికోణం వరకు కొనసాగుతున్న స్థితిని తెలిపే హీబ్రూ నుడికారానికి సహజ తెలుగు రూపం.
theological_decisions:
- issue: దైవ నామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా నిలుపుతుంది.
- issue: לַעֲמֹד ... לְשָׁרְתוֹ లో లేవి గోత్రపు ఆరాధనా సేవ
  choice: యాహ్వే సన్నిధిలో నిలబడి ఆయనకు పరిచర్య చేయడానికి
  alternative: యాహ్వే ఎదుట నిలబడి ఆయనను సేవించడానికి
  rationale: పవిత్ర సేవా సందర్భాన్ని తెలియజేస్తుంది; అయితే తరువాతి కాలపు ఏ ప్రత్యేక మతవ్యవస్థనూ వచనంలోకి దిగుమతి చేయదు.
- issue: עַד הַיּוֹם הַזֶּה యొక్క వ్యాకరణ సంబంధం
  choice: వివరణాత్మక పూర్తి వాక్యంగా ‘నేటి వరకూ వారు ఈ సేవ చేస్తున్నారు’
  alternative: చివర నేరుగా ‘నేటి వరకూ’
  rationale: హీబ్రూలో ఈ పదబంధం ముందున్న మొత్తం నియామకానికి లేదా చివరి సేవా విధికి వర్తించవచ్చు. తెలుగు వాక్యంలో అసహజమైన వేలాడే పదబంధాన్ని నివారిస్తూ కొనసాగుతున్న లేవీయ సేవ అనే ప్రధాన భావాన్ని వ్యక్తం చేస్తుంది; సాధ్యమైన విస్తృత సంబంధాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘మందసం,’ ‘నిబంధన,’ ‘పరిచర్య’ వంటి స్థిరమైన బైబిలు పదాలను సందర్భ స్పష్టత కోసం ఉంచాం; వాక్య నిర్మాణాన్ని సహజ తెలుగు ప్రవాహానికి అనుగుణంగా విభజించాం.
