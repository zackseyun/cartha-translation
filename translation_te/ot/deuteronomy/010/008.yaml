  source_fidelity: ముసాయిదా ప్రధానంగా హీబ్రూ మూలాన్ని సరిగానే ప్రతిబింబిస్తుంది. అయితే “నేటి వరకూ వారు ఈ సేవ చేస్తున్నారు” అనేది మూలంలో లేని స్పష్టమైన కర్తను, కొనసాగుతున్న కార్యాన్ని జతచేస్తుంది. హీబ్రూ “నేటి వరకూ” అనే పదబంధం నియామకానికో, చివరి విధికో, లేదా పేర్కొన్న విధుల సముదాయానికో సంబంధించగలదు; దానిని అలాగే తెరిచి ఉంచాలి.
