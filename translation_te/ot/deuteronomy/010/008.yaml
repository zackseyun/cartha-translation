  terminology: “యాహ్వే,” “లేవి గోత్రం,” “నిబంధన మందసం,” “పరిచర్య,” మరియు “దీవెన పలకడం” పదాలు మూలంలోని దైవనామం, గోత్రనామం, ఆరాధనా-సేవా సందర్భం, ఆశీర్వచన భావాలను తగినట్లుగా వ్యక్తపరుస్తాయి. “ఆయన నామంలో” బִּשְׁמוֹ యొక్క ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
