source:
  edition: WLC
  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: te
  text: అప్పుడు నేను తుమ్మచెక్కతో ఒక మందసాన్ని చేసి, మొదటి వాటివంటి రెండు రాతి పలకలను చెక్కాను[a]. ఆ రెండు పలకలను నా చేతిలో పట్టుకొని ఆ కొండపైకి ఎక్కాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదటి వాటివంటి రెండు రాతి పలకలను కోసి మలిచాను.”
    reason: פסל అనే క్రియ రాతిని కోయడం, చెక్కడం లేదా ఆకారమివ్వడం అనే భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: אֲרוֹן
  choice: మందసం
  rationale: ఈ పదం పలకలను ఉంచే పవిత్ర పెట్టెను సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘మందసం’ గౌరవప్రదంగా, సందర్భోచితంగా ఉంది; సాధారణ ‘పెట్టె’ కంటే నిబంధన సంబంధిత భావాన్ని నిలుపుతుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్క
  rationale: మూలంలోని అకేషియా జాతి కలపను సూచించేందుకు తెలుగులో బైబిలు పాఠకులకు పరిచితమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וָאֶפְסֹל
  choice: చెక్కాను
  rationale: פסל ఇక్కడ రాతిని కోసి లేదా చెక్కి పలకలుగా మలచడాన్ని సూచిస్తుంది. ‘చెక్కాను’ సహజమైన తెలుగులో ఆ రూపకల్పన చర్యను తెలియజేస్తుంది.
- source_word: לֻחֹת אֲבָנִים
  choice: రాతి పలకలు
  rationale: రాయితో చేసిన పలకలు అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּרִאשֹׁנִים
  choice: మొదటి పలకలవంటి
  rationale: ముందున్న పలకలతో పోలికను మూలంలోని విధంగానే నిలుపుతుంది; అవి అన్ని విధాలా ఒకేలా ఉన్నాయని అదనంగా నిర్ధారించదు.
- source_word: וָאַעַל הָהָרָה
  choice: కొండ ఎక్కాను
  rationale: దిశాసూచక రూపంతో ఉన్న עלה కేవలం కొండవైపు వెళ్లడాన్ని కాక, దానిపైకి ఎక్కడాన్ని సూచిస్తుంది.
- source_word: בְּיָדִי
  choice: నా చేతిలో పట్టుకొని
  rationale: హీబ్రూలో ఏకవచనంగా ఉన్న ‘నా చేతిలో’ అనే భావాన్ని సహజ తెలుగు క్రియతో వ్యక్తం చేస్తుంది; ‘నా చేతుల్లో’గా మార్చలేదు.
- source_word: וָאַעַשׂ
  choice: చేసి
  rationale: עשה యొక్క విస్తృతమైన ‘చేయు/తయారుచేయు’ భావాన్ని చర్యల వరుసకు సరిపోయే సహజ తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: నిబంధన పలకలను ఉంచే పవిత్ర పాత్రకు వాడిన పదం
  choice: మందసం
  alternative: పెట్టె
  rationale: ‘మందసం’ మూలపదంలోని పెట్టె భావాన్ని కాపాడుతూ, ఈ సందర్భంలోని పవిత్రమైన నిబంధన పాత్రను అదనపు సిద్ధాంత వివరణ లేకుండా గుర్తింపజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగు సంయుక్త క్రియలతో సహజంగా కలిపాం. ‘నా చేతిలో’ అనే మూల ఏకవచనాన్ని నిలిపి, అర్థస్పష్టత కోసం ‘పట్టుకొని’ చేర్చాం.
