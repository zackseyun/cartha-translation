source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు బెయేరోత్ బెనేయాకాను నుండి మోసేరాకు[a] ప్రయాణించారు. అక్కడ అహరోను చనిపోయాడు; అక్కడే అతడు పాతిపెట్టబడ్డాడు. అతని కుమారుడు ఎలియాజరు అతని స్థానంలో[b] యాజకుడిగా సేవ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బెయేరోత్ బెనేయాకాను’ అనే పేరును అక్షరార్థంగా ‘యాకాను కుమారుల బావులు’ అని అర్థం చేసుకోవచ్చు; ఇక్కడ అది స్థలనామంగా లిప్యంతరీకరించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని తరువాత.’ హెబ్రీలో అక్షరార్థంగా ‘అతని స్థానంలో’ అని ఉంది; అది యాజకత్వ వారసత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ‘ఇశ్రాయేలీయులు’ అని సరళీకరించకుండా, హెబ్రీ వంశీయ-జాతీయ పదబంధాన్ని సహజమైన తెలుగులో నిలిపింది. ప్రారంభ וְ కు సందర్భంలో తప్పనిసరిగా ప్రత్యేక సంధానపదం అవసరం లేదు.
- source_word: נָסְעוּ
  choice: ప్రయాణించారు
  rationale: נסע శిబిరం నుండి బయలుదేరి ముందుకు సాగడాన్ని సూచిస్తుంది; సందర్భంలో ‘ప్రయాణించారు’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు.
- source_word: מִ/בְּאֵרֹת בְּנֵי יַעֲקָן
  choice: బెయేరోత్ బెనేయాకాను నుండి
  rationale: ఎడారి ప్రయాణపథంలోని స్థలనామంగా లిప్యంతరీకరించబడింది; מִן ‘నుండి’గా అనువదించబడింది.
- source_word: מוֹסֵרָה
  choice: మోసేరాకు
  rationale: హెబ్రీలో ప్రత్యేక గమ్య విభక్తి లేకపోయినా ప్రయాణ సూత్రం గమ్యాన్ని సూచిస్తుంది; తెలుగులో ‘కు’ సహజంగా దానిని వ్యక్తపరుస్తుంది.
- source_word: שָׁם ... שָׁם
  choice: అక్కడ ... అక్కడే
  rationale: హెబ్రీలోని స్థాన సూచన పునరావృతిని నిలిపి, రెండో సందర్భంలోని దృష్టిని తెలుగులో ‘అక్కడే’ ద్వారా సహజంగా తెలిపింది.
- source_word: וַ/יִּקָּבֵר
  choice: అతడు పాతిపెట్టబడ్డాడు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలిపింది; మూలంలో లేని కర్తను చేర్చి ‘వారు అతన్ని పాతిపెట్టారు’ అని మార్చలేదు.
- source_word: וַ/יְכַהֵן
  choice: యాజకుడిగా సేవ చేశాడు
  rationale: כהן క్రియ యాజకునిగా పనిచేయడం లేదా సేవ చేయడాన్ని సూచిస్తుంది; కేవలం పదవి స్వీకరణను మాత్రమే సూచించే ‘యాజకుడయ్యాడు’ కంటే ఇది విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: అతని కుమారుడు ఎలియాజరు అతని స్థానంలో
  rationale: תחתיו లోని ప్రత్యామ్నాయ-వారసత్వ భావాన్ని ‘అతని స్థానంలో’ స్పష్టంగా నిలిపింది; తెలుగు వాక్యక్రమం సహజంగా అమర్చబడింది.
