source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: te
  text: 'యాహ్వే నాతో ఇలా అన్నాడు: “లేచి, ప్రజల ముందు ప్రయాణానికి బయలుదేరు[a], తద్వారా వారు నేను వారి పితరులకు[b] వారికివ్వాలని ప్రమాణం చేసిన దేశంలోకి ప్రవేశించి దాన్ని స్వాధీనం చేసుకోగలరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలకు ముందుగా.”
    reason: lexical_alternative
  - marker: b
    text: “పితరులు” అంటే ఇక్కడ ఇశ్రాయేలీయుల పూర్వీకులైన పితరులు.
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను ఉపయోగించాం.
- source_word: קוּם לֵךְ לְמַסַּע
  choice: లేచి ... బయలుదేరు
  rationale: రెండు ఆజ్ఞారూపాలనూ, ప్రయాణం ప్రారంభించాలనే מַסַּע భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי הָעָם
  choice: ప్రజలకు ముందుగా
  rationale: మోషే ప్రజల ముందుగా వెళ్లడమనే స్థలసంబంధ భావాన్ని నిలుపుతుంది; నాయకత్వ భావం సూచితమై ఉన్నా దాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: వారు ప్రవేశించి, దాన్ని స్వాధీనం చేసుకోవాలి
  rationale: ఆజ్ఞ తరువాతి క్రియలు ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సూచిస్తాయి. בוא యొక్క లోనికి వెళ్లే భావాన్నీ, ירשׁ యొక్క క్రియాశీల స్వాధీన భావాన్నీ నిలుపుతుంది.
- source_word: נִשְׁבַּעְתִּי
  choice: నేను ... ప్రమాణం చేసిన
  rationale: దేవుడు చేసిన గంభీర వాగ్దాన ప్రమాణాన్ని సరళంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: לַאֲבֹתָם
  choice: వారి పితరులకు
  rationale: మూలంలోని చారిత్రక పురుషవాచక బహువచనాన్ని నిలుపుతుంది; ఇక్కడ అది పూర్వీకులైన పితరులను సూచిస్తుంది.
- source_word: לָתֵת לָהֶם
  choice: వారికివ్వాలని
  rationale: భూమిని ప్రస్తుత ప్రజలకు లేదా పితరుల సంతతికి ఇవ్వాలనే వాగ్దానాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మూలంలోని బహువచన సర్వనామాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. కాబట్టి దాన్ని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు ధ్వన్యంతరీకరణను ఉపయోగించాం.
- issue: לַאֲבֹתָם పదాన్ని లింగతటస్థంగా చేయాలా
  choice: వారి పితరులకు
  alternative: వారి పూర్వీకులకు
  rationale: ఈ సందర్భం ఇశ్రాయేలు పితరులతో చేసిన చారిత్రక ప్రమాణాన్ని సూచిస్తుంది. అందువల్ల మూలంలోని పురుషవాచక రూపాన్ని పాఠ్యంలో నిలిపి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- issue: ఆజ్ఞ తరువాతి וְיָבֹאוּ וְיִרְשׁוּ క్రియల సంబంధం
  choice: ప్రవేశించి ... స్వాధీనం చేసుకోవాలి
  alternative: అప్పుడు వారు ప్రవేశించి ... స్వాధీనం చేసుకుంటారు
  rationale: ఈ క్రియలు ఉద్దేశం, ఆశించిన ఫలితం, లేదా తదనంతర సంఘటనగా అర్థమయ్యే అవకాశం ఉంది. సందర్భంలో ఆజ్ఞ యొక్క లక్ష్యాన్ని తెలుగులో సహజంగా చూపేందుకు ‘చుకోవాలి’ వాడాం; ఖచ్చితమైన కారణార్థక పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన వాక్య నిర్మాణం వాడాం. “లేచి ... బయలుదేరు” ఆజ్ఞ యొక్క తక్షణత్వాన్ని సహజంగా తెలియజేస్తుంది; అనవసరమైన ప్రాచీన పదజాలాన్ని నివారించాం.
