  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: te
  text: నీవు పగులగొట్టిన మొదటి పలకలపై ఉన్న మాటలను నేను ఈ పలకలపై రాస్తాను; వాటిని నీవు మందసంలో ఉంచాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: నేను ... రాస్తాను
  rationale: כתב అనే క్రియ యొక్క Qal అసంపూర్ణ రూపం, దైవిక వాగ్దాన సందర్భంలో సాధారణ భవిష్యత్ భావాన్ని ఇస్తుంది.
- source_word: הַלֻּחֹת
  choice: పలకలు
  rationale: לוח అంటే పలక లేదా ఫలకం; ఈ వచనంలో ‘రాతి’ అని మళ్లీ స్పష్టంగా లేకపోవడంతో దానిని చేర్చలేదు.
- source_word: הַדְּבָרִים
  choice: మాటలు
  rationale: דבר విస్తృతార్థక పదం; ఇక్కడ చెక్కబడిన నిబంధన మాటలను సూచిస్తుంది. ‘ఆజ్ఞలు’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయకుండా మూలానికి దగ్గరగా ఉంచింది.
- source_word: הָרִאשֹׁנִים
  choice: మొదటి
  rationale: మునుపటి పలకలను వాటి స్థానంలో చేయబడిన కొత్త పలకలతో పోల్చి గుర్తిస్తుంది.
- source_word: שִׁבַּרְתָּ
  choice: నువ్వు పగలగొట్టినవి
  rationale: Piel perfect 2ms రూపంలోని బలమైన కార్యభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְשַׂמְתָּם
  choice: తరువాత నువ్వు వీటిని ... ఉంచాలి
  rationale: שים అంటే ఉంచడం; పురుష బహువచన ప్రత్యయం సందర్భానుసారం పలకలను సూచిస్తుంది. ఆజ్ఞాత్మక భావాన్ని తెలుగులో ‘ఉంచాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּאָרוֹן
  choice: మందసంలో
  rationale: ארון ఇక్కడ పవిత్రమైన నిబంధన పెట్టెను సూచిస్తుంది; తెలుగు బైబిలు వాడుకలో గౌరవప్రదమైన ‘మందసం’ అనువైనది.
theological_decisions:
- issue: וְשַׂמְתָּם లోని ‘వాటిని’ అనే ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: పలకలను సూచిస్తుంది.
  alternative: పలకలపై రాసిన మాటలను లేదా ఆజ్ఞలను సూచించవచ్చు.
  rationale: వ్యాకరణపరంగా సమీపంలోని రెండు పురుష బహువచన నామాలకు అవకాశం ఉన్నా, మందసంలో భౌతికంగా ఉంచబడేవి పలకలే అని ద్వితీయోపదేశకాండము 10:1-5 సందర్భం స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. పొడవైన హీబ్రూ సంబంధవాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; దేవుడు మోషేతో ఏకవచనంలో మాట్లాడుతున్నందున ‘నువ్వు’ వాడాం.
