id: DEU.10.13
reference: Deuteronomy 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: te
  text: నేను నేడు నీకు ఆజ్ఞాపిస్తున్న యాహ్వే ఆజ్ఞలనూ, ఆయన శాసనాలనూ పాటించడం[a] నీ మేలు కోసమే కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాటించడం’కు మూలపదం ‘ఆచరించడం’ లేదా ‘కాపాడడం’ అని కూడా అర్థం ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: పాటించడం
  rationale: ל־తో కూడిన క్రియావాచక రూపం ముందు వచనంలో యాహ్వే కోరుతున్నదాని అంశాన్ని కొనసాగిస్తుంది. ‘పాటించడం’ ఒడంబడికకు విధేయత అనే ఆచరణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆచరించడం’, ‘కాపాడడం’ అనే భావ ఛాయలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలు
  rationale: ఈ బహువచన నిర్మాణం యాహ్వే విధించిన బాధ్యతలను సూచిస్తుంది. ‘ఆజ్ఞలు’ స్పష్టమైన, సహజమైన న్యాయ-ఒడంబడిక పదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని వ్యక్తినామ రూపాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: חֻקֹּתָיו
  choice: ఆయన శాసనాలు
  rationale: ఈ పదం నిర్దేశించబడిన చట్టబద్ధ నియమాలను సూచిస్తుంది. ‘శాసనాలు’ అనే పదం న్యాయ-ఒడంబడిక సందర్భాన్ని నిలుపుతూ ‘ఆజ్ఞలు’తో సహజంగా జతపడుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేను నేడు నీకు ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన కృదంతంలోని తక్షణత్వాన్ని ‘ఆజ్ఞాపిస్తున్న’ నిలుపుతుంది; తెలుగు పదక్రమంలో ఈ విశేషణ భాగాన్ని ముందుంచి ఆజ్ఞలు, శాసనాలు రెండింటికీ వర్తించేలా చేశాం.
- source_word: לְטוֹב לָךְ
  choice: నీ మేలు కోసం
  rationale: ఈ ప్రయోగం గ్రహీతకు కలిగే ప్రయోజనాన్ని సూచిస్తుంది. ‘నీ మేలు కోసం’ సంక్షిప్తంగా, సహజంగా ఉండి ఆజ్ఞలు ఇశ్రాయేలు హితం కోసమే అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: వాక్యాంతంలోని ప్రశ్నార్థక స్వరం
  choice: ‘నీ మేలు కోసమే కదా?’
  alternative: ‘నీ మేలు కోసం.’
  rationale: ఈ వచనం 10:12లో ప్రారంభమైన ప్రశ్నలో భాగం. ‘కదా?’ మొత్తం వాక్యంలోని వాక్ప్రశ్న స్వరాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది; ఇది మూలంలోని ప్రయోజనార్థక పదబంధాన్ని సిద్ధాంతపరంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. 10:12 నుంచి కొనసాగుతున్న వాక్య నిర్మాణాన్ని దృష్టిలో ఉంచుకొని క్రియావాచక రూపం మరియు వాక్ప్రశ్న ముగింపు నిలుపబడ్డాయి.
