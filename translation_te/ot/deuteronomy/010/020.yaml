source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేకు భయపడాలి[a]; ఆయననే సేవించాలి; ఆయనను అంటిపెట్టుకొని ఉండాలి[b]; ఆయన పేరుతో ప్రమాణం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భక్తితో గౌరవించాలి’; ఇక్కడి హీబ్రూ క్రియ ఒడంబడిక సందర్భంలో గౌరవంతో కూడిన భయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను గట్టిగా పట్టుకొని ఉండాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’తో నిలిపి, తెలుగులో సహజంగా ‘నీ దేవుడైన యెహోవా’గా నిర్మించాం.
- source_word: תִּירָא
  choice: భయపడాలి
  rationale: యרא అనే క్రియలో భయంతో కూడిన భక్తిపూర్వక గౌరవం ఉంది; దాని తీవ్రతను తగ్గించకుండా ప్రత్యక్ష అర్థాన్ని నిలిపాం.
- source_word: אֹתוֹ תַעֲבֹד
  choice: ఆయననే సేవించాలి
  rationale: ముందుకు వచ్చిన కర్మ సర్వనామంలోని ఉద్ఘాటనను ‘ఆయననే’తో చూపి, עבד యొక్క ప్రాథమిక అర్థమైన ‘సేవించు’ను నిలిపాం.
- source_word: וּבוֹ תִדְבָּק
  choice: ఆయనను హత్తుకొని ఉండాలి
  rationale: דבק వ్యక్తికి నిబద్ధంగా అంటిపెట్టుకొని ఉండడాన్ని సూచిస్తుంది; ‘హత్తుకొని ఉండాలి’ ఆ సన్నిహితమైన ఒడంబడిక నిబద్ధతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: ఆయన పేరుతోనే ప్రమాణం చేయాలి
  rationale: שבע నిఫల్‌తో בִשְׁמוֹ కలిసినప్పుడు ‘ఆయన పేరుతో ప్రమాణం చేయు’ అనే ప్రమాణ-సూత్రార్థం వస్తుంది; ‘నే’ సందర్భంలోని ప్రత్యేక నిబద్ధతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఒడంబడిక ఆజ్ఞలను తెలిపే హీబ్రూ imperfect రూపాలు
  choice: తెలుగులో ‘-ాలి’ విధిరూపాల శ్రేణి
  alternative: 'ప్రత్యక్ష ఆజ్ఞారూపాలు: ‘భయపడు, సేవించు, హత్తుకొని ఉండు, ప్రమాణం చేయి’'
  rationale: ఈ సందర్భంలో imperfect రూపాలు భవిష్యత్తును మాత్రమే కాక ఒడంబడికపరమైన బాధ్యతను తెలియజేస్తాయి. ఆధునిక ప్రామాణిక తెలుగులో ‘-ాలి’ రూపం ఆజ్ఞాత్మక బాధ్యతను, వాక్య గంభీరతను సహజంగా నిలుపుతుంది.
- issue: תִּירָא లో భయం మరియు భక్తిపూర్వక గౌరవం మధ్య భావ ఉద్రిక్తత
  choice: ప్రధాన పాఠ్యంలో ‘భయపడాలి’
  alternative: ‘భక్తితో గౌరవించాలి’
  rationale: ‘భయపడాలి’ మూలపదం యొక్క ప్రత్యక్ష బలాన్ని కాపాడుతుంది; ఒడంబడిక సందర్భంలో గౌరవభావం అంతర్భూతమని పాదటిప్పణిలో తెలియజేశాం, కానీ మూలంలోని భయ భావాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఏకవచన ఒడంబడిక సంబోధనను ‘నీ’తో నిలిపాం. గంభీరతతో పాటు సాధారణ పాఠకునికి అర్థమయ్యే పదజాలాన్ని వాడాం. ఉద్ఘాటన కోసం ‘ఆయననే’, ‘పేరుతోనే’ ఉపయోగించాం; అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
