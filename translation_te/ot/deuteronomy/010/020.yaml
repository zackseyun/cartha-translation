  naturalness: ‘నీ దేవుడైన యాహ్వేకు భయపడాలి; ఆయననే సేవించాలి; ఆయనను అంటిపెట్టుకొని ఉండాలి; ఆయన పేరుతో ప్రమాణం చేయాలి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞాత్మక శ్రేణి. ‘అంటిపెట్టుకొని ఉండాలి’ అనేది ఇక్కడ భౌతిక ఆలింగనంకన్నా నమ్మకమైన అనుబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
