id: DEU.10.22
reference: Deuteronomy 10:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: te
  text: నీ పితరులు[b] డెబ్బై మందిగా[a] ఈజిప్టుకు దిగివెళ్లారు; ఇప్పుడు నీ దేవుడైన యాహ్వే నిన్ను ఆకాశంలోని నక్షత్రాలంత అనేకులుగా చేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘డెబ్బై ప్రాణులతో’ లేదా ‘డెబ్బై ఆత్మలతో.’ ఇక్కడ హీబ్రూ נֶפֶשׁ వ్యక్తులను లెక్కించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ పూర్వీకులు.’ హీబ్రూ పదం అక్షరార్థంగా ‘నీ పితరులు’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: దీనిని ‘ఆకాశ నక్షత్రాలవలె’ లేదా ‘ఆకాశంలోని నక్షత్రాలంత అనేకులుగా’ అని కూడా అనువదించవచ్చు. భావం సంఖ్యాపరమైన సమృద్ధి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: డెబ్బై మంది
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తులను లెక్కించే హీబ్రూ ప్రయోగం. ఆధునిక తెలుగులో ‘డెబ్బై మంది’ సహజంగా ఉండి, ‘ఆత్మలు’ అనే తప్పుదారి పట్టించే అర్థాన్ని నివారిస్తుంది.
- source_word: יָרְדוּ
  choice: దిగివెళ్లారు
  rationale: ירד యొక్క సాధారణ ‘దిగు/దిగివెళ్లు’ భావాన్ని, ఈజిప్టుకు ప్రయాణాన్ని సూచించే సంప్రదాయ దిశాప్రయోగాన్ని నిలుపుతుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరులు
  rationale: మూలంలో ఉన్న పురుషలింగ బహువచన ‘నీ తండ్రులు/పితరులు’ అనే రూపాన్ని నిలుపుతూ, పూర్వీకులను సూచించే గౌరవప్రదమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: מִצְרָיְמָה
  choice: ఈజిప్టుకు
  rationale: దిశను సూచించే హీబ్రూ అంత్యప్రత్యయాన్ని సహజమైన తెలుగు గమ్యవాచక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: గతంలోని స్వల్ప సంఖ్యకూ ప్రస్తుత విస్తారతకూ మధ్యనున్న కాలభేదాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘కాని’ అని అతిగా ప్రతికూల భావం చేర్చదు.
- source_word: שָׂמְךָ
  choice: నిన్ను … చేశాడు
  rationale: שׂים యొక్క అక్షరార్థం ‘ఉంచు/నిలుపు’; ఈ సందర్భంలో ఫలితస్థితిని సూచిస్తున్నందున ‘చేశాడు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణానుసార రూపాన్ని ఇస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని సహజంగా కలిపే తెలుగు నిర్మాణం.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם … לָרֹב
  choice: ఆకాశ నక్షత్రాలవలె విస్తారంగా
  rationale: ఉపమాన చిత్రాన్ని నిలుపుతూ, לָרֹב సూచించే సంఖ్యాపరమైన విస్తారతను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని సాధారణ బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: אֲבֹתֶיךָ అనే లింగసూచక పూర్వీకుల పదం
  choice: నీ పితరులు
  alternative: నీ పూర్వీకులు
  rationale: హీబ్రూ పాఠంలోని స్పష్టమైన పురుషలింగ పదాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; విస్తృత సూచనను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పితరులు,’ ‘దిగివెళ్లారు,’ ‘విస్తారంగా’ అనే పదాలు మూలంలోని రూపకాన్నీ గంభీరతనూ నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
