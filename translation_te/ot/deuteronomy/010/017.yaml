id: DEU.10.17
reference: Deuteronomy 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: te
  text: ఎందుకంటే మీ దేవుడైన యహ్వే దేవుళ్లకు దేవుడు, ప్రభువులకు ప్రభువు. ఆయన గొప్పవాడూ, శక్తిమంతుడూ, భయభక్తిని కలిగించేవాడూ అయిన దేవుడు[a]; ఆయన పక్షపాతం చూపడు, లంచం తీసుకోడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “భయంకరుడు” లేదా “విస్మయాన్ని కలిగించేవాడు.” హీబ్రూ పదం భక్తిపూర్వక భయాన్ని కలిగించేవాణ్ణి సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని పరిచయం చేసే హేతువాచక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఉంచింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని, సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: దేవుళ్లకు దేవుడు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని నిలిపి, ఇతర దేవుళ్ల అస్తిత్వంపై అదనపు తాత్త్విక నిర్ణయం చేర్చకుండా యహ్వే సర్వోన్నతత్వాన్ని వ్యక్తం చేస్తుంది.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: ప్రభువులకు ప్రభువు
  rationale: ముందటి సమాంతర బిరుదు నిర్మాణాన్ని, సార్వభౌమాధికార భావాన్ని సహజమైన గంభీర తెలుగులో నిలుపుతుంది.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: గొప్పవాడూ, శక్తిమంతుడూ, భయభక్తులు పుట్టించేవాడూ అయిన దేవుడు
  rationale: మూడు దైవ విశేషణాల క్రమాన్ని నిలుపుతూ, נורא లోని భయంతో కూడిన విస్మయభావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: ఆయన పక్షపాతం చూపడు
  rationale: అక్షరార్థంగా ‘ముఖాన్ని ఎత్తడు’ అనే హీబ్రూ న్యాయసంబంధ నుడికారానికి సహజమైన తెలుగు అర్థాన్ని ఇస్తుంది.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: లంచం తీసుకోడు
  rationale: న్యాయనైతిక బలాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుళ్లకు దేవుడు, ప్రభువులకు ప్రభువు’ అనే బిరుదుల వరుసను ఎలా అందించాలి
  choice: మూలంలోని సర్వోన్నతత్వ సూత్రాన్ని యథాతథ నిర్మాణంతో నిలపడం
  alternative: అందరు దేవుళ్లకంటే ఉన్నతుడైన దేవుడు, ప్రభువులందరికంటే ఉన్నతుడైన ప్రభువు
  rationale: హీబ్రూ సమాస శైలిని కాపాడటం వల్ల దైవ సర్వోన్నతత్వం స్పష్టమవుతుంది; ఇతర దేవుళ్ల స్వరూపం లేదా అస్తిత్వం గురించి మూలం చెప్పనిదాన్ని అనువాదం చేర్చదు.
- issue: יהוה దైవనామాన్ని ఎలా అందించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా మూలానికి సమీపంగా లిప్యంతరీకరించింది.
- issue: וְהַנּוֹרָא లో భయం మరియు విస్మయం మధ్య భావతీవ్రత
  choice: భయభక్తులు పుట్టించేవాడు
  alternative: భయంకరుడు; విస్మయం కలిగించేవాడు
  rationale: ఈ పదం కేవలం భీతిని గానీ సాధారణ ఆశ్చర్యాన్ని గానీ కాక, దేవుని సమక్షంలో కలిగే భయంతో కూడిన భక్తిపూర్వక విస్మయాన్ని సూచించగలదు; ప్రధాన పాఠం ఆ విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సమాంతర దైవబిరుదుల లయను నిలిపి, న్యాయసంబంధ చివరి రెండు వాక్యాలను నేరుగా ఉంచింది.
