id: DEU.10.12
reference: Deuteronomy 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: te
  text: ఇప్పుడు ఇశ్రాయేలూ, నీ దేవుడైన యాహ్వే నీ నుండి ఏమి కోరుతున్నాడు? నీ దేవుడైన యాహ్వేకు భయపడాలని[a], ఆయన మార్గాలన్నిటిలో నడవాలని, ఆయనను ప్రేమించాలని, నీ హృదయమంతటితోను నీ ప్రాణమంతటితోను[b] నీ దేవుడైన యాహ్వేను సేవించాలని మాత్రమే కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “భయపడడం”లో భక్తి, విస్మయం, విధేయతతో కూడిన దేవభయం కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: “ప్రాణం” అని అనువదించిన హీబ్రూ పదానికి సందర్భానుసారం జీవితం, స్వయం, లేదా సంపూర్ణ అస్తిత్వం అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: మోషే ఉపదేశంలో కొత్త అన్వయాత్మక మలుపును సూచించే సహజమైన తెలుగు సంధాన పదం; హీబ్రూ ו యొక్క అనుసంధాన భావం సందర్భంలోనే స్పష్టమవుతుంది.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: నీ నుండి ఏమి అడుగుతున్నాడు?
  rationale: שׁאל యొక్క ప్రాథమిక ‘అడుగు’ భావాన్ని ఉంచుతూ, సందర్భంలోని బాధ్యతా భావాన్ని ప్రశ్న నిర్మాణం ద్వారా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రత్యక్షంగా అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు / నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది; సమూహమైన ఇశ్రాయేలును ఏకవచనంగా సంబోధించిన మూల నిర్మాణాన్ని కాపాడుతుంది.
- source_word: כִּי אִם
  choice: మాత్రమే కదా?
  rationale: రేటరికల్ ప్రశ్నలో ‘ఇది తప్ప మరేమీ కాదు’ అనే పరిమితి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְיִרְאָה
  choice: భయపడాలని
  rationale: భక్తి, విస్మయం, విధేయత కలిగిన నిబంధనా భయాన్ని మృదువుగా ‘గౌరవించు’ అని మార్చకుండా మూలపద బలాన్ని నిలుపుతుంది.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: ఆయన మార్గాలన్నిటిలో నడవాలని
  rationale: నైతిక జీవనానికి సంబంధించిన హీబ్రూ ‘నడుచు’ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: ఆయనను ప్రేమించాలని
  rationale: ప్రభువును సూచించే ప్రత్యక్ష కర్మను, నిబంధనా ప్రేమ భావాన్ని సూటిగా అందిస్తుంది.
- source_word: וְלַעֲבֹד
  choice: సేవించాలని
  rationale: ఆరాధనకే పరిమితం చేయకుండా విధేయత, భక్తి, కార్యరూప సేవ అన్న విస్తృత עבד భావాన్ని కాపాడుతుంది.
- source_word: בְּכָל לְבָבְךָ
  choice: నీ పూర్ణ హృదయంతో
  rationale: లేబాబ్ సూచించే అంతరంగం, సంకల్పం, ఆలోచనల సమగ్రతను సంప్రదాయబద్ధంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: నీ పూర్ణ ప్రాణంతో
  rationale: נפשׁ యొక్క ‘ప్రాణం/జీవితం/స్వయం’ పరిధిని ‘ప్రాణం’ ద్వారా నిలుపుతూ, హృదయంతో జతైన సంపూర్ణ సమర్పణను తెలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నిబంధనా నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: నిబంధనా సందర్భంలో ירא యొక్క బలం
  choice: భయపడాలని
  alternative: భక్తితో గౌరవించాలని
  rationale: కేవలం భీతిని మాత్రమే సూచించకపోయినా, మూలంలోని భయం, విస్మయం, భక్తి, విధేయతల ఉద్వేగాన్ని ‘గౌరవం’గా మృదువుపరచకుండా కాపాడుతుంది.
- issue: נפשׁ యొక్క మానవశాస్త్రీయ పరిధి
  choice: ప్రాణం
  alternative: జీవితం అంతటితో / సంపూర్ణ అస్తిత్వంతో
  rationale: దీనిని శరీరానికి వేరైన భాగమని నిర్దిష్టంగా వ్యాఖ్యానించకుండా సంప్రదాయ తెలుగు సమానార్థకాన్ని ఉంచి, విస్తృత భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఇశ్రాయేలును ఉద్దేశించిన హీబ్రూ ఏకవచన సంబోధనను ‘ఇశ్రాయేలూ’, ‘నీ’ రూపాలతో నిలిపాం. మూలంలోని వరుస infinitive నిర్మాణాన్ని తెలుగులో ‘-ాలని’ సమాంతర రూపాలతో పునరుత్పత్తి చేశాం.
