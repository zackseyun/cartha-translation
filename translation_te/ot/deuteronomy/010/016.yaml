  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: te
  text: కాబట్టి మీ హృదయపు ముందుచర్మానికి సున్నతి చేయండి[a][b]; ఇకపై మొండి మెడవారిగా ఉండకండి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు మీ హృదయపు ముందుచర్మానికి సున్నతి చేయండి.” ఇక్కడి సంధాయకం సాధారణ అనుసంధానంగా కూడా అర్థం కావచ్చు; సందర్భం “కాబట్టి” అనే నిర్ధారణాత్మక భావానికీ మద్దతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “మీ హృదయపు ముందుచర్మం” అనే రూపకం అక్షరార్థంగా ఉంది; ఇది దేవునిపట్ల అంతరంగ ప్రతిఘటనను తొలగించడాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, “ఇకపై మీ మెడను గట్టిపరచకండి.” లేదా, “ఇకపై మీ మెడను కఠినపరచకండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: కాబట్టి ... తొలగించుకోండి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మక భావాన్ని וּ־ ఇక్కడ మోస్తుంది; రూపం Qal perfect 2mp అయినా సందర్భంలో ఆజ్ఞాత్మక పిలుపుగా పనిచేస్తుంది. తెలుగులో ‘కాబట్టి’ మరియు గౌరవ బహువచన ఆజ్ఞ సహజంగా ఆ భావాన్ని అందిస్తాయి.
- source_word: עָרְלַת לְבַבְכֶם
  choice: మీ హృదయపు సున్నతి కాని చర్మాన్ని
  rationale: మూలంలోని స్పష్టమైన ‘మీ హృదయపు ముందుచర్మం’ అనే సున్నతి రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘మొండితనం’గా మార్చకుండా నిలుపుతుంది. ఆధునిక తెలుగులో ‘సున్నతి కాని చర్మం’ రూపక సంబంధాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבַבְכֶם
  choice: మీ హృదయపు
  rationale: לֵבָב సంకల్పం, అవగాహన సహా అంతరంగ వ్యక్తిని సూచించగలదు; ఇక్కడ రూపకాన్ని కాపాడటానికి ‘హృదయం’ సహజమైన సమానార్థకం.
- source_word: וְעָרְפְּכֶם
  choice: మీ మెడను
  rationale: עֹרֶף అక్షరార్థంగా మెడ లేదా మెడ వెనుక భాగాన్ని సూచిస్తుంది. ‘మెడను బిగించడం’ అనే రూపకంలో ‘మెడ’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: ఇకమీదట ... బిగించకండి
  rationale: Hiphil రూపం ‘గట్టిపరచడం/బిగించడం’ అనే భావాన్నిస్తుంది; עוֹד నిషేధ సందర్భంలో ‘ఇకమీదట’గా సహజంగా వస్తుంది. రూపకాన్ని విశేషణాత్మక ‘మొండివారిగా ఉండకండి’గా సడలించకుండా ఉంచింది.
theological_decisions:
- issue: అంతరంగ సున్నతికి సంబంధించిన నిబంధనాత్మక రూపకం
  choice: ‘మీ హృదయపు సున్నతి కాని చర్మాన్ని తొలగించుకోండి’ అని రూపకాన్ని స్పష్టంగా నిలుపడం
  alternative: ‘మీ హృదయాలను పవిత్రపరచుకోండి’ లేదా ‘మీ హృదయ మొండితనాన్ని తొలగించుకోండి’
  rationale: మూలపాఠం బాహ్య నిబంధన చిహ్నమైన సున్నతిని అంతరంగ నైతిక స్పందనకు రూపకంగా వాడుతుంది. దానిని నిలుపడం బాహ్య చిహ్నం–అంతరంగ విధేయత మధ్యనున్న వేదాంతపరమైన ఉద్రిక్తతను ముందుగానే ఒక వ్యాఖ్యానంతో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవ బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. భాష సహజంగా ఉండేలా చేసినప్పటికీ హృదయ సున్నతి, మెడ బిగించడం అనే రెండు హీబ్రూ శరీర రూపకాలూ నిలుపబడ్డాయి. ప్రతి పాదానికి సంబంధించిన పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత స్థానంలో ఉంచబడింది.
