revisions:
- from: నేనైతే మొదటిసారిలాగే నలభై పగళ్లు, నలభై రాత్రులు కొండ మీద నిలిచి ఉన్నాను. ఆ సారి కూడా యెహోవా నా మాట ఆలకించాడు[a]; నిన్ను నాశనం చేయడానికి యెహోవా ఇష్టపడలేదు.
  to: నేనైతే మొదటిసారిలాగే నలభై రోజులు, నలభై రాత్రులు కొండ మీద నిలిచి ఉన్నాను. ఆ సారి కూడా యాహ్వే నన్ను ఆలకించాడు[a]; నిన్ను నాశనం చేయడానికి యాహ్వే ఇష్టపడలేదు.
  rationale: The revision removes the added specification ‘my words,’ uses the project-required form of the divine name, and improves the natural Telugu duration expression. It otherwise preserves the draft’s faithful rendering of the comparison, Moses’ extended presence on the mountain, and Yahweh’s unwillingness to destroy Israel.
