id: DEU.10.10
reference: Deuteronomy 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: te
  text: నేనైతే మొదటిసారిలాగే నలభై రోజులు, నలభై రాత్రులు కొండ మీద నిలిచి ఉన్నాను. ఆ సారి కూడా యాహ్వే నన్ను ఆలకించాడు[a]; నిన్ను నాశనం చేయడానికి యాహ్వే ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను విన్నాడు.” హీబ్రూ క్రియ వినడాన్నీ, అనుకూలంగా ఆలకించి స్పందించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: నేనైతే
  rationale: సంయోజక అవ్యయంతో కూడిన స్వతంత్ర సర్వనామంలోని స్వల్ప విషయప్రాధాన్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָמַדְתִּי
  choice: నిలిచి ఉన్నాను
  rationale: మూల క్రియ యొక్క ‘నిలుచు/ఉండు’ భావాన్ని నిలుపుతూ, నలభై రోజులపాటు అక్కడ కొనసాగి ఉండడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בָהָר
  choice: కొండ మీద
  rationale: పర్వతంపై ఉన్న స్థానాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: మొదటిసారిలాగే
  rationale: అక్షరార్థంగా ‘మొదటి రోజులవలె’; సందర్భంలో ఇది మునుపటి నలభై రోజుల సందర్భంతో పోలికను సూచిస్తుంది.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: కాలవ్యవధిని ఖచ్చితంగా, సాధారణ తెలుగు బైబిలు శైలికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: యెహోవా నా మాట ఆలకించాడు
  rationale: שׁמע + אֶל వినడమే కాక అనుకూలంగా స్పందించే భావాన్నీ కలిగి ఉండగలదు; ‘ఆలకించాడు’ ఈ ద్వంద్వ ఛాయను అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: ఆ సారి కూడా
  rationale: ఆ సందర్భంలోనూ దేవుడు మోషే మాట విన్నాడనే పునరావృత్త భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא אָבָה
  choice: ఇష్టపడలేదు
  rationale: క్రియలోని సంకల్పం లేదా సమ్మతి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַשְׁחִיתֶךָ
  choice: నిన్ను నాశనం చేయడానికి
  rationale: ఒడంబడిక తీర్పు సందర్భంలో హిఫిల్ రూపం సూచించే నిర్మూలన భావానికి స్పష్టమైన సమానార్థకం; ఏకవచన ‘నిన్ను’ ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సంబోధిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన రూపంతో నిలుపబడింది.
- issue: וַיִּשְׁמַע יְהוָה אֵלַי లోని దైవ స్పందన ఛాయ
  choice: యెహోవా నా మాట ఆలకించాడు
  alternative: యెహోవా నా మాట విన్నాడు
  rationale: సందర్భం మోషే మధ్యవర్తిత్వ ప్రార్థనకు సంబంధించినది. ‘ఆలకించాడు’ వినికిడితో పాటు అనుకూల స్వీకరణను సూచించగలదు, అయితే ప్రార్థన ఫలించే విధానంపై అదనపు సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘నేనైతే’ ద్వారా మూలంలోని విషయప్రాధాన్యం, ‘నిలిచి ఉన్నాను’ ద్వారా క్రియ యొక్క అక్షరార్థం మరియు దీర్ఘకాలిక ఉనికి రెండూ నిలుపబడ్డాయి. సమష్టి ఇశ్రాయేలును ఉద్దేశించిన మూల ఏకవచన సంబోధనను ‘నిన్ను’గా ఉంచాం.
