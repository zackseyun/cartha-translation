    text: లేదా, “నీవు స్తుతించేవాడు ఆయనే,” లేదా “ఆయనే నీ అతిశయం.” హీబ్రూలో అక్షరార్థంగా, “ఆయనే నీ స్తుతి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భయంకరమైన కార్యాలను” లేదా “భీతిని కలిగించే కార్యాలను.” హీబ్రూ పదం భయాన్నీ విస్మయాన్నీ కలిగించే కార్యాలను సూచిస్తుంది.
