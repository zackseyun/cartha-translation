revisions:
- from: ఆయనే నీ స్తుతి[a]; ఆయనే నీ దేవుడు. నీ కళ్లతో నీవు చూసిన ఈ గొప్పవాటిని, భయభక్తులు పుట్టించే కార్యాలను నీ కోసం చేసినవాడు ఆయనే[b].
  to: ఆయనే నీ స్తుతి[a], ఆయనే నీ దేవుడు; నీ కన్నులు చూసిన ఈ గొప్ప, భయభక్తులను కలిగించే కార్యాలను[b] ఆయన నీ కొరకు చేశాడు.
  rationale: The revision preserves the Hebrew word order and emphasis where idiomatic, makes the two descriptions of God’s deeds grammatically parallel in Telugu, and places footnote b directly after the phrase it explains. It does not resolve the compact “your praise” expression into only one interpretive sense.
