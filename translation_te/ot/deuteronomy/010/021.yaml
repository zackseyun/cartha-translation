base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: te
  text: ఆయనే నీ స్తుతి[a], ఆయనే నీ దేవుడు; నీ కన్నులు చూసిన ఈ గొప్ప, భయభక్తులను కలిగించే కార్యాలను[b] ఆయన నీ కొరకు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు స్తుతించేవాడు ఆయనే,” లేదా “ఆయనే నీ అతిశయం.” హీబ్రూలో అక్షరార్థంగా, “ఆయనే నీ స్తుతి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భయంకరమైన కార్యాలను” లేదా “భీతిని కలిగించే కార్యాలను.” హీబ్రూ పదం భయాన్నీ విస్మయాన్నీ కలిగించే కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: నీ స్తుతి
  rationale: హీబ్రూ నామవాచక నిర్మాణాన్ని నేరుగా నిలుపుతూ, దేవుడే ఇశ్రాయేలు స్తుతికి విషయమూ ఆధారమూ అనే సంక్షిప్త భావాన్ని కాపాడుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఏకవచన సంబోధన ద్వారా సమష్టిగా ఇశ్రాయేలుతో మాట్లాడే నిబంధనా భాషను యథాతథంగా నిలుపుతుంది.
- source_word: עָשָׂה אִתְּךָ
  choice: నీ కోసం చేసినవాడు
  rationale: ఈ సందర్భంలో עשה את అనే ప్రయోగానికి ఉన్న ఉపకారార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַגְּדֹלֹת
  choice: గొప్పవాటిని
  rationale: విశేషణం నామవాచకంగా పనిచేస్తున్న హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; శక్తిని మాత్రమే సూచించేలా భావాన్ని కుదించదు.
- source_word: הַנּוֹרָאוֹת
  choice: భయభక్తులు పుట్టించే కార్యాలను
  rationale: ఈ పదంలో ఉన్న భయం, విస్మయం, భక్తిపూర్వక గౌరవం అనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం భయంకరమైనవి అనే ప్రతికూల భావానికి పరిమితం చేయదు.
- source_word: רָאוּ עֵינֶיךָ
  choice: నీ కళ్లతో నీవు చూసిన
  rationale: ప్రత్యక్ష సాక్ష్యాన్ని నొక్కిచెప్పే హీబ్రూ శరీరావయవ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: הוּא ... וְהוּא
  choice: ఆయనే ... ఆయనే
  rationale: పునరుక్త సర్వనామంలోని ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ప్రత్యేకార్థాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: הוּא תְהִלָּתְךָ అనే నామవాచక విధేయ నిర్మాణం
  choice: ఆయనే నీ స్తుతి
  alternative: నీవు స్తుతించేది ఆయన్నే; ఆయనే నీ అతిశయానికి ఆధారం
  rationale: 'మూలంలోని సంక్షిప్తతనూ ఉద్దేశపూర్వక భావసాంద్రతనూ కాపాడుతుంది: దేవుడు స్తుతికి విషయమూ దాని ఆధారమూ. మరింత వివరణాత్మక అనువాదం ఈ ద్వంద్వ భావాన్ని ఒకే అర్థానికి పరిమితం చేయవచ్చు.'
- issue: הַנּוֹרָאוֹת పదంలోని భయ-విస్మయ ఛాయ
  choice: భయభక్తులు పుట్టించే కార్యాలు
  alternative: భయంకరమైన కార్యాలు; విస్మయం కలిగించే కార్యాలు
  rationale: దైవ కార్యాలు కలిగించే భయం, విస్మయం, భక్తిపూర్వక గౌరవం అన్నింటినీ సాధ్యమైనంతవరకు నిలుపుతుంది; దానిని కేవలం విధ్వంసక భయంగా గానీ, తేలికైన ఆశ్చర్యంగా గానీ మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. “ఆయనే” అనే పునరుక్తి మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. సమష్టి ఇశ్రాయేలును ఏకవచనంగా సంబోధించే మూల రూపాన్ని “నీ”తో కాపాడాం.
