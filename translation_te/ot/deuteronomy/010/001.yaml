id: DEU.10.1
reference: Deuteronomy 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: te
  text: 'ఆ సమయంలో యాహ్వే నాతో ఇలా అన్నాడు: “మొదటివాటిలాంటి రెండు రాతి పలకలను నీ కోసం చెక్కు. కొండ మీదికి నా దగ్గరకు ఎక్కి రా. నీ కోసం చెక్కతో ఒక మందసం చేయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: కథనంలోని కాలసూచనను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: פְּסָל לְךָ
  choice: నీ కోసం చెక్కు
  rationale: פסל రాతిని చెక్కి ఆకారం ఇవ్వడాన్ని సూచిస్తుంది; לְךָ లోని ప్రయోజనార్థక భావాన్ని ‘నీ కోసం’ నిలుపుతుంది.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: మొదటివాటిలాంటి రెండు రాతి పలకలను
  rationale: రాతి నిబంధన పలకలను సూచిస్తూ, ముందున్న పలకలతో పోలికను సహజంగా నిలుపుతుంది.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: కొండ మీదికి నా దగ్గరకు ఎక్కి రా
  rationale: עלה లోని పైకి వెళ్లే కదలికను, אֵלַי లోని దేవుని వైపు గమ్యాన్ని, దిశాసూచక రూపంలోని కొండ గమ్యాన్ని కలిపి తెలియజేస్తుంది.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: నీ కోసం చెక్కతో ఒక మందసం చేయి
  rationale: ఆజ్ఞార్థక సందర్భాన్ని ‘చేయి’తో వ్యక్తం చేస్తూ, అֲרוֹןను నిబంధన పలకలను ఉంచే పవిత్ర మందసంగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- issue: אֲרוֹן పదానికి సందర్భానుసార అర్థం
  choice: మందసం
  alternative: పెట్టె
  rationale: ఇది పలకలను ఉంచే నిబంధన మందసాన్ని సూచిస్తుంది; ‘పెట్టె’ సాధారణ వస్తువుగా మాత్రమే వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్యరచన వాడబడింది. మూలంలోని వరుస ఆజ్ఞలు స్పష్టంగా వినిపించేందుకు వాటిని మూడు చిన్న వాక్యాలుగా ఇచ్చాం. ఆధారంలేని లేదా తప్పు స్థానాల్లో ఉన్న ఆంగ్ల సంప్రదింపుపాఠపు పాదసూచికలను చేర్చలేదు.
