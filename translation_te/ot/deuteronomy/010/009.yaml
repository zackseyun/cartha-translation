source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: te
  text: అందుచేత లేవికి తన సహోదరులతో పాటు వాటా గానీ స్వాస్థ్యం గానీ లేదు[a]. యెహోవాయే అతని స్వాస్థ్యం[b]—నీ దేవుడైన యెహోవా అతనికి చెప్పినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “తన సహోదరులతో.” ఏకవచనంలో ఉన్న “లేవి” ఇక్కడ లేవి గోత్రానికి ప్రతినిధి; “సహోదరులు” మిగతా ఇశ్రాయేలు గోత్రాలను సూచిస్తుంది.'
    reason: cultural_note
  - marker: b
    text: లేదా, “యెహోవాయే అతని వాటా.” హీబ్రూ పాఠం ‘స్వాస్థ్యం’ అనే పదాన్ని మళ్లీ ఉపయోగించి, లేవికి దక్కిన స్వాస్థ్యం భూమి కాదు, యెహోవాయేనని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందున్న సందర్భం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְלֵוִי
  choice: లేవికి
  rationale: హీబ్రూలోని ఏకవచన వ్యక్తినామాన్ని నిలుపుతుంది; ఇక్కడ లేవి తన గోత్రానికి ప్రతినిధిగా ఉన్నాడు.
- source_word: חֵלֶק וְנַחֲלָה
  choice: వాటా గానీ స్వాస్థ్యం గానీ
  rationale: రెండు వేర్వేరు హీబ్రూ నామవాచకాలను నిలుపుతూ, భూవిభజనలో లభించే భాగం మరియు వారసత్వ హక్కు అనే భావాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִם אֶחָיו
  choice: తన సహోదరులతో పాటు
  rationale: హీబ్రూ బంధుత్వ పదంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది మిగతా ఇశ్రాయేలు గోత్రాలను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంతో అందిస్తుంది.
- source_word: הוּא נַחֲלָתוֹ
  choice: యెహోవాయే అతని స్వాస్థ్యం
  rationale: ముందటి נַחֲלָה పదాన్ని ‘స్వాస్థ్యం’గా పునరావృతం చేసి, లేవికి భూమి బదులు యెహోవాయే స్వాస్థ్యమనే వ్యత్యాసాన్ని బలపరుస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్లే
  rationale: ‘మాట్లాడాడు/చెప్పాడు’ అనే మూలార్థాన్ని కాపాడుతుంది; హీబ్రూలో స్పష్టంగా లేని ‘వాగ్దానం చేశాడు’ అనే భావాన్ని చేర్చదు.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: మోషే ఇశ్రాయేలును ఏకవచనంలో సంబోధించే నిబంధనాత్మక ప్రయోగాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לוֹ
  choice: అతనితో
  rationale: ఏకవచన సర్వనామాన్ని నిలుపుతూ, లేవిని గోత్ర ప్రతినిధిగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన నామరూపం.
- issue: אֶחָיו లోని లింగసూచక బంధుత్వ పదం
  choice: తన సహోదరులతో
  alternative: తన బంధువులతో / తోటి ఇశ్రాయేలీయులతో
  rationale: మూలంలోని పుంలింగ బహువచన బంధుత్వ రూపాన్ని నిలుపుతుంది; గోత్ర సంబంధ భావాన్ని పాదసూచిక వివరిస్తుంది.
- issue: గోత్రానికి ప్రతినిధిగా ఏకవచన లేవి
  choice: లేవికి
  alternative: లేవి గోత్రానికి
  rationale: మూలపాఠంలోని ఏకవచన వ్యక్తినామాన్ని కాపాడి, దాని సామూహిక గోత్రార్థాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
- issue: యెహోవా లేవి స్వాస్థ్యమనే రూపకం
  choice: యెహోవాయే అతని స్వాస్థ్యం
  alternative: యెహోవాయే అతని వాటా
  rationale: నַחֲלָה పదపు పునరావృతాన్ని నిలిపి, భూస్వాస్థ్యం లేకపోవడం మరియు యెహోవాయే స్వాస్థ్యంగా ఉండడం మధ్య ఉన్న ఉద్దేశపూర్వక ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని మరియు మూలంలోని గోత్ర, స్వాస్థ్య పదజాలాన్ని నిలుపుతూ రూపొందించబడింది. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదసూచికలతో సరిపోతాయి.
