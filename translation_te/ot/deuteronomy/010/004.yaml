id: DEU.10.4
reference: Deuteronomy 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: te
  text: సభ జరిగిన రోజున పర్వతం మీద అగ్ని మధ్యలోనుండి యెహోవా మీతో పలికిన పది వాక్కులను[a] ఆయన ఆ పలకల మీద మొదటి రాతలాగే రాశాడు; యెహోవా వాటిని నాకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా, “పది ఆజ్ఞలు.” హీబ్రూలో, “పది వాక్కులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: రాశాడు
  rationale: כתב క్రియకు సహజమైన తెలుగు సమానార్థకం; తరువాత వచ్చే מִכְתָּב (‘రాత’)తో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: הַלֻּחֹת
  choice: ఆ పలకలు
  rationale: సందర్భంలో నిబంధన పలకలను సూచిస్తుంది. ఈ వచనంలో ‘రాతి’ అని ప్రత్యక్షంగా లేకపోవడంతో దానిని చేర్చలేదు.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: మొదటి రాతలాగే
  rationale: כְּ యొక్క పోలిక భావాన్ని (‘లాగా’) కాపాడుతూ, מִכְתָּב‌ను సహజంగా ‘రాత’ అని అనువదించింది.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: పది వాక్కులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పది మాటలు/వాక్కులు.’ దేవుడు పలికిన నిబంధన వాక్యాలనే సూచిస్తున్నందున గౌరవప్రదమైన ‘వాక్కులు’ ఎంచుకుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన దైవనామ రూపం; బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామాన్ని నిలుపుతుంది.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యలోనుంచి
  rationale: దైవవాక్కు అగ్ని లోపలి నుంచి వచ్చినదనే హీబ్రూ దృశ్యాన్ని నిలుపుతుంది.
- source_word: בְּיוֹם הַקָּהָל
  choice: సమాజం కూడిన రోజున
  rationale: קָהָל‌ను కేవలం సంస్థపేరుగా కాక, ఇశ్రాయేలు ప్రజలు కూడిన సంఘటనగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְּנֵם ... אֵלָי
  choice: తరువాత యెహోవా వాటిని నాకు ఇచ్చాడు
  rationale: కథన క్రమాన్ని తెలుగులో స్పష్టంగా చూపుతుంది; ‘వాటిని’ అనే సర్వనామం పలకలపై రాయబడిన వాటిని సందర్భానుసారంగా సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామాన్ని ఎలా చూపాలి
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తినామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుగా మార్చలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని వాడింది.
- issue: עֲשֶׂרֶת הַדְּבָרִים అనే నిబంధన పదబంధం
  choice: పది వాక్కులు
  alternative: పది ఆజ్ఞలు
  rationale: మూలంలోని דְּבָרִים అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; ఇవి ఆజ్ఞలుగా ప్రసిద్ధమైనవనే సంప్రదాయ భావాన్ని పాదసూచికలో తెలిపింది.
- issue: וַיִּכְתֹּב లోని కర్త
  choice: ఆయన
  alternative: యెహోవా
  rationale: హీబ్రూలో క్రియకు కర్త సర్వనామంగా అంతర్నిహితంగా ఉంది; సమీప సందర్భం యెహోవాను సూచించినా, మూలంలోని సర్వనామాత్మక రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘వాక్కులు,’ ‘యెహోవా’ వంటి గౌరవప్రదమైన బైబిలు పదజాలం నిలుపబడింది. హీబ్రూ దీర్ఘ వాక్యాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించింది.
