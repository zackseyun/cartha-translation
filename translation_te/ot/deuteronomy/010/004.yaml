revisions:
- from: ఆయన మొదటి రాతలాగే ఆ పలకల మీద పది వాక్కులను[a] రాశాడు. సమాజం కూడిన రోజున పర్వతం మీద అగ్ని మధ్యలోనుంచి యెహోవా మీతో పలికిన వాక్కులు అవే. తరువాత యెహోవా వాటిని నాకు ఇచ్చాడు.
  to: సభ జరిగిన రోజున పర్వతం మీద అగ్ని మధ్యలోనుండి యెహోవా మీతో పలికిన పది వాక్కులను[a] ఆయన ఆ పలకల మీద మొదటి రాతలాగే రాశాడు; యెహోవా వాటిని నాకు ఇచ్చాడు.
  rationale: The revision retains the source’s implicit subject (‘ఆయన’), preserves ‘like the first writing,’ and directly connects Yahweh’s Sinai speech with the Ten Words. It also retains the explicit divine name and the lexical footnote without imposing an interpretive rendering.
