translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ వృత్తాంతానికి తగిన సరళమైన గౌరవప్రద శైలి. స్థలనామాలు మూల హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; נַחֲלֵי מָיִם యొక్క భౌగోళిక అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
