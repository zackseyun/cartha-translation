base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: te
  text: అక్కడి నుండి వారు గుద్గోదాకు బయలుదేరారు; గుద్గోదా నుండి నీటి ప్రవాహాలు ఉన్న ప్రాంతమైన యొత్వాతాకు వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీటి వాగులు ఉన్న ప్రాంతం”; హెబ్రీ పదబంధం ప్రవహించే నీటి కాలువలు, వాగులు లేదా నీటితో కూడిన వాడీలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: మునుపటి స్థలం నుండి ప్రయాణం కొనసాగినట్లు సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נָסְעוּ
  choice: బయలుదేరారు
  rationale: అరణ్య ప్రయాణ సందర్భంలో శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచించే נסע భావాన్ని అందిస్తుంది.
- source_word: הַגֻּדְגֹּדָה
  choice: గుద్గోదాకు
  rationale: స్థలనామాన్ని హెబ్రీ రూపానికి దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించి, దిశార్థక విభక్తిని జోడించింది.
- source_word: וּמִן הַגֻּדְגֹּדָה
  choice: గుద్గోదా నుండి
  rationale: ప్రయాణ క్రమంలోని తదుపరి బయలుదేరే స్థలాన్ని సరళంగా సూచిస్తుంది; హెబ్రీ సంధికారకాన్ని తెలుగులో సహజమైన వాక్య సంబంధంతో వ్యక్తం చేస్తుంది.
- source_word: יָטְבָתָה
  choice: యొట్బాతాకు
  rationale: హెబ్రీ స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి గమ్యార్థక విభక్తిని జోడించింది.
- source_word: אֶרֶץ
  choice: ప్రాంతమైన
  rationale: యొట్బాతాను తరువాతి పదబంధం వివరిస్తున్న అన్వయాన్ని తెలుగులో సహజంగా చూపిస్తుంది; ఇక్కడ రాజకీయ దేశం అనే భావాన్ని అనవసరంగా జోడించదు.
- source_word: נַחֲלֵי מָיִם
  choice: నీటి ప్రవాహాలు ఉన్న
  rationale: נַחַל సూచించగల ప్రవాహం, వాగు లేదా నీటి కాలువ అనే అర్థ పరిధిని సాధారణ పాఠకులకు స్పష్టంగా ఉంచుతుంది; భూభాగ స్వరూపాన్ని అతిగా నిర్దిష్టం చేయదు.
