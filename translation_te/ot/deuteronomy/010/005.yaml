id: DEU.10.5
reference: Deuteronomy 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: te
  text: అప్పుడు నేను వెనుతిరిగి, ఆ కొండనుండి దిగి వచ్చి, నేను చేసిన మందసంలో ఆ పలకలను ఉంచాను. యాహ్వే నాకు ఆజ్ఞాపించినట్లే అవి అక్కడ ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “అవి అక్కడ ఉండేవి”; ఈ మాటలు చెప్పిన సమయం వరకూ అవి అక్కడే ఉండిపోయాయని కూడా ఈ పదబంధం సూచించవచ్చు.'
    reason: కాల-స్థితి సంబంధమైన పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: וָאֵפֶן
  choice: అప్పుడు నేను తిరిగి
  rationale: פנה అంటే ‘తిరుగు.’ వావ్-వరుస కథన పురోగతిని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘అప్పుడు’ వాడబడింది.
- source_word: וָאֵרֵד מִן־הָהָר
  choice: కొండ దిగి వచ్చి
  rationale: ירד అంటే ‘దిగు.’ מִן־הָהָר లోని నిర్దిష్టతను సందర్భానుసారంగా ‘కొండ’ తెలియజేస్తుంది; ‘దిగి వచ్చి’ కథనంలో సహజమైన గమనాన్ని ఇస్తుంది.
- source_word: וָאָשִׂם
  choice: ఉంచాను
  rationale: שׂים యొక్క సాధారణ అర్థం ‘పెట్టు, ఉంచు.’ ‘ఉంచాను’ గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: הַלֻּחֹת
  choice: ఆ పలకలను
  rationale: לֻחוֹת అంటే ‘పలకలు.’ నిర్దిష్ట ఉపపదం మరియు ముందరి సందర్భంలో ఇప్పటికే తెలిసిన పలకలనే సూచించడాన్ని ‘ఆ’ తెలియజేస్తుంది; ఈ వాక్యంలో లేని ‘రాతి’ అనే వివరాన్ని చేర్చలేదు.
- source_word: בָּאָרוֹן
  choice: మందసంలో
  rationale: אָרוֹן అంటే పెట్టె లేదా మందసం. నిబంధన సంబంధ సందర్భంలో ‘మందసం’ స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం; בְּ ఇక్కడ లోపల ఉంచడాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: నేను చేసిన
  rationale: సంబంధ వాక్యం మందసాన్ని విశేషిస్తుంది. హీబ్రూ పరిపూర్ణ క్రియకు తెలుగులో సహజమైన ‘చేసిన’ సరిపోతుంది; అవసరం లేని కాలవ్యాఖ్యను జోడించదు.
- source_word: וַיִּהְיוּ שָׁם
  choice: అవి అక్కడ ఉన్నాయి
  rationale: היה + שׁם స్థితిని తెలియజేస్తుంది. ‘ఉన్నాయి’ పలకలు మాట్లాడే సమయం వరకూ అక్కడ ఉన్నాయనే సాధ్యమైన భావాన్ని నిలుపుతుంది; హీబ్రూ కథన రూపంలోని అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: నాకు ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר అనురూపతను, ‘ఎలాగైతే/అలాగే’ అనే భావాన్ని ఇస్తుంది. ‘ఆజ్ఞాపించినట్లే’ దాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణ ‘Yahweh’కు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నిబంధన నామాన్ని ఉపయోగిస్తుంది. అందువల్ల దానిని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని భేదాన్ని కాపాడుతుంది.
- issue: וַיִּהְיוּ שָׁם యొక్క కాలం మరియు కొనసాగింపు భావం
  choice: అవి అక్కడ ఉన్నాయి
  alternative: అవి అక్కడ ఉండేవి / అక్కడే ఉండిపోయాయి
  rationale: ప్రస్తుతకాల తెలుగు రూపం పలకలు వక్త మాట్లాడే సమయం వరకూ అక్కడ ఉన్నాయనే సందర్భోచిత భావాన్ని అందిస్తుంది; అయితే హీబ్రూ రూపం కేవలం గత స్థితిగా కూడా చదవవచ్చు కాబట్టి ఆ అస్పష్టతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘మందసం’ బైబిలు సందర్భానికి తగిన స్థిర పదం; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచబడింది. పాదసూచిక గుర్తు సంబంధిత ‘అవి అక్కడ ఉన్నాయి’ అనే వాక్యభాగం వెంటనే ఉంచబడింది.
