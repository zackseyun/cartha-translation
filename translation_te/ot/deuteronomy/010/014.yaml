- from: ఇదిగో, ఆకాశాలు, అత్యున్నత ఆకాశాలు[a], భూమి, దానిలో ఉన్నదంతా నీ దేవుడైన యాహ్వేకే చెందుతాయి.
  to: ఇదిగో, ఆకాశాలు, అత్యున్నత ఆకాశాలు[a], భూమి, దానిలో ఉన్నదంతా యాహ్వే, నీ దేవునికే చెందినవి.
  rationale: The revision retains every element of the source and the existing footnote while clarifying the syntactic relationship of Yahweh and 'your God' in idiomatic modern Telugu. No doctrinal expansion or interpretive narrowing is introduced.
