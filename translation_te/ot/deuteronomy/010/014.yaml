id: DEU.10.14
reference: Deuteronomy 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: te
  text: ఇదిగో, ఆకాశాలు, అత్యున్నత ఆకాశాలు[a], భూమి, దానిలో ఉన్నదంతా యాహ్వే, నీ దేవునికే చెందినవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆకాశాలు, ఆకాశాల ఆకాశాలు.’
    reason: హీబ్రూ తీవ్రతా నిర్మాణపు అక్షరార్థ రూపాన్ని చూపించి, ప్రధాన పాఠంలోని సహజమైన ‘అత్యున్నత ఆకాశాలు’ అనువాదానికి ఆధారాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ ప్రకటనకు గంభీరమైన నొక్కి చెప్పే భావాన్ని ఇచ్చే సంభాషణ సూచకాన్ని సహజమైన తెలుగు పదంతో నిలిపింది.
- source_word: לַיהוָה
  choice: యాహ్వేకే చెందుతాయి
  rationale: לְ సూచించే స్వామ్య సంబంధాన్ని తెలుగులో స్పష్టంగా తెలిపేందుకు ‘చెందుతాయి’ అనే విధేయాన్ని పూరించి, నొక్కి చెప్పే ‘కే’ను ఉపయోగించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఏకవచన ద్వితీయ పురుష ప్రత్యయాన్ని ‘నీ’గా ఉంచి, ఇశ్రాయేలుతో ఉన్న నిబంధన సంబంధ సంబోధనను విస్తరించకుండా నిలిపింది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచన రూపాన్నీ, విశ్వవ్యాప్త సందర్భాన్నీ ప్రతిబింబిస్తుంది; ‘ఆకాశం’ లేదా ‘నింగి’ కంటే పరిధి విశాలంగా ఉంటుంది.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: అత్యున్నత ఆకాశాలు
  rationale: ‘ఆకాశాల ఆకాశాలు’ అనే హీబ్రూ తీవ్రతా నిర్మాణ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: ఆకాశాలతో సమాంతరంగా, దానిలో ఉన్న సమస్తం ప్రస్తావించబడినందున ఇక్కడ ఒక ప్రాంతం అనే ‘దేశం’ కంటే విశ్వ సంబంధమైన ‘భూమి’ సరిపోతుంది.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్నదంతా
  rationale: భూమిలో ఉన్న సమస్తాన్ని సూచించే సంబంధ వాక్యాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని స్వామ్య ప్రకటనను వాక్యాంతంలోని ‘యాహ్వేకే చెందుతాయి’తో సహజంగా నిర్మించింది; జాబితాలోని విశ్వవ్యాప్త విస్తృతిని నిలిపింది.
