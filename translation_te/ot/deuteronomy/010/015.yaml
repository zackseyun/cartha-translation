revisions:
- from: అయినా యెహోవా మీ పితరులపై ప్రేమానురాగం ఉంచి వారిని ప్రేమించాడు; వారి తరువాత వారి సంతానాన్ని—అంటే మిమ్మల్ని—ప్రజలందరిలోనుండి ఎన్నుకున్నాడు. నేటికీ అలాగే ఉంది.[a]
  to: అయినా, యెహోవా మీ పితరుల పట్ల మక్కువ చూపి వారిని ప్రేమించాడు; వారి తరువాత వారి సంతానమైన మిమ్మల్ని ప్రజలందరిలోనుండి ఎన్నుకున్నాడు—నేడు ఉన్నట్లుగా.[a]
  rationale: The revision replaces an unnecessarily repetitive expression with idiomatic modern Telugu while retaining the source’s paired concepts of attachment and love. It also renders כַּיּוֹם הַזֶּה as a present observable comparison rather than an assertion of uninterrupted continuation.
  reviewer_model: gpt-5.6-terra
