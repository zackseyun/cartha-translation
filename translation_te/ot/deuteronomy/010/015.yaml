id: DEU.10.15
reference: Deuteronomy 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: te
  text: అయినా, యెహోవా మీ పితరుల పట్ల మక్కువ చూపి వారిని ప్రేమించాడు; వారి తరువాత వారి సంతానమైన మిమ్మల్ని ప్రజలందరిలోనుండి ఎన్నుకున్నాడు—నేడు ఉన్నట్లుగా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా మీ పితరులపైనే మక్కువ చూపి వారిని ప్రేమించాడు.”
    reason: రַק అనే పదానికి ‘అయినా’ అనే వ్యత్యాసార్థంతో పాటు ‘మాత్రమే/ప్రత్యేకంగా’ అనే నిర్బంధార్థం సాధ్యం; חָשַׁק ను ‘మక్కువ చూపు’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: רַק
  choice: అయినా
  rationale: ముందటి వచనంలో సమస్తం యెహోవాదే అని చెప్పిన దానికి, ఇక్కడ ఆయన ప్రత్యేకంగా పితరులను ఎంచుకున్నాడనే ఆశ్చర్యకరమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘కేవలం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק יְהוָה
  choice: యెహోవా మీ పితరులపై ప్రేమానురాగం ఉంచి
  rationale: חָשַׁק బలమైన అనుబంధం, ఆప్యాయమైన అభిలాషను సూచిస్తుంది. ‘ప్రేమానురాగం ఉంచి’ అనేది ఉద్దేశపూర్వకమైన, సంబంధాత్మకమైన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְאַהֲבָה אֹתָם
  choice: వారిని ప్రేమించాడు
  rationale: లక్ష్యార్థక క్రియారూపాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తూ, మూలంలోని ‘ప్రేమించు’ అనే స్పష్టమైన పదాన్ని నిలుపుతుంది.
- source_word: וַיִּבְחַר
  choice: ఎన్నుకున్నాడు
  rationale: בחר అనే దైవిక ఎంపికను సూచించే సాధారణ క్రియకు ‘ఎన్నుకున్నాడు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: వారి తరువాత వారి సంతానాన్ని
  rationale: זֶרַע ఇక్కడ సమష్టిగా తరువాతి తరాన్ని సూచిస్తుంది; ‘సంతానం’ ఆ సమష్టి భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בָּכֶם
  choice: అంటే మిమ్మల్ని
  rationale: ప్రస్తుత శ్రోతలే ఆ సంతానం అని వివరించే అన్వయాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: מִכָּל הָעַמִּים
  choice: ప్రజలందరిలోనుండి
  rationale: עַמִּים యొక్క ‘ప్రజలు/జనసమూహాలు’ అనే భావాన్ని, מן యొక్క వేరుచేసి ఎంపిక చేసే భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: నేటికీ అలాగే ఉంది
  rationale: ప్రస్తుత, కనబడుతున్న పరిస్థితి ఈ ఎంపికను ధృవీకరిస్తోందనే హీబ్రూ నుడికార భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: దైవిక ప్రేమ మరియు ఎంపిక
  choice: యెహోవా పితరులపై ప్రేమానురాగం ఉంచి వారిని ప్రేమించాడనీ, వారి సంతానాన్ని ఎన్నుకున్నాడనీ స్పష్టంగా నిలుపడం
  alternative: దీనిని కేవలం చారిత్రక ప్రాధాన్యతగా బలహీనపరచడం లేదా తరువాతి కాలపు ఏదైనా నిర్దిష్ట ఎన్నిక సిద్ధాంతాన్ని వచనంలో విస్తరించి చేర్చడం
  rationale: మూలపాఠం అనురాగం, ప్రేమ, ఎంపిక అనే మూడు సంబంధిత భావాలను స్పష్టంగా చెబుతుంది. అనువాదం వాటిని తగ్గించకుండా, అలాగే ఒక ప్రత్యేక సిద్ధాంత వ్యవస్థగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. ‘పితరులు,’ ‘సంతానం,’ ‘ఎన్నుకున్నాడు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో ఉపయోగించాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
