revisions:
- from: తండ్రిలేనివారికీ విధవరాలికీ న్యాయం జరిగేలా చేసేవాడు ఆయనే; మీ మధ్య నివసించే విదేశీయుణ్ణి ప్రేమించి, అతనికి ఆహారమూ వస్త్రమూ ఇస్తాడు.[a]
  to: తండ్రిలేనివారికీ విధవరాలికీ న్యాయం జరిగించేవాడు, నివసించే విదేశీయుణ్ణి ప్రేమించి అతనికి ఆహారమూ వస్త్రమూ ఇచ్చేవాడు.[a][b]
  rationale: 'The revision retains the verse''s two coordinated descriptions of God: he administers justice for the fatherless and widow, and he loves the resident foreigner by supplying food and clothing. It removes unsupported emphasis and an explicit locative addition, while preserving the semantic residential force of גֵּר through wording and a footnote.'
  reviewer_model: gpt-5.6-terra
