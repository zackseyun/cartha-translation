  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: te
  text: తండ్రిలేనివారికీ విధవరాలికీ న్యాయం జరిగించేవాడు, నివసించే విదేశీయుణ్ణి ప్రేమించి అతనికి ఆహారమూ వస్త్రమూ ఇచ్చేవాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నివసించే విదేశీయుడు’ అనే మాట హెబ్రీ గేర్‌ను సూచిస్తుంది; ఇది కేవలం దారిన పోయే అపరిచితుణ్ణి కాదు, సమాజంలో నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆహారమూ వస్త్రమూ’—అక్షరార్థంగా ‘రొట్టెయూ వస్త్రమూ.’ ఇక్కడ ‘రొట్టె’ సాధారణంగా ఆహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: న్యాయం జరిగేలా చేసేవాడు
  rationale: ఈ హెబ్రీయ ఇడియమ్ సాధారణంగా ‘చేయడం’ కాక, బలహీనులకు రావలసిన న్యాయాన్ని అమలు చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రూపం న్యాయపరమైన క్రియాశీలతను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేనివారు
  rationale: ఈ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయిన వ్యక్తిని సూచిస్తుంది; ‘అనాథ’ కంటే మూలంలోని న్యాయ-సామాజిక సూక్ష్మార్థాన్ని ఇది మరింత స్పష్టంగా నిలుపుతుంది.
- source_word: אַלְמָנָה
  choice: విధవరాలు
  rationale: మూలంలో పేర్కొన్న బలహీన సామాజిక వర్గానికి సరళమైన, ఖచ్చితమైన తెలుగు సమానార్థకం.
- source_word: אֹהֵב
  choice: ప్రేమించి
  rationale: దేవుని క్రియాశీలమైన అనురాగ వైఖరిని నేరుగా వ్యక్తపరుస్తుంది; తరువాతి భౌతిక పోషణతో వ్యాకరణపరంగా సహజంగా కలుస్తుంది.
- source_word: גֵּר
  choice: మీ మధ్య నివసించే విదేశీయుడు
  rationale: ఇది కేవలం బాటసారి లేదా అపరిచితుడు కాక, ఇశ్రాయేలు సమాజంలో నివసిస్తున్న స్థానికేతరుణ్ణి సూచిస్తుంది. సందర్భానుగుణమైన ‘మీ మధ్య’ భావాన్ని స్పష్టపరచి పదానికి ఉన్న నివాస-చట్టపరమైన భావాన్ని అందిస్తుంది.
- source_word: לָתֶת לוֹ
  choice: అతనికి ... ఇస్తాడు
  rationale: దేవుని ప్రేమ భౌతిక పోషణలో వ్యక్తమవుతుందని తెలిపే ఉద్దేశ్య/ఫలిత సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఉంచుతుంది.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: అక్షరార్థం ‘రొట్టె’; వస్త్రంతో జతగా ఇక్కడ జీవనాధారమైన ఆహారాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: שִׂמְלָה
  choice: వస్త్రం
  rationale: దుస్తులు లేదా కప్పుకునే వస్త్రాన్ని సూచించే సాధారణ పదం; ఆహారంతో కలిసి ప్రాథమిక అవసరాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: బలహీన వర్గాల పట్ల దేవుని శ్రద్ధ
  choice: దేవుడు వారికి న్యాయం జరిగేలా చేయడాన్నీ, విదేశీయుణ్ణి ప్రేమించి భౌతిక అవసరాలు తీర్చడాన్నీ రెండింటినీ నిలిపి ఉంచడం
  alternative: కేవలం చట్టపరమైన పరిరక్షణను లేదా కేవలం భావోద్వేగ కరుణను మాత్రమే ప్రధానంగా చూపడం
  rationale: హెబ్రీ పాఠం న్యాయపరమైన చర్యను, ప్రేమను, ఆ ప్రేమకు రూపమైన ఆహార-వస్త్రాల provisionను కలిపి చెబుతుంది; ఏ కోణాన్నీ మరొకదిలో కలిపివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తండ్రిలేనివారు’ మూలంలోని సామాజిక-చట్టపరమైన ఖచ్చితత్వాన్ని నిలుపుతుంది; ‘మీ మధ్య నివసించే విదేశీయుడు’ גֵּר అనే పదం సూచించే స్థిరనివాసి విదేశీయుని భావాన్ని సహజంగా వివరిస్తుంది.
