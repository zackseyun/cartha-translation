source:
  edition: WLC
  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: te
  text: కాబట్టి పరదేశిని[a] ప్రేమించండి; ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వలసవాసిని,’ ‘అన్యదేశ నివాసిని.’ హీబ్రూ గేర్ అనే పదం ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: కాబట్టి ... ప్రేమించండి
  rationale: אהב అంటే ‘ప్రేమించు.’ ముందటి వచనంలో దేవుడు పరదేశిని ప్రేమిస్తున్నాడనే మాటకు ఇది అనుసంధానమై ఉంది. అందువల్ల వావ్ సంధిని ‘కాబట్టి’గా పలకడం సందర్భంలోని నిర్దేశాత్మక, పర్యవసాన భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַ/גֵּר
  choice: పరదేశిని
  rationale: גֵּר అనేది ఇశ్రాయేలీయుల మధ్య నివసించే, స్థానికుడు కాని వ్యక్తిని—సామాజికంగా సులభంగా అసురక్షిత స్థితిలో ఉండగల నివాసిని—సూచిస్తుంది. ‘పరదేశి’ ఈ బయటి వ్యక్తి స్థితిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది; అతడు కేవలం దారినపోయే ప్రయాణికుడని సూచించదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే కారణార్థక సంధి; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: גֵרִים
  choice: పరదేశులుగా
  rationale: גֵּר యొక్క బహువచనం. మొదటి ప్రయోగంలోని ‘పరదేశి’తో పదసామ్యాన్ని నిలిపి, ఐగుప్తులో ఇశ్రాయేలీయుల నివాసి-విదేశీయ స్థితిని తెలియజేస్తుంది.
- source_word: הֱיִיתֶם
  choice: ఉన్నారు
  rationale: היה ఇక్కడ గతకాల అస్తిత్వ/స్థితి భావంలో ఉంది. ‘మీరు ... ఉన్నారు’ వారి గత సామాజిక స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: אֶרֶץ (‘దేశం/భూమి’) అనే మూలపదాన్ని వదలకుండా, హీబ్రూ పదబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో גֵּר అనే సామాజిక గుర్తింపు పదం
  choice: పరదేశి
  alternative: వలసవాసి / అన్యదేశ నివాసి / అపరిచితుడు
  rationale: ఈ ఆజ్ఞకు ఇశ్రాయేలీయులు ఐగుప్తులో తామే బయటి వారిగా నివసించిన అనుభవం ఆధారం. ‘పరదేశి’ ఆ నైతిక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ఆధునిక న్యాయపరమైన వర్గీకరణను రుద్దదు, అలాగే ‘అపరిచితుడు’ అన్నట్లుగా కేవలం తెలియని వ్యక్తి అనే భావానికి కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం ఉపయోగించబడింది. ‘కాబట్టి’ ముందటి వచనంతో తార్కిక అనుసంధానాన్ని చూపుతుంది. ‘పరదేశి’ అందరికీ అర్థమయ్యే పదమే అయినా దాని నివాసి-విదేశీయ భావపరిధిని పాదసూచికలో వివరించాం.
