revisions:
- from: అప్పుడు యహ్వే అగ్ని మధ్యలోనుండి మీతో మాట్లాడాడు.[a] మీరు మాటల స్వరాన్ని విన్నారు,[b] కానీ ఏ రూపమూ మీకు కనిపించలేదు[c]—స్వరం మాత్రమే వినిపించింది.
  to: అప్పుడు యహ్వే అగ్ని మధ్యలోనుండి మీతో మాట్లాడాడు.[a] మీరు మాటల ధ్వనిని విన్నారు,[b] కానీ స్వరం తప్ప మీకు ఏ రూపమూ కనిపించలేదు.[c]
  rationale: 'The revision directly represents the Hebrew exception זוּלָתִי (‘except, only’) with ‘స్వరం తప్ప.’ This maintains the intended contrast: Israel heard articulated speech but saw no visible form. It makes no doctrinal expansion and retains the original footnote content and anchors.'
