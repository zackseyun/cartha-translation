  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: te
  text: అప్పుడు యహ్వే అగ్ని మధ్యలోనుండి మీతో మాట్లాడాడు.[a] మీరు మాటల ధ్వనిని విన్నారు,[b] కానీ స్వరం తప్ప మీకు ఏ రూపమూ కనిపించలేదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అగ్నిలోనుండి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘మాటల స్వరం/ధ్వని’; ‘పలుకుల ధ్వని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘రూపం’ అనే పదాన్ని ‘పోలిక,’ ‘ఆకారం,’ లేదా ‘కనిపించే ప్రతిరూపం’ అని కూడా అనువదించవచ్చు. కనిపించే రూపమేదీ చూడలేదని హీబ్రూ నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఒడంబడిక నామానికి సాధారణంగా అంగీకరించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: דבר అనే క్రియకు ఇక్కడ సహజమైన అర్థం ‘మాట్లాడు’; కథనంలోని భూతకాల సందర్భాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యలోనుండి
  rationale: מִתּוֹךְ సూచించే ‘లోపలి మధ్యనుండి’ అనే భావాన్ని కేవలం ‘అగ్నినుండి’ అని సరళీకరించకుండా నిలుపుతుంది.
- source_word: קוֹל דְּבָרִים
  choice: మాటల స్వరం
  rationale: קוֹל అంటే ‘స్వరం/ధ్వని’, דְּבָרִים అంటే ‘మాటలు’; ఇది అస్పష్టమైన శబ్దం కాకుండా వినిపించిన పలుకులను సూచించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שֹׁמְעִים
  choice: విన్నారు
  rationale: రూపరీత్యా కృదంతమైనా, ఈ గతకాల ప్రసంగ సందర్భంలో తెలుగు finite భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: תְמוּנָה
  choice: రూపం
  rationale: కనిపించే ఆకారం, పోలిక లేదా ప్రతిరూపాన్ని సూచించే విస్తృత అర్థాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: אֵינְכֶם רֹאִים
  choice: ఏ రూపమూ మీకు కనిపించలేదు
  rationale: చూడటానికి దృశ్యరూపం ఏదీ లేదనే భావాన్ని సహజమైన తెలుగులో తెలుపుతుంది; ‘మీకు’ అనేది ఇశ్రాయేలీయుల ప్రత్యక్ష అనుభవాన్ని స్పష్టం చేస్తుంది.
- source_word: זוּלָתִי קוֹל
  choice: స్వరం మాత్రమే వినిపించింది
  rationale: זוּלָתִי తెలిపే మినహాయింపును నిలుపుతూ, కనిపించని రూపానికి విరుద్ధంగా వినిపించిన స్వరాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ప్రత్యక్షతలో వినిపించిన ప్రకటనకు, కనిపించని రూపానికి మధ్య ఉన్న వ్యత్యాసం
  choice: నిజమైన దైవవాక్యం వినిపించిందని, అయితే ఏ దృశ్యరూపమూ కనిపించలేదని నేరుగా ఉంచడం
  alternative: ‘ఆయన స్వరం విన్నారు, కానీ ఆయనకు సంబంధించిన ప్రతిరూపం ఏదీ చూడలేదు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలవాక్యం శ్రవణానుభవం మరియు దృశ్యరూపం లేకపోవడం మధ్య ఉద్రిక్తతను ఉంచుతుంది. అనువాదం దానిని తరువాతి విగ్రహారాధన సిద్ధాంత భాషతో విస్తరించదు; అలాగే ‘రూపం’ ఎవరిదో అదనంగా చేర్చి అస్పష్టతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కథనశైలి వాడబడింది. ‘యహ్వే’ ద్వారా దైవ నామం నిలుపబడింది. ‘అగ్ని మధ్యలోనుండి,’ ‘మాటల స్వరం,’ ‘ఏ రూపమూ కనిపించలేదు’ అనే పదబంధాలు మూలంలోని శ్రవణ–దృశ్య వ్యత్యాసాన్ని సహజంగా కాపాడుతాయి.
