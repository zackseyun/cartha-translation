translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన శైలి. హీబ్రూ న్యాయపదాల త్రిభేదాన్ని ‘సాక్ష్యాలు, శాసనాలు, న్యాయవిధులు’గా నిలిపాం. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం తెలుగులో పురుషులను మాత్రమే సూచిస్తున్నట్టు అపార్థం కలిగించగలదని, సందర్భానుసారంగా మొత్తం ప్రజలను సూచించే ‘ఇశ్రాయేలీయులు’ వాడాం.
