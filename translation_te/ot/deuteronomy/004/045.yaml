source:
  edition: WLC
  text: אֵ֚לֶּה הָֽ/עֵדֹ֔ת וְ/הַֽ/חֻקִּ֖ים וְ/הַ/מִּשְׁפָּטִ֑ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: te
  text: ఇశ్రాయేలీయులు ఐగుప్తు నుండి బయలుదేరినప్పుడు మోషే వారితో చెప్పిన సాక్ష్యాలు, శాసనాలు, న్యాయవిధులు ఇవే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: తరువాత పేర్కొనే న్యాయవర్గాలను సూచించే బహువచన నిర్దేశక పదం; తెలుగు వాక్యంలో నామవాక్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעֵדֹת
  choice: సాక్ష్యాలు
  rationale: ఒడంబడికకు సాక్ష్యంగా నిలిచే ఆదేశాల భావాన్ని నిలుపుతూ, חֻקִּים మరియు מִשְׁפָּטִים నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: הַחֻקִּים
  choice: శాసనాలు
  rationale: నిర్ణయించి విధించిన నియమాల న్యాయపరమైన భావాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయనిర్ణయాలు లేదా అమలుచేయవలసిన న్యాయనియమాలు అనే భావాన్ని ఇస్తూ, ఇతర రెండు న్యాయపదాల నుండి భేదాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר דִּבֶּר
  choice: చెప్పిన
  rationale: דבר యొక్క సాధారణ మాటలాడే భావాన్ని అతిగా అధికారిక ప్రకటనగా మార్చకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు … వారితో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సమగ్రంగా, సహజంగా ఉంది.
- source_word: בְּצֵאתָם
  choice: బయలుదేరినప్పుడు
  rationale: ఉపసర్గతో కూడిన infinitive construct యొక్క కాలసంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి
  rationale: భౌగోళిక మూలస్థానాన్ని స్పష్టంగా చూపే సంప్రదాయబద్ధమైన, సులభంగా అర్థమయ్యే రూపం.
