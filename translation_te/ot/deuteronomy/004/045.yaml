  source_fidelity: హీబ్రూ వాక్యంలోని మూడు న్యాయపరమైన వర్గాలు—הָעֵדֹת, הַחֻקִּים, הַמִּשְׁפָּטִים—వరుసగా ‘సాక్ష్యాలు, శాసనాలు, న్యాయవిధులు’గా స్పష్టంగా వేరుచేయబడ్డాయి. ‘ఇవే’ హీబ్రూ אֵלֶּה యొక్క సూచక-పరిచయ పాత్రను సహజంగా వ్యక్తం చేస్తుంది. ‘ఇశ్రాయేలీయులు’ అనేది బְּנֵי יִשְׂרָאֵלకు సందర్భానుగుణమైన, సమగ్ర ప్రజాసూచక అనువాదం. కాలసూచకమైన ‘బయలుదేరినప్పుడు’ మరియు ‘ఐగుప్తు నుండి’ కూడా మూలానికి నమ్మకంగా ఉన్నాయి.
