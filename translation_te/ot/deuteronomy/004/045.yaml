  terminology: ‘సాక్ష్యాలు, శాసనాలు, న్యాయవిధులు’ అనే త్రయం చట్టపరమైన రిజిస్టర్‌ను నిలుపుతూ పరస్పర పదభేదాన్ని కాపాడుతుంది. ‘మోషే’ మరియు ‘ఐగుప్తు’ పేర్ల వాడుక స్థిరమైన తెలుగు బైబిలు సంప్రదాయానికీ ఆధునిక వినియోగానికీ అనుకూలంగా ఉంది.
