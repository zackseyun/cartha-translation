  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: te
  text: మీరు భ్రష్టంగా ప్రవర్తించకుండా, మగదాని లేదా ఆడదాని పోలికగల ఏ ఆకృతి రూపంలోనైనా చెక్కిన ప్రతిమను మీ కోసం చేసుకోకుండా జాగ్రత్తపడండి[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మిమ్మల్ని మీరు చెడగొట్టుకొని, ఏ ఆకృతి రూపంలోనైనా, మగదాని లేదా ఆడదాని పోలికగా చెక్కిన ప్రతిమను మీ కోసం చేసుకోకుండా.”
    reason: పֶן మరియు תַּשְׁחִתוּן యొక్క హెచ్చరికాత్మక, ఆత్మవాచక-సంభావ్య అనువాదాన్ని సూచించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: פֶּן
  choice: చేసుకోకుండా జాగ్రత్తపడండి
  rationale: פֶּן అవాంఛనీయ పరిణామాన్ని గురించి హెచ్చరికను పరిచయం చేస్తుంది. తెలుగు వాక్యనిర్మాణంలో చివర ఉంచిన ‘చేయకుండా జాగ్రత్తపడండి’ ఆ హెచ్చరిక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תַּשְׁחִתוּן
  choice: చెడుగా ప్రవర్తించి
  rationale: שׁחת హిఫీల్ రూపం ఇక్కడ నిబంధనకు విరుద్ధంగా భ్రష్టంగా లేదా వినాశకరంగా ప్రవర్తించడాన్ని సూచిస్తుంది. ‘చెడుగా ప్రవర్తించి’ క్రియాశీల నైతిక భావాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: మీ కోసం ... చేసుకోకుండా
  rationale: לָכֶם లోని తమ కొరకు చేసుకొనే ప్రయోజనార్థక భావాన్ని ‘మీ కోసం’ మరియు ‘చేసుకో-’ కలిసి నిలుపుతున్నాయి.
- source_word: פֶּסֶל
  choice: చెక్కిన ప్రతిమను
  rationale: פֶּסֶל చెక్కి లేదా మలిచి తయారుచేసిన ప్రతిరూపాన్ని సూచిస్తుంది. ‘చెక్కిన ప్రతిమ’ తయారీ విధానాన్ని స్పష్టంగా ఉంచి, ‘విగ్రహం’ అనే వ్యాఖ్యాత్మక సంకుచితతను నివారిస్తుంది.
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: ఏ రూపంలోనైనా
  rationale: ఈ పదబంధం ఏ విధమైన ఆకృతి లేదా ప్రతినిధి రూపాన్నైనా సూచిస్తుంది. తెలుగులో ‘ఏ రూపంలోనైనా’ సంక్షిప్తంగా, సహజంగా ఉండి విస్తృత పరిధిని కాపాడుతుంది.
- source_word: תַּבְנִית
  choice: పోలికగల
  rationale: תַּבְנִית ఇక్కడ నమూనా, ఆకారం లేదా పోలికను సూచిస్తుంది. ‘పోలికగల’ తరువాతి ‘మగదాని లేదా ఆడదాని’తో సహజంగా అనుసంధానమవుతుంది.
- source_word: זָכָר אֹו נְקֵבָה
  choice: మగదాని లేదా ఆడదాని
  rationale: ఇవి వయోజన మానవ సామాజిక పదాలు కాక, లింగాన్ని సూచించే విస్తృత జీవశాస్త్రీయ పదాలు. అందువల్ల ‘పురుషుడు లేదా స్త్రీ’ కంటే ‘మగదాని లేదా ఆడదాని’ పరిధిని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: విగ్రహారాధన వ్యతిరేక పదజాలం
  choice: פֶּסֶל‌ను ‘చెక్కిన ప్రతిమ’గా, మిగిలిన రూపపదాలను ‘రూపం/పోలిక’గా అనువదించడం
  alternative: פֶּסֶל మరియు סָמֶל రెండింటినీ ‘విగ్రహం’గా అనువదించడం
  rationale: హీబ్రూ పాఠంలోని పరస్పరం మిళితమైన ప్రతిరూప పదాలను ఒకే మతపర పదంగా సమతలపరచకుండా, తయారుచేసిన ప్రతిమ, రూపం, పోలిక అనే భావస్థరాలను నిలుపుతుంది. సందర్భమే నిషిద్ధ ఆరాధనా ప్రతిరూప భావాన్ని తెలియజేస్తుంది.
- issue: תַּשְׁחִתוּן యొక్క క్రియాశీలత లేదా ఆత్మవాచకత
  choice: ‘చెడుగా ప్రవర్తించి’ అనే క్రియాశీల భావం
  alternative: ‘మిమ్మల్ని మీరు చెడగొట్టుకొని’
  rationale: హిఫీల్ రూపం రెండింటికీ అవకాశం ఇచ్చినా, సందర్భంలో నిషిద్ధ ప్రతిమను తయారుచేయడం ద్వారా అవినీతిగా ప్రవర్తించడమే ముందుకు వస్తుంది. ప్రధాన పాఠం క్రియాశీల నైతిక భావాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర హెచ్చరికకు తగిన గంభీరతతో. ఈ వచనం తదుపరి జాబితాతో కొనసాగుతున్నందున చివర దీర్ఘ డాష్ ఉంచబడింది.
