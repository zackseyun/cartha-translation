revisions:
- from: మీరు చెడుగా ప్రవర్తించి, మగదాని లేదా ఆడదాని పోలికగల ఏ రూపంలోనైనా మీ కోసం ఒక చెక్కిన ప్రతిమను చేసుకోకుండా జాగ్రత్తపడండి—
  to: మీరు భ్రష్టంగా ప్రవర్తించకుండా, మగదాని లేదా ఆడదాని పోలికగల ఏ ఆకృతి రూపంలోనైనా చెక్కిన ప్రతిమను మీ కోసం చేసుకోకుండా జాగ్రత్తపడండి[a]—
  rationale: The revision preserves the Hebrew warning’s two coordinated prohibitions, represents the successive image-related terms more fully, and improves modern Telugu flow. It retains the gender terms’ broad biological reference rather than substituting adult social categories such as ‘పురుషుడు/స్త్రీ.’
