review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the principal Hebrew clauses: distress, the arrival of the warned-of events, the temporal expression בְּאַחֲרִית הַיָּמִים, return to Yahweh, and hearing/heeding his voice. ‘చివరి రోజుల్లో’ appropriately preserves the source’s traditional wording without forcing a defined eschatological scheme.'
  naturalness: The repeated temporal construction ‘నీవు కష్టంలో ఉన్నప్పుడు, ఈ సంగతులన్నీ నీకు సంభవించినప్పుడు’ is somewhat cumbersome in modern standard Telugu. A small restructuring makes the relation of the clauses smoother while retaining the Hebrew’s temporal openness.
  terminology: ‘యహ్వే,’ ‘నీ దేవుడైన,’ and ‘ఆయన మాట వింటావు’ are suitable. ‘ఆయన మాట వింటావు’ retains the auditory wording while the footnote properly notes the accompanying sense of obedience. ‘వైపు తిరిగి’ is more idiomatic and relationally apt than ‘దగ్గరకు తిరిగి వచ్చి’ for return to God.
  issues:
  - severity: low
    issue: Repeated ‘ఉన్నప్పుడు/సంభవించినప్పుడు’ temporal phrasing
    rationale: Although understandable, two adjacent ‘when’ clauses are stylistically heavy. Recasting the first as ‘ఉండి’ improves Telugu flow without adding a sequential meaning absent from the Hebrew.
  - severity: low
    issue: ‘దగ్గరకు తిరిగి వచ్చి’ for שׁוּב עַד
    rationale: This is comprehensible, but ‘యహ్వే వైపు తిరిగి’ is more natural for a relational/covenantal turning and does not imply a merely spatial approach.
