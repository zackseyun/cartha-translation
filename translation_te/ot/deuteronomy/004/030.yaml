base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: te
  text: నీవు కష్టంలో ఉండి, ఈ సంగతులన్నీ నీకు సంభవించినప్పుడు, చివరి రోజుల్లో[a] నీవు నీ దేవుడైన యహ్వే వైపు తిరిగి, ఆయన మాట వింటావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాబోయే రోజుల్లో’ అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ పదబంధం విస్తృతంగా భవిష్యత్ కాలాన్ని సూచించవచ్చు; దాన్ని తప్పనిసరిగా ఒక నిర్దిష్ట అంత్యకాల పథకానికే పరిమితం చేయనవసరం లేదు.
    reason: alternative_reading
  - marker: b
    text: ‘ఆయన మాటకు లోబడతావు’ అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ ప్రయోగంలో వినడమంటే తరచుగా శ్రద్ధగా ఆలకించి విధేయత చూపడం కూడా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: నీవు కష్టంలో ఉన్నప్పుడు
  rationale: צַר కష్టం, ఇబ్బంది లేదా ఆపదలో ఉన్న స్థితిని సూచిస్తుంది. క్రియలేని హీబ్రూ ప్రారంభ వాక్యభాగంలోని కాలసంబంధ భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఉన్నప్పుడు’ వాడబడింది.
- source_word: וּמְצָאֻךָ כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులన్నీ నీకు సంభవించినప్పుడు
  rationale: מצא అక్షరార్థంగా ‘కనుగొను’ అయినా, ఇక్కడ హెచ్చరించబడిన ఘటనలు వ్యక్తిని చేరడాన్ని సూచిస్తుంది. ‘సంభవించు’ సందర్భానుకూలమైన సహజ తెలుగు; דְּבָרִים ఇక్కడ మాటలకంటే ఘటనలు లేదా సంగతులను సూచిస్తుంది.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: చివరి రోజుల్లో
  rationale: హీబ్రూ నుడికారంలోని రూపకల్పనను, దాని వేదాంతపరమైన ప్రతిధ్వనిని నిలుపుతుంది; ఇది తప్పనిసరిగా ఒక నిర్దిష్ట అంత్యకాల పథకానికే పరిమితం కాదని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: וְשַׁבְתָּ עַד
  choice: తిరిగి వచ్చి
  rationale: שׁוּב + עַד ఒకరి దగ్గరకు తిరిగి రావడం లేదా మరలడం అనే సంబంధపూర్వక భావాన్ని ఇస్తుంది. మూలంలో స్పష్టంగా లేని విస్తృత సిద్ధాంతార్థాన్ని చేర్చకుండా నిబంధన సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన సంబంధప్రత్యయాన్ని సహజ తెలుగులో నిలుపుతూ, వ్యక్తిగత నిబంధన సంబోధనను కాపాడుతుంది.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: ఆయన మాట వింటావు
  rationale: ఈ హీబ్రూ ప్రయోగంలో వినడం మాత్రమే కాక శ్రద్ధగా ఆలకించి లోబడడం కూడా అంతర్భూతం కావచ్చు. ‘మాట వింటావు’ తెలుగులో శ్రవణ రూపకాన్నీ విధేయత సూచననూ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים అనే కాలసూచక పదబంధాన్ని నిర్దిష్ట అంత్యకాల సిద్ధాంతంగా చదివే అవకాశం
  choice: చివరి రోజుల్లో
  alternative: రాబోయే రోజుల్లో
  rationale: ఎంపిక చేసిన అనువాదం హీబ్రూ నుడికారపు సాహిత్య, వేదాంత ప్రతిధ్వనిని నిలుపుతుంది; పాదటిప్పణి దాని విస్తృత భవిష్యత్ కాలార్థాన్ని చూపి, ఒక నిర్దిష్ట అంత్యకాల వ్యవస్థను వచనంపై రుద్దకుండా ఉంచుతుంది.
- issue: וְשַׁבְתָּ עַד יְהוָה లోని నిబంధన సంబంధిత తిరిగిరావడం
  choice: నీ దేవుడైన యహ్వే దగ్గరకు తిరిగి వచ్చి
  alternative: పశ్చాత్తాపపడి నీ దేవుడైన యహ్వే వైపు తిరిగి
  rationale: ‘తిరిగి రావడం’ మూల క్రియలోని సంబంధపూర్వక, నిబంధన సంబంధిత భావాన్ని నిలుపుతుంది. ‘పశ్చాత్తాపపడడం’ సందర్భానికి అనుకూలమైన భావమైనా, క్రియలో ప్రత్యక్షంగా ఉన్నదానికంటే ఎక్కువ సిద్ధాంత వివరణను జోడించవచ్చు.
- issue: וְשָׁמַעְתָּ בְּקֹלוֹ లో వినడం మరియు విధేయత మధ్య భావసాంద్రత
  choice: ఆయన మాట వింటావు
  alternative: ఆయన మాటకు లోబడతావు
  rationale: ఎంపిక చేసిన రూపం హీబ్రూలోని శ్రవణ రూపకాన్ని నిలుపుతూ తెలుగులో విధేయత భావాన్నీ సూచిస్తుంది; ప్రత్యామ్నాయం అంతర్భూతమైన విధేయతను స్పష్టపరుస్తుంది కానీ ‘వినడం’ అనే రూపకాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘యహ్వే’ దైవనామాన్ని నేరుగా లిప్యంతరీకరిస్తుంది. ‘మాట వింటావు’ సాధారణ పాఠకులకు సహజంగా ఉండి, వినడం–లోబడడం అనే మూలంలోని భావసాంద్రతను కాపాడుతుంది. పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
