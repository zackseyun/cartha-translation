revisions:
- from: నీవు కష్టంలో ఉన్నప్పుడు, ఈ సంగతులన్నీ నీకు సంభవించినప్పుడు, చివరి రోజుల్లో[a] నీవు నీ దేవుడైన యహ్వే దగ్గరకు తిరిగి వచ్చి, ఆయన మాట వింటావు[b].
  to: నీవు కష్టంలో ఉండి, ఈ సంగతులన్నీ నీకు సంభవించినప్పుడు, చివరి రోజుల్లో[a] నీవు నీ దేవుడైన యహ్వే వైపు తిరిగి, ఆయన మాట వింటావు[b].
