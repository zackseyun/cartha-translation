id: DEU.4.25
reference: Deuteronomy 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: te
  text: మీకు పిల్లలూ మనవలూ కలిగి[a], మీరు ఆ దేశంలో చాలాకాలం నివసించి[b], భ్రష్టుపడి, ఏదైనా రూపాన్ని పోలిన చెక్కిన ప్రతిమను చేసి[c], మీ దేవుడైన యాహ్వే దృష్టిలో చెడ్డది చేసి ఆయనకు కోపం తెప్పిస్తే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కుమారులనూ కుమారుల కుమారులనూ.” ఇక్కడ ఈ పుంలింగ పదాలు తరతరాల సంతానాన్ని సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ దేశంలో ముసలివారైన తరువాత.” హీబ్రూ క్రియ వృద్ధాప్యం చెందడాన్ని లేదా చాలాకాలం అక్కడ స్థిరపడివుండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దేనిపోలికలోనైనా”; “ఏ ఆకారమైనా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: …తరువాత … చేస్తే
  rationale: ఇక్కడి כִּי భవిష్యత్తులో సంభవించగల పరిస్థితిని ప్రవేశపెడుతుంది; తదుపరి వచనంలో ప్రధాన హెచ్చరిక కొనసాగుతుంది. తెలుగులో కాలార్థం, షరతు రెండూ సహజంగా వ్యక్తమయ్యేలా వాక్యాన్ని నిర్మించాం.
- source_word: תוֹלִיד
  choice: కని
  rationale: హిఫిల్ రూపం సంతానాన్ని కనడం/కలగజేయడం అనే భావాన్ని ఇస్తుంది. ఏకవచన పురుష సంబోధన తెలుగులో క్రియారూపం ద్వారా స్పష్టంగా ఉండదు; అయినా సహజమైన ‘కని’ మూల భావాన్ని అందిస్తుంది.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: పిల్లలనూ మనవలనూ
  rationale: అక్షరార్థంగా ‘కుమారులనూ కుమారుల కుమారులనూ’; అయితే వంశతరాల సందర్భంలో ఇవి సాధారణంగా సంతానాన్ని సూచిస్తాయి. ‘పిల్లలు, మనవలు’ తరాల భావాన్ని సహజంగా తెలుపుతుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటీపులో ఉంచాం.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: ఆ దేశంలో చాలాకాలం నివసించిన తరువాత
  rationale: נוֹשַׁנְתֶּם వృద్ధాప్యం చెందడం లేదా చాలాకాలం స్థిరపడివుండడం అనే భావవ్యాప్తి కలిగి ఉంది. సందర్భంలో దేశంలో దీర్ఘకాల స్థిరనివాసం ప్రధానంగా కనిపిస్తుంది; నిజమైన ద్వంద్వార్థాన్ని పాదటీపులో సూచించాం.
- source_word: וְהִשְׁחַתֶּם
  choice: చెడిపోయి
  rationale: שׁחת హిఫిల్ ఇక్కడ విగ్రహారాధన ద్వారా నైతికంగా లేదా నిబంధనపరంగా భ్రష్టుపట్టడాన్ని సూచిస్తుంది. ‘చెడిపోయి’ సహజమైనది, అనవసరంగా కర్మక లేదా ఆత్మనేపద భావాన్ని ఖరారు చేయదు.
- source_word: פֶּסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: ఈ పదం చెక్కి లేదా మలిచి చేసిన ప్రతిమను సూచిస్తుంది. ‘విగ్రహం’ కంటే ‘చెక్కిన ప్రతిమ’ మూలపదంలోని తయారీ విధానాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: תְּמוּנַת כֹּל
  choice: ఏ రూపానికైనా
  rationale: ఏదైనా ఆకారం లేదా పోలికకు ప్రతినిధిగా చేసిన ప్రతిమ అనే సమగ్ర నిషేధాన్ని ఈ పదబంధం సూచిస్తుంది. ఇతర సాధ్యమైన అర్థఛాయలను పాదటీపులో ఇచ్చాం.
- source_word: הָרַע בְּעֵינֵי
  choice: దృష్టికి చెడ్డదాన్ని
  rationale: ‘కళ్లలో చెడ్డది’ అనే హీబ్రూ మూలరూపకాన్ని తెలుగులో సహజమైన ‘దృష్టికి చెడ్డది’గా అందించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’; బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా చతురక్షర దైవనామాన్ని పేరుగా నిలుపుతుంది.
- source_word: לְהַכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టిస్తే
  rationale: కారణార్థక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ఈ క్రియ ముందున్న చెడు కార్యాల ఫలితం లేదా ఉద్దేశాన్ని సూచించగలదు; అనువాదం దానిని అనవసరంగా మరింత నిర్దిష్టం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నామమైన చతురక్షర నామం నేరుగా ఉంది. తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా కాపాడుతుంది; ‘యాహ్వే’ ఉచ్చారణపరమైన ప్రత్యామ్నాయం.
- issue: בָּנִים וּבְנֵי בָנִים లోని పుంలింగ వంశపదాలు
  choice: పిల్లలనూ మనవలనూ
  alternative: కుమారులనూ కుమారుల కుమారులనూ
  rationale: నిబంధన హెచ్చరికలో ఈ పుంలింగ పదాలు తరతరాల సంతానాన్ని ప్రతినిధిగా సూచిస్తాయి. సాధారణ వంశార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, రూపపరమైన పుంలింగ అర్థాన్ని పాదటీపులో కాపాడాం.
- issue: לְהַכְעִיסוֹ లో ఉద్దేశం లేదా ఫలితం
  choice: ఆయనకు కోపం పుట్టిస్తే
  alternative: ఆయనకు కోపం పుట్టించడానికి
  rationale: హీబ్రూ ఉద్దేశార్థక క్రియారూపం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. తెలుగులోని ఎంపిక విగ్రహారాధన యెహోవాను కోపపరుస్తుందని చెబుతుంది; వారు కేవలం కోపపెట్టాలనే ఉద్దేశంతోనే చేశారని తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. వచనం 26వ వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ సూచికను ఉంచాం. మూలంలోని ఏకవచన ‘నీవు/నీ’తో మొదలై సమూహాన్ని సూచించే బహువచన క్రియల వైవిధ్యాన్ని తెలుగులో పూర్తిగా ప్రతిబింబించడం సహజం కాదు; ప్రధాన సంబోధనను ఏకవచనంగా నిలిపాం.
