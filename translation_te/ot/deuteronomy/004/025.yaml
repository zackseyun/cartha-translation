  rationale: దైవనామాన్ని POB యొక్క “Yahweh” నిర్ణయానికి అనుగుణంగా “యాహ్వే”గా సవరించాం. చెక్కిన ప్రతిమ ‘ఏదైనా రూపాన్ని పోలి’ ఉంటుందనే హీబ్రూ నిర్మాణాన్ని స్పష్టపరిచాం. సందర్భానుగుణమైన నిబంధనపరమైన అవినీతి భావం కోసం “చెడిపోయి”ని “భ్రష్టుపడి”గా మార్చాం. వచనం తరువాతి వచనంలో కొనసాగుతున్నందున చివరి దీర్ఘవిరామ సూచికను నిలిపాం.
