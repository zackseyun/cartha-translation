  naturalness: ‘హత్తుకొని ఉన్న’ can suggest physically embracing someone and is less idiomatic here for steadfast religious attachment. ‘అంటిపెట్టుకొని ఉన్న’ is clearer modern Telugu and retains the attachment image.
  terminology: Render יהוה as ‘యాహ్వే’ in accordance with the English POB theological decision. ‘మీ దేవుడైన’ accurately represents ‘your God.’
