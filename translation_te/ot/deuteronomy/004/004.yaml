id: DEU.4.4
reference: Deuteronomy 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּם֙ הַ/דְּבֵקִ֔ים בַּ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: te
  text: అయితే, మీ దేవుడైన యాహ్వేకు అంటిపెట్టుకొని ఉన్న మీరందరూ నేడు సజీవంగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అంటిపెట్టుకొని ఉన్న” అనే హీబ్రూ వ్యక్తీకరణను “గట్టిగా పట్టుకొని ఉన్న” లేదా “విడువకుండా ఉన్న” అని కూడా అనువదించవచ్చు; ఇది యాహ్వేతో సన్నిహితమైన నిబంధన అనుబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: అయితే ... మీరు
  rationale: మునుపటి వచనంలో నశించినవారికి, ఇప్పుడు సంబోధించబడుతున్న సజీవులకు మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: הַ/דְּבֵקִים
  choice: హత్తుకొని ఉన్న
  rationale: דבק అనే పదంలోని గట్టిగా అంటుకొని ఉండడం, విడువకుండా అనుసంధానమై ఉండడం అనే భావాలను, కొనసాగుతున్న నిబంధన అనుబంధాన్ని సూచించే విధంగా వ్యక్తం చేస్తుంది.
- source_word: בַּ/יהוָה
  choice: యెహోవాను
  rationale: బేత్ ఉపసర్గతో ఉన్న క్రియాసంబంధాన్ని తెలుగులో సహజమైన కర్మరూపంతో వ్యక్తం చేసి, దేవుని వ్యక్తిగత నిబంధన నామాన్ని లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי/כֶם
  choice: మీ దేవుడైన
  rationale: ద్వితీయ పురుష బహువచన ప్రత్యయాన్ని, యెహోవా ఎవరో వివరించే హీబ్రూ సమాస సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חַיִּים כֻּלְּ/כֶם
  choice: మీరంతా ... సజీవంగా ఉన్నారు
  rationale: ప్రతి ఒక్కరూ బతికి ఉన్నారనే సమగ్రతను, సహజమైన తెలుగు వాక్యనిర్మాణంలో పరిరక్షిస్తుంది.
- source_word: הַ/יּוֹם
  choice: నేటివరకు
  rationale: సందర్భంలో మాట్లాడుతున్న దినానికీ వారు సజీవంగా కొనసాగిన ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థంగా 'నేడు' అని కూడా అనువదించవచ్చు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: דבק సూచించే అనుబంధ స్వభావం
  choice: హత్తుకొని ఉన్న
  alternative: అంటిపెట్టుకొని ఉన్న / విడువకుండా ఉన్న
  rationale: ఈ రూపం కేవలం విధేయత అని వ్యాఖ్యానించకుండా, మూలపదంలోని సన్నిహితమైన, నిలకడగల అనుబంధ చిత్రాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ముందున్న వచనంతో వ్యత్యాసాన్ని ‘అయితే’ ద్వారా చూపించి, హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న అనుబంధ భావాన్ని ‘హత్తుకొని ఉన్న’తో నిలిపింది.
