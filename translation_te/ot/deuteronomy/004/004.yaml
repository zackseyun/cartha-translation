  to: అయితే, మీ దేవుడైన యాహ్వేకు అంటిపెట్టుకొని ఉన్న మీరందరూ నేడు సజీవంగా ఉన్నారు.[a]
  rationale: The revision replaces ‘నేటివరకు’ with ‘నేడు’ to retain the Hebrew temporal sense, aligns the divine name with the supplied POB Yahweh policy, and uses a more idiomatic Telugu expression for דבק while retaining its close-attachment metaphor. The contrast, plural address, ‘your God,’ and the emphatic ‘all’ remain explicit.
