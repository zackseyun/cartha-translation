source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: te
  text: ఆ సమయంలో యాహ్వే నన్ను మీకు కట్టడాలను, న్యాయవిధులను[a] బోధించమని ఆజ్ఞాపించాడు, మీరు స్వాధీనం చేసుకోవడానికి[b] దాటి వెళ్తున్న ఆ దేశంలో వాటిని ఆచరించేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శాసనాలను, న్యాయనియమాలను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారసత్వంగా పొందడానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపిస్తూ ... చెప్పాడు
  rationale: ఇది సాధారణ అభ్యర్థనను కాక అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో బోధించమనే ఆజ్ఞను సహజంగా అనుసంధానించేందుకు ఈ నిర్మాణాన్ని వాడాం.
- source_word: לְלַמֵּד
  choice: బోధించమని
  rationale: మోషే ఇశ్రాయేలీయులకు నియమాలను నేర్పాలనే బాధ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חֻקִּים
  choice: కట్టడాలు
  rationale: నిర్దేశించబడిన స్థిరమైన శాసనాలు అనే న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: מִשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయనిర్ణయాలు లేదా అమలులో ఉండే న్యాయనియమాలు అనే హీబ్రూ భావాన్ని, חֻקִּיםతో ఉన్న పదభేదాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: ఆచరించవలసిన
  rationale: నియమాలను కేవలం తెలుసుకోవడం కాక వాటి ప్రకారం చేయాలనే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּאָרֶץ
  choice: ఆ దేశంలో
  rationale: ద్వితీయోపదేశకాండంలోని వాగ్దాన దేశానికి సంబంధించిన భౌగోళిక భావాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఆ’ అనేది שָׁמָּה యొక్క గమ్యభావాన్నీ సహజంగా మోస్తుంది.
- source_word: עֹבְרִים שָׁמָּה
  choice: దాటి వెళ్తున్న ఆ దేశంలో
  rationale: ఇశ్రాయేలు త్వరలో అవతలికి దాటి ఆ దేశంలో ప్రవేశించబోతున్న కదలికను ప్రతిబింబిస్తుంది; మూలంలో లేని ‘యొర్దాను’ అనే పేరును చేర్చలేదు.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: దేశాన్ని అధీనంలోకి తెచ్చుకొని నివసించే భావాన్ని సందర్భానుకూలంగా ఇస్తుంది; ‘వారసత్వంగా పొందడం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְאֹתִי
  choice: ఆ సమయంలో యాహ్వే నాకు
  rationale: మూలంలోని ముందుంచిన ‘నన్ను’ అనే పదానికి ఉన్న స్వల్ప ఉద్ఘాటనను అసహజమైన పదక్రమం లేకుండా ‘నాకు’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు రూపాన్ని వాడాం.
- issue: לְרִשְׁתָּהּలో స్వాధీనత–వారసత్వ భావసంభావ్యత
  choice: స్వాధీనం చేసుకోవడానికి
  alternative: వారసత్వంగా పొందడానికి
  rationale: తక్షణ సందర్భంలో దేశంలో ప్రవేశించి దాన్ని అధీనంలోకి తీసుకోవడం ముందుంటుంది; అయితే దేవుడిచ్చిన వారసత్వం అనే భావసంభావ్యతను తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణాన్ని ఎంచుకున్నాం. ‘కట్టడాలు, న్యాయవిధులు’ అనే జంట మూలంలోని రెండు న్యాయపదాల భేదాన్ని నిలుపుతుంది. ‘ఆచరించవలసిన’ అనేది అక్షరార్థమైన ‘వాటిని చేయడానికి’ కంటే సహజమైనదైనా, విధేయతతో అమలు చేయాలనే మూలభావాన్ని కాపాడుతుంది.
