source:
  edition: WLC
  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: te
  text: 'ఆకాశాన్నీ భూమినీ మీకు విరోధంగా సాక్షులుగా నేడు పిలుస్తున్నాను[a][b]: మీరు స్వాధీనం చేసుకోవడానికి యొర్దాను దాటి వెళ్తున్న ఆ దేశం నుండి మీరు తప్పక త్వరలోనే నశించిపోతారు. దానిలో మీరు ఎక్కువకాలం జీవించరు[c], ఎందుకంటే మీరు తప్పక నాశనమవుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేడు ఆకాశాన్నీ భూమినీ మీకు విరోధంగా సాక్ష్యమివ్వమని పిలుస్తున్నాను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఆకాశాలు మరియు భూమి”; ఇది ఒడంబడికకు సాక్షులను పిలిచే సూత్రబద్ధమైన వ్యక్తీకరణ.
    reason: cultural_note
  - marker: c
    text: లేదా, “దానిపై మీరు మీ రోజులను పొడిగించరు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: మీకు విరోధంగా ... సాక్షులుగా పిలుస్తున్నాను
  rationale: עוּד హిఫీల్ రూపానికి ఇక్కడ న్యాయపరమైన, ఒడంబడిక సంబంధమైన సాక్ష్యాన్ని ఆహ్వానించే భావం ఉంది; בָכֶם వల్ల సాక్ష్యం ‘మీకు విరోధంగా’ ఉందని స్పష్టమవుతుంది.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ఆకాశాన్నీ భూమినీ
  rationale: సృష్టిని ఒడంబడిక సాక్షులుగా పిలిచే సూత్రబద్ధమైన వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: తప్పక నశించిపోతారు
  rationale: ధాతురూపంతో కూడిన infinitive absolute నిశ్చయాన్ని బలపరుస్తుంది; ‘తప్పక’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: מַהֵר מֵעַל הָאָרֶץ
  choice: ఆ దేశంలోనుండి త్వరగా
  rationale: తీర్పు ఫలితంగా దేశం నుంచి తొలగిపోవడాన్ని, అలాగే מַהֵר తెలిపే వేగాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: మీరు స్వాధీనం చేసుకోవడానికి యొర్దాను దాటి వెళ్తున్న ఆ దేశం
  rationale: שָׁמָּה సూచించే గమ్యభావాన్ని సంబంధవాక్యంలో సహజంగా కలిపి, ירשׁ యొక్క దేశాన్ని స్వాధీనం చేసుకునే భావాన్ని నిలుపుతుంది.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: దానిలో మీరు ఎక్కువకాలం జీవించరు
  rationale: అక్షరార్థంగా ‘దానిపై రోజులను పొడిగించరు’ అనే హీబ్రూ నుడికారాన్ని సాధారణ పాఠకుడికి సహజంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: మీరు తప్పక నాశనమవుతారు
  rationale: నిఫాల్ infinitive absolute మరియు finite verb కలయికలోని నిశ్చయ ఉద్ఘాటనను నిలుపుతూ, ‘సర్వనాశనం’ వంటి మూలానికి మించిన సంపూర్ణత భావాన్ని చేర్చదు.
theological_decisions:
- issue: ఆకాశం, భూమి ఒడంబడిక సాక్షులుగా ఉండే న్యాయపరమైన సూత్రం
  choice: సృష్టిని ఇశ్రాయేలుకు విరోధంగా సాక్షులుగా పిలిచే న్యాయసంబంధ భావాన్ని ప్రత్యక్షంగా అనువదించడం
  alternative: ‘ఆకాశం భూమి సాక్షిగా మిమ్మల్ని హెచ్చరిస్తున్నాను’ అని సడలించి అనువదించడం
  rationale: మూలంలోని ఒడంబడిక-వ్యాజ్య భాషను కాపాడుతుంది; హెచ్చరిక అనే ఫలితార్థాన్ని మాత్రమే ముందుకు తెచ్చి సాక్షుల పిలుపును మరుగుపరచదు.
- issue: రెండు ఉద్ఘాటిత నాశన ప్రకటనల తీవ్రత
  choice: రెండింటిలోనూ ‘తప్పక’ ద్వారా నిశ్చయాన్ని వ్యక్తం చేయడం
  alternative: ‘పూర్తిగా’ లేదా ‘సర్వసమూలంగా’ అని నాశన పరిమాణాన్ని ఉద్ఘాటించడం
  rationale: హీబ్రూ infinitive absolute ప్రధానంగా ప్రకటన నిశ్చయాన్ని బలపరుస్తుంది; అది తప్పనిసరిగా తాత్త్వికమైన సంపూర్ణ వినాశాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి వాడబడింది. న్యాయపరమైన ఒడంబడిక సాక్ష్యభావం నిలుపబడింది; హీబ్రూ ఉద్ఘాటనలను అసహజమైన పదపునరుక్తితో కాకుండా ‘తప్పక’ ద్వారా వ్యక్తం చేశాం. ‘దేశం’ అనే పదం భూభాగాన్ని సూచిస్తుంది; ‘యొర్దాను’ సాధారణ తెలుగు బైబిలు నామరూపానికి అనుగుణంగా ఉంది.
