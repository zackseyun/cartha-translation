revisions:
- from: 'మీకు విరోధంగా నేడు ఆకాశాన్నీ భూమినీ సాక్షులుగా పిలుస్తున్నాను[a][b]: మీరు స్వాధీనం చేసుకోవడానికి యొర్దాను దాటి వెళ్తున్న ఆ దేశంలోనుండి త్వరగా తప్పక నశించిపోతారు. దానిలో మీరు ఎక్కువకాలం జీవించరు[c]; మీరు తప్పక నాశనమవుతారు.'
  to: 'ఆకాశాన్నీ భూమినీ మీకు విరోధంగా సాక్షులుగా నేడు పిలుస్తున్నాను[a][b]: మీరు స్వాధీనం చేసుకోవడానికి యొర్దాను దాటి వెళ్తున్న ఆ దేశం నుండి మీరు తప్పక త్వరలోనే నశించిపోతారు. దానిలో మీరు ఎక్కువకాలం జీవించరు[c], ఎందుకంటే మీరు తప్పక నాశనమవుతారు.'
  rationale: అనువాదంలోని ప్రధాన భావాన్ని మార్చకుండా, త్వరిత తీర్పు యొక్క కాలభావాన్ని ‘త్వరలోనే’ ద్వారా స్పష్టం చేశాం; చివరి కారణవాచకాన్ని తెలుగులో ప్రత్యక్షంగా వ్యక్తం చేశాం; అలాగే పాదటిప్పణి cలో మూలంలో లేని reflexive భావాన్ని తొలగించాం. పాదటిప్పణి గుర్తులు సంబంధిత సాక్షి-సూత్రం మరియు ‘రోజులను పొడిగించడం’ అనే నుడికారానికి సరైన చోటే ఉన్నాయి.
