id: DEU.4.6
reference: Deuteronomy 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: te
  text: 'మీరు వాటిని జాగ్రత్తగా పాటించి ఆచరించండి. ఎందుకంటే ఈ శాసనాలన్నిటినీ[a] విని ఇలా చెప్పే ప్రజల దృష్టిలో ఇదే మీ జ్ఞానం, మీ వివేకం: ‘నిజంగా,[b] ఈ గొప్ప జనము జ్ఞానవివేకాలు గల ప్రజ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శాసనాలు’ అని అనువదించిన חֻקִּים అనే హీబ్రూ న్యాయపదాన్ని ‘విధులు’ లేదా ‘నియమాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '‘నిజంగా’ అని అనువదించిన רַקకు అక్షరార్థంగా ‘మాత్రమే’ అనే భావం కూడా ఉంది. ఇక్కడ అది ఆశ్చర్యంతో కూడిన ఉద్ఘాటనగా ఉండవచ్చు: ‘నిశ్చయంగా.’ ప్రత్యామ్నాయంగా, ‘ఈ గొప్ప జనము మాత్రమే జ్ఞానవివేకాలు గల ప్రజ’ అని అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: జాగ్రత్తగా పాటించండి
  rationale: నిబంధనాత్మక సందర్భంలో שׁמר ఆజ్ఞలను శ్రద్ధగా గైకొనడం లేదా పాటించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘జాగ్రత్తగా పాటించండి’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַעֲשִׂיתֶם
  choice: ఆచరించండి
  rationale: עשה ఇక్కడ కేవలం అంగీకరించడాన్ని కాక వాటిని కార్యరూపంలో చేయడాన్ని సూచిస్తుంది. ‘పాటించి ఆచరించండి’ అనే జత మూలంలోని రెండు క్రియల భేదాన్ని నిలుపుతుంది.
- source_word: כִּי הִוא
  choice: ఎందుకంటే ఇదే
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న ఆజ్ఞాబోధను లేదా దానిని పాటించడాన్ని సమష్టిగా సూచిస్తుంది. తెలుగు ‘ఇదే’ ఆ సూచనను నిర్దిష్టంగా పరిష్కరించకుండా సహజంగా ఉంచుతుంది.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: మీ జ్ఞానం, మీ వివేకం
  rationale: חכמה మరియు בינה మధ్య ఉన్న సమీపమైనా వేర్వేరు భావాలను ‘జ్ఞానం’, ‘వివేకం’గా నిలిపి, రెండింటినీ ఒకే పదంలో కలపలేదు.
- source_word: לְעֵינֵי הָעַמִּים
  choice: ప్రజల దృష్టిలో
  rationale: అక్షరార్థంగా ‘ప్రజల కళ్లలో’; ‘ప్రజల దృష్టిలో’ ఇశ్రాయేలు విధేయత బహిరంగంగా కనిపించే అంశాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: הָעַמִּים
  choice: ప్రజలు
  rationale: వచనం చివరనున్న גוי (‘జనము’)తో పదభేదాన్ని నిలుపుటకు עמיםను ‘ప్రజలు’గా అనువదించాం.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: ఈ నియమాలన్నిటినీ
  rationale: חֻקִּיםకు చట్టపరమైన బలం ఉంది. సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘నియమాలు’ ఎంచుకుని, మరింత రూపసామ్యమున్న ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: רַק
  choice: నిజంగా
  rationale: רַק సాధారణంగా ‘మాత్రమే’ అని అర్థమిచ్చినా, ఇక్కడ ప్రజల ఆశ్చర్యభరిత నిర్ధారణను బలపరచే పదంగా పనిచేస్తుంది. ‘నిజంగా’ ఆ ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: עַם חָכָם וְנָבוֹן
  choice: జ్ఞానం, వివేకం గల ప్రజ
  rationale: ముందున్న חָכְמַתְכֶם וּבִינַתְכֶםతో భావసంబంధాన్ని నిలుపుతూ, חכם మరియు נבוןను ‘జ్ఞానం, వివేకం గల’ అని అనువదించాం.
- source_word: הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: ఈ గొప్ప జనము
  rationale: גויకు ‘జనము’ వాడటం ద్వారా ముందున్న עמים (‘ప్రజలు’)తో మూలంలోని పదభేదం నిలుస్తుంది; ‘గొప్ప’ పరిమాణం, ప్రాముఖ్యత రెండింటికీ మూలంలో ఉన్న విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: విధేయతకు జ్ఞానంతో ఉన్న సంబంధం
  choice: నియమాలను జాగ్రత్తగా పాటించి ఆచరించడం ప్రజల ఎదుట ఇశ్రాయేలు జ్ఞానం, వివేకంగా ప్రత్యక్షమవుతుందని పాఠ్యం చెబుతున్నట్లుగా అనువదించాం.
  alternative: నియమాలను ఆచరించడముతో సంబంధం లేకుండా నియమాలే ఇశ్రాయేలు జ్ఞానం, వివేకం అని స్పష్టీకరించడం.
  rationale: ‘వాటిని పాటించి ఆచరించండి; ఎందుకంటే ఇదే...’ అనే వాక్యనిర్మాణం ఆజ్ఞలు మరియు విధేయ ఆచరణ రెండింటినీ సమీపంగా కలుపుతుంది. ‘ఇదే’ అని ఉంచడం ద్వారా సర్వనామ సూచనలోని సహజ విస్తృతిని కాపాడి, పాఠ్యం చెప్పని పుణ్యం లేదా జాతీయ ఆధిక్య సిద్ధాంతాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘పాటించి ఆచరించండి’ మూలంలోని సంక్షిప్త క్రియాజతను సహజంగా నిలుపుతుంది. ‘ప్రజలు/జనము’ అనే భేదం עמים/גוי పదభేదాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో తగిన పదం వద్ద ఉంచబడింది.
