revisions:
- from: కాబట్టి మీరు వాటిని జాగ్రత్తగా పాటించి ఆచరించండి. ఎందుకంటే ఇదే ప్రజల దృష్టిలో మీ జ్ఞానం, మీ వివేకం. వారు ఈ నియమాలన్నిటినీ[a] విని, ‘ఈ గొప్ప జనము నిజంగా[b] జ్ఞానం, వివేకం గల ప్రజ’ అని అంటారు.
  to: 'మీరు వాటిని జాగ్రత్తగా పాటించి ఆచరించండి. ఎందుకంటే ఈ శాసనాలన్నిటినీ[a] విని ఇలా చెప్పే ప్రజల దృష్టిలో ఇదే మీ జ్ఞానం, మీ వివేకం: ‘నిజంగా,[b] ఈ గొప్ప జనము జ్ఞానవివేకాలు గల ప్రజ.’'
  rationale: మూలంలో లేని ‘కాబట్టి’ని తొలగించి, ప్రజలు వినడం మరియు చెప్పడం అనే సంబంధ వాక్యాన్ని తెలుగులో నేరుగా అనుసంధానించాం. חֻקִּיםకు మరింత న్యాయస్వరమున్న ‘శాసనాలు’ వాడాం. రַק యొక్క వివాదాస్పద సూక్ష్మతను ప్రధాన పాఠ్యంలో ‘నిజంగా’గా ఉంచి, ‘మాత్రమే’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
