  naturalness: ప్రస్తుత తెలుగు సహజంగానే ఉంది. అయితే మూల వాక్య నిర్మాణాన్ని మరింత స్పష్టంగా చూపడానికి ‘యాహ్వాయే ... దేవుడు అని’ అనే ఉపవాక్యాన్ని ‘తెలుసుకొని ... హృదయంలో నిలుపుకో’తో నేరుగా అనుసంధానించాం.
  terminology: యְהוָהను ‘యాహ్వే’గా లిప్యంతరీకరించాం; ఇది ఇచ్చిన ఆంగ్ల POB నిర్ణయానికి మరియు ప్రాజెక్టు విధానానికి అనుగుణం. הוּאలోని ఉద్ఘాటనను ‘యాహ్వాయే’ ద్వారా నిలిపాం. אֵין עוֹדను ‘వేరొక దేవుడు లేడు’గా అనువదించాం.
  issues:
  - severity: medium
    issue: దైవనామాన్ని ‘యెహోవా’గా అనువదించారు.
    rationale: ఇచ్చిన POB audit trail మరియు ప్రాజెక్టు నియమం యְהוָהకు ‘Yahweh’ను నిర్దేశిస్తున్నాయి. తెలుగులో దీనికి ‘యాహ్వే’ సరిపోతుంది; ‘యెహోవా’ను ప్రధాన పాఠ్యంలో ఉంచడం ఆ నిర్ణయంతో సరిపోదు.
  - severity: medium
