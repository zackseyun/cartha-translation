    rationale: ఆంగ్ల audit trailలో [b] అంకరం ‘there is no other’కు ప్రత్యామ్నాయ పఠనాన్ని ఇస్తుంది. అంకరాన్ని అదే పదబంధానికి సంబంధించిన ప్రత్యామ్నాయంతో సరిపోల్చడం మంచిది.
