id: DEU.4.39
reference: Deuteronomy 4:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם וַ/הֲשֵׁבֹתָ֮ אֶל לְבָבֶ/ךָ֒ כִּ֤י יְהוָה֙ ה֣וּא הָֽ/אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת אֵ֖ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: te
  text: కాబట్టి, యాహ్వాయే పైన ఆకాశంలోను కింద భూమిమీదను దేవుడు అని నేడు తెలుసుకొని, దానిని నీ హృదయంలో దృఢంగా నిలుపుకో[a]; ఆయన తప్ప వేరొక దేవుడు లేడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దానిని నీ హృదయానికి తిరిగి తీసుకురా’; అంటే ఈ సత్యాన్ని అంతరంగంలో అంగీకరించి దృఢంగా నిలుపుకో.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన తప్ప ఇంకెవరూ లేరు.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: కాబట్టి నేడు తెలుసుకొని
  rationale: సందర్భంలో ఈ క్రియ ఉపదేశాత్మకమైన ఆజ్ఞాభావాన్ని కలిగి ఉంది. ‘నేడు’ అనే పదం ఆ పిలుపులోని తక్షణతను నిలుపుతుంది; ముందరి వాదనకు ఫలితంగా ‘కాబట్టి’ సహజంగా అనుసంధానిస్తుంది.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: నీ హృదయంలో నిలుపుకో
  rationale: ‘నీ హృదయానికి తిరిగి తీసుకురా’ అనే హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు రూపం. సత్యాన్ని కేవలం గుర్తుంచుకోవడం కాక, అంతరంగంలో అంగీకరించి స్థిరపరచుకోవడం అనే భావాన్ని, అలాగే ‘హృదయం’ అనే బైబిలీయ రూపకాన్ని కాపాడుతుంది.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: యెహోవాయే దేవుడని
  rationale: הוּא ఇచ్చే ఉద్ఘాటనను తెలుగు ఏకారంతో వ్యక్తం చేసి, యెహోవాను దేవునిగా గుర్తించే వాక్యంలోని ప్రత్యేకతను నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించింది.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: పైన ఆకాశంలోనూ, కింద భూమిమీదనూ
  rationale: ఆకాశం–భూమి అనే సమగ్ర విశ్వవ్యాప్త జంటను, పై–కింద సమాంతరతను సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: אֵין עוֹד
  choice: మరొకరు లేరు
  rationale: యెహోవా తప్ప దేవుడిగా మరొకరు లేరనే సంపూర్ణ ప్రత్యేకతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. హీబ్రూ ఉచ్చారణను ‘యాహ్వే’ మరింత సమీపంగా సూచించవచ్చు; అయితే ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తింపుగల ‘యెహోవా’ను ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: אֵין עוֹד లోని ఏకైక దేవత్వ ప్రకటన
  choice: మరొకరు లేరు
  alternative: ఇంకెవరూ లేరు / మరొకటి లేదు
  rationale: ఈ ప్రకటన యెహోవా యొక్క ప్రత్యేక దేవత్వాన్ని నేరుగా నిలుపుతుంది; వచనంలో లేని తరువాతి సిద్ధాంతపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘హృదయం’ అనే మూల రూపకాన్ని నిలిపి, హీబ్రూ ఉద్ఘాటనను ‘యెహోవాయే’ ద్వారా తెలిపింది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
