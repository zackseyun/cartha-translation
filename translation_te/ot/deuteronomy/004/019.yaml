  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: te
  text: ఆకాశం వైపు కన్నులెత్తి సూర్యుణ్ణి, చంద్రుణ్ణి, నక్షత్రాలను—ఆకాశంలోని సమస్త సైన్యాన్ని—చూసి, దారితప్పి వాటికి సాగిలపడి వాటిని సేవించకుండా జాగ్రత్తగా ఉండు; లేకపోతే అలా చేస్తావు. వాటిని నీ దేవుడైన యహ్వే సమస్త ఆకాశం కింద ఉన్న అన్ని ప్రజలకు కేటాయించాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పంచి ఇచ్చాడు,” “విభజించి ఇచ్చాడు.” హీబ్రూ క్రియకు పంచడం లేదా కేటాయించడం అనే భావం ఉంది; ఈ మాటలు వాటిని ఆరాధించడాన్ని యహ్వే ఆమోదించాడని చెప్పవు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “సమస్త ఆకాశం కింద”; ఇది సమస్త భూమిమీద అనే విస్తృత పరిధిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: చేయకుండా జాగ్రత్తపడు
  rationale: פן హెచ్చరికతో కూడిన సంభావ్య ప్రతికూల ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యాంతంలోని ఈ నిర్మాణం ఆ హెచ్చరికను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: ఆకాశం వైపు కన్నులెత్తి
  rationale: పైకి చూపు మళ్లించడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הַשֶּׁמֶשׁ ... הַיָּרֵחַ ... הַכּוֹכָבִים
  choice: సూర్యుణ్ణి, చంద్రుణ్ణి, నక్షత్రాలను
  rationale: పేర్కొన్న ఖగోళ వస్తువులకు నేరమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదాలు.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతటినీ
  rationale: צָבָא లోని ‘సైన్యం/సమూహం’ భావాన్ని నిలుపుతూ, సందర్భంలో ఖగోళ సమూహాన్నే సూచించేలా అనువదించబడింది.
- source_word: וְנִדַּחְתָּ
  choice: దారితప్పి
  rationale: నిఫాల్ రూపం ఇక్కడ తప్పుదారికి లాగబడడం లేదా మళ్లిపోవడం అనే భావాన్ని ఇస్తుంది; బలవంతాన్ని అతిగా సూచించకుండా ‘దారితప్పి’ ఆ భావాన్ని అందిస్తుంది.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: వాటికి సాగిలపడి
  rationale: శరీరంతో వంగి నమస్కరించే చర్యను నిలుపుతుంది; తరువాతి ‘సేవించి’తో కలిసి విగ్రహారాధన భావం స్పష్టమవుతుంది.
- source_word: וַעֲבַדְתָּם
  choice: వాటిని సేవించి
  rationale: עבד యొక్క ప్రాథమిక ‘సేవించు’ భావాన్ని నిలుపుతుంది; ఈ ఆరాధనా సందర్భంలో అది దేవతారాధనను సూచిస్తుంది.
- source_word: אֲשֶׁר חָלַק
  choice: వాటిని ... కేటాయించాడు
  rationale: חלק లోని పంచడం, భాగంగా ఇవ్వడం, కేటాయించడం అనే పంపిణీ భావాన్ని నిలుపుతూ, వాటి ఆరాధనకు దేవుడు ఆమోదం తెలిపాడని అనువాదమే నిర్ణయించకుండా ఉంటుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో గుర్తించదగిన లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: לְכֹל הָעַמִּים
  choice: ప్రజలందరికీ
  rationale: עַמִּים యొక్క బహువచన సామూహిక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: ఆకాశాలన్నిటి కింద ఉన్న
  rationale: హీబ్రూ పదబంధంలోని విస్తృత, సార్వత్రిక పరిధిని మరియు ‘ఆకాశాలు’ అనే రూపాన్ని వీలైనంతగా నిలుపుతుంది.
theological_decisions:
- issue: యహ్వే ఖగోళ వస్తువులను ప్రజలందరికీ ‘కేటాయించాడు’ అనే వాక్యభాగం అర్థం
  choice: దేవుని ఏర్పాటులో అవి ప్రజలందరికీ కేటాయించబడ్డాయని మాత్రమే వచనం చెప్పేలా అనువదించడం
  alternative: దేవుడు ప్రజలు వాటిని ఆరాధించడానికి ఇచ్చాడని, లేదా తీర్పుగా వారిని వాటి ఆరాధనకు అప్పగించాడని స్పష్టీకరించడం
  rationale: חלק కేటాయించడం లేదా పంచడం అనే భావాన్ని అనుమతిస్తుంది; అయితే ఈ వాక్య సందర్భం ఖగోళ ఆరాధనను నిషేధిస్తుంది. కాబట్టి మూలంలోని ఉద్రిక్తతను నిలుపుతూ, ఆరాధనకు ఆమోదమో నిర్దిష్ట తీర్పు సిద్ధాంతమో అనువాదంలో చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూలో ఇశ్రాయేలును ఏకవచనంలో సంబోధించినందున ‘నీవు/నీ’ రూపాలు నిలుపబడ్డాయి. ‘సాగిలపడు’ శరీర చర్యను, ‘సేవించు’ ఆరాధనా విధేయతను వేరువేరుగా కాపాడుతాయి.
