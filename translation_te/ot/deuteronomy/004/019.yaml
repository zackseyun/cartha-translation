revisions:
- from: నీవు ఆకాశం వైపు కన్నులెత్తి, సూర్యుణ్ణి, చంద్రుణ్ణి, నక్షత్రాలను—ఆకాశ సైన్యమంతటినీ—చూసి, దారితప్పి వాటికి సాగిలపడి వాటిని సేవించకుండా జాగ్రత్తపడు. వాటిని నీ దేవుడైన యహ్వే ఆకాశాలన్నిటి కింద ఉన్న ప్రజలందరికీ కేటాయించాడు[a][b].
  to: ఆకాశం వైపు కన్నులెత్తి సూర్యుణ్ణి, చంద్రుణ్ణి, నక్షత్రాలను—ఆకాశంలోని సమస్త సైన్యాన్ని—చూసి, దారితప్పి వాటికి సాగిలపడి వాటిని సేవించకుండా జాగ్రత్తగా ఉండు; లేకపోతే అలా చేస్తావు. వాటిని నీ దేవుడైన యహ్వే సమస్త ఆకాశం కింద ఉన్న అన్ని ప్రజలకు కేటాయించాడు[a][b].
  rationale: The revision preserves the Hebrew warning sequence and all listed celestial objects and actions. It improves modern Telugu flow and restores the idiomatic scope of תַּחַת כָּל הַשָּׁמָיִם. The allotment clause remains deliberately noncommittal about whether the allotment entails approval, use, or judgment.
