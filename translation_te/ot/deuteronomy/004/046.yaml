base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: te
  text: యొర్దాను అవతల, బేత్-పెయోరుకు ఎదురుగా ఉన్న లోయలో, హెష్బోనులో నివసించిన అమోరీయుల రాజైన సీహోను దేశంలో, ఈజిప్టు నుండి బయలుదేరినప్పుడు మోషే మరియు ఇశ్రాయేలు కుమారులు[a] అతన్ని హతమార్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: עֵבֶר అనే పదం సరిహద్దు లేదా నదికి ఆవలివైపును సూచిస్తుంది. వక్త భౌగోళిక దృష్టికోణాన్ని నిలుపుతూ ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: בַּגַּיְא
  choice: లోయలో
  rationale: גַּיְא లోయను లేదా కనుమలాంటి పల్లపు ప్రాంతాన్ని సూచిస్తుంది; ఈ భౌగోళిక సందర్భంలో ‘లోయ’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: מוּל
  choice: ఎదురుగా
  rationale: מוּל ఒక ప్రదేశానికి అభిముఖంగా లేదా దానికి ఎదురుగా ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: בֵּית פְּעוֹר
  choice: బేత్-పెయోరు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: సీహోను దేశంలో
  rationale: אֶרֶץ ఇక్కడ సీహోను ఆధీనంలోని దేశం లేదా భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ సంక్షిప్తంగా, సందర్భోచితంగా ఉంది.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజు
  rationale: హీబ్రూ నిర్మాణంలోని జాతి-రాజు సంబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: హెష్బోనులో నివసించిన
  rationale: יוֹשֵׁב నివాసాన్ని సూచించే కృదంతం; ‘నివసించిన’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: אֲשֶׁר הִכָּה
  choice: అతన్ని హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టి పడగొట్టడం లేదా చంపడం అనే భావాన్ని కలిగిస్తుంది. ఇక్కడ సీహోను ఓటమి మరియు మరణాన్ని ‘హతమార్చారు’ సహజంగా తెలియజేస్తుంది.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పురుష బహువచన సమాసాన్ని రూపపరంగా నిలుపుతుంది; సామూహిక జాతినామ భావాన్ని పాదసూచికలో తెలియజేశారు.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ఈజిప్టు నుండి బయలుదేరినప్పుడు
  rationale: בְּతో కూడిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ఈ అనువాదం నిర్గమన సందర్భాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: וּבְנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధన-సమాజ నామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక జాతినామంగా కూడా అర్థమవుతుందని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక-భౌగోళిక శైలి వాడబడింది. స్థలనామాలు సాధారణ బైబిలు తెలుగు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని పొడవైన సంబంధవాక్యం తెలుగులో స్పష్టత కోసం డాష్‌తో విభజించబడింది.
