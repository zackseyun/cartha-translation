source:
  edition: WLC
  text: וְ/כָל הָ֨/עֲרָבָ֜ה עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה וְ/עַ֖ד יָ֣ם הָ/עֲרָבָ֑ה תַּ֖חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: te
  text: మరియు యొర్దాను అవతల, తూర్పు వైపున ఉన్న అరాబా ప్రాంతమంతా, పిస్గా ఏటవాలుల దిగువన ఉన్న అరాబా సముద్రం[a] వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, సాధారణంగా మృత సముద్రంగా గుర్తించబడే జలాశయం.
    reason: ‘అరాబా సముద్రం’ అనే మూలపాఠ్యపు పేరును నిలుపుతూ, సాధారణ భౌగోళిక గుర్తింపును అందిస్తుంది.
lexical_decisions:
- source_word: וְכָל הָעֲרָבָה
  choice: అరాబా ప్రాంతమంతా
  rationale: భౌగోళిక నామమైన ‘అరాబా’ను నిలిపి, ఇది మొత్తం ప్రాంతాన్ని సూచిస్తోందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: యొర్దాను అవతల తూర్పున ఉన్న
  rationale: వక్త దృష్టికోణం నుంచి యొర్దాను అవతలి తూర్పు ప్రాంతమనే భౌగోళిక సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָם הָעֲרָבָה
  choice: అరాబా సముద్రం
  rationale: తరువాతి కాలపు ‘మృత సముద్రం’ అనే పేరును మూలపాఠ్యంలోకి చేర్చకుండా, హీబ్రూ భౌగోళిక నామాన్ని యథాతథ భావంతో అనువదిస్తుంది.
- source_word: תַּחַת אַשְׁדֹּת הַפִּסְגָּה
  choice: పిస్గా ఏటవాలుల దిగువన ఉన్న
  rationale: אַשְׁדֹּת అనే భూభాగ పదానికి ఇక్కడ ‘ఏటవాలులు’ సరిపోతుంది; תַּחַת సూచించే దిగువ భౌగోళిక స్థానాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే భౌగోళిక వర్ణన. మూలంలోని వాక్యానుసంధాన ‘וְ’ ఈ వచనం ముందు వాక్యానికి కొనసాగింపని సూచించినా, తెలుగులో వచనం స్వతంత్రంగా సహజంగా చదవడానికి ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు. అందించిన ఆంగ్ల పాదసూచిక గుర్తు ‘eastward’ వద్ద ఉన్నప్పటికీ దాని విషయం మృత సముద్ర గుర్తింపుకు సంబంధించినది; అది సరైన స్థలంలో లేకపోవడం వల్ల ప్రచురణ పాఠ్యంలో చేర్చలేదు.
