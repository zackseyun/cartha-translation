id: DEU.4.31
reference: Deuteronomy 4:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: te
  text: ఎందుకంటే నీ దేవుడైన యాహ్వే కరుణగల దేవుడు[a]. ఆయన నిన్ను విడిచిపెట్టడు[b], నిన్ను నాశనం చేయడు, నీ పితరులకు ఆయన ప్రమాణం చేసిన నిబంధనను మరచిపోడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కనికరముగల దేవుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిన్ను చేయి విడువడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నీ పూర్వీకులకు.’ హీబ్రూలో ‘నీ పితరులకు’ అని ఉంది; ఇది ఇశ్రాయేలు నిబంధనా పితరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరిక, ప్రోత్సాహానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵל רַחוּם
  choice: కనికరంగల దేవుడు
  rationale: רַחוּםలోని కరుణ, దయ భావాన్ని సహజమైన ఆధునిక తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ప్రత్యక్ష లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఏకవచన సంబోధనతో కూడిన నిబంధనా సంబంధాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לֹא יַרְפְּךָ
  choice: నిన్ను విడిచిపెట్టడు
  rationale: హిఫిల్ రూపంలోని ‘చేయి విడిచిపెట్టు, పరిత్యజించు’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: నిన్ను నాశనం చేయడు
  rationale: שׁחת హిఫిల్‌కు ఈ నిబంధనా హెచ్చరిక సందర్భంలో నేరమైన అర్థాన్ని ఇస్తుంది.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: నిబంధనను మరచిపోడు
  rationale: దేవుడు నిబంధనను మరచిపోడనే మూలంలోని ముఖ్యమైన రూపకాన్ని మృదువుపరచకుండా నిలుపుతుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరులతో
  rationale: ఇశ్రాయేలు నిబంధనా పితరులను సూచించే చారిత్రక పురుషలింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: తాను ప్రమాణం చేసిన
  rationale: נשבעలోని గంభీరమైన ప్రమాణ భావాన్ని నిలుపుతూ, తెలుగులో సంబంధవాక్యాన్ని సహజంగా నిర్మిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: אֲבֹתֶיךָ యొక్క నిబంధనా సూచన
  choice: నీ పితరులు
  alternative: నీ పూర్వీకులు
  rationale: మూలంలోని పురుషలింగ రూపం ఇక్కడ ఇశ్రాయేలు నిబంధనా పితరులను సూచిస్తుంది; విస్తృతమైన ‘పూర్వీకులు’ అనే అర్థం సాధ్యమైనప్పటికీ చారిత్రక నిర్దిష్టతను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన నిబంధనా భాషను కాపాడే శైలి. ఏకవచన ‘నీ/నిన్ను’ ద్వారా హీబ్రూ సంబోధన నిలుపబడింది.
