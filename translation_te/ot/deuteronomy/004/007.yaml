source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: te
  text: ఎందుకంటే, మనం ఆయనకు మొరపెట్టినప్పుడల్లా మన దేవుడైన యాహ్వే మనకు సమీపంగా ఉన్నట్లుగా, తనకు సమీపంగా దేవుళ్లు ఉన్న గొప్ప జనము ఏది?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘దేవుళ్లు.’ ఈ వాక్యం ఇతర జనాల దేవతలను ఇశ్రాయేలు దేవుడైన యాహ్వేతో అలంకారిక ప్రశ్నలో పోలుస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మనం ఆయనకు పిలిచినప్పుడల్లా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే వాదనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: מִי גוֹי גָּדוֹל
  choice: గొప్ప జనము ఏది?
  rationale: హీబ్రూ అలంకారిక ప్రశ్నను సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר לוֹ אֱלֹהִים קְרֹבִים אֵלָיו
  choice: తనకు సమీపంగా దేవుళ్లు ఉన్న
  rationale: קְרֹבִים అనే బహువచన విశేషణం వల్ల אֱלֹהִים ఇక్కడ ఇతర జనాల దేవతలను సూచించే బహువచనంగా గ్రహించబడుతుంది; אֵלָיו లోని ఏకవచన సర్వనామం ‘జనము’ను సూచిస్తుంది.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా ... ఉన్నట్లు
  rationale: כַּ అనే పోలికను ‘ఉన్నట్లు’తో, יהוה అనే దైవనామాన్ని ‘యెహోవా’గా, אֱלֹהֵינוּ ను ఏకవచనార్థంలో ‘మన దేవుడు’గా అందిస్తుంది.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: మనం ఆయనకు మొరపెట్టినప్పుడల్లా
  rationale: בְּכָל తో కూడిన క్రియానామ నిర్మాణం పునరావృత సందర్భాన్ని—‘ఎప్పుడల్లా’—సూచిస్తుంది; ‘మొరపెట్టు’ ప్రార్థనాత్మక పిలుపును సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’; దీనివల్ల పేరును బిరుదుతో భర్తీ చేయకుండా నిలుపుతాం.
- issue: మొదటి భాగంలోని אֱלֹהִים ఏకవచన దేవుణ్ణా, ఇతర దేవతలనూ సూచిస్తుందా
  choice: దేవుళ్లు అనే సాధారణ బహువచనం
  alternative: దేవుడు; దైవిక జీవులు
  rationale: దానికి అనుసంధానమైన קְרֹבִים బహువచనంలో ఉంది; వాక్యం ఇతర జనాల దేవతలను ఇశ్రాయేలు దేవుడైన యెహోవాతో అలంకారికంగా పోలుస్తుంది. వారి వాస్తవికతపై వాక్యం చెప్పినదానికంటే ఎక్కువ తీర్పును అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. ‘జనము’ బైబిలు సందర్భానికి తగిన గంభీరతను ఇస్తుంది; ‘మొరపెట్టు’ ప్రార్థనాత్మక పిలుపును సహజంగా వ్యక్తపరుస్తుంది. అలంకారిక ప్రశ్నను, ఇతర జనాల దేవతలు మరియు యెహోవా మధ్య ఉన్న పోలికలోని ఉద్రిక్తతను అలాగే ఉంచాం.
