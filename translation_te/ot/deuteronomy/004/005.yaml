source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: te
  text: చూడండి[a], నా దేవుడైన యహ్వే నాకు ఆజ్ఞాపించినట్లే, మీరు స్వాధీనం చేసుకోవడానికి అక్కడికి ప్రవేశిస్తున్న ఆ దేశంలో[b] వాటిని ఆచరించడానికి నేను మీకు శాసనాలను, న్యాయవిధులను[c] బోధించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది వ్యాకరణపరంగా ఏకవచన ఆజ్ఞారూపం; ఇక్కడ అది ఇశ్రాయేలు సమాజాన్ని ఒక సమూహంగా సంబోధిస్తుంది. తెలుగులో సమూహ సంబోధనకు ‘చూడండి’ వాడబడింది. ‘ఇదిగో’ అని కూడా అనువదించవచ్చు.
    reason: వ్యాకరణ మరియు పదప్రయోగ ప్రత్యామ్నాయం
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘దేశం మధ్యలో’; ఇక్కడ భావం ‘దేశంలో’ లేదా ‘దేశపు పరిధిలో’. అదే వాక్యంలో ‘అక్కడికి’ అనే దిశాసూచక పదం కూడా ఉంది.
    reason: అక్షరార్థ రూపం మరియు సహజ తెలుగు మధ్య వ్యత్యాసం
  - marker: c
    text: ‘శాసనాలు, న్యాయవిధులు’ అనే పదజోడును ‘కట్టడాలు, న్యాయవిధులు’ లేదా ‘నియమాలు, న్యాయశాసనాలు’ అని కూడా అనువదించవచ్చు.
    reason: పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: רְאֵה
  choice: చూడండి
  rationale: ఏకవచన ఆజ్ఞారూపం ఇశ్రాయేలు సమాజం దృష్టిని ఆకర్షించే సంభాషణా సూచకంగా పనిచేస్తుంది. ఆధునిక తెలుగులో సమూహాన్ని గౌరవంగా ఉద్దేశించేందుకు ‘చూడండి’ సహజంగా ఉంటుంది.
- source_word: לִמַּדְתִּי אֶתְכֶם
  choice: నేను మీకు … బోధించాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను, పూర్తయినప్పటికీ ప్రస్తుత సందర్భానికి ప్రాసంగికమైన బోధనగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֻקִּים
  choice: కట్టడాలు
  rationale: నిర్దేశించబడిన శాసనాలు లేదా నియమాల భావాన్ని నిలుపుతూ ద్వితీయోపదేశకాండంలోని న్యాయపరమైన శైలికి సరిపోతుంది.
- source_word: מִשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయనిర్ణయాలు, న్యాయపరమైన నియమాలు అనే మూలభావాన్ని ‘విధులు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: నాకు ఆజ్ఞాపించినట్లే
  rationale: మోషే బోధన దేవుని ఆజ్ఞకు అనుగుణంగా ఉందనే పోలికను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהָי
  choice: నా దేవుడైన యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరిస్తూ, אֱלֹהָי లోని ‘నా దేవుడు’ అనే సంబంధాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לַעֲשׂוֹת כֵּן
  choice: వాటిని ఆచరించడానికి
  rationale: ‘అలా చేయడానికి’ అనే అక్షరార్థం కంటే, ముందున్న కట్టడాలు మరియు న్యాయవిధులనే ఆచరించాలనే సూచనను తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: ఆ దేశంలో
  rationale: בְּקֶרֶב యొక్క అక్షరార్థం ‘దేశం మధ్యలో’ అయినా, ఇక్కడ దేశపు అంతర్భాగంలో లేదా దాని పరిధిలో అనే భావం ఉంది; భౌగోళిక కేంద్రం అనే అపార్థం రాకుండా సహజంగా అనువదించబడింది.
- source_word: בָּאִים שָׁמָּה לְרִשְׁתָּהּ
  choice: మీరు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న
  rationale: సమీప భవిష్యత్తులో దేశంలోకి ప్రవేశించడం మరియు దాన్ని స్వాధీనం చేసుకోవడం అనే రెండు అంశాలను నిలుపుతుంది; ‘అక్కడికి’ అనే దిశాసూచన తెలుగులో ‘ఆ దేశంలో ప్రవేశించడం’లో సహజంగా అంతర్భవిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని ఇవ్వడం మూలపాఠ భేదాన్ని కాపాడుతుంది.
- issue: לַעֲשׂוֹת כֵּן లో చర్యను చేయవలసిన కర్త
  choice: ఇశ్రాయేలీయులు ఆచరించడానికి
  alternative: యహ్వే మోషేకు ‘అలా చేయమని’ ఆజ్ఞాపించాడు
  rationale: హీబ్రూ అనంతక్రియలో కర్త ప్రత్యక్షంగా లేకపోయినా, కట్టడాలు మరియు న్యాయవిధులను ప్రజలకు బోధించడం, వారు దేశంలో వాటిని పాటించడం అనే సమీప సందర్భం ప్రజలనే భావిత కర్తగా సూచిస్తుంది. అయితే వ్యాకరణ సంక్షిప్తతలోని ఉద్రిక్తతను పూర్తిగా సిద్ధాంతీకరించలేదు.
- issue: ירשׁ యొక్క భూసంబంధ భావం
  choice: స్వాధీనం చేసుకోవడం
  alternative: వారసత్వంగా పొందడం
  rationale: ఈ సందర్భంలో దేశంలోకి ప్రవేశించి దానిని అధీనంలోకి తీసుకోవడం ప్రధాన భావం. ‘వారసత్వంగా పొందడం’ వాగ్దానభూమి అంశాన్ని బలపరచగలిగినా, మూలక్రియకు ఇక్కడ అవసరానికి మించిన ప్రత్యేక వ్యాఖ్యానాన్ని జోడించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా న్యాయపరమైన గంభీరతను నిలిపింది. వాక్యక్రమం తెలుగులో సహజంగా ఉండేలా మార్చినా, బోధన, దైవాజ్ఞ, దేశప్రవేశం, స్వాధీనం, ఆచరణ అనే మూలపాఠ అంశాలన్నీ ఉంచబడ్డాయి.
