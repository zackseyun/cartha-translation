  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: te
  text: నేను మీకు ఆజ్ఞాపిస్తున్న ఈ మాటకు మీరు ఏదీ చేర్చకూడదు; దానిలో నుంచి ఏదీ తీసివేయకూడదు; నేను మీకు ఆజ్ఞాపిస్తున్న మీ దేవుడైన యాహ్వే[a] యొక్క ఆజ్ఞలను పాటించడానికి ఇలా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అనేది మరో లిప్యంతరీకరణ.
    reason: దైవనామానికి సంప్రదాయ అనువాదాన్ని, ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: చేర్చకూడదు
  rationale: హిఫిల్ రూపంతో עַל కలిసినప్పుడు ‘దేనికైనా అదనంగా చేర్చడం’ అనే అర్థం వస్తుంది. ‘చేర్చకూడదు’ ఆధునిక తెలుగులో సహజంగా ఉండి నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַדָּבָר
  choice: మాటకు
  rationale: דבר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘సంగతి’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ మోషే ప్రకటిస్తున్న ఆజ్ఞాబోధ మొత్తాన్ని ఏకవచన సమష్టిగా సూచిస్తున్నందున ‘మాట’ అని అనువదించడం మూలంలోని ఏకవచనాన్ని, పలికిన సందేశ భావాన్ని నిలుపుతుంది.
- source_word: מְצַוֶּה
  choice: ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన కృదంత రూపం, ఈ ప్రసంగ సందర్భంలో జరుగుతున్న ఆజ్ఞాపనను సూచిస్తుంది. ‘ఆజ్ఞాపిస్తున్న’ అనే రూపం ఆ కొనసాగుతున్న తక్షణ చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: దానిలో నుంచి ఏదీ తీసివేయకూడదు
  rationale: גרע అంటే తగ్గించడం లేదా తీసివేయడం. ‘దానిలో నుంచి తీసివేయకూడదు’ అనేది ‘చేర్చకూడదు’కు సహజమైన వ్యతిరేక జతగా ఉంటుంది; ‘ఏదీ’ నిషేధ పరిధిని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לִשְׁמֹר
  choice: అలా ... పాటించాలి
  rationale: ל తో కూడిన క్రియావ్యయం ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది. ‘అలా’ ముందటి నిషేధాలను ఆజ్ఞలను పాటించడంతో అనుసంధానిస్తుంది; ‘పాటించాలి’ covenantal obedience భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: నిబంధనాత్మక, ధర్మశాస్త్ర సందర్భంలో מצות అనేది దేవుడు విధించిన ఆజ్ఞలను సూచిస్తుంది. ‘ఆజ్ఞలు’ ఆధునిక తెలుగులో స్పష్టమైన, గంభీరమైన పదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: YHWHతో కూడిన నిబంధన సూత్రంలో אֱלֹהִים ఏకవచన భావంలో ఉంది. ‘మీ దేవుడైన’ అనే నిర్మాణం యాహ్వేతో దాని సంబంధాన్ని సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో YHWH అనే వ్యక్తిగత నామమే ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నిబంధన నామాన్ని నిలుపుతుంది; పాఠకులకు సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: לִשְׁמֹר యొక్క ఉద్దేశ/ఫలిత సంబంధం
  choice: ‘అలా’ ద్వారా ముందటి నిషేధాలను ఆజ్ఞపాటనతో అనుసంధానించడం
  alternative: ‘పాటించడానికి’ అని ఒకే వాక్య నిర్మాణంలో ఉంచడం
  rationale: హీబ్రూ నిర్మాణం ఉద్దేశం లేదా ఫలితం రెండింటినీ అనుమతిస్తుంది. ‘అలా’ ఈ సంబంధాన్ని నిలుపుతూ తెలుగులో భారమైన, అస్పష్టమైన దీర్ఘవాక్యాన్ని నివారిస్తుంది; ఖచ్చితమైన కారణ సంబంధాన్ని అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘మాట,’ ‘ఆజ్ఞలు,’ ‘పాటించాలి’ వంటి సుపరిచిత పదాలను ఎంచుకుని, మూలంలోని ఏకవచనం, నిషేధాల సమాంతరత, ఉద్దేశ/ఫలిత సంబంధం నిలిపాం.
