  terminology: ‘పర్వతం అడుగున,’ ‘అగ్నితో మండుతుండగా,’ ‘చీకటి,’ ‘మేఘం,’ and ‘గాఢాంధకారం’ are appropriate modern-standard Telugu choices. The footnotes retain the Hebrew image and legitimate alternatives without overinterpreting them.
