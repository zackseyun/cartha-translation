base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: te
  text: మీరు దగ్గరకు వచ్చి పర్వతం అడుగున నిలబడ్డారు. ఆ పర్వతం ఆకాశం నడిమి వరకు[a] అగ్నితో మండుతుండగా—చీకటి, మేఘం, గాఢాంధకారం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆకాశాల హృదయం వరకు”; అంటే ఆకాశం మధ్యకు లేదా దాని ఎత్తుల వరకు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దట్టమైన చీకటి,” “కటిక చీకటి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: మీరు దగ్గరకు వచ్చి
  rationale: קרב అనే క్రియ సమీపించడం లేదా దగ్గరకు రావడం అనే సాధారణ అర్థాన్ని ఇస్తుంది; రెండవ పురుష బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַתַּעַמְדוּן
  choice: నిలబడ్డారు
  rationale: עמד యొక్క సరళమైన కథనార్థం ‘నిలబడడం’; తెలుగు కథన ప్రవాహంలో సహజంగా ఉంది.
- source_word: תַּחַת הָהָר
  choice: పర్వతం అడుగున
  rationale: תחת అక్షరార్థంగా ‘కింద’ అయినా, పర్వతానికి సంబంధించిన ఈ స్థలసందర్భంలో దాని పాదం లేదా అడుగు భాగాన్ని సూచిస్తుంది.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: అగ్నితో మండుతుండగా
  rationale: బహువర్తమాన కృదంతం కొనసాగుతున్న స్థితిని సూచిస్తుంది; అగ్ని అనే స్పష్టమైన పదాన్ని కూడా నిలుపుతుంది.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: ఆకాశం నడిమి వరకు
  rationale: లֵב అక్షరార్థంగా ‘హృదయం’; ఇక్కడ మధ్యభాగం లేదా అత్యున్నత ఆకాశ విస్తారాన్ని సూచించే నుడికారం. సహజమైన తెలుగులో భావాన్ని ఇచ్చి, అక్షరచిత్రాన్ని పాదసూచికలో ఉంచాం.
- source_word: חֹשֶׁךְ
  choice: చీకటి
  rationale: దైవ ప్రత్యక్షతను చుట్టుముట్టిన అంధకారాన్ని తెలిపే సాధారణ, స్పష్టమైన పదం.
- source_word: עָנָן
  choice: మేఘం
  rationale: ఏకవచన సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַעֲרָפֶל
  choice: గాఢాంధకారం
  rationale: עֲרָפֶל సూచించే దట్టమైన, కప్పివేసే చీకటిని తెలియజేస్తూ, ముందున్న חֹשֶׁךְ కంటే తీవ్రతను వేరుగా చూపుతుంది.
theological_decisions:
- issue: సీనాయి దైవప్రత్యక్షతలోని అగ్ని, చీకటి, మేఘం, గాఢాంధకారం చిత్రణ
  choice: వాతావరణాన్ని కేవలం సహజ వాతావరణ పరిస్థితులుగా మార్చకుండా, భయభక్తులను కలిగించే స్పష్టమైన చిత్రణగా నిలుపడం
  alternative: చివరి పదాలను సాధారణ వాతావరణ పరిస్థితులుగా సడలించి అనువదించడం
  rationale: మూలవచనం దైవ ప్రత్యక్షతకు సంబంధించిన బహుస్థర చిత్రణను ఇస్తుంది. అనువాదం దానికి అదనపు సిద్ధాంత వివరణ జోడించకుండా దాని గంభీరతను, ఉత్కంఠను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఆకాశం నడిమి’ మూలంలోని నుడికార భావాన్ని అందుబాటులో ఉంచుతుంది; ‘ఆకాశాల హృదయం’ అనే హీబ్రూ రూపకం పాదసూచికలో భద్రపరచబడింది. మూలంలోని చివరి నామపదాల వరుసకు తెలుగులో వాక్యపూర్ణత కోసం ‘కమ్ముకున్నాయి’ చేర్చబడింది.
