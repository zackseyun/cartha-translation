revisions:
- from: వారు అతని దేశాన్నీ, బాషాను పాలించిన ఓగు దేశాన్నీ స్వాధీనం చేసుకున్నారు. ఆ ఇద్దరూ యొర్దాను అవతల[a], సూర్యోదయ దిశలో[b] ఉన్న అమోరీయుల రాజులు.
  to: వారు అతని దేశాన్ని, బాషానుకు రాజైన ఓగు యొక్క దేశాన్నీ స్వాధీనం చేసుకున్నారు. అవి యొర్దాను అవతల[a], సూర్యోదయ దిశలో[b] ఉన్న అమోరీయుల ఆ ఇద్దరు రాజుల దేశాలు.
  rationale: The revision retains the source’s territorial-possession sense and the deliberate geographical relativity of “beyond/across the Jordan.” It explicitly links both lands to the two Amorite kings, while retaining the contextual reference of “his land” to Sihon and naming Og as king of Bashan.
