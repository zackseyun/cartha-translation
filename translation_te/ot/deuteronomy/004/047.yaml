translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన హీబ్రూ వాక్యనిర్మాణాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, ‘ఆ ఇద్దరూ’ ద్వారా సంబంధాన్ని నిలిపాం. భౌగోళిక నుడికారంలోని దృక్కోణ అస్పష్టతను ప్రధాన పాఠంలోను అడుగుసూచికలోను కాపాడాం.
