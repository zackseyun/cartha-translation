source:
  edition: WLC
  text: וַ/יִּֽירְשׁ֨וּ אֶת אַרְצ֜/וֹ וְ/אֶת אֶ֣רֶץ ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: te
  text: వారు అతని దేశాన్ని, బాషానుకు రాజైన ఓగు యొక్క దేశాన్నీ స్వాధీనం చేసుకున్నారు. అవి యొర్దాను అవతల[a], సూర్యోదయ దిశలో[b] ఉన్న అమోరీయుల ఆ ఇద్దరు రాజుల దేశాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యొర్దాను దాటి,” లేక “యొర్దానుకు ఆవలి వైపున.” హీబ్రూ పదబంధం ఒక ప్రామాణిక భౌగోళిక నుడికారం; అది ఏ వైపును సూచిస్తుందనేది కథన దృక్కోణంపై ఆధారపడి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “సూర్యుడు ఉదయించే దిశలో”; అంటే తూర్పువైపు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: యుద్ధం ద్వారా ఒక ప్రాంతాన్ని తమ ఆధీనంలోకి తెచ్చుకోవడం అనే ירשׁ క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వారసత్వంగా పొందారు’ అనే అనుచిత భావాన్ని నివారిస్తుంది.
- source_word: אַרְצוֹ
  choice: అతని దేశం
  rationale: పూర్వ సందర్భంలోని సీహోనును సూచించే మూడవ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను పాలించిన ఓగు దేశం
  rationale: ఓగు బాషాను రాజు అనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, אֶרֶץ‌ను ‘దేశం’గా నిలుపుతుంది.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: అమోరీయుల రాజులు—ఆ ఇద్దరూ
  rationale: సీహోను, ఓగు అనే ఇద్దరినీ సమష్టిగా అమోరీయుల రాజులుగా గుర్తించే మూలపాఠ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: ఇది ప్రామాణిక భౌగోళిక నుడికారం. కథన దృక్కోణాన్ని ఖచ్చితంగా నిర్ణయించకుండా మూలంలోని సాపేక్షతను కాపాడుతుంది.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: సూర్యోదయ దిశలో
  rationale: తూర్పును సూచించే మూలంలోని స్పష్టమైన సూర్యోదయ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
