  text: וְ/שָׁמַרְתָּ֞ אֶת חֻקָּ֣י/ו וְ/אֶת מִצְוֺתָ֗י/ו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּ/ךָ֙ הַ/יּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וּ/לְ/בָנֶ֖י/ךָ אַחֲרֶ֑י/ךָ וּ/לְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל הַ֣/אֲדָמָ֔ה אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: te
  text: కాబట్టి, ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన విధులను, ఆయన ఆజ్ఞలను నీవు పాటించాలి. అప్పుడు నీకూ, నీ తరువాత నీ పిల్లలకూ[b] మేలు కలుగుతుంది[a]. అంతేకాక, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలో[c] నీవు నీ దినములన్నీ దీర్ఘకాలం జీవిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మేలు కలుగుతుంది’ అని అనువదించిన హీబ్రూ నుడికారాన్ని ‘నీకు మంచి జరుగుతుంది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ పిల్లలు’ అనే మాటను ‘నీ కుమారులు’ అని లేదా ఈ సందర్భంలో మరింత విస్తృతంగా ‘నీ వంశస్థులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘నేలపై’; సందర్భానుసారం ‘దేశంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: కాబట్టి ... నీవు పాటించాలి
  rationale: సందర్భంలోని నిర్ధేశాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ముందు వాదనతో ఉన్న సంబంధాన్ని ‘కాబట్టి’ నిలుపుతుంది.
- source_word: חֻקָּיו
  choice: ఆయన కట్టడలను
  rationale: దేవుడు నిర్దేశించిన నియమావళిని సూచిస్తుంది; తరువాతి ‘ఆజ్ఞలు’ అనే పదంతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: ఒడంబడిక సందర్భంలోని అధికారపూర్వక ఆదేశాలను స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంతం తెలిపే తక్షణ ప్రసంగ సందర్భాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: అప్పుడు నీకు ... మేలు కలుగుతుంది
  rationale: హీబ్రూ ప్రయోగం శ్రేయస్సు కలగడాన్ని సూచిస్తుంది; తెలుగు పాఠకులకు సహజమైన ఫలిత వాక్యంగా అందిస్తుంది.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: నీ తరువాత నీ పిల్లలకు
  rationale: בנים సందర్భానుసారం కుమారులు, పిల్లలు, లేదా వంశస్థులు కావచ్చు; ఇక్కడ తరతరాల సంతానాన్ని సూచించే విస్తృత భావానికి ‘పిల్లలు’ సరిపోతుంది.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: నీవు చిరకాలం జీవిస్తావు
  rationale: ‘రోజులను పొడిగించు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ దీర్ఘాయుష్షు భావాన్ని నిలుపుతుంది.
- source_word: עַל הָאֲדָמָה
  choice: నేలపై
  rationale: עַל అనే విభక్తి యొక్క ‘పై’ భావాన్ని నిలుపుతూ, אֲדָמָהను దేవుడు ఇచ్చే భూభాగంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో మార్చకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: נֹתֵן לְךָ
  choice: నీకు ... ఇస్తున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా సమీప కార్య భావాన్ని నిలుపుతుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లకాలం
  rationale: ఇక్కడ దేవుడు నేలను ఇచ్చే స్థిరమైన కాలవ్యాప్తిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ఒడంబడిక నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: ఆజ్ఞాపాలనకు అనుసంధానమైన శ్రేయస్సు, దీర్ఘాయుష్షు
  choice: వాక్యంలోని ఫలిత సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని నిబంధనలేని విశ్వవ్యాప్త హామీగా విస్తరించడం
  rationale: వచనం ఇశ్రాయేలుతో చెప్పబడిన ఒడంబడిక సందర్భంలో ఆజ్ఞాపాలన, శ్రేయస్సు, భూమిలో దీర్ఘజీవితం మధ్య సంబంధాన్ని చెబుతుంది; దానిని వేరే సిద్ధాంతంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. ‘కట్టడలు’ మరియు ‘ఆజ్ఞలు’ మధ్య మూలపాఠంలోని పదభేదాన్ని కాపాడాం; హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో సహజమైన తెలుగుగా ఇచ్చి, అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో ఉంచాం.
