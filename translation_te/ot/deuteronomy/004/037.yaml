  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: te
  text: ఆయన నీ పితరులను ప్రేమించి, వారి తరువాత వారి సంతానాన్ని[a] ఎంచుకున్నాడు కాబట్టి, తన సన్నిధితో[b], తన గొప్ప శక్తితో నిన్ను ఐగుప్తులో నుండి బయటకు తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని తరువాత అతని సంతానాన్ని.” హీబ్రూలో ప్రత్యయాలు ఏకవచనంలో ఉన్నాయి; అవి “నీ పితరులు” అనే సమష్టిని సూచిస్తున్నట్లు అనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన ముఖంతో” లేదా “తన ఎదుట.” ఇక్కడ ఈ మాట దేవుని స్వీయ సన్నిధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: కాబట్టి
  rationale: ఈ హీబ్రూ పదబంధం ముందున్న విషయానికి కారణాన్ని తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణంలో కారణవాచక ఉపవాక్యం చివర ‘కాబట్టి’ ఉంచడం సహజంగా ఉంటుంది.
- source_word: אָהַב
  choice: ప్రేమించి
  rationale: క్రియకు నేరమైన అర్థం ‘ప్రేమించు’; మూలంలో లేని అదనపు భావాన్ని చేర్చకుండా దీనిని నిలుపుతుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరులను
  rationale: మూలంలోని పురుష బహువచనాన్ని, ఒడంబడిక సంబంధమైన పూర్వపితరుల సూచనను కాపాడుతుంది.
- source_word: וַיִּבְחַר
  choice: ఎంచుకున్నాడు
  rationale: בחר యొక్క సాధారణ అర్థాన్ని స్పష్టంగా అందిస్తూ, తరువాతి సాంకేతిక మతపరమైన పదజాలాన్ని దిగుమతి చేయదు.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: వారి తరువాత వారి సంతానాన్ని
  rationale: హీబ్రూలో ప్రత్యయాలు ఏకవచనంలో ఉన్నా, ముందు వచ్చిన ‘నీ పితరులు’ సమష్టిగా సూచింపబడుతున్నారు. తెలుగు బహువచనం సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; పాదటిప్పణి రూపనిష్ఠ ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
- source_word: וַיּוֹצִאֲךָ
  choice: నిన్ను ... బయటకు తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపం ‘బయటకు తీసుకురావడం’ అనే నిర్గమన ప్రయోగాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בְּפָנָיו
  choice: తన సన్నిధితో
  rationale: అక్షరార్థంగా ‘తన ముఖంతో/తన ఎదుట’ అయిన ఈ పదబంధం ఇక్కడ దేవుని స్వీయ సాన్నిధ్యాన్ని సూచిస్తుంది. ‘తన సన్నిధితో’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: తన గొప్ప శక్తితో
  rationale: כח కు ‘శక్తి’ నేరమైన సమానార్థకం; ‘తో’ సాధనార్థక ప్రయోగాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులో నుండి
  rationale: నిర్గమన క్రియతో కలిసి, ఐగుప్తు లోపలి నుండి బయటకు తీసుకురావడాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘అతని తరువాత అతని సంతానం’ అనే ఏకవచన ప్రత్యయాల అనువాదం
  choice: వారి తరువాత వారి సంతానాన్ని
  alternative: అతని తరువాత అతని సంతానాన్ని
  rationale: హీబ్రూ రూపం ఏకవచనమైనప్పటికీ, దాని పూర్వపదమైన ‘నీ పితరులు’ను సమష్టిగా తీసుకోవడం సందర్భోచితం. ప్రధాన పాఠంలో సహజమైన బహువచనాన్ని వాడి, నిజమైన వ్యాకరణ అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
- issue: בְּפָנָיו యొక్క భావం
  choice: తన సన్నిధితో
  alternative: తన ముఖంతో; తన ఎదుట
  rationale: ఈ సందర్భంలో దేవుడే స్వయంగా ఇశ్రాయేలును బయటకు తీసుకొచ్చాడనే భావం ప్రధానంగా ఉంది. అయినా అక్షరార్థ ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చి మూలంలోని రూపకాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని అనుసరించాం. ‘పితరులు,’ ‘సంతానం,’ ‘సన్నిధి’ వంటి బైబిలు సందర్భానికి తగిన పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
