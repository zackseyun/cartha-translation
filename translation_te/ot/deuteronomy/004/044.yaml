  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల ఎదుట మోషే ఉంచిన ధర్మశాస్త్రం ఇదే:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు,’ ‘ఇశ్రాయేలు ప్రజలు’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతానం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ఇదే
  rationale: ఈ పదబంధం తరువాతి విభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇదే’ సహజమైన ప్రదర్శనాత్మక బలాన్ని ఇస్తుంది; వావ్ సంధిని ప్రత్యేకంగా ‘మరియు’ అని అనువదిస్తే శీర్షికసదృశమైన ఈ వాక్యం అసహజంగా వినిపిస్తుంది.
- source_word: הַתּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: తోరా అనే పదం విస్తృతంగా ‘బోధ/ఉపదేశం’ అని అర్థమవగలిగినా, ఇక్కడ మోషే ఇశ్రాయేలీయుల ఎదుట ఉంచిన నిబంధన సంబంధమైన ధర్మబోధను సూచిస్తుంది. ‘ధర్మశాస్త్రం’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: אֲשֶׁר שָׂם
  choice: ఉంచిన
  rationale: שׂוּם అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే మూలార్థం ఉంది. לִפְנֵיతో కలిసినప్పుడు ప్రజల ఎదుట అధికారికంగా సమర్పించడాన్ని తెలుపుతుంది; తెలుగులో ‘ఎదుట ... ఉంచిన’ దీనిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ధర్మశాస్త్రాన్ని వినే ప్రజల సమక్షంలో ఉంచడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని ‘కుమారులు’గా నిలుపుతూ, అది జాతీయ సమూహానికి వాడిన సంప్రదాయ సంజ్ఞ అని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక జాతీయ సంజ్ఞ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు; ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఈ పదబంధం మొత్తం జాతిని సూచించే సందర్భార్థాన్ని పాదటిప్పణిలో తెలియజేశాం. దీనివల్ల మూలరూపం గానీ, దాని సామూహిక ప్రయోగం గానీ మరుగుపడవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాక్యం తరువాతి ధర్మశాస్త్ర విభాగానికి శీర్షికసదృశ పరిచయంగా ఉండేలా సంక్షిప్తంగా ఉంచబడింది; మూలంలోని జాతీయ సంజ్ఞకు సంబంధించిన లింగరూపం ప్రధాన పాఠ్యంలో పరిరక్షించబడింది.
