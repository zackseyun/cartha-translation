  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: te
  text: బయల్పెయోరు వద్ద[a] యెహోవా చేసినది ఏమిటో మీరు మీ కళ్లతోనే చూశారు. బయల్పెయోరును అనుసరించిన ప్రతి మనిషిని మీ దేవుడైన యెహోవా మీ మధ్యనుండి నిర్మూలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయల్పెయోరును అనుసరించిన ప్రతి ఒక్కరిని.” హీబ్రూలో అక్షరార్థంగా, “బయల్పెయోరును అనుసరించిన ప్రతి మనిషిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: మీరు మీ కళ్లతోనే చూశారు
  rationale: హీబ్రూ నిర్మాణంలోని ప్రత్యక్ష సాక్ష్యపు ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడో
  rationale: బయల్పెయోరు సంఘటనలో యెహోవా చేసిన న్యాయతీర్పును సూచించే సాధారణ క్రియ; సందర్భానుసారంగా భూతకాలం సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో ఉంచింది.
- source_word: בְּבַעַל פְּעוֹר
  choice: బయల్పెయోరు విషయంలో
  rationale: בְּ ఇక్కడ ఆ పేరుతో ముడిపడిన సంఘటనను సూచిస్తుంది. ఇది స్థలాన్నా, దేవతనన్నా ముందుగానే నిర్ణయించకుండా సందర్భ సంబంధాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ప్రత్యేక అనుసంధాన పదం లేకుండా వాక్య విభజన
  rationale: రెండవ వాక్యం మొదటిదాన్ని వివరిస్తుంది; తెలుగులో పక్కపక్కన ఉంచిన వాక్యాల ద్వారానే ఆ వివరణాత్మక సంబంధం సహజంగా స్పష్టమవుతుంది.
- source_word: כָּל הָאִישׁ
  choice: ప్రతి మనిషినీ
  rationale: పుంలింగ ఏకవచన పంపిణీ భావాన్ని నిలుపుతూ, తెలుగులో వ్యక్తిగతంగా ఒక్కొక్కరినీ సూచించే సహజమైన రూపం.
- source_word: הָלַךְ אַחֲרֵי
  choice: అనుసరించిన
  rationale: విగ్రహారాధనా విధేయతతో వెంబడించడమనే హీబ్రూ నుడికార భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִשְׁמִידוֹ
  choice: నాశనం చేశాడు
  rationale: హిఫిల్ క్రియలోని సంపూర్ణ నిర్మూలన/నాశన భావాన్ని బలంగా, గౌరవప్రదంగా తెలియజేస్తుంది; తెలుగు వాక్యంలో కర్మకు -నీ విభక్తి ఉండటంతో అంతర్నిహిత ఏకవచన కర్మ స్పష్టంగా ఉంది.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుడైన
  rationale: దైవనామంతో సమానాధికార సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: מִקִּרְבֶּךָ
  choice: మీ మధ్యనుండి
  rationale: ఒడంబడిక సమాజం లోపలినుండి తొలగించబడిన భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: כָּל הָאִישׁ యొక్క పుంలింగ పంపిణీ ఏకవచనం
  choice: ప్రతి మనిషినీ
  alternative: ప్రతి పురుషుణ్ణీ
  rationale: సందర్భంలో విగ్రహాన్ని అనుసరించిన వారిని ఒక్కొక్కరిగా సూచించే పంపిణీ భావాన్ని నిలుపుతుంది. ‘ప్రతి పురుషుణ్ణీ’ వ్యాకరణ లింగాన్ని మరింత కఠినంగా చూపినా, ‘మనిషి’ ఇక్కడ వ్యక్తిగత మానవ సూచనగా సహజంగా ఉంది.
- issue: בַעַל פְּעוֹר సూచనలోని భావ పరిధి
  choice: బయల్పెయోరు విషయంలో
  alternative: బయల్పెయోరు వద్ద
  rationale: ఈ పేరు దేవత/ఆరాధన మరియు దానితో ముడిపడిన సంఘటన-స్థలాన్ని సూచించగలదు. ‘విషయంలో’ అని అనడం మూలంలోని సందర్భ సంబంధాన్ని కాపాడుతూ ఒకే అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ రూపొందించబడింది. ప్రత్యక్ష సాక్ష్యపు ఉద్ఘాటన కోసం ‘మీ కళ్లతోనే’ వాడబడింది. ఏ పాదటిప్పణీ అవసరం లేకపోవడంతో ప్రధాన పాఠ్యంలో గుర్తులు లేవు.
