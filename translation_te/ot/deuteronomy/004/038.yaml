revisions:
- from: నీ కంటే గొప్పవీ బలమైనవీ అయిన జనాలను నీ ఎదుట నుంచి వెళ్లగొట్టి[a], నిన్ను లోపలికి తీసుకువచ్చి, వారి దేశాన్ని నీకు స్వాస్థ్యంగా ఇవ్వడానికి—ఈ రోజు ఉన్నట్టుగానే.
  to: నీ కంటే గొప్పవీ బలమైనవీ అయిన జాతులను నీ ఎదుటనుండి వెళ్లగొట్టి[a], నిన్ను తీసుకువచ్చి, వారి దేశాన్ని నీకు స్వాస్థ్యంగా ఇవ్వడానికి—ఈనాడు ఉన్నట్టుగా[b].
  rationale: సవరణ మూలంలోని తులనాత్మక, స్థానసూచక, మరియు స్వాస్థ్య-భావాలను కాపాడుతుంది. గమ్యస్థానాన్ని అవసరం లేకుండా చేర్చకుండా ‘తీసుకువచ్చి’ అని ఉంచబడింది. రెండు ఆంగ్ల ఆడిట్-ట్రెయిల్ పాదసూచికలకూ సరిపడే [a], [b] గుర్తులు మరియు మూలానుగుణమైన తెలుగు వివరణలు ఇవ్వబడ్డాయి.
  reviewer_model: gpt-5.6-terra
