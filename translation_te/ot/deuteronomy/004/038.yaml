source:
  edition: WLC
  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: te
  text: నీ కంటే గొప్పవీ బలమైనవీ అయిన జాతులను నీ ఎదుటనుండి వెళ్లగొట్టి[a], నిన్ను తీసుకువచ్చి, వారి దేశాన్ని నీకు స్వాస్థ్యంగా ఇవ్వడానికి—ఈనాడు ఉన్నట్టుగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్వాధీనం కోల్పోయేలా చేసి.’ ఇక్కడి హీబ్రూ క్రియ, ముందుగా నివసిస్తున్నవారిని తొలగించి మరొకరు ఆ దేశాన్ని పొందేలా చేయడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘ఈ రోజు వలె.’ ఇది ‘ఈనాడు స్పష్టంగా ఉన్నట్టుగా’ లేదా ‘ప్రస్తుతం ఉన్న స్థితి ప్రకారం’ అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: వెళ్లగొట్టి
  rationale: హిఫిల్ రూపంలో ఈ క్రియ, ముందుగా నివసిస్తున్నవారిని తొలగించి మరొకరు వారి స్థలాన్ని పొందేలా చేయడాన్ని సూచిస్తుంది. ఇక్కడ కర్మగా ‘జనాలు’ ఉన్నందున ‘వెళ్లగొట్టి’ సహజంగా ఉంది.
- source_word: גּוֹיִם
  choice: జనాలను
  rationale: ఇది రాజకీయ-జాతి సమూహాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘జనాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, సందర్భంలోని ప్రజాసమూహ భావాన్ని నిలుపుతుంది.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: నీ కంటే గొప్పవీ బలమైనవీ అయిన
  rationale: מִמְּךָ సూచించే తులనాత్మక భావాన్ని స్పష్టంగా ఉంచుతూ, పరిమాణం/ప్రాముఖ్యత మరియు సైనిక బలం అనే జంట భావాలను కాపాడుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుట నుంచి
  rationale: వారి ఉనికిని ఇశ్రాయేలు ఎదుట నుంచి తొలగించడమనే హీబ్రూ స్థలసూచక నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַהֲבִיאֲךָ
  choice: నిన్ను లోపలికి తీసుకువచ్చి
  rationale: హిఫిల్ క్రియలోని ‘రప్పించడం/తీసుకురావడం’ భావాన్ని, సందర్భం సూచించే దేశంలోకి ప్రవేశాన్ని స్పష్టం చేస్తూ అనువదిస్తుంది.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: వారి దేశాన్ని నీకు ... ఇవ్వడానికి
  rationale: దైవిక వరం అనే వాక్య నిర్మాణాన్ని నేరుగా కాపాడుతుంది; אֶרֶץ ఇక్కడ ప్రజలు నివసించే భూభాగం కాబట్టి ‘దేశం’ సరిపోతుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: వారసత్వంగా లభించి నిలిచే భూసంపద అనే నిబంధనాత్మక భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు ఉన్నట్టుగానే
  rationale: ప్రస్తుతానికి స్పష్టంగా కనిపిస్తున్న స్థితిని సూచించే ద్వితీయోపదేశకాండ నుడికారాన్ని, దాని కాలసూచనను చెరపకుండా సహజ తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: נַחֲלָה లోని నిబంధన-దేశ భావం
  choice: స్వాస్థ్యంగా
  alternative: సొత్తుగా
  rationale: ‘సొత్తు’ కేవలం యాజమాన్యాన్ని సూచించవచ్చు; ‘స్వాస్థ్యం’ దేవుడు ఇచ్చిన, తరతరాలకు చెందే భూవారసత్వ భావాన్ని మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వరుస ఉద్దేశ్య క్రియలను తెలుగులో సహజంగా కలిపి, తులనాత్మక భావం మరియు దేశం దైవిక స్వాస్థ్యంగా ఇవ్వబడే అంశం నిలుపబడ్డాయి. ప్రధాన పాఠంలో ఉన్న ఏకైక పాదసూచిక గుర్తు [a]కు అనుగుణంగా పాదసూచిక ఇవ్వబడింది.
