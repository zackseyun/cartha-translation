source:
  edition: WLC
  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: te
  text: లేక ఏ దేవుడైనా మరొక జనాంగం మధ్యనుండి తన కోసం ఒక జనాంగాన్ని తీసుకోవడానికి వెళ్లి, పరీక్షలతో, సూచక కార్యాలతో, అద్భుతాలతో, యుద్ధంతో, బలమైన చేతితో, చాచిన బాహువుతో, గొప్ప భయానక కార్యాలతో[a], మీ దేవుడైన యాహ్వే ఈజిప్టులో మీ కళ్లముందు మీ కొరకు చేసిన వాటన్నిటిలా, ఎప్పుడైనా చేయడానికి పూనుకున్నాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొప్ప భీతులతో,” లేదా “భయభక్తులు పుట్టించే గొప్ప కార్యాలతో.” హెబ్రీ పదబంధం భయాన్నీ విస్మయాన్నీ కలిగించే కార్యాలను లేదా వాటి ప్రభావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: ఎప్పుడైనా పూనుకున్నాడా
  rationale: נסה ఇక్కడ ‘ప్రయత్నించు/చేయడానికి పూనుకొను’ అనే భావాన్ని ఇస్తుంది. అలాంటి కార్యం విఫలమై ఉండవచ్చనే భావం రాకుండా, దాని అపూర్వతను ప్రశ్నారూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: ఏ దేవుడైనా
  rationale: నిర్దిష్ట ఉపపదం లేని ఈ నామవాచకం యాహ్వే కార్యాలతో ఇతర దేవతల కార్యాలను పోల్చే అలంకారిక ప్రశ్నలో ఉంది; అందువల్ల అనిర్దిష్ట భావాన్ని ‘ఏ దేవుడైనా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָבוֹא לָקַחַת
  choice: తీసుకోవడానికి వెళ్లి
  rationale: మొదట ఉద్దేశపూర్వకంగా వెళ్లడం, తరువాత తీసుకోవడం అనే క్రియాక్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: మరొక జనాంగం మధ్యనుండి ... ఒక జనాంగాన్ని
  rationale: ఒక రాజకీయ సమూహం లోపలినుండి మరో ప్రజాసమూహాన్ని వెలికి తీసే బలమైన హెబ్రీ చిత్రాన్ని, ‘జనాంగం’ అనే పదపునరుక్తితో నిలుపుతుంది.
- source_word: בְּמַסֹּת
  choice: పరీక్షలతో
  rationale: నిర్గమ సందర్భంలోని పరీక్షించే సంఘటనలు లేదా తీర్పులను సూచించే విస్తృత పదం; ఆధునిక తెలుగులో ‘శోధనలు’ కంటే స్పష్టంగా ఉంటుంది.
- source_word: בְּאֹתֹת
  choice: సూచక క్రియలతో
  rationale: אותות కేవలం గుర్తులు కాక, దైవ కార్యాన్ని సూచించే సంఘటనలు; ‘సూచక క్రియలు’ ఆ సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: וּבְמוֹפְתִים
  choice: అద్భుతాలతో
  rationale: అసాధారణమైన, ఆశ్చర్యం కలిగించే కార్యాలను సహజ తెలుగులో వ్యక్తం చేస్తూ ‘సూచక క్రియలు’తో ఉన్న జంటను నిలుపుతుంది.
- source_word: וּבְמִלְחָמָה
  choice: యుద్ధంతో
  rationale: ఏకవచన నామవాచకాన్ని అలాగే నిలిపి, ఈజిప్టుపై యాహ్వే సాధించిన యుద్ధసంబంధ విజయాన్ని సూచిస్తుంది.
- source_word: וּבְיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: నిర్గమ సంప్రదాయంలోని స్థిరమైన రూపకాన్ని సూటిగా, అర్థవంతంగా నిలుపుతుంది.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: చాచిన బాహువుతో
  rationale: దైవశక్తి కార్యరూపంలో ప్రదర్శించబడినదని తెలిపే స్థిరమైన నిర్గమ రూపకాన్ని గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: గొప్ప భయానక కార్యాలతో
  rationale: భయాన్నీ విస్మయాన్నీ పుట్టించే కార్యాలు అనే భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని పదం కార్యాలనో వాటివల్ల కలిగిన భీతినో సూచించగల అస్పష్టతను పాదసూచికలో ఉంచింది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: చేసిన వాటన్నిటిలా
  rationale: పోలికతోపాటు כֹל లోని సమగ్రతను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అలంకారిక పోలికలో אֱלֹהִים సూచన
  choice: ఏ దేవుడైనా
  alternative: దేవుడు
  rationale: మొదటి ప్రశ్నలో నిజ దేవుడినే నేరుగా సూచిస్తున్నట్టు కాకుండా, యాహ్వే విమోచన కార్యాల అపూర్వతను ఇతర దేవతలతో పోల్చే వాదనాత్మక శక్తిని నిలుపుతుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ నామానికి దగ్గరైన రూపాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: לכם అనే బహువచనం, לעיניך అనే సమూహ ఏకవచనం
  choice: మీ కోసం ... మీ కళ్లముందే
  alternative: మీ కోసం ... నీ కళ్లముందే
  rationale: హెబ్రీలోని సంబోధన-వచన మార్పు ఇశ్రాయేలును సమూహంగా ఉద్దేశించినది. తెలుగులో అకస్మాత్తుగా ఏకవచనానికి మారితే వ్యక్తి మారినట్టు అపార్థం కలుగుతుంది కాబట్టి భావపరమైన బహువచనాన్ని కొనసాగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ప్రజలకు అర్థమయ్యే శైలి వాడబడింది. హెబ్రీలోని పొడవైన అలంకారిక ప్రశ్న తెలుగులో స్పష్టత కోసం పరస్పర సంబంధమున్న రెండు ప్రశ్నలుగా అమర్చబడింది; సాధనార్థక పదాల వరుసను మాత్రం నిలుపుకుంది. పాదసూచిక గుర్తు సంబంధిత ‘గొప్ప భయానక కార్యాలతో’ అన్న పదబంధం వెంట ఉంచబడింది.
