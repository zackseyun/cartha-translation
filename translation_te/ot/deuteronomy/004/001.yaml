source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: te
  text: ఇప్పుడు, ఇశ్రాయేలూ, మీరు ఆచరించడానికి నేను మీకు బోధిస్తున్న కట్టడాలను, న్యాయవిధులను[a] విను; మీరు జీవించి, మీ పితరుల దేవుడైన యాహ్వే[c] మీకు ఇస్తున్న దేశంలోకి ప్రవేశించి దానిని స్వాధీనం చేసుకోవడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కట్టడాలు, న్యాయవిధులు” అని అనువదించిన పదబంధాన్ని “శాసనాలు, విధులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “స్వాధీనం చేసుకోవడానికి” అనే మాటకు “సొంతం చేసుకోవడానికి” లేదా “వారసత్వంగా పొందడానికి” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూలో: “YHWH”; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: మునుపటి ప్రసంగంతో సంబంధాన్ని కొనసాగించే సహజమైన తెలుగు సంధి; హీబ్రూ వాక్యారంభంలోని וְ ను విడిగా ‘మరియు’ అని పలకడం తెలుగులో అనవసరంగా భారంగా ఉంటుంది.
- source_word: שְׁמַע אֶל
  choice: విను
  rationale: శ్రద్ధగా విని పాటించాలనే అంతర్భావం ఉన్నా, ‘లోబడుము’ అని అనువదిస్తే భావాన్ని అతిగా నిర్ధారించినట్లవుతుంది; ఆచరణ భావం తరువాతి לַעֲשׂוֹת లో స్పష్టమవుతుంది.
- source_word: הַחֻקִּים
  choice: కట్టడాలు
  rationale: నిర్దేశించబడిన శాసనాల భావాన్ని ఇస్తూ, తరువాతి מִשְׁפָּטִים తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: చట్టపరమైన, న్యాయనిర్ణయ సంబంధమైన భావాన్ని తెలియజేస్తూ חֻקִּים కు భిన్నమైన పదంగా నిలుస్తుంది.
- source_word: מְלַמֵּד
  choice: బోధిస్తున్న
  rationale: హీబ్రూ క్రియావిశేషణ రూపంలోని కొనసాగుతున్న వర్తమాన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: ఆచరించమని
  rationale: కేవలం తెలుసుకోవడం కాక ఆ విధులను కార్యరూపంలో పెట్టడం ఉద్దేశమని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְמַעַן תִּחְיוּ
  choice: అప్పుడు మీరు జీవించి
  rationale: హీబ్రూ ఉద్దేశం/ఫలితం సంబంధాన్ని తెలుగు వాక్యప్రవాహంలో చూపుతుంది; ‘జీవిస్తారు’ అనే నిబంధనాత్మక ఫలితాన్ని నిలుపుతుంది.
- source_word: וּבָאתֶם
  choice: దేశంలోకి ప్రవేశించి
  rationale: వాగ్దాన దేశంలోకి వెళ్లే దిశాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וִירִשְׁתֶּם
  choice: దాన్ని స్వాధీనం చేసుకుంటారు
  rationale: భూమిని పొందడం, స్వంతం చేసుకోవడం అనే సందర్భోచిత అర్థాన్ని ఇస్తుంది; ‘వారసత్వంగా పొందడం’ కూడా సాధ్యమైన భావమని పాదటీపులో ఉంచబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: హీబ్రూలోని పితృపూర్వికుల నిబంధనా సూత్రాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామంగా ఉంచాం; ఆధునిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: లְמַעַן తరువాతి క్రియల ఉద్దేశం–ఫలితం సంబంధం
  choice: ‘అప్పుడు’ ద్వారా ఫలిత సంబంధం
  alternative: ‘మీరు జీవించి... స్వాధీనం చేసుకునేలా’ అనే స్పష్టమైన ఉద్దేశార్థ నిర్మాణం
  rationale: హీబ్రూ రూపం ఉద్దేశం మరియు ఫలితం రెండింటికీ అవకాశం ఇస్తుంది. తెలుగు వాక్యంలో ‘అప్పుడు’ కారణ–ఫలిత బంధాన్ని సహజంగా చూపిస్తూ, దాన్ని కేవలం యాంత్రిక ప్రతిఫలంగా అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బైబిలు శైలిని అనుసరించాం. ఇశ్రాయేలు సమూహాన్ని ఏకవచన సంబోధనగా ‘ఇశ్రాయేలూ... విను’ అని ఉంచి, దానిని సూచించే బహువచన క్రియలను ‘మీరు’తో సహజంగా కొనసాగించాం. ‘కట్టడాలు’ మరియు ‘న్యాయవిధులు’ ద్వారా రెండు హీబ్రూ న్యాయపదాల భేదాన్ని నిలిపాం.
