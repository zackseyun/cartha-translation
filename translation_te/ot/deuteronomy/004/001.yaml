revisions:
- from: ఇప్పుడు ఇశ్రాయేలూ, నేను మీకు ఆచరించమని బోధిస్తున్న కట్టడాలను, న్యాయవిధులను విను. అప్పుడు మీరు జీవించి, మీ పితరుల దేవుడైన యెహోవా మీకు ఇస్తున్న దేశంలోకి ప్రవేశించి, దాన్ని స్వాధీనం చేసుకుంటారు.[a]
  to: ఇప్పుడు, ఇశ్రాయేలూ, మీరు ఆచరించడానికి నేను మీకు బోధిస్తున్న కట్టడాలను, న్యాయవిధులను[a] విను; మీరు జీవించి, మీ పితరుల దేవుడైన యాహ్వే[c] మీకు ఇస్తున్న దేశంలోకి ప్రవేశించి దానిని స్వాధీనం చేసుకోవడానికి[b].
  rationale: The revision retains the source’s singular address to Israel and plural reference to the people, preserves the distinct legal vocabulary, and renders the purpose clause explicitly and naturally. It also conforms the divine name and associated footnote to the project audit trail.
