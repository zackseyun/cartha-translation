source:
  edition: WLC
  text: אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בְּ/אֶ֥רֶץ הַ/מִּישֹׁ֖ר לָ/רֻֽאוּבֵנִ֑י וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ לַ/גָּדִ֔י וְ/אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן לַֽ/מְנַשִּֽׁי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: te
  text: రూబేనీయుల కోసం పీఠభూమి ప్రాంతంలోని అరణ్యంలో ఉన్న బేసెరును, గాదీయుల కోసం గిలాదులోని రామోతును, మనష్షీయుల కోసం బాషానులోని గోలానును నియమించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నియమించాడు’ అనే క్రియ 41వ వచనం నుంచి భావానుసారంగా చేర్చబడింది; హీబ్రూ మూలంలో ఈ వచనం మూడు పట్టణాల జాబితాగా కొనసాగుతుంది. ‘పీఠభూమి ప్రాంతం’ అనే మాటకు ‘సమతల ప్రాంతం’ అని కూడా అనువదించవచ్చు.
    reason: contextual_ellipsis_and_lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: బేసెరు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר అనేది జనావాసం తక్కువైన బంజరు లేదా విశాల మైదాన ప్రాంతాన్ని సూచిస్తుంది; తెలుగు బైబిలు భౌగోళిక వాడుకలో ‘అరణ్యం’ సహజమైన పదం.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: పీఠభూమి ప్రాంతంలోని
  rationale: מִישֹׁר ఇక్కడ యొర్దాను తూర్పున ఉన్న సమతలమైన ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది; ‘పీఠభూమి’ భౌగోళిక భావాన్ని ‘మైదానం’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָרֻאוּבֵנִי
  choice: రూబేనీయుల కోసం
  rationale: హీబ్రూలో ఏకవచన జాతివాచకం ఉన్నా, గోత్రాన్ని సమష్టిగా సూచించే సందర్భం కావడంతో తెలుగులో సహజమైన బహువచన రూపం వాడాం.
- source_word: רָאמֹת
  choice: రామోతు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: בַּגִּלְעָד
  choice: గిలాదులోని
  rationale: ప్రాంతనామాన్ని లిప్యంతరీకరించి, పట్టణం ఆ ప్రాంతంలో ఉందని సహజ తెలుగు సంబంధరూపంలో తెలిపాం.
- source_word: לַגָּדִי
  choice: గాదీయుల కోసం
  rationale: గోత్రాన్ని సమష్టిగా సూచించే హీబ్రూ ఏకవచన జాతివాచకాన్ని సహజ తెలుగు బహువచనంలో ఇచ్చాం.
- source_word: גּוֹלָן
  choice: గోలాను
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: בַּבָּשָׁן
  choice: బాషానులోని
  rationale: ప్రాంతనామాన్ని లిప్యంతరీకరించి, సహజ తెలుగు సంబంధరూపాన్ని వాడాం.
- source_word: לַמְנַשִּׁי
  choice: మనష్షీయుల కోసం
  rationale: మనష్షే గోత్రాన్ని సమష్టిగా సూచించే ఏకవచన జాతివాచకాన్ని తెలుగులో సహజమైన బహువచనంగా ఇచ్చాం.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: బేసెరును … రామోతును … గోలానును
  rationale: ప్రత్యక్ష కర్మ సూచకాన్ని తెలుగు ద్వితీయావిభక్తి ‘ను’తో ప్రతిబింబించి, మూడు పట్టణాల సమాంతర జాబితాను నిలిపాం.
