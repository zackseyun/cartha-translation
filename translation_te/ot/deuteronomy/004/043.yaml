  register: ఆధునిక ప్రామాణిక తెలుగు; మూలంలోని మూడు భాగాల సమాంతర నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా మలిచాం. స్వతంత్రంగా చదివినప్పుడు పూర్తి వాక్యంగా ఉండేందుకు 4:41లోని క్రియను భావానుసారంగా చేర్చి పాదసూచనలో స్పష్టం చేశాం.
