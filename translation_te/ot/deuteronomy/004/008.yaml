language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: te
  text: నేను ఈ రోజు మీ ముందుంచుతున్న ఈ ధర్మశాస్త్రమంత నీతియుక్తమైన శాసనాలూ న్యాయవిధులూ కలిగిన గొప్ప జాతి మరేదైనా ఉందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ధర్మశాస్త్రం’కు బదులుగా ‘ఉపదేశం’ అని కూడా అనువదించవచ్చు (హీబ్రూ: తోరా); అయితే ఇక్కడ ‘శాసనాలు, న్యాయవిధులు’ అని ఉన్నందున సందర్భం ప్రత్యేకంగా చట్టపరమైనది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי גּוֹי גָּדוֹל
  choice: గొప్ప జనము మరేదుంది?
  rationale: ఇది ముందటి వాక్యంతో అనుసంధానమైన అలంకారప్రశ్న. מילולుగా ‘ఎవరు?’ అయినా, גּוֹיతో కలిసి తెలుగులో ‘మరే గొప్ప జనము ఉంది?’ అనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: חֻקִּים
  choice: కట్టడలు
  rationale: నిర్దేశించి స్థాపించిన చట్టనిబంధనల భావాన్ని నిలుపుతూ, మִשְׁפָּטִים నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: מִשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయపరమైన తీర్పులు, నియమాలు అనే అర్థాన్ని తెలుపుతూ חֻקִּיםతో ఉన్న జంటలో న్యాయసంబంధ ఛాయను నిలుపుతుంది.
- source_word: צַדִּיקִם
  choice: నీతియుక్తమైన
  rationale: ఈ విధులు న్యాయానికీ నైతిక సరిదనానికీ అనుగుణంగా ఉన్నాయనే విశాల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రమంతటిలో ఉన్నట్లుగా
  rationale: כְּכֹל యొక్క తులనాత్మక భావాన్ని, תּוֹרָה యొక్క ఈ సందర్భంలోని చట్టపరమైన భావాన్ని నిలుపుతుంది. ‘ఉపదేశం’ అనే విస్తృత ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: మీ ముందుంచుతున్న
  rationale: అక్షరార్థమైన ‘మీ ముందు ఇస్తున్న’ కంటే, నియమావళిని ప్రజల పరిశీలనకు సమర్పించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచనలోని స్పష్టమైన ప్రస్తుత ప్రాధాన్యాన్ని ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: תּוֹרָה పదానికి అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: תּוֹרָהకు విస్తృతంగా ‘ఉపదేశం’ అనే అర్థం ఉన్నప్పటికీ, ఈ వచనంలో ‘కట్టడలు, న్యాయవిధులు’ అనే తక్షణ సందర్భం చట్టపరమైన భావాన్ని ప్రధానంగా చేస్తుంది. అయినా మూలపదపు విస్తృత భావాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. మూలంలోని అలంకారప్రశ్నను అలాగే ఉంచి, חֻקִּים మరియు מִשְׁפָּטִים మధ్య పదభేదాన్ని ‘కట్టడలు’, ‘న్యాయవిధులు’ ద్వారా కాపాడాం.
