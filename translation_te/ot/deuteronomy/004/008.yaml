  naturalness: ‘జనము’ కంటే ఆధునిక ప్రామాణిక తెలుగులో ‘జాతి’ సహజం. ‘కట్టడలు’ సాధారణ వాడుకలో భవనాలు అనే అర్థాన్ని కూడా కలిగించగలదు; చట్టసందర్భంలో ‘శాసనాలు’ స్పష్టంగా ఉంటుంది. సవరించిన వాక్యం సహజమైన అలంకారప్రశ్నగా, స్పష్టమైన పదక్రమంతో ఉంది.
