source:
  edition: WLC
  text: הֲ/שָׁ֣מַֽע עָם֩ ק֨וֹל אֱלֹהִ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כַּ/אֲשֶׁר שָׁמַ֥עְתָּ אַתָּ֖ה וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: te
  text: మీరు విని జీవించినట్లుగా, ఏ ప్రజ అయినా అగ్ని మధ్యనుండి మాట్లాడుతున్న దేవుని స్వరాన్ని విని జీవించిందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బతికి బయటపడిందా?” హీబ్రూ క్రియకు అక్షరార్థం “జీవించింది”; అయితే అగ్ని మధ్యనుండి దేవుడు మాట్లాడటం విన్న తర్వాత కూడా ఆ ప్రజ ప్రాణాలతో ఉండడాన్ని సందర్భం సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: విన్నారా?
  rationale: ప్రశ్నార్థక הֲ తో కూడిన సంపూర్ణ క్రియ ఇక్కడ అలంకారిక ప్రశ్నను ఏర్పరుస్తుంది; తెలుగు భూతకాల ప్రశ్నారూపం సహజంగా ఆ అనుభవాన్ని తెలియజేస్తుంది.
- source_word: עָם
  choice: ఏ ప్రజలైనా
  rationale: עָם ఒక ప్రజాసమూహాన్ని సూచిస్తుంది. ప్రశ్నలోని అనిర్దిష్ట భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఏ ప్రజలైనా’ అని అనువదించాం.
- source_word: קוֹל אֱלֹהִים
  choice: దేవుని స్వరం
  rationale: మాట్లాడటంతో కలిసివచ్చిన קוֹל ఇక్కడ కేవలం శబ్దం కాక, అర్థవంతమైన స్వరాన్ని సూచిస్తుంది; ఏకవచన క్రియారూపం మరియు సందర్భం אֱלֹהִים ను ‘దేవుడు’గా నిర్ధారిస్తాయి.
- source_word: מְדַבֵּר
  choice: మాట్లాడుతున్న
  rationale: కృదంతం కొనసాగుతున్న దైవిక పలుకును వర్ణిస్తుంది; ‘మాట్లాడుతున్న’ ఆ క్రియాశీల భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: అగ్ని మధ్యలో నుండి
  rationale: מִתּוֹךְ లోని ‘లోపలి/మధ్య నుండి’ అనే స్థలచిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: మీరు విన్నట్లుగా
  rationale: כַּאֲשֶׁר పోలికను తెలియజేస్తుంది; స్వతంత్ర సర్వనామం אַתָּה ఇచ్చే ఉద్ఘాటనను తెలుగులో స్పష్టమైన ‘మీరు’ నిలుపుతుంది.
- source_word: וַ/יֶּחִי
  choice: సజీవంగా ఉన్నారా
  rationale: חיה యొక్క మూలార్థం ‘జీవించడం.’ అగ్నిలోనుండి దేవుని స్వరం విన్న తరువాత కూడా ప్రాణాలతో ఉండటమనే సందర్భార్థాన్ని, ‘బతికి బయటపడ్డారా’ అనే అధిక వ్యాఖ్యానాన్ని చేయకుండా ఇది తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రత్యక్ష దైవిక స్వయంప్రకటన సందర్భంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: ఒక దేవుడు / దేవతలు
  rationale: ఏకవచన కృదంతం మరియు హోరేబు నిబంధన సందర్భం ఏకవచన సూచనను కోరుతున్నాయి; అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
- issue: దేవుని స్వరం విన్నప్పటికీ మరణించలేదనే వ్యత్యాసాన్ని ఎంతవరకు స్పష్టం చేయాలి
  choice: సజీవంగా ఉన్నారా
  alternative: బతికి బయటపడ్డారా
  rationale: హీబ్రూ పాఠం సాధారణంగా ‘జీవించాడు’ అని మాత్రమే చెబుతుంది. అసాధారణ రక్షణ భావం సందర్భంలో ఉన్నప్పటికీ, ప్రధాన పాఠంలో ‘బతికి బయటపడ్డారు’ అని వ్యాఖ్యానాత్మకంగా బలపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్నగా మలిచాం. హీబ్రూలోని అగ్ని మధ్యనుండి పలికే దేవుని స్వరం అనే దృశ్యాన్ని, అలాగే విని జీవించి ఉండటంలోని ఉద్వేగాన్ని నిలిపాం.
