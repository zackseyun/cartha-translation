  text: מֵ/עֲרֹעֵ֞ר אֲשֶׁ֨ר עַל שְׂפַת נַ֧חַל אַרְנֹ֛ן וְ/עַד הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: te
  text: అర్ణోను వాగులోయ ఒడ్డున ఉన్న అరోయేరు[a] మొదలుకొని, సీయోను పర్వతం వరకు—అదే హెర్మోను[b]—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అర్ణోను వాగులోయ’ అనే మాటను ‘అర్ణోను వాగు’ లేదా ‘అర్ణోను లోయ’ అని కూడా అనువదించవచ్చు. హీబ్రూ נַחַל అనే పదం ఎల్లప్పుడూ ప్రవహించే నదిని మాత్రమే కాక, వాగు దారి లేదా కనుమను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘సీయోను’ అని ఉంది. ద్వితీయోపదేశకాండము 3:9తో పోల్చండి; అక్కడ సీదోనీయులు ఈ పర్వతాన్ని ‘శిర్యోను’ అని పిలిచారని ఉంది. ఇక్కడ సీయోను పర్వతమే హెర్మోను అని పాఠం స్పష్టంగా గుర్తిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: అరోయేరు మొదలుకొని
  rationale: מִן భూభాగపు ప్రారంభ సరిహద్దును సూచిస్తుంది; అరోయేరు స్థలనామం కాబట్టి లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: ఒడ్డున ఉన్న
  rationale: శబ్దార్థంగా ‘అంచు/పెదవి వద్ద’ అయినప్పటికీ, జలమార్గపు భౌగోళిక సందర్భంలో ‘ఒడ్డున’ సహజమైన తెలుగు ప్రయోగం.
- source_word: נַחַל אַרְנֹן
  choice: అర్నోను వాగులోయ
  rationale: נַחַל ఎల్లప్పుడూ ప్రవహించే నదిని మాత్రమే కాక, వాగు ప్రవహించే లోయను లేదా కనుమను కూడా సూచించగలదు; ‘వాగులోయ’ ఈ భౌగోళిక విస్తృతిని నిలుపుతుంది.
- source_word: וְ/עַד
  choice: వరకు
  rationale: భూభాగపు చివరి సరిహద్దును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: הַר שִׂיאֹן
  choice: సీయోను పర్వతం
  rationale: שִׂיאֹן ఈ వచనంలోని పర్వతనామం; ప్రసిద్ధ צִיּוֹן (‘సీయోను/Zion’)తో అక్షరరూపంగా ఒకటిగా భావించకుండా, మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: הוּא חֶרְמוֹן
  choice: అదే హెర్మోను
  rationale: הוּא ఇక్కడ వివరణాత్మక సమానాధికరణగా ఉండి, సీయోను పర్వతమే హెర్మోను అని గుర్తిస్తుంది.
