translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. సరిహద్దు వాక్యనిర్మాణం మునుపటి వచనంతో కొనసాగుతున్నందున చివర విరామచిహ్నంతో కొనసాగింపు భావం ఉంచబడింది. ‘వాగులోయ’ ద్వారా נַחַל లోని వాగు/లోయ అర్థసంభావ్యతను ప్రధాన పాఠంలోనే సాధ్యమైనంతగా నిలిపాం.
