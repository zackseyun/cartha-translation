source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: te
  text: యాహ్వే[a] ఆయనే దేవుడు[b] అని, ఆయన తప్ప వేరే దేవుడు లేడని నీవు తెలుసుకోవడానికి నీకు ఇవన్నీ చూపించబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు తెలుసుకునేలా నీకు ఇవన్నీ చూపించబడ్డాయి.” హీబ్రూ క్రియ కర్మణి భావంలో ఉంది; సంబోధించబడినవానికి ఇవి చూపించబడ్డాయని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “యాహ్వే—ఆయనే దేవుడు”; స్వతంత్ర సర్వనామం ఉద్ఘాటనను ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: నీకు ... చూపించబడ్డాయి
  rationale: 'హొఫ్అల్ రూపంలోని క్రియ కారణార్థక కర్మణి భావాన్ని వ్యక్తం చేస్తుంది: సంబోధించబడిన వ్యక్తి తనంతట తాను చూడడం కాక, అతనికి ఇవి చూపించబడ్డాయి.'
- source_word: לָדַעַת
  choice: నీవు తెలుసుకోవడానికి
  rationale: ל ఉపసర్గతో కూడిన క్రియావాచకం ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం రెండింటినీ సహజంగా మోయగలదు.
- source_word: כִּי
  choice: అని
  rationale: ఇది కారణాన్ని కాక, తెలుసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రత్యక్ష నామరూపంగా అందించబడింది.
- source_word: הוּא
  choice: -యే
  rationale: స్వతంత్ర సర్వనామమైన הוּא ఇచ్చే ఉద్ఘాటనను తెలుగులో సహజమైన నిశ్చయార్థక ప్రత్యయం ‘-యే’ ద్వారా వ్యక్తం చేశాం; ‘ఆయన మాత్రమే’ అని అనువదిస్తే తరువాతి వాక్యభాగంలోని భావాన్ని ముందుగానే చేర్చినట్లవుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: విధేయ నామవాచకంగా ఇది యెహోవాను నిజమైన దేవునిగా గుర్తిస్తుంది; తెలుగులో ‘దేవుడు’ సహజమైన రూపం.
- source_word: אֵין עוֹד
  choice: మరొకరు లేరు
  rationale: యెహోవాతోపాటు ఇంకొక దేవుడు లేడనే నిరాకరణను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִלְבַדּוֹ
  choice: ఆయన తప్ప
  rationale: ఈ విభక్తి సమాసం మినహాయింపు భావాన్ని తెలియజేస్తుంది; ‘ఆయన తప్ప’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించడానికి దగ్గరైన ప్రత్యామ్నాయం.
- issue: దేవుని ఏకైకత్వ ప్రకటన బలం
  choice: ఆయన తప్ప మరొకరు లేరు
  alternative: ఆయన తప్ప వేరే దేవుడు లేడు
  rationale: హీబ్రూ వాక్యం చేసే ప్రత్యేకత్వ ప్రకటనను కాపాడుతూ, దాని పరిధిని తాత్విక వివరణతో విస్తరించలేదు. ‘మరొకరు’ అనేది వ్యక్తిని సూచించే సహజ తెలుగు; సందర్భం అది మరొక దేవుని గురించిన నిరాకరణ అని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నీవు’ ఏకవచనం మూలంలోని אַתָּהను ప్రతిబింబిస్తుంది. ఉద్ఘాటనను అసహజమైన పదక్రమంతో కాక ‘యెహోవాయే’ ద్వారా సహజంగా తెలిపాం; రెండు పాదాల ఏకైకత్వ ప్రకటనను ఒకే ప్రవాహవంతమైన వాక్యంగా ఉంచాం.
