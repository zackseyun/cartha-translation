  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: te
  text: ఎందుకంటే నీ దేవుడైన యెహోవా దహించే అగ్ని; ఆయన అసూయగల దేవుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనన్య భక్తిని కోరే దేవుడు.’ హీబ్రూ పదం, ముఖ్యంగా విగ్రహారాధన సందర్భంలో, తన ప్రజలపై యెహోవాకున్న అనన్య నిబంధన హక్కును నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని తెలిపే హేత్వర్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఏకవచన ద్వితీయ పురుష ప్రత్యయంతో ఉన్న నిబంధన సంబంధ సంబోధనను యథాతథంగా నిలుపుతుంది.
- source_word: אֵשׁ אֹכְלָה
  choice: దహించే అగ్ని
  rationale: దేవుని పరిశుద్ధత, తీర్పును వ్యక్తపరిచే సజీవ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో పరిరక్షిస్తుంది.
- source_word: הוּא
  choice: ఆయన
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను రెండవ విధేయ వాక్యంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ముందటి వాక్యానికి సమానాధికారంగా వచ్చే సాధారణ దైవబిరుదును సహజంగా అనువదిస్తుంది.
- source_word: קַנָּא
  choice: రోషంగల
  rationale: విగ్రహారాధన సందర్భంలో తన ప్రజలపై యెహోవాకున్న అనన్య నిబంధన హక్కును, ప్రత్యర్థి ఆరాధనను సహించని భావాన్ని తెలుగులో తెలియజేస్తుంది; సాధారణ మానవ అసూయ అనే అపార్థాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: దైవిక קַנָּא పదం అనువాదం
  choice: రోషంగల దేవుడు
  alternative: అసూయగల దేవుడు; ఆసక్తిగల దేవుడు
  rationale: సందర్భం విగ్రహారాధనకు వ్యతిరేకమైన నిబంధన హెచ్చరిక. ‘రోషంగల’ దేవుని అనన్య హక్కు మరియు ప్రత్యర్థి ఆరాధనను సహించని తీవ్రతను నిలుపుతుంది; పాదసూచిక సంబంధిత ప్రత్యామ్నాయ భావాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. హీబ్రూ రూపకం మరియు దైవిక రోషంలోని నిబంధన సంబంధ ఉద్వేగం రెండూ మృదువుపరచకుండా నిలుపబడ్డాయి.
