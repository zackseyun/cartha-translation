  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: te
  text: మీ మాటల కారణంగా[a] యెహోవా నాపై కోపపడి, నేను యొర్దాను దాటకూడదనీ, మీ దేవుడైన యెహోవా మీకు వారసత్వ సంపదగా ఇస్తున్న ఆ మంచి దేశంలో ప్రవేశించకూడదనీ ప్రమాణం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ కారణంగా.” హీబ్రూ అక్షరార్థంగా, “మీ మాటల కారణంగా” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: הִתְאַנֶּף בִּי
  choice: నాపై కోపపడి
  rationale: కోపాన్ని సూచించే హిత్పయేల్ రూపాన్నీ, בִּי యొక్క ప్రతికూల దిశనూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל דִּבְרֵיכֶם
  choice: మీ మాటల కారణంగా
  rationale: దִּבְרֵי అనే స్పష్టమైన ‘మాటలు’ అంశాన్ని నిలుపుతూ కారణార్థక సంబంధాన్ని సహజంగా తెలియజేస్తుంది; సందర్భానుసారం ‘మీ కారణంగా’ అనే విస్తృత భావం కూడా సాధ్యమని పాదటిప్పణి సూచిస్తుంది.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: దేవుడు చేసిన గంభీరమైన ప్రమాణాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: నేను యొర్దాను దాటకూడదని
  rationale: ప్రమాణంలోని నిషేధాత్మక విషయాన్ని తెలుగులో సహజమైన ఉద్ధరణ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ הַטּוֹבָה
  choice: ఆ మంచి దేశంలో ప్రవేశించకూడదని
  rationale: సమాంతర నిషేధ నిర్మాణాన్ని కాపాడుతూ בוא אֶל భావాన్ని ‘ప్రవేశించు’గా, הַטּוֹבָהను నేరుగా ‘మంచి’గా అందిస్తుంది.
- source_word: נֹתֵן לְךָ
  choice: మీకు ... ఇస్తున్న
  rationale: వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న లేదా సమీప నిశ్చిత దాన భావాన్ని నిలుపుతుంది; ఏకవచన ‘నీకు’ ఇశ్రాయేలు సమూహాన్ని ఉద్దేశించినందున తెలుగులో గౌరవ/సమూహార్థక ‘మీకు’ సహజంగా ఉంది.
- source_word: נַחֲלָה
  choice: వారసత్వ సంపదగా
  rationale: ఒప్పంద సంబంధమైన భూస్వాస్థ్య భావాన్నీ, కేటాయించబడిన వారసత్వ స్వాధీనాన్నీ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మోషే దేశంలో ప్రవేశించకుండా చేయబడటం ఇశ్రాయేలు మాటలతో సంబంధింపబడింది
  choice: మీ మాటల కారణంగా
  alternative: మీ కారణంగా
  rationale: హీబ్రూ పాఠం అక్షరార్థంగా ‘మీ మాటల కారణంగా’ అని చెబుతుంది. అందువల్ల నింద లేదా బాధ్యతపై విస్తృతమైన వేదాంత నిర్ణయం చేయకుండా ఆ స్పష్టమైన పదాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భసాధ్యమైన విస్తృత అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: నֹתֵן యొక్క కాల/దృక్కోణ భావం
  choice: ఇస్తున్న
  alternative: ఇవ్వబోతున్న / ఇచ్చే
  rationale: కృదంత రూపం కొనసాగుతున్న దైవ అనుగ్రహాన్నీ, నిశ్చితమైన సమీప ప్రసాదాన్నీ సూచించగలదు. ‘ఇస్తున్న’ ఈ ఉద్దేశపూర్వక కాలసంబంధ ఉద్రిక్తతను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమాంతర నిషేధాలను ‘దాటకూడదనీ ... ప్రవేశించకూడదనీ’గా నిలిపింది. ‘దేశం’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘వారసత్వ సంపద’ నַחֲלָה యొక్క ఒప్పంద-స్వాస్థ్య భావాన్ని కాపాడుతుంది.
