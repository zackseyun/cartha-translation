  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: te
  text: 'నీకు ముందున్న పూర్వకాలం గురించి ఇప్పుడు అడిగి తెలుసుకో: దేవుడు భూమిమీద మనిషిని[a] సృష్టించిన రోజు మొదలుకొని, ఆకాశపు ఒక అంచు నుంచి మరో అంచు వరకు, ఇంత గొప్పది ఏదైనా ఎప్పుడైనా జరిగిందా? ఇలాంటిది ఎప్పుడైనా వినబడిందా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మానవజాతిని.’ సృష్టి సందర్భాల్లో ‘మనిషి’ అనే హీబ్రూ పదం (אָדָם) మానవాళినంతటినీ ప్రతినిధిగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: ఇప్పుడు అడిగి తెలుసుకో
  rationale: ఆజ్ఞార్థక క్రియతో ఉన్న נָא విజ్ఞాపనతో కూడిన బలమైన ప్రేరణను ఇస్తుంది. ‘అడిగి తెలుసుకో’ అనేది కేవలం ప్రశ్నించడం కాక గతాన్ని విచారించి తెలుసుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: పూర్వకాలం గురించి
  rationale: ఈ పదబంధం ఎంతో ప్రాచీనమైన గతకాలాన్ని సూచిస్తుంది. ‘పూర్వకాలం’ గంభీరంగానూ సాధారణ పాఠకులకు స్పష్టంగానూ ఉంటుంది.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: నీకు ముందున్న
  rationale: శ్రోతకు లేదా అతని తరానికి పూర్వం ఉన్న కాలాన్ని సూచించే మూలంలోని కాలసంబంధ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: సృష్టించిన రోజు మొదలుకొని
  rationale: విచారణకు ఉద్దేశించిన చారిత్రక పరిధి ఎక్కడ మొదలవుతుందో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఏకైక సృష్టికర్తను సూచించే ప్రామాణిక తెలుగు అనువాదం.
- source_word: אָדָם
  choice: మనిషిని
  rationale: సృష్టి సందర్భంలో ఈ ఏకవచన పదం ప్రతినిధిగా మానవాళిని సూచించగలదు. ‘మనిషిని’ మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది; సమష్టి భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: మూలంలోని స్థానార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: ఆకాశపు ఒక అంచు నుంచి మరో అంచు వరకు
  rationale: ఇది సంపూర్ణ విస్తారాన్ని సూచించే ద్వంద్వాభివ్యక్తి. తెలుగు ప్రయోగం ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֲנִהְיָה
  choice: ఏదైనా ఎప్పుడైనా జరిగిందా?
  rationale: היהతో కూడిన ప్రశ్న అలాంటి ఘటన ఎన్నడైనా సంభవించిందా అని అడుగుతుంది. ‘ఏదైనా’, ‘ఎప్పుడైనా’ అనే పదాలు తెలుగు వాక్యంలో అంతర్లీన భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: ఇంత గొప్పది
  rationale: דבר ఇక్కడ మాటకే పరిమితం కాక విషయం, కార్యం లేదా ఘటనను సూచిస్తుంది. ‘గొప్పది’ దాని విస్తృతార్థాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: ఇలాంటిది ఎప్పుడైనా వినబడిందా?
  rationale: שׁמע నిఫ్అల్ రూపం ఇక్కడ ఏదైనా వార్తగా వినబడడం లేదా తెలిసి ఉండడాన్ని సూచిస్తుంది. ఈ అనువాదం కర్మణి రూపాన్నీ అలంకారిక ప్రశ్న బలాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: సృష్టి సందర్భంలో אָדָם అనువాదం
  choice: మనిషిని
  alternative: మానవజాతిని; ఆదామును
  rationale: వచనం సృష్టి మొదలు చరిత్రనంతటినీ పరిశీలిస్తుంది. ‘మనిషిని’ అనే ఏకవచనం మూలరూపాన్ని, మానవాళికి ప్రాతినిధ్యం వహించే భావాన్ని రెండింటినీ మోయగలదు. ‘మానవజాతిని’ సమష్టి భావాన్ని స్పష్టం చేసే సాధ్యమైన ప్రత్యామ్నాయం; ‘ఆదామును’ అని వ్యక్తినామంగా తీసుకోవడం సాధ్యమైనా, ఈ విస్తృత సృష్టి సందర్భంలో తక్కువ సంభావ్యమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచనంలోని గంభీరమైన అలంకారిక ప్రశ్నలను నిలుపుతూ రూపొందించబడింది. ‘ఆకాశపు ఒక అంచు నుంచి మరో అంచు వరకు’ అనే విస్తారవ్యక్తీకరణను కుదించకుండా ఉంచాం.
