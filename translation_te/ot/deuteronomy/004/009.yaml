source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: te
  text: కేవలం నిన్ను నీవు జాగ్రత్తగా కాపాడుకో; నీ ప్రాణాన్ని ఎంతో జాగ్రత్తగా కాపాడుకో. నీ కళ్లతో చూసిన వాటిని నీవు మరచిపోకూడదు; నీ జీవితకాలమంతా అవి నీ హృదయం నుండి తొలగిపోకూడదు.[a] వాటిని నీ పిల్లలకు, నీ పిల్లల పిల్లలకు తెలియజేయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో ‘హృదయం’ అనేది భావోద్వేగాలను మాత్రమే కాక జ్ఞాపకం, అవగాహన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచించగలదు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘నీ కుమారులకు, నీ కుమారుల కుమారులకు.’ ఇక్కడి హీబ్రూ పురుషలింగ పదాలు సందర్భానుసారం కుమారులను ప్రత్యేకంగా గానీ, పిల్లలు లేదా సంతానాన్ని విస్తృతంగా గానీ సూచించగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ఇక్కడ రַק ముందున్న బోధకు భిన్నంగా ఒక గట్టి హెచ్చరికను ప్రవేశపెడుతుంది. తెలుగు వాక్యప్రవాహంలో ‘అయితే’ ఆ మలుపును సహజంగా తెలియజేస్తుంది; జాగ్రత్త యొక్క తీవ్రత తరువాతి పదబంధాల్లో నిలుస్తుంది.
- source_word: הִשָּׁמֶר לְךָ
  choice: నిన్ను నీవు జాగ్రత్తగా కాపాడుకో
  rationale: నిఫాల్ ఆజ్ఞారూపం మరియు לְךָ కలిపి వ్యక్తి తన విషయమై అప్రమత్తంగా ఉండాలని సూచిస్తాయి. ఈ అనువాదం ప్రతిబింబక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: నీ ప్రాణాన్ని ఎంతో జాగ్రత్తగా కాపాడుకో
  rationale: נֶפֶשׁ పదానికి ఉన్న ‘ప్రాణం/వ్యక్తి స్వయం’ అనే విస్తృత భావాన్ని ‘ప్రాణం’ నిలుపుతుంది. שׁמר పునరుక్తిని ‘కాపాడుకో’ అని పునరావృతం చేసి హెచ్చరిక తీవ్రతను సంరక్షించాం.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: నీ కళ్లతో చూసిన వాటిని
  rationale: דְּבָרִים ఇక్కడ కళ్లతో చూసిన సంఘటనలు లేదా విషయాలను సూచిస్తుంది. సహజమైన తెలుగులో ప్రత్యక్ష సాక్ష్య భావాన్ని ‘నీ కళ్లతో’ నిలుపుతుంది.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: అవి నీ హృదయం నుండి తొలగిపోకూడదు
  rationale: סור యొక్క తొలగిపోవడం/విడిచిపోవడం అనే రూపకాన్ని, לֵב యొక్క అంతరంగ భావాన్ని అర్థాన్ని కేవలం ‘మనస్సు’గా కుదించకుండా నిలుపుతుంది.
- source_word: וְהוֹדַעְתָּם
  choice: వాటిని ... తెలియజేయాలి
  rationale: ידע హిఫిల్ రూపానికి అక్షరార్థంగా ‘తెలియజేయడం/తెలిసేలా చేయడం’ సరిపోతుంది; ‘బోధించు’ కంటే మూలపదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: నీ పిల్లలకు, నీ పిల్లల పిల్లలకు
  rationale: בנים సందర్భానుసారం కుమారులను మాత్రమే కాక సంతానాన్ని విస్తృతంగా సూచించగలదు. తరతరాలకు జ్ఞాపకాన్ని అందించాలనే సందర్భంలో ‘పిల్లలు’ సహజమైన, సందర్భోచిత ఎంపిక.
theological_decisions:
- issue: נֶפֶשׁ యొక్క మానవశాస్త్రీయ పరిధి
  choice: ‘నీ ప్రాణాన్ని’ అని అనువదించి, అది మొత్తం వ్యక్తిని కూడా సూచించగలదని గ్రహించడం
  alternative: ‘నిన్ను నీవు’
  rationale: మూలంలోని נֶפֶשׁను పూర్తిగా లీనంచేయకుండా తెలుగు బైబిలు భాషలో సహజమైన ‘ప్రాణం’ను ఉంచాం. దీనిని శరీరానికి భిన్నమైన అమూర్త ఆత్మ అనే సంకుచిత సిద్ధాంతార్థానికి పరిమితం చేయలేదు.
- issue: בָנֶיךָ లోని లింగ సూచన
  choice: ‘నీ పిల్లలకు’
  alternative: ‘నీ కుమారులకు’
  rationale: వ్యాకరణపరంగా పురుషలింగ రూపమైనా, ఈ తరతరాల ఒడంబడిక జ్ఞాపక సందర్భంలో సంతానాన్ని విస్తృతంగా సూచించగలదు. ‘పిల్లలు’ సందర్భంలోని ప్రతినిధి భావాన్ని తెలియజేస్తుంది.
- issue: לֵב యొక్క భావవ్యాప్తి
  choice: ‘హృదయం’ అనే మూల రూపకాన్ని నిలుపడం
  alternative: ‘మనస్సు’
  rationale: హీబ్రూ భావంలో హృదయం జ్ఞాపకం, అవగాహన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచించగలదు. ‘మనస్సు’ అని మార్చితే ఈ పరిధి సంకుచితమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆజ్ఞాత్మక శైలి. ‘కాపాడుకో’ పునరుక్తి మూలంలోని శబ్దాత్మక బలాన్ని నిలుపుతుంది. వచనం తరువాతి వాక్యంతో కొనసాగవచ్చినప్పటికీ, ఇచ్చిన వచన పరిమితిలో చదవడానికి సహజంగా విరామచిహ్నాలు అమర్చబడ్డాయి.
