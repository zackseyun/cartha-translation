  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: te
  text: 'నీవు హోరేబు వద్ద నీ దేవుడైన యహ్వే సన్నిధిలో నిలబడిన రోజు, యహ్వే నాతో ఇలా అన్నాడు: “ప్రజలను నా దగ్గరకు సమకూర్చు; నేను నా మాటలను వారికి వినిపిస్తాను. వారు భూమిమీద జీవించే రోజులన్నిటిలో నాకు భయపడడం నేర్చుకోవడానికి, తమ పిల్లలకు నేర్పడానికి ఇలా చేస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: నీవు ... నిలబడిన రోజు
  rationale: కాలసంబంధ నిర్మాణాన్ని ‘రోజు’తో నిలుపుతూ, సందర్భంలోని జ్ఞాపక సంఘటనకు సహజమైన తెలుగు రూపం ఇచ్చింది.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: సన్నిధిలో నిలబడిన
  rationale: దేవుని ఎదుట సమాజంగా నిలిచిన ఒడంబడిక దృశ్యాన్ని స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ద్వితీయ పురుష ఏకవచన సంబోధనను, ఒడంబడిక సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּחֹרֵב
  choice: హోరేబు వద్ద
  rationale: స్థలాన్ని సూచించే בְ ఉపసర్గకు ఈ సందర్భంలో సహజమైన తెలుగు స్థానప్రయోగం.
- source_word: הַקְהֶל לִי אֶת־הָעָם
  choice: ప్రజలను నా దగ్గరకు సమకూర్చు
  rationale: קהל హిఫీల్ ఆజ్ఞలోని సమూహపరచే భావాన్నీ, לִי లోని ‘నా దగ్గరకు’ దిశనూ నిలుపుతుంది.
- source_word: וְאַשְׁמִעֵם
  choice: నేను ... వారికి వినిపిస్తాను
  rationale: שמע హిఫీల్‌లోని ‘వినేటట్లు చేయు’ అనే కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דְּבָרָי
  choice: నా మాటలను
  rationale: బహువచన రూపాన్ని, దేవుడు పలికిన ఒడంబడిక మాటల భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: అప్పుడు వారు ... నాకు భయపడడం నేర్చుకుంటారు
  rationale: సందర్భంలోని ఉద్దేశ్య/ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తూ, ירא లోని భయం–భక్తి–విధేయత ఉద్వేగాన్ని ‘భయపడడం’తో కాపాడుతుంది.
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: జీవించే రోజులన్నిటిలో
  rationale: జీవితకాలమంతటినీ సూచించే హీబ్రూ నుడికారాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: עַל־הָאֲדָמָה
  choice: నేలమీద
  rationale: אֲדָמָה యొక్క సాధారణ ‘నేల/భూమి’ భావాన్ని నిలుపుతుంది; ద్వితీయోపదేశ సందర్భంలో ‘దేశంలో’ అనే నిర్దిష్ట భావం కూడా సాధ్యమని పాదసూచికలో తెలిపింది.
- source_word: בְּנֵיהֶם
  choice: తమ పిల్లలకు
  rationale: వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ ఇక్కడ సంతానం మొత్తాన్ని సూచిస్తుంది; ‘పిల్లలు’ మూల ఉద్దేశాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలంలో వ్యక్త దైవనామమే ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: ఒడంబడిక సందర్భంలో ירא భావం
  choice: నాకు భయపడడం
  alternative: నన్ను భక్తితో గౌరవించడం
  rationale: ‘భయపడడం’ అనే మూల భావాన్ని మృదువుగా మార్చకుండా ఉంచి, భయం, భక్తి, విధేయతల మధ్య ఉన్న ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: ద్వితీయ పురుష ఏకవచన సంబోధన
  choice: నీవు / నీ
  alternative: మీరు / మీ
  rationale: మోషే ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధిస్తున్న హీబ్రూ వ్యాకరణాన్ని నిలుపుతుంది.
- issue: בְּנֵיהֶם యొక్క పరిధి
  choice: తమ పిల్లలకు
  alternative: తమ కుమారులకు
  rationale: ఈ బోధ తరతరాల సంతానానికి అందించబడాలనే సందర్భార్థం వల్ల లింగసమావేశకమైన ‘పిల్లలు’ సరైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. మూలంలోని సమష్టి ఏకవచనాన్ని ‘నీవు’తో నిలిపింది. వాక్యం ముందున్న సందర్భంతో వ్యాకరణపరంగా అనుసంధానమై ఉండే స్వభావాన్ని అనవసర పదాలు చేర్చకుండా కాపాడింది; ప్రత్యక్ష వాక్యాన్ని మాత్రం తెలుగు పఠనసౌలభ్యానికి చిన్న వాక్యాలుగా విభజించింది.
