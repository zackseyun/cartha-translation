revisions:
- from: 'నీవు హోరేబు వద్ద నీ దేవుడైన యహ్వే సన్నిధిలో నిలబడిన రోజు, యహ్వే నాతో ఇలా అన్నాడు: “ప్రజలను నా దగ్గరకు సమకూర్చు. నేను నా మాటలను వారికి వినిపిస్తాను. అప్పుడు వారు నేలమీద[a] జీవించే రోజులన్నిటిలో నాకు భయపడడం నేర్చుకుంటారు; తమ పిల్లలకు కూడా నేర్పుతారు.”'
  to: 'నీవు హోరేబు వద్ద నీ దేవుడైన యహ్వే సన్నిధిలో నిలబడిన రోజు, యహ్వే నాతో ఇలా అన్నాడు: “ప్రజలను నా దగ్గరకు సమకూర్చు; నేను నా మాటలను వారికి వినిపిస్తాను. వారు భూమిమీద జీవించే రోజులన్నిటిలో నాకు భయపడడం నేర్చుకోవడానికి, తమ పిల్లలకు నేర్పడానికి ఇలా చేస్తాను.”'
  rationale: The revision makes the Hebrew purpose relation explicit and removes added emphasis. The lexical alternative for אֲדָמָה is retained with its anchor placed after “భూమిమీద.”
