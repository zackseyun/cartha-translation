  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: te
  text: యహ్వే మిమ్మల్ని ప్రజల మధ్య చెదరగొడతాడు; యహ్వే మిమ్మల్ని తోలివేసే జనాల మధ్య[a] మీరు కొద్దిమందిగానే మిగిలిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే మిమ్మల్ని నడిపించే జనాల మధ్య.” హీబ్రూ క్రియకు “నడిపించు” లేదా “తోలివేయు” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ తీర్పు, చెర సందర్భం వల్ల “తోలివేసే” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: చెదరగొడతాడు
  rationale: פוץ ధాతువు హిఫీల్ రూపంలో ఒకరిని అనేక చోట్లకు చెదరగొట్టే కారక భావాన్ని ఇస్తుంది. తీర్పు సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: בָּעַמִּים
  choice: ప్రజల మధ్య
  rationale: עַמִּים ఇక్కడ వివిధ ప్రజాసమూహాలను సూచిస్తుంది. తరువాత వచ్చే גּוֹיִםకు వాడిన ‘జనాలు’ అనే పదంతో ఉన్న స్వల్ప పదభేదాన్ని ఇలా నిలుపుకున్నాం.
- source_word: וְנִשְׁאַרְתֶּם
  choice: మిగిలిపోతారు
  rationale: שׁאר నిఫాల్ రూపం తీర్పు తరువాత కొద్దిమంది మాత్రమే మిగిలే ఫలితస్థితిని సూచిస్తుంది.
- source_word: מְתֵי מִסְפָּר
  choice: కొద్దిమందిగానే
  rationale: అక్షరార్థంగా ‘లెక్కపెట్టదగిన మనుషులు’ అనే ఈ హీబ్రూ నుడికారం అత్యల్ప సంఖ్యను సూచిస్తుంది; ‘కొద్దిమందిగానే’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: בַּגּוֹיִם
  choice: జనాల మధ్య
  rationale: גּוֹיִם ఇక్కడ ఇశ్రాయేలుకు వెలుపల ఉన్న విదేశీ జనాలను విస్తృతంగా సూచిస్తుంది; తరువాతి కాలపు మతపరమైన అర్థాన్ని అనవసరంగా చేర్చలేదు.
- source_word: אֲשֶׁר יְנַהֵג
  choice: ఏ ... మధ్యకు తోలివేస్తాడో
  rationale: נהגకు ‘నడిపించు’ లేదా ‘తోలివేయు’ అనే అర్థాలు ఉండవచ్చు. తీర్పు, చెర సందర్భంలో బలవంతపు తరలింపును తెలిపే ‘తోలివేస్తాడు’ ప్రధాన పాఠానికి సరిపోతుంది.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే שָׁמָּה భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతూ, సంబంధవాక్యాన్ని ‘ఏ ... మధ్యకు ... అక్కడ’ అనే సహజ నిర్మాణంలో ఇచ్చాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం నామ స్వరూపాన్ని నిలుపుతుంది.
- issue: נהג క్రియలోని తీర్పు భావం
  choice: తోలివేస్తాడు
  alternative: నడిపిస్తాడు
  rationale: క్రియకు రెండు అర్థాలు సాధ్యమైనప్పటికీ, ప్రజల చెదరగొట్టబడటం మరియు చెరలోకి వెళ్లడం అనే సందర్భం బలవంతపు తరలింపును సూచిస్తుంది. అయినా నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ప్రజలు’ మరియు ‘జనాలు’ ద్వారా עַמִּים/גּוֹיִם మధ్యనున్న మూలపాఠ పదభేదాన్ని సాధ్యమైనంతవరకు నిలిపాం. హీబ్రూ సంబంధవాక్యంలోని స్థల భావాన్ని సహజమైన తెలుగు ‘ఏ ... మధ్యకు ... అక్కడ’ నిర్మాణంతో వ్యక్తం చేశాం.
