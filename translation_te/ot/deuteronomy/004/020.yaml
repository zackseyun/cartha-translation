  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: te
  text: అయితే యెహోవా మిమ్మల్ని తీసుకొని, ఇనుప కొలిమి అయిన ఐగుప్తులోనుండి బయటకు తీసుకొచ్చాడు; మీరు నేడు ఉన్నట్లుగా తనకు స్వాస్థ్యమైన ప్రజలుగా ఉండేందుకే ఆయన ఇలా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తనకు స్వాస్థ్య ప్రజలుగా.” దీనిని “తన సొంత ప్రజలుగా” లేదా “తన స్వాధీన ప్రజలుగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగులో దైవనామానికి స్థిరపడిన, సాధారణ పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తూ ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- source_word: לָקַח
  choice: తీసుకొని
  rationale: మూలంలోని సాధారణ క్రియార్థాన్ని నిలుపుతుంది; సందర్భంలో ఎంపిక చేసి తనవారిగా స్వీకరించే భావం ఉన్నా దానిని వివరణాత్మకంగా విస్తరించదు.
- source_word: וַיּוֹצִא
  choice: బయటకు తీసుకొచ్చాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్నీ నిర్గమన సందర్భాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: ఇనుప కొలిమిలోనుండి
  rationale: తీవ్రమైన అణచివేత స్థలంగా ఐగుప్తును చిత్రించే మూల రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִמִּצְרָיִם
  choice: అంటే ఐగుప్తులోనుండి
  rationale: ఐగుప్తే ‘ఇనుప కొలిమి’గా పేర్కొనబడిందని స్పష్టం చేస్తూ, మూలంలోని రెండవ מִן పదబంధాన్ని నిలుపుతుంది.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: తనకు స్వాస్థ్యమైన ప్రజలుగా ఉండేందుకు
  rationale: ‘తనకు’ అనే לו భావాన్నీ, נחלה లోని స్వాస్థ్య/అధికార భావాన్నీ సహజమైన తెలుగులో కలిపి నిలుపుతుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: నేడు ఉన్నట్లుగా
  rationale: ఇశ్రాయేలు ప్రస్తుత స్థితిని సూచించే హీబ్రూ నానుడిని ఆధునిక, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: לְעַם נַחֲלָה లోని ఒడంబడిక సంబంధమైన స్వాస్థ్య భావం
  choice: తనకు స్వాస్థ్యమైన ప్రజలు
  alternative: తన సొంత ప్రజలు; తన అధీన ప్రజలు; అక్షరార్థంగా ‘తనకు స్వాస్థ్య ప్రజలు’
  rationale: ఇశ్రాయేలు యెహోవాకు ప్రత్యేకంగా చెందిన ప్రజలనే భావాన్ని నిలుపుతూ, ‘సొంత ప్రజలు’ అనే సాధారణీకరణకన్నా נחלה లోని స్వాస్థ్య భావాన్ని స్పష్టంగా ఉంచుతుంది; అదే సమయంలో అసహజమైన పదానువాదాన్ని ప్రధాన వాక్యంలో నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కారణార్థం మరియు ‘నేడు’ అనే ప్రస్తుత స్థితి రెండూ నిలుపబడ్డాయి.
