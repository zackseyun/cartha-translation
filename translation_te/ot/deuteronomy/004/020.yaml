revisions:
- from: అయితే యెహోవా మిమ్మల్ని తీసుకొని, ఇనుప కొలిమిలోనుండి—అంటే ఐగుప్తులోనుండి—బయటకు తీసుకొచ్చాడు. నేడు ఉన్నట్లుగా, మీరు తనకు స్వాస్థ్యమైన ప్రజలుగా[a] ఉండేందుకే ఆయన అలా చేశాడు.
  to: అయితే యెహోవా మిమ్మల్ని తీసుకొని, ఇనుప కొలిమి అయిన ఐగుప్తులోనుండి బయటకు తీసుకొచ్చాడు; మీరు నేడు ఉన్నట్లుగా తనకు స్వాస్థ్యమైన ప్రజలుగా ఉండేందుకే ఆయన ఇలా చేశాడు.[a]
  rationale: The revision retains the Hebrew’s appositional description of Egypt as ‘the iron furnace’ and its direct purpose clause. It also preserves the present-status idiom ‘as at this day.’ The footnote continues to document the literal inheritance expression while offering alternatives that reflect possession/belonging rather than political subjection.
  reviewer_model: gpt-5.6-terra
