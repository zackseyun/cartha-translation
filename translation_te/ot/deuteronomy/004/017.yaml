  yaml_path: translation/ot/deuteronomy/004/017.yaml
  text: the form of any animal that is on the earth[a], the form of any winged bird that flies in the heavens[b],
translation:
  language: te
  text: భూమిమీద ఉన్న ఏ జంతువు ఆకారాన్నైనా[a], ఆకాశంలో[b] ఎగిరే రెక్కలుగల ఏ పక్షి ఆకారాన్నైనా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆకారం’కు ‘పోలిక’ లేదా ‘ప్రతిరూపం’ అని కూడా అనువదించవచ్చు. ఇక్కడ תַּבְנִית అనే పదం ఆరాధన కోసం తయారుచేసిన రూపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఆకాశాలు’ అనే బహువచన రూపం ఉంది; ఈ సందర్భంలో అది కనిపించే ఆకాశాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: ఆకారం
  rationale: ఈ సందర్భంలో ఆరాధన కోసం తయారుచేసే కనిపించే ప్రతిరూపం లేదా పోలికను సూచిస్తుంది. పునరుక్తిని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉండేందుకు రెండు చోట్లా ‘ఆకారం’ వాడబడింది.
- source_word: כָּל
  choice: ఏ ... అయినా
  rationale: ఏకవచన వర్గనామాలతో ఉన్న నిషేధ జాబితాలో, ఆ వర్గానికి చెందిన దేనినీ మినహాయించని భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּהֵמָה
  choice: జంతువు
  rationale: ఇక్కడ పెంపుడు పశువులకు మాత్రమే పరిమితం కాకుండా భూమిమీద ఉండే జంతువులను విస్తృతంగా సూచిస్తుంది.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: భూమిమీద ఉన్న
  rationale: చుట్టుపక్కల వచనాల్లో భూమి, ఆకాశం, నీరు అనే జీవుల నివాస రంగాల మధ్య ఉన్న ప్రాదేశిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: צִפּוֹר כָּנָף
  choice: రెక్కలుగల ... పక్షి
  rationale: హీబ్రూ పదబంధంలోని ‘పక్షి’ మరియు ‘రెక్క’ అనే రెండు అంశాలను తెలుగులో సహజమైన విశేషణ నిర్మాణంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תָּעוּף
  choice: ఎగిరే
  rationale: ఒక సాధారణ జీవవర్గాన్ని వర్ణించే సంబంధార్థక క్రియగా సహజంగా అనువదిస్తుంది.
- source_word: בַּשָּׁמַיִם
  choice: ఆకాశంలో
  rationale: హీబ్రూ రూపం బహువచనమైనప్పటికీ, ఈ సందర్భంలో పక్షులు ఎగిరే కనిపించే ఆకాశమే భావం; ఆధునిక తెలుగులో ‘ఆకాశంలో’ సహజంగా ఉంటుంది.
