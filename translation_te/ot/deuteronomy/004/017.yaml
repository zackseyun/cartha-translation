translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని సమాంతర నిర్మాణం మరియు ‘ఆకారం’ అనే పదపు పునరుక్తి నిలుపబడ్డాయి; ఈ భాగం తదుపరి జాబితాతో కొనసాగేలా చివర కామా ఉంచబడింది.
