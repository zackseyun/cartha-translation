  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: te
  text: ఎందుకంటే నేను ఈ దేశంలో మరణించబోతున్నాను[a]; నేను యొర్దాను దాటబోవడం లేదు. కానీ మీరు దాటి వెళ్లి ఈ మంచి దేశాన్ని స్వాధీనం చేసుకుంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ దేశంలో మరణిస్తాను.’ హీబ్రూ కృదంతం సమీప భవిష్యత్తులో జరిగే చర్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘స్వాధీనం పొందుతారు’ లేదా ‘వారసత్వంగా పొందుతారు.’ హీబ్రూ క్రియ దేశాన్ని వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి హెచ్చరిక లేదా ఉపదేశానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సందర్భం మోస్తుంది; ‘నేనే’ అని అనువదిస్తే తెలుగులో అవసరానికి మించిన వ్యతిరేక ఉద్ఘాటన రావచ్చు.
- source_word: מֵת
  choice: చనిపోతున్నాను
  rationale: హీబ్రూ కృదంతం మోషే మరణం సమీపంలో ఉందనే తక్షణ భావాన్ని నిలుపుతుంది; ఇది కేవలం సాధారణ భవిష్యద్వాక్యం కాదు.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: ఈ దేశంలోనే
  rationale: אֶרֶץకు ‘దేశం’ సహజమైన తెలుగు సమానం. సందర్భంలో మోషే యొర్దాను తూర్పున ఉన్న ఈ ప్రాంతంలోనే మరణిస్తాడనే వ్యత్యాసాన్ని ‘నే’ స్పష్టం చేస్తుంది.
- source_word: אֵינֶנִּי עֹבֵר
  choice: నేను ... దాటి వెళ్లడం లేదు
  rationale: నిషేధార్థక నిర్మాణం మరియు కృదంతం సూచించే సమీప భవిష్యత్తు కాని చర్యను, తరువాతి ‘మీరు దాటి వెళ్లి’ అనే వాక్యభాగంతో సమాంతరంగా ఉంచుతుంది.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన నది పేరు; సందర్భం వల్ల ‘నది’ అని జోడించకపోయినా స్పష్టత ఉంటుంది.
- source_word: וְאַתֶּם עֹבְרִים
  choice: అయితే మీరు దాటి వెళ్లి
  rationale: וְ అక్షరార్థంగా ‘మరియు’ అయినా, ఇక్కడ మోషేకు ఇశ్రాయేలీయులకు మధ్య ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וִירִשְׁתֶּם
  choice: స్వాధీనం చేసుకుంటారు
  rationale: ירשׁ వాగ్దాన దేశ సందర్భంలో వారసత్వంగా భూమిని పొందడం, దానిని అధీనంలోకి తెచ్చుకోవడం అనే భావాలను కలిగి ఉంది; ఈ ఎంపిక చర్యాత్మక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ఈ మంచి దేశాన్ని
  rationale: విశేషణం మరియు నిర్దేశక సర్వనామాన్ని సహజ తెలుగు క్రమంలో ఉంచి, ద్వితీయోపదేశకాండంలోని ‘మంచి దేశం’ అనే ముఖ్యమైన పదబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మోషే మరణం యొక్క కాలసూచన
  choice: చనిపోతున్నాను
  alternative: చనిపోబోతున్నాను
  rationale: ఈ వచనం మరణం అప్పటికే జరుగుతోందని సిద్ధాంతపరంగా నిర్ణయించదు; కృదంతంలోని సమీపతను ప్రధాన పాఠంలో నిలిపి, మరింత స్పష్టమైన కాలార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: దేశాన్ని పొందడంలో ירשׁ యొక్క భావం
  choice: స్వాధీనం చేసుకుంటారు
  alternative: వారసత్వంగా పొందుతారు
  rationale: పదం జయించి అధీనంలోకి తెచ్చుకోవడం మరియు వాగ్దాన వారసత్వంగా పొందడం రెండింటినీ సూచించగలదు. ప్రధాన పాఠం చర్యాత్మక భావాన్ని ఇస్తూ, వారసత్వ భావాన్ని పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ కృదంతాల సమాంతరతను సాధ్యమైనంతవరకు నిలిపి, మోషే దాటకపోవడం మరియు ప్రజలు దాటడం మధ్య వ్యత్యాసాన్ని స్పష్టం చేశాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంచబడింది.
