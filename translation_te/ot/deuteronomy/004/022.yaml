revisions:
- from: ఎందుకంటే నేను ఈ దేశంలోనే చనిపోతున్నాను[a]; నేను యొర్దాను దాటి వెళ్లడం లేదు. అయితే మీరు దాటి వెళ్లి, ఈ మంచి దేశాన్ని స్వాధీనం చేసుకుంటారు[b].
