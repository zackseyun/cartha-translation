source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: te
  text: నిన్ను శిక్షణ ఇవ్వడానికి[a] ఆయన ఆకాశం నుండి తన స్వరాన్ని నీకు వినిపించాడు; భూమిమీద తన గొప్ప అగ్నిని నీకు చూపించాడు; అగ్ని మధ్యనుండి[b] ఆయన మాటలను నీవు విన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను ఉపదేశించడానికి,’ లేదా ‘నిన్ను దండించి సరిచేయడానికి.’ హీబ్రూ క్రియలో దిద్దుబాటుతో కూడిన శిక్షణ, రూపుదిద్దే బోధ—రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అగ్ని లోపలినుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: తదుపరి భాగంలోని ‘భూమిమీద’ అనే మాటతో ఉన్న స్థలపరమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הִשְׁמִיעֲךָ אֶת קֹלוֹ
  choice: తన స్వరాన్ని నీకు వినిపించాడు
  rationale: שׁמע హిఫీల్ రూపంలోని కారణార్థాన్ని ‘వినిపించాడు’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది; קוֹל దైవిక ప్రసంగ సందర్భంలో ‘స్వరం’గా అనువదించబడింది.
- source_word: לְיַסְּרֶךָּ
  choice: నిన్ను క్రమశిక్షణలో నడిపించడానికి
  rationale: יסרలోని దిద్దుబాటు, శిక్షణ, రూపుదిద్దే బోధ అనే భావాలను కేవలం శిక్షకు పరిమితం చేయకుండా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ‘ఆకాశం నుండి’ అనే పదబంధంతో ఉన్న విశ్వవ్యాప్త వ్యత్యాసాన్ని కాపాడుతుంది; ఇక్కడ ‘దేశం’ కంటే ‘భూమి’ సరైనది.
- source_word: הֶרְאֲךָ אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: తన గొప్ప అగ్నిని నీకు చూపించాడు
  rationale: ראה హిఫీల్ కారణార్థాన్ని సహజమైన ‘చూపించాడు’తోనూ, అగ్ని గురించిన స్పష్టమైన హీబ్రూ చిత్రణను నేరుగానూ నిలుపుతుంది.
- source_word: וּדְבָרָיו שָׁמַעְתָּ
  choice: ఆయన మాటలను నీవు విన్నావు
  rationale: హీబ్రూలోని బహువచన ‘మాటలు’ను, ప్రత్యక్షంగా వినడమనే שׁמע భావాన్ని కాపాడుతుంది.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యనుండి
  rationale: ‘అగ్ని లోపలినుండి’ అనే మూలంలోని సజీవ స్థలపరమైన భావాన్ని గంభీరమైనా సులభంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: לְיַסְּרֶךָּలోని దైవిక శిక్షణ ఉద్దేశం
  choice: నిన్ను క్రమశిక్షణలో నడిపించడానికి
  alternative: నిన్ను ఉపదేశించడానికి; నిన్ను దండించి సరిచేయడానికి
  rationale: ఈ హీబ్రూ క్రియలో బోధ, దిద్దుబాటు, శిక్షణ అనే భావాలు కలిసివున్నాయి. ఎంచుకున్న రూపం దానిని కేవలం శిక్షగానో కేవలం సమాచార బోధగానో సంకుచితం చేయదు.
- issue: దేవుని ప్రత్యక్షతకు సంబంధించిన స్పష్టమైన రూపక భాష
  choice: తన స్వరం ... తన గొప్ప అగ్ని ... ఆయన మాటలు
  alternative: ఆయన ప్రత్యక్షత ... ఆయన సందేశం
  rationale: మూలపాఠంలోని స్పష్టమైన, ఇంద్రియగ్రాహ్యమైన పదాలను భావాత్మక పదాలతో మృదువుపరచకుండా యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఏకవచన సంబోధనను ‘నీకు/నీవు’తో కాపాడింది. మూలంలోని ఆకాశం–భూమి వ్యత్యాసం, కారణార్థక క్రియలు, అగ్ని మధ్యనుండి వినబడిన మాటల చిత్రణ నిలుపబడ్డాయి.
