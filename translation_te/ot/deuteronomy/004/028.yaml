id: DEU.4.28
reference: Deuteronomy 4:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: te
  text: అక్కడ మీరు మానవుల చేతులతో చేసిన చెక్కతోను రాతితోను చేసిన దేవుళ్లను సేవిస్తారు. అవి చూడవు, వినవు, తినవు, వాసన చూడవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: మీరు సేవిస్తారు
  rationale: עבד ఇక్కడ దేవతలను ఆరాధించడం లేదా సేవించడం అనే భావంలో ఉంది. హెచ్చరికలోని భావి పరిణామాన్ని తెలుగులో సహజంగా తెలియజేయడానికి భావిష్యత్ రూపం వాడబడింది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ముందటి సందర్భంలో చెప్పబడిన చెదరగొట్టబడే జనాల దేశాలను సూచించే స్థానవాచక క్రియావిశేషణం.
- source_word: אֱלֹהִים
  choice: దేవుళ్లను
  rationale: ఇక్కడ బహువచన రూపం అబద్ధ దేవతలను సూచిస్తుంది. తరువాతి వివరణ వాటిని మానవులు తయారుచేసిన ప్రతిమలుగా స్పష్టం చేస్తుంది కాబట్టి ‘విగ్రహాలు’ అని ముందుగానే వ్యాఖ్యానించలేదు.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: మానవుల చేతిపనులైన
  rationale: నిర్మాణ శ్రేణి మానవులు తమ చేతులతో తయారుచేసిన వాటిని సూచిస్తుంది. אָדָם సాధారణ మానవజాతిని సూచిస్తుండటంతో లింగనిరపేక్షమైన ‘మానవుల’ ఎంచుకోబడింది.
- source_word: עֵץ וָאֶבֶן
  choice: చెక్కను, రాయిని
  rationale: సందర్భంలో ఇవి ప్రతిమల తయారీ పదార్థాలు; అందువల్ల עֵץ కు జీవవృక్షాన్ని సూచించే ‘చెట్టు’ కాకుండా ‘చెక్క’ సహజమైనది.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: అవి చూడవు, వినవు, తినవు, వాసన చూడవు
  rationale: హీబ్రూ ప్రతి క్రియకు నిషేధాన్ని పునరావృతం చేస్తుంది. సామర్థ్యలేమిని వ్యాఖ్యానాత్మకంగా ‘చూడలేవు’ అని కాకుండా, మూలంలోని ప్రత్యక్ష నిషేధ శ్రేణిని తెలుగులో నిలిపాం.
- source_word: יְרִיחֻן
  choice: వాసన చూడవు
  rationale: רוח హిఫీల్ రూపం ఇక్కడ ఘ్రాణించడం అనే అర్థంలో ఉంది; ఆధునిక సాధారణ తెలుగులో ‘వాసన చూడడం’ సహజ ప్రయోగం.
theological_decisions:
- issue: אֱלֹהִים ను దేవుళ్లు లేదా విగ్రహాలు అని అనువదించడం
  choice: దేవుళ్లు
  alternative: విగ్రహాలు
  rationale: ‘దేవుళ్లు’ మూలపదం యొక్క ప్రత్యక్ష బహువచన భావాన్ని కాపాడుతుంది. అవి మానవుల చేతిపనులైన చెక్క, రాయి అని తరువాతి సమానాధికరణమే విగ్రహాల స్వరూపాన్ని తెలియజేస్తుంది.
- issue: ఇంద్రియ క్రియలను అసామర్థ్యంగా లేదా ప్రత్యక్ష నిషేధంగా వ్యక్తీకరించడం
  choice: చూడవు, వినవు, తినవు, వాసన చూడవు
  alternative: చూడలేవు, వినలేవు, తినలేవు, వాసన చూడలేవు
  rationale: సందర్భం వాటి అసమర్థతను సూచించినా, హీబ్రూ వ్యాకరణం ప్రత్యక్షంగా ‘చేయవు’ అని చెబుతుంది. అందువల్ల మూలంలోని రూపం మరియు విగ్రహాలపై ఉన్న వ్యంగ్య ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: אָדָם యొక్క సాధారణ మానవ సూచన
  choice: మానవుల
  alternative: మనుష్యుని
  rationale: ఇక్కడ పదం ఏ ఒక్క పురుషుడిని కాకుండా మానవ తయారీని సాధారణంగా సూచిస్తుంది; బహువచన తెలుగు రూపం ఈ సామాన్య భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘చెక్కను, రాయిని’ అనే పదబంధాన్ని డాష్‌ల మధ్య ఉంచడం ద్వారా అవి దేవుళ్లకు సమానాధికరణ వివరణ అని స్పష్టం చేశాం. మూలంలో నిజమైన పాఠాంతర లేదా అవసరమైన వివరణాత్మక సందిగ్ధత కనిపించనందున పాదటిప్పణి చేర్చలేదు.
