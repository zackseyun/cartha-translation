id: DEU.4.13
reference: Deuteronomy 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: te
  text: ఆయన మీరు చేయమని ఆజ్ఞాపించిన తన నిబంధనను, అంటే పది మాటలను[a], మీకు ప్రకటించాడు; వాటిని రెండు రాతి పలకలపై రాశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘పది మాటలు’; సంప్రదాయంగా ‘పది ఆజ్ఞలు.’
    reason: సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: ప్రకటించాడు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం/ప్రకటించడం’ అనే భావాన్ని ఇస్తుంది. ‘ప్రకటించాడు’ నిబంధన సందర్భంలోని గంభీరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּרִיתוֹ
  choice: తన నిబంధనను
  rationale: בְּרִית బంధకమైన ఒడంబడిక సంబంధాన్ని సూచించే ప్రామాణిక పదం. తెలుగులో బైబిలు సందర్భానికి సహజమైన ‘నిబంధన’ ఆ భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: మీరు ఆచరించాలని ఆజ్ఞాపించిన
  rationale: לַעֲשׂוֹת అక్షరార్థంగా ‘చేయడానికి’ అయినప్పటికీ, ఆజ్ఞల సందర్భంలో ‘ఆచరించడం’ కార్యరూపంలో చేయాలనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; కేవలం తెలుసుకోవడం అనే అర్థానికి దారి ఇవ్వదు.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: పది మాటలు
  rationale: హెబ్రీ వ్యక్తీకరణ అక్షరార్థంగా ‘పది మాటలు.’ సంప్రదాయ ‘పది ఆజ్ఞలు’ అనే వ్యాఖ్యాత్మక పేరుకు బదులుగా మూలపాఠంలోని పేరును ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: וַיִּכְתְּבֵם
  choice: వాటిని … రాశాడు
  rationale: כתב సాధారణంగా ‘రాయడం’ అని అర్థం. రాతిపై చెక్కడం సాధ్యమైన భావమే అయినా, మూల క్రియ ప్రత్యేకంగా ‘చెక్కడం’ అని చెప్పదు.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: రెండు రాతి పలకల మీద
  rationale: ఇది రాతితో చేసిన రెండు పలకలను సూచిస్తుంది. ‘రెండు రాతి పలకలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: עֲשֶׂרֶת הַדְּבָרִים అనువాదం
  choice: పది మాటలు
  alternative: పది ఆజ్ఞలు
  rationale: మూలపాఠం వీటిని ‘పది మాటలు’ అని పిలుస్తుంది. అందువల్ల మూలభాషకు ప్రాధాన్యమిస్తూ దానినే ప్రధాన పాఠ్యంలో ఉంచి, విస్తృతంగా పరిచయమైన ‘పది ఆజ్ఞలు’ అనే సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘అంటే’తో apposition స్పష్టమవుతుంది; డాష్‌లు దీర్ఘ వాక్యాన్ని చదవడానికి సులభం చేస్తాయి. దైవనామం ఈ వచనంలో ప్రత్యక్షంగా లేకపోవడంతో పుంలింగ ఏకవచన కర్తను ‘ఆయన’గా నిలిపాం.
