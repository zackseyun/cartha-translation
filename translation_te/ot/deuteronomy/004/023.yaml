id: DEU.4.23
reference: Deuteronomy 4:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: te
  text: మీరు జాగ్రత్తగా ఉండండి; మీ దేవుడైన యహ్వే మీతో చేసిన నిబంధనను మరచిపోకండి, అలాగే మీ దేవుడైన యహ్వే మీరు చేయకూడదని ఆజ్ఞాపించిన ఏదైనా దాని రూపంలో చెక్కిన ప్రతిమను మీ కోసం చేసుకోకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, “మీ దేవుడైన యహ్వే మీకు ఆజ్ఞాపించినది” అని ఉంది. “చేయకూడదు” అనే నిషేధం సందర్భంలో అంతర్లీనంగా ఉంది; ద్వితీయోపదేశకాండము 4:16 చూడండి.
    reason: మూలపాఠంలో స్పష్టంగా లేని, సందర్భం ద్వారా గ్రహించబడే నిషేధాన్ని అనువాదంలో వెల్లడించిన విషయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: మీరు జాగ్రత్తగా ఉండండి
  rationale: నిఫాల్ ఆజ్ఞారూపం మరియు לָכֶם కలసి స్వయాన్ని కాపాడుకోవడం, అప్రమత్తంగా ఉండడం అనే హెచ్చరికను ఇస్తాయి. ఆధునిక ప్రామాణిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: మరచిపోయి ... చేసుకోకండి
  rationale: פֶּן హెచ్చరించబడుతున్న ప్రతికూల సంభావ్యతను పరిచయం చేస్తుంది. తెలుగులో ‘మరచిపోకుండా ఉండండి’ అని చెప్పితే తరువాతి క్రియతో అనుసంధానం భారంగా ఉంటుంది; సమన్విత నిషేధ వాక్యంగా ఈ నిర్మాణం సహజంగా ఉంది.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: దేవుడు ఇశ్రాయేలుతో ఏర్పరచిన covenant సంబంధానికి తెలుగులో స్థిరపడిన, గంభీరమైన పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: మీతో చేసిన
  rationale: כרת ברית అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థకం ‘నిబంధన చేయడం’; ‘కోసిన’ అనే అక్షరార్థం తెలుగులో అపారదర్శకంగా ఉంటుంది.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: మీ కోసం చేసుకోకండి
  rationale: לָכֶם లోని స్వప్రయోజనార్థక భావాన్ని ‘మీ కోసం’ మరియు ‘చేసుకోండి’ ద్వారా నిలుపుతూ, సందర్భంలోని నిషేధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: పదం చెక్కి లేదా మలిచి తయారుచేసిన రూపాన్ని సూచిస్తుంది. ‘విగ్రహం’ కంటే మూలపదంలోని తయారీ విధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תְּמוּנַת כֹּל
  choice: దేనినైనా పోలిన
  rationale: תְּמוּנָה లోని రూపం లేదా పోలిక అనే ప్రతినిధిత్వ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యెహోవా మీరు చేయకూడదని ఆజ్ఞాపించిన
  rationale: మసొరెటిక్ పాఠంలో ప్రతికూల పదం స్పష్టంగా లేకపోయినా, సమీప సందర్భం—ప్రత్యేకంగా 4:16—ఆజ్ఞ నిషేధాత్మకమని చూపుతుంది. తెలుగులో విరుద్ధార్థం కలగకుండా అంతర్లీన నిషేధాన్ని వెల్లడించి, పాదటిప్పణిలో పాఠరూపాన్ని నమోదు చేశాం.
theological_decisions:
- issue: చివరి సంబంధవాచక ఉపవాక్యంలో అంతర్లీన నిషేధం
  choice: ‘మీరు చేయకూడదని ఆజ్ఞాపించిన’ అని నిషేధార్థాన్ని స్పష్టం చేయడం
  alternative: ‘మీ దేవుడైన యెహోవా మీకు ఆజ్ఞాపించిన’ అని హీబ్రూ పదరూపాన్ని నేరుగా ఉంచడం
  rationale: ప్రస్తుత హీబ్రూ పాఠంలో ‘కాదు/వద్దు’ అనే పదం లేదు. అయితే 4:16లోని స్పష్టమైన నిషేధం మరియు ఈ వాక్యపు హెచ్చరిక ప్రకారం ఇక్కడ నిషేధం సందర్భసిద్ధంగా అంతర్లీనమై ఉంది. దానిని ప్రధాన పాఠంలో స్పష్టం చేయడం అపార్థాన్ని నివారిస్తుంది; పాదటిప్పణి అసలు పాఠంలోని సంక్షిప్తతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. సమూహాన్ని ఉద్దేశించిన బహువచనాన్ని కొనసాగించాం. హీబ్రూలో చివర ఏకవచన ప్రత్యయం ఉన్నప్పటికీ, తెలుగు సందర్భంలో సమూహ సంబోధన సహజత్వం కోసం బహువచనం వాడాం.
