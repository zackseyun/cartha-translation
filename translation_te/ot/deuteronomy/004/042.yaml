translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే న్యాయ శైలిని ఉపయోగించాం. ‘హంతకుడు’ అనే ముందస్తు దోషనిర్ణయ పదాన్ని నివారించి, మూలంలోని న్యాయ తటస్థతను కాపాడాం. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
