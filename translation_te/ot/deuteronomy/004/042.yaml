  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ/נֻ֨ס שָׁ֜מָּ/ה רוֹצֵ֗חַ אֲשֶׁ֨ר יִרְצַ֤ח אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמ֣וֹל שִׁלְשׁ֑וֹם וְ/נָ֗ס אֶל אַחַ֛ת מִן הֶ/עָרִ֥ים הָ/אֵ֖ל וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: te
  text: తెలియక తన పొరుగువానిని చంపినవాడు[a]—అంతకుముందు అతనిపై పగలేనివాడు[b]—అక్కడికి, ఈ పట్టణాల్లో ఒకదానికి, పారిపోయి ప్రాణాలతో ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “తెలియకుండా.” ఈ న్యాయ సందర్భంలో, చంపడం అతని అవగాహన లేదా ఉద్దేశం లేక జరిగిందనే భావం.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “నిన్న లేదా మొన్న”; అంటే, అంతకుముందు నుంచే లేదా గతంలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: అక్కడికి ... పారిపోయి
  rationale: לతో కూడిన క్రియార్థక రూపం ముందటి వచనంలో పట్టణాలను ప్రత్యేకించిన ఉద్దేశాన్ని తెలియజేస్తుంది; తెలుగులో వాక్యాంతంలోని ‘ఉండేలా’ ఆ ఉద్దేశ సంబంధాన్ని సహజంగా మోస్తుంది.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: చంపినవాడు
  rationale: ఆశ్రయ పట్టణాల న్యాయ సందర్భంలో ఇది తప్పనిసరిగా ఉద్దేశపూర్వక హంతకుడిని సూచించదు. అందుచేత నేరస్థత్వాన్ని ముందే నిర్ణయించే ‘హంతకుడు’ కంటే ‘చంపినవాడు’ తటస్థంగా ఉంది.
- source_word: רֵעֵהוּ
  choice: తన పొరుగువానిని
  rationale: רֵעַకు సాధారణ న్యాయ-సామాజిక అర్థమైన ‘పొరుగువాడు’ను నిలుపుతుంది; స్వామ్య ప్రత్యయం తెలుగులో ‘తన’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: בִּבְלִי דַעַת
  choice: తెలియక
  rationale: పదశః ‘జ్ఞానం లేకుండా’; ఈ న్యాయ సందర్భంలో అవగాహన లేదా ఉద్దేశం లేక జరిగిన క్రియను సూచిస్తుంది. ‘తెలియక’ మూలరూపానికీ సహజ తెలుగుకీ దగ్గరగా ఉంది; న్యాయార్థం పాదటిప్పణిలో స్పష్టం చేయబడింది.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: అతనిపై పగలేనివాడు
  rationale: שֹׂנֵא అనే వర్తమాన కృదంతం కొనసాగుతున్న విరోధ వైఖరిని సూచిస్తుంది. ‘పగలేనివాడు’ తెలుగులో సహజంగా ఆ స్థిరమైన శత్రుత్వాభావాన్ని తెలియజేస్తుంది.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: అంతకుముందు
  rationale: పదశః ‘నిన్నటి నుంచీ మొన్నటి నుంచీ’ అనే కాలసూచక నానుడి; ఇక్కడ ‘ఇంతకుముందు నుంచే’ లేదా ‘గతంలో’ అనే భావం. ప్రధాన పాఠ్యంలో సహజమైన నానుడి భావం, పాదటిప్పణిలో పదశః రూపం ఇవ్వబడింది.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: ఈ పట్టణాల్లో ఒకదానికి
  rationale: הָאֵל సమీప సూచనను ‘ఈ’గా నిలుపుతూ, తెలుగులో విభక్తి నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: וָחָי
  choice: ప్రాణాలతో ఉండేలా
  rationale: సరళంగా ‘బతకడం’ అనే ఫలితాన్ని సూచిస్తుంది; ఆశ్రయ పట్టణానికి పారిపోవడం ద్వారా ప్రాణరక్షణ పొందే న్యాయ సందర్భాన్ని ‘ప్రాణాలతో ఉండడం’ స్పష్టంగా తెలియజేస్తుంది.
