source:
  edition: WLC
  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: te
  text: అయితే అక్కడి నుంచి మీరు మీ దేవుడైన యాహ్వేను వెదకుతారు; మీ హృదయమంతటితో, మీ ప్రాణమంతటితో ఆయనను అన్వేషిస్తే, మీరు ఆయనను కనుగొంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అని అనువదించిన హీబ్రూ పదం నెఫెష్; ఇక్కడ అది ‘జీవితం’ లేదా ‘సంపూర్ణ అస్తిత్వం’ అనే భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: అయితే అక్కడి నుంచే మీరు ... వెదకుతారు
  rationale: సందర్భంలోని వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; מִשָּׁם చెదరగొట్టబడిన ప్రదేశాల నుంచే వెదకడాన్ని సూచిస్తుంది. బహువచన క్రియను ‘మీరు’తో నిలిపాం.
- source_word: אֶת־יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యెహోవాను
  rationale: యెహోవా అనే ఒడంబడిక నామాన్ని ప్రత్యక్షంగా ఉంచాం. ‘నీ దేవుడు’ అనే ఏకవచన రూపం ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది; తెలుగులో సందర్భానుకూల గౌరవ/సమష్టి రూపంగా ‘మీ దేవుడు’ సహజంగా ఉంది.
- source_word: וּמָצָאתָ
  choice: ఆయన మీకు దొరుకుతాడు
  rationale: హీబ్రూలో కర్తృవాచ్యంగా అక్షరార్థం ‘నీవు కనుగొంటావు’; తెలుగులో దేవుణ్ణి వెదికి పొందడాన్ని సహజంగా తెలియజేయడానికి ‘ఆయన మీకు దొరుకుతాడు’ అని ఇచ్చాం. అంతర్నిహిత కర్మను ‘ఆయన’గా స్పష్టం చేశాం.
- source_word: כִּי
  choice: అన్వేషిస్తే
  rationale: ఇక్కడ כִּי షరతును ప్రవేశపెడుతుంది; తెలుగు ‘-తే’ రూపం ‘if’ అనే భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: תִדְרְשֶׁנּוּ
  choice: ఆయనను అన్వేషిస్తే
  rationale: דרש దేవుణ్ణి చిత్తశుద్ధితో, పట్టుదలతో వెదకడాన్ని సూచిస్తుంది. మొదటి בקשకు భిన్నమైన పదాన్ని వాడి మూలంలోని పదవైవిధ్యాన్ని కొంత నిలిపాం.
- source_word: בְּכָל־לְבָבְךָ
  choice: మీ పూర్ణ హృదయంతో
  rationale: לֵבָב సంకల్పం, ఆలోచన, భావాలతో కూడిన అంతరంగ వ్యక్తిని సూచిస్తుంది; ‘పూర్ణ హృదయంతో’ సంపూర్ణ నిబద్ధతను తెలియజేస్తుంది.
- source_word: וּבְכָל־נַפְשֶׁךָ
  choice: మీ పూర్ణ ప్రాణంతో
  rationale: נֶפֶשׁ జీవం, స్వయం, సంపూర్ణ వ్యక్తిత్వం అనే విస్తృత అర్థాలను కలిగి ఉంది. ‘ప్రాణం’ తెలుగు బైబిలు శైలిలో సహజంగా ఉండి జీవమంతటినీ అర్పించే భావాన్ని నిలుపుతుంది; విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా వ్యక్తినామంగా నిలిపాం. ఆధునిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: נֶפֶשׁ అనే మానవశాస్త్రీయ పదం
  choice: ప్రాణం
  alternative: జీవితం; సంపూర్ణ అస్తిత్వం
  rationale: హృదయంతో జతగా వచ్చే ఈ ద్వితీయోపదేశకాండ సూత్రంలో సంపూర్ణ వ్యక్తి నిబద్ధత ఉద్దేశించబడింది. ‘ప్రాణం’ సాహిత్య ప్రతిధ్వనిని నిలుపుతుంది; దానిని శరీరానికి వేరైన భాగంగా మాత్రమే పరిమితం చేయకుండా ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఇచ్చాం.
- issue: రెండవ పురుష బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: తెలుగులో ‘మీరు/మీ’గా సమష్టి సంబోధన
  alternative: ‘మీరు’ తరువాత ‘నీవు/నీ’గా రూపమార్పును ప్రత్యక్షంగా చూపడం
  rationale: మసొరేటిక్ పాఠంలో וּבִקַּשְׁתֶּם బహువచనం కాగా తరువాతి రూపాలు ఏకవచనం. ఇది ఇశ్రాయేలును సమూహంగానూ ఏక సమష్టిగానూ సంబోధించే వాక్చాతుర్యం. తెలుగులో అకస్మాత్తు మార్పు వ్యక్తుల మార్పుగా అపార్థమయ్యే అవకాశం ఉండటంతో సమష్టి ‘మీరు’ను కొనసాగించాం; భావాన్ని మాత్రం వ్యక్తిగత-సమష్టి నిబద్ధతగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘వెదకడం/అన్వేషించడం’ ద్వారా మూలంలోని రెండు సంబంధిత క్రియల భేదాన్ని నిలిపాం. వాక్యక్రమాన్ని తెలుగులో షరతు-ఫలిత సంబంధం స్పష్టంగా వినిపించేలా స్వల్పంగా పునర్వ్యవస్థీకరించాం.
