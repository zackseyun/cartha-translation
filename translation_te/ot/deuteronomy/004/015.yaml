id: DEU.4.15
reference: Deuteronomy 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: te
  text: కాబట్టి మీరు మీ విషయంలో ఎంతో జాగ్రత్తగా ఉండండి.[a] ఎందుకంటే హోరేబులో అగ్ని మధ్యలోనుండి యహ్వే మీతో పలికిన రోజున మీరు ఏ రూపాన్నీ చూడలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ ప్రాణాల నిమిత్తం మిమ్మల్ని మీరు అత్యధికంగా కాపాడుకోండి”; ఇది అత్యంత జాగ్రత్తగా ఉండాలని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఏ పోలికనూ” లేదా “ఏ ప్రతిరూపాన్నీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: కాబట్టి మిమ్మల్ని మీరు ఎంతో జాగ్రత్తగా కాపాడుకోండి
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థంగా ‘మీ ప్రాణాల నిమిత్తం మిమ్మల్ని మీరు అత్యధికంగా కాపాడుకోండి’ అనే భావాన్ని ఇస్తుంది; సందర్భంలో ఇది తీవ్రమైన స్వీయ-హెచ్చరికను తెలిపే నుడికారం. తెలుగు వాక్యం హెచ్చరిక బలాన్ని, ప్రతిబింబార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని పరిచయం చేసే కారణార్థక సంధిగా ఇక్కడ సహజంగా సరిపోతుంది.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: మీరు ఏ రూపాన్నీ చూడలేదు
  rationale: תְּמוּנָה అనేది రూపం, పోలిక లేదా దృశ్య ప్రతిరూపాన్ని సూచించగలదు. తరువాతి విగ్రహనిషేధ సందర్భాన్ని ముందుగానే అతిగా నిర్దిష్టం చేయకుండా ‘రూపం’ మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: בְּיוֹם
  choice: రోజున
  rationale: హీబ్రూలోని కాలసూచక భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: యెహోవా మీతో మాట్లాడిన
  rationale: אֶל యొక్క దిశార్థాన్ని తెలుగులో సహజమైన ‘మీతో మాట్లాడిన’ నిర్మాణంతో వ్యక్తం చేస్తుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: בְּחֹרֵב
  choice: హోరేబులో
  rationale: ప్రత్యక్షత జరిగిన స్థలాన్ని తెలుగులో సహజమైన స్థానవిభక్తితో తెలియజేస్తుంది.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యనుండి
  rationale: సాధారణ ‘అగ్నినుండి’ కంటే מִתּוֹךְ లోని ‘మధ్యలోనుండి’ అనే స్పష్టమైన, సజీవ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם లో נֶפֶשׁ యొక్క మానవస్వరూప సంబంధమైన భావం
  choice: ప్రతిబింబార్థక నుడికారంగా ‘మిమ్మల్ని మీరు ... కాపాడుకోండి’
  alternative: ‘మీ ప్రాణాలను కాపాడుకోండి’
  rationale: ఈ సందర్భంలో పదబంధం శరీరం నుండి వేరైన ‘ఆత్మ’ గురించి సిద్ధాంత ప్రకటన చేయడం లేదు; అత్యంత జాగ్రత్తగా ఉండమనే హీబ్రూ నుడికారంగా పనిచేస్తుంది. అందువల్ల లేనిపోని మానవస్వరూప సిద్ధాంతాన్ని చేర్చకుండా హెచ్చరికను అందిస్తుంది.
- issue: హోరేబు ప్రత్యక్షత సందర్భంలో תְּמוּנָה అర్థం
  choice: రూపం
  alternative: పోలిక; ప్రతిరూపం; విగ్రహం
  rationale: వారు యెహోవా స్వరాన్ని విన్నప్పటికీ దృశ్యరూపాన్ని చూడలేదనే అంశమే తరువాతి విగ్రహనిషేధ వాదనకు ఆధారం. ‘రూపం’ అనే పదం తయారు చేసిన విగ్రహానికే అర్థాన్ని పరిమితం చేయకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మోపదేశానికి తగిన గంభీరతతో అనువదించబడింది. ‘యెహోవా’ అనే వ్యక్తినామాన్ని నిలిపి, ‘రూపం’ అనే పదం ద్వారా మూలంలోని అర్థవిస్తృతిని కాపాడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
