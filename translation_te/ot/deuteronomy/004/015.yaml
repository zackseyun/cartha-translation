revisions:
- from: కాబట్టి మిమ్మల్ని మీరు ఎంతో జాగ్రత్తగా కాపాడుకోండి.[a] ఎందుకంటే హోరేబులో అగ్ని మధ్యనుండి యెహోవా మీతో మాట్లాడిన రోజున మీరు ఏ రూపాన్నీ చూడలేదు.[b]
