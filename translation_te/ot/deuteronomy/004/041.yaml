lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి కథన చర్యను పరిచయం చేసే కాలవాచక క్రియావిశేషణానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: יַבְדִּיל
  choice: ప్రత్యేకంగా నియమించాడు
  rationale: בדל ధాతువు హిఫీల్ రూపం ఒక నిర్దిష్ట ఉద్దేశం కోసం వేరుచేయడం లేదా ప్రత్యేకంగా ఉంచడం సూచిస్తుంది; ఆశ్రయ పట్టణాల సందర్భంలో ఈ ఎంపిక వేరుచేయడం, నియమించడం అనే రెండు భావాలనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణ.
- source_word: שָׁלֹשׁ עָרִים
  choice: మూడు పట్టణాలను
  rationale: సంఖ్యావాచకం మరియు నామవాచకంతో కూడిన సరళ నిర్మాణాన్ని నేరుగా అనువదిస్తుంది; తెలుగు వాక్య నిర్మాణం ప్రకారం కర్మవిభక్తి జోడించబడింది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: యొర్దాను నదికి ఆవలివైపును సూచించే హీబ్రూ భౌగోళిక నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; కథన దృక్కోణంపై ఆధారపడే స్థలసంబంధ అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: సూర్యోదయ దిశగా
  rationale: అక్షరార్థమైన ‘సూర్యుడు ఉదయించే దిశగా’ అనే స్పష్ట చిత్రాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా తూర్పుదిశను సూచిస్తుంది.
