  terminology: ‘రూపం’ అనేది תַּבְנִיתకు సందర్భానుగుణమైన, విస్తృతార్థాన్ని నిలిపే పదం; దానిని కేవలం విగ్రహం లేదా చెక్కిన ప్రతిమగా పరిమితం చేయదు. ‘పాకే జీవి,’ ‘నేలమీద,’ ‘చేప,’ మరియు ‘నీళ్లు’ అన్న ఎంపికలు అర్థస్పష్టంగా, సహజంగా ఉన్నాయి.
