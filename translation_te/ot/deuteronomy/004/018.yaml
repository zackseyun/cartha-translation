id: DEU.4.18
reference: Deuteronomy 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תַּבְנִ֕ית כָּל רֹמֵ֖שׂ בָּ/אֲדָמָ֑ה תַּבְנִ֛ית כָּל דָּגָ֥ה אֲשֶׁר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: te
  text: నేలమీద పాకే ఏ జీవి రూపాన్నైనా[a], భూమి కిందనున్న నీళ్లలోని ఏ చేప రూపాన్నైనా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘రూపం’ అనే మాటకు ‘పోలిక’ లేదా ‘ప్రతిరూపం’ అని కూడా అనువదించవచ్చు (హీబ్రూ: תַּבְנִית).'
    reason: lexical_alternative
  - marker: b
    text: ‘భూమి కిందనున్న నీళ్లు’ అనేది నేల దిగువనున్న జలాలను సూచించే బైబిలులోని స్థిరమైన వ్యక్తీకరణను ప్రతిధ్వనిస్తుంది; నిర్గమకాండం 20:4లోని ప్రతిమల నిషేధ వాక్యాన్ని పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: రూపం
  rationale: విగ్రహారాధన నిషేధ సందర్భంలో ఇది కనిపించే ఆకారాన్ని లేదా దానికి చేసిన ప్రతిరూపాన్ని సూచిస్తుంది. నిర్దిష్ట మాధ్యమాన్ని సూచించే ‘విగ్రహం’ అనే పదాన్ని చేర్చకుండా, హీబ్రూ పదంలోని విస్తృత భావాన్ని ‘రూపం’ నిలుపుతుంది.
- source_word: כָּל
  choice: ఏ ... అయినా
  rationale: ఏ ఒక్క రకాన్నీ మినహాయించని విభాజక భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: רֹמֵשׂ
  choice: పాకే జీవి
  rationale: నేలపై పాకుతూ లేదా సర్రున కదిలే చిన్న ప్రాణుల వర్గాన్ని సూచిస్తుంది; ‘జీవి’ అని చేర్చడం తెలుగులో భావాన్ని స్పష్టంగా, సహజంగా చేస్తుంది.
- source_word: בָּאֲדָמָה
  choice: నేలమీద
  rationale: ఇక్కడ אֲדָמָה ప్రాణులు కదిలే నేల ఉపరితలాన్ని సూచిస్తుంది; ‘నేలమీద’ సందర్భానుగుణమైన సహజ తెలుగు.
- source_word: דָּגָה
  choice: చేప
  rationale: హీబ్రూలో సమూహార్థకంగా వాడిన ఈ పదాన్ని ‘ఏ చేప’ అనే నిర్మాణం తెలుగులో విభాజక భావంతో సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: నీళ్లలోని
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; מַיִם యొక్క నీటి భావాన్ని ‘నీళ్లు’ సాధారణ పాఠకులకు సులభంగా అందిస్తుంది.
- source_word: מִתַּחַת לָאָרֶץ
  choice: భూమి కిందనున్న
  rationale: భూమి కింద ఉన్న జలాలను సూచించే బైబిలు సంప్రదాయ వ్యక్తీకరణను వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: విగ్రహారాధన సందర్భంలో ప్రాతినిధ్య రూపానికి వాడే పదం
  choice: ఏ ... రూపాన్నైనా
  alternative: ఏ ... పోలికనైనా / ఏ ... ప్రతిమనైనా
  rationale: వచనం సృష్టిలోని వాటి ప్రాతినిధ్యాలను చేయడాన్ని నిషేధించే సందర్భంలో ఉంది. ‘రూపం’ హీబ్రూ పదంలోని విస్తృతతను నిలుపుతూ, దానిని కేవలం చెక్కిన విగ్రహంగా పరిమితం చేయదు; విగ్రహారాధన వ్యతిరేక భావాన్ని సందర్భమే మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని పునరుక్త నిర్మాణాన్ని రెండు భాగాల్లోనూ ‘ఏ ... రూపాన్నైనా’గా నిలిపాం. ఇది మునుపటి వాక్యంపై ఆధారపడే వచనఖండం కాబట్టి, మూలంలో లేని క్రియను చేర్చలేదు.
