  to: అప్పుడు అతని పట్టణపు పెద్దలు పంపి, అక్కడి నుండి అతనిని తీసుకొని, రక్తానికి ప్రతీకారం తీర్చేవాని[a] చేతికి అప్పగించాలి; అతడు చనిపోవాలి.
