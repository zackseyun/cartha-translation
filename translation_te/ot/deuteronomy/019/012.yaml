id: DEU.19.12
reference: Deuteronomy 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָֽׁלְחוּ֙ זִקְנֵ֣י עִיר֔/וֹ וְ/לָקְח֥וּ אֹת֖/וֹ מִ/שָּׁ֑ם וְ/נָתְנ֣וּ אֹת֗/וֹ בְּ/יַ֛ד גֹּאֵ֥ל הַ/דָּ֖ם וָ/מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/012.yaml
  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: te
  text: అప్పుడు అతని పట్టణపు పెద్దలు పంపి, అక్కడి నుండి అతనిని తీసుకొని, రక్తానికి ప్రతీకారం తీర్చేవాని[a] చేతికి అప్పగించాలి; అతడు చనిపోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్త ప్రతీకారికుడు.” హీబ్రూ పదబంధం גֹּאֵל הַדָּם రక్తపాతం జరిగిన సందర్భంలో ప్రతీకారం తీర్చే బాధ్యతగల వ్యక్తిని సూచించే సాంకేతిక న్యాయపదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: మనుషులను పంపి
  rationale: న్యాయనియమ సందర్భంలోని క్రియకు ఆదేశార్థం ఉంది. హీబ్రూలో పంపబడే వ్యక్తులు స్పష్టంగా లేకపోయినా, తెలుగులో సహజంగా ఉండేందుకు ‘మనుషులను’ అనేది సందర్భానుగుణంగా చేర్చబడింది.
- source_word: זִקְנֵי עִירוֹ
  choice: అతని పట్టణపు పెద్దలు
  rationale: זִקְנֵי అనేది గుర్తింపు పొందిన స్థానిక పాలక పెద్దలను సూచిస్తుంది; עִיר ఈ సందర్భంలో సహజ ఆధునిక తెలుగులో ‘పట్టణం’గా ఇవ్వబడింది.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: అక్కడి నుండి అతన్ని తీసుకువచ్చి
  rationale: לקח యొక్క సాధారణ అర్థం ‘తీసుకోవడం.’ ఆశ్రయపట్టణం నుండి అతన్ని రప్పించే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, మూలంలో లేని బలవంతపు స్వాధీన భావాన్ని చేర్చలేదు.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: చేతికి అప్పగించాలి
  rationale: נתן ביד అనే నుడికారం ఒకరి అధికారానికి లేదా ఆధీనానికి అప్పగించడాన్ని సూచిస్తుంది. ‘చేతికి అప్పగించాలి’ మూలంలోని ‘చేతి’ రూపకాన్ని నిలుపుతూ న్యాయపరమైన బదిలీని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చుకునే వాడు
  rationale: హత్యకు ప్రతీకారం తీర్చే బాధ్యత లేదా అధికారం గల వ్యక్తిని సూచించే సాంకేతిక న్యాయపదబంధం. ‘రక్తప్రతీకారం తీర్చుకునే వాడు’ దాని కార్యాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָמֵת
  choice: అతడు చనిపోవాలి
  rationale: అప్పగింత తరువాత కలిగే నిర్దేశిత న్యాయఫలితాన్ని సంక్షిప్తంగా నిలుపుతుంది; కారణార్థం వంటి అదనపు భావాన్ని చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయనియమ శైలి పాటించబడింది. ‘పట్టణపు పెద్దలు,’ ‘చేతికి అప్పగించాలి’ వంటి సాధారణంగా అర్థమయ్యే పదబంధాలు ఉపయోగించబడ్డాయి; సాంకేతిక పదానికి పాదటిప్పణి జోడించబడింది.
