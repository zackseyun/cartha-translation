  edition: WLC
  text: וְ/דָרְשׁ֥וּ הַ/שֹּׁפְטִ֖ים הֵיטֵ֑ב וְ/הִנֵּ֤ה עֵֽד שֶׁ֨קֶר֙ הָ/עֵ֔ד שֶׁ֖קֶר עָנָ֥ה בְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/018.yaml
  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: te
  text: న్యాయాధిపతులు జాగ్రత్తగా విచారణ చేయాలి. ఆ సాక్షి అబద్ధ సాక్షి అని, అతడు తన సహోదరునిపై అబద్ధ సాక్ష్యం చెప్పాడని తేలితే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ ... הֵיטֵב
  choice: జాగ్రత్తగా విచారణ చేయాలి
  rationale: దర్యాప్తు లేదా విచారణను క్షుణ్ణంగా, శ్రద్ధగా చేయాలనే హెబ్రీ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֵד שֶׁקֶר
  choice: అబద్ధ సాక్షి
  rationale: న్యాయసంబంధ సందర్భంలో వ్యక్తిని సూచించే మూలపదబంధానికి నేరుగా సరిపోతుంది.
- source_word: שֶׁקֶר עָנָה
  choice: అబద్ధ సాక్ష్యం చెప్పాడు
  rationale: ఇక్కడ ענה సాధారణంగా ‘జవాబిచ్చాడు’ అనే అర్థంలో కాక, న్యాయస్థానంలో సాక్ష్యమిచ్చాడనే భావంలో ఉంది.
- source_word: בְאָחִיו
  choice: తన సహోదరునిపై
  rationale: ‘తన సోదరునికి వ్యతిరేకంగా’ అనే సంబంధాన్ని సహజంగా వ్యక్తపరుస్తూ, ఒడంబడిక సమాజంలోని సహసభ్యుని సూచించే విస్తృత అవకాశాన్ని మూసివేయదు.
theological_decisions:
- issue: הִנֵּה యొక్క సందర్భార్థం
  choice: అని తేలితే
  alternative: ఇదిగో
  rationale: విచారణ ఫలితంగా ఆరోపణ నిజమని నిర్ధారణ కావడాన్ని సందర్భం సూచిస్తుంది. తెలుగు న్యాయవాక్యంలో ‘ఇదిగో’ అసహజంగా ఉండటంతో, షరతు-నిర్ధారణ భావాన్ని స్పష్టంగా అందించాం.
- issue: אָחִיו యొక్క పరిధి
  choice: తన సహోదరుడు
  alternative: తన తోటి వ్యక్తి
  rationale: మూలంలోని బంధుత్వ రూపకాన్ని నిలుపుతూ, దానిని కేవలం శారీరక అన్నదమ్ములకే పరిమితం చేసే వివరణను వచనంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, స్పష్టమైన న్యాయపరమైన శైలి. ఇది తదుపరి వచనంతో కొనసాగే షరతు వాక్యం కావడంతో చివర కామా ఉంచబడింది.
