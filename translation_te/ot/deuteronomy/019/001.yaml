revisions:
- from: నీ దేవుడైన యెహోవా నీకు ఇస్తున్న దేశంలోని జనాలను నిర్మూలించి[a], నీవు వారిని వెళ్లగొట్టి వారి పట్టణాల్లో, వారి ఇళ్లలో నివసించినప్పుడు,
  to: నీ దేవుడైన యాహ్వే, ఎవరి దేశాన్ని నీకు ఇస్తున్నాడో ఆ జనాంగాలను తొలగించి, నీవు వారిని వెళ్లగొట్టి వారి పట్టణాల్లోను ఇళ్లల్లోను నివసించినప్పుడు,
  rationale: The revision restores the explicit meaning that Yahweh gives Israel the land belonging to those nations, uses a less interpretively specific equivalent for the Hebrew “cut off,” and aligns the divine name with the POB audit trail. The final comma is retained because the sentence continues in the following verse.
