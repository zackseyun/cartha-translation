id: DEU.19.1
reference: Deuteronomy 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే, ఎవరి దేశాన్ని నీకు ఇస్తున్నాడో ఆ జనాంగాలను తొలగించి, నీవు వారిని వెళ్లగొట్టి వారి పట్టణాల్లోను ఇళ్లల్లోను నివసించినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: నివసించినప్పుడు
  rationale: తదుపరి ఆజ్ఞలకు నేపథ్యంగా, నెరవేరబోయే పరిస్థితిని సూచించే కాలార్థాన్ని సహజమైన తెలుగులో ‘...ప్పుడు’ నిర్మాణంతో తెలిపింది.
- source_word: יַכְרִית
  choice: నిర్మూలించి
  rationale: హిఫీల్ రూపం ఇక్కడ ఆ జనాలను తొలగించడం లేదా అంతం చేయడం అనే భావాన్ని ఇస్తుంది. ‘నరికివేసి’ అనే అక్షరార్థ రూపం తెలుగులో ఈ సందర్భంలో అసహజంగా ఉండటంతో, మూలంలోని తీవ్రతను నిలిపే ‘నిర్మూలించి’ ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాలను
  rationale: ఇక్కడ గోయిమ్ భూభాగంలో నివసిస్తున్న వివిధ ప్రజాసమూహాలను సూచిస్తుంది; ‘అన్యజనులు’ అనే తరువాతి మతపరమైన ఛాయను రానివ్వకుండా ‘జనాలు’ వాడాం.
- source_word: נֹתֵן לְךָ אֶת אַרְצָם
  choice: నీకు ఇస్తున్న దేశంలోని
  rationale: హీబ్రూ వాక్యంలో ‘వారి దేశాన్ని నీకు ఇస్తున్నాడు’ అనే భావాన్ని తెలుగులో సంబంధవాచక నిర్మాణంగా సహజంగా అమర్చాం; వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా నిశ్చితమైన కార్యభావాన్ని ‘ఇస్తున్న’ నిలుపుతుంది.
- source_word: וִירִשְׁתָּם
  choice: నీవు వారిని వెళ్లగొట్టి
  rationale: వ్యక్తులను సూచించే కర్మప్రత్యయం కారణంగా, ఇక్కడ ירש వారిని స్వాధీనం చేసుకోవడం కాక వారి స్థానం నుండి తొలగించి వారి భూమిని ఆక్రమించడం. ‘వెళ్లగొట్టి’ ఈ భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְיָשַׁבְתָּ
  choice: నివసించినప్పుడు
  rationale: స్థిరపడి నివసించడం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కాలసూచక כִּיతో వాక్యాన్ని కలుపుతుంది.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: వారి పట్టణాల్లో, వారి ఇళ్లలో
  rationale: రెండు నామాలకూ ఉన్న సంబంధప్రత్యయాన్ని, స్థానసూచక విభక్తిని స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది కనుక ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ ‘యెహోవా’ను వాడాం; ‘యాహ్వే’ మరొక సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: יַכְרִית యొక్క తీవ్రత
  choice: నిర్మూలించి
  alternative: తొలగించి / నరికివేసి
  rationale: క్రియ జనాలను దేశం నుండి పూర్తిగా తొలగించే బలమైన భావాన్ని కలిగి ఉంది. ‘నిర్మూలించి’ ఆ తీవ్రతను నిలుపుతుంది; అది ప్రతి సందర్భంలో ఏ విధమైన నిర్మూలన జరిగిందో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర సంబంధమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి సహజంగా ఉండే వాక్యనిర్మాణం వాడాం. మూలవాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచాం.
