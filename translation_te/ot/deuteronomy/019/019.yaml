id: DEU.19.19
reference: Deuteronomy 19:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂ֣יתֶם ל֔/וֹ כַּ/אֲשֶׁ֥ר זָמַ֖ם לַ/עֲשׂ֣וֹת לְ/אָחִ֑י/ו וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: te
  text: అప్పుడు అతడు తన సహోదరునికి[a] చేయాలని ఉద్దేశించినట్లే మీరు అతనికి చేయాలి. అలా మీరు మీ మధ్యనుండి చెడును తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తోటి వ్యక్తికి”; హీబ్రూలో “తన సహోదరునికి.” ఈ న్యాయ సందర్భంలో ఇది ఒడంబడిక సమాజంలోని తోటి సభ్యుణ్ణి సూచించే పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: మీరు ... చేయాలి
  rationale: సమాజాన్ని లేదా న్యాయనిర్ణేతలను ఉద్దేశించిన న్యాయపరమైన ఆదేశ భావాన్ని ఆధునిక సహజ తెలుగులో తెలియజేస్తుంది; వావ్ సూచించే క్రమాన్ని ‘అప్పుడు’తో వ్యక్తం చేశాం.
- source_word: לוֹ
  choice: అతనికి
  rationale: సందర్భంలో అబద్ధ సాక్షిని సూచించే దత్తివ ఏకవచన సర్వనామానికి నేరమైన సమానం.
- source_word: כַּאֲשֶׁר
  choice: అట్లే
  rationale: ఉద్దేశించిన హానికి తగిన ప్రతిఫలం విధించాలనే కొలతకు-కొలత పోలికను సహజంగా తెలియజేస్తుంది.
- source_word: זָמַם
  choice: ఉద్దేశించిన
  rationale: ఈ క్రియ పన్నాగం లేదా హానికరమైన యోచనను సూచించగలదు; అయితే అబద్ధ సాక్ష్యపు సందర్భమే దుష్ట ఉద్దేశాన్ని స్పష్టం చేస్తుండగా, ఈ ఎంపిక మూలంలోని భావాన్ని అతిశయింపకుండా కాపాడుతుంది.
- source_word: לַעֲשׂוֹת
  choice: చేయాలని
  rationale: זָמַם‌కు పూరకమైన క్రియారూపాన్ని తెలుగులో సహజమైన ఉద్దేశార్థక నిర్మాణంగా అందిస్తుంది.
- source_word: לְאָחִיו
  choice: తన సహోదరునికి
  rationale: אָח యొక్క ‘సోదరుడు/సహోదరుడు’ అనే మూలార్థాన్నీ, ఈ న్యాయ సందర్భంలోని ఒడంబడిక సమాజ సభ్యుడనే విస్తృత ప్రయోగాన్నీ ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా కాపాడుతుంది.
- source_word: וּבִעַרְתָּ
  choice: ఆ విధంగా ... తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసూత్రంలో ఇది అక్షరార్థంగా కాల్చడం కాదు, సమాజం నుంచి చెడును తొలగించడం. ‘ఆ విధంగా’ ఫలితాత్మక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הָרָע
  choice: ఆ చెడును
  rationale: సూత్రబద్ధమైన నైతిక బరువును నిలుపుతూ, సందర్భంలో పేర్కొన్న చెడును సూచించే నిర్దిష్టతను తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִקִּרְבֶּךָ
  choice: మీ మధ్యనుండి
  rationale: ఇశ్రాయేలు సమాజం లోపలినుంచి చెడును తొలగించాలనే సామూహిక చిత్రణను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: న్యాయ సందర్భంలో లింగసూచక ఒడంబడిక పదం אָחִיו
  choice: తన సహోదరునికి
  alternative: తన తోటి వ్యక్తికి / తన తోటి ఇశ్రాయేలీయునికి
  rationale: హీబ్రూ రూపం పుంలింగ ఏకవచనం; సందర్భంలో అది ఒడంబడిక సమాజంలోని మరో సభ్యుణ్ణి ప్రతినిధిగా సూచిస్తుంది. ప్రధాన పాఠం మూలంలోని బంధుత్వ పదాన్ని నిలుపుతుంది; విస్తృత సామూహిక భావాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘తొలగించాలి’ అనే రూపం అక్షరార్థ దహన భావాన్ని నివారిస్తూ ద్వితీయోపదేశకాండ సూత్రంలోని సామాజిక-న్యాయ బలాన్ని నిలుపుతుంది.
