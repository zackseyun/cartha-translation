source:
  edition: WLC
  text: שָׁל֥וֹשׁ עָרִ֖ים תַּבְדִּ֣יל לָ֑/ךְ בְּ/ת֣וֹךְ אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు స్వాధీనం చేసుకోవడానికి ఇస్తున్న నీ దేశం లోపల మూడు పట్టణాలను నీ కొరకు వేరుగా నియమించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని వారసత్వంగా పొందడానికి.” భూమి అనుగ్రహ సందర్భాల్లో హీబ్రూ క్రియకు ‘స్వాధీనం చేసుకోవడం,’ ‘వారసత్వంగా పొందడం’ అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: మూడు పట్టణాలు
  rationale: עִיר నగరాన్ని లేదా పట్టణాన్ని సూచించగలదు. ఆశ్రయ పట్టణాల న్యాయసంబంధ సందర్భంలో ‘పట్టణాలు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: תַּבְדִּיל
  choice: ప్రత్యేకించాలి
  rationale: בדל హిఫీల్ రూపం వేరుచేయడం లేదా ఒక నిర్దిష్ట ప్రయోజనం కోసం ప్రత్యేకించడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ న్యాయపరమైన నియామక భావాన్నీ నిలుపుతుంది.
- source_word: לָךְ
  choice: నీ కోసం
  rationale: ప్రయోజనార్థక దాతువు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: నీ దేశంలో
  rationale: ‘నీ దేశం మధ్యలో/లోపల’ అనే స్థలార్థాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో అందిస్తుంది; తప్పనిసరిగా భౌగోళిక కేంద్రాన్నే సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నిబంధనాత్మక సంబోధనను నేరుగా నిలుపుతుంది.
- source_word: נֹתֵן לְךָ
  choice: నీకు ... ఇస్తున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్ దాన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ భూమి అనుగ్రహ సందర్భంలో స్వాధీనం చేసుకోవడం లేదా వారసత్వంగా పొందడం అనే అర్థాలు కలిగి ఉంది; ప్రధాన పాఠంలో స్పష్టమైన స్వాధీన భావాన్ని ఇస్తూ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: יהוה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం పేరు-బిరుదు భేదాన్ని కాపాడుతుంది.
- issue: ירשׁలోని భూస్వాధీనత–వారసత్వ భావసంభావ్యత
  choice: స్వాధీనం చేసుకోవడానికి
  alternative: దాన్ని వారసత్వంగా పొందడానికి
  rationale: ఈ సందర్భంలో దేవుడు ఇస్తున్న దేశాన్ని పొందడం ప్రధాన భావం. అయితే హీబ్రూ పదంలోని వారసత్వ భావాన్ని తొలగించకుండా పాదటిప్పణిలో సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి ధోరణిని కాపాడుతూ సరళమైన ఏకవచన సంబోధన వాడబడింది. ‘ప్రత్యేకించాలి’ ఆజ్ఞాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది; దైవనామం బిరుదుగా మార్చబడలేదు.
