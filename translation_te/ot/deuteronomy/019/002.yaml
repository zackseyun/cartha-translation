  to: నీ దేవుడైన యాహ్వే నీకు స్వాధీనం చేసుకోవడానికి ఇస్తున్న నీ దేశం లోపల మూడు పట్టణాలను నీ కొరకు వేరుగా నియమించాలి.[a]
  rationale: The revision aligns the transliteration of יהוה with the project’s “Yahweh” policy, clarifies the legal designation implied by תבדיל, and preserves the spatial force of בתוך. It retains the possess/inherit lexical ambiguity in the footnote.
