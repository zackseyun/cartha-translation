id: DEU.19.20
reference: Deuteronomy 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: te
  text: మిగిలినవారు[a] విని భయపడతారు; ఇకపై నీ మధ్య[c] ఇలాంటి దుష్కార్యం[b] చేయరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిగతావారు,’ ‘మిగిలి ఉన్నవారు.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: ‘ఈ చెడు విషయం వంటిది’; అంటే, ఈ రకమైన దుష్కార్యం.'
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘నీ’ ఏకవచనం; ఇశ్రాయేలును ఒక సమష్టిగా సంబోధిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: మిగిలినవారు
  rationale: నిఫాల్ వర్తమాన కృదంత రూపం శిక్ష అమలైన తరువాత మిగిలి ఉన్న ప్రజలను సూచిస్తుంది. ‘మిగిలినవారు’ సహజమైన ఆధునిక తెలుగు పదప్రయోగం.
- source_word: יִשְׁמְעוּ
  choice: విని
  rationale: שׁמע యొక్క ప్రాథమిక అర్థమైన ‘విను’ను నిలిపి ఉంచుతుంది. సందర్భం ద్వారా శిక్ష సంగతి వినడం అనే భావం స్పష్టమవుతుంది కాబట్టి అదనపు వివరణ చేర్చలేదు.
- source_word: וְיִרָאוּ
  choice: భయపడతారు
  rationale: ఇక్కడ శిక్షను గురించి వినడం వల్ల కలిగే భయం, తద్వారా కలిగే నిరోధక ప్రభావం ఉద్దేశించబడింది. ‘భయపడతారు’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: ఇకపై ... చేయరు
  rationale: יסף తో కూడిన క్రియారూపం ‘మళ్లీ చేయకపోవడం’ లేదా ‘ఇక కొనసాగించకపోవడం’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘ఇకపై ... చేయరు’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ఇలాంటి దుష్కార్యం
  rationale: כ ఉపసర్గలోని ‘ఇలాంటిది/వంటిది’ అనే పోలికను ‘ఇలాంటి’ నిలుపుతుంది; సందర్భంలో דָּבָר ఒక చెడు చర్యను సూచిస్తున్నందున ‘దుష్కార్యం’ సరైనది.
- source_word: בְּקִרְבֶּךָ
  choice: నీ మధ్య
  rationale: సమాజం లోపల లేదా ప్రజల మధ్య అనే న్యాయపరమైన భావాన్ని నిలుపుతూ, రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీ’గా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: בְּקִרְבֶּךָ లోని వచనం మరియు సంబోధితుడు
  choice: ఇశ్రాయేలును సమష్టిగా సంబోధించే ఏకవచనాన్ని ‘నీ మధ్య’గా నిలుపడం
  alternative: తెలుగులో బహువచనంగా ‘మీ మధ్య’ అని అనువదించడం
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనంలో ఉండి, ఇశ్రాయేలును ఒక సమష్టిగా సంబోధిస్తుంది. ‘నీ మధ్య’ ఆ నిబంధనాత్మక సమష్టి సంబోధనను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన న్యాయపరమైన ధోరణి ఉంచబడింది. ‘దుష్కార్యం’ సందర్భంలోని చెడు న్యాయచర్యను స్పష్టంగా తెలియజేస్తుంది; ‘నీ మధ్య’ మూలంలోని సమష్టి ఏకవచనాన్ని కాపాడుతుంది.
