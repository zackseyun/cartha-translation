  terminology: “దుష్కార్యం” సందర్భంలోని చెడు చర్యను స్పష్టంగా సూచిస్తుంది; అది మూలంలోని దావార్‌ను అనవసరంగా విస్తరించదు. “నీ మధ్య” హీబ్రూ ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది, మరియు సంబంధిత గమనిక సమష్టి ఇశ్రాయేలు సంబోధనను స్పష్టం చేస్తుంది.
