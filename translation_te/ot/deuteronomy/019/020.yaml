  source_fidelity: 'హీబ్రూ వాక్యంలోని అన్ని ప్రధాన అంశాలు సరిగ్గా ప్రతిబింబించబడ్డాయి: הַנִּשְׁאָרִים కు “మిగిలినవారు,” יִשְׁמְעוּ וְיִרָאוּ కు “విని భయపడతారు,” మరియు לֹא יֹסִפוּ ... עוֹד కు “ఇకపై ... చేయరు” తగిన అనువాదాలు. כַּדָּבָר הָרָע הַזֶּה లోని పోలిక భావం “ఇలాంటి”లో నిలిచింది; בְּקִרְבֶּךָ లోని సమష్టి-ఏకవచన సంబోధన కూడా నిలుపబడింది.'
