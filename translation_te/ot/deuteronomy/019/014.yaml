source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీవు స్వాధీనం చేసుకోవడానికి నీకు ఇస్తున్న దేశంలో నీవు వారసత్వంగా పొందబోయే స్వాస్థ్యంలో, పూర్వతరాలు నిర్ణయించిన నీ పొరుగువాని సరిహద్దు గుర్తును[a] నీవు జరపకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సరిహద్దు రాయి.’ హీబ్రూ పదం సరిహద్దును లేదా దానిని సూచించే గుర్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: జరపకూడదు
  rationale: హిఫీల్ రూపం ఇక్కడ సరిహద్దును వెనక్కి జరిపి ఇతరుని భూమిని ఆక్రమించడాన్ని సూచిస్తుంది. ‘జరపకూడదు’ చర్యను సహజంగా తెలియజేస్తూ దిశను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: גְּבוּל
  choice: సరిహద్దు రాయి
  rationale: ఈ ఆస్తి-చట్ట సందర్భంలో కదిలించగల భౌతిక గుర్తు ద్వారా నిర్ణయించబడిన భూసరిహద్దు ఉద్దేశించబడింది. ఆధునిక తెలుగులో ‘సరిహద్దు రాయి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: רֵעֲךָ
  choice: నీ పొరుగువాని
  rationale: సమాజంలోని తోటి వ్యక్తిని, ప్రత్యేకంగా పక్కనున్న భూయజమానిని, ఈ సందర్భంలో ‘పొరుగువాడు’ సహజంగా సూచిస్తుంది.
- source_word: גָּבְלוּ
  choice: నిలిపిన
  rationale: సరిహద్దు గుర్తును స్థాపించడం లేదా సరిహద్దును నిర్ణయించడం అనే భావాన్ని ‘సరిహద్దు రాయిని నిలిపిన’ అనే ప్రయోగం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רִאשֹׁנִים
  choice: పూర్వీకులు
  rationale: ముందటి కాలంలో భూభాగాల సరిహద్దులను నిర్ణయించిన వారిని సూచిస్తుంది; ‘పూర్వీకులు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: בְּנַחֲלָתְךָ
  choice: నీవు వారసత్వంగా పొందబోయే భూభాగంలో
  rationale: నַחֲלָהలోని వారసత్వపు న్యాయ-నిబంధన భావాన్ని నిలుపుతూ, తెలుగులో అది భూకేటాయింపని స్పష్టం చేస్తుంది.
- source_word: תִּנְחַל
  choice: వారసత్వంగా పొందబోయే
  rationale: ఇశ్రాయేలు భవిష్యత్తులో పొందే స్వాస్థ్యాన్ని సూచించే అసంపూర్ణ క్రియాభావాన్ని సహజ తెలుగు భవిష్యత్ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ప్రత్యక్ష నామరూపంగా ఉంచుతుంది.
- source_word: נֹתֵן לְךָ
  choice: నీకు ఇస్తున్న
  rationale: హీబ్రూ కృదంతం సూచించే కొనసాగుతున్న లేదా లక్షణాత్మక దానక్రియను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: దేశాన్ని కేవలం పొందడం మాత్రమే కాక దానిని స్వాధీనపరచుకొని కలిగి ఉండడం అనే ירשׁ భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా నామరూపంగానే ఉంచాం. తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘వారసత్వం,’ ‘స్వాధీనం’ అనే పదాలతో నిబంధనాత్మక భూస్వాస్థ్య భావాన్ని నిలిపాం; మూలంలోని పునరుక్తిని పూర్తిగా తొలగించకుండా తెలుగులో చదవదగిన విధంగా అమర్చాం.
