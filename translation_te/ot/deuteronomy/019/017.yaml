  rationale: సవరణ అర్థాన్ని మార్చకుండా, ‘ఆ రోజుల్లో’ అనే సంబంధవాక్యం యాజకులకూ న్యాయాధిపతులకూ వర్తిస్తుందని స్పష్టపరుస్తుంది. పాదటిప్పణి b కూడా మూలంలోని సాధారణ ‘ఉండే వారు’ భావానికీ సందర్భానుగుణమైన ‘పదవిలో/సేవలో ఉన్న వారు’ భావానికీ మధ్య తేడాను సరిగా భద్రపరుస్తుంది.
