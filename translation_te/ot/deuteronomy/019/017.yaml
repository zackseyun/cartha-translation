    rationale: హీబ్రూ సంబంధవాక్యం ‘యాజకులు మరియు న్యాయాధిపతులు’ అనే ఉభయ సమన్విత పదబంధాన్ని విశేషిస్తుంది. తెలుగులో విశేషణాన్ని సమన్విత నామపదాల ముందు ఉంచడం ద్వారా ఈ పరిధిని స్పష్టం చేయాలి.
