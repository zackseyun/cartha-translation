  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָמְד֧וּ שְׁנֵֽי הָ/אֲנָשִׁ֛ים אֲשֶׁר לָ/הֶ֥ם הָ/רִ֖יב לִ/פְנֵ֣י יְהוָ֑ה לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ וְ/הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר יִהְי֖וּ בַּ/יָּמִ֥ים הָ/הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: te
  text: అప్పుడు, వివాదం ఉన్న ఆ ఇద్దరు మనుషులు[a] యహ్వే సన్నిధిలో, ఆ రోజుల్లో పదవిలో ఉన్న యాజకులూ న్యాయాధిపతులూ సమక్షంలో[b] నిలబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం పదశః, “వివాదం ఎవరిదో ఆ ఇద్దరు మనుషులు”; “కేసు ఉన్న ఆ ఇద్దరు మనుషులు” లేదా “ఎవరి మధ్య వివాదం ఉందో ఆ ఇద్దరు మనుషులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం పదశః, “ఆ రోజుల్లో ఉండే వారు”; “ఆ రోజుల్లో సేవలో ఉన్న వారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: అప్పుడు ... నిలబడాలి
  rationale: వావ్‌తో కూడిన క్రియ న్యాయ ప్రక్రియలో తదుపరి దశను సూచిస్తుంది. ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘నిలబడాలి’ విధిని, అధికారిక సందర్భాన్ని నిలుపుతుంది.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ఆ ఇద్దరు మనుషులు
  rationale: హీబ్రూ పాఠం సంఖ్యను, పుంలింగ బహువచనాన్ని స్పష్టంగా పేర్కొంటుంది. న్యాయపరమైన ‘పక్షాలు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలరూపానికి దగ్గరగా అనువదించబడింది.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: వివాదంలో ఉన్న
  rationale: רִיב అంటే వివాదం, వాదవివాదం లేదా న్యాయవ్యవహారం. ప్రధాన పాఠంలో సహజమైన తెలుగు వాడుతూ, హీబ్రూ నిర్మాణంలోని ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఉంచాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అధికారికంగా ఒకరి సమక్షంలో నిలబడటాన్ని సూచిస్తుంది. יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: యాజకుల ఎదుటా న్యాయాధిపతుల ఎదుటా
  rationale: మూలంలోని యాజకులు, న్యాయాధిపతులు అనే రెండు అధికార వర్గాలను స్పష్టంగా ఉంచి, לִפְנֵי భావాన్ని తెలుగులో సహజంగా రెండింటికీ వర్తింపజేశాం.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో బాధ్యతలో ఉన్న
  rationale: పదశః ‘ఆ రోజుల్లో ఉండే’ అనే భావం అప్పటి అధికార బాధ్యత నిర్వహిస్తున్న వారిని సందర్భానుసారంగా సూచిస్తుంది. ‘బాధ్యతలో ఉన్న’ సహజమైన న్యాయపరమైన తెలుగు; పదశః రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా సాధారణమైన ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని ఇచ్చాం.
- issue: ‘యహ్వే సన్నిధిలో’ మరియు మానవ అధికారుల ఎదుట నిలబడటం మధ్య సంబంధం
  choice: రెండు పదబంధాలనూ వరుసగా ఉంచడం
  alternative: యాజకులు, న్యాయాధిపతుల ఎదుట నిలబడటమే యహ్వే సన్నిధిలో నిలబడటం అని వివరణాత్మకంగా కలపడం
  rationale: మూలం ఈ సంబంధాన్ని వివరించకుండా రెండు לִפְנֵי పదబంధాలను పక్కపక్కనే ఉంచుతుంది. అందువల్ల వాటి న్యాయ-దైవశాస్త్ర సంబంధాన్ని అనువాదంలో అదనంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ‘పదవిలో’ కంటే కొద్దిగా విస్తృతమైన ‘బాధ్యతలో’ను ఎంచుకున్నాం; మూలంలోని పదశః అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
