id: DEU.19.4
reference: Deuteronomy 19:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: te
  text: 'అక్కడికి పారిపోయి ప్రాణాలతో ఉండగల, ఒకరి మరణానికి కారణమైన వ్యక్తి విషయంలో వర్తించే నియమం ఇదే: అతడు తన తోటి వ్యక్తిని తెలియక కొట్టి, అంతకుముందు[a] అతనిని ద్వేషించనివాడై ఉంటే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్న, మొన్న.” ఇది “ఇంతకుముందు” లేదా “ముందునుంచి” అనే భావమిచ్చే హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הָרֹצֵחַ
  choice: ఒకరిని చంపిన వ్యక్తికి వర్తించే నియమం
  rationale: న్యాయ సందర్భంలో דְּבַר అనేది ఆ వ్యక్తి విషయంలో వర్తించే నియమాన్ని సూచిస్తుంది. הָרֹצֵחַ ఇక్కడ తప్పనిసరిగా ఉద్దేశపూర్వక హంతకుణ్ణి సూచించదు; అందువల్ల అపరాధభావాన్ని ముందుగానే మోపగల ‘హంతకుడు’ కంటే ‘ఒకరిని చంపిన వ్యక్తి’ తటస్థంగా ఉంది.
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: అక్కడికి పారిపోయి ప్రాణాలతో ఉండగల
  rationale: ఈ రూపం ఆశ్రయపట్టణానికి పారిపోయే అర్హతగల వ్యక్తిని నిర్వచించి, ఆ పారిపోవడం వల్ల అతడు బ్రతకడాన్ని తెలియజేస్తుంది.
- source_word: יַכֶּה אֶת־רֵעֵהוּ
  choice: తన పొరుగువాణ్ణి ... కొట్టి
  rationale: נכה యొక్క ప్రాథమిక అర్థమైన ‘కొట్టు’ను నిలుపుతుంది; మరణం సంభవించిన సంగతి ‘ఒకరిని చంపిన వ్యక్తి’ అనే సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: בִּבְלִי דַעַת
  choice: ఉద్దేశం లేకుండా
  rationale: అక్షరార్థంగా ‘జ్ఞానం లేకుండా’; ఈ న్యాయ సందర్భంలో ముందస్తు ఉద్దేశం లేదా తెలిసి చేయడం లేనిదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: అతనిని ద్వేషించనివాడు
  rationale: మరణానికి ముందు కొనసాగిన శత్రుభావం లేదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: అంతకుముందు
  rationale: ‘నిన్నటి నుంచీ మొన్నటి నుంచీ’ అనే హీబ్రూ కాలసూచక నానుడి భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; అక్షర రూపం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: మరణం కలిగించిన వ్యక్తి యొక్క నైతిక దోషాన్ని ముందుగానే నిర్ణయించడం
  choice: ‘ఒకరిని చంపిన వ్యక్తి’ అనే తటస్థ పదబంధం
  alternative: ‘హంతకుడు’ లేదా ‘నరహంతకుడు’
  rationale: ఈ వచనం ఉద్దేశం లేకుండా మరణం కలిగించిన వ్యక్తిని నిర్వచిస్తోంది. కాబట్టి ఉద్దేశపూర్వక హత్య అనే భావాన్ని పదంలోనే చేర్చకుండా న్యాయపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘హంతకుడు’ వల్ల కలగగల ఉద్దేశపూర్వక హత్య భావాన్ని నివారించేందుకు వివరణాత్మకమైన తటస్థ పదబంధాన్ని ఎంచుకున్నాం.
