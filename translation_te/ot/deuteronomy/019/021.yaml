source:
  edition: WLC
  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: te
  text: 'నీ కన్ను కనికరించకూడదు: ప్రాణానికి ప్రాణం[a], కంటికి కన్ను, పంటికి పన్ను, చేతికి చెయ్యి, పాదానికి పాదం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అని అనువదించిన హీబ్రూ పదం נֶפֶשׁ; ఇక్కడ అది తరువాతి దైవశాస్త్రీయ అర్థంలోని ‘ఆత్మ’ను ప్రత్యేకంగా సూచించకుండా, జీవప్రాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: కనికరించకూడదు
  rationale: חוס అంటే కనికరించడం లేదా విడిచిపెట్టడం. న్యాయసంబంధ సందర్భంలో నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, మూలంలోని కఠినతను నిలుపుతుంది.
- source_word: עֵינֶךָ
  choice: నీ కన్ను
  rationale: హీబ్రూ వాక్యంలో ‘నీ కన్ను’ అనే స్పష్టమైన రూపకమే కర్తగా ఉంది. దాన్ని నిలుపడం మూలభాషలోని కనికరానికి సంబంధించిన నుడికారాన్ని కాపాడుతుంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: נֶפֶשׁ בְּנֶפֶשׁ అనే న్యాయసూత్రంలో ఇది తరువాతి తాత్త్విక అర్థంలోని ‘ఆత్మ’ను కాక, జీవప్రాణాన్ని సూచిస్తుంది.
- source_word: בְּ
  choice: -కి
  rationale: ప్రతి జంటలో בְּ సమాన ప్రతిఫలాన్ని లేదా ప్రతికారాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రాణానికి ప్రాణం, కంటికి కన్ను’ అనే రూపం సంక్షిప్తంగా, సహజంగా ఆ న్యాయసూత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַיִן
  choice: కన్ను
  rationale: చట్టపరమైన ప్రతికార సూత్రంలోని ప్రత్యక్ష శరీరభాగ పదం; భావానువాదం అవసరం లేదు.
- source_word: שֵׁן
  choice: పన్ను
  rationale: మూలంలోని ప్రత్యక్ష శరీరభాగ పదానికి ఖచ్చితమైన తెలుగు సమానం.
- source_word: יָד
  choice: చెయ్యి
  rationale: ఆధునిక సాధారణ తెలుగులో సహజంగా అర్థమయ్యే శరీరభాగ పదం; హీబ్రూ יָדకు సరిపోతుంది.
- source_word: רֶגֶל
  choice: పాదం
  rationale: ఈ న్యాయసూత్రంలో శరీరభాగాన్ని ఖచ్చితంగా సూచిస్తూ, గంభీరమైన వచనశైలికి సరిపోతుంది.
theological_decisions:
- issue: నిర్దిష్ట న్యాయప్రతికార సూత్రాన్ని యథాతథంగా ఉంచాలా, లేక దాన్ని అనుపాత న్యాయం అనే సాధారణ సూత్రంగా మార్చాలా
  choice: ‘ప్రాణానికి ప్రాణం, కంటికి కన్ను, పంటికి పన్ను, చేతికి చెయ్యి, పాదానికి పాదం’ అనే నిర్దిష్ట రూపాన్ని నిలుపడం.
  alternative: ‘నేరానికి తగిన శిక్ష విధించాలి’ అని భావానువాదం చేయడం.
  rationale: హీబ్రూ పాఠం స్థిరమైన, స్పష్టమైన న్యాయసూత్రాన్ని శరీరభాగాల వరుసతో ఇస్తుంది. సాధారణీకరించడం దాని వాక్చాతుర్యాన్ని, తోరాలోని ఇతర వచనాలతో గల సంబంధాన్ని, అలాగే దానిలోని నైతిక-దైవశాస్త్రీయ ఉద్రిక్తతను కప్పివేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన న్యాయవాక్య శైలి. ‘నీ కన్ను’ అనే హీబ్రూ నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపి, స్థిరమైన ప్రతికార సూత్రంలోని లయను కాపాడాం.
