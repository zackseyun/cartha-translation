  edition: WLC
  text: לֹא תָח֥וֹס עֵֽינְ/ךָ֖ עָלָ֑י/ו וּ/בִֽעַרְתָּ֧ דַֽם הַ/נָּקִ֛י מִ/יִּשְׂרָאֵ֖ל וְ/ט֥וֹב לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: te
  text: అతనిపట్ల నీ కన్ను కనికరించకూడదు[a]. నీవు ఇశ్రాయేలు నుండి నిర్దోషి రక్తదోషాన్ని తొలగించాలి[b]. అప్పుడు నీకు మేలు కలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కన్ను అతనిని విడిచిపెట్టకూడదు.” హీబ్రూ నుడికారం కన్నును జాలి లేదా కనికరానికి స్థానంగా పేర్కొంటుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, నిర్దోషి రక్తాన్ని చిందించడం వల్ల ఇశ్రాయేలు సమాజంపై వచ్చిన రక్తదోషాన్ని తొలగించాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: అతని మీద నీ కన్ను జాలి చూపకూడదు
  rationale: חוס עין అనే హీబ్రూ నుడికారం కన్నును జాలి లేదా కనికరానికి స్థానంగా చిత్రిస్తుంది. తెలుగు వాక్యంలో ‘నీ కన్ను’ అనే మూల చిత్రాన్ని నిలిపి, భావాన్ని సహజంగా తెలియజేయడానికి ‘జాలి చూపకూడదు’ అని అనువదించాం.
- source_word: וּבִעַרְתָּ
  choice: తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసంబంధ సందర్భాల్లో בער సాధారణంగా సమాజం మధ్యనుండి చెడును లేదా దోషాన్ని నిర్మూలించడాన్ని సూచిస్తుంది; ఇక్కడ అక్షరార్థమైన కాల్చివేయడం ఉద్దేశం కాదు.
- source_word: דַם הַנָּקִי
  choice: నిర్దోషి రక్తపాత దోషం
  rationale: అక్షరార్థంగా ‘నిర్దోషి రక్తం’ అయినప్పటికీ, ఈ సందర్భంలో నిర్దోషి రక్తం చిందించడం వల్ల సమాజంపై వచ్చిన రక్తదోషం ఉద్దేశించబడింది. తెలుగు పాఠకునికి ఉద్దేశం స్పష్టమయ్యేలా, మూల న్యాయపరమైన భావాన్ని కాపాడుతూ ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులో నుండి
  rationale: מן విభక్తి ఇశ్రాయేలు సమాజం మధ్యనుండి దోషాన్ని తొలగించడాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలులో నుండి’ ఆ సామూహిక పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטוֹב לָךְ
  choice: అప్పుడు నీకు మేలు కలుగుతుంది
  rationale: ఇది విధేయత ఫలితంగా కలిగే మేలును తెలిపే ద్వితీయోపదేశకాండపు సాధారణ నిబంధనాత్మక సూత్రం. ‘అప్పుడు’ ఫలిత సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: హంతకునిపై శిక్ష అమలు చేయాలనే ఆజ్ఞ స్వభావం
  choice: వ్యక్తిగత ప్రతీకారంగా కాక, న్యాయపరమైన ప్రక్రియ ద్వారా నిర్దోషి రక్తపాత దోషాన్ని సమాజం నుండి తొలగించాలనే ఆజ్ఞగా అనువదించాం.
  alternative: ఈ మాటలను వ్యక్తిగత పగతీర్చుకోవడానికి అనుమతిగా తప్పుగా అర్థం చేసుకోవచ్చు.
  rationale: ద్వితీయోపదేశకాండము 19:11–12 సందర్భం ఉద్దేశపూర్వక హంతకుని న్యాయపరమైన విచారణ, అప్పగింత గురించి చెబుతుంది. ప్రధాన పాఠ్యంలో సందర్భానికి మించిన వివరణను చేర్చకుండా, ‘రక్తపాత దోషం’ మరియు ‘తొలగించాలి’ అనే పదాలు సామూహిక న్యాయబాధ్యతను తెలియజేస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయపరమైన శైలిని ఉపయోగించాం. ‘నీ కన్ను’ అనే హీబ్రూ చిత్రాన్ని నిలిపి, ‘జాలి చూపకూడదు’తో దాని భావాన్ని సులభంగా గ్రహించగలిగేలా చేశాం. వాక్యాలను సంక్షిప్తంగా ఉంచి సాధారణ పాఠకునికి స్పష్టత కలిగించాం.
