source:
  edition: WLC
  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: te
  text: ఒక్క సాక్షి ఏ పురుషునికి వ్యతిరేకంగా ఏ దోషం గురించిగానీ, ఏ పాపం గురించిగానీ, అతడు చేసే ఏ పాపం గురించిగానీ సాక్ష్యంగా నిలవకూడదు. ఇద్దరు సాక్షుల సాక్ష్యం ఆధారంగానీ, ముగ్గురు సాక్షుల సాక్ష్యం ఆధారంగానీ ఒక విషయం నిలవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇద్దరు సాక్షుల నోటి మీదగానీ, ముగ్గురు సాక్షుల నోటి మీదగానీ.’ హెబ్రీ న్యాయనుడికారంలో ఇది వారి సాక్ష్యం ఆధారంగా ఒక విషయం న్యాయపరంగా స్థిరపడడాన్ని సూచిస్తుంది. ‘నిలవాలి’ అనే క్రియ మొదటి భాగంలోని ‘నిలవకూడదు’కు అనుగుణంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: నిలవకూడదు ... నిలవాలి
  rationale: קום అనే క్రియకు న్యాయ సందర్భంలో సాక్ష్యం లేదా విషయం చెల్లుబాటు కావడం, స్థిరపడడం అనే భావం ఉంది. ‘నిలవడం’ మూలంలోని రూపకాన్ని, వాక్యంలోని పునరుక్తిని రెండింటినీ కాపాడుతుంది.
- source_word: עֵד אֶחָד
  choice: ఒక్క సాక్షి
  rationale: ఒంటరి సాక్ష్యం సరిపోదనే న్యాయ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאִישׁ
  choice: ఏ పురుషునికైనా వ్యతిరేకంగా
  rationale: ఈ న్యాయ సందర్భంలో בְּ అనేది ఒక వ్యక్తికి వ్యతిరేకంగా సాక్ష్యం చెప్పడాన్ని సూచిస్తుంది. אִישׁ లోని పుంలింగ ఏకవచన రూపాన్ని ‘పురుషుడు’గా నిలిపి, לְכָל తో కూడిన సమగ్ర పరిధిని తెలుగులో ‘ఏ...అయినా’ ద్వారా వ్యక్తం చేశాం.
- source_word: לְכָל עָוֺן
  choice: చేసిన ఏ దోషం విషయంలోనైనా
  rationale: עָוֺן లోని నైతిక-న్యాయపరమైన తప్పు లేదా అపరాధ భావాన్ని ‘దోషం’ సహజంగా అందిస్తుంది; తరువాతి పాపపదం నుంచి దీనిని వేరుగా ఉంచుతుంది.
- source_word: וּלְכָל חַטָּאת בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: ఏ పాపం విషయంలోనైనా
  rationale: חַטָּאת, חֵטְא, חטא పదసమూహం పాపం మరియు అతడు చేసిన పాపం అనే సమగ్ర పరిధిని బలపరుస్తుంది. తెలుగులో అసహజమైన త్రిపుట పునరుక్తిని నివారిస్తూ ‘అతడు చేసిన’ను దోషం, పాపం రెండింటికీ వర్తించేలా ఉంచాం.
- source_word: עַל פִּי
  choice: నోటి మాటపై
  rationale: అక్షరార్థంగా ‘నోటి మీద’ అనే హెబ్రీ న్యాయ నుడికారాన్ని తెలుగు పాఠకుడికి అర్థమయ్యే ‘నోటి మాటపై’గా ఇచ్చాం; ఇది మౌఖిక సాక్ష్యాధార భావాన్ని నిలుపుతుంది.
- source_word: דָּבָר
  choice: ఒక విషయం
  rationale: న్యాయ విచారణలోని విషయం, వ్యవహారం లేదా కేసు అనే విస్తృత భావాన్ని ‘విషయం’ కాపాడుతుంది.
theological_decisions:
- issue: אִישׁ లోని ప్రాతినిధ్య పుంలింగ భాష
  choice: ఏ పురుషునికైనా
  alternative: ఎవరికైనా / ఏ వ్యక్తికైనా
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. ఇది న్యాయ సూత్రం వర్తించే పరిధిని అనవసరంగా పరిమితం చేయాలనే ఉద్దేశంతో కాదు; మూలరూపాన్ని ప్రతిబింబించడానికే.
- issue: יָקוּם యొక్క న్యాయపరమైన భావం
  choice: నిలవకూడదు ... నిలవాలి
  alternative: చెల్లకూడదు ... స్థిరపడాలి / నిర్ధారించబడాలి
  rationale: ఒకే హెబ్రీ క్రియ రెండు అర్ధభాగాల్లో పునరావృతమై న్యాయ సమాంతరాన్ని సృష్టిస్తుంది. ప్రధాన పాఠ్యంలో అదే తెలుగు క్రియను పునరావృతం చేసి ఆ నిర్మాణాన్ని కాపాడాం; దాని భావం సాక్ష్యం లేదా విషయం న్యాయపరంగా చెల్లుబాటు కావడం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. మూలంలోని ‘నిలవడం’ అనే క్రియాపునరుక్తిని, ‘నోటి మాటపై’ అనే రూపక నుడికారాన్ని నిలిపి, పాపపదాల సాంద్రత తెలుగులో అర్థవంతంగా వినిపించేలా వాక్య నిర్మాణాన్ని సర్దాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
