revisions:
- from: ఒక్క సాక్షి ఏ పురుషునికైనా వ్యతిరేకంగా, అతడు చేసిన ఏ దోషం విషయంలోనైనా, ఏ పాపం విషయంలోనైనా నిలవకూడదు. ఇద్దరు సాక్షుల నోటి మాటపై గానీ, ముగ్గురు సాక్షుల నోటి మాటపై గానీ ఒక విషయం నిలవాలి.[a]
  to: ఒక్క సాక్షి ఏ పురుషునికి వ్యతిరేకంగా ఏ దోషం గురించిగానీ, ఏ పాపం గురించిగానీ, అతడు చేసే ఏ పాపం గురించిగానీ సాక్ష్యంగా నిలవకూడదు. ఇద్దరు సాక్షుల సాక్ష్యం ఆధారంగానీ, ముగ్గురు సాక్షుల సాక్ష్యం ఆధారంగానీ ఒక విషయం నిలవాలి.[a]
  rationale: సవరణలో మూలంలోని మూడు పాప/దోష పదబంధాలన్నింటినీ స్పష్టంగా ప్రతిబింబించాం. కום క్రియ యొక్క పునరుక్తిని ‘నిలవకూడదు ... నిలవాలి’గా నిలిపాం. עַל־פִּי యొక్క సహజ న్యాయార్థాన్ని ప్రధాన పాఠ్యంలో ‘సాక్ష్యం ఆధారంగా’గా ఇచ్చి, దాని అక్షరార్థ నుడికారాన్ని పాదటిప్పణిలో చేర్చాం.
