    rationale: ‘దురుద్దేశంతో సాక్ష్యం చెప్పేవాడు ... సాక్ష్యం చెబితే’లో సాక్షి అనే పాత్ర, అతని చర్య రెండుసార్లు వ్యక్తమవుతున్నాయి. మూలంలో షరతు ప్రధానంగా ‘సాక్షి లేస్తే/ముందుకు వస్తే’ అనే యాకుం క్రియతో మొదలవుతుంది; సాక్ష్య ఉద్దేశం దానికి అనుబంధంగా ఉంది.
