source:
  edition: WLC
  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: te
  text: ఒక మనిషి తిరుగుబాటు చేశాడని అతనికి వ్యతిరేకంగా సాక్ష్యం చెప్పడానికి దురుద్దేశపూర్వక సాక్షి లేస్తే,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబద్ధ సాక్షి.’ హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘హింసకు/అన్యాయానికి చెందిన సాక్షి’ అని ఉంది; న్యాయస్థాన సందర్భంలో ఇది దురుద్దేశంతో లేదా అబద్ధంగా నింద మోపే వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ద్రోహం చేశాడని,’ ‘తీవ్రంగా దారి తప్పాడని.’ ఈ హీబ్రూ పదం తిరుగుబాటు, తీవ్రమైన విచలనం లేదా మతత్యాగాన్ని కూడా సూచించవచ్చు; ఈ న్యాయ సందర్భంలో దాని ఖచ్చిత పరిధి స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: చెబితే
  rationale: ఇక్కడ כִּי న్యాయసూత్రంలోని షరతును పరిచయం చేస్తుంది; తెలుగులో ‘చెబితే’ అనే షరతార్థక క్రియారూపం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יָקוּם
  choice: లేచి
  rationale: సాక్షిగా ముందుకు రావడం లేదా నిలబడడం అనే న్యాయపరమైన భావంతో పాటు మూలంలోని స్పష్టమైన క్రియాచిత్రాన్ని కూడా నిలుపుతుంది.
- source_word: עֵד חָמָס
  choice: దురుద్దేశంతో సాక్ష్యం చెప్పేవాడు
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘హింస/అన్యాయపు సాక్షి’ అనే భావం ఉంది. న్యాయస్థాన సందర్భంలో అన్యాయమైన లేదా హానికరమైన ఉద్దేశంతో సాక్ష్యం ఇచ్చే వ్యక్తిని సహజమైన ఆధునిక తెలుగులో ఇది తెలియజేస్తుంది.
- source_word: בְּאִישׁ
  choice: ఒక మనిషికి వ్యతిరేకంగా
  rationale: בְּ ఇక్కడ సాక్ష్యం ఎవరిని లక్ష్యంగా చేసిందో సూచిస్తుంది; אִישׁ యొక్క ఏకవచన పురుష రూపాన్ని ‘ఒక మనిషి’గా నిలిపాం.
- source_word: לַעֲנוֹת
  choice: సాక్ష్యం చెప్పేవాడు / సాక్ష్యం చెబితే
  rationale: ענה అనే క్రియకు సాధారణంగా ‘జవాబివ్వడం’ అనే అర్థం ఉన్నా, ఈ న్యాయపరమైన సందర్భంలో ‘సాక్ష్యం చెప్పడం’ సరైన భావం.
- source_word: בּוֹ
  choice: అతడు … చేశాడని
  rationale: ఆరోపణ ఆ మనిషికి వ్యతిరేకంగా ఉందనే సంబంధాన్ని తెలుగులో సహజమైన పరోక్ష వాక్య నిర్మాణం ద్వారా వ్యక్తం చేశాం.
- source_word: סָרָה
  choice: తిరుగుబాటు
  rationale: సాధారణ తప్పుకన్నా తీవ్రమైన దారి మళ్లడం, ధిక్కారం లేదా ద్రోహం అనే భావాన్ని ఈ పదం సూచించగలదు. నిర్దిష్టంగా మతత్యాగం అనే భావాన్ని రుద్దకుండా ‘తిరుగుబాటు’ మూలపద బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: న్యాయసూత్రంలోని ప్రాతినిధ్య పురుష ఏకవచనం
  choice: ఒక మనిషికి వ్యతిరేకంగా
  alternative: ఒక వ్యక్తికి వ్యతిరేకంగా
  rationale: మూలంలోని אִישׁ ఏకవచన పురుష రూపాన్ని నిలిపి, ఇది ఒక ఉదాహరణాత్మక న్యాయసూత్రమనే స్వభావాన్ని సంరక్షించాం.
- issue: סָרָה యొక్క ఆరోపణ స్వభావం
  choice: తిరుగుబాటు
  alternative: తప్పు / ద్రోహం / మతత్యాగం
  rationale: ఈ పదం తీవ్రమైన దారి మళ్లడం లేదా ధిక్కారాన్ని సూచిస్తుంది. సందర్భం ఒక్కటే దానిని ప్రత్యేకంగా మతత్యాగంగా నిర్ధారించదు కాబట్టి ఆ సిద్ధాంతార్థాన్ని ప్రధాన పాఠ్యంలో రుద్దలేదు; భావ విస్తృతిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘దురుద్దేశంతో సాక్ష్యం చెప్పేవాడు’ కొద్దిగా వివరణాత్మకమైనప్పటికీ ‘హింస/అన్యాయపు సాక్షి’ అనే అసహజ అక్షరానువాదాన్ని నివారిస్తుంది. వాక్యం తరువాతి వచనాలతో కొనసాగే షరతార్థక నిర్మాణం కావడంతో చివర కామా ఉంచాం.
