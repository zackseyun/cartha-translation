source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: te
  text: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న ఈ ఆజ్ఞనంతటినీ[a] నీవు పాటించి ఆచరిస్తే—నీ దేవుడైన యహ్వేను ప్రేమించడానికి, ఆయన మార్గాల్లో ఎల్లప్పుడూ నడవడానికి—ఈ మూడు పట్టణాలకు అదనంగా మరో మూడు పట్టణాలను చేర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘ఆజ్ఞ’ ఏకవచనంలో ఉంది; దాని సమగ్రతను చూపడానికి ‘ఈ ఆజ్ఞనంతటినీ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: చేస్తే
  rationale: ఇక్కడ כִּי కారణాన్ని కాక షరతును పరిచయం చేస్తుంది; అందువల్ల తెలుగులో షరతార్థకమైన ‘చేస్తే’ సహజంగా ఉంటుంది.
- source_word: תִשְׁמֹר ... לַעֲשֹׂתָהּ
  choice: పాటించి ఆచరిస్తే
  rationale: శాసన సందర్భంలో שׁמר ఆజ్ఞను పాటించడాన్ని, עשׂה దానిని కార్యరూపంలో ఆచరించడాన్ని సూచిస్తాయి; రెండు భావాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ఈ ఆజ్ఞనంతటినీ
  rationale: మూలంలోని ఏకవచనమైన ‘ఆజ్ఞ’ను నిలుపుతూ, כָּל తెలిపే సమగ్రతను ‘అంతటినీ’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: మోషే ప్రస్తుతం చేస్తున్న ఆజ్ఞాపన అనే participial భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యహ్వేను ప్రేమిస్తూ
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా ఉంచి, ఆజ్ఞ యొక్క విషయాన్ని కొనసాగుతున్న నిబద్ధతగా తెలియజేస్తుంది.
- source_word: וְלָלֶכֶת בִּדְרָכָיו כָּל הַיָּמִים
  choice: నీ జీవితకాలమంతా ఆయన మార్గాల్లో నడుస్తూ ఉంటే
  rationale: ‘మార్గాల్లో నడవడం’ అనే నిబంధనాత్మక రూపకాన్ని నిలుపుతూ, כָּל הַיָּמִים యొక్క జీవితాంత విధేయత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: నీ కోసం మరో మూడు పట్టణాలను చేర్చుకోవాలి
  rationale: יסף యొక్క ‘అదనంగా చేర్చు’ భావాన్ని, לְךָ యొక్క ప్రయోజనార్థాన్ని, శాసన సందర్భంలోని ఆదేశ స్వరాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: ఈ మూడు పట్టణాలకు తోడుగా
  rationale: ఇక్కడ עַל అదనపు భావంలో ఉంది; ముందుగా పేర్కొన్న మూడు పట్టణాలకు ఇవి అదనమని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామమైన יהוה నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ఆజ్ఞ ఏకవచనమా, బహువచనమా
  choice: ఈ ఆజ్ఞనంతటినీ
  alternative: ఈ ఆజ్ఞలన్నిటినీ
  rationale: హీబ్రూ הַמִּצְוָה ఏకవచనంలో ఉంది. సమగ్ర భావం ఉన్నప్పటికీ దానిని బహువచనంగా మార్చకుండా మూలంలోని ఉద్దేశపూర్వక ఏకవచనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. దీర్ఘమైన హీబ్రూ వాక్య నిర్మాణాన్ని పఠనసౌలభ్యం కోసం డాష్‌లతో విభజించినప్పటికీ షరతు, ఆజ్ఞ యొక్క విషయం, ఫలితం అనే క్రమం నిలుపబడింది.
