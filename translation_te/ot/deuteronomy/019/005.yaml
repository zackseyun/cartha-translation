id: DEU.19.5
reference: Deuteronomy 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: te
  text: అయితే ఒకడు తన తోటివానితో కలిసి కట్టెలు నరకడానికి అడవికి వెళ్లి, చెట్టును నరకడానికి అతని చెయ్యి గొడ్డలిని ఊపగా, గొడ్డలి ఇనుప తల చెక్క పిడినుంచి ఊడి[a] అతని తోటివానికి తగిలి, ఆ తోటివాడు చనిపోతే, ఆ వ్యక్తి ఈ పట్టణాల్లో ఒకదానికి పారిపోయి బతకవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇనుము చెక్కనుంచి ఊడిపోతే.” ఇక్కడ “ఇనుము” గొడ్డలి తలను, “చెక్క” దాని చెక్క పిడిని సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: అయితే ఒకడు … చనిపోతే
  rationale: ముందటి న్యాయనియమాన్ని కొనసాగిస్తూ ఒక షరతుతో కూడిన ఉదాహరణను పరిచయం చేస్తుంది. తెలుగులో ‘అయితే … చనిపోతే’ అనే నిర్మాణం ఆ షరతు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רֵעֵהוּ
  choice: తన తోటివాడు
  rationale: న్యాయ సందర్భంలో ఇది తప్పనిసరిగా సన్నిహిత మిత్రుణ్ణి లేదా పక్కింటివాణ్ణి మాత్రమే సూచించదు; మరొక సహవ్యక్తి అనే విస్తృత భావాన్ని ‘తోటివాడు’ నిలుపుతుంది.
- source_word: בַיַּעַר
  choice: అడవికి
  rationale: יַעַר అంటే చెట్లు దట్టంగా ఉండే అటవీ ప్రదేశం; ‘అడవి’ ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: לַחְטֹב עֵצִים
  choice: కట్టెలు నరకడానికి
  rationale: ఈ పదబంధం సాధారణంగా కట్టెలు కొట్టే పనిని సూచిస్తుంది. ‘కట్టెలు నరకడం’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: గొడ్డలిని ఊపినప్పుడు
  rationale: మూలంలో చేయి గొడ్డలితో బలంగా కదలడాన్ని తెలిపే నిర్మాణం ఉంది. తెలుగులో క్రియాత్మకంగా ‘గొడ్డలిని ఊపడం’ సందర్భంలోని చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִכְרֹת הָעֵץ
  choice: చెట్టును నరకడానికి
  rationale: כרת ఇక్కడ చెట్టును నరికే చర్యను సూచిస్తుంది; సాధారణ పాఠకునికి ‘చెట్టును నరకడం’ సూటిగా అర్థమవుతుంది.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  choice: గొడ్డలి ఇనుప తల చెక్క పిడినుంచి ఊడి
  rationale: ‘ఇనుము’ గొడ్డలి ఇనుప తలను, ‘చెక్క’ దాని పిడిని సందర్భానుసారంగా సూచిస్తున్నాయి. ప్రధాన పాఠ్యంలో ఉద్దేశించిన సంఘటనను స్పష్టంగా చెప్పి, మూలంలోని అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּמָצָא אֶת רֵעֵהוּ
  choice: అతని తోటివానికి తగిలి
  rationale: מצא అక్షరార్థంగా ‘చేరడం/కనుగొనడం’; ఎగిరివచ్చిన వస్తువు సందర్భంలో అది వ్యక్తిని తాకడాన్ని సూచిస్తుంది. ‘తగిలి’ ప్రమాదవశాత్తు జరిగిన దెబ్బను అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: וָמֵת
  choice: అతడు చనిపోతే
  rationale: చనిపోయేది తోటివాడేనని సర్వనామంతో స్పష్టం చేశాం; షరతు వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా కొనసాగించాం.
- source_word: הוּא יָנוּס אֶל אַחַת הֶעָרִים הָאֵלֶּה וָחָי
  choice: ఆ వ్యక్తి ఈ పట్టణాల్లో ఒకదానికి పారిపోయి బతకవచ్చు
  rationale: ఇది అనుకోకుండా చంపిన వ్యక్తికి కల్పించిన ఆశ్రయ అవకాశాన్ని సూచిస్తుంది. ‘బతకవచ్చు’ పారిపోవడం ద్వారా ప్రాణాలతో ఉండగల న్యాయపరమైన అవకాశాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఆశ్రయ పట్టణానికి పారిపోవడంలోని క్రియారూపం—ఆజ్ఞా, భవిష్యత్తు లేదా అనుమతి
  choice: పారిపోయి బతకవచ్చు
  alternative: పారిపోయి బతకాలి / పారిపోతాడు, బతుకుతాడు
  rationale: హీబ్రూ yiqtol రూపం ఈ న్యాయ సందర్భంలో రక్షణ పొందే అవకాశాన్ని ఇస్తుంది. దాన్ని కఠిన ఆజ్ఞగా లేదా ఖచ్చితమైన భవిష్యద్వాక్యంగా నిర్ణయించకుండా, అనుమతి-సామర్థ్య భావంతో అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. పొడవైన హీబ్రూ వాక్యంలోని సంఘటనల క్రమాన్ని తెలుగులో సహజంగా నిలిపాం.
