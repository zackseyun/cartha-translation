source:
  edition: WLC
  text: וְ/לֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּ/קֶ֣רֶב אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וְ/הָיָ֥ה עָלֶ֖י/ךָ דָּמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు స్వాస్థ్యంగా ఇస్తున్న నీ దేశం నడుమ నిర్దోషి రక్తం చిందించబడకుండా ఉండాలి; రక్తదోషం నీ మీద ఉంటుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “రక్తం నీ మీద ఉంటుంది.” ఇది నిర్దోషి రక్తం చిందించబడినందుకు కలిగే బాధ్యతను, అంటే రక్తదోషాన్ని, సూచించే హీబ్రూ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: చిందించబడకుండా
  rationale: שׁפך నిఫాల్ రూపం రక్తం ‘చిందించబడడం’ అనే కర్మణి భావాన్ని ఇస్తుంది; హత్యకు సంబంధించిన న్యాయ సందర్భంలో ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: דָּם נָקִי
  choice: నిర్దోషి రక్తం
  rationale: మరణశిక్షకు పాత్రుడు కాని వ్యక్తి రక్తాన్ని సూచించే సంక్షిప్త న్యాయ-నైతిక నుడికారాన్ని నిలుపుతుంది.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: నీ దేశం మధ్యలో
  rationale: קֶרֶב లోని ‘మధ్యలో/లోపల’ అనే స్థల భావాన్ని గంభీరమైన, సులభగ్రాహ్యమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: నీకు స్వాస్థ్యంగా ఇస్తున్న
  rationale: నֹתֵן లోని కొనసాగుతున్న వర్తమాన భావాన్నీ, נַחֲלָה లోని వారసత్వంగా పొందిన ఆస్తి భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: లేకపోతే రక్తదోషం నీ మీద ఉంటుంది
  rationale: దీని పదశః రూపం ‘రక్తం నీ మీద ఉంటుంది’; న్యాయ సందర్భంలో דָּמִים హత్య వల్ల కలిగే బాధ్యతను సూచిస్తుంది. ‘లేకపోతే’ ముందున్న నిరోధక ఉద్దేశంతో ఈ పరిణామానికి ఉన్న సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- issue: וְהָיָה עָלֶיךָ דָּמִים లో రక్తబాధ్యత భావం
  choice: రక్తదోషం నీ మీద ఉంటుంది
  alternative: రక్తం నీ మీద ఉంటుంది
  rationale: మూలంలోని నుడికార రూపాన్ని పూర్తిగా చెరపకుండా, నిర్దోషి రక్తపాతానికి కలిగే నైతిక-న్యాయ బాధ్యతను ‘రక్తదోషం’గా తెలిపాం; పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన న్యాయశైలిని వాడాం. ‘స్వాస్థ్యం,’ ‘నిర్దోషి రక్తం,’ ‘రక్తదోషం’ అనే పదాలు ఒడంబడిక-భూభాగ మరియు న్యాయ భావాలను సంక్షిప్తంగా నిలుపుతాయి.
