  to: నీ దేవుడైన యాహ్వే నీకు స్వాస్థ్యంగా ఇస్తున్న నీ దేశం నడుమ నిర్దోషి రక్తం చిందించబడకుండా ఉండాలి; రక్తదోషం నీ మీద ఉంటుంది[a].
