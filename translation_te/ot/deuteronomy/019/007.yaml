  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: te
  text: 'కాబట్టి నేను నీకు ఇలా ఆజ్ఞాపిస్తున్నాను: “నీ కోసం మూడు పట్టణాలను ప్రత్యేకించాలి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ కోసం మూడు పట్టణాలను నియమించాలి.” హీబ్రూ క్రియకు “వేరుచేయు,” “ప్రత్యేకించు,” లేదా ఈ సందర్భంలో “నియమించు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే నిర్ధారణను లేదా ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను నిలుపుతూ, తెలుగులో అతిగా బలపరచకుండా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מְצַוְּךָ
  choice: నీకు ... ఆజ్ఞాపిస్తున్నాను
  rationale: వర్తమాన ఆదేశ స్వభావాన్నీ, రెండవ పురుష ఏకవచన సంబోధననూ కాపాడుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఆజ్ఞలోని విషయాన్ని పరిచయం చేసే ఉద్ధరణ సూచకాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁלֹשׁ עָרִים
  choice: మూడు పట్టణాలను
  rationale: సంఖ్యా-నామ నిర్మాణానికి నేరమైన, సహజమైన అనువాదం.
- source_word: תַּבְדִּיל
  choice: ప్రత్యేకించాలి
  rationale: హిఫిల్ రూపంలోని ‘వేరుచేయడం/ప్రత్యేకంగా ఉంచడం’ అనే ప్రాథమిక భావాన్ని కాపాడుతూ, ఈ న్యాయ సందర్భంలోని అధికారిక నియామక భావాన్నీ మోయగలదు.
- source_word: לָךְ
  choice: నీ కోసం
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో కూడిన ఉపసర్గ సూచించే ప్రయోజనం లేదా వినియోగ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో రెండవ పురుష పుంలింగ ఏకవచన సంబోధన
  choice: ‘నీకు’, ‘నీ కోసం’ అనే ఏకవచన రూపాలను ఉపయోగించడం
  alternative: సమూహార్థాన్ని స్పష్టం చేయడానికి బహువచనంగా అనువదించడం లేదా కర్తలేని వాక్యంగా మార్చడం
  rationale: హీబ్రూ నిబంధన బోధలో ఇశ్రాయేలు సమాజాన్ని తరచుగా ఏకవచనంలో సంబోధిస్తారు. మూలంలోని వాక్చాతుర్య రూపాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘లేమోర్’ను పదానువాదంగా ‘అని చెప్పుచు’ అని కాకుండా సహజమైన ఉద్ధరణ పరిచయమైన ‘ఇలా’గా ఇచ్చాం; మూలంలోని ఏకవచన సంబోధనను నిలిపాం.
