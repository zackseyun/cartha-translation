revisions:
- from: అయితే ఒకడు తన తోటివాణ్ణి ద్వేషించి, అతని కోసం మాటువేసి, అతని మీదికి లేచి, అతని ప్రాణం పోయేలా కొట్టి[a], అతడు చనిపోయిన తర్వాత ఈ పట్టణాల్లో ఒకదానికి పారిపోతే,
  to: అయితే ఒకడు తన తోటివాణ్ణి ద్వేషించి, అతని కోసం మాటువేసి, అతని మీదికి లేచి, అతనిని ప్రాణాంతకంగా కొట్టగా అతను చనిపోగా, ఆ ఒకడు ఈ పట్టణాల్లో ఒకదానికి పారిపోతే,
