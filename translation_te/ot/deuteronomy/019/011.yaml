id: DEU.19.11
reference: Deuteronomy 19:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: te
  text: అయితే ఒకడు తన తోటివాణ్ణి ద్వేషించి, అతని కోసం మాటువేసి, అతని మీదికి లేచి, అతనిని ప్రాణాంతకంగా కొట్టగా అతను చనిపోగా, ఆ ఒకడు ఈ పట్టణాల్లో ఒకదానికి పారిపోతే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: అయితే
  rationale: ముందటి వచనాల్లోని అనుకోకుండా జరిగిన హత్యకు భిన్నమైన షరతును పరిచయం చేస్తుంది; వ్యత్యాసం, షరతు రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה אִישׁ
  choice: ఒకడు
  rationale: ప్రతినిధి పురుష న్యాయవిషయాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: తన తోటివాణ్ణి ద్వేషించి
  rationale: שֹׂנֵא యొక్క స్పష్టమైన అర్థమైన ‘ద్వేషించు’ను నిలుపుతూ, רֵעַకు న్యాయసందర్భంలో సరిపోయే ‘తోటివాడు’ను వాడింది; ‘స్నేహితుడు’ అనే సన్నిహిత భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וְאָרַב לוֹ
  choice: అతని కోసం మాటువేసి
  rationale: ముందుగా పన్నిన దాడికోసం దాక్కొని ఎదురుచూడటాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְקָם עָלָיו
  choice: అతని మీదికి లేచి
  rationale: మూలంలోని ‘అతనికి విరోధంగా లేచాడు’ అనే క్రమాన్నీ, శత్రుత్వపూర్వక చర్యనూ నిలుపుతుంది.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: అతని ప్రాణం పోయేలా కొట్టి, అతడు చనిపోయిన తర్వాత
  rationale: ప్రాణాంతక దెబ్బను సూచించే హీబ్రూ నుడికారాన్ని సహజంగా తెలియజేస్తూ, దెబ్బ మరియు మరణం అనే మూలంలోని రెండు వరుస అంశాలను నిలుపుతుంది.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: ఈ పట్టణాల్లో ఒకదానికి పారిపోతే
  rationale: సమీప సందర్భంలో పేర్కొన్న ఆశ్రయ పట్టణాలను సూచించే ‘ఈ’ అనే సామీప్య భావాన్నీ, נוּס యొక్క ‘పారిపోవు’ అర్థాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ఉద్దేశపూర్వక హత్యను అనుకోకుండా జరిగిన హత్యనుంచి వేరు చేయడం
  choice: ‘ద్వేషించి—మాటువేసి—మీదికి లేచి—ప్రాణం పోయేలా కొట్టి’ అనే చర్యల క్రమాన్ని నిలుపడం
  alternative: ఒకే పదంతో ‘హత్య చేస్తే’ అని సంక్షిప్తంగా అనువదించడం
  rationale: వచనం ముందస్తు ఉద్దేశాన్ని స్పష్టంగా చూపుతున్నప్పటికీ, మూలం దాన్ని ఒక వ్యాఖ్యానాత్మక సారాంశ పదంతో కాకుండా వరుస చర్యల ద్వారా వివరిస్తుంది. ఆ క్రమాన్ని నిలపడం న్యాయపరమైన వ్యత్యాసాన్నీ మూలరూపాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన న్యాయవచన శైలిని వాడాం. ఇది తరువాతి వచనంలో పూర్తయ్యే షరతు వాక్యం కావడంతో చివర కామాను ఉంచాం. మూలంలోని పురుష ప్రతినిధి న్యాయ ఉదాహరణను ‘ఒకడు’తో నిలిపాం.
