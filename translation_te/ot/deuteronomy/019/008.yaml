source:
  edition: WLC
  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీ పితరులకు ప్రమాణం చేసిన ప్రకారం నీ సరిహద్దులను విస్తరించి, నీ పితరులకు ఇస్తానని చెప్పిన భూమినంతటినీ నీకు ఇస్తే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ పితరులకు’ అని వచ్చిన రెండు చోట్లా ‘నీ పూర్వీకులకు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘నీ పితరులకు’; ఇది ఇశ్రాయేలు పితృపురుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ఇస్తే
  rationale: హీబ్రూ షరతు వాక్యం ముందున్న ఆదేశంతో కొనసాగుతుంది. తెలుగులో సహజంగా ఉండేందుకు షరతు భావాన్ని వాక్యాంత క్రియలో వ్యక్తం చేశాం.
- source_word: יַרְחִיב ... אֶת גְּבֻלְךָ
  choice: నీ సరిహద్దులను విస్తరించి
  rationale: רחב హిఫీల్ రూపం ‘విస్తరించు’ అనే భావాన్ని ఇస్తుంది; גְּבוּל ఇక్కడ భూభాగపు సరిహద్దులను సూచిస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఉంచి, అక్షరార్థమైన ‘నీ దేవుడు’ భావాన్ని సహజ తెలుగు నిర్మాణంలో తెలిపాం.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: ప్రమాణం చేసిన ప్రకారం
  rationale: పితరులకు చేసిన దైవ ప్రమాణాన్ని స్పష్టంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: לַאֲבֹתֶיךָ
  choice: నీ పితరులకు
  rationale: హీబ్రూ אָבוֹת అనే పురుషలింగ కుటుంబపదాన్ని, ఇశ్రాయేలు పితృపురుషులను సూచించే ఒడంబడిక వాడుకను కాపాడుతూ అనువదించాం.
- source_word: וְנָתַן לְךָ
  choice: నీకు ఇస్తే
  rationale: భవిష్యత్తును ఉద్దేశించిన షరతు వాక్యంలో waw + perfect రూపానికి తెలుగులో సహజమైన షరతు క్రియను వాడాం.
- source_word: כָּל הָאָרֶץ
  choice: దేశమంతటినీ
  rationale: אֶרֶץ ఇక్కడ ప్రపంచాన్ని కాక ఇశ్రాయేలుకు వాగ్దానం చేసిన దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: ఇస్తానని చెప్పిన
  rationale: דִּבֶּר అక్షరార్థంగా ‘చెప్పాడు/మాట్లాడాడు’; దైవ వాగ్దాన సందర్భాన్ని సూచిస్తూ కూడా మూలంలోని ‘చెప్పిన’ పదబంధాన్ని నిలిపాం.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగిస్తూ, దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: אבות పదాన్ని ‘పితరులు’గా లేదా ‘పూర్వీకులు’గా అనువదించడం
  choice: పితరులు
  alternative: పూర్వీకులు
  rationale: మూలంలోని పురుషలింగ కుటుంబపదాన్ని, ఇశ్రాయేలు పితృపురుషులతో దాని ఒడంబడిక సంబంధాన్ని ప్రధాన పాఠ్యంలో కాపాడాం; విస్తృత సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
