revisions:
- from: లేకపోతే, రక్తప్రతీకారం తీర్చుకునే బంధువు కోపోద్రిక్తుడై ఆ చంపినవాణ్ణి వెంబడించవచ్చు. దారి దూరంగా ఉండడం వల్ల అతణ్ణి అందుకొని చంపివేయవచ్చు. అయితే అతడు అంతకుముందు చనిపోయినవాణ్ణి ద్వేషించలేదు కాబట్టి అతనికి మరణశిక్ష విధించడానికి తగిన కారణం లేదు.
  to: లేకపోతే, రక్తప్రతీకారం తీర్చుకునే బంధువు కోపోద్రిక్తుడై[a] ఆ చంపినవాణ్ణి వెంబడించి, దారి దూరంగా ఉండడం వల్ల అతణ్ణి అందుకొని ప్రాణాంతకంగా కొట్టవచ్చు. అతడు అంతకుముందు[b] ఆ వ్యక్తిని ద్వేషించలేదు కాబట్టి, అతడు మరణశిక్షకు గురికావాల్సినవాడు కాదు.
  rationale: సవరణ న్యాయపరమైన ‘మరణ తీర్పు లేదు’ అనే భావాన్ని ‘మరణశిక్షకు గురికావాల్సినవాడు కాదు’ ద్వారా స్పష్టంగా నిలుపుతుంది; బాధితుని గురించి మూలం చెప్పని అదనపు నిర్దిష్టీకరణను తొలగిస్తుంది; మరియు రెండు హీబ్రూ నుడికారాలకు సరైన స్థానాల్లో ఫుట్‌నోట్ ఆంకర్లు జోడిస్తుంది. ‘కోపోద్రిక్తుడై’ మరియు ‘దారి దూరంగా ఉండడం వల్ల’ ఆధునిక తెలుగులో సహజమైనవే కాబట్టి నిలుపబడ్డాయి.
