id: DEU.19.6
reference: Deuteronomy 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: te
  text: లేకపోతే, రక్తప్రతీకారం తీర్చుకునే బంధువు కోపోద్రిక్తుడై[a] ఆ చంపినవాణ్ణి వెంబడించి, దారి దూరంగా ఉండడం వల్ల అతణ్ణి అందుకొని ప్రాణాంతకంగా కొట్టవచ్చు. అతడు అంతకుముందు[b] ఆ వ్యక్తిని ద్వేషించలేదు కాబట్టి, అతడు మరణశిక్షకు గురికావాల్సినవాడు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని హృదయం వేడెక్కుతుంది.” ఇది తీవ్రమైన ఆగ్రహాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నిన్నటి నుంచీ మొన్నటి నుంచీ.” ఇది “అంతకుముందు” లేదా “మునుపటి కాలంలో” అనే అర్థంలో వాడే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ఆశ్రయ పట్టణాలకు దారులు సిద్ధం చేయకపోతే సంభవించగల ప్రమాదాన్ని తెలిపే నివారణార్థక హెచ్చరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చుకునే బంధువు
  rationale: ఇది హతుని కుటుంబం తరఫున ప్రతీకారం తీర్చుకునే సమీప బంధువు అనే తోరా న్యాయపరమైన పాత్రను స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘ప్రతీకారకుడు’ అనడం బంధుత్వ భావాన్ని కోల్పోతుంది.
- source_word: הָרֹצֵחַ
  choice: చంపినవాడు
  rationale: ఈ సందర్భంలో హత్య ముందస్తు ద్వేషం లేకుండా జరిగింది; అందువల్ల ఉద్దేశపూర్వక హంతకుడని సూచించే పదం కాకుండా తటస్థమైన పదాన్ని ఎంచుకున్నాం.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: కోపోద్రిక్తుడై
  rationale: అక్షరార్థంగా ‘అతని హృదయం వేడెక్కినప్పుడు’; తెలుగులో మండుతున్న ఆగ్రహాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִשִּׂיגוֹ
  choice: అతణ్ణి అందుకొని
  rationale: వెంబడించి చేరుకోవడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: దారి దూరంగా ఉండడం వల్ల
  rationale: ఆశ్రయ పట్టణానికి వెళ్లవలసిన ప్రయాణ దూరం ఎక్కువగా ఉండడమే పట్టుబడే అవకాశాన్ని కలిగిస్తుందనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: చంపివేయవచ్చు
  rationale: అక్షరార్థంలోని ప్రాణాంతకంగా కొట్టడం అనే హీబ్రూ ప్రయోగానికి సందర్భానుగుణమైన సహజ తెలుగు.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: అతనికి మరణశిక్ష విధించడానికి తగిన కారణం లేదు
  rationale: ‘అతనికి మరణ తీర్పు లేదు’ అనే న్యాయపరమైన భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తూ, కేవలం వ్యక్తిగత అర్హతగా మార్చకుండా న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: అతడు ... చనిపోయినవాణ్ణి ద్వేషించలేదు కాబట్టి
  rationale: మరణశిక్షకు అతడు లోబడకపోవడానికి కారణం ముందస్తు శత్రుత్వం లేకపోవడమేనని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: అంతకుముందు
  rationale: అక్షరార్థంగా ‘నిన్నటి నుంచో మొన్నటి నుంచో’ అనే హీబ్రూ నుడికారం; మునుపటి కాలాన్ని సూచించే సహజ తెలుగు రూపం.
theological_decisions:
- issue: అనుద్దేశపూర్వకంగా చంపిన వ్యక్తి యొక్క న్యాయస్థితి
  choice: ముందస్తు ద్వేషం లేకపోవడం వల్ల మరణశిక్ష విధించడానికి తగిన కారణం లేదని అనువదించాం.
  alternative: అతడు మరణానికి అర్హుడు కాడు.
  rationale: మִשְׁפַּט అనే పదంలోని న్యాయతీర్పు భావాన్ని నిలుపుతూ, వాక్యం చెప్పేదానికంటే విస్తృతమైన నైతిక లేదా సిద్ధాంతపరమైన తీర్పును చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన భావాన్ని స్పష్టంగా ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వాక్య నిర్మాణం. ‘రక్తప్రతీకారం తీర్చుకునే బంధువు’ అనే విస్తృత రూపం మూలంలోని న్యాయ-బంధుత్వ పాత్రను తెలియజేస్తుంది.
