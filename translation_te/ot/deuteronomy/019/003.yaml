revisions:
- from: నీవు దారిని సిద్ధం చేసుకోవాలి. నీ దేవుడైన యహ్వే నీకు వారసత్వంగా ఇస్తున్న నీ దేశ భూభాగాన్ని మూడు భాగాలుగా విభజించాలి. అప్పుడు మనిషిని చంపిన ప్రతివాడూ అక్కడికి పారిపోగలడు.[a]
  to: నీవు దారిని సిద్ధం చేసుకోవాలి; నీ దేవుడైన యహ్వే నీకు వారసత్వంగా ఇస్తున్న నీ దేశపు భూభాగాన్ని మూడు భాగాలుగా విభజించాలి. తద్వారా మనిషిని చంపిన ప్రతివాడూ అక్కడికి పారిపోవడానికి వీలవుతుంది.[a]
  rationale: The revision makes the final clause explicitly purposive/resultative, improves the idiom for the land’s territory, and otherwise preserves the draft’s accurate treatment of the divine name, inheritance language, and the legally broad term for one who has killed.
