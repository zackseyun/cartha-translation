id: DEU.19.3
reference: Deuteronomy 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: te
  text: నీవు దారిని సిద్ధం చేసుకోవాలి; నీ దేవుడైన యహ్వే నీకు వారసత్వంగా ఇస్తున్న నీ దేశపు భూభాగాన్ని మూడు భాగాలుగా విభజించాలి. తద్వారా మనిషిని చంపిన ప్రతివాడూ అక్కడికి పారిపోవడానికి వీలవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అక్కడికి పారిపోవడానికి అది ఉండాలి.”
    reason: మూలంలోని సంక్షిప్త నిర్మాణం ఉద్దేశం లేదా ఫలిత భావాన్ని కలిగి ఉండగలదని చూపించడానికి.
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: నీవు దారిని సిద్ధం చేసుకోవాలి
  rationale: כון అనే క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ప్రయాణానికి దారిని సిద్ధంగా ఉంచడాన్ని సూచిస్తుంది. לְךָ లోని స్వప్రయోజన భావాన్ని ‘సిద్ధం చేసుకోవాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשִׁלַּשְׁתָּ
  choice: మూడు భాగాలుగా విభజించాలి
  rationale: שלש అనే క్రియ యొక్క పియేల్ రూపం భూభాగాన్ని మూడుగా విభజించడం లేదా మూడు విభాగాలుగా ఏర్పాటు చేయడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: גְּבוּל אַרְצְךָ
  choice: నీ దేశ భూభాగం
  rationale: גְּבוּל పదం సరిహద్దును మాత్రమే కాక ఒక దేశపు మొత్తం పరిధి లేదా భూభాగాన్ని కూడా సూచిస్తుంది; ఈ భౌగోళిక సందర్భంలో ‘భూభాగం’ స్పష్టమైనది.
- source_word: יַנְחִילְךָ
  choice: నీకు వారసత్వంగా ఇస్తున్న
  rationale: נחל యొక్క హిఫీల్ రూపం ఒకరికి వారసత్వం కలిగించడం లేదా వారసత్వంగా ఇవ్వడం అనే భావాన్ని కలిగి ఉంది. ఈ అనువాదం భూమి దేవుని బహుమానమనీ వారసత్వమనీ రెండింటినీ నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యహ్వే
  rationale: యెహోవా అనే సాధారణీకృత రూపానికి బదులుగా, హీబ్రూ దైవనామం יהוה ను ‘యహ్వే’గా లిప్యంతరీకరించి నిబంధన నామాన్ని పేరుగానే ఉంచాం.
- source_word: כָּל רֹצֵחַ
  choice: మనిషిని చంపిన ప్రతివాడూ
  rationale: רֹצֵחַ ఇక్కడ ఉద్దేశపూర్వక హంతకుడికే పరిమితం కాదు; ఆశ్రయపురాల సందర్భంలో అనుకోకుండా మనిషిని చంపిన వ్యక్తిని కూడా కలుపుతుంది. ‘మనిషిని చంపినవాడు’ అపరాధ ఉద్దేశాన్ని ముందుగానే నిర్ణయించదు.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: అప్పుడు … అక్కడికి పారిపోగలడు
  rationale: హీబ్రూ వాక్య నిర్మాణం సంక్షిప్తంగా ‘అక్కడికి పారిపోవడానికి అది ఉండాలి’ అని ఉంది. సందర్భంలోని ఫలిత లేదా ఉద్దేశ భావాన్ని సహజమైన తెలుగులో ఈ విధంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం నిబంధన దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఉంచడం మూలంలోని వ్యక్తిగత నామాన్ని కాపాడుతుంది.
- issue: רֹצֵחַ పదం హత్యాపరాధాన్ని తప్పనిసరిగా సూచిస్తుందా?
  choice: మనిషిని చంపినవాడు
  alternative: హంతకుడు; నరహంతకుడు
  rationale: తరువాతి వచనాలు ఉద్దేశం లేకుండా జరిగిన చంపడాన్ని కూడా చర్చిస్తాయి. అందువల్ల ఈ వచనంలోనే నైతిక లేదా న్యాయ దోషాన్ని నిర్ణయించే పదాన్ని వాడకుండా విస్తృత భావాన్ని నిలిపాం.
- issue: וְהָיָה לָנוּס שָׁמָּה లో ఉద్దేశమా లేక ఫలితమా?
  choice: అప్పుడు … పారిపోగలడు
  alternative: అక్కడికి పారిపోవడానికి అది ఉండాలి
  rationale: సంక్షిప్త హీబ్రూ నిర్మాణం ఉద్దేశం లేదా సాధ్యమైన ఫలితాన్ని వ్యక్తం చేయగలదు. ప్రధాన పాఠంలో సహజమైన ఫలిత/సామర్థ్య భావాన్ని ఇచ్చి, అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘స్వాస్థ్యం’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘వారసత్వం’ను ఎంచుకున్నాం. ‘హంతకుడు’ అనే పదం ఉద్దేశపూర్వక హత్య భావాన్ని కలిగించవచ్చు కాబట్టి, సందర్భానికి తగిన విస్తృత రూపమైన ‘మనిషిని చంపినవాడు’ను వాడాం.
