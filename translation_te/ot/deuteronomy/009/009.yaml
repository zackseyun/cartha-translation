id: DEU.9.9
reference: Deuteronomy 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: te
  text: రాతి పలకలను—యాహ్వే మీతో చేసిన నిబంధన పలకలను—పొందడానికి నేను కొండ ఎక్కినప్పుడు, నేను ఆ కొండమీద నలభై రోజులు, నలభై రాత్రులు ఉన్నాను. నేను రొట్టె తినలేదు, నీళ్లు తాగలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: నేను కొండ ఎక్కినప్పుడు
  rationale: ב + infinitive construct కాలార్థాన్ని ఇస్తుంది; directional ה ఉన్న הָהָרָה నిర్దిష్టమైన కొండవైపు ఎక్కడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: לָקַחַת
  choice: తీసుకోవడానికి
  rationale: לקח యొక్క ప్రాథమిక అర్థం ‘తీసుకోవడం’. సందర్భంలో దేవుని చేతినుంచి పొందడం భావమైనప్పటికీ, మూలంలోని క్రియను నిలుపుతూ దాని సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: לוּחֹת הָאֲבָנִים
  choice: రాతి పలకలను
  rationale: ‘రాయి పలకలు’ అనే పదార్థాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: לוּחֹת הַבְּרִית
  choice: నిబంధన పలకలను
  rationale: ముందటి ‘రాతి పలకలు’ అనే పదబంధాన్ని వివరిస్తున్న హీబ్రూ పునరుక్తిని నిలుపుతుంది.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: యెహోవా మీతో చేసిన
  rationale: כרת ברית అక్షరార్థంగా ‘నిబంధన కోయడం’; తెలుగులో ప్రామాణిక భావానువాదం ‘నిబంధన చేయడం’. సంబంధవాచక నిర్మాణం ‘నిబంధన పలకలను’ విశేషిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించింది.
- source_word: וָאֵשֵׁב בָּהָר
  choice: ఆ కొండమీద ... ఉన్నాను
  rationale: ישב కు ‘కూర్చోవడం, నివసించడం, ఉండడం’ అర్థాలున్నాయి; ఇక్కడ కాలవ్యవధి ప్రధానమైనందున ‘ఉన్నాను’ సహజంగా సందర్భాన్ని అందిస్తుంది.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: రోజు-రాత్రి కాలవ్యవధిని తెలుగులో స్పష్టంగా, సమాంతరంగా తెలియజేస్తుంది.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: నేను ఆహారం తినలేదు
  rationale: לֶחֶם ప్రాథమికంగా ‘రొట్టె’ అయినా, విస్తృతంగా ‘ఆహారం’ అనే అర్థంలోనూ వాడబడుతుంది. సంపూర్ణ ఉపవాస సందర్భంలో తెలుగు పాఠకునికి ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘ఆహారం’ ఎంచుకుని అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: నీళ్లు తాగలేదు
  rationale: మూలంలోని ప్రత్యక్ష, సమాంతర నిరాకరణను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: మోషే ఉపవాసం యొక్క పరిధి
  choice: ఆహారం తినలేదు, నీళ్లు తాగలేదు
  alternative: రొట్టె తినలేదు, నీళ్లు తాగలేదు
  rationale: లֶחֶם ‘రొట్టె’ లేదా విస్తృతార్థంలో ‘ఆహారం’ కావచ్చు. నీరు కూడా తాగలేదనే సమాంతర వాక్యంతో పూర్తి ఉపవాసం ఉద్దేశించబడినట్లు సందర్భం సూచిస్తుంది; అయినా అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన వచనం. హీబ్రూ పునరుక్తిని డాష్‌ల మధ్య వివరణాత్మక సమానాధికార నిర్మాణంగా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
