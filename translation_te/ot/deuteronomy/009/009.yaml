- from: రాతి పలకలను—యెహోవా మీతో చేసిన నిబంధన పలకలను—తీసుకోవడానికి[a] నేను కొండ ఎక్కినప్పుడు, ఆ కొండమీద నలభై పగళ్లు, నలభై రాత్రులు ఉన్నాను. నేను ఆహారం[b] తినలేదు, నీళ్లు తాగలేదు.
