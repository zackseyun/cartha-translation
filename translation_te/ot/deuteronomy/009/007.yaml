  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: te
  text: 7 అరణ్యంలో నీ దేవుడైన యెహోవాకు నీవు కోపం పుట్టించిన సంగతిని జ్ఞాపకం చేసుకో—మరచిపోవద్దు.[a] నీవు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజు మొదలుకొని మీరు ఈ స్థలానికి చేరిన వరకూ యెహోవాకు విరోధంగా తిరుగుబాటు చేస్తూనే ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరణ్యంలో నీ దేవుడైన యెహోవాను కోపగింపజేసిన సంగతిని.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యెహోవాతో”; ఇక్కడ సందర్భానుసారంగా ఇది ఆయనకు విరోధంగా ప్రవర్తించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: జ్ఞాపకం చేసుకోండి—మరచిపోవద్దు
  rationale: ఆజ్ఞను, దానిని బలపరిచే నిషేధాన్ని రెండింటినీ నిలుపుతుంది. హీబ్రూలో ఏకవచనం నుంచి బహువచనానికి మార్పు ఉన్నా, ఆధునిక తెలుగులో గౌరవ/సమూహ సంబోధనగా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: కోపం పుట్టించిన సంగతి
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘కోపపెట్టారు’ కంటే గంభీరంగా, స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: నిర్గమ సందర్భంలోని జనావాసం లేని ప్రాంతాన్ని సూచించే సహజమైన, సంప్రదాయ తెలుగు పదం.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ
  choice: బయలుదేరిన రోజు మొదలుకొని
  rationale: కాలవ్యవధి ప్రారంభాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలానికి చేరే వరకు
  rationale: మూలంలోని గమ్యానికి రాకను సహజమైన ఆధునిక తెలుగులో తెలుపుతుంది.
- source_word: מַמְרִים הֱיִיתֶם
  choice: తిరుగుబాటు చేస్తూనే ఉన్నారు
  rationale: వివరించిన కాలమంతటా కొనసాగిన ధిక్కార ధోరణిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עִם יְהוָה
  choice: యెహోవాపట్ల
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినప్పటికీ, מרהతో కలిసినప్పుడు ప్రతికూల సంబంధాన్ని సూచిస్తుంది. ‘పట్ల’ మూలంలోని స్వల్ప అస్పష్టతను నిలుపుతూ సందర్భానుసార విరోధాన్ని తెలిపుతుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన יהוה ఉంది; దానిని సాధారణ బిరుదుగా మార్చలేదు.
- issue: ఇశ్రాయేలు తిరుగుబాటు యొక్క కాలవ్యాప్తి
  choice: తిరుగుబాటు చేస్తూనే ఉన్నారు
  alternative: తిరుగుబాటు చేశారు
  rationale: ఐగుప్తు నుంచి ఈ స్థలం వరకు కొనసాగిన ప్రవర్తనా సరళిని మూలవాక్యం సూచిస్తుంది.
- issue: עִם יהוה లోని సంబంధం
  choice: యెహోవాపట్ల
  alternative: యెహోవాకు విరోధంగా
  rationale: సందర్భం విరోధార్థాన్ని కోరుతున్నా, ‘పట్ల’ అనే రూపం అక్షరార్థమైన ‘తో’ మరియు స్పష్టమైన ‘విరోధంగా’ మధ్య మూలంలోని భావసాంద్రతను పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సమూహాన్ని ఉద్దేశించిన గౌరవ బహువచన రూపాలు వాడబడ్డాయి. మూలంలోని ఏకవచన–బహువచన మార్పును తెలుగులో కృత్రిమంగా చూపకుండా సహజ సమూహ సంబోధనగా అందించాం.
