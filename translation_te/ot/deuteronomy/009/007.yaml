revisions:
- from: 7 మీరు అరణ్యంలో మీ దేవుడైన యెహోవాకు కోపం పుట్టించిన సంగతి జ్ఞాపకం చేసుకోండి—మరచిపోవద్దు.[a] మీరు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజు మొదలుకొని ఈ స్థలానికి చేరే వరకు యెహోవాపట్ల తిరుగుబాటు చేస్తూనే ఉన్నారు.[b]
  to: 7 అరణ్యంలో నీ దేవుడైన యెహోవాకు నీవు కోపం పుట్టించిన సంగతిని జ్ఞాపకం చేసుకో—మరచిపోవద్దు.[a] నీవు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజు మొదలుకొని మీరు ఈ స్థలానికి చేరిన వరకూ యెహోవాకు విరోధంగా తిరుగుబాటు చేస్తూనే ఉన్నారు.[b]
