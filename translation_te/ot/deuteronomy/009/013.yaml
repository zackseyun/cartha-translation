id: DEU.9.13
reference: Deuteronomy 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: te
  text: 'అప్పుడు యాహ్వే నాతో ఇలా అన్నాడు: “నేను ఈ ప్రజలను చూశాను. ఇదిగో, వారు మెడ వంచని ప్రజలు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఈ ప్రజలను చూశాను; నిజంగా వీరు గట్టి మెడగల ప్రజలు.”
    reason: ‘ఇదిగో’ అనే ఉద్ఘాటనకు ‘నిజంగా’ అనే ప్రత్యామ్నాయం, అలాగే కְשֵׁה עֹרֶף అనే మూల రూపకానికి మరింత అక్షరార్థ రూపం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: אֵלַי לֵאמֹר
  choice: నాతో ఇలా అన్నాడు
  rationale: మాటల పరిచయ సూత్రంలోని భావాన్ని సహజ తెలుగులో ‘ఇలా అన్నాడు’గా కలిపి వ్యక్తం చేశాం.
- source_word: רָאִיתִי
  choice: నేను ... చూశాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను దాని ప్రత్యక్ష, నిర్ణీత పరిశీలన భావంతో సాధారణ తెలుగు భూతకాలంలో అందించాం.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: עם అనే సమూహవాచకాన్ని ‘ప్రజలు’గా, సూచనార్థక పదంతో సహజ తెలుగు కర్మరూపంలో ఇచ్చాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి నిర్ధారణపై దృష్టి ఆకర్షించే హీబ్రూ ఉద్ఘాటనను నిలిపాం.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: మెడ వంచని ప్రజలు
  rationale: ‘గట్టి మెడగల’ అనే మూల రూపకాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతూ మొండితనం, అవిధేయత అనే భావాన్ని సూచిస్తుంది.
- source_word: הוּא
  choice: వారు
  rationale: హీబ్రూలో సమూహవాచకమైన עם వ్యాకరణపరంగా ఏకవచనమైనా, తెలుగులో ‘ప్రజలు’తో సహజంగా బహువచన సర్వనామం వాడబడుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో విస్తృతంగా గుర్తింపుపొందిన నామరూపాన్ని ఉపయోగించాం.
- issue: קְשֵׁה עֹרֶף రూపకార్థం
  choice: మెడ వంచని ప్రజలు
  alternative: మొండివారు
  rationale: కేవలం వ్యాఖ్యాత్మక అర్థమైన ‘మొండి’ అని మార్చకుండా, విధేయత చూపని మొండితనాన్ని తెలిపే మూల రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హీబ్రూ ఉద్ఘాటనను ‘ఇదిగో’తో, మెడ రూపకాన్ని సహజమైన ‘మెడ వంచని’ నుడికారంతో నిలిపాం. అడుగుటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
