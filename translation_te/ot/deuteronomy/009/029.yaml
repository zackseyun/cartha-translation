  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵ֥ם עַמְּ/ךָ֖ וְ/נַחֲלָתֶ֑/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּדֹ֔ל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: te
  text: అయితే వారు నీ ప్రజలు, నీ స్వాస్థ్యం[a]—నీ గొప్ప శక్తితోను చాచిన నీ బాహువుతోను[b] నీవు బయటకు తీసుకొచ్చినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు వారు నీ ప్రజలు, నీ స్వాస్థ్యం.” హీబ్రూలోని సంధిపదాన్ని సాధారణంగా “మరియు” అని కూడా అనువదించవచ్చు; “అయితే” అనేది మోషే విజ్ఞప్తిలోని వ్యతిరేక భావాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “చాచిన బాహువు” అనేది యెహోవా తన శక్తితో చేసిన నిర్గమన విమోచనను సూచించే స్థిరమైన బైబిలు ప్రయోగం.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: అయితే వారు
  rationale: ו సాధారణంగా ‘మరియు’ అని అర్థమివ్వగలిగినా, ముందున్న నాశనం చేయవద్దనే మోషే విజ్ఞాపనకు ఇది వ్యతిరేక భావంతో కొనసాగుతుంది. ‘అయితే’ ఆ భావాన్ని సహజమైన తెలుగులో చూపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: עַם ఇక్కడ దేవునితో నిబంధన సంబంధంలో ఉన్న ప్రజలను సూచిస్తుంది. ‘నీ ప్రజలు’ సరళంగానూ సందర్భోచితంగానూ ఉంది.
- source_word: וְנַחֲלָתֶךָ
  choice: నీ స్వాస్థ్యం
  rationale: נַחֲלָה వారసత్వంగా లభించిన వాటాను లేదా ప్రత్యేక సొత్తును సూచిస్తుంది. ‘స్వాస్థ్యం’ దేవునికి చెందిన ప్రజలనే నిబంధనాత్మక భావాన్ని నిలుపుతూ, ఆధునిక బైబిలు తెలుగులో గౌరవప్రదంగా వినిపిస్తుంది.
- source_word: אֲשֶׁר
  choice: వారిని
  rationale: సంబంధవాచకం ముందున్న ప్రజలను సూచిస్తుంది. తెలుగులో వాక్యాన్ని సహజంగా చేయడానికి దాని భావాన్ని ‘వారిని’ అనే కర్మరూపంలో వ్యక్తం చేశాం.
- source_word: הוֹצֵאתָ
  choice: బయటకు తీసుకొచ్చావు
  rationale: יצא యొక్క హిఫీల్ రూపం ఒకరిని బయటకు రప్పించడాన్ని సూచిస్తుంది; ఇక్కడ ఐగుప్తు నిర్గమనానికి వాడే స్థిరమైన భాష. ‘బయటకు తీసుకొచ్చావు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: నీ గొప్ప శక్తితో
  rationale: כֹּחַ అంటే శక్తి లేదా బలం; גָּדוֹל అంటే గొప్ప. సాధనార్థక ב భావాన్ని తెలుగులో ‘తో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: చాచిన నీ బాహువుతో
  rationale: זְרוֹעַ అనే ‘బాహువు’ రూపకాన్ని, נְטוּיָה అనే ‘చాచిన’ విశేషణాన్ని నేరుగా నిలిపాం. పదక్రమం ఆధునిక తెలుగులో సహజంగా ఉండేలా మార్చాం.
theological_decisions:
- issue: దేవుని కార్యాన్ని మానవ అవయవ రూపకంతో వర్ణించడం
  choice: ‘చాచిన నీ బాహువుతో’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీ మహా కార్యాలతో’ లేదా ‘నీ బలప్రదర్శనతో’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం నిర్గమన విమోచనలో దేవుని శక్తిని ఉద్దేశపూర్వకంగా బాహువు రూపకంతో చెబుతుంది. దాన్ని అమూర్తమైన పదంగా మార్చితే మూలంలోని సాహిత్య, నిబంధనాత్మక బలం తగ్గిపోతుంది.
- issue: נַחֲלָה లోని నిబంధనాత్మక స్వామ్య భావం
  choice: ‘నీ స్వాస్థ్యం’
  alternative: ‘నీ సొత్తు’ లేదా ‘నీ వారసత్వం’
  rationale: ఇక్కడ మోషే ఇశ్రాయేలు దేవునికి ప్రత్యేకంగా చెందిన ప్రజలని ఆధారంగా చేసుకొని విజ్ఞప్తి చేస్తున్నాడు. ‘స్వాస్థ్యం’ ఆ ప్రత్యేక స్వామ్య, వారసత్వ ఛాయలను నిలుపుతుంది; ‘సొత్తు’ కంటే గౌరవప్రదంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘స్వాస్థ్యం’, ‘బాహువు’ వంటి పదాలు బైబిలు గాంభీర్యాన్ని నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. మూలంలోని వ్యతిరేక సంధి అనిశ్చితిని పాదటిప్పణిలో భద్రపరిచాం.
