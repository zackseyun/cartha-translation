  rationale: సంబంధవాక్యాన్ని తిరిగి కలిపి, మూలంలో లేని “నీవే” అనే ప్రత్యేక ఉద్ఘాటనను తొలగించాం. దీనివల్ల హీబ్రూ వాక్యనిర్మాణం, కర్త-క్రియ సంబంధం, మరియు సాధనార్థక పదబంధాల సమాంతరత్వం మరింత స్పష్టంగా నిలుస్తాయి. పాదటిప్పణి గుర్తులు వరుసగా సంధి ప్రత్యామ్నాయానికి మరియు “చాచిన బాహువు” ప్రయోగానికి సమీపంలో ఉన్నాయి.
