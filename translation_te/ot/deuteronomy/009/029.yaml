revisions:
- from: అయితే వారు నీ ప్రజలు, నీ స్వాస్థ్యం[a]. నీ గొప్ప శక్తితో, చాచిన నీ బాహువుతో[b] నీవే వారిని బయటకు తీసుకొచ్చావు.
