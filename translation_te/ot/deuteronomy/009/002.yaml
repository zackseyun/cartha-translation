source:
  edition: WLC
  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: te
  text: 'పెద్దవారైన, ఎత్తైన ప్రజలు—అనాకు కుమారులు[a]—వారి గురించి నీకు తెలుసు, వారి గురించి నీవు విన్నావు: “అనాకు కుమారుల ఎదుట ఎవరు నిలబడగలరు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అనాకీయులు.” హీబ్రూలో అక్షరార్థంగా “అనాకు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם גָּדוֹל וָרָם
  choice: గొప్పదైన, ఎత్తైన ప్రజలు
  rationale: עַם ఒక ప్రజాసమూహాన్ని సూచిస్తుంది. גָּדוֹל ఇక్కడ వారి గొప్ప పరిమాణాన్నీ భయంకర స్వభావాన్నీ సూచించగలదు; רָם శారీరక ఎత్తును సూచిస్తున్నందున ‘ఎత్తైన’ అని అనువదించాం.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: అనాకు కుమారులు
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను యథాతథంగా నిలిపి, ‘అనాకీయులు’ అనే జాతి పేరుగా పూర్తిగా మార్చలేదు. చివరి పదబంధంలోని ఏకవచన రూపం అనాకును పూర్వికుని లేదా వ్యక్తి పేరుగా గ్రహించడానికి మద్దతిస్తుంది.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: వారి గురించి నీకు తెలుసు
  rationale: ఇశ్రాయేలీయులకు ఈ ప్రజలు ఇప్పటికే తెలిసినవారని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: అని నీవు విన్నావు
  rationale: తరువాత వచ్చే ప్రసిద్ధ ప్రశ్ననే విన్న విషయంగా నేరుగా అనుసంధానిస్తూ హీబ్రూ వాక్య ప్రవాహాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: ఎదుట ఎవరు నిలబడగలరు?
  rationale: ఇది ప్రత్యర్థిని ఎదుర్కొని నిలబడటం లేదా తట్టుకోవడం అనే భావమున్న నుడికారం. ‘ఎదుట నిలబడగలరు’ దాని రూపకాన్నీ అలంకారిక ప్రశ్న బలాన్నీ కాపాడుతుంది.
