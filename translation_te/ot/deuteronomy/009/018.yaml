revisions:
- from: అప్పుడు నేను మొదటిసారిలాగే[a] నలభై పగళ్లూ నలభై రాత్రులూ యాహ్వే సన్నిధిలో సాగిలపడ్డాను. నేను రొట్టె తినలేదు, నీళ్లు తాగలేదు. ఎందుకంటే మీరు యాహ్వే దృష్టిలో చెడ్డది చేసి, ఆయనకు కోపం పుట్టేలా చేసిన పాపమంతటి కారణంగా అలా చేశాను.
  to: అప్పుడు నేను మునుపటిలాగే[a] యాహ్వే సన్నిధిలో నలభై పగళ్లూ నలభై రాత్రులూ సాగిలపడ్డాను; రొట్టె తినలేదు, నీళ్లు తాగలేదు—మీరు యాహ్వే దృష్టిలో చెడ్డది చేసి ఆయనకు కోపం పుట్టించేలా చేసిన మీ పాపమంతటి వల్ల.
  rationale: The revision removes the added resumptive phrase and redundant causal construction, attaches the reason directly to Moses’ actions as in the Hebrew, and makes the retrospective comparison more idiomatic. It preserves the divine name, duration, bread/water specificity, collective singular ‘sin,’ and the causative force of provoking Yahweh to anger.
