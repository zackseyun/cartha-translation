id: DEU.9.18
reference: Deuteronomy 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: te
  text: అప్పుడు నేను మునుపటిలాగే[a] యాహ్వే సన్నిధిలో నలభై పగళ్లూ నలభై రాత్రులూ సాగిలపడ్డాను; రొట్టె తినలేదు, నీళ్లు తాగలేదు—మీరు యాహ్వే దృష్టిలో చెడ్డది చేసి ఆయనకు కోపం పుట్టించేలా చేసిన మీ పాపమంతటి వల్ల.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మొదటిలాగే,” “పూర్వంలాగే.” ఈ హీబ్రూ పదబంధం మోషే అంతకుముందు యాహ్వే సన్నిధిలో గడిపిన నలభై రోజుల కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: సాగిలపడ్డాను
  rationale: హిత్పయేల్ రూపం మోషే దేవుని సన్నిధిలో తనను తాను అణచుకొని పడిన ప్రార్థనా భంగిమను సూచిస్తుంది. ‘సాగిలపడ్డాను’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ శారీరక భంగిమను నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי ఇక్కడ స్థల-సంబంధార్థంగా ‘ముందు/సన్నిధిలో’ అని సూచిస్తుంది. తెలుగులో ‘సన్నిధిలో’ సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: כָּרִאשֹׁנָה
  choice: మొదటిసారిలాగే
  rationale: ఈ పదబంధం మోషే అంతకుముందు యాహ్వే సన్నిధిలో గడిపిన నలభై రోజుల కాలాన్ని వెనక్కి సూచిస్తుంది. పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: నలభై పగళ్లూ నలభై రాత్రులూ
  rationale: కాలవ్యవధిని నేరుగా, సహజమైన తెలుగు జంటపదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: నేను రొట్టె తినలేదు
  rationale: హీబ్రూ పాఠం సాధారణంగా ‘ఆహారం’ అని కాకుండా ప్రత్యేకంగా ‘రొట్టె’ అని చెబుతుంది; దానిని నిలుపుకున్నాం.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: నీళ్లు తాగలేదు
  rationale: మూలంలోని సమన్విత ప్రతికూల వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగులో నేరుగా అందిస్తుంది.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: మీరు చేసిన పాపమంతటి కారణంగా
  rationale: עַל ఇక్కడ మోషే సాగిలపడటానికీ ఉపవాసానికీ కారణాన్ని తెలియజేస్తుంది. ఏకవచన חַטָּאת యొక్క సమష్టి భావాన్ని ‘పాపమంతటి’ నిలుపుతుంది.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో చెడ్డది చేసి
  rationale: ‘దృష్టిలో’ అనే రూపం దేవుని నైతిక మదింపు అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לְהַכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టేలా
  rationale: כעס హిఫీల్ రూపంలోని కారణార్థాన్ని వ్యక్తం చేస్తుంది; ఈ రూపం ఉద్దేశం లేదా ఫలితం అనే రెండింటికీ వీలు ఉంచి మూలంలోని సూక్ష్మ అనిశ్చితిని అతిగా పరిష్కరించదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నిబంధన సంబంధమైన దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా అందించాం.
- issue: לְהַכְעִיסוֹ లో ఉద్దేశం–ఫలితం సంబంధం
  choice: ఆయనకు కోపం పుట్టేలా
  alternative: ఆయనకు కోపం పుట్టించడానికి
  rationale: హీబ్రూ నిర్మాణం ఉద్దేశాన్ని లేదా పరిణామాన్ని సూచించగలదు. ‘కోపం పుట్టేలా’ అనే అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది; ఉద్దేశపూర్వకతను తప్పనిసరిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘రొట్టె,’ ఏకవచన సమష్టి భావం గల ‘పాపం,’ అలాగే ఉద్దేశం/ఫలితం మధ్య ఉన్న స్వల్ప అనిశ్చితి నిలుపబడ్డాయి.
