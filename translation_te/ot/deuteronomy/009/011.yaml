id: DEU.9.11
reference: Deuteronomy 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: te
  text: నలభై పగళ్లు, నలభై రాత్రులు ముగిసినప్పుడు, యాహ్వే ఆ రెండు రాతి పలకలను—నిబంధన పలకలను—నాకు ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: …ముగిసినప్పుడు
  rationale: ఇది కథనాన్ని ముందుకు నడిపించే రూపం. తెలుగులో విడిగా ‘అప్పుడు జరిగింది’ అని పెట్టకుండా, తరువాతి కాలవాచక పదబంధంతో సహజంగా వ్యక్తపరచబడింది.
- source_word: מִקֵּץ
  choice: ముగిసినప్పుడు
  rationale: నిర్దిష్ట కాలవ్యవధి పూర్తయిన సందర్భాన్ని సూచిస్తుంది; ‘తరువాత’ కంటే కాలపరిమితి ముగింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: హీబ్రూ పదబంధంలోని పగలు–రాత్రి భేదాన్ని నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: అదనపు భావాన్ని చేర్చకుండా సాధారణ క్రియ యొక్క సూటి అర్థాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֵלַי
  choice: నాకు
  rationale: נתן క్రియతో కూడిన గ్రహీతను సహజమైన తెలుగు చతుర్థీ విభక్తిలో వ్యక్తపరుస్తుంది.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: ఆ రెండు రాతి పలకలను
  rationale: సందర్భంలో నిర్దిష్టమైన రెండు పలకలను సూచించే భావాన్ని ‘ఆ’తో, వాటి పదార్థాన్ని ‘రాతి’తో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֻחֹת הַבְּרִית
  choice: నిబంధన పలకలను
  rationale: మూలంలోని పునరుక్తి మరియు వివరణాత్మక అన్వయాన్ని గీతల మధ్య నిలుపుతూ, ఆ పలకల నిబంధన సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూలోని ‘రాతి పలకలు—నిబంధన పలకలు’ అనే వివరణాత్మక పునరుక్తిని తొలగించకుండా నిలుపుకున్నాం. ఆంగ్ల సంప్రదింపు పాఠంలోని [a] సూచనకు మూల హీబ్రూలో ప్రత్యేక ప్రత్యామ్నాయ పఠనం కనిపించనందున దాన్ని చేర్చలేదు.
