id: DEU.9.17
reference: Deuteronomy 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶתְפֹּשׂ֙ בִּ/שְׁנֵ֣י הַ/לֻּחֹ֔ת וָֽ/אַשְׁלִכֵ֔/ם מֵ/עַ֖ל שְׁתֵּ֣י יָדָ֑/י וָ/אֲשַׁבְּרֵ֖/ם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: te
  text: అప్పుడు నేను ఆ రెండు పలకలను పట్టుకుని, నా రెండు చేతుల నుండి వాటిని విసిరి, మీ కళ్ల ఎదుట వాటిని పగలగొట్టాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిని విరిచాను.’ హీబ్రూ క్రియను సరళంగా ‘విరిచాను’ అని కూడా అనువదించవచ్చు; పలకలను విసిరిన ఈ సందర్భంలో ‘పగలగొట్టాను’ వాటి విరిగిపోవడాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: పట్టుకొని
  rationale: תפשׂ అంటే పట్టుకోవడం లేదా గట్టిగా అందుకోవడం. సందర్భంలోని శారీరక చర్యను సహజమైన ఆధునిక తెలుగులో ‘పట్టుకొని’ స్పష్టంగా తెలియజేస్తుంది; ‘లాక్కొని’ అనవసరమైన హింసాత్మక భావాన్ని జోడించవచ్చు.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: ఆ రెండు పలకలను
  rationale: לֻחוֹת అంటే పలకలు. ఇవి ముందే ప్రస్తావించబడిన నిబంధన పలకలు కాబట్టి నిర్దేశక భావానికి ‘ఆ’ వాడబడింది. ఈ వచనంలో ‘రాతి’ అనే పదం ప్రత్యక్షంగా లేదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: וָאַשְׁלִכֵם
  choice: వాటిని విసిరివేసి
  rationale: שלך అంటే విసరడం. ‘విసిరివేసి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఉద్దేశపూర్వకంగా చేతులనుంచి పడవేసిన చర్యను తెలియజేస్తుంది.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: నా రెండు చేతుల్లోనుంచి
  rationale: హీబ్రూ వాక్యభాగం అక్షరార్థంగా ‘నా రెండు చేతుల మీదనుంచి’ అని ఉంటుంది. ‘నా రెండు చేతుల్లోనుంచి’ చేతుల రెండింటిపైనా ఉన్న మూలపాఠ్య ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וָאֲשַׁבְּרֵם
  choice: వాటిని పగలగొట్టాను
  rationale: שׁבר యొక్క ప్రాథమిక అర్థం పగలగొట్టడం. రాతి పలకల సందర్భంలో ఫలితం బలంగా ఉన్నప్పటికీ, మూల క్రియలోని సాధారణ అర్థాన్ని అతిశయింపజేయకుండా ‘పగలగొట్టాను’ ఎంచుకోబడింది.
- source_word: לְעֵינֵיכֶם
  choice: మీ కళ్ల ఎదుట
  rationale: ఈ హీబ్రూ నుడికారం శ్రోతలు చూస్తుండగా లేదా వారి సమక్షంలో అని సూచిస్తుంది. ‘మీ కళ్ల ఎదుట’ మూలంలోని దృశ్యరూపాన్ని సహజంగా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలోని ‘రెండు చేతులు’ అనే ఉద్ఘాటనను నిలిపి, ఈ వచనంలో ప్రత్యక్షంగా లేని ‘రాతి’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
