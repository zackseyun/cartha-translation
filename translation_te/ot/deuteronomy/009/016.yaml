id: DEU.9.16
reference: Deuteronomy 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: te
  text: 'నేను చూశాను; ఇదిగో, మీరు మీ దేవుడైన యాహ్వేకు విరోధంగా పాపం చేశారు: మీ కోసం పోతపోసిన లోహపు దూడను[a] చేసుకున్నారు. యాహ్వే మీకు ఆజ్ఞాపించిన మార్గం నుండి మీరు త్వరగా తొలగిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరిగించిన లోహపు దూడను.” హీబ్రూ పదబంధం లోహాన్ని కరిగించి అచ్చులో పోసి చేసిన దూడ ప్రతిమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: నేను చూసినప్పుడు, ఇదిగో
  rationale: ראה యొక్క సాధారణ అర్థమైన ‘చూడు’ను నిలుపుతూ, הִנֵּה శ్రోత దృష్టిని ఆకర్షించే కథన సూచికగా ‘ఇదిగో’ అని అనువదించబడింది.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వేకు విరోధంగా పాపం చేశారు
  rationale: חטא + ל ఇక్కడ దేవునికి వ్యతిరేకంగా పాపం చేయడాన్ని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘విరోధంగా’ ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: మీ కోసం ... చేసుకున్నారు
  rationale: לָכֶם ప్రయోజనార్థక భావాన్ని ‘మీ కోసం’ తెలియజేస్తుంది; ‘చేసుకున్నారు’ ఆ కార్యం వారికోసమే జరిగినదని సహజ తెలుగులో బలపరుస్తుంది.
- source_word: עֵגֶל מַסֵּכָה
  choice: పోతపోసిన లోహంతో ఒక దూడను
  rationale: מַסֵּכָה లోహాన్ని కరిగించి అచ్చులో పోసి చేసిన ప్రతిమను సూచిస్తుంది; అనువాదం దాని పదార్థం, తయారీ విధానం రెండింటినీ స్పష్టం చేస్తుంది.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: మార్గం నుండి మీరు ఇంత త్వరగా తొలగిపోయారు
  rationale: సור + דרך లోని మార్గం నుంచి పక్కకు తొలగే నిబంధనా రూపకాన్ని నిలుపుతుంది; מַהֵרకు సందర్భానుగుణంగా ‘ఇంత త్వరగా’ సహజంగా ఉంది.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: యాహ్వే మీకు ఆజ్ఞాపించిన
  rationale: సంబంధ వాక్యాన్ని సహజ తెలుగు పదక్రమంలో ఉంచి, ఆ ‘మార్గం’ యాహ్వే ఆజ్ఞాపించినదని తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నిబంధనా నామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: ‘మార్గం’ అనే నిబంధనా రూపకం
  choice: మార్గం నుండి తొలగిపోయారు
  alternative: ఆజ్ఞను అతిక్రమించారు
  rationale: మూలంలోని דרך మరియు סור కలిగిన దృశ్యరూపాన్ని నిలుపుతూ, దాన్ని కేవలం సారాంశ theological ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. ‘ఇదిగో’ మూలంలోని దృష్టి-ఆకర్షక సూచికను నిలుపుతుంది. దైవ నామం ‘యాహ్వే’గా ఉంచబడింది; ‘మార్గం నుండి తొలగిపోవడం’ అనే మూల రూపకం పరిరక్షించబడింది.
