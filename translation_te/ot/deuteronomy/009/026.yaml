id: DEU.9.26
reference: Deuteronomy 9:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: te
  text: 'నేను యాహ్వేకు ప్రార్థించి ఇలా అన్నాను: “ప్రభువైన యాహ్వే, నీ ప్రజలను, నీ స్వాస్థ్యాన్ని నాశనం చేయవద్దు. నీ గొప్పతనం ద్వారా నీవు విమోచించిన వారిని, బలమైన చేతితో ఐగుప్తులోనుండి బయటకు తీసుకొచ్చిన వారిని నాశనం చేయవద్దు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל־יְהוָה וָאֹמַר
  choice: అప్పుడు నేను యెహోవాకు ప్రార్థిస్తూ ఇలా అన్నాను
  rationale: వావ్-క్రమం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ క్రమాన్ని సహజంగా చూపుతుంది; ‘ప్రార్థిస్తూ ఇలా అన్నాను’ ప్రార్థనలో పలికిన మాటలను తెలుగులో సులభంగా అనుసంధానిస్తుంది.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: అదోనాయ్ అనే అధికార బిరుదునూ, యెహోవా అనే ప్రత్యేక దైవనామాన్నీ రెండింటినీ నిలుపుతూ తెలుగులో అసహజమైన పునరుక్తిని నివారిస్తుంది.
- source_word: אַל־תַּשְׁחֵת
  choice: నాశనం చేయవద్దు
  rationale: నిషేధార్థక జస్సివ్ భావాన్నీ, שׁחת క్రియలోని తీవ్రతనూ నేరుగా తెలియజేస్తుంది.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: నీ ప్రజలను, నీ స్వాస్థ్యాన్ని
  rationale: נחלה ఇక్కడ యెహోవాకు చెందిన ప్రజలను ఆయనకు దక్కిన భాగం లేదా స్వాస్థ్యంగా సూచిస్తుంది. ‘స్వాస్థ్యం’ ఈ ఒడంబడిక సంబంధిత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: నీవు వారిని విమోచించావు
  rationale: פדה యొక్క విడుదల లేదా విడిపింపు భావానికి ‘విమోచించు’ తగినది. సంబంధవాచక సూచన వ్యాకరణపరంగా ‘ప్రజలు’ మరియు ‘స్వాస్థ్యం’ రెండింటికీ వెళ్లగలిగినా, తెలుగులో ‘వారిని’ ప్రజలనే స్పష్టంగా సూచిస్తూ అదే సమూహాన్ని కొనసాగిస్తుంది.
- source_word: בְּגָדְלֶךָ
  choice: నీ గొప్పతనంతో
  rationale: గొప్ప శక్తి అని వివరణాత్మకంగా విస్తరించకుండా, גֹּדֶל అనే నామవాచకంలోని ‘గొప్పతనం’ భావాన్ని సన్నిహితంగా కాపాడుతుంది.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: వారిని ఐగుప్తులోనుంచి బయటకు తీసుకొచ్చావు
  rationale: నిర్గమ సందర్భంలో הוציא కు సాధారణమైన ‘బయటకు తీసుకురావడం’ భావాన్ని నిలుపుతుంది.
- source_word: בְּיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: హీబ్రూ రూపకాన్ని, חזק యొక్క ప్రాథమిక ‘బలమైన’ భావాన్ని నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אֲדֹנָי יְהוִה అనే సంయుక్త సంబోధన
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన యాహ్వే
  rationale: אֲדֹנָי లోని ప్రభుత్వ బిరుదునూ, יְהוָה లోని ప్రత్యేక నామాన్నీ విడిచిపెట్టకుండా సహజమైన తెలుగు సంబోధనగా ఇచ్చాం.
- issue: నీవు విమోచించినవారు అనే సంబంధవాచకపు పరిధి
  choice: నీ ప్రజలు మరియు నీ స్వాస్థ్యం ఒకే సమూహాన్ని సూచిస్తున్నట్లు ‘వారిని’ అని అనువదించడం
  alternative: ‘దానిని’ అని స్వాస్థ్యాన్ని వ్యాకరణపరంగా ఏకవచనంగా కొనసాగించడం
  rationale: హీబ్రూలో עַם మరియు נַחֲלָה సమాంతరంగా ఇశ్రాయేలు ప్రజలనే సూచిస్తాయి. వ్యక్తుల సమూహాన్ని ఉద్దేశించిన ప్రార్థనలో తెలుగు ‘వారిని’ సహజంగా ఉంటుంది; రెండు పదాల మధ్య భావ సంబంధాన్ని ఇది విరిచివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రార్థనా ధోరణిని ఉంచుతూ సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు אֲשֶׁר ఉపవాక్యాలను తెలుగులో స్పష్టత కోసం రెండు సమన్విత వాక్యభాగాలుగా ఇచ్చాం. పాదటిప్పణులు అవసరం లేనందున గుర్తులు చేర్చలేదు.
