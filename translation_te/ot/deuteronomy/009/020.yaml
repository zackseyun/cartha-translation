source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: te
  text: యాహ్వే అహరోనుపట్ల కూడా అతన్ని నాశనం చేయాలనేంతగా ఎంతో కోపగించుకున్నాడు[a]. ఆ సమయంలో నేను అహరోను కోసం కూడా ప్రార్థించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహరోనుకు విరోధంగా.’ ఈ సందర్భంలో హీబ్రూ ఉపసర్గను రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: అహరోనుపట్ల కూడా
  rationale: కోపాన్ని సూచించే క్రియతో בְ సంబంధిత వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘అహరోనుపట్ల’ సహజంగా ఉండి, ‘అహరోనుకు విరోధంగా’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలుపుతుంది. వాక్యసందర్భంలో וּ־ను ‘కూడా’గా వ్యక్తపరచడం ముందటి ప్రజలపై కోపానికి అహరోనును జోడిస్తుంది.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: అత్యంత కోపగించాడు
  rationale: התאנף యొక్క తీవ్రమైన కోపభావాన్నీ, מאד ఇచ్చే బలాన్నీ సహజమైన ఆధునిక తెలుగులో కలిపి తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: לְהַשְׁמִידוֹ
  choice: అతన్ని నాశనం చేయాలనుకునేంతగా
  rationale: לְ అనే ప్రయోజన/ఫలిత సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, השמיד యొక్క తీవ్రమైన ‘నాశనం చేయు’ భావాన్ని కాపాడుతుంది.
- source_word: וָאֶתְפַּלֵּל
  choice: నేను ... ప్రార్థించాను
  rationale: פלל హిత్పయేల్‌కు ప్రాథమికమైన ‘ప్రార్థించు’ భావాన్ని ఉంచుతుంది; మధ్యవర్తిత్వ భావం ‘అహరోను కోసం’ ద్వారా స్పష్టమవుతుంది.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: అహరోను కోసం కూడా
  rationale: גם యొక్క చేర్పు భావాన్నీ, ప్రార్థనా సందర్భంలో בעד యొక్క ‘కోసం/పక్షంగా’ భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: చర్చలో ఉన్న అదే ఘటనను సూచించే కాలపదబంధానికి స్పష్టమైన ఆధునిక తెలుగు సమానం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా గుర్తించదగిన ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: అహరోనుతో/అహరోనుకు విరోధంగా కోపం అనే בְ భావం
  choice: అహరోనుపట్ల
  alternative: అహరోనుకు విరోధంగా
  rationale: కోపక్రియతో ఈ ఉపసర్గ సంబంధిత లక్ష్యాన్ని సూచిస్తుంది. ‘పట్ల’ సహజమైన తెలుగు; అయితే ‘విరోధంగా’ అనే దిశాత్మక ఛాయను పూర్తిగా తొలగించకుండా పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గంభీరమైన శైలి. ‘నాశనం చేయాలనుకునేంతగా’ అనే నిర్మాణం దైవకోప తీవ్రతను సహజంగా వ్యక్తపరుస్తుంది; పాదటిప్పణి మూలంలోని ఉపసర్గ సంబంధిత నిజమైన అనిశ్చితిని నిలుపుతుంది.
