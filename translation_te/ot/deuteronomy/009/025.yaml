  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: te
  text: అప్పుడు నేను యాహ్వే సన్నిధిలో ఆ నలభై పగళ్లు, నలభై రాత్రుల పాటు సాష్టాంగపడ్డాను[a], ఎందుకంటే మిమ్మల్ని నాశనం చేస్తానని యాహ్వే చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సన్నిధిలో నలభై పగళ్లు, నలభై రాత్రులు నేలపై బోర్లాపడ్డాను.” హీబ్రూ క్రియ విజ్ఞాపనలో ఉద్దేశపూర్వకంగా నేలపై పడటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: కాబట్టి నేను ... సాష్టాంగపడ్డాను
  rationale: התנפל అనే రూపం ఇక్కడ మోషే ప్రార్థనాపూర్వకంగా దేవుని ఎదుట నేలపై పడటాన్ని సూచిస్తుంది. ముందరి సందర్భంతో ఉన్న పరిణామ సంబంధాన్ని waw కారణంగా ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనేది ‘ఎదుట/సన్నిధిలో’ అనే స్థల-సంబంధ భావాన్ని ఇస్తుంది; יְהוָה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: నలభై పగళ్లు, నలభై రాత్రులు సాష్టాంగపడ్డాను
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా ప్రత్యక్ష కాలపదాలతో తెలిపాం. హీబ్రూలోని సంబంధవాక్య పునరుక్తి అదే కాలాన్ని తిరిగి సూచిస్తుంది; తెలుగులో దానిని మళ్లీ పదేపదే చెప్పకుండా పూర్తి భావాన్ని సహజంగా నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మోషే సాష్టాంగపడటానికి గల కారణాన్ని ఈ సంధి పరిచయం చేస్తుంది.
- source_word: אָמַר יְהוָה לְהַשְׁמִיד אֶתְכֶם
  choice: మిమ్మల్ని నాశనం చేస్తానని యెహోవా చెప్పాడు
  rationale: לְהַשְׁמִיד ఉద్దేశించిన కార్యాన్ని సూచిస్తుంది. ప్రత్యక్ష కర్త యెహోవాయే కనుక తెలుగు పరోక్ష వాక్యంలో ‘చేస్తానని’ సహజంగా ఉంటుంది; ‘నాశనం’ అర్థాన్ని అతిశయింపకుండా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో ప్రత్యేక దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం నామ స్వభావాన్ని నిలుపుతుంది; సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చలేదు.
- issue: మోషే భంగిమ యొక్క స్వభావం
  choice: సాష్టాంగపడ్డాను
  alternative: పడిపోయాను
  rationale: Hitpael రూపం సందర్భంలో అనుకోకుండా పడిపోవడం కంటే దేవుని ఎదుట ఉద్దేశపూర్వకంగా నేలపై పడి విజ్ఞాపన చేయడాన్ని సూచిస్తుంది. అయితే మధ్యవర్తిత్వం అనే భావాన్ని ప్రధాన వచనంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సాష్టాంగపడటం’ సాధారణ పాఠకులకు అర్థమయ్యే భక్తి-సంబంధ పదం; హీబ్రూ పునరుక్తిని తెలుగు వాక్య నిర్మాణంలో భారంగా కాకుండా సంక్షిప్తంగా అందించాం.
