id: DEU.9.15
reference: Deuteronomy 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וּ/שְׁנֵי֙ לֻחֹ֣ת הַ/בְּרִ֔ית עַ֖ל שְׁתֵּ֥י יָדָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: te
  text: అప్పుడు నేను వెనుదిరిగి కొండమీద నుంచి దిగివచ్చాను; కొండ అగ్నితో మండుతూ ఉంది[a]. నిబంధనకు చెందిన రెండు పలకలు నా రెండు చేతుల్లో ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “మరియు కొండ అగ్నితో మండుతూ ఉంది.” హీబ్రూ సంధిపదం సాధారణ సమన్వయాన్ని సూచించవచ్చు; సందర్భంలో మోషే దిగివస్తున్న సమయంలో కొండ మండుతున్నదనే ఏకకాల భావం కూడా సాధ్యమే.'
    reason: alternative_reading
  - marker: b
    text: 'అక్షరార్థంగా: “నా రెండు చేతుల మీద ఉన్నాయి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: అప్పుడు నేను వెనుదిరిగి
  rationale: פנה అనే క్రియ ఇక్కడ కథన క్రమంలో ‘తిరిగాను’ అని సూచిస్తుంది. ‘అప్పుడు’ వావ్-క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వెనుదిరిగి’ సందర్భంలోని దిశామార్పును స్పష్టం చేస్తుంది.
- source_word: וָאֵרֵד מִן הָהָר
  choice: కొండమీద నుంచి దిగివచ్చాను
  rationale: ירד అంటే ‘దిగడం’; מן ההר అంటే ‘కొండ నుంచి.’ ‘దిగివచ్చాను’ తెలుగు కథనంలో సహజంగా ఉండి, మోషే కొండపై నుంచి కిందికి వచ్చిన భావాన్ని అందిస్తుంది.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: కొండ అగ్నితో మండుతూ ఉంది
  rationale: בֹּעֵר అనేది కొనసాగుతున్న ‘మండుట’ను, בָּאֵשׁ ‘అగ్నితో/అగ్నిలో’ అనే భావాన్ని ఇస్తాయి. హీబ్రూ వְ సాధారణ సమన్వయాన్నీ, సందర్భానుసార పరిస్థితి లేదా ఏకకాల భావాన్నీ అనుమతిస్తుంది; తెలుగు వాక్య విభజన ఆ అస్పష్టతను అతిగా తీర్చదు.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: నిబంధనకు చెందిన రెండు పలకలు
  rationale: לֻחֹת అంటే ఈ సందర్భంలో రాతి పలకలు; הַבְּרִית అంటే ‘నిబంధన.’ ‘నిబంధనకు చెందిన పలకలు’ సహజమైన తెలుగులో సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל שְׁתֵּי יָדָי
  choice: నా రెండు చేతుల్లో ఉన్నాయి
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినప్పటికీ, ఇక్కడ పలకలను చేతులతో మోస్తున్న భావం. ‘చేతుల్లో’ తెలుగులో సహజమైన ప్రయోగం; שְׁתֵּי లోని స్పష్టమైన ‘రెండు’ను నిలుపుతుంది.
