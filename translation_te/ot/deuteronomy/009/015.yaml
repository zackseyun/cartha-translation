translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘రెండు చేతులు’ అనే స్పష్టతను, ‘అగ్నితో మండడం’ అనే బలమైన చిత్రణను నిలిపాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇచ్చాం.
