source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: te
  text: 'కాబట్టి ఈ రోజు తెలుసుకో: నీ దేవుడైన యెహోవాయే నీకు ముందుగా దాటి వెళ్లేవాడు[a]; ఆయన దహించే అగ్ని[b]. ఆయనే వారిని నాశనం చేసి, నీ ఎదుట వారిని అణచివేస్తాడు. నీవు వారిని వెళ్లగొట్టి[c], త్వరగా నశింపజేస్తావు, యెహోవా నీతో చెప్పినట్లే[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు ముందుగా వెళ్లేవాడు.” హెబ్రీ క్రియ ఇక్కడ యెహోవా ఇశ్రాయేలుకు ముందుగా దాటి వెళ్లడాన్ని సజీవంగా చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మింగివేసే అగ్ని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారిని వారి స్వాస్థ్యం నుండి తొలగించి.” ఈ క్రియలో వెళ్లగొట్టడం మరియు వారి భూమిని స్వాధీనం చేసుకోవడం రెండింటి భావమూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “యెహోవా నీతో పలికినట్లే.” ఇది ఇశ్రాయేలుతో ఆయన ముందుగా చెప్పిన మాటకు అనుగుణంగా జరుగుతుందని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: కాబట్టి ఈ రోజు తెలుసుకో
  rationale: ముందరి సందర్భంతో ఉన్న ఫలితాత్మక సంబంధాన్ని ‘కాబట్టి’ చూపిస్తుంది; ద్వితీయ ఏకవచన సంబోధనను సహజమైన ఆజ్ఞారూపంలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: ఆయనే నీకు ముందుగా దాటి వెళ్లేవాడు
  rationale: వర్తమాన క్రియావిశేషణంలోని సజీవ భావాన్నీ, ఇశ్రాయేలుకు ముందుగా దేశంలోకి దాటివెళ్లే దృశ్యాన్నీ నిలిపింది.
- source_word: אֵשׁ אֹכְלָה
  choice: దహించే అగ్ని
  rationale: దేవుని విధ్వంసకరమైన సన్నిధిని తెలిపే రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలిపింది.
- source_word: יַשְׁמִידֵם
  choice: వారిని నాశనం చేసి
  rationale: హిఫీల్ రూపంలోని బలమైన విధ్వంసార్థాన్ని తెలుపుతుంది.
- source_word: יַכְנִיעֵם
  choice: వారిని అణచివేస్తాడు
  rationale: యుద్ధ సందర్భంలో వారిని లోబరచి కిందికి దించే భావాన్ని ఇస్తుంది.
- source_word: וְהוֹרַשְׁתָּם
  choice: నీవు వారిని వెళ్లగొట్టి
  rationale: భూమి నుండి వారిని తొలగించి స్వాధీనం చేసుకునే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘స్వాస్థ్యభ్రష్టులను చేయడం’ కంటే సామాన్య పాఠకులకు స్పష్టం.
- source_word: וְהַאֲבַדְתָּם מַהֵר
  choice: త్వరగా నశింపజేస్తావు
  rationale: అבד హిఫీల్‌లోని కారక భావాన్నీ, מַהֵר తెలిపే వేగాన్నీ నిలిపింది; ముందున్న שׁמדకు వేరైన తెలుగు క్రియను వాడింది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: యెహోవా నీతో చెప్పినట్లే
  rationale: ముందుగా పలికిన దైవవాక్యాన్ని ‘వాగ్దానం’ అని మరింత నిర్దిష్టం చేయకుండా మూలంలోని సాధారణ ‘చెప్పాడు’ భావాన్ని కాపాడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన లిప్యంతరీకరణను ఎంచుకున్నప్పటికీ, ప్రత్యామ్నాయ ఉచ్చారణ సాధ్యమే.
- issue: אֵשׁ אֹכְלָה లోని దైవిక యుద్ధ రూపకం
  choice: దహించే అగ్ని
  alternative: మింగివేసే అగ్ని
  rationale: దేవుని పవిత్రత, తీర్పు, విధ్వంసకర సన్నిధి మధ్య ఉన్న ఉద్రిక్తతను తగ్గించకుండా రూపకంగానే ఉంచింది.
- issue: దైవ చర్య మరియు ఇశ్రాయేలు చర్య మధ్య సంబంధం
  choice: దేవుడు నాశనం చేసి అణచివేస్తాడు; ఇశ్రాయేలు వెళ్లగొట్టి నశింపజేస్తుంది
  alternative: అన్ని క్రియలనూ దేవుని చర్యగా కలిపి చెప్పడం
  rationale: మూలవచనం దేవుని కార్యాన్నీ ప్రజల కార్యాన్నీ పక్కపక్కనే ఉంచుతుంది; ఆ ఉద్రిక్తతను పరిష్కరించకుండా వ్యాకరణపరమైన కర్తల భేదాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. దైవనామాన్ని ‘యెహోవా’గా ఉంచి, హింసాత్మక మరియు దైవిక యుద్ధ భాషను మృదువుపరచలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
