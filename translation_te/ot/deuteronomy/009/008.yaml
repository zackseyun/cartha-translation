revisions:
- from: హోరేబులో కూడా మీరు యహ్వేకు కోపం పుట్టించారు; అప్పుడు యహ్వే మిమ్మల్ని నాశనం చేసేంతగా మీ మీద కోపగించాడు.[a]
  to: హోరేబులో కూడా మీరు యహ్వేకు కోపం పుట్టించారు; యహ్వే మిమ్మల్ని నాశనం చేయడానికి మీపై కోపపడ్డాడు.[a]
  rationale: The revision corrects the Telugu verb for Yahweh’s anger and keeps the infinitive clause closely attached to that anger. The footnote preserves the viable result/degree construal without changing the verse’s meaning or introducing an interpretive doctrinal claim.
  reviewer_model: gpt-5.6-terra
