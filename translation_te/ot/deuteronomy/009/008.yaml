  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: te
  text: హోరేబులో కూడా మీరు యహ్వేకు కోపం పుట్టించారు; యహ్వే మిమ్మల్ని నాశనం చేయడానికి మీపై కోపపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే మిమ్మల్ని నాశనం చేసేంతగా మీపై కోపపడ్డాడు.” హీబ్రూలో యహ్వే కోపానికీ మిమ్మల్ని నాశనం చేయడానికీ నేరుగా సంబంధం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: హోరేబులో కూడా
  rationale: וְ సందర్భాన్ని కొనసాగించడంతో పాటు ఇక్కడ ముందున్న తిరుగుబాటు ప్రస్తావనకు బలం చేకూరుస్తుంది; ‘కూడా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הִקְצַפְתֶּם
  choice: కోపం పుట్టించారు
  rationale: קצף హిఫీల్ రూపంలోని కారణార్థాన్ని, అంటే యహ్వేకు కోపం కలిగించేలా ప్రవర్తించారనే భావాన్ని, సహజంగా నిలుపుతుంది.
- source_word: אֶת־יְהוָה
  choice: యహ్వేకు
  rationale: దైవ నామమైన יהוהను ‘యహ్వే’గా లిప్యంతరీకరించి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చతుర్థీ విభక్తిని వాడాం.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: అప్పుడు యహ్వే ... మీ మీద కోపగించాడు
  rationale: אנף తీవ్రమైన కోపాన్ని సూచిస్తుంది; בָּכֶם యొక్క ప్రతికూల దిశను ‘మీ మీద’ స్పష్టంగా తెలియజేస్తుంది. וַ־ కథన ఫలితక్రమాన్ని ‘అప్పుడు’గా సహజీకరిస్తుంది.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: మిమ్మల్ని నాశనం చేసేంతగా
  rationale: తదనంతర לְ + హిఫీల్ క్రియారూపం కోపానికీ సంభవించబోయే నాశనానికీ నేర సంబంధం చూపుతుంది; ‘చేసేంతగా’ తెలుగు పాఠకుడికి ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది, అయితే ప్రత్యామ్నాయ ఉద్దేశ్యార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవ నామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని పేరుగానే నిలుపుతూ ‘యహ్వే’ అని లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
- issue: దైవ కోపానికీ నాశనానికీ మధ్య సంబంధం
  choice: నాశనం చేసేంతగా కోపగించాడు
  alternative: నాశనం చేయడానికి కోపగించాడు
  rationale: לְהַשְׁמִיד ఉద్దేశ్యం లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠంలో పరిమాణ/ఫలిత సంబంధాన్ని సహజంగా ఇచ్చి, ఉద్దేశ్యార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘హోరేబులో కూడా’ సందర్భంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘కోపం పుట్టించారు’ కారణార్థాన్ని, ‘కోపగించాడు’ తీవ్రమైన దైవ కోపాన్ని సహజంగా వ్యక్తపరుస్తాయి.
