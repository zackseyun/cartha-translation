id: DEU.9.10
reference: Deuteronomy 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: te
  text: దేవుని వేలితో రాయబడిన ఆ రెండు రాతి పలకలను యాహ్వే నాకు ఇచ్చాడు. సమాజం కూడిన రోజున పర్వతం మీద అగ్ని మధ్యలోనుంచి యాహ్వే మీతో పలికిన మాటలన్నీ వాటిమీద ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, తెలుగు లిపిలో దాని ఉచ్చారణకు సమీపంగా ఉంచింది.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు ఈ సందర్భంలో సహజమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: ఆ రెండు రాతి పలకలు
  rationale: నిర్దిష్టతను, సంఖ్యను, పలకల పదార్థాన్ని స్పష్టంగా మరియు సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: దేవుని వేలితో రాయబడిన
  rationale: మూలంలోని కర్మణి రూపాన్నీ, దేవుని చర్యను వర్ణించే సజీవమైన మానవరూపకాన్నీ వ్యాఖ్యానించి పలుచన చేయకుండా నిలుపుతుంది.
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: మాటలన్నీ వాటిమీద ఉన్నాయి
  rationale: హీబ్రూ వాక్యంలో స్పష్టంగా లేని అనుసంధాన క్రియను తెలుగులో సహజత కోసం ‘ఉన్నాయి’గా పూరిస్తూ, పలకలమీద ఉన్న సంపూర్ణ విషయాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: యాహ్వే మీతో పలికిన
  rationale: עִם అనే విభక్తి సూచించే ‘తో’ భావాన్ని నిలుపుతుంది; ‘మీకు చెప్పిన’ అని ఏకపక్ష ప్రసంగంగా సవరించదు.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యలోనుంచి
  rationale: ‘అగ్నినుంచి’ అని కుదించకుండా, మూలంలోని ‘మధ్యలోనుంచి’ అనే స్థల సంబంధమైన స్పష్టతను కాపాడుతుంది.
- source_word: בְּיוֹם הַקָּהָל
  choice: సమాజం కూడిన రోజున
  rationale: קהל సూచించే ప్రజల సమాహారాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ, ఆ ప్రత్యేక దినాన్ని గుర్తిస్తుంది.
theological_decisions:
- issue: దేవుని చర్యకు సంబంధించిన మానవరూపక వ్యక్తీకరణ
  choice: దేవుని వేలితో
  alternative: దేవుని శక్తితో / దేవుడే స్వయంగా
  rationale: మూలం ‘వేలు’ అనే స్పష్టమైన రూపకాన్ని ఉపయోగిస్తుంది. దాన్ని దాని భావార్థంగా మార్చకుండా, పాఠంలోని సజీవతను మరియు దైవిక చర్య గురించిన ఉద్వేగాన్ని నిలిపింది.
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: దేవుడు ఇశ్రాయేలీయులతో పలికిన విధానం
  choice: మీతో పలికిన
  alternative: మీకు చెప్పిన
  rationale: హీబ్రూలోని עִמָּכֶם అక్షరార్థంగా ‘మీతో’ అని ఉంటుంది. సందర్భంలో ‘మీకు’ సహజమైన భావం అయినప్పటికీ, మూలంలోని సంబంధాత్మక వ్యక్తీకరణను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగు సహజత కోసం ‘దేవుని వేలితో రాయబడిన’ అనే విశేషణ భాగాన్ని ముందుకు తెచ్చింది. అయినప్పటికీ మూలంలోని దైవ నామం, మానవరూపకం, ‘మీతో’ అనే భావం, అగ్ని మధ్యలోనుంచి పలికిన దృశ్యం అన్నీ నిలుపబడ్డాయి.
