  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: te
  text: “నన్ను వదిలేయి[a]; నేను వారిని నాశనం చేసి, ఆకాశాల కిందనుండి వారి పేరును తుడిచివేస్తాను[b]. నిన్ను వారికంటే బలమైన, వారికంటే ఎక్కువ జనసంఖ్యగల జాతిగా చేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నన్ను అడ్డుకోకు; నేను వారిని నాశనం చేసి, ఆకాశం కిందనుండి వారి పేరును తుడిచివేస్తాను.”'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఆకాశాల కిందనుండి”; ఈ పదబంధం భూమిమీద వారి ఉనికిని, మానవుల జ్ఞాపకంలో వారి పేరును తొలగించడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: నన్ను అడ్డుకోకు
  rationale: రפה అనే ఆజ్ఞారూపం מן + సర్వనామంతో ఇక్కడ ‘నన్ను చేయనివ్వు/అడ్డుపడకు’ అనే భావాన్ని ఇస్తుంది. ‘నన్ను అడ్డుకోకు’ సందర్భంలో మోషే మధ్యవర్తిత్వాన్ని సూచిస్తూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְאַשְׁמִידֵם
  choice: నేను వారిని నాశనం చేసి
  rationale: שׁמד పూర్తిగా నాశనం చేయడాన్ని సూచిస్తుంది. ముందున్న ఆజ్ఞతో దీని ఉద్దేశ్య-ఫలిత సంబంధం తెలుగులో వరుస క్రియల నిర్మాణం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: వారి పేరును తుడిచివేస్తాను
  rationale: מחה ఇక్కడ పేరును లేదా జ్ఞాపకాన్ని పూర్తిగా తొలగించే జాతీయాన్ని సూచిస్తుంది. ‘పేరును తుడిచివేయడం’ తెలుగు వాడుకలో స్పష్టమైన సమానార్థక నుడికారం.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: ఆకాశాల కింద నుండి
  rationale: మూలంలోని הַשָּׁמַיִם బహువచన రూపాన్ని ‘ఆకాశాలు’గా నిలుపుతూ, భూమిమీద ఉనికి నుండి తొలగించబడే భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: నిన్ను … జనంగా చేస్తాను
  rationale: עשה + కర్మ + ל నిర్మాణంలోని రూపాంతర భావాన్ని తెలుగులో ‘నిన్ను … జనంగా చేస్తాను’ సహజంగా తెలియజేస్తుంది.
- source_word: עָצוּם
  choice: బలమైనదిగా
  rationale: עָצוּם బలం లేదా శక్తిని సూచిస్తుంది. చివరి מִמֶּנּוּతో కూడిన పోలికను ‘వారికంటే బలమైనదిగా’ అని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: וָרָב
  choice: ఎక్కువ జనసంఖ్యగల
  rationale: ఈ సందర్భంలో רַב జనసంఖ్యలో గొప్పదనాన్ని సూచిస్తుంది. ‘ఎక్కువ జనసంఖ్యగల’ అనే రూపం పోలికను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: వారికంటే
  rationale: ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమష్టి జనంగా సూచిస్తుంది. తెలుగులో వ్యక్తుల సమూహాన్ని ఉద్దేశించి ‘వారికంటే’ అనడం సహజం; అది మూలంలోని సమష్టి సూచనను కాపాడుతుంది.
theological_decisions:
- issue: దేవుని తీర్పు ప్రకటన మరియు మోషేను గొప్ప జనంగా చేస్తాననే వాగ్దానం
  choice: తీర్పు హెచ్చరికను, మోషేకు చేసిన వాగ్దానాన్ని కథనంలోని నిజమైన ప్రత్యక్ష ప్రకటనగా సరళంగా అనువదించడం
  alternative: ఇది ప్రధానంగా మోషేకు పెట్టిన పరీక్ష లేదా కేవలం అలంకారిక ప్రకటన అని అనువాదంలోనే సూచించడం
  rationale: హీబ్రూ పాఠ్యం తీర్పు మరియు వాగ్దానాన్ని ప్రత్యక్ష దైవవాక్యంగా అందిస్తుంది. ఇది పరీక్షా, అలంకారికమా అనే వ్యాఖ్యానాన్ని అనువాదం ముందుగానే నిర్ణయించకుండా, పాఠ్యంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష వాక్య శైలిని వాడాం. ‘జనం’ కంటే రాజకీయ-జాతి సమూహాన్ని సూచించే ‘జనంగా’ను ఎంచుకున్నాం. మూలంలోని బహువచన ‘ఆకాశాలు’ను ప్రధాన పాఠ్యంలో నిలిపి, దాని నుడికార భావాన్ని పాదటిప్పణిలో వివరించాం.
