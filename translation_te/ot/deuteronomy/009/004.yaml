revisions:
- from: నీ దేవుడైన యెహోవా వారిని నీ ఎదుట నుండి వెళ్లగొట్టినప్పుడు, ‘నా నీతిని బట్టే యెహోవా ఈ దేశాన్ని స్వాధీనం చేసుకోవడానికి నన్ను ఇక్కడికి తీసుకొచ్చాడు’ అని నీ హృదయంలో అనుకోవద్దు.[a] ఈ జనాల దుష్టత్వాన్ని బట్టే యెహోవా వారిని నీ ఎదుట నుండి వెళ్లగొడుతున్నాడు.
  to: నీ దేవుడైన యాహ్వే వారిని నీ ఎదుటనుండి తరిమివేసినప్పుడు, నీ హృదయంలో ఇలా అనుకోవద్దు:[a] ‘నా నీతి కారణంగా యాహ్వే ఈ దేశాన్ని స్వాధీనం చేసుకునేలా నన్ను తీసుకొచ్చాడు; ఈ జనాల దుష్టత్వం కారణంగానే యాహ్వే వారిని నీ ఎదుటనుండి వెళ్లగొడుతున్నాడు.’
  rationale: The revision aligns the divine name with the required Yahweh rendering, keeps the whole prohibited self-justifying claim within the quoted inner speech, and removes the unexpressed deictic “ఇక్కడికి” while retaining the Hebrew purpose of entering to possess the land.
