source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే వారిని నీ ఎదుటనుండి తరిమివేసినప్పుడు, నీ హృదయంలో ఇలా అనుకోవద్దు:[a] ‘నా నీతి కారణంగా యాహ్వే ఈ దేశాన్ని స్వాధీనం చేసుకునేలా నన్ను తీసుకొచ్చాడు; ఈ జనాల దుష్టత్వం కారణంగానే యాహ్వే వారిని నీ ఎదుటనుండి వెళ్లగొడుతున్నాడు.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ హృదయంలో చెప్పుకోవద్దు.” హీబ్రూలో “హృదయంలో చెప్పడం” అనేది తనలో తాను ఆలోచించుకోవడం లేదా చెప్పుకోవడం అనే అర్థంలో వాడబడుతుంది.
    reason: idiom_clarification
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: నీ హృదయంలో అనుకోవద్దు
  rationale: నిషేధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, לֵבָב అనే ‘హృదయం’ రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఇది అంతరంగపు ఆలోచన లేదా తనలో తాను చెప్పుకోవడం.
- source_word: בַּהֲדֹף ... אֹתָם מִלְּפָנֶיךָ
  choice: వారిని నీ ఎదుట నుండి వెళ్లగొట్టినప్పుడు
  rationale: ב తో కూడిన infinitive construct కాలసూచకంగా ‘అప్పుడు’ అనే భావాన్ని ఇస్తుంది; נדף బలవంతంగా తరిమివేయడాన్ని సూచిస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరిస్తూ, ఒడంబడిక సంబంధాన్ని తెలిపే ‘నీ దేవుడు’ అనే భావాన్ని సహజమైన తెలుగు నిర్మాణంలో ఉంచుతుంది.
- source_word: בְּצִדְקָתִי
  choice: నా నీతిని బట్టే
  rationale: צְדָקָה ఇక్కడ ఇశ్రాయేలు తనకుందని ఊహించుకునే నైతిక నీతి లేదా అర్హతను సూచిస్తుంది. ‘బట్టే’ కారణార్థంతో పాటు ఆ తప్పుడు స్వీయవాదంలోని నొక్కిచెప్పడాన్ని కూడా సహజంగా తెలియజేస్తుంది.
- source_word: הֱבִיאַנִי
  choice: నన్ను ఇక్కడికి తీసుకొచ్చాడు
  rationale: బוא హిఫిల్ రూపం ‘నన్ను ప్రవేశింపజేశాడు/తీసుకొచ్చాడు’ అని అర్థం. తెలుగు స్పష్టత కోసం దేశప్రవేశ సందర్భాన్ని ‘ఇక్కడికి’ సూచిస్తుంది.
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ సందర్భానుసారం స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం, లేదా ఇతరులను స్వాధీనస్థానం నుండి తొలగించడం అనే అర్థాలు కలిగి ఉంటుంది. ఇక్కడ దేశంలోకి ప్రవేశించి దాన్ని పొందడం ప్రధాన భావం.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాల దుష్టత్వాన్ని బట్టే
  rationale: వావ్ ముందటి తప్పుడు వాదానికి విరుద్ధమైన నిజ కారణాన్ని ప్రవేశపెడుతుంది. తెలుగులో కొత్త వాక్యంగా ఉంచి ‘బట్టే’ ద్వారా ఆ వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: వారిని నీ ఎదుట నుండి వెళ్లగొడుతున్నాడు
  rationale: ירשׁ హిఫిల్ ఇక్కడ ఆ జనాలను వారి స్వాధీనభూమి నుండి తొలగించడం లేదా వెళ్లగొట్టడం. ‘నీ ఎదుట నుండి’ ముఖం/సన్నిధి అనే మూల స్థలరూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఇస్తుంది.
- issue: దేశాన్ని ఇశ్రాయేలు తన నీతివల్ల సంపాదించుకున్నదనే భావం
  choice: ‘నా నీతిని బట్టే’ అనే ఇశ్రాయేలు అంతరంగ వాదాన్ని యథాతథంగా ఉంచి, తరువాతి వాక్యంలో దానికి విరుద్ధమైన కారణాన్ని చెప్పడం
  alternative: ‘నేను మంచివాడిని కాబట్టి’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలంలోని צְדָקָה అనే ధార్మికంగా ప్రాధాన్యమున్న పదాన్ని నిలుపుతూ, మోషే తిరస్కరిస్తున్న అర్హతాధారిత వాదాన్ని మృదువుచేయదు.
- issue: వావ్ సూచించే తార్కిక సంబంధం
  choice: మొదటి వాక్యానికి విరుద్ధమైన నిజ కారణంగా రెండవ వాక్యాన్ని ఉంచడం
  alternative: ‘మరియు’తో కేవలం సమన్వయ సంబంధంగా అనువదించడం
  rationale: ఇశ్రాయేలు నీతి కారణమనే తప్పుడు నిర్ణయానికి ప్రతిగా జనాల దుష్టత్వం కారణమని సందర్భం చూపుతుంది; అయినా దేవుని చర్యకు సంబంధించిన విస్తృత కారణాలన్నిటినీ ఈ వాక్యం ఒక్కటే పూర్తిగా నిర్వచిస్తుందని అదనంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘నీతి,’ ‘దుష్టత్వం,’ ‘స్వాధీనం’ వంటి మూలభావానికి ప్రాముఖ్యమైన పదాలను నిలిపి, హీబ్రూ వాక్యనిర్మాణాన్ని సహజమైన రెండు తెలుగు వాక్యాలుగా అమర్చాం.
