review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, inward-speech idiom, claimed righteousness, and the nations’ wickedness. However, it renders יהוה as “యెహోవా” (Jehovah), whereas the stipulated source/audit rendering is Yahweh, best represented here as “యాహ్వే.” Also, the Hebrew presents both causal assertions as the content of the prohibited inner statement; enclosing both in the quotation preserves that syntax and contrast.
  naturalness: The revised wording is modern, clear Telugu. “తరిమివేసినప్పుడు” naturally renders the temporal conquest circumstance, and “స్వాధీనం చేసుకునేలా నన్ను తీసుకొచ్చాడు” expresses the purposive land-entry sense without adding “ఇక్కడికి.”
  terminology: “నీతి,” “దుష్టత్వం,” and “స్వాధీనం చేసుకోవడం” suitably retain the key Hebrew concepts. “యాహ్వే” consistently represents the personal divine name rather than the traditional Jehovah-form or a title substitution.
  issues:
  - severity: medium
    issue: The divine name is rendered “యెహోవా.”
    rationale: The audit trail specifies “Yahweh,” not “Jehovah.” “యాహ్వే” is the appropriate Telugu transliteration for the specified rendering.
  - severity: low
    issue: The second causal clause stands outside the quoted inner statement.
    rationale: In Hebrew, both “because of my righteousness …” and “because of the wickedness of these nations …” are introduced as what Israel must not say in its heart. Keeping both inside one quotation more closely preserves the source discourse structure.
  - severity: low
    issue: “నన్ను ఇక్కడికి తీసుకొచ్చాడు” adds a deictic element not expressed in the Hebrew.
    rationale: The source says that Yahweh brought the speaker in, with possession of this land as the purpose. A purposive Telugu construction conveys this without the added “here.”
  revised_text: నీ దేవుడైన యాహ్వే వారిని నీ ఎదుటనుండి తరిమివేసినప్పుడు, నీ హృదయంలో ఇలా అనుకోవద్దు:[a] ‘నా నీతి కారణంగా యాహ్వే ఈ దేశాన్ని స్వాధీనం చేసుకునేలా నన్ను తీసుకొచ్చాడు; ఈ జనాల దుష్టత్వం కారణంగానే యాహ్వే వారిని నీ ఎదుటనుండి వెళ్లగొడుతున్నాడు.’
  revised_footnotes:
  - marker: a
    text: లేదా, “నీ హృదయంలో చెప్పుకోవద్దు.” హీబ్రూలో “హృదయంలో చెప్పడం” అనేది తనలో తాను ఆలోచించుకోవడం లేదా చెప్పుకోవడం అనే అర్థంలో వాడబడుతుంది.
    reason: idiom_clarification
