  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: te
  text: వారి దేశాన్ని స్వాధీనం చేసుకోవడానికి నువ్వు ప్రవేశిస్తున్నది నీ నీతివల్లగానీ, నీ హృదయ యథార్థతవల్లగానీ కాదు. ఈ జనాంగాల దుష్టత్వం వల్ల నీ దేవుడైన యాహ్వే వారిని నీ ఎదుటనుండి వెళ్లగొడుతున్నాడు[a]; అలాగే, యాహ్వే నీ పితరులకు[c]—అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు—ప్రమాణం చేసిన మాటను[b] నిలబెట్టడానికి ఇలా చేస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని నీ ఎదుటనుండి దేశాధికారాన్ని కోల్పోయేలా చేస్తున్నాడు.’ హీబ్రూ క్రియ వారిని కేవలం వెళ్లగొట్టడమే కాక, దేశంపై వారి స్వాధీనాన్ని పోగొట్టడాన్ని కూడా నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యాహ్వే ప్రమాణం చేసిన వాగ్దానాన్ని.’ ఇక్కడ ‘మాట’ అనే హీబ్రూ పదం ప్రమాణ సందర్భంలో వాగ్దానంగా ఇచ్చిన మాట అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘నీ పితరులు’ అనేది వెంటనే పేర్లు చెప్పబడిన అబ్రాహాము, ఇస్సాకు, యాకోబులను ప్రత్యేకంగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: నీ నీతిని బట్టి
  rationale: బְ ఉపసర్గం ఇక్కడ కారణాన్ని సూచిస్తుంది; ఇశ్రాయేలు నీతి దేశ స్వాధీనానికి కారణం కాదని నిరాకరణ స్పష్టం చేస్తుంది.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: నీ హృదయ యథార్థతను బట్టి
  rationale: יֹשֶׁר యొక్క నిటారుతనం/నైతిక సమగ్రత భావాన్ని, לֵבָב సూచించే అంతరంగ నైతిక స్వభావంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָא לָרֶשֶׁת
  choice: స్వాధీనం చేసుకోవడానికి ప్రవేశించడం
  rationale: בוא కదలికను, לָרֶשֶׁת ప్రవేశపు ఉద్దేశాన్ని సూచిస్తాయి; దేశంలోకి ప్రవేశించి దాన్ని స్వాధీనం చేసుకునే భావం నిలుస్తుంది.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాల దుష్టత్వాన్ని బట్టే
  rationale: רִשְׁעָה నైతిక దుష్టత్వం/దోషాన్ని సూచిస్తుంది; בְ ఇక్కడ కారణార్థకం. ‘బట్టే’ ముందటి నిరాకరణతో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: వారిని నీ ఎదుట నుంచి వెళ్లగొడుతున్నాడు
  rationale: ירשׁ హిఫిల్ రూపం వారిని దేశాధికారంనుంచి తొలగించడం లేదా వెళ్లగొట్టడం అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠ్యంలో సహజమైన ఫలితార్థాన్ని ఇచ్చి, స్వాధీనం కోల్పోయే సూక్ష్మభావాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּלְמַעַן הָקִים
  choice: నిలబెట్టడానికి
  rationale: לְמַעַן ఉద్దేశాన్ని సూచిస్తుంది; ప్రమాణ సందర్భంలో הקים మాటను స్థిరపరచడం, నెరవేర్చడం అనే భావం ఇస్తుంది.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: ప్రమాణం చేసిన మాట
  rationale: דָּבָר యొక్క మూల ‘మాట’ భావాన్ని నిలుపుతూ, נִשְׁבַּע వల్ల అది ప్రమాణపూర్వక వాగ్దానమని సందర్భమే తెలియజేస్తుంది.
- source_word: לַאֲבֹתֶיךָ
  choice: నీ పితరులకు
  rationale: వెంటనే పేర్లు చెప్పబడిన అబ్రాహాము, ఇస్సాకు, యాకోబులను సూచించే పురుష బహువచన సంబంధపదాన్ని ఖచ్చితంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు దేశాన్ని స్వాధీనం చేసుకోవడానికి గల కారణం
  choice: ఇశ్రాయేలు నీతి కారణం కాదని నిరాకరించి, జనాల దుష్టత్వం మరియు పితరులకు యాహ్వే చేసిన ప్రమాణాన్ని నిలబెట్టడం అనే రెండు కారణాలనూ పాఠ్యం చెబుతుంది.
  alternative: జనాల దుష్టత్వాన్ని మాత్రమే లేదా నిబంధన వాగ్దానాన్ని మాత్రమే ఏకైక కారణంగా ముందుకు తేవడం.
  rationale: హీబ్రూ పాఠ్యంలో כִּי అనే కారణ వాక్యభాగమూ, וּלְמַעַן అనే ఉద్దేశ వాక్యభాగమూ రెండూ ఉన్నాయి; ఒకదాన్ని మరొకదిలో కలపకుండా రెండింటినీ నిలిపింది.
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలంలో వ్యక్తిగత నామం నేరుగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా సాధ్యమైన ధ్వన్యనుకరణతో అందించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఏకవచన సంబోధనను వాడింది. ‘నీతి,’ ‘యథార్థత,’ ‘స్వాధీనం,’ ‘పితరులు’ వంటి పదాలు మూల భావానికి సమీపంగా ఉండి బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతాయి. ప్రధాన వాక్యంలోని దీర్ఘ హీబ్రూ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించినా, నిరాకరణ, కారణం, ఉద్దేశం మధ్య సంబంధాన్ని కాపాడింది.
