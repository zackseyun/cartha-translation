revisions:
- from: నీ నీతిని బట్టిగానీ, నీ హృదయ యథార్థతను బట్టిగానీ నువ్వు వారి దేశాన్ని స్వాధీనం చేసుకోవడానికి ప్రవేశించడం లేదు. ఈ జనాల దుష్టత్వాన్ని బట్టే నీ దేవుడైన యాహ్వే వారిని నీ ఎదుట నుంచి వెళ్లగొడుతున్నాడు[a]; అలాగే యాహ్వే నీ పితరులకు[c]—అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు—ప్రమాణం చేసిన మాటను[b] నిలబెట్టడానికి ఇలా చేస్తున్నాడు.
  to: వారి దేశాన్ని స్వాధీనం చేసుకోవడానికి నువ్వు ప్రవేశిస్తున్నది నీ నీతివల్లగానీ, నీ హృదయ యథార్థతవల్లగానీ కాదు. ఈ జనాంగాల దుష్టత్వం వల్ల నీ దేవుడైన యాహ్వే వారిని నీ ఎదుటనుండి వెళ్లగొడుతున్నాడు[a]; అలాగే, యాహ్వే నీ పితరులకు[c]—అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు—ప్రమాణం చేసిన మాటను[b] నిలబెట్టడానికి ఇలా చేస్తున్నాడు.
  rationale: The opening has been revised so that ‘కాదు’ negates the proposed grounds (‘నీ నీతివల్లగానీ ... యథార్థతవల్లగానీ’) rather than the act of entering. The remainder preserves the Hebrew sequence, including Yahweh’s removal of the nations and the purpose of confirming his sworn word to Abraham, Isaac, and Jacob. Footnote a was made more idiomatic while preserving the dispossession nuance.
