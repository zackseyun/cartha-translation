revisions:
- from: ఎందుకంటే, మిమ్మల్ని నాశనం చేయడానికి యెహోవా మీ మీద రగులుకొన్న కోపాగ్రహాలకు నేను భయపడ్డాను. అయితే ఆ సమయంలో కూడా యెహోవా నా మొర ఆలకించాడు.[a]
  to: ఎందుకంటే, మిమ్మల్ని నాశనం చేయడానికి యెహోవా మీపై కోపగించిన కోపాన్ని, ఉగ్రతను బట్టి నేను భయపడ్డాను. అయితే ఆ సమయంలో కూడా యెహోవా నా మాట ఆలకించాడు.[a]
  rationale: The revision preserves the Hebrew sequence and repeated anger language more explicitly, avoids adding 'plea' as the object of hearing, and retains the contextual nuance in a properly qualified footnote.
