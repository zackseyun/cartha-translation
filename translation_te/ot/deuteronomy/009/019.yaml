source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: te
  text: ఎందుకంటే, మిమ్మల్ని నాశనం చేయడానికి యెహోవా మీపై కోపగించిన కోపాన్ని, ఉగ్రతను బట్టి నేను భయపడ్డాను. అయితే ఆ సమయంలో కూడా యెహోవా నా మాట ఆలకించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో: “యెహోవా నా మాట విన్నాడు.” ఈ సందర్భంలో ఇది మోషే చేసిన మధ్యవర్తిత్వానికి యెహోవా అనుకూలంగా స్పందించాడనే భావాన్ని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: నేను భయపడ్డాను
  rationale: ఈ క్రియ భయం లేదా బెదురు భావాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా, నేరుగా ఉంది.
- source_word: מִפְּנֵי הָאַף וְהַחֵמָה
  choice: కోపాగ్రహాలకు
  rationale: హీబ్రూలోని రెండు సమీపార్థక తీవ్ర కోపపదాల సంయుక్త బలాన్ని తెలుగు జంటపదమైన ‘కోపాగ్రహాలు’ సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: యెహోవా మీ మీద రగులుకొన్న
  rationale: קצף తెలిపే తీవ్రమైన కోపాన్ని ‘రగులుకొన్న’ వ్యక్తం చేస్తుంది; עֲלֵיכֶםను ‘మీ మీద’గా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంలో దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: మిమ్మల్ని నాశనం చేయడానికి
  rationale: హిఫీల్ క్రియలోని నిర్మూలన భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: అయితే ... యెహోవా నా మొర ఆలకించాడు
  rationale: మధ్యవర్తిత్వ సందర్భంలో שׁמע אֶל కేవలం శబ్దం వినడమే కాక అనుకూలంగా వినడాన్ని సూచిస్తుంది; ‘నా మొర’ సందర్భస్పష్టీకరణ అయినందున ప్రత్యక్ష పదార్థాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: ఆ సమయంలో కూడా
  rationale: గַּם యొక్క అదనపు భావాన్ని, సూచించిన గత సందర్భాన్ని సహజ తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: దైవకోపపు తీవ్రత
  choice: మీ మీద రగులుకొన్న కోపాగ్రహాలు
  alternative: మీ మీద కలిగిన కోపం, ఉగ్రత
  rationale: אַף, חֵמָה, קצף అనే మూడు కోపసూచక అంశాల తీవ్రతను తగ్గించకుండా, కృత్రిమ పునరుక్తి లేకుండా తెలుగులో వ్యక్తం చేస్తుంది.
- issue: మోషే ప్రార్థనకు దైవ ప్రతిస్పందన
  choice: నా మొర ఆలకించాడు
  alternative: నా మాట విన్నాడు
  rationale: సందర్భం మోషే మధ్యవర్తిత్వం కనుక అనుకూల ప్రతిస్పందన భావాన్ని తెలిపాం; అయితే మూలంలోని సాధారణ ‘నా వైపు విన్నాడు/నా మాట విన్నాడు’ భావాన్ని పాదటిప్పణిలో ఉంచి అతివ్యాఖ్యానాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని తీవ్రమైన కోపభాషను నిలిపి, మధ్యవర్తిత్వ సందర్భాన్ని స్వల్పంగా స్పష్టీకరించాం.
