id: DEU.9.24
reference: Deuteronomy 9:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: te
  text: నేను మిమ్మల్ని తెలుసుకున్న రోజు నుంచి మీరు యహ్వేకు విరోధంగా తిరుగుబాటు చేస్తూనే ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְרִים
  choice: తిరుగుబాటు చేస్తూనే ఉన్నారు
  rationale: מרה అనే మూలం అధికారాన్ని ఎదిరించడం, అవిధేయంగా తిరుగుబాటు చేయడం అనే భావాన్ని ఇస్తుంది. הֱיִיתֶםతో కలిసి ఇది గతం నుంచి కొనసాగుతున్న స్వభావాన్ని సూచిస్తున్నందున ఈ తెలుగు రూపం సహజంగా ఆ నిరంతర భావాన్ని తెలియజేస్తుంది.
- source_word: הֱיִיתֶם
  choice: చేస్తూనే ఉన్నారు
  rationale: היה యొక్క రెండవ పురుష బహువచన సంపూర్ణ రూపం ఇక్కడ గతకాలం నుంచి ప్రసంగ సమయం వరకు కొనసాగిన ప్రవర్తనను సంగ్రహిస్తుంది.
- source_word: עִם
  choice: విరోధంగా
  rationale: పదశః ‘తో’ అయినప్పటికీ, מרהతో ఉన్న ఈ సందర్భంలో యహ్వేను ఎదిరించడం అనే విరోధార్థం వస్తుంది. ‘విరోధంగా’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా లిప్యంతరీకరించాం.
- source_word: מִיּוֹם
  choice: నాటి నుంచి
  rationale: ఆరోపణలో పేర్కొన్న ప్రవర్తన మొదలైన కాలబిందువును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: דַּעְתִּי
  choice: నేను ... ఎరిగిన
  rationale: ידע యొక్క రూపాన్ని నేరుగా అనుసరిస్తూ, మోషే ఇశ్రాయేలీయులతో పరిచయం ఏర్పడినప్పటి నుంచి అనే సంబంధార్థాన్ని నిలుపుతుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన రెండవ పురుష బహువచన ప్రత్యయాన్ని సహజమైన తెలుగు కర్మరూపంలో అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: עִם యొక్క సంబంధార్థం
  choice: యహ్వేకు విరోధంగా
  alternative: యహ్వేతో
  rationale: పదశః ‘తో’ అనే అర్థం ఉన్నా, ‘తిరుగుబాటు చేయడం’తో కలిసినప్పుడు యహ్వేను ఎదిరించడం అనే భావం సందర్భానికి సరిపోతుంది. మూలంలోని అసాధారణ నిర్మాణాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడాం. ‘ఎరిగిన’ అనే పదం కొంత గంభీరమైనదైనా, ఇక్కడ వ్యక్తిగత పరిచయ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; నిరంతర తిరుగుబాటును ‘చేస్తూనే ఉన్నారు’తో వ్యక్తం చేశాం.
