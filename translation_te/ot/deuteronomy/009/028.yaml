revisions:
- from: లేకపోతే, నీవు మమ్మల్ని బయటకు తీసుకొచ్చిన దేశం[a], ‘యాహ్వే వారికి వాగ్దానం చేసిన దేశంలోకి[b] వారిని తీసుకురాగల సామర్థ్యం లేకపోవడం వల్ల, ఆయన వారిని ద్వేషించడం వల్ల, అరణ్యంలో వారిని చంపడానికి బయటకు తీసుకొచ్చాడు’ అని అంటుంది.
  to: లేకపోతే, నీవు మమ్మల్ని బయటకు తీసుకొచ్చిన దేశం[a], ‘యాహ్వే వారిని, ఆయన వారికి వాగ్దానం చేసిన[b] దేశంలోకి తీసుకురాలేకపోవడం వల్ల, అలాగే ఆయన వారిని ద్వేషించడం వల్ల, అరణ్యంలో వారిని చంపడానికి వారిని బయటకు తీసుకొచ్చాడు’ అని అంటుంది.
  rationale: పాదసూచిక [b]లో హీబ్రూ దత్తివాచకమైన לָהֶםను సరిగ్గా ‘వారికి’గా సవరించాం. ప్రధాన పాఠ్యంలో ‘తీసుకురాలేకపోవడం వల్ల’ అనే సహజమైన నిర్మాణాన్ని వాడి, యాహ్వే ఇశ్రాయేలీయులను వాగ్దాన దేశంలోకి తీసుకురాలేడని ఇతరులు ఆరోపిస్తారనే భావాన్ని స్పష్టంగా ఉంచాం. రెండు కారణాలను సూచించే హీబ్రూ నిర్మాణం, ‘దేశం’ అనే లక్షణార్థ ప్రయోగం, మరియు అరణ్యంలో చంపడానికే బయటకు తీసుకొచ్చాడనే ఉద్దేశభావం అన్నీ నిలుపబడ్డాయి.
