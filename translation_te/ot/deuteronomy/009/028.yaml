source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: te
  text: లేకపోతే, నీవు మమ్మల్ని బయటకు తీసుకొచ్చిన దేశం[a], ‘యాహ్వే వారిని, ఆయన వారికి వాగ్దానం చేసిన[b] దేశంలోకి తీసుకురాలేకపోవడం వల్ల, అలాగే ఆయన వారిని ద్వేషించడం వల్ల, అరణ్యంలో వారిని చంపడానికి వారిని బయటకు తీసుకొచ్చాడు’ అని అంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీవు మమ్మల్ని బయటకు తీసుకొచ్చిన దేశం.” ఇక్కడ “దేశం” అంటే ఆ దేశ నివాసులు.
    reason: cultural_note
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఆయన వారికి చెప్పిన దేశంలోకి” (అంటే, ఆ దేశం గురించి వారికి చెప్పినది).
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: లేకపోతే
  rationale: దేవుని తీర్పు జరిగితే ఇతరులు పలికే అపవాదును గురించి మోషే వ్యక్తం చేస్తున్న ఆందోళనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: నీవు మమ్మల్ని బయటకు తీసుకొచ్చిన దేశం
  rationale: హీబ్రూ వాక్యంలోని ‘దేశం’ అనే రూపాన్ని నిలుపుతుంది; అది ఆ దేశ నివాసులను సూచించే లక్షణార్థ ప్రయోగమని పాదసూచిక వివరిస్తుంది.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: యాహ్వే ... తీసుకురాగల సామర్థ్యం లేకపోవడం వల్ల
  rationale: ఈ నిర్మాణం అసమర్థతను కారణంగా చూపుతుంది. ఇది ఆ దేశస్థులు పలికే అపవాదు మాత్రమేనని వాక్యంలోని ఉద్ధరణ స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: వారికి వాగ్దానం చేసిన దేశంలోకి
  rationale: అక్షరార్థంగా ‘వారితో చెప్పిన’ అనే మాట covenant సందర్భంలో వారికి ఇవ్వనున్న దేశం గురించి చేసిన వాగ్దానాన్ని సూచిస్తుంది; పాదసూచిక అక్షరార్థ ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: ఆయన వారిని ద్వేషించడం వల్ల
  rationale: హీబ్రూ కారణార్థక నిర్మాణాన్ని ప్రత్యక్షంగా ఉంచి, ద్వేషమే నిర్గమనానికి ఉద్దేశమని ఇతరులు ఆరోపించే భావాన్ని కాపాడుతుంది.
- source_word: הוֹצִיאָם
  choice: బయటకు తీసుకొచ్చాడు
  rationale: వాక్యం మొదట్లోని నిర్గమన క్రియతో పదసంబంధాన్ని నిలుపుతూ నిర్గమన ఘట్టాన్ని ప్రతిధ్వనింపజేస్తుంది.
- source_word: לַהֲמִתָם בַּמִּדְבָּר
  choice: అరణ్యంలో వారిని చంపడానికి
  rationale: מות హిఫీల్ క్రియలోని కారణార్థాన్ని స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తుంది; מִדְבָּר‌కు సందర్భోచితమైన ‘అరణ్యం’ వాడింది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని అలాగే సూచించి, దానిని సాధారణ బిరుదుగా మార్చలేదు.
- issue: דִּבֶּר לָהֶם ను అక్షరార్థంగా అనువదించాలా, సందర్భార్థంగా అనువదించాలా
  choice: వారికి వాగ్దానం చేసిన
  alternative: వారితో చెప్పిన; వారికి దాని గురించి చెప్పిన
  rationale: దేశాన్ని ఇస్తానని దేవుడు చేసిన నిబంధనా వాగ్దానమే సందర్భంలో ఉద్దేశించబడింది. అయినా హీబ్రూ క్రియ అక్షరార్థాన్ని పాదసూచికలో చూపించి భావవిస్తరణను పారదర్శకంగా ఉంచింది.
- issue: యాహ్వేకు సామర్థ్యం లేదని, ఆయన ఇశ్రాయేలును ద్వేషించాడని వాక్యం చెబుతున్నట్టు కనిపించే ఉద్రిక్తత
  choice: ఆ ఆరోపణలను ప్రత్యక్ష ఉద్ధరణలో యథాతథంగా ఉంచడం
  alternative: అవి అబద్ధ ఆరోపణలని ప్రధాన వాక్యంలో వివరణ చేర్చడం
  rationale: ఇవి మోషే ఊహిస్తున్న విదేశీయుల మాటలు. మూలంలోని వాక్చాతుర్యాన్ని, దైవశాస్త్రీయ ఉద్రిక్తతను అదనపు వ్యాఖ్యతో సడలించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ‘దేశం అంటుంది’ అనే లక్షణార్థ ప్రయోగం ప్రధాన పాఠ్యంలో నిలుపబడింది. [a], [b] సూచికలు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
