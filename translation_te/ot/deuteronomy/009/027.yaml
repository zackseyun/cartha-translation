source:
  edition: WLC
  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: te
  text: నీ సేవకులైన అబ్రాహాము, ఇస్సాకు, యాకోబులను జ్ఞాపకం చేసుకో. ఈ ప్రజల మొండితనం[b] మీద గానీ, వారి దుష్టత్వం మీద గానీ, వారి పాపం మీద గానీ దృష్టి పెట్టకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటి వైపు తిరగకు’, ‘వాటిని పట్టించుకోకు’.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘కఠినత్వం’ లేదా ‘మొండితనం’ అని అర్థం; ఇతర చోట్ల కనిపించే ప్రత్యేకమైన ‘మెడ బిరుసు’ నుడికారం ఇక్కడ లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: జ్ఞాపకం చేసుకో
  rationale: దేవునికి మోషే చేస్తున్న విజ్ఞాపనలోని ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నిబంధన సంబంధ ప్రార్థనలో ‘గుర్తుచేసుకో’ అనే భావాన్ని నిలుపుతుంది.
- source_word: לַעֲבָדֶיךָ
  choice: నీ సేవకులైన
  rationale: ఇక్కడ עבד పితరులను దేవునితో ఉన్న గౌరవప్రదమైన సంబంధంలో సూచిస్తుంది; బానిసత్వ భావాన్ని ముందుకు తేవడం సందర్భోచితం కాదు.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబులను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపాలను ఉపయోగించి, వీరిని ‘నీ సేవకులు’ అనే పదానికి వివరణాత్మక సమానాధికార పదాలుగా చూపుతుంది.
- source_word: אַל תֵּפֶן אֶל
  choice: దృష్టి పెట్టకు
  rationale: పదబద్ధంగా ‘వైపు తిరగకు’ అనే రూపకాన్ని, ఈ ప్రార్థనా సందర్భంలో ‘పరిగణనలోకి తీసుకోకు/లక్ష్యపెట్టకు’ అనే భావంతో సహజమైన తెలుగులో అందిస్తుంది.
- source_word: קְשִׁי
  choice: మొండితనం
  rationale: ఈ నామవాచకం కఠినత్వం లేదా మొండితనాన్ని సూచిస్తుంది. ఇక్కడ లేని ప్రత్యేక ‘మెడ బిరుసు’ నుడికారాన్ని దిగుమతి చేయకుండా నైతిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: עם అనే సమూహవాచకానికి ‘ప్రజలు’ సహజమైన తెలుగు సమానం; సూచనార్థకమైన ‘ఈ’ కూడా నిలుపబడింది.
- source_word: רִשְׁעוֹ
  choice: వారి దుష్టత్వం
  rationale: హీబ్రూలో ఏకవచన ప్రత్యయం సమూహమైన ప్రజలను సూచిస్తుంది. తెలుగులో సమూహ సభ్యులను సహజంగా సూచించేందుకు ‘వారి’ వాడబడింది; רשע లోని నైతిక చెడుదనం ‘దుష్టత్వం’తో వ్యక్తమవుతుంది.
- source_word: חַטָּאתוֹ
  choice: వారి పాపం
  rationale: సమూహవాచకాన్ని సూచించే హీబ్రూ ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజమైన ‘వారి’తో ఇచ్చి, חטאת లోని నిర్దిష్ట నైతిక అపరాధ భావాన్ని ‘పాపం’గా నిలుపుతుంది.
theological_decisions:
- issue: పితరుల విషయంలో עבד పదానికి అనువాదం
  choice: నీ సేవకులైన
  alternative: నీ దాసులైన / నీ బానిసలైన
  rationale: ఈ ప్రార్థనలో ఈ పదం అబ్రాహాము, ఇస్సాకు, యాకోబులకు దేవునితో ఉన్న నిబంధన సంబంధాన్ని తెలిపే గౌరవపదంగా పనిచేస్తుంది. బానిసత్వ స్థితిని ప్రధానంగా చూపడం సందర్భానికి తగదు.
- issue: ‘దుష్టత్వం’, ‘పాపం’ పదాలకు జతైన సమూహ ఏకవచన ప్రత్యయాలు
  choice: వారి దుష్టత్వం ... వారి పాపం
  alternative: దాని దుష్టత్వం ... దాని పాపం
  rationale: హీబ్రూ సమూహవాచకమైన ‘ప్రజలు’తో ఏకవచన ప్రత్యయాన్ని వాడుతుంది. ఆధునిక తెలుగులో ప్రజల నైతిక క్రియలను సూచించేటప్పుడు ‘వారి’ అనడం సహజం; ఇది సిద్ధాంతపరమైన మార్పు కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. పాతకాలపు ‘జ్ఞాపకము చేసికొనుము’ వంటి రూపాలను నివారించి, సాధారణ పాఠకులకు అర్థమయ్యే ‘జ్ఞాపకం చేసుకో’, ‘దృష్టి పెట్టకు’ అనే రూపాలను ఎంచుకున్నాం.
