  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: te
  text: 'ఇశ్రాయేలూ, విను: నేడు నీవు యొర్దాను నది దాటి, నీకంటే గొప్పవీ బలమైనవీ అయిన జనాంగాలను వెళ్లగొట్టడానికి ప్రవేశిస్తున్నావు[a]—ఆకాశం వరకు ఎత్తైన ప్రాకారాలుగల గొప్ప పట్టణాలున్న జనాంగాలను[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వాధీనం చేసుకోవడానికి.” హెబ్రీ క్రియకు వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ జయసందర్భంలో అది ముందున్న నివాసులను వెళ్లగొట్టడం అనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆకాశం వరకు.” ఇది అత్యంత ఎత్తైన, బలమైన కోట ప్రాకారాలను సూచించే అతిశయోక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: విను
  rationale: ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధించే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עֹבֵר הַיּוֹם
  choice: నేడు నీవు ... దాటి ... ప్రవేశిస్తున్నావు
  rationale: వర్తమాన కృదంతం సూచించే సమీపంలో జరుగబోయే లేదా ఆరంభమవుతున్న చర్యను, ‘నేడు’ అనే కాలప్రాధాన్యంతో వ్యక్తం చేస్తుంది.
- source_word: אֶת־הַיַּרְדֵּן
  choice: యొర్దాను నది
  rationale: హెబ్రీలో ‘నది’ పదం లేకపోయినా, తెలుగు పాఠకునికి భౌగోళిక నామాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָרֶשֶׁת
  choice: వెళ్లగొట్టి వారి స్థానాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: జనాలనే ప్రత్యక్ష కర్మగా తీసుకున్న జయసందర్భంలో, ముందున్న నివాసులను తొలగించి వారి స్థానాన్ని స్వాధీనం చేసుకోవడం అనే ירשׁ క్రియ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; దాని విస్తృత ‘స్వాధీనం చేసుకొను’ భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: גּוֹיִם
  choice: జనాలు
  rationale: వేరువేరు జాతీయ సమూహాలను సూచించే పదాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: నీకంటే గొప్పవీ బలమైనవీ అయిన
  rationale: పరిమాణం లేదా ప్రాముఖ్యతను, అలాగే శక్తిని సూచించే రెండు తులనాత్మక విశేషణాలనూ నిలుపుతుంది.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת בַּשָּׁמָיִם
  choice: ఆకాశాన్నంటే ప్రాకారాలుగల గొప్ప పట్టణాలు
  rationale: పట్టణాల గొప్పతనాన్నీ దుర్భేద్యమైన కోట నిర్మాణాన్నీ, ‘ఆకాశం వరకు’ అనే మూలభాష అతిశయోక్తి చిత్రంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పట్టణాల ప్రాకారాలు ఆకాశం వరకు ఉన్నాయనే వర్ణన
  choice: ‘ఆకాశాన్నంటే ప్రాకారాలు’ అనే మూల చిత్రాన్ని నిలుపుతూ అతిశయోక్తిగా అనువదించబడింది.
  alternative: ‘అత్యంత ఎత్తైన, దుర్భేద్యమైన ప్రాకారాలు’ అని వివరణాత్మకంగా చెప్పడం.
  rationale: మూలంలోని సజీవమైన అలంకారాన్ని బలహీనపరచకుండా, అది అసాధారణ ఎత్తు మరియు బలాన్ని సూచించే వాడుక అని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఇశ్రాయేలూ, విను’ అనే ఒడంబడిక పిలుపు సూత్రం, ఇశ్రాయేలును సమష్టి ఏకవచనంగా సంబోధించే మూల వ్యాకరణం నిలుపబడ్డాయి. పొడవైన హెబ్రీ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు తెలుగు వాక్యాలుగా విభజించినప్పటికీ భావసంబంధం చెదరకుండా ఉంచబడింది.
