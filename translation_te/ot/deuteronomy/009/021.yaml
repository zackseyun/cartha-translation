  source_fidelity: 'మొత్తంగా మూలానికి నమ్మకంగా ఉంది: దూడను ‘మీ పాపం’గా గుర్తించడం, కాల్చడం, కొట్టి రుబ్బడం, ధూళిని పర్వతం నుండి దిగే వాగులో వేయడం అన్నీ ఉన్నాయి. అయితే ‘ధూళిలా మెత్తగా’ కంటే మూలంలోని సన్నితనాన్ని తెలిపే ‘ధూళిలా సన్నగా’ మరింత ఖచ్చితమైనది. అలాగే ‘మీరు చేసుకున్న దూడ—మీ పాపాన్ని—’ అనే పదక్రమం తెలుగులో కొంత అసహజంగా ఉంది.'
  naturalness: సవరణతో ఆధునిక ప్రామాణిక తెలుగులో వాక్యప్రవాహం, కర్మ-క్రియా సంబంధం, మరియు చర్యల క్రమం మరింత సహజంగా ఉంటాయి.
