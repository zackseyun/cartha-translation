source:
  edition: WLC
  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: te
  text: మీరు చేసుకున్న మీ పాపమైన ఆ దూడను నేను తీసుకొని అగ్నిలో కాల్చాను. తరువాత దాన్ని బాగా కొట్టి, ధూళిలా సన్నగా అయ్యేంతవరకు రుబ్బాను. దాని ధూళిని పర్వతం నుంచి దిగివచ్చే వాగులో[a] పారవేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాగుపడగలో’; హీబ్రూ పదం ప్రవాహాన్ని, వాగును, లేదా కాలానుగుణంగా నీరు పారే లోయను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: మీ పాపాన్ని
  rationale: ఈ సందర్భంలో ఈ పదం ఇశ్రాయేలీయుల పాపానికి రూపంగా నిలిచిన దూడ విగ్రహాన్నే నేరుగా ‘మీ పాపం’ అని పేర్కొంటుంది; ‘పాపపరిహార బలి’ అనే అర్థం ఇక్కడ సరిపోదు.
- source_word: הָעֵגֶל
  choice: దూడ
  rationale: ఈ పదానికి సాధారణ అర్థం ‘దూడ’; బంగారు దూడ సంఘటనకు ఇది స్పష్టంగా సరిపోతుంది.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: దాన్ని అగ్నిలో కాల్చాను
  rationale: హీబ్రూ వాక్యంలోని అగ్ని ప్రస్తావనను స్పష్టంగా ఉంచుతూ, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וָאֶכֹּת אֹתוֹ
  choice: దాన్ని బాగా నూరి
  rationale: క్రియకు కొట్టడం లేదా దంచడం అనే భావం ఉంది; తరువాతి రుబ్బే చర్యతో కలిసి విగ్రహాన్ని పొడిచేయడాన్ని ‘నూరి’ సహజంగా తెలియజేస్తుంది.
- source_word: טָחוֹן הֵיטֵב
  choice: పూర్తిగా రుబ్బాను
  rationale: రుబ్బే ప్రక్రియను, הֵיטֵב తెలిపే సమగ్రత లేదా తీవ్రతను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: ధూళిలా మెత్తగా అయ్యేంతవరకు
  rationale: పదార్థం ధూళి అంత సన్నగా అయ్యే స్థాయిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲפָרוֹ
  choice: దాని ధూళిని
  rationale: దూడను నూరి రుబ్బిన తరువాత మిగిలిన సన్నని పదార్థాన్ని సూచిస్తుంది; ‘బూడిద’ అని పరిమితం చేయదు.
- source_word: הַנַּחַל
  choice: వాగు
  rationale: ఈ పదం ప్రవాహం, వాగు లేదా కాలానుగుణంగా నీరు పారే వాగుపడగను సూచించగలదు; సాధారణ పాఠకులకు ‘వాగు’ సహజంగా ఉంటుంది, విస్తృత భావపరిధిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: పర్వతం నుంచి దిగివచ్చే
  rationale: వర్తమాన వర్ణనాత్మక భావాన్ని సహజంగా నిలుపుతూ, ప్రవాహం పర్వతం నుంచి కిందికి రావడాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దూడను ‘మీ పాపం’ అని నేరుగా గుర్తించడం
  choice: ‘మీరు చేసుకున్న దూడ—మీ పాపాన్ని—’ అని హీబ్రూ వాక్యంలోని తీవ్రమైన సమానీకరణను నిలిపాము.
  alternative: ‘మీరు చేసుకున్న పాపకరమైన దూడను’
  rationale: మూలం దూడను కేవలం పాపకరమైన వస్తువుగా వర్ణించకుండా, దానినే వారి ‘పాపం’గా పేర్కొంటుంది. ఆ ధార్మిక తీవ్రతను సున్నితపరచకుండా నిలపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘మీ పాపం’ అనే మూలంలోని ఉద్దేశపూర్వక తీవ్రతను డాష్‌లతో స్పష్టమైన apposition‌గా నిలిపాం; చర్యల వరుసను సహజమైన తెలుగు క్రమంలో ఉంచాం.
