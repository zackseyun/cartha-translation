id: DEU.9.12
reference: Deuteronomy 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: te
  text: 'అప్పుడు యెహోవా నాతో ఇలా అన్నాడు: “లేచి, ఇక్కడి నుండి త్వరగా దిగిపో; ఎందుకంటే నువ్వు ఐగుప్తు నుండి బయటకు తీసుకొచ్చిన నీ ప్రజలు భ్రష్టులయ్యారు. వారు త్వరగా నేను వారికి ఆజ్ఞాపించిన మార్గం నుండి తప్పుకున్నారు; తమ కోసం పోతపోసిన ప్రతిమను[a] చేసుకున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరిగించి చేసిన ప్రతిమ.” హీబ్రూ పదం కరిగించిన లోహాన్ని అచ్చులో పోసి రూపొందించిన ప్రతిమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని ప్రత్యేక నామ స్వభావాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: లేచి, ఇక్కడి నుంచి త్వరగా దిగిపో
  rationale: ఆజ్ఞల ఆకస్మికతను, దిగువకు వెళ్లే దిశను, అత్యవసరతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁחֵת
  choice: తమను తాము చెడగొట్టుకున్నారు
  rationale: ఈ సందర్భంలోని నైతిక, ఆధ్యాత్మిక భ్రష్టతను తెలియజేస్తూ, క్రియకు సందర్భంలో కనిపించే స్వీయనాశక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: మోషేతో దేవుడు మాట్లాడుతున్నప్పుడు కనిపించే ఉద్దేశపూర్వక దూరీకరణను యథాతథంగా ఉంచుతుంది.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: నువ్వు ఐగుప్తు నుంచి బయటకు తీసుకొచ్చిన
  rationale: హిఫీల్ క్రియలోని ‘బయటకు తీసుకురావడం’ అనే కారణార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: మార్గం నుంచి వారు త్వరగా తొలగిపోయారు
  rationale: నిర్దేశిత ప్రవర్తనా మార్గం నుంచి పక్కకు మళ్లిన రూపకాన్ని, అలాగే మַהֵר పునరుక్తిని నిలుపుతుంది.
- source_word: מַסֵּכָה
  choice: పోతపోసిన ప్రతిమ
  rationale: కరిగించిన లోహాన్ని అచ్చులో పోసి రూపొందించిన ప్రతిమ అనే నిర్దిష్ట భౌతిక భావాన్ని సాధారణ ‘విగ్రహం’ కంటే స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: ‘నీ ప్రజలు, నువ్వు ఐగుప్తు నుంచి బయటకు తీసుకొచ్చిన’ అనే దైవిక మందలింపులోని దూరీకరణ
  choice: మూలంలోని ద్వితీయ పురుష సంబోధనను యథాతథంగా నిలిపాం.
  alternative: ‘నా ప్రజలు’ లేదా ‘నేను బయటకు తీసుకొచ్చిన ప్రజలు’ అని సున్నితపరచడం.
  rationale: హీబ్రూ వాక్యం మోషేపై పదునైన బాధ్యతాభావాన్ని మోపుతుంది; ఆ వాగ్ధాటిని తగ్గించడం సముచితం కాదు.
- issue: מַסֵּכָה అనే విగ్రహారాధన పదం
  choice: పోతపోసిన ప్రతిమ
  alternative: విగ్రహం; కరిగించిన ప్రతిమ
  rationale: మూలం పాపానికి సంబంధించిన వస్తువు తయారీ విధానాన్ని ప్రత్యేకంగా సూచిస్తుంది; సాధారణీకరించకుండా ఆ స్పష్టతను నిలిపాం.
- issue: שִׁחֵת యొక్క భావం
  choice: తమను తాము చెడగొట్టుకున్నారు
  alternative: చెడుగా ప్రవర్తించారు; భ్రష్టులయ్యారు
  rationale: ఈ సందర్భంలో ప్రజల క్రియ వల్ల వారే భ్రష్టతకు లోనైన భావాన్ని వ్యక్తం చేస్తుంది; అయితే దానిని కేవలం బాహ్య ప్రవర్తనకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన వచనం. ‘త్వరగా’ అనే పునరుక్తి, ఆజ్ఞల తీవ్రత, ‘నీ ప్రజలు’ అనే వాగ్ధాటి ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పదానికే జతచేయబడింది.
