  to: 'అప్పుడు యెహోవా నాతో ఇలా అన్నాడు: “లేచి, ఇక్కడి నుండి త్వరగా దిగిపో; ఎందుకంటే నువ్వు ఐగుప్తు నుండి బయటకు తీసుకొచ్చిన నీ ప్రజలు భ్రష్టులయ్యారు. వారు త్వరగా నేను వారికి ఆజ్ఞాపించిన మార్గం నుండి తప్పుకున్నారు; తమ కోసం పోతపోసిన ప్రతిమను[a] చేసుకున్నారు.”'
