revisions:
- from: తబేరాలో, మస్సాలో, కిబ్రోత్-హత్తావాలో[a] కూడా మీరు యాహ్వేకు కోపం పుట్టిస్తూ వచ్చారు.
  to: తబేరాలోను, మస్సాలోను, కిబ్రోత్-హత్తావాలోను[a] మీరు యాహ్వేకు కోపం తెప్పిస్తూ వచ్చారు.
  rationale: స్థలనామాల జాబితాలో మూలంలోని పునరుక్త సంధి భావాన్ని ‘లోను’తో స్పష్టంగా ఇచ్చాం. ‘కోపం తెప్పిస్తూ వచ్చారు’ హిఫీల్ క్రియలోని యాహ్వేకు కోపం కలిగించే భావాన్నీ, היה + కృదంత నిర్మాణంలోని కొనసాగింపు/పునరావృత గతభావాన్నీ సహజంగా కాపాడుతుంది. పాదసూచికలో మూలానికి లేని ‘తీరని’ అనే వ్యాఖ్యాత్మక భావాన్ని తొలగించాం.
