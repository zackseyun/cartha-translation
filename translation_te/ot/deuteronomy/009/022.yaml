language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: te
  text: తబేరాలోను, మస్సాలోను, కిబ్రోత్-హత్తావాలోను[a] మీరు యాహ్వేకు కోపం తెప్పిస్తూ వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కిబ్రోత్-హత్తావా’ అనేది ఆ స్థలపు పేరు; అక్షరార్థంగా ‘కోరిక సమాధులు’ లేదా ‘వాంఛ సమాధులు.’
    reason: స్థలనామంలోని పదాల అక్షరార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וּבְתַבְעֵרָה וּבְמַסָּה וּבְקִבְרֹת הַתַּאֲוָה
  choice: తబేరాలో, మస్సాలో, కిబ్రోత్-హత్తావాలో కూడా
  rationale: בְ ఉపసర్గను స్థలాన్ని సూచించే తెలుగు ‘లో’తో అనువదించాం. ఇవి స్థలనామాలు కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం; వరుసగా వచ్చే וּ సంధులను సహజమైన తెలుగు జాబితా నిర్మాణంతో, చివర ‘కూడా’ ద్వారా ప్రతిబింబించాం.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: మీరు ... కోపం పుట్టిస్తూ వచ్చారు
  rationale: היהతో కూడిన హిఫీల్ కృదంత నిర్మాణం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన చర్యను సూచిస్తుంది. ‘కోపం పుట్టిస్తూ వచ్చారు’ causative భావాన్నీ నిరంతర/పునరావృత భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: אֶת יְהוָה
  choice: యాహ్వేకు
  rationale: దైవనామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించాం. ‘కోపం పుట్టించు’ అనే తెలుగు ప్రయోగంలో కోపం కలిగిన వ్యక్తి దత్తివిభక్తిలో రావడం సహజం కాబట్టి ‘యాహ్వేకు’ అని ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు సమీపంగా ‘యాహ్వే’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. జాబితాలో ప్రతి స్థలనామం తరువాత ‘లో’ ఉంచడం ద్వారా మూడు వేర్వేరు ప్రదేశాల సూచన స్పష్టమైంది. మూలంలో క్రియకు ఉన్న causative మరియు కొనసాగింపు భావాలను ‘కోపం పుట్టిస్తూ వచ్చారు’ ద్వారా కాపాడాం. పాదసూచిక కిబ్రోత్-హత్తావా పేరుకే సంబంధించినందున దాని వెంటనే [a] గుర్తు ఉంచాం.
