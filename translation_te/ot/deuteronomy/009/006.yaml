source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: te
  text: కాబట్టి నీ దేవుడైన యెహోవా ఈ మంచి భూమిని స్వాధీనం చేసుకోవడానికి[a] నీకు ఇస్తున్నది నీ నీతిని బట్టి కాదని తెలుసుకో. ఎందుకంటే నీవు మెడబిగిసిన ప్రజవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారసత్వంగా పొందడానికి.’ హీబ్రూ క్రియ వారసత్వంగా పొందడాన్ని సూచించగలదు; అయితే ద్వితీయోపదేశకాండంలో అది దేశాన్ని స్వాధీనం చేసుకోవడం అనే భావాన్ని కూడా తరచుగా కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: కాబట్టి ... తెలుసుకో
  rationale: ידע యొక్క రూపం సందర్భంలో ఆజ్ఞార్థక ప్రబోధంగా పనిచేస్తుంది; וְ ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సూచిస్తున్నందున ‘కాబట్టి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לֹא בְצִדְקָתְךָ
  choice: నీ నీతిని బట్టి కాదు
  rationale: בְ ఇక్కడ సాధనం కాక ఆధారం లేదా కారణాన్ని సూచిస్తుంది; ‘నీ నీతిని బట్టి’ ఇశ్రాయేలు నీతి దేశం లభించడానికి ఆధారం కాదనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, ఒడంబడిక సంబంధాన్ని తెలిపే ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని సహజ తెలుగు నిర్మాణంలో నిలిపింది.
- source_word: נֹתֵן לְךָ
  choice: నీకు ఇస్తున్నది
  rationale: కృదంతం సందర్భంలో కొనసాగుతున్న లేదా సమీపంలో నెరవేరబోయే దానక్రియను సూచిస్తుంది; తెలుగు వర్తమాన ప్రగతిశీల రూపం దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ఈ మంచి దేశాన్ని
  rationale: సూచనార్థక పదాన్నీ, దేశపు మంచితనాన్ని తెలిపే విశేషణాన్నీ నిలిపింది; వాగ్దాన భూభాగ సందర్భంలో ‘దేశం’ సాధారణ పాఠకునికి సహజం.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ ద్వితీయోపదేశకాండంలో వారసత్వంగా పొందడం మాత్రమే కాక దేశాన్ని చేపట్టి అధీనంలో ఉంచుకోవడం అనే భావాన్నీ కలిగి ఉంటుంది; ప్రధాన పాఠంలో సందర్భానుకూలమైన స్వాధీన భావం ఇవ్వబడింది, ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండవ כִּי ముందటి నిరాకరణకు వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: మెడ వంచని ప్రజవు
  rationale: హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే రూపకంగానే నిలిపి, మొండితనం మరియు లొంగని స్వభావాన్ని సూచిస్తుంది; కేవలం ‘మొండి’ అని భావానువాదం చేయలేదు.
theological_decisions:
- issue: ఇశ్రాయేలు దేశాన్ని పొందడానికి కారణం
  choice: ఇశ్రాయేలు సొంత నీతి యెహోవా ఇచ్చే దేశానికి ఆధారం కాదని స్పష్టంగా నిరాకరించడం
  alternative: దీనిని ఒడంబడిక సంబంధిత అనర్హతను ప్రాముఖ్యం చేయకుండా సాధారణ వినయబోధగా మాత్రమే చెప్పడం
  rationale: హీబ్రూ పాఠం ఇశ్రాయేలు నీతిని ఆధారంగా నిరాకరిస్తూ, దేవుని దానక్రియను వారి మెడ వంచని స్వభావంతో ఉద్రిక్తంగా పక్కపక్కన ఉంచుతుంది; అనువాదం ఆ ఉద్రిక్తతను అదనపు సిద్ధాంతీకరణ లేకుండా కాపాడుతుంది.
- issue: సమష్టిని ఉద్దేశించిన ఏకవచనం
  choice: ‘నీ’, ‘నీవు’ అనే ఏకవచన రూపాలతో ఇశ్రాయేలును సమష్టిగా సంబోధించడం
  alternative: ‘మీరు’ వంటి బహువచన రూపాలకు విస్తరించడం
  rationale: మూల హీబ్రూ ఇశ్రాయేలును ఒక సమష్టి ఏకకంగా ద్వితీయ పురుష ఏకవచనంలో సంబోధిస్తుంది; తెలుగు ఏకవచన రూపాలు ఆ వ్యాకరణ మరియు వాక్చాతుర్య లక్షణాన్ని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నీతి’ వంటి స్థిర బైబిలు పదాన్ని ఉంచుతూ, ‘మెడ వంచని’ అనే సహజ తెలుగు రూపకం ద్వారా మూలంలోని దృశ్యభావాన్ని కాపాడింది.
