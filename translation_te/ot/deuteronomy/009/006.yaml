review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the exhortation, the denial that Israel's righteousness is the basis for receiving the land, Yahweh's act of giving, and the explanatory characterization of Israel. However, దేశం can mean a political country/nation, whereas הארץ in this covenantal setting is more accurately and conventionally rendered భూమి ('land').
  naturalness: The sentence is generally fluent modern Telugu. Replacing the less idiomatic 'మెడ వంచని' with the established Telugu biblical idiom 'మెడబిగిసిన' better represents the Hebrew metaphor and reads naturally in this register.
  terminology: నీతి, యెహోవా, స్వాధీనం చేసుకోవడానికి, and ప్రజవు are suitable. 'భూమి' is preferable to 'దేశం' here. 'మెడబిగిసిన' preserves קְשֵׁה־עֹרֶף without reducing it to the interpretation 'stubborn.'
  issues:
  - severity: medium
    issue: '''దేశం'' for הָאָרֶץ'
    rationale: In this promised-land context, הארץ denotes the land/territory rather than a modern political country. 'భూమి' avoids possible ambiguity with a nation-state and better reflects the source usage.
  - severity: medium
    issue: '''మెడ వంచని'' for קְשֵׁה עֹרֶף'
    rationale: Although intelligible, it is not the closest established Telugu rendering of the Hebrew 'stiff-necked' idiom. 'మెడబిగిసిన' preserves the image of an unyielding neck and biblical register more directly.
  revised_text: కాబట్టి నీ దేవుడైన యెహోవా ఈ మంచి భూమిని స్వాధీనం చేసుకోవడానికి[a] నీకు ఇస్తున్నది నీ నీతిని బట్టి కాదని తెలుసుకో. ఎందుకంటే నీవు మెడబిగిసిన ప్రజవు.
