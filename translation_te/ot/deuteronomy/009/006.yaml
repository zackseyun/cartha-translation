- from: కాబట్టి నీ దేవుడైన యెహోవా ఈ మంచి దేశాన్ని స్వాధీనం చేసుకోవడానికి[a] నీకు ఇస్తున్నది నీ నీతిని బట్టి కాదని తెలుసుకో. ఎందుకంటే నీవు మెడ వంచని ప్రజవు.
