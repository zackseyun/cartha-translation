source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: te
  text: యాహ్వే మిమ్మల్ని కాదేశ్-బర్నేయ నుండి పంపి, ‘నేను మీకు ఇచ్చిన దేశానికి పైకి వెళ్లి, దాన్ని స్వాధీనం చేసుకోండి’ అని చెప్పినప్పుడు, మీరు మీ దేవుడైన యాహ్వే ఆజ్ఞకు ఎదురుతిరిగారు[a]. మీరు ఆయనను నమ్మలేదు[b], ఆయన మాట వినలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ దేవుడైన యాహ్వే నోటికి ఎదురుతిరిగారు”; ఇది ఆయన ఆజ్ఞకు లేదా మాటకు ఎదురుతిరగడాన్ని సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయనపై విశ్వాసముంచలేదు.”
    reason: lexical_alternative
  - marker: c
    text: “ఆయన మాట వినలేదు” అనేది ఆయనకు విధేయత చూపలేదనే భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: పంపిస్తూ ... చెప్పినప్పుడు
  rationale: వావ్, బేత్ ఉపసర్గలతో కూడిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేలా ప్రధాన క్రియతో అనుసంధానించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: కాదేశ్-బర్నేయ నుండి
  rationale: స్థలనామాన్ని మూలభాష ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: עֲלוּ
  choice: వెళ్లి
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లండి’; ఇక్కడ దేశంలోకి ప్రయాణించడాన్ని సూచిస్తుంది. భౌగోళిక ‘పైకి’ భావాన్ని అతిగా ముందుకు తేవకుండా సహజ తెలుగు వాడబడింది.
- source_word: וּרְשׁוּ
  choice: దాన్ని స్వాధీనం చేసుకోండి
  rationale: ירשׁ ఇక్కడ దేశాన్ని ఆక్రమించి స్వాధీనపరచుకోవడాన్ని సూచిస్తుంది; ‘స్వాధీనం చేసుకోండి’ ఆ కార్యభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: నేను మీకు ఇచ్చిన
  rationale: పూర్తయినదిగా చూపే perfect రూపాన్ని నిలుపుతూ, దేవుని అనుగ్రహం నిశ్చితమైనదనే వాక్యభావాన్ని అదనపు వివరణ లేకుండా వ్యక్తపరుస్తుంది.
- source_word: וַתַּמְרוּ
  choice: ఎదురుతిరిగారు
  rationale: מרה అధికారానికి విరోధంగా తిరుగుబాటు చేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎదురుతిరిగారు’ ప్రత్యక్షంగా, సహజంగా ఉంది.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా ఆజ్ఞకు
  rationale: అక్షరార్థంగా ‘నోటికి’ అనే హెబ్రీయ నుడికారం ఇక్కడ అధికారపూర్వక ఆజ్ఞను సూచిస్తుంది; తెలుగులో భావాన్ని సహజంగా అందించింది.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: మీరు ఆయనను నమ్మలేదు
  rationale: Hiphil אמן ఇక్కడ నమ్మడం లేదా విశ్వసించడాన్ని సూచిస్తుంది; ‘నమ్మలేదు’ రెండింటి మధ్యనున్న భావవ్యాప్తిని సహజంగా నిలుపుతుంది.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: ఆయన మాట వినలేదు
  rationale: שׁמע בקול వినడం మరియు విధేయత చూపడం రెండింటినీ సూచించగలదు; ‘మాట వినలేదు’ అనే తెలుగు నుడికారం ఈ రెండు భావాలనూ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; దాన్ని సాధారణ బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం సముచితం.
- issue: נָתַתִּי యొక్క కాలబలం
  choice: నేను మీకు ఇచ్చిన
  alternative: నేను మీకు ఇస్తున్న
  rationale: హెబ్రీ perfect దేవుడు దేశాన్ని ఇప్పటికే అనుగ్రహించినదిగా చిత్రిస్తుంది; వర్తమాన ప్రగతిశీల రూపం మూలంలోని పూర్తయిన దృక్పథాన్ని బలహీనపరుస్తుంది.
- issue: שׁמע בקול లో వినడం–విధేయత సంబంధం
  choice: ఆయన మాట వినలేదు
  alternative: ఆయన స్వరానికి విధేయులు కాలేదు
  rationale: తెలుగు ‘మాట వినడం’ నుడికారం శ్రవణం మరియు విధేయత రెండింటినీ సహజంగా కలిగి ఉండి, మూలంలోని ఉద్దేశపూర్వక భావసంపదను ముందుగానే ఒక అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ నుడికారాలను అవసరమైన చోట సహజ తెలుగు నుడికారాలతో అందిస్తూ, ముఖ్యమైన అక్షరార్థం మరియు ప్రత్యామ్నాయ భావాలను పాదసూచికల్లో నిలిపింది.
