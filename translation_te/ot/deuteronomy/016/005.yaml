source:
  edition: WLC
  text: לֹ֥א תוּכַ֖ל לִ/זְבֹּ֣חַ אֶת הַ/פָּ֑סַח בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న ఏ పట్టణంలోనైనా[b] నీవు పస్కా బలిని[a] అర్పించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పస్కా.’ ఇక్కడ ఈ పదం పస్కా బలి అర్పణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘ద్వారాలు’; ఇది సాధారణంగా పట్టణం లేదా నివాసస్థలాన్ని సూచించే లక్షణార్థక ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: నీవు … అర్పించకూడదు
  rationale: יכול + క్రియార్థక రూపం ఇక్కడ కేవలం అసమర్థతను కాక న్యాయపరమైన నిషేధాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘కూడదు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִזְבֹּחַ
  choice: బలిని అర్పించు
  rationale: ఆరాధనా సందర్భంలో זבח బలిగా వధించడం లేదా బలి అర్పించడం అనే భావాన్ని ఇస్తుంది; ‘అర్పించు’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: הַפָּסַח
  choice: పస్కా బలి
  rationale: פסח పండుగను, బలి జంతువును, లేదా పస్కా అర్పణను సూచించగలదు. זבחతో కలిసి ఉన్నందున ఇక్కడ బలి భావాన్ని స్పష్టంగా తెలుపుతూ ‘పస్కా బలి’ అని అనువదించబడింది.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: నీ … ఏ పట్టణంలోనైనా
  rationale: ‘నీ ద్వారాలలో ఒకదానిలో’ అనే అక్షరార్థంలోని שערים ఇక్కడ పట్టణాలు లేదా నివాస ప్రాంతాలకు లక్షణార్థకంగా వాడబడింది. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశిత అర్థాన్ని నేరుగా, సహజంగా తెలియజేయడానికి ‘ఏ పట్టణంలోనైనా’ ఎంచుకోబడింది.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: నీ దేవుడైన యెహోవా నీకు ఇస్తున్న
  rationale: נֹתֵן అనే క్రియావిశేషణ రూపంలోని కొనసాగుతున్న దాన భావాన్ని ‘ఇస్తున్న’ నిలుపుతుంది; יהוה అనే నిబంధన నామం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నిబంధన నామం ప్రత్యక్షంగా ఉంది; బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలుపబడింది.
- issue: הַפָּסַח యొక్క సూచన
  choice: పస్కా బలి
  alternative: పస్కా
  rationale: ఈ పదం పండుగకూ బలి అర్పణకూ ఉపయోగించబడగలదు. ఇక్కడ ‘బలిగా అర్పించు’ అనే క్రియతో ఉన్నందున బలి అర్థం సందర్భానుకూలం; అయినా పదంలోని విస్తృత సూచనను పాదటిప్పణిలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. హెబ్రీయుల ‘ద్వారాలు’ అనే లక్షణార్థక ప్రయోగాన్ని అక్షరార్థంగా ఉంచకుండా దాని సందర్భార్థమైన ‘పట్టణాలు’గా అనువదించాం.
