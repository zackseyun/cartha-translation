  edition: WLC
  text: שִׁבְעָ֥ה שָׁבֻעֹ֖ת תִּסְפָּר לָ֑/ךְ מֵ/הָחֵ֤ל חֶרְמֵשׁ֙ בַּ/קָּמָ֔ה תָּחֵ֣ל לִ/סְפֹּ֔ר שִׁבְעָ֖ה שָׁבֻעֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: te
  text: నీవు ఏడు వారాలు[a] లెక్కించుకోవాలి. నిలువున్న ధాన్యపు పంటకు కొడవలి పెట్టడం మొదలైనప్పటి నుంచి ఏడు వారాలు లెక్కించడం మొదలుపెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏడు ఏడులు.” ఇక్కడ హెబ్రీ నుడికారం ఏడు వారాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: ఏడు వారాలు
  rationale: కాలగణన సందర్భంలో שָׁבֻעוֹת అనే పదానికి సహజమైన అర్థం ‘వారాలు.’ హెబ్రీలోని లెక్కింపు నిర్మాణాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: תִּסְפָּר לָךְ
  choice: నీవు ... లెక్కించుకోవాలి
  rationale: ספר క్రియలోని ఆజ్ఞార్థక బలాన్ని ‘లెక్కించుకోవాలి’ తెలియజేస్తుంది; לָךְ లోని వ్యక్తిగత సూచనను తెలుగు ఆత్మార్థక క్రియారూపం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: מֵהָחֵל
  choice: మొదలుపెట్టినప్పటి నుంచి
  rationale: מִן తో కూడిన క్రియార్థక రూపం లెక్కింపు ప్రారంభమయ్యే కాలబిందువును సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కాలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: חֶרְמֵשׁ
  choice: కొడవలి
  rationale: ఈ పదం ధాన్యపు పంటను కోయడానికి ఉపయోగించే sickle‌ను సూచిస్తుంది; ‘కొడవలి’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: בַּקָּמָה
  choice: నిలిచివున్న ధాన్యపు పంటకు
  rationale: קָמָה కోతకు సిద్ధంగా పొలంలో నిలిచివున్న ధాన్యపు పైరును సూచిస్తుంది. ‘పంటకు కొడవలి వేయడం’ అనే ప్రయోగం హెబ్రీ కోత నుడికారాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תָּחֵל לִסְפֹּר
  choice: లెక్కించడం మొదలుపెట్టాలి
  rationale: ప్రారంభాన్ని సూచించే క్రియతో ספר యొక్క క్రియార్థక రూపం కలిసిన నిర్మాణాన్ని స్పష్టంగా, సహజంగా అనువదిస్తుంది.
