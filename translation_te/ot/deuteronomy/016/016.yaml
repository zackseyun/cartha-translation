id: DEU.16.16
reference: Deuteronomy 16:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: te
  text: సంవత్సరానికి మూడుసార్లు—పులియని రొట్టెల పండుగలో, వారాల పండుగలో, పర్ణశాలల పండుగలో[b]—నీ పురుషులందరూ ఆయన ఎంచుకునే స్థలంలో నీ దేవుడైన యాహ్వే సన్నిధిలో హాజరు కావాలి[a]. యాహ్వే సన్నిధికి ఎవరూ వట్టిచేతులతో రాకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘యాహ్వే సన్నిధిలో కనిపించాలి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియారూపం దేవుని సన్నిధిలో తనను తాను హాజరుపరచుకోవడం అనే నుడికారంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘పర్ణశాలల పండుగ’ను సంప్రదాయంగా ‘గుడారాల పండుగ’ అని కూడా అంటారు.
    reason: alternative_reading
  - marker: c
    text: ‘వట్టిచేతులతో’ అంటే తగిన కానుక లేదా అర్పణ ఏదీ తీసుకురాకుండా అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: హాజరు కావాలి
  rationale: నిఫాల్ రూపానికి అక్షరార్థంగా ‘కనిపించాలి’ అనే భావం ఉన్నా, యాత్రాపండుగల సందర్భంలో దేవుని సన్నిధిలో తనను తాను సమర్పించుకోవడం లేదా హాజరవడం అనే నుడికారార్థం ఉంది. ‘హాజరు కావాలి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; రూపంలోని సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: כָל זְכוּרְךָ
  choice: నీ పురుషులందరూ
  rationale: మూలపాఠం యాత్రకు రావలసిన మగవారిని స్పష్టంగా సూచిస్తుంది. చట్టపరమైన పరిధిని లింగతటస్థంగా మార్చకుండా తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే సన్నిధిలో
  rationale: ‘ముఖం ఎదుట’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన ‘సన్నిధిలో’గా ఇచ్చి, దేవుని సమక్షంలో హాజరవడమనే భావాన్ని నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: ఆయన ఎంచుకునే స్థలంలో
  rationale: ఆరాధన కోసం దేవుడే స్థలాన్ని నిర్ణయిస్తాడనే ద్వితీయోపదేశకాండంలోని ప్రధాన భావాన్ని స్పష్టంగా నిలుపుతుంది. తెలుగు వర్తమాన-భవిష్యదర్థక సంబంధక్రియ సందర్భానికి సహజంగా ఉంది.
- source_word: חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: పండుగ పేరును అర్థవంతంగా, సాధారణ పాఠకులకు వెంటనే గ్రాహ్యమయ్యే ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: వారాల పండుగ
  rationale: హీబ్రూ పేరును నేరుగా ప్రతిబింబిస్తుంది; తరువాతి గ్రీకు సంప్రదాయంలోని ‘పెంతెకొస్తు’ అనే పేరును పూర్వనిబంధన సందర్భంలోకి దిగుమతి చేయదు.
- source_word: חַג הַסֻּכּוֹת
  choice: పర్ణశాలల పండుగ
  rationale: סֻכּוֹת సూచించే తాత్కాలిక నివాసాలను తెలిపే స్థిరమైన, గౌరవప్రదమైన తెలుగు పండుగపేరు. ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם
  choice: యాహ్వే సన్నిధికి ఎవరూ వట్టిచేతులతో రాకూడదు
  rationale: רֵיקָם అనే పదం ఈ ఆరాధనా సందర్భంలో కానుక లేకుండా రావడాన్ని సూచిస్తుంది. ‘వట్టిచేతులతో’ అనే తెలుగు నుడికారం మూలంలోని సంక్షిప్తతను, ఆచారపరమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה ను ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: כָל זְכוּרְךָ లోని లింగనిర్దిష్ట చట్టబద్ధ బాధ్యత
  choice: నీ పురుషులందరూ
  alternative: మీరందరూ; నీ ప్రజలందరూ
  rationale: హీబ్రూ పదబంధం మగవారినే స్పష్టంగా పేర్కొంటుంది. దాని చట్టపరమైన పరిధిని విస్తరించకుండా లేదా లింగతటస్థం చేయకుండా నిలిపాం.
- issue: יֵרָאֶה రూపంలోని వ్యాకరణ-నుడికార ఉద్రిక్తత
  choice: ప్రధాన పాఠంలో ‘హాజరు కావాలి’; పాదసూచికలో ‘కనిపించాలి’
  alternative: కనిపించాలి; తనను తాను సమర్పించుకోవాలి
  rationale: నిఫాల్ రూపం అక్షరార్థంగా passive/reflexive భావాన్ని అనుమతించినా, యాత్రాపండుగ సందర్భంలో దేవుని ఎదుట హాజరవడం అనే స్థిర నుడికారంగా పనిచేస్తుంది. సహజ పాఠ్యాన్ని ఎంచుకుని, నిజమైన రూపసంబంధ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. చట్టపరమైన ఆజ్ఞను ‘కావాలి/రాకూడదు’ రూపాలతో స్పష్టంగా తెలిపాం. పండుగ పేర్లు మూల హీబ్రూ పేర్ల అర్థాన్ని ప్రతిబింబించేలా ఉంచాం; అతిగా సంస్కృతీకృతమైన లేదా సంఘపరంగా ప్రత్యేకమైన పదజాలాన్ని నివారించాం.
