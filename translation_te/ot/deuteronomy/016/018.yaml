id: DEU.16.18
reference: Deuteronomy 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు, నీ గోత్రాలవారీగా, ఇస్తున్న పట్టణాలన్నిటి ద్వారాల వద్ద[a] న్యాయాధిపతులను, అధికారులను నియమించాలి. వారు ప్రజలకు న్యాయమైన తీర్పు తీర్చాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ ద్వారాలన్నిటిలో.” పట్టణ ద్వారాల ప్రాంతాలు పౌర, న్యాయ కార్యకలాపాల కేంద్రాలుగా పనిచేసేవి; అందువల్ల “నీ పట్టణాలన్నిటిలో” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, “నీతియుక్తమైన తీర్పు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులు
  rationale: చట్టపరమైన తీర్పులు ఇచ్చే వ్యక్తులను సూచించే ఈ పదానికి ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సంస్థాగత సమానార్థకం.
- source_word: שֹׁטְרִים
  choice: అధికారులు
  rationale: న్యాయపాలనతో అనుబంధమైన పరిపాలనా అధికారులను సూచిస్తుంది; వారి ఖచ్చితమైన విధిని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: תִּתֶּן
  choice: నియమించాలి
  rationale: అక్షరార్థంగా ‘ఉంచు/ఇవ్వు’ అనే భావం ఉన్నా, ఇక్కడ వ్యక్తులను పదవిలో ఏర్పాటు చేయడమే సందర్భోచిత అర్థం.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: పట్టణాలన్నిటి ద్వారాల దగ్గర
  rationale: మూలంలోని ‘నీ ద్వారాలన్నిటిలో’ అనే దృశ్యాన్ని నిలుపుతూ, అవి పట్టణ ద్వారాలని సహజ తెలుగులో స్పష్టం చేస్తుంది; పట్టణ ద్వారాలు పౌర, న్యాయ కార్యకలాపాల కేంద్రాలు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: לִשְׁבָטֶיךָ
  choice: నీ గోత్రాలవారీగా
  rationale: నియామకాలు గోత్రాల విభజన లేదా వ్యవస్థ ప్రకారం జరగాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: వారు ప్రజలకు ... తీర్పు తీర్చాలి
  rationale: న్యాయపరమైన సందర్భంలో క్రియకు ఉన్న న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది.
- source_word: מִשְׁפַּט צֶדֶק
  choice: న్యాయమైన తీర్పు
  rationale: చట్టపరమైన నిర్ణయం, నైతిక న్యాయం అనే రెండు పార్శ్వాలనూ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా ఉంచింది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన నామరూపం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సహజమైన న్యాయ-పరిపాలనా పదజాలం వాడబడింది. మూలంలోని పట్టణ ద్వారాల సాంస్కృతిక దృశ్యం ప్రధాన పాఠ్యంలో నిలుపబడింది.
