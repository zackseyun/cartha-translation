  source_fidelity: మూలంలోని שְׁעָרֶיךָ (‘నీ ద్వారాలు’) న్యాయపరమైన పౌర కేంద్రాలైన పట్టణ ద్వారాలను సూచిస్తుంది. ముసాయిదాలోని ‘దగ్గర’ కంటే ‘వద్ద’ ఈ సందర్భంలో మరింత సహజమైనది. לִשְׁבָטֶיךָ యొక్క గోత్రాలవారీ పంపిణీ భావం నిలిచింది. అయితే యెహోవా స్థానంలో మూల-ఆధారిత, ఆంగ్ల POB నిర్ణయానికి అనుగుణమైన ‘యాహ్వే’ అవసరం.
