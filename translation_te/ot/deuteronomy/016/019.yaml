    issue: చివరి రెండు క్రియల సమన్వయాన్ని ‘చేసి’ అనే కృదంతంతో చూపడం
    rationale: וְ…וְ అనే హీబ్రూ సమన్వయం లంచం జ్ఞానుల కళ్లను గుడ్డివిగా చేస్తుందనీ, నీతిమంతుల మాటలను వక్రీకరిస్తుందనీ రెండు సమాంతర ఫలితాలను చెబుతుంది. తెలుగులో రెండు పరిమిత క్రియలు ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతాయి.
