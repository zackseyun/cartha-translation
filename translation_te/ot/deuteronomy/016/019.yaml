revisions:
- from: న్యాయాన్ని వక్రీకరించకూడదు; పక్షపాతం చూపకూడదు[a]; లంచం తీసుకోకూడదు. ఎందుకంటే లంచం జ్ఞానుల కళ్లను గుడ్డివిగా చేసి, నీతిమంతుల మాటలను[b] వక్రీకరిస్తుంది.
  to: న్యాయాన్ని వక్రీకరించకూడదు; పక్షపాతం చూపకూడదు[a]; లంచం తీసుకోకూడదు. ఎందుకంటే లంచం జ్ఞానుల కళ్లను గుడ్డివిగా చేస్తుంది, నీతిమంతుల మాటలను[b] వక్రీకరిస్తుంది.
  rationale: ప్రధాన సవరణ హీబ్రూ సమన్వయ నిర్మాణాన్ని సహజమైన తెలుగు సమాంతర క్రియలతో ప్రతిబింబించడం. ప్రధాన పాఠంలో దִּבְרֵיకి సన్నిహితమైన ‘మాటలు’ ఉంచి, న్యాయపరమైన ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో కొనసాగించాం. పక్షపాతం గురించిన పాదటిప్పణి గుర్తు సంబంధిత పదబంధం తర్వాతే ఉంచబడింది.
