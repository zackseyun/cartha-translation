id: DEU.16.19
reference: Deuteronomy 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: te
  text: న్యాయాన్ని వక్రీకరించకూడదు; పక్షపాతం చూపకూడదు[a]; లంచం తీసుకోకూడదు. ఎందుకంటే లంచం జ్ఞానుల కళ్లను గుడ్డివిగా చేస్తుంది, నీతిమంతుల మాటలను[b] వక్రీకరిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ముఖాలను గుర్తించకూడదు’; అంటే వ్యక్తిని బట్టి పక్షపాతం చూపకూడదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీతిమంతుల వాదనను’ లేదా ‘నీతిమంతుల న్యాయవ్యవహారాన్ని.’ ఇక్కడి హీబ్రూ పదం వారి మాటలనుగానీ, న్యాయసందర్భంలో వారి వాదన లేదా న్యాయవ్యవహారాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: న్యాయాన్ని వక్రీకరించకూడదు
  rationale: נטה హిఫీల్ రూపం న్యాయతీర్పును సరైన మార్గం నుంచి మళ్లించడం లేదా వంచించడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది. ‘వక్రీకరించు’ ఆధునిక తెలుగులో ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַכִּיר פָּנִים
  choice: పక్షపాతం చూపకూడదు
  rationale: అక్షరార్థంగా ‘ముఖాలను గుర్తించు’ అనే ఈ హీబ్రూ నుడికారం, తీర్పులో వ్యక్తిని బట్టి మొగ్గు చూపడాన్ని సూచిస్తుంది. ‘పక్షపాతం చూపు’ దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שֹׁחַד
  choice: లంచం
  rationale: ఈ న్యాయసందర్భంలో తీర్పును ప్రభావితం చేయడానికి ఇచ్చే అవినీతి చెల్లింపును సూచిస్తుంది; అందువల్ల ‘బహుమతి’ కంటే ‘లంచం’ ఖచ్చితమైన పదం.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: జ్ఞానుల కళ్లను గుడ్డివిగా చేసి
  rationale: మూలంలోని స్పష్టమైన రూపకాన్ని, లంచం వివేచనను చెడగొట్టే కారణశక్తిని ఇది నిలుపుతుంది.
- source_word: חֲכָמִים
  choice: జ్ఞానులు
  rationale: హీబ్రూ బహువచనం ఇక్కడ జ్ఞానం గల వ్యక్తులను సాధారణంగా సూచిస్తుంది; ‘జ్ఞానులు’ సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: నీతిమంతుల మాటలను వక్రీకరిస్తుంది
  rationale: סלף వక్రీకరించడం లేదా తారుమారు చేయడం; דִּבְרֵי అక్షరార్థంగా ‘మాటలు’ అయినప్పటికీ న్యాయసందర్భంలో ‘వాదం/వ్యాజ్యం’ అనే భావాన్నీ కలిగి ఉండవచ్చు. ప్రధాన పాఠం మూలానికి సన్నిహితంగా ఉంది; సందిగ్ధతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: צַדִּיקִם
  choice: నీతిమంతులు
  rationale: ఈ పదం నైతికంగా నీతిగలవారినీ, న్యాయపరంగా హక్కు వైపు ఉన్నవారినీ సూచించగలదు. ‘నీతిమంతులు’ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: דִּבְרֵי צַדִּיקִם యొక్క న్యాయసందర్భ భావం
  choice: ప్రధాన పాఠంలో ‘నీతిమంతుల మాటలు’
  alternative: ‘నీతిమంతుల వాదం/వ్యాజ్యం’
  rationale: మూలంలోని ‘మాటలు’ అనే ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, న్యాయపరమైన విస్తృత అర్థాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా నిజమైన భావసందిగ్ధతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన న్యాయపరమైన పదజాలం, గౌరవప్రదమైన ధోరణి ఉపయోగించబడింది. వరుస నిషేధాలను ‘కూడదు’తో సహజంగా ఉంచి, హీబ్రూ రూపకాన్ని సాధ్యమైనంతవరకు నిలిపాం.
