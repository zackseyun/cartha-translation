id: DEU.16.21
reference: Deuteronomy 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేకు నీవు నిర్మించుకునే బలిపీఠం పక్కన, ఏ రకమైన చెట్టునైనా అషేరాగా[a] నాటుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అషేరా స్తంభాన్ని.’ హీబ్రూ పదం אֲשֵׁרָה అషేరా దేవతను మాత్రమే కాకుండా, ఆమె ఆరాధనతో సంబంధమున్న ఆరాధనా వస్తువును కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: నాటుకోకూడదు
  rationale: נטע సాధారణంగా ‘నాటు’ అని అర్థం. ఆరాధనకు సంబంధించిన వస్తువు సందర్భంలో ఉన్నప్పటికీ, మూలంలోని వృక్ష సంబంధ చిత్రాన్ని నిలుపుతుంది; לְךָ భావాన్ని ‘నాటుకో’లోని ఆత్మార్థక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֵׁרָה
  choice: అషేరా
  rationale: ఈ పదం అషేరా దేవతను గానీ, ఆమె ఆరాధనతో సంబంధమున్న చెట్టు/చెక్క ఆరాధనా చిహ్నాన్ని గానీ సూచించవచ్చు. లిప్యంతరీకరణ ఈ సందిగ్ధతను అనవసరంగా పరిష్కరించకుండా నిలుపుతుంది.
- source_word: כָּל עֵץ
  choice: ఏ రకమైన చెట్టుతోనైనా
  rationale: అక్షరార్థంగా ‘ఏ చెట్టైనా.’ అషేరా ఏ విధమైన చెట్టు లేదా చెక్కతో చేసినదైనా నిషేధం వర్తిస్తుందని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అషేరా’తోని నిర్మాణ సంబంధాన్ని కూడా స్పష్టం చేస్తుంది.
- source_word: אֵצֶל
  choice: పక్కన
  rationale: సమీపాన్ని సూచించే పదానికి సందర్భానుకూలమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: מִזְבַּח
  choice: బలిపీఠం
  rationale: బలులు అర్పించే altar‌కు ప్రామాణికమైన తెలుగు పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబోధనను, యెహోవాతో అన్వయాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: నీవు నిర్మించుకునే
  rationale: עשה విస్తృతంగా ‘చేయు’ అని ఉన్నా, బలిపీఠం సందర్భంలో ‘నిర్మించు’ సహజం. לָּךְ లోని ఆత్మార్థక భావాన్ని ‘నిర్మించుకునే’ నిలుపుతుంది.
theological_decisions:
- issue: אֲשֵׁרָה దేవత పేరునా, లేక ఆమెతో సంబంధమున్న ఆరాధనా వస్తువునా?
  choice: ప్రధాన పాఠ్యంలో ‘అషేరా’ అని లిప్యంతరీకరించడం
  alternative: ‘అషేరా స్తంభం’ లేదా ‘అషేరా చెక్క విగ్రహం’
  rationale: సందర్భంలో ఈ హీబ్రూ పదం దేవతను, సజీవ ఆరాధనా చెట్టును, లేదా చెక్కతో చేసిన ఆరాధనా చిహ్నాన్ని సూచించవచ్చు. లిప్యంతరీకరణ మూలంలోని భావసందిగ్ధతను నిలుపుతుంది; పాదసూచిక అవసరమైన వివరణను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన న్యాయవిధి శైలిని స్పష్టంగా ఉంచింది. ‘నాటుకోకూడదు’ మూలంలోని క్రియాచిత్రాన్ని, ‘నిర్మించుకునే’ లָּךְ యొక్క ఆత్మార్థక భావాన్ని సహజంగా నిలుపుతున్నాయి. ‘అషేరా’ అనే రూపం సాధారణ పాఠకునికి పాదసూచిక సహాయంతో అర్థమయ్యేలా, మూలంలోని ఉద్దేశపూర్వక సందిగ్ధతను కాపాడుతుంది.
