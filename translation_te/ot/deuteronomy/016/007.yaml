source:
  edition: WLC
  text: וּ/בִשַּׁלְתָּ֙ וְ/אָ֣כַלְתָּ֔ בַּ/מָּק֕וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ וּ/פָנִ֣יתָ בַ/בֹּ֔קֶר וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: te
  text: దాన్ని నీ దేవుడైన యెహోవా ఎన్నుకునే స్థలంలో వండుకొని తినాలి. ఉదయాన నీవు వెనుదిరిగి నీ గుడారాలకు వెళ్లాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: వండుకొని
  rationale: בשל అనే క్రియకు సందర్భానుసారం ‘వండు’ లేదా ‘ఉడికించు’ అనే అర్థాలు రావచ్చు. ఇక్కడ వంట విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా, సహజమైన విస్తృతార్థక తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר ... בּוֹ
  choice: ఎన్నుకునే స్థలంలో
  rationale: చివరనున్న בּוֹ ముందున్న ‘స్థలం’ను తిరిగి సూచించే హెబ్రీ నిర్మాణం; తెలుగులో దాని అర్థం ‘ఎన్నుకునే స్థలంలో’ అనే సహజ నిర్మాణంలోనే స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: וּפָנִיתָ
  choice: వెనుదిరిగి
  rationale: ‘తిరుగు/మళ్లిపో’ అనే మూలభావాన్ని నిలుపుతూ, ఆ స్థలం నుంచి గుడారాలకు వెళ్లడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఇచ్చాం.
theological_decisions:
- issue: పస్కా బలిని సిద్ధం చేసే విధానం
  choice: వండుకొని
  alternative: ఉడికించి
  rationale: בשל పదం ‘ఉడికించు’ అనే నిర్దిష్ట అర్థాన్ని కలిగి ఉండగలిగినా, ఈ వాక్యంలోని పదానికున్న విస్తృత వంట అర్థాన్ని నిలుపుతూ ఇతర పస్కా వచనాలతో కనిపించే ఉద్రిక్తతను అనువాదంలో కృత్రిమంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞార్థాన్ని ‘తినాలి/వెళ్లాలి’ రూపాలతో సహజంగా వ్యక్తం చేశాం. వాక్యం గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను ఉపయోగించాం.
