  terminology: యְהוָהకు ‘యెహోవా’ అనే ప్రత్యేకనామ రూపం నిలుపబడింది. ‘వండుకొని’ అనేది בשל యొక్క విస్తృత వంట భావాన్ని కాపాడుతుంది; ‘ఉడికించి’ అని అనవసరంగా సంకుచితం చేయదు. ‘గుడారాలు’ అֹהָלִיםకు సరైన సాధారణ తెలుగు సమానార్థకం.
