source:
  edition: WLC
  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: te
  text: ఏడు రోజులపాటు నీ ప్రాంతమంతటా పులియబెట్టే పదార్థం ఏదీ నీ దగ్గర కనిపించకూడదు. మొదటి రోజున సాయంకాలం నీవు బలిగా అర్పించే మాంసంలో[a] ఏదీ ఉదయం వరకు మిగిలి ఉండకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మాంసం’; బలి సందర్భంలో ఇది బలి మాంసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మొదటి రోజు’ అనేది పండుగ ప్రారంభంలో అర్పించే పస్కా బలిని ప్రత్యేకంగా సూచించవచ్చు; అయితే ఇక్కడ హీబ్రూ పాఠ్యం ‘పస్కా గొఱ్ఱెపిల్ల’ అని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: కనిపించకూడదు
  rationale: נפעל రూపంలోని నిషేధార్థక నిష్క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׂאֹר
  choice: పులిసిన పిండి
  rationale: పస్కా ఆచార సందర్భంలో పిండిని పులియబెట్టే పదార్థం లేదా ఇప్పటికే పులిసిన పిండి అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కేవలం ఆధునిక వాణిజ్య ‘ఈస్ట్’కు పరిమితం చేయదు.
- source_word: בְּכָל גְּבֻלְךָ
  choice: నీ ప్రాంతమంతటిలో
  rationale: గְּבוּל యొక్క ‘సరిహద్దు/అధీన ప్రాంతం’ భావంలో ఇక్కడ వ్యాప్తి పరిధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: יָלִין
  choice: రాత్రంతా మిగిలి ఉండకూడదు
  rationale: లין యొక్క ‘రాత్రి గడపడం/రాత్రివరకు ఉంచబడడం’ భావాన్ని ఆహార సంబంధ నిషేధంలో స్పష్టంగా అందిస్తుంది.
- source_word: מִן הַבָּשָׂר
  choice: మాంసంలో ఏదీ
  rationale: בשר అక్షరార్థంగా ‘శరీరం/మాంసం’; బలి సందర్భంలో తినదగిన బలి మాంసాన్ని సూచించేందుకే సహజ తెలుగు ‘మాంసం’ ఎంచుకోబడింది.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: నీవు బలిగా అర్పించే
  rationale: זבח లోని బలిగా వధించి అర్పించే ఆచార భావాన్ని కేవలం ‘చంపు’ అని కాకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּעֶרֶב
  choice: సాయంకాలం
  rationale: మూలంలోని సాధారణ కాలసూచనకు నేరుగా, సహజంగా సరిపోతుంది.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: మూలంలో లేని ‘పండుగ’ లేదా ‘పస్కా’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలుపుతుంది.
- source_word: לַבֹּקֶר
  choice: ఉదయం వరకు
  rationale: ఈ నిషేధంలో కాలపరిమితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘మొదటి రోజున’ అర్పించిన ‘మాంసం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా బలి మాంసం అని మాత్రమే అనువదించడం
  alternative: దీనిని ప్రత్యేకంగా పస్కా బలి లేదా పస్కా గొఱ్ఱెపిల్ల మాంసం అని పేర్కొనడం
  rationale: హీబ్రూ పాఠ్యం ‘మొదటి రోజున సాయంకాలం నీవు బలిగా అర్పించే మాంసం’ అని మాత్రమే చెబుతుంది. అది పస్కా బలినే ప్రత్యేకంగా సూచిస్తుందా, లేక పండుగ ప్రారంభానికి సంబంధించిన బలులను విస్తృతంగా సూచిస్తుందా అన్నది ప్రధాన పాఠ్యంలో తీర్మానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞాత్మక గంభీరతను ‘కూడదు’ రూపాలతో నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించింది. మూలంలోని ఏకవచన సంబోధనను ‘నీ/నీవు’గా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
