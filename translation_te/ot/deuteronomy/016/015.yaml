language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: te
  text: ఏడు రోజుల పాటు యాహ్వే ఎంచుకొనే స్థలంలో నీ దేవుడైన యాహ్వేకు పండుగను జరుపుకోవాలి. ఎందుకంటే నీ పంట దిగుబడి అంతటిలోనూ, నీ చేతుల పని అంతటిలోనూ నీ దేవుడైన యాహ్వే నిన్ను ఆశీర్వదిస్తాడు; నీవు సంపూర్ణ ఆనందంతో ఉంటావు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు సంతోషంగా మాత్రమే ఉంటావు’; లేదా, ‘నీవు తప్పకుండా సంతోషిస్తావు.’ హీబ్రూ పదబంధం సంపూర్ణమైన, కల్తీలేని ఆనందాన్ని బలంగా నొక్కిచెబుతుంది.
    reason: אַךְ అనే పదం నిర్బంధార్థాన్నీ ఉద్ఘాటనార్థాన్నీ కలిగి ఉండగలందున, సాధ్యమైన ప్రత్యామ్నాయాలను భద్రపరచడం.
lexical_decisions:
- source_word: תָּחֹג
  choice: పండుగ జరుపుకోవాలి
  rationale: חגג సాధారణంగా సంతోషించడాన్ని మాత్రమే కాక, యాత్రా పండుగను ఆచరించడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం పండుగ సందర్భాన్నీ ఆచరణనూ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל ఉపసర్గ పండుగ యాహ్వేకు అంకితమైనదని సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ఈ దిశను సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: యాహ్వే ఎంచుకొనే స్థలంలో
  rationale: దేవుడు ఎంపిక చేసే ఆరాధనా స్థలాన్ని సమీపంగా, సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ఆజ్ఞకు, దానితో ముడిపడిన ఆనందానికి కారణమైన దైవిక ఆశీర్వాదాన్ని పరిచయం చేస్తుంది.
- source_word: יְבָרֶכְךָ
  choice: నిన్ను ఆశీర్వదిస్తాడు
  rationale: ברך అనే నిబంధనా సంబంధమైన సాధారణ పదాన్ని నిలుపుతూ, భవిష్యత్ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תְּבוּאָתְךָ
  choice: నీ పంట దిగుబడి
  rationale: תבואה వ్యవసాయ ఉత్పత్తి లేదా దిగుబడిని విస్తృతంగా సూచిస్తుంది; దీనిని కేవలం ధాన్యానికి పరిమితం చేయదు.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: నీ చేతులు చేసే పని
  rationale: మూలంలోని ‘నీ చేతుల పని’ అనే భావచిత్రాన్ని కాపాడుతూ, ఆధునిక పాఠకునికి సహజంగా అర్థమయ్యేలా చేస్తుంది.
- source_word: וְהָיִיתָ
  choice: అప్పుడు నీవు … ఉంటావు
  rationale: ముందున్న ఆశీర్వాదానికి అనుసరించే ఫలితాన్ని తెలుగులో స్పష్టంగా కలుపుతుంది; అయినా మూలంలోని భావసంబంధాన్ని అతిగా వివరిస్తూ పోదు.
- source_word: אַךְ שָׂמֵחַ
  choice: పూర్తిగా సంతోషంగా
  rationale: אַךְ యొక్క నిర్బంధార్థం మరియు ఉద్ఘాటనార్థం మధ్య ఉన్న సంభావ్య అర్థాన్ని ప్రధాన పాఠ్యంలో సంపూర్ణ ఆనందంగా అందించి, ప్రత్యామ్నాయాలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యం వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ఆధునిక పండిత ఉచ్చారణకు దగ్గరగా నిలుపుతుంది.
- issue: וְהָיִיתָ אַךְ שָׂמֵחַ అనే ముగింపు వాక్యభాగం యొక్క బలం
  choice: అప్పుడు నీవు పూర్తిగా సంతోషంగా ఉంటావు
  alternative: నీవు సంతోషంగా మాత్రమే ఉంటావు; నీవు తప్పకుండా సంతోషిస్తావు
  rationale: אַךְ నిర్బంధాన్ని (‘మాత్రమే’) లేదా బలమైన ఉద్ఘాటనను సూచించగలదు. పండుగ, పంట ఆశీర్వాదం అనే సందర్భంలో ప్రధాన పాఠ్యం కల్తీలేని సంపూర్ణ ఆనందాన్ని సూచిస్తుంది; నిజమైన భాషా సందిగ్ధతను పాదసూచిక భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన సంబోధనను కొనసాగిస్తూ, గౌరవప్రదమైన కాని సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వ్యవసాయ, శ్రమ సంబంధ భావచిత్రాలను సాధ్యమైనంతవరకు నిలిపాం.
