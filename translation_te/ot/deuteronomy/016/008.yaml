source:
  edition: WLC
  text: שֵׁ֥שֶׁת יָמִ֖ים תֹּאכַ֣ל מַצּ֑וֹת וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י עֲצֶ֨רֶת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תַעֲשֶׂ֖ה מְלָאכָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: te
  text: ఆరు రోజులు మీరు పులియని రొట్టెలు తినాలి; ఏడవ రోజున మీ దేవుడైన యాహ్వేకు గంభీర సభ ఉండాలి.[a] ఆ రోజున మీరు ఏ పనీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర సభ’ లేదా ‘ముగింపు సభ.’ హీబ్రూ పదం పండుగకు సంబంధించిన అధికారిక సమాహారాన్ని సూచిస్తుంది; పండుగ ముగింపు సమాహారం అనే భావఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులు
  rationale: ఈ నిర్మాణం కాలవ్యవధిని సూచిస్తుంది; తెలుగులో ‘ఆరు రోజులు’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: תֹּאכַל
  choice: మీరు ... తినాలి
  rationale: న్యాయసంబంధ సందర్భంలో ఈ అపూర్ణ క్రియ ఆదేశార్థకంగా ఉంది; ‘తినాలి’ ఆ విధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పస్కా సందర్భంలో ఇది పులియబెట్టని రొట్టెలను సూచిస్తుంది; ఈ రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: వావ్ సాధారణ అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో అర్థప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా అనుసంధానం నిలిపాం.
- source_word: עֲצֶרֶת
  choice: గంభీరమైన సభ
  rationale: ఈ నామవాచకం పండుగకు సంబంధించిన అధికారిక, ప్రత్యేక సమాహారాన్ని సూచిస్తుంది; ముగింపు సభ అనే సంభావ్య ఛాయను ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా నిలిపాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: లామెద్ సంబంధం లేదా అంకితభావాన్ని సూచిస్తుంది; ‘యెహోవాకు’ మూలానికి దగ్గరగా ఉంది. יהוה అనే ఒడంబడిక నామాన్ని పేరుగానే అనువదించాం.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని తెలుగు గౌరవ/సామూహిక సంబోధనలో సహజమైన ‘మీ’తో వ్యక్తం చేసి, దైవనామంతో అనుసంధానించాం.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: మీరు ఏ పనీ చేయకూడదు
  rationale: ఈ పదబంధం పనిని నిషేధిస్తుంది; ‘ఏ పనీ చేయకూడదు’ నిషేధ బలాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా పరిచితమైన నామరూపం ‘యెహోవా’గా ఇచ్చాం; మూల ఉచ్చారణను ప్రతిబింబించే ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: עֲצֶרֶת యొక్క పండుగసంబంధ భావం
  choice: గంభీరమైన సభ
  alternative: పరిశుద్ధ సభ / ముగింపు సభ
  rationale: పదం ప్రత్యేకంగా కూడే పండుగ సభను సూచిస్తుంది; అది ముగింపు సమాహారం అనే ఛాయ కలిగి ఉండవచ్చు గాని, ఆ భావాన్ని ఏకైక అర్థంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ఆదేశాలను ‘తినాలి,’ ‘చేయకూడదు’ రూపాల్లో సహజంగా వ్యక్తం చేశాం. మూలంలో సంబోధన వ్యాకరణపరంగా ఏకవచనమైనప్పటికీ, తెలుగులో ధర్మశాస్త్ర సమాజాన్ని ఉద్దేశించే గౌరవప్రదమైన ‘మీరు’ రూపాన్ని ఉపయోగించాం.
