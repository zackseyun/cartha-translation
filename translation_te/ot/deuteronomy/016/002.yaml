revisions:
- from: నీ దేవుడైన యెహోవాకు పస్కాను[a] మందలోనుండి, పశువుల మందలోనుండి బలిగా అర్పించాలి. యెహోవా తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎన్నుకునే స్థలంలో దాన్ని అర్పించాలి.
  to: నీ దేవుడైన యెహోవాకు, గొర్రెలు, మేకల మందనుండి, పశువుల మందనుండి పస్కాను బలిగా అర్పించాలి; యెహోవా తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎన్నుకునే స్థలంలో అర్పించాలి.[a]
  rationale: The revision keeps all source elements and the interpretive ambiguity of פֶּסַח with “flock and herd,” while joining the material into a coherent Telugu rendering. The footnote anchor is retained and its wording is aligned with the revised livestock expression.
