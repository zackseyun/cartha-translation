source:
  edition: WLC
  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: te
  text: నీ దేవుడైన యెహోవాకు, గొర్రెలు, మేకల మందనుండి, పశువుల మందనుండి పస్కాను బలిగా అర్పించాలి; యెహోవా తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎన్నుకునే స్థలంలో అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘పస్కా’ అనే పదంతో పాటు ‘గొర్రెలు, మేకల మందనుండి, పశువుల మందనుండి’ అని ఉంది. దీన్ని కొందరు పస్కా బలిని మాత్రమే కాకుండా, పస్కా/పులియని రొట్టెల పండుగకు సంబంధించిన ఇతర బలులను కూడా కలిపి సూచిస్తున్నదని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: బలిగా అర్పించాలి
  rationale: זבח బలిసంబంధమైన వధను సూచిస్తుంది; ఆధునిక తెలుగులో ‘బలిగా అర్పించాలి’ ఆ ఆరాధనా చర్యను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: פֶּסַח
  choice: పస్కాను
  rationale: ఈ పదం పస్కా ఆచారాన్ని లేదా పస్కా బలిని సూచించగలదు. క్రియ ఇప్పటికే బలి భావాన్ని వ్యక్తం చేస్తున్నందున, మూలంలోని సంక్షిప్తతను మరియు భావవ్యాప్తిని నిలుపుతూ ‘పస్కాను’ అని అనువదించాం.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: ל అర్పణ యొక్క గ్రహీతను సూచిస్తుంది. יהוהను వెల్లడించబడిన దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: צֹאן וּבָקָר
  choice: మందలోనుండి, పశువుల మందలోనుండి
  rationale: צאן చిన్న పశువుల మందను, בקר పెద్ద పశువుల మందను సూచించే సమూహపదాలు. నిర్దిష్ట జాతులను అతిగా పేర్కొనకుండా, అర్పణకు జంతువులు ఈ రెండు వర్గాలనుండి వస్తాయనే అంతర్భావాన్ని తెలుగులో స్పష్టం చేశాం.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: యెహోవా ... ఎన్నుకునే స్థలంలో
  rationale: మోషే ప్రసంగ సమయానికి దేవుడు ఎన్నుకోబోయే కేంద్రీయ ఆరాధనా స్థలాన్ని ఈ పదబంధం సూచిస్తుంది.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ నివసింపజేయడానికి
  rationale: שכן యొక్క హిఫీల్ రూపంలోని కారణార్థక భావాన్ని ‘నివసింపజేయడానికి’ నిలుపుతుంది; ‘తన నామం’ అనే నిబంధనాత్మక దైవసన్నిధి భాషను సరళీకరించకుండా కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంతో అందించాం.
- issue: ‘పస్కా’కు ‘మంద మరియు పశువుల మంద’తో ఉన్న సంబంధం
  choice: మూలంలోని విస్తృత పశువర్గ సూచనను ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘పస్కా బలి మరియు పండుగ బలులు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: ఈ వాక్యం గొర్రె/మేక మాత్రమే కాక మంద, పశువుల మంద రెండింటినీ పేర్కొంటుంది. అది పస్కా బలితో పాటు పండుగకు సంబంధించిన ఇతర బలులను కూడా కలుపుతుందా అనే విషయాన్ని ప్రధాన పాఠంలో తీర్మానించకుండా, పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నివసింపజేయడానికి’ అనే కొద్దిగా శాస్త్రభాషాత్మక రూపాన్ని మూలంలోని కారణార్థక దైవసన్నిధి నుడికారాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా నిలిపాం.
