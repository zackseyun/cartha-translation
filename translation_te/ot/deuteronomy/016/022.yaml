id: DEU.16.22
reference: Deuteronomy 16:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: te
  text: నీకోసం ఒక పూజా స్తంభాన్ని[a] నిలబెట్టకూడదు; నీ దేవుడైన యాహ్వే దానిని ద్వేషిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిలువురాయి,’ ‘ఆరాధనా స్తంభం.’ హీబ్రూ పదం ఆరాధనతో సంబంధమున్న నిలబెట్టిన రాయిని సూచిస్తుంది.
    reason: మַצֵּבָה అనే పదానికి ‘స్తంభం,’ ‘నిలువురాయి,’ లేదా ఆరాధనలో ఉపయోగించే రాతి స్తంభం అనే భావాలు ఉండగలవు.
lexical_decisions:
- source_word: תָקִים
  choice: నిలబెట్టకూడదు
  rationale: קום యొక్క హిఫీల్ రూపం ఇక్కడ ఒక వస్తువును నిలువుగా నెలకొల్పడం లేదా ప్రతిష్ఠించడం అనే భావాన్ని ఇస్తుంది. నిషేధార్థక לֹאతో కలిసి ‘నిలబెట్టకూడదు’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְךָ
  choice: నీ కోసం
  rationale: దాత్యర్థక ప్రత్యయం వ్యక్తిగత ప్రమేయం లేదా తనకోసం ఏర్పాటు చేసుకోవడం అనే భావాన్ని సూచిస్తుంది; ‘నీ కోసం’ దానిని స్పష్టంగా ఉంచుతుంది.
- source_word: מַצֵּבָה
  choice: పూజా స్తంభం
  rationale: ఈ పదం నిలబెట్టిన రాయి లేదా స్తంభాన్ని, ముఖ్యంగా ఆరాధనతో సంబంధమున్న వస్తువును సూచించగలదు. ‘పూజా స్తంభం’ సందర్భంలోని మతపరమైన ప్రయోజనాన్ని సాధారణ పాఠకునికి తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר
  choice: దానిని
  rationale: హీబ్రూలో ఇది సంబంధవాచక ఉపవాక్యాన్ని ప్రారంభిస్తుంది. తెలుగులో ‘దానిని ... ద్వేషిస్తాడు’ అని వాక్యాన్ని విభజించడం సహజంగా ఉండి, పూర్వపదంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: שָׂנֵא
  choice: ద్వేషిస్తాడు
  rationale: ఈ క్రియ బలమైన విరక్తి లేదా ద్వేషాన్ని నేరుగా వ్యక్తం చేస్తుంది. ‘ద్వేషిస్తాడు’ మూలంలోని తీవ్రతను తగ్గించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని, నిబంధన సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: מַצֵּבָה యొక్క ఆరాధనా సంబంధిత భావం
  choice: పూజా స్తంభం
  alternative: నిలువురాయి / స్తంభం
  rationale: పదం స్వతహాగా నిలబెట్టిన రాయి లేదా స్తంభాన్ని సూచించినా, ఈ నియమావళి సందర్భంలో అది ఆరాధనతో సంబంధమున్న వస్తువు. ‘పూజా’ అనే విశేషణం ఆ సందర్భాన్ని తెలియజేస్తుంది; పదానికి సాధ్యమైన మరింత అక్షరార్థ రూపాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన ప్రత్యక్ష సంబోధనను ఉంచి, గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని నిషేధం మరియు ‘ద్వేషిస్తాడు’ అనే బలమైన పదాన్ని మృదూకరించలేదు.
