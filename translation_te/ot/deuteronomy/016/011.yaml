source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే సన్నిధిలో నీవు, నీ కుమారుడు, నీ కుమార్తె, నీ దాసుడు, నీ దాసి, నీ పట్టణాల్లోనున్న లేవీయుడు, నీ మధ్యనున్న పరదేశి[a], తండ్రిలేనివాడు[b], విధవరాలు—నీ దేవుడైన యాహ్వే తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎన్నుకునే స్థలంలో సంతోషించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్థిరనివాసిగా ఉన్న విదేశీయుడు.’ హెబ్రీ పదం ఇశ్రాయేలు సమాజ వ్యవస్థలో నివసించే ఇశ్రాయేలీయేతర వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అనాథ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: సంతోషించాలి
  rationale: שׂמח ఆనందించడాన్ని సూచిస్తుంది. ఆజ్ఞాత్మక నిబంధన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘సంతోషించాలి’ ఎంచుకున్నాం.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ‘ముఖం ఎదుట’ అనే మూల భావం ఇక్కడ దేవుని సమక్షంలో ఆరాధనా ఆనందాన్ని సూచిస్తుంది; తెలుగులో ‘సన్నిధిలో’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וְעַבְדְּךָ / וַאֲמָתֶךָ
  choice: నీ దాసుడు, నీ దాసి
  rationale: ఈ సామాజిక-చట్టపర సందర్భంలో עבד/אמה సూచించే ఆధీన స్థితిని ‘సేవకుడు/సేవకురాలు’ అని మృదువుపరచకుండా, లింగ భేదాన్ని కూడా నిలిపాం.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో నివసించే
  rationale: అక్షరార్థంగా ‘నీ గుమ్మాల్లో’ అయినా, ద్వితీయోపదేశకాండ సందర్భంలో ఇది స్థానిక పట్టణ సమాజాలను సూచిస్తుంది. ఆధునిక పాఠకునికి భావం స్పష్టంగా ఉండేలా అనువదించాం.
- source_word: וְהַגֵּר
  choice: నీ మధ్య నివసించే పరదేశి
  rationale: גֵּר సాధారణ అపరిచితుడు కాదు; ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసించే అన్యదేశీయుడు. ‘నివసించే పరదేశి’ ఆ సామాజిక భావాన్ని నిలుపుతుంది.
- source_word: וְהַיָּתוֹם
  choice: తండ్రిలేనివాడు
  rationale: יתום అనాథను సూచించగలిగినా, పితృరక్షణ కోల్పోయిన వ్యక్తి అనే మూల సామాజిక భావాన్ని ‘తండ్రిలేనివాడు’ సమీపంగా నిలుపుతుంది.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ నివసింపజేయడానికి
  rationale: שׁכן యొక్క causative రూపాన్ని నిలుపుతూ, దేవుని నామం ఎన్నుకున్న స్థలంలో నివసించే ద్వితీయోపదేశకాండ సూత్రాన్ని అతిగా వివరణ చేయకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా నామంగానే ఉంచాం.
- issue: עבד/אמה యొక్క సామాజిక స్థితి
  choice: దాసుడు / దాసి
  alternative: సేవకుడు / సేవకురాలు
  rationale: చట్టపర గృహసందర్భంలో ఆధీన లేదా బానిస స్థితి ప్రాముఖ్యమైనది. ‘దాసుడు/దాసి’ మూలంలోని కఠిన సామాజిక వాస్తవాన్ని మసకబార్చదు.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם అనే పరిశుద్ధస్థల సూత్రం
  choice: తన నామాన్ని అక్కడ నివసింపజేయడానికి
  alternative: తన నామం అక్కడ నివసించడానికి
  rationale: హెబ్రీ causative భావాన్ని నిలుపుతూ, దేవుని అతీతత్వం మరియు ఎన్నుకున్న స్థలంలోని నిబంధనా సన్నిధి మధ్య ఉన్న theological tension‌ను పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. జాబితా పొడవులో కర్తలందరూ ఆనందంలో భాగస్వాములని స్పష్టం చేయడానికి ‘మీరందరూ’ చేర్చబడింది; ఇది మూలంలోని సమూహార్థాన్ని వివరిస్తుంది, కొత్త వర్గాన్ని జోడించదు.
