revisions:
- from: నీవు దానితో పులిసిన రొట్టె తినకూడదు. ఏడు రోజులపాటు దానితో పులియని రొట్టెలను, అంటే బాధల రొట్టెను[a], తినాలి. ఎందుకంటే నీవు ఐగుప్తు దేశం నుండి తొందరగా బయలుదేరావు. నీవు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజును నీ జీవితకాలమంతా జ్ఞాపకం చేసుకోవడానికి ఇలా చేయాలి.
  to: నీవు దానితో పులిసిన రొట్టె తినకూడదు. ఏడు రోజులపాటు దానితో పులియని రొట్టెలను, శ్రమ రొట్టెను[a], తినాలి; ఎందుకంటే నీవు ఐగుప్తు దేశం నుండి తొందరపాటుతో బయలుదేరావు. తద్వారా నీవు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజును నీ జీవితకాలమంతా జ్ఞాపకం చేసుకుంటావు.
  rationale: Removed the unsupported final instruction “ఇలా చేయాలి” and rendered the Hebrew purpose relationship with “తద్వారా.” Replaced the less idiomatic “బాధల రొట్టె” with “శ్రమ రొట్టె,” preserving the source’s deliberate breadth, which the footnote records.
