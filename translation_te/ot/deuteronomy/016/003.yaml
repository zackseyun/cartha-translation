  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: te
  text: నీవు దానితో పులిసిన రొట్టె తినకూడదు. ఏడు రోజులపాటు దానితో పులియని రొట్టెలను, శ్రమ రొట్టెను[a], తినాలి; ఎందుకంటే నీవు ఐగుప్తు దేశం నుండి తొందరపాటుతో బయలుదేరావు. తద్వారా నీవు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజును నీ జీవితకాలమంతా జ్ఞాపకం చేసుకుంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దారిద్ర్యపు రొట్టె’ లేదా ‘దుస్థితి రొట్టె.’ హీబ్రూ పదబంధం నిర్గమనంతో ముడిపడిన శ్రమ, లేమి లేదా బాధను నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: దానితో
  rationale: పస్కా బలితో పాటు రొట్టెను తినడాన్ని సూచించే సందర్భోచిత అర్థం ఇది; అక్షరార్థమైన ‘దానిమీద’ కంటే ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: חָמֵץ
  choice: పులిసిన రొట్టె
  rationale: ఈ భోజన సందర్భంలో ఇది పులియబెట్టే పదార్థాన్ని మాత్రమే కాకుండా పులిసిన ఆహారాన్ని, ముఖ్యంగా రొట్టెను, సూచిస్తుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పండుగలో తినే ఈ ఆహారాన్ని స్పష్టంగా, సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: לֶחֶם עֹנִי
  choice: బాధల రొట్టె
  rationale: עֹנִי సూచించగల బాధ, దారిద్ర్యం, దుస్థితి అనే భావ పరిధిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా, నిర్గమనంతో ముడిపడిన కష్టాన్ని ప్రధానంగా నిలుపుతుంది.
- source_word: בְחִפָּזוֹן
  choice: తొందరగా
  rationale: ఐగుప్తు నుండి జరిగిన అత్యవసర నిష్క్రమణను అదనపు వివరణ లేకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן תִּזְכֹּר
  choice: జ్ఞాపకం చేసుకోవడానికి
  rationale: לְמַעַן సూచించే ఉద్దేశాన్ని, దాని తరువాతి క్రియతో కలిపి సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: నీ జీవితకాలమంతా
  rationale: జీవితంలోని రోజులన్నిటిలో నిరంతరంగా జ్ఞాపకం చేసుకోవాలనే పంపిణీ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: לֶחֶם עֹנִי అనే పదబంధం నిర్గమన జ్ఞాపకంతో ఉన్న సంబంధం
  choice: బాధల రొట్టె
  alternative: దారిద్ర్యపు రొట్టె; దుస్థితి రొట్టె
  rationale: ఈ ఆచారపు రొట్టె ఇశ్రాయేలు అనుభవించిన కష్టాన్నీ విమోచననూ జ్ఞాపకం చేస్తుంది. ‘బాధలు’ అనే పదం అర్థాన్ని కేవలం ఆర్థిక పేదరికానికే పరిమితం చేయకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూలోని ఏకవచన సంబోధనను ‘నీవు’తో నిలుపుతూ, మూలంలోని ఉద్దేశ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి చివరి వాక్యంలో ‘ఇలా చేయాలి’ అని స్పష్టీకరించబడింది.
