review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the food terms, the accompaniment sense of עָלָיו, the seven-day duration, the haste of the exodus, and the lifelong memorial. However, the final sentence adds “ఇలా చేయాలి” (“this is to be done”), which is not stated in the Hebrew. The purpose clause should be connected to the preceding commands without this added instruction.
  naturalness: The Telugu is generally clear and modern. “శ్రమ రొట్టె” is a more natural, established Telugu expression for לֶחֶם עֹנִי than “బాధల రొట్టె,” while retaining the sense of affliction/hardship. Joining the purpose clause with “తద్వారా” makes the final relationship readable without adding content.
  terminology: “పులిసిన రొట్టె,” “పులియని రొట్టెలు,” “ఐగుప్తు దేశం,” and “తొందరపాటుతో” are suitable. “శ్రమ రొట్టె” preserves the semantic range of עֹנִי; the footnote appropriately records poverty and misery as alternatives.
  issues:
  - severity: medium
    issue: The phrase “ఇలా చేయాలి” adds an explicit instruction absent from the source.
    rationale: The Hebrew concludes with a purpose clause, “so that you may remember,” not with a separate command to do this. The added phrase should be removed.
  - severity: low
    issue: “బాధల రొట్టె” is less idiomatic than “శ్రమ రొట్టె.”
    rationale: The latter is natural modern Telugu and conveys the hardship/affliction sense of לֶחֶם עֹנִי without restricting it to economic poverty.
  revised_text: నీవు దానితో పులిసిన రొట్టె తినకూడదు. ఏడు రోజులపాటు దానితో పులియని రొట్టెలను, శ్రమ రొట్టెను[a], తినాలి; ఎందుకంటే నీవు ఐగుప్తు దేశం నుండి తొందరపాటుతో బయలుదేరావు. తద్వారా నీవు ఐగుప్తు దేశం నుండి బయలుదేరిన రోజును నీ జీవితకాలమంతా జ్ఞాపకం చేసుకుంటావు.
