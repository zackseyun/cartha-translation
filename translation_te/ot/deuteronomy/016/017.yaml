review_pass:
  verdict: revise
  source_fidelity: The distributive force of אִישׁ, the two proportional כְּ phrases, and the relative clause are substantially represented. However, יְהוָה should align with the project’s stated rendering policy and English audit trail as “యాహ్వే,” rather than “యెహోవా.”
  naturalness: “తన చేతి కానుక” is an overly literal and unnatural Telugu collocation. “తన చేతిలోని కానుక” communicates the available gift naturally while retaining the hand imagery; the footnote can preserve the literal Hebrew wording.
  terminology: Use “యాహ్వే” for the Tetragrammaton, consistently with the supplied POB audit trail. “దేవుడైన యాహ్వే” naturally expresses “Yahweh your God.”
  issues:
  - severity: medium
    issue: The divine name is rendered “యెహోవా.”
    rationale: The English POB audit trail explicitly selects “Yahweh” for יְהוָה. “యాహ్వే” is the corresponding Telugu transliteration and should be used for consistency with the project policy.
  - severity: low
    issue: “తన చేతి కానుక” is unnatural in modern standard Telugu.
    rationale: Though structurally literal, it can sound as though the hand itself gives or possesses a gift. “తన చేతిలోని కానుక” is idiomatic Telugu and retains the source image, while the note records the literal idiom.
  revised_text: ప్రతి పురుషుడు తన చేతిలోని కానుకకు తగినట్లుగా, నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన ఆశీర్వాదానికి తగినట్లుగా ఇవ్వాలి.
