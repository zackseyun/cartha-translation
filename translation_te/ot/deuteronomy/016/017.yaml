  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֖ישׁ כְּ/מַתְּנַ֣ת יָד֑/וֹ כְּ/בִרְכַּ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: te
  text: ప్రతి పురుషుడు తన చేతిలోని కానుకకు తగినట్లుగా, నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన ఆశీర్వాదానికి తగినట్లుగా ఇవ్వాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: ప్రతి పురుషుడు
  rationale: ఏకవచన నామవాచకం ఇక్కడ విభజనార్థకంగా ‘ప్రతి పురుషుడు’ అనే భావాన్ని ఇస్తుంది; మూలంలోని లింగ సూచనను నిలుపుతుంది.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: తన చేతి కానుకకు తగినట్లుగా
  rationale: כְּ అనుపాతాన్ని సూచిస్తుంది; ‘చేతి కానుక’ అనే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని వ్యావహారిక భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: כְּבִרְכַּת
  choice: ఆశీర్వాదానికి తగినట్లుగా
  rationale: ముందున్న כְּ అనుపాత భావాన్ని ఇస్తుంది; దేవుడు ప్రసాదించిన సమృద్ధికి అనుగుణంగా ఇవ్వాలనే భావం సందర్భంలో ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా తెలిసిన వ్యక్తినామ రూపంతో అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, దైవనామంతో కూడిన నిబంధనా సంబోధనను నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: నీకు ఇచ్చిన
  rationale: సంబంధ వాక్యం ‘ఆశీర్వాదం’ను విశేషిస్తుంది; హీబ్రూ సంపూర్ణ క్రియను సహజమైన తెలుగు భూతకృదంత రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంలో ఉంచి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని అనుపాత నిర్మాణాన్ని రెండుసార్లు ‘తగినట్లుగా’ అని నిలిపి, ‘చేతి కానుక’ అనే రూపకానికి పాదసూచిక ఇచ్చాం.
