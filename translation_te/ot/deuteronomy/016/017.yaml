  to: ప్రతి పురుషుడు తన చేతిలోని కానుకకు తగినట్లుగా, నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన ఆశీర్వాదానికి తగినట్లుగా ఇవ్వాలి.
