revisions:
- from: నీ పండుగలో నీవు సంతోషించాలి—నీవు, నీ కుమారుడు, నీ కుమార్తె, నీ దాసుడు, నీ దాసి, లేవీయుడు, నీ పట్టణాల్లో నివసించే పరదేశి[a], తండ్రిలేనివాడు[b], విధవరాలు—అందరూ సంతోషించాలి.[c]
  to: నీ పండుగలో నీవు సంతోషించాలి—నీవు, నీ కుమారుడు, నీ కుమార్తె, నీ దాసుడు, నీ దాసి, లేవీయుడు, పరదేశి[a], తండ్రిలేనివాడు[b], విధవరాలు—నీ పట్టణాల్లో నివసించే వీరందరూ సంతోషించాలి.[c]
  rationale: చివరి సంబంధవాక్యాన్ని జాబితా చివరికి మార్చి, అది పరదేశి మాత్రమే కాక జాబితాలో పేర్కొన్న వారందరికీ వర్తించేలా చేశాం. మిగిలిన పదజాలం మూలానికి నమ్మకంగా, ఆధునిక తెలుగులో సహజంగా ఉన్నందున నిలుపబడింది.
