source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: te
  text: నీ పండుగలో నీవు సంతోషించాలి—నీవు, నీ కుమారుడు, నీ కుమార్తె, నీ దాసుడు, నీ దాసి, లేవీయుడు, పరదేశి[a], తండ్రిలేనివాడు[b], విధవరాలు—నీ పట్టణాల్లో నివసించే వీరందరూ సంతోషించాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘పరదేశి’ అంటే ఇశ్రాయేలీయుడు కానప్పటికీ వారి మధ్య నివసించే వ్యక్తి; ‘పరదేశ నివాసి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అనాథ’. హీబ్రూ పదం తండ్రి రక్షణ లేని బలహీన సామాజిక స్థితిని ప్రత్యేకంగా ముందుకు తెస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘నీ ద్వారాల్లో ఉన్నవారు’. ఇది నీ పట్టణాల్లో లేదా నీ సమాజ పరిధిలో నివసించేవారిని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: నీవు సంతోషించాలి
  rationale: న్యాయబోధ సందర్భంలో సంయోజక వావుతో వచ్చిన కాలరూపం ఆజ్ఞాత్మక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘సంతోషించాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּחַגֶּךָ
  choice: నీ పండుగలో
  rationale: חַג యాత్రాపండుగను లేదా పండుగ ఉత్సవాన్ని సూచిస్తుంది; ‘పండుగలో’ పాల్గొనడం మరియు ఆ కాలవ్యాప్తి రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: నీ దాసుడు, నీ దాసి
  rationale: ఈ పదాలు బంధిత సామాజిక స్థితిలోని పురుషుడు, స్త్రీని సూచించగలవు. ‘దాసుడు/దాసి’ ఆ స్థితిని ‘సేవకుడు/సేవకురాలు’ కంటే స్పష్టంగా నిలుపుతూ తెలుగులో గౌరవప్రదంగా వినిపిస్తాయి.
- source_word: וְהַלֵּוִי
  choice: లేవీయుడు
  rationale: లేవి గోత్రానికి చెందిన వ్యక్తిని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: וְהַגֵּר
  choice: నీ పట్టణాల్లో నివసించే పరదేశి
  rationale: גֵּר ఇశ్రాయేలీయుల మధ్య స్థిరంగా నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. ‘నివసించే పరదేశి’ సాధారణ విదేశీయుడి కంటే ఈ న్యాయ-సామాజిక భావాన్ని మెరుగ్గా తెలియజేస్తుంది.
- source_word: וְהַיָּתוֹם
  choice: తండ్రిలేనివాడు
  rationale: יָתוֹם అనాథను సూచించగలిగినా, తోరా సామాజిక సందర్భంలో తండ్రి రక్షణ కోల్పోయిన బలహీన స్థితి ప్రధానంగా కనిపిస్తుంది.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో నివసించే
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో’ అయిన ఈ హీబ్రూ నుడికారం అధికార పరిధిలోని పట్టణాలు లేదా సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో అర్థాన్ని సహజంగా అందించేందుకు ‘నీ పట్టణాల్లో నివసించే’ అని ఇచ్చాం.
theological_decisions:
- issue: עֶבֶד / אָמָה అనే ఆధారిత గృహస్థితి పదాల అనువాదం
  choice: దాసుడు / దాసి
  alternative: సేవకుడు / సేవకురాలు
  rationale: మూలంలోని బంధిత సామాజిక స్థితిని మృదువుగా మార్చకుండా నిలుపుతుంది; అయినా ఈ వచనం వారిని పండుగ ఆనందంలో చేర్చాలని ఆజ్ఞాపిస్తుందనే ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- issue: גֵּר యొక్క సామాజిక గుర్తింపు
  choice: నివసించే పరదేశి
  alternative: విదేశీయుడు; పరదేశ నివాసి
  rationale: ఇది కేవలం ప్రయాణికుడినో విదేశీయుడినో కాక, ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతరుని సూచిస్తుంది; ఆధునిక వలస చట్టపరమైన వర్గాలను పాఠ్యంలోకి దిగుమతి చేయదు.
- issue: יָתוֹם యొక్క పరిధి
  choice: తండ్రిలేనివాడు
  alternative: అనాథ
  rationale: మూలపదం అనాథ అనే విస్తృత అర్థాన్ని అనుమతించినప్పటికీ, ప్రాచీన సామాజిక సందర్భంలో తండ్రి రక్షణ లేకపోవడం వల్ల కలిగే బలహీనతను ఈ ఎంపిక ముందుకు తెస్తుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాత్మక శైలి వాడబడింది. హీబ్రూ జాబితా నిర్మాణం నిలుపబడింది; చివర ‘అందరూ సంతోషించాలి’ అని పునరుక్తి చేయడం ద్వారా తెలుగులో జాబితా మొత్తం ప్రధాన క్రియతో స్పష్టంగా అనుసంధానించబడింది.
