revisions:
- from: న్యాయాన్ని, న్యాయాన్నే[a] వెంబడించు. అప్పుడు నీవు జీవించి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశాన్ని స్వాధీనం చేసుకుంటావు[b].
  to: నీవు జీవించి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న భూమిని స్వాధీనం చేసుకోవడానికి న్యాయాన్ని, న్యాయాన్నే[a] వెంబడించు[b].
  rationale: The revision makes the purpose force of לְמַעַן explicit with “...కోవడానికి,” retains the emphatic doubled ‘justice,’ and replaces “దేశం” with “భూమి” to preserve the covenantal sense of ‘the land.’ Footnote b is moved to the governing verb and adjusted grammatically to match the revised purpose construction.
  reviewer_model: gpt-5.6-terra
