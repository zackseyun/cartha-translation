review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the emphatic repetition of צֶדֶק, the singular address, the divine name, and the participial sense of “is giving.” However, “అప్పుడు” (‘then’) reduces לְמַעַן, which expresses purpose, to a merely sequential/resultative connection. “దేశం” is also less precise than “భూమి” for Deuteronomy’s covenantal ‘land.’
  naturalness: The wording is generally clear modern standard Telugu. Recasting the clause so that the purpose relation is explicit produces a more faithful and still natural formal Telugu sentence.
  terminology: “న్యాయం” is appropriate in this judicial context, with “నీతి” correctly retained as a lexical alternative. “యాహ్వే” appropriately represents יהוה. “భూమి” better carries the covenant-land sense of הארץ than “దేశం.”
  issues:
  - severity: medium
    issue: లְמַעַן is rendered as “అప్పుడు.”
    rationale: The Hebrew marks the purpose for pursuing justice (‘so that/in order that’), not simply what happens next. The Telugu should explicitly express this purpose relationship.
  - severity: low
    issue: הָאָרֶץ is rendered as “దేశం.”
    rationale: While possible in some contexts, “భూమి” more directly represents ‘the land’ and preserves Deuteronomy’s covenant-land terminology.
  revised_text: నీవు జీవించి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న భూమిని స్వాధీనం చేసుకోవడానికి న్యాయాన్ని, న్యాయాన్నే[a] వెంబడించు[b].
