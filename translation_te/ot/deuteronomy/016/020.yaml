source:
  edition: WLC
  text: צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְ/יָרַשְׁתָּ֣ אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: te
  text: నీవు జీవించి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న భూమిని స్వాధీనం చేసుకోవడానికి న్యాయాన్ని, న్యాయాన్నే[a] వెంబడించు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిని, నీతినే వెంబడించు.’ హెబ్రీ צֶדֶק అనే పదం న్యాయం, నీతి అనే రెండు భావాలనూ సూచించగలదు; ఇక్కడ న్యాయవిచారణ సందర్భానికి ‘న్యాయం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారసత్వంగా పొందడానికి.’ హెబ్రీ క్రియకు స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం అనే రెండు భావాలూ ఉండగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: న్యాయాన్ని, న్యాయాన్నే
  rationale: ఈ న్యాయవిచారణ సందర్భంలో צֶדֶק అనే పదానికి ప్రజా, న్యాయపరమైన భావం ప్రధానంగా ఉంది. హెబ్రీలోని పునరుక్తి ఇచ్చే బలాన్ని నిలుపుటకు తెలుగులో పదాన్ని పునరుక్తం చేసి, రెండవసారి ‘-నే’ చేర్చాం.
- source_word: תִּרְדֹּף
  choice: వెంబడించు
  rationale: רדף యొక్క ‘వెంటబడు/తీవ్రంగా సాధించడానికి కృషిచేయు’ అనే సజీవ రూపకాన్ని ఇది నిలుపుతుంది; ఏకవచన ఆజ్ఞార్థక సంబోధనను కూడా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: హెబ్రీలో ఆజ్ఞతో దాని ఉద్దేశం లేదా ఫలితాన్ని కలిపే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. తరువాతి క్రియల సందర్భంలో ఇది నిబంధనాత్మక ఫలిత భావాన్ని నిలుపుతుంది.
- source_word: תִּחְיֶה
  choice: నీవు జీవించి
  rationale: חיה యొక్క ప్రాథమిక జీవన భావాన్ని నేరుగా నిలుపుతుంది; ‘వర్ధిల్లడం’ వంటి అదనపు అర్థాన్ని పాఠ్యంలో చేర్చదు.
- source_word: וְיָרַשְׁתָּ
  choice: స్వాధీనం చేసుకుంటావు
  rationale: వాగ్దాన దేశాన్ని పొంది దానిని ఆధీనంలో ఉంచుకునే ירשׁ భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది. ‘వారసత్వంగా పొందడం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ వాగ్దానం చేయబడిన భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉన్నప్పటికీ, దాని నిబంధనాత్మక భావం సందర్భంలో నిలుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువాదం చేశాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని, నిబంధనాత్మక సంబోధనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: హెబ్రీ వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా సమీప దానక్రియను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయవిచారణ సందర్భంలో צֶדֶק అనువాదం
  choice: న్యాయం
  alternative: నీతి
  rationale: చుట్టుపక్కల వచనాలు న్యాయాధిపతులు, పక్షపాతం, లంచం గురించి మాట్లాడుతున్నందున న్యాయపరమైన భావమే ఇక్కడ ప్రధానమైనది. అయితే ‘నీతి’ అనే విస్తృత నైతిక భావం కూడా హెబ్రీ పదంలో ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యనువాదం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఏకవచన సంబోధనను ఉపయోగించాం. హెబ్రీ పునరుక్తిని తొలగించకుండా ఉంచాం; వాక్యప్రవాహం సహజంగా ఉండేందుకు ఉద్దేశం/ఫలిత సంబంధాన్ని ‘అప్పుడు’తో వ్యక్తం చేశాం.
