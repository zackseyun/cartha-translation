source:
  edition: WLC
  text: חַ֧ג הַ/סֻּכֹּ֛ת תַּעֲשֶׂ֥ה לְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים בְּ/אָ֨סְפְּ/ךָ֔ מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: te
  text: గుడారాల పండుగను[a] ఏడు రోజులపాటు జరుపుకోవాలి; నీ కళ్లం నుండీ నీ ద్రాక్ష తొట్టి నుండీ దిగుబడిని సమకూర్చుకునే సమయంలో దానిని జరుపుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పర్ణశాలల పండుగ’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం తాత్కాలిక నివాసాలైన గుడారాలను లేదా పర్ణశాలలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: పర్ణశాలల పండుగ
  rationale: חַג అనేది ఆచరించే పండుగను, סֻכּוֹת అనేది తాత్కాలిక నివాసాలైన పర్ణశాలలను సూచిస్తుంది. ‘పర్ణశాలల పండుగ’ మూలార్థాన్ని, తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన పండుగ పేరును రెండింటినీ నిలుపుతుంది.
- source_word: תַּעֲשֶׂה לְךָ
  choice: జరుపుకోవాలి
  rationale: ‘చేయాలి’ అనే అక్షరార్థం కంటే, పండుగ సందర్భంలో ‘జరుపుకోవాలి’ సహజమైన తెలుగు; ఇది ఆజ్ఞార్థక బాధ్యతను కూడా స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאָסְפְּךָ
  choice: పంటను సమకూర్చుకునే సమయంలో
  rationale: בְּ + infinitive construct కాలసంబంధ అర్థాన్ని ఇస్తుంది. ‘సమయంలో’ అనేది ‘తర్వాత’ అని అవసరానికి మించి నిర్దిష్టం చేయకుండా ఆ సంబంధాన్ని నిలుపుతుంది; ‘పంటను’ సందర్భం ద్వారా సూచితమైన సేకరణ ఫలాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִגָּרְנְךָ
  choice: నీ కళ్లం నుండీ
  rationale: גֹּרֶן ధాన్యాన్ని నూర్చే కళ్లాన్ని సూచిస్తుంది; సాధారణీకరించి ‘పొలం’ అనకుండా మూలంలోని వ్యవసాయ చిత్రాన్ని నిలుపుతుంది.
- source_word: וּמִיִּקְבֶךָ
  choice: నీ ద్రాక్ష తొట్టి నుండీ
  rationale: יֶקֶב ద్రాక్షను తొక్కే తొట్టి లేదా దాని రసం చేరే తొట్టిని సూచిస్తుంది. ‘ద్రాక్ష తొట్టి’ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉండి మూలంలోని దృశ్యాన్ని కాపాడుతుంది.
