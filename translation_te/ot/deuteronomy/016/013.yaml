  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞా శైలిని ఉపయోగించాం. ‘కళ్లం,’ ‘ద్రాక్ష తొట్టి’ అనే స్పష్టమైన వ్యవసాయ పదాలతో మూలంలోని దృశ్యరూపాన్ని నిలిపాం; పండుగకు గుర్తించదగిన సంప్రదాయ నామాన్ని ఉంచి దాని అర్థాన్ని పాదసూచికలో వివరించాం.
