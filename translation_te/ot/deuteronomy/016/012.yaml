id: DEU.16.12
reference: Deuteronomy 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/מִצְרָ֑יִם וְ/שָׁמַרְתָּ֣ וְ/עָשִׂ֔יתָ אֶת הַֽ/חֻקִּ֖ים הָ/אֵֽלֶּה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: te
  text: నీవు ఐగుప్తులో బానిసగా ఉన్నావని జ్ఞాపకం చేసుకో; ఈ కట్టడాలను పాటించి ఆచరించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: జ్ఞాపకం చేసుకో
  rationale: బోధాత్మక సందర్భంలో సంధియుక్త క్రియ ఆజ్ఞార్థక భావాన్ని కలిగి ఉంది; ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: జ్ఞాపకం చేసుకోవలసిన విషయాన్ని పరిచయం చేస్తోంది; తెలుగులో ‘అని’ సహజమైన పూరక సూచకం.
- source_word: עֶבֶד
  choice: బానిసగా
  rationale: ఈజిప్టులో ఇశ్రాయేలీయుల బలవంతపు దాస్యస్థితి సందర్భంలో ‘బానిస’ అనే పదం సామాజిక వాస్తవాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָיִיתָ
  choice: ఉన్నావు
  rationale: గత స్థితిని తెలిపే היה క్రియకు సందర్భానుకూలమైన సరళ తెలుగు రూపం.
- source_word: בְּמִצְרָיִם
  choice: ఐగుప్తులో
  rationale: స్థలాన్ని నేరుగా సూచిస్తుంది; మూలంలో ‘దేశం’ అనే పదం లేదు.
- source_word: וְשָׁמַרְתָּ
  choice: పాటించి
  rationale: నిబంధనాత్మక సందర్భంలో שׁמר ఆజ్ఞలను శ్రద్ధగా అనుసరించడం లేదా పాటించడం అనే భావాన్ని ఇస్తుంది.
- source_word: וְעָשִׂיתָ
  choice: ఆచరించు
  rationale: పాటించడమే కాక వాటిని కార్యరూపంలో అమలు చేయాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַחֻקִּים
  choice: కట్టడాలను
  rationale: חֻקִּים నిర్దేశించబడిన విధులు లేదా శాసనాలను సూచిస్తుంది; బైబిలు న్యాయ సందర్భానికి ‘కట్టడాలు’ గౌరవప్రదమైన, సుపరిచితమైన పదం.
- source_word: הָאֵלֶּה
  choice: ఈ
  rationale: సమీప సూచక విశేషణాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ఈజిప్టు దాస్య సందర్భంలో עֶבֶד పదానువాదం
  choice: బానిస
  alternative: సేవకుడు / దాసుడు
  rationale: ఈ సందర్భం స్వచ్ఛంద సేవను కాక అణచివేతతో కూడిన బలవంతపు దాస్యాన్ని జ్ఞాపకం చేస్తోంది. అందువల్ల ‘బానిస’ చారిత్రక, సామాజిక భావాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గౌరవప్రదమైన శైలితో అనువదించబడింది. మూలంలోని ‘పాటించు—చేయు’ జంట భావాన్ని సహజ తెలుగులో ‘పాటించి ఆచరించు’గా నిలిపింది.
