id: DEU.16.1
reference: Deuteronomy 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: te
  text: ఆబీబు నెలను[a] గమనించు, నీ దేవుడైన యాహ్వేకు పస్కా పండుగను ఆచరించు; ఎందుకంటే ఆబీబు నెలలో నీ దేవుడైన యాహ్వే రాత్రివేళ నిన్ను ఐగుప్తు నుండి బయటకు తీసుకువచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఆబీబు అనేది తొలిగా పక్వమయ్యే ధాన్యంతో సంబంధమున్న నెల పేరు; ప్రత్యామ్నాయ అనువాదం: “వసంతకాలపు నెల.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: ఆచరించు
  rationale: ఇక్కడి ఆజ్ఞ కేవలం జ్ఞాపకం ఉంచుకోవడం కాక, నిర్ణీత నెలకు సంబంధించిన ఆచారాన్ని జాగ్రత్తగా పాటించడాన్ని సూచిస్తుంది.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ఆబీబు నెల
  rationale: ఇది ధాన్యం తొలిగా పక్వమయ్యే కాలంతో సంబంధమున్న ఇశ్రాయేలు ఆరాధనా క్యాలెండరులోని నెలను సూచిస్తుంది; కేవలం ‘వసంతకాలం’ అని అనువదిస్తే ఆ క్యాలెండరు నిర్దిష్టత తగ్గుతుంది.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: పస్కా పండుగను జరుపు
  rationale: అక్షరార్థంగా ‘పస్కాను చేయు’; తెలుగులో ఆ విధి సంబంధమైన పండుగ ఆచరణను సహజంగా తెలియజేయడానికి ‘జరుపు’ అని ఇచ్చాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ ఆ ఆచరణ దేవునికి అంకితమైనదని, ఆయనవైపు ఉద్దేశించబడినదని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో వ్యక్తినామంగా నిలిపాం.
- source_word: הוֹצִיאֲךָ
  choice: నిన్ను ... బయటకు తీసుకువచ్చాడు
  rationale: హిఫీల్ రూపం మరొకరిని వెలుపలికి తీసుకురావడాన్ని సూచిస్తుంది; నిర్గమన సందర్భాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి
  rationale: మూలంలోని బయలుదేరిన స్థలాన్ని స్పష్టంగా సూచిస్తుంది; ‘బయటకు తీసుకువచ్చాడు’తో కలిపి నిర్గమన భావాన్ని నిలుపుతుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: నిర్గమనం జరిగిన సమయాన్ని సూచించే క్రియావిశేషణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత నామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపి, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אָבִיב ను ఋతువుగా లేదా నెల పేరుగా చూపడం
  choice: ఆబీబు అనే క్యాలెండరు పేరు
  alternative: వసంతకాలపు నెల
  rationale: ఈ పండుగ నియమ సందర్భంలో ఇది నిర్గమనం, పస్కాతో ముడిపడిన నిర్దిష్ట ఆరాధనా నెలను సూచిస్తుంది; ఋతువుగా మాత్రమే అనువదిస్తే ఆ నిర్దిష్టత పోతుంది.
translation_notes:
  register: ఆజ్ఞారూప ఏకవచనాన్ని నిలిపి, న్యాయవిధి సందర్భానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడాం. ‘పస్కా’ అనే స్థిరపడిన బైబిలు పదాన్ని ఉంచి, దాని పండుగ సందర్భాన్ని స్పష్టంచేశాం.
