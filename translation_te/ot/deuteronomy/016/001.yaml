  to: ఆబీబు నెలను[a] గమనించు, నీ దేవుడైన యాహ్వేకు పస్కా పండుగను ఆచరించు; ఎందుకంటే ఆబీబు నెలలో నీ దేవుడైన యాహ్వే రాత్రివేళ నిన్ను ఐగుప్తు నుండి బయటకు తీసుకువచ్చాడు.
