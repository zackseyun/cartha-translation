id: DEU.16.10
reference: Deuteronomy 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: te
  text: అప్పుడు నీ దేవుడైన యాహ్వేకు వారాల పండుగను ఆచరించాలి; నీ దేవుడైన యాహ్వే నిన్ను ఆశీర్వదించిన దానికి తగిన పరిమాణంలో, నీవు నీ చేతితో ఇచ్చే స్వచ్ఛంద కానుకను సమర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ చేతితో ఇచ్చే స్వచ్ఛంద కానుక పరిమాణంతో.” హీబ్రూ పదబంధం కానుక స్వచ్ఛందమైనదని, దేవుడు ఇచ్చిన ఆశీర్వాదానికి అనుగుణంగా దాని పరిమాణం ఉండాలని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חַג שָׁבֻעוֹת
  choice: అప్పుడు ... వారాల పండుగను ఆచరించాలి
  rationale: పండుగ సందర్భంలో עשה అంటే అక్షరార్థంగా ‘చేయడం’ కాక, పండుగను ఆచరించడం. సందర్భంలోని క్రమాన్ని וְ సూచిస్తున్నందున ‘అప్పుడు’ సహజంగా ఉంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వేకు
  rationale: ל అంకితం లేదా దిశను సూచిస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: నీ చేతి స్వచ్ఛంద అర్పణను నీ శక్తికొలది
  rationale: అరుదైన מִסַּת పదం కొలత, సామర్థ్యం లేదా తగిన నిష్పత్తిని సూచించవచ్చు; נִדְבַת స్వచ్ఛందతను, יָדְךָ వ్యక్తిగతంగా ఇవ్వడాన్ని తెలియజేస్తాయి. తెలుగు వాక్యంలో సహజంగా ఉండేలా భావాలను క్రమబద్ధం చేశాం.
- source_word: אֲשֶׁר תִּתֵּן
  choice: ఇవ్వాలి
  rationale: ధర్మశాస్త్ర ఆదేశ స్వభావాన్ని తెలుగులో సహజమైన విధ్యర్థక రూపంతో తెలిపాం.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే నిన్ను ఆశీర్వదించిన దానికి తగినట్లుగా
  rationale: దేవుడు ప్రసాదించిన ఆశీర్వాదానికి అనుగుణంగా అర్పణ ఉండాలనే నిష్పత్తి భావాన్ని నిలిపాం; పూర్తి క్రియను తెలుగులో సహజంగా భూతసంబంధ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ప్రత్యేక ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ‘యాహ్వే’ రూపంలో నిలిపాం.
- issue: అర్పణ పరిమాణం స్వచ్ఛందమా లేక నిర్దిష్టమా
  choice: స్వచ్ఛంద అర్పణ, అయితే పొందిన ఆశీర్వాదానికి తగిన పరిమాణంలో
  alternative: నిర్దిష్టంగా విధించిన కప్పం
  rationale: נִדְבָה అర్పణ స్వచ్ఛందమని స్పష్టం చేస్తుంది; מִסַּת మరియు తరువాతి ఆశీర్వాద వాక్యభాగం దాని పరిమాణం సామర్థ్యం లేదా పొందిన సమృద్ధికి అనుగుణంగా ఉండాలని సూచిస్తాయి. ఈ ఉద్రిక్తతను రెండింటినీ ఉంచి అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘వారాల పండుగ’ అనే పారదర్శక పేరును ఉంచాం; ‘నీ చేతి’ అనే హీబ్రూ వ్యక్తీకరణను కూడా నిలిపాం.
