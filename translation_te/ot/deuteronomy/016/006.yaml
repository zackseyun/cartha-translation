  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: te
  text: కాని మీ దేవుడైన యెహోవా తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎంచుకునే స్థలంలోనే[a]—అక్కడ సాయంకాలం, సూర్యాస్తమయ సమయంలో, మీరు ఐగుప్తు నుండి బయలుదేరిన నియమిత వేళకు పస్కా బలిని అర్పించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన నామం అక్కడ నివసించేలా” లేదా “తన నామాన్ని అక్కడ ఉంచడానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పస్కాను వధించాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని ... స్థలంలోనే
  rationale: మునుపటి నిషేధానికి విరుద్ధంగా బలిని అర్పించవలసిన ఏకైక స్థలాన్ని నిర్దేశించే బలమైన పరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמָּקוֹם
  choice: స్థలం
  rationale: ద్వితీయోపదేశకాండంలోని దేవుడు ఎంచుకునే ఆరాధనా ప్రదేశానికి సరళమైన, ప్రామాణిక పదం.
- source_word: יִבְחַר
  choice: ఎంచుకునే
  rationale: న్యాయసంబంధ సందర్భంలోని భావి దృష్టిని తెలుగులో సహజమైన సంబంధ క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: తన నామం నివసించేలా
  rationale: హిఫిల్ రూపంలోని కారణార్థ ఛాయను నిలుపుతూ, దేవుని నామం ఎంచుకున్న స్థలంలో నివసించడమనే హీబ్రూ రూపకాన్ని అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: పస్కా బలిని అర్పించాలి
  rationale: זבח యొక్క బలిసంబంధ వధ భావాన్ని, הַפֶּסַח ఇక్కడ ఆచారంకన్నా బలి అర్పణను సూచిస్తున్న సంగతిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בָּעָרֶב
  choice: సాయంకాలం
  rationale: సూటియైన కాలసూచనకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: సూర్యాస్తమయ సమయంలో
  rationale: పదశః సూర్యుడు లోనికి వెళ్లడం అనే హీబ్రూ నుడికారానికి సరైన సహజార్థం.
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: మీరు ఐగుప్తు నుండి బయలుదేరిన నియమిత వేళకు
  rationale: מוֹעֵד లోని నియమించబడిన సమయ భావాన్నీ, ఐగుప్తు నుండి బయలుదేరిన చారిత్రక సమయంతో దాని సంబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ఎంచుకున్న స్థలంలో దేవుని నామం నివసించడం
  choice: తన నామం నివసించేలా ఎంచుకునే స్థలం
  alternative: తన నామాన్ని అక్కడ ఉంచడానికి ఎంచుకునే స్థలం
  rationale: దేవుడు ఒక ప్రదేశానికే పరిమితుడని చెప్పకుండా, ఆయన నామం ద్వారా నిబంధనాత్మక సన్నిధి ఉండడమనే ద్వితీయోపదేశకాండపు ఉద్వేగాన్ని నిలుపుతుంది.
- issue: పస్కా అనే పదం ఆచారాన్నా, బలిపశువునా సూచించడం
  choice: పస్కా బలి
  alternative: పస్కాను బలిగా అర్పించాలి / పస్కా బలిపశువును వధించాలి
  rationale: ప్రత్యక్ష కర్మగా ఉన్న הַפֶּסַח మరియు బలిసంబంధ క్రియ కలిసి ఇక్కడ బలి అర్పణను సూచిస్తున్నాయి; అయితే నిర్దిష్ట జంతువును వచనం చెప్పనందున 'గొర్రెపిల్ల' అని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఏకవచన హీబ్రూ సంబోధనకు తెలుగులో గౌరవార్థక ‘మీరు/మీ’ వాడాం. ‘యెహోవా,’ ‘పస్కా,’ ‘ఐగుప్తు’ అనే స్థిరపడిన బైబిలు పదాలను నిలుపుతూ వాక్యనిర్మాణాన్ని సహజంగా ఉంచాం.
