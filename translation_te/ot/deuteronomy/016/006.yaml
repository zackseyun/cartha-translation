    rationale: '[a] దేవుని నామం నివసింపజేయబడటానికి సంబంధించిన ప్రత్యామ్నాయాన్ని సూచిస్తుంది; [b] పస్కా బలిని వధించడానికి సంబంధించిన ప్రత్యామ్నాయాన్ని సూచిస్తుంది. కాబట్టి పాఠక స్పష్టత, పాదటిప్పణి-ఆధార అనుసంధానం కోసం వాటిని ఆయా పదబంధాల వెంట ఉంచాలి.'
