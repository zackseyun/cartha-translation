- from: కాని మీ దేవుడైన యెహోవా తన నామం నివసించేలా ఎంచుకునే స్థలంలోనే—అక్కడ సాయంకాలం, సూర్యాస్తమయ సమయంలో, మీరు ఐగుప్తు నుండి బయలుదేరిన నియమిత వేళకు పస్కా బలిని అర్పించాలి.[a][b]
  to: కాని మీ దేవుడైన యెహోవా తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎంచుకునే స్థలంలోనే[a]—అక్కడ సాయంకాలం, సూర్యాస్తమయ సమయంలో, మీరు ఐగుప్తు నుండి బయలుదేరిన నియమిత వేళకు పస్కా బలిని అర్పించాలి.[b]
