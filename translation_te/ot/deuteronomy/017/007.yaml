source:
  edition: WLC
  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: te
  text: అతనిని మరణశిక్షకు గురిచేయడానికి మొదట సాక్షులే అతనిపై చేయి వేయాలి; ఆ తరువాత ప్రజలందరూ చేయి వేయాలి.[a] ఈ విధంగా నీ మధ్యనుండి చెడును తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘సాక్షుల చేయి ... ప్రజలందరి చేయి’ అని ఉంది. తీర్పును అమలు చేయడంలో మొదటి బాధ్యత సాక్షులదేనని తెలిపే న్యాయపరమైన నుడికారం ఇది.
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: చేయి
  rationale: హీబ్రూ ఏకవచన రూపాన్ని, శిక్షను అమలు చేయడంలో బాధ్యత లేదా ప్రత్యక్ష భాగస్వామ్యాన్ని సూచించే న్యాయపరమైన నుడికారాన్ని నిలుపుతుంది.
- source_word: הָעֵדִים
  choice: సాక్షులు
  rationale: ఇది కేవలం నిందమోపేవారిని కాక, న్యాయస్థాన సంబంధమైన సాక్షులను సూచిస్తుంది.
- source_word: בּוֹ
  choice: అతనికి విరోధంగా
  rationale: శిక్షాత్మక సందర్భంలో ‘చేయి’తో కలిసి అతనిపై చర్య తీసుకోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בָרִאשֹׁנָה
  choice: మొదట
  rationale: కార్యాచరణలో ప్రాధాన్యక్రమాన్ని, అంటే సాక్షులే శిక్ష అమలును ఆరంభించాలనే భావాన్ని ఇస్తుంది.
- source_word: לַהֲמִיתוֹ
  choice: అతనిని చంపడానికి
  rationale: מות హిఫిల్ రూపంలోని ‘మరణింపజేయడం’ అనే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; సందర్భం దీనిని న్యాయతీర్పు అమలుగా నిర్దేశిస్తుంది.
- source_word: וְיַד כָּל הָעָם
  choice: ప్రజలందరి చేయి
  rationale: సమాజమంతా తరువాత శిక్ష అమలులో పాల్గొనాలనే భావంతో పాటు మూలంలోని ఏకవచన ‘చేయి’ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בָאַחֲרֹנָה
  choice: ఆ తరువాత
  rationale: ‘మొదట’కు అనుగుణంగా చర్యల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבִעַרְתָּ
  choice: తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసూత్రంలో ఇది అక్షరార్థంగా కాల్చడాన్ని కాక, సమాజంలోనుండి చెడును నిర్మూలించడాన్ని సూచిస్తుంది.
- source_word: הָרָע
  choice: ఆ చెడు
  rationale: వ్యక్తిని మాత్రమే నిర్దిష్టంగా పేర్కొనకుండా, అపరాధం వల్ల సమాజంలో ఉన్న చెడును సూచించే సూత్రబద్ధమైన విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מִקִּרְבֶּךָ
  choice: నీ మధ్యనుండి
  rationale: నిబంధన సమాజం అంతర్గతంగా ఉన్నదాన్ని తొలగించాలనే హీబ్రూ వ్యక్తీకరణను ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ అనే ద్వితీయోపదేశకాండ న్యాయసూత్రం
  choice: నీ మధ్యనుండి ఆ చెడును తొలగించాలి
  alternative: నీ మధ్యనుండి ఆ దుష్టుణ్ణి తొలగించాలి
  rationale: హీబ్రూ పాఠం వ్యక్తిని స్పష్టంగా ‘దుష్టుడు’ అని పేర్కొనకుండా ‘చెడు’ అని విస్తృతంగా చెబుతుంది. అందువల్ల అపరాధిని మాత్రమే లక్ష్యంగా చేసుకునే అర్థానికి పరిమితం చేయకుండా అసలు వాక్యంలోని న్యాయపరమైన, సమాజపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. మూలంలోని ‘చేయి’ అనే ఏకవచన నుడికారాన్ని నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరించాం; పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
