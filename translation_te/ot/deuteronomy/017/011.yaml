id: DEU.17.11
reference: Deuteronomy 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: te
  text: వారు నీకు ఇచ్చే ఉపదేశం[a] ప్రకారం, వారు నీకు చెప్పే తీర్పు ప్రకారం నీవు చేయాలి. వారు నీకు తెలియజేసే మాట[b] నుండి కుడికిగానీ ఎడమకిగానీ తొలగకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘ధర్మశాస్త్రం’ లేదా ‘బోధన’; హీబ్రూ: తోరా.'
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విషయం’ లేదా ‘నిర్ణయం’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: ప్రకారం
  rationale: ఈ హీబ్రూ న్యాయసంబంధ నుడికారం ‘దానికి అనుగుణంగా’ అనే అర్థాన్ని ఇస్తుంది; తెలుగులో ‘ప్రకారం’ సహజంగా, స్పష్టంగా ఆ బద్ధతను వ్యక్తం చేస్తుంది.
- source_word: הַתּוֹרָה
  choice: ఉపదేశం
  rationale: తోరా ఇక్కడ యాజకులు లేదా న్యాయాధిపతులు నిర్దిష్ట వివాదంలో ఇచ్చే అధికారపూర్వక బోధన లేదా నిర్దేశాన్ని సూచిస్తుంది. ‘ఉపదేశం’ అనే పదం దానిని కేవలం లిఖిత చట్టానికి పరిమితం చేయదు.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: వారు నీకు ఇచ్చే
  rationale: ירה హిఫిల్ రూపం ‘బోధించు, నిర్దేశించు’ అనే భావాన్ని కలిగి ఉంది. ‘ఉపదేశం’తో కలిపి ‘ఇచ్చే’ అనడం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמִּשְׁפָּט
  choice: తీర్పు
  rationale: ఈ న్యాయ సందర్భంలో מִשְׁפָּט ఒక న్యాయ నిర్ణయాన్ని లేదా తీర్పును సూచిస్తుంది; ‘తీర్పు’ స్పష్టమైన, గౌరవప్రదమైన న్యాయపదం.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: వారు నీకు చెప్పే
  rationale: אָמַר యొక్క సాధారణ అర్థమైన ‘చెప్పు’ను నిలుపుతూ, తీర్పు నేరుగా తెలియజేయబడుతున్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: నీవు చేయాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం విధిని సూచిస్తుంది. ‘చేయాలి’ ఆధునిక తెలుగులో ఆజ్ఞాత్మక న్యాయబద్ధతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תָסוּר
  choice: తొలగకూడదు
  rationale: סוּר అంటే పక్కకు తొలగడం లేదా నిర్దేశిత మార్గం నుంచి మరలడం. తరువాత వచ్చే కుడి-ఎడమ రూపకంతో ‘తొలగకూడదు’ సహజంగా సరిపోతుంది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: דָּבָר కు ‘మాట, విషయం, నిర్ణయం’ అనే భావాలు ఉన్నాయి. ఇక్కడ అధికారపూర్వకంగా ప్రకటించిన దానిని సూచిస్తున్నప్పటికీ, ‘మాట’ మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: వారు నీకు తెలియజేసే
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయు, ప్రకటించు’ అని అర్థం. ‘తెలియజేసే’ అనేది అధికారపూర్వక సమాచార భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יָמִין וּשְׂמֹאל
  choice: కుడికిగానీ ఎడమకిగానీ
  rationale: ఇది ఏ దిశలోనూ వైదొలగకూడదనే స్థిర నుడికారం. తెలుగు జంట నిర్మాణం మూలంలోని రెండు దిశల రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యాజకులు లేదా న్యాయాధిపతుల అధికారానికి విధేయత యొక్క పరిధి
  choice: సందర్భంలోని నిర్దిష్ట వివాదంపై ఇచ్చిన అధికారపూర్వక ఉపదేశం, తీర్పును పాటించాలనే ఆజ్ఞగా అనువదించడం
  alternative: తరువాతి మత సంస్థలకు అపరిమితమైన లేదా తప్పులేని అధికారాన్ని ఈ వాక్యం ప్రసాదిస్తున్నట్లు అనువదించడం
  rationale: ఈ వాక్యం ఇశ్రాయేలు నిబంధనాత్మక న్యాయవ్యవస్థలోని తీర్పు ప్రక్రియను ఉద్దేశిస్తుంది. మూలపాఠంలోని విధేయత బలాన్ని నిలుపుతూ, అది స్పష్టంగా చెప్పని తరువాతి సంస్థాగత సిద్ధాంతాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘నీవు చేయాలి’, ‘తొలగకూడదు’ అనే రూపాలు ఆజ్ఞ యొక్క బలాన్ని స్పష్టంగా ఉంచుతాయి. తోరా మరియు దావార్ పదాల అర్థవిస్తృతిని ప్రధాన పాఠంలో అతిగా కుదించకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
