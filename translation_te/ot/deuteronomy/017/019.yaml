id: DEU.17.19
reference: Deuteronomy 17:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: te
  text: అది అతనితో ఉండాలి; అతడు తన జీవితకాలమంతా దానిలో చదవాలి[a]. తద్వారా అతడు తన దేవుడైన యాహ్వేకు[c] భయపడడం[b], ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ, ఈ కట్టడలన్నిటినీ పాటించి ఆచరించడం నేర్చుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని నుండి చదవాలి’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘దానిలో చదవాలి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భక్తితో గౌరవించడం.’ ఇక్కడ ‘భయపడడం’లో భక్తిపూర్వక విస్మయం, విధేయత అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: ‘యాహ్వే’ అనేది హీబ్రూ దైవనామమైన יהוה (YHWH)కు లిప్యంతరీకరణ.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: అది అతని దగ్గర ఉండాలి
  rationale: మునుపటి వచనంలో చెప్పిన ధర్మశాస్త్ర ప్రతిని సూచిస్తూ, అది రాజుకు ఎల్లప్పుడూ అందుబాటులో ఉండాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְקָרָא בוֹ
  choice: అతడు ... దానిలో చదవాలి
  rationale: בּוֹ అనే విభక్తి సూచించే ‘దానిలో’ అనే రూపాన్ని నిలుపుతూ, వ్రాతప్రతిలో చదవడమనే మూలభావాన్ని కాపాడుతుంది.
- source_word: כָּל יְמֵי חַיָּיו
  choice: తన జీవితకాలమంతా
  rationale: జీవితమంతటి నిరంతర కాలాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן יִלְמַד
  choice: అలా ... నేర్చుకుంటాడు
  rationale: చదవడం వల్ల కలగవలసిన ఉద్దేశ్యాన్ని, ఫలితాన్ని తెలుగులో సహజమైన వాక్యనిర్మాణంతో తెలియజేస్తుంది.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: తన దేవుడైన యాహ్వేకు భయపడడం
  rationale: ירא లోని భయం, భక్తిపూర్వక విస్మయం, విధేయత అనే విస్తృత భావాన్ని ‘భయపడడం’ ద్వారా తెరవిడిగా ఉంచుతుంది; దేవుని వ్యక్తిగత నామాన్ని అనువదించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: לִשְׁמֹר
  choice: పాటించి
  rationale: నిబంధనాత్మక ఆజ్ఞలను జాగ్రత్తగా గైకొనడం అనే శׁמר భావానికి ‘పాటించడం’ సహజమైన తెలుగు సమానం.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ
  rationale: תּוֹרָה యొక్క ఉపదేశాత్మక-న్యాయపరమైన భావాన్ని ‘ధర్మశాస్త్రం’తో, דִּבְרֵי అనే పదాన్ని ‘మాటలు’తో ప్రతిబింబిస్తుంది.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ఈ కట్టడలన్నిటినీ
  rationale: חֻקִּים అనే నిర్దేశిత న్యాయనిబంధనలను గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ‘కట్టడలు’గా అందిస్తుంది.
- source_word: לַעֲשֹׂתָם
  choice: వాటిని ఆచరించడం
  rationale: మూలంలోని ‘వాటిని చేయడం’ అనే స్పష్టమైన కార్యాచరణ భావాన్ని తెలుగులో సహజంగా ‘ఆచరించడం’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: నిబంధన సందర్భంలో ירא భావం
  choice: భయపడడం
  alternative: భక్తితో గౌరవించడం
  rationale: ఈ పదంలో భయం, భక్తిపూర్వక విస్మయం, విధేయ సమర్పణ అన్నీ కలిసివుండగలవు; ‘భయపడడం’ ఆ వేదాంతపరమైన ఉద్వేగాన్ని తగ్గించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని ఉపయోగించాం. మూలంలోని జీవితాంత పఠనం, భయం/భక్తి మధ్య ఉన్న భావవిస్తృతి, ధర్మశాస్త్రాన్ని పాటించి ఆచరించాలనే క్రమాన్ని నిలుపుకున్నాం.
