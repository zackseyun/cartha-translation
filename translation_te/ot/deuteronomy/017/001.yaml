source:
  edition: WLC
  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: te
  text: నీ దేవుడైన యెహోవాకు, దానిలో లోపమో ఏదైనా చెడ్డ విషయమో ఉన్న ఎద్దునుగానీ గొర్రెనుగానీ[a] బలి అర్పించకూడదు; అది నీ దేవుడైన యెహోవాకు అసహ్యకరమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שֶׂה (సెహ్) అనే పదం గొర్రెకు మాత్రమే పరిమితం కాదు; అది గొర్రె లేదా మేకల మందలోని ఒక జంతువును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: బలి అర్పించేటప్పుడు
  rationale: זבח ఇక్కడ బలిపశువును కేవలం చంపడాన్ని కాక, దేవునికి బలిగా అర్పించడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో నిషేధాన్ని సహజంగా వ్యక్తం చేయడానికి సందర్భాత్మక నిర్మాణం వాడబడింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוה ను సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో స్థిరంగా వినియోగంలో ఉన్న ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: שׁוֹר కు సందర్భానుకూలమైన సాధారణ ఏకవచన పశు పదం; ‘ఆబోతు’ అని లింగాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: שֶׂה
  choice: గొర్రెను లేదా మేకను సూచించే మందజంతువు
  rationale: שֶׂה గొర్రెకు మాత్రమే పరిమితం కాకుండా గొర్రె లేదా మేకల మందలోని జంతువును సూచించగలదు. మూలంలోని విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో కాపాడి, సంక్షిప్త వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: מוּם
  choice: లోపం
  rationale: బలికి అనర్హం చేసే శారీరక కళంకం లేదా దోషాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כֹּל דָּבָר רָע
  choice: మరే చెడ్డ విషయం
  rationale: అక్షరార్థమైన ‘ఏ చెడ్డ విషయమైనా’ అనే విస్తృత భావాన్ని కాపాడుతూ, మునుపటి ‘లోపం’తో సమానార్థకంగా పూర్తిగా కుదించలేదు.
- source_word: תוֹעֲבַת
  choice: అసహ్యమైనది
  rationale: దేవుని దృష్టిలో తీవ్రంగా అంగీకారయోగ్యం కానిదనే תועבה పదపు బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని ఇది సిద్ధాంతపరంగా పరిష్కరించదు.
- issue: כֹּל דָּבָר רָע యొక్క పరిధి
  choice: మరే చెడ్డ విషయం
  alternative: ఏ తీవ్రమైన లోపమైనా
  rationale: ఈ పదబంధం ‘లోపం’ను వివరిస్తున్నప్పటికీ, మూలంలోని విస్తృతమైన ‘చెడ్డ విషయం’ అనే భాషను కేవలం శారీరక లోపంగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని నిషేధాన్ని తెలుగులో సహజమైన ‘అర్పించేటప్పుడు… ఉండకూడదు’ నిర్మాణంతో తెలిపింది; ‘లోపం’ మరియు విస్తృతమైన ‘చెడ్డ విషయం’ రెండింటి మధ్యనున్న భావ ఉద్రిక్తతను నిలిపింది.
