revisions:
- from: అయితే అతడు తన కోసం గుర్రాలను విస్తారంగా సమకూర్చుకోకూడదు[a]. గుర్రాలను ఎక్కువగా సంపాదించడానికి ప్రజలను ఐగుప్తుకు తిరిగి వెళ్లేలా చేయకూడదు[b]. ఎందుకంటే యహ్వే మీతో, “మీరు ఇక ఎన్నడూ ఈ మార్గంలో తిరిగి వెళ్లకూడదు” అని చెప్పాడు[c].
  to: 'అయితే అతడు తన కోసం గుర్రాలను ఎక్కువగా సమకూర్చుకోకూడదు[a]; గుర్రాలను ఎక్కువగా సమకూర్చుకోవడం కోసం ప్రజలను ఐగుప్తుకు తిరిగి వెళ్లేలా చేయకూడదు[b]. ఎందుకంటే యహ్వే మీతో ఇలా చెప్పాడు: “మీరు ఇకపై ఈ మార్గంలో ఎన్నడూ తిరిగి వెళ్లకూడదు.”[c]'
  rationale: ‘ఎక్కువగా సమకూర్చుకోవడం’ ద్వారా రెండు చోట్ల ఉన్న హీబ్రూ רבה పదకుటుంబపు సంబంధం స్పష్టమవుతుంది. కారణార్థకమైన ‘వెళ్లేలా చేయకూడదు,’ యహ్వే అనే దైవనామం, మరియు ‘ఇకపై ... ఎన్నడూ’లోని సంపూర్ణ పునరాగమన-నిషేధం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత స్థానాల్లో ఉన్నాయి.
