id: DEU.17.16
reference: Deuteronomy 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: te
  text: 'అయితే అతడు తన కోసం గుర్రాలను ఎక్కువగా సమకూర్చుకోకూడదు[a]; గుర్రాలను ఎక్కువగా సమకూర్చుకోవడం కోసం ప్రజలను ఐగుప్తుకు తిరిగి వెళ్లేలా చేయకూడదు[b]. ఎందుకంటే యహ్వే మీతో ఇలా చెప్పాడు: “మీరు ఇకపై ఈ మార్గంలో ఎన్నడూ తిరిగి వెళ్లకూడదు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని క్రియకు ‘ఎక్కువ చేయడం’ లేదా ‘పెంచడం’ అని అర్థం; అందువల్ల “తన కోసం అనేక గుర్రాలను సమకూర్చుకోకూడదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '“ప్రజలను తిరిగి ఐగుప్తుకు తీసుకువెళ్లకూడదు” అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ కారణార్థకంగా ఉంది: ప్రజలు తిరిగి వెళ్లేలా రాజు చేయడం నిషేధించబడింది.'
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “మీరు ఈ మార్గంలో తిరిగి వెళ్లడాన్ని ఇకపై కొనసాగించకూడదు”; ఇది “ఇక ఎన్నడూ తిరిగి వెళ్లకూడదు” అనే భావాన్నిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: రాజు ప్రవర్తనపై విధించే పరిమితిని తెలుగులో సహజంగా పరిచయం చేస్తుంది; సందర్భంలో వ్యతిరేకతతో కూడిన నియంత్రణ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: తన కోసం గుర్రాలను విస్తారంగా సమకూర్చుకోకూడదు
  rationale: רבה అనే క్రియలోని ‘ఎక్కువ చేయడం/పెంచుకోవడం’ భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తూ, לּוֹ లోని స్వప్రయోజన భావాన్ని ‘తన కోసం’గా నిలుపుతుంది.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: ప్రజలను ఐగుప్తుకు తిరిగి వెళ్లేలా చేయకూడదు
  rationale: 'שוב యొక్క హిఫీల్ రూపంలోని కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది: రాజు తానే వెళ్లడం కాక, ప్రజలు తిరిగి వెళ్లేలా చేయడం నిషేధించబడింది.'
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: గుర్రాలను ఎక్కువగా సంపాదించడానికి
  rationale: లక్ష్యార్థక నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది; గుర్రాల సంఖ్యను పెంచే ఉద్దేశాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וַיהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: ఇక ఎన్నడూ ... తిరిగి వెళ్లకూడదు
  rationale: ‘మళ్లీ తిరిగి వెళ్లడాన్ని కొనసాగించవద్దు/జోడించవద్దు’ అనే హీబ్రూ నుడికారంలోని పునరావృత్తి నిషేధాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: ఈ మార్గంలో
  rationale: דֶּרֶךְ యొక్క ‘మార్గం/దారి’ భావాన్ని, సందర్భంలోని ప్రయాణ మార్గ సూచనను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: ఐగుప్తుకు తిరుగు నిషేధంలో కర్తృత్వం
  choice: రాజు ప్రజలను తిరిగి వెళ్లేలా చేయకూడదు
  alternative: రాజు ప్రజలను తిరిగి తీసుకువెళ్లకూడదు
  rationale: హిఫీల్ కారణార్థక రూపాన్ని నిలుపుతూ, రాజు ఉపయోగించే ఖచ్చితమైన విధానం—పంపడమా, తీసుకువెళ్లడమా—అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘విస్తారంగా సమకూర్చుకోడం’ రాజసంబంధమైన అధిక సేకరణను సూచిస్తుంది; కారణార్థకతను ‘వెళ్లేలా చేయడం’గా స్పష్టంగా ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
