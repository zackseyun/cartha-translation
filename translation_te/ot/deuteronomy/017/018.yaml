source:
  edition: WLC
  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: te
  text: అతడు తన రాజ్యపు సింహాసనంపై కూర్చున్నప్పుడు, లేవీయులైన యాజకుల ఎదుటనుండి[a] ఈ ధర్మశాస్త్రపు ఒక ప్రతిని తన కోసం ఒక గ్రంథంలో వ్రాసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘లేవీయులైన యాజకుల ఎదుటనుండి.’ ఇది వారి వద్ద భద్రపరచబడిన ప్రతిని ఆధారంగా చేసుకోవడాన్ని సూచించవచ్చు; ‘వారి సమక్షంలో’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: అతడు ... కూర్చున్నప్పుడు
  rationale: וְהָיָהతో కూడిన కాలసూచక నిర్మాణాన్ని తెలుగులో సహజమైన సందర్భవాచక ఉపవాక్యంగా ఇచ్చింది; న్యాయవిధి ప్రారంభాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: తన రాజ్య సింహాసనంపై
  rationale: כִּסֵּא అనే స్పష్టమైన రాజరిక రూపకాన్ని, అలాగే ‘తన రాజ్యానికి చెందిన’ అనే సంబంధాన్ని సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: וְכָתַב לוֹ
  choice: తన కోసం ... రాసుకోవాలి
  rationale: לוֹలోని స్వప్రయోజన భావాన్ని ‘తన కోసం’ ద్వారా, న్యాయవిధిలోని ఆజ్ఞార్థక బలాన్ని ‘రాసుకోవాలి’ ద్వారా సహజంగా వ్యక్తం చేసింది.
- source_word: מִשְׁנֵה
  choice: ఒక ప్రతి
  rationale: ఈ సందర్భంలో పదం పునరుక్తిని కాక, ఉన్న ధర్మశాస్త్రానికి నకలు లేదా ప్రతిని సూచిస్తుంది.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రం
  rationale: రాజుకు సంబంధించిన ఈ న్యాయసందర్భంలో תּוֹרָה సూచించే బోధన-నియమ సముదాయాన్ని తెలుగు బైబిలు వాడుకలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל סֵפֶר
  choice: ఒక గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/పత్రంపై’; ప్రాచీన మాధ్యమం గ్రంథచుట్ట అయి ఉండవచ్చుగాని, ‘గ్రంథంలో’ సాధారణ పాఠకునికి సహజంగా ఉండి వ్రాతప్రతి భావాన్ని అందిస్తుంది.
- source_word: מִלִּפְנֵי
  choice: ఎదుట ఉన్న దాని నుండి
  rationale: ‘ఎదుటనుండి’ అనే మూలపదబంధానికి దగ్గరగా ఉంటూనే, యాజకుల వద్ద ఉన్న నమూనా ప్రతినుండి నకలు చేయడం అనే సంభావ్య భావాన్ని తెలుగులో అర్థమయ్యేలా చేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయులైన యాజకులు
  rationale: హీబ్రూలోని ‘యాజకులు, లేవీయులు’ అనే అన్వయాన్ని సహజమైన తెలుగులో విశేషణ సంబంధంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాజుకు వ్రాయమని ఆజ్ఞాపించిన תּוֹרָה పరిధి
  choice: ఈ ధర్మశాస్త్రం
  alternative: ఈ ఉపదేశం; ఈ తోరా
  rationale: తక్షణ సందర్భం నిబంధనాత్మకమైనది కాబట్టి ‘ధర్మశాస్త్రం’ సరిపోతుంది; అయితే వాక్యం చెప్పినదానికంటే విస్తృతమైన గ్రంథసంపుటి సంబంధిత వాదనను అనువాదంలో చేర్చలేదు.
- issue: యాజకుల ఎదుటనుండి అనే పదబంధం
  choice: ఎదుట ఉన్న దాని నుండి
  alternative: యాజకుల సమక్షంలో; యాజకుల వద్ద భద్రపరచిన ప్రామాణిక ప్రతినుండి
  rationale: మూలంలోని מִלִּפְנֵי పదబంధం మూలప్రతి వారి ఎదుట లేదా వారి సంరక్షణలో ఉందనే భావాన్ని ఇవ్వవచ్చు; అది కేవలం వారి సమక్షంలో వ్రాయడాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠం మూలప్రతి భావాన్ని మితంగా వ్యక్తం చేస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయవిధి శైలిని ఉపయోగించింది. ‘రాసుకోవాలి’ సాధారణ పాఠకునికి సహజంగా ఉండగా ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది. ‘గ్రంథం,’ ‘ధర్మశాస్త్రం,’ ‘సింహాసనం’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఇస్తాయి.
