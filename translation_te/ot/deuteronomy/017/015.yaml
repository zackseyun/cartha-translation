  variant: modern standard Telugu
source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే ఎన్నుకునే వ్యక్తిని నీవు నీ మీద రాజుగా తప్పక నియమించుకోవాలి. నీ సహోదరుల మధ్యనుండి[a] ఒక రాజును నీ మీద రాజుగా నియమించుకోవాలి. నీ సహోదరుడు కాని పరదేశస్థుణ్ణి[b] నీ మీద నియమించుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అనే బంధుత్వ పదం తోటి ఇశ్రాయేలీయులను, అంటే సొంత ప్రజల్లోని వారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పరదేశస్థుడైన మనిషి’; తరువాతి మాటలు అతణ్ణి ‘నీ సహోదరుడు కానివాడు’ అని వివరిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: తప్పక నియమించుకోవాలి
  rationale: క్రియావిశేషణార్థక మూలరూపం, అసంపూర్ణ క్రియ కలయిక ఆజ్ఞను బలపరుస్తుంది. ‘తప్పక’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלֶיךָ
  choice: నీ మీద
  rationale: ఇశ్రాయేలు ప్రజలను ఏకవచన సంబోధనగా ఉద్దేశించిన మూలంలోని పునరుక్తిని, పాలకుడు ప్రజలపై ఉండే భావాన్ని నిలుపుతుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: పదానికి సందర్భానుకూలమైన నేరమైన తెలుగు సమానార్థకం.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: నీ దేవుడైన యాహ్వే ఎన్నుకునే వ్యక్తినే
  rationale: ఎంపిక యాహ్వేదేనని స్పష్టం చేస్తుంది. ‘ఎన్నుకునే’ న్యాయనియమంలోని సాధారణ/భవిష్యత్ భావాన్ని అనవసరంగా ఒకదానికే పరిమితం చేయదు; ‘వ్యక్తినే’ ఎంపిక చేయబడిన వానిపై ఉన్న నిర్దిష్ట బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: నీ సహోదరుల మధ్యనుండి
  rationale: ‘నీ సహోదరుల నడుమనుండి’ అనే మూలంలోని బంధుత్వ భాషను నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: לֹא תוּכַל לָתֵת
  choice: నియమించుకోకూడదు
  rationale: అక్షరార్థంగా ‘నీవు ఉంచలేవు’ అయినా, ఈ న్యాయసందర్భంలో అది అసమర్థత కంటే నిషేధాన్ని సూచిస్తుంది. ‘కూడదు’ ఆ న్యాయబలాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אִישׁ נָכְרִי
  choice: పరదేశస్థుణ్ణి
  rationale: ఇశ్రాయేలు సమాజానికి చెందని పురుషుణ్ణి సూచిస్తుంది; రాజపదవి సందర్భంలో పుంలింగ రూపం సహజంగా ఉంది. అక్షరార్థ వివరాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: నీ సహోదరుడు కాని
  rationale: ‘పరదేశస్థుడు’ అనే పదాన్ని ఒడంబడిక సంబంధమైన బంధుత్వ భాషతో మూలం వివరించిన విధానాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ‘యెహోవా’ అనే భిన్న సంప్రదాయ ఉచ్చారణను స్వీకరించకుండా మూలానికి దగ్గరగా లిప్యంతరీకరిస్తుంది.
- issue: אַחֶיךָ / אָחִיךָ లోని పుంలింగ బంధుత్వ భాష
  choice: సహోదరులు / సహోదరుడు
  alternative: తోటి ఇశ్రాయేలీయులు / స్వజనులు
  rationale: మూలంలోని బంధుత్వ రూపకాన్ని, పరదేశస్థునితో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలిపాం. ఇక్కడ బహువచన పదం ఇశ్రాయేలు సమాజ సభ్యులను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- issue: לֹא תוּכַל యొక్క సామర్థ్యార్థం లేదా నిషేధార్థం
  choice: నియమించుకోకూడదు
  alternative: నియమించుకోలేవు
  rationale: న్యాయనియమ సందర్భంలో ఈ నిర్మాణం అనుమతి నిరాకరణను వ్యక్తం చేస్తుంది. అందువల్ల తెలుగులో నిషేధార్థం సహజమైనది; మూలంలోని పదబంధాన్ని సామర్థ్య ప్రకటనగా తప్పుగా గ్రహించకుండా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయనియమ శైలిని వాడాం. ఏకవచన ‘నీవు/నీ’ ద్వారా సమష్టిగా సంబోధించబడుతున్న ఇశ్రాయేలును ప్రతిబింబించాం. మూలంలోని ‘నీ మీద’ మరియు ‘సహోదరుడు’ అనే పునరుక్తులను ఉద్దేశపూర్వకంగా నిలిపాం.
