source:
  edition: WLC
  text: וּ/בָאתָ֗ אֶל הַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם וְ/אֶל הַ/שֹּׁפֵ֔ט אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/דָרַשְׁתָּ֙ וְ/הִגִּ֣ידוּ לְ/ךָ֔ אֵ֖ת דְּבַ֥ר הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: te
  text: నీవు లేవీయులైన యాజకుల వద్దకు, ఆ రోజుల్లో పదవిలో ఉన్న న్యాయాధిపతి వద్దకు వెళ్లి వారిని సంప్రదించాలి; వారు నీకు న్యాయతీర్పు విషయాన్ని[a] తెలియజేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “తీర్పు యొక్క మాట” లేదా “న్యాయతీర్పు విషయం.” ఈ హెబ్రీ ప్రయోగం అధికారిక న్యాయనిర్ణయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: వెళ్లి
  rationale: న్యాయనిర్ణయం కోసం నియమిత అధికారుల వద్దకు చేరడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సంయుక్త క్రియారూపంలో ఆదేశ భావం కొనసాగుతుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయులైన యాజకులు
  rationale: యాజకులు లేవీ గోత్రానికి చెందినవారని తెలిపే హెబ్రీ apposition‌ను స్పష్టంగా ఉంచుతుంది; లేవీయులందరూ యాజకులనే భావాన్ని కలిగించదు.
- source_word: הַשֹּׁפֵט
  choice: న్యాయాధిపతి
  rationale: ఈ న్యాయపరమైన సందర్భంలో అధికారికంగా తీర్పు చెప్పే వ్యక్తిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో విధిలో ఉన్న
  rationale: పేరు చెప్పబడిన నిర్దిష్ట వ్యక్తికన్నా, ఆ కాలంలో ఆ బాధ్యత నిర్వహిస్తున్న అధికారిని సూచిస్తుంది.
- source_word: וְדָרַשְׁתָּ
  choice: విచారణ చేయాలి
  rationale: ఈ సందర్భంలో అధికారిక నిర్ణయం లేదా మార్గదర్శనం కోరడాన్ని సూచిస్తుంది; కేవలం సాధారణంగా అడగడం కంటే న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: וְהִגִּידוּ לְךָ
  choice: నీకు తెలియజేస్తారు
  rationale: అధికారిక నిర్ణయాన్ని సంబంధిత వ్యక్తికి ప్రకటించడం అనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: ఆ కేసుకు సంబంధించిన తీర్పు
  rationale: అక్షరార్థంగా ‘న్యాయతీర్పు యొక్క మాట/విషయం’; సందర్భంలో అధికారిక న్యాయనిర్ణయాన్ని సూచిస్తుంది. ‘తీర్పు’ మూలంలోని משפט పదానికి దగ్గరగా ఉండగా, ‘ఆ కేసుకు సంబంధించిన’ అనేది సంబంధిత వివాద సందర్భాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయశాస్త్ర సందర్భానికి తగిన గంభీరతను ఉంచాం. ఏకవచన సంబోధనకు ‘నీవు’ వాడాం; యాజకులు మరియు న్యాయాధిపతి కలిసిన బహువచన కర్తను ‘వారు’తో సూచించాం.
