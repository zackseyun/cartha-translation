- from: అతని హృదయం తన సహోదరులకంటే పైకి లేవకుండా[a], అతడు ఆ ఆజ్ఞనుంచి కుడికిగాని ఎడమకిగాని తొలగిపోకుండా ఉండాలి. అప్పుడు అతడూ అతని కుమారులూ ఇశ్రాయేలు మధ్య తమ రాజ్యంలో దీర్ఘకాలం పరిపాలిస్తారు.
