id: DEU.17.20
reference: Deuteronomy 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: te
  text: అతని హృదయం తన సహోదరులకంటే పైకి లేవకుండా, అతడు ఆ ఆజ్ఞనుండి కుడికిగాని ఎడమకిగాని తొలగిపోకుండా ఉండాలి; తద్వారా అతడూ అతని కుమారులూ ఇశ్రాయేలు మధ్య అతని రాజ్యాధికారంలో దీర్ఘకాలం ఉండగలరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: అతని హృదయం ... పైకి లేవకుండా
  rationale: హృదయం పైకి లేవడం అనే హెబ్రీ గర్వసూచక రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵאֶחָיו
  choice: తన సహోదరులకంటే
  rationale: మూలంలోని ‘అతని సహోదరులు’ అనే నిబంధన-బంధుత్వ భాషను, వారికంటే తాను ఉన్నతుడననే భావాన్ని కాపాడుతుంది.
- source_word: סוּר מִן הַמִּצְוָה
  choice: ఆ ఆజ్ఞనుంచి ... తొలగిపోకుండా
  rationale: ఆజ్ఞాపాలన మార్గం నుంచి పక్కకు వెళ్లడాన్ని సూచించే నిబంధనాత్మక ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָמִין וּשְׂמֹאול
  choice: కుడికిగాని ఎడమకిగాని
  rationale: ఏ దిశలోనూ తప్పిపోకూడదనే హెబ్రీ రూపకాన్ని యథాతథంగా, చదవడానికి సులభంగా ఉంచుతుంది.
- source_word: יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: తమ రాజ్యంలో దీర్ఘకాలం పరిపాలిస్తారు
  rationale: ‘తన రాజ్యాధికారంపై దినాలు పొడిగించుకోవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది వ్యక్తిగత ఆయుష్షుకంటే రాజవంశ పరిపాలన కొనసాగింపును సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: הוּא וּבָנָיו
  choice: అతడూ అతని కుమారులూ
  rationale: రాజవంశ వారసత్వ సందర్భంలో మూలంలోని స్పష్టమైన ‘కుమారులు’ అనే పదాన్ని నిలుపుతుంది.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మధ్య
  rationale: ఇశ్రాయేలు నిబంధన సమాజం మధ్యనే రాజపాలన కొనసాగుతుందనే మూలంలోని స్థల-సమాజ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: రాజుకు సంబంధించిన సహోదరత్వ భాష
  choice: సహోదరులు
  alternative: తోటి ఇశ్రాయేలీయులు
  rationale: మూలం పుంలింగ బహువచన ‘సహోదరులు’ అని చెప్పి నిబంధన సమాజంలోని బంధుత్వాన్ని సూచిస్తుంది; విస్తృత సందర్భార్థాన్ని పాదసూచికలో తెలుపుతూ మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- issue: రాజవంశ వాగ్దానంలోని పదప్రయోగం
  choice: అతడూ అతని కుమారులూ
  alternative: అతడూ అతని సంతతివారూ
  rationale: హెబ్రీ పాఠ్యం ప్రత్యేకంగా ‘కుమారులు’ అని చెబుతుంది. ‘సంతతివారు’ అని విస్తరించడం సాధ్యమైన భావవ్యాఖ్య అయినా మూలపదం కంటే విస్తృతం.
- issue: לְמַעַן సూచించే ఉద్దేశం లేదా ఫలితం
  choice: అప్పుడు
  alternative: తద్వారా / తద్వలన
  rationale: ఈ సంధాయకం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. సందర్భంలో విధేయత ఫలితంగా దీర్ఘ రాజపాలనను సహజంగా తెలియజేస్తూనే, కఠినమైన కారణ-యాంత్రిక అర్థాన్ని రుద్దకుండా ‘అప్పుడు’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హెబ్రీ ‘హృదయం పైకి లేవడం’ అనే రూపకాన్ని నిలిపి, రాజపాలన దీర్ఘకాలం కొనసాగడాన్ని సహజ తెలుగులో తెలిపాం.
