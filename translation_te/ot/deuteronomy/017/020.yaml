    text: లేదా, “తోటి ఇశ్రాయేలీయులకంటే.” హెబ్రీలో అక్షరార్థంగా “తన సహోదరులకంటే” అని ఉంది; ఇది నిబంధన సమాజపు బంధుత్వ భాష.
