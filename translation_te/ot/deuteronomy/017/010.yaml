id: DEU.17.10
reference: Deuteronomy 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: te
  text: యాహ్వే ఎంచుకునే ఆ స్థలం నుండి వారు నీకు ప్రకటించే మాట ప్రకారం నీవు నడుచుకోవాలి[a]. వారు నీకు ఉపదేశించే సమస్తం ప్రకారం చేయడానికి నీవు జాగ్రత్తపడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నీకు ప్రకటించే తీర్పు ప్రకారం.” హెబ్రీ పదం דָּבָר అంటే “మాట,” “విషయం,” లేదా న్యాయసందర్భంలో “తీర్పు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు చేయాలి
  rationale: עשה అనే క్రియకు ‘చేయు, ఆచరించు’ అనే విస్తృత అర్థం ఉంది. ఇక్కడ అధికారిక తీర్పుకు అనుగుణంగా నడుచుకోవాలనే న్యాయపరమైన ఆజ్ఞను ‘చేయాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: עַל פִּי הַדָּבָר
  choice: మాట ప్రకారం
  rationale: עַל־פִּי అంటే ‘ప్రకారం/అధికారాన్ని అనుసరించి’; דָּבָר అంటే ‘మాట, విషయం, తీర్పు’ కావచ్చు. ‘మాట ప్రకారం’ హెబ్రీయుల రూపకాన్ని నిలుపుతూ, న్యాయసందర్భంలోని అధికారిక ప్రకటనను సూచిస్తుంది.
- source_word: יַגִּידוּ לְךָ
  choice: వారు నీకు ప్రకటించే
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయు, ప్రకటించు’ అని అర్థం. సందర్భంలోని యాజకులు లేదా న్యాయాధిపతుల అధికారిక సమాచారాన్ని ‘ప్రకటించే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: యెహోవా ఎంపిక చేసుకునే ఆ స్థలం నుండి
  rationale: ఇది యెహోవా నిర్ణయించే కేంద్రీయ ఆరాధనా స్థలాన్ని సూచిస్తుంది. יבחר యొక్క ముందుచూపు భావాన్ని తెలుగులో సహజమైన ‘ఎంపిక చేసుకునే’ రూపంతో వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ వ్యక్తిగత దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: చేయడానికి జాగ్రత్తపడాలి
  rationale: שׁמר + క్రియార్థక రూపం శ్రద్ధతో పాటించడాన్ని సూచిస్తుంది. ‘చేయడానికి జాగ్రత్తపడాలి’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר
  choice: ప్రతిదాని ప్రకారం
  rationale: ఈ పదబంధం ఇచ్చిన ఉపదేశమంతటికీ సంపూర్ణంగా అనుగుణంగా చేయాలని నొక్కి చెబుతుంది.
- source_word: יוֹרוּךָ
  choice: వారు నీకు ఉపదేశించే
  rationale: ירה హిఫీల్ రూపానికి ‘బోధించు, ఉపదేశించు, నిర్దేశించు’ అనే అర్థాలున్నాయి. న్యాయపరమైన అధికార మార్గదర్శకత్వాన్ని అతిగా సంకుచితం చేయకుండా ‘ఉపదేశించే’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: דָּבָר యొక్క న్యాయపరమైన భావం
  choice: మాట
  alternative: తీర్పు
  rationale: న్యాయసందర్భంలో ఇది అధికారిక ‘తీర్పు’ను సూచించవచ్చు. అయితే మూలపదంలోని ‘మాట/విషయం/తీర్పు’ అనే అర్థవిస్తృతిని ప్రధాన పాఠంలో ‘మాట’తో నిలిపి, సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ఏకవచన ద్వితీయ పురుష ఆజ్ఞార్థక బలాన్ని ‘నీవు… చేయాలి’తో వ్యక్తం చేశాం; మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
