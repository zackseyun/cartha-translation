base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: te
  text: వెళ్లి ఇతర దేవుళ్లను సేవించి వారికి నమస్కరించినా, లేదా సూర్యునికైనా, చంద్రునికైనా, ఆకాశ సైన్యమంతటికైనా[a] నమస్కరించినా—నేను ఆజ్ఞాపించని విధంగా చేసినా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆకాశ సైన్యం” అనే మాట సాధారణంగా ఆకాశంలోని ఖగోళ వస్తువుల సముదాయాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో పరలోక జీవుల భావాన్ని కూడా రేకెత్తించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నేను ఆజ్ఞాపించని” అనే మాట ప్రత్యేకంగా “ఆకాశ సైన్యమంతటిని” సూచించవచ్చు; లేదా ఇతర దేవుళ్లను సేవించి వారికి, లేక ఆకాశ సంబంధమైన వాటికి నమస్కరించే మొత్తం చర్యను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: న్యాయపరమైన షరతు వాక్యంలో ముందరి వచనంలోని క్రియను కొనసాగించే సహజమైన తెలుగు రూపం; స్వతంత్ర భూతకాలంగా అనవసరంగా నిర్దేశించదు.
- source_word: וַיַּעֲבֹד
  choice: సేవించి
  rationale: దైవ సంబంధ సందర్భంలో ఆరాధనార్థక సేవను సూచిస్తుంది; తరువాతి సాష్టాంగ చర్యను తెలిపే క్రియతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: హీబ్రూ పదబంధపు సూటి భావం; ‘అన్య దేవతలు’ కంటే ఆధునిక పాఠకులకు సహజంగా ఉండి, మూలంలో లేని జాతిపరమైన భావాన్ని చేర్చదు.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: వాటికి మొక్కి
  rationale: నమస్కరించడం లేదా సాగిలపడడం అనే ఆరాధనా చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఆరాధించి’ అని రెండోసారి సాధారణీకరించదు.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: అంటే సూర్యునికైనా, చంద్రునికైనా, ఆకాశ సైన్యమంతటికైనా
  rationale: జాబితాలోని ప్రత్యామ్నాయ భావాన్ని ‘కైనా’ రూపాలతో సహజంగా వ్యక్తం చేస్తుంది. సందర్భంలో ఇవి ‘ఇతర దేవుళ్లు’ మరియు వాటికి మొక్కడం అనే మాటలను వివరించే జాబితాగా అర్థమవుతాయి.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: ఆకాశ సైన్యమంతటికైనా
  rationale: צבא యొక్క సమూహార్థాన్ని, అలాగే ఖగోళ వస్తువులు లేదా పరలోక జీవులు అనే సాధ్యమైన విస్తృతిని పూర్తిగా కుదించకుండా ఉంచుతుంది.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: నేను ఆజ్ఞాపించని పని చేస్తే
  rationale: మూలంలోని ‘నేను ఆజ్ఞాపించలేదు’ అనే భావాన్ని నిలుపుతూ, తెలుగులో వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది; ‘నేను నిషేధించిన’ అని మూలంలో లేని ప్రత్యేక నిషేధ క్రియను చేర్చదు.
theological_decisions:
- issue: אֲשֶׁר לֹא צִוִּיתִי అనే చివరి సంబంధ వాక్యభాగం యొక్క పరిధి
  choice: ‘నేను ఆజ్ఞాపించని పని చేస్తే’ అని మొత్తం విగ్రహారాధనా చర్యను సూచించగల సాధారణ రూపంలో ఇచ్చాం.
  alternative: ఇది వెంటనే ముందు ఉన్న ‘ఆకాశ సైన్యమంతటిని’ మాత్రమే విశేషించవచ్చు.
  rationale: హీబ్రూలో సంబంధ వాక్యం వ్యాకరణపరంగా చివరి నామవాచక పదబంధానికి దగ్గరగా ఉన్నా, సందర్భంలో వర్ణించిన మొత్తం అన్యారాధనను దేవుడు ఆజ్ఞాపించలేదనే భావమూ సాధ్యమే. పాదసూచిక ఈ ద్వంద్వ అవకాశాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. ఇది 17:2లో మొదలైన షరతు వాక్యాన్ని కొనసాగిస్తున్నందున చివర ‘చేస్తే’ రూపం, అలాగే తదుపరి వచనానికి కొనసాగింపును సూచించే అల్పవిరామం ఉంచాం. ‘మొక్కి’ సాధారణ పాఠకులకు అర్థమయ్యే ఆరాధనా నమస్కార చర్య; ‘ఆకాశ సైన్యం’ మూలంలోని రూపక సమూహార్థాన్ని కాపాడుతుంది.
