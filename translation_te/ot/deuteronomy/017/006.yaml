source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: te
  text: ఇద్దరు సాక్షుల లేదా ముగ్గురు సాక్షుల వాంగ్మూలం ఆధారంగా[a] మరణించవలసిన వ్యక్తికి మరణశిక్ష అమలు చేయాలి[b]. ఒక్క సాక్షి వాంగ్మూలం ఆధారంగా అతనికి మరణశిక్ష అమలు చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇద్దరు సాక్షుల నోటి మీద లేదా ముగ్గురు సాక్షుల నోటి మీద.’ ఈ హెబ్రీ నుడికారం న్యాయపరమైన వాంగ్మూలాన్ని లేదా సాక్ష్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరణించవలసిన వ్యక్తి.’ హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది; సందర్భంలో ఇది మరణశిక్షకు గురికావలసిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: వాంగ్మూలం ఆధారంగా
  rationale: అక్షరార్థంగా ‘నోటి మీద’ అనే ఈ హెబ్రీ న్యాయపరమైన నుడికారం సాక్షులు ఇచ్చే వాంగ్మూలం లేదా సాక్ష్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వాంగ్మూలం ఆధారంగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: ఇద్దరు సాక్షుల లేదా ముగ్గురు సాక్షుల
  rationale: మూలంలో రెండు సంఖ్యల తరువాతా ‘సాక్షులు’ పదం పునరుక్తమవుతుంది. ఆ న్యాయశైలి పునరుక్తిని తెలుగులోనూ నిలిపింది.
- source_word: יוּמַת
  choice: చంపాలి
  rationale: מות ధాతువు హోఫల్ రూపం కర్తచేత చేయబడే మరణాన్ని, అంటే మరణశిక్ష అమలును సూచిస్తుంది; కేవలం ‘చనిపోవాలి’ అని కాదు. సందర్భంలో న్యాయపరమైన భావం స్పష్టంగా ఉన్నందున ‘చంపాలి’ సహజమైన విధివాక్యంగా పనిచేస్తుంది.
- source_word: הַמֵּת
  choice: మరణశిక్షకు పాత్రుడైన వ్యక్తి
  rationale: వ్యక్తి అప్పటికే చనిపోయినవాడని కాక, మరణానికి గురిచేయదగిన లేదా మరణశిక్షకు బాధ్యుడైన వ్యక్తిని ఈ సంక్షిప్త హెబ్రీ వ్యక్తీకరణ సూచిస్తుంది. ‘శిక్ష విధించబడినవాడు’ అనడం కంటే ఈ ఎంపిక తీర్పు ఇప్పటికే వెలువడిందనే భావాన్ని తక్కువగా దిగుమతి చేస్తుంది.
- source_word: לֹא יוּמַת
  choice: చంపకూడదు
  rationale: అదే క్రియ యొక్క నిషేధ రూపాన్ని తెలుగులో స్పష్టమైన న్యాయ నిషేధంగా అందిస్తుంది.
- source_word: עֵד אֶחָד
  choice: ఒక్క సాక్షి
  rationale: ‘ఒక్క’ అనే రూపం ఒకే సాక్షి సరిపోడనే వ్యత్యాసాన్ని సహజమైన తెలుగులో నొక్కిచెబుతుంది.
theological_decisions:
- issue: మరణశిక్ష సందర్భంలో הַמֵּת పదబంధం సూచించే వ్యక్తి, దాని భావబలం
  choice: మరణశిక్షకు పాత్రుడైన వ్యక్తి
  alternative: చనిపోవలసినవాడు; శిక్ష విధించబడిన వ్యక్తి; చనిపోయినవాడు
  rationale: ఈ వాక్యం మరణశిక్ష విధించడానికి అవసరమైన సాక్ష్య ప్రమాణాన్ని నియంత్రిస్తోంది. ‘చనిపోయినవాడు’ సందర్భానికి సరిపోదు; ‘శిక్ష విధించబడిన వ్యక్తి’ న్యాయనిర్ణయం ఇప్పటికే జరిగిపోయిందనే భావాన్ని మరీ స్పష్టంగా చేర్చుతుంది. ఎంచుకున్న పదబంధం మూలంలోని సంక్షిప్తతను కొంత వివరిస్తూనే దాని న్యాయపరమైన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన న్యాయశైలిని ఉపయోగించాం. ‘సాక్షులు’ అనే మూలపాఠ పునరుక్తిని నిలిపాం. ‘మరణశిక్షకు పాత్రుడు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; అడుగుసూచిక మూలంలోని సంక్షిప్త, కొంత అస్పష్టమైన వ్యక్తీకరణను చూపిస్తుంది.
