  source_fidelity: మూలంలోని עַל־פִּי న్యాయపరమైన సాక్ష్య/వాంగ్మూల భావాన్ని, ఇద్దరు లేదా ముగ్గురు సాక్షుల అవసరాన్ని, అలాగే ఒక్క సాక్షి ఆధారంగా మరణశిక్ష అమలు చేయరాదనే నిషేధాన్ని ముసాయిదా సరిగ్గా ప్రతిబింబిస్తుంది. అయితే ‘మరణశిక్షకు పాత్రుడైన’ అనేది הַמֵּת యొక్క సంక్షిప్తమైన, కొంత అస్పష్టమైన వ్యక్తీకరణను కొద్దిగా విస్తరిస్తుంది; ‘చంపాలి’ కంటే ‘మరణశిక్ష అమలు చేయాలి’ మూలంలోని న్యాయపరమైన కార్యవాచ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
