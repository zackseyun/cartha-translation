id: DEU.17.17
reference: Deuteronomy 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֤א יַרְבֶּה לּ/וֹ֙ נָשִׁ֔ים וְ/לֹ֥א יָס֖וּר לְבָב֑/וֹ וְ/כֶ֣סֶף וְ/זָהָ֔ב לֹ֥א יַרְבֶּה לּ֖/וֹ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: te
  text: అతడు తనకొరకు అనేకమంది భార్యలను చేసుకోకూడదు, అతని హృదయం దారి తప్పిపోకుండా[a]; అలాగే తనకొరకు వెండి బంగారాలను అత్యధికంగా కూడబెట్టుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు అతని హృదయం దారి తప్పిపోకూడదు.” హీబ్రూ వాక్యాన్ని స్పష్టమైన ఉద్దేశం లేదా ఫలిత హెచ్చరికగా కాక, దానితో సమన్వయంగా ఉన్న మరో నిషేధంగా కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: ఎక్కువగా చేసుకోకూడదు / అత్యధికంగా కూడబెట్టుకోకూడదు
  rationale: రెండు చోట్లా అధికంగా పెంచుకోవడం లేదా సమకూర్చుకోవడం అనే హిఫీల్ భావం ఉంది. భార్యల విషయంలో సహజమైన తెలుగు కోసం ‘ఎక్కువగా చేసుకోకూడదు’, ధనలోహాల విషయంలో ‘అత్యధికంగా కూడబెట్టుకోకూడదు’ అని సందర్భానుసారంగా అనువదించాం.
- source_word: נָשִׁים
  choice: భార్యలను
  rationale: రాజుకు సంబంధించిన ఈ నియమంలో ఈ పదం సాధారణంగా స్త్రీలను కాక వివాహ భాగస్వాములను సూచిస్తుంది.
- source_word: יָסוּר
  choice: దారి తొలగవచ్చు
  rationale: సూర్ అనే క్రియలోని ‘దారి మళ్లడం/తొలగడం’ అనే రూపకాన్ని నిలిపి, మూలంలో లేని నిర్దిష్ట లక్ష్యాన్ని చేర్చలేదు.
- source_word: לְבָבוֹ
  choice: అతని హృదయం
  rationale: అంతరంగ సంకల్పం, అభిలాషలను సూచించే బైబిలీయ రూపకాన్ని ‘హృదయం’ నిలుపుతుంది.
- source_word: כֶּסֶף וְזָהָב
  choice: వెండిబంగారాలను
  rationale: మూలంలోని రెండు స్పష్టమైన లోహనామాలను నిలిపి, సహజమైన తెలుగు సమాసరూపంలో ఇచ్చాం.
- source_word: מְאֹד
  choice: అత్యధికంగా
  rationale: ధనసంపదను మితిమీరి పోగుచేసుకోవద్దనే తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: చేసుకోకూడదు ... అలా చేస్తే ... కూడబెట్టుకోకూడదు
  rationale: న్యాయవిధి స్వరాన్ని ఉంచుతూ, మధ్య వాక్యాన్ని మొదటి నిషేధానికి హెచ్చరికాత్మక ఫలితంగా ప్రధాన పాఠంలో చూపించాం; సమన్వయ నిషేధ పఠనాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: అనేక భార్యలను చేసుకోవడం మరియు హృదయం దారి తొలగడం మధ్య సంబంధం
  choice: మధ్య వాక్యాన్ని మొదటి నిషేధం వల్ల సంభవించగల హెచ్చరికాత్మక ఫలితంగా అనువదించడం
  alternative: ‘అతని హృదయం దారి తొలగకూడదు’ అనే సమన్వయ నిషేధంగా చదవడం
  rationale: హీబ్రూ వాక్యనిర్మాణం ఉద్దేశం/ఫలితం లేదా సమన్వయ నిషేధం—రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సందర్భానికి సహజమైన హెచ్చరిక భావాన్ని ఇచ్చి, నిజమైన సందిగ్ధతను పాదసూచికలో తెలిపాం. మూలంలో లేని ‘యెహోవా నుండి’ వంటి కర్మను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవిధి శైలిని ఉపయోగించాం. ‘అతడు’, ‘చేసుకోకూడదు’, ‘కూడబెట్టుకోకూడదు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. మూలంలోని రూపకం మరియు వాక్యనిర్మాణ సందిగ్ధతను నిలిపాం.
