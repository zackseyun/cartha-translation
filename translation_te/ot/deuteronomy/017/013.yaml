  edition: WLC
  text: וְ/כָל הָ/עָ֖ם יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹ֥א יְזִיד֖וּ/ן עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: te
  text: ప్రజలందరూ విని భయపడతారు; ఇకపై అహంకారంతో ధిక్కరించి ప్రవర్తించరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇకపై దురహంకారంతో ప్రవర్తించరు.’ హీబ్రూ క్రియ ఉద్దేశపూర్వకమైన, అహంకారపూరిత ధిక్కారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూ పాఠంలో ‘ప్రజలందరూ’ అని మాత్రమే ఉంది; ఈ వచనంలో ‘ఇశ్రాయేలు’ అనే పదాన్ని అదనంగా చేర్చలేదు. తెలుగు వాక్య ప్రవాహంలో ఆరంభ సంధిని ప్రత్యేకంగా అనువదించకపోవడం సహజం.
- source_word: יִשְׁמְעוּ
  choice: విని
  rationale: שמע యొక్క ప్రాథమిక భావం ‘వినడం’. ఇక్కడ తీర్పు గురించి ప్రజలు వింటారనే భావాన్ని సహజమైన తెలుగు సంయుక్త క్రియలో తెలిపింది.
- source_word: וְיִרָאוּ
  choice: భయపడతారు
  rationale: మూలంలో భయానికి కర్తవ్యవాచకం లేదు. ‘భయపడతారు’ అని మాత్రమే చెప్పడం ద్వారా అది దేవుని గురించిన భయమా, శిక్ష గురించిన భయమా, రెండూ కలిసినదా అన్న స్పష్టీకరించని భావాన్ని నిలుపుతుంది.
- source_word: וְלֹא יְזִידוּן
  choice: అహంకారంతో ధిక్కరించి ప్రవర్తించరు
  rationale: זיד యొక్క హిఫీల్ రూపం కేవలం అంతరంగ గర్వాన్ని కాక, ఉద్దేశపూర్వకమైన అహంకారపూరిత ధిక్కార చర్యను సూచిస్తుంది. ‘అహంకారంతో ధిక్కరించి ప్రవర్తించడం’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: עוֹד
  choice: ఇకపై
  rationale: עוֹד ఇక్కడ భవిష్యత్తులో ఆ ప్రవర్తన కొనసాగకపోవడాన్ని సూచిస్తుంది; ‘ఇకపై’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: తీర్పు వల్ల కలిగే భయం యొక్క స్వభావం
  choice: ‘భయపడతారు’ అని కర్తవ్యవాచకం లేకుండా అనువదించడం
  alternative: ‘యెహోవాకు భయపడతారు’ లేదా ‘శిక్షకు భయపడతారు’
  rationale: హీబ్రూ పాఠం భయానికి కర్తవ్యవాచకాన్ని పేర్కొనదు. అందువల్ల దేవుని భయం, న్యాయశిక్ష భయం, లేదా రెండూ అనే అవకాశాల్లో ఒకదానిని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయపరమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని ఫలితార్థక భవిష్యత్ భావాన్ని తెలుగు సహజ వాక్య నిర్మాణంలో నిలిపాం.
