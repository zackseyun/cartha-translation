  source_fidelity: 'మూల హీబ్రూ వాక్యంలోని మూడు సమన్వయ క్రియల భావం సరిగ్గా ఉంది: ప్రజలందరూ వింటారు, భయపడతారు, ఇకపై ఉద్దేశపూర్వక దురహంకార/ధిక్కార ప్రవర్తన చేయరు. ‘భయపడతారు’కు కర్మను జోడించకపోవడం మూలంలోని ఉద్దేశ్యపూర్వక అస్పష్టతను కాపాడుతుంది.'
  naturalness: ‘ప్రజలందరూ విని భయపడతారు; ఇకపై అహంకారంతో ధిక్కరించి ప్రవర్తించరు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, న్యాయపరమైన గంభీరతతో ఉంది. ‘విని’ అనేది ఇక్కడ వినడం వల్ల కలిగే ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
  terminology: ‘అహంకారంతో ధిక్కరించి ప్రవర్తించరు’ అనేది הֵזִיד యొక్క గర్వపూరిత, ఉద్దేశపూర్వక అవిధేయత భావాన్ని సందర్భానుగుణంగా అందిస్తుంది. ‘ఇకపై’ עוֹד యొక్క ‘మరల/ఇకముందు కాదు’ భావాన్ని సముచితంగా ఇస్తుంది. పాదసూచిక ప్రత్యామ్నాయ పదప్రయోగాన్ని మరియు క్రియ యొక్క ఉద్దేశపూర్వక ధిక్కార భావాన్ని సమర్థంగా వివరిస్తుంది.
