revisions:
- from: తీర్పు చెప్పవలసిన ఏదైనా విషయం నీకు మరీ కష్టంగా ఉంటే—ఒక రక్తపాతానికి మరొక రక్తపాతానికి మధ్య[a], ఒక న్యాయవాదానికి మరొక న్యాయవాదానికి మధ్య[b], ఒక గాయానికి మరొక గాయానికి మధ్య[c] తేడా నిర్ధారించలేకపోతే—అంటే, నీ పట్టణ ద్వారాల దగ్గర తలెత్తే వివాదాస్పద విషయాల్లో[d] అలా జరిగితే, నీవు లేచి నీ దేవుడైన యెహోవా ఎంచుకునే స్థలానికి వెళ్లాలి.
  to: తీర్పు చెప్పవలసిన ఏదైనా విషయం నీకు చాలా క్లిష్టంగా ఉంటే—నీ పట్టణ ద్వారాల్లో తలెత్తే వివాదాల్లో రక్తపాతానికి రక్తపాతానికి మధ్య[a], న్యాయదావాకు న్యాయదావాకు మధ్య[b], గాయానికి గాయానికి మధ్య[c] తేడాను నిర్ణయించవలసి వస్తే—నీవు లేచి, నీ దేవుడైన యాహ్వే ఎంచుకునే స్థలానికి ఎక్కి వెళ్లాలి.[d]
  rationale: The revision restores the Hebrew sentence's single conditional structure, retains the three parallel disputed categories, uses a more accurate modern Telugu legal term, preserves the command to go up, and aligns the divine name with the POB audit trail. Footnote anchors are retained and placed immediately after their relevant expressions.
