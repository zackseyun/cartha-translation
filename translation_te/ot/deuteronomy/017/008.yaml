source:
  edition: WLC
  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: te
  text: తీర్పు చెప్పవలసిన ఏదైనా విషయం నీకు చాలా క్లిష్టంగా ఉంటే—నీ పట్టణ ద్వారాల్లో తలెత్తే వివాదాల్లో రక్తపాతానికి రక్తపాతానికి మధ్య[a], న్యాయదావాకు న్యాయదావాకు మధ్య[b], గాయానికి గాయానికి మధ్య[c] తేడాను నిర్ణయించవలసి వస్తే—నీవు లేచి, నీ దేవుడైన యాహ్వే ఎంచుకునే స్థలానికి ఎక్కి వెళ్లాలి.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రక్తానికి రక్తానికి మధ్య.” ఇది రక్తదోషం లేదా హత్యకు సంబంధించిన వేర్వేరు కేసుల మధ్య తేడాను నిర్ణయించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక న్యాయకేసుకు మరొక న్యాయకేసుకు మధ్య” లేదా “ఒక తీర్పుకు మరొక తీర్పుకు మధ్య.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఒక బాధకు మరొక బాధకు మధ్య” లేదా “ఒక తెగులుకు మరొక తెగులుకు మధ్య.”
    reason: lexical_alternative
  - marker: d
    text: “పట్టణ ద్వారాలు” స్థానిక న్యాయ విచారణలు జరిగే స్థలాన్ని సూచిస్తుంది; పురాతన ఇశ్రాయేలు పట్టణాల్లో ద్వారాల దగ్గర సాధారణంగా న్యాయ వ్యవహారాలు నిర్వహించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא מִמְּךָ
  choice: నీకు మరీ కష్టంగా ఉంటే
  rationale: న్యాయ సందర్భంలో నిఫాల్ రూపం ఒక విషయాన్ని నిర్ణయించడం వ్యక్తి సామర్థ్యానికి మించినదని సూచిస్తుంది; సహజమైన తెలుగులో ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: తీర్పు చెప్పవలసిన ఏదైనా విషయం
  rationale: דָבָר అనే విస్తృత పదాన్నీ, מִשְׁפָּט అనే న్యాయపరమైన భావాన్నీ కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּין דָּם לְדָם
  choice: ఒక రక్తపాతానికి మరొక రక్తపాతానికి మధ్య
  rationale: హీబ్రూ పదచిత్రాన్ని నిలుపుతూ, ఇది రక్తదోషం లేదా హత్యకు సంబంధించిన వేర్వేరు కేసుల నిర్ణయమని పాఠకునికి గ్రాహ్యంగా చేస్తుంది.
- source_word: בֵּין דִּין לְדִין
  choice: ఒక న్యాయవాదానికి మరొక న్యాయవాదానికి మధ్య
  rationale: דִּין ఇక్కడ న్యాయదావా, వాదన లేదా కేసును సూచించవచ్చు; 'న్యాయవాదం' ఆ విస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: ఒక గాయానికి మరొక గాయానికి మధ్య
  rationale: న్యాయపరమైన జాబితాలో נֶגַעకు 'గాయం' సహజమైన అర్థం; అయితే తెగులు లేదా బాధ అనే ఇతర సాధ్యార్థాలను పాదసూచనలో ఉంచాం.
- source_word: דִּבְרֵי רִיבֹת
  choice: వివాదాస్పద విషయాలు
  rationale: వివాదం, కలహం కలిగిన న్యాయ విషయాలనే సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణ ద్వారాల దగ్గర
  rationale: అక్షరార్థమైన 'నీ ద్వారాల్లో' అనే సాంస్కృతిక చిత్రాన్ని, పట్టణ న్యాయస్థానం అనే భావంతో తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: నీవు లేచి ... వెళ్లాలి
  rationale: క్రియకు పూనుకోవడాన్ని నిలుపుతుంది; עָלָהలోని ఎక్కివెళ్లే భావం తెలుగులో గమ్యస్థానాన్ని బట్టి సహజంగా వినిపించకపోవడంతో ప్రధాన పాఠంలో సాధారణ 'వెళ్లాలి' వాడబడింది.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: ఎంచుకునే స్థలం
  rationale: ఇంకా నిర్దేశించబడబోయే కేంద్రీయ స్థలాన్ని సూచించే భవిష్యదర్థాన్ని సహజమైన తెలుగు సంబంధక్రియతో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే దైవనామ రూపం; దీనిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని 'ప్రభువు' అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంలో నిలుపాం. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన 'యెహోవా'ను ప్రధాన పాఠంలో ఎంచుకున్నాం; 'యాహ్వే' ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: נֶגַע యొక్క సందర్భార్థం
  choice: గాయం
  alternative: బాధ లేదా తెగులు
  rationale: ఈ న్యాయపరమైన జాబితాలో శారీరక హానికి సంబంధించిన వివాదం ప్రధానంగా కనిపిస్తుంది; అయినా హీబ్రూ పదానికి వ్యాధి, తెగులు, బాధ అనే విస్తృత అర్థాలు ఉండటంతో వాటిని పాదసూచనలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకునికి అర్థమయ్యే న్యాయపరమైన శైలి వాడబడింది. మూలంలోని మూడు సమాంతర జంటలను నిలిపి, వాటి నిర్ణయాత్మక భావాన్ని సహజంగా చేయడానికి “తేడా నిర్ధారించలేకపోతే” చేర్చబడింది. దైవనామం బిరుదుగా కాక నామంగా ఉంచబడింది.
