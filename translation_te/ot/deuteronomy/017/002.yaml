source:
  edition: WLC
  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: te
  text: నీ మధ్య, నీ దేవుడైన యెహోవా నీకు ఇస్తున్న నీ పట్టణాల్లో ఒకదానిలో, యెహోవా నీ దేవుని దృష్టిలో చెడును చేసి ఆయన నిబంధనను అతిక్రమించే ఒక పురుషుడు గానీ స్త్రీ గానీ కనబడితే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: కనబడితే
  rationale: న్యాయవిధిలోని షరతును తెలుగులో సహజంగా తెలిపేందుకు వాక్యాంత క్రియతో కలిపి ‘కనబడితే’గా అనువదించాం.
- source_word: יִמָּצֵא
  choice: కనబడితే
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని, వ్యక్తి చేసిన పని బయటపడిన న్యాయసందర్భాన్ని నిలుపుతుంది.
- source_word: בְּקִרְבְּךָ
  choice: నీ మధ్య
  rationale: సమాజం లోపల అనే నిబంధనాత్మక, న్యాయపరమైన పరిధిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో ఒకదానిలో
  rationale: ‘నీ ద్వారాల్లో ఒకదానిలో’ అనేది అక్షరార్థం; ద్వారాలు ఇక్కడ పట్టణాలను లేదా వాటి న్యాయపరిధిని సూచించే రూపకాలంకారం. ఆధునిక తెలుగులో అర్థమయ్యే ప్రధాన పాఠంగా ‘పట్టణాల్లో’ ఎంచుకుని అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: నీ దేవుడైన యెహోవా నీకు ఇస్తున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న దాన భావాన్ని ‘ఇస్తున్న’ నిలుపుతుంది.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ఒక పురుషుడైనా స్త్రీయైనా
  rationale: హీబ్రూ పాఠంలోని స్త్రీపురుషుల స్పష్టమైన జంటను యథాతథంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע
  choice: చెడ్డదైన దాన్ని చేసి
  rationale: ‘చెడును చేయడం’ అనే హీబ్రూ జాతీయాన్ని సహజమైన తెలుగులో అందిస్తూ నైతిక భావాన్ని నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా దృష్టికి
  rationale: ‘యెహోవా కళ్లలో’ అనే మూలభాషా రూపకానికి తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: ఆయన నిబంధనను అతిక్రమించినట్లు
  rationale: עבר యొక్క హద్దు దాటడం/అతిక్రమించడం అనే భావాన్ని, నిబంధన ఉల్లంఘన సందర్భంలో నిలుపుతుంది; నిర్దిష్ట నిబంధన అంశాన్ని ముందుగానే చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: నిబంధన ఉల్లంఘన భాష స్వభావం
  choice: ‘ఆయన నిబంధనను అతిక్రమించినట్లు’
  alternative: ‘ఆయన నిబంధనను ఉల్లంఘించి’ లేదా ‘ఆయన నిబంధనను భంగం చేసి’
  rationale: ఈ వచనం నిబంధన ఉల్లంఘనను సాధారణంగా పేర్కొంటుంది; తదుపరి వచనం నిర్దిష్ట అపరాధాన్ని వివరిస్తుంది. అందువల్ల ఇక్కడ ఏ ప్రత్యేక నిబంధన ఆజ్ఞను లేదా తరువాతి సిద్ధాంతవ్యవస్థను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ షరతు నిర్మాణానికి అనుగుణంగా ప్రధాన క్రియను వాక్యాంతంలో ఉంచాం. ఈ వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచాం.
