  text: וְ/הֽוֹצֵאתָ֣ אֶת הָ/אִ֣ישׁ הַ/ה֡וּא אוֹ֩ אֶת הָ/אִשָּׁ֨ה הַ/הִ֜וא אֲשֶׁ֣ר עָ֠שׂוּ אֶת הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֶל שְׁעָרֶ֔י/ךָ אֶת הָ/אִ֕ישׁ א֖וֹ אֶת הָ/אִשָּׁ֑ה וּ/סְקַלְתָּ֥/ם בָּ/אֲבָנִ֖ים וָ/מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: te
  text: అప్పుడు ఈ చెడ్డ కార్యాన్ని[b] చేసిన ఆ పురుషుడినిగాని ఆ స్త్రీనిగాని నీ ద్వారాల దగ్గరకు[a] తీసుకువెళ్లాలి. ఆ పురుషుడినిగాని ఆ స్త్రీనిగాని రాళ్లతో రువ్వాలి; వారు మరణిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ ద్వారాలు” అంటే పట్టణ ద్వారాలు. ప్రాచీన ఇశ్రాయేలులో అవి తీర్పులు, న్యాయవిచారణలు సాధారణంగా జరిగే బహిరంగ ప్రదేశాలు.
    reason: cultural_note
  - marker: b
    text: లేదా “ఈ చెడ్డ విషయాన్ని.” ఇక్కడున్న హీబ్రూ పదానికి న్యాయసందర్భంలో “కార్యం” లేదా “విషయం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: అప్పుడు ... తీసుకురావాలి
  rationale: న్యాయవిధానంలో తదుపరి చర్యను సూచించే వావ్‌తో కూడిన క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో క్రమార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ ... הָאִשָּׁה
  choice: ఆ పురుషుణ్ణిగాని ఆ స్త్రీనిగాని
  rationale: హీబ్రూ పాఠంలో పురుషుడు, స్త్రీ ఇద్దరూ ప్రత్యేకంగా పేర్కొనబడ్డారు; ‘గాని ... గాని’ నిర్మాణం ప్రత్యామ్నాయ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָשׂוּ
  choice: చేసిన
  rationale: మూలంలోని సాపేక్ష ఉపవాక్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘నేరం చేసిన’ అని అనువదించి మూలంలో లేని న్యాయపదాన్ని చేర్చదు.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: ఈ దుష్కార్యాన్ని
  rationale: רָע యొక్క నైతిక ప్రతికూలతను, דָּבָר యొక్క ‘కార్యం/విషయం’ పరిధిని న్యాయసందర్భానికి తగిన గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֶל שְׁעָרֶיךָ
  choice: నీ ద్వారాల దగ్గరికి
  rationale: హీబ్రూలోని బహువచన ‘ద్వారాలు’ అనే స్పష్టమైన రూపాన్ని నిలుపుతూ, వాటి సామాజిక-న్యాయపరమైన పాత్రను ప్రధాన పాఠంలో విస్తరించకుండా పాదసూచికలో వివరిస్తుంది.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: రాళ్లతో కొట్టాలి
  rationale: మూలంలో స్పష్టంగా ఉన్న ‘రాళ్లతో’ అనే సాధనార్థాన్ని నిలుపుతుంది. తెలుగులో ‘రాళ్లతో రాళ్లు వేయాలి’ వంటి అసహజ పునరుక్తిని నివారిస్తుంది.
- source_word: וָמֵתוּ
  choice: అలా వారు చనిపోవాలి
  rationale: రాళ్లతో కొట్టడం వల్ల కలిగే మరణఫలితాన్ని వేరుగా నిలుపుతూ, న్యాయవిధి యొక్క గంభీరతను తెలియజేస్తుంది; నేరుగా ‘చంపాలి’ అని కుదించి మూలంలోని రెండు క్రియలను ఒక్కటిగా చేయదు.
theological_decisions:
- issue: లింగాన్ని ప్రత్యేకంగా పేర్కొనే న్యాయసూత్రం
  choice: ఆ పురుషుణ్ణిగాని ఆ స్త్రీనిగాని
  alternative: ఆ వ్యక్తిని
  rationale: మూలపాఠం పురుషుణ్ణి, స్త్రీని విడివిడిగా స్పష్టంగా పేర్కొంటుంది. లింగతటస్థ పదంతో ఆ ప్రత్యేకతను తొలగించలేదు.
- issue: ద్వారాల వద్ద జరిగే న్యాయచర్య
  choice: నీ ద్వారాల దగ్గరికి
  alternative: ప్రజా న్యాయస్థలానికి / పట్టణ ద్వారం దగ్గరికి
  rationale: మూలంలోని స్పష్టమైన ‘ద్వారాలు’ అనే దృశ్యరూపాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రాచీన ఇశ్రాయేలులో దాని న్యాయపరమైన పాత్రను పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయవిధికి తగిన గంభీరతను నిలిపింది. మూలంలోని పురుషుడు-స్త్రీ జంట, బహువచన ‘ద్వారాలు,’ రాళ్ల ప్రస్తావన, మరణఫలితం అన్నీ ఉంచబడ్డాయి. పాదసూచిక గుర్తులు అవి వివరించే పదబంధాల వెంటనే అమర్చబడ్డాయి.
