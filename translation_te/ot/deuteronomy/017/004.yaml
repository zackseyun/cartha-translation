revisions:
- from: అది నీకు తెలియజేయబడినప్పుడు, నీవు దాని గురించి విని, జాగ్రత్తగా విచారణ చేయాలి. ఇదిగో, ఆ విషయం నిజమని, నిర్ధారితమని తేలితే—ఇశ్రాయేలులో ఈ హేయకార్యం జరిగిందని తేలితే—
  to: నీకు ఈ సంగతి తెలియజేయబడగా, నీవు దాని గురించి విని క్షుణ్ణంగా విచారిస్తే, ఇదిగో, ఆ విషయం నిజమై స్థిరపడితే—అంటే ఈ హేయకార్యం ఇశ్రాయేలులో జరిగిందని—
  rationale: The revision removes the added obligation, renders the investigation as part of the legal conditional sequence, and expresses אמת נכון הדבר as a single verified matter. The explanatory dash clause naturally conveys that the established matter is the occurrence of the abomination in Israel, while preserving the verse’s continuation into the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:33:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the reported/heard/investigated sequence and the judicial force of אמת נכון, but it introduces an unwarranted prescriptive ‘చేయాలి’ and repeats ‘తేలితే,’ obscuring the Hebrew confirmation formula. The revised wording retains the conditional legal setting and states one verified finding.
  naturalness: The revised Telugu is modern, formal, and natural for a legal procedure. It avoids the awkward double conditional result and makes the final content clause clear.
  terminology: ‘క్షుణ్ణంగా విచారించు’ accurately conveys judicial דרש היטב. ‘హేయకార్యం’ suitably conveys the strong evaluative term תועבה; ‘ఇశ్రాయేలు’ is retained as the standard name form. ‘నిజమై స్థిరపడితే’ preserves both אמת and נכון without importing interpretation.
  issues:
  - severity: medium
    issue: ‘జాగ్రత్తగా విచారణ చేయాలి’ adds a modal obligation not expressed by the Hebrew verbal sequence.
    rationale: The verse describes the procedural sequence within a conditional legal case; Telugu should not turn this clause into an independent command with ‘చేయాలి.’
  - severity: medium
    issue: The draft uses ‘తేలితే’ twice, once for the confirmed matter and again for the content that the abomination occurred.
    rationale: 'The Hebrew has one judicial confirmation formula: the matter is true/established, namely that this abomination was done. The repetition creates an unnecessarily convoluted and potentially double-conditional construction.'
  revised_text: నీకు ఈ సంగతి తెలియజేయబడగా, నీవు దాని గురించి విని క్షుణ్ణంగా విచారిస్తే, ఇదిగో, ఆ విషయం నిజమై స్థిరపడితే—అంటే ఈ హేయకార్యం ఇశ్రాయేలులో జరిగిందని—
  revised_footnotes: []
  revision_rationale: The revision removes the added obligation, renders the investigation as part of the legal conditional sequence, and expresses אמת נכון הדבר as a single verified matter. The explanatory dash clause naturally conveys that the established matter is the occurrence of the abomination in Israel, while preserving the verse’s continuation into the following verse.
