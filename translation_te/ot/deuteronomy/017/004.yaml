source:
  edition: WLC
  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: te
  text: నీకు ఈ సంగతి తెలియజేయబడగా, నీవు దాని గురించి విని క్షుణ్ణంగా విచారిస్తే, ఇదిగో, ఆ విషయం నిజమై స్థిరపడితే—అంటే ఈ హేయకార్యం ఇశ్రాయేలులో జరిగిందని—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: అది నీకు తెలియజేయబడినప్పుడు
  rationale: హొఫాల్ రూపంలోని పరోక్ష కర్మణి భావాన్ని నిలుపుతూ, ముందటి వచనంలోని ఆరోపణే తెలియజేయబడిందని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וְשָׁמָעְתָּ
  choice: నీవు దాని గురించి విని
  rationale: శׁמע యొక్క ప్రాథమిక అర్థమైన ‘విను’ను నిలుపుతూ, అంతర్లీన కర్మను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: జాగ్రత్తగా విచారణ చేయాలి
  rationale: న్యాయ సందర్భంలో דרש అంటే పరిశోధించడం లేదా విచారించడం; הֵיטֵב ఆ విచారణ సమగ్రంగా, జాగ్రత్తగా జరగాలని బలపరుస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: విచారణలో తేలిన ఫలితంపై దృష్టి నిలిపే హీబ్రూ సూచన పదం యొక్క గంభీరతను నిలుపుతుంది.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: ఆ విషయం నిజమని, నిర్ధారితమని తేలితే
  rationale: אֱמֶת మరియు נָכוֹן అనే రెండు న్యాయ నిర్ధారణ భావాలను వేర్వేరుగా నిలుపుతుంది; ‘ఆ విషయం’ ద్వారా הַדָּבָרను ప్రత్యక్షంగా అనువదిస్తుంది.
- source_word: נֶעֶשְׂתָה
  choice: జరిగిందని తేలితే
  rationale: చర్య నిజంగా జరిగిందనే విచారణ ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కర్మణి భావం సందర్భంలో అంతర్లీనంగా నిలుస్తుంది.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: ఈ హేయకార్యం
  rationale: תּוֹעֵבָה యొక్క బలమైన నైతిక, నిబంధనాత్మక అసహ్య భావాన్ని ఆధునిక తెలుగులో అర్థమయ్యేలా ‘హేయకార్యం’గా వ్యక్తం చేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఆ అపరాధం ఇశ్రాయేలు సమాజం మధ్య జరిగిందనే స్థానిక, సమాజ సంబంధ భావాన్ని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: אֱמֶת נָכוֹן הַדָּבָר అనే న్యాయ నిర్ధారణ సూత్రం
  choice: ఆ విషయం నిజమని, నిర్ధారితమని తేలితే
  alternative: ఆ విషయం నిజమైనదీ స్థిరపడినదీ అయితే
  rationale: రెండు హీబ్రూ పదాల మధ్యనున్న నిజత్వం మరియు స్థిర నిర్ధారణ అనే ఉద్వేగాన్ని కలిపివేయకుండా నిలుపుతుంది; న్యాయ విచారణ సందర్భాన్ని మించి సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: תּוֹעֵבָה యొక్క బలమైన నైతిక విలువ
  choice: హేయకార్యం
  alternative: అసహ్యకార్యం
  rationale: ఆ పదంలోని తీవ్రమైన నైతిక ఖండనను తగ్గించకుండా, సాధారణ ఆధునిక తెలుగు పాఠకునికి సహజంగా అర్థమయ్యే పదాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన గంభీరతను నిలుపుతూ అనువదించబడింది. హీబ్రూలోని వరుస వావ్ క్రియలను తెలుగులో సహజమైన షరతు నిర్మాణంగా అమర్చాం. వచనం తరువాతి ఆజ్ఞతో కొనసాగుతున్నందున ముగింపులో దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
