source:
  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: te
  text: అయితే, అక్కడ నీ దేవుడైన యాహ్వేకు[c] సేవ చేయడానికి నిలిచే యాజకుని మాటగానీ, న్యాయాధిపతి మాటగానీ వినకుండా[b] ధిక్కారపూర్వకంగా[a] ప్రవర్తించే మనిషి చనిపోవాలి. ఆ విధంగా నీవు ఇశ్రాయేలులో నుండి చెడును తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధిక్కారపూర్వకంగా’—హీబ్రూ పదబంధానికి ‘అహంకారంతో’ లేదా ‘ఉద్దేశపూర్వకంగా ఎదిరిస్తూ’ అని కూడా అర్థం ఉండవచ్చు. ఇది అనుకోకుండా జరిగిన తప్పును కాక, తెలిసే చేసిన తిరస్కారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వినకుండా’ అనే హీబ్రూ వ్యక్తీకరణకు ఈ న్యాయసందర్భంలో ‘మాట పాటించకుండా’ లేదా ‘విధేయత చూపకుండా’ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘యాహ్వే’ అనేది יהוה అనే దైవనామానికి లిప్యంతరీకరణ. దీనిని సాంప్రదాయంగా ‘యెహోవా’ అని లిప్యంతరీకరించడం లేదా ‘ప్రభువు’ అని అనువదించడం కూడా జరుగుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: అయితే ... మనిషి
  rationale: వాక్యం ముందున్న న్యాయవిధానాన్ని కొనసాగిస్తూ, దానికి విరుద్ధంగా ఎదిరించే అపరాధిని పరిచయం చేస్తుంది. אִישׁ లోని ఏకవచన పురుష సూచనను ‘మనిషి’ నిలుపుతుంది.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: ధిక్కారపూర్వకంగా ప్రవర్తించే
  rationale: ఈ పదబంధం పొరపాటున విఫలమవడాన్ని కాకుండా, తెలిసే అధికారాన్ని ఎదిరిస్తూ ఉద్దేశపూర్వకంగా ప్రవర్తించడాన్ని సూచిస్తుంది.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: వినకుండా
  rationale: שׁמע అనే క్రియ యొక్క ప్రాథమిక ‘విను’ భావాన్ని నిలుపుతూ, న్యాయసందర్భంలో మాటను లక్ష్యపెట్టకపోవడం లేదా విధేయత చూపకపోవడం అనే భావాన్నీ సందర్భం ద్వారా అందిస్తుంది.
- source_word: אֶל הַכֹּהֵן
  choice: యాజకుని మాట
  rationale: తెలుగులో ‘ఒకరిని వినడం’ కంటే ‘ఒకరి మాట వినడం’ సహజం; ‘మాట’ భావపూరకంగా చేర్చబడింది, కొత్త సమాచారంగా కాదు.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: అక్కడ ... సేవ చేయడానికి నిలిచే
  rationale: ‘అక్కడ’ అనే స్థలసూచనను, యాజకుని అధికారిక సేవను తెలిపే కృదంత-క్రియ నిర్మాణాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వేకు
  rationale: שרת క్రియతో తెలుగులో ‘యాహ్వేకు సేవ చేయడం’ సహజంగా ఉంటుంది. రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’గా నిలిపింది.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: న్యాయాధిపతి మాటగానీ
  rationale: שֹׁפֵטను సాధారణంగా అర్థమయ్యే న్యాయపదమైన ‘న్యాయాధిపతి’గా అనువదించింది; אוֹ ... אוֹ సంబంధాన్ని తెలుగులో ‘గానీ ... గానీ’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: ఆ మనిషి చనిపోవాలి
  rationale: న్యాయశిక్షగా ఉన్న అనివార్య పరిణామాన్ని ‘చనిపోవాలి’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: ఆ విధంగా నీవు ఇశ్రాయేలులో నుండి చెడును తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసూత్ర వాక్యానికి తగిన విధంగా בער యొక్క తొలగింపు భావాన్ని అందిస్తుంది; ఏకవచన ‘నీవు’ను కూడా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా నాలుగు హల్లులతో కూడిన దైవనామం ఉంది. ‘యాహ్వే’ దానిని పేరుగా లిప్యంతరీకరిస్తుంది; పాదసూచిక సాంప్రదాయ ప్రత్యామ్నాయాలను తెలియజేస్తుంది.
- issue: అపరాధిని సూచించే లింగబద్ధ ఏకవచనం
  choice: మనిషి
  alternative: వ్యక్తి; ఎవడైనా
  rationale: హీబ్రూ אִישׁలోని ఏకవచన మానవ పురుష సూచనను ‘మనిషి’ సహజంగా నిలుపుతుంది; అదే సమయంలో కృత్రిమంగా కఠినమైన రూపాన్ని ఉపయోగించదు.
- issue: ‘వినడం’ మరియు ‘విధేయత చూపడం’ మధ్య భావ ఉద్రిక్తత
  choice: వినకుండా
  alternative: లోబడకుండా; మాట పాటించకుండా
  rationale: మూలక్రియ యొక్క ప్రత్యక్ష శ్రవణ రూపకాన్ని నిలుపుతూ, న్యాయసందర్భంలో దానికి ఉన్న విధేయత భావాన్ని పాదసూచికలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా విభజించింది. ‘ధిక్కారపూర్వకంగా’, ‘న్యాయాధిపతి’ వంటి పదాలు సందర్భ గంభీరతను నిలుపుతూనే సులభంగా అర్థమవుతాయి.
