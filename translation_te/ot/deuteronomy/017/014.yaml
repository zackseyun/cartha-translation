id: DEU.17.14
reference: Deuteronomy 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి నీవు వచ్చినప్పుడు, దానిని స్వాధీనం చేసుకుని, అందులో నివసించి, “నా చుట్టూ ఉన్న జనాంగాలన్నిటిలాగే నాపై ఒక రాజును నియమించుకుంటాను[a]” అని నీవు చెప్పినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా మీద ఒక రాజును ఉంచుకుంటాను.” హీబ్రూ పదబంధం అక్షరార్థంగా “నా మీద ఒక రాజును ఉంచుతాను” అని ఉంది.
    reason: שׂים అనే క్రియకు ‘ఉంచు/నియమించు’ అనే అర్థాలు ఉన్నాయి. ప్రధాన పాఠంలో సహజమైన తెలుగు ప్రయోగాన్ని, గమనికలో అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: నీవు వచ్చినప్పుడు
  rationale: כִּי ఇక్కడ భవిష్యత్తులో ఎదురయ్యే సందర్భాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘వచ్చినప్పుడు’ ఆ కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో ఇది ఇశ్రాయేలుకు ఇవ్వబడుతున్న నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్ దాన భావాన్ని నిలుపుతుంది.
- source_word: וִירִשְׁתָּהּ
  choice: దాన్ని స్వాధీనం చేసుకొని
  rationale: భూమికి సంబంధించిన సందర్భంలో ירשׁ అనేది దాన్ని వాస్తవంగా స్వాధీనపరచుకోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: అందులో నివసించి
  rationale: స్థిరంగా ఉండి జీవించడాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָמַרְתָּ
  choice: నీవు చెబితే
  rationale: ముందున్న కాలసంబంధ పరిస్థితిలో తరువాత కలిగే మాటను తెలుగులో షరతుతో కూడిన సహజ వాక్యనిర్మాణంగా అందిస్తుంది; రాజును తప్పక కోరతారని నిర్ధారించదు.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: నా మీద ఒక రాజును పెట్టుకుంటాను
  rationale: שׂים (‘పెట్టు/నియమించు’) మరియు עָלַי (‘నా మీద’) అనే హీబ్రూ పదబంధాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతూ, కర్త తనపై రాజును ఉంచుకోవాలనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כְּכָל הַגּוֹיִם
  choice: జనాలన్నిటిలాగే
  rationale: ఇక్కడ גּוֹיִם చుట్టుపక్కల ఉన్న రాజకీయ ప్రజాసమూహాలను సూచిస్తుంది; తరువాతి ‘నా చుట్టూ ఉన్న’ అనే మాటతో కలిపి ‘జనాలు’ సహజంగా ఉంది.
- source_word: אֲשֶׁר סְבִיבֹתָי
  choice: నా చుట్టూ ఉన్న
  rationale: ఉల్లేఖిత మాటలోని ప్రథమ పురుష దృష్టికోణాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చింది.
- issue: రాజును కోరడం ఆజ్ఞా, అనుమతా, లేక ముందుగా ఊహించిన పరిస్థితా
  choice: ముందుగా ఊహించిన పరిస్థితిగా అనువదించడం
  alternative: రాజును నియమించుకోవాలని ఆజ్ఞగా స్పష్టీకరించడం
  rationale: ఈ వచనం ప్రజలు అలా చెప్పే పరిస్థితిని పరిచయం చేస్తుంది; వారి కోరికపై నైతిక తీర్పును ఈ వాక్యంలోనే చేర్చదు. అందువల్ల మూలంలోని ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ఏకవచన సంబోధనను ‘నీవు/నీ’ రూపాలతో నిలిపింది. వాక్యం తదుపరి వచనంలో కొనసాగేందున చివర కామా ఉంచింది.
