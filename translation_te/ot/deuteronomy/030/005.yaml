revisions:
- from: నీ దేవుడైన యహోవా, నీ పితరులు స్వాధీనం చేసుకున్న[a] దేశంలోకి నిన్ను తీసుకువస్తాడు; నీవు దాన్ని స్వాధీనం చేసుకుంటావు. ఆయన నీకు మేలు చేసి[b], నీ పితరులకంటే నిన్ను అధికంగా వృద్ధి చేస్తాడు.
  to: నీ దేవుడైన యాహ్వే, నీ పితరులు స్వాధీనం చేసుకున్న[a] దేశంలోకి నిన్ను తీసుకువస్తాడు; నీవు దాన్ని స్వాధీనం చేసుకుంటావు. ఆయన నీకు మేలు చేస్తాడు[b], నీ పితరులకంటే నిన్ను అధికంగా వృద్ధి చేస్తాడు.
  rationale: మూలపాఠం మరియు POB యొక్క దైవనామ నిర్ణయానికి అనుగుణంగా యహ్వే నామాన్ని ‘యాహ్వే’గా సవరించాం. అలాగే ‘మేలు చేస్తాడు’ అనే సమాపక భవిష్యత్ క్రియారూపంతో హీబ్రూ సమన్వయ క్రియలను సహజంగా ప్రతిబింబించాం. పాదసూచిక a తండ్రులు భూమిని వారసత్వంగా పొందినారనే ప్రత్యామ్నాయాన్ని, పాదసూచిక b ‘మేలు చేయడం’కు ‘వర్ధిల్లజేయడం’ అనే సందర్భానుగుణ ప్రత్యామ్నాయాన్ని వాటి సంబంధిత పదాల వద్దనే ఉంచుతుంది.
