  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే, నీ పితరులు స్వాధీనం చేసుకున్న[a] దేశంలోకి నిన్ను తీసుకువస్తాడు; నీవు దాన్ని స్వాధీనం చేసుకుంటావు. ఆయన నీకు మేలు చేస్తాడు[b], నీ పితరులకంటే నిన్ను అధికంగా వృద్ధి చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పితరులు వారసత్వంగా పొందిన.’ హీబ్రూ క్రియకు వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన నిన్ను వర్ధిల్లజేస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: నిన్ను తీసుకువస్తాడు
  rationale: בוא యొక్క హిఫీల్ రూపం ‘లోనికి తీసుకురావడం’ అనే అర్థాన్ని ఇస్తుంది. సందర్భం తిరిగి తీసుకురావడాన్ని సూచించినా, ‘తిరిగి’ అనే మాట ఈ క్రియలో ప్రత్యక్షంగా లేదు కాబట్టి చేర్చలేదు.
- source_word: יְהוָה
  choice: యహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు పరిచితమైన ‘యహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, యహోవాతో సహజమైన తెలుగు సంబంధంలో ‘నీ దేవుడైన యహోవా’ అని అనువదించాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ వాగ్దాన భూభాగమే ఉద్దేశం. తెలుగులో ‘దేశం’ భౌగోళిక, జనసంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: నీ పితరులు స్వాధీనం చేసుకున్న
  rationale: ירשׁ అనే క్రియలో వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం అనే భావాలు రెండూ ఉండగలవు. ఈ సందర్భంలో వారు ఆ దేశాన్ని కలిగియున్నారనే భావాన్ని స్పష్టంగా చెప్పేందుకు ‘స్వాధీనం చేసుకున్న’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని సాధారణీకరించకుండా నిలిపాం.
- source_word: וִירִשְׁתָּהּ
  choice: నీవు దాన్ని స్వాధీనం చేసుకుంటావు
  rationale: దేశాన్ని పొందుకొని ఆధీనంలో ఉంచుకోవడం అనే ירשׁ క్రియాభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ముందరి వాక్యభాగంతో ఉన్న పదబంధ సంబంధాన్నీ నిలుపుతుంది.
- source_word: וְהֵיטִבְךָ
  choice: ఆయన నీకు మేలు చేసి
  rationale: יטב హిఫీల్ రూపానికి ప్రాథమికంగా ‘ఒకరికి మేలు చేయడం’ అనే అర్థం ఉంది. సందర్భంలో సమృద్ధి భావం ఉండగలిగినా, దానికే పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
- source_word: וְהִרְבְּךָ
  choice: నిన్ను అధికంగా వృద్ధి చేస్తాడు
  rationale: רבה హిఫీల్ రూపం సంఖ్యలో విస్తరింపజేయడం లేదా అభివృద్ధి చేయడం సూచిస్తుంది. ‘వృద్ధి చేస్తాడు’ ప్రజాసంఖ్య పెరుగుదలతో పాటు ఆశీర్వాద సంబంధ విస్తరణను సహజంగా మోస్తుంది.
- source_word: מֵאֲבֹתֶיךָ
  choice: నీ పితరులకంటే
  rationale: מן ఇక్కడ తులనాత్మక భావాన్ని ఇస్తుంది; తరువాతి ‘అధికంగా’తో కలిసి వారికంటే ఎక్కువగా వృద్ధి చేయడాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా నామరూపంగానే నిలిపాం.
- issue: אֲבֹתֶיךָ అనే లింగనిర్దిష్ట బంధుత్వ పదం
  choice: నీ పితరులు
  alternative: నీ పూర్వీకులు
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని నిలుపుతూ ‘పితరులు’ అని ఇచ్చాం; లింగతటస్థమైన ‘పూర్వీకులు’గా మార్చలేదు.
- issue: וְהֵיטִבְךָ లోని ఆశీర్వాద భావం
  choice: ఆయన నీకు మేలు చేసి
  alternative: ఆయన నిన్ను వర్ధిల్లజేసి
  rationale: ఈ క్రియకు విస్తృతంగా ‘మేలు చేయడం’ అనే భావం ఉంది. సందర్భానుసారంగా ఆ మేలు సమృద్ధిని కలిగి ఉండవచ్చు గాని, అనువాదంలో దానిని కేవలం భౌతిక సౌభాగ్యంగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. మూలంలోని రెండవ పురుష ఏకవచనాన్ని ‘నీ/నిన్ను/నీవు’ రూపాలతో నిలిపాం. ‘పితరులు,’ ‘స్వాధీనం,’ ‘వృద్ధి’ వంటి పదాలు నిబంధనాత్మక-చారిత్రక సందర్భానికి తగిన గంభీరతను ఇస్తూనే సాధారణ పాఠకులకు గ్రాహ్యంగా ఉంటాయి.
