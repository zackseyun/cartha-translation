id: DEU.30.11
reference: Deuteronomy 30:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: te
  text: ఎందుకంటే, నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఈ ఆజ్ఞ నీకు అందనిది కాదు[a]; అది దూరంగా ఉన్నదీ కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ సామర్థ్యానికి మించినది కాదు,’ ‘నీకు మరుగైనది కాదు.’ హీబ్రూ క్రియ అసాధారణమైనది, చేరుకోలేనిది లేదా ఒకరి గ్రహణశక్తికి మించినది అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రబోధానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగులో సహజమైన అనుసంధానాన్ని ఇస్తుంది.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: ఈ ఆజ్ఞ
  rationale: మִצְוָה యొక్క నిబంధనాత్మక, అధికారపూర్వక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: హీబ్రూ భాగవాచక రూపంలోని ప్రస్తుత, తక్షణ సంబోధన భావాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: నీకు అందనిది కాదు
  rationale: פלא ఇక్కడ అసాధారణమైనది, గ్రహించలేనిది, చేరుకోలేనిది లేదా సామర్థ్యానికి మించినది అనే విస్తృత భావాన్ని కలిగి ఉంది. తరువాతి వచనాల్లోని సమీపత భావానికి అనుగుణంగా ‘అందనిది కాదు’ అనేది దాని ప్రాయోగిక సులభప్రాప్యతను తెలిపి, కేవలం కష్టత లేదా మానవ నైతిక సామర్థ్యంపై అతిశయ నిర్ణయాన్ని నివారిస్తుంది.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: అది దూరంగా ఉన్నదీ కాదు
  rationale: רָחוֹק లోని స్థలసంబంధమైన లేదా రూపకాల దూర భావాన్ని నిలుపుతూ, తరువాతి వచనాల్లో విస్తరించే సమీపత రూపకాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: נִפְלֵאת అనే పదం మరియు నిబంధన విధేయతకు సంబంధించిన మానవ సామర్థ్యం
  choice: ‘నీకు అందనిది కాదు’ అని అనువదించి ఆజ్ఞ సులభప్రాప్యమైనదనే భావాన్ని తెలిపాం.
  alternative: ‘నీకు మరీ కష్టమైనది కాదు’ లేదా ‘నీకు మరుగైనది కాదు’
  rationale: తక్షణ నిబంధన సందర్భంలో ఆజ్ఞ గ్రహించలేనంతగా లేదా చేరుకోలేనంతగా లేదని వచనం నొక్కి చెబుతుంది. ఈ అనువాదం సహాయం లేని మానవ నైతిక సామర్థ్యం గురించి విస్తృత సిద్ధాంత నిర్ణయం చేయకుండా, మూలపాఠంలోని భావపరమైన విస్తృతతను మరియు వేదాంత ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఏకవచన సంబోధనను ‘నీకు’తో నిలిపాం. ‘ఆజ్ఞ’ నిబంధనాత్మక భావాన్ని కాపాడుతుంది; ‘అందనిది’ మూలపదంలోని ఉద్దేశపూర్వక భావవిస్తృతిని సహజంగా ఉంచుతుంది.
