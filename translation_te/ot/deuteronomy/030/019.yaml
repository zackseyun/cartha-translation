  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: te
  text: 'నేడు నేను ఆకాశాన్నీ భూమినీ నీకు వ్యతిరేకంగా సాక్షులుగా పిలుస్తున్నాను[a][b]: జీవాన్నీ మరణాన్నీ, ఆశీర్వాదాన్నీ శాపాన్నీ నీ ముందుంచాను. నీవూ నీ సంతానమూ[c] జీవించేలా జీవాన్ని ఎంచుకో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ మాటలకు న్యాయపరమైన, నిబంధన సంబంధమైన భావం ఉంది: మోషే ఆకాశాన్ని, భూమిని ఇశ్రాయేలుకు వ్యతిరేకంగా సాక్షులుగా పిలుస్తున్నాడు.'
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాలు మరియు భూమి’; తెలుగులో ‘ఆకాశం మరియు భూమి’ సహజమైన ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీ వంశస్థులు’; హీబ్రూలో అక్షరార్థంగా ‘నీ విత్తనం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: నీకు వ్యతిరేకంగా సాక్షులుగా పిలుస్తున్నాను
  rationale: హిఫిల్ రూపం మరియు בָכֶם కలయిక ఇక్కడ నిబంధన సంబంధమైన న్యాయపరమైన సాక్ష్యభావాన్ని కలిగిస్తాయి. సాధారణంగా ‘హెచ్చరిస్తున్నాను’ అని కాకుండా సాక్షులను పిలిచే భావాన్ని నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: కాలప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగు పదంతో నిలుపుతుంది.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ఆకాశాన్నీ భూమినీ
  rationale: సృష్టి సమగ్రతను సూచించే జంటగా, నిబంధనకు సాక్షులుగా పిలువబడిన వాటిని సహజమైన తెలుగు ప్రయోగంలో అందిస్తుంది.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: జీవాన్నీ మరణాన్నీ
  rationale: ఇశ్రాయేలు ఎదుట ఉంచబడిన పరస్పర విరుద్ధమైన నిబంధన ఫలితాలను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: నీ ముందుంచాను
  rationale: నָתַן + לִפְנֵי ఇక్కడ ఎంపిక కోసం ఎదుట ఉంచడం అనే భావాన్ని ఇస్తుంది; తెలుగు సంయుక్తక్రియ దాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ఆశీర్వాదాన్నీ శాపాన్నీ
  rationale: ఏకవచనంలోని నిబంధన సంబంధమైన విరుద్ధ ఫలితాలను స్పష్టంగా నిలుపుతుంది.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: జీవాన్ని ఎంచుకో
  rationale: వావ్‌తో కూడిన పరిపూర్ణ క్రియ ఇక్కడ సందర్భానుసారంగా ప్రబోధాత్మక ఆజ్ఞగా పనిచేస్తుంది. మూలంలో లేని బలమైన కారణసూచక పదాన్ని చేర్చకుండా ఆజ్ఞను సహజంగా అందిస్తుంది.
- source_word: לְמַעַן תִּחְיֶה
  choice: జీవించేలా
  rationale: లక్ష్యం లేదా ఉద్దేశించిన ఫలితాన్ని తెలిపే לְמַעַן భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: నీవూ నీ సంతానమూ
  rationale: ప్రతినిధిగా ఇశ్రాయేలును ఉద్దేశించిన ఏకవచన ‘నీవు’ను నిలుపుతూ, זֶרַע యొక్క వంశపారంపర్య విస్తృతిని ‘సంతానం’ ద్వారా తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన-న్యాయస్థాన సాక్ష్యభావం
  choice: ఆకాశం, భూమిని ‘నీకు వ్యతిరేకంగా సాక్షులుగా’ పిలిచే న్యాయపరమైన భాషను ప్రధాన పాఠంలో నిలిపాం.
  alternative: ‘నేను నిన్ను హెచ్చరిస్తున్నాను’ లేదా ‘నేను నీకు సాక్ష్యమిస్తున్నాను.’
  rationale: హీబ్రూ వాక్యం నిబంధన సందర్భంలో ఆకాశం, భూమిని సాక్షులుగా ఆహ్వానిస్తుంది. సాధారణ హెచ్చరికగా మార్చితే ఆ న్యాయపరమైన తీవ్రత తగ్గిపోతుంది.
- issue: రెండవ పురుష ఏకవచనం మరియు ప్రతినిధి భావం
  choice: ‘నీవు/నీ’ అనే ఏకవచన సంబోధనను నిలిపాం.
  alternative: ‘మీరందరూ’ లేదా ‘ఇశ్రాయేలు ప్రజలు.’
  rationale: మూలంలోని పురుష ఏకవచనం నిబంధన భాగస్వామిగా ఇశ్రాయేలును సమష్టిగా ఉద్దేశిస్తుంది. తెలుగు ఏకవచనం ఆ మూలరూపాన్ని కాపాడుతుంది; ‘నీ సంతానం’ దాని తరతరాల విస్తృతిని తెలుపుతుంది.
- issue: וּבָחַרְתָּ యొక్క ప్రబోధాత్మక బలం
  choice: ‘జీవాన్ని ఎంచుకో’ అనే ప్రత్యక్ష ఆజ్ఞగా అనువదించాం; అదనపు ‘కాబట్టి’ని చేర్చలేదు.
  alternative: ‘కాబట్టి జీవాన్ని ఎంచుకో’ లేదా అక్షరార్థంగా ‘మరియు నీవు జీవాన్ని ఎంచుకుంటావు.’
  rationale: సందర్భం ఈ రూపానికి ఆజ్ఞాత్మక బలాన్ని ఇస్తుంది. అయితే వావ్‌ను తప్పనిసరిగా కారణసూచకంగా విప్పడం మూలంలో ఉన్న సంబంధాన్ని అతిగా నిర్ధారించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి వాడబడింది. ‘ఆశీర్వాదం/శాపం,’ ‘సాక్షులు,’ ‘సంతానం’ వంటి సుపరిచిత బైబిలు పదాలను నిలుపుతూ, కృత్రిమమైన అక్షరానువాద వాక్యనిర్మాణాన్ని నివారించాం.
