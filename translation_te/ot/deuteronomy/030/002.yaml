language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే దగ్గరకు నీవు తిరిగి వచ్చి, ఆయన స్వరానికి లోబడి, ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్నదంతా అనుసరించి, నీవు నీ పిల్లలతో కలిసి నీ పూర్ణహృదయంతోను నీ పూర్ణప్రాణంతోను నడుచుకుంటే—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా వైపు నీవు తిరిగి
  rationale: שׁוּב యొక్క ప్రాథమిక ‘తిరుగు/తిరిగి రా’ భావాన్ని నిలుపుతూ, עַד సూచించే వ్యక్తివైపు మళ్లడాన్ని ‘వైపు’తో సహజంగా వ్యక్తం చేస్తుంది; ‘పశ్చాత్తాపపడు’ అని సంకుచితం చేయదు.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: ఆయన స్వరానికి లోబడితే
  rationale: שׁמע בקול అనే హీబ్రూ ప్రయోగం కేవలం వినడంకన్నా ఆలకించి విధేయత చూపడాన్ని సూచిస్తుంది. ‘స్వరానికి లోబడు’ ఆ బలాన్నీ మూలంలోని స్వర రూపకాన్నీ నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న వాటన్నిటి ప్రకారం
  rationale: ఆజ్ఞల సంపూర్ణ పరిధికి అనుగుణంగా నడుచుకోవాలనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: אַתָּה וּבָנֶיךָ
  choice: నీవూ నీ పిల్లలూ
  rationale: בנים అక్షరార్థంగా ‘కుమారులు’ అయినా, ఈ నిబంధన సందర్భంలో సంతానాన్ని సమగ్రంగా సూచించగలదు; ‘పిల్లలు’ అనవసరమైన పురుష-పరిమితిని నివారిస్తుంది.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: పూర్ణహృదయంతో, పూర్ణప్రాణంతో
  rationale: ‘నీ హృదయమంతటితో, నీ ప్రాణమంతటితో’ అనే మూలార్థాన్ని గౌరవిస్తూ, సాంప్రదాయ గంభీరతతో కూడిన సహజమైన సంక్షిప్త తెలుగు జంటను ఉపయోగిస్తుంది.
theological_decisions:
- issue: יהוה అనే నిబంధన నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’; ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా మూలంలోని దైవనామాన్ని వ్యక్తినామంగానే నిలుపుతుంది. ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: בָנֶיךָ యొక్క పరిధి
  choice: నీ పిల్లలు
  alternative: నీ కుమారులు
  rationale: హీబ్రూ పురుష బహువచనం ఈ నిబంధన సందర్భంలో సంతానానికి సామాన్య సూచనగా పనిచేయగలదు; అందువల్ల లింగపరంగా అనవసరంగా సంకుచితం చేయలేదు.
- issue: נֶפֶשׁ యొక్క భావపరిధి
  choice: ప్రాణం
  alternative: జీవితం / సమస్త అస్తిత్వం
  rationale: נפש కు ప్రాణం, జీవితం, వ్యక్తి, సమస్త అస్తిత్వం వంటి భావాలు ఉన్నాయి. ‘హృదయం–ప్రాణం’ అనే నిబంధనాత్మక జంటను నిలుపుతూ అర్థాన్ని ఒక్క తాత్త్విక నిర్వచనానికి పరిమితం చేయకుండా ‘ప్రాణం’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యం తదుపరి సందర్భంతో అనుసంధానమైన షరతు/పరిస్థితి భాగంగా ఉన్నందున చివర దీర్ఘ డాష్ ఉంచబడింది. ఏకవచన ‘నీ/నీవు’ మూలంలోని ఇశ్రాయేలు సమూహాన్ని వ్యక్తిగా సంబోధించే రూపాన్ని నిలుపుతుంది.
