revisions:
- from: నీ దేవుడైన యెహోవా వైపు నీవు తిరిగి, ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న వాటన్నిటి ప్రకారం నీవూ నీ పిల్లలూ పూర్ణహృదయంతో, పూర్ణప్రాణంతో ఆయన స్వరానికి లోబడితే[a]—
  to: నీ దేవుడైన యాహ్వే దగ్గరకు నీవు తిరిగి వచ్చి, ఆయన స్వరానికి లోబడి, ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్నదంతా అనుసరించి, నీవు నీ పిల్లలతో కలిసి నీ పూర్ణహృదయంతోను నీ పూర్ణప్రాణంతోను నడుచుకుంటే—
  rationale: మూలంలోని తిరిగివరడం మరియు విధేయత అనే సముచ్చయ క్రమాన్ని “తిరిగి వచ్చి, ... లోబడి”గా నిలిపాం. తదుపరి వచనానికి కొనసాగుతున్న వాక్యసంబంధాన్ని తెలుగు సహజత్వం కోసం “నడుచుకుంటే—” ద్వారా చూపాం; ఈ షరతు మొత్తం క్రమానికే వర్తిస్తుంది, ఒక్క “లోబడడం”కే కాదు. దైవనామాన్ని మూల-ఆడిట్‌కు అనుగుణంగా “యాహ్వే”గా సవరించాం.
