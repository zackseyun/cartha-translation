source:
  edition: WLC
  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: te
  text: ఈ సంగతులన్నీ—నేను నీ ముందుంచిన ఆశీర్వాదమూ శాపమూ—నీకు సంభవించినప్పుడు, నీ దేవుడైన యాహ్వే నిన్ను వెళ్లగొట్టిన జనములన్నిటి మధ్య నీవు వాటిని మనసులో తిరిగి తలచుకుంటే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ హృదయానికి తిరిగి తెచ్చుకుంటే”; అంటే వాటిని జ్ఞాపకం చేసుకొని లోలోపల పరిగణిస్తే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో సంభవించే పరిస్థితిని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: నీ మీదికి వచ్చినప్పుడు
  rationale: సంగతులు ఒకరికి సంభవించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులన్నీ
  rationale: דברים ఇక్కడ కేవలం మాటలను కాక, ముందుగా ప్రకటించిన నిబంధన ఫలితాలన్నిటినీ సూచిస్తుంది.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ఆశీర్వాదమూ శాపమూ
  rationale: పాఠ్యంలో పరస్పర విరుద్ధమైన నిబంధన ఫలితాలను స్పష్టంగా, సమాంతరంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: నేను నీ ముందు ఉంచిన
  rationale: נתן యొక్క ప్రాథమిక అర్థం ‘ఇవ్వడం’ అయినా, ‘ముందు’తో కూడిన ఈ ప్రయోగం ఎంపిక లేదా పరిశీలన కోసం ఎదుట ఉంచడాన్ని సూచిస్తుంది.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: నీవు వాటిని హృదయానికి తెచ్చుకుంటే
  rationale: ‘నీ హృదయానికి తిరిగి తెచ్చు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, జ్ఞాపకం చేసుకొని లోలోపల పరిగణించడమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכָל הַגּוֹיִם
  choice: ఆ జనాలన్నిటి మధ్య
  rationale: చెదరగొట్టబడిన వ్యక్తి విదేశీ జనసమూహాల మధ్య ఉన్న స్థితిని ‘మధ్య’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִדִּיחֲךָ
  choice: నిన్ను ... వెళ్లగొట్టాడో
  rationale: హిఫీల్ క్రియలోని బలవంతంగా దూరం చేయడం లేదా దేశబహిష్కరణ భావాన్ని నిలుపుతుంది; ‘చెదరగొట్టాడు’ అనే ఫలితాన్ని మాత్రమే ముందుకు తేవదు.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామమైన יהוהను లిప్యంతరీకరించి, אֱלֹהֶיךָతో సహజమైన తెలుగు సంబంధంలో ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం నిబంధన దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం పేరుగా పనిచేస్తూ, సాధారణ బిరుదుతో దానిని భర్తీ చేయదు.
- issue: వַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ యొక్క అంతర్భావం
  choice: హృదయానికి తెచ్చుకుంటే
  alternative: జ్ఞాపకం చేసుకుంటే; మనసుకు తీసుకుంటే
  rationale: ఈ వాక్యం కేవలం మానసిక జ్ఞాపకాన్నేనా లేక లోతుగా పరిగణించడాన్నీ సూచిస్తుందా అన్న విస్తృతిని మూలం పూర్తిగా పరిష్కరించదు. హృదయ రూపకాన్ని నిలుపడం ఆ భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన ‘నీ/నీవు’ రూపాలు హీబ్రూ మూలంలోని ఇశ్రాయేలును సమష్టిగా ఉద్దేశించిన పురుష ఏకవచనాన్ని అనుసరిస్తాయి. వాక్యం తరువాతి వచనాల్లో పూర్తయ్యే షరతు నిర్మాణంలో భాగమైనందున ముగింపును ‘తెచ్చుకుంటే’గా ఉంచాం.
