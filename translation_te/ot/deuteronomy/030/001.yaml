- from: ఈ సంగతులన్నీ—నేను నీ ముందు ఉంచిన ఆశీర్వాదమూ శాపమూ—నీ మీదికి వచ్చినప్పుడు, నీ దేవుడైన యెహోవా నిన్ను ఎక్కడికి వెళ్లగొట్టాడో ఆ జనాలన్నిటి మధ్య నీవు వాటిని హృదయానికి తెచ్చుకుంటే,[a]
  to: ఈ సంగతులన్నీ—నేను నీ ముందుంచిన ఆశీర్వాదమూ శాపమూ—నీకు సంభవించినప్పుడు, నీ దేవుడైన యాహ్వే నిన్ను వెళ్లగొట్టిన జనములన్నిటి మధ్య నీవు వాటిని మనసులో తిరిగి తలచుకుంటే,[a]
