source:
  edition: WLC
  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: te
  text: నీవు తిరిగి వస్తావు[a], యాహ్వే స్వరాన్ని వింటావు[b], నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ ఆచరిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెనుదిరుగుతావు”; ఈ సందర్భంలో ఇది నిబంధనవైపు తిరగడం లేదా పశ్చాత్తాపపడడం అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “యాహ్వే స్వరాన్ని వింటావు”; ఈ నుడికారం తరచుగా విధేయత చూపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשׁוּב
  choice: తిరిగి వస్తావు
  rationale: שׁוּב అనే పదంలోని ‘తిరిగి రావడం/వెనుదిరగడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, దానిని ప్రధాన పాఠంలో కేవలం ‘పశ్చాత్తాపపడడం’గా పరిమితం చేయదు.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: యాహ్వే స్వరాన్ని వింటావు
  rationale: హీబ్రూ నుడికారంలోని ‘స్వరాన్ని వినడం’ అనే రూపాన్ని నిలుపుతుంది; ఈ సందర్భంలో వినడం విధేయతను సూచించగలదని పాదటిప్పణి వివరిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: וְעָשִׂיתָ
  choice: ఆచరిస్తావు
  rationale: ఆజ్ఞలను ‘చేయడం’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כָּל מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలన్నిటినీ
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని ‘ఆయన’గా స్పష్టంగా ఉంచి, నిబంధనాత్మక భావం గల ‘ఆజ్ఞలు’ అనే పదాన్ని వాడుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన కృదంతంలోని తక్షణ/కొనసాగుతున్న భావాన్ని, అలాగే ద్వితీయోపదేశకాండలో ప్రాముఖ్యమైన ‘నేడు’ అనే కాలసూచనను నిలుపుతుంది.
- source_word: וְאַתָּה
  choice: నీవు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న, ఉద్ఘాటన కలిగిన కర్తను తెలుగులోనూ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: שׁוּבను స్పష్టంగా ‘పశ్చాత్తాపపడడం’ అని అనువదించాలా?
  choice: తిరిగి వస్తావు
  alternative: పశ్చాత్తాపపడతావు; వెనుదిరుగుతావు
  rationale: సందర్భంలో భౌతిక పునరాగమనం, నిబంధనవైపు తిరగడం, పశ్చాత్తాపం అనే భావాలు కలిసివుండవచ్చు. ప్రధాన పాఠంలో ఒక భావానికే పరిమితం చేయకుండా ఆ ఉద్విగ్నతను నిలుపుతుంది.
- issue: שׁמע בְּקוֹלను నేరుగా ‘లోబడడం’గా అనువదించాలా?
  choice: యాహ్వే స్వరాన్ని వింటావు
  alternative: యాహ్వేకు లోబడతావు
  rationale: ఈ నుడికారం విధేయతను సూచించినా, వెంటనే వచ్చే ఆజ్ఞలను ఆచరించే వాక్యం ఆ భావాన్ని స్పష్టం చేస్తుంది. అందువల్ల మూలంలోని వినికిడి రూపకాన్ని నిలుపడం సముచితం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ద్వితీయోపదేశకాండ నిబంధనాత్మక సందర్భానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుతుంది. చిన్న వాక్య విభజన హీబ్రూ సమాంతర క్రియలను స్పష్టంగా చూపుతుంది.
