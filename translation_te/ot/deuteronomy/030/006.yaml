id: DEU.30.6
reference: Deuteronomy 30:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా నీ హృదయానికీ, నీ సంతతి హృదయానికీ సున్నతి చేస్తాడు[a]. అప్పుడు నీవు నీ పూర్ణహృదయంతోను నీ పూర్ణప్రాణంతోను నీ దేవుడైన యెహోవాను ప్రేమించునట్లు, నీవు జీవించునట్లు ఆయన చేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హృదయానికి సున్నతి చేయడం’ అనేది అంతరంగ మార్పును, నిబంధనపట్ల సంపూర్ణ నిబద్ధతను సూచించే రూపకం.
    reason: cultural_note
  - marker: b
    text: ‘ప్రాణం’ అని అనువదించిన హీబ్రూ పదానికి ‘జీవితం’ లేదా ‘సంపూర్ణ వ్యక్తిత్వం’ అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: సున్నతి చేస్తాడు
  rationale: מול అనే క్రియకు అక్షరార్థంగా ‘సున్నతి చేయడం’ అని అర్థం. ఇక్కడ హృదయం కర్మగా ఉండటంతో ఇది అంతరంగ మార్పును సూచించే రూపకం; నిబంధనకు సంబంధించిన ఆ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం; దానిని బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు / నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబోధనను సహజమైన తెలుగులో నిబంధన సంబంధాన్ని నిలుపుతూ అనువదించాం.
- source_word: לְבָבְךָ
  choice: నీ హృదయం
  rationale: לֵבָב ఇక్కడ సంకల్పం, ప్రేమాభిమానాలు సహా అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘హృదయం’ ఈ విస్తృత భావాన్నీ మూలంలోని రూపకాన్నీ నిలుపుతుంది.
- source_word: לְבַב זַרְעֶךָ
  choice: నీ సంతతి హృదయం
  rationale: זֶרַע సమూహార్థక ఏకవచనంగా సంతానం లేదా వంశస్థులను సూచించగలదు. ‘సంతతి’ ఆ సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְאַהֲבָה
  choice: ప్రేమించేలా
  rationale: ל తో కూడిన క్రియానామం ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది. తెలుగు వాక్యంలో ‘ప్రేమించేలా’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל לְבָבְךָ
  choice: నీ పూర్ణహృదయంతో
  rationale: సంపూర్ణ నిబద్ధతను సూచించే స్థిరమైన నిబంధన భాషను సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: నీ పూర్ణప్రాణంతో
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, సంపూర్ణ వ్యక్తి అనే భావాలను కలిగి ఉంటుంది. ‘ప్రాణం’ తెలుగు బైబిలు వాడుకలో సహజంగా ఉండి, కేవలం విడివడి ఉన్న అమూర్త ‘ఆత్మ’ అనే భావాన్ని బలవంతంగా రుద్దదు.
- source_word: לְמַעַן חַיֶּיךָ
  choice: జీవించేలా
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘జీవించేలా’ మూలంలోని జీవన ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: హృదయ సున్నతి అనే నిబంధన రూపకం
  choice: ‘నీ హృదయానికి ... సున్నతి చేస్తాడు’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: నీ హృదయాన్ని మార్చుతాడు / శుద్ధి చేస్తాడు
  rationale: మూలపాఠ్యం నిబంధన సూచకమైన సున్నతిని అంతరంగ మార్పుతో అనుసంధానిస్తుంది. దాన్ని వివరణాత్మక పదంతో భర్తీ చేస్తే ఆ సంబంధం తగ్గిపోతుంది; అయితే రూపకార్థాన్ని పాదసూచికలో వివరించాం.
- issue: נֶפֶשׁ యొక్క మానవశాస్త్ర సంబంధ పరిధి
  choice: ‘ప్రాణం’ అని అనువదించాం.
  alternative: ఆత్మ / జీవితం / సంపూర్ణ వ్యక్తిత్వం
  rationale: ఈ పదం మొత్తం జీవించే వ్యక్తిని, ప్రాణాన్ని లేదా జీవితాన్ని సూచించగలదు. ‘ప్రాణం’ ఆ విస్తృతిని కొంతవరకు నిలుపుతూ సంపూర్ణ ప్రేమను సూచిస్తుంది; ఒక నిర్దిష్ట ద్వైత మానవశాస్త్రాన్ని పాఠ్యంలోకి తేవదు.
- issue: ప్రేమించడం మరియు జీవించడం మధ్య వాక్యసంబంధం
  choice: రెండింటినీ దేవుడు చేసే హృదయ సున్నతి యొక్క ఉద్దేశం/ఫలితంగా సహజ తెలుగు నిర్మాణంలో కలిపాం.
  alternative: ‘ప్రేమించడానికి ... నీవు జీవించే నిమిత్తం’ అని రెండు వేరు ఉద్దేశ వాక్యాలుగా ఉంచడం
  rationale: హీబ్రూలో לְאַהֲבָה మరియు לְמַעַן రెండూ ఉద్దేశం/ఫలిత భావాన్ని కలిగి ఉన్నాయి. తెలుగు వాక్యం వాటి సంబంధాన్ని స్పష్టంగా చేస్తుంది గాని కారణ-ఫలిత క్రమాన్ని అతిగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని రెండవ పురుష ఏకవచనాన్ని ‘నీ/నీవు’తో నిలిపాం. నిబంధన రూపకాన్ని వివరణతో భర్తీ చేయకుండా ప్రధాన పాఠ్యంలో ఉంచి, అవసరమైన అర్థసహాయాన్ని పాదసూచికలో ఇచ్చాం.
