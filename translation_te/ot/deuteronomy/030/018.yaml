id: DEU.30.18
reference: Deuteronomy 30:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: te
  text: మీరు తప్పక నశిస్తారని ఈ రోజు మీకు ప్రకటిస్తున్నాను[a]. నీవు[c] యొర్దానును దాటి, అక్కడికి ప్రవేశించి దానిని స్వాధీనం చేసుకోవడానికి వెళుతున్న ఆ దేశంలో మీరు దీర్ఘకాలం జీవించరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నశిస్తూ నశిస్తారు”; ఇది నాశనం తప్పక జరుగుతుందని బలంగా చెప్పే నిర్మాణం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “మీ రోజులను పొడిగించుకోరు.” మరో విధంగా, “ఆ దేశంలో మీరు ఎక్కువకాలం జీవించరు.”
    reason: lexical_alternative
  - marker: c
    text: ఈ వాక్యంలో హీబ్రూ మొదట ఇశ్రాయేలీయులను బహువచనంలో సంబోధించి, యొర్దాను దాటే భాగంలో ఇశ్రాయేలును ఒకే ప్రజగా ఏకవచనంలో సంబోధిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: ప్రకటిస్తున్నాను
  rationale: נגד క్రియ యొక్క హిఫీల్ రూపం ‘తెలియజేయడం, ప్రకటించడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలోని గంభీరమైన హెచ్చరిక స్వరాన్ని ‘ప్రకటిస్తున్నాను’ సహజంగా నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: ఒడంబడిక హెచ్చరిక యొక్క తక్షణత్వాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: మీరు తప్పక నశించిపోతారు
  rationale: క్రియావ్యయ సంపూర్ణరూపం మరియు అదే మూలానికి చెందిన సమాపక క్రియ కలిసి నాశనం యొక్క నిశ్చయాన్ని బలపరుస్తాయి. ‘తప్పక’ ఆ ఉద్ఘాటనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: మీరు దీర్ఘకాలం జీవించరు
  rationale: అక్షరార్థంగా ‘మీ రోజులను పొడిగించుకోరు.’ తెలుగులో సహజమైన ఈ రూపం జీవితం ఎక్కువకాలం కొనసాగదనే భావాన్ని నిలుపుతుంది; అక్షరార్థపు రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: עַל הָאֲדָמָה
  choice: ఆ దేశంలో
  rationale: ఇక్కడ אֲדָמָה మట్టిని మాత్రమే కాక, యొర్దాను అవతల ఇశ్రాయేలు స్వాధీనం చేసుకోబోయే వాగ్దాన దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן
  choice: నీవు యొర్దాను దాటి ... స్వాధీనం చేసుకోబోయే
  rationale: ఈ ఉపవాక్యంలో ఉన్న ఏకవచన సంబోధనను ‘నీవు’తో నిలిపి, ఇశ్రాయేలును ఒక సమిష్టి ప్రజగా సంబోధించే మూలభాషా వాక్చాతుర్యాన్ని కాపాడాం.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: గమ్యస్థానాన్ని సూచించే హీబ్రూ అవ్యయాన్ని స్పష్టంగా అనువదిస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోబోయే
  rationale: ירש ఇక్కడ ఆ దేశాన్ని పొందడం, దానిపై అధికారం స్థాపించడం అనే భావంలో ఉంది. స్త్రీలింగ ఏకవచన ప్రత్యయం సూచించే ‘దాన్ని’ అనే కర్మ తెలుగులో ‘ఆ దేశం’తో సహజంగా అంతర్లీనమవుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలుకు బహువచన, ఏకవచన సంబోధనల మార్పు
  choice: మొదటి హెచ్చరికలో బహువచనం ‘మీరు,’ యొర్దాను దాటే ఉపవాక్యంలో ఏకవచనం ‘నీవు’ వాడటం
  alternative: అంతటా ‘మీరు’ అని బహువచనంగా అనువదించడం
  rationale: మూలపాఠం మొదట ఇశ్రాయేలీయులను బహువచనంలో సంబోధించి, తరువాత ఇశ్రాయేలును ఒకే ఒడంబడిక ప్రజగా ఏకవచనంలో సంబోధిస్తుంది. ఈ మార్పును సమతలపరచకుండా పాఠ్యంలోనూ పాదటిప్పణిలోనూ నిలిపాం.
- issue: దేశానికి సంబంధించిన ఒడంబడిక పదజాలం
  choice: הָאֲדָמָהను ‘ఆ దేశం’గా అనువదించడం
  alternative: ‘ఆ నేల’ లేదా ‘ఆ భూమి’
  rationale: ఈ సందర్భంలో సూచన యొర్దాను అవతల స్వాధీనం చేసుకోబోయే నిర్దిష్ట ప్రాంతానికి ఉంది. ‘దేశం’ కథన మరియు ఒడంబడిక సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ఒడంబడిక హెచ్చరికకు తగిన గౌరవప్రదమైన శైలి. ‘నీవు/మీరు’ మార్పు సాధారణ తెలుగులో అసాధారణంగా అనిపించవచ్చు కాబట్టి మూలపాఠంలోని ఉద్దేశపూర్వక సంఖ్యామార్పును [c] పాదటిప్పణి వివరిస్తుంది.
