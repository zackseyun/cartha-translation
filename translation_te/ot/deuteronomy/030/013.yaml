source:
  edition: WLC
  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: te
  text: అది సముద్రానికి ఆవల[a] లేదు; “మన కోసం ఎవరు సముద్రం దాటి అవతలి వైపుకు వెళ్లి, దానిని మనకు తీసుకువచ్చి[b], మనకు దానిని వినిపించి[c], మనం దానిని ఆచరించేలా చేస్తారు?” అని మీరు అనవలసిన అవసరం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సముద్రం అవతలి వైపున.’
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ‘దానిని మన కోసం తీసుకొని.’ సందర్భంలో దానిని సంపాదించి మనకు అందుబాటులోకి తేవడం భావం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘మనకు దానిని వినిపించి.’ ఇది ఎవరైనా మనం వినేలా చేయడాన్ని తెలిపే కారణార్థక రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: సముద్రానికి ఆవల
  rationale: ఈ హీబ్రూ నుడికారం సముద్రం అవతలి వైపున ఉన్న స్థలాన్ని సూచిస్తుంది. ‘సముద్రానికి ఆవల’ సహజమైన తెలుగులో ఆ ప్రాదేశిక భావాన్ని నిలుపుతుంది.
- source_word: הִוא
  choice: అది
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందటి సందర్భంలోని ‘ఆజ్ఞ’ను సూచిస్తుంది; తెలుగులో ‘అది’ సహజంగా ఆ సూచనను కొనసాగిస్తుంది.
- source_word: לֵאמֹר
  choice: అని మీరు అనాల్సిన అవసరం లేదు
  rationale: ఇది ఊహాత్మక అభ్యంతరాన్ని పరిచయం చేస్తుంది. నిషేధ వాక్య నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేయడానికి ఈ రూపం వాడబడింది.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: మన కోసం ఎవరు సముద్రం దాటి అవతలి వైపుకు వెళ్లి
  rationale: ‘మన కోసం’ అనే ప్రయోజన భావాన్నీ, సముద్రం దాటి దాని అవతలి వైపుకు చేరే గమనాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: దాన్ని మనకు తీసుకొచ్చి
  rationale: לקח ప్రాథమికంగా ‘తీసుకొను’ అని అర్థమిచ్చినా, ఇక్కడ దూరంలో ఉన్న ఆజ్ఞను సంపాదించి ప్రజలకు అందుబాటులోకి తేవడం భావం. ‘తీసుకొచ్చి’ ఆ సందర్భార్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: మనం దాన్ని విని ... చేసేలా చేస్తారు
  rationale: హిఫీల్ causative భావాన్ని తెలుగు causative నిర్మాణమైన ‘చేసేలా చేస్తారు’ ద్వారా నిలిపింది; కేవలం ‘ప్రకటిస్తారు’ అని అర్థాన్ని సంకుచితం చేయలేదు.
- source_word: וְנַעֲשֶׂנָּה
  choice: ఆచరించేలా
  rationale: עשה ఇక్కడ ఆజ్ఞను కేవలం ‘చేయడం’ కాక పాటించి అమలు చేయడాన్ని సూచిస్తుంది. ‘ఆచరించు’ ఆధునిక గౌరవప్రదమైన తెలుగులో విధేయత భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘వినిపించు’ అనే causative రూపం మరియు ఆచరణ మధ్య సంబంధం
  choice: ‘మనం దాన్ని విని ఆచరించేలా చేస్తారు’
  alternative: ‘దాన్ని మనకు వినిపిస్తారు, అప్పుడు మనం దాన్ని చేస్తాం’
  rationale: హీబ్రూ వాక్యంలోని causative వినికిడి భావాన్నీ, దాని తరువాత వచ్చే ఆచరణనూ నిలుపుతూ, ఎవరి వ్యాఖ్యానం లేదా ప్రత్యేక బోధ తప్పనిసరి అని పాఠ్యంలో లేని భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ప్రాదేశిక రూపకం, అలంకారప్రశ్న, causative భావం నిలుపబడ్డాయి; విభక్తి-లింగ భేదాన్ని తెలుగులో సహజంగా వ్యక్తం చేశారు.
