  edition: WLC
  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: te
  text: 'ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్నదేమిటంటే: నీ దేవుడైన యహ్వేను ప్రేమించాలి, ఆయన మార్గాల్లో నడవాలి, ఆయన ఆజ్ఞలను, కట్టడాలను, న్యాయవిధులను[a] పాటించాలి; అప్పుడు నీవు జీవించి సంఖ్యలో పెరుగుతావు[b], నీవు దానిని స్వాధీనం చేసుకోవడానికి అక్కడికి ప్రవేశిస్తున్న దేశంలో నీ దేవుడైన యహ్వే నిన్ను ఆశీర్వదిస్తాడు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘న్యాయవిధులు’ అనే పదానికి ‘తీర్పులు’ లేదా ‘నియమాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు జీవించి సంఖ్యలో పెరుగుతావు, నీ దేవుడైన యహ్వే నిన్ను ఆశీర్వదిస్తాడు.’ హెబ్రీ క్రియాక్రమాన్ని ఫలితంగా లేదా వాగ్దానంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘స్వాధీనం చేసుకోవడానికి’ అనే మాటకు, ముఖ్యంగా వాగ్దాన దేశ సందర్భంలో, ‘వారసత్వంగా పొందడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్నదేమిటంటే
  rationale: ముందటి వాక్యంతో ఉన్న సంబంధాన్ని నిలుపుతూ, హెబ్రీ భాగవాచకంలోని తక్షణ ఆజ్ఞ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యహ్వేను ప్రేమించాలి
  rationale: ఉద్దేశం/విషయాన్ని సూచించే క్రియారూపాన్ని తెలుగులో సహజమైన విధ్యర్థక నిర్మాణంతో అందించింది; יהוה అనే వ్యక్తిగత నామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించింది.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ఆయన మార్గాల్లో నడవాలి
  rationale: జీవన ప్రవర్తనను సూచించే హెబ్రీ రూపకాన్ని యథాతథంగా, సహజంగా నిలుపుతుంది.
- source_word: לִשְׁמֹר
  choice: పాటించాలి
  rationale: నిబంధనాత్మక ఆజ్ఞల సందర్భంలో ‘కాపాడాలి’ కంటే విధేయత భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: ఆయన ఆజ్ఞలను, కట్టడలను, న్యాయవిధులను
  rationale: మూడు వేర్వేరు న్యాయపదాల భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతూ గౌరవప్రదమైన సాధారణ తెలుగు వాడింది.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: అప్పుడు నీవు జీవించి విస్తరిస్తావు
  rationale: విధేయత ఫలితాన్ని సహజంగా తెలియజేస్తూ, జీవించడం మరియు సంఖ్యలో పెరగడం అనే రెండు క్రియలను నిలుపుతుంది.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశంలో
  rationale: గమ్యభావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. שָׁמָּה మరియు స్త్రీలింగ ప్రత్యయార్థం తెలుగు సంబంధవాక్య నిర్మాణంలో అంతర్లీనంగా ఉన్నాయి.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది; అందువల్ల వ్యక్తిగత నామాన్ని లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: וְחָיִיתָ וְרָבִיתָ וּבֵרַכְךָ అనే క్రియాక్రమం
  choice: విధేయతకు కలిగే ఫలితం/వాగ్దానంగా అనువాదం
  alternative: ‘నీవు జీవించి విస్తరించాలి; ... ఆశీర్వదించాలి’ అనే ఉద్దేశార్థక పఠనం
  rationale: సందర్భంలో జీవితం, విస్తరణ, ఆశీర్వాదం ఆజ్ఞను అనుసరించే ఫలితాలుగా కనిపిస్తాయి; అయితే హెబ్రీ క్రియాక్రమం ఫలితానికీ ప్రత్యక్ష వాగ్దానానికీ చోటిస్తుంది కాబట్టి పాదసూచికలో ప్రత్యామ్నాయం ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను నిలిపింది. న్యాయపదాల మధ్య భేదాన్ని ఉంచినా అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించింది.
