  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: te
  text: చూడు[a], నేడు నేను నీ ఎదుట జీవాన్ని, మేలును, మరణాన్ని, కీడును[b] ఉంచాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను నీ ఎదుట ఇచ్చాను’ లేదా ‘నేను నీ ఎదుట పెట్టాను.’
    reason: lexical_alternative
  - marker: b
    text: ‘కీడు’ అనే హీబ్రూ పదాన్ని సందర్భానుసారం ‘చెడు,’ ‘హాని,’ లేదా ‘విపత్తు’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది ‘మేలు’కు ప్రత్యక్ష వ్యతిరేకంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: ראה క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం; శ్రోత దృష్టిని నేరుగా ఆకర్షించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: נָתַתִּי
  choice: ఉంచాను
  rationale: נתן కు ‘ఇచ్చు/పెట్టు/ఉంచు’ అనే అర్థాలున్నాయి. ‘నీ ఎదుట’ అనే పదబంధంతో కలిసినప్పుడు ఎంపికలను ముందుంచడాన్ని ‘ఉంచాను’ సహజంగా తెలియజేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: ఎంపిక కోసం ఒకరి ముందు విషయాలను ఉంచడం అనే హీబ్రూ నుడికారాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: కాలసూచక పదానికి సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: הַחַיִּים
  choice: జీవాన్ని
  rationale: రూపరీత్యా బహువచనమైనా חַיִּים ఇక్కడ భావవాచకంగా ‘జీవం’ అని అర్థం; కర్మవిభక్తితో ‘జీవాన్ని’ వాడబడింది.
- source_word: הַטּוֹב
  choice: మేలును
  rationale: טוֹב యొక్క విస్తృతమైన ‘మంచి/మేలు’ భావాన్ని, కీడుతో ఉన్న సమాంతర వ్యతిరేకతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: הַמָּוֶת
  choice: మరణాన్ని
  rationale: జీవానికి ప్రత్యక్ష వ్యతిరేకంగా ఉన్న నామవాచకానికి సరళమైన తెలుగు అనువాదం.
- source_word: הָרָע
  choice: కీడును
  rationale: רַע నైతిక చెడుతోపాటు హాని లేదా విపత్తును కూడా సూచించగలదు. ‘కీడు’ ఈ విస్తృతిని కొంతవరకు నిలుపుతూ ‘మేలు’కు సహజమైన వ్యతిరేక పదంగా పనిచేస్తుంది.
theological_decisions:
- issue: నిబంధన సంబంధమైన వ్యతిరేకతలో הָרָע అనువాదం
  choice: కీడు
  alternative: చెడు; హాని; విపత్తు
  rationale: ఈ వాక్యం జీవం/మేలు, మరణం/కీడు అనే సమగ్ర ఎంపికను చూపుతుంది. ‘కీడు’ నైతిక చెడును మాత్రమే గాని, అనర్థకరమైన పర్యవసానాలను మాత్రమే గాని పరిమితం చేయకుండా హీబ్రూ పదంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని నాలుగు భావాల సమాంతర నిర్మాణాన్ని నిలుపుతూ తెలుగు విభక్తులను సహజంగా ప్రయోగించాం.
