language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי קָר֥וֹב אֵלֶ֛י/ךָ הַ/דָּבָ֖ר מְאֹ֑ד בְּ/פִ֥י/ךָ וּ/בִֽ/לְבָבְ/ךָ֖ לַ/עֲשֹׂתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: te
  text: ఎందుకంటే ఆ వాక్యం నీకు చాలా దగ్గరగా ఉంది[a]; అది నీ నోటిలోను నీ హృదయంలోను ఉంది, నీవు దానిని చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ విషయం,” లేదా “ఆ ఆజ్ఞ.” హీబ్రూ דָּבָר సందర్భానుసారం వాక్యం, విషయం, లేదా ఆజ్ఞను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగులో తార్కిక అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קָרוֹב אֵלֶיךָ
  choice: నీకు ... దగ్గరగా ఉంది
  rationale: సామీప్యాన్ని నేరుగా, సహజమైన తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది.
- source_word: הַדָּבָר
  choice: ఆ వాక్యం
  rationale: ద్వారిమ్ అనే పదానికి మాట, విషయం, ఆజ్ఞ అనే అర్థపరిధి ఉంది. సందర్భంలోని ఆజ్ఞను సూచించినప్పటికీ, మూలంలోని విస్తృత పదప్రయోగాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: מְאֹד
  choice: చాలా
  rationale: సామీప్యాన్ని బలపరిచే క్రియావిశేషణాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בְּפִיךָ
  choice: నీ నోటిలో
  rationale: మూలంలోని శరీరసంబంధమైన వాక్చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּבִלְבָבְךָ
  choice: నీ హృదయంలో
  rationale: అంతరంగం, ఆలోచన, సంకల్పం అనే హీబ్రూ భావపరిధిని పూర్తిగా కుదించకుండా, నోరు–హృదయం సమాంతరతను కాపాడుతుంది.
- source_word: לַעֲשֹׂתוֹ
  choice: నీవు దాన్ని ఆచరించేలా
  rationale: ל ఉపసర్గతో కూడిన క్రియారూపం ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; కేవలం చేయడం కంటే ఆజ్ఞాపాలన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: “వాక్యం” దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో విస్తృతార్థకమైన “వాక్యం” అని అనువదించడం
  alternative: “ఆజ్ఞ” లేదా “విషయం”
  rationale: తక్షణ సందర్భం దేవుని ఆజ్ఞను సూచిస్తున్నా, הַדָּבָר అనే మూలపదం మాట, విషయం, ఆజ్ఞ అనే భావాలను కలిగి ఉంది. అందువల్ల ప్రధాన పాఠం దానిని అవసరానికి మించి సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన శైలిలో ఉంది. ఏకవచన సంబోధనను మూలానికి అనుగుణంగా నిలిపి, “నోరు—హృదయం” అనే సమాంతర చిత్రణను కాపాడింది.
