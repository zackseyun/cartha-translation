revisions:
- from: ఎందుకంటే, ఆ వాక్యం నీకు చాలా దగ్గరగా ఉంది[a]—నీవు దాన్ని ఆచరించేలా అది నీ నోటిలో, నీ హృదయంలో ఉంది.
  to: ఎందుకంటే ఆ వాక్యం నీకు చాలా దగ్గరగా ఉంది[a]; అది నీ నోటిలోను నీ హృదయంలోను ఉంది, నీవు దానిని చేయడానికి.
  rationale: The revision keeps the lexical ambiguity of הַדָּבָר and the concrete mouth–heart imagery, while rendering לַעֲשֹׂתוֹ with the broader, source-faithful “నీవు దానిని చేయడానికి.” It also restores the source’s sequence without introducing doctrinal or interpretive narrowing.
