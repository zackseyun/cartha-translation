- from: అది పరలోకంలో లేదు; కాబట్టి, “మన కోసం పరలోకానికి ఎక్కి వెళ్లి, దాన్ని మన దగ్గరికి తీసుకొచ్చి, మనం దాన్ని ఆచరించేలా మనకు వినిపించేవాడు ఎవరు?” అని మీరు అననక్కర్లేదు.
  to: అది పరలోకంలో[a] లేదు; “మనకోసం పరలోకానికి ఎక్కి వెళ్లి, దాన్ని మనకోసం తీసుకొని, మనం దాన్ని ఆచరించేలా మనకు వినిపించేవాడు ఎవరు?” అని మీరు అనవలసిన అవసరం లేదు.
