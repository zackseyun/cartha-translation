  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: te
  text: అది పరలోకంలో[a] లేదు; “మనకోసం పరలోకానికి ఎక్కి వెళ్లి, దాన్ని మనకోసం తీసుకొని, మనం దాన్ని ఆచరించేలా మనకు వినిపించేవాడు ఎవరు?” అని మీరు అనవలసిన అవసరం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనకోసం పరలోకానికి ఎక్కి, దాన్ని మనకోసం తీసుకొని, మనకు వినిపించి, మనం దాన్ని ఆచరించేలా చేసేవాడు ఎవరు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: పరలోకంలో
  rationale: సందర్భంలో సమీపంగా, అందుబాటులో ఉన్నదానికి విరుద్ధంగా అందనంత ఎత్తున ఉన్న పరలోకాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పరలోకంలో’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הִוא
  choice: అది
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం మునుపటి వచనంలోని ఆజ్ఞను సూచిస్తుంది; తెలుగులో దానికి సహజమైన నిర్జీవ ఏకవచన రూపం ‘అది’.
- source_word: לֵאמֹר
  choice: అని మీరు అననక్కర్లేదు
  rationale: ఇది ఊహాత్మక అభ్యంతరంలోని మాటలను పరిచయం చేస్తుంది. హెబ్రీ వాక్య నిర్మాణంలోని ‘అలా చెప్పడానికి కాదు’ అనే భావాన్ని తెలుగులో సహజంగా ‘అని మీరు అననక్కర్లేదు’ అని వ్యక్తం చేసింది.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: మన కోసం ... ఎక్కి వెళ్లి ... ఎవరు?
  rationale: עלה లోని పైకి వెళ్లే భావాన్ని ‘ఎక్కి వెళ్లి’ నిలుపుతుంది; לָנוּ లోని ప్రయోజనార్థక భావాన్ని ‘మన కోసం’ తెలియజేస్తుంది.
- source_word: הַשָּׁמַיְמָה
  choice: పరలోకానికి
  rationale: దిశను సూచించే హెబ్రీ ప్రత్యయం పరలోకం వైపు కదలికను తెలియజేస్తుంది; తెలుగులో ‘పరలోకానికి’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: దాన్ని మన దగ్గరికి తీసుకొచ్చి
  rationale: לקח ప్రాథమికంగా ‘తీసుకోవడం’; ఇక్కడ పరలోకం నుంచి ప్రజల కోసం ఆజ్ఞను సంపాదించి తీసుకురావడం భావం. ‘మన దగ్గరికి తీసుకొచ్చి’ గమ్యాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: మనకు వినిపించి
  rationale: שמע హిఫీల్ రూపంలోని కారణార్థకమైన ‘మనకు వినేలా చేయడం’ భావాన్ని ‘మనకు వినిపించి’ సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: וְנַעֲשֶׂנָּה
  choice: మనం దాన్ని ఆచరించేలా
  rationale: עשה ఇక్కడ ఆజ్ఞను కేవలం చేయడం కాక పాటించడం/ఆచరించడం సూచిస్తుంది. చివరి ఉద్దేశ్య భావాన్ని ‘ఆచరించేలా’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పరలోకం’ అనే పదానికి దైవ నివాసం అనే భావాన్ని ప్రత్యేకంగా చేర్చాలా?
  choice: పరలోకంలో / పరలోకానికి
  alternative: ఆకాశంలో / ఆకాశానికి
  rationale: సందర్భం అందనంత దూరాన్ని సూచిస్తున్నప్పటికీ, మూలపదం ‘ఆకాశాలు/పరలోకం’ అనే భావవ్యాప్తిని కలిగి ఉంది. ‘పరలోకం’ గంభీరతను, సందర్భంలోని పై లోక భావాన్ని నిలుపుతుంది; దైవ నివాసం గురించి అదనపు సిద్ధాంత వివరణను వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర వచనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని ప్రశ్నా నిర్మాణం మరియు ‘వినిపించడం—ఆచరించడం’ సంబంధం నిలుపబడ్డాయి.
