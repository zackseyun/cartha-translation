source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీ చేతిపనులన్నిటిలోనూ, నీ గర్భఫలంలోనూ, నీ పశువుల సంతానంలోనూ, నీ నేల పంటలోనూ నీకు సమృద్ధి కలిగిస్తాడు[a]—నీ మేలు కోసమే. యాహ్వే నీ పితరుల విషయంలో సంతోషించినట్లే[b], మళ్లీ నీ విషయంలో నీ మేలు కోసం సంతోషిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీకు విస్తారంగా ఇస్తాడు’ లేదా ‘నిన్ను వర్ధిల్లజేస్తాడు’; హీబ్రూ క్రియ సమృద్ధి లేదా మిగులు కలిగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పితరులు’ అంటే ఇశ్రాయేలు పూర్వీకులు; ఈ పదం ప్రత్యేకంగా పితృపురుషులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: నీకు సమృద్ధి కలిగిస్తాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే మిగులు లేదా సమృద్ధి కలిగించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: నీ చేతిపనులన్నిటిలోనూ
  rationale: హీబ్రూ ‘నీ చేతి పని’ అనే స్పష్టమైన నుడికారాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు బహువచన భావంతో ఇచ్చాం.
- source_word: בִּפְרִי בִטְנְךָ
  choice: నీ గర్భఫలంలోనూ
  rationale: సంతానాన్ని సూచించే మూలభాషా రూపకాన్ని, దాని నిబంధనాత్మక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: בְהֶמְתְּךָ
  choice: నీ పశువుల సంతానంలోనూ
  rationale: పెంపుడు పశువులను విస్తృతంగా సూచిస్తూ, ‘ఫలం’ అనే భావం సందర్భంలో వాటి పెరుగుదలను సహజంగా తెలియజేస్తుంది.
- source_word: אַדְמָתְךָ
  choice: నీ నేల పంటలోనూ
  rationale: సాగుచేసే నేల మరియు దాని దిగుబడి అనే వ్యవసాయ భావాన్ని ఆధునిక తెలుగు పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: לְטוֹבָה / לְטוֹב
  choice: నీ మేలు కోసం
  rationale: ప్రయోజనకరమైన ఫలితాన్ని సూచించే రెండు హీబ్రూ పదబంధాలను స్పష్టంగా, ఒకే విధంగా అనువదిస్తుంది.
- source_word: יָשׁוּב ... לָשׂוּשׂ
  choice: మళ్లీ ... సంతోషిస్తాడు
  rationale: ‘తిరిగి సంతోషించడం’ అనే హీబ్రూ నిర్మాణం ఇక్కడ చర్య పునరావృతిని సూచిస్తుంది; తెలుగులో ‘మళ్లీ’ సహజమైన సమానం.
- source_word: לָשׂוּשׂ עָלֶיךָ
  choice: నిన్ను చూసి ... సంతోషిస్తాడు
  rationale: వ్యక్తిపై ఆనందించడం అనే సంబంధాత్మక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరులను
  rationale: పూర్వీకులను సూచించే పురుషలింగ హీబ్రూ పదాన్ని, బైబిలు సందర్భంలో సహజమైన ‘పితరులు’తో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: אֲבֹתֶיךָ లోని లింగసూచన
  choice: నీ పితరులను
  alternative: నీ పూర్వీకులను
  rationale: మూలపదంలోని పురుషలింగ రూపాన్ని మరియు ఇశ్రాయేలు పితరుల వైపు ఉండగల సూచనను ప్రధాన పాఠ్యంలో నిలిపాం; అయితే సందర్భంలో ఇది పూర్వీకులను విస్తృతంగా సూచించవచ్చు.
- issue: దేవుడు ‘సంతోషించడం’ అనే మానవరూప భాష
  choice: సంతోషిస్తాడు
  alternative: ఆనందిస్తాడు
  rationale: మూలంలోని שׂוּשׂ క్రియను దాని వ్యక్తిగత, నిబంధనాత్మక తీవ్రతతోనే ఉంచి, దైవభావాన్ని సిద్ధాంతపరంగా పలుచన చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సమృద్ధి జాబితా, గర్భఫలం అనే రూపకం, దేవుడు తన ప్రజలను చూసి సంతోషించడం అనే భావం నిలుపబడ్డాయి. ఏకవచన ‘నీ’ ఈ వచనంలోని హీబ్రూ సంబోధనకు అనుగుణం.
