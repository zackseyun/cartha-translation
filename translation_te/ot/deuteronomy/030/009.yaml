revisions:
- from: నీ దేవుడైన యెహోవా నీ మేలు కోసం నీ చేతిపనులన్నిటిలోనూ[a], నీ గర్భఫలంలోనూ, నీ పశువుల సంతానంలోనూ, నీ నేల పంటలోనూ నీకు సమృద్ధి కలిగిస్తాడు. ఎందుకంటే యెహోవా నీ పితరులను చూసి సంతోషించినట్లే, మళ్లీ నిన్ను చూసి నీ మేలు కోసం సంతోషిస్తాడు.[b]
  to: నీ దేవుడైన యాహ్వే నీ చేతిపనులన్నిటిలోనూ, నీ గర్భఫలంలోనూ, నీ పశువుల సంతానంలోనూ, నీ నేల పంటలోనూ నీకు సమృద్ధి కలిగిస్తాడు[a]—నీ మేలు కోసమే. యాహ్వే నీ పితరుల విషయంలో సంతోషించినట్లే[b], మళ్లీ నీ విషయంలో నీ మేలు కోసం సంతోషిస్తాడు.
  rationale: The revision aligns the divine-name rendering with the project policy, removes the added ‘seeing’ nuance, places ‘for good’ with the full preceding blessing list, and relocates the ancestral-term footnote anchor to its referent. It retains the source’s singular address, agricultural blessing formula, and repeated beneficial purpose without adding doctrinal interpretation.
