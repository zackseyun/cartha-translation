  source_fidelity: ముసాయిదా శాపాలను శత్రువులపై ఉంచడం అనే ప్రధాన భావాన్ని తెలియజేస్తున్నా, హెబ్రీలోని రెండు సమాంతర వర్గాలు—“నీ శత్రువులు” మరియు “నిన్ను ద్వేషించేవారు”—ఒకే వర్గంగా కలిసిపోయాయి. అలాగే యెహోవా అనే దైవనామానికి POB audit trail లో నిర్ణయించిన “Yahweh” రూపాన్ని తెలుగు లిప్యంతరీకరణలో నిలపడం అవసరం.
  naturalness: “మీదికి రప్పిస్తాడు” అర్థవంతమే, కానీ נתן + על నిర్మాణానికి “మీద వేస్తాడు” మరింత నేరుగా, సహజంగా ఉంటుంది. “నిన్ను ద్వేషించి వెంబడించినవారి మీదా” అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
