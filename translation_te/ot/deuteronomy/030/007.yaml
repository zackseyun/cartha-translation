id: DEU.30.7
reference: Deuteronomy 30:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే ఈ శాపాలన్నిటినీ నీ శత్రువుల మీదా, నిన్ను ద్వేషించి వెంబడించినవారి మీదా వేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ప్రమాణాలన్నిటినీ”; ద్వితీయోపదేశకాండంలో ఈ పదం సాధారణంగా నిబంధనా శాపాలను, అంటే నిబంధనను ఉల్లంఘించినప్పుడు విధించే శిక్షాత్మక ఆంక్షలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: రప్పిస్తాడు
  rationale: נתן యొక్క ప్రాథమిక అర్థం ‘ఇవ్వడం/ఉంచడం.’ అయితే శాపాలను వ్యక్తుల ‘మీద’ ఉంచే ఈ సందర్భంలో, అవి వారిపై పడేలా చేయడాన్ని సహజమైన ఆధునిక తెలుగులో ‘మీదికి రప్పిస్తాడు’ అని వ్యక్తపరచడం భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని సహజంగా ‘నీ దేవుడు’ అని అనువదించాం; యెహోవాతో కలిపి ‘నీ దేవుడైన యెహోవా’ అని ఇచ్చాం.
- source_word: כָּל הָאָלות הָאֵלֶּה
  choice: ఈ శాపాలన్నిటినీ
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాపరమైన సందర్భంలో אָלָה నిబంధన ఉల్లంఘనకు సంబంధించిన శాపాలు లేదా శిక్షాత్మక ఆంక్షలను సూచిస్తుంది. ‘ఈ శాపాలన్నిటినీ’ తక్షణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל אֹיְבֶיךָ וְעַל שֹׂנְאֶיךָ
  choice: నిన్ను ద్వేషించి ... నీ శత్రువుల మీదికి
  rationale: ‘నీ శత్రువుల మీద, నిన్ను ద్వేషించేవారి మీద’ అనే హెబ్రీ సమాంతర నిర్మాణాన్ని తెలుగులో ఒకే సంబంధిత వర్గాన్ని వివరించే సహజ వాక్యనిర్మాణంగా ఇచ్చాం; రెండు వర్ణనలూ నిలిచాయి.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: నిన్ను తరిమిన
  rationale: רדף అంటే తరుమడం, వెంబడించడం, హింసించడం. కార్య స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా శత్రుత్వపూర్వక వెంబడింపును ‘తరిమిన’ తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: אָלות యొక్క నిబంధనాపరమైన అర్థం
  choice: శాపాలు
  alternative: ప్రమాణాలు
  rationale: ఇక్కడ మునుపు ప్రకటించబడిన నిబంధనా శిక్షలే ఉద్దేశించబడ్డాయి. అయినప్పటికీ పదానికి ‘ప్రమాణాలు’ అనే విస్తృత ప్రత్యామ్నాయ అర్థం ఉన్నందున దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. సంబోధన ఏకవచనాన్ని ‘నీ/నిన్ను’తో నిలిపాం. హెబ్రీ వాక్యంలోని శత్రువులు, ద్వేషించేవారు, తరిమినవారు అనే సంబంధాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
