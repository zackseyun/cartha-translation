revisions:
- from: నీ దేవుడైన యెహోవాను ప్రేమిస్తూ, ఆయన మాట వింటూ[a], ఆయనను హత్తుకొని ఉండాలి[b]. ఎందుకంటే ఆయనే నీ జీవం, నీ ఆయుష్షు. అప్పుడు యెహోవా నీ పితరులైన అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు ఇస్తానని ప్రమాణం చేసిన దేశంలో నీవు నివసిస్తావు[c].
  to: నీ దేవుడైన యెహోవాను ప్రేమించడం, ఆయన స్వరం వినడం[a], ఆయనను గట్టిగా అంటిపెట్టుకొని ఉండడం[b] ద్వారా; ఎందుకంటే ఆయనే నీ జీవం, నీ దినాల నిడివి. యెహోవా నీ పితరులకు[c]—అబ్రాహాము, ఇస్సాకు, యాకోబులకు—ఇస్తానని ప్రమాణం చేసిన దేశంలో నీవు నివసించడానికి.
  rationale: మూల హీబ్రూ వ్యాకరణంలోని సమాంతర క్రియానామాలను, דבק యొక్క నిబద్ధత భావాన్ని, మరియు లָשֶׁבֶת యొక్క క్రియానామ సంబంధాన్ని మరింత నికరంగా ప్రతిబింబించేలా పాఠం సవరించబడింది. పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదాల వద్దే ఉంచబడ్డాయి.
