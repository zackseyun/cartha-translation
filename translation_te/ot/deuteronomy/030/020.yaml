source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֥עַ בְּ/קֹל֖/וֹ וּ/לְ/דָבְקָה ב֑/וֹ כִּ֣י ה֤וּא חַיֶּ֨י/ךָ֙ וְ/אֹ֣רֶךְ יָמֶ֔י/ךָ לָ/שֶׁ֣בֶת עַל הָ/אֲדָמָ֗ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ/תֵ֥ת לָ/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: te
  text: నీ దేవుడైన యెహోవాను ప్రేమించడం, ఆయన స్వరం వినడం[a], ఆయనను గట్టిగా అంటిపెట్టుకొని ఉండడం[b] ద్వారా; ఎందుకంటే ఆయనే నీ జీవం, నీ దినాల నిడివి. యెహోవా నీ పితరులకు[c]—అబ్రాహాము, ఇస్సాకు, యాకోబులకు—ఇస్తానని ప్రమాణం చేసిన దేశంలో నీవు నివసించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన స్వరానికి విధేయత చూపడం.’ హీబ్రూలో ‘ఆయన స్వరం వినడం’ అనే ప్రయోగం తరచుగా విని ఆచరించడం లేదా విధేయత చూపడం అనే భావాన్నీ కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను విడువకుండా అంటిపెట్టుకొని ఉండడం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నీ పూర్వీకులకు.’ హీబ్రూలో ‘పితరులు’ అని ఉంది; వెంటనే అబ్రాహాము, ఇస్సాకు, యాకోబుల పేర్లు వస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాను ప్రేమిస్తూ
  rationale: లְ ఉపసర్గతో ఉన్న క్రియానామం ముందు వచనంలోని ‘జీవాన్ని ఎంచుకో’ అనే పిలుపును ఎలా ఆచరించాలో వివరిస్తుంది. తెలుగులో ‘ప్రేమిస్తూ’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది; దేవుని నామాన్ని ‘యెహోవా’గా నిలిపింది.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: ఆయన మాట వింటూ
  rationale: హీబ్రూ ప్రయోగం అక్షరార్థంగా స్వరం వినడాన్ని సూచించినా, సందర్భంలో శ్రద్ధగా విని విధేయత చూపడం కూడా అంతర్భూతం. ప్రధాన పాఠంలో సహజమైన రూపాన్ని ఉంచి, విధేయత భావాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וּלְדָבְקָה בוֹ
  choice: ఆయనను హత్తుకొని ఉండాలి
  rationale: דבק సన్నిహితంగా అంటుకొని ఉండడం, విడువకుండా నిబద్ధంగా ఉండడం అనే భావాలను కలిగిస్తుంది. ‘హత్తుకొని ఉండడం’ ఆ బలమైన అనుబంధాన్ని ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּי הוּא חַיֶּיךָ וְאֹרֶךְ יָמֶיךָ
  choice: ఎందుకంటే ఆయనే నీ జీవం, నీ ఆయుష్షు
  rationale: הוּאకు అత్యంత సహజమైన పూర్వపదం యెహోవా; అందువల్ల వ్యక్తిగత సూచనను నిలిపింది. ‘నీ ఆయుష్షు’ అనేది ‘నీ దినాల పొడవు’ అనే హీబ్రూ నానుడికి సహజమైన తెలుగు సమానం.
- source_word: לָשֶׁבֶת עַל־הָאֲדָמָה
  choice: దేశంలో నీవు నివసిస్తావు
  rationale: అబ్రాహాము, ఇస్సాకు, యాకోబులకు వాగ్దానం చేసిన భూభాగమే ఉద్దేశం కాబట్టి אֲדָמָהను ‘దేశం’గా అనువదించింది. ముందు ఉన్న జీవం, ఆయుష్షుతో అనుసంధానమైన ఫలితాన్ని తెలుగులో సహజ వాక్యంగా తెలిపింది.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה ... לָתֵת לָהֶם
  choice: యెహోవా ... ఇస్తానని ప్రమాణం చేసిన
  rationale: נשבעలోని ప్రమాణ భావాన్ని స్పష్టంగా నిలిపింది. לָתֵת לָהֶםను తెలుగులో సహజమైన ప్రత్యక్ష ఉక్తి భావంతో ‘ఇస్తానని’గా వ్యక్తం చేసింది.
- source_word: לַאֲבֹתֶיךָ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: నీ పితరులైన అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: వెంటనే ముగ్గురు పురుష పూర్వీకుల పేర్లు రావడం వల్ల ‘పితరులు’ మూలంలోని పుంలింగ నిర్దిష్టతను, వాగ్దాన చరిత్రను కాపాడుతుంది.
theological_decisions:
- issue: ‘ఆయనే నీ జీవం’లో సర్వనామ సూచన
  choice: ‘ఆయనే’ యెహోవాను సూచిస్తుంది.
  alternative: ముందు చెప్పిన ప్రేమ, విధేయత, నిబద్ధతతో కూడిన జీవనమార్గాన్ని సమష్టిగా సూచించవచ్చు.
  rationale: వ్యాకరణపరంగా సమీపమైన, ప్రధానమైన పూర్వపదం ‘నీ దేవుడైన యెహోవా’; కాబట్టి వ్యక్తిగత సూచనే బలమైనది. అయినా ఒడంబడిక విధేయత జీవానికి సంబంధించినదనే సందర్భార్థాన్ని అనువాదం నిరాకరించదు.
- issue: వాగ్దాన దేశంలో నివాసం—ఉద్దేశమా, ఫలితమా
  choice: ముందు చెప్పిన జీవం, ఆయుష్షు వల్ల కలిగే ఫలితంగా సహజ తెలుగులో వ్యక్తం చేసింది.
  alternative: ‘నివసించడానికి’ అని కచ్చితమైన ఉద్దేశార్థక క్రియానామంగా అనువదించడం.
  rationale: לָשֶׁבֶתను ఉద్దేశం లేదా ఫలితం రెండింటి ఛాయలతో గ్రహించవచ్చు. తెలుగు ప్రధాన పాఠంలో ‘అప్పుడు ... నివసిస్తావు’ సందర్భ ప్రవాహాన్ని స్పష్టంగా ఉంచుతూనే మూలంలోని సంబంధాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఏకవచన సంబోధనను ఉపయోగించింది. ‘యెహోవా,’ ‘పితరులు,’ ‘ప్రమాణం,’ ‘దేశం’ వంటి పదాలు ఒడంబడిక సందర్భ గాంభీర్యాన్ని నిలుపుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకుడికి సులభంగా ఉండేలా చేసింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో వరుసగా ఉన్నాయి.
