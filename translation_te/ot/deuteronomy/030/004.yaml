source:
  edition: WLC
  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: te
  text: నీ ప్రజలలో చెదరగొట్టబడినవారు[a] ఆకాశపు అంచున[b] ఉన్నా, అక్కడి నుండి నీ దేవుడైన యాహ్వే నిన్ను సమకూర్చుతాడు; అక్కడి నుండి ఆయన నిన్ను తీసుకుంటాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తరిమివేయబడినవారు’ లేదా ‘బహిష్కరించబడినవారు.’ హీబ్రూ పదం తరిమివేయబడి లేదా చెదరగొట్టబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆకాశపు అంచు’ అనేది సాధ్యమైనంత అత్యంత దూరమైన స్థలాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘నిన్ను తీసుకువస్తాడు.’ హీబ్రూ క్రియకు మరింత అక్షరార్థంగా ‘నిన్ను తీసుకుంటాడు’ అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִהְיֶה
  choice: ఉన్నా
  rationale: హీబ్రూ షరతును తెలుగులో సహజంగా వ్యక్తపరుస్తూ, సందర్భంలో ఉన్న ‘అంత దూరంలో ఉన్నప్పటికీ’ అనే భావాన్ని అతిగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: נִדַּחֲךָ
  choice: నీవారిలో తరిమివేయబడినవారు
  rationale: נדח అనే ధాతువులోని తరిమివేయబడటం లేదా చెదరగొట్టబడటం అనే నిష్క్రియార్థాన్ని నిలుపుతుంది. రెండవ పురుష ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: ఆకాశపు అంచున
  rationale: మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ, అత్యంత దూరమైన స్థలాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచే
  rationale: పునరుద్ధరణ ఎంత దూరం నుంచైనా జరుగుతుందనే ఉద్ఘాటనను తెలియజేయడానికి మూలంలోని పునరుక్తిని రెండుసార్లూ నిలిపింది.
- source_word: יְקַבֶּצְךָ
  choice: నిన్ను సమకూరుస్తాడు
  rationale: קבץ పియేల్ రూపంలోని కూడగట్టడం అనే అర్థాన్ని వ్యక్తపరుస్తుంది; మూలంలో స్పష్టంగా లేని ‘తిరిగి’ అనే పదాన్ని జోడించదు.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, అֱלֹהֶיךָలోని నిబంధనాత్మక సంబంధాన్ని ‘నీ దేవుడు’గా నిలుపుతుంది.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: అక్కడి నుంచే ఆయన నిన్ను తీసుకువస్తాడు
  rationale: לקח ప్రాథమికంగా ‘తీసుకోవడం’ అని అర్థమిచ్చినా, ఇక్కడ దూరప్రాంతం నుంచి వ్యక్తిని తనవద్దకు చేర్చే సందర్భంలో ‘తీసుకువస్తాడు’ సహజంగా ఉంటుంది; మరింత అక్షరార్థాన్ని పాదసూచికలో సూచించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: వచనంలో వ్యక్తిగత నిబంధన నామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో మార్చకుండా, మూల ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించింది.
- issue: ఇశ్రాయేలుకు సమష్టి ఏకవచన సంబోధన
  choice: ‘నీ/నిన్ను’ అనే ఏకవచన సంబోధనను నిలుపుతూ, చెదరిపోయిన సభ్యులను బహువచనంగా వ్యక్తపరచడం
  alternative: సంబోధన అంతటినీ బహువచనంగా మార్చడం
  rationale: హీబ్రూ ఇశ్రాయేలును ఒక సమష్టిగా ఏకవచనంలో సంబోధిస్తూ, దాని చెదరిపోయిన సభ్యులను సూచిస్తుంది. ఈ ఉద్వేగాన్ని తెలుగు పాఠ్యంలో సాధ్యమైనంతవరకు నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘అక్కడి నుంచి’ అనే పునరుక్తిని ఉద్ఘాటన కోసం నిలిపింది; ‘ఆకాశపు అంచు’ అనే బైబిలీయ దృశ్యరూపాన్ని వివరణాత్మక పాదసూచికతో సంరక్షించింది.
