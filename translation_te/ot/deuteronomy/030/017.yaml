  verdict: revise
  source_fidelity: 'The draft generally follows the Hebrew sequence and preserves the passive sense of וְנִדַּחְתָּ. However, the conditional construction is incomplete in idiomatic Telugu: “కాని” is used without “అయితే,” and several nonfinite forms make the conditional progression less clear.'
  naturalness: “నీ హృదయం పక్కకు తిరిగి” is awkward in modern standard Telugu, and “నీవు వినకుండా” can sound like a mere accompanying action rather than refusal to heed. A finite conditional formulation is clearer and more natural.
  terminology: “ఇతర దేవుళ్లకు,” “నమస్కరించి,” and “వారిని సేవిస్తే” appropriately render the idolatrous actions without interpretive expansion. “తప్పుదారి పట్టించబడి” is a natural passive rendering of the Niphal verb.
  issues:
  - severity: medium
    issue: The conditional opener is grammatically and stylistically incomplete.
    rationale: The lexical decision specifies “కాని … అయితే,” but the text has only “కాని.” In Telugu, “అయితే” is needed to make the contrary conditional natural and explicit.
  - severity: medium
    issue: The expression for the heart's turning away is unnatural.
    rationale: “పక్కకు తిరిగి” is a literal-sounding phrase. “నీ హృదయం మళ్లిపోతే” naturally conveys inward turning aside while retaining the source's non-specific direction.
  - severity: low
