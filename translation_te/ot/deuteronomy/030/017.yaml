  edition: WLC
  text: וְ/אִם יִפְנֶ֥ה לְבָבְ/ךָ֖ וְ/לֹ֣א תִשְׁמָ֑ע וְ/נִדַּחְתָּ֗ וְ/הִֽשְׁתַּחֲוִ֛יתָ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/עֲבַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: te
  text: అయితే నీ హృదయం మళ్లిపోయి[a], నీవు వినకపోయి[b], తప్పుదారి పట్టించబడి, ఇతర దేవుళ్లకు నమస్కరించి వారిని సేవిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తిరిగిపోతే.” హీబ్రూ క్రియ హృదయం తన సరైన విధేయత నుండి మళ్లిపోవడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “వినడం” అనే మాటకు నిబంధన సందర్భంలో “విధేయత చూపడం” లేదా “ఆజ్ఞను పాటించడం” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని … అయితే
  rationale: ముందున్న అనుకూల పిలుపుకు విరుద్ధమైన షరతును సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూ సంధిని సందర్భానుసారంగా ప్రతికూల మలుపుగా వ్యక్తం చేస్తుంది.
- source_word: יִפְנֶה לְבָבְךָ
  choice: నీ హృదయం పక్కకు తిరిగి
  rationale: פנה యొక్క ‘తిరుగు’ భావాన్నీ, యెహోవాపట్ల విధేయత నుంచి అంతరంగం తొలగిపోవడాన్నీ అతిగా వివరణ జోడించకుండా తెలియజేస్తుంది.
- source_word: וְלֹא תִשְׁמָע
  choice: నీవు వినకుండా
  rationale: שׁמע లోని వినడం అనే రూపకాన్ని నిలుపుతుంది; నిబంధన సందర్భంలో ‘విధేయత చూపడం’ అనే భావం కూడా ఉండవచ్చని పాదటిప్పణి సూచిస్తుంది.
- source_word: וְנִדַּחְתָּ
  choice: దారి తప్పించబడి
  rationale: נדח నిఫల్ రూపంలోని బయటికి నెట్టబడడం లేదా పెడదారి పట్టించబడడం అనే నిష్క్రియ భావాన్ని, విగ్రహారాధన సందర్భంలోని తప్పుదారి భావంతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: వంగి నమస్కరించి
  rationale: పదం సూచించే శరీరాన్ని వంచి సాష్టాంగపడే చర్యను నిలుపుతూ, ఆరాధనా సందర్భంలో సహజంగా ఉంటుంది.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లకు
  rationale: ద్వితీయోపదేశకాండలో ప్రత్యర్థి దేవతలను సూచించే స్థిరమైన హీబ్రూ పదబంధానికి సూటి అనువాదం.
- source_word: וַעֲבַדְתָּם
  choice: వారిని సేవిస్తే
  rationale: עבד యొక్క ‘సేవించు’ అనే మూల భావాన్ని నిలుపుతుంది; దేవతల సందర్భం దీనిలోని ఆరాధనా సేవ భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: విశ్వాసభ్రష్టత దశల వరుస
  choice: హృదయం పక్కకు తిరగడం, వినకపోవడం, తప్పుదారి పట్టించబడడం, ఇతర దేవుళ్లకు వంగి నమస్కరించడం, వారిని సేవించడం అనే వరుసను నిలిపాం.
  alternative: ‘దారి తప్పించబడి’ని మరింత కర్తృత్వంతో ‘నిన్ను నీవు తప్పుదారి పట్టించుకొని’ అని అనువదించడం; లేదా ‘వినకుండా’ స్థానంలో ‘విధేయత చూపకుండా’ అని పెట్టడం.
  rationale: హీబ్రూ వాక్యం నిబంధన అవిశ్వాసాన్ని క్రమంగా వర్ణిస్తుంది. నిష్క్రియ రూపాన్నీ שׁמע లోని వినడం/విధేయత చూపడం అనే ఉద్రిక్తతనూ మౌలిక పాఠానికి దగ్గరగా నిలిపి, అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. షరతు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచాం.
