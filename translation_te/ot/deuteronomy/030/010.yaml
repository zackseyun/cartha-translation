id: DEU.30.10
reference: Deuteronomy 30:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר מִצְוֺתָי/ו֙ וְ/חֻקֹּתָ֔י/ו הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: te
  text: నీవు నీ దేవుడైన యెహోవా మాటకు లోబడి,[a] ఈ ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన ఆయన ఆజ్ఞలనూ శాసనాలనూ పాటిస్తే, నీ హృదయమంతటితోను నీ ప్రాణమంతటితోను నీ దేవుడైన యెహోవా వద్దకు తిరిగి వస్తే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, “యెహోవా స్వరాన్ని విని”; ఈ ప్రయోగానికి ఆయన చెప్పినదాన్ని ఆలకించి విధేయత చూపడం అనే అర్థం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “తిరిగి వస్తే” అనే పదబంధాన్ని “తిరిగితే” లేదా సందర్భానుసారం “పశ్చాత్తాపంతో తిరిగితే” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: …పాటిస్తే / …తిరిగితే
  rationale: ఇక్కడ రెండు చోట్లా షరతును సూచిస్తుంది; తెలుగులో క్రియాంతంలోని ‘-తే’ రూపం సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: תִשְׁמַע בְּקוֹל
  choice: మాటకు లోబడి
  rationale: ఈ హెబ్రీయ ఇడియం కేవలం వినడాన్ని కాక, చెప్పినదాన్ని ఆలకించి విధేయత చూపడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించబడింది.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: ఆయన ఆజ్ఞలను, శాసనాలను పాటిస్తే
  rationale: ‘పాటించడం’ విధేయత యొక్క విషయాన్ని సహజమైన తెలుగులో తెలుపుతుంది; రెండు న్యాయపదాల మధ్య ఉన్న భేదాన్ని ‘ఆజ్ఞలు’, ‘శాసనాలు’గా నిలుపుతుంది.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: ఈ ధర్మశాస్త్ర గ్రంథంలో
  rationale: ఒడంబడిక పత్రాన్ని సూచించే పదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: כִּי תָשׁוּב אֶל
  choice: …వైపు తిరిగితే
  rationale: שׁוּב యొక్క మూల ‘తిరుగు/తిరిగి రా’ రూపకాన్ని నిలుపుతూ, పశ్చాత్తాపమనే భావాన్ని వ్యాఖ్యానాత్మకంగా మాత్రమే నిర్ధారించకుండా ఉంచుతుంది.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: నీ పూర్ణహృదయంతో, నీ పూర్ణప్రాణంతో
  rationale: వ్యక్తి అంతరంగం, సంకల్పం, సమస్త జీవాన్ని సూచించే హెబ్రీయ సమాంతర ప్రయోగాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ఒడంబడిక సందర్భంలోని שׁוּב అర్థం
  choice: వైపు తిరిగితే
  alternative: తిరిగి వస్తే / పశ్చాత్తాపపడితే
  rationale: ‘తిరుగు’ అనే మూల రూపకాన్నీ, దేవుని వద్దకు తిరిగి రావడం అనే ఒడంబడిక భావాన్నీ నిలుపుతుంది; ‘పశ్చాత్తాపపడితే’ అని అనువదించి భావాన్ని ముందే పరిష్కరించదు.
- issue: దైవనామం יהוה ప్రతిపాదన
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ఈ వచనం ముందున్న వాగ్దానానికి సంబంధించిన షరతులను కొనసాగిస్తుండటంతో మూలంలోని అసంపూర్ణ వాక్య ప్రవాహాన్ని నిలుపుకుంది. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వద్ద ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
