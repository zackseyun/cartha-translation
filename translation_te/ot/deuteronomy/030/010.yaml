revisions:
- from: నీ దేవుడైన యెహోవా మాటకు లోబడి,[a] ఈ ధర్మశాస్త్ర గ్రంథంలో రాయబడిన ఆయన ఆజ్ఞలను, శాసనాలను పాటిస్తే, నీ పూర్ణహృదయంతో, నీ పూర్ణప్రాణంతో నీ దేవుడైన యెహోవా వైపు తిరిగితే.[b]
  to: నీవు నీ దేవుడైన యెహోవా మాటకు లోబడి,[a] ఈ ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన ఆయన ఆజ్ఞలనూ శాసనాలనూ పాటిస్తే, నీ హృదయమంతటితోను నీ ప్రాణమంతటితోను నీ దేవుడైన యెహోవా వద్దకు తిరిగి వస్తే.[b]
