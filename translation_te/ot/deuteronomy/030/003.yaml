source:
  edition: WLC
  text: וְ/שָׁ֨ב יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת שְׁבוּתְ/ךָ֖ וְ/רִחֲמֶ֑/ךָ וְ/שָׁ֗ב וְ/קִבֶּצְ/ךָ֙ מִ/כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: te
  text: అప్పుడు నీ దేవుడైన యెహోవా నీ దుస్థితిని మార్చుతాడు[a], నీ మీద కనికరం చూపిస్తాడు. నీ దేవుడైన యెహోవా నిన్ను ఏ ప్రజల మధ్య చెదరగొట్టాడో, ఆ ప్రజలందరిలో నుండి[b] ఆయన నిన్ను మళ్లీ[c] సమకూరుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీ చెరను తిరిగి తిప్పి.” ఇది దుస్థితి లేదా ప్రవాస స్థితిని మార్చి పునరుద్ధరించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “ప్రజలందరి” అనే మాటను “జాతులన్నిటి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయన తిరిగి వచ్చి నిన్ను సమకూరుస్తాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలుపుతుంది.
- source_word: וְשָׁב ... אֶת שְׁבוּתְךָ
  choice: నీ దుస్థితిని మార్చి
  rationale: ఇది బందీలను అక్షరార్థంగా తిరిగి తీసుకురావడం కంటే, కష్టస్థితిని తారుమారు చేసి పునరుద్ధరించడాన్ని సూచించే హీబ్రూ నుడికారం. తరువాతి వాక్యభాగమే చెదరిపోయినవారిని సమకూర్చడం గురించి ప్రత్యేకంగా చెబుతుంది.
- source_word: וְרִחֲמֶךָ
  choice: నీ మీద కనికరం చూపిస్తాడు
  rationale: רחם లోని హృదయపూర్వక కరుణ భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְשָׁב
  choice: మళ్లీ
  rationale: రెండవ שׁוב ను తరువాతి క్రియతో కలిసిన క్రియావిశేషణ భావంలో తీసుకుంటే ‘మళ్లీ సమకూరుస్తాడు’ అవుతుంది; అది స్వతంత్రంగా ‘తిరిగి వచ్చి’ అని కూడా అర్థమవగలదని పాదటిప్పణిలో నిలుపబడింది.
- source_word: וְקִבֶּצְךָ
  choice: నిన్ను ... సమకూరుస్తాడు
  rationale: చెదరిపోయిన ప్రజలను తిరిగి ఒకచోట చేర్చే పునరుద్ధరణ సందర్భానికి ‘సమకూర్చు’ సహజమైన తెలుగు సమానం.
- source_word: מִכָּל הָעַמִּים
  choice: ఆ ప్రజలందరి మధ్య నుండి
  rationale: עַמִּים అనే బహువచనం జాతులనో ప్రజాసమూహాలనో సూచించగలదు; ‘ప్రజలు’ మూలంలోని సమూహార్థాన్ని విస్తృతంగా నిలుపుతుంది.
- source_word: הֱפִיצְךָ
  choice: నిన్ను ... చెదరగొట్టాడో
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని, ప్రవాస సందర్భంలోని బలాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁמָּה
  choice: మధ్యకు ... ఆ ... మధ్య నుండి
  rationale: అక్షరార్థమైన ‘అక్కడికి’ అనే స్థానార్థాన్ని తెలుగు సంబంధ వాక్య నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת అనే నుడికారం
  choice: నీ దుస్థితిని మార్చి
  alternative: నీ చెరను తిరిగి తిప్పి; నీ స్థితిని పునరుద్ధరించి
  rationale: ఈ నుడికారం బాధాకరమైన స్థితిని తారుమారు చేసి పునరుద్ధరించడాన్ని సూచిస్తుంది. ‘నీ చెరను తిరిగి తిప్పి’ అనేది రూపపరంగా దగ్గరైనా ఆధునిక తెలుగులో అస్పష్టంగా ఉండవచ్చు; ‘బందీలను తిరిగి రప్పించి’ అనడం మూలంలోని సంబోధితుని స్థితిని బందీలుగా మార్చేస్తుంది.
- issue: రెండవ וְשָׁב యొక్క భావం
  choice: మళ్లీ సమకూరుస్తాడు
  alternative: తిరిగి వచ్చి నిన్ను సమకూరుస్తాడు
  rationale: హీబ్రూ రూపం ‘మళ్లీ’ అనే భావాన్నీ, స్వతంత్రంగా ‘తిరిగి వచ్చి’ అనే భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠం సహజమైన తెలుగు ప్రవాహాన్ని ఎంచుకుంటూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన సంబోధనను నిలుపుతూ గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పునరుద్ధరణ, కనికరం, చెదరగొట్టడం, తిరిగి సమకూర్చడం అనే క్రమాన్ని కాపాడాం. ప్రధాన పాఠంలో సహజత్వానికి ప్రాధాన్యం ఇచ్చి, నిజమైన హీబ్రూ సందిగ్ధతలను పాదటిప్పణుల్లో నిలిపాం.
