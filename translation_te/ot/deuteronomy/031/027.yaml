source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: te
  text: ఎందుకంటే మీ తిరుగుబాటుతనమూ, మీ మొండి మెడా[a] నాకు తెలుసు. ఇదిగో, ఈ రోజు నేను ఇంకా మీతో జీవించి ఉండగానే మీరు యహ్వేకు విరోధంగా[b] తిరుగుబాటు చేస్తూ వచ్చారు; ఇక నా మరణం తర్వాత ఎంత మరింతగా తిరుగుబాటు చేస్తారో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘మీ గట్టి మెడ’; ఇది మొండితనానికి లేదా మాట వినకపోవడానికి రూపకం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి సాధారణ అర్థం ‘తో’; ఇక్కడ తిరుగుబాటు సందర్భంలో ‘విరోధంగా’ అనే భావం వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: మీ తిరుగుబాటుతనం
  rationale: నిబంధన సంబంధమైన ధిక్కారాన్ని సూచించే నామవాచక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: మీ మొండి మెడ
  rationale: మూలంలోని శరీరరూపకాన్ని నిలుపుతూ, మొండితనం అనే భావాన్ని తెలిపే తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే హీబ్రూ ఉద్ఘాటక అవ్యయ బలాన్ని గౌరవప్రదమైన ప్రస్తుత తెలుగులో తెలియజేస్తుంది.
- source_word: בְּעוֹדֶנִּי חַי
  choice: నేను ఇంకా మీతో సజీవంగా ఉండగానే
  rationale: మోషే ఇంకా జీవించి, వారితో ఉన్న కాలాన్నే స్పష్టంగా తెలిపే సహజమైన కాలవాచక నిర్మాణం.
- source_word: מַמְרִים הֱיִתֶם
  choice: తిరుగుబాటు చేస్తూ వచ్చారు
  rationale: హయా క్రియతో కూడిన కృదంత నిర్మాణంలోని కొనసాగుతున్న లేదా పదేపదే కనిపించిన స్వభావాన్ని సాధారణ భూతకాలం కంటే మెరుగుగా వ్యక్తం చేస్తుంది.
- source_word: עִם יְהוָה
  choice: యెహోవాకు విరోధంగా
  rationale: עִם సాధారణంగా ‘తో’ అయినప్పటికీ, తిరుగుబాటు క్రియతో ఇక్కడ వ్యతిరేకతను సూచిస్తుంది; ‘విరోధంగా’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ధ్వన్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: וְאַף כִּי
  choice: ఇక ... ఎంత ఎక్కువగా
  rationale: ఇప్పుడే తిరుగుబాటు చేస్తే మోషే మరణానంతరం మరింతగా చేస్తారనే అలంకారిక అధికతా నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אַחֲרֵי מוֹתִי
  choice: నా మరణం తర్వాత
  rationale: మూలంలోని నామవాచక కాలనిర్మాణాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన రూపంతో నిలిపాం.
- issue: עִם יְהוָה లో సంబంధ భావం
  choice: యెహోవాకు విరోధంగా
  alternative: యెహోవాతో
  rationale: ‘తిరుగుబాటు చేయడం’ అనే సందర్భంలో עִם సహవాసం కంటే ప్రతిఘటనను సూచిస్తుంది; అయితే దాని సాధారణ అర్థమైన ‘తో’ను పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘మెడ’ రూపకాన్ని పాదసూచికతో నిలిపి, కొనసాగుతున్న తిరుగుబాటు భావాన్ని ‘చేస్తూ వచ్చారు’ ద్వారా వ్యక్తం చేశాం.
