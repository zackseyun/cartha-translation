source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: te
  text: ప్రజలను—పురుషులను, స్త్రీలను, చిన్నపిల్లలను, నీ పట్టణాల్లో[b] నివసించే పరదేశిని[a]—సమకూర్చు. వారు విని, నేర్చుకొని, మీ దేవుడైన యాహ్వేకు భయపడి[c], ఈ ధర్మశాస్త్రపు[d] మాటలన్నిటినీ జాగ్రత్తగా ఆచరించేలా చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అంటే ఇశ్రాయేలీయుడు కాకపోయినా వారి మధ్య స్థిరంగా నివసించే వ్యక్తి; ‘నివాస విదేశీయుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘నీ ద్వారాల్లో.’ ఇది సాధారణంగా నీ పట్టణాల్లో లేదా నీ సమాజం మధ్య నివసించడాన్ని సూచించే ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: ‘యాహ్వేను భక్తితో గౌరవించి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ భయంతో కూడిన గౌరవాన్నీ విధేయతతో కూడిన భక్తినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: d
    text: ‘ఈ బోధపు’ లేదా ‘ఈ ఉపదేశపు’ అని కూడా అనువదించవచ్చు. హీబ్రూ తోరా అనే పదానికి ‘ధర్మశాస్త్రం’తో పాటు ‘బోధ, ఉపదేశం’ అనే అర్థాలూ ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: సమకూర్చు
  rationale: కהל అనే ధాతువు హిఫీల్ ఆజ్ఞారూపంలో ఉండి, ప్రజలు సభగా కూడేలా చేయమనే భావాన్ని ఇస్తుంది. ‘సమకూర్చు’ ఆ అధికారపూర్వక పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: ఇక్కడ עָם నిబంధన సమాజమంతటినీ సూచిస్తుంది; ‘ప్రజలు’ దాని సాధారణమైన, సందర్భోచితమైన అర్థం.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: పురుషులను, స్త్రీలను, చిన్నపిల్లలను
  rationale: మూలపాఠం వర్గాలను స్పష్టంగా విడివిడిగా పేర్కొంటుంది. טַף చిన్నపిల్లలు లేదా చిన్నవయసు ఆధారితులను సూచించగలందున ‘చిన్నపిల్లలు’ అనే సూక్ష్మార్థాన్ని నిలిపింది.
- source_word: וְגֵרְךָ
  choice: పరదేశిని
  rationale: גֵר ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర నివాసిని సూచిస్తుంది. తెలుగులో ‘పరదేశి’ ఆ వ్యక్తి విదేశీ మూలాన్నీ, సమాజంలో నివాసాన్నీ మోయగల పదం; వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో నివసించే
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో’ అయినా, ద్వారాలు ఇక్కడ పట్టణాలను లేదా స్థిర నివాస సమాజాన్ని సూచించే ప్రయోగం. అర్థాన్ని ప్రధాన పాఠంలో సహజంగా ఇచ్చి, మూల రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: వారు విని, నేర్చుకొని
  rationale: రెండు ఉద్దేశ్య క్రియల క్రమాన్ని నిలిపి, తెలుగు వాక్యప్రవాహానికి తగిన విధంగా అనుసంధానించాం.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వేకు భయపడి
  rationale: ירא లో భయంతో పాటు భక్తిపూర్వక గౌరవం, విధేయత ఉన్నాయి; ప్రత్యక్షమైన ‘భయపడి’ని ఉంచి విస్తృత భావాన్ని పాదసూచికలో తెలిపాం. יְהוָהను వ్యక్తిగత నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం. אֱלֹהֵיכֶםలోని బహువచన సంబోధనను ‘మీ’ నిలుపుతుంది.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: జాగ్రత్తగా ఆచరించేలా
  rationale: שמר + క్రియానామ రూపం కేవలం తెలుసుకోవడం కాక, శ్రద్ధగా పాటించి కార్యరూపం దాల్చడాన్ని సూచిస్తుంది. ‘జాగ్రత్తగా ఆచరించు’ ఈ రెండు అంశాలను సహజంగా తెలియజేస్తుంది.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ
  rationale: דִּבְרֵי యొక్క ‘మాటలు’ అనే స్పష్టతను నిలిపాం. תורה బోధ లేదా ఉపదేశం అని కూడా అర్థమవుతుంది; ద్వితీయోపదేశకాండంలోని నిబంధన పత్ర సందర్భంలో ‘ధర్మశాస్త్రం’ సహజమైన ఎంపిక.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాక నాలుగు హల్లుల దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: ירא లోని భయం మరియు భక్తిపూర్వక గౌరవం
  choice: భయపడి
  alternative: భక్తితో గౌరవించి
  rationale: మూల క్రియలో నిజమైన భయం మరియు భక్తిపూర్వక గౌరవం రెండూ ఉండగలవు. ప్రధాన పాఠంలో ప్రత్యక్ష పదార్థాన్ని ఉంచి, దాని నిబంధన సంబంధిత విస్తృత భావాన్ని పాదసూచికలో తెలిపాం; ఒక భావాన్ని మరొకదిగా మార్చలేదు.
- issue: సభలోని వర్గాల స్పష్టమైన ప్రస్తావన
  choice: పురుషులను, స్త్రీలను, చిన్నపిల్లలను
  alternative: అందరు ప్రజలను
  rationale: మూలపాఠం ఈ వర్గాలను విడిగా పేర్కొంటుంది. వాటిని సమగ్ర పదంలో కలిపివేయకుండా మూలంలోని సామాజిక విస్తృతిని నిలిపాం.
- issue: תורה యొక్క పరిధి
  choice: ధర్మశాస్త్రం
  alternative: బోధ / ఉపదేశం
  rationale: תורהకు బోధ అనే విస్తృత అర్థం ఉన్నా, ఇక్కడ ప్రజల ముందు చదివి ఆచరించాల్సిన నిబంధన పత్రం సందర్భం ‘ధర్మశాస్త్రం’కు మద్దతిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా పదంలోని అర్థవిస్తృతిని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఆజ్ఞలోని ఏకవచన ‘నీ’ను, సభను ఉద్దేశించిన ‘మీ దేవుడు’ అనే బహువచనాన్ని మూలపాఠం ప్రకారం వేరు చేశాం. పొడవైన ఉద్దేశ్య నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు చివర ‘ఇలా చేయాలి’ అని పూర్తి చేశాం; ఇది కొత్త ఆజ్ఞను జోడించకుండా ‘సమకూర్చు’ అనే ఆజ్ఞ యొక్క ఉద్దేశ్యాన్ని ముగిస్తుంది.
