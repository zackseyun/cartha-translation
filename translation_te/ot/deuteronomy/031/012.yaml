revisions:
- from: ప్రజలను—పురుషులను, స్త్రీలను, చిన్నపిల్లలను, నీ పట్టణాల్లో[b] నివసించే పరదేశిని[a]—సమకూర్చు. వారు విని, నేర్చుకొని, మీ దేవుడైన యాహ్వేకు భయపడి[c], ఈ ధర్మశాస్త్రంలోని[d] మాటలన్నిటినీ జాగ్రత్తగా ఆచరించేలా ఇలా చేయాలి.
  to: ప్రజలను—పురుషులను, స్త్రీలను, చిన్నపిల్లలను, నీ పట్టణాల్లో[b] నివసించే పరదేశిని[a]—సమకూర్చు. వారు విని, నేర్చుకొని, మీ దేవుడైన యాహ్వేకు భయపడి[c], ఈ ధర్మశాస్త్రపు[d] మాటలన్నిటినీ జాగ్రత్తగా ఆచరించేలా చేయి.
  rationale: The revision removes the non-source addition ‘ఇలా చేయాలి’ and uses a direct Telugu purposive expression dependent on ‘సమకూర్చు.’ It also makes the final genitive construction correspond more closely to the Hebrew ‘words of this law.’ Footnote d is adjusted to match the revised anchor and wording.
