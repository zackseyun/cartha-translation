source:
  edition: WLC
  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: te
  text: “ఈ ధర్మశాస్త్ర గ్రంథాన్ని[a] తీసుకొని, మీ దేవుడైన యహ్వే నిబంధన మందసం పక్కన ఉంచండి. అది అక్కడ ఉండి, మీకు వ్యతిరేకంగా సాక్షిగా నిలవాలి.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రపు ఈ చుట్టను.” హీబ్రూ పదం סֵפֶר ఒక చుట్టను లేదా లిఖిత పత్రాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, మీరు నిబంధనను ఉల్లంఘిస్తే అది మీకు వ్యతిరేకంగా సాక్ష్యంగా నిలుస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: తీసుకొని
  rationale: ఇక్కడ క్రియావిశేషణ రూపం ఆజ్ఞార్థక బలంతో వాడబడింది. తదుపరి ఆజ్ఞతో సహజంగా కలిసేలా ‘తీసుకొని’ అని అనువదించాం.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ధర్మశాస్త్రపు ఈ గ్రంథం
  rationale: סֵפֶר అనేది గ్రంథం, చుట్ట లేదా లిఖిత పత్రాన్ని సూచించగలదు; תּוֹרָה ఈ సందర్భంలో నిబంధనకు సంబంధించిన ధర్మశాస్త్ర బోధను సూచిస్తుంది.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: ఉంచండి
  rationale: బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: מִצַּד
  choice: పక్కన
  rationale: వస్తువు మందసం లోపల కాకుండా దాని ప్రక్కన ఉంచబడిందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן בְּרִית
  choice: నిబంధన మందసం
  rationale: ఇది ఒడంబడికకు సంబంధించిన పవిత్ర పెట్టెను సూచించే స్థిరమైన బైబిలు పదబంధం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: బహువచన సంబోధనతో కూడిన స్వామ్య సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה שָׁם
  choice: అది అక్కడ ... ఉండాలి
  rationale: ఉంచిన తరువాత అక్కడ కొనసాగి ఉండాలనే ఉద్దేశిత స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּךָ
  choice: మీకు వ్యతిరేకంగా
  rationale: నిబంధన సంబంధమైన న్యాయ సందర్భంలో ఈ ఉపసర్గ సాక్ష్యం ప్రజలకు ప్రతికూలంగా నిలుస్తుందనే భావాన్ని ఇస్తుంది; ఏకవచన రూపం ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది.
- source_word: לְעֵד
  choice: సాక్షిగా
  rationale: עֵד యొక్క ప్రాథమిక న్యాయపరమైన భావమైన ‘సాక్షి’ని నిలుపుతుంది.
theological_decisions:
- issue: గ్రంథం ఇచ్చే సాక్ష్యం యొక్క పాత్ర
  choice: నిబంధనను ఉల్లంఘించినప్పుడు ఇశ్రాయేలుకు వ్యతిరేకంగా నిలిచే సాక్షి
  alternative: కేవలం జ్ఞాపకార్థంగా లేదా తటస్థ సాక్ష్యంగా ఉండే గ్రంథం
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధన-న్యాయ సందర్భంలో לְעֵד בְּךָ అనే పదబంధం ప్రజలకు వ్యతిరేకంగా నిలిచే సాక్ష్యాన్ని సూచిస్తుంది; అయితే ఆ వివరణను ప్రధాన వాక్యంలో విస్తరించకుండా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మందసం’ అనే పరిచిత బైబిలు పదాన్ని నిలిపి, దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం. మూలంలోని సమష్టి సంబోధనను తెలుగు బహువచన రూపం ద్వారా వ్యక్తం చేశాం.
