  to: 'యహ్వే మోషేతో ఇలా అన్నాడు: “ఇదిగో, నీవు నీ పితరులతో నిద్రించబోతున్నావు. అప్పుడు ఈ ప్రజలు లేచి, తాము ప్రవేశిస్తున్న ఆ దేశంలోని అన్య దేవుళ్లను అనుసరించి వ్యభిచారం చేస్తారు[a]. వారు నన్ను విడిచిపెట్టి, నేను వారితో చేసిన నా నిబంధనను ఉల్లంఘిస్తారు[b].”'
  rationale: The revision aligns the divine name with the stated POB policy and improves the natural Telugu expression of the Hebrew idolatry metaphor. It also relocates footnote b to the covenant phrase and corrects its explanation of the two collective-singular Hebrew forms. No theological interpretation has been added.
