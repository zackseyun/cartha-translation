source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: te
  text: 'యహ్వే మోషేతో ఇలా అన్నాడు: “ఇదిగో, నీవు నీ పితరులతో నిద్రించబోతున్నావు. అప్పుడు ఈ ప్రజలు లేచి, తాము ప్రవేశిస్తున్న ఆ దేశంలోని అన్య దేవుళ్లను అనుసరించి వ్యభిచారం చేస్తారు[a]. వారు నన్ను విడిచిపెట్టి, నేను వారితో చేసిన నా నిబంధనను ఉల్లంఘిస్తారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “అన్య దేవుళ్ల వెంట వ్యభిచారం చేస్తారు.” విగ్రహారాధన ద్వారా నిబంధనకు నమ్మకద్రోహం చేయడాన్ని లైంగిక అవిశ్వాస రూపకంతో ఇది వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “తాము ప్రవేశిస్తున్న” అనే చోట హీబ్రూలో “అతడు ప్రవేశిస్తున్నాడు” అనే ఏకవచన రూపం ఉంది; “వారితో” అనే చోట కూడా ఏకవచన రూపం ఉంది. రెండూ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తున్నందున తెలుగులో బహువచనంగా అనువదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: ఇదిగో, నీవు నీ పితరులతో నిద్రించబోతున్నావు
  rationale: మరణాన్ని సూచించే హీబ్రూ నానుడిని నేరుగా ‘చనిపోతావు’ అని సరళీకరించకుండా నిలిపి, సమీప భవిష్యత్తు భావాన్ని ‘బోతున్నావు’తో తెలిపింది.
- source_word: וְקָם
  choice: అప్పుడు ఈ ప్రజలు లేచి
  rationale: మోషే మరణం తరువాత జరిగే వరుస చర్యగా భావాన్ని తెలిపి, ‘తిరుగుబాటు చేస్తారు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా మూల క్రియను నిలిపింది.
- source_word: וְזָנָה אַחֲרֵי אֱלֹהֵי נֵכַר
  choice: అన్య దేవుళ్ల వెంట వెళ్లి వ్యభిచారం చేస్తారు
  rationale: విగ్రహారాధన వల్ల కలిగే నిబంధన అవిశ్వాసాన్ని లైంగిక అవిశ్వాస రూపకంతో చెప్పే మూలంలోని కఠినతను నిలిపింది.
- source_word: הָאָרֶץ אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: తాము ప్రవేశిస్తున్న ఆ దేశంలోని
  rationale: హీబ్రూలోని సామూహిక ఏకవచనాన్ని సహజమైన తెలుగు బహువచన సూచనగా మార్చి, ప్రవేశిస్తున్న దేశంతో అన్య దేవుళ్ల సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: וַעֲזָבַנִי
  choice: వారు నన్ను విడిచిపెట్టి
  rationale: దేవునితో నిబంధన సంబంధాన్ని త్యజించడాన్ని సహజమైన, గంభీరమైన తెలుగులో తెలిపింది.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: నా నిబంధనను ఉల్లంఘిస్తారు
  rationale: నిబంధన సందర్భంలో הפר యొక్క ‘భంగపరచు/ఉల్లంఘించు’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: నేను వారితో చేసిన
  rationale: כרת ברית అనే హీబ్రూ నానుడిని సహజ తెలుగులో ‘నిబంధన చేయడం’గా ఇచ్చి, సామూహిక ఏకవచన సూచనను బహువచనంగా స్పష్టం చేసింది.
theological_decisions:
- issue: విగ్రహారాధనకు లైంగిక అవిశ్వాస రూపకం
  choice: ‘వ్యభిచారం చేస్తారు’ అనే బలమైన రూపకాన్ని నిలిపింది.
  alternative: ‘నమ్మకద్రోహం చేస్తారు’ లేదా ‘ఆధ్యాత్మిక వ్యభిచారం చేస్తారు’
  rationale: మొదటి ప్రత్యామ్నాయం మూలంలోని ఉద్దేశపూర్వక తీవ్రతను తగ్గిస్తుంది; రెండవది మూలంలో లేని వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చుతుంది.
- issue: ఇశ్రాయేలును సూచించే సామూహిక ఏకవచనం
  choice: తెలుగులో సహజమైన బహువచన రూపాలు ‘తాము’, ‘వారు’, ‘వారితో’ వాడింది.
  alternative: ‘అతడు ప్రవేశిస్తున్నాడు... అతనితో’ అని ఏకవచనాన్ని యథాతథంగా ఉంచడం
  rationale: మూలంలోని ఏకవచనం వ్యక్తిని కాక ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగు బహువచనం అదే సూచ్యార్థాన్ని అపార్థం లేకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘పితరులతో నిద్రించు,’ ‘వ్యభిచారం చేయు,’ ‘నిబంధన’ వంటి మూలపాఠ్యానికి ముఖ్యమైన రూపక, ఒడంబడిక పదజాలం నిలిపివేయబడింది.
