revisions:
- from: నీ దేవుడైన యాహ్వే తానే నీకు ముందుగా దాటి వెళ్తున్నాడు[a]. ఆయనే ఈ జనాలను నీ ముందునుంచి నాశనం చేస్తాడు; నీవు వారిని వెళ్లగొట్టి వారి దేశాన్ని స్వాధీనం చేసుకుంటావు[b]. యెహోషువ తానే నీకు ముందుగా దాటి వెళ్తున్నాడు—యాహ్వే చెప్పినట్లే.
