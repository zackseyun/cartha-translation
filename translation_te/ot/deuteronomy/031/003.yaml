  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే తానే నీ ముందుగా దాటి వెళ్తున్నాడు[a]. ఆయనే ఈ జనాంగాలను నీ ముందునుంచి నాశనం చేస్తాడు; నీవు వారిని స్వాధీనం చేసుకుంటావు[b]. యెహోషువ తానే నీ ముందుగా దాటి వెళ్తున్నాడు—యాహ్వే చెప్పినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ ముందుగా వెళ్తున్నాడు’ లేదా ‘నీ ముందుగా దాటి వెళ్తాడు.’ హీబ్రూ భాగధాతువు కొనసాగుతున్న, సమీప భవిష్యత్తులో జరిగే, లేదా నిశ్చయమైన భవిష్యత్ కార్యాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని స్వాధీనం చేసుకుంటావు’ లేదా ‘వారి దేశాన్ని స్వాధీనం చేసుకుంటావు.’ హీబ్రూ క్రియ తరచుగా ముందున్న నివాసులను తొలగించి స్వాధీనం చేసుకోవాలనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నిబంధనాత్మక సంబోధనను సహజమైన తెలుగులో నిలిపాం.
- source_word: הוּא
  choice: తానే / ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను యాహ్వే విషయంలోనూ యెహోషువ విషయంలోనూ నిలిపాం; గౌరవార్థకంగా యాహ్వేకు ‘ఆయనే’ వాడాం.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: నీకు ముందుగా దాటి వెళ్తున్నాడు
  rationale: భాగధాతువు సూచించే కొనసాగుతున్న, సమీప లేదా నిశ్చిత కార్యభావాన్ని, అలాగే యొర్దాను దాటడమనే సందర్భోచిత చిత్రాన్ని నిలిపే వ్యక్తీకరణ.
- source_word: יַשְׁמִיד
  choice: నాశనం చేస్తాడు
  rationale: హిఫిల్ రూపంలోని బలమైన కారణార్థక విధ్వంస భావాన్ని అతిశయింపకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలు
  rationale: కనాను ప్రాంతంలోని జాతి-రాజకీయ సమూహాలను సూచించే גּוֹיִם పదానికి సాధారణ పాఠకులకు సహజమైన తెలుగు.
- source_word: מִלְּפָנֶיךָ
  choice: నీ ముందునుంచి
  rationale: ఇశ్రాయేలు మార్గం నుంచి తొలగించబడటమనే స్థలార్థాన్ని నిలుపుతుంది.
- source_word: וִירִשְׁתָּם
  choice: వారిని వెళ్లగొట్టి వారి దేశాన్ని స్వాధీనం చేసుకుంటావు
  rationale: యుద్ధ-ఆక్రమణ సందర్భంలో ירשׁ సూచించే, ముందున్న నివాసులను తొలగించి వారి భూమిని స్వాధీనం చేసుకోవడమనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలిపాం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యాహ్వే చెప్పినట్లే
  rationale: דִּבֶּר యొక్క సాధారణ ‘చెప్పాడు/మాట్లాడాడు’ అర్థాన్ని నిలిపి, ‘వాగ్దానం చేశాడు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: యాహ్వే మరియు యెహోషువ మధ్య కార్యనిర్వహణ ఉద్ఘాటన
  choice: ఇద్దరి విషయములోనూ ‘తానే/ఆయనే’ అనే ఉద్ఘాటనను నిలపడం
  alternative: ఉద్ఘాటన లేకుండా ‘ఆయన/అతడు’ అని అనువదించడం
  rationale: దేవుడు స్వయంగా ముందుకు వెళ్లడాన్నీ, ఆయన నియామకం ప్రకారం యెహోషువ ముందుకు వెళ్లడాన్నీ వాక్యం పక్కపక్కనే ఉద్ఘాటిస్తుంది; ఈ దైవ-మానవ కార్యనిర్వహణ మధ్య ఉన్న సంబంధాన్ని విడదీయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పునరుక్త ఉద్ఘాటనను నిలిపి, అవసరానికి మించిన మతపరమైన పరిభాషను నివారించాం. అన్ని పాదసూచిక గుర్తులను సంబంధిత పదబంధాల దగ్గర ఉంచాం.
