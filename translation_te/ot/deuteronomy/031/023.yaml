id: DEU.31.23
reference: Deuteronomy 31:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: te
  text: 'ఆయన నూను కుమారుడైన యెహోషువకు ఆజ్ఞాపించి ఇలా అన్నాడు: “బలంగా, ధైర్యంగా ఉండు. ఎందుకంటే వారికి ప్రమాణం చేసిన ఆ దేశంలోకి ఇశ్రాయేలు కుమారులను[a] నీవు తీసుకువెళ్తావు. నేను నీతో ఉంటాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులను,” లేదా “ఇశ్రాయేలు ప్రజలను.” హీబ్రూ మూలపాఠంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపిస్తూ
  rationale: צוה పియేల్ రూపం ‘ఆజ్ఞాపించు’ లేదా సందర్భానుసారం ‘బాధ్యత అప్పగించు’ అనే భావాన్ని ఇస్తుంది. యెహోషువను నియమించి బాధ్యత అప్పగిస్తున్న గంభీర సందర్భానికి ‘ఆజ్ఞాపిస్తూ’ సూటిగా, సహజంగా సరిపోతుంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని తెలుగులో సహజంగా తెలియజేసే రూపం.
- source_word: חֲזַק וֶאֱמָץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: ఈ జంట ఆజ్ఞల్లో మొదటిది దృఢత్వాన్ని, రెండవది ధైర్యం మరియు స్థిరచిత్తాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో రెండింటి సంయుక్త బలాన్ని ఈ రూపం స్పష్టంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందు చెప్పిన ప్రోత్సాహానికి కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: תָּבִיא
  choice: నీవు తీసుకువెళ్తావు
  rationale: בוא హిఫీల్ రూపం ‘లోపలికి తీసుకురావడం/తీసుకువెళ్లడం’ అనే కారణార్థాన్ని ఇస్తుంది. గమ్యదేశంలోకి ప్రజలను నడిపించే భావాన్ని ‘తీసుకువెళ్తావు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని కుటుంబసంబంధమైన, వ్యాకరణపరంగా పుంలింగ బహువచనమైన వ్యక్తీకరణను ప్రధాన పాఠంలో నిలుపుతుంది; సమూహార్థక సహజ ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: הָאָרֶץ
  choice: దేశంలోకి
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధన వాగ్దాన సందర్భంలో הָאָרֶץ వాగ్దాన దేశాన్ని సూచిస్తుంది. తెలుగులో గమ్యార్థక ‘దేశంలోకి’ సందర్భానికి సహజం.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: నేను వారికి ఇస్తానని ప్రమాణం చేసిన
  rationale: హీబ్రూలో ‘ఇస్తానని’ స్పష్టంగా లేకపోయినా, దేశాన్ని వారికి ప్రమాణం చేయడం అనే సంక్షిప్త నిబంధన ప్రయోగంలో అది అంతర్లీనంగా ఉంది. తెలుగులో అర్థవంతంగా ఉండేందుకు దాన్ని వ్యక్తం చేశాం.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: నేను నీతో ఉంటాను
  rationale: దైవసన్నిధి వాగ్దానాన్ని సూటిగా, గుర్తించదగిన రీతిలో ఉంచుతుంది. אָנֹכִי అనే స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్యంలో స్పష్టమైన ‘నేను’ సహజంగా మోస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులను
  alternative: ఇశ్రాయేలీయులను; ఇశ్రాయేలు ప్రజలను
  rationale: మూలంలోని కుటుంబ/నిబంధన సంబంధిత రూపకాన్ని ప్రధాన పాఠంలో కాపాడాం. ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే సంప్రదాయ సమూహపదమని ప్రత్యామ్నాయాలతో పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: וַיְצַו / וַיֹּאמֶר క్రియల అంతర్లీన కర్త
  choice: ఆయన
  alternative: యెహోవా
  rationale: ఈ వచనంలోని హీబ్రూ క్రియలకు కర్త మూడవ పురుష ఏకవచనంగా అంతర్లీనంగా ఉంది; దేవుని ప్రత్యక్ష వాక్యంలోని ‘నేను’ మరియు ముందరి సందర్భం కర్తను తెలియజేస్తాయి. మూలంలో లేని దైవనామాన్ని ప్రధాన పాఠంలో చేర్చకుండా సర్వనామాన్ని నిలిపాం.
- issue: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם లో అంతర్లీన దానార్థం
  choice: నేను వారికి ఇస్తానని ప్రమాణం చేసిన
  alternative: నేను వారికి ప్రమాణం చేసిన
  rationale: ‘దేశాన్ని వారికి ప్రమాణం చేయడం’ అనే హీబ్రూ సంక్షిప్త ప్రయోగంలో దేశాన్ని ఇవ్వడం అంతర్లీనంగా ఉంది. తెలుగులో రెండవ రూపం అసహజంగా లేదా అస్పష్టంగా ఉండేందున అంతర్లీన భావాన్ని వ్యక్తం చేశాం; కొత్త సిద్ధాంతార్థాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నీవు/నీతో’ రూపాలు యెహోషువను ఉద్దేశించిన మాటను స్పష్టంగా ఉంచుతాయి; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
