id: DEU.31.17
reference: Deuteronomy 31:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: te
  text: 'ఆ రోజున వారిమీద నా కోపం రగులుకుంటుంది. నేను వారిని విడిచివేస్తాను; వారి నుండి నా ముఖాన్ని దాచుకుంటాను. అప్పుడు వారు మింగివేయబడతారు[a]; అనేక విపత్తులూ కష్టాలూ వారికి ఎదురవుతాయి. ఆ రోజున ఆ ప్రజ ఇలా అంటుంది: ‘నా దేవుడు నా మధ్య లేడు కాబట్టే కదా ఈ విపత్తులు నాకు ఎదురయ్యాయి?’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు/అది తినబడడానికి అవుతుంది.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; నాశనానికి బలికావడం లేదా మింగివేయబడడం అనే భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “నా దేవుడు నా మధ్య లేడు.” ఏకవచన మాటతీరు ఇశ్రాయేలు ప్రజలను ఒక వ్యక్తిలా చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: నా కోపం రగులుకుంటుంది
  rationale: కోపం మండడం అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בּוֹ
  choice: వారిమీద
  rationale: రూపం ఏకవచనమైనా, సందర్భంలో ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది; కథన భాగంలో తెలుగు బహువచనం సహజం.
- source_word: וַעֲזַבְתִּים
  choice: నేను వారిని విడిచిపెట్టి
  rationale: దైవ సంబంధ ఉపసంహరణ యొక్క గంభీరతను చూపుతుంది; మూలపదానికి దగ్గరగా ఉంది.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: వారికి నా ముఖాన్ని దాచుకుంటాను
  rationale: ప్రాముఖ్యమైన హీబ్రూ రూపకాన్ని వివరణగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: וְהָיָה לֶאֱכֹל
  choice: వారు మింగివేయబడతారు
  rationale: అక్షరార్థంగా ‘తినబడడానికి అవుతాడు/అది అవుతుంది’ అనే సంక్షిప్త హీబ్రూ ప్రయోగాన్ని, నాశనానికి గురయ్యే భావంతో తెలుగులో తెలియజేస్తుంది.
- source_word: וּמְצָאֻהוּ
  choice: వారిని చుట్టుముడతాయి
  rationale: ‘కనుగొంటాయి’ అనే అక్షరానువాదం తెలుగులో కృత్రిమంగా ఉంటుంది; విపత్తులు వచ్చి వారిని పట్టుకునే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: అనేక విపత్తులూ కష్టాలూ
  rationale: רָעוֹת యొక్క సందర్భోచితమైన విపత్తులు/కీడులు అనే అర్థాన్ని, צָרוֹת యొక్క కష్టాలు అనే అర్థం నుంచి వేరుగా ఉంచుతుంది.
- source_word: וְאָמַר
  choice: ఆ ప్రజ ఇలా అంటారు
  rationale: హీబ్రూలోని ఏకవచనం ఇశ్రాయేలును ఒక సమష్టి వ్యక్తిగా చూపుతుంది; తెలుగులో ‘ఆ ప్రజ’ అనే సమష్టి నామంతో ఆ భావాన్ని నిలుపుతుంది.
- source_word: הֲלֹא עַל כִּי
  choice: వల్లనే కదా
  rationale: కారణాన్ని సూచించే అలంకారిక ప్రశ్న బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: నా దేవుడు నా మధ్య లేకపోవడం
  rationale: మూలంలోని ప్రథమ పురుష ఏకవచన సమష్టి-వ్యక్తీకరణను మార్చకుండా ఉంచుతుంది.
- source_word: מְצָאוּנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: ముందటి క్రియతో భావసంబంధాన్ని ఉంచుతూ, తెలుగు వాక్యంలో విపత్తులు వ్యక్తిని చేరి పట్టుకున్న భావాన్ని సహజంగా ఇస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు విషయంలో సమష్టి ఏకవచనం మరియు బహువచనం
  choice: దేవుని చర్యలను తెలిపే కథనంలో బహువచనం; ప్రజల స్వీయవాక్యంలో ‘ఆ ప్రజ… నా… నన్ను’ అనే సమష్టి ఏకవచనం
  alternative: అంతటా ఏకవచనం లేదా అంతటా బహువచనం
  rationale: హీబ్రూ ప్రజలను ఒక సమష్టిగా ఉద్దేశిస్తూ రూపాలను మార్చుతుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ, ఉద్ధృత వాక్యంలో ముఖ్యమైన జాతి-వ్యక్తీకరణను నిలుపుతుంది.
- issue: దేవుడు ముఖాన్ని దాచడం
  choice: ‘నా ముఖాన్ని దాచుకుంటాను’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘వారిని అనుగ్రహించను’ లేదా ‘నా సన్నిధిని తొలగిస్తాను’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ రూపకం తీర్పు, సంబంధ ఉపసంహరణ, దేవుని సన్నిధి అనే అంశాల మధ్య ఉన్న వేదాంత ఉద్వేగాన్ని ఒకే వివరణతో పరిష్కరించకుండా నిలుపుతుంది.
- issue: ‘నా దేవుడు నా మధ్య లేడు’ అనే ప్రజల నిర్ధారణ
  choice: ప్రజల ప్రశ్నగానే ఉంచడం
  alternative: ఇది దేవుని సంపూర్ణ గైర్హాజరీకి నిర్ధారిత ప్రకటనగా విపులీకరించడం
  rationale: వాక్యం బాధలో ఉన్న ప్రజల అలంకారిక ప్రశ్న; దాని వేదాంతపరమైన అర్థాన్ని అనువాదంలో అదనంగా నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ముఖాన్ని దాచుకోవడం’ వంటి మూలభాషా రూపకం నిలుపబడింది. కథనంలో సహజ బహువచనం, ఉద్ధృత వాక్యంలో సమష్టి ఏకవచనం వాడబడ్డాయి.
