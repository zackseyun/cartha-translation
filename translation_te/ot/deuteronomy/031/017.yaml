    rationale: హీబ్రూ הִסְתַּרְתִּי פָנַי מֵהֶם అక్షరార్థంగా ‘వారి నుండి నా ముఖాన్ని దాచుకుంటాను.’ ‘వారికి’ అంటే ‘వారికోసం/వారికి’ అనే దత్తివ భావం వినిపించవచ్చు; ముఖం ఎవరి నుండి దాచబడుతుందో స్పష్టంగా తెలియదు.
