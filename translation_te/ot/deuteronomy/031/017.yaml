- from: 'ఆ రోజున వారిమీద నా కోపం రగులుకుంటుంది. నేను వారిని విడిచిపెట్టి, వారికి నా ముఖాన్ని దాచుకుంటాను. అప్పుడు వారు మింగివేయబడతారు[a]; అనేక విపత్తులూ కష్టాలూ వారిని చుట్టుముడతాయి. ఆ రోజున ఆ ప్రజ ఇలా అంటారు: ‘నా దేవుడు నా మధ్య లేకపోవడం వల్లనే కదా ఈ విపత్తులు నన్ను చుట్టుముట్టాయి?’[b]'
  to: 'ఆ రోజున వారిమీద నా కోపం రగులుకుంటుంది. నేను వారిని విడిచివేస్తాను; వారి నుండి నా ముఖాన్ని దాచుకుంటాను. అప్పుడు వారు మింగివేయబడతారు[a]; అనేక విపత్తులూ కష్టాలూ వారికి ఎదురవుతాయి. ఆ రోజున ఆ ప్రజ ఇలా అంటుంది: ‘నా దేవుడు నా మధ్య లేడు కాబట్టే కదా ఈ విపత్తులు నాకు ఎదురయ్యాయి?’[b]'
  rationale: స్పష్టమైన తెలుగు సంబంధప్రయోగం కోసం ‘వారికి’ని ‘వారి నుండి’గా సరిచేశాం. మూలంలోని ఒకే క్రియ రెండుసార్లు రావడాన్ని తెలుగు సహజత్వం కోల్పోకుండా చూపడానికి ‘ఎదురవుతాయి/ఎదురయ్యాయి’ వాడాం. ప్రజలను వ్యక్తీకరించే హీబ్రూ ఏకవచనాన్ని ప్రతిబింబించడానికి ‘అంటుంది’గా మార్చాం. పాదటిప్పణి గుర్తులు, వాటి విషయాలు యథాతథంగా సరైన స్థానాల్లో ఉంచబడ్డాయి.
