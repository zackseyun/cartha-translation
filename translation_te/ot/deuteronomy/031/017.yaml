  revised_text: 'ఆ రోజున వారిమీద నా కోపం రగులుకుంటుంది. నేను వారిని విడిచివేస్తాను; వారి నుండి నా ముఖాన్ని దాచుకుంటాను. అప్పుడు వారు మింగివేయబడతారు[a]; అనేక విపత్తులూ కష్టాలూ వారికి ఎదురవుతాయి. ఆ రోజున ఆ ప్రజ ఇలా అంటుంది: ‘నా దేవుడు నా మధ్య లేడు కాబట్టే కదా ఈ విపత్తులు నాకు ఎదురయ్యాయి?’[b]'
