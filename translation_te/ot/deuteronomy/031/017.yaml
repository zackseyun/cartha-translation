  source_fidelity: హీబ్రూ మూలంలోని దైవకోపం, విడిచివేయడం, ముఖం దాచడం, భక్షణానికి గురికావడం అనే సంక్షిప్త ప్రయోగం, అనేక కీడులు/బాధలు ఎదురవడం, అలాగే ఇశ్రాయేలు సమష్టి-ఏకవచన స్వీయవాక్యం ప్రధానంగా సరిగ్గా ప్రతిఫలించబడ్డాయి. అయితే ‘వారికి నా ముఖాన్ని దాచుకుంటాను’లో హీబ్రూ מֵהֶם (‘వారి నుండి’) సంబంధం తెలుగులో అసహజంగా/అస్పష్టంగా మారింది. ‘చుట్టుముడతాయి’ సందర్భానికి సరిపోయినా, రెండుసార్లూ వచ్చిన מצא అనే క్రియకు ఉన్న అనుసంధానాన్ని బలహీనపరుస్తుంది.
  naturalness: ‘వారి నుండి నా ముఖాన్ని దాచుకుంటాను’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సహజమైన రూపం. ‘ఆ ప్రజ ఇలా అంటుంది’ అనేది సమష్టి ఏకవచనాన్ని నిలుపుతూ, ముందున్న ‘ఆ ప్రజ ఇలా అంటారు’ కంటే వ్యాకరణపరంగా సుస్థిరం. ‘ఎదురవుతాయి/ఎదురయ్యాయి’ అనేది విపత్తులకు సహజమైన ప్రయోగం; మూలంలోని పునరుక్త క్రియాసంబంధాన్నీ చూపుతుంది.
  terminology: ‘కోపం రగులుకుంటుంది,’ ‘విడిచివేస్తాను,’ ‘ముఖాన్ని దాచుకుంటాను,’ ‘విపత్తులూ కష్టాలూ,’ మరియు ‘నా దేవుడు నా మధ్య లేడు’ అనే పదప్రయోగాలు గంభీరమైన ఆధునిక బైబిలు రిజిస్టర్‌కు తగినవి. ‘మింగివేయబడతారు’ను మూలంలోని సంక్షిప్త, వివాదాస్పద నిర్మాణానికి ఒక సందర్భోచిత అర్థంగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
