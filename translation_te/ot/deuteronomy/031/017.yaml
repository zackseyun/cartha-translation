  revision_rationale: స్పష్టమైన తెలుగు సంబంధప్రయోగం కోసం ‘వారికి’ని ‘వారి నుండి’గా సరిచేశాం. మూలంలోని ఒకే క్రియ రెండుసార్లు రావడాన్ని తెలుగు సహజత్వం కోల్పోకుండా చూపడానికి ‘ఎదురవుతాయి/ఎదురయ్యాయి’ వాడాం. ప్రజలను వ్యక్తీకరించే హీబ్రూ ఏకవచనాన్ని ప్రతిబింబించడానికి ‘అంటుంది’గా మార్చాం. పాదటిప్పణి గుర్తులు, వాటి విషయాలు యథాతథంగా సరైన స్థానాల్లో ఉంచబడ్డాయి.
