    rationale: రెండూ విడిచిపెట్టడం అనే భావానికే చేరతాయి. రפהకు ‘నీ చేయి విడువడు’ అని ఇవ్వడం ద్వారా చేయి వదలకపోవడం/నిలబెట్టడం అనే భావం, עזבకు ‘త్యజించడు’ ద్వారా పరిత్యజించకపోవడం అనే భావం వేరుగా వినిపిస్తాయి.
