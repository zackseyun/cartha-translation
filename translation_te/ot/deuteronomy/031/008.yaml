  to: యాహ్వేయే నీకు ముందుగా వెళ్తున్నవాడు. ఆయనే నీతో ఉంటాడు; ఆయన నీ చేయి విడువడు[a], నిన్ను త్యజించడు. భయపడకు, కృంగిపోకు.
