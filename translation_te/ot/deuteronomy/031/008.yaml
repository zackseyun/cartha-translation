id: DEU.31.8
reference: Deuteronomy 31:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: te
  text: యాహ్వేయే నీకు ముందుగా వెళ్తున్నవాడు. ఆయనే నీతో ఉంటాడు; ఆయన నీ చేయి విడువడు[a], నిన్ను త్యజించడు. భయపడకు, కృంగిపోకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నిన్ను వదలడు” లేదా “నిన్ను నిస్సహాయంగా విడిచిపెట్టడు.”
    reason: రפה హిఫిల్ క్రియకు చేయి విడవడం, వదలివేయడం, లేదా నిస్సహాయ స్థితిలో వదిలేయడం అనే సమీప భావాలు ఉండవచ్చు. ‘నీ చేయి విడువడు’ అనే ప్రధాన పాఠం క్రియలో సూచితమైన పట్టును/ఆధారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: హీబ్రూ మూలంలోని దేవుని వ్యక్తిగత నామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הוּא
  choice: యే / ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో ‘యే’, ‘ఆయనే’ ద్వారా నిలిపాం.
- source_word: הַהֹלֵךְ לְפָנֶיךָ
  choice: నీకు ముందుగా వెళ్తున్నవాడు
  rationale: కృదంత రూపంలోని కొనసాగుతున్న చర్యను, לְפָנֶיךָలోని ముందుగా నడిపించే భావాన్ని కాపాడుతుంది.
- source_word: יִהְיֶה עִמָּךְ
  choice: నీతో ఉంటాడు
  rationale: దైవసన్నిధిని తెలిపే హీబ్రూ మాటకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: לֹא יַרְפְּךָ
  choice: నిన్ను విడిచిపెట్టడు
  rationale: רפה హిఫిల్ రూపానికి ‘చేయి విడవడం/వదిలేయడం/నిస్సహాయంగా చేయడం’ అనే భావవ్యాప్తి ఉంది; ఇక్కడ భరోసా సూత్రంలో ‘విడిచిపెట్టడు’ సహజంగా ఉంది, అయితే తరువాతి עזבతో కొంత భావసామ్యం కలుగుతుంది.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: నిన్ను త్యజించడు
  rationale: עזבలోని వదలి వెళ్లడం లేదా పరిత్యజించడం అనే గంభీర భావాన్ని ‘త్యజించడు’ నిలుపుతుంది; ముందటి క్రియతో వ్యత్యాసాన్నీ సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: לֹא תִירָא
  choice: భయపడకు
  rationale: ఈ సందర్భంలో నిషేధాత్మక ప్రోత్సాహాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תֵחָת
  choice: దిగులుచెందకు
  rationale: חתת నిఫాల్ రూపంలోని కుంగిపోవడం, బెదిరిపోవడం, నిరుత్సాహపడడం అనే భావాన్ని మొదటి ‘భయపడకు’తో అనవసర పునరుక్తి లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచాం. ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం; ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా సుపరిచితం.
- issue: రెండు నిరాకరణ క్రియల మధ్య వ్యత్యాసం
  choice: విడిచిపెట్టడు; త్యజించడు
  alternative: నిన్ను నిస్సహాయంగా వదలడు; నిన్ను విడువడు
  rationale: רפה మరియు עזבలను ఒకే అర్థంగా కలపకుండా, మొదటిదానిలో చేయి విడవకపోవడం, రెండవదానిలో పరిత్యజించకపోవడం అనే భావాలను వేరుగా చూపించాం; మొదటి పదంలోని నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన భరోసా ధోరణిని ఉంచాం. మోషే యెహోషువతో ఏకవచనంలో మాట్లాడుతున్నందున ‘నీకు/నీతో/నిన్ను’ రూపాలు వాడాం.
