source:
  edition: WLC
  text: הַקְהִ֧ילוּ אֵלַ֛/י אֶת כָּל זִקְנֵ֥י שִׁבְטֵי/כֶ֖ם וְ/שֹׁטְרֵי/כֶ֑ם וַ/אֲדַבְּרָ֣ה בְ/אָזְנֵי/הֶ֗ם אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/אָעִ֣ידָה בָּ֔/ם אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: te
  text: మీ గోత్రాల పెద్దలందరినీ, మీ అధికారులనూ నా దగ్గరికి సమకూర్చండి. అప్పుడు నేను ఈ మాటలను వారు వినేలా చెప్పి, ఆకాశాన్నీ భూమినీ[a] వారికి వ్యతిరేకంగా సాక్షులుగా పిలుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాలనూ భూమినీ.” హీబ్రూలో ఇది ద్వితీయోపదేశకాండలో కనిపించే స్థిరమైన నిబంధన-సాక్ష్య వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: సమకూర్చండి
  rationale: קהל హిఫిల్ బహువచన ఆజ్ఞారూపంలోని ‘ఒకచోటికి కూడగట్టండి’ అనే కారక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: ‘నా వద్దకు/నా దగ్గరికి’ అనే దిశార్థాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: మీ గోత్రాల పెద్దలందరినీ
  rationale: గోత్రాలకు చెందిన నాయకులనే నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది; כָּל భావాన్ని ‘అందరినీ’ ద్వారా వ్యక్తం చేసింది.
- source_word: שֹׁטְרֵיכֶם
  choice: మీ అధికారులనూ
  rationale: ద్వితీయోపదేశకాండ పరిపాలనా సందర్భంలో שֹׁטְרִיםకు ‘అధికారులు’ విస్తృతమైన, అతిగా నిర్దిష్టం కాని సమానార్థకం.
- source_word: וַאֲדַבְּרָה בְּאָזְנֵיהֶם
  choice: నేను ఈ మాటలను వారు వినేలా చెప్పి
  rationale: కోహోర్టేటివ్ ఉద్దేశాన్ని, ‘వారి చెవుల్లో’ అనే హీబ్రూ నుడికారంలోని శ్రవణ భావాన్ని సహజ తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: ఇక్కడ דְּבָרִים పలికే వాక్యాలను సూచిస్తుంది; ‘మాటలు’ తక్షణ ప్రసంగ సందర్భానికి సరిపోతుంది.
- source_word: וְאָעִידָה בָּם
  choice: వారికి వ్యతిరేకంగా ... సాక్షులుగా పిలుస్తాను
  rationale: עוּד హిఫిల్‌లోని న్యాయపరమైన సాక్ష్యాహ్వాన భావాన్ని, בָּםలోని ప్రతికూల సంబంధాన్ని నిబంధన సందర్భానికి తగినట్లు నిలుపుతుంది.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ఆకాశాన్నీ భూమినీ
  rationale: ద్వితీయోపదేశకాండలో స్థిరంగా కనిపించే విశ్వసాక్షుల సూత్రాన్ని సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
theological_decisions:
- issue: నిబంధన సంబంధమైన సాక్ష్య సూత్రం
  choice: వారికి వ్యతిరేకంగా ఆకాశాన్నీ భూమినీ సాక్షులుగా పిలుస్తాను
  alternative: ఆకాశం, భూమి ద్వారా వారికి వ్యతిరేకంగా సాక్ష్యమిస్తాను
  rationale: ఆకాశం, భూమి ఇశ్రాయేలు బాధ్యతకు సాక్షులుగా ఆహ్వానించబడుతున్న నిబంధన-న్యాయస్థాన చిత్రాన్ని మొదటి రూపం స్పష్టంగా నిలుపుతుంది; అవే సాక్ష్య సాధనాలు మాత్రమే అన్న భావాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘అప్పుడు’ వరుసగా జరిగే ఉద్దేశిత చర్యలను సహజంగా కలుపుతుంది; ఆకాశం-భూమి సాక్ష్య రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపింది.
