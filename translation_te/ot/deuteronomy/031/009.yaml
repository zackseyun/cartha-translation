source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: te
  text: మోషే ఈ ధర్మశాస్త్రాన్ని[a] రాసి, యాహ్వే[b] నిబంధన మందసాన్ని మోసే లేవి కుమారులైన యాజకులకు[c], ఇశ్రాయేలు పెద్దలందరికీ దాన్ని ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ బోధను’ లేదా ‘ఈ తోరాను.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో దేవుని నామం YHWH; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, ‘లేవి కుమారులు’; సంక్షిప్తంగా ‘లేవీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: రాసి
  rationale: כתב అనే క్రియకు నేరుగా, సహజంగా ‘రాయడం’ అనే అర్థం వస్తుంది; వరుస కథన చర్యను తెలుగులో అసమాపక క్రియతో వ్యక్తం చేశాం.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రాన్ని
  rationale: תּוֹרָהకు ‘బోధ’, ‘నియమం’, ‘ధర్మశాస్త్రం’ అనే భావాలు ఉండవచ్చు. ఇక్కడ మోషే రాసి అప్పగించిన నిబంధన సంబంధిత నియమ సముదాయాన్ని సూచిస్తున్నందున ‘ధర్మశాస్త్రం’ సహజంగా, సందర్భోచితంగా ఉంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּתְּנָהּ
  choice: దాన్ని ఇచ్చాడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం תּוֹרָהను తిరిగి సూచిస్తుంది. ‘దాన్ని ఇచ్చాడు’ మూలంలోని సాధారణ కథన చర్యను స్పష్టంగా నిలుపుతుంది.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: యాజకులైన లేవి కుమారులకు
  rationale: ‘యాజకులు, లేవి కుమారులు’ అనే సమానాధికార నిర్మాణాన్ని తెలుగులో అస్పష్టత లేకుండా ‘యాజకులైన లేవి కుమారులు’గా వ్యక్తం చేశాం; ‘లేవీయులు’ అనే సంక్షిప్త ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הַנֹּשְׂאִים
  choice: మోసే
  rationale: נשׂא కృదంతం మందసాన్ని మోసేవారిని వర్ణిస్తుంది. ‘మోసే’ ఆధునిక తెలుగులో సరళమైన, ప్రత్యక్షమైన రూపం.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసాన్ని
  rationale: హీబ్రూ అనుబంధ పదబంధాన్ని సహజ తెలుగు క్రమంలో ‘యెహోవా నిబంధన మందసం’గా ఇచ్చాం. אֲרוֹןకు ఆరాధనా సందర్భంలో స్థిరమైన తెలుగు పదం ‘మందసం’ను ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ఉచ్చారణ పునర్నిర్మాణమైన ‘యాహ్వే’ను పాదసూచికలో సూచించాం.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలందరికీ
  rationale: זקנים ఇక్కడ ఇశ్రాయేలు నాయకత్వంలోని పెద్దలను సూచిస్తుంది. ‘పెద్దలు’ సహజమైన, స్థిరపడిన తెలుగు సమానార్థకం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నామం నేరుగా ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ‘యెహోవా’ తెలుగులో సుపరిచిత రూపం; ‘యాహ్వే’ సాధ్యమైన ఉచ్చారణ రూపమని పాదసూచిక తెలియజేస్తుంది.
- issue: ఈ సందర్భంలో תּוֹרָה పరిధి
  choice: ధర్మశాస్త్రం
  alternative: బోధ; తోరా
  rationale: ఇక్కడ రాయబడి యాజకులకు, పెద్దలకు అప్పగించబడిన నిబంధన సంబంధిత పాఠ్యాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ దాని నియమాత్మక స్వభావాన్ని తెలియజేస్తుంది; అయితే పదంలోని ‘బోధ’ భావాన్ని పూర్తిగా మూసివేయకుండా పాదసూచికలో నిలిపాం.
- issue: మందసాన్ని మోసేవారి గుర్తింపు
  choice: యాజకులైన లేవి కుమారులు
  alternative: యాజకులకు, అంటే లేవీయులకు
  rationale: మూలంలోని ‘యాజకులు—లేవి కుమారులు’ అనే సమానాధికార సంబంధాన్ని నిలుపుతూ, ఈ వాక్యాన్ని లేవీయులందరినీ యాజకులుగా నిర్ధారించేలా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా చదవదగిన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సహజ క్రమాన్ని వాడుతూ, ‘లేవి కుమారులు’ వంటి మూలపాఠ విశేషాలను మరియు תּוֹרָה, יהוה పదాల ప్రత్యామ్నాయాలను పాదసూచికల్లో సంరక్షించాం.
