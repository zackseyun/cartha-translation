source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: te
  text: అనేక విపత్తులూ కష్టాలూ అతనికి ఎదురైనప్పుడు[a], ఈ గీతం అతని ఎదుట సాక్షిగా స్పందిస్తుంది[b]. ఎందుకంటే, అది అతని సంతతి నోటి నుండి మరచిపోకుండా ఉంటుంది. ఈ రోజు అతడు చూపిస్తున్న అతని అంతరంగపు మొగ్గు[c] నాకు తెలుసు—నేను ప్రమాణం చేసిన దేశంలోకి అతన్ని తీసుకురాకముందే[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతన్ని కనుగొన్నప్పుడు’ లేదా ‘అతన్ని పట్టుకున్నప్పుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని ఎదుట’ అనే మాటను, గీతం సాక్షిగా పనిచేసే ఈ సందర్భంలో, మరింత బలంగా ‘అతనికి వ్యతిరేకంగా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీ పదం అతని అంతర్గత మొగ్గు, ఉద్దేశం లేదా మనోవైఖరిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: హెబ్రీలో అక్షరాలా ‘నేను ప్రమాణం చేసిన’ అని మాత్రమే ఉంది; ‘ఇస్తానని’ అనే భావం సందర్భంలోని ఒడంబడిక వాగ్దానం వల్ల సూచితమవుతుంది.
    reason: textual_clarity
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ఎదురైనప్పుడు
  rationale: భవిష్యత్తులో సంభవించే పరిస్థితిని సహజమైన ఆధునిక తెలుగులో కాలసూచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: అతనికి ఎదురైనప్పుడు
  rationale: מצא ఇక్కడ కీడులు, కష్టాలు ఒకరిని చేరడం లేదా పట్టుకోవడం అనే భావంలో ఉంది; ‘ఎదురవడం’ సహజంగా ఉండి ఆ ప్రతికూల భావాన్ని నిలుపుతుంది.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: అనేక విపత్తులూ కష్టాలూ
  rationale: רעות ఇక్కడ నైతిక దుష్టత్వం కంటే హానికర సంఘటనలను సూచిస్తుంది; ‘విపత్తులు’ ఆ సందర్భార్థాన్ని స్పష్టం చేస్తుంది, ‘కష్టాలు’ צרותను సాధారణ పాఠకుడికి సహజంగా అందిస్తుంది.
- source_word: וְעָנְתָה
  choice: జవాబిస్తుంది
  rationale: ענה యొక్క ప్రాథమిక ‘జవాబివ్వు/ప్రతిస్పందించు’ చిత్రాన్ని నిలుపుతుంది; గీతం చేసే సాక్ష్యపాత్ర తరువాతి పదబంధంలో స్పష్టమవుతుంది.
- source_word: לְפָנָיו לְעֵד
  choice: అతని ఎదుట సాక్షిగా
  rationale: לְפָנָיו యొక్క అక్షరార్థమైన ‘అతని ఎదుట’ను కాపాడుతూ, לְעֵד సూచించే సాక్ష్యపాత్రను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: అది అతని సంతతివారి నోట మరచిపోబడదు
  rationale: గీతం మౌఖికంగా తరతరాలకు నిలిచే భావాన్ని ‘నోట’ అనే మూల చిత్రంతో కాపాడుతుంది; זרעוֹ యొక్క సమష్టి భావాన్ని ‘సంతతివారు’ తెలియజేస్తుంది.
- source_word: יִצְרוֹ
  choice: అతని అంతరంగపు మొగ్గు
  rationale: యֵצֶר సూచించే అంతర్గత రూపుదిద్దుకున్న వైఖరి, ఉద్దేశం లేదా ప్రవృత్తిని ఏదైనా తరువాతి సాంకేతిక సిద్ధాంత పదంగా మార్చకుండా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: నేడు అతడు చేస్తున్నదానిలోని
  rationale: ఇశ్రాయేలు ప్రస్తుత ప్రవర్తనకు దాని అంతర్గత మొగ్గుతో ఉన్న సంబంధాన్ని తెలుగులో అర్థమయ్యేలా ఉంచుతుంది; మూలంలోని సంక్షిప్త సంబంధాన్ని అతిగా నిర్ధారించదు.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: నేను ప్రమాణం చేసిన
  rationale: మసొరెటిక్ పాఠంలోని సంక్షిప్త covenant పదబంధాన్ని అలాగే ఉంచుతుంది; తెలుగులో ‘దేశం’తో సహజంగా అనుసంధానమవుతుంది, మూలంలో లేని ‘ఇస్తానని’ని ప్రధాన పాఠంలో చేర్చదు.
theological_decisions:
- issue: יִצְרוֹలోని మానవ అంతర్గత వైఖరి మరియు దేవుని ముందస్తు జ్ఞానం
  choice: అతని అంతరంగపు మొగ్గు
  alternative: అతని ఊహ / అతని ఉద్దేశం / అతని స్వభావం
  rationale: దేవుడు ఇశ్రాయేలు అంతర్గత దిశను తెలిసికొనడం అనే వాక్యభారాన్ని నిలుపుతూ, దానిని ఒక నిర్దిష్ట తరువాతి మానవశాస్త్ర లేదా పాపసిద్ధాంత సూత్రంగా మార్చదు.
- issue: לְפָנָיו సాక్షి సందర్భంలో తటస్థమా, ప్రతికూలమా
  choice: అతని ఎదుట
  alternative: అతనికి వ్యతిరేకంగా
  rationale: సందర్భంలో గీతం ఆరోపణాత్మక సాక్షిగా పనిచేయవచ్చు; అయినా మూలంలోని ‘ఎదుట’ అనే స్థల/సన్నిధి భావాన్ని ప్రధాన పాఠం కాపాడి, బలమైన ప్రతికూల పఠనాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- issue: చివరి ప్రమాణ వాక్యంలో సూచిత క్రియను పూరించడం
  choice: నేను ప్రమాణం చేసిన దేశం
  alternative: ఇస్తానని నేను ప్రమాణం చేసిన దేశం
  rationale: ఒడంబడిక సందర్భం ‘ఇస్తానని’ అనే భావాన్ని సూచించినా, అందుబాటులోని హెబ్రీ పాఠంలో ఆ క్రియ లేదు; అందువల్ల ప్రధాన పాఠం సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇశ్రాయేలును హెబ్రీ మూలంలాగే ఏకవచన పురుషరూపంలో సూచించింది. ‘జవాబిస్తుంది’ ద్వారా గీతానికి ఇచ్చిన వ్యక్తీకరణను నిలిపింది; వాక్యభారం స్పష్టంగా ఉండేందుకు దీర్ఘ హెబ్రీ వాక్యాన్ని తెలుగు వాక్యాలుగా విభజించింది.
