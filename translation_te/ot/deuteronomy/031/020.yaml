id: DEU.31.20
reference: Deuteronomy 31:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: te
  text: ఎందుకంటే, నేను అతని పితరులకు ప్రమాణం చేసిన, పాలూ తేనెలూ ప్రవహించే దేశంలోకి అతణ్ణి తీసుకువచ్చినప్పుడు, అతడు తిని తృప్తిపడి బలిసిపోతాడు. అప్పుడు అతడు ఇతర దేవుళ్లవైపు తిరిగి, వారు వారిని సేవించి నన్ను తృణీకరిస్తారు; అతడు నా నిబంధనను ఉల్లంఘిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న హెచ్చరికకు కారణాన్ని పరిచయం చేస్తుంది; తరువాతి ‘తీసుకువచ్చినప్పుడు’ అనే నిర్మాణం దానిలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲבִיאֶנּוּ
  choice: అతణ్ణి తీసుకువచ్చినప్పుడు
  rationale: మూడవ పురుష ఏకవచన కర్మను నిలుపుతూ, ఇశ్రాయేలును ఒక సమష్టి ప్రజగా సూచించే హీబ్రూ రూపాన్ని కాపాడుతుంది; సందర్భంలోని భవిష్యత్ భావం తెలుగు కాలవాచక ఉపవాక్యంలో సహజంగా తెలుస్తుంది.
- source_word: הָאֲדָמָה
  choice: దేశం
  rationale: ఈ నిబంధనాత్మక, భౌగోళిక సందర్భంలో ఇది సాధారణ మట్టి లేదా నేలకంటే వాగ్దాన దేశాన్ని సూచిస్తుంది.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: నేను అతని పితరులకు ప్రమాణం చేసిన
  rationale: ‘అతని’ అనే ఏకవచన సమష్టి సూచనను, పితరులతో చేసిన నిబంధనాత్మక ప్రమాణ భావాన్ని నిలుపుతుంది.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: పాలు తేనెలు ప్రవహించే
  rationale: సమృద్ధిని తెలిపే మూలభాషలోని స్పష్టమైన రూపకాన్ని సహజమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది.
- source_word: וְשָׂבַע
  choice: తృప్తిపడి
  rationale: కడుపు నిండటంతోపాటు సమృద్ధి వల్ల కలిగే సంతృప్తిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וְדָשֵׁן
  choice: బలిసిపోతాడు
  rationale: సమృద్ధివల్ల లావెక్కడం అనే దృశ్యరూపకాన్ని ‘సంపన్నుడవుతాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: וּפָנָה אֶל
  choice: వైపు తిరిగి
  rationale: ఇతర దేవుళ్ల దిశగా విధేయతను మళ్లించడాన్ని స్పష్టంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: ‘విదేశీ దేవుళ్లు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా ‘ఇతర’ అనే మూలపద భావాన్ని నిలుపుతుంది.
- source_word: וַעֲבָדוּם
  choice: వారిని సేవిస్తాడు
  rationale: మతపరమైన సందర్భంలో సేవ మరియు ఆరాధన రెండింటినీ సూచించగల నిబంధనాత్మక విధేయత భాషను నిలుపుతుంది; క్రియ ఏకవచనంలో ఉంది.
- source_word: וְנִאֲצוּנִי
  choice: వారు నన్ను తృణీకరిస్తారు
  rationale: అవమానంతో నిరాకరించడం అనే క్రియ బలాన్ని, అలాగే ఈ ఒక్క చోట కనిపించే బహువచన కర్తను స్పష్టంగా నిలుపుతుంది.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: అతడు నా నిబంధనను ఉల్లంఘిస్తాడు
  rationale: క్రియ తిరిగి ఏకవచనానికి మారడాన్ని స్పష్టంగా చూపిస్తూ, నిబంధనను భంగపరచే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే సమష్టి ఏకవచనం మరియు బహువచన మార్పు
  choice: ‘అతణ్ణి/అతడు’ అనే ఏకవచనాన్ని నిలిపి, וְנִאֲצוּנִי వద్ద మాత్రమే ‘వారు’ అని బహువచనం చూపించి, తరువాత మళ్లీ ‘అతడు’ అని అనువదించడం.
  alternative: వచనమంతటినీ ‘వారిని/వారు’ అని బహువచనంగా లేదా వచనమంతటినీ ఏకవచనంగా క్రమబద్ధీకరించడం.
  rationale: హీబ్రూ ఇశ్రాయేలును ఒకే సమష్టి ప్రజగా పేర్కొంటూ, ఒక చోట ప్రజలలోని వ్యక్తులను సూచించేలా బహువచనానికి మారి, తరువాత తిరిగి ఏకవచనానికి వస్తుంది. ఈ మార్పును సరిచేయకుండా మూలంలోని ఉద్వేగాన్ని నిలుపడం సముచితం.
- issue: నిబంధనకు అవిశ్వాసాన్ని తెలిపే భాష
  choice: ‘ఇతర దేవుళ్లవైపు తిరిగి వారిని సేవిస్తాడు’ అని క్రియలను నేరుగా అనువదించడం.
  alternative: ‘విగ్రహారాధన చేస్తాడు’ లేదా ‘మతభ్రష్టుడవుతాడు’ అని సిద్ధాంతపరమైన సంగ్రహపదాలను ఉపయోగించడం.
  rationale: మూలవచనం చర్యలను స్వయంగా వర్ణిస్తుంది; వాటికి మించిన సిద్ధాంతపరమైన పేరును అనువాదంలో చేర్చకపోవడం మూలానికి నిబద్ధంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘పాలు తేనెలు ప్రవహించే,’ ‘పితరులు,’ ‘నిబంధన’ వంటి స్థిరమైన బైబిలు పదబంధాలను నిలుపుతూ, పాతబడిన క్రియారూపాలను నివారించాం. మూలంలోని అసాధారణ ఏకవచన–బహువచన మార్పు ప్రధాన పాఠ్యంలో స్పష్టంగా కనిపించేలా సర్వనామాలను ఉద్దేశపూర్వకంగా ఉంచాం.
