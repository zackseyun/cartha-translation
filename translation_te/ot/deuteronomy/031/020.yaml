revisions:
- from: ఎందుకంటే, పాలు తేనెలు ప్రవహించే, నేను అతని పితరులకు ప్రమాణం చేసిన దేశంలోకి అతణ్ణి తీసుకువచ్చినప్పుడు, అతడు తిని తృప్తిపడి బలిసిపోతాడు. అప్పుడు అతడు ఇతర దేవుళ్లవైపు తిరిగి వారిని సేవిస్తాడు; వారు[a] నన్ను తృణీకరిస్తారు[b], అతడు నా నిబంధనను ఉల్లంఘిస్తాడు.
  to: ఎందుకంటే, నేను అతని పితరులకు ప్రమాణం చేసిన, పాలూ తేనెలూ ప్రవహించే దేశంలోకి అతణ్ణి తీసుకువచ్చినప్పుడు, అతడు తిని తృప్తిపడి బలిసిపోతాడు. అప్పుడు అతడు ఇతర దేవుళ్లవైపు తిరిగి, వారు వారిని సేవించి నన్ను తృణీకరిస్తారు; అతడు నా నిబంధనను ఉల్లంఘిస్తాడు.
  rationale: వַעֲבָדוּם యొక్క బహువచనాన్ని ప్రధాన పాఠ్యంలో పునరుద్ధరించాం. దీంతో మూలంలోని వచన-మార్పు—ఆరంభంలో ఏకవచనం, ‘సేవించి/తృణీకరిస్తారు’ వద్ద బహువచనం, చివరలో ‘ఉల్లంఘిస్తాడు’ వద్ద తిరిగి ఏకవచనం—ఖచ్చితంగా ప్రతిఫలిస్తుంది. ప్రారంభంలోని విశేషణ పదబంధాల క్రమాన్ని సహజమైన తెలుగు వాక్యప్రవాహం కోసం మాత్రమే మార్చాం; అర్థంలో మార్పు లేదు.
