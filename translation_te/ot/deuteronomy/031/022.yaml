source:
  edition: WLC
  text: וַ/יִּכְתֹּ֥ב מֹשֶׁ֛ה אֶת הַ/שִּׁירָ֥ה הַ/זֹּ֖את בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יְלַמְּדָ֖/הּ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/022.yaml
  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: te
  text: ఆ రోజున మోషే ఈ గీతాన్ని రాసి, ఇశ్రాయేలు కుమారులకు[a] దాన్ని నేర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులకు,’ ‘ఇశ్రాయేలు ప్రజలకు,’ లేదా ‘ఇశ్రాయేలు సంతానానికి.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులకు’ అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలను సూచించే ప్రామాణిక ఒడంబడిక పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: రాసి
  rationale: כתב అనే క్రియ యొక్క సాధారణ కథనార్థం ‘రాయడం.’ వరుసగా జరిగిన క్రియలను సహజమైన తెలుగులో చూపేందుకు ‘రాసి’ అని అనువదించాం.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ఈ గీతాన్ని
  rationale: שִׁירָה అనేది ఇక్కడ కవితాత్మకంగా పాడే రచనను సూచిస్తుంది; ‘గీతం’ దాని సాహిత్య, ఒడంబడిక సందర్భాలకు తగిన గౌరవప్రదమైన తెలుగు పదం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలాన్ని నిర్దిష్టంగా సూచించే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: וַיְלַמְּדָהּ
  choice: దాన్ని నేర్పించాడు
  rationale: למד యొక్క పియేల్ రూపం ‘నేర్పించడం’ అని అర్థం; స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ‘గీతం’ను సూచిస్తున్నందున ‘దాన్ని’ అని స్పష్టంగా ఉంచాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పురుష బహువచన ఒడంబడిక పదబంధాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమష్టి పదబంధం
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలీయులకు; ఇశ్రాయేలు ప్రజలకు; ఇశ్రాయేలు సంతానానికి
  rationale: హీబ్రూ రూపంలోని ‘కుమారులు’ అనే స్పష్టమైన పురుష బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ క్రియల వరుసను తెలుగులో ‘రాసి … నేర్పించాడు’గా ప్రవాహవంతంగా వ్యక్తం చేశాం; మూలంలోని సమష్టి పురుష పదబంధాన్ని పాదసూచికతో సహా నిలిపాం.
