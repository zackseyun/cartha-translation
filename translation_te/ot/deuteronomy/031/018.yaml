source:
  edition: WLC
  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: te
  text: ఆ రోజున, అతడు చేసిన సమస్త చెడు కారణంగా, నేను స్వయంగా నా ముఖాన్ని[a] తప్పక దాచిపెడతాను; ఎందుకంటే అతడు ఇతర దేవుళ్ల వైపు తిరిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘నా ముఖం.’ ఇది దేవుడు తన అనుగ్రహాన్ని లేదా సాన్నిధ్యాన్ని ఉపసంహరించుకోవడాన్ని సూచించే నుడికారం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: నేను
  rationale: אָנֹכִי నొక్కి చెప్పే ప్రథమ పురుష ఏకవచన సర్వనామం. తెలుగులో వాక్యకర్తను స్పష్టంగా ఉంచడం ద్వారా ఆ నొక్కును సహజంగా తెలియజేస్తుంది; సందర్భంలో וְ అనుసంధాన భావాన్ని ఇస్తున్నా, ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం తెలుగు ప్రవాహానికి అవసరం లేదు.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: తప్పక దాచుకుంటాను
  rationale: క్రియావిశేష బలాన్ని ఇచ్చే infinitive absolute + finite verb నిర్మాణాన్ని ‘తప్పక’ ద్వారా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פָּנַי
  choice: నా ముఖాన్ని
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన రూపకాన్ని అలాగే ఉంచుతుంది; దైవిక సాన్నిధ్యం లేదా అనుగ్రహం ఉపసంహరణ అనే భావాన్ని ప్రధాన వాక్యంలో వ్యాఖ్యానంగా చేర్చదు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలాన్ని, నిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: עַל כָּל הָרָעָה
  choice: చెడంతటి కారణంగా
  rationale: עַל యొక్క కారణార్థాన్ని ‘కారణంగా’ స్పష్టంగా తెలియజేస్తుంది; רָעָה ఇక్కడ నైతిక చెడును సూచిస్తుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: అతడు చేసిన
  rationale: హీబ్రూలోని మూడవ పురుష ఏకవచనాన్ని నిలుపుతుంది. సందర్భంలో ఇశ్రాయేలు సమష్టిగా ఒక వ్యక్తిలా సూచించబడుతోంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాతి ఉపవాక్యం ముందు చెప్పిన చెడుకు, దైవిక ప్రతిస్పందనకు కారణాన్ని వివరిస్తుంది.
- source_word: פָנָה אֶל
  choice: వైపు తిరిగాడు
  rationale: దిశతో పాటు విధేయత లేదా ఆరాధన మార్పును సూచించే మూలభాషా ప్రయోగాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: యెహోవా కాక ఇతర దేవతలను సూచించే పదబంధానికి నేరమైన, సాధారణ తెలుగు రూపం.
theological_decisions:
- issue: దేవుడు తన ముఖాన్ని దాచుకోవడం అనే మానవరూపక వ్యక్తీకరణ
  choice: ‘నా ముఖాన్ని ... దాచుకుంటాను’ అని ప్రధాన వాక్యంలో నిలుపడం
  alternative: ‘నా సాన్నిధ్యాన్ని ఉపసంహరించుకుంటాను’ లేదా ‘అతనికి విముఖుడనవుతాను’
  rationale: మూల హీబ్రూ ‘నా ముఖం’ అనే స్పష్టమైన రూపకాన్నే వాడుతుంది. దానిని సాన్నిధ్యం లేదా అనుగ్రహం గురించిన వ్యాఖ్యానంగా మార్చకుండా, అసలు వాక్యంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ఇశ్రాయేలును ఏకవచనంగా సూచించడం
  choice: ‘అతడు చేసిన ... అతడు ... తిరిగాడు’ అనే ఏకవచనం
  alternative: ‘వారు చేసిన ... వారు తిరిగారు’ అనే బహువచనం
  rationale: హీబ్రూ క్రియలు పుంలింగ ఏకవచనంలో ఉన్నాయి; ఇశ్రాయేలు జనాన్ని సమష్టి వ్యక్తిగా చూపే మూలరూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘నా ముఖాన్ని దాచుకుంటాను’ అనే మూలభాషా రూపకాన్ని గౌరవప్రదంగా అలాగే ఉంచింది.
