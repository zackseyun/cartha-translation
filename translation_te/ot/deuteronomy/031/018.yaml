revisions:
- from: ఆ రోజున అతడు చేసిన చెడంతటి కారణంగా నేను నా ముఖాన్ని తప్పక దాచుకుంటాను[a]; ఎందుకంటే అతడు ఇతర దేవుళ్లవైపు తిరిగాడు.
  to: ఆ రోజున, అతడు చేసిన సమస్త చెడు కారణంగా, నేను స్వయంగా నా ముఖాన్ని[a] తప్పక దాచిపెడతాను; ఎందుకంటే అతడు ఇతర దేవుళ్ల వైపు తిరిగాడు.
