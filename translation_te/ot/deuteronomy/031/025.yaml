source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת הַ/לְוִיִּ֔ם נֹ֥שְׂאֵ֛י אֲר֥וֹן בְּרִית יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: te
  text: 'మోషే యాహ్వే నిబంధన మందసాన్ని మోసేవారైన లేవీయులకు[a] ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నిబంధన మందసాన్ని మోసేవారైన లేవీయులకు.” హీబ్రూ కృదంతాన్ని బిరుదువంటి వివరణగా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ ఇక్కడ స్పష్టమైన ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఆజ్ఞాపించాడు’ సహజమైన, నేరమైన అనువాదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులకు
  rationale: నిర్దిష్ట బహువచన గోత్ర/వర్గ నామానికి తెలుగులో స్థిరంగా వాడే రూపం ‘లేవీయులు’; క్రియకు అనుగుణంగా చతుర్థీ విభక్తి వాడబడింది.
- source_word: נֹשְׂאֵי
  choice: మోసే
  rationale: נשׂא యొక్క కృదంత రూపం లేవీయులను మందసం మోసేవారిగా విశేషిస్తుంది. ‘మోసే’ ఆ కృదంత స్వభావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: אֲרוֹן
  choice: మందసం
  rationale: నిబంధన/పరిశుద్ధస్థల సందర్భంలో אֲרוֹן సాధారణ పెట్టె కాదు, పవిత్ర మందసం; ‘మందసం’ తెలుగు బైబిలు భాషలో స్థిరమైనదీ అర్థవంతమైనదీ.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: אֲרוֹן‌తో నిర్మాణ సంబంధంలో ఇది ‘నిబంధన మందసం’ అనే స్థిర భావాన్ని ఇస్తుంది; ఒడంబడిక సంబంధిత ప్రాముఖ్యతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సూత్రప్రయోగం. తెలుగులో ‘ఇలా ఆజ్ఞాపించాడు:’ అనేది సహజంగా అదే కార్యాన్ని నిర్వహిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది. కాబట్టి దైవనామాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘ప్రభువు’ అని మార్చడం మూలంలోని వ్యక్తినామాన్ని మరుగుపరుస్తుంది.
- issue: נֹשְׂאֵי యొక్క కృదంత భావం
  choice: మోసే లేవీయులు
  alternative: మందసాన్ని మోయువారైన లేవీయులు
  rationale: ఈ రూపం సందర్భానుసారంగా ప్రస్తుతం మోసే కార్యాన్నీ, వారి పాత్రను సూచించే వర్ణననూ అనుమతిస్తుంది. ‘మోసే’ అని ఉంచడం ద్వారా ఆ స్వల్ప సందిగ్ధతను అనవసరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ప్రత్యక్ష వాక్యం తదుపరి వచనంలో మొదలవుతుందని సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
