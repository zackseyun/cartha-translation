id: DEU.31.29
reference: Deuteronomy 31:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: te
  text: ఎందుకంటే, నేను చనిపోయిన తరువాత మీరు తప్పకుండా చెడిపోతారని[a], నేను మీకు ఆజ్ఞాపించిన మార్గం నుండి తొలగిపోతారని నాకు తెలుసు. మీరు యాహ్వే దృష్టిలో చెడ్డది చేసి, మీ చేతుల పనివల్ల ఆయనకు కోపం పుట్టిస్తారు కాబట్టి, చివరి రోజుల్లో[b] విపత్తు[c] మీకు సంభవిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని మీరు చెడగొట్టుకుంటారని’ లేదా ‘పూర్తిగా చెడిపోతారని.’ హీబ్రూలో ‘చెడిపోవడం/చెడగొట్టడం’ అనే క్రియ బలంగా చెప్పబడింది; ఇక్కడ దాన్ని ఆత్మార్థకంగా లేదా అకర్మకంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘చివరి రోజుల్లో’ అనే మాటకు ‘రాబోయే రోజుల్లో’ అని కూడా అర్థం కావచ్చు. ఇది భవిష్యత్తును సూచిస్తుంది; సందర్భాన్ని బట్టి అంత్యకాల భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘కీడు’ లేదా ‘ఆపద.’ హీబ్రూ רָעָה అనే పదం నైతిక చెడును మాత్రమే కాకుండా హాని, ఆపద లేదా విపత్తును కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: ఎందుకంటే ... నాకు తెలుసు
  rationale: మునుపటి మాటకు కారణాన్ని తెలియజేసే כִּי భావాన్ని, మోషేకు ఉన్న నిశ్చయమైన జ్ఞానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי מוֹתִי
  choice: నేను చనిపోయిన తరువాత
  rationale: హీబ్రూ నామవాచక నిర్మాణంలోని అర్థాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: మీరు తప్పకుండా చెడిపోతారని
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని తీవ్రతను ‘తప్పకుండా’ తెలియజేస్తుంది; కర్మను చేర్చకుండా ఆత్మార్థక/అకర్మక సందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: మార్గం నుండి తొలగిపోతారని
  rationale: ఆజ్ఞాపించిన జీవన మార్గాన్ని విడిచిపెట్టడాన్ని సూచించే నిబంధనాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: నేను మీకు ఆజ్ఞాపించిన
  rationale: మోషేనే మాట్లాడుతున్నాడనే విషయాన్ని, ఆజ్ఞ యొక్క ప్రత్యక్షతను స్పష్టంగా ఉంచుతుంది.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: విపత్తు మీకు సంభవిస్తుంది
  rationale: קרא + רעה నిర్మాణం ఇక్కడ హానికరమైన ఘటన ఒకరిపైకి రావడాన్ని సూచిస్తుంది; ‘విపత్తు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: చివరి రోజుల్లో
  rationale: భవిష్యత్తును సూచించే పదబంధానికి దగ్గరగా ఉండి, దానిలో ఉండగల అంత్యకాల ప్రతిధ్వనిని ముందుగానే ఒక నిర్దిష్ట సిద్ధాంతంగా పరిమితం చేయదు.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: మీరు ... చెడ్డది చేసి ... కాబట్టి
  rationale: కారణ సంబంధాన్ని, యాహ్వే తీర్పు ప్రకారం చెడ్డదైన కార్యాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: దేవుని మూల్యాంకనాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా అందిస్తుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయదు.
- source_word: לְהַכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టిస్తారు
  rationale: హిఫిల్ క్రియలోని కారణార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: మీ చేతుల పనివల్ల
  rationale: విగ్రహాలను సూచించే అవకాశం ఉన్నప్పటికీ మూలంలో వాటిని ప్రత్యక్షంగా పేర్కొనలేదు; అందువల్ల రూపకాన్నీ అస్పష్టతనూ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: בְּאַחֲרִית הַיָּמִים యొక్క కాలసంబంధ భావం
  choice: చివరి రోజుల్లో
  alternative: రాబోయే రోజుల్లో
  rationale: పదబంధంలోని భవిష్యదర్థం మరియు ఉండగల అంత్యకాల బరువు రెండింటినీ నిలుపుతూ, ఒక నిర్దిష్ట అంత్యకాల పద్ధతిని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినప్పటికీ కారణ సంబంధం, ప్రవచన నిశ్చయత, నిబంధనాత్మక ‘మార్గం’ రూపకం, ‘చేతుల పని’ అనే ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
