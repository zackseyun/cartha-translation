  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: te
  text: యాహ్వే మేఘస్తంభంలో గుడారంలో ప్రత్యక్షమయ్యాడు; ఆ మేఘస్తంభం గుడారపు ప్రవేశద్వారం దగ్గర నిలిచింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారపు ప్రవేశద్వారం పైన.” ఇక్కడి హీబ్రూ ఉపసర్గకు “దగ్గర” అనే అర్థంతో పాటు “పై/ఎగువన” అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమయ్యాడు
  rationale: ראה నిఫాల్ రూపం ఇక్కడ కనబడే దైవ ప్రత్యక్షతను సూచిస్తుంది. ‘ప్రత్యక్షమయ్యాడు’ సహజమైన తెలుగు పదం; ప్రత్యక్షత ఎలా జరిగిందో అదనంగా నిర్వచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది; దాని స్థానంలో బిరుదును పెట్టదు.
- source_word: בָּאֹהֶל
  choice: గుడారంలో
  rationale: אֹהֶלకు నేరమైన అర్థం ‘గుడారం.’ సందర్భంలో ఇది ప్రత్యక్షపు గుడారాన్ని సూచించినా, మూలపాఠంలో ఉన్న సాధారణ రూపాన్నే అనువాదం నిలుపుతుంది.
- source_word: בְּעַמּוּד עָנָן
  choice: మేఘస్తంభంలో
  rationale: בְּ ఉపసర్గను ‘లో’ అనే భావంతో నిలిపి, యెహోవా ప్రత్యక్షమైన మాధ్యమాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది. హీబ్రూలో నిర్దేశక ఉపపదం లేకపోయినా తెలుగులో ‘ఒక’ చేర్చడం అవసరం కాదు.
- source_word: וַיַּעֲמֹד
  choice: నిలిచింది
  rationale: עמד యొక్క concrete spatial అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: עַמּוּד הֶעָנָן
  choice: ఆ మేఘస్తంభం
  rationale: ముందు ప్రస్తావించిన మేఘస్తంభాన్నే తిరిగి సూచిస్తున్నందున ‘ఆ’ సహజంగా నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: ఈ స్థలసంబంధ సందర్భంలో עַל‌ను ‘దగ్గర’గా అనువదించడం సహజం; అయితే ‘పై/ఎగువన’ అనే మరింత అక్షరార్థ అవకాశాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు బాగా తెలిసిన రూపాన్ని ఉపయోగించింది.
- issue: దైవ ప్రత్యక్షత స్వరూపం
  choice: మేఘస్తంభంలో గుడారంలో ప్రత్యక్షమయ్యాడు
  alternative: గుడారం దగ్గర మేఘస్తంభంగా కనిపించాడు
  rationale: దేవుడు మేఘస్తంభమే అని సమీకరించకుండా, అలాగే ప్రత్యక్షతను అమూర్తంగా మార్చకుండా, మూలంలోని రెండు בְּ సంబంధాలను మరియు రహస్యభావాన్ని నిలుపుతుంది.
- issue: మేఘస్తంభం ఉన్న స్థానం
  choice: ప్రవేశద్వారం దగ్గర
  alternative: ప్రవేశద్వారం పై/ఎగువన
  rationale: సన్నివేశానికి సహజమైన స్థలార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, עַלలో ఉన్న ప్రత్యామ్నాయ స్థానార్థాన్ని పాదటిప్పణిలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి. మూలంలోని ‘గుడారం’ అనే సాధారణ పదాన్ని నిలిపి, సందర్భం ఆధారంగా ‘ప్రత్యక్షపు గుడారం’ అని ప్రధాన పాఠంలో విస్తరించలేదు. రెండు వరుస వాక్యభాగాల స్పష్టత కోసం అర్ధవిరామం వాడబడింది.
