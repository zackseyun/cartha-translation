  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: te
  text: యెహోవా వారిని మీకు అప్పగిస్తాడు. నేను మీకు ఆజ్ఞాపించిన ఆజ్ఞ అంతటినీ అనుసరించి మీరు వారికి చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: యెహోవా వారిని మీకు అప్పగిస్తాడు
  rationale: נתן + לפני అనే హీబ్రూ ప్రయోగం సందర్భంలో శత్రువులను ఇశ్రాయేలీయుల అధికారానికి అప్పగించడాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘మీకు అప్పగిస్తాడు’ అని ఇచ్చాం.
- source_word: כְּכָל הַמִּצְוָה
  choice: ఆజ్ఞ అంతటి ప్రకారం
  rationale: כְּכָל యొక్క సంపూర్ణతను, הַמִּצְוָה యొక్క ఏకవచన రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: నేను మీకు ఆజ్ఞాపించిన
  rationale: మోషే మాట్లాడుతున్న ప్రథమ పురుష రూపాన్నీ, ఇశ్రాయేలీయులను ఉద్దేశించిన బహువచన రూపాన్నీ నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలోని వ్యక్తిగత దైవనామాన్ని తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన రూపంలో స్పష్టంగా నిలుపుతుంది; ఇది సాధారణ బిరుదుగా మార్చదు.
- issue: శత్రువులపై చేయవలసిన కార్యం యొక్క వివర స్థాయి
  choice: మీరు వారికి చేయాలి
  alternative: మీరు వారిని నిర్మూలించాలి
  rationale: ఈ వచనం క్రియను సాధారణంగానే ఉంచి ముందుగా ఇచ్చిన ఆజ్ఞను సూచిస్తుంది. సందర్భం ఆధారంగా నిర్దిష్ట చర్యను చేర్చకుండా మూలంలోని సూచనాత్మక నిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హీబ్రూ వాక్యంలోని రెండు సమన్విత భాగాలను తెలుగులో రెండు వాక్యాలుగా ఇచ్చి పఠనసౌలభ్యాన్ని పెంచాం.
