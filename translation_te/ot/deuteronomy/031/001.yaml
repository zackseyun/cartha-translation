translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మాటలన్నిటిని’ మూలంలోని ‘ఈ మాటలు’ భావాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలీయులందరితో’ సాధారణ పాఠకులకు జాతీయ సమూహాన్ని స్పష్టంగా తెలియజేస్తుంది. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
