  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: te
  text: అప్పుడు మోషే వెళ్లి ఇశ్రాయేలు ప్రజలందరికీ ఈ మాటలను చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు మోషే వెళ్లి ఇశ్రాయేలు ప్రజలందరికీ ఈ మాటలను చెప్పాడు.” ప్రారంభ సంధిపదాన్ని మరింత రూపానుగుణంగా ‘మరియు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך అనే క్రియకు ఇక్కడ సహజమైన సాధారణ అర్థం ‘వెళ్లాడు.’ గమ్యస్థానం చెప్పబడకపోయినా, సందర్భం బలవంతం చేయనందున ‘కొనసాగించాడు’ వంటి వ్యాఖ్యానాత్మక భావాన్ని చేర్చలేదు.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר పియేల్ రూపం ‘మాట్లాడు/చెప్పు’ అని అర్థం. ‘ఈ మాటలు’ అనే కర్మతో ఆధునిక తెలుగులో ‘చెప్పాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటిని
  rationale: ‘ఈ మాటలు’ అనే మూలంలోని పదరూపాన్ని నిలుపుతూ, వాక్యంలోని సమగ్ర ప్రసంగ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరితో
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు అంతటితో/ఇశ్రాయేలు అంతటికీ.’ అయితే ప్రజలను ఉద్దేశించి మాట్లాడడాన్ని ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులందరితో’ సహజంగా తెలియజేస్తుంది; జాతీయ సమూహ సమగ్రతను ‘అందరితో’ నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభంలోని వావ్ కథనాన్ని ముందుకు నడిపే క్రమసూచకంగా పనిచేస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ వరుస భావాన్ని సహజంగా ఇస్తుంది; మరింత రూపానుగుణంగా ‘మరియు’ అనవచ్చు.
