id: DEU.31.11
reference: Deuteronomy 31:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: te
  text: ఇశ్రాయేలీయులందరూ నీ దేవుడైన యాహ్వే సన్నిధిలో హాజరు కావడానికి ఆయన ఎన్నుకునే స్థలానికి వచ్చినప్పుడు, నీవు ఇశ్రాయేలీయులందరి ఎదుట వారికి వినిపించేలా ఈ ధర్మశాస్త్రాన్ని చదవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “నీ దేవుడైన యాహ్వే ముఖాన్ని చూడడానికి.” ఇది ఆయన సన్నిధిలో హాజరు కావడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ ... వచ్చినప్పుడు
  rationale: ב + క్రియార్థక నామరూపం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. సమూహవాచకమైన ‘ఇశ్రాయేలు అంతా’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులందరూ’ అని వ్యక్తం చేశాం.
- source_word: לֵרָאוֹת אֶת־פְּנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో కనిపించడానికి
  rationale: అక్షరార్థంగా ‘యాహ్వే ముఖాన్ని చూడడానికి’ అయిన ఈ ఆరాధనా సందర్భపు నుడికారం దేవుని సన్నిధిలో హాజరు కావడాన్ని సూచిస్తుంది. ‘సన్నిధిలో కనిపించడానికి’ మూలంలోని దర్శన/హాజరు భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం. రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీ’గా ఉంచి, ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధించే మూలరూపాన్ని కాపాడాం.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: ఆయన ఎన్నుకునే స్థలానికి
  rationale: దేవుడు నిర్ణయించే ఆరాధనా స్థలం అనే ద్వితీయోపదేశకాండపు భావాన్ని నిలుపుతూ, తెలుగు గమనక్రియ ‘వచ్చినప్పుడు’తో సహజంగా సరిపడేలా ‘స్థలానికి’ వాడాం. అసంపూర్ణ క్రియారూపంలోని భవిష్యదర్థం ‘ఎన్నుకునే’లో వ్యక్తమవుతుంది.
- source_word: תִּקְרָא אֶת־הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రాన్ని చదవాలి
  rationale: ఇక్కడ קרא అనేది వ్రాతపూర్వక తోరాను సభలో బిగ్గరగా చదవడాన్ని సూచిస్తుంది. תורה యొక్క నిబంధనాత్మక బోధ/చట్ట భావాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ధర్మశాస్త్రం’తో తెలిపాం.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి ఎదుట
  rationale: సమావేశమైన ప్రజల సమక్షంలో బహిరంగంగా చదవడం అనే భావాన్ని ‘ఎదుట’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּאָזְנֵיהֶם
  choice: వారికి వినిపించేలా
  rationale: అక్షరార్థమైన ‘వారి చెవుల్లో’ అనే హెబ్రీ నుడికారం శ్రవణయోగ్యమైన బహిరంగ పఠనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో దాని కార్యార్థాన్ని సహజంగా తెలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామమైన చతురక్షర నామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: לֵרָאוֹת אֶת־פְּנֵי యొక్క ఆరాధనా నుడికారం
  choice: సన్నిధిలో కనిపించడానికి
  alternative: ముఖాన్ని చూడడానికి / సన్నిధికి హాజరు కావడానికి
  rationale: అక్షరార్థ రూపాన్ని ప్రధాన పాఠంలో ఉంచితే దేవుని ముఖాన్ని కళ్లతో చూడడం అనే అపార్థం కలగవచ్చు. అయినా మూలంలోని ‘కనిపించు/చూడు’ భాషను పూర్తిగా చెరపకుండా ‘కనిపించడానికి’ అని ఉంచి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. ‘ధర్మశాస్త్రం’ సుపరిచితమైన బైబిలు పదం; వాక్య నిర్మాణం మాత్రం అనవసరమైన ప్రాచీనత లేకుండా సహజంగా ఉంచబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో పొందుపరచబడింది.
