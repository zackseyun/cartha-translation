  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలవాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున అనువాదాన్ని కామాతో ముగించాం. అన్ని పాదటిప్పణి గుర్తులను సంబంధిత పదబంధాల వెంట ఉంచాం.
