source:
  edition: WLC
  text: וַ/יְצַ֥ו מֹשֶׁ֖ה אוֹתָ֣/ם לֵ/אמֹ֑ר מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֗ים בְּ/מֹעֵ֛ד שְׁנַ֥ת הַ/שְּׁמִטָּ֖ה בְּ/חַ֥ג הַ/סֻּכּֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: te
  text: 'మోషే వారికి ఇలా ఆజ్ఞాపించాడు: “ప్రతి ఏడు సంవత్సరాల ముగింపులో[a], విడుదల సంవత్సరపు నిర్ణీత సమయంలో, పర్ణశాలల పండుగ[c] నాడు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడు సంవత్సరాల ముగింపులో.” హీబ్రూ పదబంధాన్ని ఇలా మరింత రూపానుసారంగా అనువదించవచ్చు; అయితే సందర్భం పునరావృతమయ్యే ఏడేళ్ల చక్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “పర్ణశాలలు” అంటే తాత్కాలికంగా వేసుకునే గుడారాలు లేదా పాకలు; దీనిని “గుడారాల పండుగ” అని కూడా అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియలో ఉన్న స్పష్టమైన ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אוֹתָם
  choice: వారికి
  rationale: హీబ్రూలో ఇది పురుష బహువచన ప్రత్యక్ష కర్మ సర్వనామం. తెలుగులో ‘ఆజ్ఞాపించాడు’తో ‘వారికి’ సహజమైన ప్రయోగం; దాని సూచితులు సందర్భం ద్వారా తెలుస్తారు.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: ప్రతి ఏడు సంవత్సరాల ముగింపులో
  rationale: מִקֵּץ అంటే ‘ముగింపులో’; ధర్మశాస్త్రంలోని పునరావృత ఏడేళ్ల చక్రాన్ని ‘ప్రతి’ స్పష్టం చేస్తుంది, అయితే మరింత రూపానుసారమైన పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּמוֹעֵד
  choice: నియమిత సమయంలో
  rationale: מוֹעֵד సూచించే ముందుగా నిర్ణయించబడిన సమయం లేదా సందర్భాన్ని ఖచ్చితంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: విడుదల సంవత్సరం
  rationale: שְׁמִטָּהలోని అప్పుల విడుదల లేదా మాఫీ భావాన్ని నేరుగా, అందరికీ అర్థమయ్యేలా వ్యక్తపరుస్తుంది.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: పర్ణశాలల పండుగ నాడు
  rationale: חַגను ‘పండుగ’గా, סֻכּוֹתను తాత్కాలిక నివాసాల భావాన్ని మోసే సుపరిచిత తెలుగు బైబిలు పదమైన ‘పర్ణశాలలు’గా అనువదిస్తుంది.
