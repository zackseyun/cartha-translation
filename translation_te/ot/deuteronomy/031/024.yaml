source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת מֹשֶׁ֗ה לִ/כְתֹּ֛ב אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את עַל סֵ֑פֶר עַ֖ד תֻּמָּֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: te
  text: మోషే ఈ ధర్మశాస్త్రంలోని మాటలను ఒక గ్రంథంలో[a] రాయడం, వాటి రచన పూర్తయ్యే వరకు, ముగించినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక వ్రాతపత్రం మీద’ లేదా ‘ఒక చుట్ట మీద’; హీబ్రూ ספר అనే పదం ఆధునిక అర్థంలోని బౌండ్ పుస్తకాన్ని మాత్రమే కాకుండా వ్రాతపత్రాన్ని లేదా చుట్టను కూడా సూచించగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: '...ప్పుడు'
  rationale: వావ్-కన్సెక్యూటివ్‌తో కూడిన היה కథనంలోని తదుపరి ఘట్టాన్ని పరిచయం చేస్తుంది. తెలుగులో కాలార్థక ఉపవాక్యంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: כְּכַלּוֹת
  choice: రాయడం ముగించినప్పుడు
  rationale: כ + כלה క్రియానామ రూపం కాలాన్ని, పూర్తిచేయడాన్ని సూచిస్తుంది; ‘ముగించినప్పుడు’ రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לִכְתֹּב
  choice: రాయడం
  rationale: כלה ఆధీనంలోని క్రియానామాన్ని తెలుగులో ‘రాయడం ముగించాడు’ అనే సహజ నిర్మాణంతో అనువదించాం.
- source_word: דִּבְרֵי
  choice: మాటలను
  rationale: వ్రాయబడిన విషయాన్ని సూచించే דבר యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాత్మక-న్యాయ సందర్భంలో תורהకు ‘ధర్మశాస్త్రం’ స్పష్టమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: עַל סֵפֶר
  choice: ఒక గ్రంథపు చుట్టలో[a]
  rationale: ספר వ్రాతపత్రం లేదా గ్రంథపు చుట్టను సూచించగలదు. ప్రాచీన లిఖిత రూపాన్ని ఆధునిక బౌండ్ పుస్తకంగా అపార్థం చేసుకోకుండా ‘గ్రంథపు చుట్ట’ అని ఇచ్చాం; עַל‌ను తెలుగు మాధ్యమార్థక వాడుకకు అనుగుణంగా ‘లో’తో సహజీకరించాం.
- source_word: עַד תֻּמָּם
  choice: పూర్తిగా
  rationale: ఈ పదబంధం ఆ మాటలన్నీ అంతం వరకు, సంపూర్ణంగా వ్రాయబడినట్లు సూచిస్తుంది. తెలుగులో ‘పూర్తిగా’ సంక్షిప్తంగా, సహజంగా ఆ పరిమితి భావాన్ని అందిస్తుంది.
