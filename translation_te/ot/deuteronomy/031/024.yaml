  rationale: 'ప్రధాన పాఠంలో ספרకు విస్తృతమైన ‘గ్రంథం’ అనే పదాన్ని వాడి, చుట్ట లేదా వ్రాతపత్రం అనే సాధ్యమైన భౌతిక రూపాలను పాదటిప్పణిలో ఉంచాం. עַד תֻּמָּםలోని ‘పూర్తి వరకు’ భావాన్ని ‘వాటి రచన పూర్తయ్యే వరకు’ ద్వారా స్పష్టపరిచాం. అయితే తెలుగు వాక్యనిర్మాణంలో ‘రాయడం ... ముగించినప్పుడు’ మధ్య విరామం కొంచెం భారంగా ఉంటుంది; అందువల్ల సహజమైన, మూలానికి సమానమైన ప్రత్యామ్నాయం: ‘మోషే ఈ ధర్మశాస్త్రంలోని మాటలను ఒక గ్రంథంలో[a] పూర్తిగా రాసి ముగించినప్పుడు,’ కూడా ఆమోదయోగ్యం. ఈ సవరణ పాఠంలో మొదటి రూపం ప్రత్యక్షంగా పూర్తి-పరిమితిని నిలుపుతుంది.'
