id: DEU.31.4
reference: Deuteronomy 31:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: te
  text: యెహోవా అమోరీయుల రాజులైన సీహోనుకూ ఓగుకూ, వారి దేశానికీ చేసినట్లే, వారిని నాశనం చేసినప్పుడు, వీరికీ చేస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచాం.
- source_word: לָהֶם
  choice: వీరికీ
  rationale: సందర్భంలో సమీపంగా ప్రస్తావించబడిన ప్రజలను సూచించే సహజమైన తెలుగు సర్వనామం.
- source_word: הִשְׁמִיד
  choice: నాశనం చేసిన
  rationale: హిఫీల్ క్రియలోని పూర్తిగా నిర్మూలించడం లేదా నశింపజేయడం అనే బలమైన భావాన్ని నిలిపాం.
- source_word: אֲשֶׁר
  choice: చేసి, వారిని నాశనం చేసినట్లే
  rationale: హీబ్రూ సంబంధవాచకానికి సందర్భానుసారంగా కాలసంబంధ భావం రావచ్చని అంగీకరిస్తూ, తెలుగులో సంఘటనల సంబంధాన్ని సహజంగా వ్యక్తపరిచాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పారదర్శకంగా నిలిపాం.
- issue: אֲשֶׁר యొక్క సంబంధం
  choice: వారి దేశానికి చేసిన కార్యంలో వారిని నాశనం చేయడాన్ని భాగంగా చూపే వాక్యనిర్మాణం
  alternative: ‘వారి దేశాన్ని నాశనం చేశాడు’ అని దేశాన్నే ప్రత్యక్ష కర్మగా చూపడం
  rationale: మూలంలో אֹתָם అనే పురుష బహువచన సర్వనామం ఉంది; అది సీహోను, ఓగు మరియు వారి పక్షాన్ని సూచించగలదు. అందువల్ల ‘వారిని’ అనే సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని వరుస క్రియలను తెలుగు సహజత్వం కోసం సమీకరించాం.
