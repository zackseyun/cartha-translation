  to: బలంగా, ధైర్యంగా ఉండండి. వారికి భయపడకండి; వారి కారణంగా భీతిల్లకండి[a]. ఎందుకంటే మీ దేవుడైన యాహ్వే తానే మీతో పాటు వెళ్తున్నాడు. ఆయన మిమ్మల్ని జారవిడువడు[b], మిమ్మల్ని విడిచిపెట్టడు.
  rationale: Two minor source-fidelity refinements remove an unnecessary visual nuance from ‘వారిని చూసి’ and avoid the directional implication of ‘వస్తున్నాడు.’ Footnote b is revised to match the plural addressees of the translation. No theological interpretation has been added.
