source:
  edition: WLC
  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: te
  text: బలంగా, ధైర్యంగా ఉండండి. వారికి భయపడకండి; వారి కారణంగా భీతిల్లకండి[a]. ఎందుకంటే మీ దేవుడైన యాహ్వే తానే మీతో పాటు వెళ్తున్నాడు. ఆయన మిమ్మల్ని జారవిడువడు[b], మిమ్మల్ని విడిచిపెట్టడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండవ క్రియ మొదటిదానికంటే తీవ్రమైనది; అది భయంతో భీతిల్లడం లేదా వణికిపోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘మిమ్మల్ని తన పట్టు నుండి విడిచిపెట్టడు’ లేదా ‘మిమ్మల్ని జారవిడువడు’ అనే భావం ఉంది; యాహ్వే ఆదుకోకుండా వదలడని ఇది హామీ ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: బలంగా, ధైర్యంగా ఉండండి
  rationale: జంట ఆజ్ఞలైన ‘బలంగా ఉండండి, ధైర్యంగా ఉండండి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: భయపడకండి; ... భీతిల్లకండి
  rationale: మొదటి క్రియ సాధారణ భయాన్ని, రెండవది మరింత తీవ్రమైన భయాందోళనను సూచిస్తుంది; రెండు క్రియల మధ్య తీవ్రత వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: מִפְּנֵיהֶם
  choice: వారిని చూసి
  rationale: అక్షరార్థంగా ‘వారి సమక్షం వల్ల/వారి ఎదుట’; ఈ సందర్భంలో భయానికి కారణమైన వారి సన్నిధిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: తానే మీతో వస్తున్నాడు
  rationale: הוּא ఇచ్చే ఉద్ఘాటనను ‘తానే’ నిలుపుతుంది; క్రియావిశేషణ రూపం కొనసాగుతున్న సహవాసాన్ని తెలియజేస్తుంది.
- source_word: לֹא יַרְפְּךָ
  choice: ఆయన మిమ్మల్ని జారవిడువడు
  rationale: רפה హిఫిల్ రూపంలోని ‘పట్టు సడలించడం/జారవిడవడం’ అనే చిత్రాన్ని నిలుపుతూ, తరువాతి ‘విడిచిపెట్టడు’తో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: మిమ్మల్ని విడిచిపెట్టడు
  rationale: עזב యొక్క ‘వదిలివేయడం, త్యజించడం’ అనే భావాన్ని సాధారణమైనప్పటికీ గంభీరమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: יַרְפְּךָ మరియు יַעַזְבֶךָ అనే రెండు హామీ క్రియల భేదం
  choice: జారవిడువడు ... విడిచిపెట్టడు
  alternative: విఫలం చేయడు ... త్యజించడు
  rationale: మొదటి క్రియలోని పట్టును సడలించకపోవడం అనే రూపకాన్ని, రెండవ క్రియలోని విడిచిపెట్టకపోవడం అనే భావాన్ని వేర్వేరుగా ఉంచి ద్విగుణ హామీని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక సంబోధనకు గౌరవ/బహువచన రూపాలను వాడింది. వాక్యానికి గంభీరతను ఉంచుతూ అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది; మూలంలోని ఉద్ఘాటనను ‘తానే’ ద్వారా నిలిపింది.
