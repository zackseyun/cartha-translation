source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: te
  text: 'అప్పుడు మోషే యెహోషువను పిలిచి, ఇశ్రాయేలీయులందరి సమక్షంలో అతనితో ఇలా అన్నాడు: “నీవు బలంగా, ధైర్యంగా ఉండు. ఎందుకంటే యాహ్వే వారి పితరులకు ఇస్తానని ప్రమాణం చేసిన దేశంలోకి నీవు ఈ ప్రజలతో కలిసి వెళ్తావు[a]; నీవే దాన్ని వారికి వారసత్వంగా ఇస్తావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఈ ప్రజలను ఆ దేశంలోకి తీసుకువెళ్తావు.” హీబ్రూ వాక్యాన్ని యెహోషువ ప్రజలతో కలిసి దేశంలోకి వెళ్తాడని లేదా వారికి నాయకత్వం వహించి వారిని తీసుకువెళ్తాడని అర్థం చేసుకోవచ్చు. తరువాతి వాక్యభాగం అతడు వారికి ఆ దేశాన్ని వారసత్వంగా ఇస్తాడని స్పష్టంగా చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: కథన సందర్భంలో קרא అంటే సహజంగా ‘పిలుచుట’; అధికారికంగా రప్పించాడనే భావాన్ని అనవసరంగా పెంచకుండా తెలుగులో సరళంగా ఉంది.
- source_word: לִיהוֹשֻׁעַ
  choice: యెహోషువను
  rationale: హీబ్రూ పేరుకు తెలుగులో స్థిరపడిన రూపాన్ని వాడాం.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి సమక్షంలో
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు అంతటి కళ్ల ఎదుట’; మాట బహిరంగంగా పలికిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲזַק וֶאֱמָץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: నాయకత్వ బాధ్యతకు సంబంధించిన బలం, సాహసం రెండింటినీ సహజమైన తెలుగు జంటగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రోత్సాహానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: నీవు ఈ ప్రజలతో కలిసి వెళ్తావు
  rationale: בוא తో కూడిన ఈ నిర్మాణం యెహోషువ ప్రజలతోపాటు దేశంలో ప్రవేశించడాన్ని సూచించగలదు. ‘వారిని తీసుకువెళ్తావు’ అని మాత్రమే నిర్ణయించకుండా మూలంలోని భేదాన్ని నిలిపాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: సందర్భంలో వాగ్దానం చేయబడిన భూభాగాన్ని సాధారణ పాఠకునికి సహజంగా సూచిస్తుంది.
- source_word: נִשְׁבַּע
  choice: ప్రమాణం చేసిన
  rationale: నిఫాల్ రూపంలోని ప్రమాణపూర్వక వాగ్దాన భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే సంప్రదాయ లిప్యంతరీకరణతో నిలిపాం.
- source_word: לַאֲבֹתָם
  choice: వారి పితరులకు
  rationale: మూలంలోని పురుషవాచక కుటుంబపదాన్ని నిలుపుతూ, గౌరవప్రదమైన ప్రామాణిక తెలుగు రూపాన్ని వాడాం.
- source_word: לָתֵת לָהֶם
  choice: ఇస్తానని
  rationale: యెహోవా చేసిన ప్రమాణంలోని విషయాన్ని తెలుగులో సహజమైన పరోక్ష వాక్య నిర్మాణంగా అందిస్తుంది.
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: దాన్ని వారికి వారసత్వంగా ఇస్తావు
  rationale: హిఫిల్ రూపంలోని ‘వారసత్వాన్ని పొందేలా చేయుట/కేటాయించుట’ అనే ఒడంబడిక సంబంధ భావాన్ని సులభమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా ప్రతిపాదించబడే ప్రత్యామ్నాయం.
- issue: תָּבוֹא אֶת הָעָם లో యెహోషువ ప్రజలతో ప్రవేశిస్తాడా, వారిని లోపలికి తీసుకువెళ్తాడా
  choice: ఈ ప్రజలతో కలిసి వెళ్తావు
  alternative: ఈ ప్రజలను దేశంలోకి తీసుకువెళ్తావు
  rationale: ఇక్కడి హీబ్రూ నిర్మాణం యెహోషువ ప్రజలతో కలిసి ప్రవేశించడానికీ, వారిని నడిపించి తీసుకువెళ్లడానికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం మొదటి భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం. తరువాతి క్రియ అతని క్రియాశీల నాయకత్వాన్ని స్పష్టంగా చెబుతుంది.
- issue: אֲבֹתָם లోని బంధుత్వ పదం
  choice: వారి పితరులకు
  alternative: వారి పూర్వీకులకు
  rationale: మూలంలోని ‘వారి తండ్రులు/పితరులు’ అనే పురుషవాచక రూపాన్ని తటస్థ పదంగా మార్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ నాయకత్వ నియామకానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. దీర్ఘమైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు భాగాలుగా విభజించినా, కారణ సంబంధం మరియు వారసత్వ భావం నిలిచాయి.
