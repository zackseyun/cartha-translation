  rationale: Only the rendering of the divine name has been changed, from “యెహోవా” to “యాహ్వే,” to conform to the POB’s specified rendering of יהוה. The footnote is slightly expanded to preserve the source-based distinction between Joshua entering with the people and his explicit active role in assigning their inheritance.
