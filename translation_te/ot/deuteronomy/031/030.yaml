translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘గీతం,’ ‘సమాజం,’ ‘పలికాడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నారు; మూలంలోని పూర్తి కావడంపై ఉన్న వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో నిలిపారు.
