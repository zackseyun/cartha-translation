source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֗ה בְּ/אָזְנֵי֙ כָּל קְהַ֣ל יִשְׂרָאֵ֔ל אֶת דִּבְרֵ֥י הַ/שִּׁירָ֖ה הַ/זֹּ֑את עַ֖ד תֻּמָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: te
  text: అప్పుడు మోషే ఈ గీతంలోని మాటలను ఇశ్రాయేలు సమాజమంతా వినేలా, అవి పూర్తయ్యే వరకు పలికాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు వాటిని పలకడం పూర్తి చేసే వరకు”—అంటే మోషే గీతంలోని మాటలన్నిటినీ పలకడం ముగించే వరకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు మోషే ... పలికాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది. గీతంలోని మాటలను ఉచ్చరించే సందర్భంలో ‘పలికాడు’ సహజమైనది.
- source_word: בְּאָזְנֵי
  choice: వినేలా
  rationale: అక్షరార్థంగా ‘చెవుల్లో’ అనే హీబ్రూ నుడికారం, సమక్షంలో వినిపించేలా మాట్లాడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వినేలా’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతా
  rationale: קהל సమకూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజం’ సంఘపరమైన భావాన్ని అనవసరంగా జోడించకుండా సమూహార్థాన్ని ఇస్తుంది; ‘అంతా’ כָּל భావాన్ని నిలుపుతుంది.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ఈ గీతంలోని మాటలను
  rationale: మూలంలో ‘ఈ గీతపు మాటలు’ అని స్పష్టంగా ఉంది. తెలుగులో ‘ఈ గీతంలోని మాటలు’ సహజంగా ఉండి, ‘మాటలు’ అనే మూలపదాన్ని నిలుపుతుంది.
- source_word: עַד תֻּמָּם
  choice: అవి పూర్తయ్యే వరకు
  rationale: మూడవ పురుష బహువచన ప్రత్యయం సమీపంలోని ‘మాటలు’ను సూచించవచ్చు. ఈ రూపం వాటి సంపూర్ణ పఠనాన్ని తెలియజేస్తూ, ‘అతడు వాటిని పూర్తి చేసే వరకు’ అనే ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో ఉంచుతుంది.
