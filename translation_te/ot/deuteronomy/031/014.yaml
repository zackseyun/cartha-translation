  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “ఇదిగో, నీ మరణదినాలు దగ్గరపడ్డాయి. యెహోషువను పిలువు; మీరిద్దరూ ప్రత్యక్షపు గుడారంలో నిలబడండి, నేను అతనికి ఆజ్ఞ ఇస్తాను[a].” అప్పుడు మోషే, యెహోషువ వెళ్లి ప్రత్యక్షపు గుడారంలో నిలబడ్డారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అతనికి అధికారిక బాధ్యత అప్పగిస్తాను” లేదా “అతనికి ఆజ్ఞాపిస్తాను.” ఇక్కడి హీబ్రూ క్రియకు ఆజ్ఞ ఇవ్వడం, అధికారికంగా బాధ్యత అప్పగించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంతో దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచుతుంది.
- source_word: הֵן
  choice: ఇదిగో
  rationale: దైవవాక్యానికి శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయ బలాన్ని గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: నీవు చనిపోయే రోజులు సమీపించాయి
  rationale: హీబ్రూ కాలసంబంధ నుడికారాన్ని దగ్గరగా అనుసరిస్తూ, ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: קְרָא אֶת יְהוֹשֻׁעַ
  choice: యెహోషువను పిలిచి
  rationale: సాధారణ ఆజ్ఞారూప భావాన్ని సహజమైన తెలుగు వాక్యప్రవాహంలో నిలుపుతుంది.
- source_word: וְהִתְיַצְּבוּ
  choice: మీరెద్దరూ ... నా ఎదుట నిలబడండి
  rationale: ద్వివచన సందర్భాన్ని స్పష్టం చేసి, దేవుని సమక్షంలో నియమిత స్థానంలో హాజరవడం అనే హిత్పయేల్ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారంలో
  rationale: ఆరాధనా స్థలానికి తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన గౌరవప్రద పదబంధాన్ని ఉపయోగిస్తుంది.
- source_word: וַאֲצַוֶּנּוּ
  choice: నేను అతనికి ఆజ్ఞాపిస్తాను
  rationale: צוה అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, ఈ సందర్భంలో అధికారిక బాధ్యత అప్పగించే ఛాయను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: וַיִּתְיַצְּבוּ
  choice: ఆయన ఎదుట నిలబడ్డారు
  rationale: ముందటి ఆజ్ఞతో పదార్థసామ్యాన్ని కాపాడి, దేవుని సమక్షంలో హాజరైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: యెహోషువకు సంబంధించిన צוה క్రియ యొక్క భావం
  choice: అతనికి ఆజ్ఞాపిస్తాను
  alternative: అతనికి బాధ్యత అప్పగిస్తాను / అతన్ని నియమిస్తాను
  rationale: మూల క్రియలో ఆజ్ఞాపించడం, బాధ్యత అప్పగించడం అనే రెండు ఛాయలు ఉండగలవు. ప్రధాన పాఠంలో నేర అర్థాన్ని ఉంచి, నియామక సందర్భపు భావాన్ని పాదటిప్పణిలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. మూలంలోని దైవనామం, శ్రద్ధాకర్షక అవ్యయం, అధికారిక హాజరు భావం నిలుపబడ్డాయి. ‘నా/ఆయన ఎదుట’ అనేది హీబ్రూ క్రియలో సందర్భానుసారంగా అంతర్లీనమైన దేవుని సమక్ష భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
