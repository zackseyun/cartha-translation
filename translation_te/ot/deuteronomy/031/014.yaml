revisions:
- from: 'యెహోవా మోషేతో ఇలా అన్నాడు: “ఇదిగో, నీవు చనిపోయే రోజులు సమీపించాయి. యెహోషువను పిలిచి, మీరిద్దరూ ప్రత్యక్షపు గుడారంలో నా ఎదుట నిలబడండి; నేను అతనికి ఆజ్ఞాపిస్తాను[a].” అప్పుడు మోషే, యెహోషువ వెళ్లి ప్రత్యక్షపు గుడారంలో ఆయన ఎదుట నిలబడ్డారు.'
