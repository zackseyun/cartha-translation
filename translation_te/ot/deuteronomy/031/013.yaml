  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: te
  text: ఇంతకుముందు తెలియని వారి పిల్లలు కూడా విని నేర్చుకొని, మీరు యొర్దాను దాటి స్వాధీనం చేసుకోవడానికి వెళ్తున్న దేశంలో మీరు జీవించే రోజులన్నిటిలో మీ దేవుడైన యాహ్వేను భయపడడం నేర్చుకుంటారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి కుమారులు.’ హీబ్రూ పదం ప్రత్యేకంగా కుమారులను గానీ, విస్తృతంగా పిల్లలను లేదా సంతతిని గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘స్వాధీనం చేసుకోవడానికి’ అనే మాటను ‘దానిని వారసత్వంగా పొందడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: వారి పిల్లలు
  rationale: בנים అనే పదం కుమారులను ప్రత్యేకంగా సూచించగలిగినా, ఈ సందర్భంలో తరువాతి తరాన్ని విస్తృతంగా సూచిస్తుంది; అందువల్ల ‘పిల్లలు’ సహజమైనది, సందర్భానుకూలమైనది.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: ఇప్పటివరకు తెలియని
  rationale: ידע యొక్క పరిపూర్ణ రూపం ముందటి జ్ఞానం లేదా అనుభవం లేకపోవడాన్ని సూచిస్తుంది. ‘ఇప్పటివరకు తెలియని’ అనే రూపం తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: విని, నేర్చుకొని
  rationale: ఈ క్రియలు వినడం ద్వారా నేర్చుకొని దేవునికి భయపడే ఉద్దేశం/ఫలితాన్ని వరుసగా వ్యక్తం చేస్తాయి.
- source_word: לְיִרְאָה
  choice: భయపడాలి
  rationale: ద్వితీయోపదేశకాండంలో ירא దేవునిపట్ల ఒడంబడిక సంబంధమైన భయభక్తిని సూచిస్తుంది. ‘భయపడాలి’ మూలపదంలోని బలాన్ని నిలుపుతుంది; కేవలం ‘గౌరవించాలి’ అని మృదువుగా చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: జీవించే రోజులన్నిటిలో
  rationale: జీవితకాలమంతటి నిరంతర బాధ్యతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ఇక్కడ אדמה మట్టిని కాక ఇశ్రాయేలు నివసించబోయే భూభాగాన్ని సూచిస్తుంది. తెలుగులో ‘దేశంలో’ సహజమైన స్థానప్రయోగం.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה
  choice: మీరు ... యొర్దాను నది దాటి వెళ్లే
  rationale: שמהలోని గమ్యదిశ భావాన్ని ‘వెళ్లే’ ద్వారా నిలిపి, సంబంధవాక్యాన్ని దేశంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ ఇక్కడ వాగ్దాన దేశాన్ని పొందడం, ఆక్రమించి అధీనంలోకి తెచ్చుకోవడం అనే భావాన్ని కలిగి ఉంది. ‘స్వాధీనం చేసుకోవడానికి’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: בנים పదం పరిధి
  choice: పిల్లలు
  alternative: కుమారులు
  rationale: ఒడంబడిక బోధను వినబోయే తరువాతి తరమంతా సందర్భంలోని ఉద్దేశం; మగ సంతానానికే పరిమితం చేయకపోవడం సందర్భసమ్మతం.
- issue: ירא యొక్క ఒడంబడిక భావం
  choice: భయపడాలి
  alternative: భయభక్తులు కలిగి ఉండాలి / గౌరవించాలి
  rationale: ‘భయపడాలి’ మూలంలోని భయ భావాన్ని, దాని ఆధ్యాత్మిక గంభీరతను నిలుపుతుంది; భక్తి లేదా గౌరవం మాత్రమే అని అర్థాన్ని ముందుగానే సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ఉద్దేశ్య క్రమాన్ని తెలుగులో సహజంగా చూపేందుకు చివరి క్రియను ‘భయపడాలి’గా ఉంచాం. ‘యొర్దాను’ అనే స్థిర బైబిలు రూపాన్ని ఉపయోగించాం.
