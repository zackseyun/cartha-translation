reference: Deuteronomy 31:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “ఈ రోజుకు నాకు నూట ఇరవై సంవత్సరాలు. ఇక నేను బయటికి వెళ్లలేను, లోపలికి రాలేను[a]. అంతేకాక, యాహ్వే నాతో, ‘నీవు ఈ యొర్దానును దాటవు’ అని చెప్పాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “బయటికి వెళ్లడం, లోపలికి రావడం.” ఈ నుడికారం సాధారణ కార్యకలాపాలను గానీ, ప్రజలను నడిపించే బాధ్యతను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది; కర్త మోషే అని సందర్భం తెలియజేస్తుంది.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: నేటికి నాకు నూట ఇరవై సంవత్సరాలు
  rationale: అక్షరార్థంగా ఉన్న ‘నూట ఇరవై సంవత్సరాల కుమారుడను’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, הַיּוֹם యొక్క కాల ప్రాధాన్యాన్ని ‘నేటికి’ ద్వారా కాపాడుతుంది.
- source_word: לֹא אוּכַל עוֹד
  choice: ఇక ... శక్తి లేదు
  rationale: יכולתను, עוֹד సూచించే ‘ఇకపై కాదు’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָצֵאת וְלָבוֹא
  choice: బయలుదేరడానికీ తిరిగి రావడానికీ
  rationale: ‘వెళ్లడం—రావడం’ అనే మూల నుడికారాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది; ఇది సాధారణ కార్యకలాపాన్నా, ప్రజలను నడిపించడాన్నా సూచిస్తుందనే సందిగ్ధతను పాదసూచిక వివరిస్తుంది.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న దేవుని నిబంధన నామమైన יהוהను లిప్యంతరీకరించి అందిస్తుంది.
- source_word: אָמַר אֵלַי
  choice: నాతో ... అని చెప్పాడు
  rationale: దైవ వాక్యాన్ని ప్రత్యక్ష ఉల్లేఖనంగా సహజమైన తెలుగులో ప్రవేశపెడుతుంది.
- source_word: לֹא תַעֲבֹר
  choice: నువ్వు ... దాటవు
  rationale: హీబ్రూ రూపం నిషేధంగానూ ఖచ్చితమైన ప్రకటనగానూ వినిపించగల ఉద్వేగాన్ని నిలుపుతుంది; ‘దాటకూడదు’ అని మాత్రమే చేసి భావాన్ని సంకుచితం చేయదు.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ఈ యొర్దానును
  rationale: ‘ఈ’ అనే నిర్దేశకాన్ని కాపాడి, నది పేరును అదనపు పదం చేర్చకుండా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక నిబంధన నామాన్ని సాధారణ బిరుదుగా మార్చకుండా, ఆధునిక పండిత వాడుకకు అనుగుణంగా ‘యాహ్వే’ అని అందించింది.
- issue: לֹא תַעֲבֹר యొక్క బలం
  choice: నువ్వు ... దాటవు
  alternative: నువ్వు ... దాటకూడదు
  rationale: ఇది దైవ నిషేధమా లేక జరగబోయేదాని ఖచ్చిత ప్రకటననా అనే భావ ఉద్వేగాన్ని తెలుగు ప్రధాన పాఠంలో పూర్తిగా ఒక వైపుకు తేల్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ‘నువ్వు’ వాడబడింది. మూలంలోని నుడికార సంబంధిత సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి కాపాడుతున్నాయి.
