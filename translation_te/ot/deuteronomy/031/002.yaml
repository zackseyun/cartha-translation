- from: 'అతడు వారితో ఇలా అన్నాడు: “నేటికి నాకు నూట ఇరవై సంవత్సరాలు. ఇక నేను బయలుదేరడానికీ తిరిగి రావడానికీ[a] శక్తి లేదు. అంతేకాక, యాహ్వే నాతో, ‘నువ్వు ఈ యొర్దానును దాటవు’ అని చెప్పాడు.”'
  to: 'అతడు వారితో ఇలా అన్నాడు: “ఈ రోజుకు నాకు నూట ఇరవై సంవత్సరాలు. ఇక నేను బయటికి వెళ్లలేను, లోపలికి రాలేను[a]. అంతేకాక, యాహ్వే నాతో, ‘నీవు ఈ యొర్దానును దాటవు’ అని చెప్పాడు.”'
  rationale: The revision retains all content and ambiguity of the Hebrew while avoiding an unwarranted limitation to physical strength. It also aligns the main text exactly with the idiom explained in the footnote and uses a register-appropriate singular form in the divine quotation.
