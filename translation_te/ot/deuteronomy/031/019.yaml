revisions:
- from: ఇక ఇప్పుడు మీరు మీ కోసం ఈ పాటను రాయండి.[a] నీవు దాన్ని ఇశ్రాయేలు కుమారులకు[b] నేర్పి, వారి నోట ఉంచు. తద్వారా ఈ పాట ఇశ్రాయేలు కుమారులకు విరోధంగా[c] నాకు సాక్షిగా ఉంటుంది.
  to: ఇప్పుడు మీరు మీకొరకు ఈ పాటను రాయండి.[a] నీవు దాన్ని ఇశ్రాయేలు కుమారులకు[b] నేర్పి, వారి నోట ఉంచు. తద్వారా ఈ పాట నాకోసం ఇశ్రాయేలు కుమారులకు విరోధంగా[c] సాక్షిగా ఉంటుంది.
  rationale: సవరణలు అర్థాన్ని మార్చవు. అవి కేవలం ఆధునిక తెలుగు సహజత్వాన్ని మెరుగుపరుస్తూ, ‘నాకోసం’ ద్వారా לִּי యొక్క భావాన్ని మరియు ‘విరోధంగా’ ద్వారా చివరి న్యాయసాక్ష్య సంబంధాన్ని స్పష్టపరుస్తాయి. ఆజ్ఞల సంఖ్యలోని మూలభాషా మార్పు, ఇశ్రాయేలు కుమారులు అనే రూపం, మరియు ప్రత్యామ్నాయ పఠనం పాదసూచికలు యథాతథంగా భద్రపరచబడ్డాయి.
