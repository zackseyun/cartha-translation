id: DEU.31.19
reference: Deuteronomy 31:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: te
  text: ఇప్పుడు మీరు మీకొరకు ఈ పాటను రాయండి.[a] నీవు దాన్ని ఇశ్రాయేలు కుమారులకు[b] నేర్పి, వారి నోట ఉంచు. తద్వారా ఈ పాట నాకోసం ఇశ్రాయేలు కుమారులకు విరోధంగా[c] సాక్షిగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘రాయండి’ అనే మొదటి ఆజ్ఞ బహువచనంలో ఉంది; తరువాతి ‘నేర్పు,’ ‘ఉంచు’ అనే ఆజ్ఞలు ఏకవచనంలో ఉన్నాయి.
    reason: source_form
  - marker: b
    text: అంటే ‘ఇశ్రాయేలీయులు.’ హీబ్రూ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది; ఈ వచనంలో తరువాత కూడా ఇదే పదబంధం వస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఇశ్రాయేలు కుమారుల మధ్య.’ హీబ్రూ ఉపసర్గకు ‘లో/మధ్య’ అనే అర్థం రావచ్చు; అయితే ఈ సందర్భంలో పాట వారికి విరోధంగా సాక్షిగా నిలుస్తుందనే భావం ఎక్కువగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇక ఇప్పుడు
  rationale: וְ అనే అనుసంధాన భావాన్నీ, עַתָּה అనే కాలసూచననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּתְבוּ לָכֶם
  choice: మీరు మీ కోసం ... రాయండి
  rationale: బహువచన ఆజ్ఞను, לָכֶם లోని ‘మీ కోసం/మీ కొరకు’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ఈ పాట
  rationale: שִׁירָה కు నేరమైన, సందర్భోచితమైన అర్థం ‘పాట’; తదుపరి అధ్యాయం కవితారూపంలో ఉన్నప్పటికీ ‘కవిత’ అని మార్చాల్సిన అవసరం లేదు.
- source_word: וְלַמְּדָהּ
  choice: నీవు దాన్ని ... నేర్పి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ‘పాట’ను సూచిస్తుంది. క్రియ ఏకవచన పురుష ఆజ్ఞగా ఉండటాన్ని ‘నీవు’ ద్వారా నిలిపింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే ఒడంబడిక-గుర్తింపు భాషను ప్రధాన పాఠ్యంలో నిలిపి, భావపరమైన సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: వారి నోట ఉంచు
  rationale: కంఠస్థం చేసి పలికించడాన్ని సూచించే హీబ్రూ దృశ్యరూపాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా యథాశక్తి నిలుపుతుంది.
- source_word: לְמַעַן
  choice: తద్వారా
  rationale: ఉద్దేశం/ఫలితాన్ని సూచించే అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: నాకు సాక్షిగా ఉంటుంది
  rationale: పాట దేవుని పక్షాన సాక్షిగా పనిచేస్తుందనే భావాన్ని నేరుగా నిలుపుతుంది; ‘సాక్ష్యం’ కంటే వ్యక్తీకృతమైన ‘సాక్షి’ మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు విరోధంగా
  rationale: ఒడంబడిక న్యాయవివాద సందర్భంలో בְּ కు విరోధార్థక బలం ఉండే అవకాశాన్ని ప్రధాన పాఠ్యంలో స్వీకరించింది; ‘వారి మధ్య’ అనే మరింత స్థానార్థక పఠనాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: ఆజ్ఞలలో బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: ‘మీరు ... రాయండి’ తరువాత ‘నీవు ... నేర్పి ... ఉంచు’
  alternative: అన్నీ బహువచనంగా లేదా అన్నీ ఏకవచనంగా సరళీకరించడం
  rationale: మూల హీబ్రూలో כִּתְבוּ బహువచన ఆజ్ఞ కాగా, וְלַמְּדָהּ మరియు שִׂימָהּ ఏకవచన ఆజ్ఞలు. ఈ సంబోధన మార్పును సిద్ధాంతపరంగా పరిష్కరించకుండా పాఠ్యంలో నిలిపింది.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని స్పష్టమైన పుత్రత్వ/వంశ గుర్తింపు రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; ఇది కేవలం పురుషులను మాత్రమే సూచిస్తుందని అపార్థం కాకుండా సమూహార్థాన్ని పాదసూచికలో తెలిపింది.
- issue: సాక్షి వాక్యంలో בִּבְנֵי יִשְׂרָאֵל యొక్క భావం
  choice: ఇశ్రాయేలు కుమారులకు విరోధంగా
  alternative: ఇశ్రాయేలు కుమారుల మధ్య
  rationale: చుట్టుపక్కల ఉన్న ఒడంబడిక హెచ్చరిక, అభియోగ సందర్భం విరోధార్థాన్ని బలపరుస్తుంది. అయినా హీబ్రూ ఉపసర్గకు స్థానార్థక పఠనం సాధ్యమైందని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. ‘వారి నోట ఉంచు’ అనే మూలభాషా దృశ్యాన్ని ఉద్దేశపూర్వకంగా నిలిపింది. హీబ్రూలోని బహువచన-ఏకవచన సంబోధన మార్పును తెలుగులో స్పష్టంగా చూపించింది.
