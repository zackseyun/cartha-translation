source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: te
  text: 'మీరు నాతో మాట్లాడినప్పుడు యాహ్వే మీ మాటల ధ్వనిని విన్నాడు.[a] అప్పుడు యాహ్వే నాతో ఇలా అన్నాడు: “ఈ ప్రజలు నీతో చెప్పిన మాటల ధ్వనిని నేను విన్నాను. వారు చెప్పినదంతా మంచిగానే చెప్పారు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ మాటల స్వరం”; ఇది హీబ్రూలోని శ్రవణసంబంధ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు చెప్పినదంతటిలో బాగానే చేశారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగులో దైవనామాన్ని గుర్తించదగిన సాంప్రదాయ రూపంలో ఉంచి, సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: విన్నాడు / నేను విన్నాను
  rationale: ఇక్కడ שׁמע పలికిన మాటలను వినడాన్ని సూచిస్తుంది; సరళమైన తెలుగు అర్థాన్ని ఎంచుకున్నాం.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: మీ మాటల స్వరం / మాటల స్వరం
  rationale: హీబ్రూ శ్రవణసంబంధ నుడికారాన్ని నిలుపుతూ, קול లోని ‘స్వరం/ధ్వని’ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּדַבֶּרְכֶם אֵלַי
  choice: మీరు నాతో మాట్లాడినప్పుడు
  rationale: בְּ + infinitive construct సూచించే సమకాలీన భావాన్ని సహజమైన కాలవాచక నిర్మాణంతో తెలిపింది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: సమూహాన్ని సూచించే עָם మరియు సమీప సూచకాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: నీతో చెప్పిన
  rationale: మోషేను ఉద్దేశించిన ఏకవచన సంబోధనను, דבר అనే క్రియ యొక్క మాటల సందర్భాన్ని నిలుపుతుంది.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: వారు చెప్పినదంతా మంచిగానే చెప్పారు
  rationale: సందర్భంలో వారి మాటలపై ఉన్న అనుకూల తీర్పును స్పష్టంగా తెలుపుతుంది; అయితే הֵיטִיבוּ యొక్క విస్తృత ‘మంచిగా చేశారు’ భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా నిలిపింది; ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా గుర్తించదగిన రూపాన్ని ఎంచుకుంది.
- issue: הֵיטִיבוּ యొక్క మూల్యాంకన భావం
  choice: మంచిగానే చెప్పారు
  alternative: మంచిగా చేశారు
  rationale: తక్షణ సందర్భం వారు పలికిన మాటల గురించి కావడంతో మాటలపై దేవుని ఆమోదాన్ని ప్రధాన పాఠ్యంలో తెలిపింది; క్రియలోని ‘చేయడం/సరిగ్గా ప్రవర్తించడం’ అనే సాధ్యమైన విస్తృత భావాన్ని పాదసూచికగా సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. దేవుని ప్రత్యక్ష వాక్యంలో మోషేకు ఏకవచన ‘నీతో’ వాడబడింది; ప్రజలకు సంబంధించిన బహువచనం స్పష్టంగా నిలుపబడింది.
