id: DEU.5.9
reference: Deuteronomy 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: te
  text: నీవు వాటికి సాష్టాంగపడకూడదు[a], వాటిని సేవించకూడదు. ఎందుకంటే నేను నీ దేవుడైన యాహ్వేను, అసూయగల దేవుణ్ణి. నన్ను ద్వేషించేవారి విషయంలో తండ్రుల దోషాన్ని పిల్లలపై, మూడవ, నాలుగవ తరాల వరకు విచారిస్తాను[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటి ముందు నేలపై పడి నమస్కరించకూడదు.’ హీబ్రూ క్రియ గౌరవం లేదా ఆరాధనతో శరీరాన్ని వంచి పడే చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘లెక్క అడుగుతాను’ లేదా ‘శిక్షిస్తాను.’ హీబ్రూ పదం అక్షరార్థంగా ‘సందర్శించడం’ అనే భావం కలిగిన న్యాయసంబంధ పదం; ఇక్కడ జవాబుదారితనం కోరడం, శిక్షించడం రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘మూడవవారిపై, నాలుగవవారిపై’; ‘తరాలు’ అనే పదం అర్థస్పష్టత కోసం చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: సాష్టాంగపడకూడదు
  rationale: ఈ క్రియ గౌరవం లేదా ఆరాధన సూచిస్తూ శరీరాన్ని వంచి నేలపై పడే స్పష్టమైన చర్యను తెలియజేస్తుంది. తరువాతి ‘సేవించకూడదు’ అనే క్రియతో ఉన్న భేదాన్ని ఇది నిలుపుతుంది.
- source_word: תָעָבְדֵם
  choice: వాటిని సేవించకూడదు
  rationale: విగ్రహాలకు లేదా ఇతర దేవతలకు ఆరాధనాపూర్వక సేవ చేయడాన్ని సూచిస్తుంది; మొదటి క్రియలోని శరీర చర్యతో దీనిని కలిపివేయలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణను వాడింది.
- source_word: אֵל קַנָּא
  choice: అనన్యభక్తిని కోరే దేవుణ్ణి
  rationale: కַנָּא ఇక్కడ ప్రత్యర్థి ఆరాధనను సహించని దేవుని నిబంధనాత్మక, ప్రత్యేక హక్కును సూచిస్తుంది. ‘అసూయగల’ అనే పదానికి ఆధునిక తెలుగులో ఉండే నీచమైన స్వార్థభావ ఛాయను నివారిస్తూ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: פֹּקֵד
  choice: లెక్కకు తీసుకుంటాను
  rationale: ఈ న్యాయసంబంధ పదం గమనించి జవాబు కోరడం నుంచి శిక్షించడం వరకు విస్తరించగలదు. ‘లెక్కకు తీసుకోవడం’ ఆ విస్తృతిని నిలుపుతూ, ‘శిక్షించడం’ అనే సన్నని అర్థానికే పరిమితం చేయదు.
- source_word: עֲוֺן
  choice: దోషం
  rationale: పాపకార్యాన్ని, దాని అపరాధభారాన్ని, దాని ఫలితాన్ని సూచించగల హీబ్రూ పదానికి తెలుగు ‘దోషం’ తగిన నైతిక, న్యాయపరమైన విస్తృతిని ఇస్తుంది.
- source_word: אָבוֹת
  choice: తండ్రులు
  rationale: హీబ్రూ పదం పుంలింగ బహువచనం; అందువల్ల దానిని ‘తల్లిదండ్రులు’ అని లింగతటస్థం చేయలేదు.
- source_word: עַל בָּנִים
  choice: పిల్లలపై
  rationale: בנים రూపపరంగా ‘కుమారులు’ అయినా, తరాల పరంపరను తెలిపే ఈ సందర్భంలో సంతానాన్ని సమగ్రంగా సూచిస్తుంది; ‘పిల్లలు’ సహజమైన ఆధునిక తెలుగు.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: మూడవ, నాలుగవ తరాల వరకు
  rationale: హీబ్రూలో ‘మూడవవారు, నాలుగవవారు’ అనే సంక్షిప్త తరాల నుడికారం ఉంది. తెలుగులో అర్థస్పష్టత కోసం ‘తరాలు’ మరియు పరిధిని తెలిపే ‘వరకు’ చేర్చబడ్డాయి.
- source_word: לְשֹׂנְאָי
  choice: నన్ను ద్వేషించేవారి విషయంలో
  rationale: చివరనున్న ఈ పదబంధాన్ని తీర్పు వర్తించే వర్గాన్ని గుర్తించేదిగా ఉంచింది. పూర్వీకుల దోషం కారణంగా వారి సంతానమంతా వారి స్వీయ వైఖరితో సంబంధం లేకుండా యాంత్రికంగా శిక్షించబడతారని అనువాదం తేల్చివేయదు.
theological_decisions:
- issue: దైవిక కַנָּא భావాన్ని ఎలా అనువదించాలి
  choice: అనన్యభక్తిని కోరే దేవుడు
  alternative: అసూయగల దేవుడు; రోషంగల దేవుడు
  rationale: సందర్భం ప్రత్యేక ఆరాధన హక్కు గురించినది. ఎంపిక చేసిన రూపం ఆ నిబంధనాత్మక ప్రత్యేకతను స్పష్టంగా ఉంచుతుంది; మానవులలోని స్వార్థపూరిత అసూయను దేవునికి ఆపాదిస్తున్నట్టుగా వినిపించదు.
- issue: పూర్వీకుల దోషానికి సంతానంపై యాంత్రిక శిక్షను వాక్యం బోధిస్తుందా
  choice: ‘నన్ను ద్వేషించేవారి విషయంలో’ అనే పదబంధం తీర్పు పరిధిని గుర్తిస్తుంది; అంతకుమించి సంబంధాన్ని అనువాదం పరిష్కరించదు.
  alternative: సంతానం తమ వైఖరితో సంబంధం లేకుండా పూర్వీకుల పాపానికి తప్పనిసరిగా శిక్షించబడుతుంది.
  rationale: హీబ్రూ వాక్యాంతంలోని לְשֹׂנְאָי తీర్పుకు సంబంధించిన వారిని సహజంగా విశేషిస్తుంది. అదే సమయంలో పూర్వీకుల దోషం, తరువాతి తరాల మధ్య వాక్యంలో ఉన్న గంభీరమైన సంబంధాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞారూపాన్ని వాడింది. ఏకవచన సంబోధనను ‘నీవు/నీ’తో నిలిపింది. విగ్రహాలను సూచించే బహువచనానికి సహజంగా ‘వాటి/వాటిని’ వాడింది. పాతకాలపు క్రియాంతాలు, అధిక సంస్కృతీకరణ నివారించబడ్డాయి.
