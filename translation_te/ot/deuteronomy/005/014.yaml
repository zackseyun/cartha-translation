source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: te
  text: అయితే ఏడవ రోజు నీ దేవుడైన యెహోవాకు అంకితమైన సబ్బాతు దినం. నీ దాసుడూ నీ దాసీ నీలాగే విశ్రాంతి పొందేలా, నీవుగాని, నీ కుమారుడుగాని, నీ కుమార్తెగాని, నీ దాసుడుగాని, నీ దాసిగాని, నీ ఎద్దుగాని, నీ గాడిదగాని, నీ పశువులన్నీగాని, నీ పట్టణాలలో[a] నివసించే పరదేశిగాని[b] ఏ పనీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ గుమ్మాల లోపల.’ ఇది ఒకరి పట్టణం లేదా సమాజ పరిధిలో నివసించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: ‘పరదేశి’ అనేది కేవలం ప్రయాణికుడిని కాక, ఆ సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבָּת
  choice: సబ్బాతు దినం
  rationale: ఇది సాధారణ విశ్రాంతిని మాత్రమే కాక, నిబంధనలో నిర్దేశించిన ప్రత్యేక పవిత్ర దినాన్ని సూచిస్తుంది; అందువల్ల స్థిరపడిన పేరును నిలుపుతూ ‘దినం’ అని స్పష్టం చేశాం.
- source_word: לַיהוָה
  choice: యెహోవాకు అంకితమైన
  rationale: לְ ఉపసర్గ ఇక్కడ ఆ దినం యెహోవాకు చెందిందని లేదా ఆయన కోసం ప్రత్యేకించబడిందని సూచిస్తుంది; సహజమైన తెలుగులో ఆ భావాన్ని ‘అంకితమైన’ అని వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దేవుని నిబంధన నామాన్ని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యం పొందిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: מְלָאכָה
  choice: పని
  rationale: సబ్బాతు ఆజ్ఞలో నిషేధించబడిన విస్తృత కార్యవర్గాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా సూచిస్తుంది.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: నీ దాసుడు / నీ దాసి
  rationale: మూలంలోని పురుష, స్త్రీ లింగభేదాన్ని మరియు ఇంటికి బంధితమైన సేవాస్థితిని నిలుపుతుంది; ఆధునిక తెలుగులో గౌరవప్రదంగానూ అర్థవంతంగానూ ఉంటుంది.
- source_word: שׁוֹר / חֲמוֹר
  choice: ఎద్దు / గాడిద
  rationale: న్యాయసందర్భంలోని పెంపుడు పనిజంతువులకు సహజమైన, ఖచ్చితమైన తెలుగు పదాలు.
- source_word: בְּהֵמָה
  choice: పశువులు
  rationale: ఈ సందర్భంలో ఇంటివారి అధీనంలో ఉన్న పెంపుడు జంతువుల సమూహాన్ని సూచిస్తుంది.
- source_word: גֵּר
  choice: నివసించే పరదేశి
  rationale: ప్రయాణికుడిని కాక, ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసిస్తున్న స్థానికేతర వ్యక్తిని సూచించే భావాన్ని అందిస్తుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాలలో
  rationale: ‘నీ గుమ్మాల లోపల’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక పాఠకుడికి సహజంగా అర్థమయ్యేలా పట్టణం లేదా సమాజ పరిధిగా అనువదించాం.
- source_word: לְמַעַן יָנוּחַ
  choice: అలా ... విశ్రాంతి పొందాలి
  rationale: ఆజ్ఞ యొక్క ఉద్దేశం దాసుడు, దాసి కూడా యజమానిలాగే విశ్రాంతి పొందడమేనని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దేవుని ప్రత్యేక నిబంధన నామాన్ని వాడుతుంది; అందువల్ల ఆ నామాన్ని ప్రత్యక్షంగా నిలిపాం.
- issue: עבד/אמה యొక్క సామాజిక స్థితి
  choice: దాసుడు / దాసి
  alternative: సేవకుడు / సేవకురాలు లేదా బానిస / బానిస స్త్రీ
  rationale: ‘సేవకుడు’ బంధిత స్థితిని బలహీనపరచవచ్చు; ‘బానిస స్త్రీ’ సహజంగా లేదు. ‘దాసుడు/దాసి’ లింగభేదాన్ని, ఆధీన సేవాస్థితిని రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- issue: సబ్బాతు విశ్రాంతి యొక్క సామాజిక విస్తృతి
  choice: ఇంటి సభ్యులు, దాసులు, పశువులు, నివాస పరదేశి అందరినీ స్పష్టంగా జాబితా చేయడం
  alternative: జాబితాను సంక్షిప్తీకరించడం
  rationale: మూలంలోని విస్తృత జాబితా ఆజ్ఞ యొక్క సామాజిక, నైతిక బలంలో భాగం; దానిని యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆజ్ఞ యొక్క గంభీరతను కాపాడే శైలి. దీర్ఘమైన హీబ్రూ వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించాం; జాబితా, ఉద్దేశ సంబంధం, పురుష-స్త్రీ భేదం నిలిపాం.
