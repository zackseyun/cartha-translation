  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֣א אֶת אֲבֹתֵ֔י/נוּ כָּרַ֥ת יְהוָ֖ה אֶת הַ/בְּרִ֣ית הַ/זֹּ֑את כִּ֣י אִתָּ֗/נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַ/יּ֖וֹם כֻּלָּ֥/נוּ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: te
  text: యాహ్వే ఈ నిబంధనను మన పితరులతో[a] చేయలేదు; మనతోనే[c]—నేడు ఇక్కడ బతికివున్న మనందరితోనే—చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన పూర్వీకులతో.’ హీబ్రూలో అక్షరార్థంగా ‘మన పితరులతో’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఈ నిబంధనను కోశాడు’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: 'ఈ వ్యత్యాసాన్ని కొందరు అలంకారికంగా ఇలా అర్థం చేసుకుంటారు: ‘మన పితరులతో మాత్రమే కాదు, నేడు ఇక్కడ ఉన్న మనతో ప్రత్యేకంగా.’'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית
  choice: ఈ నిబంధనను ... చేశాడు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘నిబంధనను కోశాడు’; ఆధునిక తెలుగులో ‘నిబంధన చేయడం’ సహజంగా దాని భావాన్ని తెలియజేస్తుంది. ‘ఈ’ అనే పదం הַזֹּאת నిర్దేశకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֲבֹתֵינוּ
  choice: మన పితరులతో
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘మన తండ్రులు/పితరులు’ అని చెబుతుంది. పూర్వ తరాల పురుష పితరులను సూచించే గంభీరమైన, సహజమైన తెలుగు రూపంగా ‘పితరులు’ ఎంచుకున్నాం.
- source_word: כִּי
  choice: ; మనతోనే
  rationale: నిరాకరణ తర్వాత వచ్చే వ్యతిరేక భావాన్ని తెలుగులో విరామచిహ్నం మరియు ‘నే’ నొక్కిచెప్పే ప్రత్యయంతో సహజంగా వ్యక్తం చేశాం.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: మనతోనే—... మనందరితోనే
  rationale: ‘మనతో, మనమే, వీరము’ అనే హీబ్రూ నొక్కిచెప్పే అన్వయాన్ని తెలుగులో సహజంగా నిలుపడానికి ‘మనతోనే’ అని మొదలుపెట్టి, వివరణాత్మక భాగం చివర ‘మనందరితోనే’ అని పునరుద్ఘాటించాం.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: నేడు ఇక్కడ సజీవంగా ఉన్న మనందరు
  rationale: ‘నేడు,’ ‘ఇక్కడ,’ ‘మనమందరం,’ ‘సజీవులు’ అనే అన్ని భావాంశాలను స్పష్టమైన ఆధునిక తెలుగు క్రమంలో నిలిపాం.
theological_decisions:
- issue: ఈ వాక్యం పితరులకు నిబంధనతో ఎలాంటి సంబంధమూ లేదని పూర్తిగా నిరాకరిస్తుందా, లేక ప్రస్తుతం సజీవంగా ఉన్న తరానికి దాని వర్తింపును నొక్కిచెబుతుందా?
  choice: మూలంలోని ‘పితరులతో కాదు; మనతోనే’ అనే ప్రత్యక్ష వ్యత్యాసాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపాం.
  alternative: ‘మన పితరులతో మాత్రమే కాదు, మనతో కూడా’ లేదా ‘ముఖ్యంగా మనతో’ అని అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ పాఠ్యంలో ‘మాత్రమే’ అనే పరిమితి పదం లేదు. అందువల్ల వ్యాఖ్యానంతో ఉద్రిక్తతను పరిష్కరించకుండా, ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడాం. ‘పితరులు,’ ‘నిబంధన,’ ‘సజీవంగా’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని గంభీరతను నిలుపుతాయి. ఎమ్ డాష్‌ల మధ్య భాగం హీబ్రూ నొక్కిచెప్పే అన్వయాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
