    issue: The divine name is rendered “యెహోవా.”
    rationale: The supplied English POB audit trail explicitly renders יהוה as “Yahweh,” rather than “Jehovah.” Telugu “యాహ్వే” best reflects that selected name form.
  - severity: low
    issue: “సజీవంగా ఉన్న” is somewhat stiff in this context.
    rationale: “బతికివున్న” is natural modern standard Telugu and clearly communicates that all those present are alive today.
  revised_text: యాహ్వే ఈ నిబంధనను మన పితరులతో[a] చేయలేదు; మనతోనే[c]—నేడు ఇక్కడ బతికివున్న మనందరితోనే—చేశాడు[b].
