language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: te
  text: “ఈ మాటలను యాహ్వే పర్వతం వద్ద కూడిన మీ సమాజమంతటికీ అగ్ని, మేఘం, గాఢాంధకారం మధ్యనుండి బిగ్గర స్వరంతో పలికాడు; ఆయన ఇంకేమీ చేర్చలేదు.[a] ఆయన వాటిని రెండు రాతి పలకల మీద రాసి నాకు ఇచ్చాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మాట్లాడడం కొనసాగించలేదు.” హీబ్రూ పదబంధానికి “ఆయన ఇంకేమీ చేర్చలేదు” లేదా “ఆయన మాట్లాడడం కొనసాగించలేదు” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: דְּבָרִים యొక్క ప్రాథమిక అర్థమైన ‘మాటలు’ను నిలుపుతూ, దీనిని వివరణాత్మకంగా ‘ఆజ్ఞలు’గా మార్చలేదు.
- source_word: כָּל קְהַלְכֶם
  choice: మీ సమాజమంతటికీ
  rationale: కָהָל ఇక్కడ కూడివచ్చిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; ఈ పదబంధం దాని సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: అగ్ని, మేఘం, గాఢాంధకారం మధ్యనుండి
  rationale: מִתּוֹךְ లోని ‘మధ్యనుండి’ అనే దృశ్యబలాన్ని, עֲרָפֶל లోని దట్టమైన చీకటి భావాన్ని నిలిపాం.
- source_word: קוֹל גָּדוֹל
  choice: బిగ్గర స్వరంతో
  rationale: అక్షరార్థంగా ‘గొప్ప/పెద్ద స్వరం’; సందర్భంలో వినిపించే తీవ్రతను సహజమైన తెలుగులో ‘బిగ్గర స్వరం’గా తెలిపాం.
- source_word: וְלֹא יָסָף
  choice: ఆయన ఇంకేమీ చేర్చలేదు
  rationale: ఇప్పుడే పలికిన మాటలకు మరేమీ జోడించలేదనే సందర్భానుకూల భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; ‘మాట్లాడడం కొనసాగించలేదు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: రెండు రాతి పలకల మీద
  rationale: హీబ్రూ పదబంధాన్ని సంక్షిప్తంగా, సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: నాకు ఇచ్చాడు
  rationale: కర్త యాహ్వే అని సందర్భంలో స్పష్టంగా ఉండగా, తెలుగు కథన ప్రవాహంలో సహజంగా అనువదించాం.
theological_decisions:
- issue: యెహ్వా దైవ నామం యొక్క అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ‘ప్రభువు’
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలపాఠ్య భేదాన్ని కాపాడుతుంది.
- issue: וְלֹא יָסָף అనే పదబంధం యొక్క భావం
  choice: ఆయన ఇంకేమీ చేర్చలేదు
  alternative: ఆయన మాట్లాడడం కొనసాగించలేదు
  rationale: ఈ పదబంధం పలికిన మాటలకు మరేమీ జోడించలేదని లేదా మాట్లాడడం కొనసాగించలేదని అర్థమవవచ్చు. ప్రధాన పాఠ్యం సందర్భానికి సరిపోయే మొదటి భావాన్ని తీసుకుంటూ, అసలైన అర్థసందిగ్ధతను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వాక్యనిర్మాణం మూలంలోని ప్రజాసమక్ష దైవప్రకటన గంభీరతను నిలుపుతూనే తెలుగు కథన ప్రవాహానికి అనుగుణంగా ఉంది.
