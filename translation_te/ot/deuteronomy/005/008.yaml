id: DEU.5.8
reference: Deuteronomy 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: te
  text: నీ కోసం చెక్కిన ప్రతిమనుగానీ, పైన ఆకాశంలో ఉన్నదాని, కింద భూమిమీద ఉన్నదాని, లేదా భూమి కింద నీళ్లలో ఉన్నదాని ఎలాంటి పోలికనైనా చేసుకోకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: ఈ పదం చెక్కడం లేదా తొలచడం ద్వారా తయారుచేసిన ప్రతిమను సూచిస్తుంది; సందర్భంలో అది విగ్రహారాధనకు ఉపయోగించే ప్రతిమ కావచ్చు. అయినా, ఆరాధనకు సంబంధించిన నిషేధం తరువాతి వచనంలో స్పష్టమవుతుంది కాబట్టి ఇక్కడ concrete అర్థాన్ని నిలిపాం.
- source_word: תְּמוּנָה
  choice: పోలిక
  rationale: ఈ పదానికి రూపం, పోలిక, ప్రతిరూపం అనే అర్థాలు ఉన్నాయి. నిషేధం చెక్కిన ప్రతిమకే పరిమితం కాకుండా ప్రతినిధిత్వ రూపాలన్నిటికీ విస్తరిస్తున్న భావాన్ని ‘పోలిక’ సహజంగా తెలియజేస్తుంది.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: నీ కోసం ... చేసుకోకూడదు
  rationale: నిబంధనాత్మక నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే రూపం ఇది. ‘నీ కోసం’ అనే మాట לְךָను నిలిపి, కేవలం తయారీని కాక వ్యక్తిగత స్వీకరణ లేదా ఉపయోగాన్ని కూడా సూచిస్తుంది.
- source_word: כָּל תְּמוּנָה
  choice: దేని పోలికనుగానీ
  rationale: నిషేధ వాక్యంలో כָּל యొక్క సమగ్ర పరిధిని తెలుగులో సహజమైన ‘దేని ... గానీ’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: పైన ఆకాశంలో ... ఉన్న
  rationale: שָׁמַיִם రూపపరంగా బహువచనమైనా, ఆధునిక ప్రామాణిక తెలుగులో ఈ స్థల పరిధిని ‘ఆకాశం’ సహజంగా సూచిస్తుంది; ‘పైన’ నిలువు వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: కింద భూమిమీద
  rationale: భూమిపై ఉన్న జీవులు లేదా వస్తువుల విషయంలో ‘భూమిమీద’ సహజ తెలుగు ప్రయోగం; ‘కింద’ ఆకాశానికి వ్యతిరేకమైన స్థాయిని నిలుపుతుంది.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: భూమి కింద నీళ్లలో
  rationale: భూమి కిందనున్న జలాలనే మూలంలోని ప్రాచీన విశ్వచిత్రణను వివరణతో మార్చకుండా నేరుగా, సులభంగా అందిస్తుంది.
theological_decisions:
- issue: ప్రతిమల నిషేధపు పరిధి
  choice: చెక్కిన ప్రతిమను లేదా ఏ పోలికనైనా చేసుకోవద్దనే నిషేధంగా మాత్రమే అనువదించడం
  alternative: ఆరాధించడానికి విగ్రహాలను తయారుచేయవద్దని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వచనం ప్రతిమను తయారుచేసుకోవడాన్ని నిషేధిస్తుంది; వాటికి వంగి నమస్కరించడం, వాటిని సేవించడం తరువాతి వచనంలో వస్తాయి. అందువల్ల ఆ తరువాతి అంశాన్ని ఇక్కడ ముందుగానే చేర్చకుండా వచనాల మధ్యనున్న ఉద్వేగం మరియు క్రమాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన నిబంధనాత్మక శైలిని ఉపయోగించాం. ‘గానీ ... గానీ’ నిర్మాణం פֶסֶל మరియు כָּל־תְּמוּנָה మధ్య సంబంధాన్ని అనవసరంగా పరిష్కరించకుండా రెండింటినీ నిషేధ పరిధిలో ఉంచుతుంది.
