revisions:
- from: నీ దేవుడైన యహ్వే నీకు ఆజ్ఞాపించినట్లే, నీ తండ్రిని, నీ తల్లిని గౌరవించు. అప్పుడు నీ దేవుడైన యహ్వే నీకు ఇస్తున్న నేలపై[b] నీ రోజులు దీర్ఘమవుతాయి, నీకు మేలు కలుగుతుంది[a].
  to: నీ దేవుడైన యహ్వే నీకు ఆజ్ఞాపించినట్లుగా నీ తండ్రిని, నీ తల్లిని గౌరవించు. తద్వారా నీకు దీర్ఘాయుష్షు కలుగుతుంది, నీ దేవుడైన యహ్వే నీకు ఇస్తున్న దేశంలో నీకు మేలు కలుగుతుంది[a][b].
  rationale: సవరణ రెండు లְמַעַן పదాల ఉద్దేశ/ఫలిత సంబంధాన్ని “తద్వారా”తో స్పష్టంగా ఉంచుతుంది. “దీర్ఘాయుష్షు” హీబ్రూ “నీ రోజులు దీర్ఘమవుతాయి” అనే నానుడికి ఆధునిక, సహజ తెలుగు రూపం. “దేశంలో” సందర్భానుగుణమైన ప్రధాన పాఠం కాగా, “నేలపై”ను పాదటిప్పణిలో అక్షరార్థ ప్రత్యామ్నాయంగా నిలిపాం. దైవనామం, ఇద్దరు తల్లిదండ్రులకు సమాన ప్రాధాన్యం, మరియు వాగ్దానంలోని వ్యాఖ్యానాత్మక అస్పష్టత అన్నీ కాపాడబడ్డాయి.
