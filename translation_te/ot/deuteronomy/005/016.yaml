base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: te
  text: నీ దేవుడైన యహ్వే నీకు ఆజ్ఞాపించినట్లుగా నీ తండ్రిని, నీ తల్లిని గౌరవించు. తద్వారా నీకు దీర్ఘాయుష్షు కలుగుతుంది, నీ దేవుడైన యహ్వే నీకు ఇస్తున్న దేశంలో నీకు మేలు కలుగుతుంది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు క్షేమంగా ఉంటుంది.”
    reason: יִיטַב לָךְ అనే నానుడి వ్యక్తి శ్రేయస్సు లేదా క్షేమాన్ని సూచిస్తుంది; ఇది “నీకు మేలు కలుగుతుంది”కు సహజమైన ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “నేలపై.”
    reason: עַל הָאֲדָמָהను అక్షరార్థానికి దగ్గరగా “నేలపై” అని అనవచ్చు; సందర్భంలో అది దేవుడు ఇస్తున్న వాగ్దాన భూభాగాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: כַּבֵּד
  choice: గౌరవించు
  rationale: כבד అనే క్రియకు ఇక్కడ తల్లిదండ్రులను విలువైనవారిగా ఎంచి, తగిన గౌరవంతో చూడాలనే భావం ఉంది. ‘గౌరవించు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ నైతిక బలాన్ని నిలుపుతుంది.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: నీ తండ్రిని, నీ తల్లిని
  rationale: హీబ్రూలో ప్రతి నామవాచకానికి ముందు ప్రత్యక్ష కర్మ సూచికను పునరావృతం చేసి ఇద్దరికీ సమాన ప్రాధాన్యం ఇచ్చింది. తెలుగులో రెండు పదాల ముందూ ‘నీ’ని ఉంచి ఆ సమతౌల్యాన్ని నిలిపాం.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: నీకు ఆజ్ఞాపించినట్లే
  rationale: దేవుడు ముందే ఇచ్చిన ఆజ్ఞకు అనుగుణంగా నడుచుకోవాలనే పోలికను ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ వ్యక్తినామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ నిబంధన సంబంధాన్ని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో ఆజ్ఞకు అనుసంధానమైన ఉద్దేశం/ఫలితాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘అప్పుడు’ వాడాం; వాక్యంలోని దీర్ఘాయుష్షు, మేలు అనే ఫలిత సంబంధం అలాగే ఉంది.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: నీ రోజులు దీర్ఘమవుతాయి
  rationale: ‘నీ రోజులు’నే కర్తగా ఉంచి హీబ్రూ రూపకాన్ని సాధ్యమైనంత దగ్గరగా కాపాడుతుంది; ‘నీవు ఎక్కువకాలం జీవిస్తావు’ కంటే మూలపాఠానికి మరింత సన్నిహితం.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: నీకు మేలు కలుగుతుంది
  rationale: ייטב לך అనే శ్రేయస్సును సూచించే నానుడిని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అది కేవలం ఆర్థిక సమృద్ధి అని సంకుచితం చేయదు.
- source_word: עַל הָאֲדָמָה
  choice: నేలపై
  rationale: עַל అనే ఉపసర్గలోని ‘పై’ భావాన్ని, אֲדָמָה సూచించే దేవుడు ఇస్తున్న భూభాగాన్ని రెండింటినీ నిలుపుతుంది. ‘దేశంలో’ అనేది సందర్భానుకూల ప్రత్యామ్నాయం.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: వర్తమాన కృదంత రూపం దేవుని భూదానాన్ని కొనసాగుతున్న లేదా సమీప నిశ్చిత కార్యంగా చూపుతుంది; తెలుగు ‘ఇస్తున్న’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా లేదా ‘ప్రభువు’
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ‘యహ్వే’గా ఇచ్చాం.
- issue: తల్లిదండ్రులను గౌరవించడానికి జతచేసిన వాగ్దానం స్వభావం
  choice: నేలపై దీర్ఘాయుష్షు, శ్రేయస్సు అనే నిబంధన వాగ్దానాన్ని మూలపాఠం చెప్పిన విధంగానే ఉంచడం
  alternative: ప్రతి వ్యక్తికీ తప్పనిసరిగా దీర్ఘాయుష్షు లభిస్తుందనే సంపూర్ణ హామీగా లేదా కేవలం జాతీయ ప్రతీకగా వివరించడం
  rationale: హీబ్రూ నిజమైన వాగ్దానాన్ని ప్రకటిస్తుంది; అయితే దాని వ్యక్తిగత, సామూహిక పరిధిని ఈ వాక్యమే పూర్తిగా నిర్వచించదు. అందువల్ల అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నీ తండ్రిని, నీ తల్లిని’ అనే సమాంతర నిర్మాణం ఇద్దరికీ మూలపాఠం ఇచ్చిన సమాన ప్రాధాన్యాన్ని నిలుపుతుంది. కారణ–ఫలిత సంబంధాన్ని సహజమైన తెలుగు వాక్యక్రమం కోసం ‘అప్పుడు’తో వ్యక్తపరిచాం; భూదాన సూచనను ఫలిత వాక్యంలో ముందుకు తెచ్చాం.
