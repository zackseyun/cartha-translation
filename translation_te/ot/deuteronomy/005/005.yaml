  to: 'ఆ సమయంలో యాహ్వేకూ మీకూ మధ్య నేను నిలబడి ఉన్నాను, యాహ్వే వాక్యాన్ని మీకు తెలియజేయడానికి; ఎందుకంటే మీరు అగ్ని కారణంగా[a] భయపడి కొండ ఎక్కలేదు. ఇలా:'
  rationale: క్రియాకాలం మరియు ఉద్దేశార్థక సంబంధాన్ని మూల హీబ్రూ వాక్యనిర్మాణానికి అనుగుణంగా సవరించాం. ‘అగ్ని సన్నిధికి భయపడి’ అనే అసహజ విభక్తి నిర్మాణం స్థానంలో, పాదటిప్పణిలో అక్షరార్థాన్ని కాపాడుతూ ప్రధాన పాఠంలో ‘అగ్ని కారణంగా భయపడి’ అని స్పష్టంగా ఇచ్చాం. తరువాతి వచనానికి కొనసాగింపునిచ్చే לֵאמֹרను కర్తను జోడించకుండా ‘ఇలా:’గా అందించాం.
