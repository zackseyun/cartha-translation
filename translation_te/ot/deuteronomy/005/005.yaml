source:
  edition: WLC
  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: te
  text: 'ఆ సమయంలో యాహ్వేకూ మీకూ మధ్య నేను నిలబడి ఉన్నాను, యాహ్వే వాక్యాన్ని మీకు తెలియజేయడానికి; ఎందుకంటే మీరు అగ్ని కారణంగా[a] భయపడి కొండ ఎక్కలేదు. ఇలా:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘అగ్ని ముఖం/సన్నిధి నుండి’ అని ఉంది; ఇక్కడ అది అగ్ని కారణంగా కలిగిన భయాన్ని సూచించే పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: నేను నిలబడి
  rationale: స్వతంత్ర సర్వనామం మోషే మధ్యవర్తిత్వ పాత్రను ముందుకు తెస్తుంది; Qal participle సూచించే కొనసాగుతున్న స్థితిని తెలుగు సహాయక క్రియను భారంగా చేర్చకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: యాహ్వేకు, మీకు మధ్య
  rationale: రెండు పక్షాల మధ్య మోషే ఉన్న మధ్యవర్తిత్వ స్థానాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: హోరేబు సంఘటనను సూచించే కాలవ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְהַגִּיד לָכֶם אֶת דְּבַר יְהוָה
  choice: యాహ్వే మాటను మీకు తెలియజేశాను
  rationale: נגד Hiphil యొక్క తెలియజేయడం/ప్రకటించడం భావాన్ని, דבר యొక్క దైవిక మాట భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כִּי יְרֵאתֶם
  choice: ఎందుకంటే మీరు ... భయపడి
  rationale: כִּי ఇక్కడ మోషే మధ్యవర్తిత్వానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో కారణ సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: అగ్ని సన్నిధికి భయపడి
  rationale: ‘అగ్ని ముఖం/సన్నిధి నుండి’ అనే మూల రూపకాన్ని కొంత నిలుపుతూ, అగ్ని కారణంగా కలిగిన భయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: కొండ ఎక్కలేదు
  rationale: עלה యొక్క పైకి వెళ్లే దిశను సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పబడింది:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; హీబ్రూలో కర్త స్పష్టంగా చెప్పబడనందున తెలుగులోనూ ‘ఆయన’ అని కర్తను చేర్చకుండా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: לֵאמֹר వద్ద మాట చెప్పేవారి గుర్తింపు
  choice: కర్తను పేర్కొనని ‘ఇలా చెప్పబడింది:’
  alternative: ‘ఆయన ఇలా అన్నాడు:’ లేదా ‘అని చెప్పడానికి’
  rationale: తదుపరి మాట యాహ్వేదేనని సందర్భం సూచించినా, ఈ పదంలో కర్త ప్రత్యక్షంగా లేదు. కర్తను చేర్చి వ్యాకరణ అస్పష్టతను పూర్తిగా పరిష్కరించకుండా, ప్రత్యక్ష వాక్యానికి మార్పును స్పష్టంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సరళతతో పాటు దైవవాక్య సందర్భానికి తగిన గంభీరతను ఉంచింది. ‘యాహ్వే మాట’ అనే రూపం మూలంలోని דבר יהוה ను మతశాఖాపరమైన అదనపు వ్యాఖ్య లేకుండా నిలుపుతుంది.
