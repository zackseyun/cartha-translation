    rationale: ‘నేను నిలబడి’ అసంపూర్ణంగా అనిపించవచ్చు; గత సందర్భంలో participleకు ‘నేను నిలబడి ఉన్నాను’ సహజమైన, నమ్మదగిన ప్రతిరూపం.
