- from: అయితే నువ్వు ఇక్కడ నాతో నిలబడు. నేను నీకు ఆజ్ఞ అంతటినీ[a], కట్టడలను, న్యాయవిధులను తెలియజేస్తాను. నువ్వు వాటిని వారికి బోధించాలి; నేను వారికి స్వాధీనం చేసుకోవడానికి[b] ఇస్తున్న దేశంలో వారు వాటిని పాటించాలి.
