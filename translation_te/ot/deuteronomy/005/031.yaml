  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: te
  text: అయితే నీవు ఇక్కడ నాతో నిలబడు. నేను నీకు ఆజ్ఞ అంతటినీ[a], కట్టడలనూ, న్యాయవిధులనూ తెలియజేస్తాను. నీవు వాటిని వారికి బోధించాలి; వారు వాటిని పాటించడానికి, వారికి స్వాధీనం చేసుకోవడానికి[b] నేను ఇస్తున్న దేశంలో ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొత్తం ఆజ్ఞను.’ ఇక్కడ హీబ్రూలో ‘ఆజ్ఞ’ ఏకవచనంలో ఉంది; దాని తరువాత ‘కట్టడలు,’ ‘న్యాయవిధులు’ అనే బహువచన పదాలు వస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారసత్వంగా పొందడానికి’ లేదా ‘దాన్ని స్వాధీనం చేసుకోవడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: ఇక్కడ నాతో నిలబడు
  rationale: עָמַד అనే క్రియలోని ‘నిలబడు’ అనే స్పష్టమైన భావాన్ని, ఆజ్ఞలోని గంభీరతను నిలుపుతుంది; సందర్భంలో దేవుని సన్నిధిలో ఉండిపోవడం కూడా సూచితమవుతుంది.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: నేను నీకు ... తెలియజేస్తాను
  rationale: ఆజ్ఞ తరువాత ఉన్న cohortative రూపం ఇక్కడ దేవుడు మోషేకు చెప్పబోయే ఉపదేశాన్ని సూచిస్తుంది. తెలుగులో ‘తెలియజేస్తాను’ అనేది విషయాన్ని బోధనార్థంగా చెప్పడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: ఆజ్ఞ అంతటినీ
  rationale: మִצְוָה ఏకవచనాన్ని మార్చకుండా, כָּל సూచించే సంపూర్ణతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחֻקִּים
  choice: కట్టడలను
  rationale: నిబంధనాత్మకంగా స్థాపించబడిన నియమాల భావాన్ని ఇస్తూ, తరువాతి מִשְׁפָּטִים నుండి పదభేదాన్ని నిలుపుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులను
  rationale: న్యాయనిర్ణయాలు, చట్టపరమైన విధులు అనే భావపరిధిని వ్యక్తం చేస్తూ న్యాయానికి సంబంధించిన మూలభావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: నువ్వు వాటిని వారికి బోధించాలి
  rationale: మోషేకు అప్పగించిన బోధనా బాధ్యతను స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְעָשׂוּ
  choice: వారు వాటిని పాటించాలి
  rationale: నియమాలను ‘చేయడం’ అనే హీబ్రూ భావం తెలుగులో ‘పాటించడం’గా సహజంగా వ్యక్తమవుతుంది; ఆచరణాత్మక విధేయతను నిలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: నేను వారికి ... ఇస్తున్న
  rationale: నֹתֵן participle లోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు దానక్రియను ‘ఇస్తున్న’ అనే రూపం నిలుపుతుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: దేశాన్ని తమ ఆధీనంలోకి తీసుకొని దానిని కలిగియుండడం అనే יָרַשׁ భావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది; ‘వారసత్వంగా పొందడం’ కూడా సాధ్యమైన అర్థం.
theological_decisions:
- issue: మִצְוָה / חֻקִּים / מִשְׁפָּטִים అనే న్యాయపరమైన త్రయం
  choice: ‘ఆజ్ఞ’, ‘కట్టడలు’, ‘న్యాయవిధులు’ అనే వేర్వేరు పదాలను ఉంచడం
  alternative: ‘ధర్మశాస్త్రం’, ‘నియమాలు’ వంటి సాధారణ సమగ్ర పదబంధంగా మార్చడం
  rationale: మూలంలోని న్యాయపరమైన పదవైవిధ్యాన్ని కలిపివేయకుండా, దేవుని నిబంధన ఉపదేశంలోని విభిన్న కోణాలను నిలుపుతుంది.
- issue: మִצְוָה ఏకవచనం
  choice: ‘ఆజ్ఞ అంతటినీ’ అని ఏకవచనంలో ఉంచడం
  alternative: ‘ఆజ్ఞలన్నిటినీ’ అని బహువచనం చేయడం
  rationale: ఈ నామవాచకం సమూహార్థకంగా ఉండవచ్చన్న సందిగ్ధతను పరిష్కరించకుండా, హీబ్రూ ఏకవచన రూపాన్నీ כָּל సూచించే సంపూర్ణతనూ నిలుపుతుంది.
- issue: וְעָשׂוּ యొక్క సంబంధం
  choice: బోధన తరువాత వారు వాటిని పాటించాలనే ఉద్దేశ్య/బాధ్యత భావంతో అనువదించడం
  alternative: ‘వారు వాటిని పాటిస్తారు’ అనే కేవల భవిష్యదర్థం
  rationale: సందర్భంలో మోషే బోధన ప్రజల ఆచరణకు దారితీయాలి; అయినా మూలంలోని సంక్షిప్త సమన్వయ నిర్మాణాన్ని అతిగా సిద్ధాంతీకరించకుండా వాక్యాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని వాడాం. దేవుడు మోషేతో నేరుగా మాట్లాడుతున్నందున ఏకవచన సంబోధనగా ‘నువ్వు’ వాడాం. మూలంలోని న్యాయపరమైన మూడు పదాల భేదాన్ని కాపాడుతూ, తెలుగు వాక్యప్రవాహం కోసం వాక్యాన్ని మూడు భాగాలుగా విభజించాం. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల దగ్గరే ఉంచాం.
