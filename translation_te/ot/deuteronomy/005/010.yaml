revisions:
- from: కాని నన్ను ప్రేమించి, ఆయన ఆజ్ఞలను పాటించేవారిలో వేలమందికి నిబద్ధ ప్రేమ చూపుతాను.[a]
  to: కాని, నన్ను ప్రేమించి ఆయన ఆజ్ఞలను పాటించేవారైన వేలమందికి నిబద్ధ ప్రేమను చూపుతాను.[a]
  rationale: The revision removes the added partitive expression “వారిలో” while preserving the source’s compact association of “thousands” with those who love the speaker and keep his commandments. The supplied Hebrew third-person suffix remains in the main text, and the significant first-person textual alternative remains clearly anchored in the footnote.
