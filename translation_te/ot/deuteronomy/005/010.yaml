  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: te
  text: కాని, నన్ను ప్రేమించి ఆయన ఆజ్ఞలను పాటించేవారైన వేలమందికి నిబద్ధ ప్రేమను చూపుతాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలోను అనువాదాలలోను ‘నా ఆజ్ఞలను’ అని ఉంది; ఇది సందర్భంలోని మొదటి పురుష సంభాషణకు సరిపోతుంది. అయితే ఇక్కడ అందించిన హీబ్రూ పాఠంలో ‘ఆయన ఆజ్ఞలను’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: కాని ... చూపుతాను
  rationale: ఈ అసమాపక క్రియ ముందటి వచనంలోని శిక్షకు భిన్నమైన దేవుని నిరంతర చర్యను తెలియజేస్తుంది. సందర్భంలోని వ్యతిరేక భావాన్ని ‘కాని’ సహజంగా వ్యక్తం చేస్తుంది; మొదటి పురుష సంభాషణను తెలుగులో సంపూర్ణ క్రియగా పలకడం స్పష్టంగా ఉంటుంది.
- source_word: חֶסֶד
  choice: నిబద్ధ ప్రేమ
  rationale: ఈ పదం కేవలం కనికరాన్ని కాక, సంబంధంలో విశ్వసనీయంగా నిలిచే ప్రేమనూ విధేయతనూ సూచిస్తుంది. ‘నిబద్ధ ప్రేమ’ ఈ భావగాంభీర్యాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: לַאֲלָפִים
  choice: వేలమందికి
  rationale: హీబ్రూ పాఠంలో ‘తరాలు’ అనే నామవాచకం లేదు. వ్యక్తులను సూచించే పరిసర సందర్భానికి అనుగుణంగా, లేని పదాన్ని చేర్చకుండా ‘వేలమందికి’ అని అనువదించబడింది.
- source_word: לְאֹהֲבַי
  choice: నన్ను ప్రేమించి ... వారిలో
  rationale: మొదటి పురుష ప్రత్యయంతో ఉన్న కర్తృవాచక రూపాన్ని సహజమైన తెలుగు సంబంధ వాక్య నిర్మాణంలో వ్యక్తం చేసింది.
- source_word: וּלְשֹׁמְרֵי
  choice: పాటించేవారిలో
  rationale: שמר ఆజ్ఞలతో వచ్చినప్పుడు వాటిని కాపాడడం, ఆచరించడం, పాటించడం అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆజ్ఞలను పాటించడం’ అత్యంత సహజమైన ప్రయోగం.
- source_word: מצות/ו
  choice: ఆయన ఆజ్ఞలను
  rationale: అందించిన WLC పాఠంలోని మూడవ పురుష ఏకవచన ప్రత్యయాన్ని అనుసరించి ‘ఆయన’ అని అనువదించబడింది; చుట్టుపక్కల మొదటి పురుష సంభాషణకు సరిపడేలా దానిని మౌనంగా మార్చలేదు.
theological_decisions:
- issue: ‘ఆజ్ఞలు’తో ఉన్న సర్వనామం
  choice: ఆయన ఆజ్ఞలను
  alternative: నా ఆజ్ఞలను
  rationale: అందించిన హీబ్రూ రూపం మూడవ పురుష ఏకవచన ప్రత్యయాన్ని కలిగి ఉంది. సందర్భం మరియు కొన్ని పాఠసంప్రదాయాలు మొదటి పురుష రూపాన్ని సమర్థించినప్పటికీ, ప్రధాన పాఠం ఇచ్చిన రూపాన్ని నిలుపుతుంది; సందర్భోచితమైన ప్రత్యామ్నాయం పాదసూచికలో తెలియజేయబడింది.
- issue: ‘వేల’ అనే పదానికి పూరించవలసిన నామవాచకం
  choice: వేలమందికి
  alternative: వెయ్యి తరాల వరకు / వేల తరాలకు
  rationale: ఈ వచనంలోని హీబ్రూ పాఠంలో ‘తరాలు’ లేదు. సమాంతర వాక్యాల ఆధారంగా దానిని చేర్చకుండా, అసలు పాఠంలోని సంక్షిప్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘నిబద్ధ ప్రేమ’ ద్వారా חֶסֶד లోని స్థిరత్వం, సంబంధ నిష్ఠ రెండూ నిలుపబడ్డాయి. పాఠంలోని అసాధారణ మూడవ పురుష సర్వనామాన్ని ప్రధాన వాక్యంలో ఉంచి, ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఇచ్చాం.
