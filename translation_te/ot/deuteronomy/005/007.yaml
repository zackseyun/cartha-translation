  text: You shall have no other gods before me[a].
translation:
  language: te
  text: నా ఎదుట నీకు వేరే దేవుళ్లు ఉండకూడదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు తప్ప.” హీబ్రూలో అక్షరార్థంగా, “నా ముఖం ఎదుట.” ఈ పదబంధం “నా సన్నిధిలో” అనే భావాన్నీ, “నాకు తప్ప” అనే ప్రత్యేకత భావాన్నీ సూచించగలదు.
