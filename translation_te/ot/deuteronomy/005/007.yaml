lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: నీకు ఉండకూడదు
  rationale: హీబ్రూ ‘నీకు ఉండకూడదు/నీ కోసం ఉండకూడదు’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిషేధార్థంతో వ్యక్తం చేస్తుంది; ఏకవచన సంబోధనను ‘నీకు’ నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: వేరే దేవుళ్లు
  rationale: ‘ఇతర దేవతలు’ అన్న భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; ఈ సందర్భంలో బహువచనం ప్రత్యర్థి దేవుళ్లను సూచిస్తుంది.
- source_word: עַל־פָּנָי
  choice: నా సన్నిధిలో నాకు తప్ప
  rationale: అక్షరార్థమైన ‘నా ముఖం ఎదుట’లోని సన్నిధి భావాన్నీ, సందర్భంలోని ఏకైక భక్తి భావాన్నీ తెలుగులో సహజంగా కలిపి వ్యక్తం చేస్తుంది; పదబంధపు విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: עַל־פָּנָי అనే చివరి పదబంధం యొక్క భావం
  choice: నా సన్నిధిలో నాకు తప్ప
  alternative: నా ఎదుట; నాతో పాటు
  rationale: ఈ హీబ్రూ పదబంధం ‘నా ముఖం ఎదుట/నా సన్నిధిలో’ అనే ఉనికి భావాన్నీ, ఈ నిషేధ సందర్భంలో ‘నాకు తప్ప/నాతో పాటు మరెవరూ కాదు’ అనే ప్రత్యేక భక్తి భావాన్నీ మోయగలదు. ప్రధాన పాఠ్యం రెండింటినీ సహజ తెలుగులో ప్రతిబింబిస్తుంది; పాదటిప్పణి అక్షరార్థాన్ని, ప్రత్యామ్నాయ రూపాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ఏకవచన ఒడంబడిక సంబోధనను ‘నీకు’తో నిలిపాం.
