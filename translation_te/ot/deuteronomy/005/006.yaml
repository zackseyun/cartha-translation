reference: Deuteronomy 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: te
  text: నిన్ను ఈజిప్టు దేశం నుండి, బానిసల ఇంటి నుండి బయటకు తీసుకొచ్చిన నీ దేవుడైన యాహ్వేను నేనే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: భావానువాదంగా, “దాసత్వ గృహం నుండి” అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా “బానిసల ఇంటి నుండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: నేనే
  rationale: హీబ్రూలోని స్వతంత్ర ప్రథమ పురుష సర్వనామం గంభీరమైన స్వీయ గుర్తింపును నొక్కి చెబుతుంది; తెలుగులో ‘నేనే’ ఆ ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఏకవచన ద్వితీయ పురుష ప్రత్యయాన్ని ‘నీ’గా నేరుగా వ్యక్తం చేశాం; నిబంధన సందర్భంలో ఇది యాహ్వేను సూచిస్తుంది.
- source_word: אֲשֶׁר
  choice: …తీసుకొచ్చిన
  rationale: సంబంధవాచక పదాన్ని తెలుగులో సహజమైన సంబంధ క్రియారూపంతో వ్యక్తం చేశాం.
- source_word: הוֹצֵאתִיךָ
  choice: నిన్ను … బయటకు తీసుకొచ్చిన
  rationale: יצא ధాతువు హిఫీల్ రూపానికి ‘బయటకు తీసుకురావడం’ అనే కారణార్థం ఉంది; ‘నిన్ను’ ప్రత్యయాన్ని కూడా స్పష్టంగా నిలిపాం.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఈజిప్టు దేశం నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నుండి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: దాసుల ఇంటి నుండి
  rationale: עֲבָדִים బహువచన నామవాచకంలోని వ్యక్తిగత, సామాజిక వాస్తవాన్ని ‘దాసులు’గా నిలిపి, ‘దాసత్వం’ అనే అమూర్తీకరణను ప్రధాన పాఠ్యంలో నివారించాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నిబంధన నామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇచ్చాం.
- issue: עֲבָדִים అనే పదాన్ని నిర్గమ సందర్భంలో వ్యక్తం చేయడం
  choice: దాసులు
  alternative: దాసత్వం / సేవకులు
  rationale: ఇక్కడ బానిసలుగా ఉన్న స్థితి నుండి విముక్తి ప్రధానాంశం. బహువచనంలోని స్పష్టమైన మానవ సూచనను ‘దాసులు’ నిలుపుతుంది; ‘సేవకులు’ బలవంతపు బానిసత్వ తీవ్రతను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన వాక్య నిర్మాణం ఉపయోగించాం. హీబ్రూ వాక్యారంభంలోని ఉద్ఘాటనను తెలుగులో సహజంగా నిలపడానికి ‘నేనే’ను చివర ఉంచాం. అడుగుజాడ [a] ప్రధాన పాఠ్యంలో తప్పనిసరిగా చేర్చబడింది.
