  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: te
  text: నీ పొరుగువానికి వ్యతిరేకంగా అబద్ధ సాక్ష్యం చెప్పకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పొరుగువానికి వ్యతిరేకంగా అబద్ధంగా సాక్ష్యం ఇవ్వకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: చెప్పకూడదు
  rationale: హీబ్రూ నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఆజ్ఞారూప నిషేధంగా వ్యక్తం చేస్తుంది.
- source_word: תַעֲנֶה
  choice: చెప్పు
  rationale: ענה అనే క్రియ సాధారణంగా ‘జవాబిచ్చు’ అని అర్థమవగలిగినా, עֵדతో కూడిన న్యాయ సందర్భంలో సాక్ష్యమివ్వడాన్ని సూచిస్తుంది; తెలుగులో ‘సాక్ష్యం చెప్పు’ సహజమైన న్యాయపరమైన ప్రయోగం.
- source_word: בְרֵעֲךָ
  choice: నీ పొరుగువానికి వ్యతిరేకంగా
  rationale: רֵעַ తోటి వ్యక్తి, సహచరుడు, లేదా పొరుగువానిని సూచిస్తుంది. ఇక్కడ בְ న్యాయసాక్ష్య సందర్భంలో ‘వ్యతిరేకంగా’ అనే భావాన్ని ఇస్తుంది.
- source_word: עֵד
  choice: సాక్ష్యం
  rationale: ఇక్కడ עֵד సాక్షి లేదా సాక్ష్యాన్ని సూచించే న్యాయపదం; తెలుగు క్రియాప్రయోగంలో ‘సాక్ష్యం చెప్పు’ మూలంలోని సంక్షిప్త న్యాయభావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שָׁוְא
  choice: అబద్ధ
  rationale: שָׁוְא కు వ్యర్థత, మోసం, అసత్యం వంటి భావాలు ఉన్నా, న్యాయస్థాన సాక్ష్య సందర్భంలో ‘అబద్ధ’ అత్యంత సహజమైన మరియు ఖచ్చితమైన ఎంపిక.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. సంప్రదాయ న్యాయపదబంధమైన ‘అబద్ధ సాక్ష్యం చెప్పు’ను నిలుపుతూ, పాదటిప్పణిలో మరింత క్రియాత్మకమైన ప్రత్యామ్నాయం ఇవ్వబడింది.
