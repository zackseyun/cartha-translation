  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: te
  text: వెళ్లి వారికి, ‘మీ గుడారాలకు తిరిగి వెళ్లండి’ అని చెప్పు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: నువ్వు వెళ్లి
  rationale: הלך క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం. తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానించేందుకు తెలుగులో ‘వెళ్లి’ అని ఇచ్చాం; కర్త ఏకవచనమని స్పష్టంచేయడానికి ‘నువ్వు’ చేర్చాం.
- source_word: אֱמֹר
  choice: చెప్పు
  rationale: אמר క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం; సందేశాన్ని వారికి తెలియజేయమనే సాధారణ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָהֶם
  choice: వారితో
  rationale: לְ ఉపసర్గతో కూడిన మూడవ పురుష బహువచన ప్రత్యయం మాట చెప్పబడే వ్యక్తులను సూచిస్తుంది; ‘చెప్పు’తో తెలుగులో ‘వారితో’ సహజ ప్రయోగం.
- source_word: שׁוּבוּ
  choice: తిరిగి వెళ్లండి
  rationale: שוב క్రియ యొక్క బహువచన ఆజ్ఞారూపం, ముందున్న నివాసస్థలానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది. గౌరవ/బహువచన ఆజ్ఞగా ‘వెళ్లండి’ సరిపోతుంది.
- source_word: לָכֶם
  choice: మీ
  rationale: రెండవ పురుష బహువచన ప్రత్యయం వారి స్వంత స్థలానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో స్వామ్యవాచకమైన ‘మీ’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: לְאָהֳלֵיכֶם
  choice: గుడారాలకు
  rationale: אהל అనే పదానికి ఇక్కడ అక్షరార్థంగా ‘గుడారం’; అరణ్య ప్రయాణపు చారిత్రక నేపథ్యాన్ని నిలుపుతూ బహువచన గమ్యార్థంతో ‘గుడారాలకు’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు. దేవుడు మోషేతో ఏకవచనంలో మాట్లాడుతున్నందున ‘నువ్వు…చెప్పు’ అని, ప్రజలకు ఇచ్చే బహువచన ఆజ్ఞను ‘వెళ్లండి’ అని వేరు చేశాం. వాక్యం సహజంగా వినిపించేలా వరుస ఆజ్ఞలను ‘వెళ్లి…చెప్పు’గా అనుసంధానించాం.
