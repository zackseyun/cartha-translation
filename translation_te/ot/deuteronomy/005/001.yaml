source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: te
  text: 'మోషే ఇశ్రాయేలీయులందరినీ పిలిచి వారితో ఇలా అన్నాడు: “ఇశ్రాయేలూ, నేను ఈ రోజు మీకు వినిపిస్తున్న శాసనాలను, న్యాయవిధులను శ్రద్ధగా వినండి[a]. వాటిని నేర్చుకొని, వాటి ప్రకారం నడుచుకునేలా జాగ్రత్తగా పాటించండి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శ్రద్ధగా వినండి’ అని అనువదించిన హీబ్రూ ఆజ్ఞ కేవలం చెవులతో వినడమే కాక, విన్నదాన్ని స్వీకరించి దానికి విధేయత చూపే భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘పాటించండి’ అనే మాటలో జాగ్రత్తగా కాపాడుకోవడం, గమనించడం అనే భావమూ ఉంది; చివరి పదబంధం వాటిని ఆచరణలో పెట్టడాన్ని లక్ష్యంగా చూపుతుంది.
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: ఈ కథన సందర్భంలో קרא ప్రజలను పిలవడం లేదా సమకూర్చడం అనే భావాన్ని ఇస్తుంది. ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు; అధికారిక సమాహ్వానాన్ని అవసరానికి మించి స్పష్టీకరించదు.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే సమష్టి భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ, ... శ్రద్ధగా వినండి
  rationale: שׁמע కేవలం శబ్దాన్ని వినడమే కాక, విధేయతకు నడిపే శ్రద్ధపూర్వక వినికిడిని సూచిస్తుంది. సంబోధనను సహజ తెలుగు వాక్యక్రమంలో ఉంచి, ‘శ్రద్ధగా’తో ఆ భావాన్ని వ్యక్తం చేశాం.
- source_word: הַחֻקִּים
  choice: శాసనాలు
  rationale: חקים నిర్దేశించబడిన చట్టాలను సూచిస్తుంది. ‘శాసనాలు’ న్యాయ-నిబంధనల గంభీరతను నిలుపుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: משפטים న్యాయనిర్ణయాలు, నియమాలు లేదా నిర్దేశిత న్యాయప్రమాణాలను సూచించగలదు. ‘న్యాయవిధులు’ అనే పదం חקיםతో తేడాను నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: דֹּבֵר בְּאָזְנֵיכֶם הַיּוֹם
  choice: నేను ఈ రోజు మీకు వినిపిస్తున్న
  rationale: వర్తమానంలో కొనసాగుతున్న ప్రసంగాన్ని, ‘మీ చెవుల్లో’ అనే హీబ్రూ నుడికారంలోని ప్రత్యక్ష శ్రవణ భావాన్ని సహజ తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: వాటిని నేర్చుకొని
  rationale: చట్టాలను స్వీకరించి అవగాహన చేసుకోవాలనే పిలుపును నేరుగా తెలియజేస్తుంది.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: వాటి ప్రకారం నడుచుకునేలా జాగ్రత్తగా పాటించండి
  rationale: שׁמר యొక్క జాగ్రత్తగా కాపాడి పాటించే భావాన్ని, לעשׂתם యొక్క ఆచరణ లక్ష్యాన్ని సహజ తెలుగులో కలిపి వ్యక్తం చేస్తుంది; విధేయతను కేవలం జ్ఞాపకంలో ఉంచడంగా పరిమితం చేయదు.
theological_decisions:
- issue: חקים / משפטים అనే నిబంధన-న్యాయ పదజోడును వేర్వేరుగా అనువదించడం
  choice: శాసనాలు, న్యాయవిధులు
  alternative: కట్టడలు, తీర్పులు; శాసనాలు, నియమాలు
  rationale: హీబ్రూలోని పరస్పర సంబంధమున్నా వేర్వేరు రెండు న్యాయపదాలను ఒకే సాధారణ పదంగా కలపకుండా వాటి భేదాన్ని నిలుపుతుంది; తరువాతి సిద్ధాంత వర్గీకరణలను చేర్చదు.
- issue: ఒడంబడిక సంబంధిత ఆదేశంలో שׁמע యొక్క బలం
  choice: శ్రద్ధగా వినండి
  alternative: వినండి
  rationale: ఈ ఆజ్ఞ శబ్దగ్రహణం మాత్రమే కాక, శ్రద్ధతో స్వీకరించి విధేయత చూపడాన్నీ సూచిస్తుంది. ‘శ్రద్ధగా వినండి’ ఆ విస్తృత భావాన్ని సహజ ఆధునిక తెలుగులో నిలుపుతుంది.
- issue: וּשְׁמַרְתֶּם לַעֲשֹׂתָם లో సంరక్షణ మరియు ఆచరణ మధ్య సంబంధం
  choice: వాటి ప్రకారం నడుచుకునేలా జాగ్రత్తగా పాటించండి
  alternative: వాటిని పాటించి ఆచరించండి
  rationale: చివరి క్రియారూపం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ‘నడుచుకునేలా’ ఆ సంబంధాన్ని ఉద్దేశపూర్వకంగా తెరిచి ఉంచి, ఆచరణాత్మక విధేయతను స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. న్యాయ-ఒడంబడిక సందర్భానికి తగిన గంభీరతను నిలుపుతూ, అసహజమైన పదక్షర అనువాదమైన ‘మీ చెవుల్లో’ను ‘మీకు వినిపిస్తున్న’గా సహజీకరించాం. ‘ఇశ్రాయేలూ’ అనే సంబోధన ద్వారా సమష్టి ప్రజాసమూహాన్ని ఉద్దేశించిన మూలపాఠ్య స్వరాన్ని నిలిపాం.
