source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే పేరును వ్యర్థంగా వాడకూడదు[a]. ఎందుకంటే యాహ్వే తన పేరును వ్యర్థంగా వాడేవాణ్ణి శిక్షించకుండా వదలడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అసత్యం కోసం,’ ‘తప్పుగా,’ లేదా ‘శూన్యంగా.’ హెబ్రీ పదం యాహ్వే పేరును అసత్యంగా లేదా అర్థరహితంగా వాడడాన్ని సూచించగలదు; ఇది ఒకే రకమైన దుర్వినియోగానికి పరిమితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిర్దోషిగా తీర్చడు,’ లేదా ‘నిర్దోషిగా విడిచిపెట్టడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: ఉపయోగించు
  rationale: ఈ క్రియకు ‘ఎత్తు, మోయు, చేపట్టు’ అనే విస్తృత అర్థాలు ఉన్నా, ‘పేరు’తో కూడిన ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘ఉపయోగించు’ అని ఇవ్వడం ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది. ‘ఉచ్చరించు’ అని అనడం నిషేధాన్ని కేవలం మాటలకే పరిమితం చేసే ప్రమాదం ఉంది.
- source_word: שֵׁם
  choice: పేరు
  rationale: మూలంలోని సాధారణ పదాన్ని అలాగే నిలుపుతుంది; దానిలో ప్రతిష్ఠ, అధికారం, పిలువబడే వ్యక్తిత్వం వంటి భావసూచనలు ఉన్నప్పటికీ వాటిని ప్రధాన పాఠ్యంలో వివరణగా చేర్చలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఏకవచన రెండవ పురుషునికి ఇచ్చిన ప్రత్యక్ష నిబంధనాత్మక సంబోధనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַשָּׁוְא
  choice: వ్యర్థంగా
  rationale: שָׁוְא పదంలోని శూన్యత, అసత్యం, పనికిమాలినత, అనుచితత్వం వంటి విస్తృత భావపరిధిని ఒకే నిర్దిష్ట అపరాధానికి కుదించకుండా తెలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יְנַקֶּה (נקה)
  choice: శిక్షించకుండా వదలడు
  rationale: ఈ సందర్భంలోని న్యాయపరమైన భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘నిర్దోషిగా ఎంచడు’ అనే మరింత రూపానుగుణ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: אֲשֶׁר
  choice: ఉపయోగించేవాణ్ణి
  rationale: అపరాధిని సాధారణంగా సూచించే సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగు క్రియారూపంలో అందిస్తుంది.
- source_word: שְׁמוֹ
  choice: తన పేరును
  rationale: యాహ్వే స్వంత పేరునే సూచిస్తున్నదని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యహ్వహ్ అనే దైవనామాన్ని ఎలా ఇవ్వాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం יְהוָה అనే వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నిబంధన నామాన్ని కాపాడుతుంది.
- issue: నిషేధపు పరిధి
  choice: పేరును వ్యర్థంగా ఉపయోగించడం
  alternative: పేరును అసత్యంగా మోయడం; పేరును దుర్వినియోగం చేయడం; అసత్యం కోసం పేరును ఉచ్చరించడం
  rationale: హెబ్రీ వాక్యం తప్పుడు ప్రమాణం, శూన్యమైన ఆహ్వానం, అనుచిత వినియోగం, దేవుని పేరును తప్పుగా ప్రతినిధ్యం చేయడం వంటి భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యం ఏ ఒక్క అర్థానికీ పరిమితం చేయకుండా విస్తృతతను నిలుపుతుంది.
- issue: దోషిని యాహ్వే విడిచిపెట్టడనే న్యాయపరమైన ప్రకటన
  choice: శిక్షించకుండా వదలడు
  alternative: నిర్దోషిగా ఎంచడు; నిర్దోషిగా విడిచిపెట్టడు
  rationale: נקה క్రియలోని నిర్దోషిగా ప్రకటించడం లేదా శిక్షనుంచి విడిపించడం అనే న్యాయపరమైన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందించింది; ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆజ్ఞారూపం వాడబడింది. ‘ఉచ్చరించకూడదు’ అనే సుపరిచిత రూపం నిషేధాన్ని కేవలం పలుకుబడికి కుదించవచ్చనే కారణంతో నివారించబడింది. మూలంలోని ఏకవచన ‘నీ’ సంబోధన నిలుపబడింది.
