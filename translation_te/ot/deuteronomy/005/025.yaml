id: DEU.5.25
reference: Deuteronomy 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: te
  text: ఇప్పుడు అయితే మనం ఎందుకు చనిపోవాలి? ఈ మహా అగ్ని మమ్మల్ని దహించివేస్తుంది. మన దేవుడైన యాహ్వే[a] స్వరాన్ని మనం ఇక కూడా వింటూ ఉంటే, మనం చనిపోతాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: יהוה (YHWH). ఈ అనువాదంలో దైవనామాన్ని “యాహ్వే”గా లిప్యంతరీకరించాము.'
    reason: దైవనామం యొక్క హీబ్రూ రూపాన్ని మరియు ఈ అనువాదంలో ఎంచుకున్న రూపాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ముందటి దైవప్రత్యక్షత నుంచి ప్రజలు తీసుకున్న తక్షణ నిర్ణయాన్ని సూచించే సంభాషణా మార్పును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వావ్ అనుసంధాన భావం సందర్భంలోనే స్పష్టంగా ఉంది.
- source_word: לָמָּה נָמוּת
  choice: మనం ఎందుకు చనిపోవాలి?
  rationale: అపూర్ణ క్రియారూపంలోని భయంతో కూడిన అలంకారిక ప్రశ్నను తెలుగులో సహజంగా ‘ఎందుకు ... చనిపోవాలి?’ అని నిలుపుతుంది.
- source_word: כִּי תֹאכְלֵנוּ
  choice: దహించివేస్తుంది
  rationale: అక్షరార్థంగా ‘మనలను తినివేస్తుంది’; అగ్ని కర్తగా ఉన్నప్పుడు ‘దహించివేస్తుంది’ విధ్వంసక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: ఈ మహా అగ్ని
  rationale: నామవాచకం, విశేషణం, నిర్దేశక సర్వనామం కలిగిన హీబ్రూ పదబంధాన్ని గంభీరమైన, సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: మనం ఇంకా వింటూ ఉంటే
  rationale: יסף + క్రియార్థక రూపం తెలిపే ‘కొనసాగించడం/మళ్లీ చేయడం’ అనే భావాన్ని షరతుతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קוֹל
  choice: స్వరం
  rationale: దేవుని ప్రత్యక్ష పలుకును సూచించే సందర్భంలో విస్తృతార్థకమైన ‘శబ్దం’ కంటే ‘స్వరం’ తగినది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన దైవనామ రూపంతో అందిస్తుంది; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో ఇస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడైన
  rationale: ‘మన దేవుడు’ అనే నిబంధనాత్మక సంబంధాన్ని తరువాతి దైవనామంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: עוֹד וָמָתְנוּ
  choice: ఇంకా ... మనం చనిపోతాం
  rationale: ఇకముందు కూడా వినడం కొనసాగితే కలిగే భయకర ఫలితాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నిబంధన నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే ఉంచి, ఉచ్చారణ సంప్రదాయంలోని అనిశ్చితిని పాదసూచికలో సూచించాం.
- issue: ప్రజల మాటలో మరణం నిశ్చయమా లేక భయప్రకటనమా
  choice: షరతు నెరవేరితే సంభవించే నిశ్చిత ఫలితంగా ‘మనం చనిపోతాం’
  alternative: మనం చనిపోవచ్చు
  rationale: וָמָתְנוּ ప్రజల భయపూరిత నిర్ధారణను బలంగా వ్యక్తం చేస్తుంది; సంభావ్యతగా మృదువుచేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరతను నిలిపాం. ‘దహించివేస్తుంది’ అగ్ని ‘తినివేయడం’ అనే హీబ్రూ రూపకానికి సహజ తెలుగు సమానం. అలంకారిక ప్రశ్న, షరతు, ప్రజల భయ తీవ్రత యథాతథంగా నిలుపబడ్డాయి.
