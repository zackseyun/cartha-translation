id: DEU.5.32
reference: Deuteronomy 5:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: te
  text: కాబట్టి మీ దేవుడైన యాహ్వే మీకు ఆజ్ఞాపించినట్లే జాగ్రత్తగా చేయండి; కుడివైపుకైనా ఎడమవైపుకైనా మళ్లవద్దు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కుడివైపుకైనా ఎడమవైపుకైనా మళ్లవద్దు” అనేది దేవుడు ఆజ్ఞాపించిన దాని నుండి ఏ దిశలోనూ తప్పిపోవద్దని తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: జాగ్రత్తగా
  rationale: שׁמר అనే క్రియ לַעֲשׂוֹת అనే ఉద్దేశార్థక క్రియారూపంతో కలిసి, కేవలం కాపాడడం కాక ఆజ్ఞను శ్రద్ధగా పాటించి అమలు చేయాలనే భావాన్ని ఇస్తుంది.
- source_word: לַ/עֲשׂוֹת
  choice: చేయండి
  rationale: עשה ఇక్కడ దేవుని ఆజ్ఞలను ఆచరణలో అమలు చేయడాన్ని సూచిస్తుంది; సరళమైన 'చేయండి' మూలంలోని సాధారణ న్యాయ-విధేయత భావాన్ని నిలుపుతుంది.
- source_word: כַּ/אֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר దేవుని ఆజ్ఞకు సరిగ్గా అనుగుణంగా చేయాలని సూచిస్తుంది; '-ినట్లే' ఆ సరిపోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: పూర్తయిన ఆజ్ఞాపన ఇప్పటికీ బద్ధత కలిగిస్తుందనే సందర్భార్థాన్ని తెలుగు అసమాపక రూపం సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన 'యెహోవా'గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי/כֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన ప్రత్యయంతో ఉన్న నిర్మాణం నిబంధనాత్మక సంబంధాన్ని సూచించే 'మీ దేవుడు' అనే భావాన్ని నేరుగా ఇస్తుంది.
- source_word: לֹא תָסֻרוּ
  choice: తొలగిపోవద్దు
  rationale: סור ఇక్కడ నిర్దేశిత మార్గం లేదా ఆజ్ఞ నుండి దారి మళ్లడాన్ని రూపకంగా సూచిస్తుంది; 'తొలగిపోవద్దు' ఆ మార్గ రూపకాన్ని నిలుపుతుంది.
- source_word: יָמִין וּ/שְׂמֹאל
  choice: కుడికిగానీ ఎడమకిగానీ
  rationale: ఈ జంట ఏ దిశలోనూ ఆజ్ఞ నుండి తప్పకూడదనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో దిశార్థంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని 'ప్రభువు' అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు విస్తృతంగా పరిచితమైన 'యెహోవా' రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆజ్ఞారూపం వాడబడింది. రెండవ పురుష బహువచన భావాన్ని 'మీ', '-ండి' రూపాలతో నిలిపాం; మూలంలోని మార్గ రూపకాన్ని పాఠ్యంలో ఉంచి, దాని నుడికారార్థాన్ని పాదసూచికలో వివరించాం.
