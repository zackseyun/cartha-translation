source:
  edition: WLC
  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: te
  text: ఎందుకంటే, మనలాగే అగ్ని మధ్యలోనుండి మాట్లాడుతున్న సజీవ దేవుని స్వరాన్ని విని బ్రతికిన ఏ మానవుడు[a] ఉన్నాడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సర్వ శరీరం’; ఇది మర్త్య మానవాళిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలో ప్రజల భయానికి, వారి విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: ఇది అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామం; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: כָל בָּשָׂר
  choice: మనుషులందరిలో[a]
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘సర్వ శరీరం’ అని ఉండి, మర్త్య మానవాళిని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన తెలుగు వాడి, మూలభాష రూపకాన్ని పాదసూచికలో నిలిపాం.
- source_word: שָׁמַע
  choice: విని
  rationale: దేవుని స్వరాన్ని ప్రత్యక్షంగా విన్న పూర్తయిన అనుభవాన్ని తెలుగులో సహజమైన క్రియారూపంతో తెలియజేస్తుంది.
- source_word: קוֹל
  choice: స్వరాన్ని
  rationale: మాట్లాడుతున్న దేవుడే కర్త కాబట్టి సాధారణ ‘శబ్దం’ కంటే ‘స్వరం’ సందర్భానికి సరిపోతుంది.
- source_word: אֱלֹהִים חַיִּים
  choice: సజీవుడైన దేవుని
  rationale: రూపపరంగా బహువచన లక్షణాలు ఉన్నప్పటికీ, సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచన బిరుదు.
- source_word: מְדַבֵּר
  choice: మాట్లాడుతున్న
  rationale: దేవుడు అగ్ని మధ్యనుండి పలుకుతున్న దృశ్యాన్ని వర్తమాన క్రియాభావంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యనుండి
  rationale: స్వరం అగ్ని సమీపం నుంచి కాక, దాని లోపలి మధ్య నుంచి వచ్చిందనే మూలపాఠంలోని స్పష్టతను నిలుపుతుంది.
- source_word: כָמֹנוּ
  choice: మనలాగే
  rationale: ఇశ్రాయేలీయులు స్వయంగా పొందిన అనుభవంతో చేసే పోలికను నేరుగా తెలియజేస్తుంది.
- source_word: וַיֶּחִי
  choice: బ్రతికినవారు
  rationale: ‘జీవించాడు/బ్రతికాడు’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ‘ప్రాణాలతో బయటపడ్డారు’ అనే వివరణాత్మక భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: כָל בָּשָׂר లోని మానవశాస్త్రీయ నుడికారం
  choice: మనుషులందరిలో[a]
  alternative: సర్వ శరీరులలో
  rationale: మూలంలోని ‘శరీరం’ అనే నుడికారం మానవుల మర్త్యత్వం, సృష్టిత్వాన్ని సూచిస్తుంది. అయితే అక్షరానువాదం ఆధునిక తెలుగులో అసహజంగా ఉండేందున సహజ రూపాన్ని ప్రధాన వాక్యంలో ఉంచి, మూలరూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: אֱלֹהִים חַיִּים యొక్క సంఖ్య, భావం
  choice: సజీవుడైన దేవుడు
  alternative: సజీవులైన దేవుళ్లు
  rationale: రూపపరమైన బహువచన లక్షణాలున్నా, ఈ స్థిరపదబంధం సందర్భంలో ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది; బహువచన అనువాదం మూల వినియోగాన్ని తప్పుగా చూపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘అగ్ని మధ్యనుండి’ అనే దృశ్యాత్మక మూలభాష వ్యక్తీకరణను నిలిపి, ‘సర్వ శరీరం’ అనే అసహజ అక్షరానువాదాన్ని పాదసూచిక ద్వారా వివరించాం.
