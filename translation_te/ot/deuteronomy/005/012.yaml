  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: te
  text: విశ్రాంతిదినాన్ని పవిత్రంగా ఉంచడానికి జాగ్రత్తగా పాటించు[a], నీ దేవుడైన యాహ్వే నీకు ఆజ్ఞాపించినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్రాంతిదినాన్ని పాటించు’ లేదా ‘విశ్రాంతిదినాన్ని కాపాడు.’ హీబ్రూ క్రియ జాగ్రత్తతో కూడిన ఆచరణను నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: జాగ్రత్తగా ఆచరించి
  rationale: ఇక్కడ Qal infinitive absolute ఆజ్ఞార్థకంగా పనిచేస్తుంది. మూల క్రియలో కేవలం ఆచరించడం మాత్రమే కాక, శ్రద్ధగా కాపాడుతూ పాటించడం అనే భావం ఉంది; ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יוֹם הַשַׁבָּת
  choice: విశ్రాంతిదినాన్ని
  rationale: నిర్దిష్టంగా నియమించబడిన సబ్బాతు దినాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా ‘విశ్రాంతిదినం’ అని అనువదించబడింది.
- source_word: לְקַדְּשׁוֹ
  choice: దాన్ని పవిత్రంగా ఉంచు
  rationale: లామెద్‌తో కూడిన infinitive మరియు ప్రత్యయ సర్వనామం ఉద్దేశాన్ని సూచిస్తాయి. దినాన్ని పవిత్రమైనదిగా, ప్రత్యేకమైనదిగా పరిగణించి కాపాడాలనే భావాన్ని ఇది తెలియజేస్తుంది; ‘పవిత్రపరచు’ వల్ల కలగగల అంతర్గత పవిత్రతను సృష్టించే భావాన్ని నివారిస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లుగా
  rationale: ముందుగా దేవుడు ఇచ్చిన ఆజ్ఞకు అనుగుణంగా చేయాలని సూచించే సహజ తెలుగు నిర్మాణం.
- source_word: צִוְּךָ
  choice: నీకు ఆజ్ఞాపించిన
  rationale: צוה అధికారపూర్వకమైన ఆజ్ఞను సూచిస్తుంది. ద్వితీయ పురుష ఏకవచన ప్రత్యయం ‘నీకు’గా నిలుపబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తిగత నామరూపం ‘యెహోవా’గా ఉంచుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ద్వితీయ పురుష పుంలింగ ఏకవచన ప్రత్యయంతో ఉన్న నిబంధనా సంబంధ సూచనను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం ఎంచుకోబడింది.
- issue: విశ్రాంతిదినాన్ని పవిత్రంగా ఉంచడం
  choice: దాన్ని పవిత్రంగా ఉంచు
  alternative: దాన్ని పవిత్రపరచు
  rationale: మూలంలోని קדש ఇక్కడ ఆ దినాన్ని దేవునికి ప్రత్యేకమైనదిగా పరిగణించి ఆచరించడాన్ని సూచించగలదు. దానికి అంతర్గత పవిత్రతను మనిషే కలిగిస్తాడని ఏకపక్షంగా భావింపజేయకుండా ‘పవిత్రంగా ఉంచు’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే ఆజ్ఞారూపం వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యథాతథంగా అనుకరించకుండా సహజ తెలుగు క్రమం ఎంచుకోబడింది; అయితే దైవనామం, ఏకవచన సంబోధన, జాగ్రత్తగా ఆచరించాలనే నొక్కిచెప్పడం నిలుపబడ్డాయి.
