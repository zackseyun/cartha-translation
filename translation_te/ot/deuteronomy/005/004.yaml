id: DEU.5.4
reference: Deuteronomy 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פָּנִ֣ים בְּ/פָנִ֗ים דִּבֶּ֨ר יְהוָ֧ה עִמָּ/כֶ֛ם בָּ/הָ֖ר מִ/תּ֥וֹךְ הָ/אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: te
  text: యహ్వే పర్వతంపై అగ్నిమధ్య నుండి మీతో ముఖాముఖిగా మాట్లాడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ముఖానికి ముఖంగా.” ఇది ప్రత్యక్షమైన వ్యక్తిగత సంబోధనను సూచించే హీబ్రూ నుడికారం. ద్వితీయోపదేశకాండం 4:12తో పోల్చండి; అక్కడ ఇశ్రాయేలీయులు స్వరం విన్నారు గాని ఏ రూపాన్నీ చూడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: ముఖాముఖిగా
  rationale: హీబ్రూ నుడికారంలోని రూపకాన్ని, ప్రత్యక్షమైన వ్యక్తిగత సంబోధన అనే భావాన్ని నిలుపుతుంది; దీన్ని కేవలం ‘నేరుగా’ అని సరళీకరించలేదు.
- source_word: דִּבֶּר
  choice: మాట్లాడాడు
  rationale: క్రియ యొక్క సాధారణ అర్థం ‘మాట్లాడు’; עִמָּכֶםతో కలిసి తెలుగులో ‘మీతో ... మాట్లాడాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: עִמָּכֶם
  choice: మీతో
  rationale: עִם అనే సంబంధవాచకం యొక్క ‘తో’ అనే సహజ భావాన్ని, సంభాషణలోని సంబంధాత్మక సాన్నిహిత్యాన్ని ప్రతిబింబిస్తుంది.
- source_word: בָּהָר
  choice: పర్వతం మీద
  rationale: ఇక్కడ ב స్థలాన్ని సూచిస్తుంది; సీనాయి సందర్భంలో ‘పర్వతం మీద’ సహజమైన తెలుగు ప్రయోగం.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యలో నుండి
  rationale: מִתּוֹךְలోని ‘లోపలి మధ్య నుండి’ అనే నిర్దిష్ట భావాన్ని కేవలం ‘అగ్ని నుండి’గా కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘ముఖాముఖిగా’ అనే మానవరూపక వ్యక్తీకరణకు, ఇశ్రాయేలు దేవుని రూపాన్ని చూడలేదనే సీనాయి వర్ణనకు మధ్య ఉన్న ఉద్రిక్తత
  choice: ‘ముఖాముఖిగా’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాన్ని ప్రత్యక్ష వ్యక్తిగత సంబోధనగా పాదటీపులో వివరించడం
  alternative: ‘నేరుగా’ లేదా ‘వ్యక్తిగతంగా’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ద్వితీయోపదేశకాండం 4:12,15 ప్రకారం ప్రజలు స్వరం విన్నారు గాని రూపాన్ని చూడలేదు. అందువల్ల ఇది తప్పనిసరిగా అక్షరార్థ దృశ్యదర్శనమని నిర్ణయించకూడదు; అదే సమయంలో మూలంలోని నుడికారాన్నీ దాని వాక్చాతుర్యాన్నీ తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘పర్వతం మీద అగ్ని మధ్యలో నుండి’ అనే స్థల-మూల నిర్మాణాన్ని తెలుగులో స్పష్టంగా అమర్చింది. ‘ముఖాముఖిగా’ అనే సుపరిచిత నుడికారాన్ని నిలిపింది.
