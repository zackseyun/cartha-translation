revisions:
- from: మీ దేవుడైన యాహ్వే మీకు ఆజ్ఞాపించిన మార్గమంతటిలో మీరు నడుచుకోవాలి. అప్పుడు మీరు జీవిస్తారు, మీకు మేలు కలుగుతుంది, మీరు స్వాధీనం చేసుకోబోయే దేశంలో[a] దీర్ఘకాలం జీవిస్తారు.
