source:
  edition: WLC
  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే మీకు ఆజ్ఞాపించిన మార్గమంతా మీరు నడవాలి. తద్వారా మీరు జీవిస్తారు, మీకు మేలు కలుగుతుంది, మీరు స్వాధీనం చేసుకోబోయే దేశంలో[a] దీర్ఘకాలం జీవిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు వారసత్వంగా పొందబోయే దేశంలో.” హీబ్రూ క్రియకు స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל הַ/דֶּרֶךְ
  choice: మార్గమంతటిలో
  rationale: ఏకవచనంలోని ‘మార్గం’ అనే నిబంధనాత్మక జీవన రూపకాన్ని నిలుపుతూ, כָל యొక్క సంపూర్ణత భావాన్ని ‘అంతటిలో’ వ్యక్తపరుస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: గతంలో ఇచ్చి ఇప్పటికీ వర్తించే ఆజ్ఞను తెలుగులో సహజమైన అసమాపక క్రియా రూపంతో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי/כֶם
  choice: మీ దేవుడైన
  rationale: దైవనామంతో ఉన్న నిబంధనాత్మక సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: תֵּלֵכוּ
  choice: మీరు నడుచుకోవాలి
  rationale: ‘నడవడం’ అనే నైతిక జీవన రూపకాన్ని నిలుపుతూ, ఈ సందర్భంలోని విధ్యర్థక బలాన్ని ‘నడుచుకోవాలి’తో స్పష్టం చేస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఆజ్ఞానుసరణకు అనుసంధానమైన ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది; తరువాత వచ్చే మూడు ఫలితాలకూ వర్తిస్తుంది.
- source_word: תִּחְיוּן
  choice: మీరు జీవిస్తారు
  rationale: జీవించడం అనే మూలార్థాన్ని నేరుగా, సందర్భానుకూలంగా వ్యక్తపరుస్తుంది.
- source_word: וְ/טוֹב לָכֶם
  choice: మీకు మేలు కలుగుతుంది
  rationale: శ్రేయస్సు, క్షేమం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְ/הַאֲרַכְתֶּם יָמִים
  choice: దీర్ఘకాలం జీవిస్తారు
  rationale: ‘రోజులను పొడిగించుకోవడం’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థక వ్యక్తీకరణ.
- source_word: בָּ/אָ֖רֶץ
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండంలోని వాగ్దాన దేశ సందర్భానికి సహజమైన తెలుగు పదం.
- source_word: תִּֽירָשׁוּן
  choice: స్వాధీనం చేసుకోబోయే
  rationale: ירשׁ లోని స్వాధీనపరచుకోవడం/పొందడం భావాన్ని నిలుపుతుంది; ‘వారసత్వంగా పొందడం’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా, ఆధునికంగా ఆమోదయోగ్యమైన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- issue: వాగ్దాన దేశాన్ని పొందడాన్ని సూచించే ירשׁ
  choice: స్వాధీనం చేసుకోబోయే దేశం
  alternative: వారసత్వంగా పొందబోయే దేశం
  rationale: ఇక్కడ భూభాగాన్ని పొంది నివసించడం ప్రధానంగా కనిపిస్తుంది. అయితే క్రియలోని వారసత్వ భావాన్ని తొలగించకుండా పాదటిప్పణిలో పరిరక్షించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మార్గం’ మరియు ‘నడుచుకోవడం’ అనే మూలపాఠ నైతిక రూపకం నిలుపబడింది; ఆజ్ఞాత్మక స్వరం ‘నడుచుకోవాలి’తో వ్యక్తమైంది.
