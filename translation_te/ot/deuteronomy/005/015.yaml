source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: te
  text: నీవు ఐగుప్తు దేశంలో బానిసగా ఉన్నావనీ, నీ దేవుడైన యాహ్వే బలమైన చేతితో[a], చాచిన బాహువుతో నిన్ను అక్కడి నుండి బయటకు తీసుకొచ్చాడనీ జ్ఞాపకం చేసుకో. అందుకే నీ దేవుడైన యాహ్వే సబ్బాతు దినాన్ని ఆచరించమని[b] నీకు ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శక్తిమంతమైన చేతితో’ అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ రూపకం యాహ్వే చేసిన శక్తివంతమైన విమోచన కార్యాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘సబ్బాతు దినాన్ని చేయమని.’ ఈ హీబ్రూ ప్రయోగం ఆ దినాన్ని పాటించడం లేదా ఆచరించడం అనే అర్థం ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: జ్ఞాపకం చేసుకో
  rationale: సందర్భంలో ఇది ఆజ్ఞాత్మక భావాన్ని కలిగిన రూపం. ముందున్న మాటతో సంబంధాన్ని సహజ తెలుగు వాక్య నిర్మాణం ద్వారా నిలిపింది.
- source_word: כִּי
  choice: అనీ
  rationale: గుర్తుంచుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణార్థక ‘అనీ’ సహజంగా సరిపోతుంది.
- source_word: עֶבֶד
  choice: బానిసగా
  rationale: ఐగుప్తులో ఇశ్రాయేలీయుల నిర్బంధ దాస్యస్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: హీబ్రూ పదబంధంలోని ‘దేశం’ అనే నిర్దిష్టతను నిలుపుతూ సహజంగా ఉంది.
- source_word: וַיֹּצִאֲךָ
  choice: నిన్ను ... బయటకు తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపంలోని బయటకు రప్పించడం/విడిపించడం అనే కార్యార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; వచనంలోని రెండు పునరుక్తులనూ నిలుపుతుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: ఐగుప్తును సూచించే స్థానార్థాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בְּיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: దేవుని శక్తివంతమైన విమోచన కార్యాన్ని సూచించే హీబ్రూ రూపకాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: చాచిన బాహువుతో
  rationale: దైవిక శక్తి ప్రత్యక్ష కార్యాన్ని తెలిపే హీబ్రూ రూపకాన్ని గంభీరమైన, అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: దాస్యవిమోచనకు విశ్రాంతి దిన ఆజ్ఞకు మధ్య ఉన్న కారణాత్మక నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: צִוְּךָ
  choice: నీకు ఆజ్ఞాపించాడు
  rationale: సీనాయి ఆజ్ఞను సూచించే పూర్తి గతకాల భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: విశ్రాంతి దినాన్ని ఆచరించమని
  rationale: అక్షరార్థంగా ‘విశ్రాంతి దినాన్ని చేయడం’ అనే హీబ్రూ ప్రయోగం ఇక్కడ దానిని పాటించడం/ఆచరించడం అనే భావం ఇస్తుంది; ‘ఆచరించు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణలో నిలిపింది.
- issue: ఐగుప్తులో עֶבֶד స్థితి
  choice: బానిస
  alternative: సేవకుడు; దాసుడు
  rationale: విశ్రాంతి దిన ఆజ్ఞకు ఆధారంగా చెప్పబడిన నిర్బంధ దాస్యపు తీవ్రతను ‘బానిస’ స్పష్టంగా నిలుపుతుంది.
- issue: לַעֲשׂוֹת అనే ప్రయోగం
  choice: ఆచరించు
  alternative: చేయు; పాటించు
  rationale: ‘చేయు’ అక్షరార్థమైనా తెలుగులో అసహజం; ‘ఆచరించు’ ఆ దినాన్ని విధిగా పాటించడాన్ని తెలియజేస్తూ మూల ప్రయోగ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘బాహువు’ రూపక గాంభీర్యాన్ని నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. మూలంలో ఏకవచన ‘నీవు/నీకు’ ఉన్నందున అదే నిలుపబడింది.
