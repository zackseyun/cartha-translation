translation:
  language: te
  text: మన దేవుడైన యహ్వే హోరేబు వద్ద మనతో ఒడంబడిక చేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “హోరేబు వద్ద మనతో ఒడంబడికను కోశాడు.”
    reason: హీబ్రూలో ఒడంబడిక చేయడాన్ని అక్షరార్థంగా ‘ఒడంబడికను కోయడం’ అనే నుడికారంతో వ్యక్తపరిచారు.
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడైన
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న ‘మన దేవుడు’ అనే భావాన్ని కాపాడుతూ, ‘యహ్వే’తో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘మన దేవుడైన యహ్వే’ అని ఇచ్చాం.
- source_word: כָּרַת
  choice: చేశాడు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘కోశాడు’ అయినప్పటికీ, నిబంధన సందర్భంలో తెలుగులో స్పష్టంగా, సహజంగా ఉండేందుకు ‘నిబంధన చేశాడు’ అని అనువదించాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עִמָּנוּ
  choice: మనతో
  rationale: సంబంధాన్ని సూచించే పూర్వప్రత్యయం మరియు మొదటి పురుష బహువచన ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: దేవుడు ఇశ్రాయేలుతో ఏర్పరచుకున్న గంభీరమైన ఒడంబడిక సంబంధాన్ని తెలుగులో స్థిరంగా వ్యక్తపరిచే పదం.
- source_word: בְּחֹרֵב
  choice: హోరేబులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, హీబ్రూ స్థలార్థక పూర్వప్రత్యయాన్ని సహజమైన తెలుగు విభక్తితో తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దేవుని వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం నిబంధన సందర్భంలోని దైవనామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ‘మనతో’ అనే నిబంధన సంబంధాన్ని అలాగే ఉంచి, హీబ్రూ నుడికారానికి సహజమైన తెలుగు ప్రధాన పాఠం మరియు అక్షరార్థ పాదసూచికను ఇచ్చాం.
