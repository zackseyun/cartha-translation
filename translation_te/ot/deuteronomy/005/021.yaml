revisions:
- from: నీ పొరుగువాని భార్యను ఆశించకూడదు; నీ పొరుగువాని ఇంటిని కోరుకోకూడదు[a]—అతని పొలాన్ని, అతని దాసుణ్ణి, అతని దాసిని, అతని ఎద్దును, అతని గాడిదను, నీ పొరుగువానికి చెందిన దేనినైనా కోరుకోకూడదు.
  to: నీ పొరుగువాని భార్యను కాంక్షించకూడదు[a]; నీ పొరుగువాని ఇంటినిగాని[b], అతని పొలాన్నిగాని, అతని దాసుణ్ణిగాని, అతని దాసినిగాని, అతని ఎద్దునిగాని, అతని గాడిదనిగాని, నీ పొరుగువానికి చెందిన దేనినిగాని కోరుకోకూడదు[c].
  rationale: The revision makes the list syntactically coherent in modern standard Telugu, preserves the two distinct Hebrew prohibition verbs, and supplies separate footnote anchors for the first verb, ‘house,’ and the second verb. It retains all source items and avoids importing theological interpretation.
