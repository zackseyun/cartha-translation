source:
  edition: WLC
  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: te
  text: నీ పొరుగువాని భార్యను కాంక్షించకూడదు[a]; నీ పొరుగువాని ఇంటినిగాని[b], అతని పొలాన్నిగాని, అతని దాసుణ్ణిగాని, అతని దాసినిగాని, అతని ఎద్దునిగాని, అతని గాడిదనిగాని, నీ పొరుగువానికి చెందిన దేనినిగాని కోరుకోకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాంక్షించకూడదు’కు మరో అనువాదం ‘ఆశించకూడదు.’ హీబ్రూ క్రియ ఇక్కడ ఇతరునికి చెందిన దానిపట్ల అనుచితమైన కోరికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇల్లు’ అనే పదానికి ‘ఇంటి సముదాయం’ లేదా ‘ఆస్తి’ అనే విస్తృతార్థం కూడా ఉండవచ్చు; అయితే వెంట వచ్చే ఆస్తుల జాబితా ఇక్కడ ఇల్లు లేదా ఆస్తి అనే భావాన్నే బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘కోరుకోకూడదు’గా అనువదించిన హీబ్రూ క్రియ, ముందున్న ‘కాంక్షించకూడదు’ అనే క్రియకు భిన్నమైనది. రెండూ సమీపార్థకాలే; ఈ పదభేదం నిషేధాన్ని బలపరచవచ్చు లేదా వైవిధ్యంగా పునరుద్ఘాటించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: ఆశించు
  rationale: חמד ఇక్కడ ఇతరునికి చెందినదానిపై అనుచితమైన ఆశను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆశించు’ సహజంగా ఉండి, నిషేధ సందర్భంలో దాని నైతిక బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: నీ పొరుగువాని భార్య
  rationale: హీబ్రూ నిర్మాణబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: תִתְאַוֶּה
  choice: కోరుకో
  rationale: אוה అనే రెండవ క్రియను మొదటి חמד నుండి వేరుగా చూపడానికి ‘కోరుకో’ అని అనువదించాం; రెండూ సమీపార్థకాలైనా మూలంలోని పదభేదం నిలుస్తుంది.
- source_word: בֵּית רֵעֶךָ
  choice: నీ పొరుగువాని ఇల్లు
  rationale: בַּיִת‌కు ‘ఇల్లు’ లేదా ‘ఇంటి ఆస్తి/కుటుంబం’ అనే విస్తృతార్థాలు ఉండవచ్చు. వెంట వచ్చే ఆస్తుల జాబితా కారణంగా ఇక్కడ ‘ఇల్లు’ ప్రధాన ఎంపిక.
- source_word: שָׂדֵהוּ
  choice: అతని పొలం
  rationale: שָׂדֶהకు సహజమైన నిర్దిష్ట సమానార్థం ‘పొలం’; ద్వితీయోపదేశకాండంలోని ఈ ప్రత్యేక అంశాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַבְדּוֹ
  choice: అతని దాసుడు
  rationale: ఇంటి ఆస్తుల సందర్భంలో עֶבֶד యొక్క బంధిత స్థితిని ‘దాసుడు’ స్పష్టంగా తెలియజేస్తుంది; తరువాతి స్త్రీలింగ పదంతో ఉన్న భేదమూ నిలుస్తుంది.
- source_word: אֲמָתוֹ
  choice: అతని దాసి
  rationale: אָמָהను ‘దాసి’గా ఇవ్వడం బంధిత స్థితినీ, హీబ్రూలోని స్త్రీలింగ భేదాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: שׁוֹרוֹ
  choice: అతని ఎద్దు
  rationale: שׁוֹר‌కు వ్యవసాయ, న్యాయ సందర్భంలో ‘ఎద్దు’ సహజమైన నిర్దిష్ట పదం.
- source_word: חֲמֹרוֹ
  choice: అతని గాడిద
  rationale: חֲמוֹר‌కు ఆధునిక తెలుగులో స్పష్టమైన సాధారణ సమానార్థం ‘గాడిద’.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: నీ పొరుగువానికి చెందిన దేనినైనా
  rationale: హీబ్రూ సమగ్ర ముగింపును సహజ తెలుగులో అందిస్తూ, యాజమాన్య భావాన్ని స్పష్టం చేస్తుంది.
- source_word: רֵעֶךָ
  choice: నీ పొరుగువాడు
  rationale: רֵעַ ఇక్కడ పరస్పర నైతిక సంబంధంలోని తోటి వ్యక్తిని సూచిస్తుంది; ‘పొరుగువాడు’ స్థిరమైన, అర్థవంతమైన తెలుగు సమానార్థం.
theological_decisions:
- issue: ఆజ్ఞలోని రెండు నిషేధక క్రియల మధ్య భేదం
  choice: חמדను ‘ఆశించు’, אוהను ‘కోరుకో’గా వేరు చేయడం
  alternative: రెండింటినీ ‘ఆశించు’గా లేదా రెండింటినీ ‘కోరుకో’గా అనువదించడం
  rationale: హీబ్రూ రెండు సమీపార్థకమైనా వేర్వేరు క్రియలను ఉపయోగిస్తుంది. తెలుగు పదభేదం మూలంలోని వాక్చాతుర్యాన్ని కాపాడుతుంది; వాటి మధ్య అతిగా సిద్ధాంతపరమైన తేడాను మాత్రం రుద్దదు.
- issue: దాస్య స్థితిని సూచించే పదాల అనువాదం
  choice: ‘దాసుడు’, ‘దాసి’ అని స్పష్టంగా ఇవ్వడం
  alternative: ‘సేవకుడు’, ‘సేవకురాలు’ అని ఇవ్వడం
  rationale: ఇంటి ఆస్తుల జాబితా సందర్భంలో బంధిత సామాజిక స్థితి ప్రాధాన్యంగా ఉంది. ‘దాసుడు/దాసి’ మూలార్థాన్ని మృదువుగా మార్చకుండా, లింగ భేదాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞాత్మక గంభీరతను కాపాడుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘ఆశించు/కోరుకో’ అనే భేదం మూలంలోని రెండు క్రియలను ప్రతిబింబిస్తుంది. ‘దాసుడు/దాసి’ చారిత్రక బంధిత స్థితిని దాచదు.
