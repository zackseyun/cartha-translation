  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קְרַ֤ב אַתָּה֙ וּֽ/שֲׁמָ֔ע אֵ֛ת כָּל אֲשֶׁ֥ר יֹאמַ֖ר יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַ֣תְּ תְּדַבֵּ֣ר אֵלֵ֗י/נוּ אֵת֩ כָּל אֲשֶׁ֨ר יְדַבֵּ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ אֵלֶ֖י/ךָ וְ/שָׁמַ֥עְנוּ וְ/עָשִֽׂינוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: te
  text: నీవే దగ్గరకు వెళ్లి, మన దేవుడైన యెహోవా చెప్పేదంతా విను. మన దేవుడైన యెహోవా నీతో చెప్పేదంతా మాతో చెప్పు; మేము విని చేస్తాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: నువ్వే దగ్గరకు వెళ్లి
  rationale: క్రియ యొక్క సమీపించడం అనే భావాన్నీ, ప్రత్యేకంగా మోషేనే వెళ్లాలనే స్వతంత్ర సర్వనామపు ఉద్ఘాటననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּשֲמָע
  choice: విను
  rationale: సందర్భంలో ఇది దేవుడు పలికేదాన్ని ప్రత్యక్షంగా వినడాన్ని సూచిస్తుంది; సాధారణ ఆజ్ఞారూపం తగినది.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించి, אֱלֹהֵינוּ యొక్క సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: మాకు తెలియజేయి
  rationale: అక్షరార్థంగా 'మాతో మాట్లాడు' అయినా, మధ్యవర్తిగా విన్న సంగతులను ప్రజలకు చేరవేయడం ఇక్కడి సందర్భార్థం; సహజ తెలుగులో 'తెలియజేయి' స్పష్టంగా ఉంటుంది.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: మేము విని, దాని ప్రకారం చేస్తాం
  rationale: హీబ్రూ పదజోడును నిలుపుతూ, తెలుగులో 'చేస్తాం' అనే క్రియకు అవసరమైన సూచనను 'దాని ప్రకారం' అందిస్తుంది; వినడం ఇక్కడ విధేయతకు దారితీస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని పాఠ్యంలో స్పష్టంగా నిలుపుతుంది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ జోడించదు.
- issue: וְשָׁמַעְנוּ וְעָשִׂינוּలో విధేయత భావం
  choice: మేము విని, దాని ప్రకారం చేస్తాం
  alternative: మేము విని ఆచరిస్తాం
  rationale: మూలంలోని రెండు వేర్వేరు క్రియలను కనిపించేలా ఉంచి, వినడం మరియు చేయడం మధ్య ఉన్న ఒడంబడిక సంబంధాన్ని అతిగా వివరణ చేయకుండా తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. ఏకవచన సంబోధనలోని ఉద్ఘాటనను 'నువ్వే' ద్వారా నిలుపుతూ, అనవసరమైన ప్రాచీన లేదా మతపరమైన పదజాలాన్ని నివారించాం.
