id: DEU.5.23
reference: Deuteronomy 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/שָׁמְעֲ/כֶ֤ם אֶת הַ/קּוֹל֙ מִ/תּ֣וֹךְ הַ/חֹ֔שֶׁךְ וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וַ/תִּקְרְב֣וּ/ן אֵלַ֔/י כָּל רָאשֵׁ֥י שִׁבְטֵי/כֶ֖ם וְ/זִקְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: te
  text: మీరు చీకటి మధ్యలోనుండి స్వరాన్ని[a] విన్నప్పుడు, పర్వతం అగ్నితో మండుతూ ఉండగా, మీ గోత్రాల అధిపతులందరూ, మీ పెద్దలూ నా దగ్గరికి వచ్చారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శబ్దాన్ని.’ హీబ్రూ పదం కోల్ ఈ రెండు అర్థాలనూ ఇవ్వగలదు; అయితే ఇక్కడ దేవుడు చీకటి మధ్యలోనుండి మాట్లాడుతున్న సందర్భానికి ‘స్వరం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: మీరు ... విన్నప్పుడు
  rationale: హీబ్రూ కథనంలోని కాలసంబంధ మార్పును తెలుగులో సహజంగా ‘విన్నప్పుడు’ తెలియజేస్తుంది; ‘అప్పుడు జరిగింది’ అనే కృత్రిమ పదప్రయోగం అవసరం లేదు.
- source_word: הַקּוֹל
  choice: స్వరాన్ని
  rationale: קוֹל అనే పదానికి ‘స్వరం’ లేదా ‘శబ్దం’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ దేవుడు మాట్లాడుతున్న సందర్భం కావడంతో ‘స్వరం’ ప్రధాన పాఠంలో తగినది; నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: చీకటి మధ్యలోనుంచి
  rationale: תּוֹךְ లోని ‘మధ్య/నడుమ’ భావాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: పర్వతం అగ్నితో మండుతూ ఉండగా
  rationale: వావ్‌ను సందర్భసూచకంగా గ్రహించి, ప్రధాన చర్య జరుగుతున్న సమయంలో కొనసాగుతున్న నేపథ్య దృశ్యాన్ని ‘ఉండగా’తో తెలిపింది; participle యొక్క కొనసాగుతున్న భావం నిలిచింది.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: నా దగ్గరికి వచ్చారు
  rationale: קרב యొక్క ‘సమీపించడం’ భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: మీ గోత్రాల అధిపతులందరూ
  rationale: רָאשֵׁי యొక్క నాయకత్వార్థాన్ని స్పష్టంగా తెలియజేస్తూ, ‘తలలు’ అనే తెలుగులో అసహజమైన అక్షరార్థాన్ని నివారిస్తుంది.
- source_word: וְזִקְנֵיכֶם
  choice: మీ పెద్దలూ
  rationale: ఇక్కడ זְקֵנִים కేవలం వృద్ధులను కాక, సమాజంలో గుర్తింపు పొందిన పెద్దలను సూచిస్తుంది; ‘పెద్దలు’ తెలుగులో ఆ సంస్థాగత భావాన్ని సహజంగా మోస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది; [a] సూచిక ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంది.
