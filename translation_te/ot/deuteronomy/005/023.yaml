- from: మీరు చీకటి మధ్యలోనుంచి వచ్చిన స్వరాన్ని[a] విన్నప్పుడు, పర్వతం అగ్నితో మండుతూ ఉండగా, మీ గోత్రాల అధిపతులందరూ, మీ పెద్దలూ నా దగ్గరికి వచ్చారు—
  to: మీరు చీకటి మధ్యలోనుండి స్వరాన్ని[a] విన్నప్పుడు, పర్వతం అగ్నితో మండుతూ ఉండగా, మీ గోత్రాల అధిపతులందరూ, మీ పెద్దలూ నా దగ్గరికి వచ్చారు—
