translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిషేధాజ్ఞ రూపం వాడబడింది. హీబ్రూ వాక్యారంభంలోని సంధాయక וְ ను ప్రత్యేకంగా ‘మరియు’గా అనువదించలేదు; దశాజ్ఞల వరుసను సందర్భమే స్పష్టం చేస్తుంది.
