lexical_decisions:
- source_word: וְ/לֹא
  choice: చేయకూడదు
  rationale: וְ ఈ ఆజ్ఞను ముందున్న ఆజ్ఞల వరుసతో కలుపుతుంది; అయితే ఆధునిక ప్రామాణిక తెలుగులో ప్రతి సంక్షిప్త ఆజ్ఞకు ‘మరియు’ చేర్చడం అసహజంగా ఉంటుంది. לֹא తో కూడిన క్రియలోని నిషేధార్థాన్ని ‘చేయకూడదు’ సహజంగా, ఆజ్ఞాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: תִּגְנֹב
  choice: దొంగతనం చేయ
  rationale: Qal imperfect రెండవ పురుష ఏకవచన రూపం ఇక్కడ నిషేధాజ్ఞగా పనిచేస్తుంది. కర్మను పేర్కొనని సాధారణ ఆజ్ఞ కాబట్టి, వ్యక్తిని అపహరించడం అనే సాధ్యమైన సందర్భార్థానికి పరిమితం చేయకుండా విస్తృతమైన ‘దొంగతనం చేయడం’ను ఎంచుకున్నాం.
