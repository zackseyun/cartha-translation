  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּאמְר֗וּ הֵ֣ן הֶרְאָ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אֶת כְּבֹד֣/וֹ וְ/אֶת גָּדְל֔/וֹ וְ/אֶת קֹל֥/וֹ שָׁמַ֖עְנוּ מִ/תּ֣וֹךְ הָ/אֵ֑שׁ הַ/יּ֤וֹם הַ/זֶּה֙ רָאִ֔ינוּ כִּֽי יְדַבֵּ֧ר אֱלֹהִ֛ים אֶת הָֽ/אָדָ֖ם וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: te
  text: 'మీరు ఇలా అన్నారు: “ఇదిగో, మన దేవుడైన యెహోవా తన మహిమను, తన గొప్పతనాన్ని మనకు చూపించాడు. అగ్ని మధ్యలోనుంచి ఆయన స్వరాన్ని మనం విన్నాం. ఈ రోజున దేవుడు మనిషితో మాట్లాడినప్పటికీ, మనిషి బ్రతికే ఉంటాడని మనం చూశాం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ ఉద్గారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా ప్రతిబింబిస్తుంది.
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: తన మహిమను, తన గొప్పతనాన్ని
  rationale: మూలంలోని రెండు వేర్వేరు నామవాచకాలను నిలుపుతుంది.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: అగ్ని మధ్యలోనుంచి
  rationale: మూలంలోని స్థలసూచక భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֶת־הָאָדָם
  choice: మనిషితో
  rationale: ఇక్కడ సామాన్య మానవుడిని సూచించే ఏకవచన సమూహార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וָחָי
  choice: మనిషి సజీవంగా ఉండగలడని
  rationale: దేవుడు మాట్లాడిన తరువాత కూడా మానవుడు బతికి ఉండడమే ఆశ్చర్యకరమైన అంశమని సందర్భానుసారంగా స్పష్టం చేస్తుంది; హీబ్రూ సంపూర్ణక్రియకు ఇక్కడ ఫలిత/సంభావ్యత భావం ఉంది.
theological_decisions:
- issue: దేవుడు మనిషితో మాట్లాడటం మరియు మనిషి జీవించి ఉండటం మధ్య సంబంధం
  choice: దేవుడు మనిషితో మాట్లాడినా మనిషి సజీవంగా ఉండగలడు
  alternative: దేవుడు మనిషితో మాట్లాడుతాడు, అతడు జీవిస్తాడు
  rationale: כִּי...וָחָי నిర్మాణం ఈ సంఘటన ద్వారా తెలిసిన సాధ్యతను లేదా ఆశ్చర్యకరమైన ఫలితాన్ని తెలియజేస్తుంది. ఇది దేవుని మాట ఎల్లప్పుడూ ప్రాణాంతకం కాదనే సందర్భార్థాన్ని ఇస్తుంది; అనవసర సిద్ధాంత వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక ప్రసంగానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ప్రత్యక్ష ఉక్తి మరియు మూలంలోని భావ క్రమం నిలుపబడ్డాయి.
