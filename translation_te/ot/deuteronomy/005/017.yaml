translation:
  language: te
  text: నీవు హత్య చేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, ‘నీవు చంపకూడదు.’ ఇక్కడి హీబ్రూ క్రియ మరింత నిర్దిష్టంగా హత్యను లేదా చట్టవిరుద్ధంగా ప్రాణం తీయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: చేయకూడదు
  rationale: హీబ్రూ నిషేధార్థక అవ్యయం לֹא, అసంపూర్ణ క్రియారూపంతో కలిసి స్థిరమైన నైతిక నిషేధాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘చేయకూడదు’ సహజంగా, స్పష్టంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: תִּרְצָח
  choice: హత్య చేయు
  rationale: רָצַח అనే క్రియ సాధారణంగా చంపడమనే విస్తృత భావం కంటే హత్య లేదా చట్టవిరుద్ధంగా ప్రాణం తీయడాన్ని సూచిస్తుంది. ‘హత్య చేయు’ మూలపదంలోని నైతిక-న్యాయపరమైన నిర్దిష్టతను కాపాడుతుంది.
theological_decisions:
- issue: ఆరవ ఆజ్ఞలోని నిషేధ పరిధి
  choice: ‘నీవు హత్య చేయకూడదు’—హత్యను లేదా చట్టవిరుద్ధంగా ప్రాణం తీయడాన్ని నిషేధించే ఆజ్ఞ.
  alternative: ‘నీవు చంపకూడదు.’
  rationale: మూలంలోని רָצַח, చంపడాన్ని సూచించే అన్ని హీబ్రూ క్రియలలో అత్యంత విస్తృతమైనది కాదు. అందువల్ల ‘హత్య’ అనే పదం మూలంలోని నిర్దిష్టతను మెరుగ్గా ప్రతిబింబిస్తూ, పంచగ్రంథంలోని వివిధ రకాల ప్రాణహరణాల మధ్య ఉన్న భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన ఆజ్ఞారూపం. ‘నీవు’ ద్వారా ఏకవచన సంబోధనను నిలిపి, ‘హత్య చేయకూడదు’ ద్వారా సహజమైనదీ గౌరవప్రదమైనదీ అయిన నిషేధ వాక్యాన్ని ఉపయోగించాం.
