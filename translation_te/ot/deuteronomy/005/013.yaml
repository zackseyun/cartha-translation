source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: te
  text: ఆరు రోజులు నీవు శ్రమించాలి, నీ పని అంతా చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరు రోజులు నీవు శ్రమించవచ్చు, నీ పని అంతా చేయవచ్చు.” ఈ ధర్మశాసన సందర్భంలో హెబ్రీ అసంపూర్ణ క్రియారూపాలను నిర్దేశాత్మకంగానూ అనుమతిసూచకంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులు
  rationale: నిర్దిష్ట ఉపసర్గను చేర్చకుండా, హెబ్రీ కాలవ్యవధి పదబంధాన్ని సహజమైన తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: תַּעֲבֹד
  choice: నీవు శ్రమపడి
  rationale: עבד ఇక్కడ సాధారణ శ్రమను సూచిస్తుంది. తరువాతి עשהతో ఉన్న భేదాన్ని నిలుపుతూ, తెలుగు వాక్యంలో సహజంగా అనుసంధానిస్తుంది.
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: עשה యొక్క విస్తృతమైన ‘చేయు’ భావాన్ని నిలుపుతూ, ధర్మశాసన సందర్భంలోని నిర్దేశాత్మక బలాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: పనుల సంపూర్ణతను సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: מְלַאכְתֶּךָ
  choice: నీ పనులు
  rationale: మְלָאכָה ఇక్కడ వ్యక్తికి సంబంధించిన పని లేదా కార్యాలను సూచిస్తుంది; బహువచన ప్రయోగం ‘అన్నిటినీ’తో కలిసి తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: విశ్రాంతిదిన ఆజ్ఞ సందర్భంలో క్రియల నిర్దేశాత్మక లేదా అనుమతిసూచక భావం
  choice: ‘శ్రమపడి ... చేయాలి’ అని నిర్దేశాత్మకంగా అనువదించడం
  alternative: ‘శ్రమపడి ... చేయవచ్చు’
  rationale: నిబంధనాత్మక ఆజ్ఞల సందర్భం నిర్దేశాత్మక భావానికి మద్దతిస్తుంది. అయితే హెబ్రీ అసంపూర్ణ క్రియారూపాన్ని ఈ సందర్భంలో అనుమతిగా కూడా గ్రహించగల నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ధర్మశాసన శైలిని ఉపయోగించాం. ‘నీవు’ అనే ఏకవచన సంబోధనను మూలంలోని రెండవ పురుష ఏకవచనానికి అనుగుణంగా నిలిపాం.
