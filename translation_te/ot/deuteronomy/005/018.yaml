translation:
  language: te
  text: మరియు నీవు వ్యభిచారం చేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సంక్షిప్తంగా: ‘నీవు వ్యభిచారం చేయకూడదు.’ ఈ ఆజ్ఞను చుట్టుపక్కల ఆజ్ఞలతో కలిపే అనుసంధాన పదం (‘మరియు’) హీబ్రూ పాఠంలో ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: మరియు ... చేయకూడదు
  rationale: וְ అనే సంధాయకం ఈ ఆజ్ఞను ముందున్న ఆజ్ఞల వరుసతో కలుపుతుంది కాబట్టి ‘మరియు’ నిలుపబడింది. לֹא ఇక్కడ నిషేధార్థక ఆజ్ఞను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘చేయకూడదు’ ఆ భావాన్ని సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: תִּנְאָף
  choice: నీవు వ్యభిచారం చేయకూడదు
  rationale: נאף క్రియ యొక్క కల్ అసంపూర్ణ రూపం, ద్వితీయ పురుష ఏకవచనంలో, దశాజ్ఞల సందర్భంలో నిషేధంగా పనిచేస్తుంది. దాని లైంగిక-వివాహ నిబంధన ఉల్లంఘన భావానికి ‘వ్యభిచారం చేయు’ ఖచ్చితమైన, సాధారణంగా అర్థమయ్యే తెలుగు సమానార్థకం.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలోని ద్వితీయ పురుష ఏకవచన నిషేధాన్ని వ్యక్తపరచడం
  choice: మరియు నీవు వ్యభిచారం చేయకూడదు.
  alternative: నీవు వ్యభిచారం చేయకూడదు.; వ్యభిచారం చేయవద్దు.
  rationale: ‘నీవు ... చేయకూడదు’ అనే రూపం ఇశ్రాయేలు నిబంధన సభ్యునికి ప్రతినిధి ఏకవచనంలో ఇచ్చిన ప్రత్యక్ష సంబోధనను, ఆజ్ఞ యొక్క గంభీర న్యాయబలాన్ని నిలుపుతుంది. ‘మరియు’ మూల హీబ్రూలోని అనుసంధానాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదీ, గంభీరమైనదీ అయిన ఆజ్ఞారూపం వాడబడింది. మూలంలోని ఏకవచన ప్రత్యక్ష సంబోధనను ‘నీవు’తోను, ఆజ్ఞల వరుసను కలిపే וְ ను ‘మరియు’తోను నిలుపుకుంది.
