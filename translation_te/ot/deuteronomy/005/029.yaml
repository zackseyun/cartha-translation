source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: te
  text: వారు నాపట్ల భయభక్తులు కలిగి, నా ఆజ్ఞలన్నిటినీ తమ జీవితకాలమంతా పాటించడానికి వారికి ఇలాంటి హృదయం ఉంటే ఎంత బాగుండేది![a] అప్పుడు వారికీ వారి పిల్లలకూ ఎప్పటికీ మేలు కలగడానికి!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి ఇలాంటి హృదయం ఉంటే చాలు!” హీబ్రూ ప్రారంభ నుడికారానికి అక్షరార్థం “ఎవరు ఇస్తారు...?”; అది ఇక్కడ బలమైన కోరికను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: ఉంటే ఎంత బాగుండేది!
  rationale: ఇది అక్షరార్థంగా ‘ఎవరు ఇస్తారు?’ అనే ప్రశ్న కాదు; బలమైన కోరికను వ్యక్తం చేసే హీబ్రూ నుడికారం. సహజమైన ఆధునిక తెలుగులో ఆ ఆకాంక్షను ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: వారిలో ఎల్లప్పుడూ ఇలాంటి హృదయం ఉంటే
  rationale: ‘ఇలాంటి హృదయం’ అనే పదబంధం ప్రజలు అప్పుడే చూపిన లేదా దేవుడు కోరిన అంతరంగ వైఖరిని సూచిస్తుంది. ‘వారిలో’ అనేది హీబ్రూ దత్తివాచక స్వామ్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְבָבָם
  choice: హృదయం
  rationale: ఇక్కడ హృదయం కేవలం భావోద్వేగాన్ని కాదు, ఆలోచన, సంకల్పం, నైతిక-ఆధ్యాత్మిక వైఖరిని సూచిస్తుంది; మూలంలోని బైబిలీయ మానవశాస్త్ర పదచిత్రాన్ని నిలుపుతుంది.
- source_word: לְיִרְאָה אֹתִי
  choice: నాపట్ల భయభక్తులు కలిగి
  rationale: దేవునికి సంబంధించిన ירא భయం, భక్తి, గౌరవపూర్వక విధేయతలను కలిపి సూచిస్తుంది. తెలుగు బైబిలీయ వాడుకలో ‘భయభక్తులు’ ఈ ఒడంబడిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: నా ఆజ్ఞలన్నిటినీ ... పాటించేలా
  rationale: ఆజ్ఞల సందర్భంలో שׁמר వాటిని కాపాడటం అనే అక్షరార్థం కన్నా విధేయంగా ఆచరించడం లేదా పాటించడం అనే భావాన్ని ఇస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: తమ జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’; సందర్భంలో వారి జీవితమంతటినీ సూచిస్తుంది. తెలుగు పాఠకులకు కాలవ్యాప్తి స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: అప్పుడు వారికి ... మేలు కలుగుతుంది
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది; ייטב శ్రేయస్సును సూచిస్తుంది కాని కేవలం భౌతిక సంపదను నిర్దిష్టం చేయదు.
- source_word: וְלִבְנֵיהֶם
  choice: వారి పిల్లలకూ
  rationale: בנים రూపపరంగా ‘కుమారులు’ అయినప్పటికీ ఈ ఒడంబడిక సందర్భంలో సంతానాన్ని సాధారణంగా సూచిస్తుంది; ‘పిల్లలు’ ఆ ప్రతినిధి భావాన్ని సరిగ్గా అందిస్తుంది.
- source_word: לְעֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలికమైన, తరతరాలకు కొనసాగే మేలును సూచించే మూలపదానికి సాధారణమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: לְבָבָם లోని మానవ అంతరంగ భాష
  choice: హృదయం
  alternative: మనస్సు / అంతరంగ స్వభావం
  rationale: వాక్యం దేవుని ఎదుట ప్రజల ఆలోచన, సంకల్పం, నైతిక-ఆధ్యాత్మిక వైఖరిని సమగ్రంగా సూచిస్తుంది. ‘హృదయం’ మూలంలోని విస్తృత బైబిలీయ భావాన్ని నిలుపుతుంది.
- issue: לְיִרְאָה אֹתִי లో దేవుని పట్ల భయం
  choice: నాపట్ల భయభక్తులు కలిగి
  alternative: నాకు భయపడి / నన్ను గౌరవించి
  rationale: కేవలం భీతిని లేదా కేవలం గౌరవాన్ని ఎంచుకోకుండా, మూలంలోని భయం మరియు భక్తిపూర్వక విధేయత మధ్య ఉన్న భావసాంద్రతను కాపాడుతుంది.
- issue: וְלִבְנֵיהֶם యొక్క లింగ-వ్యాప్తి
  choice: వారి పిల్లలు
  alternative: వారి కుమారులు
  rationale: వ్యాకరణపరంగా పుంలింగ బహువచనమైనా, ఇక్కడ ఒడంబడిక మేలు వారి సంతానానికి వర్తిస్తుందని సందర్భం సూచిస్తుంది.
- issue: దైవీయ ఆకాంక్ష మరియు మానవ విధేయత మధ్య ఉద్వేగం
  choice: కోరికను నేరుగా నిలుపుతూ కారణాన్ని వివరించకుండా ఉంచడం
  alternative: దేవుడు వారి హృదయాన్ని మార్చాలని స్పష్టంగా జోడించడం
  rationale: మూలం బలమైన ఆకాంక్షను వ్యక్తం చేస్తుంది గాని హృదయ మార్పు ఎలా సంభవిస్తుందో ఈ వాక్యంలో వివరణ ఇవ్వదు. అందువల్ల ఆ వేదాంత ఉద్వేగాన్ని పరిష్కరించే అదనపు భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజ వాక్యనిర్మాణంతో పాటు ‘హృదయం,’ ‘ఆజ్ఞలు,’ ‘భయభక్తులు’ వంటి గౌరవప్రదమైన బైబిలీయ పదజాలాన్ని నిలిపింది. మూలంలోని కోరికను తెలుగు వాక్యాంతంలో సహజంగా ఉంచింది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
