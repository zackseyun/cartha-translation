  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: te
  text: దానిని తినకూడదు[a]; దానిని నీళ్లలా నేలమీద కుమ్మరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, చుట్టుపక్కల వచనాల్లో పేర్కొన్న జంతువు రక్తాన్ని.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: దానిని తినకూడదు
  rationale: אכל క్రియ యొక్క రెండవ పురుష ఏకవచన రూపం, మూడవ పురుష పుంలింగ ఏకవచన కర్మప్రత్యయంతో ఉంది. ధర్మశాస్త్ర సందర్భంలోని నిషేధాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ‘దానిని’ అనే సర్వనామ సూచనను నిలుపుతుంది.
- source_word: עַל הָאָרֶץ
  choice: నేల మీద
  rationale: ఈ ఆచార సంబంధమైన స్పష్ట సందర్భంలో אֶרֶץ భూమి ఉపరితలాన్ని సూచిస్తుంది; అందువల్ల ‘నేల మీద’ సహజమైన తెలుగు ప్రయోగం.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: దానిని ... కుమ్మరించాలి
  rationale: שׁפך ఇక్కడ రక్తాన్ని నేలపై పారబోసే నిర్దేశిత చర్యను సూచిస్తుంది. ‘కుమ్మరించాలి’ ద్రవాన్ని పోసివేయడాన్ని సహజంగా తెలియజేస్తుంది; కర్మప్రత్యయాన్ని ‘దానిని’గా నిలుపుతుంది.
- source_word: כַּמָּיִם
  choice: నీళ్లను కుమ్మరించినట్లు
  rationale: כְּ ఉపసర్గంలోని పోలికను నిలుపుతూ, తెలుగులో అసంపూర్ణంగా వినిపించే ‘నీళ్లలా’ కంటే చర్యకు అనుసంధానమైన సహజమైన ఉపమానంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సర్వనామ ప్రత్యయాల నిర్దేశ్యం
  choice: ముందటి సందర్భంలో పేర్కొన్న రక్తాన్నే ‘దానిని’ సూచిస్తున్నట్లు ప్రధాన వాక్యంలో సర్వనామాన్ని నిలిపి, పాదసూచికలో స్పష్టం చేయడం.
  alternative: స్పష్టత కోసం ప్రధాన వాక్యంలోనే ‘రక్తాన్ని’ అని చేర్చడం.
  rationale: హీబ్రూ వాక్యం నామవాచకాన్ని మళ్లీ చెప్పకుండా కర్మప్రత్యయాలను వాడుతుంది. ‘దానిని’ అని అనువదించడం మూల నిర్మాణాన్ని, సందర్భాధారిత సూచనను కాపాడుతుంది; పాదసూచిక పాఠకునికి అవసరమైన సందర్భాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ఏకవచన ‘నీవు’ను పదేపదే ఉంచకుండా తెలుగు విధ్యర్థక రూపాలైన ‘తినకూడదు’, ‘కుమ్మరించాలి’ వాడబడ్డాయి. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత సర్వనామం వెంట ఉంచబడింది.
