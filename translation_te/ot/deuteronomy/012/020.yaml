  to: నీ దేవుడైన యెహోవా నీతో చెప్పినట్లుగా నీ భూభాగాన్ని విస్తరించినప్పుడు, “నేను మాంసం తింటాను” అని నీవు చెప్పి, మాంసం తినాలని నీకు కోరిక కలిగినందున, నీ కోరిక మేరకు మాంసం తినవచ్చు.
