id: DEU.12.20
reference: Deuteronomy 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יַרְחִיב֩ יְהוָ֨ה אֱלֹהֶ֥י/ךָ אֶֽת גְּבֽוּלְ/ךָ֮ כַּ/אֲשֶׁ֣ר דִּבֶּר לָ/ךְ֒ וְ/אָמַרְתָּ֙ אֹכְלָ֣ה בָשָׂ֔ר כִּֽי תְאַוֶּ֥ה נַפְשְׁ/ךָ֖ לֶ/אֱכֹ֣ל בָּשָׂ֑ר בְּ/כָל אַוַּ֥ת נַפְשְׁ/ךָ֖ תֹּאכַ֥ל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా నీతో చెప్పినట్లుగా నీ భూభాగాన్ని విస్తరించినప్పుడు, “నేను మాంసం తింటాను” అని నీవు చెప్పి, మాంసం తినాలని నీకు కోరిక కలిగినందున, నీ కోరిక మేరకు మాంసం తినవచ్చు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: నీ సరిహద్దును విస్తరించినప్పుడు
  rationale: హిబ్రూ పదబంధం భూభాగపు హద్దును విస్తరించడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా, స్పష్టంగా ఈ రూపం నిలుస్తుంది.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: “నేను మాంసం తింటాను” అని నీవు అనుకుంటే
  rationale: 'అక్షరార్థంగా ‘నీవు చెప్పి: నేను మాంసం తింటాను’; సందర్భంలో ఇది వ్యక్తి అంతరంగ ఉద్దేశాన్ని వ్యక్తపరుస్తుంది. ‘అనుకుంటే’ ఆధునిక తెలుగులో సహజంగా ఉంది.'
- source_word: כִּי־תְאַוֶּה נַפְשְׁךָ
  choice: మాంసం తినాలని నీకు కోరిక కలిగి
  rationale: נפשׁ ఇక్కడ మొత్తం వ్యక్తి లేదా ఆకాంక్షను సూచిస్తుంది; కృత్రిమమైన ‘నీ ఆత్మ కోరుతుంది’ బదులు సహజ తెలుగు వాడబడింది.
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: నీ మనసారా
  rationale: ‘నీ ప్రాణం కోరినంతగా’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; అనుమతి విస్తృతతను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యక్షంగా నిలిపింది.
- issue: మాంసం తినడంపై వాక్యపు స్వరూపం
  choice: తినవచ్చు
  alternative: తినాలి / తింటావు
  rationale: చివరి అసంపూర్ణ క్రియ సందర్భంలో అనుమతిని సూచిస్తుంది; ఇది ఆజ్ఞగా లేదా కేవలం భవిష్యద్వాణిగా మార్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ఏకవచన సంబోధనను, ద్వితీయోపదేశకాండపు నేరుగా ఉద్దేశించే శైలిని నిలిపింది. మూలంలోని ‘నెఫెష్’ పునరుక్తిని తెలుగులో సహజత కోసం ‘నీకు కోరిక కలిగి / నీ మనసారా’గా వ్యక్తీకరించింది.
