id: DEU.12.31
reference: Deuteronomy 12:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేను ఆ విధంగా ఆరాధించకూడదు. ఎందుకంటే, యాహ్వే ద్వేషించే ప్రతి అసహ్యమైన కార్యాన్నీ వారు తమ దేవుళ్ల కోసం చేశారు; తమ కుమారులనూ కుమార్తెలనూ సైతం తమ దేవుళ్ల కోసం అగ్నిలో కాల్చివేస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాను ఆ విధంగా ఆరాధించకూడదు
  rationale: పదశః ‘నీ దేవుడైన యెహోవాకు అలా చేయకూడదు.’ ముందున్న సందర్భం ఆరాధనా విధానాన్ని గురించి ఉన్నందున, తెలుగులో సహజంగా అర్థమయ్యేలా ‘ఆరాధించకూడదు’ అని వ్యక్తపరిచాం; ఏకవచన నిబంధనా సంబోధనను నిలిపాం.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: యెహోవా అసహ్యించుకునే ప్రతి హేయమైన పనినీ
  rationale: తּוֹעֵבָה యొక్క బలమైన నైతిక-ఆరాధనా తీవ్రతను ‘హేయమైన పని’ తెలియజేస్తుంది. నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా సంబంధవాచక వాక్యంగా ఇచ్చాం; אֲשֶׁר שָׂנֵא లోని దేవుని వ్యక్తిగత నిరాకరణను ‘అసహ్యించుకునే’గా నిలిపాం.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: వారు తమ దేవుళ్ల కోసం చేశారు
  rationale: לְ ఇక్కడ ఆ దేవతల గౌరవార్థం లేదా ఆరాధనలో చేసిన కార్యాల దిశను సూచిస్తుంది; ‘కోసం’ ఈ ఆరాధనా సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי גַם
  choice: సైతం
  rationale: గַם తరువాతి భయానక ఉదాహరణను తీవ్రంగా ముందుకు తెస్తుంది. ‘సైతం’ ఆ ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: తమ కుమారులను, కుమార్తెలను
  rationale: మూలం మగ, ఆడ పిల్లలను విడిగా పేర్కొంటుంది; సాధారణ ‘పిల్లలు’గా కుదించకుండా ఆ ప్రత్యేకతను నిలిపాం.
- source_word: יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם
  choice: తమ దేవుళ్ల కోసం అగ్నిలో కాల్చివేస్తారు
  rationale: అగ్నిలో నిజంగా కాల్చే బలి ఆచారాన్ని స్పష్టంగా తెలియజేస్తుంది. అసంపూర్ణ క్రియారూపం ఇక్కడ వారి ఆచారాన్ని వర్ణించేదిగా గ్రహించి తెలుగు సాధారణ వర్తమానాన్ని వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో నిబంధనా దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తుపట్టదగిన నామరూపమైన ‘యెహోవా’ను వాడి, సాధారణ బిరుదుగా మార్చలేదు.
- issue: תּוֹעֵבָה మరియు שָׂנֵא లోని దైవిక నైతిక తీర్పు తీవ్రత
  choice: హేయమైన పని; అసహ్యించుకునే
  alternative: అసహ్యకరమైనది; ద్వేషించే
  rationale: మూలంలోని తీవ్రమైన దైవిక నిరాకరణను మృదువుచేయలేదు. అదే సమయంలో తెలుగులో ‘ద్వేషించే’ కంటే ఈ సందర్భంలో సహజంగా వినిపించే ‘అసహ్యించుకునే’ను ఎంచుకున్నాం.
- issue: పిల్లలను అగ్నిలో కాల్చడం అనే వాక్యంలోని స్పష్టత
  choice: ప్రత్యక్షంగా నిలుపుట
  alternative: సాధారణంగా ‘పిల్లలను బలిగా అర్పిస్తారు’ అని చెప్పుట
  rationale: మూలం కుమారులు, కుమార్తెలు మరియు అగ్నిలో కాల్చడాన్ని స్పష్టంగా చెబుతుంది. దాని భయానకతను సాధారణీకరించకుండా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కానీ సాధారణ పాఠకుడికి సులభమైన శైలి. ముందున్న సందర్భాన్ని బట్టి ‘అలా చేయకూడదు’ అనే సంక్షిప్త పదశః రూపానికి బదులు ‘ఆ విధంగా ఆరాధించకూడదు’ అని స్పష్టం చేశాం. ప్రచురణ పాఠ్యంలో పాదటిప్పణులు లేవు.
