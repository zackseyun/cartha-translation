review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the chosen place, Yahweh’s future choice, the tribal location, burnt offerings, and the comprehensive command. However, the first occurrence of שָׁם (“there”) is not distinctly represented: “స్థలంలో మాత్రమే” supplies restriction but not the deictic focus on that designated place. Rendering the phrase as “స్థలంలోనే” naturally carries both the exclusivity and the locative emphasis in Telugu.'
  naturalness: The register is clear modern standard Telugu and the sacrificial terminology is appropriate. “స్థలంలోనే” is smoother and more idiomatic than “స్థలంలో మాత్రమే” in this construction, while retaining the verse’s emphatic restriction.
  terminology: “యాహ్వే,” “గోత్రాలు,” and “దహనబలులు” are accurate, consistent, and suitably formal. No theological or denominational interpretation has been added.
  issues:
  - severity: medium
    issue: The first שָׁם (“there”) is underrepresented.
    rationale: The Hebrew says that at the chosen place, “there” the offerings must be presented. The current “స్థలంలో మాత్రమే” expresses exclusivity but does not explicitly retain the focused locative force. “స్థలంలోనే” supplies this naturally without overtranslation.
  revised_text: కాని యాహ్వే నీ గోత్రాలలో ఒకదానిలో[b] ఎంచుకునే స్థలంలోనే[a] నీ దహనబలులను అర్పించాలి; అక్కడే నేను నీకు ఆజ్ఞాపిస్తున్నదంతా చేయాలి.
