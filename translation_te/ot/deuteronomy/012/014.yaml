id: DEU.12.14
reference: Deuteronomy 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: te
  text: కాని యాహ్వే నీ గోత్రాలలో ఒకదానిలో[b] ఎంచుకునే స్థలంలోనే[a] నీ దహనబలులను అర్పించాలి; అక్కడే నేను నీకు ఆజ్ఞాపిస్తున్నదంతా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఎంచుకునే స్థలంలో తప్ప మరెక్కడా కాదు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ గోత్రాలలో ఒకదానిలో”; అంటే ఇశ్రాయేలు గోత్రాలలో ఒకదానికి చెందిన భూభాగంలో.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని ... మాత్రమే
  rationale: మునుపటి నిషేధానికి విరుద్ధంగా, అనుమతించబడిన ఏకైక స్థలాన్ని సూచించే పరిమితి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּמָּקוֹם
  choice: స్థలంలో
  rationale: దేవుడు ఎంపిక చేసే నిర్దిష్ట ఆరాధనా స్థలాన్ని సూచిస్తుంది; హీబ్రూలోని నిర్దిష్టత సందర్భం ద్వారా తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: యాహ్వే ... ఎంచుకునే
  rationale: יִבְחַר యొక్క భావి లేదా భావిసంబంధ సూచనను తెలుగు సంబంధక క్రియ సహజంగా తెలియజేస్తుంది; దేవుని వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: నీ గోత్రాలలో ఒకదానిలో
  rationale: హీబ్రూ పదబంధంలోని సామాజిక-నిబంధనాత్మక ‘గోత్రాలు’ అనే పదాన్ని నిలుపుతూ, ఎంపికైన స్థలం ఒక గోత్రపు పరిధిలో ఉంటుందని సూచిస్తుంది.
- source_word: שָׁם
  choice: అక్కడే
  rationale: ఎంపికైన స్థలానికే పరిమితం అనే ఉద్ఘాటనను ‘-ఏ’ ద్వారా నిలుపుతుంది; రెండో సందర్భంలోనూ ఇదే స్థలకేంద్రీకరణను వ్యక్తం చేస్తుంది.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: నీ దహనబలులను అర్పించాలి
  rationale: עלה హిఫీల్ రూపానికి ఇక్కడ బలిని పైకి ఎక్కించడం అనే పదశః నేపథ్యం ఉన్నా, ఆచార సందర్భంలో ‘అర్పించు’ సహజమైనది; עֹלָהను ప్రామాణికంగా ‘దహనబలి’గా అనువదించింది.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: నేను నీకు ఆజ్ఞాపిస్తున్నదంతా
  rationale: מְצַוֶּה అనే వర్తమాన కృదంతంలోని కొనసాగుతున్న ఆజ్ఞాపన భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ నిలుపుతుంది; כֹּל אֲשֶׁרను ‘అంతా’ సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా ‘యాహ్వే’గా అందించింది.
- issue: కేంద్రీకృత బలిస్థలపు ప్రత్యేకత
  choice: స్థలంలో మాత్రమే ... అక్కడే
  alternative: ఎంచుకునే స్థలంలో బలులు అర్పించాలి
  rationale: כִּי אִם మరియు שָׁם కలిగిన పరిమితి, ఉద్ఘాటనను నిలుపుతూ, ఇతర స్థలాల్లో బలి అర్పించరాదనే వచన సంబంధ ఉద్వేగాన్ని తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన సంబోధనను నిలుపుతూ, ఆరాధనా సందర్భానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించింది. హీబ్రూ వాక్యంలోని స్థలపరమైన ఉద్ఘాటనను ‘మాత్రమే’, ‘అక్కడే’తో సహజంగా ప్రతిబింబించింది.
