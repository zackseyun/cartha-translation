reference: Deuteronomy 12:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: te
  text: అయితే, గజెల్‌ను, జింకను తినినట్లే[a] దానినీ మీరు తినవచ్చు. ఆచారపరంగా అశుద్ధుడూ శుద్ధుడూ ఒకే విధంగా దానిని తినవచ్చు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లేడి జింకను, మగ జింకను తినినట్లే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆచారపరంగా అశుద్ధ స్థితిలో ఉన్నవారూ శుద్ధ స్థితిలో ఉన్నవారూ ఇద్దరూ దానిని తినవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి ఆదేశానికి సంబంధించిన పరిమితిని లేదా మినహాయింపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: తినే విధంగానే ... కూడా
  rationale: మృగమాంసాన్ని తినడానికి, ఇక్కడ ప్రస్తావించిన జంతువును తినడానికి మధ్యనున్న పోలికను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: יֵאָכֵל
  choice: తినే
  rationale: హీబ్రూ నిఫాల్ రూపంలోని సాధారణ కర్మణి భావాన్ని తెలుగు పోలిక నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַצְּבִי
  choice: జింక
  rationale: గజెల్ జాతి అడవి జంతువుకు సాధారణ ఆధునిక తెలుగు పాఠకునికి సులభంగా అర్థమయ్యే సమీప పదం.
- source_word: הָאַיָּל
  choice: దుప్పి
  rationale: జింక జాతికి చెందిన మరో అడవి జంతువును సూచిస్తూ, మొదటి జంతువుతో ఉన్న భేదాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: תֹּאכְלֶנּוּ
  choice: దానిని కూడా మీరు తినవచ్చు
  rationale: న్యాయపరమైన సందర్భంలో అపూర్ణ క్రియ అనుమతిని తెలియజేస్తుంది; ‘తినవచ్చు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַטָּמֵא
  choice: ఆచారపరంగా అపవిత్రుడైనవాడు
  rationale: ఇది నైతిక దుష్టత్వం కాక ఆచార సంబంధమైన స్థితిని సూచిస్తుందని పాఠ్యంలోనే స్పష్టం చేస్తుంది.
- source_word: הַטָּהוֹר
  choice: పవిత్రుడైనవాడు
  rationale: ఆచారపరమైన అపవిత్రతకు వ్యతిరేక స్థితిని సాధారణ బైబిల్ తెలుగు పదజాలంలో వ్యక్తపరుస్తుంది.
- source_word: יַחְדָּו
  choice: ఒకే విధంగా
  rationale: ఇద్దరూ ఒకేసారి తినడం కంటే, రెండు వర్గాలకూ సమాన అనుమతి ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: יֹאכְלֶנּוּ
  choice: దానిని తినవచ్చు
  rationale: క్రియలోని న్యాయపరమైన అనుమతి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆచార స్థితిని సూచించే పదజాలం
  choice: ఆచారపరంగా అపవిత్రుడైనవాడూ పవిత్రుడైనవాడూ
  alternative: అపవిత్రుడూ పవిత్రుడూ
  rationale: ఈ విరుద్ధ పదాలు నైతిక స్వభావాన్ని కాక ఆచార సంబంధమైన స్థితిని సూచిస్తున్నాయి. అపార్థం రాకుండా ‘ఆచారపరంగా’ అని మొదటి పదానికి జోడించి, రెండింటికీ అది వర్తించేలా నిర్మించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. జంతువుల పేర్లలోని మూలభాషా అనిశ్చితిని [a] పాదసూచికలో నిలిపాం. ఆచారపరమైన శుద్ధి–అశుద్ధి భావం నైతిక తీర్పుగా అపార్థం కాకుండా ప్రధాన పాఠ్యంతో పాటు [b] పాదసూచికలోనూ వివరించబడింది.
