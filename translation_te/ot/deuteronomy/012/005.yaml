id: DEU.12.5
reference: Deuteronomy 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: te
  text: కాని మీ గోత్రాలన్నిటిలోనుండి మీ దేవుడైన యెహోవా తన నామాన్ని అక్కడ ఉంచడానికి ఎంచుకునే స్థలాన్నే, తన నివాసం కోసం[a], మీరు వెదకాలి; అక్కడికి వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ తాను నివసించడానికి.” ఈ హెబ్రీ వాక్యభాగం చాలా సంక్షిప్తంగా ఉంది; ఇది దేవుని నివాసాన్ని, ఆ స్థలాన్ని ఆయన నివాసంగా, లేక ఈ రెండింటినీ సూచిస్తుందా అన్న విషయంలో అనువాదాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని ... స్థలాన్నే
  rationale: మునుపటి నిషేధానికి విరుద్ధంగా సరైన ప్రత్యామ్నాయాన్ని చూపే నిర్మాణం; ‘-నే’ ఎంపిక యొక్క ప్రత్యేకతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמָּקוֹם
  choice: స్థలం
  rationale: దేవుడు ఇంకా నిర్దిష్టంగా వెల్లడించని ఆరాధనా ప్రదేశాన్ని సూచించే సాధారణ, స్పష్టమైన పదం.
- source_word: יִבְחַר
  choice: ఎంచుకునే
  rationale: భవిష్యత్తులో యెహోవా చేసే ఎంపికను తెలుగు సంబంధక క్రియారూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ఉంచుతుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: యెహోవాతో కూడిన నిబంధనాత్మక సంబోధనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: మీ గోత్రాలన్నిటిలోనుండి
  rationale: ఇశ్రాయేలు గోత్రాల పరిధిలోనుండి ఒక స్థలాన్ని ఎంచుకోవడమనే మూలభాష సంబంధాన్ని నిలుపుతుంది.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: దేవుని అధీకృత సన్నిధి, ఆరాధనతో ముడిపడిన సంక్షిప్త హెబ్రీ నుడికారానికి దగ్గరగా ఉంటుంది; అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: לְשִׁכְנוֹ
  choice: తాను అక్కడ నివసించడానికి
  rationale: שכן మూలంలోని నివాస భావాన్ని స్పష్టంగా ఇస్తుంది; అయితే దీని వాక్యనిర్మాణ సంబంధం సందిగ్ధమైనందున పాదటిప్పణి జోడించబడింది.
- source_word: תִדְרְשׁוּ
  choice: మీరు వెదకి
  rationale: అధీకృత ఆరాధనా స్థలాన్ని శ్రద్ధగా వెదకడమనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּבָאתָ שָׁמָּה
  choice: అక్కడికి వెళ్లాలి
  rationale: בוא యొక్క గమ్యార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలుపుతుంది; שָׁמָּה యొక్క ‘అక్కడికి’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం మరియు కేంద్రీయ ఆరాధనా స్థల భాష
  choice: యెహోవా ... తన నామాన్ని అక్కడ ఉంచడానికి ... తాను అక్కడ నివసించడానికి
  alternative: యెహోవా ... తన నివాసం కోసం తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: వచనంలోని ‘నామం’ మరియు ‘నివాసం’ అనే రెండు భావాలనూ నిలుపుతూ, తరువాతి ఆలయ సిద్ధాంతాలను ఇందులోకి దిగుమతి చేయదు. హెబ్రీ వాక్యభాగంలోని నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞార్థాన్ని ‘వెదకి, అక్కడికి వెళ్లాలి’గా అందించి, కేంద్రీయ ఆరాధనా స్థల ప్రత్యేకతను ‘స్థలాన్నే’ ద్వారా స్పష్టం చేసింది.
