  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: te
  text: ఎందుకంటే, మీ దేవుడైన యాహ్వే మీకు ఇస్తున్న విశ్రాంతి స్థలానికీ స్వాస్థ్యానికీ మీరు ఇప్పటివరకు చేరుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్రాంతికి.” హీబ్రూ పదం అమూర్తమైన ‘విశ్రాంతి’ని గానీ, మరింత నిర్దిష్టంగా ‘విశ్రాంతి స్థలం’ను గానీ సూచించగలదు; ఇక్కడ దేశానికి చేరుకునే సందర్భం రెండవ భావానికి మొగ్గు చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని వివరిస్తున్న హేతుబోధక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: בָּאתֶם
  choice: చేరుకోలేదు
  rationale: בוא అనే క్రియకు ‘రావడం/చేరడం/ప్రవేశించడం’ అనే పరిధి ఉంది; గమ్యస్థానాలను సూచించే పదబంధాలతో ‘చేరుకోవడం’ తెలుగులో సహజంగా ఉంటుంది, ‘ప్రవేశించడం’ కంటే మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עַד עָתָּה
  choice: ఇప్పటివరకు
  rationale: నిషేధ క్రియతో కలిసి ‘ఈ సమయం వరకు జరగలేదు’ అనే కాలార్థాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: הַמְּנוּחָה
  choice: విశ్రాంతి స్థలం
  rationale: ఈ భూభాగ-ప్రవేశ సందర్భంలో మְנוּחָה అమూర్తమైన ‘విశ్రాంతి’తో పాటు చేరవలసిన స్థలాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో సందర్భానుకూలమైన స్థలార్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: הַנַּחֲלָה
  choice: స్వాస్థ్యం
  rationale: దేవుడు అనుగ్రహించి కేటాయించే వారసత్వపు భూసంపద అనే נַחֲלָה భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన ప్రత్యక్ష నామరూపంలో నిలుపుతుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: נֹתֵן
  choice: ఇస్తున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా సమీపంగా నెరవేరనున్న దానభావాన్ని వర్తమాన క్రియారూపంతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం దానిని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగా నిలుపుతుంది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: מְנוּחָה యొక్క స్థలార్థం లేదా అమూర్తార్థం
  choice: విశ్రాంతి స్థలం
  alternative: విశ్రాంతి
  rationale: వాగ్దాన దేశానికి ఇంకా చేరుకోకపోవడం గురించి ఉన్న తక్షణ సందర్భం స్థలార్థానికి మొగ్గు చూపుతుంది. అయినా హీబ్రూ పదంలోని అమూర్తమైన ‘విశ్రాంతి’ భావాన్ని పాదటిప్పణి ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మీ దేవుడైన యెహోవా’ మూలంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘విశ్రాంతి స్థలం’ మరియు ‘స్వాస్థ్యం’ అనే సమాంతర గమ్యపదాలను నిలుపుతుంది.
