source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే తన నామాన్ని అక్కడ ఉంచుటకు ఎంచుకునే స్థలం నీకు దూరంగా ఉంటే, యాహ్వే నీకు ఇచ్చిన నీ పశువుల మందలోనుండి, నీ గొర్రెలు మేకల మందలలోనుండి, నేను నీకు ఆజ్ఞాపించిన ప్రకారం వధించి, నీ ఊళ్లలో[a] నీ మనసు కోరినంతగా[b] తినవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ గుమ్మాల లోపల’; ఇక్కడ ఇది ‘నీ పట్టణాల్లో’ లేదా ‘నీ నివాస ప్రాంతాల్లో’ అనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీకు ఎంత ఆకలి ఉంటే అంతగా’; అక్షరార్థంగా, ‘నీ ప్రాణపు సమస్త కోరిక ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: నీకు దూరంగా ఉంటే
  rationale: כִּי ఇక్కడ షరతును పరిచయం చేస్తుంది; רחק అంటే దూరంగా ఉండడం. మూలంలో లేని ‘మరీ దూరంగా’ అనే భావాన్ని చేర్చకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: שׂים యొక్క ప్రాథమిక భావమైన ‘ఉంచు’ను నిలుపుతూ ద్వితీయోపదేశకాండంలోని ప్రత్యేక అభయారణ్య సూత్రాన్ని వ్యాఖ్యానించి మార్చలేదు.
- source_word: וְזָבַחְתָּ
  choice: వధించవచ్చు
  rationale: ఈ సందర్భంలో కేంద్ర ఆరాధనా స్థలం దూరంగా ఉన్నప్పుడు సాధారణ ఆహారం కోసం స్థానికంగా జంతువును చంపడానికి అనుమతి ఇవ్వబడుతోంది. అందువల్ల బలి అర్పణ అనే భావాన్ని కలిగించని ‘వధించవచ్చు’ ఎంచుకున్నాం.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: నీ పశువుల్లోనుంచి, గొర్రెలమేకల్లోనుంచి
  rationale: בקר పెద్ద పెంపుడు పశువులను, צאן గొర్రెలు-మేకలతో కూడిన చిన్న పశువుల మందను సూచిస్తాయి; తెలుగు పాఠకులకు జంతువుల వర్గాలు స్పష్టంగా ఉండేలా అనువదించాం.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: నేను నీకు ఆజ్ఞాపించిన ప్రకారం
  rationale: మొదటి పురుష ఏకవచన వక్తను, ముందుగా ఇచ్చిన ఆజ్ఞతో ఉన్న సంబంధాన్ని యథాతథంగా నిలిపాం.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ ఊళ్లలో
  rationale: అక్షరార్థంగా ‘నీ గుమ్మాల లోపల’ అయినా, ఇక్కడ గుమ్మాలు పట్టణాలు లేదా స్థానిక నివాస ప్రాంతాలకు సూచకప్రయోగం. ప్రధాన పాఠంలో సహజమైన అర్థాన్ని ఇచ్చి అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: నీ మనసు కోరినంతగా
  rationale: ఈ పదబంధం వ్యక్తి కోరిక లేదా ఆకలిని సూచిస్తుంది. נֶפֶשׁ యొక్క వ్యక్తిగత అంతరంగ భావాన్ని ‘మనసు’ ద్వారా నిలుపుతూ సహజమైన ఆధునిక తెలుగు వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: స్థానిక వధ బలియర్పణనా లేక సాధారణ ఆహారానికా
  choice: సాధారణ ఆహారం కోసం అనుమతించబడిన వధగా తెలిపాం
  alternative: ‘బలిగా అర్పించాలి’ అని అనువదించడం
  rationale: సమీప సందర్భం కేంద్రస్థలం దూరంగా ఉన్నప్పుడు తమ ఊళ్లలో మాంసం తినడానికి ఇచ్చిన అనుమతిని వివరిస్తుంది. కాబట్టి స్థానిక బలియర్పణను సూచించే పదజాలాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ఏకవచన సంబోధనను నిలిపాం. ‘ఊళ్లలో’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదం; దాని వెనుకనున్న హీబ్రూ ‘గుమ్మాలు’ రూపకాన్ని పాదసూచికలో భద్రపరిచాం. అందించిన ఆంగ్ల పాఠంలోని పాదసూచిక గుర్తులు వాటి పదాలకు సరిపోని చోట ఉన్నందున, మూలపాఠ సంబంధాన్ని అనుసరించి [a]ను ‘ఊళ్లలో’ వద్ద, [b]ను కోరిక/ఆకలి పదబంధం వద్ద ఉంచాం.
