id: DEU.12.16
reference: Deuteronomy 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֥ק הַ/דָּ֖ם לֹ֣א תֹאכֵ֑לוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: te
  text: కాని రక్తాన్ని మాత్రం తినకూడదు; దాన్ని నీళ్లవలె నేలపై పోయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: అయితే ... మాత్రం
  rationale: ముందున్న అనుమతికి ఈ ఆజ్ఞ మినహాయింపు లేదా పరిమితిని విధిస్తోంది. ఆధునిక తెలుగులో ‘అయితే ... మాత్రం’ ఆ నిర్బంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַדָּם
  choice: రక్తాన్ని
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న హెబ్రీ పదం ఇక్కడ వధించిన జంతువు రక్తాన్ని సూచిస్తుంది. తెలుగులో కర్మవిభక్తితో ‘రక్తాన్ని’ అనడం సహజం; నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: לֹא תֹאכֵלוּ
  choice: తినకూడదు
  rationale: నిషేధార్థక న్యాయ ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా, గౌరవప్రదంగా తెలిపే సహజ రూపం.
- source_word: עַל הָאָרֶץ
  choice: నేల మీద
  rationale: ఈ భౌతిక చర్య సందర్భంలో אֶרֶץ అంటే దేశం లేదా భూమండలం కాకుండా నేలను సూచిస్తుంది.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: దాన్ని ... కుమ్మరించాలి
  rationale: క్రియకు జతైన సర్వనామ ప్రత్యయం ముందున్న రక్తాన్ని సూచిస్తుంది. ‘కుమ్మరించాలి’ ఉద్దేశపూర్వకంగా ద్రవాన్ని నేలపై పోయడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּמָּיִם
  choice: నీళ్లలాగా
  rationale: హెబ్రీ ఉపమానాన్ని సాధారణ ఆధునిక తెలుగు వాడుకలో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఆహార నియమంలో రక్తం పట్ల వ్యవహారం
  choice: రక్తాన్ని తినకూడదనే నిషేధంగా, దాన్ని నేల మీద నీళ్లలాగా కుమ్మరించాలనే ఆదేశంగా నేరుగా అనువదించడం.
  alternative: రక్తానికి తరువాతి కాలంలో ఏర్పడిన బలిపరమైన లేదా ప్రతీకాత్మక వివరణను వాక్యంలో చేర్చడం.
  rationale: ఈ వచనం స్పష్టమైన ఆచరణాత్మక న్యాయ ఆదేశాన్ని ఇస్తుంది; మూలపాఠం చెప్పని తరువాతి వేదాంతార్థాలను అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే న్యాయ ఆజ్ఞకు తగిన గంభీరతతో రూపొందించబడింది. బహువచన సంబోధనను తెలుగులో సాధారణ నిర్దేశాత్మక క్రియారూపాలతో సహజంగా వ్యక్తం చేశాం.
