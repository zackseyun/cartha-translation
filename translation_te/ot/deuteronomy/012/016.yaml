revisions:
- from: అయితే రక్తాన్ని మాత్రం తినకూడదు; దాన్ని నీళ్లలాగా నేల మీద కుమ్మరించాలి.
  to: కాని రక్తాన్ని మాత్రం తినకూడదు; దాన్ని నీళ్లవలె నేలపై పోయాలి.
  rationale: The revision makes the restrictive force of רַק clearer in modern standard Telugu and slightly regularizes the register, while preserving the source’s direct prohibition, the blood as the object of pouring, the physical ground, and the comparison “like water.” No footnote is needed.
  reviewer_model: gpt-5.6-terra
