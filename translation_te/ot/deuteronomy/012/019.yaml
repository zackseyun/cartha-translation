source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: te
  text: నీ నేలపై[b] నీవు జీవించే రోజులన్నిటిలో లేవీయుణ్ణి[a] విడిచిపెట్టకుండా జాగ్రత్తపడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లేవీయులను.” హీబ్రూలో “లేవీయుడు” అని ఏకవచనం ఉంది; అది లేవీయుల వర్గాన్ని ప్రాతినిధ్యంగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ దేశంలో.” హీబ్రూ అక్షరార్థంగా “నీ నేలపై” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: నిఫాల్ ఆజ్ఞారూపంతో לְךָ కలిసిన ఈ ప్రయోగం తనను తాను కాపాడుకోవాలనే హెచ్చరికను సూచిస్తుంది. ఆధునిక తెలుగులో “జాగ్రత్తపడు” సహజంగా ఉండి ఆ హెచ్చరిక బలాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: విడిచిపెట్టకుండా
  rationale: פֶּן ప్రతికూల హెచ్చరికను ప్రవేశపెడుతుంది. తెలుగులో క్రియతో “-కుండా జాగ్రత్తపడు” అనే నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲזֹב
  choice: విడిచిపెట్టు
  rationale: עזב అంటే విడిచిపెట్టడం, త్యజించడం లేదా నిరాధారంగా వదలడం. ఇక్కడ లేవీయునిపట్ల సామాజిక-నిబంధనాత్మక బాధ్యతను విస్మరించకూడదనే గంభీరతను “విడిచిపెట్టు” నిలుపుతుంది.
- source_word: אֶת הַלֵּוִי
  choice: లేవీయుణ్ణి
  rationale: హీబ్రూలో నిర్ణయార్థక ఉపపదంతో ఏకవచనం ఉంది. ఇది లేవీయుల వర్గాన్ని సూచించే ప్రాతినిధ్య ఏకవచనంగా గ్రహించవచ్చు; మూలరూపాన్ని నిలుపుతూ తెలుగులో “లేవీయుణ్ణి” అని అనువదించబడింది.
- source_word: כָּל יָמֶיךָ
  choice: నీవు జీవించే రోజులన్నిటిలో
  rationale: అక్షరార్థంగా “నీ రోజులన్నిటిలో.” ఆధునిక తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు స్వల్పంగా విప్పి చెప్పినా, రోజులన్నిటి కాలవ్యాప్తిని నిలుపుతుంది.
- source_word: עַל אַדְמָתֶךָ
  choice: నీ నేలపై
  rationale: עַל అనే ఉపసర్గకు “పై,” אַדָמָהకు “నేల/భూమి” అనే ప్రాథమిక భావాలు ఉన్నాయి. “నీ నేలపై” మూలంలోని రూపకల్పనను దగ్గరగా అనుసరిస్తుంది; సందర్భానుసారంగా “నీ దేశంలో” అనే భావమూ సాధ్యమే.
theological_decisions:
- issue: లేవీయుని సూచించే ప్రాతినిధ్య ఏకవచనం
  choice: లేవీయుణ్ణి
  alternative: లేవీయులను
  rationale: మూల హీబ్రూ నిర్ణయార్థక ఉపపదంతో ఏకవచన నామవాచకాన్ని వాడుతుంది. అది సమాజంలోని లేవీయుల వర్గానికి ప్రాతినిధ్య ఏకవచనం కావచ్చు. ఈ రూపాన్ని నిలుపడం మూలంలోని వ్యాకరణపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన హెచ్చరిక శైలిని ఉపయోగించాం. హీబ్రూ ప్రాతినిధ్య ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, బహువచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం. “నీ నేలపై” అనే మూలానికి దగ్గరైన రూపాన్ని ఉంచి, సందర్భోచితమైన “నీ దేశంలో” అనే పఠనాన్ని కూడా సూచించాం.
