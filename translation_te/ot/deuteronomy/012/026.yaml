id: DEU.12.26
reference: Deuteronomy 12:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: te
  text: అయితే, నీకున్న పవిత్ర వస్తువులను, నీ మొక్కుబడులను మాత్రం తీసుకొని, యాహ్వే ఎన్నుకునే స్థలానికి నీవు రావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: అయితే … మాత్రం
  rationale: ముందటి వచనాల్లో స్థానికంగా వధించి తినడానికి ఇచ్చిన అనుమతికి భిన్నంగా, ఇక్కడ విధించిన మినహాయింపు మరియు పరిమితి రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: మీకు ఉన్న పవిత్ర వస్తువులను
  rationale: ఇవి వ్యక్తి ఆధీనంలో ఉన్న, దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించిన వస్తువులని తెలియజేస్తుంది; ఒక నిర్దిష్ట బలి రకానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: וּנְדָרֶיךָ
  choice: మీ మొక్కుబడులను
  rationale: హీబ్రూ పదానికి ప్రాథమికంగా ‘మీ మొక్కుబడులు’ అనే అర్థం ఉంది; ఈ బలుల సందర్భంలో మొక్కుబడులను తీర్చడానికి తెచ్చే అర్పణలను కూడా సూచించవచ్చు. తెలుగు పదం ఆ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: תִּשָּׂא וּבָאתָ
  choice: తీసుకొని … రావాలి
  rationale: పవిత్ర వస్తువులను మోసుకొని నిర్దేశిత స్థలానికి రావడం అనే రెండు చర్యల క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמָּקוֹם
  choice: స్థలం
  rationale: ద్వితీయోపదేశకాండంలో కేంద్రీయ ఆరాధనా స్థలాన్ని సూచించే ముఖ్య పదబంధాన్ని అతిగా విశదీకరించకుండా అనువదిస్తుంది.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: యాహ్వే ఎన్నుకునే
  rationale: భవిష్యత్తులో దేవుడు నియమించే స్థలాన్ని సూచించే ద్వితీయోపదేశకాండపు సూత్రప్రాయ పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగు లిపిలో ఇస్తుంది.
- issue: וּנְדָרֶיךָ యొక్క బలిసంబంధ సూచన
  choice: మొక్కుబడులు
  alternative: మొక్కుబడి అర్పణలు
  rationale: మూలపదం మొక్కుబడులనే నేరుగా సూచించినా, సందర్భంలో వాటిని తీర్చే అర్పణలు ఉద్దేశించబడి ఉండవచ్చు. ప్రధాన పాఠం మూలంలోని విస్తృతిని నిలుపుతూ, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఏకవచన ద్వితీయ పురుష ఆజ్ఞను తెలుగులో సహజమైన ‘రావాలి’ రూపంలో ఇచ్చాం. ‘అయితే … మాత్రం’ నిర్మాణం సందర్భంలోని వ్యత్యాసం మరియు పరిమితిని రెండింటినీ నిలుపుతుంది.
