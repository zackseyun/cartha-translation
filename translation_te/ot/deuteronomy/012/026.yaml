revisions:
- from: అయితే, మీకు ఉన్న పవిత్ర వస్తువులను, మీ మొక్కుబడులను[a] మాత్రం తీసుకొని, యాహ్వే ఎన్నుకునే స్థలానికి రావాలి.
  to: అయితే, నీకున్న పవిత్ర వస్తువులను, నీ మొక్కుబడులను మాత్రం తీసుకొని, యాహ్వే ఎన్నుకునే స్థలానికి నీవు రావాలి.
  rationale: The revision retains the draft’s accurate rendering choices while aligning the address with the Hebrew singular and improving Telugu idiom. The main text continues to leave ‘vows’ broad, and the footnote preserves the possible concrete sense ‘vow offerings’ without imposing it on the text.
