id: DEU.12.17
reference: Deuteronomy 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: te
  text: మీ ఊళ్లలో[a] మీ ధాన్యంలోని పదోవంతును గాని, మీ కొత్త ద్రాక్షారసాన్ని గాని, మీ నూనెను గాని, మీ పశువుల మందలలోను గొర్రెలమేకల మందలలోను పుట్టిన తొలిచూలు పిల్లలను గాని, మీరు మ్రొక్కుకున్న ఏ మ్రొక్కుబడి అర్పణలనైనా గాని[b], మీ స్వేచ్ఛార్పణలను గాని, మీ చేతులతో ఇచ్చే కానుకను గాని[c] తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మీ గుమ్మాల లోపల.’ ఇది మీ స్థానిక ఊళ్లు లేదా పట్టణాలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీరు మ్రొక్కుకున్న మీ మ్రొక్కుబడులు.’ సందర్భంలో ఇది మ్రొక్కుబడులకు సంబంధించిన అర్పణలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘మీ చేతులతో ఇచ్చే కానుక’ను ‘మీ చేతి అర్పణ’ అని కూడా అనువదించవచ్చు; సంప్రదాయంగా దీనిని ఒక ప్రత్యేక ఆరాధనా అర్పణకు వాడే పదంతో అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: తినకూడదు
  rationale: יכל + క్రియార్థక రూపం ఇక్కడ అసమర్థతకన్నా న్యాయపరమైన నిషేధాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘తినకూడదు’ సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: మీ ఊళ్లలో
  rationale: అక్షరార్థంగా ‘మీ గుమ్మాల లోపల’; ద్వితీయోపదేశకాండ న్యాయభాషలో ఇది స్థానిక నివాస ప్రాంతాలు లేదా పట్టణాలను సూచించే నుడికారం. ప్రధాన పాఠంలో సహజమైన భావానువాదం ఇచ్చి అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַעְשַׂר
  choice: పదోవంతు
  rationale: అర్పణగా వేరుచేసే పదవ భాగాన్ని సూచించే ఆరాధనా పదం; ‘పదోవంతు’ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: דְּגָנְךָ
  choice: మీ ధాన్యం
  rationale: సాధారణ పంటలన్నిటినీ కాక ధాన్యాన్ని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: תִּירֹשְׁךָ
  choice: మీ కొత్త ద్రాక్షారసం
  rationale: תירוש సాధారణంగా తాజా లేదా కొత్త ద్రాక్షారసాన్ని సూచిస్తుంది; ఇతర ద్రాక్షారస పదాలతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: יִצְהָרֶךָ
  choice: మీ నూనె
  rationale: సాధారణంగా తాజా నూనెను, ముఖ్యంగా ఒలీవ నూనెను సూచిస్తుంది; అయితే మూలంలో లేని ప్రత్యేకతను ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: మీ పశువులలో లేదా మందలో తొలిచూలు పిల్లలు
  rationale: בכור మొదట పుట్టిన సంతానాన్ని సూచిస్తుంది; בקר, צאן అనే రెండు సమూహ వర్గాలను సహజ తెలుగులో ‘పశువులు’, ‘మంద’గా అందించాం.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: మీరు మ్రొక్కుకున్న మ్రొక్కుబడి అర్పణల్లో దేనినైనా
  rationale: నామవాచకం స్వతహాగా ‘మ్రొక్కుబడులు’ అని ఉన్నప్పటికీ, తినే వస్తువుల జాబితా సందర్భం వాటికి సంబంధించిన అర్పణలను సూచిస్తుంది. ‘అర్పణలు’ను స్పష్టీకరణగా చేర్చి ప్రత్యక్ష రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: נִדְבֹתֶיךָ
  choice: మీ స్వేచ్ఛార్పణలు
  rationale: మ్రొక్కుబడి లేదా విధిబద్ధత వల్ల కాక స్వచ్ఛందంగా ఇచ్చే ప్రత్యేక ఆరాధనా అర్పణ వర్గాన్ని సూచిస్తుంది.
- source_word: תְּרוּמַת יָדֶךָ
  choice: మీ చేతి ప్రతిష్ఠిత అర్పణ
  rationale: תרומה వేరుచేసి సమర్పించిన భాగం లేదా అర్పణ; ‘మీ చేతి’ అనే హీబ్రూ రూపాన్ని నిలిపి, అస్పష్టమైన ఆచార విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ప్రతిష్ఠిత అర్పణ’గా ఇచ్చాం.
theological_decisions:
- issue: న్యాయ-ఆరాధనా సందర్భంలోని మ్రొక్కుబడుల స్వరూపం
  choice: ‘మ్రొక్కుబడి అర్పణలు’ అని సందర్భానుసారంగా స్పష్టం చేయడం
  alternative: ‘మీరు మ్రొక్కుకున్న మీ మ్రొక్కుబడులు’ అని రూపపరంగా మాత్రమే అనువదించడం
  rationale: వాక్యం తినకూడని పవిత్ర ఆహారాలు, అర్పణల జాబితా కాబట్టి పలికిన ప్రమాణాలకన్నా వాటికి సంబంధించిన అర్పణలే ఉద్దేశమై ఉండవచ్చు. అయినా మూలంలోని సంక్షిప్తతను పాదసూచికలో సంరక్షించాం.
- issue: תְּרוּמַת יָדֶךָ అనే ఆరాధనా పదబంధం
  choice: ‘మీ చేతి ప్రతిష్ఠిత అర్పణ’
  alternative: ‘మీ చేతినుండి ఇచ్చే అర్పణ’ లేదా సంప్రదాయ సాంకేతిక పదంతో అనువదించడం
  rationale: అర్పణను వేరుచేసి సమర్పించే భావాన్ని ఉంచుతూ, మూలం స్పష్టంగా చెప్పని ఎత్తే లేదా ఊపే ఆచారాన్ని అనువాదంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలిని వాడాం. దీర్ఘ జాబితి పఠనీయంగా ఉండేందుకు ప్రతి అంశానికి ‘గాని’ను ఉపయోగించాం. ‘మ్రొక్కుబడి’, ‘స్వేచ్ఛార్పణ’, ‘ప్రతిష్ఠిత అర్పణ’ వంటి పదాలు వర్గభేదాలను నిలుపుతూనే సాధారణ పాఠకునికి అర్థమయ్యేలా ఎంపికయ్యాయి.
