id: DEU.12.2
reference: Deuteronomy 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: te
  text: మీరు వెళ్లగొడుతున్న జాతులు ఎత్తైన పర్వతాల మీదా, కొండల మీదా, పచ్చని ప్రతి చెట్టు కిందా తమ దేవుళ్లను సేవించిన[a] అన్ని స్థలాలను తప్పక పూర్తిగా నాశనం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ దేవుళ్లను ఆరాధించిన.’ హీబ్రూ క్రియకు మతపరమైన సందర్భంలో ‘సేవించు’ లేదా ‘ఆరాధించు’ అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: తప్పక పూర్తిగా నాశనం చేయాలి
  rationale: క్రియతో కూడిన infinitive absolute ఆజ్ఞను బలపరుస్తుంది. ‘తప్పక’ ఆ నిశ్చయాత్మక బలాన్ని, ‘పూర్తిగా నాశనం చేయాలి’ చర్య యొక్క సమగ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తాయి.
- source_word: הַמְּקֹמוֹת
  choice: ఆ స్థలాలన్నిటినీ
  rationale: ఇక్కడ మָקוֹם సాధారణ ప్రదేశాలకన్నా అన్యదేవతల ఆరాధనతో సంబంధమున్న నిర్దిష్ట స్థలాలను సూచిస్తుంది. ‘స్థలాలు’ మూలంలోని concrete focus‌ను కాపాడుతుంది.
- source_word: עָבְדוּ שָׁם
  choice: ఎక్కడెక్కడ ... సేవించారో
  rationale: עבד దేవుళ్లను ఉద్దేశించినప్పుడు మతపరంగా సేవించడం లేదా ఆరాధించడం అనే అర్థం కలిగి ఉంటుంది. ‘సేవించారో’ మూలక్రియకు దగ్గరగా ఉండగా, ‘ఎక్కడెక్కడ’ అక్కడ జరిగిన చర్యను స్థలాలన్నిటితో సహజంగా అనుసంధానిస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఇది ఇశ్రాయేలీయులు స్వాధీనం చేసుకోబోయే దేశంలో నివసిస్తున్న ఇశ్రాయేలేతర ప్రజాసమూహాలను సూచిస్తుంది. ‘జనాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి కాలానికి చెందిన ‘అన్యజనులు’ అనే మతపరమైన ఛాయను అనవసరంగా రుద్దదు.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: మీరు వెళ్లగొట్టి వారి దేశాన్ని స్వాధీనం చేసుకోబోతున్న
  rationale: ఆక్రమణ సందర్భంలో ירשׁ ముందున్న నివాసులను తొలగించి వారి భూమిని స్వాధీనం చేసుకోవడం అనే రెండు భావాలనూ కలిగి ఉంటుంది. తెలుగు వాక్యం సహజంగా ఉండేందుకు ఆ రెండు అంశాలను స్పష్టంగా వ్యక్తం చేశాం.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుళ్లను
  rationale: సంబంధ వాక్యంలోని కర్తతో అన్వయాన్ని స్పష్టంగా చూపే సహజమైన తెలుగు బహువచన స్వామ్యరూపం.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: ఎత్తైన పర్వతాల మీద
  rationale: నామవాచకంతో కూడిన విశేషణాన్ని నేరుగా ప్రతిబింబిస్తూ ఎత్తైన ఆరాధనా ప్రదేశాలను సూచిస్తుంది.
- source_word: הַגְּבָעוֹת
  choice: కొండల మీద
  rationale: గְּבָעוֹתకు సరళమైన సమానార్థకం ‘కొండలు’; ‘మీద’ అనే విభక్తి ఎత్తైన ప్రదేశాల్లోని స్థలాలను సూచిస్తుంది.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: పచ్చగా విరిసిన ప్రతి చెట్టు కింద
  rationale: רַעֲנָן తాజా, దట్టమైన, పచ్చని ఆకులతో వృద్ధిచెందిన స్థితిని సూచిస్తుంది. ‘పచ్చగా విరిసిన’ అనేది కేవలం చెట్టు రంగును కాక దాని సమృద్ధమైన ఆకుదనాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అన్యదేవతల ఆరాధనకు సంబంధించిన స్థలాలపై ఆజ్ఞ స్వరూపం
  choice: ఆజ్ఞ నేరుగా జనాలు తమ దేవుళ్లను సేవించిన స్థలాలన్నిటినీ నాశనం చేయమని చెబుతుంది.
  alternative: దీన్ని మరింత విస్తృతంగా అన్యదేవతారాధనా ఆచారాలన్నిటినీ నిర్మూలించాలనే ఆజ్ఞగా అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యంలో ప్రత్యక్ష కర్మ ‘స్థలాలన్నీ’; ఆచారాలు కావు. అందువల్ల అనువాదం స్థలాలనే concrete object‌గా ఉంచి, ఆరాధనా వ్యవస్థ నిర్మూలన అనే విస్తృత సూచనను పాఠకుడు గ్రహించేందుకు వదిలిపెడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, స్థలాలను సూచించే సంబంధ వాక్యంగా అమర్చి మూలార్థాన్ని కాపాడాం. ‘అన్యజనులు’ వంటి తరువాతి మతపరమైన పదజాలాన్ని నివారించాం.
