revisions:
- from: మీరు వెళ్లగొట్టి వారి దేశాన్ని స్వాధీనం చేసుకోబోతున్న జనాలు ఎత్తైన పర్వతాల మీద, కొండల మీద, పచ్చగా విరిసిన ప్రతి చెట్టు కింద ఎక్కడెక్కడ తమ దేవుళ్లను సేవించారో[a], ఆ స్థలాలన్నిటినీ తప్పక పూర్తిగా నాశనం చేయాలి.
  to: మీరు వెళ్లగొడుతున్న జాతులు ఎత్తైన పర్వతాల మీదా, కొండల మీదా, పచ్చని ప్రతి చెట్టు కిందా తమ దేవుళ్లను సేవించిన[a] అన్ని స్థలాలను తప్పక పూర్తిగా నాశనం చేయాలి.
  rationale: The revision removes an unnecessary expansion of the conquest clause, retains the source’s focus on destroying places rather than practices, preserves the emphatic command, and uses clear modern standard Telugu. The footnote remains anchored to “సేవించిన” and accurately presents the lexical alternative.
