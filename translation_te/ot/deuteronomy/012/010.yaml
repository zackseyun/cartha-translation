id: DEU.12.10
reference: Deuteronomy 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: te
  text: మీరు యొర్దాను దాటి, మీ దేవుడైన యాహ్వే మీకు స్వాస్థ్యంగా ఇచ్చే భూమిలో నివసించినప్పుడు, ఆయన చుట్టూ ఉన్న మీ శత్రువులందరి నుండి మీకు విశ్రాంతి అనుగ్రహిస్తాడు. అప్పుడు మీరు సురక్షితంగా నివసిస్తారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భద్రంగా నివసిస్తారు.”
    reason: బֶּטַח అనే హీబ్రూ పదం భద్రతతో, క్షేమంగా నివసించడం అనే భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: మీరు ... దాటి ... నివసించినప్పుడు
  rationale: భవిష్యత్తులో జరిగే వరుస ఘటనలను సూచించే సందర్భంలో, వావ్‌తో కూడిన క్రియకు సహజమైన కాలసంబంధ భావాన్ని ‘నివసించినప్పుడు’ అనే నిర్మాణం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: ఈ నది పేరుకు తెలుగులో విస్తృతంగా గుర్తించదగిన ప్రామాణిక రూపం; ‘నది’ అనే పదం సందర్భంలో అవసరం లేదు.
- source_word: וִישַׁבְתֶּם
  choice: నివసించినప్పుడు / నివసిస్తారు
  rationale: יָשַׁב ఇక్కడ స్థిరంగా ఉండడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘నివసించు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: אֶרֶץ ఇక్కడ ఇశ్రాయేలుకు స్వాస్థ్యంగా లభించే భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ సహజమైన తెలుగు ప్రయోగం, భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: מַנְחִיל אֶתְכֶם
  choice: మీకు స్వాస్థ్యంగా ఇస్తున్న
  rationale: נחל హిఫీల్ రూపం ఎవరికైనా స్వాస్థ్యం పొందేలా చేయడం అనే దైవకర్తృత్వాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం స్వాస్థ్య భావాన్నీ సహజ వాక్యనిర్మాణాన్నీ కాపాడుతుంది.
- source_word: וְהֵנִיחַ לָכֶם
  choice: మీకు విశ్రాంతి అనుగ్రహిస్తాడు
  rationale: נוּחַ హిఫీల్ ఇక్కడ శత్రువుల నుండి ఉపశమనంతో కూడిన విశ్రాంతిని కలిగించడం అని అర్థం. ‘అనుగ్రహిస్తాడు’ దైవకర్తృత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: చుట్టూ ఉన్న మీ శత్రువులందరి నుండి
  rationale: מִסָּבִיב యొక్క ప్రాదేశిక భావాన్నీ, כָּל యొక్క సమగ్రతనూ నేరుగా నిలుపుతుంది.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: మీరు సురక్షితంగా నివసిస్తారు
  rationale: בֶּטַח భద్రతతో, భయం లేకుండా ఉండే స్థితిని సూచిస్తుంది. ‘సురక్షితంగా నివసిస్తారు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నామాన్ని స్పష్టంగా కాపాడుతుంది.
- issue: הניח అనే ‘విశ్రాంతి’ భావం
  choice: విశ్రాంతి అనుగ్రహిస్తాడు
  alternative: ఉపశమనం కలిగిస్తాడు
  rationale: ఈ సందర్భంలో శత్రువుల నుండి ఉపశమన భావం ఉన్నప్పటికీ, ద్వితీయోపదేశకాండంలో భూమిలో లభించే ‘విశ్రాంతి’ అనే ధార్మిక-కథనాత్మక ప్రతిధ్వనిని నిలుపుటకు ‘విశ్రాంతి’ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించింది. హీబ్రూ వాక్యంలోని వరుస సంబంధాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచినా, సంఘటనల క్రమాన్ని మార్చలేదు.
