id: DEU.12.27
reference: Deuteronomy 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: te
  text: నీ దహనబలులను—వాటి మాంసాన్నీ రక్తాన్నీ—నీ దేవుడైన యాహ్వే బలిపీఠం మీద అర్పించాలి. నీ బలుల రక్తం నీ దేవుడైన యాహ్వే బలిపీఠం మీద పోయబడాలి; మాంసాన్ని నీవు తినాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: అర్పించాలి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చేయాలి’ అనే భావం ఉన్నా, עֹלֹתֶיךָతో కూడిన బలుల సందర్భంలో బలిని నిర్వహించడం లేదా అర్పించడం అనే ఆచారార్థం ఉంది. ‘అర్పించాలి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עֹלֹתֶיךָ
  choice: నీ దహనబలులను
  rationale: עֹלָה అనేది పూర్తిగా దహనం చేసే బలికి స్థిరమైన ఆచారపదం. ‘దహనబలి’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: వాటి మాంసాన్నీ రక్తాన్నీ
  rationale: ప్రస్తావించిన దహనబలులతో సంబంధాన్ని తెలుగులో స్పష్టంగా చూపడానికి ‘వాటి’ చేర్చబడింది; ‘మాంసం, రక్తం’ మూలంలోని concrete sacrificial languageను నిలుపుతాయి.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే బలిపీఠం మీద
  rationale: עַלకు సందర్భానుగుణంగా ‘మీద’, מִזְבֵּחַకు స్థిరమైన ‘బలిపీఠం’ వాడబడ్డాయి. తెలుగు పదక్రమం సహజంగా ఉండేలా సంబంధవాచక నిర్మాణం ఉపయోగించబడింది.
- source_word: וְדַם זְבָחֶיךָ
  choice: నీ బలుల రక్తాన్ని
  rationale: זֶבַח ఇక్కడ జంతుబలులను సూచించే విస్తృత ఆచారపదం. ‘బలులు’ సంక్షిప్తంగా, సహజంగా ఉండి మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: יִשָּׁפֵךְ
  choice: పోయాలి
  rationale: నిఫ్అల్ రూపం రక్తం పోయబడే ఆచారక్రియను సూచిస్తుంది. కర్మణి రూపాన్ని తెలుగులో బలవంతంగా అనుకరించకుండా, విధినిర్దేశక సందర్భానికి సహజమైన క్రియారూపం వాడబడింది.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: మాంసాన్ని నీవు తినాలి
  rationale: వావ్‌ను విరోధార్థక ‘కాని’గా మార్చకుండా, మూలంలోని సాధారణ అనుసంధానాన్ని విరామచిహ్నంతో నిలిపాం. תֹּאכֵל యొక్క ప్రత్యక్ష విధినిర్దేశక బలాన్ని ‘తినాలి’గా అనువదించాం; ‘తినవచ్చు’ అని అనుమతిగా మాత్రమే నిర్ణయించలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: చివరి వాక్యభాగం וְהַבָּשָׂר תֹּאכֵל యొక్క విధి లేదా అనుమతి భావం
  choice: మాంసాన్ని నీవు తినాలి
  alternative: మాంసాన్ని నీవు తినవచ్చు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం ధర్మశాస్త్ర సందర్భంలో విధినిర్దేశాన్ని వ్యక్తం చేయగలదు. కేవలం అనుమతిగా అర్థాన్ని కుదించకుండా, మూలంలోని బలాన్ని దగ్గరగా నిలిపాం; రక్తానికి విరుద్ధంగా మాంసం తినదగినదనే సందర్భార్థం మాత్రం అలాగే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. మొదటి వాక్యంలో గందరగోళం తగ్గించడానికి వివరణాత్మక విరామరేఖలు వాడబడ్డాయి; మూలంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
