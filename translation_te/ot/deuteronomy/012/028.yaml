revisions:
- from: నేను నీకు ఆజ్ఞాపిస్తున్న ఈ మాటలన్నిటినీ జాగ్రత్తగా విని పాటించు[a]. అప్పుడు నీ దేవుడైన యెహోవా దృష్టికి మంచిదీ న్యాయమైనదీ నీవు చేస్తావు గనుక, నీకూ నీ తర్వాత నీ పిల్లలకూ ఎల్లప్పుడూ మేలు కలుగుతుంది[b].
