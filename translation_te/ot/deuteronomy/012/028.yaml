id: DEU.12.28
reference: Deuteronomy 12:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: te
  text: నేను నీకు ఆజ్ఞాపిస్తున్న ఈ మాటలన్నిటినీ జాగ్రత్తగా విని పాటించు[a], తద్వారా నీకూ నీ తర్వాత నీ పిల్లలకూ ఎల్లప్పుడూ మేలు కలుగుతుంది; ఎందుకంటే నీ దేవుడైన యాహ్వే దృష్టిలో మంచిదీ సరైనదీ నీవు చేస్తావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కాపాడు, విను.” సందర్భంలో శ్రద్ధగా ఆలకించి ఆచరించాలనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదాన్ని “ఎందుకంటే” అని అనువదించవచ్చు; సందర్భానుసారం “నీవు చేసినప్పుడు” అని కూడా అర్థం కావచ్చు.
    reason: ambiguity
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: జాగ్రత్తగా విని పాటించు
  rationale: రెండు క్రియలలోని శ్రద్ధగా కాపాడడం/ఆచరించడం మరియు ఆలకించి విధేయత చూపడం అనే సంయుక్త భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఒకే భావంగా కుదించకుండా రెండింటి బలాన్నీ నిలుపుతుంది.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటినీ
  rationale: דברים అనే పదంలోని ‘మాటలు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, మోషే పలికిన ఆజ్ఞలను సూచించే సందర్భానికి సరిపోతుంది.
- source_word: מְצַוֶּךָּ
  choice: నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: హీబ్రూ కృదంత రూపంలోని ప్రస్తుత/కొనసాగుతున్న ఆజ్ఞాపన భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: నీకు ... మేలు కలుగుతుంది
  rationale: ద్వితీయోపదేశకాండంలోని ఒడంబడిక సంబంధమైన శ్రేయస్సు భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: నీ తర్వాత నీ పిల్లలకూ
  rationale: בנים రూపరీత్యా ‘కుమారులు’ అయినా, ఇక్కడ భావం తరువాతి సంతానాన్ని విస్తృతంగా సూచిస్తుంది; ‘పిల్లలు’ కుటుంబ మరియు వంశపారంపర్య పరిధిని నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: ఎల్లప్పుడూ
  rationale: అనిర్దిష్టంగా కొనసాగే దీర్ఘకాల భావాన్ని సరళంగా, గౌరవప్రదంగా తెలుపుతుంది.
- source_word: כִּי תַעֲשֶׂה
  choice: నీవు చేస్తావు గనుక
  rationale: כִּי యొక్క కారణార్థాన్ని, తַעֲשֶׂה యొక్క భవిష్యత్/ఫలిత ఛాయను నిలుపుతుంది; అయితే కారణ–కాల సంబంధంలోని సాధ్యమైన భిన్న పఠనాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: మంచిదీ న్యాయమైనదీ
  rationale: రెండు విశేషణాల నామవాచక ప్రయోగాన్ని సహజంగా వ్యక్తపరుస్తుంది; יָשָׁר ఇక్కడ దేవుని ప్రమాణానికి అనుగుణమైన సరైన/న్యాయమైన కార్యాన్ని సూచిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: ‘కళ్లలో’ అనే హీబ్రూ రూపకానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం; దైవిక మూల్యాంకనాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తించదగిన రూపం; ‘యాహ్వే’ మరొక సముచిత లిప్యంతరీకరణ.
- issue: בָנֶיךָ యొక్క పరిధి
  choice: పిల్లలు
  alternative: కుమారులు / సంతానం
  rationale: వ్యాకరణ రూపం పుంలింగ బహువచనమైనా, ఒడంబడిక శ్రేయస్సు సందర్భంలో తరువాతి తరాల సంతానాన్ని సూచించే విస్తృత భావం సహజం; పురుషులకు మాత్రమే పరిమితం చేయలేదు.
- issue: כִּי యొక్క సంబంధం
  choice: కారణార్థం—‘గనుక’
  alternative: కాలార్థం—‘నీవు చేసినప్పుడు’
  rationale: వాక్య నిర్మాణంలో శ్రేయస్సుకు కారణం/ఆధారంగా దేవుని దృష్టికి మంచిదీ న్యాయమైనదీ చేయడం కనిపిస్తుంది. అయినప్పటికీ כִּי కాలార్థాన్నీ అనుమతించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘జాగ్రత్తగా విని పాటించు’ ద్వారా హీబ్రూలోని రెండు క్రియల సంయుక్త బలం సహజంగా నిలుపబడింది. దీర్ఘ హీబ్రూ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం.
