  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే సన్నిధిలో మీరు, మీ కుమారులు, మీ కుమార్తెలు, మీ దాసులు, మీ దాసీలు, మీ పట్టణాల్లో ఉన్న లేవీయుడు[a] సంతోషించాలి; ఎందుకంటే మీతో అతనికి వాటాగానీ స్వాస్థ్యంగానీ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ ద్వారాల్లో ఉన్న లేవీయుడు”; ఇక్కడ “ద్వారాలు” పట్టణాలను లేదా స్థానిక సమాజాలను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: సంతోషించాలి
  rationale: ఉపదేశాత్మక సందర్భంలో ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఆరాధన సందర్భంలోని ఆనంద భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనే పదబంధంలోని ‘ఎదుట/సన్నిధిలో’ భావాన్ని ఆరాధన సందర్భానికి సహజంగా అందిస్తుంది; יהוה అనే వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: אַתֶּם וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: మీరు—మీ కుమారులు, మీ కుమార్తెలు
  rationale: స్పష్టంగా ఉన్న పురుష, స్త్రీ సంతాన జంటను సాధారణ ‘పిల్లలు’గా కలపకుండా నిలుపుతుంది; אַתֶּם లోని ఉద్ఘాటనను జాబితా ఆరంభంలో ఉంచుతుంది.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: మీ దాసులు, మీ దాసీలు
  rationale: ఇంటి ఆధీన సేవా స్థితిని తెలుగులో సహజంగా తెలియజేస్తూ, మూలంలోని లింగ భేదాన్ని నిలుపుతుంది. ‘సేవకులు’ కంటే బంధిత సామాజిక స్థితిని స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో కఠినమైన ‘బానిసలు’ కంటే గౌరవప్రద గ్రంథశైలికి సరిపోతుంది.
- source_word: וְהַלֵּוִי
  choice: లేవీయుడు
  rationale: లేవి గోత్రానికి చెందిన వ్యక్తిని సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: మీ పట్టణాల్లో నివసించే
  rationale: ‘మీ ద్వారాల్లో’ అనే హీబ్రూ నుడికారం ఇక్కడ పట్టణాలు లేదా స్థానిక నివాస ప్రాంతాలను సూచిస్తుంది; అర్థాన్ని సహజ తెలుగులో ప్రధాన పాఠంలో తెలిపింది.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: ఎందుకంటే మీతోపాటు అతనికి వంతుగానీ స్వాస్థ్యంగానీ లేదు
  rationale: כִּי యొక్క కారణార్థాన్ని స్పష్టంగా చూపుతుంది. חֵלֶק וְנַחֲלָה అనే జంటలోని కేటాయించిన వాటా మరియు వారసత్వ స్వాస్థ్య భావాలను వేర్వేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన వ్యక్తినామ రూపమైన ‘యెహోవా’ దానిని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: עבד/אמה పదాల్లోని గృహాధీన స్థితి
  choice: దాసులు, దాసీలు
  alternative: సేవకులు, సేవకురాళ్లు; బానిసలు, బానిస స్త్రీలు
  rationale: ఈ ధర్మశాస్త్ర సామాజిక సందర్భంలో ఆధీన స్థితి ప్రాధాన్యమైనది. ‘దాసులు/దాసీలు’ ఆ వాస్తవాన్ని మృదువుగా చెరపకుండా, సహజమైన గౌరవప్రద తెలుగు రిజిస్టర్‌ను కాపాడుతుంది.
- issue: లేవీయునికి వంతు మరియు స్వాస్థ్యం లేకపోవడం
  choice: వంతుగానీ స్వాస్థ్యంగానీ లేదు
  alternative: భాగముగానీ వారసత్వముగానీ లేదు
  rationale: ఇశ్రాయేలు మధ్య లేవీయునికి భూభాగ కేటాయింపు లేకపోవడాన్ని సూచించే రెండు మూలపదాల భేదాన్ని నిలుపుతుంది; ఒకే సాధారణ పదంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద ధర్మశాస్త్ర శైలి. మూలంలోని సమూహ జాబితా, కారణ వాక్యం, పురుష-స్త్రీ జంటలు నిలుపబడ్డాయి. ప్రధాన పాఠంలో హీబ్రూ నుడికారాన్ని సహజీకరించి, అక్షరార్థ రూపాన్ని [a] పాదటిప్పణిలో ఇచ్చాం.
