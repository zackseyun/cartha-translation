source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: te
  text: నీ దహనబలులను నీకు కనిపించిన ఏ స్థలంలోనైనా అర్పించకుండా జాగ్రత్తపడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దహనబలులను నీవు చూసే ప్రతి స్థలంలో అర్పించకుండా జాగ్రత్తపడు.”
    reason: בְּכָל מָקוֹם అనే పదబంధాన్ని ‘ఏ స్థలంలోనైనా’ లేదా మరింత అక్షరార్థంగా ‘ప్రతి స్థలంలో’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: నిఫల్ ఆజ్ఞార్థక రూపం, దత్తివ సర్వనామంతో కలిసి, హెచ్చరిక సూత్రంగా ‘నిన్ను నీవు కాపాడుకో’ లేదా ‘జాగ్రత్తగా ఉండు’ అనే భావాన్ని ఇస్తుంది. ‘జాగ్రత్తపడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: అర్పించకుండా
  rationale: פֶּן ప్రతికూల హెచ్చరికను ప్రవేశపెడుతుంది. తెలుగులో ‘అర్పించకుండా జాగ్రత్తపడు’ అనే నిర్మాణం నివారణాత్మక హెచ్చరికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּעֲלֶה
  choice: అర్పించు
  rationale: עלה హిఫిల్ రూపం అక్షరార్థంగా ‘పైకి ఎక్కించు’ అయినా, బలిపీఠంపై బలిని సమర్పించడాన్ని సూచించే ఆచార సంబంధ పదప్రయోగం. ‘అర్పించు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עֹלֹתֶיךָ
  choice: నీ దహనబలులను
  rationale: עֹלָה పూర్తిగా దహనం చేయబడే బలికి ప్రామాణిక పదం. ‘దహనబలి’ స్థిరమైన, అర్థవంతమైన తెలుగు ఆచార సంబంధ పదం.
- source_word: בְּכָל מָקוֹם
  choice: ఏ స్థలంలోనైనా
  rationale: ఈ సందర్భంలో כָל అనియంత్రితంగా ఎంచుకున్న ఏ స్థలాన్నైనా సూచిస్తుంది. ‘ఏ స్థలంలోనైనా’ నిషేధ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది; ‘ప్రతి స్థలంలో’ అనే అక్షరార్థ ప్రత్యామ్నాయం కూడా సాధ్యమే.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: నీకు కనిపించిన
  rationale: అక్షరార్థంగా ‘నీవు చూసే’ అని ఉంటుంది. ‘నీకు కనిపించిన’ దృష్టికి వచ్చిన లేదా స్వయంగా ఎంచుకున్న స్థలం అనే హీబ్రూ భావాన్ని అనవసర వివరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధనా కేంద్రీకరణ భాష
  choice: తనకు కనిపించిన ఏ స్థలంలోనైనా దహనబలులు అర్పించవద్దనే నిర్దిష్ట హెచ్చరికగా అనువదించబడింది.
  alternative: కేంద్ర పరిశుద్ధస్థలం వెలుపల జరిగే సమస్త ఆరాధనపై సాధారణ నిషేధంగా విస్తరించి అనువదించడం.
  rationale: సందర్భంలో కేంద్రీకృత ఆరాధన భావం ఉన్నప్పటికీ, ఈ వచనం ప్రత్యక్షంగా దహనబలులను స్వేచ్ఛగా ఎంచుకున్న స్థలాల్లో అర్పించడాన్నే ప్రస్తావిస్తుంది. కాబట్టి వచనంలో ఉన్నదానికంటే విస్తృతమైన సిద్ధాంత వాదనను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞా శైలి వాడబడింది. బలి సంబంధ పదజాలంలో ‘దహనబలి’, ‘అర్పించు’ అనే సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. హీబ్రూ హెచ్చరిక నిర్మాణం తెలుగులో సహజంగా ఉండేందుకు ప్రతికూల క్రియారూపం ప్రధాన ఆజ్ఞకు ముందు ఉంచబడింది.
