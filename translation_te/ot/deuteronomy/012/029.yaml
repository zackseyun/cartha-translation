id: DEU.12.29
reference: Deuteronomy 12:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే, నీవు వారిని తొలగించడానికి అక్కడికి వెళ్తున్న ఆ జనాంగాలను నీ ముందునుంచి తొలగించినప్పుడు, నీవు వారిని తొలగించి వారి దేశంలో నివసించినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: చేసినప్పుడు
  rationale: తర్వాతి వచనంలోని హెచ్చరికకు నేపథ్యంగా ఉండే భవిష్యత్ కాలసూచక పరిస్థితిని పరిచయం చేస్తుంది; అందువల్ల కారణార్థం కంటే కాలార్థం సహజం.
- source_word: יַכְרִית
  choice: తొలగించినప్పుడు
  rationale: హిఫిల్ రూపం ఇక్కడ ఇశ్రాయేలు ఎదుటనుంచి జనాంగాలను తొలగించడాన్ని సూచిస్తుంది. ‘నాశనం చేసినప్పుడు’ అని అనువదిస్తే మూలపాఠం కంటే సంపూర్ణ వినాశాన్ని ఎక్కువగా నిర్దిష్టం చేసే అవకాశం ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని సహజమైన తెలుగు నామవాచక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: הַגּוֹיִם
  choice: ఆ జనాంగాలను
  rationale: ఇక్కడ భూభాగంలో నివసిస్తున్న వేర్వేరు ప్రజాసమూహాలను సూచించడానికి ‘జనాంగాలు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: నీవు అక్కడికి వెళ్లి తొలగించబోతున్న ఆ జనాంగాలను
  rationale: ‘అక్కడికి వెళ్లడం’ అనే దిశాసూచనను నిలుపుతూ, ప్రజలను వారి స్థానం నుంచి తొలగించి ఆధీనంలోకి తీసుకునే ירש యొక్క సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ముందునుంచి
  rationale: ఇశ్రాయేలు మార్గం లేదా సన్నిధి నుంచి తొలగించడాన్ని సూచించే హీబ్రూ నుడికారానికి సమీపంగా ఉంది.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: నీవు వారిని తొలగించి
  rationale: కర్మ ప్రజలే కావడం వల్ల కేవలం ‘స్వాధీనం చేసుకొని’ అనడం వారినే ఆస్తిగా స్వాధీనం చేసుకున్నట్టు అపార్థం కలిగించవచ్చు; వారి స్థానం నుంచి తొలగించే భావాన్ని ఎంచుకుంది.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: వారి దేశంలో నివసించిన తర్వాత
  rationale: ישב యొక్క నివసించడం/స్థిరపడడం అనే భావాన్ని సహజంగా తెలుపుతుంది; ఈ ఉపవాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున ‘తర్వాత’ వాక్యసంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: జనాంగాలను ‘తొలగించడం’ యొక్క విస్తృతి
  choice: తొలగించడం
  alternative: నాశనం చేయడం
  rationale: כרת మరియు ఈ సందర్భంలోని ירש జనాంగాలను ఇశ్రాయేలు ఎదుటనుంచి తొలగించే భావాన్ని ఇస్తాయి; ఈ ఒక్క వచనం చెప్పినదానికంటే మించి సంపూర్ణ సంహారాన్ని నిర్బంధించకుండా ఉండేందుకు తటస్థమైన పదాన్ని వాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది 30వ వచనంలో కొనసాగే ఆధార ఉపవాక్యం కాబట్టి చివర కామా ఉంచబడింది. మూలంలోని ירש పునరుక్తిని సాధ్యమైనంతవరకు ‘తొలగించు’ అనే పునరుక్తితో నిలిపింది.
