  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: te
  text: 'అప్పుడు మీ దేవుడైన యెహోవా తన నామాన్ని అక్కడ నివసింపజేయడానికి ఎంచుకునే స్థలానికి మీరు, నేను మీకు ఆజ్ఞాపిస్తున్నవన్నీ తీసుకురావాలి: మీ దహనబలులు, మీ బలులు, మీ దశమభాగాలు, మీ చేతుల కానుకలు, అలాగే మీరు యెహోవాకు మొక్కుకునే మీ మొక్కుబడులలో ఉత్తమమైనవన్నీ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన నామాన్ని అక్కడ నివసింపచేయడానికి” అని మరింత సాక్షాత్తుగా అనువదించవచ్చు.
    reason: హీబ్రూ కారణార్థక క్రియకు మరింత సాక్షాత్తు ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు
  rationale: ముందటి ఆదేశాల తరువాత సంభవించే భవిష్యత్ పరిస్థితిని సహజమైన తెలుగు కథన సంధితో తెలియజేస్తుంది.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: ఎంచుకునే స్థలానికి
  rationale: ఎంచుకోబడే నిర్దిష్ట ఆరాధనా స్థలాన్ని, సందర్భంలోని భవిష్యత్ దృష్టిని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో సూచిస్తుంది.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: తన నామం అక్కడ నివసించేలా
  rationale: హిఫీల్ కారణార్థక భావాన్నీ, ద్వితీయోపదేశకాండంలోని ‘నామం నివసించడం’ అనే రూపకాన్నీ నిలుపుతుంది.
- source_word: שָׁמָּה תָבִיאוּ
  choice: స్థలానికి ... మీరు తీసుకురావాలి
  rationale: గమ్యదిశను తెలిపే שָׁמָּה భావాన్ని తెలుగులో స్థానవిభక్తితో సహజంగా వ్యక్తం చేస్తుంది; క్రియలోని ఆదేశ బలాన్ని ‘తీసుకురావాలి’ నిలుపుతుంది.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: నేను మీకు ఆజ్ఞాపిస్తున్నవన్నీ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ఆజ్ఞాపన భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: עוֹלֹתֵיכֶם
  choice: మీ దహనబలులు
  rationale: పూర్తిగా దహించబడే బలికి ప్రామాణికమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: זִבְחֵיכֶם
  choice: మీ బలులు
  rationale: ఒక నిర్దిష్ట బలి రకానికి పరిమితం చేయకుండా మూలపదపు విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: మీ దశమభాగాలు
  rationale: పదోవంతుగా సమర్పించేదాన్ని స్పష్టంగా తెలిపే సాధారణ తెలుగు రూపం.
- source_word: תְרֻמַת יֶדְכֶם
  choice: మీ చేతి అర్పణ
  rationale: హీబ్రూ భాషలోని ‘మీ చేతి’ అనే సాక్షాత్ నుడికారాన్ని ఉంచుతూ వ్యక్తిగతంగా సమర్పించే అర్పణ భావాన్ని అందిస్తుంది.
- source_word: כֹל מִבְחַר נִדְרֵיכֶם
  choice: మీ మొక్కుబడులలో శ్రేష్ఠమైనవన్నీ
  rationale: మూలంలో లేని ‘అర్పణలు’ అనే నామాన్ని చేర్చకుండా, ఎంపికైన లేదా శ్రేష్ఠమైన మొక్కుబడుల భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచింది. ఆధునిక తెలుగు పాఠకులకు ‘యెహోవా’ ఎక్కువగా గుర్తించదగిన లిప్యంతరీకరణ; ఇది ఉచ్చారణ పునర్నిర్మాణంపై తుది తీర్పు ఇవ్వదు.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם లోని ‘నామ నివాస’ భావం
  choice: తన నామం అక్కడ నివసించేలా
  alternative: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: దేవుని స్వరూపం ఒక ప్రదేశానికే పరిమితమని చెప్పకుండా, ఆయన నామాన్ని అక్కడ నివసింపజేయడం అనే మూలంలోని కారణార్థకతను మరియు వేదాంత ఉద్వేగాన్ని నిలుపుతుంది.
- issue: מִבְחַר נִדְרֵיכֶם యొక్క పరిధి
  choice: మీ మొక్కుబడులలో శ్రేష్ఠమైనవన్నీ
  alternative: మీ ఉత్తమ మొక్కుబడి అర్పణలన్నీ
  rationale: ‘అర్పణలు’ అనే పదం మూలంలో ప్రత్యక్షంగా లేదు; అందువల్ల మొక్కుబడుల స్వరూపాన్ని అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలి సంబంధ పదాలకు అవసరమైనంత మాత్రమె సాంకేతిక పదజాలం వాడబడింది. వాక్య నిర్మాణం హీబ్రూ జాబితా క్రమాన్ని నిలుపుతూ తెలుగులో సహజంగా మలచబడింది.
