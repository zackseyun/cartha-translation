  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: te
  text: కాని, యెహోవా నీ దేవుని సన్నిధిలో, యెహోవా నీ దేవుడు ఎంచుకునే స్థలంలో మాత్రమే దానిని తినాలి—నువ్వు, నీ కుమారుడు, నీ కుమార్తె, నీ దాసుడు, నీ దాసి, నీ పట్టణాల్లో నివసించే లేవీయుడు[a]—మరియు యెహోవా నీ దేవుని సన్నిధిలో నువ్వు చేపట్టే ప్రతి పనిలో[b] ఆనందించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ గుమ్మాల్లో ఉన్న లేవీయుడు.” ఇది నీ పట్టణం లేదా స్థానిక సమాజంలో నివసించేవారిని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “నీ చెయ్యి పంపబడే ప్రతిదానిలో”; అంటే, నువ్వు చేసే లేదా చేపట్టే ప్రతి పనిలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని ... మాత్రమే
  rationale: మునుపటి నిషేధానికి విరుద్ధంగా అనుమతించబడిన ఏకైక ప్రత్యామ్నాయాన్ని సూచించే నిర్బంధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: యెహోవా నీ దేవుని సన్నిధిలో
  rationale: లִפְנֵי లోని ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: תֹּאכְלֶנּוּ
  choice: దానిని తినాలి
  rationale: రెండవ పురుష ఏకవచన ఆదేశ భావాన్నీ, ముందు వచనంలో పేర్కొన్న వస్తువును సూచించే ఏకవచన ప్రత్యయాన్నీ నిలుపుతుంది.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: యెహోవా నీ దేవుడు ఎంచుకునే స్థలంలో
  rationale: ద్వితీయోపదేశకాండంలోని ఎంపిక చేయబడే ఆరాధనా స్థలానికి సంబంధించిన సూత్రప్రాయ భాషను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: నువ్వు, నీ కుమారుడు, నీ కుమార్తె, నీ దాసుడు, నీ దాసి
  rationale: గృహకేంద్రిత జాబితాను, పురుష-స్త్రీ సేవకుల భేదాన్ని, ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో నివసించే లేవీయుడు
  rationale: ‘నీ గుమ్మాల్లో’ అనే హీబ్రూ పౌరసంబంధ నుడికారాన్ని సాధారణ పాఠకుడికి స్పష్టమైన స్థానిక సమాజ భావంతో అనువదిస్తుంది.
- source_word: וְשָׂמַחְתָּ
  choice: ఆనందించాలి
  rationale: ఒడంబడిక ఆరాధనలోని ఉత్సవపూర్వక ఆనందాన్ని తెలుగులో సహజమైన ఆదేశ రూపంలో తెలియజేస్తుంది.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: మీరు చేపట్టే ప్రతి పనిలో
  rationale: అక్షరార్థంగా ‘నీ చెయ్యి పంపబడే ప్రతిదానిలో’ అనే నుడికారానికి పనులు/ప్రయత్నాలు అనే సందర్భోచిత అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది; ‘యెహోవా’ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం.
- issue: ఏకవచన సంబోధన నుంచి సమూహాన్ని సూచించే క్రియకు మార్పు
  choice: మొదట ‘నువ్వు’; జాబితా అనంతరం ‘మీరు ... ఆనందించాలి’
  alternative: అంతటా ‘నువ్వు ... ఆనందించాలి’
  rationale: హీబ్రూలో క్రియ వ్యాకరణపరంగా ఏకవచనమైనా, ఆనందంలో కుమారుడు, కుమార్తె, సేవకులు, లేవీయుడు అందరూ భాగస్వాములని సందర్భం సూచిస్తుంది. తెలుగు వాక్యంలో సమూహ భావం స్పష్టంగా ఉండేందుకు బహువచనం వాడబడింది; దీనితో ఆజ్ఞ మొదట సంబోధించబడిన వ్యక్తిపై ఉండే భావం తొలగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని ఏకవచన ‘నీ’ సంబోధనను ప్రధానంగా నిలిపి, జాబితాలోని అందరి సంయుక్త ఆనందాన్ని చివరి ఖండంలో సహజమైన బహువచనంతో వ్యక్తం చేసింది. ‘దాసుడు/దాసి’ మూలంలోని సామాజిక స్థితి మరియు లింగభేదాన్ని మృదువుగా మార్చకుండా తెలిపే పదాలు.
