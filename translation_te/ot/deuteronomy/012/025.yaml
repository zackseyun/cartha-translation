revisions:
- from: నీవు దానిని తినకూడదు. అప్పుడు నీవు యెహోవా దృష్టిలో సరైనదాన్ని చేసినందువల్ల, నీకూ నీ తరువాత నీ పిల్లలకూ[a] మేలు కలుగుతుంది.
  to: నీకూ నీ తరువాత నీ పిల్లలకూ[a] మేలు కలగునట్లు నీవు దానిని తినకూడదు; ఎందుకంటే నీవు యాహ్వే దృష్టిలో సరైనది చేస్తావు.
  rationale: The revision restores the purpose force of לְמַעַן, retains the future/expected sense of תַעֲשֶׂה, and changes the divine name to ‘యాహ్వే’ in accordance with the POB audit trail. The footnote remains anchored to ‘పిల్లలకూ’ and preserves the possible narrower ‘sons’ and broader ‘descendants’ senses without imposing either.
  reviewer_model: gpt-5.6-terra
