id: DEU.12.25
reference: Deuteronomy 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: te
  text: నీకూ నీ తరువాత నీ పిల్లలకూ[a] మేలు కలగునట్లు నీవు దానిని తినకూడదు; ఎందుకంటే నీవు యాహ్వే దృష్టిలో సరైనది చేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ తరువాత నీ కుమారులకు’; విస్తృతార్థంలో, ‘నీ తరువాతి సంతానానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: దానిని తినకూడదు
  rationale: אָכַל అంటే ‘తినడం’; 3 పుం. ఏక. ప్రత్యయం సమీప సందర్భంలోని రక్తాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘దానిని’ ఆ ప్రత్యక్ష కర్మను సహజంగా నిలుపుతుంది.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: అప్పుడు ... నీకు ... మేలు కలుగుతుంది
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది; יִיטַב לְךָ అనే ద్వితీయోపదేశకాండపు నిబంధనాత్మక నుడికారాన్ని కేవలం భౌతిక సంపదకు పరిమితం చేయకుండా ‘మేలు కలుగుతుంది’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: నీ తరువాత నీ పిల్లలకూ
  rationale: בָּנִים అక్షరార్థంగా ‘కుమారులు’ అయినా, ఈ నిబంధనాత్మక సందర్భంలో సంతానాన్ని విస్తృతంగా సూచించగలదు. ‘పిల్లలు’ కుటుంబ సంబంధాన్ని నిలుపుతూ అనవసరంగా మగవారికే పరిమితం చేయదు.
- source_word: כִּי תַעֲשֶׂה
  choice: నీవు ... చేసినందువల్ల
  rationale: כִּי ఇక్కడ వాగ్దానం చేసిన మేలుకు విధేయతను ఆధారంగా చూపుతుంది. హీబ్రూ అసంపూర్ణ క్రియ భవిష్యత్/ఆశించిన విధేయతను సూచించినప్పటికీ, తెలుగు కారణార్థ నిర్మాణం సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַיָּשָׁר
  choice: సరైనదాన్ని
  rationale: יָשָׁר అంటే నిటారైనది, యథార్థమైనది, సరైనది. ‘సరైనదాన్ని’ ఆధునిక సాధారణ తెలుగులో నైతిక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: ‘కళ్లలో’ అనే హీబ్రూ రూపకానికి సహజమైన తెలుగు సమానార్థ నుడికారం ‘దృష్టిలో’; ఇది దేవుని మూల్యాంకన భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిలిపి చేశాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో సుపరిచితమైన ప్రతిలిపి ‘యెహోవా’; ఇది ‘ప్రభువు’ వంటి బిరుదుతో నామాన్ని భర్తీ చేయదు. ఉచ్చారణ పునర్నిర్మాణానికి దగ్గరైన ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: בָנֶיךָ యొక్క పరిధి
  choice: పిల్లలు
  alternative: కుమారులు; సంతానం
  rationale: రూపం వ్యాకరణపరంగా పుంలింగ బహువచనం అయినప్పటికీ, నిబంధనాత్మక సందర్భంలో తరువాతి తరాలను ప్రతినిధిగా సూచించగలదు. ‘పిల్లలు’ కుటుంబపరమైన సమీపతను నిలుపుతుంది; అసలు పదంలోని సాధ్యమైన నిర్దిష్ట/విస్తృత పరిధిని పాదసూచిక తెలియజేస్తుంది.
- issue: మేలు మరియు విధేయత మధ్య సంబంధం
  choice: చేసినందువల్ల
  alternative: చేస్తే; ఎందుకంటే నీవు చేస్తావు
  rationale: כִּי వాగ్దానం చేసిన మేలును సరైనది చేయడంతో అనుసంధానిస్తుంది. ‘చేసినందువల్ల’ కారణ సంబంధాన్ని చూపుతుంది; దానిని సంపాదనాధారిత రక్షణ సిద్ధాంతంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే రీతిని అనుసరించాం. ఏకవచన సంబోధనను ‘నీవు’గా నిలిపాం. మూలంలోని ఉద్దేశం/ఫలితం మరియు కారణ సంబంధాలను తెలుగు సహజ వాక్యక్రమంలో వ్యక్తం చేశాం.
