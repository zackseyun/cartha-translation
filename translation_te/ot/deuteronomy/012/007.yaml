id: DEU.12.7
reference: Deuteronomy 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: te
  text: అక్కడ మీరు మీ దేవుడైన యెహోవా సన్నిధిలో తిని, నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదించిన మీ చేతిపనులన్నిటిలో[a]—మీరు, మీ ఇంటివారు—సంతోషించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ ప్రయత్నాలన్నిటిలో,” లేక “మీరు చేయడానికి పూనుకున్న ప్రతిదానిలో.” హీబ్రూ నుడికారానికి అక్షరార్థం “మీ చేతిని పంపే ప్రతిదానిలో.”
    reason: మִשְׁלַח יָד అనే హీబ్రూ నుడికారానికి ఉన్న అక్షరార్థ చిత్రాన్నీ, సాధ్యమైన సహజార్థాలనూ తెలియజేయడానికి.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: తిని ... సంతోషించాలి
  rationale: న్యాయబోధ సందర్భంలోని ఆజ్ఞాత్మక భావాన్ని తెలుగులో సహజమైన సంయుక్త నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: చుట్టుపక్కల వచనాల్లో యెహోవా ఎన్నుకోబోయే స్థలాన్ని సూచించే దూరదర్శక పదాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనే పదంలోని దేవుని సమక్షంలో ఆరాధనాభోజనం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; יְהוָהను వ్యక్తిగత నామమైన ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: וּשְׂמַחְתֶּם
  choice: సంతోషించాలి
  rationale: ముందున్న క్రియతో సమాంతరంగా ఆదేశాత్మక భావాన్ని, అలాగే నిబంధన సంబంధమైన ఆనందాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁלַח יֶדְכֶם
  choice: మీ చేతులు చేపట్టిన పనులన్నిటిలో
  rationale: అక్షరార్థంలోని ‘చేతిని చాపడం/పంపడం’ అనే చిత్రాన్ని కొంత నిలుపుతూ, వ్యక్తి చేపట్టే పనులు లేదా ప్రయత్నాలు అనే హీబ్రూ నుడికారార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: మీరు, మీ ఇంటివారు
  rationale: בָּתִּים ఇక్కడ భవనాలను కాక గృహసభ్యులను సూచిస్తుంది; ‘ఇంటివారు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: వాటితో నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదించాడు
  rationale: సాపేక్ష వాక్యాన్ని పనులు/ప్రయత్నాలతో అనుసంధానిస్తూ, మూలంలోని చివరి ఏకవచన సంబోధనను సమతలీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యం పొందిన లిప్యంతరీకరణతో ఇస్తుంది.
- issue: బహువచన సంబోధన నుండి ఏకవచన సంబోధనకు మార్పు
  choice: మొదట ‘మీరు/మీ’, చివర ‘నీ/నిన్ను’ అని మూలంలోని మార్పును నిలుపడం
  alternative: అన్నింటినీ బహువచనంగా ‘మీరు/మిమ్మల్ని’ చేయడం
  rationale: ద్వితీయోపదేశకాండంలో ఇశ్రాయేలును సమూహంగానూ ఏకక సమాజంగానూ సంబోధించే ఉద్దేశపూర్వక వాక్చాతుర్యాన్ని చెరపకుండా ఉంచుతుంది.
- issue: אֲשֶׁר సాపేక్ష వాక్యపు సంబంధం
  choice: ‘వాటితో ... ఆశీర్వదించాడు’ అని పనులు/ప్రయత్నాలకు అనుసంధానం
  alternative: ‘యెహోవా నిన్ను ఆశీర్వదించాడు గనుక’ అనే కారణార్థం
  rationale: హీబ్రూ నిర్మాణంలోని సాపేక్ష సంబంధాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; కారణార్థంగా స్పష్టీకరించడం మూలంలోని కొంత అస్పష్టతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవభరిత శైలిలో రూపొందించబడింది. ‘తిని’ అనే సరళ క్రియ బలి అర్పణలతో కూడిన సామూహిక భోజనాన్ని అనవసరంగా విస్తరించకుండా వ్యక్తం చేస్తుంది. విరామచిహ్నాలు ‘మీరు, మీ ఇంటివారు’ అనే చొప్పింపును స్పష్టంగా చూపిస్తాయి.
