  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: te
  text: మీ దేవుడైన యాహ్వేకు మీరు అలా చేయకూడదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అలా’ అనే మాట, అన్యజనుల ఆరాధనా స్థలాలను ఎలా ధ్వంసం చేయాలో ముందు ఇచ్చిన ఆజ్ఞలను సూచిస్తుంది; ఇశ్రాయేలీయులు యాహ్వే విషయంలో ఆ విధంగా చేయకూడదు.
    reason: cross_reference
  - marker: b
    text: హీబ్రూలో YHWH అనే దైవనామం ఉంది; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: మీరు ... చేయకూడదు
  rationale: నిషేధార్థక לֹא తో కూడిన Qal అపూర్ణక్రియ ద్వితీయ పురుష బహువచనం ధర్మశాస్త్ర సందర్భంలో నేరమైన నిషేధాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘చేయకూడదు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כֵּן
  choice: అలా
  rationale: ఇది ముందటి వచనాల్లో అన్యజనుల ఆరాధనా స్థలాలను ధ్వంసం చేసే విధానాన్ని వెనక్కి సూచిస్తుంది. ‘అలా’ అనే పదం ఆ సూచనను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ సంబంధం లేదా దిశను సూచిస్తుంది; తెలుగులో ‘-కు’ సహజమైన సమానార్థకం. יהוה అనే దైవనామాన్ని ప్రధాన పాఠ్యంలో ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: ద్వితీయ పురుష బహువచన ప్రత్యయంతో ఉన్న రూపం నిబంధన సంబంధాన్ని తెలియజేస్తుంది. ‘మీ దేవుడైన యెహోవా’ అనేది సహజమైన తెలుగు నిర్మాణం; మూలంలోని భావాన్నంతటినీ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో తెలిపాం.
- issue: సందర్భంలో నిషేధం దేనిని సూచిస్తుంది
  choice: ముందు చెప్పిన విధంగా యెహోవాకు చేయవద్దనే సంక్షిప్త నిషేధం
  alternative: యెహోవా ఆరాధనా వస్తువులను ధ్వంసం చేయవద్దనే భావాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా విప్పి చెప్పడం
  rationale: כֵּן (‘అలా’) ముందరి సందర్భంపై ఆధారపడే ఉద్దేశపూర్వక సంక్షిప్తతను కలిగి ఉంది. ఆ అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భ సంబంధాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ద్వితీయ పురుష బహువచనాన్ని ‘మీరు/మీ’తో స్పష్టంగా నిలిపాం; మూలంలోని సందర్భాధారిత ‘అలా’ అనే సంక్షిప్తతను విస్తరించలేదు.
