  text: וְ/נִתַּצְתֶּ֣ם אֶת מִזְבּחֹתָ֗/ם וְ/שִׁבַּרְתֶּם֙ אֶת מַצֵּ֣בֹתָ֔/ם וַ/אֲשֵֽׁרֵי/הֶם֙ תִּשְׂרְפ֣וּ/ן בָּ/אֵ֔שׁ וּ/פְסִילֵ֥י אֱלֹֽהֵי/הֶ֖ם תְּגַדֵּע֑וּ/ן וְ/אִבַּדְתֶּ֣ם אֶת שְׁמָ֔/ם מִן הַ/מָּק֖וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: te
  text: మీరు వారి బలిపీఠాలను కూలదోయాలి, వారి పూజా స్తంభాలను పగలగొట్టాలి, వారి అషేరా స్తంభాలను[a] అగ్నితో కాల్చివేయాలి, వారి దేవుళ్ల చెక్కిన ప్రతిమలను[b] నరికివేయాలి, ఆ స్థలం నుండి వారి పేరును తుడిచివేయాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి అషేరీము,’ లేదా ‘వారి పవిత్ర కర్రలు.’ హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి విగ్రహాలను.’ ‘వారి దేవుళ్ల చెక్కిన ప్రతిమలు’ అనే హీబ్రూ పదబంధం ఈ ఆరాధనా వస్తువులు మలచి తయారుచేయబడినవని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘వారి పేరును తుడిచివేయడం’ అంటే ఆ ఆరాధనా స్థలం నుండి వారి జ్ఞాపక ఉనికిని, స్మరణను తొలగించడం.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם
  choice: కూలదోయాలి
  rationale: నిర్మాణాలను పూర్తిగా పడగొట్టడం అనే נתץ క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִזְבּחֹתָם
  choice: వారి బలిపీఠాలను
  rationale: מִזְבֵּחַకు ప్రామాణికమైన, సాధారణ పాఠకులకు స్పష్టమైన తెలుగు పదం.
- source_word: שִׁבַּרְתֶּם
  choice: పగలగొట్టాలి
  rationale: ఈ క్రియారూపంలోని బలమైన, ధ్వంసకర చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַצֵּבֹתָם
  choice: వారి పూజా స్తంభాలను
  rationale: మַצֵּבָה అనేది ఆరాధనలో ఉపయోగించిన నిలువురాయి లేదా స్తంభం; ‘పూజా స్తంభాలు’ వస్తువును, దాని మతపరమైన విధిని రెండింటినీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֲשֵׁרֵיהֶם
  choice: వారి అషేరా స్తంభాలను
  rationale: అషేరాతో సంబంధమున్న ప్రత్యేక ఆరాధనా వస్తువులను సూచిస్తుంది; సాధారణ ‘తోపులు’గా మార్చకుండా మూలంలోని సాంస్కృతిక ప్రత్యేకతను నిలుపుతుంది.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: అగ్నితో కాల్చివేయాలి
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘అగ్నితో’ అనే సాధనార్థక భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: వారి దేవుళ్ల చెక్కిన ప్రతిమలను
  rationale: ‘విగ్రహాలు’ అనే విస్తృత వ్యాఖ్యాత్మక పదం బదులు, పֶּסֶלలోని చెక్కి తయారుచేసిన రూపం అనే భౌతిక భావాన్ని కాపాడుతుంది.
- source_word: תְּגַדֵּעוּן
  choice: నరికివేయాలి
  rationale: גדעలోని నరికి తొలగించే చర్యను తెలియజేస్తుంది; ఇక్కడ ఆరాధనా వస్తువుల ధ్వంసానికి సరిపోతుంది.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: వారి పేరును తుడిచివేయాలి
  rationale: ఆ స్థలంలో వారి జ్ఞాపకాన్ని, ఆరాధనా ఉనికిని పూర్తిగా తొలగించాలనే హీబ్రూ నుడికారాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: ఆ స్థలం నుండి
  rationale: మూలంలోని స్థానవాచక పదబంధానికి నేరుగా, సహజంగా సరిపోతుంది.
theological_decisions:
- issue: אֲשֵׁרֵיהֶם అనే కనానీయ ఆరాధనా పదం అర్థం
  choice: అషేరా స్తంభాలు
  alternative: అషేరీము; పవిత్ర కర్రలు
  rationale: ఈ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది. ‘అషేరా స్తంభాలు’ వాటిని దేవతతో పూర్తిగా సమానీకరించకుండా, ప్రత్యేక మతపరమైన నేపథ్యాన్ని నిలుపుతుంది.
- issue: פְסִילֵי אֱלֹהֵיהֶם అనువాదం
  choice: వారి దేవుళ్ల చెక్కిన ప్రతిమలు
  alternative: వారి విగ్రహాలు
  rationale: మూలం తయారుచేయబడిన, ముఖ్యంగా చెక్కబడిన ఆరాధనా రూపాలను ముందుకు తెస్తుంది; అందువల్ల సాధారణమైన ‘విగ్రహాలు’ కంటే ఈ రూపం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ‘వారి పేరును తుడిచివేయాలి’ అనే నుడికారం
  choice: ఆ ఆరాధనా స్థలం నుండి వారి జ్ఞాపక ఉనికిని తొలగించడం అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: వారి దేవుళ్ల ప్రతిష్ఠను నాశనం చేయాలి; వ్రాసిన పేర్లను మాత్రమే తొలగించాలి
  rationale: ‘పేరు’ ఇక్కడ జ్ఞాపకం, పిలుపు, ఆరాధనా ఉనికిని సూచించగలదు. మూలంలోని సంక్షిప్తతనూ భావ విస్తృతినీ నిలుపుతూ వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ఆజ్ఞారూప శైలిని వాడాం. వరుసగా ఉన్న హీబ్రూ క్రియల బలాన్ని నిలుపుతూ ‘కూలదోయాలి,’ ‘పగలగొట్టాలి,’ ‘కాల్చివేయాలి,’ ‘నరికివేయాలి,’ ‘తుడిచివేయాలి’ అనే సమాంతర నిర్మాణాన్ని పాటించాం.
