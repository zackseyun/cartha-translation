id: DEU.12.23
reference: Deuteronomy 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: te
  text: కానీ రక్తాన్ని తినకుండా ఉండే విషయంలో మాత్రం దృఢంగా జాగ్రత్తపడు. ఎందుకంటే రక్తమే ప్రాణం[a]; మాంసంతో పాటు ప్రాణాన్ని తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నֶפֶשׁ పదం వచ్చిన రెండు చోట్లా ‘ఆత్మ’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది జీవి యొక్క జీవాన్ని సూచిస్తుంది; అందుకే అనేక అనువాదాలు దాన్ని ‘ప్రాణం’ లేదా ‘జీవం’ అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందు ఇచ్చిన మాంసం తినే అనుమతికి బలమైన మినహాయింపును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: తినకుండా ఉండడానికి గట్టిగా జాగ్రత్తపడాలి
  rationale: అక్షరార్థమైన ‘బలంగా ఉండు’ కంటే, ఈ హీబ్రూ ప్రయోగంలోని దృఢమైన హెచ్చరికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַדָּם
  choice: రక్తం
  rationale: సూటిగా అర్థాన్ని ఇస్తుంది; వాక్యంలోని పునరావృత భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: הַנָּפֶשׁ
  choice: ప్రాణం
  rationale: ఈ ఆహార నియమ సందర్భంలో נֶפֶשׁ జీవికి జీవం కలిగించే ప్రాణాన్ని సూచిస్తుంది; దేహానికి వేరైన తాత్త్విక ‘ఆత్మ’ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: וְלֹא תֹאכַל
  choice: తినకూడదు
  rationale: న్యాయపరమైన ఆదేశంలోని నిషేధ బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: మాంసంతో పాటు ప్రాణాన్ని
  rationale: రక్తం జీవి ప్రాణమనే ముందరి వాక్యభాగంతో ఉన్న పదసంబంధాన్ని, అలాగే హీబ్రూ వాక్యంలోని స్పష్టమైన దృశ్యరూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఆహార నియమ సందర్భంలో נֶפֶשׁ అర్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ వాక్యం రక్త నిషేధాన్ని రక్తమే జీవి ప్రాణమని చెప్పి వివరిస్తుంది. ‘ఆత్మ’ అని అనువదిస్తే హీబ్రూ తప్పనిసరిగా చెప్పని దేహం–ఆత్మ ద్వైత భావం కలగవచ్చు; ‘ప్రాణం’ వాక్య తర్కాన్నీ నిజమైన పదార్థ పరిధినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ధర్మశాస్త్ర ఆదేశానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ‘ప్రాణం’–‘మాంసం’ వ్యత్యాసం మరియు నిషేధ బలం నిలుపబడ్డాయి.
