revisions:
- from: అయితే రక్తాన్ని తినకుండా ఉండడానికి గట్టిగా జాగ్రత్తపడాలి[a]. ఎందుకంటే రక్తమే ప్రాణం; మాంసంతో పాటు ప్రాణాన్ని తినకూడదు.
