id: DEU.12.6
reference: Deuteronomy 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: te
  text: అక్కడికి మీరు మీ దహనబలులను, మీ బలులను, మీ దశమభాగాలను, మీ చేతులతో సమర్పించే కానుకను[a], మీ మొక్కుబడి అర్పణలను[b], మీ స్వచ్ఛంద అర్పణలను, మీ పశువులకూ మీ మందలకూ చెందిన తొలిచూలు పిల్లలను తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, ‘మీ చేతి కానుక.’ అంటే మీరు స్వయంగా సమర్పించే కానుక.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ మొక్కులను’; ఈ బలుల జాబితాలో మొక్కులను నెరవేర్చడానికి ఇచ్చే అర్పణలు ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: తీసుకురావాలి
  rationale: హిఫీల్ రూపం నిర్దేశాత్మక సందర్భంలో వస్తువులను నిర్ణయించిన స్థలానికి తీసుకురావడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తీసుకురావాలి’ సహజమైన విధినిర్దేశం.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: మునుపటి వచనంలో పేర్కొన్న ఆరాధనా స్థలాన్ని సూచించే దిశార్థక అవ్యయ భావాన్ని ‘అక్కడికి’ స్పష్టంగా నిలుపుతుంది.
- source_word: עֹלֹתֵיכֶם
  choice: మీ దహనబలులను
  rationale: עוֹלָה పూర్తిగా దహనం చేసే బలికి వాడే ప్రామాణిక బలిసంబంధ పదం; ‘దహనబలి’ తెలుగులో స్పష్టమైన సాంకేతిక సమానం.
- source_word: זִבְחֵיכֶם
  choice: మీ బలులను
  rationale: זֶבַח దహనబలికి భిన్నంగా వధించి అర్పించే బలుల విస్తృత వర్గాన్ని సూచిస్తుంది; ‘బలులు’ అనవసరంగా అర్థాన్ని సంకుచితం చేయదు.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: మీ దశమభాగాలను
  rationale: పదం పదోవంతుగా ఇచ్చే అర్పణలను సూచిస్తుంది; ‘దశమభాగాలు’ సాధారణ ఆధునిక పాఠకునికి అర్థమయ్యే రూపం.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: మీ చేతి అర్పణను
  rationale: תְּרוּמָה వేరుగా ఉంచి సమర్పించే కానుకను సూచిస్తుంది; ‘చేతి’ అనే మూలభాషా ప్రతిమను నిలిపి, వ్యక్తిగతంగా సమర్పించే భావాన్ని కాపాడుతుంది.
- source_word: נִדְרֵיכֶם
  choice: మీ మొక్కుబడి అర్పణలను
  rationale: బలుల జాబితాలో ఇది పలికిన మొక్కులకన్నా వాటిని నెరవేర్చేందుకు తెచ్చే అర్పణలను సందర్భానుసారంగా సూచిస్తుంది; మూలంలోని సంక్షిప్తతను పాదసూచికలో తెలియజేస్తుంది.
- source_word: נִדְבֹתֵיכֶם
  choice: మీ స్వచ్ఛంద అర్పణలను
  rationale: మొక్కుబడి కారణంగా కాక స్వచ్ఛందంగా ఇచ్చే అర్పణలను స్పష్టంగా సూచించి, ముందున్న మొక్కుబడి అర్పణలతో తేడాను నిలుపుతుంది.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: మీ పశువులలోను మందలలోను తొలిచూలు పిల్లలను
  rationale: בקר పెద్ద పశువులను, צאן గొర్రెలు-మేకల చిన్న పశుమందలను సూచించే జంట; ‘తొలిచూలు పిల్లలు’ జంతువుల firstborn భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: נִדְרֵיכֶם అనే పదం పలికిన మొక్కులనా, వాటికి సంబంధించిన అర్పణలనా?
  choice: మొక్కుబడి అర్పణలు
  alternative: మీ మొక్కులు
  rationale: ఇది తీసుకురావలసిన బలులు, కానుకల జాబితాలో ఉన్నందున మొక్కులను నెరవేర్చే అర్పణల భావం సందర్భానికి సరిపోతుంది; అయినా హెబ్రీ పదం అక్షరార్థంగా ‘మీ మొక్కులు’ కావచ్చనే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలిసంబంధ సాంకేతిక పదాలకు స్థిరమైన తెలుగు రూపాలు వాడి, హెబ్రీలోని ‘చేతి’ ప్రతిమను నిలిపాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
