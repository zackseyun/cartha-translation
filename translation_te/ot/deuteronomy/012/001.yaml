id: DEU.12.1
reference: Deuteronomy 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: te
  text: మీ పితరుల దేవుడైన యెహోవా నీకు స్వాధీనం చేసుకోవడానికి ఇచ్చిన దేశంలో, మీరు ఈ భూమిమీద జీవించి ఉన్న రోజులన్నిటిలో జాగ్రత్తగా పాటించవలసిన కట్టడలూ న్యాయవిధులూ ఇవే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֻקִּים
  choice: కట్టడలు
  rationale: న్యాయపరమైన స్థిర ఆదేశాల భావాన్ని తెలియజేస్తూ, తరువాతి מִשְׁפָּטִיםతో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: וְהַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: చట్టపరమైన తీర్పులు లేదా అమలు చేయవలసిన నియమాల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: మీరు జాగ్రత్తగా పాటించవలసిన
  rationale: שׁמר + עשה అనే ప్రయోగంలోని శ్రద్ధతో గమనించడం, ఆచరణలో పెట్టడం అనే రెండు అంశాలనూ సంక్షిప్తంగా అందిస్తుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో వాగ్దాన దేశాన్ని సూచించే ప్రాదేశిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: మీ పితరుల దేవుడు
  rationale: నిబంధనాత్మక సూత్రవాక్యాన్ని గౌరవప్రదంగా నిలుపుతూ, సందర్భంలోని సమూహ సంబోధనకు సహజమైన తెలుగును ఉపయోగిస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ ఇక్కడ సూచించే దేశాన్ని పొందడం, తన ఆధీనంలో ఉంచుకోవడం అనే క్రియాశీల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: మీరు ... జీవించే రోజులన్నిటిలో
  rationale: కాలవ్యాప్తిని, బహువచన సంబోధనను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: עַל הָאֲדָמָה
  choice: ఈ భూమిమీద
  rationale: ముందున్న בָּאָרֶץ ‘దేశంలో’ అనే పదంతో భేదాన్ని నిలుపుతూ, జీవించే కాలమంతటినీ సూచించే విస్తృత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: ירשׁ యొక్క దేశసంబంధ భావం
  choice: స్వాధీనం చేసుకోవడానికి
  alternative: వారసత్వంగా పొందడానికి
  rationale: ఈ సందర్భంలో క్రియ దేశాన్ని వాస్తవంగా పొందడం, ఆక్రమించుకొని ఉంచుకోవడం అనే భావాన్ని కలిగి ఉంది; ‘వారసత్వం’ మాత్రమే అనడం దాని క్రియాశీల ఒత్తిడిని తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని పాటించాం. హీబ్రూలో ‘నీ పితరుల దేవుడు ... నీకు’ అని ఏకవచనం, తరువాత ‘మీరు జీవించే’ అని బహువచనం మారుతుంది; తెలుగులో అసహజత రాకుండా సమూహ సంబోధనగా ‘మీ’ రూపం వాడినా, వాక్యం ఇశ్రాయేలు సమాజాన్ని ఉద్దేశిస్తుందనే భావం నిలిచింది.
