source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: te
  text: అయితే నీ మనసు కోరినప్పుడల్లా[a], నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన ఆశీర్వాదానికి అనుగుణంగా, నీ పట్టణాల్లో ఎక్కడైనా[b] జంతువును వధించి మాంసం తినవచ్చు. అపవిత్రులూ పవిత్రులూ దానిని తినవచ్చు[c]—దుప్పిని గానీ జింకను గానీ తిన్నట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారానికి అక్షరార్థం: “నీ ప్రాణపు కోరిక అంతటినిబట్టి”; అంటే, నీకు కావాలనిపించినప్పుడల్లా.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “నీ గుమ్మాలన్నిటిలో.” ఇక్కడ “గుమ్మాలు” పట్టణాలు లేదా నివాస ప్రాంతాలను సూచించే నుడికారం.
    reason: cultural_note
  - marker: c
    text: “అపవిత్రులు,” “పవిత్రులు” అనే మాటలు ఇక్కడ నైతిక స్వభావాన్ని కాక ఆచారపరమైన శుద్ధి స్థితిని సూచిస్తాయి.
    reason: theological_clarity
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందున్న ఆజ్ఞకు పరిమితి లేదా మినహాయింపును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: నీ మనసు కోరినప్పుడల్లా
  rationale: అక్షరార్థంగా ‘నీ ప్రాణపు కోరిక అంతటిలో’; נֶפֶשׁ ఇక్కడ వ్యక్తి కోరికను సూచించే హీబ్రూ నుడికారం. సహజమైన తెలుగులో భావాన్ని నిలిపింది.
- source_word: תִּזְבַּח
  choice: జంతువును వధించి
  rationale: ఆహారం కోసం జంతువును చంపడాన్ని సూచిస్తుంది. సందర్భంలో ఇది ఆజ్ఞకన్నా అనుమతి; అందువల్ల ‘తినవచ్చు’తో కలిపి అనుమతి భావం స్పష్టమవుతుంది.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: మాంసం తినవచ్చు
  rationale: בָשָׂר ఇక్కడ ఆహారమైన జంతు మాంసాన్ని సూచిస్తుంది.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన ఆశీర్వాదానికి అనుగుణంగా
  rationale: సమానతను తెలిపే כְּను, ‘ఆశీర్వాదం’ అనే నామవాచకాన్ని నిలుపుతూ, దేవుడు ఇచ్చిన సమృద్ధికి తగిన విధంగా అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ ఒడంబడిక నామమైన చతురక్షర నామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో ఎక్కడైనా
  rationale: అక్షరార్థంగా ‘నీ గుమ్మాలన్నిటిలో’; ‘గుమ్మాలు’ ఇక్కడ పట్టణాలు లేదా నివాస ప్రాంతాలకు హీబ్రూ నుడికారం. తెలుగులో ఉద్దేశిత అర్థాన్ని నేరుగా తెలిపింది.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: అపవిత్రుడూ పవిత్రుడూ
  rationale: ఇది నైతిక స్వభావాన్ని కాక ఆచారపరమైన స్థితిని సూచిస్తుంది; రెండు వర్గాలవారికీ సమాన అనుమతి ఉందనే సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: יֹאכְלֶנּוּ
  choice: దానిని తినవచ్చు
  rationale: సందర్భంలో అనుమతిని వ్యక్తం చేస్తుంది; ‘దానిని’ అనే సర్వనామం వధించిన జంతువు మాంసాన్ని సూచిస్తుంది.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: జింకను, దుప్పిని తిన్నట్లే
  rationale: బలి అర్పణగా కాక సాధారణంగా తినదగిన అడవి జంతువులతో పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూలోని రెండు ఉదాహరణలనూ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ హీబ్రూ నామాన్ని బిరుదుగా మార్చకుండా, ‘యెహోవా’ అనే తరువాతి రూపానికి వెళ్లకుండా నిలుపుతుంది.
- issue: ‘అపవిత్రుడు, పవిత్రుడు’ అనే పదాల పరిధి
  choice: ఆచారపరమైన స్థితిని సూచించే పదాలుగా అనువదించడం
  alternative: నైతికంగా చెడ్డవాడు, మంచివాడు
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో ఈ భేదం ఆచారపరమైన శుద్ధి స్థితికి సంబంధించినది; నైతిక తీర్పును పాఠ్యంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా రూపొందించబడింది. హీబ్రూ నుడికారాలను ప్రధాన పాఠ్యంలో సహజీకరించి, అక్షరార్థాలను పాదసూచికల్లో ఇచ్చాం. ఏకవచన సంబోధనను ‘నీ’ రూపంతో నిలిపాం; అనుమతి భావాన్ని ‘తినవచ్చు’ ద్వారా వ్యక్తం చేశాం.
