revisions:
- from: వారు మీ ఎదుట నుండి నాశనం చేయబడిన తర్వాత, వారి వెంట వెళ్లి ఉచ్చులో చిక్కుకోకుండా జాగ్రత్తపడండి. “ఈ జనాలు తమ దేవుళ్లను ఎలా పూజించేవారు? నేనూ అలాగే చేస్తాను” అని అంటూ వారి దేవుళ్ల గురించి విచారించకుండా జాగ్రత్తపడండి.
