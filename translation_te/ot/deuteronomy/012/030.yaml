id: DEU.12.30
reference: Deuteronomy 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּנָּקֵשׁ֙ אַחֲרֵי/הֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣/ם מִ/פָּנֶ֑י/ךָ וּ/פֶן תִּדְרֹ֨שׁ לֵֽ/אלֹהֵי/הֶ֜ם לֵ/אמֹ֨ר אֵיכָ֨ה יַעַבְד֜וּ הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֶת אֱלֹ֣הֵי/הֶ֔ם וְ/אֶעֱשֶׂה כֵּ֖ן גַּם אָֽנִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: te
  text: వారు మీ ముందునుండి నాశనం చేయబడిన తరువాత, వారి వెంబడి వెళ్లి ఉచ్చులో చిక్కుకోకుండా మిమ్మల్ని మీరు జాగ్రత్తగా కాపాడుకోండి. “ఈ జనాలు తమ దేవుళ్లను ఎలా పూజించేవారు? నేనూ అలాగే చేస్తాను” అని అడుగుతూ వారి దేవుళ్ల గురించి విచారించకుండా జాగ్రత్తపడండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడండి
  rationale: హెబ్రీయులోని ఆత్మవాచక హెచ్చరికను సహజమైన ఆధునిక తెలుగు ఆజ్ఞారూపంలో వ్యక్తం చేస్తుంది; ‘మీ విషయంలో మీరు జాగ్రత్తపడండి’ అనే భావం క్రియలోనే ఇమిడివుంది.
- source_word: תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: వారి వెంట వెళ్లి ఉచ్చులో చిక్కుకోకుండా
  rationale: נקש నిఫాల్ రూపంలోని ‘ఉచ్చులో చిక్కుకొను’ అనే రూపకాన్ని నిలుపుతూ, אַחֲרֵיהֶם లోని ‘వారి వెంట/వారిని అనుసరించి’ అనే భావాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: הִשָּׁמְדָם מִפָּנֶיךָ
  choice: వారు మీ ఎదుట నుండి నాశనం చేయబడిన తర్వాత
  rationale: హోఫాల్ క్రియలోని కర్మణి భావాన్ని, מִפָּנֶיךָ లోని స్థల సంబంధమైన ‘మీ ఎదుట నుండి’ అనే పదబంధాన్ని కాపాడుతుంది.
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: వారి దేవుళ్ల గురించి విచారించకుండా
  rationale: דרשׁ యొక్క సందర్భానుసారమైన ‘విచారించు/తెలుసుకోవడానికి వెదుకు’ అనే భావాన్ని ఇస్తుంది; ఆ దేవుళ్లను ప్రార్థించడం అనే అర్థాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: יַעַבְדוּ
  choice: పూజించేవారు
  rationale: దేవతల సందర్భంలో עבד యొక్క ‘సేవించు/ఆరాధించు’ భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిషేధం ఏ విషయంపై ఉందనే పరిధి
  choice: అన్యజనాల దేవుళ్లను వారు ఎలా పూజించారో తెలుసుకొని అలాగే చేయాలనే విచారణగా వాక్యాన్ని ఉంచడం
  alternative: అన్యమతాల గురించి ఏ విధమైన సమాచారాన్నైనా తెలుసుకోవడం పూర్తిగా నిషిద్ధమని విస్తరించడం
  rationale: మూల వాక్యంలో విచారణ వెంటనే ‘నేనూ అలాగే చేస్తాను’ అనే ఉద్దేశంతో అనుసంధానమై ఉంది; కాబట్టి మూలం చెప్పినదానికంటే నిషేధాన్ని విస్తరించలేదు.
- issue: יַעַבְדוּ యొక్క కాల/విధి భావం
  choice: ‘ఎలా పూజించేవారు?’
  alternative: ‘ఎలా పూజిస్తారు?’
  rationale: అక్షరార్థంగా అసంపూర్ణ క్రియ వర్తమాన/ఆచార విధానాన్ని సూచించగలిగినా, ఆ జనాలు నాశనం చేయబడిన తర్వాత అనే సందర్భంలో తెలుగు భూతకాల అలవాటు రూపం సహజంగా సరిపోతుంది; వారి పూజావిధానం గురించిన ప్రశ్నను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం. మూలంలోని పునరుక్త హెచ్చరికను తెలుగులో రెండు వాక్యాలుగా సహజంగా నిలిపి, ‘ఉచ్చు’ రూపకాన్ని కాపాడాం. అనవసరమైన సిద్ధాంతపరమైన వివరణలు లేదా పంథా-ప్రత్యేక పదజాలం చేర్చలేదు.
