  rationale: The revision corrects the unnatural redundant expression “అని అంటూ,” preserves the source's twofold warning and its quoted purpose clause, and makes the first reflexive imperative explicit in idiomatic modern standard Telugu. It does not broaden the prohibited inquiry beyond the stated intent to imitate the nations' worship.
