source:
  edition: WLC
  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: te
  text: ఈ రోజు ఇక్కడ మనం చేస్తున్నట్లుగా మీరు చేయకూడదు; ప్రతి మనిషి తన కంటికి సరైనదనిపించినదంతా చేస్తున్నట్లుగా చేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘ప్రతి మనిషి’; ఇక్కడ అది ఒక్కొక్కరూ తమ సొంత నిర్ణయం ప్రకారం ప్రవర్తించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן
  choice: మీరు చేయకూడదు
  rationale: నిషేధార్థక לֹאతో ఉన్న ద్వితీయ పురుష బహువచన అసంపూర్ణ క్రియ భవిష్యత్తుకు వర్తించే ఆజ్ఞను సూచిస్తుంది; ‘చేయకూడదు’ ఆధునిక తెలుగులో సహజమైన నియమాత్మక రూపం.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేస్తున్నట్లుగా
  rationale: ఈ తులనాత్మక పదబంధం ప్రస్తుత ఆచరణ విధానంతో పోలికను సూచిస్తుంది; తెలుగులో ‘చేస్తున్నట్లుగా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: ఈ రోజు ఇక్కడ మనం చేస్తున్న
  rationale: వర్తమాన క్రియావిశేషణ రూపంతో పాటు స్థలకాల సూచనలు ప్రస్తుతం కొనసాగుతున్న ఆచరణను తెలుపుతాయి.
- source_word: אִישׁ
  choice: ప్రతి మనిషి
  rationale: ఏకవచన పుంలింగ రూపం పంపిణీయ భావంలో ఉంది; మూలంలోని రూపాన్ని కాపాడుతూ ప్రతి వ్యక్తిని సూచిస్తుంది.
- source_word: כָּל הַיָּשָׁר
  choice: సరైనదంతా
  rationale: ఈ పదబంధం నిటారైనది, సముచితమైనది లేదా సరైనదిగా పరిగణించబడేదాన్ని సూచిస్తుంది; ‘సరైనదంతా’ మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: בְּעֵינָיו
  choice: తన దృష్టికి
  rationale: వ్యక్తిగత అంచనా లేదా తీర్పును సూచించే హెబ్రీయ ఇడియమ్‌ను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘తన’ స్వీయ నిర్ణయ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אִישׁ ... בְּעֵינָיו అనే పుంలింగ పంపిణీయ నిర్మాణం
  choice: ప్రతి మనిషి ... తన దృష్టికి
  alternative: ప్రతి ఒక్కరూ ... తమ దృష్టికి
  rationale: మూలంలోని పుంలింగ ఏకవచన పంపిణీయ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది వ్యక్తిగత నిర్ణయం ప్రకారం ఒక్కొక్కరు ప్రవర్తించడాన్ని సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేయబడింది.
- issue: הַיָּשָׁר యొక్క మూల్యాంకన భావం
  choice: సరైనదంతా
  alternative: సరైనదిగా తోచినదంతా
  rationale: ‘తోచినది’ అని అనువదిస్తే వ్యక్తిగత భావనను స్పష్టం చేస్తుంది గాని మూలంలో ప్రత్యక్షంగా లేని వివరణను చేర్చుతుంది; వ్యక్తిగత మూల్యాంకన భావం ‘తన దృష్టికి’ అనే ఇడియమ్‌లోనే ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నియమాత్మక శైలి ఉపయోగించబడింది. హెబ్రీయ వాక్యంలోని వ్యతిరేక ఆజ్ఞ, వర్తమాన ఆచరణ, వ్యక్తిగత తీర్పు అనే అంశాలు నిలుపబడ్డాయి.
