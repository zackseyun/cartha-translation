review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition, present setting, and distributive personal judgment. However, its final clause shifts the Hebrew's participial description of the present communal practice into an unanchored assertion, “ప్రతి మనిషి ... చేస్తున్నాడు,” after the dash. Recasting the sentence so that “each man” explicitly explains what “we are doing” more closely reflects the Hebrew syntax and preserves the ongoing-action sense.
  naturalness: “తన దృష్టికి సరైనదంతా” is understandable, but “తన కంటికి సరైనదనిపించినదంతా” is more idiomatic modern Telugu for the Hebrew idiom while retaining the evaluative nuance. A semicolon cleanly joins the prohibition with its explanatory distributive phrase.
  terminology: “ప్రతి మనిషి” appropriately retains the masculine singular distributive form of אִישׁ. “సరైనదనిపించినదంతా” together with “తన కంటికి” renders the evaluative force of כָּל־הַיָּשָׁר בְּעֵינָיו without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: The final clause is translated as an independent statement after an em dash.
    rationale: Hebrew presents “each man all that is right in his eyes” as the distributive characterization of what the community is doing at present. Making this relationship explicit avoids a slight syntactic shift and better retains the participial context.
  - severity: low
    issue: “తన దృష్టికి సరైనదంతా” is somewhat literal and less idiomatic.
    rationale: “తన కంటికి సరైనదనిపించినదంతా” is natural standard Telugu and conveys the Hebrew idiom of personal evaluation.
