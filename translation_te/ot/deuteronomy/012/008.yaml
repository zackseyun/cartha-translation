  to: ఈ రోజు ఇక్కడ మనం చేస్తున్నట్లుగా మీరు చేయకూడదు; ప్రతి మనిషి తన కంటికి సరైనదనిపించినదంతా చేస్తున్నట్లుగా చేయకూడదు.[a]
