  rationale: POB యొక్క దైవనామ విధానానికి అనుగుణంగా ‘యాహ్వే’ను స్వీకరించాం. గּוֹיִםను ‘జాతులు’గా మార్చి జాబితాలోని ప్రజా-జాతి సమూహాల సూచనను స్పష్టం చేశాం. చివరి తులనలో ప్రధాన పాఠం రַבִּים యొక్క విస్తృతార్థాన్ని నిలుపుతుంది; సంఖ్యాత్మక పఠనం పాదసూచికలో ఇవ్వబడింది. పాదసూచిక గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
