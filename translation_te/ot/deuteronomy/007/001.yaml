source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నిన్ను నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశంలోకి తీసుకువచ్చి, నీ ఎదుటనుండి అనేక జాతులను వెళ్లగొట్టినప్పుడు[a]—హిత్తీయులు, గిర్గాషీయులు, అమోరీయులు, కనానీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు అనే నీకంటే గొప్పవైన, బలమైన ఏడు జాతులను[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఎదుటనుండి అనేక జాతులను స్వాధీనం కోల్పోయేలా చేసినప్పుడు.”
    reason: וְנָשַׁל అనే క్రియకు వెళ్లగొట్టడం అనే భావంతో పాటు స్వాధీనాన్ని కోల్పోయేలా చేయడం అనే భావమూ ఉంది.
  - marker: b
    text: లేదా, “నీకంటే ఎక్కువ సంఖ్యగల, బలమైన ఏడు జాతులను.”
    reason: רַבִּים అనే పదానికి ‘గొప్పవైన’ అనే విస్తృత భావంతో పాటు ‘ఎక్కువ సంఖ్యగల’ అనే భావమూ సాధ్యమే.
lexical_decisions:
- source_word: כִּי
  choice: ఎప్పుడు / -ినప్పుడు
  rationale: తరువాత వచ్చే ఆజ్ఞలకు నేపథ్య పరిస్థితిని పరిచయం చేస్తుంది; ఇక్కడ కారణార్థం లేదా షరతుకంటే కాలార్థం సహజం.
- source_word: יְבִיאֲךָ
  choice: నిన్ను తీసుకువచ్చి
  rationale: בוא ధాతువు హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో ఇశ్రాయేలు స్వాధీనం చేసుకోబోయే నిర్దిష్ట భూభాగాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ లోని చురుకైన స్వాధీనపరచుకొనే భావాన్ని ‘వారసత్వంగా పొందడం’ కంటే ఈ సందర్భంలో స్పష్టంగా అందిస్తుంది.
- source_word: וְנָשַׁל
  choice: వెళ్లగొట్టినప్పుడు
  rationale: ఇక్కడ జనాలను వారి స్థలం నుంచి తొలగించడం లేదా స్వాధీనాన్ని కోల్పోయేలా చేయడం అనే భావం ఉంది; ప్రధాన పాఠ్యంలో సహజమైన ‘వెళ్లగొట్టు’ ఎంచుకున్నాం.
- source_word: גּוֹיִם רַבִּים
  choice: అనేక జనాలు
  rationale: కనానులోని వేర్వేరు జాతి-ప్రజా సమూహాలను సూచిస్తుంది; ‘దేశాలు’ కంటే ‘జనాలు’ ఈ జాబితాకు తెలుగులో సహజం.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుంచి
  rationale: ఒకరి సన్నిధి లేదా మార్గం నుంచి తొలగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సన్నిహితంగా నిలుపుతుంది.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: నీకంటే ఎక్కువ సంఖ్యగల, బలవంతులైన ఏడు జనాలు
  rationale: רַבִּים పదం ఇక్కడ ‘అనేక’ లేదా తులనాత్మకంగా ‘ఎక్కువ సంఖ్యగల’ అనే భావాన్ని ఇవ్వగలదు; సమాంతరమైన עֲצוּמִים తో కలిసి సంఖ్యా-బల తులనను ప్రధాన పాఠ్యంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచాం. మూల ఉచ్చారణపై సంపూర్ణ నిశ్చయత లేకపోవడంతో, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: వాగ్దాన దేశాన్ని స్వాధీనం చేసుకోవడంలో దేవుని క్రియాశీల పాత్ర
  choice: యెహోవా తీసుకువచ్చి జనాలను వెళ్లగొడతాడు
  alternative: ఇశ్రాయేలు మాత్రమే దేశాన్ని జయిస్తుంది
  rationale: వాక్యంలోని హిఫీల్ క్రియ మరియు וְנָשַׁל దేవునినే క్రియల కర్తగా చూపుతాయి; ఆ ఉద్రిక్తతను తగ్గించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో దీర్ఘ విరామ సూచకంగా డాష్ ఉంచాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
