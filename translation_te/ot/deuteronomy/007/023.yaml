revisions:
- from: కాని మీ దేవుడైన యెహోవా వారిని మీ చేతికి అప్పగించి, వారు నాశనమయ్యే వరకు వారిని తీవ్రమైన గందరగోళానికి గురిచేస్తాడు.[a][b]
  to: కాని నీ దేవుడైన యాహ్వే వారిని నీకు[a] అప్పగించి, వారు నాశనమయ్యే వరకు వారిలో గొప్ప కలవరం కలిగిస్తాడు.[b]
  rationale: The revision aligns the divine name with the POB’s stated Yahweh policy, restores the Hebrew singular address, and improves the rendering of וְהָמָם מְהוּמָה גְדֹלָה while preserving its semantic range. Footnote a is anchored directly to “నీకు,” the idiomatic rendering of לְפָנֶיךָ; footnote b remains attached to the battle-disarray expression.
