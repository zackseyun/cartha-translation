  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: te
  text: కాని నీ దేవుడైన యాహ్వే వారిని నీకు[a] అప్పగించి, వారు నాశనమయ్యే వరకు వారిలో గొప్ప కలవరం కలిగిస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ ఎదుట.’ ఇక్కడ ఈ మాట శత్రువులను నీ అధికారానికి అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గొప్ప భయాందోళన’ లేదా ‘గొప్ప కల్లోలం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: వారిని మీ చేతికి అప్పగించి
  rationale: נתן అనే క్రియ לְפָנֶיךָతో కలిసి యుద్ధ సందర్భంలో శత్రువులను ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘మీ చేతికి అప్పగించి’ అనే తెలుగు ప్రయోగం ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יְהוָהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఈ రూపం ‘నీ దేవుడు’ అని అర్థం. సమూహమైన ఇశ్రాయేలును ఉద్దేశించిన తెలుగు గౌరవ/బహువచన ప్రయోగానికి అనుగుణంగా ‘మీ దేవుడైన’ అని ఇచ్చాం.
- source_word: לְפָנֶיךָ
  choice: మీ చేతికి
  rationale: అక్షరార్థం ‘మీ ఎదుట’; అయితే נתןతో కూడిన ఈ సైనిక సందర్భంలో శత్రువులను ఇశ్రాయేలు అధికారంలోకి అప్పగించడం అనే నుడికారార్థం ఉంది.
- source_word: וְהָמָם
  choice: వారిని ... గందరగోళానికి గురిచేస్తాడు
  rationale: המם యుద్ధంలో భయాందోళన, కలవరం లేదా చెదరగొట్టే గందరగోళాన్ని కలిగించడాన్ని సూచిస్తుంది. కారణార్థక బలాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: מְהוּמָה גְדֹלָה
  choice: తీవ్రమైన గందరగోళం
  rationale: ఈ నామవాచక పదబంధం గొప్ప కలవరం, భయాందోళన లేదా గందరగోళాన్ని సూచించగలదు. ‘తీవ్రమైన గందరగోళం’ ఆధునిక తెలుగులో సహజంగా ఉండి విస్తృత భావపరిధిని కాపాడుతుంది.
- source_word: עַד הִשָּׁמְדָם
  choice: వారు నాశనమయ్యే వరకు
  rationale: עַד తరువాత వచ్చిన שׁמד క్రియానామ రూపం చర్య యొక్క అంతిమ హద్దును సూచిస్తుంది. ఈ అనువాదం ఫలితార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామంగానే ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. హెబ్రీలో మోషే సమూహమైన ఇశ్రాయేలును రెండవ పురుష ఏకవచనంలో ఉద్దేశించినప్పటికీ, తెలుగులో సహజమైన సమూహ సంబోధనగా ‘మీ’ రూపాన్ని ఉపయోగించాం. యుద్ధసందర్భంలోని నుడికారాన్ని ప్రధాన పాఠంలో స్పష్టపరుస్తూ, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
