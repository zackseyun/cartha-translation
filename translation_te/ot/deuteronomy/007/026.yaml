source:
  edition: WLC
  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: te
  text: అసహ్యకరమైన దానిని నీ ఇంట్లోకి తీసుకురావద్దు; తెస్తే నీవూ దానిలాగే నాశనానికి అంకితమైనవాడవుతావు.[a] దానిని పూర్తిగా ఏవగించుకో; పూర్తిగా అసహ్యించుకో; ఎందుకంటే అది నాశనానికి అంకితమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాశనానికి అంకితమైనది’ అని అనువదించిన హీబ్రూ పదానికి ‘నిషేధానికి లోనైనది’ లేదా సంప్రదాయంగా ‘శాపగ్రస్తమైనది’ అనే అర్థాలూ ఉన్నాయి. ఇక్కడ అది దేవుని తీర్పు కింద నాశనం కోసం ప్రత్యేకించబడినదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: తీసుకురావద్దు
  rationale: హిఫిల్ రూపం ‘లోపలికి వచ్చేలా చేయడం’ అనే భావాన్ని ఇస్తుంది; ఇంట్లోకి ఏదైనా వస్తువును తెచ్చే నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: תּוֹעֵבָה
  choice: అసహ్యమైనది
  rationale: ద్వితీయోపదేశకాండంలో ఈ పదం ప్రధానంగా విగ్రహారాధనకు సంబంధించిన, దేవుని దృష్టిలో ఘోరంగా హేయమైన వస్తువును సూచిస్తుంది. ‘అసహ్యమైనది’ నామవాచక భావాన్నీ బలమైన నైతిక-ఆరాధనా వ్యతిరేకతనూ సహజంగా నిలుపుతుంది.
- source_word: בֵּיתֶךָ
  choice: నీ ఇంట్లోకి
  rationale: మూలంలోని ‘నీ ఇల్లు’ అనే స్పష్టమైన గృహస్థల చిత్రాన్ని నిలుపుతూ, תָבִיאతో కలిపి తెలుగులో సహజమైన గమ్యవిభక్తిని వాడింది.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: తెస్తే నీవూ దానిలాగే నాశనానికి అంకితమైనవాడవుతావు
  rationale: వావ్‌కు ఇక్కడ హెచ్చరికతో కూడిన పర్యవసాన భావం ఉంది. חֵרֶם కేవలం ‘శాపగ్రస్తం’ కాక, దైవిక తీర్పులో నాశనం కోసం ప్రత్యేకించబడిన స్థితిని సూచిస్తుంది.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: దాన్ని పూర్తిగా ఏవగించుకోవాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ ఆజ్ఞను బలపరుస్తుంది. ‘పూర్తిగా’ ఆ ఉద్ఘాటనను తెలిపి, ‘ఏవగించుకోవాలి’ అపవిత్రమైనదిగా జుగుప్సతో చూడే భావాన్ని అందిస్తుంది.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: పూర్తిగా అసహ్యించుకోవాలి
  rationale: రెండవ సమాంతర క్రియను మొదటిదానితో కలపకుండా ప్రత్యేకంగా ఉంచి, పునరుక్త క్రియారూపంలోని బలాన్ని ‘పూర్తిగా’ ద్వారా తెలియజేస్తుంది.
- source_word: כִּי חֵרֶם הוּא
  choice: ఎందుకంటే అది నాశనానికి అంకితమైనది
  rationale: కారణార్థక כִּיని స్పష్టంగా వ్యక్తం చేసి, ముందున్న חֵרֶםతో పదసంబంధాన్ని ఒకే అనువాదం ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: ఒడంబడిక తీర్పు సందర్భంలో חֵרֶם అనువాదం
  choice: నాశనానికి అంకితమైనది
  alternative: నిషేధానికి లోనైనది; శాపగ్రస్తమైనది
  rationale: ఈ పదం దేవుని తీర్పు కింద నాశనం కోసం ప్రత్యేకించబడిన వస్తువు లేదా వ్యక్తి స్థితిని సూచిస్తుంది. ‘నిషేధం’ ఆధునిక పాఠకునికి అస్పష్టంగా ఉండవచ్చు; ‘శాపగ్రస్తం’ దాని భావాన్ని కేవలం శాపానికి పరిమితం చేస్తుంది. ఎంపిక చేసిన రూపం అంకితం మరియు నాశనం అనే రెండు అంశాలనూ నిలుపుతుంది.
- issue: וְהָיִיתָలోని వావ్ సంబంధం
  choice: ‘తెస్తే ... అవుతావు’ అనే పర్యవసాన హెచ్చరిక
  alternative: ‘మరియు ... అవుతావు’; ‘అవకుండా’ అనే ఉద్దేశ/నివారణ రూపం
  rationale: నిషేధాన్ని అతిక్రమిస్తే కలిగే ఫలితాన్ని వాక్యసందర్భం తెలియజేస్తుంది. షరతు-పర్యవసాన రూపం తెలుగులో సహజంగా ఉండి, మూలంలోని హెచ్చరిక బలాన్ని నిలుపుతుంది; దాన్ని కేవలం ఉద్దేశార్థకంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. సమాంతర హీబ్రూ క్రియల మధ్య స్వల్ప అర్థభేదాన్ని ‘ఏవగించుకోవాలి / అసహ్యించుకోవాలి’తో కాపాడాం; ఇన్ఫినిటివ్ అబ్సల్యూట్ ఉద్ఘాటనను రెండుసార్లూ ‘పూర్తిగా’తో వ్యక్తం చేశాం.
