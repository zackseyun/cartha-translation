revisions:
- from: అసహ్యమైన దేనినీ నీ ఇంట్లోకి తీసుకురావద్దు; తెస్తే నీవూ దానిలాగే నాశనానికి అంకితమైనవాడవుతావు.[a] దాన్ని పూర్తిగా ఏవగించుకోవాలి, పూర్తిగా అసహ్యించుకోవాలి; ఎందుకంటే అది నాశనానికి అంకితమైనది.
