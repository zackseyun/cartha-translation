  text: וַ/אֲהֵ֣בְ/ךָ֔ וּ/בֵרַכְ/ךָ֖ וְ/הִרְבֶּ֑/ךָ וּ/בֵרַ֣ךְ פְּרִֽי בִטְנְ/ךָ֣ וּ/פְרִֽי אַ֠דְמָתֶ/ךָ דְּגָ֨נְ/ךָ֜ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ שְׁגַר אֲלָפֶ֨י/ךָ֙ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֔/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: te
  text: ఆయన నిన్ను ప్రేమిస్తాడు, నిన్ను ఆశీర్వదిస్తాడు, నిన్ను అనేకులనుగా చేస్తాడు. నీ గర్భఫలాన్ని, నీ నేల ఫలాన్ని—నీ ధాన్యాన్ని, నీ కొత్త ద్రాక్షారసాన్ని, నీ నూనెను, నీ పశుమందల సంతానాన్ని, నీ గొర్రెలు మేకల మందల పిల్లలను—నీకు ఇవ్వాలని నీ పితరులకు[a] ప్రమాణం చేసిన దేశంలో ఆయన ఆశీర్వదిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పూర్వీకులకు.’ హీబ్రూలో ‘నీ పితరులకు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: ఆయన నిన్ను ప్రేమించి
  rationale: సందర్భంలో ఇది నిబంధన ఆశీర్వాదాల భవిష్యత్ వరుసలో భాగం. ‘ప్రేమించి’ అనే రూపం తరువాతి క్రియలతో సహజంగా కలుస్తూ ప్రేమ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: וּבֵרַכְךָ
  choice: నిన్ను ఆశీర్వదించి
  rationale: బరక్ అనే క్రియకు నిబంధన సందర్భంలో సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: וְהִרְבֶּךָ
  choice: నిన్ను విస్తరింపజేస్తాడు
  rationale: వ్యక్తుల సంఖ్య, సంతానం, సమాజ వృద్ధి అన్న భావాలను మితంగా కలిగిస్తూ ప్రత్యక్ష కర్మ ‘నిన్ను’ను నిలుపుతుంది.
- source_word: פְּרִי בִטְנְךָ
  choice: నీ గర్భఫలాన్ని
  rationale: సంతానాన్ని సూచించే హీబ్రూ శరీరాధారిత రూపకాన్ని యథాతథంగా, సహజమైన బైబిలు తెలుగులో నిలుపుతుంది.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: నీ నేల ఫలాన్ని
  rationale: రెండు చోట్ల ఉన్న פְּרִי అనే పదబంధ సంబంధాన్ని ‘ఫలం’ ద్వారా నిలుపుతూ, వ్యవసాయ దిగుబడిని సూచిస్తుంది.
- source_word: דְּגָנְךָ
  choice: నీ ధాన్యాన్ని
  rationale: తృణధాన్య పంటల సాధారణ దిగుబడిని స్పష్టంగా తెలిపే ఆధునిక తెలుగు పదం.
- source_word: תִירֹשְׁךָ
  choice: నీ కొత్త ద్రాక్షారసాన్ని
  rationale: సాధారణ ద్రాక్షారసం కంటే తాజాగా ఉత్పత్తి చేసిన ద్రాక్షారసాన్ని సూచించే תירוש ప్రత్యేకతను నిలుపుతుంది.
- source_word: יִצְהָרֶךָ
  choice: నీ నూనెను
  rationale: వ్యవసాయ ప్రధాన ఉత్పత్తిగా నూనెను సూచిస్తుంది; మూలంలో స్పష్టంగా లేని ‘ఒలీవ’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: నీ పశువుల దూడలను
  rationale: బహువచన పశుసంపదకు పుట్టిన పిల్లలను స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: నీ మందల పిల్లలను
  rationale: అసాధారణ నామవాచకాన్ని ఈ సమాంతర వ్యవసాయ సందర్భంలో చిన్న పశువుల సంతానంగా అనువదిస్తుంది; అష్టోరెత్ అనే దేవత పేరును అనవసరంగా దిగుమతి చేయదు.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ఇక్కడ సాధారణ మట్టికంటే వాగ్దాన భూభాగంలో ఆశీర్వాదాలు నెరవేరడమే ఉద్దేశం.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: నీకు ఇస్తానని నీ పితరులకు ప్రమాణం చేసిన
  rationale: ప్రమాణ సూత్రాన్ని, రెండవ పురుష ఏకవచన సంబోధనను, హీబ్రూలోని పురుష బహువచన ‘తండ్రులు/పితరులు’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: לַאֲבֹתֶיךָ అనువాదం
  choice: నీ పితరులకు
  alternative: నీ పూర్వీకులకు
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పురుష బహువచనం. ‘పితరులు’ మూలరూపాన్ని నిలుపుతుంది; విస్తృత వంశపారంపర్య భావానికి ‘పూర్వీకులు’ సాధ్యమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఇచ్చాం.
- issue: దైవ ప్రేమ మరియు భౌతిక సమృద్ధి మధ్య నిబంధన సంబంధం
  choice: ప్రేమ, ఆశీర్వాదం, జనవృద్ధి, వ్యవసాయ-పశుసంపద వృద్ధిని మూలంలోని వరుసగానే ఉంచడం
  alternative: ఆశీర్వాదాలను సాధారణ ఆధ్యాత్మిక శ్రేయస్సుగా సంక్షిప్తీకరించడం
  rationale: వచనం నిర్దిష్టమైన సంతానం, పంటలు, పశుసంపద ఆశీర్వాదాలను చెబుతుంది; వాటిని ఆధ్యాత్మికీకరించడం లేదా సిద్ధాంతపరంగా పునర్వ్యాఖ్యానించడం నివారించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘గర్భఫలం,’ ‘పితరులు,’ ‘ప్రమాణం’ వంటి స్థిరమైన బైబిలు పదాలు మూలంలోని రూపకాన్ని, నిబంధన భాషను కాపాడటానికి ఉంచబడ్డాయి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించి, చివరి స్థానవాచక భాగాన్ని ‘ఆయన ఇలా చేస్తాడు’తో సహజంగా అనుసంధానించాం.
