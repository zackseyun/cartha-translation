source:
  edition: WLC
  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: te
  text: 'మీరు ప్రజలందరికంటే సంఖ్యలో ఎక్కువగా ఉన్నందున యాహ్వే మిమ్మల్ని ప్రేమించి[a] మిమ్మల్ని ఎన్నుకోలేదు; ఎందుకంటే ప్రజలందరిలో మీరే సంఖ్యలో అత్యల్పులు.


    [a] లేదా, “మీపై తన మమకారాన్ని ఉంచి.” ఈ హీబ్రూ క్రియ బలమైన అనుబంధాన్ని లేదా ఆప్యాయతను తెలియజేస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీపై తన మమకారాన్ని ఉంచి.” ఈ హీబ్రూ క్రియ బలమైన అనుబంధాన్ని లేదా ఆప్యాయతను తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: మీరు ఇతర ప్రజలందరికంటే ఎక్కువ సంఖ్యలో ఉన్నారని
  rationale: מִן‌తో వచ్చిన సంఖ్యాపరమైన పోలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నిరాకరణతో కలిసి కారణార్థాన్ని కూడా నిలుపుతుంది.
- source_word: חָשַׁק
  choice: మీపై మమకారం ఉంచి
  rationale: ఈ క్రియలోని బలమైన అనుబంధం, ఆప్యాయత అనే భావాలను సహజంగా తెలియజేస్తుంది. ‘ప్రేమను ఉంచి’ కూడా సాధ్యమైనందున దానిని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּבְחַר בָּכֶם
  choice: మిమ్మల్ని ఎన్నుకోలేదు
  rationale: ప్రధాన క్రియ חָשַׁקతో పంచుకున్న לֹא నిరాకరణ పరిధిని తెలుగులో స్పష్టంగా ఉంచుతూ, בחר యొక్క సాధారణ నిబంధనాత్మక భావాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి నిరాకరణకు వివరణాత్మక కారణాన్ని ప్రవేశపెట్టే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: ప్రజలందరిలో మీరే అతి తక్కువ సంఖ్యగలవారు
  rationale: ముందటి సంఖ్యాపరమైన పోలికకు అనుగుణంగా ఇశ్రాయేలు సంఖ్యాపరమైన చిన్నదనాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘అతి చిన్నవారు’ అనే అస్పష్టతను నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: దైవిక ఎన్నికకు సిద్ధాంతపరమైన అదనపు అర్థం చేర్చే అవకాశం
  choice: మిమ్మల్ని ఎన్నుకోలేదు
  alternative: మిమ్మల్ని ఎంపిక చేసుకోలేదు
  rationale: వాక్యం ఇశ్రాయేలును యాహ్వే ఎన్నుకున్నాడని, అది వారి సంఖ్యాబలం కారణంగా కాదని మాత్రమే చెబుతుంది. తదనంతర సిద్ధాంతవ్యవస్థల భావాలను చేర్చకుండా ఆ ఉద్వేగాన్ని అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. ‘ప్రజలు’ అనే పదం עַמִּים యొక్క సమూహ-జాతి భావాన్ని కాపాడుతుంది.
