  to: 'మీరు ప్రజలందరికంటే సంఖ్యలో ఎక్కువగా ఉన్నందున యాహ్వే మిమ్మల్ని ప్రేమించి[a] మిమ్మల్ని ఎన్నుకోలేదు; ఎందుకంటే ప్రజలందరిలో మీరే సంఖ్యలో అత్యల్పులు.


    [a] లేదా, “మీపై తన మమకారాన్ని ఉంచి.” ఈ హీబ్రూ క్రియ బలమైన అనుబంధాన్ని లేదా ఆప్యాయతను తెలియజేస్తుంది.'
  rationale: 'The revision removes the unsupported ‘other,’ smooths the Telugu idiom, and retains the Hebrew sequence: not because of Israel’s comparative numerical greatness did Yahweh love and choose them, because they were the least numerous among the peoples. The footnote preserves the lexical nuance of חָשַׁק without making the main text unnatural.'
