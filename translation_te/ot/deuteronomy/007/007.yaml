revisions:
- from: 'మీరు ఇతర ప్రజలందరికంటే ఎక్కువ సంఖ్యలో ఉన్నారని యాహ్వే మీపై మమకారం ఉంచి[a] మిమ్మల్ని ఎన్నుకోలేదు. ఎందుకంటే ప్రజలందరిలో మీరే అతి తక్కువ సంఖ్యగలవారు.


