id: DEU.7.15
reference: Deuteronomy 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: te
  text: యాహ్వే నీ నుండి ప్రతి రోగాన్నీ తొలగిస్తాడు. నీకు తెలిసిన[b] ఐగుప్తు దేశపు హానికరమైన[a] రోగాల్లో దేనినీ ఆయన నీ మీద మోపడు; వాటిని నిన్ను ద్వేషించే వారందరి మీద మోపుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చెడ్డవైన’ లేదా ‘తీవ్రమైన.’ ఇక్కడి హీబ్రూ విశేషణం చెడ్డది, హానికరమైనది లేదా తీవ్రమైనది అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీవు అనుభవించిన.’ ‘తెలిసిన’ అని అనువదించిన హీబ్రూ పదానికి ఇక్కడ అనుభవపూర్వక భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: తొలగిస్తాడు
  rationale: סור ధాతువు హిఫీల్ రూపంలో ఏదైనా దూరమయ్యేలా చేయడం అనే భావాన్ని ఇస్తుంది; ‘తొలగిస్తాడు’ ఆ కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యనుకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: מִמְּךָ
  choice: నీ నుండి
  rationale: מן ఉపసర్గ వియోగాన్ని సూచిస్తుంది; రెండవ పురుష ఏకవచనాన్ని కూడా నిలిపి ఉంచాం.
- source_word: כָּל חֹלִי
  choice: ప్రతి రోగాన్నీ
  rationale: חֹלִי అనారోగ్యం లేదా రోగాన్ని సూచిస్తుంది. כָּל‌తో కలిసిన సమగ్ర భావాన్ని తెలుగులో సహజంగా ‘ప్రతి రోగాన్నీ’ అని వ్యక్తం చేశాం.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: ఐగుప్తు దేశపు హానికరమైన రోగాలు
  rationale: מַדְוֵי అనేది రోగాల బహువచన నిర్మాణరూపం; הָרָעִים ఇక్కడ చెడ్డవి, హానికరమైనవి లేదా తీవ్రమైనవి అనే భావాలను ఇవ్వగలదు. రోగాల సందర్భంలో ‘హానికరమైన’ సహజంగా ఉంది; ఇతర నుడికారాలను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: నీకు తెలిసిన
  rationale: ידע యొక్క ప్రాథమిక ‘తెలుసు’ భావాన్ని నిలిపాం; సందర్భంలో అది అనుభవపూర్వక జ్ఞానాన్నీ సూచించవచ్చని పాదసూచికలో తెలిపాం.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: దేనినీ ఆయన నీ మీద మోపడు
  rationale: שים + ב ఒకరి మీద ఏదైనా ఉంచడం లేదా మోపడం అనే భావాన్ని ఇస్తుంది. ప్రతికూల వాక్యాన్ని తెలుగులో సహజంగా పలికేందుకు ‘దేనినీ ... మోపడు’ అని ఇచ్చాం.
- source_word: וּנְתָנָם
  choice: వాటిని ... మీద మోపుతాడు
  rationale: נתן మౌలికంగా ‘ఇవ్వడం/ఉంచడం’ అయినా, రోగాలను ఒకరి మీదికి తేవడం అనే సందర్భంలో ‘మోపుతాడు’ సహజం; ముందరి క్రియతో పదబంధ సారూప్యతను కూడా నిలుపుతుంది.
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: నిన్ను ద్వేషించే వారందరి మీద
  rationale: שֹׂנְאֶיךָ అంటే విస్తృతమైన ‘శత్రువులు’ కన్నా నిర్దిష్టంగా ‘నిన్ను ద్వేషించేవారు’; ఏకవచన ‘నిన్ను’ కూడా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో మార్చకుండా ధ్వన్యనుకరణగా ఇచ్చాం.
- issue: ఐగుప్తు రోగాలకు సంబంధించిన వాగ్దానం యొక్క పరిధి
  choice: వచనం చెప్పే నిబంధనాత్మక సందర్భంలోని శారీరక రోగాల నుంచి రక్షణ వాగ్దానాన్ని మాత్రమే అనువదించడం
  alternative: ప్రతి వ్యక్తికీ అన్ని కాలాల్లో అనారోగ్యం రాదనే షరతులేని సార్వత్రిక వాగ్దానం; లేదా పూర్తిగా రూపకాలంకారమైన బాధలు
  rationale: హీబ్రూ పాఠం రోగం మరియు ఐగుప్తు రోగాల గురించి స్పష్టంగా మాట్లాడుతుంది. ఆ సాధారణ అర్థాన్ని నిలిపి, వచనం చెప్పనంత విస్తృతమైన ఆరోగ్య సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. సంబోధన హీబ్రూ మూలంలోని రెండవ పురుష ఏకవచనంగా ఉంది. ‘మోపడు/మోపుతాడు’ అనే సమాంతర పదప్రయోగం మూలంలోని రెండు సంబంధిత ‘ఉంచడం’ క్రియల భావాన్ని సహజంగా నిలుపుతుంది.
