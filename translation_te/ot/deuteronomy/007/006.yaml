id: DEU.7.6
reference: Deuteronomy 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: te
  text: ఎందుకంటే నీవు నీ దేవుడైన యెహోవాకు పరిశుద్ధ ప్రజవి. భూమి మీదనున్న ప్రజలందరిలోనుండి, తనకు ప్రత్యేకమైన సొత్తైన ప్రజగా ఉండటానికి నీ దేవుడైన యెహోవా నిన్ను ఎన్నుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకు ప్రత్యేకమైన స్వాస్థ్యప్రజగా.” హీబ్రూ పదబంధం ‘ప్రజ’ అనే భావాన్నీ, ప్రత్యేకంగా విలువైన సొత్తు లేదా స్వాస్థ్యం అనే భావాన్నీ కలిపి తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని తెలియజేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַם קָדוֹשׁ
  choice: ప్రతిష్ఠితమైన ప్రజ
  rationale: קָדוֹשׁలోని పవిత్రతతోపాటు దేవునికోసం ప్రత్యేకంగా వేరుచేయబడిన భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: ל సూచించే సంబంధం లేదా చెందిన స్థితిని తెలుగు విభక్తితో సహజంగా వ్యక్తం చేస్తుంది; దైవనామాన్ని యెహోవా అని లిప్యంతరీకరిస్తుంది.
- source_word: בְּךָ בָּחַר
  choice: నిన్ను ... ఎన్నుకున్నాడు
  rationale: בחרలోని ఉద్దేశపూర్వక ఎంపిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לִהְיוֹת לוֹ
  choice: తనకోసం ... ఉండే
  rationale: ఉద్దేశం మరియు ఆయనకు చెందినదిగా ఉండటం అనే రెండు భావాలనూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְעַם סְגֻלָּה
  choice: అమూల్యమైన సొత్తుగా ఉండే ప్రజగా
  rationale: עַם అనే ‘ప్రజ’ భావాన్నీ, סְגֻלָּהలోని ప్రత్యేకంగా విలువైన స్వాస్థ్యం లేదా సొత్తు భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: מִכֹּל הָעַמִּים
  choice: ప్రజలందరిలోనుండి
  rationale: అన్ని ప్రజల మధ్యనుండి ఎంపిక చేయబడిన భావాన్ని తెలియజేస్తుంది; వారికంటే ఉన్నతులు అనే అదనపు భావాన్ని చేర్చదు.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: భూమి అంతటా ఉన్న
  rationale: ‘భూమి ముఖంపై’ అనే హీబ్రూ నుడికారాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ఉంచుతుంది.
- issue: מִכֹּל הָעַמִּיםలో ఇశ్రాయేలు ఎంపిక భావం
  choice: ప్రజలందరిలోనుండి
  alternative: ప్రజలందరికంటే పైగా
  rationale: మూలపాఠం ప్రజల మధ్యనుండి దేవుడు చేసిన ఎంపికను చెబుతుంది; అంతర్గత శ్రేష్ఠతను అనవసరంగా చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- issue: סְגֻלָּה యొక్క ప్రజ/స్వాస్థ్య భావసమ్మేళనం
  choice: అమూల్యమైన సొత్తుగా ఉండే ప్రజగా
  alternative: అమూల్యమైన ప్రజగా
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘ప్రజ’ మరియు ప్రత్యేకంగా విలువైన ‘సొత్తు/స్వాస్థ్యం’ అనే రెండు భావాలనూ ప్రధాన పాఠంలోనే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను ‘నీవు/నీ/నిన్ను’తో నిలిపి, మూలంలోని ఒడంబడిక సంబంధాన్ని కాపాడింది.
