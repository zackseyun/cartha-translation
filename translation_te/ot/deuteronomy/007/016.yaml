id: DEU.7.16
reference: Deuteronomy 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా నీకు అప్పగిస్తున్న ప్రజలందరినీ నీవు నిర్మూలించాలి.[a] వారిపై జాలి చూపకూడదు.[b] వారి దేవుళ్లను సేవించకూడదు; అది నీకు ఉచ్చు అవుతుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తినివేయాలి” లేదా “కబళించాలి”; ఇక్కడ ఈ హీబ్రూ క్రియ పూర్తిగా ఓడించి నాశనం చేయడాన్ని నానుడిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ కన్ను వారిపై కనికరం చూపకూడదు”; భావం, “వారిపై జాలి చూపకూడదు.”
    reason: lexical_alternative
  - marker: c
    text: “అది” అనేది సమీపంగా వారి దేవుళ్లను సేవించడాన్ని సూచించవచ్చు; అయితే దేవుళ్లను లేదా విస్తృతమైన విగ్రహారాధన పరిస్థితిని సూచించే అవకాశమూ ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: నిర్మూలించాలి
  rationale: ఆכל్ అనే క్రియకు అక్షరార్థంగా ‘తిను’ అని అర్థం; ఇక్కడ యుద్ధ సందర్భంలో పూర్తిగా కబళించడం లేదా నాశనం చేయడం అనే నానుడి భావం ఉంది. సహజమైన తెలుగులో ‘నిర్మూలించాలి’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థ రూపకాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל הָעַמִּים
  choice: ప్రజలందరినీ
  rationale: עַמִּים ఇక్కడ విభిన్న ప్రజాసమూహాలను సూచిస్తుంది. ‘ప్రజలందరినీ’ అనేది సమగ్రతను, సహజ తెలుగు వాక్యనిర్మాణాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: నీ దేవుడైన యెహోవా నీకు అప్పగిస్తున్న
  rationale: నֹתֵן అనే వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు భావాన్ని ‘అప్పగిస్తున్న’ తెలియజేస్తుంది. ‘ఇస్తున్న’ కంటే యుద్ధ సందర్భంలోని చేతికి అప్పగించడం అనే భావాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది. దైవనామం వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించబడింది.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: వారిపై జాలి చూపకూడదు
  rationale: అక్షరార్థంగా ‘నీ కన్ను వారిని విడిచిపెట్టకూడదు’ అనే హీబ్రూ నానుడి. ఆధునిక తెలుగులో దాని సహజ భావం ‘వారిపై జాలి చూపకూడదు’; మూలంలోని దృశ్యరూపాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: వారి దేవుళ్లను సేవించకూడదు
  rationale: עבד దేవతలతో వాడినప్పుడు ఆరాధనతో కూడిన విధేయ సేవను సూచిస్తుంది. ‘సేవించు’ మూలపదానికి దగ్గరగా ఉండి, కేవలం ఆచారపరమైన ‘పూజించు’ కంటే విస్తృత నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: అది నీకు ఉచ్చు అవుతుంది
  rationale: מוֹקֵשׁ అంటే పట్టు ఉచ్చు లేదా బోను. ‘అది’ అనే సర్వనామం మూలంలోని הוּאను నిలుపుతూ, దాని సూచనలో ఉన్న స్వల్ప అస్పష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘అది నీకు ఉచ్చు అవుతుంది’లో הוּא సూచించేది ఏమిటి?
  choice: ‘అది’ అనే అస్పష్ట సర్వనామాన్ని నిలుపుతూ, సమీప సందర్భంలో వారి దేవుళ్లను సేవించడాన్ని సూచించే అవకాశం ఉందని పాదటిప్పణిలో చెప్పడం
  alternative: దానిని నేరుగా ‘వారి దేవుళ్లను సేవించడం నీకు ఉచ్చు అవుతుంది’ అని స్పష్టీకరించడం; లేదా దేవుళ్లు/విస్తృత విగ్రహారాధన పరిస్థితి అని గ్రహించడం
  rationale: వ్యాకరణపరంగా సర్వనామం ఏకవచనంగా ఉంది; సమీపంలోని నిషేధిత చర్యను సూచించడం సహజం. అయినా దేవుళ్లు లేదా మొత్తం విగ్రహారాధన పరిస్థితి అనే విస్తృత సూచన సాధ్యమే. అందువల్ల మూలంలోని నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. హీబ్రూ నానుడులను ప్రధాన పాఠ్యంలో సహజంగా అనువదించి, ముఖ్యమైన అక్షరార్థ రూపాలను పాదటిప్పణుల్లో భద్రపరిచాం.
