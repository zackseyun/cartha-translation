id: DEU.7.14
reference: Deuteronomy 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: te
  text: ప్రజలందరికంటే నీవు ఎక్కువగా దీవించబడతావు[a]. నీ మధ్య సంతానం లేని పురుషుడుగానీ స్త్రీగానీ ఉండరు[b]; నీ పశువుల్లోనూ సంతానహీనత ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమస్త ప్రజలకంటే మిన్నగా.’ ఇక్కడ హీబ్రూ ఉపసర్గ తులనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో పురుషలింగం, స్త్రీలింగం అనే రెండు రూపాలూ స్పష్టంగా ఉన్నాయి: ‘సంతానం లేని పురుషుడు లేదా స్త్రీ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: నీవు ... దీవించబడతావు
  rationale: ברך యొక్క నిష్క్రియార్థక రూపం, היה యొక్క భవిష్యదర్థక అసంపూర్ణ క్రియతో కలిసి ఒడంబడిక దీవెనగా ఉండబోయే స్థితిని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִכָּל הָעַמִּים
  choice: ప్రజలందరికంటే ... ఎక్కువగా
  rationale: מן ఇక్కడ తులనార్థకంగా పనిచేస్తుంది. అందువల్ల ఇతర ప్రజలతో పోల్చిన దీవెన స్థాయిని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: לֹא יִהְיֶה בְךָ
  choice: నీ మధ్య ... ఉండరు
  rationale: היה + בְּ నిర్మాణం సమాజంలో ఎవరూ అలా ఉండరనే అస్తిత్వ-నిషేధాన్ని సూచిస్తుంది. ఏకవచన సంబోధనను ఉంచుతూ ఇశ్రాయేలును సమష్టిగా సూచించడానికి ‘నీ మధ్య’ ఉపయోగించాం.
- source_word: עָקָר וַעֲקָרָה
  choice: సంతానహీనుడైన పురుషుడుగాని సంతానహీనురాలైన స్త్రీగాని
  rationale: హీబ్రూ పాఠంలో పురుషలింగ, స్త్రీలింగ రూపాలు రెండూ స్పష్టంగా ఉన్నాయి. వైద్యపరమైన కఠిన పదజాలాన్ని నివారిస్తూ ఆ జంటను తెలుగులో నిలిపాం.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: నీ పశువుల్లోనూ సంతానహీనమైనది ఉండదు
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు పశువులను సమష్టిగా సూచిస్తుంది. హీబ్రూలో ముందున్న ‘సంతానహీన’ భావం ఈ చివరి పదబంధానికి వర్తిస్తుండటాన్ని తెలుగులో స్పష్టంగా చేశాం.
theological_decisions:
- issue: ఒడంబడిక దీవెనలో పురుష, స్త్రీ సంతానహీనతను పేర్కొనడం
  choice: పురుషలింగ, స్త్రీలింగ రూపాలను రెండింటినీ స్పష్టంగా అనువదించడం
  alternative: ‘సంతానహీనులు ఎవరూ’ అని సాధారణీకరించడం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా రెండు లింగరూపాలను వాడింది; వాటిని సాధారణ పదంగా కలిపివేయకుండా పాఠ్య భేదాన్ని నిలిపాం.
- issue: ఇశ్రాయేలుకు సమష్టిగత ఏకవచన సంబోధన
  choice: ‘నీవు/నీ’ అనే ఏకవచనాన్ని నిలుపుకోవడం
  alternative: ‘మీరు/మీ’ అని బహువచనంగా మార్చడం
  rationale: హీబ్రూ ఇశ్రాయేలును ఒకే ఒడంబడిక ప్రజగా పురుష ఏకవచనంలో సంబోధిస్తుంది. దాన్ని వ్యాఖ్యాత్మకంగా బహువచనం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘గొడ్రాలు’ వంటి పాతదైన లేదా అవమానకరంగా వినిపించగల పదానికి బదులుగా ‘సంతానహీనుడు/సంతానహీనురాలు’ వాడాం. మూలంలోని సమష్టిగత ఏకవచన సంబోధనను నిలిపాం.
