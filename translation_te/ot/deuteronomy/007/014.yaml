    rationale: ‘సంతానహీనుడు/సంతానహీనురాలు’లో లింగసూచన ఇప్పటికే ఉన్నప్పటికీ దానికి ‘పురుషుడు/స్త్రీ’ జతచేయడం తెలుగులో భారంగా ఉంటుంది. మూలంలోని లింగజతను ‘పురుషుడు గానీ స్త్రీ గానీ’ ద్వారా స్పష్టంగా ఉంచవచ్చు.
