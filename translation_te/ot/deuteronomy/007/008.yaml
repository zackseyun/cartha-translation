base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: te
  text: కాని యాహ్వే మిమ్మల్ని ప్రేమిస్తున్నందువల్ల, మీ పితరులకు తాను చేసిన ప్రమాణాన్ని నిలబెట్టుకుంటున్నందువల్ల, యాహ్వే తన బలమైన చేతితో[a] మిమ్మల్ని బయటకు తీసుకొచ్చి, బానిసల గృహం నుండి[b]—ఐగుప్తు రాజైన ఫరో చేతి నుండి—మిమ్మల్ని విమోచించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బలమైన చేతితో” అనేది యాహ్వే శక్తివంతంగా విడిపించడాన్ని సూచించే హీబ్రూ రూపకం. దీనిని “బలిష్ఠమైన చేతితో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “బానిసల గృహం” అని ఉంది. దీనిని “బానిసత్వపు గృహం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కాని ... అందువల్లనే
  rationale: ముందటి వచనంలోని నిరాకరణకు వ్యతిరేక కారణాన్ని తెలియజేస్తుంది; అందుచేత వివరణాత్మక భావంతో పాటు వ్యతిరేక భావాన్నీ నిలుపుతుంది.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: యెహోవా మిమ్మల్ని ప్రేమించినందువల్ల
  rationale: מִן కారణార్థాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: ప్రమాణాన్ని నిలబెట్టుకున్నందువల్ల
  rationale: שׁמר ఇక్కడ ప్రమాణాన్ని నమ్మకంగా పాటించడం అనే భావం; తెలుగు సందర్భంలో ‘ప్రమాణాన్ని నిలబెట్టుకోవడం’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: మీ పితరులతో తాను చేసిన
  rationale: తెలుగులో ‘వారితో ప్రమాణం చేయడం’ సహజం; אָבוֹת యొక్క పితృపురుషులనే చారిత్రక నిర్దిష్టతను ‘పితరులు’ నిలుపుతుంది.
- source_word: בְּיָד חֲזָקָה
  choice: తన బలమైన చేతితో
  rationale: దేవుని శక్తిమంతమైన విమోచన చర్యను సూచించే హీబ్రూ చేతి రూపకాన్ని నిలుపుతుంది.
- source_word: וַיִּפְדְּךָ
  choice: మిమ్మల్ని విమోచించాడు
  rationale: పణం చెల్లించి విడిపించడం/బంధం నుండి విడుదల చేయడం అనే פדה యొక్క గంభీర విమోచన భావాన్ని అందిస్తుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: బానిసల గృహం నుండి
  rationale: ‘బానిసత్వపు గృహం’ అనే సులభ ప్రత్యామ్నాయం ఉన్నప్పటికీ, హీబ్రూ బహువచన నామవాచకంలోని సజీవమైన రూపకాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: מִיַּד פַּרְעֹה
  choice: ఫరో చేతి నుండి
  rationale: ఫరో అధికార పరిధి నుండి విడిపించబడటాన్ని తెలిపే హీబ్రూ ‘చేతి’ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన రూపంలో ఉంచడం సముచితం.
- issue: ప్రమాణాన్ని కాపాడటం అనే కాల/క్రియా భావం
  choice: ప్రమాణాన్ని నిలబెట్టుకున్నందువల్ల
  alternative: ప్రమాణాన్ని నిలబెట్టుకుంటున్నందువల్ల
  rationale: ఇన్ఫినిటివ్ నిర్మాణం దేవుని నమ్మకమైన ఆచరణను సూచిస్తుంది. తెలుగు వాక్యంలో పూర్తైన నిర్గమ కార్యానికి కారణంగా ‘నిలబెట్టుకున్నందువల్ల’ సహజం; కొనసాగుతున్న నిబంధన విశ్వసనీయతను తప్పనిసరిగా నిరాకరించదు.
- issue: עֲבָדִים లోని బానిసత్వ భాష
  choice: బానిసల గృహం
  alternative: బానిసత్వపు గృహం
  rationale: ఐగుప్తులోని బలవంతపు దాస్యాన్ని మృదువుగా చేయకుండా, మూలంలోని ‘బానిసలు’ అనే నిర్దిష్ట పదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘పితరులు,’ ‘విమోచించాడు’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, వాక్యనిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. ఏకవచన/బహువచన మార్పుతో ఉన్న హీబ్రూ సంబోధనను తెలుగులో సందర్భానుగుణ గౌరవ బహువచనంగా సమన్వయించాం.
