  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: te
  text: నీ కళ్ళు చూసిన గొప్ప పరీక్షలను[a], సూచక కార్యాలను, అద్భుతాలను, బలమైన చేతిని, చాచిన బాహువును—వాటి ద్వారా నీ దేవుడైన యెహ్వే నిన్ను బయటికి తీసుకొచ్చాడు—అలాగే నీవు భయపడుతున్న ప్రజలందరికీ[b] నీ దేవుడైన యెహ్వే చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్ప కఠిన పరీక్షలను.” హీబ్రూ పదం తీవ్రమైన పరీక్షలను లేదా కఠిన అనుభవాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు భయపడుతున్న ప్రజలందరి మీద.” హీబ్రూ ఉపసర్గను ఈ సందర్భంలో ఇలా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: గొప్ప పరీక్షలను
  rationale: מַסּוֹת అనే పదం తీవ్రమైన పరీక్షలు లేదా కఠినమైన అనుభవాలను సూచించగలదు. ‘పరీక్షలు’ ఈ భావాన్ని సహజంగా నిలుపుతుంది; పాపానికి ప్రలోభపరచడం అనే అనవసర భావాన్ని రానివ్వదు.
- source_word: רָאוּ עֵינֶיךָ
  choice: నీ కళ్లతో చూసిన
  rationale: హీబ్రూ వాక్యంలో ‘నీ కళ్లు’ అని స్పష్టంగా ఉండడం వల్ల ప్రత్యక్షంగా చూసిన అనుభవానికి ఇచ్చిన ఉద్ఘాటన నిలుస్తుంది.
- source_word: הָאֹתֹת
  choice: సూచక క్రియలను
  rationale: אוֹת ఇక్కడ దేవుని కార్యాన్ని సూచించే ‘sign’ భావంలో ఉంది. ‘సూచక క్రియలు’ సాధారణ ‘సూచనలు’ కంటే కార్యసందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמֹּפְתִים
  choice: అద్భుతాలను
  rationale: מוֹפְתִים ఆశ్చర్యం కలిగించే అసాధారణ కార్యాలను సూచిస్తుంది; జతగా వచ్చే ‘సూచక క్రియలు’తో సహజంగా సరిపోతుంది.
- source_word: הַיָּד הַחֲזָקָה
  choice: బలమైన చేతిని
  rationale: దేవుని శక్తిమంతమైన కార్యాన్ని తెలిపే హీబ్రూ రూపకాన్ని నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: చాచిన బాహువును
  rationale: విడుదలకూ తీర్పుకూ ఉపయోగించిన దేవుని క్రియాశీల శక్తిని సూచించే స్థిరమైన రూపకాన్ని గంభీరమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: వాటి ద్వారా ... నిన్ను బయటికి రప్పించాడు
  rationale: సంబంధవాచక పదబంధాన్ని ముందున్న బలమైన చెయ్యి, చాచిన బాహువుతో అనుసంధానిస్తూ హిఫిల్ రూపంలోని ‘బయటికి రప్పించడం’ భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహ్వే
  rationale: దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: כֵּן יַעֲשֶׂה
  choice: అలాగే చేస్తాడు
  rationale: గతంలో జరిగిన విమోచన కార్యాలకు, ఇక ప్రజల విషయంలో దేవుడు చేయబోయే కార్యానికి మధ్య ఉన్న పోలికను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְכָל הָעַמִּים
  choice: ప్రజలందరికీ
  rationale: עַמִּים అనే బహువచనానికి ‘ప్రజలు’ నేరమైన సమానం. לְ ఉపసర్గను ‘కి’గా ఉంచడం మూలంలోని విస్తృత సంబంధాన్ని కాపాడుతుంది; సందర్భానుసారమైన ‘మీద’ అనే భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: నీవు భయపడుతున్న
  rationale: ‘వారి సన్నిధి నుండి/వారి కారణంగా భయపడటం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం నాలుగు అక్షరాల వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలపాఠ భేదాన్ని నిలుపుతుంది.
- issue: లְכָל הָעַמִּים లోని సంబంధం
  choice: ప్రజలందరికీ
  alternative: ప్రజలందరి మీద
  rationale: לְ సాధారణంగా ‘కి/కొరకు’ అనే సంబంధాన్ని సూచించినా, ఈ తీర్పు సందర్భంలో ‘మీద/విరోధంగా’ అనే ప్రభావిత-object భావం సాధ్యమే. ప్రధాన పాఠం రూపాన్ని దగ్గరగా ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన వచనశైలి. అయితే మూలవాక్యం 18వ వచనంలో మొదలైన ఆజ్ఞకు కొనసాగింపు మాత్రమే; స్వతంత్ర పఠన సౌలభ్యం కోసం ‘జ్ఞాపకం చేసుకో’ చేర్చబడింది.
