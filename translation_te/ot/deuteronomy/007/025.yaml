source:
  edition: WLC
  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: te
  text: వారి దేవుళ్ల చెక్కిన ప్రతిమలను మీరు అగ్నితో కాల్చివేయాలి. వాటిపై ఉన్న వెండినీ బంగారాన్నీ నీవు ఆశించవద్దు; వాటిని నీ కోసం తీసుకోవద్దు. లేకపోతే దానివల్ల నీవు ఉచ్చులో చిక్కుకుంటావు[a], ఎందుకంటే అది నీ దేవుడైన యాహ్వేకు అసహ్యకరమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిచేత నీవు చిక్కుబడతావు.’ హెబ్రీ క్రియ ఉచ్చులో పట్టుబడే చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי אֱלֹהֵיהֶם
  choice: వారి దేవుళ్ల చెక్కిన ప్రతిమలు
  rationale: פֶּסֶל అనే పదంలోని చెక్కి లేదా మలిచి చేసిన రూపం అనే స్పష్టమైన భావాన్ని నిలుపుతుంది; కేవలం ‘విగ్రహాలు’ అని వ్యాఖ్యానాత్మకంగా సాధారణీకరించదు.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: అగ్నితో కాల్చివేయాలి
  rationale: క్రియలోని పూర్తిగా దహనం చేయాలనే ఆజ్ఞను, בָּאֵשׁ సూచించే సాధనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא תַחְמֹד
  choice: ఆశించి ... తీసుకోవద్దు
  rationale: חמד ఇక్కడ ఆకర్షణీయమైన విలువైన లోహాన్ని తనదిగా చేసుకోవాలనే ఆశను సూచిస్తుంది. తరువాతి ‘తీసుకోవడం’తో కలిపి సహజమైన నిషేధ వాక్యంగా అనువదించబడింది.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: వాటి మీద ఉన్న వెండినీ బంగారాన్నీ
  rationale: ప్రతిమలపై అమర్చిన లేదా పూతగా ఉన్న విలువైన లోహాలను సూచిస్తుంది. హెబ్రీలోని ‘మరియు’ భావాన్ని తెలుగు జత కర్మప్రత్యయ నిర్మాణం సహజంగా నిలుపుతుంది.
- source_word: וְלָקַחְתָּ לָךְ
  choice: నీ కోసం తీసుకోవద్దు
  rationale: לָךְ లోని స్వప్రయోజన భావాన్ని ‘నీ కోసం’ స్పష్టంగా తెలియజేస్తుంది; ఇది ముందున్న నిషేధ పరిధిలోనే ఉంది.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: అలా చేస్తే దానివల్ల నీవు ఉచ్చులో చిక్కుకుంటావు
  rationale: Niphal క్రియలోని ఉచ్చులో పట్టుబడే రూపకాన్ని నిలుపుతూ, פֶּן సూచించే హెచ్చరికను సహజమైన తెలుగు షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: תוֹעֲבַת
  choice: అసహ్యమైనది
  rationale: దేవుని దృష్టిలో తీవ్రమైన నైతిక-ఆరాధనా విరోధాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
theological_decisions:
- issue: చివరి הוּא (‘అది’) దేనిని సూచిస్తుంది?
  choice: ‘అది’ అనే సర్వనామాన్ని నిర్దిష్ట వివరణ లేకుండా ఉంచడం
  alternative: అది ప్రత్యేకంగా చెక్కిన ప్రతిమను, దానిపై ఉన్న విలువైన లోహాన్ని, లేదా దాన్ని తీసుకునే చర్యను సూచిస్తుందని స్పష్టీకరించడం
  rationale: సమీప సందర్భంలో వెండి బంగారాన్ని తీసుకోవడం ప్రధానంగా ఉన్నా, మొత్తం విగ్రహారాధనా వస్తుసముదాయం దృష్టిలో ఉంది. ‘అది’ హెబ్రీలోని నిజమైన సూచనాసందిగ్ధతను కాపాడుతుంది.
- issue: ఆజ్ఞలో బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: ‘మీరు’ తరువాత ‘నీవు’ అని మూలంలోని సంఖ్యామార్పును నిలుపడం
  alternative: వాక్యమంతా ‘మీరు’ అని ఏకరీతిగా చేయడం
  rationale: תִּשְׂרְפוּן బహువచనం కాగా, తరువాతి క్రియలు ఏకవచనం. ఇశ్రాయేలును సమూహంగానూ ఒడంబడిక వ్యక్తిగానూ ఉద్దేశించే వాక్యంలోని ఉద్వేగాన్ని సవరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ఆజ్ఞారూప శైలి ఉపయోగించబడింది. మూలంలోని బహువచన-ఏకవచన మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది; ‘యాహ్వే’ దైవనామంగా లిప్యంతరీకరించబడింది.
