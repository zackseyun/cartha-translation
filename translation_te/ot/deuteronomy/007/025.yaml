review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the carved images, the plural-to-singular shift, the precious metals on the images, the warning of being ensnared, and the deliberately broad final pronoun. The warning introduced by פֶּן is better expressed as a prevention/purpose warning ('lest') than as the more definite conditional result 'అలా చేస్తే'.
  naturalness: The Telugu is generally clear and appropriately formal. Separating the two coordinated prohibitions makes the command clearer in modern Telugu, and 'వాటిపై' is more idiomatic than 'వాటి మీద' in this context.
  terminology: ‘చెక్కిన ప్రతిమలు,’ ‘యాహ్వే,’ and the snare imagery are suitable. ‘అసహ్యకరమైనది’ more naturally conveys the strong evaluative force of תּוֹעֵבָה than the slightly elliptical ‘అసహ్యమైనది,’ while retaining the source’s ambiguity about what ‘it’ denotes.
  issues:
  - severity: medium
    issue: פֶּן is rendered as ‘అలా చేస్తే’ (‘if/when you do this’).
    rationale: 'פֶּן introduces a warning of avoidance: ‘lest you be ensnared.’ ‘లేకపోతే’ retains this preventative force without making the consequence sound merely conditional.'
  - severity: low
    issue: The linked prohibitions ‘do not covet ... and take’ are somewhat compressed as ‘ఆశించి ... తీసుకోవద్దు.’
    rationale: This can imply that only taking after coveting is prohibited. Stating both prohibitions separately is clearer while preserving the Hebrew sequence.
  revised_text: వారి దేవుళ్ల చెక్కిన ప్రతిమలను మీరు అగ్నితో కాల్చివేయాలి. వాటిపై ఉన్న వెండినీ బంగారాన్నీ నీవు ఆశించవద్దు; వాటిని నీ కోసం తీసుకోవద్దు. లేకపోతే దానివల్ల నీవు ఉచ్చులో చిక్కుకుంటావు[a], ఎందుకంటే అది నీ దేవుడైన యాహ్వేకు అసహ్యకరమైనది.
