revisions:
- from: వారి దేవుళ్ల చెక్కిన ప్రతిమలను మీరు అగ్నితో కాల్చివేయాలి. వాటి మీద ఉన్న వెండినీ బంగారాన్నీ[a] నీవు ఆశించి, నీ కోసం తీసుకోవద్దు; అలా చేస్తే దానివల్ల నీవు ఉచ్చులో చిక్కుకుంటావు[b]. ఎందుకంటే అది నీ దేవుడైన యాహ్వేకు అసహ్యమైనది.
  to: వారి దేవుళ్ల చెక్కిన ప్రతిమలను మీరు అగ్నితో కాల్చివేయాలి. వాటిపై ఉన్న వెండినీ బంగారాన్నీ నీవు ఆశించవద్దు; వాటిని నీ కోసం తీసుకోవద్దు. లేకపోతే దానివల్ల నీవు ఉచ్చులో చిక్కుకుంటావు[a], ఎందుకంటే అది నీ దేవుడైన యాహ్వేకు అసహ్యకరమైనది.
  rationale: The revision preserves the source’s plural-to-singular address and the ambiguity of the final ‘అది,’ while making the פֶּן warning and the two prohibited actions more precise and natural in modern standard Telugu. The former footnote a is omitted because the Telugu main text retains the Hebrew coordination directly and does not require an ‘or’ explanation.
