source:
  edition: WLC
  text: כִּ֤י תֹאמַר֙ בִּ/לְבָ֣בְ/ךָ֔ רַבִּ֛ים הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִמֶּ֑/נִּי אֵיכָ֥ה אוּכַ֖ל לְ/הוֹרִישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: te
  text: “ఈ జాతులు నాకంటే ఎక్కువ సంఖ్యలో ఉన్నాయి; నేను వారిని ఎలా వెళ్లగొట్టగలను[a]?” అని నీ హృదయంలో ఇలా అనుకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని వారి భూమి స్వాధీనాన్ని కోల్పోయేలా చేయగలను?” హీబ్రూ క్రియ వారికి ఆ దేశంపై ఉన్న స్వాధీనాన్ని కోల్పోయేలా చేయడమనే భావాన్ని కలిగివుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר בִּלְבָבְךָ
  choice: అని నీ హృదయంలో నీవు అనుకుంటే
  rationale: כִּי ఇక్కడ షరతును సూచిస్తుంది. תֹאמַר అంటే అక్షరార్థంగా ‘చెబితే’; అయితే ‘హృదయంలో చెప్పుకోవడం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అంతరంగ ఆలోచనగా ‘అనుకుంటే’ అని తెలిపాం, ‘హృదయం’ అనే మూలపాఠ చిత్రాన్ని కూడా నిలిపాం.
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: ఈ జనాలు నాకంటే ఎక్కువమంది
  rationale: מִמֶּנִּי పోలికను సూచిస్తుంది; ఏకవచనంలో సంబోధించబడుతున్న వ్యక్తితో పోలిస్తే ఆ జనాలు సంఖ్యలో అధికమనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. גּוֹיִם ఇక్కడ దేశపేర్లకన్నా భూభాగంలోని ప్రజాసమూహాలను సూచిస్తున్నందున ‘జనాలు’ ఎంచుకున్నాం.
- source_word: אֵיכָה אוּכַל
  choice: నేను … ఎలా … గలను?
  rationale: ప్రశ్న సాధ్యత లేదా సామర్థ్యాన్ని వ్యక్తం చేస్తుంది. తెలుగు ప్రశ్నా నిర్మాణంలో కర్తను స్పష్టంగా ఉంచడం సహజం.
- source_word: לְהוֹרִישָׁם
  choice: వారిని ఎలా వెళ్లగొట్టగలను
  rationale: ירש యొక్క హిఫిల్ రూపం ఈ భూస్వాధీన సందర్భంలో వారిని ఆ భూమిపై స్వాధీనం కోల్పోయేలా చేయడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘వెళ్లగొట్టు’ వాడి, స్వాధీన భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
