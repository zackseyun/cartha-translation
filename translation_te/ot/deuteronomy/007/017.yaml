translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన సంబోధనను నిలిపి, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని ఉపయోగించాం. వాక్యం తదుపరి వచనంతో కొనసాగుతున్న షరతు వాక్యమని చూపేందుకు చివర కామా ఉంచాం.
