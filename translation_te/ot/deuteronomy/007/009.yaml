id: DEU.7.9
reference: Deuteronomy 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: te
  text: కాబట్టి నీ దేవుడైన యెహోవా, ఆయనే దేవుడు అని తెలుసుకో[a]. ఆయన నమ్మకమైన దేవుడు; తనను ప్రేమించేవారికీ, తన ఆజ్ఞలను పాటించేవారికీ[d] వెయ్యి తరాల వరకు[c] నిబంధనను, నిబద్ధమైన ప్రేమను[b] నిలబెట్టేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరియు తెలుసుకో’ లేదా ‘అందుచేత తెలుసుకో.’ హీబ్రూ సంధిపదం ముందున్న మాటను కేవలం కొనసాగించవచ్చు లేదా దానినుంచి వచ్చే నిర్ధారణను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: חֶסֶד (ఖెసెద్). దీనిని ‘నిలకడైన ప్రేమ,’ ‘నిబంధన నిబద్ధత,’ లేదా ‘కరుణ’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వెయ్యి తరాలపాటు.’ ఈ మాట అపారమైన కాలమంతా కొనసాగే నిబంధన విశ్వసనీయతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘తనను ప్రేమించేవారికీ, తన ఆజ్ఞలను పాటించేవారికీ, వెయ్యి తరాల వరకు.’ ‘వెయ్యి తరాల వరకు’ అనే మాట మొత్తం నిబంధన వాగ్దానపు కాలవ్యాప్తిని సూచిస్తుంది.
    reason: previous_rendering
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: కాబట్టి ... తెలుసుకో
  rationale: Qal perfect రెండవ పురుష ఏకవచన రూపం ఈ సందర్భంలో ఆదేశాత్మక బలంతో ఉంది. ముందున్న వాదననుంచి వచ్చే నిర్ధారణను וְ సూచించగలదని ‘కాబట్టి’తో వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; దానిని సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో అనువదించాం.
- source_word: הוּא הָאֱלֹהִים
  choice: యెహోవాయే దేవుడు
  rationale: హీబ్రూ సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగు ‘-యే’ ద్వారా చూపించాం; వాక్యంలోని ప్రత్యేకతను నిలిపాం.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: నమ్మకమైన దేవుడు
  rationale: נֶאֱמָןలోని స్థిరత్వం, విశ్వసనీయత, నిబంధనపట్ల నిబద్ధత అనే భావాలను సంక్షిప్తంగా ‘నమ్మకమైన’ వ్యక్తం చేస్తుంది.
- source_word: שֹׁמֵר
  choice: నిలబెట్టేవాడు
  rationale: దేవుని కొనసాగుతున్న క్రియను సూచించే కృదంతాన్ని తెలుగులో లక్షణాత్మక క్రియారూపంగా ఇచ్చాం. నిబంధనను అమలులో ఉంచడం, ప్రేమను కొనసాగించడం రెండింటికీ ‘నిలబెట్టడం’ సహజంగా సరిపోతుంది.
- source_word: הַבְּרִית
  choice: నిబంధన
  rationale: దైవ-మానవ ఒడంబడికకు తెలుగు బైబిలు భాషలో స్థిరపడిన, గౌరవప్రదమైన పదాన్ని వాడాం.
- source_word: וְהַחֶסֶד
  choice: నిలకడైన ప్రేమ
  rationale: חֶסֶדలోని ప్రేమ, నిబద్ధత, కరుణ, నిబంధన విశ్వసనీయత అన్న ఛాయలను ఒకే సంక్షిప్త పదబంధంలో సాధ్యమైనంతవరకు నిలిపాం.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: తనను ప్రేమించేవారికీ, తన ఆజ్ఞలను పాటించేవారికీ
  rationale: రెండు సమాంతర కృదంత పదబంధాలను సమాంతర తెలుగు నిర్మాణంలో ఉంచాం. לְను లబ్ధిదారులను సూచించే ‘-కి’ విభక్తితో వ్యక్తం చేశాం.
- source_word: לְאֶלֶף דּוֹר
  choice: వెయ్యి తరాల వరకు
  rationale: అపారంగా దీర్ఘకాలం కొనసాగే నిబంధన విశ్వసనీయతను సూచించే హీబ్రూ నుడికారాన్ని దాని తరాల రూపకంతోనే నిలిపాం.
theological_decisions:
- issue: దేవుని నిబంధన విశ్వసనీయతకు మానవ ప్రేమ, విధేయతతో ఉన్న సంబంధం
  choice: దేవుడు తనను ప్రేమించి తన ఆజ్ఞలను పాటించేవారికి నిబంధనను, నిలకడైన ప్రేమను నిలబెట్టేవాడని నేరుగా అనువదించడం
  alternative: ఈ వాక్యంలోని షరతును మృదువుచేసి దేవుని ప్రేమను ఎటువంటి సంబంధ సూచన లేకుండా సాధారణ ప్రకటనగా ఇవ్వడం
  rationale: మూలవాక్యం దేవుని విశ్వసనీయతను మానవ నిబంధన ప్రేమ, విధేయతలతో కలిపి చెబుతుంది. తరువాతి సిద్ధాంత వ్యవస్థతో ఈ ఉద్రిక్తతను తొలగించకుండా మూలంలోని సంబంధాన్ని అలాగే ఉంచాం.
- issue: הוּא הָאֱלֹהִיםలోని ప్రత్యేక ఉద్ఘాటన
  choice: ‘యెహోవాయే దేవుడు’
  alternative: ‘యెహోవా దేవుడు’
  rationale: సర్వనామం మరియు నిర్దిష్ట రూపం ఇచ్చే ఉద్ఘాటనను ‘-యే’తో చూపించడం ద్వారా వాక్యపు ఒప్పుకోలు, ప్రత్యేకత నిలుస్తాయి; అయితే మూలం కంటే విస్తరించిన సిద్ధాంత పదజాలం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణాన్ని వాడాం. ‘యెహోవా,’ ‘నిబంధన,’ ‘ఆజ్ఞలు’ వంటి సుపరిచిత బైబిలు పదాలను నిలిపి, అతి ప్రాచీన క్రియారూపాలను నివారించాం. ఏకవచన ‘నీ’ మూలంలోని 2ms సంబోధనను ప్రతిబింబిస్తుంది.
