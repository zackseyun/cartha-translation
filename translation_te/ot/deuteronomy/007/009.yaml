  to: కాబట్టి నీ దేవుడైన యెహోవా, ఆయనే దేవుడు అని తెలుసుకో[a]. ఆయన నమ్మకమైన దేవుడు; తనను ప్రేమించేవారికీ, తన ఆజ్ఞలను పాటించేవారికీ[d] వెయ్యి తరాల వరకు[c] నిబంధనను, నిబద్ధమైన ప్రేమను[b] నిలబెట్టేవాడు.
  rationale: దైవనామం తర్వాత ‘ఆయనే దేవుడు’ని చేర్చి హీబ్రూ הוּא הָאֱלֹהִיםలోని ఉద్ఘాటనను స్పష్టపరిచాం. חֶסֶדకు ‘నిబద్ధమైన ప్రేమ’ని ఉపయోగించి నిబంధన సందర్భంలోని ప్రేమ, విశ్వాస్యత రెండింటినీ సహజంగా వ్యక్తం చేశాం. మిగిలిన నిర్మాణం మూలంలోని లబ్ధిదారులు, ఆజ్ఞాపాలన, మరియు ‘వెయ్యి తరాలు’ అనే కాలవ్యాప్తిని యథాతథంగా ఉంచుతుంది.
