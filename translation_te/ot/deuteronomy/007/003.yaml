id: DEU.7.3
reference: Deuteronomy 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: te
  text: వారితో వివాహ సంబంధాలు పెట్టుకోవద్దు. నీ కుమార్తెను అతని కుమారునికి ఇవ్వవద్దు; అతని కుమార్తెను నీ కుమారుని కోసం తీసుకోవద్దు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: వివాహ సంబంధాలు పెట్టుకోవద్దు
  rationale: חתן యొక్క హిత్పయేల్ రూపం పరస్పరంగా వివాహ బంధాల్లో ప్రవేశించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వివాహ సంబంధాలు పెట్టుకోవడం’ అనే ప్రయోగం ఈ సామాజిక-పరస్పర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּם
  choice: వారితో
  rationale: మూడవ పురుష బహువచన ప్రత్యయం ముందటి సందర్భంలో పేర్కొన్న జనాలను సూచిస్తుంది; ‘వారితో’ వివాహ సంబంధం అనే ప్రయోగానికి సరిపోతుంది.
- source_word: בִּתְּךָ
  choice: నీ కుమార్తెను
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న స్త్రీలింగ బంధుత్వ పదాన్ని నేరుగా అనువదించింది.
- source_word: תִתֵּן
  choice: ఇవ్వవద్దు
  rationale: హీబ్రూ క్రియ యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలిపింది; వివాహ సందర్భం వల్ల అదనంగా ‘పెళ్లికి’ అని చేర్చాల్సిన అవసరం లేదు.
- source_word: לִבְנוֹ
  choice: అతని కుమారునికి
  rationale: లామెద్ సూచించే పరోక్ష కర్మను సహజమైన తెలుగు విభక్తితో వ్యక్తం చేసింది.
- source_word: וּבִתּוֹ
  choice: అతని కుమార్తెను
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న పదాన్ని నేరుగా అనువదించింది.
- source_word: תִקַּח
  choice: తీసుకోవద్దు
  rationale: మూలంలోని ‘తీసుకొను’ అనే క్రియను నిలిపింది; ఇక్కడ వివాహార్థం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: לִבְנֶךָ
  choice: నీ కుమారుని కోసం
  rationale: లామెద్ సంబంధాన్ని సహజమైన తెలుగులో ‘కోసం’తో తెలిపింది; కుమారునికి భార్యగా తీసుకోవడమనే సందర్భార్థం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: నిషేధపు పరిధి
  choice: ముందటి సందర్భంలో పేర్కొన్న జనాలతో వివాహ సంబంధాలు పెట్టుకోవడంపై నిషేధంగా అనువదించడం
  alternative: అన్ని విదేశీయులతో వివాహానికి సాధారణ నిషేధంగా విస్తరించడం
  rationale: ‘వారితో’ అనే పదం ముందటి వచనాల్లో పేర్కొన్న జనాలను సూచిస్తుంది. తరువాతి వచనంలోని కారణాన్ని గాని, దీనికి మించిన విస్తృత పరిధిని గాని ఈ వచనంలో చేర్చలేదు.
- issue: లింగాన్ని సూచించే కుటుంబ పదాలు
  choice: మూలంలోని ఏకవచన ‘కుమార్తె’, ‘కుమారుడు’ పదాలను నిలిపివేయడం
  alternative: ‘పిల్లలు’ వంటి లింగనిరపేక్ష సమూహ పదాలను వాడడం
  rationale: హీబ్రూలో ప్రతినిధి న్యాయ సూత్రంగా లింగనిర్దిష్ట ఏకవచన బంధుత్వ పదాలు ఉన్నాయి; వాటిని యథాతథంగా ప్రతిబింబించడం మూలానికి నిబద్ధం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ ఆజ్ఞా శైలిని ఉపయోగించింది. ‘వివాహ సంబంధాలు పెట్టుకోవద్దు’ పరస్పర వివాహ బంధాల భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాతి రెండు వాక్యాలు మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతాయి.
