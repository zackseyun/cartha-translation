revisions:
- from: ఎందుకంటే, అతడు నీ కుమారుణ్ణి నన్ను అనుసరించకుండా పక్కకు మళ్లిస్తాడు[a]; అప్పుడు వారు ఇతర దేవుళ్లను సేవిస్తారు[b]. అప్పుడు యెహోవా[c] కోపం మీ మీద రగులుకొని, ఆయన నిన్ను త్వరగా నాశనం చేస్తాడు.
  to: ఎందుకంటే అతడు నీ కుమారుణ్ణి నన్ను అనుసరించకుండా చేస్తాడు[a]; వారు ఇతర దేవుళ్లను సేవిస్తారు[b]. అప్పుడు యెహోవా[c] కోపం మీమీద రగులుతుంది, ఆయన నిన్ను త్వరగా నాశనం చేస్తాడు.
  rationale: సంఖ్యా మార్పుల విషయంలో మూలపాఠంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలుపుతూ, బహువచన క్రియకు పాదసూచిక ఇచ్చిన తప్పుదారి పట్టించే పాఠాంతర సూచనను సరిచేశాను. కారణార్థాన్ని సహజ తెలుగు నిర్మాణంలో స్పష్టపరచి, తీర్పు వాక్యంలోని క్రియలను సమాంతరంగా చేశాను.
