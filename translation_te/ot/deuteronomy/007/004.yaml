    rationale: వ్ల్క్ పాఠంలో וְעָבְדוּ స్పష్టంగా బహువచన క్రియ. ఏకవచన అనువాదం సాధ్యమైన వ్యాఖ్యానాత్మక సమానీకరణ కావచ్చు, కానీ దాన్ని పాఠాంతర పఠనంలా పేర్కొనరాదు.
