id: DEU.7.4
reference: Deuteronomy 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: te
  text: ఎందుకంటే అతడు నీ కుమారుణ్ణి నన్ను అనుసరించకుండా చేస్తాడు[a]; వారు ఇతర దేవుళ్లను సేవిస్తారు[b]. అప్పుడు యెహోవా[c] కోపం మీమీద రగులుతుంది, ఆయన నిన్ను త్వరగా నాశనం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారంలో అక్షరార్థం: ‘నా వెనుకనుండి’; భావం: ‘నన్ను అనుసరించకుండా.’'
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠంలో ‘నీ కుమారుడు’ ఏకవచనం; ‘వారు సేవిస్తారు’ బహువచనం. ఈ మార్పు కుటుంబానికో సమాజానికో విస్తరించే పరిణామాన్ని సూచించవచ్చు. అనువాదంలో భావసామరస్యం కోసం ‘అతడు సేవిస్తాడు’ అని ఏకవచనంగా చేయవచ్చు, కానీ హీబ్రూ క్రియ బహువచనంలోనే ఉంది.
    reason: alternative_reading
  - marker: c
    text: ‘యెహోవా’ అనేది יהוה (YHWH) అనే దైవనామానికి తెలుగు రూపం; కొన్ని అనువాదాలు దీనిని ‘ప్రభువు’ అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందరి వచనంలోని నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יָסִיר
  choice: పక్కకు మళ్లిస్తాడు
  rationale: సూర్ ధాతువు హిఫిల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּנְךָ
  choice: నీ కుమారుణ్ణి
  rationale: హీబ్రూలోని పుంలింగ ఏకవచనాన్ని, ముందరి వచన సందర్భాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: מֵאַחֲרַי
  choice: నన్ను అనుసరించకుండా
  rationale: అక్షరార్థంగా ‘నా వెనుకనుండి’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు భావానువాదం.
- source_word: וְעָבְדוּ
  choice: వారు ... సేవిస్తారు
  rationale: ఏకవచనమైన ‘నీ కుమారుడు’ తరువాత మూలపాఠంలో ఉన్న బహువచన క్రియను సరిచేయకుండా నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: ప్రత్యక్షమైన, సాధారణ తెలుగు అనువాదం; యెహోవాపట్ల ఏకనిష్ఠకు ఉన్న వ్యతిరేకతను నిలుపుతుంది.
- source_word: וְחָרָה אַף יְהוָה
  choice: యెహోవా కోపం ... రగులుకొని
  rationale: కోపం మండటం అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో సూచిస్తుంది.
- source_word: בָּכֶם
  choice: మీ మీద
  rationale: కోపం ఎవరికి విరోధంగా ఉందో సూచించే బహువచన ప్రత్యయాన్ని కాపాడుతుంది.
- source_word: וְהִשְׁמִידְךָ
  choice: ఆయన నిన్ను ... నాశనం చేస్తాడు
  rationale: హిఫిల్ క్రియలోని తీవ్రమైన నాశన భావాన్ని, ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: מַהֵר
  choice: త్వరగా
  rationale: తీర్పు వేగంగా సంభవిస్తుందనే హెచ్చరికను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హెచ్చరిక వాక్యంలోని ఏకవచన–బహువచన మార్పు
  choice: ‘నీ కుమారుణ్ణి’ అనే ఏకవచనానంతరం ‘వారు సేవిస్తారు’ అనే బహువచనాన్ని నిలుపడం
  alternative: ‘అతడు ఇతర దేవుళ్లను సేవిస్తాడు’ అని ఏకవచనంగా సరళీకరించడం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా లేదా సమూహార్థంగా కలిగి ఉండగల సంఖ్యా మార్పును పరిష్కరించకుండా కాపాడుతుంది.
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యహ్వే; ప్రభువు
  rationale: దైవనామాన్ని ఒక బిరుదుగా మార్చకుండా ఉంచుతూ, సాధారణ ఆధునిక తెలుగు వాడుకలో గుర్తించదగిన రూపాన్ని ఉపయోగిస్తుంది.
- issue: ‘మీ మీద’ తరువాత ‘నిన్ను’ అనే సంఖ్యా మార్పు
  choice: బహువచనం మరియు ఏకవచనం రెండింటినీ మూలపాఠం ప్రకారం నిలుపడం
  alternative: రెండింటినీ బహువచనంగా లేదా ఏకవచనంగా సమానీకరించడం
  rationale: ఇశ్రాయేలు సమాజాన్ని సమష్టిగానూ ఒక ఏకకంగానూ సంబోధించే హీబ్రూ ఉద్వేగాన్ని సవరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ఏకవచన–బహువచన మార్పులను ఉద్దేశపూర్వకంగా సరిచేయలేదు.
