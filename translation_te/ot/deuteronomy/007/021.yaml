base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: te
  text: వారి ఎదుట బెదిరిపోవద్దు[a]. ఎందుకంటే నీ దేవుడైన యాహ్వే నీ మధ్య ఉన్నాడు[b]; ఆయన గొప్పవాడూ భయభక్తిని కలిగించేవాడూ అయిన దేవుడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కారణంగా భయపడవద్దు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ ప్రజల మధ్య ఉన్నాడు.” ఇక్కడ “నీ” అనేది ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది.
    reason: clarification
  - marker: c
    text: లేదా, “విస్మయభయాన్ని కలిగించే దేవుడు.” హీబ్రూ పదం భయమిశ్రితమైన విస్మయాన్నీ గౌరవాన్నీ కలిగించే దేవుణ్ణి వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: వారిని చూసి బెదిరిపోవద్దు
  rationale: ערץ క్రియ తీవ్రమైన భయానికి లేదా బెదిరిపోవడానికి సూచిస్తుంది; מִפְּנֵיהֶם అనే ప్రయోగం శత్రువులను ఎదుర్కొన్నప్పుడు కలిగే భయాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు రూపం ఆ తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: దేవునికీ ఇశ్రాయేలుకీ ఉన్న నిబంధనా సంబంధాన్ని సూచించే ద్వితీయ పురుష ఏకవచన స్వామ్యరూపాన్ని స్పష్టంగా నిలిపాం.
- source_word: בְּקִרְבְּךָ
  choice: నీ మధ్య
  rationale: ఇది వ్యక్తి అంతరంగాన్ని కాక, ఇశ్రాయేలు సమాజం మధ్య దేవుని సన్నిధిని సూచిస్తుంది.
- source_word: אֵל גָּדוֹל
  choice: గొప్పవాడు ... దేవుడు
  rationale: אֵל‌ను ‘దేవుడు’గా, גָּדוֹל‌ను ‘గొప్పవాడు’గా అనువదించి మూలంలోని ఉపపద నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: וְנוֹרָא
  choice: భయభక్తులు కలిగించే
  rationale: נוֹרָא దేవుడు భయమిశ్రితమైన విస్మయాన్నీ గౌరవాన్నీ కలిగిస్తాడనే భావాన్ని ఇస్తుంది. ‘భయంకరమైన’ అనే పదం తెలుగులో ప్రతికూల క్రౌర్యభావాన్ని కలిగించవచ్చు కాబట్టి ఈ రూపం మూలంలోని భావపరిధిని మెరుగ్గా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నిబంధనా నామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: נוֹרָאలోని భయార్థం
  choice: భయభక్తులు కలిగించే
  alternative: భయంకరమైన; విస్మయం కలిగించే
  rationale: ఈ పదం కేవలం భీతిని గానీ, కేవలం ఆశ్చర్యాన్ని గానీ కాక, దేవుని మహిమ వల్ల కలిగే భయమిశ్రిత గౌరవాన్ని సూచించగలదు. ఆ ఉద్రిక్తతను నిలుపుకునే రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించాం. ‘బెదిరిపోవద్దు’ మూలంలోని తీవ్రమైన భయాన్ని తెలియజేస్తుంది; ‘నీ మధ్య’ సమాజమధ్య దైవసన్నిధిని నిలుపుతుంది. వాక్యాంతంలోని ఉపపదాన్ని తెలుగులో స్పష్టత కోసం ‘ఆయన’తో విభజించాం.
