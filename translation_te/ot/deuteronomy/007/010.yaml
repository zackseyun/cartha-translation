id: DEU.7.10
reference: Deuteronomy 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: te
  text: తనను ద్వేషించేవారిని నాశనం చేయడానికి, వారి ముఖం ఎదుటనే[a] వారికి ప్రతిఫలం చెల్లిస్తాడు. తనను ద్వేషించేవాని విషయంలో ఆయన ఆలస్యం చేయడు; అతని ముఖం ఎదుటనే అతనికి ప్రతిఫలం చెల్లిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని/వారి ముఖం వైపు.’ ఈ నుడికారానికి ‘అతని/వారి ఎదుట’ లేదా ‘అతని/వారి సమక్షంలో’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: హీబ్రూ אֶל־פָּנָיו నుడికారంలోని అక్షరార్థాన్ని, దానికి సాధ్యమైన సమక్షార్థాన్ని రెండింటినీ భద్రపరచడం.
lexical_decisions:
- source_word: וּמְשַׁלֵּם / יְשַׁלֶּם
  choice: ప్రతిఫలం చెల్లిస్తాడు
  rationale: שׁלם పియేల్ రూపం ఇక్కడ చేసినదానికి తగిన ప్రతిచర్యగా తిరిగి చెల్లించడాన్ని సూచిస్తుంది. ‘ప్రతిఫలం చెల్లిస్తాడు’ న్యాయపరమైన భావాన్ని, రెండు ప్రయోగాల మధ్య పదసంబంధాన్ని నిలుపుతుంది.
- source_word: לְשֹׂנְאָיו / לְשֹׂנְאוֹ
  choice: తనను ద్వేషించేవారు / తనను ద్వేషించేవాడు
  rationale: శత్రువులు అనే విస్తృత పదం కంటే, శత్రుత్వానికి మూలమైన ‘ద్వేషించడం’ అనే హీబ్రూ క్రియాభావాన్ని నేరుగా నిలుపుతుంది; మొదటి ప్రయోగంలోని బహువచనాన్ని, రెండవ ప్రయోగంలోని ఏకవచనాన్ని కూడా కాపాడుతుంది.
- source_word: אֶל־פָּנָיו
  choice: వారి/వాని ముఖం ఎదుటనే
  rationale: ముఖానికి సంబంధించిన హీబ్రూ నుడికారాన్ని స్పష్టంగా కనిపించేలా ఉంచుతూ, ప్రత్యక్షంగా వారి సమక్షంలోనే ప్రతిఫలం ఇవ్వడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְהַאֲבִידוֹ
  choice: నాశనం చేయడానికి
  rationale: אבד హిఫీల్ రూపంలోని నాశనం చేయడం అనే బలమైన క్రియార్థాన్ని, అలాగే అనంతక్రియలోని ఉద్దేశం లేదా ఫలితం మధ్య ఉండే సంబంధాన్ని అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: לֹא יְאַחֵר
  choice: ఆలస్యం చేయడు
  rationale: తీర్పును వాయిదా వేయడు అనే భావాన్ని ఆధునిక, సహజ తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పులో దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: దేవుడే ద్వేషించేవారికి ప్రతిఫలం చెల్లించి వారిని నాశనం చేస్తాడని ప్రత్యక్షంగా అనువదించడం
  alternative: వారి చర్యల వల్ల సహజంగానే వినాశకర పరిణామాలు కలుగుతాయని సాధారణీకరించడం
  rationale: హీబ్రూ వాక్యంలో దేవుడే చెల్లించడం, నాశనం చేయడం అనే క్రియలకు కర్త. ఆ కఠినమైన దైవిక తీర్పు భాషను వ్యక్తిరహిత పరిణామాలుగా మృదువుపరచలేదు.
- issue: לְהַאֲבִידוֹ లో ఉద్దేశం–ఫలితం సంబంధం
  choice: ‘నాశనం చేయడానికి’
  alternative: ‘నాశనం చేస్తూ’ లేదా ‘నాశనం చేయడం ద్వారా’
  rationale: హీబ్రూ అనంతక్రియ ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ‘చేయడానికి’ అని ఉంచడం నిర్మాణానికి దగ్గరగా ఉండి, వాక్యంలోని తీర్పు గమ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మొదటి భాగంలోని బహువచనం, రెండవ భాగంలోని ఏకవచనం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. ‘ముఖం ఎదుటనే’ అనే పునరుక్తి మూలంలోని బలమైన పునరావృతిని ప్రతిబింబిస్తుంది.
