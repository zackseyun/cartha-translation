  - severity: low
    issue: “తప్పక జ్ఞాపకం చేసుకోవాలి” is less directly addressed than the Hebrew exhortation.
    rationale: The Hebrew emphatic verbal construction addresses the hearer directly. “తప్పక జ్ఞాపకం చేసుకో” preserves both direct address and emphasis in natural modern Telugu.
