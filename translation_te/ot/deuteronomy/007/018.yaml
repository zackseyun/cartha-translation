id: DEU.7.18
reference: Deuteronomy 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: te
  text: నీవు వారికి భయపడకూడదు; నీ దేవుడైన యాహ్వే ఫరోకు, ఐగుప్తు అంతటికీ ఏమి చేశాడో తప్పక జ్ఞాపకం చేసుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “జ్ఞాపకం చేసుకో, జ్ఞాపకం చేసుకో” అనే ఉద్ఘాటనాత్మక నిర్మాణం ఉంది; దాని అర్థం “తప్పక జ్ఞాపకం చేసుకో” లేదా “బాగా జ్ఞాపకం ఉంచుకో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: నీవు వారికి భయపడకూడదు
  rationale: לֹא తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ నిషేధార్థక ఆజ్ఞగా పనిచేస్తుంది. מִן భయానికి గురిచేసే వారిని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘వారికి భయపడకూడదు’ అని అనువదించాం.
- source_word: זָכֹר תִּזְכֹּר
  choice: తప్పక జ్ఞాపకం చేసుకోవాలి
  rationale: క్రియావిశేషక ధాతురూపం మరియు అసంపూర్ణ క్రియ కలయిక జ్ఞాపకం చేసుకోవడాన్ని బలంగా నొక్కి చెబుతుంది. ‘తప్పక’ ఆ ఉద్ఘాటనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ఏమి చేశాడో
  rationale: పూర్తయిన చారిత్రక కార్యాన్ని సూచించే హెబ్రీ నుడికారానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమిష్టిగా ఏకవచనంలో సంబోధిస్తుంది; అందువల్ల ‘నీ దేవుడు’ సరళమైన సమానార్థకం.
- source_word: לְפַרְעֹה
  choice: ఫరోకు
  rationale: עשה తో ל క్రియ ప్రభావం పొందిన వ్యక్తిని సూచిస్తుంది; ‘ఫరోకు ఏమి చేశాడో’ మూల నిర్మాణాన్ని, తీర్పు సందర్భాన్ని నిలుపుతుంది.
- source_word: וּלְכָל מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటికీ
  rationale: మూలం ప్రజలను మాత్రమే కాక ఐగుప్తును సమిష్టిగా సూచిస్తుంది. ‘దేశమంతటికీ’ ఆ విస్తృతిని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పండితీయ పునర్నిర్మాణం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఏకవచన సంబోధనను నిలిపి, హెబ్రీ ఉద్ఘాటనను ప్రధాన వాక్యంలో సహజంగా వ్యక్తం చేశాం.
