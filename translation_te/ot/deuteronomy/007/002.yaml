  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే వారిని నీ ఎదుట నీకు అప్పగించి, నీవు వారిని కొట్టినప్పుడు, నీవు వారిని పూర్తిగా నాశనానికి అంకితం చేయాలి[a]. వారితో నిబంధన చేసుకోకూడదు; వారిపై అనుగ్రహం చూపకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని పూర్తిగా నాశనం చేయాలి,” లేదా “వారిని పూర్తిగా నిషేధం కింద ఉంచాలి.” హీబ్రూలో ఒకే ధాతువుతో ఏర్పడిన బలప్రయోగ నిర్మాణం ఉంది; అది వారిని సంపూర్ణంగా నాశనానికి అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిపై కనికరం చూపకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: వారిని నీ ఎదుట నీకు అప్పగించి
  rationale: సైనిక సందర్భంలో נתן శత్రువులను ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. మూలంలోని దైవిక కార్యసాధకత్వాన్ని, לְפָנֶיךָ అనే ‘నీ ఎదుట’ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో అందించింది.
- source_word: וְהִכִּיתָם
  choice: నీవు వారిని ఓడించినప్పుడు
  rationale: యుద్ధ సందర్భంలో נכה కొట్టడం ద్వారా జయించడం లేదా ఓడించడాన్ని సూచిస్తుంది. తెలుగులో ‘ఓడించినప్పుడు’ సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: వారిని పూర్తిగా నాశనానికి అంకితం చేయాలి
  rationale: అదే ధాతువుతో వచ్చిన infinitive absolute మరియు finite verb నిర్మాణం సంపూర్ణతను బలపరుస్తుంది. ‘నాశనం చేయాలి’ అని మాత్రమే సరళీకరించకుండా חרם లోని ప్రత్యేక అంకితభావాన్ని కూడా నిలుపుతుంది.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: వారితో నిబంధన చేసుకోకూడదు
  rationale: כרת ברית అనే హీబ్రూ నుడికారం తెలుగులో సహజంగా ‘నిబంధన చేసుకోవడం’గా వ్యక్తమవుతుంది; ఒప్పందం అనే పరిమిత రాజకీయ అర్థానికి కుదించదు.
- source_word: וְלֹא תְחָנֵּם
  choice: వారిపై అనుగ్రహం చూపకూడదు
  rationale: חנן యొక్క ప్రాథమిక భావమైన కృప లేదా అనుగ్రహం చూపడాన్ని ప్రతిబింబిస్తుంది. సందర్భానుసారమైన ‘కనికరం’ అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: పవిత్రయుద్ధ సందర్భంలో חרם పదబంధం
  choice: పూర్తిగా నాశనానికి అంకితం చేయాలి
  alternative: పూర్తిగా నాశనం చేయాలి; నిషేధానికి లోబరచాలి
  rationale: ఈ అనువాదం సంపూర్ణ విధ్వంసాన్ని దాచకుండా, חרם లోని దైవానికి ప్రత్యేకంగా అప్పగించే ఆచార-వేదాంతపరమైన బలాన్నీ నిలుపుతుంది.
- issue: תְחָנֵּם పదం
  choice: అనుగ్రహం చూపకూడదు
  alternative: కనికరం చూపకూడదు
  rationale: మూల ధాతువులోని కృప లేదా అనుగ్రహ భావానికి ప్రధాన పాఠంలో ప్రాధాన్యం ఇచ్చి, సందర్భంలో సాధ్యమైన ‘కనికరం’ భావాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని దైవిక కార్యసాధకత్వం, యుద్ధ తీవ్రత, חרם యొక్క ప్రత్యేక అంకిత భావం, חנן లోని అనుగ్రహం/కనికరం అర్థవిస్తృతి నిలుపబడ్డాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
