- from: నీ దేవుడైన యెహోవా వారిని నీ ఎదుట నీకు అప్పగించి, నీవు వారిని ఓడించినప్పుడు, వారిని పూర్తిగా నాశనానికి అంకితం చేయాలి[a]. వారితో నిబంధన చేసుకోకూడదు; వారిపై అనుగ్రహం చూపకూడదు[b].
  to: నీ దేవుడైన యాహ్వే వారిని నీ ఎదుట నీకు అప్పగించి, నీవు వారిని కొట్టినప్పుడు, నీవు వారిని పూర్తిగా నాశనానికి అంకితం చేయాలి[a]. వారితో నిబంధన చేసుకోకూడదు; వారిపై అనుగ్రహం చూపకూడదు[b].
  rationale: The revision aligns the divine name with the POB audit trail, more closely represents the military force of וְהִכִּיתָם, and improves the Telugu alternative for חרם. It retains the source's intensified total-devotion language and does not add doctrinal interpretation.
