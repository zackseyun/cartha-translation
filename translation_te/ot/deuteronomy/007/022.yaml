id: DEU.7.22
reference: Deuteronomy 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే ఈ జనాలను నీ ఎదుట నుండి కొద్దికొద్దిగా తరిమివేస్తాడు.[a] నీవు వారిని త్వరగా అంతం చేయలేవు; లేకపోతే అడవి జంతువులు[b] నీకు విపరీతంగా పెరిగిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ జనాలను నీ ఎదుట నుండి కొద్దికొద్దిగా తొలగిస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పొలంలోని జంతువు.’ ఈ పదబంధం బహిరంగ ప్రదేశాల్లో ఉండే వన్యజంతువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: వెళ్లగొడతాడు
  rationale: ఈ సందర్భంలో దేశంలోనుండి జనాలను తొలగించి, వారి స్వాధీనాన్ని పోగొట్టే భావం ఉంది. ‘వెళ్లగొడతాడు’ సైనిక-ప్రాదేశిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: הַגּוֹיִם הָאֵל
  choice: ఆ జనాలను
  rationale: גּוֹיִם ఇక్కడ కనాను ప్రాంతపు జనసమూహాలను సూచిస్తుంది. ముందరి సందర్భంలో పేర్కొన్న వారిని తెలుగులో సహజంగా సూచించడానికి ‘ఆ జనాలను’ ఎంచుకున్నాం.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుండి
  rationale: మూలంలోని స్థలసంబంధమైన ‘నీ ముఖం ఎదుటనుండి’ అనే భావాన్ని సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: מְעַט מְעָט
  choice: కొద్దికొద్దిగా
  rationale: హీబ్రూలోని పదపునరుక్తిని, క్రమంగా జరిగే చర్యను తెలుగు పునరుక్తితో నిలుపుతుంది.
- source_word: לֹא תוּכַל
  choice: నీవు ... చేయలేవు
  rationale: ముందున్న కాలసందర్భంలో సామర్థ్యలేమిని సూటిగా వ్యక్తం చేస్తుంది; దీనిని ఆజ్ఞగా మార్చదు.
- source_word: כַּלֹּתָם
  choice: వారిని ... అంతం చేయడం
  rationale: כלה ఇక్కడ వారిని పూర్తిగా లేకుండా చేయడం అనే భావాన్ని కలిగి ఉంది. ‘అంతం చేయడం’ పూర్తి ముగింపును గంభీరమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַהֵר
  choice: త్వరగా
  rationale: వేగాన్ని సూచించే మూల క్రియావిశేషణానికి సూటి, సాధారణ తెలుగు సమానం.
- source_word: פֶּן
  choice: అలా చేస్తే
  rationale: వారిని త్వరగా అంతం చేయడం వల్ల సంభవించగల ప్రమాదాన్ని తెలుగు కారణ-హెచ్చరిక నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּרְבֶּה
  choice: విస్తరించిపోతాయి
  rationale: సంఖ్య పెరగడం, విపరీతంగా వ్యాపించడం అనే భావాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: חַיַּת הַשָּׂדֶה
  choice: పొలాల్లో తిరిగే అడవి జంతువులు
  rationale: అక్షరార్థంగా ‘పొలపు/బయటి ప్రదేశపు జంతువు.’ పెంపుడు జంతువులకు భిన్నమైన వన్యజంతువుల భావాన్ని, ‘పొలం’ అనే మూలచిత్రాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: עָלֶיךָ
  choice: నీకు ప్రమాదకరంగా
  rationale: עַל యొక్క దిశాత్మక/వ్యతిరేక ప్రభావాన్ని ఈ హెచ్చరిక సందర్భంలో సహజమైన తెలుగులో తెలియజేస్తుంది; జంతువుల పెరుగుదల ఇశ్రాయేలుకు ముప్పుగా మారుతుందనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ధ్వన్యనుకరిస్తే మూలంలోని నామస్వరూపం నిలుస్తుంది.
- issue: לֹא תוּכַל యొక్క విధి
  choice: సామర్థ్యలేమి—‘చేయలేవు’
  alternative: నిషేధం—‘చేయకూడదు’
  rationale: మూలరూపం సాధారణంగా ‘నీవు చేయగలవు కాదు’ అనే సామర్థ్య భావాన్ని ఇస్తుంది. సందర్భంలో ఆచరణాత్మక హెచ్చరిక ఉన్నా, దాన్ని నేర ఆజ్ఞగా మార్చకుండా అసలు ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘కొద్దికొద్దిగా’ ద్వారా హీబ్రూ పునరుక్తి నిలుపబడింది. దైవనామం ‘యాహ్వే’గా అందించబడింది; ‘అంతం చేయడం’ మూలంలోని సంపూర్ణ ముగింపు భావాన్ని అతిగా విస్తరించకుండా తెలియజేస్తుంది.
