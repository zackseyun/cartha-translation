id: DEU.7.12
reference: Deuteronomy 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: te
  text: మీరు ఈ న్యాయవిధులను[a] విని, వాటిని పాటించి ఆచరిస్తే, నీ దేవుడైన యహ్వే నీ కోసం, నీ పితరులకు[c] తాను ప్రమాణం చేసిన నిబంధననూ నిలకడగల ప్రేమనూ[b] కాపాడుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘న్యాయవిధులు’కు ‘తీర్పులు,’ ‘నియమాలు,’ లేదా ‘శాసనాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిలకడగల ప్రేమ’ అని అనువదించిన హీబ్రూ పదం హెసెద్; ఇది తరచుగా నిబంధనకు కట్టుబడిన విశ్వసనీయ ప్రేమను సూచిస్తుంది. ‘నిబంధన విశ్వసనీయత’ లేదా ‘కృపగల వాత్సల్యం’ అనే భావాలూ ఇందులో ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: ‘పితరులు’కు ‘పూర్వీకులు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం అక్షరార్థంగా ‘పితరులు’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: ఆచరించినందువల్ల
  rationale: ఈ హీబ్రూ ప్రయోగం తరువాత చెప్పబడే విధేయతను ఆధారంగా చేసుకొని కలిగే ఫలితాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండే కారణార్థక నిర్మాణం ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: תִּשְׁמְעוּן
  choice: విని
  rationale: שׁמע అనే పదంలో వినడమూ దానికి స్పందించడమూ ఉన్నాయి. వెంటనే ‘పాటించి ఆచరించడం’ అని రావడం వల్ల ‘విని’ అనే అనువాదం మూలంలోని శ్రవణ భావాన్ని నిలుపుతూ అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ఈ న్యాయవిధులను
  rationale: מִשְׁפָּטִים ఇక్కడ అధికారపూర్వకమైన న్యాయ నియమాలు లేదా తీర్పులను సూచిస్తుంది. ‘న్యాయవిధులు’ చట్టపరమైన భావాన్ని నిలుపుతుంది.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని పాటించి ఆచరించిన
  rationale: మూలంలో ఉన్న ‘కాపాడడం/పాటించడం’ మరియు ‘చేయడం’ అనే రెండు క్రియల భావాలను ‘పాటించి ఆచరించడం’ ద్వారా వేరువేరుగా నిలిపాం.
- source_word: וְשָׁמַר
  choice: నిలబెడతాడు
  rationale: నిబంధనను కాపాడి కొనసాగించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఇశ్రాయేలు విధులను పాటించడానికీ యహ్వే నిబంధనను నిలబెట్టడానికీ మూలంలో ఉన్న భావసంబంధాన్ని కూడా ఇది కాపాడుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితప్రాయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: హీబ్రూలోని రెండవ పురుష ఏకవచన సంబంధాన్ని నిలిపాం. వాక్యం మొదట బహువచనంతో సమాజాన్ని ఉద్దేశించి, తరువాత ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధిస్తుంది.
- source_word: לְךָ
  choice: నీ కోసం
  rationale: ఈ విభక్తి నిబంధనను నిలబెట్టడం వల్ల ప్రయోజనం పొందే వ్యక్తిని లేదా సమాజాన్ని సూచిస్తుంది.
- source_word: הַבְּרִית
  choice: నిబంధనను
  rationale: בְּרִיתకు స్థిరమైన, సందర్భోచితమైన తెలుగు సమానార్థకం ‘నిబంధన’.
- source_word: הַחֶסֶד
  choice: నిలకడగల ప్రేమను
  rationale: חֶסֶדలో ప్రేమ, విశ్వసనీయత, నిబంధన పట్ల నిబద్ధత కలిసి ఉన్నాయి. ‘నిలకడగల ప్రేమ’ ఈ relational మరియు covenantal భావాలను అతిగా సంకుచితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: తాను ప్రమాణం చేసిన
  rationale: שׁבע ఇక్కడ ప్రమాణపూర్వకంగా మాట ఇవ్వడాన్ని సూచిస్తుంది; ‘ప్రమాణం చేసిన’ దాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לַאֲבֹתֶיךָ
  choice: నీ పితరులతో
  rationale: మూలంలోని אָבוֹת masculine plural రూపం ఇశ్రాయేలు పితరులను సూచిస్తుంది. ‘పితరులు’ ఆ నిర్దిష్టతను నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలో חֶסֶד అనువాదం
  choice: నిలకడగల ప్రేమ
  alternative: నిబంధన విశ్వసనీయత; కృప; వాత్సల్యం
  rationale: ఈ పదం కేవలం భావోద్వేగ ప్రేమనో, కేవలం చట్టపరమైన విశ్వసనీయతనో మాత్రమే సూచించదు. ‘నిలకడగల ప్రేమ’ కృపగల అనురాగానికీ నిబద్ధమైన విశ్వసనీయతకీ మధ్యనున్న మూలభాషా విస్తృతిని కాపాడుతుంది.
- issue: సంబోధనలో బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: ‘మీరు’ తరువాత ‘నీ దేవుడైన… నీ కోసం… నీ పితరులతో’
  alternative: వాక్యమంతా బహువచనంలో సమతలీకరించడం
  rationale: హీబ్రూలో విధులను వినేవారి క్రియలు బహువచనంలో ఉండగా, אֱלֹהֶיךָ మొదలైన సంబంధరూపాలు ఏకవచనంలో ఉన్నాయి. ఇది సమాజంలోని ప్రజలను ఉద్దేశించి, ఇశ్రాయేలును ఒక సమష్టిగా సంబోధించే ఉద్వేగాన్ని కలిగి ఉండవచ్చు; దాన్ని మౌనంగా తొలగించలేదు.
- issue: לַאֲבֹתֶיךָలో లింగనిర్దిష్ట సూచన
  choice: నీ పితరులతో
  alternative: నీ పూర్వీకులతో
  rationale: మూలపాఠం ప్రత్యేకంగా పితరులను సూచించే masculine plural పదాన్ని ఉపయోగిస్తుంది. అందువల్ల దాన్ని సాధారణ ‘పూర్వీకులు’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘పాటించి ఆచరించడం’ ద్వారా మూలంలోని రెండు క్రియలను నిలిపాం. హీబ్రూలోని బహువచన–ఏకవచన మార్పును ఉద్దేశపూర్వకంగా అలాగే ఉంచాం; అందువల్ల ‘మీరు’ నుంచి ‘నీ’కి మార్పు కనిపిస్తుంది.
