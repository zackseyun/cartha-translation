revisions:
- from: మీరు ఈ న్యాయవిధులను[a] విని, వాటిని పాటించి ఆచరించినందువల్ల, నీ దేవుడైన యహ్వే నీ కోసం, నీ పితరులతో[c] తాను ప్రమాణం చేసిన నిబంధనను, నిలకడగల ప్రేమను[b] నిలబెడతాడు.
  to: మీరు ఈ న్యాయవిధులను[a] విని, వాటిని పాటించి ఆచరిస్తే, నీ దేవుడైన యహ్వే నీ కోసం, నీ పితరులకు[c] తాను ప్రమాణం చేసిన నిబంధననూ నిలకడగల ప్రేమనూ[b] కాపాడుతాడు.
  rationale: “నీ పితరులతో”ను మూలపాఠానికి అనుగుణంగా “నీ పితరులకు”గా సవరించాం. అలాగే, וְשָׁמַרకు “కాపాడుతాడు” అని ఉపయోగించి, ప్రజలు విధులను పాటించడం మరియు యహ్వే నిబంధనను కాపాడడం మధ్య మూలంలోని పదపునరుక్తిని నిలిపాం. షరతు-ఫలిత సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపడానికి “ఆచరిస్తే” వాడాం.
