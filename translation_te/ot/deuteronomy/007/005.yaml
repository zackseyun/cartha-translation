id: DEU.7.5
reference: Deuteronomy 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: te
  text: 'కాని మీరు వారికి చేయవలసిందేమిటంటే ఇలా: వారి బలిపీఠాలను కూలగొట్టాలి; వారి ఆరాధనా స్తంభాలను[a] పగలగొట్టాలి; వారి అషేరా స్తంభాలను[b] నరికివేయాలి; వారి చెక్కిన ప్రతిమలను[c] అగ్నిలో కాల్చివేయాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి పవిత్ర నిలువురాళ్లను.’ ఇవి ఆరాధన కోసం నిలబెట్టిన రాళ్లు లేదా స్తంభాలు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘అషేరీం’; ఇవి అషేరా దేవతతో సంబంధమున్న ఆరాధనా వస్తువులు. అవి బహుశా చెక్క స్తంభాలు, చెట్లు లేదా చెక్క చిహ్నాలు కావచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘వారి విగ్రహాలను’; హీబ్రూ పదం మరింత నిర్దిష్టంగా చెక్కిన ప్రతిమలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה
  choice: కాని ... ఇలా
  rationale: ఈ పదబంధం ముందున్న నిషేధానికి బలమైన వ్యతిరేకతను చూపుతూ, ఇప్పుడు చేయవలసిన విధానాన్ని సూచిస్తుంది.
- source_word: תַעֲשׂוּ לָהֶם
  choice: మీరు వారికి ... చేయాలి
  rationale: ధర్మశాస్త్ర సంబంధ సందర్భంలోని ఆజ్ఞాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: వారి బలిపీఠాలను కూలగొట్టాలి
  rationale: נתץ నిర్మాణాలను పడగొట్టడం లేదా కూల్చివేయడం అనే భావాన్ని ఇస్తుంది; బలిపీఠాలకు ‘కూలగొట్టు’ సహజంగా సరిపోతుంది.
- source_word: מַצֵּבֹתָם
  choice: వారి పూజా స్తంభాలను
  rationale: מַצֵּבָה ఆరాధనలో ఉపయోగించిన నిలువురాయి లేదా స్తంభాన్ని సూచిస్తుంది. ‘పూజా స్తంభాలు’ దాని మతపరమైన వినియోగాన్ని స్పష్టం చేస్తూ రూపాన్ని కూడా నిలుపుతుంది.
- source_word: תְּשַׁבֵּרוּ
  choice: పగలగొట్టాలి
  rationale: పీయేల్ రూపంలోని బలమైన ధ్వంసక్రియను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֵׁירֵיהֶם
  choice: వారి అషేరా స్తంభాలను
  rationale: ఇది అషేరా దేవతతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది. అవి సాధారణంగా చెక్కతో చేసిన స్తంభాలు లేదా వృక్షాకార వస్తువులుగా భావించబడతాయి; అనిశ్చితిని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: תְּגַדֵּעוּן
  choice: నరికివేయాలి
  rationale: גדע చెట్టు లేదా చెక్క వస్తువును నరికివేయడాన్ని సూచిస్తుంది; అషేరా ఆరాధనా వస్తువుల సందర్భంలో ఇది సముచితం.
- source_word: פְסִילֵיהֶם
  choice: వారి చెక్కిన ప్రతిమలను
  rationale: פֶּסֶל చెక్కడం ద్వారా చేసిన ప్రతిమను సూచిస్తుంది. ‘విగ్రహాలు’ కంటే ‘చెక్కిన ప్రతిమలు’ మూలపదంలోని తయారీ భావాన్ని కాపాడుతుంది.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: అగ్నిలో కాల్చివేయాలి
  rationale: హీబ్రూ పాఠంలోని అగ్ని ప్రస్తావనను స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: אֲשֵׁרִים అనే పదాన్ని ప్రత్యేక ఆరాధనా వస్తువుగా చూపాలా, సాధారణ విగ్రహ పదంతో అనువదించాలా
  choice: అషేరా స్తంభాలు
  alternative: అషేరీం; అషేరా చిహ్నాలు
  rationale: ఈ వచనం కనానీయుల ఆరాధనకు చెందిన వేర్వేరు వస్తువులను విడివిడిగా పేర్కొంటుంది. సాధారణ ‘విగ్రహాలు’ అనే పదం ఆ చారిత్రక ప్రత్యేకతను చెరిపేస్తుంది; ‘స్తంభాలు’ అనే రూపం పూర్తిగా నిశ్చితం కాదని పాదటిప్పణి తెలియజేస్తుంది.
- issue: అన్య ఆరాధనా స్థలాలను ధ్వంసం చేయాలనే ఆజ్ఞ బలాన్ని నిలుపడం
  choice: కూలగొట్టాలి, పగలగొట్టాలి, నరికివేయాలి, కాల్చివేయాలి అనే ప్రత్యక్ష ఆజ్ఞాత్మక క్రియలు
  alternative: తొలగించాలి వంటి మృదువైన సాధారణీకరణ
  rationale: హీబ్రూ పాఠంలోని క్రియలు నిర్దిష్టమైనవి, బలమైనవి. అదనపు సమర్థనను చేర్చకుండా వాటి తీవ్రతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆజ్ఞాత్మక శైలిని వాడాం. మూలంలోని నాలుగు సమాంతర ధ్వంసక్రియలను అర్థవిరామాలతో విడదీసి దాని వాక్యలయాన్ని నిలిపాం.
