revisions:
- from: కాబట్టి నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆ ఆజ్ఞను, కట్టడలను, న్యాయవిధులను పాటించి, వాటిని ఆచరించాలి.[a][b]
  to: కాబట్టి, నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆ ఆజ్ఞను, కట్టడలను, న్యాయవిధులను నీవు వాటిని ఆచరించుటకు పాటించాలి.[a][b]
  rationale: The revision restores a finite second-person obligation for וְשָׁמַרְתָּ and makes לַעֲשׂוֹתָם explicit as a purpose expression (“వాటిని ఆచరించుటకు”). It preserves the source’s singular/plural distinctions and the legal triad, without resolving the conjunction more strongly than the context supports; the alternative remains documented in footnote a.
