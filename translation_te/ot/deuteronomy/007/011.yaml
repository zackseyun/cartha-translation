source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֨ אֶת הַ/מִּצְוָ֜ה וְ/אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לַ/עֲשׂוֹתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: te
  text: కాబట్టి, నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆ ఆజ్ఞను, కట్టడలను, న్యాయవిధులను నీవు వాటిని ఆచరించుటకు పాటించాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మరియు నీవు ... పాటించాలి’ లేదా ‘అందువల్ల నీవు ... పాటించాలి’; హెబ్రీ సంధి సాధారణ అనుసంధానాన్ని గానీ, ముందటి వచనాల నుంచి వచ్చే నిర్ధారణను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘న్యాయవిధులు’ అనే పదాన్ని ‘న్యాయతీర్పులు’ లేదా ‘నియమాలు’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం న్యాయపరమైన తీర్పులు లేదా నిర్దేశిత విధులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: కాబట్టి ... పాటించి ... ఆచరించాలి
  rationale: שׁמר అనే క్రియ ఒడంబడిక-న్యాయ సందర్భంలో జాగ్రత్తగా పాటించడాన్ని సూచిస్తుంది. ముందున్న వాక్యాల నుంచి వచ్చే నిర్ధారణ భావాన్ని וְ కోసం ‘కాబట్టి’తో వ్యక్తం చేశాం; హెబ్రీ సంధికి ‘మరియు’ అనే సమన్వయ భావం కూడా సాధ్యమని పాదటిప్పణిలో నిలిపాం.
- source_word: הַמִּצְוָה
  choice: ఆ ఆజ్ఞను
  rationale: హెబ్రీలోని ఏకవచనాన్ని నిలిపి, తరువాత వచ్చే బహువచన న్యాయవర్గాల నుంచి దీనిని వేరుగా ఉంచాం.
- source_word: הַחֻקִּים
  choice: కట్టడలను
  rationale: חֻקִּים నిర్దేశించబడిన శాసనాలు లేదా కట్టడలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే గంభీర న్యాయపదంగా ‘కట్టడలు’ను ఎంచుకున్నాం.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులను
  rationale: מִשְׁפָּטִים న్యాయతీర్పులు, విధులు లేదా నియమాలను సూచించగలదు. ‘న్యాయవిధులు’ న్యాయపరమైన భావాన్ని నిలిపి, חֻקִּים‌కు వాడిన పదం నుంచి భేదాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: מְצַוְּךָ అనే కృదంత రూపంలోని ప్రస్తుత, తక్షణ భావాన్ని సహజమైన తెలుగులో ‘ఆజ్ఞాపిస్తున్న’తో తెలిపాం; ద్వితీయ పురుష ఏకవచనాన్ని ‘నీకు’తో నిలిపాం.
- source_word: לַעֲשׂוֹתָם
  choice: వాటిని ఆచరించాలి
  rationale: עשה యొక్క కార్యరూప విధేయత భావాన్ని ‘ఆచరించాలి’ సహజంగా తెలియజేస్తుంది. ఇది ముందున్న שׁמר కు వాడిన ‘పాటించు’ను యాంత్రికంగా పునరావృతం చేయకుండా, ఆదేశాలను కార్యరూపంలో చేయాలనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఒడంబడిక ధర్మశాస్త్రంలోని మూడు పదాల భేదాన్ని నిలపడం
  choice: ఆ ఆజ్ఞను, కట్టడలను, న్యాయవిధులను
  alternative: ఆజ్ఞలను, శాసనాలను, నియమాలను
  rationale: హెబ్రీ వాక్యం పరస్పరం సంబంధమున్నా వేర్వేరు మూడు న్యాయపదాలను వరుసగా ఉంచుతుంది. వాటిని ఒకే సాధారణ పదంలో కలపకుండా, ఏకవచన ‘ఆజ్ఞ’తో పాటు రెండు బహువచన వర్గాలను ప్రత్యేకంగా నిలిపాం.
- issue: וְ అనే సంధి యొక్క సందర్భార్థం
  choice: కాబట్టి
  alternative: మరియు / అందువల్ల
  rationale: ముందటి వచనాల్లో చెప్పిన యెహోవా విశ్వసనీయత మరియు తీర్పు ఆధారంగా ఈ ఆజ్ఞ నిర్ధారణగా వస్తుంది. అయినప్పటికీ హెబ్రీ సంధి కేవలం సమన్వయాన్ని కూడా సూచించగలదు; ఆ నిజమైన అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన ఒడంబడిక-న్యాయ శైలిని ఉపయోగించాం. మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని నిలిపాం. తెలుగు వాక్యనిర్మాణ సహజత్వం కోసం ‘పాటించి, వాటిని ఆచరించాలి’ అని నిర్మించి, שׁמר మరియు עשה మధ్యనున్న భావభేదాన్ని కాపాడాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
