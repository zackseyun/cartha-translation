source:
  edition: WLC
  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: te
  text: ఆయన వారి రాజులను నీ చేతికి అప్పగిస్తాడు; నీవు ఆకాశం కింద నుండి వారి పేరును తుడిచివేస్తావు. నీవు వారిని నిర్మూలించే వరకు ఏ మనిషీ[a] నీ ఎదుట నిలబడడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరూ.” హెబ్రీయ పాఠంలో ‘మనిషి’ (אִישׁ) అనే ఏకవచన పదం ప్రతినిధ్యార్థంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: ఆయన ... అప్పగిస్తాడు
  rationale: సందర్భంలో కర్త యెహోవా; సంయుక్త పరిపూర్ణ క్రియ ప్రవచనాత్మక వాగ్దాన క్రమాన్ని కొనసాగిస్తుంది. ‘చేతికి అప్పగిస్తాడు’ అనే ప్రయోగం సహజమైన తెలుగులో అధికారానికి లోబరచడాన్ని తెలియజేస్తుంది.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: వారి రాజులను నీ చేతికి
  rationale: ‘వారి రాజులు’ అనే నిర్మాణార్థాన్నీ, ఒకరి చేతికి అప్పగించడం అనే హెబ్రీయ రూపకాన్నీ నిలుపుతుంది.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: నీవు వారి పేరును ... తుడిచివేస్తావు
  rationale: אבד హిఫీల్ యొక్క కారణార్థాన్నీ, ఏకవచన సమూహార్థక ‘వారి పేరు’ అనే రూపాన్నీ కాపాడుతుంది; ఇక్కడ పేరు వారి జ్ఞాపకం లేదా ఉనికిని సూచిస్తుంది.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ఆకాశం కింద లేకుండా
  rationale: లోకంలోని మానవ ఉనికి నుండి పూర్తిగా తొలగించడాన్ని తెలిపే హెబ్రీయ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: ఏ మనిషీ నీ ఎదుట నిలబడడు
  rationale: יצב యొక్క తన స్థానంలో నిలిచి ఎదిరించడం అనే సైనిక భావాన్ని ‘నిలబడడు’ తెలియజేస్తుంది; אִישׁ యొక్క ఏకవచన పురుష రూపాన్ని ‘మనిషి’గా ఉంచినా, ఇక్కడ అది ప్రతినిధ్యార్థకంగా ఎవరినైనా సూచిస్తుంది.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: నీవు వారిని నిర్మూలించే వరకు
  rationale: עַד తో కూడిన క్రియానామ నిర్మాణం చర్య యొక్క అంతిమ హద్దును సూచిస్తుంది; שׁמד యొక్క సంపూర్ణ విధ్వంస భావాన్ని ‘నిర్మూలించు’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: אִישׁ అనే పురుష ఏకవచన పదం యొక్క ప్రతినిధ్యార్థం
  choice: ఏ మనిషీ నీ ఎదుట నిలబడడు
  alternative: ఎవరూ నీ ఎదుట నిలబడరు
  rationale: మూలంలోని పురుష ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది ఇక్కడ సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుందనే విషయాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నీ చేతికి’ అనే మూల రూపకాన్ని నిలిపి, ‘వారి పేరును ... తుడిచివేస్తావు’ మరియు ‘నిర్మూలించే వరకు’ ద్వారా వాక్యంలోని సంపూర్ణ తొలగింపు తీవ్రతను తగ్గించకుండా అందించాం.
