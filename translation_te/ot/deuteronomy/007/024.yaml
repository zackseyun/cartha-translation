revisions:
- from: ఆయన వారి రాజులను నీ చేతికి అప్పగిస్తాడు; నీవు వారి పేరును ఆకాశం కింద లేకుండా తుడిచివేస్తావు. నీవు వారిని నిర్మూలించే వరకు ఏ మనిషీ[a] నీ ఎదుట నిలబడడు.
  to: ఆయన వారి రాజులను నీ చేతికి అప్పగిస్తాడు; నీవు ఆకాశం కింద నుండి వారి పేరును తుడిచివేస్తావు. నీవు వారిని నిర్మూలించే వరకు ఏ మనిషీ[a] నీ ఎదుట నిలబడడు.
  rationale: Only the placement and expression of “from under heaven” have been corrected. This restores the Hebrew syntactic relation and produces natural Telugu, while preserving the singular collective “పేరు,” the representative-singular “మనిషి,” and the force of the destruction language.
