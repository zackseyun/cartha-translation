id: DEU.7.20
reference: Deuteronomy 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: te
  text: అంతేకాక, నీ దేవుడైన యెహోవా కందిరీగను[a] వారి మధ్యకు పంపుతాడు; మిగిలినవారూ, నీకు కనిపించకుండా దాక్కున్నవారూ నశించేవరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా, ‘భయం’ లేదా ‘భయాందోళన’; కొందరు ‘కందిరీగ’ను నిజమైన కీటకంగా కాక, దేవుడు కలిగించే భయానికి రూపకంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందటి వాగ్దానాలకు ఈ అదనపు చర్యను అనుసంధానించే కూడికతో కూడిన ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַצִּרְעָה
  choice: కందిరీగను
  rationale: నిర్దిష్ట ఏకవచన నామవాచకానికి ప్రాథమికమైన కీటకార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; సామూహిక లేదా జాతివాచక భావం సందర్భంలో సహజంగా గ్రహించవచ్చు.
- source_word: יְשַׁלַּח
  choice: పంపుతాడు
  rationale: యెహోవా ఈ సాధనాన్ని శత్రువుల మధ్యకు క్రియాశీలంగా పంపుతాడనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, రెండవ పురుష ఏకవచన స్వామ్య సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: בָּם
  choice: వారి మధ్యకు
  rationale: శత్రువుల మధ్యలోకి పంపడం అనే స్థలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד אֲבֹד
  choice: నశించేవరకు
  rationale: పంపబడిన చర్య కొనసాగే అంతిమ హద్దును సూచిస్తుంది; నాశన విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: הַנִּשְׁאָרִים
  choice: మిగిలినవారు
  rationale: మునుపటి తీర్పు లేదా పోరాటం తరువాత మిగిలిన వారిని సరళంగా సూచిస్తుంది; ప్రత్యేకమైన సిద్ధాంతపరమైన ‘శేషం’ భావాన్ని రుద్దదు.
- source_word: וְהַנִּסְתָּרִים
  choice: దాక్కున్నవారు
  rationale: రూపం నిఫాల్ భాగధాతువైనా, సందర్భంలో ఇశ్రాయేలీయుల ఎదుట తమను దాచుకున్న శత్రువులను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుట
  rationale: అక్షరార్థమైన ‘నీ ముఖము/సన్నిధి నుండి’ అనే హెబ్రీయ భావాన్ని, ఇశ్రాయేలు ముందుకు సాగుతుండగా దాక్కోవడాన్ని సూచించే సహజ తెలుగు రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హెబ్రీ మూలంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతుంది; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: הַצִּרְעָה ను అక్షరార్థంగా తీసుకోవాలా, రూపకాలంకారంగా తీసుకోవాలా
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థమైన ‘కందిరీగ’
  alternative: దేవుడు పంపే భయం లేదా భయాందోళన
  rationale: పదానికి ప్రాథమిక నిఘంటు అర్థం కీటకమే. అయితే ఇది దేవుడు కలిగించే భయానికి రూపకం కావచ్చనే సాధ్యమైన వ్యాఖ్యానాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడుతుంది.
- issue: కందిరీగ పంపబడటం మరియు శత్రువులు నశించడం మధ్య సంబంధం
  choice: తెలుగు సహజత్వం కోసం రెండవ వాక్యంలో ‘అది వారిని విడిచిపెట్టదు’ అని చర్య నిరంతరతను వ్యక్తం చేయడం
  alternative: ఒకే వాక్యంలో ‘వారు నశించేవరకు వారి మధ్యకు పంపుతాడు’
  rationale: עַד אֲבֹד సూచించే కాలాంత హద్దును స్పష్టంగా తెలియజేస్తుంది; అయితే మూలంలో లేని ప్రత్యేక నాశన విధానాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని అనుసరించాం. రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’తో నిలిపాం. ‘అంతేకాక’ ద్వారా ముందటి వచనంతో అనుసంధానం సహజంగా ఉంచాం; దైవనామాన్ని బిరుదుగా మార్చలేదు.
