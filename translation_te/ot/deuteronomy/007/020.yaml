revisions:
- from: అంతేకాక, నీ దేవుడైన యెహోవా కందిరీగను[a] వారి మధ్యకు పంపుతాడు. నీ ఎదుట మిగిలినవారు, దాక్కున్నవారు కూడా నశించేవరకు అది వారిని విడిచిపెట్టదు.
  to: అంతేకాక, నీ దేవుడైన యెహోవా కందిరీగను[a] వారి మధ్యకు పంపుతాడు; మిగిలినవారూ, నీకు కనిపించకుండా దాక్కున్నవారూ నశించేవరకు.
  rationale: The revision removes the unsupported statement that the hornet will not leave the enemies and directly renders the Hebrew endpoint clause. It also expresses “hidden from before you” idiomatically, while retaining the source’s ambiguity about whether the hornet is literal or figurative in the footnote.
