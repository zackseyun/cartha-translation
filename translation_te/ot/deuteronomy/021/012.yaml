id: DEU.21.12
reference: Deuteronomy 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲבֵאתָ֖/הּ אֶל תּ֣וֹךְ בֵּיתֶ֑/ךָ וְ/גִלְּחָה֙ אֶת רֹאשָׁ֔/הּ וְ/עָשְׂתָ֖ה אֶת צִפָּרְנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: te
  text: తర్వాత నీవు ఆమెను నీ ఇంటిలోకి తీసుకురావాలి. ఆమె తన తలను గొరిగించుకోవాలి, తన గోళ్లను కత్తిరించుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన గోళ్లను పెరగనివ్వాలి.” హీబ్రూలో అక్షరార్థంగా, “తన గోళ్లను చేయాలి” అని ఉంది; ఈ నుడికార ప్రయోగం యొక్క అర్థం వివాదాస్పదం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: తర్వాత నీవు ఆమెను తీసుకురావాలి
  rationale: న్యాయ నియమాల వరుసలో వావ్‌తో కూడిన హిఫిల్ రూపం తదుపరి చేయవలసిన చర్యను సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘తర్వాత ... తీసుకురావాలి’ అని అనువదించాం.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: నీ ఇంటిలోకి
  rationale: תּוֹךְ అంతర్భాగాన్ని సూచించినా, ఈ సందర్భంలో ‘నీ ఇంటి మధ్యలోకి’ అనడం తెలుగులో అసహజంగా మరియు అవసరానికి మించి నిర్దిష్టంగా ఉంటుంది. ‘నీ ఇంటిలోకి’ దిశతో పాటు లోపలికి ప్రవేశించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: ఆమె తన తలను గొరిగించుకొని
  rationale: גלח అంటే ‘గొరుగు/క్షౌరం చేయు.’ స్త్రీ స్వయంగా చేసుకోవడం తప్పనిసరి అని మూలపాఠం నిర్దేశించదు; తెలుగు సహజ ప్రయోగమైన ‘తలను గొరిగించుకొని’ చర్యను స్పష్టంగా ఉంచుతూ కార్యసాధకుని నిర్ణయించదు.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: తన గోళ్లను కత్తిరించుకోవాలి
  rationale: ‘తన గోళ్లను చేయాలి’ అనేది హీబ్రూలో అస్పష్టమైన జాతీయ ప్రయోగం. ప్రధాన పాఠంలో సందర్భానికి సరిపోయే సహజ భావంగా ‘కత్తిరించుకోవాలి’ ఎంచుకున్నాం; ‘పెరగనివ్వాలి’ అనే ముఖ్య ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ అనే పదబంధంలోని అస్పష్టత
  choice: ఆమె తన గోళ్లను కత్తిరించుకోవాలి.
  alternative: ఆమె తన గోళ్లను పెరగనివ్వాలి.
  rationale: హీబ్రూ అక్షరార్థంగా ‘ఆమె తన గోళ్లను చేయాలి’ అని ఉంది; ఈ జాతీయ ప్రయోగం వివాదాస్పదం. చదవడానికి సహజమైన భావాన్ని ప్రధాన పాఠంలో ఉంచి, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ ఆజ్ఞకు తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. లింగస్పష్టతను నిలిపి, హీబ్రూ క్రియల వరుసను రెండు సహజ తెలుగు వాక్యాలుగా ఇచ్చాం. పాదసూచిక గుర్తు సంబంధిత అస్పష్ట పదబంధం వెంట ఉంచాం.
