  terminology: ‘పురుషులందరూ’ హీబ్రూ אַנְשֵׁי యొక్క లింగ-నిర్దిష్టతను నిలుపుతుంది. ‘చెడు,’ ‘నీ మధ్యనుండి,’ మరియు ‘భయపడతారు’ ద్వితీయోపదేశకాండ న్యాయసూత్రానికి, అలాగే మూల క్రియలకు తగినవి. ‘ఇశ్రాయేలీయులందరూ’ ఇక్కడి ‘సమస్త ఇశ్రాయేలు’ అనే సమూహార్థాన్ని సహజంగా అందిస్తుంది.
