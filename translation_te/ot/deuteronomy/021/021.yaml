source:
  edition: WLC
  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: te
  text: అప్పుడు అతని పట్టణంలోని పురుషులందరూ అతన్ని రాళ్లతో కొట్టి చంపాలి.[a] ఆ విధంగా నీ మధ్యనుండి ఆ చెడును తొలగించాలి. ఇశ్రాయేలీయులందరూ అది విని భయపడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని పట్టణంలోని ప్రజలందరూ’; హీబ్రూ అక్షరార్థంగా, ‘అతని పట్టణంలోని పురుషులందరూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְגָמֻהוּ ... בָאֲבָנִים
  choice: అతన్ని రాళ్లతో కొట్టి చంపాలి
  rationale: רגם న్యాయపరమైన సందర్భంలో రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది. తరువాతి וָמֵת తెలిపే మరణ ఫలితాన్ని తెలుగులో సహజంగా కలిపి చెప్పడం జరిగింది.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: అతని పట్టణంలోని పురుషులందరూ
  rationale: אַנְשֵׁי అనే పదం ఇక్కడ స్పష్టంగా పురుషవాచకం. మూలంలోని లింగ నిర్దిష్టతను విస్తృతార్థకమైన ‘ప్రజలు’గా మార్చకుండా నిలిపింది.
- source_word: וּבִעַרְתָּ הָרָע
  choice: ఆ చెడును తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని ఈ న్యాయసూత్రంలో בער అక్షరార్థంగా కాల్చడం కాదు; సమాజం మధ్యనుండి చెడును నిర్మూలించడం. ఆధునిక తెలుగులో ‘తొలగించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִקִּרְבֶּךָ
  choice: నీ మధ్యనుండి
  rationale: ఒడంబడిక సమాజాన్ని ఏకవచనంగా సంబోధించే హీబ్రూ రూపాన్ని నిలిపింది.
- source_word: יִשְׁמְעוּ וְיִרָאוּ
  choice: అది విని భయపడతారు
  rationale: יִשְׁמְעוּ యొక్క ప్రత్యక్ష అర్థం ‘వింటారు’; తెలుగులో సందర్భానికి అవసరమైన కర్మగా ‘అది’ చేర్చబడింది. ירא లోని హెచ్చరికాత్మక భయ భావం ‘భయపడతారు’లో నిలుస్తుంది.
theological_decisions:
- issue: పట్టణ సమాజాన్ని సూచించే లింగ నిర్దిష్ట పదం
  choice: పురుషులందరూ
  alternative: ప్రజలందరూ
  rationale: హీబ్రూ పదబంధం వ్యాకరణపరంగానే కాక పదార్థపరంగానూ పురుషులను పేర్కొంటుంది. దీనిని నిలపడం వచనానికి మించిన లింగపాత్రల సిద్ధాంతాన్ని ప్రతిపాదించదు.
- issue: ద్వితీయోపదేశకాండంలోని చెడును తొలగించే న్యాయసూత్రం
  choice: నీ మధ్యనుండి ఆ చెడును తొలగించాలి
  alternative: నీ మధ్యనుండి ఆ దుష్టత్వాన్ని నిర్మూలించాలి
  rationale: ‘చెడు’ మూలంలోని నిర్దిష్ట నైతిక-న్యాయ వర్గాన్ని నిలుపుతుంది; ‘తొలగించాలి’ అనేది ఇక్కడి రూపక ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘చేయాలి’ రూపం ఆజ్ఞాత్మక న్యాయబలాన్ని సహజంగా తెలియజేస్తుంది. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత వాక్యానంతరం ఉంచబడింది.
