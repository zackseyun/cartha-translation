source:
  edition: WLC
  text: וְ/עָנ֖וּ וְ/אָמְר֑וּ יָדֵ֗י/נוּ לֹ֤א שפכה אֶת הַ/דָּ֣ם הַ/זֶּ֔ה וְ/עֵינֵ֖י/נוּ לֹ֥א רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: te
  text: 'అప్పుడు వారు జవాబిచ్చి ఇలా చెప్పాలి: “మా చేతులు ఈ రక్తాన్ని చిందించలేదు[a]; మా కళ్ళు దాన్ని చూడలేదు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ రక్తం.” ఇది ఆ హత్యకు తమకు బాధ్యత లేదని నిరాకరించే చట్టపరమైన ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాన్ని ప్రత్యక్షంగా చూడలేదు.” “మా కళ్ళు చూడలేదు” అనే హీబ్రూ ప్రయోగం, ఆ హత్యను ప్రత్యక్షంగా చూసిన జ్ఞానం తమకు లేదని నిరాకరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: అప్పుడు వారు జవాబిస్తూ ఇలా చెప్పాలి
  rationale: చట్టపరమైన ప్రక్రియలో బహిరంగంగా ఇచ్చే జవాబును సూచించే ענהను, సాధారణ ‘చెప్పు’ అనే אמרతో కలిపి తెలుగులో సహజంగా, విధివాచకంగా వ్యక్తం చేస్తుంది. వావ్‌కు ఇక్కడున్న క్రమానుసార భావాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: יָדֵינוּ
  choice: మా చేతులు
  rationale: హత్యలో ప్రత్యక్ష బాధ్యతను సూచించే శరీరభాగ రూపకాన్ని మూలంలోని విధంగానే నిలుపుతుంది.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: ఈ రక్తాన్ని చిందించలేదు
  rationale: שפך דם అనే స్థిరమైన హీబ్రూ ప్రయోగం ‘రక్తం చిందించడం,’ అంటే చంపడం. ‘ఈ రక్తం’ అనే నిర్దిష్టమైన, చట్టపరమైన మూలభాషా ప్రయోగాన్ని వివరణాత్మకంగా మార్చకుండా ఉంచుతుంది.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: మా కళ్ళు దాన్ని చూడలేదు
  rationale: సాక్షిగా చూసిన జ్ఞానాన్ని నిరాకరించే స్పష్టమైన శరీరభాగ భాషను నిలుపుతుంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు సందర్భంలోని హత్యను సూచిస్తూ ‘దాన్ని’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే చట్టపరమైన ప్రకటనకు తగిన గంభీరతతో అనువదించబడింది. ‘చేతులు,’ ‘కళ్ళు,’ ‘ఈ రక్తం’ వంటి మూలంలోని స్పష్టమైన రూపక భాషను కాపాడుతూ, అవసరమైన వివరణలను పాదటిప్పణుల్లో ఇచ్చాం.
