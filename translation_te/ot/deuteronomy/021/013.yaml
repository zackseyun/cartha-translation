  to: ఆమె తన బందిత్వపు దుస్తులను[a] ఒంటిమీద నుంచి తీసివేసి, నీ ఇంట్లో నివసించాలి. తన తండ్రిని, తన తల్లిని గురించి ఒక నెల రోజులపాటు ఏడవాలి. ఆ తర్వాత నీవు ఆమె దగ్గరకు వెళ్లి, ఆమెకు భర్తవుతావు; ఆమె నీకు భార్య అవుతుంది.
  rationale: బందిత్వానికి సంబంధించిన దుస్తులనే సూచించే హీబ్రూ జనిటివ్ భావాన్ని స్పష్టంగా నిలుపడానికి “బందీ దుస్తులు” స్థానంలో “బందిత్వపు దుస్తులు” వాడబడింది. దాని సాధ్యమైన అర్థాలను వివరించే ఫుట్‌నోట్ జోడించబడింది. మిగిలిన వాక్యనిర్మాణం మూలంలోని నిరీక్షణ కాలం, పరోక్ష లైంగిక ప్రయోగం, మరియు వివాహ సంబంధపు వరుసను యథాతథంగా ఉంచుతుంది.
