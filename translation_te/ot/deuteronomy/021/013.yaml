  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: te
  text: ఆమె తన బందిత్వపు దుస్తులను[a] ఒంటిమీద నుంచి తీసివేసి, నీ ఇంట్లో నివసించాలి. తన తండ్రిని, తన తల్లిని గురించి ఒక నెల రోజులపాటు ఏడవాలి. ఆ తర్వాత నీవు ఆమె దగ్గరకు వెళ్లి, ఆమెకు భర్తవుతావు; ఆమె నీకు భార్య అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె బందిత్వానికి సంబంధించిన వస్త్రాలు’ లేదా ‘ఆమెను బందీగా పట్టుకున్నప్పుడు ఆమె ధరించిన దుస్తులు.’
    reason: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆమె బందిత్వపు దుస్తులు/వస్త్రం’; అది ఏ ప్రత్యేక దుస్తులను సూచిస్తుందో నిర్దిష్టంగా చెప్పదు.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: తీసివేసి
  rationale: హిఫీల్ రూపం తొలగించడం లేదా తీసివేయడం అనే భావాన్ని ఇస్తుంది; దుస్తుల సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: తన బందీ దుస్తులను
  rationale: అక్షరార్థంగా ‘ఆమె బందిత్వపు వస్త్రం/దుస్తులు.’ బందీ స్థితికి సంబంధించిన దుస్తులనే సూచిస్తూ, అవి పట్టుబడినప్పుడు ధరించినవేనా అనే విషయాన్ని నిర్ధారించకుండా ఉంచుతుంది.
- source_word: מֵעָלֶיהָ
  choice: ఒంటిమీద నుంచి
  rationale: అక్షరార్థమైన ‘ఆమె మీద నుంచి’ అనే భావాన్ని తెలుగు దుస్తుల వాడుకలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: నీ ఇంట్లో నివసించాలి
  rationale: ישב ఇక్కడ కూర్చోవడం కంటే ఉండడం/నివసించడం అనే భావంలో ఉంది; న్యాయపరమైన ఆదేశ స్వరాన్ని ‘నివసించాలి’ నిలుపుతుంది.
- source_word: וּבָכְתָה
  choice: ఏడవాలి
  rationale: మూల క్రియ నేరుగా ‘ఏడవడం’ను సూచిస్తుంది. తల్లిదండ్రుల సందర్భం దుఃఖాన్ని తెలియజేస్తున్నా, ‘శోకించాలి’ కంటే మూలంలోని స్పష్టమైన చర్యను నిలుపుతుంది.
- source_word: אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: తన తండ్రిని, తన తల్లిని గురించి
  rationale: ఏడవడం అనే క్రియతో వచ్చిన ప్రత్యక్ష కర్మలను సహజ తెలుగులో ‘గురించి’తో వ్యక్తపరుస్తుంది; వారు మరణించారని అనవసరంగా నిర్ణయించదు.
- source_word: יֶרַח יָמִים
  choice: ఒక నెల రోజులపాటు
  rationale: ‘రోజుల నెల’ అనే హీబ్రూ కాలవ్యవధి ప్రయోగాన్ని సహజ తెలుగులో ఒక సంపూర్ణ నెల కాలంగా తెలియజేస్తుంది.
- source_word: וְאַחַר כֵּן
  choice: ఆ తర్వాత
  rationale: కాలక్రమాన్ని సరళంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: תָּבֹא אֵלֶיהָ
  choice: నీవు ఆమె దగ్గరకు వెళ్లి
  rationale: హీబ్రూలో ఇది లైంగిక సంబంధాన్ని సూచించే సాంప్రదాయ ప్రయోగం. తెలుగులో పరోక్షతను నిలుపుతూ, తదుపరి వివాహ భాషతో కలిసి భావం గ్రహించబడేలా చేస్తుంది.
- source_word: וּבְעַלְתָּהּ
  choice: ఆమెకు భర్తవుతావు
  rationale: בעל క్రియ ఇక్కడ భర్త పాత్రలోకి రావడాన్ని సూచిస్తుంది; స్వాధీనత భావాన్ని అనవసరంగా మోపకుండా మూలంలోని వివాహ సంబంధాన్ని నిలుపుతుంది.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: ఆమె నీకు భార్య అవుతుంది
  rationale: హీబ్రూ వివాహ సూత్రభాషను సహజమైన, గంభీరమైన తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యుద్ధ బందీ స్త్రీకి సంబంధించిన క్లిష్టమైన వివాహ నియమంలోని లైంగిక-వివాహ ప్రయోగం
  choice: ‘ఆమె దగ్గరకు వెళ్లి’ అనే పరోక్ష ప్రయోగాన్నీ, ‘ఆమెకు భర్తవుతావు/ఆమె నీకు భార్య అవుతుంది’ అనే స్పష్టమైన వివాహ భాషనూ వేర్వేరుగా నిలుపుట
  alternative: మొత్తాన్ని ‘ఆమెను పెళ్లి చేసుకోవచ్చు’ అని సంక్షిప్తీకరించడం లేదా ‘ఆమెతో లైంగిక సంబంధం పెట్టుకోవచ్చు’ అని పూర్తిగా విప్పి చెప్పడం
  rationale: మూలం దగ్గరకు వెళ్లడాన్ని, భర్త కావడాన్ని, ఆమె భార్య కావడాన్ని వరుసగా పేర్కొంటుంది. వాటిని కలిపివేయకుండా ఉంచడం వల్ల వాక్యంలోని న్యాయపరమైన నిర్మాణం మరియు నైతిక ఉద్రిక్తత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీర న్యాయశైలి. రెండవ పురుష ఏకవచన ‘నీవు/నీ’ రూపాలు సందర్భానుసారం నిలుపబడ్డాయి. మూలంలో లేని వివరణాత్మక తీర్పులు చేర్చలేదు.
