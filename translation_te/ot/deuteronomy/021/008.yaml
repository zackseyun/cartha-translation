source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: te
  text: “యాహ్వే, నీవు విమోచించిన నీ ప్రజ అయిన ఇశ్రాయేలు కొరకు ప్రాయశ్చిత్తం చేయి; నిరపరాధ రక్తం నీ ప్రజ అయిన ఇశ్రాయేలు మధ్య ఉండనివ్వకు. అప్పుడు ఆ రక్తదోషానికి వారికి ప్రాయశ్చిత్తం జరుగుతుంది.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఆ రక్తానికి వారికి ప్రాయశ్చిత్తం జరుగుతుంది.” ఇక్కడ “రక్తం” అనేది రక్తపాతం వల్ల కలిగిన న్యాయపరమైన దోషబాధ్యతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: ప్రాయశ్చిత్తం చేయి
  rationale: ఈ ఆరాధనా-న్యాయ సందర్భంలో כפר పాపం లేదా రక్తదోషం తొలగించబడే పరిహార చర్యను సూచిస్తుంది. ‘ప్రాయశ్చిత్తం చేయి’ ఆ భావాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు కోసం
  rationale: ל లబ్ధిదారుని సూచిస్తుంది; ‘నీ ప్రజలైన ఇశ్రాయేలు’ అనే రూపం ఇశ్రాయేలు దేవుని ప్రజలని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: నీవు విమోచించిన
  rationale: פדה బానిసత్వం లేదా బంధం నుంచి వెల చెల్లించి విడిపించడం అనే విమోచన భావాన్ని కలిగి ఉంది. ‘విమోచించిన’ ఆ నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וְאַל תִּתֵּן דָּם נָקִי
  choice: నిర్దోషి రక్తం … నిలిచిపోనివ్వకు
  rationale: పదశః ‘నిర్దోషి రక్తాన్ని ఉంచకు/ఇవ్వకు.’ ఈ సందర్భంలో పరిష్కారం కాని రక్తపాతపు బాధ్యత సమాజంలో మిగలకూడదనే ప్రార్థనను ‘నిలిచిపోనివ్వకు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు మధ్య
  rationale: בקרב యొక్క ‘మధ్యలో/మధ్య’ అనే సామూహిక పరిధి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: అప్పుడు వారి రక్తదోషానికి ప్రాయశ్చిత్తం జరుగుతుంది
  rationale: నిఫల్ రూపం ఫలితాత్మక నిష్క్రియ భావాన్ని ఇస్తుంది. పదశః ఉన్న ‘రక్తం’ ఇక్కడ హత్యవల్ల సమాజంపై వచ్చిన న్యాయపరమైన బాధ్యతను సూచిస్తున్నందున ప్రధాన పాఠంలో ‘రక్తదోషం’ అని స్పష్టం చేసి, పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచడం కోసం ‘యాహ్వే’ వాడాం; ఇది ఏ ప్రత్యేక సంఘ సంప్రదాయ వ్యాఖ్యానాన్నీ జోడించదు.
- issue: చివరి వాక్యంలోని הַדָּם అర్థం
  choice: రక్తదోషం
  alternative: రక్తం
  rationale: తెలియని హత్యకు సంబంధించిన సామూహిక బాధ్యతే సందర్భంలోని న్యాయపరమైన అంశం. అయినప్పటికీ హెబ్రీలో పదశః ‘రక్తం’ అని ఉన్నందున ఆ అసలు రూపాన్ని పాదటిప్పణిలో తెలిపి భాషాత్మక ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన కాని అతిగా ప్రాచీనంకాని శైలి వాడబడింది. నేరుగా సంబోధించే ఏకవచన రూపాలు మూలంలోని ప్రార్థనా నిర్మాణాన్ని నిలుపుతాయి.
