revisions:
- from: “యాహ్వే, నీవు విమోచించిన నీ ప్రజలైన ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయి. నిర్దోషి రక్తం నీ ప్రజలైన ఇశ్రాయేలు మధ్య నిలిచిపోనివ్వకు.” అప్పుడు వారి రక్తదోషానికి ప్రాయశ్చిత్తం జరుగుతుంది.[a]
