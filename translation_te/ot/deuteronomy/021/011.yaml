review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the sequence of the Hebrew legal clause: seeing among the captives, desiring the woman, and taking her as a wife. It rightly retains the outward-appearance sense of יְפַת תֹּאַר and does not add moral evaluation absent from this verse.'
  naturalness: ‘నీ కోసం భార్యగా’ is overly literal and less idiomatic in modern standard Telugu. ‘నీకు భార్యగా’ naturally expresses the Hebrew לְךָ in this marriage idiom. ‘అందమైన రూపం గల’ is also smoother than ‘అందమైన రూపమున్న.’
  terminology: ‘బందీలు,’ ‘స్త్రీ,’ ‘కోరుకొని,’ and ‘భార్యగా తీసుకుంటే’ suit a formal, modern Telugu rendering and preserve the legal-register continuity from the preceding context. The footnotes retain viable lexical and idiomatic clarification.
  issues:
  - severity: low
    issue: Literal but awkward rendering of לְךָ
    rationale: In Telugu, ‘నీ కోసం భార్యగా తీసుకుంటే’ can sound as though the wife is taken for the reader’s benefit or purpose. ‘నీకు భార్యగా తీసుకుంటే’ is the normal idiomatic equivalent while preserving the reflexive/dative sense.
  - severity: low
    issue: Slightly stiff noun phrase for physical appearance
    rationale: ‘అందమైన రూపమున్న’ is understandable, but ‘అందమైన రూపం గల’ is more natural modern Telugu without weakening the source’s emphasis on appearance.
  revised_text: నీవు బందీలలో అందమైన రూపం గల ఒక స్త్రీని చూసి[a], ఆమెను కోరుకొని, ఆమెను నీకు భార్యగా తీసుకుంటే[b],
