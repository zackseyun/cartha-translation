id: DEU.21.11
reference: Deuteronomy 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: te
  text: నీవు బందీలలో అందమైన రూపం గల ఒక స్త్రీని చూసి[a], ఆమెను కోరుకొని, ఆమెను నీకు భార్యగా తీసుకుంటే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చక్కని రూపం గల ఒక స్త్రీని.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీయ మూలంలో, ‘ఆమెను నీకు భార్యగా తీసుకుంటే’; ఇది ఆమెను వివాహం చేసుకోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: బందీలలో ... నీవు చూసి
  rationale: యుద్ధంలో పట్టుబడినవారి సమూహాన్ని సూచించే שִׁבְיָהను సహజమైన ఆధునిక తెలుగులో ‘బందీలు’గా ఇచ్చాం. ముందటి సందర్భంలో మొదలైన షరతార్థక న్యాయ వాక్యక్రమాన్ని తెలుగులో ‘చూసి ... తీసుకుంటే’గా కొనసాగించాం.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: అందమైన రూపమున్న ఒక స్త్రీని
  rationale: ఈ నిర్మాణం స్త్రీ బాహ్యరూప సౌందర్యాన్ని సూచిస్తుంది. ‘అందమైన రూపమున్న’ అనేది మూలంలోని రూపం/కనిపించే తీరు అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: ఆమెను కోరుకొని
  rationale: חָשַׁק బలమైన కోరిక లేదా మక్కువను తెలియజేస్తుంది. ‘కోరుకొని’ ఆ బలాన్ని అనవసరంగా మృదువుచేయకుండా, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: ఆమెను నీ కోసం భార్యగా తీసుకుంటే
  rationale: అక్షరార్థంగా ‘నీ కోసం భార్యగా తీసుకొను’ అనే వివాహ సంబంధమైన హెబ్రీయ నుడికారాన్ని ఈ రూపం నిలుపుతుంది; కేవలం ‘పెళ్లి చేసుకుంటే’ అని విప్పి చెప్పకుండా לְךָ యొక్క ప్రతినివర్తక భావాన్నీ ఉంచుతుంది.
theological_decisions:
- issue: నైతికంగా క్లిష్టమైన యుద్ధకాల న్యాయ సందర్భాన్ని మృదువుచేయకుండా లేదా మూలంలో లేని తీర్పును చేర్చకుండా అనువదించడం
  choice: పురుషుడు ఆమెను కోరుకొని భార్యగా తీసుకోవడాన్ని మూలంలోని సూటి న్యాయవివరణ ప్రకారమే ఉంచడం
  alternative: ‘ఆమెను భార్యగా ఎంచుకుంటే’ అని మృదువుగా చెప్పడం, లేదా బలవంతం/ఆమోదం గురించి మూలంలో లేని వివరణను చేర్చడం
  rationale: ఈ వచనం కోరికను, భార్యగా తీసుకోవడాన్ని వివరిస్తుంది; వాటిపై స్పష్టమైన నైతిక మూల్యాంకనాన్ని ఈ వచనంలోనే జోడించదు. కాబట్టి అనువాదం ఆ నైతిక ఉద్రిక్తతను అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా న్యాయవచనానికి తగిన గంభీరతతో రూపొందించబడింది. ముందటి వచనం నుంచి కొనసాగే షరతార్థక నిర్మాణం కారణంగా చివర ‘తీసుకుంటే’ వాడబడింది.
