  to: నీవు బందీలలో అందమైన రూపం గల ఒక స్త్రీని చూసి[a], ఆమెను కోరుకొని, ఆమెను నీకు భార్యగా తీసుకుంటే[b],
  rationale: 'The revision makes two limited idiomatic improvements: it replaces the less natural ‘నీ కోసం’ with ‘నీకు’ for the Hebrew reflexive/dative construction, and smooths the appearance phrase to ‘అందమైన రూపం గల.’ The conditional legal syntax, the source’s plain description of desire and marriage, and both footnote anchors are retained.'
