id: DEU.21.18
reference: Deuteronomy 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֣ה לְ/אִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּ/מוֹרֶ֔ה אֵינֶ֣/נּוּ שֹׁמֵ֔עַ בְּ/ק֥וֹל אָבִ֖י/ו וּ/בְ/ק֣וֹל אִמּ֑/וֹ וְ/יסְּר֣וּ אֹת֔/וֹ וְ/לֹ֥א יִשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: te
  text: ఒకవేళ ఒక మనిషికి మొండివాడూ తిరుగుబాటు చేసేవాడూ అయిన కుమారుడు ఉండి, అతడు తన తండ్రి మాటనూ తన తల్లి మాటనూ వినకపోతే,[a] వారు అతనిని క్రమశిక్షణతో దిద్దినా అతడు వారి మాట వినకపోతే,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక మనిషికి … కుమారుడు ఉన్నప్పుడు.’ హీబ్రూ ధర్మశాస్త్ర సూత్రాన్ని ‘ఒకవేళ’ అనే షరతుగానూ, ‘ఎప్పుడు’ అనే సందర్భ సూచనగానూ అనువదించవచ్చు. ‘తండ్రి మాట,’ ‘తల్లి మాట’ అనేవి వారి అధికారపూర్వక ఉపదేశం లేదా ఆజ్ఞను సూచిస్తాయి.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ వాక్యాన్ని ‘వారు అతనిని క్రమశిక్షణతో దిద్దుతారు, అయినా అతడు వారి మాట వినడు’ అని కూడా అనువదించవచ్చు. ఇక్కడ ‘వినడం’ అంటే మాటను లక్ష్యపెట్టి లోబడడం.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఉండి … వినకపోతే
  rationale: ఇది షరతుతో కూడిన ధర్మశాస్త్ర సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన న్యాయసూత్ర నిర్మాణంగా ‘ఉండి … వినకపోతే’ అని ఇచ్చాం; ‘ఉన్నప్పుడు’ అనే కాలార్థం కూడా సాధ్యమే.
- source_word: יִהְיֶה לְאִישׁ
  choice: ఒక మనిషికి … కుమారుడు ఉండి
  rationale: హీబ్రూ భాషలోని అస్తిత్వ క్రియతో దత్తివిభక్తిని ఉపయోగించే స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּן
  choice: కుమారుడు
  rationale: మూలపదం ప్రత్యేకంగా పురుష సంతానాన్ని సూచిస్తుంది; ‘బిడ్డ’ అనే లింగతటస్థ పదాన్ని ఉపయోగించలేదు.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: మొండివాడూ తిరుగుబాటు చేసేవాడూ
  rationale: మొదటి పదంలోని పట్టుదలతో లొంగని స్వభావాన్నీ, రెండవ పదంలోని క్రియాశీల ప్రతిఘటననూ జంటగా నిలుపుతుంది.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: వినకపోతే
  rationale: שׁמע అనే క్రియ యొక్క ‘విను’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, ఈ సందర్భంలో దానిలో ఉన్న లోబడే భావాన్ని పాఠకుడు గ్రహించగలిగేలా చేస్తుంది.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: తన తండ్రి మాటనుగానీ తన తల్లి మాటనుగానీ
  rationale: ‘స్వరం’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన ‘మాట’ను వాడి, అధికారపూర్వక ఉపదేశం లేదా ఆజ్ఞ భావాన్ని అందిస్తుంది. నిషేధ వాక్యంలో ‘గానీ … గానీ’ రెండు తల్లిదండ్రుల మాటనూ వినకపోవడాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: వారు అతనికి క్రమశిక్షణ నేర్పించినా
  rationale: יסר శిక్షాత్మక హింసను తప్పనిసరిగా సూచించకుండా దిద్దుబాటు, శిక్షణ, క్రమశిక్షణ భావాలను కలిగి ఉంది. సందర్భంలోని concessive భావాన్ని ‘అయినా’ నిర్మాణం వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: అతడు వారి మాట వినకపోతే
  rationale: మూలంలోని שׁמע పునరుక్తిని ‘విను’తో నిలుపుతూ, తల్లిదండ్రుల దిద్దుబాటును కూడా లక్ష్యపెట్టకపోవడాన్ని సహజ తెలుగులో చెబుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ధర్మశాస్త్ర శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, ‘స్వరం’ అనే అసహజ పదానువాదానికి బదులు నుడికారార్థమైన ‘మాట’ను ఎంచుకున్నాం.
