revisions:
- from: ఒక మనిషికి మొండివాడూ తిరుగుబాటు చేసేవాడూ అయిన కుమారుడు ఉండి, అతడు తన తండ్రి మాటనుగానీ తన తల్లి మాటనుగానీ వినకపోతే,[a] వారు అతనికి క్రమశిక్షణ నేర్పించినా అతడు వారి మాట వినకపోతే,[b]
  to: ఒకవేళ ఒక మనిషికి మొండివాడూ తిరుగుబాటు చేసేవాడూ అయిన కుమారుడు ఉండి, అతడు తన తండ్రి మాటనూ తన తల్లి మాటనూ వినకపోతే,[a] వారు అతనిని క్రమశిక్షణతో దిద్దినా అతడు వారి మాట వినకపోతే,[b]
  rationale: షరతు నిర్మాణాన్ని ‘ఒకవేళ’తో స్పష్టం చేశాం. తల్లిదండ్రులిద్దరి మాటనూ వినకపోవడాన్ని ‘మాటనూ ... మాటనూ’తో వ్యక్తం చేసి హీబ్రూ సమన్వయాన్ని నిలిపాం. ‘క్రమశిక్షణ నేర్పించినా’ స్థానంలో ‘క్రమశిక్షణతో దిద్దినా’ని ఉంచి יסר యొక్క దిద్దుబాటు-క్రమశిక్షణ భావాన్ని కాపాడాం. ఆంగ్ల audit trailలోని ప్రత్యామ్నాయ పఠనం, ‘మాట/వినడం’ నుడికార వివరణలను పాదటిప్పణుల్లో నిలిపాం.
