source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీవు స్వాధీనం చేసుకోవడానికి నీకు ఇస్తున్న దేశంలో, హతుడైన ఒక మనిషి[a] బహిరంగ పొలంలో పడి ఉండగా కనబడితే, అతన్ని ఎవరు కొట్టారో తెలియకపోతే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హతమైన ఒక వ్యక్తి.’ హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉంది (‘హతుడైన ఒక మనిషి’); అయితే ఈ న్యాయసూత్రం సాధారణంగా హంతకుడు తెలియని హత్యను గురించి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కనబడితే
  rationale: ఇది ఒక షరతుతో కూడిన న్యాయనియమాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘-తే’ నిర్మాణం సహజంగా ఆ షరతును తెలియజేస్తుంది.
- source_word: יִמָּצֵא
  choice: కనబడితే
  rationale: מצא ధాతువు నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని సహజమైన తెలుగు న్యాయశైలిలో వ్యక్తపరుస్తుంది.
- source_word: חָלָל
  choice: హతుడైన ఒక మనిషి
  rationale: ఈ పదం కేవలం మృతదేహాన్ని కాక, హింసవల్ల చంపబడిన వ్యక్తిని సూచిస్తుంది; పుంలింగ ఏకవచన రూపాన్ని కూడా ఈ అనువాదం నిలుపుతుంది.
- source_word: בָּאֲדָמָה
  choice: దేశంలో
  rationale: తరువాతి సంబంధ వాక్యం చూపినట్లుగా, ఇక్కడ אֲדָמָה మట్టిని కాక ఇశ్రాయేలు స్వాధీనం చేసుకోబోయే భూభాగాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: నీ దేవుడైన యాహ్వే నీవు స్వాధీనం చేసుకోవడానికి నీకు ఇస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంత భావాన్నీ, దేశాన్ని స్వాధీనం చేసుకునే నిబంధనాత్మక భాషనూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נֹפֵל
  choice: పడి ఉండగా
  rationale: అక్షరార్థంగా ‘పడిన’ అనే భావం ఉన్నా, సందర్భంలో శవం ఉన్న స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: బహిరంగ పొలంలో
  rationale: నివాస ప్రాంతానికి వెలుపల ఉన్న పొలం లేదా విస్తార ప్రదేశం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: לֹא נוֹדַע
  choice: తెలియకపోతే
  rationale: నిఫాల్ రూపంలోని అవ్యక్త నిష్క్రియ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִי הִכָּהוּ
  choice: అతన్ని ఎవరు కొట్టారో
  rationale: נכה యొక్క ‘కొట్టు’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; మరణం సంభవించిందనే విషయం חָלָל ద్వారానే ఇప్పటికే స్పష్టమవుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధనాత్మక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: חָלָל లోని పుంలింగ సూచన
  choice: హతుడైన ఒక మనిషి
  alternative: హతమైన ఒక వ్యక్తి
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉంది; అయితే ఈ న్యాయసూత్రం గుర్తుతెలియని హత్యకు సాధారణంగా వర్తించగలదనే అంశాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర అల్పవిరామాన్ని నిలిపింది.
