id: DEU.21.4
reference: Deuteronomy 21:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: te
  text: అప్పుడు ఆ పట్టణపు పెద్దలు ఆ పెయ్యను కిందికి, ఎప్పుడూ ఎండిపోని వాగులోకి[a] తీసుకువెళ్లాలి. ఆ వాగు ఉన్న చోట భూమిని సాగు చేయరు, విత్తనాలు చల్లరు. అక్కడ, ఆ వాగులో, వారు ఆ పెయ్య మెడ విరగ్గొట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరంతర ప్రవాహమున్న లోయలోకి”; లేదా, “కఠినమైన లోయలోకి.” ఇక్కడి హెబ్రీ పదబంధం נַחַל אֵיתָן అర్థంపై భిన్నాభిప్రాయాలు ఉన్నాయి. ఇది సాధారణంగా ఎండిపోని వాగును లేదా నిరంతర ప్రవాహమున్న లోయను సూచించవచ్చు; ‘కఠినమైన లోయ’ అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: కిందికి ... తీసుకువెళ్లాలి
  rationale: ירד హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే దిగువన ఉన్న వాగు వైపు కదలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: ఆ పట్టణపు పెద్దలు
  rationale: న్యాయపరమైన సందర్భంలో పట్టణ సమాజానికి బాధ్యత వహించే పెద్దలను సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הָעֶגְלָה
  choice: ఆ పెయ్యను
  rationale: עגלה అంటే చిన్న ఆడ పశువు; ‘పెయ్య’ దాని లింగం, వయస్సును సంక్షిప్తంగా తెలిపే తెలుగు పదం.
- source_word: אֶל נַחַל אֵיתָן
  choice: ఎప్పుడూ నీరు ప్రవహించే వాగులోకి
  rationale: נחל ను ‘వాగు’గా, איתן ను ఈ సందర్భంలో నిరంతరమైన లేదా శాశ్వత ప్రవాహాన్ని సూచించేదిగా అనువదిస్తుంది; భౌగోళిక లక్షణం సాధారణ పాఠకునికి స్పష్టమవుతుంది.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: ఆ చోట భూమిని సాగుచేసి ఉండకూడదు, విత్తనాలు చల్లి ఉండకూడదు
  rationale: రెండు హెబ్రీ నిష్క్రియ క్రియల వ్యవసాయ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְעָרְפוּ
  choice: మెడ విరగ్గొట్టాలి
  rationale: ఈ ఆచార సందర్భంలో ערף సాధారణంగా వధించడం కంటే ప్రత్యేకంగా మెడ విరగ్గొట్టడాన్ని సూచిస్తుంది.
- source_word: שָׁם ... בַּנָּחַל
  choice: అక్కడ ఆ వాగులోనే
  rationale: స్థలాన్ని పునరుద్ఘాటించే మూలపాఠ భావాన్ని ‘నే’ ద్వారా సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవిధి శైలి వాడబడింది. ‘పెయ్య’ గ్రామీణ, బైబిలు సందర్భాల్లో అర్థమయ్యే ఖచ్చితమైన పశుపదం. נחל איתן లోని నిజమైన పదార్థ సందిగ్ధతను ప్రధాన పాఠంలో ఒక సహజ ఎంపికతో, పాదటిప్పణిలో ప్రత్యామ్నాయాలతో నిలిపాం.
