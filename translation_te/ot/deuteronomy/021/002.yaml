  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: te
  text: అప్పుడు నీ పెద్దలూ నీ న్యాయాధిపతులూ బయలుదేరి, చంపబడిన వ్యక్తి చుట్టూ ఉన్న పట్టణాలకు ఎంత దూరమో కొలవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “చంపబడిన వ్యక్తి చుట్టూ ఉన్న పట్టణాల వరకు కొలవాలి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: అప్పుడు ... బయలుదేరి
  rationale: వావ్ + ఖాతల్ న్యాయపద్ధతిలో తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తూ, ‘బయలుదేరి’ క్రియార్థాన్ని నిలుపుతుంది.
- source_word: זְקֵנֶיךָ
  choice: నీ పెద్దలు
  rationale: ఏకవచన ద్వితీయ పురుష ప్రత్యయాన్ని, ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సంబోధించే రూపాన్ని నిలుపుతుంది.
- source_word: וְשֹׁפְטֶיךָ
  choice: నీ న్యాయాధిపతులు
  rationale: న్యాయాధికారాన్ని నిర్వహించే వారిని సూచించే שׁפט రూపానికి ఈ న్యాయసందర్భంలో ప్రత్యక్షమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: పట్టణాలకు ఎంత దూరమో కొలవాలి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పట్టణాల వరకు కొలవాలి’; తెలుగులో కొలవబడేది దూరమని సహజంగా స్పష్టం చేస్తుంది, పట్టణాలనే కొలత ముగింపు బిందువులుగా నిలుపుతుంది.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: చుట్టూ ఉన్న
  rationale: శవం ఉన్న ప్రదేశాన్ని చుట్టుముట్టిన సమీప పట్టణాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הֶחָלָל
  choice: చంపబడిన వ్యక్తి
  rationale: חָלָל అంటే హతుడైన లేదా చంపబడిన వ్యక్తి. ‘హత్య చేయబడినవాడు’ అని అనడం న్యాయపరంగా ఉద్దేశపూర్వక హత్యను ముందుగానే నిర్ధారించవచ్చు; ‘శవం’ అసలు పదంలోని హతమైన భావాన్ని తగ్గిస్తుంది.
