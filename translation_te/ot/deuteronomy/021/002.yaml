  source_fidelity: హీబ్రూ వచనంలోని క్రమబద్ధమైన న్యాయచర్యను (‘అప్పుడు’), ‘నీ పెద్దలు,’ ‘నీ న్యాయాధిపతులు,’ వారు బయలుదేరడం, మరియు హతుడి సమీపంలోని పట్టణాల వరకు కొలవడం అనే అంశాలను అనువాదం నమ్మకంగా ప్రతిబింబిస్తుంది. ‘పట్టణాలకు ఎంత దూరమో కొలవాలి’ అనేది కొలత యొక్క ఉద్దేశిత సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; హత్య ఉద్దేశపూర్వకమైనదని ముందుగానే నిర్ధారించదు.
