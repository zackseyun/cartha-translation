translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధానానికి తగిన గౌరవప్రదమైన శైలి. ‘నీ’ అనే ఏకవచన సంబోధన ద్వారా మూలంలోని సమష్టి-ఏకవచన రూపం నిలుపబడింది. ప్రధాన వాక్యంలో సహజత్వం కోసం కొలవబడేది దూరమని స్పష్టం చేసి, అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
