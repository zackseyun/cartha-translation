id: DEU.21.15
reference: Deuteronomy 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: te
  text: ఒక మనిషికి ఇద్దరు భార్యలు ఉండి, అతడు ఒకరిని ప్రేమించి, మరొకరిని ప్రేమించకపోయి, ప్రేమించిన భార్యా ప్రేమించని భార్యా ఇద్దరూ అతనికి కుమారులను కని, మొదటి కుమారుడు ప్రేమించని భార్యకు పుట్టినవాడైతే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఒక ... ఉండి ... అయితే
  rationale: హీబ్రూ న్యాయశాస్త్రంలోని సందర్భాధారిత షరతును సహజమైన తెలుగు నిబంధన వాక్య నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: ఒక పురుషునికి ... ఉండి
  rationale: అక్షరార్థంగా ‘ఒక పురుషునికి ఉన్నారు’ అనే అస్తిత్వ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: שְׁתֵּי נָשִׁים
  choice: ఇద్దరు భార్యలు
  rationale: ఇక్కడ నָשִׁים సాధారణంగా స్త్రీలను కాక వివాహ సంబంధంలోని భార్యలను సూచిస్తుంది.
- source_word: הָאַחַת אֲהוּבָה
  choice: ఒకరు ప్రేమించబడినది
  rationale: అֲהוּבָה అనే కర్మణి భావాన్ని నేరుగా నిలుపుతుంది; ‘అభిమాన భార్య’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: మరొకరు ప్రేమించబడనిది
  rationale: שְׂנוּאָהకు ‘ద్వేషించబడినది’ అనే బలమైన అర్థం సాధ్యమైనప్పటికీ, ఈ వైవాహిక-న్యాయ సందర్భంలో ప్రేమింపబడిన భార్యకు వ్యతిరేకంగా ఆదరణ లేని భార్యను సూచించవచ్చు. ప్రధాన పాఠ్యంలో సంబంధాత్మక వ్యత్యాసాన్ని ఉంచి, బలమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: ఇద్దరూ అతనికి కుమారులను కని
  rationale: בָנִיםను లింగనిర్దిష్టంగా ‘కుమారులు’గా ఉంచుతుంది; ఇద్దరు భార్యలూ కుమారులను కన్నారనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: మొదటి కుమారుడు ... పుట్టినవాడైతే
  rationale: ‘మొదట పుట్టిన కుమారుడు’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ న్యాయపరమైన షరతును కొనసాగిస్తుంది.
- source_word: לַשְּׂנִיאָה
  choice: ప్రేమించబడని భార్యకు పుట్టినవాడు
  rationale: లామెద్ సూచించే సంబంధాన్ని ఇక్కడ మాతృసంబంధంగా సహజంగా వ్యక్తపరుస్తుంది; తెలుగు ‘ఆమెకు చెందినవాడు’ కంటే ‘ఆమెకు పుట్టినవాడు’ స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: కుటుంబ న్యాయ సందర్భంలో שְׂנוּאָה అనువాదం
  choice: ప్రేమించబడనిది
  alternative: ద్వేషించబడినది; తక్కువగా ప్రేమించబడినది
  rationale: ఈ పదం నిజంగా ‘ద్వేషించబడినది’ అనే బలమైన అర్థాన్ని మోయగలదు. అయితే ప్రేమించబడిన భార్యతో న్యాయపరమైన వ్యత్యాసంలో ఇది ఆదరణలేని లేదా ప్రేమింపబడని భార్యను సూచించవచ్చు. ప్రధాన పాఠ్యం సందర్భానుకూల భావాన్ని ఇస్తూ, మూలంలోని బలమైన సాధ్యతను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయశైలి. వాక్యం తరువాతి వచనంలో పూర్తయ్యే షరతు వాక్య భాగం కావడంతో చివర కామా ఉంచబడింది. ‘ప్రేమించబడినది/ప్రేమించబడనిది’ అనే సమాంతర పదజాలం హీబ్రూ వ్యత్యాసాన్ని నిలుపుతుంది.
