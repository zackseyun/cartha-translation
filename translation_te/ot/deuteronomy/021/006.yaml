  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయ-ఆచార శైలిని వాడాం. వాక్యం విధిబలాన్ని స్పష్టంగా ఉంచుతూ, חָלָל మరియు נַחַל పదాల్లోని నిజమైన అర్థవిస్తృతిని పాదసూచికల్లో నిలిపింది.
