  text: וְ/כֹ֗ל זִקְנֵי֙ הָ/עִ֣יר הַ/הִ֔וא הַ/קְּרֹבִ֖ים אֶל הֶ/חָלָ֑ל יִרְחֲצוּ֙ אֶת יְדֵי/הֶ֔ם עַל הָ/עֶגְלָ֖ה הָ/עֲרוּפָ֥ה בַ/נָּֽחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: te
  text: హతుడైన వ్యక్తికి[a] అత్యంత సమీపంలో ఉన్న ఆ పట్టణపు పెద్దలందరూ, వాగులో[b] మెడ విరగ్గొట్టబడిన ఆ పెయ్యపై తమ చేతులను కడుక్కోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హతుడి మృతదేహానికి సమీపంలో.’ హెబ్రీ పదం హతుడైన వ్యక్తిని లేదా హతుడి మృతదేహాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘లోయలో’ లేదా ‘వాగుపడగలో.’ హెబ్రీ పదం నీటి ప్రవాహంతో సంబంధమున్న వాగును, లోయను, లేదా వాగుపడగను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: అప్పుడు … అందరూ
  rationale: వావ్ సంధి ఇక్కడ ఆచారక్రమంలోని తదుపరి చర్యను కొనసాగిస్తుంది; ‘అప్పుడు’ తెలుగులో ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది, ‘అందరూ’ כֹל యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: ఆ పట్టణపు పెద్దలు
  rationale: זִקְנֵי అనేది సమాజపు అధికారిక పెద్దలను సూచిస్తుంది; עִיר సందర్భానుసారం నగరం లేదా పట్టణం కావచ్చు. సాధారణ ఆధునిక తెలుగులో ‘పట్టణం’ ఇక్కడ సహజంగా ఉంది; నిర్దిష్టతను ‘ఆ’ నిలుపుతుంది.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: హతుడైనవానికి అత్యంత సమీపంగా ఉన్న
  rationale: קְרֹבִים אֶל సమీపాన్ని సూచిస్తుంది. חָלָל హతుడైన వ్యక్తిని లేదా అతని మృతదేహాన్ని సూచించగలదు; ప్రధాన పాఠంలో హత్యాసందర్భం స్పష్టంగా ఉండేలా ‘హతుడైనవానికి’ ఎంచుకుని, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: తమ చేతులు కడుక్కోవాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం న్యాయవిధిలో నిర్దేశాత్మక బలాన్ని కలిగి ఉంది. ‘కడుక్కోవాలి’ ఆధునిక తెలుగులో ఆ విధిబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל
  choice: పై
  rationale: ఆచార సమయంలో చేతులు కడుక్కోవడం పెయ్యకు పైన జరుగుతుందని సూచించే స్థానార్థాన్ని ‘పై’ నేరుగా నిలుపుతుంది.
- source_word: הָעֶגְלָה
  choice: పెయ్య
  rationale: עֶגְלָה యువ ఆడ పశువును సూచిస్తుంది. ‘పెయ్య’ దీనికి సంక్షిప్తమైన, ప్రామాణిక తెలుగు పదం.
- source_word: הָעֲרוּפָה
  choice: మెడ విరగ్గొట్టబడిన
  rationale: ערף ఈ ఆచారసందర్భంలో సాధారణ వధకన్నా మెడ విరగ్గొట్టడాన్ని సూచిస్తుంది; ఈ అనువాదం తల నరికివేయబడిందనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: בַנָּחַל
  choice: వాగులో
  rationale: נַחַל నీటి ప్రవాహంతో సంబంధమున్న వాగు, వాగుపడగ, లేదా లోయను సూచించగలదు. ‘వాగులో’ సాధారణ పాఠకులకు సహజంగా ఉండి భౌగోళిక భావాన్ని నిలుపుతుంది; విస్తృతార్థాన్ని పాదసూచిక వివరిస్తుంది.
