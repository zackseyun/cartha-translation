source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: te
  text: అతడు తనకు కలిగినదాన్ని తన కుమారులకు వారసత్వంగా ఇచ్చే రోజున, ద్వేషించబడిన భార్యకు పుట్టిన జ్యేష్ఠపుత్రునికంటే ప్రేమించబడిన భార్య కుమారుణ్ణి జ్యేష్ఠపుత్రునిగా పరిగణించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రేమించబడని భార్య’ లేదా ‘తక్కువగా ప్రేమించబడిన భార్య.’ హీబ్రూ అక్షరార్థంగా ‘ప్రేమించబడిన,’ ‘ద్వేషించబడిన’ అని వ్యత్యాసం చూపుతుంది; అయితే కుటుంబ చట్ట సందర్భంలో రెండవది ఆమెను తీవ్రంగా ద్వేషించారని కాక, తులనాత్మకంగా తక్కువ ఆదరణ పొందిందని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: ఆ రోజున
  rationale: ఇది ధర్మశాస్త్రంలోని ఒక సందర్భాన్ని పరిచయం చేసే కాలసూచక ప్రయోగం. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘...రోజున’గా ఇచ్చాం.
- source_word: הַנְחִילוֹ אֶת־בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: అతడు తనకు కలిగినదాన్ని తన కుమారులకు వారసత్వంగా ఇచ్చే
  rationale: נחל హిఫీల్ రూపంలోని ‘వారసులుగా చేయడం/వారసత్వం ఇవ్వడం’ అనే కారణార్థాన్ని, అలాగే אֵת אֲשֶׁר יִהְיֶה לוֹ అనే ప్రత్యేక కర్మను నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יוּכַל
  choice: పరిగణించకూడదు
  rationale: ఇక్కడ ఇది శారీరక అసమర్థతను కాక చట్టపరమైన నిషేధాన్ని సూచిస్తుంది; అందువల్ల ‘కూడదు’ తగినది.
- source_word: לְבַכֵּר
  choice: జ్యేష్ఠునిగా పరిగణించు
  rationale: కేవలం పుట్టుక క్రమాన్ని ప్రకటించడం కాక, జ్యేష్ఠపుత్రుని హోదా లేదా హక్కులు ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: בֶּן הָאֲהוּבָה
  choice: ప్రేమించబడిన భార్య కుమారుడు
  rationale: హీబ్రూ కృదంతంలోని ‘ప్రేమించబడిన’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; సందర్భం వల్ల ‘భార్య’ను స్పష్టంగా పేర్కొన్నాం.
- source_word: עַל־פְּנֵי
  choice: '...కంటే'
  rationale: ఈ చట్టపరమైన పోలికలో మరొకరికి మించి ప్రాధాన్యం ఇవ్వడాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: ద్వేషించబడిన భార్య కుమారుడు
  rationale: שׂנא పదంలోని బలమైన ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; తులనాత్మకంగా తక్కువ ప్రేమించబడినది అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הַבְּכֹר
  choice: జ్యేష్ఠుడైన
  rationale: ద్వేషించబడిన భార్య కుమారుడే వాస్తవ జ్యేష్ఠపుత్రుడని విశేషణ రూపంలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: బహుభార్యత్వ కుటుంబ సందర్భంలోని ప్రేమ–ద్వేష వ్యత్యాసం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రేమించబడిన భార్య’, ‘ద్వేషించబడిన భార్య’ అని ఉంచడం
  alternative: ‘ఎక్కువగా ప్రేమించబడిన భార్య’, ‘తక్కువగా ప్రేమించబడిన భార్య’
  rationale: హీబ్రూ బలమైన విరుద్ధ పదజంటను వాడుతుంది; దానిని ప్రధాన పాఠ్యంలో అనవసరంగా మృదువుచేయలేదు. అయితే కుటుంబ సంబంధ సందర్భంలో ఇది తులనాత్మక ఆదరణను సూచించే అవకాశాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చట్టపరమైన శైలి వాడబడింది. ‘జ్యేష్ఠుడు’ అనే పదం పుట్టుక క్రమాన్నీ దానితో కూడిన చట్టపరమైన హోదానీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
