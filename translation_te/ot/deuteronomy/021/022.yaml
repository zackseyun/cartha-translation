  to: ఒక మనిషిలో మరణశిక్షకు తగిన పాపం[a] ఉండి, అతనికి మరణశిక్ష అమలు చేసి, అతన్ని ఒక చెట్టుమీద[b] వేలాడదీస్తే,
  rationale: The revision changes only the Telugu postposition for עַל עֵץ, from directional చెట్టుకు ('to a tree') to locative చెట్టుమీద ('on a tree'). Footnote b is conformed to the same source meaning. No additional interpretation of the execution device or procedure has been introduced.
