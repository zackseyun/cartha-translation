id: DEU.21.22
reference: Deuteronomy 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: te
  text: ఒక మనిషిలో మరణశిక్షకు తగిన పాపం[a] ఉండి, అతనికి మరణశిక్ష అమలు చేసి, అతన్ని ఒక చెట్టుమీద[b] వేలాడదీస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణానికి పాత్రమైన,” లేక “మరణ తీర్పు కింద ఉన్న.” హీబ్రూ పదబంధం అక్షరార్థంగా “మరణ తీర్పుగల పాపం” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక కొయ్యమీద” లేక “ఒక స్తంభంపై.” హీబ్రూలో అక్షరార్థంగా “ఒక చెట్టుమీద” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: ఒక ... ఉండి ... చేస్తే
  rationale: హీబ్రూ న్యాయసూత్రంలోని షరతును తెలుగులో సహజమైన ‘ఉండి ... చేస్తే’ నిర్మాణంతో వ్యక్తం చేసింది; వాక్యారంభంలోని וְ ను విడిగా ‘మరియు’ అని అనువదించడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: יִהְיֶה בְ/אִישׁ
  choice: ఒక మనిషిలో ... ఉండి
  rationale: అస్తిత్వాన్ని సూచించే היה మరియు בְּאִישׁ అనే హీబ్రూ ప్రయోగాన్ని దగ్గరగా నిలుపుతూ, పురుష ఏకవచన న్యాయవిషయాన్ని ‘మనిషి’గా ఉంచింది.
- source_word: חֵטְא
  choice: పాపం
  rationale: ఈ పదంలోని నైతిక, న్యాయపరమైన రెండు కోణాలను నిలుపుతుంది; ‘నేరం’ అని మాత్రమే అనడం భావాన్ని అనవసరంగా కుదిస్తుంది.
- source_word: מִשְׁפַּט מָוֶת
  choice: మరణశిక్షకు తగిన
  rationale: అక్షరార్థంగా అస్పష్టత కలిగిన ‘మరణ తీర్పు/న్యాయం’ అనే నిర్మాణాన్ని సందర్భానుసారంగా సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలిపింది.
- source_word: וְ/הוּמָת
  choice: అతనికి మరణశిక్ష అమలు చేసి
  rationale: מות హోఫాల్ రూపంలోని కారణాత్మక కర్మణి భావాన్ని న్యాయసందర్భంలో స్పష్టంగా తెలుపుతుంది.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: అతన్ని ... వేలాడదీస్తే
  rationale: תלה యొక్క ‘వేలాడదీయడం’ అనే ప్రాథమిక భావాన్ని, రెండవ పురుష ఆదేశాత్మక న్యాయనిర్మాణాన్ని తెలుగులో షరతు ఉపవాక్యంగా సహజంగా వ్యక్తం చేసింది.
- source_word: עַל עֵץ
  choice: ఒక చెట్టుకు
  rationale: עֵץ యొక్క సాధారణ అర్థమైన ‘చెట్టు’ను నిలుపుతుంది; ‘కొయ్య/స్తంభం’ వంటి మరింత నిర్దిష్ట పునర్నిర్మాణాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
theological_decisions:
- issue: లింగసూచిత న్యాయవిషయం
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి / ఎవరైనా
  rationale: హీబ్రూ אִישׁ పురుష ఏకవచనాన్ని సూచిస్తుంది. అందువల్ల మూలంలోని లింగసూచనను తటస్థీకరించకుండా ఉంచింది.
- issue: עַל עֵץ యొక్క అనువాదం
  choice: ఒక చెట్టుకు
  alternative: ఒక కొయ్యకు / స్తంభానికి
  rationale: హీబ్రూ పదంలోని సాధారణ అర్థాన్ని, దాని తరువాతి లేఖన సంబంధ ప్రతిధ్వనులను నిలుపుతూ, శిక్షాసాధనం గురించి మూలం చెప్పనంత నిర్దిష్టతను జోడించదు.
- issue: మరణశిక్ష విధించే క్రమం మరియు వేలాడదీయడం
  choice: ముందు మరణశిక్ష అమలు చేసి, తరువాత వేలాడదీయడం అనే మూల క్రమాన్ని యథాతథంగా ఉంచడం
  alternative: వేలాడదీయడమే మరణశిక్ష విధానమని స్పష్టీకరించడం
  rationale: వాక్యంలోని వరుస క్రియలు మరణం తరువాత వేలాడదీయడాన్ని సూచించవచ్చు; అయితే ఈ వచనంలో లేనంత వివరణను చేర్చకుండా వ్యాకరణ క్రమాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించింది. హీబ్రూ షరతు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాతో ముగించింది. ‘మరణశిక్షకు తగిన పాపం’ అనే రూపం మూలంలోని నైతిక-న్యాయ ఉద్వేగాన్ని నిలుపుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
