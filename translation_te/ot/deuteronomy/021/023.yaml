source:
  edition: WLC
  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: te
  text: అతని శవం చెట్టుమీద రాత్రంతా అలాగే ఉండకూడదు[a]. ఆ రోజే నీవు అతన్ని తప్పకుండా పాతిపెట్టాలి; ఎందుకంటే వేలాడదీయబడినవాడు దేవుని శాపగ్రస్తుడు. నీ దేవుడైన యెహోవా నీకు స్వాస్థ్యంగా ఇస్తున్న దేశాన్ని నీవు అపవిత్రం చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే వేలాడదీయబడినవాడు దేవునిచేత శపించబడినవాడు”; మరో విధంగా, “ఎందుకంటే వేలాడదీయడం దేవునికి అవమానం.” హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉండి ఒకటికంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: రాత్రంతా ఉండకూడదు
  rationale: לון క్రియ రాత్రివేళ ఉండిపోవడాన్ని సూచిస్తుంది; ఈ ఎంపిక నిషేధంలోని కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִבְלָתוֹ
  choice: అతని శవం
  rationale: נְבֵלָה జీవంలేని దేహాన్ని సూచిస్తుంది; ‘శవం’ అనేది ‘దేహం’ కంటే మూలపదానికి మరింత నిర్దిష్టమైన సమానం.
- source_word: עַל הָעֵץ
  choice: చెట్టు మీద
  rationale: עֵץ అంటే చెట్టు లేదా కలప; ఇక్కడ ‘చెట్టు’ మూలరూపాన్ని, తరువాతి బైబిలు ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: అతన్ని తప్పకుండా పాతిపెట్టాలి
  rationale: క్రియానామం మరియు అసంపూర్ణ క్రియ కలయిక ఆజ్ఞను బలపరుస్తుంది; ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: అదే రోజున, రాత్రి పడకముందే పాతిపెట్టాలనే కాలపరమైన బలాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: קִלְלַת אֱלֹהִים
  choice: దేవుని శాపం
  rationale: ఈ సంక్షిప్త హీబ్రూ సమాసం దేవునికి చెందిన లేదా దేవుని నుండి వచ్చిన శాపాన్ని సూచించగలదు; ప్రధాన పాఠంలో ‘దేవుని శాపం కింద’ అని ఇచ్చి సంబంధాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: תָלוּי
  choice: వేలాడదీయబడినవాడు
  rationale: నిష్క్రియ కృదంతం వేలాడదీయబడిన వ్యక్తిని సూచిస్తుంది; తెలుగు రూపం నిష్క్రియ భావాన్ని నిలుపుతుంది.
- source_word: תְטַמֵּא
  choice: అపవిత్రం చేయకూడదు
  rationale: טמא దేశానికి సంబంధించి ఆచారపరమైన, నైతికమైన కలుషత భావాలను కలిగి ఉంది; ‘అపవిత్రం చేయు’ రెండింటినీ మోయగలదు.
- source_word: אַדְמָתְךָ
  choice: మీ దేశాన్ని
  rationale: అక్షరార్థంగా నేల/భూమి అయినప్పటికీ, స్వాస్థ్యంగా ఇవ్వబడే ప్రదేశం అనే నిబంధన సందర్భంలో ‘దేశం’ సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా అందిస్తుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: వారసత్వంగా పొందిన స్థిరమైన సొత్తు అనే నిబంధనాత్మక భావాన్ని ‘స్వాస్థ్యం’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: כִּי קִלְלַת אֱלֹהִים תָּלוּי అనే వాక్యభాగం యొక్క అర్థం
  choice: వేలాడదీయబడినవాడు దేవుని శాపం కింద ఉన్నాడు
  alternative: ‘వేలాడదీయబడినవాడు దేవునిచేత శపించబడినవాడు’ లేదా ‘వేలాడదీయడం దేవునికి అవమానం’
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉండి ఒకటికంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం బహిరంగంగా వేలాడదీయబడిన వ్యక్తి దైవశాప సూచన కింద ఉన్నాడనే సందర్భోచిత భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచి నిజమైన అనిశ్చితిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ఏకవచన హీబ్రూ సంబోధనను తెలుగులో గౌరవప్రదమైన ‘మీరు/మీ’ రూపంతో అందించాం. దైవనామాన్ని ‘యెహోవా’గా ఉంచాం; వివాదాస్పద శాపవాక్యంలోని భావసందిగ్ధతను పాదసూచికలో నిలిపాం.
