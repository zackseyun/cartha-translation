revisions:
- from: అతని శవం చెట్టు మీద రాత్రంతా ఉండకూడదు[a]. ఆ రోజే అతన్ని తప్పకుండా పాతిపెట్టాలి; ఎందుకంటే వేలాడదీయబడినవాడు దేవుని శాపం కింద ఉన్నాడు. మీ దేవుడైన యెహోవా మీకు స్వాస్థ్యంగా ఇస్తున్న దేశాన్ని మీరు అపవిత్రం చేయకూడదు.
