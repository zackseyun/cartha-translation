id: DEU.21.10
reference: Deuteronomy 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תֵצֵ֥א לַ/מִּלְחָמָ֖ה עַל אֹיְבֶ֑י/ךָ וּ/נְתָנ֞/וֹ יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/יָדֶ֖/ךָ וְ/שָׁבִ֥יתָ שִׁבְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: te
  text: నీవు నీ శత్రువులతో యుద్ధం చేయడానికి బయలుదేరినప్పుడు, నీ దేవుడైన యాహ్వే వారిని[a] నీ చేతికి అప్పగించి, నీవు వారిలోని వారిని చెరపట్టుకుంటావు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతనిని/దానిని నీ చేతికి అప్పగించి.’ ఏకవచన ప్రత్యయం శత్రుసేనను సమష్టిగా సూచిస్తున్నట్లు ఉంది; అందుకే పాఠంలో ‘వారిని’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి నుండి బందీలను పట్టుకుంటావు.’ హీబ్రూలో ‘చెరపట్టు’ అనే క్రియతో అదే మూలానికి చెందిన ‘చెరసొమ్ము/బందీలు’ అనే నామవాచకం కలిసి ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: బయలుదేరినప్పుడు
  rationale: ఇక్కడ ఇది ఒక నియమానికి సంబంధించిన సందర్భాన్ని పరిచయం చేస్తోంది; అందువల్ల షరతును సూచించే ‘ఒకవేళ’ కంటే ‘అప్పుడు’ అనే భావం సహజంగా సరిపోతుంది.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి బయలుదేరినప్పుడు
  rationale: יָצָא యొక్క ‘బయలుదేరు’ అనే కదలిక భావాన్ని, לַמִּלְחָמָה యొక్క సైనిక ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַל אֹיְבֶיךָ
  choice: నీ శత్రువులతో
  rationale: వైరపూరిత చర్య సందర్భంలో עַל ‘వ్యతిరేకంగా/మీదికి’ అనే భావం ఇస్తుంది; తెలుగులో ‘శత్రువులతో యుద్ధం’ సహజమైన ప్రయోగం.
- source_word: וּנְתָנוֹ
  choice: వారిని అప్పగించి
  rationale: క్రియకు ఏకవచన ప్రత్యయం ఉన్నా, ముందున్న బహువచన ‘శత్రువులు’ను సమూహంగా సూచిస్తుంది. נתן యొక్క ‘ఇవ్వు/అప్పగించు’ భావంలో ‘అప్పగించు’ ఈ యుద్ధ సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నిబంధనాత్మక సంబోధనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: అధికారంలోకి అప్పగించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: నీవు వారి చెరను పట్టుకుంటే
  rationale: שׁבה/שׁבי అనే సమానమూల క్రియా-నామ ప్రయోగాన్ని కొంతవరకు ప్రతిబింబిస్తూ, ఓడిన శత్రువుల నుంచి చెరపట్టడమనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: దేవుడు శత్రువును ‘చేతికి ఇవ్వడం’
  choice: నీ చేతికి అప్పగించి
  alternative: నీ అధికారంలో ఉంచి
  rationale: మూలంలోని మానవాకార రూపకాన్ని మరియు యుద్ధఫలితం దేవుని చర్యగా చెప్పే వేదాంత ఉద్రిక్తతను వివరణతో సున్నితపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. వచనం తరువాతి నియమానికి ముందుమాట కాబట్టి చివర కామాను ఉంచాం. హీబ్రూ సమూహ ఏకవచనం మరియు సమానమూల క్రియా-నామ ప్రయోగాలను పాదటిప్పణుల్లో నమోదు చేశాం.
