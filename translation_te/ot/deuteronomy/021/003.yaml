translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధానానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ‘పెయ్య’ అనే సంక్షిప్త పదానికి పాఠక సహాయార్థం ప్రత్యామ్నాయ వివరణను పాదటిప్పణిలో ఇచ్చాం.
