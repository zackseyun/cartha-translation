  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֣ה הָ/עִ֔יר הַ/קְּרֹבָ֖ה אֶל הֶ/חָלָ֑ל וְ/לָֽקְח֡וּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֜וא עֶגְלַ֣ת בָּקָ֗ר אֲשֶׁ֤ר לֹֽא עֻבַּד֙ בָּ֔/הּ אֲשֶׁ֥ר לֹא מָשְׁכָ֖ה בְּ/עֹֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: te
  text: చంపబడినవాడు ఉన్న చోటుకు అతి దగ్గరగా ఉన్న పట్టణపు పెద్దలు, ఇంతవరకు పనికి ఉపయోగించని, కాడి కట్టి లాగని మందలోని ఒక పెయ్యను[a] తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మందలోని ఒక చిన్న ఆడ దూడను.” ఇక్కడి హీబ్రూ పదబంధం పశుమందకు చెందిన చిన్న వయసు ఆడ పశువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָעִיר הַקְּרֹבָה אֶל הֶחָלָל
  choice: చంపబడినవాడు ఉన్న చోటుకు అతి దగ్గరగా ఉన్న పట్టణపు
  rationale: హీబ్రూ న్యాయవిధాన వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, הֶחָלָל అనే పదంలోని ‘చంపబడిన వ్యక్తి’ భావాన్ని నిలుపుతుంది.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: పట్టణపు పెద్దలు ... తీసుకోవాలి
  rationale: పట్టణ సమాజానికి అధికారికంగా ప్రాతినిధ్యం వహించే పెద్దలకు ఇచ్చిన న్యాయపరమైన ఆదేశాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: עֶגְלַת בָּקָר
  choice: మందలోని ఒక పెయ్యను
  rationale: עֶגְלָה సూచించే చిన్న వయసు ఆడ పశువుకు ‘పెయ్య’ సహజమైన తెలుగు పదం; בָּקָר దానిని పశుమందకు చెందినదిగా నిర్దిష్టం చేస్తుంది.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: ఇంతవరకు పనికి ఉపయోగించని
  rationale: ఆ పశువు ద్వారా ఇంతకు ముందు పని చేయించలేదనే హీబ్రూ కర్మణి-సాధనార్థ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: కాడి కట్టి లాగని
  rationale: משך అనే ‘లాగు’ భావాన్ని, עֹל అనే పనిపశువుకు కట్టే కాడి భావాన్ని నేరుగా నిలుపుతూ, అది బరువు లాగే పనికి వాడబడలేదని తెలియజేస్తుంది.
