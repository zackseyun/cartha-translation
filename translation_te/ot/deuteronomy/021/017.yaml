id: DEU.21.17
reference: Deuteronomy 21:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: te
  text: కాని అతడు ప్రేమించబడని భార్య కుమారుడైన జ్యేష్ఠుణ్ణి[a] జ్యేష్ఠుడిగా గుర్తించి, తనకు ఉన్న ఆస్తి అంతటిలో అతనికి రెండింతల వాటా[b] ఇవ్వాలి. ఎందుకంటే అతడు తండ్రి బలానికి ప్రథమఫలం[c]; జ్యేష్ఠత్వపు హక్కు అతనిదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జ్యేష్ఠుడు’ అంటే వారసత్వ హక్కుగల మొదట పుట్టిన కుమారుడు. లేదా, మరింత అక్షరార్థంగా, ‘ద్వేషించబడిన భార్య కుమారుడు’; ఈ సందర్భంలో అది ప్రేమించబడిన భార్యతో పోలిస్తే తక్కువగా ప్రేమించబడిన భార్యను సూచించవచ్చు.
    reason: lexical_clarification
  - marker: b
    text: అక్షరార్థంగా ‘రెండు నోరు’; ఇది రెండింతల వాటాను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తండ్రి శక్తికి ఆరంభం.’ ఈ హీబ్రూ పదబంధం తండ్రి సంతానోత్పాదక బలం మొదట వ్యక్తమైన సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: జ్యేష్ఠుడిగా గుర్తించి
  rationale: హిఫిల్ రూపం ఇక్కడ నిజమైన జ్యేష్ఠ కుమారుని చట్టబద్ధమైన హోదాను అంగీకరించడం లేదా గుర్తించడం అనే న్యాయార్థాన్ని ఇస్తుంది.
- source_word: הַבְּכֹר
  choice: జ్యేష్ఠుణ్ణి
  rationale: వారసత్వ హక్కుగల మొదట పుట్టిన కుమారుని సూచించే ప్రామాణిక కుటుంబ-న్యాయ పదంగా ‘జ్యేష్ఠుడు’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: ప్రేమించబడని భార్య కుమారుడైన
  rationale: שְׂנוּאָה అక్షరార్థంగా ‘ద్వేషించబడిన’ అని రావచ్చు; అయితే ప్రేమించబడిన భార్యతో ఉన్న తులనాత్మక వైవాహిక సందర్భంలో తక్కువ ప్రేమ పొందిన లేదా ప్రేమించబడని భార్య అనే భావం అనుకూలం.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: అతనికి రెండింతల వాటా ఇవ్వాలి
  rationale: ‘రెండు నోరు’ అనే హీబ్రూ నుడికారం వారసత్వంలో ఇతర కుమారుని వాటాకు రెండింతల భాగాన్ని సూచిస్తుంది.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: తనకు ఉన్న ఆస్తి అంతటిలో
  rationale: తండ్రి అధీనంలో ఉన్నదంతా, అంటే అతని వారసత్వ ఆస్తి, అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
- source_word: רֵאשִׁית אֹנוֹ
  choice: తన బలానికి ప్రథమఫలం
  rationale: తండ్రి సంతానోత్పాదక శక్తి మొదట వ్యక్తమైన సంతానాన్ని సూచించే మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: జ్యేష్ఠత్వపు హక్కు
  rationale: జ్యేష్ఠ హోదాకు అనుసంధానమైన చట్టబద్ధమైన వారసత్వ హక్కును సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כִּי ... כִּי
  choice: కాని ... ఎందుకంటే
  rationale: మొదటి כִּי ముందరి వచనంలోని పక్షపాత నిషేధానికి వ్యతిరేక భావాన్ని, రెండవది ఆ ఆజ్ఞకు కారణాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: న్యాయ సందర్భంలో שְׂנוּאָה అనే వైవాహిక సంబంధపదం
  choice: ప్రేమించబడని భార్య
  alternative: ద్వేషించబడిన భార్య; తక్కువగా ప్రేమించబడిన భార్య
  rationale: ఈ పదం బలమైన వ్యక్తిగత ద్వేషాన్ని తప్పనిసరిగా ప్రకటించకుండా, ప్రేమించబడిన భార్యతో పోల్చినప్పుడు తక్కువ ఆదరణ పొందిన భార్యను సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన తులనాత్మక భావాన్ని ఉంచి, మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని అనుసరించాం. ‘జ్యేష్ఠుడు,’ ‘వాటా,’ ‘హక్కు’ వంటి సులభంగా అర్థమయ్యే పదాలను వాడి, רֵאשִׁית אֹנוֹ లోని రూపకాన్ని ‘బలానికి ప్రథమఫలం’గా నిలిపాం. ప్రధాన పాఠంలోని [a], [b], [c] సూచికలన్నీ సంబంధిత పాదసూచికలతో సరిపోతాయి.
