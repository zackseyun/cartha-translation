- from: అప్పుడు వారు అతని పట్టణపు పెద్దలతో, “మా ఈ కుమారుడు మొండివాడు, తిరుగుబాటుచేసేవాడు; అతడు మా మాట వినడు[a]; తిండిపోతు, తాగుబోతు” అని చెప్పాలి.
