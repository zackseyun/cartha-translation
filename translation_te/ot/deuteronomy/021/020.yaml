id: DEU.21.20
reference: Deuteronomy 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמְר֞וּ אֶל זִקְנֵ֣י עִיר֗/וֹ בְּנֵ֤/נוּ זֶה֙ סוֹרֵ֣ר וּ/מֹרֶ֔ה אֵינֶ֥/נּוּ שֹׁמֵ֖עַ בְּ/קֹלֵ֑/נוּ זוֹלֵ֖ל וְ/סֹבֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: te
  text: అప్పుడు వారు అతని పట్టణపు పెద్దలతో, “మా ఈ కుమారుడు మొండివాడు, తిరుగుబాటుదారుడు; అతడు మా మాట వినడు[a]; తిండిపోతు, తాగుబోతు” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మాకు లోబడడు.” హీబ్రూలో అక్షరార్థంగా, “అతడు మా స్వరం వినడు”; ఇక్కడ ‘వినడం’లో మాటను ఆలకించి పాటించడం అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: అప్పుడు వారు ... అని చెప్పాలి
  rationale: న్యాయవిధానంలోని వరుస చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలోని విధ్యర్థక బలాన్ని ‘చెప్పాలి’ నిలుపుతుంది.
- source_word: זִקְנֵי עִירוֹ
  choice: అతని పట్టణపు పెద్దలు
  rationale: זִקְנֵי పరిపాలనా నాయకులైన పెద్దలను సూచిస్తుంది. עִיר నగరం లేదా పట్టణం కావచ్చు; ఈ సామాజిక-న్యాయ సందర్భంలో ‘పట్టణం’ సహజంగా ఉంది.
- source_word: בְּנֵנוּ זֶה
  choice: మా ఈ కుమారుడు
  rationale: నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను, తల్లిదండ్రులతో సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: סוֹרֵר
  choice: మొండివాడు
  rationale: దారితప్పి, మాటకు లొంగకుండా పట్టుదలతో ఎదిరించే స్వభావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמֹרֶה
  choice: తిరుగుబాటుచేసేవాడు
  rationale: కేవలం అవిధేయతకంటే చురుకైన ప్రతిఘటనను సూచిస్తూ, ముందు పదంతో ఉన్న భావవృద్ధిని నిలుపుతుంది.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: అతడు మా మాట వినడు
  rationale: హీబ్రూ ‘మా స్వరాన్ని వినడు’ అనే నుడికారాన్ని సహజ తెలుగులో ఇస్తూ, వినడం అనే క్రియలోని లోబడడం/పాటించడం భావాన్ని కూడా నిలుపుతుంది.
- source_word: זוֹלֵל
  choice: తిండిపోతు
  rationale: సందర్భంలో తిండికి అతిగా లోబడిన అలవాటుగల వ్యక్తిని సూచిస్తుంది; తరువాతి ‘తాగుబోతు’తో సహజమైన జంటగా ఉంటుంది.
- source_word: וְסֹבֵא
  choice: తాగుబోతు
  rationale: మద్యపానానికి అలవాటుపడిన వ్యక్తిని సూచించే పాల్గొనేవాచకపు అలవాటు భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధానానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలంతోనూ అనువదించబడింది. ‘మొండివాడు, తిరుగుబాటుచేసేవాడు’ మరియు ‘తిండిపోతు, తాగుబోతు’ అనే జంటలు మూలంలోని ఆరోపణాత్మక సమాంతర నిర్మాణాన్ని నిలుపుతాయి.
