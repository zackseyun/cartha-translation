source:
  edition: WLC
  text: וְ/תָ֥פְשׂוּ ב֖/וֹ אָבִ֣י/ו וְ/אִמּ֑/וֹ וְ/הוֹצִ֧יאוּ אֹת֛/וֹ אֶל זִקְנֵ֥י עִיר֖/וֹ וְ/אֶל שַׁ֥עַר מְקֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: te
  text: అప్పుడు అతని తండ్రి, అతని తల్లి అతన్ని గట్టిగా పట్టుకొని బయటకు తీసుకువెళ్లి, అతని పట్టణ పెద్దల వద్దకు, అతని స్థలంలోని ద్వారం వద్దకు[a][b] తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పట్టణ ద్వారం అనేది స్థానిక పెద్దలు న్యాయవ్యవహారాలను విచారించే బహిరంగ స్థలం.
    reason: cultural_note
  - marker: b
    text: లేదా, “అతని పట్టణ ద్వారం వద్దకు.” హీబ్రూలో, “అతని స్థలపు ద్వారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: అతన్ని గట్టిగా పట్టుకొని
  rationale: תפשׂ అనే క్రియకు ב ఉపసర్గ చేరి శారీరకంగా అదుపులోకి తీసుకునే భావాన్ని ఇస్తుంది. ‘గట్టిగా పట్టుకొని’ అనేది ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָבִיו וְאִמּוֹ
  choice: అతని తండ్రి, అతని తల్లి
  rationale: హీబ్రూ పాఠం ఇద్దరు తల్లిదండ్రులను వేర్వేరు స్వామ్యప్రత్యయాలతో స్పష్టంగా పేర్కొంటుంది; ఈ రూపం ఇద్దరూ కలిసి చర్య తీసుకుంటున్నారనే న్యాయపరమైన ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: తీసుకురావాలి
  rationale: יצא యొక్క హిఫీల్ రూపం ‘బయటికి తీసుకువెళ్లడం/తీసుకురావడం’ అనే కారణార్థాన్ని ఇస్తుంది. తెలుగు దృష్టికోణంలో గమ్యస్థానమైన పెద్దల దగ్గరికి తీసుకురావడాన్ని ఈ పదప్రయోగం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: అతని పట్టణ పెద్దల దగ్గరికి
  rationale: זקני העיר స్థానిక సమాజపు నాయకులు లేదా న్యాయవిచారణ చేసే పెద్దలను సూచించే స్థిరమైన న్యాయపరమైన పదబంధం. ‘పట్టణ పెద్దలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: అతని నివాసస్థలపు ద్వారం దగ్గరికి
  rationale: שׁער న్యాయ సందర్భంలో బహిరంగ విచారణ జరిగే పట్టణ ద్వారాన్ని సూచిస్తుంది; מקום అక్షరార్థంగా ‘స్థలం.’ ‘నివాసస్థలం’ స్థానిక సమాజాన్ని సూచించే భావాన్ని ఇస్తూనే హీబ్రూలో ‘పట్టణం’ మళ్లీ రాకపోవడాన్ని గౌరవిస్తుంది.
