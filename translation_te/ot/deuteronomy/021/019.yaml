translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయపరమైన గంభీరతను నిలిపే శైలి వాడబడింది. ‘గట్టిగా పట్టుకొని’ చర్యలోని బలాన్ని, ‘పట్టణ పెద్దలు’ స్థానిక అధికారులను స్పష్టంగా తెలియజేస్తాయి. మూలంలోని מקום పదానికి ఉన్న స్వల్ప అస్పష్టతను ప్రధాన పాఠం మరియు ప్రత్యామ్నాయ పాదటిప్పణి ద్వారా నిలిపాం.
