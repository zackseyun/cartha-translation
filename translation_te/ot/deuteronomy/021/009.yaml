id: DEU.21.9
reference: Deuteronomy 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּבַעֵ֛ר הַ/דָּ֥ם הַ/נָּקִ֖י מִ/קִּרְבֶּ֑/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: te
  text: కాబట్టి నీవు నీ మధ్య నుండి నిర్దోషి రక్తాన్ని తొలగించాలి; ఎందుకంటే నీవు యహ్వే దృష్టిలో సరైనది చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: కాబట్టి నీవు
  rationale: సంయోజక అవ్యయం, స్వతంత్ర సర్వనామం కలిసి ముందటి ఆచారానికి ముగింపు ఫలితాన్ని బలంగా సూచిస్తున్నాయి; ‘కాబట్టి నీవు’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תְּבַעֵר
  choice: తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసంబంధ సందర్భాల్లో పియేల్ రూపం సమాజం మధ్యనుండి చెడును లేదా రక్తదోషాన్ని నిర్మూలించడాన్ని సూచిస్తుంది. ‘తొలగించాలి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి ఆ విధిబద్ధ భావాన్ని నిలుపుతుంది.
- source_word: הַדָּם הַנָּקִי
  choice: నిర్దోషి రక్తదోషాన్ని
  rationale: పదశః ‘నిర్దోషి రక్తం’; అయితే ఈ సందర్భంలో నిరపరాధి రక్తం చిందించబడడం వల్ల సమాజంపై నిలిచే బాధ్యతను సూచిస్తుంది. ప్రధాన పాఠంలో ‘రక్తదోషం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; పదశః ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: מִקִּרְבֶּךָ
  choice: నీ మధ్య నుండి
  rationale: ఇశ్రాయేలు సమాజం లోపల నుండి తొలగించడాన్ని తెలిపే నిబంధనాత్మక, న్యాయపరమైన వ్యక్తీకరణను సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: చేయడం ద్వారా
  rationale: ఇక్కడ כִּי ను కేవలం కారణార్థక ‘ఎందుకంటే’గా చదవడం తెలుగు వాక్యంలో అసహజతను, భావసందిగ్ధతను కలిగిస్తుంది. సందర్భంలో నిర్దేశించిన కార్యాన్ని చేయడం వల్ల రక్తదోషం తొలగుతుందనే సాధనాత్మక/ఫలిత సంబంధాన్ని ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది; కారణార్థక పఠనం పాదటిప్పణిలో సూచించబడింది.
- source_word: תַעֲשֶׂה הַיָּשָׁר
  choice: సరైనది చేయడం
  rationale: అసంపూర్ణ క్రియారూపానికి ఇక్కడ విధిబద్ధ భావం ఉంది; విశేషణం నామవాచకంగా పనిచేసి ‘సరైనది’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: దైవిక మదింపును తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా ఉంచడం ఒడంబడిక నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: ‘నిర్దోషి రక్తం’లోని సామూహిక బాధ్యత
  choice: నిర్దోషి రక్తదోషం
  alternative: నిర్దోషి రక్తం
  rationale: సందర్భం గుర్తుతెలియని హత్య వల్ల సమాజంపై నిలిచే రక్తపాత బాధ్యతను పరిహరించడాన్ని వివరిస్తుంది. అయినా మూలంలోని ప్రత్యక్ష రక్త రూపకాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో భద్రపరిచింది.
- issue: כִּי యొక్క సంబంధం
  choice: సాధనాత్మక/ఫలిత సంబంధం—‘చేయడం ద్వారా’
  alternative: కారణ సంబంధం—‘ఎందుకంటే నీవు ... చేస్తావు’
  rationale: ముందటి క్రియావిధానాన్ని ఆచరించడం రక్తదోషాన్ని తొలగించే మార్గమని సందర్భం సూచిస్తుంది. అయినప్పటికీ כִּי కి కారణార్థం సాధ్యమైనందున దాన్ని పాదటిప్పణిలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఒడంబడిక శైలిని పాటించింది. ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీవు/నీ’తో నిలిపింది. వాక్యం ordinary readersకు సులభంగా ఉండేలా సాధనాత్మక సంబంధాన్ని ప్రధాన పాఠంలో స్పష్టం చేసింది; అసలు భాషలోని సాధ్యమైన ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచింది.
