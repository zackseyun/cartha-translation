id: DEU.21.14
reference: Deuteronomy 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: te
  text: అయితే ఆమెపట్ల నీకు ఇష్టం లేకపోతే, ఆమెను ఆమె ఇష్టప్రకారం వెళ్లనివ్వాలి.[a] ఆమెను డబ్బుకు ఎంతమాత్రమూ అమ్మకూడదు. నీవు ఆమెను సరుకులా చూడకూడదు,[b] ఎందుకంటే నీవు ఆమెను అవమానపరిచావు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను స్వేచ్ఛగా వెళ్లనివ్వాలి.” అక్షరార్థంగా, “ఆమెను ఆమెకే పంపివేయాలి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమెను లాభం కోసం వాడుకోకూడదు.” హీబ్రూ క్రియ అరుదైనది; ఆర్థిక ప్రయోజనానికి ఒక వస్తువులా వాడుకోవడం అనే భావం దీనికి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీవు ఆమెను ఉల్లంఘించావు.” హీబ్రూ పదం సందర్భాన్ని బట్టి బాధించడం, అవమానించడం లేదా లైంగికంగా ఉల్లంఘించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: అయితే ... లేకపోతే
  rationale: ముందున్న నియమానికి భిన్నంగా సంభవించే పరిస్థితిని సహజమైన ఆధునిక తెలుగులో షరతుగా పరిచయం చేస్తుంది.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: ఆమెపట్ల నీకు ఇష్టం లేకపోతే
  rationale: חפץ లోని కోరుకోవడం, ఇష్టపడడం అనే వ్యక్తిగత భావాన్ని కాపాడుతుంది; మూలంలో లేని ‘ఇకపై’ అనే కాలసూచనను చేర్చదు.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: ఆమెను తన ఇష్టప్రకారం వెళ్లనివ్వాలి
  rationale: అక్షరార్థంగా ‘ఆమెను ఆమెకే/ఆమె నిమిత్తం పంపివేయాలి’; ఇది ఆమెను స్వేచ్ఛగా తన నిర్ణయానుసారం వెళ్లనివ్వడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: ఆమెను డబ్బుకు ఎంతమాత్రమూ అమ్మకూడదు
  rationale: అనంతక్రియతో కూడిన క్రియారూపం నిషేధాన్ని బలపరుస్తుంది; ‘ఎంతమాత్రమూ’ ఆ ఉద్ఘాటనను అందిస్తుంది. כסף ఇక్కడ ఆధునిక తెలుగులో ‘డబ్బు’.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: ఆమెను లాభం కోసం వాడుకోకూడదు
  rationale: అరుదైన התעמר క్రియకు వాణిజ్యపరంగా లేదా ఆధిపత్యంతో దోపిడీ చేయడం అనే సందర్భోచిత భావం ఉంది. అమ్మకంపై నిషేధానికి సమాంతరంగా ఆర్థిక ప్రయోజనం కోసం ఆమెను వస్తువులా వాడరాదనే భావాన్ని ఇది స్పష్టంగా అందిస్తుంది.
- source_word: תַּחַת אֲשֶׁר
  choice: కాబట్టి
  rationale: తదుపరి నిషేధానికి కారణాన్ని తెలిపే సహజమైన తెలుగు కారణసూచకం.
- source_word: עִנִּיתָהּ
  choice: నీవు ఆమెను అవమానపరిచావు
  rationale: పీయేల్ రూపంలోని ענה బాధించడం, అవమానించడం లేదా లైంగికంగా ఉల్లంఘించడం అనే పరిధిని కలిగి ఉంది. ప్రధాన పాఠంలో ‘అవమానపరిచావు’ నైతిక హానిని నిలుపుతూ, హీబ్రూ పదం కన్నా సంకుచితమైన న్యాయార్థాన్ని బలవంతంగా విధించదు.
theological_decisions:
- issue: బందీ స్త్రీ విషయంలో ఈ నియమం యొక్క నైతిక బలం
  choice: లైంగిక/వైవాహిక సంబంధం తరువాత పురుషుడు ఆమెపై తన అధికారాన్ని వినియోగించడాన్ని ఈ వచనం పరిమితం చేస్తున్నట్లు అనువదించడం; బలవంతపు నేపథ్యాన్ని మృదువుచేయకుండా, మూలపాఠం చెప్పినదానికంటే నిర్దిష్టమైన తీర్పును ప్రధాన పాఠంలో చేర్చకపోవడం.
  alternative: దీనిని కేవలం పరస్పర సమ్మతితో జరిగే విడాకులుగా చూపడం, లేదా ప్రధాన పాఠంలోనే ఆ చర్యను నిర్దిష్టంగా అత్యాచారం అని పేర్కొనడం.
  rationale: ఆమెకు స్వేచ్ఛనివ్వాలని, ఆమెను అమ్మకూడదని లేదా లాభం కోసం వాడుకోకూడదని వచనం ఆజ్ఞాపిస్తుంది; దానికి కారణంగా ענה అనే విస్తృతార్థ పదాన్ని ఉపయోగిస్తుంది. అనువాదం ఈ నైతిక తీవ్రతనూ పదార్థంలోని అనిశ్చితినీ రెండింటినీ కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ధర్మశాస్త్ర ఆజ్ఞల బలాన్ని ‘వెళ్లనివ్వాలి,’ ‘ఎంతమాత్రమూ అమ్మకూడదు,’ ‘వాడుకోకూడదు’ వంటి రూపాలతో నిలిపాం. స్త్రీ స్వేచ్ఛను తెలియజేసే לְנַפְשָׁהּ భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఉంచాం; అరుదైన క్రియలు మరియు ענה పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికల్లో భద్రపరిచాం.
