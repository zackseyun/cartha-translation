revisions:
- from: అయితే ఆమెపట్ల నీకు ఇష్టం లేకపోతే, ఆమెను తన ఇష్టప్రకారం వెళ్లనివ్వాలి.[a] ఆమెను డబ్బుకు ఎంతమాత్రమూ అమ్మకూడదు. నీవు ఆమెను అవమానపరిచావు కాబట్టి, ఆమెను లాభం కోసం వాడుకోకూడదు.[b][c]
  to: అయితే ఆమెపట్ల నీకు ఇష్టం లేకపోతే, ఆమెను ఆమె ఇష్టప్రకారం వెళ్లనివ్వాలి.[a] ఆమెను డబ్బుకు ఎంతమాత్రమూ అమ్మకూడదు. నీవు ఆమెను సరుకులా చూడకూడదు,[b] ఎందుకంటే నీవు ఆమెను అవమానపరిచావు.[c]
  rationale: స్త్రీ స్వీయ నిర్ణయాన్ని సూచించే పదబంధంలోని సర్వనామ అస్పష్టతను తొలగించాం. అలాగే, ప్రధాన పాఠంలో అరుదైన హీబ్రూ క్రియకు ఆంగ్ల POB audit trail ఎంచుకున్న ‘వస్తువుగా/సరుకుగా పరిగణించడం’ అనే భావాన్ని నిలిపి, ప్రత్యామ్నాయమైన ‘లాభం కోసం వాడుకోవడం’ను పాదసూచికలో భద్రపరిచాం. కారణవాక్యాన్ని ‘ఎందుకంటే’తో స్పష్టంగా అనుసంధానించి, పాదసూచిక గుర్తులను సంబంధిత పదాలకు జతచేశాం.
