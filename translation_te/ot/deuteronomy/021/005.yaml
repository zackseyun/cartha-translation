  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: te
  text: లేవి కుమారులైన యాజకులు ముందుకు రావాలి. ఎందుకంటే నీ దేవుడైన యాహ్వే తనకు పరిచర్య చేయడానికి, యాహ్వే నామంలో దీవించడానికి వారిని ఎన్నుకున్నాడు. వారి మాట ప్రకారమే ప్రతి వివాదం, ప్రతి గాయానికి సంబంధించిన వ్యవహారం[a] పరిష్కరించబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గాయానికి సంబంధించిన వ్యవహారం’ అని అనువదించిన హీబ్రూ పదానికి ‘దెబ్బ,’ ‘గాయం,’ ‘బాధ,’ లేదా ‘తెగులు’ అనే అర్థాలు కూడా రావచ్చు. ఈ న్యాయ సందర్భంలో శారీరక హానికి సంబంధించిన వ్యవహారం ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: ముందుకు రావాలి
  rationale: నిఫాల్ రూపం ఈ న్యాయాచార ప్రక్రియలో యాజకులు అధికారికంగా ముందుకు వచ్చి పాల్గొనడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: లేవి కుమారులైన యాజకులు
  rationale: హీబ్రూ సమానాధికార నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు సంబంధవాచక రూపంలో అందిస్తుంది; యాజకుల లేవీయ వంశాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כִּי בָם בָּחַר
  choice: ఎందుకంటే ... వారిని ఎన్నుకున్నాడు
  rationale: כִּי యాజకుల అధికారానికి కారణాన్ని ఇస్తుంది; సంపూర్ణ క్రియ దేవుని ముందరి ఎంపికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, ఒడంబడిక సూత్రాన్ని సహజ తెలుగులో ఉంచుతుంది.
- source_word: לְשָׁרְתוֹ
  choice: తనకు పరిచర్య చేయడానికి
  rationale: שרת యొక్క యాజక సంబంధ పవిత్ర సేవ భావాన్ని ‘పరిచర్య’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: యాహ్వే నామంలో దీవించడానికి
  rationale: దైవాధికారంతో యాజకులు పలికే దీవెనను మూలానికి సమీపంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעַל פִּיהֶם
  choice: వారి మాట ప్రకారమే
  rationale: అక్షరార్థంగా ‘వారి నోటి మీద’ అనే హీబ్రూ నుడికారంలోని అధికారపూర్వక తీర్పు భావాన్ని, మాటతో ఉన్న సంబంధాన్ని నిలుపుతూ తెలుగులో అందిస్తుంది.
- source_word: יִהְיֶה
  choice: పరిష్కరించబడాలి
  rationale: ‘ఉండాలి’ అనే సరళ క్రియకు న్యాయ సందర్భంలో అంతర్లీనంగా ఉన్న నిర్ణయించబడటం లేదా పరిష్కరించబడటం అనే భావాన్ని తెలుగులో పూర్తి చేస్తుంది.
- source_word: כָּל רִיב
  choice: ప్రతి వివాదం
  rationale: ריב న్యాయపరమైన తగాదా లేదా వివాదాన్ని సూచిస్తుంది; ‘వివాదం’ విస్తృతమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: וְכָל נָגַע
  choice: ప్రతి దెబ్బ
  rationale: נגע అనే పదానికి దెబ్బ, గాయం, బాధ లేదా తెగులు వంటి విస్తృత అర్థపరిధి ఉంది. ‘దెబ్బ’ మూలపదానికి దగ్గరగా ఉండి ఈ న్యాయ సందర్భంలో శారీరక హాని భావాన్నీ అనుమతిస్తుంది; అనిశ్చితి పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: יהוה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇవ్వడం మూలభాషా సాక్ష్యాన్ని పారదర్శకంగా నిలుపుతుంది.
- issue: యాజకుల మాటకు న్యాయాధికార భావం
  choice: వారి మాట ప్రకారమే ... పరిష్కరించబడాలి
  alternative: వారి తీర్పు ప్రకారమే నిర్ణయించబడాలి
  rationale: ‘తీర్పు’ అని స్పష్టీకరించడం సాధ్యమే అయినా, మూలంలోని ‘వారి నోటి ప్రకారం’ అనే వాక్యాధారిత రూపాన్ని ‘మాట’ ద్వారా కాపాడి, న్యాయ ప్రభావాన్ని క్రియలో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ న్యాయభాషలోని అధికార భావాన్ని సహజ తెలుగు వాక్య నిర్మాణంతో అందించగా, נגע యొక్క నిజమైన అర్థ అనిశ్చితిని పాదసూచికలో నిలిపాం.
