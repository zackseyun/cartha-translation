- from: లేవి కుమారులైన యాజకులు ముందుకు రావాలి. ఎందుకంటే నీ దేవుడైన యాహ్వే తనకు పరిచర్య చేయడానికి, యాహ్వే నామంలో దీవించడానికి వారిని ఎన్నుకున్నాడు. వారి మాట ప్రకారమే ప్రతి వివాదం, ప్రతి దెబ్బ[a] పరిష్కరించబడాలి.
