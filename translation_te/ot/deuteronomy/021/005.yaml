    rationale: న్యాయపరంగా వివాదం లేదా గాయానికి సంబంధించిన కేసు పరిష్కరించబడుతుంది; ‘దెబ్బ’ స్వయంగా పరిష్కరించబడదు. హీబ్రూ נגע యొక్క విస్తృతతను పాదసూచికలో కాపాడుతూ, ప్రధాన పాఠంలో సహజమైన న్యాయవ్యవహార పదప్రయోగం అవసరం.
