source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ שִׂ֣ימוּ לְבַבְ/כֶ֔ם לְ/כָל הַ/דְּבָרִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י מֵעִ֥יד בָּ/כֶ֖ם הַ/יּ֑וֹם אֲשֶׁ֤ר תְּצַוֻּ/ם֙ אֶת בְּנֵי/כֶ֔ם לִ/שְׁמֹ֣ר לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “ఈ రోజు నేను మీకు సాక్ష్యమిస్తూ చెబుతున్న ఈ మాటలన్నిటినీ మీ హృదయాల్లో ఉంచుకోండి[a]. ధర్మశాస్త్రమైన ఈ మాటలన్నిటినీ పాటించి ఆచరించమని మీ కుమారులకు ఆజ్ఞాపించాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సాక్ష్యమిస్తూ” అనే హీబ్రూ క్రియకు “హెచ్చరిస్తూ” లేదా నిబంధన సందర్భంలో “మీకు వ్యతిరేకంగా సాక్ష్యమిస్తూ” అనే భావఛాయలు కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ మూలంలో “మీ కుమారులు”; ఈ పదం విస్తృతంగా తరువాతి తరాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: మీ హృదయాల్లో ఉంచుకోండి
  rationale: హృదయాన్ని శ్రద్ధ, సంకల్పం, అంతరంగ నిబద్ధతకు కేంద్రంగా చూపే హీబ్రూ నుడికారపు రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: మాటలు / మాటలన్నిటినీ
  rationale: ఇక్కడ דָּבָר పలికిన నిబంధన మాటలను, ఉపదేశాలను సూచిస్తుంది; వచనంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: ఈ రోజు నేను మీకు సాక్ష్యంగా చెబుతున్న
  rationale: עוּד హిఫిల్ రూపంలోని సాక్ష్యమివ్వడం అనే ప్రధాన భావాన్ని ఉంచుతూ, בָּכֶםను సహజ తెలుగులో ‘మీకు’గా అందిస్తుంది; హెచ్చరిక లేదా న్యాయస్థాన సంబంధమైన భావఛాయలను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: మీ కుమారులకు మీరు ఆజ్ఞాపించాలి
  rationale: సాపేక్ష వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తుంది; తరువాతి తరానికి ఈ మాటలను అధికారపూర్వకంగా అప్పగించాలనే బాధ్యతను స్పష్టం చేస్తుంది.
- source_word: בְּנֵיכֶם
  choice: మీ కుమారులకు
  rationale: హీబ్రూ పదంలోని స్పష్టమైన పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; విస్తృత తరప్రాతినిధ్య భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించేలా
  rationale: ‘కాపాడడం/శ్రద్ధగా గమనించడం’ మరియు ‘చేయడం’ అనే జంట భావాలను సహజ తెలుగులో ఒక సమగ్ర ఆచరణాత్మక వ్యక్తీకరణగా అందిస్తుంది.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రం
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాత్మక సందర్భంలో תּוֹרָהకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: מֵעִיד בָּכֶםలోని సాక్ష్య/హెచ్చరిక/న్యాయ సంబంధ భావఛాయ
  choice: నేను మీకు సాక్ష్యంగా చెబుతున్న
  alternative: నేను ఈ రోజు మిమ్మల్ని హెచ్చరిస్తున్న; నేను ఈ రోజు మీకు వ్యతిరేకంగా సాక్ష్యమిస్తున్న
  rationale: ప్రధాన పాఠ్యం సాక్ష్య భావాన్ని ముందుంచుతుంది; అయితే నిబంధన సందర్భంలోని హెచ్చరిక, న్యాయపరమైన బలాన్ని పాదటిప్పణి ద్వారా పరిష్కరించకుండా నిలుపుతుంది.
- issue: בְּנֵיכֶםలోని లింగ సూచన
  choice: మీ కుమారులకు
  alternative: మీ పిల్లలకు / తరువాతి తరానికి
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, అది విస్తృతంగా తరువాతి తరాన్ని సూచించగలదని పాదటిప్పణిలో వివరిస్తుంది.
- issue: לִשְׁמֹר לַעֲשׂוֹתలోని ద్వంద్వ ఆచరణ భావం
  choice: జాగ్రత్తగా పాటించేలా
  alternative: కాపాడి చేయాలని / గమనించి ఆచరించాలని
  rationale: తెలుగులో అసహజమైన పదశః ద్వంద్వాన్ని తప్పించి, శ్రద్ధతో సంరక్షించడం మరియు ఆచరణలో పెట్టడం అనే రెండు భావాలను కలిపి వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ హృదయ రూపకం, ‘మాటలు’ అనే పునరుక్తి, ‘ధర్మశాస్త్రం’ అనే నిబంధనాత్మక పదజాలం నిలుపబడ్డాయి.
