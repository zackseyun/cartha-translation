revisions:
- from: 'అతడు వారితో ఇలా అన్నాడు: “ఈ రోజు నేను మీకు సాక్ష్యంగా చెబుతున్న మాటలన్నిటినీ మీ హృదయాల్లో ఉంచుకోండి.[a] ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ జాగ్రత్తగా పాటించేలా మీ కుమారులకు మీరు ఆజ్ఞాపించాలి.[b]”'
  to: 'అతడు వారితో ఇలా అన్నాడు: “ఈ రోజు నేను మీకు సాక్ష్యమిస్తూ చెబుతున్న ఈ మాటలన్నిటినీ మీ హృదయాల్లో ఉంచుకోండి[a]. ధర్మశాస్త్రమైన ఈ మాటలన్నిటినీ పాటించి ఆచరించమని మీ కుమారులకు ఆజ్ఞాపించాలి[b].”'
  rationale: The revised wording makes Moses, rather than the words, the grammatical subject of the testimony. It also explicitly represents both ‘keep’ and ‘do,’ while retaining the source's repeated ‘words,’ masculine ‘sons,’ solemn register, and the ambiguity of the covenant-witness verb in footnote a.
