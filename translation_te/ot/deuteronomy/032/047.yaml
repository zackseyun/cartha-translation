  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: te
  text: ఎందుకంటే ఇది మీకు వ్యర్థమైన మాట కాదు[a]; ఇదే మీ జీవం[b]. ఈ మాటవల్ల, మీరు యొర్దాను దాటి స్వాధీనం చేసుకోవడానికి[c] వెళ్తున్న దేశంలో మీరు దీర్ఘకాలం జీవిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇది మీకు అల్పమైన విషయం కాదు,’ ‘ఇది మీకు వట్టి మాట కాదు.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘మీ జీవాలు’; ఈ బహువచన రూపం నుడికారంగా ‘మీ జీవం’ అనే ఏకవచన భావంలో ఉండవచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అక్కడ దానిని స్వాధీనం చేసుకోవడానికి’ లేదా ‘వారసత్వంగా పొందడానికి.’ హీబ్రూ పదం స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం అనే రెండు భావాలనూ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: వ్యర్థమైన మాట
  rationale: דָבָר ఇక్కడ ఇప్పుడే పలికిన నిబంధన బోధనను లేదా గీతాన్ని సూచిస్తుంది; רֵק దాని శూన్యత, నిష్ఫలత లేదా అల్పత్వాన్ని నిరాకరిస్తుంది. ‘వ్యర్థమైన మాట’ మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ సహజమైన తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: מִכֶּם
  choice: మీకు
  rationale: מן ఇక్కడ విభజనార్థకమైన ‘మీ నుండి’ అనే భావంలో కాక, ఇశ్రాయేలీయులకు సంబంధించి ‘మీకు’ అనే ప్రయోగార్థంలో ఉంది.
- source_word: חַיֵּיכֶם
  choice: మీ జీవం
  rationale: హీబ్రూలో రూపపరంగా బహువచనమైనప్పటికీ חַיִּים తరచుగా ‘జీవం’ అనే ఏకవచన భావవాచక నామంగా పనిచేస్తుంది. ‘మీ జీవం’ నిబంధనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: וּבַדָּבָר הַזֶּה
  choice: ఈ మాటవల్ల
  rationale: ב ఉపసర్గ ఇక్కడ సాధనార్థకంగా ఉంది. ముందు వచ్చిన דָבָרతో పదసంబంధాన్ని నిలుపుతూ, ఈ మాట ద్వారా వారి జీవితం దీర్ఘమవుతుందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: మీరు దీర్ఘకాలం జీవిస్తారు
  rationale: ארך హిఫిల్ రూపం יָמִיםతో కలిసి ‘రోజులను పొడిగించుకోవడం,’ అంటే ‘దీర్ఘకాలం జీవించడం’ అనే నుడికారార్థాన్ని ఇస్తుంది. పదచిత్రాన్ని యాంత్రికంగా అనువదించకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో הָאֲדָמָה వాగ్దాన దేశాన్ని సూచిస్తుంది. తెలుగులో ‘దేశంలో’ అనడం భూభాగ సంబంధమైన నిబంధన నేపథ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: యొర్దాను దాటి వెళ్లే
  rationale: వర్తమాన కృదంతం మోషే దృష్టికోణం నుండి సమీపిస్తున్న దాటడాన్ని చూపుతుంది. ‘దాటి వెళ్లే’ గమ్యప్రయాణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ భూమిని స్వాధీనం చేసుకోవడం లేదా వారసత్వంగా పొందడం అనే భావాలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో ‘స్వాధీనం చేసుకోవడానికి’ కార్యాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; వారసత్వ భావం పాదటిప్పణిలో ఉంచబడింది.
theological_decisions:
- issue: విధేయత, జీవం, దేశంలో దీర్ఘకాల నివాసం మధ్య నిబంధనాత్మక సంబంధం
  choice: దేవుడు పలికిన మాట ఇశ్రాయేలీయుల జీవమనీ, ఆ మాటవల్ల వారు దేశంలో దీర్ఘకాలం జీవిస్తారనీ వాక్యం ప్రకటిస్తున్నట్లుగా అనువదించబడింది.
  alternative: ఇది నిబంధనాత్మక పరిణామాన్ని సూచించకుండా ధర్మశాస్త్ర ప్రాముఖ్యతను మాత్రమే అలంకారికంగా ప్రశంసిస్తుందని చదవడం.
  rationale: ‘ఇదే మీ జీవం’ మరియు ‘ఈ మాటవల్ల మీరు దీర్ఘకాలం జీవిస్తారు’ అనే సమాంతర వాక్యాలు సాధారణ ప్రోత్సాహం కంటే బలమైన నిబంధనాత్మక సంబంధాన్ని వ్యక్తం చేస్తాయి. తరువాతి కాలపు సిద్ధాంత పదజాలాన్ని చేర్చకుండా ఆ ఉద్వేగం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను కోల్పోకుండా అనువదించబడింది. ‘వ్యర్థమైన మాట,’ ‘మీ జీవం,’ ‘ఈ మాటవల్ల’ అనే పదబంధాలు మూలంలోని పునరుక్తి మరియు నిబంధనాత్మక బలాన్ని నిలుపుతాయి; ‘దీర్ఘకాలం జీవిస్తారు’ సహజమైన తెలుగు నుడికారాన్ని అనుసరిస్తుంది.
