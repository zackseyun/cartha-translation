- from: ఎందుకంటే ఇది మీకు వ్యర్థమైన మాట కాదు[a]; ఇదే మీ జీవం[b]. మీరు స్వాధీనం చేసుకోవడానికి[c] యొర్దాను దాటి వెళ్లే దేశంలో ఈ మాటవల్ల మీరు దీర్ఘకాలం జీవిస్తారు.
  to: ఎందుకంటే ఇది మీకు వ్యర్థమైన మాట కాదు[a]; ఇదే మీ జీవం[b]. ఈ మాటవల్ల, మీరు యొర్దాను దాటి స్వాధీనం చేసుకోవడానికి[c] వెళ్తున్న దేశంలో మీరు దీర్ఘకాలం జీవిస్తారు.
