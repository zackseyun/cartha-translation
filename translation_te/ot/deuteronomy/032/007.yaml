source:
  edition: WLC
  text: זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דּוֹר וָ/ד֑וֹר שְׁאַ֤ל אָבִ֨י/ךָ֙ וְ/יַגֵּ֔דְ/ךָ זְקֵנֶ֖י/ךָ וְ/יֹ֥אמְרוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: te
  text: 'పూర్వకాలపు రోజులను జ్ఞాపకం చేసుకో;

    తరతరాల సంవత్సరాలను ఆలోచించు.[a]


    నీ తండ్రిని[b] అడుగు, అతడు నీకు తెలియజేస్తాడు;

    నీ పెద్దలు నీకు చెబుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “తరం తరం యొక్క సంవత్సరాలు”; అంటే వరుసగా వచ్చిన తరాల కాలం.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ తండ్రి’ అనే పదాన్ని విస్తృత అర్థంలో ‘నీ పూర్వికుడు’ అని కూడా తీసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: జ్ఞాపకం చేసుకో
  rationale: זכר అనే క్రియ యొక్క ఏకవచన పురుష ఆజ్ఞారూపం. గతాన్ని మనసుకు తెచ్చుకోవాలనే ప్రత్యక్ష పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְמוֹת עוֹלָם
  choice: పూర్వకాలపు రోజులు
  rationale: ఈ నిర్మాణ పదబంధం సుదూర గతకాలాన్ని సూచిస్తుంది. ‘పూర్వకాలపు రోజులు’ మూలంలోని కాలసంబంధ రూపకాన్ని నిలుపుతూ సహజంగా ఉంది.
- source_word: בִּינוּ
  choice: ఆలోచించు
  rationale: בין ఇక్కడ గ్రహించడం, వివేచించడం, శ్రద్ధగా పరిగణించడం అనే భావాన్ని ఇస్తుంది. ‘జ్ఞాపకం చేసుకో’ అనే సమాంతర ఆజ్ఞకు అనుగుణంగా, చరిత్రపై మననం చేయడాన్ని ‘ఆలోచించు’ తెలియజేస్తుంది.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: తరతరాల సంవత్సరాలు
  rationale: అక్షరార్థంగా ‘తరం తరం యొక్క సంవత్సరాలు’; వరుసగా వచ్చిన తరాల కాలాన్ని సూచించే హెబ్రీ నుడికారం. తెలుగు ‘తరతరాల’ ఆ పంపిణీ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שְׁאַל
  choice: అడుగు
  rationale: שאל అనే సాధారణ ఆజ్ఞారూపానికి ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: ఏకవచన నామవాచకానికి ద్వితీయ పురుష ఏకవచన ప్రత్యయం ఉంది; దాని సాధారణ అర్థం ‘నీ తండ్రి.’ విస్తృత సందర్భంలో పూర్వికుడిని సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠంలో ప్రాథమిక అర్థమే నిలుపబడింది.
- source_word: וְיַגֵּדְךָ
  choice: అతడు నీకు తెలియజేస్తాడు
  rationale: נגד యొక్క హిఫీల్ రూపం చెప్పడం, ప్రకటించడం, తెలియజేయడం అనే భావాలను కలిగి ఉంది. ‘తెలియజేస్తాడు’ సాధారణ ‘చెప్పడం’ కంటే మూలంలోని causative/మేక్-నోన్ భావాన్ని కొంత నిలుపుతుంది.
- source_word: זְקֵנֶיךָ
  choice: నీ పెద్దలు
  rationale: కేవలం వృద్ధులను కాక, వయస్సు మరియు అనుభవం వల్ల గౌరవస్థానం కలిగిన సమాజపు పెద్దలను సూచిస్తుంది.
- source_word: וְיֹאמְרוּ לָךְ
  choice: వారు నీతో చెబుతారు
  rationale: אמר అనే సాధారణ ‘చెప్పు’ క్రియను, ముందున్న נגדతో స్వల్ప పదభేదం నిలిచేలా అనువదించింది.
theological_decisions:
- issue: אָבִיךָ పదం తక్షణ తండ్రిని సూచిస్తుందా, విస్తృతంగా పూర్వికుడిని సూచిస్తుందా
  choice: ప్రధాన పాఠంలో ‘నీ తండ్రి’
  alternative: ‘నీ పూర్వికుడు’
  rationale: పదం యొక్క సాధారణ ఏకవచన అర్థం ‘తండ్రి.’ సందర్భం తరతరాల జ్ఞాపకాన్ని ఉద్దేశించినందున విస్తృత ప్రతినిధి భావం సాధ్యమైనా, దానిని ప్రధాన పాఠంలో ఖచ్చితంగా నిర్ణయించకుండా పాదసూచికలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే కవితాత్మక శైలి. హెబ్రీ సమాంతర నిర్మాణాన్ని నాలుగు పాదాలుగా నిలిపింది. రెండవ భాగంలో హెబ్రీలో రెండో ‘అడుగు’ స్పష్టంగా పునరుక్తం కాకపోయినా, తెలుగులో అసంపూర్ణ వాక్యం రాకుండా మరియు రెండు సమాంతర సంబోధనలను స్పష్టపరచడానికి సహజంగా పునరుద్ధరించబడింది. పాదసూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
