- from: మహోన్నతుడు జనాలకు వారి స్వాస్థ్యాన్ని పంచినప్పుడు, ఆదాము కుమారులను[a] వేరుచేసినప్పుడు, ఇశ్రాయేలు కుమారుల సంఖ్య ప్రకారం[b] ప్రజల సరిహద్దులను నిర్ణయించాడు.
