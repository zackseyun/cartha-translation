    text: మృతసముద్ర గ్రంథప్రతులు, సెప్టువజింటు ఇక్కడ “ఇశ్రాయేలు కుమారులు”కు బదులుగా “దేవుని కుమారులు” (లేదా “దేవుని దూతలు”) అనే పాఠాన్ని ఇస్తున్నాయి.
