source:
  edition: WLC
  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: te
  text: సర్వోన్నతుడు జనాలకు వారి వారసత్వభాగాలను ఇచ్చినప్పుడు, మనుష్యులను[a] వేరుచేసినప్పుడు, ఇశ్రాయేలు కుమారుల సంఖ్య ప్రకారం[b] ప్రజల సరిహద్దులను నిర్ణయించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనుష్యులు” అని అనువదించిన పదబంధం మానవులను లేదా మానవజాతిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: మృతసముద్ర గ్రంథప్రతులు, సెప్టువజింటు ఇక్కడ “ఇశ్రాయేలు కుమారులు”కు బదులుగా “దేవుని కుమారులు” (లేదా “దేవుని దూతలు”) అనే పాఠాన్ని ఇస్తున్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: స్వాస్థ్యాన్ని పంచినప్పుడు
  rationale: נחל హిఫీల్ రూపం ఇక్కడ జనాలకు వారి వారి స్వాస్థ్యాలను కేటాయించడాన్ని సూచిస్తుంది; కాలార్థక בְּను ‘అప్పుడు’ నిర్మాణంతో సహజంగా వ్యక్తం చేశాం.
- source_word: עֶלְיוֹן
  choice: మహోన్నతుడు
  rationale: ఇది దేవునికి వాడిన బిరుదు; ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: גּוֹיִם
  choice: జనాలకు
  rationale: ఇక్కడ వివిధ లోకజనాలను సూచిస్తుంది; తరువాతి עַמִּיםతో అనవసర పదపునరుక్తి రాకుండా ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: בְּ/הַפְרִיד/וֹ
  choice: వేరుచేసినప్పుడు
  rationale: פרד యొక్క సాధారణ భావమైన వేరు చేయడాన్ని నిలుపుతూ, ముందు కాలార్థక ఉపవాక్యానికి సమాంతరంగా అనువదించాం.
- source_word: בְּנֵי אָדָם
  choice: ఆదాము కుమారులను
  rationale: హీబ్రూ పదబంధంలోని రూపాన్ని, ‘ఆదాము’ అనే పేరుతో ఉండగల సంబంధాన్ని నిలుపుతుంది; సందర్భంలో ఇది మానవజాతిని సూచించే హీబ్రూ నుడికారమని పాదసూచిక వివరిస్తుంది.
- source_word: יַצֵּב
  choice: నిర్ణయించాడు
  rationale: יצב హిఫీల్ రూపం సరిహద్దులను స్థిరంగా నెలకొల్పడాన్ని సూచిస్తుంది; తెలుగులో ‘నిర్ణయించాడు’ ఆ అధికారపూర్వక స్థాపన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גְּבֻלֹת עַמִּים
  choice: ప్రజల సరిహద్దులను
  rationale: జాతి లేదా రాజకీయ సమూహాల భూసరిహద్దుల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְ/מִסְפַּר
  choice: సంఖ్య ప్రకారం
  rationale: లెక్కకు లేదా సంఖ్యకు అనుగుణమైన సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: అందించిన WLC మసొరేటిక్ పాఠంలోని పదాలను పారదర్శకంగా అనుసరిస్తుంది; ముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: చివరి పదబంధంలోని పాఠాంతరం
  choice: ఇశ్రాయేలు కుమారుల
  alternative: దేవుని కుమారులు; దేవుని దూతలు
  rationale: అందించిన WLC పాఠం בְּנֵי יִשְׂרָאֵל అని ఉంది కాబట్టి ప్రధాన పాఠం దానినే అనుసరిస్తుంది. అయితే మృతసముద్ర గ్రంథప్రతులు, సెప్టువజింటులోని ముఖ్యమైన పాఠాంతరం వాక్య theological అర్థాన్ని ప్రభావితం చేస్తుంది కాబట్టి దాన్ని పాదసూచికలో స్పష్టంగా తెలిపాం.
- issue: בְּנֵי אָדָם అనే మానవవాచక పదబంధం
  choice: ఆదాము కుమారులు
  alternative: మానవులు; మానవజాతి
  rationale: హీబ్రూ కవితాత్మక రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది సాధారణంగా మానవులను లేదా మానవజాతిని సూచిస్తుందని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కవితాత్మక వాక్యనిర్మాణం వాడాం. సమాంతర కాలార్థక ఉపవాక్యాలను నిలిపి, పాఠాంతరాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో సంరక్షించాం.
