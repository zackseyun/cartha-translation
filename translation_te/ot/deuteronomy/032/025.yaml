- from: బయట ఖడ్గం సంతానాన్ని కోల్పోయేలా చేస్తుంది; లోపలి గదుల్లో భయం వ్యాపిస్తుంది[a]—యువకుడినీ కన్యనూ[b], పాలుతాగే పసిబిడ్డనూ నెరిసిన జుట్టుగల వృద్ధునినీ అది విడిచిపెట్టదు.
  to: బయట ఖడ్గం ప్రాణాలను హరిస్తుంది; లోపలి గదుల్లో భీతి ఉంటుంది[a]—యువకుడినీ కన్యనూ[b], పాలుతాగే పసిబిడ్డనూ నెరిసిన జుట్టుగల వృద్ధునినీ అది విడిచిపెట్టదు.
  rationale: The revision replaces the parent-specific expression for bereavement with an idiomatic expression of lethal devastation that coheres with the comprehensive victim list. It also renders the Hebrew noun אֵימָה as “భీతి,” avoiding the added idea that fear spreads. The final clause remains a minimal Telugu unpacking of the Hebrew’s compressed poetic syntax, making clear that no category is spared.
