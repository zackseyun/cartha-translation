review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the outside/inside contrast and the four age-and-sex categories. However, “సంతానాన్ని కోల్పోయేలా చేస్తుంది” makes the sword’s action exclusively the loss of one’s children and sits awkwardly with the following victims, including the nursing child. The Hebrew poetic line presents sword and terror as comprehensive agents of death or devastation; the listed people are its victims.
  naturalness: The Telugu is generally modern and readable. “భయం వ్యాపిస్తుంది” adds the specific notion of spreading, which is not expressed by the Hebrew noun “terror.” The closing “అది విడిచిపెట్టదు” is natural Telugu but introduces an explicit verb absent from the compact Hebrew; it can be retained as a restrained way to make the victims’ relation clear.
  terminology: “ఖడ్గం,” “కన్య,” “పాలుతాగే పసిబిడ్డ,” and “నెరిసిన జుట్టుగల వృద్ధుడు” are appropriate. “భీతి” better reflects the intensity of אֵימָה than the more general “భయం.” The bethulah footnote is accurate and appropriately cautious.
  issues:
  - severity: medium
    issue: The rendering of תְּשַׁכֶּל is overly restricted to parents losing children.
    rationale: “సంతానాన్ని కోల్పోయేలా చేస్తుంది” makes bereavement solely parental, whereas the verse’s ensuing inclusive list depicts devastation reaching young and old alike. “ప్రాణాలను హరిస్తుంది” supplies the verse’s destructive force in idiomatic Telugu without imposing a parental-only object.
  - severity: low
    issue: “భయం వ్యాపిస్తుంది” adds a verbal nuance not present in the Hebrew.
    rationale: אֵימָה is a terse noun, “terror/dread.” Rendering it as “భీతి” retains the Hebrew’s stark nominal expression and its elevated poetic register.
  revised_text: బయట ఖడ్గం ప్రాణాలను హరిస్తుంది; లోపలి గదుల్లో భీతి ఉంటుంది[a]—యువకుడినీ కన్యనూ[b], పాలుతాగే పసిబిడ్డనూ నెరిసిన జుట్టుగల వృద్ధునినీ అది విడిచిపెట్టదు.
