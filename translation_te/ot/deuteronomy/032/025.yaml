  text: מִ/חוּץ֙ תְּשַׁכֶּל חֶ֔רֶב וּ/מֵ/חֲדָרִ֖ים אֵימָ֑ה גַּם בָּחוּר֙ גַּם בְּתוּלָ֔ה יוֹנֵ֖ק עִם אִ֥ישׁ שֵׂיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: te
  text: బయట ఖడ్గం ప్రాణాలను హరిస్తుంది; లోపలి గదుల్లో భీతి ఉంటుంది[a]—యువకుడినీ కన్యనూ[b], పాలుతాగే పసిబిడ్డనూ నెరిసిన జుట్టుగల వృద్ధునినీ అది విడిచిపెట్టదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గదులనుండి భీతి.” హెబ్రీ పాఠం బయట ఉన్న ప్రమాదానికీ లోపల ఉన్న భీతికీ మధ్య వ్యత్యాసాన్ని చూపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “కన్య” అనేది హెబ్రీ బేతూలా పదానికి అనువాదం. ఇది వివాహం కాని యువతిని సూచిస్తుంది; తరచుగా కన్యత్వ భావం కూడా దీనిలో ఉంటుంది. “యువతి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: బయట
  rationale: తరువాతి ‘లోపలి గదులు’ అనే భావంతో ఉన్న స్థలవ్యతిరేకతను సహజమైన, సంక్షిప్తమైన తెలుగులో నిలుపుతుంది.
- source_word: תְּשַׁכֶּל
  choice: సంతానాన్ని కోల్పోయేలా చేస్తుంది
  rationale: שׁכל పియేల్ రూపంలోని ‘సంతానహీనులను చేయడం/బిడ్డలను కోల్పోయేలా చేయడం’ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఖడ్గాన్ని కర్తగా ఉంచి మూలంలోని వ్యక్తీకరణను కాపాడుతుంది.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: యుద్ధంలో మరణాన్ని కలిగించే సాధనాన్ని సూచించే మూలంలోని సంక్షిప్త, కవితాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: וּמֵחֲדָרִים
  choice: లోపలి గదుల్లో
  rationale: అక్షరార్థంగా ‘గదులనుండి’ అయినప్పటికీ, ‘బయట’కు ప్రతిగా ఇంటి అంతర్భాగాన్ని సూచించే సందర్భార్థాన్ని సహజమైన తెలుగులో ఇస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֵימָה
  choice: భయం
  rationale: తీవ్రమైన భీతి లేదా దిగ్భ్రాంతిని సాధారణ ఆధునిక తెలుగు పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: యువకుడినీ కన్యనూ
  rationale: యువ పురుషుడు మరియు వివాహం కాని యువతిని సూచించే జంటను, בְּתוּלָה పదంలోని కన్యత్వ సూచనను కోల్పోకుండా నిలుపుతుంది.
- source_word: יוֹנֵק
  choice: పాలుతాగే పసిబిడ్డను
  rationale: ‘పాలు తాగుతున్నవాడు’ అనే కృదంత రూపంలోని స్పష్టమైన చిత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: నెరిసిన జుట్టుగల వృద్ధునిని
  rationale: వృద్ధాప్యాన్ని నెరిసిన జుట్టు ద్వారా చూపే హెబ్రీయ concrete చిత్రాన్ని నిలుపుతూ, తెలుగులో వ్యక్తి వృద్ధుడని స్పష్టం చేస్తుంది.
