translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. మూలంలోని సంక్షిప్త నామవాక్యాన్ని తెలుగులో సహజంగా చేయడానికి ‘భయం వ్యాపిస్తుంది’ మరియు జాబితా అంతటినీ ఖడ్గం ప్రభావానికి అనుసంధానించడానికి ‘అది విడిచిపెట్టదు’ అని స్వల్పంగా స్పష్టీకరించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
