  yaml_path: translation/ot/deuteronomy/032/028.yaml
  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: te
  text: 'ఎందుకంటే వారు సదాలోచనలేని జనము;

    వారిలో వివేచన లేదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది; తెలుగు సందర్భప్రవాహంలో ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: גּוֹי
  choice: జనము
  rationale: ఒక సమష్టి ప్రజావర్గాన్ని సూచించే ఏకవచన నామవాచకం; ‘జనము’ గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: אֹבַד עֵצוֹת
  choice: వివేకవంతమైన ఆలోచన లేని
  rationale: పదబంధం మంచి సలహా, యుక్తి లేదా వివేకపూర్వక ప్రణాళిక లేకపోవడాన్ని సూచిస్తుంది; తెలుగులో అపార్థం కలిగించే అక్షరార్థాన్ని నివారిస్తూ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הֵמָּה
  choice: వారు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది; తెలుగులో ప్రత్యేక సంధానక్రియ అవసరం లేదు.
- source_word: וְאֵין
  choice: లేదు
  rationale: అస్తిత్వ నిరాకరణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; రెండు సమాంతర పాదాలను విరామచిహ్నంతో అనుసంధానించాం.
- source_word: בָּהֶם
  choice: వారిలో
  rationale: ఆ జనములో అంతర్గతంగా లేని లక్షణాన్ని నేరుగా సూచిస్తుంది.
- source_word: תְּבוּנָה
  choice: అవగాహన
  rationale: వివేచన, గ్రహింపు అనే జ్ఞానసాహిత్య భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీ కవితా సమాంతరతను రెండు పాదాలుగా నిలిపాం; ఏ ప్రత్యేక సంఘపరమైన వ్యాఖ్యానాన్నీ చేర్చలేదు.
