id: DEU.32.41
reference: Deuteronomy 32:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם שַׁנּוֹתִי֙ בְּרַ֣ק חַרְבִּ֔/י וְ/תֹאחֵ֥ז בְּ/מִשְׁפָּ֖ט יָדִ֑/י אָשִׁ֤יב נָקָם֙ לְ/צָרָ֔/י וְ/לִ/מְשַׂנְאַ֖/י אֲשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: te
  text: 'నా ఖడ్గపు మెరుపును నేను పదును పెట్టినప్పుడు,


    నా చెయ్యి తీర్పును చేపట్టినప్పుడు,


    నా విరోధులపై ప్రతీకారం తీర్చుకుంటాను;


    నన్ను ద్వేషించేవారికి ప్రతిఫలం చెల్లిస్తాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: పెట్టినప్పుడు
  rationale: ఇక్కడ షరతును తెలిపే ‘ఒకవేళ’ కంటే, తరువాతి నిశ్చిత కార్యానికి కాలపూర్వక నేపథ్యాన్ని తెలిపే ‘-నప్పుడు’ సహజంగా ఉంది; సందర్భంలో దేవుని రాబోయే చర్యను సూచిస్తుంది.
- source_word: בְּרַק חַרְבִּי
  choice: నా ఖడ్గపు మెరుపు
  rationale: అక్షరార్థంగా ‘నా ఖడ్గపు మెరుపు/మెరుపువంటి ఖడ్గం’; ఖడ్గం మెరయడాన్ని సూచించే మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: నా చెయ్యి తీర్పును చేపట్టినప్పుడు
  rationale: ‘చెయ్యి పట్టుకుంటుంది’ అనే మూలచిత్రాన్ని తెలుగులో సహజమైన ‘చేపట్టు’తో నిలిపి, מִשְׁפָּט ను ‘తీర్పు’గా అనువదించాం.
- source_word: אָשִׁיב נָקָם
  choice: ప్రతీకారం తీర్చుకుంటాను
  rationale: హీబ్రూ ప్రయోగం అక్షరార్థంగా ‘ప్రతీకారాన్ని తిరిగి ఇస్తాను’; ఆధునిక తెలుగులో న్యాయప్రతికార చర్యను సహజంగా తెలిపే రూపం ఇది.
- source_word: אֲשַׁלֵּם
  choice: తగిన ప్రతిఫలం చెల్లిస్తాను
  rationale: ‘తిరిగి చెల్లిస్తాను/ప్రతిఫలమిస్తాను’ అనే భావాన్ని వ్యక్తం చేస్తుంది; సందర్భంలోని శిక్షాత్మక ప్రతిఫలాన్ని స్పష్టం చేస్తూ, ప్రత్యేక సిద్ధాంత పదజాలాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దైవ ప్రతీకారం మరియు తీర్పు
  choice: ‘తీర్పు’, ‘ప్రతీకారం’ అనే ప్రత్యక్ష పదాలను నిలుపడం
  alternative: వాటిని ‘న్యాయం చేయడం’ లేదా ‘శిక్షించడం’గా మృదువుగా మార్చడం
  rationale: మూలవచనం దైవ తీర్పు, ప్రతీకారం మధ్య ఉన్న బలమైన సంబంధాన్ని ఉద్దేశపూర్వకంగా వ్యక్తం చేస్తుంది; దాని తీవ్రతను తగ్గించలేదు.
- issue: אִם యొక్క షరతు/కాల భావం
  choice: ‘పెట్టినప్పుడు’
  alternative: ‘ఒకవేళ నేను పదును పెడితే’
  rationale: ఇక్కడి కవితా సందర్భం అనిశ్చిత అవకాశంకన్నా జరగబోయే చర్యకు కాలపూర్వక ఉపవాక్యంగా అర్థం చేసుకోవడానికి వీలు కల్పిస్తుంది; అయినా మూలంలోని సాధ్యమైన షరతు ఛాయను పూర్తిగా సిద్ధాంతీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా లయను ఉంచాం. సమాంతర పాదాలను నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే ‘పదును పెట్టు’, ‘చేపట్టు’, ‘తీర్చుకో’, ‘చెల్లించు’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకున్నాం.
