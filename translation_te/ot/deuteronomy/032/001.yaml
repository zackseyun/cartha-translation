  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַאֲזִ֥ינוּ הַ/שָּׁמַ֖יִם וַ/אֲדַבֵּ֑רָה וְ/תִשְׁמַ֥ע הָ/אָ֖רֶץ אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: te
  text: ఆకాశాలారా, చెవియొగ్గి వినండి[a]; నేను మాట్లాడతాను. భూమీ, నా నోటి మాటలు వినుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాలారా, శ్రద్ధగా వినండి … భూమీ, వినుగాక.” హీబ్రూలో గంభీరమైన కవితాత్మక ఆజ్ఞ, విజ్ఞప్తి రూపాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: చెవియొగ్గు
  rationale: אזן హిఫిల్ ఆజ్ఞారూపం కేవలం వినడాన్ని కాక శ్రద్ధగా ఆలకించడాన్ని కోరుతుంది. ‘చెవియొగ్గు’ ఆధునిక పాఠకునికి అర్థమయ్యేలా ఉండి, కవితాత్మకమైన గంభీర పిలుపును నిలుపుతుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశమా
  rationale: శమయిమ్ రూపపరంగా బహువచనమైనా, తెలుగులో ఈ విశ్వసంబోధనకు ‘ఆకాశమా’ సహజమైన సమానార్థకం; సంబోధనను ‘-మా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַאֲדַבֵּרָה
  choice: నేను మాట్లాడతాను
  rationale: కోహోర్టేటివ్ రూపం వక్త సంకల్పాన్ని లేదా ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. ఈ అనువాదం దానిని సహజంగా నిలుపుతుంది.
- source_word: וְתִשְׁמַע
  choice: వినాలి
  rationale: ఇంపర్ఫెక్ట్/జస్సివ్ రూపం ఇక్కడ ఆకాశానికి ఇచ్చిన ఆజ్ఞకు సమాంతరమైన సంకల్పాత్మక విజ్ఞప్తిగా పనిచేస్తుంది. ‘వినాలి’ ఆ పిలుపు బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘వినుగాక’ అనే కావ్య ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: ఆకాశం–భూమి అనే విశ్వజంటలో ‘దేశం’ కంటే ‘భూమి’ సందర్భానుకూలం.
- source_word: אִמְרֵי
  choice: మాటలను
  rationale: ఈ పదం పలికిన వాక్కులను సూచిస్తుంది. ‘మాటలు’ సహజంగానూ తగిన గంభీరతతోనూ ఉంది.
- source_word: פִי
  choice: నా నోటి
  rationale: ‘నా నోటి మాటలు’ అనే మూర్తమైన హీబ్రూ కవితా ప్రయోగాన్ని సంక్షిప్త పరాభాషగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఆకాశం–భూమి సంబోధన పరిధి
  choice: సాక్షులుగా విశ్వాన్ని ఆహ్వానించే కవితాత్మక పిలుపు
  alternative: వినేవారందరికీ ఉద్దేశించిన కేవలం అలంకారిక పిలుపు
  rationale: ఆకాశం, భూమి అనే జంట నిబంధనాత్మక మరియు ప్రవచనాత్మక సందర్భాల్లో గంభీర సాక్ష్యాహ్వానాన్ని సూచిస్తుంది. ప్రధాన పాఠం ఈ భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీర కవితా ధ్వనితో రూపొందించబడింది. ‘చెవియొగ్గు’ మూలంలోని శ్రద్ధగా ఆలకించమనే బలాన్ని నిలుపుతుంది; వాక్య నిర్మాణం హీబ్రూ సమాంతరతను స్పష్టంగా ఉంచుతుంది.
