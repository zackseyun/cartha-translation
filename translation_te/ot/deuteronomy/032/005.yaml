id: DEU.32.5
reference: Deuteronomy 32:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: te
  text: వారు ఆయనపట్ల భ్రష్టంగా ప్రవర్తించారు[a]; వారి కళంకం కారణంగా వారు ఆయన పిల్లలు కారు. వారు వక్రమైన, మెలికలు తిరిగిన తరం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం క్లిష్టంగా, అత్యంత సంక్షిప్తంగా ఉంది. మొదటి భాగాన్ని ‘వారు తమను తాము భ్రష్టపరచుకున్నారు’ అని కూడా అర్థం చేసుకోవచ్చు; తరువాతి పదబంధాన్ని ‘వారి కళంకం’ లేదా ‘వారి తప్పు’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దుర్మార్గమైన, వక్రమైన తరం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: భ్రష్టంగా ప్రవర్తించారు
  rationale: పీయేల్ రూపం భ్రష్టమైన చర్యను సూచిస్తుంది. స్పష్టంగా లేని ఆత్మనివర్తక భావాన్ని బలవంతంగా చేర్చకుండా క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: לוֹ
  choice: ఆయనపట్ల
  rationale: ל ఉపసర్గతో కూడిన ఈ సంబంధం సంక్షిప్తమైనది, క్లిష్టమైనది. ‘ఆయనపట్ల’ అనేది దానిని కేవలం అనుకూలంగా గానీ విరోధంగా గానీ నిర్ణయించకుండా దేవునితో సంబంధాన్ని నిలుపుతుంది.
- source_word: לֹא בָּנָיו
  choice: వారు ఆయన పిల్లలు కారు
  rationale: హీబ్రూలో ఇది క్రియలేని, సంక్షిప్త వాక్యభాగం. తెలుగు సహజత్వం కోసం ‘వారు ... కారు’ చేర్చబడింది; మూలంలో లేని కాలసూచక ‘ఇక’ భావాన్ని చేర్చలేదు.
- source_word: מוּמָם
  choice: తమలోని కళంకం కారణంగా
  rationale: מוּם సాధారణంగా లోపం లేదా కళంకాన్ని సూచిస్తుంది. ఇక్కడి నైతిక రూపకానికి ‘కళంకం’ సరిపోతుంది; సంక్షిప్త వాక్యనిర్మాణంలోని సంబంధాన్ని అర్థవంతం చేయడానికి ‘కారణంగా’ సరఫరా చేయబడింది.
- source_word: דּוֹר
  choice: తరం
  rationale: కావ్యాత్మక, నిబంధన సంబంధ సందర్భంలో సహజమైన మరియు ఖచ్చితమైన తెలుగు పదం.
- source_word: עִקֵּשׁ
  choice: వక్రమైన
  rationale: ఈ విశేషణం వంగిపోయిన లేదా దుర్మార్గమైన స్వభావాన్ని సూచిస్తుంది. ‘వక్రమైన’ మూలంలోని దృశ్యరూపకాన్ని నిలుపుతుంది.
- source_word: וּפְתַלְתֹּל
  choice: మెలికలు తిరిగిన
  rationale: ఈ అరుదైన విశేషణం తరంలోని నైతిక వక్రతను మరింత తీవ్రంగా చూపుతుంది. ‘మెలికలు తిరిగిన’ అనేది ముందటి ‘వక్రమైన’తో భేదాన్ని ఉంచుతూ దృశ్యరూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: לֹא בָּנָיו అనేది నిబంధనాత్మక పుత్రత్వాన్ని కోల్పోవడాన్ని చెబుతుందా, లేక పుత్రస్వభావాన్ని మాత్రమే నిరాకరిస్తుందా
  choice: వారు ఆయన పిల్లలు కారు
  alternative: వారు ఇక ఆయన పిల్లలు కారు; వారు ఆయనకు పిల్లలు కారు
  rationale: హీబ్రూ ఎలాంటి స్పష్టమైన కాలసూచక పదం లేకుండా నిరాకరణను తీవ్రంగా చెబుతుంది. ఈ అనువాదం ఆ తీవ్రతను నిలుపుతూ, ఈ వచనం చెప్పేదానికంటే మించి నిబంధన స్థితి గురించి సిద్ధాంతపరమైన నిర్ణయాన్ని చేర్చదు.
- issue: మొదటి పాదంలోని సంక్షిప్త వాక్యనిర్మాణాన్ని ఎలా అర్థం చేసుకోవాలి
  choice: వారు ఆయనపట్ల భ్రష్టంగా ప్రవర్తించారు; తమలోని కళంకం కారణంగా వారు ఆయన పిల్లలు కారు
  alternative: వారు తమను తాము భ్రష్టపరచుకున్నారు; వారు ఆయన పిల్లలు కారు; వారి కళంకం వారిదే
  rationale: ద్వితీయోపదేశకాండము 32:5 వాక్యనిర్మాణపరంగా ప్రసిద్ధమైన క్లిష్ట పాఠం. ఎంచుకున్న పఠనం మసొరెటిక్ స్వరచిహ్నాలకు అనుగుణమైన సాధారణ భావాన్ని అనుసరిస్తూ సహజమైన తెలుగు ఇస్తుంది. నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్యశైలిని ఉపయోగించాం. ‘భ్రష్టంగా’, ‘కళంకం’, ‘వక్రమైన’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని నైతిక తీవ్రతను నిలుపుతాయి. నిజమైన హీబ్రూ వాక్యనిర్మాణ సందిగ్ధతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా పాదటిప్పణిలో ఇచ్చాం.
