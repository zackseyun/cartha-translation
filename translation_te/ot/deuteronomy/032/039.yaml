source:
  edition: WLC
  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: te
  text: 'ఇప్పుడు చూడండి: నేను, నేనే స్వయంగా ఆయనను[a]; నాతోపాటు ఏ దేవుడూ లేడు[b]. నేనే మరణింపజేస్తాను, జీవింపజేస్తాను; గాయపరిచాను, నేనే స్వస్థపరుస్తాను[c]. నా చేతిలోనుంచి విడిపించేవాడు ఎవడూ లేడు[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “నేను, నేనే ఆయనను.” రెండుసార్లు వచ్చిన “నేను” ఉద్ఘాటనను సూచిస్తుంది.
    reason: source_form
  - marker: b
    text: లేదా “నా పక్కన ఏ దేవుడూ లేడు.” హెబ్రీ పూర్వప్రత్యయం అక్షరార్థంగా “నాతో” అని కూడా అనువదించవచ్చు; ఇక్కడ తనతోపాటు నిలిచే మరో దేవుడు లేడనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “గాయపరిచాను” అని అనువదించిన హెబ్రీ క్రియకు “చితకగొట్టాను” లేదా “నలగగొట్టాను” అనే మరింత బలమైన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: “నా చేతిలోనుంచి” అనేది ఒకరి శక్తి లేదా ఆధీనంలోనుంచి తప్పించుకోవడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: ఇప్పుడు చూడండి
  rationale: బహువచన ఆజ్ఞార్థకమైన רְאוּ యొక్క ప్రత్యక్ష పిలుపును, עַתָּה యొక్క కాలసూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: నేను—నేనే ఆయనను
  rationale: రెండుసార్లు వచ్చిన אֲנִי యొక్క ఉద్ఘాటనను డాష్‌తో సహజంగా చూపిస్తూ, הוּא ను అదనపు సిద్ధాంతార్థం చేర్చకుండా అనువదిస్తుంది.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: నాతోపాటు ఏ దేవుడూ లేడు
  rationale: עִם యొక్క మూలార్థమైన ‘తో’ను నిలుపుతూ, ఈ సందర్భంలోని సహచర లేదా సమాన దేవత ఎవ్వరూ లేరనే ప్రత్యేకత్వాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: నేనే మరణింపజేస్తాను, జీవింపజేస్తాను
  rationale: מות యొక్క causative భావాన్నీ, חיה తో ఉన్న సమాంతర నిర్మాణాన్నీ గంభీరమైన కానీ అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: గాయపరిచాను, నేనే స్వస్థపరుస్తాను
  rationale: పూర్తయిన గాయపరచే క్రియకూ తరువాతి స్వస్థపరచే క్రియకూ మధ్య ఉన్న కాలభేదాన్ని, విరుద్ధ సమాంతరతను నిలుపుతుంది.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: నా చేతిలోనుంచి విడిపించేవాడు ఎవడూ లేడు
  rationale: מַצִּיל లోని రక్షించే లేదా విడిపించే భావాన్ని స్పష్టంగా తెలియజేస్తూ, ‘నా చేతిలోనుంచి’ అనే హెబ్రీయ రూపకాన్ని ప్రధాన పాఠంలోనే ఉంచుతుంది.
theological_decisions:
- issue: ఇతర దేవతలకు సంబంధించి దేవుని ప్రత్యేకత్వం
  choice: నాతోపాటు ఏ దేవుడూ లేడు
  alternative: నా పక్కన ఏ దేవుడూ లేడు; నాతో ఏ దేవుడూ లేడు
  rationale: ఈ వాక్యం కేవలం ఇతర దేవతలకంటే అధికత్వాన్ని కాక, తనతోపాటు నిలిచే దేవత ఎవ్వరూ లేరనే బలమైన ప్రత్యేకత్వాన్ని ప్రకటిస్తుంది. అయితే עִם అనే విభక్తి సంబంధంలోని నిజమైన ‘తో/తోపాటు’ భావాన్ని పూర్తిగా తొలగించలేదు.
- issue: ‘నేను నేనే ఆయనను’ అనే వాక్యంలోని అంతర్వాక్య ప్రతిధ్వని
  choice: నేను—నేనే ఆయనను
  alternative: నేనే ఆ దేవుణ్ణి; నేనే ఏకైకుడిని
  rationale: మూలంలోని ఉద్ఘాటనను నిలుపుతూ, తరువాతి గ్రంథసంబంధ లేదా సిద్ధాంతపర అర్థాలను అనువాదంలో ముందుగానే చేర్చదు.
- issue: మరణం మరియు జీవం మీద దైవాధికారం
  choice: నేనే మరణింపజేస్తాను, జీవింపజేస్తాను
  alternative: నేనే చంపుతాను, బ్రతికిస్తాను
  rationale: మూలంలోని సమాంతర causative క్రియలను మృదువుచేయకుండా, కవితాత్మక గంభీరతతో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణి పాటించబడింది. ఉద్ఘాటన కోసం పరిమితంగా ‘నేనే’ మరియు డాష్ వాడబడ్డాయి. ‘మరణింపజేస్తాను, జీవింపజేస్తాను’ అనే సమాంతర జంట సాధారణ పాఠకునికి అర్థమయ్యేంత స్పష్టంగా ఉండగా మూలంలోని causative నిర్మాణాన్ని కూడా కాపాడుతుంది.
