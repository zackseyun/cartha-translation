  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/נֶ֨שֶׁר֙ יָעִ֣יר קִנּ֔/וֹ עַל גּוֹזָלָ֖י/ו יְרַחֵ֑ף יִפְרֹ֤שׂ כְּנָפָי/ו֙ יִקָּחֵ֔/הוּ יִשָּׂאֵ֖/הוּ עַל אֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: te
  text: తన గూడును కదిలిస్తూ, తన పిల్లలపై తేలియాడే గద్దలా[a][b], ఆయన తన రెక్కలను చాపి, అతణ్ణి తీసుకొని, తన పొడవైన రెక్క ఈకలపై[c] మోస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాబందులా.’ హీబ్రూ పదం נֶשֶׁר పెద్ద శవభక్షక పక్షిని లేదా గద్దవంటి పెద్ద వేటపక్షిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన పిల్లలపై రెక్కలు అల్లాడిస్తూ’ లేదా ‘తన పిల్లలపై పొదుగుతున్నట్లు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం ముఖ్యంగా రెక్కలోని పొడవైన ఈకలను సూచిస్తుంది; విస్తృతంగా ‘రెక్కలపై’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: గద్దలా
  rationale: נֶשֶׁר పెద్ద వేటపక్షిని లేదా శవభక్షక పక్షిని సూచించవచ్చు. తెలుగు బైబిలు కవితా సందర్భంలో ‘గద్ద’ సహజంగా ఉండి, బలం మరియు రక్షణ అనే చిత్రాన్ని నిలుపుతుంది; జంతుశాస్త్రపరమైన అనిశ్చితిని పాదటీకలో ఉంచాం.
- source_word: יָעִיר קִנּוֹ
  choice: తన గూడును కదిలించే
  rationale: עור హిఫిల్ రూపం మేల్కొల్పడం, లేపడం, చురుకుపరచడం అనే భావాన్ని ఇస్తుంది. పక్షి తన పిల్లలను కదిలించే చిత్రానికి ‘గూడును కదిలించే’ సహజమైన, మూలానికి సమీపమైన ప్రయోగం.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: తన పిల్లలపై రెక్కలు అల్లాడిస్తూ
  rationale: רחף ఎగురుతూ అల్లాడడం లేదా తేలియాడడం అనే చలనాన్ని సూచిస్తుంది. తెలుగులో ‘రెక్కలు అల్లాడిస్తూ’ ఆ కదలికను స్పష్టంగా వ్యక్తం చేస్తుంది; కేవలం స్థిరంగా ‘తేలియాడడం’ కంటే పక్షి చిత్రానికి సహజం.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: ఆయన తన రెక్కలను చాపి
  rationale: פרשׂ అంటే విప్పడం లేదా చాపడం; כְּנָפַיִם సాధారణ రెక్కలు. ‘ఆయన’ అనే పురుష ఏకవచనం సందర్భంలోని యెహోవా వైపు కవితాత్మక మార్పును నిలుపుతుంది.
- source_word: יִקָּחֵהוּ
  choice: అతణ్ణి తీసుకొని
  rationale: לקח సాధారణంగా తీసుకోవడం అని అర్థం; ఏకవచన పురుష కర్మప్రత్యయం పిల్లలో ఒకదానిని లేదా రూపకంలోని ఇశ్రాయేలును వ్యక్తిగతంగా సూచించగలదు. అందువల్ల ఏకవచనాన్ని నిలిపాం.
- source_word: יִשָּׂאֵהוּ
  choice: అతణ్ణి ... మోస్తాడు
  rationale: נשׂא ఇక్కడ భౌతికంగా ఎత్తి మోయడాన్ని సూచిస్తుంది. ‘మోస్తాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: עַל אֶבְרָתוֹ
  choice: తన రెక్కల ఈకలపై
  rationale: אֶבְרָה రెక్కలోని పొడవైన ఈకలు లేదా పక్షి రెక్కల ఈకలను సూచిస్తుంది; ముందున్న כָּנָף‌తో ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు ‘రెక్కల ఈకలు’ ద్వారా నిలిపాం.
theological_decisions:
- issue: ఉపమానంలోని పక్షి నుంచి యెహోవా వైపు సర్వనామ సూచన
  choice: వాక్యం రెండో భాగంలో ‘ఆయన/తన/అతణ్ణి’ అనే పురుష ఏకవచన రూపాలను నిలుపడం
  alternative: మొత్తం వాక్యాన్ని పక్షి గురించే అన్నట్లుగా లింగరహితంగా లేదా ‘అది/దాని’తో అనువదించడం
  rationale: హీబ్రూలో క్రియలు పురుష ఏకవచనంలో ఉన్నాయి; విస్తృత సందర్భంలో ఈ పక్షి చిత్రం యెహోవా ఇశ్రాయేలును సంరక్షించడాన్ని వర్ణిస్తుంది. ‘ఆయన’ అనడం ఆ కవితాత్మక అన్వయాన్ని నిలుపుతుంది, అయితే యెహోవా అనే పేరును వచనంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘రెక్కలు’ మరియు ‘రెక్కల ఈకలు’ అనే భేదంతో כָּנָף/אֶבְרָה పదభేదాన్ని పాఠకులకు అర్థమయ్యే రీతిలో సాధ్యమైనంతవరకు నిలిపాం. ప్రతి పాదటీక సూచికను ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచాం.
