source:
  edition: WLC
  text: אֲשֶׁ֨ר חֵ֤לֶב זְבָחֵ֨י/מוֹ֙ יֹאכֵ֔לוּ יִשְׁתּ֖וּ יֵ֣ין נְסִיכָ֑/ם יָק֨וּמוּ֙ וְ/יַעְזְרֻ/כֶ֔ם יְהִ֥י עֲלֵי/כֶ֖ם סִתְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: te
  text: 'వారి బలుల కొవ్వును తిని,

    వారి పానార్పణల ద్రాక్షారసాన్ని తాగినవారు

    లేచి మీకు సహాయం చేయుగాక;

    వారు మీకు ఆశ్రయంగా ఉండుగాక.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: వారి బలుల కొవ్వు
  rationale: חֵלֶב అంటే బలిలోని ‘కొవ్వు’; זְבָחֵימוֹ అంటే ‘వారి బలులు’. మూలంలోని బలి సంబంధిత స్పష్టతను నిలుపుతుంది.
- source_word: יֵין נְסִיכָם
  choice: వారి పానార్పణల ద్రాక్షారసం
  rationale: יֵין అనేది ద్రాక్షారసం/ద్రాక్షమద్యం; נְסִיכָם పోయబడే పానార్పణలను సూచిస్తుంది. ఆధునిక పాఠకుడికి సహజంగా ఉండేలా ‘పానార్పణల ద్రాక్షారసం’ అని అనువదించబడింది.
- source_word: סִתְרָה
  choice: ఆశ్రయం
  rationale: ఈ పదం దాగుకొనే చోటు, రక్షణనిచ్చే ఆవరణ అనే భావాన్ని కలిగి ఉంది; సందర్భంలో ‘ఆశ్రయం’ సహజంగా ఆ వ్యంగ్య సవాలును వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తప్పుడు దేవతలు బలులను తిని పానార్పణలను తాగినట్లు చెప్పడం
  choice: మూలంలోని వ్యంగ్య మానవీకరణను అలాగే ఉంచడం
  alternative: ‘వాటికి అర్పించిన’ అని వివరణాత్మకంగా మార్చడం
  rationale: వచనం ప్రత్యర్థి దేవతలను ఎగతాళి చేస్తూ, వారు అర్పణలను స్వీకరించి భుజించినట్లుగా మాట్లాడుతుంది. ఈ అలంకారాన్ని వివరణతో మృదువుచేయలేదు.
- issue: יָק֨וּמוּ֙ וְיַעְזְרֻכֶם ... יְהִי עֲלֵיכֶם סִתְרָה లోని ఆజ్ఞ/సవాలు
  choice: ‘వారే ... చేయనివ్వండి’ అనే వ్యంగ్య సవాలుగా అనువదించడం
  alternative: భవిష్యద్వాక్యంగా ‘వారు లేచి సహాయం చేస్తారు’ అని అనువదించడం
  rationale: సందర్భం ఇశ్రాయేలు ఆశ్రయించిన దేవతలను సహాయం చేయమని సవాలు చేస్తోంది; హెబ్రీ రూపాల సందర్భోచిత ఆజ్ఞార్థాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కవితా సమాంతరతను నాలుగు పాదాలుగా నిలిపి, దేవతలపై ఉన్న వ్యంగ్య సవాలును కాపాడింది. ‘ఎక్కడ?’ మూలంలో ప్రత్యక్ష పదంగా లేకపోవడంతో ప్రచురణ పాఠ్యంలో దాన్ని చేర్చడం వివరణాత్మక విస్తరణ అవుతుంది; అందువల్ల తుది పాఠ్యంలో దాన్ని తొలగించాలి.
