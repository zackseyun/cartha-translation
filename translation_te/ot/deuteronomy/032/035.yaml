source:
  edition: WLC
  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: te
  text: ప్రతీకారమూ ప్రతిఫలమూ నావే; వారి కాలు జారే సమయంలోనే.[a][b] ఎందుకంటే వారి విపత్తు దినం సమీపించింది; వారి కోసం సిద్ధంగా ఉన్నవి వేగంగా సమీపిస్తున్నాయి.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రతీకారం, ప్రతిఫలం నావే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారి కాలు తడబడే సమయంలో” లేదా “వారి కాలు నిలువలేకపోయే సమయంలో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “వారికి నిర్ణయించబడినవి వేగంగా సమీపిస్తున్నాయి”; హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
  - marker: d
    text: ఈ ప్రతీకార ప్రకటన రోమీయులకు 12:19లో ఉటంకించబడింది; హెబ్రీయులకు 10:30లో కూడా కనిపిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: ప్రతీకారం తీర్చడం, ప్రతిఫలం చెల్లించడం నా పని
  rationale: లִי అనే దత్తివాచక/స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగులో ‘నా పని’గా వ్యక్తం చేశాం. נָקָם న్యాయబద్ధమైన ప్రతీకారాన్ని, שִׁלֵּם తగిన ప్రతిఫలం చెల్లించడాన్ని సూచిస్తాయి; రెండింటినీ సమాంతర క్రియానామ పదబంధాలుగా ఉంచాం.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: వారి కాలు జారే సమయం వస్తుంది
  rationale: ఏకవచన ‘కాలు’తో కూడిన సమూహార్థక హీబ్రూ రూపకాన్ని నిలిపి, לְעֵת యొక్క కాలార్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: ఎందుకంటే వారి విపత్తు దినం సమీపించింది
  rationale: כִּי యొక్క కారణార్థాన్ని ‘ఎందుకంటే’తో, אֵיד యొక్క వినాశకర అపద భావాన్ని ‘విపత్తు’తో అందించాం.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: వారి కోసం సిద్ధంగా ఉన్నవి త్వరగా వస్తున్నాయి
  rationale: సంక్షిప్తమైన హీబ్రూ బహువచన substantival రూపాన్ని అలాగే బహువచనంగా ఉంచి, దాని ఖచ్చిత విషయాన్ని ‘వినాశం’ లేదా ‘విధి’గా అతిగా నిర్ధారించకుండా సమీపిస్తున్న భావాన్ని తెలిపాం.
theological_decisions:
- issue: దైవిక ప్రతీకార స్వభావం
  choice: ‘ప్రతీకారం తీర్చడం ... నా పని’ అని నిలిపాం
  alternative: ‘న్యాయం చేయడం నా పని’ లేదా ‘నేను పగ తీర్చుకుంటాను’
  rationale: మూలం తీర్పులో దేవుని ప్రత్యేక హక్కును ప్రకటిస్తుంది. ‘న్యాయం’ అని మెత్తబరచకుండా, వ్యక్తిగత కక్షను సూచించే ‘పగ’గా తీవ్రతరం చేయకుండా న్యాయబద్ధ ప్రతీకార భావాన్ని నిలిపాం.
- issue: עֲתִדֹת לָמוֹ యొక్క సంక్షిప్తత
  choice: ‘వారి కోసం సిద్ధంగా ఉన్నవి’
  alternative: ‘వారి వినాశం’ లేదా ‘వారికి నిర్ణయించబడినవి’
  rationale: మూలంలోని బహువచన, నిర్దిష్టంగా చెప్పని భావాన్ని కాపాడుతూ, దాని విషయాన్ని సిద్ధాంతపరంగా ముందే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక స్వరం ఉంచాం. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంటూనే, హీబ్రూ సమాంతర నిర్మాణం, ‘కాలు జారడం’ అనే రూపకం, చివరి భాగంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.
