review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the principal terms, but ‘వారి కాలు జారే సమయం వస్తుంది’ adds ‘comes’ and changes the Hebrew temporal phrase (‘at the time when their foot slips’) into an independent prediction. The revision restores the temporal relation without supplying an additional event. ‘వారి కోసం సిద్ధంగా ఉన్నవి వేగంగా సమీపిస్తున్నాయి’ preserves the plural, deliberately unspecified ‘things prepared for them’ and the sense of swift approach.
  naturalness: The revised wording is modern standard Telugu with a solemn poetic register. ‘ప్రతీకారమూ ప్రతిఫలమూ నావే’ is more direct and idiomatic than treating both nouns as verbal actions and adding ‘నా పని.’
  terminology: ‘ప్రతీకారం’ appropriately retains the judicial-retribution force of נָקָם without reducing it to generic justice. ‘ప్రతిఫలం’ suitably renders recompense. ‘విపత్తు దినం’ and the collective singular ‘కాలు’ are natural and faithful.
  issues:
  - severity: medium
    issue: The phrase ‘వారి కాలు జారే సమయం వస్తుంది’ adds ‘వస్తుంది’ (‘will come’) and makes the Hebrew temporal phrase an independent clause.
    rationale: לְעֵת תָּמוּט רַגְלָם means ‘at the time when their foot slips,’ qualifying the declaration of vengeance and recompense. It does not state that a time will come.
  - severity: low
    issue: ‘నా పని’ is interpretive and less close than a possessive rendering.
    rationale: לִי (‘to me/mine’) presents vengeance and recompense as belonging to God. ‘నావే’ states this directly without adding the idiom ‘my task.’
  - severity: low
    issue: ‘త్వరగా వస్తున్నాయి’ is understandable but less precise for the verb of hurrying/approaching.
    rationale: ‘వేగంగా సమీపిస్తున్నాయి’ retains the imminent, hastening sense while leaving the unspecified plural referent intact.
  revised_text: ప్రతీకారమూ ప్రతిఫలమూ నావే; వారి కాలు జారే సమయంలోనే.[a][b] ఎందుకంటే వారి విపత్తు దినం సమీపించింది; వారి కోసం సిద్ధంగా ఉన్నవి వేగంగా సమీపిస్తున్నాయి.[c][d]
