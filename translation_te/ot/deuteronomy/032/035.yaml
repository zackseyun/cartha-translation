revisions:
- from: ప్రతీకారం తీర్చడం, ప్రతిఫలం చెల్లించడం నా పని;[a] వారి కాలు జారే సమయం వస్తుంది.[b] ఎందుకంటే వారి విపత్తు దినం సమీపించింది; వారి కోసం సిద్ధంగా ఉన్నవి త్వరగా వస్తున్నాయి.[c][d]
  to: ప్రతీకారమూ ప్రతిఫలమూ నావే; వారి కాలు జారే సమయంలోనే.[a][b] ఎందుకంటే వారి విపత్తు దినం సమీపించింది; వారి కోసం సిద్ధంగా ఉన్నవి వేగంగా సమీపిస్తున్నాయి.[c][d]
  rationale: The revision removes the added verb ‘వస్తుంది,’ renders the possessive construction directly, and expresses the final hastening clause more closely. The Hebrew’s poetic compression and the ambiguity of what is ‘prepared for them’ are preserved.
