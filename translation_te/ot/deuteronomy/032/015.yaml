source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: te
  text: 'కాని యెషూరూను బలిసి తన్నాడు;

    నీవు బలిశావు, లావెక్కావు, కొవ్వుతో నిండిపోయావు[a].

    అప్పుడు అతడు తనను చేసిన దేవుణ్ణి విడిచాడు;

    తన రక్షణ శిలను తృణీకరించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొవ్వుతో కప్పబడ్డావు,” లేక “ఉబ్బిపోయావు.” ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని ఖచ్చితమైన భావఛాయ అనిశ్చితం. అయితే అతిగా తిని బలిసిపోయిన భావం స్పష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: యెషూరూను
  rationale: ఇది ఇశ్రాయేలుకు వాడిన ప్రత్యేక కవితాత్మక పేరు లేదా బిరుదు. దాని అర్థాన్ని ముందుగానే ‘నీతిమంతుడు’ లేదా ‘ఇశ్రాయేలు’ అని నిర్ణయించకుండా పేరును లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁמַן
  choice: బలిసి
  rationale: సమృద్ధివల్ల కలిగిన నిర్లక్ష్యాన్ని సూచించే భావం సందర్భంలో ఉన్నప్పటికీ, మూలంలోని శరీర సంబంధమైన ‘బలిసిపోవడం’ అనే సజీవ రూపకాన్ని నిలిపాం.
- source_word: וַיִּבְעָט
  choice: తన్నాడు
  rationale: బాగా మేత తిన్న జంతువు అదుపు తప్పి తన్నే చిత్రాన్ని ఈ క్రియ వ్యక్తం చేస్తుంది. ‘తిరుగుబాటు చేశాడు’ అని భావాన్ని మాత్రమే చెప్పకుండా మూల రూపకాన్ని ఉంచాం.
- source_word: שָׁמַנְתָּ
  choice: నీవు బలిశావు
  rationale: మూడవ పురుష వర్ణన మధ్యలో వచ్చే ప్రత్యక్ష సంబోధనను నిలిపి, కవితలోని నింద తీవ్రతను కాపాడాం.
- source_word: עָבִיתָ
  choice: లావెక్కావు
  rationale: అతిగా తిని దృఢంగా, లావుగా తయారైన దేహచిత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּשִׂיתָ
  choice: కొవ్వుతో నిండిపోయావు
  rationale: ఈ అరుదైన రూపం ఖచ్చితంగా ఏ సూక్ష్మభావాన్ని ఇస్తుందో అనిశ్చితం; అయినా అతిగా బలిసిన స్థితి స్పష్టంగా ఉంది. ప్రధాన పాఠంలో ఆ చిత్రాన్ని సహజంగా ఇచ్చి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- source_word: וַיִּטֹּשׁ
  choice: విడిచిపెట్టి
  rationale: దేవునిపట్ల ఒడంబడిక విశ్వాసాన్ని వదిలివేయడాన్ని స్పష్టమైన, ప్రస్తుత తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: తనను చేసిన దేవుణ్ణి
  rationale: దేవుడు ఇశ్రాయేలును చేసినవాడని చెప్పే మూలంలోని సాధారణ ‘చేయు’ క్రియను, ‘సృష్టించు’ అని మరింత నిర్దిష్టం చేయకుండా నిలిపాం.
- source_word: וַיְנַבֵּל
  choice: తృణీకరించాడు
  rationale: అవమానకరంగా చూడటం, విలువలేనిదిగా ఎంచటం అనే క్రియాశీల నిరాదరణ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: צוּר יְשֻׁעָתוֹ
  choice: తన రక్షణకు శిల అయినవాణ్ణి
  rationale: ‘శిల’ అనే దేవునికి సంబంధించిన ప్రధాన రూపకాన్నీ, అది వ్యక్తిని సూచిస్తోందనే తెలుగులో అవసరమైన స్పష్టతనూ నిలిపాం; ‘రక్షణ’ను ‘విజయం’గా లేదా మరొక భావంగా కుదించలేదు.
theological_decisions:
- issue: మూడవ పురుష వర్ణన నుంచి రెండవ పురుష ప్రత్యక్ష సంబోధనకు, తిరిగి మూడవ పురుషానికి మారడం
  choice: ‘యెషూరూను ... తన్నాడు; నీవు ... అతడు ...’ అనే వ్యక్తి మార్పును నిలిపాం.
  alternative: అన్ని వాక్యభాగాలను ‘అతడు’ అనే మూడవ పురుషంలో ఏకరీతిగా చెప్పడం.
  rationale: ఈ అకస్మాత్తు మార్పు మూల కవితలోని ప్రత్యక్ష నిందను, వాక్చాతుర్య తీవ్రతను పెంచుతుంది; దాన్ని సాఫీ చేయడం మూలంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని తొలగిస్తుంది.
- issue: צוּר అనే దైవ రూపకం
  choice: ‘తన రక్షణకు శిల అయినవాణ్ణి’ అని దైవ రూపకాన్ని అలాగే ఉంచాం.
  alternative: ‘తన రక్షకుణ్ణి’ అని రూపకాన్ని భావానువాదం చేయడం.
  rationale: ద్వితీయోపదేశకాండము 32లో ‘శిల’ దేవునికి పునరావృతమయ్యే ముఖ్యమైన కవితాత్మక designation. తెలుగులో పెద్ద అక్షరాల ద్వారా బిరుదును గుర్తించే అవకాశం లేనందున ‘అయినవాణ్ణి’ అనే నిర్మాణం దాని వ్యక్తిగత దైవసూచనను సహజంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా కవితాత్మక గంభీరతను నిలిపాం. ‘నీవు’ అనే రూపం ప్రత్యక్ష సంబోధనకు గౌరవప్రదమైన శైలిని ఇస్తుంది. శరీర సంబంధమైన బలిసిన జంతువు రూపకాన్ని ఆధ్యాత్మిక భావంతో భర్తీ చేయకుండా ఉంచాం.
