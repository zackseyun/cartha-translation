source:
  edition: WLC
  text: כִּֽי אֶשָּׂ֥א אֶל שָׁמַ֖יִם יָדִ֑/י וְ/אָמַ֕רְתִּי חַ֥י אָנֹכִ֖י לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: te
  text: 'ఎందుకంటే నేను నా చెయ్యిని ఆకాశంవైపు ఎత్తి ఇలా అంటాను: “నేను నిత్యం జీవిస్తున్నాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇది దేవుడు తన జీవాన్ని ఆధారంగా చేసుకొని పలికే స్వప్రమాణ వాక్యప్రయోగం. భావం: “నేను నిత్యం జీవిస్తున్నానని ప్రమాణంగా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రకటనకు గంభీరమైన ఆధారాన్ని పరిచయం చేస్తుంది; సందర్భంలో కారణార్థం సహజంగా ఉంది.
- source_word: אֶשָּׂא
  choice: ఎత్తి
  rationale: נשׂא అనే క్రియకు ఇక్కడ ప్రమాణం చేసేటప్పుడు చెయ్యి ఎత్తే స్పష్టమైన భావం ఉంది.
- source_word: אֶל שָׁמַיִם
  choice: ఆకాశంవైపు
  rationale: పైదిశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీ బహువచన రూపాన్ని తెలుగులో అసహజంగా ప్రతిబింబించదు.
- source_word: יָדִי
  choice: నా చెయ్యి
  rationale: హెబ్రీలోని ఏకవచనాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וְאָמַרְתִּי
  choice: ఇలా అంటున్నాను
  rationale: రూపపరంగా వావ్‌తో కూడిన సంపూర్ణ క్రియ అయినా, ఈ సందర్భంలో ప్రమాణాన్ని పలికే కార్యాన్ని కొనసాగిస్తుంది; వర్తమాన ప్రయోగం తెలుగులో ఆ ప్రత్యక్ష, కార్యసాధక బలాన్ని సహజంగా ఇస్తుంది.
- source_word: חַי אָנֹכִי
  choice: నేను … జీవించేవాడిని
  rationale: దేవుని స్వప్రమాణ సూత్రంలోని జీవముగల స్థితిని వ్యక్తం చేస్తుంది; అదనపు నిశ్చయార్థక పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: לְעֹלָם
  choice: నిత్యం
  rationale: అంతంలేని కాలవ్యాప్తిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని స్వప్రమాణ సూత్రంలోని ప్రమాణ బలాన్ని మరియు పదార్థాన్ని రెండింటినీ నిలుపుకోవడం
  choice: “నేను నిత్యం జీవించేవాడిని” అని ప్రధాన పాఠంలో ఉంచి, ప్రమాణార్థాన్ని పాదసూచికలో స్పష్టం చేయడం
  alternative: “నేను నిత్యం జీవిస్తున్నంత నిశ్చయంగా”
  rationale: హెబ్రీ మాటలు అక్షరార్థంగా దేవుడు నిత్యం జీవించేవాడని చెబుతూ, సందర్భంలో స్వప్రమాణంగా పనిచేస్తాయి. ప్రధాన పాఠం మూలంలోని వాక్యరూపాన్ని కాపాడుతుంది; పాదసూచిక దాని ప్రమాణ ప్రయోగాన్ని తెలియజేస్తుంది, తద్వారా భావాన్ని బలహీనపరచకుండా మూలంలో లేని పదాన్ని పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన దైవవాక్య శైలిని వాడాం. “చెయ్యి ఎత్తి” అనే దృశ్యరూపాన్ని నిలిపి, ప్రమాణార్థాన్ని పాదసూచికలో వివరించాం.
