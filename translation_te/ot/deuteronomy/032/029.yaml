revisions:
- from: వారు జ్ఞానులై ఉంటే ఎంత బాగుండేది! వారు దీన్ని గ్రహించేవారు; తమ అంతం[a] ఎలా ఉంటుందో వివేచించేవారు.
  to: వారు జ్ఞానవంతులై ఉంటే ఎంత బాగుండునో! వారు దీన్ని గ్రహించేవారు; తమ అంతాన్ని వివేచించేవారు.[a]
  rationale: The revision preserves the Hebrew optative and poetic parallelism while avoiding the added ‘how it will be’ construction. The footnote remains anchored to “అంతాన్ని” and preserves the recognized lexical alternatives without narrowing the term to destruction alone.
