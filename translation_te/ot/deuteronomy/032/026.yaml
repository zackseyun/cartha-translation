  edition: WLC
  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: te
  text: 'నేను అన్నాను: “వారిని చెదరగొడతాను[a]; మానవుల మధ్యనుండి[b] వారి జ్ఞాపకాన్ని తొలగిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని గాలికి కొట్టుకుపోయేలా చేస్తాను / చెల్లాచెదురు చేస్తాను.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది, దాని అర్థం నిర్ధారించడం కష్టమైనది. కొందరు దీనిని వారిని మూలమూలలకు తరిమివేయడం లేదా కనిపించకుండా తొలగించడం అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మర్త్యుని నుండి.” హీబ్రూలో ఏకవచన పదం మానవులను సమష్టిగా సూచిస్తుంది; దానిలో మానవ మర్త్యత్వపు ఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: నేను ఇలా అనుకున్నాను
  rationale: אמר యొక్క Qal perfect 1cs రూపానికి ప్రాథమిక అర్థం ‘నేను అన్నాను.’ అయితే ఇక్కడ అది దేవుని ఉద్దేశాన్ని అంతరంగంగా ప్రకటించే కవితాత్మక సందర్భంలో ఉంది; సహజమైన ఆధునిక తెలుగులో ‘నేను ఇలా అనుకున్నాను’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది, తదుపరి వచనంలో ఆ ఉద్దేశానికి వచ్చే పరిమితినీ ముందే పరిష్కరించదు.
- source_word: אַפְאֵיהֶם
  choice: వారిని చెదరగొడతాను
  rationale: ఇది అరుదైన, అర్థనిర్ణయం కష్టమైన రూపం. సందర్భంలో ప్రజలను చెదరగొట్టడం లేదా కనిపించకుండా తొలగించడం అనే భావం ఉండవచ్చు. ‘చెదరగొడతాను’ స్పష్టమైన తెలుగు రూపం; అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: אַשְׁבִּיתָה
  choice: లేకుండా చేస్తాను
  rationale: שבת యొక్క Hiphil రూపం ‘ఆగిపోయేలా చేయడం’ లేదా ‘లేకుండా చేయడం’ అని సూచిస్తుంది. కర్మ ‘వారి జ్ఞాపకం’ కాబట్టి తెలుగులో ‘జ్ఞాపకం లేకుండా చేస్తాను’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: מֵאֱנוֹשׁ
  choice: మనుషుల మధ్య
  rationale: אֱנוֹשׁ ఏకవచన రూపంలో ఉన్నప్పటికీ మానవజాతిని సమష్టిగా, కొన్నిసార్లు మర్త్యత్వపు ఛాయతో సూచిస్తుంది. ‘మనుషుల మధ్య’ జ్ఞాపకం మానవ సమాజం నుండి తొలగిపోవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: זִכְרָם
  choice: వారిని గురించిన జ్ఞాపకం
  rationale: זֵכֶר/זכר ఇక్కడ ‘జ్ఞాపకం, స్మరణ’ అనే భావం. ‘వారిని గురించిన జ్ఞాపకం’ అనే రూపం తెలుగులో ఎవరి జ్ఞాపకమో సందిగ్ధత లేకుండా చెబుతుంది.
theological_decisions:
- issue: కవితాత్మక దైవవాక్యంలో తీర్పు ఉద్దేశం
  choice: ‘చెదరగొడతాను … లేకుండా చేస్తాను’ అనే ప్రకటిత ఉద్దేశంగా అనువదించడం
  alternative: ‘చెదరగొట్టేవాడిని … లేకుండా చేసేవాడిని’ అనే షరతుతో కూడిన భావంగా అనువదించడం
  rationale: హీబ్రూ రూపాలు బలమైన దైవసంకల్పాన్ని ప్రకటిస్తాయి; తరువాతి వచనం దాని అమలును సందర్భానుసారంగా పరిమితం చేస్తుంది. తెలుగులో భవిష్యత్ ఉద్దేశరూపం ఈ వచనపు బలాన్ని కాపాడుతూ, తరువాతి వచనం వెల్లడించే ఉద్రిక్తతను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కవితాత్మక దైవవాక్య శైలి. అరుదైన హీబ్రూ క్రియకు పాఠ్యంలో సులభంగా అర్థమయ్యే రూపం ఇచ్చి, నిజమైన పదార్థ అనిశ్చితిని [a] పాదటిప్పణిలో ఉంచాం. మానవజాతిని సూచించే సమష్టి ఏకవచనాన్ని [b]లో వివరించాం.
