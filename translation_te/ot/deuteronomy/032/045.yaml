revisions:
- from: మోషే ఇశ్రాయేలంతటితో ఈ మాటలన్నీ చెప్పడం ముగించినప్పుడు,
  to: మోషే ఈ మాటలన్నీ ఇశ్రాయేలీయులందరికీ చెప్పడం ముగించినప్పుడు,
  rationale: The sole revision replaces the incorrect comitative expression with a recipient construction. It retains completion (‘ముగించినప్పుడు’), the totality of the words, Moses’ conventional name, and the comma because the sentence continues in the next verse.
