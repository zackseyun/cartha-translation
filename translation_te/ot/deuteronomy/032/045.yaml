  text: וַ/יְכַ֣ל מֹשֶׁ֗ה לְ/דַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/045.yaml
  text: When Moses finished speaking all these words to all Israel,
translation:
  language: te
  text: మోషే ఈ మాటలన్నీ ఇశ్రాయేలీయులందరికీ చెప్పడం ముగించినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించినప్పుడు
  rationale: כלה అనే క్రియ యొక్క వయ్యిక్తోల్ రూపం ఒక కార్యం పూర్తయిందని సూచిస్తుంది. తరువాతి వచనంతో వాక్య సంబంధాన్ని సహజంగా నిలుపుతూ తెలుగులో ‘ముగించినప్పుడు’ అని అనువదించాం.
- source_word: לְדַבֵּר
  choice: చెప్పడం
  rationale: כלהతో కూడిన ఇన్ఫినిటివ్ నిర్మాణం ‘మాట్లాడడం ముగించు’ అనే భావాన్నిస్తుంది. ఇక్కడ ఉద్దేశం పలికిన సందేశం కాబట్టి ‘చెప్పడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నీ
  rationale: דברים ఇక్కడ ముందున్న ప్రసంగం లేదా గీతంలోని పలుకులను సూచిస్తుంది. ‘ఈ మాటలన్నీ’ మూలంలోని సమగ్రతను, పదరూపాన్ని సహజంగా కాపాడుతుంది.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటితో
  rationale: ఈ పదబంధం నిబంధన సమాజమైన ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది. ‘ఇశ్రాయేలంతటితో’ అనే రూపం దానిని వ్యక్తుల జాబితాగా విస్తరించకుండా సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని అనుసరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూల వచనం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
