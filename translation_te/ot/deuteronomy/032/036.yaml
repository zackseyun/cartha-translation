id: DEU.32.36
reference: Deuteronomy 32:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే తన ప్రజల పక్షాన తీర్పు ఇస్తాడు[a], తన సేవకుల విషయంలో కనికరపడతాడు[b]. వారి బలం క్షీణించిందనీ[c], నిర్బంధితుడుగానీ విడిచిపెట్టబడినవాడుగానీ ఎవ్వరూ మిగలలేదనీ[d] ఆయన చూసినప్పుడు ఇలా చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ప్రజలకు తీర్పు తీరుస్తాడు.” ఇక్కడి సందర్భం యాహ్వే తన ప్రజల పక్షాన చర్య తీసుకోవడాన్ని సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన సేవకుల విషయంలో మనసు మార్చుకుంటాడు.” హెబ్రీ క్రియ కనికరంతో చలించడం లేదా ఒక చర్యనుంచి వెనుదిరగడం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “చేయి పోయింది”; ఇది శక్తి లేదా సామర్థ్యం క్షీణించిందని చెప్పే నానుడి.
    reason: lexical_alternative
  - marker: d
    text: హెబ్రీలో, “నిర్బంధితుడు మరియు విడిచిపెట్టబడినవాడు.” ఈ కఠినమైన జంటకు “బానిసగానీ స్వతంత్రుడుగానీ” లేదా మరింత సాధారణంగా “ఎవ్వరూ మిగలలేదు” అనే భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: పక్షాన న్యాయం తీర్చుతాడు
  rationale: דין న్యాయతీర్పును సూచిస్తుంది; సందర్భం ప్రజలను ఖండించడం కంటే వారి పక్షాన న్యాయం చేయడాన్ని సూచిస్తోంది. ఈ రూపం న్యాయపరమైన భావాన్ని, అనుకూల చర్యను రెండింటినీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: עַמּוֹ
  choice: తన ప్రజలు
  rationale: నిబంధన సంబంధంలోని సమూహార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: తన సేవకుల విషయంలో కనికరపడతాడు
  rationale: נחם రూపానికి ఇక్కడ కనికరపడడం లేదా వారి విషయంలో తన చర్యను మార్చుకోవడం అనే భావవ్యాప్తి ఉంది. ప్రధాన పాఠం సందర్భానుకూలమైన కనికరాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచుతుంది.
- source_word: כִּי יִרְאֶה
  choice: ఆయన చూసినప్పుడు
  rationale: כִּי లోని కాల-కారణ భావాల మేళవింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָזְלַת יָד
  choice: వారి బలం పూర్తిగా క్షీణించింది
  rationale: అక్షరార్థంగా ‘చేయి పోయింది’; చేయి శక్తికి రూపకం కాబట్టి భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: וְאֶפֶס
  choice: ఎవడూ మిగలలేదు
  rationale: లేమి లేదా అంతమైపోవడాన్ని, తరువాతి జంటతో అనుసంధానించి తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָצוּר וְעָזוּב
  choice: బంధింపబడినవాడుగానీ విడిచిపెట్టబడినవాడుగానీ
  rationale: హెబ్రీలోని కఠినమైన, అర్థం అనిశ్చితంగా ఉన్న జంటను ప్రధాన పాఠంలో తులనాత్మకంగా రూపసామ్యంతో నిలిపింది; ‘బానిసగానీ స్వతంత్రుడుగానీ’ అనే సామెతార్థాన్ని పాదటీపులో తెలిపింది.
theological_decisions:
- issue: יָדִין ద్వారా దేవుని చర్య ప్రజలకు అనుకూలమా, ప్రతికూలమా?
  choice: తన ప్రజల పక్షాన న్యాయం తీర్చడం
  alternative: తన ప్రజలకు తీర్పు తీర్చడం లేదా వారిని శిక్షించడం
  rationale: సేవకులపట్ల కనికరం మరియు వారి నిస్సహాయతను చూడటం అనే సమాంతర సందర్భం అనుకూల న్యాయచర్యను బలపరుస్తుంది; అయినా ‘తీర్పు’ అనే విస్తృత అర్థాన్ని పాదటీపులో సంరక్షించింది.
- issue: יִתְנֶחָם యొక్క కనికరం–మనసు మార్చుకోవడం భావవ్యాప్తి
  choice: కనికరపడతాడు
  alternative: తన సేవకుల విషయంలో పశ్చాత్తాపపడతాడు లేదా తన నిర్ణయాన్ని మార్చుకుంటాడు
  rationale: సందర్భంలో దయతో వారి వైపు తిరగడం ప్రధాన భావం. దేవుని మార్పురాహిత్యం గురించి సిద్ధాంతపరమైన ముందస్తు నిర్ణయంతో ప్రత్యామ్నాయ భావాన్ని తొలగించలేదు.
- issue: עָצוּר וְעָזוּב యొక్క అనిశ్చిత సామెతార్థం
  choice: బంధింపబడినవాడుగానీ విడిచిపెట్టబడినవాడుగానీ
  alternative: బానిసగానీ స్వతంత్రుడుగానీ; లేదా ఎవడూ మిగలలేదు
  rationale: హెబ్రీ జంటకు ఖచ్చితమైన అర్థం వివాదాస్పదం. ప్రధాన పాఠం రూపసామ్యాన్ని కాపాడగా, సాధ్యమైన సామెతార్థాలను పాదటీపు తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కవితాత్మక గంభీరతను ఉంచుతూ, అస్పష్టమైన చివరి హెబ్రీ జంటను అతిగా స్పష్టీకరించకుండా పాదటీపుతో సంరక్షించాం. అన్ని పాదటీపు గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
