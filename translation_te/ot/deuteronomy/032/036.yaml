  to: ఎందుకంటే యాహ్వే తన ప్రజల పక్షాన తీర్పు ఇస్తాడు[a], తన సేవకుల విషయంలో కనికరపడతాడు[b]. వారి బలం క్షీణించిందనీ[c], నిర్బంధితుడుగానీ విడిచిపెట్టబడినవాడుగానీ ఎవ్వరూ మిగలలేదనీ[d] ఆయన చూసినప్పుడు ఇలా చేస్తాడు.
  rationale: దైవనామాన్ని ఆంగ్ల POB నిర్ణయమైన “Yahweh”కు అనుగుణంగా యాహ్వేగా మార్చాం. వాక్యప్రవాహాన్ని సహజం చేశాం; అయితే చివరి హెబ్రీ జంట యొక్క వివాదాస్పదతను ప్రధాన పాఠంలోని సాపేక్ష-అక్షరార్థ పదాలతోనూ పాదటీపులోని ప్రత్యామ్నాయాలతోనూ కాపాడాం. అన్ని పాదటీపు గుర్తులు వాటి సంబంధిత పదబంధాల వద్ద ఉన్నాయి.
