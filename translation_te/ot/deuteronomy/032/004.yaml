  to: ఆ శిల—ఆయన కార్యం పరిపూర్ణమైనది; ఎందుకంటే ఆయన మార్గాలన్నీ న్యాయమే.[a] ఆయన నమ్మకమైన దేవుడు[b]; ఆయనలో అన్యాయం లేదు.[c] ఆయన నీతిమంతుడు, యథార్థవంతుడు ఆయన.
