source:
  edition: WLC
  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: te
  text: ఆ శిల—ఆయన కార్యం పరిపూర్ణమైనది; ఎందుకంటే ఆయన మార్గాలన్నీ న్యాయమే.[a] ఆయన నమ్మకమైన దేవుడు[b]; ఆయనలో అన్యాయం లేదు.[c] ఆయన నీతిమంతుడు, యథార్థవంతుడు ఆయన.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మార్గాలన్నీ న్యాయతీర్పే.” హీబ్రూ מִשְׁפָּט అనే పదానికి “న్యాయం,” “తీర్పు,” లేదా న్యాయపరంగా సరైనది అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నమ్మకమైన దేవుడు” అనే మాటను “విశ్వాస్యతగల దేవుడు” అని కూడా అర్థం చేసుకోవచ్చు; ఈ సందర్భంలో తక్కువ సంభావ్యతతో, “సత్య దేవుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయనలో తప్పు లేదు” లేదా “అన్యాయం లేనివాడు.” హీబ్రూ עָוֶל అనే పదం నైతిక తప్పు, అన్యాయం, లేదా దుర్నీతిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: ఆ బండ
  rationale: ఈ కవితా సందర్భంలో צוּר దేవునికి రూపకాలంకారపూర్వకమైన బిరుదు. తెలుగులో ‘ఆ బండ’ రూపకాన్ని, నిర్దిష్టతను నిలుపుతుంది.
- source_word: תָּמִים
  choice: సంపూర్ణమైనది
  rationale: దేవుని కార్యంలోని సంపూర్ణత, లోపరాహిత్యం, సమగ్రతను సూచిస్తుంది.
- source_word: פָּעֳלוֹ
  choice: ఆయన కార్యం
  rationale: ఏకవచన నామరూపాన్ని నిలుపుతూ దేవుని క్రియ మొత్తాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణం లేదా ఆధారాన్ని పరిచయం చేస్తుంది.
- source_word: כָל־דְּרָכָיו
  choice: ఆయన మార్గాలన్నీ
  rationale: దేవుని ప్రవర్తన లేదా వ్యవహార విధానాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయమైనవే
  rationale: ఇక్కడ విధేయపదంగా వచ్చి దేవుని మార్గాలన్నీ న్యాయానికి అనుగుణమైనవని చెబుతుంది; సహజమైన తెలుగుకోసం విశేషణ రూపం వాడబడింది.
- source_word: אֵל אֱמוּנָה
  choice: నమ్మకత్వంగల దేవుడు
  rationale: אֱמוּנָה ఇక్కడ దేవుని విశ్వసనీయత, స్థిరత్వం అనే గుణాన్ని సూచిస్తుంది; ‘నమ్మకత్వంగల’ అనేది నామవాచక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֵין עָוֶל
  choice: ఆయనలో అన్యాయం లేదు
  rationale: దేవునిలో ఎలాంటి నైతిక వక్రత లేదా అన్యాయం లేదనే అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: దేవుని నైతిక న్యాయస్వభావాన్ని తెలిపే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: וְיָשָׁר
  choice: యథార్థవంతుడు
  rationale: మూలంలోని నైతిక నిటారుతనం, సమగ్రతను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הוּא
  choice: ఆయన
  rationale: హీబ్రూలో చివరన ఉన్న సర్వనామం ఉద్ఘాటన కలిగిస్తుంది; తెలుగులో గౌరవపూర్వక దైవసూచక సర్వనామంతో భావం నిలుపబడింది.
theological_decisions:
- issue: הַצּוּר అనే దైవ బిరుదు/రూపకం
  choice: ‘ఆ బండ’గా అనువదించడం
  alternative: ‘బండవంటి దేవుడు’ లేదా రూపకాన్ని వివరణగా మార్చడం
  rationale: మోషే గీతంలో ఇది ఇశ్రాయేలు దేవునికి రూపకాలంకారపూర్వక బిరుదు. వివరణను చేర్చకుండా మూల రూపకాన్నే నిలుపడం కవితా, తాత్త్విక బలాన్ని కాపాడుతుంది.
- issue: אֱמוּנָה అనే దైవ గుణం
  choice: నమ్మకత్వం
  alternative: సత్యం లేదా స్థిరత్వం
  rationale: ఈ సందర్భంలో దేవుని ఆధారపడదగిన స్వభావం, విశ్వసనీయత ప్రధానంగా ఉన్నాయి; ‘సత్యం’ అని మాత్రమే అనువదిస్తే భావం అనవసరంగా కుదించబడవచ్చు.
- issue: מִשְׁפָּט యొక్క విధేయార్థం
  choice: ఆయన మార్గాలన్నీ న్యాయమైనవి
  alternative: ఆయన మార్గాలన్నీ తీర్పు
  rationale: మూలంలోని న్యాయ-న్యాయనిర్ణయ అర్థపరిధిని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన వాక్యాన్ని ఇస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ హీబ్రూ సమాంతర నిర్మాణం, దైవ బండ రూపకం, చివరి నైతిక గుణవర్ణనలను నిలుపుకుంది. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
