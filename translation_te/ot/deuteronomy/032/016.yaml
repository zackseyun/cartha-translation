  to: 'వారు అన్యులతో[a] ఆయనలో అసూయ రగిలించారు;

    హేయమైన వాటితో ఆయనకు కోపం రేపారు.'
  rationale: 'The revision makes only a safe idiomatic adjustment to the first colon. The existing ‘హేయమైన వాటితో’ is retained in the complete text because it accurately conveys the weighty, condemnatory sense of the Hebrew plural תּוֹעֵבוֹת. The footnote remains anchored to ‘అన్యులతో’ and preserves the source-text ambiguity: ‘gods’ is supplied only as a contextual alternative, not in the main text.'
