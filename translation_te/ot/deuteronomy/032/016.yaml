  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: te
  text: 'వారు అన్యులతో[a] ఆయనలో అసూయ రగిలించారు;

    హేయమైన వాటితో ఆయనకు కోపం రేపారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్య దేవుళ్లతో’ లేదా ‘పరదేశ దేవుళ్లతో’; హెబ్రీలో అక్షరార్థంగా ‘అన్యులతో/పరులతో’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: ఆయనకు అసూయ పుట్టించారు
  rationale: కנא హిఫీల్ రూపంలోని కారణార్థాన్ని, 3వ పురుష ఏకవచన కర్మను నిలుపుతూ, ఒడంబడిక సంబంధమైన మానవరూప వర్ణనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּזָרִים
  choice: అన్యులతో
  rationale: זָרִים అనే పదానికి అక్షరార్థంగా ‘అన్యులు/పరులు’ అని అర్థం. ఈ వచనంలో ‘దేవుళ్లు’ అనే నామవాచకం స్పష్టంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో దానిని చేర్చలేదు; విగ్రహారాధన సందర్భాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּתוֹעֵבֹת
  choice: హేయమైన వాటితో
  rationale: תוֹעֵבָה అసహ్యకరమైన లేదా తీవ్రంగా ఏవగించదగిన వాటిని సూచిస్తుంది; ఇక్కడ బహువచనాన్ని స్పష్టంగా ఉంచుతూ, సామాన్య పాఠకులకు సహజమైన పదబంధాన్ని ఎంచుకున్నాం.
- source_word: יַכְעִיסֻהוּ
  choice: ఆయనకు కోపం రేపారు
  rationale: כעס హిఫీల్‌లోని ‘కోపానికి కారణమవడం’ అనే కారణార్థాన్ని సహజంగా తెలియజేస్తూ మొదటి పాదంతో సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: זָרִיםలో సూచితమైన విగ్రహారాధనా కర్మను స్పష్టంగా ‘దేవుళ్లు’ అని చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థానికి దగ్గరగా ‘అన్యులతో’ అని ఉంచడం
  alternative: అన్య దేవుళ్లతో / పరదేశ దేవుళ్లతో
  rationale: సందర్భం ఇశ్రాయేలు విగ్రహారాధనను సూచించినప్పటికీ, ఈ వచనంలోని హెబ్రీ పాఠ్యంలో ‘దేవుళ్లు’ అనే పదం లేదు. అందువల్ల మూలంలోని సంక్షిప్తతను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసార అర్థాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. రెండు హెబ్రీ పాదాల సమాంతర నిర్మాణాన్ని నిలిపాం; దైవ అసూయ, కోపం అనే మానవరూప ఒడంబడిక భాషను మెత్తబరచలేదు.
