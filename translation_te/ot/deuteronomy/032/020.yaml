    issue: ‘నేను వారికి నా ముఖాన్ని మరుగుచేస్తాను’ అనే పదబంధం అసహజంగా ఉంది మరియు מֵהֶם (‘వారి నుండి’) అనే సంబంధాన్ని అస్పష్టంగా చేస్తుంది.
    rationale: హీబ్రూ మూలంలోని ‘నా ముఖాన్ని వారి నుండి దాచుకుంటాను’ అనే నిబంధనాత్మక రూపకాన్ని సహజ తెలుగులో స్పష్టంగా చెప్పాలి.
