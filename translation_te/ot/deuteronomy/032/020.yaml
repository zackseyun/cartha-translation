id: DEU.32.20
reference: Deuteronomy 32:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “నేను వారి నుండి నా ముఖాన్ని దాచుకుంటాను; వారి అంతం ఏమవుతుందో చూస్తాను. ఎందుకంటే వారు వక్రతలతో నిండిన తరం[a], విశ్వసనీయత లేని పిల్లలు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వక్రమైన తరం.” హీబ్రూ పదబంధానికి అక్షరార్థం “వక్రతల తరం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నమ్మకత్వం లేని పిల్లలు,” “నిబద్ధత లేని పిల్లలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: నేను వారికి నా ముఖాన్ని మరుగుచేస్తాను
  rationale: ‘ముఖాన్ని మరుగుచేయడం’ అనే హీబ్రూ నిబంధనాత్మక ప్రయోగాన్ని నిలుపుతుంది; ఇది అనుగ్రహం లేదా సన్నిధిని ఉపసంహరించడాన్ని సూచిస్తుంది.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: వారి అంతం ఎలా ఉంటుందో చూస్తాను
  rationale: אַחֲרִית అనే పదంలోని ‘అంతం/తుది పరిణామం’ భావాన్ని గంభీరంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: వక్రతల తరం
  rationale: మూలంలోని నామవాచక నిర్మాణాన్నీ, బహువచన తీవ్రతనూ సాధ్యమైనంతవరకు నిలుపుతుంది; నైతిక వక్రతలు, తారుమారుతనాలు అనే భావం ఉంది.
- source_word: בָּנִים
  choice: పిల్లలు
  rationale: ప్రజలను దేవుని సంతానంగా సామూహికంగా సూచిస్తున్నందున లింగపరంగా సమగ్రంగా, సహజంగా ఉంటుంది.
- source_word: לֹא אֵמֻן בָּם
  choice: నమ్మకత్వం లేని
  rationale: אֵמֻן ఇక్కడ నమ్మదగిన స్వభావం, విశ్వసనీయత, నిబద్ధతను సూచిస్తుంది; కేవలం మానసిక విశ్వాసాన్ని కాదు.
theological_decisions:
- issue: దేవుడు తన ‘ముఖాన్ని’ మరుగుచేయడం అనే మానవరూప నిబంధనాత్మక ప్రయోగం
  choice: ‘నేను వారికి నా ముఖాన్ని మరుగుచేస్తాను’ అని యథాశక్తి నిలుపడం
  alternative: ‘నేను వారికి దూరమవుతాను’ లేదా ‘వారిని పట్టించుకోను’
  rationale: మూలంలోని నిబంధనాత్మక, దైవసన్నిధికి సంబంధించిన బలాన్ని తగ్గించకుండా ఉంచుతుంది; దేవుని ఉపసంహరణ విధానాన్ని అనవసరంగా వివరిస్తూ భావాన్ని పరిమితం చేయదు.
- issue: אֵמֻן యొక్క అర్థం
  choice: నమ్మకత్వం
  alternative: విశ్వసనీయత; నిబద్ధత
  rationale: సందర్భంలో ఇది సిద్ధాంతపరమైన ‘విశ్వాసం’ కంటే సంబంధపరమైన, నిబంధనాత్మక నమ్మదగినతనాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘ముఖం,’ ‘అంతం,’ ‘వక్రతల తరం’ వంటి బలమైన రూపకాలు, నిర్మాణాలు నిలుపబడ్డాయి; అవసరమైన పదార్థ ప్రత్యామ్నాయాలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి.
