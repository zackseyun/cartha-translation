  to: జనములారా, ఆయన ప్రజలతో కలిసి ఆనందించండి[a]; ఎందుకంటే ఆయన తన సేవకుల రక్తానికి[b] ప్రతీకారం తీర్చుకుంటాడు; తన విరోధులకు ప్రతీకారాన్ని తిరిగి చెల్లిస్తాడు[c]; తన దేశానికీ తన ప్రజలకూ ప్రాయశ్చిత్తం చేస్తాడు[d].
