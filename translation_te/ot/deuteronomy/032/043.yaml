id: DEU.32.43
reference: Deuteronomy 32:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔/וֹ כִּ֥י דַם עֲבָדָ֖י/ו יִקּ֑וֹם וְ/נָקָם֙ יָשִׁ֣יב לְ/צָרָ֔י/ו וְ/כִפֶּ֥ר אַדְמָת֖/וֹ עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: te
  text: జనములారా, ఆయన ప్రజలతో కలిసి ఆనందించండి[a]; ఎందుకంటే ఆయన తన సేవకుల రక్తానికి[b] ప్రతీకారం తీర్చుకుంటాడు; తన విరోధులకు ప్రతీకారాన్ని తిరిగి చెల్లిస్తాడు[c]; తన దేశానికీ తన ప్రజలకూ ప్రాయశ్చిత్తం చేస్తాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జనములారా, ఆయన ప్రజలతో కలిసి ఆనందగానం చేయండి’ లేదా ‘ఆనందంతో కేకలు వేయండి.’ హీబ్రూ ఆజ్ఞ ఉల్లాసంగా కేకలు వేయడం లేదా పాడడం అనే భావాన్ని కలిగి ఉండవచ్చు. ‘తో కలిసి’ అనే మాట హీబ్రూలో ప్రత్యక్షంగా లేకపోయినా, దాని సంక్షిప్త వాక్యనిర్మాణానికి సాధ్యమైన అర్థాన్ని తెలుగులో స్పష్టం చేస్తుంది.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తన సేవకుల రక్తం.’ ‘సేవకులు’ అనే హీబ్రూ పదానికి ఇతర సందర్భాల్లో ‘దాసులు’ అని కూడా అర్థం రావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు సెప్టువజింట్ పాఠం, ఒక మృతసముద్ర గ్రంథపు ప్రతి ఈ వచనాన్ని మరింత విస్తారంగా భద్రపరుస్తాయి. వాటిలో ఆకాశాలు, దైవిక జీవులు ఆనందించాలనే పిలుపులు, జనములు ఆయనకు నమస్కరించాలనే పిలుపు కూడా ఉన్నాయి. ప్రధాన పాఠం మసొరా హీబ్రూను అనుసరిస్తుంది.
    reason: textual_variant
  - marker: d
    text: లేదా ‘తన దేశాన్ని, తన ప్రజలను శుద్ధి చేస్తాడు/పరిశుద్ధం చేస్తాడు.’ చివరి మాటలను ‘తన ప్రజల దేశానికి ప్రాయశ్చిత్తం చేస్తాడు’ అని కలిపి అర్థం చేసుకోవడం కూడా సాధ్యం. హీబ్రూ క్రియ ప్రాయశ్చిత్తంతో పాటు శుద్ధీకరణ భావాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: ఆనందించండి
  rationale: רנן అనే క్రియ ఉల్లాసంతో కేకలు వేయడం లేదా పాడడం అనే శ్రవణభావాన్ని కూడా కలిగి ఉంది. ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగు కోసం ‘ఆనందించండి’ వాడి, ఆ మరింత స్పష్టమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: גוֹיִם
  choice: జనములారా
  rationale: ఇక్కడ గోయిమ్ దేవుని ప్రజలకు వెలుపల ఉన్న సమస్త జనసమూహాలను సూచిస్తుంది. ‘అన్యజనులు’ అనే పదం సాధ్యమైనా, తరువాతి మతపరమైన ప్రత్యేకార్థం అధికంగా వినిపించకుండా ‘జనములు’ ఎంచుకున్నాం.
- source_word: עַמּוֹ
  choice: ఆయన ప్రజలతో కలిసి
  rationale: మసొరా హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది. జనములు ఆయన ప్రజలతో కలిసి ఆనందించాలని పిలుపునిచ్చే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘తో కలిసి’ చేర్చాం; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: דַם עֲבָדָיו
  choice: తన సేవకుల రక్తానికి
  rationale: עבד పదానికి ‘దాసుడు’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ వారి స్థితికన్నా దేవునికి చెందినవారిగా వారు చంపబడిన విషయమే ప్రధానంగా ఉన్నందున ‘సేవకులు’ ఎంచుకున్నాం.
- source_word: יִקּוֹם
  choice: ప్రతీకారం తీర్చుకుంటాడు
  rationale: రక్తహత్యకు న్యాయప్రతీకారం చేయడం అనే נקם భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: తన విరోధులకు ప్రతీకారాన్ని చెల్లిస్తాడు
  rationale: ישיב యొక్క ‘తిరిగి ఇవ్వడం/చెల్లించడం’ అనే శక్తినీ, נקם యొక్క ప్రతీకార భావాన్నీ విడిచిపెట్టకుండా తెలుగు కవితాత్మక గంభీరతలో నిలుపుతుంది.
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేస్తాడు
  rationale: כפרలోని పాపపరిహార లేదా శుద్ధీకరణ బలాన్ని నిలుపుతుంది. అది ఎలా జరుగుతుందో అనే తరువాతి సిద్ధాంత వివరణను వాక్యంలోకి దిగుమతి చేయదు.
- source_word: אַדְמָתוֹ עַמּוֹ
  choice: తన దేశానికీ తన ప్రజలకూ
  rationale: అడామా ఇక్కడ దేశం/నేలను సూచిస్తుంది. రెండు నామవాచకాల మధ్య సంబంధం హీబ్రూలో సంక్షిప్తంగా ఉన్నా, సందర్భానుసారంగా రెండింటినీ దేవునికి చెందినవిగా సమన్వయించి అందించాం; భిన్న పఠనాన్ని పాదటిప్పణిలో గుర్తించాం.
theological_decisions:
- issue: ప్రారంభ పాదంలో ‘జనములు’ మరియు ‘ఆయన ప్రజలు’ మధ్య సంబంధం
  choice: జనములు దేవుని ప్రజలతో కలిసి ఆనందించాలనే పిలుపు
  alternative: ‘జనములారా, ఆయన ప్రజలను స్తుతించండి’ లేదా విరామచిహ్నాలతో ‘జనములారా, ఆనందించండి—ఆయన ప్రజలారా’
  rationale: మసొరా పాఠం ‘ఆనందించండి, జనములారా, ఆయన ప్రజలు’ అని అత్యంత సంక్షిప్తంగా ఉంది. సందర్భానికి అనుకూలమైన సంబంధాన్ని ‘తో కలిసి’ ద్వారా తెలుగులో స్పష్టం చేశాం, కానీ హీబ్రూలో ఆ సంబంధసూచక పదం ప్రత్యక్షంగా లేదనే విషయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: చివరి పాదంలో כפר యొక్క భావం
  choice: దేవుడు తన దేశానికీ తన ప్రజలకూ ప్రాయశ్చిత్తం చేస్తాడు
  alternative: దేవుడు తన దేశాన్ని, తన ప్రజలను శుద్ధి చేస్తాడు లేదా దోషవిముక్తం చేస్తాడు
  rationale: మూల క్రియలోని ప్రాయశ్చిత్త/పరిహార బరువును ప్రధాన పాఠంలో కాపాడాం; శుద్ధీకరణ భావం కూడా సాధ్యమని పాదటిప్పణిలో తెలిపాం.
- issue: చివరి నామపదాల వాక్యనిర్మాణం
  choice: ‘తన దేశానికీ తన ప్రజలకూ’ అనే సమన్వయ పఠనం
  alternative: ‘తన ప్రజల దేశానికి’ లేదా ‘తన దేశాన్ని, తన ప్రజలను’
  rationale: మసొరా పాఠంలోని సంక్షిప్తతను పూర్తిగా పరిష్కరించినట్టు నటించకుండా, సాధారణంగా అర్థమయ్యే సమన్వయాన్ని ప్రధాన పాఠంలో ఇచ్చి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. ‘ప్రాయశ్చిత్తం’ వంటి మూలపాఠానికి కీలకమైన ధార్మిక పదాన్ని నిలిపి, దాని సాధ్యమైన శుద్ధీకరణ భావాన్ని పాదటిప్పణిలో వివరించాం. దైవసూచక సర్వనామాలకు గౌరవార్థక ఏకవచనం వాడాం.
