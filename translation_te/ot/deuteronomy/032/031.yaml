  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י לֹ֥א כְ/צוּרֵ֖/נוּ צוּרָ֑/ם וְ/אֹיְבֵ֖י/נוּ פְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: te
  text: ఎందుకంటే వారి బండ మన బండవంటిది కాదు; మన శత్రువులు న్యాయనిర్ణేతలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి బండ మన బండవంటిది కాదు; మన శత్రువులు న్యాయాధిపతులు.” హీబ్రూ పదం פְּלִילִים అక్షరార్థంగా “న్యాయాధిపతులు/న్యాయనిర్ణేతలు” అని అర్థం; అందువల్ల ఈ పాదానికి న్యాయస్థాన సంబంధ భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఆధారాన్ని లేదా వివరణను పరిచయం చేస్తుంది; గీతంలోని తార్కిక ప్రవాహాన్ని సహజంగా నిలుపుతుంది.
- source_word: כְצוּרֵנוּ צוּרָם
  choice: వారి బండ మన బండవంటిది కాదు
  rationale: ఒకే హీబ్రూ నామవాచకాన్ని రెండుసార్లూ ‘బండ’గా ఉంచి, అన్యుల ఆధారానికీ ఇశ్రాయేలు దేవునికీ మధ్య ఉద్దేశపూర్వకమైన వ్యత్యాసాన్ని కాపాడుతుంది. తెలుగులో పెద్ద అక్షరాల ద్వారా భేదం చూపలేము కాబట్టి సందర్భమే సూచనను తెలియజేస్తుంది.
- source_word: וְאֹיְבֵינוּ
  choice: మన శత్రువులే
  rationale: וְ ను వాక్యసంధిగా ప్రతిబింబిస్తూ, ‘-లే’ ద్వారా శత్రువులే ఈ విషయాన్ని ఒప్పుకునే తీర్పుదారులన్న అలంకారిక ఉద్ఘాటనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: פְּלִילִים
  choice: న్యాయనిర్ణేతలు
  rationale: ఈ బహువచన నామవాచకానికి ఉన్న ‘న్యాయాధిపతులు/తీర్పరులు’ అనే న్యాయస్థాన సంబంధ భావాన్ని నామవాచకంగానే నిలుపుతుంది; ‘తీర్పు చెబుతారు’ అని క్రియారూపంలో వ్యాఖ్యానించదు.
theological_decisions:
- issue: צוּר అనే రూపకాన్ని వివరణాత్మక బిరుదుతో భర్తీ చేయాలా
  choice: రెండు చోట్లా ‘బండ’ అనే రూపకాన్నే నిలుపడం
  alternative: ఆశ్రయదాత / రక్షకుడు / బలం
  rationale: హీబ్రూలో ఇశ్రాయేలు దేవునికీ జనాల తప్పుడు ఆధారానికీ ఒకే పదం వాడి ఉద్దేశపూర్వక వ్యత్యాసం సృష్టించారు. రూపకాన్ని నిలుపడం ఆ సాహిత్య, దైవశాస్త్ర బలాన్ని కాపాడుతుంది.
- issue: פְּלִילִים ను నామవాచకంగా ఉంచాలా, శత్రువులు ఇచ్చే సాక్ష్యంగా క్రియారూపంలో వివరించాలా
  choice: ‘న్యాయనిర్ణేతలు’ అనే నామవాచక పఠనం
  alternative: ‘మన శత్రువులే తీర్పు చెబుతారు’ / ‘మన శత్రువులే సాక్షులు’
  rationale: మూలపాఠంలోని న్యాయస్థాన సంబంధ నామవాచక రూపాన్ని, దానిలోని సంక్షిప్తతను కాపాడుతుంది; శత్రువులు నిజంగా ఏ తీర్పు ఇస్తున్నారో అనువాదంలో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘బండ’ రూపకం సామాన్య పాఠకునికి స్పష్టంగా ఉండేలా యథాతథంగా నిలుపబడింది. సెమీకోలన్ రెండు సమాంతర వాక్యభాగాల సంబంధాన్ని చూపుతుంది; పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
