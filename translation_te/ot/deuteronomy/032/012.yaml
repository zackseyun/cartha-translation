  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: te
  text: యాహ్వే ఒక్కడే అతన్ని నడిపించాడు[a]; అతనితో ఏ పరాయి దేవుడూ ఉండలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి మార్గం చూపించాడు.’ హీబ్రూ క్రియకు నడిపించడం లేదా మార్గనిర్దేశం చేయడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఉంచింది.
- source_word: בָּדָד
  choice: ఒక్కడే
  rationale: యెహోవా ఇతరుల సహాయం లేదా తోడు లేకుండా కార్యం చేశాడనే క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַנְחֶנּוּ
  choice: అతన్ని నడిపించాడు
  rationale: హిఫిల్ రూపంలోని נחה ఇక్కడ నడిపించడం లేదా మార్గనిర్దేశం చేయడం అనే భావాన్ని ఇస్తుంది; ఏకవచన పుంలింగ కర్మప్రత్యయాన్ని నిలిపి ఉంచింది.
- source_word: וְאֵין עִמּוֹ
  choice: అతనితో ... లేడు
  rationale: తోడు లేకపోవడాన్ని సూచించే అస్తిత్వ నిరాకరణను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אֵל נֵכָר
  choice: పరాయి దేవుడు
  rationale: ఇశ్రాయేలు దేవునికి భిన్నమైన, అన్యమైన దేవతను సూచించే మూలభాష భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘అతన్ని’ మరియు ‘అతనితో’ అనే ఏకవచన సర్వనామాల సూచన
  choice: మూలంలోని ఏకవచన పుంలింగ రూపాన్ని నిలిపి, సందర్భంలో ఇశ్రాయేలు/యాకోబును సమష్టిగా సూచించనిచ్చింది.
  alternative: జాతి సమూహ భావాన్ని స్పష్టంచేయడానికి ‘వారిని/వారితో’ అని బహువచనంగా అనువదించడం.
  rationale: హీబ్రూలో రెండు ప్రత్యయాలూ ఏకవచన పుంలింగంలో ఉన్నాయి; సమీప సందర్భంలో ఇశ్రాయేలు/యాకోబు ఒక సమష్టి వ్యక్తిగా చిత్రించబడుతున్నాడు. మూలంలోని వ్యాకరణ రూపం, దాని భావ ఉద్రిక్తత నిలిచి ఉండాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘యెహోవా’ అనే దైవనామం నిలిపి ఉంచబడింది; సమష్టి ఇశ్రాయేలును సూచించే మూలంలోని ఏకవచన సర్వనామాలు కూడా పరిరక్షించబడ్డాయి.
