source:
  edition: WLC
  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: te
  text: 'ఆయన ఇలా అంటాడు: “వారి దేవుళ్లు—వారు ఆశ్రయం పొందిన బండ—ఎక్కడున్నారు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారి దేవుళ్లు ఎక్కడున్నారు, వారు దానిలో ఆశ్రయం పొందిన బండ?” ‘బండ’ ఏకవచనంలో ఉంది; అది ‘వారి దేవుళ్లు’కు సమాంతర వివరణగా వస్తుంది. ‘దానిలో’లోని ఏకవచన ప్రత్యయం ఆ ‘బండ’నే సూచిస్తుంది.'
    reason: మూలంలో ఉన్న ఏకవచన ‘బండ,’ దానిని సూచించే ఏకవచన ప్రత్యయం, మరియు ‘వారి దేవుళ్లు’తో దాని అసాధారణ సమాంతర సంబంధాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְאָמַר
  choice: ఆయన ఇలా అంటాడు
  rationale: కావ్య సందర్భంలో ఈ రూపం ప్రభువు పలకబోయే మాటను కొనసాగిస్తుంది. తెలుగు వర్తమాన రూపమైన ‘అంటాడు’ ఇక్కడ సందర్భానుసారంగా భవిష్యదర్థాన్నీ సహజంగా వ్యక్తం చేస్తుంది; ‘ఇలా’ ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: אֵי
  choice: ఎక్కడ?
  rationale: ఇది ‘ఎక్కడ?’ అనే ప్రశ్నార్థక అవ్యయం. మొదటి ప్రశ్నలో ‘వారి దేవుళ్లు’తోనూ, సమాంతరంగా రెండవ ప్రశ్నలో ‘బండ’తోనూ సహజమైన తెలుగు ప్రశ్న నిర్మాణం వాడబడింది.
- source_word: אֱלֹהֵימוֹ
  choice: వారి దేవుళ్లు
  rationale: బహువచన భావాన్నీ, వారు నమ్ముకున్న దేవతలపై ఉన్న వ్యంగ్య సవాలునూ స్పష్టంగా నిలుపుతుంది.
- source_word: צוּר
  choice: బండ
  rationale: మూలంలోని రక్షణనిచ్చే ‘rock’ రూపకాన్ని ‘బండ’ నేరుగా నిలుపుతుంది. ఇది ఇక్కడ యెహోవాకు బిరుదు కాదు; ‘వారి దేవుళ్లు’ అని పిలువబడిన వాటికి సమాంతర వివరణ.
- source_word: חָסָיוּ
  choice: వారు ఆశ్రయం పొందిన
  rationale: חסה అనే క్రియలోని ఆశ్రయం వెదకడం లేదా పొందడం అనే సజీవ రూపకాన్ని నిలుపుతుంది; కేవలం ‘నమ్మిన’ అని అనువదించడంకంటే మూలానికి దగ్గరగా ఉంది.
- source_word: בּוֹ
  choice: బండలో (సంబంధార్థకంగా ‘ఆశ్రయం పొందిన బండ’)
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం ముందున్న ఏకవచన ‘బండ’ను సూచిస్తుంది. తెలుగులో ‘వారు ఆశ్రయం పొందిన బండ’ అనే సంబంధ వాక్య నిర్మాణం ఇదే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పలికేవారి గుర్తింపు మరియు క్రియ యొక్క కాలార్థం
  choice: ప్రభువు పలకబోయే సవాలుగా ‘ఆయన ఇలా అంటాడు’
  alternative: ‘ఆయన ఇలా అన్నాడు’ లేదా ‘అప్పుడు ఒకడు అంటాడు’
  rationale: ద్వితీయోపదేశకాండము 32:36–38 సందర్భంలో తీర్పు సమయంలో ప్రభువు వారి నమ్మకపు దేవుళ్ల అసమర్థతను బయటపెడుతూ పలికే మాటగా చదవడం సహజం. అయినా తెలుగు రూపం మూల కవిత్వంలోని కాల సౌలభ్యాన్ని అతిగా కుదించదు.
- issue: ‘బండ’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: సాధారణ నామవాచకంగా ‘బండ’
  alternative: దైవబిరుదుగా ‘బండ’ను ప్రత్యేకంగా గుర్తించడం
  rationale: ఈ వాక్యంలో ‘బండ’ అనేది ‘వారి దేవుళ్లు’కు సమాంతరంగా ఉంది. కాబట్టి ఈ అధ్యాయంలో ఇతర చోట్ల యెహోవాకు వాడిన దైవబిరుదుతో దీనిని కలపకుండా, వ్యంగ్య విరుద్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితాత్మక ప్రశ్నగా రూపొందించబడింది. రెండు ‘ఎక్కడ?’ ప్రశ్నలు తెలుగులో సహజంగా వినిపిస్తూ, దేవుళ్లు–బండ మధ్య సమాంతరతను స్పష్టంగా ఉంచుతాయి.
