  to: 'ఆయన ఇలా అంటాడు: “వారి దేవుళ్లు—వారు ఆశ్రయం పొందిన బండ—ఎక్కడున్నారు?[a]”'
  rationale: రెండవ ‘ఎక్కడ?’ను తొలగించి, డ్యాష్‌ల మధ్య ఉన్న సమాంతర వివరణ ద్వారా మూలంలోని ఒకే ప్రశ్నను మరియు ‘వారి దేవుళ్లు’–‘బండ’ సంబంధాన్ని నిలుపాము. ఇతర పదప్రయోగాలు మూలార్థానికీ ఆధునిక ప్రామాణిక తెలుగు వాడుకకీ సరిపోతాయి.
