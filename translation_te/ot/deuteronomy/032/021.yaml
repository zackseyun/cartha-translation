source:
  edition: WLC
  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: te
  text: వారు దేవుడు కానిదానితో నాకు అసూయ పుట్టించారు; తమ విగ్రహాలతో[a] నాకు కోపం పుట్టించారు. నేను ప్రజ కానివారితో[b] వారికి అసూయ పుట్టిస్తాను; మూర్ఖమైన[c] జాతితో వారికి కోపం పుట్టిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ‘తమ వ్యర్థమైన వాటితో’ లేదా ‘తమ నిష్ఫలమైన వాటితో’ అని కూడా అర్థం రావచ్చు; ఈ సందర్భంలో అది విగ్రహాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ప్రజ కానిదానితో’; ఇది ‘దేవుడు కానిదానితో’ అనే ముందరి మాటకు ఉద్దేశపూర్వక సమాంతరం.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘మూర్ఖమైన’ అనేది కేవలం తెలివి లేకపోవడాన్ని కాక, నైతిక-ఆధ్యాత్మిక అవివేకాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי / אַקְנִיאֵם
  choice: నాకు రోషం పుట్టించారు / నేను వారికి రోషం పుట్టిస్తాను
  rationale: קנא యొక్క అసూయ–రోష భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వాక్యంలోని ప్రతీకార సమాంతర నిర్మాణాన్ని ఒకే పదబంధంతో నిలుపుతుంది.
- source_word: בְּלֹא אֵל
  choice: దేవుడు కానిదానితో
  rationale: ‘దేవుడు కానిది’ అనే హీబ్రూ వ్యతిరేకతను స్పష్టంగా ఉంచి, అది నిజమైన దేవుడు కాదనే వివాదాత్మక బలాన్ని కాపాడుతుంది.
- source_word: כִּעֲסוּנִי / אַכְעִיסֵם
  choice: నాకు కోపం పుట్టించారు / వారికి కోపం పుట్టిస్తాను
  rationale: כעס హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే రెండు పాదాల ఉద్దేశపూర్వక పరస్పరతను నిలుపుతుంది.
- source_word: בְּהַבְלֵיהֶם
  choice: తమ వ్యర్థమైన విగ్రహాలతో
  rationale: הבל లోని వ్యర్థత/శూన్యత భావాన్నీ, ఈ సందర్భంలో అది విగ్రహాలను సూచించడాన్నీ రెండింటినీ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּלֹא עָם
  choice: ప్రజ కానివారితో
  rationale: ‘దేవుడు కానిది’ అనే ముందరి పదబంధంతో ఉన్న ఉద్దేశపూర్వక సమాంతరతను, ఏ నిర్దిష్ట చారిత్రక సమూహాన్నీ చేర్చకుండా కాపాడుతుంది.
- source_word: בְּגוֹי נָבָל
  choice: బుద్ధిహీనమైన జనంతో
  rationale: נבל యొక్క నైతిక-ఆధ్యాత్మిక అవివేక భావాన్ని వ్యక్తం చేస్తుంది; ఇది కేవలం మేధస్సు కొరతను మాత్రమే సూచించదని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘ప్రజ కానివారు’ మరియు ‘బుద్ధిహీనమైన జనం’ ఎవరిని సూచిస్తాయి?
  choice: ప్రధాన పాఠ్యంలో సాధారణంగానే అనువదించడం
  alternative: ఒక నిర్దిష్ట అన్యజన దేశం లేదా అన్యజనులందరని గుర్తించడం
  rationale: హీబ్రూ పాఠ్యం ఆ జనాన్ని గుర్తించదు. సాధారణ రూపం దాని వాక్చాతుర్య బలాన్ని నిలుపుతూ, తరువాతి వ్యాఖ్యానాన్ని అనువాదంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘రోషం’ ద్వారా קנא లోని దైవిక అసూయ/ఉత్సాహ భావాన్ని అతిగా వివరణ చేయకుండా నిలిపి, ‘కోపం పుట్టించడం’ ద్వారా కారణార్థ సమాంతరతను కాపాడాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
