source:
  edition: WLC
  text: כִּ֥י מִ/נֶּ֖גֶד תִּרְאֶ֣ה אֶת הָ/אָ֑רֶץ וְ/שָׁ֨מָּ/ה֙ לֹ֣א תָב֔וֹא אֶל הָ/אָ֕רֶץ אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: te
  text: ఎందుకంటే నీవు ఆ దేశాన్ని దూరం నుండి చూస్తావు[a]; కానీ నీవు అక్కడికి—నేను ఇశ్రాయేలు కుమారులకు[b] ఇస్తున్న ఆ దేశంలోకి—వెళ్లవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ దేశానికి ఎదురుగా నుండి” లేదా “దూరంగా ఉండి.” మోషే ఆ దేశాన్ని చూస్తాడు గాని అందులో ప్రవేశించడు అనే భావాన్ని హీబ్రూ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు.” ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే స్థిర సమూహనామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో ప్రకటించిన తీర్పుకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: מִנֶּגֶד
  choice: దూరం నుండే
  rationale: మోషే దేశానికి ఎదురుగా లేదా దూరంగా ఉండి దానిని చూస్తాడు గాని అందులో ప్రవేశించడు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నుండే’ పరిమితిని నొక్కిచెబుతుంది.
- source_word: תִּרְאֶה
  choice: చూస్తావు
  rationale: ఈ సందర్భంలోని అసంపూర్ణ క్రియారూపం భవిష్యత్తులో నిశ్చయంగా జరిగేదాన్ని సూచిస్తుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: ఇక్కడ אֶרֶץ ఇశ్రాయేలుకు ఇవ్వబడుతున్న నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; తెలుగులో ‘ఆ దేశం’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וְשָׁמָּה
  choice: అయితే నీవు అక్కడికి
  rationale: గమ్యస్థానాన్ని స్పష్టంగా నిలుపుతూ, ముందు భాగంతో ఉన్న వ్యతిరేకతను సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపుతుంది.
- source_word: לֹא תָבֹא אֶל־הָאָרֶץ
  choice: ఆ దేశంలోకి—వెళ్లవు
  rationale: בוא మరియు אֶל కలిపి ఆ దేశంలోకి కదలికను సూచిస్తాయి. ‘వెళ్లవు’ ప్రవేశం నిరాకరించబడిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: నేను ... ఇస్తున్న
  rationale: నֹתֵן అనే వర్తమాన కృదంతం దేవుడు ఇప్పుడు అమలు చేస్తున్న లేదా సమీపంగా నెరవేర్చబోయే దానక్రియను నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగ బహువచనమైన బְּנֵיను నిలుపుతూ, ఇది ఇశ్రాయేలు ఒడంబడిక సమాజమంతటికీ వాడే సంప్రదాయ జాతీయ నామమని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక ఒడంబడిక సమూహనామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు; ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ రూపాన్ని అనువాదంలో నిలిపాం; అయితే ఈ స్థిర సమూహనామం పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజల సమగ్ర సమాజాన్ని సూచిస్తుందనే అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘అక్కడికి’ అనే దిశాసూచక పదాన్ని, దానికి వివరణగా వచ్చే ‘ఆ దేశంలోకి’ అనే పదబంధాన్ని దీర్ఘ విరామచిహ్నాలతో నిలిపి, హీబ్రూ వాక్యంలోని పునరుక్తి మరియు ఉద్ఘాటనను సహజంగా కాపాడాం.
