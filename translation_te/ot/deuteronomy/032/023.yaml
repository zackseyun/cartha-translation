source:
  edition: WLC
  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: te
  text: వారిమీద విపత్తులను కుప్పలుగా పోస్తాను[a]; నా బాణాలను వారిమీద పూర్తిగా వెచ్చిస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆపదలను’; అక్షరార్థంగా ‘కీడులను’—ఇక్కడ నైతిక చెడును కాక, హాని కలిగించే తీర్పులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా బాణాలను వారిమీద పూర్తిగా ఖర్చు చేస్తాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: కుప్పగా కుమ్మరిస్తాను
  rationale: హిఫీల్ రూపం విపత్తులు వారిమీద అధికంగా వచ్చిపడేలా చేయడాన్ని సూచిస్తుంది. ‘కుప్పగా కుమ్మరిస్తాను’ అనే ప్రయోగం సమీకరణ భావాన్నీ తీర్పు తీవ్రతనూ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עָלֵימוֹ
  choice: వారిమీద
  rationale: עַל ఉపసర్గ ఇక్కడ విపత్తులు ప్రజలపైకి రావడాన్ని రూపకాలంకారంగా తెలియజేస్తుంది; ‘వారిమీద’ దీనిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: רָעוֹת
  choice: విపత్తులను
  rationale: ఈ తీర్పు సందర్భంలో ఈ పదం నైతిక దుష్టత్వాన్ని కాక హానికరమైన ఘటనలు లేదా ఆపదలను సూచిస్తుంది. ‘విపత్తులు’ తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: חִצַּי
  choice: నా బాణాలన్నిటినీ
  rationale: ‘నా బాణాలు’ అనే యుద్ధ రూపకాన్ని యథాతథంగా నిలిపింది. తరువాతి אֲכַלֶּה సూచించే పూర్తిగా వినియోగించే భావాన్ని తెలుగులో స్పష్టం చేయడానికి ‘అన్నిటినీ’ చేర్చబడింది.
- source_word: אֲכַלֶּה
  choice: ప్రయోగిస్తాను
  rationale: పియేల్ రూపం బాణాలను పూర్తిగా వెచ్చించడం లేదా అయిపోయేంతగా ఉపయోగించడం అనే భావం ఇస్తుంది. ‘బాణాలన్నిటినీ ... ప్రయోగిస్తాను’ అనే సమగ్ర వాక్యప్రయోగం ఆ సంపూర్ణతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּם
  choice: వారిమీద
  rationale: בְּ ఇక్కడ బాణాల లక్ష్యాన్ని సూచిస్తుంది; ‘వారిమీద’ శత్రుత్వ దిశను, యుద్ధ రూపకాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పు సందర్భంలో רָעוֹת అనువాదం
  choice: విపత్తులు
  alternative: కీడులు; ఆపదలు
  rationale: హీబ్రూ పదానికి విస్తృతంగా ‘కీడులు’ అనే అర్థం ఉండగలిగినా, ఇక్కడ అది దేవుడు చేసే నైతిక చెడును కాక తీర్పుగా వచ్చే హానికరమైన విపత్తులను సూచిస్తుంది. ‘విపత్తులు’ మూలార్థ తీవ్రతను నిలుపుతూ అనవసరమైన సిద్ధాంత నిర్ధారణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక తీర్పు శైలిని నిలిపాం. ‘కుప్పగా కుమ్మరిస్తాను’ సమీకరణ తీవ్రతను, ‘బాణాలన్నిటినీ ... ప్రయోగిస్తాను’ ఆయుధాలను పూర్తిగా వినియోగించే భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తాయి.
