    text: లేదా, ‘ఆపదలను’; అక్షరార్థంగా ‘కీడులను’—ఇక్కడ నైతిక చెడును కాక, హాని కలిగించే తీర్పులను సూచిస్తుంది.
    reason: lexical_alternative
