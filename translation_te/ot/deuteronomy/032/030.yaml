id: DEU.32.30
reference: Deuteronomy 32:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: te
  text: 'ఒక్కడు వెయ్యిమందిని ఎలా తరమగలడు,

    ఇద్దరు పదివేలమందిని ఎలా పారద్రోలగలరు—

    వారి శిల వారిని అమ్మివేసి,

    యాహ్వే వారిని అప్పగించి ఉంటే తప్ప?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని అప్పగించివేసి ఉంటే తప్ప.”
    reason: הִסְגִּירָם అనే క్రియకు “అప్పగించడం, వదిలివేయడం” అనే భావం ఉంది; గ్రహీతను మూలపాఠంలాగే పేర్కొనకుండా ఉంచుతుంది.
lexical_decisions:
- source_word: אֵיכָה
  choice: ఎలా
  rationale: ఆశ్చర్యంతో కూడిన అలంకారప్రశ్నను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִרְדֹּף
  choice: తరమగలడు
  rationale: רדף అనే క్రియకు యుద్ధ సందర్భంలో ‘వెంటాడడం, తరమడం’ అనే భావం ఉంది; ఇక్కడ ‘తరమడం’ సహజంగా సరిపోతుంది.
- source_word: אֶחָד אֶלֶף
  choice: ఒక్కడు వెయ్యిమందిని
  rationale: ఒక్క వ్యక్తికీ వెయ్యిమందికీ మధ్య ఉన్న అసాధారణ సైనిక నిష్పత్తిని యథాతథంగా నిలుపుతుంది; వ్యక్తులను సూచించేందుకు ‘మందిని’ చేర్చడం తెలుగులో అవసరం.
- source_word: וּשְׁנַיִם
  choice: ఇద్దరు
  rationale: మనుషులను సూచించే తెలుగు సంఖ్యారూపాన్ని ఉపయోగిస్తూ హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: יָנִיסוּ
  choice: పారద్రోలగలరు
  rationale: נוּס యొక్క హిఫీల్ రూపంలోని ‘పారిపోయేలా చేయడం’ అనే కారణార్థాన్ని యుద్ధ సందర్భానికి తగిన సహజమైన పదంతో అందిస్తుంది.
- source_word: רְבָבָה
  choice: పదివేలమందిని
  rationale: సందర్భంలో స్పష్టమైన సంఖ్యార్థమైన ‘పదివేలు’ను నిలుపుతుంది.
- source_word: אִם לֹא כִּי
  choice: ఉంటే తప్ప
  rationale: ఈ అసాధారణ పరిణామానికి చెప్పబడిన ఏకైక కారణాన్ని సూచించే షరతు భావాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: צוּרָם
  choice: వారి శిల
  rationale: ద్వితీయోపదేశకాండము 32లో దేవునికి ఉపయోగించిన ‘శిల’ అనే రూపకాన్ని వివరణాత్మక పదంతో భర్తీ చేయకుండా కాపాడుతుంది.
- source_word: מְכָרָם
  choice: వారిని అమ్మివేసి
  rationale: తీర్పులో శత్రువుల చేతికి వదిలేయడాన్ని సూచించే ‘అమ్మడం’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ పాఠంలోని దేవుని వ్యక్తిగత నామమైన יהוהను లిప్యంతరీకరించి అందిస్తుంది.
- source_word: הִסְגִּירָם
  choice: వారిని అప్పగించి
  rationale: ఇతరుల అధికారానికి లేదా చేతికి వదిలివేయడం అనే హిఫీల్ క్రియ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని ‘యాహ్వే’గా అందించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: צוּרָם అనే దైవరూపకం
  choice: వారి శిల
  alternative: వారి ఆశ్రయదుర్గమైన దేవుడు
  rationale: ‘శిల’ ఇక్కడ ఇశ్రాయేలు దేవునికి రూపకాత్మక బిరుదుగా పనిచేస్తుంది. దాని భావాన్ని ముందుగానే విప్పి చెప్పకుండా మూల రూపకాన్నే నిలిపి, దాని కవితాత్మక మరియు దైవశాస్త్రీయ ఉద్వేగాన్ని కాపాడింది.
- issue: מכר మరియు סגר మధ్య సమాంతర సంబంధం
  choice: అమ్మివేసి ... అప్పగించి
  alternative: శత్రువుల చేతికి అమ్మివేసి ... వారి వశం చేసి
  rationale: మొదటి క్రియలోని అమ్మకం రూపకాన్ని, రెండవ క్రియలోని అప్పగింత భావాన్ని వేర్వేరుగా నిలుపుతూ వాటిని ఒకే పదంగా కలిపివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను మరియు అలంకారప్రశ్న స్వరాన్ని నిలుపుతూ రూపొందించబడింది. ‘వారి శిల’ అనే మూల రూపకం వివరణతో భర్తీ చేయబడలేదు; ‘మందిని’ వంటి సహజ తెలుగు సూచకాలు మాత్రం స్పష్టత కోసం ఉపయోగించబడ్డాయి.
