  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: te
  text: అది నా వద్ద దాచివేయబడి[a], నా గిడ్డంగుల్లో[b] ముద్రించబడి ఉన్నది కాదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా వద్ద దాచబడి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ఖజానాల్లో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ఉంది కదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: הוּא
  choice: అది
  rationale: పుంలింగ ఏకవచన సర్వనామమైనా, సందర్భంలో ముందుగా చెప్పిన విషయం లేదా తీర్పును సూచిస్తుంది; ఖచ్చితమైన పూర్వపదాన్ని నిర్ధారించకుండా అస్పష్టతను కాపాడుతుంది.
- source_word: כָּמֻס
  choice: దాచిపెట్టబడి
  rationale: దాచబడినది, భద్రంగా నిల్వ ఉంచబడినది అనే నిష్క్రియార్థాన్ని తెలియజేస్తూ, తరువాతి నిల్వస్థల రూపకంతో సహజంగా సరిపోతుంది.
- source_word: עִמָּדִי
  choice: నా దగ్గర
  rationale: ‘నాతో/నా వద్ద’ అనే ప్రత్యక్ష భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేసి, దేవుని అధీనంలో లేదా సంరక్షణలో ఉండడాన్ని అతిగా విస్తరించకుండా సూచిస్తుంది.
- source_word: חָתֻם
  choice: ముద్రవేయబడి
  rationale: భద్రత కోసం ముద్రించబడి ఉన్న స్థితిని తెలిపే నిష్క్రియ కృదంత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּאוֹצְרֹתָי
  choice: నా గిడ్డంగుల్లో
  rationale: నిల్వచేసే ప్రదేశాలు అనే మూలార్థాన్ని స్పష్టంగా ఇస్తుంది; ధనసంపదకే పరిమితమైన భావాన్ని రుద్దదు.
theological_decisions:
- issue: దాచబడి, ముద్రవేయబడిన దాని పూర్వపదం
  choice: ముందటి విషయాన్ని సూచించే వ్యక్తిరహిత ‘అది’
  alternative: శత్రు జనాన్ని లేదా వ్యక్తీకరించిన విషయాన్ని సూచించే ‘అతడు’; లేదా ముందటి బెదిరింపులను సమగ్రంగా సూచించే ‘ఇది’
  rationale: హీబ్రూ సర్వనామం పుంలింగ ఏకవచనమైనప్పటికీ, సందర్భం ముందుగా చెప్పిన అపరాధం, దాని నమోదు లేదా నిల్వచేయబడిన తీర్పు వంటి విషయాన్ని సూచించవచ్చు. ‘అది’ ఖచ్చితమైన పూర్వపదాన్ని నిర్ణయించకుండా మూలంలోని ఉద్వేగాన్ని, అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. అలంకారిక ప్రశ్నను తెలుగు వాక్యాంతంలోని ‘కదా?’తో సహజంగా వ్యక్తం చేశాం; రెండు నిష్క్రియ కృదంతాలు మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతున్నాయి.
