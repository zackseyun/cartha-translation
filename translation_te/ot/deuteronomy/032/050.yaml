source:
  edition: WLC
  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: te
  text: నీవు ఎక్కుతున్న ఆ పర్వతం మీద చనిపో, నీ ప్రజల దగ్గరకు చేర్చబడుము[a]; నీ అన్న అహరోను హోరు పర్వతం మీద చనిపోయి తన ప్రజల దగ్గరకు చేర్చబడ్డట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పూర్వీకుల దగ్గరకు చేర్చబడుము.’ హీబ్రూ నుడికారం అక్షరార్థంగా, ‘నీ ప్రజల దగ్గరకు చేర్చబడుము’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: చనిపోయి
  rationale: מות ధాతువు ఇక్కడ మోషేను ఉద్దేశించిన ఆజ్ఞార్థక రూపంలో ఉంది. తరువాతి సమన్విత క్రియతో సహజమైన తెలుగులో కలపడానికి ‘చనిపోయి’ అని అనువదించబడింది; ఆజ్ఞాభావం వాక్యాంతంలోని ‘చేర్చబడాలి’లో నిలుస్తుంది.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: నీవు ఎక్కుతున్న ఆ కొండమీద
  rationale: עלה లోని పైకి వెళ్లే భావాన్ని ‘ఎక్కుతున్న’ నిలుపుతుంది. שָׁמָּה సూచించే గమ్యభావాన్ని తెలుగులో సహజంగా ‘ఆ కొండ’ ద్వారా వ్యక్తం చేశాం.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: నీ ప్రజల దగ్గరికి చేర్చబడాలి
  rationale: Niphal రూపంలోని కర్మణి భావాన్నీ, ‘తన ప్రజల దగ్గరికి చేర్చబడటం’ అనే హీబ్రూ మరణసంబంధ నుడికారాన్నీ వ్యాఖ్యానించి కుదించకుండా నిలిపింది.
- source_word: כַּאֲשֶׁר
  choice: చేర్చబడినట్లే
  rationale: అహరోనుకు జరిగినదానితో మోషేకు జరగబోయేదాన్ని పోల్చే ‘ఎలాగైతే/అలాగే’ భావాన్ని సహజమైన తెలుగు పోలిక నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: אַהֲרֹן אָחִיךָ
  choice: నీ అన్న అహరోను
  rationale: אָח హీబ్రూలో సహోదరుణ్ని సూచిస్తుంది; అహరోను మోషేకు పెద్దవాడు కావడంతో ఆధునిక తెలుగులో సహజమైన ‘అన్న’ ఎంచుకోబడింది.
- source_word: בְּהֹר הָהָר
  choice: హోరు కొండమీద
  rationale: הֹר అనే స్థలనామాన్ని ‘హోరు’గా లిప్యంతరీకరించి, הָהָרను ‘కొండ’గా స్పష్టంగా తెలిపింది.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: తన ప్రజల దగ్గరికి చేర్చబడినట్లే
  rationale: మోషే విషయంలో వాడిన అదే మరణ నుడికారాన్ని అహరోను విషయంలోనూ సమాన పదజాలంతో నిలిపింది.
theological_decisions:
- issue: אסף אל־עמיו అనే మరణ నుడికారం
  choice: ‘నీ/తన ప్రజల దగ్గరికి చేర్చబడటం’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపివేయడం
  alternative: ‘నీ/తన పూర్వీకుల దగ్గరికి చేర్చబడటం’ లేదా ‘చనిపోయిన బంధువులతో కలవడం’
  rationale: ఈ హీబ్రూ నుడికారం మరణాన్ని సూచించినా, కేవలం సమాధి చేయడానికంటే విస్తృతమైన భావసూచన కలిగి ఉండవచ్చు. అందువల్ల దాని వేదాంతపరమైన భావవిస్తృతిని సంకుచితం చేయకుండా మూలరూపానికి దగ్గరగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని మరణ నుడికారాన్ని వ్యాఖ్యానాత్మకంగా పరిష్కరించకుండా నిలిపింది; పోలిక స్పష్టత కోసం చివర ‘నీవూ చేర్చబడాలి’ అని పునరుక్తి చేసింది.
