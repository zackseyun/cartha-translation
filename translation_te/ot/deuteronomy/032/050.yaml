    reason: lexical_alternative
  revision_rationale: The revision restores the Hebrew’s paired imperative force (‘చనిపో ... చేర్చబడుము’), retains the repeated death idiom consistently, and removes an unnecessary final restatement of the command. It does not resolve the idiom into a denominational or overly specific interpretation.
