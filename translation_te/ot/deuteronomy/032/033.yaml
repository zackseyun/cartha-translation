  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా సమాంతరతను నిలిపాం. రెండు పాదాల్లో ‘విషం’ పునరుక్తి మూలంలోని సమాంతర భావాన్ని స్పష్టంగా ఉంచుతుంది; అనిశ్చిత సర్పజాతులను ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయలేదు.
