  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: te
  text: 'వారి ద్రాక్షారసం సర్పాల విషం[a],

    విషసర్పాల క్రూరమైన విషం[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సర్పాలు’ అని అనువదించిన హీబ్రూ పదం ఇతర సందర్భాల్లో పెద్ద సరీసృపాలను లేదా సముద్ర భీకర జీవులను కూడా సూచించవచ్చు; ఇక్కడ విషసర్పాలతో ఉన్న సమాంతరత సర్పాలనే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నాగుపాముల విషం’; హీబ్రూ పదం ఒక విషసర్పాన్ని సూచిస్తుంది, అయితే దాని ఖచ్చితమైన జాతి అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: విషం
  rationale: సర్పాల సందర్భంలో ఈ పదం ‘కోపం’ లేదా ‘వేడి’ కాకుండా వాటి విషాన్ని సూచిస్తుంది.
- source_word: תַּנִּינִם
  choice: మహాసర్పాలు
  rationale: ఈ పదం ఇతర సందర్భాల్లో పెద్ద సరీసృపాలు లేదా సముద్ర భీకర జీవులను సూచించగలదు; ఇక్కడ విషసర్పాలతో ఉన్న సమాంతర నిర్మాణం సర్పసంబంధ అర్థాన్ని బలపరుస్తుంది. ‘మహాసర్పాలు’ దాని విస్తృతతను కొంత నిలుపుతుంది.
- source_word: יֵינָם
  choice: వారి ద్రాక్షారసం
  rationale: స్వామ్యార్థక నిర్మాణాన్ని నేరుగా వ్యక్తపరుస్తూ, తెలుగులో ‘wine’కు సహజమైన స్పష్ట పదాన్ని ఉపయోగిస్తుంది.
- source_word: וְרֹאשׁ
  choice: విషం
  rationale: ఇక్కడ అక్షరార్థమైన ‘తల’ కాదు; చేదైన లేదా విషపూరిత పదార్థాన్ని సూచిస్తుంది. తెలుగు కవితా సమాంతరతలో ‘విషం’ సహజంగా ఉంటుంది.
- source_word: פְּתָנִים
  choice: విషసర్పాలు
  rationale: ఖచ్చితమైన సర్పజాతి నిర్ధారణ కానందున ‘నాగుపాములు’ వంటి అతిగా నిర్దిష్టమైన పదానికి బదులు, విషపూరిత సర్పాలనే నిశ్చిత భావాన్ని ఇస్తుంది.
- source_word: אַכְזָר
  choice: క్రూరమైన
  rationale: విషం యొక్క నిర్దయకరమైన, ప్రాణాంతక ప్రభావాన్ని వ్యక్తీకరణాత్మకంగా వర్ణించే మూలభాషా స్వరాన్ని నిలుపుతుంది.
