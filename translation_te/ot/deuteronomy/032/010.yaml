source:
  edition: WLC
  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: te
  text: 'ఆయన అతణ్ణి ఎడారి భూమిలో,

    విలపించే నిర్జన అరణ్యపు బీడులో కనుగొన్నాడు;

    అతణ్ణి చుట్టుముట్టాడు, అతని పట్ల శ్రద్ధ చూపాడు[a],

    తన కంటిపాపలా అతణ్ణి కాపాడాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ క్రియకు “అతనికి అవగాహన కలిగించాడు” లేదా “అతణ్ణి జాగ్రత్తగా గమనించాడు” అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “తన కంటి పుప్పిలివలె” లేదా “తన కంటి నల్లగుడ్డువలె.” సంప్రదాయంగా దీనిని “కంటిపాపలా” అని అంటారు.
    reason: lexical_clarification
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: ఆయన అతణ్ణి కనుగొన్నాడు
  rationale: מצא అనే క్రియకు ప్రాథమిక అర్థం ‘కనుగొను’. కావ్యంలోని గత సంఘటనల వర్ణనకు తెలుగు భూతకాల రూపం సహజంగా సరిపోతుంది.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: ఎడారి దేశంలో
  rationale: אֶרֶץ (‘దేశం/భూమి’), מִדְבָּר (‘ఎడారి/అరణ్యం’) అనే రెండు అంశాలనూ సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: అరుపులతో నిండిన నిర్జన అరణ్యంలో
  rationale: תֹהוּ లోని శూన్యత/నిర్జనతను, יְלֵל లోని అరుపు లేదా విలాప ధ్వనిని, יְשִׁמֹן లోని బీడు అరణ్య భావాన్ని చదవదగిన తెలుగు కావ్యపదబంధంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: יְסֹבְבֶנְהוּ
  choice: అతణ్ణి చుట్టుముట్టాడు
  rationale: סבב యొక్క స్పష్టమైన ‘చుట్టూ ఉండడం/చుట్టుముట్టడం’ అనే రూపకాన్ని నిలుపుతుంది; ‘రక్షించాడు’ అని ముందుగానే వ్యాఖ్యానించదు.
- source_word: יְבֹונְנֵהוּ
  choice: అతని పట్ల శ్రద్ధ చూపాడు
  rationale: בין/בונן క్రియలోని గ్రహించడం, జాగ్రత్తగా గమనించడం, అవగాహన కలిగించడం వంటి అర్థ పరిధిలో, ఇక్కడి సంరక్షణాత్మక క్రియల వరుసకు ‘శ్రద్ధ చూపాడు’ సహజంగా సరిపోతుంది. ఇతర సాధ్యార్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: יִצְּרֶנְהוּ
  choice: అతణ్ణి కాపాడాడు
  rationale: נצר లోని కాపాడడం, భద్రపరచడం అనే భావాన్ని నేరుగా తెలియజేస్తూ, తరువాతి కంటి రూపకంతో సహజంగా అనుసంధానమవుతుంది.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: తన కంటి కనుపాపలా
  rationale: אִישׁוֹן సూచించే కంటి మధ్య నల్లని భాగాన్ని ‘కనుపాప’ సహజంగా వ్యక్తం చేస్తుంది; అలాగే అత్యంత జాగ్రత్తగా కాపాడే తెలుగు రూపకాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: పుంలింగ ఏకవచన సర్వనామాల సూచితార్థం
  choice: ఇశ్రాయేలు/యాకోబును సమష్టిగా వ్యక్తీకరించే ఏకవచన రూపంగా ‘అతణ్ణి/అతని’ నిలుపబడింది.
  alternative: సమూహాన్ని స్పష్టంచేయడానికి ‘వారిని’ అని బహువచనంలో అనువదించడం.
  rationale: మూలపాఠం యాకోబు/ఇశ్రాయేలును పుంలింగ ఏకవచనంగా చిత్రిస్తుంది. బహువచనంగా మార్చకుండా కావ్య వ్యక్తీకరణను, సూచితార్థంలోని ఉద్రిక్తతను కాపాడుతుంది.
- issue: יְבֹונְנֵהוּ క్రియ యొక్క భావం
  choice: అతని పట్ల శ్రద్ధ చూపాడు
  alternative: అతనికి అవగాహన కలిగించాడు
  rationale: ఈ క్రియ ‘గ్రహించు/శ్రద్ధగా గమనించు’ లేదా ‘అవగాహన కలిగించు’ అనే భావాలను అనుమతిస్తుంది. చుట్టుముట్టడం, కాపాడడం అనే సమాంతర క్రియల మధ్య శ్రద్ధతో చూసుకోవడం సందర్భానికి సరిపోతుంది; జ్ఞానబోధ భావాన్ని మాత్రం పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కావ్యశైలిని ఉపయోగించాం. ‘అతణ్ణి’ అనే ఏకవచన రూపం మూలంలోని యాకోబు/ఇశ్రాయేలు సమష్టి వ్యక్తీకరణను నిలుపుతుంది. పాద విభజన హీబ్రూ కవిత్వంలోని చర్యల క్రమాన్ని స్పష్టంగా చూపిస్తుంది.
