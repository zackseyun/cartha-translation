id: DEU.32.6
reference: Deuteronomy 32:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: te
  text: మూర్ఖులూ, జ్ఞానం లేని ప్రజలారా, యెహోవాకు మీరు ఇలా ప్రతిఫలమిస్తారా? ఆయన మీ తండ్రి కాదా? ఆయనే మిమ్మల్ని సంపాదించుకున్నాడు[a]; ఆయనే మిమ్మల్ని చేశాడు, మిమ్మల్ని స్థిరపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిమ్మల్ని సృష్టించాడు,’ ‘మిమ్మల్ని కొనుగోలు చేశాడు,’ లేదా ‘మిమ్మల్ని తన సొంతం చేసుకున్నాడు.’ హీబ్రూ క్రియకు సంపాదించు, సొంతం చేసుకో, కొనుగోలు చేయు, కొన్ని సందర్భాల్లో సృష్టించు అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: ప్రతిఫలమిస్తారా
  rationale: గמל ఇక్కడ ఒకరు చేసినదానికి తిరిగి తగిన విధంగా వ్యవహరించడాన్ని సూచిస్తుంది. మందలింపుతో కూడిన ప్రశ్నలో ‘ప్రతిఫలమిస్తారా’ ఆ తిరిగి చెల్లించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: మూర్ఖులూ, జ్ఞానం లేని ప్రజలారా
  rationale: נָבָל కేవలం తెలివి కొరతనే కాక నైతిక అవివేకాన్ని కూడా సూచిస్తుంది; ‘మూర్ఖులు’ ఆ భావాన్ని నిలుపుతుంది. לֹא חָכָםను ‘జ్ఞానం లేని’ అని నేరుగా అనువదించి, సంబోధనను సహజమైన తెలుగు రూపంలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אָבִיךָ
  choice: మీ తండ్రి
  rationale: ఈ వాక్యం దేవునికి ఇశ్రాయేలుతో ఉన్న తండ్రి సంబంధాన్ని స్పష్టంగా చెబుతుంది. సమూహాన్ని ఉద్దేశించిన ఏకవచన హీబ్రూ రూపాన్ని సహజ తెలుగులో గౌరవ/బహువచన రూపంగా ఇచ్చాం.
- source_word: קָּנֶךָ
  choice: మిమ్మల్ని సంపాదించుకున్నాడు
  rationale: קנהకు సంపాదించు, సొంతం చేసుకో, కొనుగోలు చేయు, కొన్ని సందర్భాల్లో సృష్టించు అనే అర్థాలు ఉన్నాయి. వెంటనే వచ్చే ‘చేశాడు’, ‘స్థిరపరిచాడు’ అనే వేరు క్రియలతో ఉన్న భేదాన్ని కాపాడేందుకు ‘సంపాదించుకున్నాడు’ ఎంచుకున్నాం.
- source_word: עָשְׂךָ
  choice: మిమ్మల్ని చేశాడు
  rationale: עשה ఇక్కడ దేవుడు ఇశ్రాయేలును రూపొందించి ప్రజగా చేసిన కార్యాన్ని సూచిస్తుంది; ‘చేశాడు’ మూలానికి నేరమైన, సహజమైన రూపం.
- source_word: וַיְכֹנְנֶךָ
  choice: మిమ్మల్ని స్థిరపరిచాడు
  rationale: כון రూపం స్థాపించడం, దృఢపరచడం, స్థిరంగా నిలపడం అనే భావాన్ని ఇస్తుంది. ‘స్థిరపరిచాడు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు ఇశ్రాయేలును కנה చేసినట్లు చెప్పే పదం
  choice: మిమ్మల్ని సంపాదించుకున్నాడు
  alternative: మిమ్మల్ని సృష్టించాడు; మిమ్మల్ని కొనుగోలు చేశాడు; మిమ్మల్ని తన సొంతం చేసుకున్నాడు
  rationale: మూల క్రియకు సందర్భానుసారం అనేక అర్థాలు సాధ్యమైనవి. తరువాతి రెండు క్రియలు చేయడం, స్థిరపరచడం గురించి వేరుగా చెబుతున్నందున ప్రధాన పాఠ్యంలో ‘సంపాదించుకున్నాడు’ అని ఉంచి, నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో చూపించాం.
- issue: దేవుని తండ్రితనం
  choice: ఆయన మీ తండ్రి కాడా?
  alternative: ఆయన మీ తండ్రి కాదా?
  rationale: హీబ్రూ అలంకారప్రశ్న సమ్మతిని ఆశిస్తుంది. ‘కాడా?’ ఆధునిక ప్రామాణిక తెలుగులో వ్యక్తిని సూచించే సహజ ప్రశ్నారూపం; మూలంలోని సంబంధాత్మక, ఒడంబడిక నేపథ్యాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూలో సమూహమైన ఇశ్రాయేలును ఏకవచనంగా సంబోధించిన చోట తెలుగులో సహజమైన ‘మీరు/మిమ్మల్ని’ రూపాలు వాడాం. మందలింపు తీవ్రతను ‘మూర్ఖులూ, జ్ఞానం లేని ప్రజలారా’ అనే ప్రత్యక్ష సంబోధనలో నిలిపాం.
