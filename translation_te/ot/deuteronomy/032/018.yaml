source:
  edition: WLC
  text: צ֥וּר יְלָדְ/ךָ֖ תֶּ֑שִׁי וַ/תִּשְׁכַּ֖ח אֵ֥ל מְחֹלְלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: te
  text: నీకు జన్మనిచ్చిన శిలను[a] నీవు నిర్లక్ష్యం చేశావు[b]; నిన్ను ప్రసవించిన దేవుణ్ణి[c] మరచిపోయావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను కనిన శిలను.’ హీబ్రూ క్రియ జన్మనివ్వడం లేదా కనడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో తండ్రితన ఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిర్లక్ష్యం చేశావు’ అని అనువదించిన హీబ్రూ క్రియ అర్థం క్లిష్టమైనది; ‘మరచిపోయావు’ లేదా ‘పట్టించుకోలేదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నిన్ను పురిటివేదనతో కనిన దేవుణ్ణి.’ హీబ్రూలో ప్రసవ చిత్రణ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: బండ
  rationale: ఈ పదానికి అక్షరార్థం ‘బండ/శిల’; ద్వితీయోపదేశకాండలో ఇది ఇశ్రాయేలు దేవునికి ప్రత్యేక రూపక నామంగా వాడబడింది. ‘బండ’ మూల రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְלָדְךָ
  choice: నిన్ను కన్న
  rationale: ילד క్రియ కనడం లేదా తండ్రిగా పుట్టించడం అనే జనన భావాన్ని వ్యక్తం చేయగలదు. ‘నిన్ను కన్న’ అనే తెలుగు ప్రయోగం సహజంగా ఉండి, తండ్రి లేదా తల్లి సంబంధ జనన భావాన్ని ముందుగానే కుదించకుండా ఉంచుతుంది.
- source_word: תֶּשִׁי
  choice: నీవు నిర్లక్ష్యం చేశావు
  rationale: ఈ అరుదైన క్రియ అర్థం క్లిష్టమైనది. తరువాతి ‘మరచిపోయావు’తో ఉన్న సమాంతరతలో ఇది పట్టించుకోకపోవడం లేదా అలక్ష్యం చేయడం అనే నిందారోపణను సూచిస్తుంది; ‘నిర్లక్ష్యం చేశావు’ ఆ భావాన్ని పునరుక్తి లేకుండా తెలియజేస్తుంది.
- source_word: וַתִּשְׁכַּח
  choice: మరచిపోయావు
  rationale: ఈ సాధారణ క్రియ ఇక్కడ ముందున్న నిందను కొనసాగిస్తూ ‘మరచిపోవడం’ అనే అర్థాన్నే ఇస్తుంది.
- source_word: אֵל
  choice: దేవుణ్ణి
  rationale: ఈ సందర్భంలో אֵל ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది. తెలుగులో ‘దేవుణ్ణి’ సహజమైన, స్పష్టమైన అనువాదం.
- source_word: מְחֹלְלֶךָ
  choice: నిన్ను ప్రసవించిన
  rationale: חול మూలానికి చెందిన ఈ రూపం ప్రసవవేదన పడడం, పుట్టించడం అనే జనన చిత్రాన్ని సూచిస్తుంది. ‘ప్రసవించిన’ అనే పదం మూలంలోని బలమైన మాతృసంబంధ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి సంబంధించిన తల్లిదండ్రుల జనన రూపకాలు
  choice: ‘నిన్ను కన్న బండ’ మరియు ‘నిన్ను ప్రసవించిన దేవుడు’ అనే రెండు జనన రూపకాలనూ ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘నిన్ను చేసినవాడు’ లేదా ‘నిన్ను నిర్మించినవాడు’ వంటి సాధారణ సృష్టి భాషను వాడడం.
  rationale: హీబ్రూ పాఠ్యం ילד అనే కనడం/తండ్రిగా పుట్టించడం భావాన్నీ, ప్రసవ భావం గల מחללך అనే పదాన్నీ పక్కపక్కన ఉంచుతుంది. సాధారణ సృష్టి పదాలతో ఈ ఉద్వేగాన్ని తొలగించకుండా మూల చిత్రణను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను కాపాడుతూ సాధారణ పాఠకుడికి అర్థమయ్యే గంభీర శైలిని వాడాం. ‘బండ’ అనే స్పష్టమైన రూపకాన్నీ, ‘కన్న/ప్రసవించిన’ అనే ఉద్దేశపూర్వక జనన చిత్రణనూ మృదువుచేయకుండా నిలిపాం.
