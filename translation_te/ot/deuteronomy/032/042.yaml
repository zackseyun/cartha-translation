base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: te
  text: 'నా బాణాలను రక్తంతో మత్తెక్కిస్తాను;

    నా ఖడ్గం మాంసాన్ని మింగివేస్తుంది—

    హతుల, బందీల రక్తంతో,

    శత్రువుల విరబోసిన జుట్టుగల తలల నుండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం క్లిష్టమైనది; దీనిని “శత్రు నాయకుల తలల నుండి” లేదా “శత్రువుల దీర్ఘకేశ యోధుల నుండి” అని కూడా అనువదించవచ్చు. ముఖ్యంగా פַּרְעוֹת అనే అరుదైన పదం అర్థం వివాదాస్పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: మత్తెక్కిస్తాను
  rationale: שׁכר హిఫీల్ రూపానికి అక్షరార్థంగా ‘మత్తెక్కించు’ అనే భావం ఉంది. బాణాలు రక్తంతో పూర్తిగా తడిసిపోవడాన్ని తెలిపే సజీవమైన యుద్ధకావ్య రూపకాన్ని నిలుపుతుంది.
- source_word: חִצַּי
  choice: నా బాణాలను
  rationale: חֵץ బహువచనానికి సహజమైన, ప్రామాణిక తెలుగు సమానం; మొదటి పురుష ఏకవచన స్వామ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִדָּם
  choice: రక్తంతో
  rationale: ‘మత్తెక్కించు’ తరువాత מן కారణం లేదా నింపబడిన పదార్థాన్ని సూచిస్తుంది; తెలుగులో ‘రక్తంతో’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וְחַרְבִּי
  choice: నా ఖడ్గం
  rationale: కావ్యోచితమైనప్పటికీ సాధారణంగా అర్థమయ్యే పదం; మూలంలోని స్వామ్య నిర్మాణాన్ని కాపాడుతుంది.
- source_word: תֹּאכַל בָּשָׂר
  choice: మాంసాన్ని మింగివేస్తుంది
  rationale: అక్షరార్థమైన ‘మాంసాన్ని తింటుంది’ అనే రూపకంలోని హింసాత్మక తీవ్రతను సహజ తెలుగులో ‘మింగివేస్తుంది’ వ్యక్తం చేస్తుంది.
- source_word: מִדַּם חָלָל וְשִׁבְיָה
  choice: హతుల, బందీల రక్తంతో
  rationale: חָלָל యుద్ధంలో హతులైనవారిని సూచిస్తుంది; שִׁבְיָה ఇక్కడ వ్యక్తుల సమూహార్థంలో ‘బందీలు’గా గ్రహించబడింది. ఒకే ‘రక్తంతో’ రెండింటికీ వర్తించేలా తెలుగు నిర్మాణం ఉంచబడింది.
- source_word: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: శత్రువుల విరబోసిన జుట్టుగల తలల నుండి
  rationale: అరుదైన פַּרְעוֹת పదాన్ని నాయకులు అని వ్యాఖ్యానాత్మకంగా నిర్ణయించకుండా, פרע మూలంతో సంబంధమున్న ‘విరబోసిన జుట్టు’ అనే స్పష్టమైన దృశ్యాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. వాక్యభాగపు అనిశ్చితికి పాదసూచిక ఇవ్వబడింది.
theological_decisions:
- issue: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב అనే క్లిష్టమైన పదబంధం
  choice: శత్రువుల విరబోసిన జుట్టుగల తలల నుండి
  alternative: శత్రు నాయకుల తలల నుండి; శత్రువుల దీర్ఘకేశ యోధుల నుండి
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కంటే పదార్థ-వాక్యనిర్మాణ సమస్య. అరుదైన פַּרְעוֹתను ‘నాయకులు’గా అర్థవిస్తరణ చేయడం కన్నా, సాధ్యమైన శారీరక దృశ్యాన్ని ప్రధాన పాఠ్యంలో ఉంచి ఇతర పఠనాలను పాదసూచికలో భద్రపరచడం మూలంలోని అస్పష్టతను నిజాయితీగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన యుద్ధకావ్య ధోరణి నిలుపబడింది. ‘మత్తెక్కిస్తాను,’ ‘మింగివేస్తుంది’ అనే వ్యక్తీకరణలు మూలంలోని సమాంతర సజీవ రూపకాలను కాపాడుతాయి; అరుదైన చివరి పదబంధంలోని అనిశ్చితి పాదసూచికలో స్పష్టంగా నమోదు చేయబడింది.
