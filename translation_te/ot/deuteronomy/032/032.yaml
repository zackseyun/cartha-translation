  rationale: మూలంలో లేని, పరస్పరం భిన్నమైన “వచ్చింది/మొలిచింది” క్రియలను తొలగించి, హీబ్రూ కవిత్వంలోని సమాంతర నామవాచక నిర్మాణాన్ని పునరుద్ధరించాం. “గెలలు” స్థానంలో స్పష్టమైన ఆధునిక పదమైన “ద్రాక్షగుత్తులు” వాడాం. మిగిలిన రూపకం, విషపు ఫలాల భావం, మరియు “వారికి” అనే లָמוֹ సూచన యథాతథంగా ఉంచబడ్డాయి.
