    rationale: హీబ్రూ పాఠంలో ఈ రెండు పాదాలు క్రియలేని సమాంతర నామవాచక నిర్మాణాలు. “వచ్చింది” కంటే “మొలిచింది” వేరే చిత్రాన్ని ప్రవేశపెడుతుంది; అందువల్ల మూల సమాంతరతకు మించి వివరణ జతవుతుంది.
