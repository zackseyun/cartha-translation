language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי מִ/גֶּ֤פֶן סְדֹם֙ גַּפְנָ֔/ם וּ/מִ/שַּׁדְמֹ֖ת עֲמֹרָ֑ה עֲנָבֵ֨/מוֹ֙ עִנְּבֵי ר֔וֹשׁ אַשְׁכְּלֹ֥ת מְרֹרֹ֖ת לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: te
  text: 'ఎందుకంటే వారి ద్రాక్షతీగ సొదొమ ద్రాక్షతీగనుండిది,

    గొమొర్రా పొలాలనుండిది;

    వారి ద్రాక్షపండ్లు విషపు ద్రాక్షపండ్లు,

    వారి ద్రాక్షగుత్తులు వారికి చేదుగా ఉన్నాయి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: ద్రాక్షతీగ / వారి ద్రాక్షతీగ
  rationale: మూలంలోని ద్రాక్షతీగ రూపకాన్ని నేరుగా నిలుపుతూ సహజమైన ఆధునిక తెలుగు వాడబడింది.
- source_word: שַּׁדְמֹת
  choice: పొలాలు
  rationale: సాగుచేసే భూములు లేదా పొలాలు అనే భావంలో, సందర్భానికి సరళమైన సాధారణ పదం ఎంచుకోబడింది.
- source_word: רֹאשׁ
  choice: విషం
  rationale: ఈ పదం సందర్భానుసారం విషపూరితమైన లేదా చేదైన మొక్కను, దాని విషాన్ని సూచించగలదు; ఫలాల హానికర స్వభావాన్ని తెలిపే 'విషం' భావం ఇక్కడ అనుకూలం.
- source_word: אַשְׁכְּלֹת
  choice: గెలలు
  rationale: ద్రాక్షపండ్ల గుత్తులను సూచించే సహజమైన తెలుగు పదం.
- source_word: מְרֹרֹת לָמוֹ
  choice: వారికి చేదుగా ఉన్నాయి
  rationale: לָמוֹ అనే 'వారికి' భావాన్ని విడిచిపెట్టకుండా, మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: సొదొమ, గొమొర్రా మూలంగా చెప్పబడిన ద్రాక్షతీగ రూపకం
  choice: రూపకాన్ని వివరణ లేకుండా యథాతథంగా ఉంచడం
  alternative: వారి దుష్టత్వం సొదొమ, గొమొర్రాల వంటిదని భావానువాదం చేయడం
  rationale: మూలపాఠంలోని కవితాత్మక రూపకాన్నీ దాని తీర్పు సంబంధమైన ఉద్వేగాన్నీ పాఠకుడే గ్రహించేలా కాపాడుతుంది.
- issue: לָמוֹ యొక్క సంబంధం
  choice: '''వారికి చేదుగా ఉన్నాయి'' అని అనువదించడం'
  alternative: '''చేదుగా ఉన్నాయి'' అని మాత్రమే అనువదించడం'
  rationale: హీబ్రూ పాఠంలో స్పష్టంగా ఉన్న పరోక్ష కర్మను నిలుపుతూ, చేదుతనం వారికి చెందుతుందా లేదా వారి అనుభవాన్ని సూచిస్తుందా అనే స్వల్ప భావవ్యాప్తిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతర నిర్మాణాన్ని నాలుగు పాదాలుగా నిలిపిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. మూలంలోని 'ఎందుకంటే' అనుసంధానం మరియు 'వారికి' అనే అంశం రెండూ ఉంచబడ్డాయి.
