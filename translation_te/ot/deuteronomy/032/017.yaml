  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: te
  text: 'వారు దయ్యాలకు[a]—దేవునికి కాదు—

    వారికి తెలియని దేవతలకు,

    కొత్తవిగా ఇటీవలి కాలంలో వచ్చినవాటికి[b],

    మీ పితరులు భయపడనివాటికి[c]

    బలులు అర్పించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవతలు కానివారికి.’ హెబ్రూలో ఈ జీవులు నిజంగా దేవతలు కాదనే భావం ఉండవచ్చు; అయితే సందర్భంలో వారిని ఇశ్రాయేలు దేవునితో వ్యతిరేకంగా నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కొత్తవి; సమీపం నుండి వచ్చాయి.’ ఇక్కడ భావం కొత్తగా వచ్చిన లేదా ఇటీవలే పరిచయమైన దేవతలు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మీ పితరులు వాటి ఎదుట వణకనివాటికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: బలులు అర్పించారు
  rationale: זבח బలిగా వధించడం లేదా బలి అర్పించడం అనే ఆరాధనా భావాన్ని కలిగి ఉంది. సందర్భంలోని గత కార్యాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘బలులు అర్పించారు’ అని అనువదించాం.
- source_word: לַשֵּׁדִים
  choice: దయ్యాలకు
  rationale: שֵׁדִים దేవునికి విరోధమైన అతీంద్రియ జీవులను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘దయ్యాలు’ అర్థవంతమైన సమానార్థకం.
- source_word: לֹא אֱלֹהַ
  choice: దేవునికి కాదు
  rationale: ఈ పదబంధం బలులు అందుకున్న జీవులను ఇశ్రాయేలు నిజ దేవునితో వ్యతిరేకంగా నిలుపుతుంది. ‘దేవునికి కాదు’ ఆ వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది; హెబ్రూలోని ‘దేవుడు కాదు/ఒక దేవత కాదు’ అనే నిరాకరణ ఛాయను పాదసూచిక వివరిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవతలకు
  rationale: ఇక్కడ బహువచన రూపం బలులు అందుకున్న అబద్ధ దేవతలను సూచిస్తుంది. ‘దయ్యాలు’ అనే ముందరి పదాన్ని తొలగించకుండా రెండింటినీ వరుసగా నిలిపాం.
- source_word: לֹא יְדָעוּם
  choice: తమకు తెలియని
  rationale: ידע ఇక్కడ ‘తెలుసుకోవడం’ అనే సాధారణ భావంలో ఉంది. కర్తతో సంబంధాన్ని తెలుగులో సహజంగా చూపడానికి ‘తమకు’ వాడాం.
- source_word: חֲדָשִׁים
  choice: కొత్తగా
  rationale: విశేషణం ఇక్కడ ముందున్న దేవతలను సూచిస్తుంది. ‘కొత్తగా’ తరువాతి ‘వచ్చినవాటికి’తో కలసి సహజమైన తెలుగు పదబంధంగా ఉంటుంది.
- source_word: מִקָּרֹב בָּאוּ
  choice: ఇటీవలే వచ్చినవాటికి
  rationale: ఈ సందర్భంలో పదబంధం స్థలపరమైన సమీపతకన్నా ఇటీవలి రాకను సూచిస్తుంది. ‘ఇటీవలే వచ్చినవి’ ఆ కాలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא שְׂעָרוּם
  choice: భయపడనివాటికి
  rationale: అరుదైన שער రూపం ఇక్కడ భయపడడం లేదా వణకడం అనే భావాన్ని ఇస్తుంది. ‘భయపడని’ సహజమైన ప్రధాన అనువాదం; ‘వణకని’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲבֹתֵיכֶם
  choice: మీ పితరులు
  rationale: హెబ్రూ పదం స్పష్టంగా పూర్వపు తండ్రులను సూచించే పుంలింగ బహువచనం. ‘మీ పితరులు’ దాని రూపాన్నీ గంభీర కవితా శైలినీ కాపాడుతుంది.
theological_decisions:
- issue: ‘దయ్యాలు’ మరియు ‘దేవతలు’ మధ్య సంబంధం
  choice: రెండు పదాలనూ ఉంచి, ‘దయ్యాలకు… తమకు తెలియని దేవతలకు’ అని వరుసగా అనువదించడం
  alternative: ‘దేవతలు’ వివరణార్థక పునరుక్తి అని భావించి తెలుగులో ఒక పదాన్ని వదలడం
  rationale: హెబ్రూ వాక్యం బలి గ్రహీతలను שֵׁדִים అనీ אֱלֹהִים అనీ పేర్కొంటూనే వారు దేవుడు కాదని నిరాకరిస్తుంది. రెండింటినీ ఉంచడం ఆ వాక్యంలోని ఉద్దేశపూర్వకమైన ధార్మిక ఉద్రిక్తతను కాపాడుతుంది.
- issue: לֹא אֱלֹהַ ద్వారా నిజ దేవునితో చేసే వ్యత్యాసం
  choice: ‘దేవునికి కాదు’ అని అనువదించడం
  alternative: ‘ఒక దేవతకు కాదు’ లేదా ‘దేవతలు కానివాటికి’
  rationale: సందర్భం ఇశ్రాయేలు దేవునికీ అబద్ధ ఆరాధనకు గురైన జీవులకీ మధ్య వ్యత్యాసం చూపుతుంది. ప్రధాన పాఠంలో ‘దేవునికి కాదు’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది; హెబ్రూ నిరాకరణకు ఉన్న మరో పఠనాన్ని పాదసూచికలో నిలిపాం.
- issue: పితరుల స్పందనను సూచించే שער పదం
  choice: ‘భయపడని’
  alternative: ‘వణకని’
  rationale: ఈ పదం భయం, దిగులు లేదా వణుకు భావాన్ని కలిగించవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘భయపడని’ వాడి, మరింత దృశ్యాత్మకమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా అమరికను వాడాం. ఒకే క్రియ వరుసలోని బలి గ్రహీతలందరికీ వర్తించేలా చివర ఉంచాం. ‘పితరులు’ మూలంలోని పుంలింగ రూపాన్నీ వచనంలోని చారిత్రక-కవితా ధ్వనినీ కాపాడుతుంది.
