  to: 'ఎందుకంటే నా కోపంలో అగ్ని రగులుకుంది;

    అది షెయోల్ అట్టడుగువరకు[a] మండుతుంది.

    అది భూమినీ దాని దిగుబడినీ మింగివేస్తుంది;

