id: DEU.32.22
reference: Deuteronomy 32:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: te
  text: 'ఎందుకంటే నా కోపంలో అగ్ని రగులుకుంది;

    అది షెయోల్ అట్టడుగువరకు[a] మండుతుంది.

    అది భూమినీ దాని దిగుబడినీ మింగివేస్తుంది;

    పర్వతాల పునాదులకు నిప్పంటిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో అనువాదం: “షెయోల్ లోతుల వరకు” లేదా “సమాధి అగాధాల వరకు.” హీబ్రూలో “అట్టడుగు/అత్యంత లోతైన షెయోల్ వరకు” అని ఉంది. ‘షెయోల్’ మృతుల లోకాన్ని సూచించే హీబ్రూ పదం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న తీర్పు ప్రకటనకు కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֵשׁ קָדְחָה
  choice: అగ్ని రగులుకుంది
  rationale: అగ్ని ప్రజ్వలించి మండడం మొదలైన భావాన్ని సహజంగా, క్రియాశీల దృశ్యంతో వ్యక్తం చేస్తుంది.
- source_word: בְאַפִּי
  choice: నా కోపంలో
  rationale: אַף అనే పదానికి అక్షరార్థంగా ‘ముక్కు/నాసిక’ ఉన్నా, ఇక్కడ అది కోపాన్ని సూచించే హీబ్రూ నుడికారం; ‘నా కోపంలో’ మూలంలోని ఉపసర్గ సంబంధాన్ని కూడా సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וַתִּיקַד
  choice: అది … మండుతుంది
  rationale: అగ్ని నిరంతరం మండుతూ ఎంత లోతుకు చేరుతుందో తెలిపే కవితాత్మక చిత్రాన్ని స్పష్టంగా కొనసాగిస్తుంది.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: షెయోల్ లోతుల వరకు
  rationale: שְׁאוֹל పదాన్ని తరువాతి కాలపు సిద్ధాంత పదంతో సమానం చేయకుండా లిప్యంతరీకరిస్తూ, תַּחְתִּית తెలిపే అట్టడుగు/అగాధ భావాన్ని ‘లోతులు’ ద్వారా సహజంగా అందిస్తుంది.
- source_word: וַתֹּאכַל
  choice: మింగివేస్తుంది
  rationale: అగ్ని ‘తినివేయడం’ అనే మూలంలోని సజీవ రూపకాన్ని తెలుగులో బలంగా నిలుపుతుంది.
- source_word: אֶרֶץ
  choice: భూమి
  rationale: షెయోల్, పర్వతాల పునాదులు వంటి విశ్వవ్యాప్త కవితా చిత్రాల మధ్య విస్తృతమైన ‘భూమి’ భావం సందర్భానికి సరిపోతుంది; స్థానిక ‘దేశం’గా పరిమితం చేయదు.
- source_word: יְבֻלָהּ
  choice: దాని దిగుబడి
  rationale: భూమి పండించే సమస్త ఫలసాయాన్ని సూచించే విస్తృతమైన, ఆధునిక తెలుగు పదప్రయోగం.
- source_word: וַתְּלַהֵט
  choice: నిప్పంటిస్తుంది
  rationale: కేవలం కాల్చడం కంటే అగ్ని అంటించి మండించే causative తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מוֹסְדֵי הָרִים
  choice: పర్వతాల పునాదులు
  rationale: పర్వతాల అత్యంత లోతైన ఆధారభాగాలను సూచించే మూలంలోని స్పష్టమైన కవితా చిత్రాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: שְׁאוֹל పదానువాదం
  choice: షెయోల్
  alternative: సమాధి / మృతుల లోకం / నరకం
  rationale: ఈ హీబ్రూ పదం మృతుల లోకాన్ని సూచిస్తుంది; దానిని ‘నరకం’గా అనువదిస్తే తరువాతి సిద్ధాంత భావాన్ని ముందుగానే పాఠ్యంలోకి తెచ్చినట్లవుతుంది. ‘షెయోల్’ అని ఉంచడం పాత నిబంధన భావప్రపంచాన్నీ, పదంలోని విస్తృతతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా లయను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. అగ్ని ‘మింగివేయడం,’ పర్వతాల ‘పునాదులు’ వంటి మూలంలోని రూపకాలు సరళీకరించకుండా కాపాడబడ్డాయి.
