  edition: WLC
  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: te
  text: ఆయన దేశంలోని ఉన్నత ప్రాంతాలపై అతనిని ఎక్కించాడు[a]; అతడు పొలపు పంటఫలాన్ని తిన్నాడు[b]. ఆయన అతనితో బండనుండి తేనెను, చెకుముకి రాతిబండనుండి నూనెను చీకేలా చేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి ఉన్నత స్థలాలపై.” ఇక్కడ ఈ మాట ఆరాధనా ఉన్నత స్థలాలకన్నా ఎత్తైన, ఫలవంతమైన భూభాగాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పొలపు దిగుబడిని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “బండనుండి వచ్చిన తేనెతో అతన్ని పోషించాడు.” హెబ్రీ క్రియ అక్షరార్థంగా “అతనితో చీకేలా చేశాడు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: అతన్ని ... స్వారీ చేయించాడు
  rationale: רכב హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే ప్రయోగం.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: దేశంలోని ఉన్నత ప్రదేశాల మీద
  rationale: במות అనే పదంలోని భౌగోళిక ‘ఎత్తులు/ఉన్నత ప్రదేశాలు’ అనే భావాన్ని ఇస్తుంది; ఆరాధనా ఉన్నత స్థలాలు అనే అనవసర సూచనను నివారిస్తుంది.
- source_word: וַיֹּאכַל
  choice: అతడు ... తిన్నాడు
  rationale: אכל యొక్క సరళమైన, స్పష్టమైన అర్థాన్ని మరియు కవితాత్మక దృశ్యాన్ని నిలుపుతుంది.
- source_word: תְּנוּבֹת שָׂדָי
  choice: పొలపు దిగుబడిని
  rationale: תנובות యొక్క పంటఫలం/దిగుబడి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హెబ్రీ ఏకవచన సమాహారార్థాన్ని నిలుపుతుంది.
- source_word: וַיֵּנִקֵהוּ
  choice: అతనికి ... చీకించాడు
  rationale: ינק హిఫీల్‌లోని ‘చీకేలా చేయడం’ అనే కారణార్థాన్నీ, అసాధ్యంగా కనిపించే మూలాలనుండి పోషణ పొందే సజీవ రూపకాన్నీ కాపాడుతుంది.
- source_word: דְבַשׁ
  choice: తేనెను
  rationale: సాధారణ ప్రత్యక్ష అర్థం; సమృద్ధిగల పోషణను సూచించే కవితాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: מִסֶּלַע
  choice: బండనుండి
  rationale: סלע లోని బండ/శిల భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְשֶׁמֶן
  choice: నూనెను
  rationale: మూలంలో ఒలీవ నూనె అని ప్రత్యేకంగా లేకపోవడంతో సాధారణ ‘నూనె’ అనే అర్థాన్నే ఉంచుతుంది.
- source_word: מֵחַלְמִישׁ צוּר
  choice: చెకుముకి రాతిబండనుండి
  rationale: חלמיש లోని చెకుముకిరాయి భావాన్నీ, צור లోని రాతిబండ భావాన్నీ నిలుపుతూ కఠినమైన రాతినుండే సమృద్ధి రావడం అనే కవితాత్మక వైరుధ్యాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వచనమంతటా ఉన్న మూడవ పురుష ఏకవచన సర్వనామాల నిర్దేశ్యం
  choice: మూలంలోని ‘ఆయన/అతడు/అతన్ని’ అనే సర్వనామాలను ప్రధాన పాఠ్యంలో అలాగే ఉంచడం
  alternative: కర్తను ‘యెహోవా’గా, కర్మను ‘ఇశ్రాయేలు’ లేదా ‘యాకోబు’గా స్పష్టంగా పేర్కొనడం
  rationale: సమీప సందర్భం నిర్దేశ్యాలను తెలియజేస్తుంది; అయితే ఈ వచనం స్వయంగా సర్వనామాలనే వాడుతుంది. వాటిని నిలుపడం హెబ్రీ వాక్యప్రవాహాన్ని గౌరవించి, వివరణను అనువాద పాఠ్యంలో చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితాత్మక శైలి. కారణార్థక క్రియలను స్పష్టంగా ఉంచి, మూలంలోని సర్వనామ సంబంధిత అస్పష్టతను నిలుపుకుంది. ‘ఉన్నత ప్రదేశాలు’ అనే పదబంధం భౌగోళిక భావాన్ని ముందుకు తెస్తుంది; ‘చీకించాడు’ మూలంలోని అసాధారణమైన పోషణ రూపకాన్ని కాపాడుతుంది.
