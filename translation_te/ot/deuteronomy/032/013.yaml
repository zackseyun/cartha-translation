revisions:
- from: ఆయన అతన్ని దేశంలోని ఉన్నత ప్రదేశాల మీద స్వారీ చేయించాడు[a]; అతడు పొలపు దిగుబడిని తిన్నాడు[b]. ఆయన అతనికి బండనుండి తేనెను, చెకుముకి రాతిబండనుండి నూనెను చీకించాడు[c].
