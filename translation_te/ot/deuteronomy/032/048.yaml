  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: te
  text: 'ఆ రోజునే యహ్వే[a] మోషేకు ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. ‘యెహోవా’ అనేది మరో రూపం.'
    reason: దైవనామానికి సాంప్రదాయ ప్రత్యామ్నాయ రూపాలను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దבר యొక్క ఈ కథన రూపం సంఘటనను ముందుకు తీసుకెళ్తూ దేవుడు మోషేతో మాటలాడినట్లు సూచిస్తుంది. తెలుగులో తరువాతి לֵאמֹרతో కలిసి వచ్చే ‘ఇలా చెప్పాడు’ సహజంగా ఉండి, మూలంలోని వాక్యప్రవేశ సూత్రాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: చతురక్షర దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో తెలుగులో సహజంగా ఉపయోగించే సంబంధవిభక్తి. హీబ్రూ אֶל సూచించే ప్రసంగ గ్రహీత మోషే అని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: అదే రోజున
  rationale: ఈ హీబ్రూ నుడికారం ఆ రోజు యొక్క ఖచ్చితత్వాన్ని, నొక్కిచెప్పడాన్ని సూచిస్తుంది; ‘అదే రోజున’ దానిని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; తరువాతి వచనంలో వచ్చే మాటలకు ద్విబిందువు సిద్ధం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఇవ్వడం మూలంలోని నామాన్ని కాపాడుతుంది; ఇతర సాంప్రదాయ రూపాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘మాట్లాడి—చెప్పుటకు’ అనే పునరుక్త సూత్రాన్ని యాంత్రికంగా కాకుండా ‘ఇలా చెప్పాడు’గా సమగ్రంగా అందించాం; కాలాన్ని నొక్కిచెప్పే నుడికారాన్ని ‘అదే రోజున’గా నిలిపాం.
