revisions:
- from: ఎందుకంటే యాహ్వేకు చెందిన వంతు ఆయన ప్రజలు; యాకోబు ఆయన స్వాస్థ్యంగా దక్కిన భాగం[a].
  to: ఎందుకంటే యాహ్వే వంతు ఆయన ప్రజలు; యాకోబు ఆయన స్వాస్థ్యపు వాటా[a].
  rationale: The revision removes the added ‘dakkina’ (received/came to) sense, makes the inheritance construction more faithful to the Hebrew, and sharpens the footnote’s literal alternative. It retains the source’s ambiguity concerning whether חֶבֶל is heard chiefly as a measuring line or, metaphorically, an allotted share.
  reviewer_model: gpt-5.6-terra
