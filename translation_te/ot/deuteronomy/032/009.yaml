  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే వంతు ఆయన ప్రజలు; యాకోబు ఆయన స్వాస్థ్యపు వాటా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన స్వాస్థ్యపు కొలత తాడు’; లేదా, ‘ఆయన స్వాస్థ్యపు కేటాయించిన వాటా.’ హీబ్రూ חֶבֶל అనే పదం అక్షరార్థంగా కొలత తాడును, విస్తృతార్థంగా కొలిచి కేటాయించిన భాగాన్ని లేదా వాటాను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֵלֶק
  choice: వంతు
  rationale: ఎవరికైనా కేటాయించబడిన భాగం లేదా వాటా అనే భావాన్ని తెలియజేస్తూ, ఈ వాక్యంలోని పంపకం–స్వాస్థ్య రూపకానికి సరిపోతుంది.
- source_word: יְהֹוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలపాఠంలోని దేవుని ఒడంబడిక నామాన్ని వ్యక్తిగత నామంగానే నిలుపుతుంది.
- source_word: עַמּוֹ
  choice: ఆయన ప్రజలు
  rationale: ఒడంబడిక సంబంధాన్ని సూచించే עַם పదానికి ‘ప్రజలు’ సహజమైన, సందర్భోచితమైన తెలుగు రూపం.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: మూలపాఠంలోని పితృపురుషుని పేరును అలాగే ఉంచి, ఇశ్రాయేలును సూచించే కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: חֶבֶל
  choice: దక్కిన భాగం
  rationale: ఈ పదానికి అక్షరార్థంగా ‘కొలత తాడు’ అనే భావమున్నా, విస్తృతార్థంలో కొలిచి కేటాయించబడిన వాటాను సూచిస్తుంది; ప్రధాన పాఠంలో సహజమైన తెలుగుతో ఆ భావాన్ని అందించి, అక్షర రూపకాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נַחֲלָתוֹ
  choice: ఆయన స్వాస్థ్యం
  rationale: వారసత్వంగా లేదా శాశ్వత స్వాధీనంగా దక్కిన ఆస్తి అనే నామవాచక భావాన్ని ‘స్వాస్థ్యం’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, దేవుని ప్రత్యేక ఒడంబడిక నామంగా లిప్యంతరీకరించాం.
- issue: יַעֲקֹב ను వివరణాత్మకంగా ‘ఇశ్రాయేలు’ అని మార్చాలా
  choice: యాకోబు
  alternative: ఇశ్రాయేలు
  rationale: ఇక్కడ మూలపాఠం ‘యాకోబు’ అనే పేరునే ఉపయోగిస్తుంది. అదే పేరును నిలుపడం కవితాత్మక సమాంతరతను కాపాడి, వివరణను పాఠంలోకి చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక సమాంతరతను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. ‘స్వాస్థ్యంగా దక్కిన భాగం’ సహజమైన తెలుగులో పంపకం భావాన్ని అందిస్తుంది; חֶבֶל పదంలోని కొలత తాడు రూపకాన్ని పాదటిప్పణిలో భద్రపరిచాం.
