id: DEU.32.44
reference: Deuteronomy 32:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: te
  text: అప్పుడు మోషే వచ్చి, నూను కుమారుడైన హోషేయ[a] సమక్షంలో, ఈ గీతంలోని మాటలన్నిటినీ ప్రజల వినికిడిలో పలికాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘హోషేయ’; ఇతర చోట్ల ఇతడు సాధారణంగా ‘యెహోషువ’ అని పిలువబడతాడు (సంఖ్యాకాండము 13:16 చూడండి).
    reason: మూలపాఠంలో ఉన్న ‘హోషేయ’ నామరూపాన్ని, ఇతర చోట్ల సాధారణంగా కనిపించే ‘యెహోషువ’ నామరూపం నుండి వేరుచేసి వివరిస్తుంది.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ ఇక్కడ కథన క్రమంలో ‘వచ్చాడు’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అసమాపక రూపమైన ‘వచ్చి’ వాడబడింది.
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: דבר పియేల్ రూపం సాధారణంగా ‘మాట్లాడు/పలుకు’ అని అర్థం. గీతంలోని మాటలను బహిరంగంగా ఉచ్చరించిన సందర్భానికి ‘పలికాడు’ సహజమైన, గౌరవప్రదమైన ఎంపిక.
- source_word: אֶת כָּל דִּבְרֵי
  choice: మాటలన్నిటినీ
  rationale: ‘అన్ని మాటలు’ అనే సమగ్రతను నిలుపుతూ, తెలుగు సహజ పదక్రమంలో ‘మాటలన్నిటినీ’గా అనువదించబడింది.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ఈ గీతంలోని
  rationale: שירהకు ఈ సందర్భంలో ‘గీతం’ సరైన అర్థం; ఇది ముందున్న మోషే గీతాన్ని సూచిస్తుంది. ‘ఈ గీతంలోని మాటలు’ అనే నిర్మాణం మూలంలోని సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאָזְנֵי הָעָם
  choice: ప్రజలు వినేటట్లు
  rationale: అక్షరార్థంగా ‘ప్రజల చెవుల్లో’ అయినా, ఇది బహిరంగంగా వారి వినికిడిలో పలకడాన్ని సూచించే హీబ్రూ నుడికారం. ‘ప్రజలు వినేటట్లు’ అనే తెలుగు రూపం ఆ మౌఖిక, బహిరంగ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הוּא וְהוֹשֵׁעַ
  choice: హోషేయతో కలిసి
  rationale: ‘అతడు మరియు హోషేయ’ అనే మూల నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మోషేతో హోషేయ కూడా ఈ కార్యంలో ఉన్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: וְהוֹשֵׁעַ
  choice: హోషేయ
  rationale: మూల హీబ్రూ పాఠంలో ఇక్కడ ప్రసిద్ధమైన ‘యెహోషువ’ రూపం కాకుండా הוֹשֵׁעַ (హోషేయ) ఉంది; అందువల్ల పేరును మూలంలో ఉన్నట్టే లిప్యంతరీకరించబడింది.
- source_word: בִּן נוּן
  choice: నూను కుమారుడైన
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషే సహచరుని పేరును ‘హోషేయ’గా ఇవ్వాలా, సుపరిచితమైన ‘యెహోషువ’గా ఇవ్వాలా
  choice: హోషేయ
  alternative: యెహోషువ
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం స్పష్టంగా הוֹשֵׁעַ అని ఉంది. కాబట్టి ఇతర చోట్ల సాధారణంగా కనిపించే పేరుతో సమన్వయపరచకుండా, మూలపాఠంలోని రూపాన్నే ప్రధాన వచనంలో ఉంచి, పాఠకునికి పాదటిప్పణిలో వివరణ ఇవ్వబడింది.
- issue: הוּא וְהוֹשֵׁעַ అనే నిర్మాణంలో హోషేయ పాత్రను ఎలా వ్యక్తం చేయాలి
  choice: ‘హోషేయతో కలిసి’ అని భాగస్వామ్యాన్ని నిలుపడం
  alternative: ‘అతనితో హోషేయ కూడా ఉన్నాడు’ అని కేవలం హాజరును సూచించడం
  rationale: మూల వాక్యంలో ‘అతడు మరియు హోషేయ’ అనేది పలికే క్రియతో అనుసంధానమై ఉంది. హోషేయ కేవలం అక్కడ ఉన్నాడని పరిమితం చేయకుండా, కార్యంలో అతని భాగస్వామ్యాన్ని తెలుగులో సహజంగా నిలుపడానికి ‘తో కలిసి’ వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బైబిలు కథన శైలి పాటించబడింది. ‘ప్రజలు వినేటట్లు’ అనే రూపం హీబ్రూ నుడికారాన్ని అక్షరానువాదం చేయకుండా దాని బహిరంగ పఠన భావాన్ని అందిస్తుంది. పాదటిప్పణి గుర్తు వివరణకు సంబంధించిన ‘హోషేయ’ పేరు వెంట ఉంచబడింది.
