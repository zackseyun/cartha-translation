revisions:
- from: అప్పుడు మోషే వచ్చి, నూను కుమారుడైన హోషేయ[a]తో కలిసి, ఈ గీతంలోని మాటలన్నిటినీ ప్రజలు వినేటట్లు పలికాడు.
  to: అప్పుడు మోషే వచ్చి, నూను కుమారుడైన హోషేయ[a] సమక్షంలో, ఈ గీతంలోని మాటలన్నిటినీ ప్రజల వినికిడిలో పలికాడు.
  rationale: సవరణ ‘ప్రజల వినికిడిలో’ ద్వారా హీబ్రూ నుడికారాన్ని మరింత సన్నిహితంగా ప్రతిబింబిస్తుంది. ‘హోషేయ సమక్షంలో’ అనే రూపం మూలంలోని ఏకవచన క్రియ మరియు చివరి నామసముచ్చయంలో ఉన్న సంబంధిత అస్పష్టతను కాపాడుతుంది; హోషేయ మోషేతో తప్పనిసరిగా సంయుక్తంగా పలికాడని అదనంగా నిర్ధారించదు. పేరు మరియు పాదటిప్పణి మూలపాఠానికి, ఇంగ్లీషు POB పరిశీలనా మార్గానికి అనుగుణంగా ఉన్నాయి.
