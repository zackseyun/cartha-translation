  terminology: “బోధ” appropriately renders לִקְחִי; “మాట” appropriately renders אִמְרָתִי. “లేత గడ్డి” is a defensible contextual rendering of דֶּשֶׁא, and “చిరుజల్లులు” preserves the debated light-rain sense of שְׂעִירִם. “విస్తారమైన వాన” conveys רְבִיבִים without forcing the stronger sense of a cloudburst.
  issues:
  - severity: low
    issue: “పచ్చని మొక్కలు” includes an unexpressed colour descriptor.
