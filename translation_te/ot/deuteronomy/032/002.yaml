source:
  edition: WLC
  text: יַעֲרֹ֤ף כַּ/מָּטָר֙ לִקְחִ֔/י תִּזַּ֥ל כַּ/טַּ֖ל אִמְרָתִ֑/י כִּ/שְׂעִירִ֣ם עֲלֵי דֶ֔שֶׁא וְ/כִ/רְבִיבִ֖ים עֲלֵי עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: te
  text: 'నా బోధ వానలా కురియుగాక[a];

    నా మాట మంచులా జాలువారుగాక;

    లేత గడ్డిమీద చిరుజల్లులా[b],

    మొక్కలమీద విస్తారమైన వానలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చినుకులుగా దిగుగాక.’ హీబ్రూ క్రియ బోధ వానవలె కిందికి దిగడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘చిరుజల్లులు’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; అది తేలికపాటి వానను లేదా వానచినుకులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: కురియుగాక
  rationale: వాన చినుకులుగా కిందికి దిగే కవితాత్మక చిత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆశీర్వాదాత్మక ఆకాంక్ష భావాన్ని కూడా నిలుపుతుంది.
- source_word: לִקְחִי
  choice: నా బోధ
  rationale: ఇక్కడ ఈ పదం నేర్చుకోవడాన్ని కాక, మోషే అందిస్తున్న బోధను లేదా ఉపదేశాన్ని సూచిస్తుంది. ‘నా బోధ’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: תִּזַּל
  choice: జాలువారుగాక
  rationale: చుక్కలుగా కారడం లేదా మెల్లగా ప్రవహించడం అనే భావాన్ని వ్యక్తపరుస్తూ, మంచుతో ఉన్న సున్నితమైన పోలికను నిలుపుతుంది.
- source_word: אִמְרָתִי
  choice: నా పలుకు
  rationale: ఒకే పదం కంటే పలికిన మాట లేదా వాక్కు అనే విస్తృత భావం ఇక్కడ తగినది; ‘నా బోధ’తో కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: שְׂעִירִם
  choice: చిరుజల్లులు
  rationale: ఇది అరుదైన, అర్థవివాదమున్న పదం. సందర్భంలో తేలికపాటి వాన లేదా వానచినుకులను సూచించే అవకాశాన్ని ‘చిరుజల్లులు’ సహజంగా తెలియజేస్తుంది.
- source_word: דֶשֶׁא
  choice: లేత గడ్డి
  rationale: తాజాగా మొలిచిన పచ్చిక లేదా సున్నితమైన కొత్త పెరుగుదల అనే భావాన్ని సూచిస్తుంది.
- source_word: רְבִיבִים
  choice: సమృద్ధిగా కురిసే వాన
  rationale: విస్తారంగా లేదా పుష్కలంగా కురిసే వానజల్లులను సూచిస్తుంది; అతిగా ఉద్ధృతమైన ‘కుండపోత’ అనే భావాన్ని రుద్దదు.
- source_word: עֵשֶׂב
  choice: పచ్చని మొక్కలు
  rationale: ఇది గడ్డికి మాత్రమే పరిమితం కాకుండా నేలపై పెరిగే మొక్కలు లేదా వృక్షసంపదను సూచిస్తుంది; ముందున్న דֶשֶׁאతో తేడాను తెలుగులో స్పష్టంగా ఉంచుతుంది.
