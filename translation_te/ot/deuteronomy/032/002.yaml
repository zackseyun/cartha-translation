translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక శైలి. మూలంలోని నాలుగు వర్ష–మంచు చిత్రాలు, సమాంతర నిర్మాణం, ఆకాంక్షార్థక స్వరం నిలుపబడ్డాయి.
