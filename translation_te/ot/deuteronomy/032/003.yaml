id: DEU.32.3
reference: Deuteronomy 32:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: te
  text: ఎందుకంటే నేను యాహ్వే[a] నామాన్ని ప్రకటిస్తాను; మన దేవునికి గొప్పతనాన్ని ఆపాదించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’ (יהוה); సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. ప్రత్యామ్నాయ లిప్యంతరీకరణ: ‘యెహోవా’.'
    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని, సంప్రదాయ అనువాదాన్ని, ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న పిలుపుకు కారణాన్ని తెలిపే అనుసంధాన పదంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שֵׁם
  choice: నామాన్ని
  rationale: దేవుని వెల్లడైన గుర్తింపును సూచించే మూలపదపు స్పష్టమైన అర్థాన్ని రూపాంతరం చేయకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది; దానిని బిరుదుతో భర్తీ చేయదు.
- source_word: אֶקְרָא
  choice: నేను ప్రకటిస్తాను
  rationale: ఈ గీతంలో దేవుని నామాన్ని బహిరంగంగా వెల్లడించే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָבוּ
  choice: కొనియాడండి
  rationale: బహువచన ఆజ్ఞను సహజమైన తెలుగు స్తుతి భాషలో వ్యక్తం చేస్తుంది; మనుషులు దేవునికి వాస్తవంగా గొప్పతనాన్ని ప్రసాదిస్తారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: גֹדֶל
  choice: గొప్పతనాన్ని
  rationale: మూల నామవాచకంలోని greatness భావానికి నేరమైన సమానార్థకం.
- source_word: לֵאלֹהֵינוּ
  choice: మన దేవుని
  rationale: మొదటి పురుష బహువచన సంబంధాన్ని నిలుపుతూ, 'కొనియాడండి' అనే తెలుగు క్రియకు సహజమైన కర్మ నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి బిరుదైన 'ప్రభువు'తో భర్తీ చేయకుండా దైవనామాన్నే ఉంచాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన 'యెహోవా' రూపాన్ని ప్రధాన పాఠంలో వాడి, మరొక లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. 'నామం' స్వల్పంగా గంభీరమైనదైనా సుపరిచితం; 'కొనియాడండి' హీబ్రూ ఆజ్ఞ యొక్క ఉద్దేశాన్ని సహజంగా అందిస్తుంది.
