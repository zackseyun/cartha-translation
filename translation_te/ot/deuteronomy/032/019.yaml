reference: Deuteronomy 32:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה וַ/יִּנְאָ֑ץ מִ/כַּ֥עַס בָּנָ֖י/ו וּ/בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: te
  text: యాహ్వే చూశాడు; తన కుమారులూ కుమార్తెలూ కలిగించిన కోపం వల్ల వారిని తిరస్కరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని తృణీకరించాడు” లేదా “వారిని చులకనగా చూశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ראה అనే సాధారణ క్రియార్థాన్ని సహజమైన తెలుగు కథన క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: וַיִּנְאָץ
  choice: వారిని తిరస్కరించాడు
  rationale: נאץ లోని నిరాకరణ, తృణీకార భావాలను అతిశయింపకుండా తెలియజేస్తుంది; హీబ్రూలో అంతర్నిహితమైన కర్మను సందర్భానుసారం ‘వారిని’ అని స్పష్టం చేసింది.
- source_word: מִכַּעַס
  choice: తనకు కోపం పుట్టించినందుకు
  rationale: כעס సూచించే రెచ్చగొట్టడం లేదా మనస్తాపం ద్వారా కలిగిన కోపాన్ని, מִן యొక్క కారణార్థంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: తన కుమారులు, కుమార్తెలు
  rationale: మూలంలో విడిగా పేర్కొన్న పురుష, స్త్రీ సంతాన పదాలను ‘పిల్లలు’ అని సాధారణీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: וַיִּנְאָץ యొక్క అంతర్నిహిత కర్మ
  choice: సందర్భంలోని ఇశ్రాయేలు ప్రజలను సూచిస్తూ ‘వారిని’ అని చేర్చడం
  alternative: కర్మను చెప్పకుండా ‘తిరస్కరించాడు’ అని మాత్రమే ఉంచడం
  rationale: తెలుగులో భావం పూర్తిగా, సహజంగా ఉండేందుకు కర్మ అవసరం; సందర్భం దాని సూచ్యాన్ని స్పష్టం చేస్తుంది.
- issue: దైవ అసంతృప్తి తీవ్రత
  choice: ‘తిరస్కరించాడు’ మరియు ‘కోపం పుట్టించినందుకు’
  alternative: ‘అసహ్యించుకున్నాడు’ లేదా ‘తృణీకరించాడు’
  rationale: నిబంధన అవిశ్వాసానికి దేవుని తీవ్రమైన ప్రతిస్పందనను నిలుపుతూ, మూలపదాన్ని అవసరానికి మించి తీవ్రతరం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన వాక్య నిర్మాణం. కారణ సంబంధాన్ని సహజంగా తెలియజేయడానికి రెండో భాగంలో ‘అలా చేశాడు’ చేర్చబడింది.
