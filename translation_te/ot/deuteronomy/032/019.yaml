    issue: The draft adds ‘అలా చేశాడు’ (‘he did so’).
    rationale: The Hebrew has no separate demonstrative action clause. Though the addition refers back to the rejection, it is unnecessary and slightly expands the wording.
  - severity: medium
    issue: The divine name is rendered ‘యెహోవా’ rather than ‘యాహ్వే.’
    rationale: The project audit trail specifies Yahweh as the chosen rendering of יהוה. ‘యాహ్వే’ is the corresponding Telugu form and avoids replacing that decision with the traditional Jehovah form.
