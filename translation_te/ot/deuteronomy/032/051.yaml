  rationale: మూలంలోని రెండు עַל אֲשֶׁר కారణవాచక ప్రయోగాలను ‘ఎందుకంటే’తో రెండుసార్లు చూపించాం. ‘మెరీబత్-కాదేషు’ స్థలనామాన్ని లిప్యంతరీకరించాం; దాని వివరణాత్మక ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం. ఇతర ప్రధాన పదాలను ముసాయిదాలోని సార్థకమైన ఆధునిక ప్రామాణిక తెలుగు రూపాల్లోనే ఉంచాం.
