  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: te
  text: ఎందుకంటే, సీను అరణ్యంలో మెరీబత్-కాదేషు జలాల వద్ద[b] మీరు ఇశ్రాయేలీయుల మధ్య[a] నాపట్ల విశ్వాసఘాతకంగా ప్రవర్తించారు; ఎందుకంటే, ఇశ్రాయేలీయుల మధ్య నన్ను పరిశుద్ధునిగా గౌరవించలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారుల మధ్య.’
    reason: lexical_alternative
  - marker: b
    text: ‘మెరీబత్-కాదేషు’ను ‘కాదేషు మెరీబా’ లేదా ‘కాదేషు వద్ద కలహ జలాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నన్ను పరిశుద్ధపరచలేదు’ లేదా ‘నా పరిశుద్ధతను నిలబెట్టలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: నా పట్ల నమ్మకద్రోహంగా ప్రవర్తించారు
  rationale: מעל అనే క్రియ విశ్వాసాన్ని భంగపరచే ద్రోహపూరిత చర్యను సూచిస్తుంది; בִּי ఇక్కడ ద్రోహానికి గురైన వ్యక్తిని సూచిస్తుంది. ఈ తెలుగు రూపం ఒడంబడిక సంబంధమైన నైతిక తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల మధ్య
  rationale: బְּתוֹךְకు ‘మధ్య’ సరిపోతుంది. בְּנֵי יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించే స్థిర జాతినామం; ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: కాదేషు మెరీబా జలాల దగ్గర
  rationale: ఈ పదబంధాన్ని సంఘటనతో ముడిపడిన స్థలనామంగా తీసుకుని మెరీబా అనే పేరును లిప్యంతరీకరించాం. מֵי అనే బహువచన/సమూహార్థ రూపానికి గౌరవప్రద బైబిలు శైలిలో ‘జలాలు’ వాడాం.
- source_word: מִדְבַּר צִן
  choice: సీను అరణ్యంలో
  rationale: מִדְבָּרకు ‘అరణ్యం’ సహజమైన భౌగోళిక పదం; צִןను తెలుగు ఉచ్చారణకు అనుగుణంగా ‘సీను’గా లిప్యంతరీకరించాం.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: నన్ను పరిశుద్ధునిగా గౌరవించలేదు
  rationale: קדשׁ పియేల్ రూపం ఇక్కడ దేవుణ్ణి పరిశుద్ధునిగా ఎంచి, ప్రజల ఎదుట ఆయన పరిశుద్ధతకు తగిన గౌరవం ఇవ్వడాన్ని సూచిస్తుంది. ఈ రూపం దేవుణ్ణి పరిశుద్ధుడిగా ‘చేయడం’ అనే అపార్థాన్ని నివారిస్తూ ప్రజల మధ్య జరిగిన వైఫల్యాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతినామం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: అక్షరార్థ రూపం లింగసూచకమైనదైనా, సందర్భంలో ఇది స్త్రీపురుషులందరినీ కలిపిన ప్రజాసమూహానికి స్థిర జాతినామం. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు రూపాన్ని వాడి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- issue: కִדַּשְׁתֶּם אֹתִי యొక్క భావం
  choice: నన్ను పరిశుద్ధునిగా గౌరవించలేదు
  alternative: నన్ను పరిశుద్ధపరచలేదు
  rationale: సందర్భం దేవునిలో పరిశుద్ధత లోపించిందని కాదు; మోషే, అహరోనులు ప్రజల ఎదుట ఆయన పరిశుద్ధతను తగిన విధంగా ప్రకటించి గౌరవించలేదని చెబుతుంది. ఎంపిక చేసిన రూపం ఈ బహిరంగ, సంబంధాత్మక భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు ఆరోపణలు అర్ధవిరామంతో వేరు చేసి, వాటి మధ్య ఉన్న వివరణాత్మక సంబంధాన్ని నిలిపాం. ‘ఇశ్రాయేలీయులు’ సాధారణ పాఠకులకు సహజంగా ఉండగా, మూలంలోని ‘కుమారులు’ అనే రూపం పాదసూచికలో భద్రపరచబడింది.
