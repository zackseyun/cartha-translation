- from: ఎందుకంటే, సీను అరణ్యంలో కాదేషు మెరీబా జలాల దగ్గర[b] మీరు ఇశ్రాయేలీయుల మధ్య[a] నా పట్ల నమ్మకద్రోహంగా ప్రవర్తించారు; ఇశ్రాయేలీయుల మధ్య నన్ను పరిశుద్ధునిగా గౌరవించలేదు[c].
