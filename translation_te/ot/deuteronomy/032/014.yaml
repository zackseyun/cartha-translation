- from: గోమందం నుంచి పెరుగు, గొర్రెమేకల మంద నుంచి పాలు, గొర్రెపిల్లల కొవ్వు, బాషానులో పెరిగిన పొట్టేళ్ల కొవ్వు, మేకపోతుల కొవ్వు, శ్రేష్ఠమైన గోధుమలు[a] ఆయన నీకు ఇచ్చాడు; ద్రాక్షల రక్తమైన నురుగెత్తే ద్రాక్షారసాన్ని[b] నీవు తాగావు.
  to: గోమందం నుంచి పెరుగు, గొర్రెమేకల మంద నుంచి పాలు, గొర్రెపిల్లల కొవ్వుతో, బాషాను ప్రాంతపు పొట్టేళ్ల కొవ్వుతో, మేకపోతుల కొవ్వుతో, శ్రేష్ఠమైన గోధుమలతో[a]; ద్రాక్షరక్తమైన నురుగెత్తే ద్రాక్షామద్యాన్ని[b] నీవు తాగావు.
  rationale: The revision removes an unstated giving action and agent, allowing the verse to remain a continuation of the prior provision list as in Hebrew. It changes grape juice terminology to wine terminology, preserving חָמֶר’s alcoholic sense, and updates the corresponding footnote. The poetic “blood of grapes” image and the footnoted wheat idiom remain intact.
