source:
  edition: WLC
  text: חֶמְאַ֨ת בָּקָ֜ר וַ/חֲלֵ֣ב צֹ֗אן עִם חֵ֨לֶב כָּרִ֜ים וְ/אֵילִ֤ים בְּנֵֽי בָשָׁן֙ וְ/עַתּוּדִ֔ים עִם חֵ֖לֶב כִּלְי֣וֹת חִטָּ֑ה וְ/דַם עֵנָ֖ב תִּשְׁתֶּה חָֽמֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: te
  text: గోమందం నుంచి పెరుగు, గొర్రెమేకల మంద నుంచి పాలు, గొర్రెపిల్లల కొవ్వుతో, బాషాను ప్రాంతపు పొట్టేళ్ల కొవ్వుతో, మేకపోతుల కొవ్వుతో, శ్రేష్ఠమైన గోధుమలతో[a]; ద్రాక్షరక్తమైన నురుగెత్తే ద్రాక్షామద్యాన్ని[b] నీవు తాగావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘గోధుమల మూత్రపిండాల కొవ్వు’; ఇది అత్యంత మేలైన లేదా పుష్టిగల గోధుమలను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎర్రని ద్రాక్షామద్యం’; హీబ్రూ పదం బాగా పులిసిన, నురుగెత్తే ద్రాక్షామద్యాన్ని కూడా స్ఫురింపజేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: గోమందం నుంచి పెరుగు
  rationale: חֶמְאָה అనేది చిక్కని లేదా పులిసిన పాల పదార్థాన్ని సూచిస్తుంది; ఆధునిక వెన్నకన్నా ‘పెరుగు’ ఈ పశుపోషణ ఆహారచిత్రాన్ని సహజంగా తెలియజేస్తుంది. בָּקָר సమష్టిగా గోవుల మందను సూచిస్తుంది.
- source_word: חֲלֵב צֹאן
  choice: గొర్రెమేకల మంద నుంచి పాలు
  rationale: צֹאן చిన్న పశువుల మందను, సాధారణంగా గొర్రెలు మరియు మేకలను, సమష్టిగా సూచిస్తుంది. అందువల్ల విస్తృత సమష్టి భావాన్ని నిలిపాం.
- source_word: חֵלֶב כָּרִים וְאֵילִים בְּנֵי בָשָׁן וְעַתּוּדִים
  choice: గొర్రెపిల్లల కొవ్వు, బాషానులో పెరిగిన పొట్టేళ్ల కొవ్వు, మేకపోతుల కొవ్వు
  rationale: חֵלֶב అనే స్పష్టమైన ‘కొవ్వు’ చిత్రాన్ని నిలిపి, సహజమైన తెలుగుకోసం జాబితాలో ప్రతి జంతువుతో దాన్ని పునరుక్తి చేశాం. בְּנֵי בָשָׁן అక్షరార్థంగా ‘బాషాను కుమారులు’; ఇక్కడ బాషాను ప్రాంతంలో పెరిగిన పొట్టేళ్లు అనే భావం.
- source_word: חֵלֶב כִּלְיֹת חִטָּה
  choice: శ్రేష్ఠమైన గోధుమలు
  rationale: అక్షరార్థంగా ‘గోధుమల మూత్రపిండాల కొవ్వు’; ఇది అత్యంత పుష్టిగా ఉన్న, మేలైన గోధుమలకు హీబ్రూ కవితాత్మక నుడికారం. ప్రధాన పాఠంలో అర్థవంతమైన రూపాన్ని, పాదటిప్పణిలో అక్షరచిత్రాన్ని ఇచ్చాం.
- source_word: דַם עֵנָב
  choice: ద్రాక్షల రక్తం
  rationale: ద్రాక్షారసం లేదా ద్రాక్షమద్యానికి వాడిన బలమైన కవితాత్మక రూపకాన్ని యథాతథంగా నిలిపాం.
- source_word: תִּשְׁתֶּה
  choice: నీవు తాగావు
  rationale: ద్వితీయ పురుష ఏకవచన అసంపూర్ణ క్రియారూపం ఈ గీతంలోని గత అనుగ్రహాల వర్ణనలో ఉంది; తెలుగులో సాధారణ భూతకాలం సందర్భానికి సరిపోతుంది.
- source_word: חָמֶר
  choice: నురుగెత్తే ద్రాక్షారసం
  rationale: ఈ పదం ద్రాక్షమద్యాన్ని సూచిస్తూ దాని పులిసిన లేదా నురుగెత్తే గుణాన్ని స్ఫురింపజేయవచ్చు. ‘ఎర్రని ద్రాక్షారసం’ కూడా సాధ్యమైన అర్థం కాబట్టి దాన్ని పాదటిప్పణిలో పేర్కొన్నాం.
theological_decisions:
- issue: సమృద్ధిని తెలిపే కవితాత్మక చిత్రాల అనువాదం
  choice: పశువులు, ధాన్యం, ద్రాక్షారసం అనే స్పష్టమైన వ్యవసాయ ఆహారచిత్రాలను నిలిపాం.
  alternative: వాటిని నేరుగా ‘ఐశ్వర్యం’ లేదా ‘నిబంధన ఆశీర్వాదం’ వంటి అమూర్త ధార్మిక పదాలతో వివరించడం.
  rationale: వచనం దేవుడు ఇచ్చిన సమృద్ధిని స్పష్టమైన ఆహారాల జాబితాగా చిత్రిస్తుంది. మూలంలో లేని సిద్ధాంతపరమైన వివరణను చేర్చకుండా ఆ చిత్రాన్నే అందించాం.
- issue: హీబ్రూ వాక్యంలో దాతను సూచించే క్రియ లేకపోవడం
  choice: తెలుగులో జాబితా సంపూర్ణంగా, సహజంగా ఉండేందుకు సందర్భానుసారంగా ‘ఆయన నీకు ఇచ్చాడు’ చేర్చాం.
  alternative: క్రియ లేకుండా మునుపటి వచనంపై పూర్తిగా ఆధారపడే విభిన్న వాక్యఖండంగా ఉంచడం.
  rationale: హీబ్రూలో ఇది మునుపటి వచనంలోని పోషణ వర్ణనను కొనసాగించే జాబితా. తెలుగు స్వతంత్ర వచనంగా చదివినప్పుడు సంబంధం స్పష్టంగా ఉండేందుకు సందర్భంలో నిగూఢంగా ఉన్న దాతృత్వ భావాన్ని వ్యక్తం చేశాం; దాతను యెహోవాగా సిద్ధాంతాత్మకంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే శైలి వాడాం. ‘బాషాను’ అనే భౌగోళిక నామాన్ని నిలిపాం. జాబితా లయను కాపాడేందుకు ‘కొవ్వు’ను పునరుక్తి చేశాం; ‘ద్రాక్షల రక్తం’ అనే మూల కవితారూపకాన్ని తగ్గించలేదు.
