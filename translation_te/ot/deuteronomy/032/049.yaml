id: DEU.32.49
reference: Deuteronomy 32:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: te
  text: “మోయాబు దేశంలో యెరికోకు ఎదురుగా ఉన్న ఈ అబారీము పర్వతమైన నెబో కొండకు ఎక్కి వెళ్లు. నేను ఇశ్రాయేలు కుమారులకు స్వాస్థ్యంగా ఇస్తున్న కనాను దేశాన్ని చూడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלֵה
  choice: ఎక్కి వెళ్లు
  rationale: עלה అనే 2వ పురుష ఏకవచన ఆజ్ఞ పర్వతం పైకి వెళ్లడాన్ని సూచిస్తుంది; ‘ఎక్కి వెళ్లు’ ఆధునిక తెలుగులో దిశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: ఈ అబారీము పర్వతానికి
  rationale: భౌగోళిక నామమైన ‘అబారీము’ను లిప్యంతరీకరించి, הַזֶּהలోని సూచనార్థాన్ని ‘ఈ’తో నిలిపాం.
- source_word: הַר נְבוֹ
  choice: నెబో కొండకు
  rationale: ముందటి పర్వతపదానికి వివరణాత్మక సమానాధికరణగా ఉన్న నెబో పేరును సహజ తెలుగు వాక్యనిర్మాణంలో అందించాం.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: మోయాబు దేశంలో ఉన్న
  rationale: సంబంధవాక్యం నెబో కొండ ఉన్న ప్రాంతాన్ని నేరుగా సూచిస్తుంది.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: యెరికోకు ఎదురుగా ఉన్న
  rationale: భౌగోళిక సందర్భంలో עַל־פְּנֵי అంటే ‘ఎదురుగా’ లేదా ‘ముఖంగా’; ‘ఎదురుగా’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: וּרְאֵה
  choice: చూడు
  rationale: ראה ఆజ్ఞారూపంలోని సరళమైన ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: కనాను దేశాన్ని
  rationale: ప్రత్యక్ష కర్మను, ప్రాచుర్యంలో ఉన్న భౌగోళిక నామరూపాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: నేను ... ఇస్తున్న
  rationale: ప్రథమ పురుష సర్వనామంతో కూడిన వర్తమాన కృదంతం దేవుడు చేస్తున్న లేదా నిశ్చయంగా అనుగ్రహిస్తున్న కార్యంలోని తక్షణత్వాన్ని తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ స్థిరపదబంధంలోని ‘కుమారులు’ అనే పుంలింగ బహువచన రూపాన్ని మూలానికి సమీపంగా కాపాడుతుంది.
- source_word: לַאֲחֻזָּה
  choice: స్వాస్థ్యంగా
  rationale: אֲחֻזָּה భూమితో సంబంధమున్న స్వాధీన ఆస్తి లేదా స్థిరమైన హక్కుగల భాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యంగా’ సంక్షిప్తంగా, గౌరవప్రదంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహపదంలోని లింగరూపం
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలీయులకు / ఇశ్రాయేలు ప్రజలకు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని, దాని సాంప్రదాయిక జనసమూహ సూచనను మార్చకుండా నిలిపాం.
- issue: אֲחֻזָּה యొక్క భావవ్యాప్తి
  choice: స్వాస్థ్యంగా
  alternative: సొత్తుగా / స్వాధీనంగా / వారసత్వంగా
  rationale: ఈ నామవాచకం ప్రధానంగా స్వాధీన ఆస్తి లేదా భూహక్కును సూచిస్తుంది. ‘వారసత్వం’ సాధ్యమైన సందర్భార్థమైనా, ఇక్కడ మూలంలో స్పష్టంగా లేని వారసత్వ ప్రక్రియను ముందుకు తేవకుండా ‘స్వాస్థ్యం’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. భౌగోళిక పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. మూలంలో అవసరమైనంత స్పష్టత ఉన్నందున పాదటిప్పణులు జోడించలేదు; వాక్యంలోని డాష్‌లు ‘అబారీము పర్వతం’ను ‘నెబో కొండ’తో గుర్తించే హీబ్రూ సమానాధికరణను స్పష్టం చేస్తాయి.
