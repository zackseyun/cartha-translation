id: DEU.32.27
reference: Deuteronomy 32:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: te
  text: '‘శత్రువు రెచ్చగొట్టడాన్ని నేను జంకకపోయి ఉంటే[a]!


    ఆ శత్రువులు దాన్ని తప్పుగా అర్థం చేసుకుంటారేమో[b],


    “మా చేతే పైచేయి సాధించింది[c];


    ఇదంతా చేసింది యాహ్వే కాదు” అని అంటారేమో.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శత్రువు ఆగ్రహానికి నేను జంకకపోయి ఉంటే.’
    reason: כַּעַס అనే పదం ‘రెచ్చగొట్టడం,’ ‘ఆగ్రహం,’ లేదా ‘కోపం’ అనే భావాలను ఇవ్వగలదు; אָגוּר కు ‘భయపడ్డాను’ లేదా ‘జంకాను’ అనే అర్థాలు సాధ్యమైనవి.
  - marker: b
    text: ‘తప్పుగా అర్థం చేసుకుంటారు’ అని అనువదించిన హీబ్రూ క్రియ కష్టమైనది; అది ‘తప్పుగా తీర్పు చెబుతారు’ లేదా ఇశ్రాయేలు పతనానికి నిజమైన కారణాన్ని ‘గుర్తించలేరు’ అని కూడా అర్థమివ్వవచ్చు.
    reason: మూల క్రియ יְנַכְּרוּ యొక్క సందర్భోచిత అర్థంపై నిజమైన పదార్థ అనిశ్చితి ఉంది.
  - marker: c
    text: అక్షరార్థంగా, ‘మా చెయ్యి ఎత్తుగా ఉంది.’
    reason: హీబ్రూ విజయాన్ని, స్వీయ ఘనతను ‘ఎత్తైన చెయ్యి’ అనే రూపకంతో వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: לוּלֵי
  choice: భయపడకపోయి ఉంటే
  rationale: ముందరి సందర్భంలో చెప్పిన తీర్పును అమలు చేయకుండా ఆపిన మినహాయింపు కారణాన్ని సూచించే షరతు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כַּעַס אוֹיֵב
  choice: శత్రువు రెచ్చగొట్టడం
  rationale: כַּעַס ఇక్కడ శత్రువు చూపే ఆగ్రహం లేదా దేవుణ్ణి రెచ్చగొట్టే అవహేళన అనే రెండు దగ్గరి భావాలను కలిగి ఉంది; సందర్భానికి సరిపోయేలా ‘రెచ్చగొట్టడం’ ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אָגוּר
  choice: నేను భయపడడం
  rationale: దేవుడు ప్రథమ పురుషంలో భయపడినట్లు లేదా జంకినట్లు చెప్పే మూలభాషలోని మానవానురూప వ్యక్తీకరణను తగ్గించకుండా నిలుపుతుంది.
- source_word: יְנַכְּרוּ
  choice: తప్పుగా అర్థం చేసుకోవడం
  rationale: ఈ కష్టమైన పియేల్ రూపం సందర్భంలో ఇశ్రాయేలు పతనానికి నిజమైన కారణాన్ని విరోధులు తప్పుగా నిర్ధారించడాన్ని సూచిస్తుంది; పదంలోని అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
- source_word: צָרֵימוֹ
  choice: వారి విరోధులు
  rationale: శత్రుత్వం చూపే ప్రత్యర్థులను సూచించే రూపాన్ని బహువచన క్రియ సందర్భానికి అనుగుణంగా అందిస్తుంది.
- source_word: יָדֵינוּ רָמָה
  choice: మా చెయ్యే పైచేయి సాధించింది
  rationale: ‘మా చెయ్యి ఎత్తుగా ఉంది’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విజయదర్ప ప్రకటనగా అందిస్తూ, అక్షరార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: פָּעַל כָּל זֹאת
  choice: ఇదంతా చేసింది
  rationale: జరిగిన విపత్తంతటికీ కర్త యాహ్వే కాదని శత్రువులు నిరాకరించే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన ఆధునిక తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: ‘నేను భయపడ్డాను’ అనే దేవునికి వర్తించిన మానవానురూప భాష
  choice: భయపడడం అనే ప్రత్యక్ష భావాన్ని నిలుపడం
  alternative: ఆందోళన చెందడం / దృష్టిలో ఉంచుకోవడం
  rationale: మూలపాఠం దేవుని మాటగా భయం లేదా జంకును స్పష్టంగా వ్యక్తం చేస్తుంది. దాన్ని సిద్ధాంతపరంగా మృదువుచేయకుండా, శత్రువులు సంఘటనను తప్పుగా అర్థం చేసుకోకూడదనే సందర్భమే దాని ఉద్దేశాన్ని వివరించనిచ్చాం.
- issue: ఇశ్రాయేలు పతనానికి కర్త ఎవరు అనే ఉద్రిక్తత
  choice: ‘ఇదంతా చేసింది యాహ్వే కాదు’ అనే శత్రువుల వాదనను యథాతథంగా ఉంచడం
  alternative: యాహ్వే అనుమతించలేదు అని వివరణాత్మకంగా మార్చడం
  rationale: వచనం శత్రువులు తమ బలానికే విజయాన్ని ఆపాదించి యాహ్వే కార్యాన్ని నిరాకరిస్తారని చెబుతుంది; ఈ కారణత్వాన్ని వ్యాఖ్యానంతో మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక వాక్యనిర్మాణం వాడాం. మొదటి పాదంలోని అసంపూర్ణ ప్రతికల్ప షరతు ముందరి వచనంతో ఉన్న మూలభాషా అనుసంధానాన్ని నిలుపుతుంది. సాధారణ పాఠకుడికి రూపకం అర్థమయ్యేలా ప్రధాన పాఠంలో ‘పైచేయి సాధించింది’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
