  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: te
  text: 'కరవుతో కృశించి,

    మండే తెగులుచేత మింగివేయబడి,

    చేదైన వినాశంతో నశిస్తారు.

    వారిమీదికి మృగాల కోరలనూ,

    నేలపై పాకే జీవుల విషాన్నీ పంపుతాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: కరవుతో కృశించి
  rationale: מְזֵי శారీరకంగా చిక్కిపోయి, శక్తి క్షీణించిన స్థితిని సూచిస్తుంది; తీర్పు సందర్భంలో רָעָב వ్యక్తిగత ఆకలికన్నా కరవును సూచించడం సహజం.
- source_word: לְחֻמֵי רֶשֶׁף
  choice: మండే తెగులుచేత మింగివేయబడి
  rationale: లְחֻמֵיలోని ‘తినివేయబడటం/మింగివేయబడటం’ అనే బలమైన రూపకాన్ని నిలిపి, רֶשֶׁף‌లోని తెగులు మరియు మండే వేడి అనే భావాలను ‘మండే తెగులు’గా వ్యక్తం చేసింది.
- source_word: קֶטֶב מְרִירִי
  choice: ఘోర వినాశం
  rationale: קֶטֶב ప్రాణాంతక నాశనకర విపత్తును, מְרִירִי దాని తీవ్రమైన చేదుతనాన్ని సూచిస్తాయి. సహజ తెలుగు కోసం ‘ఘోర వినాశం’ ఎంచుకోబడింది.
- source_word: שֶׁן בְּהֵמוֹת
  choice: మృగాల కోరలు
  rationale: שֶׁן అక్షరార్థంగా పంటి/పళ్లు; హానికర జంతువుల దాడి సందర్భంలో ‘కోరలు’ సహజంగా ఉండి ప్రమాద భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשַׁלַּח בָּם
  choice: వారిమీదికి పంపుతాను
  rationale: ఈ ప్రయోగం తీర్పుగా హానికర శక్తులను వారిపైకి పంపడాన్ని సూచిస్తుంది; ‘వారిమీదికి’ శత్రుత్వ దిశను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: నేలపై పాకే జీవుల విషం
  rationale: పాకే జీవుల సందర్భంలో חֲמַת ‘కోపం’ కన్నా ‘విషం’ అని అర్థం. זֹחֲלֵי עָפָרను పాములకు మాత్రమే పరిమితం చేయకుండా విస్తృతంగానే అనువదించింది.
theological_decisions:
- issue: רֶשֶׁף అనే పదానికి తెగులు/మండే జ్వరం అనే సాధారణార్థమా, ప్రాచీన దేవత పేరా?
  choice: సాధారణ నామవాచకంగా ‘మండే తెగులు’
  alternative: ‘రేషెఫ్’ అనే దేవత పేరు; లేదా ‘మండే జ్వరం’
  rationale: ఈ కవితా సందర్భం వరుసగా వచ్చే ఒడంబడిక తీర్పులను వర్ణిస్తుంది. కాబట్టి సాధారణ విపత్తు అనే పఠనం ప్రధాన పాఠ్యంలో సహజం; అయితే పదానికి ఉండగల ప్రాచీన నామసూచనను పాదటిప్పణిలో నిలిపింది.
- issue: זֹחֲלֵי עָפָר పాములను మాత్రమే సూచిస్తుందా?
  choice: ‘నేలపై పాకే జీవులు’ అనే విస్తృత పఠనం
  alternative: ‘నేలపై పాకే పాములు’
  rationale: హీబ్రూ పదబంధం నేల/ధూళిపై పాకే జీవులను విస్తృతంగా సూచిస్తుంది. సందర్భం పాములను కలిగి ఉండవచ్చు గాని వాటికే అర్థాన్ని పరిమితం చేయడం అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి నిలిపింది. అరుదైన పదాలకు బదులు సాధారణంగా అర్థమయ్యే ‘కరవు,’ ‘తెగులు,’ ‘వినాశం,’ ‘కోరలు,’ ‘విషం’ వాడబడ్డాయి. హీబ్రూ పంక్తుల సంక్షిప్త తీవ్రతను నిలుపుతూ తెలుగు వాక్యనిర్మాణం సహజంగా ఉండేలా క్రియారూపాలు జోడించబడ్డాయి.
