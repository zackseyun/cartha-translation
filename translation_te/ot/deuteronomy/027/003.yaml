source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: te
  text: నీవు దాటి వెళ్లినప్పుడు, వాటిమీద ఈ ధర్మశాస్త్రంలోని[a] మాటలన్నిటినీ రాయాలి, తద్వారా నీ దేవుడైన యహ్వే నీకు ఇస్తున్న దేశంలోకి నీవు ప్రవేశించేలా చేయాలి—పాలు, తేనె ప్రవహించే దేశంలోకి—నీ పితరుల[b] దేవుడైన యహ్వే నీకు చెప్పినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఉపదేశంలోని.” హీబ్రూ తోరా అనే పదానికి “ఉపదేశం” అనే అర్థం కూడా ఉంది; ఇక్కడ నిబంధన సందర్భాన్ని బట్టి “ధర్మశాస్త్రం” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ పూర్వీకుల.” హీబ్రూ పాఠంలో “నీ పితరుల” అని ఉంది; ఇది ద్వితీయోపదేశకాండమంతటా కనిపించే నిబంధన సంబంధమైన పదప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ עֲלֵיהֶן
  choice: వాటిమీద రాయాలి
  rationale: ముందటి వచనంలోని రాళ్లను సూచించే స్త్రీలింగ బహువచన సర్వనామాన్ని ‘వాటి’గా సహజంగా ప్రతిబింబిస్తూ, ఆజ్ఞార్థక న్యాయశైలిని ‘రాయాలి’తో తెలిపింది.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ
  rationale: דִּבְרֵי అనే ‘మాటలు’ భావాన్ని నిలిపి, ద్వితీయోపదేశకాండంలోని నిబంధన-న్యాయ సందర్భంలో תּוֹרָהకు ‘ధర్మశాస్త్రం’ ఎంచుకుంది; ‘ఉపదేశం’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: בְּעָבְרֶךָ
  choice: నీవు దాటి వెళ్లేటప్పుడు
  rationale: ఉపసర్గతో కూడిన క్రియానామం తెలిపే కాలార్థాన్ని నిలిపింది. సందర్భంలో యొర్దాను నది ఉద్దేశితమైనా, మూలంలో ఈ పదబంధంలో నది పేరు లేనందున చేర్చలేదు.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: అప్పుడు ... నీవు ప్రవేశిస్తావు
  rationale: హీబ్రూ పదబంధంలోని ఉద్దేశం/ఫలితం సంబంధాన్ని తెలుగులో సహజమైన ఫలిత వాక్యంగా తెలిపింది; దాటి వెళ్లడం మరియు ప్రవేశించడం మధ్య మూలపాఠంలోని ఉద్వేగాన్ని తొలగించలేదు.
- source_word: יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ
  choice: నీ దేవుడైన యహ్వే నీకు ఇస్తున్న
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, వర్తమాన క్రియావిశేషణ రూపంలోని సమీపమైన, నిశ్చితమైన దానాన్ని ‘ఇస్తున్న’తో నిలిపింది.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం
  rationale: సమృద్ధిని సూచించే మూల రూపకాన్ని తెలుగులో సుపరిచితమైన, సహజమైన రూపంలో నిలిపింది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్లుగానే
  rationale: సందర్భంలో వాగ్దానం భావం ఉన్నప్పటికీ, דִּבֶּר నేరుగా ‘మాట్లాడు/చెప్పు’ అని ఉండటంతో ‘వాగ్దానం చేసినట్లు’ అని స్పష్టీకరించలేదు.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: నీ పితరుల దేవుడు
  rationale: మూలంలోని పుంలింగ బహువచనాన్నీ, ద్వితీయోపదేశకాండంలో తరచుగా కనిపించే నిబంధన సూత్రాన్నీ ‘పితరులు’తో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- issue: אֲבֹתֶיךָ యొక్క నిబంధనాత్మక సంబోధన
  choice: నీ పితరులు
  alternative: నీ పూర్వీకులు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ రూపాన్నీ, పంచగ్రంథాల్లోని నిబంధన సూత్రాన్నీ ప్రధాన పాఠంలో నిలిపి, సమగ్ర వంశార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- issue: לְמַעַן אֲשֶׁר תָּבֹא లో ఉద్దేశం/ఫలితం
  choice: అప్పుడు ... ప్రవేశిస్తావు
  alternative: నీవు ప్రవేశించేలా
  rationale: రాళ్లపై రాయడం దేశప్రవేశానికి సాధనకారణమని అతిగా నిర్ధారించకుండా, హీబ్రూలో సాధ్యమైన ఫలిత సంబంధాన్ని సహజ తెలుగులో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ఏకవచన ‘నీవు/నీ’ ద్వారా ఇశ్రాయేలును సమష్టిగా సంబోధించే హీబ్రూ రూపం నిలిపబడింది. మూలంలోని దీర్ఘ వాక్యాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించినా, భావక్రమం మరియు నిబంధనాత్మక ధోరణి కాపాడబడ్డాయి.
