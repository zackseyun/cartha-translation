source:
  edition: WLC
  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: te
  text: 'మీరు యొర్దాను దాటినప్పుడు ప్రజలను దీవించడానికి గెరిజీము కొండపై నిలబడవలసినవారు వీరే: షిమ్యోను, లేవి, యూదా, ఇశ్శాఖారు, యోసేపు[a], బెన్యామీను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ గోత్రాల జాబితాలో ‘యోసేపు’ అనే పేరు, యోసేపు నుండి వచ్చిన ఎఫ్రాయిము మరియు మనష్షే గోత్రాలను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה יַעַמְדוּ
  choice: నిలబడవలసినవారు వీరే
  rationale: హీబ్రూ బహువచన సూచనార్థక సర్వనామాన్ని, ఆజ్ఞాత్మక సందర్భంలో ఉన్న అసంపూర్ణ క్రియను సహజమైన ఆధునిక తెలుగులో నిర్దేశార్థంతో అందిస్తుంది.
- source_word: לְבָרֵךְ אֶת הָעָם
  choice: ప్రజలను దీవించడానికి
  rationale: לְ తో కూడిన క్రియానామ రూపం ఉద్దేశాన్ని సూచిస్తుంది; הָעָם ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: עַל הַר גְּרִזִים
  choice: గెరిజీము కొండ మీద
  rationale: స్థలాన్ని సూచించే עַל భావాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తూ, స్థలనామాన్ని సంప్రదాయ తెలుగు రూపంలో ఉంచుతుంది.
- source_word: בְּעָבְרְכֶם אֶת הַיַּרְדֵּן
  choice: మీరు యొర్దాను దాటినప్పుడు
  rationale: בְּ తో కూడిన క్రియానామం కాలార్థాన్ని ఇస్తుంది. సందర్భంలో సంబోధిత సమూహాన్ని సూచించే రెండవ పురుష బహువచనాన్ని ‘మీరు’గా స్పష్టంగా వ్యక్తం చేసింది.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: షిమ్యోను, లేవి, యూదా, ఇశ్శాఖారు, యోసేపు, బెన్యామీను
  rationale: గోత్రాల పేర్లను ఆధునిక తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన సంప్రదాయ రూపాల్లో లిప్యంతరీకరించింది.
theological_decisions:
- issue: గోత్రాలు నిలబడడం గురించి వాక్యంలోని క్రియాబలం
  choice: నిర్దేశార్థంగా ‘నిలబడవలసినవారు’
  alternative: భవిష్యదర్థంగా ‘నిలబడతారు’
  rationale: ఇది మోషే ఇచ్చిన ఆచరణాత్మక నిబంధన సూచనలో భాగం; కాబట్టి కేవలం ముందస్తు ప్రకటనగా కాక నిర్దేశంగా అనువదించడం సందర్భానికి సరిపోతుంది.
- issue: గోత్రాల జాబితాలో ‘యోసేపు’ అనే పేరుకు అర్థం
  choice: మూలపాఠంలోని ‘యోసేపు’నే ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘ఎఫ్రాయిము, మనష్షే గోత్రాలు’ అని విస్తరించడం
  rationale: హీబ్రూ పాఠం యోసేపు అనే పేరునే పేర్కొంటుంది. దాని ప్రతినిధి గోత్రార్థాన్ని ప్రధాన పాఠంలో చేర్చకుండా పాదసూచికలో వివరించడం మూలనిష్ఠను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. నిర్దేశార్థాన్ని స్పష్టంగా ఉంచి, మూలంలోని గోత్రనామాలను విస్తరించకుండా కాపాడింది.
