id: DEU.27.19
reference: Deuteronomy 27:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: te
  text: పరదేశివానికి[a], తండ్రిలేనివానికి[b], విధవరాలికి దక్కవలసిన న్యాయాన్ని వక్రీకరించేవాడు శాపగ్రస్తుడు. ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పరదేశి” అనేది ఇశ్రాయేలీయుల మధ్య నివసించే, స్థానికుడు కాని నివాసిని సూచించే హీబ్రూ గేర్ అనే పదానికి అనువాదం.
    reason: cultural_note
  - marker: b
    text: లేదా, “అనాథ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాపప్రకటనలోని విధేయ విశేషణ బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַטֶּה
  choice: వక్రీకరించేవాడు
  rationale: హిఫిల్ రూపంలోని ‘పక్కకు మళ్లించు, వక్రీకరించు’ అనే న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּט
  choice: న్యాయహక్కును
  rationale: ఇక్కడ అమూర్తమైన న్యాయం మాత్రమే కాక, బలహీనులకు న్యాయంగా దక్కవలసిన హక్కు లేదా తీర్పు ఉద్దేశించబడింది.
- source_word: גֵּר
  choice: వలసవాని
  rationale: ఇశ్రాయేలీయుల మధ్య నివసించే, స్థానికుడు కాని మరియు సామాజికంగా అసురక్షితుడైన నివాసిని ఆధునిక పాఠకులకు సహజంగా సూచిస్తుంది; సాంస్కృతిక పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేనివాని
  rationale: ప్రాచీన న్యాయ-సామాజిక వర్గాన్ని మూలానికి దగ్గరగా నిలుపుతుంది; ‘అనాథ’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: אַלְמָנָה
  choice: విధవరాలి
  rationale: హీబ్రూ సామాజిక వర్గానికి నేరుగా, సహజంగా సరిపడే తెలుగు పదం.
- source_word: וְאָמַר כָּל הָעָם
  choice: ప్రజలందరూ ... అని చెప్పాలి
  rationale: ఆచార సంబంధమైన వరుసలో ఇది ప్రజలకు ఇచ్చిన ప్రతిస్పందన ఆదేశంగా పనిచేస్తుంది; తెలుగు విధ్యర్థక రూపం దానిని స్పష్టం చేస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: స్థిరమైన ఆరాధనా ప్రతిస్పందనను లిప్యంతరీకరణ ద్వారా నిలుపుతూ, నిబంధనపరమైన గంభీరతను కాపాడుతుంది.
theological_decisions:
- issue: ఆధునిక రాజకీయ వర్గీకరణలను మూలంలోని న్యాయ-సామాజిక త్రయంలోకి దిగుమతి చేయకుండా అనువదించడం
  choice: వలసవాని, తండ్రిలేనివాని, విధవరాలి
  alternative: పరదేశి, అనాథ, విధవరాలు
  rationale: ఈ పదాలు ఇశ్రాయేలు నిబంధన ధర్మశాస్త్రంలో రక్షణ అవసరమైన సామాజిక వర్గాలను సూచిస్తాయి. ఎంపిక చేసిన అనువాదం వారి చారిత్రక-న్యాయ స్వరూపాన్ని నిలుపుతూ, ఏ సమకాలీన విధానపరమైన అర్థాన్నీ బలవంతంగా మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన నిబంధన-శాప సూత్రాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయపరమైన పదజాలం వాడబడింది. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా కాపాడి, సామాజిక వర్గాల చారిత్రక భావాన్ని పాదసూచికలతో వివరించాం.
