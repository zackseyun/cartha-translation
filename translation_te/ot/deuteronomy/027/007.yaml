source:
  edition: WLC
  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: te
  text: నీవు సమాధాన బలులు[a] అర్పించాలి; అక్కడ తినాలి; నీ దేవుడైన యాహ్వే సమక్షంలో ఆనందించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహవాస బలులు”; లేదా, “క్షేమ బలులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: అర్పించి
  rationale: זבח ఇక్కడ బలిని వధించి అర్పించే ఆరాధనా క్రియను సూచిస్తుంది. తెలుగులో ‘బలులు అర్పించి’ అనేది సహజంగా ఉండి, బలి సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: ఈ పదం సహభోజనం, క్షేమం, శాంతి భావాలతో ముడిపడిన ఒక నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది. తెలుగులో స్థిరపడిన ‘సమాధాన బలులు’ను ప్రధాన పాఠ్యంలో ఉంచి, ఇతర భావసంభవాలను పాదసూచికలో ఇచ్చాం.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: అక్కడ భోజనం చేసి
  rationale: ‘అక్కడ తిని’ అనేది అక్షరార్థమైనా, బలి మాంసంతో కూడిన ఆరాధనా భోజన సందర్భంలో ‘భోజనం చేసి’ సహజమైన ఆధునిక తెలుగు.
- source_word: וְשָׂמַחְתָּ
  choice: ఆనందించాలి
  rationale: שׂמח ఆరాధనా, నిబంధనా సందర్భంలోని ఉల్లాసాన్ని సూచిస్తుంది; ‘ఆనందించాలి’ దాని ఆజ్ఞాత్మక మరియు ఉత్సవపూర్వక భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: దేవునికి సంబంధించిన ఆరాధనా సందర్భంలో לִפְנֵי అంటే ఆయన సమక్షంలో అని భావం. ‘సన్నిధిలో’ తెలుగులో సహజమైన, గౌరవప్రదమైన వ్యక్తీకరణ.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: హీబ్రూలోని రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీ’గా నిలుపుతూ, ‘నీ దేవుడైన యెహోవా’ అనే సహజ తెలుగు నిర్మాణాన్ని వాడాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: שְׁלָמִים బలి వర్గం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఇది వ్యక్తిగత అంతరంగ శాంతి గురించిన సిద్ధాంత ప్రకటన కాకుండా ఒక బలి వర్గానికి పేరు. సంప్రదాయంగా గుర్తించదగిన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పదంలోని సహవాసం/క్షేమం భావాలను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆరాధనా శైలిని వాడాం. హీబ్రూ రెండవ పురుష ఏకవచన సంబోధనను ‘నీవు/నీ’తో నిలిపాం; వరుస క్రియలను సహజ తెలుగు వాక్య నిర్మాణంలో ‘అర్పించి… చేసి… ఆనందించాలి’గా కలిపాం.
