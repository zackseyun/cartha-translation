  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేకు బలిపీఠాన్ని అఖండమైన రాళ్లతో[a] కట్టాలి. దానిమీద నీ దేవుడైన యాహ్వేకు దహనబలులు అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెక్కబడని రాళ్లతో.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘సంపూర్ణమైన/పూర్తిగా ఉన్న రాళ్లు’; వాటిమీద ఇనుప పనిముట్టు వాడకూడదనే 5వ వచనంలోని ఆదేశం ఆధారంగా ‘చెక్కబడని’ అనే అర్థం వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: సంపూర్ణమైన రాళ్లు
  rationale: שְׁלֵמוֹת అనే విశేషణం నేరుగా ‘సంపూర్ణమైన/పూర్తిగా ఉన్న’ అని సూచిస్తుంది. మునుపటి వచనంలోని ఇనుప పనిముట్టు వాడకూడదనే ఆజ్ఞ ఆధారంగా ‘చెక్కని రాళ్లు’ అని అర్థం చేసుకోవచ్చు; అయితే అది సందర్భాధారిత వివరణ కాబట్టి ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచబడింది.
- source_word: תִּבְנֶה
  choice: కట్టాలి
  rationale: న్యాయపరమైన ఆదేశ సందర్భంలో ఈ అసంపూర్ణ క్రియ ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. ఆధునిక తెలుగులో ‘కట్టాలి’ సహజంగా, గంభీరంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מִזְבַּח
  choice: బలిపీఠం
  rationale: బలులు అర్పించే నిర్మాణానికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయం తెలిపే వ్యక్తిగత, నిబంధనాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: దానిమీద ... అర్పించాలి
  rationale: עלה ధాతువు హిఫీల్ రూపం బలి సందర్భంలో ‘అర్పించడం’ అనే ప్రత్యేక అర్థం ఇస్తుంది. వేదికను సూచించే עָלָיו ‘దానిమీద’గా స్పష్టంగా అనువదించబడింది.
- source_word: עוֹלֹת
  choice: దహనబలులు
  rationale: పూర్తిగా కాల్చి అర్పించే బలిని సూచించే స్థిరమైన బలిపదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ ఇక్కడ బలి ఎవరికి అంకితం చేయబడుతుందో సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి దీనిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: שְׁלֵמוֹת ను సందర్భానుసారంగా ‘చెక్కని’ అని అనువదించాలా?
  choice: సంపూర్ణమైన రాళ్లు
  alternative: చెక్కని రాళ్లు
  rationale: హీబ్రూ విశేషణం యొక్క ప్రత్యక్ష భావం ‘సంపూర్ణమైన/పూర్తిగా ఉన్న’. 5వ వచనంలో ఇనుప పనిముట్టు వాడకూడదనే ఆజ్ఞ వల్ల ‘చెక్కని’ అనే భావం సముచితమైన సందర్భార్థం అయినా, ప్రధాన పాఠంలో నేరుగా ఉన్న పదార్థాన్ని నిలిపి, సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ఆజ్ఞాశైలిని ఉపయోగించాం. రెండవ పురుష ఏకవచనాన్ని ‘నీ’తో నిలిపాం. పునరుక్తమైన ‘నీ దేవుడైన యెహోవా’ను రెండు భాగాల్లోనూ ఉంచి మూలంలోని నిబంధనాత్మక ఉద్ఘాటనను పరిరక్షించాం.
