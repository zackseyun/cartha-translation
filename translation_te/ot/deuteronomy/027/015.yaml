id: DEU.27.15
reference: Deuteronomy 27:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: te
  text: “చెక్కిన ప్రతిమనైనా, పోసి చేసిన ప్రతిమనైనా చేసి—యాహ్వేకు హేయమైనది, శిల్పి చేతిపని అయిన దానిని—రహస్యంగా ఉంచే మనిషి శాపగ్రస్తుడు.” అప్పుడు ప్రజలందరూ, “ఆమేన్” అని జవాబివ్వాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాపప్రకటనలోని న్యాయపరమైన బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָאִישׁ
  choice: మనిషి
  rationale: హీబ్రూ పుంలింగ ఏకవచన న్యాయసూత్రాన్ని నిలుపుతూ, ఇక్కడ ప్రతినిధ్యార్థంగా ఉపయోగించబడిన రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: చెక్కడం ద్వారా రూపొందించిన ప్రతిమ అనే నిర్దిష్ట భావాన్ని కాపాడుతుంది; విస్తృతార్థకమైన ‘విగ్రహం’ కంటే మూలానికి దగ్గరగా ఉంది.
- source_word: מַסֵּכָה
  choice: పోతపోసిన ప్రతిమ
  rationale: కరిగించిన పదార్థాన్ని అచ్చులో పోసి చేసిన ప్రతిమను సూచిస్తుంది; మూలంలో ‘లోహం’ స్పష్టంగా లేనందున దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: תּוֹעֲבַת יְהוָה
  choice: యెహోవాకు అసహ్యమైనది
  rationale: యెహోవా దృష్టిలో తీవ్రంగా హేయమైనదనే నైతిక, నిబంధన సంబంధమైన బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: శిల్పి చేతిపని
  rationale: ప్రతిమ మానవుడు తయారుచేసిన వస్తువని మూలపాఠ్యం నొక్కిచెప్పే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: וְשָׂם בַּסָּתֶר
  choice: రహస్యంగా నిలిపే
  rationale: ప్రతిమను దాచిపెట్టి ఉంచడం లేదా ప్రతిష్ఠించడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: ప్రజలందరూ ... అని జవాబివ్వాలి
  rationale: సమూహం పలికే ఆచారబద్ధమైన ప్రతిస్పందనను తెలుగులో పునరుక్తి లేకుండా తెలియజేస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: అంగీకారం, ధృవీకరణను తెలిపే గుర్తింపబడిన ఆరాధనా ప్రతిస్పందనను లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: నిబంధన శాపసూత్రంలోని పుంలింగ ఏకవచనం
  choice: మనిషి
  alternative: ఎవరైనా
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని కాపాడాం; అది ఈ న్యాయసూత్రంలో ప్రతినిధ్యార్థంగా పనిచేస్తుంది, కేవలం పురుషులకే పరిమితమని అదనపు వ్యాఖ్యానాన్ని రుద్దదు.
- issue: ప్రతిమను రహస్యంగా ఉంచడం
  choice: రహస్యంగా నిలిపే
  alternative: రహస్య స్థలంలో ఉంచే
  rationale: בַּסָּתֶר చర్య దాచబడినదా లేక దాచిన స్థలంలో జరిగిందా అన్న స్వల్ప వ్యత్యాసాన్ని పూర్తిగా నిర్ణయించకుండా, రహస్యత అనే ప్రధాన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన నిబంధన-న్యాయ ప్రకటన శైలిని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. మూలపాఠ్యంలో లేని ‘లోహం’ అనే పదాన్ని చేర్చలేదు; హీబ్రూ వాక్యంలోని ప్రత్యక్ష ఉద్ధరణ నిర్మాణాన్ని తెలుగులో సహజంగా ఉంచాం.
