source:
  edition: WLC
  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: te
  text: మీరు యొర్దాను దాటి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి ప్రవేశించే రోజున, నీవు నీ కోసం పెద్ద రాళ్లను నిలబెట్టి వాటికి సున్నంతో పూత వేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటికి ప్లాస్టర్ పూయాలి.” హెబ్రీ పదం పూతగా ఉపయోగించే సున్నాన్ని లేదా ప్లాస్టర్‌ను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם אֲשֶׁר
  choice: ప్రవేశించే రోజున
  rationale: భవిష్యత్తులో జరిగే సందర్భాన్ని పరిచయం చేసే హెబ్రీ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో కాలసూచక నిర్మాణంగా అందిస్తుంది.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: మీరు యొర్దాను దాటి
  rationale: עבר అనే క్రియ ఇక్కడ నదిని ఒక వైపు నుంచి మరొక వైపుకు దాటడాన్ని సూచిస్తుంది. క్రియలోని బహువచనాన్ని ‘మీరు’ నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ אֶרֶץ ఇశ్రాయేలుకు ఇవ్వబడుతున్న నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు ‘దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: נֹתֵן
  choice: ఇస్తున్న
  rationale: హెబ్రీ వర్తమాన కృదంతం కార్యాన్ని జరుగుతున్నదిగా లేదా నిశ్చయమైనదిగా చూపుతుంది; ‘ఇస్తున్న’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: וַהֲקֵמֹתָ לְךָ אֲבָנִים גְּדֹלוֹת
  choice: నీవు పెద్ద రాళ్లను నిలబెట్టి
  rationale: హిఫీల్ క్రియ రాళ్లను నిటారుగా ఏర్పాటు చేయడాన్ని సూచిస్తుంది. ‘నిలబెట్టి’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది; ఏకవచన క్రియారూపాన్ని ‘నీవు’ నిలుపుతుంది.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: వాటికి సున్నం పూయాలి
  rationale: క్రియ రాళ్లపై పూత వేయడాన్ని, שִׂיד ఆ పూతకు ఉపయోగించే సున్నం లేదా గచ్చు పదార్థాన్ని సూచిస్తాయి. ‘సున్నం పూయాలి’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
theological_decisions:
- issue: יהוה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: సంబోధనలో బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: ‘మీరు’ నుంచి ‘నీ/నీవు’కు మార్పును నిలుపడం
  alternative: వచనమంతటా బహువచనం లేదా ఏకవచనం వాడడం
  rationale: మూల హెబ్రీలో תעברו బహువచనంగా ఉండగా, אלהיך, לך, והקמות ఏకవచనంగా ఉన్నాయి. ఇశ్రాయేలును సమూహంగానూ ఏక సమాజంగానూ సంబోధించే ఈ మార్పును సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి వాడబడింది. మూలంలోని బహువచన–ఏకవచన మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదసూచిక గుర్తు సంబంధిత ‘సున్నం’ పూత వాక్యభాగం తర్వాత ఉంచబడింది.
