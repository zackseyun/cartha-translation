  source_fidelity: The draft correctly renders the plural ‘you cross’ followed by the singular address, preserves Yahweh’s name, and conveys the setting up and coating of the stones. However, לְךָ (‘for yourself’) in ‘set up for yourself’ is not represented, and the wording for the coating can be made more idiomatic while retaining the material distinction.
  naturalness: The sentence is generally clear modern Telugu. ‘సున్నంతో పూత వేయాలి’ is more natural and exact than ‘వాటికి సున్నం పూయాలి’; it also permits a clearer lexical-alternative footnote.
  terminology: ‘యాహ్వే,’ ‘యొర్దాను,’ and ‘దేశం’ are suitable. ‘ప్లాస్టర్’ is a clearer modern Telugu alternative than ‘గచ్చు’ for the footnote’s alternative sense.
  issues:
  - severity: medium
    issue: The reflexive/dative phrase לְךָ is omitted.
    rationale: The Hebrew says to set up the large stones ‘for yourself.’ Although this may be idiomatic rather than strongly emphatic, it should be represented in an optimal-equivalence translation.
  - severity: low
