revisions:
- from: మీరు యొర్దాను దాటి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి ప్రవేశించే రోజున, నీవు పెద్ద రాళ్లను నిలబెట్టి, వాటికి సున్నం పూయాలి.[a]
  to: మీరు యొర్దాను దాటి, నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలోకి ప్రవేశించే రోజున, నీవు నీ కోసం పెద్ద రాళ్లను నిలబెట్టి వాటికి సున్నంతో పూత వేయాలి.[a]
  rationale: The revision restores the singular ‘for yourself’ nuance of לְךָ, while retaining the source’s deliberate plural-to-singular shift. It uses a natural Telugu expression for applying a lime coating and updates the alternative rendering to a clearer modern term without resolving the lexical ambiguity beyond the source.
