id: DEU.27.5
reference: Deuteronomy 27:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: te
  text: అక్కడ నీ దేవుడైన యాహ్వేకు రాళ్లతో ఒక బలిపీఠం కట్టాలి. ఆ రాళ్లపై ఇనుమును ఉపయోగించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిపై ఇనుప పనిముట్టును ఉపయోగించకూడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: కట్టాలి
  rationale: సూచనాత్మక సందర్భంలో సంయోజకంతో కూడిన Qal perfect భవిష్యత్/ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది; ‘కట్టాలి’ ఆధునిక తెలుగులో ఆ విధిని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ముందుగా నిర్దేశించిన స్థలాన్ని సూచించే సాధారణ స్థానవాచక క్రియావిశేషణం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే పీఠానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వేకు
  rationale: לְ సమర్పణ లేదా దిశను సూచిస్తుంది; יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מִזְבַּח אֲבָנִים
  choice: రాళ్లతో ఒక బలిపీఠం
  rationale: హీబ్రూ సమాసం పీఠం ఏ పదార్థంతో నిర్మించాలో నిర్దేశిస్తుంది. పదపునరుక్తిని తెలుగులో బలవంతంగా ఉంచకుండా దాని పూర్తి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תָנִיף עֲלֵיהֶם
  choice: ఆ రాళ్ల మీద … ప్రయోగించకూడదు
  rationale: ఈ సందర్భంలో נוף Hiphil రూపం రాళ్లపై ఒక పనిముట్టును ఉపయోగించడాన్ని సూచిస్తుంది; ‘ప్రయోగించకూడదు’ నిషేధాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּרְזֶל
  choice: ఇనుము
  rationale: మూలపాఠంలో నేరుగా ‘ఇనుము’ అనే నామవాచకమే ఉంది. సందర్భంలో ఇనుప పనిముట్టు ఉద్దేశించబడినప్పటికీ, ప్రధాన పాఠంలో మూలంలోని సంక్షిప్తతను నిలిపి ప్రత్యామ్నాయ స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం నాలుగు అక్షరాల దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించడం నామం యొక్క ప్రత్యేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, ధర్మశాస్త్ర సూచనకు తగిన గౌరవప్రదమైన శైలిని వాడాం. ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’ రూపంలో నిలిపాం; బలిపీఠం అనే పదం పునరుక్తిని సహజ తెలుగు వాక్యనిర్మాణం కోసం సంక్షిప్తం చేశాం.
