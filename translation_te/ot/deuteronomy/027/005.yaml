revisions:
- from: అక్కడ నీ దేవుడైన యాహ్వేకు రాళ్లతో ఒక బలిపీఠం కట్టాలి. ఆ రాళ్ల మీద ఇనుము[a] ప్రయోగించకూడదు.
  to: అక్కడ నీ దేవుడైన యాహ్వేకు రాళ్లతో ఒక బలిపీఠం కట్టాలి. ఆ రాళ్లపై ఇనుమును ఉపయోగించకూడదు.[a]
