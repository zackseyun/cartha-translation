    text: లేదా, ‘వాటిపై ఇనుప పనిముట్టును ఉపయోగించకూడదు.’
    reason: lexical_alternative
  revision_rationale: The revision makes only a naturalness improvement to the expression for using iron on the stones. It preserves the Hebrew’s direct mention of ‘iron,’ the implied-tool ambiguity, the instruction’s force, and the divine name.
