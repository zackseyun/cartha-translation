source:
  edition: WLC
  text: אָר֕וּר מַכֵּ֥ה רֵעֵ֖/הוּ בַּ/סָּ֑תֶר וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: te
  text: “రహస్యంగా తన తోటివానిని కొట్టి పడగొట్టేవాడు[a] శాపగ్రస్తుడు.” అప్పుడు ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొట్టేవాడు” లేదా “చంపేవాడు”; హీబ్రూ క్రియ సాధారణంగా కొట్టడం నుండి ప్రాణాంతక హింస వరకు విస్తరించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాప ప్రకటనను స్పష్టంగా, గంభీరంగా తెలిపే సహజమైన తెలుగు పదం.
- source_word: מַכֵּה
  choice: కొట్టి పడగొట్టేవాడు
  rationale: נכה అనే క్రియ కొట్టడం నుండి ప్రాణాంతక హింస వరకు విస్తరించగలదు. ‘కొట్టి పడగొట్టేవాడు’ చర్య తీవ్రతను చూపుతూ, అది తప్పనిసరిగా హత్యేనని పరిమితం చేయదు.
- source_word: רֵעֵהוּ
  choice: తన తోటివానిని
  rationale: రֵעַ ఇక్కడ సమాజంలోని తోటి వ్యక్తిని లేదా సహచరుణ్ణి సూచిస్తుంది. ‘తోటివాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి సామాజిక సంబంధాన్ని నిలుపుతుంది.
- source_word: בַּסָּתֶר
  choice: రహస్యంగా
  rationale: ఇతరులకు తెలియకుండా, బహిరంగ దృష్టికి దూరంగా చేసిన చర్య అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאָמַר
  choice: అప్పుడు ... అనాలి
  rationale: ఈ ఆచారపరమైన క్రమంలో ప్రజలు ఇవ్వవలసిన సమూహ ప్రత్యుత్తరాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూ వాక్యంలోని ‘ప్రజలందరూ’ అనే సమగ్ర భావాన్ని అదనపు గుర్తింపులు చేర్చకుండా నిలుపుతుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: స్థిరపడిన ఆరాధనా ప్రత్యుత్తరాన్ని లిప్యంతరీకరణలో ఉంచి, ఆ ప్రకటనకు సమ్మతించే నిబంధనాత్మక బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: מַכֵּה సూచించే హింస తీవ్రత
  choice: కొట్టి పడగొట్టేవాడు
  alternative: కొట్టేవాడు; చంపేవాడు
  rationale: మూల క్రియ సాధారణంగా కొట్టడం నుండి ప్రాణాంతక దాడి వరకు సూచించగలదు. సందర్భం తీవ్రమైన రహస్య హింసను సూచించినా, హత్యనే ఖచ్చితంగా చెప్పదు; అందువల్ల ప్రధాన పాఠంలో ఆ సందిగ్ధతను నిలుపుతూ తీవ్రతను వ్యక్తపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆచారపరమైన ధోరణి ఉంచబడింది. శాప ప్రకటనను ఉద్ధరణలో ఉంచి, ప్రజల సమూహ ప్రత్యుత్తరాన్ని వేరుగా చూపించాం.
