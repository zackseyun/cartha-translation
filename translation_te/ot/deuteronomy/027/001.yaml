    rationale: מִצְוָה ప్రాథమికంగా ‘ఆజ్ఞ’; ఈ వచనంలో ‘ధర్మ’ అనే ప్రత్యేక భావాన్ని మూలం స్పష్టంగా చెప్పదు. తటస్థమైన ‘ఆజ్ఞ’ మూలానికి మరింత సమీపం.
  - severity: low
