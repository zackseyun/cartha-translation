source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: te
  text: 'మోషే, ఇశ్రాయేలు పెద్దలూ ప్రజలకు ఇలా ఆజ్ఞాపించారు: “నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న ఆజ్ఞ అంతటినీ పాటించండి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొత్తం ఆజ్ఞను.” హీబ్రూలో “ఆజ్ఞ” ఏకవచనంలో ఉన్నా, సమష్ట్యర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించారు
  rationale: צוה అనే క్రియ అధికారపూర్వకంగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; బహువచన కర్తలైన మోషే, పెద్దలకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: హీబ్రూ వాక్యంలో మోషే, ఇశ్రాయేలు పెద్దలు సంయుక్త కర్తలు; తెలుగు జాబితా నిర్మాణంలో సహజంగా ఉండేందుకు విరామచిహ్నంతో సమన్వయం చూపబడింది.
- source_word: הָעָם
  choice: ప్రజలకు
  rationale: עָם నిబంధనాత్మక జాతీయ సందర్భంలో ‘ప్రజలు’ అనే అర్థాన్ని ఇస్తుంది; את గుర్తించిన కర్మను తెలుగులో సహజంగా సంప్రదానార్థక రూపంలో వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఉద్ధరణను పరిచయం చేసే לֵאמֹרను తెలుగులో సహజమైన ‘ఇలా’తో తెలిపాం; తరువాతి ద్విబిందువు మాటల ఆరంభాన్ని స్పష్టం చేస్తుంది.
- source_word: שָׁמֹר
  choice: పాటించండి
  rationale: ఆజ్ఞల సందర్భంలో שׁמר జాగ్రత్తగా ఆచరించడం, విధేయత చూపడం అనే భావాన్ని ఇస్తుంది; ‘పాటించండి’ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: כָּל הַמִּצְוָה
  choice: ధర్మాజ్ఞ అంతటినీ
  rationale: మూలంలోని ఏకవచనాన్ని నిలుపుతూ כָּל యొక్క సమగ్రతను ‘అంతటినీ’ వ్యక్తం చేస్తుంది. ‘ధర్మాజ్ఞ’ ఇక్కడ నిబంధనాత్మక దైవ ఆదేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: నేను మీకు ఆజ్ఞాపిస్తున్న
  rationale: מְצַוֶּה అనే కృదంతంలోని ప్రస్తుత/కొనసాగుతున్న భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ నిలుపుతుంది; తెలుగులో ఆజ్ఞను వ్యక్తులకు ఇవ్వడాన్ని ‘మీకు’తో సహజంగా తెలిపాం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచక ప్రాధాన్యాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధనాత్మక ఉపదేశంలో מִצְוָה యొక్క వచనం
  choice: 'ఏకవచన సమష్ట్యర్థం: ‘ధర్మాజ్ఞ అంతటినీ’'
  alternative: బహువచనంగా ‘ఆజ్ఞలన్నిటినీ’
  rationale: హీబ్రూ నామవాచకం ఏకవచనంలో ఉంది. దానిని అలాగే ఉంచడం ద్వితీయోపదేశకాండంలో నిబంధనాత్మక ఆదేశ సమగ్రతను ఏకవచనంతో సూచించే విధానాన్ని కాపాడుతుంది; బహువచనం మూలంలోని సూక్ష్మతను మార్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని సంయుక్త కర్త, ఏకవచన సమష్ట్యర్థం, ప్రస్తుతకాల ఆజ్ఞాపన భావం నిలుపబడ్డాయి.
