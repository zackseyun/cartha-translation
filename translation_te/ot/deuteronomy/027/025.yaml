id: DEU.27.25
reference: Deuteronomy 27:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: te
  text: నిర్దోషిని చంపడానికి లంచం తీసుకొనేవాడు శపించబడినవాడు. ప్రజలందరూ, ‘ఆమేన్,’ అని చెప్పాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శపించబడినవాడు
  rationale: నిబంధన-శాప ప్రకటనలోని విధేయ విశేషణ భావాన్ని సహజమైన, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹקֵחַ שֹׁחַד
  choice: లంచం తీసుకునేవాడు
  rationale: కర్తగా పనిచేసే హీబ్రూ కృదంతంలోని సాధారణ ఏకవచన భావాన్ని, న్యాయాన్ని వక్రీకరించే అక్రమ ప్రతిఫలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהַכּוֹת
  choice: చంపించడానికి
  rationale: నכה హిఫిల్ రూపం సందర్భానుసారం కొట్టడం, పడగొట్టడం లేదా చంపడం అనే భావాలు ఇవ్వగలదు; ‘నిర్దోష రక్తం’తో కూడిన ఈ న్యాయ సందర్భంలో ప్రాణాంతక ఫలితమే ఉద్దేశం. లంచం తీసుకోవడం ద్వారా హత్యకు కారణమయ్యే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ప్రేరణార్థక రూపం ఎంచుకోబడింది.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: నిర్దోషిని
  rationale: పదశః నిర్మాణం క్లిష్టమైనప్పటికీ, సందర్భంలో మరణశిక్షకు పాత్రమైన అపరాధం లేని వ్యక్తినే సూచిస్తుంది; ‘నిర్దోషిని’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וְאָמַר כָּל הָעָם
  choice: అప్పుడు ప్రజలందరూ ... అని చెప్పాలి
  rationale: ఆరాధనా-న్యాయ సందర్భంలోని నిర్దేశిత సామూహిక ప్రతిస్పందనను ‘చెప్పాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: నిబంధన ప్రకటనకు సమ్మతి తెలిపే స్థిరమైన ఆరాధనా పదంగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: నిబంధన సందర్భంలోని శాప సూత్రాన్ని అనువదించడం
  choice: నిర్దోషిని చంపించడానికి లంచం తీసుకునేవాడు శపించబడినవాడు
  alternative: నిర్దోష రక్తాన్ని చిందించడానికి లంచం తీసుకునేవాడు శపించబడినవాడు
  rationale: ఎంచుకున్న పాఠం న్యాయపరమైన, నిబంధనాత్మక బలాన్ని నిలుపుతూ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది; హీబ్రూ రక్తసంబంధ నుడికారాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే నిబంధన-శాప ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. ‘ఆమేన్’ ఆరాధనా వాడుకకు అనుగుణంగా నిలుపబడింది.
