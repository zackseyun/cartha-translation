revisions:
- from: నిర్దోషిని చంపించడానికి లంచం తీసుకునేవాడు శపించబడినవాడు.[a] అప్పుడు ప్రజలందరూ, ‘ఆమేన్’ అని చెప్పాలి.
  to: నిర్దోషిని చంపడానికి లంచం తీసుకొనేవాడు శపించబడినవాడు. ప్రజలందరూ, ‘ఆమేన్,’ అని చెప్పాలి.
  rationale: The revision removes the unsupported causative nuance and retains the Hebrew idiom concerning ‘innocent blood’ in a footnote. It keeps the formal covenant-curse register and the prescribed public response in idiomatic modern Telugu.
