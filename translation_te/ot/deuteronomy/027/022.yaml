review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the curse formula, the sexual sense of שֹׁכֵב עִם, the paternal-or-maternal definition of the sister, and the prescribed communal response. However, “అప్పుడు” (‘then’) adds a temporal transition not expressed by the Hebrew waw in this formulaic clause.
  naturalness: “లైంగికంగా కలిసేవాడు” is understandable, but “లైంగిక సంబంధం కలిగినవాడు” is more idiomatic and suitably formal in modern standard Telugu. Removing “అంటే” also lets the parental clauses function as the Hebrew’s direct appositional specification rather than as an explanatory paraphrase.
  terminology: “శాపగ్రస్తుడు” appropriately conveys אָרוּר in a solemn covenant-curse register, and “ఆమేన్” is an established Telugu transliteration of אָמֵן.
  issues:
  - severity: low
    issue: The word “అప్పుడు” is an unnecessary temporal addition.
    rationale: וְאָמַר continues the formula with ‘and all the people shall say’; it does not explicitly mark a temporal sequence.
  - severity: low
    issue: The expression “లైంగికంగా కలిసేవాడు” is somewhat less idiomatic in formal Telugu.
    rationale: “లైంగిక సంబంధం కలిగినవాడు” states the sexual meaning clearly, naturally, and with an appropriate legal register.
  revised_text: తన సోదరితో—తన తండ్రి కుమార్తెతో గానీ తన తల్లి కుమార్తెతో గానీ—లైంగిక సంబంధం కలిగినవాడు శాపగ్రస్తుడు. ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  revised_footnotes: []
  revision_rationale: The revision preserves the Hebrew appositional parental clauses and legal-curse cadence, removes an unsupported temporal connective, and uses a more natural formal Telugu expression for the sexual idiom. No footnote is needed because the Telugu wording directly retains the paternal/maternal formulation.
