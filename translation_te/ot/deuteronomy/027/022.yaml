id: DEU.27.22
reference: Deuteronomy 27:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: te
  text: తన సోదరితో—తన తండ్రి కుమార్తెతో గానీ తన తల్లి కుమార్తెతో గానీ—లైంగిక సంబంధం కలిగినవాడు శాపగ్రస్తుడు. ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాప ప్రకటనలోని predicate adjective బలాన్ని సహజమైన, గంభీరమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֹׁכֵב עִם
  choice: లైంగికంగా కలిసేవాడు
  rationale: హీబ్రూ ప్రయోగం ఇక్కడ లైంగిక సంభోగాన్ని సూచిస్తుంది. అక్షరార్థమైన ‘పడుకునేవాడు’ తెలుగులో అస్పష్టంగా ఉండవచ్చు కాబట్టి భావాన్ని మర్యాదగా, స్పష్టంగా తెలిపే రూపం ఎంచుకోబడింది.
- source_word: אֲחֹתוֹ
  choice: తన సోదరితో
  rationale: మూడవ పురుష ఏకవచన సంబంధాన్ని సహజంగా నిలుపుతూ ప్రత్యక్ష బంధుత్వ పదాన్ని అనువదిస్తుంది.
- source_word: בַּת אָבִיו
  choice: తన తండ్రి కుమార్తెతో
  rationale: ‘సోదరి’ అనే పదానికి హీబ్రూ ఇచ్చే పితృసంబంధ వివరణను కుదించకుండా నిలుపుతుంది.
- source_word: אוֹ
  choice: గానీ ... గానీ
  rationale: రెండు ప్రత్యామ్నాయ తల్లిదండ్రుల సంబంధాలను సహజ తెలుగు సముచ్చయ నిర్మాణంలో స్పష్టంగా చూపుతుంది.
- source_word: בַת אִמּוֹ
  choice: తన తల్లి కుమార్తెతో
  rationale: మాతృసంబంధ వివరణను సమాంతర న్యాయపరమైన రూపంలో నిలుపుతుంది.
- source_word: וְאָמַר
  choice: అప్పుడు ... అని చెప్పాలి
  rationale: శాపాల జాబితాలో నిర్దేశిత సామూహిక ప్రతిస్పందనను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూలో ఉన్న ‘ప్రజలందరూ’ అనే పరిధిని అదనపు వివరణ లేకుండా ప్రత్యక్షంగా అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: నిబంధనాత్మక, ఆరాధనా సందర్భంలో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించి మూలపదపు ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: అక్రమ రక్తసంబంధపు నిషేధం యొక్క పరిధి
  choice: సోదరిని ‘తండ్రి కుమార్తె గానీ, తల్లి కుమార్తె గానీ’ అని మూలపాఠం వివరించిన విధంగానే ఉంచడం
  alternative: ఈ మాటలను కేవలం సవతి సోదరికి పరిమితం చేయడం లేదా అన్ని సమీప స్త్రీ బంధువులకు విస్తరించడం
  rationale: మూలవాక్యం పితృ లేదా మాతృ వంశసంబంధంతో సోదరిని నిర్వచిస్తుంది; అనువాదం దానిని అనవసరంగా సంకుచితం చేయదు, విస్తరించదు.
- issue: పురుష ఏకవచన న్యాయపరమైన కర్త
  choice: ‘కలిసేవాడు’ మరియు ‘తన సోదరి’ అనే పురుష ఏకవచన రూపాలను నిలుపడం
  alternative: పూర్తిగా లింగనిరపేక్షమైన బహువచన రూపంలో మార్చడం
  rationale: హీబ్రూ participle మరియు స్వామ్యప్రత్యయాలు పురుష ఏకవచనంలో ఉన్నాయి; తెలుగు రూపం మూలంలోని నిర్దిష్ట సంబంధాన్ని సహజంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన శాపసూత్రానికి తగిన గంభీరతను కాపాడుతూ, ‘పడుకోవడం’ అనే సంభావ్య అస్పష్టతకు బదులు మర్యాదపూర్వకమైన స్పష్టమైన లైంగిక ప్రయోగం వాడబడింది. వివరణాత్మక parental clauses‌ను డాష్‌ల మధ్య ఉంచి మూలంలోని apposition‌ను చదవడానికి సులభంగా చేశాం.
