revisions:
- from: “తన సోదరితో—అంటే తన తండ్రి కుమార్తెతో గానీ, తన తల్లి కుమార్తెతో గానీ—లైంగికంగా కలిసేవాడు శాపగ్రస్తుడు.” అప్పుడు ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  to: తన సోదరితో—తన తండ్రి కుమార్తెతో గానీ తన తల్లి కుమార్తెతో గానీ—లైంగిక సంబంధం కలిగినవాడు శాపగ్రస్తుడు. ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  rationale: The revision preserves the Hebrew appositional parental clauses and legal-curse cadence, removes an unsupported temporal connective, and uses a more natural formal Telugu expression for the sexual idiom. No footnote is needed because the Telugu wording directly retains the paternal/maternal formulation.
