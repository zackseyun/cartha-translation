source:
  edition: WLC
  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: te
  text: “దారిలో అంధుణ్ణి తప్పుదారి పట్టించేవాడు శాపగ్రస్తుడు.” అప్పుడు ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధనాత్మక శాప ప్రకటనలోని విధేయ విశేషణ బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: מַשְׁגֶּה
  choice: తప్పుదారి పట్టించేవాడు
  rationale: హిఫీల్ కృదంతంలోని ‘దారి తప్పేలా చేయడం’ అనే కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; సందర్భంలోని ఉద్దేశపూర్వక మోసాన్ని ముందుగానే అతిశయింపదు.
- source_word: עִוֵּר
  choice: అంధుణ్ణి
  rationale: హీబ్రూ ఏకవచన పుంలింగ నామవాచకార్థక విశేషణాన్ని వ్యక్తిగత న్యాయ ఉదాహరణగా ప్రతిబింబిస్తుంది.
- source_word: בַּדָּרֶךְ
  choice: దారిలో
  rationale: ఇక్కడి స్పష్టమైన స్థలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָמַר
  choice: అప్పుడు ... అని చెప్పాలి
  rationale: ఆచారపరమైన నిర్దేశంలో వావ్ + కతల్‌కు ఉన్న ఆదేశాత్మక/భవిష్యత్ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: మూలంలోని ‘ప్రజలంతా’ అనే భావాన్ని అదనపు గుర్తింపులు చేర్చకుండా అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: నిబంధనాత్మక, ఆరాధనాపరమైన సమ్మతి పలుకును అనువదించి వివరణాత్మకం చేయకుండా స్థిరమైన తెలుగు లిప్యంతరీకరణతో ఉంచుతుంది.
theological_decisions:
- issue: עִוֵּר అనే నామవాచకార్థక విశేషణంలోని లింగ సూచన
  choice: అంధుణ్ణి
  alternative: అంధ వ్యక్తిని
  rationale: మూలంలోని పుంలింగ ఏకవచన వ్యక్తిగత ఉదాహరణను తెలుగులో నిలుపుతుంది; దీనిని కేవలం సమూహవాచకంగా మార్చదు.
- issue: శాప సూత్రం యొక్క స్వభావం
  choice: శాపగ్రస్తుడు
  alternative: శపింపబడుగాక
  rationale: హీబ్రూ రూపం కోరికను తెలిపే శాపవాక్యం కంటే ప్రకటనాత్మక నిబంధన-శాప సూత్రం; అందువల్ల ప్రకటన రూపాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, న్యాయ-ఆరాధనా సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘తప్పుదారి పట్టించేవాడు’ అనే ప్రయోగం దారి సంబంధిత పదప్రయోగాన్ని నిలుపుతూ కారణార్థాన్ని సహజంగా తెలియజేస్తుంది.
