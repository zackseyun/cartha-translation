id: DEU.27.21
reference: Deuteronomy 27:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: te
  text: ఏ జంతువుతోనైనా శయనించే పురుషుడు శాపగ్రస్తుడు. ప్రజలందరూ[a], ‘ఆమేన్’ అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ జంతువుతోనైనా శయనించే వాడు.” హీబ్రూ మూలంలో పురుష ఏకవచన రూపం ఉంది.
    reason: మూలంలోని పురుష ఏకవచన రూపాన్ని సూచిస్తూ, సాధ్యమైన ప్రత్యామ్నాయ తెలుగురూపాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధనాత్మక శాప ప్రకటనలోని గంభీరమైన విధేయ విశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שֹׁכֵב
  choice: శయనించే
  rationale: ఈ న్యాయసందర్భంలో క్రియకు లైంగిక భావం ఉంది. ‘తో శయనించే’ అనేది మూలంలోని సభ్యోక్తిని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: עִם כָּל בְּהֵמָה
  choice: ఏ జంతువుతోనైనా
  rationale: כָּל యొక్క పంపిణీ భావాన్ని ‘ఏ...నైనా’ సహజంగా వ్యక్తం చేస్తుంది; בְּהֵמָהను ఈ నిషేధంలో పశువులకే పరిమితం చేయకుండా విస్తృతంగా ‘జంతువు’గా అనువదించింది.
- source_word: שֹׁכֵב
  choice: శయనించే పురుషుడు
  rationale: మూలంలోని పురుష ఏకవచన కృదంతాన్ని అస్పష్టంగా తటస్థీకరించకుండా, సందర్భంలో ఊహించబడిన పురుష కర్తను తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: וְאָמַר כָּל הָעָם
  choice: ప్రజలందరూ ... అని పలకాలి
  rationale: ఆచారపరమైన సామూహిక ప్రతిస్పందనను, వావ్‌తో కొనసాగుతున్న న్యాయ-కర్మకాండ క్రమాన్ని సహజమైన విధ్యర్థక తెలుగులో అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: నిబంధనను ధృవీకరించే సుపరిచిత ఆరాధనా ప్రతిస్పందనను లిప్యంతరీకరణలో నిలుపుతుంది.
theological_decisions:
- issue: న్యాయపరమైన శాపసూత్రంలో పురుష ఏకవచన కృదంతం
  choice: శయనించే పురుషుడు
  alternative: శయనించే వ్యక్తి / ఎవరైనా
  rationale: హీబ్రూ రూపం పురుష ఏకవచనం; అందుచేత దానిని లింగతటస్థంగా మార్చకుండా అనువదించాం. అయినా సూత్రం యొక్క న్యాయ విస్తృతి గురించి మూలం స్వయంగా చెప్పనిదాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నిబంధనాత్మక శాపవాక్యానికి తగిన గంభీరతను, మూలంలోని లైంగిక సభ్యోక్తిని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది.
