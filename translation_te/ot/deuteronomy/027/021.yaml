  source_fidelity: The draft preserves the curse formula, the masculine-singular subject, the distributive sense of ‘any animal,’ and the required communal response. ‘శయనించే’ can retain the Hebrew euphemistic register in this legal context.
  naturalness: ‘ప్రజలందరూ ... అని పలకాలి’ is understandable but somewhat stiff. ‘ప్రజలందరూ ... అని చెప్పాలి’ is more natural modern standard Telugu while retaining the formal liturgical force. A footnote anchor should also carry forward the audit trail’s note about the masculine singular form.
  terminology: ‘శాపగ్రస్తుడు,’ ‘జంతువు,’ and ‘ఆమేన్’ are suitable. ‘శయనించే పురుషుడు’ appropriately represents the masculine form without introducing theological interpretation.
  issues:
