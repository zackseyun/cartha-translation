    issue: The English audit trail’s gender-form alternative note has no corresponding Telugu footnote anchor.
    rationale: The text itself is defensible, but retaining a Telugu footnote documents that ‘పురుషుడు’ reflects the Hebrew masculine singular and that a generic rendering is possible.
  - severity: low
    issue: ‘పలకాలి’ is less idiomatic here than ‘చెప్పాలి.’
    rationale: The latter is ordinary modern Telugu for a prescribed collective spoken response and does not alter the Hebrew performative force.
