translation:
  language: te
  text: 'ఆ రోజున మోషే ప్రజలకు ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ అధికారపూర్వకంగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: אֶת הָעָם
  choice: ప్రజలకు
  rationale: עָם ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఆజ్ఞాపించాడు’తో కర్మకు సంప్రదాన విభక్తి సహజంగా ఉంటుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలసూచక పదబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే ఆజ్ఞా విషయాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ద్విబిందువు దాని కొనసాగింపును స్పష్టం చేస్తుంది.
