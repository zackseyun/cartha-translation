  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: te
  text: “తన పొరుగువాని హద్దు గుర్తును మార్చేవాడు శాపగ్రస్తుడు.” మరియు ప్రజలందరూ, “ఆమేన్” అని పలకాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన న్యాయపరమైన శాప ప్రకటనను సంక్షిప్తంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: מַסִּיג
  choice: జరిపేవాడు
  rationale: సరిహద్దు గుర్తును పూర్తిగా తొలగించడం మాత్రమే కాక, దాని స్థానాన్ని మార్చి హద్దును ఆక్రమించడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גְּבוּל
  choice: పొలపు హద్దురాయి
  rationale: ఇక్కడ ఆస్తి సరిహద్దు లేదా దానిని సూచించే గుర్తు ఉద్దేశించబడింది. తెలుగు పాఠకునికి ప్రాచీన భూహద్దు సందర్భాన్ని స్పష్టంగా తెలియజేయడానికి ‘హద్దురాయి’ వాడబడింది; ‘పొలపు’ సందర్భస్పష్టతను ఇస్తుంది.
- source_word: רֵעֵהוּ
  choice: తన పొరుగువాని
  rationale: సమాజంలోని తోటి వ్యక్తిని సూచించే ఏకవచన సంబంధాన్ని నిలుపుతూ, ఆస్తి-హద్దు సందర్భంలో సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది.
- source_word: וְאָמַר
  choice: అప్పుడు ... అని చెప్పాలి
  rationale: ప్రజల సామూహిక నిబంధన-ఆమోద ప్రతిస్పందనను ఆధునిక తెలుగులో సహజంగా, విధిబద్ధంగా తెలియజేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూ మూలంలోని ‘ప్రజలందరూ’ అనే భావాన్ని అదనపు గుర్తింపులు చేర్చకుండా నేరుగా అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: హీబ్రూ ఆమోదోక్తి యొక్క ఆరాధనా మరియు నిబంధన సంబంధమైన బలాన్ని నిలుపుకునే స్థిరపడిన తెలుగు రూపం.
theological_decisions:
- issue: నిబంధన సంబంధమైన శాపసూత్రం
  choice: తన పొరుగువాని పొలపు హద్దురాయిని జరిపేవాడు శాపగ్రస్తుడు
  alternative: తన పొరుగువాని హద్దును మార్చేవాడు శపించబడినవాడు
  rationale: వారసత్వ భూమిని మోసపూర్వకంగా ఆక్రమించడంపై ప్రకటించే అధికారిక శాపాన్ని ఈ రూపం నిలుపుతుంది. ‘హద్దురాయి’ ఆ నేరం జరిగిన స్పష్టమైన భౌతిక సందర్భాన్ని తెలియజేస్తుంది.
- issue: పురుష ఏకవచన కర్త
  choice: జరిపేవాడు
  alternative: జరిపే వ్యక్తి
  rationale: మూలంలోని పురుష ఏకవచన ప్రతినిధి న్యాయసూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దీనిని అనవసరంగా బహువచనంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా నిబంధన-న్యాయ ప్రకటనకు తగిన గంభీరతతో అనువదించబడింది. మూలంలో ప్రత్యేక పాఠాంతర అవసరం లేకపోవడంతో పాదటిప్పణి చేర్చలేదు.
