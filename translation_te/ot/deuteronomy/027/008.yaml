source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עַל הָ/אֲבָנִ֗ים אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בַּאֵ֥ר הֵיטֵֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: te
  text: ఆ రాళ్లపై ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ చాలా స్పష్టంగా[a] రాయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తేటగా,’ లేదా ‘అవి స్పష్టంగా అర్థమయ్యేలా.’ హీబ్రూ పదబంధంలో ‘స్పష్టం చేయు/వివరించు’ అనే అర్థమిచ్చే క్రియతో పాటు దానిని బలపరిచే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: రాయాలి
  rationale: సూచనల పరంపరలో సంయోజకంతో వచ్చిన ద్వితీయ పురుష ఏకవచన క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘రాయాలి’ సహజంగా ఆ విధిని వ్యక్తం చేస్తుంది.
- source_word: עַל הָאֲבָנִים
  choice: ఆ రాళ్లపై
  rationale: עַל అంటే ‘పై’; నిర్దిష్ట ఉపపదం సందర్భంలో ఇంతకుముందు ప్రస్తావించిన రాళ్లను సూచిస్తుంది కాబట్టి ‘ఆ రాళ్లు’ అని అనువదించబడింది.
- source_word: אֵת כָּל דִּבְרֵי
  choice: మాటలన్నిటినీ
  rationale: אֵת కర్మ సూచిక; כָּל דִּבְרֵי అనే పదబంధంలోని సంపూర్ణతను, పదాలనే సూచించే రూపాన్ని ‘మాటలన్నిటినీ’ నిలుపుతుంది.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాత్మక, న్యాయపరమైన సందర్భంలో תּוֹרָהకు ‘ధర్మశాస్త్రం’ సహజమైన స్థిర తెలుగు సమానార్థకం; ‘ఈ’ మూలంలోని నిర్దేశకాన్ని నిలుపుతుంది.
- source_word: בַּאֵר הֵיטֵב
  choice: చాలా స్పష్టంగా
  rationale: בארలోని స్పష్టం చేయడం/తేటపరచడం అనే భావాన్ని הֵיטֵב బలపరుస్తుంది. రాళ్లపై వ్రాయడం అనే సందర్భంలో ‘చాలా స్పష్టంగా’ అనేది వ్రాత స్పష్టంగా, అర్థమయ్యేలా ఉండాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
