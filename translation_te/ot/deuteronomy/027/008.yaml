translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘ధర్మశాస్త్రం’ బైబిలు సందర్భంలో సుపరిచితమైన పదమే అయినా, వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచబడింది.
