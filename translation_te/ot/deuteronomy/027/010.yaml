id: DEU.27.10
reference: Deuteronomy 27:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁ֣מַעְתָּ֔ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/עָשִׂ֤יתָ אֶת מִצְוֺתָ/ו֙ וְ/אֶת חֻקָּ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: te
  text: కాబట్టి నీవు నీ దేవుడైన యాహ్వే స్వరాన్ని వినాలి[a]; నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలను, కట్టడలను అమలు చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దేవుడైన యాహ్వే మాటకు లోబడాలి.” “స్వరాన్ని వినడం” అనే హీబ్రూ నానుడిలో తరచుగా విధేయత చూపడం అనే భావం కూడా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: స్వరాన్ని వినాలి
  rationale: హీబ్రూ ‘శామా బెఖోల్’ అనే ప్రయోగానికి ప్రాథమికంగా ‘స్వరాన్ని వినడం’ అనే అర్థం ఉంది; సందర్భంలో విధేయత కూడా అంతర్భాగంగా ఉంది. తరువాతి భాగంలో ఆజ్ఞలను అమలు చేయడం స్పష్టంగా ఉన్నందున, ఇక్కడ ‘వినాలి’ అని ఉంచడం మూలంలోని భావపరమైన విస్తృతిని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఇశ్రాయేలుతో ఉన్న నిబంధన సంబంధాన్ని సూచించే ఏకవచన స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְעָשִׂיתָ
  choice: అమలు చేయాలి
  rationale: ఇక్కడ עשה ఆజ్ఞలు, కట్టడాలను ఆచరణలో పెట్టడం లేదా నిర్వర్తించడం అనే భావంలో ఉంది. ‘అమలు చేయాలి’ ఆధునిక తెలుగులో చట్టపరమైన సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: מִצְוָה యొక్క నిబంధనాత్మక, అధికారపూర్వక భావాన్ని నిలుపుతుంది.
- source_word: חֻקָּיו
  choice: కట్టడలను
  rationale: חֹק అనే చట్టపరమైన పదాన్ని ‘ఆజ్ఞలు’ నుంచి వేరు చేస్తూ, తెలుగు బైబిలు శైలిలో అర్థమయ్యే విధంగా అందిస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: మోషే ప్రస్తుతం పలుకుతున్న ఆజ్ఞ యొక్క తక్షణత్వాన్ని, ద్వితీయోపదేశకాండంలో పునరావృతమయ్యే ‘నేడు’ అనే నిబంధనాత్మక ప్రాధాన్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: וְשָׁמַעְתָּ בְּקוֹל లో వినడం–విధేయత సంబంధం
  choice: స్వరాన్ని వినాలి
  alternative: మాటకు లోబడాలి
  rationale: ఈ హీబ్రూ నానుడిలో విధేయత సూచితమైనప్పటికీ, దానిని కేవలం ‘లోబడడం’గా మార్చితే ‘స్వరం వినడం’ అనే మూల చిత్రణ కనుమరుగవుతుంది. తరువాతి వాక్యభాగం ఆచరణను స్పష్టంగా చెబుతుంది కాబట్టి, ప్రధాన పాఠ్యంలో ‘వినాలి’ అని ఉంచి ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా, హీబ్రూకు సమీపమైన లిప్యంతరీకరణను ఉపయోగించడం మూలంలోని నిబంధనాత్మక వ్యక్తిత్వాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. ఏకవచన సంబోధనను ‘నీవు/నీకు’తో నిలిపి, ‘ఆజ్ఞలు’ మరియు ‘కట్టడలు’ అనే వేర్వేరు చట్టపరమైన పదాలను కాపాడాం.
