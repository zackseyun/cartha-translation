  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: te
  text: తన తండ్రిని గాని తల్లిని గాని తృణీకరించేవాడు శాపగ్రస్తుడు. అప్పుడు ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాప ప్రకటనను తెలిపే నిష్క్రియార్థక రూపం; ఆధునిక తెలుగులో స్పష్టంగా, గంభీరంగా ఉంటుంది.
- source_word: מַקְלֶה
  choice: తృణీకరించేవాడు
  rationale: కלה హిఫిల్ రూపం ఒకరిని అల్పుడిగా, విలువలేనివాడిగా లేదా అవమానకరంగా చూడడం/చూడబట్టడం అనే భావాన్ని ఇస్తుంది; ‘తృణీకరించు’ ఆ సామాజిక-నైతిక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָבִיו וְאִמּוֹ
  choice: తన తండ్రిని గాని తల్లిని గాని
  rationale: హీబ్రూలో సంధానం ‘మరియు’ అయినప్పటికీ, శాప నిబంధన తల్లిదండ్రుల్లో ఎవరినైనా లేదా ఇద్దరినీ తృణీకరించడాన్ని వర్తింపజేస్తుంది; తెలుగు న్యాయసంబంధ వాడుకలో ‘గాని...గాని’ ఈ పంపిణీ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וְאָמַר
  choice: అప్పుడు ... చెప్పాలి
  rationale: క్రియ ఆరాధనా క్రమంలోని తదుపరి సమూహ ప్రతిస్పందనను ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ క్రమాన్ని, ‘చెప్పాలి’ విధిగా పలకవలసిన ప్రతిస్పందనను తెలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: మూలంలోని ‘ప్రజలందరూ’ అనే సాధారణ పదబంధాన్ని కాపాడుతుంది; స్పష్టంగా లేని ‘ఇశ్రాయేలు’ను చేర్చదు.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: నిబంధన సంబంధమైన గంభీర సమ్మతిని సూచించే ఆరాధనా పదాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: తల్లిదండ్రుల పట్ల చేసిన అపరాధ స్వభావం
  choice: ‘తృణీకరించేవాడు’ అని అనువదించి, వారిని అల్పులుగా లేదా విలువలేనివారిగా చూడడం/చూడబట్టడం అనే విస్తృత భావాన్ని నిలిపాం.
  alternative: ‘అవమానించేవాడు’ లేదా ‘చులకనగా చూసేవాడు’
  rationale: మూల క్రియ కేవలం అంతరంగ ద్వేషాన్ని లేదా మాటలతో దూషించడాన్ని మాత్రమే కాక, తల్లిదండ్రులను తేలికగా లేదా నీచంగా పరిగణించడాన్ని సూచిస్తుంది. ‘తృణీకరించు’ ఆ నైతిక తీవ్రతను అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన నిబంధన-ఆరాధనా శైలి. సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది; మూలంలో లేని వివరణను చేర్చలేదు.
