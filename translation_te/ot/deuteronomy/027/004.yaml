language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: te
  text: మీరు యొర్దాను నదిని దాటినప్పుడు, ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న ఈ రాళ్లను ఏబాలు కొండపై[a] నిలబెట్టాలి; వాటికి సున్నం పూయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని పాఠసంప్రదాయాలు, ముఖ్యంగా సమరయ పంచగ్రంథం, “ఏబాలు కొండ”కు బదులుగా “గెరిజీము కొండ” అని చదువుతాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: మీరు ... దాటినప్పుడు
  rationale: וְהָיָה తో కూడిన בְּ + క్రియానామ రూపం భవిష్యత్తులో జరిగే సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘దాటినప్పుడు’ సహజంగా ఆ కాలసంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను నది
  rationale: మూలంలో నది పేరు మాత్రమే ఉన్నా, ఆధునిక తెలుగు పాఠకులకు భౌగోళిక సూచన స్పష్టంగా ఉండేందుకు సహజమైన ‘నది’ని చేర్చాం; అర్థంలో కొత్త సమాచారం కలపదు.
- source_word: תָּקִימוּ
  choice: నిలబెట్టి
  rationale: קום యొక్క హిఫీల్ రూపం ఇక్కడ రాళ్లను నిలపడం లేదా నెలకొల్పడం అనే భౌతిక చర్యను సూచిస్తుంది. తరువాతి సమాన కర్తవ్యంతో సహజంగా అనుసంధానించేందుకు ‘నిలబెట్టి’ వాడాం.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: ఈ రాళ్లను
  rationale: మూలంలోని సాధారణ పదబంధాన్ని వ్యాఖ్యానాత్మకంగా ‘స్మారకాలు’ అని విస్తరించకుండా నేరుగా అనువదించాం.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన క్రియావిశేషణ రూపంలోని కొనసాగుతున్న ప్రత్యక్ష ఆజ్ఞ భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ నిలుపుతుంది.
- source_word: בְּהַר עֵיבָל
  choice: ఏబాలు కొండపై
  rationale: בְּ ఉపసర్గతో ఉన్న పర్వతనామం ఇక్కడ స్థలాన్ని సూచిస్తుంది. తెలుగు సహజ పదక్రమంలో ‘ఏబాలు కొండపై’ అని ఇచ్చాం.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: వాటికి సున్నం పూయాలి
  rationale: שׂוד పూయడం/పూత వేయడం అనే చర్యను, שׂיד సున్నపు పదార్థాన్ని సూచిస్తాయి. ‘సున్నం పూయాలి’ తెలుగులో రెండింటినీ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండము 27:4లోని పర్వతనామానికి సంబంధించిన పాఠాంతరం
  choice: ఏబాలు కొండ
  alternative: గెరిజీము కొండ
  rationale: అందించిన WLC మసొరెటిక్ పాఠం ‘ఏబాలు’ అని చదువుతుంది; కాబట్టి ప్రధాన పాఠంలో అదే ఉంచాం. సమరయ పంచగ్రంథం వంటి ప్రాముఖ్యమైన పాఠసంప్రదాయం ‘గెరిజీము’ అని చదవడం వల్ల ఆ పాఠాంతరాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, అయితే గంభీరతను నిలుపుకునే శైలి. ఆజ్ఞార్థాన్ని ‘పూయాలి’తో వ్యక్తం చేసి, వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత స్థలనామం వెంట ఉంచబడింది.
