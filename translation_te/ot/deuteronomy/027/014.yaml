source:
  edition: WLC
  text: וְ/עָנ֣וּ הַ/לְוִיִּ֗ם וְ/אָֽמְר֛וּ אֶל כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל ק֥וֹל רָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: te
  text: లేవీయులు ఇశ్రాయేలులోని ప్రతి పురుషునికి బిగ్గరగా ప్రత్యుత్తరమిస్తూ ఇలా చెప్పాలి:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరికి.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలులోని ప్రతి పురుషునికి” అని ఉంది; ఇక్కడ పుంలింగ ఏకవచనం సమూహానికి ప్రతినిధిగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: పలకాలి
  rationale: ענה ఇక్కడ తప్పనిసరిగా ప్రశ్నకు జవాబు ఇవ్వడం కాదు; ఆచారబద్ధమైన బహిరంగ ప్రకటనను ప్రారంభించే క్రియ. తెలుగులో ‘జవాబిచ్చి’ అనడం లేని ప్రశ్నను సూచించవచ్చు కాబట్టి, וְאָמְרוּతో కలిపి సహజంగా ‘ఇలా పలకాలి’ అని అనువదించబడింది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: హీబ్రూ వచనం ‘యాజకులు’ అని కాక స్పష్టంగా ‘లేవీయులు’ అని చెబుతుంది; అందువల్ల విస్తరించకుండా అదే పదం నిలుపబడింది.
- source_word: וְאָמְרוּ
  choice: ఇలా పలకాలి
  rationale: אמר సాధారణంగా ‘చెప్పు/పలుకు.’ తరువాత వచ్చే ప్రకటనకు పరిచయంగా తెలుగులో ‘ఇలా పలకాలి’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరితో
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు యొక్క ప్రతి పురుషునితో.’ ఏకవచన పుంలింగ రూపం సమూహ ప్రతినిధి భావంతో వాడబడింది; తెలుగులో సహజమైన సమూహ నిర్మాణంతో స్పష్టమైన పుంలింగాన్ని నిలుపుతుంది.
- source_word: קוֹל רָם
  choice: బిగ్గరగా
  rationale: ఈ పదబంధం అందరికీ వినిపించేలా గట్టిగా చేసే బహిరంగ ప్రకటనను సూచిస్తుంది. ‘బిగ్గరగా’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: אִישׁలోని పుంలింగ ప్రతినిధి భాష
  choice: ఇశ్రాయేలు పురుషులందరితో
  alternative: ఇశ్రాయేలీయులందరితో
  rationale: మూలంలో אִישׁ అనే స్పష్టమైన పుంలింగ ఏకవచనం సమూహార్థంలో ఉంది. ప్రధాన పాఠం ఆ రూపాన్ని ప్రతిబింబిస్తుంది; విస్తృత జాతీయ సమూహాన్ని సూచించే సహజ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞాత్మక శైలి వాడబడింది. ‘జవాబిచ్చి చెప్పాలి’ అనే అసహజమైన ద్విక్రియా నిర్మాణాన్ని నివారించి, రెండు హీబ్రూ క్రియల ప్రకటనాత్మక భావాన్ని ‘ఇలా పలకాలి’లో వ్యక్తం చేశాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
