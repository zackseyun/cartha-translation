id: DEU.27.13
reference: Deuteronomy 27:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: te
  text: 'శాపం కొరకు[a] ఏబాలు పర్వతం మీద నిలబడవలసినవారు వీరు: రూబేను, గాదు, ఆషేరు, జెబూలూను, దాను, నఫ్తాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాపం ప్రకటించడానికి” లేదా “శపించడానికి.”
    reason: עַל הַקְּלָלָה అనే హెబ్రీ పదబంధం శాపంతో సంబంధమున్న ఆచారపరమైన పాత్రను సంక్షిప్తంగా తెలుపుతుంది. సందర్భం శాపప్రకటనను సూచించినా, ఆ క్రియ మూలపాఠంలో స్పష్టంగా లేదు.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: మునుపటి వచనంలోని గోత్రాల సమూహానికి భిన్నమైన తదుపరి సమూహాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; వాక్య నిర్మాణంలో అనుసంధానం అంతర్లీనంగా ఉంది.
- source_word: יַעַמְדוּ
  choice: నిలబడవలసినవారు
  rationale: మోషే ఇచ్చిన ఆచారసంబంధమైన ఆదేశంలో భవిష్యత్ కర్తవ్యాన్ని తెలియజేస్తుంది.
- source_word: עַל הַקְּלָלָה
  choice: శాపం ప్రకటించడానికి
  rationale: ఈ ఆచార సందర్భంలో శాపంతో సంబంధమున్న నియామకాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; హెబ్రీలో చర్యకు సంబంధించిన క్రియ స్పష్టంగా లేకపోవడం వల్ల ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచాం.
- source_word: בְּהַר עֵיבָל
  choice: ఏబాలు కొండమీద
  rationale: పర్వతంపై ఉన్న స్థానాన్ని సహజ తెలుగు ప్రయోగంలో తెలియజేస్తుంది; పేరును తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: గోత్రనామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపంలో ఇచ్చాం.
- source_word: גָּד
  choice: గాదు
  rationale: గోత్రనామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపంలో ఇచ్చాం.
- source_word: אָשֵׁר
  choice: ఆషేరు
  rationale: గోత్రనామాన్ని హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగు పాఠకులకు పరిచితమైన రూపంలో ఇచ్చాం.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: గోత్రనామాన్ని హెబ్రీ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: דָּן
  choice: దాను
  rationale: గోత్రనామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపంలో ఇచ్చాం.
- source_word: נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: గోత్రనామాన్ని తెలుగులో సాధారణమైన బైబిలు రూపంలో ఇచ్చాం.
theological_decisions:
- issue: శాపానికి సంబంధించి గోత్రాల ఆచారపరమైన పాత్ర
  choice: శాపం ప్రకటించడానికి
  alternative: శాపం కోసం; శపించడానికి
  rationale: సందర్భం ఆశీర్వాదం, శాపం ప్రకటించే ఆచారాన్ని సూచిస్తున్నా, హెబ్రీ పాఠం ‘ప్రకటించు’ అనే క్రియను స్పష్టంగా ఇవ్వదు. ప్రధాన పాఠంలో సహజ తెలుగు కోసం సందర్భార్థాన్ని ఇచ్చి, మూలంలోని సంక్షిప్తతను పాదటీకలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. జాబితా నిర్మాణం మరియు ఆచార సందర్భపు గంభీరతను నిలబెట్టాం.
