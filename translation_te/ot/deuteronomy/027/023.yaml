- from: “తన అత్తతో పడుకునేవాడు[a] శాపగ్రస్తుడు.” అప్పుడు ప్రజలందరూ, “ఆమేన్” అని అనాలి.
  to: “తన అత్తతో పడుకునేవాడు[a] శాపగ్రస్తుడు.” ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  rationale: The revision removes the unsupported temporal “అప్పుడు,” improves the natural liturgical phrasing of the people’s response, and clarifies in the footnote that “అత్త” denotes the offender’s wife’s mother. It retains the Hebrew euphemism in the main text and preserves the masculine singular legal formulation.
