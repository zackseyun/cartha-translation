  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: te
  text: “తన అత్తతో పడుకునేవాడు[a] శాపగ్రస్తుడు.” ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, “తన భార్య తల్లితో లైంగిక సంబంధం పెట్టుకునేవాడు.” హెబ్రీలో అక్షరార్థంగా “తో పడుకునేవాడు” అనే సభ్యోక్తి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: ఇది నిబంధన సంబంధమైన శాప ప్రకటనను తెలిపే విధేయ విశేషణం. ‘శాపగ్రస్తుడు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గంభీరంగా ఉంది.
- source_word: שֹׁכֵב עִם
  choice: తో పడుకునేవాడు
  rationale: ఈ సందర్భంలో హెబ్రీ నుడికారం లైంగిక సంబంధాన్ని సూచిస్తుంది. ‘తో పడుకునేవాడు’ మూలంలోని సభ్యోక్తిని నిలుపుతూ, పాదటిప్పణిలో అర్థాన్ని స్పష్టం చేయడానికి వీలు కల్పిస్తుంది.
- source_word: חֹתַנְתּוֹ
  choice: తన అత్తతో
  rationale: ఈ పదం పురుషుని అత్తను, అంటే అతని భార్య తల్లిని సూచిస్తుంది. ‘తన అత్త’ సహజమైన తెలుగు బంధుత్వ పదం; సందర్భంలో పురుష ఏకవచన కర్తతో సరిపోతుంది.
- source_word: וְאָמַר
  choice: అప్పుడు ... అనాలి
  rationale: ఈ క్రియ ఇక్కడ ప్రజలు పలకవలసిన ఆరాధనా ప్రతిస్పందనను కొనసాగిస్తుంది. ‘అనాలి’ దాని నిర్దేశాత్మక బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: హెబ్రీలో ఉన్న ‘ప్రజలందరూ’ అనే అర్థాన్నే, సందర్భం నుంచి అదనపు గుర్తింపును చేర్చకుండా అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: హెబ్రీ ఆరాధనా ప్రతిస్పందనను తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణతో నిలుపుతుంది.
theological_decisions:
- issue: లైంగిక చర్యను సూచించే సభ్యోక్తి
  choice: ‘తో పడుకునేవాడు’ అని హెబ్రీ నుడికారాన్ని నిలుపడం
  alternative: ‘లైంగిక సంబంధం పెట్టుకునేవాడు’ అని స్పష్టంగా చెప్పడం
  rationale: మూలంలోని సభ్యోక్తితో కూడిన న్యాయశైలిని కాపాడుతూ, అపార్థం రాకుండా పాదటిప్పణిలో ఉద్దేశిత అర్థాన్ని వివరిస్తుంది.
- issue: పురుష ఏకవచన కర్త
  choice: ‘పడుకునేవాడు’ అనే పురుష ఏకవచన రూపం
  alternative: లింగాన్ని సూచించని ‘పడుకునే వ్యక్తి’
  rationale: హెబ్రీ క్రియావిశేషణం వ్యాకరణపరంగా పురుష ఏకవచనంలో ఉంది; సంబంధ పదంలోని మూడవ పురుష ఏకవచన ప్రత్యయం కూడా దానికి అనుగుణంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన న్యాయ-ఆరాధనా శైలి. మూలంలోని లైంగిక సభ్యోక్తి ప్రధాన పాఠ్యంలో నిలుపబడింది; దాని అర్థం పాదటిప్పణిలో స్పష్టం చేయబడింది.
