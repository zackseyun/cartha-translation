source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: te
  text: “తన తండ్రి భార్యతో[a] శయనించేవాడు శాపగ్రస్తుడు; ఎందుకంటే అతడు తన తండ్రి వస్త్రపు అంచును బయలుపరచాడు[b].” మరియు ప్రజలందరూ, “ఆమేన్” అని పలకాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘తండ్రి భార్య’ అనేది సందర్భానుసారం ‘సవతి తల్లి’ని సూచించవచ్చు; అయితే హీబ్రూ మూలంలో ‘సవతి తల్లి’ అనే నిర్దిష్ట పదం లేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘తన తండ్రి వస్త్రపు అంచును బయలుపరచాడు’ అని ఉంటుంది. ఇది లేవీయకాండము 18:8; 20:11లోని లైంగిక మర్యాదోక్తి భాషతో సంబంధం కలిగి ఉంది; భావరీత్యా ‘తన తండ్రి నగ్నత్వాన్ని బయలుపరచాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాపప్రకటనను స్పష్టంగా, గంభీరంగా తెలిపే ఆధునిక తెలుగు పదం.
- source_word: שֹׁכֵב עִם
  choice: తో శయనించేవాడు
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ మర్యాదోక్తిని, దాని న్యాయపరమైన గంభీరతను కాపాడుతూ అనువదిస్తుంది.
- source_word: אֵשֶׁת אָבִיו
  choice: తన తండ్రి భార్య
  rationale: మూలంలోని బంధుత్వ వర్ణనను యథాతథంగా ఉంచి, ‘సవతి తల్లి’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: శాపానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: తన తండ్రి వస్త్రపు అంచును విప్పాడు
  rationale: כָּנָף అనే పదంలోని ‘వస్త్రపు అంచు/చెంగు’ చిత్రాన్ని, దానిలోని లైంగిక మర్యాదోక్తిని స్పష్టీకరించి సమతలపరచకుండా నిలుపుతుంది.
- source_word: וְאָמַר כָּל הָעָם
  choice: అప్పుడు ప్రజలందరూ … అని పలకాలి
  rationale: సమాజమంతా ఇవ్వవలసిన ఆచారబద్ధమైన నిబంధన ప్రతిస్పందనను సహజమైన తెలుగు విధ్యర్థక రూపంలో అందిస్తుంది.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: హీబ్రూ ఆరాధనా ప్రతిస్పందనను తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో నిలుపుతుంది.
theological_decisions:
- issue: లైంగిక నిషేధాన్ని తెలిపే మర్యాదోక్తి అనువాదం
  choice: ‘తన తండ్రి వస్త్రపు అంచును విప్పాడు’ అనే మూలరూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘తన తండ్రి నగ్నత్వాన్ని బయలుపరిచాడు’ లేదా ‘తన తండ్రి వైవాహిక హక్కును ఉల్లంఘించాడు’
  rationale: ఈ పదబంధం లేవీయకాండంలోని లైంగిక నిషేధ భాషను జ్ఞాపకం చేస్తూ తండ్రి వైవాహిక హక్కు, గౌరవం రెండింటినీ సూచించవచ్చు. దాని ఖచ్చితమైన నుడికారం వివాదాస్పదమైనందున వివరణాత్మక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా పాదసూచికలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయపరమైన, ఆచారబద్ధమైన గంభీరతను నిలిపే శైలి. ‘శయనించేవాడు’ మర్యాదోక్తిని కాపాడుతుంది; ‘వస్త్రపు అంచు’ అరుదైన ‘చెంగు’ కంటే సామాన్య పాఠకులకు స్పష్టంగా ఉంటుంది.
