revisions:
- from: “తన తండ్రి భార్యతో[a] శయనించేవాడు శాపగ్రస్తుడు; ఎందుకంటే అతడు తన తండ్రి వస్త్రపు అంచును విప్పాడు[b].” అప్పుడు ప్రజలందరూ, “ఆమేన్” అని పలకాలి.
  to: “తన తండ్రి భార్యతో[a] శయనించేవాడు శాపగ్రస్తుడు; ఎందుకంటే అతడు తన తండ్రి వస్త్రపు అంచును బయలుపరచాడు[b].” మరియు ప్రజలందరూ, “ఆమేన్” అని పలకాలి.
  rationale: The revision corrects the central verb to reflect גִלָּה (‘uncovered/exposed’) while retaining the Hebrew metaphor of the father’s כָּנָף (‘wing, edge, skirt/covering’) rather than resolving its disputed sexual implication in the main text. “మరియు” reflects the Hebrew conjunction without adding the temporal nuance of “అప్పుడు.”
