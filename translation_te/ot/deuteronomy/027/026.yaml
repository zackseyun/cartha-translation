source:
  edition: WLC
  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: te
  text: “ఈ ధర్మశాస్త్రపు మాటలను ఆచరించడం ద్వారా నిలబెట్టని వ్యక్తి శాపగ్రస్తుడు.” ప్రజలందరూ, “ఆమేన్” అని చెప్పాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిలబెట్టడం” అనే హెబ్రీ క్రియకు “ధృవీకరించడం” లేదా “స్థాపించడం” అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ అది “ఆచరించడం ద్వారా” అనే మాటతో కలసి, ధర్మశాస్త్రపు అధికారాన్ని విధేయతలో అమలులో ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడు
  rationale: నిబంధన సంబంధమైన శాప ప్రకటనను స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר
  choice: నిలబెట్టనివాడు
  rationale: హెబ్రీ ఏకవచన సంబంధవాచకానికి సాధారణంగా ఎవరినైనా సూచించే సహజమైన తెలుగు రూపం.
- source_word: לֹא יָקִים
  choice: నిలబెట్టనివాడు
  rationale: קום హిఫీల్ రూపంలోని నిలిపి ఉంచడం, స్థిరపరచడం, అమలులో ఉంచడం అనే భావాలను కాపాడుతుంది; తరువాతి ‘ఆచరించడం ద్వారా’ అనే మాటతో దీనిని కేవలం మౌఖిక ధృవీకరణగా పరిమితం చేయదు.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని మాటలను
  rationale: דברים యొక్క ‘మాటలు’ అనే భావాన్నీ, ద్వితీయోపదేశకాండంలోని నిబంధన సందర్భంలో תורה యొక్క ‘ధర్మశాస్త్రం’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: ఆచరించడం ద్వారా వాటిని
  rationale: ధర్మశాస్త్రపు మాటలను నిలబెట్టడం ఆచరణాత్మక విధేయత ద్వారా జరుగుతుందనే సాధనార్థక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָמַר כָּל הָעָם
  choice: అప్పుడు ప్రజలందరూ ... అని చెప్పాలి
  rationale: ఆచారపరమైన నిబంధన ప్రతిస్పందనగా నిర్దేశాత్మక భావాన్ని తెలియజేస్తుంది; దీనిని గతకాల కథనంగా మార్చదు.
- source_word: אָמֵן
  choice: ఆమేన్
  rationale: సమూహపు ఆచారపరమైన సమ్మతిని తెలిపే స్థిరపడిన తెలుగు బైబిలు పదాన్ని ఉంచుతుంది.
theological_decisions:
- issue: יָקִים ... לַעֲשׂוֹת אֹתָם లోని నిబంధనబద్ధ బాధ్యత
  choice: ధర్మశాస్త్రపు మాటలను ఆచరణాత్మక విధేయత ద్వారా నిలబెట్టని వ్యక్తిపై శాపం ప్రకటించబడుతుంది.
  alternative: ధర్మశాస్త్రాన్ని బహిరంగంగా ధృవీకరించని లేదా అధికారికంగా స్థాపించని వ్యక్తిపై మాత్రమే శాపం ప్రకటించబడుతుంది.
  rationale: హెబ్రీ వాక్యం ‘నిలబెట్టడం/స్థాపించడం’ అనే క్రియను ‘వాటిని చేయడం’తో కలుపుతుంది. అందువల్ల అనువాదం మౌఖిక సమ్మతికన్నా ఆచరణను సూచిస్తూ, రెండు అంశాల మధ్య ఉన్న భావసంబంధాన్ని కాపాడుతుంది.
- issue: אֲשֶׁר యొక్క సాధారణ వ్యక్తి సూచన
  choice: నిలబెట్టనివాడు
  alternative: ఎవడైతే ... వాడే; ఆ మనుష్యుడు
  rationale: హెబ్రీలోని పుంలింగ ఏకవచనం ప్రతినిధి స్వభావంతో సాధారణ వ్యక్తిని సూచిస్తుంది. తెలుగు రూపం లింగాన్ని అనవసరంగా ముందుకు తేవకుండా ఆ సాధారణ వర్తింపును సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నిబంధన-ఆచార శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం,’ ‘శాపగ్రస్తుడు,’ ‘ఆమేన్’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యే స్థిరమైన బైబిలు పదజాలం. మూలంలోని క్రియార్థ సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
