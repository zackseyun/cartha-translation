  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: te
  text: 'అప్పుడు మోషే మరియు లేవీయ యాజకులు ఇశ్రాయేలీయులందరితో ఇలా అన్నారు: “ఇశ్రాయేలూ, మౌనంగా ఉండి విను![a] ఈ రోజు నీవు నీ దేవుడైన యహ్వేకు ఒక ప్రజగా అయ్యావు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శ్రద్ధగా ఉండి విను.” హెబ్రీ ఆజ్ఞాపదం మౌనాన్ని లేదా ఏకాగ్ర శ్రద్ధను నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ దేవుడైన యహ్వేకు చెందిన ప్రజగా అయ్యావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజమైన కథన ప్రవాహాన్ని ఇస్తుంది. బహువచన కర్తలకు అనుగుణంగా ‘అన్నారు’ వాడబడింది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయ యాజకులు
  rationale: యాజకులను లేవీయులుగా గుర్తించే హెబ్రీ సమాసానుబంధాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరితో
  rationale: దేశ సమాజమంతటినీ ఉద్దేశించిన సమష్టి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַסְכֵּת
  choice: మౌనంగా ఉండి
  rationale: వినడానికి ముందు నిశ్శబ్దంగా, శ్రద్ధతో ఉండమనే ఆజ్ఞ యొక్క ప్రాథమిక భావాన్ని నిలుపుతుంది; ‘శ్రద్ధగా ఉండు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּשְׁמַע
  choice: విను
  rationale: శ్రద్ధతో స్వీకరించమనే ఆజ్ఞను ఆధునిక తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హెబ్రీ నిర్దేశక కాలపదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: נִהְיֵיתָ לְעָם
  choice: నీవు ... ఒక ప్రజవయ్యావు
  rationale: ఇశ్రాయేలును ఒక సమష్టి వ్యక్తిగా సంబోధించే రెండవ పురుష ఏకవచనాన్ని ‘నీవు’ ద్వారా కాపాడుతుంది; לְעָם లోని అనిర్దిష్టతను ‘ఒక ప్రజ’ ప్రతిబింబిస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: היה + ל నిర్మాణంలోని సంబంధం లేదా చెందినదనపు భావాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ఉంచి, మరింత స్పష్టమైన ‘చెందిన’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఇశ్రాయేలును సమష్టి ఏకవచనంగా సంబోధించే రెండవ పురుష ఏకవచన ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణతో అందిస్తుంది.
- issue: ఇశ్రాయేలుకు సమష్టి ఏకవచన సంబోధన
  choice: నీవు ... ప్రజవయ్యావు
  alternative: మీరు ... ప్రజలయ్యారు
  rationale: హెబ్రీలోని రెండవ పురుష ఏకవచన రూపాలు ఇశ్రాయేలును ఒక సమష్టి ఒడంబడిక సమాజంగా సంబోధిస్తాయి; తెలుగు ఏకవచనం ఆ వాక్చాతుర్యాన్ని నిలుపుతుంది.
- issue: యహ్వేతో ప్రజకు ఉన్న సంబంధం
  choice: యహ్వేకు ఒక ప్రజవయ్యావు
  alternative: యహ్వేకు చెందిన ప్రజవయ్యావు
  rationale: לַיהוָה లో ప్రయోజనం, సంబంధం, చెందినదనం వంటి ఛాయలు ఉన్నాయి. ప్రధాన పాఠ్యం హెబ్రీ నిర్మాణపు సంక్షిప్తతను కాపాడుతుంది; స్పష్టమైన చెందినదనపు భావం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇశ్రాయేలూ’ అనే సంబోధన, ‘నీవు’ అనే సమష్టి ఏకవచనం మూలపాఠ్యపు ఒడంబడిక ధోరణిని నిలుపుతాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
