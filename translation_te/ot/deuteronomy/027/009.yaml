revisions:
- from: 'అప్పుడు మోషే, లేవీయ యాజకులు ఇశ్రాయేలీయులందరితో ఇలా అన్నారు: “ఇశ్రాయేలూ, మౌనంగా ఉండి విను![a] ఈ రోజు నీవు నీ దేవుడైన యహ్వేకు ఒక ప్రజవయ్యావు.[b]”'
  to: 'అప్పుడు మోషే మరియు లేవీయ యాజకులు ఇశ్రాయేలీయులందరితో ఇలా అన్నారు: “ఇశ్రాయేలూ, మౌనంగా ఉండి విను![a] ఈ రోజు నీవు నీ దేవుడైన యహ్వేకు ఒక ప్రజగా అయ్యావు.[b]”'
