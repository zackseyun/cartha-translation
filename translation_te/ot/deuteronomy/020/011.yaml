  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֙ אִם שָׁל֣וֹם תַּֽעַנְ/ךָ֔ וּ/פָתְחָ֖ה לָ֑/ךְ וְ/הָיָ֞ה כָּל הָ/עָ֣ם הַ/נִּמְצָא בָ֗/הּ יִהְי֥וּ לְ/ךָ֛ לָ/מַ֖ס וַ/עֲבָדֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: te
  text: అది నీకు శాంతితో జవాబిచ్చి, నీకు తెరుచుకుంటే[a], దానిలో ఉన్న ప్రజలందరూ నీకు బలవంతపు శ్రమకు లోబడినవారై[b] నిన్ను సేవిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీకు తెరిస్తే’; సందర్భంలో పట్టణం తన ద్వారాలను తెరవడాన్ని సూచిస్తుంది.
    reason: implicit_object
  - marker: b
    text: లేదా, ‘నీకు కప్పపు శ్రమకు లోబడినవారై.’ హీబ్రూ మַס పన్ను, కప్పం, లేదా నిర్బంధ శ్రమను సూచించవచ్చు; ఇక్కడి సందర్భంలో బలవంతపు శ్రమ-సేవ భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: శాంతితో
  rationale: ఈ యుద్ధ సందర్భంలో నామవాచకమైన שָׁלוֹם శాంతియుతమైన ప్రతిస్పందనను సూచిస్తుంది. సహజమైన తెలుగులో ‘శాంతితో జవాబిచ్చి’ అని ఇవ్వడం మూలార్థాన్ని నిలుపుతుంది.
- source_word: תַּעַנְךָ
  choice: నీకు ... జవాబిచ్చి
  rationale: ענה అంటే ఇక్కడ ‘జవాబివ్వడం/ప్రతిస్పందించడం.’ పట్టణాన్ని ఏకవచనంగా వ్యక్తీకరించిన మూల నిర్మాణాన్ని ‘అది’ ద్వారా నిలిపాం.
- source_word: וּפָתְחָה לָךְ
  choice: నీకోసం తలుపులు తెరిస్తే
  rationale: మూలంలో కేవలం ‘నీకు తెరిస్తే’ అని ఉన్నా, తెలుగులో అది అసంపూర్ణంగా వినిపిస్తుంది. పట్టణం సందర్భంలో సహజంగా అంతర్భూతమైన ‘తలుపులు’ను స్పష్టం చేశాం; ఇది ‘ద్వారాలు’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: దానిలో ఉన్న ప్రజలందరూ
  rationale: నמצא అనే పదబంధానికి అక్షరార్థం ‘దానిలో కనబడినవారు.’ అయితే ఆధునిక తెలుగులో ‘దానిలో ఉన్న ప్రజలందరూ’ సహజంగా ఉండి, పట్టణంలో ఉన్న మొత్తం ప్రజలను సూచిస్తుంది.
- source_word: לָמַס
  choice: వెట్టిచాకిరి చేసేవారై
  rationale: מַס పన్ను, కప్పం, బలవంతపు శ్రమ అనే అర్థాలు కలిగి ఉంటుంది. వెంటనే వచ్చే ‘నిన్ను సేవించాలి’ అనే మాట వల్ల ఇక్కడ బలవంతపు శ్రమ భావం బలంగా ఉంది. ‘వెట్టిచాకిరి’ ఆ నిర్బంధ స్వభావాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַעֲבָדוּךָ
  choice: నిన్ను సేవించాలి
  rationale: עבד యొక్క సాధారణ అర్థం ‘సేవించు/పనిచేయు.’ ‘సేవించాలి’ లోబడిన సేవను తెలియజేస్తూ, మూలం చెప్పనంత నిర్దిష్టమైన సామాజిక వ్యవస్థను చేర్చదు.
theological_decisions:
- issue: యుద్ధ ధర్మశాస్త్రంలో లోబరచే భాషను అనువదించడం
  choice: ‘నీకు వెట్టిచాకిరి చేసేవారై నిన్ను సేవించాలి’ అని బలవంతపు శ్రమ భావాన్ని నిలుపడం
  alternative: ‘నీకు కప్పం చెల్లించి నిన్ను సేవించాలి’
  rationale: ఈ వచనం శాంతి ప్రతిపాదనను అంగీకరించిన పట్టణానికి విధించే నిర్బంధ సేవను వివరిస్తుంది. מַס లోని కప్పం/శ్రమ అనే అర్థ పరిధిని గమనిస్తూ, తరువాతి עבד క్రియ కారణంగా శ్రమసేవ భావాన్ని ప్రధానంగా తీసుకున్నాం; వచనంలోని కఠినతను మెత్తబరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘వెట్టిచాకిరి’ కొంత చారిత్రక వర్ణం కలిగినా, బలవంతపు శ్రమ అనే భావాన్ని సాధారణ పాఠకునికి సంక్షిప్తంగా తెలియజేస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
