revisions:
- from: అది నీకు శాంతితో జవాబిచ్చి, నీకోసం తలుపులు తెరిస్తే[a], దానిలో ఉన్న ప్రజలందరూ నీకు వెట్టిచాకిరి చేసేవారై[b] నిన్ను సేవించాలి.
  to: అది నీకు శాంతితో జవాబిచ్చి, నీకు తెరుచుకుంటే[a], దానిలో ఉన్న ప్రజలందరూ నీకు బలవంతపు శ్రమకు లోబడినవారై[b] నిన్ను సేవిస్తారు.
