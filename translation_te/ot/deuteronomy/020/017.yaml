revisions:
- from: కాని హిత్తీయులు, అమోరీయులు, కనానీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు—వీరిని నీ దేవుడైన యెహోవా నీకు ఆజ్ఞాపించినట్లే పూర్తిగా నాశనానికి అంకితం చేయాలి[a].
  to: కాని నీవు హిత్తీయులను, అమోరీయులను, కనానీయులను, పెరిజ్జీయులను, హివ్వీయులను, యెబూసీయులను పూర్తిగా నాశనానికి అంకితం చేయాలి[a]—నీ దేవుడైన యెహోవా నీకు ఆజ్ఞాపించినట్లే.
