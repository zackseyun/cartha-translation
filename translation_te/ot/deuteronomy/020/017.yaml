source:
  edition: WLC
  text: כִּֽי הַחֲרֵ֣ם תַּחֲרִימֵ֗/ם הַ/חִתִּ֤י וְ/הָ/אֱמֹרִי֙ הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: te
  text: కాని నీవు హిత్తీయులను, అమోరీయులను, కనానీయులను, పెరిజ్జీయులను, హివ్వీయులను, యెబూసీయులను పూర్తిగా నాశనానికి అంకితం చేయాలి[a]—నీ దేవుడైన యెహోవా నీకు ఆజ్ఞాపించినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః భావం: “వారిని తప్పక నిషేధానికి అప్పగించాలి.” ఇక్కడి క్రియ వారిని సంపూర్ణంగా నాశనానికి అంకితం చేయడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కాని
  rationale: మునుపటి వచనంలో దూరప్రాంతాల పట్టణాల ప్రజలను ప్రాణాలతో ఉంచవచ్చనే ఆదేశానికి విరుద్ధంగా ఈ ఆజ్ఞను ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో ‘కాని’ సహజమైన వ్యతిరేక అనుసంధానం.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: వీరిని పూర్తిగా నాశనానికి అంకితం చేయాలి
  rationale: క్రియారూపానికి ముందు అదే ధాతువుగల infinitive absolute రావడం ఆజ్ఞను బలపరుస్తుంది. חרם సాధారణంగా చంపడం మాత్రమే కాక, దైవాజ్ఞ ప్రకారం సంపూర్ణ నిషేధానికి—ఇక్కడ నాశనానికి—అప్పగించడాన్ని సూచిస్తుంది.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: హిత్తీయులు, అమోరీయులు, కనానీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు
  rationale: ఏకవచన సమూహనామాలను తెలుగులో ప్రజాసమూహాలను సూచించే ప్రామాణిక బహువచన రూపాలతో అందించింది.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: నీకు ఆజ్ఞాపించినట్లే
  rationale: ముందుగా ఇవ్వబడిన దైవాజ్ఞకు అనుగుణతను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష నామరూపంతో అందించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన స్వామ్యసూచనతో కూడిన నిబంధనాత్మక సంబోధనను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ ఆజ్ఞలో חרם పదబంధం
  choice: పూర్తిగా నాశనానికి అంకితం చేయాలి
  alternative: పూర్తిగా నాశనం చేయాలి; నిషేధానికి అప్పగించాలి
  rationale: హీబ్రూ పదబంధంలోని సంపూర్ణతను, అలాగే దైవాజ్ఞ కింద నాశనానికి ప్రత్యేకంగా అప్పగించే న్యాయ-ఆరాధనా ఛాయను రెండింటినీ నిలుపుతుంది; సాధారణ హింసను సూచించే మాటగా మాత్రమే కుదించదు.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: తెలుగు పాఠకులకు పరిచితమైన ప్రత్యక్ష నామరూపాన్ని ఉపయోగించి, మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. జాతినామాలకు సాధారణ తెలుగు బైబిలు రూపాలు వాడబడ్డాయి; חרם యొక్క ప్రత్యేక భావాన్ని ప్రధాన పాఠం మరియు పాదసూచన కలిపి సంరక్షించాయి.
