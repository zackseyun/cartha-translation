translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి వాడబడింది. ‘ఇశ్రాయేలూ, విను!’ అనే సూత్రబద్ధ పిలుపు మరియు వరుసగా వచ్చే మూడు భయనిషేధాల తీవ్రత నిలుపబడ్డాయి; సమూహాన్ని ఉద్దేశించిన హీబ్రూ ఏకవచన ‘హృదయం’ రూపకం కూడా కాపాడబడింది.
