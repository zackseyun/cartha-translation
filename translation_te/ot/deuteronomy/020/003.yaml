source:
  edition: WLC
  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: te
  text: 'వారితో ఇలా చెప్పాలి: “ఇశ్రాయేలూ, విను! మీరు ఈ రోజు మీ శత్రువులతో యుద్ధం చేయడానికి సమీపిస్తున్నారు. మీ హృదయం బలహీనపడనివ్వకండి[a]. భయపడకండి; భయంతో తత్తరపడకండి[b]; వారి ఎదుట హడలిపోకండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అధైర్యపడకండి.” హీబ్రూ నుడికారం అక్షరార్థంగా హృదయం బలహీనపడటాన్ని సూచిస్తుంది; భావం ధైర్యం కూలిపోకూడదనేది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కలవరపడకండి.” ఇక్కడి హీబ్రూ క్రియ కేవలం తొందరను కాక, భయంతో కలిగే గందరగోళాన్ని లేదా తత్తరపాటును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: వారితో ఇలా చెప్పాలి
  rationale: ముందున్న నియమబద్ధమైన ఆదేశక్రమంలో ఈ waw-prefixed perfect తదుపరి చేయవలసిన కార్యాన్ని సూచిస్తుంది. కాబట్టి సాధారణ భూతకాలంగా కాక విధ్యర్థకంగా అనువదించబడింది.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ, విను!
  rationale: ద్వితీయోపదేశకాండంలోని ఒడంబడిక పిలుపు శైలిని నిలుపుతూ, వినడమేకాక శ్రద్ధగా ఆలకించి స్పందించాలనే భావాన్ని కూడా మోస్తుంది.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: ఈ రోజు ... యుద్ధం చేయడానికి సమీపిస్తున్నారు
  rationale: వర్తమాన కృదంతం యుద్ధానికి చేరువవుతున్న తక్షణ పరిస్థితిని సూచిస్తుంది; తెలుగు సహజత్వం కోసం గమ్యార్థాన్ని ‘యుద్ధం చేయడానికి’ అని వ్యక్తం చేశాం.
- source_word: עַל אֹיְבֵיכֶם
  choice: మీ శత్రువులతో
  rationale: యుద్ధ సందర్భంలో עַל ప్రతికూల పోరాట సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘శత్రువులతో యుద్ధం’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: మీ హృదయం బలహీనపడనివ్వకండి
  rationale: ధైర్యం కూలిపోవడాన్ని తెలిపే హీబ్రూ హృదయ రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
- source_word: אַל תִּירְאוּ
  choice: భయపడకండి
  rationale: యרא అనే క్రియకు నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: וְאַל תַּחְפְּזוּ
  choice: భయంతో తత్తరపడకండి
  rationale: ఇక్కడ భావం కేవలం తొందరపడటం కాదు; యుద్ధభయంతో అదుపు తప్పి కలవరపడటాన్ని సూచిస్తుంది. ‘తత్తరపడకండి’ ఆ స్పందనను సహజంగా తెలియజేస్తుంది.
- source_word: וְאַל תַּעַרְצוּ מִפְּנֵיהֶם
  choice: వారి ఎదుట హడలిపోకండి
  rationale: శత్రువుల సన్నిధిలో తీవ్రమైన భయానికి లోనవడాన్ని సూచించే బలమైన నిషేధాన్ని, ‘ఎదుట’ అనే మూలభాషా స్థానసంబంధ చిత్రంతో కలిపి నిలిపాం.
