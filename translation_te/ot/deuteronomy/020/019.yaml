  source_fidelity: 'మొత్తంగా మూలార్థాన్ని బాగా ప్రతిబింబిస్తుంది: దీర్ఘ ముట్టడి, పట్టణాన్ని స్వాధీనం చేసుకోవాలనే ఉద్దేశం, చెట్లను గొడ్డలితో నాశనం చేయరాదన్న ఆజ్ఞ, వాటి నుండి తినవచ్చన్న కారణం అన్నీ ఉన్నాయి. అయితే వావ్-సంబంధకాన్ని ‘కాబట్టి’గా అనువదించడం మూలంలో స్పష్టంగా లేని తార్కిక నిర్ధారణను కొద్దిగా బలపరుస్తుంది. చివరి క్లిష్ట వాక్యభాగాన్ని అలంకారప్రశ్నగా ఉంచడం సమర్థనీయం; పాదసూచికలో ప్రత్యామ్నాయాలు ఉండాలి.'
  naturalness: ‘దానితో యుద్ధం చేస్తూ’ కంటే పట్టణానికి సంబంధించి ‘దానికి వ్యతిరేకంగా యుద్ధం చేస్తూ’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది. చివరి ప్రశ్నలో ‘ముట్టడిలో నీ ఎదుటికి రావడానికి’ అనే ఉద్దేశార్థక పదబంధం ప్రశ్నతో కలిసినప్పుడు కొద్దిగా అసహజంగా ఉంది; ‘ముట్టడిలో నీకు ఎదురుగా వచ్చేది’ మరింత సహజంగా, మూలంలోని భావాన్ని కాపాడుతుంది.
  terminology: ‘ముట్టడి,’ ‘స్వాధీనం చేసుకోవడం,’ ‘గొడ్డలి మోపి,’ ‘నరకడం’ సందర్భోచితమైన ఆధునిక ప్రామాణిక పదాలు. ‘నీవు’ అనే ఏకవచన సంబోధన కూడా మూలానికి అనుగుణం.
