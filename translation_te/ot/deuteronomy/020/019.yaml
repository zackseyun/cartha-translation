  revision_rationale: చిన్న శైలీ-నిష్ఠ సవరణలు మాత్రమే అవసరం. పట్టణంతో యుద్ధం అనే ప్రయోగాన్ని ‘దానికి వ్యతిరేకంగా యుద్ధం’గా స్పష్టం చేశాం. మూలంలోని సాధారణ అనుసంధానాన్ని ‘కాబట్టి’ స్థానంలో ‘మరియు’గా ఇచ్చాం. చివరి క్లిష్ట హీబ్రూ వాక్యభాగాన్ని ఎంచుకున్న అలంకారప్రశ్న పఠనంగానే ఉంచి, తెలుగులో ప్రశ్న సహజంగా వినిపించేలా పదక్రమాన్ని మార్చాం. పాదసూచిక ప్రత్యామ్నాయ పఠనాలను, వాటి సందిగ్ధతను యథాతథంగా సంరక్షిస్తుంది.
