    rationale: ‘ముట్టడిలో నీ ఎదుటికి రావడానికి పొలంలోని చెట్టు మనిషా?’ అనే క్రమం ఉద్దేశార్థకంగా వినిపిస్తుంది. ‘పొలంలోని చెట్టు మనిషా, ముట్టడిలో నీకు ఎదురుగా వచ్చేది?’ ప్రశ్నను తెలుగులో మరింత సహజంగా చేస్తుంది; సందిగ్ధ మూలపాఠాన్ని పరిష్కరించకుండా అదే రీతిగా ఉంచుతుంది.
  revised_text: నీవు ఒక పట్టణాన్ని స్వాధీనం చేసుకోవడానికి దానికి వ్యతిరేకంగా యుద్ధం చేస్తూ, దాన్ని చాలాకాలం ముట్టడించినప్పుడు, దాని చెట్లమీద గొడ్డలి మోపి వాటిని నాశనం చేయకూడదు. వాటి నుండి నీవు తినవచ్చు; మరియు వాటిని నరకకూడదు. పొలంలోని చెట్టు మనిషా, ముట్టడిలో నీకు ఎదురుగా వచ్చేది?[a]
