source:
  edition: WLC
  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: te
  text: నీవు ఒక పట్టణాన్ని స్వాధీనం చేసుకోవడానికి దానికి వ్యతిరేకంగా యుద్ధం చేస్తూ, దాన్ని చాలాకాలం ముట్టడించినప్పుడు, దాని చెట్లమీద గొడ్డలి మోపి వాటిని నాశనం చేయకూడదు. వాటి నుండి నీవు తినవచ్చు; మరియు వాటిని నరకకూడదు. పొలంలోని చెట్టు మనిషా, ముట్టడిలో నీకు ఎదురుగా వచ్చేది?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే మనిషి పొలంలోని చెట్టు”; లేదా, “ఎందుకంటే పొలంలోని చెట్టు మనిషికి ఆహారం.” ఈ చివరి వాక్యభాగంలోని హీబ్రూ క్లిష్టంగా ఉంది. ప్రధాన పాఠం చెట్టును మానవ శత్రువుతో వ్యత్యాసపరచే అలంకారప్రశ్నగా దాన్ని అనువదించింది.
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: ముట్టడించినప్పుడు
  rationale: צור అనే క్రియ ఇక్కడ ఒక పట్టణాన్ని సైనికంగా చుట్టుముట్టి ముట్టడించడాన్ని సూచిస్తుంది. ‘ముట్టడించు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సైనిక పదం.
- source_word: יָמִים רַבִּים
  choice: చాలాకాలం
  rationale: అక్షరార్థంగా ‘అనేక రోజులు.’ తెలుగులో ముట్టడి దీర్ఘకాలం కొనసాగడాన్ని ‘చాలాకాలం’ సహజంగా తెలియజేస్తుంది.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: దాన్ని స్వాధీనం చేసుకోవడానికి దానితో యుద్ధం చేస్తూ
  rationale: 'రెండు ప్రయోజన/పరిస్థితి భావాలను నిలుపుతుంది: పట్టణంతో యుద్ధం చేయడం, దాన్ని పట్టుకోవడం. పట్టణ సందర్భంలో ‘స్వాధీనం చేసుకోవడం’ సహజం.'
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: దాని చెట్లను నాశనం చేయకూడదు
  rationale: שׁחת హిఫీల్ రూపంలోని బలమైన ‘నాశనం చేయు/పాడుచేయు’ భావాన్ని ‘నాశనం చేయు’ నిలుపుతుంది. హీబ్రూ ఏకవచనం సమష్టి భావంలో ఉన్నందున తెలుగులో బహువచనం సహజం.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: దాని చెట్లమీద గొడ్డలి మోపి
  rationale: గొడ్డలిని చెట్టు మీద ప్రయోగించడాన్ని తెలిపే హీబ్రూ నుడికారానికి ‘గొడ్డలి మోపు’ సహజమైన తెలుగు సమానార్థకం; అదనపు విధాన వివరాలను చేర్చదు.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: వాటి నుంచి నీవు తినవచ్చు
  rationale: చెట్లు ఆహారాన్ని అందిస్తాయనే కారణాన్ని తెలియజేస్తుంది. మూలంలో లేని ‘పండ్లు’ అనే పదాన్ని చేర్చకుండా భావాన్ని నిలుపుతుంది.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: కాబట్టి వాటిని నరకకూడదు
  rationale: כרת చెట్ల సందర్భంలో ‘నరుకు’ అని సహజంగా అనువదించబడుతుంది. וְ ఇక్కడ ముందున్న కారణానికి అనుసంధానంగా ఉండటంతో ‘కాబట్టి’ తెలుగు వాక్యప్రవాహాన్ని స్పష్టం చేస్తుంది.
- source_word: הָאָדָם עֵץ הַשָּׂדֶה
  choice: పొలంలోని చెట్టు మనిషా?
  rationale: కష్టమైన హీబ్రూ వాక్యాన్ని ప్రధాన పాఠంలో అలంకారప్రశ్నగా తీసుకుని, చెట్టును మానవ శత్రువుతో వ్యత్యాసపరుస్తుంది. ‘పొలంలోని చెట్టు’ עֵץ הַשָּׂדֶה యొక్క సహజ తెలుగు రూపం.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: ముట్టడిలో నీ ఎదుటికి రావడానికి
  rationale: అస్పష్టమైన హీబ్రూ పదక్రమానికి దగ్గరగా ఉంటూనే, చెట్టు ముట్టడిలో ప్రత్యర్థిగా ఎదుటికి రాదనే అలంకారప్రశ్నను తెలుగులో గ్రాహ్యంగా ఉంచుతుంది.
theological_decisions:
- issue: כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר అనే కష్టమైన చివరి వాక్యభాగం యొక్క అర్థం
  choice: 'మానవ శత్రువుతో పొలంలోని చెట్టును వ్యత్యాసపరచే అలంకారప్రశ్నగా అనువదించబడింది: ‘ముట్టడిలో నీ ఎదుటికి రావడానికి పొలంలోని చెట్టు మనిషా?’'
  alternative: ‘ఎందుకంటే మనిషి పొలంలోని చెట్టు’ లేదా ‘ఎందుకంటే పొలంలోని చెట్టు మనిషికి ఆహారం’ అనే ప్రకటనాత్మక పఠనాలు.
  rationale: హీబ్రూ వాక్యనిర్మాణం నిజంగా క్లిష్టమైనది. అలంకారప్రశ్న పఠనం ముట్టడిలో చెట్లు మానవ ప్రత్యర్థులు కావని సందర్భానికి సరిపోతుంది; అయితే ఇతర పురాతన/ఆధునిక పఠనాలను నిశ్శబ్దంగా తొలగించకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఏకవచన సంబోధనకు ‘నీవు’ వాడబడింది. సైనిక సందర్భానికి ‘ముట్టడి,’ ‘స్వాధీనం’ వంటి ప్రామాణిక పదాలు ఉపయోగించబడ్డాయి; క్లిష్టమైన చివరి వాక్యభాగంలోని మూలభాషా సందిగ్ధత పాదసూచికలో సంరక్షించబడింది.
