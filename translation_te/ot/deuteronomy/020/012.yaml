  terminology: “శాంతి చేసుకోడం,” “యుద్ధం చేయడం,” and “ముట్టడించడం” are suitable, established terms. The singular forms “నీతో/నీవు” preserve the source’s singular address, while “అది/దాన్ని” suitably refers to the city.
