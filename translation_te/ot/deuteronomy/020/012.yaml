  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: te
  text: కాని అది నీతో శాంతి చేసుకోకుండా నీతో యుద్ధం చేస్తే, అప్పుడు నీవు దాన్ని ముట్టడించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: కాని ... చేసుకోకుండా
  rationale: మునుపటి వచనంలోని శాంతియుత ఫలితానికి విరుద్ధమైన పరిస్థితిని సూచించడానికి וְאִם לֹא ను సహజమైన ఆధునిక తెలుగులో ఇలా వ్యక్తం చేశాం.
- source_word: תַשְׁלִים עִמָּךְ
  choice: నీతో శాంతి చేసుకోకుండా
  rationale: שׁלם హిఫీల్ రూపం ఇక్కడ శాంతి సంబంధాన్ని ఏర్పరచుకోవడం లేదా శాంతి ఒప్పందం చేసుకోవడం అనే భావాన్ని ఇస్తుంది. ‘శాంతి చేసుకోడం’ క్రియాశీల భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: నీతో యుద్ధం చేస్తే
  rationale: עשה מלחמה అనే హీబ్రూ నుడికారానికి ‘యుద్ధం చేయడం’ సహజమైన తెలుగు సమానం. עִם యొక్క ‘తో’ భావాన్ని కూడా నిలుపుతూ, సందర్భంలో ప్రతికూల యుద్ధ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: అప్పుడు నీవు దాన్ని ముట్టడించాలి
  rationale: צור ఇక్కడ పట్టణాన్ని చుట్టుముట్టి ముట్టడించడం అనే అర్థంలో ఉంది. ‘ముట్టడించాలి’ ధర్మశాస్త్ర సంబంధమైన ఆదేశ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; עַל సూచించే కర్మసంబంధం ‘దాన్ని’లో అంతర్భవించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గంభీరమైన శైలిని పాటించాం. మూలంలోని ఏకవచన సంబోధనను ‘నీతో/నీవు’గా, పట్టణాన్ని సూచించే సర్వనామాన్ని ‘అది/దాన్ని’గా నిలిపాం.
