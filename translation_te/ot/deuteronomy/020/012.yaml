  source_fidelity: 'The Telugu accurately represents the Hebrew conditional sequence: the city does not make peace with the singular addressee, makes war with/against him, and is then to be besieged. “నీతో యుద్ధం చేస్తే” naturally renders the Hebrew idiom עשה מלחמה עם, and “దాన్ని ముట్టడించాలి” appropriately conveys the directive force of וְצַרְתָּ עָלֶיהָ.'
