source:
  edition: WLC
  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: te
  text: నీ దేవుడైన యహ్వే దానిని నీ చేతికి అప్పగిస్తాడు; నీవు దానిలోని మగవారందరినీ[a] కత్తి ధారతో హతమార్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘దానిలోని మగవారందరినీ’ అని ఉంది; ‘ప్రజలందరూ’ వంటి సాధారణ పదానికి బదులుగా మగ లింగాన్ని నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: దానిని ... అప్పగిస్తాడు
  rationale: נתן క్రియతో ఉన్న స్త్రీలింగ ఏకవచన కర్మప్రత్యయం ముందటి పట్టణాన్ని సూచిస్తుంది. ‘అప్పగిస్తాడు’ అనేది ఒకరి ఆధీనంలోకి ఇవ్వడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువాదం చేశాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నిబంధనాత్మక సంబోధనను సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: పట్టణాన్ని ఒకరి అధికారంలోకి అప్పగించడం అనే హీబ్రూ రూపకాన్ని తెలుగులో కూడా నిలుపుతుంది.
- source_word: וְהִכִּיתָ
  choice: హతమార్చాలి
  rationale: యుద్ధ సందర్భంలో נכה హిఫీల్ రూపం ప్రాణాంతకంగా కొట్టి చంపడాన్ని సూచిస్తుంది; దాని తీవ్రతను మెత్తబరచకుండా స్పష్టంగా తెలిపాం.
- source_word: כָּל
  choice: అందరినీ
  rationale: ఆజ్ఞలోని సమగ్రతను యథాతథంగా నిలుపుతుంది.
- source_word: זְכוּרָהּ
  choice: దానిలోని మగవారందరినీ
  rationale: ఈ పదం సాధారణంగా ‘ప్రజలు’ లేదా సామాజిక వర్గంగా ‘పురుషులు’ అని కాక, లింగాన్ని నిర్దిష్టంగా సూచిస్తుంది; స్త్రీలింగ ప్రత్యయం పట్టణాన్ని సూచిస్తుంది.
- source_word: לְפִי חָרֶב
  choice: కత్తివాత
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి’ అనే హీబ్రూ నుడికారానికి, కత్తి ధారచేత సంహరించడం అనే భావాన్ని అందించే స్థిరమైన తెలుగు నుడికారం.
theological_decisions:
- issue: దేవుడు అనుమతించిన యుద్ధ ఆజ్ఞను మెత్తబరచకుండా లేదా వివరణాత్మకంగా విస్తరించకుండా అనువదించడం
  choice: పట్టణాన్ని యహ్వే అప్పగిస్తాడని, దానిలోని మగవారందరినీ కత్తివాత హతమార్చాలని నేరుగా అనువదించాం.
  alternative: ‘ఓడించాలి’ వంటి మెత్తని పదాన్ని వాడడం, మగవారి ప్రస్తావనను సాధారణీకరించడం, లేదా తీర్పు/పవిత్ర యుద్ధం గురించిన వ్యాఖ్యానాన్ని వచనంలో చేర్చడం.
  rationale: హీబ్రూ పాఠం పట్టణం అప్పగించబడటాన్ని యహ్వేకే ఆపాదిస్తూ, అందులోని మగవారిపై ప్రాణాంతక చర్యను స్పష్టంగా ఆజ్ఞాపిస్తుంది. అనువాదం ఆ తీవ్రతను నిలుపుతూ, వచనంలో లేని సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘కత్తివాత’ అనే సహజమైన బైబిలీయ నుడికారంతో హీబ్రూ రూపకాన్ని నిలిపాం; మూలంలోని వరుసను తెలుగులో స్పష్టంచేయడానికి రెండో వాక్యభాగంలో ‘అప్పుడు’ వాడాం.
