  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: te
  text: మీకు చాలా దూరంగా ఉన్న పట్టణాలన్నిటికీ మీరు ఇలాగే చేయాలి[a]. అవి ఈ జనాంగాల పట్టణాల్లోనివి కావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ విధంగా చేయాలి,’ ‘అలా చేయాలి.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ అక్షరార్థంగా: ‘ఈ జనాంగాల పట్టణాల నుండి కావు’; భావం: ఆ పట్టణాలు ఇప్పుడే పేర్కొన్న జనాంగాలకు చెందినవి కావు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ఇలాగే
  rationale: ముందటి సందర్భంలో వివరించిన విధానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: תַּעֲשֶׂה
  choice: మీరు చేయాలి
  rationale: న్యాయవిధి సందర్భంలోని ఆదేశార్థక అసంపూర్ణ క్రియ బలాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంలో తెలియజేస్తుంది.
- source_word: לְכָל הֶעָרִים
  choice: పట్టణాలన్నిటికీ
  rationale: ల ఉపసర్గ సూచించే ప్రభావిత లక్ష్యాన్ని తెలుగు సంప్రదాన విభక్తితో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: మీకు చాలా దూరంగా ఉన్న
  rationale: దూరాన్ని, מְאֹד ఇచ్చే తీవ్రతను రెండింటినీ నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: పట్టణాల్లోనివి కావు
  rationale: מִן యొక్క సమూహం నుండి మినహాయించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలు
  rationale: ఇక్కడ גּוֹיִם భూభాగ సంబంధిత ప్రజాసమూహాలను సూచిస్తుంది; ‘జనాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, తరువాతి కాలపు ‘అన్యజనులు’ అనే మతపరమైన భావాన్ని దిగుమతి చేయదు.
- source_word: הֵנָּה
  choice: ఈ
  rationale: స్త్రీలింగ బహువచన సూచక సర్వనామం ఇచ్చే సమీప/ఉద్ఘాటన భావం తెలుగులో ‘ఈ జనాలు’లో సహజంగా అంతర్భవిస్తుంది.
theological_decisions:
- issue: దూరపు పట్టణాలకు, సందర్భంలో నిర్మూలనకు ఉద్దేశించబడిన జనాల పట్టణాలకు మధ్య ఉన్న పరిధి భేదం
  choice: ఈ ఆదేశం దూరపు పట్టణాలకు వర్తిస్తుందని, అవి పేర్కొన్న జనాల పట్టణాల్లోనివి కావని స్పష్టంగా అనువదించడం
  alternative: ఇది విదేశీ పట్టణాల గురించి సాధారణ వాక్యంగా మృదువుగా చెప్పడం లేదా పూర్వపు ముట్టడి నియమాలను ఈ వచనంలో విస్తరించి వివరించడం
  rationale: ఈ వచనం ముందటి ఆదేశాల పరిధికి హద్దు పెడుతుంది. యుద్ధ-న్యాయ సంబంధిత బలాన్ని తగ్గించకుండా, పక్క వచనాల వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా ఆ భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయవిధి శైలి. ఏకవచన సంబోధనకు తెలుగులో సహజమైన గౌరవ బహువచన రూపం ‘మీరు’ వాడబడింది. ప్రధాన పాఠ్యం మూలంలోని రెండు వాక్యభాగాలను స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా అందిస్తుంది.
