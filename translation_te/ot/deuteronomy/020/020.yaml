id: DEU.20.20
reference: Deuteronomy 20:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: te
  text: అయితే, ఆహారం ఇచ్చే చెట్లు కావని నీకు తెలిసిన చెట్లను మాత్రమే నాశనం చేసి నరికివేయవచ్చు. నీతో యుద్ధం చేస్తున్న పట్టణానికి వ్యతిరేకంగా ముట్టడి కట్టడాలను[a] నిర్మించి, దానిని పడగొట్టే వరకు ముట్టడించవచ్చు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముట్టడి దిబ్బను నిర్మించవచ్చు.’ హీబ్రూ పదం ఒక నిర్దిష్ట నిర్మాణానికే కాకుండా ముట్టడికి ఉపయోగించే కట్టడాలను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అది కూలిపోయే వరకు.’ హీబ్రూ పదబంధం అక్షరార్థంగా పట్టణాన్ని దిగజార్చడం లేదా పడగొట్టడం అనే క్రియాశీల భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే ... మాత్రమే
  rationale: మునుపటి వచనంలోని ఫలవృక్షాల నాశన నిషేధానికి మినహాయింపును సూచించే పరిమితి భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: చెట్లు ... ఆహారానికి పనికిరాని
  rationale: సందర్భం సజీవ వృక్షాలకు సంబంధించినది. עֵץ מַאֲכָל అనే పదబంధం ఆహారం ఇచ్చే లేదా ఆహారానికి ఉపయోగపడే చెట్టును సూచిస్తుంది; ప్రతికూల వాక్యంలో సహజమైన తెలుగు రూపం వాడబడింది.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: ఆహారానికి పనికిరావని నీకు తెలిసిన
  rationale: చెట్టు ఆహార వృక్షం కాదని నిర్ధారించుకున్న స్థితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: వాటిని నాశనం చేసి నరికివేయవచ్చు
  rationale: ఏకవచన రూపం వర్గంలోని ప్రతి చెట్టుకూ పంపిణీ భావంలో వర్తిస్తుంది. ధర్మశాస్త్ర సందర్భంలో అనుమతి భావాన్ని ‘వచ్చు’తో వ్యక్తపరుస్తూ, שׁחת మరియు כרת రెండింటి భావాలను నిలుపుతుంది.
- source_word: וּבָנִיתָ מָצוֹר
  choice: ముట్టడి కట్టడాలను నిర్మించవచ్చు
  rationale: מָצוֹר ఒకే రకమైన ముట్టడి దిబ్బకే పరిమితం కాకుండా విస్తృతమైన ముట్టడి నిర్మాణాలు లేదా కోటబందోబస్తును సూచించగలదు; అందుకే సాధారణ బహువచన పదబంధం ఎంచుకోబడింది.
- source_word: עַל הָעִיר
  choice: పట్టణానికి ఎదురుగా
  rationale: ముట్టడి నిర్మాణాల శత్రుత్వ దిశను సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం భౌగోళికంగా ‘చుట్టూ’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: నీతో యుద్ధం చేస్తున్న పట్టణం
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న యుద్ధ భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: עַד רִדְתָּהּ
  choice: అది కూలిపోయే వరకు
  rationale: నగరం పతనం చెందే వరకు అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది. హీబ్రూ రూపానికి ‘దాన్ని కూల్చే వరకు’ అనే క్రియాశీల అనువాదం కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: ముట్టడిలో చెట్లను నరికే అనుమతి పరిధి
  choice: ఆహారానికి పనికిరావని తెలిసిన చెట్లకే అనుమతిని పరిమితం చేయడం
  alternative: ముట్టడికి ఉపయోగపడే ఏ చెట్లనైనా నరికే సాధారణ అనుమతి
  rationale: רַק మరియు לֹא עֵץ מַאֲכָל కలిసి ముందటి ఫలవృక్ష రక్షణ ఆజ్ఞకు స్పష్టమైన, పరిమిత మినహాయింపును ఇస్తాయి; వచనం చెప్పనంత విస్తృతమైన అనుమతిని చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో అనువదించబడింది. ‘ముట్టడి కట్టడాలు’ అనే పదబంధం సాంకేతిక భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
