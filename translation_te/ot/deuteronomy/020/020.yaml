- from: అయితే ఆహారానికి పనికిరావని నీకు తెలిసిన చెట్లను మాత్రమే నాశనం చేసి నరికివేయవచ్చు. నీతో యుద్ధం చేస్తున్న పట్టణం కూలిపోయే వరకు దానికి ఎదురుగా ముట్టడి కట్టడాలను[a] నిర్మించవచ్చు.[b]
  to: అయితే, ఆహారం ఇచ్చే చెట్లు కావని నీకు తెలిసిన చెట్లను మాత్రమే నాశనం చేసి నరికివేయవచ్చు. నీతో యుద్ధం చేస్తున్న పట్టణానికి వ్యతిరేకంగా ముట్టడి కట్టడాలను[a] నిర్మించి, దానిని పడగొట్టే వరకు ముట్టడించవచ్చు.[b]
