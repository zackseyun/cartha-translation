  terminology: ‘అసహ్యకార్యాలు’ తּוֹעֲבוֹתָם యొక్క బలమైన నైతిక-మతపరమైన అర్థాన్ని నిలుపుతుంది. ‘మీ దేవుడైన యాహ్వే’ మూలంలోని אֱלֹהֵיכֶם మరియు יהוה రెండింటినీ సరియైన రీతిలో ఇస్తుంది. ‘వ్యతిరేకంగా పాపం చేయడం’ חטא + לְ యొక్క భావానికి తగినది.
