source:
  edition: WLC
  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: te
  text: వారు తమ దేవుళ్ల కోసం[a] చేసిన వారి అసహ్యకార్యాలన్నిటి ప్రకారం చేయమని మీకు నేర్పకుండా, మీరు మీ దేవుడైన యాహ్వేకు వ్యతిరేకంగా పాపం చేయకుండా ఉండటానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ దేవుళ్లకు.’
    reason: లֵאלֹהֵיהֶם లోని לְ ఉపసర్గను ఆరాధనా సందర్భంలో ‘కోసం’ లేదా ‘కు’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: చేయకుండా ఉండటానికే
  rationale: ఇది ఉద్దేశాన్ని, ముఖ్యంగా నివారించాలనే ఉద్దేశాన్ని తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఈ భావాన్ని చివర ఉంచడం సహజం.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: చేయాలని మీకు నేర్పించి
  rationale: למד యొక్క పీయేల్ రూపానికి ‘నేర్పించు’ ప్రత్యక్షమైన అర్థం; עשה ఇక్కడ ఆ బోధనకు సంబంధించిన కార్యాన్ని సూచిస్తుంది.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: అసహ్యకార్యాలన్నిటినీ మీరూ
  rationale: כְּ ఇచ్చే అనుకరణ లేదా అనుసరణ భావాన్ని ‘మీరూ’ సహజంగా వ్యక్తం చేస్తుంది; תועבה యొక్క బలమైన నైతిక-మతపరమైన భావాన్ని ‘అసహ్యకార్యాలు’ నిలుపుతుంది.
- source_word: אֲשֶׁר עָשׂוּ לֵאלֹהֵיהֶם
  choice: వారు తమ దేవుళ్ల కోసం చేసిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని సహజమైన తెలుగులో ఉంచుతుంది. לְ ఆరాధనా కార్యాలు దేవుళ్ల కోసం చేసినవని సూచించవచ్చు; ‘దేవుళ్లకు’ కూడా సాధ్యమే.
- source_word: וַחֲטָאתֶם לַיהוָה
  choice: మీరు ... యాహ్వేకు విరోధంగా పాపం చేయకుండా
  rationale: וְ + పూర్తి క్రియారూపం ఇక్కడ ముందున్న నివారణ ఉద్దేశానికి సంబంధించిన పరిణామాన్ని సూచిస్తుంది. חטא + לְ లో యాహ్వే బాధిత పక్షం కావడంతో తెలుగులో ‘విరోధంగా పాపం చేయడం’ స్పష్టంగా ఉంటుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: యాహ్వే అనే నామానికి సమానాధికార సంబంధంలో ఉన్న నిబంధనాత్మక సంబోధనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో అందించింది.
- issue: וַחֲטָאתֶם యొక్క ఉద్దేశం/ఫలిత సంబంధం
  choice: పాపం చేయకుండా ఉండటానికే
  alternative: అప్పుడు మీరు పాపం చేస్తారు
  rationale: לְמַעַן אֲשֶׁר తో మొదలైన నివారణ ఉద్దేశం రెండో క్రియకు కూడా విస్తరిస్తుందని వాక్యసందర్భం సూచిస్తుంది. అయినప్పటికీ పాపం అనేది వారి బోధను అనుసరించడం వల్ల కలిగే ఫలితమనే సంబంధాన్ని ‘నేర్పించి’ అనే అనుసంధానం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలవాక్యం ముందరి ఆజ్ఞకు ఉద్దేశాన్ని తెలిపే భాగం కావడంతో, తెలుగు పాఠ్యమూ ‘ఉండటానికే’తో అనుసంధాన వాక్యఖండంగా ఉంచబడింది.
