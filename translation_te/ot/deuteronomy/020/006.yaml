id: DEU.20.6
reference: Deuteronomy 20:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: te
  text: ద్రాక్షతోట నాటి, ఇంకా దాని ఫలాన్ని అనుభవించని వాడు ఎవడు? అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి,[a] లేకపోతే అతడు యుద్ధంలో చనిపోతాడు, మరొకడు దాని ఫలాన్ని అనుభవిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఇంకా దాన్ని సాధారణ ఉపయోగంలోకి తీసుకురాని వాడు” లేదా “ఇంకా దాన్ని ఉపయోగించడం ప్రారంభించని వాడు.” ఇక్కడి హీబ్రూ క్రియ ద్రాక్షతోటను మొదటిసారిగా సాధారణ ఉపయోగంలోకి తీసుకోవడాన్ని సూచిస్తుంది; బహుశా ఆరంభ సంవత్సరాల నిషేధం గడిచిన తర్వాత దాని పంటను ఉపయోగించడం అనే భావం ఉండవచ్చు (లేవీయకాండము 19:23–25 చూడండి).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: వాడు ఎవడు?
  rationale: సైనిక సేవ నుంచి మినహాయింపు పొందే పురుషుణ్ణి పరిచయం చేసే హీబ్రూ ప్రశ్నారూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נָטַע כֶּרֶם
  choice: ద్రాక్షతోట నాటి
  rationale: ముందే పూర్తయి, ప్రస్తుత పరిస్థితికి సంబంధించిన చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא חִלְּלוֹ
  choice: ఇంకా దాని ఫలాన్ని అనుభవించని
  rationale: חלל అనే క్రియ ఇక్కడ అపవిత్రపరచడం అనే సాధారణ అర్థంలో కాకుండా, ద్రాక్షతోటను తొలిసారిగా సాధారణ ప్రయోజనానికి ఉపయోగించి దాని దిగుబడిని అనుభవించడాన్ని సూచిస్తుంది. 'ఫలాన్ని అనుభవించని' అనేది సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే 'ఫలం' మూలపాఠంలో ప్రత్యక్షంగా లేదని పాదటిప్పణి వివరిస్తుంది.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి
  rationale: ఈ సందర్భంలోని ఆదేశాత్మక yiqtol రూపాల న్యాయపరమైన నిర్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: అతడు యుద్ధంలో చనిపోతే ... ఏమో
  rationale: פן తెలిపే నివారణాత్మక హెచ్చరికను తెలుగులో సహజమైన '...తే ... ఏమో' నిర్మాణంతో అందిస్తుంది.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: మరొకడు దాని ఫలాన్ని అనుభవిస్తాడేమో
  rationale: మొదటి חלל పదానికి ఎంచుకున్న సందర్భార్థాన్నే స్థిరంగా కొనసాగిస్తూ, మరొక పురుషుడు ద్రాక్షతోట ప్రయోజనాన్ని పొందే అవకాశాన్ని తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే న్యాయ-కథన శైలి. హీబ్రూ పురుషవాచక సైనిక సందర్భాన్ని నిలిపి ఉంచింది. ప్రధాన వాక్యంలోని పాదటిప్పణి గుర్తు [a] సంబంధిత పదబంధం తర్వాత ఉంచబడింది.
