- from: 'అప్పుడు అధికారులు ప్రజలతో ఇలా చెప్పాలి: “కొత్త ఇల్లు కట్టి, ఇంకా దానిని ప్రారంభించని వ్యక్తి ఎవడైనా ఉన్నాడా? అతడు యుద్ధంలో చనిపోయి, మరొకడు దానిని ప్రారంభించకముందే, అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి.[a]”'
  to: 'అప్పుడు అధికారులు ప్రజలతో ఇలా చెప్పాలి: “కొత్త ఇల్లు కట్టి, ఇంకా దానిని ప్రారంభించని మనిషి ఎవడు? అతడు యుద్ధంలో చనిపోయి, మరొక మనిషి దానిని ప్రారంభించకుండా ఉండడానికి, అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి.[a]”'
  rationale: The revision corrects the purpose relationship introduced by פֶּן while preserving the legal-directive force, the masculine singular references, and the lexical repetition of the Hebrew verb for inaugurating/dedicating the house. The existing footnote remains correctly anchored and explains the lexical alternative.
