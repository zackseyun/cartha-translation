  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דִבְּר֣וּ הַ/שֹּֽׁטְרִים֮ אֶל הָ/עָ֣ם לֵ/אמֹר֒ מִֽי הָ/אִ֞ישׁ אֲשֶׁ֨ר בָּנָ֤ה בַֽיִת חָדָשׁ֙ וְ/לֹ֣א חֲנָכ֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יַחְנְכֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: te
  text: 'అప్పుడు అధికారులు ప్రజలతో ఇలా చెప్పాలి: “కొత్త ఇల్లు కట్టి, ఇంకా దానిని ప్రారంభించని మనిషి ఎవడు? అతడు యుద్ధంలో చనిపోయి, మరొక మనిషి దానిని ప్రారంభించకుండా ఉండడానికి, అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని ప్రతిష్ఠించని.” హీబ్రూ క్రియ కొత్త ఇంటిని లాంఛనంగా వినియోగించడం ప్రారంభించడాన్ని సూచిస్తుంది; దానికి ప్రతిష్ఠాపన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: అధికారులు
  rationale: ద్వితీయోపదేశకాండంలోని పౌర-సైనిక సందర్భంలో ఈ పదం నియమిత కార్యనిర్వాహకులను సూచిస్తుంది; ‘అధికారులు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: హీబ్రూ పదానికి నేరమైన సమానార్థం; సందర్భంలో యుద్ధానికి సమకూడిన ప్రజలను సూచించినా, ‘సైనికులు’ అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: מִי הָאִישׁ
  choice: వ్యక్తి ఎవడైనా ఉన్నాడా?
  rationale: యుద్ధానికి అర్హుడైన పురుషుని గురించిన ఏకవచన ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: కొత్త ఇల్లు కట్టి
  rationale: בַיִתకు ‘ఇల్లు’ నేరమైన, సహజమైన తెలుగు సమానార్థం.
- source_word: וְלֹא חֲנָכוֹ
  choice: ఇంకా దానిని ప్రారంభించని
  rationale: חנך ఇక్కడ కొత్త ఇంటి వినియోగాన్ని లాంఛనంగా ప్రారంభించడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించని’ అనేది మతపరమైన అర్థాన్ని అతిగా కలిగించవచ్చు.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి
  rationale: న్యాయ-విధాన సందర్భంలోని ఆదేశ భావాన్ని ఆధునిక తెలుగులో ‘వెళ్లాలి’తో స్పష్టంగా తెలిపింది.
- source_word: פֶּן
  choice: …కముందే
  rationale: హెచ్చరికలోని నివారణ భావాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణంతో తెలియజేస్తుంది.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: అతడు యుద్ధంలో చనిపోయి
  rationale: నిర్దిష్ట సైనిక సందర్భాన్ని సరళంగా, నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וְאִישׁ אַחֵר
  choice: మరొకడు
  rationale: మరొక పురుషుడు అనే ఏకవచన భావాన్ని సందర్భానుకూలంగా నిలుపుతుంది.
- source_word: יַחְנְכֶנּוּ
  choice: దానిని ప్రారంభించక
  rationale: మొదటి חנךతో ఒకే పదబంధాన్ని పునరావృతం చేసి మూలంలోని పద పునరుక్తిని నిలుపుతుంది.
