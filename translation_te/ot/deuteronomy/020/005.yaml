translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. చట్టపరమైన ఆదేశ భావాన్ని సహజంగా ఉంచుతూ, חנךలోని ‘ప్రారంభించడం/ప్రతిష్ఠించడం’ అనే అర్థ పరిధిని పాదటిప్పణిలో నిలిపింది.
