translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని విస్తృత ‘ప్రజలు’ పదాన్ని నిలిపి, యుద్ధసందర్భాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
