  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: te
  text: మీరు పోరాటానికి[a] చేరువైనప్పుడు, యాజకుడు ముందుకు వచ్చి ప్రజలతో[b] మాట్లాడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుద్ధానికి.’ హీబ్రూ పదం מִלְחָמָה సాధారణంగా యుద్ధాన్నిగానీ, నిర్దిష్ట పోరాటాన్నిగానీ సూచించవచ్చు; ఇక్కడ తక్షణ పోరాటానికి చేరువవుతున్న సందర్భం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ప్రజలు’ అంటే సమకూడిన ఇశ్రాయేలు సైనికులు. అయితే హీబ్రూ పాఠం ‘సైనికులు’ వంటి పరిమిత పదం కాకుండా ‘ప్రజలు’ అనే విస్తృత పదాన్నే ఉపయోగిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: మీరు … సమీపించినప్పుడు
  rationale: וְהָיָה తో కూడిన కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది; קרב లోని ‘దగ్గరకు రావడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: אֶל הַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: מִלְחָמָה యుద్ధాన్ని సాధారణంగానూ నిర్దిష్ట పోరాటాన్నీ సూచించగలదు. ఇక్కడ సమీపిస్తున్న సైనిక పోరాటమే సందర్భం; తెలుగులో ‘యుద్ధానికి సమీపించడం’ సహజంగా ఉంది.
- source_word: וְנִגַּשׁ
  choice: ముందుకు వచ్చి
  rationale: נגשׁ లోని సమీపించడం/ముందుకు రావడం అనే కదలికను, ప్రజలను ఉద్దేశించి మాట్లాడే సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్ట ఏకవచన నామవాచకాన్ని అదనపు వివరణ లేకుండా అనువదిస్తుంది.
- source_word: וְדִבֶּר אֶל הָעָם
  choice: ప్రజలతో మాట్లాడాలి
  rationale: דבר యొక్క ‘మాట్లాడు’ అనే సాధారణ అర్థాన్ని, ఈ ఆజ్ఞాత్మక న్యాయసందర్భంలో తెలుగు విధ్యర్థక రూపంతో అందిస్తుంది; הָעָם అనే విస్తృత పదానికి ‘ప్రజలు’నే నిలుపుతుంది.
