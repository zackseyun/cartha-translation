  to: 'తరువాత అధికారులు ప్రజలతో ఇంకా ఇలా చెప్పాలి: “భయపడే, ధైర్యం లేని మనిషి ఎవడు?[a] అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి. లేకపోతే, తన హృదయంలాగే తన సహోదరుల[b] హృదయాలను కూడా కరిగిస్తాడు.”'
  rationale: సవరణలు అర్థాన్ని మార్చకుండా తెలుగు సహజత్వం, వ్యాకరణ స్పష్టతను మెరుగుపరుస్తాయి. ‘ధైర్యం లేని’ హీబ్రూ రూపకానికి సందర్భోచితమైన భావానువాదం; పాదసూచిక అక్షరార్థాన్ని కాపాడుతుంది. చివరి భాగంలో బహువచన ‘హృదయాలను’ వాడటం హీబ్రూ సమూహార్థక ఏకవచనాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
