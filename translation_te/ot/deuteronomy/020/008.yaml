    issue: ‘గుండె ధైర్యం లేని’ అనే పదబంధం కొద్దిగా భారంగా ఉంది.
    rationale: హీబ్రూ רַךְ הַלֵּבָב యుద్ధసందర్భంలో ధైర్యలేమిని సూచిస్తుంది. ‘ధైర్యం లేని’ అదే భావాన్ని మరింత సులభమైన ప్రామాణిక తెలుగులో అందిస్తుంది.
