source:
  edition: WLC
  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: te
  text: 'తరువాత అధికారులు ప్రజలతో ఇంకా ఇలా చెప్పాలి: “భయపడే, ధైర్యం లేని మనిషి ఎవడు?[a] అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి. లేకపోతే, తన హృదయంలాగే తన సహోదరుల[b] హృదయాలను కూడా కరిగిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “భయపడే, హృదయం మృదువుగా ఉన్నవాడు.” ఇక్కడ యుద్ధాన్ని ఎదుర్కొనే ధైర్యం లేనివాడనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సహోదరులు” అంటే అతని తోటి ఇశ్రాయేలీయులు లేదా తోటి సైనికులు.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: ఇంకా
  rationale: ‘మాట్లాడడానికి మరింతగా చేర్చడం’ అనే హీబ్రూ ప్రయోగం ఇక్కడ ముందుగా చెప్పినదానికి కొనసాగింపుగా మరొక ప్రకటన చేయడాన్ని సూచిస్తుంది. ‘ఇంకా ఇలా చెప్పాలి’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשֹּׁטְרִים
  choice: అధికారులు
  rationale: ఈ సందర్భంలో ఈ పదం ఆధునిక పోలీసులను కాక, ప్రజలకు ఆదేశాలు ప్రకటించే నియమిత పరిపాలనా అధికారులను సూచిస్తుంది.
- source_word: מִי הָאִישׁ
  choice: మనిషి ఎవడు?
  rationale: మూలంలో పుంలింగ ఏకవచనం ఉంది; సైనిక సందర్భంలోని వ్యక్తిని అదే రూపంలో ఉంచుతుంది.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: భయపడే, గుండె ధైర్యం లేని
  rationale: మొదటి పదం భయాన్ని, రెండవది అక్షరార్థంగా ‘మెత్తని/సున్నితమైన హృదయం’ కలవాడిని సూచిస్తుంది. యుద్ధ సందర్భంలో ‘గుండె ధైర్యం లేని’ అనేది రూపక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: అతడు వెళ్లి తన ఇంటికి తిరిగి పోవాలి
  rationale: ప్రశ్న తరువాత వచ్చే ఆదేశాత్మక బలాన్ని ‘పోవాలి’ తెలియజేస్తుంది; ‘ఇల్లు’ అనే మూల పదాన్ని నిలుపుతుంది.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: లేకపోతే ... తన సహోదరుల హృదయాన్ని కూడా కరిగిస్తాడు
  rationale: ధైర్యం కోల్పోవడాన్ని తెలిపే ‘హృదయం కరగడం’ అనే మూల రూపకాన్ని నిలుపుతూ, అతని భయం ఇతరులపై చూపే ప్రభావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּלְבָבוֹ
  choice: అతని హృదయంలాగే
  rationale: మూలంలోని ‘హృదయం’ పద పునరుక్తిని, అతని స్థితితో సహోదరుల స్థితిని పోల్చే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సైనిక సందర్భంలోని లింగసూచక భాష
  choice: ‘మనిషి’, ‘సహోదరులు’ అనే పుంలింగ పదాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘వ్యక్తి’, ‘తోటి సైనికులు’ వంటి లింగతటస్థ లేదా సందర్భాన్ని వివరిస్తూ చెప్పే పదాలు
  rationale: హీబ్రూ పాఠ్యం పుంలింగ ఏకవచనాన్ని, బంధుత్వాన్ని తెలిపే పుంలింగ బహువచనాన్ని ఉపయోగిస్తుంది. వాటిని నిలుపడం మూలంలోని సామాజిక, సైనిక స్వరూపాన్ని కాపాడుతుంది; ‘సహోదరులు’ ఎవరిని సూచిస్తుందో పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘హృదయం కరగడం’ అనే మూల రూపకం నిలుపబడింది; ‘గుండె ధైర్యం లేని’ అనే సహజ ప్రయోగంతో యుద్ధ సందర్భం స్పష్టమైంది.
