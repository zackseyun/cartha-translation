source:
  edition: WLC
  text: וְ/הָיָ֛ה כְּ/כַלֹּ֥ת הַ/שֹּׁטְרִ֖ים לְ/דַבֵּ֣ר אֶל הָ/עָ֑ם וּ/פָֽקְד֛וּ שָׂרֵ֥י צְבָא֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/009.yaml
  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: te
  text: అధికారులు ప్రజలతో మాట్లాడడం ముగించినప్పుడు, వారు ప్రజలకు నాయకులుగా సైన్యాధిపతులను నియమించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు సైన్యాధిపతులను ప్రజలపై అధిపతులుగా నియమించాలి.” ఇక్కడ వాడిన క్రియ సందర్భాన్ని బట్టి నియమించడం, సమీకరించడం, లేదా బాధ్యత అప్పగించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: ముగించినప్పుడు
  rationale: וְהָיָה తో కూడిన כְּ + כלה infinitive construct తరువాతి కార్యానికి ముందుగా మాటలు ముగియడాన్ని సూచించే కాలవాచక నిర్మాణం; ఆధునిక తెలుగులో ‘ముగించినప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַשֹּׁטְרִים
  choice: అధికారులు
  rationale: ద్వితీయోపదేశకాండంలోని సైనిక-పౌర సందర్భంలో ప్రజలను ఉద్దేశించి మాట్లాడి వారిని క్రమబద్ధం చేసే నియమిత అధికారులను సూచిస్తుంది; ‘లేఖకులు’ అనడం అర్థాన్ని అనవసరంగా కుదిస్తుంది.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: ప్రజలతో మాట్లాడడం
  rationale: హీబ్రూ పదబంధంలోని ‘ప్రజలతో/ప్రజలను ఉద్దేశించి మాట్లాడడం’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; సైనిక సందర్భం ఉన్నప్పటికీ עָם ను ‘సైనికులు’గా అతిగా నిర్దిష్టం చేయదు.
- source_word: וּפָקְדוּ
  choice: నియమించాలి
  rationale: פקד కు నియమించడం, సమీకరించడం, బాధ్యతలో ఉంచడం వంటి విస్తృత అర్థాలు ఉన్నాయి. నాయకులను ప్రజల ముందుంచే ఈ సందర్భంలో ‘నియమించాలి’ ప్రధాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: שָׂרֵי צְבָאוֹת
  choice: సైన్యాధిపతులను
  rationale: שָׂרֵי నాయకులు లేదా అధిపతులు; צְבָאוֹת సైనిక దళాలను సూచిస్తుంది. ‘సైన్యాధిపతులు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఈ రెండు అంశాలను అందిస్తుంది.
- source_word: בְּרֹאשׁ הָעָם
  choice: ప్రజలకు నాయకులుగా
  rationale: అక్షరార్థంగా ‘ప్రజల తల వద్ద’ అనే ఈ నుడికారం నాయకత్వ స్థానాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రజలకు నాయకులుగా’ దాని కార్యార్థాన్ని సహజంగా తెలియజేస్తుంది.
