translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ప్రధాన పాఠ్యంలో నాయకత్వ నుడికారాన్ని అర్థస్పష్టంగా అనువదిస్తూ, פקד క్రియలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
