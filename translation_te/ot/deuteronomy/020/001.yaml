  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: te
  text: నీవు నీ శత్రువుల మీద యుద్ధానికి బయలుదేరినప్పుడు, గుర్రాలను, రథాలను[a], నీకంటే ఎక్కువ సంఖ్యలో ఉన్న ప్రజలను చూసి[b], వారికి భయపడకు; ఎందుకంటే ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన నీ దేవుడైన యాహ్వే నీతో ఉన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గుర్రాన్ని, రథాన్ని.’ హీబ్రూలో ఏకవచన రూపాలు ఉన్నప్పటికీ, ఇక్కడ అవి సైనిక బలగాలను సమూహార్థకంగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీకంటే గొప్ప ప్రజలను.’ ఈ మాట శత్రువులు సంఖ్యలో ఎక్కువగా ఉన్నారని ప్రధానంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన’ అనే మాట నిర్గమాన్ని జ్ఞాపకం చేస్తూ, ఇశ్రాయేలు ధైర్యానికి చారిత్రక ఆధారాన్ని చూపుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: నీవు ... యుద్ధానికి బయలుదేరినప్పుడు
  rationale: כִּי ఇక్కడ భవిష్యత్ పరిస్థితిని తెలిపే కాలార్థక ఉపవాక్యాన్ని ప్రారంభిస్తుంది; יצא למלחמה అనే సైనిక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ఇలా వ్యక్తం చేశాం.
- source_word: עַל אֹיְבֶיךָ
  choice: నీ శత్రువులతో
  rationale: శత్రుత్వ చర్య సందర్భంలో עַל అంటే ‘వ్యతిరేకంగా’; తెలుగులో ‘శత్రువులతో యుద్ధానికి’ అనడం సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: וְרָאִיתָ
  choice: చూసినా
  rationale: ఈ బోధనా సందర్భంలో క్రియ ముందున్న భవిష్యత్ పరిస్థితిని కొనసాగిస్తుంది. శత్రు బలాన్ని చూసినప్పటికీ భయపడవద్దనే వ్యత్యాసాన్ని తెలుగు ‘చూసినా’ సహజంగా తెలియజేస్తుంది.
- source_word: סוּס וָרֶכֶב
  choice: గుర్రాలను, రథాలను
  rationale: హీబ్రూ ఏకవచన రూపాలు ఇక్కడ సైనిక గుర్రాలు, రథాలను సమూహార్థకంగా సూచించే అవకాశం ఉంది; తెలుగులో బహువచనం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עַם רַב מִמְּךָ
  choice: నీకంటే ఎక్కువ సంఖ్యలో ఉన్న ప్రజలను
  rationale: רַב מן పోలికతో సంఖ్యాపరమైన అధికతను ప్రధానంగా సూచిస్తుంది. ‘సైన్యం’ అని పరిమితం చేయకుండా עַם యొక్క ‘ప్రజలు’ భావాన్ని నిలిపాం.
- source_word: לֹא תִירָא מֵהֶם
  choice: వారికి భయపడకు
  rationale: ధర్మశాస్త్ర బోధనలో ఈ అసంపూర్ణ క్రియ నిషేధార్థకంగా ఉంది; ఏకవచన సంబోధనను నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: నీ దేవుడైన యెహోవా నీతో ఉన్నాడు
  rationale: దేవుని సన్నిధి అనే నిబంధనాత్మక భరోసాను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం యెహోవాను వివరించే విశేషణ వాక్యంగా పనిచేస్తుంది. עלה యొక్క ‘పైకి తీసుకురావడం’ అనే నిర్గమ నుడికారాన్ని నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: దేవుని సన్నిధి మరియు నిర్గమం మధ్య సంబంధం
  choice: ‘నీతో ఉన్నాడు’ అనే భరోసా తరువాత ‘నిన్ను పైకి తీసుకొచ్చిన’ అని యెహోవాను గుర్తించడం
  alternative: నిర్గమాన్ని ప్రత్యేక కారణవాక్యంగా విస్తరించడం
  rationale: హీబ్రూ వాక్య నిర్మాణంలో הַמַּעַלְךָ అనేది దేవునిని గుర్తించే కృదంత పదబంధం. నిర్గమమే భయపడకపోవడానికి చారిత్రక ఆధారమని పాఠ్యం సూచించినా, మూలంలో లేని అదనపు కారణసూచక పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఏకవచన ‘నీవు’ సంబోధనను నిలిపి, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం వాడబడింది. ‘యుద్ధానికి బయలుదేరు,’ ‘భయపడకు’ వంటి సహజ ప్రయోగాలతో మూలంలోని ఆజ్ఞాత్మక స్వరాన్ని కాపాడాం.
