revisions:
- from: కాని స్త్రీలను, చిన్నపిల్లలను, పశువులను, పట్టణంలో ఉన్న సమస్తాన్ని—దాని దోపుడు సొమ్మంతటినీ—నీ కోసం దోచుకోవచ్చు. నీ దేవుడైన యెహోవా నీకు ఇచ్చిన నీ శత్రువుల దోపుడు సొమ్మును నీవు తినవచ్చు[a].
  to: కేవలం స్త్రీలను, చిన్నపిల్లలను, పశువులను, పట్టణంలో ఉన్న సమస్తాన్నీ—దాని దోపుడు సొమ్మంతటినీ—నీ కొరకు దోపుడు సొమ్ముగా తీసుకోవచ్చు. నీ దేవుడైన యహ్వే నీకు ఇచ్చిన నీ శత్రువుల దోపుడు సొమ్మును నీవు అనుభవించవచ్చు[a].
  rationale: The revision keeps the restrictive exception, the complete inventory, and the authorization to take the city’s spoil. It renders the Hebrew idiom involving אָכַל naturally in Telugu while documenting its literal wording in the anchored footnote. It also brings the divine name into alignment with the stated Yahweh policy and improves idiomatic Telugu expression without adding interpretation.
