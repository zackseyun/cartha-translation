  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: te
  text: కేవలం స్త్రీలను, చిన్నపిల్లలను, పశువులను, పట్టణంలో ఉన్న సమస్తాన్నీ—దాని దోపుడు సొమ్మంతటినీ—నీ కొరకు దోపుడు సొమ్ముగా తీసుకోవచ్చు. నీ దేవుడైన యహ్వే నీకు ఇచ్చిన నీ శత్రువుల దోపుడు సొమ్మును నీవు అనుభవించవచ్చు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ శత్రువుల దోపుడు సొమ్మును నీవు తినవచ్చు.” హీబ్రూ క్రియ “తిను” అని ఉన్నా, ఇక్కడ స్వాధీనం చేసుకున్న దానిని ఉపయోగించడం లేదా దాని ప్రయోజనం పొందడం అనే విస్తృత భావాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: కాని
  rationale: ముందటి ఆజ్ఞకు మినహాయింపును సూచించే నిరోధక భావాన్ని సందర్భానుగుణంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַנָּשִׁים
  choice: స్త్రీలను
  rationale: స్త్రీలను ప్రత్యేకంగా సూచించే బహువచన నామవాచకానికి నేరమైన అనువాదం.
- source_word: הַטַּף
  choice: చిన్నపిల్లలను
  rationale: טַף సాధారణంగా చిన్నపిల్లలను లేదా కుటుంబంలోని చిన్నవారిని సూచిస్తుంది; ఇక్కడ వయస్సు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులను
  rationale: యుద్ధ దోపుడులో ఆస్తిగా పరిగణించిన పెంపుడు జంతువులను సహజంగా సూచిస్తుంది.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: పట్టణంలో ఉన్న సమస్తాన్ని
  rationale: పట్టణంలో మిగిలి ఉన్న వాటన్నిటినీ చేర్చే సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: כָּל שְׁלָלָהּ
  choice: దాని దోపుడు సొమ్మంతటినీ
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులను సూచిస్తుంది; సొమ్ము అనే పదం ఇది కేవలం ఆహారం కాదని స్పష్టం చేస్తుంది.
- source_word: תָּבֹז לָךְ
  choice: నీ కోసం దోచుకోవచ్చు
  rationale: బָּזַז అనే క్రియలోని దోచుకోవడం అనే భావాన్నీ, న్యాయపరమైన సందర్భంలోని అనుమతి భావాన్నీ వ్యక్తం చేస్తుంది.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: నీ శత్రువుల దోపుడు సొమ్మును నీవు తినవచ్చు
  rationale: אָכַל యొక్క ప్రాథమిక అర్థమైన ‘తిను’ను ప్రధాన పాఠంలో నిలుపుతూ, ఈ సందర్భంలో ఉండగల విస్తృత వినియోగ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ప్రత్యక్ష రూపంలో అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఏకవచన సంబోధనతో కూడిన నిబంధనా సంబంధ పదబంధాన్ని సహజమైన తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం నేరుగా నిబంధనా దైవనామాన్ని వాడుతుంది; దానిని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: న్యాయబోధలో ద్వితీయ పురుష క్రియల భావం
  choice: అనుమతిని సూచించే ‘దోచుకోవచ్చు / తినవచ్చు’
  alternative: ఆజ్ఞ లేదా భవిష్యత్తును సూచించే ‘దోచుకుంటావు / తింటావు’
  rationale: ఈ సందర్భంలో క్రియలు యుద్ధ దోపుడును స్వాధీనం చేసుకునే అధికారాన్ని అనుమతిస్తున్నాయి; కేవలం భవిష్యద్వాక్యంగా లేదా తప్పనిసరి ఆజ్ఞగా కుదించకుండా అనుమతి భావాన్ని చూపుతుంది.
- issue: אָכַל యొక్క అర్థ విస్తృతి
  choice: ప్రధాన పాఠంలో ‘తినవచ్చు’
  alternative: ‘వాడుకోవచ్చు’ లేదా ‘అనుభవించవచ్చు’
  rationale: మూల క్రియ యొక్క స్పష్టమైన రూపకాన్ని నిలుపుతుంది; దోపుడు సొమ్ము మొత్తం ఆహారం మాత్రమే కాదనే సందర్భానుగుణ విస్తృత భావాన్ని పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఏకవచన ‘నీవు/నీ’ ద్వారా హీబ్రూ ద్వితీయ పురుష ఏకవచనం నిలుపబడింది. పొడవైన జాబితి మరియు దానికి వివరణగా వచ్చే ‘దాని దోపుడు సొమ్మంతటినీ’ మధ్య దీర్ఘవిరామం ఉంచి హీబ్రూ వాక్య నిర్మాణాన్ని చదవడానికి సహజంగా తీర్చిదిద్దాం.
