id: DEU.20.16
reference: Deuteronomy 20:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: te
  text: అయితే, నీ దేవుడైన యాహ్వే నీకు స్వాస్థ్యంగా ఇస్తున్న ఈ ప్రజల పట్టణాల విషయంలో, ఊపిరి పీల్చే దేనినీ[a] సజీవంగా ఉంచకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాణమున్న దేనినీ.” హీబ్రూలో అక్షరార్థంగా, “ప్రతి ఊపిరిగలది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి వచనాల్లో దూరప్రాంత పట్టణాల గురించి ఇచ్చిన ఆదేశాలకు ఇప్పుడు మినహాయింపును, వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: ఈ ప్రజల పట్టణాల్లో
  rationale: తెలుగులో సహజంగా స్థలాన్ని సూచిస్తూ, ‘ఈ ప్రజలకు చెందిన పట్టణాలు’ అనే హీబ్రూ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరించింది.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: మీకు స్వాస్థ్యంగా ఇస్తున్న
  rationale: נֹתֵן అనే వర్తమాన క్రియారూప భావాన్నీ, נַחֲלָהలోని ఒడంబడిక-భూమి వారసత్వ భావాన్నీ నిలుపుతుంది.
- source_word: לֹא תְחַיֶּה
  choice: సజీవంగా ఉంచకూడదు
  rationale: חיה పియేల్ రూపంలోని ‘బతకనివ్వడం/సజీవంగా ఉంచడం’ అనే కారణార్థక భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כָּל נְשָׁמָה
  choice: ఊపిరి పీల్చే దేనినీ
  rationale: అక్షరార్థంగా ఉన్న ‘ప్రతి ఊపిరిగలది’ అనే సజీవమైన హీబ్రూ చిత్రణను నిలుపుతూ, నిరాకరణ వాక్యంలో సహజమైన తెలుగు రూపాన్ని వాడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం సముచితం.
- issue: נַחֲלָהలోని ఒడంబడిక-భూమి భావం
  choice: స్వాస్థ్యంగా
  alternative: సొత్తుగా
  rationale: ‘స్వాస్థ్యం’ దేవుడు ఇశ్రాయేలుకు అనుగ్రహిస్తున్న భూమి యొక్క వారసత్వ, ఒడంబడిక భావాన్ని కేవలం ఆస్తిగా పరిమితం చేయకుండా నిలుపుతుంది.
- issue: כָּל נְשָׁמָה యొక్క పరిధి
  choice: ఊపిరి పీల్చే దేనినీ
  alternative: ఎవరినీ / ఏ ప్రాణినీ
  rationale: మూలంలోని విస్తృతమైన ‘ప్రతి ఊపిరిగలది’ అనే పదప్రయోగాన్ని వ్యక్తులకు మాత్రమే పరిమితం చేయకుండా దాని గంభీరమైన అస్పష్టతతో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞారూపం వాడబడింది. ఏకవచన హీబ్రూ సంబోధనకు తెలుగులో గౌరవ/సామూహికంగా సహజమైన ‘మీ’ రూపం తీసుకోబడింది; ‘యాహ్వే’ దైవనామంగా నిలుపబడింది.
