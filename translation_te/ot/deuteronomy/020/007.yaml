  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: te
  text: ఒక స్త్రీతో నిశ్చితార్థం చేసుకొని, ఇంకా ఆమెను భార్యగా స్వీకరించని ఎవరైనా ఉన్నాడా? అతడు యుద్ధంలో చనిపోయి, మరొకడు ఆమెను భార్యగా స్వీకరించే పరిస్థితి రాకుండా, అతడు వెళ్లి తన ఇంటికి తిరిగి వెళ్లాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘ఆమెను తీసుకోలేదు,’ ‘మరొకడు ఆమెను తీసుకుంటాడు’ అని ఉంది; ఇక్కడ ‘తీసుకోవడం’ అంటే వివాహంలో భార్యగా స్వీకరించడం.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: వాడు ఎవడైనా ఉన్నాడా?
  rationale: తదుపరి సైనిక మినహాయింపు వర్గాన్ని ప్రకటించే ప్రశ్నారూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֵרַשׂ אִשָּׁה
  choice: ఒక స్త్రీతో నిశ్చితార్థం జరిగి
  rationale: ఈ క్రియ పూర్తయిన వివాహానికి ముందు ఉండే అధికారిక వివాహ నిశ్చయాన్ని సూచిస్తుంది; ‘నిశ్చితార్థం’ ఆధునిక పాఠకులకు స్పష్టం.
- source_word: וְלֹא לְקָחָהּ
  choice: ఇంకా ఆమెను భార్యగా స్వీకరించని
  rationale: לקח అనే ‘తీసుకొను’ వివాహ సంబంధిత నుడికారాన్ని తెలుగులో అక్షరార్థంగా కాక, దాని సందర్భార్థంతో సహజంగా అందిస్తుంది.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: తన ఇంటికి తిరిగి వెళ్లాలి
  rationale: రెండు హీబ్రూ క్రియల గమనార్థాన్ని సంక్షిప్తమైన సహజ తెలుగు ఆజ్ఞార్థంలో వ్యక్తపరుస్తుంది.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: అతడు యుద్ధంలో చనిపోయి ... ఉండకుండా ఉండేలా
  rationale: פֶּן తెలిపే నివారణాత్మక హెచ్చరికను తెలుగులో సహజమైన ప్రతికూల ప్రయోజన నిర్మాణంతో అందిస్తుంది.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: మరొకడు ఆమెను భార్యగా స్వీకరించకుండా
  rationale: మొదటి לקח వలే ఇక్కడ కూడా వివాహార్థమే ప్రధానమైనందున పదసామ్యాన్ని ‘భార్యగా స్వీకరించు’తో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే రూపం. హీబ్రూ వివాహ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా అనువదించి, దాని అక్షరరూపాన్ని పాదసూచికలో తెలిపింది.
