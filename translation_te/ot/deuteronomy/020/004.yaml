  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם הַ/הֹלֵ֖ךְ עִמָּ/כֶ֑ם לְ/הִלָּחֵ֥ם לָ/כֶ֛ם עִם אֹיְבֵי/כֶ֖ם לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: te
  text: ఎందుకంటే మీ దేవుడైన యాహ్వే మీతో పాటు వెళ్తూ, మీ కొరకు మీ శత్రువులకు వ్యతిరేకంగా యుద్ధం చేసి మిమ్మల్ని రక్షిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని విడిపిస్తాడు’ లేదా ‘మీకు విజయాన్ని ఇస్తాడు.’ హీబ్రూ క్రియ రక్షించడం లేదా విడిపించడం అనే అర్థాలను కలిగి ఉండవచ్చు; ఇక్కడ అది యుద్ధ సందర్భంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రోత్సాహానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన సంబంధాన్ని సహజమైన తెలుగు నామవాచక నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הַהֹלֵךְ
  choice: వచ్చేవాడు
  rationale: హీబ్రూ కృదంతంలోని నిరంతరమైన, వర్ణనాత్మక భావాన్ని నిలుపుతుంది; సందర్భంలో తన ప్రజలతో కలిసి ముందుకు వెళ్లడాన్ని సహజంగా తెలుపుతుంది.
- source_word: עִמָּכֶם
  choice: మీతో
  rationale: దైవిక సహవాసాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేసి
  rationale: యుద్ధ సందర్భంలో לחם క్రియ యొక్క భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: לָכֶם
  choice: మీ పక్షంగా
  rationale: ప్రయోజనార్థక దత్తివును, అంటే ఇశ్రాయేలు తరఫున యాహ్వే పోరాడుతాడనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עִם אֹיְבֵיכֶם
  choice: మీ శత్రువులతో
  rationale: యుద్ధం చేయు అనే క్రియతో కలిపి ఇది ప్రతిపక్ష భావాన్ని ఇస్తుంది; తెలుగులో ‘శత్రువులతో యుద్ధం’ సహజంగా ‘వారికి విరోధంగా’ అనే అర్థాన్ని కలిగిస్తుంది.
- source_word: לְהוֹשִׁיעַ
  choice: రక్షిస్తాడు
  rationale: ישׁע యొక్క హిఫిల్ రూపం సూచించే రక్షణ/విడుదలను నిలుపుతుంది; సైనిక సందర్భంలో విజయాన్ని కూడా అంతర్భావంగా కలిగి ఉంటుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: రెండవ పురుష బహువచన ప్రత్యక్ష కర్మను సాధారణ తెలుగులో ఖచ్చితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, విస్తృతంగా ఆమోదించబడిన ధ్వని రూపంలో నిలుపుతుంది.
- issue: సైనిక సందర్భంలో לְהוֹשִׁיעַ పరిధి
  choice: మిమ్మల్ని రక్షిస్తాడు
  alternative: మిమ్మల్ని విడిపిస్తాడు; మీకు విజయం ఇస్తాడు
  rationale: మూల క్రియకు రక్షించడం, విడిపించడం అనే విస్తృత భావం ఉంది. ‘రక్షిస్తాడు’ ఆ విస్తృత ధార్మిక ప్రతిధ్వనిని నిలుపుతూ, తక్షణ యుద్ధ సందర్భంలోని విడుదల లేదా విజయాన్ని నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. ‘మీతో వచ్చేవాడు’ కృదంత భావాన్ని నిలుపుతుంది; ‘మీ పక్షంగా’ לָכֶם యొక్క ప్రయోజనార్థక భావాన్ని స్పష్టం చేస్తుంది.
