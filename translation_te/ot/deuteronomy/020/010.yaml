id: DEU.20.10
reference: Deuteronomy 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תִקְרַ֣ב אֶל עִ֔יר לְ/הִלָּחֵ֖ם עָלֶ֑י/הָ וְ/קָרָ֥אתָ אֵלֶ֖י/הָ לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: te
  text: నీవు ఒక పట్టణానికి వ్యతిరేకంగా యుద్ధం చేయడానికి దాని దగ్గరికి వచ్చినప్పుడు, దానికి శాంతి ప్రతిపాదనను తెలియజేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “దానికి శాంతి కోసం పిలవాలి”; “దానికి శాంతి నిబంధనలు ప్రకటించాలి” లేదా “దానికి శాంతిని అందించాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: వచ్చినప్పుడు
  rationale: ఇక్కడ కారణార్థం కాకుండా, యుద్ధానికి సంబంధించిన విధానాన్ని తెలిపే కాలసూచక పరిస్థితిని పరిచయం చేస్తుంది.
- source_word: תִקְרַב
  choice: దగ్గరికి వచ్చినప్పుడు
  rationale: పట్టణాన్ని సమీపించే ప్రత్యక్ష కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִיר
  choice: ఒక పట్టణం
  rationale: ఏదైనా ఒక పట్టణాన్ని సూచించే ఏకవచన నామవాచకానికి సహజమైన అనిర్దిష్ట రూపం.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: పట్టణంతో యుద్ధం చేయడానికి
  rationale: לחם యొక్క యుద్ధార్థాన్నీ, עַל యొక్క విరోధ సంబంధాన్నీ తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పట్టణానికి వ్యతిరేకంగా’ అన్నదానికంటే ‘పట్టణంతో యుద్ధం చేయడం’ సులభంగా అర్థమవుతుంది.
- source_word: וְקָרָאתָ אֵלֶיהָ
  choice: దానికి ... ప్రతిపాదన చేయాలి
  rationale: కేవలం పిలవడం అనే శబ్దార్థం కంటే, ఈ సందర్భంలో పట్టణానికి అధికారికంగా తెలియజేయడం అనే భావాన్ని అందిస్తుంది.
- source_word: לְשָׁלוֹם
  choice: శాంతి ప్రతిపాదన
  rationale: ఇక్కడ שָׁלוֹם సాధారణ ప్రశాంతతను మాత్రమే కాకుండా, యుద్ధానికి ముందు సమర్పించే శాంతి లేదా లొంగుబాటు నిబంధనల ప్రతిపాదనను సూచిస్తుంది; అయితే నిబంధనల వివరాలను పాఠ్యంలో చేర్చలేదు.
