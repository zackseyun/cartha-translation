  to: నీవు ఒక పట్టణానికి వ్యతిరేకంగా యుద్ధం చేయడానికి దాని దగ్గరికి వచ్చినప్పుడు, దానికి శాంతి ప్రతిపాదనను తెలియజేయాలి.[a]
