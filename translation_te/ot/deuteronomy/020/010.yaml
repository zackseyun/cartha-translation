translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయనియమానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. నగరాన్ని సూచించే స్త్రీలింగ ప్రత్యయాలను తెలుగులో సహజంగా ‘దాని/దానికి’గా వ్యక్తం చేశాం.
