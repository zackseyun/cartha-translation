source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ הַ/הֹלֵ֣ךְ לִ/פְנֵי/כֶ֔ם ה֖וּא יִלָּחֵ֣ם לָ/כֶ֑ם כְּ֠/כֹל אֲשֶׁ֨ר עָשָׂ֧ה אִתְּ/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే మీకు ముందుగా వెళ్లేవాడు; ఆయన తానే మీ కోసం పోరాడతాడు, ఐగుప్తులో మీ కళ్ల ఎదుట ఆయన మీతో[a] చేసినవాటన్నిటిలాగే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీతో చేసినవాటన్నీ.” సందర్భంలో ఇది ఐగుప్తులో ఇశ్రాయేలీయుల పక్షాన యాహ్వే చేసిన కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఉంచి, אֱלֹהֵיכֶם యొక్క ఏకవచన భావాన్ని ‘మీ దేవుడు’గా వ్యక్తం చేసింది.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: మీకు ముందుగా వెళ్లేవాడు
  rationale: వర్తమాన కృదంతం సూచించే నిరంతర దైవ నాయకత్వాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: הוּא יִלָּחֵם לָכֶם
  choice: తానే మీ పక్షంగా పోరాడతాడు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘తానే’తో, לָכֶם లోని ప్రయోజనార్థక భావాన్ని ‘మీ పక్షంగా’తో తెలిపింది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אִתְּכֶם
  choice: మీతో చేసినదంతా చేసినట్లే చేస్తాడు
  rationale: כְּכֹל אֲשֶׁר లోని సంపూర్ణ పోలికను నిలిపి, אִתְּכֶם యొక్క మూలపాఠ రూపమైన ‘మీతో’ను అనవసరంగా ‘మీ కోసం’గా పరిష్కరించలేదు.
- source_word: בְּמִצְרַיִם לְעֵינֵיכֶם
  choice: ఐగుప్తులో మీ కళ్ల ఎదుట
  rationale: స్థల సూచనను, ఇశ్రాయేలు ప్రత్యక్షంగా చూశారనే హీబ్రూ నుడికారాన్ని సూటిగా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవ నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయలేదు; తెలుగులో విస్తృతంగా గుర్తించదగిన రూపాన్ని వాడింది.
- issue: עָשָׂה אִתְּכֶם లోని సంబంధ భావం
  choice: మీతో చేసినది
  alternative: మీ కోసం చేసినది
  rationale: సందర్భం ఇశ్రాయేలు పక్షాన దేవుని కార్యాన్ని సూచించినప్పటికీ, హీబ్రూ అక్షరార్థంలోని ‘మీతో’ అనే కొంత విస్తృతమైన భావాన్ని ప్రధాన పాఠంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘తానే’తో మూలంలోని ఉద్ఘాటనను, ‘మీ కళ్ల ఎదుట’తో ప్రత్యక్ష సాక్ష్య భావాన్ని నిలిపింది.
