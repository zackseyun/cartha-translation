source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: te
  text: అప్పుడు మనం హోరేబు నుండి బయలుదేరి, అమోరీయుల కొండప్రాంతానికి వెళ్లే మార్గంలో మీరు చూసిన ఆ విశాలమైన, భయం కలిగించే అరణ్యమంతటినీ దాటి ప్రయాణించి, మన దేవుడైన యహ్వే మనకు ఆజ్ఞాపించినట్టే కాదేషు-బర్నేయ వరకు వచ్చాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“భయం కలిగించే” అని అనువదించిన హీబ్రూ పదం భయం, విస్మయభీతి లేదా భీతిని కలిగించేదాన్ని సూచించగలదు. మరో అనువాదం: “ఆ విశాలమైన, భయంకరమైన అరణ్యం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: మనం హోరేబు నుండి బయలుదేరి
  rationale: נסע శిబిరాన్ని ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: అరణ్యమంతటా ప్రయాణించి
  rationale: הלך తో కూడిన אֵת ఇక్కడ అరణ్యాన్ని దాటుతూ ప్రయాణించడాన్ని సూచిస్తుంది. ‘అరణ్యమంతటా ప్రయాణించి’ ప్రాంతమంతటినీ దాటిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּדְבָּר הַגָּדוֹל וְהַנּוֹרָא
  choice: ఆ విశాలమైన, భయం పుట్టించే అరణ్యం
  rationale: גדול పరిమాణపరంగా ‘విశాలమైన’ అని, נורא భయాన్ని లేదా విస్మయభీతిని కలిగించేదిగా అర్థమవుతుంది. ఇక్కడ ప్రతికూల నైతిక భావం చేర్చకుండా అనుభవాత్మక భయాన్ని నిలిపాము.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: అమోరీయుల కొండప్రాంతానికి వెళ్లే మార్గంలో
  rationale: הר ఇక్కడ ఒకే కొండకన్నా సామూహిక ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది; דרך గమ్యానికి దారితీసే మార్గ భావాన్ని కలిగి ఉంది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר దైవ ఆజ్ఞకు అనుగుణంగా ప్రయాణం జరిగిందనే సరిపోలికను బలంగా తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వినిపించే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించి, אֱלֹהֵינוּ ను ‘మన దేవుడు’గా అనువదించాము.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: కాదేషు-బర్నేయ
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాము.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపాము; సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాము.
- issue: נוֹרָא లోని భయం/విస్మయభీతి పరిధి
  choice: భయం పుట్టించే
  alternative: భయంకరమైన
  rationale: ఈ విశేషణం భయం, విస్మయం లేదా దిగులు కలిగించేదాన్ని సూచించగలదు. ‘భయం పుట్టించే’ అనేది అరణ్యపు ప్రభావాన్ని తెలుపుతూ, ‘భయంకరమైన’లో రావచ్చే అతిశయాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘అరణ్యం,’ ‘కొండప్రాంతం,’ ‘బయలుదేరి’ వంటి సహజ పదాలను ఎంచుకున్నాము; మూలంలోని ప్రత్యక్ష సాక్ష్య సూచన ‘మీరు చూసిన’ అలాగే నిలిపాము.
