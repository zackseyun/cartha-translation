source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: te
  text: 'యాహ్వే నాతో ఇలా అన్నాడు: “వారితో ఇలా చెప్పు: మీరు పైకి వెళ్లవద్దు, యుద్ధం చేయవద్దు; ఎందుకంటే నేను మీ మధ్య లేను. లేకపోతే మీ శత్రువుల ఎదుట మీరు ఓడిపోతారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ శత్రువుల ఎదుట మీరు దెబ్బతింటారు.”
    reason: נגף అనే క్రియ సైనిక సందర్భంలో ఓడిపోవడాన్ని లేదా దెబ్బతినడాన్ని/కొట్టబడడాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ రూపానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: నాతో ఇలా అన్నాడు
  rationale: కథన సందర్భంలోని సాధారణ పలుకుబడిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱמֹר לָהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: ఆజ్ఞారూపాన్ని, దాని వెంట వచ్చే ప్రత్యక్ష సందేశాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: לֹא תַעֲלוּ
  choice: మీరు ఎక్కి వెళ్లవద్దు
  rationale: עלה అనే క్రియలోని పైకి వెళ్లే భౌగోళిక భావాన్ని తెలుగు పాఠకునికి సహజంగా నిలుపుతుంది.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: యుద్ధం చేయవద్దు
  rationale: ఈ సైనిక సందర్భంలో לחם యొక్క భావాన్ని స్పష్టంగా, సాధారణ తెలుగులో అందిస్తుంది.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: ఎందుకంటే నేను మీ మధ్య లేను
  rationale: בקרבכם లోని ‘మీ మధ్యలో’ అనే సన్నిధి భావాన్ని వ్యాఖ్యానించి విస్తరించకుండా నిలుపుతుంది.
- source_word: וְלֹא תִּנָּגְפוּ לִפְנֵי אֹיְבֵיכֶם
  choice: లేకపోతే మీ శత్రువుల ఎదుట మీరు ఓడిపోతారు
  rationale: హెబ్రీ ప్రతికూల ఫలిత వాక్యాన్ని సందర్భానుసారమైన హెచ్చరికగా తెలుగులో సహజంగా తెలియజేస్తుంది; దాన్ని ‘ఓడిపోరు’ అని తప్పుగా అర్థమయ్యేలా చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని అలాగే గుర్తించదగిన రూపంలో ఉంచి, దానిని సాధారణ బిరుదుగా మార్చలేదు.
- issue: וְלֹא תִּנָּגְפוּ యొక్క వాక్యబలం
  choice: అవిధేయత వల్ల కలిగే ఫలితాన్ని తెలిపే హెచ్చరికగా ‘లేకపోతే ... ఓడిపోతారు’
  alternative: ‘మీరు ఓడిపోకుండా’ లేదా అక్షరార్థంగా ‘మీరు ఓడిపోరు’
  rationale: సందర్భంలో దేవుని సన్నిధి లేకుండా యుద్ధానికి వెళితే ఓటమి కలుగుతుందని హెచ్చరిస్తోంది. తెలుగు ప్రతికూల నిర్మాణం రక్షణ వాగ్దానంలా అపార్థం కాకుండా ఫలితాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘ఎక్కి వెళ్లవద్దు’ భౌగోళిక కదలికను నిలుపుతుంది; చివరి హెచ్చరికను సహజమైన తెలుగు కారణ-ఫలిత నిర్మాణంలో ఇచ్చాం.
