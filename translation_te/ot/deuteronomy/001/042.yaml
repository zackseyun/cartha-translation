revisions:
- from: 'యాహ్వే నాతో ఇలా అన్నాడు: “వారితో ఇలా చెప్పు: ‘మీరు ఎక్కి వెళ్లవద్దు; యుద్ధం చేయవద్దు. ఎందుకంటే నేను మీ మధ్య లేను. లేకపోతే మీ శత్రువుల ఎదుట మీరు ఓడిపోతారు[a].’”'
  to: 'యాహ్వే నాతో ఇలా అన్నాడు: “వారితో ఇలా చెప్పు: మీరు పైకి వెళ్లవద్దు, యుద్ధం చేయవద్దు; ఎందుకంటే నేను మీ మధ్య లేను. లేకపోతే మీ శత్రువుల ఎదుట మీరు ఓడిపోతారు[a].”'
  rationale: ప్రధాన అనువాదంలోని హెచ్చరిక-ఫలిత నిర్మాణాన్ని నిలుపుతూ, עלה కు సహజమైన ‘పైకి వెళ్లవద్దు’ను వాడాం. పాదటిప్పణిలో మరణాన్ని నిర్బంధించే ‘హతమవుతారు’ను తొలగించి, మూలక్రియలోని విస్తృతమైన ‘దెబ్బతింటారు’ భావాన్ని ఇచ్చాం. ఆంగ్ల ఆడిట్‌లో పాదటిప్పణి అక్షర-సూచికలు అసంగతంగా ఉన్నప్పటికీ, తెలుగు పాఠంలో [a] సరైన చివరి క్రియకే అనుసంధానించబడి ఉంది.
