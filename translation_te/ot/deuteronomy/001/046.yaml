  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: te
  text: కాబట్టి మీరు కాదేషులో చాలా రోజులు[a] ఉండిపోయారు—మీరు అక్కడ ఉండిపోయిన రోజులవలె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “చాలా రోజులు—మీరు ఉండిపోయిన రోజులవలె.” చివరి పదబంధం సంక్షిప్తంగా ఉంది; దీనిని “మీరు అక్కడ ఉండినంత కాలం” అని కూడా అర్థం చేసుకోవచ్చు; లేదా అది సాధారణంగా “చాలాకాలం” అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: కాబట్టి మీరు … ఉండిపోయారు
  rationale: ישׁב అనే క్రియ ఇక్కడ ఒకచోట కొనసాగి ఉండడాన్ని సూచిస్తుంది. ముందటి వాక్యంలోని పరిణామాన్ని కథనంలో కొనసాగించే וַ భావాన్ని ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: בְקָדֵשׁ
  choice: కాదేషులో
  rationale: కాదేషు స్థలనామం; సందర్భంలో వారు అక్కడ మకాం చేసి ఉండడాన్ని సహజమైన తెలుగు విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: יָמִים רַבִּים
  choice: చాలా రోజులు
  rationale: హీబ్రూ నామవాచక-విశేషణ పదబంధాన్ని నేరుగా నిలుపుతుంది; ‘చాలాకాలం’ అనే భావానువాదం కంటే మూలంలోని ‘రోజులు’ను కాపాడుతుంది.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: మీరు అక్కడ గడిపిన రోజులంత కాలం
  rationale: כְּ యొక్క పోలిక/పరిమాణ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూనే, మూలంలోని సంక్షిప్తమైన మరియు కొంత అస్పష్టమైన పోలికను పూర్తిగా విడిచిపెట్టదు. ‘అక్కడ’ అనేది కాదేషును సూచిస్తూ సందర్భం నుంచి స్పష్టత కోసం చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని పునరుక్తి మరియు చివరి పోలికలోని అస్పష్టతను ప్రధాన వాక్యం, పాదసూచిక ద్వారా నిలుపుకున్నాం.
