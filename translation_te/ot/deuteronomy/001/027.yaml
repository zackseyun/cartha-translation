id: DEU.1.27
reference: Deuteronomy 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: te
  text: 'మీ గుడారాల్లో మీరు గొణుగుతూ ఇలా అన్నారు: “యాహ్వే మనల్ని ద్వేషిస్తున్నందువల్ల[a], అమోరీయుల చేతికి మనల్ని అప్పగించడానికి[b], మనల్ని నాశనం చేయడానికి ఆయన మనల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా, “యాహ్వే మనల్ని ద్వేషించడంలో”; ఇక్కడ అది కారణాన్ని సూచిస్తూ, “యాహ్వే మనల్ని ద్వేషిస్తున్నందువల్ల” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “అమోరీయుని చేతిలో మనల్ని ఇవ్వడానికి”; ‘అమోరీయుడు’ ఇక్కడ ఆ ప్రజలందరినీ సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: సణుగుతూ
  rationale: రגן అనే క్రియ అసంతృప్తితో లోలోపల గొణగడం లేదా ఫిర్యాదు చేయడం అనే ప్రతికూల భావాన్ని ఇస్తుంది. ‘సణుగుతూ’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְאָהֳלֵיכֶם
  choice: మీ గుడారాల్లో
  rationale: ఇది నేరుగా స్థలాన్ని సూచించే పదబంధం; అరణ్య ప్రయాణంలోని గుడారాల నేపథ్యాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: యాహ్వే మనల్ని ద్వేషిస్తున్నందువల్లనే
  rationale: ב ఉపసర్గతో వచ్చిన ‘ద్వేషం’ అనే భావనామం ఇక్కడ కారణార్థకంగా ఉంది. ఇశ్రాయేలీయులు చేసిన ఆరోపణను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుంచి మనల్ని బయటకు తీసుకొచ్చాడు
  rationale: ‘దేశం’ అనే మూలపాఠంలోని పదాన్ని ఉంచుతూ, నిర్గమనాన్ని సూచించే వాక్యరూపాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: అమోరీయుల చేతికి మనల్ని అప్పగించి
  rationale: ‘ఒకరి చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారం వారి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగు ‘చేతికి అప్పగించడం’ అర్థాన్నీ రూపకాన్నీ సహజంగా నిలుపుతుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: హీబ్రూలో రూపపరంగా ఏకవచనమైనా, ఇక్కడ ఇది ఒక ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; అందువల్ల తెలుగులో బహువచనం సహజం.
- source_word: לְהַשְׁמִידֵנוּ
  choice: నాశనం చేయడానికి
  rationale: שׁמד హిఫిల్ రూపం పూర్తిగా నాశనం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నాశనం చేయడం’ సందర్భానికి తగిన, గంభీరమైన సాధారణ తెలుగు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది.
- issue: నాశనం చేసే కర్త ఎవరు అనే భావసంబంధం
  choice: మూలంలోని ఉద్దేశార్థక నిర్మాణాన్ని నిలుపుతూ, యాహ్వే అమోరీయుల ద్వారా నాశనం చేయిస్తాడనే ఆరోపణగా తెరిచి ఉంచడం
  alternative: ‘అమోరీయులు మనల్ని నాశనం చేయడానికి’ అని కర్తను స్పష్టంగా పేర్కొనడం
  rationale: לְהַשְׁמִידֵנוּ అనే క్రియారూపంలో కర్తను ప్రత్యేకంగా చెప్పలేదు. అందువల్ల అమోరీయులనే ప్రత్యక్ష కర్తగా చేర్చి మూలంలోని స్వల్ప అస్పష్టతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘సణుగుతూ’, ‘గుడారాల్లో’, ‘చేతికి అప్పగించి’ వంటి సాధారణ పదాలతో మూలంలోని దృశ్యరూపం, నుడికారం నిలుపబడ్డాయి. ఉద్ధరణలోని ఆరోపణాత్మక స్వరం బలంగా ఉండేందుకు ‘వల్లనే’, ‘చేయడానికే’ ఉపయోగించబడ్డాయి.
