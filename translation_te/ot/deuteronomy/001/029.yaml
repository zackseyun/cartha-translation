  source_fidelity: 'హీబ్రూ వాక్యంలో రెండు సమాంతర నిషేధాలు ఉన్నాయి: תַּעַרְצוּן (‘బెదిరిపోవడం/భీతిచెందడం’) మరియు תִּירְאוּן (‘భయపడడం’). ముసాయిదా ఈ భేదాన్ని మొత్తంగా కాపాడుతుంది. అయితే ‘వారిని చూసి’ అనేది మూలంలోని מֵהֶם (‘వారి వల్ల/వారిని గురించి’) కంటే దృశ్య-సందర్భాన్ని కొద్దిగా అదనంగా సూచిస్తుంది.'
  naturalness: ‘భయభ్రాంతులకు గురికావద్దు’ అర్థవంతమైనదే అయినా, ఈ సంక్షిప్త ప్రోత్సాహక ఆజ్ఞకు ‘బెదిరిపోవద్దు’ మరింత సహజమైన, నేరైన ఆధునిక ప్రామాణిక తెలుగు. ‘వారికి భయపడవద్దు’ కూడా సహజంగా ఉంది.
  terminology: ప్రత్యేక దైవనామాలు లేదా సాంకేతిక వేదాంత పదాలు లేవు. ‘బెదిరిపోవద్దు’ మరియు ‘భయపడవద్దు’ ద్వారా మూలంలోని ఉద్దేశపూర్వక పునరుక్తి, స్వల్ప తీవ్రతాభేదం నిలుస్తాయి.
