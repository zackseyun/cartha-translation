translation:
  language: te
  text: అప్పుడు నేను మీతో, “వారి వల్ల బెదిరిపోవద్దు; వారికి భయపడవద్దు” అని చెప్పాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעַרְצוּן
  choice: భయభ్రాంతులకు గురికావద్దు
  rationale: ఈ క్రియలో ఉన్న తీవ్ర భయానికి లేదా బెదిరిపోవడానికి సంబంధించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תִירְאוּן
  choice: భయపడవద్దు
  rationale: సాధారణంగా ‘భయపడడం’ అనే అర్థాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: מֵהֶם
  choice: వారిని చూసి / వారికి
  rationale: హీబ్రూ ఉపసర్గతో కూడిన సర్వనామం రెండు సమాంతర నిషేధాల్లోనూ భయానికి కారణం లేదా లక్ష్యంగా ‘వారిని’ సూచిస్తుంది; తెలుగులో ప్రతి క్రియకు సహజమైన విభక్తిని వాడాం.
theological_decisions: []
translation_notes:
  register: మోషే గతంలో చెప్పిన మాటను ఉటంకిస్తున్న సందర్భానికి తగిన గౌరవప్రదమైన, సులభమైన ఆధునిక ప్రామాణిక తెలుగు. హీబ్రూలోని రెండు సమాంతర భయపదాల తీవ్రతాభేదాన్ని ‘భయభ్రాంతులకు గురికావద్దు’ మరియు ‘భయపడవద్దు’గా నిలిపాం.
