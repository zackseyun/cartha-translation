source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: te
  text: న్యాయవిచారణలో పక్షపాతం చూపకూడదు[a]. అల్పునినీ గొప్పవానినీ ఒకేలా వినాలి. ఏ వ్యక్తినీ చూసి భయపడి వెనుకాడకూడదు[b]; ఎందుకంటే తీర్పు దేవునిదే. మీకు మరీ కష్టమైన విషయాన్ని నా దగ్గరకు తీసుకురావాలి; నేను దాన్ని వింటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘తీర్పులో ముఖాలను గుర్తించకూడదు’; ఇది పక్షపాతం లేదా మొగ్గు చూపడాన్ని తెలిపే జాతీయం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏ వ్యక్తి ఎదుటా భయపడకూడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: పక్షపాతం చూపకూడదు
  rationale: అక్షరార్థంగా ‘ముఖాలను గుర్తించడం’ అయిన ఈ న్యాయపరమైన జాతీయం వ్యక్తుల స్థాయిని బట్టి మొగ్గు చూపడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పక్షపాతం చూపడం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: בַּמִּשְׁפָּט
  choice: తీర్పు చెప్పేటప్పుడు
  rationale: ఇక్కడ מִשְׁפָּט న్యాయవిచారణలో నిర్ణయం చెప్పే సందర్భాన్ని సూచిస్తుంది; అమూర్తమైన ‘న్యాయం’ కంటే ఈ రూపం సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: అల్పుడి వాదననైనా గొప్పవాడి వాదననైనా ఒకేలా
  rationale: ఈ జంట తక్కువ, ఎక్కువ సామాజిక స్థాయి గల వ్యక్తులను వ్యత్యాసపరుస్తుంది. ‘అల్పుడు—గొప్పవాడు’ మూలంలోని సామాజిక వ్యత్యాసాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: תִּשְׁמָעוּן
  choice: వినాలి
  rationale: న్యాయ సందర్భంలో שׁמע ఒక వ్యక్తి వాదనను లేదా కేసును విచారణార్థం వినడాన్ని సూచిస్తుంది. తెలుగులో కర్మను స్పష్టంచేయడానికి ‘వాదనను వినాలి’ అని ఇచ్చాం.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: ఎవరికీ భయపడి వెనుకాడకూడదు
  rationale: ఈ క్రియకు ‘భయపడడం’ లేదా భయంతో వెనుకంజ వేయడం అనే భావం ఉంది. ‘భయపడి వెనుకాడడం’ న్యాయాధికారులు వ్యక్తుల ఒత్తిడికి లొంగకూడదనే సందర్భబలాన్ని అందిస్తుంది.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: ఎందుకంటే తీర్పు దేవునిదే
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తమైన దైవాధికార ప్రకటనను అదనపు సిద్ధాంత వివరణ లేకుండా నేరుగా నిలుపుతుంది.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: మీకు మరీ కష్టమైన విషయాన్ని
  rationale: ఇది న్యాయాధికారులు పరిష్కరించలేనంత కఠినమైన విషయం లేదా కేసును సూచిస్తుంది. ‘విషయం’ మూలపదపు విస్తృతిని నిలుపుతుంది.
- source_word: תַּקְרִבוּן אֵלַי
  choice: నా దగ్గరకు తీసుకురావాలి
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అని అర్థం. న్యాయవిషయాన్ని మోషే ఎదుట ఉంచడాన్ని ఈ సహజ తెలుగు వ్యక్తీకరణ తెలియజేస్తుంది.
- source_word: וּשְׁמַעְתִּיו
  choice: నేను దాన్ని వింటాను
  rationale: ప్రత్యయం ముందున్న ‘విషయం’ వైపు సూచించడం అత్యంత సహజం. ‘వింటాను’ న్యాయవిచారణ భావాన్ని నిలుపుతుంది; ‘తీర్మానిస్తాను’ అనడం మూలాన్ని మించి ఉంటుంది.
theological_decisions:
- issue: ‘తీర్పు దేవునిదే’ అనే మాటలో న్యాయాధికారానికి ఆధారం
  choice: న్యాయతీర్పు దేవునికి చెందినదని నేరుగా అనువదించడం
  alternative: దేవుడు న్యాయాధికారులకు తీర్పు తీర్చుతాడని లేదా తీర్పు కేవలం దైవధర్మశాస్త్రమేనని విస్తరించడం
  rationale: హీబ్రూ నేరుగా తీర్పు దేవునిదని మాత్రమే చెబుతుంది. దేవుని అధికారము, న్యాయాధికారుల జవాబుదారీతనం, దైవధర్మశాస్త్రం వంటి సాధ్యమైన అంతర్భావాల్లో ఒక్కదానిని ప్రత్యేకంగా నిర్ణయించకుండా ఉద్రిక్తతను నిలిపాం.
- issue: אִישׁ అనే వ్యాకరణపరంగా పుంలింగ ఏకవచన పదం యొక్క సాధారణార్థం
  choice: తెలుగులో సహజమైన సాధారణార్థంతో ‘ఎవరికీ’
  alternative: ‘ఏ పురుషునికీ’
  rationale: ఈ సందర్భంలో పదం ఏ వ్యక్తినైనా సూచించే సాధారణ ప్రయోగం. తెలుగులో ‘ఏ పురుషునికీ’ అంటే అనవసరంగా లింగపరిమితి ఏర్పడుతుంది; ‘ఎవరికీ’ మూలంలోని సాధారణ పరిధిని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన న్యాయపరమైన శైలిని ఉపయోగించాం. మూలంలోని రెండవ పురుష బహువచన ఆజ్ఞలను తెలుగులో సహజమైన విధ్యర్థక ‘కూడదు/వినాలి/తీసుకురావాలి’ రూపాలతో అందించాం. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
