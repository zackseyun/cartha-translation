  to: న్యాయవిచారణలో పక్షపాతం చూపకూడదు[a]. అల్పునినీ గొప్పవానినీ ఒకేలా వినాలి. ఏ వ్యక్తినీ చూసి భయపడి వెనుకాడకూడదు[b]; ఎందుకంటే తీర్పు దేవునిదే. మీకు మరీ కష్టమైన విషయాన్ని నా దగ్గరకు తీసుకురావాలి; నేను దాన్ని వింటాను.
