id: DEU.1.41
reference: Deuteronomy 1:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: te
  text: 'అప్పుడు మీరు నాకు జవాబిచ్చి ఇలా అన్నారు: “మేము యాహ్వేకు విరోధంగా పాపం చేశాం. మన దేవుడైన యాహ్వే మాకు ఆజ్ఞాపించినదంతటి ప్రకారం మేమే పైకి వెళ్లి యుద్ధం చేస్తాం.” అప్పుడు మీలో ప్రతి పురుషుడు తన యుద్ధసామగ్రిని కట్టుకొని, తెగించి[a] కొండప్రాంతానికి ఎక్కివెళ్లారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తొందరపడి ఎక్కివెళ్లారు,” “అహంకారంగా ఎక్కివెళ్లడానికి సాహసించారు.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; అది మితిమీరిన ఆత్మవిశ్వాసంతో లేదా తొందరపాటుతో చేసిన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “కొండకు.” ఈ సందర్భంలో అది విస్తృతమైన కొండప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: మీరు నాకు ఇలా జవాబిచ్చారు
  rationale: ענה మరియు אמר కలయిక మోషేకు ఇచ్చిన ప్రత్యుత్తరాన్ని సూచిస్తుంది; తెలుగులో పునరుక్తి లేకుండా సహజంగా ‘ఇలా జవాబిచ్చారు’ అని వ్యక్తమవుతుంది.
- source_word: חָטָאנוּ לַיהוָה
  choice: మేము యెహోవాకు విరోధంగా పాపం చేశాం
  rationale: חטא తో ఉన్న ל ఇక్కడ అపరాధానికి గురైన వ్యక్తిని సూచిస్తుంది; ‘విరోధంగా’ అనే పదం ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: మేమే పైకి వెళ్లి యుద్ధం చేస్తాం
  rationale: עלה లోని పైకి వెళ్లే దిశను నిలుపుతూ, స్వతంత్ర సర్వనామమైన אֲנַחְנוּ ఇచ్చే ఉద్ఘాటనను ‘మేమే’ ద్వారా ప్రతిబింబిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: ఆజ్ఞాపించినదంతా పాటిస్తూ
  rationale: ככל אשר ఆజ్ఞ మొత్తానికి అనుగుణంగా చేయడాన్ని సూచిస్తుంది; ‘పాటిస్తూ’ తెలుగులో ఆ conformity భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: మీలో ప్రతి పురుషుడు తన యుద్ధాయుధాలను ధరించుకొని
  rationale: חגר అంటే సామగ్రిని నడుముకు కట్టుకోవడం లేదా ధరించడం; כלי מלחמה ను అతిగా నిర్దిష్టం చేయకుండా ‘యుద్ధాయుధాలు’గా అందించింది. איש యొక్క విభాజక ఏకవచన భావం ‘ప్రతి పురుషుడు’లో నిలుస్తుంది.
- source_word: וַתָּהִינוּ
  choice: తెగించారు
  rationale: ఈ అరుదైన క్రియ సందర్భంలో తొందరపాటు, మితిమీరిన ఆత్మవిశ్వాసంతో సాహసించడాన్ని సూచిస్తుంది. ‘తెగించారు’ ఆ చర్యను సంక్షిప్తంగా తెలియజేస్తూ, దాని ప్రతికూల ఛాయను పూర్తిగా స్థిరపరచకుండా ఉంచుతుంది.
- source_word: לַעֲלֹת הָהָרָה
  choice: కొండప్రాంతానికి ఎక్కివెళ్లడానికి
  rationale: దిశాసూచక ה గమ్యదిశను సూచిస్తుంది; הָהָר ఈ సందర్భంలో ఒకే కొండకన్నా విస్తృతమైన కొండప్రాంతాన్ని సూచించవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నిలిపి, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: וַתָּהִינוּ లోని నైతిక ఛాయ
  choice: తెగించారు
  alternative: అహంకారంగా బయలుదేరారు / తొందరపడి ఎక్కారు
  rationale: తదుపరి సందర్భం వారి చర్య అవిధేయమైనదని చూపుతుంది; అయితే అరుదైన క్రియకు ‘సిద్ధపడ్డారు,’ ‘తొందరపడ్డారు,’ ‘అహంకారంగా సాహసించారు’ వంటి అర్థసాధ్యతలు ఉన్నాయి. ప్రధాన పాఠం ప్రతికూల సాహసభావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: הָהָר యొక్క భౌగోళిక పరిధి
  choice: కొండప్రాంతం
  alternative: కొండ
  rationale: ఈ సందర్భంలో అది ఒకే పర్వతశిఖరాన్ని కాక విస్తృత పర్వత/కొండ ప్రాంతాన్ని సూచించే అవకాశం ఉంది; అయినా హీబ్రూ రూపం అక్షరార్థంగా ‘కొండ’ అని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణలో సహజమైన ‘చేశాం/చేస్తాం’ రూపాలు, కథనంలో గౌరవబహువచన క్రియారూపాలు ఉపయోగించబడ్డాయి. భాష గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచబడింది.
