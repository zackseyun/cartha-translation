revisions:
- from: 'అప్పుడు మీరు నాకు ఇలా జవాబిచ్చారు: “మేము యెహోవాకు విరోధంగా పాపం చేశాం. మన దేవుడైన యెహోవా మాకు ఆజ్ఞాపించినదంతా పాటిస్తూ, మేమే పైకి వెళ్లి యుద్ధం చేస్తాం.” ఆ తర్వాత మీలో ప్రతి పురుషుడు తన యుద్ధాయుధాలను ధరించుకొని, కొండప్రాంతానికి ఎక్కివెళ్లడానికి తెగించారు.[a][b]'
  to: 'అప్పుడు మీరు నాకు జవాబిచ్చి ఇలా అన్నారు: “మేము యాహ్వేకు విరోధంగా పాపం చేశాం. మన దేవుడైన యాహ్వే మాకు ఆజ్ఞాపించినదంతటి ప్రకారం మేమే పైకి వెళ్లి యుద్ధం చేస్తాం.” అప్పుడు మీలో ప్రతి పురుషుడు తన యుద్ధసామగ్రిని కట్టుకొని, తెగించి[a] కొండప్రాంతానికి ఎక్కివెళ్లారు.[b]'
  rationale: ఆడిట్‌లో నిర్ణయించిన దైవనామ రూపానికి అనుగుణంగా ‘యాహ్వే’గా మార్చబడింది. యుద్ధపరికరాల పదాన్ని విస్తృతార్థంలో సవరించి, అరుదైన హీబ్రూ క్రియకు సందర్భానుకూలమైన ప్రతికూల ఛాయను ప్రధాన పాఠంలో ఉంచాం. రెండు పాదటిప్పణి గుర్తులను అవి వివరించే పదబంధాల వెంటనే ఉంచాం.
