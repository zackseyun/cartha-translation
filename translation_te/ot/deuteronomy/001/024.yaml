  edition: WLC
  text: וַ/יִּפְנוּ֙ וַ/יַּעֲל֣וּ הָ/הָ֔רָ/ה וַ/יָּבֹ֖אוּ עַד נַ֣חַל אֶשְׁכֹּ֑ל וַֽ/יְרַגְּל֖וּ אֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: te
  text: అప్పుడు వారు దిశ మార్చుకొని కొండ ప్రాంతానికి ఎక్కి వెళ్లి, ఎష్కోలు లోయ[a] వరకు చేరి, ఆ ప్రాంతంపై నిఘా వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎష్కోలు వాడి,” లేదా “ఎష్కోలు వాగు”; హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే లోయను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: వారు తిరిగి
  rationale: פנה అనే క్రియ కథన సందర్భంలో ‘తిరుగు’ అనే భావాన్ని ఇస్తుంది; తెలుగు కథనశైలిలో ‘వారు తిరిగి’ సహజంగా ఉంది.
- source_word: וַיַּעֲלוּ
  choice: ఎక్కి
  rationale: עלה పైకి వెళ్లడాన్ని సూచిస్తుంది; భూభాగాన్ని ఎక్కి వెళ్లే భావాన్ని ‘ఎక్కి’ సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הָהָרָה
  choice: కొండ ప్రాంతానికి
  rationale: దిశను సూచించే అంత్యం కొండ/పర్వత ప్రాంతం వైపు కదలికను తెలియజేస్తుంది; సందర్భానుసారం ‘కొండ ప్రాంతం’ ఆధునిక తెలుగులో భౌగోళికంగా సహజం.
- source_word: וַיָּבֹאוּ עַד
  choice: వరకు వచ్చి
  rationale: בוא తో కూడిన עַד ఒక నిర్దిష్ట స్థలం వరకు చేరడాన్ని సూచిస్తుంది; ‘వరకు వచ్చి’ ఆ సరిహద్దు భావాన్ని నిలుపుతుంది.
- source_word: נַחַל אֶשְׁכֹּל
  choice: ఎష్కోలు లోయ
  rationale: נחל లోయ, వాగులోయ లేదా కాలానుగుణ జలప్రవాహం గల కనుమను సూచించగలదు. ప్రధాన పాఠంలో ‘లోయ’ స్పష్టంగా, సహజంగా ఉంది; ఇతర భావాలను పాదసూచికలో ఉంచాం.
- source_word: וַיְרַגְּלוּ
  choice: వేగుచూశారు
  rationale: రגל పియేల్ రూపం సాధారణంగా పరిశీలించడం మాత్రమే కాక గూఢచారులుగా భూభాగాన్ని పరిశీలించడాన్ని సూచిస్తుంది; ‘వేగుచూశారు’ ఆ నిఘా భావాన్ని నిలుపుతుంది.
- source_word: אֹתָהּ
  choice: ఆ ప్రాంతాన్ని
  rationale: స్త్రీలింగ ఏకవచన కర్మసర్వనామం సందర్భంలోని దేశం లేదా భూభాగాన్ని సూచిస్తుంది. తెలుగులో అస్పష్టమైన ‘దానిని’ కంటే ‘ఆ ప్రాంతాన్ని’ సహజంగా అర్థాన్ని వెల్లడిస్తుంది.
