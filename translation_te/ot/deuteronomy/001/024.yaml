translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వేగుచూశారు’ అనే పదం సాధారణ అన్వేషణకన్నా గూఢచారి పరిశీలన భావాన్ని నిలుపుతుంది; נחל పదంలోని భౌగోళిక అస్పష్టతను పాదసూచికలో భద్రపరచాం.
