source:
  edition: WLC
  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: te
  text: అప్పుడు ఆ కొండప్రాంతంలో నివసించే అమోరీయులు[a] మిమ్మల్ని ఎదుర్కోవడానికి బయటికి వచ్చారు. తేనెటీగలు తరుమినట్లే వారు మిమ్మల్ని తరిమి, శేయీరులో హోర్మా వరకు మిమ్మల్ని నలగగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అమోరీయుడు’ అని ఏకవచనంలో ఉంది; అయితే అది అమోరీయుల జనసమూహాన్ని సమష్టిగా సూచిస్తుంది. తరువాతి క్రియలు బహువచనంలో ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి వచ్చారు
  rationale: יצא ఇక్కడ శత్రువులు తమ నివాసప్రాంతం నుంచి ఇశ్రాయేలీయులను ఎదుర్కొనేందుకు వెలుపలికి రావడాన్ని సూచిస్తుంది; తెలుగు కథనంలో ‘బయలుదేరి వచ్చారు’ సహజంగా ఉంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: రూపరీత్యా ఏకవచనమైనా, తరువాతి క్రియలు బహువచనంలో ఉండటంతో ఇది అమోరీయుల సమూహాన్ని సూచించే సమష్టి ఏకవచనం.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: ఆ కొండప్రాంతంలో నివసిస్తున్న
  rationale: יֹשֵׁב స్థిర నివాసాన్ని సూచిస్తుంది. సందర్భంలో הַר ఒక్క కొండకన్నా విస్తృతమైన పర్వత/కొండ ప్రాంతాన్ని సూచించగలదు; ‘కొండప్రాంతం’ ఆ ప్రాంతీయ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לִקְרַאתְכֶם
  choice: మిమ్మల్ని ఎదుర్కోవడానికి
  rationale: לקראת యొక్క మూలభావం ఎదురుగా వెళ్లి కలవడం; యుద్ధ సందర్భంలో ‘ఎదుర్కోవడానికి’ శత్రుత్వ ఉద్దేశాన్ని సహజంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: మిమ్మల్ని తరిమి
  rationale: רדף సైనిక సందర్భంలో వెంబడించడం లేదా తరుమడాన్ని సూచిస్తుంది; తేనెటీగల ఉపమానంతో ‘తరిమి’ తెలుగు వాక్యంలో సజీవంగా సరిపోతుంది.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: తేనెటీగలు తరిమినట్లు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘తేనెటీగలు చేసినట్లు’ అని ఉన్నా, తెలుగులో ఉపమానం స్పష్టంగా, సహజంగా ఉండేందుకు సందర్భసిద్ధమైన ‘తరిమినట్లు’ ఉపయోగించబడింది.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: మిమ్మల్ని చితకబాదారు
  rationale: כתת హిఫీల్ రూపం బలంగా కొట్టి నలగగొట్టడం లేదా ఘోరంగా ఓడించడం అనే భావం ఇస్తుంది; ‘చితకబాదారు’ హింసాత్మకమైన సైనిక పరాజయాన్ని ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשֵׂעִיר
  choice: శేయీరులో
  rationale: בְּ ఇక్కడ చర్య జరిగిన ప్రదేశం లేదా పరిధిని సూచిస్తుంది; ‘శేయీరులో’ ప్రత్యక్ష భౌగోళిక అర్థాన్ని నిలుపుతుంది.
- source_word: עַד חָרְמָה
  choice: హోర్మా వరకు
  rationale: עַד వెంబడింపు లేదా దెబ్బతీయడం చేరిన భౌగోళిక హద్దును సూచిస్తుంది; ‘వరకు’ తెలుగులో దానిని నేరుగా తెలియజేస్తుంది.
