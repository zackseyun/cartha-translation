review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the collective singular ‘Amorite’ with a Telugu plural and correctly conveys the hostile emergence, pursuit, bee comparison, geographic setting, and limit at Hormah. However, ‘తేనెటీగలు తరిమినట్లు’ can sound slightly elliptical and does not as directly retain the source’s general comparison, ‘as bees do.’
  naturalness: The Telugu is generally modern and readable. Recasting the comparison as ‘తేనెటీగలు తరుమినట్లే’ makes the syntax smoother and makes explicit that the Amorites’ pursuit is being compared to bees’ pursuit. ‘చితకబాదారు’ is vivid but comparatively colloquial for this elevated narrative; ‘నలగగొట్టారు’ better conveys the force of the Hebrew while maintaining an appropriate register.
  terminology: ‘అమోరీయులు,’ ‘శేయీరు,’ and ‘హోర్మా’ are suitable forms. The existing footnote appropriately explains the Hebrew collective singular and has a correctly placed anchor.
  issues:
  - severity: low
    issue: The bee comparison is somewhat elliptical in Telugu.
    rationale: The Hebrew says literally ‘as the bees do’; using ‘తేనెటీగలు తరుమినట్లే’ gives the comparison a clear verbal referent without adding interpretive content.
  - severity: low
    issue: ‘చితకబాదారు’ is relatively colloquial.
    rationale: For the forceful Hiphil of כתת in a formal narrative, ‘నలగగొట్టారు’ is more register-appropriate while retaining the sense of crushing defeat.
  revised_text: అప్పుడు ఆ కొండప్రాంతంలో నివసించే అమోరీయులు[a] మిమ్మల్ని ఎదుర్కోవడానికి బయటికి వచ్చారు. తేనెటీగలు తరుమినట్లే వారు మిమ్మల్ని తరిమి, శేయీరులో హోర్మా వరకు మిమ్మల్ని నలగగొట్టారు.
