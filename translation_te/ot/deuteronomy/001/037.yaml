id: DEU.1.37
reference: Deuteronomy 1:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: te
  text: 'మీ కారణంగా యాహ్వే నాపై కూడా కోపించి ఇలా అన్నాడు: “నీవు కూడా అక్కడికి ప్రవేశించవు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: రెండు సందర్భాల్లోనూ చేరికను, నొక్కిచెప్పడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּי הִתְאַנַּף
  choice: నాపట్ల కోపపడి
  rationale: בְּ ఇక్కడ కోపానికి గురైన వ్యక్తిని సూచిస్తుంది; ‘నాపట్ల కోపపడి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בִּגְלַלְכֶם
  choice: మీ కారణంగా
  rationale: కారణార్థాన్ని నేరుగా తెలియజేస్తుంది; ప్రజల పాత్రపై ఈ వచనం ఉంచే నొక్కును తగ్గించదు.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: తదుపరి వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: גַּם אַתָּה
  choice: నువ్వు కూడా
  rationale: ఏకవచన సంబోధన మోషేను సూచిస్తుంది; ‘కూడా’ మూలంలోని చేరిక భావాన్ని కాపాడుతుంది.
- source_word: לֹא תָבֹא שָׁם
  choice: అక్కడికి ప్రవేశించవు
  rationale: వాగ్దాన దేశంలోకి వెళ్లడమే సందర్భార్థం; ‘ప్రవేశించవు’ గమ్యస్థానంలోకి వెళ్లే భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవిక నామాన్ని ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన రూపంతో అందించాం.
- issue: మోషే ప్రవేశించకపోవడానికి ప్రజల కారణత్వం
  choice: ఈ వచనం చెప్పినట్లే ‘మీ కారణంగా’ అని ఉంచడం
  alternative: సంఖ్యాకాండము 20 ఆధారంగా మోషే స్వంత వైఫల్యాన్ని ప్రధాన వాక్యంలో చేర్చడం
  rationale: ద్వితీయోపదేశకాండము 1:37 ప్రజల పాత్రను నొక్కి చెబుతుంది. ఇతర వచనాలతో సమన్వయం చేసి ఈ వచనంలోని ధార్మిక ఉద్రిక్తతను తొలగించకుండా, సంబంధిత వివరాన్ని పాదసూచికలో మాత్రమే సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మోషేను ఉద్దేశించిన ఏకవచనాన్ని ‘నువ్వు’తో, ప్రజలను ఉద్దేశించిన బహువచనాన్ని ‘మీ’తో స్పష్టంగా వేరు చేశాం. మూలంలోని రెండు גַּם పదాలకూ ‘కూడా’ ఉంచాం.
