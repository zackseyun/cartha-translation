  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: te
  text: అప్పుడు మీరు తిరిగి వచ్చి యహ్వే సన్నిధిలో ఏడ్చారు. కానీ యహ్వే మీ స్వరాన్ని వినలేదు, మీ మాటకు చెవియొగ్గలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ స్వరాన్ని ఆలకించలేదు; మీ పట్ల శ్రద్ధ చూపలేదు.” హీబ్రూ పాఠంలో వినడం, శ్రద్ధగా ఆలకించడం అనే భావాలున్న రెండు సమాంతర క్రియలు ఉన్నాయి. యహ్వే వారి మొరకు అనుకూలంగా స్పందించలేదని అవి నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: అప్పుడు మీరు తిరిగి వచ్చి
  rationale: שׁוּב means ‘return/turn back.’ The Telugu wording naturally conveys their return after the failed attack, while ‘అప్పుడు’ reflects the narrative sequence.
- source_word: וַתִּבְכּוּ
  choice: ఏడ్చారు
  rationale: בכה means ‘weep/cry.’ ‘ఏడ్చారు’ is clear modern Telugu and does not add an intensity absent from the Hebrew.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי denotes being before or in the presence of someone. ‘సన్నిధిలో’ is natural, dignified Telugu and preserves the worshipful/covenantal setting.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: The personal divine name is transliterated rather than replaced with a title, preserving the distinction present in the Hebrew source.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: అయితే యహ్వే మీ స్వరాన్ని వినలేదు
  rationale: שׁמע with קול can mean hearing, listening, or heeding. ‘మీ స్వరాన్ని వినలేదు’ stays close to the Hebrew image while the context indicates lack of favorable response, not inability to hear.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: మీ వైపు చెవియొగ్గలేదు
  rationale: האזין means ‘give ear/listen attentively.’ This idiomatic Telugu preserves the second, near-parallel hearing verb and its emphasis without collapsing both clauses into one.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: The Hebrew directly uses the Tetragrammaton. ‘యహ్వే’ transliterates the covenant name and avoids substituting either a later vocalization or the title ‘Lord.’
- issue: Meaning of Yahweh not hearing
  choice: Retain the Hebrew hearing/listening language without explaining it in the verse
  alternative: యహ్వే మీ మొరకు జవాబివ్వలేదు
  rationale: The context implies that Yahweh did not heed or respond favorably, but the Hebrew expresses this through two verbs of hearing. Preserving that imagery maintains the original theological tension without suggesting literal auditory inability.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘సన్నిధిలో,’ ‘చెవియొగ్గలేదు’ అనే పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండటంతో పాటు మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతాయి.
