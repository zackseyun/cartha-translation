  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: te
  text: 'ఆ సమయంలో నేను మీతో ఇలా అన్నాను: “నేను ఒక్కడినే మిమ్మల్ని మోయలేను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵאמֹר
  choice: ఇలా అన్నాను
  rationale: హీబ్రూ ఉద్ధరణ-పరిచయ పదాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ప్రతిబింబిస్తుంది; ‘అంటూ అన్నాను’ అనే అసహజ పునరుక్తిని నివారిస్తుంది.
- source_word: לְבַדִּי
  choice: నేను ఒక్కడినే
  rationale: మోషే సహాయం లేకుండా ఒంటరిగా ఈ బాధ్యతను నిర్వర్తించలేడనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: שְׂאֵת אֶתְכֶם
  choice: మిమ్మల్ని మోయలేను
  rationale: נשא అనే క్రియ యొక్క ‘మోయడం/భరించడం’ రూపకాన్ని నిలుపుతుంది; ప్రజల నాయకత్వభారాన్ని సూచించే మూలపాఠంలోని భావసాంద్రతను ముందే ఒకే అర్థానికి పరిమితం చేయదు.
theological_decisions:
- issue: ‘మిమ్మల్ని మోయడం’ అనే రూపకం
  choice: మిమ్మల్ని మోయలేను
  alternative: మీ బాధ్యతను భరించలేను / మిమ్మల్ని నడిపించలేను
  rationale: మూలంలోని రూపకం ప్రజల భారాన్ని భరించడం, వారి బాధ్యత వహించడం, వారిని నడిపించడం వంటి అనుబంధ భావాలకు తెరచి ఉంది. అందువల్ల దాన్ని వ్యాఖ్యానాత్మకంగా సంకుచితం చేయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ ‘చెప్పుతూ’ అనే ఉద్ధరణ సూత్రాన్ని పదేపదే కాకుండా తెలుగు సహజ ప్రయోగమైన ‘ఇలా అన్నాను’తో అందించింది.
