translation:
  language: te
  text: అయినా, ఈ విషయంలో మీరు మీ దేవుడైన యెహోవాను నమ్మలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ దేవుడైన యెహోవాపై విశ్వాసం ఉంచలేదు”; మరో విధంగా, “మీ దేవుడైన యెహోవా మాటను నమ్మలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: అయినా, ఈ విషయంలో
  rationale: דָּבָר ఇక్కడ ముందుగా వివరించిన సంగతి లేదా వ్యవహారాన్ని సూచిస్తుంది. וּ సందర్భంలో మోషే గద్దింపును తెలియజేసే స్వల్ప వ్యతిరేక భావాన్ని కలిగిస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘అయినా’ అని అనువదించబడింది.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: మీరు ... నమ్మలేదు
  rationale: నిషేధ పదంతో కూడిన אמן హిఫిల్ పార్టిసిపిల్, ఆ సందర్భంలో ప్రజలు కొనసాగించిన అవిశ్వాస వైఖరిని తెలియజేస్తుంది. తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בַּ/יהוָה
  choice: యెహోవాను
  rationale: אמן తో వచ్చే ב విశ్వాసం లేదా నమ్మకానికి పాత్రుడైన వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘యెహోవాను నమ్మడం’ సహజంగా ఉండి, ఆయన మాటను నిజమని అంగీకరించడం మరియు ఆయనపై ఆధారపడడం అనే రెండు భావాలకు చోటిస్తుంది.
- source_word: אֱלֹהֵי/כֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని ‘మీ’గా నేరుగా నిలుపుతూ, యెహోవాతో ఇశ్రాయేలుకున్న నిబంధన సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אמן + ב ద్వారా యెహోవాతో సంబంధించి వ్యక్తమయ్యే నమ్మకం
  choice: మీ దేవుడైన యెహోవాను నమ్మలేదు
  alternative: మీ దేవుడైన యెహోవాపై విశ్వాసం ఉంచలేదు; మీ దేవుడైన యెహోవా మాటను నమ్మలేదు
  rationale: హీబ్రూ నిర్మాణం వ్యక్తిపై నమ్మకం ఉంచడం, అలాగే అతని మాటను నిజమని అంగీకరించడం అనే భావాలను కలిగి ఉండవచ్చు. ‘యెహోవాను నమ్మలేదు’ అనే తెలుగు రూపం ఈ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది; కేవలం ఆయన మాటను నమ్మకపోవడం లేదా కేవలం సాధారణ విశ్వాసం లేకపోవడం అని భావాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. దైవనామం יְהוָה ను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం. మూలంలోని రెండవ పురుష బహువచనాన్ని ‘మీరు/మీ’తో నిలిపాం.
