id: DEU.1.3
reference: Deuteronomy 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: te
  text: నలభయ్యవ సంవత్సరంలో, పదకొండవ నెలలో, ఆ నెల మొదటి రోజున, యెహోవా వారి కోసం అతనికి ఆజ్ఞాపించినదంతా మోషే ఇశ్రాయేలు ప్రజలకు చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: నలభయ్యవ సంవత్సరంలో... చెప్పాడు
  rationale: హీబ్రూ కథనారంభ రూపాన్ని తెలుగులో కృత్రిమమైన ‘అది సంభవించింది’ అని కాకుండా కాలసూచనతో సహజంగా వ్యక్తం చేశాం.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: నలభయ్యవ సంవత్సరంలో
  rationale: ఇది కాలగణనలో సంవత్సర సంఖ్యను సూచించే ప్రయోగం; తెలుగు క్రమసంఖ్య సహజమైన సమానార్థకం.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: పదకొండవ నెలలో
  rationale: హీబ్రూ సంఖ్యా నిర్మాణం ఇక్కడ నెల క్రమసంఖ్యగా పనిచేస్తుంది.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ఆ నెల మొదటి రోజున
  rationale: సాధారణ హీబ్రూ తేదీ సూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: דִּבֶּר
  choice: చెప్పాడు
  rationale: మోషే ప్రజలకు దేవుని ఆజ్ఞలను తెలియజేసిన సందర్భంలో సహజమైన విస్తృతార్థక తెలుగు క్రియ.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలతో
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులు’; మొత్తం సమాజాన్ని సూచించే ఈ హీబ్రూ జాతీయ-వంశపారంపర్య ప్రయోగానికి ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: כְּכֹל אֲשֶׁר צִוָּה יְהוָה אֹתוֹ אֲלֵהֶם
  choice: యెహోవా తనకు ఇశ్రాయేలు ప్రజలతో చెప్పమని ఆజ్ఞాపించినదంతా
  rationale: כְּכֹל యొక్క సంపూర్ణతను ‘అంతా’తో నిలిపి, אֹתוֹ אֲלֵהֶם అనే సంక్షిప్త నిర్మాణాన్ని సందర్భానుసారంగా సహజ తెలుగులో విప్పి చెప్పాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాకుండా దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల పేరును పేరుగానే నిలిపాం.
- issue: אֹתוֹ אֲלֵהֶם అనే సంక్షిప్త నిర్మాణ సంబంధం
  choice: తనకు ఇశ్రాయేలు ప్రజలతో చెప్పమని ఆజ్ఞాపించినది
  alternative: వారి విషయంగా తనకు ఆజ్ఞాపించినది
  rationale: అక్షరార్థంగా ‘అతనిని వారికి/వారి విషయంగా ఆజ్ఞాపించాడు’ అనే నిర్మాణం సంక్షిప్తంగా ఉంది. సందర్భంలో మోషే వారికి అందించాల్సిన సందేశమే ఉద్దేశమని సహజ తెలుగులో వ్యక్తం చేశాం; ప్రత్యామ్నాయ సంబంధాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని కాలక్రమం, మోషే ప్రసంగం, దైవాజ్ఞ యొక్క సంపూర్ణతను కాపాడుతూ, అసహజమైన హీబ్రూ వాక్యనిర్మాణాన్ని తెలుగులో సహజంగా మార్చాం.
