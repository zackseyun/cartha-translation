  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: te
  text: 'యాహ్వే మీ మాటల స్వరాన్ని[a] విని, కోపించి, ఇలా ప్రమాణం చేశాడు:'
  philosophy: optimal-equivalence
  footnotes:
