    text: 'హీబ్రూలో అక్షరార్థంగా: ‘మీ మాటల శబ్దం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁמַע
  choice: విని
  rationale: ఈ కథన సందర్భంలో שׁמע సాధారణంగా వినడాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘విని’ సహజంగా ఉంది.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: మీ మాటల శబ్దాన్ని
  rationale: קוֹל లోని ‘శబ్దం/స్వరం’ భావాన్ని నిలుపుతూ, דִּבְרֵיכֶם ను ‘మీ మాటలు’గా స్పష్టంగా వ్యక్తం చేశాం. కేవలం ‘మీరు చెప్పినది’ అనడం మూలంలోని చిత్రణను తగ్గిస్తుంది.
- source_word: וַיִּקְצֹף
  choice: కోపించి
  rationale: קצף సూచించే కోపాన్ని స్పష్టంగా, గంభీరంగా, అయితే ఆధునిక తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: నిఫాల్ రూపంలోని ప్రమాణం చేయడం అనే అర్థాన్ని తెలుగులో సహజమైన పదబంధంతో తెలిపాం; ప్రమాణంలోని మాటలు తరువాతి వచనంలో వస్తాయి.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా ‘ఇలా ప్రమాణం చేశాడు’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ఒక బిరుదుగా మార్చకుండా, ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి వచనంలో కొనసాగే ప్రమాణ వాక్యాన్ని సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
