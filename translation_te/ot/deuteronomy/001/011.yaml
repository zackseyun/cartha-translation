id: DEU.1.11
reference: Deuteronomy 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: te
  text: మీ పితరుల దేవుడైన యాహ్వే మిమ్మల్ని ఇప్పుడు ఉన్నదానికంటే వెయ్యి రెట్లు ఎక్కువమందిగా చేయుగాక; ఆయన మీతో చెప్పినట్లే మిమ్మల్ని ఆశీర్వదించుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆయన మీతో చెప్పినట్లే” అనే మాటను “ఆయన మీకు వాగ్దానం చేసినట్లే” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణమైన లిప్యంతరీకరణగా ఉంచాం.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: హీబ్రూ నిర్మాణంలోని ‘మీ పితరుల దేవుడు’ అనే పితృపారంపర్య, నిబంధనాత్మక అనుబంధాన్ని నిలిపాం.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: మిమ్మల్ని ఇప్పుడు ఉన్నదానికంటే వెయ్యి రెట్లు ఎక్కువమందిగా చేయుగాక
  rationale: ‘చేర్చుగాక’ అనే పదచిత్రాన్ని యాంత్రికంగా అనుసరించకుండా, ప్రజల సంఖ్య పెరగాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం; כָּכֶם ను ప్రస్తుత సంఖ్యతో పోలికగా గ్రహించాం.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: మిమ్మల్ని ఆశీర్వదించుగాక
  rationale: మొదటి క్రియతో కొనసాగుతున్న ఆశీర్వాద ఆకాంక్షను తెలుగులో స్పష్టంగా చూపించేందుకు విధ్యర్థక రూపాన్ని మళ్లీ వాడాం.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: ఆయన మీతో చెప్పినట్లే
  rationale: דבר యొక్క విస్తృతమైన ‘చెప్పు/మాట్లాడు’ అర్థాన్ని కాపాడాం; సందర్భానుసారంగా సాధ్యమైన ‘వాగ్దానం చేసినట్లే’ అనే వ్యాఖ్యాత్మక అర్థాన్ని పాఠ్యంలో నిర్బంధించలేదు.
theological_decisions:
- issue: యెహోవా నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్నే ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: אֲבֹתֵיכֶם లోని పితృపారంపర్య భాష
  choice: మీ పితరుల
  alternative: మీ పూర్వీకుల
  rationale: హీబ్రూ పదంలోని పుంలింగ రూపాన్నీ, పితరులతో ఉన్న నిబంధనాత్మక అనుబంధాన్నీ నిలిపాం.
- issue: דִּבֶּר యొక్క సందర్భార్థం
  choice: చెప్పినట్లే
  alternative: వాగ్దానం చేసినట్లే
  rationale: ఇక్కడ మాట వాగ్దానాన్ని సూచించవచ్చు; అయినా మూలక్రియ స్వయంగా ‘వాగ్దానం చేయు’కన్నా విస్తృతమైనది. ఆ భావతెరువును ప్రధాన పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆశీర్వాద వాక్యానికి తగిన గౌరవప్రదమైన ‘చేయుగాక/ఆశీర్వదించుగాక’ రూపాలు వాడబడ్డాయి. సంఖ్యావృద్ధి భావం సామాన్య పాఠకునికి వెంటనే అర్థమయ్యేలా సహజీకరించబడింది.
