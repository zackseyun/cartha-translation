  source_fidelity: 'హీబ్రూ ఆశీర్వాద-ఆకాంక్షను సరిగ్గా ప్రతిబింబిస్తుంది: యాహ్వేను వ్యక్తినామంగా, “మీ పితరుల దేవుడు” అనే నిర్మాణాన్ని, ప్రస్తుత సంఖ్యతో పోల్చిన “వెయ్యి రెట్లు” వృద్ధిని, మరియు రెండు విధ్యర్థక క్రియలను నిలిపింది. “ఆయన మీతో చెప్పినట్లే” అనేది כַּאֲשֶׁר דִּבֶּר לָכֶם యొక్క విస్తృతమైన ‘చెప్పిన/మాట్లాడినట్లే’ అర్థానికి నమ్మకంగా ఉంది; దానిని ‘వాగ్దానం’గా ప్రధాన పాఠ్యంలో కుదించలేదు.'
