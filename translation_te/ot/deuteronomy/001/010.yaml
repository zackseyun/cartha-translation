source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే మిమ్మల్ని అనేకులుగా చేశాడు; ఇదిగో, నేడు మీరు ఆకాశంలోని నక్షత్రాలంత అసంఖ్యాకంగా ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా ఇచ్చాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: నిబంధన సందర్భంలో אֱלֹהִים ఏకవచనార్థకమైన ‘దేవుడు’; 2వ పురుష బహువచన ప్రత్యయం ‘మీ’గా వ్యక్తమైంది.
- source_word: הִרְבָּה אֶתְכֶם
  choice: మిమ్మల్ని విస్తరింపజేశాడు
  rationale: רבה హిఫీల్ రూపంలోని కారణార్థక భావం—సంఖ్యలో అధికం చేయడం—తెలుగులో సహజంగా, మూలంలోని క్రియాబలాన్ని నిలుపుతూ వ్యక్తమైంది.
- source_word: וְהִנְכֶם
  choice: ఇదిగో
  rationale: ప్రస్తుత స్థితివైపు శ్రోతల దృష్టిని ఆకర్షించే హిన్నే యొక్క సూచనాత్మక, వాక్చాతుర్య బలాన్ని నిలిపింది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: మూలంలోని కాలసంబంధమైన తక్షణత్వాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు రూపంలో తెలిపింది.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: ఆకాశ నక్షత్రాలంత విస్తారంగా
  rationale: నక్షత్రాలతో పోలికను, לָרֹב సూచించే గొప్ప సంఖ్య లేదా విస్తారాన్ని సహజమైన తెలుగు పదబంధంలో కలిపి తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది; దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇదిగో’ ద్వారా హెబ్రీయ వాక్చాతుర్యాన్ని నిలిపి, ‘విస్తరింపజేశాడు/విస్తారంగా’ ద్వారా సంఖ్యాపరమైన పెరుగుదల భావాన్ని స్పష్టంగా ఉంచాం.
