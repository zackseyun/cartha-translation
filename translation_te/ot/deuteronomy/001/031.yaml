id: DEU.1.31
reference: Deuteronomy 1:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: te
  text: అరణ్యంలోనూ[a], నీ దేవుడైన యాహ్వే నిన్ను ఒక మనిషి తన కుమారుణ్ణి మోసినట్లుగా మోశాడని నీవు చూశావు—మీరు నడిచిన దారిపొడవునా ఈ చోటికి చేరుకునే వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎడారిలోనూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: అరణ్యంలోనూ
  rationale: מִדְבָּר అనేది జనావాసం తక్కువగా ఉన్న అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ ద్వితీయోపదేశకాండంలోని ప్రయాణ నేపథ్యానికి సహజమైన ప్రామాణిక తెలుగు పదం; וּ అనే సంధిని ‘నూ’తో నిలిపాము.
- source_word: אֲשֶׁר רָאִיתָ
  choice: నీవు చూశావు
  rationale: రెండవ పురుష ఏకవచన రూపాన్ని నిలిపి, తరువాతి వాక్యభాగంలో దేవుడు మోసిన సంగతిని ఇశ్రాయేలు ప్రత్యక్షంగా అనుభవించిందని తెలిపేలా అనువదించాము.
- source_word: נְשָׂאֲךָ
  choice: నిన్ను మోశాడు
  rationale: נשא యొక్క ‘మోయు/భరించు’ భావాన్ని, వెంటనే వచ్చే కుమారుణ్ణి మోసే ఉపమానంతో స్పష్టమైన సంబంధం ఉండేలా ‘మోశాడు’గా ఇచ్చాము.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాము.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఏకవచన స్వామ్య ప్రత్యయాన్ని నిలిపి, ‘నీ దేవుడైన యాహ్వే’ అనే సహజమైన తెలుగు నిర్మాణాన్ని ఉపయోగించాము.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: ఒక మనిషి తన కుమారుణ్ణి మోసినట్లుగా
  rationale: אִישׁ మరియు בְּנוֹ లోని పురుషలింగ చిత్రణను మార్చకుండా నిలిపాము; మూలంలో నేరుగా ‘తండ్రి’ అని లేనందున దానిని చేర్చలేదు.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: దారిపొడవునా
  rationale: మొత్తం ప్రయాణకాలమంతటా కొనసాగిన సంరక్షణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: మీరు నడిచిన
  rationale: הלך యొక్క ప్రాథమిక భావాన్ని నిలిపాము. ఇక్కడి క్రియ బహువచనంలో ఉన్నందున, ముందు ఉన్న ఏకవచన ‘నీవు’కు భిన్నంగా ‘మీరు’ అని ఇచ్చాము.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: ఈ చోటికి చేరుకునే వరకు
  rationale: రెండు עַד రూపాల గమ్య-కాల భావాన్ని తెలుగులో సహజంగా ఒకే నిర్మాణంలో వ్యక్తం చేసి, బహువచన సంబోధనను సందర్భానుసారంగా నిలిపాము.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాము.
- issue: కుటుంబ ఉపమానంలోని లింగ నిర్దిష్టత
  choice: ఒక మనిషి తన కుమారుణ్ణి మోసినట్లుగా
  alternative: ఒకరు బిడ్డను మోసినట్లుగా / తండ్రి తన బిడ్డను మోసినట్లుగా
  rationale: హీబ్రూ పాఠంలోని ‘మనిషి’ మరియు ‘అతని కుమారుడు’ అనే పురుషలింగ పదాలను నిలిపి, ‘తండ్రి’ అని అర్థాన్ని బలపరచకుండా అనువదించాము.
- issue: ఏకవచన, బహువచన రెండవ పురుష రూపాల మార్పు
  choice: ‘నీవు/నిన్ను/నీ’ మరియు ‘మీరు’ అనే మార్పును నిలిపివేయడం
  alternative: అంతటా బహువచనం లేదా గౌరవ ఏకవచనం వాడడం
  rationale: మూలంలో רָאִיתָ, נְשָׂאֲךָ, אֱלֹהֶיךָ ఏకవచనంలో ఉండగా, הֲלַכְתֶּם, בֹּאֲכֶם బహువచనంలో ఉన్నాయి. ఇశ్రాయేలును సమష్టిగా ఏకవచనంగానూ ప్రజలను బహువచనంగానూ సంబోధించే ఈ ఉద్వేగాన్ని సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాము. మూలంలోని పొడవైన వాక్యప్రవాహాన్ని నిలిపేందుకు దీర్ఘవిరామాన్ని వాడాము. ఏకవచన ‘నీవు’ నుంచి బహువచన ‘మీరు’కు జరిగే మూలభాషా మార్పును ఉద్దేశపూర్వకంగా కాపాడాము.
