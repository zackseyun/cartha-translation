revisions:
- from: అరణ్యంలోనూ[a] నీవు చూశావు—ఒక మనిషి తన కుమారుణ్ణి మోసినట్లుగా[b], మీరు నడిచిన దారిపొడవునా ఈ చోటికి చేరుకునే వరకు నీ దేవుడైన యాహ్వే నిన్ను మోశాడు.
  to: అరణ్యంలోనూ[a], నీ దేవుడైన యాహ్వే నిన్ను ఒక మనిషి తన కుమారుణ్ణి మోసినట్లుగా మోశాడని నీవు చూశావు—మీరు నడిచిన దారిపొడవునా ఈ చోటికి చేరుకునే వరకు.
  rationale: విషయవాక్యాన్ని ‘నీవు చూశావు’తో నేరుగా కలిపేందుకు పదక్రమం మార్చబడింది. మూలంలోని ఏకవచన–బహువచన మార్పు, దైవనామం, మానవుడు–కుమారుడు అనే ఉపమానం, మరియు ప్రయాణమంతటి కాలవ్యాప్తి అన్నీ కాపాడబడ్డాయి. పాదటిప్పణి bలో మూలపదాల ప్రత్యామ్నాయ సాధారణీకృత అనువాదం స్పష్టంగా ఉంచబడింది.
