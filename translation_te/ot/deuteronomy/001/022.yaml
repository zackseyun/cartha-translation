source:
  edition: WLC
  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: te
  text: అప్పుడు మీరందరూ నా దగ్గరికి వచ్చి, “మనకంటే ముందుగా కొందరు మనుషులను పంపుదాం. వారు మన కోసం ఆ దేశాన్ని పరిశీలించి, మనం ఏ మార్గంలో దానిలోకి వెళ్లాలో[a], ఏ పట్టణాల్లోకి ప్రవేశించాలో మనకు సమాచారం తీసుకురావాలి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో అక్షరార్థంగా, “మనం ఏ మార్గంలో పైకి వెళ్లాలో.” దేశంలోకి, ముఖ్యంగా కొండ ప్రాంతంలోకి ప్రవేశించడాన్ని “పైకి వెళ్లడం” అని చెప్పడం సాధారణ బైబిలు భాషాప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: అప్పుడు మీరందరూ నా దగ్గరికి వచ్చి
  rationale: קָרַב అంటే దగ్గరికి రావడం లేదా సమీపించడం; כֻּלְּכֶם లోని ఉద్ఘాటనను ‘మీరందరూ’ సహజంగా తెలియజేస్తుంది.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: కొందరు మనుషులను పంపుదాం
  rationale: కోహోర్టేటివ్ రూపం సమూహ ప్రతిపాదనను సూచిస్తుంది. אֲנָשִׁים ఇక్కడ ఎంపిక చేయబడే వ్యక్తులను సూచిస్తున్నందున ‘కొందరు మనుషులు’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְפָנֵינוּ
  choice: మనకంటే ముందుగా
  rationale: అక్షరార్థంగా ‘మన ముఖానికి ముందు’; ఈ సందర్భంలో ముందుగా వెళ్లడాన్ని ‘మనకంటే ముందుగా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: వారు మన కోసం ఆ దేశాన్ని పరిశీలించి
  rationale: חָפַר కు తవ్వడం, వెదకడం, క్షుణ్ణంగా పరిశీలించడం అనే భావపరిధి ఉంది. గూఢచర్యాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా, భూభాగ పరిశోధన భావాన్ని ‘పరిశీలించు’ అందిస్తుంది.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: మనకు సమాచారం తీసుకురావాలి
  rationale: హిఫిల్ שׁוּב మరియు דָּבָר కలయిక తిరిగి నివేదిక లేదా సమాచారం తీసుకురావడాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: మనం ఏ మార్గంలో దానిలోకి వెళ్లాలో
  rationale: דֶּרֶךְ ను ‘మార్గం’గా ఉంచింది. עָלָה లోని పైకి వెళ్లే భావం సందర్భంలో దేశంలో ప్రవేశించడాన్ని సూచిస్తుంది; తెలుగులో అసహజత రాకుండా ‘దానిలోకి వెళ్లడం’గా ఇచ్చి, మూలంలోని భాషాప్రయోగాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: ఏ పట్టణాల్లోకి ప్రవేశించాలో
  rationale: పట్టణాల దగ్గరకు కేవలం చేరుకోవడం కాక వాటిలోకి ప్రవేశించడం ఇక్కడ ఉద్దేశం; ‘ఏ పట్టణాల్లోకి ప్రవేశించాలో’ తెలుగు ప్రశ్నా నిర్మాణంలో సహజంగా ఉంది.
