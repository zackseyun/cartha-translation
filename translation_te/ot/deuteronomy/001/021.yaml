id: DEU.1.21
reference: Deuteronomy 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: te
  text: చూడు, నీ దేవుడైన యాహ్వే దేశాన్ని నీ ముందుంచాడు. నీ పితరుల దేవుడైన యాహ్వే[a] నీతో చెప్పినట్లుగా పైకి వెళ్లి దానిని స్వాధీనం చేసుకో. భయపడకు, అధైర్యపడకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పూర్వికుల దేవుడైన యాహ్వే.’ హీబ్రూ పాఠంలో అక్షరార్థంగా ‘నీ పితరుల దేవుడు’ అని ఉంది; ఒడంబడిక సంబంధమైన ఆ సూత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: ראה క్రియలోని ఏకవచన ఆజ్ఞారూపం ఇక్కడ శ్రద్ధను ఆకర్షించే మాటగా ఉంది. ‘చూడు’ దాని ప్రత్యక్ష బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ ఒడంబడిక సంబంధమైన సంబోధనను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: నీ ముందుంచాడు
  rationale: ‘నీ ముందు ఉంచాడు’ అనే హీబ్రూ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; దేశంలో ప్రవేశించడానికి అది అందుబాటులో ఉంచబడిందనే సందర్భార్థాన్నీ తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: ఈ దేశం
  rationale: ఇక్కడ వాగ్దాన దేశమే సూచితం. తెలుగు సందర్భంలో ‘దేశం’ భూభాగం మరియు నివాసప్రాంతం అనే భావాలను సహజంగా మోస్తుంది; నిర్దిష్టతను ‘ఈ’ తెలియజేస్తుంది.
- source_word: עֲלֵה
  choice: పైకి వెళ్లి
  rationale: దేశంలోని ఎత్తైన ప్రాంతం వైపు ముందుకు వెళ్లడాన్ని సూచించే ఆజ్ఞను వీలైనంత నేరుగా నిలుపుతుంది.
- source_word: רֵשׁ
  choice: దాన్ని స్వాధీనం చేసుకో
  rationale: ירשׁ ఇక్కడ దేవుడు ఇచ్చిన దేశంలో ప్రవేశించి దానిని తన అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘స్వాధీనం చేసుకో’ క్రియాశీల భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్లే
  rationale: మూలంలో ‘మాట్లాడాడు/చెప్పాడు’ అనే క్రియ ఉంది; సందర్భంలో వాగ్దానం సూచితమైనా దానిని పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: నీ పితరుల దేవుడు
  rationale: ‘నీ తండ్రుల దేవుడు’ అనే పురుష బహువచన ఒడంబడిక సూత్రాన్ని ‘పితరులు’ అనే గౌరవప్రదమైన, సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: భయానికి సంబంధించిన నేర prohibitive ఆజ్ఞను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְאַל תֵּחָת
  choice: అధైర్యపడకు
  rationale: חתת ఇక్కడ భయంతో కుంగిపోవడం లేదా వెనుకంజ వేయడం అనే భావాన్ని ఇస్తుంది. ‘అధైర్యపడకు’ మొదటి నిషేధంతో తేడాను ఉంచుతూ సహజంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించడం పేరును స్పష్టంగా నిలుపుతుంది.
- issue: אֱלֹהֵי אֲבֹתֶיךָ అనే ఒడంబడిక సూత్రం
  choice: నీ పితరుల దేవుడు
  alternative: నీ పూర్వికుల దేవుడు
  rationale: మూలంలోని אָבוֹת పదం అక్షరార్థంగా ‘తండ్రులు/పితరులు.’ ప్రధాన పాఠ్యంలో ఆ కుటుంబాధారిత ఒడంబడిక సూత్రాన్ని నిలిపి, విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఏకవచన సంబోధనను నిలిపాం. శైలి గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకుడికి సులభంగా ఉండేలా ‘చూడు,’ ‘పైకి వెళ్లి,’ ‘స్వాధీనం చేసుకో,’ ‘అధైర్యపడకు’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకున్నాం. పాదసూచిక గుర్తు [a] సంబంధిత ‘పితరుల దేవుడు’ పదబంధం వెంట ఉంచబడింది.
