- from: చూడు, నీ దేవుడైన యాహ్వే ఈ దేశాన్ని నీ ముందుంచాడు. పైకి వెళ్లి, దాన్ని స్వాధీనం చేసుకో. నీ పితరుల దేవుడైన యాహ్వే[a] నీతో చెప్పినట్లే చేయి. భయపడకు, అధైర్యపడకు.
