source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: te
  text: 'ఆ సమయంలో నేను మీ న్యాయాధిపతులకు ఇలా ఆజ్ఞాపించాను: “మీ సహోదరుల మధ్య ఉన్న వ్యాజ్యాలను విచారించి, ఒక వ్యక్తికీ అతని సహోదరునికీ, అతనితో నివసించే పరదేశికీ మధ్య న్యాయంగా తీర్పు తీర్చండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “న్యాయంగా” అనే పదాన్ని “నీతిగా” లేదా “న్యాయబద్ధంగా” అని కూడా అనువదించవచ్చు. హీబ్రూ צֶדֶק (త్సెదెక్) న్యాయ సందర్భంలో నీతి, న్యాయం అనే రెండు భావాలనూ కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: నేను ... ఆజ్ఞాపించాను
  rationale: צוה అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; సందర్భానికి సహజమైన ప్రత్యక్ష తెలుగు రూపం.
- source_word: שֹׁפְטֵיכֶם
  choice: మీ న్యాయాధిపతులకు
  rationale: చట్టపరమైన వివాదాలను విచారించి తీర్పు చెప్పడానికి నియమించబడినవారిని సూచిస్తుంది; ‘న్యాయాధిపతులు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: చర్చలో ఉన్న కాలాన్ని సూచించే హీబ్రూ కాలవాచక పదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష ఆజ్ఞను పరిచయం చేస్తుంది; హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: మీ సహోదరుల మధ్య ఉన్న వ్యాజ్యాలను విచారించి
  rationale: שׁמע ఇక్కడ న్యాయపరంగా వాదనలను విని విచారించడాన్ని సూచిస్తుంది. ‘వ్యాజ్యాలు’ న్యాయ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘సహోదరులు’ సమాజపు బంధుత్వ భాషను నిలుపుతుంది.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: న్యాయంగా తీర్పు తీర్చండి
  rationale: צֶדֶק న్యాయస్థాన సందర్భంలో తీర్పు యొక్క న్యాయబద్ధతను, నీతిని సూచిస్తుంది; ‘న్యాయంగా’ ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: ఒక వ్యక్తికీ అతని సహోదరునికీ మధ్య
  rationale: మూలంలోని ఏకవచన, బంధుత్వ రూపాన్ని నిలుపుతూ, אִישׁ‌ను సందర్భానికి తగిన సమగ్ర పదమైన ‘వ్యక్తి’గా అందిస్తుంది.
- source_word: גֵּרוֹ
  choice: అతనితో నివసించే పరదేశి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది. ‘నివసించే పరదేశి’ అతని విదేశీయ స్థితినీ నివాస సంబంధాన్నీ తెలియజేస్తుంది; ప్రత్యయం ‘అతనితో’గా నిలుపబడింది.
theological_decisions:
- issue: אֲחֵיכֶם మరియు אָחִיוలోని ఒడంబడిక సమాజ బంధుత్వ భాష
  choice: సహోదరులు / అతని సహోదరుడు
  alternative: తోటి ఇశ్రాయేలీయులు / పొరుగువాడు
  rationale: మూలంలోని బంధుత్వ రూపకాన్ని నిలుపుతుంది. ఈ పదాలు సందర్భంలో సమాజ సభ్యులకు ప్రాతినిధ్యంగా వాడబడ్డాయి; వాటిని కేవలం పురుషులకు పరిమితం చేయలేదు.
- issue: న్యాయ సందర్భంలో צֶדֶק అర్థవ్యాప్తి
  choice: న్యాయంగా
  alternative: నీతిగా / న్యాయబద్ధంగా
  rationale: ఈ పదంలో నీతి, న్యాయం రెండింటి భావవ్యాప్తి ఉంది. న్యాయ విచారణ సందర్భంలో ‘న్యాయంగా’ అత్యంత సహజం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- issue: గేర్‌కు ఇశ్రాయేలీయునితో సమాన న్యాయ విచారణ
  choice: అతనితో నివసించే పరదేశికీ మధ్యగానీ
  alternative: అతని పరదేశికీ మధ్యగానీ
  rationale: సంబంధిత ప్రత్యయాన్ని నిలుపుతూ, గేర్‌ను సమాజంలో నివసించే స్థానికేతరుడిగా స్పష్టం చేస్తుంది; అతనికీ పక్షపాతరహిత న్యాయం వర్తిస్తుందని పాఠ్య నిర్మాణం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది. న్యాయ సందర్భాన్ని తెలియజేయడానికి ‘వ్యాజ్యాలు’, ‘విచారించి’, ‘న్యాయంగా తీర్పు తీర్చండి’ వాడబడ్డాయి. మూలంలోని బంధుత్వ భాషను ‘సహోదరులు’గా నిలుపుతూ, אִישׁ‌ను సహజమైన ‘వ్యక్తి’గా అనువదించాం.
