id: DEU.1.20
reference: Deuteronomy 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: te
  text: 'అప్పుడు నేను మీతో ఇలా అన్నాను: “మన దేవుడైన యాహ్వే మనకు ఇస్తున్న అమోరీయుల కొండప్రాంతానికి[a] మీరు చేరుకున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమోరీయుల పర్వతానికి.” హీబ్రూ పదం ఒక పర్వతాన్ని లేదా విస్తృతమైన కొండప్రాంతాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: నేను మీతో ఇలా అన్నాను
  rationale: వావ్-క్రమ కథన ప్రవాహాన్ని తెలుగులో సహజంగా కొనసాగిస్తూ, బహువచన సంబోధనను ‘మీతో’ స్పష్టంగా చూపిస్తుంది.
- source_word: בָּאתֶם עַד
  choice: మీరు ... చేరుకున్నారు
  rationale: పూర్తయిన ప్రయాణం వల్ల ప్రస్తుతం గమ్యస్థానానికి చేరిన స్థితిని సహజమైన తెలుగు భూతపూర్ణ రూపం తెలియజేస్తుంది.
- source_word: הַר הָאֱמֹרִי
  choice: అమోరీయుల కొండప్రాంతం
  rationale: הַר ఇక్కడ ఒక్క కొండకన్నా విస్తృతమైన పర్వత/కొండ ప్రాంతాన్ని సూచించగలదు; జాతివాచక ఏకవచనాన్ని సమూహార్థకంగా ‘అమోరీయుల’ అని అనువదించాం.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా
  rationale: దైవనామాన్ని శీర్షికతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהֵינוּ లోని ప్రథమ పురుష బహువచన సంబంధాన్ని ‘మన దేవుడు’గా నిలిపాం.
- source_word: נֹתֵן לָנוּ
  choice: మనకు ఇస్తున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తులో నెరవేరుతున్న క్రియాభావాన్ని తెలుగు ‘ఇస్తున్న’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం; హీబ్రూ ఉచ్చారణ పునర్నిర్మాణాన్ని ‘యాహ్వే’గా ఇవ్వడం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణ స్పష్టంగా ఉంచబడింది; భౌగోళిక పదంలోని నిజమైన భావవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
