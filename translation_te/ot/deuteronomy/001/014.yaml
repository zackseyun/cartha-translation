  yaml_path: translation/ot/deuteronomy/001/014.yaml
  text: And you answered me and said[a], ‘The thing that you have spoken is good for us to do.’
translation:
  language: te
  text: అప్పుడు మీరు నాకు జవాబిచ్చి ఇలా అన్నారు, “మీరు చెప్పిన విషయం మనం చేయడానికి మంచిది.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲנוּ
  choice: జవాబిస్తూ
  rationale: ענה ఇక్కడ మోషే ప్రతిపాదనకు ప్రజలు ఇచ్చిన ప్రత్యుత్తరాన్ని సూచిస్తుంది; తరువాతి וַתֹּאמְרוּతో కలిసి సహజమైన తెలుగులో ‘జవాబిస్తూ ... అన్నారు’ అని అనువదించబడింది.
- source_word: אֹתִי
  choice: నాకు
  rationale: ప్రత్యక్ష కర్మ సూచికతో ఉన్న ప్రథమ పురుష ఏకవచన ప్రత్యయం తెలుగులో ‘నాకు జవాబిస్తూ’ అనే సహజ ప్రయోగంతో వ్యక్తమవుతుంది.
- source_word: וַתֹּאמְרוּ
  choice: అన్నారు
  rationale: ప్రజల ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే אמר క్రియకు గౌరవపూర్వక బహువచన రూపం.
- source_word: טוֹב
  choice: మంచిది
  rationale: ప్రతిపాదనను సానుకూలంగా అంచనా వేస్తున్న సాధారణ, అర్థభారం తక్కువైన సమానార్థకం.
- source_word: הַדָּבָר
  choice: మాట
  rationale: דבר ఇక్కడ మోషే చెప్పిన ప్రతిపాదనను సూచిస్తుంది; ‘మాట’ మూలంలోని వాక్యసంబంధ భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: మీరు చెప్పిన
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన విశేషణ క్రియారూపంతో అందిస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: ప్రకారం చేయడం
  rationale: עשה యొక్క అమలుచేసే భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; ‘చెప్పిన మాట చేయడం’ కంటే ‘మాట ప్రకారం చేయడం’ సహజంగా ఉంటుంది.
