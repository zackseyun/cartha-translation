translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; మోషేను ఉద్దేశించిన బహువచన ప్రజల మాటలో గౌరవార్థక ‘మీరు/అన్నారు’ వాడబడింది. హెబ్రీలోని రెండు వాక్కు క్రియలను యాంత్రికంగా పునరుక్తి చేయకుండా, ‘జవాబిస్తూ ... అన్నారు’ అనే సహజ నిర్మాణంలో రెండింటినీ నిలిపింది.
