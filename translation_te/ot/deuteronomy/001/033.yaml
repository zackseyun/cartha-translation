  to: మీరు శిబిరం వేయడానికి మీకోసం ఒక స్థలాన్ని వెదకడానికి[a] మీ ముందుగా దారిలో నడుస్తూ, మీరు వెళ్లవలసిన దారిని మీకు చూపించడానికి రాత్రివేళ అగ్నిలోను పగటివేళ మేఘంలోను ఉన్నవాడు.
  rationale: 'The revision follows the Hebrew progression: the one going ahead on the journey seeks out a campsite, and in fire at night and cloud by day shows the route. It retains the relative-clause dependence on the preceding verse without inserting ‘యెహోవా.’'
