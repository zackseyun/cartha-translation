base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: te
  text: మీరు శిబిరం వేయడానికి మీకోసం ఒక స్థలాన్ని వెదకడానికి[a] మీ ముందుగా దారిలో నడుస్తూ, మీరు వెళ్లవలసిన దారిని మీకు చూపించడానికి రాత్రివేళ అగ్నిలోను పగటివేళ మేఘంలోను ఉన్నవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు శిబిరం వేయడానికి మీకోసం ఒక స్థలాన్ని పరిశీలించడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: వెళ్లినవాడు
  rationale: Qal participle ఇక్కడ ముందటి వాక్యంలోని యెహోవాను వర్ణించే సంబంధార్థక రూపంగా ఉంది. తెలుగు వాక్యంలో సహజంగా కలిసేందుకు ‘వెళ్లినవాడు’ అని ఇచ్చాం.
- source_word: לִפְנֵיכֶם
  choice: మీ ముందుగా
  rationale: ప్రజలకు మార్గదర్శిగా వారి ముందు వెళ్లడమనే స్థలార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: అరణ్య ప్రయాణంలోని మార్గాన్ని సూచించే דֶּרֶךְకు సరళమైన ఆధునిక తెలుగు సమానం.
- source_word: לָתוּר
  choice: వెదికిన
  rationale: బసకు అనువైన స్థలాన్ని అన్వేషించి గుర్తించడమనే תור భావాన్ని అందిస్తుంది; ‘గూఢచర్యం చేయు’ వంటి అనవసర సైనిక ఛాయను నివారిస్తుంది.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: మీరు మకాం వేయడానికి స్థలాన్ని
  rationale: חנה యొక్క శిబిరం వేసి బసచేయడమనే భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన ‘మకాం వేయడం’తో తెలిపాం.
- source_word: בָּאֵשׁ לַיְלָה
  choice: రాత్రివేళ అగ్నిలోను
  rationale: దేవుని రాత్రి మార్గదర్శక ప్రత్యక్షతను, పగటి మేఘంతో ఉన్న సమాంతర నిర్మాణాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: לַרְאֹתְכֶם
  choice: మీకు చూపించడానికి
  rationale: ראה Hiphil రూపంలోని కారణార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: మీరు వెళ్లవలసిన దారిని
  rationale: దేవుడు వారికి వెళ్లే మార్గాన్ని చూపించాడనే సందర్భార్థాన్ని అందిస్తుంది. ఇది కేవలం నైతిక విధిని బలవంతంగా చొప్పించకుండా, నిర్దేశిత మార్గ భావాన్ని తెలుపుతుంది.
- source_word: וּבֶעָנָן יוֹמָם
  choice: పగటివేళ మేఘంలోను
  rationale: అరణ్య ప్రయాణంలో తెలిసిన దైవిక మేఘ ప్రత్యక్షతను సూచిస్తూ, రాత్రి అగ్నితో సమాంతరంగా ఉంటుంది.
theological_decisions:
- issue: కర్తను ముందటి వచనంలోని యెహోవాగా గుర్తించడం
  choice: ఈ వచనంలో ‘యెహోవా’ అని మళ్లీ చేర్చకుండా ‘వెళ్లినవాడు’ అనే సంబంధార్థక నిర్మాణాన్ని ఉంచడం
  alternative: ‘యెహోవా మీ ముందుగా...’ అని కర్తను స్పష్టంగా చేర్చడం
  rationale: హీబ్రూ వాక్యం ముందటి వచనంలోని ‘మీ దేవుడైన యెహోవా’పై వ్యాకరణపరంగా ఆధారపడుతుంది. మూలంలో లేని నామాన్ని చేర్చకుండా ఆ అనుసంధానాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ముందటి వచనంపై ఆధారపడే సంబంధ వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగు పదక్రమాన్ని సహజంగా అమర్చాం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత ప్రత్యామ్నాయ పదార్థానికి అనుసంధానించబడింది.
