  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: te
  text: మీరు ‘వారు దోపుడుసొమ్ముగా మారతారు’ అని చెప్పిన మీ చిన్నపిల్లలు[a], ఈ రోజు మంచి చెడులను ఎరుగని[b] మీ కుమారులు—వారే అక్కడికి ప్రవేశిస్తారు; ఆ దేశాన్ని వారికి ఇస్తాను, వారు దానిని స్వాధీనం చేసుకుంటారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు కొల్లగా చిక్కుతారు’ లేదా ‘వారు దోపుడుగా పట్టబడతారు.’
    reason: lexical_alternative
  - marker: b
    text: ‘మంచి చెడులను ఎరుగని’ అనేది పరిపక్వమైన వివేచన లేమిని సూచించే హీబ్రూ భావవ్యక్తీకరణ.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘వారు దానిని వారసత్వంగా పొందుతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలు
  rationale: טַף చిన్నపిల్లలను లేదా ఆధారపడిన వారిని సూచిస్తుంది. సందర్భంలో వారి నిస్సహాయతను, పెద్దల తరంతో ఉన్న వ్యత్యాసాన్ని ‘చిన్నపిల్లలు’ సహజంగా తెలియజేస్తుంది.
- source_word: לָבַז יִהְיֶה
  choice: వారు దోపుడుసొమ్ము అవుతారు
  rationale: בַּז శత్రువు పట్టుకొనే దోపుడుసొమ్ము లేదా కొల్లను సూచిస్తుంది. ఇశ్రాయేలీయులు తమ పిల్లల గురించి వ్యక్తం చేసిన భయాన్ని ఈ పదబంధం స్పష్టంగా నిలుపుతుంది.
- source_word: בְנֵיכֶם
  choice: మీ పిల్లలు
  rationale: పదం రూపరీత్యా పుంలింగ బహువచనమైనా, ఈ సందర్భంలో తదుపరి తరంలోని పిల్లలందరినీ సూచిస్తుంది; ఆధునిక తెలుగులో ‘మీ పిల్లలు’ సహజంగా, సందర్భానికి తగిన విస్తృతార్థంతో ఉంది.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: ఈ రోజు మంచి చెడులను ఎరుగని
  rationale: మూలంలోని ‘మంచి మరియు చెడు ఎరుగకపోవడం’ అనే హీబ్రూ భావవ్యక్తీకరణను దగ్గరగా నిలుపుతూ, పరిపక్వ వివేచన ఇంకా లేనిదాన్ని సూచిస్తుంది.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: ముందు ప్రస్తావించిన దేశంలోకి వెళ్లే దిశను సూచించే హీబ్రూ గమనార్థక క్రియావిశేషణానికి ‘అక్కడికి’ సహజమైన తెలుగు సమానం.
- source_word: אֶתְּנֶנָּה
  choice: ఆ దేశాన్ని వారికి ఇస్తాను
  rationale: స్త్రీలింగ ఏకవచన కర్మప్రత్యయం ముందు ప్రస్తావించిన దేశాన్ని సూచిస్తుంది. తెలుగులో అస్పష్టత లేకుండా ఉండేందుకు ‘ఆ దేశాన్ని’ అని స్పష్టపరచబడింది.
- source_word: יִירָשׁוּהָ
  choice: వారు దాన్ని స్వాధీనం చేసుకుంటారు
  rationale: ירשׁ సందర్భానుసారం వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం లేదా ఆక్రమించి కలిగియుండడం అనే భావాలు కలిగి ఉంటుంది. ఇక్కడ వాగ్దానదేశాన్ని పొంది దానిని అధీనంలో ఉంచుకోవడాన్ని ‘స్వాధీనం చేసుకుంటారు’ సముచితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మంచి చెడులను ఎరుగని’ పిల్లల స్థితి
  choice: పరిపక్వ వివేచన ఇంకా లేనిదాన్ని సూచించే మూలభాషా భావవ్యక్తీకరణను యథాతథంగా నిలపడం
  alternative: దీనిని నిర్దోషిత్వం, నైతిక బాధ్యతలేమి లేదా ‘బాధ్యత వయస్సు’ గురించిన స్పష్టమైన సిద్ధాంత ప్రకటనగా అనువదించడం
  rationale: ఈ వాక్యం శిక్షకు గురైన పెద్దల తరాన్ని వారి పిల్లలతో వ్యత్యాసపరుస్తుంది; అయితే ఈ హీబ్రూ పదబంధం తరువాతి సిద్ధాంతపరమైన ప్రశ్నలను స్వయంగా పరిష్కరించదు. కాబట్టి ఆ వేదాంత ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గంభీరంగా రూపొందించబడింది. మూలంలోని పునరుక్తి, తరాల మధ్య వ్యత్యాసం, ‘మంచి చెడులు’ అనే భావవ్యక్తీకరణ నిలుపబడ్డాయి.
