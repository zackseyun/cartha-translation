  to: 'మన దేవుడైన యాహ్వే హోరేబులో[a] మనకు ఇలా చెప్పాడు: “ఈ పర్వతం దగ్గర మీరు చాలాకాలం ఉన్నారు; ఇక చాలు.[b]”'
