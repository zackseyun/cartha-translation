source:
  edition: WLC
  text: יְהוָ֧ה אֱלֹהֵ֛י/נוּ דִּבֶּ֥ר אֵלֵ֖י/נוּ בְּ/חֹרֵ֣ב לֵ/אמֹ֑ר רַב לָ/כֶ֥ם שֶׁ֖בֶת בָּ/הָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: te
  text: 'మన దేవుడైన యాహ్వే హోరేబులో[a] మనకు ఇలా చెప్పాడు: “ఈ పర్వతం దగ్గర మీరు చాలాకాలం ఉన్నారు; ఇక చాలు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘హోరేబు’; సీనాయి అని కూడా పిలువబడే పర్వతానికి ఇక్కడ ఉపయోగించిన పేరు.
    reason: cross_reference
  - marker: b
    text: లేదా, “మీకు చాలు; ఈ పర్వతం దగ్గర ఇక ఉండవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: బహువచన రూపం నుంచి వచ్చిన పదమైనా, ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంలో సూచిస్తోంది; మొదటి పురుష బహువచన ప్రత్యయంతో ‘మన దేవుడు’ సహజమైన అనువాదం.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: మనతో ... అన్నాడు
  rationale: דבר అంటే ‘మాట్లాడు/చెప్పు’; אֶל దిశను సూచిస్తుంది. తెలుగులో ప్రత్యక్ష సంభాషణను పరిచయం చేయడానికి ‘మనతో ఇలా అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: בְּחֹרֵב
  choice: హోరేబులో
  rationale: ב ఇక్కడ స్థలార్థకం. హెబ్రీ పాఠంలోని ‘హోరేబు’ అనే పేరును ‘సీనాయి’గా సమన్వయపరచకుండా అలాగే నిలిపాం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: మాటల విషయాన్ని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అనువదించాం.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: చాలాకాలం ఉన్నారు; ఇక చాలు
  rationale: רַב לָכֶם అనే ప్రయోగం పరిమితి నిండిందనే భావాన్ని, שֶׁבֶת అక్కడ ఉండడం లేదా నివసించడాన్ని సూచిస్తాయి. తెలుగు వాక్యం దీర్ఘకాల నివాసాన్నీ ఇక కదలవలసిన సమయం వచ్చిందనే భావాన్నీ తెలియజేస్తుంది.
- source_word: בָּהָר הַזֶּה
  choice: ఈ పర్వతం దగ్గర
  rationale: הַר ఇక్కడ ‘పర్వతం’; శిబిరస్థానం లేదా నివాసస్థలాన్ని సూచించడానికి బְּను ‘దగ్గర’గా ఇవ్వడం సహజమైన తెలుగు.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తోంది. దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: రַב לָכֶם שֶׁבֶת ప్రయోగంలోని భావం
  choice: మీరు ఈ పర్వతం దగ్గర చాలాకాలం ఉన్నారు; ఇక చాలు
  alternative: మీకు చాలు; ఈ పర్వతం దగ్గర ఇక ఉండవద్దు
  rationale: ఈ నిర్మాణం గడిచిన కాలం చాలిందనే ప్రకటనగానూ, ఇక అక్కడ ఉండకూడదనే ఆదేశార్థ సూచనగానూ అర్థమవుతుంది. ప్రధాన పాఠం రెండింటి సహజ సమ్మేళనాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘హోరేబు’ అనే మూల నామాన్ని నిలిపి, హెబ్రీ ప్రయోగంలోని పరిమితి నిండిన భావాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్యంగా వ్యక్తం చేశాం.
