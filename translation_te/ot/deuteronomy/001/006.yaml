    issue: The phrase “మనతో ఇలా అన్నాడు” is less precise for אֵלֵינוּ.
    rationale: The Hebrew preposition אֶל is directed ‘to us.’ In Telugu, “మనకు ఇలా చెప్పాడు” unambiguously marks us as the recipients of the speech; “మనతో” may be understood as ‘with us.’
