id: DEU.1.43
reference: Deuteronomy 1:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: te
  text: కాబట్టి నేను మీకు చెప్పాను; కానీ మీరు వినలేదు. మీరు యహ్వే ఆజ్ఞకు తిరుగుబాటు చేసి, అహంకారంగా ప్రవర్తించి, కొండ ప్రాంతానికి ఎక్కి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: కాబట్టి నేను మీతో మాట్లాడాను
  rationale: వావ్ ముందటి సందర్భంతో ఫలితాత్మక కథన సంబంధాన్ని చూపుతుంది; דבר పియేల్ సాధారణంగా ‘మాట్లాడు’ అని అర్థం. అֲלֵיכֶםలోని బహువచనం తెలుగులో ‘మీతో’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: కానీ మీరు వినలేదు
  rationale: שׁמע ఇక్కడ వినడం, ఆలకించడం అనే భావాన్ని కలిగి ఉంది. తరువాతి వాక్యభాగమే తిరుగుబాటును స్పష్టంగా చెబుతున్నందున ‘లోబడలేదు’ అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: మీరు యెహోవా ఆజ్ఞను ధిక్కరించి
  rationale: מרה అధికారాన్ని ఎదిరించడం లేదా తిరుగుబాటు చేయడం సూచిస్తుంది. ‘యెహోవా నోరు’ అనే హీబ్రూ నుడికారం ఆయన పలికిన ఆజ్ఞను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆజ్ఞను ధిక్కరించి’ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: וַתָּזִדוּ
  choice: అహంకారంతో
  rationale: זיד గర్వంతో, దుస్సాహసంగా లేదా అహంకారపూర్వకంగా వ్యవహరించడాన్ని సూచిస్తుంది. ఇక్కడ క్రియావిశేషణ రూపం తదుపరి చర్యతో సహజంగా అనుసంధానమవుతుంది.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: కొండ ప్రాంతానికి ఎక్కి వెళ్లారు
  rationale: עלה పైకి వెళ్లడాన్ని, הָהָרָה దిశను మరియు సందర్భంలో కొండల ప్రాంతాన్ని సూచిస్తుంది. ‘ఎక్కి వెళ్లారు’ భౌగోళిక కదలికను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: אֶת־פִּי יְהוָה అనే నుడికారం
  choice: యెహోవా ఆజ్ఞను
  alternative: యెహోవా నోటిని
  rationale: అక్షరార్థమైన ‘నోరు’ తెలుగులో ఈ సందర్భంలో అస్పష్టంగా ఉంటుంది. ఇది యెహోవా పలికిన ఆదేశాన్ని ధిక్కరించడాన్ని సూచించే హీబ్రూ నుడికారం కాబట్టి ‘ఆజ్ఞ’ను ఎంచుకున్నాం.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: וַתָּזִדוּలోని నైతిక భావఛాయ
  choice: అహంకారంతో
  alternative: దుస్సాహసంగా
  rationale: ఈ క్రియలో గర్వం, అహంకారం, హద్దుమీరిన సాహసం అన్న భావాలు కలిసివున్నాయి. సందర్భంలో దేవుని హెచ్చరికను లెక్కచేయకుండా పైకి వెళ్లడాన్ని ‘అహంకారంతో’ సంక్షిప్తంగా వ్యక్తం చేస్తుంది; నిర్దిష్ట సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. హీబ్రూ నుడికారాన్ని అక్షరార్థంగా కాక భావస్పష్టంగా అనువదించాం; వాక్యంలోని మందలింపు మరియు నైతిక తీవ్రతను నిలిపాం.
