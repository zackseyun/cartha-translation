source:
  edition: WLC
  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: te
  text: మీరు తిరిగి బయలుదేరి, అమోరీయుల కొండప్రాంతానికీ, దానికి ఆనుకుని ఉన్న ప్రాంతాలన్నిటికీ వెళ్లండి—అరాబాలోను, కొండప్రాంతంలోను, దిగువప్రాంతంలోను[a], నెగెబులోను, సముద్రతీర ప్రాంతంలోను, కనానీయుల దేశంలోను, లెబానోనులోను, మహానదియైన యూఫ్రటీసు నది వరకూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “షెఫేలాలో”; ఇది పశ్చిమంలోని దిగువ పాదభూమి ప్రాంతపు పేరు.
    reason: שְׁפֵלָהను సాధారణ భౌగోళిక వర్ణనగా గానీ, ప్రత్యేక ప్రాంతనామంగా గానీ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: פְּנוּ
  choice: తిరిగి
  rationale: దిశ మార్చుకోవాలనే ఆజ్ఞను సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּסְעוּ לָכֶם
  choice: బయలుదేరి
  rationale: נסע ఇక్కడ శిబిరం ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. לָכֶם హీబ్రూలో ప్రయాణ ఆజ్ఞతో వచ్చిన వాడుకప్రయోగం కాబట్టి తెలుగులో విడిగా ‘మీ కోసం’ అని చెప్పడం అసహజం.
- source_word: וּבֹאוּ
  choice: వెళ్లండి
  rationale: గమ్యప్రాంతాలవైపు కదలమనే ఆజ్ఞలో בואకు సందర్భానుకూలమైన సహజ తెలుగు రూపం.
- source_word: הַר הָאֱמֹרִי
  choice: అమోరీయుల కొండప్రాంతం
  rationale: הַר ఇక్కడ ఒకే కొండను కాక ఎత్తైన భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; జాతివాచక ఏకవచనాన్ని సమూహార్థక బహువచనంగా ఇచ్చాం.
- source_word: שְׁכֵנָיו
  choice: దానికి ఆనుకుని ఉన్న ప్రాంతాలు
  rationale: అక్షరార్థంగా ‘దాని పొరుగువారు’; భూభాగ వివరణలో సమీప ప్రాంతాలనే సూచిస్తున్నందున వ్యక్తీకరణను బలవంతంగా రుద్దకుండా సంబంధార్థాన్ని నిలిపాం.
- source_word: בָּעֲרָבָה
  choice: అరాబాలో
  rationale: సాధారణ ‘మైదానం’ కంటే యొర్దాను చీలికలోయ ప్రాంతానికి సంబంధించిన భౌగోళిక నామాన్ని నిలిపింది.
- source_word: בָהָר
  choice: కొండప్రాంతంలో
  rationale: ఎత్తైన భూభాగాన్ని సూచించే ప్రాంతీయ అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּבַשְּׁפֵלָה
  choice: దిగువప్రాంతంలో
  rationale: తక్కువ ఎత్తులోని పశ్చిమ పాదభూమి ప్రాంతాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో అందిస్తుంది; ప్రత్యేక నామాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּבַנֶּגֶב
  choice: నెగెబులో
  rationale: భౌగోళిక ప్రాంతాల జాబితాలో ఉన్నందున సాధారణ ‘దక్షిణం’కు బదులు ప్రాంతనామాన్ని నిలిపాం.
- source_word: וּבְחוֹף הַיָּם
  choice: సముద్రతీరంలో
  rationale: חוֹף యొక్క తీరం/తీరప్రాంతం అనే అర్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: కనానీయుల దేశం
  rationale: సమూహార్థక జాతివాచకాన్ని తెలుగులో సహజమైన బహువచన రూపంతో ఇచ్చాం.
- source_word: וְהַלְּבָנוֹן
  choice: లెబానోనుకు
  rationale: ప్రసిద్ధ భౌగోళిక నామాన్ని ఆధునిక ప్రామాణిక తెలుగు రూపంలో నిలిపాం.
- source_word: הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: మహానదియైన యూఫ్రటీసు నది
  rationale: ‘మహానది’ అనే విశేషణాన్ని, ‘యూఫ్రటీసు నది’ అనే గుర్తింపును రెండింటినీ నిలిపే సమాసరహిత స్పష్టమైన నిర్మాణం.
