  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: te
  text: నేను ఒక్కడినే మీ కష్టాన్ని, మీ భారాన్ని, మీ వివాదాలను[a] ఎలా మోయగలను?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ కలహాలను,’ లేదా ‘మీ న్యాయవ్యవహారాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: ఎలా ... గలను?
  rationale: ఇక్కడ ఇది కష్టతను లేదా అసాధ్యతను తెలియజేసే అలంకారిక ప్రశ్న. ఆధునిక తెలుగులో ‘ఎలా ... గలను?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶשָּׂא
  choice: మోయగలను
  rationale: נשׂא ఇక్కడ బాధ్యతను భరించడం లేదా మోయడం అనే రూపకార్థంలో ఉంది; తరువాత వచ్చే అమూర్త నామాలతో ‘మోయడం’ సహజంగా సరిపోతుంది.
- source_word: לְבַדִּי
  choice: నేను ఒక్కడినే
  rationale: మోషే ఈ బాధ్యతను మరెవరి సహాయం లేకుండా నిర్వహించలేననే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: טָרְחֲכֶם
  choice: మీ కష్టాన్ని
  rationale: טֹרַח వల్ల కలిగే శ్రమ, ఇబ్బంది, అలసటభరితమైన బాధ్యత అనే భావాలను ‘కష్టం’ సంక్షిప్తంగా అందిస్తుంది; తరువాతి ‘భారం’తో పూర్తిగా కలిసిపోకుండా వేరు చేస్తుంది.
- source_word: מַשַּׂאֲכֶם
  choice: మీ భారాన్ని
  rationale: מַשָּׂא యొక్క ప్రాథమిక ‘మోయవలసిన భారం’ భావాన్ని, ఇక్కడి అమూర్త వినియోగాన్ని సహజంగా నిలుపుతుంది.
- source_word: רִיבְכֶם
  choice: మీ వివాదాలను
  rationale: רִיב కలహం, వివాదం లేదా న్యాయవ్యవహారం అనే పరిధిని కలిగి ఉంది. ‘వివాదాలు’ వ్యక్తిగత విభేదాన్నీ తీర్పు అవసరమైన వ్యవహారాన్నీ సూచించగల సాధారణ ఆధునిక పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్నగా రూపొందించబడింది. మూలంలోని మూడు సమాంతర నామాలను విడివిడిగా నిలిపి, רִיב యొక్క వివాద/న్యాయవ్యవహార ద్వంద్వసాధ్యతను పాదటిప్పణిలో సంరక్షించాం.
