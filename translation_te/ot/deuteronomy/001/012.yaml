  source_fidelity: మూల హెబ్రీలోని అలంకారిక ప్రశ్న (אֵיכָה), ‘నేను ఒంటరిగా’ (לְבַדִּי), మరియు మూడు సమాంతర అంశాలు—టోరహ్/కష్టం, భారం, వివాదాలు—అన్నీ అనువాదంలో విశ్వసనీయంగా ప్రతిఫలించాయి. ‘ఎలా మోయగలను?’ נשׂא యొక్క బాధ్యతను భరించడం అనే రూపకార్థాన్ని సహజంగా అందిస్తుంది.
  naturalness: ‘నేను ఒక్కడినే మీ కష్టాన్ని, మీ భారాన్ని, మీ వివాదాలను ఎలా మోయగలను?’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, స్పష్టమైన ప్రశ్నార్థక వాక్యం. ‘కష్టం’ మరియు ‘భారం’ కొంత భావసామీప్యం కలిగినా, మూలంలోని ఉద్దేశపూర్వక సమాంతరతను నిలుపుతాయి.
  terminology: ‘వివాదాలు’ רִיב కు సందర్భోచితమైన ప్రధాన అనువాదం; పాదటిప్పణిలో ‘కలహాలు’ మరియు ‘న్యాయవ్యవహారాలు’ ఇవ్వడం మూలపదం కలిగిన విస్తృత అర్థపరిధిని తగిన విధంగా సంరక్షిస్తుంది. ప్రత్యేక మతపరమైన పదజాల సమస్య లేదు.
