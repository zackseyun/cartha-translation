id: DEU.1.40
reference: Deuteronomy 1:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּנ֣וּ לָ/כֶ֑ם וּ/סְע֥וּ הַ/מִּדְבָּ֖רָ/ה דֶּ֥רֶךְ יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: te
  text: కానీ మీరైతే, వెనుదిరిగి, ఎర్ర సముద్రం దారిగా అరణ్యం వైపు బయలుదేరండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: కానీ మీరైతే
  rationale: ముందటి తీర్పుకు భిన్నంగా ఇప్పుడు సంబోధించబడుతున్నవారిని స్వతంత్ర సర్వనామం నొక్కిచెబుతోంది; ‘కానీ మీరైతే’ ఆ వ్యత్యాసాన్నీ ఉద్ఘాటననూ సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: פְּנוּ לָכֶם
  choice: వెనుదిరిగి
  rationale: ఈ సందర్భంలో פנה దిశను మార్చుకోవాలని ఆజ్ఞాపిస్తుంది; לָכֶם ఆ ఆజ్ఞను సంబోధితులకే బలంగా వర్తింపజేస్తుంది. తెలుగులో ‘వెనుదిరిగి’ కదలికలోని దిశామార్పును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּ/סְעוּ
  choice: బయలుదేరండి
  rationale: נסע శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరండి’ ఆధునిక తెలుగులో ఆ ప్రయాణ ఆజ్ఞను స్పష్టంగా అందిస్తుంది.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యం వైపు
  rationale: దిశాసూచక ה కదలిక అరణ్యం దిశగా ఉందని తెలియజేస్తుంది; గమ్యస్థానంలో ప్రవేశాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘వైపు’ ఆ భావాన్ని కాపాడుతుంది.
- source_word: דֶּרֶךְ
  choice: మార్గంలో
  rationale: ఇక్కడ דרך ప్రయాణించే దారిని సూచిస్తుంది; ‘మార్గంలో’ తెలుగు వాక్యంలో సహజంగా ఆ మార్గార్థాన్ని వ్యక్తపరుస్తుంది.
- source_word: יַם סוּף
  choice: ఎర్ర సముద్రం
  rationale: సూచించబడిన భౌగోళిక స్థలానికి తెలుగులో స్థిరపడిన బైబిలు పేరు ‘ఎర్ర సముద్రం’; హీబ్రూ పదబంధపు మరింత అక్షరార్థమైన రూపాన్ని పాదటిప్పణిలో ఉంచాం.
