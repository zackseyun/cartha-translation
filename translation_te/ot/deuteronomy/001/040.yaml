translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. మూలంలోని వ్యత్యాస ఉద్ఘాటనను ‘కానీ మీరైతే’ ద్వారా, దిశామార్పును ‘వెనుదిరిగి’ ద్వారా నిలిపాం.
