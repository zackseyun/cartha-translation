source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: te
  text: చూడండి[a], నేను ఆ దేశాన్ని మీ ముందుంచాను. మీరు వెళ్లి, యాహ్వే మీ పితరులైన అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు—వారికీ వారి తరువాత వారి సంతానానికీ ఇవ్వాలని ప్రమాణం చేసిన ఆ దేశాన్ని స్వాధీనం చేసుకోండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇదిగో చూడండి.’ మూలంలోని ఆజ్ఞారూపం బలంగా శ్రద్ధను ఆకర్షిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ దేశాన్ని సొంతం చేసుకోండి’ లేదా ‘వారసత్వంగా పొందండి.’ హీబ్రూ క్రియలో స్వాధీనపరచుకోవడం, అనుభవించడం, వారసత్వంగా పొందడం వంటి భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: చూడండి
  rationale: ఏకవచన ఆజ్ఞారూపం శ్రద్ధను బలంగా ఆకర్షిస్తుంది. మోషే సమాజాన్ని సమష్టిగా ఏకవచనంలో సంబోధిస్తున్నందున, ఆధునిక తెలుగు గౌరవ/సమూహ ప్రయోగమైన ‘చూడండి’ సహజంగా ఉంటుంది.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: నేను ... మీ ముందుంచాను
  rationale: נתן సాధారణంగా ‘ఇవ్వు’ అయినా, לִפְנֵי నిర్మాణంలో ‘ముందు ఉంచు’ అనే భావం వస్తుంది. సంపూర్ణ క్రియ భూమి ఇప్పుడు వారికి అందుబాటులో ఉంచబడిందనే బలాన్ని తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: ఇక్కడ אֶרֶץ వాగ్దానం చేయబడిన నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆ దేశం’ సందర్భానికి సహజంగా ఉండి, నిర్దిష్టతను నిలుపుతుంది.
- source_word: בֹּאוּ
  choice: వెళ్లి
  rationale: బహువచన ఆజ్ఞారూపం. శ్రోతలు దేశంలోకి ప్రవేశించాల్సిన కదలికను తెలుగులో ‘వెళ్లి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּרְשׁוּ
  choice: స్వాధీనం చేసుకోండి
  rationale: ירשׁ ఈ సందర్భంలో ప్రవేశించి స్వంతాధీనంలోకి తీసుకోవడం, అనుభవించడం అనే క్రియాశీల భావాన్ని కలిగి ఉంది. ‘స్వాధీనం చేసుకోండి’ దానిని స్పష్టంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో నిలుపబడింది.
- source_word: נִשְׁבַּע יְהוָה
  choice: యెహోవా ... ప్రమాణం చేసిన
  rationale: నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించాం. נשׁבע యొక్క ప్రమాణబద్ధమైన వాగ్దాన భావాన్ని ‘ప్రమాణం చేసిన’ తెలియజేస్తుంది.
- source_word: לַאֲבֹתֵיכֶם
  choice: మీ పితరులైన
  rationale: ఆ వెంటనే అబ్రాహాము, ఇస్సాకు, యాకోబు పేర్లు రావడం వల్ల אבות ఇక్కడ సాధారణ పూర్వీకులను కాక నిర్దిష్ట పితరులను సూచిస్తుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: ప్రతి పేరుతో ఉన్న לְ సంబంధాన్ని తెలుగు విభక్తి ‘-కు’తో పునరావృతం చేసి మూలంలోని లయ, ప్రత్యేక నిర్దేశం నిలుపబడ్డాయి.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: వారికీ, వారి తరువాత వారి సంతానానికీ ఇవ్వాలని
  rationale: זֶרַע సమష్టి ఏకవచనంగా వంశసంతతిని సూచిస్తుంది. ‘సంతానం’ ఆ సమష్టి భావాన్ని సహజంగా నిలుపుతుంది; ‘వారి తరువాత’ కాల/తరాల క్రమాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాక దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో అందించాం.
- issue: אֲבֹתֵיכֶם లోని లింగ-నిర్దిష్టత
  choice: మీ పితరులైన
  alternative: మీ పూర్వీకులైన
  rationale: వాక్యం వెంటనే అబ్రాహాము, ఇస్సాకు, యాకోబులను గుర్తిస్తుంది కాబట్టి పురుషలింగ నిర్దిష్టతను ‘పితరులు’గా నిలుపడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: వాగ్దానం ఎవరికి ఇవ్వబడిందనే నిర్మాణం
  choice: వారికీ, వారి తరువాత వారి సంతానానికీ
  alternative: వారి తరువాతి సంతానానికి మాత్రమే
  rationale: לָתֵת לָהֶם וּלְזַרְעָם లో ‘వారికి’ మరియు ‘వారి సంతానానికి’ రెండూ స్పష్టంగా ఉన్నాయి. పితరులకు సంబంధించిన మొదటి పరోక్ష కర్మను తొలగించకుండా వాక్యంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభమైన శైలి వాడబడింది. సమాజాన్ని ఉద్దేశించిన ఆజ్ఞలకు గౌరవ/బహువచన రూపాలు ఉపయోగించాం. దైవనామం లిప్యంతరీకరణలో సంప్రదాయ తెలుగు రూపమైన ‘యెహోవా’ను ఎంచుకున్నాం.
