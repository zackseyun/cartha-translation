id: DEU.1.15
reference: Deuteronomy 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: te
  text: 'కాబట్టి జ్ఞానవంతులైన, పేరుపొందిన పురుషులైన మీ గోత్రాల నాయకులను నేను తీసుకొని, వారిని మీపై నాయకులుగా నియమించాను: వెయ్యిమందిపై అధికారులుగా, వందమందిపై అధికారులుగా, యాభైమందిపై అధికారులుగా, పదిమందిపై అధికారులుగా, మీ గోత్రాలకు అధికారులుగా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶקַּח
  choice: కాబట్టి ... తీసుకొని
  rationale: వావ్-కన్సెక్యూటివ్ కథనంలోని తదుపరి చర్యను సూచిస్తుంది; ముందు వచనంలోని ఆదేశానికి ప్రతిస్పందనగా ఉన్న క్రమాన్ని ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: మీ గోత్రాల అధిపతులు
  rationale: రֹאש్ׁ ఇక్కడ సామాజిక-పరిపాలనా విభాగానికి నాయకత్వం వహించేవారిని సూచిస్తుంది; ‘అధిపతులు’ తరువాతి רָאשִׁים పదంతోనూ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: אֲנָשִׁים
  choice: పురుషులు
  rationale: హీబ్రూ పదం ఇక్కడ వ్యాకరణపరంగానూ పదార్థపరంగానూ పురుషులను సూచిస్తుంది; అందువల్ల లింగాన్ని తటస్థీకరించలేదు.
- source_word: חֲכָמִים
  choice: జ్ఞానవంతులు
  rationale: నాయకత్వానికీ తీర్పు చెప్పడానికీ తగిన ఆచరణాత్మక జ్ఞానాన్ని సూచించే పారదర్శకమైన తెలుగు పదం.
- source_word: וִידֻעִים
  choice: గుర్తింపు పొందిన
  rationale: ידע నుంచి వచ్చిన ఈ రూపం ‘తెలిసినవారు/గుర్తింపబడినవారు’ అనే సహజ నిష్క్రియార్థాన్ని మోస్తుంది. ‘జ్ఞానవంతులు’తో కలిసిన సందర్భంలో ‘వివేకం గలవారు’ అనే అర్థమూ సాధ్యమే; ఆ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: వారిని మీపై అధిపతులుగా నియమించాను
  rationale: נתן ఇక్కడ ఒక పదవిలో ఉంచడాన్ని సూచిస్తుంది; ‘నియమించాను’ పరిపాలనా చర్యను సహజంగా తెలియజేస్తూ ‘మీపై అధిపతులు’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: שָׂרֵי
  choice: అధిపతులు
  rationale: שַׂר అధికారమున్న నాయకుడు లేదా అధికారి. ఈ న్యాయ-పరిపాలనా సందర్భంలో సైనిక అర్థానికే పరిమితం చేసే ‘సేనాధిపతులు’ కంటే ‘అధిపతులు’ విస్తృతమైన మూలార్థాన్ని కాపాడుతుంది.
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: వెయ్యిమంది ... వందమంది ... యాభైమంది ... పదిమంది
  rationale: ఇవి స్థాయీకృత పరిపాలనా సమూహాలు; తెలుగు వ్యక్తివాచక నిర్మాణం వాటి సంఖ్యాపరమైన వ్యవస్థను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְשֹׁטְרִים
  choice: అధికారులు
  rationale: שֹׁטֵר అధీన పరిపాలనా లేదా లేఖన సంబంధ అధికారిని సూచించగలదు; నిర్దిష్ట పనిని అనవసరంగా కుదించకుండా ‘అధికారులు’ తగిన విస్తృతార్థాన్ని ఇస్తుంది.
- source_word: לְשִׁבְטֵיכֶם
  choice: మీ గోత్రాలకు
  rationale: ל ఇక్కడ గోత్ర వ్యవస్థలో వారి నియామక సంబంధాన్ని సూచిస్తుంది; ‘మీ గోత్రాలకు’ సహజమైన తెలుగు పరిపాలనా ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘అధిపతి’ అనే పదాన్ని רֹאשׁ/שַׂר రెండింటికీ ఉపయోగించడం వల్ల స్వల్ప పదభేదం తగ్గినా, పరిపాలనా శ్రేణి సహజంగా వినిపిస్తుంది. మూలంలోని దీర్ఘ జాబితాను డాష్‌తో స్పష్టపరిచాం; చివరి క్రియను తెలుగులో పునరుక్తం చేయడం వాక్యాన్ని సులభంగా గ్రహించేందుకు తోడ్పడుతుంది.
