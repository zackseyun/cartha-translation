source:
  edition: WLC
  text: וַ/יִּיטַ֥ב בְּ/עֵינַ֖/י הַ/דָּבָ֑ר וָ/אֶקַּ֤ח מִ/כֶּם֙ שְׁנֵ֣ים עָשָׂ֣ר אֲנָשִׁ֔ים אִ֥ישׁ אֶחָ֖ד לַ/שָּֽׁבֶט׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: te
  text: ఆ ప్రతిపాదన నాకు మంచిదిగా అనిపించింది[a]. కాబట్టి మీలోనుండి ప్రతి గోత్రానికి ఒక్కొక్కరి చొప్పున పన్నెండుమంది పురుషులను తీసుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ప్రతిపాదన నాకు నచ్చింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: నాకు మంచిదిగా అనిపించింది
  rationale: హీబ్రూ పదబంధం వ్యక్తిగత ఆమోదాన్ని లేదా అనుకూలమైన అంచనాను సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ ‘నా కళ్లకు మంచిగా ఉంది’ అనే మూలభాషా నుడికార భావాన్ని అందిస్తుంది.
- source_word: הַדָּבָר
  choice: ఆ ప్రతిపాదన
  rationale: ముందటి వచనంలో ప్రజలు చేసిన సూచనే ఇక్కడ ఉద్దేశించబడింది. ‘విషయం’ సాధ్యమైనా, సందర్భంలో ‘ప్రతిపాదన’ మరింత స్పష్టంగా, సహజంగా ఉంది.
- source_word: וָאֶקַּח
  choice: తీసుకున్నాను
  rationale: לקח అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది సమూహం నుండి వ్యక్తులను ఎంపిక చేసి తీసుకోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִכֶּם
  choice: మీలోనుండి
  rationale: מן ఉపసర్గ ప్రజల సమూహంలోనుండి ఎంపిక చేయడాన్ని సూచిస్తుంది; ‘మీలోనుండి’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: పన్నెండుమంది పురుషులను
  rationale: ఈ పదబంధం పన్నెండు మంది వయోజన పురుషులను సూచిస్తుంది; లింగాన్ని మూలపాఠానుసారంగా నిలుపుతుంది.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: ప్రతి గోత్రానికి ఒక్కొక్కరి చొప్పున
  rationale: ప్రతి గోత్రం నుండి ఒక ప్రతినిధి అనే విభజనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘పురుషులను’ అనే పదం ముందే ఉన్నందున ఇక్కడ దాన్ని పునరుక్తి చేయలేదు.
