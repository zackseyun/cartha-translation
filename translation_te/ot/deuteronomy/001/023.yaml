  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని వ్యక్తిగత ఆమోద భావం ప్రధాన పాఠంలో నిలుపబడింది; మరింత నేరుగా చెప్పే సహజ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
