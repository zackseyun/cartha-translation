id: DEU.1.13
reference: Deuteronomy 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָב֣וּ לָ֠/כֶם אֲנָשִׁ֨ים חֲכָמִ֧ים וּ/נְבֹנִ֛ים וִ/ידֻעִ֖ים לְ/שִׁבְטֵי/כֶ֑ם וַ/אֲשִׂימֵ֖/ם בְּ/רָאשֵׁי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: te
  text: మీ గోత్రాల్లోని జ్ఞానవంతులైన, వివేచనగల, గుర్తింపు పొందిన[a] పురుషులను మీ కోసం ఎన్నుకోండి; వారిని మీ నాయకులుగా[b] నియమిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెలిసినవారైన,’ ‘మంచి పేరున్న.’ హీబ్రూ పదం గోత్రాల మధ్య స్థిరమైన గుర్తింపు లేదా పేరు ఉన్నవారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మీ శిరస్సులుగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: ఎన్నుకోండి
  rationale: ఈ సందర్భంలో ప్రజలు అర్హులైన వ్యక్తులను ఎంపిక చేయాలనే ఆజ్ఞను సూచిస్తుంది; ‘తీసుకురండి’ లేదా ‘ఇవ్వండి’ కంటే ‘ఎన్నుకోండి’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: ప్రజలు తమ ప్రయోజనం కోసం తామే ఎంపిక చేసుకోవాలనే దాత్యార్థాన్ని నిలుపుతుంది.
- source_word: אֲנָשִׁים
  choice: పురుషులను
  rationale: హీబ్రూ పదం పుంలింగ బహువచనం; ఇక్కడ ఇశ్రాయేలు గోత్ర వ్యవస్థలో నియమించబడే పురుష నాయకులను సూచిస్తుంది.
- source_word: חֲכָמִים
  choice: జ్ఞానవంతులైన
  rationale: నాయకత్వ సందర్భంలో సాంకేతిక నైపుణ్యం కాక, జ్ఞానం మరియు సద్వివేచనతో కూడిన తీర్పును సూచిస్తుంది.
- source_word: וּנְבֹנִים
  choice: వివేచనగల
  rationale: పరిస్థితులను గ్రహించి సరైన తీర్పు చెప్పగల అవగాహనను, అంతర్దృష్టిని వ్యక్తం చేస్తుంది.
- source_word: וִידֻעִים
  choice: గుర్తింపు పొందిన
  rationale: ఈ నిష్క్రియ భావరూపం గోత్రాల మధ్య తెలిసినవారు లేదా మంచి పేరున్నవారు అనే ప్రజా గుర్తింపును సూచిస్తుంది; మూలంలోని భావ పరిధిని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: לְשִׁבְטֵיכֶם
  choice: మీ గోత్రాల్లోని
  rationale: ఎంపిక చేయబడేవారు ఆయా గోత్రాలకు చెందినవారనీ, వాటి మధ్య గుర్తింపు పొందినవారనీ సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַאֲשִׂימֵם
  choice: వారిని ... నియమిస్తాను
  rationale: ప్రజల ఎంపిక తరువాత మోషే వారిని అధికార స్థానంలో ఉంచే కార్యాన్ని సూచిస్తుంది.
- source_word: בְּרָאשֵׁיכֶם
  choice: మీ నాయకులుగా
  rationale: అక్షరార్థంగా ‘మీ శిరస్సులుగా’ ఉన్న నాయకత్వ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో ‘నాయకులుగా’ అనువదించింది; అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions:
- issue: అֲנָשִׁים అనే లింగసూచక నాయకత్వ పదం
  choice: పురుషులను
  alternative: వ్యక్తులను / ప్రజలను
  rationale: హీబ్రూ పదం స్పష్టంగా పుంలింగ బహువచనంలో ఉండి, ఈ సందర్భంలో గోత్రాల నుండి నియమించబడే పురుషులను సూచిస్తుంది; అందువల్ల లింగాన్ని తటస్థీకరించలేదు.
- issue: ఎంపిక మరియు నియామకం మధ్య సంబంధం
  choice: ప్రజలు ఎన్నుకుంటారు; మోషే నియమిస్తాడు
  alternative: మోషే స్వయంగా ఎంపిక చేసి నియమిస్తాడు
  rationale: הָבוּ לָכֶם అనే బహువచన ఆజ్ఞ ప్రజల ఎంపికను, וַאֲשִׂימֵם అనే మోషే మాట అధికారిక నియామకాన్ని వేరు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. మూడు అర్హతలనూ వేరువేరుగా నిలిపి, ‘శిరస్సులు’ అనే హీబ్రూ రూపకానికి సహజమైన ప్రధాన పాఠంతో పాటు అక్షరార్థ పాదటిప్పణి ఇచ్చాం.
