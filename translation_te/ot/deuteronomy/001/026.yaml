source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: te
  text: అయితే మీరు పైకి వెళ్లడానికి ఇష్టపడలేదు; మీ దేవుడైన యాహ్వే ఆజ్ఞను ధిక్కరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీ దేవుడైన యాహ్వే నోటికి వ్యతిరేకంగా తిరుగుబాటు చేశారు”; ఇది ఆయన ఆజ్ఞను ఎదిరించడం లేదా ధిక్కరించడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: అయితే మీరు ... ఇష్టపడలేదు
  rationale: ప్రతికూల సందర్భాన్ని సహజంగా చూపేందుకు וְను ‘అయితే’గా, אבה యొక్క సంకల్పార్థాన్ని నిలుపుతూ ప్రతికూల నిర్మాణాన్ని ‘ఇష్టపడలేదు’గా అనువదించాం.
- source_word: לַעֲלֹת
  choice: పైకి వెళ్లడానికి
  rationale: עלהలోని దిశాసూచక భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וַתַּמְרוּ
  choice: ఎదురుతిరిగారు
  rationale: מרה అధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడం లేదా ధిక్కరించడం అనే భావాన్ని ఇక్కడ తెలియజేస్తుంది; ‘ఎదురుతిరిగారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶת־פִּי
  choice: ఆజ్ఞకు
  rationale: అక్షరార్థంగా ‘నోటికి’ అయినా, ఈ హీబ్రూ నుడికారం పలికిన ఆజ్ఞను ధిక్కరించడాన్ని సూచిస్తుంది; తెలుగులో ‘ఆజ్ఞకు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన సంబంధప్రత్యయంతో ఉన్న ఏకవచన ఒడంబడిక సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణకు దగ్గరైన తెలుగు రూపం ‘యాహ్వే’గా నిలిపాం.
- issue: אֶת־פִּי అనే నుడికారంలోని అక్షరార్థం మరియు భావార్థం
  choice: ఆజ్ఞకు ఎదురుతిరిగారు
  alternative: నోటికి ఎదురుతిరిగారు
  rationale: ‘నోరు’ అనే అక్షరరూపం దేవుడు పలికిన ఆజ్ఞను సూచించే హీబ్రూ నుడికారం. ప్రధాన పాఠంలో భావాన్ని స్పష్టంగా ఇచ్చి, అక్షరరూపాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని రెండు సమన్విత చర్యలను అర్థవిరామంతో స్పష్టంగా వేరు చేశాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఆజ్ఞకు ఎదురుతిరిగారు’ అన్న భాగం వెంట ఉంచాం.
