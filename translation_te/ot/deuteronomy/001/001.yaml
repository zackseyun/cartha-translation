base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: te
  text: యొర్దాను అవతల[a], అరణ్యంలో, అరాబా[b] ప్రాంతంలో, సూఫు[c]కు ఎదురుగా—పారాను, తోఫెలు, లాబాను, హజేరోతు, దీజాహాబు మధ్య—మోషే ఇశ్రాయేలీయులందరికీ చెప్పిన మాటలు ఇవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యొర్దాను ఆవల’ లేదా ‘యొర్దానుకు అవతలి వైపున’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం ఏ వైపు నుంచి చూస్తున్నామనే దానిని స్వయంగా నిర్ధారించదు.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాబా’ అనేది చీలికలోయ లేదా మైదాన ప్రాంతానికి సంబంధించిన భౌగోళిక పేరు; దీనిని ‘మైదానం’ అని కూడా అనువదిస్తారు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూ మూలంలో ‘సూఫు’ అని మాత్రమే ఉంది. కొందరు దీనిని స్థలనామంగా, మరికొందరు ‘రెల్లుసముద్రం’తో సంబంధమున్న పదంగా అర్థం చేసుకుంటారు; అయితే ఇక్కడ ‘సముద్రం’ అనే పదం లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: చెప్పిన మాటలు ఇవి
  rationale: ద్వితీయోపదేశకాండపు ఉపన్యాసాన్ని పరిచయం చేసే సూచనాత్మక నిర్మాణాన్ని సహజమైన తెలుగు వాక్యాంతంతో నిలిపింది; דְּבָרִיםను సందర్భానుసారం ‘మాటలు’గా అనువదించింది.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה אֶל כָּל יִשְׂרָאֵל
  choice: మోషే ... ఇశ్రాయేలీయులందరితో చెప్పిన
  rationale: దిబ్బేర్ అనే ప్రసంగక్రియను సహజంగా ‘చెప్పిన’గా ఇచ్చింది; ‘ఇశ్రాయేలు’ అనే సమష్టి ప్రజానామాన్ని ఆధునిక తెలుగులో ప్రజలను సూచించే ‘ఇశ్రాయేలీయులందరు’గా వ్యక్తం చేసింది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: భౌగోళిక దృష్టికోణాన్ని ఖచ్చితంగా నిర్ణయించకుండా ‘ఆవలి వైపు’ అనే మూల భావాన్ని కాపాడుతుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: మִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం తక్కువైన నిర్జన ప్రాంతాన్ని సూచించగలదు; ‘అరణ్యం’ తెలుగు బైబిలు సందర్భంలో సహజంగా ఆ విస్తృతిని అందిస్తుంది.
- source_word: בָּעֲרָבָה
  choice: అరాబా ప్రాంతంలో
  rationale: దీనిని సాధారణ ‘మైదానం’గా మార్చకుండా భౌగోళిక నామవిలువను నిలిపి, తెలుగు పాఠకునికి అది ప్రాంతమని స్పష్టం చేసింది.
- source_word: מוֹל סוּף
  choice: సూఫుకు ఎదురుగా
  rationale: מוֹל యొక్క ‘ఎదురుగా’ భావాన్ని నిలిపింది; మూలంలో יַם ‘సముద్రం’ లేకపోవడంతో సוּףను స్థలనామంగా లిప్యంతరీకరించింది.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: పారాను, తోఫెలు, లాబాను, హజేరోతు, దీజాహాబు మధ్య
  rationale: అన్ని స్థలనామాలను కాపాడుతూ, తెలుగు భాషలో బహుళ అంశాలకు సహజమైన కామా జాబితాతో చివర ‘మధ్య’ ఉంచింది.
- source_word: דִי זָהָב
  choice: దీజాహాబు
  rationale: పదార్థానువాదం చేయకుండా స్థలనామంగా లిప్యంతరీకరించింది.
