  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: te
  text: వారు ఆ దేశపు పండ్లలో కొన్నిటిని తమ చేతుల్లో తీసుకొని, వాటిని మా దగ్గరకు కిందికి తీసుకొచ్చారు. వారు మాకు తిరిగి వార్త తీసుకొచ్చి[a], “మన దేవుడైన యాహ్వే మనకు ఇస్తున్న దేశం మంచిది” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాకు నివేదించి’; అక్షరార్థంగా, ‘మాకు తిరిగి వార్త తీసుకొచ్చి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: తమ చేతుల్లో తీసుకొని
  rationale: לקח అనే సాధారణ ‘తీసుకొను’ భావాన్నీ, בְיָדָם లోని స్పష్టమైన ‘తమ చేతుల్లో’ అనే దృశ్యరూపాన్నీ నిలుపుతుంది.
- source_word: מִפְּרִי הָאָרֶץ
  choice: ఆ దేశపు పండ్లలో కొన్నిటిని
  rationale: భాగార్థక מִן‌ను ‘కొన్నిటిని’ అని వ్యక్తపరచి, మొత్తం పంటను కాక నమూనాగా కొంత తీసుకున్నారని తెలియజేస్తుంది.
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: వాటిని మా దగ్గరికి కిందికి తీసుకొచ్చారు
  rationale: హిఫిల్ రూపంలోని ‘కిందికి తీసుకురావడం’ అనే దిశార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; బహువచన ‘వాటిని’ పండ్లను సూచిస్తుంది.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: వారు మాకు సమాచారం తీసుకొచ్చి
  rationale: ఈ హీబ్రూ ప్రయోగం తిరిగి వచ్చి సమాచారం అందించడాన్ని సూచిస్తుంది. తెలుగులో అసహజమైన పదప్రతిపద రూపాన్ని తప్పించి, భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: טוֹבָה הָאָרֶץ
  choice: దేశం మంచిది
  rationale: טוֹבָה ఇచ్చే విస్తృత సానుకూల అంచనాను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే సంప్రదాయ లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మాట్లాడుతున్న గూఢచారులు మరియు వింటున్న ప్రజలను కలుపుకునే ప్రథమ పురుష బహువచన సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נֹתֵן לָנוּ
  choice: మనకు ఇస్తున్న
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా సమీపంలో నెరవేరుతున్న అనుగ్రహ చర్యను నిలుపుతూ, לָנוּ అనే పరోక్ష కర్మను ‘మనకు’గా స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నప్పటికీ, ‘యాహ్వే’ కూడా మూల వ్యంజనాలకు సమీపమైన సాధ్యమైన లిప్యంతరీకరణ.
- issue: దేవుడు దేశాన్ని ఇచ్చే చర్య యొక్క కాలాంశం
  choice: మనకు ఇస్తున్న
  alternative: మనకు ఇవ్వబోయే
  rationale: נֹתֵן అనే కృదంతంలోని కొనసాగుతున్న/సమీప కార్య భావాన్ని ‘ఇస్తున్న’ నిలుపుతుంది; కేవలం భవిష్యత్తుగా మార్చి వాగ్దానంలోని వర్తమాన నిశ్చయాన్ని తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ‘కిందికి’ అనే దిశార్థాన్ని నిలిపి, నివేదికను సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు వాక్యంగా ఇచ్చాం.
