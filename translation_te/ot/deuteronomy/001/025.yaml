revisions:
- from: వారు ఆ దేశపు పండ్లలో కొన్నిటిని తమ చేతుల్లో తీసుకొని, వాటిని మా దగ్గరికి కిందికి తీసుకొచ్చారు. వారు మాకు సమాచారం తీసుకొచ్చి, “మన దేవుడైన యెహోవా మనకు ఇస్తున్న దేశం మంచిది” అని చెప్పారు.
  to: వారు ఆ దేశపు పండ్లలో కొన్నిటిని తమ చేతుల్లో తీసుకొని, వాటిని మా దగ్గరకు కిందికి తీసుకొచ్చారు. వారు మాకు తిరిగి వార్త తీసుకొచ్చి[a], “మన దేవుడైన యాహ్వే మనకు ఇస్తున్న దేశం మంచిది” అని అన్నారు.
