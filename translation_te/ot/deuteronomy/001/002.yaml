translation:
  language: te
  text: హోరేబు నుండి శేయీరు కొండ మార్గం గుండా కాదేషు-బర్నేయ వరకు పదకొండు రోజుల ప్రయాణం ఉంది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పదకొండు రోజులు.” హీబ్రూ నుడికారం ఈ మార్గంలో హోరేబు నుండి కాదేషు-బర్నేయ వరకు పట్టే ప్రయాణకాలాన్ని తెలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హీబ్రూ మూలపాఠంలో ఉన్న పేరు “హోరేబు”; దీనిని తరచుగా సీనాయితో అనుసంధానిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: పదకొండు రోజుల ప్రయాణం
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పదకొండు రోజులు’ అని ఉన్నా, ఇక్కడ మార్గదూరాన్ని ప్రయాణకాలంతో తెలిపే నుడికారం. తెలుగులో ‘పదకొండు రోజుల ప్రయాణం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מֵחֹרֵב
  choice: హోరేబు నుండి
  rationale: మూలపాఠంలో ఉన్న חֹרֵב అనే స్థలనామాన్ని సీనాయి అని మార్చకుండా లిప్యంతరీకరించాం.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: శేయీరు కొండ మార్గంగా
  rationale: דֶּרֶךְ ఇక్కడ ప్రయాణ మార్గాన్ని సూచిస్తుంది; הַר ఏక కొండనూ, పర్వత ప్రాంతాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సంక్షిప్తమైన సంప్రదాయ రూపం ‘శేయీరు కొండ’ను ఉంచాం.
- source_word: עַד
  choice: వరకు
  rationale: భౌగోళిక గమ్యస్థానపు చివరి హద్దును సూచిస్తున్నందున ‘వరకు’ సహజమైన తెలుగు సమానం.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: కాదేషు-బర్నేయ
  rationale: ఈ సంయుక్త స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, రెండు భాగాలను హైఫన్‌తో కలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని క్రియలేని సంక్షిప్త భౌగోళిక వాక్య నిర్మాణాన్ని తెలుగులోనూ సంక్షిప్తంగా నిలిపి, ప్రయాణకాల నుడికారాన్ని స్పష్టపరిచాం.
