source:
  edition: WLC
  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: te
  text: 'యొర్దాను అవతల[a], మోయాబు దేశంలో, మోషే ఈ ధర్మశాస్త్రాన్ని[b] వివరించడం మొదలుపెట్టి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యొర్దాను నదికి అవతలి వైపున’ లేదా ‘యొర్దాను నదికి మరోవైపున.’ హెబ్రీ ప్రయోగం మాట్లాడేవారి భౌగోళిక దృష్టికోణానికి సంబంధించినది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఈ ఉపదేశాన్ని.’ హెబ్రీ పదమైన తోరా ‘ధర్మశాస్త్రం’ అనీ, మరింత విస్తృతంగా ‘ఉపదేశం’ అనీ అర్థం ఇవ్వగలదు. ఇక్కడ నిబంధనాత్మక, శాసనపరమైన సందర్భం వల్ల ‘ధర్మశాస్త్రం’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: ఈ హెబ్రీ పదబంధం మాట్లాడేవారి భౌగోళిక దృష్టికోణాన్ని బట్టి యొర్దాను నదికి అవతలి ప్రాంతాన్ని సూచిస్తుంది. ‘యొర్దాను అవతల’ సహజమైన తెలుగు రూపం; దృష్టికోణ సంబంధమైన అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: మోయాబు దేశంలో
  rationale: భౌగోళిక-రాజకీయ సందర్భంలో אֶרֶץ అనే పదానికి ‘దేశం’ సహజమైన, స్పష్టమైన తెలుగు అనువాదం.
- source_word: הוֹאִיל
  choice: మొదలుపెట్టి
  rationale: తరువాతి క్రియతో కలిసి ఈ పదం ఒక కార్యాన్ని ప్రారంభించడం లేదా చేపట్టడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘వివరించడం మొదలుపెట్టి’ సహజంగా ఉంటుంది.
- source_word: בֵּאֵר
  choice: వివరించడం
  rationale: ఈ క్రియ ఏదైనా విషయాన్ని స్పష్టం చేయడం, విపులీకరించడం అనే భావాన్ని కలిగి ఉంది. ‘వివరించడం’ ఆధునిక పాఠకులకు సులభంగా అర్థమవుతూ మూలభావాన్ని నిలుపుతుంది.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రాన్ని
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాత్మక, శాసనపరమైన సందర్భంలో תּוֹרָהకు ‘ధర్మశాస్త్రం’ సముచితం. అయినా దీనికి విస్తృతంగా ‘ఉపదేశం’ అనే అర్థం కూడా ఉండగలదని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాత వచ్చే ప్రసంగాన్ని పరిచయం చేసే హెబ్రీ ప్రయోగాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది.
theological_decisions:
- issue: నిబంధనాత్మక సందర్భంలో תּוֹרָה అనువాదం
  choice: ఈ ధర్మశాస్త్రాన్ని
  alternative: ఈ ఉపదేశాన్ని
  rationale: ఈ వచనం మోషే నిబంధన నియమాలను వివరించడాన్ని పరిచయం చేస్తుంది. ‘ధర్మశాస్త్రం’ న్యాయ-నిబంధన కోణాన్ని నిలుపుతుంది; ‘ఉపదేశం’ అనే విస్తృత భావాన్ని నిరాకరించకుండా దానిని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘మోయాబు,’ ‘మోషే,’ ‘యొర్దాను’ వంటి స్థిరమైన బైబిలు నామరూపాలను ఉపయోగించాం; మూలంలోని భౌగోళిక సాపేక్షతను, తోరా పదంలోని అర్థవిస్తృతిని పాదటిప్పణుల్లో నిలిపాం.
