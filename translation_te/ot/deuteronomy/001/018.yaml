lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: నేను ఆజ్ఞాపించాను
  rationale: צוה క్రియలోని అధికారపూర్వకమైన ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֶתְכֶם
  choice: మీకు
  rationale: హీబ్రూలో ఇది బహువచన ద్వితీయ పురుష కర్మరూపం. తెలుగు వాక్యనిర్మాణంలో ‘ఆజ్ఞాపించాను’తో ‘మీకు’ సహజంగా ఉండి బహువచనాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: ప్రామాణిక కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: విషయాలన్నిటినీ
  rationale: דְּבָרִים అనే పదానికి మాటలు, విషయాలు, వ్యవహారాలు అనే అర్థాలు ఉండవచ్చు. సందర్భంలో ఆచరించాల్సిన ఆదేశాలను సూచిస్తున్నందున ‘విషయాలు’ విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: మీరు చేయవలసిన
  rationale: ఆజ్ఞకు లోబడి వారు ఆచరించాల్సిన బాధ్యతను ‘చేయవలసిన’ సహజంగా, అతిశయింపకుండా తెలియజేస్తుంది.
