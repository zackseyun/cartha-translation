  text: ఆ సమయంలో మీరు చేయవలసిన విషయాలన్నిటినీ[a] నేను మీకు ఆజ్ఞాపించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాటలన్నిటినీ’ లేదా ‘వ్యవహారాలన్నిటినీ’; హీబ్రూ דְּבָרִים అనే పదం పలికిన ఆదేశాలను గానీ, చేయవలసిన విషయాలు లేదా కార్యాలను గానీ సూచించవచ్చు.
