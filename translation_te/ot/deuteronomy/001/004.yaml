  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: te
  text: అమోరీయుల రాజైన సీహోనును—అతడు హెష్బోనులో నివసించేవాడు—బాషాను రాజైన ఓగును—అతడు అష్టారోతులో, ఎద్రెయిలో నివసించేవాడు—హతమార్చిన తరువాత,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: హతమార్చిన తరువాత
  rationale: אַחֲרֵיతో కూడిన נכה క్రియారూపం ప్రధాన వాక్యంలోని చర్యకు ముందుగా జరిగిన సంహారాన్ని సూచిస్తుంది. ‘హతమార్చిన’ అనేది కేవలం ‘ఓడించిన’ కంటే మూలక్రియ బలాన్ని కాపాడుతుంది; కర్తను మూలంలో ఉన్నట్లే ఈ వచనంలో ప్రత్యక్షంగా చేర్చలేదు.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజైన సీహోనును
  rationale: నిర్దిష్ట ప్రత్యక్ష కర్మను తెలుగులో ‘ను’ విభక్తితో సహజంగా చూపిస్తూ, వ్యక్తి పేరు మరియు జాతి designation‌ను స్పష్టంగా ఉంచింది.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: అతడు హెష్బోనులో నివసించేవాడు
  rationale: יָשַׁב ఇక్కడ నివాసాన్ని సూచిస్తుంది. విస్తరించిన సంబంధవాచక నిర్మాణం తెలుగులో స్పష్టంగా, సహజంగా ఉండేందుకు ఉపవాక్యంగా ఇచ్చింది.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగును
  rationale: మూలంలోని construct సంబంధాన్ని సహజమైన తెలుగు ‘బాషాను రాజు’ నిర్మాణంతో, ప్రత్యక్ష కర్మ సూచనతో అందించింది.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: అతడు అష్టారోతులో, ఎద్రెయిలో నివసించేవాడు
  rationale: రెండు స్థలనామాల ముందున్న בְּను రెండింటికీ ‘లో’గా ప్రతిబింబించింది. వాటి పరస్పర భౌగోళిక సంబంధాన్ని మూలం కంటే ఎక్కువగా నిర్ణయించకుండా విరామచిహ్నంతో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఈ వచనం 3వ వచనంలో మొదలైన వాక్యాన్ని కొనసాగిస్తున్నందున చివర కామా ఉంచబడింది; కర్తను ఇక్కడ కొత్తగా చేర్చలేదు. పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
