  to: అమోరీయుల రాజైన సీహోనును—అతడు హెష్బోనులో నివసించేవాడు—బాషాను రాజైన ఓగును—అతడు అష్టారోతులో, ఎద్రెయిలో నివసించేవాడు—హతమార్చిన తరువాత,
