language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יִרְאֶ֥ה אִישׁ֙ בָּ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה הַ/דּ֥וֹר הָ/רָ֖ע הַ/זֶּ֑ה אֵ֚ת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָ/תֵ֖ת לַ/אֲבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: te
  text: “ఈ దుష్ట తరానికి చెందిన ఈ మనుషుల్లో ఒక్క మనిషి కూడా, మీ పితరులకు ఇస్తానని నేను ప్రమాణం చేసిన ఆ మంచి దేశాన్ని చూడడు—[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పూర్వీకులకు.” హెబ్రీలో, “మీ పితరులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఒక్క మనిషి కూడా ... చూడడు
  rationale: ఇక్కడ אִם సాధారణ షరతును కాక, ప్రమాణ సందర్భంలోని బలమైన నిషేధాన్ని సూచిస్తుంది. అందువల్ల తెలుగులో ‘ఒక్క మనిషి కూడా ... చూడడు’ అని సహజంగా వ్యక్తం చేయబడింది.
- source_word: יִרְאֶה
  choice: చూడడు
  rationale: ראה యొక్క ప్రాథమిక అర్థం ‘చూడు.’ ఈ తీర్పు సందర్భంలో మంచి దేశాన్ని చూడకుండా, దానిలో ప్రవేశించి అనుభవించకుండా ఉండటాన్ని సూచించే భవిష్య నిషేధంగా ఉంది.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: ఈ మనుషుల్లో ఒక్క మనిషి కూడా
  rationale: בָּאֲנָשִׁים ఇక్కడ సమూహంలోనుండి ఒక్కరినీ మినహాయించని భాగార్థక భావాన్ని ఇస్తుంది; אִישׁ యొక్క ఏకవచన, పుంలింగ రూపమూ నిలుపబడింది.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: ఈ దుష్ట తరం
  rationale: רַע ఇక్కడ కేవలం ‘చెడు పరిస్థితి’ కాక నైతిక దుష్టత్వాన్ని సూచిస్తుంది; ‘దుష్ట’ ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన ఎంపిక.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: ఆ మంచి దేశాన్ని
  rationale: ‘మంచి దేశం’ హెబ్రీ పదబంధానికి నేరమైన అనువాదం; ‘ఆ’ అనే సూచన సందర్భంలో వాగ్దానం చేయబడిన దేశాన్ని సహజంగా గుర్తిస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: ఇస్తానని నేను ప్రమాణం చేసిన
  rationale: నשבע యొక్క ప్రమాణ భావాన్ని స్పష్టంగా ఉంచుతూ, לָתֵת ను తెలుగులో సహజమైన ఉద్ధరణాత్మక నిర్మాణంతో ‘ఇస్తానని’గా అందించింది.
- source_word: לַאֲבֹתֵיכֶם
  choice: మీ పితరులకు
  rationale: హెబ్రీ పదం అక్షరార్థంగా ‘మీ తండ్రులకు/పితరులకు.’ ఇక్కడ ఇశ్రాయేలు పూర్వపితరులను సూచిస్తున్నందున ‘పితరులు’ మూలంలోని పుంలింగ బహువచనాన్ని, చారిత్రక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: לַאֲבֹתֵיכֶם యొక్క అనువాదం
  choice: మీ పితరులకు
  alternative: మీ పూర్వీకులకు
  rationale: మూల హెబ్రీ స్పష్టంగా పుంలింగ బహువచనమైన ‘పితరులు’ అని చెబుతుంది. సందర్భంలో విస్తృతార్థంగా ‘పూర్వీకులు’ సాధ్యమైనప్పటికీ, ప్రధాన పాఠ్యంలో మూలరూపాన్ని నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ప్రమాణసూత్రంలోని బలమైన నిషేధాన్ని ‘ఒక్క మనిషి కూడా ... చూడడు’ అని వ్యక్తం చేసి, మూలంలోని పుంలింగ సూచనను ‘మనుషుల్లో ఒక్క మనిషి’ మరియు ‘పితరులు’ ద్వారా నిలిపాం.
