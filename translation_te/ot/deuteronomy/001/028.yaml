base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: te
  text: “మనం ఎక్కడికి పైకి వెళ్తున్నాం? మన సోదరులు, ‘ఆ ప్రజలు మనకంటే పెద్దవారు, పొడుగైనవారు; వారి పట్టణాలు పెద్దవి, ఆకాశం వరకూ ఎత్తైన ప్రాకారాలతో బలపరచబడ్డాయి[b]; అంతేకాదు, అక్కడ అనాకీయులను[c] చూశాం’ అని చెప్పి మన హృదయాలను కరిగించారు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన ధైర్యాన్ని చెదరగొట్టారు.” అక్షరార్థంగా, “మన హృదయాలను కరిగించారు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఆకాశంలో బలపరచబడినవి.” ఇది అత్యంత ఎత్తైన ప్రాకారాలను సూచించే అతిశయోక్తి.
    reason: cultural_note
  - marker: c
    text: లేదా, “అనాకీయులు” లేదా “అనాకు వంశస్థులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: మనం ఎక్కడికి ఎక్కి వెళ్తున్నాం?
  rationale: ప్రశ్నార్థక గమ్యభావాన్ని, కొండప్రాంతంలోకి పైకి వెళ్లడాన్ని సూచించే עלה భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַחֵינוּ
  choice: మన సహోదరులు
  rationale: తోటి ఇశ్రాయేలీయులను సూచించే పుంలింగ బహువచన బంధుత్వ పదాన్ని గౌరవప్రదంగా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: మన హృదయాలను కరిగించారు
  rationale: ధైర్యం కోల్పోయేలా చేశారనే అర్థమున్న సజీవ హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: ఆ ప్రజలు మనకంటే గొప్పవారు, పొడుగైనవారు
  rationale: גָּדוֹל లోని పరిమాణం/గొప్పతనం, רָם లోని ఎత్తు అనే రెండు తులనాత్మక భావాలనూ విడిగా కాపాడుతుంది.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: వారి పట్టణాలు పెద్దవి, ఆకాశమంత ఎత్తున ప్రాకారాలతో బలపరచబడ్డాయి
  rationale: పట్టణాల విస్తారతను, కోటబందోబస్తును, ఆకాశాన్ని తాకేంత ఎత్తు అనే అతిశయోక్తి చిత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: భయపెట్టే మరో అంశాన్ని జోడించే సంచయార్థక బలాన్ని అందిస్తుంది.
- source_word: בְּנֵי עֲנָקִים
  choice: అనాకీయులను
  rationale: ఇది అనాకు వంశస్థులుగా ప్రసిద్ధి చెందిన ప్రజావర్గాన్ని సూచిస్తుంది; సంక్షిప్త జాతినామం తెలుగులో సహజంగా ఉంటుంది, ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: רָאִינוּ שָׁם
  choice: అక్కడ ... చూశాం
  rationale: మునుపటి గూఢచర్య అనుభవాన్ని తెలిపే సంపూర్ణ క్రియను సహజ భూతకాల తెలుగులో అందిస్తుంది.
