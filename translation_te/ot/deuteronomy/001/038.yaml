id: DEU.1.38
reference: Deuteronomy 1:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: te
  text: నీ ఎదుట నిలిచి ఉన్న నూను కుమారుడైన యెహోషువ—అతడే అక్కడికి ప్రవేశిస్తాడు. అతన్ని బలపరచు, ఎందుకంటే అతడే ఇశ్రాయేలు ఆ దేశాన్ని వారసత్వంగా పొందేలా చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు దానిని ఇశ్రాయేలుకు వారసత్వంగా ఇస్తాడు’; లేదా, ‘అతడు దానిని ఇశ్రాయేలుకు పంచిపెడతాడు.’
    reason: నחל హిఫీల్ రూపం ‘వారసత్వంగా పొందేలా చేయడం,’ ‘వారసత్వంగా ఇవ్వడం,’ లేదా ‘పంచిపెట్టడం’ అనే సంబంధిత భావాలను వ్యక్తపరచగలదు.
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను అనుసరించి, హీబ్రూ పితృనామ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: నీ ఎదుట నిలిచే
  rationale: మోషే ఎదుట నిలబడడమనే హీబ్రూ ప్రయోగాన్ని నేరుగా నిలుపుతుంది; ‘నీకు సేవచేసే’ అని అర్థాన్ని ముందుగానే పరిమితం చేయదు.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: అతడే అక్కడికి ప్రవేశిస్తాడు
  rationale: בוא మరియు దిశాసూచకమైన שָׁמָּה కలిసి, ముందుగా ప్రస్తావించిన దేశంలోకి ప్రవేశించడాన్ని సూచిస్తాయి. ‘అతడే’ అనే రూపం הוּא యొక్క ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: אֹתוֹ חַזֵּק
  choice: అతన్ని బలపరచు
  rationale: חזק యొక్క నైతిక, కార్యసంబంధ విస్తృతిని నిలుపుతూ, ప్రోత్సహించడం లేదా ధైర్యపరచడం మాత్రమేనని పరిమితం చేయని నేరమైన అనువాదం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: అతడే ఇశ్రాయేలుకు ఆ దేశాన్ని వారసత్వంగా స్వాధీనపరుస్తాడు
  rationale: נחל హిఫీల్ రూపంలోని ‘వారసత్వంగా పొందేలా చేయడం/అప్పగించడం’ అనే కారణార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది. స్త్రీలింగ ప్రత్యయం సందర్భంలోని ‘దేశాన్ని’ సూచిస్తుందని స్పష్టం చేస్తుంది; ఇతర సాధ్యమైన భావఛాయలు పాదటిప్పణిలో ఉంచబడ్డాయి.
theological_decisions:
- issue: יַנְחִלֶנָּה లోని స్త్రీలింగ ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: వాగ్దానం చేయబడిన దేశాన్ని సూచిస్తుందని ప్రధాన పాఠ్యంలో ‘ఆ దేశాన్ని’ అని స్పష్టం చేయడం
  alternative: కర్మను అంతర్లీనంగా ఉంచి, ‘అతడు ఇశ్రాయేలును వారసత్వం పొందేలా చేస్తాడు’ అని అనువదించడం
  rationale: తక్షణ సందర్భం దేశంలో ప్రవేశించి దానిని స్వాధీనం చేసుకోవడం గురించి ఉంది. ‘ఆ దేశాన్ని’ అనేది కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా హీబ్రూ సర్వనామ కర్మను తెలుగులో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నీ ఎదుట నిలిచే’ అనే హీబ్రూ ప్రయోగాన్ని నిలిపి, ‘ప్రవేశిస్తాడు’తో దేశంలోకి వెళ్లే దిశను స్పష్టం చేసింది. ఉద్ఘాటక הוּא ను రెండు చోట్లా ‘అతడే’గా ప్రతిబింబించింది.
