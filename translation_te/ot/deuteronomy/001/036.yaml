revisions:
- from: యెఫున్నె కుమారుడైన కాలేబు తప్ప మరెవ్వరూ దాన్ని చూడరు. అతడు దాన్ని చూస్తాడు. అతడు అడుగుపెట్టిన దేశాన్ని అతనికీ అతని కుమారులకూ[a] ఇస్తాను; ఎందుకంటే అతడు యాహ్వేను సంపూర్ణంగా అనుసరించాడు.
  to: యెఫున్నె కుమారుడైన కాలేబు మాత్రం దానిని చూస్తాడు. అతడు అడుగుపెట్టిన భూమిని అతనికీ అతని కుమారులకూ[a] ఇస్తాను; ఎందుకంటే అతడు యాహ్వేను పూర్తిగా అనుసరించాడు.
  rationale: The revision renders the Hebrew exception through “మాత్రం” without importing an explicit “no one else” statement, retains the future promise, and uses “భూమి” for the promised land. The footnote remains anchored to “కుమారులకూ” and preserves the stated lexical alternatives.
