source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: te
  text: యెఫున్నె కుమారుడైన కాలేబు మాత్రం దానిని చూస్తాడు. అతడు అడుగుపెట్టిన భూమిని అతనికీ అతని కుమారులకూ[a] ఇస్తాను; ఎందుకంటే అతడు యాహ్వేను పూర్తిగా అనుసరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “అతని పిల్లలకు,” లేదా “అతని సంతానానికి.” హీబ్రూలో: “అతని కుమారులకు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: తప్ప మరెవ్వరూ
  rationale: ముందటి తీర్పులో కాలేబును మినహాయిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: యెఫున్నె కుమారుడైన కాలేబు
  rationale: హీబ్రూ పేర్లను తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: అతడు దాన్ని చూస్తాడు
  rationale: స్త్రీలింగ ప్రత్యయానికి పూర్వపదమైన దేశమే సూచితం; సందర్భంలో స్పష్టంగా ఉండేందుకు తెలుగు సర్వనామాన్ని ఉపయోగించింది.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: అతనికీ ఇస్తాను
  rationale: హీబ్రూలోని దత్తివ విభక్తి ప్రాధాన్యాన్ని ‘అతనికీ’ ద్వారా నిలిపి, సహజమైన తెలుగు వాక్యక్రమాన్ని పాటించింది.
- source_word: הָאָ֛רֶץ
  choice: దేశం
  rationale: ఇక్కడ వాగ్దాన దేశంలోని నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ సాధారణ పాఠకులకు సహజంగా, విస్తృత అర్థాన్ని కాపాడుతూ ఉంటుంది.
- source_word: אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: అతడు అడుగుపెట్టిన
  rationale: דָּרַךְ లోని నడవడం లేదా తొక్కడం అనే స్పష్టమైన భౌతిక చిత్రాన్ని ‘అడుగుపెట్టిన’ సహజంగా నిలుపుతుంది.
- source_word: וּלְבָנָ֑יו
  choice: అతని కుమారులకూ
  rationale: హీబ్రూ పదంలోని పుంలింగ బహువచనాన్ని నేరుగా కాపాడుతుంది; వారసులను విస్తృతంగా సూచించే అవకాశం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: ఎందుకంటే
  rationale: వాగ్దానానికి కారణాన్ని పరిచయం చేసే సంయుక్త అవ్యయానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה
  choice: యాహ్వేను సంపూర్ణంగా అనుసరించాడు
  rationale: ‘వెనుక నింపాడు’ అనే హీబ్రూ నుడికారానికి ఉన్న పూర్తిగా లేదా పూర్ణనిబద్ధతతో అనుసరించడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణను తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో దైవనామమే నేరుగా ఉంది. అందువల్ల దాన్ని బిరుదుగా మార్చకుండా ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: בָּנָיו పదం యొక్క పరిధి
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు; అతని సంతానం
  rationale: మూలంలోని పదం అక్షరార్థంగా ‘అతని కుమారులు.’ వారసత్వ సందర్భంలో అది విస్తృత సంతానాన్ని సూచించగల అవకాశాన్ని పాదటిప్పణిలో ఉంచి, ప్రధాన పాఠంలో లింగ-నిర్దిష్ట రూపాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘అడుగుపెట్టిన’ అనే స్పష్టమైన చిత్రాన్ని, ‘సంపూర్ణంగా అనుసరించాడు’ అనే నిబద్ధత భావాన్ని నిలిపింది. పాదటిప్పణి గుర్తును సంబంధిత ‘కుమారులకూ’ పదం వద్ద ఉంచింది.
