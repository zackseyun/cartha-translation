  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: te
  text: నీ మీదున్న వస్త్రం అరిగిపోలేదు[a]; నీ పాదం వాచిపోలేదు[b]—ఈ నలభై సంవత్సరాలుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పైవస్త్రం నీ మీద అరిగిపోలేదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ పాదం ఉబ్బిపోలేదు’; ఈ క్రియను మరింత నిర్దిష్టంగా పాదానికి పొక్కులు రావడాన్ని సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: నీ వస్త్రం
  rationale: שִׂמְלָה ఒక వస్త్రాన్ని లేదా పైవస్త్రాన్ని సూచిస్తుంది. హీబ్రూ ఏకవచనాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేందుకు ‘నీ వస్త్రం’ అని అనువదించాం.
- source_word: בָלְתָה
  choice: అరిగిపోలేదు
  rationale: בלה అంటే వాడుకవల్ల పాతబడడం లేదా అరిగిపోవడం. వస్త్రం సందర్భంలో ‘అరిగిపోలేదు’ సహజమైన, ఖచ్చితమైన వ్యక్తీకరణ.
- source_word: מֵעָלֶיךָ
  choice: నీ మీద
  rationale: అక్షరార్థంగా ‘నీ మీదనుండి’ అనే నిర్మాణం ఉన్నా, వస్త్రం ధరించిన స్థితిలో అది అరిగిపోలేదనే భావాన్ని తెలుగులో ‘నీ మీద అరిగిపోలేదు’ సహజంగా తెలియజేస్తుంది.
- source_word: וְרַגְלְךָ
  choice: నీ పాదం
  rationale: మూలంలో ఏకవచనం ఉంది. దానిని నిలుపుతూ గౌరవప్రదమైన సాధారణ తెలుగులో ‘నీ పాదం’ అని ఇచ్చాం.
- source_word: בָצֵקָה
  choice: వాచిపోలేదు
  rationale: ఈ క్రియను సంప్రదాయంగా వాపు రావడం లేదా ఉబ్బడం అనే అర్థంలో గ్రహిస్తారు. ‘వాచిపోలేదు’ సంక్షిప్తంగా, సహజంగా ఉంది; బొబ్బలు రావడం అనే మరింత నిర్దిష్ట అర్థం సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: ఈ నలభై సంవత్సరాల్లో
  rationale: కాలవ్యవధితో కూడిన హీబ్రూ ‘ఇవి/ఈ నలభై సంవత్సరాలు’ అనే ప్రయోగాన్ని తెలుగులో సహజంగా, మొత్తం కాలవ్యవధిని సూచించేలా ‘ఈ నలభై సంవత్సరాల్లో’ అని అందించాం.
