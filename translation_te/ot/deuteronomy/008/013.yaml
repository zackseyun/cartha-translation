  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: te
  text: నీ గోవుల మందలూ నీ గొర్రెలు మేకల మందలూ పెరిగినప్పుడు, వెండి బంగారం నీకు పెరిగినప్పుడు, నీకు ఉన్నదంతా పెరిగినప్పుడు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: నీ పశువుల మందలు
  rationale: בקר ప్రధానంగా గోవులవంటి పెద్ద పశువులను సమూహంగా సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘పశువుల మందలు’ అని అనువదించాం.
- source_word: וְצֹאנְךָ
  choice: గొర్రెలమేకల మందలు
  rationale: צאן అనేది ముఖ్యంగా గొర్రెలు, మేకలు వంటి చిన్న పశువులకు వాడే సమూహపదం; తెలుగులో దాని పరిధిని స్పష్టంగా చూపేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: יִרְבְּיוּן
  choice: విస్తరించినప్పుడు
  rationale: רבה ఇక్కడ పశుసంపద సంఖ్యాపరంగా పెరగడాన్ని సూచిస్తుంది. సందర్భంలోని వరుస షరతులను సహజ తెలుగులో కలిపేందుకు కాలార్థక ‘-నప్పుడు’ రూపం వాడాం.
- source_word: וְכֶסֶף וְזָהָב יִרְבֶּה לָּךְ
  choice: నీ కోసం వెండి బంగారాలు పెరిగినప్పుడు
  rationale: לָךְ లోని దత్తార్థాన్ని ‘నీ కోసం’తో నిలిపి, మూలంలో లోహాలకు నేరుగా లేని స్వామ్యసూచకాన్ని అనవసరంగా చేర్చలేదు.
- source_word: וְכֹל אֲשֶׁר לְךָ יִרְבֶּה
  choice: నీకు ఉన్నదంతా విస్తరించినప్పుడు
  rationale: אֲשֶׁר לְךָ మొత్తం ఆస్తిని సూచిస్తుంది. ‘నీకు ఉన్నదంతా’ సహజంగా స్వామ్యభావాన్ని తెలియజేస్తుంది; רבה యొక్క విస్తృత పెరుగుదల భావాన్ని ‘విస్తరించు’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వచనం ముందున్న షరతుల వరుసలో భాగమైనందున క్రియలను ‘-నప్పుడు’ రూపంలో ఇచ్చి, చివరి డాష్‌తో వాక్యం కొనసాగుతుందని చూపించాం.
