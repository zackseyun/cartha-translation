  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: te
  text: అందువల్ల, ఒక మనిషి తన కుమారుణ్ణి క్రమశిక్షణలో పెట్టినట్లే, నీ దేవుడైన యహ్వే నిన్ను క్రమశిక్షణలో పెడుతున్నాడని[a] నీ హృదయంలో తెలుసుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శిక్షిస్తున్నాడు,’ ‘సరిదిద్దుతున్నాడు.’ హీబ్రూ క్రియలో దిద్దుబాటు కోసం చేసే శిక్షతో పాటు వ్యక్తిని తీర్చిదిద్దే శిక్షణ అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: అందువల్ల ... గ్రహించు
  rationale: ముందటి సందర్భం నుంచి వచ్చే ఫలితాత్మక అనుసంధానాన్ని ‘అందువల్ల’ తెలియజేస్తుంది; పరిపూర్ణ క్రియకు ఇక్కడ ఉన్న ప్రబోధాత్మక బలాన్ని సహజమైన తెలుగు ఆజ్ఞారూపమైన ‘గ్రహించు’ నిలుపుతుంది.
- source_word: עִם לְבָבֶךָ
  choice: నీ హృదయంలో
  rationale: ఈ హీబ్రూ నుడికారం అంతరంగికమైన గుర్తింపును లేదా నిశ్చయాన్ని సూచిస్తుంది; ‘నీ హృదయంలో’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כִּי
  choice: అని
  rationale: తెలుసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఉల్లేఖనార్థక ‘అని’ దీనిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: అలాగే ... పెట్టినట్లే
  rationale: మానవుడు తన కుమారునికి ఇచ్చే క్రమశిక్షణకూ యహ్వే ఇచ్చే క్రమశిక్షణకూ మధ్య ఉన్న పోలికను సహజమైన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: క్రమశిక్షణలో పెట్టు
  rationale: יסר అనే మూలపదంలో దిద్దుబాటు శిక్ష, మార్గదర్శక శిక్షణ అనే రెండు భావాలూ ఉన్నాయి. ‘క్రమశిక్షణలో పెట్టు’ ఆ విస్తృతిని నిలుపుతూ, రెండు చోట్లా ఒకే పదబంధాన్ని వాడి హీబ్రూ పునరుక్తిని కాపాడుతుంది.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: మూలంలో ‘తండ్రి’ అని కాకుండా స్పష్టంగా ‘మనిషి’ అని ఉంది; కుమారునితో అతని సంబంధం తరువాతి పదం ద్వారా తెలుస్తుంది.
- source_word: בְּנוֹ
  choice: తన కుమారుణ్ణి
  rationale: మూల నామవాచకం సాధారణ ‘బిడ్డ’ కంటే నిర్దిష్టంగా ‘కుమారుడు’ అని అర్థమిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో మార్చకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: దైవిక నామంతో కూడిన నిబంధనాత్మక సంబోధనను సహజమైన తెలుగు సంబంధ నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: దైవిక క్రమశిక్షణ స్వభావం
  choice: క్రమశిక్షణలో పెడుతున్నాడు
  alternative: శిక్షిస్తున్నాడు; సరిదిద్దుతున్నాడు; శిక్షణ ఇస్తున్నాడు
  rationale: ఈ ఎంపిక దేవుని చర్యను కేవలం శిక్షగా గానీ, కేవలం బోధనగా గానీ సంకుచితం చేయకుండా, దిద్దుబాటు మరియు రూపుదిద్దే శిక్షణ అనే రెండు పార్శ్వాలనూ నిలుపుతుంది.
- issue: יְהוָה అనే దైవిక నామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నామం ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘క్రమశిక్షణలో పెట్టు’ అనే సహజ పదబంధం ద్వారా హీబ్రూ మూలంలోని పునరుక్తి, భావవిస్తృతి రెండూ నిలుపబడ్డాయి.
