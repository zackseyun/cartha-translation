- from: నీవు దారిద్ర్యంలో రొట్టె తినాల్సిన అవసరం లేని[a], నీకు ఏదీ కొదువ కాని దేశం అది; దాని రాళ్లు ఇనుము, దాని కొండలలోనుండి నీవు రాగిని తవ్వి తీస్తావు.[b]
  to: నీవు దారిద్ర్యంలో[a] రొట్టె తినని, అందులో నీకు ఏ కొదువా లేని దేశం అది; దాని రాళ్లు ఇనుమే, దాని కొండల నుండి నీవు రాగిని తవ్వి తీస్తావు.[b]
