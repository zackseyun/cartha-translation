language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְ/מִסְכֵּנֻת֙ תֹּֽאכַל בָּ֣/הּ לֶ֔חֶם לֹֽא תֶחְסַ֥ר כֹּ֖ל בָּ֑/הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣י/הָ בַרְזֶ֔ל וּ/מֵ/הֲרָרֶ֖י/הָ תַּחְצֹ֥ב נְחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: te
  text: నీవు దారిద్ర్యంలో[a] రొట్టె తినని, అందులో నీకు ఏ కొదువా లేని దేశం అది; దాని రాళ్లు ఇనుమే, దాని కొండల నుండి నీవు రాగిని తవ్వి తీస్తావు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేమిలో’ లేదా ‘కొరతలో.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ‘రాగి’ లేదా ‘కంచు’ అని అర్థమివ్వగలదు. ఇక్కడ కొండల నుండి తవ్వి తీసే సహజ పదార్థాన్ని సూచిస్తున్నందున ‘రాగి’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: దారిద్ర్యంలో
  rationale: ఈ పదం పేదరికం, లేమి, దైన్యస్థితిని సూచిస్తుంది. తరువాతి వాక్యభాగంలో కొదువ లేకపోవడం ప్రత్యేకంగా చెప్పబడుతున్నందున, ఇక్కడ దారిద్ర్య పరిస్థితిలో భోజనం చేయాల్సిన అవసరం ఉండదనే భావాన్ని నిలిపింది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: మూలపదపు ప్రాథమిక, స్పష్టమైన అర్థం ‘రొట్టె’. సందర్భంలో అది ఆహారాన్ని విస్తృతంగా సూచించగలిగినా, మూలంలోని దృశ్యరూపాన్ని కాపాడేందుకు నిర్దిష్ట పదాన్నే ఉంచాం.
- source_word: תֶחְסַר כֹּל
  choice: నీకు ఏదీ కొదువ కాని
  rationale: ఈ ప్రయోగం సంపూర్ణ సమృద్ధిని తెలియజేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, כֹּל యొక్క సమగ్ర భావాన్ని ‘ఏదీ’ ద్వారా నిలిపాం.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: దాని రాళ్లు ఇనుము
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ‘దాని రాళ్లు [అవి] ఇనుము’ అని చెబుతుంది. ఇనుము కలిగిన శిలలను సూచించే ఈ సజీవ రూపకాన్ని వివరణగా మార్చకుండా నిలిపాం.
- source_word: תַּחְצֹב
  choice: తవ్వి తీస్తావు
  rationale: ఈ క్రియ చెక్కడం, రాతిని తొలచడం లేదా ఖనిజాన్ని తవ్వి తీయడం అనే భావం ఇస్తుంది. కొండల నుంచి లోహాన్ని వెలికితీయడాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: נְחֹשֶׁת
  choice: రాగి
  rationale: ఈ హీబ్రూ పదం సందర్భానుసారం రాగి లేదా కంచును సూచించగలదు. కొండల నుంచి సహజ పదార్థాన్ని తవ్వి తీయడం ఇక్కడ ఉద్దేశం కాబట్టి, మిశ్రమలోహమైన కంచుకన్నా ‘రాగి’ సముచితం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘రొట్టె’ మరియు ‘దాని రాళ్లు ఇనుము’ అనే మూలంలోని స్పష్టమైన చిత్రాలను నిలిపి, ఖనిజాన్ని వెలికితీయడాన్ని ‘తవ్వి తీస్తావు’ అని సామాన్య పాఠకుడికి అర్థమయ్యేలా వ్యక్తం చేశాం.
