source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: te
  text: కాబట్టి[a] నీ దేవుడైన యాహ్వే ఆజ్ఞలను పాటించాలి; ఆయన మార్గాల్లో నడవాలి, ఆయనకు భయపడాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు నీ దేవుడైన యాహ్వే ఆజ్ఞలను పాటించాలి.” హెబ్రీ సంధిపదం సాధారణ సమన్వయాన్ని సూచించవచ్చు; అయితే ఇక్కడ ముందున్న సందర్భం నుంచి వచ్చే నిర్ధారణ భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆయనకు భయపడాలి” అంటే దేవుని ఎదుట భక్తిపూర్వకమైన భయం కలిగి ఉండాలి. మరో విధంగా, “ఆయనను భక్తితో గౌరవించాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: కాబట్టి … పాటించాలి
  rationale: שׁמר ఆజ్ఞలతో వచ్చినప్పుడు వాటిని విధేయతతో పాటించడం అనే అర్థం ఇస్తుంది. ముందున్న సందర్భం నుంచి వచ్చే నిర్ధారణ భావాన్ని וְ ఇక్కడ ‘కాబట్టి’గా వ్యక్తం చేస్తుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: బహువచన నిర్మాణ రూపమైన ఈ పదం దేవుడు విధించిన కట్టుబాట్లను సూచిస్తుంది; ‘ఆజ్ఞలు’ ఆధునిక తెలుగులో సహజంగాను న్యాయనిబంధన భావాన్ని నిలుపుకునేదిగాను ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయం ‘నీ దేవుడు’ అనే స్వామ్య సంబంధాన్ని తెలుపుతుంది; తెలుగు వాక్య నిర్మాణానికి ‘నీ దేవుడైన యాహ్వే’ సహజంగా ఉంది.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ఆయన మార్గాల్లో నడుస్తూ
  rationale: ‘మార్గాల్లో నడవడం’ అనే మూల రూపకాన్ని నిలుపుతూ, ఆజ్ఞలను పాటించడం ఎలా ఆచరణలో కనిపిస్తుందో తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: ఆయనకు భయపడాలి
  rationale: దేవుని విషయంలో ירא భక్తిపూర్వకమైన భయాన్ని సూచించినా, ‘భయం’ అనే బలమైన మూలభావాన్ని సున్నితపరచకుండా ప్రధాన పాఠ్యంలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల ‘ప్రభువు’ వంటి బిరుదును పెట్టకుండా, హెబ్రీ దైవనామానికి దగ్గరైన ‘యాహ్వే’ అనే లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: దేవునికి భయపడడం అనే భాష
  choice: ఆయనకు భయపడాలి
  alternative: ఆయనను భక్తితో గౌరవించాలి
  rationale: ఈ సందర్భంలో భక్తి, గౌరవం అంతర్భాగాలైనా, ירא లోని భయ భావాన్ని కేవలం గౌరవంగా మార్చకుండా వాక్యంలోని ధార్మిక ఉద్వేగాన్ని నిలిపాం.
- issue: ఆజ్ఞలను పాటించడం మరియు తరువాతి క్రియల సంబంధం
  choice: అర్ధవిరామంతో వివరణాత్మక సంబంధం
  alternative: ఆయన మార్గాల్లో నడవడం ద్వారా, ఆయనకు భయపడడం ద్వారా … పాటించాలి
  rationale: రెండు హెబ్రీ క్రియార్థక రూపాలు ఆజ్ఞలను పాటించే జీవన విధానాన్ని వివరిస్తాయి. తెలుగులో పదేపదే ‘ద్వారా’ అనడం కృత్రిమంగా ఉండేందున, అర్ధవిరామం తరువాత సమాంతర క్రియలతో ఆ సంబంధాన్ని సహజంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘యాహ్వే,’ ‘ఆజ్ఞలు,’ ‘మార్గాల్లో నడవడం,’ ‘భయపడడం’ అనే మూలపాఠ్యంలోని ఒడంబడిక సంబంధిత పదజాలం, రూపకాన్ని నిలిపాం.
