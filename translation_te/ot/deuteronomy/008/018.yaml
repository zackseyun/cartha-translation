id: DEU.8.18
reference: Deuteronomy 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: te
  text: కానీ నీవు నీ దేవుడైన యాహ్వేను గుర్తుంచుకోవాలి. ఎందుకంటే సంపదను సంపాదించే సామర్థ్యాన్ని[a] నీకు ఇచ్చేవాడు ఆయనే. ఆయన నీ పితరులకు[b] ప్రమాణం చేసిన తన నిబంధనను స్థిరపరచడానికి అలా చేస్తున్నాడు—నేటి దినంలాగే.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంపదను ఉత్పత్తి చేయడానికి,’ ‘సంపదను సాధించడానికి,’ లేదా మరింత విస్తృతంగా ‘విజయం సాధించడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘నీ పితరులు’; ఇది ప్రత్యేకంగా నిబంధన వాగ్దానం పొందిన పితృపురుషులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: హెబ్రీ నుడికారం అక్షరార్థంగా ‘ఈ దినంలాగా’; అంటే ‘ఈ రోజున ఉన్నట్లుగా’ లేదా ‘ప్రస్తుతం ఉన్న స్థితిలో ఉన్నట్లుగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: కానీ నీవు ... గుర్తుంచుకోవాలి
  rationale: ముందటి వచనంలోని స్వశక్తి భావానికి వ్యతిరేకమైన అనుసంధానాన్ని ‘కానీ’ తెలియజేస్తుంది; ఈ సందర్భంలో క్రియ ఆజ్ఞాత్మకమైన బలమైన ఉపదేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, ఒడంబడిక సంబంధాన్ని తెలిపే ‘నీ దేవుడు’ అనే భావాన్ని సహజమైన తెలుగులో ఉంచింది.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: ఎందుకంటే ... నీకు ఇచ్చేవాడు ఆయనే
  rationale: כִּי తెలిపే కారణ భావాన్నీ, הוּא అనే సర్వనామంలోని ఉద్ఘాటననూ నిలిపింది; వర్తమాన కృదంతం దేవుని నిరంతర/లక్షణాత్మక కార్యాన్ని సూచిస్తుంది.
- source_word: כֹּחַ
  choice: సామర్థ్యం
  rationale: శారీరక బలం మాత్రమే కాక ఏదైనా సాధించగల శక్తి లేదా సామర్థ్యం అనే విస్తృత భావాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת חָיִל
  choice: సంపదను సంపాదించే
  rationale: మునుపటి వచనంలోని ఆర్థిక సమృద్ధి సందర్భానికి అనుగుణంగా חָיִל‌ను ‘సంపద’గా తీసుకుంది; హెబ్రీ ప్రయోగంలోని ‘చేయడం/సాధించడం’ భావాన్ని ‘సంపాదించడం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: తన నిబంధనను స్థిరపరచడానికి
  rationale: לְמַעַן లోని ఉద్దేశ భావాన్ని కాపాడుతూ, హిఫిల్ הָקִים‌ను నిబంధనను చరిత్రలో అమలు చేసి దృఢపరచడం అనే అర్థం కలిగిన ‘స్థిరపరచడం’గా అనువదించింది.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: నీ పితరులతో తాను ప్రమాణం చేసిన
  rationale: పితృపురుషులను సూచించే పురుష బహువచనాన్ని ‘పితరులు’గా నిలిపి, ప్రమాణం చేయడంలో సహజ తెలుగు విభక్తి ప్రయోగాన్ని ఉపయోగించింది.
- source_word: כַּיּוֹם הַזֶּה
  choice: నేడు కనిపిస్తున్నట్టుగానే
  rationale: ‘ఈ దినంలాగా’ అనే అక్షరార్థపు అసహజతను నివారిస్తూ, ప్రస్తుతం ప్రత్యక్షంగా ఉన్న నెరవేర్పును సూచించే ద్వితీయోపదేశకాండపు నుడికార భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: ఆర్థిక సందర్భంలో חָיִל అర్థం
  choice: సంపద
  alternative: విజయం; సాఫల్యం; వనరులు
  rationale: 8:17లోని సంపదను తానే సంపాదించుకున్నాననే శోధన ఈ వచనానికి తక్షణ సందర్భం. అయినా పదానికి ఉన్న విస్తృత భావాన్ని పాదసూచికలో ఉంచింది.
- issue: הָקִים ద్వారా నిబంధన కార్యం
  choice: స్థిరపరచడం
  alternative: ధృవపరచడం; నెరవేర్చడం; నిలబెట్టడం
  rationale: దేవుడు నిబంధనను చరిత్రలో అమలు చేసి దాని స్థిరత్వాన్ని చూపుతున్నాడనే భావాన్ని ఇస్తుంది; నిబంధన ఇంతకుముందు లేదన్న అర్థాన్ని మోపదు.
- issue: אֲבֹתֶיךָ సూచించే వారు
  choice: నీ పితరులు
  alternative: నీ పూర్వీకులు
  rationale: ఇక్కడ సాధారణ పూర్వీకులకంటే నిబంధన వాగ్దానం పొందిన పితృపురుషులే ప్రత్యేకంగా ఉద్దేశించబడ్డారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఏకవచన సంబోధనను ‘నీవు/నీకు’తో నిలిపింది. పొడవైన హెబ్రీ వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినా కారణం, ఉద్దేశం, నిబంధన అనే తార్కిక సంబంధాలు యథాతథంగా ఉంచబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట [a], [b], [c] క్రమంలో ఉన్నాయి.
