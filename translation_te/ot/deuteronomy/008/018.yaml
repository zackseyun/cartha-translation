  revision_rationale: ‘పితరులతో’ను ‘పితరులకు’గా సవరించి, ప్రమాణం ఎవరికి చేయబడిందో మూలంలోని దత్తివ సంబంధానికి అనుగుణంగా చేశాం. చివరి నుడికారంలోని మూలంలో లేని ‘కనిపిస్తున్న’ భావాన్ని తొలగించి, ప్రస్తుత స్థితిని సూచించే హెబ్రీ ప్రయోగాన్ని ‘నేటి దినంలాగే’గా నిలిపాం. ఇతర పదజాలం, వాక్యనిర్మాణం, పాదసూచిక గుర్తుల క్రమం యథాతథంగా సముచితంగా ఉన్నాయి.
