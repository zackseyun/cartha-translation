  to: కానీ నీవు నీ దేవుడైన యాహ్వేను గుర్తుంచుకోవాలి. ఎందుకంటే సంపదను సంపాదించే సామర్థ్యాన్ని[a] నీకు ఇచ్చేవాడు ఆయనే. ఆయన నీ పితరులకు[b] ప్రమాణం చేసిన తన నిబంధనను స్థిరపరచడానికి అలా చేస్తున్నాడు—నేటి దినంలాగే.[c]
  rationale: ‘పితరులతో’ను ‘పితరులకు’గా సవరించి, ప్రమాణం ఎవరికి చేయబడిందో మూలంలోని దత్తివ సంబంధానికి అనుగుణంగా చేశాం. చివరి నుడికారంలోని మూలంలో లేని ‘కనిపిస్తున్న’ భావాన్ని తొలగించి, ప్రస్తుత స్థితిని సూచించే హెబ్రీ ప్రయోగాన్ని ‘నేటి దినంలాగే’గా నిలిపాం. ఇతర పదజాలం, వాక్యనిర్మాణం, పాదసూచిక గుర్తుల క్రమం యథాతథంగా సముచితంగా ఉన్నాయి.
