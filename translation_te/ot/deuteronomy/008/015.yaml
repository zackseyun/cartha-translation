id: DEU.8.15
reference: Deuteronomy 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/מּוֹלִ֨יכֲ/ךָ֜ בַּ/מִּדְבָּ֣ר הַ/גָּדֹ֣ל וְ/הַ/נּוֹרָ֗א נָחָ֤שׁ שָׂרָף֙ וְ/עַקְרָ֔ב וְ/צִמָּא֖וֹן אֲשֶׁ֣ר אֵֽין מָ֑יִם הַ/מּוֹצִ֤יא לְ/ךָ֙ מַ֔יִם מִ/צּ֖וּר הַֽ/חַלָּמִֽישׁ׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: te
  text: మంటపుట్టించే పాములు[a], తేళ్లు, నీళ్లు లేని ఎండిన నేల[b] ఉన్న ఆ విశాలమైన, భయంకరమైన అరణ్యం గుండా నిన్ను నడిపించినవాడు, చెకుముకి రాతి బండనుండి నీకోసం నీళ్లు రప్పించినవాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విషపాములు’ లేదా ‘మండే పాములు.’ హీబ్రూ పదబంధం, కాటు వల్ల మండుతున్న అనుభూతిని కలిగించే పాములను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాహం’ లేదా ‘కరవు.’ హీబ్రూ పదం నీళ్లు లేని ప్రాంతంలోని తీవ్రమైన ఎండుదనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: నిన్ను నడిపించినవాడు ఆయనే
  rationale: హిఫిల్ కృదంతాన్ని సందర్భానుసారమైన గత కార్యంగా వ్యక్తపరుస్తూ, ముందున్న యెహోవాను సూచించే అన్వయాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: విశాలమైన, భయంకరమైన అరణ్యంలో
  rationale: מִדְבָּרను ఇసుక ఎడారికే పరిమితం చేయకుండా ‘అరణ్యం’గా అనువదించింది; גָּדֹל ఇక్కడ విస్తీర్ణ భావాన్ని కలిగిస్తుండగా, נוֹרָא భయాన్ని రేకెత్తించే స్వభావాన్ని సూచిస్తుంది.
- source_word: נָחָשׁ שָׂרָף
  choice: మంటపుట్టించే పాములు
  rationale: పాము కాటు కలిగించే మండే అనుభూతిని సూచించే సాధ్యమైన భావాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థసదృశమైన ‘మండే పాములు’ మరియు ‘విషపాములు’ అనే ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
- source_word: וְעַקְרָב
  choice: తేళ్లు
  rationale: జాబితాలోని ప్రమాదాన్ని సూచించే సూటి, సాధారణ తెలుగు సమానార్థకం.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: నీళ్లు లేని ఎండిపోయిన ప్రదేశం
  rationale: צִמָּאוֹןలోని దాహం/పారched dryness భావాన్ని పరిసర ప్రాంతపు నీరులేని స్థితిగా స్పష్టంగా వ్యక్తపరుస్తుంది; పదంలోని భావవిస్తృతిని పాదసూచికలో కాపాడింది.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: నీకోసం నీళ్లు రప్పించినవాడు ఆయనే
  rationale: హిఫిల్ రూపంలోని ‘బయటికి వచ్చేటట్లు చేయడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: చెకుముకిరాతి బండలోనుండి
  rationale: צוּרను ‘బండ’గా, חַלָּמִישׁను గట్టి చెకుముకిరాయి లక్షణంతో అనువదించి మూలంలోని స్పష్టమైన రాతి చిత్రణను నిలుపుతుంది.
theological_decisions:
- issue: అరణ్యంలోని ప్రమాదాల స్వభావం
  choice: పాములు, తేళ్లు, నీరులేని ఎండిన ప్రదేశం అనే స్పష్టమైన చారిత్రక ప్రమాదాలుగా అనువదించడం
  alternative: వాటిని రూపకాలుగా లేదా సాధారణ ‘ప్రమాదాలు’గా మార్చడం
  rationale: హెబ్రీ వాక్యం ఇశ్రాయేలు అరణ్యప్రయాణంలోని నిర్దిష్ట ప్రమాదాలు మరియు దేవుని పరిరక్షణను స్మరింపజేస్తుంది; రూపకాల వ్యాఖ్యానాన్ని వచనంలోకి చేర్చదు.
- issue: נָחָשׁ שָׂרָף యొక్క అర్థం
  choice: కాటు మంటపుట్టించే పాములు అనే సాధ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: అక్షరార్థంగా ‘మండే పాములు’ లేదా సాధారణంగా ‘విషపాములు’
  rationale: שָׂרָףలోని ‘మండడం’ భావాన్ని కాపాడుతూ పాములు నిజంగా అగ్నిమయమైనవని అనవసరంగా నిర్ధారించదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని రెండు సమాంతర కృదంతాలను ‘నడిపించినవాడు ఆయనే … రప్పించినవాడు ఆయనే’గా నిలిపి, దీర్ఘ వాక్యంలోని ప్రమాదాల జాబితాను డాష్‌లతో స్పష్టపరిచాం. ‘నీళ్లు’ సాధారణ ఆధునిక వాడుకకు అనుకూలం; ‘చెకుముకిరాతి బండ’ మూలంలోని గట్టి ఫ్లింట్ రాయి చిత్రణను నిలుపుతుంది.
