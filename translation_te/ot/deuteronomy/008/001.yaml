  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: te
  text: నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న ప్రతి ఆజ్ఞనూ[a] మీరు శ్రద్ధగా పాటించి ఆచరించాలి; తద్వారా మీరు జీవించి, సంఖ్యలో పెరిగి, యాహ్వే మీ పితరులకు[c] ప్రమాణం చేసిన భూమిలో ప్రవేశించి, దానిని స్వాధీనం చేసుకుంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొత్తం ఆజ్ఞను.’ హీబ్రూలో ఏకవచన సామూహిక పదప్రయోగం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానిని వారసత్వంగా పొందుతారు.’ హీబ్రూ క్రియ సందర్భాన్ని బట్టి వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘మీ తండ్రులకు’; ఇక్కడ ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: ప్రతి ఆజ్ఞను
  rationale: హీబ్రూలో ఏకవచన సామూహిక ప్రయోగం ఉంది. ఆధునిక తెలుగులో ‘ప్రతి ఆజ్ఞను’ అనడం ఆజ్ఞల సమగ్రతను సహజంగా తెలియజేస్తుంది; ‘ఆ ఆజ్ఞ అంతటినీ’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: מְצַוְּךָ
  choice: నేను ... నీకు ఆజ్ఞాపిస్తున్న
  rationale: భాగధాతు రూపంలోని ప్రస్తుత/తక్షణ భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ ప్రతిబింబిస్తుంది. ఇక్కడ హీబ్రూ ద్వితీయ పురుష ఏకవచనం ఉన్నందున ‘నీకు’ అని ఉంచాం; తరువాతి క్రియల బహువచనాన్ని ‘మీరు’గా నిలిపాం.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: మీరు జాగ్రత్తగా పాటించాలి
  rationale: శమర్‌తో పాటు ‘చేయుటకు’ అనే భావం కేవలం గుర్తుంచుకోవడం కాక ఆచరణాత్మక విధేయతను సూచిస్తుంది. తెలుగులో ‘జాగ్రత్తగా పాటించాలి’ ఆ రెండు అంశాలను సహజంగా కలుపుతుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: హీబ్రూ పదం ఉద్దేశం లేదా ఫలితాన్ని కలుపుతుంది. రెండు తెలుగు వాక్యాల మధ్య ‘అప్పుడు’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది, అయితే దాన్ని కేవలం యాంత్రిక కాలక్రమంగా కాక ముందటి విధేయతతో అనుసంధానమైన ఫలితంగా చదవాలి.
- source_word: תִּחְיוּן
  choice: మీరు జీవించి
  rationale: జీవించడం లేదా సజీవంగా నిలవడం అనే ప్రత్యక్ష భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וּרְבִיתֶם
  choice: సంఖ్యలో పెరిగి
  rationale: ఇక్కడ רבה జనసంఖ్య పెరగడాన్ని సూచిస్తుంది. ‘విస్తరించి’ కంటే ‘సంఖ్యలో పెరిగి’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וּבָאתֶם
  choice: ప్రవేశించి
  rationale: వాగ్దాన దేశంలోకి వెళ్లడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וִירִשְׁתֶּם
  choice: స్వాధీనం చేసుకుంటారు
  rationale: ירשׁ సందర్భానుసారం వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాలు కలిగి ఉంటుంది. దేశంలో ప్రవేశించి దాన్ని పొందే సందర్భంలో ‘స్వాధీనం చేసుకుంటారు’ స్పష్టమైన ప్రధాన అనువాదం; ‘వారసత్వంగా పొందుతారు’ పాదసూచికలో ఉంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ ఇశ్రాయేలుకు ప్రమాణం చేయబడిన భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉన్నప్పటికీ వాగ్దాన భూమి అనే సందర్భార్థం అలాగే ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: נִשְׁבַּע
  choice: ప్రమాణం చేసిన
  rationale: దేవుడు ప్రమాణంతో తనను తాను బద్ధునిగా చేసుకున్న నిబంధనాత్మక బలాన్ని ఈ ప్రయోగం కాపాడుతుంది.
- source_word: אֲבֹתֵיכֶם
  choice: మీ పితరులకు
  rationale: మూలంలోని పురుషవాచక బంధుత్వ పదాన్ని నిలిపి, ఇశ్రాయేలు పూర్వపితరులను సూచించే గౌరవప్రదమైన సహజ తెలుగు పదాన్ని వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దేవుని ప్రత్యేక నామం ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా తెలుగులో ప్రసిద్ధమైన నామరూపాన్ని ఉంచాం.
- issue: אֲבֹתֵיכֶם అనే బంధుత్వ పదం
  choice: మీ పితరులకు
  alternative: మీ పూర్వీకులకు
  rationale: మూలంలోని ‘తండ్రులు/పితరులు’ అనే పురుషవాచక రూపాన్ని కాపాడుతూ, సందర్భంలో అది ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం.
- issue: ఏకవచన సంబోధన నుంచి బహువచన క్రియలకు మార్పు
  choice: ‘నీకు’ అనే ఏకవచనాన్ని, ‘మీరు’ అనే బహువచనాన్ని రెండింటినీ నిలిపాం
  alternative: అన్నిచోట్లా ‘మీకు/మీరు’ అని సమీకరించడం
  rationale: హీబ్రూ మొదట ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధించి, తరువాత బహువచన క్రియలకు మారుతుంది. ఈ వ్యాకరణ ఉద్వేగాన్ని నిశ్శబ్దంగా తొలగించలేదు.
- issue: విధేయతకు అనుసంధానమైన జీవితం, వృద్ధి, దేశస్వాధీనం
  choice: ‘అప్పుడు’ ద్వారా ఫలిత/ఉద్దేశ సంబంధాన్ని నిలిపాం
  alternative: నిర్బంధ కారణఫల సూత్రంగా విస్తరించి చెప్పడం
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; వచనం చెప్పిన సంబంధాన్ని మించి ప్రత్యేక సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలిని వాడాం. మూలంలోని ఏకవచన ‘నీకు’ నుంచి బహువచన ‘మీరు’కు మార్పును ఉద్దేశపూర్వకంగా నిలిపాం. వాక్యం అతిగా భారంగా కాకుండా రెండు వాక్యాలుగా విభజించబడింది; నిబంధనాత్మక గంభీరతను మాత్రం కాపాడాం.
