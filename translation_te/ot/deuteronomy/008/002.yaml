source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే ఈ నలభై సంవత్సరాలుగా అరణ్యంలో నిన్ను నడిపించిన మార్గమంతటినీ జ్ఞాపకం చేసుకో; నిన్ను అణకువపరచడానికి, నిన్ను పరీక్షించడానికి, నీ హృదయంలో ఏముందో—నీవు ఆయన ఆజ్ఞలను పాటిస్తావో లేదో—తెలుసుకోవడానికి ఆయన నిన్ను నడిపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ హృదయంలో ఏముందో బయలుపరచడానికి.’ హెబ్రీలో అక్షరార్థంగా ‘నీ హృదయంలో ఏముందో తెలుసుకోవడానికి’ అని ఉంది; ఆ భావవ్యక్తీకరణనే ప్రధాన పాఠ్యంలో ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: జ్ఞాపకం చేసుకో
  rationale: బోధాత్మక సందర్భంలో ఆజ్ఞార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל הַדֶּרֶךְ
  choice: మార్గమంతటినీ
  rationale: ఇది కేవలం రహదారిని కాక, అరణ్య ప్రయాణపు సంపూర్ణ గమనాన్ని సూచిస్తుంది; మూలంలోని ‘మార్గం’ రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: הֹלִיכֲךָ
  choice: నిన్ను నడిపించిన
  rationale: హిఫిల్ క్రియలోని కారణార్థక భావాన్ని, దేవుని మార్గదర్శకత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే ద్వితీయ పురుష ఏకవచన స్వామ్యరూపాన్ని నిలుపుతుంది.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: ఈ నలభై సంవత్సరాలు
  rationale: కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు సంచరించిన జనావాసరహిత ప్రాంతాన్ని సూచించే విస్తృతమైన, స్థిరమైన తెలుగు పదం.
- source_word: עַנֹּתְךָ
  choice: నిన్ను అణకువపరచడానికి
  rationale: కష్టానుభవం ద్వారా తగ్గించడం లేదా వినమ్రుణ్ణి చేయడం అనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది; కేవలం బాధించడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: לְנַסֹּתְךָ
  choice: నిన్ను పరీక్షించడానికి
  rationale: נסה లోని పరీక్షించి నిజస్థితిని నిర్ధారించే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לָדַעַת
  choice: తెలుసుకోవడానికి
  rationale: మూలంలోని ప్రత్యక్ష ‘తెలుసుకోవడం’ అనే మాటను నిలుపుతూ, దైవ సర్వజ్ఞత్వానికి సంబంధించిన ఉద్రిక్తతను అనువాదంలో పరిష్కరించదు.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: నీ హృదయంలో ఏముందో
  rationale: לֵבָב సూచించే ఆలోచన, సంకల్పం, అంతరంగ స్వభావాన్ని సంప్రదాయబద్ధమైనప్పటికీ సులభంగా అర్థమయ్యే ‘హృదయం’ ద్వారా తెలియజేస్తుంది.
- source_word: הֲתִשְׁמֹר מצותיו אִם־לֹא
  choice: నీవు ఆయన ఆజ్ఞలను పాటిస్తావో లేదో
  rationale: ప్రశ్నార్థక ప్రత్యామ్నాయ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘పాటించడం’ విధేయత భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నీ హృదయంలో ఏముందో తెలుసుకోవడానికి’ అనే మానవరూపారోపణ భాష
  choice: ‘తెలుసుకోవడానికి’ అనే ప్రత్యక్ష భావాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నీ హృదయంలో ఏముందో బయలుపరచడానికి’
  rationale: హెబ్రీ పాఠ్యం ידע అనే ‘తెలుసుకొను’ క్రియనే ఉపయోగిస్తుంది. దైవ సర్వజ్ఞత్వంతో ఏర్పడే వేదాంత ఉద్రిక్తతను అనువాదకుడు మౌనంగా తొలగించకుండా మూలభాషలో ఉన్నట్లే నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పొడవైన హెబ్రీ వాక్యాన్ని సహజమైన తెలుగు ప్రవాహం కోసం రెండు వాక్యాలుగా విభజించినా, ఉద్దేశార్థక సంబంధాన్ని ‘ఆయన అలా చేశాడు’ ద్వారా స్పష్టంగా నిలిపాం. ద్వితీయ పురుష ఏకవచనాన్ని ‘నీవు/నీ/నిన్ను’ రూపాల్లో ఏకరీతిగా ఉంచాం.
