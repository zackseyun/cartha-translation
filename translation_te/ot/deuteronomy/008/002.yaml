revisions:
- from: నీ దేవుడైన యాహ్వే ఈ నలభై సంవత్సరాలు అరణ్యంలో నిన్ను నడిపించిన మార్గమంతటినీ జ్ఞాపకం చేసుకో. నిన్ను అణకువపరచడానికి, నిన్ను పరీక్షించడానికి, నీవు ఆయన ఆజ్ఞలను పాటిస్తావో లేదో, నీ హృదయంలో ఏముందో తెలుసుకోవడానికి[a] ఆయన అలా చేశాడు.
  to: నీ దేవుడైన యాహ్వే ఈ నలభై సంవత్సరాలుగా అరణ్యంలో నిన్ను నడిపించిన మార్గమంతటినీ జ్ఞాపకం చేసుకో; నిన్ను అణకువపరచడానికి, నిన్ను పరీక్షించడానికి, నీ హృదయంలో ఏముందో—నీవు ఆయన ఆజ్ఞలను పాటిస్తావో లేదో—తెలుసుకోవడానికి ఆయన నిన్ను నడిపించాడు.[a]
