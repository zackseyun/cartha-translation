id: DEU.8.16
reference: Deuteronomy 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: te
  text: నీ పూర్వీకులు ఎరుగని మన్నాను అరణ్యంలో నీకు తినిపించినవాడు ఆయనే; నిన్ను అణకువపరచడానికి, నిన్ను పరీక్షించడానికి, చివరికి నీకు మేలు చేయడానికి ఆయన అలా చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: నీకు తినిపించినవాడు
  rationale: అכל హిఫిల్ కృదంతంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ముందటి వచనంలో దేవుని గురించిన వర్ణనను కొనసాగిస్తుంది.
- source_word: מָן
  choice: మన్నా
  rationale: అరణ్య ప్రయాణంలో దేవుడు ఇచ్చిన ఆహారానికి తెలుగులో స్థిరపడిన బైబిలు పదం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: మִדְבָּר సూచించే జనావాసం తక్కువైన ఎడారి/అరణ్య ప్రాంతాన్ని బైబిలు సందర్భానికి తగిన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: నీ పూర్వీకులు ఎరుగని
  rationale: ఇక్కడ మన్నా వారికి ముందుగా పరిచయం లేనిదని తెలిపే ఉపవాక్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పూర్వీకులు
  rationale: ఆబోత్ అక్షరార్థంగా ‘తండ్రులు’ అయినా, ఇక్కడ గత తరాల వారిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పూర్వీకులు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: నిన్ను అణకువపరచడానికి
  rationale: ענה పియేల్‌లోని అవమానపరచడం/బాధించడం/అణకువ చేయడం అనే భావ పరిధిలో, ద్వితీయోపదేశకాండము 8 సందర్భంలోని శిక్షణాత్మక లక్ష్యాన్ని తెలియజేస్తూ కష్టతను తొలగించదు.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: నిన్ను పరీక్షించడానికి
  rationale: נסה యొక్క పరీక్షించడం లేదా రుజువు చేయడం అనే భావాన్ని ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: לְהֵיטִבְךָ
  choice: నీకు మేలు చేయడానికి
  rationale: יטב హిఫిల్‌లోని ఒకరికి మంచి చేయడం లేదా మేలు కలిగించడం అనే భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: בְּאַחֲרִיתֶךָ
  choice: చివరికి
  rationale: אַחֲרִית ఇక్కడ అంతిమ ఫలితం లేదా తరువాతి పరిణామాన్ని సూచిస్తుంది; ‘చివరికి’ సహజంగా ఉండి ఉద్దేశించిన శ్రేయస్కర ఫలితాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: అరణ్యంలోని అణకువ మరియు పరీక్ష యొక్క ఉద్దేశం
  choice: దేవుని చర్యలు కఠినమైన అణకువను, పరీక్షను కలిగించినప్పటికీ చివరికి ఇశ్రాయేలుకు మేలు చేయాలనే ఉద్దేశంతో ఉన్నట్లు వచనం చెబుతుంది.
  alternative: వాటిని కేవలం శిక్షాత్మక చర్యలుగా అర్థం చేసుకోవడం.
  rationale: రెండు ఉద్దేశార్థక పదబంధాలు לְהֵיטִיבְךָ בְּאַחֲרִיתֶךָ అనే మేలుచేసే లక్ష్యంతో ముగుస్తాయి. అందువల్ల అనువాదం కఠినతను గానీ, శ్రేయస్కర ఉద్దేశాన్ని గానీ తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన వాక్య నిర్మాణం. సందర్భస్పష్టత కోసం చివరి ఉపవాక్యంలో ‘ఆయన అలా చేశాడు’ చేర్చబడింది; ఇది హీబ్రూ ఉద్దేశ నిర్మాణాన్ని తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది.
