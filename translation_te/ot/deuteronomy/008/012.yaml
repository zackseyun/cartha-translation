  edition: WLC
  text: פֶּן תֹּאכַ֖ל וְ/שָׂבָ֑עְתָּ וּ/בָתִּ֥ים טוֹבִ֛ים תִּבְנֶ֖ה וְ/יָשָֽׁבְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/012.yaml
  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: te
  text: నీవు తిని తృప్తి చెంది[a], మంచి ఇళ్లు కట్టుకొని వాటిలో నివసించినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కడుపు నిండా తిని.’ హీబ్రూ క్రియ శారీరకంగా నిండిపోవడాన్నీ పూర్తిగా తృప్తి చెందడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: ఈ ఖండంలో విడిగా అనువదించలేదు
  rationale: פֶּן ప్రారంభించే హెచ్చరిక 11–14 వచనాలపై విస్తరిస్తుంది. 12వ వచనం మధ్యలోనే ఉన్నందున తెలుగులో ‘అలా జరగకుండా’ అని ఇక్కడ చేరిస్తే వాక్యం అసహజంగా లేదా అపూర్ణంగా ఉంటుంది; హెచ్చరిక భావం అనుసంధాన సందర్భంలో వ్యక్తం కావాలి.
- source_word: תֹּאכַל
  choice: నీవు తిని
  rationale: భవిష్యత్ హెచ్చరికలో సంభవించే చర్యల క్రమాన్ని తెలుగులో సహజమైన అసమాపక క్రియతో చూపిస్తుంది.
- source_word: וְשָׂבָעְתָּ
  choice: తృప్తి చెంది
  rationale: שׂבע శారీరకంగా కడుపు నిండడాన్నీ పూర్తిగా తృప్తి చెందడాన్నీ సూచించగలదు. ‘తృప్తి చెంది’ సహజంగా ఉండి విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וּבָתִּים טוֹבִים
  choice: మంచి ఇళ్లు
  rationale: טוֹבִים యొక్క సరళమైన అర్థాన్ని నిలుపుతూ, సందర్భంలోని సౌభాగ్యాన్ని అతిగా ‘విలాసవంతమైన’ అని విస్తరించదు.
- source_word: תִּבְנֶה
  choice: కట్టుకొని
  rationale: తినడం, తృప్తి చెందడం, ఇళ్లు కట్టడం, వాటిలో నివసించడం అనే పరస్పర అనుసంధాన చర్యల క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיָשָׁבְתָּ
  choice: వాటిలో నివసించినప్పుడు
  rationale: ישׁב ఇక్కడ ఇళ్లలో ఉండడం లేదా నివసించడాన్ని సూచిస్తుంది. ‘వాటిలో’ అనేది హీబ్రూలో ప్రత్యక్షంగా లేకపోయినా, ముందున్న ‘ఇళ్లు’ నుంచి స్పష్టంగా గ్రహించబడే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: פֶּן ద్వారా మొదలయ్యే హెచ్చరిక యొక్క పరిధి
  choice: 12వ వచనాన్ని తరువాతి హెచ్చరికకు దారితీసే కాలసూచక ఉపవాక్యంగా ఉంచడం
  alternative: ‘జాగ్రత్త, లేకపోతే’ లేదా ‘అలా జరగకుండా’ అని ఈ వచనంలోనే చేర్చడం
  rationale: మూల హీబ్రూలో హెచ్చరిక 11వ వచనంలోని ఆజ్ఞతో అనుసంధానమై 12–14 వచనాల చర్యల క్రమం మీదుగా సాగుతుంది. వచనాన్ని ఒంటరిగా పూర్తి హెచ్చరికగా మార్చకుండా దాని వాక్యనిర్మాణ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వచనం స్వతంత్ర సంపూర్ణ వాక్యం కాకుండా తదుపరి హెచ్చరికకు దారితీసే ఉపవాక్యంగా ఉన్న మూల నిర్మాణాన్ని చివరి కామాతో నిలుపుకుంది.
