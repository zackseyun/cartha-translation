id: DEU.8.17
reference: Deuteronomy 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: te
  text: నీ హృదయంలో, “నా శక్తి, నా చేతి బలం నాకు ఈ సంపదను సమకూర్చాయి” అని నీవు అనుకుంటావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సమృద్ధిని.” హెబ్రీ పదం חַיִל సందర్భాన్ని బట్టి సంపద, వనరులు, బలం లేదా సామర్థ్యాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: అప్పుడు ... అనుకోవచ్చు
  rationale: సంయోజకంతో కూడిన Qal perfect రూపం ఈ హెచ్చరిక సందర్భంలో సంభవించగల భవిష్యత్ అంతరంగ స్పందనను సూచిస్తుంది. తెలుగులో ‘అనుకోవచ్చు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בִּלְבָבֶךָ
  choice: నీ హృదయంలో
  rationale: ఇది అంతరంగ ఆలోచన లేదా తనలో తాను చెప్పుకోవడాన్ని సూచించే హెబ్రీయ ఇడియమ్. మూలంలోని హృదయ రూపకాన్ని నిలుపుతుంది.
- source_word: כֹּחִי
  choice: నా శక్తి
  rationale: כֹּחַ వ్యక్తిగత శక్తి, సామర్థ్యం లేదా బలాన్ని సూచిస్తుంది. తరువాతి ‘చేతి బలం’తో సహజంగా జతకడుతుంది.
- source_word: וְעֹצֶם יָדִי
  choice: నా చేతి బలం
  rationale: వ్యక్తి సొంత సామర్థ్యాన్ని తెలియజేసే హెబ్రీయ శరీర రూపకాన్ని యథాతథంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עָשָׂה לִי
  choice: నాకు ... సంపాదించిపెట్టాయి
  rationale: అక్షరార్థంగా ‘నాకోసం చేసింది’ అయినా, సంపద సందర్భంలో ఉత్పాదించడం లేదా సంపాదించడం భావం ఉంది. సంయుక్త కర్తకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: הַחַיִל הַזֶּה
  choice: ఈ సంపదను
  rationale: ద్వితీయోపదేశకాండము 8లోని భౌతిక సమృద్ధి సందర్భంలో חַיִל కు ‘సంపద’ ప్రధాన భావం; నిర్దేశక సర్వనామాన్ని ‘ఈ’గా అనువదించింది.
theological_decisions:
- issue: నిబంధన సంబంధ హెచ్చరిక సందర్భంలో חַיִל భావం
  choice: సంపద
  alternative: సమృద్ధి; బలం; వనరులు
  rationale: చుట్టుపక్కల వచనాలు ఆస్తి, పశుసంపద, వెండి, బంగారం పెరగడాన్ని ప్రస్తావిస్తున్నందున ‘సంపద’ తక్షణ సందర్భానికి అత్యంత తగినది. అయినా ఈ పదపు విస్తృత భావపరిధిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. అంతరంగ స్వయంభాషణను ‘నీ హృదయంలో ... అనుకోవచ్చు’గా వ్యక్తం చేసి, ‘నా చేతి బలం’ అనే మూల రూపకాన్ని నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
