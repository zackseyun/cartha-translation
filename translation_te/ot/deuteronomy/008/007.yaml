source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: te
  text: ఎందుకంటే నీ దేవుడైన యాహ్వే నిన్ను మంచి దేశంలోకి తీసుకువస్తున్నాడు—అది జల ప్రవాహాలు[a], ఊటలు, అగాధ జలాలు[b] లోయలోనూ కొండప్రాంతంలోనూ[c] వెలువడే దేశం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీటి వాగులు’ లేదా ‘జలమార్గాలు’; హీబ్రూ పదం ప్రవాహాలు, వాగులు, లేదా కాలానుగుణంగా నీరు పారే లోయలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘లోతైన జలాలు’; హీబ్రూ పదం భూగర్భ జలాలను లేదా జలాగాధాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మైదానంలోనూ పర్వతాలలోనూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధానార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని సహజమైన తెలుగు ఒడంబడిక ప్రయోగంలో నిలుపుతుంది.
- source_word: מְבִיאֲךָ
  choice: నిన్ను ... తీసుకువస్తున్నాడు
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు చర్యను సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל אֶרֶץ טוֹבָה
  choice: మంచి దేశంలోకి
  rationale: చలన భావాన్ని ‘లోకి’తోనూ, טוֹבָה అనే సాధారణ గుణవాచకాన్ని అదనపు వ్యాఖ్యానం లేకుండా ‘మంచి’తోనూ నిలుపుతుంది.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: నీటి ప్రవాహాలు ... ఉండే దేశం
  rationale: נַחֲלֵי అనేది వాగులు, ప్రవాహాలు లేదా కాలానుగుణ జలమార్గాలను సూచించగలదు; ప్రధాన పాఠంలో సహజంగా, విస్తృతార్థంతో ‘నీటి ప్రవాహాలు’ అని ఇచ్చింది.
- source_word: עֲיָנֹת
  choice: ఊటలు
  rationale: సహజంగా భూమినుండి వెలువడే నీటి మూలాలకు ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: וּתְהֹמֹת
  choice: అగాధ జలాలు
  rationale: భూగర్భ లేదా లోతైన జలాల భావాన్ని ‘అగాధాలు’ అనే అస్పష్ట రూపం కంటే తెలుగులో స్పష్టంగా ఉంచుతూ, ఖచ్చితమైన జలవిజ్ఞాన అర్థాన్ని నిర్ణయించదు.
- source_word: יֹצְאִים
  choice: ఉబికి ప్రవహించే
  rationale: నీరు మూలం నుంచి బయటకు వచ్చి ప్రవహించే చిత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּבִּקְעָה
  choice: లోయలలోనూ
  rationale: בִּקְעָה విస్తారమైన లోయ లేదా మైదానాన్ని సూచించగలదు; కొండప్రాంతంతో ఉన్న భౌగోళిక జతలో ‘లోయ’ సహజంగా సరిపోతుంది.
- source_word: וּבָהָר
  choice: కొండప్రాంతంలోనూ
  rationale: ఏకవచన రూపం సమూహార్థక ఎత్తైన భూభాగాన్ని సూచించగలదు; ‘కొండప్రాంతం’ ఆ భౌగోళిక భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని భౌగోళిక, జలసంబంధ అనిశ్చితిని పాదసూచికల్లో నిలిపాం. వాక్యంలోని రెండవ ‘దేశం’ను చివర ఉంచి తెలుగు వాక్యప్రవాహాన్ని సహజంగా చేశాం; మూలంలోని లోయ/కొండప్రాంత జతను నిలిపాం.
