- from: ఎందుకంటే నీ దేవుడైన యెహోవా నిన్ను మంచి దేశంలోకి తీసుకువస్తున్నాడు—అది నీటి ప్రవాహాలు,[a] ఊటలు, అగాధ జలాలు[b] లోయలలోనూ కొండప్రాంతంలోనూ ఉబికి ప్రవహించే దేశం.
