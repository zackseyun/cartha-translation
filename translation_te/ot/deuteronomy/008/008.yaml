translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘దేశం’ అనే పదపు పునరుక్తిని నిలిపాం. పాదటిప్పణి సూచికను యవల తర్వాత కాకుండా దాని అసలు సంబంధ పదమైన ‘తేనె’ తర్వాత ఉంచాలి; అందుకనుగుణంగా ప్రధాన పాఠాన్ని సవరించడం అవసరం.
