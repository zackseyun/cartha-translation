source:
  edition: WLC
  text: אֶ֤רֶץ חִטָּה֙ וּ/שְׂעֹרָ֔ה וְ/גֶ֥פֶן וּ/תְאֵנָ֖ה וְ/רִמּ֑וֹן אֶֽרֶץ זֵ֥ית שֶׁ֖מֶן וּ/דְבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/008.yaml
  text: a land of wheat and barley[a], of vines and fig trees and pomegranates, a land of olive oil and honey,
translation:
  language: te
  text: గోధుమలు, యవలు, ద్రాక్షతీగలు, అంజూరపు చెట్లు, దానిమ్మలు ఉన్న దేశం; ఆలివ్ నూనె, తేనె[a] ఉన్న దేశం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “తేనె” అని అనువదించిన హీబ్రూ పదం దేశపు పంటల సందర్భంలో ఖర్జూరపు పాకాన్ని కూడా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: పండే దేశం / సమృద్ధిగా ఉండే దేశం
  rationale: హీబ్రూ వాక్యంలో రెండుసార్లు వచ్చిన אֶרֶץ‌ను నిలుపుతూ, ఉత్పత్తుల జాబితాతో సహజమైన ఆధునిక తెలుగు సంబంధాన్ని కల్పిస్తుంది.
- source_word: חִטָּה
  choice: గోధుమలు
  rationale: ఈ ధాన్యానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: שְׂעֹרָה
  choice: యవలు
  rationale: బార్లీ ధాన్యానికి ప్రామాణిక తెలుగు పదం; గోధుమలతో జతగా మూలంలోని అర్థాన్ని ఇస్తుంది.
- source_word: גֶּפֶן
  choice: ద్రాక్షతీగలు
  rationale: ఏకవచన సమూహార్థక పదాన్ని పంటల జాబితాలో సహజమైన బహువచనంగా ఇచ్చి, అది ద్రాక్ష తీగ అని స్పష్టం చేస్తుంది.
- source_word: תְּאֵנָה
  choice: అంజూరపు చెట్లు
  rationale: మూలపదం సాధారణంగా పండుకంటే చెట్టునే సూచిస్తుంది; అందువల్ల వృక్షార్థాన్ని నిలుపుతుంది.
- source_word: רִמּוֹן
  choice: దానిమ్మలు
  rationale: పండు లేదా చెట్టును సూచించగల పదాన్ని పంటల జాబితాలో సహజంగా పండ్ల రూపంలో అందిస్తుంది.
- source_word: זֵית שֶׁמֶן
  choice: ఒలీవ నూనె
  rationale: అక్షరార్థంగా నూనెకు సంబంధించిన ఒలీవను సూచించే నిర్మాణం; తెలుగులో ఉద్దేశిత ఉత్పత్తిని సహజంగా తెలియజేసే రూపం.
- source_word: דְּבָשׁ
  choice: తేనె
  rationale: పదానికి సాధారణ అర్థం తేనె; అయితే దేశపు వ్యవసాయ ఉత్పత్తుల సందర్భంలో ఖర్జూరపు పాకం అనే సాధ్యతను పాదటిప్పణిలో నిలుపుతున్నాం.
