  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: te
  text: ఆయన నిన్ను దీనపరచాడు, నీకు ఆకలి కలిగించాడు, నీకూ నీ పూర్వీకులకూ తెలియని మన్నాను నీకు ఆహారంగా ఇచ్చాడు. మనిషి[b] కేవలం రొట్టెవల్లనే జీవించడు; యాహ్వే నోటి నుంచి వెలువడే ప్రతిదానివల్ల[a] మనిషి జీవిస్తాడని నీకు తెలియజేయడానికే ఆయన ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నోటి నుంచి వచ్చే ప్రతి మాటవల్ల.” హీబ్రూ వ్యక్తీకరణ అక్షరార్థంగా “నోటి నుంచి వెలువడే ప్రతిదీ” అని విస్తృతంగా ఉంది; ఈ సందర్భంలో “ప్రతి మాట” కూడా తగిన అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మనిషి” అనే పదం పురుషులను మాత్రమే కాక, సాధారణంగా మానవులందరినీ సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: నిన్ను దీనస్థితికి తెచ్చాడు
  rationale: పీయేల్ రూపం ‘బాధపరచడం/దీనపరచడం’ అనే పరిధిని కలిగి ఉంది. అరణ్యంలోని క్రమశిక్షణాత్మక అనుభవాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: וַיַּרְעִבֶךָ
  choice: నీకు ఆకలి కలిగించాడు
  rationale: హిఫీల్ కారణార్థక భావాన్ని స్పష్టంగా ఉంచి, దేవుని కార్యసాధక పాత్రను తగ్గించకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: మన్నాను నీకు ఆహారంగా ఇచ్చాడు
  rationale: ‘తినిపించాడు’ అనే కారణార్థక భావాన్ని సహజ తెలుగులో అందిస్తూ, అరణ్య ఆహారానికి స్థిరపడిన ‘మన్నా’ పేరును నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: నీకూ నీ పూర్వీకులకూ తెలియని
  rationale: ఇక్కడ ‘తెలుసుకోవడం’ అంటే ముందుగా పరిచయం లేదా అనుభవం ఉండడం. సంక్షిప్త సమాంతర నిర్మాణం ఇరువర్గాల అపరిచితత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: నీకు తెలియజేయడానికే
  rationale: ידע హిఫీల్‌లోని ‘తెలిసేలా చేయడం’ అనే బోధనాత్మక కారణార్థాన్ని కాపాడుతుంది.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: ఇక్కడ ఏ ఒక్క పురుషుణ్ణి కాక మానవజాతిని ప్రతినిధిగా సూచించే సాధారణ ఏకవచనం. ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: కేవలం రొట్టెవల్లనే
  rationale: ‘రొట్టె మాత్రమే’ అనే పరిమితిని, తదుపరి వ్యత్యాసాన్ని సహజంగా మరియు స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל מוֹצָא פִי יְהוָה
  choice: యాహ్వే నోటి నుంచి వెలువడే ప్రతిదానివల్ల
  rationale: מוֹצָא అక్షరార్థంగా ‘వెలువడేది’ అని సూచిస్తుంది. దానిని కేవలం ‘మాట’గా ముందుగానే పరిమితం చేయకుండా హీబ్రూ వ్యక్తీకరణ విస్తృతిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: మనిషి ... జీవించడు; ... మనిషి జీవిస్తాడు
  rationale: హీబ్రూలోని పునరుక్తిని, వాక్య సమతూకాన్ని కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ప్రతినిధి అర్థంలో వాడిన הָאָדָם అనువాదం
  choice: మనిషి
  alternative: మానవజాతి / ప్రజలు
  rationale: ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుతూ, ఇది పురుషులకు మాత్రమే పరిమితం కాదని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: מוֹצָא פִי יְהוָה యొక్క భావ పరిధి
  choice: యాహ్వే నోటి నుంచి వెలువడే ప్రతిదీ
  alternative: యాహ్వే నోటి నుంచి వచ్చే ప్రతి మాట
  rationale: మూలపదం ‘వెలువడేది’ అనే విస్తృత భావాన్ని అనుమతిస్తుంది. ‘మాట’ సందర్భానికి తగిన అర్థమైనప్పటికీ, ప్రధాన పాఠ్యంలో దానినే ఏకైక అర్థంగా నిర్ణయించలేదు.
- issue: దైవనామం יְהוָה
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనశైలి వాడబడింది. ‘పితరులు’ వంటి కొంత పాత మతపర పదానికి బదులుగా ‘పూర్వీకులు’ వాడాం. మూలంలోని దైవకార్య క్రమం, కారణార్థకత, ‘మనిషి’ అనే పునరుక్తి, అలాగే מוֹצָא యొక్క ఉద్దేశపూర్వక విస్తృతి కాపాడబడ్డాయి.
