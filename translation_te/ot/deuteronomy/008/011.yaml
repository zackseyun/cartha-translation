id: DEU.8.11
reference: Deuteronomy 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: te
  text: నీ దేవుడైన యెహోవాను మరచిపోకుండా జాగ్రత్తపడు; ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలను, న్యాయవిధులను, కట్టడలను పాటించకపోవడం ద్వారా అలా జరగనివ్వకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: నిఫాల్ ఆజ్ఞార్థక హెచ్చరికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: פֶּן תִּשְׁכַּח
  choice: మరచిపోకుండా
  rationale: నివారించవలసిన ప్రమాదాన్ని సూచించే హీబ్రూ హెచ్చరిక నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచి, రెండవ పురుష ఏకవచన సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: పాటించకుండా
  rationale: యెహోవాను మరచిపోవడం ఆయన విధులను పాటించకపోవడంలో వ్యక్తమవుతుందనే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాత్మక ఆజ్ఞల భావానికి సూటిగా సరిపోతుంది.
- source_word: מִשְׁפָּטָיו
  choice: న్యాయవిధులను
  rationale: మִשְׁפָּט యొక్క న్యాయపరమైన, నియమపరమైన భావాలను రెండింటినీ తెలియజేస్తుంది.
- source_word: חֻקֹּתָיו
  choice: కట్టడలను
  rationale: నిర్దేశించబడిన స్థిర నియమాలు లేదా శాసనాలు అనే నిబంధనాత్మక భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: మోషే మాటల వర్తమాన, తక్షణ బలాన్ని మరియు ‘ఈ రోజు’ అనే నిబంధనాత్మక అత్యవసరతను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపాన్ని వాడుతూ, మూలంలోని దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: ఆజ్ఞలను పాటించకపోవడం మరియు యెహోవాను మరచిపోవడం మధ్య సంబంధం
  choice: ‘పాటించకుండా ... మరచిపోకుండా’ అనే విధాన/వ్యక్తీకరణ సంబంధం
  alternative: రెండు వేర్వేరు ప్రమాదాలుగా అనువదించడం
  rationale: לְבִלְתִּי שְׁמֹר నిర్మాణం మరచిపోవడం ఆజ్ఞలను పాటించకపోవడంలో వ్యక్తమవుతుందని సూచిస్తుంది; కారణార్థాన్ని అతిగా నిర్ధారించకుండా ఈ సంబంధాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ఏకవచన సంబోధన. న్యాయపరమైన మూడు హీబ్రూ పదాల భేదాన్ని ‘ఆజ్ఞలు, న్యాయవిధులు, కట్టడలు’గా నిలుపుకుంది.
