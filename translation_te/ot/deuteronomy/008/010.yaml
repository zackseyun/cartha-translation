source:
  edition: WLC
  text: וְ/אָכַלְתָּ֖ וְ/שָׂבָ֑עְתָּ וּ/בֵֽרַכְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל הָ/אָ֥רֶץ הַ/טֹּבָ֖ה אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: te
  text: నీవు తిని తృప్తి పొందిన తరువాత, నీకు ఇచ్చిన ఆ మంచి దేశాన్ని బట్టి నీ దేవుడైన యాహ్వేను స్తుతించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, ‘నీ దేవుడైన యాహ్వేను దీవించాలి’ అని ఉంది. ఇక్కడ ‘దీవించు’ అనేది కృతజ్ఞతతో ఆయనను స్తుతించడం, ఆయన గురించి మేలుగా పలకడం అనే బైబిలు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: నీవు తిని తృప్తి పొందినప్పుడు
  rationale: ఈ సందర్భంలో వరుసగా ఉన్న క్రియలు భోజనం చేసి తృప్తి పొందిన తరువాత చేయవలసిన ప్రతిస్పందనను సూచిస్తున్నాయి. తెలుగులో కాలసంబంధాన్ని సహజంగా వ్యక్తం చేయడానికి ‘తిన్నప్పుడు’ నిర్మాణం ఉపయోగించబడింది; שׂבע యొక్క కడుపునిండుట/సంతృప్తి భావాన్ని ‘తృప్తి పొందు’ అందిస్తుంది.
- source_word: וּבֵרַכְתָּ
  choice: స్తుతించాలి
  rationale: దేవుడు కర్మగా ఉన్నప్పుడు ברך అంటే ఆయన గురించి మేలుగా పలకడం, కృతజ్ఞతతో స్తుతించడం. తెలుగులో ‘దేవుణ్ణి ఆశీర్వదించు’ అపార్థానికి దారితీయగలదు కాబట్టి సహజమైన ప్రధాన పాఠంలో ‘స్తుతించాలి’ అని ఇచ్చి, మూలభాషలోని ‘దీవించు’ నుడికారాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠన సంప్రదాయంలో విస్తృతంగా గుర్తించబడే విధంగా దైవనామాన్ని శీర్షికతో భర్తీ చేయకుండా వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధప్రత్యయాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: עַל הָאָרֶץ הַטֹּבָה
  choice: ఆ మంచి దేశాన్ని బట్టి
  rationale: עַל ఇక్కడ స్తుతికి కారణాన్ని సూచిస్తుంది; ‘బట్టి’ ఆ కారణార్థాన్ని సహజంగా తెలియజేస్తుంది. ‘మంచి దేశం’ నిబంధనలోని దేశ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: నీకు ఇచ్చిన
  rationale: కర్త సందర్భం వల్ల స్పష్టంగా యెహోవాయే; తెలుగు సంబంధక్రియా నిర్మాణంలో కర్తను మళ్లీ చేర్చనవసరం లేదు. పూర్తయిన దానపు భావం ‘ఇచ్చిన’లో నిలుస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన దైవనామ రూపం ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: దేవుని ఉద్దేశించి ברך అనే క్రియ
  choice: ప్రధాన పాఠంలో ‘స్తుతించాలి’; పాదటిప్పణిలో ‘దీవించాలి’ అనే మూల నుడికారం
  alternative: దీవించాలి; కృతజ్ఞతలు చెల్లించాలి
  rationale: హీబ్రూ క్రియలో స్తుతి, కృతజ్ఞత రెండూ ఇమిడి ఉన్నాయి. తెలుగు ‘దేవుణ్ణి దీవించు’ అనేది సాధారణ పాఠకునికి దేవునికి మేలు కలిగించడమనే అపార్థం ఇవ్వవచ్చు. అందువల్ల అర్థాన్ని సహజంగా తెలిపే ‘స్తుతించాలి’ని ప్రధాన పాఠంలో ఉంచి, అసలు నుడికారాన్ని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రెండవ పురుష ఏకవచన సంబోధనను నిలుపుతూ గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ఆజ్ఞాత్మక/నిబంధనబద్ధ స్వరాన్ని ‘స్తుతించాలి’ ద్వారా వ్యక్తం చేశాం.
