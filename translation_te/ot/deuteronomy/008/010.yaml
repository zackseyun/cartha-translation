- from: నీవు తిని తృప్తి పొందినప్పుడు, నీకు ఇచ్చిన ఆ మంచి దేశాన్ని బట్టి నీ దేవుడైన యెహోవాను స్తుతించాలి.[a]
  to: నీవు తిని తృప్తి పొందిన తరువాత, నీకు ఇచ్చిన ఆ మంచి దేశాన్ని బట్టి నీ దేవుడైన యాహ్వేను స్తుతించాలి.[a]
