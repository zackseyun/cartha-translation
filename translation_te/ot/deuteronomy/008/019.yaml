id: DEU.8.19
reference: Deuteronomy 8:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: te
  text: మీరు మీ దేవుడైన యాహ్వేను నిజంగానే మరచిపోయి[a], ఇతర దేవుళ్లను అనుసరించి, వాటిని సేవించి, వాటికి సాగిలపడితే, మీరు నిశ్చయంగా నశిస్తారని ఈ రోజు మీకు వ్యతిరేకంగా నేను సాక్ష్యమిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘మరచిపోతూ మరచిపోతే’—ఇది ‘నిజంగానే’ లేదా ‘తప్పకుండా మరచిపోతే’ అనే ఉద్ఘాటనను తెలిపే రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: మీరు ... అయితే
  rationale: షరతుతో కూడిన హెచ్చరికను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; హీబ్రూ వాక్యారంభంలోని సంధాన భావం సందర్భంలో తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: నిజంగా మరచిపోయి
  rationale: క్రియతో కూడిన infinitive absolute చర్యను బలపరుస్తుంది. ‘నిజంగా’ ఆ ఉద్ఘాటనను నిలుపుతుంది; ‘పూర్తిగా’ అని అనువదిస్తే మూలంలో లేని పరిమాణ భావం చేరవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన సంప్రదాయ లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుడైన
  rationale: ఏకవచనంగా సంబోధించబడుతున్న ఇశ్రాయేలుతోనున్న నిబంధన సంబంధాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: అనుసరించి
  rationale: వేరే దేవుళ్ల పట్ల విధేయతను సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: אֲחֵרִים అనే పదంలోని నేరమైన ‘ఇతర’ భావాన్ని నిలుపుతుంది; ‘అన్య’ లేదా ‘విదేశీ’ అని అనవసరంగా వ్యాఖ్యానించదు.
- source_word: וַעֲבַדְתָּם
  choice: వాటిని సేవించి
  rationale: עבד యొక్క ‘సేవించు’ భావాన్ని నిలిపి, తరువాతి సాగిలపడే క్రియతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: వాటికి సాగిలపడితే
  rationale: శరీరాన్ని వంచి భక్తి లేదా విధేయత చూపే క్రియ యొక్క భౌతిక, ఆరాధనా భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: ఈ రోజు మీకు వ్యతిరేకంగా నేను సాక్ష్యమిస్తున్నాను
  rationale: న్యాయపరమైన సాక్ష్య భావాన్నీ, בָכֶם లోని ప్రతికూల దిశనూ కాపాడుతుంది; కేవలం ‘హెచ్చరిస్తున్నాను’ అని బలహీనపరచదు.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: మీరు నిశ్చయంగా నశిస్తారని
  rationale: infinitive absolute మరియు finite verb కలయికలోని బలమైన నిశ్చయాన్ని ‘నిశ్చయంగా’ తెలియజేస్తుంది; క్రియను అనవసరంగా కర్మణి రూపంలో ‘నాశనం చేయబడతారు’గా మార్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించడానికి దగ్గరైన ప్రత్యామ్నాయం.
- issue: మరణం లేదా వినాశం యొక్క కర్త
  choice: నశిస్తారు
  alternative: నాశనం చేయబడతారు
  rationale: אָבַד ఇక్కడ కలిగే ఫలితాన్ని సూచిస్తుంది; దానిని కర్మణి రూపంలో మార్చి నిర్దిష్ట కర్తను ముందుకు తేవకుండా మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ఏకవచన సంబోధన తెలుగులో గౌరవార్థక ‘మీరు’తో వ్యక్తమైంది. దేవుళ్లకు సూచనగా తెలుగు వ్యాకరణానికి సహజమైన ‘వాటిని/వాటికి’ వాడబడింది. అడుగుసూచిక గుర్తు [a] సంబంధిత వాక్యభాగం తర్వాత ప్రధాన పాఠ్యంలో ఉంచబడింది.
