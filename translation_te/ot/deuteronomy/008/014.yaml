id: DEU.8.14
reference: Deuteronomy 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: te
  text: అప్పుడు నీ హృదయం గర్వంతో ఉప్పొంగి[a], ఐగుప్తు దేశం నుండి, దాసుల గృహం నుండి నిన్ను బయటకు తీసుకొచ్చిన నీ దేవుడైన యాహ్వేను నీవు మరచిపోతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ హృదయం ఉన్నతమై.” సందర్భంలో ఇది గర్వాన్ని సూచిస్తుంది.
    reason: హీబ్రూ రూపకంలోని ‘హృదయం ఉన్నతమగుట’ అనే భావాన్ని, సందర్భంలో దాని గర్వార్థాన్ని స్పష్టంగా తెలియజేయడానికి.
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: నీ హృదయం గర్వంతో ఉప్పొంగి
  rationale: రום అనే క్రియలోని ‘పైకెత్తబడడం’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, సందర్భంలో ఉద్దేశించిన అహంకార భావాన్ని ‘గర్వంతో’ స్పష్టం చేస్తుంది.
- source_word: וְשָׁכַחְתָּ
  choice: నీవు మరచిపోతావు
  rationale: చుట్టుపక్కల ఉన్న షరతు–ఫలిత క్రమంలో ఈ qatal రూపం హెచ్చరిక ఫలితాన్ని సూచిస్తుంది; తెలుగు భవిష్యత్ రూపం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఉంచి, אֱלֹהֶיךָ లోని ‘నీ దేవుడు’ అనే నిబంధనాత్మక సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הַמּוֹצִיאֲךָ
  choice: నిన్ను బయటకు తీసుకొచ్చిన
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న participle దేవుణ్ణి ఆయన విమోచన కార్యం ద్వారా గుర్తిస్తుంది; సంబంధవాచక తెలుగు రూపం సహజంగా ఉండి నిర్గమన భావాన్ని కాపాడుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: హీబ్రూలోని పూర్తి పదబంధాన్ని, దాని గంభీరమైన నిర్గమన సూత్రప్రయోగాన్ని నిలుపుతుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: దాసుల గృహం నుండి
  rationale: עֲבָדִים అనే బహువచన నామవాచకంలోని స్పష్టమైన మానవ స్థితిని అమూర్తమైన ‘దాసత్వం’గా మార్చకుండా, హీబ్రూ రూపాన్ని తెలుగులో సన్నిహితంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఉంచాం.
- issue: מִבֵּית עֲבָדִים యొక్క concrete/abstract భావం
  choice: దాసుల గృహం నుండి
  alternative: దాసత్వపు గృహం నుండి
  rationale: హీబ్రూ బహువచనంలోని ‘దాసులు’ అనే concrete భావాన్ని నిలుపుతూ, నిర్గమన నేపథ్యంలోని బానిస స్థితిని మృదువుగా చేయకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మగ్రంథోచిత గౌరవభరిత శైలితో. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం; వాక్యాంతంలోని హెచ్చరిక ఫలితాన్ని సహజమైన భవిష్యత్ రూపంలో ఇచ్చాం.
