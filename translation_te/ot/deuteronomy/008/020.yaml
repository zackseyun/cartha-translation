  text: כַּ/גּוֹיִ֗ם אֲשֶׁ֤ר יְהוָה֙ מַאֲבִ֣יד מִ/פְּנֵי/כֶ֔ם כֵּ֖ן תֹאבֵד֑וּ/ן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: te
  text: యాహ్వే మీ ఎదుటనుండి నాశనం చేస్తున్న ఆ జనములవలెనే, మీరూ అలాగే నశించిపోతారు; ఎందుకంటే మీరు మీ దేవుడైన యాహ్వే స్వరాన్ని వినరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దేవుడైన యాహ్వే మాటకు లోబడరు.” హీబ్రూ నుడికారం అక్షరార్థంగా “యాహ్వే స్వరాన్ని వినడం” అని ఉండి, తరచుగా విధేయత చూపడం అనే భావాన్ని కూడా కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: జనాలవలెనే
  rationale: כְּ సూచించే పోలికను ‘వలెనే’ స్పష్టంగా తెలియజేస్తుంది; ఇక్కడ גּוֹיִם వాగ్దాన దేశంలోని ఇతర జనాలను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: מַאֲבִיד
  choice: నాశనం చేస్తున్న
  rationale: אבד హిఫీల్ కృదంతంలోని కారణార్థక భావాన్నీ, సందర్భంలోని కొనసాగుతున్న లేదా సమీప చర్యనూ నిలుపుతుంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుట నుండి
  rationale: హీబ్రూ పదబంధంలోని ‘మీ సమక్షం నుండి తొలగించడం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֵּן תֹאבֵדוּן
  choice: మీరూ నశించిపోతారు
  rationale: כֵּן ప్రారంభ పోలికకు ప్రతిస్పందనగా ‘అలాగే’ అనే భావాన్ని ఇస్తుంది; אבד యొక్క అకర్మక రూపాన్ని ‘నశించిపోతారు’ నిలుపుతుంది.
- source_word: עֵקֶב
  choice: ఎందుకంటే
  rationale: తీర్పుకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: స్వరాన్ని వినరు
  rationale: ‘స్వరాన్ని వినడం’ అనే హీబ్రూ నిబంధనాత్మక నుడికారాన్ని నిలుపుతూ, దానిలో అంతర్లీనంగా ఉన్న విధేయత భావాన్ని పాదసూచికలో తెలియజేస్తుంది. అసంపూర్ణ క్రియ యొక్క హెచ్చరికాత్మక భావాన్ని తెలుగులో వర్తమాన/భవిష్య రూపమైన ‘వినరు’తో ఉంచాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: బహువచన ప్రత్యయాన్ని ‘మీ’తో, యాహ్వేను సూచించే ఏకవచన నామాన్ని ‘దేవుడు’తో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవ నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం నిబంధన నామాన్ని కాపాడుతుంది.
- issue: שׁמע בקולను ‘విధేయత చూపు’గా భావానువాదం చేయాలా, ‘స్వరాన్ని విను’గా ఉంచాలా
  choice: స్వరాన్ని వినరు
  alternative: మాటకు లోబడరు
  rationale: ఈ హీబ్రూ నుడికారంలో వినడం, విధేయత చూపడం రెండూ ఉన్నాయి. ప్రధాన పాఠంలో రూపకాన్ని నిలిపి, దాని విధేయత భావాన్ని పాదసూచికలో ఇవ్వడం అసలు భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. ‘జనాలవలెనే—మీరూ’ అనే నిర్మాణం మూలంలోని పోలికను సహజంగా పునరుత్పత్తి చేస్తుంది; అర్థాన్ని అతిగా నిర్ధారించకుండా ‘స్వరాన్ని వినరు’ అనే నిబంధనాత్మక నుడికారాన్ని నిలిపాం.
