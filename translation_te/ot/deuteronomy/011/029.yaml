id: DEU.11.29
reference: Deuteronomy 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నువ్వు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశంలోకి నిన్ను తీసుకువచ్చినప్పుడు, నువ్వు గెరిజీము కొండపై దీవెనను, ఏబాలు కొండపై శాపాన్ని ఉంచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గెరిజీము కొండపై దీవెనను, ఏబాలు కొండపై శాపాన్ని ప్రకటించాలి.” హీబ్రూ పదానికి అక్షరార్థంగా “ఇవ్వాలి/ఉంచాలి” అనే భావం ఉంది; ఆ ఆచారం ఎలా జరగాలో చుట్టుపక్కల వచనాలు వివరిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అప్పుడు / -నప్పుడు
  rationale: భవిష్యత్ పరిస్థితిని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజమైన కాలార్థక ఉపవాక్యంగా చూపిస్తుంది.
- source_word: יְבִיאֲךָ
  choice: నిన్ను తీసుకువచ్చినప్పుడు
  rationale: בוא హిఫీల్ రూపంలోని ‘లోనికి తీసుకురావడం’ అనే కారణార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ద్వితీయోపదేశకాండ సందర్భంలోని వాగ్దాన దేశాన్ని సూచించే אֶרֶץ పదానికి సహజమైన తెలుగు సమానం.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: నువ్వు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న
  rationale: సమీపిస్తున్న ప్రవేశాన్ని, ירשׁ పదంలోని స్వాధీనపరచుకునే భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְנָתַתָּה
  choice: ఉంచాలి
  rationale: נתן యొక్క మూలమైన ‘పెట్టు/ఉంచు’ భావాన్ని కాపాడుతూ, ఆచార చర్యను ‘ప్రకటించు’ అని ముందుగానే నిర్ధారించదు.
- source_word: הַבְּרָכָה
  choice: దీవెనను
  rationale: నిర్దిష్టమైన నిబంధన దీవెనను సూచిస్తుంది.
- source_word: עַל הַר גְּרִזִים
  choice: గెరిజీము కొండపై
  rationale: స్థలార్థక עַל‌ను సహజంగా చూపిస్తూ భౌగోళిక నామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: הַקְּלָלָה
  choice: శాపాన్ని
  rationale: దీవెనకు సమాంతరమైన నిబంధన శాపాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַל הַר עֵיבָל
  choice: ఏబాలు కొండపై
  rationale: మొదటి కొండ పేరుతో సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని వాడింది.
- issue: దీవెన, శాపాలకు సంబంధించిన నిబంధన చర్య
  choice: దీవెనను... శాపాన్ని ఉంచాలి
  alternative: దీవెనను... శాపాన్ని ప్రకటించాలి
  rationale: హీబ్రూ נתן పదం ‘ఇవ్వు/పెట్టు/ఉంచు’ అని చెబుతుంది. ఖచ్చితమైన ఆచార చర్యను ఈ వాక్యం మాత్రమే పూర్తిగా నిర్దేశించనందున, మూలంలోని స్పష్టత-అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మోషే ఇశ్రాయేలును సమూహంగా ఉద్దేశించినప్పటికీ హీబ్రూలోని రెండవ పురుష ఏకవచన రూపాన్ని ‘నీ/నువ్వు’తో నిలిపింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
