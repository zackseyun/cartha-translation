  edition: WLC
  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: te
  text: అవి యొర్దాను అవతల[a], సూర్యాస్తమయ మార్గానికి ఆవల[b], అరాబాలో నివసించే కనానీయుల దేశంలో, గిల్గాలుకు ఎదురుగా, మోరేలోని ఓకు చెట్ల[c] దగ్గర ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యొర్దాను ఆవలి వైపున.’ ఈ హీబ్రూ భౌగోళిక నుడికారం యొక్క నిర్దిష్ట భావం మాట్లాడేవారి దృష్టికోణంపై ఆధారపడి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సూర్యుడు అస్తమించే మార్గం వెనుక’; అంటే పడమటి వైపున.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మోరేలోని టెరెబింత్ చెట్లు’ లేదా ‘మోరేలోని పెద్ద చెట్లు.’ హీబ్రూ పదం ఓకు లేదా టెరెబింత్ వంటి పెద్ద చెట్టును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: అవి ... ఉన్నాయి కదా?
  rationale: ముందటి వచనంలోని రెండు పర్వతాలను సూచించే బహువచన సర్వనామాన్ని నిలుపుతూ, సమ్మతి ఆశించే హీబ్రూ అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: ఇది దృష్టికోణాన్ని పూర్తిగా నిర్దేశించని హీబ్రూ భౌగోళిక నుడికారాన్ని సహజంగా నిలుపుతుంది.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: సూర్యాస్తమయ మార్గానికి ఆవల
  rationale: אַחֲרֵי, דֶּרֶךְ, సూర్యుడు అస్తమించే దిశ అనే చిత్రణను నిలుపుతూ, కేవలం ‘పడమరగా’ అని అర్థాన్ని సంకుచితం చేయదు.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: కనానీయుల దేశంలో
  rationale: హీబ్రూ ఏకవచన జాతినామం సమూహార్థకమైనందున తెలుగులో సహజమైన బహువచన రూపం వాడబడింది.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: అరాబాలో నివసించే
  rationale: అరాబాను సాధారణ ‘మైదానం’గా మార్చకుండా భౌగోళిక నామంగా ఉంచి, సమూహార్థక కర్తకు సహజంగా అనుసంధానిస్తుంది.
- source_word: מוּל הַגִּלְגָּל
  choice: గిల్గాలుకు ఎదురుగా
  rationale: స్థానపరమైన ఎదురెదురు సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: మోరే సింధూర వృక్షాల దగ్గర
  rationale: אֵלוֹן సూచించే పెద్ద వృక్షానికి సాధ్యమైన తెలుగు వృక్షనామాన్ని ఎంచుకొని, వృక్షజాతి అనిశ్చితిని పాదసూచికలో నిలిపింది.
