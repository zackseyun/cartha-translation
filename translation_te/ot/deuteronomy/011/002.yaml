  source_fidelity: మూలంలోని అధ్యాహారమైన ‘మీ పిల్లలు కాదు’ అనే విరుద్ధతను సందర్భానుసారంగా ‘మీ పిల్లలను ఉద్దేశించి నేను మాట్లాడడం లేదు’ అని పూరించడం ఆమోదయోగ్యం. అయితే ప్రస్తుత పాదటిప్పణి [b] ఈ పూరణకు కాక వాక్యాంతంలో ఉంది; దానిని పూరించిన భాగానికే జతచేయాలి.
  naturalness: ‘మీ పిల్లలతో మాట్లాడడం లేదు’ కంటే ‘మీ పిల్లలను ఉద్దేశించి నేను మాట్లాడడం లేదు’ ఆధునిక ప్రామాణిక తెలుగులో ఉద్దేశిత శ్రోతల భావాన్ని మరింత స్పష్టంగా, సహజంగా తెలియజేస్తుంది. ‘ఆయన చాచిన బాహువు’ కూడా సహజమైన తెలుగు పదక్రమం.
