id: DEU.11.2
reference: Deuteronomy 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: te
  text: 'ఈ రోజు తెలుసుకోండి: నేను మీ పిల్లలను ఉద్దేశించి మాట్లాడడం లేదు[b]; వారు మీ దేవుడైన యెహోవా క్రమశిక్షణను—ఆయన గొప్పతనాన్ని, ఆయన బలమైన చెయ్యిని[a], ఆయన చాచిన బాహువును—తెలుసుకోలేదు, చూడలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన శక్తిమంతమైన చెయ్యి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం అధ్యాహారంగా ఉంది; అక్షరార్థంగా, ‘ఎందుకంటే తెలియని, చూడని మీ పిల్లలు కాదు…’ మోషే యెహోవా కార్యాలను స్వయంగా చూసినవారిని ఉద్దేశించి మాట్లాడుతున్నాడని సందర్భం సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: ఈ రోజు తెలుసుకోండి
  rationale: క్రియారూపం సందర్భంలో శ్రోతల దృష్టిని ఆకర్షించే ఆదేశాత్మక భావాన్ని కలిగిస్తుంది; ఆధునిక తెలుగులో ప్రత్యక్షంగా, సహజంగా ఉంది.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: నేను మీ పిల్లలతో మాట్లాడడం లేదు
  rationale: హీబ్రూ వాక్యం ఇక్కడ అధ్యాహారంగా ఉంది. మోషే ప్రత్యక్ష సాక్షులైన ప్రస్తుత శ్రోతలను వారి పిల్లలతో పోల్చుతున్న సందర్భార్థాన్ని ఈ పూరణ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מוּסַר
  choice: క్రమశిక్షణ
  rationale: ఈ పదం దిద్దుబాటు, శిక్షణ, బోధనల సమ్మిళిత భావాన్ని సూచించగలదు; కేవలం శిక్షగా పరిమితం చేయకుండా ఆ రూపకల్పనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: גָּדְלוֹ
  choice: ఆయన గొప్పతనం
  rationale: యెహోవా శక్తికార్యాలలో వెల్లడైన మహత్తును నేరుగా తెలియజేస్తుంది.
- source_word: יָדוֹ הַחֲזָקָה
  choice: ఆయన బలమైన చెయ్యి
  rationale: חזק అనే విశేషణాన్ని పారదర్శకంగా అనువదిస్తూ, దైవశక్తిని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: చాపబడిన ఆయన బాహువు
  rationale: క్రియాశీల దైవశక్తిని సూచించే స్థిరమైన హీబ్రూ రూపకాన్ని గంభీరమైన, అర్థవంతమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘మీ పిల్లలు కాదు’ అనే అధ్యాహార నిర్మాణం
  choice: ‘నేను మీ పిల్లలతో మాట్లాడడం లేదు’ అని సందర్భానుసారంగా పూరించడం
  alternative: ‘మీ పిల్లలు కాదు’ అని అధ్యాహారాన్ని అలాగే ఉంచడం
  rationale: మూలంలో నియంత్రక క్రియ లేకపోయినా, సందర్భం మోషే ఎవరిని ఉద్దేశించి మాట్లాడుతున్నాడో చూపుతుంది. ఈ పూరణ సిద్ధాంతపరమైన భావాన్ని చేర్చకుండా వాక్య సంబంధాన్ని తెలుగులో సహజంగా చేస్తుంది.
- issue: מוּסַר యొక్క భావపరిధి
  choice: క్రమశిక్షణ
  alternative: శిక్షణ / దిద్దుబాటు / శిక్ష
  rationale: ఇశ్రాయేలును తీర్చిదిద్దిన యెహోవా కార్యాలలో బోధనాత్మక, దిద్దుబాటు భావాలు రెండూ ఉండే అవకాశాన్ని ‘క్రమశిక్షణ’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని ఒడంబడిక సంబంధ గాంభీర్యం మరియు దైవశక్తి రూపకాలను నిలుపుతూ అనువదించాం. వాక్యం తదుపరి వచనాలకు కొనసాగుతున్నందున ముగింపులో దీర్ఘవిరామ భావాన్ని ఉంచాం.
