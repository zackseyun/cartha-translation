- from: 'ఈ రోజు తెలుసుకోండి: నేను మీ పిల్లలతో మాట్లాడడం లేదు; వారు మీ దేవుడైన యెహోవా క్రమశిక్షణను—ఆయన గొప్పతనాన్ని, ఆయన బలమైన చేతిని[a], చాపబడిన ఆయన బాహువును—తెలుసుకోలేదు, చూడలేదు.[b]'
