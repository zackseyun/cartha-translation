  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִשָּֽׁמְר֣וּ לָ/כֶ֔ם פֶּ֥ן יִפְתֶּ֖ה לְבַבְ/כֶ֑ם וְ/סַרְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: te
  text: మీ హృదయం మోసపోయి[a], మీరు దారి తప్పి ఇతర దేవుళ్లను సేవించి వారికి సాగిలపడతారేమో అని జాగ్రత్తగా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రలోభానికి లోనై.” హీబ్రూ క్రియకు ఒప్పించబడడం, ప్రలోభానికి లోనవడం లేదా మోసపోవడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: జాగ్రత్తపడండి
  rationale: నిఫాల్ ఆజ్ఞార్థక రూపం మరియు לָכֶם కలసి స్వీయ జాగ్రత్తను సూచిస్తున్నాయి. తెలుగులో ‘జాగ్రత్తపడండి’ సహజంగా ఉండి ఆ హెచ్చరిక బలాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: …కుండా
  rationale: פֶּן ప్రతికూల హెచ్చరికను ప్రవేశపెడుతుంది. వాక్యాంతంలోని ‘…కుండా జాగ్రత్తపడండి’ నిర్మాణం ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִפְתֶּה
  choice: మోసపోయి
  rationale: פתה అనే క్రియకు మోసపోవడం, ప్రలోభానికి లోనవడం లేదా ఒప్పించబడడం అనే భావవ్యాప్తి ఉంది. ‘మోసపోయి’ ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది; ‘ప్రలోభానికి లోనై’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְבַבְכֶם
  choice: మీ హృదయం
  rationale: לֵבָב సంకల్పం, అవగాహనతో కూడిన అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘హృదయం’ ఈ నిబంధన సందర్భంలో స్థిరమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: וְסַרְתֶּם
  choice: మీరు దారి తప్పి
  rationale: סור సరైన మార్గం లేదా నిబద్ధత నుండి తొలగిపోవడాన్ని సూచిస్తుంది. ‘దారి తప్పి’ ఆ రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַעֲבַדְתֶּם
  choice: సేవిస్తూ
  rationale: దేవతలకు సంబంధించి עבד మతపరమైన భక్తితో సేవించడాన్ని సూచిస్తుంది. తరువాతి క్రియ సాగిలపడే నిర్దిష్ట ఆరాధనా చర్యను వ్యక్తం చేస్తున్నందున ‘సేవిస్తూ’ అనే ప్రత్యేక భావాన్ని నిలిపాం.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: ఈ పదబంధానికి నేరుగా ‘ఇతర దేవుళ్లు’ అనే అర్థం వస్తుంది; ‘అన్య దేవుళ్లు’ కంటే ఇది ఆధునిక సాధారణ తెలుగులో మరింత సహజం.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: వారికి సాగిలపడడం
  rationale: השתחוה శరీరాన్ని వంచి లేదా సాష్టాంగపడి గౌరవించడం, సందర్భంలో ఆరాధించడం, అనే స్పష్టమైన చర్యను సూచిస్తుంది. ‘సాగిలపడడం’ ఆ దృశ్యరూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: విగ్రహారాధనకు దారితీసే అంతరంగ మోసం గురించిన హెచ్చరిక
  choice: హృదయం మోసపోవడం నుండి దారి తప్పడం, ఇతర దేవుళ్లను సేవించడం, వారికి సాగిలపడడం వరకు ఉన్న క్రమాన్ని నిలుపడం
  alternative: విగ్రహారాధనకు ప్రలోభపడవద్దనే ఒకే సంగ్రహ హెచ్చరికగా అనువదించడం
  rationale: హీబ్రూ పాఠం అంతరంగ స్థితి నుండి నిబంధన విశ్వాసభంగాన్ని తెలిపే చర్యల వరకు పురోగమిస్తుంది. ఆ క్రమాన్ని విడివిడిగా నిలుపడం వచనంలోని నైతిక, నిబంధనపరమైన ఉద్రిక్తతను సంక్షిప్త వ్యాఖ్యానంతో సమతలపరచకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన హెచ్చరిక శైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ప్రతికూల హెచ్చరికను తెలుగులో సహజమైన ‘…కుండా జాగ్రత్తపడండి’ నిర్మాణంలో ఇచ్చాం; అదే సమయంలో హృదయం, దారి తప్పడం, సేవించడం, సాగిలపడడం అనే మూలపాఠంలోని ముఖ్యమైన క్రమం మరియు చిత్రణను నిలిపాం.
