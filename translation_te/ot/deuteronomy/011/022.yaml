    rationale: ప్రేమించుట, నడుచుట, అంటిపెట్టుకొనుట అనేవి ఆజ్ఞను ఆచరించడంలోని విషయాన్ని తెలిపే అనంతక్రియలు. వాటిని నేరుగా సమాంతర అసమాపక క్రియలుగా ఇవ్వడం మరింత ఖచ్చితమైనది.
