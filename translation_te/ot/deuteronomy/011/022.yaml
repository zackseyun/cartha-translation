id: DEU.11.22
reference: Deuteronomy 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: te
  text: ఎందుకంటే, నేను ఆచరించమని మీకు ఆజ్ఞాపిస్తున్న ఈ ఆజ్ఞ మొత్తాన్ని[a] మీరు ఎంతో జాగ్రత్తగా పాటిస్తే[b]—మీ దేవుడైన యాహ్వేను ప్రేమిస్తూ, ఆయన మార్గాలన్నిటిలో నడుస్తూ, ఆయనను గట్టిగా పట్టుకొని ఉంటే[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘ఆజ్ఞ’ ఏకవచనంలో ఉంది; ఇది నిబంధనకు సంబంధించిన ఆజ్ఞాబాధ్యత మొత్తాన్ని సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ఒకే క్రియను బలపరిచే నిర్మాణం ఉంది; ‘మీరు తప్పకుండా పాటిస్తే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆయనను గట్టిగా హత్తుకొని ఉంటే’; భావం—ఆయనతో దృఢంగా అనుబంధమై ఉండడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ఎందుకంటే, … పాటిస్తే
  rationale: ముందరి వాక్యంతో ఉన్న కారణసంబంధాన్ని ‘ఎందుకంటే’ నిలుపుతుంది; షరతును తెలుగు వాక్యాంతంలోని ‘పాటిస్తే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: ఎంతో జాగ్రత్తగా పాటిస్తే
  rationale: అనంతక్రియతో కూడిన పరిమిత క్రియ హెబ్రీలో చర్యను బలపరుస్తుంది. ‘ఎంతో జాగ్రత్తగా’ ఆ తీవ్రతను, ఆజ్ఞపట్ల శ్రద్ధను తెలియజేస్తుంది.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ఈ ఆజ్ఞ మొత్తాన్నీ
  rationale: హెబ్రీలో ‘ఆజ్ఞ’ ఏకవచనంలో ఉంది; ‘మొత్తాన్నీ’ దానిని సమగ్ర నిబంధనాబాధ్యతగా చూపుతూ ఏకవచనాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: నేను పాటించమని మీకు ఆజ్ఞాపిస్తున్న
  rationale: వర్తమానంలో జరుగుతున్న ఆజ్ఞాపనను ‘ఆజ్ఞాపిస్తున్న’ తెలియజేస్తుంది. עשה అనే ‘చేయడం’ భావాన్ని ఆజ్ఞ సందర్భంలో సహజమైన ‘పాటించడం’తో వ్యక్తం చేసింది.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వేను ప్రేమిస్తూ
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది; అసమాపక క్రియల వరుసను తెలుగులో సహజంగా ‘ప్రేమిస్తూ’తో కొనసాగించింది.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: ఆయన మార్గాలన్నిటిలో నడుస్తూ
  rationale: జీవన ప్రవర్తనను సూచించే ‘నడుచుట’ రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: וּלְדָבְקָה בוֹ
  choice: ఆయనను అంటిపెట్టుకొని ఉంటే
  rationale: דבק సూచించే సన్నిహితమైన, స్థిరమైన అనుబంధాన్ని ఆధునిక తెలుగులో సజీవంగా వ్యక్తం చేస్తుంది; కేవలం సిద్ధాంతపరమైన ‘విశ్వాసంగా ఉండటం’గా కుదించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నిబంధనానామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా మూలానికి దగ్గరగా లిప్యంతరీకరిస్తుంది.
- issue: ‘నడుచుట’, ‘అంటిపెట్టుకొనుట’ అనే నిబంధనా రూపకాలు
  choice: రూపకాలను ప్రధాన పాఠంలో నిలుపడం
  alternative: ఆయన చిత్తప్రకారం జీవించడం; ఆయనకు విశ్వాసంగా ఉండడం
  rationale: మూలంలోని రూపకాలు ప్రవర్తనతో పాటు సంబంధపూర్వకమైన నిబద్ధతను కూడా మోస్తాయి. వాటిని నిలపడం భావాన్ని ఒకే సిద్ధాంతపరమైన వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతున్న షరతు భాగం కాబట్టి చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది. ‘అంటే’ తరువాతి మూడు క్రియలను ఆ ఆజ్ఞ యొక్క విషయవివరణగా స్పష్టపరుస్తుంది.
