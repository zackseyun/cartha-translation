revisions:
- from: ఎందుకంటే, నేను పాటించమని మీకు ఆజ్ఞాపిస్తున్న ఈ ఆజ్ఞ మొత్తాన్నీ[a] మీరు ఎంతో జాగ్రత్తగా పాటిస్తే[b]—అంటే, మీ దేవుడైన యాహ్వేను ప్రేమిస్తూ, ఆయన మార్గాలన్నిటిలో నడుస్తూ, ఆయనను అంటిపెట్టుకొని ఉంటే[c]—
  to: ఎందుకంటే, నేను ఆచరించమని మీకు ఆజ్ఞాపిస్తున్న ఈ ఆజ్ఞ మొత్తాన్ని[a] మీరు ఎంతో జాగ్రత్తగా పాటిస్తే[b]—మీ దేవుడైన యాహ్వేను ప్రేమిస్తూ, ఆయన మార్గాలన్నిటిలో నడుస్తూ, ఆయనను గట్టిగా పట్టుకొని ఉంటే[c]—
  rationale: ‘ఆచరించమని’ లַעֲשֹׂתָהּ యొక్క ‘చేయుట/అమలు చేయుట’ భావాన్ని నిలుపుతూ, తరువాతి ‘జాగ్రత్తగా పాటిస్తే’తో ఏర్పడిన పునరుక్తిని తొలగిస్తుంది. ‘అంటే’ తొలగించబడింది, ఎందుకంటే తదుపరి క్రియలు మూలంలోని సమాంతర అనంతక్రియలను నేరుగా ప్రతిబింబిస్తాయి. ‘గట్టిగా పట్టుకొని’ దావక్ రూపకాన్ని ఆధునిక, సహజ తెలుగు ద్వారా కాపాడుతుంది.
