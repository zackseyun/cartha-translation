  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: te
  text: నేను నీ పొలంలో నీ పశువులకు పచ్చికను[a] ఇస్తాను; నీవు తిని తృప్తి చెందుతావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గడ్డి,’ ‘మొక్కల పెరుగుదల.’ హీబ్రూ పదం విస్తృతంగా మొక్కల పెరుగుదలను సూచించగలదు; ఇక్కడ పశువులకు మేత అనే భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిండిపోతావు.’ హీబ్రూ క్రియ తిన్న తరువాత నిండుగా ఉండడం లేదా తృప్తి పొందడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: నేను ... ఇస్తాను
  rationale: ముందున్న వాగ్దాన క్రమంలో మొదటి పురుష ఏకవచన క్రియ భవిష్యత్ భావాన్ని వ్యక్తం చేస్తుంది. తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం కర్తను స్పష్టంగా ఉంచి, సంధానాన్ని విరామచిహ్నం ద్వారా కొనసాగించాం.
- source_word: עֵשֶׂב
  choice: పచ్చిక
  rationale: ఈ పదం సాధారణంగా మొక్కల పెరుగుదల లేదా గడ్డిని సూచించగలదు; పశువుల మేత సందర్భంలో ‘పచ్చిక’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: בְּשָׂדְךָ
  choice: నీ పొలంలో
  rationale: שָׂדֶה అనే పదంలోని నిర్దిష్ట వ్యవసాయ ప్రదేశ భావాన్ని, అలాగే ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: לִבְהֶמְתֶּךָ
  choice: నీ పశువుల కోసం
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు జంతువులను సమూహార్థంలో సూచిస్తుంది. ‘పశువులు’ ఆధునిక తెలుగులో స్పష్టమైన వ్యవసాయ సందర్భ పదం.
- source_word: וְאָכַלְתָּ
  choice: నీవు తిని
  rationale: ఇశ్రాయేలును సమష్టిగా ఉద్దేశించిన రెండవ పురుష ఏకవచన రూపాన్ని నిలుపుతూ, తరువాతి ఫలితంతో సహజంగా కలుపుతుంది.
- source_word: וְשָׂבָעְתָּ
  choice: తృప్తి చెందుతావు
  rationale: ఈ క్రియ భోజనం చేసి కడుపు నిండడం, సంతృప్తి పొందడం అనే భావాన్ని ఇస్తుంది. ‘తృప్తి చెందుతావు’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలుకు ప్రతినిధి ఏకవచన సంబోధన
  choice: ‘నీ పొలంలో,’ ‘నీ పశువుల,’ ‘నీవు’ అనే ఏకవచన రూపాలను నిలుపడం
  alternative: ఆధునిక సామూహిక సంబోధనగా బహువచన రూపాలను వాడడం
  rationale: హీబ్రూ మూలపాఠం ఒడంబడిక సమాజమైన ఇశ్రాయేలును రెండవ పురుష పుంలింగ ఏకవచనంలో సంబోధిస్తుంది. దాని వాక్చాతుర్య బలాన్ని అనువాదం నిలుపుతుంది.
- issue: వాగ్దానం చేసిన ఆశీర్వాద స్వభావం
  choice: సాధారణ వ్యవసాయ పోషణగా అనువదించడం
  alternative: దీనిని విస్తృతమైన సంపద లేదా సమృద్ధి వాగ్దానంగా వివరించడం
  rationale: మూలపాఠం పశువులకు పచ్చికను, మనుషులు తిని తృప్తి చెందడాన్ని చెబుతుంది. అందులో లేని విస్తృత సమృద్ధి సిద్ధాంతాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. మూలంలోని రెండవ పురుష ఏకవచన ఒడంబడిక సంబోధనను నిలిపి, వ్యవసాయ సందర్భానికి సహజమైన పదజాలాన్ని ఉపయోగించాం.
