id: DEU.11.9
reference: Deuteronomy 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: te
  text: యాహ్వే మీ పితరులకు[a], వారి సంతానానికి[b] ఇస్తానని ప్రమాణం చేసిన, పాలూ తేనె ప్రవహించే దేశంలో మీరు దీర్ఘకాలం జీవించేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ పూర్వీకులకు.’ హీబ్రూలో అక్షరార్థంగా ‘మీ పితరులకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి విత్తనానికి’ లేదా ‘వారి వంశస్థులకు.’ హీబ్రూ పదం సమూహంగా సంతానాన్ని లేదా విస్తృతంగా వంశస్థులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: జీవించేందుకు
  rationale: ఈ రూపం ఉద్దేశం లేదా ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ముందరి వాక్యంతో ఈ వచనానికి ఉన్న అనుసంధానాన్ని నిలుపుతుంది.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: దీర్ఘకాలం జీవించేందుకు
  rationale: అక్షరార్థంగా ‘దినాలను పొడిగించుట’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన భావానువాదం.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో ఇది కేవలం నేలను కాక వాగ్దాన దేశాన్ని సూచిస్తుంది; తెలుగులో ‘దేశంలో’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: לַאֲבֹתֵיכֶם
  choice: మీ పితరులకు
  rationale: హీబ్రూ పదంలోని ‘తండ్రులు/పితరులు’ అనే నిర్దిష్ట రూపాన్ని గౌరవభరితంగా నిలుపుతుంది; విస్తృత భావమైన ‘పూర్వీకులు’ను పాదటిప్పణిలో ఇస్తుంది.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: వారికి, వారి సంతానానికి తాను ఇస్తానని
  rationale: זֶרַע అనే ఏకవచన సమూహార్థ పదాన్ని తెలుగులో సహజమైన ‘సంతానం’గా అందిస్తూ, పితరులకూ వారి తరువాతివారికీ ఇచ్చే వాగ్దానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే
  rationale: సమృద్ధి, సారవంతతలను సూచించే స్థిరమైన హీబ్రూ రూపకాన్ని తెలుగులో పరిచితమైన విధంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- issue: వాగ్దానం ఎవరికి ఇవ్వబడిందనే పరిధి
  choice: మీ పితరులకు, వారి సంతానానికి
  alternative: మీ పూర్వీకులకు, వారి వంశస్థులకు
  rationale: పితరులకూ సమూహార్థ సంతానానికీ ఇచ్చిన వాగ్దానమనే మూలపాఠపు రెండు అంశాలను అలాగే ఉంచింది; విస్తృత ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన శైలి. వచనం ముందరి ఆజ్ఞల ఉద్దేశాన్ని తెలిపే ఆధార వాక్యభాగంగా ఉన్నందున ‘జీవించేందుకు’తో ముగించబడింది. వాగ్దాన దేశాన్ని మళ్లీ వివరిస్తున్న ఉపవాక్యాన్ని దీర్ఘ విరామచిహ్నాలతో స్పష్టపరచింది.
