id: DEU.11.8
reference: Deuteronomy 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: te
  text: కాబట్టి నేడు నేను మీకు ఆజ్ఞాపిస్తున్న ఆజ్ఞలన్నిటినీ[a] పాటించండి, తద్వారా మీరు బలపడి[b], మీరు స్వాధీనం చేసుకోవడానికి దాటి వెళ్తున్న దేశంలోకి ప్రవేశించి దానిని స్వాధీనం చేసుకుంటారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఆజ్ఞ అంతటినీ’ అని ఏకవచనంలో ఉంది; ఇక్కడ అది ఆజ్ఞల సమగ్ర సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బలవంతులై.’ హీబ్రూ క్రియ సందర్భంలో బలంగా కావడం లేదా బలపరచబడడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘స్వాధీనం చేసుకోవడం’ అని అనువదించిన హీబ్రూ క్రియకు ‘వారసత్వంగా పొందడం’ లేదా ‘స్వాధీనపరచుకోవడం’ అనే భావాలు కూడా ఉండవచ్చు; ఈ వచనంలో అది రెండుసార్లు వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: కాబట్టి ... పాటించండి
  rationale: ఒడంబడిక, ధర్మశాస్త్ర సందర్భంలో שׁמר అంటే ఆజ్ఞలను పాటించడం లేదా ఆచరించడం. ముందటి సందర్భంతో ఉన్న తార్కిక అనుసంధానాన్ని וּ ఇక్కడ ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַמִּצְוָה
  choice: ఆజ్ఞలన్నిటినీ
  rationale: హీబ్రూలో ‘ఆజ్ఞ’ ఏకవచనంలో ఉన్నా, అది సమస్త ఆజ్ఞల సముదాయాన్ని సూచించే సామూహిక ఏకవచనం. ఆధునిక తెలుగులో ‘ఆజ్ఞలన్నిటినీ’ దాని సమగ్ర భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను మీకు ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన కృదంతం ఆ సమయంలో కొనసాగుతున్న ఆజ్ఞాపనను సూచిస్తుంది. ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది; తెలుగు గౌరవ/సమూహ రూపమైన ‘మీకు’ సందర్భానికి సహజం.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఇక్కడ పాటించడం వల్ల కలిగే ఉద్దేశ్య-ఫల సంబంధాన్ని తెలుగులో సహజమైన ‘అప్పుడు’ తెలియజేస్తుంది; తదనంతర క్రియలను ఫలంగా ఉంచుతుంది.
- source_word: תֶּחֶזְקוּ
  choice: మీరు బలపడి
  rationale: חזק యొక్క Qal రూపం బలంగా కావడం లేదా బలపడడం అనే భావాన్ని ఇస్తుంది. ‘బలపడి’ కార్యానికి సిద్ధమయ్యే శక్తిని సూచిస్తూ, ప్రత్యేకంగా సైనిక ధైర్యం అని పరిమితం చేయదు.
- source_word: וּבָאתֶם
  choice: ప్రవేశించి
  rationale: దేశప్రవేశ సందర్భంలో בוא అంటే లోపలికి రావడం/వెళ్లడం. తెలుగులో ‘ప్రవేశించి’ దిశాపరమైన సందిగ్ధత లేకుండా సహజంగా ఉంటుంది.
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకుంటారు ... స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ కు వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం, కొన్నిసార్లు ముందున్నవారిని తొలగించి ఆక్రమించడం వంటి భావాలు ఉండవచ్చు. ఈ దేశప్రవేశ సందర్భంలో ‘స్వాధీనం చేసుకోవడం’ క్రియాశీల భావాన్ని నిలుపుతూ రెండు ప్రయోగాల మధ్య పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ הָאָרֶץ వాగ్దాన దేశాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో భౌగోళిక-జాతీయ ప్రాంతానికి ‘దేశం’ సహజంగా ఉంది.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: మీరు ... దాటి వెళ్తున్న
  rationale: עֹבְרִים యొర్దాను దాటడాన్ని సూచిస్తుంది. שָׁמָּה లోని గమ్యదిశ భావం తెలుగులో ‘వెళ్తున్న దేశంలో’ ద్వారా సహజంగా వ్యక్తమవుతుంది; విడిగా ‘అక్కడికి’ చేర్చడం అవసరం లేదు.
theological_decisions:
- issue: ఒడంబడిక సంబోధనలో ఏకవచన-బహువచన మార్పు
  choice: తెలుగులో సమూహాన్ని ఉద్దేశించిన ‘మీరు/మీకు’ రూపాలను వాడటం
  alternative: ఏకవచనాన్ని ప్రత్యేకంగా చూపడానికి ‘నీకు’ అని, బహువచన క్రియల దగ్గర ‘మీరు’ అని మార్చడం
  rationale: హీబ్రూ ఇశ్రాయేలును ఒక సమష్టిగా ఏకవచనంలోనూ, ప్రజల సమూహంగా బహువచనంలోనూ సంబోధిస్తుంది. తెలుగులో రూపాలను పదేపదే మార్చడం వ్యక్తిగత సంబోధనగా తప్పుగా అర్థమయ్యే అవకాశం కలిగిస్తుంది; ‘మీరు/మీకు’ సమష్టి భావాన్ని సహజంగా నిలుపుతుంది.
- issue: ఆజ్ఞాపాలన, బలం, దేశస్వాధీనం మధ్య సంబంధం
  choice: వాక్యంలోని ఉద్దేశ్య-ఫల సంబంధాన్ని నిలుపుతూ ‘అప్పుడు’ అని అనువదించడం
  alternative: ఇది యాంత్రిక ప్రతిఫల హామీగా వినిపించేలా ‘దాని వల్ల తప్పక’ అని విస్తరించడం
  rationale: לְמַעַן ఉద్దేశ్యం లేదా ఫలాన్ని సూచించగలదు. మూలంలోని సంబంధాన్ని ఉంచాలి గాని, దాని స్వభావాన్ని అదనపు సిద్ధాంత భాషతో నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ ధర్మశాస్త్ర వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఆజ్ఞలన్నిటినీ పాటించండి,’ ‘బలపడి,’ ‘స్వాధీనం చేసుకోవడం’ వంటి పదాలు మూలంలోని న్యాయ, కార్య, భూస్వాధీన భావాలను సహజంగా నిలుపుతాయి.
