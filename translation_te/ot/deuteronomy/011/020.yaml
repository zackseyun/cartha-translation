  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ఆజ్ఞార్థక నిర్మాణాన్ని వాడాం. మూలంలోని ఏకవచన ‘నీ’ను నిలిపాం. ‘ద్వారబంధాలు’ ఖచ్చితమైన నిర్మాణపదం; అర్థసౌలభ్యం కోసం ‘ద్వారచట్రాలు’ను పాదసూచికలో ఇచ్చాం.
