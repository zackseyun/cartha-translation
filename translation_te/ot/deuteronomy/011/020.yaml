  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: te
  text: వాటిని నీ ఇంటి ద్వారబంధాల మీద, నీ ద్వారాల మీద రాయాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ ఇంటి ద్వారచట్రాల మీద.’ హీబ్రూ పదం ద్వారానికి ఇరువైపులా ఉండే నిలువు బంధాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ ద్వారాల వద్ద.’ హీబ్రూ పదం ద్వారాలను మాత్రమే కాకుండా వాటి పరిసర ప్రవేశస్థలాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: వాటిని ... రాయాలి
  rationale: సంయోజకంతో వచ్చిన ఖల్ పరిపూర్ణ క్రియ ఈ ఆజ్ఞల వరుసలో విధ్యర్థక భావాన్ని కొనసాగిస్తుంది. తృతీయ పురుష బహువచన ప్రత్యయం ముందుగా పేర్కొన్న మాటలను సూచిస్తుంది; అందుకే ‘వాటిని’ అని అనువదించబడింది.
- source_word: עַל
  choice: మీద
  rationale: ఏదైనా ఉపరితలంపై రాయడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מְזוּזוֹת
  choice: ద్వారబంధాలు
  rationale: ఈ నామవాచకం ప్రవేశద్వారానికి ఇరువైపులా ఉండే నిలువు బంధాలను సూచిస్తుంది. తరువాతి యూదు ఆచారానికి సంబంధించిన లిప్యంతరీకరణను తీసుకురాకుండా, భౌతిక నిర్మాణ భాగాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בֵּיתֶךָ
  choice: నీ ఇంటి
  rationale: బַּיִת యొక్క స్పష్టమైన అర్థం ‘ఇల్లు’; ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’గా నిలిపింది.
- source_word: וּבִשְׁעָרֶיךָ
  choice: నీ పట్టణ ద్వారాల మీద
  rationale: שַׁעַר సాధారణంగా ద్వారాన్ని, ముఖ్యంగా నివాసస్థలం లేదా పట్టణ ప్రవేశద్వారాన్ని సూచిస్తుంది. ‘పట్టణ’ అనేది తెలుగు పాఠకునికి ఇంటి ద్వారబంధాలతో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది; అయితే మూలంలో ఈ పదం ప్రత్యక్షంగా లేకపోవడం వల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
