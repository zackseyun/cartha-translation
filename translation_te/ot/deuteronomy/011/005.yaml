id: DEU.11.5
reference: Deuteronomy 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: te
  text: మీరు ఈ స్థలానికి వచ్చేవరకు అరణ్యంలో ఆయన మీ కోసం చేసినదానినీ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: చేసినదానినీ
  rationale: సంయోజక వావ్‌తో కూడిన సంబంధవాచక పదం ముందున్న జాబితాను కొనసాగిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘చేసినదానినీ’ అనే రూపం ‘మరియు ఏమి’ కంటే సహజంగా ఉండి, కర్మార్థక సంబంధాన్ని నిలుపుతుంది.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: עשה యొక్క సాధారణ అర్థం ‘చేయు’; ఇక్కడ అరణ్యంలో దేవుడు ఇశ్రాయేలీయుల పక్షంగా చేసిన కార్యాలను సూచిస్తుంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: ఈ సందర్భంలో לָכֶם వారి ప్రయోజనం లేదా పక్షంగా జరిగిన కార్యాన్ని సూచిస్తుంది; ‘మీ కోసం’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר ఇశ్రాయేలు సంచరించిన జనావాసం తక్కువైన అరణ్య ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ స్థిరమైన బైబిలు భౌగోళిక పదంగా ఉండి, ‘ఎడారి’ కంటే వాతావరణాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: עַד בֹּאֲכֶם
  choice: మీరు ... వచ్చేవరకు
  rationale: మొదటి עַד కాలపరమైన పరిమితిని సూచిస్తుంది. בוא యొక్క క్రియానామరూపాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా ‘మీరు వచ్చేవరకు’ అని ఇచ్చాం.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలానికి
  rationale: రెండవ עַד గమ్యస్థానాన్ని సూచిస్తుంది. ‘ఈ స్థలానికి’ హీబ్రూ వాక్యంలోని స్థల పరిమితిని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: עָשָׂה క్రియకు అంతర్లీనంగా ఉన్న కర్త
  choice: ఆయన
  alternative: యెహోవా
  rationale: చుట్టుపక్కల సందర్భంలో కర్త యెహోవా అని స్పష్టమైనప్పటికీ, మూలపాఠంలో ఈ భాగంలో దైవనామం మళ్లీ లేదు. కాబట్టి ‘ఆయన’ అని ఇవ్వడం సందర్భ సంబంధాన్ని నిలిపి, మూలంలో లేని పునరుక్తిని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వచనం ముందున్నదీ తరువాతిదీ కలిసిన జాబితాలో భాగమైనందున చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది. మూలంలోని కాలపరమైన మొదటి עַד మరియు స్థలపరమైన రెండవ עַד వరుసగా ‘వచ్చేవరకు’, ‘స్థలానికి’ ద్వారా వేరుగా ప్రతిబింబించాయి.
