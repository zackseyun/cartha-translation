id: DEU.11.14
reference: Deuteronomy 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י מְטַֽר אַרְצְ/כֶ֛ם בְּ/עִתּ֖/וֹ יוֹרֶ֣ה וּ/מַלְק֑וֹשׁ וְ/אָסַפְתָּ֣ דְגָנֶ֔/ךָ וְ/תִֽירֹשְׁ/ךָ֖ וְ/יִצְהָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: te
  text: అప్పుడు నేను మీ భూమికి తగిన సమయంలో వర్షాన్ని—తొలకరి వర్షాన్ని, కడవరి వర్షాన్ని[a]—ఇస్తాను. నీవు నీ ధాన్యాన్ని, నీ కొత్త ద్రాక్షారసాన్ని[b], నీ నూనెను[c] సేకరించుకుంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తొలకరి వర్షం, కడవరి వర్షం’ అంటే వ్యవసాయ సంవత్సరంలో ముందుగా కురిసే వర్షం, తరువాత కురిసే వర్షం; లేదా, ‘మొదటి వర్షం, చివరి వర్షం.’
    reason: lexical_alternative
  - marker: b
    text: అంటే తాజాగా ఉత్పత్తి చేసిన ద్రాక్షారసం; లేదా, ‘ద్రాక్షారసం.’
    reason: lexical_alternative
  - marker: c
    text: అంటే ఒలీవ నూనె.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: అప్పుడు నేను ... ఇస్తాను
  rationale: ముందటి వచనంలోని షరతుకు ఫలితంగా వచ్చే దైవ వాగ్దానాన్ని సంధర్భానుసారంగా తెలియజేస్తుంది; ప్రథమ పురుష రూపాన్ని నిలుపుతుంది.
- source_word: מְטַר אַרְצְכֶם
  choice: మీ భూమికి ... వర్షాన్ని
  rationale: వ్యవసాయ, నిబంధన సందర్భంలో אֶרֶץ ఆధునిక రాజకీయ ‘దేశం’ కంటే సాగుభూమితో సహా ఇశ్రాయేలీయుల భూభాగాన్ని సూచిస్తుంది.
- source_word: בְּעִתּוֹ
  choice: దాని కాలంలో
  rationale: వర్షం రావలసిన తగిన కాలాన్ని సూచిస్తూ హీబ్రూ ఏకవచన సర్వనామ సంబంధాన్ని కాపాడుతుంది.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: తొలకరి వానను, కడవరి వానను
  rationale: వ్యవసాయ సంవత్సరంలో ముందుగా, తరువాత కురిసే కాలానుగుణ వానల మధ్య వ్యత్యాసాన్ని సహజమైన తెలుగు పదాలతో తెలియజేస్తుంది.
- source_word: וְאָסַפְתָּ
  choice: నీవు ... సమకూర్చుకుంటావు
  rationale: పంట దిగుబడిని సేకరించడాన్ని సూచిస్తుంది. హీబ్రూలో ఇక్కడ ఉన్న రెండవ పురుష ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: דְגָנֶךָ
  choice: నీ ధాన్యాన్ని
  rationale: వివిధ ధాన్య పంటలను కలుపుకొనే విస్తృతార్థక పదం.
- source_word: וְתִירֹשְׁךָ
  choice: నీ కొత్త ద్రాక్షారసాన్ని
  rationale: తాజాగా ఉత్పత్తి చేసిన ద్రాక్షారసాన్ని సూచించే תִּירוֹשׁ ప్రత్యేకతను కాపాడుతుంది; ‘ద్రాక్షారసం’ మూల పదార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וְיִצְהָרֶךָ
  choice: నీ నూనెను
  rationale: ఈ సాంప్రదాయ వ్యవసాయ త్రయంలో ఒలీవ నూనె ఉద్దేశించబడినా, ప్రధాన పాఠంలో హీబ్రూ పదానికి సమానమైన సాధారణ ‘నూనె’ను ఉంచి వివరాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలోని వ్యవసాయ ఆశీర్వాదం
  choice: కాలానుగుణ వర్షం, ధాన్యం, ద్రాక్షారసం, నూనె గురించిన స్పష్టమైన భౌతిక వాగ్దానంగా అనువదించడం
  alternative: వర్షాన్ని ప్రధానంగా ఆధ్యాత్మిక లేదా అంత్యకాల సంకేతంగా అనువదించడం
  rationale: హీబ్రూ పాఠం ఇశ్రాయేలుకు భూమిలో లభించే వ్యవసాయ ఆశీర్వాదాన్ని నేరుగా వివరిస్తుంది; తరువాతి సిద్ధాంతార్థాలను ప్రధాన పాఠంలోకి చేర్చకూడదు.
- issue: సంబోధనలో బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: ‘మీ భూమి’ తరువాత ‘నీవు నీ...’ అని మూలంలోని మార్పును నిలుపడం
  alternative: తెలుగులో అంతటా బహువచనంగా లేదా అంతటా ఏకవచనంగా సమతలీకరించడం
  rationale: హీబ్రూ పాఠంలో אַרְצְכֶם బహువచనం కాగా, וְאָסַפְתָּ మరియు తదనంతర స్వామ్య ప్రత్యయాలు ఏకవచనం. ఇది ఇశ్రాయేలును సమూహంగానూ ఒక సమగ్ర వ్యక్తిగానూ సంబోధించే ధోరణిని ప్రతిబింబించవచ్చు; అనువాదం దాన్ని నిశ్శబ్దంగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. వ్యవసాయ పదజాలం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. మూలంలోని బహువచన–ఏకవచన సంబోధన మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
