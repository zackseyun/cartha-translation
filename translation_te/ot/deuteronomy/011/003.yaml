source:
  edition: WLC
  text: וְ/אֶת אֹֽתֹתָי/ו֙ וְ/אֶֽת מַעֲשָׂ֔י/ו אֲשֶׁ֥ר עָשָׂ֖ה בְּ/ת֣וֹךְ מִצְרָ֑יִם לְ/פַרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וּ/לְ/כָל אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: te
  text: ఆయన ఈజిప్టు నడుమ ఫరోకు, అంటే ఈజిప్టు రాజుకు, మరియు అతని దేశమంతటికీ చేసిన సూచకాలను, కార్యాలను[a][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈజిప్టులో.” హీబ్రూలో మరింత అక్షరార్థంగా, “ఈజిప్టు నడుమ.”
    reason: lexical_alternative
  - marker: b
    text: “ఫరోకు ... మరియు అతని దేశమంతటికీ వ్యతిరేకంగా చేసిన” అని కూడా అనువదించవచ్చు. హీబ్రూ విభక్తి అక్షరార్థంగా “కు”; సందర్భంలో ఇవి తీర్పుగా వారిని లక్ష్యంగా చేసుకున్న కార్యాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: ఆయన సూచక క్రియలను
  rationale: אוֹת ఇక్కడ దేవుని శక్తిని తెలియజేసే సూచనాత్మక కార్యాలను సూచిస్తుంది. కేవలం ‘సూచనలు’ కంటే ‘సూచక క్రియలు’ ఆధునిక తెలుగులో సందర్భాన్ని సహజంగా తెలియజేస్తూ, ‘అద్భుతాలు’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: מַעֲשָׂיו
  choice: ఆయన చేసిన కార్యాలను
  rationale: מַעֲשֶׂה అంటే చేసిన పని లేదా కార్యం. సంబంధవాచక క్రియ אֲשֶׁר עָשָׂהతో కలిపి తెలుగులో ‘ఆయన చేసిన కార్యాలు’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: ఈజిప్టు నడుమ
  rationale: בְּתוֹךְ యొక్క ‘మధ్యలో/నడుమ’ భావాన్ని నిలుపుతూ, సంఘటనలు ఈజిప్టు లోపల జరిగాయని తెలియజేస్తుంది.
- source_word: לְפַרְעֹה
  choice: ఫరోకు
  rationale: לְ అనే విస్తృత లక్ష్యార్థక విభక్తిని నేరుగా ‘కు’తో నిలిపాం. సందర్భంలో తీర్పు భావం ఉన్నా, ప్రధాన పాఠంలో ‘వ్యతిరేకంగా’ అని స్పష్టీకరించి మూలంలోని విస్తృతతను కుదించలేదు.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజైన
  rationale: హీబ్రూ సమాసంలోని అర్థాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: וּלְכָל אַרְצוֹ
  choice: అతని దేశమంతటికీ
  rationale: אֶרֶץ ఇక్కడ ఫరో పాలనలోని దేశాన్ని సూచిస్తుంది; כָּל భావాన్ని ‘దేశమంతటికీ’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఫరోకు మరియు అతని దేశానికి దేవుని కార్యాల సంబంధం
  choice: ‘ఫరోకు, అతని దేశమంతటికీ’ అని మూలంలోని לְ నిర్మాణాన్ని నిలుపుట
  alternative: ‘ఫరోకు, అతని దేశమంతటికీ వ్యతిరేకంగా’
  rationale: సందర్భం ఈ కార్యాలు తీర్పుగా వారిమీదికి వచ్చాయని సూచిస్తుంది; అయినా לְ స్వతహాగా ‘కు/వైపు’ అనే విస్తృత సంబంధాన్ని కలిగి ఉంది. అందువల్ల ప్రధాన పాఠంలో అస్పష్టతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. వాక్యం ముందటి వచనంలోని క్రియపై ఆధారపడే అసంపూర్ణ జాబితా కావడంతో చివర దీర్ఘ విరామ చిహ్నం నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంచబడింది.
