language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: te
  text: అప్పుడు యహ్వే ఈ జనాంగాలన్నిటినీ మీ ఎదుటనుండి వెళ్లగొడతాడు; మీరు మీకంటే గొప్పవారైన, బలవంతులైన జనాంగాలను స్వాధీనభ్రష్టులను చేస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: వెళ్లగొడతాడు
  rationale: హిఫిల్ రూపంలోని causative భావం ప్రకారం, ఆ జనాలు తమ స్థానాన్ని కోల్పోయేలా చేయడం లేదా వారిని వెళ్లగొట్టడం అనే అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలన్నిటినీ
  rationale: గోయిమ్ ఇక్కడ భూస్వాధీన సందర్భంలోని జాతి సమూహాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘జనాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מִלִּפְנֵיכֶם
  choice: మీ ఎదుట నుంచి
  rationale: అక్షరార్థంగా ‘మీ సన్నిధి/ముఖం ఎదుట నుంచి’; వెళ్లగొట్టే క్రియతో ‘మీ ఎదుట నుంచి’ మూలంలోని స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: וִירִשְׁתֶּם
  choice: వెళ్లగొట్టి, వారి దేశాన్ని స్వాధీనం చేసుకుంటారు
  rationale: కాల్ రూపమైన ירשׁ స్వాధీనం చేసుకోవడం లేదా పూర్వ నివాసులను స్వాధీనస్థానం నుంచి తొలగించడం అనే రెండింటినీ సూచించగలదు. ప్రత్యక్ష కర్మ జనాలు కావడంతో, తెలుగులో అర్థం అసహజం కాకుండా వారి తొలగింపును మరియు దాని ఫలితమైన దేశ స్వాధీనాన్ని కలిపి వ్యక్తం చేశాం.
- source_word: גְּדֹלִים וַעֲצֻמִים מִכֶּם
  choice: మీకంటే గొప్పవీ బలమైనవీ
  rationale: מִכֶּם వల్ల ఉన్న తులనాత్మక భావాన్ని స్పష్టంగా చూపుతూ, גְּדֹלִיםను ‘గొప్పవి’, עֲצֻמִיםను సాధారణ ఆధునిక తెలుగులో ‘బలమైనవి’గా అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ‘యహ్వే’ సాధారణ పండితీయ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉంటుంది.
- issue: וִירִשְׁתֶּםలో స్వాధీనం మరియు తొలగింపు భావాలు
  choice: జనాలను వెళ్లగొట్టి, వారి దేశాన్ని స్వాధీనం చేసుకోవడం
  alternative: జనాలను స్వాధీనభ్రష్టులను చేయడం
  rationale: మూలక్రియలోని భావ పరిధిని నిలుపుతూ, ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చకుండా, ఈ భూస్వాధీన సందర్భంలో సహజమైన తెలుగును ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘బలమైనవి’ అనే రూపం పాతకాలపు లేదా అతిగా అలంకారికమైన పదప్రయోగాన్ని నివారిస్తుంది; వాక్యంలోని రెండు సమాంతర క్రియలను సెమికోలన్‌తో స్పష్టంగా వేరు చేశాం.
