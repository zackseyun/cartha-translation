  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: te
  text: ఏ వ్యక్తీ మీ ఎదుట నిలబడలేడు.[a] మీరు అడుగుపెట్టే ఆ దేశమంతటా[b] మీపట్ల భయాన్నీ భీతినీ మీ దేవుడైన యాహ్వే కలిగిస్తాడు, ఆయన మీతో చెప్పినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ ఎదుట నిలబడడం’ అంటే ఇక్కడ మిమ్మల్ని ఎదిరించి నిలవడం లేదా విజయవంతంగా ప్రతిఘటించడం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘దేశపు ముఖమంతటిపై.’ కొందరు ‘భూమి అంతటా’ అని అనువదిస్తారు; అయితే ఇశ్రాయేలీయులు అడుగుపెట్టే ప్రాంతమే వెంటనే ప్రస్తావించబడుతున్నందున ఇక్కడ ‘దేశం’ సందర్భానికి మరింత సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: ఏ వ్యక్తీ మీ ఎదుట నిలబడలేడు
  rationale: ‘ఎదుట నిలబడు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, సందర్భంలోని ‘ఎదిరించి నిలువగలగడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. אִישׁ ఇక్కడ ప్రతినిధి ఏకవచనంగా ఉన్నందున ‘ఏ వ్యక్తీ’ అనేది సమగ్ర భావాన్ని ఇస్తుంది.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: మీపట్ల భయాన్నీ భీతినీ
  rationale: రెండు సమీపార్థక నామపదాల తీవ్రతను ఒకే పదంగా కలపకుండా ‘భయం’, ‘భీతి’గా వేరు చేసి నిలిపింది; ప్రత్యయాలు ఇతరులకు ఇశ్రాయేలుపట్ల కలిగే భయాన్ని సూచిస్తాయి.
- source_word: יִתֵּן
  choice: కలిగిస్తాడు
  rationale: נתן అక్షరార్థంగా ‘ఇస్తాడు/ఉంచుతాడు’; ప్రజలలో భయం ఏర్పడే ఈ సందర్భంలో ‘కలిగిస్తాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా
  rationale: దైవనామం యెహోవాను పేరుగా నిలిపి, ఒడంబడిక సంబంధాన్ని తెలిపే ‘మీ దేవుడు’ అనే పదబంధాన్ని సహజమైన తెలుగు క్రమంలో ఉంచింది.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ఆ దేశమంతటా
  rationale: అక్షరార్థం ‘దేశపు ముఖమంతటిపై’. వెంట వచ్చే ‘మీరు అడుగుపెట్టే’ అనే పరిమితి కారణంగా הָאָרֶץ ఇక్కడ ‘భూమి’ కంటే ‘దేశం’ అని అర్థమవుతుంది; తెలుగు సహజత్వం కోసం స్థానవాచక భావాన్ని ‘అంతటా’తో తెలిపింది.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: మీరు అడుగుపెట్టే
  rationale: דרך యొక్క ‘తొక్కు/అడుగుపెట్టు’ అనే స్పష్టమైన కదలిక రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: ఆయన మీతో చెప్పినట్లే జరుగుతుంది
  rationale: דבר యొక్క ప్రాథమిక ‘మాట్లాడు/చెప్పు’ భావాన్ని ‘వాగ్దానం’గా ప్రత్యేకీకరించలేదు. తెలుగులో వాక్యాన్ని సంపూర్ణంగా, సహజంగా చేయడానికి సందర్భంలో అంతర్లీనంగా ఉన్న నెరవేర్పును ‘జరుగుతుంది’తో వ్యక్తం చేసింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- issue: אִישׁ అనే ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ఏ వ్యక్తీ
  alternative: ఏ పురుషుడూ; ఎవ్వరూ
  rationale: ఇక్కడ ఉద్దేశం ఒక నిర్దిష్ట పురుషుణ్ని గుర్తించడం కాదు; ఇశ్రాయేలును ఎదిరించగల ఎవరూ ఉండరనే సాధారణ వాక్యం. ‘ఏ వ్యక్తీ’ ఆ వ్యాప్తిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- issue: దైవ వాక్కు యొక్క వాగ్దాన స్వభావం
  choice: చెప్పినట్లే
  alternative: వాగ్దానం చేసినట్లే
  rationale: సందర్భానికి వాగ్దాన భావం ఉన్నప్పటికీ, మూల క్రియ דבר సాధారణంగా ‘చెప్పు/మాట్లాడు’. అందువల్ల ప్రత్యేకమైన ధార్మిక పదాన్ని చేర్చకుండా మూలంలోని విస్తృత భావాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఎదుట నిలబడలేడు’, ‘అడుగుపెట్టే’ అనే మూల రూపకాలు నిలిపి, ‘దేశపు ముఖమంతటిపై’ వంటి తెలుగులో అసహజమైన అక్షరానువాదాన్ని పాదటిప్పణిలో సూచించాం.
