  rationale: Only the rendering of הֵצִיף עַל־פְּנֵיהֶם is adjusted. The revision makes clear that Yahweh caused the sea waters to overflow upon the pursuing Egyptians, without adding interpretive detail. The verse remains an unfinished clause, as required by its connection to the surrounding sentence.
