id: DEU.11.4
reference: Deuteronomy 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: te
  text: ఐగుప్తు సైన్యానికి, దాని గుర్రాలకు, రథాలకు ఆయన ఏమి చేశాడో—వారు మిమ్మల్ని తరుముతున్నప్పుడు ఎర్ర సముద్రపు[a] నీళ్లు వారి మీద పొంగివచ్చేలా చేసి, యాహ్వే వారిని నేటివరకు నాశనం చేసిన సంగతిని—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: ‘రెల్లుల సముద్రం.’ సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: సైన్యం
  rationale: గుర్రాలు, రథాలు ప్రస్తావించబడిన ఈ సైనిక సందర్భంలో ఈ పదం ‘సైన్యం’ లేదా ‘సైనిక బలం’ అనే అర్థాన్నిస్తుంది; సాధారణ పాఠకులకు ‘సైన్యం’ సహజంగా ఉంటుంది.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: దాని గుర్రాలకు, రథాలకు
  rationale: ఏకవచన ప్రత్యయాలు సమష్టిగా ఐగుప్తును సూచిస్తున్నాయి. ‘రథాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఐగుప్తు రథదళాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: הֵצִיף
  choice: పొంగింపజేసి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, దేవుడు సముద్రపు నీళ్లు వారి మీదికి పొంగేలా చేశాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵי יַם סוּף
  choice: ఎర్ర సముద్రపు నీళ్లు
  rationale: ‘ఎర్ర సముద్రం’ సంప్రదాయంగా స్థిరపడిన భౌగోళిక పేరు. అయితే హెబ్రీ పదబంధంలోని ‘రెల్లుల సముద్రం’ అనే అక్షరార్థాన్ని పాదసూచికలో ఉంచి మూలపాఠ పారదర్శకతను కాపాడాం.
- source_word: עַל־פְּנֵיהֶם
  choice: వారి మీదికి
  rationale: ఈ సందర్భంలో నీళ్లు వారిని కప్పివేయడాన్ని సూచించే హెబ్రీ నుడికారానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: వారు మిమ్మల్ని తరుముతున్నప్పుడు
  rationale: ב తో కూడిన క్రియానామ రూపం సమకాలీన చర్యను సూచిస్తుంది; ‘తరుముతున్నప్పుడు’ ఆ కాలసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְאַבְּדֵם
  choice: వారిని ... నాశనం చేసిన
  rationale: కారణార్థక సందర్భంలో אבד వారిని నశింపజేయడం లేదా నిర్మూలించడం అనే భావాన్నిస్తుంది; ‘నాశనం చేసిన’ స్పష్టమైన, గంభీరమైన తెలుగు ప్రయోగం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: మూలంలోని కాలవ్యాప్తిని సంక్షిప్తంగా నిలుపుతుంది. ఇది నాశన ఫలితం వక్త కాలం వరకు కొనసాగిందనే భావాన్ని కలిగి ఉండవచ్చు; అనువాదం దాన్ని మరింతగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: יַם סוּף అనే స్థలనామం
  choice: ఎర్ర సముద్రం
  alternative: రెల్లుల సముద్రం
  rationale: పాఠ్యంలో సుపరిచితమైన సంప్రదాయ భౌగోళిక పేరును ఉంచి, హెబ్రీ పదంలోని నిజమైన పదార్థ భేదాన్ని పాదసూచికలో తెలిపాం.
- issue: עַד הַיּוֹם הַזֶּה యొక్క భావం
  choice: నేటివరకు
  alternative: దాని ఫలితం నేటివరకు నిలిచేలా
  rationale: మూలంలోని సంక్షిప్తతను, సంభావ్య అర్థ ఉద్వేగాన్ని నిలుపుతూ, ఇది నిరంతర నాశనక్రియనా లేక నాశనపు శాశ్వత ఫలితమా అన్నదాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఇది మునుపటి వాక్యభాగంతో కొనసాగే జాబితాలోని అంశం కాబట్టి, మూలంలోని అనుసంధాన నిర్మాణాన్ని చూపేందుకు చివర ‘సంగతిని’ మరియు డాష్ ఉంచాం.
