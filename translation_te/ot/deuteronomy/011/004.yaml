revisions:
- from: ఐగుప్తు సైన్యానికి, దాని గుర్రాలకు, రథాలకు ఆయన ఏమి చేశాడో—వారు మిమ్మల్ని తరుముతున్నప్పుడు ఎర్ర సముద్రపు[a] నీళ్లను వారి మీదికి పొంగింపజేసి, యాహ్వే వారిని నేటివరకు నాశనం చేసిన సంగతిని—
