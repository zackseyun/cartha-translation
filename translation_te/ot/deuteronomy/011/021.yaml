  to: యాహ్వే మీ పితరులకు ఇస్తానని ప్రమాణం చేసిన దేశంలో మీ రోజులూ మీ కుమారుల[a] రోజులూ భూమిపై ఆకాశం ఉన్న రోజులవలె[b] విస్తరించునట్లుగా.
