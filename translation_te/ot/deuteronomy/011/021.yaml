source:
  edition: WLC
  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: te
  text: యాహ్వే మీ పితరులకు ఇస్తానని ప్రమాణం చేసిన దేశంలో మీ రోజులూ మీ కుమారుల[a] రోజులూ భూమిపై ఆకాశం ఉన్న రోజులవలె[b] విస్తరించునట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పిల్లల.” హీబ్రూ పాఠంలో అక్షరార్థంగా “మీ కుమారుల” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమిపై ఆకాశం ఉన్నంతకాలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: విస్తరించడానికి
  rationale: ముందున్న ఆజ్ఞల ఉద్దేశం లేదా ఫలితాన్ని సూచించే హీబ్రూ ప్రయోజనార్థక భావాన్ని తెలుగు క్రియాంతంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: మీ రోజులు విస్తరించడానికి
  rationale: ‘రోజులు అధికమగుట’ అనే హీబ్రూ నుడికారాన్ని ‘దీర్ఘకాలం జీవించడం’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా, తెలుగులో అర్థమయ్యే రీతిలో నిలుపుతుంది.
- source_word: וִימֵי בְנֵיכֶם
  choice: మీ కుమారుల రోజులు
  rationale: בנים అనే పుంలింగ బహువచన రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; సందర్భంలో ‘పిల్లలు’ అనే విస్తృత అర్థం సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో אֲדָמָה వాగ్దాన దేశాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘దేశంలో’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם לָתֵת לָהֶם
  choice: యాహ్వే మీ పితరులకు ఇస్తానని ప్రమాణం చేసిన
  rationale: ప్రమాణ భాషను, దైవనామాన్ని, పితరులకు ఇవ్వబడిన వాగ్దానాన్ని స్పష్టంగా కాపాడుతుంది. తెలుగులో ‘ఇస్తానని’ అనే రూపంలో ‘వారికి’ భావం సహజంగా అంతర్భవిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: భూమిపై ఆకాశం ఉండే రోజులవలె
  rationale: హీబ్రూలోని ఉపమానాన్ని, ఆకాశం–భూమి దృశ్యాన్ని నిలుపుతుంది; దాని కాలవ్యాప్తి భావాన్ని పాదసూచికలో సహజ తెలుగు ప్రత్యామ్నాయంగా ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే అందిస్తుంది.
- issue: בְנֵיכֶם లో లింగ సూచన
  choice: మీ కుమారులు
  alternative: మీ పిల్లలు
  rationale: హీబ్రూ పదం రూపరీత్యా ‘కుమారులు’ అని ఉంది; అది సంతానాన్ని విస్తృతంగా సూచించవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచడం ద్వారా అర్థపరిధిని మూసివేయదు.
- issue: ఆకాశం–భూమి ఉపమానం యొక్క కాలార్థం
  choice: భూమిపై ఆకాశం ఉండే రోజులవలె
  alternative: భూమిపై ఆకాశం ఉన్నంతకాలం
  rationale: ప్రధాన పాఠం మూలంలోని కవితాత్మక ఉపమానాన్ని కాపాడుతుంది; ప్రత్యామ్నాయం దాని సాధ్యమైన నుడికారార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ‘రోజులు విస్తరించడం’ అనే నుడికారాన్నీ, ఆకాశం–భూమి ఉపమానాన్నీ ప్రధాన పాఠంలో నిలిపి, మరింత సహజమైన అర్థవివరణలను పాదసూచికల్లో ఇచ్చాం.
