source:
  edition: WLC
  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: te
  text: మీ పాదతలం త్రొక్కే ప్రతి స్థలం మీదే అవుతుంది; అరణ్యం నుండి లెబానోను వరకు, మహానది అయిన యూఫ్రటీసు నది నుండి పడమటి సముద్రం[a] వరకు మీ సరిహద్దు ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వెనుకటి సముద్రం’ లేదా ‘చివరి సముద్రం’; సంప్రదాయంగా దీనిని మధ్యధరా సముద్రంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: ప్రతి స్థలం
  rationale: ఈ పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: మీ పాదం మోపే
  rationale: పాదతలం తొక్కడం అనే మూలంలోని సజీవమైన దృశ్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; బహువచన సంబోధనను ‘మీ’ నిలుపుతుంది.
- source_word: לָכֶם יִהְיֶה
  choice: మ మీదే అవుతుంది
  rationale: స్వాధీనతను తెలిపే వాగ్దాన సూత్రాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: מִן הַמִּדְבָּר וְהַלְּבָנוֹן
  choice: అరణ్యం మొదలుకొని లెబానోను వరకు
  rationale: హీబ్రూ సరిహద్దు వరుసలోని భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘అరణ్యం మరియు లెబానోను నుండి’ అనే అసహజమైన పదానువాదాన్ని నివారిస్తుంది.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: నది—యూఫ్రటీసు నది—మొదలుకొని
  rationale: మొదట సాధారణ బిరుదైన ‘నది’, ఆపై దానిని యూఫ్రటీసుగా గుర్తించే మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: పడమటి సముద్రం వరకు
  rationale: אַחֲרוֹן యొక్క భౌగోళిక భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తూ, అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: మీ సరిహద్దు ఉంటుంది
  rationale: గְּבוּל యొక్క సరిహద్దు భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: భూభాగ వాగ్దాన భాష
  choice: ఇశ్రాయేలుకు చెప్పబడిన భౌగోళిక సరిహద్దు వాగ్దానంగా సూటిగా అనువదించడం
  alternative: దీనిని ఆదర్శ సరిహద్దులుగా లేదా షరతులులేని శాశ్వత స్వాధీనతగా వ్యాఖ్యానించడం
  rationale: వచనం భూభాగ విస్తృతిని మాత్రమే ప్రకటిస్తుంది; దాని నెరవేర్పు, కాలవ్యాప్తి లేదా రూపకాల అర్థం గురించిన తరువాతి వేదాంత వివాదాలను అనువాదంలో పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. రెండు భౌగోళిక ‘మొదలుకొని…వరకు’ జంటలు స్పష్టంగా కనిపించేలా వాక్య నిర్మాణం చేయబడింది.
