- from: మీ పాదం మోపే ప్రతి స్థలం మీదే అవుతుంది; అరణ్యం మొదలుకొని లెబానోను వరకు, నది—యూఫ్రటీసు నది—మొదలుకొని పడమటి సముద్రం[a] వరకు మీ సరిహద్దు ఉంటుంది.
