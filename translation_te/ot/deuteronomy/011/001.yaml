- from: కాబట్టి నీవు నీ దేవుడైన యెహోవాను ప్రేమించి, ఆయన అప్పగించిన బాధ్యతను[a], ఆయన కట్టడలను, ఆయన తీర్పులను[b], ఆయన ఆజ్ఞలను నీ జీవితకాలమంతా పాటించాలి.
