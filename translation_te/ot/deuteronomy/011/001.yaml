id: DEU.11.1
reference: Deuteronomy 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: te
  text: కాబట్టి నీవు నీ దేవుడైన యాహ్వేను ప్రేమించాలి; ఆయన విధిని[a], ఆయన శాసనాలను, ఆయన తీర్పులను[b], ఆయన ఆజ్ఞలను నీ జీవితకాలమంతా పాటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు నీవు నీ దేవుడైన యాహ్వేను ప్రేమించాలి.” హీబ్రూ సంయోజక అవ్యయాన్ని సాధారణంగా “మరియు” అని కూడా అనువదించవచ్చు; ఇక్కడ ముందున్న సందర్భం నుంచి వచ్చే నిర్ధారణను చూపించడానికి “కాబట్టి” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన విధులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: కాబట్టి నీవు ... ప్రేమించి
  rationale: אָהַב అంటే ‘ప్రేమించు.’ ముందున్న సందర్భానికి ఈ వాక్యం ముగింపుగా, అన్వయంగా ఉన్నందున וְ కు ఇక్కడ అనుమానార్థకమైన ‘కాబట్టి’ అనే భావాన్ని ఇచ్చాం; ‘మరియు’ అనే సాధారణ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయం ఉన్న ‘నీ దేవుడు’ అనే నిబంధన సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
- source_word: וְ/שָׁמַרְתָּ
  choice: పాటించాలి
  rationale: שׁמר కు ‘కాపాడు, గైకొను, పాటించు’ అనే అర్థాలున్నాయి. తరువాత వచ్చే న్యాయపరమైన పదాలకు సంబంధించి విధేయతను సహజంగా తెలిపేందుకు ‘పాటించాలి’ ఎంచుకున్నాం.
- source_word: מִשְׁמַרְתּוֹ
  choice: ఆయన అప్పగించిన బాధ్యతను
  rationale: מִשְׁמֶרֶת అనేది కాపాడవలసిన బాధ్యత, అప్పగింత లేదా విధిని సూచిస్తుంది. ‘ఆయన బాధ్యత’ అనే అస్పష్ట భావం రాకుండా, భావాన్ని స్పష్టంగా తెలిపే ప్రస్తుత తెలుగు రూపాన్ని వాడాం.
- source_word: חֻקֹּתָיו
  choice: ఆయన కట్టడలను
  rationale: חֻקּוֹת న్యాయసందర్భంలో స్థిరపరచిన కట్టడలు లేదా శాసనాలను సూచిస్తుంది; పక్కనున్న ఇతర న్యాయపదాల నుంచి భేదాన్ని నిలిపేందుకు ‘కట్టడలు’ వాడాం.
- source_word: וּמִשְׁפָּטָיו
  choice: ఆయన తీర్పులను
  rationale: מִשְׁפָּטִים కు తీర్పులు, న్యాయనిర్ణయాలు, విధులు అనే అర్థాలుండవచ్చు. మూలపదానికి దగ్గరగా ఉండి ఇతర న్యాయపదాల భేదాన్ని నిలిపే ‘తీర్పులు’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וּמִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: מִצְוָה కు సాధారణ న్యాయపరమైన సమానార్థకం ‘ఆజ్ఞ’; వచనంలోని ప్రత్యేక న్యాయపదాల వరుసను నిలిపాం.
- source_word: כָּל הַיָּמִים
  choice: నీ జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘దినాలన్నీ.’ రెండవ పురుష ఏకవచన సందర్భంలో నిరంతర జీవితకాల విధేయతను సహజమైన తెలుగులో తెలిపేందుకు ‘నీ జీవితకాలమంతా’ అన్నాం.
theological_decisions:
- issue: יהוה అనే దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగులో సాధారణ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: מִשְׁפָּטָיו అనే న్యాయపదం
  choice: ఆయన తీర్పులను
  alternative: ఆయన విధులను
  rationale: వచనంలోని కట్టడలు, తీర్పులు, ఆజ్ఞలు అనే వేర్వేరు నిబంధన పదజాలాన్ని ఒకే సాధారణ పదంగా కలపకుండా నిలిపాం. ‘విధులు’ కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూలోని న్యాయపదాల వరుసను సాధ్యమైనంత వరకు వేర్వేరు తెలుగు పదాలతో నిలిపాం; ‘గైకొను’ వంటి పాతకాలపు రూపానికి బదులు ‘పాటించాలి’ వాడాం.
