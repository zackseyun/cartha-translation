id: DEU.11.31
reference: Deuteronomy 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: te
  text: ఎందుకంటే మీరు యొర్దాను నదిని దాటి, మీ దేవుడైన యహ్వే[a] మీకు ఇస్తున్న దేశంలోకి ప్రవేశించి దాన్ని స్వాధీనం చేసుకోవడానికి వెళ్తున్నారు; మీరు దాన్ని స్వాధీనం చేసుకొని అందులో నివసిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవిక నామానికి సంబంధించిన మూలరూపం మరియు సంప్రదాయ అనువాద ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֹבְרִים
  choice: దాటుతున్నారు
  rationale: వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను నదిని
  rationale: తెలుగులో ఈ భౌగోళిక నామాన్ని స్పష్టంగా, సహజంగా సూచించడానికి అంతర్లీనంగా ఉన్న ‘నది’ని చేర్చింది.
- source_word: לָבֹא
  choice: ప్రవేశించి
  rationale: యొర్దాను దాటిన తరువాత దేశంలోకి వెళ్లే భావాన్ని తెలుగు వాక్యక్రమంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם אֹתָהּ
  choice: స్వాధీనం చేసుకోవడానికి / దాన్ని స్వాధీనం చేసుకొని
  rationale: ירשׁ ఇక్కడ దేశాన్ని పొందుకొని ఆధీనంలో ఉంచుకునే భావాన్ని ఇస్తుంది; ‘వారసత్వంగా పొందడం’ అనే సంకుచిత భావాన్ని అనవసరంగా చేర్చదు, అలాగే రెండు ప్రయోగాల మధ్య పదసామ్యాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ ఇశ్రాయేలీయులు ప్రవేశించబోయే భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచన ప్రత్యయంతో ఉన్న నిబంధనాత్మక సంబోధనను నేరుగా తెలియజేస్తుంది.
- source_word: נֹתֵן לָכֶם
  choice: మీకు ఇస్తున్న
  rationale: హీబ్రూ కృదంతంలోని వర్తమాన లేదా సమీప కార్య భావాన్ని సజీవంగా నిలుపుతుంది.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: అందులో నివసిస్తారు
  rationale: ישׁב యొక్క నివసించడం/ఉండడం అనే విస్తృత భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్య గౌరవాన్ని కాపాడే శైలి. హీబ్రూ వాక్యంలోని కారణసూచక అనుసంధానం, కార్యాల క్రమం, దేశాన్ని స్వాధీనం చేసుకొని అందులో నివసించే భావం నిలుపబడ్డాయి.
