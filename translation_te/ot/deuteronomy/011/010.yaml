source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: te
  text: ఎందుకంటే, నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశం, మీరు బయటికి వచ్చిన ఐగుప్తు దేశంలాంటిది కాదు. అక్కడ నీవు నీ విత్తనాన్ని విత్తి[a], కూరగాయల తోటకు నీరు పెట్టినట్లుగా నీ కాలితో[b] నీరు పెట్టేవాడివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విత్తి … నీరు పెట్టేవాడివి’ అని అనువదించిన హీబ్రూ రూపాలు ఐగుప్తులో అలవాటుగా జరిగే వ్యవసాయ పద్ధతిని సూచించవచ్చు; మరింత అక్షరార్థంగా, ‘విత్తి … నీరు పెడతావు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ కాలితో’ అనేది కాలితో నడిపే నీటిపారుదల సాధనాన్ని ఉపయోగించడాన్నిగానీ, కాలితో చిన్న కాలువలను తెరిచి లేదా మూసి నీటిని మళ్లించడాన్నిగానీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి ఈ వాక్యం వివరణను అందిస్తున్నందున కారణసూచక అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ద్వితీయోపదేశకాండంలోని వాగ్దాన దేశపు భౌగోళిక భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָא שָׁמָּה
  choice: ప్రవేశిస్తున్న
  rationale: గమ్యదేశంలోకి త్వరలో వెళ్లబోతున్న భావాన్ని హీబ్రూ వర్తమాన కృదంతానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: యָרַש్ׁ అనే పదంలోని దేశాన్ని ఆధీనంలోకి తీసుకొని కలిగియుండే భావాన్ని తెలియజేస్తుంది; పాఠ్యంలో స్పష్టంగా లేని వంశపారంపర్య భావాన్ని జోడించదు.
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలాంటిది కాదు
  rationale: ఐగుప్తుకు, ప్రవేశించబోయే దేశానికి మధ్య ఉన్న స్పష్టమైన పోలిక-వ్యతిరేకతను సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: మీరు బయటికి వచ్చిన
  rationale: నిర్గమనాన్ని గుర్తుచేసే ‘బయటికి రావడం’ అనే మూలపాఠ్య నుడికారాన్ని కేవలం ‘విడిచివచ్చిన’ అని చదును చేయకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: అక్కడ మీరు మీ విత్తనం విత్తి
  rationale: ‘విత్తనం’ అనే స్పష్టమైన వ్యవసాయ చిత్రాన్ని నిలుపుతూ, సందర్భంలోని గతకాలపు అలవాటైన చర్యను తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁקִיתָ
  choice: నీరు పెట్టేవారు
  rationale: పొలానికి లేదా నాటిన పంటకు నీరు అందించే చర్యను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; అలవాటైన చర్యను ‘పెట్టేవారు’ సూచిస్తుంది.
- source_word: בְרַגְלְךָ
  choice: మీ కాలితో
  rationale: నీటిపారుదల పద్ధతి ఖచ్చితంగా ఏదో తేల్చకుండా మూలంలోని స్పష్టమైన శరీర-చిత్రాన్ని అక్షరార్థానికి దగ్గరగా నిలుపుతుంది.
- source_word: כְּגַן הַיָּרָק
  choice: కూరగాయల తోటకు నీరు పెట్టినట్లు
  rationale: తరచుగా నీరు పెట్టే చిన్న కూరగాయల తోటతో చేసిన పోలికను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్గమన నుడికారం
  choice: మీరు బయటికి వచ్చిన
  alternative: మీరు విడిచివచ్చిన
  rationale: ఐగుప్తు నుండి ఇశ్రాయేలు బయటికి వచ్చిన సంఘటనతో ఉన్న గ్రంథాంతర్గత అనుసంధానాన్ని అదనపు వ్యాఖ్యానం లేకుండా కాపాడుతుంది.
- issue: ఏకవచనం నుండి బహువచనానికి మార్పు
  choice: నువ్వు … మీరు
  alternative: మీరు … మీరు
  rationale: ప్రవేశించడం గురించి హీబ్రూలో ఉన్న ఏకవచన సంబోధన אַתָּהను, ఐగుప్తు నుండి బయటికి రావడం మరియు వ్యవసాయం గురించి ఉన్న బహువచన రూపాల భావాన్ని తెలుగులో కనిపించేలా నిలిపింది; దీనిని నిశ్శబ్దంగా ఏకరీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలపాఠ్యంలో ఉన్న ఏకవచన–బహువచన సంబోధన మార్పును ఉద్దేశపూర్వకంగా నిలిపాం. ‘కాలితో’ అనే అస్పష్టమైన సాంస్కృతిక చిత్రాన్ని ప్రధాన పాఠ్యంలో వివరించి తేల్చకుండా, వివరణను పాదసూచికలో ఇచ్చాం.
