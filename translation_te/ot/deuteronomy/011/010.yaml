revisions:
- from: ఎందుకంటే, నువ్వు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశం, మీరు బయటికి వచ్చిన ఐగుప్తు దేశంలాంటిది కాదు. అక్కడ మీరు మీ విత్తనం విత్తి, కూరగాయల తోటకు నీరు పెట్టినట్లు మీ కాలితో[a] నీరు పెట్టేవారు[b].
  to: ఎందుకంటే, నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశం, మీరు బయటికి వచ్చిన ఐగుప్తు దేశంలాంటిది కాదు. అక్కడ నీవు నీ విత్తనాన్ని విత్తి[a], కూరగాయల తోటకు నీరు పెట్టినట్లుగా నీ కాలితో[b] నీరు పెట్టేవాడివి.
  rationale: 'మూల హీబ్రూలోని సంబోధన మార్పును కచ్చితంగా నిలిపాం: ఐగుప్తు నుండి ‘మీరు’ బయటికి వచ్చారు, కానీ దేశంలో వ్యవసాయం చేసే వ్యక్తిని ‘నీవు’ అని సంబోధిస్తుంది. నీటిపారుదల విధానంపై మూలపాఠ్యంలోని అస్పష్టతను కాపాడి, దాని వివరణను పాదసూచికకు పరిమితం చేశాం. పాదసూచిక గుర్తులను సంబంధిత పదబంధాల వద్ద, ఆంగ్ల audit trailకు అనుగుణంగా అమర్చాం.'
