id: DEU.11.19
reference: Deuteronomy 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: te
  text: మీరు వాటిని మీ పిల్లలకు[a] నేర్పాలి. మీరు మీ ఇంట్లో కూర్చున్నప్పుడు, దారిలో నడుస్తున్నప్పుడు, పడుకున్నప్పుడు, లేచినప్పుడు వాటి గురించి మాట్లాడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ కుమారులకు.’ హీబ్రూ భాషలో ఇక్కడ పుంలింగ బహువచన రూపం ఉంది; అది ఒకరి పిల్లలందరినీ ప్రతినిధిగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: నేర్పాలి
  rationale: למד పియేల్ రూపం సాధారణంగా ‘నేర్పు’ అని అర్థమిస్తుంది. ప్రారంభంలోని וְ సందర్భానుసార కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ఈ పుంలింగ బహువచన కర్మసర్వనామం ముందున్న మాటలు లేదా ఆజ్ఞలను సూచిస్తుంది. మూలంలోని సర్వనామ సంబంధాన్ని అతిగా వివరిచకుండా నిలుపుతుంది.
- source_word: אֶת־בְּנֵיכֶם
  choice: మీ పిల్లలకు[a]
  rationale: בנים అనే పదానికి సంకుచితంగా ‘కుమారులు,’ విస్తృతంగా ‘పిల్లలు’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ ఒడంబడిక బోధనను సంతానానికి అందించడమే భావం కాబట్టి ‘పిల్లలు’ సహజమైన ప్రతినిధి అర్థాన్ని అందిస్తుంది.
- source_word: לְדַבֵּר בָּם
  choice: వాటి గురించి మాట్లాడాలి
  rationale: לְ తో కూడిన క్రియానామం బోధనతో పాటు జరిగే మాటల విషయం లేదా విధానాన్ని తెలియజేస్తుంది. בָּם ను తెలుగులో సహజంగా ‘వాటి గురించి’ అని అందించవచ్చు.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: మీ ఇంట్లో కూర్చున్నప్పుడు
  rationale: בְּ తో కూడిన క్రియానామం కాలసంబంధ పరిస్థితిని, בְּבֵיתֶךָ స్థలాన్ని సూచిస్తాయి. ఈ పదబంధం రెండింటినీ నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: దారిలో నడుస్తున్నప్పుడు
  rationale: הלך యొక్క సాధారణ భావం ‘నడుచు/వెళ్లు.’ בַדֶּרֶךְ ను ‘దారిలో’ అని ఇవ్వడం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וּבְשָׁכְבְּךָ
  choice: పడుకున్నప్పుడు
  rationale: שכב క్రియానామంతో ఉన్న בְּ కాలసందర్భాన్ని సూచిస్తుంది. ‘పడుకున్నప్పుడు’ మూలభావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וּבְקוּמֶךָ
  choice: లేచినప్పుడు
  rationale: קום ఇక్కడ నిద్ర లేదా విశ్రాంతి నుంచి లేవడాన్ని సూచిస్తుంది. ‘పడుకున్నప్పుడు, లేచినప్పుడు’ అనే జంట మూలంలోని సమాంతర లయను నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵיכֶם లో లింగ సూచన
  choice: మీ పిల్లలకు
  alternative: మీ కుమారులకు
  rationale: పుంలింగ బహువచన రూపం ఇక్కడ సంతానాన్ని ప్రతినిధిగా సూచించగలదు. ‘పిల్లలు’ అనే పదం కుమార్తెలను అనవసరంగా మినహాయించకుండా సందర్భంలోని విస్తృత పరిధిని తెలుగులో సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. వరుస కాలపదబంధాల ద్వారా హీబ్రూ వాక్యంలోని దైనందిన జీవన లయను నిలిపాం; ఏ మతశాఖకు ప్రత్యేకమైన పదజాలాన్ని చేర్చలేదు.
