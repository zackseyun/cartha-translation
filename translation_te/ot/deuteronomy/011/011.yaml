source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: te
  text: అయితే మీరు స్వాధీనం చేసుకోవడానికి[a] దాటి వెళ్తున్న దేశం కొండలు, లోయలు గల దేశం; అది ఆకాశం నుండి కురిసే వర్షపు నీటిని తాగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వాధీనం చేసుకోవడానికి’ అనే మాటకు ‘వారసత్వంగా పొందడానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియలో, ముఖ్యంగా నిబంధన సందర్భాల్లో, ఈ రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: అయితే ... దేశం
  rationale: ముందటి వచనంలో చెప్పిన ఐగుప్తు దేశానికి దీనిని వ్యతిరేకంగా చూపించే వావ్ సంధిని సహజమైన తెలుగులో ‘అయితే’ తెలియజేస్తుంది.
- source_word: עֹבְרִים שָׁמָּה
  choice: దాటి వెళ్తున్న
  rationale: క్రియారూపం ఆ దేశంలోకి ప్రవేశించడానికి జరుగుతున్న లేదా సమీపించిన ప్రయాణాన్ని సూచిస్తుంది; గమ్యాన్ని తెలుగు వాక్య నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ ఇక్కడ క్రియాశీలంగా దేశాన్ని సొంతం చేసుకోవడాన్ని సూచిస్తూ, నిబంధన సంబంధమైన వారసత్వ భావాన్ని కూడా కలిగి ఉంది; ప్రధాన పాఠంలో సందర్భానికి సహజమైన క్రియాశీల అర్థాన్ని ఉంచాం.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: కొండలు, లోయలు గల దేశం
  rationale: భూభాగంలోని ఎత్తుపల్లాలను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; הָרִים సందర్భానుసారంగా ‘కొండలు,’ בְקָעוֹת ‘లోయలు’గా అనువదించబడ్డాయి.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: ఆకాశం నుండి కురిసే వర్షపు
  rationale: వర్షం పై నుండి, ఆకాశం నుండి వస్తుందనే మూలభాషా చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: నీటిని తాగుతుంది
  rationale: దేశాన్ని నీరు తాగే జీవిగా చిత్రించే హీబ్రూ వ్యక్తీకరణను సజీవంగా నిలుపుతుంది; ‘నీరు అందుకుంటుంది’ అని భావాన్ని చదును చేయలేదు.
theological_decisions:
- issue: ירשׁ క్రియలో స్వాధీనత మరియు వారసత్వం రెండింటి ఛాయలు
  choice: ప్రధాన పాఠంలో ‘స్వాధీనం చేసుకోవడానికి’; పాదటిప్పణిలో ‘వారసత్వంగా పొందడానికి’
  alternative: వారసత్వంగా పొందడానికి
  rationale: ఇశ్రాయేలు దేశంలోకి ప్రవేశించి దానిని స్వాధీనం చేసుకునే క్రియాశీల సందర్భాన్ని ప్రధాన పాఠం తెలియజేస్తుంది; నిబంధన సంబంధమైన వారసత్వ ఛాయను పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘దేశం ... తాగుతుంది’ అనే మూలభాషా వ్యక్తీకరణను ఉద్దేశపూర్వకంగా నిలిపాం. పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో సంబంధిత ‘స్వాధీనం చేసుకోవడానికి’ పదబంధం వెంట ఉంచడం తెలుగు పఠనంలో మరింత స్పష్టమైనా, వాక్యాంత స్థానం కూడా ఆ పదానికి సంబంధించిన ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
