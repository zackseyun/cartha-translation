  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: te
  text: ఈ రోజు నేను మీ ముందుంచుతున్న కట్టడాలన్నిటినీ, న్యాయవిధులన్నిటినీ మీరు జాగ్రత్తగా ఆచరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈ రోజు నేను మీ ముందు ఇస్తున్నవి.” ఇక్కడ హీబ్రూ నుడికారానికి “మీ ముందుంచుతున్న” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించాలి
  rationale: שׁמר + infinitive construction has the force of taking care to perform, not merely retaining or guarding. In natural modern Telugu, ‘జాగ్రత్తగా పాటించాలి’ conveys both carefulness and directive force.
- source_word: כָּל הַחֻקִּים
  choice: నియమాలన్నిటినీ
  rationale: חֻקִּים denotes prescribed enactments or statutes. ‘నియమాలు’ is clear to ordinary Telugu readers and retains the legal-covenantal sense; ‘అన్నిటినీ’ preserves the comprehensive force of כָּל.
- source_word: וְאֶת הַמִּשְׁפָּטִים
  choice: న్యాయవిధులన్నిటినీ
  rationale: מִשְׁפָּטִים refers to judgments, legal rulings, or ordinances. ‘న్యాయవిధులు’ preserves a meaningful distinction from חֻקִּים while remaining intelligible in modern Telugu.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: నేను మీ ముందుంచుతున్న
  rationale: Although נתן literally means ‘give,’ together with לִפְנֵיכֶם the idiom means to set or place before someone. ‘మీ ముందుంచుతున్న’ naturally expresses that idiom and retains the ongoing present force.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: This directly and naturally conveys the temporal immediacy of the covenant address.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-నిబంధన శైలి వాడబడింది. חֻקִּים మరియు מִשְׁפָּטִים మధ్య ఉన్న పదభేదాన్ని ‘నియమాలు’ మరియు ‘న్యాయవిధులు’తో నిలుపుకున్నాం. ఆజ్ఞాత్మక భావాన్ని సహజ తెలుగులో ‘పాటించాలి’తో వ్యక్తం చేశాం.
