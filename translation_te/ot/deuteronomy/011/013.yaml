source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: te
  text: మీరు ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న నా ఆజ్ఞలను నిజంగా శ్రద్ధగా వింటే[a], మీ దేవుడైన యాహ్వేను ప్రేమించడానికీ[b], మీ పూర్ణ హృదయంతోను మీ పూర్ణ ప్రాణంతోను ఆయనను సేవించడానికీ[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘విని వినితే’ అనే ఉద్ఘాటనాత్మక ప్రయోగం ఉంది; సందర్భాన్ని బట్టి దీనికి ‘జాగ్రత్తగా విని విధేయత చూపితే’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో యెహోవా అనే నాలుగు అక్షరాల దైవనామం (YHWH) ఉంది; సంప్రదాయ అనువాదాల్లో దీనిని ‘ప్రభువు’ అని కూడా ఇస్తారు.
    reason: lexical_alternative
  - marker: c
    text: ‘ప్రాణం’కు ప్రత్యామ్నాయంగా ‘జీవితం’ లేదా ‘సంపూర్ణ అస్తిత్వం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: వింటే
  rationale: ఈ పదబంధం తరువాతి వచనంలో పూర్తయ్యే షరతును ప్రవేశపెడుతుంది. తెలుగులో సహజమైన షరతార్థక క్రియారూపం ద్వారా దాని భావాన్ని తెలిపి, వాక్యం ఇంకా కొనసాగుతుందని దీర్ఘ విరామచిహ్నంతో సూచించాం.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: మీరు నిజంగా శ్రద్ధగా వింటే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియారూపం బలమైన ఉద్ఘాటనను ఇస్తుంది. ‘వింటే’ హీబ్రూ పదంలోని వినడం-విధేయత చూపడం అనే విస్తృత భావాన్ని కాపాడుతుంది; ‘నిజంగా శ్రద్ధగా’ దాని ఉద్ఘాటనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: తెలుగులో ‘విను’ అనే క్రియతో ప్రత్యక్ష కర్మ సహజంగా వస్తుంది. ‘ఆజ్ఞలు’ నిబంధన సంబంధమైన ఆదేశాల భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన కృదంతం మోషే ప్రస్తుతం చేస్తున్న ఆజ్ఞాపనను సూచిస్తుంది; ‘ఈ రోజు’ అనే నిబంధనాత్మక కాలసూచనను నిలిపాం.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవాను ప్రేమించి
  rationale: లక్ష్యం లేదా ఉద్దేశాన్ని సూచించే ఇన్ఫినిటివ్‌ను తెలుగులో తరువాతి సమాపక క్రియతో సహజంగా అనుసంధానించే ‘ప్రేమించి’ రూపంలో ఇచ్చాం. దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయలేదు.
- source_word: וּלְעָבְדוֹ
  choice: ఆయనను సేవించడానికి
  rationale: עבד ఆరాధనతో కూడిన సమర్పిత సేవ, విధేయత అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘సేవించడానికి’ దాన్ని ‘ఆరాధించడానికి’ మాత్రమే పరిమితం చేయదు.
- source_word: בְּכָל לְבַבְכֶם
  choice: మీ పూర్ణ హృదయంతో
  rationale: לֵבָב సంకల్పం, ఆలోచన, అనురాగం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘పూర్ణ హృదయంతో’ ఆధునిక తెలుగులో సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: మీ పూర్ణ ప్రాణంతో
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, స్వయం లేదా సంపూర్ణ అస్తిత్వాన్ని సూచించగలదు. ‘ప్రాణం’ మూలరూపంలోని విస్తృత జీవసంబంధ భావాన్ని నిలుపుతూ, తెలుగు బైబిల్ భాషలో అర్థమయ్యే పదం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నామమైన టెట్రాగ్రామటన్ నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని వాడి, దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: שָׁמֹעַ תִּשְׁמְעוּ యొక్క భావబలం
  choice: మీరు నిజంగా శ్రద్ధగా వింటే
  alternative: మీరు జాగ్రత్తగా విధేయులైతే
  rationale: హీబ్రూ ప్రయోగంలో వినడమూ దానికి అనుగుణంగా నడుచుకోవడమూ కలిసి ఉన్నాయి. ప్రధాన పాఠం ‘వింటే’ అని మూలరూపాన్ని నిలుపుతుంది; విధేయత భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- issue: נֶפֶשׁ యొక్క పరిధి
  choice: ప్రాణం
  alternative: జీవితం; సంపూర్ణ అస్తిత్వం
  rationale: ఈ నిబంధన సూత్రంలో పదాన్ని కేవలం శరీరానికి వేరైన ఆత్మగా కుదించకుండా ‘ప్రాణం’ అని ఇచ్చాం; దాని విస్తృత భావాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన నిబంధనాత్మక శైలిని వాడాం. హీబ్రూ వాక్యం 14వ వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం పెట్టాం. మూలంలోని బహువచన సంబోధనను ‘మీరు/మీ’ రూపాలతో నిలిపాం.
