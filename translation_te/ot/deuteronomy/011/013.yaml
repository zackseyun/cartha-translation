revisions:
- from: మీ దేవుడైన యెహోవాను ప్రేమించి, మీ పూర్ణ హృదయంతో, మీ పూర్ణ ప్రాణంతో ఆయనను సేవించడానికి, ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న నా ఆజ్ఞలను మీరు నిజంగా శ్రద్ధగా వింటే[a]—
  to: మీరు ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న నా ఆజ్ఞలను నిజంగా శ్రద్ధగా వింటే[a], మీ దేవుడైన యాహ్వేను ప్రేమించడానికీ[b], మీ పూర్ణ హృదయంతోను మీ పూర్ణ ప్రాణంతోను ఆయనను సేవించడానికీ[c]—
  rationale: The revision restores the conditional clause to the front, makes the love-and-service purposes parallel, retains the verse’s unfinished continuation with an em dash, and changes the divine name to ‘యాహ్వే’ in accordance with the POB audit trail. Footnotes now anchor the emphatic hearing idiom, the divine-name rendering, and the wider semantic range of נפשׁ.
