revisions:
- from: కాబట్టి, ఈ నా మాటలను మీ హృదయాల మీదా మీ ప్రాణాల మీదా ఉంచుకోండి; వాటిని మీ చేతి మీద సూచనగా కట్టుకోండి; అవి మీ కళ్ల మధ్య నుదుటి పట్టీలుగా[a] ఉండాలి.
  to: ఈ నా మాటలను మీ హృదయంపై, మీ ప్రాణంపై ఉంచండి; వాటిని మీ చేతిమీద ఒక సూచనగా కట్టుకోండి; అవి మీ కళ్ల మధ్య నుదుటి పట్టీలుగా[a] ఉండాలి.
  rationale: The revision removes an unnecessarily inferential rendering of the conjunction and replaces the reflexive verb with a direct equivalent of “place.” It also uses singular collective nouns for “heart” and “soul,” while retaining the source’s concrete imagery and lexical uncertainty regarding טוֹטָפֹת.
