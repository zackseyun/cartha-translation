source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: te
  text: ఈ నా మాటలను మీ హృదయంపై, మీ ప్రాణంపై ఉంచండి; వాటిని మీ చేతిమీద ఒక సూచనగా కట్టుకోండి; అవి మీ కళ్ల మధ్య నుదుటి పట్టీలుగా[a] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ఈ అరుదైన పదానికి ఖచ్చితమైన భావం అనిశ్చితం. దీనిని ‘ఫిలాక్టరీలు’ అని కూడా అనువదిస్తారు; తర్వాతి యూదు ఆచారంలో అవి లేఖన భాగాలను ఉంచి ధరించే చిన్న పెట్టెలను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: ఉంచుకోండి
  rationale: שׂים అనే క్రియలోని ‘పెట్టు, ఉంచు’ అనే మౌలిక భావాన్ని నిలుపుతూ, ఆ మాటలను తమపై స్థిరంగా ఉంచుకోవాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ముందున్న సందర్భంతో అనుసంధానించే וְ ను ‘కాబట్టి’గా అందించాం.
- source_word: דְּבָרַי אֵלֶּה
  choice: ఈ నా మాటలను
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతూ, వక్తకు చెందిన మాటలనే ప్రత్యేకంగా సూచిస్తుంది.
- source_word: עַל לְבַבְכֶם
  choice: మీ హృదయాల మీద
  rationale: עַל లోని ‘మీద’ అనే స్థలరూపకాన్ని నిలుపుతుంది; ‘హృదయాల్లో’ అని మార్చి మూల చిత్రణను మృదువుపరచలేదు.
- source_word: וְעַל נַפְשְׁכֶם
  choice: మీ ప్రాణాల మీద
  rationale: נֶפֶשׁ కు ప్రాణం, జీవం, స్వయం వంటి విస్తృత అర్థపరిధి ఉంది. హృదయంతో జతగా ఉన్న ఈ సందర్భంలో ‘ప్రాణం’ మూలపదపు సంపూర్ణ వ్యక్తిత్వ/జీవిత భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: వాటిని … కట్టుకోండి
  rationale: קשׁר లోని ‘కట్టు, బంధించు’ అనే స్పష్టమైన భౌతిక భావాన్ని కాపాడుతుంది; అది అక్షరార్థమా రూపకమా అని అనువాదంలోనే నిర్ణయించదు.
- source_word: לְאוֹת
  choice: సూచనగా
  rationale: אוֹת కు ‘సూచన, గుర్తు, చిహ్నం’ అనే అర్థాలున్నాయి. ‘సూచనగా’ ప్రతీకాత్మక ప్రయోజనాన్ని సహజంగా తెలియజేస్తూ దాని స్వరూపాన్ని నిర్దేశించదు.
- source_word: עַל יֶדְכֶם
  choice: మీ చేతి మీద
  rationale: יָד యొక్క సాధారణ అర్థమైన ‘చేయి’ని, עַל యొక్క ‘మీద’ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְהָיוּ
  choice: ఉండాలి
  rationale: ఆజ్ఞల క్రమాన్ని తెలుగులో సహజంగా కొనసాగిస్తూ, అవి అలా ఉండవలసిన బాధ్యతను తెలియజేస్తుంది.
- source_word: לְטוֹטָפֹת
  choice: నుదుటి పట్టీలుగా
  rationale: అరుదైన טוֹטָפֹת పదం కళ్ల మధ్య ధరించే వస్తువును సూచిస్తుందని సంప్రదాయంగా గ్రహిస్తారు. ‘నుదుటి పట్టీలు’ ఆ సాధారణ చిత్రాన్ని ఇస్తుంది; తర్వాతి యూదు ఆచారంలోని నిర్దిష్ట రూపాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయదు.
- source_word: בֵּין עֵינֵיכֶם
  choice: మీ కళ్ల మధ్య
  rationale: హీబ్రూ పదబంధాన్ని దాదాపు నేరుగా నిలుపుతుంది; దాన్ని కేవలం ‘నుదుటి మీద’ అని వివరణాత్మకంగా మార్చదు.
theological_decisions:
- issue: మాటలను చేతి మీద కట్టడం, కళ్ల మధ్య ఉంచడం అక్షరార్థమా రూపకమా అనే ప్రశ్న
  choice: భౌతిక చిత్రణను యథాతథంగా ఉంచి, అది అక్షరార్థమా, రూపకమా, లేక రెండూ కలిసినదా అని తేల్చలేదు.
  alternative: దీనిని కేవలం ఆలోచనలలోనూ క్రియలలోనూ ఆజ్ఞలను ఎప్పుడూ జ్ఞాపకం ఉంచుకోవాలనే రూపకంగా అనువదించడం; లేదా తర్వాతి ఫిలాక్టరీల ఆచారాన్ని నేరుగా ప్రధాన పాఠ్యంలో పేర్కొనడం.
  rationale: హీబ్రూ వాక్యం స్పష్టమైన భౌతిక భాషను ఉపయోగించినా, ఈ వచనం ఒక్కటే దాని అన్వయాన్ని ఒకే విధంగా నిర్బంధించదు. అందువల్ల అనువాదం ఆ వ్యాఖ్యాన సంబంధమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘హృదయాల మీదా ప్రాణాల మీదా’ అనే నిర్మాణం సాధారణ గద్యంకన్నా కొద్దిగా గంభీరంగా ఉన్నప్పటికీ, మూలంలోని עַל రూపకాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది. సమూహాన్ని ఉద్దేశించిన హీబ్రూ బహువచనం తెలుగులో ‘మీ’ మరియు గౌరవ/బహువచన క్రియారూపాల ద్వారా వ్యక్తమైంది.
