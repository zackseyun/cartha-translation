source:
  edition: WLC
  text: אֶ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ דֹּרֵ֣שׁ אֹתָ֑/הּ תָּמִ֗יד עֵינֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/הּ מֵֽ/רֵשִׁית֙ הַ/שָּׁנָ֔ה וְ/עַ֖ד אַחֲרִ֥ית שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: te
  text: అది నీ దేవుడైన యాహ్వే శ్రద్ధ వహించే[a] దేశం; సంవత్సరం ఆరంభం నుండి దాని అంతం వరకు నీ దేవుడైన యాహ్వే కన్నులు ఎల్లప్పుడూ దానిమీద ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శ్రద్ధ వహించే’ అనే చోట ‘వెదకే,’ ‘విచారించే,’ లేదా ‘చూసుకునే’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియకు వెదకడం, విచారించడం, శ్రద్ధ చూపడం అనే భావాలున్నాయి; ఇక్కడ అది యాహ్వే ఈ దేశంపట్ల చూపే క్రియాశీల శ్రద్ధను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: దేశం
  rationale: ఈ సందర్భంలో ఇది భూమి మొత్తాన్ని కాక, ఇశ్రాయేలుకు వాగ్దానం చేయబడిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన సంబోధనను సహజమైన తెలుగులో నిలిపింది.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: దానిపట్ల శ్రద్ధ వహించే
  rationale: דרש అనే క్రియకు వెదకడం, విచారించడం, పట్టించుకోవడం అనే భావాలున్నాయి; దేశం గురించి ఈ సందర్భంలో దేవుని క్రియాశీల పర్యవేక్షణను ‘శ్రద్ధ వహించడం’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా కొనసాగే దేవుని దృష్టిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: నీ దేవుడైన యాహ్వే దృష్టి దానిమీద ఉంటుంది
  rationale: హీబ్రూలోని ‘కళ్లు’ అనే రూపకాన్ని తెలుగులో సహజమైన ‘దృష్టి దానిమీద’ అనే రూపంలో నిలుపుతూ జాగరూకమైన శ్రద్ధను తెలియజేస్తుంది.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: సంవత్సర ఆరంభం నుండి సంవత్సర అంతం వరకు
  rationale: మొత్తం సంవత్సర కాలవ్యాప్తిని మూలంలోని సమాంతర నిర్మాణానికి దగ్గరగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా నేరుగా సూచిస్తుంది.
- issue: దేవుని ‘కళ్లు’ అనే మానవరూప వర్ణన
  choice: దృష్టి దానిమీద ఉంటుంది
  alternative: కళ్లు దానిమీద ఉంటాయి
  rationale: దేవుని నిరంతర పర్యవేక్షణ భావాన్ని తొలగించకుండా, ఆధునిక తెలుగులో అసహజంగా వినిపించే శరీరావయవ ప్రయోగాన్ని సహజ రూపకంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. ‘దేశం,’ ‘శ్రద్ధ వహించే,’ ‘దృష్టి’ వంటి సహజ పదాలతో మూలార్థం మరియు రూపక భావం సమతుల్యం చేయబడ్డాయి.
