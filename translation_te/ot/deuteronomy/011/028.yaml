source:
  edition: WLC
  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: te
  text: 'మరియు శాపం: మీరు మీ దేవుడైన యాహ్వే ఆజ్ఞలను వినకపోతే[a], నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న మార్గం నుండి తప్పుకొని, మీకు తెలియని ఇతర దేవుళ్లను అనుసరించడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆజ్ఞలకు లోబడక.” హీబ్రూలో “వినడం” అనే క్రియ నిబంధన సందర్భాల్లో తరచుగా విని విధేయత చూపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: మరియు శాపం
  rationale: మునుపటి వచనంలోని ‘ఆశీర్వాదం’తో ఉన్న సమాంతర నిర్మాణాన్ని, నిబంధన సంబంధమైన వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: మీరు వినక
  rationale: שׁמע యొక్క ప్రాథమిక ‘విను’ భావాన్ని నిలుపుతూ, నిబంధన సందర్భంలో దానిలో అంతర్లీనంగా ఉన్న విధేయత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: מִצְוֺת יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వే ఆజ్ఞలను
  rationale: మూలంలోని దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించి, מִצְוֺת ను సహజమైన, గంభీరమైన ‘ఆజ్ఞలు’గా అనువదిస్తుంది.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: మార్గం నుంచి తొలగిపోయి
  rationale: నిర్దేశించిన మార్గం నుండి పక్కకు మళ్లే భావాన్ని, మార్గ రూపకాన్ని నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న
  rationale: హీబ్రూ కృదంతంలోని ప్రస్తుత ప్రసంగ తక్షణత్వాన్ని సహజమైన తెలుగు వర్తమాన రూపంలో నిలుపుతుంది.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను అనుసరిస్తే
  rationale: ‘వారి వెనుక వెళ్లడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ‘అనుసరించడం’గా వ్యక్తం చేస్తుంది; షరతు నిర్మాణం వాక్యాంతంలో స్పష్టమవుతుంది.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: మీకు తెలియని
  rationale: ఇశ్రాయేలీయులకు పరిచయం లేదా నిబంధన సంబంధం లేని దేవుళ్లు అనే భావాన్ని అతిగా వివరించకుండా సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ప్రత్యేక నిబంధన నామాన్ని సాధ్యమైనంత నేరుగా ప్రతిబింబించి, సాధారణ బిరుదుతో భర్తీ చేయదు.
- issue: שׁמע ను ‘వినడం’గా లేదా ‘విధేయత చూపడం’గా అనువదించడం
  choice: వినక
  alternative: లోబడక / పాటించక
  rationale: మూల క్రియ యొక్క శ్రవణ రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతూ, నిబంధన సందర్భంలోని విధేయత భావాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
- issue: לָלֶכֶת אַחֲרֵי లోని గమన రూపకం
  choice: అనుసరిస్తే
  alternative: వెనుక వెళ్లితే
  rationale: తెలుగులో ‘ఇతర దేవుళ్ల వెనుక వెళ్లడం’ సాధ్యమైనా కొంత కృత్రిమంగా వినిపిస్తుంది; ‘అనుసరించడం’ ఆరాధనాత్మక విధేయత భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హీబ్రూ వాక్యం మునుపటి వచనంతో సమాంతరంగా ‘మరియు శాపం’ అని మొదలవుతుంది; తెలుగులో భావం అసంపూర్ణంగా ఉండకుండా వాక్యాంతంలో ‘శాపం కలుగుతుంది’ చేర్చబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘వినక’ పదం వెంట ఉంచబడింది.
