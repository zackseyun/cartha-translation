  to: 'మరియు శాపం: మీరు మీ దేవుడైన యాహ్వే ఆజ్ఞలను వినకపోతే[a], నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న మార్గం నుండి తప్పుకొని, మీకు తెలియని ఇతర దేవుళ్లను అనుసరించడానికి.'
