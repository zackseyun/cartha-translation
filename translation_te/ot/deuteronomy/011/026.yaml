revisions:
- from: చూడు[a], ఈ రోజు నేను మీ ముందు ఆశీర్వాదాన్ని, శాపాన్ని ఉంచుతున్నాను.
  to: చూడండి[a], ఈ రోజు నేను మీ ముందు ఆశీర్వాదాన్ని, శాపాన్ని ఉంచుతున్నాను.
  rationale: The revision replaces an informal singular Telugu imperative with a natural formal/plural imperative suitable for the public address, while the footnote preserves and cautiously explains the Hebrew singular-to-plural shift. The remainder accurately reflects the Hebrew and the English audit trail.
