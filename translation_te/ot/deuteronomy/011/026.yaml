source:
  edition: WLC
  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: te
  text: చూడండి[a], ఈ రోజు నేను మీ ముందు ఆశీర్వాదాన్ని, శాపాన్ని ఉంచుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “చూడు” ఏకవచన ఆజ్ఞారూపంలో ఉంది; తరువాత వచ్చే “మీ” బహువచనం. సమూహాన్ని ఒక వ్యక్తిలా ఉద్దేశించే వాడుక కావచ్చు.
    reason: grammatical_number
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని నిలుపుతూ, శ్రోతల దృష్టిని రాబోయే ప్రకటనపై కేంద్రీకరించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్యంలో స్పష్టమైన ‘నేను’ ద్వారా తగినంతగా వ్యక్తం చేస్తుంది; ‘నేనే’ అనడం మూలంలోని ఉద్ఘాటనను అతిగా చూపవచ్చు.
- source_word: נֹתֵן
  choice: ఉంచుతున్నాను
  rationale: נתן అనే క్రియకు ‘ఇవ్వడం/పెట్టడం/ఉంచడం’ అనే అర్థాలు ఉన్నాయి. ‘మీ ముందు’ అనే నిర్మాణంతో ప్రత్యామ్నాయాలను సమర్పించే భావానికి ‘ఉంచుతున్నాను’ సహజంగా సరిపోతుంది.
- source_word: לִפְנֵיכֶם
  choice: మీ ముందు
  rationale: బహువచన శ్రోతలను సూచించే ‘మీ’ని నిలుపుతూ, ‘ముందు/సమక్షంలో’ అనే హీబ్రూ నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచక పదానికి స్పష్టమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְּרָכָה
  choice: ఆశీర్వాదాన్ని
  rationale: నిబంధన సందర్భంలోని మేలు ప్రసాదించే ఆశీర్వాద భావాన్ని సాధారణంగా అర్థమయ్యే గౌరవప్రదమైన పదంతో తెలియజేస్తుంది.
- source_word: וּקְלָלָה
  choice: శాపాన్ని
  rationale: ఆశీర్వాదానికి వ్యతిరేకంగా ఉంచిన నిబంధనాత్మక ప్రతిఫలాన్ని సంక్షిప్తంగా, నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆశీర్వాదం–శాపం సూత్రీకరణ స్వభావం
  choice: నిబంధనకు సంబంధించిన రెండు ప్రత్యామ్నాయాలను శ్రోతల ముందు ఉంచుతున్నట్లుగా అనువదించడం
  alternative: దీనిని ప్రతిఫలం–శిక్షల గురించిన సాధారణ నైతిక సూత్రంగా విస్తరించి చెప్పడం
  rationale: ఈ వాక్యం ద్వితీయోపదేశకాండ సందర్భంలో నిబంధనాత్మక ఆశీర్వాదం, శాపాన్ని పరిచయం చేస్తుంది. మూలం చెప్పనిదాన్ని సిద్ధాంతపరంగా చేర్చకుండా ఆ రెండు ప్రత్యామ్నాయాల సమర్పణను మాత్రమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూలోని ఏకవచన ఆజ్ఞకూ తరువాత వచ్చే బహువచన సంబోధనకూ మధ్య ఉన్న మార్పును పాఠ్యంలోను పాదటిప్పణిలోను నిలిపాం.
