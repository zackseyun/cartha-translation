id: DEU.11.17
reference: Deuteronomy 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: te
  text: అప్పుడు యాహ్వే కోపం మీ మీద రగులుతుంది[a]. ఆయన ఆకాశాన్ని మూసివేస్తాడు; వర్షం కురవదు, నేల తన పంటను ఇవ్వదు. యాహ్వే మీకు ఇస్తున్న ఆ మంచి దేశం నుండి మీరు త్వరగా నశించిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “యాహ్వే ముక్కు/కోపం మీ మీద మండుతుంది.” ఇది తీవ్రమైన కోపాన్ని తెలిపే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: అప్పుడు యెహోవా కోపం మీ మీద రగులుతుంది
  rationale: חָרָה אַף అనే హెబ్రీ నుడికారం కోపం మండడాన్ని సూచిస్తుంది. ‘కోపం ... రగులుతుంది’ అనే రూపం మూలంలోని రూపకాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో తీవ్ర ఆగ్రహాన్ని వ్యక్తం చేస్తుంది. ఆరంభంలోని wawను ముందటి హెచ్చరికకు పరిణామంగా ‘అప్పుడు’ అని ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ అనే లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: ఆయన ఆకాశాన్ని మూసివేస్తాడు
  rationale: వర్షాన్ని నిలిపివేయడానికి ఆకాశం మూయబడుతుందనే మూలభాషా చిత్రాన్ని నిలుపుతుంది. హెబ్రీ బహువచన రూపాన్ని సహజ తెలుగు వాడుక ప్రకారం ‘ఆకాశం’గా ఇచ్చాం.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: వర్షం కురవదు
  rationale: అక్షరార్థమైన ‘వర్షం ఉండదు’ కంటే, తెలుగులో వర్షాభావాన్ని సహజంగా తెలిపే ‘వర్షం కురవదు’ను ఎంచుకున్నాం; ఇది ముందున్న ఆకాశం మూయబడటానికి ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָאֲדָמָה
  choice: నేల
  rationale: ఇక్కడ אֲדָמָה సాగుకు సంబంధించిన నేలను సూచిస్తుంది; తరువాత వచ్చే הָאָרֶץ అనే దేశం/భూభాగం పదంతో ఉన్న భేదాన్ని ‘నేల’ మరియు ‘దేశం’ ద్వారా నిలిపాం.
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: తన పంటను ఇవ్వదు
  rationale: יְבוּלָהּ అంటే నేల ఇచ్చే దిగుబడి లేదా పంట. ‘తన పంటను ఇవ్వదు’ మూలంలోని ‘ఇవ్వడం’ అనే భావాన్ని కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: మీరు త్వరగా నశించిపోతారు
  rationale: אבד ఇక్కడ నిబంధనాత్మక తీర్పు వల్ల ప్రజలు దేశంలో నిలవలేక నశించడాన్ని విస్తృతంగా సూచిస్తుంది. ‘నశించిపోతారు’ తీవ్రతను నిలుపుతుంది గాని, మరణం లేదా బహిష్కరణ అనే ఒక్క విధానానికే అర్థాన్ని పరిమితం చేయదు; מְהֵרָהను ‘త్వరగా’గా ఇచ్చాం.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: ఆ మంచి దేశం నుండి
  rationale: מֵעַל తొలగింపును సూచించినా, తెలుగులో ‘దేశం మీద నుండి’ కంటే ‘దేశం నుండి’ సహజంగా ఉంటుంది. הָאָרֶץ‌ను ఇక్కడ వాగ్దాన దేశంగా ‘దేశం’ అని ఇచ్చి, ముందున్న אֲדָמָה (‘నేల’)తో భేదాన్ని నిలిపాం.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: యెహోవా మీకు ఇస్తున్న
  rationale: నֹתֵן అనే కృదంత రూపంలోని కొనసాగుతున్న/సన్నిహిత కార్యభావాన్ని ‘ఇస్తున్న’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: దైవకోపానికి సంబంధించిన మానవరూపక నుడికారం
  choice: యెహోవా కోపం మీ మీద రగులుతుంది
  alternative: యెహోవా మీ మీద కోపపడతాడు
  rationale: మూలంలోని ‘ముక్కు/కోపం మండుతుంది’ అనే నుడికార రూపకాన్ని పూర్తిగా సాదాసీదా చేయకుండా ‘కోపం రగులుతుంది’గా నిలిపాం. ఇది వచనం చెప్పే తీర్పు తీవ్రతను చూపుతుంది; దైవకోప స్వభావంపై అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: וַאֲבַדְתֶּם యొక్క తీర్పు స్వరూపం
  choice: నశించిపోతారు
  alternative: దేశం నుండి తొలగించబడతారు
  rationale: క్రియ నాశనం, మరణం, లేదా దేశం నుండి అదృశ్యమవడం వంటి విస్తృత పరిధిని కలిగి ఉండగలదు. సందర్భం దేశాన్ని కోల్పోవడాన్ని సూచించినప్పటికీ, ‘తొలగించబడతారు’ అని మాత్రమే చెప్పడం అర్థాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘నేల’–‘దేశం’ అనే పదభేదంతో אֲדָמָה–אֶרֶץ భేదాన్ని చూపాం. మూలంలోని కోపం మండడం, ఆకాశం మూయడం అనే రూపకాలను నిలిపాం; పొడవైన హెబ్రీ సమన్వయ వాక్యాన్ని తెలుగు పఠన సౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం.
