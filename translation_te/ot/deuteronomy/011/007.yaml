source:
  edition: WLC
  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: te
  text: ఎందుకంటే యాహ్వే చేసిన గొప్ప కార్యమంతటినీ మీ కళ్లే చూశాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “మీ కళ్లు—చూస్తున్నవి”; ఇది వారు స్వయంగా ప్రత్యక్ష సాక్షులని నొక్కిచెప్పే నిర్మాణం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో కారణార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: మీ కళ్లే చూశాయి
  rationale: ‘మీ కళ్లు—చూస్తున్నవి’ అనే గుర్తింపునిచ్చే హెబ్రీ నిర్మాణంలోని ప్రత్యక్ష సాక్ష్యపు ఉద్ఘాటనను ‘కళ్లే’ సహజంగా వ్యక్తం చేస్తుంది; సందర్భానుసారంగా కృదంతాన్ని భూతకాల క్రియగా అందించింది.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: కార్యమంతటినీ
  rationale: ఏకవచన నిర్మాణం యెహోవా చేసిన సమస్త కార్యాన్ని సమష్టిగా సూచిస్తుంది; ‘కార్యమంతటినీ’ ఆ సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించింది; బిరుదుతో భర్తీ చేయలేదు.
- source_word: הַגָּדֹל
  choice: గొప్ప
  rationale: కార్యం యొక్క మహత్తును నేరుగా తెలియజేస్తుంది; ‘శక్తిమంతమైన’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని జోడించదు.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: సరళమైన సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మీ కళ్లే’ అనే ఉద్ఘాటన మూలంలోని ప్రత్యక్ష సాక్ష్య భావాన్ని నిలుపుతుంది.
