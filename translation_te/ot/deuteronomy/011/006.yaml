source:
  edition: WLC
  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: te
  text: రూబేను కుమారుడైన ఎలీయాబు కుమారులైన దాతాను, అబీరాములకు ఆయన ఏమి చేశాడో—భూమి తన నోరు తెరిచి వారినీ, వారి ఇంటివారినీ[a], వారి గుడారాలనూ, వారి పాదాల దగ్గర ఉన్న సమస్తాన్నీ[b] ఇశ్రాయేలీయులందరి మధ్య ఎలా మింగివేసిందో—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి ఇళ్లను.” హీబ్రూ పదం వారి నివాసాలను గానీ, విస్తృతంగా వారి ఇంటివారిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి పాదాల దగ్గర ఉన్న సమస్త యెకూమ్‌ను.” యెకూమ్ అంటే ఉన్నది లేదా నిలిచినది; ఇక్కడ అది వారితో ఉన్న లేదా వారికి చెందిన మనుషులను, జీవులను, వస్తువులను సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: ఏమి చేశాడో
  rationale: సాధారణమైన ‘చేయు’ అనే అర్థాన్ని సహజమైన తెలుగు పునర్విమర్శ వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: రూబేను కుమారుడైన ఎలీయాబు కుమారులు
  rationale: మూలంలోని వంశావళి సంబంధాన్ని విశేషణంగా మార్చకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: భూమి తన నోరు తెరిచి
  rationale: హీబ్రూ మూలంలోని సజీవమైన మానవీకరణ రూపకాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: וַתִּבְלָעֵם
  choice: వారిని … మింగివేసిందో
  rationale: בלע అనే క్రియలోని ప్రత్యక్షమైన ‘మింగు’ చిత్రాన్ని నిలుపుతుంది.
- source_word: בָּתֵּיהֶם
  choice: వారి ఇంటివారిని
  rationale: ‘ఇళ్లు’ అనే అక్షరార్థం ఉన్నప్పటికీ, వెంటనే గుడారాలు వేరుగా పేర్కొనబడినందున ఇక్కడ కుటుంబం/ఇంటివారు అనే భావం సందర్భానికి అనుకూలం; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אָהֳלֵיהֶם
  choice: వారి గుడారాలను
  rationale: అరణ్య సందర్భానికి సరిపోయే ప్రత్యక్ష, స్పష్టమైన అనువాదం.
- source_word: כָּל־הַיְקוּם
  choice: సమస్త ఉనికిని
  rationale: అరుదైన היקום పదానికి ‘ఉన్నది/నిలిచినది’ అనే విస్తృత భావాన్ని సంకుచితం చేయకుండా ఉంచుతుంది; సందర్భసంబంధ వివరణ పాదసూచికలో ఇవ్వబడింది.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: వారి పాదాల దగ్గర ఉన్న
  rationale: ‘వారి పాదాల వద్ద’ అనే మూలవ్యక్తీకరణను నిలిపి, అది వెంటనున్నవారినో వారికి చెందినవాటినో సూచించవచ్చనే సందిగ్ధతను పాదసూచికలో కాపాడుతుంది.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి మధ్య
  rationale: సంఘటన ప్రజల నడుమ బహిరంగంగా జరిగిందనే ప్రాదేశిక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందటి వాక్యంలో ఉన్న ‘మీరు చూశారు’ అనే ప్రధాన క్రియపై ఆధారపడుతున్నందున తెలుగులో సంపూర్ణత కోసం దానిని చివర చేర్చాం. ‘భూమి తన నోరు తెరిచింది’ అనే మూల రూపకాన్ని నిలిపాం; అరుదైన ‘యెకూమ్’ పదంలోని నిజమైన విస్తృతతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
