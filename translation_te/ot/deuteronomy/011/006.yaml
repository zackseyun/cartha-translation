revisions:
- from: రూబేను కుమారుడైన ఎలీయాబు కుమారులు దాతాను, అబీరాములకు ఆయన ఏమి చేశాడో—భూమి తన నోరు తెరిచి, ఇశ్రాయేలీయులందరి మధ్య వారిని, వారి ఇంటివారిని[a], వారి గుడారాలను, వారి పాదాల దగ్గర ఉన్న సమస్త ఉనికిని[b] ఎలా మింగివేసిందో—మీరు చూశారు.
  to: రూబేను కుమారుడైన ఎలీయాబు కుమారులైన దాతాను, అబీరాములకు ఆయన ఏమి చేశాడో—భూమి తన నోరు తెరిచి వారినీ, వారి ఇంటివారినీ[a], వారి గుడారాలనూ, వారి పాదాల దగ్గర ఉన్న సమస్తాన్నీ[b] ఇశ్రాయేలీయులందరి మధ్య ఎలా మింగివేసిందో—
  rationale: తదుపరి వచనానికి చెందిన “మీరు చూశారు”ను తొలగించాము, ఎందుకంటే ఈ వచనం మూలంలో కొనసాగుతున్న వాక్యంలోని ఉపవాక్యం. వంశావళి పదబంధాన్ని తెలుగులో మరింత స్పష్టంగా క్రమబద్ధం చేశాము. “సమస్త ఉనికిని” స్థానంలో “వారి పాదాల దగ్గర ఉన్న సమస్తాన్నీ” ఉంచి, הַיְקוּם యొక్క విస్తృత, సందర్భోచిత అర్థాన్ని సహజమైన తెలుగులో కాపాడాము. పాదసూచికలు మూలంలోని అర్థసంభావ్యతలను నిలుపుతున్నందున మార్చలేదు.
