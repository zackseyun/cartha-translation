    rationale: הַיְקוּם ఇక్కడ నాశనమైన వారితో సంబంధమున్న సమస్తాన్ని సూచించే విస్తృత పదం. “ఉనికి” అనే నామవాచకం తెలుగులో అమూర్తంగా ఉంది; “సమస్తం” మూలంలోని విస్తృతతను మరింత సహజంగా నిలుపుతుంది.
