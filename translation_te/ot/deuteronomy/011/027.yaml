id: DEU.11.27
reference: Deuteronomy 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶֽת הַ/בְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: te
  text: ఆశీర్వాదం[a]—నేడు నేను మీకు ఆజ్ఞాపిస్తున్న మీ దేవుడైన యహ్వే ఆజ్ఞలను మీరు ఆలకిస్తే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ దేవుడైన యహ్వే ఆజ్ఞలకు విధేయులైనప్పుడు కలిగే ఆశీర్వాదం.’ హీబ్రూ వాక్యం ముందరి వచనంలోని నిర్మాణాన్ని కొనసాగిస్తూ, సంబంధవాచక పదాన్ని షరతు భావంలో ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆలకిస్తే’ అని అనువదించిన హీబ్రూ క్రియకు ‘విధేయులైతే’ అనే భావం కూడా ఉండవచ్చు; అది తరచుగా విని, దానికి అనుగుణంగా స్పందించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: ఆశీర్వాదం
  rationale: కర్మ సూచకంతో ఉన్న ఈ పదబంధం 26వ వచనంలోని ‘ఆశీర్వాదాన్ని, శాపాన్ని మీ ముందుంచుతున్నాను’ అనే వాక్యాన్ని కొనసాగిస్తుంది. మూలంలోని సంక్షిప్త, అధ్యాహార నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר
  choice: ఆలకరిస్తే అనే షరతులో వ్యక్తీకరించబడింది
  rationale: ఇది రూపరీత్యా సంబంధవాచక అవ్యయమైనా, ఇక్కడ ఆశీర్వాదం వర్తించే షరతును పరిచయం చేస్తుంది. తెలుగులో ‘-తే’ సహజంగా ఆ షరతును తెలియజేస్తుంది.
- source_word: תִּשְׁמְעוּ אֶל
  choice: ఆలకరిస్తే
  rationale: שׁמע అనే క్రియ వినడాన్ని సూచిస్తూ, ఈ నిబంధన సందర్భంలో దానికి స్పందించి విధేయత చూపడాన్ని కూడా అంతర్లీనంగా కలిగి ఉంది. ‘ఆలకరించు’ వినడం అనే ప్రాథమిక భావాన్ని కాపాడుతుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: దైవ నిబంధనకు సంబంధించిన అధికారపూర్వక ఆదేశాలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన స్వామ్యార్థాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ఈ రోజు నేను మీకు ఆజ్ఞాపిస్తున్న
  rationale: మోషే ప్రస్తుతం చేస్తున్న ఆజ్ఞాపనను సూచించే కృదంతపు కొనసాగుతున్న వర్తమాన భావాన్నీ, ‘ఈ రోజు’ అనే నిబంధనాత్మక తక్షణతనూ కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. కాబట్టి దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ‘Jehovah’కు సాధారణంగా సంబంధించిన ‘యెహోవా’ రూపాన్ని కాకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- issue: ఆశీర్వాదానికి విధేయతతో ఉన్న సంబంధం
  choice: షరతుగా ‘ఆలకరిస్తే’
  alternative: ‘ఆజ్ఞలను ఆలకించే ఆశీర్వాదం’ అనే సంబంధవాచక నిర్మాణం
  rationale: אֲשֶׁר రూపరీత్యా సంబంధవాచకమైనప్పటికీ, సందర్భంలో అది ఆశీర్వాదం లభించే షరతును వ్యక్తం చేస్తుంది. అయితే ‘ఆలకరించు’ ద్వారా వినడం మరియు విధేయత మధ్యనున్న మూలపాఠపు భావసాంద్రతను పూర్తిగా ఒక్క అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ‘ఆశీర్వాదం’ అనే అధ్యాహార పదబంధాన్ని ముందుంచి, డ్యాష్ ద్వారా దాని షరతును స్పష్టంగా అనుసంధానించాం. ‘ఆలకరించు’ కొద్దిగా ఉన్నతమైనదైనా సుపరిచితమైన పదం; ఇది వినడం–విధేయత అనే ద్వంద్వ భావాన్ని నిలుపుతుంది.
