lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: మూతికి చిక్కం వేయకూడదు
  rationale: హీబ్రూ నిషేధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగు న్యాయశైలిలో వ్యక్తపరుస్తుంది. חסם అంటే జంతువు తినకుండా దాని మూతిని కట్టడం లేదా చిక్కం వేయడం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: వ్యవసాయ పనిలో, ప్రత్యేకంగా ధాన్యం నూర్చడంలో ఉపయోగించే గోవుజాతి మగ పనిజంతువును సందర్భానుగుణంగా సూచిస్తుంది.
- source_word: בְּדִישׁוֹ
  choice: ధాన్యం నూర్చుతున్న
  rationale: అక్షరార్థంగా ‘అది నూర్చడంలో’ అనే కాలసంబంధ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘తొక్కుతున్నప్పుడు’ అనేది సాధ్యమైన సందర్భార్థ ప్రత్యామ్నాయం.
