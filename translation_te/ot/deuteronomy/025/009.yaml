  to: 'అప్పుడు అతని సహోదరుని విధవరాలు పెద్దల సమక్షంలో[a] అతని దగ్గరకు వచ్చి, అతని కాలినుండి చెప్పును తీసివేసి, అతని ముఖంపై ఉమ్మివేసి[b], జవాబుగా ఇలా చెప్పాలి: “తన సహోదరుని ఇంటిని నిలబెట్టని మనిషికి ఇలాగే చేయబడుతుంది.”[c]'
