  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: te
  text: 'అప్పుడు అతని సహోదరుని విధవరాలు పెద్దల సమక్షంలో[a] అతని దగ్గరకు వచ్చి, అతని కాలినుండి చెప్పును తీసివేసి, అతని ముఖంపై ఉమ్మివేసి[b], జవాబుగా ఇలా చెప్పాలి: “తన సహోదరుని ఇంటిని నిలబెట్టని మనిషికి ఇలాగే చేయబడుతుంది.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పెద్దల కళ్ల ఎదుట.”
    reason: literal_rendering
  - marker: b
    text: లేదా, “అతని ఎదుట ఉమ్మివేసి.” కొందరు వ్యాఖ్యాతలు హీబ్రూ పదబంధాన్ని అతని ముఖంపై నేరుగా కాకుండా, అతని ముందు ఉమ్మివేయడంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: “తన సహోదరుని ఇంటిని నిలబెట్టడం” అంటే లేవిరేట్ వివాహం ద్వారా అతని కుటుంబ వంశాన్ని, ఇంటివారిని కొనసాగించడం.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: అతని అన్నదమ్ముని విధవరాలు
  rationale: లేవిరేట్ వివాహ సందర్భంలో ఇది సాధారణంగా ఏ వదిననో మరదలనో కాక, మరణించిన అన్నదమ్ముని విధవరాలిని సూచిస్తుంది. ‘అన్నదమ్ముడు’ అన్నది హీబ్రూ אָחִיו లోని అన్న/తమ్ముడు అనే అస్పష్టతను కాపాడుతుంది.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: పెద్దల సమక్షంలో
  rationale: అక్షరార్థంగా ‘పెద్దల కళ్ల ఎదుట’; ఈ న్యాయచర్య బహిరంగంగా, సాక్షుల ఎదుట జరుగుతుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: అతని కాలినుండి చెప్పును తీసివేసి
  rationale: חָלַץ ఇక్కడ పాదరక్షను తొలగించడాన్ని సూచిస్తుంది. హీబ్రూలో ఏకవచనం ఉన్నందున ‘చెప్పును’ అని ఏకవచనంగా ఉంచబడింది.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: అతని ముఖంపై ఉమ్మివేసి
  rationale: בְּפָנָיו యొక్క సూటి భావం వ్యక్తి ముఖంపై ఉమ్మివేయడం. అవమానకరమైన ఆచార తీవ్రతను తగ్గించకుండా మూలపాఠాన్ని అనుసరిస్తుంది; ‘అతని ఎదుట’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: ఇలా ప్రకటించాలి
  rationale: హీబ్రూ న్యాయ/కథన సూత్రంలోని రెండు క్రియలను అక్షరాలా ‘జవాబిచ్చి చెప్పాలి’ అనడం తెలుగులో అసహజం. అధికారిక ప్రతిస్పందన భావాన్ని ‘ప్రకటించాలి’ సహజంగా అందిస్తుంది.
- source_word: כָּכָה יֵעָשֶׂה
  choice: ఇలాగే చేయబడుతుంది
  rationale: హీబ్రూ నిష్క్రియ నిర్మాణాన్ని, ఆచారపూర్వక ప్రకటన స్వరాన్ని నిలుపుతుంది.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: తన అన్నదమ్ముని ఇంటిని నిలబెట్టని
  rationale: ‘ఇల్లు కట్టడం’ అనే హీబ్రూ రూపకాన్ని పూర్తిగా వివరణగా మార్చకుండా, తెలుగులో వంశం/కుటుంబాన్ని కొనసాగించడం అనే భావాన్ని సూచించే ‘ఇంటిని నిలబెట్టడం’గా ఇచ్చింది.
theological_decisions:
- issue: בְּפָנָיו అనే అవమాన సూచక పదబంధాన్ని మృదువుగా అనువదించాలా?
  choice: అతని ముఖంపై ఉమ్మివేసి
  alternative: అతని ఎదుట ఉమ్మివేసి
  rationale: మూల హీబ్రూ పదబంధపు సూటి భావానికి ప్రాధాన్యం ఇచ్చి, ఆ న్యాయపరమైన అవమాన ఆచారాన్ని మృదువుపరచలేదు. అయితే భిన్నంగా అర్థం చేసుకునే వీలును పాదసూచికలో కాపాడింది.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలి వాడబడింది. ‘అన్నదమ్ముడు’ ద్వారా אָח యొక్క అన్న/తమ్ముడు అస్పష్టతను నిలిపాం. గమనిక: ప్రధాన పాఠంలో [a], [b] మాత్రమే ఉన్నాయి; సమర్పించిన పాదసూచికలలో [c] కూడా ఉన్నందున ప్రచురణకు ముందు ముఖంపై/ఎదుట ప్రత్యామ్నాయ గమనికను [a] లేదా [b]తో సరిపోల్చి పునఃక్రమీకరించాలి.'
