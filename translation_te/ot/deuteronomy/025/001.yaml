source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: te
  text: మనుషుల మధ్య వివాదం ఉండి, వారు న్యాయస్థానానికి వస్తే,[a] న్యాయాధిపతులు వారికి తీర్పు తీర్చి, నిర్దోషికి నిర్దోషిగా తీర్పు చెప్పి, దోషిని దోషిగా ప్రకటించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషుల మధ్య వివాదం ఉన్నప్పుడు, వారు న్యాయవిచారణకు వచ్చినప్పుడు.” హీబ్రూ పదబంధానికి అక్షరార్థం, “తీర్పు దగ్గరకు.”
    reason: షరతు (‘ఉంటే/వస్తే’) లేదా కాలార్థం (‘ఉన్నప్పుడు/వచ్చినప్పుడు’) అనే సాధ్యమైన భేదాన్ని, అలాగే సందర్భానుసారంగా ‘న్యాయస్థానం’గా అనువదించిన పదబంధాన్ని తెలియజేయడం.
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నీతిమంతుణ్ణి నీతిమంతుడని ప్రకటించి, దుష్టుణ్ణి దుష్టుడని ప్రకటించాలి”; ఇక్కడ ఇవి న్యాయస్థానంలో ఒకరిని నిర్దోషిగా, మరొకరిని దోషిగా తీర్పు చెప్పే పదాలు.
    reason: మూలంలోని צדק/רשע పదజాలాన్ని మరియు దాని న్యాయపరమైన, ప్రకటనాత్మక అర్థాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: ఏర్పడి … వస్తే
  rationale: ఇది న్యాయనియమంలోని షరతును పరిచయం చేస్తుంది. తెలుగులో ‘వస్తే’ అనే షరతు రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; ‘ఏర్పడినప్పుడు’ అనే కాలార్థం కూడా సాధ్యమే.
- source_word: רִיב
  choice: వివాదం
  rationale: న్యాయపరమైన తగాదా లేదా వ్యాజ్యాన్ని సూచిస్తుంది. ‘వివాదం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అతిగా సాంకేతికంగా అనిపించదు.
- source_word: בֵּין אֲנָשִׁים
  choice: మనుషుల మధ్య
  rationale: హీబ్రూ పదబంధం పురుష బహువచనంలో ఉంది. ‘మనుషులు’ మూలంలోని లింగరూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְנִגְּשׁוּ אֶל־הַמִּשְׁפָּט
  choice: వారు న్యాయస్థానానికి వస్తే
  rationale: అక్షరార్థంగా ‘తీర్పు/న్యాయవిచారణ దగ్గరకు వచ్చి’ అనే భావం. సందర్భంలో న్యాయవిచారణకు హాజరవడాన్ని ‘న్యాయస్థానానికి వస్తే’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּשְׁפָטוּם
  choice: న్యాయాధిపతులు వారికి తీర్పు తీర్చి
  rationale: హీబ్రూలో కర్త స్పష్టంగా చెప్పబడకపోయినా బహువచన క్రియ ‘వారు వారికి తీర్పు తీర్చాలి’ అని ఉంది; న్యాయస్థాన సందర్భం కర్తగా న్యాయాధిపతులను సూచిస్తుంది. తెలుగులో స్పష్టత కోసం కర్తను చేర్చాం.
- source_word: וְהִצְדִּיקוּ אֶת־הַצַּדִּיק
  choice: నిర్దోషిని నిర్దోషిగా ప్రకటించి
  rationale: ఇక్కడ హిఫీల్ క్రియ నైతికంగా నీతిమంతునిగా మార్చడం కాదు, న్యాయవిచారణలో ఒకరు సరి/నిర్దోషి అని ప్రకటించడం. పదపునరుక్తి మూలంలోని క్రియ–నామవాచక జతను ప్రతిబింబిస్తుంది.
- source_word: וְהִרְשִׁיעוּ אֶת־הָרָשָׁע
  choice: దోషిని దోషిగా ప్రకటించాలి
  rationale: న్యాయపరమైన సందర్భంలో దోషిగా తీర్పు ఇవ్వడాన్ని సూచిస్తుంది. ఇది ముందున్న ‘నిర్దోషిగా ప్రకటించి’ అనే సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: צדק/רשע పదజాలానికి న్యాయపరమైన భావమా, సాధారణ నైతిక భావమా
  choice: ‘నిర్దోషిని నిర్దోషిగా ప్రకటించి, దోషిని దోషిగా ప్రకటించాలి’ అనే న్యాయస్థాన తీర్పు భావం
  alternative: ‘నీతిమంతుణ్ణి నీతిమంతుడిగా, దుష్టుణ్ణి దుష్టుడిగా తీర్చాలి’ అనే విస్తృత నైతిక వర్ణన
  rationale: సమీప సందర్భం న్యాయస్థానం, న్యాయవిచారణ, తీర్పు గురించి ఉంది. అందువల్ల ఈ పదజాలం వ్యక్తులలో నైతిక స్థితిని కలిగించడం కాకుండా, ఈ వివాదంలో ఎవరు నిర్దోషి మరియు ఎవరు దోషి అని న్యాయపరంగా ప్రకటించడాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన శైలి. ‘న్యాయాధిపతులు’ అనే కర్తను సందర్భం నుంచి స్పష్టత కోసం చేర్చాం. ప్రధాన వాక్యంలో సులభంగా అర్థమయ్యే ‘నిర్దోషి/దోషి’ పదాలను వాడి, మూలంలోని ‘నీతిమంతుడు/దుష్టుడు’ జతను పాదసూచికలో నిలిపాం.
