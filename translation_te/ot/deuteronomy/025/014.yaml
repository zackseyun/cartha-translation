source:
  edition: WLC
  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ בְּ/בֵיתְ/ךָ֖ אֵיפָ֣ה וְ/אֵיפָ֑ה גְּדוֹלָ֖ה וּ/קְטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: te
  text: నీ ఇంట్లో పెద్ద ఏఫా కొలతను, చిన్న ఏఫా కొలతను ఉంచుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఏఫా అనేది ప్రాచీన హెబ్రీయుల పొడి పదార్థాల కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: ఉంచుకోకూడదు
  rationale: నిషేధార్థకమైన היה క్రియతో దత్తివ నిర్మాణం అక్షరార్థంగా ‘నీకు ఉండకూడదు’ అని ఉన్నా, వస్తువులను కలిగి ఉండడాన్ని నిషేధించే ఈ సందర్భంలో ‘ఉంచుకోకూడదు’ సహజమైన ఆధునిక తెలుగు న్యాయశైలిని అందిస్తుంది.
- source_word: בְּבֵיתְךָ
  choice: నీ ఇంట్లో
  rationale: בַּיִת ఇక్కడ కొలతలను ఉంచే భౌతిక గృహాన్ని సూచిస్తుంది; కాబట్టి ‘నీ కుటుంబంలో’ కంటే ‘నీ ఇంట్లో’ మూలార్థానికి దగ్గరగా ఉంది.
- source_word: אֵיפָה וְאֵיפָה
  choice: రెండు రకాల ఏఫా కొలతలు
  rationale: పునరుక్తి వేర్వేరు ప్రమాణాలుగల రెండు ఏఫా కొలతలను సూచిస్తుంది. ‘ఏఫా’ అనే ప్రాచీన ఘనపరిమాణ ప్రమాణాన్ని నిలుపుతూ, తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘రెండు రకాల…కొలతలు’ అని అనువదించబడింది.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: ఒకటి పెద్దది, మరొకటి చిన్నది
  rationale: స్త్రీలింగ విశేషణాలు రెండు ఏఫా కొలతలకు సంబంధించినవి. తెలుగు పాఠకుడికి వ్యత్యాసం సహజంగా, స్పష్టంగా వినిపించేందుకు ఈ జత నిర్మాణం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి వాడబడింది. నిజాయితీ లేని ద్వంద్వ కొలతల సూచనను వివరించి విస్తరించకుండా మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపింది.
