    text: ఏఫా అనేది ప్రాచీన హెబ్రీయుల పొడి పదార్థాల కొలమానం.
    reason: cultural_note
  revision_rationale: The revision preserves the Hebrew’s repeated “ephah” and its large/small contrast more directly, while retaining clear modern Telugu legal phrasing. The cultural note is adjusted to identify the unit accurately as a dry measure.
