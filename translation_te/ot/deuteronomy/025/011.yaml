  text: כִּֽי יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/קָֽרְבָה֙ אֵ֣שֶׁת הָֽ/אֶחָ֔ד לְ/הַצִּ֥יל אֶת אִישָׁ֖/הּ מִ/יַּ֣ד מַכֵּ֑ה/וּ וְ/שָׁלְחָ֣ה יָדָ֔/הּ וְ/הֶחֱזִ֖יקָה בִּ/מְבֻשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: te
  text: ఒక పురుషుడు తన సహోదరునితో పోట్లాడుతున్నప్పుడు,[a] వారిలో ఒకరి భార్య తన భర్తను కొడుతున్న మరొకని చేతిలోనుండి అతనిని విడిపించడానికి దగ్గరకు వచ్చి, తన చెయ్యి చాపి అతని మర్మాంగాలను పట్టుకుంటే,[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరుడు’ అంటే ఇక్కడ రక్తసంబంధ సోదరుడు మాత్రమే కాక, తోటి వ్యక్తి లేదా స్వజాతీయుడు కూడా కావచ్చు.
    reason: cultural_note
  - marker: d
    text: హీబ్రూలో ‘మర్మాంగాలు’ అనే పదం పురుషుని జననాంగాలను మర్యాదాపూర్వకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: ఇద్దరు పురుషులు ఒకరితో ఒకరు పోట్లాడుతున్నప్పుడు
  rationale: కేసు-న్యాయ సందర్భంలో כִּי కి ‘అప్పుడు/ఎప్పుడైతే’ అనే సందర్భార్థం సహజం; נצה నిఫ్అల్ పరస్పర శారీరక పోరాటాన్ని సూచిస్తుంది. అֲנָשִׁים ఇక్కడ పురుషులనే సూచిస్తుంది.
- source_word: אִישׁ וְאָחִיו
  choice: అంటే ఒకడు తన సహోదరునితో పోట్లాడుతున్నప్పుడు[a]
  rationale: హీబ్రూ పదబంధంలోని ‘తన సహోదరుడు’ అనే రూపాన్ని నిలిపి, ముందరి పరస్పర పోరాటాన్ని వివరిస్తూ సహజమైన తెలుగులో అందించాం; ఇక్కడ సహోదరుడు రక్తసంబంధ సోదరుడే కావాల్సిన అవసరం లేదు.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: వారిలో ఒకని భార్య ... దగ్గరకు వచ్చి
  rationale: ‘ఒకని భార్య’ అనే హీబ్రూ భావాన్ని తెలుగులో సూచన స్పష్టంగా ఉండేలా ‘వారిలో ఒకని భార్య’గా ఇచ్చాం.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: తన భర్తను ... విడిపించడానికి
  rationale: נצל హిఫ్ఈల్ ప్రమాదం లేదా దాడి నుండి రక్షించి విడిపించడాన్ని సూచిస్తుంది; ఈ భౌతిక సందర్భంలో ‘విడిపించడానికి’ సహజం.
- source_word: מִיַּד מַכֵּהוּ
  choice: అతనిని కొడుతున్నవాని చేతిలోనుండి
  rationale: ‘కొట్టేవాని చేతిలోనుండి’ అనే మూలంలోని సజీవమైన చేతి-రూపకాన్ని, దాడి కొనసాగుతున్న భావంతో నిలిపాం.
- source_word: וְשָׁלְחָה יָדָהּ וְהֶחֱזִיקָה
  choice: తన చెయ్యి చాపి ... పట్టుకుంటే
  rationale: చెయ్యి చాపడం, గట్టిగా పట్టుకోవడం అనే వరుస చర్యలను సహజమైన తెలుగు షరతు నిర్మాణంలో ఇచ్చాం.
- source_word: בִּמְבֻשָׁיו
  choice: అతని మర్మాంగాలను
  rationale: ఈ పదం పురుషుని జననాంగాలను మర్యాదాపూర్వకంగా సూచిస్తుంది; ‘మర్మాంగాలు’ ఆధునిక, గౌరవప్రదమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన సందర్భాన్ని స్పష్టంగా, గౌరవప్రదంగా అందించాం. వాక్యం 12వ వచనంలో కొనసాగుతుంది కాబట్టి చివర కామాను ఉంచాం. మూలంలోని శరీర సంబంధ సూచనను అస్పష్టపరచకుండా ‘మర్మాంగాలు’ అనే మర్యాదాపూర్వక పదాన్ని వాడాం.
