source:
  edition: WLC
  text: וְ/קָֽרְאוּ ל֥/וֹ זִקְנֵי עִיר֖/וֹ וְ/דִבְּר֣וּ אֵלָ֑י/ו וְ/עָמַ֣ד וְ/אָמַ֔ר לֹ֥א חָפַ֖צְתִּי לְ/קַחְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: te
  text: అప్పుడు అతని పట్టణపు పెద్దలు అతన్ని పిలిచి అతనితో మాట్లాడాలి. అతడు తన మాటపైనే నిలిచి, “ఆమెను తీసుకోవడం నాకు ఇష్టం లేదు” అని చెబితే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఈ సందర్భంలో మరింత స్పష్టంగా, “ఆమెను వివాహం చేసుకోవడం.” హీబ్రూలో అక్షరార్థంగా “ఆమెను తీసుకోవడం” అని ఉంది; స్త్రీని వివాహం చేసుకోవడానికి ఇది సాధారణంగా వాడే పదప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: అతన్ని పిలిపించి
  rationale: న్యాయపరమైన ప్రక్రియలో పెద్దలు అతన్ని తమ ఎదుటకు రప్పించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: זִקְנֵי עִירוֹ
  choice: అతని పట్టణ పెద్దలు
  rationale: זִקְנֵי అనేది పౌర నాయకులను సూచిస్తుంది; עִיר నగరం లేదా పట్టణం కావచ్చు. ఈ సామాజిక సందర్భంలో ‘పట్టణ పెద్దలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: అతనితో మాట్లాడాలి
  rationale: అతనిని నేరుగా ఉద్దేశించి పెద్దలు మాట్లాడే అధికారిక చర్యను సరళంగా వ్యక్తం చేస్తుంది.
- source_word: וְעָמַד
  choice: అయినా అతడు తన మాట మీద నిలబడి
  rationale: అక్షరార్థమైన ‘నిలబడి’ అనే రూపకాన్ని నిలుపుతూ, పెద్దలు మాట్లాడిన తరువాత కూడా అతడు తన నిరాకరణలో స్థిరంగా ఉండే సందర్భార్థాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְאָמַר
  choice: అని చెబితే
  rationale: న్యాయ నియమంలోని షరతుతో కూడిన వరుస చర్యను సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: לֹא חָפַצְתִּי
  choice: నాకు ఇష్టం లేదు
  rationale: חפץ లోని కోరుకోవడం లేదా సుముఖత చూపడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో ఇస్తుంది; కేవలం చట్టపరమైన అసమ్మతిగా దాన్ని కుదించదు.
- source_word: לְקַחְתָּהּ
  choice: ఆమెను తీసుకోవడం
  rationale: హీబ్రూ ‘ఆమెను తీసుకోవడం’ అనే పదప్రయోగాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది వివాహం చేసుకోవడాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయ-కథన శైలి. ‘తన మాట మీద నిలబడి’ అనేది మూలంలోని ‘నిలబడటం’ అనే రూపకాన్నీ, సందర్భంలోని పట్టుదలనూ కలిపి తెలియజేస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
