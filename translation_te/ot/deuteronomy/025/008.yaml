- from: అప్పుడు అతని పట్టణ పెద్దలు అతన్ని పిలిపించి, అతనితో మాట్లాడాలి. అయినా అతడు తన మాట మీద నిలబడి, “ఆమెను తీసుకోవడం నాకు ఇష్టం లేదు” అని చెబితే,[a]
  to: అప్పుడు అతని పట్టణపు పెద్దలు అతన్ని పిలిచి అతనితో మాట్లాడాలి. అతడు తన మాటపైనే నిలిచి, “ఆమెను తీసుకోవడం నాకు ఇష్టం లేదు” అని చెబితే,[a]
