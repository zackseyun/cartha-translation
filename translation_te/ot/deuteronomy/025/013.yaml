  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: te
  text: నీ సంచిలో వేర్వేరు తూకపు రాళ్లు[a]—ఒకటి పెద్దది, ఒకటి చిన్నది—ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక రాయి, మరొక రాయి’; వ్యాపారంలో తూకం వేయడానికి ఉపయోగించిన రాతి బరువులను ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: నీకు ... ఉండకూడదు
  rationale: హీబ్రూ అస్తిత్వవాచక నిర్మాణం అక్షరార్థంగా ‘నీకు ఉండదు’ అని ఉన్నా, ధర్మశాస్త్ర నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఉండకూడదు’ తెలియజేస్తుంది.
- source_word: בְּכִיסְךָ
  choice: నీ సంచిలో
  rationale: כִּיס అనేది డబ్బు లేదా తూకపు రాళ్లు పెట్టుకునే సంచి/చిన్న సంచిని సూచిస్తుంది. ‘సంచి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి వాణిజ్య సందర్భానికి సరిపోతుంది.
- source_word: אֶבֶן וָאָבֶן
  choice: వేర్వేరు తూకపు రాళ్లు
  rationale: అక్షరార్థం ‘రాయి మరియు రాయి.’ ప్రాచీన వ్యాపారంలో కొలవడానికి వాడిన రాతి బరువులను ఇది సూచిస్తుంది; పునరుక్తి వాటి అసమానతను సూచిస్తుంది. ‘తూకపు రాళ్లు’ మూల రూపకాన్నీ సందర్భార్థాన్నీ నిలుపుతుంది.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: ఒకటి పెద్దది, ఒకటి చిన్నది
  rationale: స్త్రీలింగ విశేషణాలు ముందున్న రెండు రాతి తూకాలను సూచిస్తున్నాయి. తెలుగులో సూచ్య నామాన్ని స్పష్టంచేసేందుకు ‘ఒకటి ... ఒకటి ...’ సహజమైన రూపం.
theological_decisions: []
