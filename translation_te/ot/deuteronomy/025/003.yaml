- from: అతడు అతనిని నలభై దెబ్బలు[a] కొట్టవచ్చు; అంతకంటే ఎక్కువ కొట్టకూడదు. వీటికి మించి ఇంకా అనేక దెబ్బలు కొడితే, నీ సహోదరుడు నీ కళ్లముందు అవమానానికి గురవుతాడు.[b]
  to: అతడు అతనిని నలభై దెబ్బలు[a] కొట్టవచ్చు; కానీ అంతకంటే ఎక్కువ కొట్టకూడదు. లేకపోతే, వీటికి మించి అతనికి మరెన్నో దెబ్బలు కొట్టడం వల్ల నీ సహోదరుడు నీ కళ్లముందు అవమానింపబడతాడు.[b]
