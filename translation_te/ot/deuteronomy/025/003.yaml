source:
  edition: WLC
  text: אַרְבָּעִ֥ים יַכֶּ֖/נּוּ לֹ֣א יֹסִ֑יף פֶּן יֹסִ֨יף לְ/הַכֹּת֤/וֹ עַל אֵ֨לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְ/נִקְלָ֥ה אָחִ֖י/ךָ לְ/עֵינֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: te
  text: అతడు అతనిని నలభై దెబ్బలు[a] కొట్టవచ్చు; కానీ అంతకంటే ఎక్కువ కొట్టకూడదు. లేకపోతే, వీటికి మించి అతనికి మరెన్నో దెబ్బలు కొట్టడం వల్ల నీ సహోదరుడు నీ కళ్లముందు అవమానింపబడతాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నలభై కొరడా దెబ్బలు.” హెబ్రీ పాఠం నలభై అనే సంఖ్యను నిర్దిష్టంగా చెబుతుంది; అయితే కొట్టడానికి ఉపయోగించే సాధనాన్ని లేదా ప్రతి దెబ్బ యొక్క ఖచ్చిత రూపాన్ని ఇక్కడ పేర్కొనదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నీ సహోదరుడు” అంటే నిబంధన సమాజానికి చెందిన తోటి సభ్యుడు. శిక్ష పొందినవాడు అవమానింపబడకుండా ఉండేందుకు ధర్మశాస్త్రం శిక్షకు పరిమితి విధిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: అతడు అతనిని నలభై దెబ్బలు కొట్టవచ్చు
  rationale: నలభై అనే సంఖ్య శారీరక శిక్షకు గరిష్ఠ పరిమితిని సూచిస్తుంది. נכה హిఫీల్ రూపం న్యాయపరంగా అనుమతించబడిన కొట్టడాన్ని సందర్భంలో తెలియజేస్తుంది. హెబ్రీ పాఠం సాధనాన్ని పేర్కొననందున ‘కొరడా దెబ్బలు’ అని నిర్దిష్టం చేయకుండా ‘దెబ్బలు’ అని అనువదించాం.
- source_word: לֹא יֹסִיף
  choice: అంతకంటే ఎక్కువ కొట్టకూడదు
  rationale: יסף యొక్క మూలభావం ‘కలపడం/పెంచడం.’ తెలుగులో న్యాయపరమైన నిషేధాన్ని, నలభై పరిమితిని స్పష్టంగా తెలిపే సహజ రూపం ఇది.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: ఇంకా ... కొడితే
  rationale: פֶּן ప్రతికూల పరిణామాన్ని హెచ్చరిస్తుంది; יסף + క్రియార్థక రూపం చర్యను కొనసాగించడం లేదా మరింత చేయడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో షరతు-పరిణామ రూపం సహజంగా ఆ హెచ్చరికను అందిస్తుంది.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: వీటికి మించి ఇంకా అనేక దెబ్బలు
  rationale: మַכָּה רַבָּה వ్యాకరణపరంగా ఏకవచనమైనా ఇక్కడ విస్తారమైన లేదా మితిమీరిన కొట్టడాన్ని సమష్టిగా సూచిస్తుంది. ‘అనేక దెబ్బలు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְנִקְלָה
  choice: అవమానానికి గురవుతాడు
  rationale: קלה నిఫాల్ రూపం తక్కువగా, నీచంగా ఎంచబడటం లేదా గౌరవం కోల్పోవడాన్ని సూచిస్తుంది. ‘అవమానానికి గురవుతాడు’ వ్యక్తిగత అంతర్గత సిగ్గుకన్నా బహిరంగంగా దిగజార్చబడే భావాన్ని అందిస్తుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: మూలపాఠంలోని కుటుంబ సంబంధ పదాన్ని నిలుపుతూ, ద్వితీయోపదేశకాండంలోని నిబంధన సమాజానికి చెందిన తోటి సభ్యుని భావాన్ని కాపాడుతుంది.
- source_word: לְעֵינֶיךָ
  choice: నీ కళ్లముందు
  rationale: మూలంలోని దృశ్యాత్మక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: న్యాయశిక్షలో నిబంధన సమాజపు బంధుత్వ పదం
  choice: నీ సహోదరుడు
  alternative: నీ తోటి ఇశ్రాయేలీయుడు
  rationale: శిక్ష పొందిన వ్యక్తి కూడా సమాజంలో ‘సహోదరుడు’గానే ఉండే నైతిక గౌరవాన్ని హెబ్రీ పదం బలపరుస్తుంది. దాన్ని సాధారణ సామాజిక పదంగా మార్చకుండా కుటుంబ సంబంధ రూపాన్ని నిలిపాం.
- issue: నలభై దెబ్బల స్వరూపం
  choice: దెబ్బలు
  alternative: కొరడా దెబ్బలు
  rationale: మూల వచనం సంఖ్యను నిర్దిష్టంగా చెబుతుంది గాని, ఉపయోగించిన సాధనాన్ని లేదా ప్రతి దెబ్బ యొక్క ఖచ్చిత రూపాన్ని చెప్పదు. అందువల్ల పాఠంలో లేని శిక్షా సాధనాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘కొట్టవచ్చు/కొట్టకూడదు’ రూపాలు అనుమతి మరియు కఠిన పరిమితిని స్పష్టంగా వేరు చేస్తాయి. మూలంలోని ‘సహోదరుడు,’ ‘నీ కళ్లముందు’ అనే నైతికంగా బలమైన రూపకల్పనలను నిలుపుకున్నాం.
