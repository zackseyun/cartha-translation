- from: ఎందుకంటే, ఇలాంటివి చేసే ప్రతి ఒక్కరూ—అన్యాయం చేసే ప్రతి ఒక్కరూ—నీ దేవుడైన యాహ్వేకు అసహ్యులు.[a]
  to: ఎందుకంటే, ఇలాంటివి చేసే ప్రతి ఒక్కరూ, అన్యాయం[a] చేసే ప్రతి ఒక్కరూ, నీ దేవుడైన యాహ్వేకు అసహ్యకరమైనవారు.
  rationale: The revision replaces an ambiguous Telugu predicate with one that clearly conveys that those who do such things are abhorrent to Yahweh. It also moves the lexical-note anchor to the translated term it discusses. The source’s parallel participial phrasing, moral force, and divine name are retained.
