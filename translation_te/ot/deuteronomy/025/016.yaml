id: DEU.25.16
reference: Deuteronomy 25:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֣שֵׂה אֵ֑לֶּה כֹּ֖ל עֹ֥שֵׂה עָֽוֶל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: te
  text: ఎందుకంటే, ఇలాంటివి చేసే ప్రతి ఒక్కరూ, అన్యాయం[a] చేసే ప్రతి ఒక్కరూ, నీ దేవుడైన యాహ్వేకు అసహ్యకరమైనవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అన్యాయం” అని అనువదించిన హీబ్రూ పదానికి “తప్పు,” “అన్యాయం,” లేదా “అనీతిమంతమైన పని” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ ఇది ముఖ్యంగా మోసపూరిత వ్యాపారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆజ్ఞకు కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תוֹעֲבַת
  choice: అసహ్యులు
  rationale: దేవుని దృష్టిలో తీవ్రంగా హేయమైనవారు అనే బలమైన నైతిక భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; వాక్యంలోని వ్యక్తులను సూచించే నిర్మాణానికి అనుగుణంగా బహువచనం వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, 'నీ దేవుడైన యాహ్వే' అనే సహజ తెలుగు నామబంధాన్ని ఇస్తుంది.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ఇలాంటివి చేసే ప్రతి ఒక్కరూ
  rationale: పాల్గొనే క్రియారూపంలోని సాధారణ, సమగ్ర వర్గాన్ని 'ప్రతి ఒక్కరూ'తో నిలుపుతుంది; సందర్భంలోని మోసపూరిత కొలతలు, తూకాలను 'ఇలాంటివి' సూచిస్తుంది.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: అన్యాయం చేసే ప్రతి ఒక్కరూ
  rationale: మూలంలోని పునరుక్త 'చేసే ప్రతి ఒక్కరూ' నిర్మాణాన్ని నిలుపుతూ, עָוֶל యొక్క అన్యాయం/తప్పు అనే నైతిక మరియు సామాజిక భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా 'యాహ్వే'గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: תוֹעֲבַת యొక్క బలమైన నైతిక అర్థం
  choice: యాహ్వేకు అసహ్యులు
  alternative: యాహ్వే అసహ్యించుకుంటాడు
  rationale: హీబ్రూ నామవాచక విధేయ నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుతూ, ఇది కేవలం దేవుని భావోద్వేగ ప్రతిస్పందన కాక ఆయన దృష్టిలో వారి నైతిక స్థితిని ప్రకటిస్తుందని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గంభీరమైన శైలి. మూలంలోని రెండు సమాంతర participial పదబంధాల పునరుక్తిని డాష్‌లతో స్పష్టపరిచింది. రెండవ పురుష ఏకవచనమైన 'నీ'ను నిలిపింది.
