source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీ చుట్టూ ఉన్న శత్రువులందరి నుంచి నీకు విశ్రాంతి కలిగించినప్పుడు, నీ దేవుడైన యాహ్వే నీవు స్వాధీనం చేసుకోవడానికి వారసత్వంగా ఇస్తున్న దేశంలో, నీవు అమాలేకు జ్ఞాపకాన్ని[a] ఆకాశం కింద నుండి తుడిచివేయాలి; మరచిపోవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమాలేకు స్మరణను.”
    reason: זֵכֶר అనే పదాన్ని ‘జ్ఞాపకం’ లేదా ‘స్మరణ’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: కలిగించినప్పుడు
  rationale: భవిష్యత్తులో నెరవేరే పరిస్థితిని సూచించే కాలార్థక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హిఫిల్ రూపంలోని ‘విశ్రాంతి కలిగించు’ అనే కారణార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: నీ చుట్టూ ఉన్న శత్రువులందరి నుంచి
  rationale: ‘అందరు’ అనే సంపూర్ణతను, ‘చుట్టూ’ అనే ప్రదేశార్థాన్ని రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: వారసత్వంగా ఇస్తున్న
  rationale: నֹתֵן యొక్క కొనసాగుతున్న/సమీప భవిష్యత్ భావాన్ని, నַחֲלָה యొక్క ఒడంబడిక సంబంధమైన వారసత్వ భావాన్ని కాపాడుతుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: దేశాన్ని పొందుకొని అధీనంలో ఉంచుకోవడం అనే ירשׁ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּמְחֶה
  choice: తుడిచివేయాలి
  rationale: מחה లోని పూర్తిగా తుడిచివేయడం/లేకుండా చేయడం అనే గంభీరమైన ఆజ్ఞార్థాన్ని అతిగా వివరణ చేయకుండా అందిస్తుంది.
- source_word: זֵכֶר
  choice: జ్ఞాపకం
  rationale: ఒకరి గురించి మిగిలే జ్ఞాపకం లేదా స్మరణ అనే పదార్థాన్ని కాపాడుతుంది; విస్తృతమైన ‘సంతతి’ లేదా ‘అవశేషం’ అని నిర్ణయించి అస్పష్టతను తొలగించదు.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ఆకాశం కిందనుంచి
  rationale: హీబ్రూ రూపకాన్ని, దాని సమగ్ర పరిధిని నేరుగా నిలుపుతుంది.
- source_word: לֹא תִּשְׁכָּח
  choice: మరచిపోవద్దు
  rationale: మూలంలోని సంక్షిప్తమైన, ప్రత్యక్ష నిషేధాజ్ఞను సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా కాపాడుతుంది.
- issue: זֵכֶר עֲמָלֵק యొక్క పరిధి
  choice: అమాలేకు జ్ఞాపకం
  alternative: అమాలేకు స్మరణ; అమాలేకు పేరు/అవశేషం
  rationale: זֵכֶר ప్రధానంగా జ్ఞాపకం లేదా స్మరణను సూచిస్తుంది. ‘పేరు,’ ‘సంతతి,’ లేదా ‘అవశేషం’ అని విస్తరించడం సందర్భార్థ వివరణ కావచ్చు గాని పదం యొక్క నిజమైన భావపరిధిని అనవసరంగా కుదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ఆజ్ఞా స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం ఉపయోగించబడింది. మూలంలోని పునరుక్తి (‘నీ దేవుడైన యాహ్వే’) ఉద్దేశపూర్వకంగా నిలుపబడింది.
