revisions:
- from: మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు, దారిలో అమాలేకు మీకు చేసినదాన్ని జ్ఞాపకం చేసుకోండి.[a]
  to: మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు దారిలో అమాలేక్ మీకు చేసినదాన్ని జ్ఞాపకం చేసుకోండి.[a]
  rationale: The revision retains the source’s command, collective address, temporal clause, and non-specific description of Amalek’s act. It standardizes the proper name and corrects the footnote so that its alternative genuinely corresponds to ‘out of Egypt,’ without adding interpretive detail.
