  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זָכ֕וֹר אֵ֛ת אֲשֶׁר עָשָׂ֥ה לְ/ךָ֖ עֲמָלֵ֑ק בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: te
  text: మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు దారిలో అమాలేక్ మీకు చేసినదాన్ని జ్ఞాపకం చేసుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఐగుప్తు నుండి బయటికి వచ్చినప్పుడు.”
    reason: ‘ఐగుప్తు నుండి’కు ప్రత్యామ్నాయంగా, ఐగుప్తు నుండి బయటికి రావడం అనే భావాన్ని మరింత స్పష్టంగా వ్యక్తపరుస్తుంది.
lexical_decisions:
- source_word: זָכוֹר
  choice: జ్ఞాపకం చేసుకోండి
  rationale: זכר అనే క్రియ యొక్క కాల్ ఆజ్ఞార్థక ఏకవచన రూపం. సమస్త ఇశ్రాయేలును ఒక సమూహంగా ఉద్దేశించిన ఏకవచన ఆజ్ఞను గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: אֵת אֲשֶׁר
  choice: చేసినదాన్ని
  rationale: కర్మ సూచికతో కూడిన సంబంధబోధక పదం జ్ఞాపకం చేసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో క్రియానామ రూపం సహజంగా ఉంటుంది.
- source_word: עָשָׂה לְךָ
  choice: మీకు చేసినదాన్ని
  rationale: עשה + לְ ఇక్కడ ఇశ్రాయేలు వైపు ఉద్దేశించిన చర్యను సూచిస్తుంది. విరోధ చర్య అనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది; మూలంలో లేని ‘హాని’ వంటి పదాన్ని చేర్చలేదు.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: హీబ్రూ వ్యక్తి/జనసమూహ నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: ప్రయాణ మార్గం లేదా ప్రయాణ సందర్భాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּצֵאתְכֶם
  choice: మీరు ... బయలుదేరినప్పుడు
  rationale: בְּ తో కూడిన יצא క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ‘బయలుదేరినప్పుడు’ దానిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది. ‘నుండి’ మూలంలోని source భావాన్ని నేరుగా నిలుపుతుంది; ‘బయలుదేరినప్పుడు’ బయటకు రావడం అనే భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలి. హీబ్రూలో ఆజ్ఞ ఏకవచనంలో ఉన్నా అది సమూహమైన ఇశ్రాయేలును ఉద్దేశిస్తుంది; తెలుగులో సాధారణ బైబిలు సంభోదనకు అనుగుణంగా ‘మీరు/చేసుకోండి’ వాడబడింది. వాక్యాంతంలోని మసొరేటిక్ సోఫ్ పాసూక్‌ను సాధారణ తెలుగు విరామచిహ్నంతో ఇచ్చాం.
