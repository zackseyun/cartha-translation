id: DEU.25.2
reference: Deuteronomy 25:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֛ה אִם בִּ֥ן הַכּ֖וֹת הָ/רָשָׁ֑ע וְ/הִפִּיל֤/וֹ הַ/שֹּׁפֵט֙ וְ/הִכָּ֣ה/וּ לְ/פָנָ֔י/ו כְּ/דֵ֥י רִשְׁעָת֖/וֹ בְּ/מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: te
  text: అప్పుడు, దోషి దెబ్బలు తినడానికి అర్హుడైతే, న్యాయాధిపతి అతణ్ణి పడుకోబెట్టి, తన ఎదుట అతని అపరాధానికి తగినట్లుగా లెక్కించిన సంఖ్యలో[a] అతణ్ణి కొట్టించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంఖ్య ప్రకారం”; అంటే, అపరాధానికి తగినట్లుగా లెక్కించినన్ని దెబ్బలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: దెబ్బలు తినడానికి అర్హుడు
  rationale: ‘దెబ్బలకు కుమారుడు’ అనే హీబ్రూ న్యాయపరమైన నుడికారానికి సహజమైన తెలుగు రూపం; శారీరక శిక్షకు పాత్రుడనే భావాన్ని తెలియజేస్తుంది.
- source_word: הָרָשָׁע
  choice: దోషి
  rationale: ఈ న్యాయస్థాన సందర్భంలో తీర్పు పొందిన అపరాధిని సూచిస్తుంది. ‘దుష్టుడు’ అనే నైతిక భావం సాధ్యమైనా, ‘దోషి’ న్యాయపరమైన సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְהִפִּילוֹ
  choice: అతణ్ణి పడుకోబెట్టి
  rationale: న్యాయాధిపతి శిక్ష పొందేవాణ్ణి పడుకునేలా చేయడాన్ని సూచించే హిఫీల్ క్రియారూపాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַשֹּׁפֵט
  choice: న్యాయాధిపతి
  rationale: న్యాయపరమైన అధికారిని సూచించే ప్రామాణిక, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: וְהִכָּהוּ
  choice: అతణ్ణి కొట్టించాలి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతణ్ణి కొట్టాలి’ అని ఉన్నా, శిక్షను పర్యవేక్షించి అమలు చేయించే న్యాయాధిపతి పాత్రను తెలుగు కారణార్థక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: לְפָנָיו
  choice: తన ఎదుట
  rationale: శిక్ష న్యాయాధిపతి సమక్షంలో, అతని పర్యవేక్షణలో జరగాలనే భావాన్ని మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: అతని అపరాధానికి తగినట్లుగా
  rationale: శిక్ష అపరాధ తీవ్రతకు అనుపాతంగా ఉండాలనే న్యాయపరమైన భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּמִסְפָּר
  choice: లెక్క ప్రకారం
  rationale: దెబ్బలు లెక్కించబడిన సంఖ్యలో ఉండాలనే సంక్షిప్త హీబ్రూ వ్యక్తీకరణను దగ్గరగా నిలుపుతుంది; ఖచ్చిత భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో అనువదించబడింది. పురుష ఏకవచన సూచనను ‘అతడు/అతణ్ణి’ రూపాలతో నిలుపుకుంది.
