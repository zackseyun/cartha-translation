revisions:
- from: అప్పుడు, దోషి దెబ్బలు తినడానికి అర్హుడైతే, న్యాయాధిపతి అతణ్ణి పడుకోబెట్టి, తన ఎదుట అతని అపరాధానికి తగినట్లుగా లెక్క ప్రకారం[a] అతణ్ణి కొట్టించాలి.
  to: అప్పుడు, దోషి దెబ్బలు తినడానికి అర్హుడైతే, న్యాయాధిపతి అతణ్ణి పడుకోబెట్టి, తన ఎదుట అతని అపరాధానికి తగినట్లుగా లెక్కించిన సంఖ్యలో[a] అతణ్ణి కొట్టించాలి.
  rationale: The revision preserves the source’s legal and procedural meaning while making the expression for בְּמִסְפָּר more natural in modern Telugu. The footnote now offers a closer formal alternative and explains the counted, proportionate nature of the blows without adding a notion of a separately predetermined number.
