source:
  edition: WLC
  text: כִּֽי יֵשְׁב֨וּ אַחִ֜ים יַחְדָּ֗ו וּ/מֵ֨ת אַחַ֤ד מֵ/הֶם֙ וּ/בֵ֣ן אֵֽין ל֔/וֹ לֹֽא תִהְיֶ֧ה אֵֽשֶׁת הַ/מֵּ֛ת הַ/ח֖וּצָ/ה לְ/אִ֣ישׁ זָ֑ר יְבָמָ/הּ֙ יָבֹ֣א עָלֶ֔י/הָ וּ/לְקָחָ֥/הּ ל֛/וֹ לְ/אִשָּׁ֖ה וְ/יִבְּמָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: te
  text: అన్నదమ్ములు కలిసి నివసిస్తున్నప్పుడు, వారిలో ఒకడు కుమారుడు లేకుండా చనిపోతే[a], చనిపోయినవాని భార్య కుటుంబం వెలుపల ఉన్న పరాయి పురుషుణ్ణి పెళ్లి చేసుకోకూడదు[b]. ఆమె భర్త సోదరుడు ఆమె దగ్గరికి వెళ్లి[c], ఆమెను తన భార్యగా చేసుకొని, ఆమెపట్ల భర్త సోదరుని విధిని నిర్వర్తించాలి[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ప్రత్యేకంగా ‘కుమారుడు’ అని ఉంది; కొందరు ఈ నియమం యొక్క విస్తృత భావాన్ని ‘సంతానం లేదు’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘బయట పరాయి పురుషునికి భార్య కాకూడదు.’ ఇక్కడ ‘పరాయి పురుషుడు’ అంటే ఈ కుటుంబ బాధ్యతకు వెలుపల ఉన్నవాడు; తప్పనిసరిగా వేరే జాతివాడు కాదు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆమె దగ్గరికి వెళ్లడం’ అనేది దాంపత్య లైంగిక కలయికను సూచించే హీబ్రూ సభ్యోక్తి.
    reason: lexical_alternative
  - marker: d
    text: ఇక్కడ ‘భర్త సోదరుడు’ అంటే మరణించిన భర్తకు సహోదరుడు; అతడు పెద్దవాడా చిన్నవాడా అని హీబ్రూ పేర్కొనదు. అతడు విధవరాలిని వివాహం చేసుకొని కుటుంబ వంశాన్ని కొనసాగించే ఈ ఆచారాన్ని సాధారణంగా ‘మరిది వివాహం’ అని అంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: అన్నదమ్ములు కలిసి నివసిస్తున్నప్పుడు
  rationale: אַחִים ఇక్కడ పురుష సహోదరులను సూచిస్తుంది; తరువాతి బాధ్యత మృతుని సహోదరునిపై పడుతుంది. יַחְדָּו వారి ఉమ్మడి నివాసం లేదా సన్నిహిత గృహసంబంధాన్ని సూచిస్తుంది; దాని పరిధిని అనవసరంగా కుదించకుండా ‘కలిసి’ అని అనువదించాం.
- source_word: וּבֵן אֵין לוֹ
  choice: కుమారుడు లేకుండా
  rationale: హీబ్రూ మూలంలో సాధారణంగా ‘సంతానం’ అని కాకుండా ప్రత్యేకంగా ‘కుమారుడు’ అని ఉంది. మూలంలోని నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: אֵשֶׁת הַמֵּת
  choice: చనిపోయినవాని భార్య
  rationale: ఇది హీబ్రూ నిర్మాణానికి దగ్గరగా ఉండి, తెలుగులో సహజంగా అర్థమవుతుంది. ‘విధవరాలు’ భావపరంగా సరైనదైనా మూలంలోని పదనిర్మాణం కాదు.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: కుటుంబం వెలుపల ఉన్న పరాయి పురుషుణ్ణి
  rationale: הַחוּצָה అక్షరార్థంగా ‘బయటికి’ అని, זָר ఈ సందర్భంలో సంబంధిత కుటుంబ బాధ్యతకు వెలుపలివాడిని సూచిస్తాయి; జాతిపరంగా విదేశీయుడు అని తప్పనిసరిగా కాదు. ‘కుటుంబం వెలుపల’ అనేది చట్టపరమైన వ్యత్యాసాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יְבָמָהּ
  choice: ఆమె మరిది
  rationale: ఈ నామవాచకం ఇక్కడ మరణించిన భర్త సహోదరుణ్ణి ప్రత్యేకంగా సూచిస్తుంది. తెలుగులో ‘మరిది’ సహజమైన సంబంధపదం; దాని నిర్దిష్ట అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: יָבֹא עָלֶיהָ
  choice: ఆమె దగ్గరికి వెళ్లి
  rationale: ఇది దాంపత్య లైంగిక కలయికను సూచించే హీబ్రూ సభ్యోక్తి. ప్రధాన పాఠ్యంలో దాని రూపక స్వరాన్ని నిలిపి, అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: ఆమెను తన భార్యగా చేసుకొని
  rationale: ‘ఆమెను తనకొరకు భార్యగా తీసుకోవడం’ అనే మూలభావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיִבְּמָהּ
  choice: ఆమెపట్ల మరిది ధర్మాన్ని నెరవేర్చాలి
  rationale: ఈ ప్రత్యేక క్రియ మరణించిన సహోదరుని భార్యపట్ల సహోదరుడు నిర్వర్తించవలసిన వివాహ బాధ్యతను సూచిస్తుంది. సాంకేతిక పరిభాషను ప్రధాన పాఠ్యంలో పెట్టకుండా చట్టబద్ధమైన బాధ్యతను స్పష్టంగా తెలిపాం.
theological_decisions:
- issue: ‘కుమారుడు లేడు’ అనే షరతు పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘కుమారుడు’ అనే నిర్దిష్ట పదాన్ని నిలిపాం.
  alternative: విస్తృత చట్టపరమైన అన్వయాన్ని సూచిస్తూ ‘సంతానం లేదు’ అని అనువదించడం.
  rationale: మూల హీబ్రూ בֵּן అనే పదం ప్రత్యేకంగా ‘కుమారుడు’ అని చెబుతుంది. ‘సంతానం’ అని విస్తరించడం ద్వారా వ్యాఖ్యాన సంబంధిత ప్రశ్నను అనువాదమే పరిష్కరించకుండా, మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: మరిది వివాహ బాధ్యతకు సంబంధించిన ప్రత్యేక పరిభాష
  choice: ప్రధాన పాఠ్యంలో ‘మరిది ధర్మాన్ని నెరవేర్చాలి’ అనే అందరికీ అర్థమయ్యే భాషను వాడాం.
  alternative: ‘లేవిరేట్ వివాహం’ వంటి సాంకేతిక పదాన్ని ప్రధాన పాఠ్యంలో వాడడం.
  rationale: ప్రత్యేక చట్టపరమైన భావాన్ని కాపాడుతూ సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా చేశాం; సాంస్కృతిక వివరణను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘అన్నదమ్ములు,’ ‘మరిది,’ ‘మరిది ధర్మం’ వంటి సాధారణ సంబంధపదాలు పాఠ్యాన్ని సులభంగా ఉంచుతాయి. హీబ్రూ సభ్యోక్తి మరియు ‘కుమారుడు’ అనే నిర్దిష్ట పదం ప్రధాన పాఠ్యంలో నిలిపి, అవసరమైన వివరణలను పాదసూచికలకు పరిమితం చేశాం.
