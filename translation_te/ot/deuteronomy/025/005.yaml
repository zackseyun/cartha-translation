review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the explicit condition that the deceased has no son, the prohibition against marriage outside the family obligation, and the required action by the deceased man's brother. However, Telugu “మరిది” normally denotes a younger brother-in-law and therefore narrows the Hebrew יָבָם, which does not specify whether the husband's brother is older or younger.
  naturalness: The overall legal style is clear and modern. Replacing “మరిది ధర్మం” with wording based on “భర్త సోదరుడు” is both more exact and less culturally ambiguous in this context.
  terminology: “భర్త సోదరుడు” correctly represents the specified relationship without importing an age distinction. “భర్త సోదరుని విధి” naturally conveys the specialized legal obligation of וְיִבְּמָהּ. The explanatory note may retain the customary label “మరిది వివాహం,” provided it does not identify the levir himself merely as “మరిది.”
  issues:
  - severity: medium
    issue: “మరిది” narrows the relationship.
    rationale: In standard Telugu, “మరిది” generally refers to a younger brother-in-law. The Hebrew refers to the deceased husband's brother without an age qualification. The main text and explanatory note should use “భర్త సోదరుడు.”
  - severity: low
    issue: The final duty expression repeats the age-specific term.
    rationale: “మరిది ధర్మాన్ని” inherits the same unintended narrowing. “భర్త సోదరుని విధిని నిర్వర్తించాలి” preserves the legal force and the source relationship.
  revised_text: అన్నదమ్ములు కలిసి నివసిస్తున్నప్పుడు, వారిలో ఒకడు కుమారుడు లేకుండా చనిపోతే[a], చనిపోయినవాని భార్య కుటుంబం వెలుపల ఉన్న పరాయి పురుషుణ్ణి పెళ్లి చేసుకోకూడదు[b]. ఆమె భర్త సోదరుడు ఆమె దగ్గరికి వెళ్లి[c], ఆమెను తన భార్యగా చేసుకొని, ఆమెపట్ల భర్త సోదరుని విధిని నిర్వర్తించాలి[d].
