revisions:
- from: అన్నదమ్ములు కలిసి నివసిస్తున్నప్పుడు, వారిలో ఒకడు కుమారుడు లేకుండా చనిపోతే[a], చనిపోయినవాని భార్య కుటుంబం వెలుపల ఉన్న పరాయి పురుషుణ్ణి పెళ్లి చేసుకోకూడదు[b]. ఆమె మరిది ఆమె దగ్గరికి వెళ్లి[c], ఆమెను తన భార్యగా చేసుకొని, ఆమెపట్ల మరిది ధర్మాన్ని నెరవేర్చాలి[d].
  to: అన్నదమ్ములు కలిసి నివసిస్తున్నప్పుడు, వారిలో ఒకడు కుమారుడు లేకుండా చనిపోతే[a], చనిపోయినవాని భార్య కుటుంబం వెలుపల ఉన్న పరాయి పురుషుణ్ణి పెళ్లి చేసుకోకూడదు[b]. ఆమె భర్త సోదరుడు ఆమె దగ్గరికి వెళ్లి[c], ఆమెను తన భార్యగా చేసుకొని, ఆమెపట్ల భర్త సోదరుని విధిని నిర్వర్తించాలి[d].
  rationale: The revision removes the unintended younger-brother implication of “మరిది” while retaining the source’s legal relationship, the Hebrew euphemism in the main text, and the existing explanatory structure of the notes.
