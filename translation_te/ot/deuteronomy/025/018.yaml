language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁ֨ר קָֽרְ/ךָ֜ בַּ/דֶּ֗רֶךְ וַ/יְזַנֵּ֤ב בְּ/ךָ֙ כָּל הַ/נֶּחֱשָׁלִ֣ים אַֽחַרֶ֔י/ךָ וְ/אַתָּ֖ה עָיֵ֣ף וְ/יָגֵ֑עַ וְ/לֹ֥א יָרֵ֖א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: te
  text: నీవు అలసిపోయి, సొమ్మసిల్లి ఉన్నప్పుడు, దారిలో అతడు నిన్ను ఎదుర్కొని, నీ వెనుక వెనుకబడిపోయిన బలహీనులందరిపై వెనుకనుంచి దాడి చేసిన తీరును జ్ఞాపకం చేసుకో. అతడు దేవునికి భయపడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: నిన్ను ఎదుర్కొని
  rationale: ‘దారిలో కలుసుకోవడం/ఎదురుపడడం’ అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיְזַנֵּב
  choice: వెనుకనుంచి దాడి చేసిన
  rationale: ఈ క్రియకు సైన్యపు వెనుక భాగాన్ని కొట్టడం లేదా వెనుకబడినవారిని దాడి చేయడం అనే భావం ఉంది; కేవలం ‘చంపాడు’ అని మూలంలో లేని ఫలితాన్ని నిర్దిష్టం చేయలేదు.
- source_word: הַנֶּחֱשָׁלִים
  choice: బలహీనులందరిపై
  rationale: వెనుకబడిపోయిన బలహీనులను సూచించే పదం; ‘నీ వెనుక నడుస్తున్న’ అనే పరిసర పదాలతో వారి స్థితి స్పష్టమవుతుంది.
- source_word: עָיֵף וְיָגֵעַ
  choice: అలసిపోయి, సొమ్మసిల్లి
  rationale: రెండు సమీపార్థక పదాల తీవ్రతను నిలుపుతూ శారీరక అలసటను సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: అతడు దేవునికి భయపడలేదు
  rationale: మూలంలోని కర్త-క్రియ సంబంధాన్ని, దేవునిపట్ల భయభక్తి లేకపోవడాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవునికి భయపడలేదు’ అన్న వాక్యంలో కర్త
  choice: అతడు—అమాలేకును సూచించే ఏకవచన కర్త
  alternative: నీవు దేవునికి భయపడలేదు
  rationale: హీబ్రూ సందర్భం మరియు సాంప్రదాయ వాక్యవిభజన ప్రకారం అమాలేకు చేసిన క్రూర దాడికి ఈ మాట అనుసంధానమవుతుంది; సమీపంలోని ‘నీవు’ వ్యాకరణపరంగా సాధ్యమనే స్వల్ప అస్పష్టతను అనువాదంలో బలవంతంగా ముందుకు తేవలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ముందటి వచనం నుంచి కొనసాగుతున్న ఆజ్ఞను తెలుగులో సంపూర్ణంగా వినిపించేందుకు ‘జ్ఞాపకం చేసుకో’ చివర చేర్చబడింది.
