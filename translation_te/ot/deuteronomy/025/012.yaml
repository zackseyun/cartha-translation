translation:
  language: te
  text: ఆమె చేతిని నరికివేయాలి[a]; నీ కన్ను కనికరించకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె అరచేతిని.’ హీబ్రూ పదం ప్రత్యేకంగా అరచేతిని సూచించగలదు; అయితే ఈ సందర్భంలో ‘చేయి’ అనేది సహజమైన అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆమెను విడిచిపెట్టకూడదు.’ హీబ్రూలో అక్షరార్థంగా ‘నీ కన్ను కనికరించకూడదు’ అని ఉంది; ఇది జాలి చూపకపోవడం లేదా విడిచిపెట్టకపోవడం అనే భావాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: నరికివేయాలి
  rationale: קצץ అనే క్రియ అవయవాన్ని తెగనరికే ప్రత్యక్షమైన శిక్షను సూచిస్తుంది. ‘నరికివేయాలి’ మూలంలోని తీవ్రతను తగ్గించకుండా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; అనువదించలేదు]'
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదసమానం లేదు.
- source_word: כַּפָּהּ
  choice: ఆమె అరచేతిని
  rationale: כַּף ప్రధానంగా అరచేతిని సూచించగలదు; ఈ సందర్భంలో ‘అరచేతి’ అని అనువదించడం మూలంలోని శరీరభాగ సూచనను, దాని సాధ్యమైన నిర్దిష్టతను కాపాడుతుంది. విస్తృత అర్థమైన ‘చేయి’ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לֹא
  choice: కూడదు
  rationale: న్యాయవిధిలోని నిషేధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תָחוֹס
  choice: కనికరించకూడదు
  rationale: חוס అంటే కనికరించడం, జాలిపడడం లేదా విడిచిపెట్టడం. కన్నును ప్రస్తావించే హీబ్రూ నుడికారాన్ని నిలుపుతూ ‘కనికరించకూడదు’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עֵינֶךָ
  choice: నీ కన్ను
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘నీ కన్ను’ అంటుంది. ద్వితీయోపదేశకాండంలో కనిపించే ఈ స్పష్టమైన న్యాయ నుడికారాన్ని సాధారణ సర్వనామంగా మార్చకుండా నిలిపాం.
theological_decisions:
- issue: శిక్షా సూత్రంలోని ప్రత్యక్షత
  choice: ‘ఆమె అరచేతిని నరికివేయాలి; నీ కన్ను కనికరించకూడదు’ అనే ప్రత్యక్ష ఆజ్ఞను నిలుపుకోవడం
  alternative: ‘ఆమె చేయిని నరికివేసి, ఆమెపై జాలి చూపకూడదు’ అని భావానువాదం చేయడం
  rationale: ఇది ఇశ్రాయేలు న్యాయసంహితలోని ప్రత్యక్ష శాసనం. భావానువాదం మూలంలోని కఠినతను, ‘నీ కన్ను’ అనే న్యాయ నుడికారాన్ని మసకబార్చుతుంది. అందువల్ల మూలంలోని రూపాన్ని, తీవ్రతను సాధ్యమైనంత స్పష్టంగా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశాసన శైలిని ఉపయోగించాం. మూలంలోని రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’తో, ‘నీ కన్ను’ అనే హీబ్రూ నుడికారాన్ని యథాతథంగా నిలిపాం. ‘అరచేతి/చేయి’ అనే నిజమైన పదార్థ సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా చూపించాం.
