  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: te
  text: నీకు పూర్తియైన, న్యాయమైన తూకపు రాయి[a] ఉండాలి; నీకు పూర్తియైన, న్యాయమైన ఏఫా[b] ఉండాలి. తద్వారా నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలో నీవు దీర్ఘకాలం జీవిస్తావు (నీ దినాలు దీర్ఘమవుతాయి).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘రాయి’; వ్యాపారంలో తూకం వేయడానికి ఉపయోగించే రాతి బరువు.
    reason: lexical_alternative
  - marker: b
    text: ఏఫా అనేది ధాన్యం వంటి ఘనపదార్థాలను కొలిచే ప్రాచీన కొలమానం.
    reason: cultural_clarification
lexical_decisions:
- source_word: אֶבֶן
  choice: తూకపు రాయి
  rationale: మూలపదానికి అక్షరార్థం ‘రాయి’; ఈ వ్యాపార సందర్భంలో అది తూకం వేయడానికి ఉపయోగించే ప్రమాణపు రాయిని సూచిస్తుంది. ‘తూకపు రాయి’ concrete imageనూ ఉద్దేశిత అర్థాన్నీ నిలుపుతుంది.
- source_word: שְׁלֵמָה
  choice: పూర్తి ప్రమాణమున్న
  rationale: ఈ విశేషణం సంపూర్ణతను, ఏ లోటూ లేకపోవడాన్ని సూచిస్తుంది. తూకాలు, కొలతల సందర్భంలో ‘పూర్తి ప్రమాణమున్న’ అనేది తక్కువ చేయని సరైన పరిమాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וָצֶדֶק
  choice: న్యాయమైన
  rationale: צדק ఇక్కడ వ్యాపార లావాదేవీలలో న్యాయం, నీతి, సరైన ప్రమాణానికి అనుగుణత అనే భావాలను కలిగి ఉంది. ‘న్యాయమైన’ అనే పదం దాని నైతిక బలాన్ని కాపాడుతుంది.
- source_word: יִהְיֶה לָּךְ
  choice: నీ దగ్గర ... ఉండాలి
  rationale: అక్షరార్థంగా ‘నీకు ఉండును’; ధర్మశాస్త్ర సందర్భంలో ఇది ఆజ్ఞాత్మక అవసరాన్ని వ్యక్తపరుస్తుంది. ఆధునిక తెలుగులో ‘నీ దగ్గర ... ఉండాలి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֵיפָה
  choice: ఏఫా
  rationale: ఇది ప్రాచీన కాలంలోని నిర్దిష్ట ఘనపదార్థాల కొలమానం. ఖచ్చితమైన ఆధునిక సమాన కొలత లేనందున లిప్యంతరీకరణ చేసి పాదసూచికలో వివరణ ఇచ్చాం.
- source_word: לְמַעַן
  choice: అప్పుడు ... అవుతాయి
  rationale: ఈ సంధిపదం ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగులో ఈ వాక్య నిర్మాణం విధేయతకు అనుసంధానమైన ఫలితాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: నీ రోజులు దీర్ఘమవుతాయి
  rationale: ‘నీ రోజులు పొడిగించబడతాయి’ అనే హెబ్రీయ రూపకాన్ని వీలైనంతగా నిలుపుతూ, తెలుగులో గౌరవప్రదంగా అర్థమయ్యే విధంగా అనువదించాం.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో אֲדָמָה దేవుడు ఇస్తున్న నివాస దేశాన్ని సూచిస్తుంది. ఉపసర్గ עַל‌ను అక్షరార్థంగా ‘మీద’ అని అనువదించడం తెలుగులో అసహజం కాబట్టి సందర్భానుసారంగా ‘దేశంలో’ అని ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: హెబ్రీయ భాగధాతు దేవుని దానాన్ని కొనసాగుతున్న లేదా సమీపిస్తున్న కార్యంగా చూపుతుంది. ‘ఇస్తున్న’ ఆ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: విధేయతకు మరియు దీర్ఘాయుష్షుకు మధ్య సంబంధం
  choice: ‘అప్పుడు ... నీ రోజులు దీర్ఘమవుతాయి’ అని ఉద్దేశం/ఫలిత సంబంధాన్ని తెరిచి ఉంచడం
  alternative: దీర్ఘాయుష్షుకు యాంత్రికమైన హామీగా విపులీకరించడం
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. మూలపాఠంలోని నిబంధనాత్మక ఆశీర్వాద సంబంధాన్ని నిలుపుతూ, అది ఎలా అమలవుతుందో అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే సరళమైన వాక్య నిర్మాణం వాడబడింది. ‘తూకపు రాయి’ మూలంలోని concrete imageను నిలుపుతుంది; ‘ఏఫా’ అనే ప్రాచీన కొలమానానికి పాదసూచిక వివరణ ఇచ్చాం.
