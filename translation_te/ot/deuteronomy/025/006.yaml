id: DEU.25.6
reference: Deuteronomy 25:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: te
  text: ఆమె కనే మొదటిపుట్టిన కుమారుడు చనిపోయిన సహోదరుని పేరును నిలబెడతాడు[a]. అప్పుడు అతని పేరు ఇశ్రాయేలులోనుండి తుడిచివేయబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “చనిపోయిన సహోదరుని పేరు మీద నిలబడతాడు.” అంటే, అతడు ఆ సహోదరుని వంశాన్ని, ఇశ్రాయేలులో అతని స్థానాన్ని కొనసాగిస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: మొదటి కుమారుడు
  rationale: ఈ న్యాయసందర్భంలో పదం మొదట పుట్టిన మగబిడ్డను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మొదటి కుమారుడు’ సహజంగా ఉండి, ఉద్దేశించిన అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תֵּלֵד
  choice: ఆమె కనే
  rationale: స్త్రీలింగ ఏకవచన క్రియ విధవరాలినే కర్తగా చూపుతుంది; ‘ఆమె కనే’ దానిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: יָקוּם עַל שֵׁם
  choice: పేరును నిలబెట్టాలి
  rationale: అక్షరార్థంగా ‘పేరు మీద నిలబడాలి/లేవాలి’ అనే ఈ న్యాయపరమైన నుడికారం, మరణించిన సహోదరుని వంశపరమైన పేరు, స్థానం కొనసాగించడాన్ని సూచిస్తుంది. ‘పేరును నిలబెట్టాలి’ ఆ భావాన్ని సహజ తెలుగులో ఇస్తూ, కేవలం అదే వ్యక్తిగత పేరు పెట్టడమనే భావానికి పరిమితం చేయదు.
- source_word: אָחִיו הַמֵּת
  choice: చనిపోయిన తన సహోదరుని
  rationale: హీబ్రూ పదబంధానికి సూటియైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: יִמָּחֶה
  choice: తుడిచివేయబడదు
  rationale: נפעל రూపంలోని ‘తుడిచివేయబడుట/అంతరించిపోవుట’ భావాన్ని, ముఖ్యంగా పేరుకు సంబంధించిన రూపకాన్ని, ఈ ఎంపిక కాపాడుతుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుండి
  rationale: מן ఇక్కడ సమాజం నుండి తొలగింపును సూచిస్తుంది; ‘ఇశ్రాయేలులోనుండి’ దానిని నేరుగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘చనిపోయిన సహోదరుని పేరు మీద నిలబడాలి’ అనే లేవిరేట్ సూత్రం అర్థం
  choice: బిడ్డ మరణించిన సహోదరుని పేరును, వంశపరమైన స్థానాన్ని కొనసాగిస్తాడనే భావం
  alternative: బిడ్డకు మరణించిన సహోదరుని వ్యక్తిగత పేరునే పెట్టాలనే భావం
  rationale: ఈ న్యాయసందర్భంలో עַל שֵׁם అనేది కేవలం వ్యక్తిగత నామకరణం కంటే విస్తృతంగా, మరణించినవాని వంశం, సామాజిక-న్యాయ స్థానం, జ్ఞాపకం ఇశ్రాయేలులో కొనసాగడాన్ని సూచిస్తుంది. అందువల్ల తెలుగు అనువాదం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో భావస్పష్టంగా అందించి, దాని అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచాం.
