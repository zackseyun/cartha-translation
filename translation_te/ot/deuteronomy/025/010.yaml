source:
  edition: WLC
  text: וְ/נִקְרָ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵ֑ל בֵּ֖ית חֲל֥וּץ הַ/נָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/010.yaml
  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: te
  text: ఇశ్రాయేలులో అతని పేరు, “చెప్పు తీసివేయబడినవాని ఇల్లు”[a] అని పిలువబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “తీసివేయబడిన చెప్పు ఇల్లు.” ఆచారం వల్ల కలిగిన అవమానాన్ని తెలిపే ఈ పేరును హీబ్రూ చాలా సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא שְׁמוֹ
  choice: అతని ఇంటివారికి ... అని పేరు పెట్టబడుతుంది
  rationale: నిఫాల్ క్రియలోని నామకరణ భావాన్ని కర్మణి రూపంలో నిలిపాం. ఇక్కడ తరువాత వచ్చే ‘ఇల్లు’ అనే అవమాననామం వ్యక్తితోపాటు అతని కుటుంబాన్ని సూచిస్తున్నందున, సహజమైన తెలుగులో ‘అతని ఇంటివారికి’ అని వ్యక్తపరిచాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఈ పేరు వాడుకలో ఉండే సామాజిక పరిధిని בְּ సూచిస్తుంది; ‘ఇశ్రాయేలులో’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית
  choice: ఇల్లు
  rationale: בֵּית ఇక్కడ భవనాన్ని మాత్రమే కాక కుటుంబం లేదా వంశగృహాన్ని సూచించే స్థిరమైన అవమాననామంలో భాగం. సంక్షిప్తమైన హీబ్రూ రూపాన్ని నిలిపేందుకు ‘ఇల్లు’ వాడాం.
- source_word: חֲלוּץ הַנָּעַל
  choice: చెప్పు తీసివేయబడినవాని
  rationale: חלץ యొక్క కర్మణి కృదంతం, ముందు వచనంలోని ఆచారంలో చెప్పు తీసివేయబడిన వ్యక్తిని సూచిస్తుంది. హీబ్రూలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-సామాజిక నామకరణ శైలిని పాటించాం. ‘పాదరక్ష’ కంటే సాధారణ పాఠకులకు సహజమైన ‘చెప్పు’ను ఎంచుకున్నాం; వ్యాఖ్యానంలో అతిగా వివరణ జోడించకుండా హీబ్రూ అవమాననామపు సంక్షిప్తతను నిలిపాం.
