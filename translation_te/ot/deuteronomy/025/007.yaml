  - marker: b
    text: హెబ్రీయులో ఇది ‘నాకు మరిది కర్తవ్యం చేయడం’ అనే సాంకేతిక క్రియ. మరణించిన సోదరుని విధవరాలిని వివాహం చేసుకొని సంబంధిత కుటుంబ బాధ్యతను నిర్వర్తించడాన్ని సూచిస్తుంది.
    reason: cultural_note
  revision_rationale: సవరణలు అర్థాన్ని మార్చవు. అవి విధవరాలి దృష్టిలో బంధాన్ని నిస్సందిగ్ధం చేసి, హెబ్రీయ యిబ్బుమ్ సాంకేతిక క్రియలోని కుటుంబ-న్యాయ బాధ్యతను ఆధునిక సహజ తెలుగు ద్వారా స్పష్టం చేస్తాయి. మూలంలోని ‘నిరాకరిస్తున్నాడు’ మరియు ‘ఒప్పుకోవడం లేదు’ అనే రెండు వ్యక్తీకరణల భేదం అలాగే నిలిపాం.
