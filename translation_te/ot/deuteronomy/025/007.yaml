  source_fidelity: మూల హెబ్రీయ వాక్యనిర్మాణం, న్యాయసందర్భం, మరియు రెండు వేర్వేరు నిరాకరణ/అనంగీకార వ్యక్తీకరణలు మొత్తంగా సరిగానే ప్రతిఫలించాయి. అయితే యిబ్బుమ్ సాంకేతిక క్రియకు ప్రధాన పాఠ్యంలో ఉన్న ‘మరిదిగా నా పట్ల తన ధర్మాన్ని’ అనే ప్రయోగం కొంత అస్పష్టంగా, సహజత్వంలో బలహీనంగా ఉంది. ‘మరిది కర్తవ్యాన్ని నిర్వర్తించడానికి’ అనడం మూలంలోని సాంకేతిక బాధ్యతను మరింత నేరుగా తెలియజేస్తుంది.
  naturalness: ‘నా మరిది’ అనే పదం కొన్ని సందర్భాల్లో వయోక్రమాన్ని లేదా వేరొక బంధసంబంధాన్ని సూచించే అవకాశం ఉంది. ‘నా భర్త సోదరుడు’ అనేది ఈ విధవరాలి నోట నిస్సందిగ్ధంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది. ‘ధర్మం’ స్థానంలో ‘కర్తవ్యం’ వాడడం కూడా ఇక్కడి కుటుంబ-న్యాయ బాధ్యతకు మరింత స్పష్టమైనది.
  terminology: ‘సోదరుని విధవరాలు,’ ‘పేరు నిలబెట్టడం,’ ‘పెద్దలు’ సరైన పదాలు. యిబ్బుమ్ కర్తవ్యానికి ‘మరిది కర్తవ్యం’ అనే పదబంధం ఉపయోగించి, పాదసూచికలో దాని వివాహ-బాధ్యతను వివరించడం తగినది.
  issues:
  - severity: medium
    issue: ‘మరిదిగా నా పట్ల తన ధర్మాన్ని నెరవేర్చడానికి’ అనే ప్రయోగం అస్పష్టంగా ఉంది.
    rationale: యַבְּמִי అంటే విధవరాలైన స్త్రీ పట్ల ఆమె భర్త సోదరుడు నిర్వర్తించవలసిన ప్రత్యేక కుటుంబ-న్యాయ కర్తవ్యం. ‘మరిది కర్తవ్యాన్ని నిర్వర్తించడం’ ఈ సాంకేతిక భావాన్ని సహజంగా, స్పష్టంగా ఇస్తుంది; ‘ధర్మం’ మతపరమైన భావాన్ని కూడా సూచించవచ్చు.
  - severity: low
    issue: ‘నా మరిది’ అనే సంబోధనలో బంధసంబంధం స్వల్పంగా అస్పష్టంగా ఉండవచ్చు.
    rationale: తెలుగులో ‘మరిది’ వినియోగం ప్రాంతం, వయోక్రమం బట్టి మారవచ్చు. ‘నా భర్త సోదరుడు’ సందర్భంలోని సంబంధాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
  revised_text: అయితే ఆ మనిషి తన సోదరుని విధవరాలిని భార్యగా చేసుకోవడానికి ఇష్టపడకపోతే, ఆమె పట్టణ ద్వారం వద్ద ఉన్న పెద్దల దగ్గరకు వెళ్లి, ‘నా భర్త సోదరుడు ఇశ్రాయేలులో తన సోదరుని పేరు నిలబెట్టడానికి నిరాకరిస్తున్నాడు[a]; నా పట్ల మరిది కర్తవ్యాన్ని నిర్వర్తించడానికి అతడు ఒప్పుకోవడం లేదు[b]’ అని చెప్పాలి.
