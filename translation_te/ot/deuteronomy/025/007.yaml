source:
  edition: WLC
  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: te
  text: అయితే ఆ మనిషి తన సోదరుని విధవరాలిని భార్యగా చేసుకోవడానికి ఇష్టపడకపోతే, ఆమె పట్టణ ద్వారం వద్ద ఉన్న పెద్దల దగ్గరకు వెళ్లి, ‘నా భర్త సోదరుడు ఇశ్రాయేలులో తన సోదరుని పేరు నిలబెట్టడానికి నిరాకరిస్తున్నాడు[a]; నా పట్ల మరిది కర్తవ్యాన్ని నిర్వర్తించడానికి అతడు ఒప్పుకోవడం లేదు[b]’ అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలులో తన సోదరునికి ఒక పేరు నిలబెట్టడానికి.’ ఈ నుడికారం మరణించిన సోదరుని కుటుంబ వంశపరంపరను, అతని స్థానాన్ని కొనసాగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీయులో ఇది ‘నాకు మరిది కర్తవ్యం చేయడం’ అనే సాంకేతిక క్రియ. మరణించిన సోదరుని విధవరాలిని వివాహం చేసుకొని సంబంధిత కుటుంబ బాధ్యతను నిర్వర్తించడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: ఇష్టపడకపోతే
  rationale: חפץ ఇష్టం, కోరిక లేదా సంసిద్ధతను సూచిస్తుంది. ఈ న్యాయ సందర్భంలో ‘ఇష్టపడకపోతే’ సహజంగా ఉండి, నిర్ణయం అతని స్వచ్ఛంద సంకల్పానికి సంబంధించినదని తెలియజేస్తుంది.
- source_word: לָקַחַת אֶת יְבִמְתּוֹ
  choice: తన సోదరుని విధవరాలిని భార్యగా చేసుకోవడానికి
  rationale: לקח అక్షరార్థంగా ‘తీసుకోవడం’; వివాహ సందర్భంలో భార్యగా స్వీకరించడాన్ని సూచిస్తుంది. יְבִמְתּוֹ సాధారణంగా ఏ మరదలినైనా కాక, మరణించిన సోదరుని విధవరాలిని సూచిస్తుంది. అందువల్ల ఆధునిక పాఠకునికి సంబంధం, ఉద్దేశం రెండూ స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה אֶל הַזְּקֵנִים
  choice: ఆమె పట్టణ ద్వారం దగ్గర ఉన్న పెద్దల వద్దకు వెళ్లి
  rationale: ద్వారం స్థానిక న్యాయ విచారణ జరిగే బహిరంగ స్థలం. ‘పైకి వెళ్లడం’ అనే హెబ్రీయ క్రియను తెలుగులో అక్షరార్థంగా ఉంచడం అసహజం కావడంతో, దాని గమ్యార్థాన్ని సహజంగా వ్యక్తం చేశాం. ‘పట్టణ’ అనేది సందర్భంలో అంతర్లీనమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מֵאֵין
  choice: నిరాకరిస్తున్నాడు
  rationale: ఈ రూపం నిరాకరణ లేదా చేయడానికి ఒప్పుకోకపోవడాన్ని సూచిస్తుంది. స్త్రీ పెద్దల ఎదుట చేసే అధికారిక ఫిర్యాదుకు ‘నిరాకరిస్తున్నాడు’ తగిన న్యాయపరమైన బలాన్ని ఇస్తుంది.
- source_word: לְהָקִים לְאָחִיו שֵׁם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో తన సోదరుని పేరు నిలబెట్టడానికి
  rationale: ‘పేరును లేపడం/స్థాపించడం’ అనే హెబ్రీయ నుడికారం మరణించిన సోదరుని వంశపరంపరను, కుటుంబస్థానాన్ని కొనసాగించడాన్ని సూచిస్తుంది. ‘పేరు నిలబెట్టడం’ తెలుగులో సహజంగా ఉండి మూలంలోని రూపకాన్ని కూడా కాపాడుతుంది.
- source_word: לֹא אָבָה
  choice: అతడు ఇష్టపడడం లేదు
  rationale: אבה సమ్మతి లేదా సంసిద్ధతను సూచిస్తుంది. ముందున్న מֵאֵין కు వాడిన ‘నిరాకరిస్తున్నాడు’ అనే పదాన్ని పునరావృతం చేయకుండా, మూలంలోని రెండు వేర్వేరు వ్యక్తీకరణలను నిలుపుతుంది.
- source_word: יַבְּמִי
  choice: మరిదిగా నా పట్ల తన ధర్మాన్ని నెరవేర్చడానికి
  rationale: יבם అనేది మరణించిన సోదరుని విధవరాలికి సంబంధించి మరిది నిర్వర్తించవలసిన వివాహ బాధ్యతను తెలిపే సాంకేతిక క్రియ. తెలుగులో సమానమైన ఒక్క సుపరిచిత క్రియ లేకపోవడంతో, సంబంధాన్ని మరియు బాధ్యతను వివరణాత్మకంగా తెలిపాం.
theological_decisions:
- issue: మరిది వివాహానికి సంబంధించిన సాంకేతిక పదజాలం
  choice: ప్రధాన పాఠ్యంలో ‘సోదరుని విధవరాలు,’ ‘మరిది,’ ‘ధర్మాన్ని నెరవేర్చడం’ వంటి స్పష్టమైన సంబంధ-బాధ్యత పదాలను ఉపయోగించడం
  alternative: ‘లెవిరేట్ వివాహం’ వంటి శాస్త్రీయ పదాన్ని వాడడం లేదా హెబ్రీయ సాంకేతిక క్రియను అస్పష్టంగా అక్షరానువాదం చేయడం
  rationale: ఈ వచనం ఒక నిర్దిష్ట ఇశ్రాయేలీయ కుటుంబ-న్యాయ ఆచారాన్ని వివరిస్తుంది. ప్రత్యేక మతసంప్రదాయ వ్యాఖ్యానాన్ని చేర్చకుండా, మూలంలోని న్యాయబాధ్యతను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేయడం సముచితం.
- issue: ‘సోదరుని పేరు నిలబెట్టడం’ అనే నుడికారం
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని కుటుంబ-వంశార్థాన్ని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘సోదరుని వంశాన్ని కొనసాగించడం’ అని పూర్తిగా వివరణాత్మకంగా మార్చడం
  rationale: మూలంలోని ‘పేరు’ అనే ముఖ్య రూపకానికి వంశపరంపరతో పాటు సామాజిక స్థానం అనే విస్తృత భావం ఉంది. దానిని ఒకే వివరణకు కుదించకుండా రూపకాన్ని కాపాడి, పాదసూచికలో సందర్భార్థాన్ని తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘భార్యగా చేసుకోవడం’ వివాహ ఉద్దేశాన్ని స్పష్టం చేస్తుంది; ‘ధర్మం’ ఇక్కడ మతపరమైన పుణ్యకార్యం అనే అర్థంలో కాక, కుటుంబ-న్యాయ బాధ్యత అనే అర్థంలో వాడబడింది. ‘అన్న’ లేదా ‘తమ్ముడు’ అని వయోక్రమాన్ని నిర్ధారించకుండా, మూలంలోని సాధారణ אח (‘సోదరుడు’) అనే భావాన్ని కాపాడాం.
