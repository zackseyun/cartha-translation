    text: అక్షరార్థంగా, ‘ఇశ్రాయేలులో తన సోదరునికి ఒక పేరు నిలబెట్టడానికి.’ ఈ నుడికారం మరణించిన సోదరుని కుటుంబ వంశపరంపరను, అతని స్థానాన్ని కొనసాగించడాన్ని సూచిస్తుంది.
