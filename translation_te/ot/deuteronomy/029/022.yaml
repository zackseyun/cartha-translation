id: DEU.29.22
reference: Deuteronomy 29:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: te
  text: దాని నేలంతా గంధకమూ ఉప్పూ దహనమూ నిండినదై ఉంటుంది[a]. అది విత్తబడదు, మొలకలు పుట్టించదు, అందులో ఏ మొక్కా పెరగదు. యాహ్వే తన కోపంలోను తన ఆగ్రహంలోను నాశనం చేసిన సొదొమ, గొమొర్రా, అద్మా, సెబోయీము పట్టణాల నాశనంలా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని నేలంతా గంధకమూ ఉప్పూ దహనమూ.”
    reason: שְׂרֵפָהను ‘దహనం’ అనే నామవాచకంగా, గంధకం మరియు ఉప్పుతో సమానాధికారంగా మూలపాఠ్యం ఉంచుతుంది; తెలుగులో పూర్తి వాక్యానికి ‘నిండినదై ఉంటుంది’ చేర్చబడింది.
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: గంధకం, ఉప్పు
  rationale: భూమి నిర్జనమై పంటకు పనికిరాకపోవడాన్ని సూచించే రెండు పదార్థాలను ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: దాని నేలంతా ... కాలిపోయిన భూమి
  rationale: క్రియలేని హెబ్రీ వాక్యంలో భూమి అంతటి దగ్ధస్థితిని తెలిపే సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; שְׂרֵפָה యొక్క ‘దహనం/కాలిపోయిన స్థితి’ భావాన్ని నిలుపుతుంది.
- source_word: לֹא תִזָּרַע
  choice: దానిలో విత్తనాలు వేయరు
  rationale: నిఫాల్ అసంపూర్ణ క్రియలోని నిష్క్రియార్థాన్ని, భూమి సాగుచేయబడని స్థితిగా తెలుగులో సహజంగా తెలుపుతుంది; ‘వేయలేరు’ అని సామర్థ్యలేమిని అదనంగా చేర్చదు.
- source_word: וְלֹא תַצְמִחַ
  choice: అది మొలకెత్తదు
  rationale: భూమి మొలకను పుట్టించకపోవడాన్ని సంక్షిప్తంగా తెలుపుతూ, మూలంలోని స్త్రీలింగ ఏకవచన కర్త అయిన నేలను కొనసాగిస్తుంది.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: అందులో ఏ మొక్కా పెరగదు
  rationale: עֵשֶׂבను సందర్భానుసారంగా ‘మొక్క’గా తీసుకుని, ఒక్క రకమైన గడ్డి మాత్రమే కాక సమస్త వృక్షవృద్ధి లేకపోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: తలకిందులు చేసిన ... పట్టణాలవలె
  rationale: నామవాచకం మరియు దానికి సంబంధించిన הפך క్రియలోని ‘తలకిందులు చేయడం/సర్వనాశనం’ చిత్రాన్ని నిలుపుతుంది; పట్టణాలవలె అనే పదబంధం తెలుగులో పోలికను స్పష్టం చేస్తుంది.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: సొదొమ, గొమొర్రా, అద్మా, సెబోయీము
  rationale: హెబ్రీ స్థలనామాలను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: తన కోపాగ్రహాలతో
  rationale: రెండు సమీపార్థక పదాల తీవ్రతను ‘కోపం’ మరియు ‘ఆగ్రహం’ అనే భావాలతో సమాసరూపంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో బిరుదు కాక వ్యక్తిగత దైవనామం ఉన్నందున దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: దైవిక కోపాన్ని తెలిపే ద్వంద్వ పదబంధం
  choice: తన కోపాగ్రహాలతో
  alternative: తన కోపంతో, ఉగ్రతతో
  rationale: బְּאַפּוֹ וּבַחֲמָתוֹలోని తీవ్రతను తగ్గించకుండా, తెలుగులో గంభీరంగా మరియు సహజంగా వినిపించే రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హెబ్రీ వాక్యంలోని నిర్జనతను వరుస ప్రతికూల వాక్యాలతో నిలిపి, అవసరానికి మించిన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
