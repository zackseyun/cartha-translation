revisions:
- from: దాని నేలంతా గంధకం, ఉప్పు—కాలిపోయిన భూమి[a]. దానిలో విత్తనాలు వేయరు; అది మొలకెత్తదు; అందులో ఏ మొక్కా పెరగదు. యాహ్వే తన కోపాగ్రహాలతో తలకిందులు చేసిన సొదొమ, గొమొర్రా, అద్మా, సెబోయీము పట్టణాలవలె అది ఉంటుంది.
  to: దాని నేలంతా గంధకమూ ఉప్పూ దహనమూ నిండినదై ఉంటుంది[a]. అది విత్తబడదు, మొలకలు పుట్టించదు, అందులో ఏ మొక్కా పెరగదు. యాహ్వే తన కోపంలోను తన ఆగ్రహంలోను నాశనం చేసిన సొదొమ, గొమొర్రా, అద్మా, సెబోయీము పట్టణాల నాశనంలా ఉంటుంది.
  rationale: ప్రధాన పాఠ్యాన్ని ఆధునిక ప్రామాణిక తెలుగులో పూర్తి వాక్యంగా చేసి, దహనం అనే మూల భావాన్ని నిలిపాము. భూమి విత్తబడకపోవడం, మొలకలు పుట్టించకపోవడం, మొక్కలు పెరగకపోవడం అనే మూడు నిరాకరణలను కాపాడాము. నాలుగు పట్టణాల ‘నాశనం’తో పోలికను, యాహ్వే వాటిని నాశనం చేశాడనే సంబంధిత వాక్యాన్ని, కోపం మరియు ఆగ్రహం అనే జతను వేరువేరుగా స్పష్టం చేశాము.
