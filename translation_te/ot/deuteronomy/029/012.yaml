source:
  edition: WLC
  text: לְמַ֣עַן הָקִֽים אֹתְ/ךָ֩ הַ/יּ֨וֹם ל֜/וֹ לְ/עָ֗ם וְ/ה֤וּא יִֽהְיֶה לְּ/ךָ֙ לֵֽ/אלֹהִ֔ים כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/כַ/אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: te
  text: ఈ రోజు ఆయన నిన్ను తన కొరకు ఒక ప్రజగా స్థిరపరచడానికి, తాను నీకు దేవుడిగా ఉండడానికి, ఆయన నీతో చెప్పినట్లుగా మరియు నీ పితరులైన అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు ప్రమాణం చేసినట్లుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: చేయడానికి
  rationale: ప్రయోజనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: הָקִים אֹתְךָ
  choice: నిన్ను ... స్థిరపరచడానికి
  rationale: హిఫీల్ రూపంలోని ‘నిలబెట్టడం/స్థాపించడం’ అనే భావాన్ని నిబంధన సంబంధమైన స్థితిలో స్థిరపరచడంగా అందిస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: ప్రస్తుత నిబంధన ఘట్టాన్ని సూచించే కాలపదాన్ని నేరుగా అనువదిస్తుంది.
- source_word: לוֹ לְעָם
  choice: తనకు ప్రజగా
  rationale: ‘ఆయనకు ప్రజగా’ అనే హీబ్రూ సంబంధ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: తాను నీకు దేవుడిగా ఉండడానికి
  rationale: וְהוּא లోని కర్త ప్రాధాన్యాన్ని ‘తాను’తో చూపిస్తూ, నిబంధన సూత్రవాక్యాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: ఆయన నీతో చెప్పినట్లుగానే
  rationale: దీనిని ‘వాగ్దానం చేసినట్లు’ అని వివరణాత్మకంగా మార్చకుండా, דבר యొక్క ‘చెప్పాడు/మాట్లాడాడు’ భావాన్ని కాపాడుతుంది.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: ప్రమాణం చేసినట్లుగానే
  rationale: נשבע లోని ప్రమాణపూర్వక క్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַאֲבֹתֶיךָ
  choice: నీ పితరులైన
  rationale: వెంటనే పేర్లు చెప్పబడిన అబ్రాహాము, ఇస్సాకు, యాకోబులను సూచించే పురుష బహువచనాన్ని ఖచ్చితంగా అందిస్తుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: ప్రతి పేరుతో ఉన్న హీబ్రూ విభక్తి సంబంధాన్ని తెలుగులో దత్తివిభక్తితో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: నిబంధన సూత్రవాక్య నిర్మాణం
  choice: తనకు ప్రజగా ... నీకు దేవుడిగా
  alternative: తన ప్రజగా ... నీ దేవుడిగా
  rationale: హీబ్రూలోని ద్విగుణ సంబంధ నిర్మాణాన్ని మరింత ప్రత్యక్షంగా ఉంచి, పరస్పర నిబంధన సంబంధాన్ని ముందుగానే వ్యాఖ్యానించకుండా కాపాడుతుంది.
- issue: לַאֲבֹתֶיךָ లోని లింగసూచన
  choice: నీ పితరులైన
  alternative: నీ పూర్వికులైన
  rationale: వాక్యం ప్రత్యేకంగా అబ్రాహాము, ఇస్సాకు, యాకోబులను పేర్కొంటున్నందున పురుష పితృపురుషుల సూచనను నిలుపుతుంది.
- issue: דִּבֶּר మరియు נִשְׁבַּע మధ్య భేదం
  choice: చెప్పినట్లుగానే ... ప్రమాణం చేసినట్లుగానే
  alternative: వాగ్దానం చేసినట్లుగానే ... ప్రమాణం చేసినట్లుగానే
  rationale: మొదటి క్రియలో ‘వాగ్దానం’ అనే భావాన్ని చేర్చకుండా, మాట్లాడటం మరియు ప్రమాణం చేయటం మధ్య మూలపాఠంలోని భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నీవు’ ఏకవచన సంబోధన ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది. మూలవాక్యం 11వ వచనంతో మొదలైన నిర్మాణానికి ప్రయోజనాన్ని తెలిపేందున, తెలుగులో వాక్యం సంపూర్ణంగా వినిపించడానికి చివర ‘ఇలా చేస్తున్నాడు’ అని సందర్భానుసారంగా పూరించబడింది.
