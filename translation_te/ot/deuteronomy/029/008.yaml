id: DEU.29.8
reference: Deuteronomy 29:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: te
  text: కాబట్టి మీరు ఈ నిబంధన మాటలను పాటించి, వాటిని ఆచరించండి; అప్పుడు మీరు చేసే ప్రతిదానిలో వివేకంతో ప్రవర్తించగలుగుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీరు చేసే ప్రతిదానిలో సఫలమవుతారు’ లేదా ‘విజయం పొందుతారు.’
    reason: תַּשְׂכִּילוּ అనే పదం వివేకంతో ప్రవర్తించడం లేదా సఫలమవడం అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: పాటించండి
  rationale: నిబంధన సందర్భంలో שׁמר అంటే కేవలం కాపాడడం కాదు, దాని ఆదేశాలకు విధేయత చూపుతూ పాటించడం.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: ఈ నిబంధన మాటలను
  rationale: ‘మాటలు’ అనే రూపం హీబ్రూ דִּבְרֵיకి సన్నిహితంగా ఉండి, నిబంధనలోని పలికిన ఆదేశాలు లేదా నియమాలను సూచిస్తుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరించండి
  rationale: బహువచన సర్వనామం ‘మాటలను’ తిరిగి సూచిస్తుంది. ‘ఆచరించండి’ అనేది అక్షరార్థమైన ‘వాటిని చేయండి’ కంటే సహజమైన తెలుగు, అలాగే కార్యరూపంలో పెట్టాలనే భావాన్ని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో విధేయతకు అనుసరించే ఉద్దేశం లేదా ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַּשְׂכִּילוּ
  choice: వివేకంతో ప్రవర్తించగలుగుతారు
  rationale: שׂכל హిఫిల్ రూపం వివేకంగా వ్యవహరించడం అనే భావాన్ని నేరుగా తెలియజేస్తుంది; విజయం లేదా సాఫల్యం అనే ఫలితార్థం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: మీరు చేసే ప్రతిదానిలో
  rationale: క్రియ వర్తించే సమగ్ర పరిధిని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: תַּשְׂכִּילוּలో వివేకం మరియు సాఫల్యం మధ్య భావసందిగ్ధత
  choice: ముఖ్య పాఠ్యంలో ‘వివేకంతో ప్రవర్తించగలుగుతారు’
  alternative: ‘సఫలమవుతారు’ లేదా ‘విజయం పొందుతారు’
  rationale: ఈ పదం జ్ఞానయుక్తమైన ప్రవర్తనను, దాని ఫలితమైన సాఫల్యాన్ని రెండింటినీ సూచించగలదు. ముఖ్య పాఠ్యం ప్రవర్తనా భావాన్ని ముందుంచగా, పాదటిప్పణి ఫలితార్థాన్ని కాపాడుతుంది; దీనివల్ల నిబంధన విధేయతను తరువాతి కాలపు ప్రత్యేక ‘సమృద్ధి’ సిద్ధాంతంగా మార్చడం నివారించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే నిబంధన సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘పాటించి’ మరియు ‘ఆచరించండి’ అనే జంట హీబ్రూలోని రెండు క్రియల భేదాన్ని సహజంగా నిలుపుతుంది.
