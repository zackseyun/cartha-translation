id: DEU.29.9
reference: Deuteronomy 29:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: te
  text: మీ దేవుడైన యహ్వే సన్నిధిలో మీరందరూ ఈ రోజు నిలబడి ఉన్నారు—మీ నాయకులు,[a] మీ గోత్రాలు, మీ పెద్దలు, మీ అధికారులు, ఇశ్రాయేలు పురుషులందరూ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘మీ తలలు.’ దీనిని ‘మీ నాయకులు’ అని లేదా తరువాతి పదంతో కలిపి ‘మీ గోత్రాల నాయకులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు ప్రతి పురుషుడు’; ఇది ఒక్కొక్కరినీ కలుపుకొని చెప్పే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: నిలబడి ఉన్నారు
  rationale: నిఫాల్ కృదంతం ప్రస్తుతం దేవుని సన్నిధిలో సమావేశమై నిలిచివున్న సమాజాన్ని చిత్రిస్తుంది; తెలుగు వర్తమాన స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాల ప్రాధాన్యాన్ని ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כֻּלְּכֶם
  choice: మీరందరూ
  rationale: రెండవ పురుష బహువచనంతో కూడిన సమష్టి ప్రాధాన్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో నిలవడం అనే నిబంధన-సభ సందర్భాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఉంచుతుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: సంబంధప్రత్యయ భావాన్ని నిలుపుతూ ‘మీ దేవుడైన యహ్వే’ అనే సహజ తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: רָאשֵׁיכֶם
  choice: మీ నాయకులు
  rationale: అక్షరార్థమైన ‘మీ తలలు’ తెలుగులో అసహజం; ఇక్కడ సామాజిక నాయకులను సూచించే రూపకార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇస్తూ, నిర్మాణంలోని సందిగ్ధతను పాదటిప్పణిలో ఉంచింది.
- source_word: שִׁבְטֵיכֶם
  choice: మీ గోత్రాలు
  rationale: మసొరేటిక్ పాఠంలోని సాధారణ నామవాచక అర్థాన్ని, జాబితా నిర్మాణాన్ని నేరుగా నిలుపుతుంది.
- source_word: זִקְנֵיכֶם
  choice: మీ పెద్దలు
  rationale: ఇశ్రాయేలు సమాజంలోని గుర్తింపు పొందిన వయోవృద్ధ నాయకులకు సహజమైన తెలుగు పదం.
- source_word: שֹׁטְרֵיכֶם
  choice: మీ అధికారులు
  rationale: ద్వితీయోపదేశకాండ పరిపాలనా సందర్భంలో పదవిలో ఉన్న అధికారులను సూచిస్తుంది; నిర్దిష్ట బాధ్యతను అనవసరంగా ఊహించదు.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אִישׁ లోని పురుషలింగ నిర్దిష్టతను, כֹּל లోని సమష్టి/విభాజక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించబడింది; ‘యహ్వే’ హీబ్రూ నామానికి సమీపమైన ఆధునిక రూపం.
- issue: כֹּל אִישׁ יִשְׂרָאֵל లోని లింగ సూచన
  choice: ఇశ్రాయేలు పురుషులందరూ
  alternative: ఇశ్రాయేలీయులందరూ
  rationale: మూలంలోని אִישׁ పురుషులను స్పష్టంగా సూచిస్తుంది. తరువాతి వచనంలో ఇతర వర్గాలు ప్రస్తావించబడుతున్నందున ఇక్కడి లింగ నిర్దిష్టతను చెరపలేదు.
- issue: רָאשֵׁיכֶם שִׁבְטֵיכֶם నిర్మాణం
  choice: మీ నాయకులు, మీ గోత్రాలు
  alternative: మీ గోత్ర నాయకులు
  rationale: మసొరేటిక్ పదక్రమం, విభజన ప్రకారం రెండు అంశాల జాబితాను ప్రధాన పాఠ్యంలో నిలిపింది; సమీపంగా కలిపి చదివే సాధ్యాన్ని పాదటిప్పణిలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనుకూలమైన శైలి. పొడవైన జాబితిని స్పష్టంగా చూపేందుకు దీర్ఘవిరామం వాడబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
