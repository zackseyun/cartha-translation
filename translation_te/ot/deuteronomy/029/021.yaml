source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: te
  text: “రాబోయే తరం[a]—మీ తరువాత పుట్టుకొచ్చే మీ సంతానం—అలాగే దూరదేశం నుంచి వచ్చే పరదేశి, ఆ దేశాన్ని తాకిన తెగుళ్లను, యాహ్వే దానిలో కలిగించిన రోగాలను[b][c] చూసి ఇలా అంటారు:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తరువాతి తరం.” ఈ హీబ్రూ పదబంధం ప్రస్తుత తరానికి తరువాత వచ్చే తరాన్ని సూచిస్తుంది; తప్పనిసరిగా అంతిమ తరాన్ని కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వ్యాధులను.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “యాహ్వే దానిలో రోగగ్రస్తం చేసినవి” లేదా “దానిలో బాధ కలిగించినవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: ఇలా అంటారు
  rationale: హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నప్పటికీ, తరువాత ‘తరం’ మరియు ‘పరదేశి’ అనే సంయుక్త కర్తలు వస్తారు; అలాగే וְרָאוּ బహువచనంలో ఉంది. తెలుగులో సమిష్టి భావానికి బహువచనం సహజం.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: రాబోయే తరం
  rationale: ఇది ప్రస్తుత శ్రోతల తరువాత వచ్చే భావి తరాన్ని సూచిస్తుంది; తప్పనిసరిగా చరిత్రలోని అంతిమ తరాన్ని కాదు.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: మీ తరువాత పుట్టుకొచ్చే మీ సంతానం
  rationale: בנים ఇక్కడ కుమారులకే పరిమితం కాకుండా తరువాతి సంతతిని సూచించగలదు. ‘సంతానం’ ఆ వంశపారంపర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהַנָּכְרִי
  choice: అలాగే ... పరదేశి
  rationale: נכרי ఇశ్రాయేలు వెలుపలి దేశానికి చెందిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పరదేశి’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: దూరదేశం నుంచి
  rationale: భౌగోళిక దూరాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְרָאוּ
  choice: చూసి
  rationale: చూడటం తరువాత చెప్పబోయే మాటకు కారణమైన ముందరి చర్య. తెలుగు అసమాపక క్రియారూపం సంఘటనల క్రమాన్ని సహజంగా చూపుతుంది.
- source_word: מַכּוֹת
  choice: తెగుళ్లు
  rationale: ఈ పదం దెబ్బలు లేదా శిక్షాత్మక విపత్తులను సూచిస్తుంది. నిబంధన-శాపాల సందర్భంలో ‘తెగుళ్లు’ తగిన అర్థాన్ని ఇస్తుంది.
- source_word: תַּחֲלֻאֶיהָ
  choice: రోగాలు
  rationale: దేశాన్ని రోగగ్రస్తమైనదిగా చిత్రించే హీబ్రూ రూపకాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: חִלָּה
  choice: కలిగించిన
  rationale: పీయేల్ రూపంలోని ‘రోగగ్రస్తం చేయడం/బాధ కలిగించడం’ అనే కారణార్థాన్ని తెలియజేస్తుంది; ‘రోగాలు’తో కలిసి తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యనువాదంగా అందిస్తుంది.
- source_word: בָּהּ
  choice: దానిలో
  rationale: ప్రత్యయం తిరిగి ‘దేశం’నే సూచిస్తుంది; హీబ్రూలోని స్థానార్థక నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని ధ్వన్యనువదించాం.
- issue: בְּנֵיכֶם యొక్క పరిధి
  choice: మీ సంతానం
  alternative: మీ కుమారులు; మీ పిల్లలు
  rationale: సందర్భం తరువాతి తరాన్ని సమిష్టిగా సూచిస్తుంది. పురుషులకు మాత్రమే పరిమితం చేయకుండా, కుటుంబ-వంశ పరంపర భావాన్ని ‘సంతానం’ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన వాక్యశైలి. దీర్ఘమైన హీబ్రూ వాక్యంలోని కర్తలను డాష్‌లతో స్పష్టపరచి, తరువాతి వచనంలో వచ్చే ప్రశ్నకు దారితీసే ద్విబిందువును నిలిపాం.
