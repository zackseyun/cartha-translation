revisions:
- from: మీలో ఏ పురుషుడైనా, స్త్రీ అయినా, వంశమైనా, గోత్రమైనా—వారి హృదయం నేడు మన దేవుడైన యాహ్వేను విడిచిపెట్టి, ఆ జనాల దేవుళ్లను సేవించడానికి తిరిగిపోతూ ఉండకూడదు. మీలో విషఫలాన్నీ మాచిపత్రినీ పుట్టించే వేరు ఉండకూడదు.[a]
  to: మీ మధ్య ఏ పురుషుడైనా, స్త్రీ అయినా, వంశమైనా, గోత్రమైనా—వారి హృదయం నేడు మన దేవుడైన యాహ్వేను విడిచిపెట్టి, ఆ జనాల దేవుళ్లను సేవించడానికి వెళ్లేలా తిరిగిపోతూ ఉండకూడదు; మీలో విషాన్నీ మాచిపత్రినీ పుట్టించే వేరు ఉండకూడదు.[a]
  rationale: హెచ్చరికాత్మక పునరుక్తిని, వ్యక్తి–స్త్రీ–వంశం–గోత్రం అనే క్రమాన్ని, యాహ్వే నుండి మళ్లి ఇతర దేవతలను సేవించడానికి వెళ్లే భావాన్ని నిలుపుతూ, గమనార్థాన్ని స్పష్టంచేశాం. ‘విషఫలం’ స్థానంలో ‘విషం’ ఉంచడం ద్వారా మూలపాఠంలో లేని ‘ఫలం’ అనే అర్థాన్ని నివారించాం; పాదటిప్పణి రֹאשׁకు ఉన్న సంప్రదాయ ప్రత్యామ్నాయాన్ని పరిరక్షిస్తుంది.
  reviewer_model: gpt-5.6-terra
