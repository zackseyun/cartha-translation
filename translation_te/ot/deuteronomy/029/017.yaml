id: DEU.29.17
reference: Deuteronomy 29:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: te
  text: మీ మధ్య ఏ పురుషుడైనా, స్త్రీ అయినా, వంశమైనా, గోత్రమైనా—వారి హృదయం నేడు మన దేవుడైన యాహ్వేను విడిచిపెట్టి, ఆ జనాల దేవుళ్లను సేవించడానికి వెళ్లేలా తిరిగిపోతూ ఉండకూడదు; మీలో విషాన్నీ మాచిపత్రినీ పుట్టించే వేరు ఉండకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విషం’ అని అనువదించిన హెబ్రీ పదాన్ని సాంప్రదాయికంగా ‘పిత్తం’ అని కూడా అనువదించవచ్చు. మొత్తం పదబంధాన్ని ‘విషాన్నీ మాచిపత్రినీ పుట్టించే వేరు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן יֵשׁ בָּכֶם
  choice: మీలో ... ఉండకూడదు
  rationale: హెబ్రీ హెచ్చరికాత్మక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో సంభవించగల ప్రమాదాన్ని నివారించే హెచ్చరికగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ఏ పురుషుడైనా, స్త్రీ అయినా
  rationale: మూలంలోని పురుషుడు–స్త్రీ అనే స్పష్టమైన జంటను నిలుపుతూ తెలుగులో సహజంగా వ్యక్తులను సూచిస్తుంది.
- source_word: מִשְׁפָּחָה אוֹ שֵׁבֶט
  choice: వంశమైనా, గోత్రమైనా
  rationale: ఇక్కడ מִשְׁפָּחָה ఒక ఇంటికంటే విస్తృతమైన బంధుత్వ సమూహం; שֵׁבֶט ఇశ్రాయేలు గోత్రాన్ని సూచిస్తుంది.
- source_word: לְבָבוֹ פֹנֶה הַיּוֹם
  choice: వారి హృదయం నేడు ... తిరిగిపోతూ
  rationale: పార్టిసిపిల్‌లోని కొనసాగుతున్న లేదా ఆరంభమవుతున్న మళ్లింపును నిలుపుతుంది; సమూహాలను కూడా కలుపుకునేలా గౌరవ/సామాన్య బహువచన సర్వనామం వాడబడింది.
- source_word: מֵעִם יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యాహ్వేను విడిచిపెట్టి
  rationale: מֵעִם సూచించే సన్నిధి లేదా నిబంధన విశ్వాసం నుండి తొలగిపోవడాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: సేవించడానికి తిరిగిపోతూ
  rationale: వెళ్లి సేవించడం అనే హెబ్రీ గమన–ఉద్దేశ్య నిర్మాణాన్ని ముందున్న హృదయ మళ్లింపుతో సహజంగా కలుపుతుంది.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: ఆ జనాల దేవుళ్లు
  rationale: గּוֹיִם ఇక్కడ ఇతర ప్రజాసమూహాలను సూచిస్తుంది; ‘జనాలు’ సాధారణ పాఠకులకు సహజం.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: విషఫలాన్నీ మాచిపత్రినీ పుట్టించే వేరు
  rationale: దాగి ఉండి హానికరమైన పంటను కలిగించే వేరు అనే రూపకాన్ని నిలుపుతుంది. רֹאשׁ యొక్క విషార్థాన్ని ‘విషఫలం’గా, לַעֲנָהను చేదైన మాచిపత్రిగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా ఉంచుతుంది.
- issue: హృదయం తిరగడం అనే నిబంధనాపరమైన భాష
  choice: యాహ్వేను విడిచిపెట్టి ... తిరిగిపోతూ
  alternative: విశ్వాసభ్రష్టుడై
  rationale: వ్యాఖ్యానాత్మకమైన మతపారిభాషిక పదాన్ని చేర్చకుండా, మూలంలోని గమన రూపకాన్నీ కొనసాగుతున్న ప్రమాదాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన హెచ్చరిక ధోరణి ఉంచబడింది. పొడవైన హెబ్రీ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, పునరుక్తమైన פֶּן హెచ్చరిక రెండుసార్లూ నిలుపబడింది. ‘మాచిపత్రి’ అరుదైన వృక్షపదం కావడంతో దాని చేదు స్వభావం సందర్భం మరియు పాదటిప్పణి ద్వారా స్పష్టమవుతుంది.
