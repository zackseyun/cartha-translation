revisions:
- from: మీరు వారి మధ్య ఉన్న అసహ్యమైన వస్తువులను, వారి విగ్రహాలను—చెక్కతోను రాతితోను, వెండితోను బంగారంతోను చేసిన వాటిని—చూశారు.[a][b]
  to: మీరు వారి అసహ్యకరమైన వస్తువులనూ[a], విగ్రహాలనూ[b] చూశారు—వారి మధ్య ఉన్న చెక్కతో, రాతితో, వెండితో, బంగారంతో చేసిన వాటిని.
  rationale: The revision relocates the phrase corresponding to אֲשֶׁר עִמָּהֶם so that, in idiomatic modern Telugu, it describes the objects collectively rather than appearing to qualify only “detestable things.” It also places each lexical footnote anchor directly after its corresponding translated expression. No doctrinal interpretation has been added.
