source:
  edition: WLC
  text: וַ/תִּרְאוּ֙ אֶת שִׁקּ֣וּצֵי/הֶ֔ם וְ/אֵ֖ת גִּלֻּלֵי/הֶ֑ם עֵ֣ץ וָ/אֶ֔בֶן כֶּ֥סֶף וְ/זָהָ֖ב אֲשֶׁ֥ר עִמָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: te
  text: మీరు వారి అసహ్యకరమైన వస్తువులనూ[a], విగ్రహాలనూ[b] చూశారు—వారి మధ్య ఉన్న చెక్కతో, రాతితో, వెండితో, బంగారంతో చేసిన వాటిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అసహ్యకరమైన వస్తువులు” అని అనువదించిన హెబ్రీ పదం విగ్రహారాధనకు సంబంధించిన వాటిపట్ల తీవ్రమైన ఏహ్యభావాన్ని వ్యక్తం చేస్తుంది; “హేయమైనవి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “విగ్రహాలు” అని అనువదించిన హెబ్రీ పదం అత్యంత తిరస్కారపూర్వకమైనది; దానికి “మలవిగ్రహాలు” వంటి మోటైన అవమానార్థ ఛాయ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: మీరు ... చూశారు
  rationale: ראה ధాతువు Qal wayyiqtol, ద్వితీయ పురుష బహువచనం. మోషే ప్రజలకు గతంలో వారు చూసినదాన్ని గుర్తుచేస్తున్నందున సహజమైన తెలుగు భూతకాలాన్ని వాడాం.
- source_word: שִׁקּוּצֵיהֶם
  choice: వారి అసహ్యమైన వస్తువులను
  rationale: విగ్రహారాధనకు సంబంధించిన వస్తువుల పట్ల తీవ్రమైన ఏహ్యభావాన్ని שִׁקּוּץ వ్యక్తం చేస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేలా ‘అసహ్యమైన వస్తువులు’ అని ఇచ్చాం.
- source_word: גִּלֻּלֵיהֶם
  choice: వారి విగ్రహాలను
  rationale: ఇది విగ్రహాలకు వాడే తీవ్ర అవమానార్థక పదం. ప్రధాన పాఠ్యంలో అర్థస్పష్టత కోసం ‘విగ్రహాలు’ అని ఇచ్చి, దాని తిరస్కార ధ్వనిని పాదటిప్పణిలో తెలిపాం.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: చెక్కతోను రాతితోను, వెండితోను బంగారంతోను చేసిన వాటిని
  rationale: ఈ నామవాచకాలు ఆ విగ్రహాలు లేదా అసహ్య వస్తువులు తయారైన పదార్థాలను సూచిస్తున్నట్లు సందర్భం తెలుపుతుంది. తెలుగులో సంబంధం స్పష్టంగా, సహజంగా ఉండేందుకు ‘చేసిన వాటిని’ చేర్చాం.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: వారి మధ్య ఉన్న
  rationale: మునుపటి వచనంలో పేర్కొన్న జనాల మధ్య ఈ ఆరాధనా వస్తువులు ఉన్నాయని సందర్భం సూచిస్తుంది. ఇశ్రాయేలీయులే వాటిని కలిగి ఉన్నారనే భావం రాకుండా, హెబ్రీలోని ఉనికి/సాన్నిధ్య భావాన్ని నిలిపాం.
theological_decisions:
- issue: విగ్రహారాధనా వస్తువులకు వాడిన రెండు తిరస్కార పదాల అనువాదం
  choice: ‘అసహ్యమైన వస్తువులు’ మరియు ‘విగ్రహాలు’ అని వేర్వేరుగా ఉంచడం
  alternative: ‘హేయమైనవి’ మరియు ‘మలవిగ్రహాలు’
  rationale: హెబ్రీలోని రెండు వేర్వేరు పదాల భేదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, రెండవ పదంలోని మరింత తీవ్రమైన అవమానార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: אֲשֶׁר עִמָּהֶם అనే సంబంధ వాక్యభాగం దేనిని సూచిస్తుంది
  choice: మునుపటి వచనంలోని జనాల మధ్య ఉన్న వస్తువులుగా అనుసంధానించడం
  alternative: ‘వారి దగ్గర ఉన్న’ లేదా ‘వారికి చెందిన’
  rationale: సందర్భపరంగా ‘వారు’ అనేది ఇశ్రాయేలు దాటివచ్చిన జనాలను సూచిస్తుంది. ‘మధ్య ఉన్న’ అనేది యాజమాన్యాన్ని అతిగా నిర్ధారించకుండా మూలంలోని భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. పదార్థాల జాబితా విగ్రహాలను వివరిస్తుందని తెలుగులో స్పష్టంచేశాం. మూలంలోని వాక్యప్రవాహం తదుపరి వచనానికి కొనసాగుతున్నప్పటికీ, ఇచ్చిన వచనం స్వతంత్రంగా చదవదగినట్లు ముగించాం.
