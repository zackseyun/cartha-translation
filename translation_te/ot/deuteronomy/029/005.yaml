  variant: modern standard Telugu
source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: te
  text: మీరు నేను మీ దేవుడైన యాహ్వేనని తెలుసుకునేలా, రొట్టె తినలేదు; ద్రాక్షారసంగానీ మత్తు పానీయంగానీ[a] తాగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదం ద్రాక్షారసం కాకుండా పులియబెట్టిన మత్తు పానీయాలను విస్తృతంగా సూచిస్తుంది; అది ఒక నిర్దిష్ట పానీయానికే పరిమితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: ఈ పదానికి ప్రాథమిక అర్థం ‘రొట్టె.’ ఇది కొన్నిసార్లు ఆహారాన్ని సాధారణంగా సూచించగలిగినా, ఇక్కడ ద్రాక్షారసం మరియు మత్తు పానీయంతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: אֲכַלְתֶּם
  choice: మీరు తినలేదు
  rationale: హెబ్రీ పరిపూర్ణ క్రియ అరణ్యకాల అనుభవాన్ని వెనుదిరిగి సంగ్రహిస్తోంది; ఆధునిక తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: ద్రాక్షతో చేసిన పానీయాన్ని స్పష్టంగా సూచించే సహజమైన తెలుగు పదం; తరువాతి విస్తృత మత్తు పానీయ పదంతో తేడాను నిలుపుతుంది.
- source_word: שֵׁכָר
  choice: మత్తు పానీయం
  rationale: ద్రాక్షారసం కాకుండా పులియబెట్టిన మత్తు కలిగించే పానీయాలను విస్తృతంగా సూచించే హెబ్రీ పదానికి ఇది సహజమైన తెలుగు అనువాదం; ‘బీరు’ అనడం అనవసరంగా అర్థాన్ని కుదిస్తుంది.
- source_word: שְׁתִיתֶם
  choice: మీరు తాగలేదు
  rationale: వెనుదిరిగి చెప్పే సందర్భానికి సాధారణ భూతకాల రూపం స్పష్టంగా, సహజంగా సరిపోతుంది.
- source_word: לְמַעַן
  choice: తెలుసుకునేలా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఆ రెండింటిలో ఒకదానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: תֵּדְעוּ
  choice: మీరు తెలుసుకునేలా
  rationale: లְמַעַן‌తో కలిసి ఉద్దేశిత ఫలితాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: దేవునికి ఇశ్రాయేలుతో ఉన్న నిబంధన సంబంధాన్ని తెలిపే స్వామ్య నిర్మాణాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: లְמַעַן సూచించే ఉద్దేశం లేదా ఫలితం
  choice: మీరు తెలుసుకునేలా
  alternative: మీరు తెలుసుకోవడానికి
  rationale: ఈ నిర్మాణం ఉద్దేశం మరియు ఉద్దేశిత ఫలితం రెండింటి ఛాయలనూ కలిగి ఉండగలదు. ‘తెలుసుకునేలా’ అనే రూపం ఆ ఉద్రిక్తతను అనవసరంగా పరిష్కరించకుండా సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలి వాడబడింది. ‘గానీ…గానీ’ నిర్మాణం రెండు పానీయాలనూ సహజంగా సమన్వయపరుస్తుంది. మూలంలోని ఉద్దేశం/ఫలితం మధ్య స్వల్ప అస్పష్టతను ‘తెలుసుకునేలా’ ద్వారా నిలుపుతూ, తెలుగులో వాక్యం పూర్తి కావడానికి ‘ఇది జరిగింది’ చేర్చబడింది.
