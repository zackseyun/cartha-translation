translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ జాతివాచక ఏకవచనాలను వాటి సమష్టి భావానికి అనుగుణంగా తెలుగు బహువచనంలో ఇచ్చాం. మూలంలోని ‘మనష్షీయుల అర్ధగోత్రం’ రూపాన్ని పాఠ్యంలోనే స్పష్టంగా నిలిపినందున పాదటిప్పణి అవసరం లేదు.
