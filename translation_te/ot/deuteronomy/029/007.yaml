  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: te
  text: వారి దేశాన్ని మేము తీసుకొని, దానిని రూబేనీయులకు, గాదీయులకు, మనష్షీయుల అర్ధగోత్రానికి వారసత్వంగా ఇచ్చాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: మేము స్వాధీనం చేసుకొని
  rationale: לקח అనే క్రియకు మౌలికంగా ‘తీసుకొను’ అనే అర్థం ఉన్నా, ఇక్కడ యుద్ధంలో రాజుల దేశాన్ని పొందిన సందర్భంలో ‘స్వాధీనం చేసుకొను’ సహజంగా ఉండి, క్రియను అతిగా బలపరచదు.
- source_word: אַרְצָם
  choice: వారి దేశాన్ని
  rationale: אֶרֶץ ఇక్కడ ముందుగా ప్రస్తావించిన ఓడిపోయిన రాజుల అధీనంలోని భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַנִּתְּנָהּ
  choice: దాన్ని ... ఇచ్చాము
  rationale: נתן యొక్క సరళమైన ‘ఇచ్చు’ అర్థాన్ని నిలుపుతుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ‘దేశం’ను సూచిస్తుంది.
- source_word: לְנַחֲלָה
  choice: వారసత్వంగా
  rationale: נַחֲלָה భూవిభజన సందర్భంలో వారసత్వంగా లభించే స్వాస్థ్యాన్ని సూచిస్తుంది; ‘వారసత్వంగా’ ఆ ఒడంబడిక-భూమి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָראוּבֵנִי
  choice: రూబేనీయులకు
  rationale: ఏకవచన జాతివాచక రూపం గోత్రసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనమైన ‘రూబేనీయులకు’ సహజంగా ఆ సమష్టి భావాన్ని అందిస్తుంది.
- source_word: וְלַגָּדִי
  choice: గాదీయులకు
  rationale: హీబ్రూ జాతివాచక ఏకవచనం గాదు గోత్ర ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగు బహువచనం సహజమైనది.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: మనష్షీయుల అర్ధగోత్రానికి
  rationale: חֲצִי שֵׁבֶט అంటే ‘అర్ధగోత్రం’; הַמְנַשִּׁי జాతివాచక రూపాన్ని ‘మనష్షీయుల’గా ఉంచడం మూలరూపంలోని సమూహ సూచనను కాపాడుతుంది.
