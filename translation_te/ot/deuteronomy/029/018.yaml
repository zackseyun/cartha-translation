id: DEU.29.18
reference: Deuteronomy 29:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: te
  text: అతడు ఈ ప్రమాణపు మాటలను[a] విన్నప్పుడు, తన హృదయంలో తనను తాను దీవించుకుంటూ, ‘నేను నా హృదయ మొండితనాన్ని అనుసరించి నడిచినా నాకు క్షేమమే ఉంటుంది’ అని అనుకుంటాడు—తృప్తిగా ఉన్నదానిని దాహంతో ఉన్నదానితో పాటు తుడిచిపెట్టివేయడానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ శాపపు మాటలను.’ హీబ్రూ పదం శాపాన్ని తనలో కలిగిన ప్రమాణాన్ని సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నీరు సమృద్ధిగా ఉన్న నేలనూ ఎండిన నేలనూ కలిపి తుడిచిపెట్టివేయడానికి,’ అంటే అన్నిటినీ ఒకేలా నాశనం చేయడానికి. హీబ్రూ మాటబంధం క్లిష్టమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: ప్రమాణం
  rationale: ఈ పదం శాపాన్ని తనలో కలిగిన ప్రమాణాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘ప్రమాణం’ అని ఉంచి, దాని శిక్షాత్మక భావాన్ని పాదసూచికలో వెల్లడించాం.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: తన హృదయంలో తనను తాను దీవించుకుంటూ
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్నీ, అతని వ్యర్థమైన స్వీయ భరోసాలోని వ్యంగ్యాన్నీ నిలుపుతుంది.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: నాకు క్షేమమే ఉంటుంది
  rationale: שָׁלוֹם లోని శాంతి, సురక్షిత స్థితి, సంపూర్ణ క్షేమం అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁרִרוּת לִבִּי
  choice: నా హృదయ మొండితనం
  rationale: స్వేచ్ఛాచారం లేదా ఊహ అని మృదువుగా మార్చకుండా, గట్టిపడిన సంకల్పం మరియు మొండితనం అనే భావాన్ని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: తుడిచిపెట్టివేయడానికి
  rationale: తరువాతి క్రియతో కలిపి ఉద్దేశం లేదా ఫలితాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: סְפוֹת
  choice: తుడిచిపెట్టివేయడం
  rationale: ఈ నిబంధన-తీర్పు సందర్భంలో నాశనం చేయడం లేదా ఊడ్చివేయడం అనే భావం ‘కలపడం’ కంటే సముచితం.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: నీటితో నిండినదానిని దప్పిగొన్నదానితో కలిపి
  rationale: ఏవి లేదా ఎవరు ఉద్దేశించబడ్డారో నిర్ణయించకుండా, తృప్తిగా నీరు పొందినది మరియు దప్పిగొన్నది అనే కఠినమైన హీబ్రూ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הָאָלָה లోని నిబంధనాత్మక శిక్షా భావం
  choice: ప్రధాన పాఠంలో ‘ప్రమాణం’
  alternative: ‘శాపం’ లేదా ‘శాపపూర్వక ప్రమాణం’
  rationale: ఈ పదం ప్రమాణాన్నీ దానితో ముడిపడిన శాపాన్నీ సూచించగలదు. ప్రధాన పాఠం ఒక భావాన్ని మాత్రమే బలవంతంగా నిర్ధారించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: הָרָוָה אֶת־הַצְּמֵאָה అనే అస్పష్ట రూపకం
  choice: ‘నీటితో నిండినదానిని దప్పిగొన్నదానితో కలిపి’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘నీరు సమృద్ధిగా ఉన్న నేలనూ ఎండిన నేలనూ కలిపి’ లేదా ‘అన్నిటినీ ఒకేలా’
  rationale: ఈ మాటబంధం నిజంగా క్లిష్టమైనది. అది భూమిని సూచిస్తుందని లేదా అందరినీ విచక్షణ లేకుండా నాశనం చేయడాన్ని సూచిస్తుందని ప్రధాన పాఠంలోనే నిర్ణయించకుండా, అసలు రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘హృదయం,’ ‘ప్రమాణం,’ ‘దీవించుకోవడం’ వంటి నిబంధనాత్మక పదాలను ఉంచుతూ, చివరి క్లిష్ట రూపకాన్ని అతిగా వ్యాఖ్యానించకుండా సంరక్షించాం.
