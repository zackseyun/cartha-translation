revisions:
- from: అతడు ఈ ప్రమాణపు మాటలను[a] విన్నప్పుడు, తన హృదయంలో తనను తాను దీవించుకుంటూ, ‘నేను నా హృదయ మొండితనం ప్రకారం నడిచినా నాకు క్షేమమే ఉంటుంది’ అని అనుకుంటాడు—నీటితో నిండినదానిని దప్పిగొన్నదానితో కలిపి తుడిచిపెట్టివేయడానికి.[b]
  to: అతడు ఈ ప్రమాణపు మాటలను[a] విన్నప్పుడు, తన హృదయంలో తనను తాను దీవించుకుంటూ, ‘నేను నా హృదయ మొండితనాన్ని అనుసరించి నడిచినా నాకు క్షేమమే ఉంటుంది’ అని అనుకుంటాడు—తృప్తిగా ఉన్నదానిని దాహంతో ఉన్నదానితో పాటు తుడిచిపెట్టివేయడానికి.[b]
  rationale: సురక్షితమైన శైలీ సవరణలు మాత్రమే చేశాం. ప్రధాన పాఠంలో హీబ్రూ క్లిష్ట రూపకాన్ని వ్యక్తులు లేదా భూమి అని నిర్దిష్టం చేయకుండా నిలిపాం; భూమికి సంబంధించిన వివరణను పాదసూచికలో ప్రత్యామ్నాయంగానే ఉంచాం. לְמַעַן యొక్క ఉద్దేశార్థాన్ని ‘తుడిచిపెట్టివేయడానికి’ ద్వారా కాపాడాం; אָלָהకు ‘ప్రమాణం’ అనే ఎంపికతో పాటు ‘శాపం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో కొనసాగించాం.
