source:
  edition: WLC
  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: te
  text: అయితే యాహ్వే మీకు తెలుసుకొనే హృదయాన్నిగానీ, చూసే కళ్లనుగానీ, వినే చెవులనుగానీ ఇప్పటివరకు ఇవ్వలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు యాహ్వే మీకు తెలుసుకొనే హృదయాన్నీ, చూసే కళ్లనూ, వినే చెవులనూ ఇప్పటివరకు ఇవ్వలేదు.”
    reason: וְ అనే సంధి సందర్భానుసారం వ్యత్యాసార్థకమైన “అయితే”గానీ, సాధారణ సముచ్చయార్థకమైన “మరియు”గానీ అర్థమవుతుంది; అలాగే హెబ్రీలో మూడు నామవాచక పదబంధాలు “మరియు”తో అనుసంధానించబడ్డాయి.
lexical_decisions:
- source_word: וְלֹא
  choice: అయితే ... ఇవ్వలేదు
  rationale: ముందటి వచనాల్లో ఇశ్రాయేలు చూసిన కార్యాలకు, ఇక్కడ చెప్పబడుతున్న వారి అంతర్గత గ్రహణలోపానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. హెబ్రీ సంధిని కేవలం ‘మరియు’ అని కూడా అనువదించవచ్చు; ఆ అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: נָתַן
  choice: ఇవ్వలేదు
  rationale: హెబ్రీ సంపూర్ణ క్రియను, ‘ఈ రోజు వరకు’ కొనసాగిన స్థితితో కలిపి, తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: לֵב לָדַעַת
  choice: తెలుసుకొనే హృదయం
  rationale: לֵב అనే హెబ్రీ మానవశాస్త్రీయ రూపకాన్ని ‘మనస్సు’గా కుదించకుండా ‘హృదయం’గా నిలుపుతుంది; ידע యొక్క ప్రాథమిక భావాన్ని ‘తెలుసుకొను’గా వ్యక్తపరుస్తుంది.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: చూసే కళ్లు
  rationale: మూలంలోని శరీరాంగ రూపకాన్నీ సమాంతర నిర్మాణాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: వినే చెవులు
  rationale: కేవలం శారీరక వినికిడిని మించి గ్రహించి వినడాన్ని సూచించగల బైబిలీయ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: మాట్లాడుతున్న సమయం దాకా ఆ పరిస్థితి కొనసాగిందనే కాలార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు గ్రహించలేకపోవడంలో దైవ కార్యసాధకత్వం
  choice: యాహ్వే వారికి తెలుసుకొనే హృదయాన్ని, చూసే కళ్లను, వినే చెవులను ఇవ్వలేదని వచనం నేరుగా చెబుతున్నట్లే అనువదించబడింది.
  alternative: దేవుడు కేవలం అనుమతించలేదు లేదా వారు తమంతట తామే గ్రహించలేకపోయారని మృదువుగా చెప్పడం.
  rationale: మూలపాఠం ‘ఇవ్వలేదు’ అనే కార్యాన్ని యాహ్వేకే స్పష్టంగా ఆపాదిస్తుంది. అదే సమయంలో దైవ సార్వభౌమత్వం, మానవ బాధ్యతల సంబంధాన్ని ఈ వచనానికి మించి వ్యవస్థీకరించి వివరించకుండా, మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘హృదయం—కళ్లు—చెవులు’ అనే మూలంలోని సమాంతర రూపకం నిలుపబడింది. ప్రధాన పాఠ్యంలో ‘-గాని’ నిర్మాణం ప్రతికూల క్రియతో సహజమైన తెలుగు వరుసను ఇస్తుంది; మరింత రూపానుసారమైన సముచ్చయ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
