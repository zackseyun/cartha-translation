  issues:
  - severity: low
    issue: Temporal phrase is fronted as “ఈ రోజు వరకు.”
    rationale: Hebrew ends with עַד הַיּוֹם הַזֶּה. Telugu permits a final “ఇప్పటివరకు,” which is idiomatic and more closely retains the source emphasis.
