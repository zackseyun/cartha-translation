  naturalness: 'The wording is generally modern and clear. “ఇప్పటివరకు” is more idiomatic than “ఈ రోజు వరకు” in this narrative setting. The repeated negative-correlative “-గానీ” construction is natural, though spacing should be normalized: “హృదయాన్నిగానీ” etc.'
