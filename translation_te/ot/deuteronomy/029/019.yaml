revisions:
- from: ఆ మనిషిని క్షమించడానికి యెహోవా ఇష్టపడడు. అప్పుడు యెహోవా కోపమూ ఆయన అసూయా ఆ మనిషిమీద రగులుకుంటాయి; ఈ గ్రంథంలో రాసి ఉన్న శాపమంతా[a] అతనిమీద నిలిచిపోతుంది; యెహోవా అతని పేరును ఆకాశం కిందనుంచి తుడిచివేస్తాడు.
  to: యెహోవా అతనిని క్షమించడానికి ఇష్టపడడు. ఎందుకంటే అప్పుడు యెహోవా కోపం రగులుకుంటుంది, తన అసూయ ఆ మనిషికి వ్యతిరేకంగా ఉంటుంది; ఈ గ్రంథంలో వ్రాయబడిన శాపమంతా[a] అతనిమీద నిలిచిపోతుంది; యెహోవా అతని పేరును ఆకాశం కింద నుండి తుడిచివేస్తాడు.
  rationale: వాక్యంలోని ప్రధాన హీబ్రూ క్రియను యెహోవా కోపానికి ఏకవచనంగా అనుసంధానించి, అసూయను ఆ మనిషికి వ్యతిరేకమైన సమాంతర అంశంగా వ్యక్తం చేశాం. దీనివల్ల మూలంలోని నిర్మాణం, తీర్పు-రూపకం, మరియు నిబంధన సందర్భం నిలుస్తాయి. మిగతా మార్పులు పదక్రమం మరియు ప్రామాణిక తెలుగు సహజత్వం కోసమే; అర్థంలో మార్పు లేదు.
