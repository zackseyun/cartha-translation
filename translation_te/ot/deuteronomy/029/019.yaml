source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: te
  text: యెహోవా అతనిని క్షమించడానికి ఇష్టపడడు. ఎందుకంటే అప్పుడు యెహోవా కోపం రగులుకుంటుంది, తన అసూయ ఆ మనిషికి వ్యతిరేకంగా ఉంటుంది; ఈ గ్రంథంలో వ్రాయబడిన శాపమంతా[a] అతనిమీద నిలిచిపోతుంది; యెహోవా అతని పేరును ఆకాశం కింద నుండి తుడిచివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రమాణంతో విధించబడిన శాపమంతా.’ ఇక్కడి హీబ్రూ పదం సాధారణ శాపాన్ని మాత్రమే కాక, నిబంధన ప్రమాణం చేసేటప్పుడు స్వీకరించే శాపాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֹאבֶה ... סְלֹחַ לוֹ
  choice: ఆ మనిషిని క్షమించడానికి ... ఇష్టపడడు
  rationale: יֹאבֶה సామర్థ్యాన్ని కాక సంకల్పం లేదా సమ్మతిని సూచిస్తుంది. అందువల్ల ‘క్షమించలేడు’ అని కాక ‘క్షమించడానికి ఇష్టపడడు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: יֶעְשַׁן אַף יְהוָה וְקִנְאָתוֹ
  choice: యెహోవా కోపమూ ఆయన అసూయా ... రగులుకుంటాయి
  rationale: యెహోవా కోపం ‘పొగలు కక్కుతుంది’ అనే హీబ్రూ దృశ్యాన్ని తెలుగులో సహజమైన ‘రగులుకుంటాయి’తో వ్యక్తం చేశాం; קִנְאָהలోని jealous zeal భావాన్ని సమతలపరచకుండా ‘అసూయ’గా నిలిపాం.
- source_word: בָּאִישׁ הַהוּא
  choice: ఆ మనిషిమీద
  rationale: పుంలింగ ఏకవచన సూచనను నిలిపి, కోపానికి సంబంధించిన ב ఉపసర్గను తెలుగులో సహజంగా ‘మీద’ అని ఇచ్చాం.
- source_word: וְרָבְצָה בוֹ
  choice: అతనిమీద నిలిచిపోతుంది
  rationale: רבץలోని వచ్చి వాలి అలాగే ఉండే భావాన్ని ‘నిలిచిపోతుంది’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הָאָלָה
  choice: శాపమంతా
  rationale: ఏకవచన సమష్టి నిర్మాణాన్ని ‘శాపమంతా’గా నిలిపాం; నిబంధన ప్రమాణ-శాప భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: ఈ గ్రంథంలో రాసి ఉన్న
  rationale: సֵפֶר పుస్తకం లేదా చుట్టను సూచించగలదు; సందర్భానికి సహజమైన ఆధునిక తెలుగు పదంగా ‘గ్రంథం’ను ఎంచుకున్నాం.
- source_word: וּמָחָה ... אֶת שְׁמוֹ מִתַּחַת הַשָּׁמָיִם
  choice: అతని పేరును ఆకాశం కిందనుంచి తుడిచివేస్తాడు
  rationale: పేరు లేదా జ్ఞాపకాన్ని పూర్తిగా తొలగించే హీబ్రూ రూపకాన్ని ‘తుడిచివేస్తాడు’గా నిలిపాం.
theological_decisions:
- issue: దైవిక కోపానికి సంబంధించిన రూపకం
  choice: ‘కోపమూ ... అసూయా ... రగులుకుంటాయి’ అని రూపకాన్ని నిలిపాం.
  alternative: ‘తీవ్రంగా మండుతాయి’ లేదా సాధారణంగా ‘ఆగ్రహిస్తాడు’ అని చెప్పడం.
  rationale: హీబ్రూ పాఠంలోని పొగ/మంట దృశ్యాన్ని తెలుగులో అర్థవంతంగా ఉంచుతూ, దేవుని భావోద్వేగాల గురించి పాఠం చెప్పినదానికంటే మించి సిద్ధాంతీకరించలేదు.
- issue: קִנְאָה అనే దైవిక jealous zeal
  choice: అసూయ
  alternative: రోషం; ఆసక్తి; ఉత్సాహం
  rationale: ‘అసూయ’ మూలపదంలోని అసౌకర్యకరమైనా నిజమైన నిబంధన సంబంధిత ఉద్రేకాన్ని నిలుపుతుంది; ‘రోషం’ అని చేస్తే ముందున్న ‘కోపం’తో తేడా చెరిగిపోతుంది.
- issue: వ్యక్తిని సూచించే పుంలింగ ఏకవచనం
  choice: ఆ మనిషి / అతను
  alternative: ఆ వ్యక్తి / వారు
  rationale: הָאִישׁ הַהוּאలోని స్పష్టమైన పుంలింగ ఏకవచనాన్ని నిలిపాం.
- issue: నిబంధనలోని ప్రమాణ-శాప పదజాలం
  choice: ప్రధాన పాఠంలో ‘శాపమంతా’; పాదసూచికలో ప్రమాణ-శాప భావం
  alternative: ప్రధాన పాఠంలోనే ‘ప్రమాణ-శాపమంతా’
  rationale: సాధారణ పాఠకునికి వాక్యం సహజంగా ఉండేలా చేస్తూనే, אָלָהలోని నిబంధన ప్రమాణ సందర్భాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. హీబ్రూ దృశ్యాన్ని పూర్తిగా అక్షరార్థంగా చేసి అసహజత కలిగించకుండా ‘రగులుకుంటాయి’ అన్న సహజ రూపకాన్ని ఎంచుకున్నాం. పాదసూచిక సూచిక [a] సంబంధిత ‘శాపమంతా’ పదం వెంట ఉంచబడింది.
