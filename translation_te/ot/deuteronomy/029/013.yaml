  text: అయితే నేను ఈ నిబంధనను[a], ఈ ప్రమాణాన్ని[b] మీతో మాత్రమే చేయడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ నిబంధనను కోయడం.” ‘నిబంధనను చేయడం’ అనేది ఆ హీబ్రూ నుడికారాన్ని సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ శాపాన్ని.” హీబ్రూ పదం ప్రమాణాన్నే గానీ, ఆ ప్రమాణంతో ముడిపడిన శాపాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אִתְּכֶם לְבַדְּכֶם
  choice: మీతో మాత్రమే ... లేదు
  rationale: హాజరైన శ్రోతలకే పరిమితం కాదనే వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తమైన కర్త ద్వారా నిలుపుతుంది.
- source_word: כֹּרֵת אֶת הַבְּרִית הַזֹּאת
  choice: ఈ నిబంధనను ... చేయడం
  rationale: హీబ్రూ భాషలో అక్షరార్థంగా ‘నిబంధనను కోయడం’ అనే నుడికారం ఉంది; తెలుగులో ‘నిబంధన చేయడం’ దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: ఈ ప్రమాణాన్ని
  rationale: אָלָה నిబంధనను ధ్రువీకరించే ప్రమాణాన్నీ, దానితో ముడిపడిన శాపపరిణామాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ‘ప్రమాణం’ సందర్భానికి సహజంగా సరిపోతుంది; ‘శాపం’ అనే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: నిబంధన సందర్భంలో אָלָה అనువాదం
  choice: ప్రమాణం
  alternative: శాపం
  rationale: ఈ పదం ప్రమాణంతో కూడిన నిబంధన ధ్రువీకరణను సూచించగలదు; అదే సమయంలో ఆ ప్రమాణానికి అనుబంధమైన శాపాన్ని కూడా సూచించవచ్చు. అందువల్ల ప్రధాన పాఠంలో ‘ప్రమాణం’ ఉంచి, నిజమైన అర్థసందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని వ్యత్యాస ఉద్ఘాటనను ‘మీతో మాత్రమే ... లేదు’ ద్వారా నిలిపి, నిబంధన నుడికారాన్ని అక్షరానువాదం చేయకుండా అర్థవంతంగా అందించాం.
