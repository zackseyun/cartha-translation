id: DEU.29.1
reference: Deuteronomy 29:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: te
  text: 'మోషే ఇశ్రాయేలీయులందరినీ పిలిచి వారితో ఇలా అన్నాడు: “ఈజిప్టు దేశంలో ఫరోకు, అతని సేవకులందరికీ, అతని దేశమంతటికీ[a] యాహ్వే మీ కళ్లముందు చేసినదంతా మీరు చూశారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఫరోకు, అతని సేవకులందరికీ, అతని దేశమంతటికీ వ్యతిరేకంగా.” హీబ్రూ ఉపసర్గను ఈ సందర్భంలో, ఈజిప్టులో యాహ్వే చేసిన కార్యాలు వారిపై తీర్పుగా జరిగాయని చూపించేలా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: ఈ కథన సందర్భంలో קרא సమాజాన్ని పిలవడం లేదా సమావేశపరచడం అనే భావాన్ని ఇస్తుంది. ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు రూపం; అవసరానికి మించిన అధికారిక భావాన్ని చేర్చదు.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: ఇది నిబంధన ప్రజలందరినీ సమష్టిగా సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలీయులందరినీ’ అనేది సమావేశ సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: רְאִיתֶם
  choice: మీరు చూశారు
  rationale: హీబ్రూ పరిపూర్ణ క్రియ ప్రేక్షకులు ప్రత్యక్షంగా అనుభవించిన గత సంఘటనను సూచిస్తుంది. తెలుగులో ‘మీరు చూశారు’ ఆ సాక్ష్యానుభవాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: לְעֵינֵיכֶם
  choice: మీ కళ్లముందు
  rationale: ఈ హీబ్రూ నానుడి సంఘటనలు వారికి ప్రత్యక్షంగా, బహిరంగంగా కనిపించాయని నొక్కి చెబుతుంది. ‘మీ కళ్లముందు’ ఆ సజీవ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఈజిప్టు దేశంలో
  rationale: మూలంలో ‘దేశం’ అనే పదం స్పష్టంగా ఉంది. దానిని నిలుపుతూ ఆధునిక తెలుగులో పరిచితమైన భౌగోళిక నామాన్ని వాడింది.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: ఫరోకు, అతని సేవకులందరికీ, అతని దేశమంతటికీ
  rationale: మూడుసార్లు వచ్చిన לְ ఆయా వ్యక్తులు, దేశం యాహ్వే కార్యాల ప్రభావానికి గురైనవని సూచిస్తుంది. ‘కు/కి’ రూపాలు మూలంలోని సంబంధాన్ని యథాశక్తి తెరిచి ఉంచుతాయి; సందర్భానుసారంగా ‘మీద/కు విరోధంగా’ అనే తీర్పు భావం కూడా సాధ్యమని పాదటిప్పణి తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: వచనంలో నిబంధన దైవనామం నేరుగా ఉంది. బిరుదును పెట్టకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: ఫరో మొదలైనవారితో యాహ్వే కార్యాల సంబంధం
  choice: ఫరోకు… సేవకులందరికీ… దేశమంతటికీ
  alternative: ఫరోకు విరోధంగా… సేవకులందరికీ విరోధంగా… దేశమంతటికీ విరోధంగా
  rationale: హీబ్రూ לְ ప్రభావిత లక్ష్యాన్ని సూచించగలదు; ఈ సందర్భంలో తీర్పు భావం బలంగా ఉన్నప్పటికీ, ప్రధాన పాఠంలో మరింత తటస్థమైన నిర్మాణాన్ని ఉంచి నిజమైన వ్యాకరణ విస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని పునరుక్తిని వీలైనంతగా నిలుపుతూ, తెలుగు వాక్యప్రవాహం సహజంగా ఉండేలా నిర్మించబడింది.
