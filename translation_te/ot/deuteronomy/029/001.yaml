  source_fidelity: ప్రధాన అనువాదం హీబ్రూ వాక్యనిర్మాణాన్ని, ‘అన్ని ఇశ్రాయేలు,’ ప్రత్యక్షసాక్ష్య భావాన్ని, యాహ్వే నామాన్ని, అలాగే לְ యొక్క తటస్థమైన ‘కు/కి’ సంబంధాన్ని సరిగా నిలుపుతుంది. సందర్భంలో ‘వ్యతిరేకంగా/పైకి’ అనే తీర్పు భావం సాధ్యమే గాని ప్రధాన పాఠంలో దానిని బలవంతంగా చేర్చకపోవడం సముచితం.
