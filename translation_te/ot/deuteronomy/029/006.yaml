source:
  edition: WLC
  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: te
  text: మీరు ఈ స్థలానికి వచ్చినప్పుడు[a], హెష్బోను రాజైన సీహోను, బాషాను రాజైన ఓగు మనలను యుద్ధానికి ఎదుర్కొనడానికి బయలుదేరి వచ్చారు; మనం వారిని ఓడించాం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు మీరు ఈ స్థలానికి వచ్చారు.” హీబ్రూ కథన రూపాన్ని సాధారణ సమన్వయంగా గానీ, కాలసంబంధంగా గానీ అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మనం వారిని కొట్టాం.” హీబ్రూ క్రియ సైనిక సందర్భాల్లో తరచుగా ఓడించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: మీరు ... వచ్చినప్పుడు
  rationale: బוא అనే క్రియ యొక్క Qal wayyiqtol ద్వితీయ పురుష బహువచన రూపం. తరువాతి చర్యతో సహజమైన కాలసంబంధాన్ని తెలుగులో తెలియజేస్తూనే, ‘మరియు మీరు వచ్చారు’ అనే సమన్వయ పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలానికి
  rationale: מָקוֹם అంటే ‘స్థలం’; אֶל దిశను సూచిస్తున్నందున ‘ఈ స్థలానికి’ సహజమైన తెలుగు రూపం.
- source_word: וַיֵּצֵא
  choice: ఎదురుగా వచ్చారు
  rationale: יצא ప్రాథమికంగా ‘బయటికి వచ్చు/వెళ్లు’. לִקְרָאתֵנוּతో కలిసి యుద్ధసందర్భంలో ఎదుర్కొనడానికి రావడాన్ని సూచిస్తుంది; తెలుగులో మొత్తం పదబంధాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన సీహోను
  rationale: రాజు బిరుదును సహజ తెలుగు అన్వయంతో ఉంచి, వ్యక్తి మరియు స్థల పేర్లను లిప్యంతరీకరించాం.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగు
  rationale: ముందటి రాజబిరుదు పదబంధానికి సమాంతరంగా అనువదించి, పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: మనతో యుద్ధం చేయడానికి ఎదురుగా
  rationale: లిఖితార్థంగా ‘మనలను ఎదుర్కొనడానికి, యుద్ధానికి’. యుద్ధ ఉద్దేశాన్ని స్పష్టంగా, కానీ ‘దండెత్తారు’ వంటి అదనపు భావం చేర్చకుండా సహజ తెలుగులో ఇచ్చాం.
- source_word: וַנַּכֵּם
  choice: మనం వారిని ఓడించాం
  rationale: נכה Hiphil రూపం అక్షరార్థంగా ‘వారిని కొట్టాం’; సైనిక సందర్భంలో నిర్ణాయకంగా ఓడించడాన్ని సూచిస్తుంది. సహజ తెలుగులో ‘ఓడించాం’ అని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో పేర్కొన్నాం.
