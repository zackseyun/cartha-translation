translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని ద్వితీయ పురుష బహువచన ‘మీరు’ మరియు ప్రథమ పురుష బహువచన ‘మనం’ భేదాన్ని నిలిపాం; వ్యక్తి, స్థల పేర్లకు సాధారణ తెలుగు బైబిలు లిప్యంతరణను ఉపయోగించాం.
