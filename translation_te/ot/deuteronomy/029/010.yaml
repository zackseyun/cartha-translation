base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: te
  text: మీ చిన్నపిల్లలు[a], మీ భార్యలు, మీ శిబిరం మధ్యలో నివసించే పరదేశి[b], మీ కట్టెలు నరికేవాడి మొదలుకొని మీ నీళ్లు తోడేవాడి వరకు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ పిల్లలు.’ హీబ్రూ טַף ముఖ్యంగా చిన్నపిల్లలను లేదా ఆధారపడిన కుటుంబ సభ్యులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీ మధ్య నివసించే విదేశీయుడు.’ హీబ్రూ גֵּר సమాజంలో స్థిరంగా నివసించే పరదేశిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలు
  rationale: טַף ప్రధానంగా చిన్నపిల్లలను, విస్తృతంగా ఆధారపడిన కుటుంబ సభ్యులను సూచిస్తుంది. ‘చిన్నపిల్లలు’ అనే పదం ఇక్కడి నిర్దిష్ట భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נְשֵׁיכֶם
  choice: మీ భార్యలు
  rationale: నిబంధన సమాజం కూడిన ఈ సందర్భంలో נָשִׁיםకు స్వామ్యప్రత్యయం కలిసినప్పుడు ‘భార్యలు’ అనేది సహజమైన సంబంధార్థం.
- source_word: וְגֵרְךָ
  choice: పరదేశి
  rationale: גֵּר కేవలం ప్రయాణికుడిని కాక, ఇశ్రాయేలు సమాజంలో నివసించే విదేశీయుణ్ణి సూచిస్తుంది. ‘పరదేశి’ ఆ సామాజిక స్థితిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది; నివాస భావాన్ని తరువాతి క్రియ స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: మీ శిబిరం మధ్యలో నివసించే
  rationale: ఈ పదబంధం పరదేశి శిబిర సమాజం లోపల ఉన్నాడని తెలియజేస్తుంది. తెలుగులో ‘నివసించే’ అని చెప్పడం גֵּר యొక్క స్థిరనివాస భావంతో కలిసి సహజంగా ఉంటుంది.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: మీ కట్టెలు నరికేవాడి మొదలుకొని
  rationale: חֹטֵב అనే కర్తృవాచక క్రియారూపాన్ని ‘నరికేవాడు’గా ఉంచి, מִן యొక్క శ్రేణి ఆరంభ భావాన్ని ‘మొదలుకొని’తో వ్యక్తం చేసింది.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: మీ నీళ్లు తోడేవాడి వరకు
  rationale: שֹׁאֵב నీటిని బావి లేదా నీటి వనరు నుంచి తోడే పనిని సూచిస్తుంది. עַד యొక్క శ్రేణి ముగింపు భావాన్ని ‘వరకు’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: నిబంధన సభ యొక్క సామాజిక పరిధి
  choice: చిన్నపిల్లలు, భార్యలు, సమాజంలో నివసించే పరదేశులు, సాధారణ శ్రమ చేసే పనివారు సహా సమాజంలోని అన్ని వర్గాలనూ వచనం చేర్చుతుంది.
  alternative: ఈ జాబితా ఇశ్రాయేలీయులను మాత్రమే సూచిస్తుంది; పనివారి ప్రస్తావన కేవలం రూపకం.
  rationale: హీబ్రూ వచనం నిబంధన సభలో నిలిచినవారి విస్తృత జాబితాను ప్రత్యక్షంగా ఇస్తుంది. పరదేశిని, కట్టెలు నరికేవాణ్ణి, నీళ్లు తోడేవాణ్ణి నిజమైన సామాజిక వర్గాలుగా చదవడం వచనపు సాధారణ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలో మొదట బహువచన స్వామ్యరూపాలు, తరువాత సమూహాన్ని ఉద్దేశించిన ఏకవచన స్వామ్యరూపాలు ఉన్నాయి; తెలుగులో అసహజమైన ఆకస్మిక మార్పును నివారిస్తూ సమూహార్థక ‘మీ’ని అంతటా వాడాం. ఇది ముందరి వాక్యానికి కొనసాగింపు కావడంతో చివర కామాను ఉంచాం.
