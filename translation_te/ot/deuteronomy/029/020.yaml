id: DEU.29.20
reference: Deuteronomy 29:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: te
  text: ఈ ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన నిబంధన శాపాలన్నిటి[a] ప్రకారం, యెహోవా అతన్ని ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి విపత్తుకు గురిచేయడానికి వేరుచేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిబంధనలో ప్రమాణంతో కూడిన శాపాలన్నిటి ప్రకారం.” హీబ్రూ పదం ప్రమాణం ద్వారా విధించబడిన నిబంధన శాపాలను ప్రత్యేకంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: అతన్ని ... ప్రత్యేకంగా వేరుచేస్తాడు
  rationale: בדל హిఫీల్ రూపం ఒక వ్యక్తిని సమూహం నుండి వేరుచేయడాన్ని సూచిస్తుంది. తీర్పు సందర్భంలోని లక్ష్యిత భావాన్ని ‘ప్రత్యేకంగా’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సహజంగా గుర్తించగల ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לְרָעָה
  choice: విపత్తుకు
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక, నిబంధన తీర్పువల్ల కలిగే హానికరమైన పరిణామాన్ని సూచిస్తుంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి
  rationale: מן বৃহత్తర నిబంధన సమాజం నుండి వేరుచేయబడటాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: כְּכֹל
  choice: అన్నిటి ప్రకారం
  rationale: כְּ శిక్షకు, వ్రాయబడిన నిబంధన శాపాలకు మధ్య ఉన్న అనురూపతను సూచిస్తుంది.
- source_word: אָלֹות
  choice: శాపాలు
  rationale: אָלָה నిబంధన సందర్భంలో ప్రమాణంతో అమలులోకి వచ్చే శాపాలను సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘శాపాలు’ వాడి, ప్రమాణ సంబంధిత ఛాయను పాదసూచికలో ఉంచాం.
- source_word: הַבְּרִית
  choice: నిబంధన
  rationale: בְּרִיתకు బైబిలు-వేదాంత సందర్భంలో స్థిరమైన, సహజమైన తెలుగు సమానం.
- source_word: הַכְּתוּבָה
  choice: రాసి ఉన్న
  rationale: స్త్రీలింగ ఏకవచన కర్మణి కృదంతం వ్యాకరణపరంగా ‘నిబంధన’తో సరిపోలినా, భావపరంగా దాని శాపాలు గ్రంథంలో నమోదు చేయబడ్డాయని తెలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో ‘శాపాలు’తో అనుసంధానించడం స్పష్టంగా ఉంటుంది.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: ఈ ధర్మశాస్త్ర గ్రంథంలో
  rationale: סֵפֶרను ‘గ్రంథం’గా, תּוֹרָהను ఈ సందర్భంలోని నిబంధన ధర్మశాస్త్ర సమాహారాన్ని సూచించే ‘ధర్మశాస్త్రం’గా అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపంలో నిలిపాం.
- issue: לְרָעָהలోని తీర్పు స్వభావం
  choice: విపత్తుకు
  alternative: కీడుకు
  rationale: ఈ సందర్భం దేవుడు నైతిక చెడుకు నియమిస్తాడని కాక, నిబంధన ఉల్లంఘనకు శిక్షాత్మక విపత్తును కలిగిస్తాడని సూచిస్తుంది. ‘విపత్తు’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: אָלֹותలో ప్రమాణ-శాప భావం
  choice: ప్రధాన పాఠ్యంలో ‘శాపాలు’; పాదసూచికలో ‘ప్రమాణంతో కూడిన శాపాలు’
  alternative: ప్రధాన పాఠ్యంలోనే ‘ప్రమాణ-శాపాలు’
  rationale: సులభంగా అర్థమయ్యే పాఠ్యాన్ని నిలుపుతూ, నిబంధన ప్రమాణానికి సంబంధించిన నిజమైన పదార్థ ఛాయను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని వేరుచేయడం, విపత్తు, నిబంధన శాపాలు అనే భావక్రమాన్ని కాపాడాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
