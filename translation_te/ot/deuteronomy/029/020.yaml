  source_fidelity: మూలంలోని וְהִבְדִּילוֹ (‘అతన్ని వేరుచేస్తాడు/ప్రత్యేకంగా విడదీస్తాడు’) మరియు לְרָעָה (‘విపత్తుకోసం/విపత్తుకు గురిచేయడానికి’) భావాలను ముసాయిదా మొత్తంగా అందిస్తోంది. అయితే రెండో భాగంలో ‘అతనికి జరుగుతుంది’ అనే స్వతంత్ర క్రియను చేర్చడం మూలంలోని ప్రధాన క్రియతో ఉన్న సంబంధాన్ని బలహీనపరుస్తుంది. అలాగే הַכְּתוּבָה వ్యాకరణపరంగా ‘నిబంధన’ను విశేషిస్తుంది; తెలుగులో దీనిని స్పష్టంగా చూపడం ఉత్తమం.
