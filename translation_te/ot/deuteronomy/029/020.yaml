  to: ఈ ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన నిబంధన శాపాలన్నిటి[a] ప్రకారం, యెహోవా అతన్ని ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి విపత్తుకు గురిచేయడానికి వేరుచేస్తాడు.
