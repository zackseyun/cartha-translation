source:
  edition: WLC
  text: וַ/יִּתְּשֵׁ֤/ם יְהוָה֙ מֵ/עַ֣ל אַדְמָתָ֔/ם בְּ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/יַּשְׁלִכֵ֛/ם אֶל אֶ֥רֶץ אַחֶ֖רֶת כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: te
  text: యహ్వే కోపంతో, ఉగ్రతతో, మహా ఆగ్రహంతో వారిని వారి దేశభూమి నుండి పెకలించి[a], వేరే దేశంలోకి విసిరివేశాడు—ఈ రోజున ఉన్నట్లుగా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పీకివేసి’ లేదా ‘వేరుతో పెకలించి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఈ దినమువలె’ లేదా ‘ఈ రోజున ఉన్నట్లుగా.’ ఇది తీర్పు ఫలితం ఆ సమయంలో స్పష్టంగా ఉన్నదని సూచించే సూత్రప్రయోగం.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: వారిని పెకలించి
  rationale: נתשׁ బలవంతంగా పీకడం లేదా పెకలించడం అనే భావాన్ని ఇస్తుంది. భూమినుండి ప్రజలను తొలగించడాన్ని మొక్కను పెకలించే సజీవ రూపకంతో తెలుగులో ఇది నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: מֵעַל אַדְמָתָם
  choice: వారి నేలనుండి
  rationale: אֲדָמָה ఇక్కడ నేల లేదా దేశభూమిని సూచిస్తుంది. ‘వారి నేల’ అనే ప్రయోగం భూమితో వారి అనుబంధాన్నీ, దానినుండి తొలగింపునూ సహజంగా తెలియజేస్తుంది.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: కోపంతో, ఉగ్రతతో, మహా ఆగ్రహంతో
  rationale: మూలంలోని మూడు సమీపార్థక ఆగ్రహపదాల ఉద్దేశపూర్వక సంచయాన్ని కుదించకుండా, తెలుగులో మూడు వేర్వేరు బలమైన పదాలతో నిలిపింది; גָּדוֹלను ‘మహా’గా ప్రత్యక్షంగా తెలిపింది.
- source_word: וַיַּשְׁלִכֵם
  choice: విసిరివేశాడు
  rationale: שלך యొక్క ‘విసురు/పడవేయు’ అనే బలమైన భావాన్ని, తీర్పులో జరిగిన బలవంతపు దేశబహిష్కరణను స్పష్టంగా చూపే సహజ తెలుగు క్రియతో వ్యక్తం చేసింది.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: వేరే దేశంలోకి
  rationale: ఇది మరో భూభాగంలోకి తరలింపును సూచిస్తుంది. ‘దేశంలోకి’ గమ్యస్థానంలో ప్రవేశించే కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: నేటికీ కనిపిస్తున్నట్టుగా
  rationale: ‘ఈ దినంలాగా’ అనే హీబ్రూ సూత్రప్రయోగం, తీర్పు ఫలితం మాట్లాడుతున్న కాలంలో స్పష్టంగా కనిపిస్తోందని సూచిస్తుంది. తెలుగు వాక్యం ఆ భావాన్ని సహజంగా ఇస్తుంది; పదశః రూపాన్ని పాదటిప్పణి నమోదు చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం మూలరూపానికి నిబద్ధంగా ఉంటుంది.
- issue: దైవిక ఆగ్రహాన్ని తెలిపే వరుస పదాలు
  choice: కోపంతో, ఉగ్రతతో, మహా ఆగ్రహంతో
  alternative: తీవ్రమైన కోపంతో
  rationale: హీబ్రూ వాక్యం אַף, חֵמָה, קֶצֶף అనే మూడు పదాలను పేర్చి తీర్పు తీవ్రతను పెంచుతుంది. వాటిని ఒకే సాధారణ పదబంధంగా కుదించకుండా ఆ వాక్చాతుర్యాన్ని నిలిపింది.
- issue: כַּיּוֹם הַזֶּה కాలసూచక సూత్రప్రయోగం
  choice: నేటికీ కనిపిస్తున్నట్టుగా
  alternative: ఈ రోజు ఉన్నట్టుగా
  rationale: ఈ మాట తీర్పు ఫలితం అప్పటి వర్తమాన పరిస్థితిలో ప్రత్యక్షంగా ఉందని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇచ్చి, దాని పదశః అనిశ్చితిని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించింది. ‘పెకలించి’ మరియు ‘విసిరివేశాడు’ మూలంలోని బలమైన తీర్పు చిత్రణను నిలుపుతాయి. సమీపార్థకమైన మూడు ఆగ్రహపదాలను ఉద్దేశపూర్వకంగా వేర్వేరుగా ఉంచింది.
