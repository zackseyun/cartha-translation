revisions:
- from: కాబట్టి యహ్వే కోపంతో, ఉగ్రతతో, మహా ఆగ్రహంతో వారి నేలనుండి వారిని పెకలించి[a], వేరే దేశంలోకి విసిరివేశాడు—నేటికీ కనిపిస్తున్నట్టుగా.[b]
  to: యహ్వే కోపంతో, ఉగ్రతతో, మహా ఆగ్రహంతో వారిని వారి దేశభూమి నుండి పెకలించి[a], వేరే దేశంలోకి విసిరివేశాడు—ఈ రోజున ఉన్నట్లుగా.[b]
  rationale: The revision removes an unsupported causal connective and renders the concluding Hebrew idiom more closely without adding ‘still’ or explicitly paraphrasing it as visible evidence. It otherwise preserves the draft’s strong, natural renderings and both footnote anchors.
