  text: הַ֨/נִּסְתָּרֹ֔ת לַ/יהוָ֖ה אֱלֹהֵ֑י/נוּ וְ/הַ/נִּגְלֹ֞ת לָ֤ׄ/נׄוּׄ וּׄ/לְׄ/בָׄנֵׄ֨יׄ/נׄוּׄ֙ עַד עוֹלָ֔ם לַ/עֲשׂ֕וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: te
  text: దాచబడిన సంగతులు మన దేవుడైన యెహోవాకే చెందుతాయి[a]. అయితే వెల్లడైన సంగతులు మనకూ మన పిల్లలకూ శాశ్వతంగా చెందుతాయి[b]—ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ మనం పాటించడానికి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాచబడిన సంగతులు’ అని అనువదించిన మాటను ‘రహస్య సంగతులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మసొరెతు పాఠంలో ‘మనకూ మన పిల్లలకూ’ అనే మాటల మీద ప్రత్యేక బిందువులు ఉన్నాయి. అవి ప్రాచీన లేఖకుల పాఠ్య గుర్తులు; వాటి ఖచ్చితమైన ఉద్దేశం స్పష్టంగా తెలియదు.
    reason: textual_note
  - marker: c
    text: ‘ధర్మశాస్త్రం’ అని అనువదించిన హీబ్రూ పదానికి ‘ఉపదేశం’ అనే అర్థం కూడా ఉంది; ద్వితీయోపదేశకాండంలో అది మోషే ఇశ్రాయేలు ఎదుట ఉంచిన నిబంధనా బోధను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: దాచబడిన సంగతులు
  rationale: סתר ధాతువు నుంచి వచ్చిన కర్మణి రూపం ఇక్కడ నామవాచకంగా వాడబడింది. ‘దాచబడిన సంగతులు’ అనే అనువాదం మానవులకు తెలియకుండా ఉన్న విషయాల భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవాకే
  rationale: לְ ఉపసర్గ ఇక్కడ చెందినదనాన్ని సూచిస్తుంది. ‘కే’ అనే నిశ్చయార్థక రూపం దాచబడినవి యెహోవాకు చెందుతాయనే వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది; יהוה అనే వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְהַנִּגְלֹת
  choice: అయితే వెల్లడైన సంగతులు
  rationale: గלה ధాతువు నుంచి వచ్చిన కర్మణి రూపం ‘దాచబడిన సంగతులు’కు సమాంతరంగా ఉంది. וְ సంధిని సందర్భంలోని వ్యత్యాసం కారణంగా ‘అయితే’గా అనువదించాం.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: మనకూ మన పిల్లలకూ చెందుతాయి
  rationale: మొదటి భాగంలోని చెందినదనే భావాన్ని తెలుగులో సహజత కోసం మళ్లీ స్పష్టం చేశాం. בנים ఇక్కడ మగ కుమారులకు మాత్రమే కాక తరువాతి తరానికి ప్రాతినిధ్యంగా ఉన్నందున ‘పిల్లలు’ అని అనువదించాం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: నిలకడగా కొనసాగడాన్ని సూచించే ఈ హీబ్రూ నుడికారానికి ‘శాశ్వతంగా’ సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: לַעֲשׂוֹת
  choice: మనం పాటించడానికే
  rationale: לְతో కూడిన క్రియానామం ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది. ఆజ్ఞల విషయమై ‘చేయడం’ కంటే ‘పాటించడం’ ఆధునిక తెలుగులో సహజంగా ఉండి విధేయత భావాన్ని తెలియజేస్తుంది; ‘కే’ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: אֵת כָּל דִּבְרֵי
  choice: మాటలన్నిటినీ
  rationale: דִּבְרֵיని ‘మాటలు’గా ఉంచడం ద్వారా నిబంధనలో పలికిన నిర్దిష్ట ఆదేశాలపై ఉన్న పాఠ్య ప్రాధాన్యం నిలుస్తుంది.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని
  rationale: תורהకు ‘ఉపదేశం’ అనే విస్తృతార్థం ఉన్నప్పటికీ, ద్వితీయోపదేశకాండంలోని నిబంధనా సందర్భంలో ‘ధర్మశాస్త్రం’ గుర్తించదగిన, సందర్భోచితమైన పదం.
theological_decisions:
- issue: దాచబడినవాటి మరియు వెల్లడైనవాటి పరిధి
  choice: దేవునికే చెందిన విషయాలకు, ఇశ్రాయేలుకు విధేయత కోసం వెల్లడించిన నిబంధనా బోధకు మధ్య ఉన్న సాధారణ వ్యత్యాసాన్ని అలాగే ఉంచడం
  alternative: ఈ మాటను సమస్త దైవిక మర్మాల గురించిన సంపూర్ణ జ్ఞానసూత్రంగా గానీ, సమీప సందర్భంలోని ఆశీర్వాదాలు-శాపాలకు మాత్రమే పరిమితమైన ప్రకటనగా గానీ నిర్దిష్టీకరించడం
  rationale: హీబ్రూ పాఠం ఈ రెండు వర్గాల విషయాలను వివరంగా నిర్వచించదు. అందువల్ల అనువాదం తక్షణ నిబంధనా సందర్భాన్ని గౌరవిస్తూ, పాఠంలోని ఉద్దేశపూర్వక విస్తృతతను మరియు theological tensionను నిలుపుతుంది.
- issue: వెల్లడైన సంగతుల ఉద్దేశం
  choice: ధర్మశాస్త్రంలోని మాటలన్నిటినీ పాటించడమే వెల్లడికి ఉద్దేశమని చూపడం
  alternative: వెల్లడైన సంగతులు కేవలం జ్ఞానాన్ని అందించడానికి ఇచ్చబడ్డాయని భావించడం
  rationale: לַעֲשׂוֹת అనే ఉద్దేశార్థక నిర్మాణం వెల్లడిని ఆచరణాత్మక విధేయతతో నేరుగా కలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, తెలుగులో చెందినదనే భావాన్ని రెండో భాగంలో స్పష్టంగా పునరుక్తం చేశాం. ‘చేయడం’కు బదులు ఆజ్ఞలకు విధేయతను సహజంగా తెలిపే ‘పాటించడం’ వాడాం; దైవిక రహస్యాల పరిధిని పాఠం చెప్పినదానికంటే విస్తరించలేదు లేదా కుదించలేదు.
