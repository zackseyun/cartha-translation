    rationale: ‘వారికి ... దేవుళ్లు’ అనే డాష్-తరువాతి నిర్మాణం, ‘వారికి’ అనే దత్తివిభక్తి మరియు ‘దేవుళ్లు’ అనే ప్రథమావిభక్తి మధ్య స్పష్టమైన వ్యాకరణ సంబంధాన్ని ఇవ్వదు. విశేషణ వాక్యాలను ‘ఇతర దేవుళ్లను’కు ముందుగా ఉంచడం ద్వారా ఇది పరిష్కారమవుతుంది.
