revisions:
- from: వారు వెళ్లి ఇతర దేవుళ్లను సేవించారు; వారికి సాష్టాంగపడ్డారు—వారు ఎరుగని దేవుళ్లు, ఆయన వారికి కేటాయించని దేవుళ్లు.[a]
  to: వారు వెళ్లి, వారు ఎరుగని, ఆయన వారికి కేటాయించని ఇతర దేవుళ్లను సేవించి, వారికి వంగి నమస్కరించారు.[a]
  rationale: 'సవరణ ప్రధానంగా తెలుగు వాక్యనిర్మాణాన్ని సహజం చేస్తుంది: రెండు హెబ్రీ సంబంధవాచక విశేషణాలను ‘ఇతర దేవుళ్లను’కు నేరుగా అనుసంధానిస్తుంది. క్రియల క్రమం, సేవ చేయడం మరియు వంగి నమస్కరించడం మధ్య భేదం, అలాగే చివరి ఏకవచన క్రియలోని కర్త అస్పష్టత అన్నీ భద్రంగా ఉన్నాయి. పాదటిప్పణి గుర్తును కేటాయింపు-వాక్యానికి సంబంధించిన స్థానం బదులు వాక్యాంతంలో ఉంచడం ద్వారా అది ప్రత్యామ్నాయ పఠనానికే వర్తిస్తుందని కొనసాగుతుంది.'
