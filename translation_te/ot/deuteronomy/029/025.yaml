source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ וַ/יַּֽעַבְדוּ֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲוּ֖וּ לָ/הֶ֑ם אֱלֹהִים֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/לֹ֥א חָלַ֖ק לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: te
  text: వారు వెళ్లి, వారు ఎరుగని, ఆయన వారికి కేటాయించని ఇతర దేవుళ్లను సేవించి, వారికి వంగి నమస్కరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి కేటాయించబడని దేవుళ్లు.” హెబ్రీ పాఠ్యంలో ఏకవచన కర్త ప్రత్యక్షంగా చెప్పబడలేదు; అది బహుశా దేవుణ్ణి సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వారు వెళ్లి
  rationale: הלך అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘వెళ్లు’ను నిలుపుతూ, భ్రష్టారాధనకు దారితీసిన హెబ్రీ క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד అంటే సాధారణంగా ‘సేవించు.’ తరువాతి క్రియ సాష్టాంగపడడాన్ని ప్రత్యేకంగా సూచిస్తున్నందున, రెండింటి మధ్య తేడాను ఇది కాపాడుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: אֲחֵרִים యొక్క సూటి అర్థం ‘ఇతర’; ఇక్కడ ‘అన్య’ లేదా ‘విదేశీ’ అని అదనపు భావం చేర్చకుండా మూలాన్ని అనుసరిస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: వారికి సాష్టాంగపడ్డారు
  rationale: שׁחה సూచించే వంగి నమస్కరించడం లేదా నేలపై పడి ఆరాధించడం అనే శారీరక చిత్రాన్ని నిలుపుతుంది; ముందున్న ‘సేవించారు’తో భావభేదాన్ని కూడా కాపాడుతుంది.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: వారు ఎరుగని దేవుళ్లు
  rationale: ידע ఇక్కడ కేవలం సమాచారం తెలుసుకోవడం కంటే అనుభవపూర్వక లేదా సంబంధపూర్వక పరిచయాన్ని సూచించగలదు; ‘ఎరుగని’ ఆ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: וְלֹא חָלַק לָהֶם
  choice: ఆయన వారికి కేటాయించని దేవుళ్లు
  rationale: חלק అంటే ‘పంచు, భాగంగా ఇవ్వు, కేటాయించు.’ ఏకవచన క్రియకు సందర్భానుసారంగా దేవుడే అంతర్లీన కర్త అని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తూ, హెబ్రీలో కర్త ప్రత్యక్షంగా లేదన్న అంశాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
theological_decisions:
- issue: חָלַק అనే 3వ పురుష ఏకవచన క్రియకు అంతర్లీన కర్త
  choice: దేవుడిని సూచించే ‘ఆయన’ను కర్తగా తీసుకోవడం
  alternative: ‘వారికి కేటాయించబడని దేవుళ్లు’ అనే కర్మణి భావం
  rationale: హెబ్రీలో కర్త ప్రత్యక్షంగా లేకపోయినా, ఏకవచన క్రియ మరియు ద్వితీయోపదేశకాండంలోని దైవిక కేటాయింపు సందర్భం దేవుడిని అంతర్లీన కర్తగా గ్రహించడానికి అనుకూలిస్తాయి. అయినప్పటికీ వ్యాకరణపరమైన అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గాంభీర్యం మరియు హెబ్రీ క్రియల మధ్య భావభేదం నిలిచేలా రూపొందించబడింది. ‘సాష్టాంగపడ్డారు’ శారీరక ఆరాధనా చర్యను స్పష్టంగా తెలియజేస్తుంది.
