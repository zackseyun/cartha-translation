id: DEU.29.11
reference: Deuteronomy 29:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: te
  text: నీ దేవుడైన యహ్వే ఈ రోజు నీతో చేస్తున్న[b] నిబంధనలోకి, ఆయన ప్రమాణంలోకి[a] నీవు ప్రవేశించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన శాపంతో బద్ధమైన ప్రమాణంలోకి.” హీబ్రూ పదం నిబంధన ఉల్లంఘనకు సంబంధించిన శిక్షలు లేదా శాపాలు కలిసిన ప్రమాణాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈ రోజు నీతో కోస్తున్నాడు.” ‘నిబంధనను కోయడం’ అనేది నిబంధన చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: నీవు ప్రవేశించడానికి
  rationale: עבר అనే క్రియకు అక్షరార్థంగా ‘దాటడం’ అనే భావం ఉన్నా, בבריתతో కూడిన ఈ నిబంధన సందర్భంలో అది నిబంధన బాధ్యతల్లోకి ప్రవేశించడాన్ని సూచిస్తుంది. לְ ఉపసర్గంలోని ఉద్దేశం/ఫలిత భావాన్ని ‘ప్రవేశించడానికి’ సహజంగా తెలియజేస్తుంది.
- source_word: בִּבְרִית
  choice: నిబంధనలోకి
  rationale: בְּ ఉపసర్గ ఇక్కడ ప్రవేశాన్ని సూచిస్తుంది; ‘నిబంధనలోకి’ అనేది తెలుగులో సహజంగా ఉండి, בְּרִית యొక్క కేంద్రీయ నిబంధన భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయం కలిగిన స్వామ్య సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: וּבְאָלָתוֹ
  choice: ఆయన ప్రమాణంలోకి
  rationale: אָלָה ప్రమాణాన్ని, ముఖ్యంగా నిబంధన శిక్షలు లేదా శాపం కలిసిన ప్రమాణాన్ని సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన ‘ప్రమాణం’ ఉంచి, శాప సంబంధిత భావాన్ని పాదసూచికలో కాపాడాం.
- source_word: כֹּרֵת
  choice: చేస్తున్నాడు
  rationale: כרת ברית అక్షరార్థంగా ‘నిబంధనను కోయడం’ అయినా, అది నిబంధన చేయడాన్ని సూచించే హీబ్రూ నుడికారం. వర్తమాన సందర్భంలోని కృదంత భావాన్ని ‘చేస్తున్నాడు’ తెలియజేస్తుంది.
- source_word: עִמְּךָ
  choice: నీతో
  rationale: עםతో కూడిన రెండవ పురుష ఏకవచన ప్రత్యయానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: తక్షణ నిబంధన కార్యక్రమ కాలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యెహోవా నామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం నిబంధన నామాన్ని నిలుపుతుంది.
- issue: אָלָהలోని ప్రమాణం-శాపం భావాన్ని ఎలా చూపాలి
  choice: ప్రధాన పాఠంలో ‘ప్రమాణం’; పాదసూచికలో శాపంతో బద్ధమైన ప్రమాణం అనే భావం
  alternative: శాపం; శాపాలతో కూడిన ప్రమాణం
  rationale: ఈ పదం కేవలం ప్రమాణాన్నీ, నిబంధన శిక్షలు కలిగిన శాప ప్రమాణాన్నీ సూచించవచ్చు. ప్రధాన పాఠంలో ఒకే భావాన్ని బలవంతంగా నిర్ణయించకుండా, నిజమైన పదార్థ విస్తృతిని పాదసూచికలో భద్రపరుస్తుంది.
- issue: כרת ברית అనే నుడికారాన్ని ఎలా అందించాలి
  choice: నిబంధన చేస్తున్నాడు
  alternative: నిబంధనను కోస్తున్నాడు
  rationale: అక్షరార్థ రూపం ఆధునిక తెలుగు పాఠకుడికి అపారదర్శకంగా ఉంటుంది. సహజ అర్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, మూల నుడికారాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి వాడబడింది. ఇది ముందరి వచనంతో వ్యాకరణపరంగా కొనసాగే ఉద్దేశార్థక వాక్యఖండం కాబట్టి ‘ప్రవేశించడానికి’ రూపం నిలుపబడింది. పునరుక్త దైవనామం మరియు ‘నీ దేవుడు’ అనే నిబంధన సూత్రం మూలానికి అనుగుణంగా రెండుసార్లు ఉంచబడ్డాయి.
