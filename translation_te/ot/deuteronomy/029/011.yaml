revisions:
- from: నీ దేవుడైన యహ్వే నిబంధనలోకి, ఆయన ప్రమాణంలోకి[a] నీవు ప్రవేశించడానికి—నీ దేవుడైన యహ్వే ఈ రోజు నీతో ఈ నిబంధన చేస్తున్నాడు.[b]
  to: నీ దేవుడైన యహ్వే ఈ రోజు నీతో చేస్తున్న[b] నిబంధనలోకి, ఆయన ప్రమాణంలోకి[a] నీవు ప్రవేశించడానికి.
  rationale: The revision preserves all lexical and theological choices of the draft, but removes the unsupported demonstrative and reshapes the sentence so that ‘Yahweh your God is making with you today’ functions as the Hebrew relative clause. Footnote anchors remain present and now attach directly to the covenant-making expression.
