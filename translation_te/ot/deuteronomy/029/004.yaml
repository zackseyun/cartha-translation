id: DEU.29.4
reference: Deuteronomy 29:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לֹֽא בָל֤וּ שַׂלְמֹֽתֵי/כֶם֙ מֵ/עֲלֵי/כֶ֔ם וְ/נַֽעַלְ/ךָ֥ לֹֽא בָלְתָ֖ה מֵ/עַ֥ל רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: te
  text: నేను అరణ్యంలో నలభై సంవత్సరాలు మిమ్మల్ని నడిపించాను. మీ ఒంటిమీద ఉన్న బట్టలు పాతబడలేదు; నీ కాలిమీద ఉన్న చెప్పు[a] అరిగిపోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం ఇక్కడ బహువచనం నుంచి ఏకవచనానికి మారుతుంది: అక్షరార్థంగా, “నీ చెప్పు నీ కాలిమీదనుండి అరిగిపోలేదు.” ఈ ఏకవచనం ఇశ్రాయేలును సమష్టిగా ఒకే ప్రజగా సంబోధించవచ్చు లేదా ఒక్కొక్క వ్యక్తికి వర్తించే భావాన్ని సూచించవచ్చు.'
    reason: మూలపాఠంలోని వచనసంఖ్య మార్పును వివరించడం
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: నేను … నడిపించాను
  rationale: הלך అనే క్రియ ఇక్కడ హిఫీల్ రూపంలో ‘నడిచేలా చేశాను/వెళ్లేలా చేశాను’ అనే కారణార్థాన్ని కలిగిస్తుంది. సందర్భంలో దేవుడు ఇశ్రాయేలును అరణ్యంలో నడిపించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘నడిపించాను’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר అనేది జనావాసం తక్కువైన అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ఇశ్రాయేలు ప్రయాణ సందర్భంలో ‘అరణ్యం’ సహజంగా, విస్తృత భావంతో సరిపోతుంది.
- source_word: בָלוּ / בָלְתָה
  choice: పాతబడలేదు / అరిగిపోలేదు
  rationale: בלה వాడకం వల్ల బట్టలు, పాదరక్షలు క్రమంగా చెడిపోవడం లేదా వాడుకతో అరిగిపోవడం సూచించబడుతుంది. తెలుగులో వస్తువును బట్టి ‘బట్టలు పాతబడలేదు,’ ‘చెప్పు అరిగిపోలేదు’ అనడం సహజంగా ఉంటుంది; రెండూ మూలంలోని ఒకే క్రియాభావాన్ని వ్యక్తం చేస్తాయి.
- source_word: שַׂלְמֹתֵיכֶם
  choice: మీ … బట్టలు
  rationale: ఈ బహువచన పదం సాధారణంగా ధరించే వస్త్రాలను సూచిస్తుంది. ‘బట్టలు’ ఆధునిక పాఠకులకు సహజమైన, విస్తృతమైన పదం.
- source_word: מֵעֲלֵיכֶם
  choice: మీ ఒంటిమీద ఉన్న
  rationale: అక్షరార్థంగా ‘మీ మీదనుండి’ అనే నిర్మాణం ఉన్నా, వస్త్రాలు ధరించి ఉన్నప్పటికీ పాతబడలేదనే భావాన్ని తెలుగులో ‘మీ ఒంటిమీద ఉన్న’ సహజంగా తెలియజేస్తుంది.
- source_word: נַעַלְךָ
  choice: నీ … చెప్పు
  rationale: ఏకవచన నామవాచకానికి రెండవ పురుష ఏకవచన ప్రత్యయం ఉంది. ప్రాచీన సందర్భంలోని పాదరక్షను తెలుగులో ‘చెప్పు’ స్పష్టంగా సూచిస్తుంది; మూలంలోని ఏకవచనాన్ని కూడా నిలుపుతుంది.
- source_word: מֵעַל רַגְלֶךָ
  choice: నీ కాలిమీద ఉన్న
  rationale: అక్షరార్థ నిర్మాణం ‘నీ కాలిమీదనుండి.’ అయితే చెప్పు ధరించి ఉన్నప్పటికీ అరిగిపోలేదనే భావాన్ని సహజ తెలుగులో ‘నీ కాలిమీద ఉన్న’ అని వ్యక్తం చేయడం సముచితం.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: కాలవ్యవధిని నేరుగా, అదనపు వివరణ లేకుండా అనువదిస్తుంది.
theological_decisions:
- issue: మొదటి భాగంలోని బహువచన సంబోధన నుంచి చివరి భాగంలోని ఏకవచన సంబోధనకు మార్పు
  choice: ‘మిమ్మల్ని/మీ బట్టలు’ తరువాత ‘నీ చెప్పు/నీ కాలు’ అని మూలంలోని సంఖ్యామార్పును నిలుపడం
  alternative: తెలుగులో సాఫీగా ఉండేందుకు చివరి భాగాన్ని కూడా ‘మీ చెప్పులు … మీ కాళ్లు’ అని బహువచనం చేయడం
  rationale: హీబ్రూ చివరి ఉపవాక్యంలో స్పష్టంగా ఏకవచన ప్రత్యయాలకు మారుతుంది. ఇది ఇశ్రాయేలును సమష్టిగా ఒక ప్రజగా సంబోధించడం కావచ్చు లేదా ప్రతి వ్యక్తికీ వర్తించే విభజనాత్మక ఏకవచనం కావచ్చు. ఏ భావమో ఖచ్చితంగా నిర్ణయించకుండా మూలంలోని ఉద్వేగాన్ని నిలిపి, పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘అరణ్యం,’ ‘బట్టలు,’ ‘చెప్పు’ వంటి సాధారణ పదాలు ఎంచుకోబడ్డాయి. హీబ్రూలోని బహువచన–ఏకవచన మార్పు కొద్దిగా అసాధారణంగా వినిపించినా ఉద్దేశపూర్వకంగా నిలుపబడింది.
