  source_fidelity: 'ప్రధాన అనువాదం హీబ్రూ మూలపాఠంలోని కారణార్థక ‘నేను నడిపించాను,’ నలభై సంవత్సరాల కాలవ్యవధి, వస్త్రాలు అరిగిపోకపోవడం, చివరి ఉపవాక్యంలోని ఏకవచన సంబోధనను విశ్వసనీయంగా ప్రతిబింబిస్తుంది. అయితే పాదసూచికలో ఇచ్చిన అక్షరార్థ వాక్యం హీబ్రూ పదక్రమం, సంబంధాన్ని తారుమారు చేస్తోంది: ‘నీ కాలిమీదనుండి నీ చెప్పు’ కాక, ‘నీ చెప్పు నీ కాలిమీదనుండి అరిగిపోలేదు’ కావాలి.'
  naturalness: ‘అరణ్యంలో,’ ‘నడిపించాను,’ ‘బట్టలు పాతబడలేదు,’ ‘చెప్పు అరిగిపోలేదు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. బహువచనం నుంచి ఏకవచనానికి మారడం మూలపాఠంలో ఉన్నందున ఉద్దేశపూర్వకంగా నిలుపబడింది.
