source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בָּ/אָ֣רֶץ הַ/הִ֑וא לְ/הָבִ֤יא עָלֶ֨י/הָ֙ אֶת כָּל הַ/קְּלָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֥פֶר הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: te
  text: కాబట్టి యాహ్వే కోపం ఆ దేశంపై రగిలింది; ఈ గ్రంథంలో వ్రాయబడిన శాపమంతటినీ యాహ్వే దానిమీదికి తెచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం ... రగులుకుంది
  rationale: హీబ్రూ నుడికారం కోపం మండడం అనే సజీవ చిత్రాన్ని ఇస్తుంది. ‘రగులుకుంది’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: בָּאָרֶץ הַהִוא
  choice: ఆ దేశంపై
  rationale: ఈ నుడికారంలో ב కోపం ఎవరిపై లేదా దేనిపై ఉందో సూచిస్తుంది; తీర్పు ఆ దేశంపై పడుతున్న సందర్భానికి ‘పై’ సరిపోతుంది.
- source_word: לְהָבִיא עָלֶיהָ
  choice: దానిపైకి రప్పించాడు
  rationale: హిఫిల్ క్రియ శాపాన్ని ఆ దేశంపైకి వచ్చేలా చేయడం అనే కారణార్థాన్ని వ్యక్తపరుస్తుంది. తెలుగు వాక్య సహజత్వం కోసం అంతర్లీన కర్తను క్రియలో స్పష్టం చేశాం.
- source_word: כָּל הַקְּלָלָה
  choice: శాపమంతటినీ
  rationale: ఏకవచనంలోని సమగ్రతను నిలుపుతూ ‘శాపమంతటినీ’ అని అనువదించాం; ఇది ‘ప్రతి శాపాన్ని’ అనే విభజిత భావం కంటే మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: הַכְּתוּבָה
  choice: వ్రాయబడిన
  rationale: నిష్క్రియాత్మక కృదంతంలోని లిఖిత, న్యాయపరమైన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: ఈ గ్రంథంలో
  rationale: סֵפֶר గ్రంథం, చుట్ట, పత్రం అనే అర్థాలు కలిగి ఉండవచ్చు. నిబంధన సందర్భంలో ‘గ్రంథం’ గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించాం.
- issue: కోపం మరియు శాపం మధ్య ఉద్దేశం లేదా ఫలితం
  choice: సెమీకోలన్‌తో వరుస సంఘటనగా అందించడం
  alternative: ‘రప్పించడానికి’ అని ఉద్దేశార్థంగా అనువదించడం
  rationale: לְతో కూడిన క్రియారూపం ఉద్దేశం లేదా ఫలితం రెండింటినీ సూచించగలదు. తెలుగు ప్రధాన పాఠం సంబంధాన్ని స్పష్టంగా ఉంచినా, దానిని కేవలం ఉద్దేశంగా మాత్రమే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ కోపం ‘మండడం’ అనే రూపకాన్ని ‘రగులుకుంది’తో నిలిపి, సమూహార్థక ఏకవచనాన్ని ‘శాపమంతటినీ’గా అందించాం.
