  yaml_path: translation/ot/deuteronomy/029/002.yaml
  text: the great trials that your eyes saw[a], those great signs and wonders.
translation:
  language: te
  text: నీ కళ్లే చూసిన ఆ గొప్ప పరీక్షలను[a], ఆ గొప్ప సూచక కార్యాలనూ అద్భుతాలనూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొప్ప శోధనలను.’ ఇక్కడ భావం పాపానికి ప్రలోభపెట్టడం కాదు; పరీక్షించడం లేదా రుజువుచేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: ఆ గొప్ప పరీక్షలను
  rationale: מַסּוֹת ఇక్కడ పాపానికి ప్రలోభపెట్టడాన్ని కాక, పరీక్షించి రుజువుచేసే సంఘటనలను సూచిస్తుంది. ‘గొప్ప పరీక్షలు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని గంభీరతను నిలుపుతుంది.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: నీ కళ్లే చూసిన
  rationale: ‘నీ కళ్లు చూశాయి’ అనే హీబ్రూ ప్రయోగం ప్రత్యక్ష సాక్ష్యాన్ని నొక్కిచెబుతుంది. తెలుగులో ‘నీ కళ్లే చూసిన’ అని ఇవ్వడం ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: הָאֹתֹת
  choice: సూచకక్రియలను
  rationale: אוֹתֹת దైవ కార్యాలకు సూచనలుగా నిలిచే క్రియలను సూచిస్తుంది. ‘సూచకక్రియలు’ కేవలం సంకేతాలనే భావనకంటే సందర్భంలోని కార్యాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהַמֹּפְתִים
  choice: అద్భుతాలను
  rationale: מוֹפְתִים ఆశ్చర్యం కలిగించే అసాధారణ దైవ కార్యాలను సూచిస్తుంది. ‘అద్భుతాలు’ ఆధునిక పాఠకులకు స్పష్టమైన, సహజమైన పదం.
- source_word: הַגְּדֹלִים הָהֵם
  choice: ఆ గొప్ప
  rationale: הָהֵם వెనుక పేర్కొన్న వాటిని ఉద్ఘాటనతో సూచిస్తుంది; తెలుగులో ‘ఆ’ ఆ సూచనను సహజంగా నిలుపుతుంది. ‘గొప్ప’ వాటి ప్రాముఖ్యతను, మహత్తును తెలియజేస్తుంది.
theological_decisions:
- issue: מַסּוֹת అనే పదానికి ‘పరీక్షలు’ లేదా ‘ప్రలోభాలు’ అనే అర్థం
  choice: పరీక్షలు
  alternative: ప్రలోభాలు
  rationale: ఈ సందర్భంలో భావం పరీక్షించడం లేదా రుజువుచేయడం; పాపానికి ప్రేరేపించడం కాదు. అందువల్ల ‘ప్రలోభాలు’ ఆధునిక తెలుగులో తప్పుదారి పట్టించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ప్రత్యక్ష సాక్ష్యాన్ని నొక్కిచెప్పే హీబ్రూ నుడికారాన్ని ‘నీ కళ్లే చూసిన’గా నిలుపుకున్నాం.
