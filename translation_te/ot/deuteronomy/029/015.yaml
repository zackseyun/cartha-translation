  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘జనాలు’ అనే పదం సందర్భంలోని దేశజన సమూహాలను సూచిస్తుంది; ‘అన్యజనులు’ అనే తరువాతి మతపరమైన ప్రత్యేకార్థాన్ని నివారించాం. మూలంలోని ‘మనం’/‘మీరు’ భేదాన్ని పరిష్కరించకుండా నిలిపాం.
