source:
  edition: WLC
  text: כִּֽי אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יָשַׁ֖בְנוּ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֵ֧ת אֲשֶׁר עָבַ֛רְנוּ בְּ/קֶ֥רֶב הַ/גּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: te
  text: ఎందుకంటే, ఐగుప్తు దేశంలో మనం ఎలా నివసించామో, మీరు దాటివచ్చిన జాతుల మధ్యగా మనం ఎలా దాటివెళ్లామో మీకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తు దేశంలో మనం నివసించిన దానిని, మీరు దాటివచ్చిన జాతుల మధ్యగా మనం దాటిన దానిని మీకు తెలుసు.” హీబ్రూ నిర్మాణం మనం నివసించిన మరియు దాటిన పరిస్థితులను లేదా అనుభవాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు కారణం లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְדַעְתֶּם
  choice: మీకు తెలుసు
  rationale: గత అనుభవం వల్ల శ్రోతలకు ప్రస్తుతం ఉన్న జ్ఞానాన్ని హీబ్రూ సంపూర్ణ క్రియ ఇక్కడ సూచిస్తుంది.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: మనం ఎలా నివసించామో
  rationale: వాచ్యంగా కఠినంగా ఉండే కర్మసూచక పదం-సంబంధ వాక్య నిర్మాణాన్ని, తెలిసిన పరిస్థితి లేదా అనుభవంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָשַׁבְנוּ
  choice: నివసించామో
  rationale: ישׁב అనే క్రియలోని నివసించడం/ఉండడం అనే సాధారణ అర్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా అందిస్తుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: హీబ్రూలోని ‘ఐగుప్తు దేశం’ అనే సంపూర్ణ పదబంధాన్ని నిలుపుతుంది.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: మనం ఎలా వెళ్లామో
  rationale: עבר అనే గమనార్థక క్రియను అతిగా ‘కష్టాలు అనుభవించాం’ అని వ్యాఖ్యానించకుండా, సందర్భానికి సహజంగా వ్యక్తం చేస్తుంది; నిర్మాణంలోని మరో సాధ్యమైన వాచ్యార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: జనాల మధ్యగా
  rationale: בקרב లోని ‘మధ్యలో/మధ్యగా’ భావాన్ని, ప్రయాణాన్ని సూచించే క్రియతో సహజంగా కలుపుతుంది; גוים ను తరువాతి మతపరమైన ‘అన్యజనులు’ అనే ప్రత్యేకార్థంతో అనువదించదు.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: మీరు దాటివచ్చిన
  rationale: శ్రోతలు ఆ జనాల మధ్యగా సాగిన ప్రయాణాన్ని సూచించే సంబంధ వాక్యాన్ని స్పష్టంగా ఉంచుతుంది; ‘మనం’ మరియు ‘మీరు’ అనే మూలపాఠంలోని మార్పును అలాగే కాపాడుతుంది.
