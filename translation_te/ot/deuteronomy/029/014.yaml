revisions:
- from: కాని నేడు మన దేవుడైన యహ్వే సన్నిధిలో మనతో ఇక్కడ నిలబడి ఉన్న ప్రతి ఒక్కరితోనూ, నేడు మనతో ఇక్కడ లేని ప్రతి ఒక్కరితోనూ[a] ఈ ఒడంబడిక చేస్తున్నాను.
  to: కాని నేడు మన దేవుడైన యహ్వే సన్నిధిలో మనతో ఇక్కడ నిలబడి ఉన్న ప్రతి ఒక్కరితోనూ, నేడు మనతో ఇక్కడ లేని ప్రతి ఒక్కరితోనూ ఈ ఒడంబడికను, ఈ ప్రమాణాన్ని చేస్తున్నాను.
  rationale: The revision retains the draft’s faithful rendering of the two groups and its noncommittal footnote. It adds ‘ఈ ప్రమాణాన్ని’ alongside ‘ఈ ఒడంబడికను’ because the draft makes explicit the governing covenant formula carried over from the preceding context; that formula includes both covenant and oath. No doctrinal interpretation is introduced.
