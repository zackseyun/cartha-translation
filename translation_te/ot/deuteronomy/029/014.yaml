id: DEU.29.14
reference: Deuteronomy 29:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: te
  text: కాని నేడు మన దేవుడైన యహ్వే సన్నిధిలో మనతో ఇక్కడ నిలబడి ఉన్న ప్రతి ఒక్కరితోనూ, నేడు మనతో ఇక్కడ లేని ప్రతి ఒక్కరితోనూ ఈ ఒడంబడికను, ఈ ప్రమాణాన్ని చేస్తున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: కాని
  rationale: ముందటి వచనంలోని ‘మీతో మాత్రమే కాదు’ అనే నిరాకరణకు కొనసాగింపుగా, ఇక్కడ వ్యతిరేక భావాన్ని తెలిపే అనుసంధానం సహజంగా సరిపోతుంది.
- source_word: אֶת אֲשֶׁר
  choice: ప్రతి ఒక్కరితోనూ
  rationale: ఇది ఒడంబడికలో చేర్చబడిన వ్యక్తులను సూచిస్తుంది. ముందటి వచనంలోని ఒడంబడిక క్రియను భావానుసారంగా కొనసాగిస్తూ, హీబ్రూ ఏకవచన పంపిణీ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: మనతో ఇక్కడ ... ఉన్న
  rationale: యేశ్ రూపం ఉనికిని లేదా ప్రత్యక్ష హాజరును తెలియజేస్తుంది; ‘మనతో ఇక్కడ ఉన్న’ అనేది దాని స్థలసంబంధ, సమూహసంబంధ భావాలను రెండింటినీ అందిస్తుంది.
- source_word: עֹמֵד
  choice: నిలబడి ఉన్న
  rationale: మూలంలోని స్పష్టమైన శారీరక భంగిమను నిలుపుతూ, ఒడంబడిక సభలో హాజరై ఉండడమనే సందర్భార్థాన్ని కూడా సహజంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కాలసూచకం; మూలంలో రెండుసార్లు వచ్చిన దానిని అనువాదంలోనూ రెండుసార్లు ఉంచి ఉద్ఘాటనను కాపాడాం.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో నిలబడటాన్ని గౌరవప్రదమైన మరియు సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామంలోని నాలుగు హీబ్రూ అక్షరాలకు ఆధునిక పండిత వాడుకలో సాధారణమైన లిప్యంతరీకరణను ఉపయోగించాం; దానిని బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన స్వామ్యార్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ
  choice: నేడు మనతో ఇక్కడ లేని ప్రతి ఒక్కరితోనూ
  rationale: మొదటి భాగానికి సమాంతర నిర్మాణాన్ని నిలుపుతూ, ‘లేరు’ అనే అస్తిత్వ నిరాకరణను కాపాడుతుంది; ఎవరు ఉద్దేశించబడ్డారో అనువాదంలో ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ‘నేడు మనతో ఇక్కడ లేనివారు’ అనే మాటల పరిధి
  choice: వారు ఎవరో నిర్దిష్టంగా నిర్ణయించకుండా విస్తృతమైన సూచనగా అనువదించడం
  alternative: సభకు రాని సమకాలీన ఇశ్రాయేలీయులు, ఇంకా పుట్టని భవిష్యత్తు తరాలు, లేదా ఈ రెండు వర్గాలూ అని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం సూచితుల పరిధిని ఉద్దేశపూర్వకంగా విస్తృతంగానే ఉంచుతుంది. అందువల్ల అనువాదం ఆ వ్యాఖ్యాన స్వేచ్ఛను, దైవశాస్త్ర సంబంధ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ముందటి వచనం నుండి కొనసాగుతున్న ఒడంబడిక క్రియ
  choice: తెలుగులో వాక్యం సంపూర్ణంగా అర్థమయ్యేందుకు ‘ఈ ఒడంబడిక చేస్తున్నాను’ అని భావానుసారంగా పునరుద్ధరించడం
  alternative: మూల వచనంలాగే క్రియలేని అసంపూర్ణ కొనసాగింపుగా ఉంచడం
  rationale: ఈ వచనం హీబ్రూలో 29:12–13లోని ఒడంబడిక చేయడాన్ని కొనసాగిస్తుంది. ఆధునిక తెలుగులో స్వతంత్ర వచనంగా స్పష్టత కోసం క్రియను పునరుద్ధరించడం అర్థాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘యహ్వే సన్నిధిలో’, ‘ఒడంబడిక’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, క్లిష్టమైన లేదా పాతకాలపు వాక్యనిర్మాణాన్ని నివారించాం. వచనం ముందటి వాక్యంపై ఆధారపడుతున్నందున, తెలుగులో స్వతంత్రంగా చదివినప్పటికీ అర్థమయ్యేలా సందర్భం నుండి క్రియను పునరుద్ధరించాం.
