id: DEU.29.23
reference: Deuteronomy 29:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: te
  text: 'మరియు జనాంగాలన్నీ ఇలా అంటాయి: “యాహ్వే ఈ దేశానికి ఇలా ఎందుకు చేశాడు? ఈ గొప్ప కోపాగ్ని ఎందుకు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “యాహ్వే ఈ దేశానికి ఇలా ఎందుకు చేశాడు? ఈ గొప్ప కోపపు మంట ఎందుకు?”'
    reason: రెండవ ప్రశ్నలోని מֶה యొక్క ప్రశ్నార్థక ప్రయోగాన్ని, అలాగే חֳרִי הָאַף లోని మండుట/వేడి రూపకాన్ని మరింత రూపసమీపంగా చూపుతుంది.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: అప్పుడు ... అని అడుగుతారు
  rationale: సంధిసహిత సంపూర్ణ క్రియ ఈ ప్రవచనాత్మక నిబంధన సందర్భంలో భవిష్యత్ స్పందనను సూచిస్తుంది. ప్రత్యక్ష ప్రశ్నలను పలకడాన్ని తెలుగులో సహజంగా ‘అని అడుగుతారు’ అని వ్యక్తం చేశాం.
- source_word: כָּל הַגּוֹיִם
  choice: జనాలన్నీ
  rationale: ఇక్కడ గోయిమ్ ఇశ్రాయేలు స్థితిని గమనించే ఇతర జనసమూహాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘జనాలన్నీ’ సహజంగా, సమగ్ర పరిధితో ఉంది.
- source_word: עַל מֶה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: యెహోవా ... ఇలా ఎందుకు చేశాడు
  rationale: ‘ఇలా చేయడం’ అనే హీబ్రూ భావాన్ని, ప్రశ్నా క్రమానికి అనుగుణంగా స్పష్టమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించాం.
- source_word: לָאָרֶץ הַזֹּאת
  choice: ఈ దేశానికి
  rationale: ఈ సందర్భంలో אֶרֶץ తీర్పుకు గురైన నిబంధన దేశాన్ని సూచిస్తుంది; తెలుగు విభక్తి ‘దేశానికి’ క్రియతో సహజంగా సరిపోతుంది.
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: ఇంతటి మహా కోపాగ్ని ఎందుకు
  rationale: חֳרִי లోని మండే వేడి రూపకాన్ని ‘కోపాగ్ని’గా నిలిపి, גָּדוֹל మరియు זֶה ఇచ్చే తీవ్రతను ‘ఇంతటి మహా’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: దైవిక కోపానికి ఉపయోగించిన అగ్ని/వేడి రూపకం
  choice: కోపాగ్ని
  alternative: తీవ్రమైన కోపం
  rationale: חֳרִי యొక్క మండడం/వేడి అనే సజీవ రూపకాన్ని నిలిపాం; అదే సమయంలో దానిని స్వతంత్ర భౌతిక అగ్నిగా అర్థం చేసుకోకుండా ‘కోపాగ్ని’ అనే సహజ సమాసం వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘కోపాగ్ని’ మూలంలోని వేడి/మండుట రూపకాన్ని నిలుపుతుంది. పాదసూచి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
