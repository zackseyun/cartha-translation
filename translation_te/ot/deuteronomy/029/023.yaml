  to: 'మరియు జనాంగాలన్నీ ఇలా అంటాయి: “యాహ్వే ఈ దేశానికి ఇలా ఎందుకు చేశాడు? ఈ గొప్ప కోపాగ్ని ఎందుకు?”[a]'
