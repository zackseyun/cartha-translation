id: DEU.29.24
reference: Deuteronomy 29:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా అంటారు: “వారి పితరుల దేవుడైన యాహ్వే వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినప్పుడు వారితో చేసిన నిబంధనను వారు విడిచిపెట్టారు కాబట్టి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: అప్పుడు వారు ఇలా అంటారు
  rationale: ముందటి వచనంలోని ప్రశ్నకు వచ్చే సమాధానాన్ని కొనసాగించే భావాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది; సందర్భంలోని భవిష్య భావాన్ని తెలుగులో వర్తమానరూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל אֲשֶׁר
  choice: కాబట్టి
  rationale: దేశానికి సంభవించిన దుస్థితికి కారణాన్ని తెలిపే హేత్వర్థక ప్రయోగం.
- source_word: עָזְבוּ
  choice: విడిచిపెట్టారు
  rationale: సాధారణంగా వెళ్లిపోవడం కాక, నిబంధనపట్ల విశ్వాసాన్ని త్యజించడం అనే బలమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: దేవుడు తన ప్రజలతో ఏర్పరచుకున్న బంధాన్ని సూచించే స్థిరమైన, గౌరవప్రదమైన బైబిలు పదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: వారి పితరుల దేవుడు
  rationale: హీబ్రూ నిర్మాణాన్ని, పితృపరంపరతో దేవునికున్న సంబంధాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: వారితో చేసిన
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధన కోశాడు’ అనే జాతీయాన్ని తెలుగులో సహజమైన ‘నిబంధన చేశాడు’గా అందిస్తుంది.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: వారిని ... బయటకు తీసుకొచ్చినప్పుడు
  rationale: బేత్‌తో కూడిన క్రియానామ రూపంలోని కాలసంబంధ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని పూర్తి భౌగోళిక పదబంధాన్ని, నిర్గమన ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: אֱלֹהֵי אֲבֹתָם లోని పితృపరంపర సూచన
  choice: వారి పితరుల దేవుడు
  alternative: వారి పూర్వీకుల దేవుడు
  rationale: ‘పితరులు’ హీబ్రూలోని పురుషలింగ పితృపరంపర సూచనను నిలుపుతుంది; ‘పూర్వీకులు’ ఆ ప్రత్యేకతను కొంత సాధారణీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ముందటి వచనంలోని ప్రశ్నకు ఇది కారణసూచక సమాధానం కావడంతో ఉద్ధరణ చివర ‘కాబట్టి’ని నిలిపి, మూలంలోని అసంపూర్ణ సమాధాన నిర్మాణాన్ని సంరక్షించింది.
