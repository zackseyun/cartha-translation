translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. స్థలవివరణలోని హెబ్రీ వాక్య నిర్మాణాన్ని పూర్తిగా కఠినంగా అనుకరించకుండా, మధ్యభాగం సరిహద్దు అనే భావాన్ని డాష్‌లతో స్పష్టపరచాం. ‘వాగులోయ’ ద్వారా נחל పదంలోని వాగు/లోయ అర్థవిస్తృతిని సాధ్యమైనంతవరకు నిలిపాం.
