source:
  edition: WLC
  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: te
  text: రూబేనీయులకు, గాదీయులకు గిలాదు మొదలుకొని అర్నోను వాగులోయ[a] వరకు—ఆ వాగులోయ మధ్యభాగాన్ని సరిహద్దుగా చేసి—అమ్మోను ప్రజల[b] సరిహద్దైన యబ్బోకు వాగులోయ వరకు ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదం נחל వాగును, వాగుపాత్రను లేదా దానితో ముడిపడిన లోయను సూచించవచ్చు. తరువాతి మాటల్లో వాగులోయ మధ్యభాగం సరిహద్దుగా పేర్కొనబడినందున ఇక్కడ “వాగులోయ” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అమ్మోను కుమారులు.” ఇది అమ్మోను ప్రజలను సూచించే బంధుత్వ వ్యక్తీకరణ; లేదా “అమ్మోనీయుల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: రూబేనీయులకు, గాదీయులకు
  rationale: ఈ జాతివాచక రూపాలు పూర్వీకులైన రూబేను, గాదులను కాక, వారి గోత్ర సమూహాలను సూచిస్తున్నాయి.
- source_word: נָתַתִּי
  choice: ఇచ్చాను
  rationale: נתן అనే సాధారణ క్రియను అదనపు పరిపాలనా భావం చేర్చకుండా సహజంగా అనువదిస్తుంది; సందర్భంలో భూభాగాన్ని కేటాయించి ఇవ్వడం సూచితం.
- source_word: מִן הַגִּלְעָד
  choice: గిలాదు మొదలుకొని
  rationale: భూభాగ విస్తృతి ప్రారంభమయ్యే స్థలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נַחַל אַרְנֹן / יַבֹּק הַנַּחַל
  choice: అర్నోను వాగులోయ / యబ్బోకు వాగులోయ
  rationale: נחל అనే పదం వాగు, వాగుపాత్ర లేదా దానితో ముడిపడిన లోయను సూచించగలదు. తరువాత లోయ మధ్యభాగం సరిహద్దని చెప్పడం వల్ల ‘వాగులోయ’ భౌగోళిక భావాన్ని విస్తృతంగా నిలుపుతుంది.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: ఆ లోయ మధ్యభాగమే సరిహద్దుగా
  rationale: లోయ మధ్య భాగమే హద్దురేఖగా పనిచేసిందనే అన్వయాన్ని స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: అమ్మోను సంతతివారి సరిహద్దు
  rationale: ‘అమ్మోను కుమారులు’ అనే హెబ్రీయ బంధుత్వ వ్యక్తీకరణను అర్థవంతమైన ఆధునిక తెలుగులో నిలుపుతూ, అది అమ్మోను ప్రజలను సూచిస్తుందని తెలియజేస్తుంది.
