  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: te
  text: వారికి భయపడకండి[a]; ఎందుకంటే మీ దేవుడైన యాహ్వేయే మీ కోసం యుద్ధం చేసేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని భయపడకండి.’
    reason: హీబ్రూ క్రియకు ‘భయపడు/భయపడకండి’ అనే ప్రత్యక్ష కర్మతో కూడిన ప్రత్యామ్నాయ అనువాదం; అదనపు భావాన్ని చేర్చదు.
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: వారికి భయపడకండి
  rationale: నిషేధార్థక לֹאతో కూడిన రెండవ పురుష బహువచన క్రియను ఆధునిక మర్యాదపూర్వక బహువచన ఆజ్ఞగా అనువదించాం; చివరి ప్రత్యయం సూచించే ‘వారిని/వారికి’ అనే కర్మను స్పష్టంగా నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని పరిచయం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: ఇక్కడ אֱלֹהִים ఇశ్రాయేలు దేవుని సూచించే ఏకవచనార్థక రూపం; ప్రత్యయం రెండవ పురుష బహువచన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הוּא
  choice: యే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో సహజంగా ‘యే’ అనే నిశ్చయార్థక ప్రత్యయంతో వ్యక్తం చేశాం.
- source_word: הַנִּלְחָם
  choice: యుద్ధం చేసేవాడు
  rationale: పార్టిసిపిల్ సూచించే కొనసాగుతున్న లేదా లక్షణాత్మక కార్యాన్ని సహజమైన తెలుగు కర్తృవాచక రూపంతో అందించాం.
- source_word: לָכֶם
  choice: మీ పక్షంగా
  rationale: לְ ఇక్కడ ప్రయోజనం లేదా తరఫున జరిగే కార్యాన్ని సూచిస్తుంది; ‘మీ పక్షంగా’ దేవుడు వారి తరఫున పోరాడుతున్నాడనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఉచ్చారణ పునర్నిర్మాణం విషయంలో సంపూర్ణ నిశ్చితత్వం లేనందున, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠంలో వాడి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: הוּא యొక్క ఉద్ఘాటన
  choice: యెహోవాయే
  alternative: ఆయనే
  rationale: దేవుడే స్వయంగా వారి తరఫున యుద్ధం చేస్తాడనే మూల ఉద్ఘాటనను నిలిపేందుకు ‘యే’ వాడాం; వాక్యంలో అనవసరమైన అదనపు సర్వనామాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించాం. రెండవ పురుష బహువచనాన్ని ‘-ండి’ రూపంలో ఇచ్చాం; ‘మీ దేవుడైన యెహోవాయే’ అనే నిర్మాణం మూలంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
