id: DEU.3.4
reference: Deuteronomy 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר לֹא לָקַ֖חְנוּ מֵֽ/אִתָּ֑/ם שִׁשִּׁ֥ים עִיר֙ כָּל חֶ֣בֶל אַרְגֹּ֔ב מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: te
  text: ఆ సమయంలో అతని పట్టణాలన్నిటినీ మేము స్వాధీనం చేసుకున్నాం. వారినుండి[a] మేము స్వాధీనం చేసుకోని పట్టణం ఒక్కటీ లేదు—అరవై పట్టణాలు, బాషానులోని ఓగు రాజ్యానికి చెందిన అర్గోబు ప్రాంతమంతా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘వారినుండి’ అని బహువచనం ఉంది; ఇది ఓగు ఒక్కడిని కాకుండా, బహుశా అతని ప్రజలను లేదా సైన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: స్వాధీనం చేసుకున్నాం
  rationale: לכד యుద్ధంలో పట్టుకోవడం లేదా వశపరచుకోవడం అనే భావాన్ని ఇస్తుంది; ‘స్వాధీనం చేసుకున్నాం’ ఆధునిక తెలుగులో ఆ సైనిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל עָרָיו
  choice: అతని పట్టణాలన్నిటినీ
  rationale: עיר ను సందర్భానుసారం ‘పట్టణం’గా అనువదించాం; ఏకవచన ప్రత్యయం ఓగును సూచిస్తున్నందున ‘అతని’ అని ఉంచాం.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: వారినుండి మేము స్వాధీనం చేసుకోని పట్టణం ఒక్కటీ లేదు
  rationale: మూలంలోని బలమైన ద్వంద్వ నిషేధాన్ని ‘ఒక్కటీ లేదు’ అనే సహజ తెలుగు నిర్మాణంతో నిలిపాం; מֵאִתָּם లోని బహువచనాన్ని ‘వారినుండి’గా యథాతథంగా ఉంచాం.
- source_word: שִׁשִּׁים עִיר
  choice: మొత్తం అరవై పట్టణాలు
  rationale: సంఖ్యను నేరుగా అనువదించి, ముందటి పట్టణాల ప్రస్తావనతో పదసామ్యాన్ని కాపాడాం.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: అర్గోబు ప్రాంతమంతా
  rationale: חבל ఇక్కడ పరిపాలనా లేదా భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: బాషానులోని ఓగు రాజ్యం
  rationale: బాషానులో ఉన్న ఓగు రాజ్యమనే భౌగోళిక సంబంధాన్ని సహజ తెలుగులో స్పష్టంగా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని బహువచన సూచనను సరిచేయకుండా నిలిపి, దాని సంభావ్య సూచనను పాదటిప్పణిలో వివరించాం.
