  yaml_path: translation/ot/deuteronomy/003/005.yaml
  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: te
  text: ఇవన్నీ ఎత్తైన ప్రాకారం, జంట తలుపులు, అడ్డగడియలు గల దుర్గ పట్టణాలు; వీటికి అదనంగా, బహిరంగ ప్రాంతంలోని పట్టణాలు[a] కూడా చాలా ఎక్కువగా ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెరచిన ప్రాంతంలోని పల్లెలు’ లేదా ‘ప్రాకారాలు లేని పట్టణాలు.’ ఇక్కడి హీబ్రూ పదబంధం, ఇప్పుడే వర్ణించిన దుర్గ పట్టణాలకు భిన్నమైన నివాస స్థలాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: దుర్గ పట్టణాలు
  rationale: దాడులను ఎదుర్కొనేలా బలపరచబడిన పట్టణాలనే ఈ పదం సూచిస్తుంది. ‘దుర్గ పట్టణాలు’ అనేది సైనిక భౌగోళిక సందర్భానికి తగిన సహజమైన తెలుగు ప్రయోగం.
- source_word: חוֹמָה גְבֹהָה
  choice: ఎత్తైన ప్రాకారం
  rationale: హీబ్రూలో ‘ప్రాకారం’ ఏకవచనంలో ఉంది. దాని రూపాన్ని తెలుగులో సహజంగా నిలుపుతూ ‘ఎత్తైన ప్రాకారం’ అని అనువదించబడింది.
- source_word: דְּלָתַיִם
  choice: జంట తలుపులు
  rationale: హీబ్రూ ద్వివచన రూపం రెండు తలుపు రెక్కలను సూచిస్తుంది. తరువాత అడ్డగడియలు ప్రస్తావించబడినందున పట్టణ ప్రవేశద్వారాన్ని మూసే జంట తలుపుల చిత్రం ఇక్కడ సరిపోతుంది.
- source_word: וּבְרִיחַ
  choice: అడ్డగడియలు
  rationale: తలుపులను లోపలినుంచి బిగించడానికి అడ్డంగా వేసే బలమైన కడ్డీలను ఈ పదం సూచిస్తుంది. హీబ్రూలో రూపం ఏకవచనమైనా, పట్టణాలన్నిటి రక్షణ ఏర్పాట్లను సమష్టిగా సూచిస్తున్నందున తెలుగులో బహువచనం సహజం.
- source_word: לְבַד
  choice: ఇవి కాక
  rationale: ముందు పేర్కొన్న దుర్గ పట్టణాలకు అదనంగా మరొక వర్గపు నివాస స్థలాలు ఉన్నాయని ఈ పదం తెలియజేస్తుంది.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: బహిరంగ ప్రాంతంలోని పట్టణాలు
  rationale: ఈ పదబంధం దుర్గ పట్టణాలకు భిన్నంగా, విస్తృత ప్రదేశాల్లో రక్షణ ప్రాకారాలు లేకుండా ఉన్న నివాస స్థలాలను సూచిస్తుంది. మూలంలోని భౌగోళిక భావాన్ని ప్రధాన పాఠంలో ఉంచి, ‘ప్రాకారాలు లేని పట్టణాలు’ అనే సందర్భానుగుణ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הַרְבֵּה מְאֹד
  choice: చాలా ఎక్కువగా
  rationale: పట్టణాల సంఖ్య అత్యధికంగా ఉందనే హీబ్రూ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל אֵלֶּה עָרִים
  choice: ఇవన్నీ ... పట్టణాలు
  rationale: హీబ్రూ వాక్యారంభంలోని ‘ఇవన్నీ’ అనే ఉద్ఘాటనను నిలుపుతూ, తెలుగులో సహజమైన నామవాక్య నిర్మాణాన్ని ఉపయోగించాం.
