translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని అనుసరించాం. హీబ్రూ ఏకవచనమైన ‘ప్రాకారం’ను, ద్వివచనమైన ‘జంట తలుపులు’ను సాధ్యమైనంతవరకు నిలిపాం. ‘అడ్డగడియలు’ అనే పదం పురాతన పట్టణ ద్వారాల రక్షణ వ్యవస్థను స్పష్టంగా తెలియజేస్తుంది.
