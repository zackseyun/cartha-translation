source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: te
  text: అయితే మీ కారణంగా[a] యాహ్వే నా మీద కోపపడి నా మాట వినలేదు. యాహ్వే నాతో, “ఇక చాలు![b] ఈ విషయం గురించి మళ్లీ నాతో మాట్లాడవద్దు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ నిమిత్తము’ లేదా ‘మీ కోసము.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘నీకు చాలు’; ఇది మాటను కఠినంగా నిలిపివేసే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר יְהוָה בִּי
  choice: యాహ్వే నా మీద కోపపడి
  rationale: עבר అనే క్రియ యొక్క హిత్పయేల్ రూపం ఈ సందర్భంలో ఒకరిపై కోపపడడాన్ని సూచిస్తుంది. ‘నా మీద కోపపడి’ అనేది సహజమైన ఆధునిక తెలుగు; మూలంలోని తీవ్రతను అతిశయింపజేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לְמַעַנְכֶם
  choice: మీ కారణంగా
  rationale: ఈ సందర్భంలో ఈ పదబంధం మోషే పట్ల యాహ్వే కోపానికి ప్రజలే కారణమని సూచిస్తుంది. ‘మీ కారణంగా’ కారణార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: నా మొర ఆలకించలేదు
  rationale: שׁמע אֶל అనేది కేవలం శబ్దం వినడం కాక, ఒకరి విజ్ఞప్తిని ఆలకించడం లేదా అంగీకరించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో మోషే చేసిన విన్నపమే ఉద్దేశం కావడంతో ‘నా మొర ఆలకించలేదు’ సహజంగా ఉంటుంది.
- source_word: רַב לָךְ
  choice: ఇక చాలు!
  rationale: అక్షరార్థంగా ‘నీకు చాలు’ అయిన ఈ సంక్షిప్త నానుడి ఇక్కడ మోషే మాటను కఠినంగా నిలిపివేస్తుంది. ‘ఇక చాలు!’ ఆ నిర్దిష్టతను, తీవ్రతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אַל תּוֹסֶף דַּבֵּר אֵלַי עוֹד
  choice: మళ్లీ నాతో మాట్లాడవద్దు
  rationale: יסף + క్రియారూపం, అలాగే עוֹד కలిపి మరలా లేదా ఇకపై కొనసాగించకూడదనే భావాన్ని ఇస్తాయి. ‘మళ్లీ ... మాట్లాడవద్దు’ సంక్షిప్తంగా పూర్తి అర్థాన్ని అందిస్తుంది.
- source_word: בַּדָּבָר הַזֶּה
  choice: ఈ విషయం గురించి
  rationale: דבר ఇక్కడ ఒక వస్తువును కాక, చర్చలో ఉన్న మోషే అభ్యర్థనను సూచిస్తుంది. అందువల్ల ‘ఈ విషయం గురించి’ సహజమైన అనువాదం.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నామాన్ని సంరక్షిస్తుంది.
- issue: యాహ్వే మోషే విజ్ఞప్తిని వినలేదనే వాక్యభావం
  choice: నా మొర ఆలకించలేదు
  alternative: నా మాట వినలేదు
  rationale: ఇక్కడ శారీరకంగా వినలేదని కాదు, మోషే విజ్ఞప్తిని అంగీకరించలేదని సందర్భం సూచిస్తుంది. అయినా దేవుని నిర్ణయాన్ని మరింత సిద్ధాంతపరంగా విస్తరించకుండా మూల భావానికే పరిమితమయ్యాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మొర ఆలకించలేదు’ ప్రార్థనాత్మక సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇక చాలు!’ మూలంలోని సంక్షిప్తమైన కఠినత్వాన్ని నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
