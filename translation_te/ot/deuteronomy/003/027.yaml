language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: te
  text: పిస్గా శిఖరంపైకి ఎక్కి, నీ కళ్లెత్తి పడమటి వైపు,[a] ఉత్తరంవైపు, దక్షిణంవైపు, తూర్పువైపు చూడు; నీ కళ్లతో చూడు. ఎందుకంటే నీవు ఈ యొర్దానును[b] దాటవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సముద్రంవైపు’; ఇది ‘పడమటి వైపు’ అని చెప్పే సంప్రదాయ విధానం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ఈ యొర్దాను నదిని.’ హీబ్రూలో కేవలం ‘ఈ యొర్దానును’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה רֹאשׁ הַפִּסְגָּה
  choice: పిస్గా శిఖరానికి ఎక్కి
  rationale: ఆజ్ఞార్థకమైన עֲלֵה యొక్క పైకి వెళ్లే భావాన్ని ‘ఎక్కి’ సహజంగా తెలియజేస్తుంది; רֹאשׁ הַפִּסְגָּהను ఆధునిక తెలుగులో సహజమైన ‘పిస్గా శిఖరం’గా అందించింది.
- source_word: וְשָׂא עֵינֶיךָ
  choice: నీ కళ్లెత్తి చూడు
  rationale: అక్షరార్థంగా ‘నీ కళ్లను ఎత్తు’; చూపును ఆయా దిక్కులకు మళ్లించమనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: יָמָּה וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: పడమటివైపు, ఉత్తరంవైపు, దక్షిణంవైపు, తూర్పువైపు
  rationale: నాలుగు దిశలను మూలంలోని క్రమంలోనే స్పష్టంగా అందించింది. יָמָּה అక్షరార్థంగా ‘సముద్రంవైపు’ అయినా, ఇక్కడ సంప్రదాయ దిశాసూచకంగా ‘పడమటివైపు’ అని అర్థం.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: నీ కళ్లతోనే చూడు
  rationale: మూలంలో ‘కళ్లు’ పునరుక్తమై ఉన్న ఉద్ఘాటనను నిలుపుతూ, -నే ద్వారా వ్యక్తిగతంగా స్వయంగా చూడాలనే బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי לֹא תַעֲבֹר
  choice: ఎందుకంటే నువ్వు … దాటవు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; עבר నదిని దాటే సందర్భంలో ‘దాటు’గా సహజంగా వస్తుంది. భవిష్య నిరాకరణను ‘దాటవు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ఈ యొర్దానును
  rationale: הַזֶּהలోని సమీపసూచక భావాన్ని ‘ఈ’తో నిలిపింది. మూలంలో ‘నది’ అనే నామవాచకం ప్రత్యక్షంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో చేర్చలేదు.
