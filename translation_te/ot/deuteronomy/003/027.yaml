revisions:
- from: పిస్గా శిఖరానికి ఎక్కి, పడమటివైపు,[a] ఉత్తరంవైపు, దక్షిణంవైపు, తూర్పువైపు నీ కళ్లెత్తి చూడు; నీ కళ్లతోనే చూడు. ఎందుకంటే నువ్వు ఈ యొర్దానును[b] దాటవు.
  to: పిస్గా శిఖరంపైకి ఎక్కి, నీ కళ్లెత్తి పడమటి వైపు,[a] ఉత్తరంవైపు, దక్షిణంవైపు, తూర్పువైపు చూడు; నీ కళ్లతో చూడు. ఎందుకంటే నీవు ఈ యొర్దానును[b] దాటవు.
