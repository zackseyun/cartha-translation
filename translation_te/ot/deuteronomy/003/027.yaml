translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన ఏకవచన సంబోధన వాడబడింది. మూలంలోని ఆజ్ఞ, నాలుగు దిక్కుల క్రమం, ‘కళ్లు’ అనే పునరుక్త ఉద్ఘాటన, ‘ఈ యొర్దాను’ అనే సమీపసూచన నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
