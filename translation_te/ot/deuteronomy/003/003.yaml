source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: te
  text: యాహ్వే మన దేవుడు బాషాను రాజు ఓగును, అతని ప్రజలందరినీ కూడా మన చేతికి అప్పగించాడు. అతనికి ఒక్కరూ శేషంగా మిగలకుండా మేము అతనిని మట్టుబెట్టాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “అతనికి శేషంగా మిగిలినవాడు ఎవరూ లేకుండా.”'
    reason: హీబ్రూ עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד లోని ‘అతనికి’ మరియు ‘శేషంగా మిగిలినవాడు’ అనే నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיִּתֵּן
  choice: అప్పగించాడు
  rationale: యుద్ధ సందర్భంలో ‘మన చేతికి ఇచ్చాడు’ అనే భావాన్ని సహజమైన తెలుగులో ‘అప్పగించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיָדֵנוּ
  choice: మన చేతికి
  rationale: హీబ్రూలోని ఏకవచన ‘చేతి’ రూపాన్నీ, ఒకరి అధికారంలోకి అప్పగించడమనే సైనిక నుడికారాన్నీ నిలుపుతుంది.
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి సీహోను ఓటమితో ఓగు ఓటమిని కలిపే పదంలోని అదనపు భావాన్ని తెలియజేస్తుంది.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగు
  rationale: వ్యక్తి పేరు, రాజబిరుదు, ప్రాంతం అనే సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: כָּל עַמּוֹ
  choice: అతని ప్రజలందరినీ
  rationale: עַם అనే పదం సైన్యానికి మాత్రమే పరిమితం కాకుండా విస్తృతంగా ‘ప్రజలు’ అని అర్థమిస్తుంది; అందువల్ల మూలంలోని విస్తృతిని నిలిపాం.
- source_word: וַנַּכֵּהוּ
  choice: మేము అతన్ని హతమార్చాము
  rationale: యుద్ధ సందర్భంలోని נכה క్రియ హింసాత్మకంగా కొట్టి చంపడం లేదా సంహరించడం అనే భావాన్ని ఇస్తుంది; తరువాతి ‘ప్రాణాలతో మిగిలినవాడు ఒక్కడూ లేడు’ అనే వాక్యం దీనిని బలపరుస్తుంది.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: అతనికి ప్రాణాలతో మిగిలినవాడు ఒక్కడూ లేకుండా
  rationale: పూర్తి ఓటమిని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘అతనికి’ అనే సంబంధాన్ని మరియు ‘బతికి మిగిలినవాడు’ అనే שָׂרִיד భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ మూల రూపానికి దగ్గరగా ఉన్న ప్రాచుర్యమైన ఆధునిక రూపం.
- issue: ఓటమి సంపూర్ణతను తెలిపే భాష
  choice: అతనికి ప్రాణాలతో మిగిలినవాడు ఒక్కడూ లేకుండా
  alternative: అతనికి శేషంగా ఎవరినీ మిగలనివ్వకుండా
  rationale: మూలంలోని తీవ్రమైన, సంపూర్ణ వినాశన భావాన్ని తగ్గించకుండా ఉంచాం; అదే సమయంలో మూలం చెప్పనిదాన్ని వ్యాఖ్యానంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మన చేతికి అప్పగించాడు’ అనే సుపరిచిత నుడికారం ద్వారా హీబ్రూ సైనిక ప్రయోగాన్ని సహజంగా నిలిపాం.
