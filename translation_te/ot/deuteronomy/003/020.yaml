source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: te
  text: యాహ్వే మీ సహోదరులకు కూడా మీకు ఇచ్చినట్లే విశ్రాంతిని ఇచ్చి, యాహ్వే మీ దేవుడు యొర్దాను అవతల[b] వారికి ఇస్తున్న దేశాన్ని వారు కూడా స్వాధీనం చేసుకునే వరకు; ఆ తరువాత మీలో ఒక్కొక్కరు నేను మీకు ఇచ్చిన తన స్వాస్థ్యానికి[c] తిరిగి వెళ్లవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘యొర్దాను దాటి.’ ఈ పదబంధం నదికి తూర్పున ఉన్న వక్త స్థానం నుంచి పశ్చిమానున్న భూమిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తన వారసత్వ భూమికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: విశ్రాంతి ఇచ్చి
  rationale: హిఫిల్ రూపం ఇక్కడ స్థిరమైన నివాసం, భద్రత కలిగేలా ‘విశ్రాంతి ఇవ్వడం’ అనే భావాన్ని సూచిస్తుంది; ద్వితీయోపదేశకాండంలోని విశ్రాంతి అంశాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: לַאֲחֵיכֶם
  choice: మీ సహోదరులకు
  rationale: మూలంలోని పుంలింగ బంధుత్వ పదాన్ని నిలుపుతూ, సందర్భంలో అది మిగిలిన ఇశ్రాయేలీయులను సూచిస్తుందని తెలుపుతుంది.
- source_word: כָכֶם
  choice: మీకు ఇచ్చినట్లే
  rationale: హీబ్రూలో పోలిక సంక్షిప్తంగా ఉంది. యాహ్వే వీరికి ఇప్పటికే ఇచ్చిన విశ్రాంతినే వారి సహోదరులకు కూడా ఇస్తాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיָרְשׁוּ
  choice: స్వాధీనం చేసుకునే
  rationale: ירשׁ భూమిని వారసత్వంగా పొందడం లేదా దానిని స్వాధీనం చేసుకోవడం రెండింటినీ సూచించగలదు; ఇక్కడ భూభాగంలో ప్రవేశించి దాన్ని అధీనంలోకి తీసుకునే క్రియ ప్రధానంగా ఉంది.
- source_word: נֹתֵן
  choice: ఇస్తున్న
  rationale: వర్తమాన కృదంతం దేవుని బహుమానం నిశ్చయమైనదిగాను కొనసాగుతున్న కార్యంగాను చూపుతుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: మాట్లాడుతున్న మోషే యొర్దానుకు తూర్పున ఉన్నందున, సందర్భంలో ఇది నదికి పశ్చిమానున్న భూమిని సూచించే సాపేక్ష స్థానపదబంధం.
- source_word: וְשַׁבְתֶּם
  choice: ఆ తరువాత ... తిరిగి వెళ్లవచ్చు
  rationale: కర్తవ్యం పూర్తయిన తరువాత తిరిగి వెళ్లే తదుపరి చర్యను సూచిస్తుంది; సందర్భంలోని అనుమతి భావాన్ని ‘వెళ్లవచ్చు’ సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: మీలో ఒక్కొక్కరు
  rationale: పదశః ‘మనిషి’ అయినా ఇక్కడ పంపిణీ భావం ప్రధానమైనది; సంబోధించబడిన వారిలో ప్రతి వ్యక్తిని సూచిస్తుంది.
- source_word: לִירֻשָּׁתוֹ
  choice: తమ తమ స్వాస్థ్యానికి
  rationale: ఈ నామవాచకం ఒక్కొక్కరికి కేటాయించబడిన వారసత్వ భూస్వాధీనాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ భూమి యొక్క వారసత్వ, అధీన భావాలను రెండింటినీ మోస్తుంది.
- source_word: נָתַתִּי לָכֶם
  choice: నేను మీకు ఇచ్చిన
  rationale: పూర్తయిన క్రియ మోషే ఇంతకుముందే యొర్దాను తూర్పు భూమిని వారికి కేటాయించిన విషయాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: לַאֲחֵיכֶם లోని పుంలింగ బంధుత్వ పదం
  choice: మీ సహోదరులకు
  alternative: మీ తోటి ఇశ్రాయేలీయులకు
  rationale: మూలంలోని ‘సహోదరులు’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది విస్తృతంగా తోటి ఇశ్రాయేలీయులను సూచించగలదని పాదటీపులో తెలియజేసింది.
- issue: וְשַׁבְתֶּם యొక్క విధి లేదా అనుమతి భావం
  choice: తిరిగి వెళ్లవచ్చు
  alternative: తిరిగి వెళ్లాలి
  rationale: క్రియ తదుపరి చర్యను నిశ్చయంగా సూచించినా, యుద్ధ సహాయం పూర్తయ్యాక స్వాస్థ్యాలకు తిరిగి వెళ్లేందుకు లభించే అనుమతి సందర్భంలో ప్రధానంగా ఉంది. ప్రత్యామ్నాయ విధి భావం సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడింది. వాక్యం ముందు వచనంలోని ఆజ్ఞకు కొనసాగింపుగా ‘వరకు’తో మొదలయ్యే నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపింది. ‘స్వాస్థ్యం’ భూమిపై అధికారం మరియు వారసత్వ కేటాయింపు అనే రెండు భావాలనూ సంక్షిప్తంగా మోస్తుంది.
