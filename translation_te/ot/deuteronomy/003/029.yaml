    issue: «కాబట్టి» may overstate the force of the Hebrew waw.
    rationale: The form is narrative waw (‘and/so’), whose contextual continuation need not be a strictly causal conclusion. «అలా» is a safer Telugu narrative connective.
  - severity: low
    issue: «నివసించాం» can suggest settled residence.
    rationale: Here ישׁב can mean stayed or remained at a location. «ఉండిపోయాం» is more idiomatic for the contextual sense while retaining the lexical range in the footnote.
