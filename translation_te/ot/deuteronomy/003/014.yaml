    rationale: హీబ్రూ పాఠం గెషూరీయుల మరియు మాకాతీయుల సరిహద్దును మాత్రమే చెబుతుంది; వారు నివసించే ప్రాంతమని స్పష్టంగా చెప్పదు.
  - severity: low
