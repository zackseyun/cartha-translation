revisions:
- from: మనష్షే కుమారుడైన యాయీరు అర్గోబు ప్రాంతమంతటినీ, గెషూరీయులూ మాకాతీయులూ నివసించే ప్రాంతపు సరిహద్దు వరకు స్వాధీనం చేసుకున్నాడు. అతడు వాటికి, అంటే బాషానుకు, తన పేరు పెట్టి “హవ్వోత్-యాయీరు”[a][b] అని పిలిచాడు. నేటివరకు వాటికి అదే పేరు ఉంది.
  to: మనష్షే కుమారుడైన యాయీరు అర్గోబు ప్రాంతమంతటినీ గెషూరీయుల, మాకాతీయుల సరిహద్దు వరకు స్వాధీనం చేసుకున్నాడు. అతడు వాటికి తన పేరుమీద—బాషానులోని హవ్వోత్-యాయీరు అని—పేరు పెట్టాడు[a][b]; ఆ పేరు నేటివరకు ఉంది.
  rationale: గెషూరీయులూ మాకాతీయులూ నివసించే ప్రాంతమనే అదనపు వివరణ తొలగించబడింది. క్లిష్టమైన ‘బాషాను / హవ్వోత్-యాయీరు’ అన్వయాన్ని ప్రధాన పాఠ్యంలో చదవదగిన విధంగా ఉంచి, హీబ్రూ బహువచన కర్మతో కూడిన మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. చివరి కాలసూచనను మూలానికి సమీపంగా నామకరణ వాక్యంతో కలిపాం.
