    rationale: భావం తప్పకపోయినా, నామకరణం నేటివరకు కొనసాగినట్లు చెప్పే మూల నిర్మాణాన్ని ఒకే వాక్యంలో ఉంచడం మరింత సమీపమైనది.
  - severity: low
    issue: ‘వాటికి, అంటే బాషానుకు’ అనే నిర్మాణం
    rationale: బహువచన కర్మకు ఏకవచన స్థలనామాన్ని కలిపే హీబ్రూ క్లిష్టతను ఇది ప్రతిబింబించినా, తెలుగులో అన్వయం కొద్దిగా అసహజంగా ఉంది; దాన్ని పాదసూచికతో స్పష్టపరచడం మంచిది.
