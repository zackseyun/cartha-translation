source:
  edition: WLC
  text: יָאִ֣יר בֶּן מְנַשֶּׁ֗ה לָקַח֙ אֶת כָּל חֶ֣בֶל אַרְגֹּ֔ב עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּֽעֲכָתִ֑י וַ/יִּקְרָא֩ אֹתָ֨/ם עַל שְׁמ֤/וֹ אֶת הַ/בָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: te
  text: మనష్షే కుమారుడైన యాయీరు అర్గోబు ప్రాంతమంతటినీ గెషూరీయుల, మాకాతీయుల సరిహద్దు వరకు స్వాధీనం చేసుకున్నాడు. అతడు వాటికి తన పేరుమీద—బాషానులోని హవ్వోత్-యాయీరు అని—పేరు పెట్టాడు[a][b]; ఆ పేరు నేటివరకు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి, దాని అన్వయం కొంత అస్పష్టంగా ఉంది. మరింత అక్షరార్థంగా, “అతడు వాటిని తన పేరుమీద, బాషాను, హవ్వోత్-యాయీరు అని పిలిచాడు” అని అనువదించవచ్చు. ‘వాటిని’ అనే బహువచన కర్మ బహుశా అక్కడి నివాసస్థలాలను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “హవ్వోత్-యాయీరు” అనే పేరుకు “యాయీరు గ్రామాలు” లేదా “యాయీరు గుడారపు నివాసాలు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: ప్రాంతం
  rationale: ఈ భౌగోళిక సందర్భంలో ఈ పదం నిర్దిష్టమైన భూభాగాన్ని సూచిస్తుంది; ‘ప్రాంతం’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אַרְגֹּב
  choice: అర్గోబు
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: గెషూరీయులూ మాకాతీయులూ నివసించే ప్రాంతపు సరిహద్దు వరకు
  rationale: גְּבוּל అనేది సరిహద్దును సూచిస్తుంది; జాతివాచక రూపాలు ఆ ప్రజలు నివసించే ప్రాంతాన్ని ఇక్కడ సూచిస్తున్నాయని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: וַיִּקְרָא אֹתָם
  choice: అతడు వాటికి … అని పిలిచాడు
  rationale: హీబ్రూలోని కర్మప్రత్యయం బహువచనంలో ఉంది. దాని బహువచన స్వరూపాన్ని ‘వాటికి’ ద్వారా నిలిపాం.
- source_word: עַל שְׁמוֹ
  choice: తన పేరు పెట్టి
  rationale: దేనికైనా తన పేరునుబట్టి పేరు పెట్టడాన్ని సూచించే హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు సమానార్థకం.
- source_word: אֶת הַבָּשָׁן
  choice: అంటే బాషానుకు
  rationale: వాక్యనిర్మాణం క్లిష్టంగా ఉన్నందున, బాషాను ముందున్న కర్మను వివరిస్తున్న అనుబంధ పదంగా చూపించాం; అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: חַוֹּת יָאִיר
  choice: హవ్వోత్-యాయీరు
  rationale: ఇది స్థలనామంగా పనిచేస్తున్నందున లిప్యంతరీకరించాం; దాని సంభావ్య అర్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు వాటికి అదే పేరు ఉంది
  rationale: కథకుని కాలం వరకు ఆ పేరు కొనసాగిందనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూలోని బహువచన కర్మకూ ‘బాషాను’ అనే ఏకవచన స్థలనామానికీ మధ్యనున్న ఉద్రిక్తతను పూర్తిగా సవరించకుండా, ప్రధాన పాఠ్యంలో ఉంచి పాదసూచికలో వివరించాం.
