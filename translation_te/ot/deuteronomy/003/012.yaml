source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: te
  text: 'ఆ సమయంలో మేము ఈ భూభాగాన్ని స్వాధీనం చేసుకున్నాం: అర్నోను వాగులోయకు ఆనుకుని ఉన్న అరోయేరు మొదలుకొని[a], గిలాదు కొండప్రాంతంలో సగభాగాన్ని[b] దాని పట్టణాలతో సహా స్వాధీనం చేసుకున్నాం; దానిని నేను రూబేనీయులకు, గాదీయులకు ఇచ్చాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అర్నోను వాగులోయ దగ్గర ఉన్న అరోయేరు’ అని కూడా అనువదించవచ్చు. హీబ్రూ נחל అనే పదం వాగు, వాగులోయ లేదా లోయను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘గిలాదు కొండలో సగభాగం’ అని కూడా అనువదించవచ్చు. ప్రాదేశిక వర్ణనల్లో హీబ్రూ הַר అనే పదం ఒక కొండనే కాక కొండల ప్రాంతాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: మనం స్వాధీనం చేసుకున్నాం
  rationale: యుద్ధం, భూస్వాధీన సందర్భంలో ירשׁ క్రియకు క్రియాశీలంగా భూభాగాన్ని స్వాధీనం చేసుకోవడం అనే భావం ఉంది.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని
  rationale: ఇక్కడ אֶרֶץ జయించిన భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: అర్నోను లోయ ఒడ్డున ఉన్న అరోయేరు మొదలుకొని
  rationale: מִן సరిహద్దు ఆరంభాన్ని తెలియజేస్తుంది. עַל‌కు భౌగోళిక సందర్భంలో ‘ఒడ్డున’ సహజం; נחל యొక్క లోయ/వాగులోయ భావాన్ని ప్రధాన పాఠంలో ‘లోయ’గా ఉంచాం.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: గిలాదులోని కొండప్రాంతంలో సగభాగాన్ని
  rationale: ప్రాదేశిక వర్ణనలో הַר ఒకే కొండకన్నా కొండల ప్రాంతాన్ని సూచించగలదు; పట్టణాల ప్రస్తావన కూడా ఈ అర్థానికి సరిపోతుంది.
- source_word: וְעָרָיו
  choice: దాని పట్టణాలతో సహా
  rationale: ప్రత్యయం గిలాదు కొండప్రాంతాన్ని సూచిస్తుంది; ‘సహా’ ప్రాదేశిక సమగ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: נָתַתִּי
  choice: దాన్ని నేను … ఇచ్చాను
  rationale: మూలంలోని బహువచన ప్రథమ పురుషం నుంచి ఏకవచన ప్రథమ పురుషానికి మార్పును నిలుపుతూ נתן యొక్క సరళ భావాన్ని కాపాడుతుంది.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: రూబేనీయులకు, గాదీయులకు
  rationale: ఏకవచన రూపంలోని జాతి/గోత్రవాచకాలు ఇక్కడ సామూహికంగా రెండు గోత్రాలవారిని సూచిస్తున్నాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. అయితే ఫుట్‌నోట్ గుర్తులు సంబంధిత పదబంధాల వద్ద ఉండాలనే ప్రచురణ నియమానికి అనుగుణంగా తుది అమరికలో [a]ను ‘అర్నోను లోయ’ తరువాత, [b]ను ‘కొండప్రాంతం’ తరువాత ఉంచడం సముచితం.
