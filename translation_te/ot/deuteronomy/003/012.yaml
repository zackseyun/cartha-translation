    rationale: మోషే మాట్లాడుతున్న సమూహాన్ని సూచించే మూలపు మొదటి పురుష బహువచనాన్ని ‘మేము’ మరింత నిర్దిష్టంగా ప్రతిబింబిస్తుంది.
