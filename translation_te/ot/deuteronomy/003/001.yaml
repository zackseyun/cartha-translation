  edition: WLC
  text: וַ/נֵּ֣פֶן וַ/נַּ֔עַל דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתֵ֜/נוּ ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: te
  text: తర్వాత మేము తిరిగి బాషాను దారిన పైకి వెళ్లాం. అప్పుడు బాషాను రాజైన ఓగు తన ప్రజలందరితో కలిసి ఎద్రెయి వద్ద యుద్ధం కోసం మమ్మల్ని ఎదుర్కొనడానికి బయలుదేరి వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: తర్వాత మేము తిరిగి
  rationale: פנה అనే క్రియ కథన క్రమంలో ‘తిరుగు’ అనే అర్థాన్ని ఇస్తుంది; వావ్-క్రమార్థాన్ని సహజమైన తెలుగులో ‘తర్వాత’ తెలియజేస్తుంది.
- source_word: וַנַּעַל
  choice: పైకి వెళ్లాం
  rationale: עלה లోని పైదిశగా వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: బాషాను మార్గంలో
  rationale: హీబ్రూ పదబంధంలోని ‘బాషాను మార్గం’ అనే నిర్మాణాన్ని నిలుపుతూ, ఆ ప్రాంతంలోకి లేదా దాని గుండా వెళ్లే మార్గాన్ని సూచిస్తుంది.
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצא అంటే బయటకు రావడం లేదా బయలుదేరడం; సైనికంగా ‘దండెత్తాడు’ అనే అదనపు భావాన్ని చేర్చకుండా సందర్భానికి సహజంగా ఉంటుంది.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగు
  rationale: సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణబంధంగా అందిస్తుంది; వ్యక్తి, ప్రాంత నామాలను లిప్యంతరీకరిస్తుంది.
- source_word: לִקְרָאתֵנוּ
  choice: మమ్మల్ని ఎదుర్కొనేందుకు
  rationale: לקראתנו లోని ‘మమ్మల్ని కలుసుకోవడానికి/ఎదుర్కోవడానికి’ అనే భావంలో, యుద్ధ సందర్భానికి ‘ఎదుర్కొనేందుకు’ సహజంగా సరిపోతుంది; యుద్ధ ఉద్దేశం తరువాతి పదబంధంలో స్పష్టమే.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: తన ప్రజలందరితో కలిసి
  rationale: עם అనే విస్తృతమైన ‘ప్రజలు’ భావాన్ని ‘సైన్యం’గా సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: నిర్దిష్టమైన పోరాట సందర్భంలో מלחמה కు ‘యుద్ధం’ సహజమైన సమానార్థకం.
- source_word: אֶדְרֶעִי
  choice: ఎద్రెయిలో
  rationale: హీబ్రూలో విభక్తి సూచకం లేకున్నా, వాక్యాంత స్థలనామం సంఘటన జరిగిన ప్రదేశాన్ని క్రియావిశేషణంగా సూచిస్తుంది.
