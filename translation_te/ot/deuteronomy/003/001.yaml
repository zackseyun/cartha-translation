translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రజలు’ అనే విస్తృత పదాన్ని నిలిపి, మూలంలో లేని ‘సైన్యం’ అనే సంకుచిత అర్థాన్ని చేర్చలేదు. అన్ని స్థలనామాలు సాధారణ తెలుగు లిప్యంతరీకరణలో ఇవ్వబడ్డాయి.
