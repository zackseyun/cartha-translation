    reason: lexical_alternative
  revision_rationale: The revision corrects the awkward route phrase, retains the directional nuance of “went up,” and expresses Og’s coming out to confront Israel more fully. It keeps the source’s broad term “people,” the battle purpose, and Edrei as the location. The footnote continues to preserve the viable interpretive alternative and identifies the Hebrew idiom.
