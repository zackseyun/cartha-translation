source:
  edition: WLC
  text: אֶעְבְּרָה נָּ֗א וְ/אֶרְאֶה֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן הָ/הָ֥ר הַ/טּ֛וֹב הַ/זֶּ֖ה וְ/הַ/לְּבָנֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: te
  text: దయచేసి, నేను దాటి వెళ్లి యొర్దాను అవతల ఉన్న ఆ మంచి దేశాన్ని—ఈ మంచి కొండ ప్రాంతాన్ని[a] మరియు లెబానోనును—చూడటానికి నన్ను అనుమతించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మంచి కొండను.” హెబ్రీ పదం ఒక నిర్దిష్ట కొండను గానీ, యొర్దానుకు పడమరగా ఉన్న కొండ ప్రాంతాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: దయచేసి నేను దాటి వెళ్లి
  rationale: మొదటి పురుష ఏకవచన cohortative రూపం మోషే చేస్తున్న విన్నపాన్ని సూచిస్తుంది; נָא విన్నప స్వరాన్ని మృదువుగా చేస్తుంది. ఆధునిక తెలుగులో ఈ రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶרְאֶה
  choice: చూడనివ్వు
  rationale: ముందటి cohortative క్రియతో సమన్వయమై, దాటి వెళ్లడానికి ఉద్దేశమైన దర్శనాన్ని తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణంలో విన్నప భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ఆ మంచి దేశాన్ని
  rationale: ద్వితీయోపదేశకాండలో వాగ్దాన ప్రాంతాన్ని సూచించే אָרֶץకు ‘దేశం’ సహజమైనది; నిర్దిష్టతను ‘ఆ’ నిలుపుతుంది.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల ఉన్న
  rationale: మాట్లాడుతున్న మోషే ఉన్న తూర్పు వైపు దృష్టికోణం నుంచి నదికి అవతల ఉన్న ప్రాంతాన్ని సూచిస్తుంది.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: ఈ మంచి కొండ ప్రాంతాన్ని
  rationale: הָר ఒకే కొండను గానీ కొండల ప్రాంతాన్ని గానీ సూచించగలదు. భూభాగ వర్ణన సందర్భంలో ప్రాంతీయ అర్థం సహజమైనది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని సందిగ్ధతను కాపాడాం.
- source_word: וְהַלְּבָנוֹן
  choice: లెబానోనును
  rationale: స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం; విభక్తి చేర్చి వాక్యంలో సహజంగా అమర్చాం.
theological_decisions:
- issue: הָהָר అనే పదం ఒక నిర్దిష్ట కొండనా, కొండ ప్రాంతమా?
  choice: ప్రధాన పాఠ్యంలో ‘ఈ మంచి కొండ ప్రాంతాన్ని’
  alternative: ‘ఈ మంచి కొండను’
  rationale: ఏకవచన హెబ్రీ నామవాచకం సమష్టిగా కొండల ప్రాంతాన్ని సూచించగలదు. ఇక్కడ కనాను భూభాగ వర్ణనలో లెబానోనుతో పాటు రావడం వల్ల ప్రాంతీయ అర్థానికి ప్రాధాన్యం ఇచ్చాం; అయితే నిర్దిష్ట కొండ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన విన్నప స్వరాన్ని ఉపయోగించాం. ‘చూడనివ్వు’ ద్వారా దేవునితో మోషే నేరుగా మాట్లాడుతున్న ఏకవచన సంబోధన నిలిచింది. డాష్‌లతో ‘మంచి దేశం’ తరువాతి భౌగోళిక పదబంధాల వివరణాత్మక సంబంధాన్ని స్పష్టపరిచాం.
