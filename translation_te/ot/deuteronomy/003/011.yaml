id: DEU.3.11
reference: Deuteronomy 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: te
  text: రెఫాయీయుల శేషం నుండి బాషాను రాజైన ఓగు మాత్రమే మిగిలాడు[a]. ఇదిగో, అతని మంచం ఇనుప మంచమే. అది అమ్మోనీయుల రబ్బాలో ఉంది కదా? దాని పొడవు తొమ్మిది మూరలు, వెడల్పు నాలుగు మూరలు—మనిషి మూర ప్రకారం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహాకాయులు.” హీబ్రూలో “రెఫాయీయులు”; ఇది అసాధారణ దేహాకృతితో సంబంధం ఉన్న ఒక ప్రాచీన ప్రజాసమూహపు పేరు కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “సాధారణ మూర ప్రకారం.” హీబ్రూలో అక్షరార్థంగా, “మనిషి మూర ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: మాత్రమే
  rationale: ఓగు ఒక్కడే మిగిలాడనే ప్రత్యేకతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: మిగిలినవారిలో ... మిగిలి ఉన్నాడు
  rationale: హీబ్రూ క్రియతో పాటు ‘మిగులు/శేషం’ అనే భావాన్ని నిలుపుతూ, ఓగు ఆ సమూహంలో మిగిలినవాడని తెలుపుతుంది; మూలంలోని పునరుక్తి భావం కొంతవరకు నిలుస్తుంది.
- source_word: הָרְפָאִים
  choice: రెఫాయీయులు
  rationale: ‘మహాకాయులు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, ప్రాచీన ప్రజాసమూహపు పేరును లిప్యంతరీకరించి ఉంచుతుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: ప్రస్తావిస్తున్న వస్తువుపై దృష్టి నిలిపే హీబ్రూ సూచనాబలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: అతని మంచం ఇనుప మంచం
  rationale: మూలంలోని నామపద పునరుక్తిని నిలుపుతుంది; సందర్భంలో ‘మంచం’ సహజమైన ప్రాథమిక అర్థం.
- source_word: בַּרְזֶל
  choice: ఇనుప
  rationale: పదార్థాన్ని నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: הֲלֹה הִוא
  choice: అది ... ఉంది కదా?
  rationale: తెలిసిన వస్తువు ఉన్న ప్రదేశాన్ని ఆధారంగా చూపించే మూలంలోని అలంకారప్రశ్నను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రబ్బాలో
  rationale: స్థలనామమైన రబ్బాను, ప్రజానామమైన అమ్మోనీయులను స్పష్టంగా మరియు సంక్షిప్తంగా అందిస్తుంది.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: తొమ్మిది మూరలు ... నాలుగు మూరలు
  rationale: ఆధునిక ప్రమాణానికి అంచనా మార్పిడి చేయకుండా ప్రాచీన కొలమానాన్ని నిలుపుతుంది.
- source_word: בְּאַמַּת אִישׁ
  choice: మనిషి మూర ప్రకారం
  rationale: హీబ్రూ పదబంధాన్ని దగ్గరగా అనుసరించి దాని సాధ్యమైన ‘సాధారణ మూర’ అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: הָרְפָאִים అనే పదాన్ని ప్రజాసమూహపు పేరుగా ఉంచాలా, ‘మహాకాయులు’ అని అర్థానువాదం చేయాలా
  choice: రెఫాయీయులు
  alternative: మహాకాయులు
  rationale: హీబ్రూ పదం పాత నిబంధనలో ఒక ప్రజాసమూహం లేదా వర్గానికి పేరుగా వస్తుంది. సందర్భం వారి అసాధారణ దేహాకృతిని సూచించవచ్చు గానీ, ‘మహాకాయులు’ అని ప్రధాన పాఠ్యంలో పెట్టడం ఆ వ్యాఖ్యానాన్ని పదంలోనే స్థిరపరుస్తుంది.
- issue: עֶרֶשׂ ఇక్కడ మంచాన్నా, శవపేటిక/శవమంచాన్నా సూచిస్తుంది
  choice: మంచం
  alternative: శవమంచం లేదా శవపేటిక
  rationale: కొలతలు ఓగు అసాధారణ పరిమాణాన్ని చూపిస్తున్న ఈ సందర్భంలో ‘మంచం’ సహజమైన అర్థం; అంత్యక్రియలకు సంబంధించిన ప్రత్యేక అర్థాన్ని హీబ్రూ ఇక్కడ నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘రెఫాయీయులు,’ ‘రబ్బా’ వంటి పేర్లు లిప్యంతరీకరించబడ్డాయి; ‘మూర’ అనే ప్రాచీన కొలమానం మార్పిడి లేకుండా నిలుపబడింది. అలంకారప్రశ్నను ‘ఉంది కదా?’గా సహజీకరించగా, మూలంలోని పునరుక్తి మరియు వ్యాఖ్యానపరమైన అనిశ్చితి పాఠ్యం/పాదసూచికలలో కాపాడబడ్డాయి.
