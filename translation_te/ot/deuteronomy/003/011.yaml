revisions:
- from: రెఫాయీయులలో మిగిలినవారిలో బాషాను రాజైన ఓగు మాత్రమే మిగిలి ఉన్నాడు[a]. చూడండి, అతని మంచం ఇనుప మంచం. అది అమ్మోనీయుల రబ్బాలో ఉంది కదా? దాని పొడవు తొమ్మిది మూరలు, వెడల్పు నాలుగు మూరలు—మనిషి మూర ప్రకారం[b].
  to: రెఫాయీయుల శేషం నుండి బాషాను రాజైన ఓగు మాత్రమే మిగిలాడు[a]. ఇదిగో, అతని మంచం ఇనుప మంచమే. అది అమ్మోనీయుల రబ్బాలో ఉంది కదా? దాని పొడవు తొమ్మిది మూరలు, వెడల్పు నాలుగు మూరలు—మనిషి మూర ప్రకారం[b].
  rationale: సవరణ మూలభావాన్ని మార్చకుండా, శేషం నుండి ఓగు ఒక్కడే మిగిలాడనే అర్థాన్ని స్పష్టంగా చేస్తుంది. పేర్లు, కొలతలు, అలంకారప్రశ్న, మరియు కొలమానానికి సంబంధించిన అనిశ్చితి యథాతథంగా కాపాడబడ్డాయి.
