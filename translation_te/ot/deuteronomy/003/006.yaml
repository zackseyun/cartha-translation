  terminology: ‘నాశనానికి అంకితం చేశాము’ חרם యొక్క ప్రత్యేక భావాన్ని నిలుపుతుంది; పాదసూచికలోని ‘నిషేధం కింద ఉంచాము’ సరైన ప్రత్యామ్నాయాన్ని ఇస్తుంది మరియు హెబ్రీ సాంకేతిక పదాన్ని సంక్షిప్తంగా వివరిస్తుంది. ‘పురుషులు, స్త్రీలు, చిన్నపిల్లలు’ మూలంలోని త్రయాన్ని ఖచ్చితంగా నిలుపుతుంది.
