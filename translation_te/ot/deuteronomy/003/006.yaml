source:
  edition: WLC
  text: וַ/נַּחֲרֵ֣ם אוֹתָ֔/ם כַּ/אֲשֶׁ֣ר עָשִׂ֔ינוּ לְ/סִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כָּל עִ֣יר מְתִ֔ם הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: te
  text: వారిని నాశనానికి అంకితం చేశాము[a]. హెష్బోను రాజైన సీహోనుకు చేసినట్లే, ప్రతి పట్టణాన్నీ—పురుషులను, స్త్రీలను, చిన్నపిల్లలను—పూర్తిగా నాశనం చేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “వారిని నిషేధం కింద ఉంచాము.” ఇక్కడి హెబ్రీ క్రియ חרם (ఖారమ్) దేనినైనా లేదా ఎవరినైనా పూర్తిగా నాశనం చేయడానికి ప్రత్యేకంగా అప్పగించడాన్ని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: నాశనానికి అంకితం చేశాము
  rationale: חרם అనే సాంకేతిక యుద్ధపదం కేవలం ‘నాశనం చేశాము’ అనే అర్థం కంటే, దేనినైనా తిరిగి తీసుకోకుండా నాశనానికి ప్రత్యేకంగా అప్పగించడాన్ని సూచిస్తుంది. ‘అంకితం చేశాము’ ఆ ప్రత్యేక భావాన్ని నిలుపుతుంది; ‘నాశనానికి’ దాని తీవ్రమైన ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: చేసినట్లే
  rationale: ముందు సీహోనుకు జరిగిన చర్యతో నేరుగా పోల్చే సహజమైన తెలుగు రూపం.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన సీహోనుకు
  rationale: עשה తరువాతి ל ప్రభావిత వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘సీహోనుకు చేసినట్లే’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַחֲרֵם
  choice: పూర్తిగా నాశనం చేశాము
  rationale: ముందున్న חרם క్రియను వివరించి తీవ్రతరం చేసే infinitive absolute యొక్క సమగ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל עִיר
  choice: ప్రతి పట్టణాన్నీ
  rationale: עיר ఇక్కడ నగరం లేదా పట్టణం కావచ్చు; ఈ ప్రాచీన ప్రాంతీయ నివాస కేంద్రాలకు ‘పట్టణం’ ఆధునిక తెలుగులో సహజంగా సరిపోతుంది.
- source_word: מְתִם
  choice: పురుషులను
  rationale: తరువాతి ‘స్త్రీలు, చిన్నపిల్లలు’తో ఏర్పడే జాబితాలో ఇది పురుష వ్యక్తులను సూచించే స్వతంత్ర నామవాచకంగా తీసుకోబడింది.
- source_word: הַנָּשִׁים
  choice: స్త్రీలను
  rationale: మూలపదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: וְהַטָּף
  choice: చిన్నపిల్లలను
  rationale: טף ముఖ్యంగా చిన్న వయసు పిల్లలను లేదా ఆధారిత చిన్నవారిని సూచిస్తుంది; ‘చిన్నపిల్లలు’ దాని వయోభావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ తీర్పు సందర్భంలో חרם పదాన్ని అనువదించడం
  choice: ప్రధాన వాక్యంలో ‘నాశనానికి అంకితం చేశాము’ అని, దాన్ని తీవ్రతరం చేసే రూపాన్ని ‘పూర్తిగా నాశనం చేశాము’ అని అనువదించడం
  alternative: ‘సమూలంగా నాశనం చేశాము’ లేదా ‘నిషేధం కింద ఉంచాము’
  rationale: ఈ వచనం చెప్పే సంపూర్ణ నాశనాన్ని మృదువుపరచకుండా, חרם పదానికి ఉన్న ప్రత్యేక మత-యుద్ధ సాంకేతిక భావాన్నీ కనిపించేలా ఉంచుతుంది. ‘నిషేధం కింద’ ఆధునిక పాఠకులకు వెంటనే స్పష్టంగా ఉండకపోవడం వల్ల దాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని పురుషులు–స్త్రీలు–చిన్నపిల్లలు అనే తీవ్రమైన జాబితాను తగ్గించకుండా నిలిపి, חרם పదంలోని ప్రత్యేక భావాన్ని పాదసూచికతో వివరించాం.
