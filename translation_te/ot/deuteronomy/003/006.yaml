  source_fidelity: మూలంలోని וַנַּחֲרֵם కు ‘నాశనానికి అంకితం చేశాము’ తగిన సాంకేతిక బలాన్ని ఇస్తుంది; తరువాతి הַחֲרֵם ను ‘పూర్తిగా నాశనం చేశాము’గా ఇవ్వడం దాని తీవ్రతను సహజంగా ప్రతిబింబిస్తుంది. ‘ప్రతి పట్టణాన్నీ—పురుషులను, స్త్రీలను, చిన్నపిల్లలను’ అనే జాబితా మసొరెటిక్ పాఠంలోని కఠినమైన సమగ్రతను తగ్గించదు. సీహోను పేరు, అతని హెష్బోను రాజ్యపదవి కూడా సరిగ్గా ఉన్నాయి.
