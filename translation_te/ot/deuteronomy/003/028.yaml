id: DEU.3.28
reference: Deuteronomy 3:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: te
  text: కాని యెహోషువకు బాధ్యతను అప్పగించు,[a] అతన్ని బలపరచి ధైర్యపరచు.[b] ఎందుకంటే అతడు ఈ ప్రజల ముందుగా దాటి వెళ్తాడు; నీవు చూడబోయే దేశాన్ని వారికి స్వాస్థ్యంగా పొందేలా చేస్తాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెహోషువకు ఆజ్ఞ ఇవ్వు,’ ‘యెహోషువను నియమించు.’ హిబ్రూ క్రియ అధికారికంగా బాధ్యత అప్పగించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతన్ని దృఢపరచి సాహసవంతుణ్ణి చేయు.’ ఈ రెండు హిబ్రూ క్రియలు బలం, స్థిరత్వం, ధైర్యం కలిగించడాన్ని కలిపి వ్యక్తం చేస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆ దేశాన్ని వారికి స్వాస్థ్యంగా ఇప్పిస్తాడు.’ హిబ్రూ క్రియ కారణార్థకం; యెహోషువ ద్వారా ప్రజలు తమ స్వాస్థ్యాన్ని పొందుతారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: యెహోషువకు బాధ్యత అప్పగించి
  rationale: צוה పియేల్ ఆజ్ఞారూపం ఇక్కడ యెహోషువకు నాయకత్వ బాధ్యతను అధికారికంగా అప్పగించడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో తరువాతి ఆజ్ఞలతో సహజంగా కలిసేందుకు ‘అప్పగించి’ వాడబడింది.
- source_word: וְחַזְּקֵהוּ
  choice: అతన్ని బలపరచి
  rationale: חזק పియేల్ రూపంలోని ‘బలపరచు, దృఢపరచు’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְאַמְּצֵהוּ
  choice: ధైర్యపరచు
  rationale: אמץ, חזקతో జతగా వచ్చి ధైర్యం కలిగించడం లేదా స్థిరపరచడం అనే భావాన్ని ఇస్తుంది. ‘బలపరచి ధైర్యపరచు’ రెండు క్రియల పరస్పరపూరక భావాన్ని నిలుపుతుంది.
- source_word: כִּי הוּא יַעֲבֹר
  choice: ఎందుకంటే అతడే ... దాటిపోతాడు
  rationale: עבר యొర్దాను దాటడాన్ని సందర్భపరంగా సూచిస్తుంది. ప్రత్యేక సర్వనామమైన הוּא మీదున్న ఉద్ఘాటనను ‘అతడే’ తెలియజేస్తుంది.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: ఈ ప్రజలకు ముందుగా
  rationale: לִפְנֵי స్థలపరంగా ‘ముందు’ అని, సందర్భంలో నాయకత్వ సూచనతోనూ అర్థమవుతుంది. ‘ముందుగా’ మూలంలోని రూపకాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: וְהוּא יַנְחִיל אוֹתָם
  choice: వారితో స్వాస్థ్యంగా పొందింపజేస్తాడు
  rationale: 'נחל హిఫీల్ రూపం కారణార్థకం: యెహోషువ ద్వారా ప్రజలు దేశాన్ని తమ స్వాస్థ్యంగా పొందుతారు. ‘పొందింపజేస్తాడు’ ఈ కారణార్థాన్ని నిలుపుతుంది.'
- source_word: הָאָרֶץ אֲשֶׁר תִּרְאֶה
  choice: నీవు చూడబోయే దేశాన్ని
  rationale: הָאָרֶץ‌ను సందర్భానికి తగిన ‘దేశం’గా, అసంపూర్ణ క్రియ תִּרְאֶה‌ను మోషే త్వరలో చూడబోయే కార్యంగా సహజ తెలుగులో అనువదిస్తుంది.
theological_decisions:
- issue: యెహోషువ పాత్ర మరియు స్వాస్థ్యప్రాప్తి
  choice: యెహోషువ వారితో దేశాన్ని స్వాస్థ్యంగా పొందింపజేస్తాడు
  alternative: యెహోషువ వారికి దేశాన్ని ఇస్తాడు
  rationale: హిబ్రూ హిఫీల్ క్రియ యెహోషువను ప్రజలు స్వాస్థ్యం పొందేలా చేసే ప్రతినిధిగా చూపుతుంది; దేశానికి అంతిమ దాత అతడేనని చెప్పేలా అనువదించకుండా కారణార్థక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞల వరుసను సహజ తెలుగు సంయుక్త క్రియలతో అందించగా, ‘అతడే’ ద్వారా హిబ్రూ ఉద్ఘాటనను, ‘స్వాస్థ్యంగా పొందింపజేస్తాడు’ ద్వారా కారణార్థాన్ని నిలిపాం.
