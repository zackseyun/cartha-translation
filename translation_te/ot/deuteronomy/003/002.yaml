source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: te
  text: 'యాహ్వే నాతో ఇలా అన్నాడు: “అతనికి భయపడవద్దు, ఎందుకంటే నేను అతనినీ, అతని ప్రజలందరినీ, అతని దేశాన్నీ నీ చేతికి అప్పగించాను. హెష్బోనులో నివసించిన అమోరీయుల రాజు సీహోనుకు నీవు చేసినట్లే అతనికీ చేయాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని సాధారణ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తపరుస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: אַל תִּירָא אֹתוֹ
  choice: అతనికి భయపడకు
  rationale: నిషేధార్థక ఆజ్ఞను, హెబ్రీలో స్పష్టంగా ఉన్న కర్మను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי בְיָדְךָ נָתַתִּי
  choice: ఇదిగో, నేను ... నీ చేతికి అప్పగించాను
  rationale: హెబ్రీ సంపూర్ణ క్రియలోని నిశ్చయంగా నెరవేరిన భావాన్ని భూతకాల సంపూర్ణతతో తెలియజేస్తూ, ‘చేతికి’ అనే మూలభాషా అధికార-అప్పగింత రూపకాన్ని నిలుపుతుంది. כִּי ఇక్కడ ఇచ్చే భరోసా కారణాన్ని తెలుగులో సహజంగా బలపరచడానికి ‘ఇదిగో’ వాడబడింది.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: అతని ప్రజలందరినీ, అతని దేశాన్నీ
  rationale: עַם ను సైన్యానికి పరిమితం చేయకుండా ‘ప్రజలు’గా, אֶרֶץ ను సందర్భానుకూలంగా ‘దేశం’గా అనువదిస్తుంది.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: అతనికీ చేయాలి
  rationale: עשה అనే విస్తృతార్థక క్రియను అతిగా విశదీకరించకుండా ఉంచుతుంది; తదుపరి పోలిక దాని భావాన్ని నిర్ణయిస్తుంది.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: నీవు చేసినట్లే
  rationale: పోలికను స్పష్టంగా, సహజమైన తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజు సీహోనుకు
  rationale: రాజు మరియు ప్రజావర్గం మధ్య సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: హెష్బోనులో నివసించిన
  rationale: ישב యొక్క నివాసార్థాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది; కథన సందర్భానికి అనుగుణంగా భూతకాల సంబంధక్రియగా ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే నిలుపుతుంది. ‘యెహోవా’ తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా సుపరిచితమైన రూపం.
- issue: నָתַתִּי క్రియలోని నిశ్చిత అప్పగింత
  choice: అప్పగించాను
  alternative: అప్పగిస్తాను; నీ అధికారంలో ఉంచాను
  rationale: యుద్ధం ఇంకా జరగకముందే దేవుడు ఫలితాన్ని నిశ్చితంగా జరిగినదిగా ప్రకటించే మూలభాషా సంపూర్ణ క్రియ యొక్క ఉద్వేగాన్ని నిలుపుతుంది; దానిని కేవలం భవిష్య వాగ్దానంగా మార్చదు.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ పదక్రమం, అయితే ‘నీ చేతికి’ అనే ముఖ్యమైన హెబ్రీ రూపకం మరియు విస్తృతార్థక ‘చేయాలి’ ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. వ్యక్తినామాల లిప్యంతరీకరణ: సీహోను, హెష్బోను.'
