  to: 'యాహ్వే నాతో ఇలా అన్నాడు: “అతనికి భయపడవద్దు, ఎందుకంటే నేను అతనినీ, అతని ప్రజలందరినీ, అతని దేశాన్నీ నీ చేతికి అప్పగించాను. హెష్బోనులో నివసించిన అమోరీయుల రాజు సీహోనుకు నీవు చేసినట్లే అతనికీ చేయాలి.”'
