  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: te
  text: అలాగే అరాబా ప్రాంతం, దానికి సరిహద్దుగా యొర్దాను, కిన్నెరెతు నుండి అరాబా సముద్రం వరకు—అంటే ఉప్పు సముద్రం వరకు—తూర్పు వైపున పిస్గా వాలుల దిగువన ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: అరాబా ప్రాంతం
  rationale: సరిహద్దుల వర్ణనలో ఇది సాధారణ ‘మైదానం’ కంటే యొర్దాను లోయకు సంబంధించిన స్థలనామం; తెలుగు పాఠకునికి భౌగోళిక భావం స్పష్టమయ్యేలా ‘ప్రాంతం’ చేర్చబడింది.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: ప్రామాణిక స్థలనామాన్ని లిప్యంతరీకరించాం; సందర్భంలో నది అని స్పష్టంగా ఉండటంతో ‘నది’ చేర్చలేదు.
- source_word: גְבֻל
  choice: సరిహద్దుగా
  rationale: హీబ్రూ జాబితాలోని సంక్షిప్త నిర్మాణాన్ని సహజమైన తెలుగులో సంబంధాన్ని స్పష్టం చేస్తూ అందిస్తుంది.
- source_word: מִכִּנֶּרֶת
  choice: కిన్నెరెతు నుండి
  rationale: మూలంలో ఉన్న స్థలనామాన్నే లిప్యంతరీకరించాం; అది పట్టణమా, సరస్సా, ప్రాంతమా అన్నది పాఠ్యంలో నిర్దిష్టంగా చెప్పలేదు కాబట్టి వివరణను జోడించలేదు.
- source_word: יָם הָעֲרָבָה
  choice: అరాబా సముద్రం
  rationale: తర్వాత వచ్చే ‘ఉప్పు సముద్రం’ అనే సమానాధికార వివరణకు ముందు మూలంలోని భౌగోళిక నామాన్ని నేరుగా నిలిపాం.
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: మూల హీబ్రూ వ్యక్తీకరణను నేరుగా అనువదించాం; ఆధునిక ప్రసిద్ధ పేరు ‘మృత సముద్రం’ను పాదసూచికలో ఇచ్చాం.
- source_word: תַּחַת
  choice: దిగువన
  rationale: భౌగోళిక ఎత్తు సంబంధాన్ని సహజంగా తెలియజేస్తుంది; దిక్కును ఊహించి ‘దక్షిణంగా’ అని అనువదించలేదు.
- source_word: אַשְׁדֹּת
  choice: పర్వతపు వాలులు
  rationale: ఈ భౌగోళిక సందర్భంలో పర్వత దిగువ వాలులు లేదా ఏటవాలు అనే భావమే తగినది.
- source_word: הַפִּסְגָּה
  choice: పిస్గా
  rationale: స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: מִזְרָחָה
  choice: తూర్పున
  rationale: సరిహద్దు లేదా ప్రాంతం తూర్పువైపు ఉన్నదనే స్థానార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
