translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సరిహద్దుల జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంక్షిప్తతను తెలుగులో స్పష్టత కోసం కొద్దిగా విప్పి చెప్పాం. కిన్నెరెతు అనే పేరు గురించి ఆంగ్ల పాదసూచికలోని K/Ch లిప్యంతరణ భేదం తెలుగులో సహజంగా వర్తించదు కాబట్టి పాదసూచికగా చేర్చలేదు.
