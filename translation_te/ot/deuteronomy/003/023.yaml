base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: te
  text: 'ఆ సమయంలో నేను యాహ్వేను[a] ఇలా వేడుకొన్నాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH.” సంప్రదాయ అనువాదాల్లో “ప్రభువు” (LORD) అని ఇస్తారు; మరో లిప్యంతరీకరణ: “యెహోవా.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: నేను … వేడుకున్నాను
  rationale: חנן యొక్క హిత్పయేల్ రూపం కృప లేదా దయ కోసం హృదయపూర్వకంగా ప్రాధేయపడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వేడుకున్నాను’ ఈ తీవ్రతను సహజంగా తెలియజేస్తుంది; వావ్‌తో కూడిన క్రియారూపాన్ని గతకాల కథనంగా అనువదించాం.
- source_word: אֶל
  choice: యెహోవాను
  rationale: హీబ్రూలో ఈ సంబంధసూచకం ప్రార్థన ఎవరిని ఉద్దేశించిందో తెలియజేస్తుంది. తెలుగులో ‘వేడుకొను’ క్రియతో ద్వితీయా విభక్తి సహజమైనందున ‘యెహోవాను’ అని ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలో దేవుని వ్యక్తిగత నామమైన చతురక్షరి יהוה ఉంది. బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని వాడాం.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: ఈ కాలసూచక పదబంధం గతంలో పేర్కొన్న సందర్భాన్ని సూచిస్తుంది. ‘ఆ సమయంలో’ సహజమైనదిగా ఉండి, మూలంలోని కాలవ్యాప్తిని అనవసరంగా కుదించదు.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష మాటలను పరిచయం చేసే హీబ్రూ సూత్రప్రయోగం. తెలుగులో ‘ఇలా … వేడుకున్నాను:’ అని చెప్పడం సహజంగా ఉండి అదే కథన సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో יהוה అనే దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా ఉంచాం. తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మరో సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యం తదుపరి వచనంలోని ప్రత్యక్ష ప్రార్థనను పరిచయం చేస్తున్నందున చివర ద్విబిందువు ఉంచబడింది.
