  text: וְ/אֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר עֵינֶ֣י/ךָ הָ/רֹאֹ֗ת אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֤ה אֱלֹהֵי/כֶם֙ לִ/שְׁנֵי֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה כֵּֽן יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל הַ/מַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: te
  text: 'ఆ సమయంలో నేను యెహోషువకు ఇలా ఆజ్ఞాపించాను: “మీ దేవుడైన యాహ్వే[a] ఈ ఇద్దరు రాజులకు చేసినదంతా నీ కళ్లే చూశాయి. నీవు దాటి వెళ్లబోతున్న రాజ్యాలన్నిటికీ[b] యాహ్వే అలాగే చేస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మీ’ అనేది బహువచనం; అయితే మోషే యెహోషువను ‘నీ’ అని ఏకవచనంలో సంబోధిస్తున్నాడు.
    reason: మూల హీబ్రూలో ఉన్న సంఖ్యా మార్పును పాఠకునికి తెలియజేయడం.
  - marker: b
    text: హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా, ‘నీవు అక్కడికి దాటి వెళ్తున్న’ అని అనువదించవచ్చు.
    reason: שָׁמָּה (‘అక్కడికి’) కలిగిన గమ్యస్థాన భావాన్నీ, עבר (‘దాటడం’) అనే పదాన్నీ సూచించే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: నేను యెహోషువకు ... ఆజ్ఞాపించాను
  rationale: צוה అధికారపూర్వకమైన ఆజ్ఞను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్మను సంప్రదాన రూపంలో ఉంచడం సహజం.
- source_word: בָּעֵת הַהִוא לֵאמֹר
  choice: ఆ సమయంలో ... ఇలా
  rationale: కాలసూచక పదబంధాన్ని నేరుగా ఉంచి, לֵאמֹר అనే ఉక్తి-పరిచయ సూత్రాన్ని ఆధునిక తెలుగులో సహజమైన ‘ఇలా’తో వ్యక్తం చేశాం.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: నీ కళ్లే చూశాయి
  rationale: మూలంలోని ‘నీ కళ్లే’ అనే ప్రత్యక్ష సాక్ష్యపు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వే
  rationale: దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం. యెహోషువను ఏకవచనంలో సంబోధిస్తున్నప్పటికీ, אֱלֹהֵיכֶם లోని బహువచన ప్రత్యయాన్ని ‘మీ’గా నిలిపాం.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: ఈ ఇద్దరు రాజులకు
  rationale: לְ సూచించే ప్రభావిత లక్ష్యాన్ని తెలుగులో సహజంగా ‘రాజులకు’ అని వ్యక్తం చేశాం; విరోధార్థాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: యాహ్వే అలాగే చేస్తాడు
  rationale: כֵּן గత కార్యానికి, రాబోయే కార్యానికి మధ్య ఉన్న పోలికను ‘అలాగే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: నీవు దాటి వెళ్లబోయే అక్కడి
  rationale: עבר లోని ‘దాటడం’ భావాన్నీ, שָׁמָּה లోని గమ్యస్థాన భావాన్నీ సాధ్యమైనంత సహజంగా నిలిపాం; సందర్భంలో ఇది యొర్దాను దాటి చేరబోయే రాజ్యాలను సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: యెహోషువకు ఏకవచన సంబోధన మధ్య אֱלֹהֵיכֶם లోని బహువచనం
  choice: ‘మీ దేవుడు’ అని బహువచనాన్ని నిలపడం
  alternative: ‘నీ దేవుడు’ అని మొత్తం సంబోధనను ఏకవచనంగా సమన్వయపరచడం
  rationale: మూలంలోని సంఖ్యా మార్పును మౌనంగా సరిచేయకుండా నిలిపాం. ఇది యెహోషువతో పాటు ఇశ్రాయేలు సమాజాన్ని కూడా దృష్టిలో ఉంచిన ప్రయోగం కావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. యెహోషువను ఉద్దేశించిన ఏకవచన ‘నీ/నీవు’ను నిలిపి, మూలంలోని అనూహ్య బహువచన ‘మీ దేవుడు’ను పాదసూచికతో సంరక్షించాం.
