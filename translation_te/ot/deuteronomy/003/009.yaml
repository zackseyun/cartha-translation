- source_word: יִקְרְאוּ לוֹ
  choice: దానిని … అని పిలుస్తారు
  rationale: సర్వనామం తిరిగి హెర్మోనును సూచిస్తుంది; పేరు పెట్టే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
- source_word: שְׂנִיר
  choice: శెనీరు
  rationale: హెర్మోనుకు అమోరీయులు వాడిన ప్రత్యేక పేరును ధ్వన్యంతరీకరించాం.
