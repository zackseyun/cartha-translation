lexical_decisions:
- source_word: צִידֹנִים
  choice: సీదోనీయులు
  rationale: సీదోను ప్రజలను సూచించే బహువచన జాతినామం; తెలుగులో సహజమైన ప్రజావాచక బహువచనంగా ఇచ్చాం.
- source_word: יִקְרְאוּ
  choice: అని పిలుస్తారు
  rationale: קרא క్రియకు ל ఉపసర్గ కలిసిన ఈ నిర్మాణం పేరు పెట్టడం లేదా ఒక పేరుతో పిలవడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘అని పిలుస్తారు’ సహజంగా ఉంది.
- source_word: לְחֶרְמוֹן
  choice: హెర్మోనును
  rationale: ఇది స్థలనామం. ఈ వచనంలోని హీబ్రూలో ‘కొండ’ అనే పదం లేదు కాబట్టి ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- source_word: שִׂרְיֹן
  choice: సిర్యోను
  rationale: హెర్మోనుకు సీదోనీయులు వాడిన పేరును అనువదించకుండా ధ్వన్యంతరీకరించాం.
- source_word: וְהָאֱמֹרִי
  choice: అమోరీయులు
