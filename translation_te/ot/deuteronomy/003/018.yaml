  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: te
  text: 'ఆ సమయంలో నేను మీకు ఇలా ఆజ్ఞాపించాను: “మీ దేవుడైన యాహ్వే ఈ దేశాన్ని మీ స్వాధీనానికి ఇచ్చాడు. మీలో యుద్ధసామర్థ్యమున్న పురుషులందరూ ఆయుధాలు ధరించి[a] మీ సహోదరులైన ఇశ్రాయేలీయుల కంటే ముందుగా దాటిపోవాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆయుధాలు ధరించి” అంటే “యుద్ధానికి సన్నద్ధమై” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: నేను మీకు ... ఆజ్ఞాపించాను
  rationale: צוה అనే క్రియలోని నేరమైన ఆజ్ఞ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: ఈ దేశాన్ని స్వాధీనం చేసుకోవడానికి మీకు ఇచ్చాడు
  rationale: ఇవ్వడం పూర్తయిన కార్యమనే భావాన్నీ, ירשׁ ఇక్కడ సూచించే భూస్వాధీన భావాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: חֲלוּצִים
  choice: ఆయుధసన్నద్ధులై
  rationale: యుద్ధానికి సిద్ధపడి, ఆయుధాలతో ముందుకు వెళ్లే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: మీ సహోదరులకు ముందుగా
  rationale: సైనిక కదలికలో ఇతర ఇశ్రాయేలీయుల కంటే ముందుగా వెళ్లాలనే అర్థాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని వంశసంబంధమైన పురుష బహువచన రూపాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
- source_word: כָּל בְּנֵי חָיִל
  choice: యుద్ధానికి సమర్థులైన మీ పురుషులందరూ
  rationale: חיל ఇక్కడ కేవలం అంతరంగ ధైర్యాన్ని కాక, యుద్ధసామర్థ్యమున్న పురుషులను సూచిస్తుంది; వాక్యంలోని సంబోధితులే ఈ కర్తలని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా సమీప లిప్యంతరీకరణతో ఇచ్చాం.
- issue: אֲחֵיכֶם / בְּנֵי יִשְׂרָאֵל / בְּנֵי חָיִל లోని పురుషలింగ భాష
  choice: మీ సహోదరులైన ఇశ్రాయేలు కుమారులు ... యుద్ధానికి సమర్థులైన పురుషులు
  alternative: మీ తోటి ఇశ్రాయేలీయులు ... యోధులు
  rationale: ఇది సైనిక బాధ్యతను అప్పగించే సందర్భం; మూలంలోని పురుషలింగ, బంధుత్వ భాషను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన సమగ్ర అర్థాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ఆజ్ఞాత్మక బలం, సైనిక సందర్భం, బంధుత్వ భాష నిలుపబడ్డాయి; తెలుగులో అసహజమైన పదక్రమాన్ని మాత్రం సహజీకరించాం.
