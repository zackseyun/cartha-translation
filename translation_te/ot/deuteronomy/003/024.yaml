id: DEU.3.24
reference: Deuteronomy 3:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: te
  text: “ప్రభువా, యెహోవా[a], నీ గొప్పతనాన్ని, నీ బలమైన చేతిని నీ సేవకునికి చూపించడం నీవు మొదలుపెట్టావు. ఆకాశంలోగానీ భూమిమీదగానీ నీ కార్యాలవంటివి, నీ పరాక్రమ కార్యాలవంటివి చేయగల దేవుడు ఎవడు?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ‘అదోనాయ్ YHWH’: ‘అదోనాయ్’ అంటే ‘ప్రభువు’ అనే బిరుదు; YHWH దేవుని ప్రత్యేక నామం. ఈ నామాన్ని ‘యాహ్వే’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవబిరుదు మరియు దైవనామం కలిసివచ్చిన మూలరూపాన్ని, అలాగే నామానికి ఉన్న ప్రత్యామ్నాయ లిప్యంతరణను తెలియజేయడం.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువా, యెహోవా
  rationale: אֲדֹנָי అనే ప్రభుత్వ బిరుదును, יהוה అనే ప్రత్యేక దైవనామాన్ని వేరువేరుగా నిలుపుతుంది; ఆధునిక తెలుగులో ప్రార్థనాత్మక సంబోధనగా సహజంగా ఉంటుంది.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: చూపించడం నీవు మొదలుపెట్టావు
  rationale: హిఫిల్ రూపాలైన ‘మొదలుపెట్టు’ మరియు ‘చూపు’ అనే అర్థాలను నేరుగా నిలుపుతూ, ఇప్పటికే ఆరంభమైన చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకునికి
  rationale: దేవునితో ప్రార్థనలో మాట్లాడుతున్న ఒడంబడిక సేవకుని సందర్భంలో ‘సేవకుడు’ సహజమైనది; ఇక్కడ ‘బానిస’ అనడం అనవసరంగా వేరొక భావాన్ని ముందుకు తెస్తుంది.
- source_word: גָּדְלְךָ
  choice: నీ గొప్పతనాన్ని
  rationale: మూలంలోని ‘గొప్పతనం/మహత్వం’ భావాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: יָדְךָ הַחֲזָקָה
  choice: నీ బలమైన చేతిని
  rationale: దేవుని కార్యశక్తిని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతూ חֲזָקָהకు నేరమైన సమానార్థాన్ని ఇస్తుంది.
- source_word: מִי אֵל
  choice: దేవుడు ఎవడు?
  rationale: పోల్చదగిన దేవుడు ఎవరూ లేరనే భావమున్న అలంకారిక ప్రశ్నను, దాని ప్రశ్నారూపాన్ని మార్చకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ఆకాశంలోగానీ భూమిమీదగానీ
  rationale: సంభావ్య ప్రత్యర్థి ఎక్కడా లేడనే సమగ్ర పరిధిని తెలుగు ‘గానీ…గానీ’ నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַעֲשֶׂה
  choice: చేయగల
  rationale: ఈ అలంకారిక పోలికలో అపూర్ణ క్రియకు ఉన్న సామర్థ్య భావాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: నీ కార్యాలవంటి కార్యాలు, నీ పరాక్రమ క్రియలవంటి క్రియలు
  rationale: రెండు సమాంతర పదబంధాలనూ, ‘వంటి’ అనే స్పష్టమైన పోలికనూ నిలుపుతుంది; גְבוּרוֹתలోని శక్తి ప్రదర్శన భావాన్ని ‘పరాక్రమ క్రియలు’ తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי יְהוִהలోని దైవనామం
  choice: ప్రభువా, యెహోవా
  alternative: ప్రభువైన దేవా; ప్రభువా, యాహ్వే
  rationale: మూలంలో ప్రభుత్వ బిరుదు మరియు చతురక్షర దైవనామం రెండూ ఉన్నాయి. వాటిని ఒకే సాధారణ బిరుదుగా కలపకుండా వేరు చేసి చూపుతుంది. ‘యెహోవా’ తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన దైవనామ రూపం; ఉచ్చారణ పునర్నిర్మాణంపై ఉన్న అనిశ్చితిని పాదటిప్పణి సూచిస్తుంది.
- issue: ఇతర దేవతలతో పోలికగల అలంకారిక ప్రశ్న
  choice: దేవుడు ఎవడు?
  alternative: ఏ దేవుడు ఉన్నాడు?
  rationale: మూలపాఠం ప్రశ్నను వాడుతుంది; దానిని నేరుగా ‘ఎవరూ లేరు’ అని సిద్ధాంతాత్మక ప్రకటనగా మార్చకుండా దాని వాక్చాతుర్యాన్ని, పోలికలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రార్థనా స్వరం. అతి ప్రాచీన క్రియారూపాలను నివారిస్తూ, మూలంలోని పునరుక్త సమాంతరతను మరియు ‘బలమైన చెయ్యి’ అనే రూపకాన్ని నిలిపాం.
