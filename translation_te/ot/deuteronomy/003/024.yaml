    rationale: The Hebrew parallelism can be retained naturally in Telugu as ‘నీ కార్యాలవంటివి, నీ పరాక్రమ కార్యాలవంటివి.’
  - severity: medium
    issue: The footnote gives ‘యెహ్వే’ as though it were the Hebrew wording.
    rationale: The Hebrew text contains the consonantal divine name YHWH; vocalized/transliterated forms are interpretive conventions. The note should identify YHWH and state the alternative transliteration without implying certainty.
