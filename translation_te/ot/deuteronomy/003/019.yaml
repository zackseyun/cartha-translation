  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: te
  text: మీ భార్యలు, మీ చిన్నపిల్లలు[a], మీ పశుసంపద మాత్రమే—మీకు పశుసంపద విస్తారంగా ఉందని నాకు తెలుసు—నేను మీకు ఇచ్చిన మీ పట్టణాల్లో ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ పిల్లలు.’ హెబ్రీ పదం చిన్న పిల్లలను లేదా ఆధారపడిన కుటుంబ సభ్యులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి ఆజ్ఞకు మినహాయింపును సూచించే నిర్బంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נְשֵׁיכֶם
  choice: మీ భార్యలు
  rationale: ఇక్కడ వెనుక ఉండే కుటుంబ సభ్యుల సందర్భంలో ‘స్త్రీలు’ కంటే ‘భార్యలు’ అనే నిర్దిష్ట అర్థమే సరిపోతుంది.
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలు
  rationale: ఈ పదం చిన్న పిల్లలను లేదా ఆధారపడిన కుటుంబ సభ్యులను సూచిస్తుంది; ప్రధాన పాఠంలో స్పష్టమైన కుటుంబార్థాన్ని నిలుపుతుంది.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: మీ పశుసంపద / పశుసంపద విస్తారంగా
  rationale: ఇది కేవలం పశువులను మాత్రమే కాక పెంపుడు జంతువులన్నిటినీ విస్తృతంగా సూచిస్తుంది; హెబ్రీ పునరుక్తిని తెలుగులోనూ నిలిపింది.
- source_word: יָדַעְתִּי כִּי
  choice: ఉందని నాకు తెలుసు
  rationale: మినహాయింపుకు కారణాన్ని చెప్పే మొదటి పురుషుని స్పష్టమైన ప్రకటనను సహజంగా అందిస్తుంది.
- source_word: יֵשְׁבוּ
  choice: ఉండాలి
  rationale: మూల క్రియకు కూర్చోవడం/నివసించడం అనే పరిధి ఉన్నా, యుద్ధానికి వెళ్లేవారికి విరుద్ధంగా వీరు అక్కడే ఉండాలనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: בְּעָרֵיכֶם
  choice: మీ పట్టణాల్లో
  rationale: עִיר వివిధ పరిమాణాల జనావాసాలను సూచించగలదు; ‘పట్టణాలు’ పరిమాణాన్ని అతిశయింపకుండా సహజంగా ఉంది.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: నేను మీకు ఇచ్చిన
  rationale: ఇప్పటికే వారికి అనుగ్రహించిన పట్టణాలను సూచించే పూర్తయిన క్రియను నేరుగా నిలుపుతుంది.
