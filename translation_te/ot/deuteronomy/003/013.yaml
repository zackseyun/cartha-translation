id: DEU.3.13
reference: Deuteronomy 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: te
  text: గిలాదులో మిగిలిన భాగాన్ని, ఓగు రాజ్యమైన బాషాను అంతటినీ నేను మనష్షే అర్ధగోత్రానికి ఇచ్చాను. అర్గోబు ప్రాంతమంతా—అంటే బాషాను అంతా—రెఫాయీయుల దేశం[a] అని పిలువబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ అనువాదం ప్రకారం, “దైత్యుల దేశం.” “రెఫాయీయులు” అనేది ఈ ప్రాంతంతో సంబంధమున్న ఒక ప్రాచీన ప్రజాసమూహానికి హీబ్రూ పేరు.
    reason: ప్రజాసమూహ నామానికి ఉన్న సంప్రదాయ అర్థానువాదాన్ని నమోదు చేయడానికి.
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: గిలాదులో మిగిలిన భాగాన్ని
  rationale: ముందటి భూభాగ కేటాయింపు తరువాత మిగిలిన గిలాదు భాగాన్ని సూచిస్తుంది; తెలుగు విభక్తులతో సహజంగా, స్పష్టంగా ఉంది.
- source_word: כָל הַבָּשָׁן מַמְלֶכֶת עוֹג
  choice: ఓగు రాజ్యమైన బాషాను అంతటినీ
  rationale: బాషాను మొత్తం ఓగు రాజ్యంగా గుర్తించే హీబ్రూ సమాస సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נָתַתִּי
  choice: నేను ... ఇచ్చాను
  rationale: భూభాగ కేటాయింపు సందర్భంలో సాధారణ అర్థాన్ని, ప్రథమ పురుష వచనాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రానికి
  rationale: యొర్దాను అవతలి గోత్ర విభాగానికి తెలుగు బైబిలు వాడుకలో స్పష్టమైన రూపం.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: అర్గోబు ప్రాంతమంతా
  rationale: חֶבֶל ఇక్కడ తాడు అనే అక్షరార్థంలో కాక, నిర్దిష్ట భూభాగం లేదా ప్రాంతం అనే అర్థంలో ఉంది.
- source_word: לְכָל הַבָּשָׁן
  choice: అంటే బాషాను అంతా
  rationale: ముందున్న అర్గోబు ప్రాంతాన్ని వివరిస్తున్న సంబంధాన్ని పాఠకుడికి స్పష్టంగా చేస్తుంది; మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: יִקָּרֵא
  choice: పిలువబడుతుంది
  rationale: హీబ్రూ అసంపూర్ణ కర్మణి రూపం ఇక్కడ స్థిరమైన పేరును సూచిస్తుంది; వర్తమాన కర్మణి తెలుగు రూపం దానిని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ רְפָאִים
  choice: రెఫాయీయుల దేశం
  rationale: רְפָאִים అనే ప్రాచీన ప్రజాసమూహ నామాన్ని అనువాదంలోనే ‘దైత్యులు’ అని వ్యాఖ్యానించకుండా లిప్యంతరీకరణ ఆధారంగా అందిస్తుంది.
theological_decisions:
- issue: רְפָאִים అనే పదాన్ని ప్రజాసమూహ నామంగా ఉంచాలా, ‘దైత్యులు’ అని అర్థానువాదం చేయాలా
  choice: రెఫాయీయుల దేశం
  alternative: దైత్యుల దేశం
  rationale: ఈ సందర్భంలో ఈ హీబ్రూ పదం ఒక ప్రాచీన ప్రజాసమూహానికి నామంగా పనిచేస్తుంది. ప్రధాన పాఠంలో పేరును నిలిపి, సంప్రదాయ అర్థానువాదాన్ని పాదసూచికలో ఇవ్వడం మూలంలోని అనిశ్చితిని అతిగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. స్థలనామాలు, ప్రజానామాలు తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; హీబ్రూ వాక్యంలోని భూభాగాల పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
