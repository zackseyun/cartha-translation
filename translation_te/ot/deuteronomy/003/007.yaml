  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: te
  text: అయితే పశుసంపదనంతటినీ, పట్టణాల దోపుడు సొమ్మునూ మన కోసం కొల్లగొట్టుకున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పశుసంపదనంతటినీ, పట్టణాల దోపుడు సొమ్మునూ మన సొంతం చేసుకున్నాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: అయితే ... అంతటినీ
  rationale: ముందటి వచనంలో ప్రజలను పూర్తిగా నాశనం చేసిన దానికి భిన్నంగా పశుసంపదను, సొమ్మును స్వాధీనం చేసుకున్నారని సందర్భం సూచిస్తుంది. అందువల్ల וְ కు స్వల్ప వ్యతిరేక భావంతో ‘అయితే’ అని, כָל యొక్క సమగ్రతను ‘అంతటినీ’ అని వ్యక్తపరిచాం.
- source_word: הַ/בְּהֵמָה
  choice: పశుసంపద
  rationale: ఈ యుద్ధ సందర్భంలో בְּהֵמָה పట్టణవాసులకు చెందిన పెంపుడు జంతువులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పశుసంపద’ సహజంగా, సముచితంగా ఉంది.
- source_word: וּ/שְׁלַל
  choice: దోపుడు సొమ్ము
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న వస్తుసంపదను సూచిస్తుంది. ‘దోపుడు సొమ్ము’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, కేవలం నగదును మాత్రమే సూచించకుండా వస్తుసంపద అనే విస్తృత భావాన్ని మోస్తుంది.
- source_word: הֶ/עָרִים
  choice: పట్టణాల
  rationale: హీబ్రూ నిర్మాణంలోని సంబంధాన్ని నేరుగా నిలుపుతూ ‘పట్టణాల దోపుడు సొమ్ము’ అని అనువదించాం; అర్థంలో అది ఆ పట్టణాల నుంచి తీసుకున్న సొమ్ము.
- source_word: בַּזּוֹנוּ
  choice: దోచుకున్నాం
  rationale: בזז అనే క్రియ యుద్ధంలో దోపిడీ చేయడం లేదా కొల్లగొట్టడాన్ని సూచిస్తుంది. ‘దోచుకున్నాం’ తెలుగులో స్పష్టమైన, సహజమైన క్రియ.
- source_word: לָֽ/נוּ
  choice: మనకోసం
  rationale: లామెద్‌తో కూడిన ప్రథమ పురుష బహువచన ప్రత్యయం దోపిడీ వల్ల లాభపడేవారిని సూచిస్తుంది; ‘మనకోసం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
