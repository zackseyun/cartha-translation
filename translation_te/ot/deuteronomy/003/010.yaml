source:
  edition: WLC
  text: כֹּ֣ל עָרֵ֣י הַ/מִּישֹׁ֗ר וְ/כָל הַ/גִּלְעָד֙ וְ/כָל הַ/בָּשָׁ֔ן עַד סַלְכָ֖ה וְ/אֶדְרֶ֑עִי עָרֵ֛י מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/010.yaml
  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: te
  text: ఎత్తైన సమతల ప్రాంతంలోని[a] పట్టణాలన్నిటినీ, గిలాదంతటినీ, బాషానంతటినీ, సల్కా, ఎద్రెయి వరకు—బాషానులోని ఓగు రాజ్యపు పట్టణాలన్నిటినీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మైదానం’ లేదా ‘పీఠభూమి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం యొర్దాను నదికి తూర్పున ఉన్న సమతలమైన ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: మైదాన పీఠభూమిలోని పట్టణాలన్నిటినీ
  rationale: מִישׁוֹר ఇక్కడ యొర్దాను తూర్పున ఉన్న సమతలమైన ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి భౌగోళిక భావం స్పష్టమయ్యేలా ‘మైదాన పీఠభూమి’ అని ఇచ్చాం; వాక్యం మునుపటి క్రియకు కర్మగా కొనసాగుతున్నందున ద్వితీయా విభక్తి వాడాం.
- source_word: וְכָל הַגִּלְעָד
  choice: గిలాదంతటినీ
  rationale: ప్రాంతనామాన్ని లిప్యంతరీకరించి, כֹּל సూచించే సంపూర్ణ వ్యాప్తిని ‘అంతటినీ’తో తెలిపాం.
- source_word: וְכָל הַבָּשָׁן
  choice: బాషానంతటినీ
  rationale: ప్రాంతనామాన్ని లిప్యంతరీకరించి, మొత్తం ప్రాంతమనే భావాన్ని నిలిపాం.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: సల్కా నుండి ఎద్రెయి వరకు
  rationale: עַד భౌగోళిక పరిమితిని సూచిస్తుంది. తెలుగులో రెండు చివరి పట్టణాలను సహజంగా అనుసంధానించేందుకు ‘నుండి ... వరకు’ వాడాం.
- source_word: עָרֵי מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: బాషానులోని ఓగు రాజ్యపు పట్టణాలను
  rationale: నిర్మాణ శ్రేణిని ‘ఓగు రాజ్యపు పట్టణాలు’గా పారదర్శకంగా ఇచ్చి, בַּבָּשָׁן లోని בְּ స్థానార్థాన్ని ‘బాషానులోని’గా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన భౌగోళిక వర్ణన. ఈ వచనం ముందున్న వాక్యంలోని ‘స్వాధీనం చేసుకున్నాం’ అనే క్రియపై ఆధారపడే జాబితా కావడంతో, స్వతంత్ర పఠనానికి ఆ క్రియను సరఫరా చేశాం. స్థలనామాలకు తెలుగు బైబిలు వినియోగానికి దగ్గరైన రూపాలు వాడాం.
