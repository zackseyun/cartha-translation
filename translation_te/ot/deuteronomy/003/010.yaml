- from: మైదాన పీఠభూమిలోని[a] పట్టణాలన్నిటినీ, గిలాదంతటినీ, బాషానంతటినీ, సల్కా నుండి ఎద్రెయి వరకు—బాషానులోని ఓగు రాజ్యపు పట్టణాలను—స్వాధీనం చేసుకున్నాం.
