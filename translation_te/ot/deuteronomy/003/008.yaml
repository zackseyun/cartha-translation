source:
  edition: WLC
  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: te
  text: ఆ సమయంలో యొర్దాను అవతల ఉన్న అమోరీయుల ఇద్దరు రాజుల చేతిలోనుండి అర్నోను వాగు[a] నుండి హెర్మోను పర్వతం వరకు ఉన్న భూభాగాన్ని మేము స్వాధీనం చేసుకున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అర్నోను లోయ’; లేదా ‘అర్నోను వాగు ప్రవాహపథం.’ హీబ్రూ నఖల్ అనే పదం వాగు, ప్రవాహపథం లేదా లోయను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: మనం స్వాధీనం చేసుకున్నాం
  rationale: לקח అనే క్రియ ఇక్కడ భూభాగాన్ని తమ అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘స్వాధీనం చేసుకున్నాం’ అనేది యుద్ధభావాన్ని అనవసరంగా పెంచకుండా సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: ఇది ప్రామాణిక కాలసూచక పదబంధం; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ אֶרֶץ నిర్దిష్టమైన భూభాగాన్ని సూచిస్తుంది. ‘దేశం’ ఆ ప్రాంతీయ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హీబ్రూ మూలంలోని ‘చేతి నుండి’ అనే అధికారం లేదా ఆధీనాన్ని సూచించే రూపకాన్ని నిలుపుతుంది; తెలుగులోనూ అర్థమయ్యే ప్రయోగమే.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: అమోరీయుల ఇద్దరు రాజులు
  rationale: హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ, వారు అమోరీయుల రాజులని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల ఉన్న
  rationale: భౌగోళిక దృష్టికోణాన్ని వివరణతో పరిష్కరించకుండా ‘అవతల’ అనే సాపేక్ష భావంతో నిలుపుతుంది.
- source_word: מִנַּחַל אַרְנֹן
  choice: అర్నోను వాగులోయ నుండి
  rationale: נחל అనేది కాలానుగుణంగా నీరు ప్రవహించే వాగు, దాని ప్రవాహపథం లేదా లోయను సూచించగలదు. ‘వాగులోయ’ ఈ భౌగోళిక విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עַד הַר חֶרְמוֹן
  choice: హెర్మోను పర్వతం వరకు
  rationale: עַד సూచించే సరిహద్దు లేదా విస్తృతి భావాన్ని ‘వరకు’ స్పష్టంగా తెలియజేస్తుంది.
