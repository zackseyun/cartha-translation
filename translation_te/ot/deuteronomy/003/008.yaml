  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చేతిలోనుండి’ అనే హీబ్రూ రూపకం నిలుపబడింది; נחל లోని భౌగోళిక సందిగ్ధతను ప్రధాన పాఠ్యంలో ‘వాగులోయ’తో, పాదసూచికలో ప్రత్యామ్నాయాలతో భద్రపరచాం.
