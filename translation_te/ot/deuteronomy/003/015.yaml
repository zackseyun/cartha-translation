  text: And to Machir I gave Gilead[a].
translation:
  language: te
  text: మరియు మాకీరుకు గిలాదును ఇచ్చాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: మాకీరుకు
  rationale: לְ ఉపసర్గ దానిని పొందిన వ్యక్తిని సూచిస్తుంది; మָכִיר అనే వ్యక్తిపేరును తెలుగులో ‘మాకీరు’గా లిప్యంతరీకరించి, విభక్తితో ‘మాకీరుకు’ అని ఇచ్చాం. వాక్యారంభంలోని וּ సందర్భానుసార సంధానకారకం; తెలుగులో ఈ సంక్షిప్త పంపిణీ వాక్యంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోవడం సహజం.
- source_word: נָתַתִּי
  choice: ఇచ్చాను
  rationale: נתן ధాతువు Qal perfect మొదటి పురుష ఏకవచనం; గతంలో చేసిన భూవిభజనను జ్ఞాపకం చేసుకునే సందర్భంలో ‘ఇచ్చాను’ ప్రత్యక్షమైన, సహజమైన సమానం.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక—విడిగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ కణం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: הַגִּלְעָד
  choice: గిలాదును
  rationale: గిలాదు స్థలనామం. హెబ్రీలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో స్థలనామానికి ప్రత్యేక నిర్దిష్ట ఉపపదం సహజం కాదు; ప్రత్యక్ష కర్మను ‘-ను’తో చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా, మూలంలోని భూవిభజన ప్రకటనను నేరుగా అందించాం. సందర్భ సంబంధాన్ని తెలుగులో సహజమైన వాక్యప్రవాహానికి వదిలి, అనవసరమైన ‘మరియు’ను చేర్చలేదు.
