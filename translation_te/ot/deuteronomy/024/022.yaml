  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: te
  text: నీవు ఐగుప్తు దేశంలో బానిసగా ఉన్నావని జ్ఞాపకం ఉంచుకో; అందుకే ఈ విషయాన్ని చేయమని నేను నీకు ఆజ్ఞాపిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ ఆజ్ఞను పాటించమని’ లేదా ‘ఈ విషయాన్ని ఆచరించమని.’ హీబ్రూ పదబంధం ముందున్న ఆదేశాన్ని—అవసరంలో ఉన్నవారి కోసం పంటలో కొంత మిగిల్చిపెట్టాలనే నిర్దేశాన్ని—సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: జ్ఞాపకం ఉంచుకో
  rationale: చట్టపరమైన ఈ సందర్భంలో సంయోజకాక్షరంతో కూడిన సంపూర్ణ క్రియ ఆజ్ఞాత్మకమైన ప్రబోధంగా పనిచేస్తుంది. ఆధునిక తెలుగులో ‘జ్ఞాపకం ఉంచుకో’ ఆ ఆజ్ఞా బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇది కారణాన్ని కాక, జ్ఞాపకం ఉంచుకోవలసిన విషయాన్ని పరిచయం చేస్తోంది; అందువల్ల ‘అని’ సరైన తెలుగు అనుసంధానం.
- source_word: עֶבֶד
  choice: బానిసగా
  rationale: ఐగుప్తు సందర్భంలో עֶבֶד సాధారణ సేవకత్వాన్ని కాక బానిసత్వాన్ని సూచిస్తుంది.
- source_word: הָיִיתָ
  choice: ఉన్నావు
  rationale: עֶבֶדతో కూడిన היה క్రియకు ఇది సహజమైన భూతకాల తెలుగు రూపం.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: ‘దేశం’ అనే మూలపాఠంలోని స్పష్టమైన పదాన్ని నిలుపుతూ, గౌరవప్రదమైన బైబిలు తెలుగు వాడుకను అనుసరిస్తుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: గత బానిసత్వానికీ ప్రస్తుత ఆజ్ఞకూ మధ్య ఉన్న తార్కిక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామాన్ని నిలుపుతుంది; వాక్య నిర్మాణమే తగినంత ఉద్ఘాటనను ఇస్తుంది.
- source_word: מְצַוְּךָ
  choice: నీకు ఆజ్ఞాపిస్తున్నాను
  rationale: వర్తమాన/కొనసాగుతున్న అధికారపూర్వక ఆజ్ఞ భావాన్ని క్రియారూపం తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: పాటించమని
  rationale: తెలుగులో ఆజ్ఞకు సంబంధించి ‘చేయమని’ కంటే ‘పాటించమని’ సహజం; అయినా ఇది ఆ ఆదేశాన్ని కార్యరూపంలో పెట్టే విస్తృత భావాన్నే సూచిస్తుంది.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ఈ ఆజ్ఞను
  rationale: דָּבָר విస్తృతంగా ‘విషయం/మాట’ అయినప్పటికీ, ఇక్కడ ముందున్న నిర్దేశాన్ని సూచిస్తోంది. తెలుగులో ‘ఈ విషయాన్ని చేయమని’ అసహజంగా ఉండటంతో ప్రధాన పాఠంలో ‘ఈ ఆజ్ఞను పాటించమని’ వాడి, విస్తృత పదార్థాన్ని పాదసూచికలో నిలిపాం.
