lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: మునుపటి వచనంలోని ఆజ్ఞకు షరతుతో కూడిన కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ עָנִי הוּא
  choice: అతడు పేదవాడైతే
  rationale: ఆర్థికంగా బలహీనుడైన పురుషుణ్ణి సూచించే హెబ్రీ ఏకవచన పుంలింగ భావాన్ని, הוּא ఇచ్చే స్వల్ప ఉద్ఘాటనతో సహా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא תִשְׁכַּב
  choice: నీవు నిద్రపోకూడదు
  rationale: శబ్దార్థమైన ‘పడుకోవడం/నిద్రపోవడం’ అనే భావాన్ని నిలుపుతూ, కుదువ వస్తువును రాత్రంతా తన వద్ద ఉంచుకోకూడదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: בַּעֲבֹטוֹ
  choice: అతడు కుదువగా పెట్టిన వస్తువును ఉంచుకొని
  rationale: עֲבוֹט రుణానికి భద్రతగా ఇచ్చిన వస్తువును సూచిస్తుంది; בְּ ఇక్కడ ఆ వస్తువు తన ఆధీనంలో ఉండగానే రాత్రి గడపడాన్ని సూచిస్తుంది. ‘కుదువగా పెట్టిన వస్తువు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
