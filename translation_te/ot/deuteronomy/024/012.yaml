  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: te
  text: అతడు పేదవాడైతే, అతడు తాకట్టుగా ఇచ్చిన వస్తువును నీ దగ్గర ఉంచుకొని నీవు నిద్రపోకూడదు.[a]
