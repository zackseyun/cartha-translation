  text: and she leaves his house and goes and becomes another man's wife,[a]
translation:
  language: te
  text: ఆమె అతని ఇంటి నుంచి బయటికి వెళ్లి, తన దారిన వెళ్లి, మరొక పురుషునికి భార్య అయితే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మరొక పురుషునికి అయితే.’ ఇక్కడి హీబ్రూ ప్రయోగం ఆమె మరొక పురుషునితో వివాహ సంబంధంలోకి ప్రవేశించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: ఆమె అతని ఇంటి నుంచి వెళ్లిపోయి
  rationale: יצא అంటే ‘బయటికి వెళ్లడం/విడిచి వెళ్లడం.’ מן‌తో కూడిన ‘అతని ఇంటి నుంచి’ అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: וְהָלְכָה
  choice: వెళ్లిపోయి
  rationale: הלך ఇక్కడ ఇంటి నుంచి బయలుదేరిన తరువాతి కదలికను సూచిస్తుంది. తెలుగులో ముందున్న క్రియతో సహజంగా కలిపి, అనవసరమైన ‘నడిచి’ అనే విధార్థాన్ని చేర్చకుండా ‘వెళ్లిపోయి’గా అనువదించబడింది.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: మరొక పురుషునికి భార్య అయితే
  rationale: అక్షరార్థంగా ‘మరొక పురుషునికి అయి’ అని ఉన్నా, ఈ సందర్భంలో היה ל అనే నిర్మాణం కొత్త వివాహ సంబంధంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ‘భార్య’ను స్పష్టీకరించడం తెలుగులో భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לְאִישׁ אַחֵר వివాహ సంబంధాన్ని ఎంత స్పష్టంగా వ్యక్తం చేయాలి
  choice: మరొక పురుషునికి భార్య అయితే
  alternative: మరొక పురుషునికి అయితే
  rationale: ద్వితీయోపదేశకాండము 24:1–4లోని విడాకులు–పునర్వివాహ సందర్భం వివాహ సంబంధాన్ని సూచిస్తుంది; ‘భార్య’ అనే పదం మూలంలోని సందర్భబద్ధమైన సంబంధార్థాన్ని స్పష్టం చేస్తుంది, కొత్త సిద్ధాంత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి వాక్యక్రమానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ఈ వచనం ముందరి షరతులతో కొనసాగే ఉపవాక్యం కాబట్టి ముగింపులో కామా ఉంచబడింది.
