base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: te
  text: చర్మవ్యాధి లక్షణం విషయంలో జాగ్రత్తగా ఉండండి.[a] లేవీయ యాజకులు మీకు బోధించే ప్రతిదానిని ఎంతో జాగ్రత్తగా పాటించి, దాని ప్రకారం చేయండి. నేను వారికి ఆజ్ఞాపించినట్లే, మీరు కూడా ఆచరించడంలో జాగ్రత్తగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా ‘కుష్ఠు వ్యాధి’ అని అనువదించారు. ఇక్కడి హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధిని మాత్రమే కాక, ధర్మశాస్త్రంలో చెప్పబడిన వివిధ చర్మస్థితులను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: జాగ్రత్తగా ఉండండి
  rationale: నిఫాల్ ఆజ్ఞార్థక రూపం హెచ్చరికతో కూడిన ప్రబోధాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు ప్రయోగం ఆ ఆజ్ఞా బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: చర్మవ్యాధి లక్షణం కనిపించినప్పుడు
  rationale: נֶגַע అనేది దెబ్బ, మచ్చ, లక్షణం లేదా వ్యాధి ప్రభావాన్ని సూచించగలదు; צָרַעַת తోరాలో ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతమైన చర్మస్థితులను సూచిస్తుంది. సందర్భానుకూలంగా ‘కనిపించినప్పుడు’ అని వ్యక్తీకరించడం సహజమైన తెలుగు.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: ఎంతో జాగ్రత్తగా పాటించి ... చేయండి
  rationale: מְאֹד యొక్క బలాన్ని ‘ఎంతో’ నిలుపుతుంది; שׁמר మరియు עשׂה అనే శ్రద్ధగా పాటించడం, ఆచరణలో పెట్టడం అనే రెండు భావాలనూ ఉంచుతుంది.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: మీకు బోధించే ప్రతిదాన్ని ... దాని ప్రకారం
  rationale: ירה హిఫిల్ రూపం ఇక్కడ యాజక సంబంధమైన ఉపదేశం లేదా నిర్దేశాన్ని సూచిస్తుంది. ‘బోధించే’ అనేది రెండింటినీ సహజంగా కలిగిన సాధారణ తెలుగు పదం.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయ యాజకులు
  rationale: ద్వితీయోపదేశకాండంలో ఇది లేవి గోత్రానికి చెందిన యాజకులను సూచించే స్థిరమైన పదబంధం; రెండు వేర్వేరు వర్గాలుగా విడగొట్టలేదు.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: నేను వారికి ఆజ్ఞాపించినట్లే
  rationale: మొదటి పురుష ఏకవచన క్రియకు ఉన్న మూడవ పురుష బహువచన ప్రత్యయం యాజకులను సూచిస్తుంది; పోలికను ‘అట్లే’ స్పష్టంగా నిలుపుతుంది.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: మీరు జాగ్రత్తగా చేయాలి
  rationale: శ్రద్ధతో ఆచరించాలనే పునరుక్త ప్రబోధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: צָרַעַת పదానికి అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠు వ్యాధి
  rationale: తోరాలో ఈ పదం ఆధునిక హాన్సెన్ వ్యాధిని మాత్రమే కాక విస్తృతమైన చర్మస్థితులను సూచిస్తుంది. ‘కుష్ఠు వ్యాధి’ అని అనడం అనవసరమైన ఆధునిక వైద్య నిర్దిష్టతను రుద్దుతుంది.
- issue: הַכֹּהֲנִים הַלְוִיִּם పదబంధపు గుర్తింపు
  choice: లేవీయ యాజకులు
  alternative: యాజకులు, లేవీయులు
  rationale: ఈ పదబంధాన్ని ద్వితీయోపదేశకాండానికి ప్రత్యేకమైన, లేవి గోత్రానికి చెందిన యాజకులను సూచించే ఏకైక వర్గనామంగా తీసుకున్నాం; రెండు వేర్వేరు వర్గాలుగా కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞాత్మక శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని సహజమైన తెలుగు కోసం మూడు వాక్యాలుగా విభజించాం; జాగ్రత్త, పాటించడం, చేయడం అనే పునరుక్త భావాలను నిలిపాం.
