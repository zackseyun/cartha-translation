review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the Levitical priests and preserves the emphatic requirement to follow their instruction. However, “చర్మవ్యాధి లక్షణం కనిపించినప్పుడు” shifts the Hebrew from a warning concerning a skin affliction/mark to a strictly temporal condition (“when a symptom appears”). The final clause also weakens the repeated שׁמר + לעשות construction by saying merely “do carefully.”
  naturalness: The Telugu is generally clear and modern. Recasting the clauses as “...విషయంలో జాగ్రత్తగా ఉండండి” and “ఆచరించడంలో జాగ్రత్తగా ఉండాలి” is more idiomatic while retaining the source’s twofold warning.
  terminology: “లేవీయ యాజకులు” is appropriate. “చర్మవ్యాధి” is acceptable with a clarifying note, though the note should refer to a broader range of skin-related conditions rather than call them all diseases.
  issues:
  - severity: medium
    issue: The opening phrase is overly temporal and restrictive.
    rationale: בְּנֶגַע הַצָּרַעַת means concerning/in a case of a skin affliction or mark; “లక్షణం కనిపించినప్పుడు” adds the idea of appearance and narrows נגע to a symptom.
  - severity: medium
    issue: The concluding exhortation does not fully express the repeated ‘be careful to do.’
    rationale: తִּשְׁמְרוּ לַעֲשׂוֹת repeats the warning to take care in carrying out the instruction. “జాగ్రత్తగా చేయాలి” is understandable but less explicitly preserves the guarding/careful-observance component.
  - severity: low
    issue: The footnote calls the whole semantic range ‘skin diseases.’
    rationale: The Hebrew term in Torah encompasses a range of ritual skin-related conditions; “చర్మస్థితులు” better avoids an unnecessarily medical classification.
  revised_text: చర్మవ్యాధి లక్షణం విషయంలో జాగ్రత్తగా ఉండండి.[a] లేవీయ యాజకులు మీకు బోధించే ప్రతిదానిని ఎంతో జాగ్రత్తగా పాటించి, దాని ప్రకారం చేయండి. నేను వారికి ఆజ్ఞాపించినట్లే, మీరు కూడా ఆచరించడంలో జాగ్రత్తగా ఉండాలి.
  revised_footnotes:
