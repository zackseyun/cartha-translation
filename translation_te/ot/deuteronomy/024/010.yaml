id: DEU.24.10
reference: Deuteronomy 24:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תַשֶּׁ֥ה בְ/רֵֽעֲ/ךָ מַשַּׁ֣את מְא֑וּמָה לֹא תָבֹ֥א אֶל בֵּית֖/וֹ לַ/עֲבֹ֥ט עֲבֹטֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: te
  text: నీవు నీ పొరుగువానికి ఏదైనా అప్పుగా ఇచ్చినప్పుడు[a], అతని తాకట్టు వస్తువును తీసుకోవడానికి అతని ఇంట్లోకి వెళ్లకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నీ పొరుగువానికి ఏదైనా అప్పుగా ఇస్తే, అతడు తాకట్టుగా పెట్టినదాన్ని తీసుకోవడానికి అతని ఇంట్లోకి ప్రవేశించకూడదు.”
    reason: כִּי అనే పదాన్ని షరతుగా ‘ఇస్తే’ అని కూడా అనువదించవచ్చు; עֲבֹטוֹను ‘అతడు తాకట్టుగా పెట్టినది’ అని విపులంగా చెప్పవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఇచ్చినప్పుడు
  rationale: ఇక్కడ ఈ పదం నియమంలోని ఒక సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగు న్యాయబోధలో ‘ఇచ్చినప్పుడు’ సహజంగా ఉంది; ‘ఇస్తే’ కూడా సాధ్యమే.
- source_word: תַשֶּׁה
  choice: అప్పుగా ఇచ్చినప్పుడు
  rationale: ఈ హిఫిల్ రూపం అప్పు ఇవ్వడం లేదా రుణం కల్పించడం అనే భావాన్ని ఇస్తుంది. తరువాతి నామవాచకంతో కలిసిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְרֵעֲךָ
  choice: నీ పొరుగువానికి
  rationale: רֵעַ సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది. ‘పొరుగువాడు’ వ్యక్తుల మధ్య సంబంధాన్ని స్పష్టంగా, సాధారణ పాఠకునికి సులభంగా తెలియజేస్తుంది.
- source_word: מַשַּׁאת מְאוּמָה
  choice: ఏదైనా అప్పుగా
  rationale: మొదటి పదం అప్పు లేదా రుణాన్ని, రెండవది ‘ఏదైనా’ అనే విస్తృత భావాన్ని ఇస్తుంది. రెండింటినీ తెలుగులో సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: అతని ఇంట్లోకి వెళ్లకూడదు
  rationale: న్యాయ సందర్భంలో לֹא తోనున్న క్రియ నిషేధాన్ని తెలియజేస్తుంది. ‘వెళ్లకూడదు’ ఆధునిక తెలుగులో స్పష్టమైన నియమాత్మక రూపం.
- source_word: לַעֲבֹט
  choice: తీసుకోవడానికి
  rationale: ఈ సందర్భంలో అప్పుకు హామీగా ఉంచే వస్తువును తీసుకోవడాన్ని సూచిస్తుంది. ‘స్వాధీనం చేసుకోవడం’ మూలంలో లేని బలవంతపు భావాన్ని పెంచవచ్చు.
- source_word: עֲבֹטוֹ
  choice: అతని కుదువ వస్తువును
  rationale: అప్పుకు హామీగా ఉంచిన నిర్దిష్ట వస్తువును సూచిస్తుంది. ‘కుదువ వస్తువు’ ఆధునిక సాధారణ పాఠకునికి ‘కుదువ’ మాత్రమే అన్నదానికంటే స్పష్టంగా ఉంటుంది.
