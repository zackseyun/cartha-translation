  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర నియమానికి తగిన గౌరవప్రదమైన నిషేధాత్మక శైలి వాడబడింది. మూలంలోని సందర్భార్థక/షరతార్థక అనిశ్చితి పాదటిప్పణిలో నిలుపబడింది.
