source:
  edition: WLC
  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: te
  text: మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు మార్గంలో నీ దేవుడైన యాహ్వే మిర్యాముకు ఏమి చేశాడో గుర్తుంచుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది ఇశ్రాయేలీయులు ఐగుప్తు నుండి బయలుదేరిన తర్వాత చేసిన ప్రయాణంలో జరిగిన సంఘటనను సూచిస్తుంది; సంఖ్యాకాండము 12:1–15 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: జ్ఞాపకం ఉంచుకోండి
  rationale: זכר అనే క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం. ఆధునిక తెలుగులో సహజంగా ఉండడంతోపాటు, గతంలో దేవుడు చేసిన కార్యాన్ని మనస్సులో నిలుపుకోవాలనే ఆజ్ఞాబలాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ఏమి చేశాడో
  rationale: కర్మసూచక అవ్యయం, సంబంధవాచకం, עשה క్రియ కలిసి జ్ఞాపకం ఉంచుకోవలసిన విషయాన్ని పరిచయం చేస్తున్నాయి. ‘ఏమి చేశాడో’ మూలంలోని విస్తృత భావాన్ని అలాగే ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించింది.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుడైన
  rationale: రూపపరంగా రెండవ పురుష ఏకవచన ప్రత్యయమున్న ‘నీ దేవుడు’. తెలుగు బైబిలు సంభాషణలో గౌరవార్థక ఏకవచనంగా ‘మీ’ సహజంగా ఉంటుంది; ‘దేవుడైన యెహోవా’ నిర్మాణం సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִרְיָם
  choice: మిర్యాముకు
  rationale: לְ ఉపసర్గ ఇక్కడ ఆ చర్యకు గురైన వ్యక్తిని సూచిస్తుంది. ‘మిర్యాముకు’ అనే రూపం ‘ఆమెకు ఏమి చేశాడు’ అనే మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: అక్షరార్థంగా ‘దారిలో/మార్గంలో’. ప్రయాణ సందర్భంలో ‘దారిలో’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: మీరు ఐగుప్తు నుండి బయలుదేరి వస్తున్నప్పుడు
  rationale: కాలార్థక క్రియానామ నిర్మాణానికి ‘బయలుదేరి వస్తున్నప్పుడు’ సరిపోతుంది. బహువచన ప్రత్యయం సమూహమైన ఇశ్రాయేలును ఉద్దేశిస్తుంది; తెలుగులో ‘మీరు’ దీనిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంలో ఉంచాం. తెలుగులో స్థిరమైన, సాధారణ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించే ప్రత్యామ్నాయ రూపం.
- issue: మిర్యాముకు దేవుడు చేసిన కార్యం ఎంతవరకు స్పష్టీకరించాలి
  choice: ఏమి చేశాడో
  alternative: ఆమెను కుష్ఠుతో బాధించిన సంగతిని
  rationale: ఈ వాక్యం స్వయంగా చర్యను వివరించకుండా జ్ఞాపకం చేయమంటుంది. సంఖ్యాకాండము 12 సందర్భాన్ని ప్రధాన పాఠ్యంలో చేరిస్తే మూలంలోని సంక్షిప్తత, సూచనాత్మకత పోతాయి; అందువల్ల వివరణను పాదటిప్పణిలో మాత్రమే ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ ప్రధాన వాక్యం వ్యాకరణపరంగా ఏకవచన సంబోధనతో మొదలై, బయలుదేరిన సమూహాన్ని బహువచనంగా సూచిస్తుంది; తెలుగులో ‘మీ/మీరు’ రూపాలు రెండింటికీ సహజంగా సరిపోతాయి. మూలంలోని పదక్రమం కంటే సహజ తెలుగు వాక్యక్రమానికి ప్రాధాన్యం ఇచ్చినా, అర్థాంశాలన్నీ నిలుపుకున్నాం.
