- from: పేదవాడూ అవసరంలో ఉన్నవాడూ అయిన కూలివాణ్ణి దోపిడీ చేయకూడదు[a]. అతడు నీ సహోదరుల్లో ఒకడైనా, నీ దేశంలో నీ పట్టణాల పరిధిలో నివసించే పరదేశుల్లో ఒకడైనా సరే[b].
  to: పేదవాడూ అవసరంలో ఉన్నవాడూ అయిన కూలివాడిని దోపిడీ చేయవద్దు[a]. అతడు నీ సహోదరుల్లో ఒకడైనా, లేదా నీ దేశంలో, నీ పట్టణాల పరిధిలో నివసించే పరదేశి అయినా సరే[b].
