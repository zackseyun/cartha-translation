review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition against economically exploiting a hired worker who is poor and needy, and it retains the alternative categories of fellow kin and resident outsider. However, “నీ పరదేశుల్లో ఒకడు” is not idiomatic Telugu for a resident foreigner and can be misunderstood. The revised wording makes the resident sense explicit without importing a modern legal category.
  naturalness: “కూలివాణ్ణి” is understandable but colloquial and contracted for this formal legal register. “కూలివాడిని” is standard and smoother. The imperative “చేయవద్దు” directly reflects the Hebrew second-person prohibition.
  terminology: “దోపిడీ చేయడం” appropriately represents עשק in this economic setting; the footnote preserves ‘అణచివేయడం’ and ‘మోసం చేయడం’ as alternatives. “సహోదరుడు” retains the source kinship term, and “పరదేశి” is retained while the text clarifies that this person lives in the land and town jurisdiction.
  issues:
  - severity: medium
    issue: “నీ పరదేశుల్లో ఒకడు” is awkward and potentially misleading.
    rationale: The Hebrew גֵּרְךָ refers to a resident outsider associated with the addressee’s community, not to someone among the addressee’s ‘foreigners.’ “నీ దేశంలో, నీ పట్టణాల పరిధిలో నివసించే పరదేశి” naturally expresses the intended social location.
  - severity: low
    issue: Register and morphology in “కూలివాణ్ణి ... చేయకూడదు.”
    rationale: For modern standard Telugu in a formal legal injunction, “కూలివాడిని ... చేయవద్దు” is more natural and directly addresses the singular addressee, as does the Hebrew.
  revised_text: పేదవాడూ అవసరంలో ఉన్నవాడూ అయిన కూలివాడిని దోపిడీ చేయవద్దు[a]. అతడు నీ సహోదరుల్లో ఒకడైనా, లేదా నీ దేశంలో, నీ పట్టణాల పరిధిలో నివసించే పరదేశి అయినా సరే[b].
