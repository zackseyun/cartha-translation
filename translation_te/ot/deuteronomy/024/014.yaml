source:
  edition: WLC
  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: te
  text: పేదవాడూ అవసరంలో ఉన్నవాడూ అయిన కూలివాడిని దోపిడీ చేయవద్దు[a]. అతడు నీ సహోదరుల్లో ఒకడైనా, లేదా నీ దేశంలో, నీ పట్టణాల పరిధిలో నివసించే పరదేశి అయినా సరే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దోపిడీ చేయడం’ అనే హీబ్రూ క్రియకు ‘అణచివేయడం,’ ‘మోసం చేయడం’ అనే భావాలు కూడా ఉన్నాయి; ఇక్కడ అది కూలివాడికి ఆర్థికంగా అన్యాయం చేయడాన్ని కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ పట్టణాల పరిధిలో’ అని అనువదించిన హీబ్రూ మాట అక్షరార్థంగా ‘నీ గుమ్మాల్లో.’ అది నీ పట్టణాల్లో లేదా నీ స్థానిక సమాజాధికార పరిధిలో జీవించడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: దోపిడీ చేయకూడదు
  rationale: עָשַׁק అణచివేతతో పాటు, ముఖ్యంగా ఈ కూలి సందర్భంలో ఆర్థిక దోపిడీ లేదా రావలసిన దానిని అన్యాయంగా నిలిపివేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దోపిడీ చేయడం’ ఈ నైతిక, ఆర్థిక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׂכִיר
  choice: కూలివాడు
  rationale: ఈ నామవాచకం వేతనం కోసం నియమించబడిన పనివాణ్ణి సూచిస్తుంది. ‘కూలివాడు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, సందర్భంలోని రోజువారీ వేతనాధారిత అస్థిరతను కూడా సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עָנִי וְאֶבְיוֹן
  choice: పేదవాడూ అవసరంలో ఉన్నవాడూ
  rationale: మూలంలోని రెండు పదాలను నిలిపి, ఆర్థిక పేదరికం మరియు తీవ్రమైన అవసరం అనే పరస్పరం బలపరిచే భావాలను వేర్వేరుగా వ్యక్తం చేస్తుంది.
- source_word: מֵאַחֶיךָ
  choice: నీ సహోదరుల్లో ఒకడు
  rationale: అక్షరార్థమైన బంధుత్వ భాషను నిలుపుతూ, ద్వితీయోపదేశకాండంలోని ఒడంబడిక సమాజానికి చెందిన తోటి ఇశ్రాయేలీయుణ్ణి సూచిస్తుంది.
- source_word: מִגֵּרְךָ
  choice: నీ పరదేశుల్లో ఒకడు
  rationale: גֵּר స్థానికుడు కాకపోయినా సమాజంలో స్థిరంగా నివసించే రక్షణకు పాత్రుడైన వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ ఆధునిక న్యాయపరమైన వలస వర్గాలను మూలంలోకి చొప్పించకుండా ఈ సామాజిక భేదాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: నీ దేశంలో నివసించే
  rationale: ఏకవచన సంబంధవాక్య భావాన్ని పరదేశికి అనుసంధానించి, అతడు ఇశ్రాయేలు భూభాగంలో నివసిస్తున్నాడని స్పష్టంగా తెలుపుతుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల పరిధిలో
  rationale: ‘నీ గుమ్మాల్లో’ అనే హీబ్రూ నుడికారం పట్టణాలు లేదా స్థానిక సమాజాధికార పరిధిని సూచిస్తుంది. తెలుగులో భావాన్ని సహజంగా తెలియజేస్తూ, మూల రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ఒడంబడిక ధర్మశాస్త్రంలో אַחֶיךָ అనే బంధుత్వ పదం
  choice: నీ సహోదరుల్లో ఒకడు
  alternative: నీ తోటి ఇశ్రాయేలీయుల్లో ఒకడు
  rationale: మూలంలోని పురుష ఏకవచన బంధుత్వ రూపాన్ని నిలుపుతుంది; అదే సమయంలో ఈ సందర్భంలో అది ఒడంబడిక సమాజంలోని తోటి సభ్యుణ్ణి సూచిస్తుంది.
- issue: גֵּר అనే సామాజిక వర్గం
  choice: పరదేశి
  alternative: నివాస పరదేశి
  rationale: ఈ పదం ఇశ్రాయేలు మధ్య నివసించే, స్థానిక వంశానికి చెందని రక్షిత నివాసిని సూచిస్తుంది. ‘పరదేశి’ ఆధునిక పౌరసత్వ లేదా వలసచట్ట వర్గాలను అనవసరంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘కూలివాడు,’ ‘దోపిడీ చేయడం,’ ‘పట్టణాల పరిధి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకుని, హీబ్రూ సామాజిక వర్గాలు మరియు బంధుత్వ భాషను వీలైనంతగా నిలిపాం.
