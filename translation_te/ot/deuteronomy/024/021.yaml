source:
  edition: WLC
  text: כִּ֤י תִבְצֹר֙ כַּרְמְ/ךָ֔ לֹ֥א תְעוֹלֵ֖ל אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: te
  text: నీ ద్రాక్షతోటలో ద్రాక్షపండ్లను కోసేటప్పుడు, నీవు కోసిన తర్వాత మిగిలినవాటిని మళ్లీ ఏరుకోకూడదు[a]. అవి పరదేశికి[b], తండ్రిలేనివానికి[c], విధవరాలికి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: ‘దాని వెనుక మళ్లీ ఏరుకోకూడదు’ లేదా ‘దాన్ని రెండోసారి ఏరుకోకూడదు.’ హీబ్రూ క్రియ మొదటిసారి కోసిన తర్వాత మిగిలిన ద్రాక్షను తిరిగి వెళ్లి సేకరించడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: ‘పరదేశి’ అంటే ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతరుడు; మరొక విధంగా, ‘వారి మధ్య నివసించే విదేశీయుడు.’
    reason: cultural_note
  - marker: c
    text: 'మరొక విధంగా: ‘అనాథకు.’ హీబ్రూ పదం అనేక సందర్భాల్లో అక్షరార్థంగా ‘తండ్రిలేనివాడు’ అని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కోసేటప్పుడు
  rationale: ఈ న్యాయనియమంలో כִּי సాధారణంగా ఎదురయ్యే సందర్భాన్ని పరిచయం చేస్తుంది. అందువల్ల షరతును సూచించే ‘ఒకవేళ’ కంటే ‘ఎప్పుడు/…టప్పుడు’ భావం సహజంగా సరిపోతుంది.
- source_word: תִבְצֹר
  choice: ద్రాక్షపండ్లను కోసేటప్పుడు
  rationale: בצר ప్రత్యేకంగా ద్రాక్షతోటలో ద్రాక్షపండ్లను సేకరించడాన్ని సూచిస్తుంది. తెలుగులో ‘ద్రాక్షపండ్లను కోయడం’ సహజమైన వ్యవసాయ వాడుక.
- source_word: כַּרְמְךָ
  choice: నీ ద్రాక్షతోటలో
  rationale: כֶּרֶםకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం ‘ద్రాక్షతోట’.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: నీవు కోసిన తర్వాత మిగిలినవాటిని మళ్లీ ఏరుకోకూడదు
  rationale: ఈ వ్యవసాయ సందర్భంలో עולל మొదటి కోత తరువాత మిగిలిన ద్రాక్షను రెండోసారి వెళ్లి ఏరుకోవడాన్ని సూచిస్తుంది. ‘మిగిలినవాటిని మళ్లీ ఏరుకోవడం’ అనే రూపం ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; אַחֲרֶיךָలోని ‘నీ తర్వాత’ భావాన్ని ‘నీవు కోసిన తర్వాత’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַגֵּר
  choice: పరదేశికి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో నివసిస్తున్న స్థానికేతర వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ సంక్షిప్తమైన సాంప్రదాయ తెలుగు పదం; దాని సామాజిక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: לַיָּתוֹם
  choice: తండ్రిలేనివానికి
  rationale: יָתוֹם అనేక సందర్భాల్లో ప్రత్యేకంగా తండ్రిని కోల్పోయిన, రక్షణలేని వ్యక్తిని సూచిస్తుంది. ‘తండ్రిలేనివానికి’ మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- source_word: וְלָאַלְמָנָה
  choice: విధవరాలికి
  rationale: אַלְמָנָהకు నేరమైన, సహజమైన తెలుగు సమానార్థకం ‘విధవరాలు’.
- source_word: יִהְיֶה
  choice: అవి ... ఉండాలి
  rationale: మిగిలిన ద్రాక్ష ఈ బలహీన వర్గాల కోసం విడిచిపెట్టబడాలని తెలిపే న్యాయపరమైన భావాన్ని తెలుగులో ‘వారికి ఉండాలి’ సహజంగా వ్యక్తం చేస్తుంది.
