translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. రెండోసారి ఏరుకోవద్దనే వ్యవసాయ భావం స్పష్టంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న ‘మిగిలినవాటిని’ వ్యక్తీకరించబడింది. ‘పరదేశి’ మరియు ‘తండ్రిలేనివాడు’ అనే ఒడంబడిక-న్యాయ పదాల ప్రత్యేకతను పాదసూచికలతో నిలుపుకున్నాం.
