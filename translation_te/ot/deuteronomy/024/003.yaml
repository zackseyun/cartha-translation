id: DEU.24.3
reference: Deuteronomy 24:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׂנֵאָ/הּ֮ הָ/אִ֣ישׁ הָ/אַחֲרוֹן֒ וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּית֑/וֹ א֣וֹ כִ֤י יָמוּת֙ הָ/אִ֣ישׁ הָ/אַחֲר֔וֹן אֲשֶׁר לְקָחָ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: te
  text: ఆ తరువాతి పురుషుడు ఆమెను ద్వేషించి[a], ఆమెకు విడాకుల పత్రం[b] రాసి, దాన్ని ఆమె చేతికి ఇచ్చి, తన ఇంటి నుండి ఆమెను పంపివేస్తే, లేదా ఆమెను తనకు భార్యగా తీసుకున్న[c] ఆ తరువాతి పురుషుడు చనిపోతే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను ద్వేషించడం మొదలుపెట్టి.” ఇక్కడి హీబ్రూ క్రియను న్యాయపరమైన సంఘటనల వరుసలో సాధారణ చర్యగా అనువదించవచ్చు; ఆ తరువాతి పురుషుడు ఆమె పట్ల విరోధ భావం పెంచుకొని విడాకులు ఇవ్వడానికి పూనుకోవడం సందర్భంలోని భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తెగతెంపుల పత్రం.” ఇది వివాహ బంధాన్ని రద్దు చేసే అధికారిక లిఖిత పత్రం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో, “ఆమెను తనకు భార్యగా తీసుకున్న”; అంటే, ఆమెను వివాహం చేసుకున్న.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: ఆమెను ద్వేషించి
  rationale: שׂנא అనే క్రియ యొక్క బలమైన ప్రాథమిక అర్థమైన ‘ద్వేషించు’ను నిలుపుతూ, కొనసాగుతున్న న్యాయపరమైన షరతుల వాక్యానికి సహజంగా అనుసంధానిస్తుంది.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: ఆ తరువాతి పురుషుడు
  rationale: אַחֲרוֹן లోని ‘తరువాతి/చివరి’ భావాన్ని, ముందటి భర్తతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది; మూలంలో లేని ‘భర్త’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: ఆమెకు విడాకుల పత్రం రాసి
  rationale: సֵפֶר כְּרִיתֻת వివాహ బంధాన్ని అధికారికంగా రద్దు చేసే లిఖిత పత్రాన్ని సూచిస్తుంది; ‘విడాకుల పత్రం’ ఆధునిక తెలుగులో స్పష్టమైన న్యాయపరమైన పదబంధం.
- source_word: וְנָתַן בְּיָדָהּ
  choice: దాన్ని ఆమె చేతికి ఇచ్చి
  rationale: పత్రాన్ని ఆమె చేతికి అప్పగించే నిర్దిష్ట విధానపరమైన చర్యను సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: తన ఇంటి నుండి ఆమెను పంపివేస్తే
  rationale: שׁלח యొక్క పంపివేయడం అనే భావాన్నీ, מִבֵּיתוֹ లోని ఇంటి నుండి అనే ప్రాదేశిక వివరాన్నీ నిలుపుతుంది.
- source_word: אוֹ כִי יָמוּת
  choice: లేదా ... చనిపోతే
  rationale: న్యాయపరమైన సందర్భంలోని ప్రత్యామ్నాయ షరతును తెలుగులో సహజంగా చూపుతుంది.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: ఆమెను తనకు భార్యగా తీసుకున్న
  rationale: לקח + ל + אשה అనే వివాహ సంబంధ హీబ్రూ నుడికారాన్ని పారదర్శకంగా నిలుపుతూ, తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలి ఉపయోగించబడింది. ఈ వచనం 24:1లో మొదలైన షరతుల వాక్యాన్ని కొనసాగిస్తున్నందున క్రియలకు ‘-తే’ నిర్మాణం ఉపయోగించి, తదుపరి వచనానికి కొనసాగింపును సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
