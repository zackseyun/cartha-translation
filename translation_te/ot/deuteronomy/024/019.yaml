revisions:
- from: నీ పొలంలో నీ పంటను కోస్తున్నప్పుడు, పొలంలో ఒక ధాన్యపు కట్టను మరచిపోతే, దాన్ని తీసుకోవడానికి తిరిగి వెళ్లకూడదు. అది పరదేశికి[a], తండ్రిలేనివానికి[b], విధవరాలికి చెందాలి. నీ దేవుడైన యాహ్వే నీ చేతుల పనులన్నిటిలో నిన్ను ఆశీర్వదించేందుకు అలా చేయాలి.
  to: నీ పొలంలో నీ పంటను కోస్తున్నప్పుడు, పొలంలో ఒక ధాన్యపు కట్టను మరచిపోతే, దాన్ని తీసుకోవడానికి తిరిగి వెళ్లకూడదు. అది పరదేశికి[a], తండ్రిలేనివానికి[b], విధవరాలికి ఉండాలి; తద్వారా నీ దేవుడైన యాహ్వే నీ చేతుల పనులన్నిటిలో నిన్ను ఆశీర్వదించునట్లు.
  rationale: చివరి ఉద్దేశ్య వాక్యాన్ని మూలంలోని לְמַעַן יְבָרֶכְךָకు అనుగుణంగా పునర్నిర్మించాం. దీనివల్ల మరచిపోయిన కట్ట బలహీన వర్గాల కోసం ఉంచబడటం మరియు యాహ్వే ఆశీర్వాదం మధ్యనున్న ఉద్దేశ్య సంబంధం స్పష్టమవుతుంది; మూలంలో లేని “అలా చేయాలి” తొలగించబడింది. పాదసూచిక aలో సామాజిక వర్గాన్ని లింగనిరపేక్షంగా వివరించాం.
