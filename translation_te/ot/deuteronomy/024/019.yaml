id: DEU.24.19
reference: Deuteronomy 24:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: te
  text: నీ పొలంలో నీ పంటను కోస్తున్నప్పుడు, పొలంలో ఒక ధాన్యపు కట్టను మరచిపోతే, దాన్ని తీసుకోవడానికి తిరిగి వెళ్లకూడదు. అది పరదేశికి[a], తండ్రిలేనివానికి[b], విధవరాలికి ఉండాలి; తద్వారా నీ దేవుడైన యాహ్వే నీ చేతుల పనులన్నిటిలో నిన్ను ఆశీర్వదించునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అనే హీబ్రూ పదం ఇశ్రాయేలు ప్రజల మధ్య నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. దీన్ని ‘వలస నివాసి,’ ‘విదేశీయుడు,’ లేదా ‘అపరిచితుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అనాథకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: నీ పంటను కోస్తున్నప్పుడు
  rationale: כִּי ఇక్కడ సందర్భాధారిత న్యాయనియమాన్ని పరిచయం చేస్తుంది; ‘కోస్తున్నప్పుడు’ సహజమైన తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది. תִקְצֹר, קְצִירְךָ పదాల వ్యవసాయ చిత్రణను ‘పంటను కోయడం’ నిలుపుతుంది.
- source_word: עֹמֶר
  choice: ఒక ధాన్యపు కట్ట
  rationale: ఇక్కడ ఈ పదం కొలమానాన్ని కాక, కోసి కట్టిన ధాన్యపు పనను సూచిస్తుంది. సాధారణ పాఠకులకు ‘ధాన్యపు కట్ట’ స్పష్టంగా ఉంటుంది.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: దాన్ని తీసుకోవడానికి తిరిగి వెళ్లకూడదు
  rationale: తిరిగి వెళ్లడం, దాన్ని తీసుకోవడం అనే రెండు భావాలనూ సహజమైన నిషేధ వాక్యంలో నిలుపుతుంది.
- source_word: לַגֵּר
  choice: పరదేశికి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన ‘పరదేశి’ని వాడి, దాని నివాసపరమైన న్యాయార్థాన్ని పాదసూచికలో వివరించాం.
- source_word: לַיָּתוֹם
  choice: తండ్రిలేనివానికి
  rationale: יָתוֹם సూచించే సామాజికంగా రక్షణలేని వర్గాన్ని సన్నిహితంగా ప్రతిబింబిస్తుంది; ‘అనాథ’ సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: יִהְיֶה
  choice: చెందాలి
  rationale: మరచిపోయిన కట్టను ఈ బలహీన వర్గాల కోసం ఉంచాలనే నిర్దేశాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; కఠినమైన ఆస్తి బదలాయింపు భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: నిన్ను ఆశీర్వదించేందుకు
  rationale: לְמַעַן యొక్క ఉద్దేశం లేదా ఆశించిన ఫలితం అనే సంబంధాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
- issue: גֵּר అనే సామాజిక-న్యాయ వర్గం
  choice: పరదేశి
  alternative: వలస నివాసి; విదేశీయుడు; అపరిచితుడు
  rationale: ఇది కేవలం దారినపోయే అపరిచితుణ్ణి కాక, ఇశ్రాయేలు మధ్య నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది. పాఠ్యాన్ని సులభంగా ఉంచుతూ పాదసూచికలో ఆ పరిమితిని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. మూలంలోని ఏకవచన సంబోధనను ‘నీ’ రూపాలతో నిలిపాం. ఆంగ్ల సంప్రదింపుపాఠ్యంలో పాదసూచిక గుర్తుల స్థానాలు వాటి పదాలకు సరిపోలకపోవడంతో, [a]ను ‘పరదేశి’ దగ్గర, [b]ను ‘తండ్రిలేనివాడు’ దగ్గర ఉంచాం.
