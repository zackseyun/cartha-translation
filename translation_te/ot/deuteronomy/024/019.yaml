    rationale: హీబ్రూ వాక్యం “అది ... కోసం ఉండాలి, తద్వారా యాహ్వే ... నిన్ను ఆశీర్వదించునట్లు” అని సాగుతుంది. “అలా చేయాలి” మూలంలో లేని ఆజ్ఞను జోడిస్తుంది మరియు ఆశీర్వదించేవాడు ఎవరో వాక్యనిర్మాణంలో అస్పష్టంగా చేస్తుంది.
