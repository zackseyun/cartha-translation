- from: ఆమెను పంపివేసిన మొదటి భర్త, ఆమె అపవిత్రపరచబడిన తరువాత[a], ఆమెను మళ్లీ తన భార్యగా చేసుకోవడానికి తీసుకోకూడదు. ఎందుకంటే అది యెహోవా సమక్షంలో హేయమైనది. మీ దేవుడైన యెహోవా మీకు వారసత్వంగా ఇస్తున్న దేశం మీదికి మీరు పాపాన్ని తీసుకురాకూడదు.
  to: ఆమెను పంపివేసిన ఆమె మొదటి భర్త, ఆమె అపవిత్రురాలైన తరువాత[a], తిరిగి ఆమెను తన భార్యగా తీసుకోకూడదు. ఎందుకంటే అది యెహోవా సమక్షంలో హేయమైనది. మీ దేవుడైన యెహోవా మీకు వారసత్వంగా ఇస్తున్న దేశం మీదికి మీరు పాపాన్ని తీసుకురాకూడదు.
  rationale: The revision improves Telugu idiom in the legal prohibition and uses a natural state expression for the disputed term ‘defiled,’ while retaining the source ambiguity through the footnote. No doctrinal explanation has been added, and the divine name, land-inheritance language, and land-guilt formulation are preserved.
