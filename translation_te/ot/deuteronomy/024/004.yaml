  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: te
  text: ఆమెను పంపివేసిన ఆమె మొదటి భర్త, ఆమె అపవిత్రురాలైన తరువాత[a], తిరిగి ఆమెను తన భార్యగా తీసుకోకూడదు. ఎందుకంటే అది యెహోవా సమక్షంలో హేయమైనది. మీ దేవుడైన యెహోవా మీకు వారసత్వంగా ఇస్తున్న దేశం మీదికి మీరు పాపాన్ని తీసుకురాకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె అపవిత్రపరచబడిన తరువాత’ లేదా ‘ఆమె అశుద్ధురాలైన తరువాత.’ హీబ్రూ వచనం ఆమె అపవిత్రత యొక్క ఖచ్చిత స్వభావాన్ని పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: ఆమెను పంపివేసిన మొదటి భర్త
  rationale: వైవాహిక సందర్భంలో בַּעַל అంటే ‘భర్త’; הָרִאשׁוֹן‌ను ‘మొదటి’గా నేరుగా ప్రతిబింబిస్తూ తరువాతి భర్తతో ఉన్న న్యాయపరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: שִׁלְּחָהּ
  choice: ఆమెను పంపివేసిన
  rationale: שׁלח యొక్క ప్రాథమిక భావం ‘పంపివేయడం.’ ఈ ధర్మశాస్త్ర సందర్భంలో అది విడాకులను సూచించినా, ‘పంపివేసిన’ అనే రూపం మూలంలోని అభివ్యక్తిని నిలుపుతుంది.
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: ఆమెను మళ్లీ తన భార్యగా చేసుకోవడానికి తీసుకోకూడదు
  rationale: లక్ష్యార్థక క్రియారూపాల వరుస తిరిగి తీసుకొని భార్యగా చేసుకోవడాన్ని సూచిస్తుంది; తెలుగు వాక్యం పునర్వివాహ నిషేధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: ఆమె అపవిత్రపరచబడిన తరువాత
  rationale: טמא యొక్క హోఫాల్ రూపం ఆమె అపవిత్రపరచబడిందనే నిష్క్రియార్థాన్ని ఇస్తుంది. అపవిత్రత స్వభావాన్ని నిర్ణయించకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: תוֹעֵבָה
  choice: హేయమైనది
  rationale: తోఏవా సూచించే బలమైన నైతిక-నిబంధనాత్మక అసహ్యతను ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘హేయమైనది’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సమక్షంలో
  rationale: ‘సమక్షంలో’ అనేది לפני యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజ తెలుగులో నిలుపుతుంది; יהוהను ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: దేశం మీదికి మీరు పాపాన్ని తీసుకురాకూడదు
  rationale: חטא హిఫీల్ రూపం దేశంపై పాపం లేదా అపరాధభారాన్ని కలిగించడాన్ని సూచిస్తుంది. ‘పాపాన్ని తీసుకురావడం’ మూలంలోని కారణార్థాన్ని, సమష్టి బాధ్యతను కాపాడుతుంది.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: మీకు వారసత్వంగా ఇస్తున్న
  rationale: נחלה యొక్క వారసత్వ/స్వాస్థ్య భావాన్ని ‘వారసత్వంగా’ నేరుగా వ్యక్తం చేస్తుంది; వర్తమాన కృదంతాన్ని ‘ఇస్తున్న’గా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆమె అపవిత్రపరచబడిన తరువాత’ అనే పదబంధం యొక్క ఖచ్చిత భావం
  choice: అపవిత్రత ఏ విధమైనదో నిర్దేశించకుండా నిష్క్రియార్థమైన విస్తృత పదబంధాన్ని నిలుపడం
  alternative: ఆమె ఆచారపరంగా అపవిత్రమైన తరువాత; ఆమె లైంగికంగా అపవిత్రపరచబడిన తరువాత; మధ్యలో జరిగిన వివాహం వల్ల ఆమె మళ్లీ అర్హురాలు కాకుండా పోయిన తరువాత
  rationale: హీబ్రూ వచనం טמא యొక్క నిష్క్రియ రూపాన్ని ఉపయోగిస్తుంది గాని అపవిత్రత రకాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల వివాదాస్పదమైన న్యాయ-వేదాంత అర్థాన్ని అనువాదంలోనే తీర్మానించలేదు.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న నిబంధన దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఉంచింది.
- issue: దేశంపై పాపం తీసుకురావడం
  choice: దేశం మీదికి పాపాన్ని తీసుకురాకూడదు
  alternative: దేశాన్ని పాపం చేయించకూడదు; దేశాన్ని పాపంతో కలుషితం చేయకూడదు
  rationale: దేశాన్ని వ్యక్తీకరించి ‘పాపం చేయించడం’ అన్న అసహజతను నివారిస్తూ, పాపం/అపరాధభారం దేశంపైకి రావడం అనే హీబ్రూ కారణార్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. ఏకవచన హీబ్రూ సంబోధనకు తెలుగులో సహజమైన గౌరవ/సామూహిక రూపమైన ‘మీకు/మీరు’ ఉపయోగించబడింది. న్యాయపరమైన నిషేధం స్పష్టంగా ఉండేలా వాక్య విభజన చేయబడింది.
