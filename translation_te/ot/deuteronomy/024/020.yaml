id: DEU.24.20
reference: Deuteronomy 24:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י תַחְבֹּט֙ זֵֽיתְ/ךָ֔ לֹ֥א תְפָאֵ֖ר אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: te
  text: నీవు నీ ఒలీవ చెట్టును కొట్టి పండ్లు దించేటప్పుడు, దానిలో మిగిలినవాటిని మళ్లీ ఏరుకోకూడదు[a]. అవి నీ మధ్య నివసించే పరదేశికి[b], తండ్రిలేనివానికి[c], విధవరాలికి చెందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ వెనుక మిగిలినదాన్ని మళ్లీ దులిపివేయకూడదు.” అంటే, మొదటిసారి కొట్టి దించిన తర్వాత చెట్టుపై మిగిలిన ఒలీవ పండ్లను తీసుకోవడానికి రెండోసారి వెళ్లకూడదు.
    reason: lexical_alternative
  - marker: b
    text: “పరదేశి” అని అనువదించిన גֵּר అనే పదం ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది; “విదేశీయుడు” లేదా “వలస నివాసి” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా, “అనాథకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: దించేటప్పుడు
  rationale: ఈ న్యాయసందర్భంలో כִּי ఒక సందర్భాన్ని కాలార్థకంగా పరిచయం చేస్తుంది; అందువల్ల ‘ఎప్పుడు’ అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరిచాం.
- source_word: תַחְבֹּט
  choice: కొట్టి పండ్లు దించేటప్పుడు
  rationale: חבט ఇక్కడ ఒలీవ పండ్లు రాలేలా చెట్టును లేదా కొమ్మలను కొట్టడాన్ని సూచిస్తుంది. కేవలం ‘కొట్టేటప్పుడు’ కంటే ఉద్దేశాన్ని కూడా తెలిపే ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: זֵיתְךָ
  choice: నీ ఒలీవ చెట్టును
  rationale: זַיִת పండు లేదా చెట్టును సూచించగలదు; కొట్టి పండ్లు దించే చర్య వల్ల ఇక్కడ చెట్టు ఉద్దేశించబడింది. ఏకవచన రూపాన్ని నిలిపాం.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: దానిలో మిగిలినవాటిని మళ్లీ ఏరుకోకూడదు
  rationale: ఈ అరుదైన వ్యవసాయ ప్రయోగం మొదటి కోత తర్వాత మిగిలిన ఒలీవ పండ్ల కోసం రెండోసారి వెళ్లకూడదనే నిషేధాన్ని సూచిస్తుంది. సహజమైన తెలుగులో అర్థాన్ని అందిస్తూ, పదబంధంలోని అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: לַגֵּר
  choice: మీ మధ్య నివసించే పరదేశికి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’కి నివాస భావాన్ని జోడించడం ద్వారా కేవలం ప్రయాణికుడు అనే అపార్థాన్ని నివారించాం.
- source_word: לַיָּתוֹם
  choice: తండ్రిలేనివానికి
  rationale: יָתוֹם న్యాయపరమైన సందర్భాల్లో కుటుంబ రక్షణ కోల్పోయిన, ప్రత్యేకంగా తండ్రిలేని వ్యక్తిని సూచించగలదు. మూలంలోని సామాజిక ప్రత్యేకతను నిలిపాం.
- source_word: וְלָאַלְמָנָה
  choice: విధవరాలికి
  rationale: אַלְמָנָהకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: יִהְיֶה
  choice: చెందాలి
  rationale: సాధారణ ‘ఉండు’ క్రియ ఇక్కడ మిగిలిన పండ్లు ఎవరి కోసం కేటాయించబడాలో న్యాయపరంగా తెలియజేస్తుంది; ‘చెందాలి’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
