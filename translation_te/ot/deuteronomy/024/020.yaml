translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయశైలిని సహజంగా ఉంచాం. వ్యవసాయ చర్యను సాధారణ పాఠకులకు స్పష్టంచేయడానికి ‘కొట్టి పండ్లు దించేటప్పుడు’ అని చెప్పాం; అరుదైన హీబ్రూ ప్రయోగానికి సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
