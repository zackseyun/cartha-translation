id: DEU.24.17
reference: Deuteronomy 24:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְ/לֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: te
  text: పరదేశికైనా, అనాథకైనా న్యాయం జరగకుండా చేయకూడదు; విధవరాలి వస్త్రాన్ని తాకట్టుగా తీసుకోకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַטֶּה
  choice: న్యాయం దక్కకుండా చేయకూడదు
  rationale: נטה అనే క్రియ హిఫీల్ రూపంలో న్యాయాన్ని పక్కకు మళ్లించడం లేదా హక్కుగా రావలసిన న్యాయాన్ని నిరాకరించడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּט
  choice: న్యాయం
  rationale: ఇక్కడ מִשְׁפַּט న్యాయతీర్పును మాత్రమే కాక, బలహీనులకు హక్కుగా దక్కవలసిన న్యాయాన్ని కూడా సూచిస్తుంది. వాక్య నిర్మాణంలో ‘న్యాయం దక్కకుండా’ అని చెప్పడం ఈ సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: גֵּר
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: גֵּר అనేది కేవలం ప్రయాణికుడైన అపరిచితుణ్ణి కాక, ఇశ్రాయేలు సమాజంలో స్థానికేతరుడిగా నివసిస్తూ దాని సామాజిక, న్యాయ పరిరక్షణలో ఉన్న వ్యక్తిని సూచిస్తుంది. వివరణాత్మకమైన ఈ తెలుగు రూపం ఆ ప్రత్యేకతను కాపాడుతుంది.
- source_word: יָתוֹם
  choice: అనాథ
  rationale: ఈ పదం తండ్రి సంరక్షణ కోల్పోయిన బిడ్డను సూచించగలదు. ఆధునిక తెలుగులో ‘అనాథ’ సహజంగా ఉండి, ఇక్కడ ఉద్దేశించిన సామాజిక బలహీనతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַחֲבֹל
  choice: తాకట్టుగా తీసుకోకూడదు
  rationale: అప్పుకు హామీగా ఒక వస్తువును స్వాధీనం చేసుకోవడం అనే ఈ న్యాయపరమైన క్రియార్థాన్ని ‘తాకట్టుగా తీసుకోవడం’ స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: בֶּגֶד సాధారణంగా దుస్తు లేదా వస్త్రాన్ని సూచిస్తుంది; ప్రత్యేకంగా పైవస్త్రమని నిర్ణయించకుండా ‘వస్త్రం’ మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: אַלְמָנָה
  choice: విధవరాలు
  rationale: ఈ నామవాచకం విధవరాలిని సూచిస్తుంది. ‘విధవరాలి వస్త్రం’ అనే సంబంధ రూపం తెలుగులో సహజంగా ఉండి, రక్షణ అవసరమైన వ్యక్తిపై వాక్య దృష్టిని నిలుపుతుంది.
theological_decisions:
- issue: గֵּר సూచించే రక్షిత సామాజిక వర్గం
  choice: మీ మధ్య నివసించే పరదేశి
  alternative: వలసవాసి / పరదేశి / అపరిచితుడు
  rationale: ఈ ఆజ్ఞ ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తికి న్యాయ పరిరక్షణ కల్పిస్తుంది. ‘మీ మధ్య నివసించే పరదేశి’ అనేది అతణ్ణి కేవలం బయటి వ్యక్తిగా లేదా తాత్కాలిక ప్రయాణికుడిగా చూపకుండా మూలంలోని సామాజిక-న్యాయ భావాన్ని కాపాడుతుంది.
- issue: గֵּר יָתוֹם మధ్య సంబంధం
  choice: పరదేశికైనా, అనాథకైనా
  alternative: పరదేశి అయిన అనాథకు
  rationale: మసొరా పాఠంలో ఈ రెండు నామవాచకాల మధ్య సంధికారకం లేకపోయినా, సందర్భం మరియు ప్రాచీన అనువాద సంప్రదాయం వీటిని రెండు రక్షిత వర్గాలుగా గ్రహించడానికి మద్దతిస్తాయి. తెలుగు ‘కైనా ... కైనా’ రెండింటికీ ఆ నిషేధం వర్తిస్తుందని స్పష్టం చేస్తుంది; మూలంలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర ఆజ్ఞకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. నిషేధార్థానికి ‘చేయకూడదు’ రూపం ఉపయోగించబడింది; అప్పు-తాకట్టు సందర్భం స్పష్టంగా ఉంచబడింది.
