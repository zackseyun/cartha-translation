  naturalness: The revised sentence is fluent, modern standard Telugu and retains the direct legal-prohibitive register of the Hebrew.
  terminology: ‘పరదేశి’ is a suitable concise rendering of גֵּר when qualified by the footnote. ‘అనాథ,’ ‘విధవరాలు,’ ‘వస్త్రం,’ and ‘తాకట్టుగా తీసుకోవడం’ are appropriate and natural. The paired dative forms make clear that the resident foreigner and orphan are separate protected categories without resolving beyond the source’s syntax.
  issues:
