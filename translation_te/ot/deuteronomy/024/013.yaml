  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: te
  text: సూర్యుడు అస్తమించే సమయానికి అతని తాకట్టు వస్తువును[a] తప్పకుండా అతనికి తిరిగి ఇవ్వాలి. అప్పుడు అతడు తన పైవస్త్రాన్ని కప్పుకొని పడుకుని, నిన్ను దీవిస్తాడు. అది నీ దేవుడైన యెహోవా సన్నిధిలో నీకు నీతిగా ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాకట్టు” లేదా “తాకట్టుగా తీసుకున్నది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది నీకు నీతిగా పరిగణించబడుతుంది” లేదా “అది నీ నీతిక్రియగా ఉంటుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: తప్పకుండా ... తిరిగి ఇవ్వాలి
  rationale: క్రియతో కూడిన infinitive absolute ఆజ్ఞను బలపరుస్తుంది; ఈ తెలుగు రూపం ఆ నొక్కిచెప్పడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַעֲבוֹט
  choice: తాకట్టు వస్తువు
  rationale: అప్పుకు భద్రతగా తీసుకున్న వస్తువును సూచిస్తుంది; సాధారణ పాఠకునికి స్పష్టంగా ఉండేందుకు ‘వస్తువు’ను జోడించాం.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించే సమయానికి
  rationale: హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; వస్తువును రాత్రికి ముందే ఇవ్వాలనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: וְשָׁכַב
  choice: అప్పుడు అతడు ... పడుకుని
  rationale: వస్తువును తిరిగి ఇవ్వడం వల్ల కలిగే ఫలితాన్ని తెలుపుతుంది; హీబ్రూలోని సంబంధాన్ని అతిగా ఉద్దేశార్థకంగా మార్చకుండా ఉంచుతుంది.
- source_word: בְּשַׂלְמָתוֹ
  choice: తన పైవస్త్రాన్ని కప్పుకొని
  rationale: שַׂלְמָה ఇక్కడ నిద్రించేటప్పుడు కప్పుకునే బయటి వస్త్రం; తెలుగు వాక్యంలో దాని ప్రాయోగిక ఉపయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבֵרֲכֶךָּ
  choice: నిన్ను దీవిస్తాడు
  rationale: దీవించేవాడు తాకట్టు వస్తువును తిరిగి పొందిన వ్యక్తేనని వ్యాకరణం సూచిస్తుంది.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: అది ... నీకు నీతిగా ఉంటుంది
  rationale: צְדָקָה యొక్క ‘నీతిగా ఉండడం’ అనే భావాన్ని దగ్గరగా ఉంచి, అది లెక్కించబడుతుందా లేక నీతిక్రియగా పరిగణించబడుతుందా అనే సూక్ష్మ అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా సన్నిధిలో
  rationale: לִפְנֵי యొక్క సమక్షత/దృష్టి భావాన్ని ‘సన్నిధిలో’ తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో అందిస్తుంది.
- issue: וּלְךָ תִּהְיֶה צְדָקָה లో צְדָקָה భావం
  choice: నీకు నీతిగా ఉంటుంది
  alternative: నీకు నీతిక్రియగా పరిగణించబడుతుంది
  rationale: మూలంలోని సంక్షిప్త నిర్మాణాన్ని, నైతిక కార్యం మరియు దేవుని ఎదుట నీతిగా పరిగణించబడడం మధ్య ఉన్న భావవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయసంబంధ శైలి. ఆజ్ఞలోని బలాన్ని ‘తప్పకుండా’తో నిలిపి, ప్రాచీన పైవస్త్రం రాత్రి కప్పుగా ఉపయోగపడే నేపథ్యాన్ని సహజంగా తెలిపింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
