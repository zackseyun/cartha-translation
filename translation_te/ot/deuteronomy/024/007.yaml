    rationale: יִמָּצֵא యొక్క న్యాయసందర్భపు నిష్క్రియ భావానికి ‘కనబడితే’ మరింత నేరుగా సరిపోతుంది; ‘తెలిసినప్పుడు’ సాధారణ సమాచారం తెలిసిన భావానికి విస్తరించవచ్చు.
