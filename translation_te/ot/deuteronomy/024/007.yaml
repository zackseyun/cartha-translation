revisions:
- from: ఇశ్రాయేలీయులైన తన సహోదరుల్లో ఒకరిని ఒకడు అపహరించి, అతణ్ణి బానిసగా వాడుకొని అమ్మివేసినట్లు తెలిసినప్పుడు, ఆ అపహరణకారుడు చనిపోవాలి. ఆ విధంగా నీ మధ్యనుండి చెడును తొలగించాలి.
  to: ఇశ్రాయేలు ప్రజలలోని తన సహోదరుల్లో ఒకరిని ఒక మనిషి అపహరించి, అతనిని బానిసగా చేసుకొని అమ్మివేసినట్లు కనబడితే, ఆ అపహరణకారుడు మరణించాలి. నీ మధ్యనుండి చెడును తొలగించివేయాలి.
  rationale: సురక్షితమైన స్వల్ప సవరణలతో న్యాయపరమైన షరతు నిర్మాణాన్ని స్పష్టం చేశాను. బానిసత్వాన్ని సూచించే క్రియను ‘బానిసగా చేసుకొని’గా మార్చడం ద్వారా అపహరణకు గురైన వ్యక్తిని బానిస స్థితిలో ఉంచి విక్రయించే నేరభావం స్పష్టమవుతుంది. వివాదాస్పద ప్రత్యామ్నాయ అర్థాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయలేదు; ఈ సందర్భంలో బానిసత్వ భావమే సందర్భానుకూలమైనది.
