id: DEU.24.7
reference: Deuteronomy 24:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలలోని తన సహోదరుల్లో ఒకరిని ఒక మనిషి అపహరించి, అతనిని బానిసగా చేసుకొని అమ్మివేసినట్లు కనబడితే, ఆ అపహరణకారుడు మరణించాలి. నీ మధ్యనుండి చెడును తొలగించివేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִמָּצֵא
  choice: తెలిసినప్పుడు
  rationale: నిఫాల్ రూపంలోని ‘కనుగొనబడుట/బయటపడుట’ అనే న్యాయపరమైన భావాన్ని సహజమైన తెలుగు షరతు వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ ఏకవచన పుంలింగ రూపాన్ని నిలుపుతూ, తెలుగు న్యాయశైలిలో సహజంగా ఉంది.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: ఒకరిని ... అపహరించి
  rationale: అక్షరార్థంగా ‘ఒక ప్రాణిని/వ్యక్తిని దొంగిలించడం’; ఈ న్యాయ సందర్భంలో మనిషిని బలవంతంగా ఎత్తుకుపోవడాన్ని ‘అపహరించడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులైన తన సహోదరుల్లో ఒకరిని
  rationale: ‘సహోదరులు’ అనే ఒడంబడిక-బంధుత్వ భాషను నిలుపుతూ, అది కేవలం శారీరక తోబుట్టువులను కాక ఇశ్రాయేలు సమాజ సభ్యులను సూచిస్తుందని వాక్యంలోనే స్పష్టం చేస్తుంది.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: అతణ్ణి బానిసగా వాడుకొని
  rationale: అపహరించబడిన వ్యక్తిని ఆస్తిలా లేదా బానిసగా ఉపయోగించుకోవడం అనే హిత్పయేల్ క్రియ యొక్క దోపిడీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; క్రియకు ఉన్న కొంత భావవిస్తృతిని అతి నిర్దిష్టంగా కుదించదు.
- source_word: וּמְכָרוֹ
  choice: అమ్మివేసిన
  rationale: వ్యక్తిని అమ్మడం అనే చర్యను నేరంలోని ప్రత్యేక భాగంగా స్పష్టంగా నిలుపుతుంది.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: ఆ అపహరణకారుడు చనిపోవాలి
  rationale: ‘ఆ దొంగ చనిపోవాలి’ అనే మూలపాఠాన్ని సందర్భానుసారంగా వ్యక్తి-అపహరణకారుడికి స్పష్టంగా అన్వయిస్తుంది; విధించబడిన మరణశిక్ష భావాన్ని తెలుగు నియమశైలిలో అందిస్తుంది.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: ఆ విధంగా నీ మధ్యనుండి చెడును తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని పునరావృత న్యాయసూత్రాన్ని గంభీరమైన, సులభమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఒడంబడిక సమాజంలోని బంధుత్వ భాష
  choice: ‘ఇశ్రాయేలీయులైన తన సహోదరుల్లో’ అని అనువదించడం
  alternative: ‘తన తోటి ఇశ్రాయేలీయుల్లో’
  rationale: ‘సహోదరులు’ అనే మూలంలోని కుటుంబసంబంధ రూపకాన్ని కాపాడుతూ, ‘ఇశ్రాయేలీయులు’ అనే వివరణతో దాని సామాజిక పరిధిని స్పష్టం చేస్తుంది.
- issue: וְהִתְעַמֶּר בּוֹ లోని బానిసత్వ/దోపిడీ భావం
  choice: ‘బానిసగా వాడుకొని’
  alternative: ‘బానిసను చేసి’ లేదా ‘తన లాభం కోసం వాడుకొని’
  rationale: వ్యక్తిని బానిస స్థితిలో దోపిడీ చేయడం అనే బలమైన భావాన్ని నిలుపుతుంది; కేవలం ‘కఠినంగా ప్రవర్తించాడు’ అనే మృదువైన అర్థానికి తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. మూలంలోని ఏకవచన పుంలింగ నేరస్థుడు, బాధితుని సూచన నిలుపబడింది.
