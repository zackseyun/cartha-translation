source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִישׁ֙ אִשָּׁ֣ה חֲדָשָׁ֔ה לֹ֤א יֵצֵא֙ בַּ/צָּבָ֔א וְ/לֹא יַעֲבֹ֥ר עָלָ֖י/ו לְ/כָל דָּבָ֑ר נָקִ֞י יִהְיֶ֤ה לְ/בֵית/וֹ֙ שָׁנָ֣ה אֶחָ֔ת וְ/שִׂמַּ֖ח אֶת אִשְׁתּ֥/וֹ אֲשֶׁר לָקָֽח־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: te
  text: ఒక పురుషుడు కొత్తగా వివాహం చేసుకున్నప్పుడు, అతడు సైన్యంతో బయలుదేరకూడదు[a]; అతని మీద ఏ విధమైన బాధ్యతనూ మోపకూడదు[b]. అతడు ఒక సంవత్సరం పాటు తన ఇంటివారి కోసం బాధ్యతల నుంచి మినహాయింపుతో ఉండాలి[c]; తాను వివాహం చేసుకున్న భార్యను సంతోషపరచాలి[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి బయలుదేరకూడదు.” హీబ్రూలో అక్షరార్థంగా “సైన్యంతో బయలుదేరకూడదు” అని ఉంది; ఇది ప్రత్యక్ష పోరాటంతో పాటు విస్తృత సైనిక సేవను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతనికి ఏ పనినీ అప్పగించకూడదు,” లేక “అతనిపై ఏ విధమైన కర్తవ్యాన్నీ మోపకూడదు.” హీబ్రూ పదబంధం సైనిక బాధ్యతకంటే విస్తృతమైనది.
    reason: alternative_reading
  - marker: c
    text: లేదా, “అతడు ఒక సంవత్సరం పాటు ఇంటి దగ్గరే బాధ్యతల నుంచి మినహాయింపుతో ఉండాలి.” హీబ్రూ పదబంధం గృహజీవితం కోసం అతనికి లభించే స్వేచ్ఛను గానీ, అతడు తన ఇంటివారితో ఉండడాన్ని గానీ నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “తాను వివాహం చేసుకున్న భార్యను ఆనందింపజేయాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: చేసుకున్నప్పుడు
  rationale: ఇది ధర్మశాస్త్రంలోని ఒక సందర్భ నియమాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘చేసుకున్నప్పుడు’ అనేది ఎదురయ్యే పరిస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: ఒక పురుషుడు కొత్తగా వివాహం చేసుకున్నప్పుడు
  rationale: లָקַח + אִשָּׁה అనేది వివాహం చేసుకోవడాన్ని సూచించే హీబ్రూ నుడికారం. חֲדָשָׁה ఇక్కడ ‘కొత్త భార్య’ అనే కఠిన పదానువాదం కంటే కొత్తగా జరిగిన వివాహాన్ని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో సహజమైన రూపం ఎంచుకోబడింది.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: అతడు సైన్యంతో బయలుదేరకూడదు
  rationale: צָבָא సైన్యాన్ని లేదా సైనిక సేవను సూచించగలదు. ‘సైన్యంతో బయలుదేరు’ అనే రూపం మూలంలోని చిత్రాన్ని నిలుపుతూ, ప్రత్యక్ష యుద్ధానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: అతని మీద ఏ విధమైన బాధ్యతనూ మోపకూడదు
  rationale: ఈ హీబ్రూ ప్రయోగం అతనిపై ఏ అధికారిక పని లేదా బాధ్యతను విధించకూడదనే విస్తృత భావాన్ని ఇస్తుంది. తెలుగు న్యాయశైలిలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: נָקִי יִהְיֶה
  choice: బాధ్యతల నుంచి మినహాయింపుతో ఉండాలి
  rationale: נָקִי ఇక్కడ నిర్దోషిత్వం కంటే బాధ్యతల నుంచి స్వేచ్ఛగా లేదా మినహాయింపుతో ఉండడాన్ని సూచిస్తుంది.
- source_word: לְבֵיתוֹ
  choice: తన ఇంటివారి కోసం
  rationale: בַּיִת భౌతిక ఇంటిని మాత్రమే కాక ఇంటివారిని లేదా కుటుంబ గృహజీవితాన్ని కూడా సూచిస్తుంది. ‘ఇంటివారి కోసం’ ఆ గృహకేంద్రిత ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: שָׁנָה אֶחָת
  choice: ఒక సంవత్సరం పాటు
  rationale: నియమంలో పేర్కొన్న కాలవ్యవధిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: భార్యను సంతోషపరచాలి
  rationale: שׂמח యొక్క పియేల్ రూపం కారణార్థకమైనది—‘సంతోషింపజేయడం.’ ఈ భావాన్ని ‘సంతోషపరచాలి’ నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר לָקָח
  choice: తాను వివాహం చేసుకున్న
  rationale: తెలుగులో ‘తీసుకున్న’ అనడం అపార్థానికి దారితీయవచ్చు. వివాహ నుడికారంలోని అర్థాన్ని స్పష్టంగా అందిస్తూ, ప్రారంభ వాక్యంతో సంబంధాన్ని నిలుపుతుంది.
