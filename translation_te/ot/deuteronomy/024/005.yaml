translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. హీబ్రూ సైనిక పదబంధంలోని విస్తృతి, బాధ్యత మోపడం అనే సాధారణత, לְבֵיתוֹ లోని ‘ఇల్లు/ఇంటివారు’ ద్వంద్వసంభావ్యత పాదసూచికల్లో నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
