  terminology: ‘మరణశిక్ష విధించు’ హోఫల్ מות యొక్క న్యాయపరమైన ‘put to death’ భావాన్ని తగిన రీతిలో తెలియజేస్తుంది. ‘తండ్రులు,’ ‘కుమారులు,’ ‘ప్రతి వ్యక్తి,’ ‘తన సొంత పాపం’ అనే పదాలు మూలంలోని పదసంబంధాలను, వ్యక్తిగత బాధ్యతను సముచితంగా నిలుపుతున్నాయి.
