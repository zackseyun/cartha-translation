id: DEU.24.16
reference: Deuteronomy 24:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: te
  text: కుమారుల కారణంగా తండ్రులకు మరణశిక్ష విధించకూడదు; తండ్రుల కారణంగా కుమారులకు మరణశిక్ష విధించకూడదు. ప్రతి వ్యక్తికీ తన సొంత పాపం కారణంగానే మరణశిక్ష విధించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: మరణశిక్ష విధించకూడదు / విధించాలి
  rationale: מות యొక్క హోఫల్ రూపం సాధారణ మరణాన్ని కాక, ఇతరులచేత మరణానికి గురిచేయబడటాన్ని సూచిస్తుంది. ఈ న్యాయసంబంధ సందర్భంలో ‘మరణశిక్ష విధించడం’ సహజమైన తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָבוֹת
  choice: తండ్రులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా ‘తండ్రులు’ అని అర్థం; ‘తల్లిదండ్రులు’ అని విస్తరించకుండా మూలంలోని కుటుంబ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בָּנִים
  choice: కుమారులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘కుమారులు’. విస్తృత న్యాయసూత్రం పిల్లలందరికీ వర్తించగలిగినా, అనువాదం మూలంలోని పుంలింగ కుటుంబపదాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: కారణంగా
  rationale: ఈ న్యాయసంబంధ సందర్భంలో మరొకరి నేరాన్ని శిక్షకు ఆధారంగా చేసుకోవడాన్ని సూచిస్తుంది; ‘కారణంగా’ ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి వ్యక్తి
  rationale: ఇక్కడ אִישׁ పంపిణీ భావంతో ఒక్కొక్కరి వ్యక్తిగత బాధ్యతను సూచిస్తుంది. తెలుగులో ‘ప్రతి వ్యక్తి’ ఈ సూత్రాన్ని సహజంగా, సమగ్రంగా తెలియజేస్తుంది; వ్యాకరణ పుంలింగాన్ని అనవసరంగా సిద్ధాంతీకరించదు.
- source_word: בְּחֶטְאוֹ
  choice: తన సొంత పాపం కారణంగా
  rationale: ప్రత్యయంతో కూడిన రూపం ‘అతని పాపం’ అనే స్వామ్యాన్ని తెలియజేస్తుంది. ‘తన సొంత’ అనేది తండ్రి లేదా కుమారుని పాపానికి బదులుగా వ్యక్తి స్వపాపమే శిక్షకు ఆధారమనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మరణశిక్షలో వ్యక్తిగత బాధ్యత
  choice: ఒకరి సొంత పాపం ఆధారంగానే న్యాయపరమైన మరణశిక్ష విధించాలి; తండ్రి పాపానికి కుమారుని గానీ, కుమారుని పాపానికి తండ్రిని గానీ శిక్షించకూడదు.
  alternative: తరతరాలపై పాపం వల్ల కలిగే సమస్త పరిణామాల గురించి విస్తృత ప్రకటనగా అనువదించడం.
  rationale: מות యొక్క పునరుక్త హోఫల్ రూపాలు ఇక్కడ ప్రత్యేకంగా మరణానికి గురిచేయడాన్ని సూచిస్తాయి. కాబట్టి వ్యక్తిగత బాధ్యత అనే సూత్రాన్ని నిలుపుతూ, వాక్యపు ప్రత్యక్ష పరిధిని న్యాయపరమైన మరణశిక్షకు పరిమితం చేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయ ఆజ్ఞకు తగిన గంభీరతతో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘తండ్రులు—కుమారులు’ సమాంతరతను నిలిపి, నిషేధాన్ని తెలుగులో సహజమైన ‘విధించకూడదు’ రూపంలో వ్యక్తం చేసింది.
