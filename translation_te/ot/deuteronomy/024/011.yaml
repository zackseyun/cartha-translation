  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: te
  text: నీవు బయట నిలబడాలి; నీవు ఎవరికైతే అప్పు ఇస్తున్నావో, ఆ మనిషి తాకట్టు వస్తువును నీ దగ్గరకు బయటికి తీసుకురావాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు అప్పుపడి ఉన్న మనిషి తాకట్టు వస్తువును నీ దగ్గరకు బయటికి తీసుకురావాలి.” హీబ్రూ వ్యక్తీకరణ రుణదాత అప్పు ఇవ్వడాన్ని గానీ, రుణగ్రహీత అప్పుపడి ఉన్న స్థితిని గానీ ప్రధానంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: బయట
  rationale: ఇంటి వెలుపల ఉండడాన్ని సూచిస్తుంది. రుణగ్రహీత ఇంట్లోకి ప్రవేశించకూడదనే న్యాయ సందర్భంలో ‘బయట’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: תַּעֲמֹד
  choice: నిలబడాలి
  rationale: עמד యొక్క ప్రాథమిక భౌతిక అర్థం ‘నిలబడు.’ సందర్భంలో బయట వేచి ఉండాలనే భావం ఉన్నా, స్పష్టమైన ఆజ్ఞను అలాగే నిలుపుతుంది.
- source_word: וְהָאִישׁ
  choice: ఆ మనిషి
  rationale: איש ఇక్కడ పురుష రుణగ్రహీతను సూచిస్తుంది; అందువల్ల లింగాన్ని తటస్థీకరించకుండా ‘మనిషి’ అని అనువదించబడింది.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: నీవు ఎవరికైతే అప్పు ఇస్తున్నావో
  rationale: נשה ఈ నిర్మాణంలో ఒకరికి అప్పు ఇవ్వడం లేదా అతనిపై రుణదాతగా ఉండడం అనే భావాలను సూచించగలదు. ప్రధాన పాఠంలో రుణదాత చర్యను సహజంగా వ్యక్తం చేసి, రుణపడి ఉన్న స్థితి అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יוֹצִיא
  choice: తీసుకురావాలి
  rationale: יצא హిఫీల్ రూపానికి ‘బయటికి వచ్చేలా చేయు’ అనే అర్థం ఉంది. ‘బయటికి తీసుకురావాలి’ అనే పదబంధం కదలికను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీ దగ్గరకు
  rationale: రుణదాత వైపు దిశను సూచించే אֵלֶיךָకు ‘నీ దగ్గరకు’ సహజమైన తెలుగు సమానం.
- source_word: הָעֲבוֹט
  choice: తాకట్టు వస్తువును
  rationale: עבוט రుణానికి హామీగా ఉంచే వస్తువును సూచిస్తుంది. కేవలం ‘తాకట్టు’ కంటే ‘తాకట్టు వస్తువు’ సాధారణ పాఠకునికి నిర్దిష్ట వస్తువు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחוּצָה
  choice: బయటికి
  rationale: దిశాసూచక రూపం ‘వెలుపలికి’ అనే కదలికను తెలియజేస్తుంది. ముందున్న ‘బయట’తో భావపునరుక్తి ఉన్నప్పటికీ, మూలంలోని స్థానం–దిశ వ్యత్యాసాన్ని ‘బయట ... బయటికి’ నిలుపుతుంది.
theological_decisions:
- issue: నֹשֶׁה בוֹలో రుణదాత చర్య మరియు రుణగ్రహీత స్థితి మధ్య భావసందిగ్ధత
  choice: ప్రధాన పాఠంలో ‘నీవు ఎవరికైతే అప్పు ఇస్తున్నావో’
  alternative: ‘నీకు అప్పుపడి ఉన్న మనిషి’
  rationale: హీబ్రూ వ్యక్తీకరణ రుణదాత అప్పు ఇవ్వడాన్ని గానీ, ఎదుటివాడు అతనికి రుణపడి ఉండడాన్ని గానీ ముందుకు తేవచ్చు. ఈ న్యాయ సందర్భంలో ప్రధాన పాఠం అప్పు ఇచ్చే సంబంధాన్ని వ్యక్తం చేస్తుంది; నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే న్యాయశైలి ఉపయోగించబడింది. ‘నీవు’ అనే ఏకవచన సంబోధన మరియు ‘నిలబడాలి/తీసుకురావాలి’ అనే విధ్యర్థక రూపాలు ఆజ్ఞ స్వరాన్ని సహజంగా నిలుపుతాయి.
