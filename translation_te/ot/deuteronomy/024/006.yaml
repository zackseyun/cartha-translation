source:
  edition: WLC
  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: te
  text: తిరుగలి రాళ్ల జతను గానీ, పై తిరుగలి రాయిని గానీ కుదువగా తీసుకోకూడదు; ఎందుకంటే అలా చేసేవాడు ఒకరి ప్రాణాన్నే కుదువగా తీసుకుంటున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఒకరి జీవనాధారాన్నే కుదువగా తీసుకుంటున్నాడు.”
    reason: నֶפֶשׁ ఇక్కడ ‘ప్రాణం’ అనే ప్రత్యక్ష భావంతో పాటు, ప్రాణాన్ని నిలబెట్టే జీవనాధారాన్ని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: కుదువగా తీసుకోకూడదు / కుదువగా తీసుకుంటున్నాడు
  rationale: ఈ న్యాయ సందర్భంలో חבל అప్పుకు భద్రతగా ఒక వస్తువును తీసుకోవడాన్ని సూచిస్తుంది. ‘కుదువగా తీసుకోవడం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మూలంలోని క్రియ పునరుక్తిని నిలుపుతుంది.
- source_word: רֵחַיִם
  choice: తిరుగలి రాళ్ల జత
  rationale: ద్వివచన రూపం రెండు తిరుగలి రాళ్లను ఒక జతగా సూచిస్తుంది. ‘రాళ్ల జత’ అనడం మొత్తం పిండి విసిరే సాధనాన్ని స్పష్టం చేస్తుంది.
- source_word: וָרָכֶב
  choice: పై తిరుగలి రాయి
  rationale: רָכֶב ఇక్కడ కింది రాయిపై తిరిగే పై రాయిని సూచిస్తుంది. సంధిని ‘గానీ ... గానీ’గా వ్యక్తపరచడం మొత్తం జతనే కాదు, దానిలోని అత్యవసరమైన ఒక్క పై రాయినీ కుదువగా తీసుకోరాదనే న్యాయ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: נֶפֶשׁ
  choice: ఒకరి ప్రాణం
  rationale: ఇక్కడ నֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాక, రోజువారీ ఆహార తయారీకి అవసరమైన సాధనం పోవడం వల్ల ప్రమాదంలో పడే వ్యక్తి జీవనాన్ని సూచిస్తుంది. ‘ప్రాణం’ మూలంలోని బలమైన, సంక్షిప్త భావాన్ని నిలుపుతుంది; జీవనాధారం అనే సందర్భార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: הוּא
  choice: అలా చేసేవాడు
  rationale: సర్వనామం కుదువ తీసుకునే వ్యక్తిని సూచిస్తుంది. ‘అలా చేసేవాడు’ అని అనువదించడం తెలుగులో సూచనను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: న్యాయ-సామాజిక సందర్భంలో נֶפֶשׁ అర్థం
  choice: జీవాన్ని సూచించే ‘ప్రాణం’, జీవనాధార భావంతో
  alternative: జీవనాధారం; వ్యక్తి; ఆత్మ
  rationale: ఈ ఆజ్ఞ అప్పుదారునికి రోజువారీ ఆహారం సిద్ధం చేసుకునే సాధనాన్ని లేకుండా చేయకూడదని చెబుతుంది. అందువల్ల కుదువ తీసుకోవడం అతని జీవాన్నే ప్రమాదంలో పెట్టినట్లవుతుంది. ఇది మానవ స్వరూపంపై సిద్ధాంత నిర్ణయం కాదు; సందర్భాధారిత పదార్థ నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయ ఆజ్ఞకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘తిరుగలి’ గ్రామీణ గృహ ధాన్యపిండ సాధనానికి సహజమైన పదం; ‘కుదువ’ అప్పు భద్రత భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
