reference: Deuteronomy 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: te
  text: ఒక పురుషుడు ఒక స్త్రీని పెళ్లి చేసుకొని ఆమెకు భర్త అయిన తరువాత, ఆమెలో ఏదో సిగ్గుచేటైన విషయం[a] అతనికి కనిపించినందువల్ల ఆమె అతని దృష్టిలో అనుగ్రహం పొందకపోతే, అతడు ఆమెకు విడాకుల పత్రం రాసి, దాన్ని ఆమె చేతికి ఇచ్చి, తన ఇంటి నుండి ఆమెను పంపివేస్తే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనుచితమైన విషయం’ లేదా ‘అవమానకరమైనదేదో.’ హీబ్రూ పదబంధం స్పష్టంగా నిర్వచించబడలేదు; దానికి ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చెప్పబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: …పోతే / …వేస్తే
  rationale: ఇది కారణార్థక వాక్యం కాదు; ఒక న్యాయపరమైన సంభావ్య పరిస్థితిని ప్రారంభిస్తుంది. తెలుగులో షరతును సహజంగా తెలియజేయడానికి క్రియాంతంలోని ‘-తే’ రూపాలు వాడబడ్డాయి.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ఒక పురుషుడు ఒక స్త్రీని పెళ్లి చేసుకొని
  rationale: ‘భార్యగా తీసుకొను’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘పెళ్లి చేసుకొను’ అని వ్యక్తం చేశాం.
- source_word: וּבְעָלָהּ
  choice: ఆమెకు భర్త అయిన తరువాత
  rationale: בעל అనే క్రియ ఇక్కడ వైవాహిక సంబంధంలో భర్త కావడాన్ని సూచిస్తుంది. ‘స్వాధీనం చేసుకొను’ వంటి తప్పుదారి పట్టించే భావాన్ని నివారిస్తూ మూలంలోని ప్రత్యేక క్రియను నిలిపాం.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: ఆమె అతని దృష్టిలో అనుగ్రహం పొందకపోతే
  rationale: ‘అతని కళ్లలో కృపను కనుగొనదు’ అనే హీబ్రూ నుడికారానికి దగ్గరగా ఉండి, తెలుగులో అర్థమయ్యే రూపం.
- source_word: כִּי מָצָא בָהּ
  choice: ఆమెలో … అతనికి కనిపించినందువల్ల
  rationale: ఈ భాగం ఆ న్యాయపరమైన పరిస్థితిలో చెప్పబడిన కారణాన్ని వివరిస్తుంది; తెలుగు వాక్యక్రమానికి అనుగుణంగా సహజంగా అమర్చబడింది.
- source_word: עֶרְוַת דָּבָר
  choice: ఏదో సిగ్గుచేటైన విషయం
  rationale: ఈ క్లిష్టమైన పదబంధం ఉద్దేశపూర్వకంగా నిర్దిష్టత లేనిదిగా ఉంది. దానిని ఒక ప్రత్యేక లైంగిక లేదా న్యాయపరమైన నేరంగా పరిమితం చేయకుండా, సిగ్గు/అనుచితత భావాన్ని నిలిపే పదబంధం ఎంచుకున్నాం.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: ఆమెకు విడాకుల పత్రం రాసి
  rationale: సంబంధాన్ని అధికారికంగా రద్దు చేసే న్యాయపత్రం అనే కార్యార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנָתַן בְּיָדָהּ
  choice: దాన్ని ఆమె చేతికి ఇచ్చి
  rationale: హీబ్రూలోని స్పష్టమైన, విధానపరమైన భౌతిక చర్యను నేరుగా నిలిపింది.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: తన ఇంటి నుండి ఆమెను పంపివేస్తే
  rationale: ‘పంపివేయు/విడిచిపెట్టు’ అనే క్రియార్థంతో పాటు ఇంటి నుండి బయలుదేరే స్థలార్థాన్ని కూడా నిలిపింది.
theological_decisions:
- issue: ఈ వచనం విడాకులు ఇవ్వాలనే ఆజ్ఞగా అనిపించాలా, లేక న్యాయసంబంధమైన షరతు ప్రారంభంగా అనిపించాలా
  choice: ఆజ్ఞగా కాకుండా, తరువాతి వచనాల వరకు కొనసాగే షరతులతో కూడిన న్యాయపరిస్థితి ప్రారంభంగా అనువదించబడింది.
  alternative: కొన్ని అనువాద రూపాలు కొన్ని పరిస్థితుల్లో విడాకులు ఇవ్వాలని ఈ వచనమే ఆదేశిస్తున్నట్లు వినిపించవచ్చు.
  rationale: ద్వితీయోపదేశకాండము 24:1–4 వాక్యనిర్మాణంలో 1వ వచనం దీర్ఘమైన పూర్వపక్షాన్ని ప్రారంభిస్తుంది; ప్రధాన నిషేధం/న్యాయనిర్ణయం తరువాత వస్తుంది. అందుకే చివర డాష్ ఉంచి వాక్యం కొనసాగుతుందని చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. మూలంలోని దీర్ఘ షరతు నిర్మాణాన్ని చదవడానికి వీలుగా ఉంచుతూ, ఈ వచనంలోనే పూర్తి ఆజ్ఞ ఉందనే భావం రాకుండా చివర డాష్ వాడబడింది. ‘అనుగ్రహం పొందడం’ అనే బైబిలీయ నుడికారం మూలానికి సమీపంగా ఉండేందుకు నిలిపాం.
