id: DEU.24.18
reference: Deuteronomy 24:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: te
  text: నీవు ఐగుప్తులో బానిసగా ఉన్నావనీ, నీ దేవుడైన యాహ్వే అక్కడి నుండి నిన్ను విమోచించాడనీ జ్ఞాపకం ఉంచుకో. అందుచేత దీనిని చేయమని నేను నీకు ఆజ్ఞాపిస్తున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: జ్ఞాపకం ఉంచుకో
  rationale: సందర్భంలో ఆజ్ఞార్థకంగా పనిచేస్తున్న రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వాక్యారంభంలోని וְ సాధారణ అనుసంధానాన్ని తెలుగులో ప్రత్యేకంగా పలకకుండానే ప్రవాహంలో నిలుపుతుంది.
- source_word: כִּי
  choice: అనీ
  rationale: ఇక్కడ కారణాన్ని కాక, జ్ఞాపకం ఉంచుకోవలసిన విషయవస్తువును పరిచయం చేస్తుంది.
- source_word: עֶבֶד
  choice: బానిసగా
  rationale: ఐగుప్తులో ఇశ్రాయేలు అనుభవించిన బంధిత స్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּמִצְרַיִם
  choice: ఐగుప్తులో
  rationale: మూలంలోని సరళమైన స్థల సూచనను అదనపు పదాలు లేకుండా అందిస్తుంది.
- source_word: וַיִּפְדְּךָ
  choice: నిన్ను విమోచించాడనీ
  rationale: פדה లోని బంధం నుండి విడిపించడం/విమోచించడం అనే భావాన్ని సహజంగానూ దైవశాస్త్రీయ ప్రతిధ్వనిని నిలుపుకుంటూనూ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: ముందు పేర్కొన్న ఐగుప్తును తిరిగి సూచించే సహజమైన తెలుగు రూపం.
- source_word: עַל כֵּן
  choice: అందుచేతనే
  rationale: విమోచన జ్ఞాపకానికి మరియు ఆజ్ఞాపాలనకు మధ్యనున్న కారణాత్మక నైతిక సంబంధాన్ని, మూలంలోని ఉద్ఘాటనతో సహా తెలియజేస్తుంది.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: నేను నీకు ఆజ్ఞాపిస్తున్నాను
  rationale: స్పష్టమైన אָנֹכִי మరియు కృదంత రూపం ఇచ్చే వర్తమాన, ఉద్ఘాటిత ఆజ్ఞాభావాన్ని నిలుపుతుంది.
- source_word: לַעֲשׂוֹת
  choice: చేయమని
  rationale: עשה యొక్క విస్తృతమైన ‘చేయు’ అర్థాన్ని తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: దీనిని
  rationale: ముందున్న న్యాయనియమాన్ని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ఈ సంగతిని’ అనే కృత్రిమ పదబద్ధతను నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం; ‘యాహ్వే’ కూడా సాధ్యమైన పండిత లిప్యంతరీకరణ.
- issue: ఐగుప్తులో ఇశ్రాయేలు స్థితికి עֶבֶד అనువాదం
  choice: బానిస
  alternative: సేవకుడు
  rationale: ఈ సందర్భంలో బలవంతపు బంధిత స్థితే నైతిక ప్రేరణకు కేంద్రం; ‘సేవకుడు’ ఆ తీవ్రతను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. మూలంలోని జ్ఞాపకం–విమోచన–ఆజ్ఞ అనే తార్కిక క్రమాన్ని నిలుపుతూ, అనవసరంగా ‘నేడు’ వంటి సమీప సందర్భ పదాలను చేర్చలేదు.
