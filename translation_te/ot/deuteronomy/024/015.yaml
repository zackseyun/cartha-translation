id: DEU.24.15
reference: Deuteronomy 24:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: te
  text: అతని కూలిని ఆ రోజే అతనికి చెల్లించాలి; సూర్యుడు అస్తమించేంతవరకు దానిని నిలిపి ఉంచకూడదు. ఎందుకంటే అతడు పేదవాడు; తన జీవనం కోసం ఆ కూలిపైనే ఆధారపడుతున్నాడు.[a] లేకపోతే అతడు నీకు వ్యతిరేకంగా యాహ్వేకు మొరపెడతాడు; అప్పుడు నీలో పాపం ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మాటను అక్షరార్థంగా అనువదిస్తే, “అతడు దానివైపు తన ప్రాణాన్ని ఎత్తుతున్నాడు/మోస్తున్నాడు.” అంటే ఆ కూలి తన జీవనానికి అత్యవసరమని భావం.
    reason: హీబ్రూ నుడికారంలోని పదచిత్రాన్ని, జీవనాధారమనే దాని భావాన్ని రెండింటినీ చూపించడానికి.
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: ఆ రోజే
  rationale: అక్షరార్థంగా ‘అతని రోజున.’ తెలుగు భాషలో సహజంగా, అదే రోజున చెల్లించాలనే తక్షణ భావాన్ని ‘ఆ రోజే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִתֵּן שְׂכָרוֹ
  choice: అతని కూలిని అతనికి చెల్లించాలి
  rationale: న్యాయనియమ సందర్భంలోని ఆజ్ఞను ‘చెల్లించాలి’ సహజంగా వ్యక్తం చేస్తుంది; שָׂכָר ఇక్కడ చేసిన పనికి రావలసిన కూలి.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించేంతవరకు దానిని నిలిపి ఉంచకూడదు
  rationale: హీబ్రూ పదచిత్రం అక్షరార్థంగా సూర్యుడు ‘దానిమీదికి రావడం’; సందర్భంలో కూలిని సూర్యాస్తమయం దాటే వరకు ఇవ్వకుండా ఉంచకూడదనే కాలపరిమితిని సూచిస్తుంది.
- source_word: כִּי עָנִי הוּא
  choice: ఎందుకంటే అతడు పేదవాడు
  rationale: עָנִי ఇక్కడ ఆర్థికంగా బలహీనుడైన కూలివానిని సూచిస్తుంది; ‘పేదవాడు’ సూటిగా, సహజంగా ఉంది.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: తన జీవనం కోసం ఆ కూలిపైనే ఆధారపడుతున్నాడు
  rationale: ‘దానివైపు తన ప్రాణాన్ని ఎత్తుతున్నాడు/మోస్తున్నాడు’ అనే హీబ్రూ నుడికారం, ఆ కూలి అతని జీవనానికి అత్యవసరమనే భావాన్ని తెలుపుతుంది. ప్రధాన వాక్యంలో భావాన్ని సహజంగా ఇచ్చి, పదచిత్రాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: లేకపోతే అతడు నీకు వ్యతిరేకంగా యాహ్వేకు మొరపెడతాడు
  rationale: వేతనం నిలిపివేయడం వల్ల సంభవించగల హెచ్చరికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘మొరపెట్టు’ అణచివేయబడినవాడు దేవునికి చేసే న్యాయవిన్నపానికి తగిన పదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: అప్పుడు నీలో పాపం ఉంటుంది
  rationale: ‘పాపం నీలో/నీ విషయంగా ఉంటుంది’ అనే హీబ్రూ నిర్మాణాన్ని సులభమైన తెలుగులో ఉంచి, ‘దోషం మోపబడుతుంది’ వంటి మరింత సాంకేతిక అర్థాన్ని దిగుమతి చేయలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని ధ్వన్యంతరీకరించడం మూలానికి సమీపంగా ఉంటుంది.
- issue: וְהָיָה בְךָ חֵטְא లో పాపం–దోషం సంబంధం
  choice: నీలో పాపం ఉంటుంది
  alternative: నీవు దోషివవుతావు
  rationale: మూలంలోని ‘పాపం నీలో ఉంటుంది’ అనే రూపాన్ని కాపాడుతూ, వాక్యం చెప్పినదానికన్నా నిర్దిష్టమైన న్యాయశాస్త్ర లేదా సిద్ధాంత భాషను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే న్యాయోపదేశ శైలి. ఏకవచన సంబోధనను ‘నీకు/నీలో’ రూపాల్లో నిలిపాం.
