revisions:
- from: మీరు మీ దేవుడైన యాహ్వేకు కుమారులు[a]. చనిపోయిన వ్యక్తి కోసం మీ దేహాలను కోసుకోవద్దు; మీ కళ్ల మధ్య[b] బోడి మచ్చ చేసుకోవద్దు.
  to: మీరు మీ దేవుడైన యాహ్వేకు కుమారులు[a]. మీ శరీరాలను కోసుకోవద్దు; మృతుని నిమిత్తం మీ కళ్ల మధ్య[b] బట్టతల మచ్చ చేసుకోవద్దు.
  rationale: The revision restores the Hebrew clause order and keeps ‘for a dead person’ with the final mourning-practice prohibition, without forcing a narrower interpretation of its scope. It also replaces a less idiomatic expression for the bald patch with clearer standard Telugu. All original footnote anchors and their lexical functions are retained.
