  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: te
  text: మీరు మీ దేవుడైన యాహ్వేకు కుమారులు[a]. మీ శరీరాలను కోసుకోవద్దు; మృతుని నిమిత్తం మీ కళ్ల మధ్య[b] బట్టతల మచ్చ చేసుకోవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ దేవుడైన యాహ్వే పిల్లలు.’ హీబ్రూ పదం పుంలింగ బహువచనంలో ఉండి, అక్షరార్థంగా ‘కుమారులు’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మీ కళ్ల మధ్య’; అంటే నుదుటిపై.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: కుమారులు
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; నిబంధన సంబంధిత గుర్తింపును తెలిపే మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. విస్తృతార్థంలో ‘పిల్లలు’ అనడం సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ఇక్కడ לְ సంబంధాన్ని లేదా చెందిన స్థితిని సూచిస్తుంది. తెలుగులో ‘యాహ్వేకు కుమారులు’ అనే నిర్మాణం ఆ నిబంధన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: ‘మీ దేవుడు’ అనే నిబంధన సూత్రాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో నిలిపింది.
- source_word: תִתְגֹּדְדוּ
  choice: మీ దేహాలను కోసుకోవద్దు
  rationale: ప్రతిబింబక క్రియ స్వయంగా శరీరంపై కోతలు చేసుకోవడాన్ని, ముఖ్యంగా శోకాచార సందర్భంలో, సూచిస్తుంది.
- source_word: קָרְחָה
  choice: బోడి మచ్చ
  rationale: ఉద్దేశపూర్వకంగా ఏర్పరచిన వెంట్రుకలులేని భాగాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּין עֵינֵיכֶם
  choice: మీ కళ్ల మధ్య
  rationale: మూలంలోని ‘మీ కళ్ల మధ్య’ అనే శరీరావయవ సూచనను ప్రధాన పాఠ్యంలో నిలిపి, దాని భావస్థానమైన నుదుటిని పాదసూచికలో వివరించింది.
- source_word: לָמֵת
  choice: చనిపోయిన వ్యక్తి కోసం
  rationale: ఏదో ఒక మృతుని నిమిత్తం పాటించే శోకాచారాన్ని సూచించే హీబ్రూ ఏకవచన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: నిబంధన సమాజాన్ని సూచించే లింగవాచక పదం
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: మూలంలో పుంలింగ బహువచన నామవాచకం ఉంది. అందువల్ల దాన్ని తటస్థీకరించకుండా ప్రధాన పాఠ్యంలో నిలిపాం; ఇది నిబంధన సమాజంలో స్త్రీలు లేరని సూచించదు.
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ప్రత్యక్షంగా ఉన్న దేవుని నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గంభీరమైన ఆజ్ఞారూప శైలిని ఉపయోగించాం. మూలంలోని పుంలింగ ‘కుమారులు,’ దైవనామం, ‘కళ్ల మధ్య’ అనే శరీరావయవ ప్రయోగం ప్రధాన పాఠ్యంలో నిలిపి, అవసరమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
