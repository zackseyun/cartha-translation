  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: te
  text: 'నీళ్లలో ఉన్న వాటన్నిటిలో మీరు తినవచ్చేవి ఇవి: రెక్కలూ పొలుసులూ ఉన్న ప్రతిదానినీ మీరు తినవచ్చు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמָּיִם
  choice: నీళ్లలో
  rationale: సందర్భంలో సముద్రజీవులకే పరిమితం చేయకుండా, హీబ్రూ పదంలోని విస్తృతమైన ‘జలాలు/నీళ్లు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: రెక్కలు, పొలుసులు
  rationale: చేపల శరీర లక్షణాలను సూచించే సాధారణ, సులభంగా అర్థమయ్యే తెలుగు పదాలు; సంయుక్త అర్హతను యథాతథంగా ఉంచుతుంది.
- source_word: תֹּאכְלוּ
  choice: తినవచ్చు
  rationale: అనుమతిని తెలిపే ఆహార నియమ సందర్భాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన నియమవాక్య శైలి. ‘ఇదిని’ అనే అక్షరానువాదం తెలుగులో అసహజంగా ఉండటంతో, సమూహాన్ని ముందుకు చూపే బహువచన ‘వీటిని’ వాడబడింది; అర్థం మార్చబడలేదు.
