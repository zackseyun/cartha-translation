  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: te
  text: ఏ కళేబరాన్నీ మీరు తినకూడదు.[a] మీ పట్టణాల్లో నివసిస్తున్న పరదేశికి[b][c] దానిని ఇవ్వవచ్చు, అతడు దానిని తినవచ్చు; లేదా దానిని విదేశీయునికి అమ్మవచ్చు.[d] ఎందుకంటే మీరు మీ దేవుడైన యాహ్వేకు పరిశుద్ధ ప్రజలు. మేకపిల్లను దాని తల్లి పాలలో ఉడకబెట్టకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానంతట అదే చనిపోయిన ఏ జంతువునూ” లేదా “ఏ చనిపోయిన జంతువునూ.” హీబ్రూ నְבֵלָה సాధారణంగా అనుమతించబడిన విధంగా వధించబడని జంతువు కళేబరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “పరదేశి” హీబ్రూ గֵּרను అనువదిస్తుంది; ఇది ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. తరువాతి వాక్యంలోని “విదేశీయుడు” (నָכְרִי) నుంచి ఇది భిన్నం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “మీ గుమ్మాలలో.” ఇది మీ స్థానిక సమాజం లేదా పట్టణాల పరిధిలో ఉన్నవారిని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: d
    text: మరింత ఆజ్ఞార్థకంగా, “దానిని అతనికి ఇవ్వాలి, అతడు దానిని తినాలి; లేదా విదేశీయునికి అమ్మాలి” అని కూడా అనువదించవచ్చు. హీబ్రూ న్యాయశైలిలో ఈ రూపాలు అనుమతిని లేదా సూచనను తెలియజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: נְבֵלָה
  choice: సహజంగా చనిపోయిన జంతువు మాంసం
  rationale: ఈ పదం అనుమతించబడిన విధంగా వధించకుండా చనిపోయిన జంతువు కళేబరాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘కళేబరం’ అనడం తినడాన్ని గురించి ఉన్న సందర్భంలో కొంత అసహజంగా ఉండవచ్చు; అందువల్ల అర్థాన్ని స్పష్టంగా తెలియజేసే రూపం ఎంచుకోబడింది.
- source_word: גֵּר
  choice: నివసించే పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసించే, స్థానికేతర వ్యక్తి అనే ప్రత్యేక సామాజిక స్థితిని తెలియజేస్తుంది; తరువాతి נָכְרִי పదంతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: మీ పట్టణాల్లో
  rationale: అక్షరార్థంగా ‘మీ గుమ్మాల్లో’; ఇది సమాజపు పట్టణాలు లేదా స్థానిక పరిధిలో నివసించడాన్ని సూచించే హీబ్రూ నుడికారం.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ / מָכֹר
  choice: ఇవ్వవచ్చు ... తినవచ్చు ... అమ్మవచ్చు
  rationale: న్యాయశాస్త్ర సందర్భంలో ఈ రూపాలు ఆజ్ఞగా కూడా వినిపించగలిగినా, ఇశ్రాయేలీయులు తినకూడదనే నిషేధానికి విరుద్ధంగా ఇతరులకు ఇవ్వడం లేదా అమ్మడం అనుమతించబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: נָכְרִי
  choice: విదేశీయుడు
  rationale: నివాస పరదేశి (גֵּר)తో పోలిస్తే స్థానిక సమాజంలో అదే స్థిర నివాస హోదా లేని బయటి దేశస్థుణ్ణి సూచిస్తుంది.
- source_word: עַם קָדוֹשׁ
  choice: ప్రతిష్ఠితమైన ప్రజలు
  rationale: దేవునికి ప్రత్యేకంగా వేరుచేయబడి ఆయనకు చెందిన ప్రజలు అనే నిబంధనాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘పరిశుద్ధ ప్రజలు’ అనే సాంప్రదాయ ప్రత్యామ్నాయం కూడా సాధ్యమే.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది; לְ ఉపసర్గ చెందినదనాన్ని లేదా ప్రతిష్ఠను సూచిస్తుంది.
- source_word: גְּדִי
  choice: మేకపిల్ల
  rationale: ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉండే సహజ పదం.
- source_word: תְבַשֵּׁל
  choice: ఉడకబెట్టు
  rationale: ద్రవంలో వండడాన్ని సూచించే క్రియ కావడంతో విస్తృతమైన ‘వండు’ కంటే ఇది మరింత నిర్దిష్టం.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: దాని తల్లి పాలలో
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన సంబంధాన్నీ, దృశ్యాన్నీ సహజ తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన సాధ్యమైన ప్రత్యామ్నాయం.
- issue: జంతువును ఇవ్వడం లేదా అమ్మడం గురించిన న్యాయ క్రియల బలం
  choice: 'అనుమతార్థకం: ‘ఇవ్వవచ్చు ... అమ్మవచ్చు’'
  alternative: 'ఆజ్ఞార్థకం: ‘ఇవ్వాలి ... అమ్మాలి’'
  rationale: ఈ నియమంలోని ప్రధాన బలం ఇశ్రాయేలీయులు దాన్ని తినకూడదనే నిషేధం; తరువాతి క్రియలు దాన్ని ఇతరులకు ఇవ్వడం లేదా అమ్మడం అనుమతించబడిందని సహజంగా తెలియజేస్తాయి. అయితే హీబ్రూ న్యాయశైలి ఆజ్ఞార్థకంగా కూడా అనువదించవచ్చు.
- issue: עַם קָדוֹשׁ యొక్క భావం
  choice: ప్రతిష్ఠితమైన ప్రజలు
  alternative: పరిశుద్ధ ప్రజలు
  rationale: ఇక్కడి ‘పవిత్రత’ ప్రధానంగా యెహోవాకు ప్రత్యేకంగా వేరుచేయబడి చెందిన నిబంధన ప్రజల స్థితిని సూచిస్తుంది. నైతిక నిర్దోషిత్వం మాత్రమే అన్న అర్థం రాకుండా ‘ప్రతిష్ఠితమైన’ అని ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉండే పదజాలం వాడబడింది. ‘పరదేశి/విదేశీయుడు’ అనే భేదం, అనుమతి-ఆజ్ఞ మధ్య మూలంలోని ఉద్రిక్తత, దేవునికి ప్రత్యేకంగా చెందిన ప్రజల భావం కాపాడబడ్డాయి.
