review_pass:
  verdict: revise
  source_fidelity: 'The draft obscures the Hebrew sentence structure: the Levite, resident foreigner, fatherless person, and widow are all coordinated subjects of ‘come, eat, and be satisfied’; it currently makes only the latter three come. It also renders the Hebrew singular ‘hand’ as plural. The purpose clause is better represented as ‘so that/may bless’ rather than the more sequential ‘then ... will bless.’'
  naturalness: The revised wording is idiomatic modern standard Telugu while retaining the legal-instructional register and the social categories of the source.
  terminology: ‘లేవీయుడు’ correctly avoids adding ‘priest.’ ‘నివాస పరదేశి’ conveys גֵּר as a non-native resident. ‘యాహ్వే’ follows the POB rendering of the Tetragrammaton as a personal name rather than a title; ‘వాటా’ and ‘స్వాస్థ్యం’ preserve the paired legal-economic terms.
  issues:
  - severity: high
    issue: The Levite is syntactically detached from the list of people who come and eat.
    rationale: In Hebrew, ‘the Levite ... and the sojourner, the fatherless, and the widow’ form a coordinated group, followed by plural verbs ‘they shall eat and be satisfied.’ The parenthetical construction in the draft makes ‘లేవీయుడు’ not a subject of ‘వచ్చి, తిని.’
  - severity: medium
    issue: The purpose relationship in לְמַעַן is weakened by ‘అప్పుడు ... ఆశీర్వదిస్తాడు.’
    rationale: לְמַעַן introduces purpose/intended result. ‘ఆశీర్వదించునట్లు’ preserves this relation without presenting blessing as a simple temporal consequence.
  - severity: medium
    issue: ‘నీ చేతుల ప్రతి పనిలో’ does not reflect the Hebrew singular ‘your hand’ and is stylistically repetitive.
    rationale: ‘నీ చేతిపని అంతటిలో’ naturally conveys ‘in all the work of your hand that you do.’
  - severity: low
    issue: The divine name differs from the POB audit trail’s chosen rendering.
    rationale: The audit trail specifies ‘Yahweh.’ Telugu ‘యాహ్వే’ represents that name more directly than ‘యెహోవా.’
  revised_text: లేవీయుడికి నీతోపాటు వాటా గానీ స్వాస్థ్యం గానీ లేదు కాబట్టి, లేవీయుడూ నీ పట్టణాల్లోనున్న నివాస పరదేశి[a], తండ్రిలేనివాడు, విధవరాలూ వచ్చి తిని తృప్తి పొందాలి; అప్పుడు నీ దేవుడైన యాహ్వే నీవు చేసే నీ చేతిపని అంతటిలో నిన్ను ఆశీర్వదించునట్లు ఉంటుంది.
  revised_footnotes:
  - marker: a
    text: ‘నివాస పరదేశి’ అంటే ఇశ్రాయేలీయుడు కాకపోయినా ఇశ్రాయేలీయుల మధ్య నివసించే వ్యక్తి.
    reason: lexical_alternative
