source:
  edition: WLC
  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: te
  text: లేవీయుడికి నీతోపాటు వాటా గానీ స్వాస్థ్యం గానీ లేదు కాబట్టి, లేవీయుడూ నీ పట్టణాల్లోనున్న నివాస పరదేశి[a], తండ్రిలేనివాడు, విధవరాలూ వచ్చి తిని తృప్తి పొందాలి; అప్పుడు నీ దేవుడైన యాహ్వే నీవు చేసే నీ చేతిపని అంతటిలో నిన్ను ఆశీర్వదించునట్లు ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నివాస పరదేశి’ అంటే ఇశ్రాయేలీయుడు కాకపోయినా ఇశ్రాయేలీయుల మధ్య నివసించే వ్యక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: వచ్చి
  rationale: ఈ న్యాయనిర్దేశ సందర్భంలో తరువాతి క్రియలతో కలిసి ఆశించిన చర్యల క్రమాన్ని సూచిస్తుంది; తెలుగులో ‘వచ్చి’ సహజంగా ఆ క్రమాన్ని కలుపుతుంది.
- source_word: הַלֵּוִי
  choice: లేవీయుడు
  rationale: మూలం లేవీ గోత్రానికి చెందిన సామాజిక వర్గాన్ని మాత్రమే పేర్కొంటుంది; ‘యాజకుడు’ అని చేర్చి అర్థాన్ని కుదించలేదు.
- source_word: חֵלֶק וְנַחֲלָה
  choice: భాగంగానీ స్వాస్థ్యంగానీ
  rationale: కేటాయించబడిన వాటా మరియు వారసత్వంగా లభించే ఆస్తి అనే జత భావాలను నిలుపుతుంది.
- source_word: הַגֵּר
  choice: నివసించే పరదేశి
  rationale: ఇశ్రాయేలీయుల మధ్య స్థిరంగా నివసించే ఇశ్రాయేలీయేతరుణ్ని సూచించే సామాజిక భావాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַיָּתוֹם
  choice: తండ్రిలేనివాడు
  rationale: న్యాయపరమైన ఈ సామాజిక వర్గంలో హెబ్రీ పదం సూచించే తండ్రిని కోల్పోయిన బలహీన స్థితిని నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో నివసించే
  rationale: ‘నీ గుమ్మాల్లో’ అనే హెబ్రీ నుడికారం స్థానిక పట్టణాలు లేదా సమాజాన్ని సూచిస్తుంది; తెలుగులో భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: తిని తృప్తి చెందాలి
  rationale: దశమభాగపు నిల్వ ద్వారా వారు సమృద్ధిగా ఆహారం పొందాలనే ఉద్దేశిత ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: అప్పుడు ... నిన్ను ఆశీర్వదిస్తాడు
  rationale: లְמַעַן తెలిపే ఉద్దేశం/ఫలిత సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఆశీర్వాదాన్ని యాంత్రికమైన షరతుగా కాక ఆశించిన ఫలితంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: నీవు చేసే నీ చేతుల ప్రతి పనిలో
  rationale: చేతుల పని అనే మూలరూపకాన్ని నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, సాధారణ తెలుగు బైబిలు వాడుకలో పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: లేవీయుని హోదా
  choice: లేవీయుడు
  alternative: లేవీయ యాజకుడు
  rationale: ఈ వచనం అతణ్ని యాజకుడని ప్రత్యేకంగా పేర్కొనదు; అందువల్ల మూలంలోని విస్తృత వర్గాన్ని అలాగే ఉంచాం.
- issue: ఆశీర్వాద వాక్యంలోని ఉద్దేశం/ఫలితం
  choice: అప్పుడు ... ఆశీర్వదిస్తాడు
  alternative: ఆశీర్వదించడానికి / ఆశీర్వదించవచ్చు
  rationale: לְמַעַן తరువాతి అసంపూర్ణ క్రియ ఉద్దేశిత ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్యం ఆ సంబంధాన్ని నిలుపుతుంది; దానిని సందేహార్థక అవకాశంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. హెబ్రీ న్యాయపరమైన సామాజిక వర్గాలను స్పష్టంగా ఉంచి, ‘గుమ్మాల్లో’ అనే నుడికారాన్ని భావానువాదంగా ‘పట్టణాల్లో’ అని ఇచ్చాం.
