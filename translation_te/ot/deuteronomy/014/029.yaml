revisions:
- from: లేవీయుడు—నీతో పాటు అతనికి భాగంగానీ స్వాస్థ్యంగానీ లేదు గనుక—నీ పట్టణాల్లో నివసించే పరదేశి[a], తండ్రిలేనివాడు, విధవరాలు వచ్చి, తిని తృప్తి చెందాలి. అప్పుడు నీవు చేసే నీ చేతుల ప్రతి పనిలో నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదిస్తాడు[b].
  to: లేవీయుడికి నీతోపాటు వాటా గానీ స్వాస్థ్యం గానీ లేదు కాబట్టి, లేవీయుడూ నీ పట్టణాల్లోనున్న నివాస పరదేశి[a], తండ్రిలేనివాడు, విధవరాలూ వచ్చి తిని తృప్తి పొందాలి; అప్పుడు నీ దేవుడైన యాహ్వే నీవు చేసే నీ చేతిపని అంతటిలో నిన్ను ఆశీర్వదించునట్లు ఉంటుంది.
  rationale: The revision restores the coordinated Hebrew subject list and its shared directive/result verbs, preserves the purpose force of לְמַעַן, and uses the singular ‘hand’ idiom naturally. The unrelated draft footnote on ‘నీ చేతుల ప్రతి పని’ is removed; the remaining note is anchored to the term it explains.
