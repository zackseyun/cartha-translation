translation:
  language: te
  text: శుద్ధమైన పక్షులన్నిటినీ మీరు తినవచ్చు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: ఈ పరిమాణవాచకం పేర్కొన్న వర్గమంతటికీ అనుమతి వర్తిస్తుందని తెలియజేస్తుంది. తెలుగులో ‘పక్షులన్నిటినీ’ అనేది ఈ సమగ్ర పరిధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹף
  choice: పక్షులు
  rationale: ఈ పదం విస్తృతంగా ఎగిరే జీవులను సూచించగలిగినా, సమీప ఆహార నియమాల సందర్భంలో పక్షులే ఉద్దేశించబడ్డాయి; అందువల్ల ‘పక్షులు’ స్పష్టమైన, ప్రస్తుత ప్రయోగం.
- source_word: טָהוֹר
  choice: శుద్ధమైన
  rationale: ద్వితీయోపదేశకాండంలోని ఆహార నియమాల సందర్భంలో ఇది నైతిక లేదా భౌతిక పరిశుభ్రతను కాక, ఆచారపరంగా తినడానికి అనుమతించబడిన వర్గాన్ని సూచిస్తుంది. ‘శుద్ధమైన’ ఆ నియమపరమైన వర్గీకరణను నిలుపుతుంది.
- source_word: תֹּאכֵלוּ
  choice: మీరు తినవచ్చు
  rationale: నిషేధిత పక్షులకు విరుద్ధంగా ఇక్కడ క్రియ అనుమతిని వ్యక్తం చేస్తుంది. ‘తినవచ్చు’ ఆ న్యాయపరమైన అనుమతి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా, గౌరవప్రదంగా అనువదించబడింది. హీబ్రూ వాక్యంలోని సమగ్ర పరిధి మరియు అనుమతి భావం రెండూ నిలుపబడ్డాయి.
