  to: అయితే ప్రయాణదూరం నీకు మరీ ఎక్కువై, దానిని మోసుకెళ్లడం నీ వల్ల కాకపోతే—నీ దేవుడైన యెహోవా తన నామాన్ని అక్కడ ఉంచుటకు ఎంచుకొనే స్థలం నీకు చాలా దూరంగా ఉన్నందున, నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదించినప్పుడు—
