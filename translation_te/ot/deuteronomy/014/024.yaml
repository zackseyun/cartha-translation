id: DEU.14.24
reference: Deuteronomy 14:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: te
  text: అయితే ప్రయాణదూరం నీకు మరీ ఎక్కువై, దానిని మోసుకెళ్లడం నీ వల్ల కాకపోతే—నీ దేవుడైన యెహోవా తన నామాన్ని అక్కడ ఉంచుటకు ఎంచుకొనే స్థలం నీకు చాలా దూరంగా ఉన్నందున, నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదించినప్పుడు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: అయితే ... అయితే
  rationale: మునుపటి ఆజ్ఞకు కొనసాగింపుగా వచ్చే షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: ప్రయాణం నీకు మరీ దూరమై
  rationale: మార్గం వ్యక్తి సామర్థ్యానికి మించినంత పొడవుగా ఉండటాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: దానిని మోసుకెళ్లడం నీ వల్ల కాకపోతే
  rationale: సందర్భంలోని దశమభాగపు పంటను భౌతికంగా మోసుకెళ్లడమే ఉద్దేశం; ‘దానిని’ అనే సర్వనామం మూలంలోని ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: స్థలం నీకు చాలా దూరంగా ఉన్నప్పుడు
  rationale: స్థల దూరాన్ని స్పష్టంగా తెలుపుతూ ద్వితీయోపదేశకాండంలోని ప్రత్యేకమైన ‘స్థలం’ భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా ... ఎంచుకునే
  rationale: న్యాయవిధి సందర్భంలోని భవిష్యత్ సూచనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: దేవుడు ఆరాధనా స్థలాన్ని ఎన్నుకోవడాన్ని సూచించే ద్వితీయోపదేశకాండపు ఒడంబడిక భాషను సూటిగా కాపాడుతుంది.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదిస్తే
  rationale: כִּי ఇక్కడ కాలార్థకంగా లేదా కారణార్థకంగా అర్థమయ్యే అవకాశముంది. ప్రధాన పాఠంలో షరతుతో అనుసంధానమైన సహజ తెలుగు రూపాన్ని వాడి, కారణార్థక పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణ తెలుగు పాఠకులకు పరిచితమైన నామరూపాన్ని ఉపయోగించాం.
- issue: చివరి כִּי యొక్క సంబంధం
  choice: 'షరతు/కాల సందర్భం: ‘ఆశీర్వదిస్తే’'
  alternative: 'కారణ సంబంధం: ‘ఆశీర్వదించినందువల్ల’'
  rationale: ఈ సంధాయకం సమృద్ధి వల్ల రవాణా కష్టమయ్యే కారణాన్ని లేదా అది సంభవించే పరిస్థితిని సూచించవచ్చు. ప్రధాన పాఠం ఈ భావసంబంధాన్ని పూర్తిగా ఖరారు చేయకుండా ఉంచుతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలో పూర్తయ్యే షరతు నిర్మాణం కాబట్టి చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
