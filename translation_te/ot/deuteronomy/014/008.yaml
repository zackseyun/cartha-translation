id: DEU.14.8
reference: Deuteronomy 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: te
  text: పంది[a]—దానికి చీలిన డెక్క ఉన్నా అది నెమరు వేయదు కాబట్టి—మీకు అపవిత్రమైనది. వాటి మాంసంలో దేనినీ తినకూడదు; వాటి కళేబరాలను తాకకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వరాహం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో మొదట ‘పంది’ ఏకవచనంలో ఉంది; తరువాత ‘వాటి మాంసం,’ ‘వాటి కళేబరాలు’ అని బహువచనం వస్తుంది. ఇది ఈ రకమైన జంతువులను సమష్టిగా సూచించవచ్చు.
    reason: textual_grammar
lexical_decisions:
- source_word: הַחֲזִיר
  choice: పంది
  rationale: ఈ జంతువుకు ఆధునిక ప్రామాణిక తెలుగులో సాధారణంగా, స్పష్టంగా వాడే పదం ‘పంది’.
- source_word: מַפְרִיס פַּרְסָה
  choice: చీలిన డెక్క ఉన్నా
  rationale: డెక్క రెండుగా చీలి ఉండే లక్షణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తరువాతి వ్యతిరేక లక్షణంతో కలపడానికి ‘ఉన్నా’ అనువుగా ఉంది.
- source_word: וְלֹא גֵרָה
  choice: అది నెమరు వేయదు
  rationale: జీర్ణించిన ఆహారాన్ని తిరిగి నోటికి తెచ్చి నమిలే జంతు ప్రక్రియకు ‘నెమరు వేయడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: טָמֵא
  choice: అపవిత్రమైనది
  rationale: తోరా ఆహార నియమంలోని శుద్ధి స్థితిని సూచిస్తుంది; నైతిక దుష్టత్వం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఈ నియమం ఒడంబడిక సమాజానికి వర్తిస్తుందనే హీబ్రూ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: מִבְּשָׂרָם
  choice: వాటి మాంసంలో దేనినీ
  rationale: מִן యొక్క విభాగార్థాన్ని ‘దేనినీ’తో, బహువచన ప్రత్యయాన్ని ‘వాటి’తో వ్యక్తం చేస్తుంది.
- source_word: נִבְלָתָם
  choice: వాటి కళేబరాలను
  rationale: చనిపోయిన జంతువుల మృతదేహాలను సూచించే న్యాయపరమైన సందర్భంలో ‘కళేబరాలు’ ఖచ్చితంగా, గౌరవప్రదంగా సరిపోతుంది; హీబ్రూ బహువచన ప్రత్యయాన్ని కూడా నిలుపుతుంది.
- source_word: תִגָּעוּ
  choice: తాకకూడదు
  rationale: ఆజ్ఞ యొక్క ప్రత్యక్ష నిషేధ బలాన్ని విస్తరించకుండా లేదా తగ్గించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: తోరా ఆహార నియమంలో అపవిత్రత స్వభావం
  choice: טָמֵא ను ‘అపవిత్రమైనది’గా అనువదించడం
  alternative: అశుద్ధమైనది; మలినమైనది
  rationale: ఇది ఆహార/ఆచార సంబంధిత ఒడంబడిక స్థితిని పేర్కొంటుంది; నైతిక దుష్టత్వం లేదా తరువాతి సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చదు.
- issue: కళేబరాలను తాకరాదనే నిషేధ బలం
  choice: ‘తాకకూడదు’ అనే ప్రత్యక్ష నిషేధం
  alternative: ముట్టుకోకండి; సమీపించకండి
  rationale: נגע అంటే నేరుగా ‘తాకు’; ‘సమీపించకండి’ అనడం మూలపాఠం కంటే అర్థాన్ని విస్తరిస్తుంది.
- issue: ఏకవచన జంతువు తరువాత వచ్చే బహువచన ప్రత్యయాలు
  choice: ‘వాటి మాంసం… వాటి కళేబరాలు’ అని బహువచనాన్ని నిలుపడం
  alternative: ‘దాని మాంసం… దాని కళేబరం’ అని సందర్భానుసారంగా ఏకవచనం చేయడం
  rationale: మసొరేటిక్ పాఠంలో מִבְּשָׂרָם, נִבְלָתָם రెండింటిలోనూ పురుష బహువచన ప్రత్యయాలు ఉన్నాయి. ఇవి ఆ జంతువుల వర్గాన్ని సమష్టిగా సూచించవచ్చు; ఆ రూపాంతరాన్ని నిశ్శబ్దంగా తొలగించకుండా పాఠంలో ఉంచి పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘నెమరు వేయడం’ సాధారణ పాఠకులకు అర్థమయ్యే స్థిరమైన జంతుశాస్త్ర ప్రయోగం. ఆజ్ఞల బలాన్ని ‘తినకూడదు,’ ‘తాకకూడదు’తో స్పష్టంగా నిలిపాం.
