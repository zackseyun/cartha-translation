  naturalness: ‘పంది,’ ‘చీలిన డెక్క,’ ‘నెమరు వేయదు,’ ‘తినకూడదు,’ ‘తాకకూడదు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉన్నాయి. ‘కళేబరాలు’ న్యాయ/లేఖన శైలికి తగిన, మృత జంతు దేహాన్ని సూచించే పదం.
