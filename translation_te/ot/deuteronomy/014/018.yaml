translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని సంక్షిప్తంగా నిలిపి, ప్రతి పక్షిపేరుకు విభక్తిరహిత సమాంతర నిర్మాణం వాడాం. అరుదైన పక్షుల గుర్తింపులోని నిజమైన అనిశ్చితిని పాదసూచనల్లో నిలిపాం; ‘దాని జాతుల ప్రకారం’ అనే పదబంధంతో మూలంలోని వర్గవిస్తృతిని కాపాడాం.
