  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: te
  text: కొంగ[a], నారాయణ పక్షి దాని జాతి చొప్పున[b], కుదుపుపిట్ట[c], గబ్బిలం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నారాయణ పక్షి.’ ఈ వచనంలోని అనేక పక్షుల ఖచ్చితమైన గుర్తింపు అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఐబిస్ పక్షి’ లేదా ‘ప్లోవర్ పక్షి.’
    reason: lexical_alternative
  - marker: c
    text: పాత అనువాదాల్లో తరచుగా ‘టిట్టిభ పక్షి’ అని ఉంది; హీబ్రూ పదం ‘కుదుపుపిట్ట’ను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: కొంగ
  rationale: ఈ పక్షిపేరు సాధారణంగా ‘stork’ను సూచిస్తుందని నిఘంటువులు, సందర్భం సూచిస్తున్నాయి. తెలుగులో సహజమైన సాధారణ పేరు ‘కొంగ’; అయితే ఖచ్చితమైన పక్షి గుర్తింపు అనిశ్చితమైనందున పాదసూచన ఇచ్చాం.
- source_word: הָאֲנָפָה
  choice: నారాయణ పక్షి
  rationale: ఈ పదం ఖచ్చితంగా ఏ పక్షిని సూచిస్తుందో అనిశ్చితం; సాధారణంగా heron వర్గపు నీటిపక్షిగా అర్థం చేసుకుంటారు. తెలుగులో ఆ వర్గానికి గుర్తించదగిన పేరు ‘నారాయణ పక్షి’.
- source_word: לְמִינָהּ
  choice: దాని జాతుల ప్రకారం
  rationale: ఈ సూత్రప్రాయ పదబంధం ఒక్క జాతిని మాత్రమే కాక దానికి చెందిన రకాలు లేదా వర్గాన్ని సూచిస్తుంది. హీబ్రూ స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న పక్షిపేరునే సూచిస్తుంది.
- source_word: הַדּוּכִיפַת
  choice: కుదుపుపిట్ట
  rationale: ఆధునిక పక్షి గుర్తింపులో ఈ హీబ్రూ పదాన్ని hoopoeగా భావించడం బలంగా ఉంది. దానికి ప్రస్తుత తెలుగు పేరు ‘కుదుపుపిట్ట’; పాత అనువాద సంప్రదాయంలోని lapwing భావాన్ని అనుసరించలేదు.
- source_word: הָעֲטַלֵּף
  choice: గబ్బిలం
  rationale: హీబ్రూ పదం స్పష్టంగా batను సూచిస్తుంది. ఆధునిక వర్గీకరణలో అది పక్షి కాకపోయినా, ధర్మశాస్త్ర జాబితాలో ఎగిరే జీవుల మధ్య ఉన్న క్రమాన్ని యథాతథంగా ఉంచాం.
