translation:
  language: te
  text: శుద్ధమైన ఏ పక్షినైనా మీరు తినవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “శుద్ధమైన ప్రతి పక్షిని మీరు తినవచ్చు” లేదా “శుద్ధమైన పక్షులన్నిటినీ మీరు తినవచ్చు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ఏ...నైనా
  rationale: ఈ పరిమాణపదం శుద్ధమైన పక్షుల వర్గమంతటిలో పరిమితిలేని అనుమతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఏ పక్షినైనా’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: צִפּוֹר
  choice: పక్షి
  rationale: ఈ ఆహార నియమ సందర్భంలో ఈ నామవాచకానికి సాధారణమైన, స్పష్టమైన అర్థం ‘పక్షి’.
- source_word: טְהֹרָה
  choice: శుద్ధమైన
  rationale: ఇది ఆహార నియమాల్లో అనుమతించబడిన ఆచారపరమైన వర్గాన్ని సూచిస్తుంది; ‘శుద్ధమైన’ అనే పదం ఆ న్యాయపరమైన భేదాన్ని నిలుపుతుంది.
- source_word: תֹּאכֵלוּ
  choice: మీరు తినవచ్చు
  rationale: ఇక్కడ రెండవ పురుష బహువచన అసంపూర్ణ క్రియ ఆహార నియమంలో అనుమతిని వ్యక్తం చేస్తుంది; ‘తినవచ్చు’ ఆధునిక తెలుగులో దానిని స్పష్టంగా తెలియజేస్తుంది.
