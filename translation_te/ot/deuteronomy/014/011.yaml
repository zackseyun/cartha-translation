translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవాక్య శైలి. మూలంలోని సమగ్ర పరిమాణ భావాన్ని ‘ఏ...నైనా’తో, అనుమతి భావాన్ని ‘తినవచ్చు’తో వ్యక్తం చేసింది.
