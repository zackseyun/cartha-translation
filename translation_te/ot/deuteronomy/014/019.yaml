source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף טָמֵ֥א ה֖וּא לָ/כֶ֑ם לֹ֖א יֵאָכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: te
  text: ఎగిరే గుంపుగా కదిలే జీవులన్నీ మీకు అపవిత్రమైనవి[a]; అవి తినబడకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెక్కలుగల గుంపుగా కదిలే జీవులన్నీ.’ హీబ్రూ పదబంధం ‘గుంపుగా కదిలే జీవి’ అనే మాటను ‘ఎగిరే జీవి/పక్షి’ అనే మాటతో కలుపుతుంది. కాబట్టి ఇది సాధారణ అర్థంలోని పక్షులకన్నా ముఖ్యంగా ఎగిరే కీటకాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: ప్రతి
  rationale: וְ ఈ నిషేధాన్ని ముందున్న ఆహార నియమాలతో కలుపుతుంది; తెలుగులో వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు. כֹל యొక్క సమగ్ర, పంపిణీయ భావాన్ని ‘ప్రతి’ సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: ఎగిరే ... గుంపుజీవి
  rationale: שֶׁרֶץ చిన్నగా గుంపులుగా కదిలే లేదా విస్తరించే జీవిని సూచిస్తుంది; עוֹף ఇక్కడ ఎగిరే జీవుల వర్గాన్ని నిర్దేశిస్తుంది. ఈ కలయిక సాధారణ పక్షులకన్నా ముఖ్యంగా రెక్కలుగల కీటకాలను సూచించే అవకాశం ఉన్నందున ‘ఎగిరే గుంపుజీవి’ అని అనువదించాం.
- source_word: טָמֵא
  choice: అపవిత్రమైనది
  rationale: ఇది ఆచారపరమైన, ఆహారపరమైన శుద్ధి వర్గాన్ని సూచించే స్థిరమైన పదం; సాధారణ మలినత భావానికి పరిమితం కాదు.
- source_word: הוּא לָ/כֶם
  choice: మీకు అపవిత్రమైనది
  rationale: לָכֶם ఈ నియమం ఇశ్రాయేలీయులకు వర్తించే నిబంధనాత్మక సంబంధాన్ని తెలియజేస్తుంది. హీబ్రూ పునరుద్ఘాటక సర్వనామాన్ని తెలుగులో సహజ విధేయ నిర్మాణంతో తెలిపాం.
- source_word: לֹא יֵאָכֵלוּ
  choice: అవి తినబడకూడదు
  rationale: నిఫాల్ బహువచన క్రియలోని కర్మణి రూపాన్నీ బహువచనాన్నీ నిలుపుతూ, తెలుగు న్యాయనిషేధ శైలిలో ‘తినబడకూడదు’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘గుంపుజీవి’ అరుదైన సమాసమైనా, שֶׁרֶץ యొక్క గుంపులుగా కదిలే జీవుల భావాన్ని ‘పురుగు’ అని అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
