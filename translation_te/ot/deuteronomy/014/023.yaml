revisions:
- from: నీ దేవుడైన యెహోవా తన నామం అక్కడ నివసించేలా ఎంచుకునే స్థలంలో[a], ఆయన సన్నిధిలో నీ ధాన్యం, కొత్త ద్రాక్షారసం, నూనెల పదో వంతును, నీ పశువుల మందలోను గొర్రెమేకల మందలోను పుట్టిన తొలిచూలు పిల్లలను తినాలి. అలా నీవు నీ దేవుడైన యెహోవాకు ఎల్లప్పుడూ భయపడడం నేర్చుకుంటావు.
  to: నీ దేవుడైన యెహోవా సన్నిధిలో, తన నామం అక్కడ నివసించేలా ఆయన ఎంచుకునే స్థలంలో, నీ ధాన్యం, కొత్త ద్రాక్షామద్యం, నూనె—వాటి పదో వంతును, అలాగే నీ పశువుల మందలోను గొర్రెమేకల మందలోను పుట్టిన తొలిపిల్లలను తినాలి. ఈ విధంగా నీవు నీ దేవుడైన యెహోవాకు జీవితాంతం భయపడడం నేర్చుకోవాలి.
  rationale: The revision clarifies that Yahweh chooses the sanctuary site, retains the Hebrew idiom concerning his name dwelling there, marks the tithe as applying to the listed produce, preserves the separate firstborn-livestock offering, and renders the final clause as the stated purpose of the command. The footnote remains properly anchored to the sanctuary formula and preserves its viable lexical alternatives.
