source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా సన్నిధిలో, తన నామం అక్కడ నివసించేలా ఆయన ఎంచుకునే స్థలంలో, నీ ధాన్యం, కొత్త ద్రాక్షామద్యం, నూనె—వాటి పదో వంతును, అలాగే నీ పశువుల మందలోను గొర్రెమేకల మందలోను పుట్టిన తొలిపిల్లలను తినాలి. ఈ విధంగా నీవు నీ దేవుడైన యెహోవాకు జీవితాంతం భయపడడం నేర్చుకోవాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: తినాలి
  rationale: న్యాయబోధ సందర్భంలో సంయోజకంతో వచ్చిన Qal perfect ఆదేశార్థక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘తినాలి’ సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా సన్నిధిలో
  rationale: לִפְנֵי లోని ‘ఎదుట/సన్నిధిలో’ అనే ఆరాధనా భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: ఎంచుకునే స్థలంలో
  rationale: దేవుడు ఆరాధనకు ఒక స్థలాన్ని ఎంపిక చేయడాన్ని తెలిపే ద్వితీయోపదేశకాండపు సూత్రప్రయోగాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: తన నామం అక్కడ నివసించేలా
  rationale: שׁכן హిఫిల్ రూపంలోని కారణార్థక ఛాయను, దేవుని నామం ఎంపికైన స్థలంలో నివసిస్తుందనే హీబ్రూ రూపకాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: מַעְשַׂר
  choice: పదో వంతు
  rationale: ఆదాయంలో లేదా పంటలో పదవ భాగాన్ని సూచించే ఆరాధనా పదానికి సామాన్య పాఠకులకు వెంటనే అర్థమయ్యే తెలుగు రూపం.
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: నీ ధాన్యం, కొత్త ద్రాక్షారసం, నూనె
  rationale: వ్యవసాయ ఉత్పత్తుల హీబ్రూ త్రయాన్ని నిలుపుతుంది; תִּירוֹשׁ సాధారణ ద్రాక్షారసం కంటే కొత్త ద్రాక్షారసాన్ని సూచించే ప్రత్యేకతను కాపాడుతుంది.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: నీ పశువుల మందలోను గొర్రెమేకల మందలోను పుట్టిన తొలిచూలు పిల్లలు
  rationale: בְּקָר పెద్ద పశువులను, צֹאן గొర్రెలు-మేకల వంటి చిన్న పశువులను సూచిస్తుంది; ‘తొలిచూలు పిల్లలు’ వాటి మొదట పుట్టిన సంతానాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: అలా ... భయపడడం నేర్చుకుంటావు
  rationale: לְמַעַן తెలిపే ఉద్దేశాన్ని, ירא లోని ‘భయపడు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; ‘భయభక్తి’ అని విస్తరించి మూలంలోని ఉద్వేగాన్ని తగ్గించలేదు.
- source_word: כָּל־הַיָּמִים
  choice: ఎల్లప్పుడూ
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’; జీవితమంతటా నిరంతరంగా అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యహ్వే; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: లְשַׁכֵּן שְׁמוֹ שָׁם అనే ఆలయస్థల సూత్రప్రయోగం
  choice: తన నామం అక్కడ నివసించేలా
  alternative: తన నామాన్ని అక్కడ నివసింపజేయడానికి; తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: ఎంపికైన ఆరాధనా స్థలంలో దేవుని నామం నివసిస్తుందనే హీబ్రూ రూపకాన్ని నిలుపుతూ, దేవుడే ఆ స్థలానికి పరిమితుడని చెప్పకుండా దైవాతీతతకూ నిబంధనా సన్నిధికీ మధ్య ఉన్న భావ ఉద్వేగాన్ని కాపాడుతుంది.
- issue: יְרֵא יְהוָה లోని భయ భావం
  choice: యెహోవాకు భయపడడం
  alternative: యెహోవాపట్ల భయభక్తులు కలిగి ఉండడం
  rationale: ‘భయభక్తి’ సందర్భానుకూలమైన వివరణ అయినా, మూలంలోని ירא పదానికి ఉన్న నేరమైన ‘భయపడు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపింది. పాతకాలపు ‘దశమభాగము,’ ‘ప్రథమఫలము’ వంటి రూపాలకు బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘పదో వంతు,’ ‘తొలిచూలు పిల్లలు’ అనే పదాలను ఎంచుకుంది; అయితే హీబ్రూ ఆలయస్థల నుడికారాన్ని సరళీకరించకుండా ఉంచింది.
