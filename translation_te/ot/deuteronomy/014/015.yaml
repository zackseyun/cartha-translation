  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే పక్షిపేర్లు వాడబడ్డాయి. మూలంలోని వరుస జాబితా నిర్మాణం నిలుపబడింది; పక్షుల గుర్తింపులోని నిజమైన అనిశ్చితి పాదసూచికలో స్పష్టంగా భద్రపరచబడింది.
