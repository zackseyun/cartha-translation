  yaml_path: translation/ot/deuteronomy/014/015.yaml
  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: te
  text: నిప్పుకోడి[b], డేగ, సముద్రపు కాకి, గద్దను దాని జాతుల ప్రకారం[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని కొన్ని పక్షుల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. ‘డేగ’గా అనువదించిన תַּחְמָס గుడ్లగూబ లేదా మరొక పక్షి కావచ్చు; ‘సముద్రపు కాకి’గా అనువదించిన שָׁחַףను కోకిల అని కూడా అనువదించారు; ‘గద్ద’గా అనువదించిన נֵץ డేగ లేదా ఫాల్కన్‌ను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘యానా కుమార్తె’; ఇది నిప్పుకోడికి ఉపయోగించే జాతి పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: నిప్పుకోడి
  rationale: అక్షరార్థంగా ‘యానా కుమార్తె’ అయిన ఈ హీబ్రూ జాతీయ నామం పక్షుల జాబితాలో సాధారణంగా నిప్పుకోడిని లేదా ఎడారి పక్షిని సూచిస్తుంది. ఆధునిక పాఠకులకు సహజమైన జాతిపేరు ఎంచుకోబడింది.
- source_word: הַתַּחְמָס
  choice: డేగ
  rationale: ఈ పక్షి ఖచ్చితమైన గుర్తింపు అనిశ్చితం. వేటపక్షిని సూచించే సాధ్యమైన ఆధునిక పదంగా ‘డేగ’ వాడి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: הַשָּׁחַף
  choice: సముద్రపు కాకి
  rationale: ఈ క్లిష్టమైన పదాన్ని ఆధునిక నిఘంటువులు సాధారణంగా గల్ లేదా దానికి సమానమైన సముద్రపక్షితో అనుసంధానిస్తాయి. అందువల్ల తెలుగులో సులభంగా అర్థమయ్యే ‘సముద్రపు కాకి’ ఎంచుకోబడింది.
- source_word: הַנֵּץ
  choice: గద్ద
  rationale: ఈ పదం ఒక వేటపక్షిని, సాధారణంగా హాక్ లేదా ఫాల్కన్‌ను సూచిస్తుంది. అదే వచనంలోని תַּחְמָס నుంచి వేరుచూపుతూ విస్తృతంగా అర్థమయ్యే ‘గద్ద’ వాడబడింది.
- source_word: לְמִינֵהוּ
  choice: జాతులన్నీ
  rationale: ఇది ఆ పక్షి జాతితోపాటు దానికి సంబంధించిన వివిధ రకాలను సూచించే హీబ్రూ వర్గీకరణ సూత్రం. తెలుగులో సహజంగా ఉండేలా ముందు పదంతో కలిపి ‘గద్ద జాతులన్నీ’ అని అనువదించబడింది.
