source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: te
  text: 'అయితే, నెమరు వేసే వాటిలోనుండీ, చీలిన డెక్కగల వాటిలోనుండీ ఈ జంతువులను మీరు తినకూడదు: ఒంటె, అడవి కుందేలు[a], హైరాక్స్[b]. అవి నెమరు వేస్తాయి, కానీ వాటికి చీలిన డెక్క లేదు. అవి మీకు అపవిత్రమైనవి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ జంతు పదం బహుశా అడవి కుందేలును (hare) సూచిస్తుంది; దానిని ‘కుందేలు’ (rabbit) అని కూడా అనువదించవచ్చు. ఖచ్చితమైన జంతుశాస్త్రీయ గుర్తింపుపై కొంత అనిశ్చితి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం సాధారణంగా రాతిబండల మధ్య నివసించే హైరాక్స్ అనే చిన్న క్షీరదాన్ని సూచిస్తుంది. దీనిని కొన్నిసార్లు ‘రాక్ బ్యాడ్జర్’ అని అంటారు, కానీ ఇది నిజమైన పొట్టేలు కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి నియమానికి మినహాయింపును సూచించే నిరోధక/వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: నెమరు వేసే జంతువులలో
  rationale: జంతువులు మింగిన మేతను తిరిగి నోటికి తెచ్చి నమిలే ప్రవర్తనను తెలుగులో సహజంగా తెలిపే ప్రామాణిక ప్రయోగం.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: చీలిన డెక్క ఉన్న జంతువులలో
  rationale: డెక్క పూర్తిగా రెండుగా చీలి ఉండడాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: הַגָּמָל
  choice: ఒంటె
  rationale: జంతువు పేరుకు నేరమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: הָאַרְנֶבֶת
  choice: కుందేలు
  rationale: హీబ్రూ పదం సాధారణంగా hare‌ను సూచించినా, ఆధునిక సాధారణ తెలుగులో ఈ జంతు వర్గానికి సులభంగా అర్థమయ్యే పేరు ‘కుందేలు’; ఖచ్చితమైన జంతుశాస్త్రీయ గుర్తింపు గురించి పాదసూచికలో తెలిపింది.
- source_word: הַשָּׁפָן
  choice: కొండ పొట్టేలు
  rationale: రాతిబండల మధ్య నివసించే హైరాక్స్‌ను సూచించేందుకు తెలుగులో వివరణాత్మకంగా వినియోగించగల పేరు; ఇది నిజమైన పొట్టేలు కాదనే అపార్థాన్ని పాదసూచిక నివారిస్తుంది.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: అవి నెమరు వేస్తాయి
  rationale: ముందున్న జంతు ప్రవర్తనకు సంబంధించిన పదబంధాన్ని సుసంగతంగా పునరావృతం చేస్తుంది.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: గాని వాటి డెక్క చీలి ఉండదు
  rationale: సాధారణ నియమాన్ని తెలుగులో సహజ వర్తమాన రూపంలో వ్యక్తపరుస్తూ, చీలిన డెక్క అనే ముందు పదప్రయోగంతో సుసంగతంగా ఉంటుంది.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: అవి మీకు అపవిత్రమైనవి
  rationale: ఆహార నియమ సందర్భంలోని నిబంధనాత్మక అపవిత్రతను అదనపు సిద్ధాంత వివరణ లేకుండా విస్తృతమైన బైబిలు పదంతో నిలుపుతుంది.
theological_decisions:
- issue: ఆహార నియమంలో అపవిత్రత స్వభావం
  choice: అపవిత్రమైనవి
  alternative: ఆచారపరంగా అపవిత్రమైనవి
  rationale: హీబ్రూ טָמֵא అనే పదం ఈ సందర్భంలో నిబంధనాత్మక పరిశుద్ధత వర్గాన్ని సూచిస్తుంది. ‘ఆచారపరంగా’ అని చేర్చడం మూలపాఠం కంటే భావాన్ని సంకుచితం చేస్తుంది కాబట్టి ప్రధాన పాఠంలో విస్తృత పదాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవిధి శైలి ఉపయోగించబడింది. ‘నెమరు వేయడం,’ ‘చీలిన డెక్క,’ ‘అపవిత్రమైనవి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. జంతువుల గుర్తింపులోని నిజమైన అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
