revisions:
- from: ఎందుకంటే నీవు నీ దేవుడైన యెహోవాకు ప్రతిష్ఠితమైన ప్రజవు; భూమిమీద ఉన్న సమస్త ప్రజలలోనుండి నిన్ను తనకు అమూల్యమైన ప్రజగా ఉండేలా యెహోవా ఎన్నుకున్నాడు.[a]
  to: ఎందుకంటే నీవు నీ దేవుడైన యెహోవాకు పరిశుద్ధ ప్రజవు; భూమిమీద ఉన్న సమస్త ప్రజలలోనుండి తనకు అమూల్యమైన ప్రజగా[a] ఉండేందుకు యెహోవా నిన్ను ఎన్నుకున్నాడు.
  rationale: The revision replaces an insufficiently precise rendering of “holy” with “పరిశుద్ధ,” retains the collective singular address and all selection/belonging language, and relocates the lexical-alternative footnote anchor to the phrase it explains. It does not introduce a comparative-superiority or later doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
