review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory כִּי, Israel’s covenant relation to Yahweh, divine choice, selection from among all peoples, and the global scope of the final clause. However, “ప్రతిష్ఠితమైన” primarily means inaugurated, established, or ceremonially dedicated; it does not adequately express קָדוֹשׁ (“holy,” set apart).
  naturalness: The verse is generally fluent in modern standard Telugu. Moving the footnote anchor directly after the rendering of סְגֻלָּה makes its lexical reference clear. “పరిశుద్ధ ప్రజవు” is natural biblical-register Telugu while retaining the Hebrew collective singular.
  terminology: “పరిశుద్ధ” is the standard and semantically fuller equivalent for קָדוֹשׁ. “అమూల్యమైన ప్రజ” suitably represents the valued-possession sense of סְגֻלָּה while preserving the explicit word “people.” The footnote supplies the possession-oriented alternative without making it the main-text interpretation.
  issues:
  - severity: medium
    issue: “ప్రతిష్ఠితమైన ప్రజ” for עַם קָדוֹשׁ
    rationale: “ప్రతిష్ఠితమైన” can denote dedication or establishment, but it does not reliably convey the holiness/set-apart sense of קָדוֹשׁ. “పరిశుద్ధ ప్రజ” is both more faithful and standard Telugu biblical terminology.
  - severity: low
    issue: Footnote anchor is placed at the end of the sentence rather than beside the rendering of סְגֻלָּה.
    rationale: The note concerns “అమూల్యమైన ప్రజగా”; placing the anchor immediately there improves transparency and avoids ambiguity.
  revised_text: ఎందుకంటే నీవు నీ దేవుడైన యెహోవాకు పరిశుద్ధ ప్రజవు; భూమిమీద ఉన్న సమస్త ప్రజలలోనుండి తనకు అమూల్యమైన ప్రజగా[a] ఉండేందుకు యెహోవా నిన్ను ఎన్నుకున్నాడు.
