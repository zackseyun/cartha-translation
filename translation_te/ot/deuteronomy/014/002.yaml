source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: te
  text: ఎందుకంటే నీవు నీ దేవుడైన యెహోవాకు పరిశుద్ధ ప్రజవు; భూమిమీద ఉన్న సమస్త ప్రజలలోనుండి తనకు అమూల్యమైన ప్రజగా[a] ఉండేందుకు యెహోవా నిన్ను ఎన్నుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన ప్రత్యేక స్వాస్థ్యంగా ఉండే ప్రజగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ సְגֻלָּה అనే పదం ప్రత్యేకంగా విలువైన స్వాస్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని తెలియజేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַם קָדוֹשׁ
  choice: ప్రతిష్ఠితమైన ప్రజ
  rationale: קָדוֹשׁ ఇక్కడ కేవలం నైతిక పవిత్రతనే కాక దేవునికి ప్రత్యేకంగా వేరుచేయబడిన ఒడంబడిక ప్రజ అనే భావాన్ని కలిగిస్తుంది; ‘ప్రతిష్ఠితమైన’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: ל సూచించే సంబంధం లేదా చెందుదలను సహజంగా నిలుపుతుంది; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: నిన్ను ... యెహోవా ఎన్నుకున్నాడు
  rationale: בחר ב అనే హీబ్రూ ప్రయోగంలో ב ఎంపిక చేయబడిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ప్రత్యక్ష కర్మతో చెప్పడం సహజం.
- source_word: לִהְיוֹת לוֹ
  choice: తనకు ... ఉండేలా
  rationale: ఎన్నుకోవడంలోని ఉద్దేశం లేదా ఫలితాన్ని, అలాగే దేవునికి చెందే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְעַם סְגֻלָּה
  choice: అమూల్యమైన ప్రజగా
  rationale: סְגֻלָּה ప్రత్యేకంగా విలువైన స్వాస్థ్యం లేదా సంపదను సూచిస్తుంది; עַם అనే ‘ప్రజ’ పదాన్ని కూడా నిలుపుతూ సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: מִכֹּל הָעַמִּים
  choice: సమస్త ప్రజలలోనుండి
  rationale: מן ఇక్కడ అందరిలోనుండి ఎంపికను సూచిస్తుంది; ఇతరులకంటే ఉన్నతులు అనే అదనపు భావాన్ని చేర్చదు.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: భూమిమీద ఉన్న
  rationale: భూమిపై నివసించే సమస్త ప్రజలను సూచించే హీబ్రూ నానుడిని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ఎన్నిక స్వభావం
  choice: దేవుడు సమస్త ప్రజలలోనుండి ఎన్నుకొని తనకు చెందిన అమూల్యమైన ప్రజగా చేసుకున్న ఒడంబడిక సంబంధంగా అనువదించడం
  alternative: מִכֹּל ను ‘సమస్త ప్రజలకంటే ఉన్నతంగా’ అని అనువదించడం లేదా తరువాతి ఎన్నిక సిద్ధాంతాలను వాక్యంలోకి చేర్చడం
  rationale: హీబ్రూ వాక్యం దేవుని ఎంపికను, ఆయనకు చెందడాన్ని, ప్రత్యేక విలువను స్పష్టంగా చెబుతుంది; అయితే జాతిపరమైన ఆధిక్యాన్ని గానీ తరువాతి సిద్ధాంత వ్యవస్థలను గానీ స్వయంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. ఏకవచన ‘నీవు/నిన్ను’ ద్వారా హీబ్రూ సమూహాన్ని ఉద్దేశించిన ఏకవచనాన్ని నిలిపింది. యెహోవా అనే ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా ఉంచింది.
