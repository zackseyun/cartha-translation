source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: te
  text: ఆ వెండిని[a] నీ మనసు ఆశపడే దేనికైనా—పశువులైనా, గొర్రెలు మేకలైనా[b], ద్రాక్షామద్యమైనా, మత్తు పానీయమైనా[c], లేదా నీ మనసు కోరే మరేదానికైనా—వెచ్చించాలి. అక్కడ నీ దేవుడైన యహ్వే సన్నిధిలో నీవు భోజనం చేసి, నీవూ నీ ఇంటివారూ సంతోషించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘వెండి’; ఇక్కడ అది డబ్బును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలపదం గొర్రెలు, మేకలు వంటి చిన్న మంద పశువులను సమష్టిగా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘మత్తు పానీయం’ అనేది ద్రాక్షామద్యం కాకుండా మత్తు కలిగించే మరో రకమైన పానీయం.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: ఆ వెండిని ... వెచ్చించాలి
  rationale: వాణిజ్య సందర్భంలో נָתַן అనే ‘ఇవ్వడం’ భావం డబ్బును వస్తువుల కోసం ఖర్చుచేయడాన్ని సూచిస్తుంది. הַכֶּסֶף‌ను ‘వెండి’గా ఉంచి, అది ధనం అనే అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: תְּאַוֶּה נַפְשְׁךָ / תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: నీ మనసు ఆశపడే / నీ మనసు కోరే
  rationale: נֶפֶשׁ ఇక్కడ వేరుగా ఉన్న అమూర్త ఆత్మను కాక వ్యక్తి అంతరంగ కోరికను సూచిస్తుంది. రెండు సమాంతరమైన, కానీ వేర్వేరు క్రియలైన ‘ఆశపడు’ మరియు ‘కోరు’ భావాలను నిలిపాం.
- source_word: בַּבָּקָר
  choice: పశువులు
  rationale: בָּקָר గోవుల జాతికి చెందిన మంద పశువులను సమష్టిగా సూచిస్తుంది; సాధారణ తెలుగు పాఠకునికి ‘పశువులు’ సహజంగా ఉంటుంది.
- source_word: וּבַצֹּאן
  choice: గొర్రెలు మేకలు
  rationale: צֹאן గొర్రెలతో మాత్రమే పరిమితం కాక గొర్రెలు, మేకలు వంటి చిన్న మంద పశువులను సూచించగలదు. అందువల్ల మూలంలోని విస్తృతార్థాన్ని స్పష్టంగా తెలిపాం.
- source_word: וּבַיַּיִן
  choice: ద్రాక్షామద్యం
  rationale: יַיִן మద్యపానమైన ద్రాక్షారసాన్ని సూచిస్తుంది. ‘ద్రాక్షామద్యం’ ఆధునిక తెలుగులో దాని స్వభావాన్ని అస్పష్టత లేకుండా తెలియజేస్తుంది.
- source_word: וּבַשֵּׁכָר
  choice: మత్తు పానీయం
  rationale: שֵׁכָר ద్రాక్షామద్యం కాక మరొక మత్తు కలిగించే పానీయాన్ని సూచిస్తుంది. నిర్దిష్టంగా ‘బీరు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృతార్థాన్ని నిలిపాం.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: అక్కడ ... భోజనం చేసి
  rationale: ‘అక్కడ’ అనేది పరిసర సందర్భంలో యహ్వే ఎన్నుకునే ఆరాధనా స్థలాన్ని సూచిస్తుంది; אָכַל సాధారణంగా తినడాన్ని, ఇక్కడ పండుగ భోజనాన్ని సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యహ్వే సన్నిధిలో
  rationale: לִפְנֵי యొక్క సన్నిధి భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: నీవూ నీ ఇంటివారూ సంతోషించాలి
  rationale: בַּיִת ఇక్కడ భవనాన్ని కాక గృహస్థులను సూచిస్తుంది. ఆరాధనా విందులోని సామూహిక ఆనందాన్ని సహజంగా వ్యక్తపరిచాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా, దాని సాధారణ పండితపరమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: మద్యపాన పదాలను మృదూకరించాలా అనే ప్రశ్న
  choice: ద్రాక్షామద్యం, మత్తు పానీయం
  alternative: ద్రాక్షారసం, పానీయం
  rationale: మూలంలోని יַיִן మరియు שֵׁכָר రెండూ మత్తు కలిగించే పానీయాలను స్పష్టంగా పేర్కొంటాయి. సిద్ధాంతపరమైన అభిరుచితో వాటి భావాన్ని మసకబార్చలేదు.
- issue: נֶפֶשׁ‌ను ‘ఆత్మ’గా పదశః ఇవ్వాలా అనే ప్రశ్న
  choice: మనసు
  alternative: ప్రాణం / ఆత్మ / ఆకలి
  rationale: ఈ ఆహారపానీయాల సందర్భంలో נֶפֶשׁ సంపూర్ణ వ్యక్తి యొక్క కోరికను సూచిస్తుంది. ‘మనసు’ సహజమైన తెలుగు కాగా, ‘ఆకలి’ అని ఇవ్వడం కోరికను ఆహారానికి మాత్రమే అనవసరంగా పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ‘నీవు’ ఏకవచన సంబోధనతో అనువదించాం. ఆజ్ఞాత్మక వాక్యప్రవాహాన్ని తెలుగులో సహజమైన ‘వెచ్చించాలి / సంతోషించాలి’ రూపాలతో ఉంచాం. పండుగ భోజనం, కుటుంబ సమేత ఆనందం, దైవసన్నిధి అనే మూలపాఠపు గంభీరమైనప్పటికీ ఉత్సవభరితమైన స్వరాన్ని కాపాడాం.
