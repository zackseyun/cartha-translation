translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన ఆజ్ఞారూపం వాడబడింది. హెబ్రీ మూలంలోని తీవ్రతను ‘తప్పకుండా’తో, వార్షిక పునరావృతిని ‘ప్రతి సంవత్సరం’తో సహజంగా వ్యక్తం చేశాం. ఏ మతసంఘానికి ప్రత్యేకమైన సాంకేతిక పదజాలాన్ని చేర్చలేదు.
