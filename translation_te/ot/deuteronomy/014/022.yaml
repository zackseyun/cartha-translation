  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: te
  text: నీ పొలంలో నీవు విత్తిన దాని దిగుబడి అంతటిలో పదోవంతును ప్రతి సంవత్సరం తప్పకుండా కేటాయించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ విత్తనం యొక్క సమస్త దిగుబడి, పొలం నుండి వచ్చేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: పదోవంతును తప్పకుండా వేరుచేయాలి
  rationale: ఒకే ధాతువు తీవ్రతార్థక రూపంలో పునరుక్తమై ఆజ్ఞను బలపరుస్తోంది. ‘తప్పకుండా’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది; ‘పదోవంతును వేరుచేయాలి’ దశమభాగం ఇవ్వడానికి ప్రత్యేకంగా కేటాయించడాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל תְּבוּאַת זַרְעֶךָ
  choice: నీ విత్తనపు పంట అంతటిలో
  rationale: תְּבוּאָה వ్యవసాయ దిగుబడిని సూచిస్తుంది; זֶרַע అక్షరార్థంగా ‘విత్తనం’ అయినా ఇక్కడ విత్తినదాని వల్ల వచ్చిన పంటను సూచిస్తుంది. ‘విత్తనపు పంట’ మూల చిత్రాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: నీ పొలం ఇచ్చే
  rationale: అక్షరార్థంగా ‘పొలం నుండి బయటికి వచ్చేది.’ ‘పొలం ఇచ్చే’ అనేది అదే వ్యవసాయ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; మూలంలోని సంక్షిప్త సంబంధాన్ని అనవసరంగా విస్తరించదు.
- source_word: שָׁנָה שָׁנָה
  choice: ప్రతి సంవత్సరం
  rationale: పదపునరుక్తి క్రమమైన వార్షిక ఆచరణను సూచిస్తుంది. ‘ప్రతి సంవత్సరం’ ఆధునిక తెలుగులో సహజంగా అదే పంపిణీయ భావాన్ని వ్యక్తం చేస్తుంది.
