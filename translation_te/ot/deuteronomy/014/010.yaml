translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, ధర్మశాస్త్ర నిషేధానికి తగిన గంభీరతతో అనువదించబడింది. మూలంలోని సమగ్ర నిషేధం మరియు ఆచారపరమైన అపవిత్రత వర్గం నిలుపబడ్డాయి.
