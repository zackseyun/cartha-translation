review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comprehensive prohibition concerning aquatic creatures lacking fins and scales, and it retains the concluding purity classification relative to the addressees. However, the coordinated features should be more explicitly linked with Telugu conjunctions for clear correspondence to the Hebrew phrase.
  naturalness: The wording is generally modern and clear. “రెక్కలూ పొలుసులూ లేనిదేదీ” is smoother and more idiomatic than the comma-separated “రెక్కలు, పొలుసులు లేనిదేదీ.”
  terminology: “అపవిత్రమైనది” can communicate the sense, but “అశుద్ధమైనది” more directly and conventionally represents טָמֵא as a ritual-purity category, without suggesting a moral judgment.
  issues:
  - severity: low
    issue: The paired anatomical terms are separated only by a comma.
    rationale: Hebrew explicitly coordinates “fins and scales.” Using “రెక్కలూ పొలుసులూ” makes the pair and the scope of their absence clear in natural Telugu.
  - severity: low
    issue: The ritual-purity term is rendered “అపవిత్రమైనది.”
    rationale: “అశుద్ధమైనది” is the more precise standard Telugu equivalent for the technical purity status denoted by טָמֵא in dietary-law contexts.
  revised_text: కాని రెక్కలూ పొలుసులూ లేనిదేదీ మీరు తినకూడదు; అది మీకు అశుద్ధమైనది.
  revised_footnotes: []
  revision_rationale: The revision preserves the Hebrew’s comprehensive contrast, prohibition, and relational purity classification. It improves coordination of “fins and scales” and uses a more precise ritual-purity term in modern standard Telugu.
