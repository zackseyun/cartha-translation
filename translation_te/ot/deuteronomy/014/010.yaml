id: DEU.14.10
reference: Deuteronomy 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: te
  text: కాని రెక్కలూ పొలుసులూ లేనిదేదీ మీరు తినకూడదు; అది మీకు అశుద్ధమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: కాని ... దేదీ
  rationale: כֹל యొక్క సమగ్ర భావాన్ని తెలుగులో ‘లేనిదేదీ’ అనే నిర్మాణం సహజంగా తెలియజేస్తుంది; ముందటి అనుమతికి విరుద్ధంగా వచ్చే నిషేధాన్ని ו ఇక్కడ ‘కాని’గా సూచిస్తుంది.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: లేని
  rationale: אֵין לוֹ వ్యక్తం చేసే ‘కలిగి ఉండకపోవడం’ అనే భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ‘లేని’ తెలియజేస్తుంది.
- source_word: סְנַפִּיר
  choice: రెక్కలు
  rationale: చేపల సందర్భంలో ఈ పదం ఈదేందుకు ఉపయోగపడే fins‌ను సూచిస్తుంది; సాధారణ తెలుగు పాఠకులకు ‘రెక్కలు’ సులభంగా అర్థమవుతుంది, వర్గవివరణలో బహువచనం సహజం.
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: పొలుసులు
  rationale: చేపల scales‌కు సహజమైన ప్రామాణిక తెలుగు పదం ‘పొలుసులు’; వర్గవివరణకు బహువచనం తగినది.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: న్యాయనియమ సందర్భంలోని రెండవ పురుష బహువచన నిషేధాన్ని ఆధునిక, గంభీరమైన తెలుగులో ‘మీరు తినకూడదు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: טָמֵא
  choice: అపవిత్రమైనది
  rationale: ఆచారశుద్ధి సందర్భంలో טָמֵא సూచించే వర్గాన్ని ‘అపవిత్రమైనది’ స్థిరంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: הוּא לָכֶם
  choice: అది మీకు ... అయినది
  rationale: ఇశ్రాయేలీయుల పట్ల ఆ జీవికి ఉన్న అపవిత్ర స్థితిని לָכֶם సూచిస్తుంది; ‘మీకు’ ఆ సంబంధ భావాన్ని నిలుపుతుంది.
