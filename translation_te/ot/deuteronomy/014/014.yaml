  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన ఆహార నియమాల జాబితా శైలిని అనుసరించాం. మూలంలోని వర్గీకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తూ పక్షి గుర్తింపులోని పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
