  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: te
  text: అప్పుడు దానిని వెండిగా మార్చి[a], ఆ వెండిని నీ చేతిలో కట్టుకొని[b], నీ దేవుడైన యాహ్వే ఎన్నుకునే స్థలానికి వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిని వెండికి మార్పిడి చేసి’ లేదా ‘దానిని డబ్బుగా మార్చి.’ హీబ్రూలో అక్షరార్థంగా ‘వెండి’ ఉంది; ఈ సందర్భంలో అది డబ్బుగా ఉపయోగించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ వెండిని నీ చేతిలో చుట్టి కట్టి’; అంటే, ప్రయాణం కోసం దానిని నీ అధీనంలో భద్రపరచుకొని.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: దానిని వెండిగా మార్చి
  rationale: ఇక్కడ మునుపటి వచనంలోని పదార్థాలను ప్రయాణానికి అనువుగా వెండికి మార్పిడి చేయడం ఉద్దేశం. ‘వెండి’ అనే మూలపదాన్ని నిలుపుతూ లావాదేవీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: ఆ వెండిని నీ చేతిలో మూటకట్టి
  rationale: צָרַר అనే క్రియలో కట్టడం లేదా చుట్టడం అనే స్పష్టమైన భావం ఉంది. ప్రయాణంలో వెండిని భద్రంగా తీసుకెళ్లే దృశ్యాన్ని ‘మూటకట్టి’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּיָדְךָ
  choice: నీ చేతిలో
  rationale: మూలంలోని స్పష్టమైన శరీరాంగ రూపకాన్ని నిలుపుతుంది; సందర్భంలో అది తన అధీనంలో భద్రంగా ఉంచుకోవడాన్నీ సూచిస్తుంది.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: స్థలానికి వెళ్లాలి
  rationale: הלך అనే సాధారణ ‘వెళ్లు’ భావాన్ని ఆధునిక తెలుగు నియమవాక్య శైలిలో సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר יִבְחַר
  choice: ఎన్నుకునే
  rationale: హీబ్రూ అసంపూర్ణ క్రియకు ఈ నియమ సందర్భంలో భవిష్యత్ సూచన ఉంది; తెలుగులో ‘ఎన్నుకునే’ అనే సంబంధ క్రియారూపం ఆ భావాన్ని సహజంగా మోస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే ‘నీ దేవుడు’ అనే భావాన్ని దైవనామంతో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నియమవాక్యానికి తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘వెండి,’ ‘చేతిలో’ అనే స్పష్టమైన రూపాలను నిలుపుతూ అవసరమైన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
