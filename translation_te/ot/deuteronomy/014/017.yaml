source:
  edition: WLC
  text: וְ/הַ/קָּאָ֥ת וְ/אֶֽת הָ/רָחָ֖מָ/ה וְ/אֶת הַ/שָּׁלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/017.yaml
  text: the pelican[a], the carrion vulture, and the cormorant[c][b],
translation:
  language: te
  text: గూడబాతు[a], రాబందు[b], నీటికాకి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని హీబ్రూ పక్షి పేర్ల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. ‘గూడబాతు’కు బదులు ‘ఎడారి గుడ్లగూబ’ లేదా కేవలం ‘గుడ్లగూబ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ఏ రకమైన రాబందును సూచిస్తుందో ఖచ్చితంగా తెలియదు; దీనిని సాధారణంగా ‘రాబందు’ లేదా ‘మృతమాంసం తినే రాబందు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం గూడబాతు లేదా చేపలను వేటాడే గుడ్లగూబ వంటి మరొక నీటిపక్షిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: గూడబాతు
  rationale: ఈ పక్షి పేరు యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం. సంప్రదాయంగా విస్తృతంగా వాడే ‘పెలికన్’కు సహజమైన ఆధునిక తెలుగు పేరు ‘గూడబాతు’; ప్రత్యామ్నాయ గుర్తింపులను పాదసూచికలో ఉంచాం.
- source_word: הָרָחָמָה
  choice: రాబందు
  rationale: ఇది మృతమాంసం తినే వేటపక్షిని సూచించే అవకాశం ఉంది. సాధారణ పాఠకులకు స్పష్టంగా అర్థమయ్యే విస్తృత తెలుగు పదం ‘రాబందు’ను ఎంచుకున్నాం; నిర్దిష్ట జాతి ఖచ్చితంగా తెలియదనే విషయాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: הַשָּׁלָךְ
  choice: నీటికాకి
  rationale: ఈ పదం చేపలను తినే నీటిపక్షిని సూచించే అవకాశం ఉంది; సాధారణంగా ‘కార్మొరంట్’గా గుర్తించే పక్షికి సహజమైన తెలుగు పేరు ‘నీటికాకి’. ఇతర సాధ్యమైన గుర్తింపులను పాదసూచికలో భద్రపరిచాం.
- source_word: וְ / וְאֶת
  choice: జాబితాలో కామాలతో సమన్వయం
  rationale: וְ పదాలను కలుపుతుంది; אֵת ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక సమానపదం అవసరం లేదు. ముందున్న వాక్య నిర్మాణంలో కలిసే జాబితా కావడంతో తెలుగు శైలికి అనుగుణంగా కామాలు వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు తెలిసిన పక్షి పేర్లను ఉపయోగించాం. ఇది ముందున్న నిషిద్ధ పక్షుల జాబితాలో కొనసాగుతున్న భాగం కాబట్టి క్రియను చేర్చకుండా సంక్షిప్త జాబితా రూపాన్ని నిలిపాం; మూలంలోని జాతి-గుర్తింపు అనిశ్చితిని పాదసూచికల్లో స్పష్టంగా భద్రపరిచాం.
