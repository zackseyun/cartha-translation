id: DEU.14.28
reference: Deuteronomy 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: te
  text: ప్రతి మూడు సంవత్సరాల చివరలో[b], ఆ సంవత్సరపు నీ పంట దిగుబడిలోని దశమభాగమంతా బయటకు తీసి, నీ పట్టణాల్లో[a] ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘నీ ద్వారాల్లో’; అంటే నీ పరిధిలోని పట్టణాల్లో లేదా నివాస ప్రాంతాల్లో.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ప్రతి మూడవ సంవత్సరంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: ప్రతి మూడేళ్ల ముగింపులో
  rationale: מִקְצֵה కాలపరంగా ‘ముగింపులో’ అని సూచిస్తుంది; సందర్భంలోని పునరావృత త్రైవార్షిక ఆచారాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ప్రతి మూడేళ్ల’ అని అనువదించాం. ‘ప్రతి మూడవ సంవత్సరంలో’ కూడా సాధ్యమైన పఠనం కాబట్టి పాదసూచికలో ఇచ్చాం.
- source_word: תּוֹצִיא
  choice: బయటకు తీసుకువచ్చి
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటకు తీసుకురావడం’ అనే స్పష్టమైన causative భావాన్ని నిలుపుతుంది.
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: నీ పంట దిగుబడిలోని దశమభాగమంతటినీ
  rationale: כָּל దశమభాగం మొత్తాన్ని నొక్కిచెబుతుంది; תְּבוּאָה భూమి నుండి లభించే పంట దిగుబడిని సూచిస్తుంది.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ఆ సంవత్సరంలో
  rationale: సంబంధిత సంవత్సరంలో లభించిన దిగుబడిని నేరుగా సూచించే సహజమైన అనువాదం.
- source_word: וְהִנַּחְתָּ
  choice: ఉంచాలి
  rationale: ఇక్కడ נוח హిఫీల్ రూపం దానిని ఒకచోట పెట్టడం లేదా నిల్వచేయడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘ఉంచాలి’ సహజంగా, విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో’; అయితే హెబ్రీయులో ఇది వ్యక్తి అధికార పరిధిలోని స్థానిక పట్టణాలు లేదా నివాస ప్రాంతాలను సూచించే స్థిర ప్రయోగం. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశిత భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. వ్యవసాయ సందర్భాన్ని స్పష్టం చేయడానికి ‘పంట దిగుబడి’ని, మొత్తం పదోవంతును సూచించడానికి ‘దశమభాగమంతటినీ’ని ఎంచుకున్నాం. హెబ్రీ మూలంలోని కాలవ్యక్తీకరణకు ఉన్న స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
