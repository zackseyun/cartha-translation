- from: ప్రతి మూడేళ్ల ముగింపులో[b], ఆ సంవత్సరంలో నీ పంట దిగుబడిలోని దశమభాగమంతటినీ బయటకు తీసుకువచ్చి, నీ పట్టణాల్లో[a] ఉంచాలి.
  to: ప్రతి మూడు సంవత్సరాల చివరలో[b], ఆ సంవత్సరపు నీ పంట దిగుబడిలోని దశమభాగమంతా బయటకు తీసి, నీ పట్టణాల్లో[a] ఉంచాలి.
  rationale: The revision is limited to improving Telugu idiom and clarifying that ‘that year’ qualifies the agricultural produce. It preserves the source’s imperative/legal force, the complete tithe, and the local-town sense of ‘within your gates.’ Footnote anchors and their meanings are retained.
