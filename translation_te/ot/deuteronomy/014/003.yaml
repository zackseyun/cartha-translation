  text: ఏ అసహ్యకరమైన దానినీ నీవు తినకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏ హేయమైన దానినీ.’ హీబ్రూ పదం అసహ్యకరమైన లేదా హేయమైన దానిని సూచిస్తుంది; ఇక్కడ అది తరువాత వచ్చే నిషిద్ధ ఆహారాల జాబితాను పరిచయం చేస్తుంది.
