lexical_decisions:
- source_word: לֹא
  choice: తినకూడదు
  rationale: నిషేధార్థక అవ్యయం; ఇక్కడ క్రియతో కలిపి ప్రత్యక్ష నిషేధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תֹאכַל
  choice: మీరు తినకూడదు
  rationale: Qal imperfect రెండవ పురుష ఏకవచనం; לֹאతో కలిసి ధర్మశాస్త్ర సందర్భంలో నేరుగా విధించిన నిషేధం. తెలుగు గౌరవ/సామూహిక సంబోధనలో ‘మీరు’ సహజంగా ఉంది.
- source_word: כָּל
  choice: దేనినీ
  rationale: ఏకవచన నామవాచకంతో నిషేధ వాక్యంలో సమగ్ర పరిధిని సహజ తెలుగు నిషేధ సర్వనామం తెలియజేస్తుంది.
- source_word: תּוֹעֵבָה
  choice: అసహ్యమైనది
  rationale: హేయమైనది, అసహ్యకరమైనది అనే బలమైన భావాన్ని నిలుపుతుంది; తరువాత వచ్చే నిషిద్ధ ఆహారాల జాబితాకు సందర్భోచితంగా ఉండి, కేవలం వ్యక్తిగత రుచికి పరిమితం చేయదు.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో నిషేధపు బలం
  choice: 'ప్రత్యక్ష న్యాయపరమైన నిషేధం: ‘అసహ్యమైన దేనినీ మీరు తినకూడదు.’'
  alternative: 'సాధారణ వర్ణన: ‘అసహ్యమైన దేనినీ మీరు తినరు.’'
  rationale: לֹאతో కూడిన imperfect ఈ ధర్మశాస్త్ర సందర్భంలో భవిష్యద్వాణి లేదా సాధారణ అలవాటు కంటే ఆజ్ఞాత్మక నిషేధాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘తినకూడదు’ నిషేధ బలాన్ని సహజంగా తెలియజేస్తుంది; ‘అసహ్యమైనది’ మూలంలోని బలమైన ప్రతికూల భావాన్ని నిలుపుతుంది.
