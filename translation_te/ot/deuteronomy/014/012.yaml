  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆహార నియమాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పక్షిజాతుల గుర్తింపులోని నిజమైన అనిశ్చితిని ప్రధాన పాఠ్యాన్ని భారంగా చేయకుండా పాదసూచికలో స్పష్టంగా నిలిపాం.
