id: DEU.14.12
reference: Deuteronomy 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר לֹֽא תֹאכְל֖וּ מֵ/הֶ֑ם הַ/נֶּ֥שֶׁר וְ/הַ/פֶּ֖רֶס וְ/הָֽ/עָזְנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: te
  text: 'వాటిలో మీరు తినకూడనివి ఇవి: గద్ద[a], ఎముకలు పగులగొట్టే రాబందు, నల్ల రాబందు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని హీబ్రూ పక్షుల పేర్లు ఏ జాతులను సూచిస్తున్నాయో ఖచ్చితంగా తెలియదు. ‘గద్ద’ అనేది ఒక పెద్ద రాబందును సూచించవచ్చు; ‘ఎముకలు పగులగొట్టే రాబందు’ను సంప్రదాయంగా ‘ఒసిఫ్రేజ్’ అని అనువదించారు; ‘నల్ల రాబందు’ స్థానంలో కొందరు ‘చేపల గద్ద’ లేదా ‘సముద్ర గద్ద’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: ఇవి
  rationale: హీబ్రూలో రూపం ఏకవచనంగా ఉన్నా, తరువాత వచ్చే పక్షుల జాబితాను పరిచయం చేస్తున్నందున తెలుగులో సహజంగా బహువచనమైన ‘ఇవి’ అని అనువదించాం.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: వాటిలో మీరు తినకూడనివి
  rationale: మునుపటి సందర్భంలోని పక్షుల వర్గాన్ని సూచించే מִן యొక్క విభాగార్థాన్ని ‘వాటిలో’ నిలుపుతూ, నిషేధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַנֶּשֶׁר
  choice: గద్ద
  rationale: ఈ పదం పెద్ద వేటపక్షిని సూచిస్తుంది; అది ఒక పెద్ద రాబందును సూచించే అవకాశం ఉన్నప్పటికీ, విస్తృతంగా గుర్తించబడిన సంప్రదాయ తెలుగు పదం ‘గద్ద’ను ప్రధాన పాఠ్యంలో ఉంచి అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: הַפֶּרֶס
  choice: ఎముకలు పగులగొట్టే రాబందు
  rationale: ఈ పేరు సాధారణంగా bearded vulture/ossifrage అనే, ఎముకలను పగులగొట్టి తినే రాబందుతో అనుసంధానించబడుతుంది. జాతి గుర్తింపులో కొంత అనిశ్చితి ఉన్నందున సాధారణ పాఠకునికి అర్థమయ్యే వివరణాత్మక పేరును ఎంచుకున్నాం.
- source_word: הָעָזְנִיָּה
  choice: నల్ల రాబందు
  rationale: ఖచ్చితమైన పక్షిజాతి వివాదాస్పదమైనా, ఆధునిక పండిత అనువాదాల్లో కనిపించే సాధారణ గుర్తింపును అనుసరించాం; ఇతర ప్రతిపాదనలను పాదసూచికలో నిలిపాం.
