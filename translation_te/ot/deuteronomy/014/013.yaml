  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: te
  text: ఎర్ర గద్దను[a], డేగను, గద్దను దాని జాతుల ప్రకారం;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పక్షుల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. సంప్రదాయ, ఆధునిక అనువాదాల్లో వీటిని ఎర్ర గద్ద, గద్ద, డేగ మొదలైన పేర్లతో భిన్నంగా పేర్కొన్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: ఎర్ర గద్ద
  rationale: ఈ పక్షి పేరు ఖచ్చితంగా ఏ జాతిని సూచిస్తుందో అనిశ్చితం. ఆధునిక నిఘంటువులు దీనిని సాధారణంగా ఒక రకమైన గద్దగా, తరచుగా red kiteగా గుర్తిస్తాయి; అందువల్ల స్పష్టమైన ఆధునిక తెలుగు పేరుగా ‘ఎర్ర గద్ద’ను ఎంచుకుని అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
- source_word: הָאַיָּה
  choice: డేగ
  rationale: ఇది ఒక వేటపక్షి పేరు; ‘డేగ’ సహజమైన ఆధునిక తెలుగు పదం, అలాగే చుట్టుపక్కల ఉన్న గద్దలకు సంబంధించిన హెబ్రీ పదాలనుంచి దీనిని వేరుగా ఉంచుతుంది.
- source_word: הַדַּיָּה
  choice: గద్దలు
  rationale: ఈ వేటపక్షిని సాధారణంగా kiteగా గుర్తిస్తారు. ఖచ్చితమైన పక్షిశాస్త్రీయ గుర్తింపు వివాదాస్పదమైనందున సహజమైన విస్తృత తెలుగు పదమైన ‘గద్ద’ను వాడాం.
- source_word: לְמִינָהּ
  choice: వాటి వాటి జాతుల
  rationale: ఈ సూత్రప్రాయ పదబంధం ఒకే పక్షిని కాక, దానికి చెందిన అన్ని రకాలను సూచిస్తుంది. తెలుగు జాబితా సందర్భంలో ‘వాటి వాటి జాతుల’ అనేది సహజంగా ఉండి వర్గీకరణ భావాన్ని నిలుపుతుంది.
- source_word: וְאֶת
  choice: మరియు అనే జాబితా సంబంధం
  rationale: వావ్ సంధి మరియు కర్మసూచక అవ్యయం జాబితాలోని అంశాలను కలుపుతాయి. తెలుగులో కర్మసూచక భాగానికి ప్రత్యేక అనువాదం అవసరం లేదు; విరామచిహ్నాలు, పదక్రమం ద్వారా జాబితా సంబంధం వ్యక్తమవుతుంది.
