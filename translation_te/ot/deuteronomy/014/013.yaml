translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆహార నియమాలకు సంబంధించిన జాబితా శైలిని సంక్షిప్తంగా నిలిపాం. మూడు వేర్వేరు హెబ్రీ పక్షి పేర్లను సాధ్యమైనంతవరకు వేరు చేశాం; అయితే వాటి పక్షిశాస్త్రీయ గుర్తింపులోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
