source:
  edition: WLC
  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: te
  text: నీ పట్టణాల్లో నివసించే లేవీయుణ్ణి నిర్లక్ష్యం చేయకూడదు.[a] ఎందుకంటే నీతోపాటు అతనికి వాటాగానీ వారసత్వంగానీ లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ పట్టణాల్లో’—అక్షరార్థంగా ‘నీ ద్వారాల్లో’; ఇది ఒకరి పట్టణాలు లేదా స్థానిక సమాజాలను సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: అంటే, ఇశ్రాయేలులోని ఇతర గోత్రాలవలె లేవీయునికి సాధారణ గోత్ర భూవాటా లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: లేవీయుణ్ణి
  rationale: నిర్దిష్ట ఏకవచనం ఇక్కడ లేవీయుల వర్గానికి ప్రాతినిధ్యం వహించే వ్యక్తిని సూచిస్తుంది. మూలంలో యాజకుడు అని లేదు కాబట్టి దానిని చేర్చలేదు.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో నివసించే
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో’ అయిన ఈ హీబ్రూ నుడికారం స్థానిక పట్టణాలు లేదా సమాజాలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు భావం సహజంగా అందేలా అనువదించబడింది.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: నిర్లక్ష్యం చేయకూడదు
  rationale: עזב అనే క్రియకు విడిచిపెట్టు, వదిలివేయు అనే అర్థాలు ఉన్నా, సామాజిక పోషణ సందర్భంలో అవసరమైన ఆదరణను పట్టించుకోకపోవద్దనే భావాన్ని ‘నిర్లక్ష్యం చేయకూడదు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵין לוֹ
  choice: అతనికి ... లేదు
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: חֵלֶק וְנַחֲלָה
  choice: వంతుగానీ వారసత్వ భూమిగానీ
  rationale: חֵלֶק వాటా లేదా వంతును, נַחֲלָה తరతరాలుగా లభించే భూస్వాస్థ్యాన్ని సూచిస్తుంది. తెలుగు జంట నిర్మాణం రెండూ లేవనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עִמָּךְ
  choice: నీతోపాటు
  rationale: మిగిలిన ఇశ్రాయేలీయులతో సమానంగా లేవీయునికి భూవాటా లేదనే తులనాత్మక, సామూహిక భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయునికి లేని వంతు, వారసత్వం యొక్క స్వభావం
  choice: ఇశ్రాయేలులో సాధారణ గోత్ర భూవాటా అతనికి లేదని సూచించడం
  alternative: నిర్దిష్టంగా భూమిని సూచించకుండా సాధారణ సామాజిక అణగారిన స్థితిని మాత్రమే సూచించడం
  rationale: ద్వితీయోపదేశకాండ సందర్భంలో ‘వంతు, వారసత్వం’ అనే జంట లేవీయులకు ప్రాదేశిక గోత్ర భూవాటా లేకపోవడాన్ని సూచిస్తుంది. ‘వారసత్వ భూమి’ ఈ నేపథ్యాన్ని సంక్షిప్తంగా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ న్యాయ-నిబంధన నుడికారాన్ని అక్షరార్థంగా అసహజంగా ఉంచకుండా భావాన్ని ప్రధాన వాక్యంలో ఇచ్చి, మూలచిత్రాన్ని పాదసూచికలో నమోదు చేశాం. ‘చేయకూడదు’ ఆజ్ఞాత్మక బలాన్ని నిలుపుతుంది.
