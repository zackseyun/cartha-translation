source:
  edition: WLC
  text: וְ/כָל בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: te
  text: డెక్క చీలి, అది రెండు భాగాలుగా విడిపోయి, నెమరు వేసే ప్రతి జంతువును మీరు తినవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “జంతువుల్లో డెక్కను విభజించి, రెండు డెక్కల చీలిక కలిగి, నెమరు వేసే ప్రతి జంతువును మీరు తినవచ్చు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: ప్రతి జంతువును
  rationale: וְכָל యొక్క సమగ్ర-వితరణ భావాన్ని సహజమైన తెలుగులో ‘ప్రతి’ తెలియజేస్తుంది. בְּהֵמָה ఇక్కడ ఆహార నియమానికి సంబంధించిన భూజంతువులను విస్తృతంగా సూచిస్తున్నందున ‘జంతువు’ సరైన ఆధునిక పదం.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: చీలిన డెక్క ఉండి
  rationale: డెక్క చీలి ఉండటమనే స్పష్టమైన జంతుశాస్త్రీయ లక్షణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: ఆ డెక్క పూర్తిగా రెండు భాగాలుగా విడిపోయి
  rationale: హీబ్రూ పదబంధం చీలికను బలపరుస్తూ డెక్క రెండు భాగాలుగా విభజించబడిందని పేర్కొంటుంది. ‘పూర్తిగా’ అనేది ఉపరితల చీలిక కాక నిజమైన విభజన అనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מַעֲלַת גֵּרָה
  choice: నెమరు వేసే
  rationale: మళ్లీ పైకి తెచ్చిన ఆహారాన్ని నమలే rumination ప్రక్రియకు ‘నెమరు వేయడం’ ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు ప్రయోగం.
- source_word: בַּבְּהֵמָה
  choice: జంతువుల్లో
  rationale: అర్హత కలిగిన జంతువును చర్చలోని జంతువుల వర్గంలో ఉంచే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: మీరు తినవచ్చు
  rationale: ఈ న్యాయసంబంధ సందర్భంలో క్రియ ఆజ్ఞకన్నా అనుమతిని సూచిస్తుంది. స్త్రీలింగ ఏకవచన కర్మ సర్వనామ భావం తెలుగులో ‘ప్రతి జంతువును’ అనే కర్మతో సహజంగా వ్యక్తమవుతుంది.
