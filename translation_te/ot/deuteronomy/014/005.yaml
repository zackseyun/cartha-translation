source:
  edition: WLC
  text: אַיָּ֥ל וּ/צְבִ֖י וְ/יַחְמ֑וּר וְ/אַקּ֥וֹ וְ/דִישֹׁ֖ן וּ/תְא֥וֹ וָ/זָֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: te
  text: జింక[a], గజెల్, దుప్పి, అడవి మేక, ఐబెక్స్, అడవి ఎద్దు, కొండ గొర్రె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని అనేక జంతువుల పేర్లకు ఖచ్చితమైన ఆధునిక జాతి గుర్తింపు తెలియదు. ‘దుప్పి’ ఫాలో జింక లేదా ఎర్ర జింక కావచ్చు; ‘అడవి మేక’ ఐబెక్స్ కావచ్చు; ‘ఐబెక్స్’ అడాక్స్ లేదా మరో అడవి మేకజాతి జంతువు కావచ్చు; ‘అడవి ఎద్దు’గా అనువదించిన పదం యాంటిలోప్‌ను లేదా ఆరోక్స్‌ అనే ప్రాచీన అడవి ఎద్దును సూచించి ఉండవచ్చు; ‘కొండ గొర్రె’ కొండ మేక లేదా షామ్వా కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: జింక
  rationale: జింక జాతికి చెందిన జంతువును సూచించే సహజమైన సాధారణ తెలుగు పదం; లింగం లేదా నిర్దిష్ట జాతిని అనవసరంగా నిర్ధారించదు.
- source_word: צְבִי
  choice: కృష్ణజింక
  rationale: ఈ పదాన్ని సాధారణంగా gazelleగా గుర్తిస్తారు. తెలుగు పాఠకులకు సుపరిచితమైన, సమీపమైన జింకజాతి పేరుగా ‘కృష్ణజింక’ను ఎంచుకున్నాం; ఖచ్చితమైన ఆధునిక జాతి సమీకరణం పూర్తిగా నిశ్చితం కాదు.
- source_word: יַחְמוּר
  choice: దుప్పి
  rationale: ఖచ్చితమైన జాతి వివాదాస్పదం. జింకజాతి జంతువును సూచించే సహజ తెలుగు పేరుగా ‘దుప్పి’ వాడబడింది; మరింత నిర్దిష్టమైన గుర్తింపును ప్రధాన పాఠంలో బలవంతంగా విధించలేదు.
- source_word: אַקּוֹ
  choice: అడవి మేక
  rationale: బహుశా అడవిలో నివసించే మేకజాతి జంతువు, ముఖ్యంగా ibexను సూచించవచ్చు. సాధారణ పాఠకునికి స్పష్టమైన ‘అడవి మేక’ను ప్రధాన పాఠంలో ఉంచాం.
- source_word: דִישֹׁן
  choice: ఐబెక్స్
  rationale: జంతువు ఖచ్చితంగా ఏదో తెలియదు; ibex ఒక సాధ్యమైన గుర్తింపు. పక్కనే ఉన్న אַקּוֹతో ఒకే పదాన్ని వాడకుండా మూలంలోని వేర్వేరు పేర్లను నిలిపేందుకు ఈ రూపం ఎంచుకున్నాం.
- source_word: תְאוֹ
  choice: అడవి ఎద్దు
  rationale: ఈ పదం అడవి bovine జంతువును సూచించవచ్చని హెబ్రీ ఆధారాలు, అనుబంధ వాడుక సూచిస్తాయి. ‘అడవి ఎద్దు’ సహజమైన తెలుగు; ‘జింకజాతి జంతువు’ అనే ప్రత్యామ్నాయం అనిశ్చితిగా నిలుస్తుంది.
- source_word: זָמֶר
  choice: కొండ గొర్రె
  rationale: ఖచ్చితమైన జాతి తెలియదు. పర్వతప్రాంతపు గొర్రె లేదా మేకజాతి జంతువు అనే సాధ్యమైన భావాన్ని సులభంగా తెలియజేస్తుంది.
