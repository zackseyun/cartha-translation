  register: ఆహార నియమంలోని సంక్షిప్త జాబితా శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో సులభంగా గుర్తించగల పేర్లు వాడాం. మూలంలోని అరుదైన జంతు పేర్లపై ఉన్న నిజమైన అనిశ్చితిని ఒకే పాదసూచికలో స్పష్టంగా నమోదు చేశాం.
