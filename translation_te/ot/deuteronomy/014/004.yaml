translation:
  language: te
  text: 'మీరు తినదగిన పశువులు ఇవి: ఎద్దు, గొర్రె, మేక.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “మీరు తినదగిన పశువు ఇది” అని ఏకవచన రూపాలు ఉన్నాయి; తరువాతి ఉదాహరణల జాబితాను ఒక సమూహవర్గంగా పరిచయం చేయడానికి అవి వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: పశువులు ఇవి
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నప్పటికీ, అది తరువాత వచ్చే జాబితాను ఒక సమూహవర్గంగా పరిచయం చేస్తుంది. సహజమైన ఆధునిక తెలుగులో బహువచనం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: మీరు తినదగిన
  rationale: ఈ సందర్భంలో క్రియ ఆజ్ఞకన్నా అనుమతిని, అంటే ఆహారంగా స్వీకరించవచ్చనే భావాన్ని తెలియజేస్తుంది.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఇది గోవు జాతికి చెందిన పశువును సూచించే సాధారణ పదం. తెలుగు బైబిలు శైలిలోనూ సాధారణ వాడుకలోనూ ‘ఎద్దు’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: שֵׂה כְשָׂבִים
  choice: గొర్రె
  rationale: చిన్న మందపశువులలో గొర్రె జాతిని సూచించే పదబంధం ఇది; వయస్సును పరిమితం చేసే ‘గొర్రెపిల్ల’ కంటే ‘గొర్రె’ సరైన వర్గపదం.
- source_word: וְשֵׂה עִזִּים
  choice: మేక
  rationale: మేక జాతికి చెందిన చిన్న మందపశువును సూచిస్తుంది; వయస్సును అనవసరంగా పరిమితం చేయకుండా ‘మేక’ మూలంలోని వర్గార్థాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పశువులు’ అనే పదం ఈ జాబితాలోని పెంపుడు భూజంతువులకు తగినది. మూలంలోని ఏకవచన సమూహార్థాన్ని ప్రధాన వాక్యంలో సహజమైన బహువచనంతో అందించి, అక్షరరూపాన్ని పాదసూచికలో సంరక్షించాం.
