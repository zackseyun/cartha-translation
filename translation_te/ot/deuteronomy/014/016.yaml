  text: the little owl[a], the great owl, and the white owl;
translation:
  language: te
  text: చిన్న గుడ్లగూబను,[a] పెద్ద గుడ్లగూబను, మరియు తెల్ల గుడ్లగూబను;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పక్షుల హీబ్రూ పేర్లు ఏ జాతులను ఖచ్చితంగా సూచిస్తున్నాయో తెలియదు. సంప్రదాయ, ఆధునిక అనువాదాలు వీటిని వివిధ రకాల గుడ్లగూబలుగా లేదా ఇతర పక్షులుగా పేర్కొంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: చిన్న గుడ్లగూబ
  rationale: అపవిత్ర పక్షుల జాబితాలో ఇది ఒక రకమైన గుడ్లగూబను సూచిస్తున్నట్లు భావించబడుతుంది. ఖచ్చితమైన పక్షిజాతి తెలియకపోయినా, మిగతా రెండు పేర్లతో ఉన్న భేదాన్ని నిలుపుకోవడానికి ‘చిన్న గుడ్లగూబ’ అని అనువదించాం.
- source_word: יַנְשׁוּף
  choice: పెద్ద గుడ్లగూబ
  rationale: ఇది రాత్రివేళ సంచరించే పక్షిని, సంప్రదాయంగా గుడ్లగూబ రకాన్ని సూచిస్తుందని భావిస్తారు. మూడు వేర్వేరు హీబ్రూ పేర్ల మధ్య భేదాన్ని నిలుపుకోవడానికి ‘పెద్ద గుడ్లగూబ’ అని అనువదించాం.
- source_word: תִּנְשָׁמֶת
  choice: తెల్ల గుడ్లగూబ
  rationale: ఈ పక్షుల జాబితాలో ఇది గుడ్లగూబ జాతికి చెందిన పక్షిని సూచించే అవకాశం ఎక్కువ. ఖచ్చితమైన జాతి నిర్ధారణ కానప్పటికీ, ముందున్న పేర్లతో భేదాన్ని చూపే సంప్రదాయ అనువాదంగా ‘తెల్ల గుడ్లగూబ’ను ఎంచుకున్నాం.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది హీబ్రూలో ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు. జాబితా సందర్భంలో ‘ను’ విభక్తి ద్వారా దాని వ్యాకరణ పాత్ర వ్యక్తమైంది.
- source_word: וְ
  choice: జాబితా అనుసంధానం
  rationale: హీబ్రూ సంధిపదం జాబితాలోని అంశాలను కలుపుతుంది. సహజమైన తెలుగు జాబితా నిర్మాణంలో ‘ను’ విభక్తితో, చివర విరామచిహ్నంతో అనుసంధానం వ్యక్తమైంది.
- source_word: הַ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: హీబ్రూ నిర్దిష్ట ఉపపదం ప్రతి పక్షిని ఒక వర్గంగా సూచిస్తుంది. తెలుగులో ఈ జాబితా సందర్భంలో ప్రత్యేక నిర్దిష్ట ఉపపదం అవసరం లేదు.
