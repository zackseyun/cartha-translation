  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన జాబితా శైలిని ఉపయోగించాం. మూలంలోని మూడు వేర్వేరు పక్షిపేర్ల భేదాన్ని నిలిపి, వాటి ఖచ్చితమైన జంతుశాస్త్రీయ గుర్తింపుపై ఉన్న అనిశ్చితిని పాదసూచికలో స్పష్టంగా తెలిపాం.
