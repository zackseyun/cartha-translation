id: DEU.15.21
reference: Deuteronomy 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: te
  text: కానీ దానికి ఏదైనా లోపం ఉంటే—కుంటితనం గాని, గుడ్డితనం గాని, ఏదైనా తీవ్రమైన లోపం గాని ఉంటే—దాన్ని నీ దేవుడైన యెహోవాకు బలిగా అర్పించకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: కానీ ... ఉంటే
  rationale: ముందటి ఆజ్ఞతో ఉన్న వ్యత్యాసాన్ని, షరతును సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: దానికి ఏదైనా లోపం ఉంటే
  rationale: అక్షరార్థంగా ‘దానిలో లోపం ఉంటే’; తెలుగులో జంతువుకు శారీరక లోపం ఉండడాన్ని సహజంగా తెలిపే నిర్మాణం.
- source_word: פִּסֵּחַ אוֹ עִוֵּר
  choice: కుంటిదైనా, గుడ్డిదైనా
  rationale: బలి జంతువులోని రెండు నిర్దిష్ట శారీరక లోపాలను నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּל מוּם רָע
  choice: మరేదైనా తీవ్రమైన లోపం
  rationale: רָע ఇక్కడ నైతిక చెడును కాక, బలికి అనర్హం చేసే తీవ్రమైన లేదా అంగీకారయోగ్యం కాని శారీరక లోపాన్ని సూచిస్తుంది.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: దాన్ని ... బలిగా అర్పించకూడదు
  rationale: కేవలం వధించడం కాక, ఆరాధనాపరమైన బలి చర్యను సూచించే నిషేధంగా అనువదించబడింది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: ఒడంబడిక నామాన్ని వ్యక్తినామంగా ఉంచి, ఏకవచన ప్రత్యక్ష సంబోధనను కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలోని ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. బలి ధర్మశాస్త్ర సందర్భాన్ని ‘బలిగా అర్పించకూడదు’ అనే పదబంధం స్పష్టం చేస్తుంది; మూలంలోని ఉదాహరణలు మరియు వాటిని విస్తరించే సాధారణ వర్గం రెండూ నిలుపబడ్డాయి.
