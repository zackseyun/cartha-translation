id: DEU.15.9
reference: Deuteronomy 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: te
  text: నీ హృదయంలో, ‘విడుదల సంవత్సరం అయిన ఏడవ సంవత్సరం దగ్గరపడింది’ అని అనుకునే నీచమైన ఆలోచన ఉండకుండా జాగ్రత్తపడు. నీ పేద సహోదరునిపట్ల పిసినారిగా ఉండి[a] అతనికి ఏమీ ఇవ్వకుండా పోకూడదు. అలా చేస్తే అతడు నీకు వ్యతిరేకంగా యాహ్వేకు మొరపెడతాడు; అప్పుడు నీకు పాపం కలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ కన్ను చెడ్డదై.” ఇది అవసరంలో ఉన్నవానికి ఇవ్వడానికి ఇష్టపడకుండా, అతనిపట్ల పిసినారిగా లేదా అయిష్టంగా ఉండడాన్ని తెలిపే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: తనను తాను కాపాడుకోవాలనే హెచ్చరికను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: నీ హృదయంలో ... దుష్ట ఆలోచన
  rationale: דָבָר విస్తృతార్థకమైనా, హృదయం మరియు తరువాతి ‘అనే’ భావవిషయంతో కలిసి ఇక్కడ అంతరంగ ఆలోచనను సూచిస్తుంది; בְלִיַּעַל దాని నైతిక దుష్టత్వాన్ని తెలియజేస్తుంది.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: అప్పుల విడుదల సంవత్సరం
  rationale: ద్వితీయోపదేశకాండము 15 సందర్భంలో ఏడవ సంవత్సరంలో అప్పుల నుంచి విడుదలను సూచిస్తుంది; ‘అప్పుల’ అనే సందర్భస్పష్టీకరణ సాధారణ పాఠకునికి అర్థాన్ని తెలియజేస్తుంది.
- source_word: וְרָעָה עֵינְךָ
  choice: నీ చూపు కఠినమై
  rationale: అక్షరార్థమైన ‘నీ కన్ను చెడ్డదై’ అనే హెబ్రీయ నుడికారాన్ని తెలుగులో సహజంగా, అవసరంలో ఉన్నవాని పట్ల కనికరం లేక కఠినంగా ప్రవర్తించే భావంతో అందిస్తుంది; మూల నుడికారాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: అవసరంలో ఉన్న నీ సహోదరునిపట్ల
  rationale: אֶבְיוֹן యొక్క ‘నిరుపేద/అవసరంలో ఉన్న’ భావాన్ని, אָח యొక్క ఒడంబడిక సమాజానికి చెందిన సహోదరుడు అనే కుటుంబ భాషను నిలుపుతుంది.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: నీవు అతనికి ఏమీ ఇవ్వకపోవచ్చు
  rationale: నిరాకరణ యొక్క ఆచరణాత్మక ఫలితాన్ని స్పష్టంగా తెలుపుతుంది; హెచ్చరిక వాక్యంలోని సంభావ్య పరిణామ క్రమాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: అతడు నీకు వ్యతిరేకంగా యెహోవాకు మొరపెడితే
  rationale: కష్టంలో ఉన్నవాడు దేవుని న్యాయానికి విజ్ఞప్తి చేసే భావాన్ని ‘మొరపెట్టు’ సహజంగా అందిస్తుంది; עָלֶיךָ లోని ‘నీకు వ్యతిరేకంగా’ భావం నిలుపబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ మూలంలోని ప్రత్యేక దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: అది నీకు పాపంగా అవుతుంది
  rationale: ఆ నిరాకరణకు వ్యక్తి పాపబాధ్యత వహిస్తాడనే మూల భావాన్ని సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: ‘చెడ్డ కన్ను’ అనే హెబ్రీయ నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘నీ చూపు కఠినమై’; పాదటిప్పణిలో అక్షరార్థం
  alternative: నీ కన్ను చెడ్డదై
  rationale: తెలుగులో అక్షరానువాదం అపార్థానికి దారితీయవచ్చు. కాబట్టి దాని పిసినారితనం/కనికరంలేని భావాన్ని సహజంగా తెలిపి, మూల సాహిత్య రూపాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: אָחִיךָ యొక్క సామాజిక పరిధి
  choice: నీ సహోదరుడు
  alternative: నీ తోటి ఇశ్రాయేలీయుడు
  rationale: మూలంలోని కుటుంబసంబంధ భాషను నిలుపుతూ, ఇది కేవలం శారీరక తోబుట్టువును మాత్రమే సూచించదని పాదటిప్పణిలో వివరించాం.
- issue: שְׁמִטָּה యొక్క పరిధి
  choice: అప్పుల విడుదల
  alternative: రద్దు / మాఫీ
  rationale: ఈ అధ్యాయ సందర్భంలో అప్పుల నుంచి విడుదల ప్రధానాంశం. ‘విడుదల’ మూలపదంలోని విడిచిపెట్టే భావాన్ని నిలుపుతుంది; ‘అప్పుల’ అనే పదం సందర్భాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ఏకవచన ప్రత్యక్ష హెచ్చరికను నిలిపాం. ‘సహోదరుడు’ అనే ఒడంబడిక-సమాజ కుటుంబ భాషను ఉంచి, అవసరమైన నుడికార వివరణను మాత్రమే పాదటిప్పణిలో ఇచ్చాం.
