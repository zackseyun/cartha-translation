revisions:
- from: నీ హృదయంలో, ‘ఏడవ సంవత్సరం, అప్పుల విడుదల సంవత్సరం, దగ్గరపడింది’ అనే దుష్ట ఆలోచన కలగకుండా జాగ్రత్తపడు. దానివల్ల అవసరంలో ఉన్న నీ సహోదరునిపట్ల నీ చూపు కఠినమై[a], నీవు అతనికి ఏమీ ఇవ్వకపోవచ్చు. అప్పుడు అతడు నీకు వ్యతిరేకంగా యెహోవాకు మొరపెడితే, అది నీకు పాపంగా అవుతుంది.
  to: నీ హృదయంలో, ‘విడుదల సంవత్సరం అయిన ఏడవ సంవత్సరం దగ్గరపడింది’ అని అనుకునే నీచమైన ఆలోచన ఉండకుండా జాగ్రత్తపడు. నీ పేద సహోదరునిపట్ల పిసినారిగా ఉండి[a] అతనికి ఏమీ ఇవ్వకుండా పోకూడదు. అలా చేస్తే అతడు నీకు వ్యతిరేకంగా యాహ్వేకు మొరపెడతాడు; అప్పుడు నీకు పాపం కలుగుతుంది.
  rationale: The revision removes the added causal connective, expresses the Hebrew warning as a coherent prohibition, uses a natural Telugu equivalent for the begrudging-stingy ‘evil eye’ idiom while preserving its literal form in a footnote, restores the consequence of the poor person’s appeal, and aligns the divine name with the POB Yahweh policy. Supplementary notes supply the release-year alternative and the intended social scope of “brother.”
  reviewer_model: gpt-5.6-terra
