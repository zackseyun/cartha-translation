review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the permissive sense, the local-community sense of בִּשְׁעָרֶיךָ, the ritual contrast between the unclean and clean, and the comparison with game animals. However, ‘పట్టణాల్లోనే’ adds an unwarranted restrictive emphasis (‘only/in those towns alone’), absent from the Hebrew. ‘పవిత్రుడైనవాడు’ can mean ‘holy’ rather than ritually clean, so ‘శుద్ధుడైనవాడు’ is more precise.
  naturalness: The revised wording is natural modern standard Telugu and avoids repetition while retaining the Hebrew comparison clearly.
  terminology: ‘ఆచారపరంగా అపవిత్రుడైనవాడు’ and ‘ఆచారపరంగా శుద్ధుడైనవాడు’ accurately mark ritual status rather than moral character or holiness. ‘లేడి’ and ‘జింక’ retain the distinction between gazelle/antelope-like game and deer.
  issues:
  - severity: medium
    issue: ‘పట్టణాల్లోనే’ introduces restrictive emphasis.
    rationale: The Hebrew means ‘in/within your gates’ and does not contain a particle meaning ‘only.’ ‘నే’ should be removed.
  - severity: medium
    issue: ‘పవిత్రుడైనవాడు’ is not the best equivalent for הַטָּהוֹר in this ritual-status contrast.
    rationale: In Telugu, ‘పవిత్రుడు’ commonly denotes holiness. ‘శుద్ధుడు,’ explicitly qualified as ritual/ceremonial, better represents ‘clean.’
  - severity: low
    issue: The game-animal comparison is more idiomatic as ‘లేడి, జింకలను తిన్నట్లే.’
    rationale: This retains the comparison without the slightly cumbersome repeated ‘తినే విధంగా.’
  revised_text: నీ పట్టణాల్లో దానిని తినవచ్చు. ఆచారపరంగా అపవిత్రుడైనవాడూ ఆచారపరంగా శుద్ధుడైనవాడూ ఇద్దరూ[b] లేడి, జింకలను తిన్నట్లే దానిని తినవచ్చు.
