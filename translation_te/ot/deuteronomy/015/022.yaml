  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: te
  text: నీ పట్టణాల్లో దానిని తినవచ్చు. ఆచారపరంగా అపవిత్రుడైనవాడూ ఆచారపరంగా శుద్ధుడైనవాడూ ఇద్దరూ[b] లేడి, జింకలను తిన్నట్లే దానిని తినవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అంటే, ఆచారపరంగా అపవిత్ర స్థితిలో ఉన్నవారూ ఆచారపరంగా శుద్ధ స్థితిలో ఉన్నవారూ దానిని తినవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లోనే
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో’ అయినా, ఇక్కడ ‘ద్వారాలు’ పట్టణాలను లేదా స్థానిక నివాస సముదాయాలను సూచించే హీబ్రూ వాడుక. ఆధునిక తెలుగులో భావం సహజంగా అందేందుకు ‘నీ పట్టణాల్లోనే’ అని అనువదించాం.
- source_word: תֹּאכֲלֶנּוּ
  choice: దాన్ని తినవచ్చు
  rationale: రెండవ పురుష ఏకవచన క్రియకు మూడవ పురుష పుంలింగ ఏకవచన కర్మప్రత్యయం ఉంది; ముందు సందర్భంలోని జంతువును సూచిస్తుంది. సందర్భంలోని అనుమతి భావాన్ని ‘తినవచ్చు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַטָּמֵא
  choice: ఆచారపరంగా అపవిత్రుడైనవాడు
  rationale: ఇది నైతిక దుష్టత్వాన్ని కాక ఆచార సంబంధమైన స్థితిని సూచిస్తుంది. అపార్థం రాకుండా ‘ఆచారపరంగా’ అని స్పష్టం చేశాం.
- source_word: וְהַטָּהוֹר
  choice: పవిత్రుడైనవాడు
  rationale: הַטָּמֵאకు జతగా ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది. తెలుగులో వ్యక్తిని సూచించేందుకు ‘పవిత్రుడైనవాడు’ అనే రూపం వాడాం; ఆచారపరమైన భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: יַחְדָּו
  choice: ఇద్దరూ
  rationale: రెండు ఆచార స్థితుల్లో ఉన్నవారూ సమానంగా తినవచ్చనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తప్పనిసరిగా ఒకే సమయంలో కలిసి తినాలని సూచించదు.
- source_word: כַּצְּבִי
  choice: దుప్పిని తినే విధంగా
  rationale: צְבִי గజెల్ జాతి అడవి జంతువును సూచిస్తుంది. సాధారణ తెలుగు పాఠకుడికి సులభంగా అర్థమయ్యే ‘దుప్పి’ని ఎంచుకున్నాం; పోలిక తినే విధానానికి సంబంధించినదని వాక్యనిర్మాణంలో స్పష్టం చేశాం.
- source_word: וְכָאַיָּל
  choice: జింకను తినే విధంగా
  rationale: אַיָּל జింకను, కొన్నిసార్లు మగ జింకను సూచిస్తుంది. ఆధునిక సాధారణ పదమైన ‘జింక’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అపవిత్రుడు’ మరియు ‘పవిత్రుడు’ అనే పదాల పరిధి
  choice: వాటిని ఆచారపరమైన స్థితులుగా అర్థం వచ్చేలా ప్రధాన పాఠం, పాదసూచికలో స్పష్టం చేయడం
  alternative: ఎలాంటి వివరణ లేకుండా ‘అపవిత్రుడు, పవిత్రుడు’ అని మాత్రమే అనువదించడం
  rationale: మూల సందర్భం ఆచార సంబంధమైన శుద్ధి-అశుద్ధతను సూచిస్తుంది; నైతిక మంచితనం లేదా చెడుతనంగా అపార్థం కాకుండా చేయాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ ‘ద్వారాలు’ అనే నుడికారాన్ని ప్రధాన పాఠంలో సహజమైన ‘పట్టణాలు’గా ఇచ్చి, మూలచిత్రాన్ని పాదసూచికలో నిలిపాం. పోలిక జంతువుల మాంసాన్ని తినే విధానానికి సంబంధించినదని తెలుగులో సందిగ్ధత లేకుండా వాక్యాన్ని నిర్మించాం.
