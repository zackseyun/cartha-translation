revisions:
- from: నీ పట్టణాల్లోనే[a] దాన్ని తినవచ్చు. ఆచారపరంగా అపవిత్రుడైనవాడూ పవిత్రుడైనవాడూ ఇద్దరూ[b] దుప్పిని, జింకను తినే విధంగా దాన్ని తినవచ్చు.
  to: నీ పట్టణాల్లో దానిని తినవచ్చు. ఆచారపరంగా అపవిత్రుడైనవాడూ ఆచారపరంగా శుద్ధుడైనవాడూ ఇద్దరూ[b] లేడి, జింకలను తిన్నట్లే దానిని తినవచ్చు.
  rationale: ‘నే’ తొలగించి మూలంలోని నిర్బంధం లేని స్థానసూచనను నిలిపాం. ఆచార సంబంధమైన శుద్ధస్థితిని ‘పవిత్రుడు’ కాక ‘శుద్ధుడు’గా అనువదించాం. జంతువుల పోలికను సహజ తెలుగు నిర్మాణంలో ఇచ్చాం. పాదసూచిక a మూల నుడికారాన్ని వివరించేందుకు ఉంచబడింది, కాని ప్రధాన పాఠంలో దానికి గుర్తు లేకపోవడం వల్ల అది అనాథ పాదసూచిక అవుతుంది; అందువల్ల ప్రధాన పాఠంలో [a] గుర్తును కూడా చేర్చాలి.
