  to: నీవు అతన్ని నీ వద్దనుండి స్వేచ్ఛగా పంపివేసేటప్పుడు అది నీకు భారంగా అనిపించకూడదు. ఎందుకంటే కూలివాని జీతానికి రెండింతల మేర అతడు ఆరు సంవత్సరాలు నీకు సేవ చేశాడు.[a] నీ దేవుడైన యాహ్వే నీవు చేసే ప్రతిదానిలో నిన్ను ఆశీర్వదిస్తాడు.
