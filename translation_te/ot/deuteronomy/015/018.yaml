source:
  edition: WLC
  text: לֹא יִקְשֶׁ֣ה בְ/עֵינֶ֗/ךָ בְּ/שַׁלֵּֽחֲ/ךָ֙ אֹת֤/וֹ חָפְשִׁי֙ מֵֽ/עִמָּ֔/ךְ כִּ֗י מִשְׁנֶה֙ שְׂכַ֣ר שָׂכִ֔יר עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: te
  text: నీవు అతన్ని నీ వద్దనుండి స్వేచ్ఛగా పంపివేసేటప్పుడు అది నీకు భారంగా అనిపించకూడదు. ఎందుకంటే కూలివాని జీతానికి రెండింతల మేర అతడు ఆరు సంవత్సరాలు నీకు సేవ చేశాడు.[a] నీ దేవుడైన యాహ్వే నీవు చేసే ప్రతిదానిలో నిన్ను ఆశీర్వదిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కూలివానికి ఇచ్చే జీతం కంటే రెండింతల విలువైన సేవను అతడు చేశాడు.” హెబ్రీ పదబంధం అతని ఆరు సంవత్సరాల సేవను కూలివాని జీతంతో పోలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: అది నీకు భారంగా అనిపించకూడదు
  rationale: ‘నీ కళ్లలో కఠినంగా ఉండకూడదు’ అనే హెబ్రీ నుడికారానికి సహజమైన తెలుగు రూపం. విడుదలను నష్టంగా లేదా బాధాకరంగా భావించవద్దనే మూల భావాన్ని ఇది నిలుపుతుంది.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: నీవు అతణ్ణి నీ దగ్గర నుంచి స్వతంత్రునిగా పంపివేసేటప్పుడు
  rationale: కాలసూచక నిర్మాణాన్ని ‘పంపివేసేటప్పుడు’ అని, חָפְשִׁי యొక్క చట్టపరమైన స్వేచ్ఛ భావాన్ని ‘స్వతంత్రునిగా’ అని అనువదించింది. מֵעִמָּךְ‌ను అతిగా వివరించకుండా ‘నీ దగ్గర నుంచి’గా ఉంచింది.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: కూలివాని జీతానికి రెండింతల మేరకు
  rationale: מִשְׁנֶהలోని ‘రెట్టింపు’ భావాన్నీ, שְׂכַר שָׂכִירలోని కూలికి చెల్లించే జీతాన్నీ నేరుగా తెలియజేస్తుంది. పోలిక సేవ విలువను సూచించే అవకాశాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: ఆరు సంవత్సరాలు నీకు సేవ చేశాడు
  rationale: ఈ రూపం క్రియాత్మకంగా ‘నీకు సేవ చేశాడు’ అని అర్థమిస్తుంది. బానిసత్వ స్థితిని ఈ వాక్యంలో అదనంగా చొప్పించకుండా, సేవా కాలమైన ఆరు సంవత్సరాలను స్పష్టంగా ఉంచింది.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే నిన్ను ఆశీర్వదిస్తాడు
  rationale: దైవనామం יְהוָה‌ను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది; క్రియా సందర్భానుసారంగా భవిష్యత్ వాగ్దానాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: నీవు చేసే ప్రతిదానిలో
  rationale: వ్యక్తి చేసే పనులు, చేపట్టే కార్యాలు అన్నిటినీ కలుపుకొనే మూలంలోని విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో నిలిపింది.
- issue: עבד సందర్భంలో బానిస స్థితిని ఈ వాక్యంలో ప్రత్యక్షంగా పేర్కొనాలా
  choice: నీకు సేవ చేశాడు
  alternative: నీ బానిసగా సేవ చేశాడు; నీ దాసుడు సేవ చేశాడు
  rationale: ఇక్కడి పదరూపం క్రియాత్మకంగా సేవ చేయడాన్ని ముందుకు తెస్తుంది; బంధిత సేవ స్థితి పరిసర ధర్మశాసన సందర్భంలో స్పష్టమవుతుంది. అందువల్ల మూలానికి మించిన సామాజిక గుర్తింపును ఈ ఉపవాక్యంలో చేర్చలేదు.
- issue: מִשְׁנֶה שְׂכַר שָׂכִיר పోలిక యొక్క అర్థం
  choice: కూలివాని జీతానికి రెండింతల మేరకు
  alternative: కూలివాని జీతానికి రెండింతల విలువైన సేవ
  rationale: హెబ్రీ నిర్మాణం రెట్టింపు జీతం/విలువ పోలికను ఇస్తుంది గాని దాని ఖచ్చిత ఆర్థిక విధానాన్ని పూర్తిగా వివరించదు. ప్రధాన పాఠం సంక్షిప్త రూపాన్ని నిలుపగా, విలువ ఆధారిత భావాన్ని పాదటిప్పణిలో చూపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ఏకవచన సంబోధనను ‘నీవు/నీకు’తో నిలిపి, చట్టపరమైన విడుదల భావానికి ‘స్వతంత్రునిగా’ ఉపయోగించబడింది.
