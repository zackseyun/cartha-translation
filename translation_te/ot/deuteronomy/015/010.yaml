id: DEU.15.10
reference: Deuteronomy 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: te
  text: నీవు అతనికి తప్పక ఇవ్వాలి. అతనికి ఇచ్చేటప్పుడు నీ హృదయంలో అయిష్టం కలగకూడదు[a]. ఎందుకంటే ఈ విషయం కారణంగా నీ దేవుడైన యాహ్వే[b] నీ పనులన్నిటిలోనూ, నీ చెయ్యి వేసే ప్రతి పనిలోనూ[c] నిన్ను ఆశీర్వదిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ హృదయం బాధపడకూడదు,” లేదా “నీవు అయిష్టపడకూడదు.” హీబ్రూ పదబంధం ఇచ్చేటప్పుడు కలిగే బాధ, విముఖత లేదా అసంతృప్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే” అనేది יהוה (YHWH) అనే హీబ్రూ దైవనామానికి లిప్యంతరీకరణ. కొన్ని అనువాదాలు దీనిని “ప్రభువు” అని అందిస్తాయి.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, “నీ చేతి ప్రతి విస్తరణలో”; అంటే, నీవు చేపట్టే ప్రతి పనిలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: తప్పక ఇవ్వాలి
  rationale: క్రియావిశేషక ధాతురూపం మరియు అసంపూర్ణ క్రియ కలయిక ఆజ్ఞను బలపరుస్తుంది. ‘తప్పక ఇవ్వాలి’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని ‘ఉదారంగా’ అనే భావాన్ని చేర్చదు.
- source_word: לּוֹ
  choice: అతనికి
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందరి సందర్భంలోని అవసరంలో ఉన్న తోటి ఇశ్రాయేలీయుణ్ణి సూచిస్తుంది.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: నీ హృదయం అయిష్టంగా ఉండకూడదు
  rationale: ఇచ్చేటప్పుడు కలిగే అంతరంగ విముఖతను ఇది వ్యక్తం చేస్తుంది. ‘హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, కేవలం దుఃఖాన్ని సూచించే అనువాదాన్ని నివారిస్తుంది.
- source_word: בְּתִתְּךָ לוֹ
  choice: అతనికి ఇచ్చేటప్పుడు
  rationale: בְּ తో కూడిన క్రియానామ రూపం ఇక్కడ కాలసంబంధమైన లేదా సందర్భసంబంధమైన అర్థాన్ని ఇస్తుంది.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: ఎందుకంటే ఈ విషయం కారణంగా
  rationale: בגלל కారణాన్ని సూచిస్తుంది; דבר యొక్క ‘విషయం/కార్యం’ అనే విస్తృత భావాన్ని నిలుపుతుంది. ఇది ఆజ్ఞకు లోబడి ఇవ్వడాన్ని వెనక్కి సూచిస్తుంది.
- source_word: יְבָרֶכְךָ
  choice: నిన్ను ఆశీర్వదిస్తాడు
  rationale: ברך కు సాధారణమైన ‘ఆశీర్వదించు’ అనే అర్థాన్ని అదనపు వివరణ లేకుండా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: దైవనామంతో కలిసిన నిబంధనాత్మక సంబోధనను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: నీ పనులన్నిటిలోనూ
  rationale: מעשה ఒక వ్యక్తి చేసే పని లేదా కార్యాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: నీ చెయ్యి చేపట్టే ప్రతిదానిలోనూ
  rationale: ‘చెయ్యి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, ఒక వ్యక్తి చేపట్టే ప్రతి కార్యం అనే నుడికారార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: సహాయం పొందే వ్యక్తిని సూచించే ఏకవచన పుంలింగ ప్రత్యయం
  choice: అతనికి
  alternative: ఆ వ్యక్తికి
  rationale: హీబ్రూ రూపం పుంలింగ ఏకవచనంలో ఉంది; సమీప సందర్భంలోని అవసరంలో ఉన్న సహోదరుణ్ణి సూచిస్తుంది.
- issue: ఆశీర్వాదం మరియు ఇవ్వడం మధ్య కారణసంబంధం
  choice: ఈ విషయం కారణంగా
  alternative: ఈ కారణంగా
  rationale: בגלל הַדָּבָר הַזֶּה లోని కారణసంబంధాన్ని, అలాగే דבר అనే నామవాచకాన్ని స్పష్టంగా నిలుపుతుంది; ఆశీర్వాద స్వభావంపై మూలం చెప్పనిదేమీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ఏకవచన సంబోధనను నిలిపి, ‘హృదయం’ మరియు ‘చెయ్యి’ అనే మూల రూపకాలను సాధ్యమైనంతవరకు సంరక్షించాం. ‘తప్పక’ ఆజ్ఞలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
