source:
  edition: WLC
  text: רַ֥ק אֶת דָּמ֖/וֹ לֹ֣א תֹאכֵ֑ל עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: te
  text: కేవలం దాని రక్తాన్ని తినకూడదు; దాన్ని నీటిలా నేలమీద పోయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి అనుమతికి పరిమితి విధించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת דָּמוֹ
  choice: దాని రక్తాన్ని
  rationale: జంతువుకు సంబంధించిన రక్తాన్ని నేరుగా సూచిస్తుంది; ‘ప్రాణరక్తం’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: לֹא תֹאכֵל
  choice: తినకూడదు
  rationale: న్యాయనియమంలోని నిషేధాన్ని స్పష్టంగా, సహజమైన తెలుగు శైలిలో వ్యక్తం చేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: నేలమీద
  rationale: ఈ సందర్భంలో రక్తాన్ని భూమి లేదా మట్టిపై పోయడమనే స్పష్టమైన అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: దాన్ని … కుమ్మరించాలి
  rationale: రక్తాన్ని బయటకు పోయాలనే ఆజ్ఞను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כַּמָּיִם
  choice: నీళ్లలాగా
  rationale: హీబ్రూ ఉపమానాన్ని యథాతథంగా, సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఆహార నియమంలో రక్తం పట్ల వ్యవహారం
  choice: జంతువు రక్తాన్ని తినకుండా నేలమీద కుమ్మరించాలనే ఆజ్ఞగా సూటిగా అనువదించడం
  alternative: రక్తం-ప్రాణం సంబంధాన్ని ముందుకు తెచ్చేందుకు ‘ప్రాణరక్తం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ వచనం రక్తాన్ని తినకూడదని, దాన్ని నేలమీద కుమ్మరించాలని మాత్రమే ఆజ్ఞాపిస్తుంది; విస్తృత పంచగ్రంథ నేపథ్యంలోని వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో రూపొందించబడింది.
