review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition against consuming the animal's blood and the instruction to pour it on the ground like water. However, అయితే primarily functions as an adversative ('however/but'), whereas רַק here marks the restrictive exception ('only').
  naturalness: The sentence is understandable modern Telugu, but నీళ్లలాగా and కుమ్మరించాలి are somewhat colloquial or stronger in nuance than needed for this legal instruction. నీటిలా and పోయాలి are natural, neutral modern-standard choices.
  terminology: దాని రక్తాన్ని correctly renders the referential Hebrew suffix without adding the interpretive term 'lifeblood.' నేలమీద correctly represents the concrete sense of 'on the ground.'
  issues:
  - severity: medium
    issue: రַק is rendered అయితే.
    rationale: అయితే normally means 'however/then,' but the Hebrew introduces a restriction or exception. కేవలం ('only') preserves that limiting force.
  - severity: low
    issue: నీళ్లలాగా ... కుమ్మరించాలి is less neutral than the source's wording.
    rationale: నీటిలా is more suitable for modern standard written Telugu, and పోయాలి renders 'pour it out' without the potentially forceful/colloquial implication of కుమ్మరించాలి.
  revised_text: కేవలం దాని రక్తాన్ని తినకూడదు; దాన్ని నీటిలా నేలమీద పోయాలి.
  revised_footnotes: []
  revision_rationale: The revision changes the opening to కేవలం to preserve the restrictive force of רַק, while retaining the direct reference to the animal's blood. It uses neutral modern-standard Telugu for the simile and the command to pour out the blood, without adding theological explanation.
