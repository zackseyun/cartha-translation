id: DEU.15.15
reference: Deuteronomy 15:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: te
  text: నీవు ఐగుప్తు దేశంలో బానిసగా ఉన్నావని, నీ దేవుడైన యెహోవా నిన్ను విమోచించాడని జ్ఞాపకం ఉంచుకో. అందుచేత నేను నీకు ఈ విషయాన్ని నేడు ఆజ్ఞాపిస్తున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: జ్ఞాపకం చేసుకోవాలి
  rationale: న్యాయబోధ సందర్భంలో ఈ రూపం ఆజ్ఞాత్మక భావాన్ని కలిగిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఆ బాధ్యతను వ్యక్తం చేస్తుంది.
- source_word: עֶבֶד
  choice: బానిసగా
  rationale: ఐగుప్తులోని అణచివేతతో కూడిన దాస్యస్థితిని ‘సేవకుడు’ కంటే ‘బానిస’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: ‘ఐగుప్తు దేశం’ అనే మూలంలోని నిర్దిష్ట చారిత్రక పదబంధాన్ని నిలుపుతుంది.
- source_word: וַיִּפְדְּךָ
  choice: నిన్ను విమోచించాడు
  rationale: బానిసత్వం నుంచి విడిపించడం లేదా వెల చెల్లించి విడిపించడం అనే פדה భావాన్ని, సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని నేరుగా, సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: עַל כֵּן
  choice: అందుచేతనే
  rationale: గత విమోచనకు ప్రస్తుత ఆజ్ఞకు మధ్య ఉన్న స్పష్టమైన కారణసంబంధాన్ని తెలియజేస్తుంది.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: నేను నీకు ... ఆజ్ఞ ఇస్తున్నాను
  rationale: స్పష్టమైన ‘నేను’తో కూడిన వర్తమాన ఆజ్ఞాపన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ఈ ఆజ్ఞ
  rationale: దָּבָר పదం విస్తృతార్థకమైనదైనా, ఈ నియమబోధ సందర్భంలో అది ఇవ్వబడుతున్న నిర్దేశాన్ని సూచిస్తుంది; ‘ఈ విషయం’ కంటే ‘ఈ ఆజ్ఞ’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: మూలంలోని కాలసూచక తక్షణత్వాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో పరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: ఐగుప్తులో עֶבֶד అనే సామాజిక స్థితి
  choice: బానిస
  alternative: సేవకుడు
  rationale: ఈ వాక్యం అణచివేతతో కూడిన ఐగుప్తు దాస్యాన్ని జ్ఞాపకం చేస్తుంది; అందువల్ల ‘బానిస’ చారిత్రక, నైతిక బలాన్ని మెరుగ్గా నిలుపుతుంది.
- issue: פדה యొక్క విమోచన భావం
  choice: విమోచించాడు
  alternative: వెల చెల్లించి విడిపించాడు
  rationale: క్రియలో విమోచించడం లేదా వెల చెల్లించి విడిపించడం అనే భావపరిధి ఉంది. అయితే ఈ వాక్యం చెల్లించిన వెలను స్పష్టంగా పేర్కొనదు కాబట్టి, దానిని పాఠ్యంలో చేర్చకుండా విస్తృతమైన ‘విమోచించాడు’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. సంబోధన అంతటా హీబ్రూ మూలంలోని రెండవ పురుష ఏకవచనాన్ని ‘నీవు/నీ/నిన్ను/నీకు’ రూపాల్లో కాపాడింది.
