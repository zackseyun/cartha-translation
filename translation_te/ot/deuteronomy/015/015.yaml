  source_fidelity: మొదటి వాక్యంలోని అర్థం మూలానికి నమ్మకంగా ఉంది; అయితే וְזָכַרְתָּ యొక్క నేర ఆజ్ఞాత్మక సంబోధనను ‘జ్ఞాపకం చేసుకోవాలి’ కంటే ‘జ్ఞాపకం ఉంచుకో’ మరింత స్పష్టంగా నిలుపుతుంది. אֶת־הַדָּבָר הַזֶּה విస్తృతమైన ‘ఈ విషయం/మాట’ అనే అర్థాన్ని కలిగి ఉంది; ‘ఈ ఆజ్ఞ’ సందర్భానుకూలమైనప్పటికీ మూలపదాన్ని కొంత సంకుచితం చేస్తుంది.
