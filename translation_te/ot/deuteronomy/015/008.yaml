translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. ‘నీ చెయ్యి తెరవడం’ అనే మూలభాషా రూపకం నిలుపబడింది. అప్పుగా ఇవ్వాలనే నిర్దిష్ట భావాన్ని దాతృత్వంగా ఇవ్వడం అనే సాధారణీకరణతో భర్తీ చేయలేదు; రెండు హీబ్రూ బలప్రయోగాలను ‘తప్పకుండా’ ద్వారా ప్రతిబింబించి, వాటి వివరణను పాదటిప్పణిలో ఇచ్చాం.
