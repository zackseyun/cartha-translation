review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the adversative force in context, the open-hand metaphor, the obligation to lend, and the requirement that the loan be sufficient for the person's lack. Both emphatic Hebrew infinitive-absolute constructions are represented. A minor adjustment makes the recipient relation and the final sufficiency clause more direct.
  naturalness: ‘నీ చెయ్యి తప్పకుండా తెరిచి’ is syntactically incomplete/less natural in this sentence, and ‘అతనికి ఏది కొదువగా ఉందో ఆ అవసరానికి సరిపడా’ is cumbersome. ‘నీ చెయ్యిని … విప్పాలి’ and ‘ఏ కొరత ఉందో, దానికి సరిపడేంత’ are fluent modern standard Telugu while retaining the image and scope.
  terminology: ‘అప్పుగా ఇవ్వాలి’ accurately renders the lending verb and should be retained. ‘కొరత’ naturally renders the person's lack/need. The footnote accurately identifies the Hebrew emphatic repetition.
  issues:
  - severity: medium
    issue: The open-hand phrase is grammatically and idiomatically weak.
    rationale: In Telugu, ‘నీ చెయ్యి ... తెరిచి’ does not clearly govern the following clause. Using the accusative object with ‘విప్పాలి’ gives a complete, natural expression without altering the Hebrew metaphor.
  - severity: low
    issue: The final phrase is unnecessarily heavy and repeats the recipient awkwardly.
    rationale: The Hebrew expresses a sufficiency corresponding to whatever lack the person has. ‘అతనికి ఏ కొరత ఉందో, దానికి సరిపడేంత’ conveys this relation clearly and naturally.
